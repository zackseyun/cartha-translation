id: JHN.15.20
reference: John 15:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: yo
  text: Ẹ rántí ọ̀rọ̀ tí mo sọ fún yín náà pé, ‘Ẹrú[a] kò tóbi ju olúwa rẹ̀ lọ.’ Bí wọ́n bá ti ṣe inúnibíni sí mi, wọn yóò ṣe inúnibíni sí yín pẹ̀lú; bí wọ́n bá ti pa ọ̀rọ̀ mi mọ́[b], wọn yóò pa ọ̀rọ̀ yín mọ́ pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí ‘ìránṣẹ́.’ Ọ̀rọ̀ Gíríìkì δοῦλος lè túmọ̀ sí ẹrú tàbí ìránṣẹ́ gẹ́gẹ́ bí àyíká ọ̀rọ̀; ‘ẹrú’ ni a lò níbí nítorí ìfiwéra rẹ̀ pẹ̀lú olúwa ń tẹnumọ́ ipò ẹni tó wà lábẹ́ àṣẹ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí ‘gbọ́ràn sí ọ̀rọ̀ mi.’ Nínú ìwé Jòhánù, ‘pa ọ̀rọ̀ mọ́’ lè ní gbígba ọ̀rọ̀ Jésù àti gbígbé ní ìgbọ́ràn sí i nínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Ẹ rántí
  rationale: Ó jẹ́ àṣẹ ní àkókò ìsinsìnyí, ó sì ń ké sí wọn láti máa rántí ọ̀rọ̀ náà. ‘Ẹ rántí’ jẹ́ Yorùbá àdánidá tó pa agbára àṣẹ náà mọ́.
- source_word: λόγου
  choice: ọ̀rọ̀
  rationale: Níbí, λόγος tọ́ka sí ọ̀rọ̀ pàtó tí Jésù ti sọ tẹ́lẹ̀. ‘Ọ̀rọ̀’ tún jẹ́ kí ìbámu pẹ̀lú ‘ọ̀rọ̀ mi ... ọ̀rọ̀ tiyín’ dúró.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ìfiwéra pẹ̀lú κύριος tẹnumọ́ ipò ẹni tó wà lábẹ́ àṣẹ àti ìní olúwa; ‘ẹrú’ mú agbára ìtumọ̀ yìí jáde ju ‘ìránṣẹ́’ lọ.
- source_word: μείζων
  choice: tóbi ju
  rationale: Ó pa ìfiwéra tó gbòòrò nípa ipò àti ọlá mọ́ láì dín in kù sí ‘ṣe pàtàkì ju’ nìkan.
- source_word: κυρίου
  choice: olúwa
  rationale: Nínú àpólà ẹrú àti olúwa, ‘olúwa’ túmọ̀ sí ẹni tó ní àṣẹ lórí ẹrú, kì í ṣe dandan akọ́lé Ọlọ́run níbí.
- source_word: ἐδίωξαν / διώξουσιν
  choice: ṣe inúnibíni sí / yóò ṣe inúnibíni sí
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti ìtakò àti ìpọ́njú sí Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀; ‘ṣe inúnibíni sí’ ṣe àfihàn rẹ̀ ní kedere.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: pa ... mọ́ / yóò pa ... mọ́
  rationale: ‘Pa ọ̀rọ̀ mọ́’ pa àfihàn Johannine ti τηρέω mọ́, ó sì lè ní ìtumọ̀ gbígba ọ̀rọ̀ náà àti ṣíṣe ìgbọ́ràn sí i.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: ọ̀rọ̀ mi ... ọ̀rọ̀ tiyín
  rationale: Ó pa ìfarajọ ọ̀rọ̀ Jésù àti ìkéde àwọn ọmọ-ẹ̀yìn rẹ̀ mọ́, ó sì tún ọrọ̀ náà sọ ní kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú ìfiwéra ipò
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ọ̀rọ̀ òwe náà dá lórí àìdọ́gba ipò ẹni tó wà ní ìdè lábẹ́ olúwa rẹ̀. ‘Ẹrú’ ni ó pa agbára ìbáṣepọ̀ yẹn mọ́ dáadáa jù.
- issue: Ìtumọ̀ κύριος ní ìbáṣepọ̀ pẹ̀lú δοῦλος
  choice: olúwa
  alternative: Olúwa; ọ̀gá
  rationale: Lẹ́sẹ̀kẹsẹ̀, κύριος jẹ́ olúwa ẹrú nínú ọ̀rọ̀ òwe, kì í ṣe akọ́lé Kristi ní pàtó. Lílò lẹ́tà kékeré àti àyíká ọ̀rọ̀ mú ìtumọ̀ náà hàn.
- issue: Ìwọ̀n ìtumọ̀ τηρέω nípa ọ̀rọ̀ Jésù
  choice: pa ọ̀rọ̀ mọ́
  alternative: gbọ́ràn sí ọ̀rọ̀
  rationale: ‘Pa ọ̀rọ̀ mọ́’ kò fi dandan yan ìgbọ́ràn nìkan; ó gba ìtẹ́wọ́gbà, pípa sí ọkàn, àti gbígbé ní ìbámu pẹ̀lú ọ̀rọ̀ náà láyè.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún, ní ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘inúnibíni’ gẹ́gẹ́ bí ọ̀rọ̀ ìjọsìn tó wọ́pọ̀, a sì tún un sọ láti jẹ́ kí ìbámu gbolohun Gíríìkì hàn kedere.
