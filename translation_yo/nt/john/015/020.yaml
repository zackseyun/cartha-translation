    rationale: Ní Yorùbá boṣewa, aṣàfihàn ohun-ìní tó tẹ̀lé orúkọ níbí ni ‘ọ̀rọ̀ yín,’ kì í ṣe ‘ọ̀rọ̀ tiyín.’ ‘Ti yín’ máa ń ṣiṣẹ́ dáadáa níbi tí ó bá dúró ní òmìnira, kì í ṣe gẹ́gẹ́ bí àfikún taara sí ‘ọ̀rọ̀.’
  - severity: low
    issue: Àfihàn ìṣe tí ó ti ṣẹlẹ̀ nínú àwọn gbolohun ‘bí’ méjèèjì
