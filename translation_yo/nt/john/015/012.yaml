- from: 'Èyí ni àṣẹ mi: kí ẹ nífẹ̀ẹ́ sí ara yín gẹ́gẹ́ bí mo ti nífẹ̀ẹ́ yín.[a]'
  to: 'Èyí ni àṣẹ mi: kí ẹ fẹ́ràn ara yín gẹ́gẹ́ bí mo ti fẹ́ràn yín.[a]'
  rationale: The revision replaces the elliptical expression “nífẹ̀ẹ́ sí” with the idiomatic Yorùbá verb “fẹ́ràn.” It also keeps the comparison and the prior action expressed by the Greek aorist in natural Yorùbá. The footnote remains a valid stylistic alternative for the comparative expression.
