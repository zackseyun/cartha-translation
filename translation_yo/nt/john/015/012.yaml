base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: yo
  text: 'Èyí ni àṣẹ mi: kí ẹ fẹ́ràn ara yín gẹ́gẹ́ bí mo ti fẹ́ràn yín.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Èyí ni àṣẹ mi: kí ẹ fẹ́ràn ara yín bí mo ṣe fẹ́ràn yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὕτη ἐστὶν
  choice: Èyí ni
  rationale: Ọ̀nà Yorùbá àdánidá ni láti fi ọ̀rọ̀ atọ́ka náà dá àṣẹ pàtó yìí mọ̀.
- source_word: ἐντολὴ ἡ ἐμὴ
  choice: àṣẹ mi
  rationale: “Àṣẹ” mú agbára ọ̀rọ̀ Jesu jáde ní èdè Yorùbá òde òní, “mi” sì fi hàn pé ọ̀dọ̀ rẹ̀ ni àṣẹ náà ti wá.
- source_word: ἵνα
  choice: kí
  rationale: Níbí, ἵνα ń ṣàlàyé ohun tí àṣẹ náà ní nínú; “kí” ni ọ̀nà Yorùbá tó ṣe déédéé jù fún èyí.
- source_word: ἀγαπᾶτε
  choice: ẹ nífẹ̀ẹ́ sí
  rationale: Ó túmọ̀ ìfẹ́ gẹ́gẹ́ bí ìwà tí a pàṣẹ fún wọn láti máa hù, láìfi ìtumọ̀ aspect kún un ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Ìtumọ̀ àdánidá fún reciprocal plural ni Yorùbá; ó túmọ̀ sí pé kí wọ́n nífẹ̀ẹ́ sí ara wọn lẹ́nì kìíní-kejì.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó pa ìfiwéra mọ́, níbi tí ìfẹ́ Jesu ti jẹ́ àpẹẹrẹ àti òṣùwọ̀n ìfẹ́ àwọn ọmọ-ẹ̀yìn.
- source_word: ἠγάπησα ὑμᾶς
  choice: mo ti nífẹ̀ẹ́ yín
  rationale: “Ti” ń tọ́ka sí ìfẹ́ Jesu tí ó ti fi hàn sí wọn, tí ó sì ṣì ní ìbáṣepọ̀ pẹ̀lú àṣẹ tó ń fún wọn.
theological_decisions:
- issue: Ìtumọ̀ ἀγαπάω
  choice: nífẹ̀ẹ́ sí
  alternative: fẹ́ràn
  rationale: “Nífẹ̀ẹ́ sí” bá register mímọ́, ọ̀wọ̀, àti ìtẹ̀síwájú ọ̀rọ̀ ìfẹ́ nínú apá yìí mu; kò sì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún ọ̀rọ̀ náà.
- issue: Agbára àṣẹ Jesu
  choice: Èyí ni àṣẹ mi
  alternative: Èyí ni òfin mi
  rationale: “Àṣẹ” pa agbára ἐντολή mọ́ ní èdè Yorùbá tó ṣe kedere, láìsọ ọ́ di òfin àjọ tàbí láti fa ìtumọ̀ ẹ̀kọ́ mìíràn wọlé.
- issue: Ìfiwéra καθὼς
  choice: gẹ́gẹ́ bí mo ti nífẹ̀ẹ́ yín
  alternative: bí mo ti nífẹ̀ẹ́ yín
  rationale: “Gẹ́gẹ́ bí” tẹnu mọ́ pé ìfẹ́ Jesu ni àpẹẹrẹ wọn, ṣùgbọ́n kò pinnu bóyá καθὼς túmọ̀ sí àpẹẹrẹ nìkan tàbí òṣùwọ̀n pẹ̀lú.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó mọ́gbọ́n dání, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” àti “yín” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμᾶς ṣe béèrè; àmì ohùn ni a fi sí ibi tí ó yẹ.
