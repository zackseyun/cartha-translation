id: JHN.15.2
reference: John 15:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: yo
  text: Gbogbo ẹ̀ka tí ó wà nínú mi tí kò so èso ni ó mú kúrò[a]; gbogbo ẹ̀ka tí ó sì so èso ni ó ń rẹ́[b], kí ó lè so èso púpọ̀ sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó yọ ọ́ kúrò”; àwọn kan lóye αἴρει níhìn-ín sí “ó gbé e sókè.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀-ìṣe tí a tú sí “rẹ́” tún lè túmọ̀ sí “sọ di mímọ́” tàbí “wẹ̀ mọ́.” Ìtumọ̀ gígé ẹ̀ka bá àwòrán ọgbà àjàrà mu, ó sì ṣáájú ọ̀rọ̀ nípa jíjẹ́ “mímọ́” nínú ẹsẹ tó tẹ̀ lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: Gbogbo ẹ̀ka
  rationale: πᾶν pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ kan ní ìtumọ̀ pínpín, ìyẹn ẹ̀ka kọ̀ọ̀kan; “gbogbo ẹ̀ka” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐν ἐμοὶ
  choice: tí ó wà nínú mi
  rationale: Ó pa èdè pàtàkì ti Jòhánù mọ́ láì fi àlàyé bí “tí ó so mọ́ mi” kún un.
- source_word: μὴ φέρον καρπὸν
  choice: tí kò so èso
  rationale: “So èso” ni gbólóhùn Yorùbá àdánidá fún ohun ọ̀gbìn tí ń mú èso jáde, ó sì mú ìṣe tí ń tẹ̀ síwájú inú participle náà hàn.
- source_word: αἴρει
  choice: mú kúrò
  rationale: Nínú àwòrán ọgbà àjàrà yìí, ọ̀rọ̀ náà dára jù lọ gẹ́gẹ́ bí yíyọ ẹ̀ka aláìléso kúrò; ìtumọ̀ mìíràn ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: καρπός
  choice: èso
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó yẹ, tó sì wọ́pọ̀ fún èso nínú àwòrán ọ̀gbìn.
- source_word: καθαίρει
  choice: rẹ́
  rationale: “Rẹ́” sọ ìṣe gígé tàbí ṣíṣe ẹ̀ka igi kí ó lè so èso sí i ní kíkún; àlàyé ìsàlẹ̀ pa ìtumọ̀ “wẹ̀ mọ́” àti ìsopọ̀ rẹ̀ mọ́ ẹsẹ tó tẹ̀ lé mọ́.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: kí ó lè so èso púpọ̀ sí i
  rationale: “Kí ó lè” fi ète ἵνα hàn, “púpọ̀ sí i” sì pa ìfiwéra πλείονα mọ́.
- source_word: αὐτό / αὐτὸ
  choice: ó
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ẹ̀ka; ìṣètò gbólóhùn Yorùbá jẹ́ kí “ó” tọ́ka sí i lọ́nà àdánidá.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: gbogbo ẹ̀ka tí ó bá sì so èso
  rationale: A tún “ẹ̀ka” sọ nítorí article àti participle Gíríìkì náà ń tọ́ka padà sí κλῆμα; “sì” pa ìfíwéra àwọn ìṣe méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ αἴρει nínú apá àkọ́kọ́
  choice: ó mú kúrò
  alternative: ó gbé sókè
  rationale: Àyíká ọ̀rọ̀ náà fi ìṣe olùtọ́jú àjàrà sí ẹ̀ka aláìléso wé ìrẹ́ ẹ̀ka eléso. “Mú kúrò” pa ìyàtọ̀ yẹn mọ́ láì pinnu ẹ̀kọ́ ìjọ kan nípa ìṣubú kúrò nínú ìgbàgbọ́ tàbí ìfaradà. Nítorí “gbé sókè” tún ṣeé túmọ̀ sí ní àwọn àyíká kan, a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A lo “so èso” àti “rẹ́” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá nínú àwòrán iṣẹ́ àgbẹ̀, a sì pa “nínú mi” mọ́ nítorí ìjẹ́pàtàkì rẹ̀ nínú ìròyìn Jòhánù.
