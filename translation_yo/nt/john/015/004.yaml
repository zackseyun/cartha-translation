id: JHN.15.4
reference: John 15:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: yo
  text: Ẹ máa wà nínú mi[a], èmi sì nínú yín. Gẹ́gẹ́ bí ẹ̀ka kò lè so èso fúnra rẹ̀ bí kò bá wà lára igi àjàrà, bẹ́ẹ̀ náà ni ẹ̀yin kò lè so èso bí ẹ kò bá wà nínú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Ẹ dúró nínú mi, èmi sì nínú yín.” Ọ̀rọ̀ Gíríìkì μένω lè túmọ̀ sí láti dúró, láti máa wà, tàbí láti máa gbé níbì kan; níhìn-ín ó tẹnu mọ́ ìbáṣepọ̀ tí ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: máa wà / máa wà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí wíwà tí ń bá a lọ àti ìdúró nínú ìbáṣepọ̀. “Máa wà” jẹ́ Yorùbá òde òní tó ṣe kedere, ó sì lè ṣiṣẹ́ fún àwòrán ìṣọ̀kan pẹ̀lú Jésù àti fún ẹ̀ka tó wà lára igi àjàrà.
- source_word: ἐν ἐμοί
  choice: nínú mi
  rationale: “Nínú mi” pa àwòrán ìṣọ̀kan àti ìkópa mọ́; “pẹ̀lú mi” yóò dín un kù sí jíjẹ́ alábàákẹ́gbẹ́ nìkan.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: èmi sì nínú yín
  rationale: A pa gbolohun aláìlọ́rọ̀-ìṣe Gíríìkì mọ́ ní ṣókí, láìfi “èmi yóò máa wà” kún un bí ìlérí tó ṣe kedere ju ohun tí orísun sọ lọ.
- source_word: τὸ κλῆμα
  choice: ẹ̀ka
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún ẹ̀ka igi nínú àkàwé àjàrà.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: kò lè so èso
  rationale: “Kò lè” fi àìlágbára tí δύναμαι sọ hàn, “so èso” sì jẹ́ ọ̀nà Yorùbá àdánidá fún èso tí igi tàbí ẹ̀ka ń mú jáde.
- source_word: ἀφ’ ἑαυτοῦ
  choice: fúnra rẹ̀
  rationale: Èyí sọ pé ẹ̀ka kò lè so èso láti agbára tirẹ̀ tàbí ní òmìnira kúrò lọ́dọ̀ àjàrà.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: lára igi àjàrà
  rationale: “Lára igi àjàrà” jẹ́ Yorùbá àdánidá fún ipò ẹ̀ka tí ó ṣì so mọ́ igi, láìsọ àlàyé ọ̀rọ̀ ìmọ̀-ọ̀gbìn gígùn sí i.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: bẹ́ẹ̀ náà ni ẹ̀yin kò lè so èso
  rationale: Yorùbá nílò kí ohun tí wọn kò lè ṣe hàn kedere; “so èso” ni a mú padà láti inú apá àkọ́kọ́, gẹ́gẹ́ bí Gíríìkì ṣe fi í sílẹ̀ lábẹ́ òye.
theological_decisions:
- issue: Ìtumọ̀ μένω nínú ọ̀rọ̀ jíjẹ́ ọmọ-ẹ̀yìn àti ìṣọ̀kan pẹ̀lú Jésù
  choice: Ẹ máa wà nínú mi
  alternative: Ẹ dúró nínú mi
  rationale: “Máa wà” tẹnu mọ́ ìbáṣepọ̀ tí ń bá a lọ, láìjẹ́ kí “dúró” dà bí dídúró ní ibi kan tàbí kí ó fi ìtumọ̀ ìforítì kan ṣoṣo lé e lórí. Àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀ nítorí pé ó tún lè túmọ̀ μένω dáadáa.
- issue: Gbolohun àfikún aláìlọ́rọ̀-ìṣe κἀγὼ ἐν ὑμῖν
  choice: èmi sì nínú yín
  alternative: èmi yóò sì máa wà nínú yín
  rationale: Yíyan gbolohun ṣókí náà pa àìsọ pàtó Gíríìkì mọ́, kò sì sọ ó di ìlérí ọjọ́ iwájú ní pàtó.
translation_notes:
  register: Yorùbá boṣewa, èdè òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “igi àjàrà” láti mú kí “àjàrà” gẹ́gẹ́ bí ohun ọ̀gbìn yà kedere sí “ẹ̀ka,” a sì lo “lára” ní apá àkàwé nítorí pé ó jẹ́ àdánidá ju “nínú igi” lọ ní Yorùbá.
