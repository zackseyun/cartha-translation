  source_fidelity: Ìtumọ̀ náà gbé ìfẹ̀kúnrẹ́rẹ́ ìfẹ̀sẹ̀mulẹ̀ ti μένω, ìfaradà nínú Kristi, gbolohun aláìlò-ọrọ̀-ìṣe náà (“èmi sì nínú yín”), àti àfiwéra ẹ̀ka àti igi àjàrà kalẹ̀ dáadáa. Ṣùgbọ́n “kò ti lè” fi ìtumọ̀ àkókò “kò tíì” kún οὐ δύναται, èyí tí kò sí nínú Gíríìkì. Nínú àwọn gbolohun ìdíwọ̀n náà, “bí kò bá wà”/“bí ẹ kò bá wà” mú ìtumọ̀ ἐὰν μὴ … μένῃ/μένητε jáde lọ́nà Yorùbá tó mọ́gbọ́n dání, láìfi ìtumọ̀ ìṣe-àṣà ọjọ́ iwájú tí “máa” lè gbé wọlé kún un.
