id: JHN.15.8
reference: John 15:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: yo
  text: 'Nínú èyí ni a ti yin Baba mi lógo: pé kí ẹ so èso púpọ̀, kí ẹ sì di ọmọ-ẹ̀yìn mi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nínú èyí
  rationale: Ó pa ìtọ́kasí Gíríìkì mọ́ láì fi tipátipá pinnu bóyá ó ń tọ́ka sí ohun tó ṣáájú tàbí gbólóhùn tó tẹ̀ lé e.
- source_word: ἐδοξάσθη
  choice: ni a ti yin ... lógo
  rationale: Ìṣe àìṣe ní aorist ni; ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì sọ pé Baba ni ó gba ògo.
- source_word: ἵνα
  choice: pé kí
  rationale: Ó lè fi àlàyé àti ète/h àbájáde hàn ní àyíká yìí, bí àmì oníṣàkóso méjì ṣe ń so gbólóhùn náà pọ̀.
- source_word: καρπὸν πολὺν φέρητε
  choice: kí ẹ máa so èso púpọ̀
  rationale: ‘So èso’ ni àkànlò èdè Yorùbá tó bá àwòrán àjàrà mu; ‘máa’ mú ìṣe tí ń bá a lọ hàn.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: kí ẹ sì di ọmọ-ẹ̀yìn mi
  rationale: γίνομαι túmọ̀ sí ‘di’; ἐμοὶ ni a fi hàn lọ́nà àdánidá pẹ̀lú ‘mi,’ μαθηταί sì ni ‘ọmọ-ẹ̀yìn.’
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín sísọ èso, jíjẹ́ ọmọ-ẹ̀yìn, àti fífi ògo fún Baba
  choice: pé kí ẹ máa so èso púpọ̀, kí ẹ sì di ọmọ-ẹ̀yìn mi
  alternative: nípa sísọ èso púpọ̀, ẹ ó sì fi ara yín hàn gẹ́gẹ́ bí ọmọ-ẹ̀yìn mi
  rationale: A tẹ̀ lé ẹ̀rí ọ̀rọ̀ SBLGNT, γένησθε (‘kí ẹ di’), a kò sì yí i sí ‘fi ara hàn’ tàbí sọ pé sísọ èso ló ń fi ẹ̀yìn-jíjẹ́ hàn.
- issue: Bí ἵνα ṣe ń ṣiṣẹ́
  choice: pé kí
  alternative: nípa èyí pé
  rationale: ‘Pé kí’ jẹ́ kí ìtumọ̀ ète tàbí àbájáde tí ἵνα lè ní dúró, láì dá a mọ́ ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. Àmì olójú méjì pa ìṣètò àti ìtẹnumọ́ orísun mọ́.
