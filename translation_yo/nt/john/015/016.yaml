id: JHN.15.16
reference: John 15:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: yo
  text: Kì í ṣe ẹ̀yin ni ẹ yàn mí, ṣùgbọ́n èmi ni mo yàn yín[a], mo sì fi yín sípò, kí ẹ lè lọ, kí ẹ sì so èso, kí èso yín lè dúró[b], kí Baba lè fún yín ní ohunkóhun tí ẹ bá béèrè lọ́wọ́ rẹ̀ ní orúkọ mi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yàn lọ́tọ̀.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ “yàn” tàbí “yàn lọ́tọ̀”; “yàn” bá àyíká yìí mu láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìmọ̀-ẹ̀sìn kan pàtó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wà nìṣó.” Jòhánù sábà máa ń lo ọ̀rọ̀ Gíríìkì yìí fún dídúró nínú ìbáṣepọ̀ tàbí fún ohun tí ó ń wà fún ìgbà pípẹ́.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà sọ “Baba,” kì í ṣe “Baba mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: yàn / yàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyan ẹnì kan lára àwọn mìíràn. “Yàn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, ó sì pa ìtakora tó wà láàárín “ẹ̀yin” àti “èmi” mọ́ láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
- source_word: ἔθηκα
  choice: fi yín sípò
  rationale: Bí ó tilẹ̀ jẹ́ pé τίθημι lè túmọ̀ sí “fi sí” tàbí “gbé sí,” níbí ó ń tọ́ka sí fífi àwọn ọmọ-ẹ̀yìn sípò fún ète kan. Gbólóhùn yìí fi ìránṣẹ́ tí Jésù gbé lé wọn lọ́wọ́ hàn láì dín in kù sí ìyàsímímọ́ sí ipò ìjọ kan.
- source_word: ἵνα
  choice: kí ... lè / kí
  rationale: Àwọn gbólóhùn méjèèjì fi ète hàn. “Kí ... lè” àti “kí” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ète tàbí àbájáde tí a ń retí hàn.
- source_word: ὑπάγητε
  choice: lọ
  rationale: “Lọ” pa ìtumọ̀ gbígbòòrò ọ̀rọ̀ Gíríìkì náà mọ́, ó sì lè gba ìtumọ̀ lílọ sí iṣẹ́ tàbí ìránṣẹ́ láì fi àlàyé tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: καρπὸν φέρητε
  choice: so èso
  rationale: “So èso” jẹ́ àpèjúwe àdánidá ní Yorùbá, ó sì pa àkàwé tí Jòhánù lò mọ́.
- source_word: μένῃ
  choice: máa dúró
  rationale: μένω lè túmọ̀ sí dúró, wà nìṣó, tàbí máa bá a lọ. “Máa dúró” ṣe kedere pé èso náà yóò wà nìṣó, ó sì tún pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú lílò rẹ̀ ní Jòhánù mọ́.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: ohunkóhun tí ẹ bá béèrè
  rationale: “Ohunkóhun ... bá” fi ìtumọ̀ àìní ààlà pàtó tí ὅ τι ἂν ní hàn, “béèrè lọ́wọ́” sì bá ọ̀rọ̀ àdúrà mu ní Yorùbá.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó sì ṣe déédé ní Yorùbá; ó pa agbára ẹ̀kọ́ àti ìbáṣepọ̀ inú gbólóhùn náà mọ́ láì túmọ̀ rẹ̀ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: δῷ
  choice: ó lè fi fún yín
  rationale: Fífi “lè” sí i pa ipa subjunctive inú gbólóhùn ète/àbájáde mọ́, “fi fún yín” sì jẹ́ àdánidá lẹ́yìn ohun tí wọ́n béèrè.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ “Baba,” kì í ṣe “Baba mi.” Ní Yorùbá, orúkọ oyè “Baba” lè dúró gẹ́gẹ́ bí ẹni tí a mọ̀ dáadáa láì fi “náà” kún un.
theological_decisions:
- issue: Ṣíṣe ἐξελεξάμην bí ọ̀rọ̀ ẹ̀kọ́ ìdìbò àtọ̀runwá kan pàtó
  choice: “Èmi ni mo yàn yín,” ní àyíká jíjẹ́ ọmọ-ẹ̀yìn àti ìránṣẹ́
  alternative: Lílo ọ̀rọ̀ ìmọ̀-ẹ̀sìn kan tó túmọ̀ sí pé a ti dìbò yàn wọn ní ọ̀nà àtọ̀runwá
  rationale: Ẹsẹ̀ náà fi ìgbésẹ̀ Jésù síwájú, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ túmọ̀ sí “yàn.” Ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ ìgbàgbọ́ tí ó wá lẹ́yìn sínú ọ̀rọ̀ pàtàkì.
- issue: Ìtumọ̀ ἔθηκα ὑμᾶς
  choice: Fífi àwọn ọmọ-ẹ̀yìn sípò fún lílọ àti síso èso
  alternative: Fífìdí wọn múlẹ̀ sínú ipò àṣẹ ìjọ kan pàtó
  rationale: 'Àyíká náà sọ ète yìí di mímọ̀: kí wọ́n lọ, kí wọ́n so èso, kí wọ́n sì béèrè ní orúkọ Jésù. “Fi yín sípò” fi ìfúnni ní iṣẹ́ hàn láì sọ ọ́ di ìyàsímímọ́ sí ipò ìjọ nìkan.'
- issue: Agbára gbólóhùn ἵνα tó parí ẹsẹ̀ náà
  choice: 'Gbólóhùn ète tàbí àbájáde: “kí ... ó lè fi fún yín”'
  alternative: 'Ìlérí ọjọ́ iwájú aláìní ààlà: “yóò fi fún yín”'
  rationale: Subjunctive tó tẹ̀ lé ἵνα so ìbéèrè náà mọ́ yíyan wọn, lílọ wọn, àti síso èso wọn. “Ó lè fi fún yín” pa ìṣọ̀kan gírámà àti ìfẹ́sẹ̀múlẹ̀ ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe náà pa ìtẹnumọ́ “ẹ̀yin/èmi,” àkàwé “so èso,” àti àwọn gbólóhùn ète méjèèjì mọ́, ó sì yẹra fún ọ̀rọ̀ ìjọ tàbí ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan pàtó.
