  - severity: low
    issue: Àlàyé abẹ́lẹ̀ a sọ ‘fẹ́ jáde lára àwọn mìíràn’
    rationale: Èyí lè yí ìtumọ̀ ἐκλέγομαι sí ‘fẹ́’ (desire). ‘Yàn’ tàbí ‘yàn lọ́tọ̀’ ni yíyan àfidípò lexiki tó pé jù.
