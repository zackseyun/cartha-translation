  source_fidelity: Ìtumọ̀ náà ń fi ìtakora yíyan, fífi sípò fún ète kan, lílọ, síso èso, àti ìbéèrè lọ́wọ́ Baba ní orúkọ Jésù hàn dáadáa. Síbẹ̀, “ó lè fi fún yín” lè túmọ̀ sí agbára/ìṣe-éṣe (‘he can give’) ju ipa gbólóhùn ète ἵνα δῷ lọ, ó sì fi ohun tí a ń fúnni sílẹ̀ ní ọ̀nà tí kò rọrùn. Àtúnṣe náà mú Baba jẹ́ olùṣe-ọrọ ní kedere, ó sì pa ‘ohunkóhun’ mọ́.
  naturalness: Yorùbá ìwé náà dára ní gbogbogbòò. “Kí Baba lè fún yín ní ohunkóhun tí ẹ bá béèrè lọ́wọ́ rẹ̀ ní orúkọ mi” jẹ́ gbólóhùn tó mọ́, tó sì rọrùn ju ìṣètò ìparí tó wà nínú àkọ́kọ́ lọ. “Kí èso yín lè dúró” tún bá ète gbólóhùn náà mu dáadáa ju “kí ... máa dúró,” tí ó lè fi ìṣe tí ń lọ lọwọ hàn.
  terminology: “Yàn,” “fi yín sípò,” “so èso,” “Baba,” àti “ní orúkọ mi” yẹ, wọ́n sì jẹ́ àdánidá ní Yorùbá ìgbàlódé ọlọ́wọ̀. Àlàyé abẹ́lẹ̀ a ni a tún ṣàtúnṣe, nítorí “fẹ́ jáde lára àwọn mìíràn” kì í ṣe àlàyé lexiki tó pé fún ἐκλέγομαι.
