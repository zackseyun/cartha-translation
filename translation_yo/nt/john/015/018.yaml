id: JHN.15.18
reference: John 15:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: yo
  text: “Bí ayé bá kórìíra yín, ẹ mọ̀ pé ó ti kórìíra mi ṣáájú yín.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kọ́kọ́ kórìíra mi, kí ó tó kórìíra yín.” Ọ̀rọ̀ Gíríìkì lo “àkọ́kọ́” pẹ̀lú “yín” láti fi hàn pé ìkórìíra Jesu ti wáyé ṣáájú ti àwọn ọmọ-ẹ̀yìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ayé
  rationale: Nínú ìlò Jòhánù, ọ̀rọ̀ náà lè tọ́ka sí aráyé tí wọ́n dúró lòdì sí Ọlọ́run; “ayé” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tí kò sì fi ìtumọ̀ àlàyé kún ọ̀rọ̀ ìpilẹ̀.
- source_word: μισεῖ
  choice: bá kórìíra
  rationale: Fọ́ọ̀mù ìsinsìnyí ní ipa gbogbogbò; nínú gbólóhùn àídájú Yorùbá, “bá kórìíra” sọ èyí ní ti ẹ̀dá.
- source_word: γινώσκετε
  choice: ẹ mọ̀
  rationale: A mú un gẹ́gẹ́ bí àṣẹ tàbí ìkìlọ̀, èyí tó bá ìṣàn ọ̀rọ̀ mu, bó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì náà tún lè jẹ́ gbólóhùn ìjẹ́rìí.
- source_word: πρῶτον ... ὑμῶν
  choice: ṣáájú yín
  rationale: Ọ̀rọ̀ yìí fi ìṣáájú ní àkókò hàn; “ṣáájú yín” jẹ́ Yorùbá àdánidá ju ìtumọ̀ líle bí “àkọ́kọ́ yín” lọ.
- source_word: μεμίσηκεν
  choice: ó ti kórìíra
  rationale: '“Ó ti kórìíra” dáàbò bo ipa perfect Gíríìkì: ohun tó ti ṣẹlẹ̀ tí ó sì ṣì ní ìjẹmọ́ sí ipò ìsinsìnyí.'
- source_word: ἐμὲ
  choice: mi
  rationale: Arọ́pò-orúkọ náà ní ìtẹnumọ́ nínú Gíríìkì; ìṣètò “ó ti kórìíra mi ṣáájú yín” pa ìfiwéra Jesu àti àwọn ọmọ-ẹ̀yìn mọ́ ní Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ κόσμος nínú ẹ̀kọ́ ìhìnrere Jòhánù
  choice: ayé
  alternative: àwọn aráyé tí wọ́n ń ṣọ̀tẹ̀ sí Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ fi àtakò sí Jesu àti àwọn ọmọ-ẹ̀yìn rẹ̀ hàn, ṣùgbọ́n fífi “àwọn aráyé tí wọ́n ń ṣọ̀tẹ̀ sí Ọlọ́run” sínú ẹsẹ̀ yóò túmọ̀ rẹ̀ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ. “Ayé” pa àìmọ́ tó yẹ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ Ọlọ́run mọ́.
- issue: Ìṣẹ̀dá girama γινώσκετε
  choice: àṣẹ—“ẹ mọ̀”
  alternative: ìjẹ́rìí—“ẹ mọ̀ pé” tàbí “ẹ̀yin mọ̀”
  rationale: Fọ́ọ̀mù Gíríìkì lè jẹ́ indicative tàbí imperative, ṣùgbọ́n lẹ́yìn gbólóhùn àídájú, ìkìlọ̀ “ẹ mọ̀” bá ìṣàn ọ̀rọ̀ mu jù. A kò fi ọ̀rọ̀ míì kún un láti mú àìmọ́ náà kúrò pátápátá.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá ti yẹ. “Kórìíra” jẹ́ ọ̀rọ̀ òde òní, tó ní iyì, tí gbogbo ènìyàn sì lè lóye. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμᾶς/ὑμῶν, kì í ṣe gẹ́gẹ́ bí àmì ọlá fún ẹni kan.
