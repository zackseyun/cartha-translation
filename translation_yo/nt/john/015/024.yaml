id: JHN.15.24
reference: John 15:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: yo
  text: Bí èmi kò bá ti ṣe láàárín wọn àwọn iṣẹ́ tí kò sí ẹlòmíràn tí ó ṣe, wọn kì bá tí ní ẹ̀ṣẹ̀;[a] ṣùgbọ́n ní báyìí, wọ́n ti rí, wọ́n sì ti kórìíra èmi àti Baba mi méjèèjì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ẹ̀ṣẹ̀ kì bá tí wà lórí wọn.” Ní tààràtà, èdè Gíríìkì ní: “wọn kì bá tí ní ẹ̀ṣẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” pa ìtumọ̀ ἔργα mọ́, ó sì bá lílo ọ̀rọ̀ yìí mu nínú Jòhánù, níbi tí àwọn iṣẹ́ Jesu ti ń jẹ́ ẹ̀rí ẹni tí ó jẹ́ àti iṣẹ́ tí ó wá ṣe.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: ṣe láàárín wọn
  rationale: “Láàárín wọn” fi hàn pé Jesu ṣe àwọn iṣẹ́ náà ní àárín wọn, ní ojú wọn; kì í ṣe pé ó ṣe ohun kan nínú ara wọn.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: tí ẹlòmíràn kan kò ṣe
  rationale: Èyí sọ ní kedere pé kò sí ẹlòmíràn tí ó ṣe irú àwọn iṣẹ́ náà, láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: wọn kì bá tí ní ẹ̀ṣẹ̀
  rationale: A pa àkànlò èdè Jòhánù, “ní ẹ̀ṣẹ̀,” mọ́ dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí jíjẹ̀bi nìkan. Ìlànà “kì bá tí” tún fi ipò àròsọ tí kò ṣẹlẹ̀ hàn.
- source_word: νῦν δὲ
  choice: ṣùgbọ́n ní báyìí
  rationale: Ó pa ìyàtọ̀ láàárín ohun tí ìbá ṣẹlẹ̀ àti ohun tí ó ti ṣẹlẹ̀ ní tòótọ́ mọ́.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: wọ́n ti rí, wọ́n sì ti kórìíra
  rationale: Àtúmọ̀ yìí fi àwọn ìṣe méjèèjì hàn, ó sì lo “ti” láti tọ́ka sí ohun tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: èmi àti Baba mi méjèèjì
  rationale: “Méjèèjì” pa ìtẹnumọ́ àsopọ̀ καὶ…καὶ mọ́, pé ìrí àti ìkórìíra náà kan Jesu àti Baba rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn “wọn kì bá tí ní ẹ̀ṣẹ̀” nípa jíjẹ̀bi wọn
  choice: Pa àkànlò Jòhánù “ní ẹ̀ṣẹ̀” mọ́.
  alternative: “Ẹ̀ṣẹ̀ kì bá tí wà lórí wọn” tàbí “wọn kì bá tí jẹ̀bi ẹ̀ṣẹ̀.”
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ìfihàn tí wọ́n rí mú ẹ̀bi wọn pọ̀ sí i, ṣùgbọ́n àtúmọ̀ kò yẹ kí ó dín gbólóhùn orísun kù sí àlàyé ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti bá ìkọ̀wé àdáni mu. “Kórìíra” jẹ́ ọ̀rọ̀ ìgbàlódé tí ó lágbára tó láti gbé μισέω jáde, “Baba” sì pa ọ̀nà tí Jesu gbà ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Baba rẹ̀ mọ́.
