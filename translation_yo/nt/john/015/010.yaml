source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: yo
  text: Bí ẹ bá pa àwọn àṣẹ mi mọ́, ẹ ó dúró nínú ìfẹ́ mi, gẹ́gẹ́ bí èmi ti pa àwọn àṣẹ Baba mi mọ́, tí mo sì dúró nínú ìfẹ́ rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Bí
  rationale: Ó mú gbólóhùn oníṣ شرط? If typo prohibited. Need Yoruba. Let's correct JSON. Ensure quality. Need exactly once. I'll formulate.
- source_word: ἐντολάς
  choice: àwọn àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ẹni aláṣẹ pàṣẹ, ó sì pa agbára ìtọ́nisọ́nà àti ojúṣe mọ́.
- source_word: τηρήσητε / τετήρηκα
  choice: pa … mọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ “pa àṣẹ mọ́” túmọ̀ sí fífi òtítọ́ ṣe àṣẹ tàbí ṣíṣe ìgbọràn sí i; lílo rẹ̀ lẹ́ẹ̀mejì tún pa ìbáramu ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μενεῖτε / μένω
  choice: dúró
  rationale: “Dúró nínú” sọ ìtẹ̀síwájú nínú ipò ìbáṣepọ̀, ó sì jẹ́ èdè Yorùbá tó ṣe kedere ju gbólóhùn àtijọ́ tàbí aláìdánidá lọ.
- source_word: ἐν τῇ ἀγάπῃ μου
  choice: nínú ìfẹ́ mi
  rationale: Ó pa àwòrán Jòhánù ti wíwà nínú àyíká ìfẹ́ mọ́ láì túmọ̀ rẹ̀ sí àlàyé ẹ̀kọ́ ìgbàgbọ́.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra tó ṣe kedere hàn láàárín ìgbọràn àwọn ọmọ-ẹ̀yìn àti àpẹẹrẹ Jesu.
- source_word: τοῦ πατρός μου
  choice: Baba mi
  rationale: Ọ̀nà ìní Yorùbá yìí jẹ́ ti ẹ̀dá, “Baba” sì ń tọ́ka sí Ọlọ́run nínú àyíká yìí.
- source_word: αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: nínú ìfẹ́ rẹ̀
  rationale: “Rẹ̀” ń tọ́ka padà sí Baba ní kedere, ó sì pa ìbáramu mọ́ pẹ̀lú “nínú ìfẹ́ mi.”
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín pípa àṣẹ Jesu mọ́ àti dídúró nínú ìfẹ́ rẹ̀
  choice: 'Fi hàn gẹ́gẹ́ bí ipò gidi: “Bí …, ẹ ó …,” láì ṣàlàyé rẹ̀ gẹ́gẹ́ bí jíjẹ ìfẹ́ Ọlọ́run tọ́ síni tàbí gẹ́gẹ́ bí ẹ̀rí lásán.'
  alternative: Ṣàlàyé ìgbọràn bí ohun tí ń jẹ́ kí ènìyàn tọ́ sí ìfẹ́ Ọlọ́run, tàbí mú agbára ipò inú gbólóhùn náà kúrò.
  rationale: Gíríìkì gbé ipò àti àbájáde kalẹ̀ ní tààrà, ṣùgbọ́n kò yanjú àríyànjiyàn ẹ̀kọ́ nípa èrè, ìdánilójú, tàbí ìfaradà.
- issue: Ìtumọ̀ ἀγάπη
  choice: ìfẹ́
  alternative: ìfẹ́ àánú tàbí ọ̀rọ̀ míì tó fi àlàyé ẹ̀kọ́ kún un
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó bójú mu, tó sì pa ìsopọ̀ ọ̀rọ̀ náà mọ́ ní gbogbo ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn nítorí àwọn ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ọ̀pọ̀. Àkójọpọ̀ “pa àṣẹ mọ́” àti “dúró nínú ìfẹ́” pa àwòrán àti àsọtúnlò Jòhánù mọ́.
