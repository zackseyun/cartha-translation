base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: yo
  text: Bí èmi kò bá ti wá, tí n kò sì bá wọn sọ̀rọ̀, wọn kì bá tí ní ẹ̀ṣẹ̀[a]; ṣùgbọ́n ní báyìí, wọn kò ní àwáwí fún ẹ̀ṣẹ̀ wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kì bá jẹ̀bi ẹ̀ṣẹ̀,” tàbí “wọn kì bá ní ẹ̀bi.” Ní tààrà, ọ̀rọ̀ Gíríìkì sọ pé, “wọn kì bá ní ẹ̀ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọn kò ní àwáwí nípa ẹ̀ṣẹ̀ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Bí èmi kò bá ti wá, tí mo sì bá wọn sọ̀rọ̀
  rationale: Èyí fi ipò àròsọ ohun tí kò ṣẹlẹ̀ ní àtijọ́ hàn lọ́nà Yorùbá àdánidá, ó sì tú λαλέω pẹlu αὐτοῖς sí ‘bá wọn sọ̀rọ̀.’
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: wọn kì bá tí ní ẹ̀ṣẹ̀
  rationale: Ó pa ọ̀rọ̀ Gíríìkì ‘ní ẹ̀ṣẹ̀’ mọ́, dípò kí a túmọ̀ rẹ̀ ní pàtó sí ‘jẹ̀bi,’ ó sì fi ipa ipò àròsọ hàn.
- source_word: νῦν δὲ
  choice: ṣùgbọ́n ní báyìí
  rationale: Ó fi ìyàtọ̀ tó lágbára láàárín ipò àròsọ àtijọ́ àti òtítọ́ ìsinsìnyí hàn.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: wọn kò ní àwíjà
  rationale: ‘Àwíjà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìdáláre tàbí àṣírí tí ènìyàn fi ń gbèjà ara rẹ̀; ó bá ‘excuse/pretext’ mu nínú àyíká yìí.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: fún ẹ̀ṣẹ̀ wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé περί pẹ̀lú genitive lè túmọ̀ sí ‘nípa,’ ìsọ̀rọ̀ Yorùbá àdánidá ni ‘ní àwíjà fún’ ohun kan.
theological_decisions:
- issue: Bóyá ἁμαρτίαν οὐκ εἴχοσαν túmọ̀ sí pé wọn kò ní ẹ̀ṣẹ̀ rárá tàbí pé wọn kì bá jẹ̀bi ẹ̀ṣẹ̀ ìkọ̀sílẹ̀ ìfihàn Jesu
  choice: wọn kì bá tí ní ẹ̀ṣẹ̀
  alternative: wọn kì bá jẹ̀bi ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé ‘ní ẹ̀ṣẹ̀.’ Àyíká fi ọ̀ràn jíjẹ̀bi hàn, ṣùgbọ́n a pa ìdánilẹ́kọ̀ọ́ àti àìdánilójú ọ̀rọ̀ Johanu mọ́ láìfi ìtumọ̀ tó dín kù sínú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo ‘àwíjà’ gẹ́gẹ́ bí ọ̀rọ̀ òde òní tó yé kedere, a sì pa ìfẹ̀hónúhàn ẹ̀kọ́ ìgbàgbọ́ inú ‘ní ẹ̀ṣẹ̀’ mọ́.
