revisions:
- from: Bí èmi kò bá ti wá, tí mo sì bá wọn sọ̀rọ̀, wọn kì bá tí ní ẹ̀ṣẹ̀[a]; ṣùgbọ́n ní báyìí, wọn kò ní àwíjà fún ẹ̀ṣẹ̀ wọn[b].
  to: Bí èmi kò bá ti wá, tí n kò sì bá wọn sọ̀rọ̀, wọn kì bá tí ní ẹ̀ṣẹ̀[a]; ṣùgbọ́n ní báyìí, wọn kò ní àwáwí fún ẹ̀ṣẹ̀ wọn[b].
  rationale: The revision restores the negation required by the Greek conditional clause and replaces ‘àwíjà’ with the semantically appropriate and idiomatic ‘àwáwí.’ It retains the source’s deliberately unexpanded ‘have sin’ wording and the natural Yorùbá construction ‘ní àwáwí fún.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:28:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the contrary-to-fact structure in the apodosis (''wọn kì bá tí ní ẹ̀ṣẹ̀'') and appropriately preserves the literal Johannine expression ''have sin'' rather than resolving it as culpability. However, the protasis lacks the required negation before ''bá wọn sọ̀rọ̀'': as written, it says in effect, ''If I had not come, and I spoke to them,'' contrary to εἰ μὴ ... καὶ ἐλάλησα (''If I had not come and spoken to them'').'
  naturalness: With the second negative supplied, 'Bí èmi kò bá ti wá, tí n kò sì bá wọn sọ̀rọ̀' is clear, standard Yorùbá for the unreal past condition. 'Àwáwí' is the natural term for an excuse or pretext in this setting; 'àwíjà' more naturally suggests an argument, dispute, or contention.
  terminology: Ẹ̀ṣẹ̀ accurately renders ἁμαρτία and should remain unqualified in the main text. Àwáwí accurately conveys πρόφασις without importing a doctrinal explanation. The idiomatic 'ní àwáwí fún ẹ̀ṣẹ̀ wọn' suitably renders the sense of having no excuse regarding/for their sin.
  issues:
  - severity: high
    issue: The negative is missing from the second coordinated verb in the conditional clause.
    rationale: The Greek εἰ μὴ governs both 'came' and 'spoke.' The current Yorùbá contrasts 'had not come' with 'spoke to them,' changing the condition and creating an incoherent conditional.
  - severity: medium
    issue: ‘Àwíjà’ is not the best rendering of πρόφασις here.
    rationale: In standard modern Yorùbá, ‘àwáwí’ means an excuse or pretext. ‘Àwíjà’ tends toward an argument or quarrel and can misstate the sense.
  revised_text: Bí èmi kò bá ti wá, tí n kò sì bá wọn sọ̀rọ̀, wọn kì bá tí ní ẹ̀ṣẹ̀[a]; ṣùgbọ́n ní báyìí, wọn kò ní àwáwí fún ẹ̀ṣẹ̀ wọn[b].
