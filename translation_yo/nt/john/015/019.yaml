id: JHN.15.19
reference: John 15:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: yo
  text: Bí ẹ̀yin bá jẹ́ ti ayé[a], ayé ì bá fẹ́ ohun tí í ṣe tirẹ̀. Ṣùgbọ́n nítorí pé ẹ̀yin kì í ṣe ti ayé, ṣùgbọ́n èmi ti yàn yín jáde kúrò nínú ayé, nítorí èyí ni ayé fi kórìíra yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, fún “jẹ́ ti ayé”: “wá láti inú ayé.” Ọ̀rọ̀ Gíríìkì ἐκ τοῦ κόσμου lè tọ́ka sí orísun tàbí jíjẹ́ ti ayé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: jẹ́ ti ayé / kúrò nínú ayé
  rationale: Ní ìbẹ̀rẹ̀, “jẹ́ ti ayé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orísun tàbí jíjẹ́ ti ẹgbẹ́ kan; lẹ́yìn ἐξελεξάμην, “jáde kúrò nínú ayé” mú ìtumọ̀ yíyan jáde hàn. Àkọ́sẹ̀ ìsàlẹ̀ pa àṣàyàn “wá láti inú ayé” mọ́.
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” ni ìtumọ̀ Yorùbá tó gbòòrò, tó sì bójú mu fún κόσμος; kò dín ẹ̀ka ìtumọ̀ Johanu kù sí ètò àwùjọ kan ṣoṣo.
- source_word: ἂν ... ἐφίλει
  choice: ì bá fẹ́
  rationale: “Ì bá fẹ́” fi ipò àròsọ tí kò bá òtítọ́ mu hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: τὸ ἴδιον
  choice: ohun tí í ṣe tirẹ̀
  rationale: Èyí pa àìdánilójú ọ̀rọ̀ aláìlẹ́ni neuter náà mọ́; kò fi “àwọn ènìyàn tirẹ̀” kún un láìsí nínú Gíríìkì.
- source_word: φιλέω
  choice: fẹ́
  rationale: “Fẹ́” jẹ́ ọ̀rọ̀ àdánidá fún ìfẹ́ tàbí ìnífẹ̀ẹ́, ó sì dúró ní òdìkejì “kórìíra” ní kedere.
- source_word: ἐξελεξάμην
  choice: èmi ti yàn yín
  rationale: “Yàn” sọ ìṣe yíyan náà ní tààrà; “èmi” mú ẹni tó ṣe ìṣe náà tẹnumọ́, ṣùgbọ́n kò fi ẹ̀kọ́ ìsìn míì kún middle voice.
- source_word: διὰ τοῦτο
  choice: nítorí èyí ni ... fi
  rationale: Ìṣètò Yorùbá yìí fi ìdí tàbí ohun tó fà á hàn ní kedere, ó sì bá gbolohun náà mu.
- source_word: μισεῖ
  choice: kórìíra
  rationale: “Kórìíra” pa ìtakora líle sí “fẹ́” mọ́, láìrọ̀ ọ́ sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “ayé” nínú ọ̀rọ̀ Johanu
  choice: Fi “ayé” sílẹ̀ láìfi àlàyé ìtumọ̀ ẹ̀kọ́ ìsìn sínú ọ̀rọ̀ pàtàkì.
  alternative: ètò ayé; àwùjọ ènìyàn tó ń ṣàtakò sí Ọlọ́run
  rationale: “Ayé” pa fífẹ̀ ẹ̀ka ìtumọ̀ κόσμος àti ìforígbárí rẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn mọ́, láìdín in kù sí ìtumọ̀ ẹ̀kọ́ kan.
- issue: Ìtumọ̀ yíyan nínú ἐξελεξάμην
  choice: “Èmi ti yàn yín jáde kúrò nínú ayé.”
  alternative: Ọ̀rọ̀ tó ní ẹrù ẹ̀kọ́ ìpinnu ayérayé tàbí predestination tó pọ̀ sí i
  rationale: Ẹsẹ náà sọ yíyan tí Jesu ṣe ní kedere, ṣùgbọ́n kò béèrè pé kí ìtumọ̀ yanju àríyànjiyàn àwọn ẹ̀sìn nípa election.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin/yín” fún ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó yẹ.
