id: JHN.15.9
reference: John 15:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: yo
  text: Gẹ́gẹ́ bí Baba ti fẹ́ràn mi[a], bẹ́ẹ̀ ni èmi náà ti fẹ́ràn yín; ẹ dúró nínú ìfẹ́ mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Gẹ́gẹ́ bí Baba ṣe fẹ́ràn mi, bẹ́ẹ̀ ni èmi náà fẹ́ràn yín; ẹ dúró nínú ìfẹ́ mi.” Àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì jẹ́ aorist, èyí tí a lè túmọ̀ sí ìṣe àtijọ́ lásán. Ọ̀rọ̀ inú ẹsẹ yìí lo “ti” láti fi hàn pé ìfẹ́ náà ti wáyé, ipa rẹ̀ sì ṣì ṣe pàtàkì nínú àyíká ọ̀rọ̀ náà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí ... bẹ́ẹ̀ ni
  rationale: Ọ̀nà àfiwé Yorùbá yìí fi ìbámu tó wà láàárín ìfẹ́ Baba sí Jésù àti ìfẹ́ Jésù sí àwọn ọmọ ẹ̀yìn hàn ní kedere, láìfi ohun tuntun kún ọ̀rọ̀ náà.
- source_word: ἠγάπησέν / ἠγάπησα
  choice: ti fẹ́ràn / ti fẹ́ràn
  rationale: Àmì apá-ìṣe “ti” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe tí ó ti ṣẹlẹ̀ ṣùgbọ́n tí ipa rẹ̀ ṣì wà; ó bá ìtumọ̀ aorist nínú àyíká ọ̀rọ̀ yìí mu láìsọ pé aorist fúnra rẹ̀ túmọ̀ sí perfect.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: “Baba” jẹ́ ìtọ́kasí ọlọ́lá àti àdánidá sí Ọlọ́run gẹ́gẹ́ bí Baba Jésù nínú ọ̀rọ̀ Johanu.
- source_word: κἀγὼ
  choice: bẹ́ẹ̀ ni èmi náà
  rationale: “Èmi náà” pa ìtẹnumọ́ arọ́pò-orúkọ àti ìtumọ̀ “pẹ̀lú” mọ́; “bẹ́ẹ̀ ni” sì so ó mọ́ àfiwé tí καθὼς bẹ̀rẹ̀.
- source_word: ὑμᾶς
  choice: yín
  rationale: “Yín” jẹ́ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: μείνατε
  choice: ẹ dúró
  rationale: Àṣẹ “ẹ dúró” jẹ́ ti ọ̀pọ̀ ènìyàn, ó sì pa àkòrí Johanu nípa dídúró mọ́. Ó ṣe kedere, ó sì jẹ́ èdè Yorùbá òde òní.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: nínú ìfẹ́ mi
  rationale: Ó túmọ̀ àkópọ̀ ọ̀rọ̀ Gíríìkì ní tààrà gẹ́gẹ́ bí “nínú ìfẹ́ mi,” ó sì pa àwòrán ti wíwà tàbí dídúró nínú ìfẹ́ Jésù mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀγάπη
  choice: ìfẹ́
  alternative: ìfẹ́ inú / àánú
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó gbòòrò, tó bójú mu jù lọ fún ἀγάπη níbí; àwọn àṣàyàn mìíràn lè dín ìtumọ̀ rẹ̀ kù tàbí yí i sí ìmọ̀lára tàbí àánú nìkan.
- issue: Agbára aspect inú ἠγάπησέν àti ἠγάπησα
  choice: ti fẹ́ràn ... ti fẹ́ràn
  alternative: fẹ́ràn ... fẹ́ràn
  rationale: Lílo “ti” ń fi ìṣe tí ó ti wáyé àti ìjẹ́pàtàkì rẹ̀ tí ó ń bá a lọ hàn nínú Yorùbá àdánidá. Àmọ́, nítorí pé aorist Gíríìkì tún lè fara hàn bí ìṣe àtijọ́ lásán, àṣàyàn tí kò ní “ti” wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ó ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé lásán. Àṣẹ “ẹ dúró” àti arọ́pò-orúkọ “yín” fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀.
