revisions:
- from: 'Kò sí ẹni tí ó ní ìfẹ́ tí ó tóbi ju èyí lọ: pé kí ẹnì kan fi ẹ̀mí rẹ̀ lélẹ̀ nítorí àwọn ọ̀rẹ́ rẹ̀.[a][b]'
  to: 'Kò sí ẹni tí ó ní ìfẹ́ tí ó ga ju èyí lọ: èyí ni pé, kí ẹnì kan fi ìyè rẹ̀ lélẹ̀ fún àwọn ọ̀rẹ́ rẹ̀.[a][b]'
  rationale: The revision preserves the Greek’s general singular subject and the forward-defining force of ἵνα, while using idiomatic Yorùbá. “Ìyè” accurately conveys the contextual sense of ψυχή, and “fún” represents ὑπέρ’s benefactive force without imposing a more specific theological interpretation.
  reviewer_model: gpt-5.6-terra
