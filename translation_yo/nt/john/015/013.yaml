review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comparative claim, the indefinite singular subject, and the friends as the beneficiaries. However, “ẹ̀mí” ordinarily denotes spirit and is less precise than “ìyè” for ψυχή in this context of surrendering one’s life. The footnote’s suggestion that ὑπέρ can mean “ní ipò” risks making a substitutional sense appear equally required by the verse.
  naturalness: “Ìfẹ́ tí ó ga ju èyí lọ” is more idiomatic for ‘greater love’ than “ìfẹ́ tí ó tóbi ju èyí lọ.” Recasting the explanatory clause with “Èyí ni pé” makes the relationship of ἵνα to “èyí” clear in natural modern Yorùbá.
  terminology: Use “ìyè” for life in both text and note. Render ὑπέρ as “fún” in the text; it naturally expresses action for the benefit of the friends without overstating a disputed doctrinal nuance.
  issues:
  - severity: medium
    issue: “Ẹ̀mí” is used for ψυχή in the main text.
    rationale: In Standard Yorùbá, ẹ̀mí primarily means ‘spirit.’ Since the Greek phrase here means the life one gives up in death, ìyè is the clearer and more source-faithful choice.
  - severity: medium
    issue: Footnote b presents “ní ipò” as an alternative for ὑπέρ.
    rationale: Although substitution may be inferred in broader theological discussion, ὑπέρ itself here need not be translated ‘instead of.’ The note should retain the benefactive range without implying that substitution is an equally direct lexical rendering.
  - severity: low
    issue: “Tóbi” for the comparative ‘greater’ is somewhat calqued in this collocation.
    rationale: “Ga ju” is a more natural Yorùbá expression for surpassing greatness in this abstract comparison.
  revised_text: 'Kò sí ẹni tí ó ní ìfẹ́ tí ó ga ju èyí lọ: èyí ni pé, kí ẹnì kan fi ìyè rẹ̀ lélẹ̀ fún àwọn ọ̀rẹ́ rẹ̀.[a][b]'
