source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: yo
  text: 'Kò sí ẹni tí ó ní ìfẹ́ tí ó ga ju èyí lọ: èyí ni pé, kí ẹnì kan fi ìyè rẹ̀ lélẹ̀ fún àwọn ọ̀rẹ́ rẹ̀.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìyè” túmọ̀ sí ìwàláàyè ẹni tí a fi sílẹ̀ dé ojú ikú. Ọ̀rọ̀ Gíríìkì náà, psychē, lè túmọ̀ sí “ẹ̀mí,” “ọkàn,” tàbí “ara ẹni” ní àwọn àyíká míì.
    reason: lexical_alternative
  - marker: b
    text: “Fún” lè túmọ̀ sí “nítorí ire” tàbí “ní tìtorí” àwọn ọ̀rẹ́ rẹ̀. Ọ̀rọ̀ Gíríìkì náà ń fi hàn pé ìṣe náà jẹ́ fún àǹfààní wọn, láìsọ ìbáṣepọ̀ náà ní ọ̀nà kan ṣoṣo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: ìfẹ́ tí ó tóbi ju èyí lọ
  rationale: Ó pa ìfiwéra Gíríìkì mọ́ ní Yorùbá àdánidá, èyí sì ń tọ́ka sí gbólóhùn tí ó tẹ̀ lé e.
- source_word: οὐδεὶς ἔχει
  choice: Kò sí ẹni tí ó ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé kò sí ẹnikẹ́ni tí ó ní irú ìfẹ́ bẹ́ẹ̀.
- source_word: ἵνα τις
  choice: pé kí ẹnì kan
  rationale: “Pé kí” fi hàn pé gbólóhùn náà ń ṣàlàyé ohun tí “èyí” túmọ̀ sí; “ẹnì kan” sì pa àìdánimọ̀ ẹni kan ṣoṣo nínú τις mọ́.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: fi ẹ̀mí rẹ̀ lélẹ̀
  rationale: Nínú àyíká yìí ψυχή túmọ̀ sí ìyè ẹni tí a fi sílẹ̀ dé ojú ikú; “fi ẹ̀mí rẹ̀ lélẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún ìfara-ẹni-rúbọ bẹ́ẹ̀.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: nítorí àwọn ọ̀rẹ́ rẹ̀
  rationale: “Nítorí” sọ ìṣe tí a ṣe fún ire àwọn ọ̀rẹ́ náà láìfi dandan pinnu bóyá ὑπέρ túmọ̀ sí dípò wọn tàbí fún àǹfààní wọn.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ ìfara-ẹni-rúbọ
  choice: “ẹ̀mí” gẹ́gẹ́ bí ìyè ẹni tí a fi sílẹ̀ nínú ikú
  alternative: “ọkàn” tàbí “ìyè”
  rationale: Àyíká náà ń sọ nípa fífi gbogbo ìyè ẹni rúbọ, kì í ṣe fífi apá aláìlérò ara nìkan rúbọ. Ní Yorùbá, gbólóhùn “fi ẹ̀mí rẹ̀ lélẹ̀” ń sọ ìtumọ̀ yìí lọ́nà àdánidá.
- issue: Agbára ὑπέρ nínú ìfẹ́ ìfara-ẹni-rúbọ
  choice: “nítorí”
  alternative: “fún,” “nítorí ire,” tàbí “dípò”
  rationale: “Nítorí” pa ìtumọ̀ jíjẹ́ fún ire ẹlòmíràn mọ́ láìfi ẹ̀kọ́ ìrọ́pò kan pàtó kún ohun tí ẹsẹ yìí fúnra rẹ̀ kò sọ ní kedere.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó rọrùn fún òǹkàwé òde òní. A lo “ẹnì kan” láti pa ìtumọ̀ gbogbogbò tí kò ní akọ tàbí abo mọ́.
