  text: These things I command you[b][a], so that you may love one another.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí ni mo pa láṣẹ fún yín, kí ẹ nífẹ̀ẹ́ ara yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Àwọn nǹkan wọ̀nyí ni mo pa láṣẹ fún yín: ẹ nífẹ̀ẹ́ ara yín.” Gbólóhùn Gíríìkì náà lè fi ète hàn, tàbí kí ó fẹ́rẹ̀ẹ́ jẹ́ àlàyé ohun tí àṣẹ náà jẹ́.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: Nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ atọ́ka onírúpọ̀ aláìlẹ́mìí ni; ó tọ́ka sí àwọn ìtọ́ni tí ó ṣáájú, ó sì pa ìtumọ̀ onírúpọ̀ Gíríìkì mọ́.
- source_word: ἐντέλλομαι
  choice: ni mo pa láṣẹ
  rationale: Ọ̀rọ̀-ìṣe yìí túmọ̀ sí fífi àṣẹ tàbí ìtọ́ni fún ẹnì kan. Ìṣètò ‘ni mo pa láṣẹ’ jẹ́ ti Yorùbá àdánidá, ó sì fi agbára àṣẹ náà hàn.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Arọ́pò-orúkọ ẹni kejì onírúpọ̀ ni; ‘fún yín’ fi ẹni tí a fún ní àṣẹ hàn ní kedere.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a pinnu hàn, láìpa àìdánilójú díẹ̀ tí gbólóhùn Gíríìkì ní run.
- source_word: ἀγαπᾶτε
  choice: nífẹ̀ẹ́
  rationale: Ó jẹ́ ọ̀rọ̀-ìṣe ìfẹ́ nínú gbólóhùn ἵνα; ‘kí ẹ lè nífẹ̀ẹ́’ bá ìṣètò ète mu, láìfi ìtumọ̀ àtúnṣe-tẹ̀síwájú kún un.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ àti àdánidá fún ìṣe àfẹ̀yìntì láàárín ẹgbẹ́ kan, ìyẹn ‘ẹnì kìíní sí ẹnì kejì.’
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín àṣẹ náà àti gbólóhùn ἵνα
  choice: 'A túmọ̀ ἵνα gẹ́gẹ́ bí ète: ‘kí ẹ lè nífẹ̀ẹ́ ara yín.’'
  alternative: 'A lè lóye rẹ̀ bí àlàyé ohun tí àṣẹ náà jẹ́: ‘Nǹkan wọ̀nyí ni mo pa láṣẹ fún yín: ẹ nífẹ̀ẹ́ ara yín.’'
  rationale: Ìṣètò Gíríìkì sábà máa ń fi ète tàbí àbájáde tí a pinnu hàn, ṣùgbọ́n nínú ìlò Jòhánù ó lè sún mọ́ àlàyé àkóónú àṣẹ náà. Ọ̀rọ̀ pàtàkì fi ète síwájú, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo ‘pa láṣẹ fún’ nítorí pé ó jẹ́ àdánidá ju títẹ̀lé ìṣètò Gíríìkì lọ ní tààràtà; a sì lo ‘ara yín’ fún ìfẹ́ tí olúkúlùkù ní sí àwọn ẹlòmíràn nínú ẹgbẹ́.
