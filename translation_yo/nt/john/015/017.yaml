  source_fidelity: Ìtumọ̀ náà ṣàfihàn ταῦτα gẹ́gẹ́ bí ọ̀pọ̀ (‘Àwọn nǹkan wọ̀nyí’), ìṣe àṣẹ ἐντέλλομαι, ẹni kejì ọ̀pọ̀, àti ìfẹ́ ìbáṣepọ̀ ἀλλήλους ní òtítọ́. Ṣùgbọ́n ‘kí ẹ lè nífẹ̀ẹ́’ lè ní ìtumọ̀ agbára/ìṣàmúlò (‘so that you can love’) ní Yorùbá. ‘Kí ẹ nífẹ̀ẹ́’ ń fi ète ἵνα hàn láìfi ìtumọ̀ agbára kún un.
