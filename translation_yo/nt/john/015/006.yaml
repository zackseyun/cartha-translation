id: JHN.15.6
reference: John 15:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: yo
  text: Bí ẹnikẹ́ni kò bá dúró nínú mi[a], a sọ ọ́ síta bí ẹ̀ka àjàrà, ó sì gbẹ; wọ́n sì ń kó wọ́n jọ, wọ́n ń jù wọ́n sínú iná[b], ẹ̀ka náà sì ń jó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò bá tẹ̀ síwájú láti máa wà nínú mi.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí títẹ̀ síwájú ní wíwà tàbí ní ìbáṣepọ̀ kan.
    reason: lexical_alternative
  - marker: b
    text: Àwòrán yìí kìlọ̀ nípa yíyọ ẹni síta àti jíjó, ṣùgbọ́n ẹsẹ náà fúnra rẹ̀ kò sọ bóyá ó ń ṣàpèjúwe ọmọ-ẹ̀yìn tòótọ́ tó ṣubú kúrò tàbí ẹni tí ìsopọ̀ rẹ̀ kò jẹ́ ojúlówó.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: dúró
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti máa bá a lọ ní wíwà tàbí ní ìbáṣepọ̀ kan. “Dúró” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì pa àkòrí pàtàkì yìí mọ́ nínú ìwé Jòhánù.
- source_word: ἐν ἐμοί
  choice: nínú mi
  rationale: A pa àwòrán ìbáṣepọ̀ pẹ̀lú Jésù mọ́ ní tààràtà, láì sọ ọ́ di “pẹ̀lú mi” tàbí fi ìtumọ̀ àfikún sí i.
- source_word: ἐβλήθη ἔξω
  choice: a sọ ọ́ síta
  rationale: 'Èyí pa ohùn àìṣe ẹni tí a sọ̀rọ̀ rẹ̀ mọ́: ẹlòmíràn ni ó sọ ẹni náà síta. Ìlò Yorùbá yìí bá gbólóhùn àkàwé gbogbogbò mu.'
- source_word: ὡς τὸ κλῆμα
  choice: bí ẹ̀ka àjàrà
  rationale: κλῆμα jẹ́ ẹ̀ka tàbí abẹ̀rẹ̀ àjàrà nínú àkàwé tó ń lọ níhìn-ín; fífi “àjàrà” kún un mú àwòrán náà ṣe kedere ní Yorùbá.
- source_word: ἐξηράνθη
  choice: ó sì gbẹ
  rationale: Ọ̀rọ̀ náà tọ́ka sí dídi gbígbẹ tàbí rírọ; “ó gbẹ” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ohun tó ṣẹlẹ̀ sí ẹ̀ka tí a gé kúrò.
- source_word: συνάγουσιν
  choice: wọ́n sì ń kó ... jọ
  rationale: Gíríìkì lo ẹni kẹta ọ̀pọ̀ láì dárúkọ àwọn aṣojú náà. “Wọ́n” pa àìsọ ẹni tí wọ́n jẹ́ mọ́.
- source_word: αὐτὰ
  choice: irú àwọn ẹ̀ka bẹ́ẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì jẹ́ ọ̀pọ̀, bó tilẹ̀ jẹ́ pé àpẹẹrẹ tó ṣáájú jẹ́ ẹyọ kan. Gbólóhùn yìí mú ìyípadà sí ọ̀pọ̀ ṣe kedere ní Yorùbá.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: wọ́n ń jù wọ́n sínú iná
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì jẹ́ Yorùbá òde òní tí ó bá àwòrán líle ti ẹsẹ náà mu.
- source_word: καίεται
  choice: ẹ̀ka náà sì ń jó
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì tó gbẹ̀yìn jẹ́ ẹyọ kan. Pípè “ẹ̀ka náà” ní kedere pa ẹyọ náà mọ́ lẹ́yìn tí gbólóhùn ti mẹ́nu kan àwọn ẹ̀ka lọ́pọ̀.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Èyí fi ìtumọ̀ gbogbogbò àti ẹyọ kan ti ọ̀rọ̀ Gíríìkì náà hàn lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Bóyá kí ìtumọ̀ náà pinnu pé ìkìlọ̀ yìí ń sọ nípa onígbàgbọ́ tòótọ́ tó ṣubú kúrò tàbí ẹni tí ìsopọ̀ rẹ̀ kò jẹ́ ojúlówó
  choice: A pa àkàwé ìkìlọ̀ àti ìdájọ́ náà mọ́ láì ṣàlàyé ipò ẹni náà ju ohun tí ẹsẹ sọ lọ.
  alternative: Láti sọ ní pàtó pé ó jẹ́ pàdánù ìgbàlà tàbí ìfihàn pé ẹni náà kò jẹ́ ọmọ-ẹ̀yìn tòótọ́ rí.
  rationale: Ẹsẹ náà sọ nípa yíyọ ẹ̀ka síta àti jíjó rẹ̀, ṣùgbọ́n kò dá àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa ipò ẹni náà ṣáájú ìṣẹ̀lẹ̀ yìí láre fúnra rẹ̀.
translation_notes:
  register: Yorùbá ìlànà tó ní àmì ohùn kíkún ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán àjàrà, àwọn aṣojú tí a kò dárúkọ, àti ìyípadà láti ẹ̀ka ẹyọ kan sí àwọn ẹ̀ka ọ̀pọ̀ mọ́.
