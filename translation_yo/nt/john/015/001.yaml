  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: yo
  text: “Èmi ni àjàrà tòótọ́, Baba mi sì ni àgbẹ̀ àjàrà[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ológbà àjàrà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí ń ṣiṣẹ́ ilẹ̀ tàbí tí ń gbin ohun ọ̀gbìn; ní àyíká àjàrà yìí, ó lè tọ́ka sí ẹni tí ń tọ́jú àjàrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹnumọ́ arọ́pò-orúkọ ẹni àkọ́kọ́ àti ọ̀rọ̀ ìdánimọ̀ hàn, láìfi ìtẹnumọ́ tí ó pọ̀ jù kún un.
- source_word: ἄμπελος
  choice: igi àjàrà
  rationale: ‘Igi àjàrà’ jẹ́ ọ̀rọ̀ tí ó ṣe kedere fún ohun ọ̀gbìn tí ń so èso àjàrà, ó sì pa àwòrán àfiwé inú ẹsẹ̀ náà mọ́.
- source_word: ἀληθινή
  choice: tòótọ́
  rationale: ‘Tòótọ́’ lè túmọ̀ sí ohun tí kì í ṣe èké àti ohun ojúlówó; nítorí náà, ó pa ìjìnlẹ̀ ìtumọ̀ ọ̀rọ̀ Jòhánù mọ́ láìṣe àlàyé àfikún.
- source_word: ὁ πατήρ μου
  choice: Baba mi
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, àdánidá, tí ó sì fi ìbáṣepọ̀ Jesu pẹ̀lú Ọlọ́run hàn.
- source_word: ὁ γεωργός
  choice: àgbẹ̀ àjàrà
  rationale: γεωργός túmọ̀ sí ẹni tí ń ro ilẹ̀ tàbí tí ń dá ohun ọ̀gbìn; ní àyíká àfiwé igi àjàrà yìí, ‘àgbẹ̀ àjàrà’ ṣe kedere ó sì bá àwòrán náà mu.
theological_decisions:
- issue: Ìdánimọ̀ àfiwé nínú ọ̀rọ̀ Jesu, ‘Èmi ni’
  choice: Pa àfiwé náà mọ́ ní tààrà gẹ́gẹ́ bí ‘Èmi ni igi àjàrà tòótọ́.’
  alternative: Èmi ni igi àjàrà ojúlówó.
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àfiwé ìdánimọ̀, kì í ṣe àlàyé nípa ohun tí àjàrà dúró fún. ‘Tòótọ́’ tún pa àìdánilójú tó wà láàárín ‘tí kì í ṣe èké’ àti ‘ojúlówó pátápátá’ mọ́.
- issue: Ipa Baba gẹ́gẹ́ bí γεωργός
  choice: àgbẹ̀ àjàrà
  alternative: olùtọ́jú igi àjàrà
  rationale: ‘Àgbẹ̀ àjàrà’ fi iṣẹ́ dídá àjàrà hàn láìfi èrò ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà; àṣàyàn kejì tẹnumọ́ ìtọ́jú rẹ̀ ní pàtó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ọ̀rọ̀ ní ibi tí ó yẹ, a sì yan ‘igi àjàrà’ láti mú kí àwòrán ohun ọ̀gbìn náà ṣe kedere.
