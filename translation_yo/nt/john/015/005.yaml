id: JHN.15.5
reference: John 15:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: yo
  text: Èmi ni àjàrà; ẹ̀yin ni àwọn ẹ̀ka rẹ̀. Ẹni tí ń dúró[a] nínú mi, tí èmi náà sì wà nínú rẹ̀[b], òun ni ó ń so èso púpọ̀, nítorí pé láìsí mi, ẹ kò lè ṣe ohunkóhun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú un sí “ẹni tí ń gbé nínú mi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí dídúró tàbí gbígbé nínú ẹni kan, ó sì tẹnu mọ́ ìtẹ̀síwájú ìbátan náà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì fún “rẹ̀” níbí jẹ́ akọ-ẹyọ kan, ṣùgbọ́n ó ń tọ́ka sí ẹnikẹ́ni tí ń dúró nínú Jésù. Ọ̀rọ̀-arọ́pò-orúkọ Yorùbá “rẹ̀” kò yà akọ sí abo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: igi àjàrà
  rationale: “Igi àjàrà” sọ irú ohun ọ̀gbìn tí àkàwé náà ń tọ́ka sí ní kedere, ó sì jẹ́ èdè Yorùbá àdánidá ju lílo “àjàrà” nìkan lọ, èyí tí ó tún lè tọ́ka sí èso rẹ̀.
- source_word: κλήματα
  choice: àwọn ẹ̀ka rẹ̀
  rationale: “Àwọn ẹ̀ka” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn apá igi tí ó yọ lára rẹ̀; fífi “rẹ̀” kún un mú ìbátan wọn pẹ̀lú igi àjàrà náà hàn gbangba.
- source_word: ὁ μένων
  choice: ẹni tí ó bá ń dúró
  rationale: “Ń dúró” pa ìtumọ̀ ìtẹ̀síwájú àti dídúró ṣinṣin nínú ìbátan mọ́, bí μένω ṣe rí nínú ọ̀rọ̀ Johanu. “Bá” jẹ́ kí gbólóhùn náà ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ tí ó kan ẹnikẹ́ni tí ó bá ṣe bẹ́ẹ̀.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: nínú mi ... nínú rẹ̀
  rationale: A pa “nínú” mọ́ ní ibi méjèèjì láti ṣètọ́jú àwòrán ìrẹ́pọ̀ àti wíwà inú ara ẹni tí Gíríìkì fi hàn, dípò yíyí i sí “pẹ̀lú,” èyí tí yóò dín agbára ọ̀rọ̀ náà kù.
- source_word: κἀγώ
  choice: tí èmi náà sì
  rationale: 'Ìtumọ̀ náà pa ìdáhùn ara-ẹni méjèèjì mọ́: ọmọ-ẹ̀yìn dúró nínú Jésù, Jésù náà sì dúró nínú ẹni náà.'
- source_word: φέρει καρπὸν πολύν
  choice: ó ń so èso púpọ̀
  rationale: “So èso” ni àkópọ̀ ọ̀rọ̀ Yorùbá àdánidá fún bí igi ṣe ń mú èso jáde; “ń” sì pa ìṣe tí ń bá a lọ mọ́.
- source_word: χωρὶς ἐμοῦ
  choice: láìsí mi
  rationale: “Láìsí mi” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká mu fún “yàtọ̀ sí mi/ní àìsí mi,” láìfi àlàyé ìtumọ̀ míì kún un.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: ẹ kò lè ṣe ohunkóhun
  rationale: Èyí sọ àìlágbára, kì í ṣe ìfòfindè; “ohunkóhun” lẹ́yìn “kò lè” jẹ́ Yorùbá àdánidá fún ìtumọ̀ Gíríìkì náà.
theological_decisions:
- issue: Ọ̀rọ̀ Johanu nípa wíwà inú ara ẹni
  choice: nínú mi ... nínú rẹ̀
  alternative: pẹ̀lú mi ... pẹ̀lú rẹ̀
  rationale: A pa “nínú” mọ́ láti fi ìrẹ́pọ̀ alájọṣe tí ẹsẹ náà sọ hàn, láìsọ bí a ṣe gbọ́dọ̀ tú ohun ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ yìí.
- issue: αὐτῷ tó jẹ́ akọ ẹyọ kan ní Gíríìkì ṣùgbọ́n tó dúró fún ẹnikẹ́ni
  choice: nínú rẹ̀, pẹ̀lú àlàyé ìsàlẹ̀-ìwé
  alternative: nínú ọkùnrin náà
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ “rẹ̀” kò fi akọ tàbí abo hàn ní Yorùbá, ó sì jẹ́ ìbámu gírámà tó pé fún ẹni ẹyọ kan. Àlàyé ìsàlẹ̀-ìwé pa agbára aṣojú ti akọ ẹyọ kan nínú Gíríìkì mọ́ láìfi akọ kún Yorùbá níbi tí èdè náà kò ti ṣe bẹ́ẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. “Igi àjàrà,” “àwọn ẹ̀ka,” àti “so èso” pa àkàwé iṣẹ́ àgbẹ̀ mọ́; ìtẹ̀síwájú “ń dúró/ń so” sì jẹ́ kí ìṣe tí ń bá a lọ hàn.
