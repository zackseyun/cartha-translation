id: JHN.15.7
reference: John 15:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: yo
  text: Bí ẹ̀yin bá dúró nínú mi, tí àwọn ọ̀rọ̀ mi sì dúró nínú yín, ẹ béèrè fún ohunkóhun tí ẹ bá fẹ́, a ó sì ṣe é fún yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: dúró / dúró
  rationale: “Dúró” sọ ìtẹ̀síwájú àti ìfaradà nínú ìbáṣepọ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere. Lílo ọ̀rọ̀ kan náà ní ibi méjèèjì pa àtúnwí Gíríìkì mọ́.
- source_word: ἐν ἐμοὶ / ἐν ὑμῖν
  choice: nínú mi / nínú yín
  rationale: “Nínú” pa àwòrán ìṣọ̀kan àti ìbáṣepọ̀ tímọ́tímọ́ tí ἐν ní nínú ọ̀rọ̀ Johanu mọ́, dípò fífi “pẹ̀lú” rọ́pò rẹ̀.
- source_word: τὰ ῥήματά μου
  choice: àwọn ọ̀rọ̀ mi
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì bójú mu fún àwọn ohun tí Jesu sọ, láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: ὃ ἐὰν θέλητε
  choice: ohunkóhun tí ẹ bá fẹ́
  rationale: Gbólóhùn yìí fi ohun tí wọ́n lè fẹ́ sílẹ̀ ní gbangba, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá òde òní.
- source_word: αἰτήσασθε
  choice: ẹ béèrè
  rationale: “Béèrè” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún fífi ìbéèrè tàbí ẹ̀bẹ̀ hàn, ó sì bójú mu nínú ọ̀rọ̀ àdúrà.
- source_word: γενήσεται ὑμῖν
  choice: a ó sì ṣe é fún yín
  rationale: Nínú àyíká ìdáhùn sí ẹ̀bẹ̀, gbólóhùn yìí sọ àbájáde γενήσεται ὑμῖν ní Yorùbá tó ṣe kedere àti àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín àwọn şartì àti ìlérí nípa ẹ̀bẹ̀
  choice: 'A pa àwọn şartì méjèèjì mọ́: kí àwọn ọmọ-ẹ̀yìn dúró nínú Jesu, kí àwọn ọ̀rọ̀ rẹ̀ sì dúró nínú wọn; lẹ́yìn náà ni àṣẹ láti béèrè àti ìlérí tẹ̀ lé.'
  alternative: Ìtumọ̀ òmìnira tí yóò mú kí ìlérí náà dà bí ohun tí kò ní şartì kankan.
  rationale: Ìṣètò Gíríìkì fi ìlérí ẹ̀bẹ̀ sábẹ́ gbólóhùn шартì ἐὰν. Ìtumọ̀ náà kò yọ şartì náà kúrò, bẹ́ẹ̀ ni kò fi àwọn àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ yìí kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbo. A pa àtúnwí “dúró” àti àwòrán “nínú” mọ́ láti ṣàfihàn ìṣọ̀kan ọ̀rọ̀ orísun.
