review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the generic substantival participle, the objects, the repeated verb of hatred, and the reference to the Father. However, the modal particle “bá” ordinarily gives the relative clause a conditional/prospective sense (“whoever/if someone should hate”), whereas the Greek present participle denotes a person characterized by present/generic hatred.
  naturalness: Removing “bá” produces an idiomatic Standard Yoruba generic statement. “Tún” naturally conveys the additive force of καί in this context more directly than clause-final “pẹ̀lú.”
  terminology: “Kórìíra” accurately renders μισέω, and capitalized “Baba mi” appropriately identifies God in the Johannine context without adding theological interpretation.
  issues:
  - severity: medium
    issue: The use of “bá” in “Ẹni tí ó bá kórìíra” introduces conditional/prospective modality.
    rationale: 'The source has ὁ ... μισῶν, a substantival present participle: “the one who hates.” It does not express a conditional or future contingency.'
  - severity: low
    issue: Clause-final “pẹ̀lú” is less direct for the additive force of καί.
    rationale: “Tún” idiomatically marks that hatred of Jesus entails hatred of his Father as well, while keeping the source’s concise assertion.
  revised_text: Ẹni tí ó kórìíra mi tún kórìíra Baba mi.
  revised_footnotes: []
  revision_rationale: The revision removes conditional/prospective force not present in the Greek, retains the generic singular construction and repeated verb, and uses natural Yoruba additive wording for καί.
