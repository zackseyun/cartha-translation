id: JHN.15.23
reference: John 15:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: yo
  text: Ẹni tí ó kórìíra mi tún kórìíra Baba mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Ẹni tí ó bá kórìíra
  rationale: Àpilẹ̀kọ pẹ̀lú participle ìsinsìnyí ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀-orúkọ, ó sì ń tọ́ka sí ẹnikẹ́ni tí ìṣe yìí ń ṣàpèjúwe. “Ẹni tí ó bá kórìíra” jẹ́ Yorùbá àdánidá tí ó pa agbára gbólóhùn gbogbogbò ẹyọ kan mọ́.
- source_word: ἐμὲ
  choice: mi
  rationale: Arọ́pò-orúkọ olùgbà ìṣe ni; “mi” ni ìtumọ̀ Yorùbá tààrà.
- source_word: μισῶν / μισεῖ
  choice: kórìíra / kórìíra
  rationale: μισέω túmọ̀ sí láti kórìíra tàbí láti ní ìkórìíra sí. Lílo “kórìíra” lẹ́ẹ̀mejì pa àtúnṣe ọ̀rọ̀ inú Gíríìkì mọ́, ó sì sọ òtítọ́ gbogbogbò kan.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ní àyíká yìí, καί fi hàn pé ẹni tí ó kórìíra Jésù tún kórìíra Baba rẹ̀. “Pẹ̀lú” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ “also” yìí hàn.
- source_word: τὸν πατέρα μου
  choice: Baba mi
  rationale: πατέρα pẹ̀lú μου jẹ́ “Baba mi” ní Yorùbá àdánidá. Lẹ́tà ńlá fún “Baba” fi hàn pé Ọlọ́run ni a ń tọ́ka sí gẹ́gẹ́ bí orúkọ ìbátan ọ̀wọ̀.
theological_decisions:
- issue: Lẹ́tà ńlá fún “Baba” nígbà tí ó ń tọ́ka sí Ọlọ́run
  choice: Baba mi
  alternative: baba mi
  rationale: Nínú Ìhìn Rere Jòhánù, “Baba mi” jẹ́ orúkọ ìbátan tí Jésù fi ń tọ́ka sí Ọlọ́run. Lẹ́tà ńlá ń ran òǹkàwé lọ́wọ́ láti mọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí láì yí ìtumọ̀ rẹ̀ padà.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; a sì pa ìṣọ̀kan àti àtúnṣe ọ̀rọ̀ inú orísun Gíríìkì mọ́.
