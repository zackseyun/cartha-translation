id: JHN.15.21
reference: John 15:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: yo
  text: Ṣùgbọ́n wọn yóò ṣe gbogbo nǹkan wọ̀nyí sí yín[a] nítorí orúkọ mi, nítorí wọn kò mọ ẹni tí ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lòdì sí yín.” Àpólà Gíríìkì náà lè tọ́ka sí àwọn ìṣe tí a darí sí àwọn ọmọ-ẹ̀yìn ní ọ̀nà ọ̀tá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn sí ọ̀rọ̀ tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ atọ́ka ταῦτα àti ìkúnrẹ́rẹ́ πάντα mọ́.
- source_word: ποιήσουσιν
  choice: wọn yóò ṣe
  rationale: Ó túmọ̀ ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ní tààrà, láì dín ìtumọ̀ rẹ̀ kù sí irú ìṣe kan pàtó.
- source_word: εἰς ὑμᾶς
  choice: sí yín
  rationale: Ó fi hàn pé àwọn ìṣe náà dojú kọ àwọn ọmọ-ẹ̀yìn, ṣùgbọ́n kò fi agbára mú un túmọ̀ sí ‘lòdì sí yín’; àṣàyàn ìtumọ̀ ọ̀tá náà wà nínú àlàyé ìsàlẹ̀.
- source_word: διὰ τὸ ὄνομά μου
  choice: nítorí orúkọ mi
  rationale: Ó sọ ìdí tàbí okùnfà, ó sì pa agbára ‘orúkọ’ mọ́ gẹ́gẹ́ bí ohun tí ó dúró fún ẹni Jesu, ìdánimọ̀ rẹ̀ àti àṣẹ rẹ̀.
- source_word: οὐκ οἴδασιν
  choice: wọn kò mọ
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, ó sì lè gba ìmọ̀ nípa ìbáṣepọ̀, kì í ṣe ìmọ̀ òtítọ́ lásán.
- source_word: τὸν πέμψαντά με
  choice: ẹni tí ó rán mi
  rationale: Ó túmọ̀ àpólà aláṣẹ̀dá náà lọ́nà àdánidá, láì fi orúkọ oyè kan tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ẹni tí ‘ẹni tí ó rán mi’ ń tọ́ka sí
  choice: A pa ìtọ́kasí sí Baba mọ́ ní ìkọ̀kọ̀ gẹ́gẹ́ bí ‘ẹni tí ó rán mi.’
  alternative: ‘Baba tí ó rán mi’
  rationale: Àyíká ìwé Johanu mú kí ẹni náà ṣe kedere, ṣùgbọ́n Gíríìkì kò lo ọ̀rọ̀ ‘Baba’ níbí. Èyí yẹra fún fífi oyè tí kò sí nínú orísun kún ẹsẹ náà.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìtẹ̀sí gbolohun orísun mọ́ láì jẹ́ kí ó di Yorùbá líle tàbí àjèjì.
