  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: yo
  text: Ẹ̀yin ni ọ̀rẹ́ mi bí ẹ bá ń ṣe ohun tí mo pàṣẹ fún yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Ẹ̀yin ni ọ̀rẹ́ mi bí ẹ bá ń ṣe àwọn ohun tí mo pàṣẹ fún yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ẹni kejì ọ̀pọ̀ ni, a sì gbé e sí iwájú fún ìtẹnumọ́. “Ẹ̀yin” jẹ́ ọ̀nà àdánidá láti fi ọ̀pọ̀ àti ìtẹnumọ́ náà hàn ní Yorùbá.
- source_word: φίλοι μού
  choice: ọ̀rẹ́ mi
  rationale: φίλοι túmọ̀ sí àwọn ẹni tí ìbáṣepọ̀ tímọ́tímọ́ wà láàárín wọn; Yorùbá sábà máa ń lo “ọ̀rẹ́ mi” láìfi àmì ọ̀pọ̀ kún un lẹ́yìn “ẹ̀yin”.
- source_word: ἐστε
  choice: ni
  rationale: Ní gbólóhùn ìdánimọ̀ Yorùbá, “ni” ni ó bá ọ̀rọ̀ náà mu jù fún “ẹ jẹ́/ẹ wà gẹ́gẹ́ bí,” ó sì jẹ́ kí gbólóhùn náà ṣe déédé.
- source_word: ἐὰν
  choice: bí
  rationale: Ó ṣàfihàn ipò tí ó ṣeé ṣe pẹ̀lú ọ̀rọ̀-ìṣe subjunctive; “bí” pa ìtumọ̀ ‘if’ mọ́, kò sì yí i sí ìgbà tí nǹkan bá ṣẹlẹ̀.
- source_word: ποιῆτε
  choice: ẹ bá ń ṣe
  rationale: Ìtòlẹ́sẹẹsẹ “bí ẹ bá ń ṣe” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ipò tí iṣe náà ń tẹ̀ síwájú. Kò fi dandan pé a gbọdọ̀ túmọ̀ present stem náà sí ‘máa bá a lọ’ lọ́nà tó le ju orísun lọ.
- source_word: ἃ
  choice: ohun tí
  rationale: Ọ̀rọ̀ arọ́pò ìbátan neuter plural ń tọ́ka sí àkóónú àwọn àṣẹ; “ohun tí” jẹ́ àdánidá ní Yorùbá, tí ó sì lè gba ìtumọ̀ àkójọpọ̀.
- source_word: ἐγὼ
  choice: mo
  rationale: Ẹni àkọ́kọ́ ni kókó ọ̀rọ̀ náà. Yorùbá fi “mo” hàn ní dandan; ìtẹnumọ́ Gíríìkì wà nínú àyíká ọ̀rọ̀, ṣùgbọ́n fífi “èmi” kún un lè mú kí ó lágbára ju bí ó ti yẹ lọ.
- source_word: ἐντέλλομαι
  choice: pa láṣẹ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí fífi àṣẹ aláṣẹ fún ẹnì kan. “Pa láṣẹ” pa agbára àṣẹ Jésù mọ́, kò sì sọ ọ́ di ìmọ̀ràn lásán.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dative plural ni, ó sì tọ́ka sí àwọn tí a fún ní àṣẹ. “Fún yín” jẹ́ àdánidá ní Yorùbá, ó sì mú ìbáṣepọ̀ náà ṣe kedere.
theological_decisions:
- issue: Ìbáṣepọ̀ gbólóhùn onípò láàárín jíjẹ́ ọ̀rẹ́ Jésù àti ìgbọràn
  choice: “Ẹ̀yin ni ọ̀rẹ́ mi bí ẹ bá ń ṣe ohun tí mo pa láṣẹ fún yín.”
  alternative: “Ẹ̀yin ni ọ̀rẹ́ mi nígbà tí ẹ bá ń ṣe ohun tí mo pa láṣẹ fún yín.”
  rationale: ἐὰν pẹ̀lú subjunctive fi ipò hàn ní pàtàkì, kì í ṣe àkókò lásán. Ìtumọ̀ yìí pa ìsopọ̀ tí ẹsẹ náà sọ láàárín ọ̀rẹ́ àti ìgbọràn mọ́, láìṣàlàyé rẹ̀ nípasẹ̀ ètò ẹ̀kọ́ ìgbàgbọ́ kan nípa èrè tàbí ìfaradà.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Ẹ̀yin” àti “yín” mú ọ̀pọ̀ ẹni tí Jésù ń bá sọ̀rọ̀ ṣe kedere; “ọ̀rẹ́ mi” jẹ́ ọ̀nà Yorùbá àdánidá bí ó tilẹ̀ jẹ́ pé φίλοι jẹ́ ọ̀pọ̀.
