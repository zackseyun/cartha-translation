  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: yo
  text: Èmi àti Bàbá jẹ́ ọ̀kan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ọ̀kan” jẹ́ aláìlákọ (neuter); èyí tẹnumọ́ ìsọ̀kan láìsọ pé Jesu àti Bàbá jẹ́ ẹni kan náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kìíní ẹyọ ni; lílo “Èmi” dípò àmì ẹni inú ọ̀rọ̀-ìṣe nìkan pa ìtẹnumọ́ tí ó wà nínú Gíríìkì mọ́.
- source_word: καὶ
  choice: àti
  rationale: Asopọ̀ tó rọrùn ni, ó so “Èmi” àti “Baba” pọ̀ láìfi ìtumọ̀ mìíràn kún un.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Nínú ọ̀rọ̀ Jòhánù, ó ń tọ́ka sí Baba Jesu gẹ́gẹ́ bí orúkọ ipò; lẹ́tà ńlá fi ìlò yìí hàn ní Yorùbá.
- source_word: ἕν
  choice: ọ̀kan
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ aláìní akọ tàbí abo; “ọ̀kan” ni ìtumọ̀ tààrà tó sì pa ìsọ̀kan mọ́ láìsọ pé Jesu àti Baba jẹ́ ẹni kan náà.
- source_word: ἐσμεν
  choice: jẹ́
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ti ẹni kìíní ọ̀pọ̀; bí ó tilẹ̀ jẹ́ pé “jẹ́” kò yí fọ́ọ̀mù padà ní Yorùbá, àwọn olùṣe méjì “Èmi àti Baba” pa ìyàtọ̀ wọn mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἕν aláìní akọ tàbí abo pẹ̀lú ἐσμεν ẹni kìíní ọ̀pọ̀ nínú gbólóhùn pàtàkì nípa Kristi
  choice: “Èmi àti Baba jẹ́ ọ̀kan” sọ ìsọ̀kan gidi láàárín Jesu àti Baba, nígbà tó ṣì pa ìyàtọ̀ wọn mọ́.
  alternative: “Èmi àti Baba jẹ́ ohun kan” tàbí “Èmi àti Baba wà ní ìṣọ̀kan.”
  rationale: '“Ọ̀kan” jẹ́ kí ìgbọ́kànlé àti ìfọ̀rọ̀wérọ̀ inú Gíríìkì dúró: kò sọ àwọn méjèèjì di ẹni kan náà, bẹ́ẹ̀ ni kò sọ gbólóhùn náà di àdéhùn èrò lasán. A kò fi ọ̀rọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún àyọkà.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ kúkúrú, ọ̀wọ̀, tó ṣeé lóye fún òǹkàwé òde òní.
