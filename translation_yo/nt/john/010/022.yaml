  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: yo
  text: Ní àkókò náà, Àjọ̀dún Ìyàsímímọ́ wáyé ní Jerusalẹmu[a]. Àkókò òtútù ni,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Hanukkah,” àjọ̀dún àwọn Júù tí wọ́n fi ń rántí bí wọ́n ṣe tún tẹ́ńpìlì náà yà sí mímọ́.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: wáyé
  rationale: Ọ̀rọ̀ náà ń fi ìṣẹ̀lẹ̀ kan hàn; “wáyé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àjọ̀dún náà ṣẹlẹ̀ tàbí pé a ṣe é.
- source_word: τότε
  choice: Ní àkókò náà
  rationale: Ó pa ìyípadà àkókò inú ìtàn mọ́ ní ọ̀nà tó ṣe kedere, tó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: τὰ ἐγκαίνια
  choice: Àjọ̀dún Ìyàsímímọ́
  rationale: Ó tú ìtumọ̀ orúkọ àjọ̀dún náà jáde dípò fífi orúkọ Hébérù tó wọ́pọ̀ lẹ́yìn náà sí ipò rẹ̀; “ìyàsímímọ́” bá àyẹyẹ ìyàsímímọ́ tẹ́ńpìlì mu.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: ní Jerusalẹmu
  rationale: Èyí ni gbólóhùn ibi tó rọrùn, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: χειμὼν ἦν
  choice: Àkókò òtútù ni
  rationale: Ó sọ àkókò ọdún náà ní tààràtà. Nítorí pé Yorùbá kò ní ọ̀rọ̀ ìbílẹ̀ kan tó bá “winter” mu pátápátá, “àkókò òtútù” jẹ́ ìtumọ̀ tó ṣe kedere jù.
theological_decisions:
- issue: Ìdánimọ̀ τὰ ἐγκαίνια
  choice: Àjọ̀dún Ìyàsímímọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: Hanukkah; Àjọ̀dún Hanukkah
  rationale: Ọ̀rọ̀ pàtàkì tú Gíríìkì náà sí Yorùbá kí ìtumọ̀ rẹ̀ lè yé òǹkàwé, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa orúkọ àjọ̀dún tí a mọ̀ sí Hanukkah àti ìtàn rẹ̀ mọ́.
translation_notes:
  register: Yorùbá àgbàdojú, ọ̀wọ̀, àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Àjọ̀dún Ìyàsímímọ́” jẹ́ kedere fún òǹkàwé lásán, “àkókò òtútù” sì yẹra fún fífi ẹ̀ka àsìkò ojú-ọjọ́ ilẹ̀ Yúróòpù kan wọ Yorùbá láìsí àlàyé.
