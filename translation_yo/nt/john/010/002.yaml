id: JHN.10.2
reference: John 10:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó ń wọlé nípasẹ̀ ẹnu ọ̀nà náà ni olùṣọ́ àwọn àgùntàn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “... ni olùṣọ́ kan fún àwọn àgùntàn.” Ọ̀rọ̀ Gíríìkì ποιμήν (“olùṣọ́”) kò ní àmì ìdánimọ̀ níbí, ṣùgbọ́n àyíká ọ̀rọ̀ tọ́ka sí olùṣọ́ tó lẹ́tọ̀ọ́, ní ìyàtọ̀ sí àwọn tó ń wọlé láìtọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Ṣùgbọ́n ẹni tí ó bá ... wọlé
  rationale: Ẹni tí ó bá ... wọlé sọ articular present participle náà di ọ̀rọ̀ àpèjúwe ẹni ní Yorùbá, ó sì pa ìtumọ̀ gbogbogbò mọ́. “Ṣùgbọ́n” fi ìyàtọ̀ sí ẹni tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú hàn.
- source_word: διὰ τῆς θύρας
  choice: gba ẹnu ọ̀nà wọlé
  rationale: Ọ̀rọ̀ yìí fi ìṣípò láti inú ẹnu ọ̀nà kọjá hàn ní Yorùbá àdánidá; “ẹnu ọ̀nà” ni ibi ìwọlé, kì í ṣe ọ̀nà tàbí ipa ọ̀nà lásán.
- source_word: ποιμήν
  choice: olùṣọ́ àgùntàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún ẹni tó ń tọ́jú àgùntàn. Ìṣètò “ni olùṣọ́...” lè jẹ́ definite tàbí indefinite ní Yorùbá, gẹ́gẹ́ bí predicate noun Gíríìkì tí kò ní article.
- source_word: τῶν προβάτων
  choice: àwọn àgùntàn
  rationale: A pa àwòrán ẹranko inú πρόβατα mọ́ dípò yíyí i sí “agbo,” èyí tí yóò túmọ̀ rẹ̀ gbòòrò sí i.
theological_decisions:
- issue: Bóyá ποιμήν jẹ́ definite nínú predicate
  choice: ni olùṣọ́ àgùntàn àwọn àgùntàn
  alternative: jẹ́ olùṣọ́ àgùntàn kan fún àwọn àgùntàn
  rationale: Gíríìkì kò fi article sí ποιμήν, ṣùgbọ́n àyíká ọ̀rọ̀ fi ẹni tó ní ẹ̀tọ́ wọlé wé àwọn olè àti ọlọ́ṣà. Yorùbá kò fi article ṣe ìyàtọ̀ yìí ní ọ̀nà kan náà, nítorí náà ìtumọ̀ pàtó tó bá àyíká mu lè dúró láìfi ẹ̀kọ́ Kristẹni míì kún àfiwé náà; àlàyé ìsàlẹ̀ jẹ́ kí àṣàyàn indefinite náà hàn.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. “Gba ẹnu ọ̀nà wọlé” jẹ́ ọ̀nà àdánidá láti sọ ìwọlé nípasẹ̀ ẹnu ọ̀nà; a pa àwòrán “àgùntàn” mọ́ ní gbogbo gbólóhùn náà.
