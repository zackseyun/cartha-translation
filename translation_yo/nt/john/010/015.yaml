id: JHN.10.15
reference: John 10:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: yo
  text: gẹ́gẹ́ bí Baba ti mọ̀ mí, àti bí mo ṣe mọ Baba, mo fi ìyè mi[a] lélẹ̀ fún àwọn àgùntàn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí mi.” Ní àyíká fífi ara ẹni rúbọ yìí, ìtumọ̀ náà ni “ìyè mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí ire àwọn àgùntàn.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ aṣojú tàbí ti ẹbọ.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra hàn ní ọ̀nà àdánidá, ó sì so ẹsẹ yìí pọ̀ mọ́ ọ̀rọ̀ ìmọ̀ ara ẹni tó ṣáájú.
- source_word: γινώσκει / γινώσκω
  choice: mọ̀ / mọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímọ ẹni, pẹ̀lú ìtumọ̀ ìbáṣepọ̀ tímọ́tímọ́; “mọ̀” pa ìsopọ̀ ọ̀rọ̀ náà mọ́ láì ṣe àlàyé rẹ̀ jù.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: Baba
  rationale: Èdè Gíríìkì lo orúkọ oyè náà pẹ̀lú árítíkì, kì í ṣe ọ̀rọ̀ arọ́pò oníhun; “Baba” bá ìlò Johanu mu ní Yorùbá.
- source_word: κἀγὼ
  choice: tí èmi náà sì
  rationale: Ó pa ìbáramu tó wà láàárín mímọ̀ tí Baba mọ Ọmọ àti mímọ̀ tí Ọmọ mọ Baba mọ́, ó sì gbé “èmi” ga bó ṣe wà nínú Gíríìkì.
- source_word: ψυχήν μου
  choice: ẹ̀mí mi
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí ìyè ẹni tí a fi rúbọ. “Ẹ̀mí mi” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún fífi ìyè ẹni sílẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ mú ìtumọ̀ náà ṣe kedere.
- source_word: τίθημι
  choice: fi ... lélẹ̀
  rationale: Àkójọpọ̀ “fi ẹ̀mí mi lélẹ̀” jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún lílo τίθημι pẹ̀lú ψυχή ní àyíká fífi ara ẹni rúbọ.
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Ó sọ pé fífi ìyè sílẹ̀ jẹ́ fún ire àwọn àgùntàn, láì dín agbára aṣojú tàbí ẹbọ ọ̀rọ̀ Gíríìkì náà kù sí ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
- source_word: τῶν προβάτων
  choice: àwọn àgùntàn
  rationale: Ó pa àwòrán olùṣọ́-àgùntàn mọ́ ní tààràtà dípò lílo ọ̀rọ̀ tí yóò túmọ̀ sí gbogbo agbo.
theological_decisions:
- issue: Agbára ὑπὲρ nínú fífi ara Jesu fúnni
  choice: nítorí àwọn àgùntàn
  alternative: ní ipò àwọn àgùntàn; fún ire àwọn àgùntàn
  rationale: “Nítorí” jẹ́ kí ìtumọ̀ ire, aṣojú, àti ẹbọ ṣí sílẹ̀, láì fi ẹ̀kọ́ ìsìn kan tí óórúkọ rẹ̀ hàn sí ohun tí Gíríìkì kò sọ ní pàtó.
- issue: Ìtumọ̀ ψυχή nínú àyíká yìí
  choice: ẹ̀mí mi, pẹ̀lú àlàyé pé ìtumọ̀ rẹ̀ níbí ni ìyè mi
  alternative: ìyè mi; ọkàn mi
  rationale: Àyíká ikú Olùṣọ́ Àgùntàn Rere fi hàn pé gbogbo ìyè Jesu ni ó fi sílẹ̀. Àlàyé ìsàlẹ̀ dènà kí “ẹ̀mí” má bàa yọrí sí ìtumọ̀ pé apá àìrí ti ènìyàn nìkan ni.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà pa ìbáramu mímọ̀ Baba àti Ọmọ mọ́, ó sì lo àwòrán “àwọn àgùntàn” ní tààràtà. Àwọn àmì ìsàlẹ̀ [a] àti [b] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé.
