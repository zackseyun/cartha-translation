review_pass:
  verdict: revise
  source_fidelity: Àwọn Júù and the causal contrast accurately retain Ἰουδαῖοι, Περὶ καλοῦ ἔργου, and ἀλλὰ περὶ βλασφημίας. The draft’s rendering of λιθάζομεν is understandable, but “sọ ọ́ ní òkúta” is less idiomatic and can be read as merely throwing a stone at him. “Ń sọ ọ́ lókùtù” clearly conveys stoning. For ποιεῖς σεαυτὸν θεόν, “fi ara rẹ ṣe Ọlọ́run” more closely conveys the accusation of making/presenting oneself as God than “sọ ara rẹ di Ọlọ́run,” which can suggest becoming God.
  naturalness: The revision uses idiomatic modern Standard Yorùbá while retaining the emphatic contrast and the accusation’s force. “Ìwọ tí o jẹ́ ènìyàn” is more natural than the heavier appositional phrase “ìwọ, ẹni tí ó jẹ́ ènìyàn.”
  terminology: “Ọ̀rọ̀-òdì sí Ọlọ́run” is retained as a clear contemporary rendering of βλασφημία. The proper name “Ọlọ́run” is appropriate in this monotheistic blasphemy accusation. The footnote preserves the grammatically possible alternative “ọlọ́run kan” without deciding beyond the Greek text.
  issues:
  - severity: medium
    issue: The phrase “ń sọ ọ́ ní òkúta” is not the clearest idiomatic rendering of stoning.
    rationale: It can suggest throwing a stone at Jesus rather than executing/attempting to execute him by stoning. “Ń sọ ọ́ lókùtù” is a more established and unambiguous Yorùbá expression.
  - severity: low
    issue: “Sọ ara rẹ di Ọlọ́run” may imply transformation into God.
    rationale: ποιεῖς σεαυτὸν θεόν concerns the charge that Jesus makes or represents himself as God. “Ń fi ara rẹ ṣe Ọlọ́run” conveys that accusation more precisely in Yorùbá.
  revised_text: Àwọn Júù dá a lóhùn pé, “Kì í ṣe nítorí iṣẹ́ rere kan ni a ń sọ ọ́ lókùtù, bí kò ṣe nítorí ọ̀rọ̀-òdì sí Ọlọ́run, àti nítorí pé ìwọ tí o jẹ́ ènìyàn ń fi ara rẹ ṣe Ọlọ́run.”[a]
  revised_footnotes:
