revisions:
- from: Àwọn Júù dá a lóhùn pé, “Kì í ṣe nítorí iṣẹ́ rere kan ni àwa ṣe ń sọ ọ́ ní òkúta, bí kò ṣe nítorí ọ̀rọ̀-òdì sí Ọlọ́run, àti nítorí pé ìwọ, ẹni tí ó jẹ́ ènìyàn, sọ ara rẹ di Ọlọ́run.”[a]
  to: Àwọn Júù dá a lóhùn pé, “Kì í ṣe nítorí iṣẹ́ rere kan ni a ń sọ ọ́ lókùtù, bí kò ṣe nítorí ọ̀rọ̀-òdì sí Ọlọ́run, àti nítorí pé ìwọ tí o jẹ́ ènìyàn ń fi ara rẹ ṣe Ọlọ́run.”[a]
  rationale: Àtúnṣe náà mú ọ̀nà tí a fi ń sọ ènìyàn lókùtù hàn kedere, ó sì yan ọ̀rọ̀ Yorùbá tí ó ba ẹ̀sùn “ṣe ara ẹni ní Ọlọ́run” mu dáadáa. Àlàyé ìsàlẹ̀ ṣì ń pa àṣàyàn anarthrous θεόν mọ́.
