    text: Tàbí, “ń fi ara rẹ ṣe ọlọ́run kan.” Ọ̀rọ̀ Gíríìkì θεόν kò ní article, ṣùgbọ́n nínú àyíká ẹ̀sùn ọ̀rọ̀-òdì sí Ọlọ́run yìí, “Ọlọ́run” ni ìtumọ̀ tí ó ṣeé ṣe jù lọ.
    reason: alternative_reading
