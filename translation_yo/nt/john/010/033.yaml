id: JHN.10.33
reference: John 10:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: yo
  text: Àwọn Júù dá a lóhùn pé, “Kì í ṣe nítorí iṣẹ́ rere kan ni a ń sọ ọ́ lókùtù, bí kò ṣe nítorí ọ̀rọ̀-òdì sí Ọlọ́run, àti nítorí pé ìwọ tí o jẹ́ ènìyàn ń fi ara rẹ ṣe Ọlọ́run.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń fi ara rẹ ṣe ọlọ́run kan.” Ọ̀rọ̀ Gíríìkì θεόν kò ní article, ṣùgbọ́n nínú àyíká ẹ̀sùn ọ̀rọ̀-òdì sí Ọlọ́run yìí, “Ọlọ́run” ni ìtumọ̀ tí ó ṣeé ṣe jù lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ, ó sì pa bí Jòhánù ṣe lo ọ̀rọ̀ náà mọ́ láì fi dandan sọ pé àwọn aṣáájú Júù nìkan ni, bí ó tilẹ̀ jẹ́ pé àwùjọ alátakò tí ó dojú kọ Jesu ni ọ̀rọ̀ náà ń tọ́ka sí níbí.
- source_word: Περὶ καλοῦ ἔργου
  choice: nítorí iṣẹ́ rere kan
  rationale: Ó mú ìdí tí wọ́n fi fẹ́ sọ ọ́ ní òkúta hàn, ó sì pa ẹyọ ọ̀rọ̀ ἔργου àti ìwà rere καλοῦ mọ́.
- source_word: λιθάζομέν
  choice: àwa ṣe ń sọ ọ́ ní òkúta
  rationale: Àkókò ìsinsìnyí nínú Gíríìkì bá ìṣe tàbí ète tí ó ń lọ lọ́wọ́ mu; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì mú ìwà líle ìṣẹ̀lẹ̀ náà hàn.
- source_word: βλασφημίας
  choice: ọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Ìtumọ̀ oníṣàlàyé yìí ṣe kedere fún òǹkàwé Yorùbá òde òní pé ẹ̀sùn náà jẹ́ sísọ ohun tí ń tàbùkù sí Ọlọ́run, dípò lílo ọ̀rọ̀ àyálò tí kò wọ́pọ̀.
- source_word: ἄνθρωπος ὢν
  choice: ìwọ, ẹni tí ó jẹ́ ènìyàn
  rationale: Ó tẹ̀ lé àkópọ̀ participle náà, ó sì pa ìyàtọ̀ tí àwọn olùfisùn fẹ́ ṣe láàárín ènìyàn àti Ọlọ́run mọ́, láì fi ọ̀rọ̀ “lásán” kún un.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: sọ ara rẹ di Ọlọ́run
  rationale: Ṣíṣe ara ẹni ní ohun kan ni àkópọ̀ ποιέω pẹ̀lú arọ́pò-orúkọ ara ẹni àti àpèjúwe accusative túmọ̀ sí. Ní àyíká ẹ̀sùn ọ̀rọ̀-òdì sí Ọlọ́run, “Ọlọ́run” ni ó ṣeé ṣe jù lọ, ṣùgbọ́n àìsí article mú kí “ọlọ́run kan” tún ṣeé ṣe ní gírámà; a pa èyí mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ θεόν nínú ẹ̀sùn ποιεῖς σεαυτὸν θεόν
  choice: Ọlọ́run
  alternative: ọlọ́run kan
  rationale: θεόν kò ní article, nítorí náà gírámà nìkan kò lè fòpin sí gbogbo àṣàyàn. Síbẹ̀, ẹ̀sùn ọ̀rọ̀-òdì sí Ọlọ́run àti àyíká ìwé Jòhánù fi hàn pé àwọn olùfisùn gbà pé Jesu ń fi ara rẹ sí ipò tí ó jẹ́ ti Ọlọ́run. Àlàyé ìsàlẹ̀ pa àṣàyàn kejì mọ́ láì sọ pé kò ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá ẹ̀dá èdè mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó jẹ́ ti ẹ̀ya kan pàtó.
