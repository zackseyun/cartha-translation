id: JHN.10.24
reference: John 10:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[b] yí i ká, wọ́n sì ń sọ fún un pé, “Títí di ìgbà wo ni ìwọ yóò máa mú wa wà nínú iyèméjì?[a] Bí ìwọ bá jẹ́ Mèsáyà, sọ fún wa ní kedere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ gangan: “Títí di ìgbà wo ni ìwọ yóò máa gbé ọkàn wa sókè?” Àkànlò-èdè ni èyí fún mímú ẹnì kan dúró nínú àìdánilójú tàbí iyèméjì.'
    reason: lexical_alternative
  - marker: b
    text: Nínú Jòhánù, “àwọn Júù” lè tọ́ka sí àwọn aláṣẹ Jùdíà tàbí àwọn Júù tí wọ́n ń tako Jésù ní àyíká ọ̀rọ̀ kan, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: yí i ká
  rationale: Ó pa ìtumọ̀ yíni ká mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè fi hàn pé wọ́n há a mọ́ àárín wọn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa agbára àsopọ̀ àti ìtẹ̀síwájú ìtàn tí οὖν ní mọ́.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì láì fi kún un pé àwọn aṣáájú ni; àlàyé ìsàlẹ̀ ṣàkíyèsí pé ìtọ́kasí náà lè dín kù ní àyíká ọ̀rọ̀ Jòhánù.
- source_word: ἔλεγον
  choice: wọ́n sì ń wí
  rationale: Àmì ìṣe aláìparí náà lè tọ́ka sí ọ̀rọ̀ tí ń lọ lọ́wọ́ tàbí tí a ń tún sọ; “ń wí” pa ìhà yìí mọ́.
- source_word: Ἕως πότε
  choice: Yóò ti pẹ́ tó
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè bí ohun kan yóò ṣe pẹ́ tó.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: mú wa wà nínú iyèméjì
  rationale: Àkànlò-èdè náà túmọ̀ sí fífi ẹnì kan sínú àìdánilójú tàbí ìdádúró ọkàn; ìtumọ̀ yìí ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán gangan mọ́.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níbí, Χριστός jẹ́ oyè ẹni àmì òróró tí àwọn Júù ń retí, kì í ṣe orúkọ lasan.
- source_word: εἰπὲ ἡμῖν
  choice: sọ fún wa
  rationale: Ó jẹ́ àṣẹ tààrà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: παρρησίᾳ
  choice: ní kedere
  rationale: Ní àyíká yìí, wọ́n ń béèrè fún ọ̀rọ̀ tí kò ní iyèméjì, nítorí náà “ní kedere” mú ìtumọ̀ náà jáde dáadáa.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ọba-olùdáǹdè tí àwọn Júù ń retí, kì í ṣe bí orúkọ ẹni.
- issue: Àwọn tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Ẹsẹ̀ náà kò sọ ní pàtó pé àwọn olórí ni. Nítorí náà, a pa gbólóhùn Gíríìkì mọ́ nínú ẹsẹ̀, a sì fi àlàyé ṣàkíyèsí ìtumọ̀ tó lè dín kù ní àyíká ọ̀rọ̀.
translation_notes:
  register: Yorùbá àṣàjọṣe, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. “Yí i ká” àti “nínú iyèméjì” jẹ́ àdánidá, ṣùgbọ́n wọ́n tún pa ìfarahàn ìkọlù àti àìdánilójú inú ọ̀rọ̀ orísun mọ́.
