id: JHN.10.16
reference: John 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: yo
  text: Mo sì ní àwọn àgùntàn mìíràn tí kì í ṣe ti àgbàlá àgùntàn yìí. Mo gbọ́dọ̀ mú àwọn náà wá pẹ̀lú, wọn yóò sì fetí sí ohùn mi.[a] Wọn yóò sì di agbo àgùntàn kan, olùṣọ́-àgùntàn kan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọn yóò gbọ́ ohùn mi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbọ́” tàbí “fetí sí”; níbí ó ṣeé ṣe kó ní ìtumọ̀ gbígbọ́ tó ń dáhùn.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ọ̀rọ̀ àkọ́kọ́ (αὐλή) túmọ̀ sí ibi tí a fi ààbò yí ká fún àgùntàn, ṣùgbọ́n èkejì (ποίμνη) túmọ̀ sí àkójọpọ̀ àgùntàn fúnra wọn. Nítorí náà, gbólóhùn ìkẹyìn túmọ̀ sí “agbo àgùntàn kan,” kì í ṣe “àgbàlá àgùntàn kan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: àwọn àgùntàn mìíràn
  rationale: πρόβατα túmọ̀ sí àgùntàn lápapọ̀, kì í ṣe ọ̀dọ́-àgùntàn ní pàtó; ἄλλα sì tọ́ka sí àwọn mìíràn ní àfikún sí àwọn tí a ti ń sọ̀rọ̀ nípa wọn.
- source_word: αὐλή
  choice: agbo
  rationale: Nínú àkàwé olùṣọ́-àgùntàn yìí, αὐλή jẹ́ ibi tí a fi ààbò yí ká fún àgùntàn. “Agbo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi tí a ń kó ẹran sí, bó tilẹ̀ jẹ́ pé ó tún lè tọ́ka sí àkójọpọ̀ ẹran; àlàyé ìsàlẹ̀ fi ìyàtọ̀ Gíríìkì hàn.
- source_word: κἀκεῖνα
  choice: àwọn náà ... pẹ̀lú
  rationale: Ó padà tọ́ka sí àwọn àgùntàn mìíràn, ó sì pa ìtumọ̀ “àwọn náà pẹ̀lú” mọ́ ní Yorùbá àdánidá.
- source_word: δεῖ με ἀγαγεῖν
  choice: Mo gbọ́dọ̀ mú ... wá
  rationale: “Gbọ́dọ̀” pa agbára ìdandan δεῖ mọ́ láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ sí i; “mú ... wá” sì ṣàfihàn ἀγαγεῖν ní ọ̀nà àdánidá.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: wọn yóò fetí sí ohùn mi
  rationale: ἀκούω lè túmọ̀ sí gbọ́ tàbí fetí sí. Nínú àyíká yìí, “fetí sí” fi ìgbọ́ran tó ń dáhùn hàn, láìpa ìtumọ̀ “gbọ́” rẹ́.
- source_word: γενήσονται
  choice: wọn yóò ... di
  rationale: γίνομαι níbí fi ìyípadà sí ipò kan hàn; “di” pa ìtumọ̀ “become” mọ́ ju gbolohun àìní ẹni “yóò sí” lọ.
- source_word: μία ποίμνη
  choice: agbo kan
  rationale: ποίμνη jẹ́ àkójọpọ̀ àgùntàn, ìyẹn flock. Yorùbá máa ń lo “agbo” fún àkójọpọ̀ ẹran náà; àlàyé ìsàlẹ̀ jẹ́ kó ṣe kedere pé ọ̀rọ̀ Gíríìkì yìí yàtọ̀ sí αὐλή.
- source_word: εἷς ποιμήν
  choice: olùṣọ́-àgùntàn kan
  rationale: ποιμήν jẹ́ ẹni tó ń ṣọ́ àgùntàn; ọ̀rọ̀ yìí pa àwòrán ìṣọ́-àgùntàn mọ́ ní kedere.
theological_decisions:
- issue: Ìyàtọ̀ láàárín αὐλή àti ποίμνη
  choice: agbo yìí ... agbo kan, pẹ̀lú àlàyé ìsàlẹ̀
  alternative: ibùdó àgùntàn yìí ... agbo kan
  rationale: 'Gíríìkì lo ọ̀rọ̀ méjì ọ̀tọ̀: αὐλή fún ibi tí a fi ààbò yí ká, àti ποίμνη fún àkójọpọ̀ àgùntàn. Nítorí “agbo” ní Yorùbá lè gba ìtumọ̀ méjèèjì, àlàyé ìsàlẹ̀ pa ìyàtọ̀ orísun mọ́, láìfi èrò pé gbogbo wọn gbọdọ̀ wà nínú ilé-iṣẹ́ kan ṣoṣo kún ọ̀rọ̀ náà.'
- issue: Agbára δεῖ
  choice: Mo gbọ́dọ̀ mú àwọn náà wá pẹ̀lú
  alternative: Ó ṣe pàtàkì kí n mú àwọn náà wá pẹ̀lú
  rationale: “Gbọ́dọ̀” pa ìdandan tó wà nínú δεῖ mọ́, ṣùgbọ́n kò sọ ìdí tàbí irú ìdandan náà di ẹ̀kọ́ ìgbàgbọ́ pàtó.
- issue: Ìgbọ́ tàbí fífetí sí nínú ἀκούω
  choice: fetí sí ohùn mi
  alternative: gbọ́ ohùn mi
  rationale: Àyíká olùṣọ́-àgùntàn nínú Jòhánù ṣe àtìlẹ́yìn fún ìgbọ́ tó ní ìdáhùn nínú; àlàyé ìsàlẹ̀ sì pa àṣàyàn “gbọ́” mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Olùṣọ́-àgùntàn” mú àwòrán ποιμήν hàn gbangba; “agbo” jẹ́ ọ̀rọ̀ àdánidá ṣùgbọ́n ó ní ìtumọ̀ méjì ní Yorùbá, nítorí náà a fi àlàyé [b] ṣọ́ ìyàtọ̀ tó wà nínú Gíríìkì.
