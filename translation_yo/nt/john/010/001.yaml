id: JHN.10.1
reference: John 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: yo
  text: “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹni tí kò gba ilẹ̀kùn[a] wọ inú ọgbà àgùntàn[b], ṣùgbọ́n tí ó gun wọlé láti ibòmíràn—ẹni náà ni olè àti ọlọ́ṣà[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gba ibodè wọ.” Ọ̀rọ̀ Gíríìkì θύρα lè túmọ̀ sí “ilẹ̀kùn” tàbí “ibodè,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “inú àgọ́ àgùntàn” tàbí “inú àgbàlá àwọn àgùntàn.” Ọ̀rọ̀ Gíríìkì αὐλή ń tọ́ka sí àgbàlá tàbí ibi tí a fi odi yí ká.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì ya “olè” (κλέπτης) sọ́tọ̀ sí “ọlọ́ṣà” (λῃστής); èkejì sábà máa ń tọ́ka sí ẹni tí ń jalè pẹ̀lú ipá tàbí ìwà ipá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnwí ìtẹnumọ́ náà mọ́, ó sì sọ agbára ọ̀rọ̀ ìṣáájú náà ní Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ó jẹ́ ọ̀nà ọ̀wọ̀ àti tààrà láti túmọ̀ gbólóhùn ọ̀rọ̀-sísọ náà.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: ẹni tí kò bá ... wọ
  rationale: Ó mú ìtumọ̀ ẹni kan tí ó dúró fún ẹnikẹ́ni jáde láìlo èdè àtijọ́.
- source_word: διὰ τῆς θύρας
  choice: gba ẹnu-ọ̀nà wọ
  rationale: Ẹnu-ọ̀nà lè tọ́ka sí ilẹ̀kùn tàbí ibodè; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa àwòrán ọ̀nà ìwọlé mọ́.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: inú àgọ́ àwọn àgùntàn
  rationale: Àgọ́ àwọn àgùntàn sọ ibi tí a fi odi yí ká fún àgùntàn ní kedere nínú àyíká ọ̀rọ̀ olùṣọ́-àgùntàn.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: ṣùgbọ́n tí ó bá gun ibòmíràn wọlé
  rationale: “Gun” pa ìṣe gígun kọjá odi mọ́, “ibòmíràn” sì fi ọ̀nà tàbí ibi mìíràn hàn.
- source_word: ἐκεῖνος
  choice: ẹni náà
  rationale: Ó pa agbára ìtọ́kasí ọ̀rọ̀ Gíríìkì mọ́ láìfi akọ tàbí abo kún ohun tí Yorùbá kò nílò láti sọ.
- source_word: κλέπτης
  choice: olè
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń jí ohun ní ìkọ̀kọ̀.
- source_word: λῃστής
  choice: ọlọ́ṣà
  rationale: Ó ṣe ìyàtọ̀ sí olè, ó sì lè ní ìtumọ̀ ẹni tí ń fi ipá tàbí ìwà ipá gba ohun.
theological_decisions:
- issue: Àwòrán àkàwé αὐλή/θύρα
  choice: Túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí ẹnu-ọ̀nà àti àgọ́ àwọn àgùntàn, láìṣàlàyé ẹni tàbí ohun tí wọ́n dúró fún.
  alternative: Lo “ibodè” àti “ọgbà àgùntàn,” tàbí fi ìtumọ̀ àkàwé rẹ̀ hàn gbangba.
  rationale: Ẹsẹ yìí bẹ̀rẹ̀ àkàwé tí àyíká ọ̀rọ̀ yóò ṣàlàyé; ìtumọ̀ kò gbọ́dọ̀ fi ẹ̀kọ́ ìtumọ̀ tí ẹsẹ náà kò tíì sọ kún un.
- issue: Ìyàtọ̀ láàárín κλέπτης àti λῃστής
  choice: Pa àwọn ọ̀rọ̀ méjèèjì mọ́ gẹ́gẹ́ bí “olè àti ọlọ́ṣà.”
  alternative: Darapọ̀ wọn sí ọ̀rọ̀ kan ṣoṣo fún ẹni tí ń jalè.
  rationale: Orísun Gíríìkì mọ̀ọ́mọ̀ fi ìjìnlẹ̀ ìtumọ̀ méjì hàn, nígbà tí λῃστής sábà máa ń tọ́ka sí jíjínigbé tàbí jíjalè pẹ̀lú ipá.
translation_notes:
  register: Yorùbá boṣewa oníyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “wí” fún ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ mímọ́, ṣùgbọ́n a yẹra fún àtijọ́ èdè tí kò rọrùn. Àwọn àmì àlàyé [a], [b], àti [c] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
