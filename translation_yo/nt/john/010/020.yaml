source:
  edition: SBLGNT
  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀pọ̀ nínú wọn ń sọ pé, “Ó ní ẹ̀mí èṣù, orí rẹ̀ sì dàrú. Èé ṣe tí ẹ fi ń fetí sí i?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; “ń sọ” mú ìtumọ̀ yìí jáde lọ́nà àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ìhùwàsí rere tí ó ṣáájú hàn; “Ṣùgbọ́n” mú agbára ìtakò náà jáde.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: ọ̀pọ̀ nínú wọn
  rationale: Ó pa ìtumọ̀ apá-kan-nínú-àwùjọ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé.
- source_word: Δαιμόνιον ἔχει
  choice: Ó ní ẹ̀mí èṣù
  rationale: Ìtumọ̀ tààrà ni fún gbólóhùn Gíríìkì náà, láì yí i sí àlàyé ẹ̀kọ́ ìgbàgbọ́ pé ẹ̀mí èṣù ti gbà á.
- source_word: μαίνεται
  choice: orí rẹ̀ dàrú
  rationale: Ó sọ ẹ̀sùn pé ọpọlọ rẹ̀ kò ṣiṣẹ́ déédéé ní èdè Yorùbá òde òní, láì lò ọ̀rọ̀ ìṣègùn pàtó tí Gíríìkì kò sọ.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Èé ṣe tí ẹ fi ń fetí sí i?
  rationale: τί túmọ̀ sí “nítorí kí ni?” ní àyíká yìí, ἀκούω pẹ̀lú ọ̀rọ̀-orúkọ ní ipò genitive sì ní agbára “fetí sí”; ìbéèrè Yorùbá yìí pa ẹ̀sùn náà mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ẹ̀sùn ọ̀tá nípa ipò Jésù
  choice: Ó ní ẹ̀mí èṣù, orí rẹ̀ sì dàrú
  alternative: Ẹ̀mí èṣù ti gbà á, ó sì ya wèrè
  rationale: Àṣàyàn náà dúró sítòsí ìṣètò ọ̀rọ̀ Gíríìkì “ó ní ẹ̀mí èṣù,” ó sì pa ìforígbárí inú ìtàn mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un tàbí sọ ẹ̀sùn náà di ìwádìí ìṣègùn.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí pé ìyàtọ̀ Gẹ̀ẹ́sì náà kò pọndandan ní Yorùbá.
