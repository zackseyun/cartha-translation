  source_fidelity: 'Ìpín àkọ́kọ́ náà ṣàfihàn ἐζήτουν, πάλιν, àti πιάσαι dáadáa: “wọ́n tún ń gbìyànjú láti mú un.” Ṣùgbọ́n “ó bọ́ lọ́wọ́ wọn” túmọ̀ ἐξῆλθεν ní ọ̀nà ìtúmọ̀-àbájáde (“ó sá/ó yọ”) dípò kí ó pa ọ̀rọ̀-ìṣe “ó jáde” mọ́. Àtúnṣe náà pa àwòrán àti ìfaradà ọ̀rọ̀ Giriki mọ́ láìjẹ́ kí Yorùbá dà bí ọ̀rọ̀ àjèjì.'
  naturalness: “Ó jáde kúrò lọ́wọ́ wọn” jẹ́ Yorùbá boṣewa tí ó ṣe kedere, ó sì ṣì gbé ìtumọ̀ ìkáwọ́/agbara tí “lọ́wọ́ wọn” ní. “Nítorí náà” àti “wọ́n tún ń gbìyànjú láti mú un” jẹ́ èdè àdánidá fún àkọsílẹ̀ yìí.
