base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: yo
  text: Nítorí náà, wọ́n tún ń gbìyànjú láti mú un, ṣùgbọ́n ó jáde kúrò lọ́wọ́ wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó bọ́ lọ́wọ́ wọn.” Ní tààràtà, ọ̀rọ̀ Giriki náà ní, “ó jáde kúrò ní ọwọ́ wọn”; “ọwọ́” níbí jẹ́ ọ̀rọ̀ àpẹẹrẹ fún agbára tàbí ìṣàkóso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: wọ́n ń gbìyànjú
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ó ń lọ lọ́wọ́ tàbí ìgbìyànjú tí kò ṣàṣeyọrí hàn. “Ń gbìyànjú” jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ọ̀rọ̀ àti ìjà tí ó ṣáájú, ó sì fi àbájáde rẹ̀ hàn.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé wọ́n ti gbìyànjú láti mú Jésù tẹ́lẹ̀.
- source_word: πιάσαι
  choice: láti mú un
  rationale: “Mú un” jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún líle ẹni mú; kò fi ìtumọ̀ òfin pàtó bí “mú un ní àṣẹ” kún ọ̀rọ̀ náà.
- source_word: ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν
  choice: ó bọ́ lọ́wọ́ wọn
  rationale: Èdè àpẹẹrẹ Giriki náà túmọ̀ sí pé ó jáde kúrò lábẹ́ agbára tàbí ìkáwọ́ wọn. “Bọ́ lọ́wọ́ wọn” jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ‘ọwọ́’ mọ́.
theological_decisions:
- issue: Bóyá kí a sọ ìdálọ́wọ́ Jésù di gbangba pẹ̀lú ọ̀rọ̀ bí “sá àsálà,” tàbí kí a pa àwòrán ọ̀rọ̀ Giriki mọ́
  choice: ó bọ́ lọ́wọ́ wọn
  alternative: ó sá àsálà kúrò lọ́wọ́ wọn; ó jáde kúrò ní ọwọ́ wọn
  rationale: Giriki kò lo ọ̀rọ̀-ìṣe pàtó fún sísá àsálà; ó sọ pé ó “jáde kúrò ní ọwọ́ wọn.” Àṣàyàn Yorùbá yìí sọ àbájáde náà ní èdè àdánidá láìfi àlàyé ìṣẹ̀lẹ̀ tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó mọ́gbọ́n dání, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “bọ́ lọ́wọ́ wọn” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá tí ó tún pa àwòrán ọwọ́ àti ìkáwọ́ inú Giriki mọ́.
