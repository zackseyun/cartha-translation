id: JHN.10.8
reference: John 10:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: yo
  text: Gbogbo àwọn tí wọ́n wá ṣáájú mi jẹ́ olè àti ọlọ́ṣà[a], ṣùgbọ́n àwọn àgùntàn kò fetí sí wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n wá síwájú mi.” Gbólóhùn náà lè túmọ̀ sí “ṣáájú mi” ní ti àkókò, tàbí sí àwọn tí wọ́n wá síwájú tí wọ́n sì ń sọ pé àwọn ní àṣẹ láìsí Jésù. Àyíká ọ̀rọ̀ ń tọ́ka sí àwọn olùṣọ́ èké dípò gbogbo àwọn ìránṣẹ́ Ọlọ́run ìṣáájú.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Gbogbo àwọn tí
  rationale: Ó ṣàfihàn gbogbo ẹgbẹ́ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἦλθον
  choice: ó wá
  rationale: Aorist náà tọ́ka sí ìṣe tí ó ti ṣẹlẹ̀; ìṣe náà fara mọ́ olùṣe ọ̀pọ̀ nípasẹ̀ ‘àwọn tí ó wá’ ní Yorùbá.
- source_word: πρὸ ἐμοῦ
  choice: ṣáájú mi
  rationale: Ó lè túmọ̀ sí ṣáájú ní àkókò tàbí wíwá síwájú ẹni; ọ̀rọ̀ àlàyé pa ìtumọ̀ méjèèjì mọ́.
- source_word: κλέπται
  choice: olè
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń jí ohun ní àìtọ́.
- source_word: λῃσταί
  choice: ọlọ́ṣà
  rationale: Ó yà sí ‘olè’ ó sì lè ní ìtumọ̀ ẹni tí ń fi ipá tàbí ìwà jagidijagan gba ohun.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìtakora tó ṣe kedere hàn ní èdè Yorùbá ọlọ́wọ̀.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: kò fetí sí wọn
  rationale: Nínú àwòrán olùṣọ́-àgùntàn, gbígbọ́ ní ìtumọ̀ fífetí sí ohùn pẹ̀lú ìdáhùn, kì í ṣe kíkàn gbọ́ ohùn lásán.
- source_word: τὰ πρόβατα
  choice: àwọn àgùntàn
  rationale: Ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún ọ̀pọ̀ πρόβατα nínú àkòrí olùṣọ́-àgùntàn.
theological_decisions:
- issue: Ìwọ̀n àti agbára ọ̀rọ̀ ‘gbogbo àwọn tí ó wá ṣáájú mi’
  choice: A túmọ̀ ọ̀rọ̀ náà ní tààrà gẹ́gẹ́ bí ‘Gbogbo àwọn tí ó wá ṣáájú mi,’ láì dín ìwọ̀n rẹ̀ kù nínú ẹsẹ̀ náà.
  alternative: ‘Gbogbo àwọn tí ó wá síwájú mi,’ tàbí kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí àwọn tí wọ́n gba àṣẹ olùṣọ́ tàbí Mèsáyà fún ara wọn láìsí Jésù.
  rationale: Gíríìkì náà gbòòrò ní ìrísí, ṣùgbọ́n àyíká ọ̀rọ̀ ń tọ́ka sí àwọn olùṣọ́ èké, kì í ṣe dandan gbogbo àwọn ìránṣẹ́ Ọlọ́run ìṣáájú. A pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà mọ́ nínú ẹsẹ̀, a sì fi àlàyé sí àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Fetí sí’ mú ìtumọ̀ gbígbọ́ tí ó ní ìdáhùn jáde, ‘olè àti ọlọ́ṣà’ sì pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjì mọ́.
