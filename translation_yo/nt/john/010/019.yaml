id: JHN.10.19
reference: John 10:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: yo
  text: Nítorí àwọn ọ̀rọ̀ wọ̀nyí, ìyapa tún ṣẹlẹ̀ láàárín àwọn Júù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ ‘láàárín àwọn ará Jùdíà,’ tàbí, ní àwọn àyíká ọ̀rọ̀ kan nínú Jòhánù, ‘láàárín àwọn olórí Júù.’ ‘Àwọn Júù’ níhìn-ín tẹ̀lé ọ̀rọ̀ Gíríìkì, ṣùgbọ́n nínú Ìhìn Rere Jòhánù, ọ̀rọ̀ náà sábà máa ń tọ́ka sí ẹgbẹ́ kan pàtó gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: ìyapa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíya tàbí pínpín; níhìn-ín ó ń tọ́ka sí bí èrò àwọn ènìyàn ṣe pín sí méjì nítorí ọ̀rọ̀ Jesu.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé irú ìyapa bẹ́ẹ̀ ti ṣẹlẹ̀ rí nínú ìtàn náà.
- source_word: ἐγένετο
  choice: ṣẹlẹ̀
  rationale: Ó sọ pé ìṣẹ̀lẹ̀ tàbí ipò kan wá sílẹ̀; ‘ṣẹlẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: láàárín àwọn Júù
  rationale: Èyí tẹ̀lé ìtumọ̀ gírámà Gíríìkì ní tààrà, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ tó lè jẹ́ ‘àwọn ará Jùdíà’ tàbí ‘àwọn olórí Júù’ mọ́.
- source_word: διὰ
  choice: Nítorí
  rationale: Pẹ̀lú ọ̀rọ̀ inú accusative, διά ń sọ ohun tó fa ìṣẹ̀lẹ̀; ‘Nítorí’ fi ìdí náà hàn kedere.
- source_word: τοὺς λόγους τούτους
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Ó ń tọ́ka sí àwọn ohun tí Jesu ṣẹ̀ṣẹ̀ sọ; gbolohun yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí Ἰουδαῖοι ń tọ́ka sí nínú Ìhìn Rere Jòhánù
  choice: A lo ‘àwọn Júù’ nínú ọ̀rọ̀ pàtàkì, a sì fi àlàyé kún un.
  alternative: ‘àwọn ará Jùdíà’ tàbí ‘àwọn olórí Júù’
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ tó sinmi lórí àyíká ọ̀rọ̀. Lílo ‘àwọn Júù’ pa ìtumọ̀ tààrà mọ́, nígbà tí àlàyé ṣe ìdènà fún fífi ẹ̀sùn kan gbogbo àwọn Júù láìyàtọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A yan ‘ìyapa’ dípò ọ̀rọ̀ tó lè dà bí ìjà gbangba, kí a lè pa ìtumọ̀ ìdáhùn tó pín sí ọ̀nà méjì mọ́.
