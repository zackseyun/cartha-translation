source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: yo
  text: Jésù dá wọn lóhùn pé, “A kò ha kọ ọ́ nínú Òfin yín pé, ‘Mo sọ pé, àwọn ọlọ́run ni ẹ̀yin’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀dá ọ̀run.” Jésù ń fa ọ̀rọ̀ yọ láti Sáàmù 82:6, níbi tí ìtumọ̀ ọ̀rọ̀ náà ti jẹ́ ọ̀ràn àríyànjiyàn. Ọ̀rọ̀ pàtàkì pa ọ̀rọ̀ àyọlò náà mọ́ ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù dá wọn lóhùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìdáhùn nínú ìjíròrò, ó sì pa ẹni tó dáhùn àti àwọn tí ó dá lóhùn mọ́.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: A kò ha kọ ọ́
  rationale: Ìbéèrè àtakò yìí ń retí ìdáhùn rere; ‘kò ha’ fi ipa ìbéèrè Gíríìkì hàn lọ́nà Yorùbá tó bójú mu.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: sínú Òfin yín
  rationale: ‘Òfin’ níbí ń tọ́ka sí Ìwé Mímọ́ àwọn Júù ní ìtumọ̀ gbígbòòrò, nítorí pé àyọlò náà wá láti Sáàmù 82:6.
- source_word: Ἐγὼ εἶπα
  choice: Èmi sọ pé
  rationale: ‘Èmi’ pa arọ́pò-orúkọ tí a fi hàn gbangba nínú Gíríìkì mọ́, láìfi ìtumọ̀ míì kún un.
- source_word: Θεοί ἐστε
  choice: ọlọ́run ni ẹ̀yin
  rationale: Èyí pa ọ̀rọ̀ àyọlò náà mọ́ ní tààrà, láìyí copula náà sí ‘a pè yín ní.’ Nínú Yorùbá, ọ̀rọ̀-orúkọ lẹ́yìn ‘ni’ kì í sábà gba àmì púpọ̀, ṣùgbọ́n ‘ẹ̀yin’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ θεοί nínú àyọlò Jésù láti Sáàmù 82:6
  choice: ọlọ́run
  alternative: àwọn ẹ̀dá ọ̀run
  rationale: ‘Ọlọ́run’ ni ìtumọ̀ tààrà jù lọ fún θεοί nínú àyọlò náà, ó sì pa agbára ọ̀rọ̀ Jésù àti àìdánilójú ìtumọ̀ Sáàmù náà mọ́. A fi ìtumọ̀ àlàyé sí àkọsílẹ̀ ìsàlẹ̀ dípò kí a fi yanju ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ náà nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì pa ìrísí ìbéèrè àtakò àti ìṣòro ìtumọ̀ ọ̀rọ̀ θεοί mọ́.
