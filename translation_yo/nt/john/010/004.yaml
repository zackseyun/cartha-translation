id: JHN.10.4
reference: John 10:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: yo
  text: Nígbà tí ó bá ti mú gbogbo àwọn tirẹ̀ jáde[a], ó máa ń lọ níwájú wọn, àwọn àgùntàn náà sì máa ń tẹ̀ lé e, nítorí wọ́n mọ̀ ohùn rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí ‘lé gbogbo àwọn tirẹ̀ jáde’ tàbí ‘darí gbogbo àwọn tirẹ̀ jáde’; ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ lílé tàbí mímú wọn jáde kúrò nínú ọgbà àgùntàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Nígbà tí ó bá ti
  rationale: Ó fi àkókò tí kò ní ìdíwọ̀ pàtó hàn pẹ̀lú ìṣe tí a retí pé yóò parí; ó bá ìtumọ̀ ‘nígbà tí/nígbàkigbà tí’ mu ní Yorùbá.
- source_word: τὰ ἴδια πάντα
  choice: gbogbo àwọn tirẹ̀
  rationale: Ó pa ọ̀rọ̀ Gíríìkì tó túmọ̀ sí gbogbo ohun tàbí àwọn ẹni tirẹ̀ mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé àwọn àgùntàn rẹ̀ ni.
- source_word: ἐκβάλῃ
  choice: mú ... jáde
  rationale: Ó ṣàfihàn ìgbésẹ̀ láti inú ọgbà àgùntàn sí òde láìfi ìtumọ̀ líle bíi lé wọn jáde kún un; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: ó máa ń lọ níwájú wọn
  rationale: Ó pa àwòrán olùṣọ́ tó ń ṣáájú agbo mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe àṣà tí ẹsẹ̀ náà ń ṣàpèjúwe.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: àwọn àgùntàn náà sì máa ń tẹ̀ lé e
  rationale: ‘Àgùntàn’ ni ìtumọ̀ πρόβατα, ‘tẹ̀ lé’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ἀκολουθέω.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: nítorí wọ́n mọ ohùn rẹ̀
  rationale: Ó pa ìdí tí wọ́n fi ń tẹ̀ lé e mọ́, ó sì tú οἴδασιν gẹ́gẹ́ bí ‘mọ̀’ láìdín ìtumọ̀ náà kù sí dídá ohùn mọ̀ nìkan.
theological_decisions:
- issue: Àwòrán olùṣọ́-àgùntàn àti agbára ọ̀rọ̀ ἐκβάλῃ
  choice: mú ... jáde
  alternative: lé ... jáde; darí ... jáde
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti olùṣọ́ àti àwọn àgùntàn tirẹ̀, kì í ṣe ti ìléjáde ọ̀tá. ‘Mú ... jáde’ pa ìrìn láti inú àgọ́ sí òde mọ́ láìfi èrò ìfipámúni kún ọ̀rọ̀ náà, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí agbára ọ̀rọ̀ Gíríìkì tó lè lágbára sí i hàn.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; èdè náà rọrùn, ó ní iyì, ó sì ń ṣàfihàn ìṣe olùṣọ́ gẹ́gẹ́ bí ohun tó máa ń ṣẹlẹ̀ ní gbogbogbòò.
