lexical_decisions:
- source_word: περιεπάτει
  choice: ń rìn
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ń fi ìṣe tí ó ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn; “ń rìn” mú ìtumọ̀ yìí jáde ní Yorùbá àdánidá.
- source_word: ἱερῷ
  choice: àgbàlá tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo agbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; “àgbàlá tẹ́ńpìlì” sọ ibi gbangba yìí di mímọ̀ fún òǹkàwé.
- source_word: στοᾷ
  choice: Ọ̀nà Abẹ́ Òpó
  rationale: στοά jẹ́ ọ̀nà tí òrùlé bò, tí àwọn òpó sì tò lẹ́gbẹ̀ẹ́ rẹ̀; ọ̀rọ̀ yìí jẹ́ àpèjúwe Yorùbá tó ṣe kedere, ó sì yẹ gẹ́gẹ́ bí orúkọ ibi.
- source_word: τοῦ Σολομῶνος
  choice: Sólómọ́nì
  rationale: Jẹ́nítífù náà ń tọ́ka sí ẹni tí orúkọ ibi náà jẹ́ ti; ìtòlẹ́sẹẹsẹ “Ọ̀nà Abẹ́ Òpó Sólómọ́nì” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìní tàbí ìbáṣepọ̀ yìí.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ẹsẹ̀ náà mọ́ ohun tó ṣáájú láìfi ìtumọ̀ àkókò míì kún un.
