id: JHN.10.13
reference: John 10:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: yo
  text: Nítorí pé ẹni tí a gbà síṣẹ́ fún owó ni, kò sì bìkítà nípa àwọn àgùntàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó fi ìdí tí alágbàṣe náà fi sá ní ọ̀rọ̀ tó ṣáájú hàn; ‘nítorí pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ ìdí yìí.
- source_word: μισθωτός
  choice: alágbàṣe
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí a gbà síṣẹ́ fún owó, kì í ṣe ẹni tó ni àwọn àgùntàn. ‘Alágbàṣe’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún àyíká iṣẹ́ olùṣọ́ àgùntàn.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: kò sì bìkítà nípa
  rationale: Ìkọ́lé Gíríìkì náà ń sọ pé ohun kan kò jẹ ẹni náà lógún. ‘Kò bìkítà nípa’ jẹ́ gbólóhùn Yorùbá àdánidá tó pa agbára ìdájọ́ ìwà inú ọ̀rọ̀ náà mọ́.
- source_word: τῶν προβάτων
  choice: àwọn àgùntàn
  rationale: Èyí túmọ̀ orúkọ Gíríìkì náà ní tààrà, ó sì pa àwòrán iṣẹ́ olùṣọ́ àgùntàn tó ṣe pàtàkì nínú àyíká ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìṣàpèjúwe alágbàṣe ní ìyàtọ̀ sí olùṣọ́ àgùntàn rere
  choice: Sọ ìdájọ́ ìwà inú ẹsẹ náà ní tààrà láìfi ẹni tàbí ẹgbẹ́ pàtó mọ alágbàṣe náà.
  alternative: Túmọ̀ alágbàṣe náà sí ẹgbẹ́ àwọn aṣáájú èké kan pàtó, tàbí dín ìyàtọ̀ náà kù sí àìní ìfẹ́ sí iṣẹ́ lásán.
  rationale: 'Ẹsẹ náà fúnra rẹ̀ sọ ìdí náà: alágbàṣe ni, kò sì bìkítà nípa àwọn àgùntàn. Ìtumọ̀ náà pa ìyàtọ̀ rẹ̀ sí olùṣọ́ àgùntàn rere mọ́ láìkó ẹ̀kọ́ tí ẹsẹ náà kò sọ wọlé.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘alágbàṣe’ fún ẹni tí a gbà síṣẹ́ fún owó, àti ‘bìkítà nípa’ láti fi àníyàn tàbí ìtọ́jú hàn ní ọ̀nà àdánidá.
