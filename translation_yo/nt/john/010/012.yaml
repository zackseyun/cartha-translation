  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èdè Gíríìkì dáadáa ní ìtòlẹ́sẹẹsẹ àwọn ìṣe: ẹni tí a yá síṣẹ́ rí ìkookò, ó fi àgùntàn sílẹ̀ ó sì sá lọ; ìkookò sì ń gbà wọ́n mú, ó sì tú wọn ká. Ṣùgbọ́n àmì ìsàlẹ̀ [a] wà lẹ́yìn μισθωτός nínú àkọ́sọ, nígbà tí ìwé-ẹ̀rí Gẹ̀ẹ́sì fún un jẹ́ àṣàyàn ìtumọ̀ ἀφίησιν (''leaves/abandons''). Ó yẹ kí a gbé àmì náà sí ''sílẹ̀'' kí a sì ṣe ìsàlẹ̀-ọrọ náà ní ìbámu pẹ̀lú ìtumọ̀ yẹn.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, ó sì dá ìṣe kánkán inú ẹsẹ náà mú. 'tí àwọn àgùntàn náà kì í sì í ṣe tirẹ̀' lè yọrí sí ìdènà kékeré nítorí ìṣètò rẹ̀; 'tí àwọn àgùntàn kì í ṣe ti ara rẹ̀' rọrùn sí i, ó sì pa ἴδια ('ti ara rẹ̀/ti òun fúnra rẹ̀') mọ́.
  terminology: '''Ẹni tí a yá síṣẹ́'' jẹ́ ìtumọ̀ òde òní tó dára fún μισθωτός, ''olùṣọ́-àgùntàn'' sì yẹ fún ποιμήν. ''Ìkookò,'' ''àgùntàn,'' ''gbá wọ́n mú,'' àti ''tú wọ́n ká'' ń pa àwòrán àti ìwà ipá ti ọ̀rọ̀ Gíríìkì mọ́.'
