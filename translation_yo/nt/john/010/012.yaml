id: JHN.10.12
reference: John 10:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: yo
  text: Ẹni tí a yá síṣẹ́, tí kì í ṣe olùṣọ́-àgùntàn, tí àwọn àgùntàn kì í ṣe ti ara rẹ̀, rí ìkookò tí ń bọ̀, ó fi àwọn àgùntàn sílẹ̀[a], ó sì sá lọ—ìkookò náà sì gbá wọn mú, ó sì tú wọn ká.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kọ àwọn àgùntàn náà sílẹ̀.” Ọ̀rọ̀ náà lè ní ìtumọ̀ líle sí i pé ó fi wọ́n sílẹ̀ nínú ewu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: ẹni tí a yá síṣẹ́
  rationale: Ó túmọ̀ sí ẹni tí ń ṣiṣẹ́ fún owó ọ̀yà; gbólóhùn yìí jẹ́ Yorùbá òde òní tí ó ṣe kedere, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí olùṣọ́-àgùntàn tòótọ́.
- source_word: οὐκ ὢν ποιμήν
  choice: tí kì í ṣe olùṣọ́-àgùntàn
  rationale: A sọ àpólà aláìlẹ́ni Gíríìkì di gbólóhùn àsopọ̀ láti jẹ́ kí ó ṣe kedere ní Yorùbá, láì pàdánù ìtumọ̀ pé ẹni náà kì í ṣe olùṣọ́-àgùntàn.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: tí àwọn àgùntàn náà kì í sì í ṣe tirẹ̀
  rationale: Ó fi hàn pé àwọn àgùntàn náà kì í ṣe ohun ìní tirẹ̀, bẹ́ẹ̀ ni wọn kò ní ìbáṣepọ̀ jíjinlẹ̀ pẹ̀lú rẹ̀ bí ohun tirẹ̀.
- source_word: θεωρεῖ
  choice: rí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí rírí ewu; “rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi àlàyé kún un.
- source_word: τὸν λύκον ἐρχόμενον
  choice: ìkookò tí ń bọ̀
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: ἀφίησιν
  choice: fi ... sílẹ̀
  rationale: Ó lè túmọ̀ sí fífi sílẹ̀ tàbí kọ̀ sílẹ̀; a lo èyí tí ó sún mọ́ ọ̀rọ̀ ìpilẹ̀ jù, nígbà tí àyíká ọ̀rọ̀ fi agbára ìkọ̀sílẹ̀ nínú ewu hàn.
- source_word: φεύγει
  choice: sá lọ
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá kedere àti alágbára fún sísá kúrò níwájú ewu.
- source_word: ἁρπάζει
  choice: gbá wọn mú
  rationale: Ó sọ ìgbámú oníjàgídíjàgan ti ẹranko apanirun; ó jẹ́ Yorùbá àdánidá nínú àyíká yìí.
- source_word: σκορπίζει
  choice: tú wọn ká
  rationale: Ó fi ìtúká àwọn àgùntàn hàn ní kedere, pẹ̀lú arọ́pò-orúkọ tí àyíká ọ̀rọ̀ Gíríìkì ń tọ́ka sí.
- source_word: πρόβατα
  choice: àwọn àgùntàn
  rationale: A pa ọ̀pọ̀ orúkọ gidi náà mọ́ dípò lílo ọ̀rọ̀ àkójọpọ̀ bí “agbo,” kí àwòrán olùṣọ́-àgùntàn náà lè dúró ṣinṣin.
theological_decisions:
- issue: Agbára àkàwé olùṣọ́-àgùntàn
  choice: Pa “olùṣọ́-àgùntàn” àti “ẹni tí a yá síṣẹ́” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ iṣẹ́ ọ̀sìn ẹran nínú àkàwé náà.
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí “aṣáájú” tàbí “alábòójútó.”
  rationale: Jòhánù 10 ń lo àwòrán olùṣọ́-àgùntàn ní ọ̀nà tí ó tẹ̀ síwájú. Rírò wọn padà sí ọ̀rọ̀ àlàyé yóò dín agbára àkàwé náà kù, yóò sì fi ìtumọ̀ tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa àwòrán iṣẹ́ olùṣọ́-àgùntàn àti ìṣe kánkán inú ẹsẹ náà mọ́.
