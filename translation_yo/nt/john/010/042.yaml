lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá, láìfi ìtumọ̀ míì kún un.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró fún ọ̀pọ̀ àwọn ènìyàn; fífi “ènìyàn” hàn jẹ́ èdè Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: ἐπίστευσαν
  choice: gba ... gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ènìyàn ní ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé; ó tún bá ìṣe tí aorist náà sọ mu láìfi ìtumọ̀ ìbẹ̀rẹ̀ ìgbàgbọ́ kún un.
- source_word: εἰς αὐτόν
  choice: gba òun gbọ́
  rationale: Àpólà πιστεύω εἰς αὐτόν ń tọ́ka sí ìgbàgbọ́ àti ìgbẹ́kẹ̀lé tí a darí sí Jesu. “Gba òun gbọ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, òun sì ń tẹnumọ́ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ó pa ìtọ́kasí ibi tí ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀ mọ́ ní ṣókí àti ní èdè àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω εἰς αὐτόν níbi tí ọ̀rọ̀ ti ń sọ nípa ìgbàgbọ́ nínú Jesu
  choice: gba òun gbọ́
  alternative: gbẹ́kẹ̀ lé e / ní ìgbàgbọ́ nínú rẹ̀
  rationale: “Gba òun gbọ́” pa agbára ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí ìgbàgbọ́ tí a darí sí Jesu, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn tó ju ohun tí gbólóhùn náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo “òun” dípò “rẹ̀” láti tẹnumọ́ Jesu gẹ́gẹ́ bí ẹni tí àwọn ènìyàn gba gbọ́, bí εἰς αὐτόν ṣe dúró nínú Gíríìkì.
