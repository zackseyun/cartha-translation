id: JHN.10.29
reference: John 10:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: yo
  text: Baba mi[a], ẹni tí ó fi wọ́n fún mi, tóbi ju gbogbo lọ; kò sì sí ẹni tí ó lè fi agbára gbà wọ́n kúrò ní ọwọ́ Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Baba mi, ohun tí ó fi fún mi, tóbi ju gbogbo lọ.” Ìṣètò ọ̀rọ̀ Gíríìkì níbí ṣòro, àwọn kan sì gbà pé ohun tí Baba fi fún Jesu, dípò àwọn ènìyàn tí ó fi fún un, ni kókó ìfiwéra náà.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Baba mi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn ìní náà, ó sì pa ìbáṣepọ̀ Jesu gẹ́gẹ́ bí Ọmọ mọ́ láìfi àlàyé kún un.
- source_word: ὃ δέδωκέν μοι
  choice: ẹni tí ó fi wọ́n fún mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì ὃ jẹ́ akọ̀kan àìlẹ́mìí, ṣùgbọ́n ìtumọ̀ rẹ̀ nínú àyíká ọ̀rọ̀ ń tọ́ka sí àwọn àgùntàn inú ẹsẹ 27–28. ‘Wọ́n’ mú ìtọ́kasí àwọn ènìyàn yẹn ṣe kedere, nígbà tí ‘fi … fún’ sì sọ pé ẹ̀bùn Baba náà ṣì ní àbájáde títí di ìsinsìnyí.
- source_word: πάντων μεῖζων
  choice: tóbi ju gbogbo lọ
  rationale: Ọ̀rọ̀ yìí pa ìfiwéra gbòòrò náà mọ́ láìdín ‘gbogbo’ kù sí àwọn ènìyàn nìkan tàbí sí àwọn ohun nìkan.
- source_word: οὐδεὶς δύναται
  choice: kò sì sí ẹni tí ó lè
  rationale: Èyí sọ àìní agbára tàbí àìlèṣe inú δύναται ní Yorùbá àdánidá.
- source_word: ἁρπάζειν
  choice: já wọn gbà
  rationale: Gbólóhùn yìí fi ìgbésẹ̀ líle àti fífi agbára gba ohun kúrò lọ́wọ́ ẹni hàn, ó sì bá àwòrán ọ̀rọ̀ inú ẹsẹ 28 mu.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: kúrò ní ọwọ́ Baba
  rationale: Èyí pa àwòrán ‘ọwọ́’ gẹ́gẹ́ bí ààbò, ohun-ìní, àti agbára mọ́, ó sì fi ìtumọ̀ ἐκ, ìyẹn yíyọ kúrò nínú ààbò náà, hàn.
theological_decisions:
- issue: Ìṣòro àkọsílẹ̀ àti ìsopọ̀ gírámà nínú ὃ δέδωκέν μοι
  choice: 'A túmọ̀ rẹ̀ ní ìbámu pẹ̀lú àwọn àgùntàn tí Baba fi fún Jesu: ‘ẹni tí ó fi wọ́n fún mi.’'
  alternative: ‘Baba mi, ohun tí ó fi fún mi, tóbi ju gbogbo lọ.’
  rationale: Àkọsílẹ̀ Gíríìkì tí a tẹ̀ níbí ṣòro nípa gírámà, àwọn àfọwọ́kọ sì yàtọ̀. Àyíká ọ̀rọ̀ ń sọ nípa àwọn àgùntàn tí Baba fi fún Ọmọ, nítorí náà ‘wọ́n’ jẹ́ kedere ní Yorùbá; síbẹ̀, a pa ìtumọ̀ míì tí ó ṣeé ṣe mọ́ sínú àlàyé ìsàlẹ̀ kí a má bàa fi ipá yanjú àìdánilójú gidi náà.
- issue: Ìwọ̀n ìfiwéra nínú πάντων μεῖζων
  choice: tóbi ju gbogbo lọ
  alternative: tóbi ju gbogbo ènìyàn lọ; tóbi ju ohun gbogbo lọ
  rationale: πάντων lè ní ìtumọ̀ gbòòrò. ‘Gbogbo’ kò fi dandan sọ pé ènìyàn nìkan ni tàbí ohun gbogbo nìkan ni, nítorí náà ó pa agbára gbòòrò ọ̀rọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ kan tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Já wọn gbà’ jẹ́ ọ̀rọ̀ àdánidá tí ó fi fífi agbára gba ènìyàn kúrò ní ààbò hàn; àmì adákẹ́jẹ (;) sì mú ìbáṣepọ̀ àwọn gbólóhùn méjèèjì ṣe kedere.
