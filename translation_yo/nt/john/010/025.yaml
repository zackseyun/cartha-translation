  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: yo
  text: Jésù dá wọn lóhùn pé, “Mo sọ fún yín, ẹ kò sì gbàgbọ́. Àwọn iṣẹ́ tí èmi ń ṣe ní orúkọ Baba mi[a]—àwọn wọ̀nyí ń jẹ́rìí nípa mi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ àṣẹ Baba mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn wọ̀nyí ń jẹ́ ẹlẹ́rìí nípa mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá wọn lóhùn
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bá ìfọ̀rọ̀wérọ̀ mu fún ‘ó dá wọn lóhùn.’
- source_word: Εἶπον ὑμῖν
  choice: Mo sọ fún yín
  rationale: Ó tọ́ka sí ohun tí Jésù ti sọ fún wọn tẹ́lẹ̀, ó sì tẹ̀ lé irú àkókò ọ̀rọ̀ Gíríìkì láìfi àlàyé kún un.
- source_word: οὐ πιστεύετε
  choice: ẹ kò sì gbàgbọ́
  rationale: ‘Gbàgbọ́’ pa ìtumọ̀ àti ìlò ọ̀rọ̀ πιστεύω mọ́ nínú Ìhìn Rere Jòhánù.
- source_word: τὰ ἔργα
  choice: Àwọn iṣẹ́
  rationale: ‘Àwọn iṣẹ́’ jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá, ó sì pa ìsopọ̀ pẹ̀lú àwọn iṣẹ́ àti iṣẹ́ àmì Jésù nínú Jòhánù mọ́.
- source_word: ἐν τῷ ὀνόματι
  choice: ní orúkọ
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, tí ó lè ní ìtumọ̀ aṣojú, àṣẹ, àti ìfọwọ́sí.
- source_word: πατρός μου
  choice: Baba mi
  rationale: ‘Baba’ jẹ́ oyè ìbátan fún Ọlọ́run níbí; lílo lẹ́tà ńlá fi èyí hàn.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: àwọn wọ̀nyí ń jẹ́rìí nípa mi
  rationale: ‘Àwọn wọ̀nyí’ pa ìtẹnumọ́ ταῦτα mọ́, ‘ń jẹ́rìí’ sì mú èrò ẹlẹ́rìí inú μαρτυρέω jáde ní Yorùbá òde òní.
theological_decisions:
- issue: Ìbáṣepọ̀ àwọn iṣẹ́ Jésù pẹ̀lú àṣẹ àti ìdánimọ̀ Baba
  choice: ní orúkọ Baba mi
  alternative: nípasẹ̀ àṣẹ Baba mi
  rationale: Àṣàyàn yìí pa fífẹ̀ ìtumọ̀ gbólóhùn Gíríìkì mọ́—ó lè tọ́ka sí àṣẹ, aṣojú, tàbí ìfọwọ́sí—láìdín un kù sí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá àtẹ̀jáde tí ó níyì, tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ìtẹnumọ́ ‘àwọn wọ̀nyí’ àti ìfihàn ‘ní orúkọ’ mọ́.
