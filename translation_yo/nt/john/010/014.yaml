source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: yo
  text: Èmi ni olùṣọ́-àgùntàn rere náà; mo sì mọ àwọn tí í ṣe tèmi, àwọn tí í ṣe tèmi sì mọ̀ mí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn àgùntàn mi.” Ní ìtumọ̀ gangan, Gíríìkì sọ “àwọn tí í ṣe tèmi” nínú àwọn gbólóhùn méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμήν
  choice: olùṣọ́-àgùntàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń ṣọ́ agbo àgùntàn; ó pa àwòrán olùṣọ́ àti agbo inú ọ̀rọ̀ yìí mọ́, láì fi ìtumọ̀ ipò aṣáájú ìjọ kún un.
- source_word: καλός
  choice: rere
  rationale: “Rere” jẹ́ ọ̀nà àdánidá láti sọ ìwà rere àti yíyẹ tí καλός ní níbí, láì dín ìtumọ̀ rẹ̀ kù sí ẹwà ojú nìkan.
- source_word: γινώσκω / γινώσκουσί
  choice: mọ / mọ̀
  rationale: “Mọ” pa ìtumọ̀ ìmọ̀ ara ẹni àti ìbáṣepọ̀ alájùmọ̀ṣepọ̀ mọ́; “dá mọ̀” lè mú kí ó dà bí ìdánimọ̀ lasán.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: àwọn tí í ṣe tèmi
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ajẹtífù ohun-ìní ní ọ̀pọ̀ tí a lò gẹ́gẹ́ bí orúkọ. “Àwọn tí í ṣe tèmi” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ jíjẹ́ ti Jesu mọ́ láì tún “àgùntàn” fi kún ọ̀rọ̀ tí Gíríìkì kò sọ ní kedere nínú ẹsẹ yìí.
- source_word: ἐγώ εἰμι
  choice: Èmi ni
  rationale: “Èmi ni” bá ìdánimọ̀ ara ẹni tí a tẹnumọ́ mu, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn yìí.
- source_word: καί
  choice: sì
  rationale: “Sì” so àwọn gbólóhùn náà pọ̀ lọ́nà àdánidá ní Yorùbá, gẹ́gẹ́ bí καί ṣe ń ṣe ní Gíríìkì, láì fi ìtẹnumọ́ tuntun kún un.
theological_decisions:
- issue: Bí a ṣe máa sọ ìmọ̀ ara ẹni tí ó wà láàárín Jesu àti àwọn tirẹ̀ láì fi àlàyé ẹ̀kọ́ ìsìn tí ó dé lẹ́yìn kún un
  choice: àwọn tí í ṣe tèmi
  alternative: àwọn àgùntàn mi
  rationale: Yíyan “àwọn tí í ṣe tèmi” pa ìtumọ̀ jíjẹ́ tirẹ̀ àti ìmọ̀ ara ẹni ní ìhà méjèèjì mọ́. Àyíká ń tọ́ka sí àgùntàn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò tún orúkọ “àgùntàn” sọ nínú àwọn gbólóhùn méjèèjì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò; àwòrán olùṣọ́-àgùntàn àti àṣekágbá ìmọ̀ ara ẹni ni a pa mọ́.
