id: JHN.10.31
reference: John 10:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: yo
  text: Nítorí náà, àwọn Júù tún mú òkúta láti sọ ọ́ ní òkúta pa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀, láti túmọ̀ sí “àwọn aṣáájú Júù” tàbí “àwọn ará Jùdíà.” Nínú Ìhìn Rere Jòhánù, gbólóhùn “àwọn Júù” sábà máa ń tọ́ka sí àwọn alátakò Jésù kan pàtó dípò gbogbo àwọn Júù lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: gbé … sókè
  rationale: Nínú àyíká ìkọlù yìí, gbólóhùn náà túmọ̀ sí pé wọ́n mú òkúta sí ọwọ́ fún lílò lẹ́sẹ̀kẹsẹ̀; ‘gbé … sókè’ jẹ́ èdè Yorùbá àdánidá fún ìṣe náà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe yìí mọ́ ọ̀rọ̀ Jésù tó ṣáájú, ó sì fi ìyọrísí tàbí ìdáhùn hàn.
- source_word: πάλιν
  choice: tún
  rationale: Ó pa ìtumọ̀ ìṣe tí ó ṣẹlẹ̀ lẹ́ẹ̀kan rí mọ́ ní ṣókí àti ní èdè àdánidá.
- source_word: λίθους
  choice: òkúta
  rationale: Èyí ni ìtumọ̀ tààrà ti λίθος, láì fi ète pípa kún orúkọ náà.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà. Àlàyé ìsàlẹ̀ fi hàn pé nínú àyíká Ìhìn Rere Jòhánù, ó lè tọ́ka sí àwọn Júù kan pàtó tí wọ́n ń tako Jésù, kì í ṣe gbogbo àwọn Júù.
- source_word: ἵνα
  choice: láti
  rationale: Ó fi ète hàn lọ́nà ṣókí àti àdánidá nínú Yorùbá.
- source_word: λιθάσωσιν
  choice: sọ … ní òkúta pa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípa tàbí gbígbìyànjú láti pa ènìyàn nípa sísọ òkúta lù ú. Gbólóhùn Yorùbá yìí mú ọ̀nà ìṣe àti ète apànìyàn náà hàn ní kedere.
- source_word: αὐτόν
  choice: ọ́
  rationale: Arọ́pò-orúkọ olùgbà-ìṣe náà tọ́ka sí Jésù.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí àti bí ìtọ́kasí náà ṣe gbòòrò nínú Ìhìn Rere Jòhánù
  choice: Lo ‘àwọn Júù’ nínú ẹsẹ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sì sọ àwọn ìtumọ̀ tó ṣeé ṣe nínú àyíká.
  alternative: àwọn aṣáájú Júù; àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘àwọn Júù’ ní tààrà, nítorí náà kò yẹ kí a dín ìtọ́kasí rẹ̀ kù láìsí ẹ̀rí tó hàn gbangba nínú ẹsẹ̀ náà. Síbẹ̀, lílò ọ̀rọ̀ yìí nínú Jòhánù sábà máa ń tọ́ka sí àwọn alátakò Jésù kan pàtó, kì í ṣe gbogbo àwọn Júù; àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́, ó sì dènà àgbàsọ tí kò tọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní. A pa ìsopọ̀ ìtàn, ìtúnṣe ìṣe, àti àìdánilójú nípa ‘àwọn Júù’ mọ́.
