review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative connector (οὖν), repetition (πάλιν), purpose clause, and the literal main-text rendering of οἱ Ἰουδαῖοι. However, “gbé òkúta sókè” means “raise/lift stones upward” and adds a directional nuance not expressed by Ἐβάστασαν. “mú òkúta” more directly and idiomatically conveys taking stones in hand in this context.
  naturalness: The proposed revision is fluent Standard Yoruba with appropriate tone marks. “sọ ọ́ ní òkúta pa” is an established idiomatic way to express stoning someone to death; it naturally renders the violent sense of λιθάζω in Yoruba.
  terminology: “Àwọn Júù” correctly retains the Greek wording without prematurely narrowing its referent. The contextual footnote appropriately notes “àwọn aṣáájú Júù” and “àwọn ará Jùdíà” as possibilities, without asserting either as the sole meaning.
  issues:
  - severity: medium
    issue: “gbé òkúta sókè” is overly specific for Ἐβάστασαν.
    rationale: The Greek says that they took up/picked up stones; it does not say that they raised them upward. In Yoruba, “mú òkúta” is the natural contextual equivalent and avoids adding this detail.
  revised_text: Nítorí náà, àwọn Júù tún mú òkúta láti sọ ọ́ ní òkúta pa.[a]
  revised_footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀, láti túmọ̀ sí “àwọn aṣáájú Júù” tàbí “àwọn ará Jùdíà.” Nínú Ìhìn Rere Jòhánù, gbólóhùn “àwọn Júù” sábà máa ń tọ́ka sí àwọn alátakò Jésù kan pàtó dípò gbogbo àwọn Júù lápapọ̀.
    reason: alternative_reading
