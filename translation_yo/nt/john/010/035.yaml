source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: yo
  text: Bí ó bá pe àwọn tí ọ̀rọ̀ Ọlọ́run dé ọ̀dọ̀ wọn ní ‘àwọn ọlọ́run’[a]—tí a kò sì lè sọ Ìwé Mímọ́ di asán[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ẹni bí ọlọ́run.’ Gíríìkì náà ní ‘àwọn ọlọ́run,’ ó sì ń tún Sáàmù 82:6 sọ; àwọn kan lóye pé àwọn onídàájọ́ ènìyàn ni ọ̀rọ̀ náà ń tọ́ka sí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘a kò lè fagi lé Ìwé Mímọ́’ tàbí ‘a kò lè gbé Ìwé Mímọ́ sẹ́gbẹ̀ẹ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Bí ó bá
  rationale: Ó pa ìrísí àríyànjiyàn oníṣ شرط mọ́ ní Yorùbá, ó sì bá ọ̀nà tí Jésù gbà ń tẹ̀ síwájú mu.
- source_word: ἐκείνους
  choice: àwọn tí
  rationale: Ó tọ́ka sí àwọn ẹni tí Ìwé Mímọ́ sọ̀rọ̀ nípa wọn láì fi ‘ọkùnrin’ kún ohun tí Gíríìkì kò sọ.
- source_word: εἶπεν θεοὺς
  choice: pe ... ní ‘àwọn ọlọ́run’
  rationale: Nínú gbólóhùn yìí, εἶπεν ní agbára ìsọ orúkọ tàbí ìfi ipò kan fún wọn; ‘pe ... ní’ jẹ́ Yorùbá àdánidá.
- source_word: θεοὺς
  choice: àwọn ọlọ́run
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Sáàmù 82:6 gẹ́gẹ́ bí Jésù ṣe tọ́ka sí i, láì yí i sí ‘àwọn onídàájọ́’ tàbí yanju ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: àwọn tí ọ̀rọ̀ Ọlọ́run tọ̀ wá
  rationale: ‘tọ̀ wá’ fi hàn pé ọ̀rọ̀ náà dé ọ̀dọ̀ wọn tàbí pé a darí rẹ̀ sí wọn, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: οὐ δύναται λυθῆναι
  choice: a kò lè sọ ... di asán
  rationale: Ó mú ìtumọ̀ pé a kò lè fagi lé e, sọ ọ́ di aláṣẹkù, tàbí gbé e sẹ́gbẹ̀ẹ́ jáde ju ìtumọ̀ gígún ‘fọ́’ lọ.
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ṣe kedere fún Scripture gẹ́gẹ́ bí ìkọ̀wé aláṣẹ.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn ọlọ́run’ nínú àyọlò Jésù
  choice: Pa ‘àwọn ọlọ́run’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Àwọn onídàájọ́; àwọn ẹ̀dá ọ̀run.
  rationale: Àríyànjiyàn Jésù sinmi lórí ọ̀rọ̀ Sáàmù 82:6 gan-an. Yíyí i sí ‘àwọn onídàájọ́’ yóò yan ìtumọ̀ kan tí ẹsẹ̀ náà kò fi dandan pinnu.
- issue: Agbára gbólóhùn ‘a kò lè sọ Ìwé Mímọ́ di asán’
  choice: Ṣàfihàn pé a kò lè fagi lé Ìwé Mímọ́ tàbí mú agbára rẹ̀ kúrò.
  alternative: A kò lè fọ́ Ìwé Mímọ́; a kò lè gbé Ìwé Mímọ́ sẹ́gbẹ̀ẹ́.
  rationale: λυθῆναι níbí ń tọ́ka sí yíyọ agbára tàbí ìdúróṣinṣin rẹ̀ kúrò; ‘sọ ... di asán’ mú èrò náà jáde ní Yorùbá àdánidá láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ títọ́, ọlọ́lá, ó sì rọrùn fún òǹkàwé òde òní. Àwọn àmì ìdádúró fi hàn pé gbólóhùn náà ń bá ọ̀rọ̀ ẹsẹ̀ tó tẹ̀ lé e lọ.
