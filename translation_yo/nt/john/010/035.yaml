  to: Bí ó bá pe àwọn tí ọ̀rọ̀ Ọlọ́run dé ọ̀dọ̀ wọn ní ‘àwọn ọlọ́run’[a]—tí a kò sì lè sọ Ìwé Mímọ́ di asán[b]—
  rationale: A tún gbolóhùn tó túmọ̀ πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο ṣe sí ‘àwọn tí ọ̀rọ̀ Ọlọ́run dé ọ̀dọ̀ wọn,’ nítorí ó jẹ́ Yorùbá tó rọrùn, ó sì pa ìtumọ̀ ìtòsọ́nà ‘ọ̀rọ̀ náà wá sí wọn’ mọ́. A kò yí ìtumọ̀ ẹsẹ̀ náà, ìforúkọsílẹ̀ ‘àwọn ọlọ́run,’ tàbí agbára Ìwé Mímọ́ padà.
