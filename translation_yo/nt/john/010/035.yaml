  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ mú ìlànà Gíríìkì náà dáadáa: èyí jẹ́ gbolóhùn oníṣàkóso ‘bí ...’, ‘pe ... ní àwọn ọlọ́run’ bójú mu εἶπεν θεούς, a sì ti pa ‘àwọn ọlọ́run’ mọ́. Síbẹ̀, ‘ọ̀rọ̀ Ọlọ́run tọ̀ wá’ kò dára gẹ́gẹ́ bí ìtumọ̀ πρὸς οὓς ... ἐγένετο; ó lè túmọ̀ sí pé ọ̀rọ̀ náà ‘tẹ̀lé’ tàbí ‘yẹ’ wọn. ‘ti ọ̀rọ̀ Ọlọ́run dé ọ̀dọ̀ wọn’ ń fi ìhún ìtòsọ́nà ‘came to’ hàn kedere.'
  naturalness: Àtúnṣe náà máa jẹ́ Yorùbá boṣewa, ìmọ́lẹ̀, àti ti òde òní. ‘tí ọ̀rọ̀ Ọlọ́run dé ọ̀dọ̀ wọn’ jẹ́ ọ̀nà àdánidá ju ‘tọ̀ wá’ lọ. ‘a kò sì lè sọ Ìwé Mímọ́ di asán’ jẹ́ ìtumọ̀ tí ó ṣe kedere fún λυθῆναι.
  terminology: ‘Ọlọ́run,’ ‘Ìwé Mímọ́,’ àti ‘àwọn ọlọ́run’ jẹ́ ọ̀rọ̀ tó yẹ. A pa ọ̀rọ̀ ‘àwọn ọlọ́run’ mọ́ láì yí i padà sí ‘àwọn onídàájọ́’; àlàyé ìtumọ̀ mìíràn wà nínú àfikún ọ̀rọ̀.
