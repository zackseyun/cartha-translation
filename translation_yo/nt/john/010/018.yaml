  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ẹsẹ̀ Gíríìkì mọ́: kò sí ẹni tí yóò gba ẹ̀mí náà kúrò lọ́dọ̀ Jésù, ó fi í lélẹ̀ ní ìfẹ́ ara rẹ̀, ó ní ἐξουσία láti fi í lélẹ̀ àti láti tún gbà á padà, ó sì gba ἐντολή náà láti ọ̀dọ̀ Baba rẹ̀. Ṣùgbọ́n “gbà á lọ́wọ́ mi” lè túmọ̀ sí gbígba ohun kan lọwọ ẹni lásán; fífi “kúrò” kún un ń mú agbára ἀπ’ ἐμοῦ àti ìyàtọ̀ pẹ̀lú ìfẹ́-ẹni-ẹni Jésù hàn dáadáa.'
