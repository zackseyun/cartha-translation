id: JHN.10.18
reference: John 10:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: yo
  text: Kò sí ẹni tí ó gbà á kúrò lọ́wọ́ mi,[a] ṣùgbọ́n èmi fúnra mi ni mo fi í lélẹ̀. Mo ní àṣẹ láti fi í lélẹ̀, mo sì ní àṣẹ láti tún gbà á padà.[b][c] Àṣẹ yìí ni mo gbà láti ọ̀dọ̀ Baba mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ìtumọ̀ mìíràn: “Kò sí ẹni tí ó mú un kúrò lọ́wọ́ mi.”'
    reason: lexical_alternative
  - marker: b
    text: “Àṣẹ” tún lè ní ìtumọ̀ “agbára” tàbí “ẹ̀tọ́.” Ọ̀rọ̀ Gíríìkì lè ní èrò agbára láti ṣe ohun kan àti ẹ̀tọ́ tàbí ìfọwọ́sí láti ṣe é.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, láti tún gba ẹ̀mí rẹ̀ padà; wo Jòhánù 10:17.
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει
  choice: gbà á lọ́wọ́ mi
  rationale: Ó fi ìtumọ̀ ‘mú kúrò lọ́wọ́ ẹni’ hàn ní àyíká ọ̀rọ̀ nípa ẹ̀mí Jésù, ó sì bá ìyàtọ̀ tó tẹ̀ lé e nípa fífi ẹ̀mí rẹ̀ lélẹ̀ láti inú ìfẹ́ tirẹ̀ mu.
- source_word: τίθημι αὐτὴν / θεῖναι αὐτήν
  choice: fi í lélẹ̀ / láti fi í lélẹ̀
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣeé lóye fún fífi ẹ̀mí ẹni rúbọ láti inú ìfẹ́ ẹni.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: èmi fúnra mi ni
  rationale: Ó tẹnu mọ́ pé Jésù fúnra rẹ̀ ló ṣe é láti inú ìfẹ́ rẹ̀, láì sọ pé ó ṣe é ní òmìnira kúrò lọ́dọ̀ Baba.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: ‘Àṣẹ’ lè gba èrò agbára, ẹ̀tọ́, àti ìfọwọ́sí tó yẹ sínú ara rẹ̀, pàápàá ní ìbámu pẹ̀lú àṣẹ tí Jésù gbà lọ́dọ̀ Baba.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: láti tún gbà á padà
  rationale: Ó pa πάλιν mọ́ nípasẹ̀ ‘tún,’ ó sì jẹ́ kí λαμβάνω dúró ní àárín ‘gbà’ àti ‘mú,’ láì túmọ̀ rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐντολήν
  choice: àṣẹ
  rationale: Èyí ni ìtumọ̀ tààrà tó sì yẹ fún ἐντολή, ó sì pa ìbáṣepọ̀ Baba àti Ọmọ tí ẹsẹ náà sọ mọ́.
- source_word: παρὰ τοῦ πατρός μου
  choice: láti ọ̀dọ̀ Baba mi
  rationale: Ó ṣàfihàn Baba gẹ́gẹ́ bí orísun àṣẹ náà, ó sì pa èdè ìbáṣepọ̀ ara ẹni mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσία nípa ikú àti àjíǹde Jésù
  choice: àṣẹ
  alternative: agbára tàbí ẹ̀tọ́
  rationale: '‘Àṣẹ’ pa mejeeji mọ́: Jésù ń ṣe pẹ̀lú agbára àti ẹ̀tọ́ tó yẹ, ṣùgbọ́n ẹsẹ náà tún fi ìṣe rẹ̀ sínú ìbáṣepọ̀ pẹ̀lú àṣẹ Baba.'
- issue: Agbára ìtumọ̀ ἀπ’ ἐμαυτοῦ
  choice: èmi fúnra mi ni mo fi í lélẹ̀
  alternative: mo fi í lélẹ̀ láti inú ìfẹ́ ara mi
  rationale: Àṣàyàn náà tẹnu mọ́ fífi ẹ̀mí rẹ̀ fúnni láti inú ìfẹ́ rẹ̀, láì mú un dà bí ẹni pé ó ń ṣe lọ́tọ̀ sí Baba.
- issue: Ohun tí αὐτήν ń tọ́ka sí
  choice: á / í, arọ́pò-orúkọ tó ń tọ́ka sí ẹ̀mí rẹ̀
  alternative: ẹ̀mí mi
  rationale: Àyíká ọ̀rọ̀ ẹsẹ 17 mú ohun tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere. Fífi arọ́pò-orúkọ sílẹ̀ pa ìṣọ̀kan pẹ̀lú orísun Gíríìkì mọ́.
- issue: Ìtumọ̀ λαβεῖν ní gbólóhùn πάλιν λαβεῖν αὐτήν
  choice: tún gbà á padà
  alternative: tún mú un padà tàbí tún gba ẹ̀mí mi
  rationale: λαβεῖν lè túmọ̀ sí ‘gbà’ tàbí ‘mú.’ ‘Tún gbà á padà’ pa àìdánilójú kékeré yìí mọ́, kò sì ṣàlàyé ọ̀nà àjíǹde ju orísun lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣeé lóye fún òǹkàwé òde òní ni a lò. A pa àwòrán ‘fi í lélẹ̀’ mọ́, a sì lo ‘èmi fúnra mi ni’ láti jẹ́ kí ìyọ̀ǹda ara Jésù ṣe kedere láì mú ìbáṣepọ̀ rẹ̀ pẹ̀lú Baba kúrò.
