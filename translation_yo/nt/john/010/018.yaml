  terminology: “Àṣẹ” yẹ fún ἐξουσία ní ibi yìí, nítorí ó lè sọ ẹ̀tọ́ àti àṣẹ tó bófin mu, kì í ṣe agbára lásán. “Àṣẹ” fún ἐντολή tún bá orísun mu. “Ẹ̀mí” nínú àlàyé ẹsẹ̀ ṣàfihàn ohun tí arọ́pò-orúkọ náà tọ́ka sí láì fi ìtúmọ̀ míì kún ọ̀rọ̀ ẹsẹ̀.
