id: JHN.10.11
reference: John 10:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: yo
  text: Èmi ni olùṣọ́ àgùntàn rere.[a] Olùṣọ́ àgùntàn rere ń fi ìyè rẹ̀ lélẹ̀ fún àwọn àgùntàn.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olùṣọ́ àgùntàn ọlọ́lá” tàbí “olùṣọ́ àgùntàn tí ó jẹ́ àpẹẹrẹ”; ọ̀rọ̀ Gíríìkì καλός lè ní ìtumọ̀ rere, ọlọ́lá, tàbí àpẹẹrẹ.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ń fi ẹ̀mí/ìyè rẹ̀ lélẹ̀”; nínú àṣà ọ̀rọ̀ Gíríìkì yìí, ìtumọ̀ náà ni fífi ìyè ẹni lélẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “fún ire àwọn àgùntàn” tàbí “ní tìrẹ àwọn àgùntàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìdánimọ̀ tí ó ní ìtẹnumọ́ hàn, ó sì bá ìfarahàn arọ́pò-orúkọ Ἐγώ mu láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: ποιμήν
  choice: olùṣọ́ àgùntàn
  rationale: Ó túmọ̀ àwòrán ẹni tí ń tọ́jú àgùntàn ní tààràtà; kò sì mú ìtumọ̀ ipò aṣáájú ìjọ ti ọjọ́ iwájú wọ inú ọ̀rọ̀ náà.
- source_word: καλός
  choice: rere
  rationale: “Rere” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé, tí ó sì lè ní ìtumọ̀ ìwà rere, ọlá, àti jíjẹ́ àpẹẹrẹ, bí καλός ṣe lè túmọ̀ sí.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: ń fi ẹ̀mí rẹ̀ lélẹ̀
  rationale: Ní àkójọpọ̀ ọ̀rọ̀ yìí, ψυχή túmọ̀ sí ìyè ẹni, kì í ṣe apá aláìrí kan ṣoṣo. “Fi ẹ̀mí rẹ̀ lélẹ̀” jẹ́ àṣà ọ̀rọ̀ Yorùbá tó bójú mu, ó sì pa àwòrán τίθημι mọ́.
- source_word: ὑπὲρ τῶν προβάτων
  choice: nítorí àwọn àgùntàn
  rationale: “Nítorí” lè gbé ìtumọ̀ ṣíṣe fún ire wọn tàbí ní ipò wọn, láìdín ὑπέρ kù sí ẹ̀kọ́ kan pàtó nípa ètùtù.
theological_decisions:
- issue: Agbára ìdánimọ̀ Ἐγώ εἰμι
  choice: Èmi ni
  alternative: Èmi fúnra mi ni; tàbí ìtumọ̀ tí yóò sọ ọ́ di ìtọ́ka pàtó sí orúkọ Ọlọ́run
  rationale: Gbólóhùn náà ń ṣiṣẹ́ gẹ́gẹ́ bí ìdánimọ̀ pẹ̀lú àpèjúwe “olùṣọ́ àgùntàn rere.” “Èmi ni” pa ìtẹnumọ́ rẹ̀ mọ́ láìfi ìtọ́ka ẹ̀kọ́ ìsìn tí ẹsẹ̀ náà kò sọ ní tààràtà kún un.
- issue: Ìtumọ̀ καλός nínú orúkọ olùṣọ́ àgùntàn
  choice: olùṣọ́ àgùntàn rere
  alternative: olùṣọ́ àgùntàn ọlọ́lá; olùṣọ́ àgùntàn àwòṣe
  rationale: “Rere” dá ìtumọ̀ náà sílẹ̀ ní ọ̀nà tó gbòòrò, ó sì lè gba ìtumọ̀ ọlá àti jíjẹ́ àpẹẹrẹ láàyè láìṣe àlàyé ju ọ̀rọ̀ Gíríìkì lọ.
- issue: Agbára ὑπὲρ τῶν προβάτων nípa ikú Jésù
  choice: nítorí àwọn àgùntàn
  alternative: ní ipò àwọn àgùntàn; fún ire àwọn àgùntàn
  rationale: Ìtumọ̀ yìí pa agbára àǹfààní àti aṣojú tí ὑπέρ lè ní mọ́, láìyan èrò ẹ̀kọ́ ètùtù kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì yé òǹkàwé òde òní. Àwọn àmì ohùn wà ní ibi tí ó yẹ. “Olùṣọ́ àgùntàn” pa àwòrán ìṣọ́ àgùntàn mọ́, “fi ẹ̀mí rẹ̀ lélẹ̀” sì jẹ́ ọ̀rọ̀ àdánidá tí ó ṣàfihàn ìfara-ẹni-rú láìsọ èrò ẹ̀kọ́ ìsìn kan di dandan.
