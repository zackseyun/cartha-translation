  verdict: revise
  source_fidelity: Ìtumọ̀ akọ́kọ́ ti Ἐγώ εἰμι, ποιμήν ὁ καλός, àti τίθησιν ... ὑπὲρ τῶν προβάτων jẹ́ olóòtítọ́ ní gbogbogbòò. Ṣùgbọ́n «nítorí àwọn àgùntàn» lè túmọ̀ sí ‘because of the sheep,’ ó sì lè rẹ agbára àǹfààní/aṣojú ti ὑπέρ kù. Pẹ̀lú èyí, àlàyé [b] pe ψυχή ní tààràtà jẹ́ «ọkàn» kò pé; nínú ọ̀rọ̀-àyíká yìí ó ń tọ́ka sí ìyè ẹni.
  naturalness: «Olùṣọ́ àgùntàn rere» jẹ́ èdè Yorùbá boṣewa, ó sì ṣàfihàn àwòrán orísun náà dáadáa. «Ń fi ìyè rẹ̀ lélẹ̀ fún àwọn àgùntàn» jẹ́ ọ̀nà tí ó ṣe kedere àti àdánidá jù lọ nínú Yorùbá òde òní.
  terminology: A ti pa «rere» fún καλός mọ́, pẹ̀lú àlàyé tó ń fi ‘ọlọ́lá’ àti ‘àpẹẹrẹ’ hàn gẹ́gẹ́ bí ìyàtọ̀. «Ìyè» ní ọ̀rọ̀ àkọ́kọ́ yí yẹ fún ψυχή nínú àsọyé fífi ìyè lélẹ̀; àlàyé náà sì mẹ́nu kan «ẹ̀mí» láìsọ pé «ọkàn» nìkan ni ìtumọ̀ rẹ̀.
