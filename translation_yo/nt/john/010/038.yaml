id: JHN.10.38
reference: John 10:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo bá ṣe wọn, bí ẹ kò tilẹ̀ gba ọ̀rọ̀ mi gbọ́, ẹ gba àwọn iṣẹ́ náà gbọ́, kí ẹ lè mọ̀, kí ẹ sì máa mọ̀ pé Baba wà nínú mi, èmi sì wà nínú Baba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιῶ
  choice: bí mo bá ń ṣe wọn
  rationale: Ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí, ó sì ń tọ́ka sí àwọn iṣẹ́ Jesu tí a mẹ́nu kàn ní àyíká ẹsẹ náà; a fi “wọn” kún un fún ìṣe-adámọ̀ Yorùbá.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: bí ẹ kò tilẹ̀ gba ọ̀rọ̀ mi gbọ́
  rationale: πιστεύω pẹ̀lú arọ́pò-orúkọ dative lè túmọ̀ sí gbígba ẹni tàbí ọ̀rọ̀ rẹ̀ gbọ́. “Gba ọ̀rọ̀ mi gbọ́” mú ìyàtọ̀ rẹ̀ sí “gba àwọn iṣẹ́ náà gbọ́” hàn ní Yorùbá àdánidá.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: ẹ gba àwọn iṣẹ́ náà gbọ́
  rationale: 'Ó pa agbára gbólóhùn Gíríìkì mọ́: kí iṣẹ́ Jesu fúnra wọn jẹ́ ẹ̀rí tí àwọn olùgbọ́ yóò gbà gbọ́, kì í ṣe pé kí wọ́n fi ìgbàgbọ́ ìsìn sínú àwọn iṣẹ́ náà.'
- source_word: ἔργοις
  choice: àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” bá ọ̀rọ̀ Johannine mu, ó sì yẹra fún ṣíṣe àlàyé rẹ̀ sí “àwọn àmì,” nígbà tí Gíríìkì lo ἔργα, kì í ṣe σημεῖα.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: kí ẹ lè mọ̀, kí ẹ sì máa mọ̀
  rationale: Àkọ́kọ́ fi mímọ̀ sílẹ̀ gẹ́gẹ́ bí ohun tí a dé bá, èkejì sì fi ìtẹ̀síwájú mímọ̀ hàn; “máa mọ̀” ń fi ipa ìsinsìnyí tí ń bá a lọ hàn láìfi “lóye” tí kò ṣe kedere sí Gíríìkì kún un.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: Baba wà nínú mi, èmi sì wà nínú Baba
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán ìwà-nínú-ara-ẹni méjèèjì àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láìṣàlàyé rẹ̀ jù.
- source_word: πατήρ
  choice: Baba
  rationale: Gíríìkì sọ “Baba” pẹ̀lú article, kì í ṣe “Baba mi”; àkọlé náà yẹ kí ó jẹ́ lẹ́tà ńlá ní àyíká yìí.
theological_decisions:
- issue: Ìwà Baba nínú Ọmọ àti Ọmọ nínú Baba
  choice: Baba wà nínú mi, èmi sì wà nínú Baba
  alternative: Baba ní ìṣọ̀kan pẹ̀lú mi, èmi náà sì ní ìṣọ̀kan pẹ̀lú Baba
  rationale: A pa èdè ἐν méjèèjì mọ́ gẹ́gẹ́ bí “nínú,” nítorí ìtumọ̀ yìí kò sọ ìjìnlẹ̀ ọ̀rọ̀ náà di ohun tí ó rọrùn ju bó ṣe rí lọ, bẹ́ẹ̀ ni kò fi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ ti ìgbà tó tẹ̀ lé e sínú ẹsẹ náà.
- issue: Ìyàtọ̀ aspect nínú γνῶτε àti γινώσκητε
  choice: kí ẹ lè mọ̀, kí ẹ sì máa mọ̀
  alternative: kí ẹ lè wá mọ̀, kí ẹ sì lóye
  rationale: Yíyan náà ń tọ́jú ìtẹ̀sí láti mímọ̀ sí mímọ̀ tí ń bá a lọ, láìsọ γινώσκητε di “lóye,” èyí tí ó lè fi ìtumọ̀ míì kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, níwọ̀n bí àwọn ọ̀rọ̀-ìṣe Gíríìkì ti jẹ́ ọ̀pọ̀. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba.
