  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: yo
  text: Jésù dá wọn lóhùn pé, “Ọ̀pọ̀ iṣẹ́ rere láti ọ̀dọ̀ Baba[a] ni mo fi hàn yín; nítorí èwo nínú wọn[b] ni ẹ ń fi òkúta sọ mí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ kan ní “láti ọ̀dọ̀ Baba mi,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí kàn sọ pé “láti ọ̀dọ̀ Baba.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nítorí iṣẹ́ wo nínú àwọn iṣẹ́ wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá wọn lóhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ìdáhùn sí ọ̀rọ̀ tàbí ìṣe àwọn mìíràn hàn nínú ìtàn.
- source_word: Πολλὰ ἔργα καλὰ
  choice: Ọ̀pọ̀ iṣẹ́ rere
  rationale: “Iṣẹ́” pa ìtumọ̀ ἔργα mọ́ gẹ́gẹ́ bí àwọn iṣẹ́ tàbí iṣẹ́ àmì Jésù; “rere” sì fi ìwà rere àti àǹfààní wọn hàn láìfi ìtumọ̀ míì kún un.
- source_word: ἔδειξα
  choice: ni mo fi hàn yín
  rationale: “Fi hàn” túmọ̀ sí pé Jésù mú kí àwọn iṣẹ́ náà hàn gbangba fún wọn; ó sì bá aorist inú ọ̀rọ̀ ìjíròrò mu ní Yorùbá.
- source_word: ἐκ τοῦ πατρός
  choice: láti ọ̀dọ̀ Baba
  rationale: “Láti ọ̀dọ̀” fi orísun àwọn iṣẹ́ náà hàn, “Baba” sì pa àìsí arọ́pò-orúkọ ohun-ìní mọ́; a kò fi “Baba mi” kún ọ̀rọ̀ Gíríìkì.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: nítorí èwo nínú wọn
  rationale: “Nítorí” fi ìdí tàbí okùnfà tí διά pẹ̀lú accusative ń tọ́ka sí hàn; “èwo nínú wọn” tọ́ka padà sí ọ̀pọ̀ iṣẹ́ rere náà ní ọ̀nà Yorùbá àdánidá.
- source_word: λιθάζετε
  choice: ẹ ṣe ń sọ mí ní òkúta
  rationale: Ìṣètò “ṣe ń” pa ìṣe tí ó ń lọ lọ́wọ́ tàbí tí wọ́n dojú kọ Jésù mọ́, láìfi “ń gbìyànjú” tí kò hàn gbangba nínú ọ̀rọ̀ Gíríìkì kún un.
theological_decisions:
- issue: Ìtọ́kasí “Baba” nínú ọ̀rọ̀ Jésù
  choice: láti ọ̀dọ̀ Baba
  alternative: láti ọ̀dọ̀ Baba mi
  rationale: SBLGNT ní τοῦ πατρός láìsí μου (“mi”). Ìtumọ̀ náà kò yẹ kí ó mú ìbáṣepọ̀ Ọmọ àti Baba le ju bí ẹsẹ̀ yìí ṣe sọ ọ́ lọ, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ṣì mú ìbáṣepọ̀ náà ṣe kedere.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀ àti èdè tí gbogbo ènìyàn lè lóye. Gbólóhùn náà pa ìbéèrè amúnibínú Jésù àti ìtumọ̀ orísun àwọn iṣẹ́ rẹ̀ mọ́.
