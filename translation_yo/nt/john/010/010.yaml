id: JHN.10.10
reference: John 10:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: yo
  text: Olè kì í wá bí kò ṣe láti jalè, láti pa, àti láti parun[a]; èmi wá kí wọ́n lè ní ìyè, kí wọ́n sì ní i lọ́pọ̀ yanturu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pa bí ẹran.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń tọ́ka sí pípa ẹran, èyí tó bá àpèjúwe àwọn àgùntàn nínú àyíká ọ̀rọ̀ náà mu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí wọ́n ní ìyè ní ọ̀pọ̀ yanturu” tàbí “kí wọ́n ní i ní ẹ̀kúnrẹ́rẹ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: Olè
  rationale: Ọ̀rọ̀ náà jẹ́ olúkúlùkù aṣojú tó ní ìtumọ̀ pàtó nínú àpèjúwe olùṣọ́-àgùntàn; Yorùbá lè lo “Olè” láìfi atọ́ka míì kún un.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: kì í wá bí kò ṣe
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìdí ète kan ṣoṣo múlẹ̀, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἵνα κλέψῃ
  choice: láti jalè
  rationale: Ọ̀rọ̀ àìdá “láti” fi ète hàn ní ṣókí, gẹ́gẹ́ bí ἵνα ṣe ń ṣiṣẹ́ níhìn-ín.
- source_word: θύσῃ
  choice: láti pa
  rationale: “Pa” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì lè tọ́ka sí pípa ẹran nínú àyíká ọ̀rọ̀ àgùntàn; àlàyé ìtumọ̀ “pa bí ẹran” wà ní àlàyé ìsàlẹ̀.
- source_word: ἀπολέσῃ
  choice: láti parun
  rationale: “Parun” mú ìtumọ̀ ìparun pátápátá jáde láìsọ irú ìparun náà ní pàtó ju orísun lọ.
- source_word: ἐγὼ ἦλθον
  choice: èmi wá
  rationale: “Èmi” pa ìtẹnumọ́ ἐγώ mọ́, “wá” sì tú aorist náà sílẹ̀ gẹ́gẹ́ bí ìṣe tó rọrùn.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: kí wọ́n lè ní ìyè
  rationale: “Kí… lè” fi ète àti àǹfààní hàn; “ìyè” pa ọ̀rọ̀ pàtàkì ζωὴ mọ́ láìfi “ayérayé” kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: περισσὸν ἔχωσιν
  choice: kí wọ́n sì ní i lọ́pọ̀ yanturu
  rationale: Gbólóhùn yìí so ọ̀pọ̀ yanturu mọ́ ìyè tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ Yorùbá àdánidá tí kò darí sí ìtumọ̀ ọrọ̀-ajé.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ζωὴ nínú Jòhánù
  choice: ìyè
  alternative: ìyè ayérayé; ìyè tòótọ́
  rationale: Kò sí “ayérayé” nínú Gíríìkì ẹsẹ yìí. “Ìyè” dá ààyè sílẹ̀ fún ìjìnlẹ̀ ìtumọ̀ Jòhánù láìfi ẹ̀kọ́ kan tí a kò sọ ní tààrà wọ inú ọ̀rọ̀ náà.
- issue: Agbára περισσὸν
  choice: lọ́pọ̀ yanturu
  alternative: ní ẹ̀kúnrẹ́rẹ́; ní ọ̀pọ̀lọpọ̀
  rationale: Ó sọ nípa ọ̀pọ̀ àti ẹ̀kúnrẹ́rẹ́ ìyè tí Jésù ń fúnni, kì í ṣe ìlérí ọrọ̀ tàbí àǹfààní ohun ìní.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó níyì, tó ṣe kedere, tí ó sì yé òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tó jẹ́ àdánidá. Ìṣọ̀kan “láti jalè, láti pa, àti láti parun” pa ìtẹ̀sí ọ̀rọ̀ mẹ́ta Gíríìkì mọ́; “èmi” sì tẹ ìyàtọ̀ iṣẹ́ Jésù sí ti olè mọ́lẹ̀.
