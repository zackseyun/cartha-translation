id: JHN.10.27
reference: John 10:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: yo
  text: Àwọn àgùntàn mi ń gbọ́ ohùn mi, èmi sì mọ̀ wọ́n, wọ́n sì ń tẹ̀lé mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: Àwọn àgùntàn mi
  rationale: “Àgùntàn” ni ìtumọ̀ Yorùbá tó ṣe déédé fún πρόβατα, “mi” sì fi ohun-ìní tí τὰ ἐμὰ ń tọ́ka sí hàn láì fi ìtẹnumọ́ tí kò pọndandan kún un.
- source_word: τῆς φωνῆς μου
  choice: ohùn mi
  rationale: “Ohùn” bá φωνή mu nínú àkòrí olùṣọ́-àgùntàn, níbi tí àwọn àgùntàn ti ń dá ohùn olùṣọ́ wọn mọ̀.
- source_word: ἀκούουσιν
  choice: ń gbọ́
  rationale: Àmì “ń” fi ìṣe tó ń bá a lọ tàbí ìwà tí ó máa ń ṣẹlẹ̀ hàn, bí present indicative Gíríìkì ṣe rí; “gbọ́” sì pa ìtumọ̀ tààrà mọ́ láì fi ìtumọ̀ ‘fetí sí’ kún un.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: èmi sì mọ̀ wọ́n
  rationale: “Sì” pa ìsopọ̀ καί mọ́, “èmi” sì gba ìtẹnumọ́ díẹ̀ ti ἐγώ. “Mọ̀” jẹ́ àdéhùn tó gbòòrò tó sì jẹ́ kí agbára ìbáṣepọ̀ inú γινώσκω dúró láì túmọ̀ rẹ̀ ju bó ṣe wà lọ.
- source_word: ἀκολουθοῦσίν μοι
  choice: wọ́n sì ń tọ̀ mí lẹ́yìn
  rationale: “Tọ̀ mí lẹ́yìn” jẹ́ ọ̀nà Yorùbá àdánidá fún títẹ̀lé ẹni, “ń” sì fi ìṣe àṣà tàbí ìṣe tó ń bá a lọ hàn.
theological_decisions:
- issue: Agbára ìbáṣepọ̀ inú γινώσκω nínú àpèjúwe olùṣọ́ àti àgùntàn
  choice: mọ̀
  alternative: mọ̀ wọ́n tímọ́tímọ́; dá wọn mọ̀
  rationale: “Mọ̀” pa ìjìnlẹ̀ ìbáṣepọ̀ tó ṣeé rí nínú ọ̀rọ̀ Jòhánù mọ́, ṣùgbọ́n kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan pàtó sínú ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó yẹ; ìtòlẹ́sẹẹsẹ gbólóhùn náà jẹ́ ti Yorùbá àdánidá, pẹ̀lú àsopọ̀ “sì” láti pa ìṣàn ọ̀rọ̀ Gíríìkì mọ́.
