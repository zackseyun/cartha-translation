id: JHN.10.28
reference: John 10:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: yo
  text: Èmi sì ń fún wọn ní ìyè àìnípẹ̀kun, wọn kì yóò sì ṣègbé láéláé; kò sì sí ẹni tí yóò já wọn gbà kúrò ní ọwọ́ mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìyè ayérayé; “ìyè àìnípẹ̀kun” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ náà mu.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: wọn kì yóò sì ṣègbé láéláé
  rationale: Àkójọpọ̀ οὐ μή jẹ́ ìkọ̀sẹ̀ tó lágbára gan-an, εἰς τὸν αἰῶνα sì ń fi “láéláé” kún un. Ìtumọ̀ yìí pa ìtẹnumọ́ méjèèjì mọ́ láì sọ ọ̀rọ̀ di àjèjì ní Yorùbá.
- source_word: ἁρπάσει
  choice: já ... gbà
  rationale: Ó ń tọ́ka sí fífi agbára gbà ohun kan lojijì tàbí ní tipátipá; “já wọn gbà” mú ìtumọ̀ ìṣe líle náà jáde.
- source_word: ἐκ τῆς χειρός μου
  choice: kúrò ní ọwọ́ mi
  rationale: A pa àwòrán “ọwọ́” inú orísun mọ́, nítorí ó jẹ́ àwòrán pàtàkì ní àyíká ẹsẹ yìí.
theological_decisions:
- issue: Agbára ìṣèlérí pé wọn kì yóò ṣègbé
  choice: wọn kì yóò sì ṣègbé láéláé
  alternative: wọn kì yóò sì ṣègbé
  rationale: Orísun ní ìkọ̀sẹ̀ olókun οὐ μή àti gbólóhùn εἰς τὸν αἰῶνα. A túmọ̀ àwọn méjèèjì ní gbangba, láì fi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìtumọ̀ “ọwọ́ mi”
  choice: A pa á mọ́ gẹ́gẹ́ bí àwòrán inú ọ̀rọ̀
  alternative: láti abẹ́ ààbò mi
  rationale: “Ọwọ́ mi” lè ní ìtumọ̀ agbára, ìní, tàbí ààbò; pípa àwòrán náà mọ́ kò fi tipátipá yan ọ̀kan ṣoṣo nínú wọn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti adayébá ni a lò. “Èmi” mú κἀγώ (“Èmi sì”) hàn pẹ̀lú ìtẹnumọ́ díẹ̀; “ń fún” ń ṣàfihàn ìṣe lọwọlọwọ ti δίδωμι. A kò fi àkọlé ẹ̀kọ́ ìsìn tàbí ìtumọ̀ ẹlẹ́gbẹ́ kan kún ọ̀rọ̀.
