  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà mọ́: ìpadà Jésù, ìhà kejì Jọ́dánì, ibi iṣẹ́ ìbatisí Jòhánù ní ìbẹ̀rẹ̀, àti bí ó ṣe dúró níbẹ̀. Síbẹ̀, ìṣọ̀kan ‘kọjá odò Jọ́dánì lọ sí ibi’ lè túmọ̀ sí pé ó kọjá odò náà gẹ́gẹ́ bí ìṣe lójú ọ̀nà, dípò ibi-ìfẹ́sẹ̀mulẹ̀ ‘ní ìhà kejì Odò Jọ́dánì’ tí πέραν τοῦ Ἰορδάνου ń fi hàn.'
