source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: yo
  text: Ó sì tún lọ sí ìhà kejì Odò Jọ́dánì[a], sí ibi tí Jòhánù ti ń ṣe ìbatisí ní ìbẹ̀rẹ̀, ó sì dúró níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kọjá Odò Jọ́dánì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: kọjá ... lọ
  rationale: Ọ̀rọ̀ náà sọ pé ó fi ibi tó wà sílẹ̀, ó sì lọ sí ibòmíràn; ìṣe ‘lọ’ ní ìsopọ̀ pẹ̀lú ‘kọjá odò’ sọ ìṣípò yìí ní Yorùbá àdánidá.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù tún ṣe ìrìnàjò sí agbègbè náà lẹ́ẹ̀kan sí i.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: kọjá odò Jọ́dánì
  rationale: πέραν pẹ̀lú ẹ̀yà olùní nǹkan tọ́ka sí ìhà kejì odò; ‘kọjá odò Jọ́dánì’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìrìn sí ìhà òdìkejì.
- source_word: εἰς τὸν τόπον
  choice: sí ibi
  rationale: εἰς fi ibi tí ìrìn náà ń lọ sí hàn; ‘sí ibi’ bá èyí mu ní Yorùbá.
- source_word: ὅπου ἦν Ἰωάννης
  choice: tí Jòhánù ti
  rationale: Ìṣàmúlò ‘ti’ nínú gbólóhùn ìbátan sọ pé iṣẹ́ Jòhánù ti wáyé níbẹ̀ ṣáájú ìpadà Jésù, láìfi àlàyé àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: τὸ πρῶτον
  choice: ní ìbẹ̀rẹ̀
  rationale: Gbólóhùn adverbial yìí túmọ̀ sí ‘ní àkọ́kọ́’ tàbí ‘ní ìbẹ̀rẹ̀’; yíyan yìí jẹ́ kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: βαπτίζων
  choice: ń ṣe ìbatisí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìṣe àsìkò ìsinsìnyí náà ṣàpèjúwe iṣẹ́ tó ń lọ lọ́wọ́ ní àkókò ìránṣẹ́ Jòhánù; ‘ń ṣe ìbatisí’ pa ìtẹ̀síwájú iṣẹ́ náà mọ́.
- source_word: ἔμεινεν
  choice: dúró
  rationale: μένω níhìn-ín túmọ̀ sí pé ó wà níbẹ̀ fún àkókò kan; ‘dúró níbẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà fún ọ̀rọ̀ ibi náà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘ìbatisí’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí a mọ̀ káàkiri. Àmì [a] wà lẹ́yìn gbólóhùn ibi tí àlàyé ìsàlẹ̀ náà bá mu jù, bó tilẹ̀ jẹ́ pé àṣàyàn ọ̀rọ̀ náà dá lórí πέραν τοῦ Ἰορδάνου.
