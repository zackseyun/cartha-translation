id: JHN.10.17
reference: John 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: yo
  text: Nítorí èyí ni Baba fi fẹ́ràn mi, nítorí mo fi ìyè mi[a] lélẹ̀ kí n lè tún gbà á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkàn mi.” Níhìn-ín, ψυχή ń tọ́ka sí ìyè Jésù, èyí tí ó fi lélẹ̀ nínú ikú, tí ó sì tún gbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó ń fi ìdí ohun tí ó tẹ̀ lé e hàn, ó sì jẹ́ ọ̀nà àdánidá láti so ẹsẹ yìí pọ̀ mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: Baba fi fẹ́ràn mi
  rationale: ‘Baba’ pa àpèjúwe onítumọ̀ pàtó inú Gíríìkì mọ́ láì fi ‘Baba mi’ kún un; àkójọpọ̀ ‘ni ... fi’ bá ìpilẹ̀ ìdí ‘Nítorí èyí’ mu ní Yorùbá.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń sọ ìdí, kì í ṣe àkóónú nìkan.
- source_word: τίθημι τὴν ψυχήν μου
  choice: mo fi ẹ̀mí mi lélẹ̀
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún fífi ìyè ẹni sílẹ̀ ní ikú, ó sì pa àfihàn ìṣe àtinúwá náà mọ́.
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó pa agbára ète inú gbólóhùn Gíríìkì mọ́ láì sọ ọ́ di ọjọ́ iwájú lasan.
- source_word: πάλιν λάβω αὐτήν
  choice: tún gbà á
  rationale: ‘Tún’ fi πάλιν hàn, ‘gbà á’ sì pa ìtumọ̀ λάβω mọ́ láì pinnu bóyá a ó túmọ̀ ọ́ sí ‘gba padà’ tàbí ‘gbé dìde’.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ nípa ikú Jésù àtinúwá
  choice: ẹ̀mí mi
  alternative: ìyè mi; ọkàn mi
  rationale: Nínú àyíká yìí, ψυχή túmọ̀ sí ìyè tí Jésù fi sílẹ̀ nínú ikú, tí ó sì tún gbà. ‘Ẹ̀mí mi’ jẹ́ àsọyé Yorùbá àdánidá nínú àpólà yìí, àlàyé ìsàlẹ̀ sì dènà fífi ìtumọ̀ ‘spirit’ nìkan lé e lórí.
- issue: Agbára ἵνα pẹ̀lú λάβω nípa ikú àti àjíǹde Jésù
  choice: kí n lè tún gbà á
  alternative: kí n tún gbà á; kí n lè tún gba ìyè mi padà
  rationale: Àṣàyàn náà pa ète/àbájáde tí ἵνα lè ní mọ́, kò sì sọ ìbáṣepọ̀ ikú àti àjíǹde náà ní ọ̀nà tó ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó lọ́lá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àpólà ‘fi ẹ̀mí mi lélẹ̀’ jẹ́ àdánidá, ó sì pa àwòrán fífi ìyè sílẹ̀ àtinúwá mọ́.
