source:
  edition: SBLGNT
  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin kò gbàgbọ́,[a] nítorí ẹ̀yin kì í ṣe ara àwọn àgùntàn mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n ẹ̀yin kò gbàgbọ́ pé ẹ̀yin kì í ṣe ara àwọn àgùntàn mi.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè tọ́ka sí àkóónú ohun tí wọn kò gbàgbọ́ dípò kí ó sọ ìdí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ohun tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative conjunction ní Yorùbá.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì, ó sì ní ìtẹnumọ́; “ẹ̀yin” pa ìtẹnumọ́ yẹn mọ́ láìṣe àfikún tí ó pọ̀jù.
- source_word: οὐ πιστεύετε
  choice: kò gbàgbọ́
  rationale: Present active indicative pẹ̀lú ìsẹ́ ni a túmọ̀ sí ìṣe ìsinsìnyí ní ọ̀nà Yorùbá tí ó wọ́pọ̀; “gbàgbọ́” bá lílò Jòhánù mu.
- source_word: ὅτι
  choice: nítorí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ìtumọ̀ causal ni ó ṣeé ṣe jù, ṣùgbọ́n Gíríìkì tún lè mú gbólóhùn àkóónú wọlé; a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: οὐκ ἐστὲ
  choice: ẹ̀yin kò sí
  rationale: Èyí túmọ̀ copula tí a sẹ́ ní ọ̀nà Yorùbá tí ó ṣe kedere, pẹ̀lú arọ́pò-orúkọ fún ìtẹnumọ́.
- source_word: ἐκ τῶν προβάτων
  choice: lára àwọn àgùntàn
  rationale: ἐκ níbí ń tọ́ka sí jíjẹ́ ara ẹgbẹ́ kan; “lára” sọ ìbáṣepọ̀ ẹgbẹ́ náà ní Yorùbá àdánidá.
- source_word: τῶν ἐμῶν
  choice: mi
  rationale: Possessive adjective náà jẹ́ ti “àwọn àgùntàn”; Yorùbá fi “mi” sí ẹ̀yìn orúkọ ní ọ̀nà àdánidá.
theological_decisions:
- issue: Agbára ὅτι láàárín àìgbàgbọ́ àti jíjẹ́ ara àwọn àgùntàn Jésù
  choice: 'Ìtumọ̀ ìdí: “nítorí ẹ̀yin kò sí lára àwọn àgùntàn mi”'
  alternative: 'Ìtumọ̀ àkóónú: “ẹ̀yin kò gbàgbọ́ pé ẹ̀yin kò sí lára àwọn àgùntàn mi”'
  rationale: Ìtumọ̀ ìdí bá ìṣàn ọ̀rọ̀ Jòhánù 10 mu, níbi tí àwọn àgùntàn Jésù ti ń gbọ́ ohùn rẹ̀ tí wọ́n sì ń tẹ̀ lé e. Síbẹ̀, ὅτι lè mú àkóónú ohun tí a kò gbàgbọ́ wọlé; a kò gbọdọ̀ fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan yanju àìdánilójú yìí, nítorí náà a fi ọ̀nà kejì sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Lára àwọn àgùntàn mi” jẹ́ ọ̀nà àdánidá tí ó fi jíjẹ́ ara agbo hàn láìfi èrò ẹ̀kọ́ ìgbàgbọ́ míì kún un.
