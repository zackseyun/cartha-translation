  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn sì wá sọ́dọ̀ rẹ̀, wọ́n sì ń sọ pé, “Jòhánù kò ṣe àmì kankan[a], ṣùgbọ́n gbogbo ohun tí Jòhánù sọ nípa ọkùnrin yìí[b] jẹ́ òtítọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jòhánù kò ṣe àmì kan ṣoṣo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa rẹ̀.” Gíríìkì náà ní “nípa ẹni yìí/ọkùnrin yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọ̀pọ̀ ènìyàn
  rationale: Àjẹtífù ọ̀pọ̀ náà dúró gẹ́gẹ́ bí orúkọ nínú Gíríìkì; fífi ‘ènìyàn’ kún un mú kí ó ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò lọ sọ́dọ̀ ẹni kan hàn, ó sì bá ojú ìwòye ìtàn náà mu ní Yorùbá.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àmì ‘ń’ pa ìṣe tí ó ń lọ tàbí tí a ń ṣe léraléra mọ́, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: σημεῖον
  choice: àmì
  rationale: '‘Àmì’ pa ìtumọ̀ pàtàkì ọ̀rọ̀ náà mọ́ nínú Ìhìn Rere Jòhánù: iṣẹ́ tí ń tọ́ka sí ohun tí ó ju iṣẹ́ ìyanu lásán lọ.'
- source_word: ἐποίησεν οὐδέν
  choice: kò ṣe àmì kankan
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìkọ̀ pátápátá, ó sì fara mọ́ ìrọ̀rùn ọ̀rọ̀ Gíríìkì.
- source_word: πάντα δὲ ὅσα
  choice: gbogbo ohun tí
  rationale: Ó pa agbára ìkójọpọ̀ gbogbo nǹkan tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: περὶ τούτου
  choice: nípa ọkùnrin yìí
  rationale: ‘Ọkùnrin yìí’ fi agbára demonstrative τούτου hàn, ó sì tọ́ka sí Jésù ní kedere láì mú ìtumọ̀ mìíràn wọlé.
- source_word: ἀληθῆ ἦν
  choice: òtítọ́ ni
  rationale: Èyí sọ predicate ‘jẹ́ òtítọ́’ ní Yorùbá tó rọrùn, láì fi èrò pé ohun náà ṣẹ̀ṣẹ̀ fìdí múlẹ̀ kún un.
theological_decisions:
- issue: Ìlò σημεῖον gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì nínú Jòhánù
  choice: àmì
  alternative: iṣẹ́ ìyanu
  rationale: '‘Àmì’ pa ìlò oníṣòwò-ọ̀rọ̀ Jòhánù mọ́: iṣẹ́ náà ń tọ́ka kọjá ara rẹ̀ sí ẹni àti iṣẹ́ Jésù; ‘iṣẹ́ ìyanu’ lè dín ìtumọ̀ yìí kù.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘Jòhánù’ gẹ́gẹ́ bí àkọtọ̀ orúkọ Bíbélì tí ó wọ́pọ̀.
