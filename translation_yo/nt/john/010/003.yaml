id: JHN.10.3
reference: John 10:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: yo
  text: Olùṣọ́ ẹnu ọ̀nà ń ṣí fún un, àwọn àgùntàn sì ń gbọ́ ohùn rẹ̀. Ó ń pe ọ̀kọ̀ọ̀kan àwọn àgùntàn tirẹ̀ ní orúkọ, ó sì ń darí wọn jáde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń mú wọn jáde.”
    reason: ἐξάγω lè túmọ̀ sí “darí jáde” tàbí “mú jáde”; àṣàyàn kejì kò tẹnu mọ́ ìtọ́sọ́nà bí ti àkọ́kọ́.
lexical_decisions:
- source_word: τούτῳ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí olùṣọ́-àgùntàn tí ẹsẹ tó ṣáájú mẹ́nu kàn; “fún un” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé olùṣọ́ ẹnu ọ̀nà ṣí ọ̀nà fún ẹni náà.
- source_word: ὁ θυρωρός
  choice: Olùṣọ́ ẹnu ọ̀nà
  rationale: Ó tọ́ka sí ẹni tó ń ṣọ́ ẹnu ọ̀nà ibùdó àgùntàn, tí ó sì lè ṣí i; gbólóhùn yìí ṣe kedere ju ọ̀rọ̀ àtijọ́ tàbí èyí tó lè túmọ̀ sí olùṣọ́ ilé lásán lọ.
- source_word: ἀνοίγει
  choice: ṣí i sílẹ̀
  rationale: Ìṣe àsìkò ìsinsìnyí ni; arọ́pò ohun “i” ń tọ́ka sí ẹnu ọ̀nà tí àyíká ọ̀rọ̀ ti sọ di mímọ̀.
- source_word: τὰ πρόβατα
  choice: àwọn àgùntàn
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àwòrán iṣẹ́ olùṣọ́-àgùntàn mu.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: ń gbọ́ ohùn rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní ẹyọ, kókó ọ̀rọ̀ aláìlẹ́mìí tó jẹ́ ọ̀pọ̀ lè gba irú ìbámu bẹ́ẹ̀ ní Gíríìkì; Yorùbá fi ìtumọ̀ ọ̀pọ̀ hàn nípasẹ̀ “àwọn àgùntàn.” “Gbọ́ ohùn rẹ̀” pa ìtumọ̀ gidi àti ìmọ̀-ohùn mọ́.
- source_word: τὰ ἴδια πρόβατα
  choice: àwọn àgùntàn tirẹ̀
  rationale: “Tirẹ̀” tẹnu mọ́ ìní àti àjọṣe pàtàkì láàárín olùṣọ́-àgùntàn àti agbo rẹ̀.
- source_word: φωνεῖ
  choice: ń pe
  rationale: “Pe” jẹ́ ọ̀rọ̀ àdánidá nínú àyíká tí olùṣọ́-àgùntàn ti ń pe ẹran rẹ̀, láìfi ìtumọ̀ àlàyé míì kún un.
- source_word: κατ’ ὄνομα
  choice: kọ̀ọ̀kan ní orúkọ
  rationale: Ó fi hàn pé ó pe àgùntàn náà ní ọ̀kọ̀ọ̀kan ní orúkọ tirẹ̀; èyí mú agbára ìtumọ̀ gbólóhùn Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: ἐξάγει αὐτά
  choice: ń darí wọn jáde
  rationale: ἐξάγω lè túmọ̀ sí mímú ohun jáde tàbí dídarí rẹ̀ jáde. Nínú àwòrán olùṣọ́-àgùntàn, “darí wọn jáde” fi ìtọ́sọ́nà olùṣọ́ náà hàn dáadáa, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn míì mọ́.
theological_decisions:
- issue: Àwòrán olùṣọ́-àgùntàn àti ẹni tó ń ṣe àwọn ìṣe náà
  choice: 'A fi gbogbo ìṣe náà sí ọwọ́ ẹni tí àwòrán náà pè ní olùṣọ́-àgùntàn: olùṣọ́ ẹnu ọ̀nà ṣí fún un, àwọn àgùntàn gbọ́ ohùn rẹ̀, ó pe àwọn tirẹ̀, ó sì darí wọn jáde.'
  alternative: Láti fi orúkọ Jésù sínú ẹsẹ náà tààràtà tàbí láti tú àwòrán náà ní ọ̀nà ẹ̀kọ́ ìgbàgbọ́.
  rationale: Àyíká ọ̀rọ̀ ń darí òǹkàwé sí ìtumọ̀ àwòrán náà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò dárúkọ Jésù. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí ọrọ̀ àwòrán náà fi sílẹ̀ fún àlàyé.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tó yẹ. “Olùṣọ́ ẹnu ọ̀nà” àti “ń darí wọn jáde” pa àwòrán ibùdó àgùntàn mọ́ láìdi èdè àtijọ́ tàbí èdè ẹ̀kọ́ ìsìn pàtó.
