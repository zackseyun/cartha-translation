id: JHN.10.9
reference: John 10:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: yo
  text: Èmi ni ilẹ̀kùn.[a] Bí ẹnikẹ́ni bá wọlé nípasẹ̀ mi, a ó gbà á là; yóò wọlé, yóò sì jáde, yóò sì rí ibi ìjẹko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹnubodè.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ilẹ̀kùn tàbí ẹnubodè; a lo “ilẹ̀kùn” nínú ẹsẹ̀ gẹ́gẹ́ bí ìtumọ̀ tó tààrà jù lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: ilẹ̀kùn
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ilẹ̀kùn tàbí ẹnu-ọ̀nà. “Ilẹ̀kùn” ni ìtumọ̀ tààrà jù lọ, ó sì pa àkàwé tí Jésù lò mọ́; “ẹnu-ọ̀nà” wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tó bá àyíká agbo àgùntàn mu.
- source_word: δι’ ἐμοῦ
  choice: gba ọ̀dọ̀ mi
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive fi ọ̀nà tàbí ohun èlò hàn. “Gba ọ̀dọ̀ mi” sọ ní Yorùbá àdánidá pé Jésù ni ọ̀nà tí ẹni náà fi wọlé.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Bí ẹnikẹ́ni bá ... wọlé
  rationale: Ìṣètò ἐάν pẹ̀lú subjunctive jẹ́ gbólóhùn àídájú gbogbogbò; “bí ẹnikẹ́ni bá” pa ìwọ̀n ṣíṣí τις mọ́ ní Yorùbá àdánidá.
- source_word: σωθήσεται
  choice: a ó gbà á là
  rationale: Ìtumọ̀ yìí pa èrò ìgbàlà mọ́ láì dín un kù sí ààbò ara nìkan tàbí láì fi ẹ̀kọ́ ìsìn tóóró kún un.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: yóò wọlé, yóò sì jáde
  rationale: Ó pa ìṣípò méjèèjì àti ọ̀nà ọ̀rọ̀ tó jọra nínú Gíríìkì mọ́ láì túmọ̀ àwòrán náà rékọjá ohun tí ẹsẹ̀ sọ.
- source_word: νομὴν
  choice: ibi ìjẹko
  rationale: νομή tọ́ka sí pápá tàbí ibi tí ẹran ti ń jẹko; “ibi ìjẹko” ṣe kedere, ó sì bá àwòrán olùṣọ́-àgùntàn àti àgùntàn mu.
- source_word: εὑρήσει
  choice: yóò rí
  rationale: “Rí” ni ìtumọ̀ Yorùbá tó rọrùn, tó sì tààrà fún εὑρίσκω níbí.
theological_decisions:
- issue: Àkàwé θύρα nínú àyíká iṣẹ́ olùṣọ́-àgùntàn
  choice: ilẹ̀kùn
  alternative: ẹnu-ọ̀nà
  rationale: “Ilẹ̀kùn” pa ìtumọ̀ tààrà àti àkàwé “Èmi ni” mọ́. “Ẹnu-ọ̀nà” lè bá àyíká agbo àgùntàn mu, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀ dípò kí a fi yanju àìdánilójú ọ̀rọ̀ náà ní ìkọ̀kọ̀.
- issue: Ìwọ̀n ìtumọ̀ σωθήσεται
  choice: a ó gbà á là
  alternative: a ó dá a sílẹ̀ / a ó gbà á kúrò nínú ewu
  rationale: “A ó gbà á là” gba ìtumọ̀ ìgbàlà tó gbòòrò nínú Ìhìn Rere Jòhánù láyè, ó sì pa ìfarakanra rẹ̀ pẹ̀lú àwòrán ààbò àgùntàn mọ́ láì sọ ọ́ di ààbò ti ara nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “a ó gbà á là” gẹ́gẹ́ bí àkànlò èdè aláìsọ ẹni tó ṣe iṣẹ́ náà ní pàtó, èyí tó bá passive Gíríìkì mu.
