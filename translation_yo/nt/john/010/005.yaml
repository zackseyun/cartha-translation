id: JHN.10.5
reference: John 10:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: yo
  text: Ṣùgbọ́n wọn kì yóò tẹ̀lé àjèjì kan láéláé[a]; dípò bẹ́ẹ̀, wọn yóò sá kúrò lọ́dọ̀ rẹ̀, nítorí wọn kò mọ ohùn àwọn àjèjì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kì yóò tẹ̀lé àjèjì kan rárá.” Èdè Gíríìkì lo ìkọ̀ tí a tẹnumọ́ (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: “Mọ ohùn” tún lè túmọ̀ sí “dá ohùn mọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: àjèjì kan
  rationale: Nínú àkàwé olùṣọ́-àgùntàn, ọ̀rọ̀ náà tọ́ka sí ẹni tí kì í ṣe ẹni tí àwọn àgùntàn mọ̀ tàbí ẹni tí ó jẹ́ tiwọn; “àjèjì kan” jẹ́ èdè Yorùbá àdánidá, kò sì fi ọ̀rọ̀ ẹ̀yà tàbí orílẹ̀-èdè kún un.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: kì yóò tẹ̀lé ... láé
  rationale: οὐ μή pẹ̀lú ọ̀rọ̀-ìṣe ọjọ́ iwájú jẹ́ ìkọ̀ tí a tẹnumọ́ gidigidi. Ìhun “kì yóò ... láé” mú agbára yẹn jáde ní Yorùbá òde òní.
- source_word: ἀκολουθήσουσιν
  choice: tẹ̀lé
  rationale: “Tẹ̀lé” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ fún ìrìn àwọn àgùntàn lẹ́yìn olùṣọ́.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: wọn yóò sá kúrò lọ́dọ̀ rẹ̀
  rationale: Ìhun yìí fi hàn pé wọn yóò yà kúrò lọ́dọ̀ ẹni náà ní kíákíá; ó pa agbára φεύγω àti ἀπό mọ́.
- source_word: οἴδασι
  choice: mọ
  rationale: οἶδα lè túmọ̀ sí “mọ̀” tàbí “dá ... mọ̀.” “Mọ ohùn” jẹ́ ìhun Yorùbá tó ṣeé lóye, ó sì pa àfojúsùn gbooro ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τῶν ἀλλοτρίων
  choice: àwọn àjèjì
  rationale: Ọ̀pọ̀ nọ́ńbà nínú Gíríìkì ń tọ́ka sí gbogbo irú àwọn ẹni tí àwọn àgùntàn kò mọ̀; “àwọn àjèjì” túmọ̀ rẹ̀ tààrà.
- source_word: φωνήν
  choice: ohùn
  rationale: “Ohùn” pa ìtumọ̀ gidi ti ohùn tàbí ìpè ẹni kan mọ́, pẹ̀lú agbára ìbáṣepọ̀ tó wà nínú àkòrí náà.
- source_word: δὲ ... ἀλλὰ
  choice: Ṣùgbọ́n ... dípò bẹ́ẹ̀
  rationale: 'Àwọn patíkù méjèèjì fi ìtakora hàn: wọn kì yóò ṣe ohun kan, wọn yóò sì ṣe òdìkejì rẹ̀. Ìhun Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtakora náà mọ́.'
theological_decisions:
- issue: Agbára àkàwé àgùntàn àti olùṣọ́-àgùntàn
  choice: A pa àkàwé náà mọ́ gẹ́gẹ́ bí ó ti wà, láì ṣàlàyé “àjèjì” nínú ẹsẹ náà.
  alternative: Kí a pe “àjèjì” ní olùkọ́ èké tàbí aṣáájú tí kò lẹ́tọ̀ọ́ ní tààrà.
  rationale: Ẹsẹ náà fúnra rẹ̀ ṣì ń sọ̀rọ̀ nínú àkàwé, kò sì sọ ní kedere níbí ẹni tí “àjèjì” dúró fún. Ṣíṣe àlàyé rẹ̀ nínú ọ̀rọ̀ àkọ́kọ́ yóò fi ìtumọ̀ kan kún ohun tí Gíríìkì sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní; a kò fi àlàyé ẹ̀kọ́ ìsìn kún àkàwé náà.
