id: JHN.10.36
reference: John 10:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: yo
  text: Ṣé ẹ̀yin wá ń sọ fún ẹni tí Bàbá yà sí mímọ́[a], tí ó sì rán án sí ayé pé, ‘Ìwọ ń sọ̀rọ̀-òdì sí Ọlọ́run,’ nítorí mo sọ pé, ‘Èmi ni Ọmọ Ọlọ́run’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ di mímọ́” tàbí “yà sọ́tọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: yà sí mímọ́
  rationale: Ó pa ìtumọ̀ yíyan ẹni kan sọ́tọ̀ fún Ọlọ́run àti iṣẹ́ rẹ̀ mọ́, láìdábàá pé Ọmọ náà jẹ́ aláìmọ́ tẹ́lẹ̀. Àlàyé ìtumọ̀ míì wà ní àlàyé ìsàlẹ̀.
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere ni fún ìránṣẹ́ àti iṣẹ́ tí Baba fi fún Ọmọ, ó sì pa èdè iṣẹ́-ìránṣẹ́ inú Jòhánù mọ́.
- source_word: κόσμον
  choice: ayé
  rationale: ‘Ayé’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κόσμος nínú àyíká ọ̀rọ̀ yìí, ó sì lè ru ìtumọ̀ ẹ̀dá ayé àti àwọn ènìyàn inú rẹ̀.
- source_word: Βλασφημεῖς
  choice: Ìwọ ń sọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Ó sọ ẹ̀sùn sisọ ọ̀rọ̀ àbùkù tàbí ọ̀rọ̀-òdì sí Ọlọ́run ní Yorùbá adayeba, ó sì fi ìṣe tó ń lọ hàn.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá adayeba àti ọ̀wọ̀ fún oyè Kristi yìí, ó sì pa agbára ọ̀rọ̀ náà nínú àríyànjiyàn mọ́.
- source_word: ὃν ὁ πατὴρ
  choice: ẹni tí Baba
  rationale: Ó tú ìbátan gírámà Gíríìkì náà sí Yorùbá tó ṣe kedere, nígbà tó ń tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí Baba ṣe ohun méjèèjì sí.
- source_word: ὅτι ... ὅτι
  choice: ń sọ ... pé ... nítorí mo sọ pé
  rationale: ‘Pé’ àkọ́kọ́ ṣàgbékalẹ̀ ọ̀rọ̀ ẹ̀sùn, ‘nítorí’ sì fi ìdí ẹ̀sùn náà hàn ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἡγίασεν nípa Ọmọ
  choice: yà sí mímọ́
  alternative: sọ di mímọ́; yà sọ́tọ̀
  rationale: ‘Yà sí mímọ́’ pa ìsopọ̀ mọ́ ìwà mímọ́ àti ìyàsímímọ́ fún iṣẹ́ Ọlọ́run, ṣùgbọ́n kò fi hàn pé Ọmọ nílò àtúnṣe ìwà. Ó tún pa ìfọ̀rọ̀wérọ̀ ìtumọ̀ ọ̀rọ̀ náà mọ́.
- issue: Agbára oyè Υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  alternative: Ọmọ tí ó jẹ́ ti Ọlọ́run
  rationale: ‘Ọmọ Ọlọ́run’ jẹ́ oyè Kristi tó ṣe kedere, tó bá ẹ̀sùn ọ̀rọ̀-òdì sí Ọlọ́run mu, láìfi àlàyé ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, adayeba, àti òde òní ni a lò. ‘Ẹ̀yin’ ṣe àfihàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀; ‘ìwọ’ inú ọ̀rọ̀ tí wọ́n fi kàn án jẹ́ ẹyọ. A gbe àmì àlàyé [a] sí òpin ẹsẹ̀ kí ó má bà a ya ìṣàn gbolohun náà.
