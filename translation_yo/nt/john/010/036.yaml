  source_fidelity: 'Ìtumọ̀ náà pa ìlànà gírámà àti ìtumọ̀ Gíríìkì mọ́ lápapọ̀: Bàbá ni ó yà ẹni náà sí mímọ́, ó sì rán án sínú ayé; ẹ̀sùn náà sì dá lórí ọ̀rọ̀ rẹ̀ pé òun ni Ọmọ Ọlọ́run. Ṣùgbọ́n ìṣe ‘rán’ nílò arọ́pò-orúkọ ohun-ìṣe ‘án’ nínú gbolohun Yorùbá yìí.'
  naturalness: ‘Ẹni tí Bàbá ... tí ó sì rán án sí ayé’ jẹ́ Yorùbá ìpele ọ̀wọ̀ tó rọrùn, tó sì ṣe kedere. Gbigbe àmì ohun sí ‘Bàbá’ tún bá ìlànà àmì ohùn Yorùbá mu.
  terminology: ‘Yà sí mímọ́’ yẹ fún ἡγίασεν, ó sì yẹ kí àlàyé ìsàlẹ̀ ṣàfihàn ‘sọ di mímọ́’ àti ‘yà sọ́tọ̀’ gẹ́gẹ́ bí yíyan míì. ‘Ọmọ Ọlọ́run’ àti ‘sọ̀rọ̀-òdì sí Ọlọ́run’ pa oyè àti ẹ̀sùn βλασφημεῖς mọ́ dáadáa.
  issues:
