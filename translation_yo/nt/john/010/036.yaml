  - severity: low
    issue: Àmì àlàyé ìsàlẹ̀ wà ní òpin ẹsẹ̀ dípò lẹ́gbẹ̀ẹ́ ọ̀rọ̀ ‘yà sí mímọ́’ tí ó ń ṣàlàyé.
    rationale: Gbigbe [a] lẹ́yìn ọ̀rọ̀ náà mú ìtọ́kasí lexical alternative hàn kedere, láìní ìyípadà ìtumọ̀.
