  to: Ṣé ẹ̀yin wá ń sọ fún ẹni tí Bàbá yà sí mímọ́[a], tí ó sì rán án sí ayé pé, ‘Ìwọ ń sọ̀rọ̀-òdì sí Ọlọ́run,’ nítorí mo sọ pé, ‘Èmi ni Ọmọ Ọlọ́run’?”
