id: JHN.10.7
reference: John 10:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: yo
  text: Nítorí náà, Jésù tún sọ fún wọn pé, “Lóòótọ́, lóòótọ́ ni mo sọ fún yín, èmi ni ẹnu-ọ̀nà àwọn àgùntàn.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibodè àwọn àgùntàn.” Ọ̀rọ̀ Gíríìkì θύρα lè túmọ̀ sí “ẹnu-ọ̀nà,” “ilẹ̀kùn,” tàbí “ibodè,” pàápàá nínú àwòrán iṣẹ́ olùṣọ́ àgùntàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú àti àbájáde ọ̀rọ̀ tí ó ṣáájú hàn, bí ọ̀rọ̀ Gíríìkì ṣe rí.
- source_word: πάλιν
  choice: tún
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ní kedere pé Jésù tún ń sọ̀rọ̀ lẹ́ẹ̀kan sí i.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnwí àti ìtẹnumọ́ ọ̀rọ̀ Jésù mọ́, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: λέγω ὑμῖν
  choice: ni mo sọ fún yín
  rationale: Ó jẹ́ ọ̀nà àdánidá láti sọ gbólóhùn yìí ní Yorùbá, pẹ̀lú ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ pàtàkì náà.
- source_word: ἐγώ εἰμι
  choice: èmi ni
  rationale: Lílo “èmi” ní kíkún pa ìtẹnumọ́ arọ́pò-orúkọ inú Gíríìkì mọ́.
- source_word: θύρα
  choice: ẹnu-ọ̀nà
  rationale: Ó lè túmọ̀ sí ibi tí a ń gbà wọlé, yálà ilẹ̀kùn tàbí ibodè; “ẹnu-ọ̀nà” bá àwòrán agbo àgùntàn mu láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: τῶν προβάτων
  choice: àwọn àgùntàn
  rationale: Ìsọ̀rí “ẹnu-ọ̀nà àwọn àgùntàn” pa ìbáṣepọ̀ genitive náà mọ́ láì sọ ọ́ di “fún àwọn àgùntàn” tàbí ṣàlàyé àwòrán náà ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Àpèjúwe ara ẹni nínú gbólóhùn “èmi ni”
  choice: èmi ni ẹnu-ọ̀nà àwọn àgùntàn
  alternative: èmi ni ibodè àwọn àgùntàn
  rationale: A pa àpèjúwe Jésù gẹ́gẹ́ bí ọ̀nà ìwọlé mọ́ láì ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ ní tààrà. Àlàyé ìsàlẹ̀ ojú ìwé pa “ibodè” mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn tó bá àwòrán agbo àgùntàn mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa àtúnwí àti ìtẹnumọ́ Gíríìkì mọ́.
