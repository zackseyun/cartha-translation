lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: Bí èmi kò bá ń ṣe
  rationale: Àkójọpọ̀ yìí fi gbólóhùn oní条件 hàn, ó sì pa ìṣe tí ó ń lọ lọ́wọ́ mọ́. Fífi “èmi” hàn mú ìtẹnumọ́ ẹni àkọ́kọ́ inú ọ̀rọ̀ Gíríìkì náà yọ dáadáa.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” jẹ́ ọ̀nà àdánidá láti túmọ̀ ἔργα, ó sì pa ìtumọ̀ Johanu mọ́ níbi tí àwọn iṣẹ́ Jesu ti ń jẹ́ ẹ̀rí sí ẹni tí ó jẹ́.
- source_word: τοῦ πατρός μου
  choice: Baba mi
  rationale: Ìtumọ̀ tààrà ti àkójọpọ̀ genitive náà ni; “Baba” jẹ́ orúkọ ìbáṣepọ̀ fún Ọlọ́run nínú àyíká yìí.
- source_word: μὴ πιστεύετέ μοι
  choice: ẹ má ṣe gbà mí gbọ́
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ ìdènà sí ọ̀pọ̀ ènìyàn. “Gbà mí gbọ́” pa ẹni tí ìgbàgbọ́ náà dojú kọ mọ́, láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Agbára ìtumọ̀ πιστεύω pẹ̀lú dative μοι
  choice: ẹ má ṣe gbà mí gbọ́
  alternative: ẹ má ṣe gba ohun tí mo sọ gbọ́
  rationale: Ìkójọpọ̀ Gíríìkì lè túmọ̀ sí gbígba ẹnì kan gbọ́, ó sì tún lè ní í ṣe pẹ̀lú gbígba ọ̀rọ̀ ẹni náà gbọ́. Ọ̀rọ̀ àkọ́kọ́ pa ìtọ́kasí tààrà sí Jesu mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn láì yanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. “Ẹ” bá ọ̀pọ̀ ẹni tí Jesu ń bá sọ̀rọ̀ mu; àmì ohùn ni a lò ní kikún níbi tí ó bá jẹ́ àdánidá.
