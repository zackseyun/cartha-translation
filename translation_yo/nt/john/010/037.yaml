  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: yo
  text: Bí n kò bá ṣe àwọn iṣẹ́ Baba mi, ẹ má ṣe gbà mí gbọ́;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe gba ohun tí mo sọ gbọ́.”
