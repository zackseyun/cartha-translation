  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ Gíríìkì mọ́ ní pàtàkì: εἰ οὐ ποιῶ jẹ́ gbólóhùn àdéhùn pẹ̀lú ìkọ̀, τὰ ἔργα τοῦ πατρός μου ni ‘iṣẹ́ Baba mi,’ àti μὴ πιστεύετέ μοι jẹ́ ìdènà sí àwọn olùgbọ́. Ṣùgbọ́n ‘Bí èmi kò bá ń ṣe’ lè túmọ̀ sí ìṣe tí ó lè má ṣẹlẹ̀ (‘if I do not end up doing’) dípò ìpo tí a ń sọ ní báyìí. ‘Bí n kò bá ṣe’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ‘If I am not doing/do not do’ nínú àyíká yìí.'
