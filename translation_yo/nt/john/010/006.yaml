id: JHN.10.6
reference: John 10:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: yo
  text: Jésù sọ ọ̀rọ̀ àpèjúwe yìí fún wọn[a], ṣùgbọ́n wọn kò lóye ohun tí ó ń sọ fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “òwe,” “àpèjúwe,” tàbí “ọ̀rọ̀ olówe.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ àfiwé ní gbogbogbòò; níbí, ó ń tọ́ka sí ọ̀rọ̀ Jésù nípa olùṣọ́ àgùntàn, èyí tí kò yẹ kí a mú ní ìtumọ̀ tààràtà.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: ọ̀rọ̀ àpèjúwe
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ olówe, òwe, tàbí àpèjúwe tí ìtumọ̀ rẹ̀ kò hàn ní tààràtà. “Ọ̀rọ̀ àpèjúwe” bá àyíká ọ̀rọ̀ olùṣọ́ àgùntàn mu, kò sì fi dandan sọ ọ́ di “òwe” tàbí irú àkànṣe “òwe àkàwé.”
- source_word: εἶπεν
  choice: sọ
  rationale: “Sọ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé Jésù sọ ọ̀rọ̀ náà fún wọn.
- source_word: ἐκεῖνοι δὲ
  choice: ṣùgbọ́n wọn
  rationale: Èyí pa ìyàtọ̀ tó wà láàárín Jésù àti àwọn olùgbọ́ rẹ̀ mọ́, ó sì sọ δέ di atakò tó bá àyíká mu.
- source_word: οὐκ ἔγνωσαν
  choice: wọn kò lóye
  rationale: Nínú àyíká yìí, γινώσκω tọ́ka sí àìní òye nípa ohun tí Jésù ń sọ, kì í ṣe pé wọn kò mọ ohun kan lásán.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: ohun tí ó ń sọ fún wọn
  rationale: Èdè Gíríìkì náà le díẹ̀ ní ọ̀nà gírámà, ṣùgbọ́n kókó rẹ̀ ni pé wọn kò lóye ọ̀rọ̀ Jésù. Ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa àìlóye wọn mọ́ láìfi “ohun tí ó ní lọ́kàn” kún un ní tààràtà.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dátífù náà fi àwọn tí Jésù ń bá sọ̀rọ̀ hàn; “fún wọn” jẹ́ àdánidá ní Yorùbá, a sì tún un sọ ní òpin bí ó ti rí nínú Gíríìkì.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, ti òde òní, tó ṣe kedere fún gbogbo ènìyàn ni a lò. A yan “ọ̀rọ̀ àpèjúwe” láti yẹra fún fífi ìtumọ̀ àkànṣe kan lé παροιμία lórí, a sì lo “lóye” láti fi ìkùnà àwọn olùgbọ́ láti mọ ìtumọ̀ ọ̀rọ̀ náà hàn.
