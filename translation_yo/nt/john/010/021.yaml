  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní gbogbogbòò: ‘Àwọn mìíràn ń sọ’ ń pa imperfect ἔλεγον mọ́; ‘ẹni tí ẹ̀mí èṣù ń bẹ lára rẹ̀’ ṣàfihàn δαιμονιζομένου láì fi èrò ẹ̀kọ́ mìíràn kún un; ‘la ojú àwọn afọ́jú’ sì pa àwòrán ἀνοῖξαι ... ὀφθαλμούς mọ́. Síbẹ̀, ìbéèrè àfikún ‘àbí ó lè ṣe bẹ́ẹ̀?’ lè mú kí ìbéèrè náà dà bí ìbéèrè tí ó ṣí sílẹ̀ dípò ìbéèrè Gíríìkì μή tí ó ń retí ìdáhùn òdì.'
