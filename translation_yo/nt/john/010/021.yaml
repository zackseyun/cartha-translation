id: JHN.10.21
reference: John 10:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: yo
  text: Àwọn mìíràn ń sọ pé,[a] “Ọ̀rọ̀ wọ̀nyí kì í ṣe ti ẹni tí ẹ̀mí èṣù ń bẹ lára rẹ̀. Ẹ̀mí èṣù ha lè la ojú àwọn afọ́jú?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀rọ̀ wọ̀nyí kì í ṣe láti ọ̀dọ̀ ẹni tí ẹ̀mí èṣù ń bẹ lára rẹ̀ wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: Àwọn mìíràn
  rationale: Ó fi ẹgbẹ́ yìí yà sọ́tọ̀ sí àwọn tí wọ́n sọ̀rọ̀ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘others’ ní Yorùbá.
- source_word: ἔλεγον
  choice: ń sọ pé
  rationale: Àkókò imperfect fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; ‘ń sọ pé’ pa ìtumọ̀ yìí mọ́.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Ọ̀rọ̀ wọ̀nyí
  rationale: ῥήματα tọ́ka sí àwọn ọ̀rọ̀ tí Jésù sọ; ‘Ọ̀rọ̀ wọ̀nyí’ jẹ́ tààrà, ó sì bójú mu ní Yorùbá òde òní.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: kì í ṣe ti ẹni tí ẹ̀mí èṣù ń bẹ lára rẹ̀
  rationale: Ìkọ̀lé genitive náà ṣàpèjúwe ẹni tí irú ọ̀rọ̀ bẹ́ẹ̀ lè ti ọ̀dọ̀ rẹ̀ wá. Ìtumọ̀ yìí jẹ́ àdánidá, kò sì sọ δαιμονίζομαι di ẹ̀kọ́ ìmọ̀-ẹ̀sìn tó le ju ohun tí Gíríìkì sọ lọ.
- source_word: μὴ
  choice: àbí ó lè ṣe bẹ́ẹ̀?
  rationale: μή bẹ̀rẹ̀ ìbéèrè tí a ń retí ìdáhùn òdì sí; ìbéèrè àfikún yìí mú agbára ọ̀rọ̀ náà jáde ní Yorùbá.
- source_word: δαιμόνιον
  choice: Ẹ̀mí èṣù
  rationale: ‘Ẹ̀mí èṣù’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ẹ̀dá ẹ̀mí búburú tí δαιμόνιον ń tọ́ka sí, láì dín agbára ọ̀rọ̀ orísun kù.
- source_word: δύναται
  choice: kò lè
  rationale: Ní ìṣọ̀kan pẹ̀lú μή, ó sọ ìbéèrè tí ó ń retí ìdáhùn òdì di mímọ́ àti àdánidá.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: ojú àwọn afọ́jú
  rationale: Ó pa ìkọ̀lé àti àwòrán ojú mọ́, ó sì tún tọ́ka sí ìwòsàn afọ́jú nínú ọ̀rọ̀ tó ṣáájú.
- source_word: ἀνοῖξαι
  choice: la ojú
  rationale: ‘La ojú’ pa àwòrán gidi ti ‘ṣí ojú’ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó túmọ̀ sí mímú kí afọ́jú ríran.
theological_decisions:
- issue: Ìtumọ̀ èdè δαιμονίζομαι àti δαιμόνιον
  choice: ẹni tí ẹ̀mí èṣù ń bẹ lára rẹ̀ / Ẹ̀mí èṣù
  alternative: ẹni tí èṣù wọ̀ / ẹ̀mí búburú
  rationale: Yíyan ọ̀rọ̀ yìí fi èrò àwọn olùsọ hàn pé ọ̀rọ̀ àti iṣẹ́ Jésù kò bá iṣẹ́ agbára ẹ̀mí èṣù mu, láì fi ẹ̀kọ́ pàtó kan nípa bí èṣù ṣe ń darí ènìyàn kún Gíríìkì.
- issue: Agbára ìbéèrè tí μή bẹ̀rẹ̀
  choice: Ẹ̀mí èṣù kò lè ... àbí ó lè ṣe bẹ́ẹ̀?
  alternative: Ṣé ẹ̀mí èṣù lè la ojú àwọn afọ́jú?
  rationale: Ìtumọ̀ tí a yàn fi hàn gbangba pé àwọn olùsọ ń retí ìdáhùn òdì, ṣùgbọ́n ó ṣì pa ọ̀nà ìbéèrè àti ìforígbárí inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ó ní iyì, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo èdè ẹ̀kọ́ ìmọ̀-ẹ̀sìn tó ṣòro.
