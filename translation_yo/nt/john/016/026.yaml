id: JHN.16.26
reference: John 16:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: yo
  text: Ní ọjọ́ náà[a], ẹ ó béèrè ní orúkọ mi, èmi kò sì sọ fún yín pé èmi yóò béèrè[b] lọ́wọ́ Baba nípa yín[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “Lọ́jọ́ náà.”
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀-ìṣe Gíríìkì méjì ọ̀tọ̀ ni a lò fún “béèrè” nínú ẹsẹ yìí: αἰτέω fún bí àwọn ọmọ-ẹ̀yìn yóò ṣe béèrè, àti ἐρωτάω fún bí Jesu yóò ṣe béèrè lọ́wọ́ Baba.'
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí yín” tàbí “ní ipò yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ní ọjọ́ náà
  rationale: Gbólóhùn náà ń tọ́ka sí àkókò; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ ἐκείνῃ (‘náà’) mọ́.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Èyí pa ọ̀rọ̀ àkànṣe Johanu mọ́ láì fi àlàyé ‘nípasẹ̀ àṣẹ mi’ sínú ẹsẹ náà.
- source_word: αἰτήσεσθε
  choice: ẹ ó béèrè
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú, ẹni kejì ọ̀pọ̀; ‘béèrè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìbéèrè tàbí àdúrà.
- source_word: οὐ λέγω ὑμῖν
  choice: èmi kò sì sọ fún yín
  rationale: Ó pa ìsinsìnyí ti λέγω àti ìtẹnumọ́ ‘èmi’ mọ́ ní Yorùbá tó bójú mu.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣàfihàn ohun tí Jesu kò sọ, kì í ṣe ìdí kan.
- source_word: ἐρωτήσω
  choice: èmi yóò béèrè
  rationale: ‘Béèrè’ jẹ́ ìtumọ̀ àdánidá; àlàyé ìsàlẹ̀ fi hàn pé Gíríìkì lo ọ̀rọ̀-ìṣe mìíràn níhìn-ín.
- source_word: τὸν πατέρα
  choice: lọ́wọ́ Baba
  rationale: ‘Béèrè lọ́wọ́ Baba’ jẹ́ ìṣètò ọ̀rọ̀ Yorùbá àdánidá fún bíbéèrè ohun kan lọ́wọ́ ẹni; ‘Baba’ pa àkọlé pàtó náà mọ́ láì ṣàfikún ‘mi.’
- source_word: περὶ ὑμῶν
  choice: nípa yín
  rationale: Èyí sún mọ́ ìtumọ̀ ‘concerning you’ ó sì jẹ́ kí ìtumọ̀ ṣí sí ‘nítorí yín’ tàbí ‘ní ipò yín’ gẹ́gẹ́ bí àyíká ṣe lè fi hàn.
theological_decisions:
- issue: Bóyá Jesu ń sẹ́ gbogbo iṣẹ́ ìbẹ̀bẹ̀ rẹ̀ lọ́jọ́ iwájú, tàbí ó kàn kọ̀ láti ṣàpèjúwe ìwọlé àwọn ọmọ-ẹ̀yìn sí Baba gẹ́gẹ́ bí ohun tó gbára lé ìbéèrè tirẹ̀ ní àyíká yìí
  choice: A túmọ̀ gbólóhùn náà tààrà gẹ́gẹ́ bí ohun tí Jesu sọ pé òun kò ń sọ fún wọn níhìn-ín.
  alternative: Láti sọ ọ́ ní ọ̀nà tó lágbára pé Jesu kì yóò bẹ̀bẹ̀ fún wọn rárá, tàbí pé wọn kò nílò alárinà kankan.
  rationale: Àyíká náà tẹnumọ́ pé àwọn ọmọ-ẹ̀yìn yóò béèrè lọ́wọ́ Baba ní orúkọ Jesu, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò yanjú gbogbo ìbéèrè nípa iṣẹ́ ìbẹ̀bẹ̀ Jesu. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì fipá yanjú rẹ̀.
translation_notes:
  register: Yorùbá àgbàdojú, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A lo ‘ẹ’ fún ọ̀pọ̀ ẹni kejì, ‘Baba’ gẹ́gẹ́ bí àkọlé pàtó, àti àmì ohùn ní kíkún níbi tí ó ti yẹ.
