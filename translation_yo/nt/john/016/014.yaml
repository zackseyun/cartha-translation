id: JHN.16.14
reference: John 16:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: yo
  text: Òun yóò ṣe mí lógo, nítorí yóò gba nínú ohun tí ó jẹ́ tèmi[a], yóò sì kéde rẹ̀ fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò mú nínú ohun tí ó jẹ́ tèmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Ẹ̀mí tí a mẹ́nu kàn ní àyíká ẹsẹ náà. “Òun” bá ìtumọ̀ ènìyàn mu láìfi akọ tàbí abo kún ohun tí Gíríìkì ń sọ.
- source_word: δοξάσει
  choice: yóò ṣe mí lógo
  rationale: “Ṣe … lógo” pa ìwúwo δοξάζω mọ́ nínú ìwé Jòhánù; ó ju fífi ọlá ènìyàn lásán fún ẹnì kan lọ.
- source_word: ὅτι
  choice: nítorí
  rationale: Níhìn-ín ὅτι ń fi ìdí tí Ẹ̀mí yóò fi ṣe Jésù lógo hàn.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: lára ohun tí ó jẹ́ tèmi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ó jẹ́ ti Jésù, láìdín un kù sí ẹ̀kọ́, àṣẹ, tàbí ìṣípayá nìkan.
- source_word: λήμψεται
  choice: yóò mú
  rationale: “Mú” pa ìtumọ̀ ṣíṣe ti λαμβάνω mọ́ nínú gbólóhùn yìí, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ “gba” hàn.
- source_word: ἀναγγελεῖ
  choice: yóò sì kéde rẹ̀
  rationale: “Kéde” túmọ̀ sí jíṣẹ́ tàbí sọ ohun kan di mímọ̀ ní gbangba; “rẹ̀” dúró fún ohun tí a mú lára ohun tí ó jẹ́ ti Jésù.
- source_word: ὑμῖν
  choice: fún yín
  rationale: “Yín” fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Ìbáṣepọ̀ Ẹ̀mí sí Jésù nínú “ἐκ τοῦ ἐμοῦ λήμψεται”
  choice: yóò mú lára ohun tí ó jẹ́ tèmi
  alternative: yóò gba lára ohun tí ó jẹ́ tèmi
  rationale: 'Ìtumọ̀ yìí jẹ́ kí gbólóhùn náà dúró ní fífẹ̀ rẹ̀: Ẹ̀mí ń kéde ohun tí ó jẹ́ ti Ọmọ, láìsọ ọ́ di gbólóhùn ẹ̀kọ́ ìsìn kan pàtó tí ọ̀rọ̀ náà kò sọ ní tààrà.'
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé yé fún òǹkàwé navọ́ọ̀. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì pa ìtumọ̀ ẹ̀kọ́ ìsìn tí kò yẹ kí a dín kù mọ́.
