id: JHN.16.22
reference: John 16:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin náà ní ìbànújẹ́ nísinsin yìí; ṣùgbọ́n èmi yóò tún rí yín[a], ọkàn yín yóò sì yọ̀, kò sì sí ẹni tí yóò gba ayọ̀ yín kúrò lọ́dọ̀ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin yóò tún rí mi.” Gíríìkì, ní ti gidi, ní, “èmi yóò tún rí yín”; èyí lè tẹnumọ́ ìpilẹ̀ṣẹ̀ Jésù nínú ìpàdé náà pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ àpẹẹrẹ ìrora ìbímọ tí ó ṣáájú, ó sì fi hàn pé ohun tí Jésù ń sọ jẹ́ ìmúlò àpẹẹrẹ náà sí àwọn ọmọ-ẹ̀yìn.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: ẹ̀yin náà ní ìbànújẹ́ nísinsin yìí
  rationale: “Ìbànújẹ́” mú èrò λύπη jáde gẹ́gẹ́ bí ìkorò ọkàn tàbí ẹ̀dùn, “nísinsin yìí” sì pa ìtẹnumọ́ àkókò νῦν mọ́. Ìtakora μέν…δέ fara hàn nípasẹ̀ “ṣùgbọ́n.”
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: ṣùgbọ́n èmi yóò tún rí yín
  rationale: Èyí pa ẹni kìíní gẹ́gẹ́ bí olùṣe àti ẹni kejì ọ̀pọ̀ gẹ́gẹ́ bí ohun tí a rí mọ́, bí Gíríìkì ṣe sọ ní tààrà. “Tún” dúró fún πάλιν, “ṣùgbọ́n” sì mú ìtakora δέ jáde.
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: ọkàn yín yóò sì yọ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa àwòrán “ọkàn” àti agbára ọ̀rọ̀-ìṣe χαρήσεται mọ́.
- source_word: τὴν χαρὰν ὑμῶν
  choice: ayọ̀ yín
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún gbólóhùn ohun-ìní náà, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ láàárín “yọ̀” àti “ayọ̀.”
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: kò sì sí ẹni tí yóò gba ayọ̀ yín kúrò lọ́dọ̀ yín
  rationale: “Kò sí ẹni” mú οὐδείς jáde; “gba…kúrò lọ́dọ̀” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún αἴρει ἀπό. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àkókò ìsinsin, àkópọ̀ gbólóhùn náà ń wo ọjọ́ iwájú, nítorí náà “yóò gba” jẹ́ ti ẹ̀dá ní Yorùbá.
theological_decisions:
- issue: Ta ni olùṣe nínú ìpàdé ọjọ́ iwájú náà?
  choice: èmi yóò tún rí yín
  alternative: ẹ̀yin yóò tún rí mi
  rationale: Gíríìkì fi Jésù hàn ní kedere gẹ́gẹ́ bí ẹni tó ń rí wọn, àwọn ọmọ-ẹ̀yìn sì ni ohun tí ó rí. A pa ètò yìí mọ́ láì mú un bá ọ̀rọ̀ tó wà nítòsí mu, kí ìtẹnumọ́ lórí ìgbésẹ̀ Jésù má bàa sọnù.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀yin” àti “yín” láti pa ọ̀pọ̀ ènìyàn inú ὑμεῖς/ὑμᾶς mọ́; a sì fi àmì ohùn sí ibi tí ó yẹ.
