  to: Mo ṣì ní ọ̀pọ̀ ohun láti sọ fún yín, ṣùgbọ́n ẹ kò lè ru wọ́n nísinsìnyí.[a]
  rationale: A rọ́pò ọ̀rọ̀ tí ó ní ìtumọ̀ ‘fara mọ́ra/gbà mọ́ra’ pẹ̀lú “ru wọ́n,” èyí tí ó jẹ́ ìtumọ̀ Yorùbá tó péye àti tó dára fún βαστάζειν nínú àyíká àfiwé yìí. Àtúnṣe náà pa àìdájú tó wà láàárín rírù àti fífaradà mọ́; àlàyé ìsàlẹ̀ ojú ìwé ń fúnni ní àwọn ìṣeéṣe lexical mìíràn. A tún mú “ọ̀pọ̀ ohun” rọrùn láìyí ìtumọ̀ πολλὰ padà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:15Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí pé Jésù ṣì ní ohun púpọ̀ láti sọ, àti pé àwọn ọmọ-ẹ̀yìn kò ní agbára láti βαστάζειν wọn ní àkókò yẹn. Ṣùgbọ́n “gbà wọ́n mọ́ra” túmọ̀ sí gbígba tàbí fífamọ́ra ohun/enìyàn, kì í sì jẹ́ ọ̀nà ìbílẹ̀ láti ṣàfihàn rírù ẹrù tàbí fífaradà nínú ọ̀rọ̀ yìí.
  naturalness: “Ru wọ́n” jẹ́ èdè Yorùbá boṣewa, kedere, ó sì pa àwòrán ìwúwo/ẹrù ti βαστάζειν mọ́. “Ọ̀pọ̀ ohun” tún rọrùn, ó sì dára ju “ọ̀pọ̀lọpọ̀ ohun” lọ nínú àyíká yìí.
  terminology: “Ṣì,” “láti sọ fún yín,” “ṣùgbọ́n,” àti “nísinsìnyí” bá ìtumọ̀ Gíríìkì mu. “Ru wọ́n” ń pa ìmọ̀ tí kò dájú pátápátá—láti ru, fara da, tàbí ní agbára fún—mọ́ láìtúmọ̀ ọ́ sí òye ọpọlọ nìkan.
  issues:
  - severity: high
    issue: “gbà wọ́n mọ́ra” fún βαστάζειν
    rationale: Ìsọ̀rọ̀ náà sábà ń túmọ̀ sí ‘embrace/hold close’ ní Yorùbá, kì í sì ṣe ‘bear/carry/endure.’ Ó lè yí ìtumọ̀ ẹsẹ̀ náà padà sí gbígba àwọn ohun náà ní ọkàn, dípò àìlera láti ru tàbí fara dà á.
  - severity: low
    issue: “ọ̀pọ̀lọpọ̀ ohun”
    rationale: Kò ṣàṣìṣe, ṣùgbọ́n “ọ̀pọ̀ ohun” jẹ́ ọ̀nà tó ṣókí, tó rọrùn, tí ó sì bá πολλὰ mu dáadáa nínú Yorùbá ode òní.
  revised_text: Mo ṣì ní ọ̀pọ̀ ohun láti sọ fún yín, ṣùgbọ́n ẹ kò lè ru wọ́n nísinsìnyí.[a]
