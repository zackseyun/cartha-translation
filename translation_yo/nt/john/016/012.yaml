source:
  edition: SBLGNT
  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: yo
  text: Mo ṣì ní ọ̀pọ̀ ohun láti sọ fún yín, ṣùgbọ́n ẹ kò lè ru wọ́n nísinsìnyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kò lè gbé wọ́n nísinsìnyí,” tàbí “ẹ kò lè fara dà wọ́n nísinsìnyí.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbígbé, rírù, tàbí fífaradà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: ṣì
  rationale: Ó fi hàn pé Jésù ní ẹ̀kọ́ mìíràn tí ó kù láti sọ; “ṣì” jẹ́ ọ̀nà àdánidá láti sọ ìtẹ̀síwájú yìí ní Yorùbá.
- source_word: πολλὰ
  choice: ọ̀pọ̀lọpọ̀ ohun
  rationale: Àpèjúwe ọ̀pọ̀ nínú èdè Gíríìkì dúró gẹ́gẹ́ bí orúkọ; “ọ̀pọ̀lọpọ̀ ohun” mú ohun tí a kò kọ ní tààràtà yé kedere.
- source_word: ἔχω
  choice: ní
  rationale: Nínú ìṣọ̀kan ọ̀rọ̀ ἔχω pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni, ó túmọ̀ sí pé ohun kan ṣì kù fún ẹni náà láti ṣe; “ní ... láti sọ” bá èdè Yorùbá mu.
- source_word: ὑμῖν λέγειν
  choice: láti sọ fún yín
  rationale: Ó pa ìtumọ̀ gbòòrò ti λέγειν àti ẹni tí ọ̀rọ̀ náà ń tọ́ sí mọ́ láìfi àlàyé míì kún un.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìtakora tó wà láàárín ohun tí Jésù ṣì fẹ́ sọ àti àìlera àwọn ọmọ-ẹ̀yìn láti gbà á hàn.
- source_word: οὐ δύνασθε
  choice: ẹ kò lè
  rationale: Ó túmọ̀ agbára tàbí àǹfààní láti ṣe ohun kan ní ọ̀nà àdánidá ní Yorùbá.
- source_word: βαστάζειν
  choice: gbà wọ́n mọ́ra
  rationale: Àṣàyàn yìí pa àwòrán gbígbé ẹrù tàbí fífaradà ohun tó wuwo mọ́, láìdín ìtumọ̀ náà kù sí òye ọpọlọ nìkan.
- source_word: ἄρτι
  choice: nísinsìnyí
  rationale: Ó tọ́ka sí ipò wọn ní àkókò yẹn, ní ìyàtọ̀ sí ohun tí yóò ṣẹlẹ̀ lẹ́yìn náà.
theological_decisions:
- issue: Ìtumọ̀ βαστάζειν nípa àìlera àwọn ọmọ-ẹ̀yìn ní àkókò yẹn
  choice: Wọn kò lè gbà ìwúwo àwọn ohun tí Jésù ṣì fẹ́ sọ mọ́ra ní àkókò náà.
  alternative: Wọn kò lè lóye àwọn ohun náà ní kíkún, tàbí wọn kò lè fara da gbígbọ́ wọn ní àkókò náà.
  rationale: βαστάζω lè túmọ̀ sí gbígbé, rírù, tàbí fífaradà. “Gbà wọ́n mọ́ra” pa ìfọ̀rọ̀wérọ̀ tó wà láàárín agbára òye àti agbára ẹ̀mí mọ́, dípò kí ó pinnu pé ọ̀kan ṣoṣo ni.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. “Ẹ ... yín” fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀. Àpẹẹrẹ “gbà wọ́n mọ́ra” pa ìtumọ̀ àfiwé ti βαστάζειν mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń ṣàfihàn àwọn àṣàyàn mìíràn.
