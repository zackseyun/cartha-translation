id: JHN.16.10
reference: John 16:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: yo
  text: Ní ti òdodo náà[a], nítorí mo ń lọ sọ́dọ̀ Baba, ẹ̀yin kò sì ní rí mi mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo tàbí ìdájọ́ tí ó tọ́; a lo “òdodo” nínú ẹsẹ̀ náà nítorí àyíká rẹ̀ so ọ̀rọ̀ náà mọ́ lílọ Jesu sọ́dọ̀ Baba, èyí tí ó fi ìdáláre rẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: ní ti
  rationale: Ó bá ìtòlẹ́sẹẹsẹ àwọn gbólóhùn περὶ ní ẹsẹ 9–11 mu, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘nípa’ tàbí ‘ní ti’ ní Yorùbá.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: ‘Òdodo’ lè tọ́ka sí jíjẹ́ ẹni tí ó tọ́ àti sí ìdájọ́ tí ó bá òtítọ́ mu; nínú àyíká yìí, ó lè ní í ṣe pẹ̀lú ìfìdí jíjẹ́ olódodo Jesu múlẹ̀ nípasẹ̀ lílọ rẹ̀ sọ́dọ̀ Baba.
- source_word: δέ
  choice: Àti
  rationale: Níhìn-ín, δέ ń tẹ̀ síwájú nínú àtòjọ, kò sì fi ìtakora líle hàn; ‘Àti’ pa ìlọsíwájú náà mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: ὅτι ṣe àgbékalẹ̀ ìdí fún ọ̀rọ̀ tó ṣáájú; ‘nítorí’ mú ìtumọ̀ okùnfà náà hàn kedere.
- source_word: πρὸς τὸν πατέρα
  choice: sọ́dọ̀ Baba
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìlọ, ‘sọ́dọ̀’ jẹ́ àdánidá ní Yorùbá, ó sì pa àkọlé ìbátan ‘Baba’ mọ́ láìfi ‘Baba mi’ kún ohun tí Gíríìkì kò sọ.
- source_word: ὑπάγω
  choice: mo ń lọ
  rationale: Ó pa ìṣe tó ń bọ̀ létí mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn àti àdánidá.
- source_word: οὐκέτι
  choice: kò ... mọ́
  rationale: Àkópọ̀ ‘kò ... mọ́’ ni ọ̀nà Yorùbá àdánidá fún ohun tí kò ní ṣẹlẹ̀ mọ́ láti ìsinsìnyí lọ.
- source_word: θεωρεῖτέ
  choice: rí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí rírí Jesu; ‘rí’ ṣe kedere láìfi ìtumọ̀ àfikún sí i.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àyíká ẹ̀kọ́ ìgbàgbọ́
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ ni yíyan tó gbooro, tó sì lè gba ìtumọ̀ jíjẹ́ ẹni tí ó tọ́ àti ìfìdí rẹ̀ múlẹ̀. Àlàyé ìsàlẹ̀ pa apá ìtumọ̀ ‘ìdájọ́ òdodo’ mọ́ láìdájọ́ pé ìtumọ̀ kan ṣoṣo ni ọ̀rọ̀ náà ní.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ẹ̀yin’ mú ọ̀pọ̀ ènìyàn inú θεωρεῖτέ hàn.
