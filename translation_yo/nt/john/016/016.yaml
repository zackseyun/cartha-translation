  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: yo
  text: “Ní ìgbà díẹ̀[a], ẹ kò ní rí mi mọ́; lẹ́ẹ̀kan sí i, ní ìgbà díẹ̀, ẹ ó sì rí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Èdè Gíríìkì lo ọ̀rọ̀-ìṣe méjì tó yàtọ̀ fún “rí” níbí: θεωρέω nínú apá àkọ́kọ́ àti ὁράω nínú apá kejì. Ó ṣeé ṣe kí ìyàtọ̀ ìtumọ̀ kékeré kan wà láàárín wọn, ṣùgbọ́n a tú àwọn méjèèjì sí “rí” nítorí pé ìyàtọ̀ àkókò ni ẹsẹ yìí ń tẹnumọ́ jù.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: ní ìgbà díẹ̀ sí i
  rationale: Ọ̀rọ̀ ajẹtífù náà ń ṣiṣẹ́ bí ọ̀rọ̀ àpọnlé láti tọ́ka sí àkókò kúkúrú; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ pé àkókò náà kúrú mọ́.
- source_word: οὐκέτι
  choice: kò ní ... mọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ pé ohun kan kò ní máa bá a lọ láti àkókò yẹn.
- source_word: θεωρεῖτέ
  choice: rí
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ wíwo tàbí kíyèsí, ‘rí’ mú ìtumọ̀ pàtàkì jáde láìfi ìyàtọ̀ tí kò dájú kún un.
- source_word: πάλιν
  choice: lẹ́yìn ... sì
  rationale: Àkójọpọ̀ yìí fi ìtẹ̀lé àkókò àti ìpadà sí ipò rírí hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ὄψεσθέ
  choice: ẹ ó ... rí
  rationale: Ọ̀rọ̀ náà tọ́ka sí rírí ní ọjọ́ iwájú; ‘ẹ ó rí’ pa ìbáradọ́gba mọ́ pẹ̀lú gbólóhùn àkọ́kọ́.
- source_word: με
  choice: mi
  rationale: Arọ́pò-orúkọ olùgbà tí ó ń tọ́ka sí Jésù ni.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so àwọn apá méjèèjì pọ̀, ó sì pa ìwọ̀ntúnwọ̀nsì àti ìṣàn gbólóhùn náà mọ́ ní Yorùbá.
theological_decisions:
- issue: Bóyá kí a fi ọ̀rọ̀ Yorùbá méjì tó yàtọ̀ túmọ̀ θεωρέω àti ὁράω láti fi irú rírí méjì hàn
  choice: Lo ‘rí’ fún àwọn méjèèjì nínú ọ̀rọ̀ pàtàkì
  alternative: ‘ẹ kò ní máa wo mi mọ́ ... ẹ ó rí mi’ tàbí ‘ẹ kò ní rí mi mọ́ ... ẹ ó tún fojú rí mi’
  rationale: Àwọn ọ̀rọ̀ Gíríìkì méjèèjì ní ìtumọ̀ tó fi ara kan ara nínú ìwé Jòhánù. Fífipá mú ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ kan jáde ní Yorùbá lè sọ ohun tó ju ohun tí ẹsẹ náà dájú lé lórí; ìyàtọ̀ àkókò ni ẹsẹ náà tẹnumọ́ jù.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún níbi tó yẹ. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn fún àwọn ọmọ-ẹ̀yìn; ìṣètò gbólóhùn jẹ́ àdánidá sí Yorùbá, ó sì pa ìbáradọ́gba àti àìdájú tó wà nínú orísun Gíríìkì mọ́.
