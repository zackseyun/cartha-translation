  source_fidelity: Ìtumọ̀ náà pa ìtumọ̀ pàtàkì ti Μικρὸν, οὐκέτι, θεωρεῖτε, πάλιν, àti ὄψεσθέ mọ́. Síbẹ̀, ‘ní ìgbà díẹ̀ sí i’ lè túmọ̀ sí ‘ní ìgbà díẹ̀ míì/lẹ́ẹ̀kansi’ tàbí ‘ní díẹ̀ sí i’ ju bí Μικρὸν tí kò ní ‘sí i’ ṣe túmọ̀ lọ. ‘Lẹ́yìn’ sì ń fi ìtẹ̀lé àkókò hàn, ṣùgbọ́n kò fi ìtumọ̀ ìpadà tí πάλιν (‘lẹ́ẹ̀kan sí i’) hàn dáadáa.
