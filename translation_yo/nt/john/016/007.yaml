id: JHN.16.7
reference: John 16:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: yo
  text: 'Ṣùgbọ́n mo ń sọ òtítọ́ fún yín: ó jẹ́ àǹfààní fún yín pé kí n lọ. Nítorí bí n kò bá lọ, Olùrànlọ́wọ́ náà[a] kì yóò wá sọ́dọ̀ yín rárá; ṣùgbọ́n bí mo bá lọ, màá rán án sí yín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Olùgbèjà,” “Olùdámọ̀ràn,” tàbí “Olùtùnú”; ní Gíríìkì, “Parakílétì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ìbànújẹ́ àwọn ọmọ-ẹ̀yìn nínú ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative ní Yorùbá.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: òtítọ́ ni mo ń sọ fún yín
  rationale: Ìṣètò ‘òtítọ́ ni’ tẹnu mọ́ ìjẹ́rìí òtítọ́, ‘mo ń sọ’ sì bá present λέγω mu ní Yorùbá òde òní.
- source_word: συμφέρει ὑμῖν
  choice: ó ṣàǹfààní fún yín
  rationale: Ó sọ èrè tàbí àǹfààní tí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ní kedere, láìfi ìtumọ̀ afiwéra tí kò pọn dandan kún un.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: pé kí èmi lọ
  rationale: ‘pé kí’ mú content clause náà jáde lọ́nà àdánidá; ‘èmi’ pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Nítorí bí èmi kò bá lọ
  rationale: ‘Nítorí’ túmọ̀ γάρ gẹ́gẹ́ bí àlàyé, ‘bí…kò bá’ sì pa conditional structure mọ́.
- source_word: ὁ παράκλητος
  choice: Olùrànlọ́wọ́
  rationale: Ọ̀rọ̀ náà jẹ́ àkọlé fún ẹni tí a pè sí ẹ̀gbẹ́ ẹlòmíràn láti ràn án lọ́wọ́, láti gbèjà tàbí tù ú nínú. ‘Olùrànlọ́wọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní ààyè semantic tó gbooro; àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ pàtàkì mìíràn mọ́.
- source_word: οὐ μὴ ἔλθῃ
  choice: kì yóò wá … rárá
  rationale: Àpapọ̀ ‘kì yóò’ àti ‘rárá’ fi emphatic negation οὐ μή hàn ní Yorùbá àdánidá.
- source_word: πρὸς ὑμᾶς
  choice: sọ́dọ̀ yín
  rationale: Ó fi ìṣísẹ̀ sí ibi tí àwọn ọmọ-ẹ̀yìn wà hàn dáadáa.
- source_word: ἐὰν δὲ πορευθῶ
  choice: ṣùgbọ́n bí mo bá lọ
  rationale: Ó pa ìyàtọ̀ δέ àti conditional structure mọ́, ‘lọ’ sì jẹ́ ìtumọ̀ tó rọrùn jù fún πορεύομαι ní àyíká yìí.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: èmi yóò rán an sí yín
  rationale: ‘èmi’ mú ẹni tó ń rán an tẹnumọ́ gẹ́gẹ́ bí Greek first-person form; ‘rán an’ tọ́ka sí Olùrànlọ́wọ́ gẹ́gẹ́ bí ẹni, kì í ṣe agbára aláìlẹ́ni.
theological_decisions:
- issue: Ìtumọ̀ παράκλητος nínú ọ̀rọ̀ Jòhánù
  choice: Olùrànlọ́wọ́
  alternative: Agbẹjọ́rò; Olùgbèjà; Olùtùnú; Parakílétì
  rationale: Kò sí ọ̀rọ̀ Yorùbá kan ṣoṣo tó kó gbogbo semantic range náà. ‘Olùrànlọ́wọ́’ ṣeé lóye fún òǹkàwé gbogbo, ó sì pa iṣẹ́ ẹni tí ó ń ṣe fún àwọn ọmọ-ẹ̀yìn mọ́; àlàyé [a] jẹ́ kí àwọn apá gbígbèjà, ìmọ̀ràn àti ìtùnú má bàa sọnù.
- issue: Ìtọ́kasí παράκλητος gẹ́gẹ́ bí ẹni
  choice: rán an
  alternative: rán án (gẹ́gẹ́ bí ohun tàbí agbára)
  rationale: Àyíká náà ṣàpèjúwe Olùrànlọ́wọ́ gẹ́gẹ́ bí ẹni tí ó ń bọ̀ tí a sì ń rán; ìtumọ̀ náà kò sọ ọ́ di agbára aláìlẹ́ni.
translation_notes:
  register: Yorùbá ìpele àárín tó ní ọlá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a pa ìtẹnumọ́ ‘èmi’ mọ́ ní ibi tí Greek ἐγώ fara hàn, a sì tún ọ̀rọ̀ ‘lọ’ ṣe bí orísun ṣe tún àfojúsùn ìlọ náà sọ.
