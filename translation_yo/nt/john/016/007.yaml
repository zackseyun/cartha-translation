  to: 'Ṣùgbọ́n mo ń sọ òtítọ́ fún yín: ó jẹ́ àǹfààní fún yín pé kí n lọ. Nítorí bí n kò bá lọ, Olùrànlọ́wọ́ náà[a] kì yóò wá sọ́dọ̀ yín rárá; ṣùgbọ́n bí mo bá lọ, màá rán án sí yín.'
  rationale: The revision corrects the non-idiomatic expression for benefit and regularizes the object pronoun, without altering the source text’s meaning, its emphatic negative, or its personal portrayal of the Paraclete. The lexical footnote remains anchored directly to Olùrànlọ́wọ́, the term it explains.
