source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: yo
  text: Ní ọjọ́ náà, ẹ̀yin kì yóò béèrè ohunkóhun lọ́wọ́ mi.[a] Lóòótọ́, lóòótọ́ ni mo wí fún yín, ohunkóhun tí ẹ bá béèrè lọ́wọ́ Baba ní orúkọ mi, yóò fi í fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀rọ̀ Gíríìkì méjì ọ̀tọ̀ ni a lò fún “béèrè” nínú ẹsẹ̀ yìí: àkọ́kọ́ ni ἐρωτάω, èyí tó lè túmọ̀ sí bíbéèrè tàbí bíbèèrè ẹnìkan ní ìbéèrè, nípa Jesu; lẹ́yìn náà ni αἰτέω, èyí tó sábà ń tọ́ka sí títọrọ tàbí ṣíṣe ẹ̀bẹ̀, nípa Baba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ní ọjọ́ náà
  rationale: Ó jẹ́ gbólóhùn àkókò tó ṣe déédéé ní Yorùbá, ó sì pa ìtọ́kasí ọjọ́ pàtàkì náà mọ́.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: ẹ̀yin kì yóò béèrè ohunkóhun lọ́wọ́ mi
  rationale: Ó mú ẹni tí wọ́n ń béèrè lọ́wọ́ rẹ̀, ‘mi,’ hàn kedere, ó sì pa ìkọ̀ pátápátá ti οὐδέν mọ́ láì fi ìtumọ̀ ‘ẹ kì yóò bi mí léèrè mọ́’ kún un.
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìmúdájú náà, ó sì pa àtúnsọ onítẹnumọ́ tí ó wọ́pọ̀ nínú Jòhánù mọ́.
- source_word: ἄν τι αἰτήσητε
  choice: ohunkóhun tí ẹ bá béèrè
  rationale: Ìṣètò yìí fi àìdánilójú tàbí ààyè gbígbòòrò inú gbólóhùn Gíríìkì hàn ní Yorùbá àdánidá, láì sọ ìlérí náà di ohun tí ó ju ọ̀rọ̀ orísun lọ.
- source_word: τὸν πατέρα
  choice: lọ́wọ́ Baba
  rationale: ‘Baba’ pa àkọlé náà mọ́ láì fi arọ́pò-orúkọ ‘Baba mi’ kún ọ̀rọ̀ Gíríìkì; ‘béèrè lọ́wọ́’ ni ìlò Yorùbá tó ṣe déédéé fún ìbéèrè ẹ̀bẹ̀ sí ẹnìkan.
- source_word: δώσει ὑμῖν
  choice: yóò fi fún yín
  rationale: Ó tẹ̀lé ìtumọ̀ ‘yóò fún yín’ ní Yorùbá tí ó yé kedere, nígbà tí ‘fi’ ń tọ́ka sí ohun tí a béèrè láì tún un sọ ní kíkún.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Ó pa gbólóhùn pàtàkì ti Jòhánù mọ́, láì pinnu ṣáájú bóyá ó túmọ̀ sí nípasẹ̀ àṣẹ, aṣojú, ìṣọ̀kan, tàbí ìpìlẹ̀ orúkọ Jesu.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ἐρωτάω nípa bíbéèrè lọ́wọ́ Jesu àti αἰτέω nípa ẹ̀bẹ̀ sí Baba
  choice: A lo ‘béèrè lọ́wọ́’ fún àwọn méjèèjì nínú ẹsẹ̀, a sì ṣàlàyé ìyàtọ̀ ọ̀rọ̀ Gíríìkì nínú àkọsílẹ̀ [a].
  alternative: Ṣe ti àkọ́kọ́ ní ‘ẹ kì yóò bi mí ní ìbéèrè kankan’ àti ti kejì ní ‘ohunkóhun tí ẹ bá tọrọ lọ́wọ́ Baba.’
  rationale: Yorùbá lè fi ìyàtọ̀ náà hàn pẹ̀lú ‘bi ... ní ìbéèrè’ àti ‘tọrọ,’ ṣùgbọ́n èyí lè mú ìtumọ̀ kan lágbára ju ohun tí ọ̀rọ̀ náà dá lójú lọ. Ìtumọ̀ àkọ́kọ́ dúró ṣinṣin, ó sì jẹ́ kí àkọsílẹ̀ ṣàfihàn àbùdá ọ̀rọ̀ náà.
- issue: Ibi tí ‘ní orúkọ mi’ ti so mọ́ nínú gbólóhùn
  choice: A so ó mọ́ bíbéèrè lọ́wọ́ Baba nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: 'Nítorí ìtòlẹ́sẹẹsẹ ọ̀rọ̀ àti àwọn ìyàtọ̀ ẹ̀rí ìkọ̀wé, a lè so ó mọ́ ‘yóò fi fún yín’: ‘yóò fi fún yín ní orúkọ mi.’'
  rationale: Ìtumọ̀ tí ó so ‘ní orúkọ mi’ mọ́ ìbéèrè jẹ́ àdánidá, ó sì bá ìlò Jòhánù mu; síbẹ̀, a pa àṣàyàn ìsopọ̀ kejì mọ́ nínú àkọsílẹ̀ [b] dípò pípa àìdánilójú náà rẹ́.
- issue: Ìwọ̀n ìlérí nípa àdúrà ní orúkọ Jesu
  choice: A túmọ̀ ìlérí náà ní tààràtà láì fi àwọn ààlà ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
  alternative: Fi kún un pé ohun tí a béèrè gbọ́dọ̀ bá ìfẹ́ Jesu mu.
  rationale: Àwọn àyíká Bíbélì míì lè ràn ẹni tó ń túmọ̀ rẹ̀ lọ́wọ́, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò sọ ààlà yẹn; ìtumọ̀ kò gbọ́dọ̀ yanjú ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ náà nípa fífikún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè ìsinsìnyí ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá. ‘Ẹ̀yin’ ni a fi tẹnumọ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn ní ìbẹ̀rẹ̀; ‘Baba’ ni a lò gẹ́gẹ́ bí àkọlé fún Ọlọ́run. Ọ̀rọ̀ náà yẹ fún kíkà ní gbangba, ó sì yẹra fún èdè ẹ̀ya ìjọ kan pàtó.
