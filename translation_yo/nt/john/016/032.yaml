id: JHN.16.32
reference: John 16:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: yo
  text: Wò ó, àkókò kan ń bọ̀, ó sì ti dé, tí ẹ ó tú ká, olúkúlùkù sí ohun tirẹ̀[a], tí ẹ ó sì fi mí sílẹ̀ nìkan. Síbẹ̀, èmi kò dá wà, nítorí Baba wà pẹ̀lú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olúkúlùkù sí ilé tirẹ̀,” “sí ibi tirẹ̀,” tàbí “sí àwọn ohun tirẹ̀.” Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ibi kan pàtó lọ, ó sì lè tọ́ka sí ohun tí ó jẹ́ ti ẹni kọ̀ọ̀kan ní gbogbogbòò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ó pa ipa ọ̀rọ̀ tí ń pe àfiyèsí mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ìjẹ́pàtàkì ìkéde náà mu.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: àkókò kan ń bọ̀, ó sì ti dé
  rationale: Ó pa ìfàsẹ́yìn tó wà láàárín ohun tí ó sún mọ́lé àti ohun tí ó ti dé mọ́; ‘àkókò’ túmọ̀ sí àsìkò pàtàkì níbí, kì í ṣe wákàtí ọgọ́ta ìṣẹ́jú ní pàtó.
- source_word: ἵνα
  choice: nígbà tí
  rationale: Nínú gbólóhùn yìí, ó ń ṣàlàyé ohun tí yóò ṣẹlẹ̀ ní àkókò náà; ìtumọ̀ àkókò yìí jẹ́ àdánidá ní Yorùbá láìfi ète tí kò dájú kún un.
- source_word: σκορπισθῆτε
  choice: a ó tú yín ká
  rationale: Ìṣe aláìṣe-taara náà fi hàn pé àwọn ọmọ-ẹ̀yìn yóò tú ká, tí olukúlùkù yóò sì ya kúrò lọ́dọ̀ àwọn yòókù.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: olúkúlùkù sí ohun tirẹ̀
  rationale: ‘Ohun tirẹ̀’ pa ìtumọ̀ gbòòrò ti τὰ ἴδια mọ́; ó lè tọ́ka sí ilé, ibi, ohun-ìní, tàbí ọ̀ràn ẹni, láìdín un kù sí ibi kan ṣoṣo.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: tí ẹ ó sì fi mí sílẹ̀ nìkan
  rationale: Ó sọ ìṣe ọjọ́ iwájú náà ní Yorùbá tí ó ṣe kedere, ó sì pa agbára ìmọ̀lára ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ‘kọ̀ mí sílẹ̀ pátápátá’ kún un.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Síbẹ̀, èmi kò dá wà
  rationale: ‘Síbẹ̀’ mú ìyàtọ̀ láàárín fífi Jésù sílẹ̀ àti wíwà Baba pẹ̀lú rẹ̀ hàn; fífi ‘èmi’ sí iwájú tún fi ìtẹnumọ́ hàn.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: nítorí Baba wà pẹ̀lú mi
  rationale: Ó sọ ìdí tí Jésù kò fi dá wà ní tààrà, ó sì pa orúkọ ìbátan ‘Baba’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἕκαστος εἰς τὰ ἴδια
  choice: olúkúlùkù sí ohun tirẹ̀
  alternative: olúkúlùkù sí ilé tirẹ̀
  rationale: A kò sọ ọ́ di ‘ilé’ nìkan, nítorí ọ̀rọ̀ Gíríìkì gbòòrò ju ibi kan lọ; ìtumọ̀ náà pa àìdájú ojúlówó rẹ̀ mọ́.
- issue: Ìbáṣepọ̀ láàárín bí àwọn ọmọ-ẹ̀yìn ṣe fi Jésù sílẹ̀ àti bí Baba ṣe wà pẹ̀lú rẹ̀
  choice: Síbẹ̀, èmi kò dá wà, nítorí Baba wà pẹ̀lú mi
  alternative: Èmi kò sì dá wà, nítorí Baba wà pẹ̀lú mi
  rationale: '‘Síbẹ̀’ pa ìforígbárí inú ẹsẹ náà mọ́: àwọn ọmọ-ẹ̀yìn yóò fi í sílẹ̀ nìkan, ṣùgbọ́n kì í ṣe ẹni tí ó dá wà pátápátá nítorí wíwà Baba pẹ̀lú rẹ̀. A kò fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ míì tí ẹsẹ náà kò sọ kún un.'
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì, ṣùgbọ́n ó ṣì ṣeé lóye fún òǹkàwé lasán; ‘Wò ó’ jẹ́ ìpè àfiyèsí tí kò ti gbó, ‘a ó’ sì bá ohùn ìkéde ọ̀wọ̀ mu.
