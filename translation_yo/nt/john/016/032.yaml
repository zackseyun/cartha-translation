  to: Wò ó, àkókò kan ń bọ̀, ó sì ti dé, tí ẹ ó tú ká, olúkúlùkù sí ohun tirẹ̀[a], tí ẹ ó sì fi mí sílẹ̀ nìkan. Síbẹ̀, èmi kò dá wà, nítorí Baba wà pẹ̀lú mi.
