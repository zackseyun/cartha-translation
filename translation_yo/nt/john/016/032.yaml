  source_fidelity: 'Àṣìṣe pàtàkì kan wà nínú ìtumọ̀ σκορπισθῆτε: “a ó tú yín ká” túmọ̀ sí ẹni akọkọ púpọ̀ (“àwa yóò tú yín ká”), nígbà tí Gíríìkì náà ń tọ́ka sí àwọn ọmọ-ẹ̀yìn ẹni kejì púpọ̀ tí wọn yóò tú ká. Àtúnṣe náà dá ìtumọ̀ palolo/àbájáde náà padà láìsọ ẹni tí ó tú wọn ká. Àwọn apá yòókù fara mọ́ Gíríìkì: ìfẹ̀sùn àkókò “ń bọ̀, ó sì ti dé,” ìtumọ̀ gbòòrò ti εἰς τὰ ἴδια, fífi Jésù sílẹ̀ nìkan, àti wíwà Baba pẹ̀lú rẹ̀.'
