  text: nípa ẹ̀ṣẹ̀, nítorí wọn kò gbàgbọ́ nínú mi;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ
  choice: nípa
  rationale: Ó fi kókó tí Ẹ̀mí yóò dá ayé lẹ́bi nípa rẹ̀ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè tún wúlò nínú ìtẹ̀lé àwọn ẹsẹ 10–11.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Orúkọ àìlóǹkà ẹyọ kan náà ni Gíríìkì lò; ‘ẹ̀ṣẹ̀’ pa ìtumọ̀ gbogbogbò yẹn mọ́ láìyí i sí àwọn ẹ̀ṣẹ̀ kọ̀ọ̀kan tàbí sí ìwà ẹlẹ́ṣẹ̀.
- source_word: μέν
  choice: —
  rationale: μέν ń samisi ohun àkọ́kọ́ nínú àtòjọ ẹsẹ 9–11, ṣùgbọ́n Yorùbá kò nílò ọ̀rọ̀ kan pàtó fún un níbí; ìtẹ̀lé gbólóhùn náà ló ń pa iṣẹ́ rẹ̀ mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ὅτι ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ ‘nípa ẹ̀ṣẹ̀’; ‘nítorí’ fi ipa ìdí náà hàn ní kedere.
- source_word: οὐ πιστεύουσιν
  choice: wọn kò gbà … gbọ́
  rationale: Ìṣe ìsinsìnyí Gíríìkì sọ ipò àìgbàgbọ́ wọn; àpólà Yorùbá ‘gbà ẹni gbọ́’ ni ọ̀nà àdánidá láti sọ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé ẹni.
- source_word: εἰς ἐμέ
  choice: mí
  rationale: Nínú àpólà ‘wọn kò gbà mí gbọ́,’ arọ́pò-orúkọ ‘mí’ ni ohun tí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé náà dojú kọ, ó sì sọ ìtumọ̀ Johannine náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú ẹ̀ṣẹ̀ tí ẹsẹ yìí ń tọ́ka sí
  choice: Ẹsẹ yìí so ẹ̀ṣẹ̀ tí a ń sọ ní àyíká yìí mọ́ àìgbàgbọ́ wọn nínú Jésù ní tààrà.
  alternative: Kí a ka ‘ẹ̀ṣẹ̀’ sí ìwà ẹlẹ́ṣẹ̀ gbogbo ènìyàn, kí àìgbàgbọ́ sì jẹ́ àpẹẹrẹ kan ṣoṣo rẹ̀.
  rationale: Gbólóhùn tí ὅτι bẹ̀rẹ̀ fúnni ní ìdí tàbí àlàyé fún ‘nípa ẹ̀ṣẹ̀.’ Ìtumọ̀ náà pa ìsopọ̀ yìí mọ́ láìfi ẹ̀kọ́ ìsìn tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ kúkúrú, ọlọ́lá, ó sì bá àtòjọ ẹsẹ 9–11 mu. A kò fi àmì àlàyé sí ‘nítorí,’ nítorí ó jẹ́ ìtumọ̀ àdánidá àti tó péye jù lọ ní àyíká yìí.
