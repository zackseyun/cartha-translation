id: JHN.16.30
reference: John 16:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: yo
  text: Ní báyìí, a mọ̀ pé o mọ ohun gbogbo, o kò sì nílò kí ẹnikẹ́ni béèrè lọ́wọ́ rẹ[a]. Nítorí èyí, a gbàgbọ́ pé o ti ọ̀dọ̀ Ọlọ́run wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹnikẹ́ni béèrè ìbéèrè lọ́wọ́ rẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “béèrè” tàbí “béèrè ìbéèrè”; àyíká ọ̀rọ̀ náà dá lórí ìmọ̀ Jésù àti ohun tí àwọn ọmọ-ẹ̀yìn ń fẹ́ béèrè láìsọ ọ́ jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Ní báyìí
  rationale: Ó tọ́ka sí ìmòye tí àwọn ọmọ-ẹ̀yìn ṣẹ̀ṣẹ̀ sọ pé àwọn ní; gbólóhùn yìí jẹ́ ti Yorùbá òde òní, ó sì ṣe kedere.
- source_word: οἴδαμεν
  choice: a mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí pípé, ó ní ìtumọ̀ ìsinsìnyí níbí; ‘a mọ̀’ ni Yorùbá àdánidá.
- source_word: οἶδας πάντα
  choice: o mọ ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbogbo-gbòò ti πάντα mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: οὐ χρείαν ἔχεις
  choice: o kò sì nílò
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé kò sí àìní, ó sì bá ìtumọ̀ orísun mu.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: kí ẹnikẹ́ni béèrè lọ́wọ́ rẹ
  rationale: ἐρωτάω lè túmọ̀ sí béèrè ìbéèrè tàbí fi ẹnì kan wádìí; ọ̀rọ̀ àyíká ń sọ nípa ìbéèrè àwọn ọmọ-ẹ̀yìn àti bí Jésù ṣe mọ ohun tí wọ́n fẹ́ béèrè. Ẹsẹ̀-àlàyé pa àṣàyàn yìí mọ́.
- source_word: ἐν τούτῳ
  choice: Nítorí èyí
  rationale: Ó fi hàn pé ohun tí wọ́n ṣẹ̀ṣẹ̀ sọ ni ìpìlẹ̀ tàbí ẹ̀rí fún ìgbàgbọ́ wọn.
- source_word: πιστεύομεν
  choice: a gbàgbọ́
  rationale: Ó jẹ́ ìtumọ̀ tó tààrà, tó sì yẹ fún ọ̀rọ̀ ìjẹ́wọ́ yìí.
- source_word: ἀπὸ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa ‘láti ọ̀dọ̀ Ọlọ́run’ mọ́, kò sì yí i sí ‘láti ọ̀dọ̀ Baba,’ èyí tí kò sí nínú ẹsẹ yìí.
- source_word: ἐξῆλθες
  choice: o ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Pẹ̀lú ἀπὸ θεοῦ, èyí jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá láti sọ ìpilẹ̀ṣẹ̀ tàbí iṣẹ́ tí Ọlọ́run rán án sí; kò nílò ọ̀rọ̀ líle bí ‘jáde wá.’
theological_decisions:
- issue: Agbára Kristi ti gbólóhùn ‘o mọ ohun gbogbo’
  choice: A pa ọ̀rọ̀ ìjẹ́wọ́ àwọn ọmọ-ẹ̀yìn mọ́ gẹ́gẹ́ bí ó ti wà.
  alternative: Láti fi àlàyé kún un pé ó túmọ̀ sí ìmọ̀ ohun gbogbo ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó péye.
  rationale: Ọ̀rọ̀ náà ní ìwọ̀n ẹ̀kọ́ nípa Kristi, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ sọ ju ohun tí Gíríìkì sọ lọ tàbí mú ìṣòro inú àyíká kúrò.
- issue: Ìtumọ̀ ἀπὸ θεοῦ ἐξῆλθες
  choice: o ti ọ̀dọ̀ Ọlọ́run wá
  alternative: o ti ọ̀dọ̀ Baba wá; o jáde láti inú Ọlọ́run
  rationale: Ọ̀rọ̀ orísun sọ ‘Ọlọ́run,’ kì í ṣe ‘Baba.’ Àṣàyàn náà pa ìtumọ̀ ìpilẹ̀ṣẹ̀ àti iṣẹ́ àṣẹ mọ́ láìfi àlàyé ẹ̀kọ́ kan tí kò hàn gbangba kún un.
translation_notes:
  register: Yorùbá boṣewa tó bójú mu, tó ní àmì ohùn ní kíkún, tí ó sì ṣe àdánidá fún òǹkàwé òde òní. A lo ‘béèrè lọ́wọ́ rẹ’ dípò gbólóhùn tó le tàbí tó lè túmọ̀ sí ìfọ̀rọ̀wánilẹ́nuwò ọ̀tá; ẹsẹ̀-àlàyé fi àìdánilójú lexical hàn.
