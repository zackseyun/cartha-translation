id: JHN.16.29
reference: John 16:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ sọ pé, “Wò ó, ní báyìí, o ń sọ̀rọ̀ ní gbangba[a], o kò sì fi ọ̀rọ̀ ìṣàpẹẹrẹ kankan sọ̀rọ̀[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní kedere.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí sísọ̀rọ̀ ní gbangba, ní kedere, tàbí láìfi nǹkan pamọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “òwe,” “àkàwé,” tàbí “ọ̀rọ̀ tí ìtumọ̀ rẹ̀ farasin.” Níhìn-ín, ó ń tọ́ka sí ọ̀rọ̀ ìṣàpẹẹrẹ tàbí ọ̀rọ̀ tí kò sọ ìtumọ̀ rẹ̀ ní tààrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: sọ pé
  rationale: A lo ọ̀rọ̀ àsìkò tí ó ti kọjá fún ìtàn Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí tí a ń lò nínú ìtàn.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa ìbáṣepọ̀ wọn mọ́.
- source_word: Ἴδε
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí pe àfiyèsí olùgbọ́ ní ọ̀nà tí ó wọ́pọ̀, láìlo èdè àtijọ́.
- source_word: νῦν
  choice: ní báyìí
  rationale: Ó tọ́ka sí ìyípadà tí àwọn ọmọ-ẹ̀yìn rò pé wọ́n rí nínú ọ̀nà tí Jésù ń gbà sọ̀rọ̀.
- source_word: ἐν παρρησίᾳ
  choice: ní gbangba
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí sísọ̀rọ̀ ní gbangba tàbí ní kedere, ní ìtakora sí ọ̀rọ̀ ìṣàpẹẹrẹ.
- source_word: λαλεῖς
  choice: o ń sọ̀rọ̀
  rationale: Àmì ‘ń’ fi hàn pé àwọn ọmọ-ẹ̀yìn ń sọ nípa ọ̀nà tí Jésù ń gbà sọ̀rọ̀ ní àkókò náà.
- source_word: παροιμίαν
  choice: ọ̀rọ̀ ìṣàpẹẹrẹ
  rationale: Nínú Jòhánù, ọ̀rọ̀ náà lè jẹ́ òwe, àkàwé, tàbí ọ̀rọ̀ tí kò sọ ìtumọ̀ rẹ̀ ní tààrà; ‘ọ̀rọ̀ ìṣàpẹẹrẹ’ bá ìtakora pẹ̀lú ‘ní gbangba’ mu.
- source_word: οὐδεμίαν
  choice: kankan
  rationale: Ó mú ìkọ̀sílẹ̀ náà lágbára, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: λέγεις
  choice: fi … sọ̀rọ̀
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò lo ọ̀rọ̀ ìṣàpẹẹrẹ kankan, nígbà tí ó ṣì pa ìṣe sísọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ παρρησία ní ìtakora sí παροιμία
  choice: Jésù ń sọ̀rọ̀ ní gbangba tàbí ní kedere, dípò lílo ọ̀rọ̀ ìṣàpẹẹrẹ tàbí ọ̀rọ̀ tí ó yípo.
  alternative: Jésù ń sọ̀rọ̀ pẹ̀lú ìgboyà tàbí láìbẹ̀rù.
  rationale: Ìtakora tó wà nínú ẹsẹ̀ náà láàárín ἐν παρρησίᾳ àti παροιμίαν οὐδεμίαν ṣe àtìlẹ́yìn fún ìtumọ̀ sísọ̀rọ̀ ní gbangba tàbí ní kedere. A kò fi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó yẹ, a sì fi àmì àlàyé [a] àti [b] sí lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
