id: JHN.16.20
reference: John 16:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: yo
  text: Lóòótọ́, lóòótọ́ ni mo wí fún yín pé, ẹ̀yin yóò sunkún, ẹ ó sì ṣọ̀fọ̀, ṣùgbọ́n ayé yóò yọ̀; ẹ̀yin yóò bànújẹ́, ṣùgbọ́n ìbànújẹ́ yín yóò di ayọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìbànújẹ́ yín yóò yí padà sí ayọ̀.”
    reason: Àṣàyàn ọ̀rọ̀ míràn fún εἰς χαρὰν γενήσεται, tó fi ìyípadà náà hàn ní Yorùbá àdánidá.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ aláṣẹ àti àtúnṣe ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá, ó sì bá ọ̀nà tí Jòhánù ń gbà lo gbólóhùn yìí mu.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ó tẹ̀lé ọ̀rọ̀ ìfọ̀rọ̀sọ́nà tààrà náà pẹ́kípẹ́kí, ní èdè ọlọ́lá tí ó ṣì ṣeé lóye.
- source_word: κλαύσετε
  choice: ẹ̀yin yóò sunkún
  rationale: “Sunkún” fi ẹkún tí ìbànújẹ́ mú jáde hàn kedere, ó sì yàtọ̀ sí ọ̀rọ̀ tó tẹ̀ lé e.
- source_word: θρηνήσετε
  choice: ẹ ó sì ṣọ̀fọ̀
  rationale: “Ṣọ̀fọ̀” mú ìfihàn ìbànújẹ́ jíjinlẹ̀ jáde, kò sì sọ ọ̀rọ̀ náà di ohun kan náà pẹ̀lú “sunkún.”
- source_word: ὁ δὲ κόσμος
  choice: ṣùgbọ́n ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tó gbòòrò fún κόσμος; a kò fi àlàyé bí “ayé aláìgbàgbọ́” kún un, kí ìtumọ̀ Jòhánù tó gbòòrò lè dúró.
- source_word: χαρήσεται
  choice: yóò yọ̀
  rationale: Ó sọ ìdùnnú tó lòdì sí ìbànújẹ́ àwọn ọmọ-ẹ̀yìn ní ṣókí, ó sì so mọ́ “ayọ̀” ní ìparí ẹsẹ náà.
- source_word: λυπηθήσεσθε / ἡ λύπη ὑμῶν
  choice: ẹ̀yin yóò sì banújẹ́ / ìbànújẹ́ yín
  rationale: Lílo gbòǹgbò kan náà nínú ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ pa ìbáṣepọ̀ λυπηθήσεσθε àti λύπη mọ́ bí ó ti rí ní Gíríìkì.
- source_word: εἰς χαρὰν γενήσεται
  choice: yóò di ayọ̀
  rationale: Ó fi ìyípadà sí ayọ̀ tí εἰς àti γενήσεται ń tọ́ka sí hàn ní ọ̀nà tó sún mọ́ Gíríìkì, tí ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìlò κόσμος nínú Jòhánù
  choice: ayé
  alternative: ayé aláìgbàgbọ́; ètò ayé
  rationale: Nínú Jòhánù, κόσμος lè ní ìtumọ̀ odi nípa àwọn ènìyàn tó dojú kọ Jésù, ṣùgbọ́n ẹsẹ yìí kò túmọ̀ rẹ̀ síwájú ju ẹgbẹ́ tó ń yọ̀ nígbà tí àwọn ọmọ-ẹ̀yìn ń banújẹ́ lọ. “Ayé” pa ààyè ìtumọ̀ àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìfi àlàyé sínú ọ̀rọ̀ mímọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnṣe “Lóòótọ́, lóòótọ́” àti ìyàtọ̀ láàárín “sunkún” àti “ṣọ̀fọ̀” ni a pa mọ́; gbólóhùn náà sì ṣàn lọ́nà tí òǹkàwé Yorùbá lásán lè lóye.
