id: JHN.16.5
reference: John 16:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí, mo ń lọ sọ́dọ̀ ẹni tí ó rán mi, kò sì sí ẹnikẹ́ni nínú yín tí ó béèrè lọ́wọ́ mi pé, “Ibo ni o ń lọ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n nísinsin yìí
  rationale: “Ṣùgbọ́n” pa ìyàtọ̀ tí δέ fi hàn mọ́, “nísinsin yìí” sì túmọ̀ νῦν ní èdè Yorùbá àdánidá.
- source_word: ὑπάγω
  choice: mo ń lọ
  rationale: Ó pa ìtumọ̀ ìṣípòpadà mọ́, ó sì fi ìṣe tí ó ń lọ tàbí tí ó ti sún mọ́lé hàn láì sọ ọ́ di “mo ń fi ibí sílẹ̀” nìkan.
- source_word: πρὸς τὸν πέμψαντά με
  choice: sọ́dọ̀ ẹni tí ó rán mi
  rationale: “Sọ́dọ̀” bá ìlọ sí ọ̀dọ̀ ẹni kan mu, gbólóhùn náà sì pa àpólà aláápọn oníṣẹ́ náà mọ́ láì fi “Baba” kún ohun tí Gíríìkì kò sọ níhìn-ín.
- source_word: πέμψαντά
  choice: rán
  rationale: “Rán” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún πέμπω nínú ọ̀rọ̀ iṣẹ́ tí Jésù wá ṣe, láì túmọ̀ ọ́ ju bí orísun ṣe sọ lọ.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: kò sì sí ẹnikẹ́ni nínú yín
  rationale: Ó fi ìkọ̀sẹ̀ pátápátá àti ìtumọ̀ apá nínú ẹgbẹ́ tí gbólóhùn Gíríìkì ní hàn ní Yorùbá àdánidá.
- source_word: ἐρωτᾷ με
  choice: tí ó béèrè lọ́wọ́ mi
  rationale: Nínú àyíká yìí, ἐρωτάω túmọ̀ sí bíbéèrè ìbéèrè; “béèrè lọ́wọ́ mi” ni ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: Ποῦ ὑπάγεις;
  choice: Ibo ni ìwọ ń lọ?
  rationale: Ó jẹ́ ìbéèrè taara tó ṣe àdánidá, ó sì pa ìtumọ̀ ìlọ àti ìtẹnumọ́ ẹni tí a ń bá sọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ta ni “ẹni tí ó rán mi” ń tọ́ka sí?
  choice: Fi í sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó rán mi,” láì fi “Baba” kún un.
  alternative: “sọ́dọ̀ Baba tí ó rán mi”
  rationale: Àpólà Gíríìkì kò dárúkọ Baba ní tààrà ní ẹsẹ yìí. Bí ó tilẹ̀ jẹ́ pé ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere nínú Ìhìn Rere Jòhánù, ìtumọ̀ náà kò gbọdọ̀ fi ohun tí a kò sọ níhìn-ín kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbo ènìyàn. A lo “nísinsin yìí” láti yà á sọ́tọ̀ kedere sí ohun tó ṣáájú, àti “sọ́dọ̀” fún ìlọ sí ọ̀dọ̀ ẹni kan.
