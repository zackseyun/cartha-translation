id: JHN.16.21
reference: John 16:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: yo
  text: Nígbà tí obìnrin bá ń bímọ, ó máa ń ní ìbànújẹ́ nítorí pé wákàtí rẹ̀ dé; ṣùgbọ́n nígbà tí ó bá bí ọmọ náà tán, kì í rántí ìpọ́njú náà mọ́ nítorí ayọ̀ pé a ti bí ènìyàn kan[a] sí ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí pé, “a ti bí ọkùnrin kan sí ayé.” Ọ̀rọ̀ Gíríìkì ἄνθρωπος lè túmọ̀ sí “ọkùnrin” tàbí “ènìyàn” ní ìtumọ̀ gbogbogbò; níbí, ó jẹ́ ọ̀rọ̀ gbogbogbò, kò sì fi dandan tọ́ka sí ọmọkùnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: obìnrin
  rationale: Nínú àpẹẹrẹ gbogbogbò nípa ìbímọ yìí, “obìnrin” ni ìtumọ̀ tó ṣe kedere ju “aya” lọ.
- source_word: ὅταν τίκτῃ
  choice: nígbà tí obìnrin bá ń bímọ
  rationale: Àmì “ń” fi hàn pé ìbímọ náà ń lọ lọ́wọ́, ó sì bá ìṣe gbogbogbò tí ὅταν pẹ̀lú ọ̀rọ̀-ìṣe present subjunctive ń sọ mu.
- source_word: λύπην ἔχει
  choice: ó máa ń ní ìbànújẹ́
  rationale: “Ìbànújẹ́” gba apá ẹ̀dùn ọkàn tí λύπη ní, dípò kí a fi ọ̀rọ̀ náà mọ́ ìrora ara nìkan; “máa ń” tún mú ìṣe gbogbogbò náà ṣe kedere.
- source_word: ἡ ὥρα αὐτῆς
  choice: wákàtí rẹ̀
  rationale: A pa àwòrán “wákàtí” mọ́, nítorí ὥρα ní ìwúwo pàtàkì nínú Jòhánù, bí ó tilẹ̀ jẹ́ pé níbí ó ń tọ́ka sí àkókò ìbímọ rẹ̀.
- source_word: γεννήσῃ τὸ παιδίον
  choice: ó bá bí ọmọ náà tán
  rationale: “Bí ... tán” fi hàn pé ìṣẹ̀lẹ̀ náà ti parí, gẹ́gẹ́ bí aorist subjunctive ṣe ń tọ́ka sí i; “ọmọ” jẹ́ ìtumọ̀ àdánidá fún παιδίον.
- source_word: οὐκέτι μνημονεύει
  choice: kì í rántí ... mọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó bójú mu láti sọ pé kò rántí rẹ̀ mọ́.
- source_word: τῆς θλίψεως
  choice: ìpọ́njú náà
  rationale: “Ìpọ́njú” sọ bí ìṣẹ̀lẹ̀ ìbímọ ṣe le koko láì dín ọ̀rọ̀ náà kù sí ìrora ara nìkan tàbí kó fi ìtumọ̀ ẹ̀kọ́ nípa ìpọ́njú ọjọ́ ìkẹyìn wọ inú rẹ̀.
- source_word: διὰ τὴν χαράν
  choice: nítorí ayọ̀
  rationale: διά pẹ̀lú accusative ń sọ ìdí; “nítorí ayọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ὅτι ἐγεννήθη
  choice: pé a ti bí
  rationale: “Pé” ṣàlàyé ohun tó fa ayọ̀ náà, “a ti bí” sì pa ìṣe passive àti ìparí ìṣẹ̀lẹ̀ náà mọ́.
- source_word: ἄνθρωπος
  choice: ènìyàn kan
  rationale: ἄνθρωπος jẹ́ gbogbogbò níbí, kì í ṣe akọ nìkan; “ènìyàn kan” pa ìtọ́kasí sí ìwà ènìyàn tuntun mọ́ láì sọ pé ọmọkùnrin ni.
- source_word: εἰς τὸν κόσμον
  choice: sí ayé
  rationale: “Bí ... sí ayé” jẹ́ gbólóhùn Yorùbá àdánidá fún wíwọ ènìyàn tuntun sínú ayé.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπος gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò
  choice: ènìyàn kan
  alternative: ọkùnrin kan; ọmọ kan
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ ní gírámà, ṣùgbọ́n ó tọ́ka sí ènìyàn láì yan akọ tàbí abo ní àyíká yìí. “Ènìyàn kan” pa ìtumọ̀ yẹn mọ́; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn láì pinnu pé ọmọkùnrin ni.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá àṣà ìkọ̀wé mu. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba. A pa “wákàtí rẹ̀” mọ́ fún àwòrán àti ìró Jòhánù; “ó bá bí ... tán” jẹ́ ọ̀nà àdánidá láti fi ìparí ìbímọ hàn.
