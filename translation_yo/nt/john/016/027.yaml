id: JHN.16.27
reference: John 16:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: yo
  text: Nítorí Baba fúnra rẹ̀ nífẹ̀ẹ́ yín, nítorí ẹ̀yin ti nífẹ̀ẹ́ mi, ẹ sì ti gbàgbọ́ pé mo wá láti ọ̀dọ̀ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “mo jáde láti ọ̀dọ̀ Ọlọ́run”; Gíríìkì náà tún lè fi hàn pé mo wá láti ibi tí Ọlọ́run wà.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: fúnra rẹ̀
  rationale: Ó tẹnumọ́ pé Baba fúnra rẹ̀ ni ó nífẹ̀ẹ́ àwọn ọmọ-ẹ̀yìn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Orúkọ oyè Ọlọ́run ni nínú ọ̀rọ̀ Jòhánù; ‘Baba’ jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ ní Yorùbá.
- source_word: φιλεῖ
  choice: nífẹ̀ẹ́
  rationale: Ó sọ ìfẹ́ àti ìfararora ẹni sí ẹni; ‘nífẹ̀ẹ́’ jẹ́ èdè Yorùbá tó ṣe kedere láì dín ìtumọ̀ rẹ̀ kù.
- source_word: ὑμᾶς
  choice: yín
  rationale: Ó tọ́ka sí gbogbo àwọn ọmọ-ẹ̀yìn, nítorí náà a lo arọ́pò-orúkọ ọ̀pọ̀.
- source_word: ὅτι
  choice: nítorí
  rationale: ὅτι àkọ́kọ́ fi ìdí tí Baba fi nífẹ̀ẹ́ wọn hàn.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì ní ìtẹnumọ́ díẹ̀; ‘ẹ̀yin’ pa ìtẹnumọ́ náà mọ́ ní ti ara.
- source_word: ἐμὲ
  choice: mi
  rationale: Ó tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí àwọn ọmọ-ẹ̀yìn nífẹ̀ẹ́.
- source_word: πεφιλήκατε
  choice: ti nífẹ̀ẹ́
  rationale: Àkókò perfect sọ ìṣe tó ti ṣẹlẹ̀ tí ipa rẹ̀ sì ń bá a lọ; àkópọ̀ ‘ti nífẹ̀ẹ́’ mú èyí jáde ní Yorùbá.
- source_word: καὶ
  choice: ẹ sì
  rationale: 'Ó so àwọn ìdí méjèèjì pọ̀: ìfẹ́ wọn sí Jésù àti ìgbàgbọ́ wọn nípa ibi tó ti wá.'
- source_word: πεπιστεύκατε
  choice: ti gbàgbọ́
  rationale: Ó pa ìtumọ̀ perfect mọ́ gẹ́gẹ́ bí ìgbàgbọ́ tó ti bẹ̀rẹ̀ tí ó sì dúró; gbólóhùn tó tẹ̀ lé e jẹ́ àkóónú ìgbàgbọ́ náà.
- source_word: ὅτι
  choice: pé
  rationale: ὅτι kejì ń ṣàgbékalẹ̀ àkóónú ohun tí wọ́n gbàgbọ́.
- source_word: παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: mo ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó fi ìpilẹ̀ṣẹ̀ tàbí ìránṣẹ́ Jésù láti ọ̀dọ̀ Ọlọ́run hàn, ó sì tún lè ní ìmọ̀ pé ó wá láti iwájú Ọlọ́run; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ààyè fún ìtumọ̀ yìí mọ́.
theological_decisions:
- issue: Agbára ẹ̀kọ́ nípa Kristi nínú ‘mo ti ọ̀dọ̀ Ọlọ́run wá’
  choice: mo ti ọ̀dọ̀ Ọlọ́run wá
  alternative: mo jáde láti ọ̀dọ̀ Ọlọ́run; mo wá láti iwájú Ọlọ́run
  rationale: Ìtumọ̀ náà jẹ́wọ́ ìpilẹ̀ṣẹ̀ àti ìránṣẹ́ Jésù ní ìbáṣepọ̀ pẹ̀lú Ọlọ́run, ṣùgbọ́n kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Ẹ̀yin/yín’ fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀. Àmì ẹsẹ̀ ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
