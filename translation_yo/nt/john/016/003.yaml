  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταῦτα ποιήσουσιν ὅτι οὐκ ἔγνωσαν τὸν πατέρα οὐδὲ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: yo
  text: Wọ́n yóò sì ṣe àwọn nǹkan wọ̀nyí nítorí pé wọn kò mọ̀ Baba tàbí mí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọn kò wá mọ Baba tàbí mí.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí pé wọn kò dé sí ìmọ̀ Baba àti Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ àṣà Yorùbá yìí so gbólóhùn náà mọ́ ohun tó ṣáájú lọ́nà àdánidá.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nǹkan tí ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ń tọ́ka sí mọ́, ó sì ń tọ́ka padà sí àwọn ìṣe ìkórìíra tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ποιήσουσιν
  choice: wọn yóò ṣe
  rationale: Ó fi àkókò ọjọ́ iwájú àti ìtumọ̀ ṣíṣe hàn ní Yorùbá àdánidá.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń sọ ìdí tí wọn yóò fi ṣe àwọn nǹkan wọ̀nyí.
- source_word: οὐκ ἔγνωσαν
  choice: wọn kò mọ
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì lè gba ìmọ̀ ẹni tímọ́tímọ́ tí ọ̀rọ̀ Johanu ní lọ́kàn láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Baba jẹ́ orúkọ oyè fún Ọlọ́run nínú àyíká ọ̀rọ̀ Johanu; lílo lẹ́tà ńlá fi èyí hàn.
- source_word: οὐδὲ ἐμέ
  choice: tàbí èmi
  rationale: Lẹ́yìn gbólóhùn òdì ‘wọn kò mọ,’ ‘tàbí’ sọ ìtumọ̀ pé wọn kò mọ Baba, wọn kò sì mọ Jésù pẹ̀lú; ‘èmi’ jẹ́ fọ́ọ̀mù tí ó yẹ gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà ń kan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ èdè Johanu nípa mímọ Ọlọ́run àti Jésù
  choice: wọn kò mọ Baba tàbí èmi
  alternative: wọn kò tíì wá mọ Baba tàbí èmi
  rationale: Ìtumọ̀ yìí pa ẹ̀sùn pé wọn kò ní ìmọ̀ tímọ́tímọ́ nípa Baba àti Jésù mọ́, láì sọ bóyá aorist náà túmọ̀ sí ìṣẹ̀lẹ̀ àtijọ́ nìkan tàbí ipò tí àbájáde rẹ̀ ṣì wà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Baba’ gẹ́gẹ́ bí orúkọ oyè, a sì pa àìṣe kedere tó wà nínú ἔγνωσαν mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
