source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: yo
  text: Títí di ìsinsin yìí, ẹ kò tíì béèrè ohunkóhun ní orúkọ mi[a]. Ẹ béèrè[b], ẹ ó sì rí gbà, kí ayọ̀ yín lè kún[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Ní orúkọ mi’ lè túmọ̀ sí àdúrà tí a ṣe ní ìbámu pẹ̀lú ẹni tí Jésù jẹ́, àṣẹ rẹ̀, àti iṣẹ́ rẹ̀; a pa gbólóhùn náà mọ́ láì dín ìtumọ̀ rẹ̀ kù sí àlàyé kan ṣoṣo.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́, ‘Ẹ máa béèrè.’ Àṣẹ ìsinsin náà lè tọ́ka sí ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra nínú ọ̀rọ̀ yìí.
    reason: lexical_alternative
  - marker: c
    text: Ó tún lè jẹ́, ‘kí ayọ̀ yín lè pé.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Títí di ìsinsin yìí
  rationale: Ọ̀rọ̀ yìí tọ́ka sí gbogbo àkókò títí dé àsìkò tí Jésù ń sọ̀rọ̀; ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘títí di báyìí.’
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: ẹ kò tíì béèrè ohunkóhun
  rationale: Ìṣọ̀kan ‘kò tíì … ohunkóhun’ mú ìtumọ̀ pé wọn kò béèrè ohun kan rárá títí di àsìkò yẹn jáde ní Yorùbá tó ṣe kedere.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: A pa àwòrán àti ìtumọ̀ gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́, láì dín un kù sí ‘ní àṣẹ mi’ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
- source_word: αἰτεῖτε
  choice: Ẹ béèrè
  rationale: Àṣẹ ìsinsin Gíríìkì lè jẹ́ àṣẹ gbogbogbò tàbí ìṣe tí a ń ṣe léraléra. ‘Ẹ béèrè’ jẹ́ àṣẹ Yorùbá àdánidá, nígbà tí àlàyé ìṣe tí ń bá a lọ wà nínú àlàyé ìsàlẹ̀.
- source_word: λήμψεσθε
  choice: ẹ ó sì rí gbà
  rationale: ‘Rí gbà’ jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún ohun tí ẹni kan gba gẹ́gẹ́ bí ìdáhùn sí ohun tí ó béèrè.
- source_word: ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: kí ayọ̀ yín lè kún
  rationale: Èyí pa ète tàbí àbájáde tí ἵνα ń tọ́ka sí mọ́, ó sì tún pa àwòrán ‘kíkún’ tí πεπληρωμένη ní mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ àdúrà ‘ní orúkọ mi’
  choice: Pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ‘ní orúkọ mi.’
  alternative: ‘ní àṣẹ mi,’ ‘ní ipò mi,’ tàbí ‘ní ìṣọ̀kan pẹ̀lú mi’
  rationale: Gbólóhùn náà ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀, tó sì lè kan ẹni Jésù, àṣẹ rẹ̀ àti iṣẹ́ rẹ̀. Ìtumọ̀ tààrà yìí kò fi agbára mú ọ̀kan lára àwọn àlàyé wọ̀nyí nìkan.
- issue: Bí a ṣe máa fi ᾖ πεπληρωμένη hàn
  choice: ‘kí ayọ̀ yín lè kún’
  alternative: ‘kí ayọ̀ yín lè pé’ tàbí ‘kí a lè mú ayọ̀ yín kún’
  rationale: ‘Kún’ pa àwòrán kíkún tí Jòhánù máa ń lò mọ́. Yorùbá yìí tún fi ipò ayọ̀ tó ti dé ẹ̀kúnrẹ́rẹ́ hàn láì sọ ohun tí Gíríìkì kò sọ ní kedere.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ’ bá àdírẹ́sì ọ̀pọ̀ Gíríìkì mu. Gbólóhùn náà rọrùn fún òǹkàwé lásán, ṣùgbọ́n ó pa àwòrán ‘orúkọ’ àti ‘kíkún ayọ̀’ inú orísun mọ́.
