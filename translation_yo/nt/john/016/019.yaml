id: JHN.16.19
reference: John 16:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: yo
  text: Jésù mọ̀ pé wọ́n fẹ́ béèrè lọ́wọ́ rẹ̀[a], ó sì wí fún wọn pé, “Ṣé ẹ ń bá ara yín sọ̀rọ̀ nípa ohun tí mo sọ pé[c], ‘Ní ìgbà díẹ̀, ẹ kò ní rí mi mọ́; lẹ́yìn ìgbà díẹ̀ sí i, ẹ ó sì rí mi[b]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gangan, “nípa èyí.”
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀-ìṣe méjì ọ̀tọ̀ ni Gíríìkì lò fún “rí” níbí: àkọ́kọ́ ni θεωρέω, tó lè túmọ̀ sí “wò” tàbí “ṣàkíyèsí”; èkejì ni ὁράω, “rí.” Nínú ìtumọ̀ yìí, a lo “rí” fún méjèèjì láti mú ìtumọ̀ àti ìṣọ̀kan gbólóhùn náà ṣe kedere.'
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí pé mo sọ.” Ọ̀rọ̀ ìsopọ̀ Gíríìkì náà lè fi ohun tí wọ́n ń jíròrò hàn tàbí ìdí tí wọ́n fi ń jíròrò rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: mọ̀
  rationale: Ọ̀rọ̀ yìí sọ pé Jésù ti mọ èrò inú àwọn ọmọ-ẹ̀yìn rẹ̀; ‘mọ̀’ ni ọ̀nà Yorùbá tó ṣe kedere jù lọ.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: wọ́n fẹ́ béèrè lọ́wọ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìfẹ́ wọn láti béèrè ohun kan lọ́wọ́ Jésù, láìfi ìtumọ̀ àtakò kún un.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Ṣé ohun tí ẹ ń bá ara yín sọ̀rọ̀ nípa rẹ̀ ni
  rationale: Nínú àyíká yìí, ζητεῖτε túmọ̀ sí pé wọ́n ń wádìí ìtumọ̀ ọ̀rọ̀ náà láàárín ara wọn; ‘ń bá ara yín sọ̀rọ̀ nípa rẹ̀’ jẹ́ Yorùbá tó ṣeé lóye, tó sì pa ìbéèrè Jésù mọ́.
- source_word: ὅτι εἶπον
  choice: pé mo sọ pé
  rationale: ‘Pé’ lè fi ohun tí wọ́n ń jíròrò hàn, ó sì ṣamọ̀nà lọ́nà àdánidá sínú ọ̀rọ̀ tí Jésù sọ. Àṣàyàn ìdí, ‘nítorí pé,’ wà nínú àlàyé ìsàlẹ̀.
- source_word: Μικρὸν
  choice: Ní ìgbà díẹ̀
  rationale: Μικρόν níbí ń tọ́ka sí àkókò kúkúrú; ‘ní ìgbà díẹ̀’ jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
- source_word: οὐ θεωρεῖτέ με
  choice: ẹ kò ní rí mi mọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì ní ìrísí àkókò ìsinsìnyí, àyíká ‘ní ìgbà díẹ̀’ tọ́ka sí píparí rírí rẹ̀ ní ọjọ́ iwájú tó sún mọ́lé. ‘Kò ní rí mi mọ́’ sọ èyí ní Yorùbá àdánidá.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: lẹ́yìn ìgbà díẹ̀ sí i, ẹ ó sì rí mi
  rationale: ‘Lẹ́yìn ìgbà díẹ̀ sí i’ fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn, ‘ẹ ó sì rí mi’ sì pa ọjọ́ iwájú ὄψεσθέ mọ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín θεωρέω àti ὁράω nínú àwọn gbólóhùn méjèèjì
  choice: Lo ‘rí’ fún àwọn ọ̀rọ̀-ìṣe méjèèjì nínú ẹsẹ̀ náà.
  alternative: Ṣe ìyàtọ̀ wọn pẹ̀lú ‘wò/ṣàkíyèsí’ ní àkọ́kọ́ àti ‘rí’ ní èkejì.
  rationale: Àfojúsùn ọ̀rọ̀ náà ni àìrí Jésù fún ìgbà díẹ̀ àti rírí rẹ̀ lẹ́ẹ̀kan sí i, kì í ṣe láti fi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lágbára múlẹ̀ láàárín oríṣi rírí méjì. Àlàyé ìsàlẹ̀ pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ipa ὅτι nínú ìbéèrè Jésù
  choice: Túmọ̀ ọ́ sí ‘pé,’ gẹ́gẹ́ bí ohun tí wọ́n ń bá ara wọn sọ̀rọ̀ nípa rẹ̀.
  alternative: ‘Nítorí pé,’ gẹ́gẹ́ bí ìdí tí wọ́n fi ń bá ara wọn sọ̀rọ̀.
  rationale: Gíríìkì lè gba ìtumọ̀ méjèèjì. ‘Pé’ bá ọ̀rọ̀ tí a fa yọ lẹ́yìn rẹ̀ mu dáadáa, ṣùgbọ́n a kò fi àṣàyàn ìdí pamọ́.
- issue: Bí ìbéèrè Jésù ṣe rí
  choice: 'Pa á mọ́ gẹ́gẹ́ bí ìbéèrè tòótọ́: ‘Ṣé ohun tí ẹ ń bá ara yín sọ̀rọ̀ nípa rẹ̀ ni...?’'
  alternative: Ṣe é bí gbólóhùn ìmúdájú pé wọ́n ń béèrè lọ́wọ́ ara wọn.
  rationale: Ìrísí Gíríìkì àti àyíká ọ̀rọ̀ fi Jésù hàn bí ẹni tó ń ṣí ìjíròrò wọn payá nípasẹ̀ ìbéèrè, láìfi ìtẹnumọ́ mìíràn kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ’ ni a lò fún ọ̀pọ̀ ènìyàn, ‘wí fún wọn’ sì pa ìforúkọsílẹ̀ Bíbélì tó ní iyì mọ́ láìjẹ́ kí ẹsẹ̀ náà ṣòro fún òǹkàwé òde òní.
