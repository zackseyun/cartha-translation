  source_fidelity: Ìtumọ̀ náà ń fi ìmọ̀ Jésù nípa ìfẹ́ àwọn ọmọ-ẹ̀yìn rẹ̀ láti béèrè, ìbéèrè rẹ̀ sí wọn, àkókò kúkúrú ti àìrí i, àti rírí i lẹ́ẹ̀kan sí i hàn dáadáa. Síbẹ̀, ìtòlẹ́sẹẹsẹ ‘Ṣé ohun tí ẹ ń bá ara yín sọ̀rọ̀ nípa rẹ̀ ni pé mo sọ pé’ kò rọrùn ní Yorùbá, ó sì lè mú kí ìbáṣepọ̀ ‘nípa èyí’ àti ọ̀rọ̀ tí Jésù sọ dàrú. Àtúnṣe náà tún gbé ọ̀rọ̀ náà kalẹ̀ ní ìlànà Yorùbá tó ṣe kedere, láìpa àìdájú ὅτι run.
  naturalness: ‘Ṣé ẹ ń bá ara yín sọ̀rọ̀ nípa ohun tí mo sọ pé …?’ jẹ́ Yorùbá ìgbàlódé tó rọrùn, tó sì yẹ fún ìbéèrè tó ń ṣí ìjíròrò àwọn ọmọ-ẹ̀yìn payá. ‘Ẹ kò ní rí mi mọ́’ àti ‘ẹ ó sì rí mi’ jẹ́ ìlò àkókò tó dára nínú àyíká yìí.
  terminology: ‘Jésù,’ ‘béèrè lọ́wọ́,’ ‘wí fún,’ àti ‘rí’ yẹ, wọ́n sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá mu. A pa ìyàtọ̀ θεωρέω/ὁράω mọ́ nínú àlàyé ìsàlẹ̀, láìfipá mú ìyàtọ̀ tí kò dájú sínú ọ̀rọ̀ pàtàkì.
