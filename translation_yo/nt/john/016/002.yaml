  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: yo
  text: Wọ́n yóò lé yín jáde kúrò nínú àwọn sínágọ́gù[a]. Ní tòótọ́, àkókò kan ń bọ̀ tí ẹnikẹ́ni tí ó bá pa yín yóò rò pé òun ń ṣe iṣẹ́ ìsìn fún Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n yóò yọ yín kúrò nínú àwọn sínágọ́gù,” ìyẹn ni, wọ́n yóò kọ̀ láti jẹ́ kí ẹ jẹ́ ara àwùjọ sínágọ́gù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òun ń ṣe ìjọsìn fún Ọlọ́run” tàbí “òun ń ṣe iṣẹ́ ẹ̀sìn fún Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Wọn yóò lé yín jáde kúrò nínú àwọn sínágọ́gù
  rationale: Ó sọ ìyọkúrò nínú àwùjọ ẹ̀sìn àti sínágọ́gù ní ọ̀nà Yorùbá tí ó ṣe kedere, ó sì pa agbára ìṣe olùṣe mọ́.
- source_word: ἀλλ’
  choice: Ní tòótọ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń mú ìkìlọ̀ náà le sí i ju kí ó kan fi ìtakora hàn.
- source_word: ἔρχεται ὥρα ἵνα
  choice: àkókò kan ń bọ̀ tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn tí ó ń tọ́ka sí àkókò tí ohun tí a sọ yóò ṣẹlẹ̀, láìfi ìtumọ̀ pàtàkì mìíràn kún un.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: ẹnikẹ́ni tí ó bá pa yín
  rationale: Ó pa ìtumọ̀ gbogbogbò ti πᾶς mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó wọ́pọ̀ fún ẹni yòówù tí ó bá ṣe ìṣe náà.
- source_word: δόξῃ
  choice: yóò rò pé
  rationale: Ó ṣàfihàn èrò tàbí ìgbàgbọ́ inú ẹni náà, kì í ṣe ìdánilójú pé Ọlọ́run fọwọ́ sí ìṣe náà.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: òun ń fi iṣẹ́ ìsìn rúbọ sí Ọlọ́run
  rationale: “Iṣẹ́ ìsìn” pa ìtumọ̀ iṣẹ́ ẹ̀sìn mọ́, “fi ... rúbọ” sì pa àwọ̀ ìtumọ̀ fífi ohun kan fún Ọlọ́run ti προσφέρειν mọ́.
theological_decisions:
- issue: Èrò àwọn apànìyàn pé ìṣe wọn jẹ́ iṣẹ́ ẹ̀sìn
  choice: òun ń fi iṣẹ́ ìsìn rúbọ sí Ọlọ́run
  alternative: òun ń ṣe ìjọsìn fún Ọlọ́run
  rationale: 'Yíyan yìí pa ìyàlẹ́nu àti ìforígbárí inú ọ̀rọ̀ Gíríìkì mọ́: apànìyàn náà gbà pé ìpànìyàn jẹ́ iṣẹ́ mímọ́, ṣùgbọ́n ọ̀rọ̀ náà kò sọ pé Ọlọ́run fọwọ́ sí i.'
- issue: Ẹni tí πᾶς ὁ ἀποκτείνας ń tọ́ka sí
  choice: ẹnikẹ́ni tí ó bá pa yín ... òun
  alternative: gbogbo àwọn tí wọ́n bá pa yín ... àwọn
  rationale: “Ẹnikẹ́ni ... òun” pa ẹyọ ọ̀rọ̀ orísun àti agbára gbogbogbò rẹ̀ mọ́; ọ̀rọ̀ arọ́pò “òun” kò fi akọ tàbí abo tí kò ṣe pàtàkì sínú Yorùbá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Sínágọ́gù” jẹ́ ọ̀rọ̀ tí ó ṣe kedere jù “ilé ìpàdé” lọ nítorí pé ọ̀rọ̀ orísun ń tọ́ka sí ilé àti àwùjọ ẹ̀sìn Júù.
