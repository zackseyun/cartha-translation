id: JHN.16.4
reference: John 16:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: yo
  text: Ṣùgbọ́n mo ti sọ àwọn nǹkan wọ̀nyí fún yín, kí ẹ lè rántí wọn—pé mo ti sọ fún yín—nígbà tí wákàtí wọn bá dé.[a] Ṣùgbọ́n èmi kò sọ àwọn nǹkan wọ̀nyí fún yín láti ìbẹ̀rẹ̀, nítorí mo wà pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki: “nígbà tí wákàtí wọn bá dé, kí ẹ rántí wọn, pé mo sọ fún yín.” Ọ̀rọ̀ Gíríìkì náà ní “wọn/tiwọn” (αὐτῶν) lẹ́ẹ̀mejì: ọ̀kan pẹ̀lú “wákàtí,” èkejì sì jẹ́ ohun tí a ń rántí. Ìbáṣepọ̀ ohun tí àwọn ọ̀rọ̀ náà ń tọ́ka sí kò ṣe kedere pátápátá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: mo ti sọ
  rationale: Ìṣe àṣekágbá náà tọ́ka sí ohun tí Jésù ti sọ tí ó sì ṣì ní ìtumọ̀ nísinsìnyí; “mo ti sọ” jẹ́ ọ̀nà Yorùbá àdánidá láti fi èyí hàn.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka ọ̀pọ̀ yìí ń tọ́ka sí àwọn ìkìlọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: Ó ń fi ète ọ̀rọ̀ náà hàn lọ́nà Yorùbá tí ó ṣe kedere àti ti àdánidá.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: nígbà tí wákàtí wọn bá dé
  rationale: “Bá dé” ń fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a ń retí hàn; “wákàtí wọn” sì pa àwòrán àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́ láì túmọ̀ rẹ̀ ju bí ó ti wà lọ.
- source_word: μνημονεύητε
  choice: ẹ lè rántí
  rationale: “Rántí” ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù fún ìrántí ohun tí a ti sọ tẹ́lẹ̀.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: pé mo ti sọ wọ́n fún yín
  rationale: “Pé” ṣe àgbékalẹ̀ gbólóhùn ohun tí a ó rántí; fífi “wọ́n” sí i tún ń ṣàfihàn αὐτῶν kejì ní Yorùbá láì jẹ́ kí gbólóhùn náà le.
- source_word: Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον
  choice: Ṣùgbọ́n èmi kò sọ àwọn nǹkan wọ̀nyí fún yín láti ìbẹ̀rẹ̀
  rationale: “Láti ìbẹ̀rẹ̀” tẹ̀lé ἐξ ἀρχῆς ní tààrà; “èmi” fi ìtẹnumọ́ orúkọ arọ́pò inú Gíríìkì hàn ní ọ̀nà tí ó bá Yorùbá mu.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: mo wà pẹ̀lú yín
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì jẹ́ Yorùbá àdánidá fún ìbáṣepọ̀ wíwà papọ̀.
theological_decisions:
- issue: Ohun tí αὐτῶν méjèèjì ń tọ́ka sí
  choice: A pa “wákàtí wọn” mọ́, a sì tú αὐτῶν kejì sí “wọ́n” nínú “mo ti sọ wọ́n fún yín.”
  alternative: A lè sọ ọ́ ní ṣókí sí “nígbà tí wákàtí wọn bá dé, kí ẹ rántí pé mo ti sọ fún yín,” kí a má fi αὐτῶν kejì hàn ní kedere.
  rationale: Àkọsílẹ̀ SBLGNT ní αὐτῶν lẹ́ẹ̀mejì. Yorùbá lè ṣàfihàn méjèèjì lọ́nà tí ó ṣì ṣeé kà; àkọlé ìsàlẹ̀ ojú ìwé sì jẹ́wọ́ pé ìbáṣepọ̀ wọn nínú Gíríìkì kò rọrùn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. “Wákàtí” ni a lò dípò “àkókò” láti pa àwòrán Johannine ὥρα mọ́.
