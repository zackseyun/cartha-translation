  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ẹsẹ̀ náà mọ́: ìdí tí a fi sọ ìkìlọ̀ náà, ìṣẹ̀lẹ̀ ìjọ̀wọ́ ọjọ́ iwájú, àti ìdí tí a kò fi sọ ọ́ láti ìbẹ̀rẹ̀. Ṣùgbọ́n “mo ti sọ wọ́n fún yín” kò bá Gíríìkì ὅτι ἐγὼ εἶπον ὑμῖν mu ní tààrà, nítorí kò sí ohun-ìṣe wọ́n nínú gbolohun yẹn; αὐτῶν kejì tẹ̀lé μνημονεύητε, kì í ṣe εἶπον. Ó yẹ kí Yorùbá fi i hàn gẹ́gẹ́ bí ohun tí a rántí: “kí ẹ rántí wọn—pé mo ti sọ fún yín.”'
  naturalness: “Mo ti sọ wọ́n fún yín” lè dá bí ẹni pé “àwọn nǹkan wọ̀nyí” ni a ‘sọ fún’ àwọn ọmọ-ẹ̀yìn, èyí tí kò rọrùn ní Yorùbá. Ìṣètò “kí ẹ rántí wọn—pé mo ti sọ fún yín” jẹ́ Yorùbá tó ṣeé kà, ó sì ṣọ́ra láti pa ìfarahàn àìdánilójú Gíríìkì mọ́.
  terminology: “Wákàtí wọn,” “àwọn nǹkan wọ̀nyí,” “láti ìbẹ̀rẹ̀,” àti “pẹ̀lú yín” yẹ, wọ́n sì bá ọ̀rọ̀ Johannine àti ìforúkọsílẹ̀ Yorùbá boṣewa mu. Àmì ohùn jẹ́ dáradára.
