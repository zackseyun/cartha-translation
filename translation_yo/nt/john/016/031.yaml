  text: ἀπεκρίθη ⸀αὐτοῖς Ἰησοῦς· Ἄρτι πιστεύετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/031.yaml
  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: yo
  text: Jésù dá wọn lóhùn pé, “Ǹjẹ́ ẹ gbàgbọ́ nísinsìnyí?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ gbàgbọ́ nísinsìnyí.” A lè ka ọ̀rọ̀ Gíríìkì náà gẹ́gẹ́ bí gbólóhùn ìfẹsẹ̀múlẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà ṣe àtìlẹ́yìn fún ìbéèrè alágbára.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá … lóhùn
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìdáhùn nínú ìjíròrò ni; ó bá aorist ìtàn náà mu láìfi ìtumọ̀ míì kún un.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Ó ṣàfihàn arọ́pò-orúkọ ọ̀pọ̀ gẹ́gẹ́ bí ẹni tí Jésù dá lóhùn.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìlànà Yorùbá tí ó wọ́pọ̀.
- source_word: Ἄρτι
  choice: nísinsin yìí
  rationale: Ó pa agbára àsìkò ìsinsin náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘ní àkókò yìí gan-an.’
- source_word: πιστεύετε
  choice: ẹ gbàgbọ́
  rationale: ‘Gbàgbọ́’ ni ìtumọ̀ Yorùbá tí ó ṣe kedere jù fún πιστεύω; ‘ẹ’ pa ẹni kejì ọ̀pọ̀ inú Gíríìkì mọ́.
theological_decisions:
- issue: Agbára gbólóhùn Ἄρτι πιστεύετε;
  choice: 'A túmọ̀ ọ́ sí ìbéèrè alágbára: “Ǹjẹ́ ẹ gbàgbọ́ nísinsin yìí?”'
  alternative: “Ẹ gbàgbọ́ nísinsin yìí.”
  rationale: Gíríìkì lè jẹ́ ìbéèrè tàbí gbólóhùn ìfẹsẹ̀múlẹ̀ nítorí àmì ohùn kò sí nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀. Àyíká ẹsẹ tó tẹ̀ lé e ṣe àtìlẹ́yìn fún ìbéèrè, ṣùgbọ́n àlàyé ìsàlẹ̀ pa òmìnira ìtumọ̀ kejì mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ǹjẹ́’ láti mú ìbéèrè náà ṣe kedere, ‘nísinsin yìí’ sì ń pa ìtẹnumọ́ ἄρτι mọ́. Gbogbo àmì ohùn wà níbi tí ó bá yẹ.
