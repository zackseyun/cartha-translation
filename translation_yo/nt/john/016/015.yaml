  verdict: revise
  source_fidelity: Ìpín àkọ́kọ́ àti ìsopò ìdí/àbájáde náà bá Gíríìkì mu dáadáa. ‘Ń mú’ pa àìdánilójú tó wà nínú λαμβάνει mọ́, pẹ̀lú ‘ń gbà’ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀. Ṣùgbọ́n ‘sọ ọ́ di mímọ̀’ lè túmọ̀ sí ṣíṣe ohun kan ní mímọ́/mímọ́ ọlọ́wọ̀, tàbí ṣíṣe kó ṣe kedere, kò sì dá ìṣe ìkìlọ̀/ìṣípayá ti ἀναγγελεῖ hàn ní ìdánilójú tó. ‘Jẹ́ kí ẹ mọ̀ ọ́’ ń sọ ‘will make it known to you’ ní kedere, ó sì pa ọjọ́ iwájú mọ́.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá òde òní tó rọrùn láti ka. Ìtúnṣe náà mú gbolohun ìkẹyìn rọrùn síi, ó sì yọ ìtumọ̀ méjì tí a kò fẹ́ nínú ‘sọ ọ́ di mímọ̀’ kúrò. A gbe àmì àlàyé ìsàlẹ̀ sún mọ́ ‘mú,’ ibi tí àṣàyàn ọ̀rọ̀ náà wà.
  terminology: ‘Baba’ gẹ́gẹ́ bí oyè Ọlọ́run, ‘tèmi,’ àti ‘ohun tí í ṣe tèmi’ jẹ́ ọ̀rọ̀ tó yẹ, wọ́n sì pa agbára ìní tí ἐμά/τοῦ ἐμοῦ ń fi hàn mọ́. Ìtúnṣe náà kò fi èdè ẹ̀kọ́ ìjọ tàbí ìtumọ̀ ẹ̀kọ́ mìíràn kún ẹsẹ̀ náà.
