id: JHN.16.15
reference: John 16:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: yo
  text: Gbogbo ohun tí Baba ní jẹ́ tèmi. Ìdí nìyẹn tí mo fi sọ pé òun ń mú[a] láti inú ohun tí í ṣe tèmi, yóò sì jẹ́ kí ẹ mọ̀ ọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òun ń gbà láti inú ohun tí í ṣe tèmi.”
    reason: Àṣàyàn ìtumọ̀ fún λαμβάνει; ó lè túmọ̀ sí ‘mú’ tàbí ‘gbà.’
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Gbogbo ohun tí
  rationale: Ó pa agbára ọ̀rọ̀ àkójọpọ̀ náà mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘everything that’ ní Yorùbá.
- source_word: ἔχει ὁ πατὴρ
  choice: Baba ní
  rationale: ‘Ní’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún níní ohun kan; ‘Baba’ sì dúró gẹ́gẹ́ bí orúkọ oyè fún Ọlọ́run nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἐμά ἐστιν
  choice: jẹ́ tèmi
  rationale: Ó fi ìtumọ̀ ohun-ìní tó lágbára hàn ní tààràtà, láìfi èrò ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: διὰ τοῦτο
  choice: Ìdí nìyẹn
  rationale: Ó sọ ìbáṣepọ̀ ìdí àti àbájáde náà ní Yorùbá òde òní tó ṣe kedere.
- source_word: εἶπον
  choice: tí mo fi sọ
  rationale: Ó pa ìṣe àsìkò tí ó ti kọjá mọ́, ó sì bá ìṣàn gbólóhùn ‘Ìdí nìyẹn tí ... fi ...’ mu.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: láti inú ohun tí í ṣe tèmi
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀ Gíríìkì tí a kò sọ ní kíkún jáde ní Yorùbá, ó sì pa èrò orísun mọ́.
- source_word: λαμβάνει
  choice: ń mú
  rationale: ‘Ń mú láti inú’ lè túmọ̀ sí gbígba ohun láti orísun kan, ó sì pa ìtumọ̀ ‘takes’ mọ́; àṣàyàn ‘ń gbà’ wà nínú àlàyé ìsàlẹ̀ nítorí pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘receives.’
- source_word: ἀναγγελεῖ
  choice: yóò sì sọ ọ́ di mímọ̀
  rationale: Ó pa àsìkò ọjọ́ iwájú mọ́, ó sì fi ipa ìṣípayá ti ọ̀rọ̀ náà hàn dáadáa ju ‘sọ’ lásán lọ.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún ẹni púpọ̀ tí a ń bá sọ̀rọ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ohun tí Baba ní sí Ọmọ
  choice: Gbogbo ohun tí Baba ní jẹ́ tèmi
  alternative: Gbogbo ohun tí Baba ní jẹ́ ti èmi
  rationale: Ìtumọ̀ náà pa ọ̀rọ̀ líle tí Jésù sọ nípa gbogbo ohun tí Baba ní mọ́, láìfi èdè ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
- issue: Bí Ẹ̀mí ṣe gba láti ọ̀dọ̀ Ọmọ
  choice: òun ń mú láti inú ohun tí í ṣe tèmi
  alternative: òun ń gbà láti inú ohun tí í ṣe tèmi
  rationale: λαμβάνει lè ní ìtumọ̀ ‘mú’ tàbí ‘gbà.’ A lo ‘mú’ nínú ọ̀rọ̀ pàtàkì, a sì pa ‘gbà’ mọ́ nínú àlàyé ìsàlẹ̀ kí a má bàa yanjú àìdánilójú ọ̀rọ̀ náà ní ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Òun’ ń tọ́ka sí Ẹ̀mí tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀ tó ṣáájú, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ ‘mo’ tí Jésù lò.
