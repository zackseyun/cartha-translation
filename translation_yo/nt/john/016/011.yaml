  yaml_path: translation/nt/john/016/011.yaml
  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: yo
  text: àti nípa ìdájọ́, nítorí a ti dá olórí ayé yìí[a][b] lẹ́jọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘aládé ayé yìí.’
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí èyí ń tọ́ka sí Sátánì; fi wé Jòhánù 12:31 àti 14:30.
    reason: cross_reference
  - marker: c
    text: Tàbí ‘a ti dá a lẹ́jọ́ tán.’ Àkókò pípé nínú Gíríìkì tẹnu mọ́ ìdájọ́ tí ó ti ṣẹlẹ̀, pẹ̀lú ipa tí ó ṣì wà.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: àti nípa ìdájọ́
  rationale: περί pẹ̀lú ọ̀rọ̀-orúkọ ní genitive ń fi kókó ọ̀rọ̀ hàn, ‘nípa’; δέ jẹ́ àsopọ̀ níbí, a sì túmọ̀ rẹ̀ sí ‘àti.’ ‘Ìdájọ́’ ni ìtumọ̀ taara tí ó sì bá ìtẹ̀lé ‘ẹ̀ṣẹ̀… òdodo… ìdájọ́’ mu.
- source_word: ὅτι
  choice: nítorí
  rationale: ὅτι ń ṣàlàyé ìdí níbí; ‘nítorí’ mú agbára ìdí náà jáde ní Yorùbá àdánidá.
- source_word: ὁ ἄρχων
  choice: olórí
  rationale: ἄρχων tọ́ka sí ẹni tí ó ń ṣàkóso tàbí tí ó ní àṣẹ. ‘Olórí’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, láìfi ipò ọmọ ọba kún un.
- source_word: τοῦ κόσμου τούτου
  choice: ayé yìí
  rationale: Nínú Jòhánù, κόσμος sábà máa ń tọ́ka sí ayé tàbí ètò ayé tí ó yà sí Ọlọ́run. ‘Ayé yìí’ pa ìtumọ̀ Johannine àti ìṣètò gbólóhùn náà mọ́.
- source_word: κέκριται
  choice: a ti dá … lẹ́jọ́
  rationale: Kέκριται jẹ́ perfect passive indicative. Ìṣètò ‘a ti dá … lẹ́jọ́’ pa ohùn àìṣe-taara àti ìṣe tí ó ti ṣẹlẹ̀ mọ́, pẹ̀lú àbájáde tí ó dúró; kò sì dín ìtumọ̀ rẹ̀ kù sí ‘jẹ̀bi’ nìkan.
theological_decisions:
- issue: Ta ni ‘olórí ayé yìí,’ àti agbára ọ̀rọ̀ náà
  choice: A pa oyè náà mọ́ nínú ọ̀rọ̀ pàtàkì láìfi orúkọ Sátánì sí i.
  alternative: ‘Sátánì, olórí ayé yìí’
  rationale: Ọ̀rọ̀ náà nínú Jòhánù ni a sábà ń lóye pé ó ń tọ́ka sí Sátánì (wo Jòhánù 12:31; 14:30), ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ lo oyè náà, kì í ṣe orúkọ náà. Èyí pa ohun tí orísun sọ mọ́ láìyanju ohun tí ó fi sílẹ̀ fún àkópọ̀ ọ̀rọ̀.
- issue: Ìtumọ̀ κέκριται
  choice: ‘a ti dá … lẹ́jọ́’
  alternative: ‘a ti dá … lẹ́bi’ tàbí ‘ó dúró gẹ́gẹ́ bí ẹni tí a dá lẹ́bi’
  rationale: ‘Dá lẹ́jọ́’ pa àyè ìtumọ̀ κρίνω mọ́, nígbà tí ‘dá lẹ́bi’ yóò túmọ̀ rẹ̀ ní ọ̀nà tóóró sí ìdálẹ́bi, bí ó tilẹ̀ jẹ́ pé àkópọ̀ ọ̀rọ̀ lè tọ́ka sí àbájáde bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Ìṣètò ‘dá ẹni lẹ́jọ́’ jẹ́ àdánidá ju àfarawé gígùn ti passive Gíríìkì lọ, ṣùgbọ́n ó pa passive àti perfect force mọ́.
