  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: yo
  text: Mo jáde láti ọ̀dọ̀ Baba[a], mo sì ti wá sínú ayé. Mo tún ń fi ayé sílẹ̀, mo sì ń lọ sọ́dọ̀ Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo wá láti ọ̀dọ̀ Baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Mo jáde láti ọ̀dọ̀ Baba wá
  rationale: Ó pa ìṣípò láti ọ̀dọ̀ Baba mọ́, ó sì sọ ọ́ ní Yorùbá àdánidá láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: mo sì ti wá sínú ayé
  rationale: ‘Ti wá’ fi hàn pé wíwá náà ti ṣẹlẹ̀, ipa rẹ̀ sì ṣì wà; ‘sínú ayé’ tún pa ìtumọ̀ ìṣípò wọ inú mọ́.
- source_word: πάλιν
  choice: Mo tún
  rationale: ‘Tún’ so ìṣípò kejì pọ̀ mọ́ ti àkọ́kọ́, ó sì jẹ́ ọ̀nà àdánidá láti gbé πάλιν jáde ní Yorùbá.
- source_word: ἀφίημι τὸν κόσμον
  choice: ń fi ayé sílẹ̀
  rationale: Ìṣe tí ó ń bọ̀ láìpẹ́ ni ọ̀rọ̀ ìsinsìnyí tọ́ka sí ní àyíká yìí; ‘ń fi … sílẹ̀’ sọ èyí ní kedere.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: ń lọ sọ́dọ̀ Baba
  rationale: Ó fi ìṣípò tí ó dojú kọ Baba hàn ní Yorùbá tí ó rọrùn, láì fi ‘níwájú’ tàbí àlàyé mìíràn tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ Jésù pẹ̀lú Baba nínú gbólóhùn ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Mo jáde láti ọ̀dọ̀ Baba wá
  alternative: Mo ti ọ̀dọ̀ Baba wá
  rationale: Àṣàyàn náà pa ẹ̀rí ọ̀rọ̀ náà mọ́ pé orísun ìṣípò Jésù ni Baba àti pé ó ń padà sọ́dọ̀ Baba, ṣùgbọ́n kò ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àmì ohùn wà ní ibi tí ó bá ti jẹ́ àdánidá; ‘Baba’ àti ‘ayé’ bá ìlò Bíbélì Yorùbá tó wọ́pọ̀ mu.
