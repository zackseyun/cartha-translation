  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí ni mo ti sọ fún yín, kí ẹ má bàa kọsẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí a má mú yín kọsẹ̀,” “kí ẹ má ṣubú kúrò nínú ìgbàgbọ́,” tàbí “kí ẹ má bínú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé a mú ẹni kọsẹ̀, tàbí pé ẹni ṣubú débi tí yóò fi ṣáko kúrò nínú ìgbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Àwọn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nǹkan tí ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ń tọ́ka sí mọ́, ó sì ń tọ́ka sẹ́yìn sí àwọn ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: λελάληκα
  choice: ni mo ti sọ
  rationale: “Mo ti sọ” fi ìṣe pípé tí ipa rẹ̀ ṣì wà hàn ní Yorùbá àdánidá; fífi “ni” kún un tẹ ohun tí Jésù sọ tẹ́lẹ̀ mọ́lẹ̀.
- source_word: ὑμῖν
  choice: fún yín
  rationale: “Yín” fi hàn gbangba pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀.
- source_word: ἵνα μὴ
  choice: kí ẹ má bàa
  rationale: Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète ìkìlọ̀ àti dídènà ohun búburú hàn.
- source_word: σκανδαλισθῆτε
  choice: kọsẹ̀
  rationale: “Kọsẹ̀” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè dúró fún ìdènà tàbí ìṣubú tó lè mú kí ẹni yí kúrò nínú ìgbàgbọ́, láì fi ìtumọ̀ kan ṣoṣo lé ẹsẹ náà lórí.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλισθῆτε ní àyíká inúnibíni sí àwọn ọmọ-ẹ̀yìn
  choice: kọsẹ̀
  alternative: ṣubú kúrò nínú ìgbàgbọ́; mú wọn kọsẹ̀; bínú nítorí rẹ̀
  rationale: Àyíká ẹsẹ tó tẹ̀ lé e fi ewu pípa ìgbàgbọ́ tì hàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ tún ní àwòrán kíkòsẹ̀, ó sì jẹ́ fọ́ọ̀mù aláìṣe. “Kọsẹ̀” pa àwòrán àti ààyè ìtumọ̀ náà mọ́; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé bí ó ṣe lè jinlẹ̀ tó.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà rọrùn fún òǹkàwé gbogbo, ó sì pa ọ̀pọ̀ “àwọn nǹkan wọ̀nyí,” ipa pípé “mo ti sọ,” àti àìdánilójú tó wà nínú “kọsẹ̀” mọ́.
