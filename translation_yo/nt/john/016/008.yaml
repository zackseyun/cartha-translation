id: JHN.16.8
reference: John 16:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: yo
  text: Nígbà tí ẹni náà bá dé,[a][c] yóò fi ẹ̀bi ayé hàn nípa ẹ̀ṣẹ̀, nípa òdodo[b], àti nípa ìdájọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ó’; Gíríìkì lo ọ̀rọ̀ atọ́ka onítẹnumọ́, ‘ẹni náà,’ tí ó ń tọ́ka sí Olùrànlọ́wọ́ tí ń bọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ìdájọ́ òdodo,’ ní ìtumọ̀ justice; kì í ṣe ‘ìdájọ́’ tó tẹ̀ lé e nínú gbolóhùn náà.
    reason: alternative_reading
  - marker: c
    text: Tàbí, ‘Nígbà tí ó bá dé, ẹni náà yóò ...’
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθὼν
  choice: nígbà tí ... bá dé
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist yìí ní agbára àkókò; ọ̀nà yìí jẹ́ Yorùbá àdánidá fún ‘nígbà tí ó bá dé’ láì sọ ọ́ di gbólóhùn líle.
- source_word: ἐκεῖνος
  choice: Ẹni náà
  rationale: Ọ̀rọ̀ atọ́ka náà ní ìtẹnumọ́, ó sì ń tọ́ka sí Olùrànlọ́wọ́ inú àyíká ọ̀rọ̀. ‘Ẹni náà’ pa ìtẹnumọ́ náà mọ́ ju lílo ‘ó’ nìkan lọ.
- source_word: ἐλέγξει
  choice: yóò fi ẹ̀bi ... hàn
  rationale: 'ἐλέγχω níbí ní agbára ìwà rere àti ti ilé-ẹjọ́: fífi ẹ̀bi tàbí àṣìṣe hàn. Ọ̀rọ̀ yìí yẹra fún dídín ìtumọ̀ náà kù sí ‘dá lẹ́bi’ nìkan.'
- source_word: τὸν κόσμον
  choice: ayé
  rationale: ‘Ayé’ pa fífẹ̀ àti ìró ẹ̀kọ́ ìgbàgbọ́ ti κόσμος mọ́, láì fi ìtumọ̀ àlàyé bí ‘àwọn ènìyàn ayé’ sínú ọ̀rọ̀ náà.
- source_word: περὶ
  choice: nípa
  rationale: A tún un ṣe ní ẹ̀ẹ̀mẹ́ta láti pa ìbáradọ́gba ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ἁμαρτία; a pa ẹyọ ọ̀rọ̀ náà mọ́ bí ó ti rí ní Gíríìkì.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: ‘Òdodo’ bá ọ̀rọ̀ tí ẹsẹ tó tẹ̀ lé sọ nípa Jésù lílọ sọ́dọ̀ Baba mu, ó sì pa agbára ìwà rere àti ìbáṣepọ̀ títọ́ mọ́. ‘Ìdájọ́ òdodo’ jẹ́ àṣàyàn míì tí ó lè tẹnu mọ́ justice.
- source_word: κρίσεως
  choice: ìdájọ́
  rationale: ‘Ìdájọ́’ pa agbára ilé-ẹjọ́ àti ti ọjọ́ ìkẹyìn mọ́, láì dín un kù sí àbájáde kan ṣoṣo bí ‘ìdálẹ́bi.’
theological_decisions:
- issue: Ẹni tí ἐκεῖνος ń tọ́ka sí àti ìtẹnumọ́ rẹ̀
  choice: A túmọ̀ rẹ̀ sí ‘Ẹni náà,’ tó ń tọ́ka sí Ẹ̀mí/Olùrànlọ́wọ́, pẹ̀lú ìtẹnumọ́.
  alternative: A lè lo arọ́pò-orúkọ ‘ó’ nìkan.
  rationale: Àyíká ọ̀rọ̀ tó sún mọ́ ọn fi Olùrànlọ́wọ́ hàn gẹ́gẹ́ bí ẹni tí ń bọ̀. ‘Ẹni náà’ fi ìtẹnumọ́ Gíríìkì hàn láì ṣàfikún ẹ̀kọ́ ìgbàgbọ́ mìíràn.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Nínú àyíká ọ̀rọ̀ Jòhánù yìí, ‘òdodo’ bá àlàyé ẹsẹ 10 nípa Jésù lílọ sọ́dọ̀ Baba mu; àlàyé ìsàlẹ̀ pa agbára ‘justice’ mọ́ gẹ́gẹ́ bí àṣàyàn.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ẹni náà’ pa ìtẹnumọ́ mọ́; ‘fi ẹ̀bi ... hàn’ sọ agbára ἐλέγχω ní ọ̀nà tí òǹkàwé Yorùbá lè lóye láì mú un túmọ̀ sí ìdálẹ́bi nìkan.
