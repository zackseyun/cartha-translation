id: JHN.16.33
reference: John 16:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: yo
  text: Mo ti sọ àwọn nǹkan wọ̀nyí fún yín, kí ẹ lè ní àlàáfíà nínú mi. Nínú ayé ẹ ní ìpọ́njú[a]; ṣùgbọ́n ẹ mú ọkàn yín le[b]. Èmi ti ṣẹ́gun ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìnira,” “ìyà,” tàbí “wàhálà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ jẹ́ alágboyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ni, ó sì ń tọ́ka sí àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: λελάληκα
  choice: Mo ti sọ
  rationale: Ìlò ‘ti sọ’ fi hàn pé ọ̀rọ̀ náà ti ṣẹlẹ̀ tán, ṣùgbọ́n ipa rẹ̀ ṣì wà nísinsìnyí.
- source_word: ἵνα
  choice: kí
  rationale: ‘Kí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ète tàbí àfojúsùn hàn.
- source_word: ἐν ἐμοὶ
  choice: nínú mi
  rationale: Ó pa àwòrán pàtàkì ti Jòhánù mọ́, láì túmọ̀ rẹ̀ sí ọ̀nà kan ṣoṣo bí ‘nípasẹ̀ mi’.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: Ó sọ ìsinmi ọkàn àti ìwà pípé tí ẹni ní nínú ìbáṣepọ̀ rẹ̀ pẹ̀lú Jésù.
- source_word: ἐν τῷ κόσμῳ
  choice: Nínú ayé
  rationale: Ó pa ọ̀rọ̀ κόσμος mọ́ gẹ́gẹ́ bí ‘ayé,’ láì fi àlàyé ìtumọ̀ ẹ̀sìn kún un.
- source_word: θλῖψιν
  choice: ìpọ́njú
  rationale: ‘Ìpọ́njú’ mú èrò ìfúnpá, ìrora àti ìnira tó wà nínú ọ̀rọ̀ Gíríìkì náà jáde dáadáa.
- source_word: θαρσεῖτε
  choice: ẹ mú ọkàn le
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pè wọ́n sí ìgboyà àti ìgbẹ́kẹ̀lé ní àárín ìpọ́njú; ó jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: νενίκηκα
  choice: Èmi ti ṣẹ́gun
  rationale: ‘Ti ṣẹ́gun’ fi ìṣẹ́gun tí ó ti pé àti tí ipa rẹ̀ ṣì ń bá a lọ hàn; fífi ‘Èmi’ sílẹ̀ tún mú ìtẹnumọ́ ἐγώ jáde.
theological_decisions:
- issue: Ìtumọ̀ κόσμος nínú ọ̀rọ̀ Jòhánù
  choice: ayé
  alternative: ètò ayé tí ó lòdì sí Ọlọ́run
  rationale: ‘Ayé’ pa ìtumọ̀ ọlọ́pọ̀-ẹ̀ka ọ̀rọ̀ náà àti ìtakora láàárín wíwà ‘nínú mi’ àti wíwà ‘nínú ayé’ mọ́, láì dín un kù sí àlàyé ẹ̀kọ́ kan.
- issue: Agbára ọ̀rọ̀ perfect nínú λελάληκα àti νενίκηκα
  choice: ti sọ / ti ṣẹ́gun
  alternative: sọ / ṣẹ́gun
  rationale: Àmì ‘ti’ fi ìṣe tí ó ti ṣẹlẹ̀ tán ṣùgbọ́n tí àbájáde rẹ̀ ṣì wà hàn, pàápàá nínú ìkéde ìṣẹ́gun Jésù ṣáájú àgbélébùú nínú ìtàn náà.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῖν/ἔχετε ṣe ń tọ́ka sí àwọn ọmọ-ẹ̀yìn. Àwọn àmì ìsàlẹ̀ [a] àti [b] ni a so mọ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé; èyí tún àṣìṣe ìbámu àwọn àmì inú ẹ̀dà ìmọ̀ràn Gẹ̀ẹ́sì ṣe.
