  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: yo
  text: Ṣùgbọ́n nítorí pé mo ti sọ àwọn nǹkan wọ̀nyí fún yín, ìbànújẹ́ ti kún ọkàn yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ìbànújẹ́ ti kún ọkàn ọ̀kọ̀ọ̀kan yín.” Nínú Gíríìkì, “ọkàn” jẹ́ ẹyọ kan, ṣùgbọ́n “yín” jẹ́ ọ̀pọ̀; èyí lè ṣàfihàn ìbànújẹ́ inú tí gbogbo ẹgbẹ́ náà jọ ní.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tí ó ṣáájú, ó sì jẹ́ àsopọ̀ àdánidá ní Yorùbá.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń sọ ìdí tí ìbànújẹ́ fi dé bá àwọn ọmọ-ẹ̀yìn.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ demonstrative náà mọ́, ó sì tọ́ka sí àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: λελάληκα
  choice: mo ti sọ
  rationale: Àkókò perfect Gíríìkì tọ́ka sí ohun tí a ti sọ tí ipa rẹ̀ ṣì wà; ‘ti sọ’ mú èyí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti fi ẹni tí a bá sọ̀rọ̀ fún hàn; ‘yín’ tún pa ọ̀pọ̀ ènìyàn mọ́.
- source_word: ἡ λύπη
  choice: ìbànújẹ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìrora inú tàbí ìṣẹ́-ọkàn jíjinlẹ̀; ‘ìbànújẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ náà mu.
- source_word: πεπλήρωκεν
  choice: ti kún
  rationale: Ó pa àwòrán gangan ti ‘kíkún’ mọ́, kò sì túmọ̀ rẹ̀ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: ὑμῶν τὴν καρδίαν
  choice: ọkàn yín
  rationale: Gíríìkì ní arọ́pò-orúkọ ohun-ìní ọ̀pọ̀ pẹ̀lú ‘ọkàn’ ẹyọ kan. Yorùbá ‘ọkàn yín’ lè dúró fún ọkàn gbogbo ẹni tí a ń bá sọ̀rọ̀, ó sì pa ẹyọ náà mọ́ láìdá èdè rú.
theological_decisions:
- issue: ‘Ọkàn’ ẹyọ kan fún ẹgbẹ́ tàbí ‘ọkàn’ ọ̀kọ̀ọ̀kan wọn
  choice: ọkàn yín
  alternative: ọkàn ọ̀kọ̀ọ̀kan yín
  rationale: Ìkọ̀wé Gíríìkì lo ‘ọkàn’ ní ẹyọ kan pẹ̀lú ‘yín’ tí ó jẹ́ ọ̀pọ̀. A pa ìṣètò yìí mọ́ nínú àkọ́kọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ pínpín tó ṣeé ṣe hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá, tó sì rọrùn fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún, a sì pa àwòrán ‘ìbànújẹ́ kún ọkàn’ àti àìdánilójú ẹyọ/ọ̀pọ̀ inú Gíríìkì mọ́.
