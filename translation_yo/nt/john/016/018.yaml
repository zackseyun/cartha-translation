  to: Nítorí náà, wọ́n ń sọ pé, “Kí ni èyí tí ó ń sọ nípa ‘ní ìgbà díẹ̀’? A kò mọ ohun tí ó ń sọ.”
  rationale: The revision changes only the awkward quotation construction in the first question. It retains the ongoing/repeated sense of the imperfect, the discourse connection, the quoted temporal phrase, and the literal final statement of ignorance.
