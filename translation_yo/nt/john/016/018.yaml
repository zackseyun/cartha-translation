review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the imperfect ἔλεγον with wọ́n ń sọ, the discourse connective οὖν, the disciples’ two questions, and the direct sense of οὐκ οἴδαμεν τί λαλεῖ. However, the construction tí ó ń sọ pé, ‘Ní ìgbà díẹ̀’ is not a natural or precise way in Yoruba to identify the expression under question; pé normally introduces the content of what is said rather than marking the quoted expression as the object of their puzzlement.
  naturalness: The register and tone marking are generally good. Recasting the first question with nípa makes clear, in idiomatic modern Standard Yoruba, that the disciples are asking about Jesus’ expression “ní ìgbà díẹ̀.”
  terminology: No theological terminology occurs. Ní ìgbà díẹ̀ suitably conveys the elliptical temporal μικρόν (“a little while”) in this context. No footnote is needed in Yoruba for the English audit-trail alternative, since the revised wording does not create a lexical ambiguity requiring annotation.
  issues:
  - severity: medium
    issue: The phrase tí ó ń sọ pé, ‘Ní ìgbà díẹ̀’ is syntactically awkward and can construe the quotation simply as the asserted content rather than the phrase whose significance is being questioned.
    rationale: The Greek relative clause ὃ λέγει μικρόν identifies μικρόν as the expression the disciples do not understand. Yoruba tí ó ń sọ nípa ‘ní ìgbà díẹ̀’ expresses this relationship clearly without expanding the meaning into a doctrinal or explanatory paraphrase.
  revised_text: Nítorí náà, wọ́n ń sọ pé, “Kí ni èyí tí ó ń sọ nípa ‘ní ìgbà díẹ̀’? A kò mọ ohun tí ó ń sọ.”
