source:
  edition: SBLGNT
  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: yo
  text: Nítorí náà, wọ́n ń sọ pé, “Kí ni èyí tí ó ń sọ nípa ‘ní ìgbà díẹ̀’? A kò mọ ohun tí ó ń sọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; ‘wọ́n ń sọ’ mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè àwọn ọmọ-ẹ̀yìn pọ̀ mọ́ ọ̀rọ̀ tí ó ṣáájú, ó sì fi àbájáde tàbí ìtẹ̀síwájú ìjíròrò hàn.
- source_word: Τί ἐστιν τοῦτο
  choice: Kí ni èyí
  rationale: Èyí tẹ̀lé ìbéèrè Gíríìkì ní tààrà, ó sì pa ìdàrúdàpọ̀ àwọn ọmọ-ẹ̀yìn mọ́ láì túmọ̀ ọ́ sí ‘Kí ni ìtumọ̀ èyí?’
- source_word: ὃ λέγει μικρόν
  choice: tí ó ń sọ pé, ‘Ní ìgbà díẹ̀’
  rationale: Ó pa gbólóhùn μικρόν mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tí wọ́n ń tọ́ka sí, bí ó ti rí nínú orísun.
- source_word: μικρόν
  choice: Ní ìgbà díẹ̀
  rationale: Nínú àyíká yìí, μικρόν ń tọ́ka sí àkókò kúkúrú; ‘ní ìgbà díẹ̀’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá àyíká mu.
- source_word: οὐκ οἴδαμεν
  choice: A kò mọ
  rationale: Ó túmọ̀ ìkọ̀ tí ó wà pẹ̀lú οἶδα ní tààrà, ní ìforúkọsílẹ̀ Yorùbá tí ó yẹ fún Ìwé Mímọ́.
- source_word: τί λαλεῖ
  choice: ohun tí ó ń sọ
  rationale: Ó mú ìṣe sísọ inú λαλεῖ jáde ní tààrà, láì fi ìtumọ̀ àlàyé bí ‘ohun tí ó túmọ̀ sí’ kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. Ìtẹ̀sí imperfect ni a fi ‘ń sọ’ hàn, a sì pa ìbéèrè orísun mọ́ láì ṣàlàyé rẹ̀ ju bó ṣe wà lọ.
