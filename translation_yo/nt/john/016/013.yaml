id: JHN.16.13
reference: John 16:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ẹni náà, Ẹ̀mí òtítọ́, bá dé, yóò tọ́ yín sínú gbogbo òtítọ́.[a] Nítorí kì yóò sọ̀rọ̀ láti ara rẹ̀,[b] ṣùgbọ́n ohunkóhun tí ó bá gbọ́ ni yóò sọ; yóò sì kéde àwọn ohun tí ń bọ̀ fún yín.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “nínú gbogbo òtítọ́.” Gíríìkì ní ἐν, èyí tí ó sábà máa ń túmọ̀ sí “nínú,” ṣùgbọ́n pẹ̀lú ọ̀rọ̀-ìṣe “tọ́,” ó lè fi ìdarí sínú ohun kan hàn.
    reason: alternative_reading
  - marker: b
    text: Ìtumọ̀ mìíràn ni, “ní agbára tirẹ̀” tàbí “nípa ìfẹ́ tirẹ̀.” Ní ti gangan, Gíríìkì sọ pé, “láti ara rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ìtumọ̀ mìíràn ni, “àwọn ohun tí yóò ṣẹlẹ̀” tàbí “ohun tí ń bọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí ... bá
  rationale: “Nígbà tí ... bá” fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí ὅταν ń tọ́ka sí hàn lọ́nà Yorùbá àdánidá; “Ṣùgbọ́n” sì gbé ìyàtọ̀ pẹ̀lẹ́ tí δέ ní nínú àyíká ọ̀rọ̀ náà.
- source_word: ἔλθῃ ἐκεῖνος
  choice: ẹni náà ... bá dé
  rationale: “Ẹni náà” pa ìtẹnumọ́ ἐκεῖνος àti ìtọ́ka rẹ̀ sí ẹni mọ́; “bá dé” jẹ́ ọ̀nà Yorùbá àdánidá fún aorist subjunctive lẹ́yìn ὅταν.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Ẹ̀mí òtítọ́
  rationale: A pa àkójọpọ̀ genitive náà mọ́ gẹ́gẹ́ bí orúkọ ìdánimọ̀ Johanu, láì túmọ̀ rẹ̀ sí “Ẹ̀mí tí í ṣe òtítọ́.”
- source_word: ὁδηγήσει ὑμᾶς
  choice: yóò tọ́ yín
  rationale: “Tọ́” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún dídarí tàbí fífi ọ̀nà han, ó sì ṣiṣẹ́ dáadáa nínú ìtumọ̀ àpẹẹrẹ níbí.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: sínú gbogbo òtítọ́
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe “tọ́,” “sínú” sọ ìdarí sí ibi àfojúsùn náà ní Yorùbá àdánidá. “Gbogbo òtítọ́” pa ìtumọ̀ πάσῃ àti àfojúsùn pàtó ti article náà mọ́.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: Nítorí kì yóò sọ̀rọ̀ láti ara rẹ̀
  rationale: Ìtumọ̀ yìí tẹ̀ lé àwòrán orísun tàbí ìpilẹ̀ tó wà nínú ἀφ’ ἑαυτοῦ, kò sì fi “ní agbára tirẹ̀” kún un nínú àkọ́kọ́.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: ṣùgbọ́n ohunkóhun tí ó bá gbọ́ ni yóò sọ
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì tẹnumọ́ pé ohun tí ó gbọ́ ni yóò sọ, bí ìyàtọ̀ ἀλλά ṣe ń béèrè.
- source_word: τὰ ἐρχόμενα
  choice: àwọn ohun tí ń bọ̀
  rationale: Ó pa present participle náà mọ́ gẹ́gẹ́ bí àwọn ohun tàbí ìṣẹ̀lẹ̀ tó ń bọ̀, láì dín ìtumọ̀ rẹ̀ kù sí àsọtẹ́lẹ̀ kan pàtó.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: yóò sì kéde ... fún yín
  rationale: “Kéde ... fún yín” gbé ìtumọ̀ sísọ ohun kan di mímọ̀ fún àwọn olùgbọ́ jáde, ó sì ní ìwọ̀ntúnwọ̀nsì tó yẹ fún ọ̀rọ̀ ìṣípayá.
theological_decisions:
- issue: Ìtọ́ka sí Ẹ̀mí gẹ́gẹ́ bí ẹni
  choice: Lo “ẹni náà” fún ἐκεῖνος, kí ìtọ́ka sí Ẹ̀mí gẹ́gẹ́ bí ẹni hàn gbangba.
  alternative: Yẹra fún ọ̀rọ̀ arọ́pò-orúkọ nípa fífi “Ẹ̀mí òtítọ́” nìkan sí ibẹ̀.
  rationale: Gíríìkì fúnra rẹ̀ lo demonstrative akọ ἐκεῖνος lẹ́gbẹ̀ẹ́ neuter πνεῦμα. “Ẹni náà” pa ìtẹnumọ́ àti ìtọ́ka ẹni yìí mọ́ láì gbé ẹ̀kọ́ ìjọ kan wọlé.
- issue: Ìtumọ̀ ἐν τῇ ἀληθείᾳ πάσῃ
  choice: “sínú gbogbo òtítọ́” nínú àkọ́kọ́
  alternative: “nínú gbogbo òtítọ́”
  rationale: ἐν lè túmọ̀ sí “nínú,” ṣùgbọ́n pẹ̀lú ὁδηγέω, ọ̀rọ̀ náà lè ní agbára ìdarí sí ibi kan. “Sínú” jẹ́ àdánidá pẹ̀lú “tọ́” ní Yorùbá, a sì pa ìtumọ̀ tó sún mọ́ fọ́ọ̀mù Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìgbẹ́kẹ̀lé tí ἀφ’ ἑαυτοῦ ń fi hàn
  choice: “láti ara rẹ̀”
  alternative: “ní agbára tirẹ̀” tàbí “nípa ìfẹ́ tirẹ̀”
  rationale: Àkọ́kọ́ pa ìbáṣepọ̀ orísun tó wà nínú ẹsẹ náà mọ́, kò sì yan bóyá ọ̀rọ̀ náà ń tọ́ka sí àṣẹ, ìfẹ́, tàbí ìdásílẹ̀ ọ̀rọ̀ fúnra ẹni.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún olùkà òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìṣètò “ẹni náà, Ẹ̀mí òtítọ́” pa apposition àti ìtẹnumọ́ Gíríìkì mọ́, nígbà tí gbolohun náà ṣì ń ṣàn dáadáa ní Yorùbá.
