id: JHN.16.25
reference: John 16:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: yo
  text: “Mo ti sọ àwọn nǹkan wọ̀nyí fún yín ní ọ̀nà àfiwé[a]. Àkókò kan ń bọ̀[b] tí èmi kì yóò tún bá yín sọ̀rọ̀ ní ọ̀nà àfiwé mọ́; ṣùgbọ́n èmi yóò sọ fún yín ní kedere[c] nípa Baba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní òwe” tàbí “ní ọ̀nà ọ̀rọ̀ tí ìtumọ̀ rẹ̀ fara sin”; ọ̀rọ̀ Gíríìkì níbí tọ́ka sí ọ̀rọ̀ àfiwé tàbí ọ̀rọ̀ tí a kò sọ ní tààrà.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “Wákàtí kan ń bọ̀.” Johanu sábà máa ń lo “wákàtí” lọ́nà tí ó ní ìtumọ̀ pàtàkì.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ní gbangba” tàbí “láìfi ọ̀rọ̀ pamọ́”; níbí, ìtumọ̀ náà ni sísọ̀rọ̀ tààrà, kì í ṣe ní ọ̀nà àfiwé.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: ní ọ̀nà àfiwé
  rationale: Nínú ìlò Johanu, ọ̀rọ̀ náà tọ́ka sí ọ̀rọ̀ tí a sọ lọ́nà àfiwé tàbí lọ́nà tí ìtumọ̀ rẹ̀ kò hàn gbangba, kì í ṣe òwe tàbí àkàwé gígùn nìkan. ‘Ní ọ̀nà àfiwé’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́.
- source_word: λελάληκα
  choice: Mo ti bá yín sọ̀rọ̀
  rationale: ‘Mo ti … sọ̀rọ̀’ fi ìṣe tí ó ti ṣẹlẹ̀ tí ó sì ṣì ní ìbáṣepọ̀ pẹ̀lú àsìkò yìí hàn, ó sì pa ìbámu pẹ̀lú λαλήσω mọ́.
- source_word: ἔρχεται ὥρα
  choice: Àkókò kan ń bọ̀
  rationale: Ní Yorùbá, ‘àkókò kan ń bọ̀’ jẹ́ ọ̀nà àdánidá láti sọ àsìkò tí ń bọ̀. Àfikún ìsàlẹ̀ ojú ìwé pa àṣà Johanu ti lílo ‘wákàtí’ pẹ̀lú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
- source_word: οὐκέτι
  choice: kì yóò … mọ́
  rationale: Ìṣètò ‘kì yóò … mọ́’ ni ọ̀nà Yorùbá àdánidá àti pípé fún ìtumọ̀ ‘kò ní ṣe bẹ́ẹ̀ mọ́.’
- source_word: λαλήσω
  choice: bá yín sọ̀rọ̀
  rationale: Ó pa ìbámu ọ̀rọ̀ mọ́ pẹ̀lú λελάληκα, ó sì mú ìbánisọ̀rọ̀ sí àwọn ọmọ-ẹ̀yìn hàn.
- source_word: παρρησίᾳ
  choice: ní kedere
  rationale: Níbí, ọ̀rọ̀ náà dúró ní ìtakò sí ọ̀nà àfiwé; ‘ní kedere’ mú ọ̀rọ̀ tààrà tí kò fi ìtumọ̀ pamọ́ hàn, dípò ìgboyà ní gbangba.
- source_word: ἀπαγγελῶ
  choice: èmi yóò sọ … fún yín
  rationale: Àrọ́pò-orúkọ ‘èmi’ fúnni ní ìtẹnumọ́ àdánidá lẹ́yìn ìtakò ἀλλά, ‘sọ … fún yín’ sì bá ìkéde tààrà nípa Baba mu.
- source_word: περὶ τοῦ πατρὸς
  choice: nípa Baba
  rationale: ‘Nípa Baba’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa ìtumọ̀ ìbáṣepọ̀ àti ẹ̀kọ́ ìgbàgbọ́ ti πατήρ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ὥρα nínú àyíká ọ̀rọ̀ Johanu
  choice: Àkókò kan ń bọ̀
  alternative: Wákàtí kan ń bọ̀
  rationale: ‘Àkókò kan’ ṣe àdánidá ní Yorùbá, kò sì sọ pé wákàtí gangan ni; àfikún [b] jẹ́ kí òǹkàwé mọ̀ pé ‘wákàtí’ ni ọ̀rọ̀ Gíríìkì, èyí tí Johanu sábà máa ń lò pẹ̀lú ìtumọ̀ pàtàkì.
- issue: Ìtumọ̀ παρρησίᾳ ní ìtakò sí ἐν παροιμίαις
  choice: ní kedere
  alternative: ní gbangba; láìfi ọ̀rọ̀ pamọ́
  rationale: Ìtakò inú ẹsẹ̀ náà jẹ́ láàárín ọ̀rọ̀ àfiwé tàbí ọ̀rọ̀ tí kò ṣe kedere àti ìṣípayá tààrà. ‘Ní kedere’ pa ìtakò yẹn mọ́ láìfi ẹ̀kọ́ míì nípa ìgboyà tàbí ìkéde ní gbangba kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo ‘bá yín sọ̀rọ̀’ fún ìbánisọ̀rọ̀ àdánidá, ‘Baba’ sì dúró gẹ́gẹ́ bí orúkọ ìbáṣepọ̀ pàtàkì nínú àyíká ọ̀rọ̀ Johanu. Gbogbo àmì ìsàlẹ̀ ojú ìwé [a], [b], [c] wà nínú ọ̀rọ̀ pàtàkì ní ibi tí ó yẹ.
