id: JHN.16.17
reference: John 16:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: yo
  text: 'Nítorí náà, àwọn kan lára àwọn ọmọ ẹ̀yìn rẹ̀ sọ fún ara wọn pé, “Kí ni ohun tí ó ń sọ fún wa yìí: ‘Ní ìgbà díẹ̀, ẹ̀yin kì yóò rí mi mọ́; ní ìgbà díẹ̀ mìíràn, ẹ̀yin yóò sì rí mi’? Àti pé, ‘Nítorí[a] mo ń lọ sọ́dọ̀ Baba’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àti pé, ‘Mo ń lọ sọ́dọ̀ Baba.’” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè fi àkóónú ohun tí a sọ hàn, tàbí kí ó ní ìtumọ̀ ìdí, “nítorí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ àwọn ọmọ ẹ̀yìn náà jẹ́ àbájáde ohun tí Jésù ṣẹ̀ṣẹ̀ sọ, ó sì bá ìṣàn ìtàn mu ní Yorùbá.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: àwọn kan lára àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: Ìtumọ̀ apá kan nínú gbogbo wọn ni ἐκ ń fúnni; kì í ṣe gbogbo àwọn ọmọ ẹ̀yìn náà ni a sọ pé wọ́n bá ara wọn sọ̀rọ̀.
- source_word: πρὸς ἀλλήλους
  choice: sọ fún ara wọn
  rationale: Ó ṣàfihàn ìjíròrò láàárín wọn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Kí ni ohun tí ó ń sọ fún wa yìí
  rationale: Ó dúró sítòsí ìṣètò Gíríìkì, ó sì pa ìdàrúdàpọ̀ àwọn ọmọ ẹ̀yìn mọ́ láì fi ìtumọ̀ àsọyé kún un.
- source_word: Μικρὸν
  choice: Ní ìgbà díẹ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àkókò kúkúrú; èyí jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: θεωρεῖτέ
  choice: rí
  rationale: Nínú àyíká yìí, ó ní ìtumọ̀ rírí tàbí kíyèsí; ‘rí’ ṣe kedere, ó sì jẹ́ kí àtúnṣe ọ̀rọ̀ inú gbólóhùn náà dúró.
- source_word: ὄψεσθέ
  choice: ẹ̀yin yóò rí
  rationale: Ó jẹ́ ọ̀rọ̀ ọjọ́ iwájú fún rírí. Lílo ‘rí’ fún àwọn ọ̀rọ̀ Gíríìkì méjèèjì pa ìbáramu àti àtúnṣe àsọyé mọ́.
- source_word: πάλιν
  choice: sí i
  rationale: Nínú ‘ní ìgbà díẹ̀ sí i,’ ó sọ pé lẹ́yìn àkókò kúkúrú mìíràn ni wọ́n yóò tún rí i; èyí jẹ́ ọ̀nà Yorùbá tó lọ́nà.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Nítorí mo ń lọ sọ́dọ̀ Baba
  rationale: ὅτι lè ní agbára ìdí, ‘nítorí,’ nínú àyíká yìí. Bí ó tilẹ̀ jẹ́ pé ó tún lè ṣàgbékalẹ̀ ohun tí a sọ pé ‘pé,’ a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: πατέρα
  choice: Baba
  rationale: Gíríìkì ní ‘Baba,’ kì í ṣe ‘Baba mi’; a kò fi ọ̀rọ̀ ohun-ìní tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ohun tí lílọ Jésù àti rírí rẹ̀ lẹ́ẹ̀kan sí i ń tọ́ka sí
  choice: A kò sọ pàtó ohun tí ọ̀rọ̀ náà ń tọ́ka sí; a pa ìdàrúdàpọ̀ àwọn ọmọ ẹ̀yìn mọ́.
  alternative: Ikú àti àjíǹde; ìgòkè re ọ̀run àti wíwà nípa Ẹ̀mí; tàbí ìfarahàn lẹ́yìn àjíǹde.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò tú ìtumọ̀ náà; ó ń fi ìbéèrè àwọn ọmọ ẹ̀yìn hàn. Nítorí náà, ìtumọ̀ kò gbọ́dọ̀ yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ní ìkọ̀kọ̀.
- issue: Agbára ὅτι nínú gbólóhùn ìkẹyìn
  choice: 'A túmọ̀ ọ́ ní agbára ìdí: ‘Nítorí mo ń lọ sọ́dọ̀ Baba.’'
  alternative: 'Ọ̀rọ̀ tó ṣàgbékalẹ̀ àkóónú àsọyé: ‘Pé mo ń lọ sọ́dọ̀ Baba.’'
  rationale: Àwọn ìtumọ̀ méjèèjì ṣeé ṣe gẹ́gẹ́ bí Gíríìkì; a yan agbára ìdí sínú ọ̀rọ̀ pàtàkì, a sì fi èkejì sí àlàyé ìsàlẹ̀ láti pa àìdánilójú ojúlówó mọ́.
translation_notes:
  register: Yorùbá àkọ́ṣe, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìbéèrè àti ìdàrúdàpọ̀ inú orísun mọ́.
