revisions:
- from: 'Nítorí náà, àwọn kan lára àwọn ọmọ ẹ̀yìn rẹ̀ sọ fún ara wọn pé, “Kí ni ohun tí ó ń sọ fún wa yìí: ‘Ní ìgbà díẹ̀, ẹ̀yin kì yóò rí mi mọ́; ní ìgbà díẹ̀ sí i, ẹ̀yin yóò sì rí mi’? Àti pé, ‘Nítorí mo ń lọ sọ́dọ̀ Baba’?”[a]'
  to: 'Nítorí náà, àwọn kan lára àwọn ọmọ ẹ̀yìn rẹ̀ sọ fún ara wọn pé, “Kí ni ohun tí ó ń sọ fún wa yìí: ‘Ní ìgbà díẹ̀, ẹ̀yin kì yóò rí mi mọ́; ní ìgbà díẹ̀ mìíràn, ẹ̀yin yóò sì rí mi’? Àti pé, ‘Nítorí[a] mo ń lọ sọ́dọ̀ Baba’?”'
  rationale: The revision retains the source’s ambiguity and all major lexical choices. It makes the iterative force of πάλιν explicit, moves the footnote anchor to ὅτι/Nítorí, and clarifies the footnote’s grammatical explanation.
