id: JHN.7.37
reference: John 7:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: yo
  text: Ní ọjọ́ ìkẹyìn, ọjọ́ ńlá àjọ̀dún náà, Jésù dúró, ó sì ké jáde pé, “Bí ẹnikẹ́ni bá ńgbẹ, kí ó wá sọ́dọ̀ mi, kí ó sì mu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: Ní ọjọ́ ìkẹyìn
  rationale: “Ní” fi àkókò hàn ní Yorùbá, “ọjọ́ ìkẹyìn” sì túmọ̀ gbolohun náà lọ́nà tààrà láìfi ìtumọ̀ nípa ọjọ́ ìkẹyìn ayé kún un. A kò túmọ̀ δέ lọ́tọ̀ nítorí pé ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ìṣàn ọ̀rọ̀ Yorùbá ti gbé.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: ọjọ́ ńlá àjọ̀dún náà
  rationale: “Ọjọ́ ńlá” pa ìtẹnumọ́ μέγας mọ́, “àjọ̀dún náà” sì tọ́ka sí àjọ̀dún tí àyíká ọ̀rọ̀ ti sọ tẹ́lẹ̀.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: Jésù dúró
  rationale: “Dúró” sọ ìdúró Jésù ní gbangba, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ nínú ìtàn Yorùbá.
- source_word: ἔκραξεν λέγων
  choice: ó sì ké jáde pé
  rationale: “Ké jáde” fi ohùn gíga àti ìkéde gbangba hàn; “pé” ni ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ó tẹ̀ lé e.
- source_word: Ἐάν τις διψᾷ
  choice: Bí òùngbẹ bá ń gbẹ ẹnikẹ́ni
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ àti tó ṣe kedere fún jíjẹ́ òùngbẹ; “ẹnikẹ́ni” pa ìtumọ̀ àìdá ẹni kan pàtó ti τις mọ́.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: kí ó wá sọ́dọ̀ mi, kí ó sì mu
  rationale: Àwọn gbólóhùn méjèèjì pẹ̀lú “kí ó” pa agbára àwọn àṣẹ ìpè present imperative mọ́, “sọ́dọ̀ mi” sì jẹ́ Yorùbá àdánidá fún πρός με.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ òùngbẹ àti mímu
  choice: Pa àwòrán náà mọ́ gẹ́gẹ́ bí “òùngbẹ” àti “mu” láìṣàlàyé rẹ̀ nínú ẹsẹ̀.
  alternative: Túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí ìfẹ́ ìyè, ìgbàgbọ́, tàbí gbígba Ẹ̀mí.
  rationale: Ọ̀rọ̀ Gíríìkì fi àwòrán ìpè sí mímu hàn, àyíká ọ̀rọ̀ sì ń mú ìtumọ̀ rẹ̀ gbilẹ̀. Ṣíṣàlàyé rẹ̀ nínú ẹsẹ̀ yóò yanjú ohun tí ọ̀rọ̀ náà mọ̀ọ́mọ̀ fi sílẹ̀ fún àyíká rẹ̀.
- issue: Ìtọ́kasí ẹnì kọ̀ọ̀kan nínú τις àti àwọn àṣẹ ẹyọ
  choice: Lo “ẹnikẹ́ni” àti arọ́pò-orúkọ ẹyọ “ó.”
  alternative: Lo ọ̀rọ̀ tí yóò fi akọ tàbí abo hàn ní pàtó.
  rationale: Yorùbá “ó” kò fi akọ tàbí abo hàn, ṣùgbọ́n ó jẹ́ ẹyọ, nítorí náà ó pa gírámà ẹyọ àti ìpè tó kan gbogbo ènìyàn mọ́ láìfi ìbálòpọ̀ tí kò sí nínú ìtumọ̀ τις kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. “Àjọ̀dún” àti “ké jáde” bá ìṣẹ̀lẹ̀ ìkéde gbangba mu, a sì pa àwòrán òùngbẹ àti mímu mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
