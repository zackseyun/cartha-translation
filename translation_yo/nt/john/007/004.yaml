source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: yo
  text: Nítorí kò sí ẹni tí ó ń ṣe ohunkóhun ní ìkọ̀kọ̀, tí òun fúnra rẹ̀ sì ń fẹ́ kí a mọ̀ òun ní gbangba. Bí ìwọ bá ń ṣe àwọn nǹkan wọ̀nyí, fi ara rẹ hàn sí ayé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí òun wà ní gbangba.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ṣíṣí síta tàbí jíjẹ́ ẹni tí a mọ̀ ní gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Nítorí kò sí ẹni
  rationale: Ó pa agbára ìṣàlàyé γάρ mọ́, ó sì tú οὐδεὶς sí Yorùbá àdánidá.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: ń ṣe ohunkóhun ní ìkọ̀kọ̀
  rationale: “Ohunkóhun” dúró fún τι, “ní ìkọ̀kọ̀” sì fi èrò ohun tí a fi pamọ́ hàn.
- source_word: καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: tí òun fúnra rẹ̀ sì ń fẹ́ kí gbogbo ènìyàn rí òun
  rationale: “Òun fúnra rẹ̀” pa ìtẹnumọ́ αὐτός mọ́; gbolohun yìí sọ ìfarahàn ní gbangba ní Yorùbá àdánidá láì yí i sí ọ̀rọ̀ ìgboyà.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Bí ìwọ bá ń ṣe àwọn nǹkan wọ̀nyí
  rationale: Ó pa ipò àídájú εἰ mọ́, ìtẹnumọ́ “ìwọ” sì bá ọ̀rọ̀ tí àwọn arákùnrin ń sọ sí Jesu mu.
- source_word: φανέρωσον σεαυτὸν
  choice: fi ara rẹ hàn
  rationale: Àṣẹ tààrà yìí pa èrò ìfarahàn gbangba àti agbára aorist imperative mọ́.
- source_word: τῷ κόσμῳ
  choice: sí ayé
  rationale: “Ayé” ni ìtumọ̀ Yorùbá tó bójú mu fún κόσμος, ó sì pa ìṣọ̀kan ọ̀rọ̀ pàtàkì yìí nínú Jòhánù mọ́.
theological_decisions:
- issue: Ìtumọ̀ κόσμος nínú àyíká ọ̀rọ̀ Jòhánù
  choice: ayé
  alternative: gbogbo ènìyàn / gbangba
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà dá lórí ìfarahàn gbangba níbí, “ayé” pa ìró ìwé Jòhánù àti àìdánilójú ìtumọ̀ tó lè wà nínú κόσμος mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì. A lo “òun fúnra rẹ̀” láti pa ìtẹnumọ́ αὐτός mọ́, a sì lo “kí gbogbo ènìyàn rí òun” gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìfarahàn ní gbangba.
