  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: yo
  text: Nígbà tí àjọyọ̀ náà ti dé àárín[a], Jésù gòkè lọ sí tẹ́ńpìlì[b], ó sì ń kọ́ni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí àjọyọ̀ náà wà ní àárín.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἱερόν níbí ń tọ́ka sí gbogbo àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: cultural_note
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà wà ní ìrísí imperfect, èyí tí ó lè tẹnu mọ́ pé iṣẹ́ kíkọ́ni Jésù ń lọ lọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: ti dé
  rationale: Àpẹẹrẹ ọ̀rọ̀ ‘ti’ nínú gbólóhùn ‘ti dé ìdajì’ fi hàn pé àkókò yẹn ti dé nígbà tí ìṣẹ̀lẹ̀ náà ṣẹlẹ̀, láìfi ọ̀rọ̀ àsopọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: δὲ
  choice: asẹ̀yìn ìtàn tí kò ní ọ̀rọ̀ àsopọ̀ pàtó
  rationale: δὲ jẹ́ ìyípadà ìtàn kékeré, kì í ṣe ìtakora líle. Ìṣètò gbólóhùn Yorùbá náà ń gbé ìtàn lọ lọ́nà àdánidá láìfi ‘ṣùgbọ́n’ tàbí ọ̀rọ̀ míì tí yóò mú ìtumọ̀ lágbára ju bó ṣe yẹ lọ.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: Nígbà tí àjọ̀dún náà ti dé ìdajì
  rationale: Èyí túmọ̀ genitive absolute gẹ́gẹ́ bí ipò àkókò, ó sì fi hàn pé àjọ̀dún náà ti dé àárín rẹ̀. Àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀nà ìtumọ̀ ‘wà ní àárín’ mọ́.
- source_word: ἀνέβη
  choice: gòkè lọ
  rationale: Ó pa ìtọ́sọ́nà ‘lọ sókè’ tí ἀναβαίνω ní mọ́, gẹ́gẹ́ bí lílọ sí Jerúsálẹ́mù àti sí tẹ́ńpìlì.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ọ̀nà ìkọ orúkọ náà tí ó wọ́pọ̀ tí ó sì ṣe kedere ní Yorùbá.
- source_word: εἰς τὸ ἱερόν
  choice: sí tẹ́ńpìlì
  rationale: ‘Tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀. ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; àlàyé ìsàlẹ̀ ojú ìwé mú ìyàtọ̀ yìí ṣe kedere.
- source_word: ἐδίδασκεν
  choice: ó sì ń kọ́ni
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń bá a lọ ní àkókò àtijọ́ hàn, ó sì bá imperfect Gíríìkì mu láìfi ìtumọ̀ pé ó ‘bẹ̀rẹ̀’ sí i kún un.
theological_decisions:
- issue: Ohun tí ἱερόν ń tọ́ka sí
  choice: tẹ́ńpìlì, pẹ̀lú àlàyé pé ó túmọ̀ sí àgbègbè tàbí àwọn àgbàlá tẹ́ńpìlì
  alternative: ibi mímọ́ inú tẹ́ńpìlì
  rationale: 'ἱερόν yàtọ̀ sí ναός: ó ń tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú ilé náà nìkan. Yíyan èyí kò gbé ẹ̀kọ́ ìjọ kan ga ju òmíràn lọ.'
- issue: Bí a ṣe ń fi imperfect ἐδίδασκεν hàn
  choice: ó sì ń kọ́ni
  alternative: ó sì bẹ̀rẹ̀ sí í kọ́ni
  rationale: Imperfect náà lè tẹnu mọ́ ìṣe tí ó ń bá a lọ; ọ̀rọ̀ Gíríìkì kò sọ ní pàtó pé ìṣe náà ṣẹ̀ṣẹ̀ bẹ̀rẹ̀, nítorí náà a kò fi ìtumọ̀ inceptive kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. ‘Àjọ̀dún’ àti ‘tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Bíbélì Yorùbá mọ̀ dáadáa; ìṣètò ‘ó sì ń kọ́ni’ jẹ́ ti Yorùbá àdánidá, ó sì pa ìṣe tí ń bá a lọ mọ́.
