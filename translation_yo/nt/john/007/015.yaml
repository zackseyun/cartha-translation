source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: yo
  text: Nítorí náà, ẹnu ń yà àwọn Júù[b], wọ́n sì ń sọ pé, “Báwo ni ọkùnrin yìí ṣe mọ ìwé[a] láì kọ́ ẹ̀kọ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo ni ọkùnrin yìí ṣe ní ìmọ̀-ẹ̀kọ́ bẹ́ẹ̀?” Ní èdè Gíríìkì, “mọ lẹ́tà.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Johanu, “àwọn Júù” níhìn-ín ń tọ́ka, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn, sí àwọn Júù tí Jésù ń bá sọ̀rọ̀ tàbí tí wọ́n ń tako ní Jerúsálẹ́mù; ó ṣeé ṣe kí àwọn aṣáájú Júù ní ilẹ̀ Jùdíà wà lára wọn. Kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: ẹnu ń ya
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyàlẹ́nu; àmì ìṣe ‘ń’ tún fi ipò ìṣe aláìparí nínú ọ̀rọ̀ Gíríìkì hàn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìhùwàpadà yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú àyíká ọ̀rọ̀.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ taara ti gbólóhùn Johanu; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ní àyíká yìí láì dín ìtumọ̀ ọ̀rọ̀ Gíríìkì kù nínú ẹsẹ̀ náà.
- source_word: λέγοντες
  choice: wọ́n sì ń sọ pé
  rationale: Ó mú àkópọ̀ aláìparí tó ń ṣáájú ọ̀rọ̀ tààrà jáde ní Yorùbá àdánidá.
- source_word: Πῶς
  choice: Báwo ni ... ṣe
  rationale: Èyí ni ìṣètò ìbéèrè Yorùbá àdánidá fún bí ohun kan ṣe rí tàbí ṣe wáyé.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó ṣe àfihàn ‘ẹni yìí’ ní ọ̀nà tó bójú mu, ó sì pa ìjìnnà díẹ̀ tó wà nínú ọ̀rọ̀ ìpilẹ̀ mọ́.
- source_word: γράμματα
  choice: ìwé
  rationale: Nínú àkópọ̀ ‘mọ ìwé,’ ọ̀rọ̀ yìí lè túmọ̀ sí mímọ̀ọ́kọ-mọ̀ọ́kà tàbí níní ẹ̀kọ́; ó pa ìtumọ̀ tó fẹ̀ gbooro ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οἶδεν
  choice: mọ
  rationale: ‘Mọ’ bá agbára ìṣe onípò ti οἶδα mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó péye.
- source_word: μὴ μεμαθηκώς
  choice: láì kọ́ ẹ̀kọ́
  rationale: Ó sọ pé ẹni náà kò gba ìkẹ́kọ̀ọ́ tí a retí, láì fi irú ilé-ẹ̀kọ́ tàbí ètò ìkọ́ni kan pàtó kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Johanu 7:15
  choice: àwọn Júù
  alternative: àwọn aṣáájú Júù; àwọn ará Jùdíà
  rationale: A pa ọ̀rọ̀ Gíríìkì tó gbooro mọ́ nínú ẹsẹ̀ náà, ṣùgbọ́n àlàyé ṣíṣe kedere pé nínú àyíká yìí kò tọ́ka sí gbogbo àwọn Júù gẹ́gẹ́ bí ẹ̀yà kan.
translation_notes:
  register: Yorùbá ìgbàlódé, tó lọ́lá, tó sì ṣeé lóye ni a lò. Àkópọ̀ ‘mọ ìwé’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ mímọ̀ọ́kọ-mọ̀ọ́kà àti ẹ̀kọ́ sílẹ̀ láì pinnu ọ̀kan ṣoṣo.
