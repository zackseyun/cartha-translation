  to: Nítorí náà, ẹnu ń yà àwọn Júù[b], wọ́n sì ń sọ pé, “Báwo ni ọkùnrin yìí ṣe mọ ìwé[a] láì kọ́ ẹ̀kọ́?”
  rationale: A tún ọ̀rọ̀ náà ṣe nítorí àṣìṣe àmì ohùn tó kan ọ̀rọ̀-ìṣe pàtàkì nínú gbólóhùn àkọ́kọ́. A sì mú àwọn àlàyé ìsàlẹ̀ ojú ìwé kúrò nínú ìtọ́kasí tí kò pọndandan, kí wọ́n lè ṣàlàyé ìpinnu ìtumọ̀ pẹ̀lú ìdúróṣinṣin sí Gíríìkì àti sí Yorùbá àdánidá. Ìtumọ̀ àkọ́kọ́ àti ìtumọ̀ ẹsẹ̀ náà kò yí.
