    rationale: Nínú ìtumọ̀ “láti yà ẹni lẹ́nu,” ọ̀rọ̀-ìṣe náà ni “yà.” “Ẹnu ń ya” yí ìtumọ̀ àti ìpèníjà ohùn padà; “ẹnu ń yà” ni ó tọ́.
  - severity: low
    issue: Àlàyé a sọ “mọ àwọn lẹ́tà,” ṣùgbọ́n “lẹ́tà” lè dúró fún ọ̀pọ̀ ní Yorùbá.
    rationale: “Mọ lẹ́tà” jẹ́ ìtúmọ̀ kíkúrú, tó sún mọ́ Greek γράμματα, tí kò sì fi ọ̀pọ̀ kan tí kò pọndandan kún un.
  - severity: low
    issue: “Ìrú ẹ̀kọ́ yìí” nínú àlàyé a lè dà bí ẹni pé ó ń tọ́ka sí ẹ̀kọ́ kan tí a ti sọ tẹ́lẹ̀.
    rationale: “Ìmọ̀-ẹ̀kọ́ bẹ́ẹ̀” ń gbé ìtumọ̀ ‘such learning’ jáde dáadáa láì fi ohun àfihàn kan tí kò sí nínú ọ̀rọ̀ ìpilẹ̀ kún un.
  - severity: low
    issue: “Tí wọ́n ń tako ó” kò rọrùn, ó sì ní ìṣòro ìkọ̀wé arọ́pò-orúkọ.
    rationale: Lílò “tí wọ́n ń tako” nínú àlàyé náà yọ ìṣòro ìkọ̀wé náà, ó sì pa ìtumọ̀ àyíká mọ́.
