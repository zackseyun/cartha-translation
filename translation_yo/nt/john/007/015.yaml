  source_fidelity: 'Ìtumọ̀ náà ń mú ìbéèrè náà, ìyàlẹ́nu tí kò tíì dákẹ́, àti ìtumọ̀ gbooro ti γράμματα gẹ́gẹ́ bí ìmọ̀ ìwé/ẹ̀kọ́ jáde dáadáa. Ṣùgbọ́n àmì ohùn nínú òwe náà nílò àtúnṣe: a gbọdọ̀ kọ ọ́ sí “ẹnu ń yà,” kì í ṣe “ẹnu ń ya.” Àlàyé a gbọdọ̀ tún mú kí ó faramọ́ ọ̀rọ̀ Gíríìkì gan-an.'
  naturalness: “Ẹnu ń yà àwọn Júù” àti “Báwo ni ọkùnrin yìí ṣe mọ ìwé láì kọ́ ẹ̀kọ́?” jẹ́ Yorùbá ìgbàlódé, tó mọ́gbọ́n dání, tó sì yẹ fún ìforúkọsílẹ̀ Bíbélì. “Nítorí náà” gba agbára ìsopọ̀ οὖν, bí ó tilẹ̀ jẹ́ pé ó lè ní ìtẹnumọ́ ìdí-kí-ó-rí díẹ̀ ju “nígbà náà” lọ; ó ṣì bójú mu nínú àyíká yìí.
  terminology: “Àwọn Júù” pa ìtumọ̀ taara οἱ Ἰουδαῖοι mọ́; àlàyé ìsàlẹ̀ ojú ìwé fi àyíká rẹ̀ hàn láì sọ ọ́ di ìdájọ́ lórí gbogbo àwọn Júù. “Mọ ìwé” jẹ́ ìtumọ̀ àdánidá fún γράμματα níbí, níbi tí ìtumọ̀ rẹ̀ ti kan ìmọ̀ ìwé tàbí ẹ̀kọ́.
  issues:
