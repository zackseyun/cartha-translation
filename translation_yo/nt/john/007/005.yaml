  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: yo
  text: Nítorí pé kódà àwọn arákùnrin rẹ̀ kò gbà á gbọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Nítorí pé kódà àwọn arákùnrin rẹ̀ kò ní ìgbàgbọ́ nínú rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní àkókò aláìpé; a lè túmọ̀ ọ́ sí ìṣẹ̀lẹ̀ ní ìgbà àtijọ́ lásán tàbí sí ipò tí ó ń bá a lọ nígbà náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: pàápàá kò
  rationale: Ìṣètò yìí fi ìtẹnumọ́ ‘kódà ... kò’ hàn ní Yorùbá àdánidá, kì í ṣe ìsopọ̀ gbólóhùn lásán.
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí ohun tí ó ṣáájú rẹ̀.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, ó sì tọ́ka sí àwọn arákùnrin ọkùnrin Jesu nínú ìtàn yìí.
- source_word: ἐπίστευον
  choice: gbà ... gbọ́
  rationale: ‘Gba ẹnì kan gbọ́’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu láti sọ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé; ìtumọ̀ pàtó ti àkókò aláìpé ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: εἰς αὐτόν
  choice: á
  rationale: Arọ́pò-orúkọ olùgbà nínú gbólóhùn Yorùbá ‘gbà á gbọ́’ ń darí ìgbàgbọ́ náà sí i, ní ọ̀nà àdánidá ju gbólóhùn líle bí ‘nínú rẹ̀’ lọ.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω εἰς αὐτόν nínú ìwé Jòhánù
  choice: gbà á gbọ́
  alternative: ní ìgbàgbọ́ nínú rẹ̀ / gbẹ́kẹ̀ lé e
  rationale: Yíyan ‘gbà á gbọ́’ pa ìtumọ̀ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé tí a darí sí Jesu mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un. Nítorí ọ̀rọ̀ Yorùbá náà lè ní ìtumọ̀ ‘gba ohun tí ó sọ gbọ́’ pẹ̀lú, àyíká Jòhánù àti εἰς ni ó ń fi ìdarí ara ẹni sí Jesu hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ kúkúrú, ọlọ́lá, ó sì rọrùn fún òǹkàwé òde òní; ‘pàápàá kò’ mú ìtẹnumọ́ οὐδὲ jáde ní ti ẹ̀dá Yorùbá.
