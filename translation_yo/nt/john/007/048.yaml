  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: yo
  text: Ṣé ẹnikẹ́ni nínú àwọn olórí tàbí nínú àwọn Farisí ti gbà á gbọ́?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, ọ̀nà tí a gbà gbé ìbéèrè yìí kalẹ̀ pẹ̀lú μή ń retí ìdáhùn pé, “Rárá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: Ṣé ẹnì kan
  rationale: Ó pa ìrísí ìbéèrè àsọ àsọdùn mọ́, bí ó tilẹ̀ jẹ́ pé μή mú kí àwọn olùsọ̀rọ̀ retí ìdáhùn pé ‘rárá.’
- source_word: ἐκ τῶν ἀρχόντων
  choice: nínú àwọn olórí
  rationale: Ó fi hàn pé a ń sọ̀rọ̀ nípa ẹnì kan lára àwọn alákòóso Júù; ‘olórí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní iyì.
- source_word: ἐπίστευσεν
  choice: ti ... gba ... gbọ́ rí
  rationale: Àkópọ̀ ‘ti’ àti ‘rí’ bá ìbéèrè nípa bóyá ohun náà ti ṣẹlẹ̀ rí mu, ‘gba a gbọ́’ sì jẹ́ ọ̀nà àdánidá láti túmọ̀ πιστεύω ní àyíká yìí.
- source_word: εἰς αὐτόν
  choice: gba a gbọ́
  rationale: Yorùbá àdánidá kì í ṣe àdàkọ ‘sínú rẹ̀’; ‘gba a gbọ́’ sọ ìgbàgbọ́ nínú ẹni náà ní kedere.
- source_word: ἢ
  choice: tàbí
  rationale: Ó pa ìṣọ̀kan rọrùn tí ἢ ní mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: ἐκ τῶν Φαρισαίων
  choice: nínú àwọn Farisí
  rationale: Ó bá ‘nínú àwọn olórí’ dọ́gba, ó sì fi ìjẹ́ ọmọ ẹgbẹ́ hàn; ‘Farisí’ ni orúkọ ẹgbẹ́ náà tí a kọ sí Yorùbá.
theological_decisions:
- issue: Agbára àsọ àsọdùn inú ìbéèrè òdì
  choice: Pa á mọ́ gẹ́gẹ́ bí ìbéèrè tí ó ń retí ìdáhùn pé ‘rárá.’
  alternative: Kò sí ẹnikẹ́ni nínú àwọn olórí tàbí àwọn Farisí tó gba a gbọ́.
  rationale: μή τις tọ́ka sí ìdáhùn òdì tí àwọn olùsọ̀rọ̀ retí, ṣùgbọ́n Gíríìkì ṣì gbé e kalẹ̀ gẹ́gẹ́ bí ìbéèrè. Ìtumọ̀ náà pa ìwà ìkórìíra àti ìgbéraga ọ̀rọ̀ wọn mọ́ láìyí i padà sí ìkéde gbangba.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó ṣe kedere, tó sì ní iyì ni a lò. ‘Ṣé’ mú kí ìbéèrè àsọ àsọdùn náà dun bí Yorùbá àdánidá; àmì ohùn ni a fi síbi tí ó yẹ. A lo ‘àwọn Farisí’ gẹ́gẹ́ bí orúkọ ẹgbẹ́ ẹ̀sìn náà.
