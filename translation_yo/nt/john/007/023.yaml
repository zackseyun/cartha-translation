id: JHN.7.23
reference: John 7:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: yo
  text: Bí ọkùnrin kan bá gba ìkọlà ní ọjọ́ Ìsinmi kí a má bàa rú òfin Mósè,[a] ṣé ẹ ń bínú sí mi nítorí pé mo mú ọkùnrin kan láradá pátápátá ní ọjọ́ Ìsinmi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a má bàa pa òfin Mósè dà,” tàbí “kí a má bàa sọ òfin Mósè di asán.”
    reason: lexical_alternative
  - marker: b
    text: “Ọkùnrin kan láradá pátápátá” tẹnu mọ́ ìyàtọ̀ láàárín ṣíṣe ìkọlà sí apá kan ara àti mímú odidi ènìyàn láradá.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: gba ìkọlà
  rationale: Èyí tẹ̀ lé àkànlò èdè Gíríìkì, ‘gba ìkọlà,’ ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé a kọ ọkùnrin náà ní ilà.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Nítorí pé ìkọlà ni ọ̀rọ̀ náà dá lé, akọ ni ἄνθρωπος ń tọ́ka sí níbí, kì í ṣe ènìyàn lápapọ̀.
- source_word: ἐν σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Èyí ni àkànlò Yorùbá tó bójú mu fún àkókò Sábáàtì.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: kí a má bàa rú òfin Mósè
  rationale: λύω lè túmọ̀ sí pípa òfin dà, yíyọ ọ́ kúrò ní ipò, tàbí ríru rẹ̀; ‘rú òfin’ jẹ́ èdè Yorùbá tó ṣe kedere ní àyíká òfin.
- source_word: χολᾶτε
  choice: inú ń bí yín sí mi
  rationale: Ọ̀rọ̀ yìí ń sọ ìbínú tàbí ìrunú; àkànlò yìí jẹ́ adayeba, kò sì mú kí ìbínú náà lágbára ju ohun tí Gíríìkì sọ lọ.
- source_word: ὅλον ἄνθρωπον
  choice: gbogbo ara ọkùnrin kan
  rationale: Ó pa ìyàtọ̀ ọ̀rọ̀ Jésù mọ́ láàárín fífi àmì sí apá kan ara àti mímú gbogbo ènìyàn náà láradá.
- source_word: ὑγιῆ ἐποίησα
  choice: mo mú ... láradá
  rationale: Ó fi ìtumọ̀ ‘mú kí ó dára/lera’ hàn ní Yorùbá adayeba, ó sì jẹ́ kí a lè pa ὅλον mọ́ ní gbangba.
theological_decisions:
- issue: Ìfiwéra Jésù láàárín ìkọlà àti ìmúláradá ní ọjọ́ Ìsinmi
  choice: Jésù ń jiyàn pé bí wọ́n bá ń ṣe ìkọlà ní ọjọ́ Ìsinmi láti má ṣe rú òfin Mósè, mélòómélòó ni ó fi yẹ láti mú gbogbo ara ọkùnrin kan láradá ní ọjọ́ náà.
  alternative: Jésù kàn ń fi òfin àṣà ìsìn wé iṣẹ́ àánú lápapọ̀.
  rationale: Ìbéèrè náà dá lórí ìṣe ìkọlà tí wọ́n gbà láàyè ní ọjọ́ Ìsinmi, ó sì ń gbé ìmúláradá gbogbo ènìyàn náà kalẹ̀ gẹ́gẹ́ bí ohun tó tóbi jù; a kò fi àríyànjiyàn ẹ̀kọ́ ìsìn tó dé lẹ́yìn náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo “ọjọ́ Ìsinmi” fún Sábáàtì, àti “ìkọlà” fún circumcision.
