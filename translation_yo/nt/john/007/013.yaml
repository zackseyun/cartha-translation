id: JHN.7.13
reference: John 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: yo
  text: Síbẹ̀, kò sí ẹni tí ó ń sọ̀rọ̀ ní gbangba nípa rẹ̀, nítorí ìbẹ̀rù àwọn Júù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó nínú àyíká yìí, “àwọn aṣáájú Júù” tàbí “àwọn aláṣẹ ilẹ̀ Jùdíà.” Nínú Jòhánù, “àwọn Júù” lè túmọ̀ sí àwọn Júù lápapọ̀, ṣùgbọ́n ní àwọn ibì míì ó ń tọ́ka sí àwọn aláṣẹ tó wà ní Jerúsálẹ́mù tí wọ́n ń tako Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: kò sí ẹni
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ọ̀rọ̀ arọ́pò-orúkọ àìní ẹni, ó sì kan gbogbo àwọn tí wọ́n wà nínú ọ̀pọ̀ ènìyàn náà.
- source_word: μέντοι
  choice: Síbẹ̀
  rationale: Ó fi ìyàtọ̀ kékeré hàn sí àwọn èrò oríṣiríṣi tí a sọ ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó bójú mu.
- source_word: παρρησίᾳ
  choice: ní gbangba
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tẹnumọ́ sísọ̀rọ̀ láìfi pamọ́ ní gbangba, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ ìgboyà tàbí òtítọ́ inú.
- source_word: ἐλάλει
  choice: ń sọ̀rọ̀
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú Gíríìkì fi hàn pé sísọ̀rọ̀ náà jẹ́ ohun tí ń ṣẹlẹ̀ tàbí tí a máa ń ṣe ní àkókò àjọ̀dún náà.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédéé tí ó sì mọ́gbọ́n dání fún περί pẹ̀lú ọ̀rọ̀ ní ẹ̀yà genitive.
- source_word: διὰ τὸν φόβον
  choice: nítorí ìbẹ̀rù
  rationale: Ó pa ìkọ́lé orúkọ Gíríìkì mọ́, ó sì ṣàfihàn ìdí tàbí okùnfà láìṣàlàyé rẹ̀ kọjá ohun tí orísun sọ.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó tú ọ̀rọ̀ Gíríìkì náà ní tààràtà, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ àyíká tí ó ṣeé ṣe—àwọn aṣáájú tàbí aláṣẹ Júù ní Jùdíà—hàn láìfi í múlẹ̀ sínú ẹsẹ̀ pàtàkì.
theological_decisions:
- issue: Ẹni tí ‘àwọn Júù’ (τῶν Ἰουδαίων) ń tọ́ka sí nínú ìtàn Jòhánù
  choice: Pa ‘àwọn Júù’ mọ́ nínú ẹsẹ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sì sọ pé ó lè tọ́ka ní pàtó sí àwọn aṣáájú Júù tàbí àwọn aláṣẹ Jùdíà.
  alternative: àwọn aṣáájú Júù; àwọn aláṣẹ Jùdíà
  rationale: Èyí pa ìṣòro àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìtumọ̀ tóóró kan sínú ẹsẹ̀ pàtàkì. Àlàyé náà tún dènà kíkà á bí ẹni pé gbogbo àwọn Júù ni a ń dá lẹ́bi.
translation_notes:
  register: Yorùbá àgbàdojú, ọ̀wọ̀, àti òde òní ni a lò. ‘Ń sọ̀rọ̀’ pa ìṣe tí ń lọ lọ́wọ́ mọ́; ‘ní gbangba’ sì jẹ́ adayeba ju ìtumọ̀ gígùn tàbí líle lọ. Àmì ohùn ni a fi sí ibi tí ó yẹ.
