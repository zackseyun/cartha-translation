id: JHN.7.6
reference: John 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: yo
  text: Nítorí náà, Jésù sọ fún wọn pé, “Àkókò tèmi kò tíì dé[a], ṣùgbọ́n àkókò yín máa ń wà ní ìmúrasílẹ̀ nígbà gbogbo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àkókò tí a yàn fún mi kò tíì dé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àkókò tó yẹ tàbí àkókò tí a yàn, kì í ṣe àkókò lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú tàbí àbájáde ọ̀rọ̀ tó ṣáájú hàn, ó sì bójú mu nínú èdè Yorùbá ọlọ́lá.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Jésù sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ìsinsìnyí ìtàn, àkókò tí ó ti kọjá ni Yorùbá máa ń lò lọ́nà àdánidá nínú irú ìtàn yìí.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí ń sọ ẹni tí Jésù bá sọ̀rọ̀, láì fi ìtumọ̀ míì kún un.
- source_word: καιρός
  choice: àkókò
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà lè túmọ̀ sí àkókò tó yẹ tàbí tí a yàn; “àkókò” jẹ́ ti ẹ̀dá, ó sì pa àìdánilójú yẹn mọ́.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: àkókò tèmi
  rationale: Ó pa ìtẹnumọ́ ohun-ìní mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi “àkókò mi” wé “àkókò tiyín.”
- source_word: οὔπω πάρεστιν
  choice: kò tíì dé
  rationale: Ó túmọ̀ sí pé àkókò náà kò tíì wà níbẹ̀ tàbí kò tíì dé; yíyan “dé” bá àsọyé àkókò mu lọ́nà àdánidá.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó wà láàárín àkókò Jésù àti ti àwọn arákùnrin rẹ̀ hàn kedere.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: àkókò tiyín
  rationale: Ó ṣe àfarawé pẹ̀lú “àkókò tèmi,” ó sì pa ìyàtọ̀ ìpilẹ̀ṣẹ̀ mọ́.
- source_word: πάντοτέ
  choice: nígbà gbogbo
  rationale: Èyí ni ìtumọ̀ tààrà àti ọ̀nà Yorùbá tó wọ́pọ̀ fún ohun tó máa ń rí bẹ́ẹ̀ ní gbogbo ìgbà.
- source_word: ἕτοιμος
  choice: múra sílẹ̀
  rationale: Ó ń fi hàn pé àkókò wọn wà ní ìmúrasílẹ̀ tàbí pé ó ṣe tán nígbà gbogbo; gbólóhùn yìí jẹ́ kíkà tó ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ “àkókò” Jésù nínú àyíká Ìhìn Rere Jòhánù
  choice: Àkókò tèmi
  alternative: Àkókò tí a yàn fún mi; wákàtí tèmi
  rationale: Ẹsẹ̀ náà lo καιρός, kì í ṣe ὥρα. Nítorí náà, a kò túmọ̀ rẹ̀ sí “wákàtí,” bẹ́ẹ̀ ni a kò fi ìtumọ̀ ẹ̀kọ́ nípa iṣẹ́ àti ògo Jésù kún ọ̀rọ̀ pàtó náà. Àkọ́lé ìsàlẹ̀ sọ pé “àkókò tí a yàn” ṣeé ṣe.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó bá yẹ; a sì pa ìfarawé “àkókò tèmi/àkókò tiyín” mọ́.
