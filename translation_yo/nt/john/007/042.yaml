source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: yo
  text: Ṣé Ìwé Mímọ́ kò sọ pé Mèsáyà[a] yóò wá láti inú ìran Dáfídì àti láti Bẹtilẹhẹmu, abúlé tí Dáfídì wà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ oyè náà ní èdè Gíríìkì ni ὁ χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Nínú ìlò Jòhánù, ọ̀rọ̀ náà ń tọ́ka sí Ìwé Mímọ́ gẹ́gẹ́ bí ẹ̀rí aláṣẹ; èyí sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: εἶπεν
  choice: kò sọ
  rationale: A fi aorist náà hàn nínú ìbéèrè àsọyé Yorùbá ‘Ṣé ... kò sọ,’ èyí tó jẹ́ àdánidá tí ó sì pa agbára ẹ̀rí Ìwé Mímọ́ mọ́.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: láti inú irú-ọmọ Dáfídì
  rationale: σπέρμα níbí túmọ̀ sí ìran tàbí àtọmọdọ́mọ, kì í ṣe irúgbìn ní ìtumọ̀ gangan.
- source_word: ἀπὸ Βηθλέεμ
  choice: láti Bẹ́tílẹ́hẹ́mù
  rationale: ἀπό ń fi ibi ìpilẹ̀ tàbí ibi tí ẹni ti wá hàn; ‘láti’ ni ọ̀rọ̀ Yorùbá tó bá a mu.
- source_word: τῆς κώμης
  choice: abúlé
  rationale: κώμη jẹ́ ìletò kékeré tàbí abúlé; ‘abúlé’ pa ìyàtọ̀ rẹ̀ sí ìlú ńlá mọ́.
- source_word: ὅπου ἦν Δαυίδ
  choice: tí Dáfídì wà
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì tó rọrùn láì fi ìtumọ̀ míì kún un bí ‘ibi tí ó ti wá’ tàbí ‘ibi tí ó ń gbé.’
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Àkókò ìsinsìnyí náà ń sọ ohun tí a retí nípa orísun Mèsáyà; ‘ń bọ̀’ jẹ́ àdánidá ní Yorùbá.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Ní àyíká yìí, Χριστός jẹ́ orúkọ oyè ọba-olùgbàlà tí àwọn Júù ń retí, nítorí náà a túmọ̀ oyè náà sí ‘Mèsáyà’ dípò lílo ‘Kristi’ bí orúkọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí orúkọ oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè ẹni tí àwọn Júù ń retí, kì í ṣe bí orúkọ ẹni lásán. ‘Mèsáyà’ jẹ́ kí ìtumọ̀ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn ‘Kristi’ pamọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìbéèrè àsọyé ‘Ṣé ... kò sọ’ jẹ́ èdè àdánidá fún òǹkàwé gbogbo, nígbà tí gbólóhùn ‘tí Dáfídì wà’ pa ìrọ̀rùn àti àìṣàlàyé ọ̀rọ̀ orísun mọ́.
