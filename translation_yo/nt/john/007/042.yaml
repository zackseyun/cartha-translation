  to: Ṣé Ìwé Mímọ́ kò sọ pé Mèsáyà[a] yóò wá láti inú ìran Dáfídì àti láti Bẹtilẹhẹmu, abúlé tí Dáfídì wà?
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ kan tó lè túmọ̀ sí ìbọ̀ sí ibi kan pẹ̀lú ọ̀nà tí ó fi ìfojúsọ́nà orísun Mèsáyà hàn kedere; ó sì rọ́pò “irú-ọmọ” pẹ̀lú “ìran,” ìtumọ̀ Yorùbá tó dáa jù fún ìbátan ìran náà. A pa ìbéèrè àsọyé, ìtumọ̀ oyè Mèsáyà, àti ìmọ̀ọ́lẹ̀ gangan ti “níbi tí Dáfídì wà” mọ́.
