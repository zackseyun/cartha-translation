  source_fidelity: Ìbéèrè àsọyé náà, Ìwé Mímọ́, Mèsáyà, àti abúlé Dáfídì ni a gbé kalẹ̀ dáadáa. Ṣùgbọ́n “ń bọ̀” lè dojú kọ ìbọ̀ sí ibi kan ju orísun/ìran tí Mèsáyà yóò ti wá lọ. “Ìran Dáfídì” sì ṣe kedere, ó sì jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ìtumọ̀ ìbátan ìran nínú σπέρμα Δαυίδ.
