  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: yo
  text: Nítorí náà, ìpínyà ṣẹlẹ̀ láàárín ogunlọ́gọ̀ náà nítorí rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: ìpínyà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíya sí apá méjì tàbí àìṣọ̀kan láàárín àwọn ènìyàn; “ìpínyà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ẹsẹ̀ náà mu.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìjíròrò tó ṣáájú gẹ́gẹ́ bí àbájáde rẹ̀, láìsọ ìtumọ̀ ọ̀rọ̀ náà di líle jù.
- source_word: ἐγένετο
  choice: ṣẹlẹ̀
  rationale: Pẹ̀lú σχίσμα gẹ́gẹ́ bí olùṣe, ọ̀rọ̀ náà sọ pé ìpínyà náà bẹ̀rẹ̀ sí í wà; “ṣẹlẹ̀” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἐν τῷ ὄχλῳ
  choice: láàárín àwọn ènìyàn
  rationale: ὄχλος ń tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ; “láàárín àwọn ènìyàn” jẹ́ èdè Yorùbá tó wọ́pọ̀, ó sì fi hàn pé àwọn tó péjọ náà pín sí apá.
- source_word: δι’ αὐτόν
  choice: nítorí rẹ̀
  rationale: διά pẹ̀lú accusative ń tọ́ka sí ohun tó fa ìṣẹ̀lẹ̀ náà; “nítorí rẹ̀” pa ọ̀rọ̀ arọ́pò-orúkọ mọ́, ó sì sọ ìdí náà ní kedere.
theological_decisions:
- issue: Ẹni tí αὐτόν ń tọ́ka sí
  choice: “rẹ̀” ń tọ́ka sí Jésù, ṣùgbọ́n a pa ọ̀rọ̀ arọ́pò-orúkọ náà mọ́
  alternative: “nítorí Jésù”
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Jésù ni ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí. Yorùbá lè pa ọ̀rọ̀ arọ́pò-orúkọ mọ́ lọ́nà àdánidá, nítorí náà kò pọn dandan láti fi orúkọ Jésù kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yan ìtumọ̀ tó sun mọ́ orísun nígbà tó tún jẹ́ àdánidá ní Yorùbá.
