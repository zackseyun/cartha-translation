id: JHN.7.16
reference: John 7:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: yo
  text: Nítorí náà, Jésù dá wọn lóhùn pé, “Ẹ̀kọ́ mi kì í ṣe tèmi, ṣùgbọ́n ti ẹni tí ó rán mi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “ṣùgbọ́n ó wá láti ọ̀dọ̀ ẹni tí ó rán mi.” Àkójọpọ̀ ọ̀rọ̀ Gíríìkì lè tẹnumọ́ ẹni tí ẹ̀kọ́ náà jẹ́ tirẹ̀ tàbí ibi tí ó ti wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá wọn lóhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan fèsì sí ọ̀rọ̀ tàbí ìbéèrè àwọn ẹlòmíràn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa agbára àsopọ̀ àti ìtẹ̀sí ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé èsì Jésù tẹ̀ lé ohun tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: καὶ εἶπεν
  choice: pé
  rationale: Nínú Yorùbá àdánidá, “dá wọn lóhùn pé” ṣàkójọpọ̀ ìtumọ̀ “ó dáhùn, ó sì sọ” láìsọ ìtumọ̀ kankan nù.
- source_word: διδαχή
  choice: ẹ̀kọ́
  rationale: “Ẹ̀kọ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ohun tí ẹnì kan ń kọ́ àwọn ẹlòmíràn; kò ní ìrísí ọ̀rọ̀ ẹ̀sìn onímọ̀-jinlẹ̀ tí kò pọndandan.
- source_word: Ἡ ἐμὴ διδαχὴ
  choice: Ẹ̀kọ́ mi
  rationale: Ó tú ìnípò ἐμὴ jáde lọ́nà Yorùbá tó rọrùn, ó sì pa ìtẹnumọ́ lórí “mi” mọ́.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: kì í ṣe tèmi
  rationale: Ó pa ìtakora ìní tàbí orísun mọ́ ní ṣókí, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: ṣùgbọ́n ti ẹni tí ó rán mi
  rationale: “Ti ẹni” pa ìsọ̀kan pẹ̀lú “tèmi” mọ́, ó sì lè gba ìtumọ̀ pé ẹ̀kọ́ náà jẹ́ ti ẹni náà tàbí pé ọ̀dọ̀ rẹ̀ ni ó ti wá, gẹ́gẹ́ bí àkójọpọ̀ ọ̀rọ̀ Gíríìkì ṣe lè tọ́ka sí.
- source_word: πέμψαντός
  choice: rán
  rationale: “Rán” ni ìtumọ̀ taara àti àdánidá ti πέμπω ní àyíká ọ̀rọ̀ yìí; “fún ní àṣẹ” yóò fi àfikún ìtumọ̀ tí kò pọndandan sí i.
theological_decisions:
- issue: Ìbáṣepọ̀ ẹ̀kọ́ Jésù pẹ̀lú ẹni tí ó rán an
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí Jésù ṣe sọ pé ẹ̀kọ́ náà kì í ṣe tirẹ̀ ní ìdásílẹ̀ olómìnira, bí kò ṣe ti ẹni tí ó rán an.
  alternative: Láti tú u bí ẹni pé Jésù kàn jẹ́ olùkọ́ ènìyàn tí kò ní àṣẹ tirẹ̀, tàbí láti sọ ìyapa tó ju ohun tí ẹsẹ̀ náà sọ lọ láàárín Jésù àti ẹni tí ó rán an.
  rationale: Gíríìkì fi ìtakora “kì í ṣe tèmi, ṣùgbọ́n ti ẹni tí ó rán mi” hàn. Ìtumọ̀ náà pa ìyàtọ̀ ẹni àti ìṣọ̀kan iṣẹ́/orísun mọ́, láìfi ẹ̀kọ́ ìsìn míì tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. “Dá wọn lóhùn pé” mú àsọyé náà ṣàn lọ́nà àdánidá, nígbà tí “kì í ṣe tèmi, ṣùgbọ́n ti ẹni...” pa ìtakora ṣókí inú Gíríìkì mọ́.
