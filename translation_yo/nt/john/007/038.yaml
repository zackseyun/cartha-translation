id: JHN.7.38
reference: John 7:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: yo
  text: Ẹni tí ó gbà mí gbọ́, gẹ́gẹ́ bí Ìwé Mímọ́ ti wí, àwọn odò omi ìyè yóò ṣàn láti inú rẹ̀[a][b] jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn kan lóye arọ́pò-orúkọ ‘rẹ̀’ náà pé ó ń tọ́ka sí Mèsáyà, dípò ẹni tí ó gbàgbọ́.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ikùn’ tàbí ‘ilé ọmọ’; níhìn-ín ó ṣeé ṣe kí ó jẹ́ ọ̀nà àpẹẹrẹ fún inú ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Ẹni tí ó bá gbà mí gbọ́
  rationale: Ọ̀rọ̀ yìí fi ẹni kan tí ìgbàgbọ́ rẹ̀ dúró ṣinṣin hàn ní ọ̀nà àpapọ̀. ‘Gbà mí gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbẹ́kẹ̀lé tí a darí sí ẹni kan.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: gẹ́gẹ́ bí Ìwé Mímọ́ ti wí
  rationale: ‘Ìwé Mímọ́’ pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí orúkọ àpapọ̀ fún Ìwé Mímọ́; ‘ti wí’ sì jẹ́ ọ̀nà Yorùbá tí ó bá ìlò àgbékalẹ̀ ìtọ́kasí yìí mu.
- source_word: ποταμοὶ
  choice: àwọn odò
  rationale: ‘Àwọn’ mú ọ̀pọ̀ iye tí Gíríìkì fi hàn ṣe kedere, ‘odò’ sì pa àwòrán ọ̀pọ̀lọpọ̀ omi mọ́ ju ‘ìṣàn omi’ kékeré lọ.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: láti inú rẹ̀
  rationale: ‘Inú’ lè tọ́ka sí ikùn gan-an tàbí sí apá inú ẹni ní èdè Yorùbá, nítorí náà ó pa àwòrán orísun mọ́ láìfi ìtumọ̀ apá ara lásán lé e lórí. ‘Rẹ̀’ pa ẹyọ ọ̀rọ̀ arọ́pò-orúkọ mọ́.
- source_word: ῥεύσουσιν
  choice: yóò máa ṣàn ... jáde
  rationale: Àgbékalẹ̀ yìí fi ìṣe ọjọ́ iwájú àti ìṣàn tí ń tẹ̀ síwájú hàn ní Yorùbá àdánidá, láìfikún agbára bí ‘yóò tú jáde gidigidi.’
- source_word: ὕδατος ζῶντος
  choice: omi ìyè
  rationale: Èyí jẹ́ gbólóhùn Yorùbá ṣókí tí ó pa àwòrán omi alààyè àti ìtumọ̀ rẹ̀ gẹ́gẹ́ bí omi tí ń fúnni ní ìyè mọ́.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (‘rẹ̀’) ń tọ́ka sí
  choice: A ka ‘rẹ̀’ sí ẹni tí ó gbàgbọ́, nítorí náà àwọn odò náà ń ṣàn láti inú ẹni tí ó gbàgbọ́.
  alternative: Àwọn kan ka ‘rẹ̀’ sí Mèsáyà/Jésù, ẹni tí omi náà ti ń ṣàn jáde.
  rationale: Ẹni tí ó gbàgbọ́ ni antecedent gírámà tí ó sún mọ́ ọn jù, Jòhánù 7:39 sì ń sọ nípa Ẹ̀mí tí àwọn onígbàgbọ́ yóò gbà. Síbẹ̀, a pa ìtumọ̀ Mèsáyà mọ́ nínú àlàyé ìsàlẹ̀ nítorí pé gbolohun náà ní ìṣòro ìtọ́kasí gidi.
- issue: Ìtumọ̀ κοιλία
  choice: inú
  alternative: ikùn; ilé-ọmọ; gbogbo apá inú ẹni
  rationale: ‘Inú’ jẹ́ ọ̀rọ̀ Yorùbá tí ó lè gbé ìtumọ̀ apá ara àti ìtumọ̀ àpẹẹrẹ fún ọkàn inú ẹni pọ̀, nítorí náà kò yanjú àwòrán náà ju ohun tí orísun sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. ‘Inú’ pa àwòrán Gíríìkì mọ́ ní ọ̀nà àdánidá, àwọn àmì [a] àti [b] sì wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí àlàyé wọn ń ṣàlàyé.
