  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ pàtàkì Gíríìkì mọ́: ẹni tí ó gbàgbọ́ nínú Jésù, ìtọ́kasí sí Ìwé Mímọ́, ọ̀pọ̀ ‘odò,’ omi ìyè, àti ìṣàn láti inú ẹni náà. ‘Láti inú rẹ̀’ jẹ́ ìtumọ̀ tó dára fún ἐκ τῆς κοιλίας αὐτοῦ, ó sì fi àìdánilójú ìtọ́kasí arọ́pò-orúkọ náà sílẹ̀. Ṣùgbọ́n ‘bá ... gbọ́’ lè fún un ní ìrísí ìlànà ọjọ́ iwájú/àdéhùn tí kò hàn kedere nínú participle Gíríìkì tí ó ń ṣàpèjúwe ẹni tí ìgbàgbọ́ jẹ́ àfihàn rẹ̀. A tún lè mú àlàyé ‘ilé-ọmọ’ ṣe kedere ní ìkọ̀wé Yorùbá.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì rọrùn. ‘Ẹni tí ó gbà mí gbọ́’ dáa sí i nínú ọ̀rọ̀ yìí, nítorí ó jẹ́ ọ̀nà àdánidá láti ṣàpèjúwe ẹni tí ó ń gbàgbọ́. ‘Yóò ṣàn ... jáde’ tó láti sọ ọjọ́ iwájú Gíríìkì; ‘máa’ lè fi ìtumọ̀ ìṣe tí ń lọ títí kún un díẹ̀.
  terminology: ‘Ìwé Mímọ́,’ ‘odò,’ àti ‘omi ìyè’ yẹ, wọ́n sì bá ìlò ìtúmọ̀ Bíbélì Yorùbá mu. ‘Inú’ pa ìtumọ̀ gidi àti àpẹẹrẹ ti κοιλία mọ́ dáadáa. Àlàyé ìsàlẹ̀ yẹ kí ó lo ‘ilé ọmọ’ (kì í ṣe ‘ilé-ọmọ’) fún womb, kí ó sì sọ ìtumọ̀ àpẹẹrẹ náà ní kedere.
