  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: yo
  text: Jésù dá wọn lóhùn, ó sì wí fún wọn pé, “Iṣẹ́ kan ni mo ṣe, gbogbo yín sì ń ṣe kàyéfì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá wọn lóhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ìdáhùn hàn nínú ìtàn.
- source_word: εἶπεν αὐτοῖς
  choice: ó sì wí fún wọn pé
  rationale: Ó pa àwọn ọ̀rọ̀-ìṣe méjèèjì, ‘dáhùn’ àti ‘wí,’ mọ́ gẹ́gẹ́ bí ìṣètò orísun, bó tilẹ̀ jẹ́ pé èyí ní ìtẹnumọ́ díẹ̀ ní Yorùbá.
- source_word: Ἓν ἔργον
  choice: Iṣẹ́ kan
  rationale: ‘Iṣẹ́’ pa ìtumọ̀ ἔργον àti ìlò rẹ̀ tó ń tún wá nínú Jòhánù mọ́; fífi ‘kan’ sí ẹ̀yìn rẹ̀ tẹnumọ́ pé iṣẹ́ kan ṣoṣo ni.
- source_word: ἐποίησα
  choice: ni mo ṣe
  rationale: Ọ̀nà Yorùbá tó rọrùn, tó sì pa ìtẹnumọ́ ‘iṣẹ́ kan’ mọ́.
- source_word: πάντες
  choice: gbogbo yín
  rationale: Ó mú kedere pé gbogbo ẹgbẹ́ tí Jésù ń bá sọ̀rọ̀ ni a ń tọ́ka sí.
- source_word: θαυμάζετε
  choice: ẹ sì yà á sílẹ̀
  rationale: Ó ṣàfihàn ìyàlẹ́nu tàbí ìyalẹ́nu pẹ̀lú àìlóye, láìsọ ọ́ di ìmọrírì rere nìkan.
theological_decisions:
- issue: Ìjẹ́pàtàkì ἔργον nínú Jòhánù
  choice: Iṣẹ́
  alternative: Ìṣe
  rationale: ‘Iṣẹ́’ bá ọ̀rọ̀ pàtàkì tí Jòhánù máa ń lò fún àwọn iṣẹ́ Jésù mu, ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ibi mìíràn nínú ìwé náà dúró láìfi ìtumọ̀ míì kún un.
- issue: Ohun tí θαυμάζετε túmọ̀ sí nínú àyíká yìí
  choice: ẹ sì yà á sílẹ̀
  alternative: ẹ sì ń ṣe kàyéfì
  rationale: Gíríìkì lè tọ́ka sí ìyàlẹ́nu tàbí ìyalẹ́nu pẹ̀lú ìdàrúdàpọ̀. Àṣàyàn yìí pa àìdánilójú yẹn mọ́ láìsọ ìhùwà wọn di rere tàbí búburú pátápátá.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Ìṣètò ‘dá wọn lóhùn, ó sì wí’ mọ́ àtúnṣe ọ̀rọ̀ orísun, nígbà tí ‘iṣẹ́ kan ni mo ṣe’ ń pa ìtẹnumọ́ nọ́ńbà náà mọ́.
