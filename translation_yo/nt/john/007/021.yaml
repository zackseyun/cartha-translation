  to: Jésù dá wọn lóhùn, ó sì wí fún wọn pé, “Iṣẹ́ kan ni mo ṣe, gbogbo yín sì ń ṣe kàyéfì.”
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí kò bá θαυμάζετε mu pẹ̀lú ‘ń ṣe kàyéfì,’ èyí tó jẹ́ ìtumọ̀ Yorùbá tó pé, tó sì dá àìdánilójú ìhùwà ìyàlẹ́nu náà sílẹ̀. A pa ‘iṣẹ́ kan’ mọ́ fún ìtẹnumọ́ ἓν ἔργον, a sì fi ‘gbogbo yín’ hàn fún πάντες. Kò sí àfikún àlàyé tàbí ìsàlẹ̀-ìwé tí ó nílò ìdákọ̀ró nínú ẹsẹ̀ kúkúrú yìí.
  reviewer_model: gpt-5.6-terra
