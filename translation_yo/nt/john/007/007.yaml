id: JHN.7.7
reference: John 7:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: yo
  text: Ayé[b] kò lè kórìíra yín,[a] ṣùgbọ́n ó kórìíra mi, nítorí mo ń jẹ́rìí nípa rẹ̀ pé àwọn iṣẹ́ rẹ̀ burú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kò ṣeé ṣe fún ayé láti kórìíra yín.”
    reason: lexical_alternative
  - marker: b
    text: ‘Ayé’ nínú Jòhánù sábà máa ń tọ́ka sí ètò àwọn ènìyàn tí ń tako Ọlọ́run, kì í ṣe gbogbo ohun tí Ọlọ́run dá.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύ́ναται
  choice: kò lè
  rationale: Ó fi èrò agbára tàbí àìlágbára inú δύναμαι hàn ní Yorùbá àdánidá; ó lè túmọ̀ sí ‘kò ṣeé ṣe fún un láti’ pẹ̀lú.
- source_word: ὁ κόσμος
  choice: ayé
  rationale: ‘Ayé’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún κόσμος, ó sì pa ìtumọ̀ onípele tí Jòhánù máa ń lò mọ́ láì fi àlàyé ìtumọ̀ kún un nínú ẹsẹ náà.
- source_word: μισεῖν / μισεῖ
  choice: kórìíra / kórìíra
  rationale: A lo ọ̀rọ̀ kan náà ní ìgbà méjèèjì láti pa ìtakora tó lágbára láàárín ‘yín’ àti ‘mi’ mọ́.
- source_word: ἐμὲ δὲ
  choice: ṣùgbọ́n ó kórìíra mi
  rationale: ‘Ṣùgbọ́n’ fi ìtakora δέ hàn, ìṣètò gbólóhùn náà sì jẹ́ Yorùbá àdánidá.
- source_word: μαρτυρῶ
  choice: mo ń jẹ́rìí
  rationale: ‘Jẹ́rìí’ fi ìtumọ̀ fífi ẹ̀rí tàbí jíjẹ́ ẹlẹ́rìí inú μαρτυρέω hàn ní èdè Yorùbá tó yé kedere.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Ó tọ́ka padà sí ‘ayé’ láì sọ ọ́ di ẹni kan pàtó; èyí ni ìtọ́kasí Yorùbá àdánidá.
- source_word: τὰ ἔργα αὐτοῦ
  choice: iṣẹ́ rẹ̀
  rationale: ‘Iṣẹ́’ dúró sún mọ́ ἔργα, ó sì pa ìró ìwà àti ẹ̀kọ́ inú ọ̀rọ̀ Jòhánù mọ́; ‘àwọn ìṣe rẹ̀’ tún ṣeé lò.
- source_word: πονηρά
  choice: burú
  rationale: Nínú àyíká yìí, ‘burú’ ń sọ ìwà búburú nípa ìṣe ayé, kì í ṣe pé àwọn iṣẹ́ náà kò dára lásán.
theological_decisions:
- issue: Ìtọ́kasí àti agbára ẹ̀kọ́ ọ̀rọ̀ ‘ayé’ nínú Jòhánù
  choice: Pa ‘ayé’ mọ́ láì tú u sí ọ̀rọ̀ ìtumọ̀ gígùn nínú ẹsẹ náà
  alternative: Àwọn ènìyàn ayé tí wọ́n ń tako Ọlọ́run; ètò ayé tó ń tako Ọlọ́run
  rationale: κόσμος ní ọ̀pọ̀ ìpele ìtumọ̀ nínú Jòhánù. Ẹsẹ yìí fi ayé hàn gẹ́gẹ́ bí ohun tó tako Jésù nítorí pé ó ń tú ìwà búburú iṣẹ́ rẹ̀ síta; ìtumọ̀ náà kò gbọ́dọ̀ dín ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ yìí kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtẹnumọ́ àti ìtakora inú Gíríìkì mọ́.
