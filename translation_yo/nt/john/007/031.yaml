    reason: alternative_reading
  revision_rationale: The sole revision changes ‘iṣẹ́ àmì púpọ̀’ to ‘àmì púpọ̀.’ This follows the Greek σημεῖα directly, avoids adding ‘works,’ and improves Yoruba idiom while retaining the rhetorical question, tense/aspect, and messianic title.
