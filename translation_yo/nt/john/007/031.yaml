revisions:
- from: Ṣùgbọ́n ọ̀pọ̀ ènìyàn lára ogunlọ́gọ̀ náà gbà á gbọ́, wọ́n sì ń sọ pé, “Nígbà tí Mèsáyà[a] bá dé, kò ní ṣe iṣẹ́ àmì púpọ̀ ju èyí tí ọkùnrin yìí ti ṣe lọ, àbí?”
  to: Ṣùgbọ́n ọ̀pọ̀ ènìyàn lára ogunlọ́gọ̀ náà gbà á gbọ́, wọ́n sì ń sọ pé, “Nígbà tí Mèsáyà[a] bá dé, kò ní ṣe àmì púpọ̀ ju èyí tí ọkùnrin yìí ti ṣe lọ, àbí?”
  rationale: The sole revision changes ‘iṣẹ́ àmì púpọ̀’ to ‘àmì púpọ̀.’ This follows the Greek σημεῖα directly, avoids adding ‘works,’ and improves Yoruba idiom while retaining the rhetorical question, tense/aspect, and messianic title.
  reviewer_model: gpt-5.6-terra
