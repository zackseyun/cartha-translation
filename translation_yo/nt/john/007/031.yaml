id: JHN.7.31
reference: John 7:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀pọ̀ ènìyàn lára ogunlọ́gọ̀ náà gbà á gbọ́, wọ́n sì ń sọ pé, “Nígbà tí Mèsáyà[a] bá dé, kò ní ṣe àmì púpọ̀ ju èyí tí ọkùnrin yìí ti ṣe lọ, àbí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè níbí, a sì túmọ̀ rẹ̀ sí “Mèsáyà” nítorí pé ọ̀rọ̀ náà wà nínú àyíká ìrètí àwọn Júù nípa Mèsáyà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Ṣùgbọ́n ọ̀pọ̀ ènìyàn lára ogunlọ́gọ̀ náà
  rationale: “Lára ogunlọ́gọ̀ náà” fi hàn pé àwọn ènìyàn wọ̀nyí jẹ́ apá kan nínú ogunlọ́gọ̀ ńlá, “Ṣùgbọ́n” sì pa ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ tí δέ mú wá mọ́.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: gbà á gbọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbàgbọ́ tí a darí sí ẹni kan; ó yẹra fún gbólóhùn tí kò wọ́pọ̀ bí “gbàgbọ́ sínú rẹ̀.”
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ pé
  rationale: Àmì àsìkò “ń” pa ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń tún ṣe nínú imperfect Greek mọ́.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Nínú ọ̀rọ̀ Júù nípa ẹni tí a ń retí pé yóò dé, χριστός jẹ́ oyè, nítorí náà “Mèsáyà” mú ìtumọ̀ yẹn jáde ní kedere.
- source_word: ὅταν ἔλθῃ
  choice: Nígbà tí Mèsáyà bá dé
  rationale: “Nígbà tí ... bá” jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìṣẹ̀lẹ̀ ọjọ́ iwájú tí ὅταν pẹ̀lú subjunctive ń tọ́ka sí.
- source_word: μὴ ... ποιήσει
  choice: kò ní ṣe ... àbí?
  rationale: Ìbéèrè pẹ̀lú μή ń retí ìdáhùn òdì; “kò ní ... àbí?” pa ìtẹnumọ́ ìbéèrè yẹn mọ́ láì sọ ọ́ di gbólóhùn ìdánilójú.
- source_word: πλείονα σημεῖα
  choice: iṣẹ́ àmì púpọ̀
  rationale: “Púpọ̀” tọ́ka sí iye gẹ́gẹ́ bí πλείονα, kì í ṣe dandan sí bí àwọn iṣẹ́ náà ti tóbi; “iṣẹ́ àmì” sì pa èdè pàtàkì ti Jòhánù mọ́ dípò “iṣẹ́ ìyanu” nìkan.
- source_word: οὗτος ἐποίησεν
  choice: èyí tí ọkùnrin yìí ti ṣe
  rationale: “Ọkùnrin yìí” jẹ́ ọ̀rọ̀ àdánidá fún bí ogunlọ́gọ̀ ṣe ń tọ́ka sí Jésù, “ti ṣe” sì fi àwọn iṣẹ́ tí ó ti ṣẹlẹ̀ ṣáájú sí ojú ìwòye ìfiwéra ọjọ́ iwájú.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè níbí—ẹni tí àwọn Júù ń retí pé yóò dé—kì í ṣe orúkọ lásán. “Mèsáyà” pa àyíká àti ìtumọ̀ Júù mọ́, a sì fi “Kristi” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn.
- issue: Agbára ìbéèrè pẹ̀lú μή
  choice: “kò ní ... àbí?”—ìbéèrè tí ń retí ìdáhùn òdì
  alternative: Ìbéèrè ọjọ́ iwájú tí kò tọ́ka sí irú ìdáhùn kan
  rationale: μή sábà máa ń tọ́ka pé ẹni tó béèrè ń retí “rárá.” Ìtumọ̀ náà pa èrò ogunlọ́gọ̀ mọ́ pé àwọn iṣẹ́ àmì Jésù ti tó láti jẹ́ ẹ̀rí nípa Mèsáyà, láì yí ìbéèrè wọn padà sí ìkéde.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní ni a lò. Àmì ohùn wà ní ibi tí ó jẹ́ àdánidá; “ogunlọ́gọ̀,” “gbà á gbọ́,” àti ìparí “àbí?” mú ọ̀rọ̀ ogunlọ́gọ̀ náà dun bí Yorùbá gidi láì sọ ìtumọ̀ Greek di mímú ju bó ṣe wà lọ.
