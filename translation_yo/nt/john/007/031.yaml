review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the partitive ‘many from the crowd,’ faith directed toward Jesus, the imperfect ongoing speech, the titular ‘the Messiah,’ and the negative-answer-expected rhetorical question. ‘Iṣẹ́ àmì púpọ̀’ unnecessarily adds ‘works’ and is not the most direct or natural rendering of plural σημεῖα (‘signs’).
  naturalness: The Yoruba is generally clear and suitably formal. ‘Àmì púpọ̀ ju … lọ’ is more idiomatic and accurately expresses the Greek comparative than ‘iṣẹ́ àmì púpọ̀ ju … lọ.’
  terminology: ‘Mèsáyà’ appropriately conveys Χριστός as a title in this Jewish messianic setting, while the footnote supplies ‘Kristi’ as an alternative. ‘Àmì’ maintains John’s meaningful signs terminology without reducing it to ‘miracles.’
  issues:
  - severity: low
    issue: ‘Iṣẹ́ àmì púpọ̀’ adds ‘works’ and is an awkward expression for plural σημεῖα.
    rationale: The Greek says simply ‘more signs.’ Replacing it with ‘àmì púpọ̀ ju’ removes the added element, preserves the quantitative comparison, and reads more naturally in Standard Yoruba.
  revised_text: Ṣùgbọ́n ọ̀pọ̀ ènìyàn lára ogunlọ́gọ̀ náà gbà á gbọ́, wọ́n sì ń sọ pé, “Nígbà tí Mèsáyà[a] bá dé, kò ní ṣe àmì púpọ̀ ju èyí tí ọkùnrin yìí ti ṣe lọ, àbí?”
  revised_footnotes:
