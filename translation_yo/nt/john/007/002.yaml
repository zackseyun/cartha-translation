id: JHN.7.2
reference: John 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: yo
  text: Àjọ̀dún àwọn Júù, ìyẹn Àjọ̀dún Àgọ́[a], sì ti súnmọ́lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní tààràtà, “Àjọ̀dún Àwọn Àgọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: A lo ‘sì’ gẹ́gẹ́ bí àsopọ̀ ìtàn tó rọrùn; kò fi ìtakora líle kún ọ̀rọ̀ náà, bẹ́ẹ̀ ni kò fi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐγγὺς
  choice: ti súnmọ́lé
  rationale: Ó fi hàn ní Yorùbá àdánidá pé àkókò àjọ̀dún náà ti fẹ́ dé.
- source_word: ἑορτὴ
  choice: Àjọ̀dún
  rationale: ‘Àjọ̀dún’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún ayẹyẹ ẹ̀sìn tí a máa ń ṣe ní àsìkò pàtó.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó pa ìtumọ̀ apólówó Gíríìkì mọ́ pé àjọ̀dún náà jẹ́ ti àwọn Júù, láì sọ ọ́ di gbólóhùn àtakò sí wọn.
- source_word: σκηνοπηγία
  choice: Àjọ̀dún Àgọ́
  rationale: Èyí jẹ́ orúkọ tó ṣe kedere fún àjọ̀dún tí ó ní í ṣe pẹ̀lú gbígbé inú àwọn àgọ́ ìgbà díẹ̀; àlàyé ẹsẹ̀ ìsàlẹ̀ fi ìtumọ̀ tó túbọ̀ tẹ̀ lé ìpilẹ̀ ọ̀rọ̀ náà hàn.
theological_decisions:
- issue: Ìtumọ̀ τῶν Ἰουδαίων nínú orúkọ àjọ̀dún
  choice: àwọn Júù
  alternative: ti àwọn Júù
  rationale: Nínú àyíká yìí, gbólóhùn náà ń dá àjọ̀dún náà mọ̀ gẹ́gẹ́ bí àjọ̀dún àwọn Júù; kò ní èrò àtakò tàbí ẹ̀sùn.
- issue: Orúkọ σκηνοπηγία
  choice: Àjọ̀dún Àgọ́
  alternative: Àjọ̀dún Ṣíṣe Àgọ́
  rationale: Orúkọ àkọ́kọ́ rọrùn, ó sì yẹ fún òǹkàwé òde òní; ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ ọ̀rọ̀ náà ní tààràtà mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti èdè òde òní ni a lò. Gbólóhùn ‘ìyẹn’ mú ìbáṣepọ̀ apposition inú Gíríìkì ṣe kedere, ‘sì’ sì ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn aláìlágbára.
