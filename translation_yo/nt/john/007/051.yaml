source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: yo
  text: “Ṣé òfin wa kò dá ènìyàn lẹ́jọ́, bí kò bá kọ́kọ́ gbọ́ láti ọ̀dọ̀ rẹ̀, tí kò sì mọ ohun tí ó ń ṣe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: Ṣé ... láì ...?
  rationale: Ìbéèrè tí Μὴ ṣí sílẹ̀ ń retí ìdáhùn òdì. Àgbékalẹ̀ Yorùbá yìí mú agbára ìbéèrè àsọyé náà jáde lọ́nà àdánidá.
- source_word: ὁ νόμος ἡμῶν
  choice: òfin wa
  rationale: Ó tọ́ka sí ìlànà òfin tí Nikodémù ń pè ní ti àwùjọ wọn; a kò fi lẹ́tà ńlá ṣe é kí a má bàa fi dandan túmọ̀ rẹ̀ sí àwọn ìwé Mósè nìkan.
- source_word: κρίνει
  choice: dá ... lẹ́jọ́
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ fífi ẹjọ́ ẹni ṣe tàbí ṣíṣe ìdájọ́; yíyan èyí kò fi ìtumọ̀ tó le ju ti ‘dálẹ́bi’ kún un.
- source_word: τὸν ἄνθρωπον
  choice: ènìyàn
  rationale: ἄνθρωπος jẹ́ ẹyọ ọ̀rọ̀ aṣojú gbogbogbò níbí. ‘Ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ gbogbogbò náà mọ́ láì tọ́ka sí akọ nìkan.
- source_word: ἐὰν μὴ
  choice: láì
  rationale: Nínú ìbéèrè òdì yìí, ‘láì’ sọ ipò tí ó gbọ́dọ̀ kọ́kọ́ ṣẹ ní Yorùbá àdánidá.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: kọ́kọ́ gbọ́ ọ̀rọ̀ láti ẹnu rẹ̀
  rationale: παρ’ αὐτοῦ túmọ̀ sí gbígbọ́ láti ọ̀dọ̀ ẹni náà fúnra rẹ̀; ‘láti ẹnu rẹ̀’ jẹ́ àfihàn Yorùbá tó ṣe kedere, ‘kọ́kọ́’ sì pa πρῶτον mọ́.
- source_word: γνῷ
  choice: mọ
  rationale: Ó túmọ̀ sí wíwá mọ òtítọ́ ọ̀ràn náà; ‘mọ’ jẹ́ kíkún, ṣókí, ó sì bá ọ̀rọ̀ òfin mu.
- source_word: τί ποιεῖ
  choice: ohun tí ó ń ṣe
  rationale: Àmì ‘ń’ pa ìṣe ìsinsìnyí tàbí ìṣe tó ń lọ nínú ποιεῖ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún ọ̀rọ̀ níbi ìjíròrò òfin. A lo ‘Ṣé’ láti mú ìbéèrè àsọyé tí ó ń retí ìdáhùn òdì hàn.
