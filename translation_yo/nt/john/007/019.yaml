source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: yo
  text: Ṣé Mósè kò fún yín ní òfin? Síbẹ̀, kò sí ẹnì kankan nínú yín tí ń pa òfin náà mọ́.[a] Èé ṣe tí ẹ̀ fi ń wá láti pa mí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “tí ń ṣe òfin náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Ṣé kì í ṣe ... ni ó fún
  rationale: Ìbéèrè olórí-ọ̀rọ̀ pẹ̀lú οὐ ń retí ìdáhùn ìjẹ́wọ́. Ọ̀rọ̀ Yorùbá yìí mú agbára ìbéèrè náà jáde lọ́nà àdánidá; δέδωκεν tọ́ka sí fífún tí ipa rẹ̀ ṣì dúró.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni àkọsílẹ̀ orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: τὸν νόμον
  choice: òfin náà
  rationale: Àmì ìtọ́kasí náà fi hàn pé òfin pàtó ni, ìyẹn òfin tí Mósè fún Ísírẹ́lì; “náà” mú pàtó yìí hàn láìfi àlàyé kún ọ̀rọ̀.
- source_word: καὶ
  choice: Síbẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé καί sábà túmọ̀ sí “àti,” ó ń fi ìyàtọ̀ hàn níbí láàárín gbígba òfin àti àìgbọ́ràn sí i.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: kò sí ẹnì kankan nínú yín
  rationale: Ó pa ìkọ̀sílẹ̀ pátápátá ti Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ποιεῖ τὸν νόμον
  choice: ń pa òfin náà mọ́
  rationale: Ní àyíká yìí ποιέω túmọ̀ sí ṣíṣe tàbí pípa òfin mọ́. Gbólóhùn Yorùbá yìí ṣe kedere pé ó jẹ́ ṣíṣègbọ́ràn sí òfin, kì í ṣe ṣíṣe òfin tuntun.
- source_word: τί
  choice: Èé ṣe
  rationale: τί ní ìsopọ̀ yìí béèrè ìdí; “Èé ṣe” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé àti ọ̀wọ̀ fún “kí ló dé?”
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: ẹ fi ń wá ọ̀nà láti pa
  rationale: “ń wá ọ̀nà” pa ìtumọ̀ ìfẹ́ tàbí ìsapá tí ń lọ lọ́wọ́ nínú ζητεῖτε mọ́, nígbà tí “láti pa” fi infinitive náà hàn ní tààrà.
theological_decisions:
- issue: Ohun tí “òfin” ń tọ́ka sí
  choice: Òfin Mósè tí a fi fún Ísírẹ́lì
  alternative: Òfin ìwà rere ní gbogbogbòò
  rationale: Nítorí pé Jésù dárúkọ Mósè gẹ́gẹ́ bí ẹni tí ó fún wọn ní òfin, νόμος ń tọ́ka sí Òfin Mósè/Tórà, kì í ṣe òfin ní gbogbogbòò.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ṣé kì í ṣe ... ni” pa ìbéèrè tí ń retí ìdáhùn bẹ́ẹ̀ ni mọ́; “Síbẹ̀” mú ìtakora inú gbólóhùn náà hàn. Gbogbo àmì ohùn ni a fi síbi tí ó yẹ.
