id: JHN.7.30
reference: John 7:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: yo
  text: Nítorí náà, wọ́n ń wá láti gbá a mú[a], síbẹ̀ kò sí ẹnikẹ́ni tí ó gbé ọwọ́ lé e, nítorí wákàtí rẹ̀ kò tíì dé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘wọ́n ń gbìyànjú láti mú un.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘láti gbá mú’; nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí ó ń tọ́ka sí mímú un bí ẹlẹ́wọ̀n.
    reason: lexical_alternative
  - marker: b
    text: ‘Wákàtí rẹ̀’ jẹ́ gbólóhùn tí ó máa ń farahàn nínú Jòhánù fún àkókò tí Ọlọ́run yàn nínú iṣẹ́ Jésù, pàápàá fún ìjìyà, ikú, àjíǹde àti jíjẹ́ ológo rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: wọ́n ń wá ọ̀nà
  rationale: Ìṣe aláìpé náà fi hàn pé ìgbìyànjú náà ń lọ lọ́wọ́ tàbí pé wọ́n ń ṣe é léraléra; ‘ń wá ọ̀nà’ sọ èyí ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ohun tí ó ṣẹlẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú, ó sì pa ìtumọ̀ ìyọrísí mọ́.
- source_word: πιάσαι
  choice: láti gbá a mú
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí mímú tàbí gbígba ẹnìkan mú. Gbólóhùn yìí dúró sítòsí ìtumọ̀ ìpilẹ̀ rẹ̀, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ ó ṣeé ṣe kí ó túmọ̀ sí mímú un bí ẹlẹ́wọ̀n.
- source_word: οὐδεὶς
  choice: kò sí ẹnikẹ́ni
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún arọ́pò-orúkọ òdì náà.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: tí ó gbé ọwọ́ lé e
  rationale: Ó pa àwòrán ọwọ́ kan nínú Gíríìkì mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé ohun tí a ń sọ ni fífi agbára mú un, kì í ṣe fífi ọwọ́ kàn án lásán.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí ẹnikẹ́ni kò fi mú un.
- source_word: οὔπω
  choice: kò tíì
  rationale: Ó sọ ìsẹ́lẹ̀ tí kò tíì ṣẹlẹ̀ ní àkókò náà ní Yorùbá àdánidá.
- source_word: ἐληλύθει
  choice: dé
  rationale: Pípé aláṣeyọrí Gíríìkì tọ́ka sí pé àkókò pàtàkì náà kò tíì dé títí di àsìkò ìtàn yìí; ‘kò tíì dé’ gbé ìtumọ̀ náà jáde lọ́nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ἡ ὥρα αὐτοῦ
  choice: wákàtí rẹ̀
  rationale: ‘Wákàtí’ pa ọ̀rọ̀ pàtàkì tí Jòhánù ń lò léraléra mọ́, dípò kí a sọ ọ́ di ‘àkókò’ lásán tàbí kí a fi ìtumọ̀ kan ṣoṣo dè é.
theological_decisions:
- issue: Ìtumọ̀ ‘wákàtí rẹ̀’ nínú ìwé Jòhánù
  choice: A fi gbólóhùn náà sílẹ̀ gẹ́gẹ́ bí ‘wákàtí rẹ̀’ láì ṣàlàyé rẹ̀ síwájú nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: ‘àkókò rẹ̀’ tàbí ‘àkókò tí a yàn fún ikú rẹ̀’
  rationale: Nínú Jòhánù, gbólóhùn náà ní ìjìnlẹ̀ tó kan àkókò tí Ọlọ́run yàn nínú iṣẹ́ Jésù, pàápàá ìjìyà, ikú, àjíǹde àti ògo rẹ̀. Ṣùgbọ́n ẹsẹ yìí kò sọ pé ikú nìkan ni ó túmọ̀ sí; fífi ‘wákàtí rẹ̀’ sílẹ̀ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá ìṣètò tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo ‘gbá a mú’ àti ‘gbé ọwọ́ lé e’ láti pa àwòrán àti ìtumọ̀ Gíríìkì mọ́ láì sọ ọ̀rọ̀ náà di èdè òfin ju bí orísun ṣe sọ lọ.
