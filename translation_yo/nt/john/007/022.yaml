source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: yo
  text: Nítorí èyí, Mósè ti fún yín ní ìkọlà—kì í ṣe pé láti ọ̀dọ̀ Mósè ni ó ti wá, bí kò ṣe láti ọ̀dọ̀ àwọn baba ńlá—ẹ̀yin sì ń kọ ọkùnrin ní ìkọlà ní ọjọ́ Ìsinmi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó mú agbára àsopọ̀ tí ń fi ìdí ọ̀rọ̀ hàn jáde lọ́nà àdánidá ní Yorùbá, láì sọ ọ́ di ìparí ọ̀rọ̀ lásán.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni orúkọ tí ó ti fìdí múlẹ̀ ní èdè Yorùbá fún Moses.
- source_word: δέδωκεν ὑμῖν τὴν περιτομήν
  choice: ti fún yín ní ìdádọ̀dọ́
  rationale: Àmì ‘ti’ fi iṣẹ́ tí a ṣe nígbà àtijọ́ tí ipa rẹ̀ ṣì dúró hàn; ‘ìdádọ̀dọ́’ sì tọ́ka sí ìlànà àti iṣẹ́ circumcision láì fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: kì í ṣe pé ó ti ọ̀dọ̀ Mósè wá, bí kò ṣe láti ọ̀dọ̀ àwọn baba ńlá
  rationale: Ó pa àlàyé àárín gbólóhùn àti èrò orísun ìṣe náà mọ́; ‘àwọn baba ńlá’ tọ́ka sí àwọn baba ìran ṣáájú Mósè.
- source_word: ἐν σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún Sabbath, ó sì bá ìṣe tí wọ́n máa ń ṣe déédéé mu.
- source_word: περιτέμνετε ἄνθρωπον
  choice: ẹ̀yin sì ń dádọ̀dọ́ ọkùnrin
  rationale: Àkókò ìṣe tí ń lọ ń fi àṣà tí wọ́n máa ń ṣe hàn; ‘ọkùnrin’ pa ìtọ́kasí sí akọ tí ìdádọ̀dọ́ kan mọ́.
theological_decisions:
- issue: Ta ni ‘àwọn baba ńlá’ ń tọ́ka sí?
  choice: Àwọn baba ìran Ísírẹ́lì ṣáájú Mósè, pàápàá àwọn baba ńlá ìgbàanì tí ìdádọ̀dọ́ bẹ̀rẹ̀ lọ́dọ̀ wọn.
  alternative: Gbogbo àwọn baba ńlá Ísírẹ́lì ní ìtumọ̀ gbòòrò.
  rationale: Ọ̀rọ̀ náà tẹnumọ́ pé ìdádọ̀dọ́ ti wà ṣáájú Òfin Mósè; ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘ìdádọ̀dọ́’ dípò ọ̀rọ̀ àṣà bí ‘ìkọlà’ láti yà circumcision kúrò ní fífi ilà sí ara. Àwọn àmì gígùn (—) pa ìrísí àlàyé àárín gbólóhùn Gíríìkì mọ́.
