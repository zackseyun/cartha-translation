  to: Nítorí èyí, Mósè ti fún yín ní ìkọlà—kì í ṣe pé láti ọ̀dọ̀ Mósè ni ó ti wá, bí kò ṣe láti ọ̀dọ̀ àwọn baba ńlá—ẹ̀yin sì ń kọ ọkùnrin ní ìkọlà ní ọjọ́ Ìsinmi.
  rationale: Àtúnṣe náà yí ọ̀rọ̀ pàtàkì περιτομή padà sí ‘ìkọlà,’ ó sì mú ìtumọ̀ ìpilẹ̀/orísun nínú àlàyé àárín gbólóhùn hàn kedere. A pa àkókò pípé ‘ti fún,’ ìtumọ̀ àwọn baba ńlá, àti ìtọ́kasí sí ọkùnrin nínú ìṣe ìkọlà mọ́.
