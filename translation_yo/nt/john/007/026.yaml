id: JHN.7.26
reference: John 7:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: yo
  text: Ẹ wò ó, ó ń sọ̀rọ̀ ní gbangba, wọn kò sì sọ ohunkóhun fún un. Ṣé ó ṣeé ṣe pé àwọn alákòóso mọ̀ ní tòótọ́ pé ẹni yìí ni Mèsáyà náà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àbí àwọn alákòóso ti mọ̀ ní tòótọ́ pé ẹni yìí ni Mèsáyà náà?”
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδε
  choice: Ẹ wò ó
  rationale: A lo gẹ́gẹ́ bí ọ̀rọ̀ ìpe àfiyèsí tó bá Yorùbá òde òní mu, dípò ọ̀rọ̀ àsọdùn tàbí ti àtijọ́.
- source_word: παρρησίᾳ
  choice: ní gbangba
  rationale: Ó fi hàn pé Jésù ń sọ̀rọ̀ ní gbangba láìfi ara pamọ́; èyí bá ipò ìkọ́ni rẹ̀ ní gbangba mu ju fífi ìgboyà nìkan tẹnumọ́ lọ.
- source_word: λαλεῖ
  choice: ó ń sọ̀rọ̀
  rationale: Àmì ‘ń’ mú ìṣe tó ń lọ lọ́wọ́ nínú ìran náà jáde ní Yorùbá àdánidá.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: wọn kò sì sọ ohunkóhun fún un
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì mọ́ láìfi ‘lòdì sí i’ kún un, bí ó tilẹ̀ jẹ́ pé àyíká lè tọ́ka sí ìtumọ̀ bẹ́ẹ̀.
- source_word: μήποτε
  choice: Ṣé ó ṣeé ṣe pé
  rationale: Ó mú ìbéèrè oníyèméjì àti ìyàlẹ́nu àwọn ènìyàn jáde, láìsọ ọ́ di ìkọ̀sẹ̀ pátápátá.
- source_word: ἀληθῶς
  choice: ní tòótọ́
  rationale: Ó pa agbára adverb náà mọ́ ní ọ̀nà tó wọ́pọ̀, tó sì níyì nínú Yorùbá.
- source_word: ἔγνωσαν
  choice: mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé aorist ni fọ́ọ̀mù Gíríìkì, ‘mọ̀’ jẹ́ ọ̀nà àdánidá láti sọ ipò ìmọ̀ tàbí ìdánimọ̀ tí ìbéèrè náà ń tọ́ka sí.
- source_word: οἱ ἄρχοντες
  choice: àwọn alákòóso
  rationale: Ó dúró sún mọ́ ìtumọ̀ àwọn tó ní àṣẹ ìṣàkóso, ó sì bá àyíká àwọn olórí Júù mu.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: pé ẹni yìí ni Mèsáyà náà
  rationale: ‘Mèsáyà’ fi Χριστός hàn gẹ́gẹ́ bí oyè ẹni àmì òróró tí àwọn ènìyàn ń retí, kì í ṣe bí orúkọ lasan.
theological_decisions:
- issue: Ìtumọ̀ ὁ χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà náà
  alternative: Kristi náà
  rationale: Nínú àyíká yìí, Χριστός jẹ́ oyè Mèsáyà tí àwọn Júù ń retí. ‘Mèsáyà’ pa àyíká Hébérù àti ìbéèrè àwọn ènìyàn mọ́, láìsọ ọ́ di orúkọ ẹni.
- issue: Agbára ìbéèrè μήποτε
  choice: Ṣé ó ṣeé ṣe pé …?
  alternative: Àbí … ti mọ̀ ní tòótọ́ …?
  rationale: Ọ̀rọ̀ Gíríìkì lè fi ìfojúsọ́nà pẹ̀lú ìyàlẹ́nu tàbí iyèméjì hàn. Ọ̀rọ̀ inú ẹsẹ̀ mú ìṣiyèméjì náà jáde, àlàyé ìsàlẹ̀ sì pa ọ̀nà míì tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba. A lo “Ẹ wò ó” gẹ́gẹ́ bí ọ̀rọ̀ ìpe àfiyèsí, “ní gbangba” fún ọ̀rọ̀ tí a sọ láìfi ara pamọ́, àti “Mèsáyà” gẹ́gẹ́ bí oyè.
