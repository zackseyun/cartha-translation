  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: yo
  text: Nítorí náà, àwọn kan lára àwọn ará Jerúsálẹ́mù ń sọ pé, “Ṣé kì í ṣe ọkùnrin tí wọ́n ń wá láti pa nìyí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: ń sọ
  rationale: Àkókò imperfect fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; “ń sọ” mú ìrísí yìí jáde.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí àbájáde tàbí ìtẹ̀síwájú ìtàn.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó tọ́ka sí iye kan tí a kò sọ pàtó lára ẹgbẹ́ náà.
- source_word: ἐκ τῶν Ἱεροσολυμιτῶν
  choice: lára àwọn ará Jerúsálẹ́mù
  rationale: ἐκ túmọ̀ sí pé àwọn ẹni náà jẹ́ díẹ̀ lára àwọn olùgbé Jerúsálẹ́mù; “ará Jerúsálẹ́mù” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ olùgbé ibẹ̀.
- source_word: Οὐχ
  choice: Ṣé kì í ṣe ...?
  rationale: Ìbéèrè yìí ń retí ìdáhùn ìjẹ́rìí; ìkọ̀lé Yorùbá yìí pa ipa ọ̀rọ̀ ìbéèrè náà mọ́.
- source_word: οὗτός
  choice: '... nìyí'
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí Jésù tó wà níwájú wọn; “nìyí” jẹ́ ìkọ̀lé àdánidá ní Yorùbá.
- source_word: ζητοῦσιν
  choice: wọ́n ń wá
  rationale: Present tense fi ète tí ó ṣì ń lọ lọ́wọ́ hàn; “ń wá” pa ìrísí ìṣe náà mọ́.
- source_word: ἀποκτεῖναι
  choice: láti pa
  rationale: Èyí ni ìtumọ̀ tààrà ti infinitive náà, láìfi ìtumọ̀ ìdájọ́ tàbí àṣà ẹ̀sìn kún un.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbo. “Àwọn ará Jerúsálẹ́mù” túmọ̀ Ἱεροσολυμιτῶν ní ti àwọn olùgbé ìlú náà, “lára” sì pa agbára ἐκ mọ́; nítorí náà kò sí ìdí fún àlàyé ìsàlẹ̀ ojú ìwé.
