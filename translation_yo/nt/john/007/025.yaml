  source_fidelity: The translation accurately represents the imperfect Ἔλεγον with “ń sọ,” the unspecified subset in τινες ἐκ τῶν Ἱεροσολυμιτῶν with “àwọn kan lára àwọn ará Jerúsálẹ́mù,” and the present intent of ζητοῦσιν with “wọ́n ń wá.” The rhetorical question introduced by Οὐχ is faithfully conveyed by “Ṣé kì í ṣe ...?” The infinitive ἀποκτεῖναι is plainly and correctly rendered “láti pa.”
  naturalness: The Yoruba is fluent, modern, and suitably dignified. “Àwọn kan lára àwọn ará Jerúsálẹ́mù ń sọ pé” is idiomatic, and the final question is natural Yoruba discourse.
  terminology: “Ará Jerúsálẹ́mù” appropriately denotes Jerusalem’s inhabitants, without implying merely ethnic or religious affiliation. “Ọkùnrin” is appropriate here for the demonstratively identified male person. No theological terminology creates concern.
