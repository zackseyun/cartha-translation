id: JHN.7.27
reference: John 7:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: yo
  text: Ṣùgbọ́n àwa mọ̀ ibi tí ọkùnrin yìí ti wá; ṣùgbọ́n nígbà tí Mèsáyà[a] bá dé, kò sí ẹni tí ó mọ̀ ibi tí ó ti wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: Àṣàyàn ìtumọ̀ míì fún oyè Gíríìkì náà, Χριστός.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ ọ̀rọ̀ yìí sí ohun tí a sọ ṣáájú hàn ní ọ̀nà tó ṣe déédé ní Yorùbá.
- source_word: τοῦτον
  choice: ọkùnrin yìí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà ń tọ́ka sí Jésù gẹ́gẹ́ bí ẹni pàtó; ‘ọkùnrin yìí’ jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtẹnumọ́ náà mọ́.
- source_word: οἴδαμεν
  choice: àwa mọ
  rationale: ‘Mọ’ sọ ìmọ̀ tí àwọn olùsọ̀rọ̀ ní péye, ‘àwa’ sì mú ìtẹnumọ́ inú ọ̀rọ̀ Gíríìkì náà jáde ní Yorùbá.
- source_word: πόθεν ἐστίν
  choice: ibi tí … ti wá
  rationale: Ó sọ orísun ẹni ní èdè Yorùbá òde òní tó ṣe déédé, ó sì jẹ́ kí àtúnwí ọ̀rọ̀ náà dúró nínú ìpín méjèèjì.
- source_word: ὁ δὲ χριστός
  choice: ṣùgbọ́n … Mèsáyà
  rationale: ‘Ṣùgbọ́n’ pa ìyàtọ̀ náà mọ́; ‘Mèsáyà’ fi hàn pé χριστός jẹ́ oyè ẹni àmì òróró tí àwọn ènìyàn ń retí, kì í ṣe orúkọ lásán.
- source_word: ὅταν ἔρχηται
  choice: nígbà tí … bá dé
  rationale: Ìlànà ‘nígbà tí … bá’ bá ọ̀rọ̀ ọjọ́ iwájú tí a ń retí mu, ‘dé’ sì jẹ́ ọ̀nà àdánidá láti sọ wíwá ẹni.
- source_word: οὐδεὶς γινώσκει
  choice: kò sí ẹni tí ó mọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ ìkọ̀sílẹ̀ gbogbo ènìyàn, láìfi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹsẹ yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni àmì òróró tí àwọn Júù ń retí. ‘Mèsáyà’ pa àyíká àti ìtumọ̀ oyè náà mọ́ ju lílo ‘Kristi’ bí ẹni pé ó jẹ́ orúkọ lọ.
- issue: Irú ohun tí ọ̀pọ̀ ènìyàn sọ nípa orísun Mèsáyà
  choice: A túmọ̀ gbólóhùn wọn bí wọ́n ṣe sọ ọ́, láìjẹ́rìí sí i tàbí ṣàlàyé rẹ̀ síwájú.
  alternative: Kí a fi àlàyé kún un pé ‘kò sí ẹni tí ó mọ ibi tí Mèsáyà yóò ti wá.’
  rationale: Ẹsẹ náà ń ròyìn ohun tí àwọn ènìyàn gbà gbọ́; kì í ṣe pé akọ̀ròyìn ń fi í múlẹ̀ gẹ́gẹ́ bí ẹ̀kọ́. Fífi ọ̀rọ̀ náà sílẹ̀ bí ó ti rí pa ìforígbárí ẹ̀kọ́ inú àyíká náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì pa àtúnwí àti ìyàtọ̀ inú gbólóhùn Gíríìkì mọ́ láìsọ ọ̀rọ̀ àwọn ènìyàn di ẹ̀kọ́ akọ̀ròyìn.
