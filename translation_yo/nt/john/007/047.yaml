  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: yo
  text: Nítorí náà, àwọn Farisí dá wọn lóhùn pé, “Ṣé ẹ̀yin náà ti ṣìnà ni?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ẹ̀yin náà ti tàn jẹ ni?” Ọ̀rọ̀ náà lè túmọ̀ sí pé a darí ènìyàn sí àṣìṣe tàbí pé a tàn án jẹ; “ti ṣìnà” pa èrò pé wọ́n ti ṣá kúrò nínú òtítọ́ mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: dá wọn lóhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan fèsì nínú ìjíròrò.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìbáṣepọ̀ àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn, gẹ́gẹ́ bí Gíríìkì ṣe rí.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Arọ́pò-orúkọ náà tọ́ka sí àwọn tí àwọn Farisí ń dá lóhùn.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ náà ní Yorùbá, pẹ̀lú àmì ọ̀pọ̀ tí ó bá àpilẹ̀kọ Gíríìkì mu ní ọ̀nà àdánidá.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Ṣé a tún ti ... yín ... ni?
  rationale: Ìṣètò ìbéèrè Yorùbá yìí mú ìtumọ̀ ‘ẹ̀yin pẹ̀lú’ àti ìbéèrè àsọyé tí ń retí ìdáhùn òdì jáde láìfi ọ̀rọ̀ àfikún bí ‘dájúdájú’ sínú ẹsẹ̀.
- source_word: πεπλάνησθε
  choice: ti mú yín ṣìnà
  rationale: Ó pa ìrísí perfect passive mọ́, ó sì sọ pé a ti tan tàbí darí wọn wọ inú àṣìṣe; ‘mú ... ṣìnà’ jẹ́ Yorùbá àdánidá fún ìdarí-kúrò-lójú-ọ̀nà.
theological_decisions:
- issue: Agbára àsọyé inú ìbéèrè tí μή bẹ̀rẹ̀
  choice: A lò ìbéèrè àsọyé tí ó ń retí ìdáhùn òdì, láìsọ ìfojúsọ́nà náà ní gbangba ju orísun lọ.
  alternative: “Ẹ̀yin náà kò lè jẹ́ kí a tàn yín jẹ, àbí?”
  rationale: μή ń fi hàn pé àwọn Farisí ń retí ‘rárá’; ṣùgbọ́n ìṣètò ìbéèrè Yorùbá lè gbé ìfojúsọ́nà àti ẹ̀gàn náà jáde láìfi ìtumọ̀ tí ó pọ̀ ju ti Gíríìkì lọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìbéèrè náà pa ìró ẹ̀gàn àwọn Farisí mọ́ láìdi ọ̀rọ̀ náà mọ́ ẹ̀kọ́ ìjọ kan.
