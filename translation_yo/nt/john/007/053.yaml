  naturalness: Gbólóhùn ẹsẹ náà jẹ́ Yorùbá Standard tó mọ́, tó sì yẹ fún ìforígbárí Bíbélì. Àmì ohùn àwọn ọ̀rọ̀ Yorùbá pàtàkì wà ní ipò tó yẹ. A tún ìwé-àlàyé náà ṣe díẹ̀ kí ó lè ye ẹni tó kà á, pàápàá níbi tí ó ti ń tọ́ka sí àwọn èdè àti ìtàn àfọwọ́kọ.
  terminology: “Obìnrin tí wọ́n mú nínú panṣágà” jẹ́ ọ̀nà tó bá ìtumọ̀ adulterous woman mu nínú Yorùbá. A ṣàlàyé Coptic àti Syriac gẹ́gẹ́ bí àwọn èdè/ìtumọ̀, a sì mú ọ̀rọ̀ nípa ‘àṣà ìtàn ẹnu’ rọrùn kí ó má sọ ìpinnu ìtàn-àfọwọ́kọ tí a ń jiyàn lé e lórí ju bó ṣe yẹ lọ.
  issues:
