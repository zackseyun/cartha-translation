    rationale: Ìyípadà ibi ìtàn náà ń fi hàn pé ìtàn náà ní ìtàn-àfọwọ́kọ tó díjú, ṣùgbọ́n kò fi ìpilẹ̀ṣẹ̀ rẹ̀ gẹ́gẹ́ bí àṣà ẹnu múlẹ̀ láìsí àríyànjiyàn. A yẹ kí ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìtumọ̀-àfọwọ́kọ mọ́.
  - severity: low
