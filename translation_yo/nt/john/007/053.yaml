translation:
  language: yo
  text: Olúkúlùkù sì lọ sí ilé tirẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí ni ìbẹ̀rẹ̀ ìtàn obìnrin tí wọ́n mú nínú panṣágà (Jòhánù 7:53–8:11). Gbogbo apá yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì ìbẹ̀rẹ̀ jù lọ, títí kan àwọn papírúsì ti ọ̀rúndún kẹta àti Codex Sinaiticus àti Codex Vaticanus ti ọ̀rúndún kẹrin; bẹ́ẹ̀ náà ni kò sí nínú àwọn ìtumọ̀ ìbẹ̀rẹ̀ sí èdè Kọ́pítì àti Síríákì. Ó wà nínú Codex Bezae ti ọ̀rúndún karùn-ún, nínú àṣà àwọn àfọwọ́kọ Látìn, àti nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ Byzantium tó wá lẹ́yìn náà. Nínú àwọn àfọwọ́kọ kan, a fi ìtàn náà sí àwọn ibi mìíràn, bíi lẹ́yìn Jòhánù 21:25 tàbí Lúùkù 21:38; èyí ń fi hàn pé ìtàn náà ní ìtàn-àfọwọ́kọ tó díjú, àti pé ó lè ti tàn ká lọ́tọ̀ kí wọ́n tó fi sínú ìṣàn àfọwọ́kọ náà. A pa á mọ́ síbí nítorí ipò pàtàkì tí ó ní nínú ìgbàgbọ́ àti ìtọ́jú àwọn Kristẹni, àti nítorí pé wọ́n ti nífẹ̀ẹ́ sí i, wọ́n sì ti ń kà á fún nǹkan bí ẹgbẹ̀rún kan àti ẹ̀ẹ́dẹ́gbẹ̀ta ọdún.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: sì
  rationale: Ní ìbẹ̀rẹ̀ gbólóhùn yìí, “sì” ń bá ìtàn lọ lọ́nà àdánidá, ó sì pa ìsopọ̀ tí Καί ní mọ́.
- source_word: ἐπορεύθη
  choice: lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílọ tàbí rírìn-àjò; nínú àyíká yìí, “lọ” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún bí àwọn ènìyàn ṣe tú ká.
- source_word: ἕκαστος
  choice: Olúkúlùkù
  rationale: Ó tẹnumọ́ pé ẹnì kọ̀ọ̀kan lọ lọ́tọ̀ọ̀tọ̀.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: sí ilé tirẹ̀
  rationale: Bó tilẹ̀ jẹ́ pé οἶκος lè túmọ̀ sí ilé tàbí agbo ilé, gbólóhùn Gíríìkì yìí túmọ̀ sí pé ẹnì kọ̀ọ̀kan padà sí ilé tirẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní iyì ni a lò. “Olúkúlùkù sì lọ sí ilé tirẹ̀” jẹ́ ọ̀nà àdánidá, kedere, tó sì tẹ̀lé ìtumọ̀ Gíríìkì pẹkipẹki. A fi àmì àlàyé [a] sí òpin ẹsẹ láti ṣàlàyé ìṣòro àfọwọ́kọ tó kan gbogbo Jòhánù 7:53–8:11.
