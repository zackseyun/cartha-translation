  source_fidelity: 'Ìtumọ̀ náà ní gbogbo àwọn èrò pàtàkì nínú Gíríìkì: Nikodémù sọ fún ẹgbẹ́ náà, ó ti wá sọ́dọ̀ ẹni kan tẹ́lẹ̀, ó sì jẹ́ ọmọ ẹgbẹ́ wọn. Ṣùgbọ́n “tí ó ti tọ̀ ọ́ wá” lè túmọ̀ sí lílépa tàbí wíwá ẹni náà, kì í sì ṣàfihàn ìṣísẹ̀ “wá sọ́dọ̀” (πρὸς αὐτόν) dájú. “Wá sọ́dọ̀ rẹ̀” jẹ́ ìbámu tó péye sí i, ó sì pa arọ́pò-orúkọ Gíríìkì mọ́ láìfi Jésù kún ẹsẹ náà.'
