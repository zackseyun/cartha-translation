  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: yo
  text: Nikodémù, ẹni tí ó ti wá sọ́dọ̀ rẹ̀ tẹ́lẹ̀, ẹni tí ó jẹ́ ọ̀kan nínú wọn, sọ fún wọn pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sọ fún wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ àkókò ìsinsìnyí nínú ìtàn, àkókò tí ó ti kọjá ni èdè Yorùbá máa ń lò lọ́nà àdánidá ní irú àyíká yìí. “Fún wọn” fi πρὸς αὐτούς hàn, “pé” sì jẹ́ kí ọ̀rọ̀ tí yóò tẹ̀ lé ní ẹsẹ tó kàn ṣàn lọ́nà Yorùbá.
- source_word: Νικόδημος
  choice: Nikodémù
  rationale: Ìtumọ̀-ohùn orúkọ náà ni a lò ní ìbámu pẹ̀lú àṣà ìkọ orúkọ Bíbélì ní Yorùbá.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: ẹni tí ó ti tọ̀ ọ́ wá tẹ́lẹ̀
  rationale: Èyí pa ìtumọ̀ gbolohun aláìlópó orúkọ náà mọ́, ó sì fi hàn pé ìbẹ̀wò náà ti ṣẹlẹ̀ ṣáájú ìṣẹ̀lẹ̀ yìí. “Ọ́” dúró fún ẹni tí a tọ̀ wá láìfi orúkọ Jésù kún ọ̀rọ̀ Gíríìkì.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: tí ó sì jẹ́ ọ̀kan lára wọn
  rationale: Ìtumọ̀ yìí fi ìsọfúnni ìdánimọ̀ hàn láìsọ pé ó jẹ́ ìdí tí Nikodémù fi sọ̀rọ̀.
theological_decisions:
- issue: Ẹni tí αὐτόν (“ọ́”) ń tọ́ka sí
  choice: A fi arọ́pò-orúkọ “ọ́” sílẹ̀ nínú ọ̀rọ̀, bí ó ti rí ní Gíríìkì.
  alternative: Kí a sọ ní kedere pé “ẹni tí ó ti tọ Jésù wá tẹ́lẹ̀.”
  rationale: Àyíká Ìhìn Rere Jòhánù 3:1–2 fi hàn pé Jésù ni arọ́pò-orúkọ náà ń tọ́ka sí, ṣùgbọ́n fífi “ọ́” sílẹ̀ pa ìrísí àti ìwọ̀n ìsọfúnni inú ẹsẹ náà mọ́ láìfi orúkọ tí kò sí nínú rẹ̀ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì yé òǹkàwé òde òní. A tẹ̀ lé ìṣètò àfikún ìdánimọ̀ Gíríìkì ní ọ̀nà tí ó ṣàn dáadáa ní Yorùbá. Kọ́ńmà ìparí àti “pé” fi hàn pé gbólóhùn Nikodémù ń bá a lọ ní ẹsẹ tó tẹ̀ lé.
