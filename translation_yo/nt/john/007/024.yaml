id: JHN.7.24
reference: John 7:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: yo
  text: Ẹ má ṣe dájọ́ nípa ohun tí ojú rí[a], ṣùgbọ́n ẹ ṣe ìdájọ́ òdodo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ẹ má ṣe dájọ́ nípa ìrísí òde, ṣùgbọ́n ẹ ṣe ìdájọ́ òdodo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Ẹ má ṣe dájọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ ìkìlọ̀; ìtumọ̀ yìí pa agbára àṣẹ náà mọ́ láìfi dandan túmọ̀ sí pé kí wọ́n dá ohun tí wọ́n ti ń ṣe dúró.
- source_word: κατ’ ὄψιν
  choice: nípa ohun tí ojú rí
  rationale: Ó tọ́ka sí dídájọ́ lórí ìrísí òde tàbí ohun tí ó hàn lójú; gbolohun yìí jẹ́ Yorùbá àdánidá, ó sì pa àwòrán ‘ríran’ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ọ̀nà ìdájọ́ tí a kọ̀ àti èyí tí a pàṣẹ.
- source_word: τὴν δικαίαν κρίσιν
  choice: ìdájọ́ òdodo
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí pa mejeeji ‘ìdájọ́’ àti ìwà títọ́ tàbí òdodo tí δικαίαν ń tọ́ka sí mọ́, láìdín un kù sí ìlànà ilé-ẹjọ́ nìkan.
- source_word: κρίνετε
  choice: ẹ máa ṣe ìdájọ́
  rationale: Ó tún gbòǹgbò ‘dájọ́/ìdájọ́’ lò gẹ́gẹ́ bí Gíríìkì ṣe tún κρίνετε ṣe, ṣùgbọ́n ó ṣe é ní Yorùbá tó ṣe kedere àti tó bá àṣẹ rere mu.
theological_decisions:
- issue: Ìtumọ̀ δικαίαν nínú ọ̀rọ̀ ìwà rere àti ìdájọ́
  choice: òdodo
  alternative: títọ́
  rationale: ‘Òdodo’ ní ìfarahàn ìwà rere àti ìdájọ́ tí ó bá ohun tó tọ́ mu; kò fi ọ̀rọ̀ náà sí ìdájọ́ òfin nìkan, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ púpọ̀, àti èdè tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ nítorí pé àwọn tí a ń bá sọ pọ̀ ni, a sì lo ‘ohun tí ojú rí’ gẹ́gẹ́ bí ọ̀nà àdánidá láti fi ìrísí ojú hàn.
