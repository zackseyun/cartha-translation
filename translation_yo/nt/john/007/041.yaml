  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: yo
  text: Àwọn mìíràn ń sọ pé, “Èyí ni Mèsáyà náà.” Ṣùgbọ́n àwọn kan ń sọ pé, “Mèsáyà náà kì í wá láti Galili, àbí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Àwọn mìíràn
  rationale: Ó tọ́ka sí ẹgbẹ́ mìíràn láàárín ọ̀pọ̀ ènìyàn, ó sì pa ìyàtọ̀ ẹgbẹ́ mọ́.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àkókò imperfect ní Gíríìkì ń fi ọ̀rọ̀ tí ó ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra hàn; ‘ń sọ’ jẹ́ èdè Yorùbá àdánidá fún un.
- source_word: Οὗτός ἐστιν
  choice: Èyí ni
  rationale: Ọ̀nà Yorùbá tí ó ṣe déédéé láti dá ẹni tí a ń tọ́ka sí mọ̀ nìyí.
- source_word: ὁ χριστός
  choice: Mèsáyà náà
  rationale: Χριστός jẹ́ oyè ẹni àmì-oróró tí àwọn ènìyàn ń retí níbí; ‘Mèsáyà’ pa ìtumọ̀ Hébérù àti ìjiyàn inú ọ̀rọ̀ náà mọ́.
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n àwọn kan
  rationale: δέ mú ìyàtọ̀ wá, article plural sì ń tọ́ka sí ẹgbẹ́ mìíràn; ‘àwọn kan’ yẹra fún àtúnṣe ‘àwọn mìíràn’ tí kò fi dandan sí.
- source_word: Μὴ γὰρ
  choice: kò lè ... àbí ó lè ...?
  rationale: μή mú kí ìbéèrè náà retí ìdáhùn òdì; ìbéèrè àmì ‘àbí ó lè wá?’ fi agbára ìbéèrè àsọyé náà hàn ní Yorùbá àdánidá, γάρ sì wà nínú ìtẹnumọ́ gbogbo gbólóhùn náà.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: láti Galili
  rationale: ἐκ tọ́ka sí ibi ìpilẹ̀ṣẹ̀; ‘láti’ ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἔρχεται
  choice: wá
  rationale: Present náà sọ ìfojúsọ́nà gbogbogbò nípa ibi tí Mèsáyà ti máa ń wá; ‘wá’ bá ọ̀rọ̀ Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹsẹ yìí, Χριστός jẹ́ oyè ẹni tí àwọn ènìyàn ń retí, kì í ṣe orúkọ lasán. ‘Mèsáyà’ pa ìtumọ̀ ẹni àmì-oróró àti kókó ìjiyàn àwọn ènìyàn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣeé lóye ni a lò. Àmì ohùn kún ibi tí ó yẹ. Ìbéèrè ìkẹyìn jẹ́ àsọyé tí ó retí ìdáhùn òdì, láì sọ ìmọ̀ nípa ibi ìbí Jésù sínú ẹsẹ náà.
