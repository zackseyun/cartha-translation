id: JHN.7.17
reference: John 7:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá fẹ́ ṣe ìfẹ́ Ọlọ́run, yóò mọ̀ nípa ẹ̀kọ́ náà, bóyá láti ọ̀dọ̀ Ọlọ́run ni ó ti wá, tàbí pé èmi ń sọ̀rọ̀ láti ara mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ti ara mi” tàbí “lórí àṣẹ ara mi.” Gíríìkì sọ ní tààrà pé, “láti ara mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Bí ẹnikẹ́ni bá fẹ́
  rationale: Ètò ἐάν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń fi ipò gbogbogbò hàn. “Bá fẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́ tàbí ìmúratán ẹni.
- source_word: τὸ θέλημα αὐτοῦ
  choice: ìfẹ́ rẹ̀
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ohun tí ẹnìkan fẹ́ kí a ṣe. Arọ́pò-orúkọ náà ni a pa mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì; nínú àyíká ọ̀rọ̀, Ọlọ́run ni “rẹ̀” ń tọ́ka sí.
- source_word: ποιεῖν
  choice: ṣe
  rationale: Pẹ̀lú θέλημα, ποιεῖν túmọ̀ sí ṣíṣe tàbí mímú ìfẹ́ ẹnìkan ṣẹ; “ṣe ìfẹ́ rẹ̀” jẹ́ gbólóhùn Yorùbá tó ṣe tààrà, tó sì wọ́pọ̀.
- source_word: γνώσεται
  choice: yóò mọ̀
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ń sọ ìmọ̀ tàbí òye tí yóò yọrí sí; “yóò mọ̀” pa ìtumọ̀ náà mọ́ láìfi ìlànà ìmọ̀ kan kún un.
- source_word: περὶ τῆς διδαχῆς
  choice: nípa ẹ̀kọ́ náà
  rationale: περί pẹ̀lú genitive túmọ̀ sí “nípa,” διδαχή sì ni “ẹ̀kọ́.” “Náà” tọ́ka sí ẹ̀kọ́ Jésù tí wọ́n ń jíròrò.
- source_word: πότερον ... ἢ
  choice: bóyá ... tàbí pé
  rationale: Ètò yìí gbé ọ̀nà méjì kalẹ̀. “Bóyá ... tàbí pé” jẹ́ ìsọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìyàtọ̀ àwọn ọ̀nà méjèèjì mọ́.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: láti ọ̀dọ̀ Ọlọ́run ni ó ti wá
  rationale: ἐκ ń tọ́ka sí orísun. Yorùbá àdánidá máa ń sọ ohun tó “wá láti ọ̀dọ̀” ẹnìkan; fífi “ti wá” kún un mú àjọṣe orísun náà hàn láìyí ìtumọ̀ padà.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: láti ara mi
  rationale: Ìtumọ̀ tààrà ni “láti ara mi,” èyí tó pa àwòrán orísun mọ́. Àwọn ìtumọ̀ tó lè tú u sí “ní ti ara mi” tàbí “lórí àṣẹ ara mi” wà nínú àlàyé ìsàlẹ̀.
- source_word: λαλῶ
  choice: èmi ń sọ̀rọ̀
  rationale: Present tense náà bá ìṣe tó ń lọ nínú ọ̀rọ̀ Jésù mu. Fífi “èmi” hàn pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, “ń sọ̀rọ̀” sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí αὐτοῦ nínú “ìfẹ́ rẹ̀” ń tọ́ka sí
  choice: Arọ́pò-orúkọ “rẹ̀” ni a pa mọ́, bí ó tilẹ̀ jẹ́ pé Ọlọ́run ni ó ń tọ́ka sí nínú àyíká ọ̀rọ̀.
  alternative: A lè sọ ọ́ ní kedere pé “ìfẹ́ Ọlọ́run.”
  rationale: Àyíká ọ̀rọ̀ sọ pé wọ́n ń wádìí bóyá ẹ̀kọ́ Jésù wá láti ọ̀dọ̀ Ọlọ́run. Pípa arọ́pò-orúkọ náà mọ́ ń tẹ̀ lé Gíríìkì, kò sì fi àlàyé tí kò pọn dandan kún ọ̀rọ̀ náà.
- issue: Agbára ìtumọ̀ ἀπ’ ἐμαυτοῦ
  choice: “láti ara mi,” tó ń tẹnumọ́ orísun ọ̀rọ̀ náà.
  alternative: “ní ti ara mi” tàbí “lórí àṣẹ ara mi.”
  rationale: Gíríìkì sọ ní tààrà nípa orísun. Ó lè ní ìtumọ̀ jíjinlẹ̀ pé Jésù kò sọ̀rọ̀ lórí àṣẹ tirẹ̀ nìkan, ṣùgbọ́n a kò sọ ìtumọ̀ yẹn di pàtó ju ọ̀rọ̀ orísun lọ nínú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, èdè òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìtumọ̀ náà lo ètò gbolohun àdánidá Yorùbá, ó sì pa ìyàtọ̀ tó wà láàárín orísun ẹ̀kọ́ láti ọ̀dọ̀ Ọlọ́run àti sísọ̀rọ̀ láti ara ẹni mọ́.
