id: JHN.7.34
reference: John 7:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: yo
  text: Ẹ̀yin yóò wá mi, ẹ kò sì ní rí mi, àti ibi tí mo wà, ẹ̀yin kò sì lè wá síbẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: ẹ̀yin yóò wá
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà túmọ̀ sí pé wọn yóò wá Jésù. ‘Wá’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì bá àyíká ọ̀rọ̀ nípa fífẹ́ rí ẹni kan mu.
- source_word: με
  choice: mi
  rationale: Arọ́pò-orúkọ olùgbà-ìṣe náà ń tọ́ka sí Jésù.
- source_word: οὐχ εὑρήσετε
  choice: ẹ kò sì ní rí mi
  rationale: Èyí fi ìsẹ́-ọrọ̀ ọjọ́ iwájú tí a sẹ́ hàn láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: ibi tí mo wà
  rationale: Èyí pa ìtumọ̀ ibi mọ́. ‘Mo’ dúró gẹ́gẹ́ bí ẹni tí a ń fi wé ‘ẹ̀yin,’ láìṣe àfikún èrò mìíràn.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: ẹ̀yin kò sì lè wá síbẹ̀
  rationale: ‘Kò lè’ sọ àìlágbára di mímọ́, kì í ṣe àìgbàṣẹ; ‘wá síbẹ̀’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ wíwá sí ibi tí olùsọ̀rọ̀ tọ́ka sí.
theological_decisions:
- issue: Irú àìlágbára tó wà nínú ‘ẹ̀yin kò lè wá síbẹ̀’
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àìlágbára, láìsọ bóyá ó jẹ́ ti ìwà, ti ẹ̀mí, ti ìdájọ́, tàbí fún ìgbà díẹ̀.
  alternative: ‘A kò gbà yín láyè láti wá síbẹ̀,’ èyí tó lè túmọ̀ sí ìfòfindè.
  rationale: δύνασθε ń sọ nípa agbára tàbí àǹfààní láti ṣe ohun kan, kì í ṣe ní pàtàkì nípa gbígba àṣẹ. Ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé ìdí àìlágbára náà.
translation_notes:
  register: Yorùbá àgbàṣe tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. ‘Ẹ̀yin’ pa ọ̀pọ̀ ènìyàn àti ìyàtọ̀ tó wà láàárín ‘èmi’ àti ‘ẹ̀yin’ mọ́; ‘ẹ’ ni a lò nínú ìsẹ́-ọrọ̀ gẹ́gẹ́ bí àṣà Yorùbá.
