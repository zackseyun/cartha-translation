id: JHN.7.18
reference: John 7:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: yo
  text: Ẹni tí ó ń sọ̀rọ̀ láti ara rẹ̀[a] ń wá ògo tirẹ̀; ṣùgbọ́n ẹni tí ó ń wá ògo ẹni tí ó rán án, òun ni olóòótọ́[b], kò sì sí àìṣòdodo kankan nínú rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọ̀dọ̀ ara rẹ̀” tàbí “lórí àṣẹ ara rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni òtítọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àìdájọ́ òdodo” tàbí “ìwà búburú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: láti inú ara rẹ̀
  rationale: Ó pa ìtumọ̀ gangan ‘láti ara rẹ̀’ mọ́, ó sì jẹ́ kí ìyàtọ̀ láàárín ọ̀rọ̀ tí ó ti ọ̀dọ̀ ẹni fúnra rẹ̀ wá àti jíjẹ́ ẹni tí a rán hàn gbangba; àlàyé ẹsẹ̀ ìsàlẹ̀ fi àwọn ìtumọ̀ tí ó túmọ̀ sí àṣẹ ara ẹni hàn.
- source_word: λαλῶν
  choice: tí ó bá ń sọ̀rọ̀
  rationale: Ó mú participle tí ń ṣàpèjúwe ẹni kan jáde ní Yorùbá àdánidá, ó sì tọ́ka sí ìlànà gbogbogbò, kì í ṣe ìṣẹ̀lẹ̀ ẹyọ kan ṣoṣo.
- source_word: δόξαν
  choice: ògo
  rationale: ‘Ògo’ ni ọ̀rọ̀ Yorùbá tí ó yẹ fún δόξα, ó sì pa ìtumọ̀ ọlá àti ìgbéga tó ní ìjìnlẹ̀ ẹ̀kọ́ ní Jòhánù mọ́.
- source_word: τὴν ἰδίαν
  choice: tirẹ̀
  rationale: Ó fi ohun tí ó jẹ́ ti ẹni náà fúnra rẹ̀ hàn ní ṣókí, ó sì dá ìyàtọ̀ sí ‘ògo ẹni tí ó rán an’ dúró.
- source_word: ζητεῖ
  choice: ń wá
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá àdánidá fún ζητέω, ó sì pa àtúnṣe ọ̀rọ̀ náà mọ́ nínú àwọn apá méjèèjì.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: ẹni tí ó rán an
  rationale: Ó pa ipa ẹni tó ránṣẹ́ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere tí kò fi ìtumọ̀ míì kún un.
- source_word: οὗτος
  choice: òun ni
  rationale: ‘Òun ni’ mú ìtẹnumọ́ demonstrative náà jáde lọ́nà tí ó bá èdè Yorùbá mu ju ‘ẹni yìí’ lọ nínú gbólóhùn yìí.
- source_word: ἀληθής
  choice: olóòótọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ṣàpèjúwe ẹni tí ó jẹ́ ẹni ìgbẹ́kẹ̀lé tí kò sì ní èké; ‘olóòótọ́’ jẹ́ àdánidá ní Yorùbá, nígbà tí àlàyé fi ‘ẹni òtítọ́’ hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: ἀδικία
  choice: àìṣòdodo
  rationale: Ó pa ìwọ̀n ìwà rere àti ti ìdájọ́ tí ἀδικία ní mọ́, láì dín un kù sí ìwà búburú kan pàtó.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: kò sì sí ... kankan nínú rẹ̀
  rationale: Ó mú ọ̀nà existential Gíríìkì náà jáde ní Yorùbá tí ó ṣe kedere, ó sì pa àpèjúwe ohun tí kò sí nínú ẹni náà mọ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín sísọ̀rọ̀ láti inú ara ẹni àti wíwá ògo ẹni tí ó rán ni
  choice: 'A pa ọ̀rọ̀ iṣẹ́-rírán àti ète ògo mọ́: ọ̀rọ̀ tí ó ti inú ara ẹni wá ń lépa ògo ara ẹni, ṣùgbọ́n olóòótọ́ ń lépa ògo ẹni tí ó rán an.'
  alternative: Kí ‘láti inú ara rẹ̀’ túmọ̀ ní pàtó sí ‘nípa àṣẹ ara rẹ̀,’ tàbí kí a sọ ọ́ di ìdájọ́ nípa gbogbo olùkọ́ èké.
  rationale: Àyíká ẹsẹ̀ náà dá lórí orísun àti ète ẹ̀kọ́. Ìtumọ̀ yìí kò fi ẹ̀ka ẹ̀kọ́ ìgbà tó tẹ̀ lé e wọ inú ohun tí Gíríìkì sọ.
- issue: Ìtumọ̀ ἀληθής
  choice: olóòótọ́
  alternative: ẹni òtítọ́
  rationale: ἀληθής lè túmọ̀ sí ẹni tí ó jẹ́ òtítọ́ tàbí ẹni tí ó ń sọ òtítọ́. ‘Olóòótọ́’ bá ìwà ìgbẹ́kẹ̀lé nínú àyíká mu, ṣùgbọ́n a pa àṣàyàn tó fẹ̀ sí ‘true’ mọ́ nínú àlàyé.
- issue: Ìtumọ̀ ἀδικία
  choice: àìṣòdodo
  alternative: àìṣèdájọ́ òdodo tàbí ìwà búburú
  rationale: ‘Àìṣòdodo’ pa ìtumọ̀ ìwà àti ìdájọ́ rẹ̀ mọ́ ní gbígbòòrò, láì fi í sí ààlà ìṣèlú-àwùjọ tàbí ẹ̀ṣẹ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘òun ni’ láti mú ìtẹnumọ́ οὗτος jáde lọ́nà àdánidá, a sì lo àwọn àmì ẹsẹ̀ ìsàlẹ̀ [a], [b], [c] níbi tí ọ̀rọ̀ Gíríìkì ti gba ìtumọ̀ tó ju ẹyọ kan lọ.
