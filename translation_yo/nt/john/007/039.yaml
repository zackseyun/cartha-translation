id: JHN.7.39
reference: John 7:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: yo
  text: Ó sọ èyí nípa Ẹ̀mí[a], ẹni tí àwọn tí ó gba a gbọ́ fẹ́ gba; nítorí Ẹ̀mí kò tíì wà[b], nítorí a kò tíì ṣe Jésù lógo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní àyíká ọ̀rọ̀ yìí, “Ẹ̀mí” ni Ẹ̀mí Ọlọ́run; Gíríìkì kò fi ọ̀rọ̀ náà “Mímọ́” kún un.
    reason: clarification
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ náà ní kedere sí, “nítorí a kò tíì fi Ẹ̀mí fún wọn.” Gíríìkì sọ ní ṣókí pé, “nítorí Ẹ̀mí kò tíì wà,” ó sì so èyí pọ̀ mọ́ pé a kò tíì ṣe Jésù lógo.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí Ẹ̀mí Ọlọ́run tí àwọn onígbàgbọ́ yóò gbà. A kò fi “Mímọ́” kún un, nítorí ἅγιον kò sí nínú Gíríìkì.
- source_word: οὗ
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò náà padà tọ́ka sí Ẹ̀mí; “ẹni tí” bá ìtọ́kasí ẹni mu ní Yorùbá, kò sì sọ ọ́ di ohun aláìlẹ́mìí.
- source_word: ἔμελλον λαμβάνειν
  choice: yóò gbà
  rationale: Ìtumọ̀ náà jẹ́ ìṣe tí ń bọ̀ láti ojú ìwòye ìtàn náà. “Yóò gbà” jẹ́ Yorùbá àdánidá, ó sì pa agbára ọjọ́ iwájú μέλλω mọ́ láìfi èrò àyànmọ́ kún un.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: àwọn tó gba òun gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbígbàgbọ́ nínú ẹni kan, ó sì fi àwọn tí wọ́n ti di onígbàgbọ́ hàn gẹ́gẹ́ bí àwọn tí yóò gba Ẹ̀mí.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: nítorí Ẹ̀mí kò tíì wà
  rationale: A pa kíkuru àti ìnira ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́; a kò fi “fúnni” tàbí “wá” kún un nínú ọ̀rọ̀ pàtàkì.
- source_word: ἐδοξάσθη
  choice: a ṣe ... lógo
  rationale: “Ṣe lógo” pa àkòrí Johannine ti δοξάζω mọ́, láìdín un kù sí ìgbéga nìkan.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ οὔπω γὰρ ἦν πνεῦμα láìjẹ́ kí ó dà bí ẹni pé Ẹ̀mí kò ti sí rárá ṣáájú ṣíṣe Jésù lógo.
  choice: Ẹ̀mí kò tíì wà
  alternative: a kò tíì fi Ẹ̀mí fún wọn
  rationale: Gíríìkì sọ ní ṣókí pé Ẹ̀mí “kò tíì wà”; kò sọ “fúnni.” Ọ̀rọ̀ pàtàkì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Yorùbá ìṣàkóso tó níyì, tó ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. “Òun” mú kí ẹni tí αὐτόν ń tọ́ka sí—Jésù—yà kedere sí “Ó” tó bẹ̀rẹ̀ ẹsẹ náà. A lo “yóò gbà” dípò gbolohun líle bí “wọ́n fẹ́rẹ̀ẹ́ gbà,” nítorí Yorùbá àdánidá àti nítorí iṣẹlẹ̀ náà ṣì jẹ́ ọjọ́ iwájú nínú ìtàn.
