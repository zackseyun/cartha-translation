id: JHN.7.1
reference: John 7:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí, Jésù ń rìn káàkiri ní Gálílì; nítorí kò fẹ́ rìn káàkiri ní Jùdíà, nítorí pé àwọn Júù[a] ń wá láti pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn Júù ilẹ̀ Jùdíà,” tàbí “àwọn aṣáájú Júù.” Nínú Ìhìn Rere Jòhánù, “àwọn Júù” sábà máa ń tọ́ka ní pàtàkì sí àwọn aláṣẹ Júù ní Jùdíà tàbí àwọn Júù tí wọ́n ń tako Jésù nínú àyíká ìtàn náà, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ demonstrative náà mọ́, ó sì jẹ́ àsopọ̀ àkókò tó ṣe kedere nínú ìtàn.
- source_word: περιεπάτει / περιπατεῖν
  choice: ń rìn káàkiri / rìn káàkiri
  rationale: ‘Rìn káàkiri’ jẹ́ Yorùbá àdánidá fún ìrìn tí ń bá a lọ láàárín agbègbè kan, ó sì pa àtúnlò ọ̀rọ̀-ìṣe περιπατέω ní ẹsẹ náà mọ́.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ní Galili
  rationale: Ìtumọ̀ ibi tó rọrùn, tí kò fi ohun tí orísun kò sọ kún un.
- source_word: οὐ γὰρ ἤθελεν
  choice: nítorí kò fẹ́
  rationale: Ó fi ìdí tí gbolohun àkọ́kọ́ fi rí bẹ́ẹ̀ hàn, kò sì túmọ̀ ọ́ sí àìlèṣe.
- source_word: ἐν τῇ Ἰουδαίᾳ περιπατεῖν
  choice: rìn káàkiri ní Jùdíà
  rationale: Ó pa àtúnlò περιπατέω mọ́, ó sì sọ ìrìn láàárín agbègbè náà ní Yorùbá tó ṣe kedere.
- source_word: ἐζήτουν
  choice: ń wá ọ̀nà
  rationale: Àmì ìṣe tí ń bá a lọ ni imperfect náà; pẹ̀lú infinitive tó tẹ̀ lé e, ‘ń wá ọ̀nà láti’ fi ète ọ̀tá tó ń bá a lọ hàn lọ́nà àdánidá.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Ó pa àkọlé orísun mọ́ ní pàtó, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń ṣàlàyé ẹni tí ọ̀rọ̀ náà ń tọ́ka sí nínú àyíká ìtàn yìí.
- source_word: ἀποκτεῖναι
  choice: láti pa á
  rationale: Ìtumọ̀ tààrà, kedere, àti àdánidá fún infinitive náà àti object rẹ̀.
theological_decisions:
- issue: Ẹni tí ‘οἱ Ἰουδαῖοι’ ń tọ́ka sí nínú Ìhìn Rere Jòhánù
  choice: Fi ‘àwọn Júù’ sí inú ẹsẹ, kí àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé nínú àyíká yìí ó lè tọ́ka ní pàtàkì sí àwọn Júù ará Jùdíà tàbí àwọn aṣáájú Júù tí wọ́n ń tako Jésù.
  alternative: àwọn aṣáájú Júù; àwọn ará Jùdíà
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì mọ́ láì sọ gbogbo ẹ̀yà Júù di ẹni tí a ń dá lẹ́bi; kò sì fi ìtumọ̀ kan ṣoṣo lé àìdánilójú àyíká náà lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò; ‘ń rìn káàkiri’ tún pa imperfect àti àtúnlò ọ̀rọ̀-ìṣe orísun mọ́.
