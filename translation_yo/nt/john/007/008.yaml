id: JHN.7.8
reference: John 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: yo
  text: Ẹ̀yin, ẹ gòkè lọ sí àjọ̀dún náà. Èmi kò gòkè lọ sí àjọ̀dún yìí[a], nítorí àkókò mi kò tíì dé ẹ̀kúnrẹ́rẹ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní pé, “Èmi kò tíì gòkè lọ sí àjọ̀dún yìí.”
    reason: textual_variant
  - marker: b
    text: Ó tún lè túmọ̀ sí, “àkókò tí a yàn fún mi kò tíì pé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: ẹ gòkè lọ
  rationale: Ó pa ìtumọ̀ ìlọ sókè mọ́, ní pàtàkì ìgòkè lọ sí Jerusalẹmu fún àjọ̀dún, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἑορτή
  choice: àjọ̀dún
  rationale: Ó tọ́ka sí ayẹyẹ ẹ̀sìn tí a ń ṣe ní àkókò pàtó, ó sì bá àyíká ìwé Jòhánù mu.
- source_word: οὐκ ἀναβαίνω
  choice: Èmi kò gòkè lọ
  rationale: Ó tẹ̀ lé ọ̀rọ̀ SBLGNT οὐκ, ‘kò’, láì fi ‘síbẹ̀’ kún ọ̀rọ̀ pàtàkì; irú ẹ̀dà οὔπω wà nínú àlàyé ìsàlẹ̀.
- source_word: ταύτην
  choice: yìí
  rationale: Ọ̀rọ̀ atọ́ka náà dá àjọ̀dún pàtó tí wọ́n ń sọ̀rọ̀ rẹ̀ mọ̀.
- source_word: καιρός
  choice: àkókò
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì lè gba ìtumọ̀ àkókò tí a yàn kalẹ̀ láì fi ìtumọ̀ yẹn lé ọ̀rọ̀ náà lórí.
- source_word: πεπλήρωται
  choice: kò ì tíì dé ẹ̀kúnrẹ́rẹ́
  rationale: Ó pa ìtumọ̀ pípé tàbí dídé sí ẹ̀kúnrẹ́rẹ́ ti perfect passive mọ́, dípò kí ó sọ ọ́ di ‘kò tíì dé’ lásán.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa bóyá Jésù sọ ‘kò’ tàbí ‘kò tíì’ gòkè lọ
  choice: A tẹ̀ lé οὐκ (‘kò’) ti SBLGNT nínú ọ̀rọ̀ pàtàkì.
  alternative: Àwọn àfọwọ́kọ kan ní οὔπω (‘kò tíì’).
  rationale: Èyí pa ẹ̀rí orísun tí a pèsè mọ́, kò sì yanjú ìnira ìtumọ̀ náà ní ìkọ̀kọ̀; a fi irú ẹ̀dà míì hàn ní àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ καιρός gẹ́gẹ́ bí àkókò tí a yàn kalẹ̀
  choice: àkókò mi
  alternative: àkókò tí a yàn fún mi
  rationale: ‘Àkókò’ pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ tó ṣeé ṣe pé àkókò tí a yàn kalẹ̀ ni hàn.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún. ‘Ẹ̀yin, ẹ…’ mú ìyàtọ̀ ẹni púpọ̀ ὑμεῖς hàn; ‘Èmi’ sì tẹnumọ́ ìyàtọ̀ láàárín àwọn arákùnrin rẹ̀ àti Jésù. Ọ̀rọ̀ náà jẹ́ ti òde òní, ṣùgbọ́n ó ní iyì tó yẹ fún Bíbélì.
