  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οἱ ὑπηρέται· Οὐδέποτε ⸂ἐλάλησεν οὕτως⸃ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: yo
  text: Àwọn olùṣọ́ náà dáhùn pé, “Kò sí ènìyàn kan[a] tí ó tíì sọ̀rọ̀ báyìí rí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Kò sí ẹni tí ó tíì sọ̀rọ̀ báyìí rí.” Ọ̀rọ̀ Gíríìkì náà ní “ènìyàn” ní ẹyọ, ṣùgbọ́n ó ń ṣe aṣojú ẹnikẹ́ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé wọ́n fèsì sí ohun tí a béèrè lọ́wọ́ wọn; “dáhùn” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́ nínú ìtàn.
- source_word: οἱ ὑπηρέται
  choice: àwọn olùṣọ́ náà
  rationale: Nínú àyíká ọ̀rọ̀ náà, àwọn ni a rán láti mú Jésù (7:32, 45). “Àwọn olùṣọ́” fi iṣẹ́ wọn hàn láì fi ìtumọ̀ pàtó bí “ọlọ́pàá tẹ́ńpìlì” kún ọ̀rọ̀ Gíríìkì.
- source_word: Οὐδέποτε
  choice: Kò sí ... tí ó tíì ... rí
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí ń fi ìtumọ̀ “kò ṣẹlẹ̀ nígbà kankan títí di ìsinsin yìí” hàn lọ́nà àdánidá.
- source_word: ἐλάλησεν
  choice: sọ̀rọ̀
  rationale: “Sọ̀rọ̀” ni ìtumọ̀ tó ṣe tààrà, ó sì bá ohun tí àwọn olùṣọ́ gbọ́ mu.
- source_word: οὕτως
  choice: báyìí
  rationale: Ó ń tọ́ka sí ọ̀nà tàbí irú bí Jésù ṣe sọ̀rọ̀; “báyìí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: ἄνθρωπος
  choice: ènìyàn kan
  rationale: Ἄνθρωπος tọ́ka sí ènìyàn, ó sì ní agbára aṣojú níbí. “Ènìyàn kan” pa ìtumọ̀ náà mọ́ láì sọ ọ́ di “ọkùnrin,” èyí tí yóò fi akọ kún un ju ohun tí ọ̀rọ̀ náà béèrè lọ.
theological_decisions:
- issue: Agbára aṣojú àti ìrísí akọ ti ἄνθρωπος
  choice: ènìyàn kan
  alternative: ẹni kankan; ọkùnrin kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄνθρωπος jẹ́ orúkọ ẹyọ tó ní ìrísí akọ nínú gírámà Gíríìkì, ó sábà máa ń túmọ̀ sí ènìyàn lápapọ̀. “Ènìyàn kan” pa ẹyọ àti agbára aṣojú rẹ̀ mọ́; “ọkùnrin kan” lè mú kí òǹkàwé rò pé akọ nìkan ni gbólóhùn náà ń sọ̀rọ̀ nípa.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìṣètò “kò sí ... tí ó tíì ... rí” jẹ́ àdánidá ní Yorùbá, ó sì gbé agbára Οὐδέποτε jáde dáadáa.
