  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì náà dáadáa: “Àwọn olùṣọ́ náà dáhùn” yẹ fún οἱ ὑπηρέται ἀπεκρίθησαν nínú àyíká Jòhánù, àti “Kò sí ènìyàn kan tí ó tíì sọ̀rọ̀ báyìí rí” ń gbé ìfẹ̀sùn àìsí-ìgbà-kankan ti Οὐδέποτε, ìṣe ìsọ̀rọ̀, àti ọ̀nà ìsọ̀rọ̀ (οὕτως) jáde pẹ̀lú ìfẹ̀sẹ̀mulẹ̀. “Ènìyàn kan” tún pa ẹyọ àti agbára aṣojú ti ἄνθρωπος mọ́ láì dín un sí akọ nìkan.'
