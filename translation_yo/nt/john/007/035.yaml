id: JHN.7.35
reference: John 7:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[a] sọ fún ara wọn pé, “Ibò ni ọkùnrin yìí fẹ́ lọ tí a kò fi ní rí i? Kò ha fẹ́ lọ sí ọ̀dọ̀ àwọn Júù tí wọ́n tú ká láàárín àwọn Gíríìkì[b], kí ó sì kọ́ àwọn Gíríìkì ni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn Júù lápapọ̀ tàbí, ní àwọn àyíká kan, àwọn ènìyàn láti Jùdíà.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ìtúká láàárín àwọn Gíríìkì.” Èyí ń tọ́ka sí àwọn Júù tí wọ́n tú ká, tí wọ́n sì ń gbé láàárín àwọn Gíríìkì, kì í ṣe àwọn Gíríìkì tí wọ́n tú ká.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tó ṣe déédé jù lọ ní àyíká ẹsẹ yìí; a kò fi “àwọn aṣáájú Júù” sí i, nítorí ọ̀rọ̀ Gíríìkì kò sọ bẹ́ẹ̀.
- source_word: πρὸς ἑαυτούς
  choice: bá ara wọn sọ
  rationale: Ó fi hàn pé àwọn tó wà nínú ẹgbẹ́ náà ń bá ara wọn sọ̀rọ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: Ποῦ οὗτος
  choice: Ibo ni ọkùnrin yìí
  rationale: “Ọkùnrin yìí” pa ìmọ̀lára jíjìnnà tàbí àìbọ̀wọ̀ díẹ̀ tó lè wà nínú οὗτος mọ́, láìsọ ọ́ di ẹ̀gàn tó lágbára.
- source_word: μέλλει πορεύεσθαι
  choice: fẹ́ lọ
  rationale: Nínú àsọyé yìí, gbólóhùn náà ń tọ́ka sí ohun tí Jesu ní lọ́kàn tàbí ohun tí yóò ṣe lẹ́yìn náà; “fẹ́ lọ” jẹ́ kedere, ó sì bá Yorùbá òde òní mu.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: tí a kò fi ní rí i
  rationale: Ó pa àbájáde tí àwọn olùsọ̀rọ̀ ń ronú sí mọ́, láìfi èrò pé wọn kò ní agbára láti rí i kún ọ̀rọ̀ náà.
- source_word: μὴ
  choice: Kò ha ... àbí?
  rationale: Ìbéèrè Gíríìkì ń retí ìdáhùn òdì; ìṣètò Yorùbá yìí fi ìrètí yẹn hàn ní ọ̀nà àdánidá.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: àwọn Júù tí ó tú ká láàárín àwọn Gíríìkì
  rationale: Ní ìlò Júù, διασπορά ń tọ́ka sí àwọn Júù tí wọ́n tú ká sí àárín àwọn orílẹ̀-èdè. Ìtumọ̀ yìí mú ìtọ́kasí àṣà náà yé òǹkàwé Yorùbá, kò sì túmọ̀ rẹ̀ sí ìtúká àwọn Gíríìkì fúnra wọn.
- source_word: Ἕλληνας
  choice: àwọn Gíríìkì
  rationale: Èyí pa ìtumọ̀ ẹ̀yà àti àṣà ọ̀rọ̀ Gíríìkì mọ́, láìfẹ̀ẹ́ rẹ̀ sí gbogbo àwọn Kèfèrí.
- source_word: καὶ διδάσκειν τοὺς Ἕλληνας
  choice: kí ó sì kọ́ àwọn Gíríìkì
  rationale: Ó túmọ̀ gbólóhùn aláìlẹ́ni náà ní tààràtà, ó sì pa ìyàlẹ́nu tó wà nínú àfojúsùn àwọn olùsọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖοι nínú ìtàn Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Àyíká ẹsẹ yìí kò béèrè pé ká dín ọ̀rọ̀ náà kù sí àwọn ará agbègbè Jùdíà, bẹ́ẹ̀ ni kò sọ pé àwọn aṣáájú nìkan ni. A fi àṣàyàn agbègbè náà sínú àlàyé ìsàlẹ̀.
- issue: Ta ni διασπορά ń tọ́ka sí?
  choice: àwọn Júù tí ó tú ká láàárín àwọn Gíríìkì
  alternative: ìtúká láàárín àwọn Gíríìkì
  rationale: Ọ̀rọ̀ náà jẹ́ àkọlé àṣà fún àwọn Júù tí ń gbé káàkiri láàárín àwọn orílẹ̀-èdè. Sísọ “àwọn Júù” ní gbangba yàgò fún òye àṣìṣe pé àwọn Gíríìkì ni wọ́n tú ká, nígbà tí àlàyé ìsàlẹ̀ ń pa ìṣètò Gíríìkì mọ́ fún àyẹ̀wò.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. “Kò ha ... àbí?” ń gbé ìbéèrè tó ń retí ìdáhùn òdì jáde, nígbà tí “ọkùnrin yìí” pa ìjìnnà inú ọ̀rọ̀ àwọn olùsọ̀rọ̀ mọ́.
