  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ènìyàn wọ̀nyí tí wọn kò mọ Òfin jẹ́ àwọn tí a fi ègún ṣẹ̀.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Òfin” ń tọ́ka sí Òfin àwọn Júù, ìyẹn Tórà.
    reason: cultural_note
  - marker: b
    text: Tàbí, “wà lábẹ́ ègún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ọ̀rọ̀ àwọn Farisí yìí ṣe ìyàtọ̀ sí ohun tí a ṣẹ̀ṣẹ̀ sọ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative conjunction ní Yorùbá.
- source_word: ὁ ὄχλος οὗτος
  choice: àwọn ènìyàn wọ̀nyí
  rationale: Ó túmọ̀ ὄχλος gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn tí ó péjọ, láìfi ìtumọ̀ búburú bí ‘ijọ ènìyàn onírúkèrúdò’ kún ọ̀rọ̀ Gíríìkì.
- source_word: ὁ μὴ γινώσκων
  choice: tí wọn kò mọ
  rationale: Gbólóhùn àsopọ̀ yìí ṣe àpèjúwe àwọn ènìyàn náà, ó sì pa ìtumọ̀ ipò tí ó ń bá a lọ mọ́ ní èdè Yorùbá àdánidá.
- source_word: τὸν νόμον
  choice: Òfin
  rationale: Ní àyíká ọ̀rọ̀ yìí, νόμος ń tọ́ka sí Òfin àwọn Júù, ìyẹn Tórà; lílo lẹ́tà ńlá ń ran òǹkàwé lọ́wọ́ láti mọ ìtọ́kasí pàtó yìí.
- source_word: ἐπάρατοί εἰσιν
  choice: jẹ́ ẹni ègún
  rationale: Ó pa ohùn ìdálẹ́bi líle ti ọ̀rọ̀ Gíríìkì mọ́. Bí ó tilẹ̀ jẹ́ pé ‘ẹni’ kò yí padà nítorí ọ̀pọ̀, àkójọpọ̀ ‘àwọn … jẹ́ ẹni ègún’ jẹ́ Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Bóyá kí a fi hàn pé ìdájọ́ ọ̀tá yìí jẹ́ ọ̀rọ̀ àwọn olùsọ̀, kì í ṣe ìmúdájú òǹkọ̀wé.
  choice: A túmọ̀ ìdálẹ́bi náà ní tààràtà gẹ́gẹ́ bí ó ti wà nínú ọ̀rọ̀ àwọn Farisí, láìrọ̀ ọ́ àti láìfi ọ̀rọ̀ míì kún un.
  alternative: Kí a fi ọ̀rọ̀ bí ‘wọ́n ní’ kún un láti ya òǹkọ̀wé sọ́tọ̀ kúrò nínú ìdájọ́ náà.
  rationale: Ẹsẹ̀ náà jẹ́ ọ̀rọ̀ tààràtà láti ẹnu àwọn alátakò Jésù. Àyíká ọ̀rọ̀ ti fi ẹni tí ń sọ̀rọ̀ hàn; fífi ọ̀rọ̀ ìyàsọ́tọ̀ kún un yóò kọjá ohun tí Gíríìkì sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo “àwọn ènìyàn wọ̀nyí” dípò ọ̀rọ̀ tí ó lè fi ìwà búburú kún ὄχλος. A tún gbe àmì àlàyé ọ̀nà mìíràn sí “ẹni ègún,” ibi tí lexical alternative náà tọ́ sí.
