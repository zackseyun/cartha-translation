  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: yo
  text: Ìsọ̀rọ̀-kẹ́lẹ́kẹ́lẹ́ púpọ̀ nípa rẹ̀ sì wà láàárín ogunlọ́gọ̀ ènìyàn.[a] Àwọn kan ń wí pé, “Ẹni rere ni.” Àwọn mìíràn sì ń wí pé, “Rárá, kàkà bẹ́ẹ̀, ó ń ṣì ogunlọ́gọ̀ ènìyàn náà lọ́nà.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìkùnsínú” tàbí “ìfẹ̀fẹ̀ẹ́” nípa rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń tan ogunlọ́gọ̀ ènìyàn náà jẹ” tàbí “ó ń mú ogunlọ́gọ̀ ènìyàn náà ṣìnà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: ọ̀rọ̀ kẹ́lẹ́kẹ́lẹ́
  rationale: Ó fi hàn pé ọ̀rọ̀ náà ń lọ ní ohùn ìrẹ̀lẹ̀, láì di àríyànjiyàn gbangba. Ó tún lè túmọ̀ sí ìkùnsínú, ṣùgbọ́n ọ̀rọ̀ yìí kò fi dandan mú kí gbogbo ohun tí wọ́n ń sọ jẹ́ ẹ̀dùn ọkàn.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ọ̀rọ̀ tó ń tọ́ka sí ohun tí wọ́n ń sọ nípa Jésù.
- source_word: πολύς
  choice: ọ̀pọ̀
  rationale: Ó ń fi bí ọ̀rọ̀ kẹ́lẹ́kẹ́lẹ́ náà ti pọ̀ tó hàn.
- source_word: ἐν τοῖς ὄχλοις
  choice: láàárín àwọn ogunlọ́gọ̀
  rationale: Ó pa nọ́ńbà púpọ̀ inú Gíríìkì mọ́, ó sì fi hàn pé ọ̀rọ̀ náà tàn káàkiri láàárín àwọn ènìyàn tí ó péjọ.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Àwọn kan ... Àwọn mìíràn sì ...
  rationale: Èyí sọ ìyàtọ̀ tó wà láàárín ẹgbẹ́ méjèèjì ní Yorùbá àdánidá.
- source_word: Ἀγαθός ἐστιν
  choice: Ẹni rere ni
  rationale: Gíríìkì sọ ní tààrà pé ó jẹ́ rere. ‘Ẹni rere ni’ jẹ́ gbólóhùn Yorùbá àdánidá fún ìdájọ́ nípa ìwà ẹni, láì fi ẹ̀kọ́ ìsìn míì kún un.
- source_word: Οὔ, ἀλλὰ
  choice: Rárá, kàkà bẹ́ẹ̀
  rationale: Ó pa ìkọ̀sẹ̀ tààrà àti àtúnṣe alátakò inú Gíríìkì mọ́.
- source_word: πλανᾷ
  choice: ó ń ṣi ... lọ́nà
  rationale: Ó mú èrò ṣíṣi àwọn ènìyàn kúrò ní ọ̀nà tó tọ́ jáde, láì pinnu bóyá ìtànjẹ mọ̀ọ́mọ̀ ni a tẹnumọ́ tàbí àbájáde ìṣìnà.
- source_word: τὸν ὄχλον
  choice: ogunlọ́gọ̀ náà
  rationale: Ó tẹ̀ lé nọ́ńbà ẹyọ inú Gíríìkì, níbi tí ogunlọ́gọ̀ ti dúró fún gbogbo àwùjọ náà lápapọ̀.
theological_decisions:
- issue: Àwọn èrò tó yàtọ̀ síra nípa Jésù
  choice: A ṣe àgbékalẹ̀ ọ̀rọ̀ rere àti ẹ̀sùn búburú náà gẹ́gẹ́ bí ohun tí àwọn ẹgbẹ́ inú ogunlọ́gọ̀ sọ.
  alternative: Kí a mú ọ̀kan nínú àwọn èrò náà dà bí ìdájọ́ akọ̀wé ìhìnrere.
  rationale: Ẹsẹ̀ náà ń ròyìn ìdájọ́ ènìyàn méjì tó tako ara wọn; kò sọ pé akọ̀wé fọwọ́ sí èyíkéyìí níbí. Ìtumọ̀ náà pa ìforígbárí yìí mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ọ̀rọ̀ kẹ́lẹ́kẹ́lẹ́’ rọrùn fún òǹkàwé lónìí, ‘Ẹni rere ni’ sì jẹ́ gbólóhùn àdánidá tó ṣì sún mọ́ Ἀγαθός ἐστιν.
