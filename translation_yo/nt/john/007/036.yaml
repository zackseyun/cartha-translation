id: JHN.7.36
reference: John 7:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: yo
  text: “Kí ni ọ̀rọ̀ yìí tí ó sọ[a] pé, ‘Ẹ ó wá mi, ẹ ò sì ní rí mi, níbi tí mo wà sì ni ẹ kò lè dé[b]?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni ọ̀rọ̀ tàbí àsọjáde yìí tí ó sọ?” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí “ọ̀rọ̀,” “àsọjáde,” “ìhìn,” tàbí “ọ̀rọ̀ tí a sọ,” gẹ́gẹ́ bí àyíká ṣe rí.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan ní, “níbi tí mo ń lọ,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí sọ pé, “níbi tí mo wà.” Èyí ń pa ìdààmú ìtumọ̀ tí Jòhánù mọ̀ọ́mọ̀ fi sílẹ̀ nínú ọ̀rọ̀ náà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, λόγος ń tọ́ka sí ohun tí Jésù sọ. “Ọ̀rọ̀” jẹ́ èdè Yorùbá àdánidá tí ó lè túmọ̀ sí ọ̀rọ̀, gbólóhùn, tàbí àsọjáde gẹ́gẹ́ bí àyíká ṣe rí.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: Kí ni ọ̀rọ̀ yìí
  rationale: Èyí pa ìrísí ìbéèrè Gíríìkì mọ́ láì túmọ̀ ọ́ ní ọ̀nà àlàyé sí “Kí ni ... túmọ̀ sí?”
- source_word: Ζητήσετέ με
  choice: Ẹ̀yin yóò wá mi
  rationale: “Wá mi” jẹ́ ọ̀nà Yorùbá àdánidá fún ζητέω ní àyíká yìí, ó sì fi ìṣe wíwá ẹni hàn kedere.
- source_word: οὐχ εὑρήσετε
  choice: ẹ̀yin kì yóò sì rí mi
  rationale: Ó fi ìkọ̀ ọjọ́ iwájú hàn ní kedere; àtúnlò “mi” jẹ́ kí ọ̀rọ̀ náà yé ẹni dáadáa ní Yorùbá.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: ibi tí mo wà
  rationale: Ìtumọ̀ yìí pa àsìkò ìsinsìnyí εἰμί mọ́, kò sì yí i padà sí “ibi tí mo ń lọ.” Ọ̀rọ̀ arọ́pò-orúkọ “mo” ti ní ìtẹnumọ́ tó yẹ ní ìṣètò Yorùbá.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ẹ̀yin kò lè wá
  rationale: “Kò lè wá” jẹ́ Yorùbá àdánidá tí ó fi àìlèṣe tí δύνασθε ń sọ hàn.
- source_word: εἶπε
  choice: tí ó sọ
  rationale: “Sọ” ni ìtumọ̀ Yorùbá tó rọrùn, tó sì bá ọ̀rọ̀ àyọlò mu fún εἶπε.
theological_decisions:
- issue: Àsìkò ìsinsìnyí nínú ọ̀rọ̀ Jésù, “ibi tí mo wà”
  choice: Pa “ibi tí mo wà” mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ.
  alternative: Ibi tí mo ń lọ
  rationale: Gíríìkì lo εἰμί ní àsìkò ìsinsìnyí. Pípa èyí mọ́ kò tú ìforígbárí oníṣọ̀kan nínú Jòhánù sí ọ̀nà ìtumọ̀ kan ṣoṣo, bí ó tilẹ̀ jẹ́ pé “ibi tí mo ń lọ” lè rọrùn láti lóye.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa ìrísí ìbéèrè àti àsọjáde kan ṣoṣo tí καί so pọ̀ mọ́.
