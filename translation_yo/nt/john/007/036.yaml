revisions:
- from: “Kí ni ọ̀rọ̀ yìí tí ó sọ[a] pé, ‘Ẹ̀yin yóò wá mi, ẹ̀yin kì yóò sì rí mi; ibi tí mo sì wà[b], ẹ̀yin kò lè wá’?”
  to: “Kí ni ọ̀rọ̀ yìí tí ó sọ[a] pé, ‘Ẹ ó wá mi, ẹ ò sì ní rí mi, níbi tí mo wà sì ni ẹ kò lè dé[b]?’”
  rationale: The revision preserves the Greek present tense and the unresolved Johannine force of “where I am,” while making the Yoruba idiomatic and keeping the quotation a single connected saying. It also corrects the lexical footnote so that it does not attribute an unsuitable sense to λόγος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:22:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the present sense of ὅπου εἰμὶ ἐγώ (“níbi tí mo wà”) rather than supplying “I am going.” However, the quoted saying is more naturally and accurately represented as one coordinated utterance, and the final ἐλθεῖν is better distinguished from the earlier “seek” verb by using “dé” (“arrive/reach”).
  naturalness: Repeated emphatic “Ẹ̀yin” is unnecessarily heavy in Yoruba. The revision uses ordinary plural address while retaining a clear coordinated sequence. “Níbi tí mo wà sì ni ẹ kò lè dé” is natural Standard Yoruba and conveys the Greek word order and inability without over-explaining it.
  terminology: “Ọ̀rọ̀” is an appropriate contextual rendering of λόγος. Footnote a incorrectly listed “iṣẹ́” (“work”) as a meaning of λόγος in this context; it has been removed. The alternative “àsọjáde” is retained as a suitable contextual option.
  issues:
  - severity: medium
    issue: Footnote a gives “iṣẹ́” as a possible meaning of λόγος.
    rationale: “Iṣẹ́” means “work/deed” and is not a suitable lexical alternative for λόγος in John 7:36, where the noun denotes what Jesus said.
  - severity: low
    issue: The translation repeatedly uses emphatic “Ẹ̀yin” and uses “wá” both for seeking and for coming.
    rationale: The Greek has an explicit ὑμεῖς only in the final clause; repeated emphasis is stylistically cumbersome in Yoruba. Using “dé” in the final clause avoids confusing the two distinct Greek verbs ζητέω and ἔρχομαι.
  - severity: low
    issue: The connection of the two parts of Jesus’ saying is not optimally clear.
    rationale: The Greek joins the clauses with καί. Yoruba “sì” in the revised second clause keeps the saying as a single connected quotation without adding an interpretive contrast.
  revised_text: “Kí ni ọ̀rọ̀ yìí tí ó sọ[a] pé, ‘Ẹ ó wá mi, ẹ ò sì ní rí mi, níbi tí mo wà sì ni ẹ kò lè dé[b]?’”
