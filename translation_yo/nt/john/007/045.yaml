source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: yo
  text: Nítorí náà, àwọn ẹ̀ṣọ́ náà wá sí ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn Farisí; àwọn wọ̀nyẹn sì wí fún wọn pé, “Èé ṣe tí ẹ kò fi mú un wá?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìpadà àwọn ẹ̀ṣọ́ pọ̀ mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì pa agbára ìyọrísí inú ìtàn mọ́.
- source_word: ὑπηρέται
  choice: àwọn ẹ̀ṣọ́
  rationale: Nínú àyíká yìí, àwọn òṣìṣẹ́ aláṣẹ tí a rán láti mú Jésù ni wọ́n, kì í ṣe ìránṣẹ́ ilé lásán. “Àwọn ẹ̀ṣọ́” jẹ́ ọ̀rọ̀ àdánidá tí kò fi “tẹ́ńpìlì” tí Gíríìkì kò sọ kún un.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ẹgbẹ́ àwọn aláṣẹ àlùfáà, ó sì yẹra fún ìtumọ̀ pé ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo ló wà.
- source_word: Φαρισαίους
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ Júù náà ni a ṣe àyálò sí Yorùbá ní ọ̀nà tí ó wọ́pọ̀.
- source_word: ἐκεῖνοι
  choice: àwọn wọ̀nyẹn
  rationale: A pa arọ́pò-orúkọ atọ́ka tó hàn gbangba nínú Gíríìkì mọ́, kí ó lè tẹnumọ́ pé àwọn olórí àlùfáà àti Farisí ni wọ́n sọ̀rọ̀.
- source_word: Διὰ τί
  choice: Èé ṣe
  rationale: Ìbéèrè ìdí tó jẹ́ àdánidá ní Yorùbá.
- source_word: ἠγάγετε
  choice: ẹ kò fi mú un wá
  rationale: “Mú … wá” bá iṣẹ́ àwọn ẹ̀ṣọ́ tí a rán láti mú Jésù mu dáadáa, ó sì tún pa èrò ìdarí ẹni wá sí ọ̀dọ̀ àwọn aláṣẹ mọ́.
- source_word: αὐτόν
  choice: un
  rationale: Arọ́pò-orúkọ olùgbà tí ó tọ́ka sí Jésù ni, a sì so ó mọ́ ọ̀rọ̀-ìṣe gẹ́gẹ́ bí ìlànà Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. “Àwọn wọ̀nyẹn” pa ìtẹnumọ́ ἐκεῖνοι mọ́ láì dá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tuntun sí i; “padà tọ … lọ” mú ìrìnàjò ìpadà tí àyíká ìtàn fi hàn jáde ní èdè Yorùbá àdánidá.
