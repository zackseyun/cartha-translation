  to: Nítorí náà, àwọn ẹ̀ṣọ́ náà wá sí ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn Farisí; àwọn wọ̀nyẹn sì wí fún wọn pé, “Èé ṣe tí ẹ kò fi mú un wá?”
  rationale: Àtúnṣe náà yí “padà tọ ... lọ” sí “wá sí ọ̀dọ̀” láti fi ἦλθον πρὸς hàn ní Yorùbá tó rọrùn láì ṣàfikún ìtumọ̀. Ó tún yí “bi wọ́n pé” sí “wí fún wọn pé” láti ba εἶπον αὐτοῖς mu ní kíkún. Ìtumọ̀, ìtẹnumọ́ demonstrative, àti ìbéèrè ìkẹyìn kò yí.
