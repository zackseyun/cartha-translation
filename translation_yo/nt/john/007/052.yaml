source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: yo
  text: Wọ́n dá a lóhùn, wọ́n sì wí fún un pé, “Ṣé ìwọ náà wá láti Gálílì ni?[a] Ṣàyẹ̀wò, kí o sì rí i pé kò sí wòlíì kan tí ó dìde láti Gálílì.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ náà kì í ṣe ará Gálílì, àbí?” Bí a ṣe gbé ìbéèrè Gíríìkì kalẹ̀ ń retí ìdáhùn òdì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kò sí wòlíì kan tí a gbé dìde láti Gálílì,” èyí tó lè pa ìtumọ̀ náà mọ́ pé Ọlọ́run ni ó ń gbé àwọn wòlíì dìde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Wọ́n dá a lóhùn, wọ́n sì wí fún un pé
  rationale: Ó pa àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́ gẹ́gẹ́ bí ìlànà ìtàn tí Jòhánù sábà máa ń lò, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ wọn sún mọ́ra.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Ṣé ìwọ náà wá láti Gálílì ni?
  rationale: Ìbéèrè yìí jẹ́ ti ẹnu-ọ̀rọ̀, ó sì ń retí ìdáhùn òdì; ọ̀nà yìí jẹ́ ti Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ohun tí μή ń tọ́ka sí hàn kedere.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Ṣàyẹ̀wò rẹ̀, kí o sì rí i
  rationale: ‘Ṣàyẹ̀wò’ sọ ìwádìí pẹ̀lú àkíyèsí, ‘rí i’ sì pa bí àwọn àṣẹ méjì ṣe tẹ̀ lé ara wọn mọ́.
- source_word: προφήτης
  choice: wòlíì kan
  rationale: Ọ̀rọ̀ náà kò ní àpilẹ̀kọ ní Gíríìkì, nítorí náà ó tọ́ka sí wòlíì èyíkéyìí, kì í ṣe ‘Wòlíì náà’ kan pàtó.
- source_word: οὐκ ἐγείρεται
  choice: kò sí ... tí ó dìde
  rationale: ‘Dìde’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè túmọ̀ sí bí wòlíì ṣe farahàn tàbí bí Ọlọ́run ṣe gbé e dìde, láìfi ipa mú ìtumọ̀ kan ṣoṣo.
theological_decisions:
- issue: Agbára ìbéèrè òdì tí μή ń fi hàn
  choice: Ṣé ìwọ náà wá láti Gálílì ni?
  alternative: Ìwọ náà kì í ṣe ará Gálílì, àbí?
  rationale: Ọ̀rọ̀ Gíríìkì ń retí ìdáhùn òdì, ó sì ní ẹ̀gàn nínú; ìtumọ̀ àkọ́kọ́ dùn bí Yorùbá àdánidá, àlàyé ìsàlẹ̀ sì pa agbára ìbéèrè náà mọ́.
- issue: Bóyá ἐγείρεται túmọ̀ sí pé wòlíì ‘dìde’ tàbí pé a ‘gbé e dìde’
  choice: tí ó dìde
  alternative: tí a gbé dìde
  rationale: Fọ́ọ̀mù Gíríìkì lè sọ nípa bí wòlíì ṣe farahàn, tàbí kí ó ní ìtumọ̀ pé Ọlọ́run ni ó gbé e dìde. Àkọ́kọ́ kò dá ìtumọ̀ kejì nù, àlàyé ìsàlẹ̀ sì tọ́ka sí i.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘wòlíì’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, ‘Ṣàyẹ̀wò’ sì bá ìpè sí ìwádìí mu.
