id: JHN.7.40
reference: John 7:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: yo
  text: Nítorí náà, àwọn kan nínú ogunlọ́gọ̀ náà, nígbà tí wọ́n gbọ́ àwọn ọ̀rọ̀ wọ̀nyí, wọ́n ń sọ pé, “Ní tòótọ́, ẹni yìí ni Wòlíì náà.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí “Wòlíì náà” tọ́ka sí wòlíì bí Mósè tí a ń retí (wo Diutarónómì 18:15), bí ó tilẹ̀ jẹ́ pé àwọn olùtumọ̀ kan ka a sí ìtọ́kasí gbogbogbòò sí wòlíì kan.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: àwọn kan lára èrò náà
  rationale: Gbólóhùn náà ń tọ́ka sí apá kan nínú gbogbo èrò, kì í ṣe gbogbo wọn; ‘àwọn kan lára èrò náà’ mú ìtumọ̀ apá-yìí hàn ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìdáhùn èrò pọ̀ mọ́ ọ̀rọ̀ tí ó ṣáájú, ó sì fi ìtẹ̀síwájú tàbí àbájáde ọ̀rọ̀ hàn.
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́
  rationale: Aorist participle náà fi ìṣe tí ó ṣẹlẹ̀ ṣáájú tàbí ní àkókò ìdáhùn wọn hàn; ìtumọ̀ yìí dára, ó sì wọ́pọ̀ ní Yorùbá.
- source_word: τῶν λόγων τούτων
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ, ìtumọ̀ yìí sì ṣe tààrà.
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àmì àkókò imperfect náà fi ọ̀rọ̀ tí ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra hàn; ‘ń sọ’ pa ìrísí ìṣe náà mọ́.
- source_word: Οὗτός ἐστιν
  choice: èyí ni
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí Jésù ní tààrà; ‘èyí ni’ jẹ́ ọ̀nà Yorùbá tí ó bá ìtẹnumọ́ Gíríìkì mu.
- source_word: ἀληθῶς
  choice: Ní tòótọ́
  rationale: Ó tẹnu mọ́ pé ìjẹ́wọ́ wọn jẹ́ òótọ́ tàbí dájú, ó sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ náà mọ́.
- source_word: ὁ προφήτης
  choice: Wòlíì náà
  rationale: Àpilẹ̀kọ pàtó náà ń tọ́ka sí ẹni tí a ń retí, kì í ṣe wòlíì kan lásán; ‘náà’ ṣe àfihàn ìtumọ̀ pàtó náà láì sọ pé òun ni Mèsáyà ní kedere.
theological_decisions:
- issue: Ta ni ‘Wòlíì náà’ ń tọ́ka sí?
  choice: Wòlíì náà
  alternative: wòlíì kan; tàbí fífi hàn gbangba pé Mèsáyà ni
  rationale: Ọ̀rọ̀ náà ṣeé ṣe kí ó tọ́ka sí wòlíì bí Mósè tí a ń retí gẹ́gẹ́ bí Diutarónómì 18:15, ṣùgbọ́n ẹsẹ̀ náà kò sọ ní kedere pé orúkọ oyè yìí bá Mèsáyà dọ́gba. Ìtumọ̀ náà pa àìdánilójú àti ìfọ̀kànsìn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá ìwọ̀nba, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. ‘Èrò’ ni a lò fún ὄχλος, ‘Wòlíì náà’ sì pa agbára orúkọ oyè àti àìdánilójú inú ọ̀rọ̀ mọ́.
