  to: Nítorí náà, àwọn kan nínú ogunlọ́gọ̀ náà, nígbà tí wọ́n gbọ́ àwọn ọ̀rọ̀ wọ̀nyí, wọ́n ń sọ pé, “Ní tòótọ́, ẹni yìí ni Wòlíì náà.”[a]
  rationale: A rọ́pò “èrò” pẹ̀lú “ogunlọ́gọ̀” fún ìtumọ̀ tó péye sí ὄχλος. “Ẹni yìí ni” sọ ní kedere pé ọ̀rọ̀ náà ń tọ́ka sí ẹni náà, nígbà tí ó ṣì ń pa ìtẹnumọ́ demonstrative Gíríìkì mọ́. A pa “Wòlíì náà” mọ́ kí a má ṣe yanjú ìdánimọ̀ ẹ̀sìn tí ẹsẹ̀ náà kò sọ ní kedere.
