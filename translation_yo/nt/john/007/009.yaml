  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: yo
  text: Lẹ́yìn tí ó sọ nǹkan wọ̀nyí, òun fúnra rẹ̀ dúró ní Gálílì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ; “nǹkan wọ̀nyí” pa ìtumọ̀ ọ̀pọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: δὲ ... εἰπὼν
  choice: Lẹ́yìn tí ó sọ
  rationale: Ìṣe tí participle aorist náà sọ ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí fi ìtẹ̀síwájú àkókò hàn lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Arọ́pò-orúkọ tí a tẹnu mọ́ yìí lè fi ìṣe Jésù yàtọ̀ sí ti àwọn arákùnrin rẹ̀ nínú àyíká ọ̀rọ̀; “òun fúnra rẹ̀” pa ìtẹnumọ́ náà mọ́.
- source_word: ἔμεινεν
  choice: dúró
  rationale: Nínú ìtàn yìí, μένω túmọ̀ sí pé ó ṣì wà ní ibẹ̀, kò lọ; “dúró” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan remained/stayed ní ibi kan.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ní Gálílì
  rationale: Èyí jẹ́ gbólóhùn ibi tí ó ṣe tààrà, tí ó sì pa orúkọ agbègbè náà mọ́.
