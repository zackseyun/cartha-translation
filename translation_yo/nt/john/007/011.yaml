  rationale: Àtúnṣe náà yí ‘níbi àjọ̀dún náà’ sí ‘ní àjọ̀dún náà’ kí ó lè pa ìtumọ̀ ἐν τῇ ἑορτῇ mọ́ dáadáa, ó sì ṣàtúnṣe àmì ohùn nínú ‘Níbo.’ Gbogbo àwọn ìpinnu ìtumọ̀ mìíràn, pẹ̀lú àìdín ìtọ́kasí Ἰουδαῖοι kù sí àwọn olórí nìkan, wà láìyípadà.
