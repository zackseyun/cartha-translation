id: JHN.7.11
reference: John 7:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[a] ń wá a ní àjọ̀dún náà, wọ́n sì ń sọ pé, “Níbo ni ẹni yẹn wà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà”; nínú àyíká ìtàn Jòhánù, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka ní pàtó sí àwọn aláṣẹ Júù ní Jùdíà.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ àyíká ọ̀rọ̀ tó ṣáájú, ó sì fi ìtẹ̀síwájú tàbí àbájáde ìtàn hàn.
- source_word: Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tó taara jù lọ, láì fi dandan sọ pé àwọn olórí nìkan ni; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ míì tó ṣeé ṣe mọ́.
- source_word: ἐζήτουν
  choice: ń wá a
  rationale: Àmì ìṣe aláìparí náà fi hàn pé wíwá náà ń lọ lọ́wọ́ ní àkókò àjọ̀dún.
- source_word: ἐν τῇ ἑορτῇ
  choice: níbi àjọ̀dún náà
  rationale: Ó tọ́ka sí àjọ̀dún tí a ti mẹ́nu kàn ṣáájú, ó sì lè ní ìtumọ̀ ibi àti àkókò nínú àyíká yìí.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ pé
  rationale: Ìṣe aláìparí náà ni a pa mọ́, tó ń fi ọ̀rọ̀ tí wọ́n ń sọ lọ́wọ́ tàbí léraléra hàn.
- source_word: ἐκεῖνος
  choice: ẹni yẹn
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò-orúkọ atọ́ka náà mọ́ láì fi ọ̀rọ̀ ‘ọkùnrin’ kún ohun tí Gíríìkì kò sọ ní tààrà.
theological_decisions:
- issue: Ẹni tí Ἰουδαῖοι ń tọ́ka sí nínú ìtàn Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; tàbí, ní àyíká yìí, àwọn aláṣẹ Júù ní Jùdíà
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò dín ẹgbẹ́ náà kù sí àwọn olórí nìkan. Ọ̀rọ̀ pàtàkì wà nínú ìtumọ̀ rẹ̀, nítorí náà a fi èyí tó taara sínú ọ̀rọ̀ àkọ́kọ́, a sì tọ́ka sí ìtumọ̀ tó ṣeé ṣe nínú àlàyé.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá bójú mu.
