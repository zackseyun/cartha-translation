id: JHN.7.3
reference: John 7:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: yo
  text: Nítorí náà, àwọn arákùnrin rẹ̀ sọ fún un pé, “Kúrò níhìn-ín, kí o sì lọ sí Jùdíà, kí àwọn ọmọ-ẹ̀yìn rẹ̀ pẹ̀lú lè rí[a] àwọn iṣẹ́ tí o ń ṣe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò rí” tàbí “wo.” Ọ̀rọ̀-ìse Gíríìkì náà lè túmọ̀ sí wíwo tàbí ṣíṣe àkíyèsí; fọ́ọ̀mù ọjọ́ iwájú rẹ̀ nínú gbólóhùn ète yìí lè ní àwọn ìtumọ̀ wọ̀nyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ipa ìsopọ̀ ọ̀rọ̀ tó ń fi àbájáde tàbí ìtẹ̀síwájú hàn mọ́ ní Yorùbá tó bójú mu.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, àyíká ọ̀rọ̀ sì tọ́ka sí àwọn ọkùnrin ìdílé Jésù; a kò fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Kúrò níhìn-ín
  rationale: Àṣẹ náà jẹ́ tààrà, ó sì ní kí ẹni náà fi ibi tó wà sílẹ̀; èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: lọ sí Jùdíà
  rationale: Ó mú àṣẹ ìrìn sí agbègbè Jùdíà jáde ní kedere àti ní ṣókí.
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: kí àwọn ọmọ-ẹ̀yìn rẹ pẹ̀lú
  rationale: ‘Kí’ fi ète hàn, ‘pẹ̀lú’ sì pa ipa καὶ mọ́; ‘ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής.
- source_word: θεωρήσουσιν
  choice: lè rí
  rationale: Nínú gbólóhùn ète tí ἵνα darí, fọ́ọ̀mù ọjọ́ iwájú náà ní agbára ète tàbí àbájáde; ‘lè rí’ jẹ́ àdánidá, ó sì pa ìtumọ̀ wíwo mọ́.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: àwọn iṣẹ́ tí ò ń ṣe
  rationale: Èyí sọ ìní tó wà nínú σοῦ ní ọ̀nà Yorùbá àdánidá, ó sì pa ‘iṣẹ́’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì nínú Jòhánù.
theological_decisions:
- issue: Àwọn tí ‘àwọn arákùnrin rẹ̀’ ń tọ́ka sí
  choice: Àwọn arákùnrin Jésù tó jẹ́ ọmọ ìdílé rẹ̀ ni wọ́n ń sọ̀rọ̀.
  alternative: Ó lè jẹ́ àwọn ìbátan rẹ̀ ní ìtumọ̀ tó gbòòrò.
  rationale: Jòhánù 7:3–5 fi wọ́n hàn gẹ́gẹ́ bí àwọn arákùnrin Jésù tí kò tíì gbà á gbọ́. Ìtumọ̀ náà dúró lórí ọ̀rọ̀ ìdílé tó wà nínú ẹsẹ̀ láìfi àríyànjiyàn ẹ̀kọ́ ìsìn tó kọjá ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ò ń ṣe’ gẹ́gẹ́ bí ìsọ̀rọ̀ tààrà nínú ọ̀rọ̀ àyọlò; kò sí àlàyé ẹsẹ̀ abẹ́ tí ó ṣe pàtàkì nítorí Yorùbá ‘lè rí’ ti mú ipa ète àti ìtumọ̀ wíwo jáde dáadáa.
