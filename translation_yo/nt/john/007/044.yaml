source:
  edition: SBLGNT
  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan nínú wọn fẹ́ mú un,[a] síbẹ̀ kò sí ẹnikẹ́ni tó gbé ọwọ́ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fẹ́ mú un gẹ́gẹ́ bí ẹlẹ́wọ̀n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Ṣùgbọ́n àwọn kan
  rationale: “Àwọn kan” fi hàn pé apá kan tí a kò dárúkọ nínú ọ̀pọ̀ ènìyàn ni; “ṣùgbọ́n” sì mú ìyàtọ̀ sí àwọn ìhùwà tó ṣáájú jáde.
- source_word: ἤθελον
  choice: fẹ́
  rationale: Ó sọ ìfẹ́ tàbí ète wọn ní àkókò àtijọ́ lọ́nà Yorùbá tó ṣe déédé, láìfi ìtumọ̀ àfikún sí aspect imperfect.
- source_word: ἐξ αὐτῶν
  choice: lára wọn
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún àwọn díẹ̀ láti inú ẹgbẹ́ ńlá kan ni “lára wọn”; kò nílò àlàyé ẹsẹ̀ àlàyé lọ́tọ̀.
- source_word: πιάσαι
  choice: mú un
  rationale: Ní àyíká yìí, “mú un” lè túmọ̀ sí dídì í mú tàbí mímú un gẹ́gẹ́ bí ẹlẹ́wọ̀n, ó sì pa ìwọ̀n ìtumọ̀ Gíríìkì mọ́. Ẹsẹ̀ àlàyé ṣàlàyé ìtumọ̀ mímú gẹ́gẹ́ bí ẹlẹ́wọ̀n.
- source_word: ἀλλ’ οὐδεὶς
  choice: síbẹ̀ kò sí ẹnì kankan
  rationale: “Síbẹ̀” fi ìtakora tó lágbára láàárín ète wọn àti ohun tó ṣẹlẹ̀ hàn; “kò sí ẹnì kankan” túmọ̀ οὐδείς ní kedere.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: na ọwọ́ lé e
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó bá àwòrán àsọyé Gíríìkì mu fún fífi ọwọ́ kan ènìyàn láti dì í mú, ní àìṣàfikún ìdí tí ọ̀rọ̀ náà kò sọ ní tààrà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A yan “mú un” dípò ọ̀rọ̀ amúnisìn tó le ju, kí ìtumọ̀ dídì mú àti ti mímú gẹ́gẹ́ bí ẹlẹ́wọ̀n lè wà; a sì fi ìtumọ̀ kejì sínú ẹsẹ̀ àlàyé. Àmì ẹsẹ̀ àlàyé [a] wà lẹ́yìn gbólóhùn tó yẹ.
