  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: yo
  text: Nítorí náà, Jésù sọ pé, “Ìgbà díẹ̀ sí i ni èmi yóò fi wà pẹ̀lú yín[a], mo sì máa lọ sọ́dọ̀ ẹni tí ó rán mi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ìgbà díẹ̀ ni ó kù tí èmi yóò fi wà pẹ̀lú yín.”
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká Ìhìn Rere Jòhánù, “ẹni tí ó rán mi” ń tọ́ka sí Baba.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ń so ọ̀rọ̀ Jésù pọ̀ mọ́ ìṣẹ̀lẹ̀ àti ìjíròrò tó ṣáájú, ó sì fi ìtẹ̀síwájú ìròyìn hàn.
- source_word: Ἔτι χρόνον μικρόν
  choice: Ìgbà díẹ̀ sí i
  rationale: Ó mú ìtumọ̀ ἔτι (‘sí i/síbẹ̀’) àti χρόνον μικρόν (‘ìgbà díẹ̀’) jọ ní ọ̀nà tí ó ṣe déédéé ní Yorùbá.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ni èmi yóò fi wà pẹ̀lú yín
  rationale: Ní àkópọ̀ pẹ̀lú gbólóhùn àkókò, èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wíwà rẹ̀ pẹ̀lú wọn yóò tún bá a lọ fún ìgbà díẹ̀.
- source_word: καὶ ὑπάγω
  choice: lẹ́yìn náà, èmi yóò lọ
  rationale: Ὑπάγω túmọ̀ sí lílọ tàbí kúrò níbẹ̀; ‘lẹ́yìn náà’ mú ìtẹ̀lé àkókò tó wà nínú ọ̀rọ̀ náà ṣe kedere ní Yorùbá láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
- source_word: πρὸς τὸν πέμψαντά με
  choice: sọ́dọ̀ ẹni tí ó rán mi
  rationale: Ó pa àpèjúwe alábápín náà mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́, láìsọ ẹni náà ní orúkọ nínú ẹsẹ̀.
theological_decisions:
- issue: Ta ni ‘ẹni tí ó rán mi’ ń tọ́ka sí?
  choice: Fi ọ̀rọ̀ ìbátan náà sílẹ̀ gẹ́gẹ́ bí ‘ẹni tí ó rán mi’.
  alternative: ‘Baba tí ó rán mi’
  rationale: Nínú àyíká Ìhìn Rere Jòhánù, Baba ni ọ̀rọ̀ náà ń tọ́ka sí, ṣùgbọ́n ẹsẹ̀ Gíríìkì fúnra rẹ̀ kò pe Baba ní tààrà; ìtumọ̀ náà pa ìfihàn tí kò ṣe tààrà yìí mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe gbólóhùn àkókò náà jẹ́ kí ẹsẹ̀ náà ṣe déédéé fún òǹkàwé Yorùbá, nígbà tí a pa ìtumọ̀ àti àìsọ ẹni tó rán Jésù ní tààrà mọ́.
