revisions:
- from: Ṣùgbọ́n nígbà tí àwọn arákùnrin rẹ̀ ti gòkè lọ sí àjọ̀dún náà, nígbà náà ni òun náà gòkè lọ, kì í ṣe ní gbangba, ṣùgbọ́n bí ẹni pé ó lọ ní ìkọ̀kọ̀.[a]
  to: Ṣùgbọ́n nígbà tí àwọn arákùnrin rẹ̀ ti gòkè lọ sí àjọ̀dún náà, nígbà náà ni òun náà gòkè lọ, kò sì lọ ní gbangba, ṣùgbọ́n bí ẹni pé ó lọ ní ìkọ̀kọ̀.[a]
  rationale: A ṣe àtúnṣe kékeré kan sí ìrísí àsìkò àti ìṣètò gbólóhùn nìkan. Ó pa ‘not openly but as if in secret’ mọ́, ó sì yẹra fún ìtumọ̀ pé èyí jẹ́ ìwà tí Jésù máa ń ṣe léraléra. Àmì ìsàlẹ̀ náà ṣì ń fi yíyan ‘ṣùgbọ́n ní ìkọ̀kọ̀’ hàn, ó sì ṣàlàyé nuance ìwọ̀n ìṣọ́ra nínú ὡς.
