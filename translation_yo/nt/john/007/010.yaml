id: JHN.7.10
reference: John 7:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn arákùnrin rẹ̀ ti gòkè lọ sí àjọ̀dún náà, nígbà náà ni òun náà gòkè lọ, kò sì lọ ní gbangba, ṣùgbọ́n bí ẹni pé ó lọ ní ìkọ̀kọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “ṣùgbọ́n ní ìkọ̀kọ̀.” Ní tààrà, gbólóhùn Gíríìkì náà ni, “ṣùgbọ́n bí ẹni pé ní ìkọ̀kọ̀,” èyí tó lè mú gbólóhùn náà rọ̀ díẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: “Nígbà tí” fi ìtumọ̀ àkókò ὡς hàn, “ṣùgbọ́n” sì pa ìyípadà àti ìtakora pẹ̀lẹ́ tí δέ mú wá mọ́.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: ti gòkè lọ ... gòkè lọ
  rationale: “Gòkè lọ” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ìrìn-àjò lọ sí Jerúsálẹ́mù mu. “Ti” nínú gbólóhùn àkọ́kọ́ mú bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn ṣe kedere.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí àwọn arákùnrin Jésù, kì í ṣe ẹgbẹ́ àwọn ọkùnrin àti obìnrin lápapọ̀.
- source_word: εἰς τὴν ἑορτήν
  choice: sí àjọ̀dún náà
  rationale: “Àjọ̀dún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ἑορτή, ó sì yẹ fún àjọ̀dún àwọn Júù tí àyíká ọ̀rọ̀ ń sọ nípa rẹ̀.
- source_word: τότε καὶ αὐτὸς
  choice: nígbà náà ni òun náà
  rationale: Èyí pa ìtẹ̀lé àkókò τότε àti ìtẹnumọ́ pé Jésù fúnra rẹ̀ náà lọ mọ́.
- source_word: οὐ φανερῶς
  choice: kì í ṣe ní gbangba
  rationale: “Ní gbangba” túmọ̀ φανερῶς ní tààrà, ó sì dúró ní ìtakora kedere sí ohun tó tẹ̀ lé e.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: ṣùgbọ́n bí ẹni pé ó lọ ní ìkọ̀kọ̀
  rationale: “Bí ẹni pé” pa ìwọ̀n ìṣọ́ra inú ὡς mọ́, dípò kí a sọ ọ́ láìsí ìyẹ̀méjì pé ó lọ ní ìkọ̀kọ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ohun tí Jésù ṣe níbí pẹ̀lú ohun tó sọ ṣáájú nípa lílọ sí àjọ̀dún náà
  choice: A sọ ní tààrà pé ó lọ lẹ́yìn àwọn arákùnrin rẹ̀, kì í sì í ṣe ní gbangba.
  alternative: Kí a fi àlàyé kún un pé ó yí ọkàn rẹ̀ padà, tàbí kí a tún ọ̀rọ̀ náà ṣe láti mú gbogbo ìforígbárí kúrò.
  rationale: Ọ̀rọ̀ Gíríìkì kò ṣàlàyé ìforígbárí tó lè wà pẹ̀lú 7:8; nítorí náà, ìtumọ̀ yìí kò fi ìdáhùn ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Èdè Yorùbá àpéwọ̀, ọ̀wọ̀, àti òde òní ni a lò. Àmì ohùn wà níbi tó yẹ; ìṣètò gbólóhùn náà sì pa ìtẹ̀lé àti ìtakora inú orísun mọ́ láìjẹ́ kí èdè le fún òǹkàwé.
