source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: yo
  text: Àwọn Farisí gbọ́ pé àwọn èrò náà ń sọ̀rọ̀ kẹ́lẹ́kẹ́lẹ́ nípa rẹ̀.[a] Àwọn olórí àlùfáà àti àwọn Farisí sì rán àwọn ẹ̀ṣọ́[b] láti mú un.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “ń ráhùn” tàbí “ń sọ̀rọ̀ kùn-ún-kùn-ún.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìsọ̀rọ̀ ní ohùn kéré tí àìtẹ́lọ́rùn lè wà nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè pè wọ́n ní “àwọn òṣìṣẹ́ aláṣẹ” tàbí “àwọn ẹ̀ṣọ́ tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn òṣìṣẹ́ tí àwọn aṣáájú Júù rán.
    reason: lexical_alternative
  - marker: c
    text: Ìtumọ̀ mìíràn ni “láti dì í mú” tàbí “láti gba a mú.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà sọ pé kí wọ́n “mú un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: gbọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé àwọn Farisí gbọ́ ohun tí àwọn èrò ń sọ tàbí pé ìròyìn rẹ̀ dé etí wọn; “gbọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: τοῦ ὄχλου
  choice: àwọn èrò
  rationale: Nínú àyíká yìí, ὄχλος ń tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ; “àwọn èrò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún irú àwùjọ bẹ́ẹ̀.
- source_word: γογγύζοντος
  choice: ń sọ ... ní kẹ́lẹ́kẹ́lẹ́
  rationale: Ìtumọ̀ rẹ̀ ni ọ̀rọ̀ tí a ń sọ ní ohùn rírẹlẹ̀, tí ó sì lè ní ìbànújẹ́ tàbí àìtẹ́lọ́rùn nínú; gbolohun yìí pa ìtumọ̀ ọ̀rọ̀ abẹ́lẹ̀ náà mọ́ láìfi ìkùn sí i ju ohun tí Gíríìkì sọ lọ.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: àwọn nǹkan wọ̀nyí nípa rẹ̀
  rationale: Èyí pa ọ̀pọ̀ nǹkan tí ταῦτα ń tọ́ka sí mọ́, ó sì tú περὶ αὐτοῦ sí Yorùbá àdánidá.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú ẹgbẹ́ àlùfáà, kì í ṣe pé ọ̀pọ̀ ènìyàn ló ń di ipò àlùfáà àgbà kan náà mú.
- source_word: ὑπηρέτας
  choice: àwọn ẹ̀ṣọ́
  rationale: Nínú àyíká yìí, wọ́n jẹ́ àwọn òṣìṣẹ́ aláṣẹ tí a rán láti mú Jesu. “Àwọn ẹ̀ṣọ́” fi iṣẹ́ ìmúni wọn hàn láìsọ pé àwọn jẹ́ ọlọ́pàá ní ìtumọ̀ òde òní.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: láti mú un
  rationale: Gbolohun yìí fi ète tí wọ́n fi rán àwọn ẹ̀ṣọ́ hàn, “mú un” sì lè túmọ̀ sí dídì í mú tàbí sísá a mú gẹ́gẹ́ bí àyíká náà.
theological_decisions:
- issue: Irú àwọn ènìyàn tí ὑπηρέτας ń tọ́ka sí
  choice: àwọn ẹ̀ṣọ́ tí ó ń ṣiṣẹ́ lábẹ́ àṣẹ àwọn olórí àlùfáà àti àwọn Farisí
  alternative: àwọn òṣìṣẹ́; àwọn ọlọ́pàá tẹ́ńpìlì
  rationale: Ẹsẹ̀ náà sọ nípa ìgbìmọ̀ aláṣẹ láti mú Jesu. “Àwọn ẹ̀ṣọ́” pa agbára iṣẹ́ wọn mọ́, ṣùgbọ́n kò fi ìdánimọ̀ tó ṣe pàtó ju ọ̀rọ̀ Gíríìkì lọ kún un.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Àwọn èrò,” “sọ ... ní kẹ́lẹ́kẹ́lẹ́,” àti “mú un” jẹ́ àwọn àṣàyàn àdánidá; a yẹra fún “ọlọ́pàá” nínú àkọ́kọ́ nítorí ó lè mú ètò òde òní wọ inú ayé ìgbà náà.
