  text: ἀπεκρίθη ὁ ⸀ὄχλος· Δαιμόνιον ἔχεις· τίς σε ζητεῖ ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: yo
  text: Àwọn ènìyàn náà dáhùn pé,[a] “O ní ẹ̀mí èṣù. Ta ni ń wá ọ láti pa ọ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀mí èṣù ti wọ ọ́.” Ní tààrà, “O ní ẹ̀mí èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ ìtàn yìí túmọ̀ sí pé àwọn ènìyàn náà fèsì sí ohun tí Jésù sọ; “dáhùn” jẹ́ ọ̀nà Yorùbá àdánidá àti tó bójú mu.
- source_word: ὄχλος
  choice: àwọn ènìyàn náà
  rationale: Ní àyíká yìí, ὄχλος ń tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ; “àwọn ènìyàn náà” jẹ́ èdè Yorùbá tó ṣe kedere, tí kò sì ní ìrísí ọ̀rọ̀ àtijọ́.
- source_word: Δαιμόνιον ἔχεις
  choice: O ní ẹ̀mí èṣù
  rationale: Èyí tẹ̀ lé ìtumọ̀ gírámà Gíríìkì, ‘o ní ẹ̀mí èṣù,’ dípò kí a fi ìtumọ̀ àlàyé tó lágbára sí i pé ẹ̀mí èṣù ti gbà á.
- source_word: τίς
  choice: Ta ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbéèrè hàn gbangba nínú Gíríìkì; “Ta ni” pa ìbéèrè àsọ àsọdùn àwọn ènìyàn náà mọ́.
- source_word: ζητεῖ
  choice: ń wá
  rationale: Àmì ìṣe tó ń lọ lọ́wọ́ nínú “ń wá” fi ìṣe tí ó ń bá a lọ hàn, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἀποκτεῖναι
  choice: láti pa ọ́
  rationale: “Pa” jẹ́ ìtumọ̀ Yorùbá tààrà àti àdánidá fún pípa ènìyàn; kò fi ìtumọ̀ òfin tàbí ìdájọ́ kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δαιμόνιον nínú ẹ̀sùn tí àwọn ènìyàn fi kan Jésù
  choice: “O ní ẹ̀mí èṣù”
  alternative: “Ẹ̀mí èṣù ti gbà ọ́” tàbí “ẹlẹ́mìí èṣù ni ọ́”
  rationale: Àyànfẹ́ náà pa ìrísí ọ̀rọ̀ Gíríìkì mọ́, ó sì fi ẹ̀sùn àwọn ènìyàn hàn láìjẹ́ kí ìtumọ̀ náà dà bí ẹni pé akọ̀wé ń fìdí ẹ̀sùn náà múlẹ̀ tàbí pé ó ń túmọ̀ ipò ìṣàkóso ẹ̀mí èṣù ní pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. “Àwọn ènìyàn náà” jẹ́ àdánidá ju ìtumọ̀ líle bí “ọ̀pọ̀ ènìyàn” lọ nínú ìjíròrò yìí; àmì ohùn ni a fi sí ibi tí ó yẹ.
