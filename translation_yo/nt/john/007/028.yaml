id: JHN.7.28
reference: John 7:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: yo
  text: Nítorí náà, bí Jésù ti ń kọ́ni ní tẹ́ńpìlì, ó ké jáde pé, “Ẹ mọ̀ mí, ẹ sì mọ ibi tí mo ti wá.[a] Èmi kò sì wá láti ara mi,[b] ṣùgbọ́n ẹni tí ó rán mi jẹ́ ẹni tòótọ́,[c] ẹni tí ẹ̀yin kò mọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè gbọ́ ọ̀rọ̀ yìí bí ìfojúdi tàbí ìpèníjà pé, “Ṣé ẹ mọ̀ mí, ẹ sì mọ ibi tí mo ti wá?” Ṣùgbọ́n ní Gíríìkì, ó jẹ́ gbólóhùn ìjẹ́rìí.
    reason: alternative_reading
  - marker: b
    text: “Láti ara mi” tún lè túmọ̀ sí “nípa ìfẹ́ tàbí ìgbésẹ̀ ara mi fúnra mi,” èyí tó ń fi hàn pé Jésù kò wá ní ìfẹ́ ara rẹ̀ nìkan.
    reason: lexical_alternative
  - marker: c
    text: “Tòótọ́” tún lè ní ìtumọ̀ “ojúlówó” tàbí “gidi” nínú bí Jòhánù ṣe ń lo ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: ó ké jáde
  rationale: Ó fi ohùn gíga àti ọ̀rọ̀ tí a sọ ní gbangba hàn, láìjẹ́ kí ó dà bí igbe ìrora.
- source_word: ἐν τῷ ἱερῷ
  choice: ní tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: διδάσκων ... καὶ λέγων
  choice: bí ... ti ń kọ́ni ... ó ... pé
  rationale: Ìtumọ̀ yìí pa ìṣe tí ń lọ lọ́wọ́ mọ́, ó sì sọ ọ̀rọ̀ náà ní Yorùbá tó rọrùn láti lóye.
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: Ẹ mọ̀ mí, ẹ sì mọ
  rationale: Ó pa àtúnsọ ọ̀rọ̀-ìṣe οἴδατε mọ́, èyí tí ó ṣe pàtàkì fún ìtẹnumọ́ àti ìfojúdi tàbí ìpèníjà tó ṣeé ṣe nínú ọ̀rọ̀ náà.
- source_word: πόθεν εἰμί
  choice: ibi tí mo ti wá
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì fi ìbéèrè nípa orísun Jésù sílẹ̀ láìdín in kù sí ibi ìbí ayé tàbí sọ ọ́ di ti ọ̀run ní pàtó.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: láti ara mi
  rationale: Ó pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́; ó tún lè túmọ̀ sí pé Jésù kò wá nípa ìpinnu ara rẹ̀ nìkan.
- source_word: οὐκ ἐλήλυθα
  choice: Èmi kò ... wá
  rationale: Yorùbá kò fi ìyàtọ̀ àsìkò perfect Gíríìkì hàn bí Gẹ̀ẹ́sì, ṣùgbọ́n ọ̀rọ̀ yìí bá àyíká iṣẹ́ Jésù tó ń bá a lọ mu.
- source_word: ἀληθινὸς
  choice: ẹni tòótọ́
  rationale: “Tòótọ́” lè gba ìtumọ̀ ẹni tí ó jẹ́ ojúlówó, gidi, tàbí ẹni tí a lè gbẹ́kẹ̀ lé, gẹ́gẹ́ bí lílo ọ̀rọ̀ náà nínú Jòhánù.
- source_word: ὁ πέμψας με
  choice: ẹni tí ó rán mi
  rationale: Ó pa ẹni tó ṣe iṣẹ́ rírán náà mọ́ láìfi “Baba” kún ohun tí ẹsẹ yìí kò sọ ní tààrà.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: ẹni tí ẹ̀yin kò mọ̀
  rationale: Ó pa ẹ̀sùn tààrà náà àti ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς mọ́.
theological_decisions:
- issue: Bóyá “Ẹ mọ̀ mí, ẹ sì mọ ibi tí mo ti wá” jẹ́ gbólóhùn lasan, ìfojúdi, tàbí ìbéèrè àròsọ.
  choice: A ṣe é ní ìrísí gbólóhùn ìjẹ́rìí, bí gírámà Gíríìkì ṣe rí.
  alternative: “Ṣé ẹ mọ̀ mí, ẹ sì mọ ibi tí mo ti wá?” tàbí fífi àmì ìfojúdi kún un.
  rationale: Gíríìkì jẹ́ gbólóhùn ìjẹ́rìí, bí ó tilẹ̀ jẹ́ pé àyíká lè mú un dun bí ìfojúdi tàbí ìpèníjà. Ìtumọ̀ náà pa ìdàrúdàpọ̀ ìtumọ̀ yìí mọ́.
- issue: Ìtumọ̀ orísun Jésù nínú “ibi tí mo ti wá” àti “kò wá láti ara mi.”
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní fífẹ̀ tó lè ní ìtumọ̀ ibi tí àwọn ènìyàn rò pé ó ti wá àti iṣẹ́ àṣẹ Ọlọ́run tó jinlẹ̀.
  alternative: Dídín in kù sí ibi ìbí ayé nìkan tàbí fífi “láti ọ̀run” kún un.
  rationale: Jòhánù sábà máa ń lo ìpele ìtumọ̀ púpọ̀ nípa orísun Jésù; a kò gbọ́dọ̀ pinnu ohun tí gbólóhùn Gíríìkì náà kò sọ ní pàtàkì.
- issue: Ta ni “ẹni tí ó rán mi” ń tọ́ka sí?
  choice: A kò fi “Baba” kún ọ̀rọ̀ náà.
  alternative: “Baba tí ó rán mi.”
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ìwé Jòhánù fi ẹni náà hàn, ẹsẹ yìí fúnra rẹ̀ lo àpèjúwe “ẹni tí ó rán mi,” nítorí náà a pa á mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. “Ẹ/ẹ̀yin” pa ọ̀pọ̀ ènìyàn inú ὑμεῖς mọ́, “ń kọ́ni” sì jẹ́ àdánidá ju ìtumọ̀ líle “ń kọ́” lọ ní àyíká yìí. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
