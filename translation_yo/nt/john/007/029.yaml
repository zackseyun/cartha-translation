  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: yo
  text: Èmi mọ̀ ọ́,[a] nítorí pé láti ọ̀dọ̀ rẹ̀ ni mo wà,[b] òun sì ni ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi mọ̀ ọ́ pé láti ọ̀dọ̀ rẹ̀ ni mo wà.” Ọ̀rọ̀ ìsopọ̀ Gíríìkì náà lè bẹ̀rẹ̀ ohun tí a mọ̀ (“pé”) tàbí ìdí tí a fi mọ̀ ọ́ (“nítorí pé”); àyíká ọ̀rọ̀ fi ìtumọ̀ ìdí hàn jù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Mo wá láti ọ̀dọ̀ rẹ̀,” tàbí “Mo wá láti iwájú rẹ̀.” Gbólóhùn Gíríìkì náà lè fi orísun tàbí ìpilẹ̀ hàn ní pàtó ju “láti ọ̀dọ̀ rẹ̀” lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Èmi
  rationale: A lo arọ́pò-orúkọ olùṣe tí a tẹnumọ́ láti fi ìtẹnumọ́ inú èdè Gíríìkì hàn.
- source_word: οἶδα
  choice: mọ̀
  rationale: Ọ̀rọ̀ náà ń sọ ipò ìmọ̀ tí ó wà nísinsin yìí; ‘mọ̀’ ni ọ̀nà Yorùbá tó ṣe déédé jù.
- source_word: αὐτόν
  choice: ọ́
  rationale: Arọ́pò-orúkọ yìí tọ́ka sí Baba nínú àyíká ọ̀rọ̀, láìfi àlàyé kún ẹsẹ náà.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Níbí, ó ṣeé ṣe kí ὅτι fi ìdí tí Jésù fi mọ̀ ọ́ hàn; àyíká ọ̀rọ̀ ṣètìlẹ́yìn fún ìtumọ̀ ìdí.
- source_word: παρ’ αὐτοῦ
  choice: láti ọ̀dọ̀ rẹ̀
  rationale: παρά pẹ̀lú gẹnítífù lè fi orísun tàbí ibi tí ẹnì kan ti wá hàn; gbólóhùn Yorùbá yìí pa ìtumọ̀ méjèèjì mọ́ ní ọ̀nà àdánidá.
- source_word: εἰμι
  choice: ni mo ti wá
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰμι jẹ́ ‘mo jẹ́/wà,’ Yorùbá àdánidá kò sábà sọ ‘mo jẹ́ láti ọ̀dọ̀ rẹ̀.’ ‘Ni mo ti wá’ sọ orísun ní kedere láìdín ìtumọ̀ rẹ̀ kù sí iṣẹ́ ìránṣẹ́ nìkan.
- source_word: κἀκεῖνός
  choice: òun sì ni
  rationale: Àkópọ̀ καί àti ἐκεῖνος ni; ‘òun sì ni’ pa ìtẹnumọ́ arọ́pò-orúkọ náà mọ́ ní Yorùbá àdánidá.
- source_word: με
  choice: mi
  rationale: Ó jẹ́ arọ́pò-orúkọ ẹni tí iṣẹ́ ọ̀rọ̀-ìṣe kàn.
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Aorístì náà ń tọ́ka sí iṣẹ́ rírán tí ó ṣẹlẹ̀; ‘rán’ jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ ìbáṣepọ̀ Jésù pẹ̀lú Baba nínú παρ’ αὐτοῦ εἰμι
  choice: láti ọ̀dọ̀ rẹ̀ ni mo ti wá
  alternative: láti ọ̀dọ̀ rẹ̀ ni mo ti ń bẹ
  rationale: Èyí sọ pé Baba ni orísun Jésù, ṣùgbọ́n kò tú u sí àlàyé ẹ̀kọ́ ìgbàgbọ́ kan pàtó. Ó tún yẹra fún lílo ‘ó rán mi’ gẹ́gẹ́ bí ìtumọ̀ apá àkọ́kọ́, nítorí apá tó tẹ̀ lé e ti sọ iṣẹ́ rírán ní tààrà.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì yé òǹkàwé òde òní. A lo ‘Èmi’ àti ‘òun sì ni’ láti pa ìtẹnumọ́ Gíríìkì mọ́; a lo ‘láti ọ̀dọ̀’ fún orísun tàbí ibi ìwá.
