id: JHN.6.17
reference: John 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: yo
  text: Wọ́n wọ ọkọ̀ ojú omi kan, wọ́n sì ń lọ kọjá òkun sí Kápánáúmù.[a] Ilẹ̀ sì ti ṣú tẹ́lẹ̀.[b] Jésù kò sì tíì dé ọ̀dọ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ sí òdìkejì òkun, sí Kápánáúmù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ilẹ̀ sì ti ṣú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Wọ́n wọ ọkọ̀ ojú omi kan
  rationale: A yí àpólà alábápín aorist náà sí gbólóhùn olódì láti mú kí Yorùbá dùn mọ́ etí, nígbà tí ìtẹ̀lé ìṣe—wọ ọkọ̀ kí wọ́n tó ń rékọjá—ṣì dúró. “Ọkọ̀ ojú omi” yẹ fún πλοῖον láìfi hàn pé ó jẹ́ ọkọ̀ ńlá.
- source_word: ἤρχοντο
  choice: wọ́n sì ń rékọjá ... lọ
  rationale: Àmì “ń” pa ìṣe tí ó ń lọ lọ́wọ́ inú imperfect mọ́; “rékọjá ... lọ” sì fi ìrìnàjò kọjá òkun hàn ní Yorùbá àdánidá.
- source_word: πέραν τῆς θαλάσσης
  choice: rékọjá òkun
  rationale: Èyí pa ìtumọ̀ ìrìnàjò kọjá tàbí sí òdìkejì θάλασσα mọ́. “Òkun” ni ìbámu pẹ̀lú ọ̀rọ̀ orísun, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí adágún.
- source_word: εἰς Καφαρναούμ
  choice: lọ sí Kápánáúmù
  rationale: A ṣe àfọwọ́kọ orúkọ ibi náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Ilẹ̀ sì ti ṣú tẹ́lẹ̀
  rationale: Ọ̀nà Yorùbá àdánidá yìí fi hàn pé òkùnkùn ti dé ṣáájú àkókò ìtàn náà, ó sì pa ìyọrísí ìyípadà inú pluperfect mọ́.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: kò sì tíì dé ọ̀dọ̀ wọn
  rationale: “Kò tíì dé” fi ìtumọ̀ οὔπω àti pluperfect hàn pé títí di àkókò yẹn kò tíì dé; “ọ̀dọ̀ wọn” jẹ́ ìtumọ̀ tààrà tí ó sì ṣe déédé fún πρὸς αὐτούς.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Àfọwọ́kọ orúkọ náà ní Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìrísí ìṣe àti ìtẹ̀lé àkókò nínú ìtàn
  choice: Wọ́n kọ́kọ́ wọ ọkọ̀, wọ́n sì ń rékọjá lọ sí Kápánáúmù; ilẹ̀ ti ṣú, Jésù kò sì tíì dé ọ̀dọ̀ wọn.
  alternative: A lè sọ pé “wọ́n lọ” àti “ilẹ̀ ti ṣú” láìfi ìṣe tí ó ń lọ lọ́wọ́ hàn.
  rationale: Ìtumọ̀ yìí pa ìṣe tí ó ń lọ lọ́wọ́ nínú ἤρχοντο àti ipò tí ó ti ṣẹlẹ̀ nínú ἐγεγόνει/ἐληλύθει mọ́, kí ìdọ̀gbà ìtàn tó ṣáájú dídé Jésù lórí omi má bàjẹ́. Kò fi ẹ̀kọ́ ìsìn kankan tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó lọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A yan “Ilẹ̀ ti ṣú” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá, nígbà tí àlàyé ìtumọ̀ tó sún mọ́ ọ̀rọ̀ “òkùnkùn” wà ní àlàyé ìsàlẹ̀.
