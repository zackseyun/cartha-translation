revisions:
- from: Nítorí náà, àwọn Júù ń kùn sí i nítorí ó sọ pé,[a] “Èmi ni oúnjẹ náà tí ó sọ̀kalẹ̀ láti ọ̀run.”
  to: Nítorí náà, àwọn Júù ń kùn nípa rẹ̀ nítorí ó sọ pé,[a] “Èmi ni búrẹ́dì náà tí ó sọ̀kalẹ̀ láti ọ̀run.”
  rationale: The revision corrects the relation expressed by περὶ αὐτοῦ and renders ἄρτος with the specific Yoruba borrowing for bread. It otherwise preserves the draft’s wording, tense/aspect, register, and footnote qualification.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:11Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the ongoing imperfect action, the causal clause, Jesus’ emphatic self-identification, and the descent from heaven. However, “ń kùn sí i” normally suggests complaining to him, whereas περὶ αὐτοῦ means “about him/concerning him.” Also, ἄρτος specifically denotes bread; rendering it as the broader “oúnjẹ” weakens the concrete image and its connection with the surrounding bread discourse.
  naturalness: “Ń kùn nípa rẹ̀” is natural Standard Yoruba for grumbling about someone. “Búrẹ́dì náà” is clear contemporary Yoruba and maintains the intended metaphor more precisely than the general term “oúnjẹ.”
  terminology: Retain “àwọn Júù” as the direct rendering of οἱ Ἰουδαῖοι, with the supplied note to prevent an unjustifiably universal reading. Use “búrẹ́dì” for ἄρτος in this discourse.
  issues:
  - severity: medium
    issue: The phrase “ń kùn sí i” does not accurately render περὶ αὐτοῦ.
    rationale: The Greek preposition means “about/concerning him.” In Yoruba, “kùn sí ẹni” can mean complain to someone; “kùn nípa rẹ̀” expresses the required referent.
  - severity: medium
    issue: “Oúnjẹ náà” is too broad for ὁ ἄρτος.
    rationale: Ἄρτος is bread, not food in general. “Búrẹ́dì náà” preserves the concrete lexical meaning and the recurring bread image in John 6.
  revised_text: Nítorí náà, àwọn Júù ń kùn nípa rẹ̀ nítorí ó sọ pé,[a] “Èmi ni búrẹ́dì náà tí ó sọ̀kalẹ̀ láti ọ̀run.”
  revised_footnotes:
  - marker: a
    text: A tún lè túmọ̀ “àwọn Júù” sí “àwọn ará Jùdíà” tàbí, ní àwọn àyíká ọ̀rọ̀ kan, “àwọn aṣáájú Júù.” Nínú Jòhánù, gbólóhùn yìí lè tọ́ka sí ẹgbẹ́ kan tí ó ń tako Jésù, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: alternative_reading
  revision_rationale: The revision corrects the relation expressed by περὶ αὐτοῦ and renders ἄρτος with the specific Yoruba borrowing for bread. It otherwise preserves the draft’s wording, tense/aspect, register, and footnote qualification.
