id: JHN.6.41
reference: John 6:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù ń kùn nípa rẹ̀ nítorí ó sọ pé,[a] “Èmi ni búrẹ́dì náà tí ó sọ̀kalẹ̀ láti ọ̀run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “àwọn Júù” sí “àwọn ará Jùdíà” tàbí, ní àwọn àyíká ọ̀rọ̀ kan, “àwọn aṣáájú Júù.” Nínú Jòhánù, gbólóhùn yìí lè tọ́ka sí ẹgbẹ́ kan tí ó ń tako Jésù, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: ń kùn
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn, ó sì mú èrò ẹ̀dùn tàbí àròyé tí a ń sọ ní ìdákẹ́jẹ wá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àbájáde tàbí ìtẹ̀síwájú ìròyìn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tú ọ̀rọ̀ Gíríìkì náà ní tààrà, láì fi kún un pé àwọn aṣáájú nìkan ni tàbí pé ìtumọ̀ rẹ̀ jẹ́ ti agbègbè Jùdíà nìkan.
- source_word: περὶ αὐτοῦ
  choice: sí i
  rationale: Nínú àkópọ̀ pẹ̀lú 'ń kùn,' èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń ṣàròyé nípa rẹ̀ tàbí lòdì sí ohun tí ó sọ.
- source_word: ὅτι
  choice: nítorí
  rationale: Níhìn-ín, ὅτι ń fi ìdí tí wọ́n fi ń kùn hàn.
- source_word: εἶπεν
  choice: ó sọ
  rationale: Ó ṣe àfihàn aorist gẹ́gẹ́ bí ìṣe tí ó ṣẹlẹ̀ ní àkókò àtijọ́ láì fi ìtumọ̀ míì kún un.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ ẹni àkọ́kọ́ mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ìdánimọ̀.
- source_word: ὁ ἄρτος
  choice: oúnjẹ náà
  rationale: Nínú Yorùbá Bíbélì, 'oúnjẹ' lè dúró fún búrẹ́dì gẹ́gẹ́ bí oúnjẹ pàtàkì; 'náà' pa ìtọ́kasí pàtó inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὁ καταβὰς
  choice: tí ó sọ̀kalẹ̀
  rationale: Gbólóhùn ìbátan yìí ṣe àfihàn participle náà ní Yorùbá àdánidá, ó sì tọ́ka sí ìsọ̀kalẹ̀ tí ó ti ṣẹlẹ̀.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Èyí pa ìtumọ̀ orísun tàbí ibi tí ó ti wá mọ́ ní ọ̀nà Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; àwọn aṣáájú Júù
  rationale: A pa ọ̀rọ̀ orísun mọ́ láì dín àwọn tí ó ń tọ́ka sí kù ju ohun tí ẹsẹ yìí sọ lọ. Àlàyé ìsàlẹ̀ fi hàn pé nínú Jòhánù, ó lè tọ́ka sí ẹgbẹ́ Júù kan tí ó ń tako Jésù, kì í ṣe gbogbo àwọn Júù ní àkókò gbogbo.
- issue: Àpèjúwe Jésù gẹ́gẹ́ bí ὁ ἄρτος
  choice: oúnjẹ náà
  alternative: búrẹ́dì náà
  rationale: A yan ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ nínú èdè Bíbélì fún búrẹ́dì gẹ́gẹ́ bí oúnjẹ pàtàkì, láì tú àpèjúwe náà sí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti bá ìlò àdánidá mu. Gbólóhùn náà pa ìṣe tí ń lọ lọ́wọ́ nínú imperfect àti ìtẹnumọ́ 'Èmi ni' mọ́.
