- from: Nítorí náà, Jésù gbé ojú rẹ̀ sókè, ó sì rí i pé ọ̀pọ̀ ènìyàn ń bọ̀ tọ̀ ọ́ wá. Ó sọ fún Fílípì pé, “Níbo ni a ó ti ra àkàrà kí àwọn wọ̀nyí lè jẹ?”[a]
  to: Nítorí náà, Jésù gbé ojú rẹ̀ sókè, ó sì rí i pé ọ̀pọ̀ ènìyàn ń bọ̀ wá sọ́dọ̀ rẹ̀. Ó sọ fún Fílípì pé, “Níbo ni a ó ti ra búrẹ́dì kí àwọn wọ̀nyí lè jẹ?”[a]
  rationale: A rọ́pò ‘àkàrà’ pẹ̀lú ‘búrẹ́dì’ nítorí pé búrẹ́dì ni ìtumọ̀ tó tọ́ fún ἄρτους níbí, nígbà tí àkàrà jẹ́ oúnjẹ ẹ̀wà nínú Yorùbá. A tún tún àlàyé ìsàlẹ̀ ṣe kí ó ṣàfihàn ìyàtọ̀ bread/loaves ní tòótọ́, a sì ṣe ìmúrasílẹ̀ kékeré sí gbolohun ìtọ́kasí ìdarí fún ìmọ̀lára Yorùbá tó dára.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:06Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìtẹ̀lé ìṣe, ogunlọ́gọ̀ ènìyàn tí ń bọ̀, ìbéèrè nípa ibi rírà, àti ète kí wọ́n jẹ mọ́ dáadáa. Ṣùgbọ́n ‘àkàrà’ nínú Yorùbá òde òní sábà ń tọ́ka sí oúnjẹ tí a ṣe pẹ̀lú ẹ̀wà (bean cake), kì í ṣe ἄρτους/bread; ó lè yí ìtumọ̀ oúnjẹ náà padà.
  naturalness: ‘Búrẹ́dì’ jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀, tí ó sì ṣe kedere fún bread. ‘ń bọ̀ wá sọ́dọ̀ rẹ̀’ jẹ́ ìsọ̀rọ̀ Yorùbá tó rọrùn ju ‘ń bọ̀ tọ̀ ọ́ wá’ lọ ní àyíká yìí.
  terminology: A yẹ kí a lo ‘búrẹ́dì’ fún ἄρτους. Àlàyé ìsàlẹ̀ gbọdọ̀ lo ‘àwọn ìṣù búrẹ́dì,’ kì í ṣe ‘àwọn ìṣù àkàrà,’ kí ó lè pa àìdánilójú tó wà láàárín bread lápapọ̀ àti àwọn ìṣù kọ̀ọ̀kan mọ́.
  issues:
