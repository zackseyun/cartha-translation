  - severity: medium
    issue: Àlàyé ìsàlẹ̀ náà lo ‘àwọn ìṣù àkàrà.’
    rationale: Ó tún jẹ́ kí ìtumọ̀ ‘àkàrà’ tí kò bá ẹsẹ̀ náà mu lágbára; ‘àwọn ìṣù búrẹ́dì’ ni ó yẹ fún ìtumọ̀ ‘loaves.’
  - severity: low
    issue: ‘ń bọ̀ tọ̀ ọ́ wá’ kò rọrùn bí ‘ń bọ̀ wá sọ́dọ̀ rẹ̀.’
    rationale: Ìyípadà náà mú kí gbolohun ìtàn náà dun ní Yorùbá ìwọ̀n-ìgbàlódé, láì yí ìdarí πρὸς αὐτόν padà.
