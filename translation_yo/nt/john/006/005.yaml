id: JHN.6.5
reference: John 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: yo
  text: Nítorí náà, Jésù gbé ojú rẹ̀ sókè, ó sì rí i pé ọ̀pọ̀ ènìyàn ń bọ̀ wá sọ́dọ̀ rẹ̀. Ó sọ fún Fílípì pé, “Níbo ni a ó ti ra búrẹ́dì kí àwọn wọ̀nyí lè jẹ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Níbo ni a ó ti ra àwọn ìṣù búrẹ́dì kí àwọn wọ̀nyí lè jẹ?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí búrẹ́dì lápapọ̀ tàbí àwọn ìṣù búrẹ́dì kọ̀ọ̀kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμοὺς
  choice: gbé ojú rẹ̀ sókè
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà tí ó bá èdè Yorùbá mu, láì túmọ̀ ọ́ ju bó ṣe yẹ lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìsopọ̀ àti ìtẹ̀síwájú ìtàn hàn; Yorùbá lè lò ó lọ́nà àdánidá níbí.
- source_word: θεασάμενος
  choice: ó sì rí i
  rationale: Ó sọ ìfiyèsí ojú tí ọ̀rọ̀ náà túmọ̀ sí ní kedere, ó sì mú kí ìtàn ṣàn dáadáa ní Yorùbá.
- source_word: πολὺς ὄχλος
  choice: ọ̀pọ̀ ènìyàn
  rationale: Èyí jẹ́ ọ̀nà àdánidá, tó ṣe kedere láti sọ ogunlọ́gọ̀ ńlá ní Yorùbá òde òní.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: ń bọ̀ tọ̀ ọ́ wá
  rationale: Ó pa ìdarí ìṣípò πρός mọ́, ó sì lo ìṣe tí ń lọ lọ́wọ́ gẹ́gẹ́ bí àyíká ìtàn ṣe béèrè.
- source_word: λέγει πρὸς Φίλιππον
  choice: Ó sọ fún Fílípì pé
  rationale: A tú historical present náà sí ìgbà àtijọ́ fún ìtàn Yorùbá tó rọrùn láti kà, nígbà tí a pa ẹni tí a bá sọ̀rọ̀ mọ́.
- source_word: Πόθεν
  choice: Níbo ni a ó ti
  rationale: ‘Níbo ... ti’ jẹ́ ọ̀nà Yorùbá àdánidá tó tún pa ìtumọ̀ ibi orísun nǹkan mọ́.
- source_word: ἀγοράσωμεν
  choice: ra
  rationale: ‘Ra’ ni ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó wọ́pọ̀, fún ìṣe rírà.
- source_word: ἄρτους
  choice: àkàrà
  rationale: Nínú àyíká Bíbélì, ‘àkàrà’ lè tọ́ka sí búrẹ́dì tàbí àwọn ìṣù búrẹ́dì; ó bá oúnjẹ tí wọ́n ń pín fún ọ̀pọ̀ ènìyàn mu.
- source_word: ἵνα φάγωσιν
  choice: kí ... lè jẹ
  rationale: Ó fi ète ἵνα àti agbára subjunctive hàn ní Yorùbá àdánidá.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ó pa ìtọ́kasí taara sí àwọn ènìyàn tó wà níbẹ̀ mọ́.
theological_decisions:
- issue: Ìtúmọ̀ historical present àti àwọn participle nínú ìtàn
  choice: A lo ìgbà àtijọ́ fún λέγει (‘Ó sọ’), a sì ṣètò àwọn participle gẹ́gẹ́ bí àwọn ìṣe tó tẹ̀ lé ara wọn (‘gbé... ó sì rí i’).
  alternative: A lè túmọ̀ ọ́ lọ́nà fọ́ọ̀mù sí i pé, ‘Jésù ... gbé ojú rẹ̀ sókè, nígbà tí ó sì rí ... ó wí fún Fílípì.’
  rationale: Ìpinnu ara èdè ni, kì í ṣe yíyan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan. Ó mú kí Yorùbá jẹ́ àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣe inú Gíríìkì mọ́.
- issue: Ìtumọ̀ ἄρτους
  choice: àkàrà
  alternative: búrẹ́dì tàbí àwọn ìṣù àkàrà
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí búrẹ́dì lápapọ̀ tàbí àwọn ìṣù kọ̀ọ̀kan. A pa ààyè ìtumọ̀ náà mọ́ ní àkọ́kọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìwọ̀n-ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà rọrùn fún òǹkàwé gbogbogbòò, ó sì pa àwòrán àti ìtẹ̀lé ìṣe inú Gíríìkì mọ́.
