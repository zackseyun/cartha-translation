  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: yo
  text: Láti ìgbà náà lọ, ọ̀pọ̀ lára àwọn ọmọ ẹ̀yìn rẹ̀ padà sẹ́yìn, wọ́n kò sì bá a rìn mọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí èyí, ọ̀pọ̀ lára àwọn ọmọ ẹ̀yìn rẹ̀ lọ kúrò”; ìbẹ̀rẹ̀ gbólóhùn Gíríìkì náà lè tọ́ka sí ìdí, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ yìí, “Láti ìgbà náà lọ” túbọ̀ fi hàn pé ìṣẹ̀lẹ̀ náà jẹ́ àkókò ìyípadà.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: Láti ìgbà náà lọ
  rationale: Ọ̀rọ̀ yìí lè tọ́ka sí ìdí tàbí sí àkókò; nínú àyíká ọ̀rọ̀ yìí, ó dára jù láti fi hàn gẹ́gẹ́ bí ìbẹ̀rẹ̀ ìyípadà láti ìgbà náà lọ.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ọ̀pọ̀ lára àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: '“Lára” pa ìtumọ̀ apá-kan-nínú-ọ̀pọ̀ mọ́: àwọn tó lọ jẹ́ ọ̀pọ̀ nínú ẹgbẹ́ àwọn ọmọ ẹ̀yìn rẹ̀, kì í ṣe dandan gbogbo wọn.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: padà sẹ́yìn
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ sí yípadà kúrò tàbí fà sẹ́yìn, kì í ṣe kíkàn lọ sí ibòmíràn.
- source_word: οὐκέτι
  choice: kò ... mọ́
  rationale: Ìlànà Yorùbá yìí fi hàn pé ìṣe náà dáwọ́ dúró láti àkókò yẹn lọ.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: bá a rìn
  rationale: Èyí pa àwòrán “rírìn pẹ̀lú rẹ̀” mọ́, ó sì lè ní ìtumọ̀ ìbákẹ́gbẹ́ àti títẹ̀lé láì sọ ìtumọ̀ náà di ohun kan ṣoṣo.
theological_decisions:
- issue: Bóyá μαθηταί yẹ kí a túmọ̀ rẹ̀ lọ́nà tí yóò fi tọ́ka sí àwọn Méjìlá tàbí sí àwọn onígbàgbọ́ tòótọ́ nìkan
  choice: àwọn ọmọ ẹ̀yìn
  alternative: àwọn olùtẹ̀lé
  rationale: Ẹsẹ̀ náà sọ pé ọ̀pọ̀ lára àwọn ọmọ ẹ̀yìn Jésù yípadà kúrò lọ́dọ̀ rẹ̀; kò dá wọn mọ́ àwọn Méjìlá, bẹ́ẹ̀ ni kò yanju ipò ẹ̀mí wọn. “Àwọn ọmọ ẹ̀yìn” pa ìdánimọ̀ ìtàn náà àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A pa àwòrán rírìn pẹ̀lú Jésù mọ́ dípò fífi “tẹ̀lé” rọ́pò rẹ̀.
