id: JHN.6.32
reference: John 6:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: yo
  text: 'Nítorí náà, Jésù sọ fún wọn pé, “Lóòótọ́, lóòótọ́ ni mo wí fún yín: Mósè kọ́ ni ó ti fún yín ní oúnjẹ láti ọ̀run[a]; ṣùgbọ́n Baba mi ni ó ń fún yín ní oúnjẹ tòótọ́[b] láti ọ̀run.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Mósè kò ti fún yín ní oúnjẹ láti ọ̀run.” Nínú Gíríìkì, ọ̀rọ̀ àìsí wà níwájú “Mósè,” èyí tó tẹnu mọ́ ìtakora nípa ẹni tó fúnni.
    reason: lexical_alternative
  - marker: b
    text: “Oúnjẹ tòótọ́” tún lè túmọ̀ sí “oúnjẹ gidi” tàbí “oúnjẹ ojúlówó”—ìyẹn, oúnjẹ láti ọ̀run tó pé jù, kì í ṣe mánà ìṣáájú nìkan gẹ́gẹ́ bí àmì.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ Jésù mọ́ ìjíròrò tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn ní Yorùbá àdánidá.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́, ó sì fi ìjẹ́pàtàkì àti ìdánilójú ọ̀rọ̀ Jésù hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ ìpilẹ̀, ó sì bá ọ̀nà ọ̀rọ̀ ọlọ́lá ti ìkéde náà mu.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: Mósè kọ́ ni ó ti fún yín
  rationale: Ìṣètò yìí fi ìtakora lórí ẹni tó ṣe iṣẹ́ náà hàn bí Gíríìkì ṣe fi àìsí síwájú ‘Mósè’; ‘ti fún’ tún pa ìbáṣepọ̀ iṣẹ́ àtijọ́ náà pẹ̀lú ìjíròrò ìsinsìnyí mọ́.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: oúnjẹ láti ọ̀run
  rationale: Ní àyíká mánà, ‘oúnjẹ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἄρτος tí ó tún lè tọ́ka sí oúnjẹ gẹ́gẹ́ bí ohun ìgbẹ́mìíró; ó pa àwòrán ohun tí a fi ń jẹ láti ọ̀run mọ́ láìlo ọ̀rọ̀ àjèjì.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: ṣùgbọ́n Baba mi ni ó ń fún yín
  rationale: ‘ń fún’ pa iṣẹ́ tó ń lọ lọ́wọ́ tàbí tó ń ṣiṣẹ́ ní ìsinsìnyí mọ́, ní ìtakora sí ‘ti fún’; ìṣètò ‘Baba mi ni’ tún fi ẹni tó ń fúnni hàn kedere.
- source_word: ὁ πατήρ μου
  choice: Baba mi
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáṣepọ̀ ọmọ àti baba tí Jésù sọ nípa rẹ̀.
- source_word: τὸν ἀληθινόν
  choice: tòótọ́
  rationale: Ó pa ìtumọ̀ ohun tó jẹ́ òtítọ́, ojúlówó, tàbí ohun gidi tó pé mọ́, láìdín ìtumọ̀ Jòhánù kù sí ọ̀nà kan ṣoṣo.
theological_decisions:
- issue: Ìtakora àkókò láàárín ohun tí a so mọ́ Mósè àti ohun tí Baba ń fúnni
  choice: Lo ‘ti fún’ fún δέδωκεν àti ‘ń fún’ fún δίδωσιν.
  alternative: ‘fún’ ... ‘fún’ láìfi ìyàtọ̀ àkókò tàbí ipò iṣẹ́ hàn.
  rationale: 'Ìyàtọ̀ náà pa ìfọkànsìn ọ̀rọ̀ Gíríìkì mọ́: mánà aginjù ni a ń rántí, nígbà tí fífúnni Baba jẹ́ ohun tí ọ̀rọ̀ Jésù fi hàn gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ ní ìsinsìnyí. Èyí kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.'
- issue: Ìtumọ̀ ‘oúnjẹ tòótọ́’
  choice: Pa ‘tòótọ́’ mọ́ nínú ẹsẹ̀ náà.
  alternative: ‘oúnjẹ gidi’ tàbí ‘oúnjẹ ojúlówó.’
  rationale: ἀληθινός lè túmọ̀ sí ohun tòótọ́, ojúlówó, tàbí ohun tó jẹ́ ìmúṣẹ ohun àkọ́kọ́. ‘Tòótọ́’ pa ìfẹ̀ ìtumọ̀ wọ̀nyí mọ́, ó sì yàgò fún ṣíṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́ fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘oúnjẹ’ dípò ọ̀rọ̀ àjèjì ‘búrẹ́dì’ tàbí ‘àkàrà,’ nítorí àyíká mánà àti ìtumọ̀ gbígbòòrò ἄρτος níbí; ìlò yìí tún jẹ́ ohun tí òǹkàwé Yorùbá lásán lè lóye ní kedere.
