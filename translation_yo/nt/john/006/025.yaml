id: JHN.6.25
reference: John 6:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: yo
  text: Nígbà tí wọ́n sì rí i ní òdìkejì òkun, wọ́n wí fún un pé, “Rábì, ìgbà wo ni o dé ibí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn ni Καὶ; “sì” ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú lọ́nà àdánidá ní Yorùbá.
- source_word: εὑρόντες
  choice: Nígbà tí wọ́n rí i
  rationale: Aorist participle náà ní ìtumọ̀ àkókò níbí; gbólóhùn yìí fi hàn pé rírí rẹ̀ ṣáájú ọ̀rọ̀ tí wọ́n sọ.
- source_word: πέραν τῆς θαλάσσης
  choice: ní òdìkejì òkun
  rationale: πέραν pẹ̀lú genitive tọ́ka sí ibi tí ó wà ní ìhà kejì; “ní òdìkejì òkun” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì pa ìyàtọ̀ ibi mọ́.
- source_word: εἶπον αὐτῷ
  choice: wọ́n wí fún un
  rationale: Ìtumọ̀ taara λέγω ni “wí/sọ”; bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ wọn, a kò yí i sí ọ̀rọ̀ ìṣe “béèrè” tí yóò túmọ̀ sí i ju orísun lọ.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A ṣe àkọsílẹ̀ orúkọ oyè Júù náà sí bí a ṣe ń pè é ní Yorùbá, dípò yíyí i sí “Olùkọ́,” kí àyíká Júù àti oyè pàtó náà lè dúró.
- source_word: πότε
  choice: ìgbà wo
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti béèrè àkókò tí ohun kan ṣẹlẹ̀.
- source_word: ὧδε
  choice: ibí
  rationale: Adverb ibi náà túmọ̀ sí “níbí/sí ibí”; lẹ́yìn “dé,” “ibí” jẹ́ àdánidá.
- source_word: γέγονας
  choice: o dé
  rationale: Perfect γίνομαι ní àyíká yìí ń tọ́ka sí dídé tàbí bí ẹni ṣe wà ní ibi kan. “O dé ibí” sọ ìtumọ̀ ìbéèrè náà ní Yorùbá àdánidá láì fi ìtumọ̀ “di” tí kò bá àyíká mu kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ “Rábì” pa àyíká Júù mọ́, “wọ́n wí fún un” sì jẹ́ ọ̀nà ọ̀wọ̀ àti ti ìwé mímọ́ tí ó ṣì yé òǹkàwé òde òní.
