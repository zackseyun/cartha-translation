- from: Nígbà tí wọ́n sì ti yó[a], ó sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ kó àwọn àjẹkù tí ó ṣẹ́ kù jọ, kí ohunkóhun má bàa sọnù[b].”
