  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti yó[a], ó sọ[b] fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ kó àwọn àjẹkù tó kù jọ, kí ohunkóhun má bàa sọnù[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ti jẹun yó” tàbí “wọ́n ti kún.”
    reason: lexical_alternative
  - marker: b
    text: 'Nínú Gíríìkì, ọ̀rọ̀-ìṣe náà wà ní ìsinsìnyí ìtàn: “ó ń sọ.” Ní Yorùbá, “ó sọ” jẹ́ ọ̀nà àdánidá fún ìtàn.'
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí ohunkóhun má bàa lọ ṣòfò.” Ní èdè Gíríìkì, ọ̀rọ̀ náà túmọ̀ ní tààrà sí, “kí ohunkóhun má bàa sọnù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nígbà tí ... sì
  rationale: Ó fi ìtumọ̀ àkókò ὡς àti ìsopọ̀ pẹ̀lẹ́ δέ hàn ní Yorùbá àdánidá.
- source_word: ἐνεπλήσθησαν
  choice: wọ́n ti yó
  rationale: Nínú àyíká oúnjẹ, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n jẹun débi tí ebi fi kúrò; ‘ti yó’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ti kún tàbí wọ́n ti jẹun yó.
- source_word: λέγει
  choice: ó sọ
  rationale: Yorùbá kò fi ìrísí ọ̀rọ̀-ìṣe pàtó yà ìsinsìnyí ìtàn sọ́tọ̀ gẹ́gẹ́ bí Gíríìkì; ‘ó sọ’ bá ìtàn mu láìfi ìyípadà àsìkò tí kò pọn dandan kún un.
- source_word: μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún μαθηταί, ó sì tọ́ka sí àwọn tí ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tẹ̀ lé e.
- source_word: Συναγάγετε
  choice: Ẹ kó ... jọ
  rationale: Ó jẹ́ àṣẹ tààrà sí ọ̀pọ̀ ènìyàn, ó sì ṣàpèjúwe kíkó àwọn ẹ̀yà oúnjẹ náà papọ̀ lọ́nà àdánidá.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: àwọn àjẹkù tí ó ṣẹ́ kù
  rationale: ‘Àjẹkù’ sọ àwọn ẹ̀yà tí a já tàbí fọ́ kúrò lára oúnjẹ, ‘tí ó ṣẹ́ kù’ sì mú ìtumọ̀ περισσεύσαντα jáde láìdá àwọn ọ̀rọ̀ náà pọ̀ ju.
- source_word: ἵνα μή τι ἀπόληται
  choice: kí ohunkóhun má bàa sọnù
  rationale: Ó pa ète gbólóhùn Gíríìkì mọ́, ó sì tú ἀπόληται sí ‘sọnù’ dípò kí ó fi ìtumọ̀ ‘ṣòfò’ tàbí ‘parun’ tí ó túmọ̀ sí ju ohun tí ọ̀rọ̀ náà sọ ní tààrà lọ.
theological_decisions:
- issue: Ó ṣeé ṣe kí a ka ìtumọ̀ ẹ̀kọ́ ìgbàlà sínú ἀπόληται nítorí lílò rẹ̀ ní ibòmíràn nínú Jòhánù.
  choice: sọnù
  alternative: ṣòfò; parun
  rationale: Ohun tí ọ̀rọ̀ náà ń tọ́ka sí lẹ́sẹ̀kẹsẹ̀ ni àwọn àjẹkù oúnjẹ. ‘Sọnù’ pa ọ̀rọ̀ Gíríìkì mọ́ ní ìwọ̀n tó yẹ, ó sì jẹ́ kí ìró jinlẹ̀ èyíkéyìí nínú Jòhánù dúró láìfi ẹ̀kọ́ ìgbàlà sínú ẹsẹ yìí ní gbangba.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Àṣẹ ‘Ẹ kó ... jọ’ fi hàn pé ọ̀pọ̀ ọmọ-ẹ̀yìn ni Jésù ń bá sọ̀rọ̀; ‘ó sọ’ sì jẹ́ àdánidá ní ìtàn Yorùbá bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ìsinsìnyí ìtàn.
