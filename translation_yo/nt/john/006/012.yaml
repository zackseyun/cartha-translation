  rationale: Àtúnṣe náà ṣe “àwọn àjẹkù tó kù” ní ọ̀nà tí ó rọrùn, tó sì bá nọ́ńbà ọ̀rọ̀ mu, láìyí ìtumọ̀ “àwọn ẹ̀yà tí ó ṣẹ́kù” padà. A tún fi àmì ìsàlẹ̀ kún “ó sọ” láti ṣàfihàn λέγει gẹ́gẹ́ bí ìsinsìnyí ìtàn Gíríìkì, nígbà tí a pa ìlò Yorùbá àdánidá mọ́ nínú ọ̀rọ̀ àkọ́kọ́. “Sọnù” ni a dá sílẹ̀ fún ἀπόληται; kò fi ìtumọ̀ ẹ̀kọ́ ìgbàlà tàbí ìtumọ̀ “ṣòfò” tí ó tóbi ju kún ẹsẹ̀ náà.
