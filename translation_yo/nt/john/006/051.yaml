id: JHN.6.51
reference: John 6:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: yo
  text: Èmi ni àkàrà alààyè tí ó sọ̀kalẹ̀ láti ọ̀run. Bí ẹnikẹ́ni bá jẹ nínú àkàrà yìí, yóò wà láàyè títí láé.[a] Àti pé àkàrà tí èmi yóò fún ìyè ayé ni ẹran ara mi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘yóò wà láàyè sínú ayérayé’; gbólóhùn náà túmọ̀ sí pé yóò wà láàyè títí láé.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní ‘ẹran ara,’ kì í ṣe ‘ara’ lásán. Ọ̀rọ̀ náà mọ̀ọ́mọ̀ ṣe kedere, ó sì lágbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: àkàrà alààyè
  rationale: Ó túmọ̀ ζῶν gẹ́gẹ́ bí àpèjúwe ‘alààyè,’ láì fi ọ̀rọ̀ míì bí ‘àkàrà ìyè’ rọ́pò gbólóhùn Gíríìkì náà.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: tí ó sọ̀kalẹ̀ láti ọ̀run
  rationale: Ó fi ìsọ̀kalẹ̀ tí ó ti ṣẹlẹ̀ hàn ní èdè Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ nípa wíwá Jesu láti ọ̀run mọ́.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Bí ẹnikẹ́ni bá jẹ nínú àkàrà yìí
  rationale: ‘Bí ... bá’ fi ipò gbogbogbò hàn; ‘ẹnikẹ́ni’ jẹ́ deede fún τις, ‘jẹ nínú’ sì fi ἐκ hàn lọ́nà Yorùbá tí ó ṣeé lóye.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: yóò wà láàyè títí láé
  rationale: Èyí ni ìtumọ̀ àdánidá ti àṣà ọ̀rọ̀ Johannine náà, tí ó ń tọ́ka sí ìyè tí kò lópin.
- source_word: ἡ σάρξ μού ἐστιν
  choice: ni ẹran ara mi
  rationale: ‘Ẹran ara’ pa ìtumọ̀ gidi àti agbára ọ̀rọ̀ σάρξ mọ́; ‘ara mi’ nìkan lè dín ìfarahàn ọ̀rọ̀ náà kù tàbí túmọ̀ rẹ̀ jù.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: fún ìyè ayé
  rationale: ‘Fún’ fi ète tàbí àǹfààní ὑπέρ hàn, ‘ayé’ sì pa ìwọ̀n gbígbòòrò κόσμος mọ́ láì dín in kù sí ẹgbẹ́ kan.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú àpèjúwe Jesu nípa ara rẹ̀
  choice: ẹran ara mi
  alternative: ara mi
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì tí ó ṣe kedere, tí ó sì mọ̀ọ́mọ̀ lágbára mọ́, láì yan ìtumọ̀ sacramental kan tàbí dín ìṣòro ọ̀rọ̀ náà kù.
- issue: Ìwọ̀n ‘ayé’
  choice: ayé
  alternative: àwọn ènìyàn; àwọn àyànfẹ́
  rationale: A kò dín κόσμος kù sí ẹ̀dá ènìyàn nìkan tàbí sí ẹgbẹ́ ẹ̀kọ́ ìgbàgbọ́ kan; a pa gbólóhùn gbígbòòrò tí Jòhánù lò mọ́.
- issue: Agbára Kristọ́lọ́jì ti ‘sọ̀kalẹ̀ láti ọ̀run’
  choice: tí ó sọ̀kalẹ̀ láti ọ̀run
  alternative: tí Ọlọ́run rán
  rationale: A túmọ̀ ìsọ̀kalẹ̀ náà ní tààràtà, láì sọ ọ́ di àpẹẹrẹ ìránṣẹ́ Ọlọ́run nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. ‘Àkàrà’ ni ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀ fún ἄρτος; a lo ‘ẹran ara’ láti fi ìtumọ̀ σάρξ hàn ní kíkún. Àmì ohùn ni a fi sí ibi tí ó yẹ.
