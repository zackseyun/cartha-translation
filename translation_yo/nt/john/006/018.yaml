  text: ἥ τε θάλασσα ἀνέμου μεγάλου πνέοντος ⸀διεγείρετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: yo
  text: Òkun sì ń ru nítorí ẹ̀fúùfù líle tí ń fẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òkun ń dàrú,” tàbí “òkun ń ru sókè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: Òkun sì
  rationale: θάλασσα túmọ̀ sí ‘òkun,’ bí ó tilẹ̀ jẹ́ pé Òkun Gálílì ni àyíká ọ̀rọ̀ náà ń tọ́ka sí. τε jẹ́ àsopọ̀ fẹ́lẹ́fẹ́lẹ́, ‘sì’ sì fi ìbáṣepọ̀ náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀνέμου μεγάλου
  choice: ẹ̀fúùfù líle
  rationale: ἄνεμος ni ‘ẹ̀fúùfù,’ μέγας sì ń fi agbára rẹ̀ hàn. ‘Ẹ̀fúùfù líle’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sì sọ agbára náà di ohun tó ju ti Gíríìkì lọ.
- source_word: πνέοντος
  choice: tí ń fẹ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe tó wà ní àsìkò ìsinsìnyí yìí ń ṣàlàyé ipò tó mú kí òkun ru; ‘tí ń fẹ́’ pa ìṣe tó ń bá a lọ mọ́.
- source_word: διεγείρετο
  choice: ń ru
  rationale: Àìpé aláìṣe náà ń sọ nípa ipò tó ń ṣẹlẹ̀ sí òkun lọ́wọ́lọ́wọ́. Nínú Yorùbá, ‘òkun ń ru’ jẹ́ ọ̀nà àdánidá láti sọ pé agbára kan ń ru omi náà sókè tàbí ń mú un dàrú, láìfi àwòrán ìgbì kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Òkun ń ru’ jẹ́ gbólóhùn ojú-ọjọ́ tó wọ́pọ̀, ó sì pa ìlọsíwájú ìṣe inú àìpé Gíríìkì mọ́.
