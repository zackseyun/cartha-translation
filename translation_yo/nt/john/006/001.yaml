  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ gba ìtumọ̀ ẹsẹ̀ Gíríìkì náà lápapọ̀: Μετὰ ταῦτα jẹ́ “Lẹ́yìn nǹkan wọ̀nyí,” ἀπῆλθεν jẹ́ “lọ,” ó sì mọ̀ pé orúkọ méjì ni a fi ń pe ibi omi kan náà. Síbẹ̀, “sí òdìkejì Òkun Gálílì” kò ṣe kedere tó fún πέραν nínú àyíká ìkọjá omi; “sí ìhà kejì” jẹ́ ìtumọ̀ tó péye jù. Àlàyé a tún ní gbolohun “kúrò lọ ré kọjá,” tí kò pé ní Yorùbá.'
  naturalness: “Sí ìhà kejì Òkun Gálílì” jẹ́ Yorùbá àgbàlódé, kedere, ó sì bá ìrìn lọ sí òkè kejì ibi omi mu. “Tí a tún ń pè ní Òkun Tìbéríà” tún jẹ́ ọ̀nà àdánidá láti sọ àfikún orúkọ Gíríìkì náà. A tún ṣe àtúnṣe àwọn gbolohun ìsàlẹ̀ kí wọ́n lè rọrùn, kí wọ́n sì jẹ́ gírámà Yorùbá tó bójú mu.
  terminology: A pa “Òkun Gálílì” àti “Òkun Tìbéríà” mọ́ gẹ́gẹ́ bí àwọn orúkọ ibi tí a ti mọ̀. “Jésù” yẹ. Àwọn àmì ohùn wà ní àwọn ọ̀rọ̀ Yorùbá tí ó nílò wọn; a kò fi àmì ohùn tí kò wọ́pọ̀ kún àwọn orúkọ ibi.
