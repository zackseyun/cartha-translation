  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí[a], Jésù lọ sí ìhà kejì Òkun Gálílì[b], tí a tún ń pè ní Òkun Tìbéríà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó túbọ̀ tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì: “Lẹ́yìn nǹkan wọ̀nyí, Jésù kúrò lọ sí ìhà kejì Òkun Gálílì, ti Tìbéríà.”'
    reason: lexical_alternative
  - marker: b
    text: A tún ń pe “Òkun Gálílì” ní “Òkun Tìbéríà.” Jòhánù lo orúkọ méjèèjì láti fi hàn pé ibi omi kan náà ni.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀rọ̀ ìyípadà Jòhánù mọ́, pẹ̀lú àfihàn ọ̀pọ̀ nǹkan nínú ταῦτα, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀπῆλθεν
  choice: lọ
  rationale: Nínú àyíká yìí, ‘lọ’ sọ ìṣípò kúrò ní ibì kan sí ibòmíràn ní kedere; fífi ‘kúrò’ kún un kò pọn dandan ní Yorùbá.
- source_word: πέραν
  choice: sí òdìkejì
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrìn sí apá kejì omi kan.
- source_word: τῆς θαλάσσης
  choice: Òkun
  rationale: Bí ó tilẹ̀ jẹ́ pé adágún ni ibi omi náà nípa ilẹ̀-ayé, ‘Òkun’ tẹ̀lé θάλασσα, ó sì bá orúkọ tí a mọ̀ sí Òkun Gálílì mu.
- source_word: τῆς Γαλιλαίας
  choice: Gálílì
  rationale: Àpapọ̀ ‘Òkun Gálílì’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìbátan genitive yìí hàn.
- source_word: τῆς Τιβεριάδος
  choice: èyí tí í ṣe Òkun Tìbéríà
  rationale: Ó fi hàn ní kedere pé orúkọ kejì ni fún ibi omi kan náà, nígbà tó ń pa àfikún ìdánimọ̀ Gíríìkì mọ́.
