language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: yo
  text: Ní ọjọ́ kejì, àwọn ènìyàn tí wọ́n dúró ní ìhà kejì òkun rí i pé kò sí ọkọ̀ ojú omi kékeré mìíràn níbẹ̀ bí kò ṣe ọkọ̀ kan ṣoṣo[a], àti pé Jésù kò bá àwọn ọmọ-ẹ̀yìn rẹ̀ wọ ọkọ̀ ojú omi náà[b], ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ̀ nìkan ló lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ‘ọkọ̀ ojú omi kékeré’ sí ‘ọkọ̀ ojú omi’; ọ̀rọ̀ Gíríìkì πλοιάριον jẹ́ ọ̀rọ̀ tí ìrísí rẹ̀ ń tọ́ka sí ohun kékeré.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ àti àwọn àtẹ̀jáde kan yàtọ̀ láàárín ‘ọkọ̀ ojú omi kékeré’ (πλοιάριον) àti ‘ọkọ̀ ojú omi’ (πλοῖον) nínú ẹsẹ yìí; ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ inú àtẹ̀jáde Gíríìkì tí a lò ní apá kọ̀ọ̀kan.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìyípadà sí ọjọ́ tó tẹ̀ lé e hàn.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: àwọn ènìyàn tí wọ́n dúró
  rationale: A lo ọ̀pọ̀ nítorí pé ‘ọ̀pọ̀ ènìyàn’ ní èrò inú rẹ̀, ó sì mú kí ọ̀rọ̀-ìṣe ọ̀pọ̀ εἶδον bá a mu ní Yorùbá; ‘tí wọ́n dúró’ pa ipò tí participle perfect náà ń tọ́ka sí mọ́.
- source_word: πέραν τῆς θαλάσσης
  choice: ní òdìkejì òkun
  rationale: Ó sọ ibi tí wọ́n wà ní ìhà kejì òkun ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: εἶδον
  choice: rí i
  rationale: Ó pa ìtumọ̀ ìfòye tàbí ohun tí wọ́n ṣàkíyèsí mọ́, àwọn gbólóhùn ὅτι tó tẹ̀ lé e sì ṣàlàyé ohun tí wọ́n rí.
- source_word: πλοιάριον
  choice: ọkọ̀ ojú omi kékeré
  rationale: ‘Kékeré’ fi ìrísí diminutive πλοιάριον hàn.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: kò sí ọkọ̀ ojú omi kékeré mìíràn níbẹ̀ bí kò ṣe ẹyọ kan ṣoṣo
  rationale: Ó pa ìtẹnumọ́ pé ọkọ̀ kan ṣoṣo ló wà mọ́ láì mú ọ̀rọ̀ náà le.
- source_word: οὐ συνεισῆλθεν ... εἰς τὸ πλοῖον
  choice: kò wọ ọkọ̀ ojú omi náà pẹ̀lú
  rationale: Ó ṣàfihàn ìṣe wíwọ inú ọkọ̀ àti ìtumọ̀ ‘pẹ̀lú’ tó wà nínú ọ̀rọ̀-ìṣe àkópọ̀ náà.
- source_word: μόνοι ... ἀπῆλθον
  choice: nìkan ni wọ́n lọ
  rationale: ‘Nìkan’ tẹnu mọ́ pé àwọn ọmọ-ẹ̀yìn lọ láìsí Jésù, ‘lọ’ sì jẹ́ ìtumọ̀ àdánidá fún ἀπῆλθον ní àyíká yìí.
