translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A gbe àmì [a] lẹ́gbẹ̀ẹ́ πλοιάριον àti [b] sí òpin ẹsẹ nítorí ó kan ìyàtọ̀ ọ̀rọ̀ inú gbogbo ẹsẹ náà.
