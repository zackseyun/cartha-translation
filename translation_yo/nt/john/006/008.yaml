base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: yo
  text: Ọ̀kan nínú àwọn ọmọ ẹ̀yìn rẹ̀, Anderu, arákùnrin Simoni Peteru, sọ fún un pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí tí a lò nínú ìtàn; lílo “sọ” ní Yorùbá jẹ́ ọ̀nà àdánidá láti sọ ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí ẹni tí a bá sọ̀rọ̀, ẹni náà sì ni Jésù nínú àyíká ẹsẹ náà.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Ọ̀kan nínú àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: Èyí fi ìtumọ̀ àjọṣe apá-kan-nínú-ọ̀pọ̀ hàn ní Yorùbá àdánidá.
- source_word: μαθητῶν
  choice: àwọn ọmọ ẹ̀yìn
  rationale: “Ọmọ ẹ̀yìn” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń tẹ̀ lé olùkọ́, tí ó sì ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀.
- source_word: Ἀνδρέας
  choice: Anderu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìrísí orúkọ Bíbélì tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: arákùnrin Simoni Peteru
  rationale: Gbólóhùn yìí dá Anderu mọ̀ gẹ́gẹ́ bí arákùnrin Simoni Peteru, ó sì pa ìbátan ìdílé náà mọ́ ní kedere.
- source_word: Σίμωνος Πέτρου
  choice: Simoni Peteru
  rationale: Àwọn orúkọ méjèèjì dúró pọ̀ gẹ́gẹ́ bí orúkọ ìdánimọ̀ ẹni kan, gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
