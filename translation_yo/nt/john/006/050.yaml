id: JHN.6.50
reference: John 6:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: yo
  text: Èyí ni búrẹ́dì tí ó ń sọ̀kalẹ̀ láti ọ̀run, kí ẹnikẹ́ni lè jẹ nínú rẹ̀, kí ó má sì kú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà “kí ó má sì kú” kò sọ irú ikú tí a ń tọ́ka sí ní pàtó; àwọn kan lóye rẹ̀ sí ikú ẹ̀mí, àwọn mìíràn sí ikú ìkẹyìn tàbí ìparun ọjọ́ iwájú.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Èyí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí oúnjẹ tí Jésù ń fi hàn; “Èyí” ṣe àfihàn ìsúnmọ́ àti ìtẹnumọ́ Gíríìkì lọ́nà àdánidá.
- source_word: ἄρτος
  choice: oúnjẹ
  rationale: Ní Yorùbá òde òní, “oúnjẹ” lè dúró fún ohun jíjẹ pàtàkì ní àyíká yìí láìfi dandan mú irú búrẹ́dì òde òní wọ ọ̀rọ̀ náà; ó tún jẹ́ kí agbára ìtumọ̀ àpẹẹrẹ inú Jòhánù 6 dúró.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: tí ó ń sọ̀kalẹ̀ láti ọ̀run
  rationale: “Ń sọ̀kalẹ̀” pa ìṣe tí ó ń lọ lọ́wọ́ inú participle present mọ́, “láti ọ̀run” sì pa orísun rẹ̀ mọ́.
- source_word: οὐρανός
  choice: ọ̀run
  rationale: Ní àyíká Jòhánù, ọ̀run ni ibùgbé ti Ọlọ́run, kì í ṣe ojú ọ̀run lásán.
- source_word: ἵνα
  choice: kí
  rationale: “Kí” ni ọ̀nà Yorùbá àdánidá láti fi sọ ète tàbí àbájáde tí ἵνα ń mú wọlé.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó pa ìtumọ̀ gbogbogbò àti ìṣípayá sí ẹni yòówù mọ́.
- source_word: ἐξ αὐτοῦ
  choice: nínú rẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀ jíjẹ, “jẹ nínú rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣeé lóye fún jíjẹ lára ohun náà, láìsọ pé kí a jẹ gbogbo rẹ̀.
- source_word: φάγῃ
  choice: lè jẹ
  rationale: Ó bá subjunctive inú gbólóhùn ète mu, ó sì pa ìtumọ̀ gbogbogbò mọ́.
- source_word: μὴ ἀποθάνῃ
  choice: kí ó má sì kú
  rationale: “Kú” ni ìtumọ̀ tààrà ἀποθνῄσκω; a kò fi “ṣègbé” rọ́pò rẹ̀, nítorí ìyẹn lè fi ìtumọ̀ ìdájọ́ ikẹhin kún ohun tí ẹsẹ náà kò sọ ní pàtó.
theological_decisions:
- issue: Irú ikú tí “kí ó má sì kú” túmọ̀ sí
  choice: A fi gbólóhùn náà sílẹ̀ ní fífẹ̀ gẹ́gẹ́ bí “kí ó má sì kú.”
  alternative: “kí ó má kú nípa ẹ̀mí” tàbí “kí ó má ṣègbé títí láé”
  rationale: Àyíká ọ̀rọ̀ Oúnjẹ Ìyè fi ikú àti ìyè tí Jésù ń fún wé ara wọn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò pinnu bóyá ikú ti ara, ikú ẹ̀mí, tàbí ìparun ọjọ́ iwájú ni. Ìtumọ̀ fífẹ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
