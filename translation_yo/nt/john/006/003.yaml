base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: yo
  text: Nígbà náà, Jésù gòkè lọ sórí òkè náà, ó sì ń jókòó níbẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: gòkè lọ
  rationale: Ọ̀rọ̀ náà ń sọ ìrìn àjò lọ sí ibi gíga; “gòkè lọ” jẹ́ ọ̀nà àdánidá ní Yorùbá, kò sì fún un ní ìtumọ̀ ẹ̀sìn tí “gòkè re ọ̀run” lè mú wá.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú ju pé ó ń fi ohun méjì tako ara wọn; “Nígbà náà ni” mú ìlọsíwájú ìtàn yẹn hàn ní Yorùbá.
- source_word: εἰς τὸ ὄρος
  choice: sórí òkè náà
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe ἀνῆλθεν, gbólóhùn yìí túmọ̀ sí lílọ sókè sórí òkè kan. Àmì ìdámọ̀ náà ni a fi hàn nípasẹ̀ “náà,” láì sọ pé òkè náà ní orúkọ pàtó.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni àkọtọ orúkọ náà tí ó wọ́pọ̀, tí ó sì ti fìdí múlẹ̀ nínú Yorùbá.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: “Níbẹ̀” ni ọ̀rọ̀ Yorùbá àdánidá fún ibi tí a ti mẹ́nu kàn.
- source_word: ἐκάθητο
  choice: jókòó
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí jíjókòó tàbí wíwà ní ipò jíjókòó. “Jókòó” bá ìtàn náà mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Pẹ̀lú” fi ìbáṣepọ̀ μετά pẹ̀lú ọ̀rọ̀-orúkọ oníṣe-ẹni hàn; “ọmọ-ẹ̀yìn” sì pa ìbáṣepọ̀ olùkọ́ àti àwọn tí ń tẹ̀ lé e mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì, tó rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì yàgò fún èdè àrà-ọ̀tọ̀ tàbí ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú orísun.
