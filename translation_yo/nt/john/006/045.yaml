  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní pàtàkì: ó dá ìtọ́kasí sí Àwọn Wòlíì, ìlérí pé Ọlọ́run yóò kọ́ gbogbo wọn, àti ìtẹ̀lé gbígbọ́, kíkẹ́kọ̀ọ́, àti bíbọ̀ sọ́dọ̀ Jésù sílẹ̀. Ṣùgbọ́n “sínú” kò yẹ fún ipò ìwé tí a ti kọ ohun kan sí; “nínú” ni ó tọ́. Bákan náà, “ń tọ̀ mí wá” lè túmọ̀ sí wíwá ẹni kan tàbí lílépa a, kì í sì fi ìtumọ̀ ἔρχεται πρὸς ἐμέ (‘ń bọ̀ sọ́dọ̀ mi’) hàn ní tààràtà.'
  naturalness: “Olúkúlùkù ẹni” kéré sí i ní ìbámu pẹ̀lú ọ̀nà Yorùbá ìgbàlódé ju “Ẹnikẹ́ni tí” lọ. “Ń bọ̀ sọ́dọ̀ mi” jẹ́ ọ̀nà àdánidá, tí ó sì péye, láti sọ bíbọ̀ sí ọ̀dọ̀ ẹni.
