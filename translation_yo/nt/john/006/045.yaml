id: JHN.6.45
reference: John 6:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: yo
  text: A ti kọ ọ́ sílẹ̀ nínú Àwọn Wòlíì pé, “Gbogbo wọn ni Ọlọ́run yóò kọ́.”[a] Ẹnikẹ́ni tí ó ti gbọ́ láti ọ̀dọ̀ Baba, tí ó sì ti kọ́ ẹ̀kọ́, ń bọ̀ sọ́dọ̀ mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo wọn yóò jẹ́ àwọn tí Ọlọ́run kọ́.”
    reason: Àpólà διδακτοὶ θεοῦ lè fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ń kọ́ wọn, tàbí ó lè ṣàpèjúwe wọn gẹ́gẹ́ bí àwọn tí Ọlọ́run kọ́.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: A ti kọ ọ́
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti sọ pé ohun kan wà ní àkọsílẹ̀ Ìwé Mímọ́, ó sì pa agbára ọ̀rọ̀ tí a kọ sílẹ̀ mọ́.
- source_word: ἐν τοῖς προφήταις
  choice: sínú àwọn Ìwé Àwọn Wòlíì
  rationale: Ó fi hàn pé a ń tọ́ka sí àkójọpọ̀ àwọn ìwé àsọtẹ́lẹ̀ nínú Ìwé Mímọ́, kì í ṣe àwọn wòlíì gẹ́gẹ́ bí ènìyàn nìkan.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: Gbogbo wọn ni Ọlọ́run yóò kọ́
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú àti Ọlọ́run gẹ́gẹ́ bí olùkọ́ mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere, tí ó dùn láti gbọ́.
- source_word: πᾶς ὁ
  choice: Olúkúlùkù ẹni tí
  rationale: Ó ṣàfihàn ìtumọ̀ ẹnì kọ̀ọ̀kan láì sọ ọ̀rọ̀ náà di ti ẹgbẹ́ kan ṣoṣo.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: tí ó ti gbọ́ láti ọ̀dọ̀ Baba
  rationale: “Láti ọ̀dọ̀” fi Baba hàn gẹ́gẹ́ bí orísun ohun tí a gbọ́, “ti” sì fi iṣẹ́ tí ó ṣáájú hàn.
- source_word: μαθὼν
  choice: tí ó sì ti kọ́ ẹ̀kọ́
  rationale: Ó pa ìyàtọ̀ mọ́ láàárín gbígbọ́ àti kíkẹ́kọ̀ọ́, ó sì bá ìṣe tí ó ti ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì mu.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: ń tọ̀ mí wá
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún wíwá sọ́dọ̀ ẹni, ó sì pa àkókò ìsinsìnyí àti ìtọ́sọ́nà sí Jésù mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín kíkọ́ni láti ọ̀dọ̀ Ọlọ́run àti wíwá sọ́dọ̀ Jésù
  choice: 'A pa ìtẹ̀lé ọ̀rọ̀ náà mọ́: ẹni tí ó ti gbọ́ láti ọ̀dọ̀ Baba, tí ó sì ti kọ́ ẹ̀kọ́, ń tọ̀ Jésù wá.'
  alternative: Kí a mú un lọ sí ìtumọ̀ aláṣẹ-pátápátá tàbí sí ìtumọ̀ tí ó tẹnumọ́ ìdáhùn ènìyàn ju bó ṣe wà nínú ọ̀rọ̀ lọ.
  rationale: Gíríìkì sọ ìbáṣepọ̀ náà, ṣùgbọ́n kò ṣàlàyé gbogbo ọ̀nà tí ìfẹ́ Ọlọ́run àti ìdáhùn ènìyàn gbà ń ṣiṣẹ́; nítorí náà a kò yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ nínú ìtumọ̀.
- issue: Ìbáṣepọ̀ Baba pẹ̀lú Jésù
  choice: A pa “Baba” àti “mí” mọ́ ní tààràtà, kí ó lè hàn pé ẹni tí ó gbọ́, tí ó sì kọ́ láti ọ̀dọ̀ Baba ń tọ̀ Jésù wá.
  alternative: Kí a fi àlàyé Kristẹni gígùn sí i tí ẹsẹ̀ náà fúnra rẹ̀ kò sọ ní kedere.
  rationale: Èyí pa agbára ọ̀rọ̀ nípa Jésù mọ́ láì kọjá ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “àwọn Ìwé Àwọn Wòlíì” láti ṣàlàyé àkójọpọ̀ Ìwé Mímọ́; a sì lo “ń tọ̀ mí wá” fún ọ̀rọ̀ ìsinsìnyí tí ó ní ìtọ́sọ́nà sí Jésù.
