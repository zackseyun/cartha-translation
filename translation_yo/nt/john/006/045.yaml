- from: A ti kọ ọ́ sínú àwọn Ìwé Àwọn Wòlíì pé, “Gbogbo wọn ni Ọlọ́run yóò kọ́.”[a] Olúkúlùkù ẹni tí ó ti gbọ́ láti ọ̀dọ̀ Baba, tí ó sì ti kọ́ ẹ̀kọ́, ń tọ̀ mí wá.
