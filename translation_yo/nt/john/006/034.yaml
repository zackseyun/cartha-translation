id: JHN.6.34
reference: John 6:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: yo
  text: Nítorí náà, wọ́n sọ fún un pé, “Olúwa[a], máa fún wa ní búrẹ́dì yìí nígbà gbogbo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.” Orúkọ oyè Gíríìkì náà lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tí a fi ń bá ẹnì kan sọ̀rọ̀, ó sì tún lè túmọ̀ sí “Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: wọ́n sọ
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá láti sọ ìṣe ọ̀rọ̀ nínú ìtàn; kò fi ìtumọ̀ míì kún un bí ẹni pé wọ́n pàṣẹ tàbí wọ́n ṣàlàyé.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ohun tí wọ́n sọ pọ̀ mọ́ ìjíròrò tó ṣáájú, ó sì lè fi àbájáde èrò wọn hàn.
- source_word: πρὸς αὐτόν
  choice: fún un
  rationale: Lẹ́yìn ọ̀rọ̀ ìṣe ‘sọ,’ èyí ni ọ̀nà Yorùbá àdánidá láti tọ́ka sí ẹni tí wọ́n bá sọ̀rọ̀.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ orúkọ oyè náà mọ́, títí kan bí ó ṣe lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ tàbí kí ó ní ìtumọ̀ jíjinlẹ̀ sí i nínú àyíká Jòhánù.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó túmọ̀ sí ‘ní gbogbo ìgbà’ tàbí ‘nígbà gbogbo,’ ó sì bá ìbéèrè fún ìpèsè tí yóò máa bá a lọ mu.
- source_word: δὸς
  choice: máa fún
  rationale: Fífi ‘máa’ kún ‘fún’ jẹ́ kí ìbéèrè náà ní agbára ìṣe tí yóò máa tẹ̀ síwájú, gẹ́gẹ́ bí πάντοτε ṣe ń tọ́ka sí i.
- source_word: ἡμῖν
  choice: wa
  rationale: Èyí ni arọ́pò-orúkọ ẹni púpọ̀ tó jẹ́ olùgbà ohun tí a ń fún.
- source_word: τὸν ἄρτον τοῦτον
  choice: búrẹ́dì yìí
  rationale: ‘Búrẹ́dì’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ἄρτος, ‘yìí’ sì pa agbára ọ̀rọ̀ atọ́ka τοῦτον mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí wọ́n ń bá Jésù sọ̀rọ̀ tààrà
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: '‘Olúwa’ pa àyè ìtumọ̀ Gíríìkì náà mọ́: ó lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ lásán ní ẹnu àwọn ènìyàn náà, ó sì tún lè mú ìtumọ̀ jíjinlẹ̀ nípa ẹni tí Jésù jẹ́. Àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ ìbọ̀wọ̀ hàn láì pinnu ohun tí ọ̀rọ̀ náà kò pinnu.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àdánidá, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘búrẹ́dì’ dípò ‘àkàrà’ nítorí ‘àkàrà’ sábà máa ń tọ́ka sí oúnjẹ ẹ̀wà ní Yorùbá òde òní, èyí tí ó lè ṣi òǹkàwé lọ́nà.
