language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù ń bá ara wọn jiyàn[a], wọ́n ní, “Báwo ni ọkùnrin yìí ṣe lè fún wa ní ẹran ara rẹ̀[b] láti jẹ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà,” tàbí, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀, “àwọn aṣáájú Júù.” Ọ̀rọ̀ Gíríìkì kàn sọ pé “àwọn Júù.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “ara rẹ̀.” Ọ̀rọ̀ Gíríìkì náà ni “ẹran ara” (σάρξ); a pa á mọ́ níbí láti pa ọ̀rọ̀ náà ní ìrísí kíkankíkan rẹ̀ mọ́, kí ìdààmú inú ẹsẹ náà sì dúró.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: ń bá ara wọn jiyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí àríyànjiyàn tí ó ń lọ lọ́wọ́; yíyan ‘jiyàn’ fi ìjà ọ̀rọ̀ hàn láì sọ ọ́ di ìjà ara.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìhùwàpadà wọn pọ̀ mọ́ ọ̀rọ̀ tí ó ṣáájú, ó sì pa agbára ìtẹ̀síwájú tàbí àbájáde mọ́.
- source_word: πρὸς ἀλλήλους
  choice: bá ara wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi àríyànjiyàn láàárín àwọn ọmọ ẹgbẹ́ náà hàn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì ní tààrà; a kò dín ìtumọ̀ rẹ̀ kù sí àwọn aṣáájú Júù nínú ẹsẹ yìí.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ọ̀nà Yorùbá àdánidá ni láti ṣàgbékalẹ̀ ohun tí wọ́n sọ.
- source_word: Πῶς δύναται
  choice: Báwo ni ... ṣe lè
  rationale: Ó fi ìbéèrè nípa bí ohun náà ṣe lè ṣeé ṣe hàn ní Yorùbá àdánidá.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó pa ìjìnnà tàbí ìrẹ̀lẹ̀ tí arọ́pò-orúkọ atọ́ka náà lè ní mọ́ ju ‘òun’ lọ.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Ó jẹ́ ẹni tí a ó fún ní ohun náà, gẹ́gẹ́ bí ìṣètò ọ̀rọ̀ Yorùbá ṣe béèrè.
- source_word: δοῦναι
  choice: fi ... fún
  rationale: Ó mú ìtumọ̀ ìṣe ‘fún’ jáde ní kedere àti ní àdánidá.
- source_word: τὴν σάρκα αὐτοῦ
  choice: ẹran ara rẹ̀
  rationale: ‘Ẹran ara’ pa àwòrán kíkankíkan ti σάρξ mọ́, kò sì túmọ̀ rẹ̀ sí ‘ara’ nìkan.
- source_word: φαγεῖν
  choice: láti jẹ
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ àìlópìn tó ń ṣàlàyé ohun tí wọn yóò ṣe pẹ̀lú ẹran ara náà.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ tí ó ní ìjiyàn ẹ̀kọ́ ìgbàgbọ́
  choice: ẹran ara
  alternative: ara
  rationale: ‘Ẹran ara’ pa ọ̀rọ̀ Gíríìkì tí ó ṣe kedere, tó sì ní agbára mọ́, ó sì jẹ́ kí ìṣòro àti ìfọ̀rọ̀wérọ̀ inú àyíká náà dúró láì fi ìtumọ̀ sacramenti kan kún un.
- issue: Bí a ṣe máa túmọ̀ οἱ Ἰουδαῖοι nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà tàbí àwọn aṣáájú Júù
  rationale: Ẹsẹ náà fúnra rẹ̀ kò dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù. Nítorí náà, àkọ́kọ́ ọ̀rọ̀ Gíríìkì ni a pa mọ́, a sì fi àwọn àṣàyàn àyíká sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ìgbàlódé, ọlọ́lá, ó sì rọrùn fún òǹkàwé lasán; ‘ń bá ara wọn jiyàn’ mú ìṣe tí ó ń lọ lọ́wọ́ jáde.
