source:
  edition: SBLGNT
  text: Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/016.yaml
  text: When evening came[a], his disciples went down to the sea,
translation:
  language: yo
  text: Nígbà tí ó di ìrọ̀lẹ́, àwọn ọmọ-ẹ̀yìn rẹ̀ sọ̀kalẹ̀ lọ sí òkun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí adágún.” Omi náà ni Òkun Gálílì, èyí tí ó jẹ́ adágún ní ti ilẹ̀-àyè, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà ni “òkun” (θάλασσα).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nígbà tí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń ṣí ìyípadà àkókò sílẹ̀. “Nígbà tí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tí kò sì fi ọ̀rọ̀ àfikún fún δέ tí àyíká gbólóhùn ti lè gbé.
- source_word: ὀψία ἐγένετο
  choice: ó di ìrọ̀lẹ́
  rationale: Èyí jẹ́ ọ̀rọ̀ àpèjúwe fún bí ìrọ̀lẹ́ ṣe dé; “ó di ìrọ̀lẹ́” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìbẹ̀rẹ̀ ìrọ̀lẹ́ mọ́.
- source_word: κατέβησαν
  choice: sọ̀kalẹ̀ lọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìrìn ní ọ̀nà ìsàlẹ̀. “Sọ̀kalẹ̀ lọ” pa ìtọ́sọ́nà ìrìn náà mọ́, ó sì bá ojú ìwòye ìtàn mu.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti fi àpilẹ̀kọ, orúkọ àti arọ́pò-orúkọ oníhun Gíríìkì hàn.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: sí òkun
  rationale: ἐπί pẹ̀lú accusative lẹ́yìn ọ̀rọ̀ ìrìn tọ́ka sí ibi tí wọ́n ń lọ sí; θάλασσα túmọ̀ sí “òkun.” A kò fi “etí òkun” kún un nítorí pé ọ̀rọ̀ “etí” kò sí ní Gíríìkì.
