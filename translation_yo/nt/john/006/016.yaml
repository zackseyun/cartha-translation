translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àlàyé Gíríìkì mọ́ láìfi “etí òkun” tí kò sí nínú orísun kún un.
