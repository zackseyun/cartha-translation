  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: yo
  text: Ǹjẹ́ bí ẹ bá rí Ọmọ Ènìyàn tí ó ń gòkè lọ sí ibi tí ó ti wà tẹ́lẹ̀ ńkọ́?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ǹjẹ́ bí ẹ bá rí Ọmọ Ènìyàn tí ó ń gòkè lọ sí ibi tí ó ti wà tẹ́lẹ̀ ńkọ́?” Gíríìkì náà jẹ́ ìbéèrè oníhà-ìsọ̀rọ̀ ní ìrísí gbólóhùn ‘bí’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Ǹjẹ́ bí ... ńkọ́?
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń tẹ̀ lé ohun tí a sọ ṣáájú, ó sì gbé ìbéèrè oníhà ọ̀rọ̀ tí ó ní ipò àdéhùn kalẹ̀. ‘Ǹjẹ́ bí ... ńkọ́?’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìbéèrè náà àti ìtumọ̀ ‘bí ó bá ṣẹlẹ̀ pé’ mọ́.
- source_word: θεωρῆτε
  choice: ẹ bá rí
  rationale: Nínú gbólóhùn àdéhùn yìí, ‘ẹ bá rí’ sọ ìríran tí ó lè ṣẹlẹ̀ níwájú lọ́nà Yorùbá tí ó ṣe kedere. Kò pọ̀ sí ìtumọ̀ náà pẹ̀lú àlàyé tí kò sí nínú Gíríìkì.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí pa orúkọ oyè tí Jésù máa ń fi pe ara rẹ̀ nínú àwọn Ìhìn Rere mọ́, pẹ̀lú ìró àsọtẹ́lẹ̀ àti ti Mèsáyà tí ó ní.
- source_word: ἀναβαίνοντα
  choice: tí ó ń gòkè lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílọ sókè. ‘Ń gòkè lọ’ jẹ́ Yorùbá àdánidá, ó sì lè gba ìtumọ̀ gígun lọ sí ibi gíga tàbí sí ọ̀run láìfi ‘ọ̀run’ kún ọ̀rọ̀ orísun.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: sí ibi tí ó wà tẹ́lẹ̀
  rationale: Yíyan yìí pa ìtọ́kasí sí ibi àti àkókò ìṣáájú mọ́. A kò fi ‘ọ̀run’ tàbí ‘Baba’ kún un, nítorí pé àwọn ọ̀rọ̀ wọ̀nyẹn kò farahàn ní tààrà nínú ẹsẹ náà.
theological_decisions:
- issue: Bóyá kí a ṣàlàyé gígun Ọmọ Ènìyàn sókè ní tààrà gẹ́gẹ́ bí ipadà sí ọ̀run tàbí sí ọ̀dọ̀ Baba
  choice: sí ibi tí ó wà tẹ́lẹ̀
  alternative: padà sí ọ̀run, níbi tí ó wà tẹ́lẹ̀; padà sí ọ̀dọ̀ Baba, níbi tí ó wà tẹ́lẹ̀
  rationale: Gíríìkì ń tọ́ka gidigidi sí wíwà rẹ̀ tẹ́lẹ̀ àti gígun rẹ̀ sókè, ṣùgbọ́n kò dárúkọ ọ̀run tàbí Baba ní ẹsẹ yìí. Ìtumọ̀ náà jẹ́ kí agbára ọ̀rọ̀ nípa ẹni tí Kristi jẹ́ dúró láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Ẹ’ ni a lò fún ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀.
