  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn sì ń tọ̀ ọ́ lẹ́yìn, nítorí wọ́n ń rí àwọn àmì[a] tí ó ń ṣe lára àwọn aláìsàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn iṣẹ́ ìyanu” tàbí “àwọn àmì ìyanu”; ọ̀rọ̀ tí Johanu lò, “àwọn àmì,” tẹnu mọ́ ohun tí àwọn iṣẹ́ wọ̀nyí ń fi hàn nípa Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: ń tọ̀ ọ́ lẹ́yìn
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn síwájú, kì í ṣe àmì ìtakora líle.
- source_word: ὄχλος πολύς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó sọ iye àwùjọ ńlá kan ní èdè Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: ἐθεώρουν
  choice: ń rí
  rationale: Fọ́ọ̀mù aláìpé náà tọ́ka sí rírí tí ó ń bá a lọ tàbí tí ó ń ṣẹlẹ̀ léraléra; ‘ń rí’ pa apá yìí mọ́ láì mú gbolohun le.
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: '‘Àwọn àmì’ pa ìtumọ̀ pàtàkì ọ̀rọ̀ Johanu mọ́: àwọn iṣẹ́ náà ń tọ́ka sí ẹni tí Jésù jẹ́, kì í ṣe pé wọ́n jẹ́ iṣẹ́ ìyanu nìkan.'
- source_word: ἐποίει
  choice: tí ó ń ṣe
  rationale: ‘Ń ṣe’ fi ìṣe tí ó ń lọ lọ́wọ́ hàn gẹ́gẹ́ bí fọ́ọ̀mù aláìpé Gíríìkì.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: lára àwọn aláìsàn
  rationale: ‘Lára’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn aláìsàn ni iṣẹ́ àmì náà ṣẹlẹ̀ sí, ó sì ń fi ìbáṣepọ̀ ἐπί pẹ̀lú wọn hàn.
- source_word: ἀσθενούντων
  choice: àwọn aláìsàn
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí àwọn tí àìsàn ara ń ṣe, kì í ṣe àìlera ní gbogbogbòò.
theological_decisions:
- issue: Ìlò σημεῖα nínú Johanu
  choice: àwọn àmì
  alternative: àwọn iṣẹ́ ìyanu; àwọn àmì ìyanu
  rationale: ‘Àwọn àmì’ pa ipa ìṣípayá àwọn iṣẹ́ Jésù mọ́, láì dín wọn kù sí ohun àrà nìkan tàbí fi àlàyé kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó níyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ; àwọn àpẹẹrẹ ‘ń’ náà pa ìṣe tí ń lọ lọ́wọ́ nínú àwọn ọ̀rọ̀-ìṣe aláìpé Gíríìkì mọ́.
