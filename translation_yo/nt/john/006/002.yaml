  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “ń tọ̀ ọ́ lẹ́yìn” pa abala ìṣe tí ń lọ lọ́wọ́ ti ἠκολούθει mọ́; “sì” yẹ fún δέ; “ọ̀pọ̀ ènìyàn” sọ ὄχλος πολύς ní ti ara; “ń rí” mú ἐθεώρουν wá ní ọ̀nà tí ó ṣe kedere; “àwọn àmì” sì pa ọ̀rọ̀ Johannine σημεῖα mọ́. “Lára àwọn aláìsàn” jẹ́ ọ̀nà Yorùbá tí ó lè tọ́ka sí àwọn aláìsàn gẹ́gẹ́ bí ẹni tí iṣẹ́ àmì náà ṣẹlẹ̀ sí, láì yí i padà sí ìtumọ̀ àǹfààní nìkan.'
