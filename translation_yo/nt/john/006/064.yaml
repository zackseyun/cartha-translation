id: JHN.6.64
reference: John 6:64
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan wà láàárín yín tí kò gbàgbọ́. Nítorí Jésù ti mọ láti ìbẹ̀rẹ̀ àwọn tí kò gbàgbọ́, àti ẹni tí yóò dà á.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ẹni tí yóò fi í lé lọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐξ ὑμῶν
  choice: láàárín yín
  rationale: Ó túmọ̀ sí pé àwọn ẹni náà jẹ́ ara ẹgbẹ́ àwọn tí Jésù ń bá sọ̀rọ̀, kì í ṣe pé wọ́n jáde lára wọn ní ti gidi.
- source_word: οἳ οὐ πιστεύουσιν / οἱ μὴ πιστεύοντες
  choice: tí kò gbàgbọ́ / àwọn tí kò gbàgbọ́
  rationale: ‘Gbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún πιστεύω, ó sì lè gba ìtumọ̀ gbígbẹ́kẹ̀lé àti gbígba ọ̀rọ̀ ẹni gbọ́ láì dín ìtumọ̀ Gíríìkì kù.
- source_word: ᾔδει
  choice: ti mọ
  rationale: Ìṣe náà jẹ́ ipò ìmọ̀ tó ti wà ṣáájú ní àkókò ìtàn; ‘ti mọ’ sọ èyí ní Yorùbá àdánidá.
- source_word: ἐξ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Ó pa ìtumọ̀ àkókò mọ́ láì pinnu ní pàtó ohun tí ‘ìbẹ̀rẹ̀’ náà ń tọ́ka sí.
- source_word: παραδώσων αὐτόν
  choice: tí yóò fi òun lé wọn lọ́wọ́
  rationale: Ó pa àwòrán ìpilẹ̀ṣẹ̀ παραδίδωμι, ‘fi ẹni lé ẹlòmíràn lọ́wọ́,’ mọ́; ‘òun’ tọ́ka sí Jésù, ‘wọn’ sì jẹ́ aláìsọ pàtó gẹ́gẹ́ bí Gíríìkì ṣe fi àwọn olùgbà sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω nínú ìdáhùn àwọn ọmọ-ẹ̀yìn sí Jésù
  choice: gbàgbọ́
  alternative: gbẹ́kẹ̀ lé
  rationale: ‘Gbàgbọ́’ jẹ́ èdè Bíbélì Yorùbá tó wọ́pọ̀, ó sì pa ààyè ìtumọ̀ ọgbọ́n-inú àti ìbáṣepọ̀ mọ́; ‘gbẹ́kẹ̀ lé’ nìkan lè dín ìtumọ̀ náà kù.
- issue: Ìtumọ̀ παραδίδωμι nípa ẹni tí yóò ṣe Jésù
  choice: fi òun lé wọn lọ́wọ́
  alternative: dalẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí fífi ẹni lé ẹlòmíràn lọ́wọ́, bí ó tilẹ̀ jẹ́ pé nínú ìtàn yìí ìṣe náà jẹ́ ìdàlẹ̀. Yíyan ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ṣẹ̀ pa àwòrán àti agbára ìtàn mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí; àlàyé ìdàlẹ̀ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní ibi tó yẹ. ‘Àwọn kan wà láàárín yín’ jẹ́ ọ̀nà tí òǹkàwé òde òní lè lóye; ‘láti ìbẹ̀rẹ̀ ni ... ti mọ’ sì pa ìtẹnumọ́ àti ìbáṣepọ̀ àkókò Gíríìkì mọ́.
