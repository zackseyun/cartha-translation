revisions:
- from: Ṣùgbọ́n àwọn kan wà láàárín yín tí kò gbàgbọ́. Nítorí láti ìbẹ̀rẹ̀ ni Jésù ti mọ àwọn tí kò gbàgbọ́, àti ẹni tí yóò fi òun lé wọn lọ́wọ́.[a]
  to: Ṣùgbọ́n àwọn kan wà láàárín yín tí kò gbàgbọ́. Nítorí Jésù ti mọ láti ìbẹ̀rẹ̀ àwọn tí kò gbàgbọ́, àti ẹni tí yóò dà á.[a]
  rationale: A tún gbolohun kejì ṣe kí ó lè ṣàn dáadáa ní Yorùbá, kí ó sì pa ìtumọ̀ pé Jésù mọ àwọn ẹni aláìgbàgbọ́ náà mọ́. A yọ àfikún ‘àwọn ọ̀tá rẹ̀’ kúrò nínú àlàyé ìsàlẹ̀ nítorí pé kò sí nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀. ‘Dà á’ ń tẹ̀lé ìtumọ̀ àyíká ‘betray,’ nígbà tí àlàyé ìsàlẹ̀ ń fúnni ní àṣàyàn tó sún mọ́ ọrọ̀-ìpilẹ̀ṣẹ̀, ‘hand over.’
  reviewer_model: gpt-5.6-terra
