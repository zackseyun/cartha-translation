id: JHN.6.60
reference: John 6:60
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: yo
  text: Nítorí náà, nígbà tí ọ̀pọ̀ lára àwọn ọmọ-ẹ̀yìn rẹ̀ gbọ́ ọ̀rọ̀ náà, wọ́n sọ pé, “Ọ̀rọ̀ yìí le[a]; ta ni ó lè fetí sí i?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àsọyé yìí le” tàbí “Ẹ̀kọ́ yìí le.” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí ọ̀rọ̀, àsọyé, ìhìn, tàbí ẹ̀kọ́ níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ta ni ó lè gbọ́ ọ?” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbọ́, fetí sí, tàbí tẹ́wọ́ gbà, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: ọ̀pọ̀
  rationale: Ó ń tọ́ka sí iye púpọ̀ nínú ẹgbẹ́ àwọn ọmọ-ẹ̀yìn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘many’ ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ pẹ̀lú ọ̀rọ̀ tí ó ṣáájú mọ́, ó sì lè fi ìyọrísí tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́
  rationale: Aorist participle náà ní agbára àkókò ní àyíká yìí; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ọ̀pọ̀ lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Lára’ fi hàn pé àwọn tí wọ́n sọ̀rọ̀ jẹ́ apá kan nínú ẹgbẹ́ àwọn ọmọ-ẹ̀yìn rẹ̀, kì í ṣe gbogbo wọn dandan.
- source_word: Σκληρός
  choice: le
  rationale: ‘Le’ lè túmọ̀ sí ohun tí ó nira, tí ó le koko, tàbí tí kò rọrùn láti gbà; ó tipa bẹ́ẹ̀ pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὁ λόγος οὗτος
  choice: Ọ̀rọ̀ yìí
  rationale: Ó sún mọ́ ìtumọ̀ λόγος, ó sì lè tọ́ka sí àsọyé, ìhìn, tàbí ẹ̀kọ́ tí wọ́n ṣẹ̀ṣẹ̀ gbọ́.
- source_word: τίς δύναται
  choice: ta ni ó lè
  rationale: Ọ̀nà Yorùbá tó ṣe kedere àti àdánidá ni fún ìbéèrè nípa agbára tàbí ìfaradà.
- source_word: αὐτοῦ ἀκούειν
  choice: fetí sí i
  rationale: Ó ju gbígbọ́ ohùn lásán lọ, ṣùgbọ́n kò fi dandan túmọ̀ rẹ̀ sí ‘gbà á’; ó pa ìbáṣepọ̀ pẹ̀lú gbígbọ́ àti ṣíṣe àfiyèsí mọ́.
theological_decisions:
- issue: Irú ìṣòro tí àwọn ọmọ-ẹ̀yìn rí nínú ọ̀rọ̀ Jesu
  choice: A tú Σκληρός sí ‘le,’ kí ó lè fi hàn pé ọ̀rọ̀ náà nira tàbí le koko láti gbà tàbí láti fara dà, láì sọ pàtó bóyá ìṣòro náà jẹ́ ti òye, ti ìwà, tàbí pé ó mú wọn kọsẹ̀.
  alternative: A lè sọ pé ‘ó nira láti lóye’ tàbí ‘ó le koko láti gbà,’ ṣùgbọ́n àwọn wọ̀nyí máa dín ìtumọ̀ náà kù sí ọ̀nà kan ṣoṣo.
  rationale: Σκληρός ní ìwọ̀n ìtumọ̀ tó lè ní líle, ìnira, ìkanra, tàbí ohun tí ó ṣòro láti tẹ́wọ́ gbà. ‘Le’ pa ìforígbárí àti àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Fetí sí i’ jẹ́ ọ̀nà àdánidá tí ó pa ìtumọ̀ gbígbọ́ àti fífi ọkàn sí ọ̀rọ̀ náà mọ́ láì fi ‘tẹ́wọ́ gbà’ múlẹ̀ gẹ́gẹ́ bí ìtumọ̀ kan ṣoṣo.
