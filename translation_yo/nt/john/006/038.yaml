id: JHN.6.38
reference: John 6:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: yo
  text: Nítorí mo ti sọ̀kalẹ̀ wá láti ọ̀run, kì í ṣe láti ṣe ìfẹ́-inú tèmi, bí kò ṣe ìfẹ́-inú ẹni tí ó rán mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń ṣàlàyé ìdí fún ohun tí a ṣẹ̀ṣẹ̀ sọ; “Nítorí” pa agbára ìdí-múlẹ̀ rẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: καταβέβηκα
  choice: mo ti sọ̀kalẹ̀ wá
  rationale: “Mo ti” fi hàn pé ìṣe náà ti ṣẹlẹ̀, síbẹ̀ ó ṣì ní ìbáṣepọ̀ pẹ̀lú ipò ìsinsìnyí; “sọ̀kalẹ̀ wá” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣípò láti òkè dé ibi tí olùsọ̀rọ̀ wà.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Èyí pa àwòrán ibi ìpilẹ̀ṣẹ̀ àti ìṣípò láti ọ̀run mọ́ láìfi àlàyé míì kún un.
- source_word: οὐχ ἵνα ποιῶ
  choice: kì í ṣe láti ṣe
  rationale: Ìtumọ̀ yìí sọ ète tí a sẹ́ ní kedere, ó sì bá ọ̀nà tí Yorùbá fi ń sọ “not in order to do” mu.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: ìfẹ́-inú tèmi fúnra mi
  rationale: “Ìfẹ́-inú” túmọ̀ sí ìpinnu tàbí ohun tí ẹni kan fẹ́ kí ó ṣẹlẹ̀, kì í ṣe ìfẹ́ gẹ́gẹ́ bí ìfẹ́ni nìkan; “tèmi fúnra mi” sì mú ìtẹnumọ́ àti ìyàtọ̀ inú Gíríìkì jáde.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Nínú ìṣètò “kì í ṣe … bí kò ṣe …,” gbolohun yìí fi ìtakora tó lágbára hàn lọ́nà Yorùbá àdánidá.
- source_word: τοῦ πέμψαντός με
  choice: ẹni tí ó rán mi
  rationale: Èyí tú participle olórúkọ náà ní ṣókí, ó sì pa ìbáṣepọ̀ ẹni tó ránṣẹ́ àti ẹni tí a rán mọ́ láìsọ ẹni náà ní pàtó ju bí Gíríìkì ṣe sọ ọ́ lọ.
theological_decisions:
- issue: Ìtumọ̀ sísọ̀kalẹ̀ Jésù láti ọ̀run
  choice: A túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí “mo ti sọ̀kalẹ̀ wá láti ọ̀run.”
  alternative: Kí a sọ ọ́ di àkàwé lásán fún pé Ọlọ́run rán an.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ibi tí ó ti wá ní èdè ìṣípò láti ọ̀run; a kò dín ọ̀rọ̀ náà kù sí iṣẹ́ ìránṣẹ́ lásán, bẹ́ẹ̀ ni a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
- issue: Ìyàtọ̀ láàárín ìfẹ́-inú Jésù àti ti ẹni tí ó rán an
  choice: A pa “ìfẹ́-inú” mọ́ ní ìhà méjèèjì, pẹ̀lú ìtakora tí ẹsẹ náà gbé kalẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ ní “ohun tí mo fẹ́” àti “ohun tí ó fẹ́,” tàbí kí a ṣàlàyé ìyàtọ̀ náà kúrò.
  rationale: Ìṣe àtúnṣe yìí pa ìṣọ̀kan ọ̀rọ̀ θέλημα àti ìyàtọ̀ tó wà nínú iṣẹ́ ìránṣẹ́ mọ́, láìyanjú ìdọ̀tí ẹ̀kọ́ ìgbàgbọ́ náà fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ìfẹ́-inú” láti yẹra fún kí “ìfẹ́” dá dúró bí ìfẹ́ni nìkan, a sì pa àtúnṣe gbolohun “kì í ṣe … bí kò ṣe …” mọ́ fún ìtakora tó ṣe kedere.
