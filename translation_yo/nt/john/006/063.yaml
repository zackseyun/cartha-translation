source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: yo
  text: Ẹ̀mí ni ó ń sọ ènìyàn di alààyè[a]; ara kò ní ìwúlò kankan[b]. Àwọn ọ̀rọ̀ tí mo ti sọ fún yín jẹ́ ẹ̀mí, wọ́n sì jẹ́ ìyè[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí ni ó ń sọ ènìyàn di alààyè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “Ẹ̀mí” tàbí “ẹ̀mí”; àyíká ọ̀rọ̀ yìí ṣètìlẹ́yìn fún Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: b
    text: “Ara” lè tọ́ka ní gbòòrò sí ohun tí ó jẹ́ ti ènìyàn lásán; títúmọ̀ rẹ̀ sí “ẹ̀dá ẹlẹ́ṣẹ̀” níbí yóò fi ìtumọ̀ kún un ju ohun tí Gíríìkì béèrè lọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “jẹ́ Ẹ̀mí àti ìyè,” tàbí “jẹ́ ti ẹ̀mí, wọ́n sì ń fúnni ní ìyè.” Ọ̀nà tí Gíríìkì gbà sọ ọ́ kúkúrú, ó sì ń ṣàpèjúwe àbùdá.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí; nínú àyíká ọ̀rọ̀ Johanu, Ẹ̀mí Mímọ́ ni ó ṣeé ṣe jù, nítorí náà a lo lẹ́tà ńlá láì fi “Mímọ́” kún ohun tí Gíríìkì sọ.
- source_word: ζῳοποιοῦν
  choice: ẹni tí ń sọni di alààyè
  rationale: Ó ń sọ nípa fífúnni ní ìyè tàbí sísọni di alààyè; ìtumọ̀ yìí pa agbára ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì bá Ẹ̀mí gẹ́gẹ́ bí olùṣe mu.
- source_word: ἡ σὰρξ
  choice: ara
  rationale: “Ara” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún σάρξ ní ìyàtọ̀ rẹ̀ sí Ẹ̀mí, ó sì yẹra fún fífi ìtumọ̀ tóóró bí “ẹ̀dá ẹlẹ́ṣẹ̀” wọ inú ẹsẹ̀ náà.
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: kò ṣàǹfààní ohunkóhun
  rationale: Ó pa ìkọ̀ pátápátá inú Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé kò ní èrè tàbí ìrànlọ́wọ́ kankan.
- source_word: τὰ ῥήματα
  choice: àwọn ọ̀rọ̀
  rationale: Ó tọ́ka sí àwọn ohun tí a ti sọ; “àwọn ọ̀rọ̀” jẹ́ ìtumọ̀ tààrà, tó sì mọ́gbọ́n dání ní Yorùbá.
- source_word: λελάληκα
  choice: mo ti sọ
  rationale: Àmì “ti” ń fi hàn pé ọ̀rọ̀ náà ti wáyé ṣùgbọ́n ó ṣì ní ìbáṣepọ̀ pẹ̀lú àsìkò yìí, ní ìbámu pẹ̀lú àkókò perfect Gíríìkì.
- source_word: πνεῦμά ἐστιν
  choice: jẹ́ ẹ̀mí
  rationale: A pa gbólóhùn Gíríìkì tó kúkúrú, tó sì ní agbára ìwà tàbí àbùdá mọ́; a kò sọ ọ́ di “Ẹ̀mí” tàbí “ti ẹ̀mí” nítorí gírámà kò fipá mú ìdánimọ̀ tààrà pẹ̀lú Ẹ̀mí Mímọ́.
- source_word: ζωή
  choice: ìyè
  rationale: “Ìyè” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún ζωή, ó sì pa ìjìnlẹ̀ ìtumọ̀ rẹ̀ nínú Johanu mọ́.
theological_decisions:
- issue: Ẹni tàbí ohun tí τὸ πνεῦμα ń tọ́ka sí ní apá àkọ́kọ́
  choice: Ẹ̀mí, tí ó ṣeé ṣe kí ó jẹ́ Ẹ̀mí Mímọ́
  alternative: ẹ̀mí gẹ́gẹ́ bí agbára tẹ̀mí tàbí ẹ̀mí ènìyàn
  rationale: Àyíká Ìhìn Rere Johanu ń so fífúnni ní ìyè mọ́ Ẹ̀mí, ìlò article náà sì ń tọ́ka sí ẹni pàtó; àmì lẹ́tà ńlá ń fi ìtumọ̀ tó ṣeé ṣe jù hàn láì pa àṣàyàn kejì rẹ́.
- issue: Ìtumọ̀ σὰρξ ní ìyàtọ̀ sí Ẹ̀mí
  choice: ara, gẹ́gẹ́ bí ọ̀rọ̀ tó ní ìtumọ̀ gbòòrò
  alternative: ẹ̀dá ẹlẹ́ṣẹ̀, agbára ènìyàn lásán, tàbí ẹran ara
  rationale: A kò fẹ́ sọ ìtumọ̀ rẹ̀ di èrò ẹ̀kọ́ kan ṣoṣo; “ara” ń jẹ́ kí ìyàtọ̀ tí Jésù fi sílẹ̀ dúró.
- issue: Agbára πνεῦμά ἐστιν ní apá ìkẹyìn
  choice: àwọn ọ̀rọ̀ náà jẹ́ ẹ̀mí ní ọ̀nà àbùdá
  alternative: àwọn ọ̀rọ̀ náà ni Ẹ̀mí; tàbí wọ́n jẹ́ ti ẹ̀mí, wọ́n sì ń fúnni ní ìyè
  rationale: Predicate tí kò ní article ṣe atilẹyin fún ìtumọ̀ àbùdá; gbólóhùn Yorùbá náà pa ìsọ̀rọ̀ Gíríìkì mọ́ láì yanju rẹ̀ jù.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “Ẹ̀mí” fún referent tó ṣeé ṣe jù ní apá àkọ́kọ́, ṣùgbọ́n “ẹ̀mí” ní predicate apá ìkẹyìn láti pa ìyàtọ̀ àti àìdánilójú Gíríìkì mọ́. Gbogbo àmì àlàyé [a]–[c] wà nínú ọ̀rọ̀ pàtàkì.
