  to: Ẹ̀mí ni ó ń sọ ènìyàn di alààyè[a]; ara kò ní ìwúlò kankan[b]. Àwọn ọ̀rọ̀ tí mo ti sọ fún yín jẹ́ ẹ̀mí, wọ́n sì jẹ́ ìyè[c].
  rationale: Àtúnṣe pàtàkì ni láti rọ́pò “kò ṣàǹfààní ohunkóhun,” nítorí ó yi ìbáṣepọ̀ olùṣe àti ohun tí a ń ṣe sí padà. “Kò ní ìwúlò kankan” ń ṣàfihàn ìkọ̀ pátápátá ti οὐκ ... οὐδέν, ní ìbámu pẹ̀lú “benefits nothing.” A tún mú gbolohun àkọ́kọ́ rọrùn síi ní Yorùbá, láì yí ìtumọ̀ tàbí ìtọ́kasí Ẹ̀mí padà. Àwọn àmì akọ́silẹ̀ a–c wà níbi tó yẹ, àwọn akọ́silẹ̀ náà sì ṣetọju àwọn àṣàyàn ìtumọ̀.
