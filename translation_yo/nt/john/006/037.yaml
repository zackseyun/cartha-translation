  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: yo
  text: Gbogbo ohun tí Baba ń fún mi yóò wá sí ọ̀dọ̀ mi[a], ẹni tí ó sì bá wá sí ọ̀dọ̀ mi, èmi kì yóò lé e jáde láéláé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo ẹni tí Baba ń fún mi.” Gíríìkì lo gbólóhùn àkójọpọ̀ kan ní ìrísí ẹyọ ọ̀rọ̀ àárín, tí ìtumọ̀ rẹ̀ ní tààràtà jẹ́ “gbogbo ohun tí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “dájúdájú, èmi kì yóò lé e jáde” tàbí “èmi kì yóò lé e jáde rárá.” Gbólóhùn Gíríìkì náà jẹ́ ìkọ̀ tó lágbára gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Gbogbo ohun tí
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àkójọpọ̀ ní ẹyọ ọ̀rọ̀ àárín; “gbogbo ohun tí” pa ìrísí àkójọpọ̀ yìí mọ́, kò sì túmọ̀ rẹ̀ ní tààràtà sí “gbogbo ẹni tí.”
- source_word: δίδωσίν μοι
  choice: Baba bá fún mi
  rationale: “Fún mi” sọ ìtumọ̀ ìṣe ìsinsìnyí náà ní Yorùbá àdánidá. Lílò “bá” bá gbólóhùn àkójọpọ̀ náà mu, láìfi dandan sọ pé fífún náà ti parí tàbí pé ó ń lọ lọ́wọ́.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: “Baba” jẹ́ ọ̀nà Yorùbá àdánidá fún orúkọ oyè yìí nínú ọ̀rọ̀ Jòhánù; a kò fi “Baba mi” kún un nítorí Gíríìkì kò ní arọ́pò-orúkọ ohun-ìní níbí.
- source_word: πρὸς ἐμὲ ἥξει
  choice: ni yóò wá sọ́dọ̀ mi
  rationale: “Wá sọ́dọ̀ mi” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún wíwá sí ẹni kan, “yóò” sì fi ọjọ́ iwájú ἥξει hàn.
- source_word: τὸν ἐρχόμενον πρός με
  choice: ẹni tí ó sì bá wá sọ́dọ̀ mi
  rationale: Èyí dúró nítòsí àpólà alábápín pẹ̀lú arọ́pò-orúkọ Gíríìkì, ó sì ní agbára gbogbogbòò tó bá Yorùbá mu.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: èmi kì yóò lé e jáde láéláé
  rationale: “Kì yóò ... láéláé” fi ìkọ̀ emphatic οὐ μή hàn kedere. “Lé e jáde” tún pa agbára ἐκβάλω ἔξω mọ́ gẹ́gẹ́ bí yíyọ ẹni kan kúrò níta.
theological_decisions:
- issue: Àkójọpọ̀ ọ̀rọ̀ àárín πᾶν ὃ ní ìbáṣepọ̀ pẹ̀lú fífún Baba àti wíwá ènìyàn
  choice: “Gbogbo ohun tí Baba bá fún mi”
  alternative: “Gbogbo ẹni tí Baba bá fún mi”
  rationale: A pa ìrísí àkójọpọ̀ ọ̀rọ̀ Gíríìkì mọ́, kí a má bàa pinnu ní ìkọ̀kọ̀ pé ó ń tẹnumọ́ àwọn ẹnì kọ̀ọ̀kan tàbí ẹgbẹ́ kan gẹ́gẹ́ bí odidi.
- issue: Agbára ìlérí inú οὐ μὴ ἐκβάλω ἔξω
  choice: “èmi kì yóò lé e jáde láéláé”
  alternative: “dájúdájú, èmi kì yóò lé e jáde”
  rationale: Ìtumọ̀ náà fi ìkọ̀ tó lágbára hàn, ṣùgbọ́n kò fa ọ̀rọ̀ ẹsẹ náà sí ẹ̀kọ́ ìjọ kan nípa ìfaradà tàbí ìṣubú kúrò nínú ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àkójọpọ̀ àti ìkọ̀ líle inú Gíríìkì mọ́.
