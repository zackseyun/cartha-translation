language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: yo
  text: Nítorí náà, wọ́n fẹ́ gbà á sínú ọkọ̀ ojú omi náà; lẹ́sẹ̀kẹsẹ̀, ọkọ̀ ojú omi náà dé ilẹ̀ tí wọ́n ń lọ sí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Lẹ́sẹ̀kẹsẹ̀, ọkọ̀ ojú omi náà dé etíkun tí wọ́n ń lọ sí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: wọ́n fẹ́
  rationale: Ọ̀rọ̀ yìí fi ìfẹ́ tàbí ìmúratán wọn hàn lẹ́yìn tí ẹ̀rù wọn ti rọ̀; ‘wọ́n fẹ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá tí kò sọ ìmọ̀lára wọn di líle ju ohun tí Gíríìkì sọ lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì fi àbájáde ìtàn náà hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: gbà á sínú ọkọ̀ ojú omi
  rationale: ‘Gbà á sínú’ lè túmọ̀ sí gbígbà ẹni wọ inú ọkọ̀, ó sì pa ìtumọ̀ ‘take/receive’ ti λαμβάνω mọ́ ní ọ̀nà àdánidá.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọkọ̀ tí wọ́n ń rìn lórí omi, láìdá a lórúkọ bí ọkọ̀ ńlá.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó pa ìyára àti ìṣẹ̀lẹ̀ òjijì tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: ni ọkọ̀ ojú omi náà sì dé ilẹ̀
  rationale: Ní Yorùbá, ‘dé ilẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ pé ọkọ̀ náà wà ní ibi tí wọ́n ń lọ; ó yẹra fún èrò pé ọkọ̀ náà gún tàbí jókòó lórí ilẹ̀ gbígbẹ, ṣùgbọ́n ó ṣì pa ìṣẹ̀lẹ̀ òjijì náà mọ́.
- source_word: γῆς
  choice: ilẹ̀
  rationale: ‘Ilẹ̀’ ni ìbámu ọ̀rọ̀ tó sún mọ́ γῆ jù lọ, ó sì lè tọ́ka sí ilẹ̀ tí wọ́n ń lọ sí níhìn-ín.
- source_word: εἰς ἣν ὑπῆγον
  choice: tí wọ́n ń lọ sí
  rationale: Ó pa ìrìn-àjò tí ó ń bá a lọ, gẹ́gẹ́ bí imperfect ὑπῆγον ṣe fi hàn, àti ibi àfojúsùn wọn mọ́.
theological_decisions:
- issue: Bóyá kí a ṣàlàyé tàbí dín ìṣẹ̀lẹ̀ òjijì tó dà bí iṣẹ́ ìyanu kù nínú gbólóhùn kejì
  choice: Pa ‘lẹ́sẹ̀kẹsẹ̀’ mọ́, kí a sì sọ pé ọkọ̀ náà ‘dé ilẹ̀’ láìfi àlàyé míì kún un.
  alternative: Láìpẹ́, ọkọ̀ náà dé etíkun.
  rationale: Gíríìkì sọ ìṣẹ̀lẹ̀ náà ní ṣókí, ó sì tẹnu mọ́ ìyára rẹ̀. Ìtumọ̀ náà kò gbọ́dọ̀ tú ìṣòro tàbí agbára ìtàn náà ká nípa fífi àlàyé tí kò sí nínú orísun kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘ọkọ̀ ojú omi’ fún ìtumọ̀ tó ṣe kedere, a sì fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
