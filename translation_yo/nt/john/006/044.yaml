id: JHN.6.44
reference: John 6:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: yo
  text: Kò sí ẹnikẹ́ni tí ó lè wá sọ́dọ̀ mi, àfi bí Baba tí ó rán mi bá fà á[a][b] wá; èmi yóò sì jí i dìde ní ọjọ́ ìkẹyìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí ‘wọ́ ọ wá’ tàbí ‘fà á lọ.’ Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ fífà tàbí wíwọ́ tí ó lágbára; a lo ‘fà á wá’ nínú ẹsẹ náà láti pa agbára ọ̀rọ̀ náà mọ́ láìpinnu ṣáájú bí Baba ṣe ń mú ènìyàn wá sọ́dọ̀ Ọmọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì lo àrọ́pò-orúkọ akọ ẹyọ kan gẹ́gẹ́ bí aṣojú; ọ̀rọ̀ náà kan ẹnikẹ́ni, kì í ṣe àwọn ọkùnrin nìkan. Àrọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Kò sí ẹnikẹ́ni
  rationale: 'Ọ̀rọ̀ yìí fi ìkọ̀sílẹ̀ gbogbo ènìyàn hàn ní Yorùbá àdánidá: ‘kò sí ẹnikẹ́ni’ túmọ̀ sí pé kò sí ẹni kan rárá.'
- source_word: δύναται ἐλθεῖν πρός με
  choice: tí ó lè wá sọ́dọ̀ mi
  rationale: ‘Lè’ pa ìtumọ̀ agbára tàbí àǹfààní láti ṣe nǹkan mọ́; ‘wá sọ́dọ̀ mi’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣípò sí ọ̀dọ̀ Jésù, láìfi àlàyé ẹ̀kọ́ ìgbàlà kún un.
- source_word: ἐὰν μὴ
  choice: bí kò ṣe pé
  rationale: Èyí jẹ́ ìsọ̀rọ̀ Yorùbá tí ó bá ‘àfi bí’ tàbí ‘unless’ mu, ó sì mú kí ipò tí gbólóhùn náà gbé kalẹ̀ ṣe kedere.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: Baba tí ó rán mi
  rationale: A tú participle náà sí gbólóhùn ìbátan Yorùbá, nígbà tí ‘Baba’ pa orúkọ ẹni tí Jésù lò mọ́.
- source_word: ἑλκύσῃ
  choice: fà á wá
  rationale: ‘Fà … wá’ pa èrò ìṣípò tí ẹni mìíràn mú ṣẹ mọ́, ó sì lè ní agbára ju pípè lásán lọ, láìfi dandan túmọ̀ sí fífi ipá líle wọ́ ẹni náà.
- source_word: αὐτόν
  choice: á / i
  rationale: Àrọ́pò-orúkọ Yorùbá kò pín akọ àti abo; nítorí náà ó tọ́ka sí ẹnikẹ́ni tí a mẹ́nu kàn, gẹ́gẹ́ bí àrọ́pò-orúkọ akọ ẹyọ kan ti Gíríìkì ṣe ní agbára aṣojú.
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: èmi yóò sì jí i dìde
  rationale: ‘Èmi’ pa ìtẹnumọ́ orúkọ ẹni mọ́, ‘jí i dìde’ sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún jíjí ẹni náà dìde kúrò nínú òkú.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: ní ọjọ́ ìkẹyìn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtọ́kasí ọjọ́ ìkẹyìn mọ́ láìfi àlàyé eschatology mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ ἑλκύσῃ nínú ọ̀rọ̀ ìgbàlà tí a máa ń jiyàn lé lórí
  choice: fà á wá
  alternative: wọ́ ọ wá; fà á lọ
  rationale: ‘Fà á wá’ jẹ́ kí agbára ọ̀rọ̀ Gíríìkì náà dúró, ṣùgbọ́n kò pinnu bí iṣẹ́ Baba ṣe ń ṣẹlẹ̀ tàbí bóyá a lè kọ̀ ọ́; báyìí ni a ṣe pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Àrọ́pò-orúkọ akọ ẹyọ kan αὐτόν tí ó ń ṣe aṣojú gbogbo ènìyàn
  choice: á / i, àrọ́pò-orúkọ Yorùbá tí kò ní akọ tàbí abo
  alternative: ọkùnrin náà; ẹni náà
  rationale: Yorùbá kò ní àrọ́pò-orúkọ ẹni kẹta tí akọ tàbí abo yà; lílo ‘á/i’ jẹ́ ìbámu pẹ̀lú gírámà Yorùbá, ó sì jẹ́ kí ìtọ́kasí gbogbogbò ti Gíríìkì dúró láìdín in sí àwọn ọkùnrin nìkan.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀, àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. ‘Bí kò ṣe pé’ àti ‘fà á wá’ yẹra fún èdè àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó le ju ohun tí orísun Gíríìkì sọ lọ.
