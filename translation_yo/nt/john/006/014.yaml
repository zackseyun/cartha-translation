id: JHN.6.14
reference: John 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: yo
  text: Nítorí náà, nígbà tí àwọn ènìyàn náà rí àmì tí ó ṣe[a], wọ́n ń sọ pé, “Ní tòótọ́, ẹni yìí ni Wòlíì náà[b] tí ń bọ̀ wá sí ayé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “iṣẹ́ ìyanu tí ó ṣe.” Jòhánù sábà máa ń lo “àmì” (σημεῖον) láti tẹnu mọ́ ohun tí àwọn iṣẹ́ Jésù ń fi hàn nípa rẹ̀, kì í ṣe bí wọ́n ṣe jẹ́ iṣẹ́ ìyanu nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “Wòlíì náà” tọ́ka sí wòlíì bí Mósè tí àwọn ènìyàn ń retí (Diutarónómì 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Nítorí náà, nígbà tí àwọn ènìyàn náà
  rationale: “Àwọn ènìyàn” tọ́ka sí gbogbo àwọn ènìyàn inú ogunlọ́gọ̀, kì í ṣe àwọn ọkùnrin nìkan. “Nítorí náà” sì mú ìlọsíwájú àti àbájáde inú ìtàn tí οὖν ń fi hàn jáde.
- source_word: ἰδόντες
  choice: rí
  rationale: A tú participle aorist náà sí ọ̀rọ̀-ìṣe tó bá èdè Yorùbá mu lábẹ́ “nígbà tí,” láì pàdánù ìtumọ̀ pé ohun tí wọ́n rí ló ṣáájú ọ̀rọ̀ wọn.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: àmì tí ó ṣe
  rationale: '“Àmì” pa ìtumọ̀ pàtàkì σημεῖον mọ́ nínú Jòhánù: iṣẹ́ náà jẹ́ ìyanu, ṣùgbọ́n ó tún ń fi òtítọ́ kan nípa Jésù hàn. Ọ̀nà yìí tún jẹ́ àdánidá ní Yorùbá.'
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àmì ìṣe “ń” fi ipa imperfect hàn, ó sì lè túmọ̀ sí pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé ọ̀pọ̀ wọn ń sọ ọ́.
- source_word: ἀληθῶς
  choice: Ní tòótọ́
  rationale: Ó fi ìdánilójú àti ìjẹ́wọ́ pé ìdánimọ̀ náà jẹ́ òtítọ́ hàn ní ọ̀nà tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: ὁ προφήτης
  choice: Wòlíì náà
  rationale: Àfikún “náà” fi hàn pé wòlíì pàtó kan tí àwọn ènìyàn ń retí ni wọ́n ń tọ́ka sí, kì í ṣe wòlíì kan lásán. Lílò lẹ́tà ńlá ń fi ìlò rẹ̀ gẹ́gẹ́ bí oyè hàn.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: tí ń bọ̀ wá sí ayé
  rationale: Gbólóhùn yìí pa àwòrán participle present náà mọ́, kò sì yí i sí àsọtẹ́lẹ̀ ọjọ́ iwájú tó le ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Ìdánimọ̀ “Wòlíì náà”
  choice: Wòlíì náà
  alternative: wòlíì kan; wòlíì bí Mósè
  rationale: Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí wòlíì bí Mósè tí Diutarónómì 18:15–18 sọ pé yóò dé, ṣùgbọ́n ẹsẹ̀ Gíríìkì kò sọ ìdánimọ̀ yẹn ní tààrà. Nítorí náà, a pa oyè náà mọ́, a kò sì fi ìtumọ̀ àfikún sínú ọ̀rọ̀ ẹsẹ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Wọ́n ń sọ” pa ipa ọ̀rọ̀-ìṣe imperfect mọ́; “tí ń bọ̀ wá sí ayé” sì pa ìrísí present ti ọ̀rọ̀ Gíríìkì mọ́ láì yanju àkókò rẹ̀ ju bó ṣe wà nínú orísun lọ.
