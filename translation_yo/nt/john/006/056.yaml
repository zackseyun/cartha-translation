  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ pa àwọn apá pàtàkì Gíríìkì mọ́: ẹni tí ìṣe jíjẹ àti mímu ń dá mọ́, ‘ẹran ara,’ ‘ẹ̀jẹ̀,’ àti ìbágbépọ̀ méjèèjì. Síbẹ̀, àmì àlàyé a wà lórí ‘ẹran ara mi’ dípò lórí ọ̀rọ̀-ìṣe ‘jẹ,’ bí ó tilẹ̀ jẹ́ pé τρώγων, ìyẹn ọ̀rọ̀-ìṣe náà, ni àlàyé náà kan. ‘Ń gbé inú’ lè ṣiṣẹ́, ṣùgbọ́n ‘ń dúró nínú’ fara mọ́ μένει dáadáa, ó sì ṣe kedere pé ìbáṣepọ̀ tí ń tẹ̀síwájú ni a ń sọ.'
