  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: yo
  text: Ẹni tí ó ń jẹ[a] ẹran ara mi, tí ó sì ń mu ẹ̀jẹ̀ mi, ó ń dúró nínú mi[b], èmi náà sì ń dúró nínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń jẹ ní fífọ́”; ọ̀rọ̀-ìṣe Gíríìkì náà ní àwọ̀ ìtumọ̀ tó lágbára ju ọ̀rọ̀ gbogbogbò fún jíjẹ lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń gbé inú mi”; μένω túmọ̀ sí dídúró tàbí ṣíṣe ibùgbé, ó sì jẹ́ ọ̀rọ̀ pàtàkì nínú Jòhánù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Ẹni tí ó ń jẹ
  rationale: Àpilẹ̀kọ pẹ̀lú ọ̀rọ̀-ìṣe aláìparí yìí ń tọ́ka sí ẹni tí ìṣe náà ń dá mọ̀; ‘Ẹni tí ó ń jẹ’ pa ẹyọ ọ̀rọ̀ náà àti ìṣe tí ń bá a lọ mọ́ ní Yorùbá àdánidá.
- source_word: τρώγων
  choice: ń jẹ
  rationale: τρώγω lágbára ju ọ̀rọ̀ Gíríìkì tí ó wọ́pọ̀ fún ‘jẹ’ lọ, ó sì lè ní ìtumọ̀ jíjẹ tàbí fífọ oúnjẹ ní ẹnu; ‘ń jẹ’ ló ṣe kedere jù ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa àwọ̀ ìtumọ̀ tó lágbára mọ́.
- source_word: μου τὴν σάρκα
  choice: ẹran ara mi
  rationale: ‘Ẹran ara’ ń sọ σάρξ ní ọ̀nà tó ṣeé lóye, tó sì pa àwòrán ara gidi mọ́ láì sọ ọ́ di àlàyé ẹ̀kọ́ ìsìn kan.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: tí ó sì ń mu ẹ̀jẹ̀ mi
  rationale: Ìtumọ̀ tààrà yìí pa ìbáramu àwọn ọ̀rọ̀-ìṣe méjèèjì àti àwòrán ẹbọ tó lágbára nínú Gíríìkì mọ́.
- source_word: ἐν ἐμοὶ μένει
  choice: ó ń gbé inú mi
  rationale: Nínú Yorùbá, ‘ń gbé inú mi’ jẹ́ ọ̀nà àdánidá láti sọ ìbágbépọ̀ tó ń bá a lọ; ó pa èrò pàtàkì μένω nínú Jòhánù mọ́ láì fi èrò ẹ̀kọ́ ìsìn míì kún un.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: èmi náà sì ń gbé inú rẹ̀
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe kejì sílẹ̀ nítorí a ti lóye rẹ̀; Yorùbá tún un sọ ní ọ̀nà àdánidá láti jẹ́ kí ìbágbé inú ara ẹni méjèèjì ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ oúnjẹ Olúwa tàbí àpẹẹrẹ nípa jíjẹ ẹran ara àti mímu ẹ̀jẹ̀
  choice: A pa ọ̀rọ̀ gidi àti àwòrán Gíríìkì mọ́ láì fi àlàyé ẹ̀kọ́ ìsìn kún un.
  alternative: Ṣíṣe é ní pàtó gẹ́gẹ́ bí oúnjẹ Olúwa, tàbí ṣíṣe é ní pàtó gẹ́gẹ́ bí àpẹẹrẹ fún ìgbàgbọ́.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò yanjú àríyànjiyàn láàárín àwọn ìtumọ̀ wọ̀nyí; ìtumọ̀ yìí jẹ́ kí ìdíjú àti agbára àwòrán náà dúró.
- issue: Ọ̀rọ̀ Jòhánù nípa gbígbé inú ara ẹni méjèèjì
  choice: ‘ń gbé inú’ gẹ́gẹ́ bí ìbáṣepọ̀ tó ń bá a lọ
  alternative: ‘ń dúró nínú’ tàbí àtúnsọ rẹ̀ sí ‘ní ìṣọ̀kan pẹ̀lú’
  rationale: ‘Ń gbé inú’ jẹ́ Yorùbá tó ṣeé lóye, ó sì pa èrò ìbágbé inú ara ẹni méjèèjì mọ́ láì dín un kù sí ètò ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ẹran ara’ àti ‘ẹ̀jẹ̀’ láti pa àwòrán gidi tó lágbára mọ́; a lo ‘ń gbé inú’ fún ìbáṣepọ̀ tí ń bá a lọ ní ọ̀nà tó mọ́gbọ́n dání fún òǹkàwé Yorùbá.
