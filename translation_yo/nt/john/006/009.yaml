- from: “Ọmọkùnrin kan wà níhìn-ín, ó ní ìṣù àkàrà ọkà bálì márùn-ún àti ẹja méjì; ṣùgbọ́n kí ni ìwọ̀nyí lè ṣe fún ọ̀pọ̀ ènìyàn báyìí?”
  to: “Ọmọkùnrin kan wà níhìn-ín, ó ní búrẹ́dì bálì márùn-ún àti ẹja méjì; ṣùgbọ́n báwo ni ìwọ̀nyí yóò ṣe tó fún ọ̀pọ̀ ènìyàn tó bẹ́ẹ̀?”[a]
  rationale: The revision replaces the misleading yam-based expression with “búrẹ́dì bálì,” removes the unsupported “báyìí,” and renders the closing rhetorical question idiomatically while retaining its sense of inadequacy for such a large number. The footnote is placed at the clause to which its alternative pertains.
