translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘àkàrà ọkà bálì’ láti yẹra fún kí ‘àkàrà’ dá nìkan mú àkàrà ẹ̀wà wá sí ọkàn. Ìbéèrè ìparí ni a túmọ̀ ní ọ̀nà àdánidá tí ó pa ìtumọ̀ àìtó oúnjẹ náà mọ́.
