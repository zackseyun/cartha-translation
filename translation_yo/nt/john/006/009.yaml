id: JHN.6.9
reference: John 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: yo
  text: “Ọmọkùnrin kan wà níhìn-ín, ó ní búrẹ́dì bálì márùn-ún àti ẹja méjì; ṣùgbọ́n báwo ni ìwọ̀nyí yóò ṣe tó fún ọ̀pọ̀ ènìyàn tó bẹ́ẹ̀?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n ìwọ̀nyí kò pọ̀ tó fún ọ̀pọ̀ ènìyàn tó bẹ́ẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδάριον
  choice: ọmọkùnrin kan
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọmọ tàbí ọ̀dọ́kùnrin; ‘ọmọkùnrin’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere láì fi ọjọ́-orí pàtó kún un.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó túmọ̀ sí ibi tí ẹni tó ń sọ̀rọ̀ wà; ‘níhìn-ín’ jẹ́ ìtumọ̀ àdánidá, tó sì ṣe ṣókí.
- source_word: ὃς ἔχει
  choice: ó ní
  rationale: Yorùbá máa ń so gbólóhùn ìbátan irú èyí pọ̀ nípa lílo arọ́pò-orúkọ ‘ó’; ó dá ìtumọ̀ náà mọ́, ó sì jẹ́ èdè àdánidá.
- source_word: ἄρτους κριθίνους
  choice: ìṣù àkàrà ọkà bálì
  rationale: ‘Ìṣù àkàrà’ fi hàn pé búrẹ́dì náà wà ní ìṣù, ‘ọkà bálì’ sì sọ irú ọkà tí a fi ṣe é; èyí yà á sọ́tọ̀ kúrò ní àkàrà ẹ̀wà Yorùbá.
- source_word: ὀψάρια
  choice: ẹja
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ẹja tí a máa ń jẹ pẹ̀lú búrẹ́dì. A kò fi ‘kéékèèké’ kún un nítorí ọ̀rọ̀ Gíríìkì kò pọn dandan pé kí a sọ ìwọ̀n wọn.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ wá láàárín oúnjẹ díẹ̀ tó wà àti ọ̀pọ̀ ènìyàn; ‘ṣùgbọ́n’ dá agbára ìyàtọ̀ náà mọ́.
- source_word: ταῦτα τί ἐστιν
  choice: kí ni ìwọ̀nyí lè ṣe
  rationale: Ìbéèrè náà ń ṣe àyẹ̀wò bí oúnjẹ náà ṣe lè tó; gbolohun yìí jẹ́ Yorùbá àdánidá tó pa agbára ìbéèrè àsọyé náà mọ́.
- source_word: εἰς τοσούτους
  choice: fún ọ̀pọ̀ ènìyàn báyìí
  rationale: Ó fi àìtó oúnjẹ náà hàn ní ìbámu pẹ̀lú iye ènìyàn tó pọ̀; ‘báyìí’ ń ṣàfihàn ìtumọ̀ ‘tó pọ̀ tó báyìí’ láì pe wọn ní ogunlọ́gọ̀ níbi tí Gíríìkì kò ti lo orúkọ yẹn.
