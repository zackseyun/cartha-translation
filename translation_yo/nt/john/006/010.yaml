id: JHN.6.10
reference: John 6:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: yo
  text: Jésù sọ pé, “Ẹ mú kí àwọn ènìyàn jókòó[a].” Koríko sì pọ̀ ní ibi náà. Nítorí náà, àwọn ọkùnrin náà jókòó; iye wọn sì jẹ́ nǹkan bí ẹgbẹ̀rún márùn-ún.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “rọ̀gbọ̀kú láti jẹun.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí fífi ara tì sẹ́yìn nígbà oúnjẹ; “jókòó” ni ọ̀rọ̀ àdánidá ní àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn ènìyàn” ni a kọ́kọ́ sọ, lẹ́yìn náà ni a sọ “àwọn ọkùnrin”; nítorí náà, iye tó jẹ́ nǹkan bí ẹgbẹ̀rún márùn-ún ń tọ́ka pàtó sí àwọn ọkùnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: Ẹ mú kí àwọn ènìyàn jókòó
  rationale: Àkópọ̀ ποιέω pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ἀναπεσεῖν jẹ́ ọ̀nà ìsọ̀rọ̀ tó túmọ̀ sí mímú kí ẹlòmíràn ṣe ohun kan. “Ẹ mú kí … jókòó” jẹ́ Yorùbá àdánidá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: τοὺς ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: ἄνθρωπος níbí ń tọ́ka sí gbogbo àwọn tó wà nínú èrò náà, kì í ṣe àwọn ọkùnrin nìkan; “àwọn ènìyàn” pa ìtumọ̀ gbòòrò yìí mọ́.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: jókòó / jókòó
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífi ara tì sẹ́yìn nígbà oúnjẹ, ṣùgbọ́n “jókòó” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ fún ìṣe náà ní àyíká ìtàn yìí. Àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn hàn.
- source_word: χόρτος πολὺς
  choice: Koríko sì pọ̀
  rationale: χόρτος túmọ̀ sí koríko níbí, πολὺς sì fi ọ̀pọ̀ rẹ̀ hàn. Ìtumọ̀ yìí sun mọ́ orísun, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐν τῷ τόπῳ
  choice: ní ibi náà
  rationale: Gbólóhùn onípò yìí tọ́ka sí ibi tí ìṣẹ̀lẹ̀ náà ti ń ṣẹlẹ̀; “ní ibi náà” ṣe kedere ní Yorùbá.
- source_word: οἱ ἄνδρες
  choice: àwọn ọkùnrin náà
  rationale: ἀνήρ ń tọ́ka pàtó sí ọkùnrin, ó sì yàtọ̀ sí ἀνθρώπους tó ṣáájú. Ìtumọ̀ yìí pa ìyàtọ̀ ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: iye wọn tó ẹgbẹ̀rún márùn-ún
  rationale: ὡς fi hàn pé iye náà jẹ́ àfojúsùn, τὸν ἀριθμόν sì ń sọ nípa iye wọn. “Iye wọn tó ẹgbẹ̀rún márùn-ún” jẹ́ kedere, ó sì pa àfojúsùn náà mọ́.
theological_decisions:
- issue: Ìkà àwọn ọkùnrin nínú ìtàn fífún èrò ní oúnjẹ
  choice: Ṣe ìyàtọ̀ láàárín ἀνθρώπους gẹ́gẹ́ bí “àwọn ènìyàn” àti ἄνδρες gẹ́gẹ́ bí “àwọn ọkùnrin.”
  alternative: Túmọ̀ àwọn méjèèjì sí “àwọn ènìyàn.”
  rationale: Orísun Gíríìkì yí padà láti ọ̀rọ̀ tó gba gbogbo ènìyàn sí ọ̀rọ̀ tó tọ́ka pàtó sí ọkùnrin níbi ìkà iye. Pípa ìyàtọ̀ náà mọ́ kò jẹ́ kí a pa ẹ̀rí inú ọ̀rọ̀ run.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì tí gbogbo ènìyàn lè lóye. A lo “Ẹ mú kí …” fún àṣẹ olópò ènìyàn, “koríko sì pọ̀” fún ìtàn tó rọrùn, àti àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
