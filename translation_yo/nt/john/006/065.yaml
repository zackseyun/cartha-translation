id: JHN.6.65
reference: John 6:65
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: yo
  text: Ó sì ń sọ pé, “Nítorí èyí ni mo ti sọ fún yín pé kò sí ẹni tí ó lè wá sọ́dọ̀ mi bí kò ṣe pé a ti fi í fún un láti ọ̀dọ̀ Baba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ó sì ń sọ pé
  rationale: Àkókò imperfect fi ìṣe tí ó ń lọ níwájú hàn; ‘ń sọ’ pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: Διὰ τοῦτο
  choice: Nítorí èyí ni
  rationale: Ó tọ́ka sẹ́yìn sí ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì mú ìdí ọ̀rọ̀ tó tẹ̀ lé e wọlé.
- source_word: εἴρηκα ὑμῖν
  choice: mo ṣe sọ fún yín
  rationale: Àpẹẹrẹ ‘ni ... ṣe’ jẹ́ ọ̀nà Yorùbá àdánidá láti so ìdí pọ̀ mọ́ ohun tí Jésù ti sọ; ‘sọ fún yín’ pa ìtọ́kasí sí àwọn olùgbọ́ mọ́.
- source_word: οὐδεὶς δύναται
  choice: kò sí ẹni tí ó lè
  rationale: Ó fi àìlè ṣe hàn, kì í ṣe àìgbàṣẹ.
- source_word: ἐλθεῖν πρός με
  choice: wá sọ́dọ̀ mi
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún wíwá sí ẹni kan, láìṣàlàyé ìtumọ̀ ìgbàgbọ́ rẹ̀ ju ohun tí orísun sọ lọ.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: bí kò ṣe pé a ti fi í fún un
  rationale: Ó pa ìtumọ̀ passive àti ìṣe tí a ti mú ṣẹ mọ́; ‘fi í fún un’ tún fi àpólà arọ́pò ohun tí a kò sọ ní kedere sílẹ̀ gẹ́gẹ́ bí Gíríìkì.
- source_word: ἐκ τοῦ πατρός
  choice: láti ọ̀dọ̀ Baba
  rationale: ‘Láti ọ̀dọ̀’ ṣàfihàn orísun ohun náà, ó sì sún mọ́ ἐκ ju gbolohun tó sọ Baba di aṣojú ìṣe ní tààràtà lọ.
theological_decisions:
- issue: Ìrànlọ́wọ́ Ọlọ́run àti agbára ènìyàn láti wá sọ́dọ̀ Jésù
  choice: A sọ àìlè wá sọ́dọ̀ Jésù láìsí ohun tí ó ti wá láti ọ̀dọ̀ Baba ní tààràtà.
  alternative: Ṣàlàyé fífún náà gẹ́gẹ́ bí oore-ọ̀fẹ́ tí ó dájú pé yóò mú ènìyàn wá, tàbí gẹ́gẹ́ bí oore-ọ̀fẹ́ tó kàn mú kí gbogbo ènìyàn lè dáhùn.
  rationale: Ẹsẹ̀ náà sọ pé fífún láti ọ̀dọ̀ Baba jẹ́ ohun tí ó pọndandan, ṣùgbọ́n kò ṣàlàyé irú tàbí ìwọ̀n fífún náà; ìtumọ̀ kò gbọdọ̀ yanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tó wá lẹ́yìn náà.
- issue: αὐτῷ tó jẹ́ akọ ẹyọ ṣùgbọ́n tó dúró fún ẹnikẹ́ni
  choice: fún un
  alternative: fún ẹni náà
  rationale: Arọ́pò-orúkọ Yorùbá ‘un’ kò fi akọ tàbí abo hàn, ṣùgbọ́n ó pa ẹyọ àti ìtọ́kasí gbogbogbò mọ́ láìfi ohun tí kò sí nínú orísun kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ọlọ́wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. Kò sí àlàyé ẹsẹ̀ abẹ́ nítorí ‘fún un’ lè gbé akọ ẹyọ alágbèéká orísun kalẹ̀ láìdá akọ tàbí abo sí i, ‘fi ... fún’ àti ‘láti ọ̀dọ̀’ sì pa àṣàyàn ọ̀rọ̀ orísun mọ́.
