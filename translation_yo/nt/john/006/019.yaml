id: JHN.6.19
reference: John 6:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti wa ọkọ̀ ojú omi náà fún nǹkan bí sítádíà mẹ́ẹ̀ẹ́dọ́gbọ̀n tàbí ọgbọ̀n[a], wọ́n rí Jésù tí ó ń rìn lórí òkun[b], tí ó sì ń sún mọ́ ọkọ̀ náà; ẹ̀rù sì bà wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sítádíọ̀nù jẹ́ òṣùwọ̀n gígùn ní ayé àtijọ́. Sítádíà mẹ́ẹ̀ẹ́dọ́gbọ̀n tàbí ọgbọ̀n jẹ́ nǹkan bí máìlì mẹ́ta sí mẹ́rin (ìwọ̀n kìlómítà márùn-ún sí mẹ́fà).
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘tí ó ń rìn lórí omi.’ Ohun tí èdè Gíríìkì sọ ní tààrà ni ‘tí ó ń rìn lórí òkun.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: tí wọ́n ti wa ọkọ̀ ojú omi náà
  rationale: Nínú àyíká ìrìn-àjò lórí omi, ἐλαύνω túmọ̀ sí fífi ọkọ̀ rìn nípa wíwà á. Ìṣètò ‘ti wa’ tún fi hàn pé ìṣe yìí ti ṣẹlẹ̀ ṣáájú bí wọ́n ṣe rí Jésù.
- source_word: οὖν
  choice: sì
  rationale: ‘Sì’ so ẹsẹ̀ yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá, ó sì pa ipa àsopọ̀ οὖν mọ́ láì mú èdè le jù.
- source_word: ὡς
  choice: fún nǹkan bí
  rationale: Ọ̀rọ̀ yìí fi hàn pé òṣùwọ̀n náà jẹ́ àfojúsùn, kì í ṣe iye pípé.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: sítádíà mẹ́ẹ̀ẹ́dọ́gbọ̀n tàbí ọgbọ̀n
  rationale: A pa òṣùwọ̀n ayé àtijọ́ tí Gíríìkì lò mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìwọ̀n òde òní nínú àlàyé ìsàlẹ̀.
- source_word: θεωροῦσιν
  choice: wọ́n rí
  rationale: ‘Wọ́n rí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìrírí ojú tí ọ̀rọ̀ náà ń sọ mu.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: tí ó ń rìn lórí òkun
  rationale: ‘Lórí òkun’ tẹ̀ lé θάλασσα, ‘òkun,’ ó sì pa ìtumọ̀ ìṣẹ̀lẹ̀ náà mọ́ láì sọ ọ́ di ‘lẹ́gbẹ̀ẹ́ òkun.’
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: tí ó sì ń sún mọ́ ọkọ̀ náà
  rationale: Gbólóhùn yìí ń fi ìṣípòpadà sí ibi tó sún mọ́ ọkọ̀ hàn; ‘ń sún mọ́’ sọ ìlọsíwájú yẹn ní Yorùbá àdánidá.
- source_word: πλοίου
  choice: ọkọ̀ ojú omi
  rationale: ‘Ọkọ̀ ojú omi’ ṣe kedere pé ọkọ̀ kékeré orí omi ni, kì í ṣe ọkọ̀ ojú pópó tàbí ọkọ̀ ńlá.
- source_word: ἐφοβήθησαν
  choice: ẹ̀rù sì bà wọ́n
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti olóye láti sọ pé wọ́n bẹ̀rù nígbà tí wọ́n rí i.
theological_decisions:
- issue: Bí a ṣe máa tú àpèjúwe iṣẹ́ ìyanu náà láì dín agbára ìtumọ̀ rẹ̀ kù
  choice: ń rìn lórí òkun
  alternative: ń rìn lórí omi; ń rìn lẹ́gbẹ̀ẹ́ òkun
  rationale: ἐπὶ τῆς θαλάσσης nínú àyíká yìí túmọ̀ sí pé Jésù ń rìn lórí òkun fúnra rẹ̀. ‘Lẹ́gbẹ̀ẹ́ òkun’ kò bá ipò àwọn ọmọ-ẹ̀yìn ní àárín omi mu, ‘lórí omi’ sì jẹ́ àlàyé tó yí ọ̀rọ̀ θάλασσα, ‘òkun,’ padà díẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbogbò. Àmì ohùn wà níbi tí wọ́n ti yẹ; a lo ‘Jésù,’ ‘ọkọ̀ ojú omi,’ àti ọ̀rọ̀ ìṣe àdánidá ‘ẹ̀rù bà wọ́n.’ A pa sítádíà mọ́ gẹ́gẹ́ bí òṣùwọ̀n orísun, pẹ̀lú àlàyé òde òní ní ìsàlẹ̀.
