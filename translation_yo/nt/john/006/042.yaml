source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: yo
  text: Wọ́n sì ń sọ pé, “Ṣé ẹni yìí kì í ṣe Jésù, ọmọ Jósẹ́fù, ẹni tí àwa mọ bàbá àti ìyá rẹ̀? Báwo ni ó ṣe ń sọ báyìí pé, ‘Mo ti sọ̀kalẹ̀ láti ọ̀run’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àìpé (imperfect) náà fi ìṣe tí ń lọ lọ́wọ́ tàbí ọ̀rọ̀ tí wọ́n ń tún sọ hàn; “ń sọ” pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ṣé ẹni yìí kì í ṣe
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbéèrè òdì tí ń retí ìfọwọ́sí hàn.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: ọmọ Jósẹ́fù
  rationale: “Ọmọ” jẹ́ yíyan Yorùbá tó ṣe kedere fún υἱός ní àyíká yìí, ó sì pa ìtẹnumọ́ wọn lórí ìdílé ènìyàn Jésù mọ́.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: ẹni tí àwa mọ baba àti ìyá rẹ̀
  rationale: Ó pa gbólóhùn ìbátan àti ìtẹnumọ́ ἡμεῖς (“àwa”) mọ́, nígbà tó sì jẹ́ Yorùbá tó ṣàn dáadáa.
- source_word: πῶς νῦν λέγει
  choice: Báwo ni ó ṣe wá ń sọ nísinsìnyí
  rationale: “Báwo” pa ìtumọ̀ ìpìlẹ̀ πῶς mọ́; “ń sọ” fi àsìkò ìsinsìnyí λέγει hàn, “wá” àti “nísinsìnyí” sì mú ìyàlẹ́nu àti νῦν jáde láìfi ìtumọ̀ “ó lè” kún un.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ọ̀nà Yorùbá tó wọ́pọ̀ àti tó ṣe kedere fún orísun tàbí ibi tí ẹni ti wá.
- source_word: καταβέβηκα
  choice: Mo ti sọ̀kalẹ̀
  rationale: Àmì “ti” pẹ̀lú “sọ̀kalẹ̀” fi ìṣe tí ó ti pé tí ipa rẹ̀ ṣì wà hàn, ní ìbámu pẹ̀lú perfect Gíríìkì.
theological_decisions:
- issue: Àtakò àwọn ènìyàn sí ọ̀rọ̀ Jésù nípa bí ó ti wá láti ọ̀run
  choice: “Mo ti sọ̀kalẹ̀ láti ọ̀run”
  alternative: “Mo wá láti ọ̀run”
  rationale: Yíyan náà pa èdè ìsọ̀kalẹ̀ gangan àti ìforígbárí tó wà láàárín ìmọ̀ wọn nípa ìdílé Jésù àti ohun tí ó sọ nípa orísun rẹ̀ mọ́; a kò túmọ̀ rẹ̀ sí àpẹẹrẹ tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ṣé” àti “wá ń sọ” jẹ́ àdánidá nínú ọ̀rọ̀ ẹnu, ṣùgbọ́n gbogbo gbólóhùn náà ṣì yẹ fún kíkà ní gbangba.
