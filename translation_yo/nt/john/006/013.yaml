source:
  edition: SBLGNT
  text: συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ⸀ἐπερίσσευσαν τοῖς βεβρωκόσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: yo
  text: Nítorí náà, wọ́n kó wọn jọ, wọ́n sì fi àwọn ẹ̀yà[a] lára ìṣù búrẹ́dì ọkà bálì márùn-ún náà, tí wọ́n ṣẹ́ kù lẹ́yìn ìjẹun,[b] kún agbọ̀n méjìlá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “àwọn ègé” tàbí “àwọn ẹ̀yà tí a ṣẹ́” (κλασμάτων).
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “tí wọ́n pọ̀ ju fún àwọn tí wọ́n ti jẹun”; nínú àyíká ọ̀rọ̀, wọ́n jẹ́ àwọn apá oúnjẹ tí ó ṣẹ́ kù lẹ́yìn ìjẹun.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Nítorí náà, wọ́n kó wọn jọ
  rationale: “Nítorí náà” fi hàn pé ìṣe àwọn ọmọ-ẹ̀yìn jẹ́ àbájáde àṣẹ Jésù ní ẹsẹ tó ṣáájú; “kó wọn jọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì mú ohun tí a kò tún sọ ní Gíríìkì yé láti inú àyíká ọ̀rọ̀.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: wọ́n sì ... kún agbọ̀n méjìlá
  rationale: Ètò ọ̀rọ̀ “fi ... kún” jẹ́ àdánidá ní Yorùbá, “agbọ̀n” sì jẹ́ ìtumọ̀ gbangba tí kò fi irú agbọ̀n pàtó kún ohun tí orísun sọ.
- source_word: κλασμάτων
  choice: àwọn ẹ̀yà
  rationale: Ó tọ́ka sí àwọn apá búrẹ́dì tí a ṣẹ́; “àwọn ẹ̀yà” ṣe kedere, ó sì rọrùn fún òǹkàwé òde òní. Àṣàyàn “àwọn ègé” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: lára ìṣù búrẹ́dì ọkà bálì márùn-ún náà
  rationale: “Lára” ṣàfihàn pé àwọn ẹ̀yà náà ti inú àwọn ìṣù búrẹ́dì náà wá; “ọkà bálì” dá irú ọkà náà mọ̀, “márùn-ún náà” sì so ọ̀rọ̀ náà mọ́ oúnjẹ tí a mẹ́nu kàn tẹ́lẹ̀.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: tí ó ṣẹ́ kù lẹ́yìn tí àwọn ènìyàn náà ti jẹun
  rationale: 'Èyí sọ ìtumọ̀ àyíká ọ̀rọ̀ náà ní Yorùbá àdánidá: àwọn ẹ̀yà náà ni ó ṣẹ́ kù nígbà tí jíjẹun parí. Àlàyé ìsàlẹ̀ pa ìrísí Gíríìkì tó túmọ̀ ní tààrà sí “tí ó pọ̀ ju fún àwọn tí wọ́n ti jẹun” mọ́.'
theological_decisions:
- issue: Ìbáṣepọ̀ gírámà nínú τοῖς βεβρωκόσιν
  choice: lẹ́yìn tí àwọn ènìyàn náà ti jẹun
  alternative: tí ó pọ̀ ju fún àwọn tí wọ́n ti jẹun
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ “ó pọ̀ ju/ó kún àkúnwọ́sílẹ̀ fún àwọn tí wọ́n ti jẹun,” ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé àwọn apá tó ṣẹ́ kù lẹ́yìn oúnjẹ ni a ń sọ. A lo ọ̀rọ̀ Yorùbá tó ṣe kedere nínú ẹsẹ̀, a sì pa ìrísí tààrà mọ́ nínú àlàyé láì fi ẹ̀kọ́ ìsìn kankan kún un.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tí ó níyì, tí ó sì rọrùn láti lóye ni a lò. A fi àmì ohùn sí ọ̀rọ̀ ní kíkún níbi tí ó ti yẹ. “Ìṣù búrẹ́dì” dá ìrísí oúnjẹ náà mọ̀ ju “búrẹ́dì” nìkan lọ, “ọkà bálì” sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lè lóye.
