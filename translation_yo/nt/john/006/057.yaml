id: JHN.6.57
reference: John 6:57
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: yo
  text: Gẹ́gẹ́ bí Baba alààyè ti rán mi, tí èmi sì wà láàyè nítorí Baba,[a] bẹ́ẹ̀ náà ni ẹni tí ń jẹ mí náà yóò wà láàyè nítorí mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Baba ... nípasẹ̀ mi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìdí (“nítorí”) tàbí ọ̀nà/ẹni tí ohun kan fi ṣẹlẹ̀ (“nípasẹ̀”).
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí ... bẹ́ẹ̀ náà ni
  rationale: Ó fi ìfiwéra tí ń darí gbogbo gbólóhùn náà hàn ní Yorùbá àdánidá.
- source_word: ὁ ζῶν πατὴρ
  choice: Baba alààyè
  rationale: Ó túmọ̀ àpèjúwe attributive náà tààrà, ó sì pa ìtẹnumọ́ lórí ìyè mọ́ láìfi ìtumọ̀ ‘olùfúnni ní ìyè’ kún un.
- source_word: ἀπέστειλέν με
  choice: ti rán mi
  rationale: Ìṣe àtijọ́ rírọrùn ni ó bá aorist náà mu, ‘rán mi’ sì jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún fífi ẹni ránṣẹ́.
- source_word: κἀγὼ ζῶ
  choice: tí èmi sì wà láàyè
  rationale: ‘Èmi’ pa ìtẹnumọ́ pronoun mọ́, ‘wà láàyè’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ζῶ.
- source_word: διὰ τὸν πατέρα
  choice: nítorí Baba
  rationale: διά pẹ̀lú accusative lè tọ́ka sí ìdí tàbí ìpìlẹ̀; yíyan ‘nítorí’ pa ìbáramu rẹ̀ pẹ̀lú δι’ ἐμέ mọ́.
- source_word: ὁ τρώγων με
  choice: ẹni tí ó bá ń jẹ mí
  rationale: ‘Ń jẹ mí’ pa àwòrán jíjẹ tí τρώγω ní mọ́, kò sì fipá mú ìtumọ̀ sacramenti tàbí àkàwé nìkan. ‘Ó bá’ fún un ní agbára gbogbogbò tí participle substantival lè ní.
- source_word: κἀκεῖνος
  choice: bẹ́ẹ̀ náà ni ẹni náà
  rationale: Ìṣètò ‘bẹ́ẹ̀ náà ni’ fi agbára ‘ẹni náà pẹ̀lú’ hàn ní Yorùbá láìsọ ọ́ di líle.
- source_word: ζήσει
  choice: yóò wà láàyè
  rationale: Ó pa future mọ́, ó sì bá ‘wà láàyè’ tó ṣáájú mu.
- source_word: δι’ ἐμέ
  choice: nítorí mi
  rationale: Ó pa ìtumọ̀ causal àti ìbáramu Baba–Ọmọ / Ọmọ–onígbàgbọ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìbáṣepọ̀ ìyè Jesu sí Baba nínú διὰ τὸν πατέρα
  choice: ‘Èmi sì wà láàyè nítorí Baba’
  alternative: ‘Èmi sì wà láàyè nípasẹ̀ Baba’
  rationale: Ìtumọ̀ causal ni a fi sínú àkọ́kọ́ láti pa ìbáramu méjèèjì mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí instrumental reading ṣí sílẹ̀. A kò fi ìmọ̀ ẹ̀kọ́ nípa ìrẹ̀lẹ̀ ontological Ọmọ kún ọrọ̀ náà.
- issue: Bóyá ὁ τρώγων με jẹ́ sacramenti tàbí àkàwé tó gbòòrò
  choice: ‘ẹni tí ó bá ń jẹ mí’
  alternative: ‘ẹni tí ó bá ń jẹ ara mi’ tàbí àsọyé tó sọ sacramenti tààrà
  rationale: Ọ̀rọ̀ jíjẹ tó ṣe kedere ni a pa mọ́, ṣùgbọ́n a kò pinnu ariyanjiyan láàárín ìtumọ̀ sacramenti àti ìrẹ́pọ̀ pẹ̀lú Kristi nípasẹ̀ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní. ‘Baba alààyè’ pa ìtẹnumọ́ Johannine lórí ìyè mọ́; ‘ń jẹ mí’ jẹ́ kedere àti àwòrán, láìfi ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ náà.
