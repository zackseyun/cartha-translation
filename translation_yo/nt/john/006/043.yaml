base_translation:
  language: en
  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: yo
  text: Jésù dá wọn lóhùn, ó sì wí fún wọn pé, “Ẹ má ṣe máa kùn láàárín yín.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: dá wọn lóhùn, ó ní
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘ó dáhùn, ó sì sọ’; ‘dá wọn lóhùn, ó ní’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa iṣẹ́ àwọn ọ̀rọ̀ méjèèjì mọ́ láì mú kí gbolohun le.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni àkọtọ̀ orúkọ náà tí ó ti fìdí múlẹ̀ nínú Yorùbá.
- source_word: Μὴ γογγύζετε
  choice: Ẹ má ṣe máa kùn
  rationale: Ìṣe àṣẹ ìsinsìnyí pẹ̀lú μή lè jẹ́ ìfòfin de ìṣe tó ń lọ tàbí ìṣe lápapọ̀. ‘Ẹ má ṣe máa kùn’ pa àìdájú yìí mọ́, ó sì fi ìtumọ̀ ìkùn-ún hàn láì túmọ̀ rẹ̀ sí ẹ̀sùn tàbí àríyànjiyàn.
- source_word: μετ’ ἀλλήλων
  choice: láàárín ara yín
  rationale: Gbólóhùn náà ń tọ́ka sí ìṣe tí àwọn ènìyàn inú ẹgbẹ́ náà ń ṣe láàárín ara wọn; èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ọ̀pọ̀ ènìyàn nínú ‘Ẹ … yín’ láti ṣàfihàn pé Jésù ń bá ẹgbẹ́ náà sọ̀rọ̀.
