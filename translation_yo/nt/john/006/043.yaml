- from: Jésù dá wọn lóhùn, ó ní, “Ẹ má ṣe máa kùn láàárín ara yín.”
  to: Jésù dá wọn lóhùn, ó sì wí fún wọn pé, “Ẹ má ṣe máa kùn láàárín yín.”
  rationale: The revision retains every element of the Greek while using a conventional Yoruba narrative formula for “answered and said to them” and a more idiomatic expression for mutual grumbling. No footnote is needed because the translation does not require a lexical or textual clarification here.
