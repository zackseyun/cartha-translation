    rationale: Nínú Yorùbá, ‘tẹ́ ẹni lọ́rùn’ sábà túmọ̀ sí láti múnú ẹni dùn tàbí láti wù ẹni, kì í ṣe pé ebi ẹni dá lẹ́yìn jíjẹ. Èyí lè yí ìtumọ̀ ἐχορτάσθητε—jíjẹ dé ìkúnrẹ́rẹ́—padà.
