  source_fidelity: 'Ìtumọ̀ ẹsẹ̀ náà bá Gíríìkì SBLGNT mu dáadáa: ó pa ìdáhùn Jésù, ìtẹnumọ́ Ἀμὴν ἀμὴν, ìdí tí wọ́n fi ń wá a, ‘àwọn àmì,’ ìtumọ̀ apákan ἐκ τῶν ἄρτων, àti ìkúnrẹ́rẹ́ ἐχορτάσθητε mọ́. Ọ̀rọ̀ ‘ẹ sì yó’ jẹ́ ìtumọ̀ tó péye fún ἐχορτάσθητε.'
  naturalness: Ọ̀rọ̀ àkọ́kọ́ náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti ka. ‘Àwọn ìṣù búrẹ́dì’ bójú mu fún àwọn búrẹ́dì púpọ̀ nínú àyíká yìí, ‘láti inú/lára’ sì ń fi èrò jíjẹ apá nínú wọn hàn. Ṣùgbọ́n ‘ẹ tẹ́ yín lọ́rùn’ nínú àlàyé ìsàlẹ̀ kì í ṣe ọ̀nà àdánidá láti sọ pé ẹni yó nítorí oúnjẹ; ó sábà ń tọ́ka sí ìfẹ́ tàbí ìtẹ́lọ́rùn ẹ̀dùn.
  terminology: ‘Àwọn àmì’ yẹ fún σημεῖα nínú Jòhánù, láìdín un kù sí ‘iṣẹ́ ìyanu’ nìkan. ‘Ẹ yó’ pa ìtumọ̀ jíjẹ dé ìkúnrẹ́rẹ́ mọ́. A tún ọ̀rọ̀ ìsàlẹ̀ ṣe kí ó má baà fi ‘tẹ́ ẹni lọ́rùn’ hàn gẹ́gẹ́ bí yíyàn ìtumọ̀ fún ἐχορτάσθητε.
  issues:
