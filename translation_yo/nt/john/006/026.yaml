id: JHN.6.26
reference: John 6:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: yo
  text: Jésù dá wọn lóhùn pé, “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹ̀ ń wá mi, kì í ṣe nítorí pé ẹ rí àwọn àmì, bí kò ṣe nítorí pé ẹ jẹ lára àwọn ìṣù búrẹ́dì náà, ẹ sì yó.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá ìkẹyìn náà pé, “nítorí pé ẹ jẹ búrẹ́dì náà, ẹ sì kún fún oúnjẹ.” Ní tààràtà, èdè Gíríìkì ní “ẹ jẹ lára àwọn ìṣù búrẹ́dì,” ó sì lo ọ̀rọ̀ kan tó túmọ̀ sí “ẹ yó” tàbí “ẹ kún fún oúnjẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Jésù dá wọn lóhùn pé
  rationale: Èyí sọ àpapọ̀ ọ̀rọ̀ ìṣáájú Gíríìkì náà, ‘dáhùn, ó sì wí,’ ní Yorùbá àdánidá láìsọ ìṣe ọ̀rọ̀ náà nù.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́, lóòótọ́ ni mo wí fún yín
  rationale: Ó pa ìtẹnumọ́ méjì ti Jòhánù àti ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ náà mọ́; ‘mo wí fún yín’ bá ọ̀nà ọ̀rọ̀ ọlọ́lá mu.
- source_word: ζητεῖτέ με
  choice: ẹ̀ ń wá mi
  rationale: Àmì àsìkò ‘ń’ fi hàn pé ìwá wọn ń lọ lọ́wọ́, gẹ́gẹ́ bí present tense Gíríìkì.
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: ‘Àmì’ pa èrò Jòhánù mọ́ pé iṣẹ́ náà ń tọ́ka sí ohun tó ju iṣẹ́ ìyanu fúnra rẹ̀ lọ; ‘iṣẹ́ ìyanu’ nìkan lè sọ ìtumọ̀ náà di kékeré.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: ẹ jẹ lára àwọn ìṣù búrẹ́dì náà
  rationale: ‘Lára’ fi agbára partitive ἐκ hàn, ‘àwọn ìṣù búrẹ́dì’ sì pa plural ἄρτων àti ìtọ́kasí sí àwọn ìṣù tí a ti pín mọ́.
- source_word: ἐχορτάσθητε
  choice: ẹ sì yó
  rationale: ‘Yó’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún jíjẹ títí dé ìkúnrẹ́rẹ́; ó lè túmọ̀ sí pé ebi wọn dá tàbí pé wọ́n kún fún oúnjẹ láìfi àlàyé míì kún un.
theological_decisions:
- issue: Ìtumọ̀ σημεῖα nínú Jòhánù
  choice: àwọn àmì
  alternative: àwọn iṣẹ́ ìyanu; àwọn àmì iṣẹ́ ìyanu
  rationale: ‘Àwọn àmì’ pa ipa ìṣípayá àwọn iṣẹ́ Jésù mọ́, láìfi àlàyé onítumọ̀ sínú ẹsẹ̀ náà.
- issue: Ìdí tí ogunlọ́gọ̀ fi ń wá Jésù
  choice: kì í ṣe nítorí pé ẹ rí àwọn àmì, bí kò ṣe nítorí pé...
  alternative: kì í ṣe pé ẹ rí àwọn àmì, ṣùgbọ́n pé...
  rationale: Ìtumọ̀ ‘nítorí’ mú ìyàtọ̀ ìdí tàbí ìwúrí inú οὐχ ὅτι ... ἀλλ’ ὅτι ṣe kedere, láìsọ pé wọn kò rí iṣẹlẹ̀ náà rárá.
- issue: Ìkúnrẹ́rẹ́ nínú ἐχορτάσθητε
  choice: ẹ sì yó
  alternative: ẹ sì jẹ́ títí ẹ fi kún; ebi yín sì dá
  rationale: ‘Ẹ sì yó’ pa àfojúsùn sí ìkúnrẹ́rẹ́ oúnjẹ mọ́, ó sì yẹra fún fífi ìtumọ̀ tẹ̀mí tí kò sí ní kedere sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘búrẹ́dì’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ‘àwọn ìṣù’ sì mú plural àti àyíká ìpín oúnjẹ hàn. Gbogbo àmì ohùn ni a fi sí ibi tó bá yẹ.
