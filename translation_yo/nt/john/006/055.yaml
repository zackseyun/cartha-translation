id: JHN.6.55
reference: John 6:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: yo
  text: Nítorí ẹran ara mi jẹ́ oúnjẹ tòótọ́[a], ẹ̀jẹ̀ mi sì jẹ́ ohun mímu tòótọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oúnjẹ gidi,” àti “ohun mímu gidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ γάρ ní Yorùbá.
- source_word: σάρξ
  choice: ẹran ara
  rationale: ‘Ẹran ara’ fi ìtumọ̀ gidi σάρξ hàn, ó sì pa ìfara-ẹni-kọra rẹ̀ mọ́ pẹ̀lú ‘ẹ̀jẹ̀,’ láì túmọ̀ ọ́ sí ‘ara’ nìkan.
- source_word: ἀληθής
  choice: tòótọ́
  rationale: ‘Tòótọ́’ pa agbára ọ̀rọ̀ Gíríìkì àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́; a kò fi ‘gidi’ dá àríyànjiyàn ìtumọ̀ rẹ̀ parí.
- source_word: βρῶσις
  choice: oúnjẹ
  rationale: Nínú gbólóhùn àsọyé yìí àti ní ìbámu pẹ̀lú πόσις, ọ̀rọ̀ náà ń tọ́ka sí ohun tí a ń jẹ, kì í ṣe ìṣe jíjẹ.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Ìtumọ̀ tààrà ni, ó sì pa ìfara-ẹni-kọra ‘ẹran ara àti ẹ̀jẹ̀’ mọ́.
- source_word: πόσις
  choice: ohun mímu
  rationale: ‘Ohun mímu’ jẹ́ alábàákẹ́gbẹ́ àdánidá fún ‘oúnjẹ’ ní Yorùbá, ó sì ń tọ́ka sí ohun tí a ń mu dípò ìṣe mímu.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ἀληθής sí ‘tòótọ́’ tàbí sí ‘gidi’ nínú ọ̀rọ̀ tí ó kan Oúnjẹ Alẹ́ Olúwa
  choice: tòótọ́
  alternative: gidi
  rationale: ‘Tòótọ́’ sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́ láìfi ìtumọ̀ ẹ̀sìn kan lé e lórí.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹran ara’ fún σάρξ láti yẹra fún lílo ‘ara’ ní ọ̀nà tí ó lè sọ ìfara-ẹni-kọra pẹ̀lú ẹ̀jẹ̀ di aláìlágbára; a lo ‘ohun mímu’ dípò ‘mímu’ láti fi ohun tí a ń mu hàn kedere.
