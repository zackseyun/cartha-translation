source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: yo
  text: Àwọn baba wa jẹ mánà ní aginjù[b], gẹ́gẹ́ bí a ti kọ ọ́ pé, “Ó fún wọn ní búrẹ́dì láti ọ̀run kí wọ́n lè jẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Ní aginjù” tún lè túmọ̀ sí “ní aṣálẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Àwọn baba wa
  rationale: Èyí pa ìtumọ̀ gangan ‘àwọn baba wa’ mọ́, ó sì bá ọ̀nà tí àwọn olùsọ̀rọ̀ ń tọ́ka sí àwọn baba ńlá Ísírẹ́lì mu. ‘Àwọn baba ńlá wa’ tún ṣeé ṣe, ṣùgbọ́n ó tú ìtumọ̀ náà síwájú díẹ̀.
- source_word: τὸ μάννα
  choice: mánà
  rationale: ‘Mánà’ ni ọ̀rọ̀ àyálò tí a mọ̀ fún oúnjẹ tí Ọlọ́run pèsè ní aginjù.
- source_word: ἔφαγον
  choice: jẹ
  rationale: Ọ̀rọ̀ náà jẹ́ ìṣe tó rọrùn ní àkókò tí ó ti kọjá; ‘jẹ’ ni ìtumọ̀ Yorùbá àdánidá rẹ̀.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ilẹ̀ aṣálẹ̀ tàbí wilderness, ó sì bá àyíká ìtàn Ìjádelọ mu.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ọ̀rọ̀ Ìwé Mímọ́ tí a kọ sílẹ̀ hàn.
- source_word: Ἄρτον
  choice: oúnjẹ
  rationale: Nínú àyíká yìí, ἄρτος lè tọ́ka sí búrẹ́dì tàbí oúnjẹ ní gbogbogbòò. ‘Oúnjẹ’ jẹ́ mímọ̀ fún òǹkàwé Yorùbá, ó sì yẹra fún fífi àwòrán búrẹ́dì òde òní lé mánà lórí.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Èyí pa ìtumọ̀ orísun ọ̀run àti ìró ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: Ó fún wọn ... láti jẹ
  rationale: Èyí tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì ní ti fífún wọn ní ohun kan láti jẹ, ó sì jẹ́ Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Bí a ṣe máa tú ọ̀rọ̀ àyọlò nípa mánà láìfi ìtumọ̀ Kristẹni tí Jòhánù ṣàlàyé lẹ́yìn náà sínú ẹnu àwọn ènìyàn
  choice: A tú un gẹ́gẹ́ bí ẹ̀rí ìtàn àti Ìwé Mímọ́ pé Ọlọ́run fún wọn ní oúnjẹ láti ọ̀run, láìfi àlàyé míì kún un.
  alternative: Lo lẹ́tà ńlá tàbí ọ̀rọ̀ ìtumọ̀ tó ti ń tọ́ka sí Jésù gẹ́gẹ́ bí Oúnjẹ tòótọ́.
  rationale: Ní àyíká ẹsẹ yìí, àwọn olùsọ̀rọ̀ ń tọ́ka sí mánà aginjù. Ó yẹ kí ìtumọ̀ Kristẹni tó jinlẹ̀ sí i farahàn bí ìtàn náà ṣe ń lọ, kì í ṣe kí a fi í sínú ọ̀rọ̀ wọn níbí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì àlàyé [b] wà lẹ́gbẹ̀ẹ́ ‘aginjù’; [a] wà lẹ́yìn àyọlò nítorí ó ṣàlàyé ‘oúnjẹ/búrẹ́dì.’
