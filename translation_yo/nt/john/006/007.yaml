source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: yo
  text: Fílípì dá a lóhùn pé, “Búrẹ́dì tí a lè fi igba dínárì rà kò tó fún wọn, kí olúkúlùkù wọn lè gba díẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων
  choice: tí igba owó dínárì lè rà
  rationale: Gbolohun náà ń tọ́ka sí iye owó tí búrẹ́dì náà jẹ́; fífi ‘dínárì’ sílẹ̀ pa ẹ̀yà owó ìgbà náà mọ́, nígbà tí ìṣètò Yorùbá mú ìtumọ̀ iye-rírà náà hàn gbangba.
- source_word: ἄρτοι
  choice: Búrẹ́dì
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn ìṣù búrẹ́dì tàbí búrẹ́dì gẹ́gẹ́ bí oúnjẹ; ‘búrẹ́dì’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó yé gbogbo ènìyàn.
- source_word: οὐκ ἀρκοῦσιν
  choice: kò tó
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún àìtó iye ohun kan.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: kí olúkúlùkù wọn tilẹ̀ lè rí ìwọ̀nba díẹ̀ gbà
  rationale: ‘Kí ... lè’ pa ìbáṣepọ̀ ἵνα mọ́; ‘tilẹ̀’ mú ìrònú pé kódà ìpín kékeré kò ní tó hàn, ‘ìwọ̀nba díẹ̀’ sì ṣàfihàn βραχύ τι láì sọ iye pàtó.
theological_decisions:
- issue: Ìbáṣepọ̀ gírámà ἵνα pẹ̀lú àìtó búrẹ́dì
  choice: kí olúkúlùkù wọn tilẹ̀ lè rí ìwọ̀nba díẹ̀ gbà
  alternative: tó bẹ́ẹ̀ tí olúkúlùkù wọn yóò fi rí díẹ̀ gbà
  rationale: Ìtumọ̀ yìí pa àfojúsùn/àbájáde tí ἵνα lè sọ mọ́ láì fi ẹ̀kọ́ ìsìn kún un; ‘tilẹ̀’ jẹ́ kí ọ̀rọ̀ Fílípì nípa àìtó náà ṣe kedere.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé. A pa ‘dínárì’ mọ́ gẹ́gẹ́ bí owó ìtàn dípò yíyí i sí owó òde òní.
