review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì mọ́: ìsopọ̀ οὖν, ìtẹnumọ́ Ἀμὴν ἀμὴν, jíjẹ “ẹran ara,” mímu “ẹ̀jẹ̀,” àti “ìyè” láì fi “àìnípẹ̀kun” kún un. Ṣùgbọ́n “nínú ara yín” yí ἐν ἑαυτοῖς sí ìtumọ̀ ‘nínú àwọn ara yín,’ níbi tí Gíríìkì ti túmọ̀ sí ‘nínú yín fúnra yín’/‘nínú yín.’'
  naturalness: “Bí ẹ kò bá jẹ ... kí ẹ sì mu ...” kò bá ìṣọ̀kan gbolóhùn ipò Yorùbá mu dáadáa, nítorí “kí” ń sọ ìfẹ́ tàbí àṣẹ lẹ́yìn gbolóhùn ipò. Lílo “tí ẹ kò sì mu” jẹ́ àdánidá, ó sì mú kí àwọn iṣẹ́ méjèèjì wà lábẹ́ ìpò kan náà.
  terminology: “Ẹran ara,” “Ọmọ Ènìyàn,” “ẹ̀jẹ̀,” àti “ìyè” yẹ, wọ́n sì pa ọ̀rọ̀ náà mọ́ láì yan ìtumọ̀ ẹ̀kọ́ ìjọ kan. A gbọdọ̀ jẹ́ kí “nínú yín” má ṣe túmọ̀ ἑαυτοῖς sí ara ti ara ẹni.
  issues:
  - severity: medium
    issue: “nínú ara yín” fún ἐν ἑαυτοῖς
    rationale: “Ara yín” sábà ń tọ́ka sí body/bodies ní Yorùbá. Ọ̀rọ̀ Gíríìkì náà jẹ́ aṣojú-ara ẹni ọ̀pọ̀, ó túmọ̀ sí ‘nínú yín fúnra yín,’ kì í ṣe pàtó ‘nínú ara yín.’
  - severity: low
    issue: 'Ìṣọ̀kan gbolóhùn ipò: “bí ẹ kò bá jẹ ... kí ẹ sì mu”'
    rationale: Lẹ́yìn “bí ẹ kò bá,” “tí ẹ kò sì mu” so iṣẹ́ kejì mọ́ ipò náà ní ọ̀nà Yorùbá tí ó rọrùn, tí ó sì ṣàfihàn ἐὰν μὴ ... καὶ ... dáadáa.
