- from: 'Nítorí náà, Jésù sọ fún wọn pé, “Lóòótọ́, lóòótọ́ ni mo sọ fún yín: bí ẹ kò bá jẹ ẹran ara[a] Ọmọ Ènìyàn, kí ẹ sì mu ẹ̀jẹ̀ rẹ̀, ẹ kò ní ìyè[b] nínú ara yín.”'
  to: 'Nítorí náà, Jésù sọ fún wọn pé, “Lóòótọ́, lóòótọ́ ni mo sọ fún yín: bí ẹ kò bá jẹ ẹran ara[a] Ọmọ Ènìyàn, tí ẹ kò sì mu ẹ̀jẹ̀ rẹ̀, ẹ kò ní ìyè[b] nínú yín.”'
