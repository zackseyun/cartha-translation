id: JHN.6.53
reference: John 6:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: yo
  text: 'Nítorí náà, Jésù sọ fún wọn pé, “Lóòótọ́, lóòótọ́ ni mo sọ fún yín: bí ẹ kò bá jẹ ẹran ara[a] Ọmọ Ènìyàn, tí ẹ kò sì mu ẹ̀jẹ̀ rẹ̀, ẹ kò ní ìyè[b] nínú yín.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé “ara”; ṣùgbọ́n èdè Gíríìkì lo σάρξ, ìyẹn “ẹran ara,” èyí tí ó pa agbára gidi ọ̀rọ̀ náà mọ́.
    reason: lexical_alternative
  - marker: b
    text: Ẹsẹ yìí sọ “ìyè” nìkan, kì í ṣe “ìyè àìnípẹ̀kun,” bí ó tilẹ̀ jẹ́ pé àyíká Ìhìn Rere Jòhánù sábà máa ń so ìyè yìí pọ̀ mọ́ ìyè àìnípẹ̀kun.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí tẹ̀ lé, ó sì jáde láti inú ohun tí a ṣẹ̀ṣẹ̀ sọ; ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti so àwọn ọ̀rọ̀ náà pọ̀.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Àtúnwí náà pa agbára àti ìtẹnumọ́ ọ̀rọ̀ Jésù mọ́, ní èdè Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: ἐὰν μὴ
  choice: bí ẹ kò bá
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ipò tí kò bá ṣẹlẹ̀, tí ó bá ìtumọ̀ ‘unless’ mu.
- source_word: φάγητε
  choice: jẹ
  rationale: Ó pa ìtumọ̀ gidi ti jíjẹ mọ́, láì yí ọ̀rọ̀ náà sí àlàyé ẹ̀sìn kan pàtó.
- source_word: σάρκα
  choice: ẹran ara
  rationale: Ó pa àwòrán gidi, líle ti ‘flesh’ mọ́ ju ‘ara’ nìkan lọ, kò sì sọ ọ́ di ọ̀rọ̀ sacramenti ní tààràtà.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí pa orúkọ ìdánimọ̀ tí Jésù máa ń lò fún ara rẹ̀ mọ́, pẹ̀lú ìró àsọtẹ́lẹ̀ àti ti Mèsáyà inú rẹ̀.
- source_word: πίητε
  choice: mu
  rationale: Ìtumọ̀ tààrà ni, ó sì pa ìfarakanra rẹ̀ pẹ̀lú ‘jẹ’ mọ́.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Ó pa àwòrán líle àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà mọ́.
- source_word: ζωὴν
  choice: ìyè
  rationale: Èdè Gíríìkì sọ ‘ìyè’ nìkan, kì í ṣe ‘ìyè àìnípẹ̀kun’; nítorí náà a kò fi ọ̀rọ̀ tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἐν ἑαυτοῖς
  choice: nínú ara yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ohun tí ó wà ‘nínú yín fúnra yín,’ ó sì pa èrò pé wọn kò ní ìyè náà mọ́.
theological_decisions:
- issue: Bóyá kí a túmọ̀ jíjẹ ẹran ara àti mímu ẹ̀jẹ̀ ní tààràtà tàbí kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí àpẹẹrẹ tàbí sacramenti
  choice: 'A pa ọ̀rọ̀ gidi náà mọ́: “jẹ ẹran ara ... mu ẹ̀jẹ̀ rẹ̀.”'
  alternative: A lè sọ ọ́ ní ọ̀nà ìtumọ̀ bí “gba á” tàbí “ní ìpín nínú rẹ̀,” tàbí lo “ara” ní ọ̀nà tí ó lè tọ́ka sí Oúnjẹ Alẹ́ Olúwa.
  rationale: Ọ̀rọ̀ orísun náà mọ̀ọ́mọ̀ lágbára, ó sì lè fa ìbéèrè. Ìtumọ̀ yìí kò pinnu bóyá sacramenti, àpẹẹrẹ, tàbí àwọn méjèèjì ni ó ń tọ́ka sí.
- issue: Bóyá kí a mú ζωὴν gbòòrò sí “ìyè àìnípẹ̀kun” nítorí àyíká Ìhìn Rere Jòhánù
  choice: A lo “ìyè” nìkan nínú ọ̀rọ̀ pàtàkì.
  alternative: “ìyè àìnípẹ̀kun”
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká Jòhánù sábà máa ń so ìyè yìí pọ̀ mọ́ ìyè àìnípẹ̀kun, ajẹtífù αἰώνιος kò sí nínú ẹsẹ yìí; a kò gbọdọ̀ fi í kún un.
translation_notes:
  register: A lo Yorùbá àfọwọ́kọ tí ó bójú mu, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí ó yẹ. A pa ìtẹnumọ́ “Lóòótọ́, lóòótọ́” àti àwòrán líle ti jíjẹ ẹran ara àti mímu ẹ̀jẹ̀ mọ́, láì fi ẹ̀kọ́ ẹgbẹ́ ìsìn kan kún un.
