  text: οἱ πατέρες ὑμῶν ἔφαγον ⸂ἐν τῇ ἐρήμῳ τὸ μάννα⸃ καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: yo
  text: Àwọn baba ńlá yín jẹ mánà ní aginjù, wọ́n sì kú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Àwọn baba ńlá yín
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘àwọn baba yín,’ ṣùgbọ́n nínú Yorùbá, ‘àwọn baba ńlá yín’ fi ìtumọ̀ àwọn baba ìran Ísírẹ́lì hàn lọ́nà àdánidá, láì sọ ọ́ di ọ̀rọ̀ tí kò tọ́ka sí akọ.
- source_word: ἔφαγον
  choice: jẹ
  rationale: Ó jẹ́ ọ̀rọ̀ ìṣe tí ó ṣẹlẹ̀ ní àkókò tí ó ti kọjá; ‘jẹ’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi aṣálẹ̀ tí ìtàn ìjádelọ Ísírẹ́lì ń tọ́ka sí.
- source_word: τὸ μάννα
  choice: mánà
  rationale: ‘Mánà’ ni orúkọ tí a mọ̀ sí oúnjẹ láti ọ̀run nínú ìtàn aginjù; Yorùbá kò nílò ohun ìṣáájú tí yóò dúró fún àtíkù Gíríìkì níbí.
- source_word: ἀπέθανον
  choice: wọ́n sì kú
  rationale: Ìtumọ̀ yìí pa olùṣe mọ́ ní kedere, ó sì fi καί hàn pẹ̀lú ‘sì,’ nígbà tí ó ń sọ ikú gidi wọn.
theological_decisions:
- issue: Ìtọ́kasí sí ìran Ísírẹ́lì ní aginjù
  choice: Àwọn baba ńlá yín
  alternative: Àwọn baba yín
  rationale: ‘Àwọn baba ńlá yín’ jẹ́ àdánidá nínú Yorùbá fún àwọn baba ìran, ó sì pa agbára ìtọ́kasí akọ àti ìbátan àwọn olùgbọ́ Jésù mọ́, láì fi àlàyé ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà rọrùn, lọwọ́lọwọ́, ó sì ní iyì. Kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí ‘àwọn baba ńlá yín’ ti sọ ìtumọ̀ ancestral fathers di mímọ́ lọ́nà àdánidá.
