id: JHN.6.61
reference: John 6:61
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: yo
  text: Ṣùgbọ́n Jésù mọ̀ nínú ara rẹ̀ pé àwọn ọmọ-ẹ̀yìn rẹ̀ ń kùn nípa èyí, ó sì sọ fún wọn pé, “Ṣé èyí mú yín kọsẹ̀ bí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé èyí kàn yín lára bí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: mọ̀
  rationale: Ó jẹ́ àbájáde ọ̀rọ̀-ìṣe tí ó ń tọ́ka sí ìmọ̀ Jésù ní àkókò náà; ‘mọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá gírámà mu.
- source_word: ἐν ἑαυτῷ
  choice: nínú ara rẹ̀
  rationale: Gbólóhùn yìí fi hàn pé Jésù mọ ohun náà láti inú ara rẹ̀, kì í ṣe nítorí pé ẹnì kan ròyìn rẹ̀ fún un.
- source_word: γογγύζουσιν
  choice: ń kùn
  rationale: ‘Ń kùn’ túmọ̀ sí sísọ̀rọ̀ ìbànújẹ́ tàbí àtakò ní ohùn kékeré, ó sì yẹ fún ìtumọ̀ ọ̀rọ̀ Gíríìkì yìí ju ‘ń ráhùn’ lọ.
- source_word: περὶ τούτου
  choice: nípa èyí
  rationale: Ìtumọ̀ kúkúrú yìí tọ́ka sí ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, ó sì jẹ́ kí ọ̀rọ̀ náà lè tọ́ka sí gbogbo ẹgbẹ́ ọmọ-ẹ̀yìn tó wà níbẹ̀, kì í ṣe àwọn méjìlá nìkan.
- source_word: Τοῦτο
  choice: èyí
  rationale: A pa ọ̀rọ̀ atọ́ka náà mọ́ ní kúkúrú bí ó ti rí nínú Gíríìkì, láìfi ‘ẹ̀kọ́’ tàbí orúkọ mìíràn kún un.
- source_word: σκανδαλίζει
  choice: mú yín kọsẹ̀
  rationale: 'Àwòrán ‘kọsẹ̀’ pa ìtumọ̀ tó lágbára mọ́: ọ̀rọ̀ náà lè máa sọ nípa ohun tó kàn wọ́n lára, tàbí ohun tó lè mú wọn ṣubú kúrò nínú ìgbàgbọ́.'
theological_decisions:
- issue: Ìtumọ̀ σκανδαλίζει ní àyíká tí àwọn ọmọ-ẹ̀yìn lè kọ ẹ̀kọ́ Jésù sílẹ̀
  choice: Ṣé èyí mú yín kọsẹ̀ bí?
  alternative: Ṣé èyí kàn yín lára bí?
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ohun tó mú ìbínú tàbí ìkọ̀sílẹ̀ wá, ó sì tún lè túmọ̀ sí ohun tó mú ènìyàn ṣubú tàbí yí padà kúrò lẹ́yìn Jésù. ‘Mú yín kọsẹ̀’ pa àwòrán àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn.
translation_notes:
  register: Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ń kùn’ jẹ́ ọ̀rọ̀ àdánidá fún ẹ̀dùn tí a ń sọ ní ìkọ̀kọ̀; ‘mú yín kọsẹ̀’ pa àwòrán Gíríìkì àti àìdánilójú rẹ̀ mọ́. Àmì ìbéèrè àti àmì ìsàlẹ̀ [a] wà níbi tó yẹ.
