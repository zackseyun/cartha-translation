  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν ἐν συναγωγῇ διδάσκων ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: yo
  text: Ó sọ àwọn nǹkan wọ̀nyí nígbà tí ó ń kọ́ni nínú sínágọ́gù ní Kápánáúmù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ aláìlẹ́mìí náà ń tọ́ka sí gbogbo ọ̀rọ̀ tí ó ṣáájú; ìtumọ̀ yìí pa ìṣe ọ̀pọ̀ rẹ̀ mọ́.
- source_word: εἶπεν
  choice: Ó sọ
  rationale: Aorist ti λέγω túmọ̀ tààrà sí ‘sọ’; kókó ọ̀rọ̀ náà kò fara hàn nínú Gíríìkì, ṣùgbọ́n àyíká fi hàn pé Jésù ni.
- source_word: ἐν συναγωγῇ
  choice: nínú sínágọ́gù
  rationale: Bí ó tilẹ̀ jẹ́ pé àpilẹ̀kọ kò sí nínú Gíríìkì, gbólóhùn ibi yìí lè tọ́ka sí sínágọ́gù pàtó tí ó wà ní Kápánáúmù; Yorùbá kò nílò àpilẹ̀kọ pàtó.
- source_word: διδάσκων
  choice: nígbà tí ó ń kọ́ni
  rationale: Participle ìsinsìnyí fi ìṣe tí ń lọ lọ́wọ́ ní àkókò tí ó ń sọ̀rọ̀ hàn; ‘nígbà tí ó ń kọ́ni’ mú ìbáṣepọ̀ àkókò náà ṣe kedere.
- source_word: ἐν Καφαρναούμ
  choice: ní Kápánáúmù
  rationale: A ṣe orúkọ ibi náà ní àtúnkọ sí ìró Yorùbá, a sì lo ‘ní’ fún ibi.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ àtúnkọ tí a mọ̀ fún ilé ìjọsìn àwọn Júù.
