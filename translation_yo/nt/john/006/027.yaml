id: JHN.6.27
reference: John 6:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: yo
  text: Ẹ má ṣe ṣiṣẹ́ fún oúnjẹ tí ń ṣègbé[a], ṣùgbọ́n ẹ ṣiṣẹ́ fún oúnjẹ tí ó wà títí dé ìyè àìnípẹ̀kun, èyí tí Ọmọ Ènìyàn yóò fún yín; nítorí Ọlọ́run Baba ti fi èdìdì rẹ̀ sí i[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oúnjẹ tí ń bàjẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ti fi èdìdì sí i”; ọ̀rọ̀ yìí lè fi fífún un ní àṣẹ tàbí jíjẹ́rìí sí i hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: Ẹ má ṣe ṣiṣẹ́ fún ... ṣùgbọ́n ẹ ṣiṣẹ́ fún
  rationale: Ó pa agbára àṣẹ àti ìtakora Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọ̀pọ̀ ẹni.
- source_word: βρῶσιν
  choice: oúnjẹ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí a ń jẹ, kì í ṣe ìṣe jíjẹ.
- source_word: ἀπολλυμένην
  choice: tí ń ṣègbé
  rationale: Ó fi hàn pé oúnjẹ náà lè bàjẹ́ tàbí kọjá lọ, láì dín ìtumọ̀ rẹ̀ kù sí jíjẹrà nìkan.
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: tí ó dúró dé ìyè àìnípẹ̀kun
  rationale: “Dúró” pa ìtakora mọ́ pẹ̀lú ohun tí ń ṣègbé; “dé” sì fi ìtọ́sọ́nà tàbí àbájáde εἰς hàn láì túmọ̀ rẹ̀ kọjá ohun tí ọ̀rọ̀ náà sọ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ àkọlé náà ní tààràtà, ó sì pa ìró ìwé Dáníẹ́lì àti ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ rẹ̀ mọ́.
- source_word: ὑμῖν δώσει
  choice: yóò fi fún yín
  rationale: Ó túmọ̀ ọ̀rọ̀ ọjọ́ iwájú àti ẹni tí a ó fún ní ohun náà ní Yorùbá àdánidá.
- source_word: ἐσφράγισεν
  choice: ti fi èdìdì rẹ̀ sí i
  rationale: Ó pa àwòrán èdìdì inú Gíríìkì mọ́, èyí tí ó lè fi àṣẹ, ìfọwọ́sí, tàbí ìjẹ́rìí hàn.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Ọlọ́run Baba
  rationale: Ó sọ ìdánimọ̀ apposition Gíríìkì ní Yorùbá tí ó wọ́pọ̀, láì fi àlàyé ẹ̀kọ́ mìíràn kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ μένουσαν εἰς ζωὴν αἰώνιον
  choice: oúnjẹ tí ó dúró dé ìyè àìnípẹ̀kun
  alternative: oúnjẹ tí ó dúró fún ìyè àìnípẹ̀kun
  rationale: “Dé” fi ìtumọ̀ ibi-afẹ́ tàbí àbájáde εἰς hàn, ṣùgbọ́n ó yàgò fún pípa ìtumọ̀ náà mọ́ “èyí tí ń mú ìyè wá” nìkan.
- issue: Ìtumọ̀ èdìdì tí Baba fi sí Ọmọ Ènìyàn
  choice: Ọlọ́run Baba ti fi èdìdì rẹ̀ sí i
  alternative: Ọlọ́run Baba ti fọwọ́ sí i
  rationale: A pa àpèjúwe èdìdì náà mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé sọ pé ó lè túmọ̀ sí fífún ní àṣẹ tàbí jíjẹ́rìí sí i.
- issue: Ìdánimọ̀ ὁ πατὴρ ... ὁ θεός
  choice: Ọlọ́run Baba
  alternative: Baba náà, Ọlọ́run
  rationale: Àṣàyàn náà jẹ́ Yorùbá àdánidá, ó sì pa ìdánimọ̀ Baba gẹ́gẹ́ bí Ọlọ́run tí gbolohun Gíríìkì sọ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. Àṣẹ ọ̀pọ̀ ẹni “Ẹ” bá àpẹẹrẹ ὑμεῖς mu. A lo “ìyè àìnípẹ̀kun” fún ζωὴ αἰώνιος àti “Ọmọ Ènìyàn” gẹ́gẹ́ bí àkọlé tí a mọ̀ dáadáa. Àmì ìsàlẹ̀ ojú ìwé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
