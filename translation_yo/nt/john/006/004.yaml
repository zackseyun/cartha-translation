source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: yo
  text: Àjọ Ìrékọjá[a], ìyẹn àjọ àwọn Júù, ti sún mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àjọ àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn Júù lápapọ̀ tàbí àwọn ará Jùdíà ní pàtó, ní ìbámu pẹ̀lú àyíká.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó ń tẹ ìtàn síwájú; “sì” bá èdè Yorùbá mu láì sọ ọ́ di ìtakora líle tàbí fi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐγγὺς
  choice: ti sún mọ́lé
  rationale: Pẹ̀lú ἦν, ọ̀rọ̀ yìí fi hàn pé àkókò àjọ náà ti sún mọ́; “ti sún mọ́lé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìsúnmọ́ àkókò.
- source_word: πάσχα
  choice: Àjọ Ìrékọjá
  rationale: πάσχα ń tọ́ka sí àjọ Pásíọ́fà àwọn ọmọ Ísírẹ́lì; “Ìrékọjá” ń pa ìtumọ̀ orúkọ náà mọ́, “Àjọ” sì mú kí irú ohun tí a ń tọ́ka sí ṣe kedere.
- source_word: ἑορτὴ
  choice: àjọ
  rationale: ἑορτή túmọ̀ sí àjọ ayẹyẹ ẹ̀sìn; “àjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì yẹ fún àyíká yìí.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú àyíká yìí, Ἰουδαίων ń tọ́ka sí àwọn Júù lápapọ̀ gẹ́gẹ́ bí àwọn tí Àjọ Ìrékọjá jẹ́ tiwọn; ó tún lè túmọ̀ sí àwọn ará Jùdíà ní àwọn àyíká mìíràn, nítorí náà a tọ́ka sí yíyàn kejì nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú ìtàn Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Níhìn-ín, Àjọ Ìrékọjá jẹ́ àjọ ẹ̀sìn gbogbo àwọn Júù, kì í ṣe àjọ agbègbè Jùdíà nìkan. Síbẹ̀, nítorí pé ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ méjèèjì ní ìbámu pẹ̀lú àyíká, àlàyé ìsàlẹ̀ pa yíyàn kejì mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ìṣọ̀kan apposition inú Gíríìkì mọ́.
