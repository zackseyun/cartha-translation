review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the twofold οὖν, the emphatic pronouns, σημεῖον as “àmì,” and πιστεύω with σοι as “gbà ọ́ gbọ́.” However, the Greek present-tense challenges ποιεῖς and ἐργάζῃ are better represented by Yoruba progressive forms than by the future “yóò ṣe.”
  naturalness: “Àmì wo ni ìwọ ń ṣe?” and “Iṣẹ́ wo ni ìwọ ń ṣiṣẹ́?” are natural Standard Yoruba questions and preserve the pointed, ongoing challenge. The latter also better distinguishes ἐργάζῃ (“work”) from the preceding ποιεῖς (“do”).
  terminology: “Àmì” appropriately retains Johannine sign language without interpretively adding “ìyanu.” “Gbà ọ́ gbọ́” naturally conveys believing a person/claim and avoids importing the distinct Johannine construction “gbàgbọ́ nínú rẹ.” The footnote is adjusted for clear Yoruba and accurate grammatical description.
  issues:
  - severity: medium
    issue: Future tense in both questions
    rationale: The draft renders the present indicatives ποιεῖς and ἐργάζῃ with “yóò ṣe” (“will do”). The immediate Greek challenge asks what sign/work Jesus is doing, so progressive Yoruba is a safer equivalent.
  - severity: low
    issue: Second question does not express the work nuance distinctly
    rationale: “Iṣẹ́ wo ni ìwọ yóò ṣe?” is understandable but uses “ṣe” again. “Iṣẹ́ wo ni ìwọ ń ṣiṣẹ́?” more directly reflects ἐργάζῃ while remaining idiomatic.
  revised_text: Nítorí náà, wọ́n sọ fún un pé, “Àmì wo ni ìwọ ń ṣe nígbà náà, kí àwa lè rí i, kí a sì gbà ọ́ gbọ́[a]? Iṣẹ́ wo ni ìwọ ń ṣiṣẹ́?”
