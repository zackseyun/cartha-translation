id: JHN.6.30
reference: John 6:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: yo
  text: Nítorí náà, wọ́n sọ fún un pé, “Àmì wo ni ìwọ ń ṣe nígbà náà, kí àwa lè rí i, kí a sì gbà ọ́ gbọ́[a]? Iṣẹ́ wo ni ìwọ ń ṣiṣẹ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “gbàgbọ́ nínú rẹ” tàbí “fi ara le ọ́.” Ní tààràtà, èdè Gíríìkì sọ pé, “gbà ọ́ gbọ́,” ó sì lo ọ̀rọ̀ arọ́pò-orúkọ ní dative dípò εἰς pẹ̀lú accusative, èyí tí Jòhánù sábà máa ń lò fún “gbàgbọ́ nínú rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Nítorí náà, wọ́n sọ fún un pé
  rationale: ‘Nítorí náà’ mú ìsopọ̀ ìrònú tí οὖν ní pẹ̀lú ọ̀rọ̀ tó ṣáájú wá, ní èdè Yorùbá àdánidá.
- source_word: Τί οὖν
  choice: nígbà náà ... wo
  rationale: Èyí pa οὖν kejì mọ́, ó sì fi agbára ìbéèrè wọn hàn lọ́nà tó wọ́pọ̀ ní Yorùbá.
- source_word: ποιεῖς σὺ σημεῖον
  choice: Àmì wo ni ìwọ yóò ṣe
  rationale: ‘Àmì’ pa ọ̀rọ̀ pàtàkì σημεῖον mọ́ láì fi ‘iṣẹ́ ìyanu’ kún un; fífi ‘ìwọ’ sílẹ̀ tún pa ìtẹnumọ́ σὺ mọ́. Bí ó tilẹ̀ jẹ́ pé ποιεῖς jẹ́ ìsinsìnyí, Yorùbá sábà máa ń lo ‘yóò ṣe’ nínú ìpèníjà irú èyí fún ohun tí ẹni náà fẹ́ fi hàn.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: kí àwa lè rí i, kí a sì gbà ọ́ gbọ́
  rationale: ‘Kí ... lè’ sọ ète ἵνα pẹ̀lú ọ̀rọ̀ abẹ́lẹ̀ rẹ̀; ‘gbà ọ́ gbọ́’ bá πιστεύω pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ dative σοι mu, ó sì yàtọ̀ sí ‘gbàgbọ́ nínú rẹ’.
- source_word: τί ἐργάζῃ
  choice: Iṣẹ́ wo ni ìwọ yóò ṣe?
  rationale: ‘Iṣẹ́ wo’ mú gbòǹgbò ìtumọ̀ ἐργάζομαι hàn, nígbà tí ‘ṣe’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ iṣẹ́ tí ẹnìkan ń ṣe.
theological_decisions:
- issue: Agbára πιστεύω pẹ̀lú dative σοι
  choice: gbà ọ́ gbọ́
  alternative: gbàgbọ́ nínú rẹ / fi ara le ọ́
  rationale: Gíríìkì lo ọ̀rọ̀ arọ́pò-orúkọ dative, kì í ṣe εἰς pẹ̀lú accusative tí Jòhánù sábà máa ń lò fún ‘gbàgbọ́ nínú.’ Nítorí náà, àkọ́kọ́ túmọ̀ sí gbígba ẹni náà tàbí ọ̀rọ̀ rẹ̀ gbọ́; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn kíkún. A lo ‘àwa’ àti ‘ìwọ’ láti fi ìtẹnumọ́ àwọn ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì hàn, láì mú èdè náà le fún òǹkàwé òde òní.
