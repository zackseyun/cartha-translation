revisions:
- from: Nítorí náà, wọ́n sọ fún un pé, “Àmì wo ni ìwọ yóò ṣe nígbà náà, kí àwa lè rí i, kí a sì gbà ọ́ gbọ́[a]? Iṣẹ́ wo ni ìwọ yóò ṣe?”
  to: Nítorí náà, wọ́n sọ fún un pé, “Àmì wo ni ìwọ ń ṣe nígbà náà, kí àwa lè rí i, kí a sì gbà ọ́ gbọ́[a]? Iṣẹ́ wo ni ìwọ ń ṣiṣẹ́?”
  rationale: The revision changes only the verbal aspect needed for closer fidelity to the Greek present indicatives and renders the second verb with a natural Yoruba work expression. It retains the rhetorical repetition of “nígbà náà,” the emphatic “ìwọ/àwa,” and the dative-sensitive rendering of πιστεύσωμεν σοι.
