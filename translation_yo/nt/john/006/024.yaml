id: JHN.6.24
reference: John 6:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: yo
  text: Nítorí náà, nígbà tí èrò náà rí i pé Jésù kò sí níbẹ̀, àti pé àwọn ọmọ-ẹ̀yìn rẹ̀ náà kò sí, àwọn fúnra wọn wọ inú àwọn ọkọ̀ ojú omi kéékèèké[a], wọ́n sì wá sí Kápánáúmù, wọ́n ń wá Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “àwọn ọkọ̀ ojú omi” lásán; ọ̀rọ̀ Gíríìkì náà jẹ́ ìrísí ìdínkù fún “ọkọ̀ ojú omi,” bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ìdínkù náà lè má hàn gbangba ní gbogbo àyíká.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ó mú ìtumọ̀ àsìkò ὅτε àti ìsopọ̀ ìtàn tàbí àbájáde οὖν jáde ní Yorùbá àdánidá.
- source_word: ὁ ὄχλος
  choice: èrò náà
  rationale: “Èrò” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ọ̀pọ̀ ènìyàn tí ó péjọ, “náà” sì tọ́ka sí èrò tí a ti mẹ́nu kàn.
- source_word: εἶδεν
  choice: rí i
  rationale: Ó pa ìtumọ̀ ìrí tààrà mọ́ láì túmọ̀ rẹ̀ sí “mọ̀ dájú” tàbí “yè é,” èyí tí yóò fi ìtumọ̀ míì kún un.
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: kò sí níbẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan kò wà ní ibi náà; kò pọndandan láti fi ìyàtọ̀ àkókò Gíríìkì hàn ní ọ̀nà líle.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: àti pé àwọn ọmọ-ẹ̀yìn rẹ̀ náà kò sí
  rationale: Ó fi àfikún ìkọ̀sílẹ̀ οὐδέ hàn kedere, ó sì bá ìṣètò gbolohun Yorùbá mu.
- source_word: ἐνέβησαν αὐτοὶ
  choice: àwọn fúnra wọn wọ inú
  rationale: “Àwọn fúnra wọn” pa ìtẹnumọ́ αὐτοὶ mọ́, “wọ inú” sì jẹ́ ìsọ̀rọ̀ àdánidá fún gígun sínú ọkọ̀.
- source_word: τὰ πλοιάρια
  choice: àwọn ọkọ̀ ojú omi kéékèèké
  rationale: A fi agbára ìdínkù inú πλοιάρια hàn nínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ ṣàkíyèsí pé ó tún lè jẹ́ “àwọn ọkọ̀ ojú omi” lásán ní àyíká yìí.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: wọ́n sì wá sí Kápánáúmù
  rationale: “Wá sí” tẹ̀lé ìwòye ἔρχομαι, ó sì ṣeé lò nínú ìtàn Yorùbá.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: wọ́n ń wá Jésù
  rationale: Ó sọ ìṣe lílọ kiri láti rí Jésù ní èdè òde òní, láì fi ìtumọ̀ ẹ̀mí tí ọ̀rọ̀ náà kò pọndandan ní sí i.
