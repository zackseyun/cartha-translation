  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi ìsopọ̀ οὖν, ìmọ̀ Jésù, ìfẹ́ àwọn ènìyàn láti mú un ní ipá, ète wọn láti fi í jẹ ọba, ìfàsẹ́yìn rẹ̀, ìpadà sí òkè, àti ìdánìkanwà rẹ̀ hàn dáadáa. Síbẹ̀, “wọ́n fẹ́ wá” túmọ̀ sí wọ́n ní ìfẹ́ tàbí ète láti wá ju ìmọ̀ ìsúnmọ́ “wọ́n fẹ́rẹ̀ẹ́ wá” lọ. “Láti sọ ọ́ di ọba” sì ṣàfihàn ποιήσωσιν βασιλέα ní kedere.
  naturalness: Àwọn ọ̀rọ̀ àtúnṣe náà jẹ́ Yorùbá boṣewa tí ó rọrùn fún kíkà ní gbangba. “Mú un ní ipá” jẹ́ àfihàn ti ara fún ἁρπάζειν; “fà sẹ́yìn lọ sí òkè ní òun nìkan” sì pa ìtumọ̀ ìyàsímímọ́ ìṣe náà mọ́ láìfi ọ̀rọ̀ Gíríìkì kún un.
  terminology: A pa orúkọ “Jésù” mọ́. “Ọba” jẹ́ ọ̀rọ̀ tó yẹ fún βασιλέα. “Mú un ní ipá” tọ́ka sí ìfipá tí ἁρπάζειν ní, nígbà tí “sọ ọ́ di ọba” sọ ète ìṣe náà ní kedere.
