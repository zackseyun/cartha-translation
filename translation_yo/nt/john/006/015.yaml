id: JHN.6.15
reference: John 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Jésù mọ̀ pé wọ́n fẹ́rẹ̀ẹ́ wá mú un ní ipá láti sọ ọ́ di ọba, ó tún fà sẹ́yìn lọ sí òkè ní òun nìkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe Jésù pọ̀ mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì fi ìtẹ̀síwájú tàbí àbájáde ìtàn hàn.
- source_word: γνοὺς
  choice: nígbà tí Jésù mọ̀
  rationale: Ó sọ ipò tó ṣ ṣàlàyé ìdí tí Jésù fi fà sẹ́yìn, ní èdè Yorùbá tó ṣe déédé.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: wọ́n fẹ́ wá
  rationale: Nínú àyíká yìí, gbólóhùn náà ń tọ́ka sí ohun tí wọ́n pinnu, tí ó sì ti fẹ́ ṣẹlẹ̀.
- source_word: ἁρπάζειν
  choice: mú òun ní ipá
  rationale: Ó pa ìtumọ̀ fífi agbára múni mọ́, kò sì sọ ìṣe àwọn ènìyàn náà di ìpè lásán.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: láti fi jẹ ọba
  rationale: Ó fi ète ìṣe wọn hàn ní Yorùbá àdánidá; ẹni tí wọ́n fẹ́ fi jẹ ọba ti hàn gbangba nínú ọ̀rọ̀ arọ́pò-orúkọ ‘òun’.
- source_word: ἀνεχώρησεν
  choice: ó fà sẹ́yìn lọ
  rationale: Ó mú ìtumọ̀ kíkúrò níbẹ̀ láti yẹra fún ohun tí wọ́n fẹ́ ṣe jáde.
- source_word: πάλιν
  choice: tún
  rationale: Ó tọ́ka sí ìṣe tí ó tún ṣẹlẹ̀.
- source_word: εἰς τὸ ὄρος
  choice: lọ sórí òkè
  rationale: Ó pa àwòrán ibi gíga náà mọ́ láìṣe àfikún ìtumọ̀ tí kò sí nínú Gíríìkì.
- source_word: αὐτὸς μόνος
  choice: òun nìkan ṣoṣo
  rationale: Ó pa ìtẹnumọ́ pé Jésù dá wà mọ́ ní ọ̀nà Yorùbá tó lágbára, tó sì ṣe déédé.
theological_decisions:
- issue: Irú ìgbésẹ̀ tí àwọn ènìyàn fẹ́ gbé láti fi Jésù jẹ ọba
  choice: wọ́n fẹ́ wá mú òun ní ipá láti fi jẹ ọba
  alternative: wọ́n fẹ́ wá mú un kí wọ́n sì fi jẹ ọba
  rationale: Ọ̀rọ̀ ἁρπάζειν ní ìtumọ̀ fífi agbára gbé ẹni mú; nítorí náà, a kò gbọdọ̀ sọ ète ìṣèlú onípá wọn di ìfìwéránṣẹ́ tàbí ìjẹ́wọ́ ọba lásán.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘òun’ láti mú kí ẹni tí wọ́n fẹ́ mú ṣe kedere, àti ‘òun nìkan ṣoṣo’ láti pa ìtẹnumọ́ αὐτὸς μόνος mọ́.
