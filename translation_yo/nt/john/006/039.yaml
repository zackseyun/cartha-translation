id: JHN.6.39
reference: John 6:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: yo
  text: 'Èyí sì ni ìfẹ́ ẹni tí ó rán mi: kí n má ṣe pàdánù ohunkóhun nínú gbogbo ohun tí ó ti fi fún mi[a], ṣùgbọ́n kí n jí i dìde ní ọjọ́ ìkẹyìn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí a bá ka a sí àwọn ènìyàn ní tààrà: “gbogbo àwọn tí ó ti fi fún mi … kí n jí wọn dìde.” Gíríìkì lo fọ́ọ̀mù aláìdánimọ̀-ẹyọ fún àpapọ̀ náà, ní ìtumọ̀ gangan, “gbogbo ohun tí … i.”'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: ìfẹ́
  rationale: “Ìfẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó bá ìfẹ́-inú tàbí ète Ọlọ́run mu ní àyíká yìí, láì sọ ọ́ di ìfẹ́-ọkàn lásán tàbí ìpinnu tí kò ṣeé yí padà.
- source_word: τοῦ πέμψαντός με
  choice: ẹni tí ó rán mi
  rationale: Ó pa agbára ìṣe ọ̀rọ̀-ìṣe πέμπω mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ó ṣe iṣẹ́ rírán.
- source_word: ἵνα
  choice: kí
  rationale: Lẹ́yìn “Èyí sì ni ìfẹ́…,” “kí” fi àkóónú àti ète ìfẹ́ náà hàn lọ́nà tí ó bá èdè Yorùbá mu.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: gbogbo ohun tí ó ti fi fún mi
  rationale: Èyí pa ìsọ̀rí àpapọ̀ oníkankan tí ọ̀rọ̀ Gíríìkì aláìdánimọ̀ πᾶν ὃ ní mọ́; “ó ti fi fún mi” tún fi ìṣe tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì ń bá a lọ hàn.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: kí n má ṣe sọ ohunkóhun nù nínú gbogbo ohun náà
  rationale: Nínú àyíká yìí, ἀπόλλυμι túmọ̀ sí pípàdánù ju píparun lọ. Nínú ọ̀rọ̀ ẹsẹ̀, a sọ ọ́ ní ṣókí gẹ́gẹ́ bí “kí n má ṣe sọ ohunkóhun nù nínú gbogbo ohun tí…” fún Yorùbá àdánidá.
- source_word: ἀναστήσω αὐτὸ
  choice: kí n jí i dìde
  rationale: “Jí … dìde” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún jíjí dìde ní ọjọ́ ìkẹyìn, “i” sì pa arọ́pò-orúkọ ẹyọ tí ó ń tọ́ka sí àpapọ̀ náà mọ́.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: ní ọjọ́ ìkẹyìn
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó sì pa ìtọ́kasí sí ọjọ́ ìkẹyìn mọ́.
theological_decisions:
- issue: 'Bí a ó ṣe tú ohun tí a fi fún Jésù: gẹ́gẹ́ bí àpapọ̀ aláìdánimọ̀ (“gbogbo ohun”) tàbí gẹ́gẹ́ bí àwọn ènìyàn ní tààrà (“gbogbo àwọn tí”).'
  choice: gbogbo ohun tí ó ti fi fún mi … kí n jí i dìde
  alternative: gbogbo àwọn tí ó ti fi fún mi … kí n jí wọn dìde
  rationale: Èdè Gíríìkì lo àwọn fọ́ọ̀mù aláìdánimọ̀ oníkankan πᾶν, ὃ, àti αὐτό. Ìtumọ̀ yìí pa ìrísí àpapọ̀ náà mọ́, láì sẹ́ pé nínú àyíká ọ̀rọ̀ ó lè ń tọ́ka sí àwọn ènìyàn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu. Gbólóhùn náà pa ìsọ̀rí àpapọ̀ oníkankan inú Gíríìkì mọ́, ẹsẹ̀-àlàyé sì fi ìtumọ̀ tí ó tọ́ka sí àwọn ènìyàn ní tààrà hàn.
