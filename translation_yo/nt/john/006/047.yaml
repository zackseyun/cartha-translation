  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ ⸀πιστεύων ἔχει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: yo
  text: Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹni tí ó gbàgbọ́ ní ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ àti àtúnsọ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti fi ìkéde pàtàkì hàn ní Yorùbá.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣe àti arọ́pò-orúkọ olùgbà ní tààrà, ó sì bá ìforígbárí ọ̀rọ̀ mímọ́ tí ó ní iyì mu.
- source_word: ὁ πιστεύων
  choice: ẹni tí ó gbàgbọ́
  rationale: Ó mú ẹni tí a dá mọ̀ nípa gbígbàgbọ́ hàn, gẹ́gẹ́ bí participle oní-artíkù ti Gíríìkì, láìfi ìtumọ̀ míì kún un.
- source_word: ἔχει
  choice: ní
  rationale: Àkókò ìsinsìnyí ni ó wà nínú Gíríìkì; ‘ní’ fi hàn pé ìyè náà jẹ́ ohun tí ẹni náà ní nísinsìnyí, kì í ṣe ohun ọjọ́ iwájú nìkan.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó wọ́pọ̀, tí ó sì pa èrò ìyè tí kò ní òpin mọ́.
theological_decisions:
- issue: Níní ìyè àìnípẹ̀kun ní ìsinsìnyí
  choice: ní ìyè àìnípẹ̀kun
  alternative: yóò ní ìyè àìnípẹ̀kun
  rationale: ἔχει jẹ́ ọ̀rọ̀ ìṣe àkókò ìsinsìnyí. Yíyí i sí ọjọ́ iwájú yóò kọjá ohun tí ẹsẹ̀ náà sọ, yóò sì mú ìfarahàn ìsinsìnyí tí ó wà nínú ẹ̀kọ́ Johanu kúrò.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A lo ‘wí’ dípò ‘sọ’ láti pa ìró ọ̀rọ̀ ìkéde tí ó ní ọlá mọ́, láìjẹ́ kí ó di èdè àtijọ́ jù.
