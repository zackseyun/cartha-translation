  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Èmi ni[a]; ẹ má bẹ̀rù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ ìdánimọ̀: “Èmi ni ẹni náà.” Nínú Jòhánù, gbólóhùn yìí lè jẹ́ ìdánimọ̀ ara ẹni lásán, ó sì lè ní ìfarahàn àwọn àkòrí ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò sí i.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ṣùgbọ́n ó
  rationale: δέ jẹ́ àsopọ̀ oníwọ̀nba tó ń fi ìyípadà tàbí ìyàtọ̀ hàn; ‘Ṣùgbọ́n’ bá ìṣàn ọ̀rọ̀ mu. Àpilẹ̀kọ ὁ dúró gẹ́gẹ́ bí arọ́pò-orúkọ, nítorí náà ‘ó’ tọ́ka sí Jésù láìfi orúkọ kún ẹsẹ náà.
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ìsinsìnyí ìtàn, lílo ‘sọ’ ní àkókò tí ó ti kọjá jẹ́ àdánidá nínú ìtàn Yorùbá, ó sì pa ìtumọ̀ mọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Èyí túmọ̀ arọ́pò-orúkọ dátífù púpọ̀ náà ní tààrà, nígbà tí àyíká ọ̀rọ̀ ń fi ẹni tí ‘wọn’ ń tọ́ka sí hàn.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni ẹni náà
  rationale: Nínú àyíká ìtàn yìí, Jésù ń dá àwọn ọmọ-ẹ̀yìn lójú nípa fífi ara rẹ̀ hàn. ‘Èmi ni ẹni náà’ jẹ́ ìdánimọ̀ ara ẹni tó ṣe kedere ní Yorùbá, ṣùgbọ́n a pa ìtumọ̀ gangan ‘Èmi ni’ mọ́ sínú àlàyé ìsàlẹ̀ nítorí ìró ẹ̀kọ́ ìgbàgbọ́ tó ṣeé ṣe nínú Jòhánù.
- source_word: μὴ φοβεῖσθε
  choice: ẹ má bẹ̀rù
  rationale: Èyí jẹ́ ìfòfin-dena tó ṣe àdánidá, tó sì bójú mu nínú Yorùbá òde òní; arọ́pò-orúkọ ọ̀wọ̀ púpọ̀ ‘ẹ’ bá àwọn tí a ń bá sọ mu.
theological_decisions:
- issue: Bóyá kí Ἐγώ εἰμι jẹ́ ìdánimọ̀ ara ẹni lásán tàbí kí a túmọ̀ ọ́ ní gangan bí ‘Èmi ni,’ tó lè ní ìró ẹ̀kọ́ ìgbàgbọ́.
  choice: 'Ọ̀rọ̀ inú ẹsẹ: ‘Èmi ni ẹni náà’'
  alternative: ‘Èmi ni’
  rationale: Àyíká náà fi hàn pé Jésù ń dá àwọn ọmọ-ẹ̀yìn tó bẹ̀rù lójú nípa jíjẹ́ kí wọ́n mọ ẹni tí òun jẹ́. Síbẹ̀, nítorí gbólóhùn ἐγώ εἰμι lè ní ìtumọ̀ tó jinlẹ̀ sí i nínú Ìhìn Rere Jòhánù, àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́ láìfi tipátipá yanju ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà.
translation_notes:
  register: Yorùbá àpéwọ̀n, tó ní àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo; ‘ẹ má bẹ̀rù’ pa àdánidá ọ̀rọ̀ ìtùnú mọ́.
