source:
  edition: SBLGNT
  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọkọ̀ ojú omi kéékèèké wá láti Tibéríà, wọ́n sì wà ní tòsí ibi tí wọ́n ti jẹ búrẹ́dì náà lẹ́yìn tí Olúwa ti dúpẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọkọ̀ ojú omi wá láti Tibéríà.” Ọ̀rọ̀ Gíríìkì πλοιάρια jẹ́ fọ́ọ̀mù tí ó lè tọ́ka sí ọkọ̀ ojú omi kékeré.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ohun tí a sọ ṣáájú hàn ní ọ̀nà àdánidá.
- source_word: ἦλθεν
  choice: wá
  rationale: Ó sọ nípa dídé àwọn ọkọ̀ náà ní ìtàn.
- source_word: πλοιάρια
  choice: àwọn ọkọ̀ ojú omi kéékèèké
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ diminutive; títúmọ̀ ìtumọ̀ kékeré náà ní tààràtà bójú mu, bí ó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí ‘àwọn ọkọ̀ ojú omi’ lásán ní àṣà lílò.
- source_word: ἐκ Τιβεριάδος
  choice: láti Tibéríà
  rationale: Ó tọ́ka sí ibi tí àwọn ọkọ̀ ti jáde wá.
- source_word: ἐγγὺς τοῦ τόπου
  choice: sí ẹ̀gbẹ́ ibi
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún wíwà nítòsí ibi kan.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: ibi tí wọ́n ti jẹ búrẹ́dì náà
  rationale: Ó tọ́ka padà sí ibi ìṣẹ̀lẹ̀ jíjẹ búrẹ́dì tí a ti mẹ́nu kàn; ‘náà’ fi hàn pé búrẹ́dì pàtó ni.
- source_word: εὐχαριστήσαντος
  choice: lẹ́yìn tí ... ti dúpẹ́
  rationale: Aorist participle náà fi ìṣe tí ó ṣáájú jíjẹ búrẹ́dì hàn; ìtumọ̀ yìí jẹ́ kó ṣe kedere ní Yorùbá.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Ó pa oyè ọlá fún Jésù mọ́, ó sì yẹ fún ìró ẹ̀kọ́ ní àyíká ìwé Jòhánù.
theological_decisions:
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: ọ̀gá
  rationale: ‘Olúwa’ pa ọlá àti ìró nípa ẹni tí Jésù jẹ́ mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘búrẹ́dì’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ἄρτος.
