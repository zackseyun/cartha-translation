source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: yo
  text: Nígbà náà, Jésù bi Àwọn Méjìlá pé, “Ẹ̀yin náà kò fẹ́ lọ kúrò, àbí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ẹ̀yin náà fẹ́ lọ kúrò?” Nínú ìbéèrè Gíríìkì náà, μή sábà máa ń fi hàn pé ẹni tó béèrè ń retí ìdáhùn òdì.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè Jésù pọ̀ mọ́ bí ọ̀pọ̀ àwọn ọmọ-ẹ̀yìn ṣe ṣẹ̀ṣẹ̀ fà sẹ́yìn tí wọ́n sì fi í sílẹ̀; ó lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: τοῖς δώδεκα
  choice: àwọn Méjìlá
  rationale: Gbólóhùn náà jẹ́ orúkọ àkànṣe fún ẹgbẹ́ àwọn ọmọ-ẹ̀yìn Jésù tó sún mọ́ ọn jù, nítorí náà a kò fi ọ̀rọ̀ ‘ọmọ-ẹ̀yìn’ kún un.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Ẹ̀yin náà kò ... àbí?
  rationale: Ìbéèrè tí μή bẹ̀rẹ̀ sábà máa ń retí ìdáhùn òdì; àgbékalẹ̀ Yorùbá yìí fi ìretí náà hàn láì sọ ọ́ di ìdánilójú.
- source_word: θέλετε
  choice: fẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìfẹ́ inú tàbí ohun tí ènìyàn pinnu láti ṣe; ‘fẹ́’ jẹ́ èdè Yorùbá àdánidá tó sì ṣe kedere.
- source_word: ὑπάγειν
  choice: lọ kúrò
  rationale: Ó pa ìtumọ̀ ìṣípò kúrò lọ́dọ̀ Jésù mọ́, ó sì bá àyíká àwọn ọmọ-ẹ̀yìn tí wọ́n ń fi í sílẹ̀ mu.
theological_decisions:
- issue: Agbára ìbéèrè Jésù tí μή ṣáájú rẹ̀
  choice: Ìbéèrè òdì tó ń retí ìdáhùn pé ‘rárá,’ ṣùgbọ́n tí kò sọ ìdáhùn náà di dandan
  alternative: Ìbéèrè aláìṣègbè pé, “Ṣé ẹ̀yin náà fẹ́ lọ kúrò?”
  rationale: μή nínú irú ìbéèrè Gíríìkì yìí sábà ń fi hàn pé ẹni tó béèrè ń retí ìdáhùn òdì. ‘Ẹ̀yin náà kò fẹ́ ... àbí?’ pa àmì ìtumọ̀ yẹn mọ́ láì pa àìdánilójú ìbéèrè rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní. ‘Àwọn Méjìlá’ ní lẹ́tà ńlá ń fi hàn pé orúkọ àkànṣe ẹgbẹ́ ni. Àgbékalẹ̀ ‘kò fẹ́ ... àbí?’ jẹ́ ọ̀nà àdánidá láti pa ìretí ìdáhùn òdì inú μή mọ́.
