id: JHN.6.71
reference: John 6:71
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: yo
  text: Ó ń sọ̀rọ̀ nípa Júdásì, ọmọ Símónì Iskariọti; nítorí òun ni ẹni tí yóò fi í lé wọn lọ́wọ́[a]—ọ̀kan lára àwọn Méjìlá náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣe ọ̀dàlẹ̀ sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Ó ń sọ̀rọ̀ nípa Júdásì
  rationale: Àkókò aláìparí ἔλεγεν níbí ń ṣe àlàyé ohun tí Jésù ń tọ́ka sí; “ń sọ̀rọ̀ nípa” jẹ́ Yorùbá àdánidá, δέ sì kò nílò ọ̀rọ̀ ìbẹ̀rẹ̀ ọ̀tọ̀ ní àyíká yìí.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: ọmọ Símónì Iskariọti
  rationale: 'Àwọn ọ̀rọ̀ oníhun méjèèjì tọ́ka sí ìbátan baba: Júdásì jẹ́ ọmọ Símónì, ẹni tí a ń pè ní Iskariọti.'
- source_word: οὗτος γὰρ ἔμελλεν
  choice: nítorí òun ni ẹni tí yóò
  rationale: “Nítorí” mú iṣẹ́ àlàyé γάρ jáde; “òun ni ẹni” pa ìtẹnumọ́ οὗτος mọ́, “yóò” sì sọ ọjọ́ iwájú tí ἔμελλεν ń retí láìfi ìpinnu àyànmọ́ tàbí èrò inú kún un.
- source_word: παραδιδόναι αὐτόν
  choice: fi í lé wọn lọ́wọ́
  rationale: Ìtumọ̀ gidi ni fífi ẹnì kan lé àwọn míì lọ́wọ́. Àwọn ọ̀rọ̀ náà tún jẹ́ kí àyíká ìwà ọ̀dàlẹ̀ Júdásì hàn láìsọ ìtumọ̀ ìṣe náà di kékeré.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: bí ó tilẹ̀ jẹ́ ọ̀kan lára àwọn méjìlá náà
  rationale: Gbólóhùn yìí tẹnu mọ́ ohun ìyàlẹ́nu pé ẹni tí yóò fi Jésù lé wọn lọ́wọ́ wà lára ẹgbẹ́ àwọn méjìlá; “bí ó tilẹ̀ jẹ́” mú ìyàtọ̀ yẹn hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ παραδιδόναι nípa ìṣe Júdásì
  choice: fi í lé wọn lọ́wọ́
  alternative: ṣe ọ̀dàlẹ̀ sí i
  rationale: “Fi í lé wọn lọ́wọ́” sun mọ́ ìtumọ̀ ọ̀rọ̀ Gíríìkì, ó sì pa ìbòjú ìṣe àti ìwà ọ̀dàlẹ̀ tó wà nínú àyíká mọ́. Àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn tí ó túmọ̀ ipa ìbátan rẹ̀ hàn.
- issue: Agbára ìtẹnumọ́ οὗτος
  choice: òun ni ẹni tí
  alternative: òun
  rationale: Yíyan “òun ni ẹni tí” pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ atọ́ka náà mọ́ láìjẹ́ kí Yorùbá le tàbí rí bí ìtumọ̀ ọ̀rọ̀-lẹ́nu-ọ̀rọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Àwọn méjìlá” ni a lò gẹ́gẹ́ bí orúkọ ẹgbẹ́ àwọn ọmọ-ẹ̀yìn náà; ìtẹnumọ́ àti ìyàlẹ́nu gbólóhùn ìkẹyìn ni a pa mọ́.
