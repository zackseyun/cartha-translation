  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: yo
  text: Èyí ni àkàrà tí ó sọ̀kalẹ̀ láti ọ̀run, kì í ṣe bí àwọn baba ńlá ṣe jẹ, tí wọ́n sì kú[a]. Ẹni tí ń jẹ àkàrà yìí yóò wà láàyè títí láéláé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn baba.” Ó ṣeé ṣe kí ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn baba ńlá Israẹli tí wọ́n jẹ manna ní aginjù.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ní, ní ọ̀nà ọ̀rọ̀, “yóò wà láàyè sí ayérayé”; ó túmọ̀ sí ìyè tí yóò máa bá a lọ títí láéláé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Èyí ni àkàrà
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún àfihàn àti ọ̀rọ̀ ìdánimọ̀ náà, ó sì pa àkàrà pàtó tí àyíká ọ̀rọ̀ ti ń sọ̀rọ̀ rẹ̀ mọ́.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: tí ó sọ̀kalẹ̀ láti ọ̀run
  rationale: Gbólóhùn-ìbátan yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì fi ìṣe aorist àti ἐξ οὐρανοῦ hàn ní kedere.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: kì í ṣe bí èyí tí àwọn baba ńlá jẹ tí wọ́n sì kú
  rationale: Ó pa ìfiwéra οὐ καθὼς, ìṣe méjèèjì, àti ìtọ́kasí sí àwọn baba Israẹli mọ́. A fi “èyí tí” kún un láti jẹ́ kí ìfiwéra náà yé ni Yorùbá.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: ẹni tí ó bá ń jẹ àkàrà yìí
  rationale: “Ẹni tí ó bá ń jẹ” mú agbára ẹni-kọ̀ọ̀kan àti ìṣe tí participle present náà ń tọ́ka sí jáde, láìfi ìtumọ̀ sacramenti tàbí àpẹẹrẹ ìgbàgbọ́ kan lé e lórí.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: yóò wà láàyè títí láéláé
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ọ̀rọ̀ ìṣàpẹẹrẹ Johannine náà pé ìyè náà ń bá a lọ láìlópin.
theological_decisions:
- issue: Ìtọ́kasí οἱ πατέρες nínú ìfiwéra pẹ̀lú àkàrà láti ọ̀run
  choice: àwọn baba ńlá
  alternative: àwọn baba; àwọn baba ńlá Israẹli
  rationale: “Àwọn baba ńlá” pa ìtọ́kasí akọ púpọ̀ mọ́, ó sì máa ń túmọ̀ sí àwọn baba ìran ní Yorùbá; àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé pé ó ṣeé ṣe kí ó tọ́ka sí àwọn baba ńlá Israẹli tí wọ́n jẹ manna.
- issue: Agbára τρώγων nínú ọ̀rọ̀ àkàrà ìyè
  choice: ẹni tí ó bá ń jẹ
  alternative: ẹni tí ó bá ń jẹ nígbà gbogbo; ẹni tí ó bá ń jẹ nínú rẹ̀
  rationale: A yan ọ̀rọ̀ didoju tó pa àwòrán jíjẹ mọ́, láìdá ẹ̀kọ́ sacramenti tàbí ìtumọ̀ àpẹẹrẹ ìgbàgbọ́ kan láre ju èkejì lọ.
- issue: Ìtumọ̀ εἰς τὸν αἰῶνα
  choice: títí láéláé
  alternative: títí dé ayé náà
  rationale: “Títí láéláé” jẹ́ ìtumọ̀ Yorùbá adayeba fún ọ̀rọ̀ Gíríìkì yìí nínú Johanu, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gangan “sí inú ayé náà” mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ adayeba, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. “Àkàrà” ni a lò fún ἄρτος gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tó mọ́, láìsọ ọ́ di búrẹ́dì odindi kan pàtó.
