base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: yo
  text: Àwa sì ti gbàgbọ́, a sì ti mọ̀ pé ìwọ ni Ẹni Mímọ́ ti Ọlọ́run[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “Kristi, Ọmọ Ọlọ́run alààyè.”
    reason: textual_variant
  - marker: b
    text: Tàbí, “Ẹni Mímọ́ láti ọ̀dọ̀ Ọlọ́run.” Jẹ́nítífù Gíríìkì náà lè fi ìbátan tàbí orísun hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Àwa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì fi ìtẹnumọ́ sí ‘àwa’; lílo ‘Àwa’ ní ìbẹ̀rẹ̀ gbólóhùn pa ìtẹnumọ́ náà mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: πεπιστεύκαμεν
  choice: ti gbàgbọ́
  rationale: Ìṣe àsìkò pípé náà tọ́ka sí ìgbàgbọ́ tí ó ti bẹ̀rẹ̀ tẹ́lẹ̀ tí ipò rẹ̀ sì ń bá a lọ; ‘ti gbàgbọ́’ ṣàfihàn èyí láìfi ìtumọ̀ àfikún sí i.
- source_word: ἐγνώκαμεν
  choice: ti mọ̀
  rationale: Ìṣe àsìkò pípé ti γινώσκω ní agbára àbájáde tí ó wà nísinsìnyí; ‘ti mọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n dé inú ìmọ̀ yìí, wọ́n sì ní ìdánilójú rẹ̀.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń mú àkóónú ohun tí wọ́n gbàgbọ́ tí wọ́n sì mọ̀ wọlé; ‘pé’ ni àsopọ̀ Yorùbá tó bá a mu.
- source_word: ὁ ἅγιος
  choice: Ẹni Mímọ́
  rationale: Èyí jẹ́ oyè Kristi tí ó ń tọ́ka sí ẹni tí a yà sọ́tọ̀ ní ọ̀nà àrà ọ̀tọ̀; ‘Ẹni Mímọ́’ jẹ́ ọ̀rọ̀ tó ṣe kedere, tó ní iyì, tó sì pa ìrísí oyè náà mọ́.
- source_word: τοῦ θεοῦ
  choice: ti Ọlọ́run
  rationale: Àbùdá oníjẹnitífù Gíríìkì lè fi ìbátan, jíjẹ́ ti ẹnì kan, tàbí orísun hàn. ‘ti Ọlọ́run’ pa ìtumọ̀ náà mọ́ ní fífẹ̀ láìdín in kù sí orísun nìkan.
theological_decisions:
- issue: Oyè nípa Kristi nínú Jòhánù 6:69
  choice: Ẹni Mímọ́ ti Ọlọ́run
  alternative: Ẹni Mímọ́ láti ọ̀dọ̀ Ọlọ́run; Kristi náà, Ọmọ Ọlọ́run alààyè
  rationale: Ọ̀rọ̀ SBLGNT ni ὁ ἅγιος τοῦ θεοῦ. A túmọ̀ oyè yìí tààrà, láìṣe ìbámu rẹ̀ pẹ̀lú Mátíù 16:16 tàbí àwọn àfikún inú àwọn àfọwọ́kọ mìíràn. ‘ti Ọlọ́run’ tún jẹ́ kí ìbátan oníjẹnitífù náà dúró ní fífẹ̀, dípò kí a pinnu pé orísun nìkan ni.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; ìtẹ̀síwájú ‘Àwa sì … a sì …’ pa ìtẹnumọ́ àti ìṣọ̀kan àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
