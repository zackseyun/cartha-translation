id: JHN.6.40
reference: John 6:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: yo
  text: 'Nítorí èyí ni ohun tí Baba mi fẹ́: kí gbogbo ẹni tí ó ń wo Ọmọ náà[a], tí ó sì gbà á gbọ́, lè ní ìyè ayérayé; èmi fúnra mi[b] sì yóò jí i dìde ní ọjọ́ ìkẹyìn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ẹni tí ó ń fi àkíyèsí wo Ọmọ náà.” Ọ̀rọ̀ náà lè túmọ̀ sí wíwo tàbí kíyèsí jinlẹ̀, kì í ṣe ríran ojú lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èmi sì yóò jí i dìde.” Ọ̀rọ̀ Gíríìkì fi “èmi” hàn ní pàtó láti tẹnumọ́ ẹni tí yóò jí ẹni náà dìde.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Nítorí ... ni èyí
  rationale: “Nítorí” pa ipa ìṣàlàyé γάρ mọ́, “ni èyí” sì gbé ìtẹnumọ́ τοῦτο ἐστιν jáde ní Yorùbá àdánidá.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: ohun tí Baba mi fẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún ‘ìfẹ́-inú/ohun tí ẹnì kan fẹ́,’ láì jẹ́ kí ‘ìfẹ́’ dà bí ìfẹ́ni.
- source_word: ἵνα πᾶς ὁ θεωρῶν
  choice: kí olúkúlùkù ẹni tí ó ń wo
  rationale: “Kí” dúró fún ìṣètò ἵνα pẹ̀lú subjunctive, “olúkúlùkù ẹni” sì pa ìtumọ̀ gbogbogbò πᾶς mọ́. “Ń wo” lè tọ́ka sí wíwo pẹ̀lú àkíyèsí, kì í ṣe ríran lásán.
- source_word: τὸν υἱὸν
  choice: Ọmọ náà
  rationale: “Ọmọ” pẹ̀lú lẹ́tà ńlá fi hàn pé orúkọ oyè Kristi ni nínú ọ̀rọ̀ yìí; “náà” jẹ́ kí àfihàn pàtó ti Greek article hàn ní Yorùbá.
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: tí ó sì gbà á gbọ́
  rationale: “Gbà á gbọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìgbàgbọ́ tí a darí sí ẹni kan, ó sì bá πιστεύω εἰς mu.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: lè ní ìyè ayérayé
  rationale: “Lè ní” pa irú subjunctive mọ́ lábẹ́ ἵνα, “ìyè ayérayé” sì jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì ní ọlá fún ζωὴ αἰώνιος.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: èmi fúnra mi yóò sì jí i dìde
  rationale: “Èmi fúnra mi” mú ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ἐγώ jáde; “jí i dìde” sọ ìjíǹde ẹni náà ní ọjọ́ ìkẹyìn ní kedere.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: ní ọjọ́ ìkẹyìn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn àkókò náà, ó sì pa ìtọ́kasí ọjọ́ eschatological mọ́.
theological_decisions:
- issue: Ìwọ̀n àti ipò inú πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: kí olúkúlùkù ẹni tí ó ń wo Ọmọ náà, tí ó sì gbà á gbọ́, lè ní ìyè ayérayé
  alternative: kí ẹnikẹ́ni tí ó bá wo Ọmọ náà, tí ó sì gbà á gbọ́, ní ìyè ayérayé
  rationale: Ìtumọ̀ náà pa àpẹẹrẹ gbogbogbò àwọn participle méjèèjì àti subjunctive lábẹ́ ἵνα mọ́, láì fi ẹ̀kọ́ ẹ̀sìn kankan kún bí ìfẹ́ Ọlọ́run àti ìdáhùn ènìyàn ṣe ní í ṣe pọ̀.
- issue: Ìtẹnumọ́ ἐγώ nínú ìlérí ìjíǹde
  choice: èmi fúnra mi yóò sì jí i dìde
  alternative: èmi yóò sì jí i dìde
  rationale: Ọ̀rọ̀ yìí pa ìtẹnumọ́ arọ́pò-orúkọ Greek mọ́, ó sì fi iṣẹ́ Jesu fúnra rẹ̀ nínú ìjíǹde hàn láì fi àlàyé ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A yan “ohun tí Baba mi fẹ́” dípò gbólóhùn tí ó lè mú “ìfẹ́” dà bí ìfẹ́ni; a sì fi àmì ohùn sí ibi tí ó yẹ fún kíkà tó rọrùn.
