  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: yo
  text: Èmi ni búrẹ́dì ìyè náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Èmi ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdánimọ̀ ẹni pẹ̀lú àfikún ìtẹnumọ́ tí ἐγώ ní; kò fi ìtumọ̀ míì kún gbólóhùn náà.
- source_word: ὁ ἄρτος
  choice: oúnjẹ
  rationale: Nínú Yorùbá òde òní, “oúnjẹ” jẹ́ ọ̀rọ̀ àdánidá tí ó lè dúró fún búrẹ́dì gẹ́gẹ́ bí oúnjẹ pàtàkì nínú àwòrán yìí; “búrẹ́dì” lè jẹ́ kíkankíkan jù, “ìṣù búrẹ́dì” sì lè fi ìrísí kan pàtó kún ọ̀rọ̀ náà. Ìdánimọ̀ pàtó inú ὁ jẹ́ kedere nínú àkọlé “Èmi ni ...”.
- source_word: τῆς ζωῆς
  choice: ìyè
  rationale: Ìsopọ̀ “oúnjẹ ìyè” pa ìbáṣepọ̀ genitive Gíríìkì mọ́ ní ṣókí, láì túmọ̀ rẹ̀ sí “oúnjẹ tí ń fúnni ní ìyè,” èyí tí yóò yan ìtumọ̀ kan pàtó.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ìdánimọ̀ “ἐγώ εἰμι” nínú ẹ̀kọ́ nípa Kristi
  choice: Èmi ni
  alternative: Èmi fúnra mi ni; Èmi ni ẹni náà
  rationale: Ẹsẹ̀ yìí ní àsọyé predicate, kì í ṣe ἐγώ εἰμι tí ó dúró láìní predicate. “Èmi ni” pa ìtẹnumọ́ àti ìdánimọ̀ Jesu mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
- issue: Ìtumọ̀ ìbáṣepọ̀ inú τῆς ζωῆς
  choice: ìyè
  alternative: tí ń fúnni ní ìyè
  rationale: “Ìyè” pa àìdánilójú onírúurú ti genitive mọ́—ó lè tọ́ka sí oúnjẹ tí ó ní í ṣe pẹ̀lú ìyè tàbí tí ń pèsè ìyè—dípò kí ìtumọ̀ yan àlàyé kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; gbólóhùn náà jẹ́ kúkúrú, ọlọ́lá, ó sì ye òǹkàwé òde òní. A lo “oúnjẹ ìyè” gẹ́gẹ́ bí àfihàn àdánidá, dípò ìtumọ̀ gígígírí “búrẹ́dì ìyè.”
