  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Èmi ni búrẹ́dì ìyè; ẹni tí ó bá wá sọ́dọ̀ mi kì yóò ní ebi láéláé, ẹni tí ó bá sì gba mí gbọ́ kì yóò gbẹ òǹgbẹ láéláé.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “kì yóò gbẹ òǹgbẹ nígbà kankan rárá.” Èdè Gíríìkì lo ìkọ̀ líle pẹ̀lú ọ̀rọ̀ tó túmọ̀ sí “nígbà kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Ọ̀nà àdánidá ní Yorùbá fún ọ̀rọ̀ ìṣáájú nínú ìtàn; ó pa ìtumọ̀ ‘ó sọ fún wọn’ mọ́ láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: ‘Èmi ni’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìdánimọ̀ ara ẹni, ó sì pa ìtẹnumọ́ tí aṣ代-orúkọ Ἐγώ mú wá mọ́.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: oúnjẹ ìyè
  rationale: ‘Oúnjẹ’ jẹ́ ọ̀rọ̀ àdánidá fún ohun tí a ń jẹ, pàápàá búrẹ́dì, nínú Yorùbá; ó pa àkàwé àti ìsopọ̀ genitive ‘ti ìyè’ mọ́ láìsọ ọ́ di ‘oúnjẹ tí ń fúnni ní ìyè.’
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: ẹni tí ó bá tọ̀ mí wá
  rationale: Ó ṣàfihàn ìṣípò ‘wá sọ́dọ̀ mi’ àti agbára gbogbogbò ti participle; ‘tí ó bá’ jẹ́ ìlò Yorùbá àdánidá fún ẹni yòówù tí ó bá ṣe bẹ́ẹ̀.
- source_word: οὐ μὴ πεινάσῃ
  choice: kì yóò pa ebi láéláé
  rationale: ‘Pa ebi’ jẹ́ gbólóhùn Yorùbá àdánidá fún ‘hunger,’ ‘kì yóò ... láéláé’ sì mú ìkọ̀ emphatic οὐ μή hàn kedere.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: ẹni tí ó bá gba mí gbọ́
  rationale: ‘Gba ... gbọ́’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún πιστεύω εἰς nínú àyíká yìí; ó pa èrò ìgbàgbọ́ nínú Jésù mọ́ láìdín un kù sí gbígbọ́ ọ̀rọ̀ lasan.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: kì yóò gbẹ òǹgbẹ láéláé
  rationale: ‘Gbẹ òǹgbẹ’ jẹ́ ọ̀nà Yorùbá àdánidá fún ‘thirst’; ‘láéláé’ ń fi οὐ μή pẹ̀lú πώποτε hàn gẹ́gẹ́ bí ìkọ̀ líle tó kan gbogbo ìgbà, kì í ṣe ‘lẹ́ẹ̀kan sí i.’
theological_decisions:
- issue: Ìtumọ̀ πιστεύων εἰς ἐμέ
  choice: ẹni tí ó bá gba mí gbọ́
  alternative: ẹni tí ó bá gbẹ́kẹ̀ lé mi
  rationale: Àṣàyàn àkọ́kọ́ pa èdè ìgbàgbọ́ àti ìlò Johanu mọ́ ní kedere. ‘Gbẹ́kẹ̀ lé mi’ lè mú apá ìgbẹ́kẹ̀lé jáde, ṣùgbọ́n ó lè túmọ̀ ọ̀rọ̀ náà ju bí orísun ṣe sọ lọ.
- issue: Agbára ìdánimọ̀ Ἐγώ εἰμι
  choice: Èmi ni
  alternative: Èmi fúnra mi ni
  rationale: ‘Èmi ni’ pa ìtẹnumọ́ àti ìdánimọ̀ taara mọ́, ó sì jẹ́ kí ìró ẹ̀kọ́-ìgbàgbọ́ nínú àwọn ọ̀rọ̀ ‘Èmi ni’ ti Johanu dúró láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- issue: Agbára οὐ μὴ ... πώποτε
  choice: kì yóò ... láéláé
  alternative: kò lè ... nígbà kankan rárá
  rationale: Ìtumọ̀ àkọ́kọ́ jẹ́ àdánidá, ó sì pa ìkọ̀ líle àti ìtumọ̀ ‘ever’ mọ́. A kò lo ‘lẹ́ẹ̀kan sí i,’ nítorí πώποτε tọ́ka sí ‘nígbà kankan,’ kì í ṣe dandan sí ìṣẹ̀lẹ̀ tó tún ṣẹlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. ‘Oúnjẹ ìyè’ jẹ́ àdánidá ju ‘búrẹ́dì ìyè’ lọ fún ọ̀pọ̀ òǹkàwé Yorùbá, ó sì pa àkàwé ohun jíjẹ mọ́. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
