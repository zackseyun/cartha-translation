id: JHN.6.29
reference: John 6:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: yo
  text: Jésù dá wọn lóhùn, ó sì sọ fún wọn pé, “Èyí ni iṣẹ́ Ọlọ́run:[a] kí ẹ̀yin gba ẹni tí Ọlọ́run rán gbọ́.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “iṣẹ́ tí Ọlọ́run ń béèrè” tàbí “iṣẹ́ tí Ọlọ́run ń ṣe.” Gbólóhùn Gíríìkì náà lè ní ju ìtumọ̀ kan lọ; ọ̀rọ̀ tí a lò níbí pa àìdánilójú yẹn mọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí “kí ẹ̀yin gbẹ́kẹ̀ lé ẹni tí Ọlọ́run rán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jésù dá wọn lóhùn, ó sì sọ fún wọn pé
  rationale: Ó pa àwọn ọ̀rọ̀-ìṣe méjèèjì, ‘dá lóhùn’ àti ‘sọ,’ mọ́, ó sì jẹ́ ọ̀nà àdánidá nínú ìtàn Yorùbá.
- source_word: Τοῦτό ἐστιν
  choice: Èyí ni
  rationale: Ó fi ìtẹnumọ́ ọ̀rọ̀ atọ́ka àti copula Gíríìkì hàn ní ṣókí.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: iṣẹ́ Ọlọ́run
  rationale: 'Ìtumọ̀ yìí sún mọ́ Gíríìkì, ó sì pa àìdánilójú genitive mọ́: ó lè jẹ́ iṣẹ́ tí Ọlọ́run ń béèrè tàbí iṣẹ́ tí Ọlọ́run fúnra rẹ̀ ń ṣe.'
- source_word: ἵνα πιστεύητε
  choice: kí ẹ̀yin ... gba ... nígbàgbọ́
  rationale: ‘Kí’ fi ẹ̀ka ἵνα hàn lọ́nà àdánidá; fífi ‘ẹ̀yin’ sílẹ̀ mú plural náà àti ìtẹnumọ́ rẹ̀ ṣe kedere.
- source_word: πιστεύητε εἰς ὃν
  choice: gba ẹni ... nígbàgbọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún πιστεύω εἰς, ó sì tọ́ka sí ìgbẹ́kẹ̀lé ẹni náà, kì í ṣe gbígbà òtítọ́ ọ̀rọ̀ kan lásán.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: ẹni tí ó rán
  rationale: ‘Ẹni tí’ pa ẹni tí ìgbàgbọ́ dojú kọ mọ́; àyíká ọ̀rọ̀ mú kí ó ṣe kedere pé Ọlọ́run ni ẹni tí ó rán án, láìfi ọ̀rọ̀ kún Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ τοῦ θεοῦ nínú ‘iṣẹ́ Ọlọ́run’
  choice: Pa ‘iṣẹ́ Ọlọ́run’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘iṣẹ́ tí Ọlọ́run ń béèrè’ tàbí ‘iṣẹ́ tí Ọlọ́run ń ṣe’
  rationale: Genitive Gíríìkì lè tọ́ka sí ohun tí Ọlọ́run ń béèrè tàbí ohun tí Ọlọ́run ń ṣe. Àyíká ṣe àtìlẹ́yìn fún méjèèjì ní ìwọ̀n kan, nítorí náà a kò yanju ẹ̀kọ́ ìgbàgbọ́ náà fún òǹkàwé.
- issue: Ìtumọ̀ πιστεύω εἰς
  choice: ‘gba ... nígbàgbọ́’
  alternative: ‘gbẹ́kẹ̀ lé’
  rationale: Àṣàyàn pàtàkì ń tẹ̀ lé èdè ìgbàgbọ́ tí ó wọ́pọ̀, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìgbẹ́kẹ̀lé hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti mú plural πιστεύητε ṣe kedere, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
