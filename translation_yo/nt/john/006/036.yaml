  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: yo
  text: Ṣùgbọ́n mo ti sọ fún yín pé, bí ó tilẹ̀ jẹ́ pé ẹ ti rí mi[a], ẹ kò sì gbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí ní ọ̀nà tí ó tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Ṣùgbọ́n mo ti sọ fún yín pé, ẹ ti rí mi nítòótọ́, ẹ kò sì gbàgbọ́.”'
    reason: Àṣàyàn ìtumọ̀ fún agbára καί àti ìṣètò àwọn gbólóhùn méjèèjì.
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ọ̀rọ̀ tí ó ṣáájú hàn ní ọ̀nà àdánidá àti ṣókí.
- source_word: εἶπον ὑμῖν
  choice: mo ti sọ fún yín
  rationale: Àkópọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ tí Jésù ti sọ tẹ́lẹ̀ fún àwọn olùgbọ́ rẹ̀.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí Jésù sọ sílẹ̀.
- source_word: καὶ ἑωράκατέ με
  choice: bí ó tilẹ̀ jẹ́ pé ẹ ti rí mi
  rationale: καί níbí ní agbára ìtẹnumọ́ tí àyíká ọ̀rọ̀ mú kó ní ìtumọ̀ ìyàlẹ́nu àti ìtakora; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ náà mọ́.
- source_word: ἑωράκατέ
  choice: ẹ ti rí
  rationale: Ìṣe pípé Gíríìkì tọ́ka sí rírí tí ó ti ṣẹlẹ̀, tí ó sì ṣì ní ìjẹ́pàtàkì nísinsìnyí; ‘ti rí’ fi èyí hàn dáadáa.
- source_word: με
  choice: mi
  rationale: Arọ́pò-orúkọ olùṣe-gbígbà tààrà fún Jésù.
- source_word: καὶ οὐ πιστεύετε
  choice: ẹ kò sì gbàgbọ́
  rationale: ‘sì’ so gbólóhùn méjèèjì pọ̀, ‘kò gbàgbọ́’ sì jẹ́ ìtumọ̀ Yorùbá tí ó dúró ṣinṣin fún πιστεύω nínú Jòhánù.
theological_decisions:
- issue: Agbára καί àkọ́kọ́ nínú καὶ ἑωράκατέ με
  choice: bí ó tilẹ̀ jẹ́ pé ẹ ti rí mi
  alternative: pé ẹ ti rí mi nítòótọ́, ẹ kò sì gbàgbọ́
  rationale: Èdè Gíríìkì lè túmọ̀ sí ìtẹnumọ́ tàbí ìtakora; ọ̀nà àkọ́kọ́ mú ìtakora pé rírí wọn kò yọrí sí ìgbàgbọ́ hàn ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ tó tẹ̀lé ìṣètò Gíríìkì mọ́.
- issue: Ìtumọ̀ πιστεύετε
  choice: gbàgbọ́
  alternative: ní ìgbàgbọ́; gbẹ́kẹ̀ lé
  rationale: ‘Gbàgbọ́’ ni ìbámu tààrà àti èyí tí ó wọ́pọ̀ jù lọ fún ọ̀rọ̀-ìṣe πιστεύω ní Jòhánù, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kun un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Yín/ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀. Àmì ohùn ni a fi sí ibi tí ó yẹ.
