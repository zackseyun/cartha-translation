id: JHN.6.54
reference: John 6:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: yo
  text: Ẹni tí ó ń jẹ ẹran-ara mi, tí ó sì ń mu ẹ̀jẹ̀ mi, ní ìyè àìnípẹ̀kun[a]; èmi yóò sì jí i dìde ní ọjọ́ ìkẹyìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí ‘ń jẹ’ lè ní ìmọ̀lára jíjẹun tàbí jíjẹ pẹ̀lú eyín; ó ṣe kedere ju ọ̀rọ̀ gbogbogbò fún jíjẹ lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Ẹni tí ó ń jẹ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ pẹ̀lú participle tó wà ní present tense ń ṣàpèjúwe ẹnì kan tí ìṣe yìí ń dá mọ́; ‘Ẹni tí ó ń jẹ’ pa ìtumọ̀ ẹyọ kan àti ìṣe tó ń bá a lọ mọ́.
- source_word: μου τὴν σάρκα
  choice: ẹran ara mi
  rationale: ‘Ẹran ara’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ σάρξ ní ìtumọ̀ gidi níbí, láì sọ ọ́ di ‘ara’ lásán tàbí fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: tí ó sì ń mu ẹ̀jẹ̀ mi
  rationale: Ó pa ìṣe tó ń bá a lọ àti ìbáramu rẹ̀ pẹ̀lú ‘ń jẹ’ mọ́; ‘ẹ̀jẹ̀’ sì dúró ní ìtumọ̀ gidi.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: ní ìyè àìnípẹ̀kun
  rationale: ‘Ní’ fi ìní tó wà nísinsìnyí hàn, ‘ìyè àìnípẹ̀kun’ sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ń sọ ìyè tí kò lópin.
- source_word: κἀγὼ ἀναστήσω αὐτὸν
  choice: èmi yóò sì jí i dìde
  rationale: ‘Èmi’ pa ìtẹnumọ́ ἐγώ mọ́; ‘jí i dìde’ jẹ́ ọ̀nà Yorùbá àdánidá fún jí ẹnì kan dìde kúrò nínú òkú, ó sì pa arọ́pò-orúkọ ẹyọ kan mọ́.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: ní ọjọ́ ìkẹyìn
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere àti tó bá ọ̀rọ̀ nípa òpin ayé mu.
theological_decisions:
- issue: Bóyá kí a tú ọ̀rọ̀ jíjẹ ẹran ara àti mímu ẹ̀jẹ̀ sí ìtumọ̀ oúnjẹ Olúwa tàbí ìgbàgbọ́
  choice: A pa èdè gidi ti jíjẹ àti mímu mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ sínú ẹsẹ náà.
  alternative: Kí a sọ ọ́ ní pàtó gẹ́gẹ́ bí oúnjẹ Olúwa, tàbí kí a tú u sí ‘gbígbàgbọ́.’
  rationale: Gíríìkì fúnra rẹ̀ lo àwọn ọ̀rọ̀ tó ṣe kedere fún ẹran ara, ẹ̀jẹ̀, jíjẹ àti mímu. Pípa wọn mọ́ kò yanju ìjàmbá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ní ipò òǹkàwé.
- issue: Ìtọ́kasí αὐτόν tó jẹ́ ẹyọ kan
  choice: jí i dìde
  alternative: jí irú ẹni bẹ́ẹ̀ dìde
  rationale: Arọ́pò-orúkọ Gíríìkì jẹ́ ẹyọ kan, ó sì tọ́ka sí ‘ẹni tí ó ń jẹ’; Yorùbá ‘i’ pa ẹyọ kan mọ́ láì fipá fi akọ tàbí abo tí èdè Yorùbá kò fi hàn sí i.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn ni a lò. Àmì ohùn ni a fi sí ibi tó yẹ. ‘Ẹran ara’ àti ‘ẹ̀jẹ̀’ pa àwòrán líle ti orísun mọ́, ‘jí i dìde’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún àjíǹde.
