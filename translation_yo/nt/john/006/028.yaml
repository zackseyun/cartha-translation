revisions:
- from: Nígbà náà ni wọ́n sọ fún un pé[a], “Kí ni a gbọdọ̀ ṣe kí a lè máa ṣe àwọn iṣẹ́ Ọlọ́run?”
  to: Nígbà náà ni wọ́n sọ fún un pé[a], “Kí ni a gbọdọ̀ ṣe kí a lè ṣe àwọn iṣẹ́ Ọlọ́run?”
  rationale: The revision removes the added habitual sense of “máa” while retaining the direct question, purpose clause, and the unresolved force of “àwọn iṣẹ́ Ọlọ́run.” The footnote continues to document both the less-forceful deliberative alternative and the possible sense that God requires the works.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the addressed person, the deliberative force of the question, the purposive relation, and the deliberately open genitive in “àwọn iṣẹ́ Ọlọ́run.” However, “máa ṣe” introduces a habitual/continuative nuance not expressed by the Greek present subjunctive in this context.
  naturalness: The wording is clear Standard Yoruba. Removing “máa” makes the question more direct and idiomatic without losing the Greek wordplay between doing/working and works.
  terminology: “Àwọn iṣẹ́ Ọlọ́run” appropriately retains the ambiguity of τοῦ θεοῦ. The alternative footnote may offer “àwọn iṣẹ́ tí Ọlọ́run béèrè” without imposing that sense on the main text.
  issues:
  - severity: medium
    issue: The main text uses “kí a lè máa ṣe.”
    rationale: “Máa” normally conveys ongoing, customary, or repeated action in Yoruba. The Greek ἐργαζώμεθα here asks what action they should undertake; it does not require a habitual nuance.
  - severity: low
    issue: The alternative footnote says “ń béèrè lọ́wọ́ wa.”
    rationale: Although compatible with the sense, “lọ́wọ́ wa” makes the recipients explicit and “ń béèrè” may suggest an ongoing request. A more neutral relative rendering better serves as an alternative explanation of the genitive.
  revised_text: Nígbà náà ni wọ́n sọ fún un pé[a], “Kí ni a gbọdọ̀ ṣe kí a lè ṣe àwọn iṣẹ́ Ọlọ́run?”
  revised_footnotes:
  - marker: a
    text: Tàbí, “Kí ni ó yẹ kí a ṣe kí a lè ṣe àwọn iṣẹ́ Ọlọ́run?” Gíríìkì náà tún lè túmọ̀ sí “àwọn iṣẹ́ tí Ọlọ́run béèrè.”
    reason: alternative_reading
  revision_rationale: The revision removes the added habitual sense of “máa” while retaining the direct question, purpose clause, and the unresolved force of “àwọn iṣẹ́ Ọlọ́run.” The footnote continues to document both the less-forceful deliberative alternative and the possible sense that God requires the works.
