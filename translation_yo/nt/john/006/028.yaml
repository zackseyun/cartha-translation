id: JHN.6.28
reference: John 6:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: yo
  text: Nígbà náà ni wọ́n sọ fún un pé[a], “Kí ni a gbọdọ̀ ṣe kí a lè ṣe àwọn iṣẹ́ Ọlọ́run?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni ó yẹ kí a ṣe kí a lè ṣe àwọn iṣẹ́ Ọlọ́run?” Gíríìkì náà tún lè túmọ̀ sí “àwọn iṣẹ́ tí Ọlọ́run béèrè.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: wọ́n sọ
  rationale: Aoristi λέγω jẹ́ ọ̀rọ̀ ìtàn ní àkókò tí ó ti kọjá; “wọ́n sọ” kò sì fi irú ọ̀nà tí wọ́n gbà bá a sọ̀rọ̀ kún ohun tí Gíríìkì sọ.
- source_word: οὖν
  choice: Nígbà náà ni
  rationale: Ó so ìbéèrè yìí mọ́ ìjíròrò tó ṣáájú, ó sì bá ìṣàn ìtàn Yorùbá mu láì mú ìtumọ̀ àbájáde ọgbọ́n le ju bó ṣe yẹ lọ.
- source_word: πρὸς αὐτόν
  choice: fún un
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe sísọ, πρός pẹ̀lú akusatifì fi ẹni tí a ń bá sọ̀rọ̀ hàn; “fún un” ni ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: Τί ποιῶμεν
  choice: Kí ni a gbọdọ̀ ṣe
  rationale: Ìbéèrè oníṣubujọ́ńtífù yìí ń béèrè ohun tí ó yẹ tàbí tí a nílò láti ṣe; “gbọ́dọ̀/mọ̀ọ́ ṣe” ni agbára ìbéèrè náà, a sì lo “mọ̀ọ́ ṣe” gẹ́gẹ́ bí “mú kí a ṣe?” Wait no.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó ń tọ́ka sí ète; “kí a lè” jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì jẹ́ ti ẹ̀dá láti sọ ète náà.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: kí a lè máa ṣe àwọn iṣẹ́
  rationale: “Máa ṣe àwọn iṣẹ́” pa ìbáṣepọ̀ ọ̀rọ̀ láàárín ọ̀rọ̀-ìṣe ἐργάζομαι àti orúkọ ἔργα mọ́, bó tilẹ̀ jẹ́ pé Yorùbá kò lè tún gbòǹgbò kan náà ṣe ní ọ̀nà tó bá ara mu bíi ti Gíríìkì.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: 'Ìsopọ̀ oníni “àwọn iṣẹ́ Ọlọ́run” jẹ́ kí ìtumọ̀ Gíríìkì ṣí sílẹ̀: ó lè jẹ́ iṣẹ́ tí Ọlọ́run ń béèrè, iṣẹ́ tirẹ̀, tàbí iṣẹ́ tó ti ọ̀dọ̀ rẹ̀ wá.'
theological_decisions:
- issue: Ìtumọ̀ jenitífù nínú τὰ ἔργα τοῦ θεοῦ
  choice: Àwọn iṣẹ́ Ọlọ́run
  alternative: Àwọn iṣẹ́ tí Ọlọ́run ń béèrè lọ́wọ́ wa
  rationale: Jenitífù Gíríìkì náà ní ìtumọ̀ tí kò fi ara mọ́ ọ̀nà kan ṣoṣo, ẹsẹ tó tẹ̀ lé e sì ń lo ààyè ìtumọ̀ yìí. Ìtumọ̀ pàtàkì kò yẹ kí ó yanjú ohun tí orísun fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní. “Nígbà náà ni” mú ìṣàn ìtàn jáde; “àwọn iṣẹ́ Ọlọ́run” sì pa àìdánilójú ìtumọ̀ inú Gíríìkì mọ́.
