id: JHN.6.11
reference: John 6:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: yo
  text: Nítorí náà, Jésù mú àwọn ìṣù búrẹ́dì náà, lẹ́yìn tí ó dúpẹ́, ó pín wọn fún àwọn tí wọ́n jókòó láti jẹun[a]. Bẹ́ẹ̀ náà ni ó pín àwọn ẹja náà fún wọn[b], ní iye tí wọ́n fẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí wọ́n tẹ̀ sílẹ̀ níbi oúnjẹ.” Ní ti gangan, ọ̀rọ̀ Gíríìkì náà sọ pé wọ́n tẹ̀ sílẹ̀; èyí sì jẹ́ ìdúró ara tí wọ́n sábà máa ń lò nígbà oúnjẹ ní àkókò náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ẹja kéékèèké.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹja tí a ń jẹ pẹ̀lú búrẹ́dì, ó sì ṣeé ṣe kí ó jẹ́ ẹja kéékèèké.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn, láì sọ ọ́ di àbájáde ọgbọ́n líle ju bí Gíríìkì ṣe béèrè lọ.
- source_word: τοὺς ἄρτους
  choice: àwọn ìṣù búrẹ́dì náà
  rationale: Ọ̀pọ̀ ἄρτος ní àyíká ìtàn yìí tọ́ka sí àwọn ìṣù búrẹ́dì kọ̀ọ̀kan; ọ̀rọ̀ yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: εὐχαριστήσας
  choice: lẹ́yìn tí ó dúpẹ́
  rationale: Aorist participle náà fi hàn pé ìdúpẹ́ ṣẹlẹ̀ ṣáájú pípín; a kò fi ẹni tí Jésù dúpẹ́ lọ́wọ́ kún ọ̀rọ̀ náà nítorí Gíríìkì kò sọ ọ́ ní tààrà.
- source_word: διέδωκεν
  choice: ó pín wọn fún
  rationale: διαδίδωμι ní ìtumọ̀ pípín ohun káàkiri fún ọ̀pọ̀ ènìyàn; ‘wọn’ ń tọ́ka sí àwọn ìṣù búrẹ́dì náà.
- source_word: τοῖς ἀνακειμένοις
  choice: àwọn tí wọ́n jókòó láti jẹun
  rationale: Ọ̀rọ̀ Gíríìkì ń tọ́ka sí fífi ara tẹ̀ sílẹ̀ ní ìṣe àṣà jíjẹun ìgbà náà. ‘Jókòó láti jẹun’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan pamọ́.
- source_word: ὁμοίως καὶ
  choice: Bẹ́ẹ̀ náà ni ó ṣe pẹ̀lú
  rationale: Ó pa ìbáramu tí Gíríìkì fi hàn láàárín pípín búrẹ́dì àti pípín ẹja mọ́, ó sì ń dun bí Yorùbá àdánidá.
- source_word: ἐκ τῶν ὀψαρίων
  choice: pẹ̀lú àwọn ẹja náà
  rationale: ὀψάριον lè túmọ̀ sí ẹja tí a ń jẹ pẹ̀lú búrẹ́dì, ó sì lè jẹ́ ẹja kéékèèké; ‘ẹja’ kò fi ìwọ̀n tí ọ̀rọ̀ náà kò fi dandan mú wọlé.
- source_word: ὅσον ἤθελον
  choice: iye tí wọ́n fẹ́
  rationale: Ó fi hàn pé olúkúlùkù rí ìwọ̀n oúnjẹ tí ó fẹ́ gbà, ní ọ̀nà Yorùbá tó rọrùn tí ó sì péye.
theological_decisions:
- issue: Ìṣe ìdúpẹ́ (εὐχαριστήσας) lè mú kí oníkàntọ́ka sí Oúnjẹ Alẹ́ Olúwa.
  choice: lẹ́yìn tí ó dúpẹ́
  alternative: lẹ́yìn tí ó súre sí i; tàbí fífi ìtumọ̀ sakramenti hàn gbangba
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé ó dúpẹ́. Bí ó tilẹ̀ jẹ́ pé ìtàn náà lè ní ìró ìtumọ̀ Oúnjẹ Alẹ́ Olúwa, ìtumọ̀ kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí ní tààrà sínú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ó jẹ́ èdè òde òní, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé lasán. A lo ‘jókòó láti jẹun’ nínú ọ̀rọ̀ pàtàkì fún ìṣàn èdè àdánidá, a sì pa àwòrán Gíríìkì ti rírògbọ̀kú mọ́ nínú àlàyé ìsàlẹ̀.
