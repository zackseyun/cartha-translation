  naturalness: Ìṣàtúnṣe náà lo ‘búrẹ́dì,’ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, àti ‘ń fún ayé ní ìyè,’ èyí tí ó rọrùn, tí ó sì jẹ́ gírámà Yorùbá àdánidá.
  terminology: ‘Búrẹ́dì Ọlọ́run’ pa ἄρτος τοῦ θεοῦ mọ́ láì sọ ìbátan genitive di ‘látọ̀dọ̀ Ọlọ́run.’ ‘Ẹni tí’ ń pa ìtọ́ka ti ara ẹni mọ́, láì fi ìdánimọ̀ ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà.
