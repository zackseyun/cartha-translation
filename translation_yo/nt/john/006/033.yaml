id: JHN.6.33
reference: John 6:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: yo
  text: Nítorí búrẹ́dì Ọlọ́run ni ẹni tí ó ń sọ̀kalẹ̀ láti ọ̀run, tí ó sì ń fún ayé ní ìyè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó ń sọ̀kalẹ̀ láti ọ̀run, tí ó sì ń fún ayé ní ìyè.” A lè ka gbólóhùn Gíríìkì náà ní ọ̀nà tí kò tọ́ka sí ẹni kan ní tààrà, ṣùgbọ́n àwọn apá-ìṣe náà wà ní ìbálòpọ̀ akọ ní Gíríìkì, èyí sì ń ṣètìlẹ́yìn fún ìtọ́ka sí ẹni kan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: oúnjẹ
  rationale: Ní Yorùbá, “oúnjẹ” ni ọ̀rọ̀ àdánidá tí a sábà máa ń lò fún bread, ó sì jẹ́ kí àkàwé inú ọ̀rọ̀ yìí ṣe kedere láì sọ ọ́ di ọ̀rọ̀ gbogbogbò ju.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìṣọ̀kan “oúnjẹ Ọlọ́run” pa ìbátan genitive mọ́, kò sì pinnu bóyá ohun tí Ọlọ́run ní ni tàbí ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá.
- source_word: ὁ καταβαίνων
  choice: ẹni náà tí ó ń sọ̀kalẹ̀
  rationale: “Ẹni náà” fi ìtọ́ka sí ẹni hàn gẹ́gẹ́ bí participle akọ ẹyọ kan nínú Gíríìkì; “ń sọ̀kalẹ̀” sì pa ipa present participle mọ́ ní Yorùbá àdánidá.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ìpilẹ̀ tàbí ibi tí ẹni náà ti ń sọ̀kalẹ̀ wá.
- source_word: ζωὴν
  choice: ìyè
  rationale: “Ìyè” pa ọ̀rọ̀ pàtàkì inú Ìhìn Rere Jòhánù mọ́ ní kúkúrú, ọ̀nà ọlọ́lá.
- source_word: διδοὺς
  choice: ń fi ... fún
  rationale: Ìtúmọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì mú ìṣe tí ń bá a lọ tí participle náà ní jáde.
- source_word: τῷ κόσμῳ
  choice: ayé
  rationale: “Ayé” pa fífẹ̀ κόσμος mọ́ láì dín un kù sí aráyé nìkan tàbí sí ẹ̀ka ẹ̀kọ́ ìgbàgbọ́ kan.
- source_word: γὰρ
  choice: Nítorí
  rationale: “Nítorí” so ẹsẹ yìí mọ́ àlàyé tó ṣáájú gẹ́gẹ́ bí ìdí tàbí ìṣàlàyé.
theological_decisions:
- issue: Ìtọ́ka sí ẹni tàbí ohun kan nínú ὁ καταβαίνων ... καὶ ζωὴν διδοὺς
  choice: 'Lílo èdè ẹni: “ẹni náà tí ó ń sọ̀kalẹ̀ láti ọ̀run, tí ó sì ń fi ìyè fún ayé.”'
  alternative: “ohun tí ó ń sọ̀kalẹ̀ láti ọ̀run, tí ó sì ń fi ìyè fún ayé”
  rationale: Àwọn participle náà jẹ́ akọ, ẹyọ kan, wọ́n sì ní article; èyí ń tọ́ka sí ẹni kan ní ti gírámà àti ní àyíká ọ̀rọ̀ Jòhánù, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- issue: Ìwọ̀n ìtumọ̀ κόσμος
  choice: Pa “ayé” mọ́.
  alternative: “aráyé” tàbí “gbogbo ènìyàn”
  rationale: “Ayé” pa fífẹ̀ ọ̀rọ̀ náà àti ìnira ẹ̀kọ́ ìgbàgbọ́ tó wà nínú rẹ̀ mọ́, láì sọ ìwọ̀n tàbí bí fífún ìyè náà ṣe ń ṣiṣẹ́ ní pàtó.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. “Ẹni náà” mú ìtọ́ka ti ara ẹni jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀nà àìtọ́ka sí ẹni kan mọ́.
