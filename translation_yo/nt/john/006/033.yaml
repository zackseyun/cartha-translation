revisions:
- from: Nítorí oúnjẹ Ọlọ́run ni ẹni náà tí ó ń sọ̀kalẹ̀ láti ọ̀run, tí ó sì ń fi ìyè fún ayé.[a]
  to: Nítorí búrẹ́dì Ọlọ́run ni ẹni tí ó ń sọ̀kalẹ̀ láti ọ̀run, tí ó sì ń fún ayé ní ìyè.[a]
  rationale: A rọ́pò ‘oúnjẹ’ pẹ̀lú ‘búrẹ́dì’ láti pa ìtumọ̀ pàtó ἄρτος àti àkàwé Jòhánù 6 mọ́. A tún ṣàtúnṣe ọ̀nà fífún ìyè sí ‘ń fún ayé ní ìyè’ fún Yorùbá tí ó dára sí i, a sì mú ìtumọ̀ akọ-gírámà inú àlàyé ìsàlẹ̀ ojú ìwé ṣe kedere.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:09Z'
