id: JHN.6.46
reference: John 6:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: yo
  text: Kì í ṣe pé ẹnikẹ́ni ti rí Baba, bí kò ṣe ẹni tí ó wá láti ọ̀dọ̀ Ọlọ́run[a]; òun ni ó ti rí Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti iwájú Ọlọ́run” tàbí “pẹ̀lú Ọlọ́run.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìsúnmọ́ ara ẹni, bákan náà sì ni ó lè tọ́ka sí orísun.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Kì í ṣe pé
  rationale: Ó ṣe àlàyé àtúnṣe sí ọ̀rọ̀ tó ṣáájú, kì í ṣe gbólóhùn okùnfà; èyí sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Èyí ni ìlò Johanu fún Ọlọ́run gẹ́gẹ́ bí Baba; lẹ́tà ńlá fi hàn pé orúkọ oyè Ọlọ́run ni láìfi ìtumọ̀ kún un.
- source_word: ἑώρακέν τις
  choice: ẹnikẹ́ni ti rí
  rationale: Nínú gbólóhùn àìgbọ́dọ̀ yìí, τις túmọ̀ sí ‘ẹnikẹ́ni’; ‘ti rí’ sì ń pa ipa perfect mọ́, ìṣe tí ó ti ṣẹlẹ̀ tí ó sì ní ìjẹ́pàtàkì títí di ìsinsìnyí.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Níhìn-ín, ó fi ẹni kan yà sọ́tọ̀ gẹ́gẹ́ bí àfiṣe, kì í ṣe ipò àdéhùn.
- source_word: ὁ ὢν
  choice: ẹni tí ó wá
  rationale: Ó ń dá ẹni náà mọ̀ nípa ìbáṣepọ̀ tàbí orísun rẹ̀; pẹ̀lú παρὰ τοῦ θεοῦ, ‘ẹni tí ó wá láti ọ̀dọ̀ Ọlọ́run’ jẹ́ Yorùbá àdánidá tí ó pa èrò orísun mọ́.
- source_word: παρὰ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: παρά pẹ̀lú genitive lè tọ́ka sí orísun àti ìsúnmọ́ ẹni; ‘láti ọ̀dọ̀ Ọlọ́run’ jẹ́ àdánidá, ó sì lè gbé ìtumọ̀ méjèèjì díẹ̀ ju ‘láti inú Ọlọ́run’ lọ.
- source_word: οὗτος
  choice: òun ni
  rationale: Ó tọ́ka padà sí ẹni tí a ṣẹ̀ṣẹ̀ dárúkọ pẹ̀lú ìtẹnumọ́; ‘òun ni’ pa ìtẹnumọ́ náà mọ́ ní Yorùbá.
- source_word: ἑώρακεν
  choice: ó ti rí
  rationale: ‘ti rí’ ṣàfihàn perfect Gíríìkì gẹ́gẹ́ bí ìṣe tí ó parí ṣùgbọ́n tí ìjẹ́pàtàkì rẹ̀ ṣì wà.
theological_decisions:
- issue: Ìbáṣepọ̀ Ọmọ sí Ọlọ́run nínú παρὰ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  alternative: ní iwájú Ọlọ́run; pẹ̀lú Ọlọ́run
  rationale: Àṣàyàn yìí pa ìjẹ́rìí nípa orísun àti ìbáṣepọ̀ aláìlẹ́gbẹ́ ẹni náà mọ́, láìfi ẹ̀kọ́ nípa ìwà Ọlọ́run tí gbólóhùn náà kò sọ ní tààrà kún un. Àlàyé ìsàlẹ̀ pa ìtumọ̀ ìsúnmọ́ ara ẹni mọ́ gẹ́gẹ́ bí ohun tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘láti ọ̀dọ̀’ láti yàgò fún ìtumọ̀ pé ẹni náà jẹ́ apá kan tí a yọ lára Ọlọ́run, nígbà tí a ṣì pa ìtumọ̀ orísun àti ìsúnmọ́ mọ́.
