  terminology: ‘Olúwa’ jẹ́ ìtumọ̀ tó yẹ fún Κύριε, ó sì bá ìlò Johanu àti ìlànà iṣẹ́ náà mu. ‘Ìyè àìnípẹ̀kun’ jẹ́ ìtumọ̀ tí ó wọ́pọ̀, tí ó sì ṣe kedere fún ζωὴ αἰώνιος. Àlàyé ìsàlẹ̀ yẹ kí ó sọ àṣàyàn ‘Ọ̀gá’ ní Yorùbá tí ó rọrùn sí i, kí ó má sì sọ ohun tó ju ẹ̀rí ọ̀rọ̀ náà lọ.
