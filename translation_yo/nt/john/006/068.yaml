  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: yo
  text: Símónì Pétérù dá a lóhùn pé, “Olúwa[a], ọ̀dọ̀ ta ni àwa yóò lọ? Ìwọ ní àwọn ọ̀rọ̀ ìyè àìnípẹ̀kun,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí a fi ń pe ẹnì kan, ṣùgbọ́n “Olúwa” bá ìlò ọ̀rọ̀ náà nínú Johanu níbí mu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: dá a lóhùn
  rationale: Ọ̀nà Yorùbá àdánidá fún fífi ìdáhùn sí ẹni kan; “a” ń tọ́ka sí Jésù.
- source_word: Σίμων Πέτρος
  choice: Símónì Pétérù
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ ọ̀wọ̀ àti ìwọ̀n ẹ̀kọ́ nípa ẹni Kristi mọ́, ó sì jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún κύριος.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: ọ̀dọ̀ ta ni àwa yóò lọ?
  rationale: “Ọ̀dọ̀ ta” mú ìtọ́kasí sí ènìyàn nínú πρὸς τίνα hàn lọ́nà Yorùbá àdánidá, “yóò lọ” sì pa ọjọ́ iwájú ọ̀rọ̀-ìṣe náà mọ́.
- source_word: ῥήματα
  choice: àwọn ọ̀rọ̀
  rationale: Ó pa ọ̀pọ̀ nǹkan ti ῥήματα mọ́, ó sì bá àyíká ọ̀rọ̀ ẹnu mu.
- source_word: ζωῆς αἰωνίου
  choice: ìyè àìnípẹ̀kun
  rationale: Ìtumọ̀ Yorùbá tí ó ṣe kedere fún ọ̀rọ̀ pàtàkì Johanu nípa ìyè tí kò ní òpin.
- source_word: ἔχεις
  choice: Ìwọ ni ó ní
  rationale: Ó túmọ̀ ìní náà ní tààrà, ìṣáájú “Ìwọ” àti ẹ̀ka ìfọkànsìn “ni” sì mú agbára ìdáhùn Pétérù hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Agbára Κύριε gẹ́gẹ́ bí ọ̀rọ̀ àkọ́lé tí Pétérù fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” lè jẹ́ ọ̀rọ̀ ọ̀wọ̀, ó sì tún pa ìtumọ̀ jinlẹ̀ nípa ẹni Kristi nínú Johanu mọ́ láìfi ohun tí ọ̀rọ̀ náà kò sọ kún un. Àlàyé ìsàlẹ̀ fi àṣàyàn “Ọ̀gá” hàn.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìbéèrè Pétérù àti ọ̀pọ̀ nǹkan nínú “àwọn ọ̀rọ̀” mọ́.
