  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì mọ́: Pétérù dá Jésù lóhùn, ó pè é ní Κύριε, ìbéèrè náà tọ́ sí ènìyàn kan (‘ọ̀dọ̀ ta’), ọjọ́ iwájú wà nínú ‘yóò lọ,’ àti ‘àwọn ọ̀rọ̀ ìyè àìnípẹ̀kun’ pa ọ̀pọ̀ ῥήματα àti gbolohun ζωῆς αἰωνίου mọ́. Ṣùgbọ́n ìtumọ̀ ‘Ìwọ ni ó ní’ fi ìfojúsùn alágbára kún ọ̀rọ̀ náà ju ohun tí ἔχεις fúnra rẹ̀ béèrè lọ.'
