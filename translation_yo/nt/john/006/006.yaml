id: JHN.6.6
reference: John 6:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: yo
  text: Ṣùgbọ́n ó ń sọ èyí láti dán an wò[a], nítorí òun fúnra rẹ̀ mọ ohun tí yóò ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti yẹ̀ ẹ́ wò.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí dídán ẹni wò láti mú un ṣubú, ṣùgbọ́n níhìn-ín ó túmọ̀ sí láti dán an wò tàbí láti yẹ̀ ẹ́ wò.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí tọ́ka sí ìbéèrè tí Jésù ṣẹ̀ṣẹ̀ béèrè.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín ìbéèrè Jésù àti àlàyé ìdí tí ó fi béèrè rẹ̀.
- source_word: ἔλεγεν
  choice: ó ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì ń fi ìṣe tí ń lọ lọ́wọ́ hàn; ‘ó ń sọ’ pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: πειράζων
  choice: láti dán an wò
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí fífi Fílípì yẹ̀ wò tàbí dán ìmòye rẹ̀ wò, kì í ṣe títàn án sínú ẹ̀ṣẹ̀.
- source_word: αὐτόν
  choice: an
  rationale: Ó tọ́ka sí Fílípì gẹ́gẹ́ bí ẹni tí Jésù ń dán wò.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò Gíríìkì mọ́ pé Jésù fúnra rẹ̀ ti mọ ohun tí yóò ṣe.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí Jésù fi sọ ọ̀rọ̀ náà.
- source_word: ᾔδει
  choice: mọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ìrísí ọ̀rọ̀ náà jọ pluperfect, ó ní ìtumọ̀ ipò àtijọ́ nínú Koine; ‘mọ’ jẹ́ èdè Yorùbá àdánidá ní àkópọ̀ yìí.
- source_word: τί
  choice: ohun tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkóónú ohun tí Jésù mọ̀.
- source_word: ἔμελλεν ποιεῖν
  choice: fẹ́ ṣe
  rationale: μέλλω pẹ̀lú infinitive lè fi ohun tí ó sún mọ́lé tàbí ohun tí a pinnu hàn. ‘fẹ́ ṣe’ jẹ́ àdánidá, ó sì pa èrò ìṣe tó ń bọ̀ mọ́ láìfi ìtumọ̀ àfikún lé e.
theological_decisions:
- issue: Ìtumọ̀ πειράζων nípa ohun tí Jésù ṣe sí Fílípì
  choice: láti dán an wò
  alternative: láti dẹ̀ ẹ́ wò; láti dán an síwò
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Jésù ń yẹ ìmòye tàbí ìgbàgbọ́ Fílípì wò, kì í ṣe pé ó ń fà á sínú búburú.
- issue: Ìtẹnumọ́ ìmọ̀ Jésù ṣáájú ìṣe náà
  choice: òun fúnra rẹ̀ mọ
  alternative: ó mọ
  rationale: αὐτὸς jẹ́ ohun ìtẹnumọ́; fífi ‘òun fúnra rẹ̀’ sílẹ̀ pa ìtẹnumọ́ orísun mọ́ láìṣàfikún ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘dán an wò’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, a sì pa ìtẹnumọ́ ‘òun fúnra rẹ̀’ mọ́. Àmì ohùn ni a fi sí ibi tí ó bá yẹ.
