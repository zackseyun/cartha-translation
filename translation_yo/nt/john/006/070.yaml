id: JHN.6.70
reference: John 6:70
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: yo
  text: Jésù dá wọn lóhùn pé, “Ṣé èmi kọ́ ni mo yan ẹ̀yin méjìlá náà? Síbẹ̀, ọ̀kan nínú yín jẹ́ èṣù[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olùfisùn èké.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tó ń fẹ̀sùn èké kan ẹlòmíràn tàbí, ní ọ̀pọ̀ àyíká, Èṣù. Níhìn-ín, ọ̀rọ̀ náà ń ṣàpèjúwe irú ẹni tí ó jẹ́; kì í sì í dá ẹni náà mọ̀ tààràtà gẹ́gẹ́ bí Sátánì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù dá wọn lóhùn pé
  rationale: “Dá … lóhùn” jẹ́ ọ̀nà Yorùbá àdánidá fún ìdáhùn nínú ìjíròrò, ó sì pa ẹni tí ó dáhùn àti àwọn tí ó ń bá sọ̀rọ̀ mọ́.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: Ṣé èmi kọ́ ni mo yan ...?
  rationale: Ìbéèrè àsọyé yìí ń retí ìdáhùn ìjẹ́wọ́; “Ṣé èmi kọ́ ni” mú ìtẹnumọ́ ἐγώ àti agbára ìbéèrè Gíríìkì jáde lọ́nà Yorùbá àdánidá.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: ẹ̀yin méjìlá náà
  rationale: “Náà” fi hàn pé àwọn méjìlá tí a mọ̀ gẹ́gẹ́ bí ẹgbẹ́ kan ni a ń tọ́ka sí, láìsọ ọ́ di oyè tí kò wọ́pọ̀ ní Yorùbá.
- source_word: καὶ
  choice: Síbẹ̀
  rationale: Nínú àyíká yìí καὶ ń fi ìyàtọ̀ hàn láàárín yíyan àwọn méjìlá àti bí ọ̀kan nínú wọn ṣe jẹ́ èṣù; “Síbẹ̀” sọ ìyàtọ̀ náà ní kedere láìgbọ́rọ̀ sí i.
- source_word: ἐξ ὑμῶν εἷς
  choice: ọ̀kan nínú yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún ìtumọ̀ apá-kúrò-nínú-àpapọ̀ ti ἐξ ὑμῶν.
- source_word: διάβολός
  choice: èṣù
  rationale: “Èṣù” pa agbára ọ̀rọ̀ Gíríìkì mọ́ ju yíyan “olùfisùn èké” nínú ẹsẹ̀ pàtàkì lọ. Ìṣètò “jẹ́ èṣù” jẹ́ àpèjúwe ànímọ́ níbí, kì í ṣe dandan pé ẹni náà gan-an ni Sátánì.
theological_decisions:
- issue: Bóyá διάβολός ń dá ẹni náà mọ̀ pẹ̀lú Sátánì tàbí ó ń ṣàpèjúwe ìwà rẹ̀
  choice: ọ̀kan nínú yín jẹ́ èṣù
  alternative: ọ̀kan nínú yín jẹ́ olùfisùn èké
  rationale: Orúkọ náà kò ní àtíkù Gíríìkì ní ipò àpèjúwe yìí, nítorí náà a pa agbára àti àìdánilójú ọ̀rọ̀ náà mọ́ láìsọ pé ẹni náà jẹ́ Sátánì fúnra rẹ̀. Àlàyé ìsàlẹ̀ ojú ìwé fi ìtumọ̀ ọ̀rọ̀ míì hàn.
translation_notes:
  register: A lo Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè ìjíròrò tó ṣe kedere. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; “Ṣé èmi kọ́ ni” àti “dá wọn lóhùn” jẹ́ àwọn ìṣètò Yorùbá òde òní tó jẹ́ àdánidá.
