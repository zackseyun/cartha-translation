language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: yo
  text: Ẹni tí ó bá gbà á gbọ́, a kì í dá a lẹ́jọ́[a]; ṣùgbọ́n ẹni tí kò bá gbà á gbọ́, a ti dá a lẹ́jọ́ tẹ́lẹ̀, nítorí kò gbàgbọ́ nínú orúkọ Ọmọ kan ṣoṣo ti Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kì í dálẹ́bi rẹ̀.” Ọ̀rọ̀ Gíríìkì κρίνω lè túmọ̀ sí “dá lẹ́jọ́” tàbí, nínú àyíká yìí, “dálẹ́bi.”
    reason: lexical_alternative
  - marker: b
    text: “Ọmọ kan ṣoṣo” tún lè jẹ́ “Ọmọ aláìlẹ́gbẹ́”; gẹ́gẹ́ bí ìtumọ̀ àṣà, “Ọmọ tí a bí níkan ṣoṣo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: Ẹni tí ó bá gba òun gbọ́
  rationale: Àkópọ̀ ọ̀rọ̀ alábápín oníṣe tí ó ní àpilẹ̀kọ ń tọ́ka sí ẹnikẹ́ni tí ó ní ìgbàgbọ́; ‘gba … gbọ́’ ni ọ̀nà Yorùbá àdánidá fún ìgbẹ́kẹ̀lé ẹni kan.
- source_word: οὐ κρίνεται
  choice: a kì í dá a lẹ́jọ́
  rationale: κρίνω ní ìtumọ̀ ìdájọ́ nínú àyíká ọ̀rọ̀ yìí. Ọ̀rọ̀ yìí pa ìtẹnumọ́ ìdájọ́ mọ́ láì fi ‘dálẹ́bi’ tó túmọ̀ sí ìdájọ́ búburú nìkan mú un dín.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: ṣùgbọ́n ẹni tí kò bá gbà á gbọ́
  rationale: δέ fi ìyàtọ̀ hàn, a sì tún ṣe alábápín náà gẹ́gẹ́ bí ẹni tí a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ἤδη κέκριται
  choice: ni a ti dá lẹ́jọ́ ná
  rationale: ‘ti dá’ fi agbára àsìkò pípé hàn—ìdájọ́ ti ṣẹlẹ̀, ipò rẹ̀ sì wà ní báyìí; ‘ná’ mú ἤδη jáde gẹ́gẹ́ bí ‘tẹ́lẹ̀ rí/ní báyìí gan-an’ ní Yorùbá àdánidá.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: nítorí kò … gbọ́
  rationale: ὅτι fúnni ní ìdí. Nínú Yorùbá, ‘kò … gbọ́’ jẹ́ àdánidá, àyíká ọ̀rọ̀ sì mú ipò àìgbàgbọ́ tó ń bá a lọ hàn.
- source_word: εἰς τὸ ὄνομα
  choice: gba orúkọ … gbọ́
  rationale: A pa ‘orúkọ’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtó ti Jòhánù, tí ó dúró fún ẹni náà bí a ti fi í hàn àti ọlá-àṣẹ rẹ̀.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: Ọmọ kan ṣoṣo ti Ọlọ́run
  rationale: μονογενής tẹnumọ́ pé Ọmọ náà dá ṣókí, kò sí ẹlòmíràn bí rẹ̀; ‘Ọmọ kan ṣoṣo’ jẹ́ kedere, ó sì yẹra fún ìtumọ̀ ìbímọ̀ nípa ti ara tí Gíríìkì kò fi dandan béèrè.
theological_decisions:
- issue: Ìtumọ̀ κρίνω ní ẹsẹ yìí
  choice: dá lẹ́jọ́ ní gbogbo ibi méjèèjì
  alternative: dálẹ́bi
  rationale: ‘Dá lẹ́jọ́’ pa ìtumọ̀ gbooro ti κρίνω àti àìdánilójú rẹ̀ mọ́, bí ó tilẹ̀ jẹ́ pé àyíká Jòhánù 3:17–19 lè tọ́ka sí ìdájọ́ búburú. Àlàyé ìsàlẹ̀ fi ‘dálẹ́bi’ hàn gẹ́gẹ́ bí àṣàyàn.
- issue: Ìtumọ̀ μονογενής
  choice: Ọmọ kan ṣoṣo
  alternative: Ọmọ tí a bí níkan ṣoṣo; Ọmọ aláìlẹ́gbẹ́
  rationale: Yíyan yìí fi àrà-ọ̀tọ̀ Ọmọ hàn láì fi ọ̀rọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún Gíríìkì. Àṣà ‘tí a bí níkan ṣoṣo’ ni a pa mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo ‘òun’ ní ìdáhùn àkọ́kọ́ láti jẹ́ kí ẹni tí αὐτόν ń tọ́ka sí ṣe kedere, a sì lo ‘á’ lẹ́yìn náà ní ọ̀nà àdánidá. Ilana gbolohun pa ìtakora àti agbára àsìkò pípé Gíríìkì mọ́.
