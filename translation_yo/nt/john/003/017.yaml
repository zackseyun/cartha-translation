id: JHN.3.17
reference: John 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: yo
  text: Nítorí Ọlọ́run kò rán Ọmọ náà sí inú ayé kí ó lè ṣe ìdájọ́ ayé[a], ṣùgbọ́n kí a gba ayé là nípasẹ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó lè dá ayé lẹ́bi.” Nínú àyíká ọ̀rọ̀, a lè tú ọ̀rọ̀-ìṣe Gíríìkì náà sí ìtumọ̀ tó dín kù yìí, ṣùgbọ́n ìtumọ̀ ìpìlẹ̀ rẹ̀ ni “ṣe ìdájọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí ... kò
  rationale: “Nítorí” fi agbára àlàyé γάρ hàn, ó sì so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú; “kò” sì tako ọ̀rọ̀-ìṣe náà ní ti ẹ̀dá.
- source_word: ἀπέστειλεν
  choice: rán
  rationale: “Rán” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ fún fífi ẹnì kan lọ pẹ̀lú ète kan, láìfi ìtumọ̀ iṣẹ́ àṣẹ tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni orúkọ Yorùbá tó ṣe déédé fún Θεός ní àyíká ọ̀rọ̀ yìí.
- source_word: τὸν υἱὸν
  choice: Ọmọ náà
  rationale: Gíríìkì ní “Ọmọ náà,” kì í ṣe “Ọmọ rẹ̀” ní tààràtà; yíyan èyí pa ìrísí oyè àti ìbátan tó hàn nínú àyíká ọ̀rọ̀ mọ́.
- source_word: εἰς τὸν κόσμον
  choice: sí inú ayé
  rationale: “Sí inú ayé” fi ìṣípò wọ inú àgbègbè ayé tí εἰς ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: kí ó lè ṣe ìdájọ́ ayé
  rationale: “Ṣe ìdájọ́” pa ìtumọ̀ gbòòrò κρίνω mọ́ ju “dá lẹ́bi” lọ; “kí ó lè” sì fi ète tí ἵνα pẹ̀lú subjunctive ń sọ hàn.
- source_word: ἀλλ’ ἵνα
  choice: bí kò ṣe kí
  rationale: Gbólóhùn yìí fi ìyàtọ̀ ète tó lágbára hàn, ó sì bá ìlànà Yorùbá mu.
- source_word: σωθῇ
  choice: lè rí ìgbàlà
  rationale: Ìṣẹ̀dá yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ayé gba ìgbàlà, ó sì pa ìtumọ̀ ìgbàlà àti ìdáǹdè tó wà nínú σῴζω mọ́.
- source_word: ὁ κόσμος
  choice: ayé
  rationale: A lo “ayé” ní gbogbo ibi tí κόσμος ti fara hàn, kí àtúnlò ọ̀rọ̀ náà àti ìtumọ̀ rẹ̀ tó gbòòrò má bàa sọnù.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: “Nípasẹ̀ rẹ̀” fi ọ̀nà tàbí aṣojú tí διά pẹ̀lú genitive ń tọ́ka sí hàn láìtúmọ̀ rẹ̀ ré kọjá ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Ìtumọ̀ κρίνῃ ní ìyàtọ̀ sí σωθῇ
  choice: ṣe ìdájọ́
  alternative: dá lẹ́bi
  rationale: κρίνω ní ìtumọ̀ gbòòrò ti ṣíṣe ìdájọ́, bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè mú kí a lóye rẹ̀ gẹ́gẹ́ bí dídá lẹ́bi. Yíyan “ṣe ìdájọ́” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìbú ọ̀rọ̀ Gíríìkì mọ́; àṣàyàn tó dín kù wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbo ni a lò. Àmì ohùn kún ún ní ibi tó bá yẹ. Ìtòlẹ́sẹẹsẹ “bí kò ṣe kí” pa ìfarawé àwọn gbólóhùn ète méjèèjì mọ́.
