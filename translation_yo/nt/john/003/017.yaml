  verdict: revise
  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní ìbáṣepọ̀ ‘Nítorí ... kò rán,’ ìtúnlò ‘ayé,’ àti ìyàtọ̀ ète láàárín ìdájọ́ àti ìgbàlà. Síbẹ̀, ‘kí ayé lè rí ìgbàlà’ kì í fi passive σωθῇ (‘kí a gba ayé là’) hàn ní tààràtà tó; ó lè túmọ̀ sí pé ayé kan rí ohun kan. Àtúnṣe náà mú ìgbàlà ayé hàn gẹ́gẹ́ bí ète/àbájáde tí Ọmọ ń mú wá, láìfi ẹ̀kọ́ mìíràn kún un.
  naturalness: ‘Kí a gba ayé là nípasẹ̀ rẹ̀’ jẹ́ ọ̀nà Yorùbá ìgbàlódé, ti ẹ̀sìn sì mọ̀, láti sọ passive ‘kí ayé lè là.’ ‘Ṣùgbọ́n’ sì jẹ́ ìsopò ìyàtọ̀ tó rọrùn, tó sì ṣe déédé fún ἀλλά.
  terminology: ‘Ọlọ́run,’ ‘Ọmọ náà,’ ‘ayé,’ ‘ṣe ìdájọ́,’ àti ‘nípasẹ̀ rẹ̀’ yẹ. A pa ‘ṣe ìdájọ́’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́, kí ìtumọ̀ κρίνω má bàa di ‘dá lẹ́bi’ nìkan; aṣàyàn yẹn wà nínú àlàyé ìsàlẹ̀.
