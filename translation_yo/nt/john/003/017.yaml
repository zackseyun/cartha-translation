revisions:
- from: Nítorí Ọlọ́run kò rán Ọmọ náà sí inú ayé kí ó lè ṣe ìdájọ́ ayé[a], bí kò ṣe kí ayé lè rí ìgbàlà nípasẹ̀ rẹ̀.
  to: Nítorí Ọlọ́run kò rán Ọmọ náà sí inú ayé kí ó lè ṣe ìdájọ́ ayé[a], ṣùgbọ́n kí a gba ayé là nípasẹ̀ rẹ̀.
  rationale: Àtúnṣe pàtàkì náà rọ́pò ‘kí ayé lè rí ìgbàlà’ pẹ̀lú ‘kí a gba ayé là,’ kí passive σωθῇ àti ìtumọ̀ σῴζω hàn ní kedere. A tún mú ìsọ̀rọ̀ àlàyé ìsàlẹ̀ ṣe kedere, nípa pípa ‘ṣe ìdájọ́’ mọ́ gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́ àti fífi ‘dá ayé lẹ́bi’ sílẹ̀ gẹ́gẹ́ bí aṣàyàn àyíká ọ̀rọ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:44Z'
