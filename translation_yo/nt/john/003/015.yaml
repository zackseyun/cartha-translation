translation:
  language: yo
  text: kí gbogbo ẹni tí ó bá gbàgbọ́ nínú rẹ̀[a][b] lè ní ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹnikẹ́ni tí ó bá gbàgbọ́.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan túmọ̀ gbólóhùn yìí sí “sínú rẹ̀,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí jẹ́ “nínú rẹ̀” (ἐν αὐτῷ).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí
  rationale: “Kí” ṣe àfihàn ète tàbí àbájáde gbólóhùn tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: πᾶς ὁ πιστεύων
  choice: olúkúlùkù ẹni tí ó bá gbàgbọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ti gbogbo ẹni tí ó bá ní ìgbàgbọ́; “olúkúlùkù ẹni” pa ìwọ̀n gbogbogbò àti ìtumọ̀ alábápín náà mọ́.
- source_word: πιστεύων
  choice: tí ó bá gbàgbọ́
  rationale: “Gbàgbọ́” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún πιστεύω ní àyíká Jòhánù; ẹ̀ka “tí ó bá” tún bá ìtumọ̀ gbogbogbò náà mu láì sọ ọ́ di ìṣe tó ṣẹlẹ̀ lẹ́ẹ̀kan ṣoṣo.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: “Nínú rẹ̀” tẹ̀lé ἐν ní tààrà, kò sì fi εἰς (“sínú rẹ̀”) rọ́pò ọ̀rọ̀ inú ẹ̀dà Gíríìkì. Arọ́pò-orúkọ náà tún pa ẹni tí “rẹ̀” ń tọ́ka sí mọ́ gẹ́gẹ́ bí àyíká ṣe gbé e kalẹ̀.
- source_word: ἔχῃ
  choice: lè ní
  rationale: “Lè ní” ṣàfihàn subjunctive tó wà lẹ́yìn ἵνα, ó sì bá ìgbékalẹ̀ ète mu láì fi àìdánilójú tí kò sí nínú Gíríìkì kún un.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì gba ìtẹ̀síwájú ìyè láìlópin àti ànímọ́ ìyè ọjọ́ iwájú tí αἰώνιος lè ní nínú Jòhánù.
theological_decisions:
- issue: Bí a ṣe túmọ̀ gbólóhùn ìgbàgbọ́ Jòhánù ἐν αὐτῷ
  choice: nínú rẹ̀
  alternative: sínú rẹ̀
  rationale: Ẹ̀dà Gíríìkì ní ἐν, kì í ṣe εἰς. Nítorí náà, a pa ọ̀rọ̀ orísun mọ́ dípò kí a mú ìlò míràn tó wọ́pọ̀ nínú Jòhánù wọ inú ẹsẹ yìí.
- issue: Ìwọ̀n πᾶς ὁ πιστεύων
  choice: olúkúlùkù ẹni tí ó bá gbàgbọ́
  alternative: ẹnikẹ́ni tí ó bá gbàgbọ́
  rationale: Àṣàyàn àkọ́kọ́ tẹnumọ́ pé ọ̀rọ̀ náà kan gbogbo ẹni kọ̀ọ̀kan, nígbà tí àṣàyàn kejì jẹ́ ọ̀nà Yorùbá míràn tó ṣe àdánidá fún ìtumọ̀ gbogbogbò kan náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lásán. “Rẹ̀” kò fi ẹni tí arọ́pò-orúkọ Gíríìkì ń tọ́ka sí hàn ju bí orísun ṣe ṣe lọ.
