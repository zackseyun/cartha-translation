id: JHN.3.6
reference: John 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: yo
  text: Ohun tí a bí láti inú ẹran-ara jẹ́ ẹran-ara[a], ohun tí a sì bí láti inú Ẹ̀mí jẹ́ ẹ̀mí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohun tí a bí láti inú ẹran-ara jẹ́ ìwà ẹ̀dá ènìyàn.” Ọ̀rọ̀ Gíríìkì fún “ẹran-ara” lè túmọ̀ sí ìwà ènìyàn tí ẹ̀ṣẹ̀ ti bà jẹ́ ní àwọn àyíká kan; ṣùgbọ́n níhìn-ín, ìyàtọ̀ pàtàkì ni ìbí láti inú ẹran-ara àti ìbí láti inú Ẹ̀mí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun tí a bí láti inú Ẹ̀mí jẹ́ ti ẹ̀mí.” Gíríìkì ní “jẹ́ ẹ̀mí,” èyí tí ó pa ìyàtọ̀ irú rẹ̀ pẹ̀lú “ẹran-ara” mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: ohun tí a bí
  rationale: Àkójọpọ̀ àpilẹ̀kọ àti participle aláìṣe yìí jẹ́ ọ̀rọ̀ àpapọ̀, kì í ṣe ẹni kan pàtó. “Ohun tí a bí” jẹ́ Yorùbá àdánidá tí ó sì pa agbára òwe ìtumọ̀-gbogbo mọ́.
- source_word: ἐκ
  choice: láti inú
  rationale: Nínú ọ̀rọ̀ ìbí, “láti inú” fi orísun tàbí ibi tí ìbí ti wá hàn ní Yorùbá àdánidá.
- source_word: σάρξ / σαρκὸς
  choice: ẹran-ara
  rationale: “Ẹran-ara” pa àwòrán àti ìyàtọ̀ ọ̀rọ̀ Gíríìkì mọ́. Níhìn-ín, ìyàtọ̀ pàtàkì wà láàárín ìbí ènìyàn nípa ti ara àti ìbí láti inú Ẹ̀mí; “ìwà ẹlẹ́ṣẹ̀” yóò túmọ̀ rẹ̀ ju ohun tí àyíká ọ̀rọ̀ fi múlẹ̀ lọ.
- source_word: πνεύματος / πνεῦμά
  choice: Ẹ̀mí / ẹ̀mí
  rationale: Ìfarahàn àkọ́kọ́ ń tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí orísun ìbí, nítorí náà a kọ ọ́ ní lẹ́tà ńlá. Èkejì jẹ́ àpèjúwe irú ohun tí ìbí náà mú jáde; “ẹ̀mí” ní lẹ́tà kékeré pa ìyàtọ̀ oníwà-ìrú tí Gíríìkì ní mọ́ láì fi “ti ẹ̀mí” rọ́pò orúkọ náà.
- source_word: ἐστιν
  choice: jẹ́
  rationale: Ọ̀rọ̀ àsopọ̀ rírọrùn “jẹ́” pa ìṣètò kúkúrú, onítumọ̀-àlàyé ti ẹsẹ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú gbólóhùn àkọ́kọ́
  choice: ẹran-ara gẹ́gẹ́ bí ipò ìbí ènìyàn nípa ti ara
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé σάρξ lè ní ìtumọ̀ ìwà búburú ní àwọn àyíká kan, níhìn-ín Jesu ń fi ìbí nípa ti ara wé ìbí láti inú Ẹ̀mí. Yíyan “ìwà ẹlẹ́ṣẹ̀” yóò fi ìtumọ̀ ẹ̀kọ́ kan kún ọ̀rọ̀ tí àyíká kò béèrè.
- issue: Ohun tí πνεῦμα kejì ń tọ́ka sí
  choice: ẹ̀mí ní lẹ́tà kékeré
  alternative: Ẹ̀mí; tàbí ohun ti ẹ̀mí
  rationale: Predicate náà kò ní àpilẹ̀kọ nínú Gíríìkì, ó sì ní agbára àpèjúwe irú tàbí ìwà. Lẹ́tà kékeré fi Ẹ̀mí Mímọ́ gẹ́gẹ́ bí orísun yà sọ́tọ̀ kúrò nínú àbájáde ìbí náà, láì túmọ̀ orúkọ náà sí ajẹtífù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọlọ́lá tí ó ṣeé yé fún òǹkàwé òde òní. A lo “ẹran-ara” láti pa àwòrán Johanu àti ìforígbárí ìtumọ̀ rẹ̀ mọ́; a kò fi “ìwà ẹlẹ́ṣẹ̀” sínú àkọ́kọ́ tàbí “ohun ti ẹ̀mí” sínú kejì gẹ́gẹ́ bí ìtumọ̀ pàtàkì.
