source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: yo
  text: 'Nítorí Ọlọ́run fẹ́ràn ayé ní ọ̀nà yìí[a]: ó fi Ọmọ rẹ̀ kan ṣoṣo[b] fúnni, kí gbogbo ẹni tí ó bá gba a gbọ́ má bàa ṣègbé, ṣùgbọ́n kí ó ní ìyè àìnípẹ̀kun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, gẹ́gẹ́ bí a ti sábà máa ń túmọ̀ rẹ̀, “Nítorí Ọlọ́run fẹ́ràn ayé tó bẹ́ẹ̀ gẹ́ẹ́.” A lè lóye Gíríìkì náà gẹ́gẹ́ bí èyí tó tẹnu mọ́ ọ̀nà tí Ọlọ́run gbà fẹ́ràn ayé: “Ọlọ́run fẹ́ràn ayé ní ọ̀nà yìí.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí “Ọmọ rẹ̀ tí a bí kan ṣoṣo”; ó tún ṣeé ṣe: “Ọmọ rẹ̀ aláìlẹ́gbẹ́.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: ní ọ̀nà yìí
  rationale: Ó tọ́ka ní pàtàkì sí ọ̀nà tí Ọlọ́run gbà fi ìfẹ́ rẹ̀ hàn, èyí tí gbólóhùn tó tẹ̀ lé e ṣàlàyé.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára ìṣàlàyé tí ọ̀rọ̀ náà ní nínú àyíká ẹsẹ̀ tó ṣáájú mọ́.
- source_word: ἠγάπησεν
  choice: nífẹ̀ẹ́
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu láti sọ pé Ọlọ́run fẹ́ràn ayé; ó yẹra fún ìtumọ̀ ‘fẹ́’ gẹ́gẹ́ bí fífẹ́ ohun kan.
- source_word: τὸν κόσμον
  choice: ayé
  rationale: ‘Ayé’ pa ìfẹ̀ ọrọ̀ κόσμος mọ́ láì dín in kù sí aráyé nìkan.
- source_word: ὥστε
  choice: ': ó fi'
  rationale: Àmì olójú méjì jẹ́ kí gbólóhùn tó tẹ̀ lé e ṣàlàyé bí Ọlọ́run ṣe nífẹ̀ẹ́ ayé, ní èdè Yorùbá tó ṣe àdánidá.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: Ọmọ rẹ̀ kan ṣoṣo
  rationale: Ó fi ipò Ọmọ náà gẹ́gẹ́ bí ẹni aláìlẹ́gbẹ́ hàn, ó sì pa ìbátan Baba àti Ọmọ mọ́ láì fi èrò ìbímọ̀ nípa ti ara kún un.
- source_word: ἔδωκεν
  choice: fi ... fúnni
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ náà mọ́ ní gbòòrò, láì sọ pàtó bóyá ó ń tọ́ka sí wíwá Ọmọ sí ayé tàbí ikú rẹ̀ nìkan.
- source_word: ἵνα
  choice: kí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a fẹ́ hàn.
- source_word: πᾶς ὁ πιστεύων
  choice: gbogbo ẹni tí ó bá gba a gbọ́
  rationale: Ó pa ìtumọ̀ àpapọ̀ àti àìní ààlà ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá tó ṣe àdánidá.
- source_word: εἰς αὐτὸν
  choice: gba a gbọ́
  rationale: Èyí ni àṣà èdè Yorùbá tó wọ́pọ̀ fún gbígbàgbọ́ nínú ẹnì kan nínú irú àyíká yìí.
- source_word: μὴ ἀπόληται
  choice: má bàa ṣègbé
  rationale: Ó fi ète tí ἵνα àti subjunctive ń sọ hàn, ó sì pa ìwúwo ἀπόλλυμι mọ́ láì ṣàlàyé irú ìṣègbé náà ju ohun tí ẹsẹ̀ sọ lọ.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó yé kedere fún ìyè tí kò ní òpin, ó sì bá ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Jòhánù mu.
theological_decisions:
- issue: Ìtumọ̀ Οὕτως
  choice: ọ̀nà (‘ní ọ̀nà yìí’)
  alternative: ìwọ̀n tàbí agbára ìfẹ́ (‘tó bẹ́ẹ̀ gẹ́ẹ́’)
  rationale: Ìṣètò gbólóhùn àti fífi Ọmọ fúnni tó tẹ̀ lé e ṣàlàyé ọ̀nà tí Ọlọ́run gbà nífẹ̀ẹ́ ayé; a kò fi ìtumọ̀ ìwọ̀n tí Gíríìkì kò fi dandan béèrè kún un.
- issue: Ìtumọ̀ μονογενής nípa Ọmọ
  choice: ‘Ọmọ rẹ̀ kan ṣoṣo’ nínú ọ̀rọ̀ pàtàkì
  alternative: ‘Ọmọ rẹ̀ tí a bí kan ṣoṣo’ tàbí ‘Ọmọ rẹ̀ aláìlẹ́gbẹ́’
  rationale: ‘Kan ṣoṣo’ fi àìlẹ́gbẹ́ Ọmọ náà àti ìbátan rẹ̀ pẹ̀lú Baba hàn. Àṣàyàn ìtàn ìtumọ̀ ‘tí a bí kan ṣoṣo’ wà nínú àlàyé ìsàlẹ̀ láti pa ìjẹ́pàtàkì rẹ̀ mọ́.
- issue: Ìwọ̀n πᾶς ὁ πιστεύων
  choice: ‘gbogbo ẹni tí ó bá gba a gbọ́’
  alternative: ‘ẹnikẹ́ni tí ó bá gba a gbọ́’
  rationale: Ó pa ìpè tó kan gbogbo ẹni tó gbàgbọ́ mọ́ láì pinnu àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa yíyan, ìdáhùn ènìyàn, tàbí ìwọ̀n ètùtù.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò. A yan “nífẹ̀ẹ́” dípò “fẹ́” láti yẹra fún ìtumọ̀ fífẹ́ ohun kan. “Má bàa ṣègbé” àti “ìyè àìnípẹ̀kun” pa ìwọ̀ntúnwọ̀nsì àti ìwúwo ẹsẹ̀ náà mọ́.
