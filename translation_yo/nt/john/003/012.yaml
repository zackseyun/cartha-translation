id: JHN.3.12
reference: John 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: yo
  text: Bí mo bá ti sọ àwọn ohun ti ilẹ̀ ayé[a] fún yín, tí ẹ kò sì gbàgbọ́, báwo ni ẹ ó ṣe gbàgbọ́ bí mo bá sọ àwọn ohun ti ọ̀run[b] fún yín?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun tó wà lórí ilẹ̀ ayé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ohun tó wà ní ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: àwọn ohun ti ilẹ̀ ayé
  rationale: Ọ̀rọ̀ ajẹ́tífù ọ̀pọ̀ tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ ni. Ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìyàtọ̀ rẹ̀ mọ́ pẹ̀lú τὰ ἐπουράνια láì sọ pàtó ohun tí àwọn ‘ohun’ náà jẹ́.
- source_word: εἶπον
  choice: mo bá ti sọ ... fún yín
  rationale: Aorist indicative náà tọ́ka sí ohun tí Jésù ti sọ tẹ́lẹ̀. ‘Bá ti sọ’ mú ipò àídájú εἰ àti ìṣe tí ó ti ṣẹlẹ̀ jáde ní Yorùbá, nígbà tí ‘fún yín’ bá ὑμῖν mu.
- source_word: οὐ πιστεύετε
  choice: ẹ kò sì gbàgbọ́
  rationale: Present indicative náà ṣàpèjúwe ìdáhùn wọn ní báyìí. ‘Gbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá lílo πιστεύω mu nínú àyíká ọ̀rọ̀ yìí.
- source_word: πῶς ... πιστεύσετε
  choice: báwo ni ẹ ó ṣe gbàgbọ́
  rationale: Ìbéèrè àsọ àsọyé yìí pa ìrísí ọ̀rọ̀ ọjọ́ iwájú mọ́ nípasẹ̀ ‘ẹ ó,’ láì túmọ̀ ọ́ sí àìlèṣe pátápátá.
- source_word: ἐὰν εἴπω
  choice: bí mo bá sọ
  rationale: ‘Bí ... bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi àídájú ọjọ́ iwájú tí ἐὰν pẹ̀lú subjunctive ń tọ́ka sí hàn.
- source_word: τὰ ἐπουράνια
  choice: àwọn ohun ti ọ̀run
  rationale: Ọ̀rọ̀ ajẹ́tífù ọ̀pọ̀ tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ ni. Ìtumọ̀ náà pa ìyàtọ̀ tó wà láàárín ohun ti ilẹ̀ ayé àti ohun ti ọ̀run mọ́, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Ìtumọ̀ ìyàtọ̀ láàárín τὰ ἐπίγεια àti τὰ ἐπουράνια
  choice: A túmọ̀ wọn ní tààrà gẹ́gẹ́ bí ‘àwọn ohun ti ilẹ̀ ayé’ àti ‘àwọn ohun ti ọ̀run.’
  alternative: Kí a ṣàlàyé wọn gẹ́gẹ́ bí àpẹẹrẹ láti inú ìgbésí ayé ayé, àwọn ìṣẹ̀lẹ̀ tó ń ṣẹlẹ̀ lórí ayé, tàbí àwọn àṣírí Ọlọ́run tó jinlẹ̀.
  rationale: Ẹsẹ náà fi àwọn ẹ̀ka ìṣípayá méjì wéra, ṣùgbọ́n kò sọ ìtumọ̀ wọn di pàtó. Ọ̀rọ̀ gbòòrò náà ń pa àìdájú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣeé lóye. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῖν/πιστεύετε/πιστεύσετε, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
