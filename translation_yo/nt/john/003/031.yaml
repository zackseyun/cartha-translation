id: JHN.3.31
reference: John 3:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: yo
  text: Ẹni tí ó wá láti òkè ga jù ohun gbogbo lọ[a]. Ẹni tí ó ti ayé wá jẹ́ ti ayé, ó sì ń sọ̀rọ̀ láti ayé[b]. Ẹni tí ó wá láti ọ̀run ga jù ohun gbogbo lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọ̀run,” fún “láti òkè.” Ọ̀rọ̀ Gíríìkì náà (ἄνωθεν) tọ́ka sí orísun láti òkè, gbólóhùn ìkẹyìn sì jẹ́ kí ìtumọ̀ náà ṣe kedere pẹ̀lú “láti ọ̀run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń sọ̀rọ̀ nípa ayé.” Gíríìkì tún “láti ayé” ṣe ní tààrà; èyí lè tọ́ka sí orísun, àyíká, tàbí ohun tí ọ̀rọ̀ náà dá lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: ti òkè
  rationale: Ó tọ́ka sí ibi tí ẹni náà ti wá, ìyẹn láti òkè, kì í ṣe pé ó tún wá lẹ́ẹ̀kan sí i. Ó tún pa ìyàtọ̀ mọ́ láàárín òkè àti ayé, nígbà tí ‘láti ọ̀run’ ní apá ìkẹyìn túmọ̀ rẹ̀ síwájú sí i.
- source_word: ἐρχόμενος
  choice: ẹni tí ó ... wá
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún participle tí ó dúró bí orúkọ, ó sì fi ìṣe wíwá hàn.
- source_word: ἐπάνω πάντων
  choice: ga ju gbogbo ènìyàn lọ
  rationale: Ó fi ipò gíga àti ọlá tó ju ti gbogbo ẹlòmíràn lọ hàn. ‘Gbogbo ènìyàn’ bá ìtọ́kasí sí àwọn ẹni nínú àyíká ọ̀rọ̀ mu, bí ó tilẹ̀ jẹ́ pé πάντων lè túmọ̀ sí ‘ohun gbogbo’ pẹ̀lú.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: ẹni tí ó ti ayé wá
  rationale: Ó pa èrò orísun mọ́, ó sì dá ìyàtọ̀ tó wà pẹ̀lú ẹni tí ó ti ọ̀run wá dúró.
- source_word: γῆ
  choice: ayé
  rationale: Níhìn-ín, γῆ jẹ́ òdìkejì ọ̀run, nítorí náà ‘ayé’ yẹ ju ‘ilẹ̀’ tàbí ‘agbègbè’ lọ.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: jẹ́ ti ayé
  rationale: 'Ó pa àtúnwí Gíríìkì mọ́ ní Yorùbá tí ó ṣe kedere, tí kò sì le koko: ẹni náà ti ayé wá, ó sì jẹ́ ti ayé.'
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: ń sọ̀rọ̀ láti inú ayé
  rationale: Ó pa àwòrán orísun tàbí àyíká ọ̀rọ̀ náà mọ́ láì pinnu bóyá ohun tí ó ń sọ ni ti ayé tàbí pé ojú ìwòye ayé ni ó ti ń sọ.
- source_word: οὐρανός
  choice: ọ̀run
  rationale: Nínú àyíká Jòhánù, ó tọ́ka sí ibùgbé ọ̀run tàbí ibi Ọlọ́run, kì í ṣe ojú sánmà lásán.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ‘láti òkè’ àti ‘láti ọ̀run’
  choice: Lo ‘ti òkè wá’ ní àkọ́kọ́, kí a sì lo ‘ti ọ̀run wá’ ní ìkẹyìn.
  alternative: Túmọ̀ àwọn méjèèjì sí ‘ti ọ̀run wá.’
  rationale: Gíríìkì lo gbólóhùn méjì tí ó jọra ṣùgbọ́n tí kò rí bákan náà. Yíyan ọ̀rọ̀ méjì yìí pa ọ̀nà tí apá ìkẹyìn fi ń ṣàlàyé apá àkọ́kọ́ mọ́, láì dín ìtumọ̀ wọn kù sí ọ̀rọ̀ kan náà.
- issue: Agbára àtúnwí ọ̀rọ̀ nípa ayé
  choice: 'Pa ìtọ́kasí mẹ́ta sí ayé mọ́: ‘ti ayé wá ... jẹ́ ti ayé ... láti inú ayé.’'
  alternative: Ṣe é ní ṣókí sí ‘ẹni ti ayé ń sọ̀rọ̀ bí ẹni ti ayé.’
  rationale: Àtúnwí inú Gíríìkì tẹnu mọ́ ìyàtọ̀ láàárín orísun ayé àti orísun ọ̀run. Pípa rẹ̀ mọ́ yẹra fún fífi ìtumọ̀ kan pàtó lé gbólóhùn tí ó lè tọ́ka sí orísun, àyíká, tàbí kókó ọ̀rọ̀.
- issue: Ìtumọ̀ πάντων nínú ‘ga ju gbogbo ... lọ’
  choice: Túmọ̀ rẹ̀ sí ‘gbogbo ènìyàn.’
  alternative: ‘ohun gbogbo’ tàbí ‘gbogbo wọn.’
  rationale: Ọ̀rọ̀ náà lè jẹ́ akọ tàbí aláìlẹ́mìí ní Gíríìkì. Àyíká náà ń fi ẹni tí ó ti ọ̀run wá wé ẹni tí ó ti ayé wá, nítorí náà ‘gbogbo ènìyàn’ jẹ́ Yorùbá tó ṣe kedere; síbẹ̀, àlàyé ìsàlẹ̀ fi ààyè sílẹ̀ fún ìtumọ̀ tó gbòòrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò. A pa ìṣọ̀kan ‘wá’ mọ́ fún ἐρχόμενος, a sì pa àtúnwí ayé mọ́ láì jẹ́ kí gbólóhùn náà le fún òǹkàwé òde òní.
