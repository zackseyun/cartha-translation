  source_fidelity: 'Àwọn eroja pàtàkì ti ẹsẹ náà wà nínú ìtumọ̀ náà: Jésù dá a lóhùn, ìtẹnumọ́ “Ìwọ,” ipò Nikodémù gẹ́gẹ́ bí olùkọ́ Israẹli, àti ìbéèrè ìbáwí náà. Ṣùgbọ́n “síbẹ̀” fi ìyàtọ̀ tàbí ìtakò kún καί tí kò hàn nínú ọ̀rọ̀ Gíríìkì, àti “bí?” lè yí ìbéèrè náà sí ìbéèrè ọ̀nà (“how?”) dípò ìbéèrè ìbáwí tó wà nínú orísun.'
  naturalness: “Jésù dá a lóhùn, ó ní” jẹ́ Yorùbá àdánidá. “Ìwọ ni olùkọ́ Israẹli” sì dára, ó sì ní ìtẹnumọ́. “O kò sì mọ nǹkan wọ̀nyí?” jẹ́ ọ̀nà tó mọ́, tó sì jẹ́ àdánidá ju “síbẹ̀ ... bí?” lọ fún ìbéèrè Gíríìkì náà.
  terminology: “Olùkọ́” yẹ fún διδάσκαλος, “Israẹli” yẹ fún Ἰσραήλ, àti “nǹkan wọ̀nyí” yẹ fún ταῦτα. Àlàyé ìsàlẹ̀ yẹ kí ó sọ pé Gíríìkì ní “olùkọ́ náà/the teacher,” kì í ṣe pé ó ní gangan “olùkọ́ náà” ní Yorùbá; yíyí àṣàyàn padà sí “olùkọ́ kan ní Israẹli” tún sún mọ́ “a teacher of Israel” ju “láàárín Israẹli” lọ.
