id: JHN.3.10
reference: John 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: yo
  text: Jésù dá a lóhùn, ó ní, “Ìwọ ni olùkọ́ Israẹli, o kò sì mọ nǹkan wọ̀nyí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ jẹ́ olùkọ́ kan ní Israẹli, o kò sì mọ nǹkan wọ̀nyí?” Ọ̀rọ̀ Gíríìkì náà ní “the teacher” (“olùkọ́ náà”), èyí tó lè fún ọ̀rọ̀ Jésù ní agbára ìtẹnumọ́ àti ìbáwí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: dá a lóhùn, ó ní
  rationale: 'Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìlànà ọ̀rọ̀ Gíríìkì méjì náà hàn: ó fèsì sí i, ó sì sọ ọ̀rọ̀ tó tẹ̀ lé e.'
- source_word: Σὺ
  choice: Ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní gbangba nínú Gíríìkì ní ìtẹnumọ́; fífi “Ìwọ” sí iwájú gbólóhùn pa ìtẹnumọ́ náà mọ́.
- source_word: ὁ διδάσκαλος
  choice: olùkọ́
  rationale: “Olùkọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tó ń kọ́ni. Ìṣètò “Ìwọ ni olùkọ́” ń pa agbára ìdánimọ̀ pàtó inú ọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé Yorùbá kò ní àpilẹ̀kọ pàtó tó bá ὁ mu gangan.
- source_word: τοῦ Ἰσραὴλ
  choice: Israẹli
  rationale: Nínú “olùkọ́ Israẹli,” ìbáṣepọ̀ náà túmọ̀ sí olùkọ́ tí ó ní ipò láàárín àwọn ènìyàn Israẹli, kì í ṣe ibi tó ń gbé lásán.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Èyí tọ́ka sí àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ ń kọ́ Nikodémù, ó sì pa ìtọ́kasí gbòòrò ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὐ γινώσκεις
  choice: o kò mọ … bí?
  rationale: “Mọ” pa ìtumọ̀ àkọ́kọ́ γινώσκω mọ́, nígbà tí ọ̀rọ̀ àyíká fi hàn pé jíjẹ́ kó yé ẹni ni a ń sọ. “Bí?” jẹ́ àmì ìbéèrè Yorùbá àdánidá tí ó pa ìbáwí onígbọ̀wọ̀n inú ìbéèrè náà mọ́.
theological_decisions:
- issue: Agbára ọ̀rọ̀ tí Jésù fi pe Nikodémù ní ὁ διδάσκαλος τοῦ Ἰσραήλ
  choice: “Ìwọ ni olùkọ́ Israẹli” pẹ̀lú ìtẹnumọ́ àti ìdánimọ̀ pàtó
  alternative: “Ìwọ jẹ́ ọ̀kan lára àwọn olùkọ́ Israẹli” tàbí “olùkọ́ kan ní Israẹli”
  rationale: 'Àpilẹ̀kọ pàtó Gíríìkì àti “Σὺ” tí a tẹnumọ́ mú kí ọ̀rọ̀ náà ní agbára ìbéèrè ìbáwí: ẹni tí a mọ̀ sí olùkọ́ Israẹli kò mọ àwọn nǹkan wọ̀nyí. A kò fi “olùkọ́ àgbà jù” kún un, nítorí èyí lè sọ ipò rẹ̀ ju ohun tí orísun fi dájú lọ.'
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní ọlá, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Dá a lóhùn, ó ní” jẹ́ àdánidá ju títú ọ̀rọ̀ Gíríìkì náà ní ọ̀rọ̀-lẹ́-ọ̀rọ̀ lọ; “síbẹ̀” mú ìyàtọ̀ ìrònú tó wà nínú καί hàn ní Yorùbá. A kọ Israẹli gẹ́gẹ́ bí orúkọ àwọn ènìyàn náà.
