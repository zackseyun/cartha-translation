  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: yo
  text: Jòhánù náà sì ń ṣe ìrìbọmi[a] ní Áínónì, nítòsí Sálímù, nítorí omi púpọ̀ wà níbẹ̀[b]. Àwọn ènìyàn sì ń wá, wọ́n sì ń gba ìrìbọmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ tí a túmọ̀ sí “ṣe ìrìbọmi” tún lè túmọ̀ sí “fi rì sínú omi.” A pa ọ̀rọ̀ tí a ti mọ̀ sí “ìrìbọmi” mọ́ níbí; ọ̀rọ̀ náà nìkan kò pinnu ọ̀nà tí a gbà ṣe é.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ti gidi: “nítorí omi púpọ̀ [tàbí, omi ní ọ̀pọ̀ ibi] wà níbẹ̀.” Ọ̀rọ̀ Gíríìkì fún “omi” wà ní ọ̀pọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ
  choice: náà sì ń
  rationale: “Sì” fi ìyípadà ọ̀rọ̀ pẹ̀lẹ́ hàn, “náà” sì mú ìtumọ̀ καί, pé Jòhánù pẹ̀lú ń ṣe iṣẹ́ yìí. Àpapọ̀ náà pẹ̀lú “ń” sọ iṣẹ́ tí ó ń bá a lọ ní àkókò ìtàn.
- source_word: ὁ Ἰωάννης
  choice: Jòhánù
  rationale: A lo orúkọ tí a ti mọ̀ ní Yorùbá láìfi àlàyé “Onítẹ̀bọmi” kún un, nítorí kò sí nínú ọ̀rọ̀ Gíríìkì.
- source_word: βαπτίζων / ἐβαπτίζοντο
  choice: ń ṣe ìrìbọmi fún / a sì ń ṣe ìrìbọmi fún wọn
  rationale: “Ìrìbọmi” ni ọ̀rọ̀ ẹ̀sìn Yorùbá tí a ti mọ̀ fún βαπτίζω. Ìtumọ̀ kejì pa ohùn àìṣe ti Gíríìkì mọ́ ní Yorùbá àdánidá, láìdá ìbéèrè nípa ọ̀nà ìrìbọmi parí.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: ní Áínónì, nítòsí Sálímù
  rationale: “Ní” tọ́ka sí ibi, “nítòsí” sì fi ìsúnmọ́ hàn. A kọ orúkọ àwọn ibi náà gẹ́gẹ́ bí ìró wọn ní Yorùbá.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: nítorí omi púpọ̀ wà níbẹ̀
  rationale: “Nítorí” fi ìdí tí wọ́n fi ń ṣe ìrìbọmi níbẹ̀ hàn. “Omi púpọ̀” jẹ́ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀pọ̀ “omi” inú Gíríìkì mọ́.
- source_word: παρεγίνοντο
  choice: Àwọn ènìyàn sì ń wá
  rationale: Àìpé Gíríìkì tọ́ka sí wíwá tí ó ń bá a lọ tàbí tí ó ń ṣẹlẹ̀ léraléra; “ń wá” mú èyí jáde ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ βαπτίζω
  choice: ṣe ìrìbọmi
  alternative: rì sínú omi / fi rì sínú omi
  rationale: “Ṣe ìrìbọmi” jẹ́ ọ̀rọ̀ tí a ti fi ẹsẹ̀ múlẹ̀ ní Yorùbá fún iṣẹ́ ẹ̀sìn yìí. A kò lo ọ̀rọ̀ míì tí yóò dá ariyanjiyan nípa ọ̀nà ìrìbọmi parí; a fi àṣàyàn tó túmọ̀ sí rírì sínú omi sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “a sì ń ṣe ìrìbọmi fún wọn” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá láti pa ìṣe àìṣe inú Gíríìkì mọ́.
