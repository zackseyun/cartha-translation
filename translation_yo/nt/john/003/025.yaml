  to: Nígbà náà, àríyànjiyàn kan wáyé láàárín àwọn ọmọ-ẹ̀yìn Jòhánù àti Júù kan nípa ìwẹ̀nùmọ́[a].
  rationale: Àtúnṣe náà yí ‘bẹ̀rẹ̀’ sí ‘wáyé’ láti fi ìdíde ìṣẹ̀lẹ̀ náà hàn dáadáa. Ó tún tún ọ̀rọ̀ ìsàlẹ̀ ṣe kí ó fúnni ní àlàyé lexical tí ó ṣe kedere, nígbà tí ó ń pa àìdánilójú tó wà nínú καθαρισμός mọ́.
