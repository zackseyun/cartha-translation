  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ náà fara mọ́ Gíríìkì dáadáa: ó pa ‘Júù kan’ (ẹyọ) mọ́, ó sì fi kókó ọ̀rọ̀ náà—àríyànjiyàn nípa καθαρισμός—hàn. Ṣùgbọ́n ‘wáyé’ dá ìṣẹ̀lẹ̀ Ἐγένετο/‘arose’ hàn ní kedere ju ‘bẹ̀rẹ̀’ lọ.'
