source:
  edition: SBLGNT
  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: yo
  text: Nígbà náà, àríyànjiyàn kan wáyé láàárín àwọn ọmọ-ẹ̀yìn Jòhánù àti Júù kan nípa ìwẹ̀nùmọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ìmímọ́,” tàbí “nípa ìwẹ̀nùmọ́ ní ìbámu pẹ̀lú àṣà ẹ̀sìn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwẹ̀nùmọ́ ní gbogbogbòò; ní àyíká yìí, ó ṣeé ṣe kí ó ní ìtumọ̀ tó ní í ṣe pẹ̀lú àṣà ẹ̀sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: bẹ̀rẹ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń sọ bí ìṣẹ̀lẹ̀ kan ṣe dìde; “bẹ̀rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àríyànjiyàn kan ṣẹ̀ṣẹ̀ dìde.
- source_word: οὖν
  choice: Nígbà náà
  rationale: Ó ń tẹ ìtàn náà síwájú láìfi agbára ìtumọ̀ ‘nítorí náà’ tí kò pọndandan kún un.
- source_word: ζήτησις
  choice: àríyànjiyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìjíròrò tàbí awuyewuye; àyíká ọ̀rọ̀ fi hàn pé ìtakora wà, nítorí náà “àríyànjiyàn” bá a mu.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου ... μετὰ Ἰουδαίου
  choice: láàárín àwọn ọmọ-ẹ̀yìn Jòhánù àti Júù kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gẹ́gẹ́ bí lẹ́tà bẹ̀rẹ̀ pẹ̀lú ‘láti inú àwọn ọmọ-ẹ̀yìn Jòhánù,’ ìkọ́lé gbólóhùn náà fi àwọn ọmọ-ẹ̀yìn Jòhánù àti Júù kan hàn gẹ́gẹ́ bí ẹgbẹ́ méjì tó ń jiyàn. “Júù kan” tún pa nọ́ńbà ẹyọ mọ́.
- source_word: περὶ καθαρισμοῦ
  choice: nípa ìwẹ̀nùmọ́
  rationale: “Ìwẹ̀nùmọ́” lè tọ́ka sí ìsọ̀dọ̀mọ́ ní gbogbogbòò, ó sì tún lè ní ìtumọ̀ ìwẹ̀nùmọ́ ti àṣà ẹ̀sìn, láìfi àlàyé tí ẹsẹ̀ náà kò sọ kún un.
theological_decisions:
- issue: Bóyá kí καθαρισμός jẹ́ ìtumọ̀ tó sọ àṣà ẹ̀sìn ní pàtó
  choice: ìwẹ̀nùmọ́
  alternative: ìwẹ̀nùmọ́ gẹ́gẹ́ bí àṣà ẹ̀sìn
  rationale: Àyíká Ìhìn Rere Jòhánù mú kí ìtumọ̀ ti àṣà ẹ̀sìn ṣeé ṣe gan-an, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò sọ irú ìwẹ̀nùmọ́ náà ní pàtó. Ọ̀rọ̀ gbogbogbò “ìwẹ̀nùmọ́” pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Jòhánù” fún Ἰωάννης, “ọmọ-ẹ̀yìn” fún μαθητής, àti “Júù kan” láti pa ẹyọ Ἰουδαίου mọ́.
