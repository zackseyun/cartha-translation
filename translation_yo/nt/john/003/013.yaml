source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: yo
  text: Kò sí ẹni tí ó ti gòkè lọ sí ọ̀run, bí kò ṣe ẹni tí ó sọ̀kalẹ̀ láti ọ̀run wá—Ọmọ Ènìyàn[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó wá láti ọ̀run.”
    reason: lexical_alternative
  - marker: b
    text: “Ọmọ Ènìyàn” ni oyè tí Jésù sábàa ń fi tọ́ka sí ara rẹ̀; ó sì ń mú Dáníẹ́lì 7:13–14 wá sí ìrántí.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: Kò sí ẹni
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àìsí ẹnikẹ́ni, láì dín ìtumọ̀ náà mọ́ akọ nìkan.
- source_word: ἀναβέβηκεν
  choice: tí ó ti gòkè lọ ... rí
  rationale: Àkójọpọ̀ ‘ti’ àti ‘rí’ ń fi ìṣe tí ó ti ṣẹlẹ̀ hàn pẹ̀lú ipa rẹ̀ títí di àkókò ọ̀rọ̀, nígbà tí ‘gòkè lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìlọ sókè.
- source_word: εἰς τὸν οὐρανόν
  choice: sí ọ̀run
  rationale: ‘Sí ọ̀run’ ń sọ ìṣípo lọ sí ibi náà ní Yorùbá àdánidá, ó sì pa ìyàtọ̀ gòkè/sọ̀kalẹ̀ mọ́.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: 'Èyí ni àfihàn ìyọkúrò tó bá ọ̀rọ̀ náà mu: kò sí ẹlòmíràn yàtọ̀ sí ẹni kan ṣoṣo náà.'
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: ẹni tí ó sọ̀kalẹ̀ láti ọ̀run wá
  rationale: Ó pa ìṣe ìsọ̀kalẹ̀ àti orísun rẹ̀ ní ọ̀run mọ́; ‘wá’ mú gbólóhùn náà dà bí Yorùbá àdánidá láì fi ìtumọ̀ míì kún un.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè tí Jésù sábà máa ń fi pe ara rẹ̀ àti ìró inú Dáníẹ́lì 7 mọ́, dípò ṣíṣe àlàyé rẹ̀ sí ‘Ẹni Ènìyàn’.
theological_decisions:
- issue: Agbára ìtumọ̀ nípa Kristi nínú ‘ὁ υἱὸς τοῦ ἀνθρώπου’
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: A pa ọ̀rọ̀ oyè àti ìfarahàn rẹ̀ sí Dáníẹ́lì 7 mọ́, láì yanjú ìṣòro ìtumọ̀ rẹ̀ sí ọ̀rọ̀ àlàyé kan ṣoṣo.
- issue: Ìtumọ̀ àkókò àti ipò ìṣe nínú ἀναβέβηκεν àti καταβάς
  choice: tí ó ti gòkè lọ ... ẹni tí ó sọ̀kalẹ̀
  alternative: tí ó gòkè lọ ... ẹni tí ó wá láti ọ̀run
  rationale: ‘Ti’ pa ìṣe pípé ti ἀναβέβηκεν mọ́, ‘sọ̀kalẹ̀’ sì pa àfiwé gòkè/sọ̀kalẹ̀ àti ìpilẹ̀ṣẹ̀ ọ̀run mọ́ láì ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. ‘Gòkè lọ’ àti ‘sọ̀kalẹ̀ ... wá’ jẹ́ àdánidá ní Yorùbá, wọ́n sì pa ìyàtọ̀ inú Gíríìkì mọ́.
