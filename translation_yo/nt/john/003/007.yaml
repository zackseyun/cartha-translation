  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: yo
  text: Má ṣe jẹ́ kí ó yà ọ́ lẹ́nu pé mo sọ fún ọ[b] pé, ‘Ó gbọdọ̀ jẹ́ pé a bí yín láti òkè wá[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, ‘a bí yín lẹ́ẹ̀kan sí i,’ tàbí ‘a tún bí yín.’ Ọ̀rọ̀ Gíríìkì ἄνωθεν lè túmọ̀ sí ‘láti òkè wá’ tàbí ‘lẹ́ẹ̀kan sí i/tún.’
    reason: alternative_reading
  - marker: b
    text: ‘Ọ’ àkọ́kọ́ nínú ‘mo sọ fún ọ’ jẹ́ ẹni ẹyọ kan, ṣùgbọ́n ‘yín’ jẹ́ ọ̀pọ̀ nínú èdè Gíríìkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Má ṣe yà ọ́ lẹ́nu
  rationale: μή pẹ̀lú aorist subjunctive jẹ́ ìfòfindè; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìyàlẹ́nu θαυμάζω mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣàfihàn ohun tí Jésù sọ, kì í ṣe ìdí tí ẹnu fi yà á.
- source_word: εἶπόν σοι
  choice: mo sọ fún ọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ λέγω pẹ̀lú σοι, ó sì pa ẹni kejì ẹyọ kan mọ́.
- source_word: Δεῖ
  choice: A gbọ́dọ̀
  rationale: Δεῖ ń fi dandan hàn; ‘gbọ́dọ̀’ pa agbára ọ̀rọ̀ náà mọ́ ní Yorùbá.
- source_word: ὑμᾶς
  choice: gbogbo yín
  rationale: ὑμᾶς jẹ́ ọ̀pọ̀; ‘gbogbo yín’ mú ìyàtọ̀ rẹ̀ sí σοι, ẹni ẹyọ kan, hàn kedere ní Yorùbá.
- source_word: γεννηθῆναι
  choice: bí
  rationale: Ìṣe àìṣeṣe γεννηθῆναι túmọ̀ sí ‘kí a bí’; pẹ̀lú ‘A gbọ́dọ̀,’ Yorùbá lè lo ‘bí’ láìsọ ìtumọ̀ rẹ̀ di aláìmọ́.
- source_word: ἄνωθεν
  choice: láti òkè wá
  rationale: ἄνωθεν lè túmọ̀ sí ‘láti òkè wá’ tàbí ‘lẹ́ẹ̀kan sí i/tuntun.’ Ìtumọ̀ ‘láti òkè wá’ bá bí Jòhánù ṣe máa ń lo ọ̀rọ̀ náà àti ìtẹnumọ́ orísun ọ̀run mu; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἄνωθεν nínú ọ̀rọ̀ nípa ìbí tuntun
  choice: láti òkè wá
  alternative: lẹ́ẹ̀kan sí i; ní ọ̀nà tuntun
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ méjì tí ó ṣe pàtàkì nínú ìjíròrò pẹ̀lú Nikodémù. Àyíká Ìhìn Rere Jòhánù ṣe atilẹyin fún ‘láti òkè wá,’ ṣùgbọ́n a kò pa ìtumọ̀ ‘lẹ́ẹ̀kan sí i’ rẹ́; a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘gbogbo yín’ láti mú ọ̀pọ̀ ὑμᾶς hàn ní kedere, nígbà tí ‘ọ’ pa σοι gẹ́gẹ́ bí ẹni ẹyọ kan mọ́. A fi àmì ohùn sí ibi tí ó yẹ.
