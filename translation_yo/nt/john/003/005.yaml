id: JHN.3.5
reference: John 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: yo
  text: 'Jésù dáhùn pé, “Lóòótọ́, lóòótọ́ ni mo wí fún ọ: bí a kò bá bí ènìyàn láti inú omi àti Ẹ̀mí[a][b], kò lè wọ inú ìjọba Ọlọ́run.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “omi àti ẹ̀mí.” Èdè Gíríìkì kò fi lẹ́tà ńlá tàbí kékeré dá ìtumọ̀ yìí yà; síbẹ̀, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí níbí.
    reason: alternative_reading
  - marker: b
    text: 'A ti lóye “omi àti Ẹ̀mí” ní onírúurú ọ̀nà: gẹ́gẹ́ bí àwòrán ìwẹ̀nùmọ́ àti ìmúdọ̀tun, gẹ́gẹ́ bí ìbí ara àti ìbí ti ẹ̀mí, tàbí gẹ́gẹ́ bí ìtọ́kasí sí ìbatisí. Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì mọ́ láìyan ìtumọ̀ kan pàtó nínú ọ̀rọ̀ pàtàkì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún fífi ìdáhùn nínú ìjíròrò hàn.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnwí ìtẹnumọ́ Gíríìkì mọ́, ó sì mú ìtumọ̀ rẹ̀ yé òǹkàwé Yorùbá òde òní ju lílo ọ̀rọ̀ àyálò ‘Àmín’ lọ.
- source_word: λέγω σοι
  choice: ni mo wí fún ọ
  rationale: Ó pa ìtọ́kasí tààrà sí ẹni kan àti ìwúwo ọ̀rọ̀ náà mọ́ ní èdè Yorùbá ọlọ́lá.
- source_word: ἐὰν μή τις
  choice: bí a kò bá bí ẹnikẹ́ni
  rationale: ‘Ẹnikẹ́ni’ mú ìtumọ̀ ẹni àìsọ pàtó jáde láìfi akọ tàbí abo kún un.
- source_word: γεννηθῇ
  choice: bí
  rationale: A lò ó nínú àkójọpọ̀ ọ̀rọ̀ ‘bí a kò bá bí ẹnikẹ́ni’; èyí pa ohùn àfaragbà àti ìtumọ̀ ‘bí ènìyàn’ mọ́, láìfi ‘lẹ́ẹ̀kan sí i’ tàbí ‘láti òkè’ kún ẹsẹ yìí.
- source_word: ἐξ ὕδατος
  choice: láti inú omi
  rationale: ‘Láti inú’ ṣe àfihàn orísun tí ἐκ ń tọ́ka sí, ó sì bá àwòrán ìbí mu.
- source_word: καὶ πνεύματος
  choice: àti Ẹ̀mí
  rationale: Lẹ́tà ńlá fi ìtumọ̀ tó ṣeé ṣe jù lọ—Ẹ̀mí Mímọ́—hàn; àkọsílẹ̀ ìsàlẹ̀ sì pa àṣàyàn ‘ẹ̀mí’ mọ́.
- source_word: οὐ δύναται
  choice: kò lè
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àìlera tàbí àìṣeéṣe tí δύναμαι ń fi hàn.
- source_word: εἰσελθεῖν
  choice: wọ inú
  rationale: Ó fi ìṣe wíwọ inú ibì kan hàn ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó péye, tó sì lè gbé èrò agbègbè ìjọba àti ìṣàkóso Ọlọ́run papọ̀ láìyan ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ πνεύματος nínú ἐξ ὕδατος καὶ πνεύματος
  choice: Ẹ̀mí, gẹ́gẹ́ bí ìtọ́kasí sí Ẹ̀mí Mímọ́
  alternative: ẹ̀mí, gẹ́gẹ́ bí ẹ̀mí ènìyàn tàbí agbára ti ẹ̀mí
  rationale: Àyíká ìwé Jòhánù àti àkòrí ìsọdimímọ́ àti ìmúdọ̀tun nípasẹ̀ Ẹ̀mí mú kí ‘Ẹ̀mí’ ṣeé ṣe jù lọ. Síbẹ̀, Gíríìkì kò ní árítíkù níbí, èdè Gíríìkì sì kò lo lẹ́tà ńlá láti yà àwọn ìtumọ̀ wọ̀nyí sọ́tọ̀; nítorí náà, a pa àṣàyàn kejì mọ́ nínú àkọsílẹ̀.
- issue: Ohun tí ‘omi àti Ẹ̀mí’ ń tọ́ka sí
  choice: A pa gbólóhùn Gíríìkì mọ́ láìdá ìtumọ̀ ẹ̀kọ́ ìsìn kan láre nínú ọ̀rọ̀ pàtàkì
  alternative: Àwòrán ìwẹ̀nùmọ́ àti ìmúdọ̀tun; ìbí ara àti ìbí ti ẹ̀mí; tàbí ìtọ́kasí sí ìbatisí
  rationale: Gbólóhùn náà ti ní onírúurú àlàyé tó ṣeé ṣe. Ìtumọ̀ ‘láti inú omi àti Ẹ̀mí’ pa àìṣe kedere tó wà nínú orísun mọ́, kò sì fi ẹ̀kọ́ ìsìn ẹgbẹ́ kan sí i.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àtúnwí ‘Lóòótọ́, lóòótọ́’ pa ìtẹnumọ́ ọ̀rọ̀ Jésù mọ́.
