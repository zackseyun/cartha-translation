  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ìtumọ̀ Gíríìkì lápapọ̀: ó dá ìdáhùn Jòhánù, àìlè ènìyàn láti gba, fífúnni tí ó ti ṣẹlẹ̀, àti orísun láti ọ̀run hàn. Síbẹ̀, ‘ohun kan pàápàá’ kò jẹ́ ọ̀nà Yorùbá tó dára jù láti gbé ìtẹnumọ́ odi οὐδὲ ἕν (‘kò tilẹ̀ sí ohun kan’) kalẹ̀.'
