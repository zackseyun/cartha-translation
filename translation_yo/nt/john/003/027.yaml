source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: yo
  text: Jòhánù dáhùn, ó sì wí pé, “Ènìyàn kò lè gba ohun kan rárá, bí kò bá jẹ́ pé a ti fi fún un láti ọ̀run.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Jòhánù dáhùn, ó sì wí pé
  rationale: Ó pa àgbékalẹ̀ ìtàn Gíríìkì ‘dáhùn, ó sì wí’ mọ́, ní èdè Yorùbá ọlọ́lá tí ó sì ṣeé lóye.
- source_word: Οὐ δύναται
  choice: kò lè
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ àìlágbára tàbí àìlè ṣe ohun kan.
- source_word: ἄνθρωπος
  choice: Ènìyàn
  rationale: ἄνθρωπος níbí jẹ́ ẹyọ ọ̀rọ̀ tí ó dúró fún gbogbo ènìyàn; ‘ènìyàn’ ṣe ìtumọ̀ yẹn láì fi sí ọkùnrin nìkan.
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: gba ohun kan pàápàá
  rationale: ‘Ohun kan pàápàá’ pa ìtẹnumọ́ οὐδὲ ἓν mọ́ pé kò tilẹ̀ sí ohun kan ṣoṣo tí ènìyàn lè gbà fúnra rẹ̀.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: bí a kò bá ti fi í fún un
  rationale: Ilana ‘bí ... kò bá’ fi ipò àfi-nìkan hàn, ‘ti fi’ sì tọ́ka sí ipò tí ó jẹ́ àbájáde fífúnni tí ó ti ṣẹlẹ̀, gẹ́gẹ́ bí perfect passive Gíríìkì.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó pa àwòrán orísun ọ̀run mọ́ láì túmọ̀ rẹ̀ ní tààràtà sí ‘lọ́dọ̀ Ọlọ́run,’ nítorí náà ó yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìwọ̀n ohun tí a ń sọ pé ó wá láti ọ̀run
  choice: 'A pa gbólóhùn náà mọ́ ní fífẹ̀: ènìyàn kò lè gba ohun kan pàápàá bí a kò bá fi í fún un láti ọ̀run.'
  alternative: Kí a dín un kù sí ipò iṣẹ́ ìránṣẹ́ tàbí àṣẹ ẹ̀mí nìkan, tàbí kí a sọ ọ́ di ẹ̀kọ́ ìpinnu gbogbo nǹkan tí ó lágbára ju ọ̀rọ̀ náà lọ.
  rationale: Àyíká ẹsẹ náà kan iṣẹ́ Jòhánù àti bí ipa Jésù ṣe ń pọ̀ sí i, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gbòòrò. Ìtumọ̀ náà pa fífẹ̀ yẹn àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́ láì yan ìlànà ẹ̀sìn kan.
translation_notes:
  register: Èdè Yorùbá ìpele àárín, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ‘Jòhánù’ àti ‘ọ̀run’ tẹ̀lé ìlò Yorùbá Bíbélì tí ó wọ́pọ̀.
