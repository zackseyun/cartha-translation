  to: Jòhánù dáhùn, ó sì wí pé, “Ènìyàn kò lè gba ohun kan rárá, bí kò bá jẹ́ pé a ti fi fún un láti ọ̀run.”
  rationale: A tún ìfihàn ìtẹnumọ́ odi οὐδὲ ἕν ṣe sí ‘ohun kan rárá,’ a sì mú gbolohun ìpò ἐὰν μὴ ᾖ δεδομένον αὐτῷ kedere sí i pẹ̀lú ‘bí kò bá jẹ́ pé a ti fi fún un.’ Àwọn ìyókù ni a pa mọ́ nítorí wọ́n jẹ́ olóòtítọ́ sí ọ̀rọ̀ Gíríìkì, wọ́n sì jẹ́ Yorùbá adayeba.
