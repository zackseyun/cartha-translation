  terminology: ‘Ènìyàn,’ ‘gba,’ ‘fi fún un,’ àti ‘láti ọ̀run’ bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu, wọ́n sì bójú mu nínú Yorùbá Bíbélì òde òní. ‘Ọ̀run’ yẹ kí ó dúró dípò kí a sọ ‘Ọlọ́run,’ nítorí ọ̀rọ̀ orísun náà sọ ‘heaven.’
