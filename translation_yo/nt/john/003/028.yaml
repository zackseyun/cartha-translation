id: JHN.3.28
reference: John 3:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: yo
  text: Ẹ̀yin fúnra yín jẹ́rìí fún mi pé mo sọ pé, “Èmi kì í ṣe Mèsáyà[a], ṣùgbọ́n a ti rán mi ṣáájú rẹ̀[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “a rán mi ṣáájú rẹ̀” tàbí “a ti rán mi níwájú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Ẹ̀yin fúnra yín
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tẹnu mọ́ àwọn olùgbọ́ fúnra wọn; ìtumọ̀ yìí pa ìtẹnumọ́ náà mọ́ ní Yorùbá àdánidá.
- source_word: μοι μαρτυρεῖτε
  choice: ń jẹ́rìí fún mi
  rationale: Ó mú ìtumọ̀ ẹ̀rí tàbí ìjẹ́rìí tí ó ṣe pàtàkì nínú ìwé Jòhánù jáde, ó sì fi hàn pé ẹ̀rí náà ń ṣe ìtìlẹ́yìn fún ohun tí Jòhánù sọ.
- source_word: εἶπον
  choice: mo sọ
  rationale: Aorist náà tọ́ka sí ọ̀rọ̀ tí Jòhánù ti sọ tẹ́lẹ̀; àkókò àtijọ́ rírọrùn ni ó bá a mu.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín, Χριστός jẹ́ oyè ẹni àmì òróró tí àwọn ènìyàn ń retí, kì í ṣe orúkọ lásán; “Mèsáyà” mú iṣẹ́ oyè náà hàn ní Yorùbá.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: a ti rán mi
  rationale: Ìkọ̀sílẹ̀ yìí ṣàfihàn ìránṣẹ́ tí a ti fi rán Jòhánù, tí ipò rẹ̀ sì ṣì ń bá a lọ. “A ti rán mi” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ passive perfect náà láì sọ ẹni tó rán an níbi tí Gíríìkì kò ti dárúkọ rẹ̀.
- source_word: ἔμπροσθεν ἐκείνου
  choice: ṣáájú rẹ̀
  rationale: Ó pa èrò pé a rán Jòhánù lọ níwájú ẹni náà mọ́, láti ṣáájú rẹ̀ nínú iṣẹ́ ìmúrasílẹ̀, láì fi ìtumọ̀ ọlá tí kò sí nínú ọ̀rọ̀ náà kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Jòhánù ń sẹ́ pé òun ni ẹni àmì òróró tí a ń retí. “Mèsáyà” jẹ́ kí iṣẹ́ ọ̀rọ̀ náà gẹ́gẹ́ bí oyè hàn gbangba, nígbà tí àlàyé ìsàlẹ̀ fi “Kristi” pamọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- issue: Agbára Ἀπεσταλμένος εἰμὶ nínú iṣẹ́ tí a fi rán Jòhánù
  choice: a ti rán mi ṣáájú rẹ̀
  alternative: a rán mi ṣáájú rẹ̀; a ń rán mi lọ níwájú rẹ̀
  rationale: Yíyan yìí fi ìránṣẹ́ tí ó ti ṣẹlẹ̀ àti ipa rẹ̀ tí ó ṣì wà hàn, ó sì pa ipò Jòhánù gẹ́gẹ́ bí ẹni tí a rán ṣáájú mọ́ láì fi ẹ̀kọ́ ìgbàgbọ́ míì kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè òde òní tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. “Ẹ̀yin fúnra yín” pa ìtẹnumọ́ Gíríìkì mọ́; “a ti rán mi” sì jẹ́ passive àdánidá ní Yorùbá láì dárúkọ olùránṣẹ́ tí orísun kò sọ ní tààrà.
