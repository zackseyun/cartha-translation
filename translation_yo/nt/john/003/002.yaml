id: JHN.3.2
reference: John 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: yo
  text: Ọkùnrin yìí wá sọ́dọ̀ rẹ̀ ní òru[a], ó sì wí fún un pé, “Rábì, àwa mọ̀ pé o ti ọ̀dọ̀ Ọlọ́run wá gẹ́gẹ́ bí olùkọ́; nítorí kò sí ẹni tí ó lè ṣe àwọn àmì wọ̀nyí[b] tí ìwọ ń ṣe, bí Ọlọ́run kò bá wà pẹ̀lú ẹni náà.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò òru.” Nínú Jòhánù, òru tàbí òkùnkùn tún lè ní ìtumọ̀ àpẹẹrẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn àmì iṣẹ́ ìyanu wọ̀nyí.” A lo “àmì” fún ọ̀rọ̀ Gíríìkì σημεῖα, nítorí nínú Jòhánù àwọn iṣẹ́ wọ̀nyí ń tọ́ka sí ohun tí ó ju ara wọn lọ.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì ní, “bí Ọlọ́run kò bá wà pẹ̀lú ẹni náà,” ó sì pa ọ̀nà ẹni kẹta tí Nikodémù gbà sọ ọ́ mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó tọ́ka padà sí Nikodémù, ọkùnrin tí ẹsẹ tó ṣáájú ṣẹ̀ṣẹ̀ dárúkọ; ó sì pa agbára ọ̀rọ̀ atọ́ka mọ́ lọ́nà Yorùbá àdánidá.
- source_word: ἦλθεν πρὸς αὐτὸν
  choice: tọ̀ ọ́ wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó wá sọ́dọ̀ rẹ̀, láìsọ ohun tí Gíríìkì kò sọ.
- source_word: νυκτός
  choice: ní òru
  rationale: Ó túmọ̀ gẹ́gẹ́ bí àkókò ìṣẹ̀lẹ̀, ó sì fi ààyè sílẹ̀ fún ìtumọ̀ àpẹẹrẹ òru nínú Jòhánù láìfi kún un.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa oyè Júù náà mọ́ ní ìkọ̀wé Yorùbá, gẹ́gẹ́ bí Gíríìkì ṣe pa ọ̀rọ̀ Sémítì náà mọ́.
- source_word: οἴδαμεν
  choice: àwa mọ̀
  rationale: A pa ẹni àkọ́kọ́ ọ̀pọ̀ mọ́, pẹ̀lú fífi ‘àwa’ hàn gbangba nítorí ìtẹnumọ́.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: o ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó pa ìpilẹ̀ láti ọ̀dọ̀ Ọlọ́run àti àbájáde tí ó ṣì wúlò nísinsìnyí mọ́, láìfi èrò ‘rán’ kún ọ̀rọ̀ náà.
- source_word: διδάσκαλος
  choice: gẹ́gẹ́ bí olùkọ́
  rationale: Ó ṣàfihàn ipa tí Nikodémù fi mọ Jésù sí ní Yorùbá tó ṣe kedere.
- source_word: οὐδεὶς γὰρ δύναται
  choice: nítorí kò sí ẹni tí ó lè
  rationale: Ó pa ìdí tí γάρ fi ń fúnni àti agbára/àǹfààní tí δύναται túmọ̀ sí mọ́.
- source_word: ταῦτα τὰ σημεῖα
  choice: àwọn àmì wọ̀nyí
  rationale: ‘Àmì’ pa ìṣe àwọn iṣẹ́ náà gẹ́gẹ́ bí ohun tí ń tọ́ka rékọjá ara wọn mọ́ nínú Jòhánù, dípò kí a dín wọn kù sí ‘iṣẹ́ ìyanu’ nìkan.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: ṣe àwọn àmì wọ̀nyí tí ìwọ ń ṣe
  rationale: A pa àtúnṣe ọ̀rọ̀ ποιέω mọ́ nípasẹ̀ ‘ṣe ... ń ṣe,’ pẹ̀lú ìtẹnumọ́ ‘ìwọ.’
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: bí Ọlọ́run kò bá wà pẹ̀lú ẹni náà
  rationale: Ó pa ẹni kẹta αὐτοῦ mọ́ dípò yíyí i padà sí ẹni kejì, ó sì jẹ́ gbólóhùn àídájú Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ σημεῖα nínú àyíká Jòhánù
  choice: àwọn àmì
  alternative: àwọn iṣẹ́ ìyanu
  rationale: ‘Àmì’ pa ìwọ̀n ẹ̀kọ́ pé àwọn iṣẹ́ náà ń tọ́ka sí ẹni tí Jésù jẹ́ àti iṣẹ́ rẹ̀ mọ́, láìsẹ́ pé wọ́n jẹ́ iṣẹ́ ìyanu.
- issue: Bóyá kí a mú ìyípadà láti ẹni kejì sí ẹni kẹta dọ́gba
  choice: bí Ọlọ́run kò bá wà pẹ̀lú ẹni náà
  alternative: bí Ọlọ́run kò bá wà pẹ̀lú rẹ
  rationale: Gíríìkì yí láti ‘ìwọ’ sí ‘ẹni náà.’ Pípa èyí mọ́ ń dá àwọ̀n ọ̀rọ̀ orísun sí, kò sì tú ìṣòro ọ̀rọ̀ náà ní ìkọ̀kọ̀.
- issue: Bóyá ἀπὸ θεοῦ ἐλήλυθας túmọ̀ sí pé Ọlọ́run rán án ní pàtó
  choice: o ti ọ̀dọ̀ Ọlọ́run wá
  alternative: Ọlọ́run ni ó rán ọ
  rationale: Ẹsẹ náà sọ ibi tí ó ti wá, ṣùgbọ́n kò lo ọ̀rọ̀-ìṣe ‘rán’; nítorí náà a kò fi ẹ̀kọ́ tó lágbára ju ọ̀rọ̀ orísun lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ‘Rábì’ mọ́ gẹ́gẹ́ bí oyè Júù, a sì pa ìyípadà ẹni kejì sí ẹni kẹta nínú ọ̀rọ̀ Nikodémù mọ́.
