id: JHN.3.21
reference: John 3:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó ń ṣe òtítọ́[a] ń wá sí ìmọ́lẹ̀, kí àwọn iṣẹ́ rẹ̀ lè farahàn[d] pé nínú Ọlọ́run ni a ti ṣe wọ́n[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ń tẹ̀ lé òtítọ́,” tàbí “ẹni tí ó ń ṣe ohun tí ó jẹ́ òtítọ́.” Ní tààrà, Gíríìkì sọ pé “ṣe òtítọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí pé a ti ṣe wọ́n nínú Ọlọ́run.” Ọ̀rọ̀ ìsopọ̀ Gíríìkì náà lè ṣàlàyé ohun tí a fihàn tàbí ìdí tí ó fi farahàn.
    reason: alternative_reading
  - marker: c
    text: A tún lè lóye “nínú Ọlọ́run” sí “láti ọ̀dọ̀ Ọlọ́run” tàbí “nípasẹ̀ Ọlọ́run”; ṣùgbọ́n gbólóhùn Gíríìkì náà kò fi ìtumọ̀ kan ṣoṣo múlẹ̀.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “kí ó lè hàn pé a ti ṣe àwọn iṣẹ́ rẹ̀ nínú Ọlọ́run.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Ṣùgbọ́n ẹni tí ó ń ṣe òtítọ́
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ pẹ̀lẹ́ tí δέ ń fi hàn pamọ́. “Ẹni tí ó ń ṣe” mú ìṣe tí ó ń bá a lọ nínú participle náà jáde, “ṣe òtítọ́” sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ṣíṣe ohun tí ó tọ́ nìkan.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: ń wá sí ìmọ́lẹ̀
  rationale: “Wá sí” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣípò sí ọ̀dọ̀ ohun kan, ó sì pa àpèjúwe ìmọ́lẹ̀ mọ́.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: kí àwọn iṣẹ́ rẹ̀ lè farahàn
  rationale: “Kí ... lè” fi ète ἵνα hàn, “farahàn” sì pa ohùn àìṣe-taara φανερωθῇ mọ́. “Àwọn iṣẹ́ rẹ̀” kò dá ẹ̀wà tàbí ibi iṣẹ́ náà lẹ́jọ́ ṣáájú ohun tí àyíká ọ̀rọ̀ sọ.
- source_word: ὅτι
  choice: pé
  rationale: '“Pé” ka ὅτι gẹ́gẹ́ bí ohun tí ìfarahàn náà ń fihàn: pé a ṣe àwọn iṣẹ́ náà nínú Ọlọ́run. Àlàyé ìsàlẹ̀ fi “nítorí pé” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó ṣeé ṣe.'
- source_word: ἐν θεῷ
  choice: nínú Ọlọ́run
  rationale: Ìtumọ̀ yìí mọ̀ọ́mọ̀ pa gbólóhùn náà sílẹ̀ ní ṣíṣí, bí Gíríìkì ṣe rí, láì pinnu bóyá ó ń tọ́ka sí ipá Ọlọ́run, ọ̀nà Ọlọ́run, tàbí ìbáṣepọ̀ pẹ̀lú Ọlọ́run.
- source_word: ἐστιν εἰργασμένα
  choice: ni a ti ṣe wọ́n
  rationale: “A ti ṣe wọ́n” fi ipò ìṣe tí a ti parí tí ó sì ní àbájáde títí lọ hàn, ó sì pa ìṣe náà mọ́ ní ọ̀nà tí kò sọ ẹni tó ṣe é ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ àkànlò ποιῶν τὴν ἀλήθειαν
  choice: ṣe òtítọ́
  alternative: máa tẹ̀ lé òtítọ́; ṣe ohun tí ó jẹ́ òtítọ́
  rationale: Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ pa ìrísí ẹ̀kọ́ Jòhánù mọ́ pé kì í ṣe pé a mọ òtítọ́ nìkan, ṣùgbọ́n a tún ń ṣe é.
- issue: Iṣẹ́ ὅτι nínú gbólóhùn náà
  choice: pé—ó ń ṣàlàyé ohun tí a fihàn
  alternative: nítorí pé—ó ń sọ ìdí tí àwọn iṣẹ́ náà fi farahàn
  rationale: Àwọn méjèèjì ṣeé gbà nínú Gíríìkì. Àkọ́kọ́ bá ìṣàn ọ̀rọ̀ lẹ́yìn “farahàn” mu dáadáa ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- issue: Ìtumọ̀ ἐν θεῷ
  choice: nínú Ọlọ́run
  alternative: láti ọ̀dọ̀ Ọlọ́run; nípasẹ̀ Ọlọ́run
  rationale: “Nínú Ọlọ́run” kò fi dandan sọ pé ohun èlò tàbí olùṣe nìkan ni Ọlọ́run; ó pa àyè sílẹ̀ fún agbára, àyíká, àti ìbáṣepọ̀ pẹ̀lú Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán “ṣe òtítọ́,” “ìmọ́lẹ̀,” àti “nínú Ọlọ́run” mọ́ nítorí ìjẹ́pàtàkì wọn nínú ọ̀rọ̀ Jòhánù.
