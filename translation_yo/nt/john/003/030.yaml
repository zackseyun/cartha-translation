  verdict: revise
  source_fidelity: 'The draft correctly represents the contrasted necessities expressed by δεῖ and preserves the ongoing comparative movement of αὐξάνειν / ἐλαττοῦσθαι. However, “di ẹni ńlá sí i / di ẹni kékeré sí i” narrows the wording toward becoming a socially important or insignificant person. The Greek remains broader: Jesus is to increase, while John is to diminish.'
  naturalness: “Pọ̀ sí i / dín kù” is concise, idiomatic Standard Yorùbá and preserves the balanced, proverbial force of the Greek more directly. “Òun” suitably retains the contextual emphasis of ἐκεῖνον.
  terminology: “Gbọ́dọ̀” faithfully conveys δεῖ without defining the source or mode of necessity. No doctrinal elaboration is introduced.
