    issue: The expressions “máa di ẹni ńlá sí i” and “máa di ẹni kékeré sí i” are overly person-specific.
    rationale: They can suggest becoming a great or small person in rank, whereas αὐξάνειν and ἐλαττοῦσθαι are broader and deliberately parallel expressions of increase and diminution.
  - severity: low
    issue: The current footnote's proposed alternative is closer to the Greek's broad verbal wording than the main text.
    rationale: The main text should itself use the broad, parallel wording, while the note may retain the more explicit demonstrative and the alternative “di kéré sí i.”
