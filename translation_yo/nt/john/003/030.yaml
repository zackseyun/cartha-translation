  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: yo
  text: Òun gbọ́dọ̀ máa pọ̀ sí i[a], ṣùgbọ́n èmi gbọ́dọ̀ máa dín kù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “Ẹni náà gbọ́dọ̀ máa pọ̀ sí i, ṣùgbọ́n èmi sì gbọ́dọ̀ máa di kéré sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: Òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Jésù nínú àyíká ọ̀rọ̀. “Òun” jẹ́ ọ̀nà Yorùbá àdánidá láti fi tẹnumọ́ ẹni tí a ń sọ̀rọ̀ nípa rẹ̀, láìfi ìtumọ̀ mìíràn kún Gíríìkì.
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: “Gbọ́dọ̀” pa agbára ìjẹ́dandan tàbí ohun tí ó yẹ kí ó ṣẹlẹ̀ mọ́, láìsọ irú ìjẹ́dandan náà di pàtó ju bí ẹsẹ̀ ṣe sọ lọ.
- source_word: αὐξάνειν
  choice: máa di ẹni ńlá sí i
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti pọ̀ sí i, dàgbà, tàbí di ńlá sí i. Ní àyíká yìí, gbígba Jésù ní ọlá àti ipò púpọ̀ sí i ló wà níwájú; gbolohun yìí sì yẹra fún ìtumọ̀ ìdàgbàsókè ara nìkan.
- source_word: ἐμὲ
  choice: èmi
  rationale: “Èmi” ni kókó gbólóhùn Yorùbá, ó sì tún pa ìfiwéra tí ó lágbára mọ́ láàárín Jésù àti Jòhánù.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín bí Jésù ṣe ń di ńlá sí i àti bí Jòhánù ṣe ń di kékeré sí i.
- source_word: ἐλαττοῦσθαι
  choice: máa di ẹni kékeré sí i
  rationale: Èyí pa ìtumọ̀ “di ohun tí ó kéré sí i” àti ìṣe tí ń tẹ̀ síwájú mọ́, ó sì bá “máa di ẹni ńlá sí i” dọ́gba ní ìṣọ̀kan gbólóhùn.
theological_decisions:
- issue: Irú ìjẹ́dandan tí δεῖ ń fi hàn
  choice: A túmọ̀ ọ́ sí “gbọ́dọ̀,” tí ó fi ìjẹ́dandan àti ìlànà tí ó yẹ hàn láìṣàlàyé rẹ̀ ju ọ̀rọ̀ náà lọ.
  alternative: A lè ka á sí dandan lásán nítorí ipò ohun, tàbí sí àṣẹ Ọlọ́run tí a sọ ní tààrà.
  rationale: Ní ọ̀pọ̀ ibi, δεῖ lè ní ìwọ̀n ìjẹ́dandan Ọlọ́run nínú ètò ìgbàlà, ṣùgbọ́n ẹsẹ̀ yìí kò sọ orísun tàbí ọ̀nà ìjẹ́dandan náà ní kedere. “Gbọ́dọ̀” pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ àti àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye; ìṣọ̀kan “ńlá sí i / kékeré sí i” pa agbára òwe kúkúrú inú Gíríìkì mọ́.
