id: JHN.3.20
reference: John 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: yo
  text: Nítorí gbogbo ẹni tí ó ń ṣe ohun ibi ni ó kórìíra ìmọ́lẹ̀, kò sì wá sí ìmọ́lẹ̀, kí a má bàa tú àwọn iṣẹ́ rẹ̀ síta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí a má bàa fi àwọn iṣẹ́ rẹ̀ hàn pé wọ́n burú,” tàbí “kí a má bàa fi ẹ̀bi àwọn iṣẹ́ rẹ̀ hàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú ìṣe búburú hàn, fífi ẹ̀bi hàn, tàbí bíbá ẹni wí nítorí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: Nítorí gbogbo ẹni tí ó
  rationale: “Nítorí” pa ipa ìṣàlàyé γάρ mọ́; “gbogbo ẹni tí ó” sì fi ọ̀rọ̀ náà hàn gẹ́gẹ́ bí ohun tí ó kan ẹnikẹ́ni tó ní ìwà tí a ń sọ̀rọ̀ rẹ̀.
- source_word: φαῦλα πράσσων
  choice: ń ṣe ohun ibi
  rationale: Àpólà yìí sọ nípa ìṣe ibi gẹ́gẹ́ bí ìwà tí ẹni náà ń bá a lọ láti máa ṣe. “Ohun ibi” mú agbára ìwà-bíburú ti φαῦλα jáde láì dín in kù sí ohun tí kò wúlò lásán.
- source_word: μισεῖ
  choice: kórìíra
  rationale: “Kórìíra” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìtakò líle tí μισέω ń sọ.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀
  rationale: A pa àwòrán pàtàkì ti ìmọ́lẹ̀ mọ́, nítorí pé ó ń tọ́ka sí ìṣípayá àti òtítọ́ nínú ọ̀rọ̀ Jòhánù.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: kò sì wá sí ìmọ́lẹ̀
  rationale: Èyí pa ìṣípò lọ sí ọ̀dọ̀ ìmọ́lẹ̀ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ìkọ̀lé Yorùbá yìí fi ète láti yẹra fún ohun kan hàn, gẹ́gẹ́ bí ἵνα μή ṣe rí níbí.
- source_word: ἐλεγχθῇ
  choice: kí a má bàa tú ... síta
  rationale: “Tú ... síta” bá àwòrán ìmọ́lẹ̀ tó ń mú ohun ìkọ̀kọ̀ hàn mu, ó sì pa ìtumọ̀ ìṣípayá ẹ̀ṣẹ̀ mọ́ láì fi ìtumọ̀ ìdájọ́ kàn án ní pàtó.
- source_word: τὰ ἔργα αὐτοῦ
  choice: àwọn iṣẹ́ rẹ̀
  rationale: “Àwọn iṣẹ́” ṣe àfihàn ọ̀pọ̀ τὰ ἔργα; “rẹ̀” sì tọ́ka sí ẹni kan náà lọ́nà àdánidá tí kò ní àmì akọ tàbí abo ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ἐλεγχθῇ ní ìbáṣepọ̀ pẹ̀lú ìmọ́lẹ̀
  choice: tú àwọn iṣẹ́ rẹ̀ síta
  alternative: bá àwọn iṣẹ́ rẹ̀ wí; dá àwọn iṣẹ́ rẹ̀ lẹ́bi; fi àwọn iṣẹ́ rẹ̀ hàn pé wọ́n burú
  rationale: Nínú àyíká yìí, ìmọ́lẹ̀ ń mú ìṣe ibi tí a fẹ́ fi pamọ́ hàn. Ìtumọ̀ tí a yàn pa ìṣípayá yìí mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ Gíríìkì náà tún lè ní agbára ìbáwí tàbí fífi ẹ̀bi hàn.
- issue: Ọ̀rọ̀ akọ tó dúró fún ẹnikẹ́ni nínú Gíríìkì
  choice: àwọn iṣẹ́ rẹ̀
  alternative: àwọn iṣẹ́ ẹni náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “rẹ̀” kò fi akọ tàbí abo hàn ní Yorùbá, ó sì pa ìtọ́kasí sí ẹnì kọ̀ọ̀kan mọ́ láì mú ọ̀rọ̀ náà di ọ̀pọ̀ ènìyàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “kórìíra” àti “ìmọ́lẹ̀” láti pa agbára àti àwòrán ọ̀rọ̀ Jòhánù mọ́; “rẹ̀” sì yàgò fún fífi akọ tàbí abo kún ọ̀rọ̀ níbi tí èdè Yorùbá kò ti béèrè rẹ̀.
