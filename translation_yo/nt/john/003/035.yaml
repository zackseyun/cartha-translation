  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: yo
  text: Baba nífẹ̀ẹ́ Ọmọ náà, ó sì ti fi ohun gbogbo lé e lọ́wọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “nínú ọwọ́ rẹ̀.” Àkànlò Gíríìkì náà ń tọ́ka sí fífi ohun sí àbójútó, ìní, tàbí àṣẹ ẹnì kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: A lo “Baba” gẹ́gẹ́ bí orúkọ ìbátan pàtàkì fún Ọlọ́run nínú ọ̀rọ̀ yìí, kì í ṣe fún baba lásán.
- source_word: ἀγαπᾷ
  choice: nífẹ̀ẹ́
  rationale: Ìṣe àsìkò ìsinsìnyí nínú Gíríìkì ń sọ òtítọ́ tí ó dúró ṣinṣin; “nífẹ̀ẹ́” sọ èyí ní Yorùbá àdánidá.
- source_word: τὸν υἱόν
  choice: Ọmọ
  rationale: “Ọmọ” ni a lò gẹ́gẹ́ bí orúkọ ìbátan pàtàkì fún Jésù ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Baba.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Èyí pa ìtúmọ̀ tó gbòòrò ti ọ̀rọ̀ Gíríìkì mọ́, láì dín un kù sí ohun kan pàtó.
- source_word: δέδωκεν
  choice: ó sì ti fi
  rationale: Àmì “ti” ń fi hàn pé iṣẹ́ náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ṣì dúró, bí perfect tense Gíríìkì ṣe túmọ̀ sí.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: lé e lọ́wọ́
  rationale: Ọ̀rọ̀ àdéhùn Yorùbá yìí túmọ̀ sí fífi ohun sí àbójútó tàbí àṣẹ ẹnì kan, ó sì bá àkànlò Gíríìkì mu lọ́nà àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ Baba àti Ọmọ
  choice: A pa àwọn orúkọ ìbátan “Baba” àti “Ọmọ” mọ́.
  alternative: Lílo “baba” àti “ọmọ” gẹ́gẹ́ bí ọ̀rọ̀ ìdílé lásán.
  rationale: Àyíká ìwé Jòhánù fi hàn pé wọ́n jẹ́ orúkọ ìbátan pàtàkì fún Ọlọ́run àti Jésù; ìtumọ̀ náà kò fi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
- issue: Ìwọ̀n àti ìdúróṣinṣin ohun tí Baba fi fún Ọmọ
  choice: A tú πάντα sí “ohun gbogbo,” a sì lo “ti fi” fún δέδωκεν.
  alternative: “fi gbogbo rẹ̀ fún un” láì fi hàn pé àbájáde iṣẹ́ náà ṣì dúró.
  rationale: Èyí pa ìwọ̀n gbogbo ohun tí a fi fún Ọmọ àti àbájáde tí ó ń bá a lọ mọ́, láì ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. “Lé e lọ́wọ́” jẹ́ àkànlò Yorùbá àdánidá fún fífi ohun sí àbójútó tàbí àṣẹ ẹnì kan; àmì ohùn ni a fi sí ibi tí ó yẹ.
