  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: yo
  text: Nikodémù dá a lóhùn, ó sì wí fún un pé, “Báwo ni àwọn nǹkan wọ̀nyí ṣe lè ṣẹlẹ̀?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo ni àwọn nǹkan wọ̀nyí ṣe lè rí bẹ́ẹ̀?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá a lóhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan fèsì nínú ìjíròrò, ó sì bá iṣẹ́ ἀποκρίνομαι mu.
- source_word: Νικόδημος
  choice: Nikodémù
  rationale: A kọ orúkọ náà ní ìlànà ìkọ-orúkọ Yorùbá tí ó wọ́pọ̀, dípò títúmọ̀ ìtumọ̀ orúkọ náà.
- source_word: εἶπεν αὐτῷ
  choice: ó sì wí fún un pé
  rationale: Èyí pa ọ̀rọ̀ arọ́pò-orúkọ ‘fún un’ mọ́, kò sì fi orúkọ Jésù kún ohun tí Gíríìkì kò sọ ní kedere.
- source_word: Πῶς
  choice: Báwo ni ... ṣe
  rationale: Èyí ni àkójọpọ̀ ọ̀rọ̀ ìbéèrè Yorùbá tí ó bójú mu fún ìbéèrè nípa ọ̀nà tàbí bí ohun kan ṣe ṣeé ṣe.
- source_word: δύναται
  choice: lè
  rationale: ‘Lè’ sọ agbára tàbí ṣíṣeéṣe ní Yorùbá ìsinsìnyí láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Èyí pa ọ̀pọ̀ nǹkan tí ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì tọ́ka sí mọ́, ó sì so ìbéèrè náà pọ̀ mọ́ àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: γενέσθαι
  choice: ṣẹlẹ̀
  rationale: Nínú àyíká yìí, ‘ṣẹlẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ó wáyé tàbí tí ó ṣẹ, nígbà tí ‘wà’ jẹ́ àṣàyàn tí ó túbọ̀ gbooro.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìbéèrè Nikodémù nípa àwọn ohun tí Jésù ṣàlàyé
  choice: Báwo ni àwọn nǹkan wọ̀nyí ṣe lè ṣẹlẹ̀?
  alternative: Báwo ni àwọn nǹkan wọ̀nyí ṣe lè rí bẹ́ẹ̀?
  rationale: ‘Ṣẹlẹ̀’ mú ìtumọ̀ ohun tí ń wáyé nínú γενέσθαι jáde ní èdè Yorùbá àdánidá, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn tó lè túmọ̀ sí bí àwọn nǹkan náà ṣe lè ‘rí bẹ́ẹ̀’ mọ́. Èyí kò dá ìjìnlẹ̀ ẹ̀kọ́ nípa ìbí tuntun yanjú láìnídìí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ó ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo ‘wí fún un pé’ gẹ́gẹ́ bí àṣà ìtàn Bíbélì tí ó ṣì ṣe kedere, a sì fi àmì ohùn síbi tí ó bá yẹ.
