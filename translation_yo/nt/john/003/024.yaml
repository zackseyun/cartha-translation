  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: yo
  text: Nítorí a kò tíì ju Jòhánù sínú ẹ̀wọ̀n[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, Jòhánù Onítẹ̀bọmi.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: kò tíì
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà kò tíì ṣẹlẹ̀ ní àkókò tí ìtàn náà ń tọ́ka sí; èyí ni ọ̀nà àdánidá láti sọ “not yet” ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Níhìn-ín, γάρ ń fúnni ní àlàyé ìpìlẹ̀ fún ohun tí ó yí ẹsẹ yìí ká; “Nítorí” pa agbára àlàyé náà mọ́.
- source_word: ἦν βεβλημένος
  choice: a kò tíì ju ... sínú
  rationale: Ìkọ̀lé yìí jẹ́ ti ìṣe tí a ṣe sí ẹni kan, tí ó sì yẹ kí ó ti ṣẹlẹ̀ ṣáájú àkókò ìtàn. Ìṣètò Yorùbá “a kò tíì ju” sọ pé àwọn kan ni yóò ṣe ìṣe náà sí Jòhánù, ṣùgbọ́n kò tíì ṣẹlẹ̀; “ju ... sínú” tún pa agbára βάλλω mọ́.
- source_word: εἰς τὴν φυλακήν
  choice: sínú ẹ̀wọ̀n
  rationale: φυλακή túmọ̀ sí ibi ìhámọ́ tàbí ẹ̀wọ̀n ní àyíká yìí, εἰς sì ní agbára ìtọ́sọ́nà “sínú.”
- source_word: ὁ Ἰωάννης
  choice: Jòhánù
  rationale: Ọ̀rọ̀ Gíríìkì sọ orúkọ náà nìkan. Àyíká ló fi hàn pé Jòhánù Onítẹ̀bọmi ni, nítorí náà a kò fi àlàyé yẹn kún ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ta ni Ἰωάννης ń tọ́ka sí?
  choice: Jòhánù
  alternative: Jòhánù Onítẹ̀bọmi
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé Jòhánù Onítẹ̀bọmi ni, ẹsẹ Gíríìkì sọ “Jòhánù” nìkan. A pa èyí mọ́ nínú ọ̀rọ̀ pàtàkì, a sì fi ìdánimọ̀ náà sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tí ó lọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo gbolohun aláìlẹ́ni-lórúkọ “a kò tíì ju” láti fi ohùn àfarawà Gíríìkì hàn lọ́nà àdánidá.
