revisions:
- from: Ẹnikẹ́ni tí ó bá ti gba ẹ̀rí rẹ̀ ti fi èdìdì rẹ̀ múlẹ̀ pé olóòótọ́ ni Ọlọ́run[a].
  to: Ẹnikẹ́ni tí ó bá ti gba ẹ̀rí rẹ̀, ó ti fi èdìdì sí i pé olóòótọ́ ni Ọlọ́run[a].
  rationale: The revision replaces an awkward sealing expression with the natural Yoruba idiom “fi èdìdì sí i pé,” which closely represents ἐσφράγισεν while retaining its metaphorical force. It also aligns the footnote with the revised main text by presenting “fìdí múlẹ̀” as the idiomatic alternative rather than redundantly treating sealing language as an alternative.
  reviewer_model: gpt-5.6-terra
