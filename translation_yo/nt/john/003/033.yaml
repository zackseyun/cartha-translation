  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá ti gba ẹ̀rí rẹ̀, ó ti fi èdìdì sí i pé olóòótọ́ ni Ọlọ́run[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ti fìdí múlẹ̀ pé olóòótọ́ ni Ọlọ́run.” Ní ọ̀rọ̀ gẹ́gẹ́ bí a ti kọ ọ́, “ó ti fi èdìdì sí i pé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Ẹnikẹ́ni tí ó bá ti gba
  rationale: Àpilẹ̀kọ pẹ̀lú participle aorist ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí ẹnikẹ́ni lápapọ̀. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣe tí a ti ṣe mọ́.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ẹni tí ó wá láti ọ̀run, ìyẹn ẹni tí ẹ̀rí rẹ̀ ni a ń sọ̀rọ̀ nípa rẹ̀ nínú àyíká ẹsẹ náà.
- source_word: μαρτυρίαν
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” bá ohun tí a gbà mu, ó sì pa àkòrí ẹlẹ́rìí àti jíjẹ́rìí nínú Jòhánù mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἐσφράγισεν
  choice: ti fi èdìdì rẹ̀ múlẹ̀
  rationale: 'Èyí pa àwòrán ìpilẹ̀ṣẹ̀ ti fífi èdìdì sí ohun kan mọ́, nígbà tí “múlẹ̀” sọ agbára àfiwé rẹ̀ di mímọ̀: ẹni náà ti fìdí ọ̀rọ̀ náà múlẹ̀.'
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń mú àkóónú ohun tí a fìdí rẹ̀ múlẹ̀ wọlé, kì í ṣe ìdí ohun kan.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Kókó gbólóhùn náà dájú, kò sì nílò àfikún kankan.
- source_word: ἀληθής
  choice: olóòótọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tẹnu mọ́ pé Ọlọ́run ń sọ òtítọ́, ó sì ṣeé gbára lé. “Olóòótọ́” jẹ́ Yorùbá àdánidá ju lílo “òtítọ́” gẹ́gẹ́ bí àpèjúwe ẹni lọ.
theological_decisions:
- issue: Agbára àfiwé èdìdì nínú ἐσφράγισεν
  choice: Pa èdìdì mọ́ nínú ọ̀rọ̀ àkọ́kọ́ pẹ̀lú “ti fi èdìdì rẹ̀ múlẹ̀”
  alternative: ti fìdí rẹ̀ múlẹ̀
  rationale: Àyípadà náà jẹ́ mímọ̀ fún òǹkàwé Yorùbá, ó sì tún pa àwòrán pàtàkì ti fífi èdìdì gẹ́gẹ́ bí ìjẹ́rìí tàbí ìfọwọ́sí mọ́.
- issue: Ìtumọ̀ ἀληθής nípa Ọlọ́run
  choice: olóòótọ́
  alternative: òótọ́
  rationale: “Olóòótọ́” fi òtítọ́ àti jíjẹ́ ẹni tí a lè gbára lé hàn láìfi ẹ̀kọ́ ìsìn àfikún sí ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. A pa àwòrán èdìdì inú Gíríìkì mọ́ ní ọ̀rọ̀ àkọ́kọ́, a sì ṣàlàyé ìtumọ̀ rẹ̀ nínú àlàyé ìsàlẹ̀.
