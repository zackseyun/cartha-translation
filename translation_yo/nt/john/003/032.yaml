language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: yo
  text: Ohun tí ó ti rí, tí ó sì gbọ́, ohun náà ni ó ń jẹ́rìí sí[a], kò sì sí ẹni tí ó gba ẹ̀rí rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ó ń ṣe ẹ̀rí sí i.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà, “kò sí ẹni tí ó gba ẹ̀rí rẹ̀,” jẹ́ gbólóhùn gbogbo-gbòò tó lágbára; ẹsẹ tó tẹ̀ lé e sọ̀rọ̀ nípa ẹni tí ó gba ẹ̀rí náà.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: Ohun tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí ohun tí a rí, tí a sì gbọ́, kì í ṣe sí ènìyàn kan; “Ohun tí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ náà hàn.
- source_word: ἑώρακεν
  choice: ó ti rí
  rationale: “Ti rí” fi hàn pé ìríran náà ti ṣẹlẹ̀, ṣùgbọ́n ó ṣì ṣe pàtàkì nísinsìnyí, gẹ́gẹ́ bí àkókò perfect Gíríìkì ṣe túmọ̀ sí.
- source_word: ἤκουσεν
  choice: ó sì gbọ́
  rationale: Aorist ni ọ̀rọ̀ Gíríìkì yìí; “gbọ́” jẹ́ ìtumọ̀ tààrà tí ó sì bá ìṣọ̀kan gbólóhùn Yorùbá mu.
- source_word: τοῦτο
  choice: ni
  rationale: Nínú ìṣètò “Ohun tí … ni …,” àmì ìdojúkọ “ni” tún tọ́ka sí ohun kan náà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì mú ìtumọ̀ τοῦτο jáde lọ́nà Yorùbá àdánidá.
- source_word: μαρτυρεῖ
  choice: ó ń jẹ́rìí sí
  rationale: “Jẹ́rìí sí” pa ìtumọ̀ fífi ẹ̀rí hàn mọ́, ó sì yẹ fún àṣà ọ̀rọ̀ Jòhánù.
- source_word: μαρτυρίαν
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún testimony, ó sì pa ìbátan ọ̀rọ̀ rẹ̀ mọ́ pẹ̀lú “jẹ́rìí.”
- source_word: οὐδεὶς
  choice: kò sí ẹni
  rationale: Èyí pa ìkọ̀sílẹ̀ gbogbo ènìyàn tí ọ̀rọ̀ Gíríìkì ní mọ́ láì dín agbára rẹ̀ kù.
- source_word: λαμβάνει
  choice: gba
  rationale: “Gba” lè túmọ̀ sí gbígba ẹ̀rí tàbí fífi ọwọ́ sí i; ó jẹ́ ọ̀rọ̀ àdánidá, ó sì sún mọ́ ìtumọ̀ λαμβάνω ju àlàyé gígùn lọ.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ọ̀rọ̀ gbogbo-gbòò “kò sí ẹni tí ó gba ẹ̀rí rẹ̀”
  choice: 'Pa gbólóhùn líle náà mọ́ gẹ́gẹ́ bí ó ti wà: “kò sí ẹni.”'
  alternative: “Àwọn díẹ̀ péré ló gba ẹ̀rí rẹ̀,” tàbí kí a ka a sí ìsọfúnni aláìlẹ́gbẹ́ pé kò sí ẹnikẹ́ni rárá.
  rationale: Gíríìkì lo ìkọ̀sílẹ̀ gbogbo-gbòò ní tààrà. Ẹsẹ tó tẹ̀ lé e sọ̀rọ̀ nípa ẹni tí ó gba ẹ̀rí náà; nítorí náà, a pa ìforígbárí ọ̀rọ̀ náà mọ́, a kò sì tú u sí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A lo “ó” fún arọ́pò-orúkọ kókó, “ẹ̀rí/jẹ́rìí” sì pa àkòrí fífi ẹ̀rí hàn mọ́. Àmì ohùn kún ibi tí ó yẹ.
