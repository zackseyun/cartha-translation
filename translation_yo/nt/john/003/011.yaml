id: JHN.3.11
reference: John 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: yo
  text: “Lóòótọ́, lóòótọ́ ni mo sọ fún ọ pé,[a] ohun tí a mọ̀ ni a ń sọ, ohun tí a sì ti rí ni a ń jẹ́rìí sí;[b] ẹ̀yin kò sì gba ẹ̀rí wa.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àmín, àmín, mo wí fún ọ.”
    reason: lexical_alternative
  - marker: b
    text: A kò sọ ní pàtó ẹni tí àwọn arọ́pò-orúkọ “a” àti “wa” ń tọ́ka sí; a sì ń jiyàn nípa ẹgbẹ́ tí Jesu ń tọ́ka sí.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ẹ̀yin kò tẹ́wọ́ gba ẹ̀rí wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó fi ìtẹnumọ́ ọ̀rọ̀ méjì inú Gíríìkì hàn ní Yorùbá àdánidá, ó sì mú agbára ọ̀rọ̀ ìdánilójú náà wá láìfi ọ̀rọ̀ Hébérù sílẹ̀ láìtumọ̀.
- source_word: λέγω σοι
  choice: ni mo sọ fún ọ
  rationale: Ìtumọ̀ Yorùbá àdánidá ni fún ọ̀rọ̀ tí Jesu ń sọ tààrà sí ẹni kan; “ọ” tún pa nọ́ńbà ẹyọ inú σοι mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí Jesu ń sọ, kì í ṣe gbólóhùn okùnfà.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: ohun tí a mọ̀ ni a ń sọ
  rationale: Ó pa ohun tí a mọ̀ àti nọ́ńbà ọ̀pọ̀ mọ́, nígbà tí ìṣètò “ni” fi ìtẹnumọ́ àkọ́kọ́ Gíríìkì hàn lọ́nà Yorùbá tó ṣe déédéé.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: ohun tí a sì ti rí ni a ń jẹ́rìí sí
  rationale: “Ti rí” fi iṣẹ́ tó ti ṣẹlẹ̀ ṣùgbọ́n tó ṣì ní ìbáṣepọ̀ pẹ̀lú ìsinsìnyí hàn; “jẹ́rìí sí” sì jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún fífi ẹ̀rí ohun tí ẹni rí múlẹ̀.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: ẹ̀rí wa
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú “jẹ́rìí,” ó sì fi nọ́ńbà ọ̀pọ̀ àti ohun-ìní hàn láìṣe àlàyé ẹni tí “wa” ń tọ́ka sí.
- source_word: οὐ λαμβάνετε
  choice: ẹ̀yin kò ... gba
  rationale: “Gba” lè túmọ̀ sí gbígba tàbí fífi inú tẹ́wọ́ gba; “ẹ̀yin” fi nọ́ńbà ọ̀pọ̀ inú ọ̀rọ̀-ìṣe Gíríìkì hàn kedere.
- source_word: καὶ ... καὶ
  choice: sì ... sì
  rationale: Ó pa àsopọ̀ “àti” inú Gíríìkì mọ́ ní ìṣètò Yorùbá, láìfi ìtumọ̀ atakò bí “síbẹ̀” kún un.
theological_decisions:
- issue: Àwọn arọ́pò-orúkọ ẹni àkọ́kọ́ ọ̀pọ̀ (“a ... wa”)
  choice: A pa wọ́n mọ́ gẹ́gẹ́ bí “a” àti “wa,” láìsọ ẹni pàtó tí wọ́n ní nínú.
  alternative: Kí a túmọ̀ “a/wa” sí Jesu àti àwọn ọmọ-ẹ̀yìn rẹ̀, sí ọ̀pọ̀ ọ̀rọ̀ àsọyé, tàbí sí àwọn ẹlẹ́rìí ọ̀run.
  rationale: Gíríìkì lo nọ́ńbà ọ̀pọ̀ ní kedere, ṣùgbọ́n a ṣì ń jiyàn nípa àwọn tí ó tọ́ka sí. Títọ́jú ọ̀pọ̀ náà dáàbò bo àìdánilójú àti ìfúnpá ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà.
- issue: Ìyípadà láti ẹni kejì ẹyọ sí ẹni kejì ọ̀pọ̀
  choice: “fún ọ” fún σοι, ṣùgbọ́n “ẹ̀yin kò gba” fún λαμβάνετε.
  alternative: Lílo “ọ” ní gbogbo ẹsẹ tàbí lílo “ẹ̀yin” ní gbogbo ẹsẹ.
  rationale: Orísun Gíríìkì yí láti ẹni kan tí Jesu ń bá sọ̀rọ̀ sí sí àwùjọ ọ̀pọ̀ tí kò gba ẹ̀rí náà; Yorùbá lè fi ìyàtọ̀ yìí hàn kedere.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá yẹ. “Jẹ́rìí sí” àti “ẹ̀rí” mú ìsopọ̀ ọ̀rọ̀-ìṣe àti orúkọ inú Gíríìkì wá; ìyàtọ̀ “ọ/ẹ̀yin” sì pa nọ́ńbà orísun mọ́.
