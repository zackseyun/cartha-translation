id: JHN.3.8
reference: John 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: yo
  text: Afẹ́fẹ́[a] ń fẹ́ sí ibi tí ó fẹ́, ìwọ sì ń gbọ́ ìró rẹ̀[b], ṣùgbọ́n ìwọ kò mọ̀ ibi tí ó ti ń bọ̀ àti ibi tí ó ń lọ. Bẹ́ẹ̀ ni ó rí nípa gbogbo ẹni tí a bí láti inú Ẹ̀mí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì pneuma lè túmọ̀ sí ‘afẹ́fẹ́’ tàbí ‘ẹ̀mí.’ Jésù lo ọ̀rọ̀ kan náà ní apá méjèèjì ẹsẹ yìí, ó sì tipa bẹ́ẹ̀ ṣe eré-ọ̀rọ̀ tí Yorùbá kò lè tún ṣe ní kíkún.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ‘ìró’ sí ‘ohùn.’ Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ méjèèjì, ṣùgbọ́n níbí ó ń tọ́ka sí ohun tí etí ń gbọ́ nígbà tí afẹ́fẹ́ ń fẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (v. 8a)
  choice: afẹ́fẹ́
  rationale: Ìṣe náà, πνεῖ (‘fẹ́’), àti gbígbọ́ φωνή rẹ̀ fi hàn pé afẹ́fẹ́ ni a ń sọ̀rọ̀ nípa rẹ̀ ní ìdá àkọ́kọ́. Èyí mú àpẹẹrẹ Jésù ṣe kedere, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì kan náà tún túmọ̀ sí ‘ẹ̀mí.’
- source_word: ὅπου θέλει πνεῖ
  choice: ń fẹ́ sí ibi tí ó bá fẹ́
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìfẹ́-ọkàn θέλει mọ́. Àtúnlò ‘fẹ́’ fún fífẹ́ afẹ́fẹ́ àti ohun tí ó fẹ́ tún fún ọ̀rọ̀ náà ní ìró eré-ọ̀rọ̀ tó bá àkọsílẹ̀ Gíríìkì mu.
- source_word: φωνήν
  choice: ìró
  rationale: φωνή lè túmọ̀ sí ‘ohùn’ tàbí ‘ìró’; níbí, ‘ìró’ ni ó bá ohun tí etí ń gbọ́ nígbà tí afẹ́fẹ́ ń fẹ́ mu jù lọ, láìfi ìwà ènìyàn lé afẹ́fẹ́ lórí ju ti orísun lọ.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: o kò mọ ibi tí ó ti ń bọ̀ àti ibi tí ó ń lọ
  rationale: Èyí ṣàfihàn ìyàtọ̀ πόθεν (‘ibi tí…ti’) àti ποῦ (‘ibi tí’) ní Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: οὕτως ἐστίν
  choice: Bẹ́ẹ̀ ni ó rí fún
  rationale: Ọ̀nà Yorùbá yìí fi ipa ìfiwéra hàn ní kedere, ó sì darí òǹkàwé láti àpẹẹrẹ afẹ́fẹ́ sí ẹni tí Ẹ̀mí bí.
- source_word: πᾶς ὁ γεγεννημένος
  choice: olúkúlùkù ẹni tí a bí
  rationale: ‘Olúkúlùkù ẹni’ pa ìtumọ̀ gbogbo ènìyàn mọ́ láìfi akọ tàbí abo kan pàtó sí i; ‘tí a bí’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tó ti gba ìbí náà.
- source_word: ἐκ τοῦ πνεύματος (v. 8b)
  choice: láti ọ̀dọ̀ Ẹ̀mí
  rationale: Ní ọ̀rọ̀ ìbí tuntun ti Jòhánù 3, πνεῦμα ń tọ́ka sí Ẹ̀mí Ọlọ́run. ‘Láti ọ̀dọ̀’ pa èrò ἐκ gẹ́gẹ́ bí orísun ìbí mọ́, dípò kí ó túmọ̀ rẹ̀ sí ohun èlò nìkan.
theological_decisions:
- issue: Ìtumọ̀ méjì tí πνεῦμα ní nínú ẹsẹ yìí
  choice: Túmọ̀ ìfarahàn àkọ́kọ́ sí ‘afẹ́fẹ́,’ kí a sì túmọ̀ ìfarahàn ìkẹyìn sí ‘Ẹ̀mí.’
  alternative: Lílo ‘Ẹ̀mí’ ní ibi méjèèjì, tàbí lílo ‘afẹ́fẹ́’ ní ibi méjèèjì.
  rationale: Ìbáṣepọ̀ πνεῦμα pẹ̀lú πνεῖ àti ohun tí a ń gbọ́ mú ‘afẹ́fẹ́’ yẹ ní apá àkọ́kọ́; àyíká ọ̀rọ̀ ìbí tuntun sì mú ‘Ẹ̀mí’ yẹ ní apá ìkẹyìn. Àlàyé ìsàlẹ̀ ojú ìwé pa eré-ọ̀rọ̀ Gíríìkì mọ́ láìṣe àìmọ̀ọ́mọ̀ dá ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. ‘Afẹ́fẹ́ ń fẹ́ sí ibi tí ó bá fẹ́’ jẹ́ gbólóhùn tó rọrùn fún òǹkàwé, ó sì ní eré ìró Yorùbá tirẹ̀ láìyí ìtumọ̀ orísun padà. ‘Láti ọ̀dọ̀ Ẹ̀mí’ tẹnu mọ́ Ẹ̀mí gẹ́gẹ́ bí orísun ìbí tuntun.
