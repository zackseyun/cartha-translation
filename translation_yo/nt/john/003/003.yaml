id: JHN.3.3
reference: John 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: yo
  text: Jésù dá a lóhùn pé, “Lóòótọ́, lóòótọ́ ni mo wí fún ọ, bí a kò bá bí ẹni kan láti òkè,[a] kò lè rí ìjọba Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́ẹ̀kan sí i.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “láti òkè” àti “lẹ́ẹ̀kan sí i”; ìjíròrò tó wà ní ẹsẹ tó tẹ̀ lé dá lórí ìtumọ̀ méjèèjì yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: dá a lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe ìdáhùn hàn; kò pọndandan láti tún “ó sì wí” kún un ní Yorùbá.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ àtúnwí Gíríìkì mọ́, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ἐὰν μή τις
  choice: bí a kò bá bí ẹnì kan
  rationale: Ó sọ ipò àìníyẹ̀ náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ gbogbogbò ti τις mọ́.
- source_word: γεννηθῇ
  choice: bí
  rationale: Ọ̀rọ̀ ìṣe aláìṣe fúnra rẹ̀ ni a lò nínú gbólóhùn “bí a … bá bí,” èyí tó bá ìtumọ̀ ‘be born’ mu láìfi ìtumọ̀ ἄνωθεν sínú rẹ̀.
- source_word: ἄνωθεν
  choice: láti òkè
  rationale: Ó túmọ̀ ìtumọ̀ pàtàkì ‘from above’ ní kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì ‘lẹ́ẹ̀kan sí i’ mọ́.
- source_word: οὐ δύναται
  choice: kò lè
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé àti àdánidá jù lọ fún àìlèṣe tí Gíríìkì sọ.
- source_word: ἰδεῖν
  choice: rí
  rationale: Ó jẹ́ ìbámu tààrà, ó sì pa ààyè sílẹ̀ fún ìtumọ̀ rírí, òye, tàbí kíkópa nínú ìjọba náà.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa, tí ó sì lè gba èrò ilẹ̀ ìjọba àti ìṣàkóso Ọlọ́run.
theological_decisions:
- issue: Ìtumọ̀ ἄνωθεν nínú ọ̀rọ̀ Jésù
  choice: láti òkè
  alternative: lẹ́ẹ̀kan sí i / tún bí
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘láti òkè’ tàbí ‘lẹ́ẹ̀kan sí i.’ Àkòrí ohun ọ̀run àti ohun ayé nínú Jòhánù ṣe àtìlẹ́yìn fún ‘láti òkè,’ ṣùgbọ́n ìdáhùn Nikodémù ní ẹsẹ tó tẹ̀ lé fi hàn pé ó gbọ́ ọ́ bí ‘lẹ́ẹ̀kan sí i.’ Nítorí náà, a pa ìtumọ̀ méjèèjì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yé òǹkàwé òde òní. A lo “dá a lóhùn pé” dípò títẹ̀lé àkójọpọ̀ ọ̀rọ̀ Gíríìkì lọ́rọ̀ọ̀rọ̀, ṣùgbọ́n a pa àtúnwí “Lóòótọ́, lóòótọ́” mọ́ fún ìtẹnumọ́.
