id: JHN.3.19
reference: John 3:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: yo
  text: 'Èyí sì ni ìdájọ́ náà: ìmọ́lẹ̀ ti wá sínú ayé, àwọn ènìyàn sì nífẹ̀ẹ́ òkùnkùn ju ìmọ́lẹ̀ lọ, nítorí iṣẹ́ wọn jẹ́ búburú.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: ìdájọ́
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ìṣàyẹ̀wò àti ìpinnu Ọlọ́run mọ́, láì dín un kù sí ìdálẹ́bi nìkan.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀
  rationale: A pa àpẹẹrẹ pàtàkì tí Jòhánù lò mọ́, láì fi ‘Jésù’ rọ́pò rẹ̀ ní ọ̀nà ìtumọ̀.
- source_word: ἐλήλυθεν
  choice: ti wá
  rationale: Ìlò ‘ti’ fi hàn pé ìmọ́lẹ̀ dé, àbájáde dídé náà sì ṣì dúró, gẹ́gẹ́ bí perfect tense Gíríìkì.
- source_word: κόσμον
  choice: ayé
  rationale: ‘Ayé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún κόσμος, ó sì lè gbé ìtumọ̀ ẹ̀dá ayé àti àwọn ènìyàn inú rẹ̀.
- source_word: ἠγάπησαν
  choice: nífẹ̀ẹ́
  rationale: Ó pa agbára ọ̀rọ̀ ‘fẹ́ràn/nífẹ̀ẹ́’ mọ́ dípò kí a túmọ̀ rẹ̀ sí yíyan lásán.
- source_word: οἱ ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí aráyé lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; ‘àwọn ènìyàn’ jẹ́ èdè Yorùbá àdánidá tó péye.
- source_word: μᾶλλον ... ἢ
  choice: ju ... lọ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àfiwé ìfẹ́ sí ohun kan dípò òmíràn.
- source_word: τὸ σκότος
  choice: òkùnkùn
  rationale: Ó pa ìtakora àpẹẹrẹ tó wà láàárín ìmọ́lẹ̀ àti òkùnkùn mọ́.
- source_word: πονηρὰ
  choice: burú
  rationale: Nínú gbólóhùn yìí, ‘burú’ sọ ìwà ibi àwọn iṣẹ́ náà ní èdè Yorùbá tó ṣe déédéé, láì sọ ọ́ di alágbára ju orísun lọ.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: Ó bá ọ̀rọ̀ Gíríìkì mu, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ìlò ‘iṣẹ́’ ní Jòhánù mọ́.
theological_decisions:
- issue: Ẹni tí ‘ìmọ́lẹ̀’ ń tọ́ka sí
  choice: A pa àpẹẹrẹ náà mọ́ gẹ́gẹ́ bí ‘ìmọ́lẹ̀’.
  alternative: Láti sọ ọ́ ní tààrà pé ‘Jésù’ tàbí láti ṣe é ní orúkọ oyè pàtó.
  rationale: Àyíká fi hàn pé Ọmọ ni ìmọ́lẹ̀ náà ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àpẹẹrẹ; pípa á mọ́ ń dá àwọ̀ ẹ̀kọ́ Jòhánù sí.
- issue: Agbára gbogbogbò ti οἱ ἄνθρωποι
  choice: ‘Àwọn ènìyàn,’ tó ní gbogbo aráyé nínú.
  alternative: Ọ̀rọ̀ kan tó lè dà bí ẹni pé àwọn ọkùnrin nìkan ni a ń sọ.
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà dúró fún ẹ̀dá ènìyàn lápapọ̀; Yorùbá kò nílò akọ akọ-abo láti pa ìtumọ̀ yìí mọ́.
- issue: Ìtumọ̀ κρίσις
  choice: ‘Ìdájọ́,’ láì pinnu pé ìdálẹ́bi nìkan ni.
  alternative: ‘Ìdálẹ́bi.’
  rationale: Ẹsẹ̀ náà ṣàlàyé ìdájọ́ tàbí ìpìlẹ̀ rẹ̀; ‘ìdájọ́’ pa àyè ìtumọ̀ orísun mọ́, pẹ̀lú àbájáde búburú tó wà nínú àyíká.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn níbi tó yẹ, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘sínú ayé’ àti ‘ju ... lọ’ gẹ́gẹ́ bí ọ̀nà àsọyé Yorùbá àdánidá; a kò nílò àlàyé ìsàlẹ̀ ojú ìwé fún ‘àwọn ènìyàn’ nítorí ọ̀rọ̀ Yorùbá náà ti ṣe ìtumọ̀ gbogbogbò náà kedere.
