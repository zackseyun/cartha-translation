id: JHN.3.4
reference: John 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: yo
  text: Nikodémù sọ fún un pé, “Báwo ni a ṣe lè bí ènìyàn kan[a] nígbà tí ó ti darúgbó? Kò lè wọ inú ilé-ọmọ ìyá rẹ̀ ní ìgbà kejì, kí a sì bí i[b], àbí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ ẹyọ kan ní gírámà, ṣùgbọ́n ó ń tọ́ka sí ènìyàn lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ‘ní ìgbà kejì.’ Nikodémù lóye ọ̀rọ̀ Jésù ní ìtumọ̀ gangan, gẹ́gẹ́ bí ìbímọ ti ara.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àkókò ìsinsìnyí, ó jẹ́ ìsinsìnyí ìtàn tí Jòhánù sábà máa ń lò. Àkókò tí ó ti kọjá ló bá ìtàn Yorùbá mu jù.
- source_word: Νικόδημος
  choice: Nikodémù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe àti kọ àwọn orúkọ Bíbélì ní Yorùbá.
- source_word: Πῶς δύναται
  choice: Báwo ni a ṣe lè
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti béèrè bóyá ohun kan ṣe ṣeé ṣe.
- source_word: ἄνθρωπος
  choice: ènìyàn kan
  rationale: Nínú àyíká yìí, ἄνθρωπος ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, bí ó tilẹ̀ jẹ́ pé ọ̀nà akọ ẹyọ kan ni Gíríìkì fi sọ ọ́. ‘Ènìyàn kan’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ gbogbogbò mọ́.
- source_word: γεννηθῆναι
  choice: a ṣe lè bí / kí a sì bí i
  rationale: Ọ̀rọ̀ náà jẹ́ aláìṣe tí ó ń tọ́ka sí ìbímọ. Ìtumọ̀ yìí kò fi ‘lẹ́ẹ̀kan sí i’ kún ibi tí Gíríìkì kò ti sọ ọ́.
- source_word: γέρων ὤν
  choice: nígbà tí ó ti darúgbó
  rationale: Gbólóhùn àsìkò yìí mú èrò ‘nígbà tí ó ti dàgbà dé ọjọ́ ogbó’ jáde ní Yorùbá àdánidá.
- source_word: μὴ δύναται
  choice: Kò lè ... àbí ó lè ṣe bẹ́ẹ̀?
  rationale: μή fi hàn pé ìbéèrè náà ń retí ìdáhùn òdì. Ìbéèrè afìdí-béèrè Yorùbá yìí pa ìyàlẹ́nu àti àìgbàgbọ́ Nikodémù mọ́.
- source_word: κοιλίαν
  choice: ilé-ọmọ
  rationale: Níwọ̀n bí ó ti sọ nípa ìyá, κοιλία túmọ̀ sí ilé-ọmọ níbí, kì í ṣe inú tàbí ikùn lásán.
- source_word: δεύτερον
  choice: ní ìgbà kejì
  rationale: Èyí túmọ̀ sí ‘ìgbà kejì’ ní pàtó, ó sì mú òye gangan tí Nikodémù ní nípa ọ̀rọ̀ Jésù hàn kedere.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: wọ ... kí a sì bí i
  rationale: A pa àwọn ìṣe méjèèjì mọ́ ní gbangba, gẹ́gẹ́ bí Gíríìkì ṣe tò wọ́n, kí ìrònú Nikodémù lè hàn kedere.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἄνθρωπος tí a lò ní ọ̀nà akọ ṣùgbọ́n tí ìtumọ̀ rẹ̀ jẹ́ gbogbogbò
  choice: ènìyàn kan
  alternative: ọkùnrin kan
  rationale: ἄνθρωπος lè túmọ̀ sí ènìyàn lápapọ̀; akọ ẹyọ kan ni ìrísí gírámà rẹ̀. Ní Yorùbá, ‘ènìyàn kan’ ló mú agbára gbogbogbò náà jáde láì sọ pé ọkùnrin nìkan ni ọ̀rọ̀ náà kàn. Àlàyé ìsàlẹ̀ ojú ewé pa àfidípò tí ó sún mọ́ ìrísí akọ Gíríìkì mọ́.
- issue: Bóyá kí a mú èrò ‘tún bí’ láti Jòhánù 3:3 wọ γεννηθῆναι níbí
  choice: bí ... ní ìgbà kejì
  alternative: tún bí
  rationale: Ẹsẹ yìí ní δεύτερον, ‘ní ìgbà kejì,’ èyí tí ó fi òye gangan Nikodémù hàn. A kò gbé àríyànjiyàn lórí ἄνωθεν nínú ẹsẹ tó ṣáájú wọ ọ̀rọ̀ γεννηθῆναι fúnra rẹ̀; bẹ́ẹ̀ ni a pa ìforígbárí inú ìtàn náà mọ́.
translation_notes:
  register: Yorùbá tí a lò jẹ́ èdè òde òní, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. ‘Ilé-ọmọ’ jẹ́ ọ̀rọ̀ tó péye tí ó sì wọ́pọ̀; ìbéèrè ‘Kò lè ... àbí ó lè ṣe bẹ́ẹ̀?’ ń fi hàn pé Nikodémù ń retí ìdáhùn òdì. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
