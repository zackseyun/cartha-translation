id: JHN.3.26
reference: John 3:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: yo
  text: Wọ́n sì wá sọ́dọ̀ Jòhánù, wọ́n sì wí fún un pé, “Rábì, ẹni tí ó wà pẹ̀lú rẹ ní òdìkejì Jọ́dánì, ẹni tí ìwọ ti jẹ́rìí nípa rẹ̀[a]—wò ó, ẹni yìí ń ṣe ìbatisí[b], gbogbo ènìyàn sì ń lọ sọ́dọ̀ rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “ẹni tí ìwọ ti jẹ́rìí sí.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀rọ̀ ìtọ́kasí ẹni ní ọ̀nà tí a lè sọ ní Yorùbá pé a jẹ́rìí nípa ẹni náà tàbí a jẹ́rìí sí i.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “òun ń ṣe ìbatisí.” Ọ̀rọ̀ Gíríìkì οὗτος túmọ̀ ní tààrà sí “ẹni yìí,” ó sì lè fi ìtẹnumọ́ àwọn olùsọ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: wọ́n sì wá sọ́dọ̀ Jòhánù
  rationale: ‘Wá sọ́dọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n sún mọ́ Jòhánù, ó sì bá ìríran ìtàn náà mu.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa orúkọ oyè Júù náà mọ́ ní ìkọlédè Yorùbá, kí àyíká Júù inú ìtàn náà má bàa sọnù.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: ẹni tí ó wà pẹ̀lú rẹ ní òdìkejì Jọ́dánì
  rationale: Èyí jẹ́ gbolohun Yorùbá tó ṣe kedere, tó sì pa ìtọ́kasí ibi àti ẹni náà mọ́.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: ẹni tí ìwọ ti jẹ́rìí nípa rẹ̀
  rationale: ‘Jẹ́rìí nípa rẹ̀’ sọ ìtumọ̀ μαρτυρέω ní kedere; ‘ti’ tún fi hàn pé ẹ̀rí náà ti ṣẹlẹ̀ ṣáájú, àmọ́ ó ṣì ṣe pàtàkì nísinsìnyí.
- source_word: ἴδε
  choice: wò ó
  rationale: Ó jẹ́ ìpè láti fa àfiyèsí tí ó bá èdè Yorùbá òde òní mu, láì di àtijọ́ tàbí líle.
- source_word: οὗτος
  choice: ẹni yìí
  rationale: ‘Ẹni yìí’ pa agbára ìtọ́ka demonstrative náà mọ́, ó sì lè gbé ìtẹnumọ́ tàbí ìbínú díẹ̀ ti àwọn olùsọ jáde.
- source_word: βαπτίζει
  choice: ń ṣe ìbatisí
  rationale: Fọ́ọ̀mù onítẹ̀síwájú ‘ń ṣe’ fi hàn pé iṣẹ́ náà ń lọ lọ́wọ́; ‘ìbatisí’ jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá òde òní mọ̀.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: gbogbo ènìyàn sì ń lọ sọ́dọ̀ rẹ̀
  rationale: Èyí mú ìgbésẹ̀ sísún mọ́ ẹni náà jáde ní Yorùbá àdánidá. ‘Gbogbo ènìyàn’ pa àsọdùn ìráhùn àwọn olùsọ mọ́ láì fi dandan sọ pé kò sí ẹnikẹ́ni tó yà sílẹ̀.
theological_decisions:
- issue: Èdè ẹ̀rí nínú Ìhìn Rere Jòhánù
  choice: jẹ́rìí nípa rẹ̀
  alternative: sọ̀rọ̀ nípa rẹ̀
  rationale: ‘Jẹ́rìí’ pa àkòrí μαρτυρέω tí ó máa ń tún ara rẹ̀ ṣe nínú Jòhánù mọ́, ó sì ní ìwọ̀n ẹ̀sìn rẹ̀ láì fi ẹ̀kọ́ ẹ̀sìn ẹ̀ya kan kún un.
- issue: Agbára ìtọ́ka οὗτος
  choice: ẹni yìí
  alternative: òun
  rationale: ‘Ẹni yìí’ fi ìtẹnumọ́ àwọn ọmọ-ẹ̀yìn Jòhánù hàn, ṣùgbọ́n kò pinnu bóyá ìtẹnumọ́ náà jẹ́ ìbínú, ìyalẹ́nu, tàbí ìdíje.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí wọ́n ti yẹ, a sì pa ìrísí ìjíròrò àti ìtẹnumọ́ inú orísun Gíríìkì mọ́.
