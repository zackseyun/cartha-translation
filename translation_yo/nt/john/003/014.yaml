id: JHN.3.14
reference: John 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: yo
  text: Gẹ́gẹ́ bí Mósè ṣe gbé ejò náà sókè[a] ní aginjù[b], bẹ́ẹ̀ náà ni a gbọdọ̀ gbé Ọmọ Ènìyàn sókè,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbé ga.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí gbígbé ohun kan sókè ní ti ara àti sí gbígbé ẹni ga; ó ṣeé ṣe kí Jòhánù ní ìtumọ̀ méjèèjì lọ́kàn níbí.
    reason: lexical_alternative
  - marker: b
    text: Wo Númérì 21:8–9 fún ìtàn bí Mósè ṣe gbé ejò sókè ní aginjù.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς ... οὕτως
  choice: Bí ... bẹ́ẹ̀ náà
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ìfiwéra tó ṣe kedere hàn láàárín ohun tí Mósè ṣe àti ohun tí ó pọndandan kí ó ṣẹlẹ̀ sí Ọmọ Ènìyàn.
- source_word: ὕψωσεν
  choice: gbé ... sókè
  rationale: Ó bá ìgbé ejò náà sókè lórí ohun gíga mu ní ti ara, ó sì tún jẹ́ kí ìsopọ̀ rẹ̀ pẹ̀lú ὑψωθῆναι dúró.
- source_word: ὄφιν
  choice: ejò
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí ó sì bá ìtàn inú Númérì 21 mu.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: “Aginjù” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi ìkọ̀sílẹ̀ tí ìtàn ìrìn-àjò Ísírẹ́lì ń tọ́ka sí.
- source_word: ὑψωθῆναι
  choice: kí a gbé ... sókè
  rationale: Ìṣètò aláìdárúkọ ẹni tó ṣe iṣẹ́ náà ń mú ohùn àìṣe Gíríìkì jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ méjì—gbígbé sókè ní ti ara àti gbígbé ga—mọ́.
- source_word: δεῖ
  choice: ó pọndandan
  rationale: Ó fi ìjẹ́dandan hàn kedere, kì í ṣe àsọtẹ́lẹ̀ lasan tàbí ohun tó ṣeé ṣe nìkan.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí pa orúkọ oyè tí Jésù máa ń lò fún ara rẹ̀ àti ìjìnlẹ̀ ìtumọ̀ rẹ̀ mọ́ láì fi àlàyé onítumọ̀ kún un.
theological_decisions:
- issue: Ìtumọ̀ méjì ti ὑψόω nínú Jòhánù
  choice: Lo “gbé ... sókè” fún ìṣe Mósè àti fún ohun tí yóò ṣẹlẹ̀ sí Ọmọ Ènìyàn.
  alternative: “gbé ... ga” tàbí “gbé ... lékè”
  rationale: “Gbé ... sókè” lè tọ́ka sí gbígbé ní ti ara, ó sì tún lè dún bí gbígbé ẹni ga. Èyí pa ìfọ̀rọ̀wérọ̀ tó wà láàárín àgbélébùú àti ìgbéga mọ́, dípò kí ó fi ọ̀kan ṣoṣo múlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ó pọndandan kí a ...” láti sọ ohùn àìṣe àti ìjẹ́dandan Gíríìkì ní ọ̀nà àdánidá, láì dárúkọ ẹni tó ṣe iṣẹ́ náà. A tún gbé àwọn àmì àlàyé ẹsẹ̀ sí ibi tí ọ̀kọ̀ọ̀kan bá ìtumọ̀ rẹ̀ mu.
