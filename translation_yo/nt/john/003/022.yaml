revisions:
- from: Lẹ́yìn èyí, Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ lọ sí ilẹ̀ Jùdíà[a]. Ó lo àkókò díẹ̀ níbẹ̀ pẹ̀lú wọn[b], ó sì ń ṣe ìrìbọmi fún àwọn ènìyàn[c].
  to: Lẹ́yìn àwọn nǹkan wọ̀nyí, Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ lọ sí ilẹ̀ Jùdíà[a]. Ó ń dúró níbẹ̀ pẹ̀lú wọn[b], ó sì ń ṣe ìrìbọmi[c].
  rationale: 'The revised text follows the source more closely by retaining the plural reference in Μετὰ ταῦτα and removing two unsupported specifications: a brief length of stay and an expressed object for baptizing. It keeps the imperfect sense through “ń dúró” and “ń ṣe,” preserves the source’s grammatical ambiguity/tension concerning baptism, and supplies the later Johannine clarification only in the footnote.'
  reviewer_model: gpt-5.6-terra
