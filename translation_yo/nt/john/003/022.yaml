id: JHN.3.22
reference: John 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: yo
  text: Lẹ́yìn àwọn nǹkan wọ̀nyí, Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ lọ sí ilẹ̀ Jùdíà[a]. Ó ń dúró níbẹ̀ pẹ̀lú wọn[b], ó sì ń ṣe ìrìbọmi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “sí agbègbè Jùdíà” tàbí “sí Jùdíà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ó ń gbé níbẹ̀ pẹ̀lú wọn.”
    reason: lexical_alternative
  - marker: c
    text: Jòhánù 4:2 ṣàlàyé lẹ́yìn náà pé kì í ṣe Jésù fúnra rẹ̀ ni ó ń ṣe ìrìbọmi, bí kò ṣe àwọn ọmọ-ẹ̀yìn rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Lẹ́yìn èyí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ìyípadà àkókò inú ìtàn hàn; ó ń tọ́ka sí àwọn ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ láì mú gbólóhùn náà le.
- source_word: ἦλθεν
  choice: lọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘wá,’ ‘lọ’ bá ìrìn láti ibi tí ìtàn wà tẹ́lẹ̀ lọ sí Jùdíà mu ní èdè Yorùbá.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti kedere fún gbólóhùn ohun-ìní náà.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: sí ilẹ̀ Jùdíà
  rationale: ‘Ilẹ̀ Jùdíà’ fi γῆ hàn ní tààrà, ó sì lè tọ́ka sí agbègbè Jùdíà ní ìta Jerusalẹmu láì fi ‘ìgbèríko’ kún ohun tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó.
- source_word: διέτριβεν
  choice: Ó lo àkókò díẹ̀ níbẹ̀
  rationale: Ìṣe aláìparí inú ọ̀rọ̀ Gíríìkì fi hàn pé ó ń dúró tàbí ń lo àkókò níbẹ̀; ọ̀nà yìí jẹ́ ti Yorùbá àdánidá, kò sì sọ bí àkókò náà ṣe gùn tó.
- source_word: μετ’ αὐτῶν
  choice: pẹ̀lú wọn
  rationale: Ìtumọ̀ tààrà, tó ń tọ́ka sí àwọn ọmọ-ẹ̀yìn rẹ̀.
- source_word: ἐβάπτιζεν
  choice: ó sì ń ṣe ìrìbọmi fún àwọn ènìyàn
  rationale: ‘Ń ṣe’ pa ìṣe tí ó ń lọ lọ́wọ́ mọ́. ‘Ìrìbọmi’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún iṣẹ́ ẹ̀sìn náà, láì pinnu ọ̀nà tàbí ìlànà ẹ̀sìn kan pàtó.
theological_decisions:
- issue: Ẹni tí ó ń ṣe ìrìbọmi ní ìbámu pẹ̀lú Jòhánù 4:2
  choice: 'A pa Jésù mọ́ gẹ́gẹ́ bí ẹni tí gírámà ẹsẹ yìí fi ṣe olùṣe: ‘ó sì ń ṣe ìrìbọmi.’'
  alternative: Kí a yí olùṣe náà sí àwọn ọmọ-ẹ̀yìn nínú ọ̀rọ̀ pàtàkì, tàbí kí a sọ ọ́ lọ́nà tí kò ní olùṣe kedere.
  rationale: Ọ̀rọ̀-ìṣe ẹyọ ẹnì kan nínú Gíríìkì ń tọ́ka sí Jésù gẹ́gẹ́ bí olùṣe gírámà. Jòhánù 4:2 ṣàlàyé lẹ́yìn náà pé àwọn ọmọ-ẹ̀yìn rẹ̀ ni wọ́n ń ṣe ìrìbọmi náà ní ti ara; a kò gbọ́dọ̀ fi àlàyé tó dé lẹ́yìn ṣe àtúnkọ ẹsẹ yìí.
translation_notes:
  register: A lo Yorùbá àpéjọ tó níyì, tó sì rọrùn fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá yẹ. ‘Lẹ́yìn èyí’ àti ‘lo àkókò díẹ̀’ mú ìtàn náà ṣàn lọ́nà àdánidá, nígbà tí ‘ilẹ̀ Jùdíà’ ń tẹ̀ lé ọ̀rọ̀ orísun pẹ́kípẹ́kí ju ‘ìgbèríko Jùdíà’ lọ.
