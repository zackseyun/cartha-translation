id: JHN.3.34
reference: John 3:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: yo
  text: Nítorí ẹni tí Ọlọ́run rán ń sọ àwọn ọ̀rọ̀ Ọlọ́run, nítorí Ọlọ́run ń fi Ẹ̀mí náà fún un láìsí ìwọ̀n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ẹni tí Ọlọ́run rán ń fi Ẹ̀mí náà fúnni láìsí ìwọ̀n.” Gíríìkì kò sọ ẹni tí ó ń fúnni ní gbangba.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: ẹni tí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹni tí Ọlọ́run rán; “ẹni tí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára arọ́pò-orúkọ ìbátan náà hàn.
- source_word: ἀπέστειλεν
  choice: rán
  rationale: “Rán” túmọ̀ iṣẹ́ ìránṣẹ́ náà ní tààrà, ó sì bá èdè rírán ẹni tí ó wọ́pọ̀ nínú Jòhánù mu.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: àwọn ọ̀rọ̀ Ọlọ́run
  rationale: “Àwọn” pa iye ọ̀pọ̀ ti ῥήματα mọ́, “ọ̀rọ̀ Ọlọ́run” sì fi ìbátan tí gbolohun Gíríìkì náà ní hàn ní èdè Yorùbá àdánidá.
- source_word: λαλεῖ
  choice: ń sọ
  rationale: Àmì “ń” fi ìṣe tí ó ń lọ tàbí ohun tí ẹni náà máa ń ṣe hàn, gẹ́gẹ́ bí ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí náà.
- source_word: ἐκ μέτρου
  choice: láìsí ìwọ̀n
  rationale: Èyí pa àwòrán ìwọ̀n mọ́, ó sì sọ ní kedere pé fífúnni náà kò ní ààlà tàbí òṣùwọ̀n tí a là sílẹ̀.
- source_word: δίδωσιν
  choice: ń fi … fúnni
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún fífúnni, ó sì pa ìṣe àsìkò ìsinsìnyí mọ́.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Nínú àyíká Jòhánù, ọ̀rọ̀ náà tọ́ka sí Ẹ̀mí Ọlọ́run; lílo lẹ́tà ńlá ń jẹ́ kí ìtọ́kasí yìí ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ẹni tí ó jẹ́ olùṣe nínú δίδωσιν (“ń fúnni”)
  choice: Ọlọ́run ni a mú gẹ́gẹ́ bí olùfún Ẹ̀mí.
  alternative: Ẹni tí Ọlọ́run rán, ìyẹn Ọmọ, ni ó ń fi Ẹ̀mí fúnni.
  rationale: Ọlọ́run ni olùṣe tí a dárúkọ nítòsí, ìtumọ̀ yìí sì ṣàlàyé ìdí tí ẹni tí a rán fi ń sọ àwọn ọ̀rọ̀ Ọlọ́run. Síbẹ̀, Gíríìkì kò sọ olùṣe δίδωσιν ní gbangba, nítorí náà a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé yé fún gbogbo ènìyàn. A lo “ẹni tí” dípò ìṣètò ọ̀rọ̀ líle, a sì fi àmì ohùn sí ibi tí ó yẹ. Àlàyé ìsàlẹ̀ pa àìdánilójú gidi nípa olùfún Ẹ̀mí mọ́ láìfi ẹ̀kọ́ ìsìn kan lé ẹsẹ náà lórí.
