  naturalness: ‘Ọkọ ìyàwó,’ ‘ọ̀rẹ́ ọkọ ìyàwó,’ àti ‘yọ̀ gidigidi’ jẹ́ Yorùbá boṣewa tí ó ṣe kedere. ‘Ti pé pérépéré’ lè ṣeé lóye, ṣùgbọ́n kò dájú bí ọ̀nà tí ó wọ́pọ̀ jù lọ láti sọ pé ayọ̀ ti dé ìkúnrẹ́rẹ́; ‘ti dé ìkúnrẹ́rẹ́’ dára síi, ó sì sun mọ́ ìtumọ̀ πεπλήρωται.
