id: JHN.3.29
reference: John 3:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: yo
  text: Ẹni tí ó ní ìyàwó ni ọkọ ìyàwó; ṣùgbọ́n ọ̀rẹ́ ọkọ ìyàwó[a], ẹni tí ó dúró tí ó sì ń gbọ́ ọ, yọ̀ gidigidi[b] nítorí ohùn ọkọ ìyàwó. Nítorí náà, ayọ̀ tèmi yìí ti dé ìkúnrẹ́rẹ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ọ̀rẹ́ ọkọ ìyàwó.” Ipa rẹ̀ lè jọ ti ọ̀rẹ́ pàtàkì tí ń dúró tì ọkọ ìyàwó níbi ìgbéyàwó, ṣùgbọ́n ọ̀rọ̀ Gíríìkì sọ pé “ọ̀rẹ́.”
    reason: cultural_note
  - marker: b
    text: Ní tààrà, “ó yọ̀ pẹ̀lú ayọ̀”; àkópọ̀ ọ̀rọ̀ Gíríìkì náà ń tẹnumọ́ bí ayọ̀ rẹ̀ ti pọ̀ tó.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ti kún” tàbí “ti di pípé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ayọ̀ náà ti dé ìkúnrẹ́rẹ́ tàbí ìpípé rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Ẹni tí ó ní ìyàwó
  rationale: Ó pa àkójọpọ̀ participle oní-àpilẹ̀kọ àti àwòrán ìgbéyàwó mọ́ ní Yorùbá àdánidá. Nínú àyíká yìí, “ìyàwó” lè tọ́ka sí obìnrin tí a ń gbé níyàwó láìsọ àwòrán náà di ẹ̀kọ́ nípa ẹni tí ó dúró fún.
- source_word: νυμφίος
  choice: ọkọ ìyàwó
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ọkọ níbi ìgbéyàwó, ó sì bá “ìyàwó” mu nínú àwòrán náà.
- source_word: φίλος τοῦ νυμφίου
  choice: ọ̀rẹ́ ọkọ ìyàwó
  rationale: Ó túmọ̀ φίλος ní tààrà, láìfi ipa àṣà pàtó bí “best man” kún ọ̀rọ̀ Gíríìkì.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: ẹni tí ó dúró tí ó sì ń gbọ́ ohùn rẹ̀
  rationale: “Ó dúró” fi ipò tí perfect participle ń tọ́ka sí hàn; “ń gbọ́” mú ìṣe tí ń lọ lọ́wọ́ jáde. A fi “ohùn” hàn fún Yorùbá àdánidá, ní ìbámu pẹ̀lú φωνή tí ó tẹ̀ lé e.
- source_word: χαρᾷ χαίρει
  choice: yọ̀ gidigidi
  rationale: Àkópọ̀ ọ̀rọ̀ orúkọ àti ọ̀rọ̀-ìṣe tí gbòǹgbò wọn jọ ń fi ìtẹnumọ́ hàn; “yọ̀ gidigidi” sọ agbára náà ní Yorùbá tó ṣeé lóye.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: nítorí ohùn ọkọ ìyàwó
  rationale: “Nítorí” pa ìtumọ̀ ìdí tí διά pẹ̀lú accusative ní mọ́.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: ayọ̀ tèmi yìí
  rationale: Ó pa demonstrative àti ìtẹnumọ́ possessive mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: πεπλήρωται
  choice: ti pé pérépéré
  rationale: 'Ó sọ ipò àbájáde perfect passive di mímọ̀: ayọ̀ náà ti dé ẹ̀kúnrẹ́rẹ́ rẹ̀, láìfi dandan túmọ̀ sí ìmú àsọtẹ́lẹ̀ ṣẹ.'
theological_decisions:
- issue: Àwòrán ìgbéyàwó àti ipò Johanu
  choice: A pa “ìyàwó,” “ọkọ ìyàwó,” àti “ọ̀rẹ́ ọkọ ìyàwó” mọ́ gẹ́gẹ́ bí àwòrán inú ẹsẹ náà.
  alternative: Kí a pe ọ̀rẹ́ náà ní ẹni tó ń bá ọkọ ìyàwó dúró, tàbí kí a sọ ẹni tí ìyàwó dúró fún ní gbangba.
  rationale: Ẹsẹ náà kò ṣàlàyé ẹni tí ìyàwó dúró fún, bẹ́ẹ̀ ni φίλος τοῦ νυμφίου kò lo orúkọ ipò àṣà pàtó. Ìtumọ̀ náà kò gbọ́dọ̀ fi ìpinnu ẹ̀kọ́ tí ọ̀rọ̀ kò sọ sínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A yan “ọkọ ìyàwó” dípò ọ̀rọ̀ àṣà tí ó lè yàtọ̀ láti agbègbè kan sí òmíràn; a sì lo “ti pé pérépéré” láti jẹ́ kí ìkún ayọ̀ náà dun bí Yorùbá àdánidá.
