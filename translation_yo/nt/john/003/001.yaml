source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: yo
  text: Ọkùnrin kan sì wà lára àwọn Farisí; Nikodémù ni orúkọ rẹ̀, ó sì jẹ́ olórí àwọn Júù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olórí àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn Júù lápapọ̀ tàbí, ní àwọn àyíká ọ̀rọ̀ kan, sí àwọn ará Jùdíà tàbí àwọn aláṣẹ Júù ní pàtàkì.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: sì wà
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń mú ìtàn tẹ̀ síwájú; “sì wà” ṣe iṣẹ́ yìí ní Yorùbá láì fi ọ̀rọ̀ àkókò kan kún un.
- source_word: ἄνθρωπος
  choice: Ọkùnrin kan
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí akọ kan pàtó, nítorí náà “ọkùnrin kan” jẹ́ ìtumọ̀ tó ṣe kedere.
- source_word: ἐκ τῶν Φαρισαίων
  choice: lára àwọn Farisí
  rationale: ἐκ pẹ̀lú ọ̀rọ̀ orúkọ ní genitive fi hàn pé Nikodémù jẹ́ ọ̀kan nínú ẹgbẹ́ àwọn Farisí; “lára” sọ ìbáṣepọ̀ yìí lọ́nà àdánidá.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: Nikodémù ni orúkọ rẹ̀
  rationale: Èyí tú ọ̀nà ìsọ̀rọ̀ Gíríìkì náà sí Yorùbá tó ṣe kedere, tó sì bá èdè òde òní mu.
- source_word: ἄρχων
  choice: ọ̀kan lára àwọn olórí
  rationale: ἄρχων ń tọ́ka sí ẹni tó ní ipò àṣẹ. Ọ̀rọ̀ yìí fi ipò Nikodémù hàn láì sọ ní pàtó pé ipò tàbí ìgbìmọ̀ wo ni ó wà.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí àwùjọ àwọn Júù àti àwọn aṣáájú wọn. “Àwọn Júù” pa ìtumọ̀ gbígbòòrò mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tóóró mìíràn hàn.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú àyíká Ìhìn Rere Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ẹ̀yà, ẹ̀sìn, agbègbè, tàbí àwọn aláṣẹ, gẹ́gẹ́ bí àyíká ọ̀rọ̀. Nítorí Nikodémù jẹ́ Farisí àti ẹni tó ní àṣẹ, “àwọn Júù” yẹ fún ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ “àwọn ará Jùdíà” àti ìtọ́kasí àwọn aláṣẹ Júù mọ́.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “sì” gẹ́gẹ́ bí àsopọ̀ ìtàn, kì í ṣe gẹ́gẹ́ bí àmì àkókò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá níbi tó yẹ.
