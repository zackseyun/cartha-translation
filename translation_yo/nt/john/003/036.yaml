review_pass:
  verdict: revise
  source_fidelity: The draft preserves the main contrasts and the present force of ἔχει and μένει, as well as the future force of οὐκ ὄψεται. However, “bí kò ṣe pé” means “except that/unless,” not the adversative ἀλλά (“but”), and so misrepresents the final contrast. The generic conditional construction “tí ó bá” is also less exact than a simple generic present for the Greek articular present participles.
  naturalness: The proposed revision uses natural, dignified Standard Yoruba with tone marks. “Ẹni tí kò gbọ́ràn sí Ọmọ náà” is clear and idiomatic. “Ń dúró lórí rẹ̀” explicitly conveys the continuing present state in μένει.
  terminology: “Ọmọ náà,” “ìyè àìnípẹ̀kun,” and “ìbínú Ọlọ́run” are appropriate and preserve the source without adding an explicit possessive to “the Son.” The alternative sense of ἀπειθῶν is retained in a footnote anchored to the relevant phrase.
  issues:
  - severity: high
    issue: “bí kò ṣe pé” is used for ἀλλά.
    rationale: 'This Yoruba expression is exceptive (“except that/unless”), whereas the Greek introduces an adversative clause: “but the wrath of God remains on him.” It must be replaced with “ṣùgbọ́n.”'
  - severity: medium
    issue: The footnote anchor is placed at the end of the verse rather than on the rendering of ἀπειθῶν.
    rationale: The note concerns “ṣàìgbọ́ràn,” so its anchor should immediately follow the phrase it explains.
  - severity: low
    issue: The repeated conditional “tí ó bá” weakens the generic present-participial framing.
    rationale: A simple relative generic present is more direct and better reflects the source’s ongoing/general characterization.
  revised_text: Ẹni tí ó gba Ọmọ náà gbọ́ ní ìyè àìnípẹ̀kun; ṣùgbọ́n ẹni tí kò gbọ́ràn sí Ọmọ náà[a] kò ní rí ìyè, ṣùgbọ́n ìbínú Ọlọ́run ń dúró lórí rẹ̀.
  revised_footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó kọ̀ láti gba Ọmọ náà gbọ́.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ kíkọ̀ láti gbàgbọ́ tàbí àìgbọ́ràn.
    reason: alternative_reading
  revision_rationale: The adversative conjunction has been corrected to preserve ἀλλά, the note anchor has been moved to the expression it qualifies, and the generic present wording has been made more direct. These changes retain the source’s ambiguity concerning ἀπειθῶν and its present/future verbal contrast.
