id: JHN.3.36
reference: John 3:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: yo
  text: Ẹni tí ó gba Ọmọ náà gbọ́ ní ìyè àìnípẹ̀kun; ṣùgbọ́n ẹni tí kò gbọ́ràn sí Ọmọ náà[a] kò ní rí ìyè, ṣùgbọ́n ìbínú Ọlọ́run ń dúró lórí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó kọ̀ láti gba Ọmọ náà gbọ́.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ kíkọ̀ láti gbàgbọ́ tàbí àìgbọ́ràn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: Ẹni tí ó bá gba Ọmọ náà gbọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àpèjúwe gbogbogbò fún ẹnikẹ́ni tó ń fi ìgbàgbọ́ àti ìgbẹ́kẹ̀lé rẹ̀ sínú Ọmọ náà. Ìsọ̀rọ̀ ‘gba … gbọ́’ jẹ́ èdè Yorùbá àdánidá fún gbígbàgbọ́ nínú ẹni kan.
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: Ọmọ náà
  rationale: Gíríìkì lo orúkọ oyè pẹ̀lú atọ́ka, láìfi ‘Ọmọ Ọlọ́run’ kún un; ‘Ọmọ náà’ pa ìlò Kristi ti Jòhánù mọ́ láìṣàfikún ohun tí kò sí.
- source_word: ἔχει
  choice: ní
  rationale: Ìṣe ìsinsìnyí fi hàn pé ìyè náà jẹ́ ohun tí onígbàgbọ́ ní nísinsìnyí, kì í ṣe ìlérí ọjọ́ iwájú nìkan.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì mú ìtẹ̀síwájú ìyè náà àti ìwúlò rẹ̀ nínú ọ̀rọ̀ Jòhánù jáde.
- source_word: ὁ δὲ ἀπειθῶν
  choice: ẹni tí ó bá ṣàìgbọ́ràn
  rationale: ἀπειθέω lè túmọ̀ sí àìgbọ́ràn, ó sì tún lè ní ìtumọ̀ kíkọ̀ láti gbàgbọ́. Ọ̀rọ̀ inú ẹsẹ náà ṣe ìyàtọ̀ rẹ̀ sí ‘gba … gbọ́’; a pa ìtumọ̀ gbooro ‘ṣàìgbọ́ràn’ mọ́ nínú àkọ́kọ́, a sì ṣàlàyé omi-in ní àlàyé ìsàlẹ̀.
- source_word: οὐκ ὄψεται ζωήν
  choice: kò ní rí ìyè
  rationale: Ìtumọ̀ tààrà ‘rí ìyè’ pa àkànṣe ọ̀rọ̀ Jòhánù mọ́, ó sì yàtọ̀ sí ọ̀rọ̀ pé ẹni náà ‘ní’ ìyè.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ìbínú Ọlọ́run
  rationale: Èyí túmọ̀ ìdájọ́ àti ìbínú Ọlọ́run ní kedere láìrẹ̀ ẹ́ sílẹ̀.
- source_word: μένει ἐπ’ αὐτόν
  choice: dúró lórí rẹ̀
  rationale: Ìṣe ìsinsìnyí μένει sọ pé ìbínú náà ń bá a lọ; ‘dúró lórí rẹ̀’ jẹ́ Yorùbá àdánidá tó tún pa àwòrán Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀπειθῶν ní ìyàtọ̀ sí πιστεύων
  choice: ṣàìgbọ́ràn sí Ọmọ náà
  alternative: kọ̀ láti gba Ọmọ náà gbọ́
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àìgbọ́ràn àti kíkọ̀ láti gbàgbọ́. Àkọ́kọ́ pa agbára ìtumọ̀ gbooro rẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́ láìyanjú ìfọ̀rọ̀wérọ̀ náà ní ọ̀nà tóóró.
- issue: Àkókò ìyè àìnípẹ̀kun àti ìbínú Ọlọ́run
  choice: A fi ìyè hàn gẹ́gẹ́ bí ohun tí ẹni náà ní nísinsìnyí, àti ìbínú gẹ́gẹ́ bí ohun tó ń dúró lórí rẹ̀ nísinsìnyí.
  alternative: Kí a sọ àwọn méjèèjì di ohun ọjọ́ iwájú nìkan.
  rationale: ἔχει àti μένει jẹ́ ìṣe ìsinsìnyí, ṣùgbọ́n οὐκ ὄψεται tọ́ka sí ọjọ́ iwájú. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ àkókò yìí mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ‘Ọmọ náà’ gẹ́gẹ́ bí orúkọ oyè, a sì lo ẹyọ ọ̀rọ̀ gbogbogbò ‘ẹni’ láìfi ìtumọ̀ náà mọ́ ọkùnrin nìkan.
