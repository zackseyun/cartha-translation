source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: yo
  text: Nígbà náà ni ọmọ-ẹ̀yìn mìíràn náà, ẹni tí ó kọ́kọ́ dé ibojì, wọ inú ibojì náà[a]; ó sì rí, ó sì gbàgbọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọlé.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì kàn sọ pé “ó gbàgbọ́,” kò sì sọ ní pàtó ohun tí ó gbàgbọ́. Àwọn olùtumọ̀ yàtọ̀ lórí bóyá ó gbàgbọ́ pé Jesu ti jí dìde, ó gba ẹ̀rí tí ó rí náà, tàbí ó gba ìròyìn tí a ti sọ ṣáájú.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀síwájú ìtàn hàn ní Yorùbá àdánidá; ọ̀rọ̀ náà tún lè ní ìtumọ̀ ìyọrísí díẹ̀ láìjẹ́ pé a ní láti túmọ̀ rẹ̀ sí ‘nítorí náà.’
- source_word: εἰσῆλθεν
  choice: wọ inú rẹ̀
  rationale: Ó sọ ìwọlé gidi sínú ibojì ní èdè Yorùbá tí ó ṣe kedere, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ὁ ἄλλος μαθητής
  choice: ọmọ-ẹ̀yìn kejì náà
  rationale: ‘Ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún μαθητής ní àyíká ìtàn Jesu; ‘kejì náà’ ń tọ́ka sí ẹni kejì lára àwọn méjì tí a mẹ́nu kàn.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: ẹni tí ó kọ́kọ́ dé ibojì
  rationale: Ó fi hàn ní ṣókí àti ní àdánidá pé òun ni ó dé ibojì ṣáájú ẹni kejì.
- source_word: μνημεῖον
  choice: ibojì
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ibi tí a sin Jesu sí; ‘ibojì’ ni ìtumọ̀ Yorùbá tó péye, tó sì wọ́pọ̀.
- source_word: καὶ εἶδεν
  choice: ó sì rí
  rationale: Ó pa ìtumọ̀ ríran mọ́, láìfi ohun tí ó rí kún ọ̀rọ̀ orísun.
- source_word: ἐπίστευσεν
  choice: ó sì gbàgbọ́
  rationale: A fi ọ̀rọ̀ náà sílẹ̀ láìsọ ohun tí ó gbàgbọ́, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
theological_decisions:
- issue: Ohun tí ọmọ-ẹ̀yìn náà gbàgbọ́
  choice: A túmọ̀ ọ̀rọ̀-ìṣe náà ní ṣókí sí ‘ó sì gbàgbọ́,’ láìsọ ohun tí ó gbàgbọ́.
  alternative: Ó gbàgbọ́ pé Jesu ti jí dìde; ó gbàgbọ́ ìròyìn Maria; tàbí ó bẹ̀rẹ̀ sí í ní ìgbàgbọ́.
  rationale: Gíríìkì kò sọ kókó tàbí ohun tí ìgbàgbọ́ náà dá lé. Ṣíṣe àfikún ohun kan yóò yanju ìbéèrè ìtumọ̀ tí ẹsẹ náà fi sílẹ̀ ní gbangba, pàápàá ní ìbámu pẹ̀lú ẹsẹ tó tẹ̀ lé e.
translation_notes:
  register: Èdè Yorùbá àpapọ̀ tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa àsopọ̀ ‘ó sì ... ó sì ...’ mọ́ láti ṣàfihàn ìṣísẹ̀ àti ìtẹ̀síwájú àwọn καί inú Gíríìkì.
