source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: yo
  text: Nítorí náà, Jésù tún sọ fún wọn pé, “Àlàáfíà fún yín.[a] Bí Bàbá ti rán mi, bẹ́ẹ̀ náà ni èmi ń rán yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí a ti sábà máa ń sọ ọ́, “Kí àlàáfíà wà pẹ̀lú yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìṣẹ̀lẹ̀ tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù tún kí wọn bí ó ti ṣe ní ẹsẹ tó ṣáájú.
- source_word: Εἰρήνη ὑμῖν
  choice: Àlàáfíà fún yín
  rationale: Ó pa ìkíni kúkúrú tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: καθὼς
  choice: Bí ... bẹ́ẹ̀ náà
  rationale: Ìṣètò yìí fi ìfiwéra tó wà láàárín bí Baba ṣe rán Jésù àti bí Jésù ṣe ń rán àwọn ọmọ-ẹ̀yìn hàn kedere.
- source_word: ἀπέσταλκέν
  choice: ti rán
  rationale: Àkójọpọ̀ “ti rán” fi iṣẹ́ tí a ti ṣe, tí ìtumọ̀ rẹ̀ sì ṣì ń bá a lọ, hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: A kò fi arọ́pò-orúkọ ohun-ìní “mi” kún un; èyí pa ọ̀rọ̀ Johanu àti ohun tí Gíríìkì sọ mọ́.
- source_word: κἀγὼ
  choice: bẹ́ẹ̀ náà ni èmi
  rationale: Ó mú ìfiwéra náà pé, ó sì pa ìtẹnumọ́ tó wà lórí “èmi” mọ́.
- source_word: πέμπω
  choice: ń rán
  rationale: Ó fi hàn pé iṣẹ́ rírán náà ń ṣẹlẹ̀ ní àkókò yìí gẹ́gẹ́ bí iṣẹ́ tí Jésù ń gbé lé wọn lọ́wọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín bí Baba ṣe rán Jésù àti bí Jésù ṣe rán àwọn ọmọ-ẹ̀yìn
  choice: “Bí Baba ti rán mi, bẹ́ẹ̀ náà ni èmi ń rán yín.”
  alternative: “Bí Baba ti rán mi, èmi náà rán yín.”
  rationale: Ìtumọ̀ náà pa ìfiwéra iṣẹ́ ìránṣẹ́ mọ́ láìfikún pé àṣẹ, ọ̀nà, tàbí ipò àwọn ìránṣẹ́ náà dọ́gba pátápátá; ó jẹ́ kí ìwọ̀n ìtumọ̀ Gíríìkì dúró.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn ni a lò ní kíkún níbi tó bá yẹ; “Àlàáfíà fún yín” pa ìkíni kúkúrú orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ọ̀nà ìbílẹ̀ míì.
