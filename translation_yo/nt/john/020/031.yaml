  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ ìtumọ̀ Gíríìkì mọ́ dáadáa: pípé ẹ̀yà ìṣe γέγραπται, ìdí/ète àwọn gbólóhùn ἵνα méjèèjì, ìdánimọ̀ Jésù gẹ́gẹ́ bí Mèsáyà àti Ọmọ Ọlọ́run, àti ‘ìyè’ láìfi ‘ayérayé’ kún un. Ṣùgbọ́n ‘àti pé ... kí ẹ lè’ kò mú ìfararora ète kejì καὶ ἵνα hàn ní Yorùbá tó mọ́gbọ́n dání.'
