id: JHN.20.31
reference: John 20:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: yo
  text: Ṣùgbọ́n a ti kọ àwọn nǹkan wọ̀nyí sílẹ̀ kí ẹ lè gbàgbọ́[a] pé Jésù ni Mèsáyà[b], Ọmọ Ọlọ́run, àti kí ẹ lè ní ìyè ní orúkọ rẹ̀ nípa gbígbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ka a sí ìrísí ọ̀rọ̀ Gíríìkì tó lè túmọ̀ sí “kí ẹ lè wá gbàgbọ́” (aorist), àwọn mìíràn sì ka a sí ìrísí tó lè túmọ̀ sí “kí ẹ lè máa bá a lọ ní gbígbàgbọ́” (present). Ọ̀rọ̀ inú ẹsẹ náà, “kí ẹ lè gbàgbọ́,” kò fi tipátipá yan ọ̀kan nínú ìtumọ̀ méjèèjì.
    reason: textual_variant
  - marker: b
    text: Tàbí, “Kristi.” Oyè Gíríìkì Χριστός ni a túmọ̀ sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó ń tọ́ka sí àwọn àmì àti ohun tí a kọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; fífi ‘àwọn nǹkan’ kún un jẹ́ èdè Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ tàbí ìyípadà ọ̀rọ̀ hàn láti inú ohun tó ṣáájú.
- source_word: γέγραπται
  choice: a ti kọ ... sílẹ̀
  rationale: Ó pa ìṣe tí a ti parí mọ́, pẹ̀lú àbájáde rẹ̀ tí ó ṣì wà; ‘sílẹ̀’ tún bá ìtumọ̀ pé ohun náà wà ní àkọsílẹ̀ mu.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò Yorùbá yìí fi ète tàbí àfojúsùn hàn lọ́nà tó ṣe déédé.
- source_word: πιστεύητε
  choice: ẹ lè gbàgbọ́
  rationale: Ó tú ọ̀rọ̀ náà ní gbogbogbò láìfi tipátipá pinnu bóyá ó túmọ̀ sí bíbẹ̀rẹ̀ sí í gbàgbọ́ tàbí títẹ̀síwájú nínú ìgbàgbọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàgbékalẹ̀ ohun tí a gbàgbọ́ nípa rẹ̀ lọ́nà Yorùbá tó ṣe déédé.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ìkọ orúkọ náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: A túmọ̀ ọ́ gẹ́gẹ́ bí oyè, kì í ṣe gẹ́gẹ́ bí orúkọ ẹni, kí ìtumọ̀ Mèsáyà rẹ̀ lè hàn.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa oyè pàtàkì nípa ẹni tí Jésù jẹ́ mọ́ láìdín ìtumọ̀ rẹ̀ kù.
- source_word: καὶ ἵνα
  choice: àti pé ... kí ... lè
  rationale: Ó mú ète kejì so mọ́ ète àkọ́kọ́, ó sì pa ìbáradọ́gba àwọn gbólóhùn méjèèjì mọ́ ní Yorùbá àdánidá.
- source_word: πιστεύοντες
  choice: nípa gbígbàgbọ́
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí ipò tí níní ìyè bá ní ìbáṣepọ̀, láìfi ẹ̀kọ́ míì kún un.
- source_word: ζωὴν
  choice: ìyè
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘ìyè’ nìkan; a kò fi ‘ayérayé’ kún un nítorí pé ọ̀rọ̀ náà kò sí níbí.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: ní orúkọ rẹ̀
  rationale: Ó pa àwòrán àti ìtumọ̀ gbólóhùn Gíríìkì mọ́ ní èdè Yorùbá tó mọ́gbọ́n dání, láìṣàlàyé rẹ̀ ju ohun tí orísun sọ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín, Χριστός jẹ́ oyè tó ń sọ pé Jésù ni ẹni àmì òróró tí a ń retí. ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn; a fi ‘Kristi’ sí àlàyé ìsàlẹ̀.
- issue: Ìyàtọ̀ àfọwọ́kọ àti ìrísí ìṣe nínú πιστεύητε
  choice: ẹ lè gbàgbọ́
  alternative: ẹ lè máa bá a lọ ní gbígbàgbọ́; ẹ lè wá gbàgbọ́
  rationale: SBLGNT tẹ πιστεύητε, ìrísí àsìkò ìsinsìnyí, ṣùgbọ́n πιστεύσητε, ìrísí aorist, wà nínú àwọn àfọwọ́kọ kan. Gbólóhùn àkọ́kọ́ kò yanju ìbéèrè náà ní tipátipá; àlàyé ìsàlẹ̀ pa ìyàtọ̀ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì yan ‘a ti kọ ... sílẹ̀’ láti mú ipò pípé ti γέγραπται hàn. A gbé àmì àlàyé [a] sí ‘gbàgbọ́’ àti [b] sí ‘Mèsáyà’ kí ọkọọkan lè bá ohun tí àlàyé rẹ̀ ń ṣàlàyé mu.
