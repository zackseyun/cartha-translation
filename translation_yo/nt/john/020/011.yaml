  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: yo
  text: Ṣùgbọ́n Màríà dúró ní òde ibojì náà, ó ń sọkún. Bí ó ti ń sọkún, ó tẹ̀bà láti wo inú ibojì náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “ó tẹ̀bà, ó sì wo inú ibojì náà.” Ọ̀rọ̀ Gíríìkì náà ní èrò títẹ̀ ara sílẹ̀ láti lè wo inú ohun kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ sí Màríà hàn, ó sì so ẹsẹ̀ yìí mọ́ ohun tó ṣáájú.
- source_word: εἱστήκει
  choice: dúró
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣàpèjúwe ipò tí Màríà wà nínú rẹ̀ nígbà náà; Yorùbá kò nílò ọ̀rọ̀ àfikún láti fi ìṣe tó ń bá a lọ hàn níbí.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: ní ẹ̀yìn ibojì náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó wà ní òde ibojì, ní ìyàtọ̀ sí wíwo inú rẹ̀.
- source_word: μνημεῖον
  choice: ibojì
  rationale: ‘Ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ibi ìsìnkú tí a lè wo inú rẹ̀ mu.
- source_word: κλαίουσα / ἔκλαιεν
  choice: ó ń sọkún / bí ó ti ń sọkún
  rationale: Àmì ‘ń’ mú ìṣe tó ń bá a lọ jáde, ó sì pa àtúnsọ inú Gíríìkì mọ́.
- source_word: ὡς οὖν
  choice: Bí ó ti
  rationale: Ó so ìṣe tó tẹ̀ lé e mọ́ ẹkún tó ń bá a lọ láì sọ ìbáṣepọ̀ ìdí àti àbájáde ju bí orísun ṣe sọ lọ.
- source_word: παρέκυψεν
  choice: ó tẹ̀ ba láti wo
  rationale: Ó fi ìtẹ̀ ara sílẹ̀ àti ète wíwo inú ibojì hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: εἰς τὸ μνημεῖον
  choice: inú ibojì náà
  rationale: Ó pa ìtọ́sọ́nà sí inú ibojì mọ́, gẹ́gẹ́ bí εἰς ṣe túmọ̀ sí níbí.
