translation_notes:
  register: Èdè Yorùbá àdánidá, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa ìṣe ẹkún tó ń bá a lọ àti ìyàtọ̀ láàárín ẹ̀yìn àti inú ibojì mọ́.
