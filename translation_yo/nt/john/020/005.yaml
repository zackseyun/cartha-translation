  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: yo
  text: Ó sì tẹ̀ ba láti wo inú,[a] ó rí àwọn aṣọ ọ̀gbọ̀ náà tí wọ́n dùbúlẹ̀; síbẹ̀, kò wọ inú ibojì náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì tẹ̀ ba, ó rí àwọn aṣọ ọ̀gbọ̀ náà tí wọ́n dùbúlẹ̀.” Nínú Gíríìkì, a lè ka ọ̀rọ̀ tó túmọ̀ sí “tí wọ́n dùbúlẹ̀” pọ̀ mọ́ “àwọn aṣọ ọ̀gbọ̀ náà” ní pẹkipẹki.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: tẹ̀ ba, ó wo inú ibojì náà
  rationale: Aorist participle náà ṣàpèjúwe bí ọmọ-ẹ̀yìn náà ṣe tẹ ara rẹ̀ ba láti wo inú ibojì; gbolohun yìí mú ìṣípò ara àti ìwò inú hàn ní Yorùbá àdánidá.
- source_word: βλέπει
  choice: ó rí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní ìsinsìnyí ìtàn, Yorùbá sábà máa ń lo ìṣe tí kò ní àmì àkókò pàtó nínú irú ìtàn bẹ́ẹ̀; “ó rí” jẹ́ kedere, ó sì pa ìgbésẹ̀ ìtàn mọ́.
- source_word: κείμενα
  choice: tí ó wà nílẹ̀
  rationale: Ó sọ ipò àwọn aṣọ náà pé wọ́n dùbúlẹ̀ tàbí wà níbi kan. “Tí ó wà nílẹ̀” jẹ́ èdè Yorùbá àdánidá fún ohun tí a rí pé ó dùbúlẹ̀.
- source_word: τὰ ὀθόνια
  choice: àwọn aṣọ ọ̀gbọ̀
  rationale: Ìtumọ̀ tààrà ni fún àwọn aṣọ kéékèèké tàbí aṣọ tí a fi ọ̀gbọ̀ ṣe; àyíká ọ̀rọ̀ ti fi hàn pé aṣọ ìsìnkú ni, nítorí náà kò pọndandan láti fi ìtumọ̀ yẹn kún ọ̀rọ̀ pàtàkì.
- source_word: οὐ μέντοι
  choice: síbẹ̀
  rationale: Ó pa ìyàtọ̀ kékeré tó wà láàárín rí àwọn aṣọ náà àti àìwọlé rẹ̀ mọ́ ní ọ̀nà ṣókí, àdánidá.
- source_word: εἰσῆλθεν
  choice: kò wọ inú rẹ̀
  rationale: Aorist náà túmọ̀ sí wíwọlé. “Kò wọ inú rẹ̀” jẹ́ Yorùbá tí ó ṣe kedere, tí ó sì tọ́ka padà sí ibojì náà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, olóògo ṣùgbọ́n tí ó ṣeé lóye. A fi “ibojì náà” hàn gbangba lẹ́yìn “wo inú” fún ìtumọ̀ àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú ìṣètò Gíríìkì mọ́.
