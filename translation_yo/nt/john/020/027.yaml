id: JHN.20.27
reference: John 20:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: yo
  text: Lẹ́yìn náà, ó sọ fún Tọ́másì pé, “Mú ìka rẹ wá síbí, kí o sì wo ọwọ́ mi méjèèjì; mú ọwọ́ rẹ wá, kí o sì fi í sínú ẹ̀gbẹ́ mi. Má sì di aláìgbàgbọ́, ṣùgbọ́n di onígbàgbọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Má ṣe di aláìṣòtítọ́, ṣùgbọ́n di olóòtítọ́.” Àwọn ajẹtífù Gíríìkì náà lè ní ìtumọ̀ méjèèjì, ṣùgbọ́n nínú àyíká yìí, ìtakora náà dá lórí ìgbàgbọ́ Tọ́másì nínú Jesu tó jí dìde.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Lẹ́yìn náà
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn ní ọ̀nà àdánidá nínú ìtàn Yorùbá.
- source_word: λέγει
  choice: ó sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní historical present, ìgbà àtijọ́ ni Yorùbá àtúmọ̀ ìtàn yìí ń béèrè fún.
- source_word: Φέρε
  choice: Mú ... wá
  rationale: Ó pa ìtumọ̀ ‘mú wá’ àti àtúnlò ọ̀rọ̀ náà mọ́ fún ìka àti ọwọ́.
- source_word: δάκτυλόν σου ὧδε
  choice: ìka rẹ wá síbí
  rationale: ‘Síbí’ pa agbára ọ̀rọ̀ atọ́ka ὧδε mọ́.
- source_word: ἴδε
  choice: wo
  rationale: ‘Wo’ jẹ́ àṣẹ tó ṣe kedere, tó sì bá ohun tí a rí pẹ̀lú ojú mu ní Yorùbá.
- source_word: τὰς χεῖράς μου
  choice: ọwọ́ mi méjèèjì
  rationale: Ó mú ọ̀pọ̀ iye Gíríìkì hàn ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: fi í sínú ẹ̀gbẹ́ mi
  rationale: ‘Sínú’ pa ìtọ́sọ́nà εἰς mọ́, ‘ẹ̀gbẹ́ mi’ sì jẹ́ ìtumọ̀ àdánidá fún πλευράν μου.
- source_word: μὴ γίνου
  choice: Má ... di
  rationale: ‘Di’ fi ìtumọ̀ ìyípadà tàbí ìwọlé sínú ipò kan tí γίνου ní hàn, dípò ọ̀rọ̀ ipò lásán.
- source_word: ἄπιστος
  choice: aláìgbàgbọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà dá lórí àìgbàgbọ́ Tọ́másì sí jíjí Jesu dìde.
- source_word: πιστός
  choice: onígbàgbọ́
  rationale: Ó bá ìtakora pẹ̀lú aláìgbàgbọ́ mu, ó sì dojú kọ ìgbàgbọ́ nínú Jesu tó jí dìde.
theological_decisions:
- issue: Ìtumọ̀ ìtakora ἄπιστος / πιστός nínú ìkìlọ̀ Jesu sí Tọ́másì
  choice: aláìgbàgbọ́ / onígbàgbọ́
  alternative: aláìṣòótọ́ / olóòótọ́
  rationale: Àyíká ìtàn náà dá lórí bí Tọ́másì ṣe kọ̀ láti gba ẹ̀rí nípa jíjí Jesu dìde gbọ́ láìrí i tàbí fọwọ́ kàn án. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ míràn tí àwọn ajẹtífù Gíríìkì náà lè ní mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A lo ‘ọwọ́ mi méjèèjì’ láti sọ ọ̀pọ̀ iye náà di mímọ̀, a sì pa àtúnlò ‘Mú ... wá’ nínú Gíríìkì mọ́. Àmì ìsàlẹ̀ ojú ewé [a] wà lẹ́yìn gbogbo ọ̀rọ̀ tí ó ń ṣàlàyé.
