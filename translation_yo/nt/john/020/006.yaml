  to: Nígbà náà ni Símónì Pétérù náà dé, ó ń tẹ̀ lé e, ó sì wọ inú ibojì náà; ó rí àwọn aṣọ ọ̀gbọ̀ náà tí wọ́n dùbúlẹ̀ sílẹ̀.[a]
  rationale: Àtúnṣe náà mú ìtumọ̀ κείμενα hàn ní kíkún pẹ̀lú ‘tí wọ́n dùbúlẹ̀ sílẹ̀,’ ó tún lo ‘Pétérù,’ fọ́ọ̀mù orúkọ Yorùbá boṣewa. A pa ìbáṣiṣẹ́ ìsinsìnyí ìtàn Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀, láì fi àkókò-ọrọ̀ Gíríìkì kan sórí Yorùbá ní ọ̀nà tí kò ṣe àdánidá.
