  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: yo
  text: Nígbà náà ni Símónì Pétérù náà dé, ó ń tẹ̀ lé e, ó sì wọ inú ibojì náà; ó rí àwọn aṣọ ọ̀gbọ̀ náà tí wọ́n dùbúlẹ̀ sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, ‘dé’ àti ‘rí’ wà ní ìsinsìnyí ìtàn. Nínú Yorùbá, a sọ wọ́n gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ nínú ìtàn kí ìtàn náà lè ṣàn lọ́nà àdánidá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: dé
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìsinsìnyí ìtàn; ‘dé’ jẹ́ ọ̀nà àdánidá láti sọ ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ nínú ìtàn Yorùbá.
- source_word: οὖν
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀síwájú ìtàn àti àbájáde ohun tó ṣẹlẹ̀ ṣáájú hàn ní èdè Yorùbá tó ṣe déédé.
- source_word: καὶ Σίμων Πέτρος
  choice: Símónì Peteru pẹ̀lú
  rationale: '‘Pẹ̀lú’ mú agbára àfikún καὶ jáde: Símónì Peteru náà dé lẹ́yìn ọmọ-ẹ̀yìn kejì.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: ó ń tẹ̀ lé e
  rationale: Ó pa ìṣe tó ń lọ ní àkókò kan náà mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédé.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: ó sì wọ inú ibojì náà
  rationale: ‘Wọ inú’ fi ìṣípò sínú ibi náà hàn, ‘ibojì’ sì bá μνημεῖον mu nínú àyíká ìsìnkú yìí.
- source_word: θεωρεῖ
  choice: ó rí
  rationale: ‘Ó rí’ jẹ́ ọ̀rọ̀ tó rọrùn, tó sì bá ìran ohun tó wà níwájú rẹ̀ mu; àlàyé ìsàlẹ̀ sọ pé Gíríìkì lo ìsinsìnyí ìtàn níbí.
- source_word: τὰ ὀθόνια
  choice: àwọn aṣọ ọ̀gbọ̀
  rationale: Ó túmọ̀ irú aṣọ náà ní tààrà láì fi ‘aṣọ ìsìnkú’ kún un gẹ́gẹ́ bí ìtumọ̀ àlàyé.
- source_word: κείμενα
  choice: tí ó wà níbẹ̀
  rationale: Ó ṣàpèjúwe aṣọ náà gẹ́gẹ́ bí ohun tó dùbúlẹ̀ sí ibẹ̀ ní ọ̀nà Yorùbá àdánidá, láì sọ pé ẹnì kan mọ̀ọ́mọ̀ gbé e kalẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú orísun.
