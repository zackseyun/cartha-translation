review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ orísun Gíríìkì dáadáa: ìdìòmù náà jẹ́ ọjọ́ kìíní ọ̀sẹ̀, Màríà dé ní kùtùkùtù nígbà tí òkùnkùn ṣì wà, ó sì rí i pé a ti yọ òkúta náà kúrò. Síbẹ̀, ìkọ̀wé ordinal náà àti orúkọ Magidalénì nílò ìṣàtúnṣe sí ìlò Yorùbá boṣewa, àti pé a lè tẹ̀lé ìṣètò ''rí òkúta náà tí...'' láìfi ìtumọ̀ tuntun kún un.'
  naturalness: Gbólóhùn náà rọrùn àti ìforúkọsílẹ̀ rẹ̀ bójú mu. 'Ó sì rí òkúta náà tí a ti gbé kúrò ní ibojì' jẹ́ ọ̀nà Yorùbá tó dáa jù 'ó sì rí i pé...' lọ níbí, nítorí ó so ohun tí ó rí mọ́ òkúta náà ní tààràtà.
  terminology: '''Ibojì'' jẹ́ ìtumọ̀ tó bójú mu fún μνημεῖον nínú àyíká ìsìnkú yìí. A ti pa ìtumọ̀ aláìṣe ti participle pípé náà mọ́ pẹ̀lú ''a ti gbé ... kúrò.'' Orúkọ náà yẹ kí ó jẹ́ ''Màríà Magdalénì,'' gẹ́gẹ́ bí ìlò orúkọ Bíbélì Yorùbá tí ó wọ́pọ̀.'
  issues:
  - severity: medium
    issue: Ìkọ̀wé 'kìn-ín-ní' àti 'Magidalénì' kò bá ìlò Yorùbá boṣewa fún ordinal náà àti orúkọ Bíbélì náà mu.
    rationale: '''Kìíní'' ni ìkọ̀wé boṣewa fún ‘first’; ''Magdalénì'' sì ni ìrísí orúkọ tí ó ti fìdí múlẹ̀ ní Yorùbá. Ìwọ̀nyí kò yí ìtumọ̀ orísun padà, ṣùgbọ́n wọ́n ṣe pàtàkì fún ìṣọ̀kan ọ̀rọ̀ àti ìmọ̀ràn òǹkàwé.'
  - severity: low
    issue: '''Ó sì rí i pé'' tún ṣàlàyé ohun tí Màríà rí díẹ̀ ju bí Gíríìkì ṣe gbé e kalẹ̀.'
    rationale: Orísun náà ní ‘ó rí òkúta náà, tí a ti gbé kúrò.’ Ìṣètò ìbátan náà ní Yorùbá ń pa ìbáṣepọ̀ yìí mọ́ ní tààràtà.
