id: JHN.20.1
reference: John 20:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: yo
  text: Ní ọjọ́ kìíní ọ̀sẹ̀[a], Màríà Magdalénì wá sí ibojì ní kùtùkùtù, nígbà tí òkùnkùn ṣì wà, ó sì rí òkúta náà tí a ti gbé kúrò ní ibojì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ní ọ̀kan lára àwọn Sábáàtì”; ọ̀nà ìsọ̀rọ̀ yìí túmọ̀ sí “ní ọjọ́ kìíní ọ̀sẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Ní ọjọ́ kìn-ín-ní ọ̀sẹ̀
  rationale: Gbólóhùn Gíríìkì náà jẹ́ ọ̀nà ìsọ̀rọ̀ tí ó túmọ̀ sí ọjọ́ àkọ́kọ́ ọ̀sẹ̀. Èdè Yorùbá àdánidá ni ‘ọjọ́ kìn-ín-ní ọ̀sẹ̀,’ láìfi ọ̀rọ̀ àsopọ̀ tí kò pọndandan kún un.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Màríà Magidalénì
  rationale: A ṣe àkọsílẹ̀ orúkọ àti orúkọ ìdánimọ̀ náà ní ìbámu pẹ̀lú bí a ṣe máa ń pe wọn ní Yorùbá.
- source_word: ἔρχεται
  choice: wá
  rationale: ‘Wá’ pa ìrísí ìtàn alárinrin ti ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe déédé.
- source_word: πρωῒ
  choice: ní kùtùkùtù
  rationale: ‘Ní kùtùkùtù’ túmọ̀ sí ní àkókò òwúrọ̀ gan-an, ṣùgbọ́n kò fi dandan sọ pé ilẹ̀ ti mọ́, nítorí gbólóhùn tó tẹ̀ lé sọ pé òkùnkùn ṣì wà.
- source_word: σκοτίας ἔτι οὔσης
  choice: nígbà tí òkùnkùn ṣì wà
  rationale: Èyí sọ ipò tó ń bá a lọ ní àkókò náà ní Yorùbá àdánidá.
- source_word: εἰς τὸ μνημεῖον
  choice: sí ibojì
  rationale: Nínú àyíká yìí, μνημεῖον jẹ́ ibi tí a sin òkú sí; ‘ibojì’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: βλέπει
  choice: ó sì rí i
  rationale: Ìtumọ̀ yìí pa ìgbésẹ̀ ìtàn náà mọ́, ó sì ṣàn dáadáa lẹ́yìn gbólóhùn àkọ́kọ́.
- source_word: τὸν λίθον ἠρμένον
  choice: pé a ti gbé òkúta náà kúrò
  rationale: Ọ̀rọ̀ alájọṣe pípé aláìṣe náà tọ́ka sí iṣẹ́ tí ó ti parí tí àbájáde rẹ̀ sì ṣì hàn. ‘A ti gbé ... kúrò’ pa iṣẹ́ aláìṣe àti ipò tí Màríà bá pàdé mọ́.
- source_word: ἐκ τοῦ μνημείου
  choice: ní ibojì
  rationale: Pẹ̀lú ‘kúrò ní,’ èyí fi hàn pé a ti yọ òkúta náà kúrò níbi ibojì náà, láìfi ‘ẹnu ọ̀nà’ tí kò sí ní pàtó nínú Gíríìkì kún un.
theological_decisions:
- issue: Àsìkò ọ̀rọ̀ ìṣe nínú ìtàn àjíǹde
  choice: Lo ọ̀nà ìtàn alárinrin ‘wá ... ó sì rí i’
  alternative: Yí gbogbo ọ̀rọ̀ ìṣe padà sí àkókò tí ó ti kọjá lọ́nà tó jìnnà sí ìtàn Gíríìkì
  rationale: Yíyan yìí ń pa ìyára àti ìmọ̀lára pé ìṣẹ̀lẹ̀ náà ń ṣẹlẹ̀ níwájú olùkà mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀ka ìjọ tàbí àlàyé tí orísun kò sọ.
