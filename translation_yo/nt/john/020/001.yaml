revisions:
- from: Ní ọjọ́ kìn-ín-ní ọ̀sẹ̀[a], Màríà Magidalénì wá sí ibojì ní kùtùkùtù, nígbà tí òkùnkùn ṣì wà, ó sì rí i pé a ti gbé òkúta náà kúrò ní ibojì.
  to: Ní ọjọ́ kìíní ọ̀sẹ̀[a], Màríà Magdalénì wá sí ibojì ní kùtùkùtù, nígbà tí òkùnkùn ṣì wà, ó sì rí òkúta náà tí a ti gbé kúrò ní ibojì.
  rationale: A ṣe ìṣàtúnṣe ìkọ̀wé sí 'kìíní' àti 'Magdalénì' fún Yorùbá boṣewa. A tún ṣe gbolohun ìkẹyìn sí 'rí òkúta náà tí a ti gbé kúrò...' kí ó lè fara mọ́ τὸν λίθον ἠρμένον ní tààràtà, nígbà tí a ṣì ń pa passive pípé àti ìtumọ̀ 'láti inú ibojì' mọ́. Àkọsílẹ̀ ìsàlẹ̀ kò yí ìtumọ̀ rẹ̀ padà, a kan mú ìtumọ̀ ìdìòmù náà dúró.
  reviewer_model: gpt-5.6-terra
