source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: yo
  text: àti aṣọ ojú, èyí tí ó ti wà lórí orí rẹ̀, kò dùbúlẹ̀ pẹ̀lú àwọn aṣọ ọ̀gbọ̀ náà, ṣùgbọ́n a ká a jọ[a], ó sì wà lọ́tọ̀ ní ibi kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘a fi í dì’ tàbí ‘a yí i ká.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: aṣọ tí a fi bo ojú rẹ̀
  rationale: Nínú ọ̀rọ̀ ìsìnkú yìí, ọ̀rọ̀ náà ń tọ́ka sí aṣọ tí ó wà ní agbègbè orí tàbí ojú Jésù. Gbólóhùn yìí ṣe kedere sí òǹkàwé Yorùbá láì pe aṣọ náà ní aṣọ ọwọ́.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: tí ó ti wà lórí rẹ̀
  rationale: Èyí tẹ̀ lé ìtumọ̀ gígùn ti gbólóhùn Gíríìkì, kò sì fi kún un bóyá aṣọ náà yí orí ká tàbí ó bo gbogbo orí.
- source_word: ὀθονίων
  choice: àwọn aṣọ ọ̀gbọ̀
  rationale: Ọ̀rọ̀ ọ̀pọ̀ yìí ń tọ́ka sí àwọn aṣọ ọ̀gbọ̀ inú ibojì; ìtumọ̀ yìí pa irú aṣọ náà mọ́ láì ṣe àfikún àlàyé.
- source_word: κείμενον
  choice: dùbúlẹ̀
  rationale: Ó ṣàpèjúwe ohun tí ó wà ní ìdùbúlẹ̀ ní ibi kan, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwòrán náà.
- source_word: χωρὶς
  choice: sí apá kan
  rationale: Ó fi hàn pé aṣọ ojú náà yà sọ́tọ̀ sí àwọn aṣọ ọ̀gbọ̀ yòókù.
- source_word: ἐντετυλιγμένον
  choice: a ká a jọ
  rationale: Perfect passive participle náà ṣàpèjúwe aṣọ tí ó wà ní ipò kíká tàbí pípọ̀ jọ. ‘A ká a jọ’ pa àìdánilójú yìí mọ́ ju ọ̀rọ̀ tí yóò fi dandan sọ pé a ṣe é ní àtẹ̀lẹwọ́ lọ.
- source_word: εἰς ἕνα τόπον
  choice: ní ibi kan
  rationale: Èyí jẹ́ ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì tọ́ka sí ààyè kan pàtó láì sọ ohun tí ẹsẹ náà kò sọ.
- source_word: καὶ
  choice: àti
  rationale: Asopọ̀ tó rọrùn ni, tí ó ń tẹ̀síwájú láti inú àpèjúwe ẹsẹ tó ṣáájú.
theological_decisions:
- issue: Bóyá bí a ṣe rí àwọn aṣọ ìsìnkú náà ṣe ń sọ ẹ̀kọ́ ìsìn kan ju àpèjúwe ìṣẹ̀lẹ̀ lọ
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí àkíyèsí pé aṣọ ojú náà wà ní yàtọ̀ sí àwọn aṣọ ọ̀gbọ̀ yòókù.
  alternative: Kí a sọ pé pípọ̀ tàbí kíká aṣọ náà jọ jẹ́ àmì ètò àjíǹde tàbí ẹ̀rí pàtó nípa bí àjíǹde ṣe ṣẹlẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ibi tí aṣọ náà wà àti ipò rẹ̀, ṣùgbọ́n kò sọ ìtumọ̀ àmì tàbí ẹ̀rí ẹ̀kọ́ ìsìn kan ní tààrà. Nítorí náà, a pa ìtumọ̀ náà mọ́ gẹ́gẹ́ bí àpèjúwe.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè àdánidá, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye. ‘Aṣọ tí a fi bo ojú’ ṣe kedere ju ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí ó lè túmọ̀ sí aṣọ ọwọ́ lọ; ‘a ká a jọ’ sì pa ààyè sílẹ̀ fún ìtumọ̀ kíká, dídi, tàbí pípọ̀ aṣọ náà jọ.
