  source_fidelity: Ìtumọ̀ náà gba ìyàtọ̀ tó wà láàárín aṣọ ojú àti àwọn aṣọ ọ̀gbọ̀, pẹ̀lú ìfẹ̀hàn pé aṣọ ojú náà kò wà pẹ̀lú wọn ṣugbọn ó yà sọ́tọ̀. Ṣùgbọ́n “lórí rẹ̀” kò sọ ‘lórí orí rẹ̀’ ní kedere, “sí apá kan ní ibi kan” sì tún ìtumọ̀ ibi ṣe lọ́nà tí kò rọrùn. Àtúnṣe náà pa ἐπὶ τῆς κεφαλῆς αὐτοῦ, χωρὶς, àti εἰς ἕνα τόπον mọ́ ní kedere.
