revisions:
- from: Nítorí náà, ó sáré lọ bá Símónì Peteru àti ọmọ-ẹ̀yìn kejì náà[a], ẹni tí Jésù fẹ́ràn, ó sì sọ fún wọn pé, “Wọ́n ti gbé Olúwa jáde kúrò nínú ibojì, àwa kò sì mọ ibi tí wọ́n gbé e sí[b].”
  to: Nítorí náà, ó sáré lọ bá Símónì Pétérù àti ọmọ-ẹ̀yìn mìíràn náà[a], ẹni tí Jésù fẹ́ràn, ó sì sọ fún wọn pé, “Wọ́n ti gbé Olúwa jáde kúrò nínú ibojì, àwa kò sì mọ ibi tí wọ́n gbé e sí[b].”
  rationale: The revision replaces the ordinal 'kejì' with contrastive 'mìíràn,' faithfully reflecting ἄλλον without adding a claim about the disciple's numerical position. The corresponding footnote is corrected, and the conventional fully marked form 'Pétérù' is used.
