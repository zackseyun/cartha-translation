id: JHN.20.2
reference: John 20:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: yo
  text: Nítorí náà, ó sáré lọ bá Símónì Pétérù àti ọmọ-ẹ̀yìn mìíràn náà[a], ẹni tí Jésù fẹ́ràn, ó sì sọ fún wọn pé, “Wọ́n ti gbé Olúwa jáde kúrò nínú ibojì, àwa kò sì mọ ibi tí wọ́n gbé e sí[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “ọmọ-ẹ̀yìn mìíràn náà, ẹni tí Jésù fẹ́ràn.” Ọ̀rọ̀-ìṣe náà wá láti φιλέω, èyí tó lè tẹnu mọ́ ìfẹ́ tàbí ìfẹ́-ọ̀rẹ́; a tún lè túmọ̀ rẹ̀ sí “ẹni tí Jésù ní ìfẹ́ àkànṣe sí.”'
    reason: lexical_alternative
  - marker: b
    text: Màríà sọ pé, “àwa kò ... mọ,” ní ìbámu pẹ̀lú ẹni àkọ́kọ́ ọ̀pọ̀ nínú Gíríìkì. Àwọn kan lóye èyí gẹ́gẹ́ bí tó ń fi àwọn obìnrin mìíràn tí wọ́n wà pẹ̀lú rẹ̀ kún un; ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé ìdí tí ó fi lo ọ̀pọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Nítorí náà, ó sáré lọ bá
  rationale: ‘Nítorí náà’ ṣàfihàn àbájáde ìṣẹ̀lẹ̀ ẹsẹ tó ṣáájú. Èdè Yorùbá àdánidá máa ń so sísáré àti lílọ bá ẹni kan pọ̀ báyìí; ó tún pa ìyára àti ìgbésẹ̀ ìtàn náà mọ́ láìfi ọ̀rọ̀ àjèjì kún un.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: bá Símónì Peteru
  rationale: Nínú àyíká yìí, πρός tọ́ka sí lílọ sí ọ̀dọ̀ ẹni kan. ‘Lọ bá’ ni ìtumọ̀ Yorùbá tó ṣe déédé, tó sì bá ìṣe náà mu.
- source_word: τὸν ἄλλον μαθητήν
  choice: ọmọ-ẹ̀yìn kejì náà
  rationale: ‘Ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής. ‘Kejì náà’ fi hàn pé ẹni mìíràn yìí yàtọ̀ sí Peteru, láìsọ pé òun ni ọmọ-ẹ̀yìn kejì ní ipò tàbí ní àkókò.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: ẹni tí Jésù fẹ́ràn
  rationale: φιλέω lè sọ ìfẹ́ àti ìfararora. ‘Fẹ́ràn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́; ẹsẹ náà kò nílò gbólóhùn tó túmọ̀ imperfect gẹ́gẹ́ bí ìṣe tó ń lọ lọ́wọ́ nígbà náà.
- source_word: λέγει αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti ṣí ọ̀rọ̀ tààrà sílẹ̀, ó sì pa ìgbésẹ̀ ìtàn náà mọ́.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Wọ́n ti gbé Olúwa jáde kúrò nínú ibojì
  rationale: ‘Wọ́n ti gbé ... jáde’ fi ìṣe tó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ṣì wà hàn. μνημεῖον túmọ̀ sí ibojì ní àyíká ìsìnkú yìí, ἐκ sì ní agbára ‘jáde kúrò nínú.’
- source_word: οὐκ οἴδαμεν
  choice: àwa kò sì mọ
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ ẹni àkọ́kọ́ ọ̀pọ̀. Fífi ‘àwa’ hàn gbangba pa ọ̀pọ̀ náà mọ́, kò sì sọ ọ́ di ‘èmi’ láti mú ìtàn náà rọrùn.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: ibi tí wọ́n gbé e sí
  rationale: τίθημι níbí ni fífi tàbí gbígbé ẹni sí ibì kan. Gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, ó sì pa àìmọ ibi tí ara rẹ̀ wà mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí orúkọ oyè fún Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú ọ̀rọ̀ Màríà lẹ́yìn ikú Jésù, κύριος jẹ́ orúkọ oyè ọ̀wọ̀ fún un. ‘Olúwa’ pa ìtumọ̀ Kristẹni àti ọ̀wọ̀ náà mọ́ láìdín in kù sí ọ̀gá lásán.
- issue: Ọ̀pọ̀ inú οἴδαμεν
  choice: àwa kò sì mọ
  alternative: èmi kò sì mọ
  rationale: A pa ẹni àkọ́kọ́ ọ̀pọ̀ inú orísun Gíríìkì mọ́. A kò pinnu fún òǹkàwé ẹni tí ‘àwa’ náà ní nínú, nítorí ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àtẹ̀jáde ìtàn Yorùbá àdánidá dípò fífi historical present Gíríìkì ṣe àfarawé ní ọ̀nà tó máa dun bí èdè àjèjì. A pa ‘àwa’ mọ́ ní kedere láti dáàbò bo ìṣòro ìtumọ̀ inú orísun.
