review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative connection, Mary's movement to Simon Peter and the other disciple, the plural 'we,' and the report that the Lord was removed from the tomb. However, 'ọmọ-ẹ̀yìn kejì náà' means 'the second disciple' and introduces an ordinal claim not present in ἄλλον ('other').
  naturalness: The verse is generally clear and idiomatic in modern Standard Yoruba. 'Ọmọ-ẹ̀yìn mìíràn náà' naturally conveys the contrastive 'the other disciple.'
  terminology: '''Olúwa'' appropriately renders κύριον in this context. ''Ibojì'' is suitable for μνημεῖον. The spelling ''Pétérù'' accords with common Yoruba biblical orthography and supplies the natural tone marking.'
  issues:
  - severity: medium
    issue: '''ọmọ-ẹ̀yìn kejì náà'' renders τὸν ἄλλον μαθητήν as ''the second disciple.'''
    rationale: Greek ἄλλον identifies another/other disciple in contrast to Peter; it does not assign him second rank or sequence. The Yoruba wording should be 'ọmọ-ẹ̀yìn mìíràn náà.'
  - severity: low
    issue: Footnote a repeats the same ordinal rendering.
    rationale: The quoted Greek gloss should likewise say 'ọmọ-ẹ̀yìn mìíràn náà' so that the note does not preserve the source-level inaccuracy.
  revised_text: Nítorí náà, ó sáré lọ bá Símónì Pétérù àti ọmọ-ẹ̀yìn mìíràn náà[a], ẹni tí Jésù fẹ́ràn, ó sì sọ fún wọn pé, “Wọ́n ti gbé Olúwa jáde kúrò nínú ibojì, àwa kò sì mọ ibi tí wọ́n gbé e sí[b].”
