id: JHN.20.26
reference: John 20:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ mẹ́jọ, àwọn ọmọ-ẹ̀yìn rẹ̀ tún wà nínú ilé, Tọ́másì sì wà pẹ̀lú wọn. Jésù dé nígbà tí a ti tì àwọn ilẹ̀kùn, ó dúró láàárín wọn, ó sì wí pé, “Àlàáfíà fún yín.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Lẹ́yìn ọjọ́ mẹ́jọ
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, kò sì fi àlàyé ìṣírò ọjọ́ kún un.
- source_word: ἔσω
  choice: nínú ilé
  rationale: ‘Nínú ilé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n wà nínú; ‘ilé’ jẹ́ ohun tí àyíká ọ̀rọ̀ àwọn ilẹ̀kùn fi hàn.
- source_word: ἔρχεται
  choice: dé
  rationale: Aorist-like narrative flow in Yoruba is most naturally conveyed by ‘dé’; retaining a historical present mechanically would sound marked and would clash with the following past-form actions.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: Bí ó tilẹ̀ jẹ́ pé àwọn ilẹ̀kùn ti wà ní títì
  rationale: Ó pa ìtumọ̀ genitive absolute mọ́ pé àwọn ilẹ̀kùn wà ní títì nígbà tí Jésù dé, láì sọ ohun tí orísun kò sọ nípa bí ó ṣe wọlé.
- source_word: εἰς τὸ μέσον
  choice: láàárín wọn
  rationale: Ìtumọ̀ àdánidá ni Yorùbá fún dídúró ní àárín ẹgbẹ́ àwọn ọmọ-ẹ̀yìn.
- source_word: Εἰρήνη ὑμῖν
  choice: Àlàáfíà fún yín
  rationale: Ó jẹ́ ìkíni Semitic tí ó túmọ̀ sí àlàáfíà fún ẹgbẹ́ ènìyàn; ‘yín’ pa nọ́ńbà púpọ̀ mọ́.
theological_decisions:
- issue: Bí Jésù ṣe dé nígbà tí àwọn ilẹ̀kùn wà ní títì
  choice: 'A sọ ipò àwọn ilẹ̀kùn nìkan: ‘Bí ó tilẹ̀ jẹ́ pé àwọn ilẹ̀kùn ti wà ní títì, Jésù dé.’'
  alternative: ‘Jésù gba inú àwọn ilẹ̀kùn tí a ti tì kọjá’ tàbí ‘Jésù wọlé láì ṣí ilẹ̀kùn.’
  rationale: Ọ̀rọ̀ Gíríìkì kò ṣàlàyé ọ̀nà tí Jésù gbà dé; ìtumọ̀ náà yẹ kí ó pa àìṣedéédé yìí mọ́, kí ó má sì fi ìlànà ẹ̀kọ́ nípa ara àjíǹde kún un.
- issue: Historical present ἔρχεται
  choice: ‘dé’ ní ìṣàn ìtàn Yorùbá
  alternative: ‘ń dé’ tàbí ‘wá’ ní àsìkò ìsinsìnyí
  rationale: Historical present jẹ́ ohun èlò ìtàn Gíríìkì; Yorùbá àdánidá ń lo ọ̀rọ̀ ìṣe aláìní àmì àsìkò ní ìtẹ̀lé ìṣẹ̀lẹ̀, ‘dé’ sì bá ‘ó dúró’ àti ‘ó wí’ mu láì yí ẹ̀kọ́ kankan padà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Tọ́másì’ àti ‘Jésù’ gẹ́gẹ́ bí àkọtọ̀ orúkọ tí ó wọ́pọ̀. Kò sí àmì àlàyé ẹsẹ̀ nítorí kò sí àlàyé pàtàkì tí a nílò láti fi kún ọ̀rọ̀ náà.
