revisions:
- from: Jésù wí fún un pé, “Obìnrin, èé ṣe tí o fi ń sunkún? Ta ni ò ń wá?” Nígbà tí ó rò pé olùtọ́jú ọgbà náà ni, ó wí fún un pé, “Ọ̀gá[a], bí ìwọ bá ti gbé e kúrò, sọ ibi tí o gbé e sí fún mi, èmi yóò sì mú un kúrò.”
  to: Jésù wí fún un pé, “Obìnrin, èé ṣe tí o fi ń sunkún? Ta ni o ń wá?” Ó rò pé olùtọ́jú ọgbà ni Jésù, ó sì wí fún un pé, “Ọ̀gá[a], bí ìwọ bá gbé e kúrò, sọ ibi tí o gbé e sí fún mi, èmi yóò sì mú un kúrò.”
  rationale: The revision resolves the incomplete supposition clause by identifying Jésù as its referent, as required by the Greek. It also regularizes the second-person question. The respectful rendering of κύριε and its alternative-reading footnote are retained.
