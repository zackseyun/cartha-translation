id: JHN.20.15
reference: John 20:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: yo
  text: Jésù wí fún un pé, “Obìnrin, èé ṣe tí o fi ń sunkún? Ta ni o ń wá?” Ó rò pé olùtọ́jú ọgbà ni Jésù, ó sì wí fún un pé, “Ọ̀gá[a], bí ìwọ bá gbé e kúrò, sọ ibi tí o gbé e sí fún mi, èmi yóò sì mú un kúrò.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní èdè Gíríìkì: “Olúwa” (κύριε); ó ṣeé ṣe jù pé ọ̀rọ̀ ìbọ̀wọ̀ “Ọ̀gá” ni ó túmọ̀ sí níhìn-ín, nítorí Màríà rò pé òun ń bá olùtọ́jú ọgbà sọ̀rọ̀.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Obìnrin
  rationale: Ọ̀rọ̀ ìpè yìí jẹ́ ọ̀nà ìbọ̀wọ̀ fún obìnrin nínú àyíká náà, kì í ṣe ọ̀rọ̀ ẹ̀gàn; “Obìnrin” tún pa ìsọ̀rọ̀ tààrà àti àtúnlò ọ̀rọ̀ Jésù mọ́.
- source_word: τί κλαίεις
  choice: èé ṣe tí o fi ń sunkún
  rationale: κλαίω túmọ̀ sí sísunkún; ìtumọ̀ yìí jẹ́ ti ẹ̀dùn ọkàn, ó sì bójú mu nínú Yorùbá òde òní.
- source_word: τίνα ζητεῖς
  choice: Ta ni ò ń wá?
  rationale: ζητέω ni wíwá ẹnìkan tàbí ohun kan; “Ta ni” fi hàn pé ẹni ni ohun tí ó ń wá.
- source_word: δοκοῦσα
  choice: Nígbà tí ó rò pé
  rationale: Ó sọ ìrònú Màríà tí kò tọ́ láìfi dá a lójú ju bí Gíríìkì ṣe sọ lọ.
- source_word: ὁ κηπουρός
  choice: olùtọ́jú ọgbà
  rationale: Ó jẹ́ Yorùbá àdánidá fún ẹni tí ń tọ́jú ọgbà, ó sì bá κηπουρός mu.
- source_word: Κύριε
  choice: Ọ̀gá
  rationale: Níwọ̀n bí Màríà ti rò pé olùtọ́jú ọgbà ni ẹni náà, ọ̀rọ̀ ìbọ̀wọ̀ “Ọ̀gá” bá ipò yìí mu ju ìjẹ́wọ́ Kristi gẹ́gẹ́ bí “Olúwa” lọ.
- source_word: ἐβάστασας αὐτόν
  choice: ìwọ bá ti gbé e kúrò
  rationale: Ó pa ìtumọ̀ fífi agbára gbé ara ènìyàn àti mímú un kúrò níbẹ̀ mọ́.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: ibi tí o gbé e sí
  rationale: τίθημι túmọ̀ sí fífi tàbí gbígbé ohun sí ibìkan; gbolohun yìí rọrùn, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: èmi yóò sì mú un kúrò
  rationale: αἴρω lè túmọ̀ sí gbígbé tàbí mímú kúrò; “mú un kúrò” sọ ète Màríà láti gba òkú náà lọ, ó sì pa àsìkò ọjọ́ iwájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ọ̀rọ̀ Màríà kí ó tó mọ Jésù tí ó jíǹde
  choice: Ọ̀gá
  alternative: Olúwa
  rationale: Àyíká fi hàn pé Màríà rò pé olùtọ́jú ọgbà ni ó ń bá sọ̀rọ̀, nítorí náà ó ṣeé ṣe jù pé κύριε jẹ́ ọ̀rọ̀ ìbọ̀wọ̀, kì í ṣe ìjẹ́wọ́ nípa ẹni tí Kristi jẹ́. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan míì mọ́.
translation_notes:
  register: Yorùbá àpéjọpọ̀, ọlọ́lá, tí ó sì yé òǹkàwé òde òní. A lo “sunkún” dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ìjìnlẹ̀; a lo fọ́ọ̀mù ẹnu “ò ń wá” nínú ọ̀rọ̀ tààrà, ṣùgbọ́n a pa àmì ohùn mọ́ níbi tí ó bá jẹ́ ti àdánidá.
