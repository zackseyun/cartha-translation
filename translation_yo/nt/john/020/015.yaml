review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two questions, Mary’s mistaken supposition, the conditional statement, and both future and removal senses. However, the participial clause must explicitly identify Jesus as the one whom Mary supposes to be the gardener; as written, “Nígbà tí ó rò pé olùtọ́jú ọgbà náà ni” leaves the predicate incomplete/ambiguous in Yoruba.
  naturalness: Most wording is clear and appropriately formal. “Ta ni ò ń wá?” is not the best standard written form for the second-person subject here; “Ta ni o ń wá?” is clear and natural. Recasting the participial clause also produces a smoother narrative sequence.
  terminology: “Ọ̀gá” can function as a respectful address in this context and appropriately avoids prematurely imposing the christological title “Olúwa.” The footnote correctly retains the Greek lexical alternative. “Olùtọ́jú ọgbà” adequately conveys gardener.
  issues:
  - severity: medium
    issue: The clause translating δοκοῦσα ὅτι ὁ κηπουρός ἐστιν does not state that Jesus is the gardener Mary supposes him to be.
    rationale: “Nígbà tí ó rò pé olùtọ́jú ọgbà náà ni” ends with an unresolved predicate. The Greek explicitly says that she supposed he was the gardener. Adding “Jésù ni” restores the source relation without adding interpretation.
  - severity: low
    issue: “Ta ni ò ń wá?” is potentially confusing as written.
    rationale: 'Use the uncontracted second-person subject form “o” in this question for transparent standard Yoruba: “Ta ni o ń wá?”'
  revised_text: Jésù wí fún un pé, “Obìnrin, èé ṣe tí o fi ń sunkún? Ta ni o ń wá?” Ó rò pé olùtọ́jú ọgbà ni Jésù, ó sì wí fún un pé, “Ọ̀gá[a], bí ìwọ bá gbé e kúrò, sọ ibi tí o gbé e sí fún mi, èmi yóò sì mú un kúrò.”
  revised_footnotes:
  - marker: a
    text: 'Ní èdè Gíríìkì: “Olúwa” (κύριε); ó ṣeé ṣe jù pé ọ̀rọ̀ ìbọ̀wọ̀ “Ọ̀gá” ni ó túmọ̀ sí níhìn-ín, nítorí Màríà rò pé òun ń bá olùtọ́jú ọgbà sọ̀rọ̀.'
    reason: alternative_reading
  revision_rationale: The revision resolves the incomplete supposition clause by identifying Jésù as its referent, as required by the Greek. It also regularizes the second-person question. The respectful rendering of κύριε and its alternative-reading footnote are retained.
