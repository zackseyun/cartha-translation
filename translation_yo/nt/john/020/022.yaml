  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: yo
  text: Lẹ́yìn tí ó sọ èyí, ó mí sí wọn[a], ó sì wí fún wọn pé, “Ẹ gba Ẹ̀mí Mímọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ó mí sínú wọn.’ Ọ̀rọ̀-ìṣe náà tún ń rá ẹni létí àwòrán ìṣẹ̀dá àti ìṣẹ̀dá tuntun nínú Jẹ́nẹ́sísì 2:7 àti Ìsíkíẹ́lì 37.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Lẹ́yìn tí ó sọ èyí
  rationale: Ọ̀rọ̀ yìí fi hàn ní èdè Yorùbá àdánidá pé sísọ̀rọ̀ náà ṣẹlẹ̀ ṣáájú ìṣe pàtàkì tó tẹ̀ lé e, gẹ́gẹ́ bí aorist participle ṣe rí.
- source_word: ἐνεφύσησεν
  choice: ó mí sí wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún mímí sí ẹnì kan, láì fi tipátipá pinnu bóyá ó mí lé wọn tàbí sínú wọn. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ kejì àti ìrántí èdè ìṣẹ̀dá mọ́.
- source_word: λέγει αὐτοῖς
  choice: ó sì wí fún wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní present tense ìtàn, past tense bá ìṣàn ìtàn Yorùbá mu. ‘Wí fún wọn pé’ jẹ́ èdè ọlọ́lá tó sì yé òǹkàwé òde òní.
- source_word: Λάβετε
  choice: Ẹ gba
  rationale: Àṣẹ ‘Ẹ gba’ jẹ́ ìtumọ̀ àdánidá ti aorist imperative, ó sì dára ju ọ̀rọ̀ tó lè túmọ̀ sí pé kí wọ́n fi agbára ara wọn mú un lọ.
- source_word: πνεῦμα ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Nínú àyíká Ìhìn Rere Jòhánù, gbólóhùn náà tọ́ka sí Ẹ̀mí Ọlọ́run. Yorùbá kò nílò article bí ti Gẹ̀ẹ́sì, lílo lẹ́tà ńlá sì mú ìtọ́kasí náà ṣe kedere.
theological_decisions:
- issue: Bóyá πνεῦμα ἅγιον jẹ́ ẹ̀mí mímọ́ lásán tàbí Ẹ̀mí Mímọ́ ti Ọlọ́run
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Àyíká Jòhánù fi hàn pé Ẹ̀mí Ọlọ́run ni a ń tọ́ka sí, kì í ṣe agbára tàbí ẹ̀mí kan tí a kò mọ̀. Ìtumọ̀ náà kò fi ohun tí kò sí nínú ọ̀rọ̀ kún un.
- issue: Ìbáṣepọ̀ mímí náà pẹ̀lú àwọn ọmọ-ẹ̀yìn
  choice: ó mí sí wọn
  alternative: ó mí sínú wọn
  rationale: A kò pinnu ní pàtó pé mímí náà wọ inú wọn, nítorí ọ̀rọ̀ Gíríìkì lè gbé ìmọ̀ yẹn kalẹ̀ ṣùgbọ́n kò fi dandan mú un. Àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Wí fún wọn pé’ ní iyì tó bá ọ̀rọ̀ Ìwé Mímọ́ mu, ṣùgbọ́n gbogbo gbólóhùn náà ṣì rọrùn fún òǹkàwé òde òní.
