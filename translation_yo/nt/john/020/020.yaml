  to: Lẹ́yìn tí ó ti sọ èyí, ó sì fi ọwọ́ rẹ̀ méjèèjì àti ìhà rẹ̀ hàn wọ́n. Nígbà náà, àwọn ọmọ-ẹ̀yìn náà yọ̀ nígbà tí wọ́n rí Olúwa.
