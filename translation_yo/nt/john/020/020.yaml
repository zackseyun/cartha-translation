id: JHN.20.20
reference: John 20:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti sọ èyí, ó sì fi ọwọ́ rẹ̀ méjèèjì àti ìhà rẹ̀ hàn wọ́n. Nígbà náà, àwọn ọmọ-ẹ̀yìn náà yọ̀ nígbà tí wọ́n rí Olúwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Lẹ́yìn tí ó sì ti sọ èyí
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ aorist yìí fi hàn pé sísọ̀rọ̀ náà ṣáájú fífi ọwọ́ àti ẹ̀gbẹ́ hàn; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: ἔδειξεν
  choice: ó fi ... hàn
  rationale: Àkójọpọ̀ ọ̀rọ̀ 'fi ... hàn' ni Yorùbá àdánidá fún fífi ohun kan sí ojú ẹni kí ó lè rí i.
- source_word: τὰς χεῖρας
  choice: ọwọ́ rẹ̀ méjèèjì
  rationale: Bí Gíríìkì ṣe lo article, Yorùbá nílò arọ́pò-orúkọ olóǹkan níbí; 'méjèèjì' sọ plural náà di mímọ́ ní ọ̀nà àdánidá.
- source_word: τὴν πλευράν
  choice: ẹ̀gbẹ́ rẹ̀
  rationale: Ẹ̀gbẹ́ jẹ́ ìtumọ̀ tààrà fún πλευρά nínú àyíká ara ènìyàn, láìfi ọgbẹ́ kún ohun tí ẹsẹ̀ náà sọ.
- source_word: αὐτοῖς
  choice: wọ́n
  rationale: Nínú ìlò Yorùbá 'fi ... hàn wọ́n,' arọ́pò-orúkọ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí ẹni tí a fi ohun náà hàn sí.
- source_word: ἐχάρησαν
  choice: yọ̀
  rationale: '''Yọ̀'' ń gbé agbára ayọ̀ inú χαίρω jáde, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bójú mu.'
- source_word: οὖν
  choice: Nígbà náà ni
  rationale: Ó ń so ìríran Olúwa pọ̀ mọ́ ayọ̀ àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí ìtẹ̀síwájú àti àbájáde ìṣẹ̀lẹ̀ náà.
- source_word: οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: '''Ọmọ-ẹ̀yìn'' ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ọmọ tí ń tẹ̀lé tí ó sì ń kọ́ lábẹ́ olùkọ́.'
- source_word: ἰδόντες
  choice: nígbà tí wọ́n rí
  rationale: Gbólóhùn àsìkò yìí fi hàn pé rírí Olúwa ni àkókò àti ìdí ayọ̀ wọn, láìsọ participle Gíríìkì di ọ̀rọ̀ líle ní Yorùbá.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: '''Olúwa'' pa ìtumọ̀ oyè κύριος mọ́ nínú àyíká ìfarahàn Jesu lẹ́yìn àjíǹde, kì í sì í sọ ọ́ di ''ọ̀gá'' lásán.'
theological_decisions:
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: ọ̀gá
  rationale: Nínú ìfarahàn lẹ́yìn àjíǹde yìí, κύριος ní ìwọ̀n oyè Kristi ju pé ó jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ lásán; 'Olúwa' pa ìwọ̀n náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ àti ìbáṣepọ̀ rírí Olúwa pẹ̀lú ayọ̀ àwọn ọmọ-ẹ̀yìn mọ́.
