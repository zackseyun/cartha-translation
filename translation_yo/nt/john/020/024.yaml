id: JHN.20.24
reference: John 20:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: yo
  text: Tọ́másì, ọ̀kan lára àwọn Méjìlá, ẹni tí a ń pè ní Dídímù[a], kò sí pẹ̀lú wọn nígbà tí Jésù dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, orúkọ náà ni “Dídímù”; ó túmọ̀ sí “Ìbejì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: A kò fi ọ̀rọ̀ àsopọ̀ kan hàn ní tààràtà
  rationale: Níhìn-ín, δέ jẹ́ àmì ìyípadà díẹ̀ nínú ìtàn, kì í ṣe ìtakora líle tàbí ọ̀rọ̀ àkókò ‘nísinsin yìí.’ Bí a ṣe bẹ̀rẹ̀ pẹ̀lú ‘Tọ́másì’ jẹ́ kí ìyípadà sí ẹni tí ìtàn ń sọ̀rọ̀ rẹ̀ ṣe kedere ní Yorùbá.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: ọ̀kan lára àwọn Méjìlá
  rationale: Èyí dá Tọ́másì mọ̀ gẹ́gẹ́ bí ọmọ ẹgbẹ́ àwùjọ àwọn aposteli tí a mọ̀ sí ‘àwọn Méjìlá,’ kì í ṣe nọ́ńbà lásán.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: ẹni tí a ń pè ní Dídímù[a]
  rationale: A ṣe àfọwọ́kọ orúkọ àpèjúwe Gíríìkì náà gẹ́gẹ́ bí ‘Dídímù,’ a sì ṣàlàyé ìtumọ̀ rẹ̀, ‘Ìbejì,’ nínú àlàyé ìsàlẹ̀ kí a lè pa orúkọ ìbílẹ̀ àti ìtumọ̀ rẹ̀ mọ́.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: kò sí pẹ̀lú wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé Tọ́másì kò wà láàárín wọn ní àkókò náà.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: nígbà tí Jésù dé
  rationale: ‘Dé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún wíwá tàbí dídé Jésù sí ibi tí àwọn ọmọ-ẹ̀yìn péjọ sí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Δίδυμος
  choice: Dídímù nínú ọ̀rọ̀, pẹ̀lú àlàyé pé ó túmọ̀ sí ‘Ìbejì’
  alternative: Ìbejì nínú ọ̀rọ̀ pàtàkì
  rationale: Δίδυμος jẹ́ orúkọ àpèjúwe tó ní ìtumọ̀. Mímú àfọwọ́kọ rẹ̀ sínú ọ̀rọ̀ àti fífi ìtumọ̀ rẹ̀ sínú àlàyé pa ìrísí orúkọ Gíríìkì mọ́, ó sì tún jẹ́ kí òǹkàwé mọ ìtumọ̀ rẹ̀ láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo ‘àwọn Méjìlá’ gẹ́gẹ́ bí orúkọ àwùjọ tí a dá mọ̀.
