  source_fidelity: 'Ìtumọ̀ náà mú àwọn ẹ̀ka pàtàkì Gíríìkì náà wá dáadáa: Màríà rí áńgẹ́lì méjì, wọ́n wà ní funfun, wọ́n jókòó; ọ̀kan wà níbi orí, èkejì níbi ẹsẹ̀, níbi tí ara Jésù ti wà dùbúlẹ̀ tẹ́lẹ̀. Síbẹ̀, ìṣọ̀kan gbolóhùn tó wà nínú àkọsílẹ̀ lọwọlọwọ—“...tí wọ́n wọ aṣọ funfun, wọ́n jókòó”—kò so participle Gíríìkì náà pọ̀ mọ́ ohun tí Màríà rí dáadáa; ó lè dà bí gbolóhùn tuntun. Àtúnṣe náà so àwọn àpèjúwe méjèèjì mọ́ ‘áńgẹ́lì’ ní kedere.'
  naturalness: ‘...tí wọ́n wà ní aṣọ funfun tí wọ́n sì jókòó’ jẹ́ Yorùbá òde òní, ó sì ṣàn ju fífi ‘wọ́n jókòó’ sílẹ̀ lẹ́yìn àmì ìdákẹ́jẹ lọ. ‘Ní ibi orí’ àti ‘ní ibi ẹsẹ̀’ jẹ́ ọ̀nà tó rọrùn, tó sì mọ́gbọ́n dání láti sọ ipò náà.
  terminology: '‘Áńgẹ́lì,’ ‘ara Jésù,’ àti ‘aṣọ funfun’ yẹ fún àyíká ìtàn náà. A pa ‘ara’ mọ́ dípò ‘òkú,’ nítorí σῶμα ni Gíríìkì náà. A tún ṣe àtúnṣe àlàyé ìsàlẹ̀ (a): ‘ἐν λευκοῖς’ túmọ̀ ní tààrà sí ‘ní funfun,’ kì í ṣe ‘nínú funfun.’'
