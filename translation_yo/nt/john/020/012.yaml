  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: yo
  text: Ó sì rí àwọn áńgẹ́lì méjì tí wọ́n wà ní aṣọ funfun tí wọ́n sì jókòó, ọ̀kan ní ibi orí, èkejì sì ní ibi ẹsẹ̀, níbi tí ara Jésù ti wà dùbúlẹ̀ tẹ́lẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, “níbi tí ara Jésù wà dùbúlẹ̀.” Àìpé ọ̀rọ̀-ìṣe Gíríìkì lè jẹ́ kí a túmọ̀ rẹ̀ lọ́nà tó rọrùn bẹ́ẹ̀, ṣùgbọ́n “tẹ́lẹ̀” mú kedere pé ó ń sọ ipò ara náà ṣáájú àsìkò yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: ó sì rí
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àkókò ìsinsìnyí nínú ìtàn Gíríìkì, ṣùgbọ́n ‘ó sì rí’ ni ọ̀nà àdánidá láti tẹ̀síwájú nínú ìtàn Yorùbá. ‘Ó’ kò fi akọ tàbí abo hàn, ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé Màríà ni.
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Nínú àyíká ibojì òfìfo yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀dá ọ̀run, kì í ṣe àwọn ońṣẹ́ ènìyàn lásán.
- source_word: ἐν λευκοῖς
  choice: tí wọ́n wọ aṣọ funfun
  rationale: Gíríìkì túmọ̀ ní tààrà sí ‘nínú funfun,’ tí ó sì ń tọ́ka sí aṣọ funfun. Gbólóhùn yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: καθεζομένους
  choice: wọ́n jókòó
  rationale: Ó ṣàpèjúwe bí àwọn áńgẹ́lì náà ṣe wà; ‘wọ́n jókòó’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tí kò fi ‘níbẹ̀’ kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: ọ̀kan ní ìhà orí, èkejì sì ní ìhà ẹsẹ̀
  rationale: ‘Ní ìhà’ fi ipò àwọn méjèèjì hàn ní ẹ̀gbẹ́ méjì ibi tí ara náà ti dùbúlẹ̀, láì sọ pé orí tàbí ẹsẹ̀ ara náà ṣì wà níbẹ̀.
- source_word: ἔκειτο
  choice: ti dùbúlẹ̀ sí tẹ́lẹ̀
  rationale: Àìpé Gíríìkì ṣàpèjúwe ipò ara Jésù ní àkókò tó ṣáájú ohun tí Màríà ń rí báyìí. ‘Tẹ́lẹ̀’ mú ìbátan àkókò náà ṣe kedere ní Yorùbá.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: ara Jésù
  rationale: ‘Ara’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ní iyì tó yẹ fún σῶμα; kò le bí ‘òkú’ ṣe le koko.
theological_decisions:
- issue: Irú àwọn tí ἀγγέλους ń tọ́ka sí
  choice: àwọn áńgẹ́lì, ìyẹn àwọn ẹ̀dá ọ̀run
  alternative: àwọn ońṣẹ́
  rationale: Ibojì òfìfo, aṣọ funfun, àti gbogbo àyíká ìtàn jíǹde fi hàn pé àwọn áńgẹ́lì ni, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ońṣẹ́’ ní àyíká mìíràn.
- issue: Agbára àkókò ἔκειτο
  choice: a fi ipò tó ti wà ṣáájú hàn pẹ̀lú ‘tẹ́lẹ̀’
  alternative: ‘níbi tí ara Jésù dùbúlẹ̀ sí’ láì fi ‘tẹ́lẹ̀’ kún un
  rationale: Àyíká ìtàn fi hàn pé ara náà kò sí níbẹ̀ mọ́. Yíyan yìí mú ìtẹ̀sí àkókò náà ṣe kedere láì fi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ọ̀wọ̀, àdánidá, àti òde òní. A lo àmì ohùn níbi tí ó bá yẹ. A pa ìsopọ̀ ‘ó sì rí’ mọ́, a sì yẹra fún fífi ‘níbẹ̀’ kún participle, nítorí kò sí ní pàtó nínú Gíríìkì.
