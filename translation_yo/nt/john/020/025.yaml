  source_fidelity: 'Àwọn ìpinnu pàtàkì—ìṣe imperfect nínú ἔλεγον, perfect nínú Ἑωράκαμεν, àti ìkọ̀sílẹ̀ alágbára nínú οὐ μὴ πιστεύσω—wà nínú ìtumọ̀ náà. Ṣùgbọ́n ìṣọ̀kan àwọn apá ìpèníjà náà nílò àtúnṣe: ‘Bí ... kí n sì ...’ lè dà bí ìfẹ́/jùsìfù, kì í sì ṣàfihàn dáadáa pé gbogbo àwọn ìṣe mẹ́tẹ̀ẹ̀ta ni ohun tí Tọ́másì gbé kalẹ̀ gẹ́gẹ́ bí ipò. ‘Àpá ìṣó’ tún kéré síi ní ìbámu pẹ̀lú τύπον τῶν ἥλων, ó sì yẹ kí a tún ‘àwọn ìṣó’ náà sọ nínú ìgbà kejì gẹ́gẹ́ bí Gíríìkì ṣe ṣe.'
