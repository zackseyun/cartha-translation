id: JHN.20.25
reference: John 20:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: yo
  text: Nítorí náà, àwọn ọmọ ẹ̀yìn yòókù ń sọ fún un pé, “Àwa ti rí Olúwa.” Ṣùgbọ́n ó sọ fún wọn pé, “Bí n kò bá rí àmì àwọn ìṣó ní ọwọ́ rẹ̀, tí n kò sì fi ìka mi sínú àmì àwọn ìṣó náà, tí n kò sì fi ọwọ́ mi sínú ẹ̀gbẹ́ rẹ̀, dájúdájú, èmi kì yóò gbàgbọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èmi kì yóò gbàgbọ́ láéláé.” Èdè Gíríìkì lo ìsọdì alágbára gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àkókò imperfect ní Gíríìkì fi ìṣe tí ń lọ tàbí tí a ń ṣe léraléra hàn; “ń sọ” mú agbára yẹn jáde ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìtàn àti àbájáde ọ̀rọ̀ tó ṣáájú mọ́ ní èdè Yorùbá tó bójú mu.
- source_word: οἱ ἄλλοι μαθηταί
  choice: àwọn ọmọ ẹ̀yìn yòókù
  rationale: Ó fi ìyàtọ̀ tó wà láàárín Tọ́másì àti àwọn ọmọ ẹ̀yìn tó kù hàn kedere.
- source_word: Ἑωράκαμεν
  choice: Àwa ti rí
  rationale: “ti rí” ṣàfihàn ìṣe tó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì ṣì ṣe pàtàkì nísinsìnyí; fífi “Àwa” síwájú tún mú ìtẹnumọ́ ọ̀rọ̀ wọn jáde.
- source_word: κύριον
  choice: Olúwa
  rationale: Àkọ́lé yìí tọ́ka sí Jésù tó jíǹde, ó sì pa ìtumọ̀ Kristẹni ti κύριος mọ́ láì sọ ọ́ di “ọ̀gá” lásán.
- source_word: Ἐὰν μὴ ἴδω
  choice: Bí èmi kò bá rí
  rationale: Ìṣètò àídájú Yorùbá yìí dá ìpèníjà òdì Gíríìkì náà padà lọ́nà àdánidá.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: ní ọwọ́ rẹ̀
  rationale: “ní ọwọ́ rẹ̀” jẹ́ ọ̀nà àdánidá láti sọ ibi tí àpá náà wà, ó sì bá ἐν mu.
- source_word: τύπον τῶν ἥλων
  choice: àpá ìṣó
  rationale: Nínú àyíká ara tí a kàn mọ́ àgbélébùú, “àpá” sọ àmì tí ìṣó fi sílẹ̀ ní kedere; “ìṣó” jẹ́ ìṣó irin, kì í ṣe èékánná.
- source_word: βάλω τὸν δάκτυλόν μου εἰς
  choice: kí n sì fi ìka mi sínú
  rationale: “fi … sínú” pa ìṣípò wọ inú tí εἰς ní mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: μου τὴν χεῖρα
  choice: ọwọ́ mi
  rationale: Ó pa ọ̀rọ̀ arọ́pò oníhun tó hàn gbangba nínú Gíríìkì mọ́.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: ẹ̀gbẹ́ rẹ̀
  rationale: “ẹ̀gbẹ́” ni ìtumọ̀ ara tó bójú mu fún πλευρά nínú àyíká ọgbẹ́ tí ọkọ̀ gún ní ẹ̀gbẹ́ Jésù.
- source_word: οὐ μὴ πιστεύσω
  choice: dájúdájú, èmi kì yóò gbàgbọ́
  rationale: Àfikún “dájúdájú” àti fífi “èmi” hàn mú ìkọ̀sílẹ̀ alágbára ti οὐ μή jáde láì sọ ọ́ di ìpinnu ayérayé.
theological_decisions:
- issue: Agbára ìkọ̀sílẹ̀ Tọ́másì nínú οὐ μὴ πιστεύσω
  choice: “dájúdájú, èmi kì yóò gbàgbọ́”
  alternative: “èmi kì yóò gbàgbọ́ láéláé”
  rationale: οὐ μή jẹ́ ìkọ̀sílẹ̀ tó lágbára gan-an, ṣùgbọ́n ó wà lábẹ́ àídájú tí Tọ́másì gbé kalẹ̀. Ìtumọ̀ tí a yàn pa agbára náà mọ́ láì sọ pé kò ní gbàgbọ́ láéláé lábẹ́ ipò èyíkéyìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn gbólóhùn náà tẹ̀ lé ìṣàn ọ̀rọ̀ Yorùbá àdánidá, nígbà tí wọ́n pa ìṣe tó ń lọ nínú ἔλεγον, ìtumọ̀ perfect nínú Ἑωράκαμεν, àti ìtẹnumọ́ οὐ μή mọ́.
