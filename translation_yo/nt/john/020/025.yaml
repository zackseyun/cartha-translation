  terminology: ‘Olúwa,’ ‘àwọn ọmọ ẹ̀yìn yòókù,’ ‘ọwọ́,’ àti ‘ẹ̀gbẹ́’ yẹ. ‘Àmì àwọn ìṣó’ pa ìtumọ̀ τύπος (àmì/ìfarahàn tí ìṣó fi sílẹ̀) mọ́ láì fi ìtumọ̀ ọgbẹ́ tàbí àpá kan ṣoṣo kún un.
