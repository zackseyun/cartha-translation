  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: yo
  text: Tómásì dá a lóhùn, ó sì wí fún un pé, “Olúwa mi àti Ọlọ́run mi!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá a lóhùn
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan ‘dá ẹlòmíràn lóhùn,’ ó sì pa ìtumọ̀ ìdáhùn inú ìtàn mọ́.
- source_word: Θωμᾶς
  choice: Tọ́másì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ Tọ́másì ní Yorùbá.
- source_word: εἶπεν αὐτῷ
  choice: pé
  rationale: Nínú gbólóhùn ‘dá a lóhùn pé,’ arọ́pò-orúkọ ‘a’ ti fi ẹni tí Tọ́másì ń bá sọ̀rọ̀ hàn, ‘pé’ sì ṣí ọ̀rọ̀ rẹ̀; èyí yẹra fún àtúnwí tí kò dùn mọ́ etí.
- source_word: Ὁ κύριός μου
  choice: Olúwa mi
  rationale: ‘Olúwa’ pa ọ̀wọ̀ àti ìwọ̀n ẹ̀kọ́ nípa Kristi tí κύριος ní ní àyíká yìí mọ́, ‘mi’ sì pa ohun-ìní ara ẹni mọ́.
- source_word: ὁ θεός μου
  choice: Ọlọ́run mi
  rationale: ‘Ọlọ́run’ ni ìtumọ̀ Yorùbá tó ṣe déédéé fún θεός; ‘mi’ sì pa ìjẹ́wọ́ ara ẹni Tọ́másì mọ́.
- source_word: καὶ
  choice: àti
  rationale: ‘Àti’ so oyè méjèèjì pọ̀ gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Tọ́másì jẹ́ ìjẹ́wọ́ tààrà sí Jésù tàbí igbe ìyàlẹ́nu tí kò tọ́ka sí i
  choice: 'A mú un gẹ́gẹ́ bí ọ̀rọ̀ tààrà sí ẹni tí Tọ́másì dá lóhùn: “Olúwa mi àti Ọlọ́run mi!”'
  alternative: Kí a mú un gẹ́gẹ́ bí igbe ìyàlẹ́nu sí Ọlọ́run, láì fi àwọn oyè náà pe Jésù ní tààrà.
  rationale: Gíríìkì ní αὐτῷ, ‘sí i,’ tó fi hàn pé Tọ́másì sọ ọ̀rọ̀ náà fún un. Àwọn ọ̀rọ̀ onípènípè ὁ κύριός μου καὶ ὁ θεός μου sì lè ṣiṣẹ́ gẹ́gẹ́ bí ìpè tààrà ní Gíríìkì Koiné. Ìtumọ̀ náà kò dín agbára ẹ̀kọ́ nípa Kristi kù, bẹ́ẹ̀ ni kò fi àlàyé ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní èdè àdánidá, ọlọ́wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Dá a lóhùn pé’ ṣàkópọ̀ ἀπεκρίθη àti εἶπεν αὐτῷ lọ́nà tí Yorùbá gbà láì pàdánù ẹni tí a ń bá sọ̀rọ̀.
