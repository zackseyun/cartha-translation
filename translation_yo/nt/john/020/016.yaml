id: JHN.20.16
reference: John 20:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: yo
  text: Jésù sọ fún un pé, “Màríà.” Ó yí padà, ó sì sọ fún un ní èdè Hébérù[a] pé, “Rábónì!” (èyí tí ó túmọ̀ sí, “Olùkọ́”).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní èdè Árámáíkì.” Ọ̀rọ̀ tí Jòhánù lò, “ní èdè Hébérù,” lè tọ́ka ní ọ̀nà gbígbòòrò sí èdè ìran Ṣẹ́mù tí wọ́n ń sọ ní Jùdíà.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: A lo ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí láti pa ọ̀nà ìtàn alárinrin tí Jòhánù lò mọ́, dípò yíyí i sí àsìkò àtijọ́.
- source_word: αὐτῇ / αὐτῷ
  choice: fún un
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ẹni tí a bá sọ̀rọ̀ sí, láìfi akọ tàbí abo kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: Μαριάμ
  choice: Màríámù
  rationale: Àkọtọ̀ yìí tẹ̀ lé ìrísí orúkọ Gíríìkì Μαριάμ, ó sì bá ètò ìró Yorùbá mu.
- source_word: στραφεῖσα
  choice: Ó yíjú
  rationale: Ó sọ ìṣe yíyíjú náà ní ọ̀nà Yorùbá tí ó ṣe kedere, ó sì pa bí ìṣe náà ṣe ṣáájú ọ̀rọ̀ rẹ̀ mọ́.
- source_word: ἐκείνη
  choice: ó
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní agbára atọ́ka, ní àyíká yìí arọ́pò-orúkọ ni ó ń ṣe iṣẹ́ rẹ̀; “ó” ni Yorùbá àdánidá.
- source_word: Ἑβραϊστί
  choice: ní èdè Hébérù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà. Nítorí pé ó tún lè tọ́ka sí èdè Árámáíkì tí wọ́n ń sọ ní Jùdíà, a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀.
- source_word: Ραββουνι
  choice: Rábónì
  rationale: A pa ọ̀rọ̀ ìpè náà mọ́ gẹ́gẹ́ bí àkọsílẹ̀ ohùn, nítorí Ìhìn Rere náà fúnra rẹ̀ ṣàlàyé ìtumọ̀ rẹ̀ lẹ́sẹ̀kẹsẹ̀.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: èyí tí ó túmọ̀ sí, “Olùkọ́”
  rationale: “Ó túmọ̀ sí” jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere fún àlàyé ọ̀rọ̀ náà; “Olùkọ́” sì jẹ́ ìtumọ̀ àdánidá fún Διδάσκαλε.
theological_decisions:
- issue: Ìtumọ̀ Ἑβραϊστί nínú ìtàn Jòhánù
  choice: ní èdè Hébérù
  alternative: ní èdè Árámáíkì
  rationale: Ọ̀rọ̀ inú ẹsẹ̀ tẹ̀ lé Gíríìkì ní tààrà, láìdá ìbéèrè nípa èdè tí Màríámù lò parí. A pa ìtumọ̀ míì tí ó ṣeé ṣe mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbòò. A pa àsìkò ìsinsìnyí inú ìtàn mọ́ nínú “Jésù sọ,” a sì gbé àmì àlàyé [a] sí ibi tí ó ń ṣàlàyé gan-an lẹ́yìn “èdè Hébérù.”
