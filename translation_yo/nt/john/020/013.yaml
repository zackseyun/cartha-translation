id: JHN.20.13
reference: John 20:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: yo
  text: Wọ́n sì wí fún un pé, “Obìnrin, èé ṣe tí o fi ń sunkún?[a]” Ó wí fún wọn pé, “Wọ́n ti gbé Olúwa mi kúrò,[b] èmi kò sì mọ ibi tí wọ́n gbé e sí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni o ń sunkún fún?” Gíríìkì ní “kí ni” ní tààrà, ṣùgbọ́n ìbéèrè náà ń béèrè ìdí tí ó fi ń sunkún.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀gá mi.” Ọ̀rọ̀ Gíríìkì κύριος lè túmọ̀ sí “Olúwa” tàbí oyè ọ̀wọ̀ bí “ọ̀gá,” gẹ́gẹ́ bí àyíká ṣe rí.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Obìnrin
  rationale: Ọ̀rọ̀ ìpè yìí jẹ́ ọ̀nà ọ̀wọ̀ láti bá obìnrin sọ̀rọ̀ nínú àyíká yìí; “Obìnrin” pa ìtòsí ọ̀rọ̀ Gíríìkì àti àṣà ìkọ̀wé Jòhánù mọ́ láìfi ìmọ̀lára míì kún un.
- source_word: τί κλαίεις
  choice: kí ni ìwọ ń sunkún fún?
  rationale: Bí τί tilẹ̀ túmọ̀ ní tààrà sí “kí ni,” àkójọpọ̀ ọ̀rọ̀ náà ń béèrè ìdí tàbí ohun tí ẹnì kan ń sunkún fún. Èdè Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa àwòrán ọ̀rọ̀ orísun mọ́.
- source_word: Ἦραν
  choice: Wọ́n ti gbé ... kúrò
  rationale: Aorist náà tọ́ka sí ìṣe tí ó ti ṣẹlẹ̀; “ti gbé ... kúrò” fi ìṣe pípé àti àbájáde rẹ̀ tí ó ṣì wà hàn ní Yorùbá.
- source_word: τὸν κύριόν μου
  choice: Olúwa mi
  rationale: “Olúwa” lè jẹ́ orúkọ oyè ọ̀wọ̀, ó sì tún lè ní ìtumọ̀ nípa ẹni tí Kristi jẹ́. Yíyan rẹ̀ pa ìṣípayá méjèèjì mọ́.
- source_word: οὐκ οἶδα
  choice: èmi kò sì mọ
  rationale: οἶδα jẹ́ fọ́ọ̀mù pípé tí ń ṣiṣẹ́ gẹ́gẹ́ bí ipò ìsinsìnyí; “kò mọ” ni Yorùbá àdánidá fún un. “Èmi” tẹnu mọ́ ẹni tó ń sọ̀rọ̀ láìyí ìtumọ̀ padà.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: ibi tí wọ́n gbé e sí
  rationale: τίθημι túmọ̀ sí fífi tàbí gbígbé ohun sí ibì kan. “ibi tí wọ́n gbé e sí” jẹ́ Yorùbá tó rọrùn, tó sì bá àyíká ibojì mu.
- source_word: ἐκεῖνοι
  choice: Àwọn náà
  rationale: Ọ̀rọ̀ arọ́pò-afihàn náà ń tọ́ka padà sí àwọn áńgẹ́lì méjì; “Àwọn náà” pa agbára afihàn rẹ̀ mọ́ ju “wọ́n” lásán lọ.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ Màríà
  choice: Olúwa mi
  alternative: ọ̀gá mi
  rationale: “Olúwa mi” pa ààyè sílẹ̀ fún ọ̀wọ̀ tí Màríà ní sí Jésù àti fún ìtumọ̀ nípa ẹni tí Jésù jẹ́; kò dín ọ̀rọ̀ náà kù sí oyè àjọṣe lásán.
- issue: Ìró Γύναι
  choice: Obìnrin
  alternative: Ìyá / Obìnrin ọ̀wọ́n
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀wọ̀ ní àyíká rẹ̀, ṣùgbọ́n kò fi ìfẹ́ni àfikún hàn. “Obìnrin” pa ìsọ̀rọ̀ tààrà àti àìṣàfikún mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá; ìtòlẹ́sẹẹsẹ gbolohun sì pa ìṣàn ìtàn Jòhánù mọ́ láìdi Yorùbá líle.
