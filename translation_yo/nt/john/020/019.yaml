id: JHN.20.19
reference: John 20:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: yo
  text: Nígbà náà, nígbà tí ó di ìrọ̀lẹ́ ní ọjọ́ náà, ọjọ́ kìíní ọ̀sẹ̀, tí a sì ti ti àwọn ilẹ̀kùn ibi tí àwọn ọmọ-ẹ̀yìn wà pa nítorí ìbẹ̀rù àwọn Júù,[a] Jésù wá, ó dúró láàárín wọn, ó sì sọ fún wọn pé, “Àlàáfíà fún yín.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé túmọ̀ sí “àwọn olórí Júù” tàbí “àwọn ará Jùdíà,” gẹ́gẹ́ bí a bá ṣe lóye ọ̀rọ̀ Gíríìkì Ἰουδαῖοι nínú àyíká ọ̀rọ̀ yìí.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Kí àlàáfíà wà pẹ̀lú yín.” Ní tààràtà, Gíríìkì náà ní, “Àlàáfíà fún yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης ... ὀψίας
  choice: nígbà tí ó di ìrọ̀lẹ́
  rationale: Èyí sọ genitive absolute náà di gbólóhùn àkókò Yorùbá tó ṣe déédéé, tí ó sì pa ìtumọ̀ ìṣẹ̀lẹ̀ mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìtàn àti àbájáde pẹ̀lẹ́pẹ̀lẹ́ mọ́ láti inú ohun tó ṣáájú.
- source_word: τῇ μιᾷ σαββάτων
  choice: ọjọ́ kìn-ín-ní ọ̀sẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún gbólóhùn Gíríìkì tó túmọ̀ sí ọjọ́ àkọ́kọ́ ọ̀sẹ̀.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: tí a sì ti ti àwọn ilẹ̀kùn ... pa
  rationale: Àmì perfect passive fi hàn pé a ti ṣe ìṣe náà, ilẹ̀kùn sì ṣì wà ní títìpa; ‘ti ... pa’ tún bá ipò ààbò mu.
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: ibi tí àwọn ọmọ-ẹ̀yìn wà
  rationale: Ó sọ ibi tí wọ́n wà nìkan, láìfi èrò pé wọ́n ń gbé tàbí pé wọ́n péjọ kún un.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀, tó sì pa ìbáṣepọ̀ akẹ́kọ̀ọ́ àti olùkọ́ mọ́.
- source_word: διὰ τὸν φόβον
  choice: nítorí ìbẹ̀rù
  rationale: Ó fi ìdí tàbí ohun tó fà á hàn gẹ́gẹ́ bí διά pẹ̀lú accusative ṣe ń ṣe.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó pa ọ̀rọ̀ Gíríìkì náà mọ́ láìfi ‘àwọn olórí’ kún un; àlàyé ìsàlẹ̀ ojú ìwé ń tọ́ka sí àwọn ìtumọ̀ tó ṣeé ṣe nínú àyíká ọ̀rọ̀.
- source_word: ἔστη εἰς τὸ μέσον
  choice: ó dúró láàárín wọn
  rationale: Ó pa àwòrán ibi tí Jésù dúró sí mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: λέγει αὐτοῖς
  choice: ó sì wí fún wọn
  rationale: Historical present náà ni a sọ ní àsìkò àtẹ̀yìnwá kí ìtàn náà lè ṣàn dáadáa ní Yorùbá.
- source_word: Εἰρήνη ὑμῖν
  choice: Àlàáfíà fún yín
  rationale: Ó tẹ̀lé ìtumọ̀ gangan ‘àlàáfíà sí/fún yín,’ ó sì jẹ́ ìkíni tó yé ni Yorùbá.
theological_decisions:
- issue: Ẹni tí τῶν Ἰουδαίων ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù nínú ẹsẹ̀ pàtàkì, pẹ̀lú àwọn ìtumọ̀ míì nínú àlàyé ìsàlẹ̀ ojú ìwé
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ‘àwọn olórí’ ní pàtó. Síbẹ̀, nínú àyíká ìtàn Jòhánù ní Jerusalẹ́mù, ó lè tọ́ka ní pàtàkì sí àwọn alátakò tàbí aláṣẹ Júù. Àlàyé náà pa àìdánilójú yìí mọ́, ó sì dín ewu ìtumọ̀ ẹ̀yà gbogbo kù.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo ‘wí’ nínú ọ̀rọ̀ ìtàn gẹ́gẹ́ bí ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣì yé, a sì lo ‘àwọn ọmọ-ẹ̀yìn’ àti ‘àlàáfíà’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Yorùbá Bíbélì tó wọ́pọ̀.
