id: JHN.20.14
reference: John 20:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: yo
  text: Nígbà tí ó ti sọ nǹkan wọ̀nyí, ó yí padà, ó sì rí Jésù dúró; kò sì mọ̀ pé Jésù ni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ọ̀pọ̀; “nǹkan wọ̀nyí” pa iye ọ̀pọ̀ Gíríìkì mọ́, ó sì bá ìtàn Yorùbá àdánidá mu.
- source_word: εἰποῦσα
  choice: Nígbà tí ó ti sọ
  rationale: Aorist participle yìí tọ́ka sí ohun tí Màríà ṣe ṣáájú ìṣe pàtàkì; gbólóhùn àkókò yìí sọ ìbáṣepọ̀ náà ní Yorùbá àdánidá.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: ó yí padà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ láti sọ pé ènìyàn yí sí ibi tí ó wà lẹ́yìn rẹ̀.
- source_word: θεωρεῖ
  choice: ó sì rí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà wà ní present tense ìtàn nínú Gíríìkì, “rí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwòye gidi nínú ìtàn tó ń lọ.
- source_word: ἑστῶτα
  choice: dúró níbẹ̀
  rationale: Perfect participle náà ṣàpèjúwe Jésù ní ipò dídúró; “níbẹ̀” mú àwòrán ìṣẹ̀lẹ̀ náà ṣe kedere láìfi ibi pàtó tí Gíríìkì kò sọ kún un.
- source_word: οὐκ ᾔδει
  choice: kò mọ̀
  rationale: “Mọ̀” dúró sátòsí ìtumọ̀ ìpìlẹ̀ οἶδα, ó sì jẹ́ kí àlàyé pé ó lè túmọ̀ sí àìdá ẹni mọ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: pé Jésù ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn ìdánimọ̀ náà, ó sì pa kókó náà mọ́ pé Màríà kò mọ ẹni tí ó dúró níwájú rẹ̀.
theological_decisions:
- issue: Ìdánimọ̀ Jésù lẹ́yìn àjíǹde
  choice: kò mọ̀ pé Jésù ni
  alternative: kò dá Jésù mọ̀
  rationale: Ẹsẹ náà sọ pé Màríà kò mọ ẹni náà, ṣùgbọ́n kò sọ ìdí tí kò fi mọ̀ ọ́n. Ìtumọ̀ àkọ́kọ́ pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ inú ìtàn náà mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbogbò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ìtòlẹ́sẹẹsẹ gbólóhùn náà jẹ́ àdánidá, ó sì pa ìyàtọ̀ láàárín “kò mọ̀” àti “kò dá a mọ̀” mọ́.
