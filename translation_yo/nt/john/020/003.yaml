  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: yo
  text: Nítorí náà, Peteru àti ọmọ-ẹ̀yìn kejì náà jáde, wọ́n sì ń lọ sí ibojì náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n lọ sí ibojì náà.” A lè tú ọ̀rọ̀-ìṣe Gíríìkì náà sí ọ̀nà tí ó rọrùn yìí, ṣùgbọ́n “wọ́n ń lọ” túbọ̀ fi hàn pé ìṣe náà ń tẹ̀síwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: jáde
  rationale: Ọ̀rọ̀ náà tọ́ka sí kíkúrò ní ibi kan; “jáde” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìtumọ̀ ìdarí yìí mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ gẹ́gẹ́ bí àbájáde rẹ̀.
- source_word: ὁ Πέτρος
  choice: Peteru
  rationale: Èyí ni ìkọ̀wé orúkọ Peter tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: ὁ ἄλλος μαθητής
  choice: ọmọ-ẹ̀yìn kejì
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí ó dúró ṣinṣin fún μαθητής; “kejì” ń yà á sọ́tọ̀ sí Peteru gẹ́gẹ́ bí ẹni kejì nínú àwọn méjèèjì, láì sọ pé ó jẹ́ ọmọ-ẹ̀yìn ẹlẹ́ẹ̀kejì ní ipò tàbí ní àtòjọ.
- source_word: ἤρχοντο
  choice: wọ́n ń lọ
  rationale: Ìṣe aláìparí náà fi ìrìn tí ó ń lọ lọ́wọ́ hàn; “wọ́n ń lọ” pa apá ìtumọ̀ yìí mọ́ ní Yorùbá àdánidá.
- source_word: εἰς τὸ μνημεῖον
  choice: sí ibojì náà
  rationale: Nínú àyíká yìí μνημεῖον ni ibojì tí a sin Jesu sí; “sí” fi ìlọ sí ibi náà hàn láì sọ pé wọ́n wọ inú rẹ̀.
