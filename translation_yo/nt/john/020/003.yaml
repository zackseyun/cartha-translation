translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìtẹ̀síwájú ìṣe inú ἤρχοντο mọ́ nípasẹ̀ “ń lọ.”
