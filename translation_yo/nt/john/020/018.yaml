reference: John 20:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: yo
  text: Màríà ará Mágádálà wá, ó sì ròyìn fún àwọn ọmọ-ẹ̀yìn pé, “Mo ti rí Olúwa,” àti pé ó ti sọ àwọn nǹkan wọ̀nyí fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè ka apá ìkẹyìn náà gẹ́gẹ́ bí àlàyé olùkọ̀wé ìtàn: “Màríà ará Mágádálà wá, ó sì ròyìn fún àwọn ọmọ-ẹ̀yìn pé, ‘Mo ti rí Olúwa.’ Olúwa sì sọ àwọn nǹkan wọ̀nyí fún un.” Nítorí náà, gbólóhùn ìkẹyìn lè jẹ́ apá kan nínú ohun tí Màríà ròyìn, tàbí ó lè jẹ́ àlàyé olùkọ̀wé ìtàn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: wá
  rationale: Ọ̀rọ̀ ìṣe Gíríìkì jẹ́ present tense tí a lò fún ìtàn ohun tó ti ṣẹlẹ̀; “wá” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣẹ̀lẹ̀ náà, ó sì fi ìlọ sí ibi tí àwọn ọmọ-ẹ̀yìn wà hàn.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Màríà ará Mágádálà
  rationale: “Màríà” ni ìrísí orúkọ tí ó wọ́pọ̀ ní Yorùbá; “ará Mágádálà” ṣàlàyé pé Mágádálà ni obìnrin náà ti wá.
- source_word: ἀγγέλλουσα
  choice: ó sì ń kéde fún
  rationale: Ó pa agbára participle mọ́ gẹ́gẹ́ bí ohun tó ń lọ lọ́wọ́ nígbà tó dé, ó sì fi hàn pé ó ń mú ìròyìn kan tọ àwọn ọmọ-ẹ̀yìn lọ.
- source_word: τοῖς μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí ó ṣe déédé fún μαθητής; a kò fi “rẹ̀” kún un nítorí kò sí nínú Gíríìkì.
- source_word: Ἑώρακα
  choice: Mo ti rí
  rationale: Àmì “ti” fi hàn pé rírí náà ti ṣẹlẹ̀, ṣùgbọ́n ó ṣì ní ìṣe pàtàkì nísinsin yìí, bí perfect tense Gíríìkì ṣe túmọ̀ sí.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ oyè κύριος mọ́ nínú àyíká àjíǹde Jésù, láì dín ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà kù.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: àti pé ó ti sọ àwọn nǹkan wọ̀nyí fún un
  rationale: Ìtumọ̀ yìí ka gbólóhùn náà sí ohun kejì tí Màríà kéde, ó sì lo “ti sọ” fún ohun tí Olúwa ti sọ ṣáájú ìkéde rẹ̀. “Àwọn nǹkan wọ̀nyí” pa ταῦτα mọ́ ní kedere.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyíká àjíǹde
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ oyè fún Jésù, “Olúwa” sì pa ìwúwo oyè náà mọ́ láì fi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
- issue: Ìbáṣepọ̀ καὶ ταῦτα εἶπεν αὐτῇ pẹ̀lú ìròyìn Màríà
  choice: 'A kà á sí ara ohun tí Màríà kéde: “àti pé ó ti sọ àwọn nǹkan wọ̀nyí fún un”'
  alternative: 'A lè kà á sí àlàyé olùkọ̀wé ìtàn: “ó sì sọ àwọn nǹkan wọ̀nyí fún un”'
  rationale: Gíríìkì kò tún ὅτι sọ níwájú gbólóhùn ìkẹyìn, nítorí náà ìsopọ̀ rẹ̀ lè ní ìtumọ̀ méjèèjì. Ọ̀rọ̀ àkọ́kọ́ tẹ̀ síwájú gẹ́gẹ́ bí àkóónú ìkéde Màríà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tí ó ní àmì ohùn níbi tí ó ti yẹ, ó sì jẹ́ ọ̀wọ̀, àdánidá, àti kíkà-rọrùn. A lo “kéde” láti pa ìṣe jíjíṣẹ́ ìròyìn mọ́, a sì fi àlàyé ìsàlẹ̀ hàn nítorí àìdánilójú gidi nínú ìṣètò gbólóhùn Gíríìkì.
