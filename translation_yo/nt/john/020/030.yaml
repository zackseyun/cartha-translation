  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: yo
  text: Jésù sì ṣe ọ̀pọ̀lọpọ̀ àmì mìíràn[a] níwájú àwọn ọmọ-ẹ̀yìn náà, tí a kò kọ sínú ìwé yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “iṣẹ́ ìyanu”; ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “àmì,” ó sì tẹnumọ́ àwọn iṣẹ́ tí ń tọ́ka sí ohun tí ó ju ara wọn lọ—sí ẹni tí Jésù jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: sì ṣe ọ̀pọ̀lọpọ̀ … mìíràn
  rationale: “Ọ̀pọ̀lọpọ̀ … mìíràn” sọ iye àti àfikún tí ọ̀rọ̀ Gíríìkì ń fi hàn. “Sì” jẹ́ ọ̀nà Yorùbá tó rọrùn láti so gbólóhùn yìí mọ́ ohun tó ṣáájú àti ìyàtọ̀ μέν…δέ tí ẹsẹ̀ 31 ń parí, láìfi “nísinsìnyí” tàbí ìtumọ̀ ìgbà kan tí kò sí nínú orísun kún un.
- source_word: σημεῖα
  choice: àmì
  rationale: '“Àmì” pa ọ̀rọ̀ pàtàkì tí Jòhánù máa ń lò mọ́: àwọn iṣẹ́ agbára Jésù kì í ṣe iṣẹ́ ìyanu lásán, wọ́n ń tọ́ka sí ẹni tí ó jẹ́ àti iṣẹ́ rẹ̀.'
- source_word: ἐποίησεν
  choice: ṣe
  rationale: “Ṣe” jẹ́ ìtumọ̀ tààrà, àdánidá fún ποιέω nínú àyíká yìí.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: níwájú àwọn ọmọ-ẹ̀yìn náà
  rationale: “Níwájú” fi hàn pé àwọn ọmọ-ẹ̀yìn náà wà níbẹ̀ gẹ́gẹ́ bí ẹlẹ́rìí. “Àwọn … náà” dúró fún áríkálì Gíríìkì láìfi ọ̀rọ̀ arọ́pò-orúkọ oníhun “rẹ̀” tí kò sí nínú orísun kún un.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: tí a kò kọ
  rationale: Ìtumọ̀ yìí pa ìṣe àìmọ̀ ẹni tó ṣe é mọ́, ó sì sọ ní kedere pé àwọn àmì náà kò sí nínú ohun tí a kọ.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: sínú ìwé yìí
  rationale: “Ìwé yìí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún βιβλίον níbí, ó sì ń tọ́ka sí iṣẹ́ ìkọ̀wé tí òǹkọ̀wé ń sọ̀rọ̀ nípa rẹ̀.
theological_decisions:
- issue: Ìlò σημεῖα nínú Ìhìn Rere Jòhánù
  choice: àmì
  alternative: iṣẹ́ ìyanu
  rationale: “Àmì” pa ìtẹnumọ́ Jòhánù mọ́ pé àwọn iṣẹ́ wọ̀nyí ń fi ẹni tí Jésù jẹ́ àti iṣẹ́ tí ó wá ṣe hàn; “iṣẹ́ ìyanu” nìkan lè tẹnumọ́ agbára láìpa ìtọ́kasí yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; ọ̀rọ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní. A fi àmì ìsàlẹ̀-ẹsẹ̀ [a] sí lẹ́yìn “àmì mìíràn,” ibi tí àlàyé rẹ̀ ń tọ́ka sí ní tààrà.
