id: JHN.20.17
reference: John 20:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Má ṣe dì mọ́ mi[a], nítorí èmi kò tíì gòkè lọ sọ́dọ̀ Baba. Ṣùgbọ́n lọ sọ́dọ̀ àwọn arákùnrin mi[b], kí o sì sọ fún wọn pé, ‘Èmi ń gòkè lọ sọ́dọ̀ Baba mi àti Baba yín, àti sọ́dọ̀ Ọlọ́run mi àti Ọlọ́run yín.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Má ṣe fi ọwọ́ kàn mí” tàbí “Má ṣe dì mí mú.” Ó ṣeé ṣe kí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pé kí ó má ṣe máa dì mọ́ ọn, tàbí kí ó jáwọ́ nínú dídì mọ́ ọn, dípò fífi ọwọ́ kàn án lásán.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn arákùnrin” ni a fi túmọ̀ ọ̀rọ̀ Gíríìkì akọ púpọ̀ náà. Níhìn-ín, ó ń tọ́ka sí àwọn ọmọ-ẹ̀yìn Jésù, ó sì lè tọ́ka sí ẹgbẹ́ aṣojú tí ó gbòòrò.
    reason: cultural_note
lexical_decisions:
- source_word: ἅπτου
  choice: dì mọ́ mi
  rationale: Ọ̀rọ̀ yìí fi ìdímú tàbí fífara mọ́ ẹnì kan hàn ju fífi ọwọ́ kàn án lásán lọ. Pẹ̀lú μή àti ọ̀rọ̀ àṣẹ tí ó wà ní àkókò ìsinsìnyí, ó lè tọ́ka sí dídá ìṣe tí ó ń lọ lọ́wọ́ dúró.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: nítorí èmi kò tíì gòkè lọ
  rationale: “Kò tíì” pa ìtumọ̀ perfect náà mọ́, “gòkè lọ” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìlọsókè sí ọ̀dọ̀ Baba.
- source_word: πρὸς τὸν πατέρα
  choice: sọ́dọ̀ Baba
  rationale: Ko fi “mi” kún ibi tí Gíríìkì kò ti ní μου; ó sì jẹ́ kí gbolohun tó tẹ̀ lé e fi ìbáṣepọ̀ náà hàn ní kedere.
- source_word: πορεύου
  choice: lọ
  rationale: Àṣẹ ìrìn ni; “lọ” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye ní àyíká yìí.
- source_word: ἀδελφούς
  choice: àwọn arákùnrin mi
  rationale: Ó pa irú akọ púpọ̀ inú Gíríìkì mọ́. Àlàyé ìsàlẹ̀ fi hàn pé ní àyíká yìí ó ń tọ́ka sí àwọn ọmọ-ẹ̀yìn Jésù, bóyá gẹ́gẹ́ bí ẹgbẹ́ aṣojú tó gbòòrò.
- source_word: εἰπὲ αὐτοῖς
  choice: sọ fún wọn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún àṣẹ láti mú ọ̀rọ̀ dé ọ̀dọ̀ wọn.
- source_word: Ἀναβαίνω
  choice: Èmi ń gòkè lọ
  rationale: Àmì “ń” pa ìlọsíwájú àti ìṣẹ̀lẹ̀ tó sún mọ́lé inú ọ̀rọ̀ ìsinsìnyí mọ́.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: Baba mi àti Baba yín
  rationale: Ó pa ìṣọ̀kan gírámà àti ìyàtọ̀ ìbáṣepọ̀ tó wà láàárín “mi” àti “yín” mọ́.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: Ọlọ́run mi àti Ọlọ́run yín
  rationale: Ìtumọ̀ tààrà yìí pa àfiwé tó mọ́ra pẹ̀lú “Baba mi àti Baba yín” mọ́ láìdín agbára ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà kù.
theological_decisions:
- issue: Ìtumọ̀ Μή μου ἅπτου
  choice: Àṣẹ pé kí ó má ṣe máa dì mọ́ Jésù mọ́
  alternative: Má ṣe fi ọwọ́ kàn mí
  rationale: Ìrísí ọ̀rọ̀ Gíríìkì àti àyíká rẹ̀ ṣe àtìlẹ́yìn fún ìṣe dídìmú tó ń bá a lọ, kì í ṣe dídènà gbogbo fífi ọwọ́ kàn án rárá.
- issue: Ìtumọ̀ πατέρα nínú gbólóhùn àkọ́kọ́
  choice: Baba
  alternative: Baba mi
  rationale: Gíríìkì kò ní μου níbí; títumọ̀ rẹ̀ sí “Baba” jẹ́ kí ọ̀rọ̀ tó tẹ̀ lé e fúnra rẹ̀ sọ “Baba mi àti Baba yín.”
- issue: Ìtumọ̀ ẹ̀kọ́ nípa Kristi nínú “Ọlọ́run mi àti Ọlọ́run yín”
  choice: Túmọ̀ ọ̀rọ̀ náà tààrà láìrọ̀ ọ́
  alternative: Àtúnsọ tó máa dín agbára “Ọlọ́run mi” kù
  rationale: A gbọ́dọ̀ jẹ́ kí ìwọ̀n àti ìfọ̀kànsìn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Johanu dúró gẹ́gẹ́ bí a ti kọ ọ́, láìfi àlàyé ẹ̀kọ́ ìjọ kan sínú rẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí òǹkàwé lásán lè lóye ni a lò. A yan “dì mọ́” láti fi dídìmú tó ń bá a lọ hàn, a sì pa àtẹ̀jáde tó jọra “Baba mi àti Baba yín, àti … Ọlọ́run mi àti Ọlọ́run yín” mọ́.
