source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: yo
  text: Jésù wí fún un pé, “Ṣé nítorí pé o ti rí mi ni o ṣe gbàgbọ́?[a] Alábùkún-fún ni àwọn tí kò rí, tí wọ́n sì gbàgbọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí pé o ti rí mi ni o ṣe gbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà ṣeé kà gẹ́gẹ́ bí ìbéèrè tàbí ọ̀rọ̀ ìmúdájú.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésù wí fún un pé
  rationale: Ọ̀rọ̀ ìṣe tó wà ní àkókò ìsinsìnyí nínú Gíríìkì jẹ́ ìsinsìnyí ìtàn; “wí” bá ìṣàn ìtàn Yorùbá mu, “fún un” sì pa ẹni tí Jésù ń bá sọ̀rọ̀ mọ́.
- source_word: Ὅτι
  choice: Nítorí pé
  rationale: Ó ṣeé kà gẹ́gẹ́ bí àsopọ̀ tó ń fi ìdí hàn, ó sì so rírí Tọ́màsì mọ́ gbígbàgbọ́ rẹ̀ láì ṣe àlàyé tó kọjá ọ̀rọ̀ orísun.
- source_word: ἑώρακάς με
  choice: o ti rí mi
  rationale: “ti rí” fi ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà hàn, bí ìrísí pípé ọ̀rọ̀ Gíríìkì ṣe ń tọ́ka sí.
- source_word: πεπίστευκας
  choice: ni o ṣe gbàgbọ́
  rationale: Ìkọ̀lé “ni o ṣe” so gbígbàgbọ́ mọ́ ìdí tó ṣáájú rẹ̀, “gbàgbọ́” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún πιστεύω.
- source_word: μακάριοι
  choice: Alábùkún-fún ni
  rationale: Ó fi ipò ẹni tí Ọlọ́run ṣojú rere sí hàn ju ìmọ̀lára ayọ̀ lásán lọ, ó sì bójú mu fún ọ̀rọ̀ ìbùkún irú èyí.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: àwọn tí kò rí, tí wọ́n sì gbàgbọ́
  rationale: A pa àìsí ohun tí wọ́n rí nínú Gíríìkì mọ́, a kò sì fi “mi” kún un. “sì” mú ìyàtọ̀ tó wà láàárín àìrí àti gbígbàgbọ́ jáde lọ́nà àdánidá.
theological_decisions:
- issue: Bóyá gbólóhùn àkọ́kọ́ jẹ́ ìbéèrè tàbí ọ̀rọ̀ ìmúdájú
  choice: 'A túmọ̀ ọ́ sí ìbéèrè: “Nítorí pé o ti rí mi ni o ṣe gbàgbọ́ bí?”'
  alternative: 'Ó tún lè jẹ́ ọ̀rọ̀ ìmúdájú: “Nítorí pé o ti rí mi ni o ṣe gbàgbọ́.”'
  rationale: Àmì ìbéèrè nínú àwọn ẹ̀dà Gíríìkì òde òní àti àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ìbéèrè oníwà tútù; ṣùgbọ́n àwọn ìwé àfọwọ́kọ ìgbàanì kò ní àmì ìkọ̀wé òde òní, nítorí náà a pa ìtumọ̀ ọ̀rọ̀ ìmúdájú mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ tí ó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “bí?” láti mú ìbéèrè náà dun bí Yorùbá àdánidá, a sì yẹra fún fífi ẹ̀kọ́ ẹ̀sìn àrà ọ̀tọ̀ kún ọ̀rọ̀ náà.
