  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: yo
  text: Nítorí náà, àwọn ọmọ-ẹ̀yìn náà tún padà sí ibi tí wọ́n ń gbé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀, “sọ́dọ̀ ara wọn” tàbí “sí ibi tiwọn.” Ó ṣeé ṣe kí gbólóhùn Gíríìkì náà túmọ̀ sí pé wọ́n padà sí ibi tí wọ́n ń dúró.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: padà
  rationale: Ọ̀rọ̀ náà tọ́ka sí kíkúrò ní ibi ìṣẹ̀lẹ̀ náà; ní ìṣọ̀kan pẹ̀lú πάλιν àti ibi tí wọ́n ń lọ, ‘tún padà’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n kúrò níbẹ̀, wọ́n sì lọ sí ibi tí wọ́n ti wá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ohun tí àwọn ọmọ-ẹ̀yìn ṣe pọ̀ mọ́ ìtàn tó ṣáájú gẹ́gẹ́ bí àbájáde tàbí ìtẹ̀síwájú ìtàn.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ fi ìtumọ̀ ìpadà tàbí àtúnṣe hàn ní ṣókí, ó sì bá ‘padà’ mu lọ́nà àdánidá.
- source_word: πρὸς αὑτούς
  choice: sí ibi tí wọ́n ń gbé
  rationale: Ní ti gidi, gbólóhùn Gíríìkì náà lè túmọ̀ sí ‘sọ́dọ̀ ara wọn,’ ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí ibi ti wọ́n ń dúró tàbí ń gbé. Ìtumọ̀ yìí jẹ́ kíkà Yorùbá tó ṣe kedere láì sọ pé ilé ẹnì kọ̀ọ̀kan ni dandan.
- source_word: οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: ‘Àwọn ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn tí ń tẹ̀ lé Jésù; ‘náà’ ń tọ́ka sí àwọn méjèèjì tí ìtàn ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì yẹ fún òǹkàwé òde òní. A yàgò fún ‘ilé wọn’ nínú ọ̀rọ̀ pàtàkì nítorí Gíríìkì kò sọ ilé ní tààrà.
