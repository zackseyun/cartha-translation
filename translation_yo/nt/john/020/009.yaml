  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: yo
  text: Nítorí wọ́n kò tíì lóye látinú Ìwé Mímọ́ pé ó gbọdọ̀ jí dìde kúrò láàárín àwọn òkú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ ọ́ sí, “ó gbọdọ̀ jẹ́ kí a jí i dìde kúrò láàárín àwọn òkú.” Ṣùgbọ́n ọ̀rọ̀-ìṣe Gíríìkì níbí jẹ́ aláṣe: “jí dìde.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: kò tíì
  rationale: Ó fi hàn pé títí di àkókò yẹn, òye náà kò tíì dé bá wọn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé ìdí.
- source_word: ᾔδεισαν
  choice: lóye
  rationale: Nínú àyíká ọ̀rọ̀ yìí, kì í ṣe pé wọn kò mọ̀ pé Ìwé Mímọ́ wà, bí kò ṣe pé wọn kò tíì mọ ìtumọ̀ rẹ̀ dáadáa.
- source_word: τὴν γραφὴν
  choice: Ìwé Mímọ́ náà
  rationale: Ẹyọ ọ̀rọ̀ náà wà ní ẹyọ kan, ó sì tọ́ka sí àkọsílẹ̀ mímọ́ tí ó ní àṣẹ; ‘náà’ lè tọ́ka sí ẹ̀rí pàtó kan tàbí sí ẹ̀rí Ìwé Mímọ́ ní gbogbogbòò.
- source_word: ὅτι
  choice: pé
  rationale: Ó bẹ̀rẹ̀ àkóónú ohun tí wọn kò tíì lóye nínú Ìwé Mímọ́.
- source_word: δεῖ
  choice: ó yẹ kí
  rationale: Ó sọ dandan tí ète Ọlọ́run béèrè, láì sọ ọ́ di àṣẹ lásán.
- source_word: αὐτὸν
  choice: òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ àtẹnumọ́ yìí ń tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí yóò jí dìde, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ ‘wọn’.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó pa àwòrán Gíríìkì mọ́ pé ó jáde kúrò láàárín àwọn ẹni tí ó ti kú, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀναστῆναι
  choice: jí dìde
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún ìjíǹde, ó sì pa ìrísí ọ̀rọ̀-ìṣe aláṣe ti Gíríìkì mọ́.
theological_decisions:
- issue: Ọ̀nà tí a gbà sọ nípa ìjíǹde àti ẹni tó ṣe é
  choice: ó yẹ kí òun jí dìde kúrò láàárín àwọn òkú
  alternative: ó yẹ kí a jí òun dìde kúrò láàárín àwọn òkú
  rationale: Gíríìkì lo ọ̀rọ̀-ìṣe aláṣe ἀναστῆναι, nítorí náà, àkọ́kọ́ ọ̀rọ̀ pa ‘jí dìde’ mọ́. Ìtumọ̀ aláìṣe tún bá ẹ̀kọ́ Májẹ̀mú Tuntun mu, ṣùgbọ́n a kò fi í rọ́pò ìrísí ọ̀rọ̀ inú ẹsẹ̀ yìí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbòò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; ‘Ìwé Mímọ́’ jẹ́ ọ̀rọ̀ ìbílẹ̀ tí ó wọ́pọ̀ fún Scripture.
