source:
  edition: SBLGNT
  text: ἄν τινων ἀφῆτε τὰς ἁμαρτίας ⸀ἀφέωνται αὐτοῖς· ἄν τινων κρατῆτε κεκράτηνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: yo
  text: Bí ẹ bá dárí ẹ̀ṣẹ̀ ẹnikẹ́ni jì, a ti dárí ẹ̀ṣẹ̀ náà jì í;[a] bí ẹ bá sì fi ẹ̀ṣẹ̀ ẹnikẹ́ni pamọ́, a ti fi ẹ̀ṣẹ̀ náà pamọ́ fún un.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, “a ti dárí” jẹ́ perfect passive: ó lè tẹnu mọ́ ìṣe tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì ń bá a lọ. A kò dárúkọ ẹni tó ṣe ìdáríjì náà.'
    reason: source_aspect_and_theological_ambiguity
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “fi ... pamọ́” lè túmọ̀ sí “dì ... mú” tàbí “pa ... mọ́”; nínú àyíká yìí, ó túmọ̀ sí pé a kò tú ẹ̀ṣẹ̀ náà sílẹ̀. Gbólóhùn kejì náà náà lo perfect passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: Bí ... ẹnikẹ́ni
  rationale: Àkópọ̀ ἄν pẹ̀lú ọ̀rọ̀-ìṣe abẹ́nú fi ipò àìdánimọ̀ hàn. “Bí ... ẹnikẹ́ni” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ ‘if ... of anyone’ mọ́.
- source_word: ἀφῆτε
  choice: ẹ bá dárí ... jì
  rationale: Nínú ọ̀rọ̀ nípa ẹ̀ṣẹ̀, ἀφίημι túmọ̀ sí dídáríjì; ìkọ̀wé yìí jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: τὰς ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni èdè Gíríìkì lò, “ẹ̀ṣẹ̀” lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ àkójọpọ̀ ní Yorùbá, ó sì dára ju fífi “àwọn ẹ̀ṣẹ̀” sí gbogbo ibi lọ.
- source_word: ἀφέωνται αὐτοῖς
  choice: a ti dárí ẹ̀ṣẹ̀ rẹ̀ jì í
  rationale: “A ti ...” pa ìṣe àìsọ ẹni tó ṣe é àti ipò tí ó ti wáyé tí ó sì ń bá a lọ mọ́. “Jì í” tún fi ẹni tí a dárí ẹ̀ṣẹ̀ rẹ̀ jì hàn láìdárúkọ ẹni tó ṣe ìdáríjì náà.
- source_word: κρατῆτε
  choice: ẹ bá ... dá ... dúró
  rationale: Nínú ìyàtọ̀ rẹ̀ sí dídárí ẹ̀ṣẹ̀ jì, κρατέω túmọ̀ sí dídí ẹ̀ṣẹ̀ mú tàbí àìtú u sílẹ̀. “Dá ẹ̀ṣẹ̀ dúró” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu nínú àyíká yìí.
- source_word: κεκράτηνται
  choice: a ti dá ẹ̀ṣẹ̀ náà dúró
  rationale: 'Ìlò “a ti” ṣe àfihàn perfect passive Gíríìkì: ohun náà ti ṣẹlẹ̀, ipò rẹ̀ sì dúró títí di ìsinsìnyí; ó tún pa ìbáradọ́gba mọ́ pẹ̀lú gbólóhùn àkọ́kọ́.'
theological_decisions:
- issue: Bóyá kí ìtumọ̀ náà sọ pé àwọn ọmọ-ẹ̀yìn fúnra wọn ló ń mú ìdáríjì ṣẹ, tàbí pé ohun tí wọ́n ṣe bá ìṣe Ọlọ́run mu.
  choice: A lo “a ti dárí ...” àti “a ti dá ... dúró,” láìdárúkọ ẹni tó ṣe ìṣe náà.
  alternative: “Ọlọ́run ti dárí ...” / “Ọlọ́run ti dá ... dúró,” tàbí gbólóhùn tó sọ pé àwọn ọmọ-ẹ̀yìn ló ń ṣe é ní agbára ara wọn.
  rationale: Gíríìkì lo perfect passive, kò sì dárúkọ olùṣe. Ìtumọ̀ náà pa àìsọ olùṣe àti ìyọnu ẹ̀kọ́-ìgbàgbọ́ tó wà láàárín ìṣe àwọn ọmọ-ẹ̀yìn àti ìṣe Ọlọ́run mọ́, dípò kí ó pinnu rẹ̀ fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Ẹnikẹ́ni” mú àìdánimọ̀ inú Gíríìkì jáde; “ẹ̀ṣẹ̀” jẹ́ orúkọ àkójọpọ̀ ní Yorùbá. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá.
