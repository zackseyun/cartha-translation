translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìtàn tó ní iyì tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “sì” gẹ́gẹ́ bí àsopọ̀ ìtàn, a sì yẹra fún fífi ìtakora tí kò ṣe dandan sínú δέ.
