revisions:
- from: Àwọn méjèèjì ń sáré pọ̀; ọmọ-ẹ̀yìn kejì náà sì sáré ṣáájú Peteru, ó yára ju u lọ,[a] ó sì kọ́kọ́ dé ibojì náà.
  to: Àwọn méjèèjì ń sáré pọ̀; ọmọ-ẹ̀yìn mìíràn náà sì sáré ṣáájú Peteru, ó yára ju Peteru lọ,[a] ó sì kọ́kọ́ dé ibojì náà.
  rationale: Àtúnṣe pàtàkì ni láti yí “kejì” sí “mìíràn,” nítorí pé ìpilẹ̀ Gíríìkì kò pè é ní ọmọ-ẹ̀yìn ẹlẹ́ẹ̀kejì. A tún mú ìtọ́kasí Peteru nínú ìfiwéra kedere, a sì ṣàtúnṣe ọ̀rọ̀ aṣàyàn ìsàlẹ̀ sí ìlò Yorùbá boṣewa. Ìyókù ìtumọ̀ náà pa ìpele ìtàn àti ìtẹ̀lé ìṣẹ̀lẹ̀ inú ẹsẹ̀ náà mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:17Z'
