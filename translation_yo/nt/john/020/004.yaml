  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: yo
  text: Àwọn méjèèjì ń sáré pọ̀; ọmọ-ẹ̀yìn mìíràn náà sì sáré ṣáájú Peteru, ó yára ju Peteru lọ,[a] ó sì kọ́kọ́ dé ibojì náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ó sáré kọjá Peteru.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ gangan sí “sáré ṣáájú,” ìfiwéra náà sì sọ pé ó “yára ju Peteru lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  choice: ń sáré
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ “ń” fi ipò imperfect hàn gẹ́gẹ́ bí ìṣe tí ó ń bá a lọ ní àkókò tí ó kọjá.
- source_word: δὲ
  choice: ;
  rationale: Níbí, δέ jẹ́ àsopọ̀ aláìlágbára. Àmì ìdádúró yìí so àwọn gbólóhùn náà pọ̀ láìfi ìtakora tí kò ṣe dandan kún un.
- source_word: οἱ δύο ὁμοῦ
  choice: Àwọn méjèèjì … pọ̀
  rationale: Èyí pa ìtumọ̀ pé àwọn méjèèjì jọ ń ṣe ìṣe náà mọ́ ní Yorùbá àdánidá.
- source_word: ὁ ἄλλος μαθητής
  choice: ọmọ-ẹ̀yìn kejì náà
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún μαθητής nínú ìtàn Ìhìn Rere; “kejì” fi ìyàtọ̀ rẹ̀ sí Peteru hàn.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: sáré ṣáájú Peteru, ó yára ju u lọ
  rationale: Ìtumọ̀ yìí pa àwòrán “sáré ṣáájú” àti ìfiwéra “yára ju Peteru lọ” méjèèjì mọ́, bó ṣe wà nínú Gíríìkì.
- source_word: ἦλθεν πρῶτος
  choice: kọ́kọ́ dé
  rationale: “Kọ́kọ́ dé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé òun ni ó dé ní ipò àkọ́kọ́.
- source_word: εἰς τὸ μνημεῖον
  choice: dé ibojì náà
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ó dé ibi ìsìnkú náà ṣùgbọ́n kò tíì wọ inú rẹ̀; nítorí náà, “dé ibojì” yẹ ju “wọ inú ibojì” lọ.
