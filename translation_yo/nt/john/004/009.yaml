id: JHN.4.9
reference: John 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: yo
  text: Nítorí náà, obìnrin ará Samáríà náà sọ fún un pé, “Báwo ni ìwọ, tí o jẹ́ Júù, ṣe béèrè ohun mímu lọ́wọ́ mi, obìnrin ará Samáríà?” (Nítorí àwọn Júù kì í ní ìbáṣepọ̀ pẹ̀lú àwọn ará Samáríà.)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí àwọn Júù kì í lò ohun kan náà pọ̀ pẹ̀lú àwọn ará Samáríà,” bóyá ní pàtàkì nípa ohun èlò mímu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Nítorí náà, ... sọ
  rationale: “Nítorí náà” pa ipa ìsopọ̀ οὖν mọ́, ó sì lè tọ́ka sí ìtẹ̀síwájú tàbí àbájáde nínú ìtàn.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: obìnrin ará Samáríà náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìdánimọ̀ obìnrin náà àti ti ìran rẹ̀ hàn.
- source_word: Πῶς
  choice: Báwo ni ... ṣe
  rationale: Ìkọ́lé yìí sọ ìyàlẹ́nu obìnrin náà nípa ohun tí kò bá àṣà ìbáṣepọ̀ wọn mu.
- source_word: Ἰουδαῖος
  choice: Júù
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń fi ẹgbẹ́ ẹ̀sìn àti àwùjọ àwọn Júù wé àwọn ará Samáríà, kì í ṣe agbègbè Jùdíà nìkan.
- source_word: ὢν
  choice: tí o jẹ́
  rationale: Ó pa ìtumọ̀ ipò tàbí ìdánimọ̀ tí participle náà ń fi ṣe àkọ́lẹ̀ mọ́ láìfi ìbáṣepọ̀ ọgbọ́n kan tí Gíríìkì kò sọ kún un.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: béèrè ohun mímu lọ́wọ́ mi
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá tó ṣe kedere, ó sì fi ìbéèrè fún ohun tí a ó mu àti ẹni tí a béèrè lọ́wọ́ rẹ̀ hàn.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: mi, obìnrin ará Samáríà
  rationale: Àfikún yìí pa ìtọ́kasí ẹni àkọ́kọ́ àti ìdánimọ̀ obìnrin náà mọ́, ó sì ń ṣàlàyé ìdí ìyàlẹ́nu rẹ̀.
- source_word: συγχρῶνται
  choice: bá ... ṣe pọ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí lè ṣàpèjúwe ìbáṣepọ̀ àwùjọ ní gbogbogbòò; àlàyé ìsàlẹ̀ pa ìtumọ̀ tó ṣeé ṣe pé ó kan lílo ohun kan papọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖος nínú àyíká Johanu
  choice: Júù
  alternative: ará Jùdíà
  rationale: Ìyàtọ̀ tó wà níhìn-ín jẹ́ láàárín àwọn Júù àti àwọn ará Samáríà gẹ́gẹ́ bí ẹgbẹ́ àwùjọ àti ẹ̀sìn, kì í ṣe gẹ́gẹ́ bí olùgbé agbègbè méjì nìkan.
- issue: Ìwọ̀n ìtumọ̀ συγχρῶνται
  choice: ìbáṣepọ̀ àwùjọ ní gbogbogbòò
  alternative: pípa ohun èlò kan náà pọ̀ tàbí lílo nǹkan papọ̀
  rationale: Gbólóhùn àlàyé náà lè tọ́ka sí ìyapa àwùjọ wọn ní gbogbogbòò, ṣùgbọ́n àyíká ohun mímu mú kí ìtumọ̀ lílo ohun èlò papọ̀ tún ṣeé ṣe; àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé gbogbo. A lo “Júù” àti “ará Samáríà” fún ìdánimọ̀ àwọn ẹgbẹ́ náà; a sì pa àlàyé òǹkọ̀wé mọ́ sínú àkámọ́.
