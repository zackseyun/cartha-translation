id: JHN.4.13
reference: John 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: yo
  text: Jésù dá a lóhùn, ó sì wí fún un pé, “Ẹnikẹ́ni tí ó bá mu nínú omi yìí yóò tún gbẹ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá a lóhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ìdáhùn hàn nínú ìtàn, ó sì bá ìṣe aorist inú Gíríìkì mu.
- source_word: εἶπεν αὐτῇ
  choice: ó sì wí fún un pé
  rationale: A pa ọ̀rọ̀-ìṣe kejì mọ́ gẹ́gẹ́ bí Gíríìkì ṣe ní un; “fún un” fi ẹni obìnrin tí Jésù ń bá sọ̀rọ̀ hàn láìsọ akọ tàbí abo ní ọ̀nà tí kò bá èdè Yorùbá mu.
- source_word: Πᾶς ὁ πίνων
  choice: Olúkúlùkù ẹni tí ó bá mu
  rationale: Ó fi ìtẹnumọ́ gbogbo ènìyàn àti ìṣe tí ó lè máa ṣẹlẹ̀ hàn, láìfi akọ nìkan sí i.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: nínú omi yìí
  rationale: Ní Yorùbá, “mu nínú omi” jẹ́ ọ̀nà àdánidá láti sọ mímu láti inú orísun tàbí omi tí a ń tọ́ka sí; “yìí” pa agbára demonstrative τούτου mọ́.
- source_word: διψήσει πάλιν
  choice: yóò tún gbẹ́
  rationale: “Gbẹ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún díψάω nípa òùngbẹ; “tún” fi πάλιν, ìyẹn “lẹ́ẹ̀kan sí i,” hàn kedere.
theological_decisions:
- issue: Àgbékalẹ̀ ọ̀rọ̀ méjì ἀπεκρίθη ... καὶ εἶπεν
  choice: 'Pa àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́: “dá a lóhùn, ó sì wí”'
  alternative: Dín un kù sí “dá a lóhùn” tàbí “wí” nìkan
  rationale: Gíríìkì ní àwọn ọ̀rọ̀-ìṣe méjèèjì nínú àgbékalẹ̀ ìtàn tí Jòhánù sábà máa ń lò; pípa wọn mọ́ ń fi ìrísí orísun hàn láìyí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ padà.
- issue: Ìtumọ̀ gbogbogbò ti Πᾶς ὁ πίνων
  choice: “Olúkúlùkù ẹni tí ó bá mu”
  alternative: Ọkùnrin kọ̀ọ̀kan tí ó bá mu; Ẹnikẹ́ni tí ó bá mu
  rationale: Bí ó tilẹ̀ jẹ́ pé àkọ́lé Gíríìkì jẹ́ akọ ní gírámà, ìtọ́kasí rẹ̀ kan gbogbo ènìyàn; àṣàyàn yìí pa ìwọ̀n gbogbo ènìyàn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọlọ́lá, àdánidá, ó sì rọrùn fún òǹkàwé òde òní. A pa àgbékalẹ̀ ọ̀rọ̀ méjì ti orísun mọ́, bí ó tilẹ̀ jẹ́ pé ó ní ìrísí díẹ̀ tí ó fẹ́rẹ̀ẹ́ tún ara rẹ̀ sọ.
