revisions:
- from: Jésù dá a lóhùn, ó sì wí fún un pé, “Olúkúlùkù ẹni tí ó bá mu nínú omi yìí yóò tún gbẹ́.”
  to: Jésù dá a lóhùn, ó sì wí fún un pé, “Ẹnikẹ́ni tí ó bá mu nínú omi yìí yóò tún gbẹ́.”
  rationale: 'The revision removes only an unnecessary lexical duplication in the generic subject. It preserves the Greek double speech formula, the generic force of the present participle, the reference to this particular water, and the future sense of thirst recurring. No target-language footnote is needed: Yoruba third-person pronouns are not gender-marked, and the immediate literary context identifies the referent.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains Jesus as subject, the two-part response formula, the indirect object, the universal scope, the demonstrative “this water,” and the future repetition of thirst. The conditional construction is acceptable for the Greek generic participle, but the phrase “Olúkúlùkù ẹni” is needlessly repetitive.
  naturalness: “Olúkúlùkù ẹni” is not natural economy in modern Standard Yoruba, since either “olúkúlùkù” or “ẹnikẹ́ni” already expresses the intended universal reference. “Ẹnikẹ́ni tí ó bá mu” is clear, idiomatic, and inclusive. The remainder is suitably formal and natural.
  terminology: “Dá a lóhùn” and “wí fún un” appropriately preserve the source’s two narrative verbs. “Yóò tún gbẹ́” is an established Yoruba expression for becoming thirsty again; “tún” accurately renders πάλιν.
  issues:
  - severity: low
    issue: 'Redundant universal expression: “Olúkúlùkù ẹni.”'
    rationale: Both words independently convey the generic universal sense of Πᾶς ὁ πίνων. Replacing them with “Ẹnikẹ́ni” improves idiomatic Standard Yoruba without narrowing or otherwise changing the scope.
  revised_text: Jésù dá a lóhùn, ó sì wí fún un pé, “Ẹnikẹ́ni tí ó bá mu nínú omi yìí yóò tún gbẹ́.”
