  text: ἔλεγον οὖν οἱ μαθηταὶ πρὸς ἀλλήλους· Μή τις ἤνεγκεν αὐτῷ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: yo
  text: Nítorí náà, àwọn ọmọ-ẹ̀yìn ń sọ fún ara wọn[a] pé, “Kò gbọdọ̀ jẹ́ pé ẹnì kan ti mú oúnjẹ wá fún un, ṣé bẹ́ẹ̀ ni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó dájú pé kò sí ẹni tó mú oúnjẹ wá fún un, àbí?” Ìbéèrè Gíríìkì tí μή bẹ̀rẹ̀ ń retí ìdáhùn òdì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; “ń sọ” mú ìrísí yìí jáde ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè àwọn ọmọ-ẹ̀yìn mọ́ ohun tí Jésù ṣẹ̀ṣẹ̀ sọ, ó sì fi ìyọrísí èrò wọn hàn.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì péye fún àwọn tí ń kọ́ lẹ́sẹ̀ Jésù.
- source_word: πρὸς ἀλλήλους
  choice: fún ara wọn
  rationale: Ó fi hàn pé àwọn ọmọ-ẹ̀yìn ń bá ara wọn sọ̀rọ̀ láàárín ẹgbẹ́ náà.
- source_word: Μή τις
  choice: Ṣé ẹnì kan … ni?
  rationale: Ìbéèrè Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì jẹ́ kí ìbéèrè náà dúró; àlàyé ìfojúsọ́nà sí ìdáhùn òdì tí μή ní wà nínú àlàyé ìsàlẹ̀.
- source_word: ἤνεγκεν
  choice: ti mú … wá
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí mímú ohun kan dé ọ̀dọ̀ Jésù.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dátífù náà tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí a mú ohun jíjẹ náà wá fún.
- source_word: φαγεῖν
  choice: ohun jíjẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun kan tí ẹni lè jẹ, láìfi irú oúnjẹ kan kún ọ̀rọ̀.
