translation_notes:
  register: A lo Yorùbá àkókò-òde tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Ń sọ fún ara wọn” pa ìrísí ọ̀rọ̀-ìṣe tí ń lọ lọ́wọ́ mọ́, “ohun jíjẹ” sì jẹ́ gbólóhùn tí òǹkàwé Yorùbá òde òní lè lóye nírọ̀rùn.
