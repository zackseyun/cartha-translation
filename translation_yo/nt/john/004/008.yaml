source:
  edition: SBLGNT
  text: οἱ γὰρ μαθηταὶ αὐτοῦ ἀπεληλύθεισαν εἰς τὴν πόλιν, ἵνα τροφὰς ἀγοράσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: yo
  text: Nítorí àwọn ọmọ-ẹ̀yìn rẹ̀ ti lọ sí ìlú láti ra oúnjẹ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sí inú ìlú”; πόλις lè túmọ̀ sí ìlú ńlá tàbí, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí, ìlú kékeré.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láti ra àwọn ohun èlò ìjẹun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí; “Nítorí” jẹ́ ọ̀nà àdánidá láti mú agbára àsopọ̀ náà jáde ní Yorùbá.
- source_word: μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún àwọn tí ń tẹ̀ lé Jesu tí wọ́n sì ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀.
- source_word: ἀπεληλύθεισαν
  choice: ti lọ
  rationale: Ìṣe náà ti ṣẹlẹ̀ ṣáájú ìṣẹ̀lẹ̀ pàtàkì inú àyíká ọ̀rọ̀; “ti lọ” fi àkókò tó ṣáájú hàn ní Yorùbá láìsọ ọ̀rọ̀ di líle.
- source_word: εἰς τὴν πόλιν
  choice: sí ìlú
  rationale: “Sí” fi ìlọ sí ibi kan hàn, “ìlú” sì lè túmọ̀ πόλις lọ́nà àdánidá; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìlú ńlá tàbí ìlú kékeré ní àyíká yìí.
- source_word: ἵνα
  choice: láti
  rationale: ἵνα ń sọ ète ìlọ wọn; “láti” ni ọ̀nà Yorùbá tó ṣe déédéé láti fi ète hàn.
- source_word: τροφὰς
  choice: oúnjẹ
  rationale: “Oúnjẹ” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun jíjẹ; ó tún lè ní ìtumọ̀ àwọn ohun èlò ìjẹun.
- source_word: ἀγοράσωσιν
  choice: ra
  rationale: “Ra” jẹ́ ọ̀rọ̀ Yorùbá pẹ̀lẹ́ tó bá ìtumọ̀ ìṣe rírà mu.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàdojú, ọ̀wọ̀, àti èyí tí ó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu; ìtòlẹ́sẹẹsẹ gbolohun náà pa ìbáṣepọ̀ àlàyé γὰρ àti ète ἵνα mọ́.
