revisions:
- from: Nítorí náà, baba náà mọ̀ pé wákàtí yẹn ni Jésù sọ fún un pé, “Ọmọ rẹ wà láàyè”[a]. Òun fúnra rẹ̀ sì gbàgbọ́[b], àti gbogbo ará ilé rẹ̀ pẹ̀lú.
  to: Nítorí náà, baba náà mọ̀ pé ní wákàtí yẹn ni Jésù sọ fún un pé, “Ọmọ rẹ wà láàyè.”[a] Òun fúnra rẹ̀ sì gbàgbọ́,[b] àti gbogbo ará ilé rẹ̀ náà.
  rationale: A tún gbolohun àsìkò náà ṣe sí “ní wákàtí yẹn ni” láti mú “ní wákàtí tí” Gíríìkì hàn kedere. A sì rọ́pò “pẹ̀lú” ní ìparí pẹ̀lú “náà” kí ó máa ṣe kedere pé gbogbo ará ilé baba náà ni wọ́n gbàgbọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì. Àwọn ìsàlẹ̀-ẹsẹ pa àwọn àṣàyàn tí kò dájú mọ́ láìyàn ìtumọ̀ ẹ̀kọ́ kan.
