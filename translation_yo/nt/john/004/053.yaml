id: JHN.4.53
reference: John 4:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: yo
  text: Nítorí náà, baba náà mọ̀ pé ní wákàtí yẹn ni Jésù sọ fún un pé, “Ọmọ rẹ wà láàyè.”[a] Òun fúnra rẹ̀ sì gbàgbọ́,[b] àti gbogbo ará ilé rẹ̀ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọmọ rẹ ń gbé.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà lè tọ́ka sí pé ó gba ọ̀rọ̀ Jésù gbọ́ ní pàtó, tàbí pé ó wá ní ìgbàgbọ́ tó jinlẹ̀ sí i nínú Jésù; Gíríìkì kò sọ ìwọ̀n rẹ̀ ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: mọ̀
  rationale: Ó sọ nípa bí baba náà ṣe mọ ìbámu tó wà láàárín àsìkò tí àwọn ìránṣẹ́ rẹ̀ sọ àti àsìkò tí Jésù sọ ọ̀rọ̀ náà, láìfi àlàyé míì kún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ohun tí baba náà mọ̀ jẹ́ àbájáde ohun tí àwọn ìránṣẹ́ rẹ̀ sọ ní ẹsẹ tó ṣáájú.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: wákàtí yẹn ni
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti dá àsìkò pàtó tí ọ̀rọ̀ Jésù ṣẹlẹ̀ mọ̀, láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: Ὁ υἱός σου ζῇ
  choice: Ọmọ rẹ wà láàyè
  rationale: ζῇ jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí tó ń sọ ipò ọmọ náà pé ó wà láàyè; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní tó ṣe déédé.
- source_word: ἐπίστευσεν
  choice: gbàgbọ́
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ náà mọ́ láìsọ ní pàtó bóyá ó gbà ọ̀rọ̀ Jésù gbọ́ nìkan tàbí ó dé inú ìgbàgbọ́ tó jinlẹ̀ sí Jésù.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ní ìtẹnumọ́; ‘òun fúnra rẹ̀’ pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: gbogbo ará ilé rẹ̀
  rationale: Níbi yìí οἰκία ń tọ́ka sí àwọn tó jẹ́ ara agbo ilé, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé; ‘gbogbo’ sì dúró fún ὅλη.
theological_decisions:
- issue: Ìwọ̀n àti ohun tí ìgbàgbọ́ baba náà dálé
  choice: A sọ nìkan pé ó gbàgbọ́, bí Gíríìkì ṣe sọ ọ́.
  alternative: Ó lè túmọ̀ sí pé ó gbà ọ̀rọ̀ ìwòsàn Jésù gbọ́ ní pàtó, tàbí pé ó wá ní ìgbàgbọ́ tó pé sí i nínú Jésù.
  rationale: Àyíká Ìhìn Rere Jòhánù sábà máa ń fún πιστεύω ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀, ṣùgbọ́n ẹsẹ yìí kò sọ ìwọ̀n ìgbàgbọ́ náà ní pàtó. Nítorí náà, a kò yanjú ohun tí Gíríìkì fi sílẹ̀ ní ṣókí.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà ní ọlá, ó rọrùn fún òǹkàwé lásán, kò sì lo ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan ní pàtó.
