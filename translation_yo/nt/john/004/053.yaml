review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: baba náà mọ ìbámu wákàtí náà, Jésù sọ pé ọmọ náà wà láàyè, baba náà gbàgbọ́, bẹ́ẹ̀ ni gbogbo agbo ilé rẹ̀. Ṣùgbọ́n ìparí gbólóhùn náà nílò àtúnṣe kékeré kí ó lè sọ kedere pé gbogbo ará ilé náà pẹ̀lú ni wọ́n gbàgbọ́.'
  naturalness: “Àti gbogbo ará ilé rẹ̀ pẹ̀lú” lẹ́yìn “Òun fúnra rẹ̀ sì gbàgbọ́” lè dà bí ìfikún tí kò ní ọ̀rọ̀-ìṣe tirẹ̀ ní Yorùbá. “Àti gbogbo ará ilé rẹ̀ náà” jẹ́ ọ̀nà tó mọ́gbọ́n dání, ó sì jẹ́ kedere. “Ní wákàtí yẹn ni” tún mú ìbáṣepọ̀ àsìkò tí ἐν ᾗ sọ hàn kedere.
  terminology: “wà láàyè,” “gbàgbọ́,” àti “ará ilé” jẹ́ àwọn ọ̀rọ̀ boṣewa, adayeba, tí ó yẹ fún ζῇ, ἐπίστευσεν, àti οἰκία. A pa ìdánilójú tí ó wà nínú αὐτὸς mọ́ pẹ̀lú “òun fúnra rẹ̀,” láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
