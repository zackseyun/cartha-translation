id: JHN.4.12
reference: John 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: yo
  text: Ṣé ìwọ tóbi ju Jékọ́bù, baba wa, lọ ni, ẹni tí ó fún wa ní kànga náà, tí òun fúnra rẹ̀, àwọn ọmọ rẹ̀ ọkùnrin, àti ẹran ọ̀sìn rẹ̀ sì mu láti inú rẹ̀?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ σὺ
  choice: Ṣé ìwọ ... ni
  rationale: Ọ̀nà ìbéèrè Yorùbá yìí, pẹ̀lú àmì àlàyé, fi ìbéèrè àsọtẹ́lẹ̀ tí ó ń retí ìdáhùn òdì hàn, ó sì pa ìtẹnumọ́ inú σὺ mọ́.
- source_word: μείζων
  choice: tóbi ju ... lọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ipò tàbí ọlá títóbi, kì í ṣe ìwọ̀n ara; ‘tóbi ju ... lọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: Jékọ́bù baba wa
  rationale: Èyí pa ọ̀rọ̀ ìbátan àti ọlá fún baba ńlá mọ́, ó sì jẹ́ ìṣètò ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ἔδωκεν ἡμῖν
  choice: ó fún wa ní
  rationale: Ó túmọ̀ aorist náà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀, ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: τὸ φρέαρ
  choice: kànga yìí
  rationale: φρέαρ níbí ni kànga tí wọ́n ń pọn omi láti inú rẹ̀; ‘yìí’ jẹ́ àdánidá nítorí kànga náà wà níwájú àwọn olùsọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé Greek ní article.
- source_word: καὶ αὐτὸς ... ἔπιεν ἐξ αὐτοῦ
  choice: tí òun fúnra rẹ̀ sì mu nínú rẹ̀
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́, ‘mu nínú rẹ̀’ sì jẹ́ ọ̀nà Yorùbá tó bójú mu fún mímu omi láti inú kànga.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: àwọn ọmọ rẹ̀ ọkùnrin
  rationale: Èyí pa ìtumọ̀ akọ pàtó ti υἱοί mọ́ dípò lílo ‘àwọn ọmọ’ tí ó lè ní akọ àti abo.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: àwọn ẹran ọ̀sìn rẹ̀
  rationale: ‘Ẹran ọ̀sìn’ gba gbogbo àwọn ẹran ilé tí θρέμματα lè tọ́ka sí, láì dín in kù sí màlúù nìkan.
theological_decisions:
- issue: Agbára ìbéèrè àsọtẹ́lẹ̀ tí μή bẹ̀rẹ̀
  choice: Ìbéèrè tí ó ń retí ìdáhùn pé ‘Rárá’
  alternative: ‘Dájúdájú, ìwọ kò tóbi ju Jékọ́bù baba wa lọ, àbí?’
  rationale: Ṣé ... ni’ jẹ́ ìbéèrè àdánidá ní Yorùbá, ṣùgbọ́n ó lè má fi ìfojúsọ́nà ìdáhùn òdì hàn tó ọ̀nà gígùn náà; àlàyé ìsàlẹ̀ pa agbára Greek mọ́ láì sọ ìtumọ̀ náà di ọ̀rọ̀ ìdánilójú.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘kànga’ àti ‘ẹran ọ̀sìn’ gẹ́gẹ́ bí ọ̀rọ̀ gbogbo ènìyàn; a sì fi àmì ohùn sí ibi tí ó yẹ.
