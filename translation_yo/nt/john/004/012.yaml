  - severity: medium
    issue: ‘pẹ̀lú àwọn ọmọ rẹ̀ ọkùnrin àti àwọn ẹran ọ̀sìn rẹ̀’
    rationale: Ìṣètò náà lè túmọ̀ sí pé wọ́n kàn wà pẹ̀lú Jékọ́bù nígbà tó mu omi. Nínú Gíríìkì, ọ̀rọ̀-ìṣe ‘mu’ kan náà kan Jékọ́bù, àwọn ọmọ rẹ̀, àti ẹran ọ̀sìn rẹ̀.
