id: JHN.4.21
reference: John 4:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: yo
  text: 'Jésù sọ fún un pé, “Obìnrin[b], gba ọ̀rọ̀ mi gbọ́[a]: wákàtí kan[c] ń bọ̀ tí ẹ̀yin kì yóò sin Baba, yálà lórí òkè yìí tàbí ní Jerúsálẹ́mù.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbẹ́kẹ̀ lé mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbígba ohun tí ẹnì kan sọ gbọ́ tàbí gbígbẹ́kẹ̀ lé ẹni náà.
    reason: lexical_alternative
  - marker: b
    text: “Obìnrin” jẹ́ ọ̀nà ìpè tí ó ní ọ̀wọ̀ nínú àyíká yìí; kì í ṣe ọ̀rọ̀ àfojúdi.
    reason: cultural_note
  - marker: c
    text: Tàbí, “wákàtí náà ń bọ̀.” Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-orúkọ náà kò ní atíkù pàtó níbí, Jòhánù sábà máa ń lo “wákàtí” fún àsìkò pàtàkì kan nínú ètò Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: gba ọ̀rọ̀ mi gbọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ìpè tààrà láti gba ohun tí Jésù fẹ́ sọ gẹ́gẹ́ bí òtítọ́. Èdè yìí jẹ́ Yorùbá àdánidá, ó sì tún pa ìbátan rẹ̀ mọ́ pẹ̀lú èrò πιστεύω; ‘gbẹ́kẹ̀ lé mi’ tún ṣeé ṣe, ṣùgbọ́n ó tẹnu mọ́ ìgbẹ́kẹ̀lé ẹni ju gbígba ọ̀rọ̀ rẹ̀ gbọ́ lọ.
- source_word: γύναι
  choice: Obìnrin
  rationale: Èyí pa ìtumọ̀ gangan ti ọ̀rọ̀ ìpè náà mọ́. Nínú àyíká yìí, kì í ṣe ọ̀rọ̀ àfojúdi; fífi ‘ìyá’ tàbí ọ̀rọ̀ ìfẹ́ kún un yóò fi ohun tí kò sí nínú Gíríìkì kún ìtumọ̀.
- source_word: ἔρχεται ὥρα
  choice: Wákàtí kan ń bọ̀
  rationale: Ọ̀rọ̀-orúkọ náà kò ní atíkù pàtó nínú Gíríìkì, nítorí náà ‘wákàtí kan’ ń tẹ̀ lé ìrísí orísun, ó sì pa àkòrí ‘wákàtí’ tí Jòhánù máa ń lò mọ́ dípò ṣíṣe é ní ‘ìgbà’ lásán.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: lórí òkè yìí
  rationale: ‘Lórí’ ni ọ̀nà Yorùbá àdánidá fún ibi tí ó wà lórí òkè, ó sì tọ́ka sí òkè mímọ́ ti àwọn ará Samáríà tí wọ́n ń jíròrò.
- source_word: ἐν Ἱεροσολύμοις
  choice: ní Jerúsálẹ́mù
  rationale: ‘Ní’ ni àsopọ̀ ibi tí ó bá orúkọ ìlú mu ní Yorùbá; ìrísí ọ̀pọ̀ nínú Gíríìkì jẹ́ ìrísí orúkọ ìlú náà, kì í ṣe pé Jerúsálẹ́mù ju ọ̀kan lọ.
- source_word: προσκυνήσετε
  choice: ẹ̀yin kì yóò sin
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú, ẹni kejì ọ̀pọ̀ ni. ‘Sin’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìjọsìn Ọlọ́run nínú àyíká yìí, ó sì gbooro ju ìtẹríba ara nìkan lọ.
- source_word: τῷ πατρί
  choice: Baba
  rationale: Nínú Jòhánù, ó tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Baba. Lílò lẹ́tà ńlá fi hàn pé oyè Ọlọ́run ni, láìfi ìtumọ̀ míì kún un.
- source_word: οὔτε ... οὔτε
  choice: yálà ... tàbí
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe òdì ‘kì yóò,’ àpapọ̀ ‘yálà ... tàbí’ ń sọ ìtumọ̀ ‘kì í ṣe ní ibi yìí, bẹ́ẹ̀ ni kì í ṣe ní ibòmíràn’ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìró ohùn Jésù nínú γύναι
  choice: A túmọ̀ ọ́ ní tààrà sí ‘Obìnrin’ láìfi ọ̀rọ̀ amúrọ̀rùn kún un.
  alternative: ‘Ìyá’ tàbí ‘obìnrin ọ̀wọ́n’
  rationale: Àyíká kò fi àfojúdi hàn, ṣùgbọ́n àwọn àṣàyàn mìíràn lè fi ọ̀wọ̀ tàbí ìfẹ́ tí kò ṣe kedere nínú orísun kún un. Àlàyé ìsàlẹ̀ ni ó yẹ kí ó ṣàlàyé ìró rẹ̀.
- issue: Àkòrí ὥρα nínú Jòhánù
  choice: A pa ‘wákàtí’ mọ́ dípò ṣíṣe é ní ‘ìgbà.’
  alternative: ‘Ìgbà kan ń bọ̀’ tàbí ‘ìgbà náà ń bọ̀’
  rationale: ‘Wákàtí’ pa àsopọ̀ mọ́ pẹ̀lú àkòrí àsìkò pàtàkì nínú ètò Ọlọ́run, láìyanju ní ìkọ̀kọ̀ ohun gbogbo tí àsìkò náà túmọ̀ sí.
- issue: Ààlà ibi ìjọsìn
  choice: A pa ìsọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àsọtẹ́lẹ̀ pé ìjọsìn Baba kì yóò dá lé òkè yìí tàbí Jerúsálẹ́mù.
  alternative: Ṣíṣe àlàyé rẹ̀ nínú ẹsẹ̀ náà gẹ́gẹ́ bí ìparí gbogbo ìjọsìn ní àwọn ibi wọ̀nyí
  rationale: Ẹsẹ̀ náà tẹnu mọ́ pé ibi kì yóò jẹ́ ohun amúlò pàtàkì mọ́; kò yẹ kí ìtumọ̀ fi ẹ̀kọ́ ẹ̀sìn kan tí ó gbooro ju gbólóhùn náà lọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àtẹ̀jáde náà pa ọ̀rọ̀ Jòhánù nípa ‘wákàtí’ àti ìpè ‘Obìnrin’ mọ́, nígbà tí àwọn àlàyé ìsàlẹ̀ ń ṣọ́ òǹkàwé kúrò nínú àìgbọ́ye.
