  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: yo
  text: Nítorí o ti ní ọkọ márùn-ún[a], ọkùnrin tí o sì ní nísinsìnyí kì í ṣe ọkọ rẹ; òótọ́ ni o sọ èyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an: “Nítorí o ti ní ọkùnrin márùn-ún, ẹni tí o sì ní nísinsìnyí kì í ṣe ọkùnrin rẹ/ọkọ rẹ.” Ọ̀rọ̀ Gíríìkì ἀνήρ lè túmọ̀ sí “ọkùnrin” tàbí “ọkọ”; níbí, àyíká ṣe àtìlẹ́yìn fún “ọkọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: Nítorí o ti ní ọkọ márùn-ún
  rationale: “Nítorí” fi ipa ìṣàlàyé γὰρ hàn; “o ti ní” bá aorist náà mu ní Yorùbá, “ọkọ” sì ni ìtumọ̀ àyíká fún ἄνδρας.
- source_word: καὶ νῦν ὃν ἔχεις
  choice: ọkùnrin tí o sì ní nísinsìnyí
  rationale: “Nísinsìnyí” túmọ̀ νῦν; fífi “ọkùnrin” kún un mú ìtọ́kasí ὃν ṣe kedere, bí àyíká ṣe ń béèrè.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: kì í ṣe ọkọ rẹ
  rationale: Àjọṣe ìgbéyàwó ni σου ἀνήρ ń tọ́ka sí níbí; gbolohun Yorùbá yìí ṣe kedere ó sì jẹ́ ti ẹ̀dá.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: òótọ́ ni ohun tí o sọ yìí
  rationale: Èyí pa ìtọ́kasí τοῦτο mọ́, ó sì sọ àkóónú ἀληθὲς εἴρηκας ní Yorùbá àdánidá láìsọ agbára ọ̀rọ̀ náà di míràn.
theological_decisions:
- issue: Ìtumọ̀ ἀνήρ ní ìṣẹ̀lẹ̀ méjèèjì
  choice: Túmọ̀ ìṣẹ̀lẹ̀ àkọ́kọ́ sí “ọkọ,” àti èkejì sí “ọkọ,” ṣùgbọ́n lo “ọkùnrin” fún ẹni tí ọ̀rọ̀ arọ́pò ὃν ń tọ́ka sí.
  alternative: Túmọ̀ ἀνήρ ní ìtumọ̀ gbooro sí “ọkùnrin” ní gbogbo ibi.
  rationale: Àyíká fi hàn pé ìtàn ìgbéyàwó obìnrin náà àti àjọṣe rẹ̀ lọ́wọ́lọ́wọ́ ni a ń sọ. “Ọkọ” ni ìtumọ̀ àyíká tó ṣe kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ààyè ìtumọ̀ gbooro “ọkùnrin” mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo àmì àbọ̀ (semicolon) láti pa ìṣàn gbolohun Gíríìkì mọ́.
