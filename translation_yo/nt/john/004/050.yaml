id: JHN.4.50
reference: John 4:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: yo
  text: Jésù sọ fún un pé, “Máa lọ; ọmọkùnrin rẹ wà láàyè.” Ọkùnrin náà gba ọ̀rọ̀ tí Jésù sọ fún un gbọ́[a], ó sì bá ọ̀nà rẹ̀ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbẹ́kẹ̀ lé ọ̀rọ̀ tí Jésù sọ fún un.”
    reason: Àṣàyàn ìtumọ̀ fún πιστεύω nígbà tí ó túmọ̀ sí gbígbà tàbí ìgbẹ́kẹ̀lé nínú ọ̀rọ̀ tí a sọ.
lexical_decisions:
- source_word: Πορεύου
  choice: Máa lọ
  rationale: Àṣẹ yìí túmọ̀ sí pé kí ọkùnrin náà lọ. “Máa lọ” jẹ́ ọ̀nà àdánidá, ṣókí láti sọ ọ́ ní Yorùbá, ó sì bá ìṣàn ìtàn náà mu.
- source_word: ὁ υἱός σου
  choice: ọmọkùnrin rẹ
  rationale: υἱός tọ́ka sí ọmọ ọkùnrin ní pàtó, kì í ṣe “ọmọ” lásán.
- source_word: ζῇ
  choice: wà láàyè
  rationale: Ọ̀rọ̀ ìṣe ìsinsìnyí sọ pé ọmọ náà wà láàyè. Èyí kò yí ọ̀rọ̀ náà sí ìlérí ọjọ́ iwájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐπίστευσεν
  choice: gba ... gbọ́
  rationale: Níwọ̀n bí πιστεύω ti gba τῷ λόγῳ gẹ́gẹ́ bí ohun tí a gbà gbọ́, “gba ọ̀rọ̀ ... gbọ́” jẹ́ ìtumọ̀ Yorùbá àdánidá, ó sì lè ní ìtumọ̀ gbígbẹ́kẹ̀lé láìfi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ὁ ἄνθρωπος
  choice: Ọkùnrin náà
  rationale: Gíríìkì ẹsẹ yìí sọ “ọkùnrin náà” ní tààrà, bó tilẹ̀ jẹ́ pé àyíká ṣáájú ti fi hàn pé ó jẹ́ ìjòyè ọba.
- source_word: τῷ λόγῳ
  choice: ọ̀rọ̀
  rationale: Níhìn-ín λόγος ni ọ̀rọ̀ tí Jésù sọ; gbólóhùn tó tẹ̀ lé e mú ẹni tó sọ ọ́ hàn kedere.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: tí Jésù sọ fún un
  rationale: Èyí pa ìbáṣepọ̀ gbólóhùn náà mọ́, ó sì jẹ́ Yorùbá tó rọrùn, tó ṣe kedere.
- source_word: ἐπορεύετο
  choice: ó sì bá ọ̀nà rẹ̀ lọ
  rationale: Imperfect náà fi hàn pé ó bẹ̀rẹ̀ sí í tẹ̀ síwájú lójú ọ̀nà rẹ̀ lẹ́yìn tó gba ọ̀rọ̀ náà gbọ́; “bá ọ̀nà rẹ̀ lọ” mú ìṣípò ìtàn yìí jáde lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω nínú ìdáhùn ọkùnrin náà sí ọ̀rọ̀ Jésù
  choice: gba ... gbọ́
  alternative: gbẹ́kẹ̀ lé
  rationale: “Gba ... gbọ́” jẹ́ ọ̀nà Yorùbá tó bá ohun tí a sọ mu, ó sì pa ìfẹ̀ ìtàn Jòhánù mọ́ láìpinnu pé ìgbàgbọ́ yìí jẹ́ ìgbàgbọ́ ìgbàlà tàbí ìgbẹ́kẹ̀lé lásán.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, pẹ̀lú èdè òde òní tó bójú mu, tó sì ní iyì. A lo “ọmọkùnrin” láti pa akọ-ǹlá ti υἱός mọ́, “wà láàyè” fún ζῇ, àti “bá ọ̀nà rẹ̀ lọ” láti fi ìtẹ̀síwájú ìrìn-àjò hàn.
