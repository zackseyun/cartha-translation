source:
  edition: SBLGNT
  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: yo
  text: Nítorí náà, obìnrin náà fi ìkòkò omi rẹ̀ sílẹ̀, ó sì lọ sínú ìlú, ó sì ń sọ fún àwọn ènìyàn pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρίαν
  choice: ìkòkò omi
  rationale: Ó túmọ̀ sí ohun èlò amọ̀ tàbí ìkòkò tí a fi ń pọn tàbí gbé omi; ‘ìkòkò omi’ ṣe kedere, ó sì jẹ́ èdè àdánidá.
- source_word: πόλιν
  choice: ìlú
  rationale: ‘Ìlú’ ni ọ̀rọ̀ Yorùbá àdánidá fún πόλις ní àyíká yìí, láìfi ìwọ̀n tàbí ipò ìlú tí orísun kò sọ kún un.
- source_word: τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn ènìyàn lápapọ̀; yíyan ‘àwọn ènìyàn’ pa àìdánilójú yẹn mọ́ dípò dídín un sí ‘àwọn ọkùnrin’.
- source_word: λέγει
  choice: ó sì sọ
  rationale: Bó tilẹ̀ jẹ́ pé orísun lo àsìkò ìsinsìnyí onítàn (‘ó sì ń sọ’/‘ó sì sọ’), àsìkò àtẹ̀yìnwá ni Yorùbá àdánidá ń lò nínú ìtàn yìí; ‘ó sì sọ’ pa ìtẹ̀síwájú ìtàn mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yé òǹkàwé òde òní.
