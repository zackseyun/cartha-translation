id: JHN.4.29
reference: John 4:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: yo
  text: Ẹ wá, ẹ wò ọkùnrin kan tí ó sọ fún mi gbogbo ohun tí mo ti ṣe. Ṣé òun lè jẹ́ Mèsáyà náà[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: Ọ̀nà mìíràn láti mú oyè Gíríìkì ὁ χριστός wá sí Yorùbá.
lexical_decisions:
- source_word: Δεῦτε
  choice: Ẹ wá
  rationale: Ọ̀rọ̀ ìpè sí ọ̀pọ̀ ènìyàn ni; “Ẹ wá” fi àṣẹ ọlọ́wọ̀ àti ìkésíni inú Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: ἴδετε
  choice: ẹ wò
  rationale: Àṣẹ sí ọ̀pọ̀ ènìyàn ni, ó sì bá “Ẹ wá” pọ̀ gẹ́gẹ́ bí ìkésíni tààrà pé kí wọ́n lọ rí ẹni náà.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Ọ̀rọ̀ náà jẹ́ ẹyọ akọ, ó sì tọ́ka sí Jésù gẹ́gẹ́ bí ọkùnrin kan.
- source_word: ὃς εἶπέ μοι
  choice: tí ó sọ ... fún mi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà sọ ohun kan fún obìnrin náà.
- source_word: πάντα ὅσα
  choice: gbogbo ohun tí
  rationale: Ó pa ìtumọ̀ kíkún àti àpapọ̀ ohun gbogbo mọ́ láìfi àsọdùn mìíràn kún un.
- source_word: ἐποίησα
  choice: mo ti ṣe
  rationale: “Ti ṣe” sọ àwọn ìṣe àtijọ́ tí ó ṣì ṣe pàtàkì nínú ẹ̀rí obìnrin náà ní Yorùbá àdánidá.
- source_word: μήτι
  choice: Ṣé ... lè jẹ́
  rationale: Ìbéèrè yìí ní ìṣiyèméjì, ó sì ń pe àwọn olùgbọ́ láti ronú; kò sọ ìdáhùn náà di ohun tí ó dájú.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níbí, χριστός jẹ́ oyè ẹni tí a fòróró yàn tí àwọn Júù ń retí; “Mèsáyà” mú àyíká àti iṣẹ́ oyè náà hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ oyè Mèsáyà tí a ń retí, kì í ṣe orúkọ lásán. Àkọsílẹ̀ ìsàlẹ̀ jẹ́ kí òǹkàwé mọ ọ̀nà ìtumọ̀ mìíràn tí ó wọ́pọ̀.
- issue: Agbára ìbéèrè tí μήτι ń fúnni
  choice: Ṣé eléyìí lè jẹ́ ...?
  alternative: Àbí eléyìí ni ...?
  rationale: Àṣàyàn náà pa ìṣiyèméjì àti ìkésíni láti ronú mọ́, láìfi ìdáhùn odi tí a retí múlẹ̀ ju bí ọ̀rọ̀ inú àyíká ṣe gba lọ.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn ọ̀rọ̀ “Ẹ wá, ẹ wò” jẹ́ ìkésíni tó ṣe kedere sí ọ̀pọ̀ ènìyàn; ìbéèrè ìparí sì jẹ́ ti ìwádìí, kì í ṣe ìjẹ́wọ́ tó ti parí.
