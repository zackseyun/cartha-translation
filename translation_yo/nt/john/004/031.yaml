  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: yo
  text: Ní àárín ìgbà náà,[a] àwọn ọmọ-ẹ̀yìn ń rọ̀ ọ́[b] pé, “Rábì,[c] jẹun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní àkókò àárín náà.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀-ìṣe náà tún lè túmọ̀ sí “ń béèrè lọ́wọ́ rẹ̀” tàbí “ń bẹ̀ ẹ́”; ìṣe aláìparí náà lè fi hàn pé wọ́n ń ṣe bẹ́ẹ̀ léraléra. Ní àyíká yìí, wọ́n ń rọ Jésù láti jẹun.
    reason: lexical_alternative
  - marker: c
    text: “Rábì” jẹ́ oyè ìfẹ́nu-kíni Júù; ó tún túmọ̀ sí “Olùkọ́.”
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Lákòókò náà
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àkókò tó wà láàárín ìgbà tí obìnrin náà lọ àti ìjíròrò tó tẹ̀ lé e; ‘Lákòókò náà’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἠρώτων
  choice: ń rọ̀ ọ́ pé
  rationale: Ìṣe aláìparí náà fi hàn pé àwọn ọmọ-ẹ̀yìn ń bá a nìṣó láti béèrè tàbí rọ Jésù; ní àyíká ọ̀rọ̀ yìí, ‘ń rọ̀ ọ́ pé’ mú ìtumọ̀ ìṣírí wọn láti jẹun jáde.
- source_word: αὐτὸν
  choice: ọ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbà náà tọ́ka sí Jésù.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Àpilẹ̀kọ náà tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn tí a ti mọ̀ nínú ìtàn.
- source_word: λέγοντες
  choice: pé
  rationale: Ní Yorùbá àdánidá, ‘pé’ ṣàgbékalẹ̀ ohun tí wọ́n sọ lẹ́yìn ọ̀rọ̀ ìrọ̀.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa orúkọ oyè Júù náà mọ́ ní ìkọlórúkọ Yorùbá, dípò kí a sọ gbogbo ìtumọ̀ rẹ̀ di ‘Olùkọ́’ nínú ẹsẹ̀.
- source_word: φάγε
  choice: jẹun
  rationale: Àṣẹ ẹlẹ́ni kan ni; ‘jẹun’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì dára ju ‘jẹ’ lásán lọ ní àyíká yìí.
theological_decisions: []
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ń rọ̀ ọ́ pé’ láti fi ìṣe tó ń lọ nìṣó àti agbára ọ̀rọ̀ náà hàn láìsọ ọ́ di àṣẹ líle; a sì pa oyè ‘Rábì’ mọ́.
