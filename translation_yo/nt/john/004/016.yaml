source:
  edition: SBLGNT
  text: Λέγει ⸀αὐτῇ· Ὕπαγε φώνησον ⸂τὸν ἄνδρα σου⸃ καὶ ἐλθὲ ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: yo
  text: Ó sọ[a] fún un pé, “Lọ, pe ọkọ rẹ, kí o sì wá síbí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó ń sọ fún un”—ọrọ̀ Gíríìkì náà wà ní àsìkò ìsinsìnyí tí a lò gẹ́gẹ́ bí àsìkò ìsinsìnyí nínú ìtàn; nínú ìtàn Yorùbá, “Ó sọ” jẹ́ ìtumọ̀ àdánidá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: Ó sọ
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ present tense tí a lò gẹ́gẹ́ bí historical present nínú ìtàn. Yorùbá lè sọ ọ́ lọ́nà àdánidá pẹ̀lú “Ó sọ,” láìyí ìtẹ̀síwájú ìtàn padà.
- source_word: αὐτῇ
  choice: fún un
  rationale: Dative pronoun náà fi ẹni tí a ń bá sọ̀rọ̀ hàn; “fún un” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “to her” lẹ́yìn “sọ.”
- source_word: Ὕπαγε
  choice: Lọ
  rationale: Àṣẹ náà ní kí obìnrin náà kúrò níbẹ̀ láti ṣe ohun tí ó tẹ̀ lé; “Lọ” ṣe kedere, ó sì ṣókí.
- source_word: φώνησον
  choice: pe
  rationale: Nínú àyíká yìí, φωνέω túmọ̀ sí láti pe ẹnìkan wá; “pe” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àṣẹ náà mu.
- source_word: τὸν ἄνδρα σου
  choice: ọkọ rẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé ἀνήρ lè túmọ̀ sí “ọkùnrin” tàbí “ọkọ,” ohun tí ọ̀rọ̀ tó tẹ̀ lé sọ ní Jòhánù 4:17–18 fi “ọkọ rẹ” hàn gẹ́gẹ́ bí ìtumọ̀ tó bá àyíká yìí mu.
- source_word: καὶ
  choice: kí o sì
  rationale: A so àṣẹ kejì mọ́ ti àkọ́kọ́ ní Yorùbá àdánidá pẹ̀lú “kí o sì,” tí ó pa ìbáṣepọ̀ àwọn àṣẹ méjèèjì mọ́.
- source_word: ἐλθὲ
  choice: wá
  rationale: “Wá” ni ìbámu tààrà fún àṣẹ ἐλθὲ. A kò fi “padà” kún un, nítorí pé èrò yẹn wà nínú àyíká ṣùgbọ́n kò fara hàn gbangba nínú ọ̀rọ̀ Gíríìkì.
- source_word: ἐνθάδε
  choice: síbi
  rationale: Adverb ibi náà túmọ̀ sí “níbí/sí ibi yìí”; lẹ́yìn ọ̀rọ̀ ìṣípò “wá,” “síbi” ni Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó rọrùn, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “ọkọ rẹ” nítorí àyíká ẹsẹ̀ yìí àti ìdáhùn tó tẹ̀ lé; a sì pa àṣẹ méjèèjì mọ́ ní ṣókí.
