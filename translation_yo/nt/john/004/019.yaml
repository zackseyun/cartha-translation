  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: yo
  text: Obìnrin náà sọ fún un pé, “Olúwa[a], mo rí i pé wòlíì ni ẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gbẹ́ni.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tí a fi ń pe ẹnì kan, ó sì tún lè túmọ̀ sí “Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní àkókò ìsinsìnyí nínú ìtàn, àkókò tí ó ti kọjá ló bá ìṣàlàyé ìtàn mu lọ́nà àdánidá ní Yorùbá.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó fi ẹni tí obìnrin náà ń bá sọ̀rọ̀ hàn gẹ́gẹ́ bí olùgbà ọ̀rọ̀.
- source_word: ἡ γυνή
  choice: Obìnrin náà
  rationale: Ó ń tọ́ka sí obìnrin ará Samáríà tí a ti mẹ́nu kàn, kì í ṣe aya.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ pàtàkì κύριος mọ́; ní àyíká yìí, ó tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ lásán, èyí tí àlàyé ìsàlẹ̀ fi hàn.
- source_word: θεωρῶ
  choice: mo rí i
  rationale: Gbólóhùn Yorùbá yìí sọ ìfòye tàbí ìmọ̀ tí ó wá láti inú ohun tí Jésù ṣẹ̀ṣẹ̀ fi hàn, láìdi ọ̀rọ̀ náà le.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣáájú àkóónú ohun tí obìnrin náà mọ̀.
- source_word: προφήτης
  choice: wòlíì
  rationale: Ọ̀rọ̀ náà ń sọ pé Jésù jẹ́ wòlíì kan; kò fi dandan hàn pé òun ni “Wòlíì náà” ní ìtumọ̀ pàtó kan.
- source_word: σύ
  choice: ni ọ́
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti tẹnumọ́ pé ẹni tí a ń bá sọ̀rọ̀ náà ni wòlíì.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí ọ̀rọ̀ tí obìnrin náà fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gbẹ́ni
  rationale: Àyíká ọ̀rọ̀ náà lè túmọ̀ sí ìkíni ọlọ́wọ̀ tí kò tíì jẹ́ ìjẹ́wọ́ kíkún nípa ẹni tí Jésù jẹ́. “Olúwa” ni a lò nínú ẹsẹ̀, ṣùgbọ́n a pa ìtumọ̀ “Ọ̀gbẹ́ni” mọ́ nínú àlàyé ìsàlẹ̀ kí àìdánilójú inú Gíríìkì má bàa sọnù.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó ṣe kedere, tí ó sì ní iyì ni a lò. “Mo rí i pé” jẹ́ ọ̀rọ̀ àdánidá fún ìfòye, “wòlíì ni ọ́” sì pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́.
