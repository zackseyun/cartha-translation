  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: yo
  text: Nítorí náà, nígbà tí àwọn ará Samáríà dé ọ̀dọ̀ rẹ̀, wọ́n bẹ̀ ẹ́[a] pé kí ó dúró lọ́dọ̀ wọn; ó sì dúró níbẹ̀ fún ọjọ́ méjì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń bẹ̀ ẹ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi hàn pé wọ́n ń bá a lọ láti bẹ̀ ẹ́ tàbí pé wọ́n bẹ̀ ẹ́ léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ó mú ìtumọ̀ ìsopọ̀ tàbí àbájáde inú οὖν àti ìtumọ̀ àkókò inú ὡς jáde ní Yorùbá àdánidá.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: dé ọ̀dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n rìn tọ ẹni náà wá; ‘dé ọ̀dọ̀ rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: οἱ Σαμαρῖται
  choice: àwọn ará Samáríà
  rationale: Èyí jẹ́ orúkọ ẹgbẹ́ ènìyàn tàbí àwọn olùgbé Samáríà ní èdè Yorùbá tó ṣe kedere.
- source_word: ἠρώτων
  choice: wọ́n bẹ̀ ẹ́
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé wọ́n béèrè lọ́wọ́ rẹ̀ tàbí bẹ̀ ẹ́ pé kí ó ṣe ohun kan. Fífi ‘bẹ̀’ lò jẹ́ àdánidá, láìfi agbára ìrọ̀ tàbí ìfipá kún ọ̀rọ̀ náà.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: pé kí ó dúró lọ́dọ̀ wọn
  rationale: ‘Dúró’ mú μένω jáde gẹ́gẹ́ bí gbígbé ní ibì kan fún ìgbà díẹ̀, ‘lọ́dọ̀ wọn’ sì sọ ìtumọ̀ παρά pẹ̀lú dátífù di mímọ́.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: ó sì dúró níbẹ̀
  rationale: Ó pa ìbámu ọ̀rọ̀ mọ́ pẹ̀lú μεῖναι, ó sì ṣàfihàn ἐκεῖ ní tààràtà.
- source_word: δύο ἡμέρας
  choice: fún ọjọ́ méjì
  rationale: ‘Fún’ mú ìlò akúsatífù tó ń fi gígùn àkókò hàn jáde ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Àwọn ará Samáríà’ ṣe kedere fún òǹkàwé gbogbogbò, ‘dé ọ̀dọ̀ rẹ̀’ àti ‘dúró lọ́dọ̀ wọn’ sì jẹ́ gbólóhùn àdánidá. Àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ tí àlàyé rẹ̀ kàn.
