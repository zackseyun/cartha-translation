id: JHN.4.49
reference: John 4:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: yo
  text: Òṣìṣẹ́ ààfin ọba náà sọ fún un pé, “Olúwa[a], sọ̀kalẹ̀ kí ọmọ mi tó kú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tí ó tún lè túmọ̀ sí “Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: òṣìṣẹ́ ààfin ọba náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó ní ipò tàbí iṣẹ́ ní ààfin ọba. Yíyan ‘òṣìṣẹ́ ààfin ọba’ jẹ́ kedere ní Yorùbá òde òní, ó sì yẹra fún ṣíṣe àfikún pé ó jẹ́ ọmọ ọlọ́lá tàbí ìjòyè.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ gíga ti κύριε mọ́, ó sì jẹ́ kí ìtumọ̀ onípele tí ọ̀rọ̀ náà lè ní nínú Ìhìn Rere Jòhánù dúró. Nínú ọ̀rọ̀ àsọyé yìí, ó tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ lásán, nítorí náà a fi àṣàyàn yẹn sínú àlàyé ìsàlẹ̀.
- source_word: κατάβηθι
  choice: sọ̀kalẹ̀
  rationale: Ọ̀rọ̀ àṣẹ náà túmọ̀ sí láti lọ tàbí wá sí ibi tí ó rẹlẹ̀. ‘Sọ̀kalẹ̀’ pa ìtọ́ka sí ìrìn-àjò láti Kánà lọ sí Kapanaumu mọ́ láìfi ọ̀nà ìṣípò kún un.
- source_word: πρὶν ἀποθανεῖν
  choice: kí ... tó kú
  rationale: Ìlò πρίν pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ń fi àkókò ṣáájú hàn. ‘Kí ... tó kú’ ni ọ̀nà àdánidá tí Yorùbá fi ń sọ ‘before ... dies.’
- source_word: τὸ παιδίον μου
  choice: ọmọ mi
  rationale: παιδίον túmọ̀ sí ọmọ tàbí ọmọ kékeré. ‘Ọmọ mi’ pa ìtumọ̀ náà mọ́ láìsọ akọ tàbí abo tí ẹsẹ yìí kò sọ ní pàtó.
- source_word: λέγει πρὸς αὐτόν
  choice: sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé λέγει jẹ́ ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí nínú Gíríìkì, ó jẹ́ ìsinsìnyí ìtàn. Àsìkò tí ó ti kọjá jẹ́ àdánidá nínú ìtàn Yorùbá, ‘pé’ sì mú ọ̀rọ̀ tí ó tẹ̀ lé e wọlé lọ́nà tí ó rọrùn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí a fi ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ jẹ́ kí ó ṣeé ṣe kí ọ̀rọ̀ náà ní ìtumọ̀ ju ìkíni ọlọ́wọ̀ lọ, láìpinnu ohun tí òṣìṣẹ́ náà gbà gbọ́ ní kíkún. Nítorí àyíká ọ̀rọ̀ náà tún lè gba ìtumọ̀ ìbọ̀wọ̀ ‘Ọ̀gá,’ a pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Òṣìṣẹ́ ààfin ọba’ ṣàlàyé ipò ẹni náà láìlo ọ̀rọ̀ ìjòyè tí ó lè fi ipò àjogúnbá tàbí oyè ìbílẹ̀ kún orísun. A fi àmì ohùn sí ibi tí ó bá yẹ.
