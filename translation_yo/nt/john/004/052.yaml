  - severity: low
    issue: “láti ìlà-oòrùn” nínú akọsílẹ̀
    rationale: Èyí sọ ibi/ìtọ́sọ́nà (“from the east”), kì í sì sọ ìbẹ̀rẹ̀ ìṣírò ọjọ́ ní ìgbà tí oòrùn yọ. “Láti ìgbà tí oòrùn ti yọ” ni ó pe.
