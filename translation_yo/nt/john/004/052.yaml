  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbò: baba náà béèrè nípa wákàtí ìmúláradá ọmọ náà, àwọn ìránṣẹ́ sì dáhùn pé ibà fi í sílẹ̀ ní àná ní wákàtí keje. Ṣùgbọ́n “ara rẹ̀” lè tọ́ka sí baba tí ó béèrè náà dípò ọmọ rẹ̀; èyí mú kí olùtọ́ka ẹni nínú ọ̀rọ̀ Gíríìkì yí padà ní Yorùbá.'
  naturalness: “Béèrè lọ́wọ́ wọn” àti “ibà náà fi í sílẹ̀” jẹ́ Yorùbá àdánidá. “Ọmọ rẹ̀ bẹ̀rẹ̀ sí í yá” yọ àìgbọ́ye kúrò níbi “ara rẹ̀ bẹ̀rẹ̀ sí í yá.” Nínú akọsílẹ̀, “láti ìlà-oòrùn” kì í sọ ìgbà tí oòrùn yọ; ó túmọ̀ sí láti ẹ̀gbẹ́ ìlà-oòrùn.
  terminology: A ti pa “wákàtí keje” mọ́ láìsọ ọ́ di aago òde òní nínú ọ̀rọ̀ àkọ́kọ́, èyí tí ó yẹ. “Ibà” yẹ fún πυρετός. A gbọdọ̀ fi àmì akọsílẹ̀ sún mọ́ “wákàtí keje,” níbi tí ìtúmọ̀ rẹ̀ ti kan.
