    rationale: Àkọsílẹ̀ náà ṣàlàyé “wákàtí keje”; nítorí náà, àmì náà yẹ kí ó wà lẹ́yìn ọ̀rọ̀ náà, kì í ṣe lẹ́yìn gbogbo ọ̀rọ̀ àsọyé.
