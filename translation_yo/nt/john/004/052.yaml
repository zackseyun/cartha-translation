source:
  edition: SBLGNT
  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: yo
  text: Nítorí náà, ó béèrè lọ́wọ́ wọn ní wákàtí wo ni ọmọ rẹ̀ bẹ̀rẹ̀ sí í yá. Wọ́n sì sọ fún un pé, “Àná, ní wákàtí keje[a] ni ibà náà fi í sílẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní aago kan ọ̀sán,” bí a bá ń ka wákàtí láti ìgbà tí oòrùn ti yọ; àwọn kan lóye ìṣírò àkókò Jòhánù lọ́nà mìíràn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Nítorí náà, ó béèrè lọ́wọ́ wọn
  rationale: ‘Béèrè lọ́wọ́ wọn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó wádìí ọ̀rọ̀ náà lọ́dọ̀ wọn; ‘Nítorí náà’ pa ìsopọ̀ ìtàn tí οὖν ń fi hàn mọ́.
- source_word: τὴν ὥραν ... ἐν ᾗ
  choice: ní wákàtí wo ni
  rationale: Ìbéèrè aláìṣe-taara yìí jẹ́ àdánidá ní Yorùbá, ó sì tọ́ka sí àkókò pàtó gẹ́gẹ́ bí ὥρα ṣe rí.
- source_word: κομψότερον ἔσχεν
  choice: ara rẹ̀ bẹ̀rẹ̀ sí í yá
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí pé ìlera rẹ̀ ń sunwọ̀n sí i; yíyàn yìí mú ìbẹ̀rẹ̀ ìmúláradá hàn ní Yorùbá àdánidá.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Wọ́n sì sọ fún un pé
  rationale: Ó tẹ̀síwájú nínú ìtàn, ó sì gbé èsì àwọn ìránṣẹ́ kalẹ̀ lọ́nà Yorùbá tó rọrùn.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Àná, ní wákàtí keje
  rationale: A pa ìtúmọ̀ gangan ‘wákàtí keje’ mọ́, láìyí i sí àkókò òde òní, nítorí ẹsẹ náà kò sọ ètò ìṣírò àkókò tí a lò.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: ibà náà fi í sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, ó sì pa àwòrán Gíríìkì mọ́ pé ibà náà ni ó ‘fi’ aláìsàn náà ‘sílẹ̀.’
theological_decisions:
- issue: Ètò ìṣírò àkókò fún ‘wákàtí keje’
  choice: Fi ‘wákàtí keje’ sílẹ̀ gẹ́gẹ́ bí ó ṣe wà nínú orísun.
  alternative: Ó lè jẹ́ nǹkan bí aago kan ọ̀sán bí a bá ka àkókò láti ìlà-oòrùn; àwọn kan sì lóye pé Jòhánù lo ètò ìṣírò mìíràn.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ètò ìṣírò tí a lò, nítorí náà ìtumọ̀ kò gbọ́dọ̀ mú ohun tí kò dájú di ohun tí ó dájú.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ara rẹ̀ bẹ̀rẹ̀ sí í yá’ fún ìmúláradá, a sì pa àìdájú nípa ‘wákàtí keje’ mọ́ nínú àkọ́kọ́.
