  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξῆλθον ἐκ τῆς πόλεως καὶ ἤρχοντο πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: yo
  text: Wọ́n jáde kúrò ní ìlú náà, wọ́n sì ń bọ̀ wá sọ́dọ̀ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n jáde kúrò ní ìlú náà, wọ́n sì ń lọ sọ́dọ̀ rẹ̀.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn tí ó ń fi ojú ìwòye ẹni tí ń sọ ìtàn hàn, dípò ojú ìwòye ẹni tí wọ́n ń tọ̀ lọ.
lexical_decisions:
- source_word: ἐξῆλθον ἐκ
  choice: jáde kúrò ní
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n jáde láti inú ibi kan tí a dá mọ̀; “jáde kúrò ní” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣíkiri láti inú ìlú náà.
- source_word: τῆς πόλεως
  choice: ìlú náà
  rationale: πόλις lè jẹ́ ìlú ńlá tàbí ìlú kékeré; “ìlú” kò fi ìwọ̀n rẹ̀ múlẹ̀, “náà” sì ń pa àtẹnumọ́ àpilẹ̀kọ Gíríìkì mọ́.
- source_word: ἤρχοντο
  choice: ń bọ̀ wá
  rationale: Fíìbù aláìpé náà ń tọ́ka sí ìṣe tí ó ń lọ lọ́wọ́ ní àkókò àtijọ́. “ń bọ̀ wá” pa ìtẹ̀síwájú ìṣe àti ìtọ́sọ́nà sí ẹni tí wọ́n ń tọ̀ lọ mọ́.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: πρός pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ìṣíkiri sí ọ̀dọ̀ ènìyàn; “sọ́dọ̀ rẹ̀” jẹ́ èdè Yorùbá àdánidá tí kò sì fi kún ohun tí orísun kò sọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó bójú mu, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àmì ohùn wà níbi tí ó bá yẹ; ìtẹ̀síwájú fíìbù aláìpé Gíríìkì ni a fi “ń” hàn.
