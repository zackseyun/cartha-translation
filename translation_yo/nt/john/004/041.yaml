  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: yo
  text: Àwọn ènìyàn púpọ̀ sí i gan-an sì gbàgbọ́ nítorí ọ̀rọ̀ rẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “àwọn ènìyàn púpọ̀ jù bẹ́ẹ̀ lọ sì gbàgbọ́.” Gíríìkì lo gbólóhùn àfiwé tí a mú lágbára.
    reason: lexical_alternative
  - marker: b
    text: Àbí, “nítorí ìhìn rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: àwọn ènìyàn púpọ̀ sí i gan-an
  rationale: Ọ̀rọ̀ yìí jẹ́ àfiwé tí πολλῷ mú lágbára. ‘Púpọ̀ sí i gan-an’ jẹ́ Yorùbá àdánidá tí ó fi hàn pé iye àwọn tó gbàgbọ́ pọ̀ ju ti ẹsẹ tó ṣáájú lọ.
- source_word: ἐπίστευσαν
  choice: gbàgbọ́
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀ Gíríìkì náà. A kò fi ohun tí wọn gbàgbọ́ sínú gbólóhùn náà, nítorí kò sí ohun tí a sọ ní tààrà lẹ́yìn ọ̀rọ̀-ìṣe náà nínú ẹsẹ yìí.
- source_word: διὰ
  choice: nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní accusative, διά níbí ń tọ́ka sí ìdí tàbí ohun tó fa ìgbàgbọ́ wọn; ‘nítorí’ sọ èyí ní Yorùbá tó ṣe kedere.
- source_word: λόγον
  choice: ọ̀rọ̀
  rationale: ‘Ọ̀rọ̀’ lè túmọ̀ sí ohun tí Jésù sọ, ó sì tún pa ìró àti ìlò λόγος mọ́ gẹ́gẹ́ bí ó ti rí nínú Ìhìn Rere Jòhánù. ‘Ìhìn’ jẹ́ àṣàyàn míì tó ṣeé ṣe.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Jésù gẹ́gẹ́ bí ọ̀rọ̀ tó yí ẹsẹ náà ká ṣe fi hàn; ‘rẹ̀’ ni ìtumọ̀ Yorùbá tààrà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ πιστεύω nínú ìtàn tó kan ìgbàlà
  choice: gbàgbọ́
  alternative: wá ní ìgbàgbọ́; fi ìgbàgbọ́ wọn sínú rẹ̀
  rationale: Gíríìkì sọ ní ṣókí pé wọn ‘gbàgbọ́,’ kò sì fi ohun tí wọ́n gbàgbọ́ lé e lẹ́yìn ní ẹsẹ yìí. Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí ní tààrà sínú ọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ Jòhánù fi Jésù hàn gẹ́gẹ́ bí ẹni tí wọ́n gbàgbọ́.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. ‘Sì’ pa ìsopọ̀ καί mọ́; ‘gan-an’ sì mú agbára πολλῷ πλείους jáde láì sọ ọ́ di líle tàbí àjèjì.
