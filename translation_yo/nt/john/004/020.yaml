id: JHN.4.20
reference: John 4:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: yo
  text: Àwọn baba wa jọ́sìn lórí òkè yìí,[a] ẹ̀yin sì ń sọ pé ní Jerúsálẹ́mù ni ibi tí a gbọ́dọ̀ jọ́sìn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn baba ńlá wa jọ́sìn lórí òkè yìí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ibi tí ó pọndandan láti jọ́sìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Àwọn baba wa
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì, ó sì pa ìtumọ̀ ìran àti ìdílé àwùjọ mọ́; “àwọn baba ńlá wa” jẹ́ àṣàyàn Yorùbá tí ó túbọ̀ mú ìtumọ̀ àwọn baba ìran hàn.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: ní orí òkè yìí
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ibi tí ìjọsìn ti ṣẹlẹ̀ lórí òkè.
- source_word: προσεκύνησαν / προσκυνεῖν
  choice: sìn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ọlá ìjọsìn fún Ọlọ́run; “sìn” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá ìjọsìn mu.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Arọ́pò-orúkọ náà hàn gbangba, ó sì ní agbára ìyàtọ̀ sí “àwọn baba wa”; “ẹ̀yin” pa ìyàtọ̀ yẹn mọ́ láìfi “àwọn Júù” kún un.
- source_word: ἐν Ἱεροσολύμοις
  choice: Jerúsálẹ́mù
  rationale: Pẹ̀lú àpólà “Jerúsálẹ́mù ni ibi,” Yorùbá fi ìlú náà síwájú gẹ́gẹ́ bí ibi pàtó láìní láti fi “ní” ṣáájú rẹ̀.
- source_word: ὁ τόπος
  choice: ibi
  rationale: Ìtumọ̀ tààrà ni, tí kò fi “ibi tó tọ́” kún ọ̀rọ̀ orísun.
- source_word: ὅπου
  choice: tí ... ti
  rationale: Ìkọ̀lé Yorùbá “ibi tí ... ti” ni ọ̀nà àdánidá láti so ibi pọ̀ mọ́ ìṣe.
- source_word: προσκυνεῖν δεῖ
  choice: ó yẹ kí ènìyàn ... sìn
  rationale: Ó mú dandan tàbí ojúṣe àpapọ̀ inú δεῖ jáde ní Yorùbá tó ṣe kedere, láìsọ ọ́ di àṣẹ sí ẹni kan pàtó.
- source_word: καὶ
  choice: sì
  rationale: “Sì” pa ìsopọ̀ alábàápín mọ́, ó sì jẹ́ kí ìyàtọ̀ láàárín “àwọn baba wa” àti “ẹ̀yin” hàn ní ti ẹ̀dá.
theological_decisions:
- issue: Bóyá kí a sọ ìyàtọ̀ ará Samáríà àti Júù ní gbangba ju bí Gíríìkì ṣe sọ ọ́ lọ
  choice: A fi ìyàtọ̀ náà sí inú “Àwọn baba wa ... ẹ̀yin sì sọ ...”
  alternative: “Àwọn baba wa ará Samáríà ... ṣùgbọ́n ẹ̀yin Júù sọ ...”
  rationale: Ọ̀rọ̀ Gíríìkì kò dárúkọ ará Samáríà tàbí Júù nínú ẹsẹ yìí; àfikún bẹ́ẹ̀ yóò túmọ̀ àyíká sínú ọ̀rọ̀ pàtó.
- issue: Bí a ṣe lè túmọ̀ dandan aláìní olùṣe pàtó nínú προσκυνεῖν δεῖ
  choice: “ibi tí ó yẹ kí ènìyàn ti sìn”
  alternative: “ibi tí ó pọndandan láti sìn”
  rationale: Àṣàyàn náà fi ìbéèrè nípa ibi ìjọsìn tó yẹ hàn gẹ́gẹ́ bí ẹ̀tọ́ àpapọ̀, kì í ṣe àṣẹ sí ẹnì kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìyàtọ̀ arọ́pò-orúkọ àti àìdájú ìtumọ̀ δεῖ mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
