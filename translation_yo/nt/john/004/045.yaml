translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘fi tayọ̀tayọ̀ gba á’ láti mú ìtumọ̀ ìgbàlejò rere jáde, ṣùgbọ́n a pa ‘gba á’ mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
