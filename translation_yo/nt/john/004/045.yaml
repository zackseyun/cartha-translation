id: JHN.4.45
reference: John 4:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: yo
  text: Nítorí náà, nígbà tí ó dé Gálílì, àwọn ará Gálílì fi inú rere gba á [a], wọ́n ti rí gbogbo ohun tí ó ṣe ní Jerusalẹmu ní àjọ̀dún náà [b], nítorí àwọn pẹ̀lú ti lọ sí àjọ̀dún náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gba á.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ẹni kan tàbí ìgbàlejò rere; nínú àyíká yìí, ó dà bí ìgbàlejò rere.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àjọ ayẹyẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àjọ̀dún ẹ̀sìn; àyíká ọ̀rọ̀ fi hàn pé ó jẹ́ àjọ̀dún ìrìn-àjò mímọ́ kan ní Jerusalẹmu.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ó pa agbára ìtẹ̀síwájú àti ìyọrísí οὖν mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: ó dé Gálílì
  rationale: ‘Dé’ sọ ìrìn dé inú agbègbè náà ní Yorùbá àdánidá láìsọ ọ̀rọ̀ náà di líle.
- source_word: ἐδέξαντο αὐτὸν
  choice: fi tayọ̀tayọ̀ gba á
  rationale: Ó fi hàn pé ìgbàlejò rere ni, kì í ṣe gbígba lásán; àlàyé ìtumọ̀ mìíràn wà ní àlàyé ìsàlẹ̀.
- source_word: οἱ Γαλιλαῖοι
  choice: àwọn ará Gálílì
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún àwọn ènìyàn agbègbè kan.
- source_word: πάντα ἑωρακότες ὅσα
  choice: nítorí wọ́n ti rí gbogbo ohun tí
  rationale: Àpólà náà fúnni ní ìpìlẹ̀ ìdí fún bí wọ́n ṣe gbà á; ‘ti rí’ tún fi hàn pé ìríran náà ti ṣẹlẹ̀ ṣáájú.
- source_word: ἐποίησεν
  choice: ó ṣe
  rationale: Pẹ̀lú ‘wọ́n ti rí,’ ìbáṣepọ̀ àkókò ṣáájú ìgbàlejò náà ṣe kedere láìfi àmì àsìkò àfikún tí Yorùbá kò nílò sí i.
- source_word: ἐν Ἱεροσολύμοις
  choice: ní Jerusalẹmu
  rationale: Ìtumọ̀ ibi tó ṣe tààrà, pẹ̀lú orúkọ ìlú tó wọ́pọ̀ ní Yorùbá.
- source_word: ἐν τῇ ἑορτῇ
  choice: ní àkókò àjọ̀dún náà
  rationale: Ó túmọ̀ ipa àkókò-ibi náà lọ́nà àdánidá, ó sì tọ́ka sí àjọ̀dún ẹ̀sìn tí àyíká ọ̀rọ̀ ti mẹ́nu kàn.
- source_word: καὶ αὐτοὶ γὰρ
  choice: àwọn náà pẹ̀lú sì
  rationale: ‘Àwọn náà pẹ̀lú’ pa ìtẹnumọ́ àti ìfikún αὐτοὶ mọ́; ìdí tí γάρ ń fúnni ti hàn tẹ́lẹ̀ nínú ‘nítorí’.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: ti lọ sí àjọ̀dún náà
  rationale: ‘Ti lọ’ jẹ́ kó ṣe kedere pé lílọ sí àjọ̀dún náà ti ṣẹlẹ̀ ṣáájú ìgbà tí wọ́n gba Jesu.
