id: JHN.4.11
reference: John 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: yo
  text: Obìnrin náà sọ fún un pé, “Olúwa[a], ìwọ kò ní ohun tí o fi máa pọn omi, kànga náà sì jìn. Níbo wá ni ìwọ ti ń rí omi ìyè[b] náà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε jẹ́ ọ̀nà ìpè pẹ̀lú ọ̀wọ̀; ó lè túmọ̀ sí “Olúwa” tàbí “Ọ̀gá,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: alternative_reading
  - marker: b
    text: Tàbí “omi tí ń ṣàn,” ìyẹn omi tuntun tí ń ṣàn, tí kì í ṣe omi tí ó dúró. Ọ̀rọ̀ “omi ìyè” tún pa ìtumọ̀ jíjinlẹ̀ tí Jésù ní lọ́kàn mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní àkókò ìsinsìnyí, lílo àkókò tí ó ti kọjá bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: ἡ γυνή
  choice: Obìnrin náà
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí obìnrin ará Samáríà náà, kì í ṣe aya.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ìtumọ̀ pàtàkì κύριος mọ́, ṣùgbọ́n àkọ́lé ọ̀wọ̀ bí “Ọ̀gá” tún ṣeé ṣe ní àyíká ìjíròrò yìí, a sì fi í sínú àlàyé ìsàlẹ̀.
- source_word: ἄντλημα
  choice: ohun tí o fi máa pọn omi
  rationale: Ó túmọ̀ sí ohun èlò fún pípọn omi. Gbólóhùn yìí ṣe kedere ní Yorùbá láì fi irú ohun èlò kan pàtó kún orísun.
- source_word: τὸ φρέαρ
  choice: kànga náà
  rationale: “Kànga” ni ọ̀rọ̀ Yorùbá tó bá kànga tí a ti ń pọn omi mu ní àyíká yìí.
- source_word: βαθύ
  choice: jìn
  rationale: Ó sọ ìjìnlẹ̀ kànga náà ní tààrà, láì fi “púpọ̀” kún ohun tí orísun kò sọ.
- source_word: πόθεν οὖν ἔχεις
  choice: Níbo wá ni ìwọ ti rí
  rationale: “Níbo” béèrè orísun omi náà, “wá” sì fi ìyọrísí ọ̀rọ̀ tó ṣáájú hàn lọ́nà àdánidá.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: omi ìyè náà
  rationale: 'Ó pa ìtumọ̀ méjì tí Jòhánù ń lò mọ́: ó lè jẹ́ omi tuntun tí ń ṣàn, ó sì tún ní ìtumọ̀ ẹ̀mí tó jinlẹ̀.'
- source_word: οὔτε … καὶ
  choice: kò ní …, … sì
  rationale: Nínú Gíríìkì, οὔτε kọ́ gbólóhùn àkọ́kọ́, καὶ sì so ọ̀rọ̀ nípa ìjìnlẹ̀ kànga mọ́ ọn. Èyí kò túmọ̀ sí pé kànga náà kò jìn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ obìnrin náà sí Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìtumọ̀ ẹ̀sìn tó lè wà nínú ọ̀rọ̀ náà mọ́; “Ọ̀gá” sì lè jẹ́ àkọ́lé ọ̀wọ̀ lásán ní ìpele ìjíròrò yìí. Àlàyé ìsàlẹ̀ jẹ́ kí àìdánilójú náà dúró.
- issue: Bí a ṣe túmọ̀ ὕδωρ τὸ ζῶν láì pa ìtumọ̀ méjì rẹ̀ run
  choice: omi ìyè
  alternative: omi tí ń ṣàn
  rationale: “Omi ìyè” pa àwòrán àti ìtumọ̀ ẹ̀mí inú ìtàn Jòhánù mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ ìtumọ̀ ojoojúmọ́ rẹ̀ gẹ́gẹ́ bí omi tuntun tí ń ṣàn.
translation_notes:
  register: 'A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Ohun tí o fi máa pọn omi” jẹ́ àlàyé àdánidá dípò ọ̀rọ̀ ohun èlò tó lè yàtọ̀ láti agbègbè kan sí òmíràn. A tún ṣàtúnṣe ìbáṣepọ̀ οὔτε … καὶ gẹ́gẹ́ bí Gíríìkì: obìnrin náà sọ pé Jésù kò ní ohun ìpọnmi, ó sì sọ pé kànga náà jìn.'
