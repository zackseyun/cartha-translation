  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ àkọ́kọ́ ẹsẹ̀ náà mọ́ dáadáa: rírán, kíkórè, iṣẹ́ àṣekára àwọn ẹlòmíràn, àti wíwọ inú iṣẹ́ wọn. Síbẹ̀, “Èmi rán yín” kò fi ìṣe tí ó ti ṣẹlẹ̀ hàn kedere tó, àti “ṣiṣẹ́ kára lé lórí” kì í bá ìbáṣepọ̀ ‘làálàá fún ohun kan’ mu dáadáa nínú àyíká yìí.'
