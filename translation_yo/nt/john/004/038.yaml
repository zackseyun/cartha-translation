  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: yo
  text: Èmi ni mo rán yín lọ láti ká ohun tí ẹ̀yin kò ṣiṣẹ́ kára fún náà.[a] Àwọn ẹlòmíràn ti ṣiṣẹ́ kára, ẹ̀yin sì ti wọ inú iṣẹ́ àṣekára wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ṣe ìkórè.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ẹ̀yin sì ti wọ inú làálàá wọn.” Ó tún lè túmọ̀ sí, “ẹ̀yin sì ti wọ inú èso iṣẹ́ wọn” tàbí “ẹ̀yin sì ti ní ìpín nínú iṣẹ́ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: rán yín lọ
  rationale: Ó ṣàfihàn ìṣe rírán ní àkókò tí ó ti kọjá, ó sì pa agbára iṣẹ́ tí a rán wọn sí mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: θερίζειν
  choice: láti ká
  rationale: ‘Ká’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún kíkó ohun ọ̀gbìn nígbà ìkórè, ó sì pa àkàwé iṣẹ́ oko inú àyíká ọ̀rọ̀ náà mọ́.
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: ohun tí ẹ̀yin kò ṣiṣẹ́ kára lé lórí
  rationale: Ó túmọ̀ àrọ́pò-orúkọ náà ní ti ẹ̀dá, ó sì fi hàn pé wọn kò ṣe iṣẹ́ àṣekára tí ó ṣáájú ìkórè náà.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: àwọn ẹlòmíràn ti ṣiṣẹ́ kára
  rationale: ‘Ti ṣiṣẹ́ kára’ mú iṣẹ́ tí a ti ṣe tẹ́lẹ̀, tí àbájáde rẹ̀ sì ṣì wúlò nísinsìnyí, jáde lọ́nà Yorùbá àdánidá.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: ẹ̀yin sì ti wọ inú iṣẹ́ wọn
  rationale: Ó tẹ̀lé àwòrán Gíríìkì pé wọ́n ‘wọ inú’ iṣẹ́ àwọn ẹlòmíràn, láì dín un kù sí èso iṣẹ́ náà nìkan tàbí ṣàlàyé rẹ̀ ju bí orísun ṣe sọ lọ.
theological_decisions:
- issue: Àwọn wo ni ‘àwọn ẹlòmíràn’ ń tọ́ka sí?
  choice: A fi í sílẹ̀ ní gbangba gẹ́gẹ́ bí ‘àwọn ẹlòmíràn.’
  alternative: Kí a sọ pé àwọn wòlíì, Jòhánù Onítẹ̀bọmi, Jésù, tàbí àwọn ẹlẹ́rìí àkọ́kọ́ ni.
  rationale: Ẹsẹ náà kò dá àwọn ẹni náà mọ̀ ní pàtó; fífi ìtumọ̀ rẹ̀ sílẹ̀ ní gbangba pa àìṣe kedere gidi inú orísun mọ́.
- issue: Ìtumọ̀ ‘wọ inú iṣẹ́ wọn’
  choice: A pa àwòrán pé àwọn ọmọ-ẹ̀yìn wọ inú iṣẹ́ tí àwọn ẹlòmíràn ti ṣe mọ́.
  alternative: ‘Ẹ ti wọ inú èso iṣẹ́ wọn’ tàbí ‘ẹ ti ní ìpín nínú iṣẹ́ wọn.’
  rationale: Gíríìkì sọ ‘wọ inú làálàá wọn’ ní tààrà; àwọn àṣàyàn míì ṣe àlàyé ìtumọ̀ rẹ̀ síwájú ju ọ̀rọ̀ orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. ‘Ká’ pa àkàwé ìkórè mọ́; ‘ṣiṣẹ́ kára’ jẹ́ ohun tí òǹkàwé òde òní lóye ju ‘làálàá’ lọ nínú ọ̀rọ̀ pàtàkì, nígbà tí àlàyé ìtumọ̀ tààrà wà ní àlàyé ìsàlẹ̀.
