  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: yo
  text: Ó sì ní láti gba Samáríà kọjá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó jẹ́ dandan fún un láti gba Samáríà kọjá.” Gíríìkì fi ìdandan hàn, ṣùgbọ́n kò sọ ìdí pàtó rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: ní láti
  rationale: Ọ̀rọ̀ yìí fi àìgbọ́dọ̀máṣe hàn nínú ìtàn ohun tó ti ṣẹlẹ̀. “Ní láti” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun náà pọndandan, láì sọ ìdí pàtó tí ó fi rí bẹ́ẹ̀.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú ju pé ó ń fi ìtakora líle hàn. “Sì” jẹ́ àsopọ̀ fẹ́rẹ́fẹ́ tó bá ìlò náà mu.
- source_word: αὐτὸν
  choice: Ó
  rationale: Bí ó tilẹ̀ jẹ́ pé αὐτόν jẹ́ ọ̀rọ̀ arọ́pò-orúkọ ní accusative gẹ́gẹ́ bí olùṣe infinitive nínú Gíríìkì, Yorùbá àdánidá ń lo kókó gbólóhùn “Ó” pẹ̀lú ọ̀rọ̀-ìṣe tó ní àkókò.
- source_word: διέρχεσθαι
  choice: gba àárín … kọjá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti la agbègbè kan kọjá. Àkójọpọ̀ ọ̀rọ̀ Yorùbá “gba àárín … kọjá” sọ ìrìnàjò la ibì kan kọjá ní kedere.
- source_word: διὰ τῆς Σαμαρείας
  choice: gba àárín Samáríà kọjá
  rationale: διά pẹ̀lú genitive fi ìrìnàjò la inú ibi kan hàn. “Samáríà” nìkan tó láti jẹ́ kí orúkọ agbègbè náà yé òǹkàwé; kò pọndandan láti fi “agbègbè” kún un.
theological_decisions:
- issue: Agbára àìgbọ́dọ̀máṣe inú ἔδει
  choice: A fi hàn pé ó pọndandan fún un láti kọjá níbẹ̀, ṣùgbọ́n a kò sọ ìdí tí ó fi pọndandan.
  alternative: Ó lè jẹ́ nítorí ọ̀nà ilẹ̀ náà rọrùn jù, tàbí nítorí ète Ọlọ́run nínú iṣẹ́ Jesu.
  rationale: Gíríìkì sọ pé ó pọndandan, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé ìpìlẹ̀ àìgbọ́dọ̀máṣe náà. Ìtumọ̀ náà pa àìdájú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá tó bójú mu, tó ní ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; “Samáríà” tẹ̀ lé ìpè orúkọ ibi tí ó wọ́pọ̀ nínú Yorùbá.
