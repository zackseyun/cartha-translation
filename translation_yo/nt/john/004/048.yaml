id: JHN.4.48
reference: John 4:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: yo
  text: Nítorí náà, Jésù sọ fún un pé,[a] “Bí ẹ̀yin kò bá rí àwọn àmì àti àwọn iṣẹ́ ìyanu, dájúdájú ẹ̀yin kì yóò gbàgbọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ọ̀rọ̀-ìṣe tí a túmọ̀ sí “rí” àti “gbàgbọ́” jẹ́ ọ̀pọ̀ nínú èdè Gíríìkì. Nítorí náà, ó ṣeé ṣe kí ọ̀rọ̀ Jésù kọjá ọkùnrin náà, kí ó sì kan àwọn ẹlòmíràn pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú àti ìyọrísí ọ̀rọ̀ tó ṣáájú hàn ní ọ̀nà àdánidá.
- source_word: πρὸς αὐτόν
  choice: sọ fún un
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ọ̀rọ̀ tí a sọ sí ẹnì kan hàn, ó sì pa ẹyọ ẹni inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Ἐὰν μὴ
  choice: Bí ... kò bá
  rationale: Èyí ni ìtumọ̀ àdánidá ti gbólóhùn oníṣ şart ìkọ̀sílẹ̀ náà ní Yorùbá.
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: '“Àmì” pa ìtumọ̀ pàtàkì ọ̀rọ̀ náà nínú Jòhánù mọ́: iṣẹ́ náà ń tọ́ka sí ohun tó ju ara rẹ̀ lọ.'
- source_word: τέρατα
  choice: iṣẹ́ ìyanu
  rationale: Ó sọ àwọn ìṣẹ̀lẹ̀ àrà ọ̀tọ̀ tó ń fa ìyàlẹ́nu ní èdè Yorùbá tí ó ṣe kedere, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn kan.
- source_word: ἴδητε
  choice: ẹ̀yin ... rí
  rationale: Fífì “ẹ̀yin” hàn ní kedere pa nọ́ńbà ọ̀pọ̀ ti ọ̀rọ̀-ìṣe Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé Jésù ń bá ọkùnrin kan sọ̀rọ̀ ní ìbẹ̀rẹ̀.
- source_word: οὐ μὴ πιστεύσητε
  choice: dájúdájú ẹ̀yin kì yóò gbàgbọ́
  rationale: “Dájúdájú” àti “kì yóò” jọ pa agbára ìkọ̀sílẹ̀ οὐ μή mọ́ láì yí i sí “láéláé,” èyí tí ó lè lágbára ju orísun lọ.
- source_word: πιστεύσητε
  choice: gbàgbọ́
  rationale: “Gbàgbọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tí kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn àfikún sí πιστεύω nínú Jòhánù.
theological_decisions:
- issue: Nọ́ńbà àti ààlà àwọn tí Jésù ń bá sọ̀rọ̀
  choice: A fi ẹni ẹyọ hàn nínú àkọ́sọ (“fún un”), ṣùgbọ́n a fi ọ̀pọ̀ hàn nínú ọ̀rọ̀ Jésù pẹ̀lú “ẹ̀yin.”
  alternative: Kí a lo ẹni ẹyọ nínú gbogbo ẹsẹ̀ náà, tàbí kí a fi ọ̀rọ̀ ìtumọ̀ bí “ẹ̀yin ènìyàn” kún un.
  rationale: πρὸς αὐτόν tọ́ka sí ọkùnrin kan, ṣùgbọ́n ἴδητε àti πιστεύσητε jẹ́ ọ̀pọ̀. Ìtumọ̀ yìí pa ìfarapa náà mọ́, kò sì pinnu bóyá Jésù ń tọ́ka sí àwọn tó wà níbẹ̀ tàbí sí ẹgbẹ́ ènìyàn kan tó gbòòrò.
translation_notes:
  register: Yorùbá àมาตรฐาน pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “ẹ̀yin” láti fi ọ̀pọ̀ inú Gíríìkì hàn ní tààrà.
