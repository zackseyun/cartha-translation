source:
  edition: SBLGNT
  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: yo
  text: Obìnrin kan láti Samáríà wá láti fa omi. Jésù sọ fún un pé,[a] “Fún mi ní omi kí n mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, “Obìnrin kan láti Samáríà ń bọ̀ … Jésù ń sọ fún un pé”; Gíríìkì lo ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí láti sọ ìṣẹ̀lẹ̀ inú ìtàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: wá
  rationale: Ọ̀rọ̀ ìṣe Gíríìkì jẹ́ historical present, ṣùgbọ́n “wá” bá ìtàn àsìkò tí ó ti kọjá mu ní Yorùbá, ó sì jẹ́ àdánidá.
- source_word: γυνὴ
  choice: obìnrin kan
  rationale: Ní àyíká yìí, ó tọ́ka sí obìnrin tí a kò tíì dá mọ̀, kì í ṣe aya ní pàtó.
- source_word: ἐκ τῆς Σαμαρείας
  choice: láti Samáríà
  rationale: Ó pa ìtumọ̀ ibi tí obìnrin náà ti wá mọ́ láì fi kún un pé ó jẹ́ ará Samáríà ní kedere.
- source_word: ἀντλῆσαι ὕδωρ
  choice: láti pọn omi
  rationale: “Pọn omi” ni gbólóhùn Yorùbá àdánidá fún mímú omi jáde láti inú kànga; “láti” fi ète infinitive hàn.
- source_word: λέγει αὐτῇ
  choice: sọ fún un
  rationale: Bí ó tilẹ̀ jẹ́ historical present ní Gíríìkì, ìtàn Yorùbá máa ń lo ọ̀nà yìí ní àdánidá fún ohun tí ó ṣẹlẹ̀.
- source_word: Δός μοι πεῖν
  choice: Fún mi ní omi mu
  rationale: 'Èyí jẹ́ ìbéèrè Yorùbá tí ó ṣe kedere, tó sì bá àṣẹ Gíríìkì àti infinitive rẹ̀ mu: kí obìnrin náà fún un ní omi kí ó lè mu.'
theological_decisions:
- issue: Ìtọ́kasí Samáríà
  choice: “obìnrin kan láti Samáríà”
  alternative: “obìnrin ará Samáríà kan” tàbí “obìnrin kan láti ìlú Samáríà”
  rationale: Ọ̀rọ̀ Gíríìkì sọ ibi tí obìnrin náà ti wá, kò sì pe e ní ará Samáríà ní tààràtà nínú ẹsẹ yìí. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́ láì fi ẹ̀yà, ẹ̀sìn, tàbí ìlú kan pàtó kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “pọn omi” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá nípa kànga, a sì pa historical presents mọ́ nínú àlàyé ìsàlẹ̀ dípò kí wọ́n mú kí ìtàn àkọ́kọ́ le láti kà.
