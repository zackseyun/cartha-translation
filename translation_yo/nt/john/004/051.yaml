id: JHN.4.51
reference: John 4:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: yo
  text: Nígbà tí ó ti ń sọ̀kalẹ̀ lọ, àwọn ẹrú rẹ̀ pàdé rẹ̀, wọ́n sì sọ pé ọmọ rẹ̀ wà láàyè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọkùnrin rẹ̀”; ọ̀rọ̀ Gíríìkì náà, pais, lè túmọ̀ sí “ọmọ,” “ọmọkùnrin,” tàbí, ní àwọn àyíká kan, “ìránṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ti ń
  rationale: Ìsọ̀rọ̀ yìí fi hàn pé ìrìnàjò sọ̀kalẹ̀ náà ti ń lọ lọ́wọ́ nígbà tí wọ́n pàdé rẹ̀; ìṣètò ‘Bí ó ti ń…’ jẹ́ ọ̀nà àdánidá láti sọ ìṣe tí ó ti ń lọ ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó ń tẹ ìtàn náà síwájú láìfi ìtakora líle kún un.
- source_word: καταβαίνοντος
  choice: ń sọ̀kalẹ̀ lọ
  rationale: Ó jẹ́ participle ìsinsìnyí nínú genitive absolute, ó sì tọ́ka sí ìṣe tí ó ń lọ ní àkókò ìpàdé náà. ‘Sọ̀kalẹ̀ lọ’ bá ìrìnàjò láti Kánà sí Kapanaumu mu ní èdè àdánidá.
- source_word: δοῦλοι
  choice: àwọn ẹrú
  rationale: Nínú àyíká ilé ọkùnrin aláṣẹ náà, ọ̀rọ̀ náà tọ́ka sí àwọn ènìyàn tí ó ní lábẹ́ àṣẹ rẹ̀; ‘ẹrú’ pa òtítọ́ ipò àwùjọ tí δοῦλος ní mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: ὑπήντησαν
  choice: pàdé
  rationale: Ó sọ ìpàdé wọn pẹ̀lú rẹ̀ ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: λέγοντες
  choice: wọ́n sì sọ pé
  rationale: Ìtumọ̀ yìí sọ attendant participle náà di gbólóhùn Yorùbá tí ó ṣàn dáadáa, láìfi ìtumọ̀ tuntun kún un.
- source_word: παῖς
  choice: ọmọ
  rationale: ‘Ọmọ’ lè pa ìtumọ̀ ọmọ kékeré tàbí ọmọ ẹni mọ́ láìfipá sọ ọjọ́-orí tàbí akọ-n-bábo; àlàyé ìsàlẹ̀ fi ààyè sílẹ̀ fún ìtumọ̀ ‘ọmọkùnrin’ tàbí ‘ìránṣẹ́’ ní àwọn àyíká mìíràn.
- source_word: ζῇ
  choice: wà láàyè
  rationale: Ìsinsìnyí Gíríìkì náà túmọ̀ sí ‘ó ń yè/ó wà láàyè.’ ‘Wà láàyè’ jẹ́ ìròyìn àdánidá ní Yorùbá, ó sì yẹra fún fífi ‘ó ti yá’ tí kò sí ní tààràtà kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ohun tí παῖς tọ́ka sí nínú ìtàn ìwòsàn náà
  choice: ọmọ rẹ̀
  alternative: ọmọkùnrin rẹ̀; ìránṣẹ́ rẹ̀
  rationale: Παῖς ní ìtumọ̀ gbòòrò. Àyíká ìtàn náà ń tọ́ka sí ọmọ ọkùnrin aláṣẹ náà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò lo υἱός. ‘Ọmọ’ pa ìbátan ìdílé mọ́ láìdín ìtumọ̀ ọ̀rọ̀ náà kù ju bó ṣe yẹ lọ; àlàyé ìsàlẹ̀ sì pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye. A lo ‘ẹrú’ láti pa ipò àwùjọ δοῦλος mọ́; a sì lo ìṣètò ‘Bí ó ti ń…’ fún genitive absolute ní ọ̀nà àdánidá.
