id: JHN.4.10
reference: John 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: yo
  text: Jésù dá a lóhùn, ó sì wí fún un pé, “Ìbá ṣe pé o mọ ẹ̀bùn Ọlọ́run, tí o sì mọ ẹni tí ó ń sọ fún ọ pé, ‘Fún mi ní omi láti mu,’ ìwọ ìbá ti béèrè lọ́wọ́ rẹ̀, òun ìbá sì ti fún ọ ní omi ìyè[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “omi tí ń ṣàn.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí omi tó ń ṣàn, ṣùgbọ́n “omi ìyè” pa ìtumọ̀ méjèèjì tí ọ̀rọ̀ Jésù ní níhìn-ín mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῇ
  choice: dá a lóhùn, ó sì wí fún un pé
  rationale: Ó pa àpapọ̀ ọ̀rọ̀ Gíríìkì ‘dáhùn, ó sì sọ’ mọ́ ní Yorùbá àdánidá, ó sì fi hàn pé obìnrin náà ni Jésù ń bá sọ̀rọ̀.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: ẹ̀bùn Ọlọ́run
  rationale: ‘Ẹ̀bùn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a fi fúnni lọ́fẹ̀ẹ́; ìsọ̀rí oníni náà pa ìtumọ̀ ‘ẹ̀bùn Ọlọ́run’ mọ́ láì pinnu bóyá Ọlọ́run ni olùfúnni tàbí bí ẹ̀bùn náà ṣe jẹ́ tirẹ̀.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: ẹni tí ó ń sọ fún ọ
  rationale: Ó mú ìdánimọ̀ ẹni tó ń sọ̀rọ̀ yọ, ‘ń sọ’ sì ṣàfihàn ìṣe tí ó ń lọ lọ́wọ́ nínú participle λέγων.
- source_word: Δός μοι πεῖν
  choice: Fún mi ní omi mu
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti béèrè omi mímu, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ᾔτησας … ἔδωκεν ἄν
  choice: ìwọ ìbá ti béèrè … òun ìbá sì ti fún ọ
  rationale: Àwọn ìṣe ‘ìbá ti’ fi ipò àròsọ tí kò ṣẹlẹ̀ hàn, gẹ́gẹ́ bí ètò gírámà Gíríìkì ṣe ń tọ́ka sí.
- source_word: ὕδωρ ζῶν
  choice: omi ìyè
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá, ọ̀wọ̀, ó sì pa agbára ìtumọ̀ ẹ̀mí mọ́; àlàyé ìsàlẹ̀ ojú ìwé tún tọ́ka sí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí omi tí ń ṣàn.
theological_decisions:
- issue: Mímú ìtumọ̀ gidi àti ìtumọ̀ ẹ̀mí inú ὕδωρ ζῶν dúró papọ̀
  choice: omi ìyè
  alternative: omi tí ń ṣàn; omi tútù
  rationale: Jésù lo gbólóhùn kan tí a lè kọ́kọ́ gbọ́ bí omi gidi ṣùgbọ́n tí ó tún ń tọ́ka sí òtítọ́ ẹ̀mí tó jinlẹ̀. ‘Omi ìyè’ àti àlàyé [a] pa ìforígbárí ìtumọ̀ yìí mọ́ láì yanju rẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní. A pa àtúnṣe ọ̀rọ̀ Gíríìkì ‘dáhùn, ó sì wí’ mọ́ láì jẹ́ kí gbolohun di líle.
