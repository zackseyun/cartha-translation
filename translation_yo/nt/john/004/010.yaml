  source_fidelity: 'Ìtumọ̀ náà pa ètò ìbéèrè àròsọ ti Gíríìkì mọ́: ìmọ̀ ẹ̀bùn Ọlọ́run àti ìdánimọ̀ ẹni tó ń sọ̀rọ̀ ni ìpìlẹ̀, ìbéèrè lọ́wọ́ Jésù àti fífi omi ìyè fún un sì ni àbájáde. ‘Omi ìyè’ dáa, ó sì pa ìtumọ̀ méjèèjì mọ́.'
