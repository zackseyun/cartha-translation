  to: Jésù dá a lóhùn, ó sì wí fún un pé, “Ìbá ṣe pé o mọ ẹ̀bùn Ọlọ́run, tí o sì mọ ẹni tí ó ń sọ fún ọ pé, ‘Fún mi ní omi láti mu,’ ìwọ ìbá ti béèrè lọ́wọ́ rẹ̀, òun ìbá sì ti fún ọ ní omi ìyè[a].”
