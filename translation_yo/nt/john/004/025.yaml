  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: yo
  text: Obìnrin náà sọ fún un pé, “Mo mọ̀ pé Mèsáyà ń bọ̀, ẹni tí a ń pè ní Kristi[a]. Nígbà tí òun bá dé, yóò sọ ohun gbogbo fún wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mèsáyà” jẹ́ ọ̀rọ̀ oyè láti èdè Semítíkì; “Kristi” ni ọ̀rọ̀ Gíríìkì tí Jòhánù lò láti ṣàlàyé rẹ̀. Àwọn méjèèjì túmọ̀ sí “Ẹni tí a fi òróró yàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní àsìkò ìsinsìnyí nínú ìtàn, lílo “sọ” ní àsìkò tí ó ti kọjá jẹ́ èdè Yorùbá àdánidá fún ìtàn yìí.
- source_word: γυνή
  choice: Obìnrin náà
  rationale: Nínú àyíká ọ̀rọ̀, ó ń tọ́ka sí obìnrin ará Samáríà tí a ti mẹ́nu kàn.
- source_word: Οἶδα
  choice: Mo mọ̀
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Μεσσίας
  choice: Mèsáyà
  rationale: A ṣe àkọsílẹ̀ orúkọ oyè Semítíkì náà ní ìrísí Yorùbá láti pa àyíká ìrètí Mèsáyà mọ́.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Àsìkò ìsinsìnyí níhìn-ín ń tọ́ka sí ọjọ́ iwájú; “ń bọ̀” tún pa ìmọ̀lára pé ìbọ̀ rẹ̀ sún mọ́lé mọ́.
- source_word: ὁ λεγόμενος χριστός
  choice: ẹni tí a ń pè ní Kristi
  rationale: Èyí pa ìyàtọ̀ tó wà láàárín ọ̀rọ̀ Semítíkì Μεσσίας àti àlàyé Gíríìkì χριστός mọ́, láìsọ wọ́n di ọ̀rọ̀ kan náà nínú àyọkà.
- source_word: ὅταν ἔλθῃ
  choice: Nígbà tí ... bá dé
  rationale: Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun ọjọ́ iwájú tí a ń retí.
- source_word: ἐκεῖνος
  choice: ẹni náà
  rationale: “Ẹni náà” pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì náà mọ́ ju lílo “ó” lásán lọ.
- source_word: ἀναγγελεῖ
  choice: yóò sọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí mímú ohun kan di mímọ̀ tàbí ṣíṣe àlàyé rẹ̀; “yóò sọ” ṣe kedere, ó sì bá Yorùbá mu.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Èyí fi ẹni tí a ó sọ ọ̀rọ̀ náà fún hàn ní kedere.
- source_word: ἅπαντα
  choice: ohun gbogbo
  rationale: “Ohun gbogbo” jẹ́ ìtumọ̀ Yorùbá àdánidá tí ó pa agbára àpapọ̀ ἅπαντα mọ́.
theological_decisions:
- issue: Ìtumọ̀ χριστός nínú gbólóhùn àlàyé ὁ λεγόμενος χριστός
  choice: Pa “Kristi” mọ́ lẹ́yìn “Mèsáyà,” kí àlàyé ìbílẹ̀ Gíríìkì náà lè hàn.
  alternative: Túmọ̀ àwọn méjèèjì sí “Mèsáyà,” kí a sì ṣàlàyé ìyàtọ̀ wọn nínú àlàyé ìsàlẹ̀.
  rationale: Àkọọ́lẹ̀ Gíríìkì mọ̀ọ́mọ̀ lo Μεσσίας, lẹ́yìn náà ó ṣàlàyé rẹ̀ pẹ̀lú χριστός. Pípa “Mèsáyà” àti “Kristi” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ méjì ń fi ìbáṣepọ̀ àlàyé yẹn hàn, láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “ẹni náà” láti pa ìtẹnumọ́ ἐκεῖνος mọ́.
