source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: yo
  text: Nítorí náà, ó dé ìlú[a] kan ní Samáríà tí a ń pè ní Síkárì, nítòsí apá ilẹ̀[b] tí Jákọ́bù ti fi fún Jósẹ́fù, ọmọ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìlú ńlá” tàbí “ìlú kékeré,” ní ìbámu pẹ̀lú àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “oko” tàbí “ohun ìní ilẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí oko, ohun ìní, tàbí apá ilẹ̀ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: ó dé
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì wà ní àsìkò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí inú ìtàn; lílo àsìkò tí ó ti kọjá ní Yorùbá mú kí ìtàn náà ṣe kedere, ó sì bá ọ̀nà tí Yorùbá fi ń sọ ìṣẹ̀lẹ̀ tẹ̀ lé ara wọn mu.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì lè fi ìtẹ̀síwájú tàbí àbájáde hàn.
- source_word: πόλιν
  choice: ìlú
  rationale: “Ìlú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè tọ́ka sí ìlú kékeré tàbí ìlú ńlá, bí πόλις ti ṣe lè ní ìtumọ̀ méjèèjì.
- source_word: τῆς Σαμαρείας
  choice: ní Samáríà
  rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì lò ẹ̀yà ọ̀rọ̀ oníjẹ́nítífù, “ní Samáríà” fi ibi tí ìlú náà wà hàn ní Yorùbá àdánidá.
- source_word: λεγομένην Συχὰρ
  choice: tí a ń pè ní Síkárì
  rationale: Ó tú ọ̀rọ̀ aláìṣe Gíríìkì náà sí Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ mìíràn kún un.
- source_word: πλησίον
  choice: nítòsí
  rationale: Ó fi ìsúnmọ́ ibi hàn ní ṣókí àti ní èdè àdánidá.
- source_word: χωρίου
  choice: ẹ̀ka ilẹ̀
  rationale: “Ẹ̀ka ilẹ̀” túmọ̀ sí ilẹ̀ tí a yà sọ́tọ̀ gẹ́gẹ́ bí ohun ìní, láìdín ìtumọ̀ rẹ̀ kù sí oko tí a ń ro nìkan.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: tí Jákọ́bù ti fi fún
  rationale: Àmì “ti” fi hàn pé fífi ilẹ̀ náà fún Jósẹ́fù ti ṣẹlẹ̀ ṣáájú ìṣẹ̀lẹ̀ pàtàkì inú ìtàn yìí.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: Jósẹ́fù ọmọ rẹ̀
  rationale: Ó pa ẹni tí a fún ní ilẹ̀ náà àti àlàyé pé ọmọ Jákọ́bù ni mọ́, ní ọ̀nà Yorùbá tí ó rọrùn.
