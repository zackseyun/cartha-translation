translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó ti yẹ, a sì ṣe àfọwọkọ àwọn orúkọ bí Síkárì, Samáríà, Jákọ́bù, àti Jósẹ́fù ní ìbámu pẹ̀lú ìró Yorùbá.
