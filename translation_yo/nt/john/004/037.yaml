  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: yo
  text: 'Nítorí nínú èyí ni ọ̀rọ̀ náà jẹ́ òtítọ́: “Ẹni kan ni ó ń fúnrúgbìn, ẹlòmíràn sì ni ó ń kórè.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Òwe náà jẹ́ òtítọ́: ‘Ẹni kan ni olùfúnrúgbìn, ẹlòmíràn sì ni olúkórè.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Nítorí nínú èyí
  rationale: Ó pa ìtumọ̀ ìtọ́kasí náà àti ipa γὰρ gẹ́gẹ́ bí àsopọ̀ àlàyé mọ́, láì fi ohun tí ‘èyí’ ń tọ́ka sí kún un.
- source_word: ὁ λόγος
  choice: ọ̀rọ̀ náà
  rationale: Nínú àyíká yìí, λόγος túmọ̀ sí ọ̀rọ̀ tàbí àsọyé tí a mọ̀, kì í ṣe orúkọ oyè ‘Ọ̀rọ̀.’ ‘Ọ̀rọ̀ náà’ jẹ́ adayébá ní Yorùbá, ó sì ṣì gba ìtumọ̀ òwe tàbí àsọyé gbajúmọ̀ láàyè.
- source_word: ἀληθινός
  choice: jẹ́ òtítọ́
  rationale: Ó sọ pé ohun tí ọ̀rọ̀ náà wí dúró ṣinṣin, ó sì jẹ́ ọ̀nà Yorùbá adayébá láti sọ pé àsọyé kan jẹ́ òtítọ́.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ ni ó ṣe àgbékalẹ̀ ohun tí ọ̀rọ̀ náà sọ ní kedere.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: Ẹni kan ... ẹlòmíràn sì
  rationale: Ó pa ìyàtọ̀ láàárín àwọn ẹni méjì mọ́ ní ọ̀nà tí ó rọrùn, tí ó sì jẹ́ adayébá ní Yorùbá.
- source_word: ὁ σπείρων
  choice: ẹni ... tí ó ń fúnrúgbìn
  rationale: Ó fi iṣẹ́ tí participle ìsinsìnyí ń tọ́ka sí hàn, dípò fífi orúkọ iṣẹ́ kan tí ó lè dín ìfarahàn ìṣe náà kù.
- source_word: ὁ θερίζων
  choice: ẹni ... tí ó ń kórè
  rationale: Ó bá ìṣọ̀kan ọ̀rọ̀ fún ὁ σπείρων mu, ó sì pa ìṣe tí ó ń lọ tàbí ìṣe àṣà náà mọ́.
theological_decisions:
- issue: Àwọn ẹni tí afúnrúgbìn àti akórè ń tọ́ka sí
  choice: Fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí òwe gbogbogbò, láì dárúkọ àwọn tí wọ́n dúró fún.
  alternative: Ṣàlàyé afúnrúgbìn gẹ́gẹ́ bí àwọn wòlíì, Jòhánù Onítẹ̀bọmi, tàbí Jésù, àti akórè gẹ́gẹ́ bí àwọn ọmọ-ẹ̀yìn.
  rationale: Gíríìkì ẹsẹ yìí kò dá àwọn ẹni náà mọ̀ ní pàtó; àyíká ni ó ń darí bí a ṣe lè lò ó. Ìtumọ̀ náà kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan sínú ọrọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘fúnrúgbìn’ àti ‘kórè’ gẹ́gẹ́ bí ọ̀rọ̀ iṣẹ́-ogbin adayébá, a sì fi àṣà òwe ọ̀rọ̀ náà hàn pẹ̀lú àmì ọ̀rọ̀ tààrà.
