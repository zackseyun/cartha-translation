id: JHN.4.24
reference: John 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: yo
  text: Ẹ̀mí ni Ọlọ́run,[b] àwọn tí ń jọ́sìn ín sì gbọ́dọ̀ máa jọ́sìn ní ẹ̀mí àti ní òtítọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Ẹ̀mí àti òtítọ́.” A lè lóye ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ pàtó bẹ́ẹ̀, ṣùgbọ́n ọ̀rọ̀ inú ẹsẹ yìí pa ìtumọ̀ gbígbòòrò àpólà náà mọ́.
    reason: alternative_reading
  - marker: b
    text: “Ẹ̀mí ni Ọlọ́run” ń ṣàpèjúwe ìwà Ọlọ́run; kò túmọ̀ sí pé Ọlọ́run jẹ́ ọ̀kan lára àwọn ẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: 'A gbé àsọyé náà síwájú gẹ́gẹ́ bí Gíríìkì ṣe ṣe: “Ẹ̀mí ni Ọlọ́run.” Èyí sọ irú ẹ̀dá Ọlọ́run, kò sì sọ pé Ọlọ́run kàn jẹ́ ọ̀kan lára àwọn ẹ̀mí.'
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún Θεός níbí; àpilẹ̀kọ Gíríìkì náà fi hàn pé Ọlọ́run ni olùṣe gbolohun náà.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: àwọn tí ń jọ́sìn fún un
  rationale: Àpólà alábápín oníṣe lọ́wọ́ yìí ń tọ́ka sí gbogbo àwọn olùjọ́sìn; “àwọn tí ń jọ́sìn fún un” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ iṣẹ́ tí ń bá a lọ mọ́.
- source_word: ἐν πνεύματι
  choice: ní ẹ̀mí
  rationale: Àìsí àpilẹ̀kọ ní Gíríìkì àti bí a ṣe so ọ̀rọ̀ náà pọ̀ mọ́ “òtítọ́” mú kí “ní ẹ̀mí” pa ìtumọ̀ gbígbòòrò rẹ̀ mọ́ láì fi dandan sọ pé Ẹ̀mí Mímọ́ nìkan ni a ń tọ́ka sí.
- source_word: ἀληθείᾳ
  choice: òtítọ́
  rationale: “Òtítọ́” ni ìtumọ̀ tí ó ṣe déédé jù lọ, ó sì lè gba èrò òtítọ́ gẹ́gẹ́ bí ohun tí ó jẹ́ gidi àti ohun tí Ọlọ́run ṣí payá.
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: “Gbọdọ̀” fi agbára dandan tàbí ojúṣe tí δεῖ ní hàn ní Yorùbá àdánidá.
- source_word: προσκυνεῖν
  choice: máa jọ́sìn
  rationale: “Máa jọ́sìn” jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ọ̀rọ̀-ìṣe náà ní àyíká yìí, ó sì bá ìtumọ̀ gbogbogbòò tàbí iṣẹ́ tí ń tẹ̀ síwájú mu.
theological_decisions:
- issue: Ìtumọ̀ “Ẹ̀mí ni Ọlọ́run”
  choice: Ọ̀rọ̀ yìí ń sọ irú ẹ̀dá Ọlọ́run, kì í ṣe pé Ọlọ́run jẹ́ ọ̀kan lára onírúurú ẹ̀mí.
  alternative: Ọlọ́run jẹ́ ẹ̀mí kan.
  rationale: Ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì àti àìsí àpilẹ̀kọ pẹ̀lú πνεῦμα ṣe àtìlẹ́yìn fún àsọyé ànímọ́. Ìtumọ̀ yìí kò sọ Ọlọ́run di ọ̀kan lára ẹ̀ka àwọn ẹ̀mí.
- issue: Ìtumọ̀ “ní ẹ̀mí àti ní òtítọ́”
  choice: Ìjọ́sìn gbọ́dọ̀ ní ìwà ẹ̀mí àti òtítọ́, láì dín ọ̀rọ̀ náà kù sí ìtumọ̀ pàtó kan tí Gíríìkì kò fi dandan sọ.
  alternative: nínú Ẹ̀mí àti ní òtítọ́; tàbí pẹ̀lú ọkàn òótọ́ àti òtítọ́
  rationale: Àwọn ọ̀rọ̀ πνεύματι àti ἀληθείᾳ kò ní àpilẹ̀kọ, wọ́n sì wà ní ìṣọ̀kan. “Ní ẹ̀mí àti ní òtítọ́” pa ìtumọ̀ gbígbòòrò àti ìforígbárí ìtumọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àdánidá, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. Ìtò “Ẹ̀mí ni Ọlọ́run” pa ìtẹnumọ́ Gíríìkì mọ́, “ń jọ́sìn” àti “máa jọ́sìn” sì sọ ìṣe gbogbogbòò tí ń tẹ̀ síwájú ní kedere. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
