  text: ἀφῆκεν τὴν Ἰουδαίαν καὶ ἀπῆλθεν ⸀πάλιν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/003.yaml
  text: he left Judea and went back to Galilee[a].
translation:
  language: yo
  text: Ó fi Jùdíà sílẹ̀, ó sì padà lọ sí Gálílì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ó tún lọ sí Gálílì.’ Ọ̀rọ̀ Gíríìkì πάλιν lè túmọ̀ sí ‘lẹ́ẹ̀kan sí i,’ ṣùgbọ́n níbí ó ṣeé ṣe kí ó túmọ̀ sí pípadà sí ibi kan; ìdí nìyẹn tí a fi lò ‘padà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: fi … sílẹ̀
  rationale: Nínú àyíká yìí, ἀφίημι túmọ̀ sí fífi agbègbè kan sílẹ̀; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì gba ‘Jùdíà’ gẹ́gẹ́ bí ohun tí a fi sílẹ̀.
- source_word: Ἰουδαίαν
  choice: Jùdíà
  rationale: Orúkọ Yorùbá tí ó wọ́pọ̀ fún agbègbè ilẹ̀ Judea ni àyíká Ìhìn Rere.
- source_word: ἀπῆλθεν
  choice: lọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìrìn láti ibi kan sí òmíràn; ‘lọ’ jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì bá ọ̀rọ̀ ìrìn mu.
- source_word: πάλιν
  choice: padà
  rationale: Nínú ìtàn ìrìn yìí, πάλιν lè fi hàn pé ó ń padà sí ibi tí ó ti wà tẹ́lẹ̀, dípò kìkì pé ó tún ṣe ohun kan.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Gálílì
  rationale: εἰς fi ibi tí ìrìn náà ń lọ hàn; ‘sí Gálílì’ jẹ́ gbólóhùn Yorùbá àdánidá fún lílọ sí agbègbè kan.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, kedere, ọlọ́lá, àti àdánidá ni a lò. A lo ‘padà lọ’ láti mú ìtumọ̀ ìrìn-àjò inú ọ̀rọ̀ náà jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ míì ti πάλιν mọ́.
