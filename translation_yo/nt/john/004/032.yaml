id: JHN.4.32
reference: John 4:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Èmi ní oúnjẹ láti jẹ tí ẹ̀yin kò mọ̀.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo ní ohun kan láti jẹ tí ẹ̀yin kò mọ̀.” Jésù ń lo ọ̀rọ̀ àpẹẹrẹ, gẹ́gẹ́ bí àyíká ọ̀rọ̀ tó tẹ̀ lé ṣe fi hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ọ̀rọ̀ àwọn ọmọ-ẹ̀yìn àti ìdáhùn Jésù; ‘Ṣùgbọ́n’ bá ìlọsíwájú ìtàn náà mu.
- source_word: εἶπεν αὐτοῖς
  choice: ó sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti túmọ̀ λέγω pẹ̀lú ẹni tí a ń bá sọ̀rọ̀.
- source_word: Ἐγὼ
  choice: Èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì ní ìtẹnumọ́; ‘Èmi’ pa ìtẹnumọ́ àti ìfiwéra mọ́ ní Yorùbá.
- source_word: βρῶσιν
  choice: oúnjẹ
  rationale: Níhìn-ín βρῶσις túmọ̀ sí ohun jíjẹ́, kì í ṣe ìṣe jíjẹ; ‘oúnjẹ’ jẹ́ ọ̀rọ̀ tààrà, tó sì yẹ ní àyíká yìí.
- source_word: ἔχω φαγεῖν
  choice: ní oúnjẹ láti jẹ
  rationale: Ó pa ìtumọ̀ pé ó ní oúnjẹ fún jíjẹ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédé.
- source_word: ἣν
  choice: tí
  rationale: ‘Tí’ so gbólóhùn àlàyé náà mọ́ ‘oúnjẹ’ lọ́nà àdánidá ní Yorùbá.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: ‘Ẹ̀yin’ jẹ́ kí ìtẹnumọ́ àti ìyàtọ̀ tó wà nínú arọ́pò-orúkọ Gíríìkì hàn.
- source_word: οὐκ οἴδατε
  choice: ẹ̀yin kò mọ̀
  rationale: Ìtumọ̀ yìí tẹ̀ lé Gíríìkì ní tààrà, ó sì jẹ́ Yorùbá tó ṣe déédé; ó mọ̀ọ́mọ̀ fi ohun tí ‘mọ̀’ túmọ̀ sí ní àyíká yìí sílẹ̀ ní ìwọ̀n kan.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ ti ‘oúnjẹ’ Jésù
  choice: Pa ọ̀rọ̀ gangan ‘oúnjẹ’ mọ́ nínú ẹsẹ̀ náà láìṣàlàyé àpẹẹrẹ náà níbẹ̀.
  alternative: Mo ní ohun kan láti jẹ tí ẹ̀yin kò mọ̀.
  rationale: Àyíká tó tẹ̀ lé fi hàn pé Jésù ń fi ‘oúnjẹ’ ṣe àpẹẹrẹ ṣíṣe ìfẹ́ Baba, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ pa àìgbọ́ye àwọn ọmọ-ẹ̀yìn mọ́. Kí ìtumọ̀ má ṣe yanjú àpẹẹrẹ náà ṣáájú àkókò.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò; a lo àmì ohùn ní kíkún níbi tó bá yẹ. ‘Èmi’ àti ‘ẹ̀yin’ pa ìtẹnumọ́ Gíríìkì mọ́ láìjẹ́ kí gbólóhùn náà di àjèjì.
