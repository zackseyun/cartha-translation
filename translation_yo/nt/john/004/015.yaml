source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: yo
  text: Obìnrin náà sọ fún un pé, “Olúwa[a], fún mi ní omi yìí, kí òùngbẹ má bàa pa mí, kí n má sì máa wá síbí láti pọn omi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá, fún mi ní omi yìí …”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní àkókò ìsinsìnyí ìtàn, àkókò tí ó ti kọjá ni ó bá ìròyìn Yorùbá mu ní ti ẹ̀dá.
- source_word: γυνή
  choice: Obìnrin náà
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí obìnrin ará Samáríà náà, kì í ṣe aya.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ gíga tí κύριος lè ní mọ́, ṣùgbọ́n àkọ́lé ọ̀wọ̀ “Ọ̀gá” tún ṣeé ṣe nínú ìjíròrò yìí, a sì fi í sínú àlàyé ìsàlẹ̀.
- source_word: δός μοι
  choice: fún mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tààrà, tí ó sì bá àṣẹ ìbéèrè Gíríìkì mu.
- source_word: τοῦτο τὸ ὕδωρ
  choice: omi yìí
  rationale: Gíríìkì ẹsẹ yìí sọ “omi yìí” lásán; a kò fi “alààyè” kún un láti inú àyíká.
- source_word: ἵνα μὴ διψῶ
  choice: kí òùngbẹ má bàa gbẹ mí
  rationale: Èyí sọ ète ọ̀rọ̀ náà ní Yorùbá àdánidá, láì sọ ọ́ di ìdánilójú ọjọ́ iwájú.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: kí n má sì tún máa wá síbí
  rationale: Àkópọ̀ “má sì tún máa” mú ìtumọ̀ ìṣe tí ó ń ṣẹlẹ̀ léraléra àti ìfikún odi μηδέ hàn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἀντλεῖν
  choice: láti pọn omi
  rationale: “Pọn omi” ni gbólóhùn Yorùbá àdánidá fún fífa omi láti inú kànga; bí ó tilẹ̀ jẹ́ pé ohun tí a ń pọn kò farahàn lọ́tọ̀ ní Gíríìkì, ó wà nínú ìtumọ̀ ọ̀rọ̀-ìṣe náà àti àyíká.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ obìnrin ará Samáríà
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Ọ̀rọ̀ náà lè jẹ́ àkọ́lé ọ̀wọ̀ lasán ní ipele ìtàn, ó sì tún lè ní ìtumọ̀ jinlẹ̀ nínú Ìhìn Rere Jòhánù. “Olúwa” ni a lò nínú ọ̀rọ̀ pàtàkì, a sì pa “Ọ̀gá” mọ́ gẹ́gẹ́ bí ìtumọ̀ míì kí a má bàa yanju ìṣòro náà láìnídí.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Má sì tún máa wá” mú àṣà ìrìnàjò léraléra tí obìnrin náà fẹ́ yẹra fún hàn; “pọn omi” sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún fífa omi láti inú kànga.
