  source_fidelity: 'Ìtumọ̀ náà ṣètọ́ka dáadáa sí ìpìlẹ̀ Gíríìkì: obìnrin náà ń bá a sọ̀rọ̀, ó béèrè fún “omi yìí,” ó sì ṣàlàyé ète rẹ̀ pé kí òùngbẹ má ṣe pa á, kí ó má sì máa wá síbi láti pọn omi. Ṣùgbọ́n “kí òùngbẹ má bàa gbẹ mí” kò dáa ní Yorùbá; ó dà bí pé òùngbẹ fúnra rẹ̀ ni ń “gbẹ” ẹni. “Tún” nínú “má sì tún máa wá” sì lè fi ìtumọ̀ ‘mó lẹhin náà/no longer’ kún un ju ohun tí μηδέ fi hàn lọ.'
