  to: Obìnrin náà sọ fún un pé, “Olúwa[a], fún mi ní omi yìí, kí òùngbẹ má bàa pa mí, kí n má sì máa wá síbí láti pọn omi.”
  rationale: A tún ọ̀rọ̀ tó ń ṣàpèjúwe ìgbẹ òùngbẹ ṣe sí ìsọ̀rọ̀ Yorùbá tí ó ṣe kedere, a sì yọ “tún” kúrò kí a má fi ìtumọ̀ ‘no longer/again’ tí kò hàn gbangba nínú Gíríìkì kún ẹsẹ náà. Àwọn ìyókù—pẹ̀lú “Olúwa” àti àlàyé “Ọ̀gá”—wà ní ìbámu pẹ̀lú orísun àti ìlànà iṣẹ́ náà.
