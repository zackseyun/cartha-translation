  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: yo
  text: Jésù sọ fún un pé,[a] “Èmi ni, ẹni tí ń sọ̀rọ̀ fún ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Èmi ni ẹni náà tí ń sọ̀rọ̀ fún ọ.” Gíríìkì sọ ní ṣókí pé, “Èmi ni, ẹni tí ń sọ̀rọ̀ fún ọ”; àyíká ọ̀rọ̀ ní ẹsẹ̀ tí ó ṣáájú fi hàn pé Mèsáyà ni “ẹni náà.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Ọ̀rọ̀ ìṣe Gíríìkì wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí ìtàn, ṣùgbọ́n àkókò tí ó ti kọjá ni Yorùbá máa ń lò lọ́nà àdánidá nínú irú ìtàn yìí.
- source_word: αὐτῇ
  choice: fún un
  rationale: Dátífù náà fi ẹni tí Jésù ń bá sọ̀rọ̀ hàn; “fún un” ni ìtumọ̀ Yorùbá tí ó bá ọ̀nà gbólóhùn náà mu.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: “Èmi ni” tẹ̀ lé ọ̀rọ̀ Gíríìkì ní kíkún, ó sì pa ìdánimọ̀ tí àyíká ọ̀rọ̀ náà ń tọ́ka sí mọ́ láìfi ọ̀rọ̀ “Mèsáyà” kún un ní tààrà.
- source_word: ὁ λαλῶν σοι
  choice: ẹni tí ń bá ọ sọ̀rọ̀ yìí
  rationale: Àpólà aláìlórúkọ tí ó ní partísípù ìsinsìnyí túmọ̀ sí ẹni tí ó ń sọ̀rọ̀ fún obìnrin náà ní àkókò náà; “yìí” mú ìtọ́kasí náà ṣe kedere lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Bóyá kí a sọ ìdánimọ̀ Mèsáyà náà ní gbangba nínú ẹsẹ̀ pàtàkì
  choice: Pa “Èmi ni” mọ́, kí a má ṣe fi “Èmi ni ẹni náà” tàbí “Èmi ni Mèsáyà náà” rọ́pò rẹ̀.
  alternative: “Èmi ni ẹni náà, ẹni tí ń bá ọ sọ̀rọ̀ yìí.”
  rationale: Àyíká ẹsẹ̀ 25 fi hàn pé Jésù ń dá ara rẹ̀ mọ̀ gẹ́gẹ́ bí Mèsáyà tí obìnrin náà ń retí, ṣùgbọ́n ọ̀rọ̀ arọ́pò-orúkọ fún “ẹni náà” kò sí nínú Gíríìkì. Yíyan “Èmi ni” pa ọ̀rọ̀ orísun àti ìfojúsùn ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láìyanju àìṣedédé náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ń bá ọ sọ̀rọ̀” dípò ọ̀rọ̀ gíga tàbí ti ìgbàanì, a sì fi àmì ohùn sí ibi tí ó yẹ.
