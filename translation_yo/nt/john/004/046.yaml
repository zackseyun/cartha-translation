  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: yo
  text: Nítorí náà, ó tún wá sí Kánà ti Gálílì, níbi tí ó ti sọ omi di wáìnì.[a] Ọkùnrin kan sì wà, òṣìṣẹ́ ọba kan,[b] ẹni tí ọmọkùnrin rẹ̀ ń ṣàìsàn ní Kápánáúmù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi-gidi, Gíríìkì sọ pé, “níbi tí ó ti ṣe omi náà di wáìnì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “òṣìṣẹ́ ààfin ọba” tàbí “ọ̀tọ̀kùlú.” Ọ̀rọ̀ Gíríìkì βασιλικός ń tọ́ka sí ẹni tí ó ní ìbáṣepọ̀ pẹ̀lú ọba tàbí tí ó wà nínú iṣẹ́ ọba.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ipa àsopọ̀ àti ìtẹ̀síwájú ìtàn inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù padà wá sí ibẹ̀ lẹ́ẹ̀kan sí i.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Kánà ti Gálílì
  rationale: Ó tẹ̀lé ìbáṣepọ̀ orúkọ ibi àti ẹkùn inú Gíríìkì, ó sì jẹ́ Yorùbá tó ṣeé lóye.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: sọ omi di wáìnì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó mú kí omi di wáìnì, nígbà tí ó ṣì pa ìtumọ̀ ἐποίησεν mọ́.
- source_word: τις βασιλικός
  choice: ọkùnrin kan ... òṣìṣẹ́ ọba kan
  rationale: τις ń fi ẹni kan tí a kò dárúkọ hàn; βασιλικός sì ń tọ́ka sí ẹni tó ní ìbáṣepọ̀ pẹ̀lú ọba tàbí iṣẹ́ ààfin, láìsọ ipò rẹ̀ pàtó.
- source_word: υἱὸς
  choice: ọmọkùnrin
  rationale: Ó pa akọ tí ọ̀rọ̀ Gíríìkì υἱός sọ mọ́.
- source_word: ἠσθένει
  choice: ń ṣàìsàn
  rationale: Àkókò ọ̀rọ̀-ìṣe Gíríìkì fi ipò àìsàn tó ń bá a lọ hàn; gbólóhùn Yorùbá yìí jẹ́ àdánidá fún àìlera ara.
- source_word: Καφαρναούμ
  choice: Kápánáúmù
  rationale: Àkọsílẹ̀ orúkọ ibi náà ni èdè Yorùbá, pẹ̀lú àmì ohùn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ βασιλικός láìfi ìdánilójú ìtàn tí ẹsẹ̀ náà kò sọ kún un
  choice: òṣìṣẹ́ ọba
  alternative: ọ̀tọ̀kùlú tàbí ìjòyè ààfin
  rationale: Ọ̀rọ̀ náà fi ìbáṣepọ̀ ẹni náà pẹ̀lú ọba tàbí iṣẹ́ ọba hàn, ṣùgbọ́n kò sọ ipò rẹ̀ tàbí ọba tí ó ń sìn ní pàtó.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó níyì, tó ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo “sọ omi di wáìnì” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá, a sì fi àlàyé ọ̀rọ̀ Gíríìkì tó sún mọ́ lẹ́tà sí àlàyé ìsàlẹ̀.
