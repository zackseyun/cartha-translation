  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A lè tún túmọ̀ ọ́ sí: “Jésù fúnra rẹ̀ kò ṣe ìrìbọmi, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ̀ ni wọ́n ṣe é.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí aláìpé (imperfect), èyí tó lè tọ́ka sí ìṣe tó ń lọ tàbí ìṣe tí ó máa ń ṣẹlẹ̀.'
