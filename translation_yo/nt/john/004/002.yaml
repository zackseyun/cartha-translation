lexical_decisions:
- source_word: καίτοιγε
  choice: bí ó tilẹ̀ jẹ́ pé
  rationale: Ó fi àlàyé ìyọ̀ǹda tí ó ní ìtakora díẹ̀ kún ọ̀rọ̀ ẹsẹ tó ṣáájú; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: Ἰησοῦς αὐτός
  choice: Jésù fúnra rẹ̀
  rationale: “Fúnra rẹ̀” pa ìtẹnumọ́ αὐτός mọ́ pé Jésù gan-an kì í ṣe ẹni tó ń ṣe ìrìbọmi náà.
- source_word: οὐκ ἐβάπτιζεν
  choice: kì í ṣe … ni ó ń ṣe ìrìbọmi
  rationale: “Ó ń ṣe” ṣàfihàn ìṣe tó ń lọ tàbí tó jẹ́ àṣà, gẹ́gẹ́ bí imperfect Gíríìkì; ìṣètò “kì í ṣe … ni” tún jẹ́ kí ìtẹnumọ́ ẹni tó ṣe iṣẹ́ náà ṣe kedere.
- source_word: ἀλλ’
  choice: bí kò ṣe
  rationale: Ó ṣàfihàn ìyàtọ̀ láàárín Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ lọ́nà tó bá ìṣètò gbólóhùn Yorùbá mu.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθηταί; a kò tún ọ̀rọ̀-ìṣe ṣe, bí Gíríìkì náà kò ṣe tún un ṣe, ṣùgbọ́n ó ṣe kedere láti inú àyíká.
theological_decisions:
- issue: Ta ni ó ń ṣe ìrìbọmi nínú iṣẹ́ ìránṣẹ́ Jésù?
  choice: Jésù fúnra rẹ̀ kì í ṣe ẹni tó ń ṣe ìrìbọmi; àwọn ọmọ-ẹ̀yìn rẹ̀ ni.
  alternative: “Jésù kò ṣe ìrìbọmi, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ̀ ṣe é,” láìṣe afihan ìṣe tó ń lọ tàbí tó jẹ́ àṣà.
  rationale: Ìtumọ̀ náà pa ìtẹnumọ́ αὐτός àti ìrísí imperfect mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ìrìbọmi” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó ti wọ́pọ̀, a sì pa àmì ìdákẹ́jẹ̀ em dash mọ́ nítorí ẹsẹ yìí jẹ́ àlàyé àárín gbólóhùn.
