base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: yo
  text: Obìnrin náà dáhùn, ó sì sọ fún un pé, “Èmi kò ní ọkọ[a].” Jésù wí fún un pé, “O sọ dáadáa pé, ‘Èmi kò ní ọkọ.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, ἀνήρ, lè túmọ̀ sí “ọkùnrin” tàbí “ọkọ”; nínú àyíká yìí, “ọkọ” ni ìtumọ̀ tó yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ Yorùbá ‘dáhùn’ jẹ́ ọ̀nà àdánidá láti sọ pé ẹnì kan fèsì sí ohun tí a sọ fún un.
- source_word: ἡ γυνὴ
  choice: obìnrin náà
  rationale: Nínú àyíká yìí, γυνή túmọ̀ sí obìnrin náà, kì í ṣe ‘aya’ gẹ́gẹ́ bí ipò ìgbéyàwó.
- source_word: καὶ εἶπεν αὐτῷ
  choice: ó sì sọ fún un pé
  rationale: Èyí pa àwọn ìṣe méjèèjì mọ́—dídáhùn àti sísọ—ní èdè Yorùbá tó ń ṣàn dáadáa; ‘fún un’ fi ẹni tí ọ̀rọ̀ náà ń tọ́ sí hàn.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Èmi kò ní ọkọ
  rationale: Àyíká ẹsẹ tó tẹ̀ lé e fi hàn pé ἀνήρ níhìn-ín túmọ̀ sí ọkọ. Fífún ‘Èmi’ ní ìtẹnumọ́ bá ọ̀nà tí obìnrin náà gbà sọ ọ̀rọ̀ kúkúrú yìí mu.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí ìtàn, àkókò àtijọ́ ni ó jẹ́ àdánidá nínú ìtàn Yorùbá níbí.
- source_word: Καλῶς εἶπας
  choice: Ohun tí o sọ ... tọ́
  rationale: Nínú àyíká yìí, καλῶς ń jẹ́rìí sí òtítọ́ ọ̀rọ̀ obìnrin náà. ‘Tọ́’ mú ìtumọ̀ yẹn jáde lọ́nà àdánidá ju ìtumọ̀ gígún bí ‘o sọ dáadáa’ lọ.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: pé, ‘Èmi kò ní ọkọ’
  rationale: ‘Pé’ ṣàfihàn àkóónú ọ̀rọ̀ tí Jésù ń tọ́ka sí, a sì pa àtúnsọ gbólóhùn obìnrin náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀνήρ nínú ọ̀rọ̀ obìnrin náà
  choice: ọkọ
  alternative: ọkùnrin
  rationale: Ẹsẹ 18 sọ ní kedere nípa àwọn ọkọ tí obìnrin náà ti ní; nítorí náà ‘ọkọ’ ni ìtumọ̀ tó yẹ nínú àyíká, láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa ìtẹnumọ́ àti àtúnsọ ọ̀rọ̀ Gíríìkì mọ́ láìjẹ́ kí gbólóhùn di líle.
