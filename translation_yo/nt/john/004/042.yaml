  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: yo
  text: Wọ́n sì ń sọ fún obìnrin náà pé, “Kì í ṣe nítorí ohun tí o sọ[a] la fi gbàgbọ́ mọ́; nítorí àwa fúnra wa ti gbọ́, a sì mọ̀ pé ẹni yìí[b] ni Olùgbàlà ayé ní tòótọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “nítorí ọ̀rọ̀ rẹ” tàbí “nítorí ọ̀rọ̀ ẹnu rẹ.” Ó ń tọ́ka sí ẹ̀rí tí obìnrin náà sọ.'
    reason: lexical_alternative
  - marker: b
    text: “Ẹni yìí” ń pa ìtẹnumọ́ ọ̀rọ̀ atọ́ka Gíríìkì mọ́; a tún lè sọ ọ́ ní àdánidá pé, “ọkùnrin yìí” tàbí “òun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: Wọ́n sì ń sọ fún obìnrin náà
  rationale: Àkókò imperfect inú ἔλεγον ń fi ọ̀rọ̀ tí ó ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra hàn; “ń sọ” pa ìrísí yẹn mọ́. “Sì” fi agbára ìsopọ̀ τε hàn lọ́nà àdánidá ní Yorùbá.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: Kì í ṣe nítorí ohun tí o sọ la fi gbàgbọ́ mọ́
  rationale: “Mọ́” túmọ̀ Οὐκέτι gẹ́gẹ́ bí ohun tí kò tún jẹ́ bẹ́ẹ̀. Ẹ̀ka ìtẹnumọ́ “kì í ṣe … la fi …” mú kí ìdí tí wọ́n kọ̀ sílẹ̀ ṣe kedere, nígbà tí “ohun tí o sọ” fi λαλιὰν hàn gẹ́gẹ́ bí ẹ̀rí obìnrin náà tí a sọ ní ẹnu.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: nítorí àwa fúnra wa ti gbọ́
  rationale: “Àwa fúnra wa” pa ìtẹnumọ́ αὐτοὶ mọ́, ó sì yà ìrírí tààrà wọn sọ́tọ̀ kúrò nínú ìròyìn ẹlòmíràn. “Ti gbọ́” bá perfect ἀκηκόαμεν mu ní ti ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà.
- source_word: καὶ οἴδαμεν
  choice: a sì mọ̀
  rationale: οἴδαμεν jẹ́ ọ̀rọ̀ ìpo ní ìsinsìnyí; “mọ̀” ni ìtumọ̀ Yorùbá tó ṣe déédéé.
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: ẹni yìí ni … ní tòótọ́
  rationale: “Ẹni yìí” pa agbára demonstrative οὗτός mọ́ ju lílo arọ́pò-orúkọ lásán lọ; “ní tòótọ́” sì fi ìtẹnumọ́ ἀληθῶς hàn.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: Olùgbàlà ayé
  rationale: “Olùgbàlà” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún σωτήρ, “ayé” sì pa ìwọ̀n κόσμος mọ́ láì fi “gbogbo ènìyàn” tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
theological_decisions:
- issue: Ìwọ̀n àti agbára ìjẹ́wọ́ àwọn ará Samáríà
  choice: “ẹni yìí ni Olùgbàlà ayé ní tòótọ́”
  alternative: “Olùgbàlà gbogbo ènìyàn” tàbí gbolóhùn tí yóò dín “ayé” kù sí ẹgbẹ́ kan
  rationale: A túmọ̀ ìjẹ́wọ́ náà tààrà gẹ́gẹ́ bí ó ṣe wà, láì dín ìwọ̀n “ayé” kù, láì sì sọ ọ́ di àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ó kọjá ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé lasán. A lo “ń sọ” láti pa imperfect mọ́, àti “ẹni yìí” láti fi ìtẹnumọ́ οὗτός hàn.
