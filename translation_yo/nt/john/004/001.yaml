id: JHN.4.1
reference: John 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: yo
  text: Nítorí náà, nígbà tí Jésù mọ̀ pé àwọn Farisí ti gbọ́ pé Jésù ń sọ àwọn ènìyàn púpọ̀ sí i di ọmọ-ẹ̀yìn, ó sì ń batisí ju Jòhánù lọ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù ń sọ àwọn ènìyàn púpọ̀ sí i di ọmọ-ẹ̀yìn, ó sì ń batisí púpọ̀ sí i ju Jòhánù lọ.” Ọ̀rọ̀ Gíríìkì lè jẹ́ kí ìfiwéra náà kan ìṣe méjèèjì papọ̀, kì í ṣe iye àwọn ọmọ-ẹ̀yìn nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Nítorí náà, nígbà tí
  rationale: “Nígbà tí” fi iṣẹ́ àkókò ὡς hàn, “Nítorí náà” sì pa ìtumọ̀ ìtẹ̀síwájú tàbí àbájáde οὖν mọ́.
- source_word: ἔγνω
  choice: mọ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé Jésù mọ̀ tàbí ó ti gbọ́ nípa ohun tí ó ṣẹlẹ̀; “mọ̀” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ náà tí a sábà máa ń lò ní Yorùbá, pẹ̀lú “àwọn” láti fi ọ̀pọ̀ hàn.
- source_word: ἤκουσαν
  choice: ti gbọ́
  rationale: “Ti gbọ́” fi hàn pé ìròyìn náà ti dé etí àwọn Farisí kí Jésù tó mọ̀ pé wọ́n ti gbọ́ ọ.
- source_word: πλείονας μαθητὰς
  choice: àwọn ènìyàn púpọ̀ sí i di ọmọ-ẹ̀yìn
  rationale: Ìṣètò yìí jẹ́ èdè Yorùbá àdánidá fún “more disciples” nígbà tí ó bá “sọ ... di” pọ̀.
- source_word: ποιεῖ
  choice: ń sọ ... di
  rationale: Pẹ̀lú μαθητάς, ποιεῖ túmọ̀ sí “sọ ènìyàn di ọmọ-ẹ̀yìn”; èyí sún mọ́ orísun, ó sì yé òǹkàwé lónìí.
- source_word: βαπτίζει
  choice: ń batisí
  rationale: “Batisí” ni ọ̀rọ̀ ìtúmọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún βαπτίζω.
- source_word: ἢ Ἰωάννης
  choice: ju Jòhánù lọ
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ìfiwéra Gíríìkì náà ní Yorùbá.
theological_decisions:
- issue: Ó lè dà bí ẹni pé Jésù fúnra rẹ̀ ló ń batisí àwọn ènìyàn.
  choice: A pa ọ̀rọ̀ ẹsẹ yìí mọ́ gẹ́gẹ́ bí ó ṣe wà, pé Jésù ń sọ ènìyàn di ọmọ-ẹ̀yìn, ó sì ń batisí wọn.
  alternative: Kí a kọ ọ́ pé àwọn ọmọ-ẹ̀yìn Jésù ló ń ṣe batisí, kí ẹsẹ kejì tó ṣàlàyé bẹ́ẹ̀.
  rationale: Ẹsẹ kejì ló ṣàlàyé pé kì í ṣe Jésù fúnra rẹ̀, bí kò ṣe àwọn ọmọ-ẹ̀yìn rẹ̀, ni wọ́n ń batisí. Kí ìtumọ̀ ẹsẹ yìí má ṣe mú àlàyé ẹsẹ tó tẹ̀ lé e wọ inú rẹ̀ ṣáájú.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. Àmì ìdádúró gígùn ní òpin pa ìsopọ̀ gírámà pẹ̀lú ẹsẹ tó tẹ̀ lé e mọ́.
