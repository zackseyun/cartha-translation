  source_fidelity: Ìtumọ̀ àkọ́kọ́ pa ìtumọ̀ gbogbogbòò gbolóhùn Gíríìkì náà mọ́ dáadáa. Ṣùgbọ́n “ń batisí wọn” so ìṣe batisí mọ́ àwọn ènìyàn kan náà ní pàtó, níbi tí Gíríìkì fi ìṣe náà sílẹ̀ láìsọ aṣojú-ọrọ kan; ó sì lè jẹ́ kí ìfiwéra náà hàn bí ó ṣe kan iye àwọn ènìyàn nìkan. Àlàyé ẹsẹ̀-abẹ́lẹ̀ náà tún ṣàṣìṣe nípa fífi “di mímọ̀ fún ara rẹ̀” sínú ìtumọ̀ ποιεῖ μαθητάς.
