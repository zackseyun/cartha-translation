  terminology: “Jésù,” “àwọn Farisí,” “ọmọ-ẹ̀yìn,” “batisí,” àti “Jòhánù” yẹ. Kò yẹ kí a tú μαθητάς sí “mímọ̀ fún ara rẹ̀,” nítorí ọ̀rọ̀ náà túmọ̀ sí àwọn ọmọ-ẹ̀yìn, kì í ṣe ìsọni-dímímọ́.
