id: JHN.4.35
reference: John 4:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: yo
  text: Ṣé ẹ̀yin kì í sọ pé, ‘Oṣù mẹ́rin ṣì kù, lẹ́yìn náà ni ìkórè yóò dé’? Ẹ kíyèsí! Mo sọ fún yín pé, ẹ gbé ojú yín sókè, kí ẹ sì wo àwọn oko náà; wọ́n ti funfun fún ìkórè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ti tó fún ìkórè.” Gíríìkì náà sọ pé “wọ́n funfun”; èyí pa àwòrán tí a lè rí ní oko mọ́, ó sì lè fi hàn pé ìkórè ti tó àkókò.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Ẹ̀yin fúnra yín kì í ha ń sọ pé
  rationale: Ó pa ìbéèrè òdì àti ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς mọ́ ní Yorùbá àdánidá.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Oṣù mẹ́rin ṣì kù
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti sọ àkókò tó ṣì kù kí ìṣẹ̀lẹ̀ kan tó dé.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: lẹ́yìn náà ni ìkórè yóò dé
  rationale: Ó fi dídé ìkórè hàn ní ọ̀nà tó bójú mu pẹ̀lú gbolohun nípa oṣù mẹ́rin tó kù.
- source_word: ἰδοὺ
  choice: Ẹ wò ó
  rationale: Àmì ọ̀rọ̀ yìí pe àfiyèsí olùgbọ́ ní Yorùbá òde òní láì lo èdè àtijọ́.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: ẹ gbé ojú yín sókè
  rationale: Ó pa àwòrán gidi ti gbígbé ojú sókè mọ́ dípò fífi rẹ̀ rọ́pò pẹ̀lú ‘ẹ wo òkè’ nìkan.
- source_word: θεάσασθε
  choice: kí ẹ sì wo
  rationale: Ó sọ àkíyèsí tí a mọ̀ọ́mọ̀ ṣe, ó sì ń tẹ̀ lé àwòrán gbígbé ojú sókè lọ́nà àdánidá.
- source_word: τὰς χώρας
  choice: àwọn oko
  rationale: Nínú àyíká ìkórè, ọ̀rọ̀ náà ń tọ́ka sí ilẹ̀ tí a gbìn, èyí tí ‘àwọn oko’ fi hàn kedere.
- source_word: λευκαί εἰσιν
  choice: wọ́n ti funfun
  rationale: Ó pa àwòrán ‘funfun’ inú Gíríìkì mọ́, kò sì túmọ̀ rẹ̀ sí ‘pọ́n’ tàbí ‘ti tó gé’ nínú ọ̀rọ̀ pàtàkì.
- source_word: πρὸς θερισμόν
  choice: fún ìkórè
  rationale: Ó pa àkàwé ìkórè mọ́ ní ṣókí, láì fi ìtumọ̀ ‘ti tó fún ìkórè’ kún un ní gbangba.
- source_word: ἤδη
  choice: báyìí
  rationale: Nínú Yorùbá, ‘ti … báyìí’ ń fi hàn pé ipò náà ti wà nísinsìnyí, ní ìyàtọ̀ sí dídúró de oṣù mẹ́rin.
theological_decisions:
- issue: Bóyá kí a sọ ìkórè náà di ìtumọ̀ nípa àwọn ènìyàn tàbí iṣẹ́ ìránṣẹ́ nínú ọ̀rọ̀ pàtàkì
  choice: A pa àwòrán iṣẹ́ àgbẹ̀ àti ìkórè mọ́ láì sọ ẹni tàbí ohun tí àkàwé náà dúró fún ní gbangba.
  alternative: ‘Àwọn ènìyàn ti ṣe tán láti kó jọ’ tàbí irú ìtumọ̀ bẹ́ẹ̀.
  rationale: Àyíká lè tọ́ka sí ìkórè nípa tẹ̀mí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ pa àkàwé oko àti ìkórè mọ́; ìtumọ̀ kò gbọ́dọ̀ yanjú rẹ̀ sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo ọ̀pọ̀ ẹni kejì ọ̀wọ̀ (‘ẹ/yín’) fún àwọn ọmọ-ẹ̀yìn. Gbólóhùn òwe náà jẹ́ àdánidá, àmọ́ a pa àwòrán ‘gbé ojú sókè’ àti ‘funfun’ mọ́.
