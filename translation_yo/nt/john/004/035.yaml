  to: Ṣé ẹ̀yin kì í sọ pé, ‘Oṣù mẹ́rin ṣì kù, lẹ́yìn náà ni ìkórè yóò dé’? Ẹ kíyèsí! Mo sọ fún yín pé, ẹ gbé ojú yín sókè, kí ẹ sì wo àwọn oko náà; wọ́n ti funfun fún ìkórè.[a]
  rationale: The revision removes an added reflexive intensifier and an added object, while retaining the source’s rhetorical question and vivid agricultural imagery. It renders ἤδη with ‘ti’ in ‘wọ́n ti funfun,’ preserving the sense that the fields are already white/ready, and keeps the interpretive alternative in the footnote rather than the main text.
