  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà fi gbogbo àwọn apá pàtàkì ti Gíríìkì hàn ní ìdúróṣinṣin: γάρ (“Nítorí”), ìtẹnumọ́ αὐτός (“Jésù fúnra rẹ̀”), ἐμαρτύρησεν (“ti jẹ́rìí”), àti òwe gbogbogbò náà pé wòlíì kò ní ọlá ní πατρίς tirẹ̀. “Kì í ní” yẹ fún ìwà-òwe tí ọ̀rọ̀-ìṣe àsìkò-ìsinsìnyí náà ń fi hàn. “Ilẹ̀ ìbílẹ̀ tirẹ̀” pa àìdájú ibi tí πατρίς ń tọ́ka sí mọ́, láì sọ Jùdíà, Gálílì, tàbí Násárẹ́tì di ìtumọ̀ pàtó.'
  naturalness: Yorùbá náà jẹ́ èyí tí ó rọrùn, tí ó bójú mu fún ìwé mímọ́ òde òní, pẹ̀lú àmì ohùn tó pé níbi tó yẹ. “Jésù fúnra rẹ̀ ti jẹ́rìí pé” àti “Wòlíì kì í ní ọlá” jẹ́ ọ̀nà ìsọ̀rọ̀ adayeba.
  terminology: “Jẹ́rìí” yẹ fún μαρτυρέω, ó sì dáàbò bo ọ̀rọ̀ ẹ̀rí tí Jòhánù máa ń lò. “Wòlíì” àti “ọlá” jẹ́ àwọn ọ̀rọ̀ tó dúró ṣinṣin nínú ìlò Bíbélì Yorùbá. Àlàyé ìsàlẹ̀ nípa πατρίς jẹ́ olóòtọ́, ó sì fúnni ní àwọn ìṣàfilọ́lẹ̀ tó yẹ láì fi ipa mú ìtumọ̀ kan.
