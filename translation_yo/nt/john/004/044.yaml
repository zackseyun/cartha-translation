id: JHN.4.44
reference: John 4:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: yo
  text: Nítorí Jésù fúnra rẹ̀ ti jẹ́rìí pé, “Wòlíì kì í ní ọlá ní ilẹ̀ ìbílẹ̀ tirẹ̀.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ní orílẹ̀-èdè tirẹ̀” tàbí “ní agbègbè ìbílẹ̀ tirẹ̀.” Ọ̀rọ̀ Gíríìkì πατρίς lè túmọ̀ sí ilẹ̀ ìbílẹ̀ ẹni tàbí agbègbè tí ẹni ti wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó mú iṣẹ́ àsopọ̀ àti àlàyé γάρ wá sí Yorùbá lọ́nà àdánidá, láì yọ ọ́ kúrò.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: Jésù fúnra rẹ̀
  rationale: “Fúnra rẹ̀” pa ìtẹnumọ́ αὐτός mọ́ ní Yorùbá tó ṣe déédé.
- source_word: ἐμαρτύρησεν
  choice: ti jẹ́rìí
  rationale: “Jẹ́rìí” pa èdè ẹ̀rí tí ó ṣe pàtàkì nínú Jòhánù mọ́, ó sì bá àkókò ọ̀rọ̀-ìṣe Gíríìkì mu nínú gbólóhùn yìí.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ni àsopọ̀ Yorùbá tó yẹ fún fífi ohun tí Jésù jẹ́rìí rẹ̀ hàn.
- source_word: προφήτης
  choice: Wòlíì
  rationale: Ọ̀rọ̀ náà jẹ́ òwe gbogbogbò; Yorùbá kò nílò àmì àìnípàtó bí “a” ti Gẹ̀ẹ́sì.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: ní ilẹ̀ ìbílẹ̀ tirẹ̀
  rationale: Ó ṣàfihàn ibi tàbí agbègbè tí ẹni ti wá, ó sì pa ìtumọ̀ ἰδίᾳ, “tirẹ̀,” mọ́ láì pinnu bóyá Jùdíà, Gálílì, tàbí Násárẹ́tì ni.
- source_word: τιμὴν οὐκ ἔχει
  choice: kì í ní ọlá
  rationale: Ó pa ọ̀rọ̀-orúkọ τιμή (“ọlá”) mọ́, ó sì fi òwe tàbí òtítọ́ gbogbogbò hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí “ilẹ̀ ìbílẹ̀ tirẹ̀” ń tọ́ka sí nínú àyíká ìtàn Jòhánù
  choice: A túmọ̀ òwe náà ní tààrà láì sọ ibi kan pàtó.
  alternative: Jùdíà, Gálílì, tàbí Násárẹ́tì/agbegbe ìbílẹ̀ rẹ̀.
  rationale: Ẹsẹ náà kò dárúkọ ibi pàtó; yíyan “ilẹ̀ ìbílẹ̀ tirẹ̀” pa àìdájú àti ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ. Ìsọ̀rọ̀ náà jẹ́ ti òwe, ó sì yé òǹkàwé òde òní; “jẹ́rìí” pa àkòrí ẹ̀rí inú Jòhánù mọ́.
