id: JHN.4.39
reference: John 4:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: yo
  text: Ọ̀pọ̀ nínú àwọn ará Samáríà láti ìlú náà sì gbàgbọ́ nínú rẹ̀ nítorí ọ̀rọ̀[a] obìnrin náà, tí ó ń jẹ́rìí pé, “Ó sọ fún mi gbogbo ohun tí mo ṣe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ìhìn obìnrin náà.” Ọ̀rọ̀ Gíríìkì náà, λόγος, lè túmọ̀ sí “ọ̀rọ̀,” “ìhìn,” tàbí “ìròyìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: láti ìlú náà sì
  rationale: “Láti” fi orísun hàn gẹ́gẹ́ bí ἐκ; “ìlú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún πόλις ní àyíká yìí. A lo “sì” gẹ́gẹ́ bí àsopọ̀ pẹ̀lẹ́ fún δέ.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: ọ̀pọ̀ nínú àwọn ará Samáríà
  rationale: '“Nínú” pa ìtumọ̀ apá-nínú-àpapọ̀ tí ẹ̀yà ọ̀rọ̀ genitive náà ní mọ́: ọ̀pọ̀ lára àwọn ará Samáríà.'
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: gbà á gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ní ìgbàgbọ́ tí ó dojú kọ ẹni náà; ó yàtọ̀ sí ṣíṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ sí i ju ohun tí ẹsẹ náà sọ lọ.
- source_word: διὰ τὸν λόγον
  choice: nítorí ọ̀rọ̀
  rationale: “Nítorí” fi ìdí tàbí okùnfà tí διά pẹ̀lú accusative ń sọ hàn. “Ọ̀rọ̀” pa ìwọ̀n ìtumọ̀ λόγος mọ́, bí ó tilẹ̀ jẹ́ pé “ìhìn” tún ṣeé lò.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: obìnrin náà, tí ó ń jẹ́rìí
  rationale: “Obìnrin náà” tọ́ka sí obìnrin ará Samáríà tí a ti mẹ́nu kàn; “tí ó ń jẹ́rìí” pa ìṣe tí present participle ń tẹ̀ síwájú mọ́.
- source_word: Εἶπέν μοι
  choice: Ó sọ ... fún mi
  rationale: Ìṣètò “sọ ... fún mi” jẹ́ Yorùbá àdánidá fún λέγω pẹ̀lú ẹni tí a bá sọ̀rọ̀ sí.
- source_word: πάντα ἃ ἐποίησα
  choice: gbogbo ohun tí mo ti ṣe
  rationale: “Gbogbo ohun” mú ìtumọ̀ àkópọ̀ πάντα ἃ jáde. “Mo ti ṣe” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tó ti parí ní ìrántí yìí, láìfi àkókò kan pàtó kún un.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω εἰς ní ọ̀rọ̀ Johanu
  choice: gbà á gbọ́
  alternative: ní ìgbàgbọ́ nínú rẹ̀
  rationale: Àṣàyàn náà sọ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé tí ó dojú kọ Jesu ní èdè Yorùbá àdánidá, láìsọ irú ẹ̀kọ́ ìgbàgbọ́ mìíràn tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. Àmì ohùn wà níbi tí ó bá yẹ; ìṣètò “sì” lẹ́yìn kókó gbólóhùn àti “sọ ... fún mi” jẹ́ ti Yorùbá àdánidá.
