review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that many Samaritans from the town came to faith because of the woman’s testimony. However, “Ó sọ gbogbo ohun tí mo ti ṣe fún mi” places fún mi after the object and can imply that he did the things for her; the Greek means that he told her the things she had done. The revision places the indirect object with sọ and retains the aorist sense with “mo ṣe.”
  naturalness: The revised wording is idiomatic Standard Yoruba. “gbọ́ nínú rẹ̀” clearly expresses πιστεύω εἰς αὐτόν, and “Ó sọ fún mi gbogbo ohun tí mo ṣe” is natural and unambiguous Yoruba.
  terminology: “ará Samáríà,” “ìlú,” “ọ̀rọ̀,” “jẹ́rìí,” and “gbọ́ nínú rẹ̀” are suitable, clear choices. The footnote correctly presents ìhìn and ìròyìn as lexical alternatives for λόγος.
  issues:
  - severity: medium
    issue: The quotation’s indirect-object phrase is misplaced.
    rationale: 'In “Ó sọ gbogbo ohun tí mo ti ṣe fún mi,” fún mi follows the reported content and may be read as modifying what she did. It should occur immediately after sọ: “Ó sọ fún mi gbogbo ohun tí mo ṣe.”'
  - severity: low
    issue: The footnote anchor is attached to “obìnrin náà” rather than to the term being explained.
    rationale: The note discusses λόγος, rendered “ọ̀rọ̀,” so its anchor should follow ọ̀rọ̀.
  revised_text: Ọ̀pọ̀ nínú àwọn ará Samáríà láti ìlú náà sì gbàgbọ́ nínú rẹ̀ nítorí ọ̀rọ̀[a] obìnrin náà, tí ó ń jẹ́rìí pé, “Ó sọ fún mi gbogbo ohun tí mo ṣe.”
  revised_footnotes:
