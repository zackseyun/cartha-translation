revisions:
- from: Ọ̀pọ̀ nínú àwọn ará Samáríà láti ìlú náà sì gbà á gbọ́ nítorí ọ̀rọ̀ obìnrin náà[a], tí ó ń jẹ́rìí pé, “Ó sọ gbogbo ohun tí mo ti ṣe fún mi.”
  to: Ọ̀pọ̀ nínú àwọn ará Samáríà láti ìlú náà sì gbàgbọ́ nínú rẹ̀ nítorí ọ̀rọ̀[a] obìnrin náà, tí ó ń jẹ́rìí pé, “Ó sọ fún mi gbogbo ohun tí mo ṣe.”
  rationale: The revision corrects the Yoruba syntax of the woman’s testimony so that Jesus is explicitly the one who told her what she had done. It also uses a clear personal-belief construction for πιστεύω εἰς αὐτόν and moves the lexical footnote anchor to ọ̀rọ̀, the translation of λόγος. No theological expansion or resolution of ambiguity has been introduced.
