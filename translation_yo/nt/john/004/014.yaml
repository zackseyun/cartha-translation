id: JHN.4.14
reference: John 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó bá mu nínú omi tí èmi yóò fún un kì yóò gbẹ òùngbẹ mọ́ láéláé. Kàkà bẹ́ẹ̀, omi tí èmi yóò fún un yóò di orísun omi nínú rẹ̀, tí ń rú jáde sí ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: kì yóò òùngbẹ mọ́ láéláé
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí fún ìkọ̀ pẹ̀lú οὐ μή àti gbólóhùn εἰς τὸν αἰῶνα; ó pa ìtẹnumọ́ pé òùngbẹ kì yóò tún dé mọ́ mọ́.
- source_word: πηγὴ ὕδατος
  choice: orísun omi
  rationale: Ó túmọ̀ sí ibi tí omi ti ń sun jáde, kì í ṣe kànga tàbí omi tí kò ṣàn.
- source_word: ἁλλομένου
  choice: tí ń rú jáde
  rationale: Ó fi ìṣípò omi tí ń sun tàbí ń fò sókè hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ìyè tí kò ní òpin.
theological_decisions:
- issue: Ìtumọ̀ εἰς ζωὴν αἰώνιον
  choice: sí ìyè àìnípẹ̀kun
  alternative: títí dé ìyè àìnípẹ̀kun
  rationale: 'A pa àìdájú ìbáṣepọ̀ εἰς mọ́: ó lè tọ́ka sí ibi àfojúsùn tàbí àbájáde omi náà, láìṣàlàyé ẹ̀kọ́ ìgbàlà kan sí i.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní.
