language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: yo
  text: Kànga Jákọ́bù sì wà níbẹ̀.[a] Nítorí náà, Jésù, tí ó ti rẹ̀ nítorí ìrìn àjò náà, jókòó bẹ́ẹ̀ lẹ́gbẹ̀ẹ́ kànga náà.[b] Ó jẹ́ nǹkan bí wákàtí kẹfà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “orísun”; ọ̀rọ̀ Gíríìkì πηγή lè túmọ̀ sí orísun tàbí kànga.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “jókòó bẹ́ẹ̀”; ó ṣeé ṣe kí èyí túmọ̀ sí “jókòó bí ó ti wà” tàbí “jókòó ní ọ̀nà yìí.”
    reason: lexical_alternative
  - marker: c
    text: Ní ìṣirò àwọn wákàtí ojúmọ́ àwọn Júù, èyí jẹ́ nǹkan bí ọ̀sán. Àwọn kan sì rò pé ìṣirò Róòmù lè jẹ́ kí ó túmọ̀ sí nǹkan bí aago mẹ́fà ìrọ̀lẹ́.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγή
  choice: kànga
  rationale: Ní àyíká ìtàn yìí, ibi tí wọ́n ti ń fa omi ni ọ̀rọ̀ náà ń tọ́ka sí, nítorí náà “kànga” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù; “orísun” ṣì ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: κεκοπιακὼς
  choice: tí ó ti rẹ̀
  rationale: Àpólà aláṣẹ̀ṣe pípé náà fi ipò àárẹ̀ tí ìsapá ti mú wá hàn; “tí ó ti rẹ̀” sọ èyí ní Yorùbá àdánidá.
- source_word: ἐκ τῆς ὁδοιπορίας
  choice: nítorí ìrìn àjò náà
  rationale: Níhìn-ín ἐκ ń sọ ohun tó fa àárẹ̀ náà; “nítorí” mú ìbáṣepọ̀ okùnfà yẹn hàn kedere.
- source_word: ἐκαθέζετο
  choice: jókòó
  rationale: “Jókòó” jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàpèjúwe ipò jíjókòó Jésù nínú ìtàn, láìfi ọ̀rọ̀ àfikún tí kò sí nínú orísun kún un.
- source_word: οὕτως
  choice: bẹ́ẹ̀
  rationale: “Bẹ́ẹ̀” pa ìtumọ̀ adverb náà mọ́, bó tilẹ̀ jẹ́ pé ohun pàtó tí ó ń tọ́ka sí—“bí ó ti wà” tàbí “ní ọ̀nà yìí”—kò dájú.
- source_word: ἐπὶ τῇ πηγῇ
  choice: lẹ́gbẹ̀ẹ́ kànga náà
  rationale: Pẹ̀lú ἐπί àti dative, gbólóhùn náà jẹ́ ti ibi; “lẹ́gbẹ̀ẹ́ kànga náà” jẹ́ Yorùbá tó ṣe déédé fún ẹni tó jókòó ní ẹ̀gbẹ́ kànga.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Ó jẹ́ nǹkan bí wákàtí kẹfà
  rationale: “Nǹkan bí” dúró fún ὡς, “wákàtí kẹfà” sì pa ọ̀nà tí orísun fi sọ àkókò mọ́ láìyí i sí aago òde òní.
- source_word: δὲ / οὖν
  choice: sì / Nítorí náà
  rationale: Àwọn ọ̀rọ̀ àsopọ̀ wọ̀nyí ń tẹ ìtàn síwájú, wọ́n sì ń fi ìbáṣepọ̀ ohun tó ṣẹlẹ̀ hàn láìṣe àsọdùn wọn.
theological_decisions:
- issue: Ìtumọ̀ àkókò nínú “wákàtí kẹfà”
  choice: Pa “nǹkan bí wákàtí kẹfà” mọ́ nínú ẹsẹ̀ náà.
  alternative: Nǹkan bí ọ̀sán gangan; tàbí nǹkan bí aago mẹ́fà ìrọ̀lẹ́ bí a bá tẹ̀ lé èrò ìṣirò àkókò Róòmù.
  rationale: Gíríìkì kò sọ irú ìṣirò àkókò tí a lò. Ìtumọ̀ tààrà yìí pa àìdánilójú àti ìjíròrò nípa ìṣírò àkókò nínú Jòhánù mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè ìtàn tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A yan “kànga” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá ní àyíká yìí, a sì fi “orísun” pamọ́ sínú àlàyé ìsàlẹ̀. A kò pinnu ìjíròrò nípa ìṣirò “wákàtí kẹfà” nínú ẹsẹ̀ pàtàkì.
