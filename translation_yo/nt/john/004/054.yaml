  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: yo
  text: Èyí sì tún jẹ́ iṣẹ́ àmì kejì tí Jésù ṣe nígbà tí ó wá láti Jùdíà sí Gálílì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “iṣẹ́ ìyanu.” Jòhánù sábà máa ń lo “iṣẹ́ àmì” láti tẹnu mọ́ ìtumọ̀ iṣẹ́ náà àti agbára rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka padà sí ìwòsàn tí a ṣẹ̀ṣẹ̀ ròyìn.
- source_word: δὲ πάλιν
  choice: sì tún
  rationale: “Sì” mú ìsopọ̀ pẹ̀lẹ́ tí δέ ní wá, “tún” sì fi ìtumọ̀ ìṣẹ̀lẹ̀ tí ó tún ṣẹlẹ̀ hàn.
- source_word: δεύτερον
  choice: kejì
  rationale: Ó jẹ́ nọ́ńbà ipò tí ó ń ṣàpèjúwe iṣẹ́ àmì náà.
- source_word: σημεῖον
  choice: iṣẹ́ àmì
  rationale: “Iṣẹ́ àmì” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ iṣẹ́ alágbára tó ń tọ́ka sí ohun tó jinlẹ̀ mọ́, gẹ́gẹ́ bí lílo ọ̀rọ̀ náà nínú Jòhánù.
- source_word: ἐποίησεν
  choice: tí Jésù ṣe
  rationale: “Ṣe” jẹ́ ọ̀rọ̀-ìṣe Yorùbá tó bá ποιέω mu ní àjọṣe rẹ̀ pẹ̀lú σημεῖον.
- source_word: ἐλθὼν
  choice: lẹ́yìn tí ó dé
  rationale: A tú participle aorist náà sí ọ̀rọ̀ àkókò, nítorí ó ń fi hàn pé dídé rẹ̀ ṣáájú iṣẹ́ àmì náà.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: láti Jùdíà sí Gálílì
  rationale: Ìtumọ̀ yìí fi ibi tí ìrìnàjò ti bẹ̀rẹ̀ àti ibi tí ó lọ hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Lílo σημεῖον gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì nínú Jòhánù
  choice: iṣẹ́ àmì
  alternative: iṣẹ́ ìyanu
  rationale: '“Iṣẹ́ àmì” pa ipa ìtàn àti ìtumọ̀ ìṣípayá ti σημεῖον mọ́: iṣẹ́ náà kì í ṣe ìyanu lásán, ó tún ń tọ́ka rékọjá ara rẹ̀. Kò sì fi àlàyé ẹ̀kọ́ ìsìn kan kun ọ̀rọ̀ náà.'
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Iṣẹ́ àmì” dára ju “àmì” nìkan lọ nínú àyíká yìí nítorí pé ó bá àjọṣe ποιέω + σημεῖον mu ní Yorùbá.
