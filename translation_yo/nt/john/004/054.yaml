  source_fidelity: 'Ìtumọ̀ náà mú àwọn ẹ̀yà pàtàkì Gíríìkì náà wá: èyí tí ń tọ́ka sí ìwòsàn tó ṣáájú, iṣẹ́ àmì kejì, Jésù gẹ́gẹ́ bí ẹni tó ṣe é, àti ìrìnàjò rẹ̀ láti Jùdíà sí Gálílì. Síbẹ̀, ìpò “tún” nínú ìkọ̀kọ̀ọ̀kan tó wà lọwọlọwọ kò rọrùn jù; àtúnṣe náà ń so πάλιν mọ́ gbólóhùn àkọ́kọ́, bí ọ̀rọ̀ Gíríìkì ṣe ṣe. “Nígbà tí ó wá” ń ṣàfihàn participle ἐλθών pẹ̀lú ìbáṣepọ̀ àkókò láì mú un di “lẹ́yìn” pátápátá.'
  naturalness: “Èyí sì tún jẹ́ iṣẹ́ àmì kejì ...” jẹ́ Yorùbá boṣewa tó rọrùn láti ka ju “Èyí sì tún ni ...” lọ. “Nígbà tí ó wá láti Jùdíà sí Gálílì” dára, ó sì jẹ́ kó hàn kedere pé Jésù ni olùwá náà.
  terminology: “Iṣẹ́ àmì” jẹ́ ìtumọ̀ tó bá σημεῖον mu nínú Jòhánù, nítorí ó pa èrò àmì tí ń tọ́ka sí ohun mìíràn mọ́, kì í dín in kù sí iṣẹ́ ìyanu nìkan. Àlàyé ìsàlẹ̀ nípa “iṣẹ́ ìyanu” yẹ, ó sì ṣètìlẹ́yìn fún yíyàn ọ̀rọ̀ náà.
