id: JHN.4.22
reference: John 4:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: yo
  text: Ẹ̀yin ń jọ́sìn ohun tí ẹ kò mọ̀; àwa ń jọ́sìn ohun tí àwa mọ̀, nítorí ìgbàlà ti ọ̀dọ̀ àwọn Júù wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ènìyàn Júù.’ Ní àwọn ibòmíràn nínú Jòhánù, ‘àwọn ará Jùùdíà’ lè bá àyíká ọ̀rọ̀ kan mu; ṣùgbọ́n níbí, ìyàtọ̀ náà wà láàárín àwọn Júù àti àwọn ará Samáríà nípa ìjọ́sìn àti ìtàn ìgbàlà.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: ń jọ́sìn
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí jíjọ́sìn nípa ẹ̀sìn, kì í ṣe kìkàn tẹríba tàbí fi ọlá fún ẹnì kan.
- source_word: ὃ
  choice: ohun tí
  rationale: Arọ́pò-orúkọ aláìní akọ tàbí abo náà ń sọ ní gbogbogbò nípa ohun tí wọ́n ń jọ́sìn; ‘ohun tí’ pa ìtumọ̀ yẹn mọ́ láì sọ ọ́ di ẹni pàtó.
- source_word: οἴδατε / οἴδαμεν
  choice: mọ̀
  rationale: ‘Mọ̀’ jẹ́ ọ̀rọ̀ tààrà àti àdánidá, ó sì pa ìyàtọ̀ líle tó wà láàárín àìmọ̀ àti mímọ̀ mọ́.
- source_word: σωτηρία
  choice: ìgbàlà
  rationale: ‘Ìgbàlà’ jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún iṣẹ́ ìgbàlà Ọlọ́run ní àyíká Ìhìn Rere Jòhánù.
- source_word: ἐκ
  choice: ti ọ̀dọ̀ … wá
  rationale: Ìṣọ̀rọ̀ Yorùbá yìí fi orísun hàn ní ọ̀nà àdánidá, ó sì bá ìtumọ̀ ἐκ mu.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Níbí, ọ̀rọ̀ náà ń tọ́ka sí àwọn Júù gẹ́gẹ́ bí ènìyàn kan, ní ìyàtọ̀ sí àwọn ará Samáríà; ‘àwọn ará Jùùdíà’ yóò dín ìtumọ̀ rẹ̀ kù sí agbègbè kan.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ‘ìgbàlà ti ọ̀dọ̀ àwọn Júù wá’
  choice: Ó sọ nípa orísun ìgbàlà nínú ìtàn àti bí Ọlọ́run ṣe mú un wá nípasẹ̀ àwọn Júù.
  alternative: Ó lè tọ́ka ní pàtàkì sí jíjẹ́ tí Mèsáyà jẹ́ Júù, tàbí ní fífẹ̀ sí i sí ipò ìṣáájú ìṣípayá àti ìjọ́sìn àwọn Júù.
  rationale: Ìtumọ̀ náà pa ọ̀rọ̀ orísun mọ́, láì sọ ọ́ di ẹ̀sùn pé ẹ̀yà kan ga ju òmíràn lọ tàbí fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Èdè Yorùbá àjùmọ̀lò tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe ‘ti ọ̀dọ̀ … wá’ jẹ́ àdánidá ju ‘láti inú’ lọ fún fífi orísun hàn. A tún ‘àwa’ sọ nínú apá kejì láti pa ìtẹnumọ́ ἡμεῖς mọ́.
