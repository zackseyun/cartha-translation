id: JHN.4.47
reference: John 4:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: yo
  text: Nígbà tí ọkùnrin yìí gbọ́ pé Jésù ti dé Gálílì láti Jùdíà, ó lọ bá a, ó sì ń bẹ̀ ẹ́[a] pé kí ó sọ̀kalẹ̀ wá[b], kí ó sì wo ọmọkùnrin rẹ̀ sàn, nítorí ọmọ rẹ̀ fẹ́rẹ̀ẹ́ kú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè tú un sí, ‘ó sì ń béèrè lọ́wọ́ rẹ̀.’ Imperfect Giriki lè fi ìṣe tí ń tẹ̀síwájú tàbí tí a ṣe léraléra hàn.
    reason: lexical_alternative
  - marker: b
    text: ‘Sọ̀kalẹ̀ wá’ fi ìyàtọ̀ ní gíga ilẹ̀ láàárín àwọn ibi méjèèjì ní Gálílì hàn.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó tọ́ka sí ìjòyè ọba tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú, ó sì pa agbára ọ̀rọ̀ atọ́ka náà mọ́ ní Yorùbá àdánidá.
- source_word: ἀκούσας
  choice: Nígbà tí ... gbọ́
  rationale: A tú participle aorist náà sí gbólóhùn àkókò láti fi ìbáṣepọ̀ rẹ̀ pẹ̀lú ìṣe pàtàkì hàn ní Yorùbá tó ṣe déédé.
- source_word: ἥκει
  choice: ti dé
  rationale: ἥκω ń sọ nípa dídé tí àbájáde rẹ̀ ṣì wà; ‘ti dé’ mú ìtumọ̀ dídé àti wíwà níbẹ̀ jáde.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: ti dé Gálílì láti Jùdíà
  rationale: Ìṣètò Yorùbá yìí ṣe kedere ibi tí ó ti wá àti ibi tí ó dé, bó tilẹ̀ jẹ́ pé ó yí ìtòlẹ́sẹẹsẹ àwọn gbolohun Giriki padà fún ìṣàn ọ̀rọ̀ àdánidá.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: ó lọ bá a
  rationale: ‘Lọ bá a’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún lílọ sí ọ̀dọ̀ ẹnì kan.
- source_word: ἠρώτα
  choice: ó sì ń bẹ̀ ẹ́
  rationale: Àmì ‘ń’ fi apá aláìparí ti imperfect hàn, nígbà tí ‘bẹ̀’ bá ipò ìbéèrè oníkanjú mu láìfi ìmọ̀lára tí ọ̀rọ̀ Giriki kò pọndandan béèrè kún un.
- source_word: ἵνα καταβῇ
  choice: pé kí ó sọ̀kalẹ̀ wá
  rationale: ‘Sọ̀kalẹ̀ wá’ pa ìtọ́kasí sí ìsàlẹ̀ ibi mọ́, ó sì lo ‘wá’ nítorí ìbéèrè náà jẹ́ kí Jésù lọ sí ibi tí ọmọ náà wà.
- source_word: ἰάσηται
  choice: kí ó sì wo ... sàn
  rationale: ‘Wo ... sàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìwòsàn ara, ó sì yẹ fún iṣẹ́ ìwòsàn nínú àyíká yìí.
- source_word: αὐτοῦ τὸν υἱόν
  choice: ọmọkùnrin rẹ̀
  rationale: Ó pa akọ ọmọ tí υἱός sọ mọ́, ó sì lo ìní Yorùbá tó ṣe déédé.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: nítorí ikú ọmọ náà ti sún mọ́lé
  rationale: Ìtumọ̀ yìí mú ìkánjú àti bí ikú ṣe sún mọ́lé jáde, láìlo ‘fẹ́ kú,’ èyí tí ó lè túmọ̀ sí pé ẹni náà ní ìfẹ́ láti kú.
theological_decisions:
- issue: Ẹni tí ‘ó fẹ́ kú’ nínú ọ̀rọ̀ Giriki ń tọ́ka sí
  choice: Ọmọkùnrin náà ni ikú rẹ̀ sún mọ́lé.
  alternative: Jésù tàbí ìjòyè ọba náà
  rationale: Ọmọkùnrin náà ni ẹni tó sún mọ́ ọ̀rọ̀ náà jù lọ, gbogbo àyíká ẹsẹ náà sì ń sọ nípa àìsàn rẹ̀; ìpinnu gírámà àti àyíká ni èyí, kì í ṣe fífi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A gbe àmì àlàyé [a] sí lẹ́yìn ọ̀rọ̀ tí ó ń ṣàlàyé imperfect, àti [b] sí lẹ́yìn ‘sọ̀kalẹ̀ wá,’ kí àmì kọ̀ọ̀kan lè bá àlàyé rẹ̀ mu.
