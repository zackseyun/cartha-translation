  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Giriki dáadáa ní gbogbogbòò: ọkùnrin náà gbọ́ ìròyìn náà, ó lọ sọ́dọ̀ Jésù, ó sì ń bẹ̀ ẹ́ kí ó sọ̀kalẹ̀ wá wo ọmọ rẹ̀ sàn. Ṣùgbọ́n ‘ikú ọmọ náà ti sún mọ́lé’ kò sọ μέλλω + infinitive ní kedere, ó sì lè dá ìtumọ̀ míì sílẹ̀. ‘Ọmọ rẹ̀ fẹ́rẹ̀ẹ́ kú’ sọ ìsúnmọ́ ikú náà ní tààrà àti ní Yorùbá àdánidá.'
