source:
  edition: SBLGNT
  text: Μετὰ δὲ τὰς δύο ἡμέρας ἐξῆλθεν ⸀ἐκεῖθεν εἰς τὴν Γαλιλαίαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ méjì náà, ó kúrò níbẹ̀ lọ sí Gálílì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Lẹ́yìn ọjọ́ méjì náà
  rationale: Μετά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ohun tó ṣẹlẹ̀ lẹ́yìn àkókò kan. “Ọjọ́ méjì náà” ń tọ́ka padà sí ọjọ́ méjì tí Jésù lò níbẹ̀ (ẹsẹ 40). A kò túmọ̀ δέ lọ́tọ̀ nítorí pé ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí Yorùbá kò nílò níbí.
- source_word: ἐξῆλθεν ἐκεῖθεν
  choice: ó kúrò níbẹ̀
  rationale: Àpapọ̀ yìí sọ pé ó fi ibi tí ó wà sílẹ̀. “Ó kúrò níbẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa ìtumọ̀ ìrìn-àjò kúrò ní ibi kan mọ́.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: lọ sí Gálílì
  rationale: εἰς ń fi ibi tí ìrìn-àjò ń lọ hàn. “Lọ sí Gálílì” jẹ́ èdè Yorùbá àdánidá, ó sì bá ọ̀rọ̀-ìṣe “kúrò” mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, kedere, ọlọ́wọ̀, tí ó sì yẹ fún ìtàn ìrìn-àjò. A lo àmì ohùn níbi tí ó bá jẹ́ àdánidá. Kò sí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí a fi kún ọ̀rọ̀ náà.
