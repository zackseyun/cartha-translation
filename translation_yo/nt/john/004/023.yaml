  to: Ṣùgbọ́n àkókò kan ń bọ̀, ó sì ti dé báyìí, nígbà tí àwọn olùjọ́sìn tòótọ́ yóò jọ́sìn Baba ní ẹ̀mí àti òtítọ́[a]; nítorí Baba ń wá irú àwọn ẹni bẹ́ẹ̀ tí ń jọ́sìn òun.
