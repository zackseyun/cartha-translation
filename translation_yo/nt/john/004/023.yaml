id: JHN.4.23
reference: John 4:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: yo
  text: Ṣùgbọ́n àkókò kan ń bọ̀, ó sì ti dé báyìí, nígbà tí àwọn olùjọ́sìn tòótọ́ yóò jọ́sìn Baba ní ẹ̀mí àti òtítọ́[a]; nítorí Baba ń wá irú àwọn ẹni bẹ́ẹ̀ tí ń jọ́sìn òun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Ẹ̀mí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìjọ́sìn tí Ẹ̀mí Mímọ́ ń fún ní agbára, ìjọ́sìn láti inú ẹ̀mí ènìyàn, tàbí ìjọ́sìn tí ó ní ìwà ẹ̀mí gidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tí ó ṣáájú nípa ibi tí ó yẹ kí a ti máa jọ́sìn; ‘Ṣùgbọ́n’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìyàtọ̀ yìí.
- source_word: ἔρχεται ὥρα
  choice: àkókò kan ń bọ̀
  rationale: ‘Àkókò kan’ pa àìní atọ́ka ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá àdánidá; ‘ń bọ̀’ fi ìṣe tí ó ń lọ hàn.
- source_word: καὶ νῦν ἐστιν
  choice: ó sì ti dé báyìí
  rationale: Ó sọ ní èdè Yorùbá tó ṣe kedere pé àkókò tí ń bọ̀ náà ti bẹ̀rẹ̀ sí í wà ní ìsinsìnyí.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: àwọn olùjọ́sìn tòótọ́
  rationale: ‘Tòótọ́’ lè túmọ̀ sí ojúlówó tàbí ohun tí ó bá òtítọ́ mu, gẹ́gẹ́ bí ìlò Johanu, láì dá ẹgbẹ́ ẹ̀sìn kan sọ́tọ̀.
- source_word: προσκυνήσουσιν
  choice: yóò máa jọ́sìn
  rationale: Ó ṣe àfihàn ọjọ́ iwájú, ‘máa’ sì bá ìṣe ìjọ́sìn tí ń tẹ̀ síwájú mu ní Yorùbá.
- source_word: τῷ πατρὶ
  choice: Baba
  rationale: A lò ó gẹ́gẹ́ bí orúkọ oyè fún Ọlọ́run nínú àyíká ọ̀rọ̀ Johanu.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: ní ẹ̀mí àti òtítọ́
  rationale: Ó pa àwọn ọ̀rọ̀ méjèèjì mọ́ gẹ́gẹ́ bí orúkọ, ó sì yẹra fún yíyanjú bóyá πνεῦμα ń tọ́ka sí Ẹ̀mí Mímọ́, ẹ̀mí ènìyàn, tàbí ìjọ́sìn tí ìwà ẹ̀mí ń ṣàkóso.
- source_word: καὶ γὰρ
  choice: nítorí
  rationale: Ó mú ìdí tí gbólóhùn ìkẹyìn fi tẹ̀ lé jáde lọ́nà Yorùbá tó ṣe déédéé; ìtẹnumọ́ náà tún hàn nínú ìṣètò ‘irú àwọn ẹni bẹ́ẹ̀ ni’.
- source_word: τοιούτους ζητεῖ
  choice: irú àwọn ẹni bẹ́ẹ̀ ni Baba ń wá
  rationale: ‘Irú àwọn ẹni bẹ́ẹ̀’ tọ́ka sí àwọn olùjọ́sìn irú yẹn, ìṣètò ‘ni’ sì fi ìtẹnumọ́ hàn; ‘ń wá’ jẹ́ ìtumọ̀ àdánidá fún ìṣe lọ́wọ́lọ́wọ́.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: láti máa jọ́sìn òun
  rationale: Ó fi ète ìwá Baba hàn lọ́nà Yorùbá tó rọrùn, ‘òun’ sì tọ́ka padà sí Baba láìsí àṣìṣe.
theological_decisions:
- issue: Ìtumọ̀ ἐν πνεύματι
  choice: ní ẹ̀mí
  alternative: nínú Ẹ̀mí; nípa ẹ̀mí
  rationale: Ọ̀rọ̀ Gíríìkì kò ní atọ́ka, ó sì lè tọ́ka sí agbára Ẹ̀mí Mímọ́, ẹ̀mí ènìyàn, tàbí ìjọ́sìn tí ó ní ìwà ẹ̀mí. Ọ̀rọ̀ inú ẹsẹ àti àlàyé ìsàlẹ̀ pa àìdájú yìí mọ́.
- issue: Ìwọ̀n ìtumọ̀ ‘àwọn olùjọ́sìn tòótọ́’
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àwọn olùjọ́sìn ojúlówó tí ìjọ́sìn wọn bá òtítọ́ Ọlọ́run mu.
  alternative: àwọn olùjọ́sìn ojúlówó; àwọn olùjọ́sìn gidi
  rationale: Èyí pa ìyàtọ̀ Johanu mọ́ láàárín ìjọ́sìn tí a dè mọ́ ibi kan àti ìjọ́sìn tí ó bá ìṣípayá Ọlọ́run mu, láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn kíkún, tí ó ní ọlá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A yan ‘àkókò’ dípò ìtumọ̀ gígùn ti ‘wákàtí’ nítorí ó jẹ́ àdánidá ní Yorùbá nínú àyíká yìí, nígbà tí ‘àkókò kan ń bọ̀, ó sì ti dé báyìí’ pa ìfọ̀kànsìn ọjọ́ iwájú àti ìmúṣẹ̀ lọ́wọ́lọ́wọ́ mọ́.
