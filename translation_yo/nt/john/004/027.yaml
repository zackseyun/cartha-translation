id: JHN.4.27
reference: John 4:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: yo
  text: Ní àkókò yẹn gan-an, àwọn ọmọ-ẹ̀yìn rẹ̀ dé, ó sì yà wọ́n lẹ́nu pé ó ń bá obìnrin kan sọ̀rọ̀. Síbẹ̀, kò sí ẹnì kankan tí ó sọ pé, “Kí ni o ń wá?”[a] tàbí pé, “Kí ló dé tí o fi ń bá a sọ̀rọ̀?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Kí ni o fẹ́?”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “Kí ni o ń sọ̀rọ̀ pẹ̀lú rẹ̀?” Ìtumọ̀ ọ̀rọ̀ náà nínú àyíká ni, “Kí ló dé tí o fi ń bá a sọ̀rọ̀?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: Ní àkókò yẹn gan-an
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí tọ́ka sí àkókò nínú ìtàn, ìyẹn ‘ní àkókò yẹn gan-an,’ kì í ṣe ibi kan.
- source_word: ἦλθαν
  choice: dé
  rationale: ‘Dé’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún dídé àwọn ọmọ-ẹ̀yìn sí ibi tí Jésù wà.
- source_word: ἐθαύμαζον
  choice: ó sì yà wọ́n lẹ́nu
  rationale: Ìtumọ̀ yìí fi ìyàlẹ́nu àwọn ọmọ-ẹ̀yìn hàn lọ́nà Yorùbá àdánidá, láìfi ìdí tí ó fi yà wọ́n lẹ́nu kún ohun tí Gíríìkì sọ.
- source_word: μετὰ γυναικὸς
  choice: ń bá obìnrin kan
  rationale: Gíríìkì kò lo atọ́ka pàtó pẹ̀lú γυνή níbí; ‘obìnrin kan’ pa àìsọ pàtó yẹn mọ́, ‘obìnrin’ sì bá ọ̀rọ̀ inú àyíká mu ju ‘aya’ lọ.
- source_word: ἐλάλει
  choice: ń bá ... sọ̀rọ̀
  rationale: Àmì ìṣe tó ń lọ lọ́wọ́ inú Gíríìkì bá ‘ń bá ... sọ̀rọ̀’ mu, ó sì fi hàn pé ìjíròrò náà ń lọ nígbà tí wọ́n dé.
- source_word: μέντοι
  choice: Síbẹ̀
  rationale: ‘Síbẹ̀’ fi ìyàtọ̀ hàn láàárín bí ó ṣe yà wọ́n lẹ́nu àti bí wọn kò ṣe béèrè ohunkóhun.
- source_word: Τί ζητεῖς;
  choice: Kí ni o ń wá?
  rationale: Èyí dúró nítòsí ìtumọ̀ ζητέω, ó sì pa ohun tí ẹni náà ń wá mọ́ gẹ́gẹ́ bí ohun tí a kò sọ ní pàtó. Ìtumọ̀ àdánidá mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Kí ló dé tí o fi ń bá a sọ̀rọ̀?
  rationale: Bí ó tilẹ̀ jẹ́ pé τί túmọ̀ sí ‘kí ni’ ní ti gidi, agbára ìbéèrè náà nínú àyíká ni ‘kí ló dé’; μετά sì fi hàn pé ó ń bá a sọ̀rọ̀, kì í ṣe pé ó kàn ń sọ ohun kan fún un.
theological_decisions:
- issue: Ìtumọ̀ àwùjọ tó wà nínú bí Jésù ṣe ń bá obìnrin kan sọ̀rọ̀
  choice: A sọ ìyàlẹ́nu àwọn ọmọ-ẹ̀yìn nìkan, láìfi àlàyé nípa ẹ̀yà, ìbálòpọ̀, tàbí àṣà kún ẹsẹ náà.
  alternative: Kí a fi kún un pé ó yà wọ́n lẹ́nu nítorí ìyàtọ̀ láàárín Júù àti ará Samáríà tàbí nítorí pé ọkùnrin ń bá obìnrin sọ̀rọ̀.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ó yà wọ́n lẹ́nu pé ó ń bá obìnrin kan sọ̀rọ̀, ṣùgbọ́n kò sọ ìdí rẹ̀ ní pàtó. Ìtumọ̀ náà pa ìkóra-ẹni-níjàánu inú orísun mọ́.
- issue: Ẹni tí àwọn ìbéèrè tí a kò sọ náà ń tọ́ka sí
  choice: A lo arọ́pò-orúkọ Yorùbá ‘o’ àti ‘a,’ èyí tí kò sọ akọ tàbí abo ní pàtó.
  alternative: Kí a fi orúkọ tàbí àlàyé kún un láti sọ pé ìbéèrè àkọ́kọ́ jẹ́ sí obìnrin náà, èkejì sì jẹ́ sí Jésù.
  rationale: Gíríìkì kò fi gbogbo ẹni tí ìbéèrè kọ̀ọ̀kan ń bá sọ̀rọ̀ hàn ní gbangba. Yorùbá lè pa àìsọ pàtó yìí mọ́ láìdàrú.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì lo ‘ń bá ... sọ̀rọ̀’ láti mú ìṣe tó ń lọ lọ́wọ́ àti èdè àdánidá Yorùbá pọ̀.
