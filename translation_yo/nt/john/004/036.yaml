id: JHN.4.36
reference: John 4:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: yo
  text: Ẹni tí ń kórè ń gba owó iṣẹ́[a], ó sì ń kó èso jọ fún ìyè àìnípẹ̀kun[b], kí ẹni tí ń fúnrúgbìn àti ẹni tí ń kórè lè jọ yọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀san.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí owó tí a san fún iṣẹ́ tàbí ẹ̀san.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sí ìyè àìnípẹ̀kun.” Àpólà náà lè fi ibi-afẹ́ tàbí àbájáde hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: ẹni tí ń kórè
  rationale: Àpólà aláìlórúkọ tí ó ní àpilẹ̀kọ yìí ń tọ́ka sí ẹni tó ń ṣe iṣẹ́ náà; ‘ẹni tí ń kórè’ jẹ́ Yorùbá àdánidá, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: μισθὸν
  choice: owó iṣẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí owó tí a san fún iṣẹ́ tàbí èrè; ‘owó iṣẹ́’ pa àwòrán òṣìṣẹ́ ìkórè mọ́, nígbà tí àlàyé ìsàlẹ̀ fi yíyan mìíràn hàn.
- source_word: λαμβάνει
  choice: ń gba
  rationale: Ìṣe àsìkò ìsinsìnyí fi hàn pé gbígba náà ń ṣẹlẹ̀ lọ́wọ́.
- source_word: συνάγει
  choice: ń kó … jọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ kíkójọ, ó sì bá ìṣe àsìkò ìsinsìnyí mu.
- source_word: καρπὸν
  choice: èso
  rationale: ‘Èso’ pa àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ àpẹẹrẹ ọ̀rọ̀ náà mọ́ láì sọ ọ́ di ‘ìkórè’ fúnra rẹ̀.
- source_word: εἰς ζωὴν αἰώνιον
  choice: fún ìyè àìnípẹ̀kun
  rationale: ‘Fún’ lè fi ibi-afẹ́ tàbí àbájáde hàn ní Yorùbá, bí εἰς ṣe lè ṣe níbí; àlàyé ìsàlẹ̀ ṣàfihàn àìdájú yẹn.
- source_word: ἵνα
  choice: kí … lè
  rationale: Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá àdánidá fún gbolóhùn ète tàbí àbájáde láì pinnu ìyàtọ̀ náà jù.
- source_word: ὁ σπείρων
  choice: ẹni tí ń fúnrúgbìn
  rationale: Ó bá ‘ẹni tí ń kórè’ dọ́gba, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ὁμοῦ
  choice: jọ
  rationale: ‘Jọ’ sọ ayọ̀ tí àwọn méjèèjì ń pín papọ̀ ní ṣókí àti ní èdè àdánidá.
- source_word: χαίρῃ
  choice: lè jọ máa yọ̀
  rationale: ‘Lè … máa yọ̀’ ṣàfihàn ipò abẹ́ ἵνα àti ìwà ìṣe tí ń bá a lọ.
theological_decisions:
- issue: Bóyá kí a fi ọ̀rọ̀ kan tó túmọ̀ sí ‘tẹ́lẹ̀’ tàbí ‘nísinsìnyí gan-an’ sí ìbẹ̀rẹ̀ ẹsẹ̀
  choice: A kò fi ọ̀rọ̀ àfikún bẹ́ẹ̀ sí ọ̀rọ̀ pàtàkì.
  alternative: ‘Nísinsìnyí gan-an, ẹni tí ń kórè…’
  rationale: Àyíká ẹsẹ̀ 35–38 tẹnu mọ́ pé ìkórè ti ń ṣẹlẹ̀, ṣùgbọ́n kò sí ọ̀rọ̀ adáwà kan fún ‘tẹ́lẹ̀’ nínú gbólóhùn Gíríìkì yìí; fífi sílẹ̀ yàgò fún àfikún tí kò pọndandan.
- issue: Ìtumọ̀ εἰς ζωὴν αἰώνιον gẹ́gẹ́ bí ibi-afẹ́ tàbí àbájáde
  choice: ‘fún ìyè àìnípẹ̀kun,’ pẹ̀lú àlàyé ìsàlẹ̀
  alternative: ‘sí ìyè àìnípẹ̀kun’
  rationale: εἰς lè tọ́ka sí ibi tí ohun ń lọ tàbí àbájáde rẹ̀; a pa àìdájú tó wà nínú orísun mọ́ nípa ọ̀rọ̀ àdánidá àti àlàyé.
- issue: Bóyá μισθός túmọ̀ sí owó iṣẹ́ tàbí èrè
  choice: ‘owó iṣẹ́,’ pẹ̀lú àlàyé ìsàlẹ̀
  alternative: ‘èrè’
  rationale: ‘Owó iṣẹ́’ pa àwòrán iṣẹ́ ìkórè mọ́; ṣùgbọ́n nítorí ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ èrè tàbí ẹ̀san, a sọ yíyan náà nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘fúnrúgbìn’ àti ‘kórè’ láti pa àwòrán iṣẹ́ àgbẹ̀ àti ìfararọ̀ àwọn apá méjèèjì mọ́. Àmì [a] ni a so mọ́ ‘owó iṣẹ́,’ àmì [b] sì ni a so mọ́ ‘ìyè àìnípẹ̀kun.’
