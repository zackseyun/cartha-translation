id: JHN.4.34
reference: John 4:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Oúnjẹ mi ni láti ṣe ìfẹ́ ẹni tí ó rán mi[b] àti láti mú iṣẹ́ rẹ̀ dé òpin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “parí iṣẹ́ rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, “ẹni tí ó rán mi” ń tọ́ka sí Baba, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì kò pe oyè náà ní tààrà níbí.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù sọ fún wọn pé
  rationale: A tú ọ̀rọ̀ ìsinsìnyí inú ìtàn (λέγει) sí àkókò tí ó kọjá, gẹ́gẹ́ bí ó ṣe wọ́pọ̀ tí ó sì ṣe kedere nínú ìtàn Yorùbá.
- source_word: βρῶμά / Ἐμὸν βρῶμά ἐστιν
  choice: Oúnjẹ mi ni
  rationale: “Oúnjẹ” pa àkàwé gidi mọ́, ó sì bá ọ̀rọ̀ nípa jíjẹ oúnjẹ nínú àyíká ẹsẹ yìí mu.
- source_word: ἵνα ποιήσω
  choice: láti ṣe
  rationale: Ìlànà “ni láti ṣe” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tí ἵνα pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń tọ́ka sí níbí.
- source_word: τὸ θέλημα
  choice: ìfẹ́
  rationale: “Ìfẹ́” níbí túmọ̀ sí ohun tí ẹni náà fẹ́ kí ó ṣẹlẹ̀; ó jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún θέλημα nínú àyíká yìí.
- source_word: τοῦ πέμψαντός με
  choice: ẹni tí ó rán mi
  rationale: Èyí pa ìtumọ̀ participle tí ó ní article mọ́ láìfi orúkọ oyè kan kún un tí Gíríìkì kò sọ ní tààrà.
- source_word: τελειώσω
  choice: mú ... dé òpin
  rationale: Gbólóhùn yìí sọ ìmúṣẹ dé ìparí tàbí òpin tí a pinnu, èyí tí τελειόω ní lọ́kàn.
- source_word: ἔργον
  choice: iṣẹ́
  rationale: “Iṣẹ́” jẹ́ ìtumọ̀ àdánidá fún ἔργον, ó sì lè tọ́ka sí iṣẹ́ àyànfúnni tí a fi lé Jésù lọ́wọ́.
theological_decisions:
- issue: Ẹni tí “ẹni tí ó rán mi” ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó rán mi,” bí ọ̀rọ̀ Gíríìkì ṣe wí.
  alternative: “Baba tí ó rán mi” tàbí “Ọlọ́run tí ó rán mi.”
  rationale: Àyíká Ìhìn Rere Jòhánù fi hàn pé Baba ni a ń tọ́ka sí, ṣùgbọ́n ẹsẹ yìí kò pe oyè náà ní tààrà; nítorí náà, a kò fi ìtumọ̀ àlàyé sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá àtẹ̀jáde, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó lọ́lá, ó sì ṣe kedere fún òǹkàwé gbogbo ènìyàn. A pa àkàwé “oúnjẹ” mọ́, a sì yẹra fún fífi “Baba” sínú ọ̀rọ̀ pàtàkì níbi tí Gíríìkì kò ti sọ ọ́ ní tààrà.
