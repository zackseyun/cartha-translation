id: JHN.11.34
reference: John 11:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: yo
  text: Ó sì wí pé, “Níbo ni ẹ ti gbé e sí?” Wọ́n wí fún un pé, “Olúwa[a], wá wò ó.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì κύριε tún lè jẹ́ ìpè ìbọ̀wọ̀ sí ẹni kan, bíi “sir”; ṣùgbọ́n “Olúwa” ni a lò gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: ó sì wí pé
  rationale: A pa ìtumọ̀ ọ̀rọ̀ sísọ mọ́ dípò yíyí i sí ‘ó béèrè,’ bí ó tilẹ̀ jẹ́ pé ohun tí ó tẹ̀ lé jẹ́ ìbéèrè.
- source_word: Ποῦ
  choice: Níbo
  rationale: Ọ̀rọ̀ ìbéèrè tààrà tí ń béèrè ibi.
- source_word: τεθείκατε
  choice: ẹ ti tẹ́ ẹ sí
  rationale: Ìṣẹ̀lẹ̀ tí ó ti parí ni perfect náà ń tọ́ka sí; ‘tẹ́ ẹ sí’ bá àyíká fífi òkú sí ibojì mu, ó sì sún mọ́ ìtumọ̀ ‘lay/place’ ju ọ̀rọ̀ tí yóò sọ pé wọ́n ti sin ín lọ.
- source_word: αὐτόν
  choice: ẹ
  rationale: Arọ́pò-orúkọ ẹni akọ kan ṣoṣo tí ń tọ́ka sí Lasaru; ó darapọ̀ mọ́ ọ̀rọ̀-ìṣe nínú ‘tẹ́ ẹ.’
- source_word: λέγουσιν
  choice: Wọ́n wí
  rationale: Bí ó tilẹ̀ jẹ́ pé historical present ni Gíríìkì lò, àkókò tí ó ti kọjá ni ó bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ ìbọ̀wọ̀ àti ìṣeéṣe ìtumọ̀ Kristọ́lọ́jì mọ́, láì fi dandan mú kí ọ̀rọ̀ náà túmọ̀ sí ọ̀kan ṣoṣo nínú méjèèjì.
- source_word: ἔρχου καὶ ἴδε
  choice: wá wò ó
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún àṣẹ tàbí ìpè ‘wá kí o sì rí,’ ó sì pa ìsopọ̀ àwọn ìṣe méjèèjì mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριε nígbà tí a fi ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá / Alàgbà
  rationale: ‘Olúwa’ lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀, ó sì tún lè ru ìtumọ̀ tó jinlẹ̀ nípa ẹni tí Jésù jẹ́. Àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí òǹkàwé mọ̀ pé ìtumọ̀ ọ̀rọ̀ ìbọ̀wọ̀ lásán tún ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ìsọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye. ‘Wí’ pa ìbámu pẹ̀lú λέγω mọ́; ‘tẹ́ ẹ sí’ yẹra fún fífi ‘sin’ kún ọ̀rọ̀ Gíríìkì ní tààrà.
