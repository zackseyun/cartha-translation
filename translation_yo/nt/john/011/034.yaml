    rationale: ‘Tẹ́’ ní Yorùbá máa ń ní ìtumọ̀ ‘press’ tàbí ‘step on’; ó lè yí ìṣe τίθημι (‘place/lay’) padà. ‘Gbé e sí’ sọ ìtumọ̀ fífi sí ibi náà ní kedere, láì kún ìtumọ̀ ‘sin’ sínú ọrọ̀ náà.
  - severity: low
    issue: Aṣàyàn ìsàlẹ̀ ojú ìwé ‘Ọ̀gá’
    rationale: ‘Ọ̀gá’ lè ní ìtumọ̀ ‘boss/master’ nínú ìlò òde òní, ó sì kéré sí ìpè ìbọ̀wọ̀ gbogbogbò tí κύριε lè jẹ́. Ó dáa ju láti ṣàlàyé ìṣe ọ̀rọ̀ náà gẹ́gẹ́ bí ìpè ìbọ̀wọ̀, láì dì í mọ́ ọ̀rọ̀ Yorùbá kan tí kò dájú.
