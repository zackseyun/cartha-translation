review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtàn Gíríìkì dáadáa: ó pa ìbéèrè ibi náà, perfect ti τεθείκατε, arọ́pò-orúkọ akọ tó ń tọ́ka sí Lasaru, àti àwọn àṣẹ méjèèjì mọ́. Ṣùgbọ́n ‘tẹ́ ẹ sí’ sábà máa ń túmọ̀ sí fífi ìfúnpá tẹ ohun kan, kì í ṣe fífi ara òkú sí ibi; nítorí náà kò bá τίθημι mu ní àyíká yìí.'
  naturalness: ‘Níbo ni ẹ ti gbé e sí?’ jẹ́ ọ̀nà Yorùbá boṣewa, àdánidá, àti kedere fún ‘Where have you laid him?’ ‘Wá wò ó’ jẹ́ ìpè àdánidá fún ‘come and see.’
  terminology: ‘Olúwa’ jẹ́ ìtumọ̀ tó yẹ fún Κύριε nínú ìpè sí Jésù, níwọ̀n bí ó ti lè pa ìbọ̀wọ̀ àti ìtumọ̀ tó jinlẹ̀ mọ́. Àlàyé ìsàlẹ̀ ojú ìwé yẹ kí ó ṣàlàyé pé ó tún lè jẹ́ ìpè ìbọ̀wọ̀, láì sọ pé ‘Ọ̀gá’ ni dandan ni aṣàyàn tó sunmọ́ jù.
