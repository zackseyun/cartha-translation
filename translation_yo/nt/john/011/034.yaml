  rationale: A rọ́pò ‘tẹ́ ẹ sí’ pẹ̀lú ‘gbé e sí’ láti mú ìtumọ̀ τίθημι (‘fì sí ibi/gbé sí’) hàn ní Yorùbá àdánidá. A tún ṣe àtúnṣe àlàyé ìsàlẹ̀ ojú ìwé kí ó pa àìdánilójú ìṣe κύριε mọ́ dáadáa.
