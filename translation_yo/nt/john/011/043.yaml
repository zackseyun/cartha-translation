  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: yo
  text: Lẹ́yìn tí ó ti sọ nǹkan wọ̀nyí, ó sì kígbe ní ohùn gíga pé, “Lásárù, jáde wá!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ni; ‘nǹkan wọ̀nyí’ pa ìtumọ̀ ọ̀pọ̀ mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: εἰπὼν
  choice: nígbà tí ó ti sọ
  rationale: Aorist participle náà fi hàn pé sísọ náà ṣáájú ìṣe pàtàkì; àkópọ̀ yìí mú ìtẹ̀lé àkókò náà ṣe kedere ní Yorùbá.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Ó ṣàfihàn bí ohùn náà ṣe ga tó ní ọ̀nà tí ó wọ́pọ̀, tí ó sì bá Yorùbá òde òní mu.
- source_word: ἐκραύγασεν
  choice: ó ké
  rationale: κραυγάζω túmọ̀ sí kíké tàbí pípe ní ohùn gíga; ‘ké’ pa agbára ọ̀rọ̀ náà mọ́ láìjẹ́ àfikún àsọdùn.
- source_word: Λάζαρε
  choice: Lásárù
  rationale: A lo ìrísí orúkọ náà tí ó ti wọ́pọ̀ nínú ìlò Bíbélì Yorùbá, pẹ̀lú àmì ohùn.
- source_word: δεῦρο ἔξω
  choice: jáde wá
  rationale: δεῦρο ń ṣiṣẹ́ bí àṣẹ láti wá, ἔξω sì túmọ̀ sí ìta/jáde; ‘jáde wá’ jẹ́ àṣẹ Yorùbá tí ó ṣe kedere, tí ó sì pa ìdarí méjèèjì mọ́.
theological_decisions:
- issue: Ṣíṣe àṣẹ iṣẹ́ ìyanu náà ní èdè òde òní láìfi ọ̀rọ̀ àtijọ́ tàbí ìtumọ̀ ẹ̀kọ́ ìsìn kún un
  choice: jáde wá
  alternative: wá sí ìta
  rationale: ‘Jáde wá’ jẹ́ ọ̀rọ̀ àṣẹ Yorùbá àdánidá fún δεῦρο ἔξω, ó sì fi hàn pé a ń pe Lásárù láti inú ibojì sí ìta láìṣàlàyé ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. ‘Nígbà tí ó sì ti sọ’ àti ‘jáde wá’ jẹ́ àdánidá fún òǹkàwé gbogbo; a fi àmì ohùn sí ibi tí ó yẹ.
