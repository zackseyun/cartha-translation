id: JHN.11.25
reference: John 11:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Èmi ni àjíǹde àti ìyè. Ẹni tí ó bá gbà mí gbọ́[a], bí ó tilẹ̀ kú, yóò yè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì wà ní ẹyọ kan, ó sì lo ìrísí akọ (“ẹni tí ó gbàgbọ́ … bí ó tilẹ̀ kú”) gẹ́gẹ́ bí aṣojú fún ẹnikẹ́ni. “Ẹni” àti “ó” ní Yorùbá lè tọ́ka sí akọ tàbí abo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: sọ fún un pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìṣílétí ọ̀rọ̀ tààrà hàn; “fún un” pa ẹni abo tó jẹ́ olùgbà ọ̀rọ̀ mọ́ nínú àyíká, bó tilẹ̀ jẹ́ pé arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: “Èmi” mú ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì jáde, “ni” sì sọ ìdánimọ̀ tààrà náà ní ọ̀nà tó ṣeé gbọ́ ní Yorùbá.
- source_word: ἡ ἀνάστασις
  choice: àjíǹde
  rationale: “Àjíǹde” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún jíjí dìde kúrò nínú òkú, ó sì bá ìtumọ̀ ọ̀rọ̀ náà nínú àyíká yìí mu.
- source_word: ἡ ζωή
  choice: ìyè
  rationale: “Ìyè” jẹ́ ọ̀rọ̀ ọ̀wọ̀ àti ti ẹ̀sìn tó ṣe kedere fún ζωή, ó sì pa ìfararora gbolohun “àjíǹde àti ìyè” mọ́.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Ẹni tí ó bá gbà mí gbọ́
  rationale: “Ẹni tí…” pa ìtumọ̀ ẹni kọ̀ọ̀kan tó dúró fún gbogbo irú ẹni mọ́; “gbà mí gbọ́” ni ọ̀nà Yorùbá àdánidá fún ìgbàgbọ́ tí a gbé lé Jésù.
- source_word: κἂν ἀποθάνῃ
  choice: bí ó tilẹ̀ kú
  rationale: Ìtumọ̀ yìí mú ipò ìyọ̀ǹda “àní bí/bó tilẹ̀ jẹ́ pé” inú κἂν àti iṣẹlẹ̀ ikú jáde láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: ζήσεται
  choice: yóò yè
  rationale: “Yóò yè” pa ìlérí ọjọ́ iwájú àti ààyè ìtumọ̀ rẹ̀ mọ́, láìsọ ní pàtó pé “yóò tún jí” nígbà tí ọ̀rọ̀ Gíríìkì kàn sọ pé yóò wà láàyè.
theological_decisions:
- issue: Akọ ẹyọ kan tí a lò gẹ́gẹ́ bí aṣojú nínú ὁ πιστεύων àti àwọn ọ̀rọ̀-ìṣe tó tẹ̀ lé e
  choice: Ẹni tí ó bá gbà mí gbọ́, bí ó tilẹ̀ kú, yóò yè
  alternative: Ẹnikẹ́ni tí ó bá gbà mí gbọ́, kódà bí wọ́n bá kú, wọ́n yóò yè
  rationale: “Ẹni” àti “ó” jẹ́ ẹyọ kan ní Yorùbá, wọn kò sì ní àmì akọ tàbí abo. Nítorí náà, ìtumọ̀ náà pa ẹyọ kan àti ìtumọ̀ aṣojú tó kan gbogbo ènìyàn mọ́ láìfi akọ tàbí abo tí èdè Yorùbá kò nílò kún un.
- issue: Ìwọ̀n ìdánimọ̀ Jésù nínú Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Èmi ni àjíǹde àti ìyè
  alternative: Èmi ni ẹni tí ń fúnni ní àjíǹde àti ìyè
  rationale: Ìtumọ̀ tààrà yìí pa ẹ̀sùn ìdánimọ̀ tó lágbára mọ́; kò sọ ọ́ di iṣẹ́ tí Jésù ń ṣe nìkan, bẹ́ẹ̀ ni kò ṣe àfikún ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ó jẹ́ ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì pa ìtẹnumọ́ àti ìfararora ọ̀rọ̀ Gíríìkì mọ́.
