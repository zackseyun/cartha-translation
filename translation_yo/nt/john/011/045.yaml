source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: yo
  text: Nítorí náà, ọ̀pọ̀ nínú àwọn Júù tí wọ́n wá sọ́dọ̀ Màríà, tí wọ́n sì rí ohun tí ó ṣe, gba òun gbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀pọ̀ láti inú àwọn Júù.” Ní àwọn àyíká kan nínú Jòhánù, àwọn kan tún gbà pé a lè tú Ἰουδαῖοι sí “àwọn ará Jùdíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: Nítorí náà, ọ̀pọ̀
  rationale: “Ọ̀pọ̀” ṣàfihàn iye tí ó pọ̀ láì sọ iye pàtó; “nítorí náà” sì pa ìbáṣepọ̀ àbájáde pẹ̀lú ìṣẹ̀lẹ̀ tí ó ṣáájú mọ́.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: nínú àwọn Júù
  rationale: 'Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ partitive náà hàn: ọ̀pọ̀ láti inú ẹgbẹ́ àwọn Júù.'
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: tí ó wá sọ́dọ̀ Màríà
  rationale: Gbólóhùn náà ń dá àwọn Júù tí a ń sọ̀rọ̀ nípa wọn mọ̀; “wá sọ́dọ̀” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún πρὸς τὴν Μαριὰμ.
- source_word: θεασάμενοι
  choice: tí wọ́n sì rí
  rationale: “Rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún wíwo ohun tí ó ṣẹlẹ̀; “sì” so ìṣe yìí mọ́ wíwá wọn lọ́nà tí ó rọrùn.
- source_word: ἃ ἐποίησεν
  choice: ohun tí ó ṣe
  rationale: Èyí tú neuter plural relative náà sí Yorùbá àdánidá láì fi àlàyé míràn kún un.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: gba òun gbọ́
  rationale: “Gba òun gbọ́” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì dá ìgbàgbọ́ tí ó dojú kọ ẹni náà dúró, bí πιστεύω εἰς ṣe rí nínú Jòhánù.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω εἰς αὐτόν nínú ọ̀rọ̀ ìgbàgbọ́ sí Jésù
  choice: gba òun gbọ́
  alternative: ní ìgbàgbọ́ nínú rẹ̀
  rationale: “Gba òun gbọ́” jẹ́ àdánidá, ó sì pa ìdarí ìgbàgbọ́ sí Jésù mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó ju ti Gíríìkì lọ kún un.
- issue: Ìdánimọ̀ τῶν Ἰουδαίων
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: “Àwọn Júù” ni ìtumọ̀ gbogbogbò tí ó bójú mu níbí; síbẹ̀, nítorí pé Ἰουδαῖοι lè túmọ̀ sí àwọn ará Jùdíà ní àwọn àyíká kan nínú Jòhánù, a tọ́ka sí àṣàyàn náà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. Àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ; a lo “òun” láti mú kí ẹni tí wọ́n gba gbọ́ ṣe kedere.
