id: JHN.11.47
reference: John 11:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: yo
  text: Nítorí náà, àwọn olórí àlùfáà àti àwọn Farisí pe ìgbìmọ̀ jọ, wọ́n sì ń sọ pé, “Kí ni à ń ṣe? Nítorí ọkùnrin yìí ń ṣe àmì púpọ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγον
  choice: pe … jọ
  rationale: Ó sọ ìṣe tí àwọn olórí ṣe láti kó ìgbìmọ̀ náà jọ; ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pípè àpéjọ sílẹ̀.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ yìí hàn gẹ́gẹ́ bí ohun tó tẹ̀ lé iṣẹ́ àmì tí Jésù ṣe nípa Lásárù.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú aláṣẹ láàárín àwọn àlùfáà, kì í ṣe pé gbogbo wọn ló jẹ́ olórí àlùfáà àgbà ní ipò náà.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ Júù náà ni a kọ ní ọ̀nà tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: συνέδριον
  choice: ìgbìmọ̀
  rationale: Ó túmọ̀ nọ́ńbà Gíríìkì náà láìfi orúkọ iṣẹ́ ọnà ‘Sanhedrin’ kún un; nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí ìgbìmọ̀ alákòóso àwọn Júù.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ
  rationale: Àmì àkókò aláìparí nínú Gíríìkì ń fi ọ̀rọ̀ tí ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra hàn.
- source_word: Τί ποιοῦμεν
  choice: Kí ni à ń ṣe?
  rationale: Ó pa ìrísí ìbéèrè àsìkò ìsinsìnyí mọ́, ó sì lè sọ ìdàrúdàpọ̀ wọn àti bí wọn ṣe rí ìṣe wọn gẹ́gẹ́ bí ohun tí kò tó.
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ṣàlàyé ìdí tí wọ́n fi béèrè ìbéèrè náà.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ọkùnrin yìí
  rationale: Ó pa akọ àti ìtẹnumọ́ ọ̀rọ̀ àwọn olùsọ mọ́, pẹ̀lú ìró àfojúdi tó lè wà nínú rẹ̀.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: ń ṣe ọ̀pọ̀lọpọ̀ àmì
  rationale: ‘Ń ṣe’ pa àsìkò ìsinsìnyí mọ́; ‘àmì’ sì pa ìtumọ̀ pàtàkì σημεῖα nínú Jòhánù mọ́ gẹ́gẹ́ bí iṣẹ́ tó ń tọ́ka sí ẹni tí Jésù jẹ́, dípò ṣíṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘iṣẹ́ ìyanu’ nìkan.
theological_decisions:
- issue: Ìtumọ̀ σημεῖα nínú Ìhìn Rere Jòhánù
  choice: àmì
  alternative: iṣẹ́ ìyanu; àmì iṣẹ́ ìyanu
  rationale: Jòhánù máa ń lo ọ̀rọ̀ náà fún àwọn iṣẹ́ Jésù tí ń ṣí ẹni tí ó jẹ́ payá. ‘Àmì’ pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ yẹn mọ́ láìfi àlàyé kun ọ̀rọ̀.
- issue: Ìtumọ̀ συνέδριον
  choice: ìgbìmọ̀
  alternative: Sanhẹ́dírìn; ìgbìmọ̀ alákòóso àwọn Júù
  rationale: A túmọ̀ nọ́ńbà Gíríìkì náà ní kíkún láìpinnu ju ẹ̀rí ọ̀rọ̀ lọ pé ó jẹ́ orúkọ àkànṣe. Àyíká ọ̀rọ̀ fúnra rẹ̀ fi ìgbìmọ̀ aláṣẹ hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lasán. A kò fi àmì àlàyé [a] sí ‘ìgbìmọ̀’ nítorí akọsilẹ̀ Gẹ̀ẹ́sì tí a pèsè kò bá ibi àmì rẹ̀ mu, àlàyé rẹ̀ sì jẹ́ ìdámọ̀ ilé-iṣẹ́ tí ọ̀rọ̀ Gíríìkì kò fi dandan múlẹ̀ gẹ́gẹ́ bí orúkọ àkànṣe.
