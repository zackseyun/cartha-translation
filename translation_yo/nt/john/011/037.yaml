    issue: “pẹ̀lú” ní ìparí gbólóhùn
    rationale: Ní àyíká yìí, “pẹ̀lú” lè túmọ̀ sí ‘together/with,’ ó sì lè mú kí ìtumọ̀ καὶ (‘also’) má ṣe hàn gbangba. “Tún” ní “kò ha tún lè” ṣàfihàn pé ẹni tó la ojú afọ́jú lè ṣe ohun mìíràn náà.
  revised_text: Ṣùgbọ́n àwọn kan lára wọn sọ pé, “Ọkùnrin yìí, ẹni tí ó la ojú ọkùnrin afọ́jú náà, kò ha tún lè ṣe é kí ọkùnrin yìí má kú?”
