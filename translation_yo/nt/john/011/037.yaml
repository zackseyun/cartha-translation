  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Giriki dáadáa: “àwọn kan lára wọn,” ìbéèrè àsọyé “kò ha lè,” àti ìtọ́kasí méjèèjì sí Jésù àti Lásárù ni a pa mọ́. Síbẹ̀, “pẹ̀lú” ní ìparí gbólóhùn lè dà bí ‘papọ̀’ dípò ‘tún/also,’ nítorí náà kò fi ipa καὶ hàn ní kedere.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá ìgbàlódé, ó sì ní àmì ohùn tó yẹ. Fífí “tún” sí iwájú “lè” jẹ́ ọ̀nà àdánidá àti kedere jù lọ fún ìtumọ̀ àfikún náà.
  terminology: “La ojú ọkùnrin afọ́jú náà” jẹ́ ọ̀rọ̀ tó yẹ fún iṣẹ́ ìwòsàn tí a tọ́ka sí. “Ọkùnrin yìí” tún dá ìtọ́kasí pàtó Giriki dúró ní ìbẹ̀rẹ̀ àti ní ìkẹyìn ìbéèrè náà.
  issues:
