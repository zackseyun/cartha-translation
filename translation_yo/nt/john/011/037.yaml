id: JHN.11.37
reference: John 11:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan lára wọn sọ pé, “Ọkùnrin yìí, ẹni tí ó la ojú ọkùnrin afọ́jú náà, kò ha tún lè ṣe é kí ọkùnrin yìí má kú?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ṣùgbọ́n àwọn kan lára wọn
  rationale: “Àwọn kan lára wọn” túmọ̀ ἐξ αὐτῶν ní èdè Yorùbá àdánidá; “Ṣùgbọ́n” sì fi ìyàtọ̀ sí ìhùwàpadà àwọn tí a mẹ́nu kàn ṣáájú hàn.
- source_word: εἶπαν
  choice: sọ pé
  rationale: Aorist náà jẹ́ ìṣẹ̀lẹ̀ ìtàn tí ó pé, nítorí náà ọ̀rọ̀ àtẹ̀yìnwá rírọrùn “sọ pé” bá a mu.
- source_word: Οὐκ ἐδύνατο
  choice: kò ha lè
  rationale: Ọ̀nà ìbéèrè “kò ha lè” pa ìbéèrè àsọyé tí ń retí ìdáhùn rere mọ́, ó sì fi ànímọ́ àríwísí àwọn olùsọ̀rọ̀ hàn láìfikún ẹ̀sùn sí ọ̀rọ̀ náà.
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Demonstrative àkọ́kọ́ tọ́ka sí Jésù ní ọ̀nà pàtó; “ọkùnrin yìí” lágbára ju lílo arọ́pò-orúkọ lásán lọ.
- source_word: ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: ẹni tí ó la ojú ọkùnrin afọ́jú náà
  rationale: Gbólóhùn ìbátan náà dá iṣẹ́ participle dúró, “la ojú” sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún mímú ẹni afọ́jú ríran.
- source_word: ποιῆσαι ἵνα
  choice: ṣe é kí
  rationale: “Ṣe é kí” sọ ìtumọ̀ causative ti ποιῆσαι ἵνα ní Yorùbá àdánidá láìsọ ọ̀rọ̀ náà di àlàyé ju bó ṣe wà lọ.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: '“Pẹ̀lú” mú èrò àfikún náà jáde: ẹni tí ó mú afọ́jú ríran lè tún dá ikú Lásárù dúró.'
- source_word: οὗτος μὴ ἀποθάνῃ
  choice: ọkùnrin yìí má kú
  rationale: “Ọkùnrin yìí” pa demonstrative kejì tí ó tọ́ka sí Lásárù mọ́, “má kú” sì jẹ́ àbájáde odi tí ἵνα-clause náà ń sọ.
theological_decisions:
- issue: Ìró ohùn ìbéèrè àwọn olùsọ̀rọ̀
  choice: Ìbéèrè àsọyé tí ó ní ànímọ́ àní-àní àti àríwísí nípa agbára Jésù láti dá ikú Lásárù dúró
  alternative: Ìbéèrè lásán tí kò ní ànímọ́ àríwísí
  rationale: Οὐκ ἐδύνατο sábà ń retí ìdáhùn pé ó lè ṣe bẹ́ẹ̀; “kò ha lè” pa ìforígbárí náà mọ́ láìyanju ìdí tí Jésù kò fi ṣe bẹ́ẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà mọ́gbọ́n dání fún òǹkàwé lasán, ó sì pa àtúnwí demonstrative méjèèjì mọ́ láti fi Jésù àti Lásárù yà síra.
