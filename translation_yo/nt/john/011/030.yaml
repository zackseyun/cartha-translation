  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: yo
  text: Jésù kò tíì wọ inú ìletò náà, ṣùgbọ́n ó ṣì wà ní ibi tí Mátà ti pàdé rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó ṣe kedere sí i, “níbi tí Mátà ti jáde lọ pàdé rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: kò tíì
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà kò tíì ṣẹlẹ̀ títí di àkókò yìí; èyí ni ọ̀nà Yorùbá àdánidá láti sọ ‘not yet.’
- source_word: δὲ
  choice: ṣùgbọ́n (nípasẹ̀ ìṣètò gbólóhùn)
  rationale: δὲ jẹ́ àsopọ̀ ìtàn tó rọ̀; ní Yorùbá, ìyàtọ̀ tó tẹ̀ lé e mú kí gbólóhùn náà ṣàn dáadáa láìfi ọ̀rọ̀ àfikún sí ìbẹ̀rẹ̀.
- source_word: ἐληλύθει
  choice: wọ inú
  rationale: Nínú àyíká ibi yìí, ó túmọ̀ sí pé Jésù kò tíì dé tàbí wọ inú ìletò náà; ‘wọ inú’ sọ ààlà ìletò náà kedere láìyí ìtumọ̀ padà.
- source_word: κώμην
  choice: ìletò
  rationale: κώμη ń tọ́ka sí àgbègbè kékeré tí ènìyàn ń gbé; ‘ìletò’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún un.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àìwọ inú ìletò àti ṣíṣì wà ní ibi mìíràn.
- source_word: ἔτι
  choice: ṣì
  rationale: Ó tẹnumọ́ pé Jésù ń bá a lọ láti wà ní ibi kan náà.
- source_word: τόπῳ
  choice: ibi
  rationale: ‘Ibi’ jẹ́ ìtumọ̀ Yorùbá tó rọrùn, tó sì tààrà fún τόπος.
- source_word: ὅπου
  choice: tí
  rationale: Nínú gbólóhùn Yorùbá, ‘ibi tí’ ni ọ̀nà àdánidá láti ṣe àfihàn ibi tí ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀.
- source_word: ὑπήντησεν
  choice: ti pàdé
  rationale: Ó dá ìtumọ̀ pàtàkì ‘pàdé’ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó ṣeé ṣe, ‘jáde lọ pàdé,’ mọ́.
- source_word: αὐτῷ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ẹni kẹta yìí tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí Mátà pàdé.
- source_word: Μάρθα
  choice: Mátà
  rationale: Ìkọ̀wé orúkọ náà ní Yorùbá pẹ̀lú àmì ohùn tó yẹ.
