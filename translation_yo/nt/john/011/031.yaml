id: JHN.11.31
reference: John 11:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[a] tí wọ́n wà pẹ̀lú rẹ̀ nínú ilé, tí wọ́n sì ń tù ú nínú, nígbà tí wọ́n rí i pé Màríà dìde kánkán, ó sì jáde, wọ́n tẹ̀ lé e; wọ́n sì rò pé ó ń lọ sí ibojì láti sọkún níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará Jùdíà.” Nínú Jòhánù, Ἰουδαῖοι lè tọ́ka nígbà mìíràn sí àwọn ará Jùdíà ní pàtó tàbí sí àwọn aṣáájú wọn; ṣùgbọ́n níbí, ó ń tọ́ka sí ẹgbẹ́ àwọn tí ń bá Màríà ṣọ̀fọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Nítorí náà, àwọn Júù
  rationale: “Nítorí náà” fi ìtẹ̀síwájú ìtàn tí οὖν ń tọ́ka sí hàn lọ́nà àdánidá. “Àwọn Júù” ni ìtumọ̀ tààrà ti Ἰουδαῖοι ní àyíká yìí, ó sì ń tọ́ka sí àwọn olùṣọ̀fọ̀ tí wọ́n wà pẹ̀lú Màríà, kì í ṣe gbogbo àwọn Júù lápapọ̀.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: tí wọ́n wà pẹ̀lú rẹ̀ nínú ilé
  rationale: Ó pa àpólà aláìlèsọ mọ́ gẹ́gẹ́ bí àlàyé àwọn Júù tí ẹsẹ̀ náà ń sọ̀rọ̀ nípa wọn; “nínú ilé” bá ἐν τῇ οἰκίᾳ mu ní tààrà.
- source_word: παραμυθούμενοι αὐτήν
  choice: tí wọ́n sì ń tù ú nínú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ọ̀rọ̀ ìtùnú fún ẹni tí ìbànújẹ́ bá; “tù ú nínú” jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe náà.
- source_word: ἰδόντες
  choice: nígbà tí wọ́n rí i
  rationale: A tú àpólà aláìlèsọ aorist náà gẹ́gẹ́ bí àkókò láti fi ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn kedere.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: Màríà dìde kánkán, ó sì jáde
  rationale: “Dìde” níbí túmọ̀ sí pé ó gbéra láti ibi tí ó jókòó, kì í ṣe àjíǹde kúrò nínú òkú; “jáde” sì sọ ἐξῆλθεν ní ṣókí.
- source_word: ἠκολούθησαν αὐτῇ
  choice: wọ́n tẹ̀ lé e
  rationale: Ìtumọ̀ rẹ̀ níbí ni títẹ̀ lé ẹnì kan ní ti ara; kò pọndandan kí a fi ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn kún un.
- source_word: δόξαντες
  choice: nítorí wọ́n rò pé
  rationale: Ó fi èrò tàbí àròsọ tí wọ́n ṣe nípa ìdí tí Màríà fi jáde hàn, láìsọ pé ohun tí wọ́n rò dájú.
- source_word: ὑπάγει
  choice: ó ń lọ
  rationale: Àkókò ìsinsìnyí inú ọ̀rọ̀ Gíríìkì náà wúlò ní Yorùbá gẹ́gẹ́ bí “ó ń lọ,” ó sì bá èrò wọn ní àkókò náà mu.
- source_word: εἰς τὸ μνημεῖον
  choice: sí ibojì
  rationale: “Ibojì” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún μνημεῖον ní àyíká ìsìnkú Lásárù.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: láti sọkún níbẹ̀
  rationale: “Láti” fi ète tí ἵνα pẹ̀lú subjunctive ń sọ hàn, “sọkún” sì tú κλαίω lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖοι nínú ìtàn Jòhánù
  choice: Àwọn Júù
  alternative: Àwọn ará Jùdíà
  rationale: Ìlò Ἰουδαῖοι nínú Jòhánù máa ń yí gẹ́gẹ́ bí àyíká ọ̀rọ̀. Níhìn-ín, ó tọ́ka sí ẹgbẹ́ àwọn olùṣọ̀fọ̀ tí wọ́n wà pẹ̀lú Màríà nínú ilé, kì í ṣe fífi ẹ̀sùn kan gbogbo àwọn Júù. A pa “àwọn ará Jùdíà” mọ́ nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ àgbègbè tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye. A gbé àmì àlàyé [a] sí lẹ́yìn “àwọn Júù,” ibi tí àlàyé náà ń tọ́ka sí ní tààrà.
