  to: Nítorí náà, àwọn Júù[a] tí wọ́n wà pẹ̀lú rẹ̀ nínú ilé, tí wọ́n sì ń tù ú nínú, nígbà tí wọ́n rí i pé Màríà dìde kánkán, ó sì jáde, wọ́n tẹ̀ lé e; wọ́n sì rò pé ó ń lọ sí ibojì láti sọkún níbẹ̀.
