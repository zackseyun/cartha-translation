review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the referent, setting, Mary’s rapid departure, the mourners’ following her, and their assumption that she was going to the tomb to weep. However, rendering δόξαντες as “nítorí wọ́n rò pé” introduces an explicit causal relation (“because”) that the Greek participle does not state; it describes their accompanying assumption.
  naturalness: The Yoruba is generally clear and appropriately formal. Recasting the final participial clause with “wọ́n sì rò pé” is more natural in this sequence and avoids implying that their assumption is the stated cause of their following.
  terminology: “Àwọn Júù” is a defensible direct rendering of Ἰουδαῖοι here, with “àwọn ará Jùdíà” retained in the note. “Ibojì” appropriately renders μνημεῖον in this burial context. The footnote is adjusted to describe the group plainly as mourners without over-specifying their social role.
  issues:
  - severity: medium
    issue: The phrase “nítorí wọ́n rò pé” makes the assumption explicitly causal.
    rationale: 'δόξαντες is a circumstantial participle: they followed her, supposing/thinking that she was going to the tomb. The source does not explicitly say they followed her because of that assumption. “Wọ́n sì rò pé” preserves the looser participial relation.'
  revised_text: Nítorí náà, àwọn Júù[a] tí wọ́n wà pẹ̀lú rẹ̀ nínú ilé, tí wọ́n sì ń tù ú nínú, nígbà tí wọ́n rí i pé Màríà dìde kánkán, ó sì jáde, wọ́n tẹ̀ lé e; wọ́n sì rò pé ó ń lọ sí ibojì láti sọkún níbẹ̀.
