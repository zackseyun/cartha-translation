  source_fidelity: Ìtumọ̀ náà fi ìyàtọ̀ δέ, ìtumọ̀ àpá kan nínú ẹgbẹ́ (τινὲς ἐξ αὐτῶν), ìlọ sí àwọn Farisí, àti ìròyìn tí kò dá ète wọn pinnu hàn dáadáa. Àmọ́, ètò ọ̀rọ̀ “sọ ohun ... fún wọn” lè dà bí ẹni pé a ṣe ohun náà fún wọn, dípò pé a sọ ọ́ fún wọn.
