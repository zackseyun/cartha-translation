  terminology: “Àwọn Farisí” àti “Jésù” yẹ, wọ́n sì bá ìlò Yorùbá boṣewa mu. “Ohun tí Jésù ti ṣe” dá ìṣe tí ó ti ṣẹlẹ̀ hàn láìfi ète tàbí ìdálẹ́bi kún un.
