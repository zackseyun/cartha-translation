source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn kan lára wọn lọ sọ́dọ̀ àwọn Farisí, wọ́n sì sọ fún wọn ohun tí Jésù ti ṣe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì ròyìn fún wọn ohun tí Jésù ṣe.” Ọ̀rọ̀ Gíríìkì kò sọ ète àwọn tó lọ bá àwọn Farisí ní kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ṣùgbọ́n àwọn kan lára wọn
  rationale: “Àwọn kan lára wọn” fi hàn pé apá kan nínú ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ni; “Ṣùgbọ́n” sì mú ìyàtọ̀ sí ìdáhùn àwọn tí wọ́n gbàgbọ́ nínú ẹsẹ tó ṣáájú jáde.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: lọ sọ́dọ̀ àwọn Farisí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé wọ́n kúrò níbẹ̀, wọ́n sì lọ bá àwọn Farisí; “lọ sọ́dọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìlọ sí ọ̀dọ̀ àwọn ènìyàn.
- source_word: εἶπαν αὐτοῖς
  choice: wọ́n sì sọ ... fún wọn
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá fún fífi ìṣẹ̀lẹ̀ kan tó ti ṣẹlẹ̀ tó ẹlòmíràn létí, láìfi ète búburú kún ọ̀rọ̀ Gíríìkì.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: ohun tí Jésù ti ṣe
  rationale: “Ohun tí” ṣàkójọ ọ̀pọ̀ nǹkan tí arọ́pò-orúkọ Gíríìkì àpapọ̀ ἃ lè tọ́ka sí; “ti ṣe” fi hàn pé iṣẹ́ náà ti ṣẹlẹ̀ kí wọ́n tó ròyìn rẹ̀.
theological_decisions:
- issue: Ète àwọn tó lọ sọ fún àwọn Farisí
  choice: A lo ọ̀rọ̀ ìròyìn tí kò dá wọn lẹ́bi tàbí sọ ète wọn
  alternative: Wọ́n lọ fẹ̀sùn kan Jésù tàbí wọ́n lọ fi Jésù hàn
  rationale: Gíríìkì sọ pé wọ́n lọ sọ ohun tí Jésù ṣe fún àwọn Farisí, ṣùgbọ́n kò sọ ète wọn ní kedere. Ìtumọ̀ náà kò gbọdọ̀ dá ìdí wọn pinnu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún gbogbo ènìyàn. A lo “Farisí” gẹ́gẹ́ bí orúkọ ẹgbẹ́ ẹ̀sìn náà.
