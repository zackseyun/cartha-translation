id: JHN.11.4
reference: John 11:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Jésù gbọ́ ọ̀rọ̀ náà, ó sọ pé, “Àìsàn yìí kì í ṣe fún ikú[a], ṣùgbọ́n ó jẹ́ fún ògo Ọlọ́run, kí Ọmọ Ọlọ́run lè gba ògo nípasẹ̀ rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í yọrí sí ikú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ikú kì í ṣe àbájáde tàbí ète ìkẹyìn àìsàn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí Jésù gbọ́ ọ̀rọ̀ náà
  rationale: Ọ̀rọ̀-ìṣe aláìlópìn aorist participle náà fi ipò àkókò ọ̀rọ̀ Jésù hàn. “Ọ̀rọ̀ náà” ni a fi kún un láti inú àyíká, ìyẹn ìròyìn nípa àìsàn Lásárù.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìlọsíwájú pẹ̀lú ìyàtọ̀ díẹ̀ hàn nínú ìtàn náà, ó sì bá ìdáhùn Jésù mu.
- source_word: ἀσθένεια
  choice: Àìsàn
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì gbòòrò tó láti ṣàpèjúwe ipò Lásárù láìdún bí ọ̀rọ̀ ìṣègùn àkànṣe.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: kì í ṣe fún ikú
  rationale: “Fún ikú” lè tọ́ka sí ète tàbí àbájáde, ó sì pa ìfọ̀rọ̀wọ́rọ̀ inú èdè Gíríìkì mọ́ láì sọ pé Lásárù kò ní kú rárá nínú ìṣẹ̀lẹ̀ náà.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: ó wà fún ògo Ọlọ́run
  rationale: Ó sọ ète tàbí àǹfààní tí àìsàn náà ń sìn, ó sì pa ìtumọ̀ ògo Ọlọ́run mọ́.
- source_word: ἵνα δοξασθῇ
  choice: kí a lè ... yin ... lógo
  rationale: Gbólóhùn “kí a lè” fi ète hàn, “a” aláìdárúkọ sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe àfipamọ́ passive náà.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ìtumọ̀ tààrà, tó ṣe kedere, tí ó sì pa oyè Kristi náà mọ́.
- source_word: δι’ αὐτῆς
  choice: tipasẹ̀ rẹ̀
  rationale: Ó fi ọ̀nà tàbí ohun èlò tí a ó fi yin Ọmọ náà lógo hàn; arọ́pò-orúkọ náà tọ́ka sí àìsàn náà.
theological_decisions:
- issue: Ìtumọ̀ “kì í ṣe fún ikú” bí ó tilẹ̀ jẹ́ pé Lásárù kú lẹ́yìn náà
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ohun tó lè túmọ̀ sí pé ikú kì í ṣe òpin tàbí ète ìkẹyìn àìsàn náà.
  alternative: Kí a túmọ̀ rẹ̀ bí ìsọtẹ́lẹ̀ pẹlẹbẹ pé Lásárù kò ní kú, tàbí pé àìsàn náà kì í ṣe àìsàn aṣekúpani.
  rationale: Àyíká ìtàn fi hàn pé Lásárù kú ní ti gidi (11:14), nítorí náà a kò gbọdọ̀ mú ìforígbárí kúrò nípa fífi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
- issue: Ìbáṣepọ̀ láàárín ògo Ọlọ́run àti yíyìn Ọmọ Ọlọ́run lógo
  choice: 'A pa gbólóhùn méjèèjì mọ́ lọ́tọ̀: àìsàn náà wà fún ògo Ọlọ́run, àti pé a ó tipasẹ̀ rẹ̀ yin Ọmọ Ọlọ́run lógo.'
  alternative: Kí a da àwọn méjèèjì pọ̀ sí gbólóhùn gbogbogbò kan nípa ògo Ọlọ́run.
  rationale: Èdè Gíríìkì sọ ògo Ọlọ́run àti yíyìn Ọmọ náà lógo ní pàtó; pípa àwọn méjèèjì mọ́ kò fi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì yẹra fún ọ̀rọ̀ ìṣègùn líle àti àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ náà.
