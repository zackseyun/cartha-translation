revisions:
- from: Nítorí náà, nígbà tí Jésù rí i tí ó ń sunkún, tí ó sì rí àwọn Júù[a] tí wọ́n bá a wá tí wọ́n ń sunkún pẹ̀lú, inú ẹ̀mí rẹ̀ ru gidigidi[b], ó sì da ara rẹ̀ láàmú.
  to: Nítorí náà, nígbà tí Jésù rí i tí ó ń sunkún, àti àwọn Júù[a] tí wọ́n wá pẹ̀lú Màríà tí wọ́n ń sunkún, ó kùn nínú ẹ̀mí rẹ̀[b], ó sì da ara rẹ̀ láàmú.
  rationale: A ṣàtúnṣe ìṣọ̀kan gbolohun náà kí “rí” kan ṣàkóso Màríà àti àwọn Júù, a sì sọ “pẹ̀lú Màríà” ní kedere láti yẹra fún ìtọ́kasí tí kò dájú. A fi “ó kùn nínú ẹ̀mí rẹ̀” rọ́pò ìsọ̀rọ̀ tí kò rọrùn; èyí pa agbára ìmọ̀lára náà mọ́ láìpinnu bóyá ìbínú, ìrora, tàbí ìdààmú tó jinlẹ̀ ni. A pa “ó sì da ara rẹ̀ láàmú” mọ́ láti ṣojú ἑαυτόν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:16Z'
