id: JHN.11.33
reference: John 11:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Jésù rí i tí ó ń sunkún, àti àwọn Júù[a] tí wọ́n wá pẹ̀lú Màríà tí wọ́n ń sunkún, ó kùn nínú ẹ̀mí rẹ̀[b], ó sì da ara rẹ̀ láàmú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará Jùdíà.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwọn Júù tó wá bá Màríà ṣọ̀fọ̀, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀-ìṣe náà tún lè túmọ̀ sí “ó bínú” tàbí “inú rẹ̀ ru gidigidi”; ó ń fi ìrúkèrúdò inú tó lágbára hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú àti ìyọrísí ìṣẹ̀lẹ̀ tó ṣáájú hàn ní ọ̀nà tó ṣe kedere ní Yorùbá.
- source_word: ὡς εἶδεν
  choice: nígbà tí ... rí
  rationale: ὡς pẹ̀lú ọ̀rọ̀-ìṣe aorist jẹ́ ti àkókò níbí; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: κλαίουσαν / κλαίοντας
  choice: ń sunkún
  rationale: Ó túmọ̀ sí ẹkún tí a lè gbọ́, ó sì yẹ fún Màríà àti àwọn tó bá a wá láìfi dandan sọ pé wọ́n ń pohùn réré.
- source_word: συνελθόντας αὐτῇ
  choice: tí wọ́n bá a wá
  rationale: Ó fi hàn pé àwọn náà wá papọ̀ pẹ̀lú rẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn láti lóye.
- source_word: Ἰουδαίους
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ààlà ọ̀rọ̀ náà hàn pé àwọn Júù tó wá bá Màríà ṣọ̀fọ̀ ni, kì í ṣe gbogbo àwọn Júù.
- source_word: ἐνεβριμήσατο
  choice: inú ẹ̀mí rẹ̀ ru gidigidi
  rationale: Ó pa agbára ìmọ̀lára inú mọ́ láìpinnu bóyá ìbínú, ìkorò ọkàn, tàbí ìbànújẹ́ gan-an ni.
- source_word: τῷ πνεύματι
  choice: inú ẹ̀mí rẹ̀
  rationale: Ó pa ibi tí ìrúkèrúdò inú náà ti ṣẹlẹ̀ mọ́, ó sì bá ìtumọ̀ ti Gíríìkì mu.
- source_word: ἐτάραξεν ἑαυτόν
  choice: ó sì da ara rẹ̀ láàmú
  rationale: Ó pa ọ̀rọ̀ arọ́pò-orúkọ olùṣe ἑαυτόν mọ́, dípò kí a sọ ọ́ di pé ìdààmú wulẹ̀ dé bá a.
theological_decisions:
- issue: Irú ìmọ̀lára Jésù nínú ἐνεβριμήσατο
  choice: inú ẹ̀mí rẹ̀ ru gidigidi
  alternative: ó bínú; inú rẹ̀ ru gidigidi
  rationale: Ọ̀rọ̀ Gíríìkì fi ìmọ̀lára inú tó lágbára hàn, ṣùgbọ́n kò mú kó dájú bóyá ìbínú, ìkorò ọkàn, tàbí ìbànújẹ́ ni. Ìtumọ̀ àkọ́kọ́ pa àìdájú àti ẹ̀dọ̀fu ìtumọ̀ yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. A tún “ń sunkún” ṣe fún àwọn méjèèjì láti pa ìfarajọ́ ọ̀rọ̀ Gíríìkì mọ́. “Ó da ara rẹ̀ láàmú” jẹ́ díẹ̀ ní àmì pàtàkì, ṣùgbọ́n ó mọ̀ọ́mọ̀ pa ìṣe olùṣe sí ara rẹ̀ nínú ἐτάραξεν ἑαυτόν mọ́.
