  to: Àwọn ọmọ ẹ̀yìn rẹ̀ sọ fún un pé,[a] “Rábì, ṣẹ́ṣẹ́ ni àwọn Júù ń wá ọ̀nà láti fi òkúta sọ ọ́, ṣé ìwọ tún ń lọ síbẹ̀?”
