id: JHN.11.8
reference: John 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: yo
  text: Àwọn ọmọ ẹ̀yìn rẹ̀ sọ fún un pé,[a] “Rábì, ṣẹ́ṣẹ́ ni àwọn Júù ń wá ọ̀nà láti fi òkúta sọ ọ́, ṣé ìwọ tún ń lọ síbẹ̀?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà,” tàbí, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe lè túmọ̀ sí, “àwọn aṣáájú Júù.” Jòhánù sábà máa ń lo “àwọn Júù” fún àwọn tó ń tako Jésù ní Jùdíà, kì í ṣe fún gbogbo àwọn Júù lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: sọ
  rationale: Ìsinsìnyí ìtàn ní Gíríìkì ni a túmọ̀ gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ ní àkókò tó kọjá, èyí sì bá ìtàn Yorùbá òde òní mu.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa oyè Sẹ́mítíkì tí Gíríìkì kọ ní ìró mọ́, dípò yíyí i sí ‘Olùkọ́,’ kí irú ọ̀nà tí àwọn ọmọ ẹ̀yìn gbà ń pe Jésù nínú Jòhánù lè dúró.
- source_word: νῦν
  choice: láìpẹ́ yìí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí bí ìhalẹ̀ náà ṣe ṣẹ̀ṣẹ̀ wáyé, kì í ṣe kìkì ‘nísinsìnyí.’
- source_word: ἐζήτουν
  choice: ń wá ọ̀nà
  rationale: Ìṣe aláìpé náà fi ìgbìyànjú tàbí ìṣe tó ń bá a lọ ní àkókò tó kọjá hàn; ‘ń wá ọ̀nà’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: λιθάσαι
  choice: láti sọ ọ́ ní òkúta
  rationale: Èyí túmọ̀ sí lílò òkúta láti kọlu ẹni; a kò fi ‘pa’ kún un nítorí bí ó tilẹ̀ jẹ́ pé ikú lè jẹ́ ète náà, Gíríìkì kò sọ ọ́ ní gbangba.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ ọ̀rọ̀ náà ní tààràtà. Nítorí pé nínú Jòhánù ó lè tọ́ka ní pàtó sí àwọn ará Jùdíà tàbí àwọn aṣáájú Júù tó ń tako Jésù, a fi àwọn àṣàyàn yẹn sínú àlàyé ìsàlẹ̀.
- source_word: πάλιν
  choice: tún
  rationale: Ó sọ pé ìlọ síbẹ̀ yóò tún wáyé lẹ́ẹ̀kan sí i.
- source_word: ὑπάγεις
  choice: fẹ́ lọ
  rationale: Ìbéèrè Yorùbá ‘ṣé ìwọ tún fẹ́ lọ’ sọ ìyàlẹ́nu àti àníyàn àwọn ọmọ ẹ̀yìn lọ́nà àdánidá, nígbà tí ó pa ìtumọ̀ lílọ sí ibi náà mọ́.
- source_word: ἐκεῖ
  choice: síbẹ̀
  rationale: Ọ̀rọ̀ ibi yìí ń tọ́ka padà sí Jùdíà, ibi tí ewu náà wà.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; tàbí, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe lè túmọ̀ sí, àwọn aṣáájú Júù
  rationale: A pa ìtumọ̀ ọ̀rọ̀ náà ní tààràtà mọ́ nínú ẹsẹ̀, ṣùgbọ́n a kò fẹ́ kí a gbọ́ ọ́ bí ẹni pé gbogbo àwọn Júù ni ó ń tọ́ka sí. Àlàyé ìsàlẹ̀ pa ìtumọ̀ tó ṣeé ṣe nínú àyíká Jòhánù mọ́ láìfi ìtumọ̀ kan ṣoṣo lé ẹsẹ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ìtàn tó bójú mu, tó sì yé àwọn òǹkàwé òde òní. A lo ‘Rábì’ gẹ́gẹ́ bí oyè àdákọ-ohùn; a sì lo ‘ṣé’ láti mú ìbéèrè ìyàlẹ́nu náà dun bí Yorùbá àdánidá.
