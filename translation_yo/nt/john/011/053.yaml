  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: yo
  text: Nítorí náà, láti ọjọ́ yẹn lọ, wọ́n gbèrò láti pa á.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: láti ọjọ́ yẹn lọ
  rationale: Ọ̀rọ̀ yìí fi ọjọ́ yẹn hàn gẹ́gẹ́ bí ìbẹ̀rẹ̀ ète kan tí ó ń bá a lọ; ‘láti ọjọ́ yẹn lọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti mú ìtumọ̀ yẹn jáde.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde ohun tí ó ṣẹlẹ̀ ní ìpàdé ìgbìmọ̀ ṣáájú hàn, ó sì pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐβουλεύσαντο
  choice: wọ́n gbèrò
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n jíròrò dé orí ète tí wọ́n fẹ́ mú ṣẹ, kì í ṣe pé wọ́n kàn ronú lásán.
- source_word: ἵνα ἀποκτείνωσιν
  choice: láti pa
  rationale: Ìrísí ἵνα pẹ̀lú ọ̀rọ̀-ìṣe náà sọ ète ìgbèrò wọn; ‘láti pa’ jẹ́ èdè Yorùbá tí ó ṣe kedere, tí kò sì fi ìlànà ìdájọ́ kan kún ọ̀rọ̀ náà.
- source_word: αὐτόν
  choice: á
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Jésù nínú àyíká ọ̀rọ̀, ‘á’ sì jẹ́ arọ́pò-orúkọ olùgbà ẹnìkẹta tó bá ‘pa’ mu ní Yorùbá.
theological_decisions:
- issue: Irú ète tí àwọn aṣáájú ní sí Jésù
  choice: Ṣe ọ̀rọ̀ náà bí ète tí wọ́n ti gbèrò láti pa á, láì dín in kù sí ìjíròrò lásán.
  alternative: Wọ́n ń jíròrò bóyá kí wọ́n pa á; wọ́n ronú láti dájọ́ ikú fún un.
  rationale: Gíríìkì fi ìyípadà sí ète pípa tí ó ṣe pàtàkì hàn lẹ́yìn ìpàdé ìgbìmọ̀ náà. ‘Gbèrò láti pa á’ pa líle ète náà mọ́ láì fi ìtumọ̀ òfin tàbí ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ó jẹ́ èdè àdánidá, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní.
