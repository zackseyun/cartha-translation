id: JHN.11.9
reference: John 11:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: yo
  text: Jésù dáhùn pé, “Ṣé ọjọ́ kì í ní wákàtí méjìlá? Bí ẹnì kan bá ń rìn ní ọ̀sán, kì í kọsẹ̀, nítorí ó rí ìmọ́lẹ̀ ayé yìí.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ náà, “ìmọ́lẹ̀ ayé yìí,” lè tún ru àkòrí ìmọ́lẹ̀ Ọlọ́run tí ó wọ́pọ̀ nínú ìwé Jòhánù; síbẹ̀, a pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ó ti rí ní Gíríìkì láìfi ìtumọ̀ pàtó lé e lórí.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: Jésù dáhùn pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣe àfihàn ọ̀rọ̀ ìdáhùn nínú ìtàn, láìfi ìtumọ̀ míì kún un.
- source_word: Οὐχὶ δώδεκα ὧραί εἰσιν τῆς ἡμέρας;
  choice: Wákàtí méjìlá kọ́ ni ó wà nínú ọ̀sán bí?
  rationale: Ìbéèrè yìí ń retí ìdáhùn bẹ́ẹ̀ ni; ‘kọ́ ... bí?’ mú agbára ìbéèrè àsọyé náà jáde. ‘Ọ̀sán’ túmọ̀ sí àkókò ìmọ́lẹ̀ ọjọ́ níbí, kì í ṣe gbogbo ọjọ́ alẹ́ àti ọ̀sán.
- source_word: ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ
  choice: Bí ẹnì kan bá ń rìn ní ọ̀sán
  rationale: ‘Ẹnì kan’ pa ìtumọ̀ àpapọ̀ tí τις ní mọ́; àkópọ̀ ‘bá ń rìn’ fi ìṣe tí a gbé kalẹ̀ gẹ́gẹ́ bí ipò hàn.
- source_word: οὐ προσκόπτει
  choice: kì í kọsẹ̀
  rationale: ‘Kọsẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe àfihàn ìkọlù ẹsẹ̀ ní ti gidi, ó sì tún lè ru ìtumọ̀ àpẹẹrẹ láìyanju rẹ̀.
- source_word: ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει
  choice: nítorí ó rí ìmọ́lẹ̀ ayé yìí
  rationale: Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì fi àǹfààní ìtumọ̀ jinlẹ̀ ti ‘ìmọ́lẹ̀’ sílẹ̀ láìsọ pé ó tọ́ka sí Jésù ní pàtó.
theological_decisions:
- issue: Agbára àmì tàbí ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ inú ‘ìmọ́lẹ̀ ayé yìí’
  choice: Pa àwòrán ìmọ́lẹ̀ lasán mọ́ nínú ẹsẹ̀ náà, kí a má ṣe ṣàlàyé rẹ̀ gẹ́gẹ́ bí Jésù tàbí ìtọ́sọ́nà Ọlọ́run ní pàtó.
  alternative: Túmọ̀ ọ́ ní gbangba gẹ́gẹ́ bí ìtọ́ka sí Jésù tàbí ìmọ́lẹ̀ láti ọ̀dọ̀ Ọlọ́run.
  rationale: Nínú Jòhánù, ‘ìmọ́lẹ̀’ lè ní ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ tó jinlẹ̀, ṣùgbọ́n gbólóhùn yìí tún dúró gẹ́gẹ́ bí àpẹẹrẹ nípa rírìn ní ìmọ́lẹ̀ ọ̀sán. A pa ìṣòro àti ìṣọ̀kan méjèèjì mọ́ láìfi ìtumọ̀ kan lé e lórí.
- issue: Ẹni àpapọ̀ nínú τις ... βλέπει
  choice: Lo ‘ẹnì kan ... ó,’ èyí tí kò fi akọ tàbí abo hàn.
  alternative: Lo ‘ọkùnrin kan ... ó’ láti fi akọ hàn.
  rationale: Τις jẹ́ arọ́pò-orúkọ àìdánimọ̀ tó lè tọ́ka sí ẹnikẹ́ni; Yorùbá kò ní arọ́pò-orúkọ ẹni kẹta tó yà akọ sí abo, nítorí náà ‘ẹnì kan ... ó’ jẹ́ pípé sí èdè orísun àti àdánidá ní Yorùbá.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá. ‘Ọ̀sán’ ni a yàn fún ἡμέρα nítorí ìyàtọ̀ ọ̀sán sí alẹ́ ni àyíká ẹsẹ̀ náà ń sọ, ‘wákàtí’ sì jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn lóye.
