language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: yo
  text: Inú mi sì dùn nítorí yín pé èmi kò wà níbẹ̀, kí ẹ lè gbàgbọ́.[a] Ṣùgbọ́n ẹ jẹ́ kí a lọ sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ lè bẹ̀rẹ̀ sí í gbàgbọ́.” Aorist subjunctive nínú èdè Gíríìkì lè tẹnu mọ́ ìbẹ̀rẹ̀ ìgbàgbọ́, ṣùgbọ́n a fi “gbàgbọ́” sí ọ̀rọ̀ àkọ́kọ́ nítorí pé ó gbòòrò sí i, kò sì fi ìtumọ̀ kún un ju bó ṣe wà nínú ọ̀rọ̀ náà lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Inú mi dùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan yọ̀ tàbí pé inú rẹ̀ dùn, ó sì bá ìṣe onítẹ̀síwájú ẹni àkọ́kọ́ mu.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn náà tọ́ka sí àǹfààní àwọn ọmọ-ẹ̀yìn; ‘nítorí yín’ jẹ́ èdè Yorùbá àdánidá tí ó lè gbé ìtumọ̀ ‘fún ire yín’.
- source_word: ἵνα πιστεύσητε
  choice: kí ẹ lè gbàgbọ́
  rationale: ἵνα pẹ̀lú aorist subjunctive fi ète hàn. ‘Kí ẹ lè gbàgbọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ète náà láìfi dandan pinnu bóyá ó túmọ̀ sí bẹ̀rẹ̀ sí í gbàgbọ́ tàbí kí ìgbàgbọ́ wọn túbọ̀ jinlẹ̀.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: pé èmi kò sí níbẹ̀
  rationale: ‘Pé’ ṣàgbékalẹ̀ ohun tí inú Jésù dùn sí, ‘èmi kò sí níbẹ̀’ sì túmọ̀ imperfect εἰμί pẹ̀lú ἐκεῖ ní kedere.
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ àti ìyípadà láti inú àlàyé sí ìgbésẹ̀ hàn ní èdè Yorùbá àdánidá.
- source_word: ἄγωμεν
  choice: ẹ jẹ́ kí a lọ
  rationale: Subjunctive ẹni àkọ́kọ́ púpọ̀ jẹ́ ọ̀rọ̀ ìṣírí; ‘ẹ jẹ́ kí a lọ’ ni ìṣàfihàn Yorùbá tó yẹ.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: ‘Sọ́dọ̀ rẹ̀’ fi ìlọ sí ọ̀dọ̀ ẹni kan hàn lọ́nà Yorùbá àdánidá, ó sì bá πρός pẹ̀lú accusative mu.
theological_decisions:
- issue: Agbára ìtumọ̀ πιστεύσητε nínú àyíká Ìhìn Rere Jòhánù
  choice: gbàgbọ́
  alternative: bẹ̀rẹ̀ sí í gbàgbọ́
  rationale: Aorist subjunctive lè ní ìtumọ̀ ìbẹ̀rẹ̀ ìgbàgbọ́, ṣùgbọ́n ọ̀rọ̀ náà kò fi dandan sọ pé àwọn ọmọ-ẹ̀yìn kò ní ìgbàgbọ́ tẹ́lẹ̀. ‘Gbàgbọ́’ pa àìdánilójú àti ìfọ̀kànsìn ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò. A lo ‘ẹ’ fún àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó yẹ. Ìtúmọ̀ náà tẹ̀ lé ìṣètò àti ìtumọ̀ Gíríìkì, ṣùgbọ́n ó yàgò fún gbólóhùn tí kò wọ́pọ̀ ní Yorùbá.
