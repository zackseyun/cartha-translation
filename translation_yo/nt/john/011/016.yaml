source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: yo
  text: Nítorí náà, Tómà[a], ẹni tí a ń pè ní Dídímù, wí fún àwọn ọmọ-ẹ̀yìn ẹlẹgbẹ́ rẹ̀ pé, “Ẹ jẹ́ kí àwa náà lọ, kí a lè bá a kú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dídímù jẹ́ ọ̀rọ̀ Gíríìkì tó túmọ̀ sí “Ìbejì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú ọ̀rọ̀ àti ìyọrísí láti inú àsọyé tó ṣáájú hàn; ó bá èdè Yorùbá àjọṣe mu.
- source_word: Θωμᾶς
  choice: Tọ́màsì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe àwọn orúkọ Bíbélì ní Yorùbá.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: ẹni tí a ń pè ní Dídímù
  rationale: Ó pa orúkọ Gíríìkì náà mọ́, nígbà tí àlàyé ìtumọ̀ rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: τοῖς συμμαθηταῖς
  choice: fún àwọn ọmọ-ẹ̀yìn ẹlẹgbẹ́ rẹ̀
  rationale: Ó túmọ̀ sí àwọn tí wọ́n jẹ́ ọmọ-ẹ̀yìn pọ̀; fífi ‘rẹ̀’ kún un mú ìbáṣepọ̀ Tọ́màsì pẹ̀lú wọn ṣe kedere lọ́nà àdánidá.
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: Ẹ jẹ́ kí àwa náà lọ
  rationale: Ó pa ìṣírí aláṣẹ ẹni àkọ́kọ́ púpọ̀ àti ìtẹnumọ́ καὶ ἡμεῖς mọ́.
- source_word: ἵνα ἀποθάνωμεν
  choice: kí a lè ... kú
  rationale: Ó fi ète tàbí àbájáde tí ἵνα pẹ̀lú ọ̀rọ̀-ìṣe subjunctive lè tọ́ka sí hàn, láì pinnu ìmọ̀lára Tọ́màsì.
- source_word: μετ’ αὐτοῦ
  choice: bá a kú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n kú pẹ̀lú ẹni náà, ẹni tí àyíká ọ̀rọ̀ fi hàn pé Jesu ni.
theological_decisions:
- issue: Ìró ohùn àti ète ọ̀rọ̀ Tọ́màsì
  choice: A túmọ̀ gbólóhùn náà ní tààrà láì fi ìtumọ̀ ìmọ̀lára kún un.
  alternative: A lè kà á sí ìgboyà àti ìṣòtítọ́, ìrẹ̀wẹ̀sì tí kò nírètí, tàbí ọ̀rọ̀ ẹ̀gàn.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìró ohùn rẹ̀ ní pàtó; ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa Dídímù mọ́ gẹ́gẹ́ bí orúkọ inú ọ̀rọ̀, a sì ṣàlàyé ìtumọ̀ rẹ̀ ní ìsàlẹ̀.
