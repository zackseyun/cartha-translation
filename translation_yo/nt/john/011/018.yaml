  text: ἦν δὲ ⸀ἡ Βηθανία ἐγγὺς τῶν Ἱεροσολύμων ὡς ἀπὸ σταδίων δεκαπέντε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: yo
  text: Bẹ́tánì sì wà nítòsí Jerúsálẹ́mù, ní nǹkan bí sítádíọ̀ mẹ́ẹ̀ẹ́dógún sí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nǹkan bí máìlì méjì, tàbí ó fẹ́rẹ̀ẹ́ tó kìlómítà mẹ́ta.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ oníwọ̀nba ni δέ níbí, tó ń tẹ ìtàn náà síwájú láìfi ìtakora líle hàn; “sì” jẹ́ ọ̀nà àdánidá láti gbé e jáde ní Yorùbá.
- source_word: Βηθανία
  choice: Bẹ́tánì
  rationale: Orúkọ ibìkan ni; a ṣe àkọsílẹ̀ ohùn rẹ̀ ní ìbámu pẹ̀lú bí Yorùbá ṣe máa ń kọ orúkọ yìí.
- source_word: ἐγγὺς
  choice: sún mọ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìsúnmọ́ nípa ibi; “sún mọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: Ἱεροσολύμων
  choice: Jerúsálẹ́mù
  rationale: Èyí ni àkọsílẹ̀ Yorùbá tó wọ́pọ̀ fún orúkọ ìlú náà.
- source_word: ὡς
  choice: ó tó ìwọ̀n
  rationale: Níwájú ìwọ̀n jíjìn, ὡς fi hàn pé iye náà kì í ṣe gírígírí; “ó tó ìwọ̀n” pa ìtumọ̀ àfojúsùn yẹn mọ́.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: sítádíọ̀ mẹ́ẹ̀ẹ́dógún síbẹ̀
  rationale: A pa òṣùwọ̀n ayé ìgbàanì náà mọ́ nínú ẹsẹ̀, “síbẹ̀” sì mú ìtumọ̀ ἀπό gẹ́gẹ́ bí jíjìn sí Jerúsálẹ́mù hàn. A ṣàlàyé rẹ̀ pẹ̀lú òṣùwọ̀n òde òní nínú àlàyé ìsàlẹ̀.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa sítádíọ̀, òṣùwọ̀n inú orísun, mọ́ nínú ẹsẹ̀, a sì fi ìwọ̀n tí òǹkàwé òde òní mọ̀ sí àlàyé ìsàlẹ̀.
