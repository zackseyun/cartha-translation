  source_fidelity: Ìtumọ̀ náà tọ́ka sí Bẹ́tánì, Jerúsálẹ́mù, àti sítádíọ̀ mẹ́ẹ̀ẹ́dógún, ṣùgbọ́n “síbẹ̀” túmọ̀ sí “níbẹ̀” kò sì fi jíjìnnà “láti Jerúsálẹ́mù” hàn dáadáa. “Ó tó ìwọ̀n” náà kò rọrùn gẹ́gẹ́ bí ọ̀nà láti ṣàfihàn ὡς nínú gbolohun yìí.
