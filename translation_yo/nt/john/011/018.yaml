  to: Bẹ́tánì sì wà nítòsí Jerúsálẹ́mù, ní nǹkan bí sítádíọ̀ mẹ́ẹ̀ẹ́dógún sí i.[a]
  rationale: 'Àtúnṣe náà pa ìtumọ̀ Gíríìkì mọ́: δέ gẹ́gẹ́ bí “sì,” ἐγγύς gẹ́gẹ́ bí “wà nítòsí,” ὡς gẹ́gẹ́ bí “ní nǹkan bí,” àti ἀπό gẹ́gẹ́ bí “sí i,” èyí tí ó tọ́ka sí Jerúsálẹ́mù. Ó tún mú gbolohun náà rọrùn sí i nínú Yorùbá.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:02Z'
review_pass:
