  to: Máàtá sọ fún un pé, “Mo mọ̀ pé yóò jíǹde nígbà àjíǹde[a] ní ọjọ́ ìkẹyìn.”
  rationale: Àtúnṣe náà lo ‘Máàtá,’ orúkọ Yorùbá Bíbélì tí ó wọ́pọ̀ fún Martha, ó sì rọ́pò ‘jí dìde’ pẹ̀lú ‘jíǹde’ láti fi ìtumọ̀ àjíǹde ἀναστήσεται hàn kedere. A tún gbe àmì ìsàlẹ̀ sí lẹ́yìn ‘nígbà àjíǹde,’ ibi tí ìyàtọ̀ ìtumọ̀ náà ti wúlò, láì fi ìtumọ̀ tàbí ẹ̀kọ́ mìíràn kún ẹsẹ̀ náà.
