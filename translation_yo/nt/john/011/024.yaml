  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ gbólóhùn Gíríìkì náà dáadáa: Mátà fi ìdánilójú rẹ̀ hàn nípa àjíǹde ọjọ́ ìkẹyìn. Síbẹ̀, ‘jí dìde’ lè tọ́ka sí jíjíná kúrò nínú oorun tàbí dídìde lásán; ‘jíǹde’ jẹ́ ọ̀rọ̀ tí ó péye, tí ó sì wọ́pọ̀ jù fún àjíǹde nínú àyíká yìí.'
