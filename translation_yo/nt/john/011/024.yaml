id: JHN.11.24
reference: John 11:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: yo
  text: Máàtá sọ fún un pé, “Mo mọ̀ pé yóò jíǹde nígbà àjíǹde[a] ní ọjọ́ ìkẹyìn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àjíǹde ní ọjọ́ ìkẹyìn.”
    reason: Ọ̀rọ̀ ἐν lè jẹ́ kí a túmọ̀ gbólóhùn náà lọ́nà tí ó sún mọ́ ìṣètò ọ̀rọ̀ Gíríìkì; ‘nígbà àjíǹde’ sì jẹ́ Yorùbá tí ó túbọ̀ ṣe kedere pé àkókò ni a ń tọ́ka sí.
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ Μάρθα
  choice: Mátà sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì lo ọ̀rọ̀ ìṣe ìsinsìnyí nínú ìtàn, àkókò tí ó ti kọjá (‘sọ’) ni ó bá ìtàn Yorùbá òde òní mu. ‘Fún un’ fi ẹni tí Mátà ń bá sọ̀rọ̀ hàn lọ́nà àdánidá.
- source_word: Οἶδα
  choice: Mo mọ̀
  rationale: Èyí túmọ̀ sí ìmọ̀ tàbí ìdánilójú; ‘Mo mọ̀’ jẹ́ ọ̀nà tààrà, tí ó sì pa ìdánilójú Mátà mọ́.
- source_word: ἀναστήσεται
  choice: yóò jí dìde
  rationale: Nínú ọ̀rọ̀ nípa àjíǹde, ọ̀rọ̀ ìṣe náà túmọ̀ sí pé ẹni náà yóò dìde kúrò nínú ikú. ‘Jí dìde’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá láìyí ojú tí ọ̀rọ̀ ìṣe Gíríìkì gbà sọ ọ́ sí ti ìṣe àìṣeṣe.
- source_word: ἐν τῇ ἀναστάσει
  choice: nígbà àjíǹde
  rationale: ‘Nígbà’ mú ìtọ́kasí àkókò tí ἐν ní níbí jáde ní Yorùbá tí ó ṣe kedere, nígbà tí ‘àjíǹde’ pa ìtumọ̀ pàtó ti resurrection mọ́.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: ní ọjọ́ ìkẹyìn
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún àkókò ọjọ́ náà, ó sì pa ìtọ́kasí sí ọjọ́ òpin mọ́.
theological_decisions:
- issue: Ìtọ́kasí sí àjíǹde ọjọ́ ìkẹyìn
  choice: A pa gbólóhùn pàtó náà mọ́ gẹ́gẹ́ bí ‘àjíǹde ní ọjọ́ ìkẹyìn.’
  alternative: Ìrètí gbogbogbò nípa ìyè lẹ́yìn ikú
  rationale: Àpapọ̀ ἀναστήσεται, ἀνάστασις, àti ‘ọjọ́ ìkẹyìn’ tọ́ka sí àjíǹde ọjọ́ iwájú ní òpin, kì í ṣe ìyè lẹ́yìn ikú lásán. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì kọ orúkọ Μάρθα sí ‘Mátà’ gẹ́gẹ́ bí ìlò Yorùbá.
