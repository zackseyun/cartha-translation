source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: yo
  text: Ọ̀pọ̀ nínú àwọn Júù sì ti wá sọ́dọ̀ Mátà àti Màríà láti tù wọ́n nínú nípa arákùnrin wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀pọ̀ lára àwọn ará Jùdíà sì ti wá sọ́dọ̀ Mátà àti Màríà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn Júù lápapọ̀ tàbí, ní àwọn àyíká kan nínú Jòhánù, àwọn ará Jùdíà ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Ọ̀pọ̀ ... sì
  rationale: Ọ̀pọ̀ túmọ̀ sí ‘ọ̀pọ̀ ènìyàn’; ‘sì’ ń gbé ìsopọ̀ δέ jáde lọ́nà àdánidá láìfi ìtakora líle kún un.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: nínú àwọn Júù
  rationale: Ẹ̀ka ọ̀rọ̀ náà jẹ́ partitive, ìyẹn ‘ọ̀pọ̀ láti inú àwọn Júù.’ ‘Nínú àwọn Júù’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ gbogbogbò ti ẹgbẹ́ ẹ̀yà àti ẹ̀sìn mọ́; àṣàyàn ‘àwọn ará Jùdíà’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐληλύθεισαν
  choice: ti wá
  rationale: Ìṣe náà wáyé ṣáájú àkókò ìtàn tí a ń sọ; ‘ti wá’ fi ìṣe tó ti ṣẹlẹ̀ ṣáájú hàn ní Yorùbá.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: sọ́dọ̀ Mátà àti Màríà
  rationale: πρός pẹ̀lú accusative ń tọ́ka sí lílọ tàbí wíwá bẹ ẹni wò; ‘sọ́dọ̀’ bá ọ̀rọ̀ náà mu lọ́nà àdánidá.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: láti tù wọ́n nínú
  rationale: ἵνα pẹ̀lú subjunctive ń fi ète hàn. παραμυθέομαι túmọ̀ sí títù ẹni nínú tàbí fífún ẹni ní ìtùnú nígbà ọ̀fọ̀.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: nítorí arákùnrin wọn
  rationale: Nínú àyíká ọ̀fọ̀ yìí, περί ń sọ ohun tó fa ìtùnú náà. Bó tilẹ̀ jẹ́ pé Gíríìkì ní ‘arákùnrin náà’ ní singular, ‘arákùnrin wọn’ jẹ́ Yorùbá àdánidá, nítorí Lasaru jẹ́ arákùnrin àwọn méjèèjì.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú Ìhìn Rere Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ẹsẹ̀ yìí ń ṣàpèjúwe àwọn olùṣọ̀fọ̀, kì í ṣe àwọn aláṣẹ ọ̀tá. Nítorí náà, ìtumọ̀ ẹ̀yà àti ẹ̀sìn tó gbòòrò, ‘àwọn Júù,’ bá àyíká mu jù; ṣùgbọ́n a pa ‘àwọn ará Jùdíà’ mọ́ gẹ́gẹ́ bí àṣàyàn nítorí bí Jòhánù ṣe lè lo ọ̀rọ̀ náà ní àwọn ibi kan.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘tù wọ́n nínú’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá fún ìtùnú nígbà ọ̀fọ̀; àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
