id: JHN.11.3
reference: John 11:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: yo
  text: Nítorí náà, àwọn arábìnrin náà ránṣẹ́ sí i pé, “Olúwa, wò ó, ẹni tí o fẹ́ràn ń ṣàìsàn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: ránṣẹ́ sí i
  rationale: Ó túmọ̀ sí pé wọ́n fi ìròyìn ránṣẹ́ sí Jésù; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, kò sì fi kún ọ̀nà tí wọ́n gbà fi iṣẹ́ náà ránṣẹ́.
- source_word: Κύριε
  choice: Olúwa
  rationale: Àkọlé ìbọ̀wọ̀ tó bá ọ̀rọ̀ Gíríìkì mu, tí ó sì pa ìtumọ̀ rẹ̀ sí ‘Olúwa’ mọ́.
- source_word: ἴδε
  choice: wò ó
  rationale: Ó pa agbára àṣẹ-ìfiyèsí inú ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà Yorùbá tó ṣeé lóye; nínú àyíká yìí, kì í ṣe pé Jésù ń rí aláìsàn náà ní ojú ara.
- source_word: ὃν φιλεῖς
  choice: ẹni tí o fẹ́ràn
  rationale: Ó ṣe àfihàn ìfẹ́ ara ẹni àti ìbátan tímọ́tímọ́ tí φιλέω ń tọ́ka sí, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: ἀσθενεῖ
  choice: ń ṣàìsàn
  rationale: 'Ìṣe tó ń lọ lọ́wọ́ yìí ni ọ̀rọ̀ Gíríìkì fi hàn: ẹni náà wà ní àìsàn.'
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἴδε nínú àdúrà ìròyìn sí Jésù
  choice: wò ó
  alternative: kíyèsí i / wò ó pé
  rationale: ‘Wò ó’ pa ìrọ̀rùn àti ìtẹnumọ́ ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, láìsọ pé Jésù kò mọ ohun tó ṣẹlẹ̀ tàbí pé ó rí Lásárù ní ojú ara.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọlọ́lá, tó sì ṣeé lóye lójoojúmọ́. A lo ‘àwọn arábìnrin’ fún àwọn obìnrin méjì tí wọ́n jẹ́ arábìnrin sí ara wọn, àti àsopọ̀ ‘Nítorí náà’ láti pa οὖν mọ́.
