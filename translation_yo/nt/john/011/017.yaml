  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Jésù dé, ó rí i pé Lásárù ti wà nínú ibojì fún ọjọ́ mẹ́rin tẹ́lẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: nígbà tí Jésù dé
  rationale: Aorist participle náà ń fi ìṣe tí ó ṣáájú εὗρεν hàn. Gbólóhùn yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé Jésù kọ́kọ́ dé, lẹ́yìn náà ni ó rí ipò náà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì pa ìṣàn ìtàn náà mọ́.
- source_word: εὗρεν
  choice: ó rí i pé
  rationale: Nínú àyíká yìí, εὗρεν túmọ̀ sí pé Jésù rí tàbí mọ ipò tí ó wà nígbà tí ó dé; ‘ó rí i pé’ jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: αὐτὸν
  choice: Lásárù
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Lásárù. Sísọ orúkọ rẹ̀ ní gbangba mú ìtumọ̀ náà ṣe kedere láìfi ìsọfúnni tuntun kún un.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: ti wà ... fún ọjọ́ mẹ́rin
  rationale: Ìkọ́lé Gíríìkì náà ń sọ iye àkókò tí ó ti kọjá. ‘Ti wà ... fún ọjọ́ mẹ́rin’ jẹ́ ọ̀nà àdánidá ní Yorùbá, tí ‘ti’ sì ń mú ìtumọ̀ ἤδη (‘tẹ́lẹ̀ rí/nígbà náà’) jáde láìjẹ́ kí gbólóhùn wuwo.
- source_word: μνημείῳ
  choice: ibojì
  rationale: Nínú àyíká ìsìnkú yìí, μνημεῖον jẹ́ ibi tí a sin òkú sí; ‘ibojì’ ni ọ̀rọ̀ Yorùbá tó péye, tó sì wọ́pọ̀ jù lọ.
theological_decisions:
- issue: Ṣíṣàlàyé ẹni tí αὐτόν ń tọ́ka sí
  choice: Lásárù
  alternative: òun / pé ó ti wà nínú ibojì
  rationale: Kì í ṣe ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ tí ariyanjiyan wà lórí. Àyíká Gíríìkì fi hàn pé Lásárù ni ọ̀rọ̀ náà ń tọ́ka sí; lílo orúkọ rẹ̀ dènà àìyedè ní Yorùbá.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yẹra fún gbólóhùn tí ó le tàbí ti ẹ̀sìn ẹgbẹ́ kan ṣoṣo.
