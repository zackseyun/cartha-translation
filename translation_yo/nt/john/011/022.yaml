id: JHN.11.22
reference: John 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí pàápàá[a], mo mọ̀ pé ohunkóhun tí o bá béèrè lọ́wọ́ Ọlọ́run[b], Ọlọ́run yóò fún ọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àti nísinsin yìí mo mọ̀.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè túmọ̀ sí “àti” lásán; ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó tún lè fi ìyípadà onítakò hàn lẹ́yìn tí Mátà sọ̀rọ̀ nípa ikú Lásárù.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà ní Gíríìkì, “ohunkóhun tí o bá béèrè Ọlọ́run.” Yorùbá sábà máa ń sọ irú èyí ní “béèrè lọ́wọ́ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Ṣùgbọ́n nísinsin yìí pàápàá
  rationale: “Ṣùgbọ́n” mú ìyípadà onítakò inú ọ̀rọ̀ Mátà jáde, nígbà tí “nísinsin yìí pàápàá” pa agbára àkókò νῦν mọ́, ó sì túmọ̀ sí pé bí ó tilẹ̀ jẹ́ pé Lásárù ti kú, ìgbẹ́kẹ̀lé rẹ̀ ṣì dúró.
- source_word: οἶδα
  choice: mo mọ̀
  rationale: οἶδα jẹ́ ọ̀rọ̀ arọ́pò-ìṣe pípé tí ó ní ìtumọ̀ ìsinsin; “mo mọ̀” ni ìtumọ̀ Yorùbá tó ṣe kedere jù.
- source_word: ὅσα ἂν
  choice: ohunkóhun tí ... bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń sọ ohun tí kò ní ààlà tàbí ohun yòówù; ìṣètò “ohunkóhun tí ... bá” jẹ́ ọ̀nà àdánidá láti fi èyí hàn ní Yorùbá.
- source_word: αἰτήσῃ τὸν θεὸν
  choice: tí o bá béèrè lọ́wọ́ Ọlọ́run
  rationale: Ní Gíríìkì, Ọlọ́run ni olùgbà ìbéèrè náà ní tààrà; “béèrè lọ́wọ́ Ọlọ́run” jẹ́ àṣà èdè Yorùbá tó dára fún bíbéèrè ohun kan láti ọ̀dọ̀ Ọlọ́run láìfi ohun mìíràn kún ọ̀rọ̀ náà.
- source_word: δώσει σοι ὁ θεός
  choice: Ọlọ́run yóò fún ọ
  rationale: Ó pa ìṣe ọjọ́ iwájú àti olùṣe tí a sọ ní gbangba mọ́. Ìṣáájú “ohunkóhun” ti jẹ́ kí ohun tí Ọlọ́run yóò fún un ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ọ̀rọ̀ Mátà nípa Jésù tí ń béèrè lọ́wọ́ Ọlọ́run lè jẹ́ kí àwọn kan ka ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ sínú rẹ̀.
  choice: 'A pa ọ̀rọ̀ Mátà mọ́ bí ó ṣe wà: Jésù ń béèrè lọ́wọ́ Ọlọ́run, Ọlọ́run sì ń fún un.'
  alternative: Ṣíṣe àlàyé “Ọlọ́run” sí “Baba,” tàbí yí ọ̀rọ̀ náà padà láti dín ìfarahàn ìtẹríba kù.
  rationale: Ẹsẹ̀ náà ń ròyìn ọ̀rọ̀ Mátà. Ìtumọ̀ gbọ́dọ̀ pa ìnira àti ìlọsíwájú ẹ̀kọ́ Kristi nínú ìtàn Jòhánù mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀n tó ní àmì ohùn, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. “Nísinsin yìí pàápàá” jẹ́ àdánidá fún “even now,” “béèrè lọ́wọ́” sì jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ìbéèrè tí a béèrè láti ọ̀dọ̀ ẹnì kan.
