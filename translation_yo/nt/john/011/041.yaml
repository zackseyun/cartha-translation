  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: yo
  text: Nítorí náà, wọ́n gbé òkúta náà kúrò. Jésù sì gbé ojú rẹ̀ sókè[a], ó sì wí pé, “Baba, mo dúpẹ́ lọ́wọ́ rẹ pé o ti gbọ́ mi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó rọrùn sí i, “ó wo sókè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “o gbọ́ mi.” Èyí sún mọ́ ìtumọ̀ tààrà ti ọ̀rọ̀ Gíríìkì náà; “o ti gbọ́ mi” tẹnu mọ́ ìṣe tó ti parí tí ó sì ní pàtàkì ní àsìkò yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: wọ́n gbé ... kúrò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé ohun kúrò ní ibi rẹ̀; ní àyíká ibojì yìí, gbígbé òkúta náà kúrò ni ìtumọ̀ tó ṣe kedere jù.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ohun tí wọ́n ṣe jẹ́ èsì sí àṣẹ Jésù nínú ẹsẹ tó ṣáájú.
- source_word: λίθον
  choice: òkúta náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún òkúta tí a fi dí ẹnu ibojì.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: gbé ojú rẹ̀ sókè
  rationale: Ó pa àwòrán inú èdè Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé ó darí ojú rẹ̀ sókè.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, ó jẹ́ àsopọ̀ ìtàn kékeré, kì í ṣe àmì ìtakora líle.
- source_word: Πάτερ
  choice: Baba
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè tààrà tí Jésù fi ń bá Ọlọ́run sọ̀rọ̀, láìfi ọ̀rọ̀ míì kún un.
- source_word: εὐχαριστῶ σοι
  choice: mo dúpẹ́ lọ́wọ́ rẹ
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá, tó sì sọ ìdúpẹ́ tó wà nínú ọ̀rọ̀ Gíríìkì ní kíkún.
- source_word: ὅτι ἤκουσάς μου
  choice: pé o ti gbọ́ mi
  rationale: Àkókò 'ti ...' fi iṣẹ́ tí ó ti ṣẹlẹ̀ tí ó sì ṣe pàtàkì ní ìsinsìnyí hàn; 'gbọ́ mi' tún jẹ́ kí ìtumọ̀ gbígbọ́ àdúrà wà láìfi àlàyé tí kò sí nínú ọ̀rọ̀ náà kún un.
theological_decisions:
- issue: Ọ̀nà tí Jésù gbà pe Ọlọ́run nínú àdúrà
  choice: Baba
  alternative: Ìwọ Baba
  rationale: Ọ̀rọ̀ ìpè ṣókí yìí pa ìbátan tímọ́tímọ́ àti ọ̀wọ̀ inú Gíríìkì mọ́, láìsọ ọ́ di ọ̀rọ̀ ìjọsìn àtijọ́ tàbí láìfi ẹ̀kọ́ ẹ̀sìn kan kún un.
- issue: Ìtumọ̀ ἤκουσάς μου nínú àyíká àdúrà
  choice: o ti gbọ́ mi
  alternative: o gbọ́ mi
  rationale: Ó fi hàn pé Baba ti gbọ́ Jésù, ṣùgbọ́n kò ṣàlàyé ju ohun tí ẹsẹ náà sọ lọ nípa bí Ọlọ́run ṣe ń dáhùn àdúrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní ọ̀wọ̀ ni a lò. A pa àwòrán gbígbé ojú sókè mọ́, a sì lo àwọn àmì ohùn níbi tí ó yẹ.
