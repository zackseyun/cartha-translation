id: JHN.11.48
reference: John 11:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: yo
  text: Bí a bá jẹ́ kí ó máa bá a lọ báyìí, gbogbo ènìyàn yóò gbàgbọ́ nínú rẹ̀, àwọn ará Róòmù yóò sì wá, wọn yóò gba ibi wa[a] àti orílẹ̀-èdè wa[b] kúrò lọ́wọ́ wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tẹ́ńpìlì wa.” Ọ̀rọ̀ Gíríìkì náà sọ pé “ibi wa”; ó lè tọ́ka pàtó sí tẹ́ńpìlì, tàbí ní ọ̀nà gbígbòòrò sí ibi tàbí ipò wọn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn ènìyàn wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: jẹ́ kí ó máa bá a lọ báyìí
  rationale: Ọ̀rọ̀ yìí fi ìtumọ̀ fífi ààyè gba ẹni kan hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kí a jẹ́ kí ohun tí ó ń ṣe tẹ̀ síwájú báyìí.
- source_word: πάντες
  choice: gbogbo ènìyàn
  rationale: Ó mú ìtumọ̀ gbogbogbò ti ọ̀rọ̀ Gíríìkì náà jáde ní Yorùbá tí ó ṣe kedere.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: yóò gbà á gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bá àṣà ọ̀rọ̀ Jòhánù mu fún gbígbàgbọ́ nínú ẹni kan.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: àwọn ará Róòmù yóò wá
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣe ọjọ́ iwájú àti olùṣe rẹ̀ ní tààràtà.
- source_word: ἀροῦσιν
  choice: wọn yóò gba ... kúrò lọ́wọ́ wa
  rationale: Ó pa ìtumọ̀ ‘mú kúrò’ tàbí ‘gbà kúrò’ mọ́ láìfi ìtumọ̀ líle jù bí ‘parun’ kún un.
- source_word: τόπον
  choice: ibi
  rationale: ‘Ibi’ pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́; ó lè tọ́ka sí tẹ́ńpìlì tàbí sí ipò àti àyè wọn ní gbogbogbòò.
- source_word: ἔθνος
  choice: orílẹ̀-èdè
  rationale: Ó bá ìbẹ̀rù nípa ìgbésẹ̀ ìṣèlú àwọn ará Róòmù mu, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè túmọ̀ sí ‘àwọn ènìyàn’.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: ibi wa àti orílẹ̀-èdè wa
  rationale: Àtúnṣe ‘wa’ lẹ́yìn ọ̀kọ̀ọ̀kan àwọn ọ̀rọ̀ orúkọ méjèèjì jẹ́ àdánidá ní Yorùbá, ó sì fi hàn pé ἡμῶν kan àwọn méjèèjì.
theological_decisions:
- issue: Ohun tí ‘ibi wa’ (τόπον) ń tọ́ka sí
  choice: A fi ‘ibi wa’ sí ọ̀rọ̀ pàtàkì láìsọ pé tẹ́ńpìlì nìkan ni.
  alternative: tẹ́ńpìlì wa; tàbí ipò/àṣẹ wa
  rationale: Ó ṣeé ṣe kí àwọn olùsọ̀rọ̀ máa bẹ̀rù fún tẹ́ńpìlì àti fún ipò wọn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà gbòòrò ju ìtumọ̀ kan ṣoṣo lọ. Nítorí náà, ìtumọ̀ yìí pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá àpéjọ tí ó bójú mu, tí ó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, kí ìtumọ̀ àfidípò má bà a dàpọ̀ mọ́ apá mìíràn nínú ẹsẹ náà.
