- from: Ọkùnrin tí ó ti kú náà sì jáde wá, a fi aṣọ ìsìnkú dì í ní ẹsẹ̀ àti ní ọwọ́, a sì fi aṣọ dì í ní ojú. Jésù sọ fún wọn pé, “Ẹ tú u, kí ẹ sì jẹ́ kí ó máa lọ.”
  to: Ọkùnrin tí ó ti kú náà sì jáde wá, a fi àwọn aṣọ ìsìnkú dì í ní ẹsẹ̀ àti ní ọwọ́, a sì fi aṣọ kan dì ojú rẹ̀. Jésù sọ fún wọn pé, “Ẹ tú u, kí ẹ sì jẹ́ kí ó lọ.”
  rationale: 'Àtúnṣe náà ṣàlàyé ìdí tí aṣọ kejì fi wà: a dì ojú rẹ̀ yíká pẹ̀lú aṣọ kan. Ó tún ṣe ọ̀pọ̀ ‘aṣọ ìsìnkú’ láti bá κειρίαις mu. A pa ìlànà gbolohun, àṣẹ Jésù, àti ìtumọ̀ tí kò fi ẹ̀kọ́ kún ọ̀rọ̀ mọ́.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ti ẹsẹ̀ náà dáadáa: ẹni tí ó kú jáde, ọwọ́ àti ẹsẹ̀ rẹ̀ ní ìdìpọ̀ aṣọ ìsìnkú, ojú rẹ̀ sì ní aṣọ ìbòrí, Jésù sì pa áṣẹ pé kí a tú u kí a jẹ́ kó lọ. Ṣùgbọ́n gbolohun ‘a sì fi aṣọ dì í ní ojú’ lè jẹ́ kí ‘ní ojú’ dà bí ibi tí a ti dì í, dípò kí ó sọ kedere pé ojú rẹ̀ ni a dì yíká pẹ̀lú aṣọ náà.'
  naturalness: ‘A sì fi aṣọ kan dì ojú rẹ̀’ jẹ́ Yorùbá boṣewa tí ó mọ́gbọ́n dání, ó sì fi ìbáṣepọ̀ aṣọ náà pẹ̀lú ojú rẹ̀ hàn kedere. Lílò ‘àwọn aṣọ ìsìnkú’ tún fara mọ́ ọ̀pọ̀ κειρίαις.
  terminology: ‘Àwọn aṣọ ìsìnkú’ yẹ fún κειρίαις láì pinnu bóyá wọ́n jẹ́ ìlà aṣọ tàbí ìdì. ‘Aṣọ kan’ yẹ fún σουδαρίῳ, aṣọ kan tí a dì yíká ojú. ‘Ẹ tú u’ àti ‘jẹ́ kí ó lọ’ pa ìmọ̀ aṣẹ méjèèjì mọ́, láì fi ìtumọ̀ ẹ̀kọ́ míì kún un.
  issues:
  - severity: medium
    issue: Ìtọ́kasí ojú nínú gbolohun aṣọ ìbòrí kò ṣe kedere tó.
    rationale: ‘A fi aṣọ dì í ní ojú’ lè túmọ̀ sí dí ẹni náà ní agbègbè ojú. Giriki náà sọ pé ojú rẹ̀ gan-an ni aṣọ kan dì yíká (ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο); nítorí náà, ‘dì ojú rẹ̀’ jẹ́ kedere síi.
  revised_text: Ọkùnrin tí ó ti kú náà sì jáde wá, a fi àwọn aṣọ ìsìnkú dì í ní ẹsẹ̀ àti ní ọwọ́, a sì fi aṣọ kan dì ojú rẹ̀. Jésù sọ fún wọn pé, “Ẹ tú u, kí ẹ sì jẹ́ kí ó lọ.”
