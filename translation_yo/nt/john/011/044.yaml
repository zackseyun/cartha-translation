id: JHN.11.44
reference: John 11:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: yo
  text: Ọkùnrin tí ó ti kú náà sì jáde wá, a fi àwọn aṣọ ìsìnkú dì í ní ẹsẹ̀ àti ní ọwọ́, a sì fi aṣọ kan dì ojú rẹ̀. Jésù sọ fún wọn pé, “Ẹ tú u, kí ẹ sì jẹ́ kí ó lọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: Ọkùnrin tí ó ti kú náà
  rationale: Participle perfect naa n tọka si ẹni ti o ti ku, pẹlu ipo iku naa gẹgẹ bi abẹlẹ; ‘ọkùnrin’ jẹ adayeba ninu Yoruba nibi.
- source_word: κειρίαις
  choice: aṣọ ìsìnkú
  rationale: Ọrọ naa tọka si awọn aṣọ tabi okùn aṣọ ti a fi n di oku; yiyan yii ye oluka ode-oni lai sọ pato ju orisun lọ.
- source_word: ἡ ὄψις αὐτοῦ
  choice: ojú
  rationale: Ninu ayika yii, ọrọ naa tumọ si oju/iwaju rẹ; ‘ojú’ jẹ itumọ Yoruba adayeba.
- source_word: σουδαρίῳ
  choice: aṣọ
  rationale: O jẹ aṣọ kekere ti a fi yi oju tabi ori ka; ‘aṣọ’ pa itumọ gbooro orisun mọ lai fi iru aṣọ ti ko daju kun.
- source_word: Λύσατε
  choice: Ẹ tú u
  rationale: Aṣẹ ọpọ eniyan ni, lati tu awọn ohun ti a fi di i.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: kí ẹ sì jẹ́ kí ó máa lọ
  rationale: Ṣe afihan aṣẹ lati jẹ ki o lọ, pẹlu ìrìn-lọ ti ὑπάγειν.
theological_decisions:
- issue: Akoko-ọrọ λέγει (present tense) ninu itan
  choice: Jésù sọ fún wọn
  alternative: Jésù ń sọ fún wọn
  rationale: Present itan Giriki maa n ṣiṣẹ bi ọna sisọ iṣẹlẹ ti o kọja; Yoruba adayeba lo ‘sọ’ nibi, lai yi akoonu ẹkọ pada.
- issue: Boya ἄφετε ... ὑπάγειν tumọ si itusilẹ lasan tabi ominira ẹmi
  choice: kí ẹ sì jẹ́ kí ó máa lọ
  alternative: ẹ dá a sílẹ̀
  rationale: Yiyan yii duro mọ aṣẹ ti ara ninu iṣẹlẹ naa, ko si gbe itumọ ẹkọ ti ọrọ orisun ko sọ kedere wọle.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, adayeba, pẹlu àmì ohùn ni kikun. A lo iṣeto gbolohun ti o rọrun fun oluka ode-oni, ṣugbọn a pa awọn alaye pataki ti Giriki mọ.
