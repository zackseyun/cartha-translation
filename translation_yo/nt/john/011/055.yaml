base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: yo
  text: Àjọ Ìrékọjá àwọn Júù[a] sì ti sún mọ́, ọ̀pọ̀ ènìyàn sì gòkè lọ sí Jerúsálẹ́mù láti ìgbèríko ṣáájú Àjọ Ìrékọjá, kí wọ́n lè ṣe ìwẹ̀nùmọ́ fún ara wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àjọ Ìrékọjá Júù.” Ní ti gidi jù lọ, Gíríìkì sọ pé “Àjọ Ìrékọjá àwọn Júù,” èyí tí Jòhánù máa ń lò léraléra.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, kí wọ́n ṣe ìwẹ̀nùmọ́ gẹ́gẹ́ bí àṣà ìsìn láti múra sílẹ̀ fún Àjọ Ìrékọjá.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: sì ti
  rationale: “Sì” ń gbé ìsopọ̀ pẹ̀lẹ́ tí δέ ní, “ti” sì jẹ́ kí gbólóhùn náà ṣàn lọ́nà àdánidá ní Yorùbá láìfi ìtumọ̀ ìtakora tàbí ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐγγὺς
  choice: sún mọ́lé
  rationale: Ó sọ pé àkókò àjọ náà ti fẹ́ dé; ọ̀rọ̀ yìí ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: Àjọ Ìrékọjá àwọn Júù
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ẹni-ní-nǹkan Gíríìkì mọ́ ní ọ̀nà tí ó bá èdè Yorùbá mu, ó sì ṣètìlẹ́yìn fún ọ̀nà tí Jòhánù ń gbà tún gbólóhùn yìí lò.
- source_word: ἀνέβησαν
  choice: gòkè lọ
  rationale: Ó pa ìmọ̀ pé ìrìnàjò náà lọ sókè sí Jerúsálẹ́mù mọ́, bóyá nípa ilẹ̀ àti nípa àṣà ìrìn-àjò ìjọsìn.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ajẹtífù Gíríìkì dúró gẹ́gẹ́ bí orúkọ; fífi “ènìyàn” kún un mú un ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́mù
  rationale: “Sí” fi ìdarí ìrìnàjò hàn ní kedere, ó sì bá lílo Yorùbá pẹ̀lú orúkọ ìlú mu.
- source_word: ἐκ τῆς χώρας
  choice: láti ìgbèríko
  rationale: Nínú àyíká yìí, χώρα ń tọ́ka sí ilẹ̀ tàbí àwọn agbègbè tí ó wà lẹ́yìn òde ìlú; “ìgbèríko” fi ìyàtọ̀ rẹ̀ sí Jerúsálẹ́mù hàn lọ́nà àdánidá.
- source_word: πρὸ τοῦ πάσχα
  choice: ṣáájú Àjọ Ìrékọjá
  rationale: Ó jẹ́ ìtumọ̀ àkókò tààrà tí ó ṣe kedere ní Yorùbá.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: kí wọ́n lè ṣe ìwẹ̀nùmọ́ fún ara wọn
  rationale: “Kí wọ́n lè” fi ète ἵνα hàn; “ṣe ìwẹ̀nùmọ́ fún ara wọn” sì pa ìtumọ̀ ìwẹ̀nùmọ́ ti àṣà ìsìn mọ́ láìsọ ọ́ di ìwà-mímọ́ inú tàbí ẹ̀kọ́ ìgbà mìíràn.
theological_decisions:
- issue: Irú ìwẹ̀nùmọ́ tí a ṣe ṣáájú Àjọ Ìrékọjá
  choice: ṣe ìwẹ̀nùmọ́ fún ara wọn
  alternative: sọ ara wọn di mímọ́; wẹ ara wọn mọ́ ní ti àṣà
  rationale: Àyíká náà tọ́ka sí ìmúrasílẹ̀ ti àṣà ìsìn Júù fún Àjọ Ìrékọjá. Ìtumọ̀ yìí kò sọ ọ́ di ẹ̀kọ́ nípa ìwẹ̀nùmọ́ ọkàn, ìwà rere, tàbí àṣà ìjọ Kristẹni.
translation_notes:
  register: A lo Yorùbá ìpele àárín tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. “Àjọ Ìrékọjá” ni a lò fún πάσχα, “gòkè lọ” sì pa àwọ̀ ìrìn-àjò sí Jerúsálẹ́mù mọ́. A gbe àmì [a] lẹ́gbẹ̀ẹ́ gbólóhùn tí ó ń ṣàlàyé, a sì gbe [b] lẹ́gbẹ̀ẹ́ ìwẹ̀nùmọ́, kí akọsilẹ̀ kọ̀ọ̀kan bá ohun tí ó ń ṣàlàyé mu.
