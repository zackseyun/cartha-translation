  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: yo
  text: Kò sọ èyí láti inú ara rẹ̀[a]; ṣùgbọ́n, gẹ́gẹ́ bí olórí àlùfáà ní ọdún náà, ó sọ àsọtẹ́lẹ̀ pé Jésù yóò kú[b] fún orílẹ̀-èdè náà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lórí èrò ara rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí pé, “Jésù máa kú” tàbí “a ti pinnu pé Jésù yóò kú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “fún àǹfààní orílẹ̀-èdè náà” tàbí “ní ipò orílẹ̀-èdè náà.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ ... ἀφ’ ἑαυτοῦ οὐκ εἶπεν
  choice: Kì í ṣe láti inú ara rẹ̀ ni ó ti sọ èyí
  rationale: Èyí pa ìtumọ̀ orísun ọ̀rọ̀ mọ́, ó sì jẹ́ Yorùbá àdánidá; kò fi ọ̀rọ̀ àsopọ̀ tó lágbára kún δέ.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ṣùgbọ́n nítorí tí ó jẹ́ olórí àlùfáà ní ọdún náà
  rationale: ‘Olórí àlùfáà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἀρχιερεύς; ‘nítorí tí’ mú ìtumọ̀ ipò/ìdí inú ọ̀rọ̀ aláìlópìn náà jáde láì sọ ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐπροφήτευσεν
  choice: ó sọ àsọtẹ́lẹ̀
  rationale: Ó tọ́ka sí ọ̀rọ̀ àsọtẹ́lẹ̀ gidi, láì fi kún un pé Káyáfà mọ gbogbo ìtumọ̀ ọ̀rọ̀ tirẹ̀ tàbí pé ìwà rẹ̀ dára.
- source_word: ἔμελλεν Ἰησοῦς ἀποθνῄσκειν
  choice: Jésù yóò kú
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá fún ìṣẹ̀lẹ̀ tí a ń retí níwájú, kò sì fi ìtumọ̀ pé ikú náà fẹ́ ṣẹlẹ̀ lójú ẹsẹ̀ tàbí pé àyànmọ́ aláìlèyípadà ni kún un.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: fún orílẹ̀-èdè náà
  rationale: ‘Fún’ pa ìtumọ̀ àǹfààní/aṣojú rẹ̀ sílẹ̀ ní fífẹ̀, nígbà tí ‘orílẹ̀-èdè náà’ bá ẹyọ ἔθνος àti àyíká àwọn Júù mu.
theological_decisions:
- issue: Bí ọ̀rọ̀ Káyáfà ṣe jẹ́ àsọtẹ́lẹ̀
  choice: A sọ ní tààrà pé ó sọ àsọtẹ́lẹ̀ nítorí ipò rẹ̀ gẹ́gẹ́ bí olórí àlùfáà.
  alternative: Pé ó mọ̀ọ́mọ̀ sọ ọ̀rọ̀ ní ìmísí Ọlọ́run ní kíkún, tàbí pé àwàdà ọ̀rọ̀ lásán ni Jòhánù ń lò.
  rationale: Ẹsẹ náà sọ ἐπροφήτευσεν ní gbangba, ṣùgbọ́n kò ṣàlàyé ìmọ̀ inú Káyáfà tàbí ìwà rere rẹ̀.
- issue: Agbára ìtumọ̀ ὑπὲρ nínú ikú Jésù
  choice: fún orílẹ̀-èdè náà
  alternative: ní ipò orílẹ̀-èdè náà; nítorí ire orílẹ̀-èdè náà
  rationale: ‘Fún’ gba ìtumọ̀ àǹfààní àti aṣojú láàyè láì fi ìlànà ẹ̀kọ́ ìràpadà kan pàtó mú ẹsẹ yìí.
translation_notes:
  register: Yorùbá àjọṣe, ọlọ́lá, tí òǹkàwé òde òní lè lóye. A lo àmì ohùn ní kíkún níbi tí ó bá bá àṣà ìkọ̀wé Yorùbá mu; a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ẹ̀ka kan lè dá sí.
