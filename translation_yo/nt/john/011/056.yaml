id: JHN.11.56
reference: John 11:56
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: yo
  text: Nítorí náà, wọ́n ń wá Jésù, wọ́n sì ń sọ fún ara wọn bí wọ́n ti dúró ní àgbàlá tẹ́ńpìlì[a] pé, “Kí ni ẹ rò? Ṣé kò ní wá sí àjọyọ̀ náà rárá ni[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo agbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú tẹ́ńpìlì nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí, “Ṣé kò ní wá sí àjọyọ̀ náà rárá?” Èdè Gíríìkì lo ìkọ̀ tó lágbára (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: wọ́n ń wá
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà fi hàn pé wíwá Jésù ń bá a lọ tàbí ń ṣẹlẹ̀ léraléra; ‘wọ́n ń wá’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: wọ́n sì ń sọ fún ara wọn
  rationale: Ó pa ìṣe tó ń bá a lọ àti ìjíròrò láàárín wọn mọ́, láìsọ ọ́ di ìbéèrè nìkan kí ọ̀rọ̀ Gíríìkì ‘sọ’ lè dúró.
- source_word: ἐν τῷ ἱερῷ
  choice: ní àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; ‘àgbàlá tẹ́ńpìlì’ mú ìyàtọ̀ yìí yé òǹkàwé Yorùbá.
- source_word: ἑστηκότες
  choice: bí wọ́n ti dúró
  rationale: Ó ṣàpèjúwe ipò tí wọ́n wà nígbà tí wọ́n ń sọ̀rọ̀, ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Kí ni ẹ̀yin rò?
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bójú mu fún bíbéèrè èrò àwọn ẹlòmíràn.
- source_word: οὐ μὴ ἔλθῃ
  choice: Ṣé kò ní wá ... rárá ni?
  rationale: ‘Rárá’ pa agbára ìkọ̀ emphatic οὐ μή mọ́, nígbà tí ìṣètò gẹ́gẹ́ bí ìbéèrè tún pa iyèméjì àti agbára ìbéèrè inú àyíká ọ̀rọ̀ mọ́.
- source_word: εἰς τὴν ἑορτήν
  choice: sí àjọ̀dún náà
  rationale: ‘Àjọ̀dún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἑορτή, ó sì yẹ fún àjọ̀dún àwọn Júù tí àyíká ọ̀rọ̀ ń tọ́ka sí.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ agbára οὐ μή nínú ìbéèrè náà
  choice: Ṣé kò ní wá sí àjọ̀dún náà rárá ni?
  alternative: Ó dájú pé kò ní wá sí àjọ̀dún náà.
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìkọ̀ tó lágbára mọ́, ṣùgbọ́n kò sọ ìbéèrè àwọn ènìyàn di ìdájọ́ tó dájú ju ohun tí Gíríìkì fi hàn lọ; ó tipa bẹ́ẹ̀ dáàbò bo iyèméjì àlàyé náà.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé lásán. ‘Àgbàlá tẹ́ńpìlì’ ṣàlàyé ibi náà láìdà á pọ̀ mọ́ ibi mímọ́ inú tẹ́ńpìlì; ‘rárá’ sì mú ìkọ̀ tó lágbára jáde ní ọ̀nà àdánidá.
