  source_fidelity: 'Ìtumọ̀ náà gba èrò pàtàkì Gíríìkì náà: Jésù mọ̀ pé Baba ń gbọ́ tirẹ̀ nígbà gbogbo, ó sì sọ ọ́ nítorí àwọn ènìyàn tó wà ní àyíká, kí wọ́n lè gbàgbọ́ pé Baba rán an. Síbẹ̀, “gbọ́ tèmi” lè túmọ̀ sí ‘gbọ́ ohun tèmi’ dípò ‘gbọ́ mi,’ ó sì kéré sí ìbámu pẹ̀lú μου. “Ṣùgbọ́n” ní ìbẹ̀rẹ̀ méjèèjì tún bo ìyàtọ̀ δὲ àti ἀλλά mọ́ ní ọ̀nà tí kò rọrùn.'
  naturalness: A lè lóye ọ̀rọ̀ náà, ṣùgbọ́n “ìwọ máa ń gbọ́ tèmi nígbà gbogbo” kì í ṣe ọ̀nà Yorùbá tó dára jù lọ fún ‘you always hear me.’ “Ìwọ ń gbọ́ mi nígbà gbogbo” jẹ́ èdè àdánidá, ó sì pa ìtẹnumọ́ σύ mọ́. Ṣíṣe “nítorí ẹgbẹ́/ọ̀pọ̀ ènìyàn ... ni mo sọ èyí” mú ìbáṣepọ̀ ìdí àti ọ̀rọ̀ tí a sọ hàn kedere.
  terminology: “Rán mi” yẹ fún ἀπέστειλας, àti “ìwọ ni ó rán mi” dá ìtẹnumọ́ orúkọ-arọ́pò σύ dúró dáadáa. “Kí wọ́n lè gbàgbọ́” ṣàfihàn ète ἵνα dáadáa. A kò nílò àlàyé-ẹsẹ afikun fún ẹsẹ yìí.
