revisions:
- from: Ṣùgbọ́n èmi mọ̀ pé ìwọ máa ń gbọ́ tèmi nígbà gbogbo. Ṣùgbọ́n mo sọ èyí nítorí ọ̀pọ̀ ènìyàn tí ó dúró yí mi ká, kí wọ́n lè gbàgbọ́ pé ìwọ ni ó rán mi.
  to: Èmi sì mọ̀ pé ìwọ ń gbọ́ mi nígbà gbogbo; ṣùgbọ́n nítorí ọ̀pọ̀ ènìyàn tí wọ́n dúró yí mi ká ni mo sọ èyí, kí wọ́n lè gbàgbọ́ pé ìwọ ni ó rán mi.
  rationale: Àtúnṣe náà rọ́pò “gbọ́ tèmi” pẹ̀lú “gbọ́ mi” láti tú μου ní ìdúró ohun-ìṣe rẹ̀. Ó tún yà δὲ sọ́tọ̀ kúrò ní ἀλλά pẹ̀lú “Èmi sì ...; ṣùgbọ́n ...,” ó sì mú gbolohun ìdí náà rọrùn ní Yorùbá. Ìtẹnumọ́ pé Baba, ní pàtó, rán Jésù ni a pa mọ́ nínú “ìwọ ni ó rán mi.” Àwọn footnote Gẹ̀ẹ́sì tí a fi sí audit trail kò bá àwọn àmì wọn mu, ṣùgbọ́n kò sí footnote Yorùbá nínú draft tí ó nílò àmì tàbí ìtúnṣe.
