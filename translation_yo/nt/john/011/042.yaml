  - severity: low
    issue: Àmì ìyàtọ̀ méjì náà
    rationale: Gíríìkì ní δὲ ní ìbẹ̀rẹ̀ àti ἀλλά fún ìyàtọ̀ tó lágbára lẹ́yìn náà. Lílò “Ṣùgbọ́n” fún èyí méjèèjì jẹ́ ìtúmọ̀ tó ṣeé ṣe, ṣùgbọ́n ó wuwo; “Èmi sì mọ̀ ...; ṣùgbọ́n ...” rọrùn, ó sì sunmọ́ ìṣètò orísun.
  - severity: low
