language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: yo
  text: Èmi sì mọ̀ pé ìwọ ń gbọ́ mi nígbà gbogbo; ṣùgbọ́n nítorí ọ̀pọ̀ ènìyàn tí wọ́n dúró yí mi ká ni mo sọ èyí, kí wọ́n lè gbàgbọ́ pé ìwọ ni ó rán mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδειν
  choice: mo mọ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìmọ̀ tí Jésù ní nígbà náà, láìfi ìtumọ̀ àkókò tí Gíríìkì kò fipá mú kún un.
- source_word: πάντοτέ μου ἀκούεις
  choice: ìwọ máa ń gbọ́ tèmi nígbà gbogbo
  rationale: “Máa ń … nígbà gbogbo” pa ìtumọ̀ πάντοτε mọ́; “gbọ́ tèmi” sì bá àyíká àdúrà mu, ó sì ní agbára ìgbọ́ tí ó tẹ́wọ́ gba.
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: Ṣùgbọ́n … nítorí ọ̀pọ̀ ènìyàn
  rationale: “Ṣùgbọ́n” pa ìyàtọ̀ ọ̀rọ̀ mọ́, “nítorí” sì fi ìdí tí Jésù fi sọ ọ́ hàn ní ti ẹ̀dá.
- source_word: τὸν περιεστῶτα
  choice: tí ó dúró yí mi ká
  rationale: Ó mú àwòrán àwọn ènìyàn tí wọ́n dúró ní àyíká Jésù jáde ní Yorùbá tó ṣe kedere.
- source_word: εἶπον
  choice: mo sọ èyí
  rationale: “Èyí” tọ́ka sí ọ̀rọ̀ àdúrà tí Jésù ṣẹ̀ṣẹ̀ sọ, gẹ́gẹ́ bí àyíká ṣe fi hàn.
- source_word: ἵνα πιστεύσωσιν
  choice: kí wọ́n lè gbàgbọ́
  rationale: Ó sọ ète gbolohun ἵνα ní Yorùbá àdánidá láìsọ ìdánilójú àbájáde tí ọ̀rọ̀ Gíríìkì kò sọ.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: pé ìwọ ni ó rán mi
  rationale: Ìṣètò “ìwọ ni” pa ìtẹnumọ́ orúkọ arọ́pò σύ mọ́, “rán mi” sì pa àkòrí iṣẹ́ tí Baba rán Jésù mọ́.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jésù nípa bí Baba ṣe ń gbọ́ tirẹ̀
  choice: A sọ pé Baba máa ń gbọ́ ti Jésù nígbà gbogbo, àti pé Jésù sọ àdúrà náà ní gbangba fún àǹfààní ọ̀pọ̀ ènìyàn.
  alternative: A lè ka ọ̀rọ̀ náà sí ìtẹnumọ́ àdúrà tí a dáhùn lápapọ̀ dípò ìbáṣepọ̀ Baba àti Ọmọ.
  rationale: Ìtumọ̀ náà pa ìbáṣepọ̀ tímọ́tímọ́ àti ète ìgbàgbọ́ tí ẹsẹ náà sọ mọ́, láìfi ẹ̀kọ́ ìsìn míràn kún un.
- issue: Ète àdúrà tí Jésù sọ ní gbangba
  choice: Jésù sọ ọ́ kí àwọn tó yí i ká lè gbàgbọ́ pé Baba ni ó rán an.
  alternative: A lè dín ète náà kù sí fífi iṣẹ́ ìyanu yìí nìkan múlẹ̀.
  rationale: Gbolohun ète náà dá lórí gbígbàgbọ́ pé Baba rán Jésù; a kò dín iṣẹ́ tí a rán an sí tàbí fẹ̀ ọ́ sí i ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ọ̀pọ̀ ènìyàn” fún ὄχλος nítorí pé ó wọ́pọ̀, ó sì ṣe kedere ju gbígbé ọ̀rọ̀ àjèjì wọlé lọ.
