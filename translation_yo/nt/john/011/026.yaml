revisions:
- from: Àti pé gbogbo ẹni tí ó wà láàyè, tí ó sì gbà mí gbọ́, kì yóò kú láéláé. Ṣé ìwọ gba èyí gbọ́?
  to: Àti gbogbo ẹni tí ó wà láàyè, tí ó sì gbà mí gbọ́, kì yóò kú láéláé. Ṣé o gba èyí gbọ́?
  rationale: The revision removes the unsupported complementizer pé and uses the unmarked Yoruba second-person subject in the question. All substantive source-faithful renderings, including the absolute wording of the promise, are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the universal subject, the ongoing descriptions “living” and “believing in me,” the emphatic Greek negation οὐ μὴ, the enduring expression εἰς τὸν αἰῶνα, and Jesus’ final direct question. No interpretive qualification about merely spiritual death should be added.
  naturalness: “Àti pé gbogbo ẹni” is not idiomatic here, since pé (“that”) has no corresponding function in the Greek sentence. “Àti gbogbo ẹni” is direct and natural. In the final question, “ìwọ” can add emphasis not explicitly marked by the Greek; the ordinary second-person subject pronoun o better preserves the unmarked Greek form.
  terminology: “Wà láàyè,” “gba mí gbọ́,” “kú láéláé,” and “gba èyí gbọ́” are clear, standard Yoruba choices. They retain the passage’s deliberate tension without imposing a theological explanation.
  issues:
  - severity: medium
    issue: Unwarranted “pé” after Àti
    rationale: The Greek begins simply καὶ πᾶς (“and everyone”). Yoruba “Àti pé” introduces a content clause (“and that”), which is not present and makes the opening less natural.
  - severity: low
    issue: Potentially added emphasis in “ìwọ”
    rationale: πιστεύεις marks second-person singular through verbal inflection but has no explicit σύ. Yoruba “o” conveys the required subject without introducing contrastive emphasis.
  revised_text: Àti gbogbo ẹni tí ó wà láàyè, tí ó sì gbà mí gbọ́, kì yóò kú láéláé. Ṣé o gba èyí gbọ́?
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported complementizer pé and uses the unmarked Yoruba second-person subject in the question. All substantive source-faithful renderings, including the absolute wording of the promise, are retained.
