source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: yo
  text: Àti gbogbo ẹni tí ó wà láàyè, tí ó sì gbà mí gbọ́, kì yóò kú láéláé. Ṣé o gba èyí gbọ́?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: gbogbo ẹni tí ó wà láàyè
  rationale: Ó túmọ̀ gbólóhùn arọ́pò-orúkọ Gíríìkì ní ọ̀nà Yorùbá tí ó ṣe kedere, láì sọ ζῶν di ìtumọ̀ ẹ̀mí nìkan.
- source_word: πιστεύων εἰς ἐμέ
  choice: tí ó sì gbà mí gbọ́
  rationale: ‘Gba … gbọ́’ ni ọ̀nà Yorùbá àdánidá fún ìgbàgbọ́ nínú ẹni kan; ó pa mí mọ́ gẹ́gẹ́ bí ẹni tí ìgbàgbọ́ náà dojú kọ.
- source_word: οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα
  choice: kì yóò kú láéláé
  rationale: Ìṣọ̀kan οὐ μή jẹ́ ìkọ̀ tí ó lágbára, εἰς τὸν αἰῶνα sì ń tẹnumọ́ pé kì í ṣe láéláé; gbolohun naa pa ìdọ̀tí ẹ̀kọ́ ìsìn tí Jésù mọ̀ọ́mọ̀ fi sílẹ̀ mọ́.
- source_word: πιστεύεις τοῦτο;
  choice: Ṣé ìwọ gba èyí gbọ́?
  rationale: Ìbéèrè taara ni; fífi ‘ìwọ’ hàn ń pa ìtẹnumọ́ ẹni kejì ẹyọ inú fọ́ọ̀mù Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe lè sọ ‘kì yóò kú láéláé’ nígbà tí àwọn onígbàgbọ́ tún lè kú nípa ti ara
  choice: 'Pa ọ̀rọ̀ ìlérí náà mọ́ ní taara: ‘kì yóò kú láéláé.’'
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘kì yóò kú nípa ti ẹ̀mí láéláé’ tàbí ‘yóò wà láàyè títí láé.’
  rationale: Ọ̀rọ̀ Gíríìkì kò fi ‘nípa ti ẹ̀mí’ kun un, ó sì lo ἀποθνῄσκω, ‘kú.’ Ìtumọ̀ gbọ́dọ̀ pa ìfọ̀rọ̀wérọ̀ àti ìdọ̀tí tó wà láàárín ikú ara àti ìyè tí Jésù ń sọ̀rọ̀ rẹ̀ mọ́, dípò kí ó túmọ̀ ẹ̀kọ́ náà fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti ti òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ‘Ṣé’ jẹ́ ọ̀nà àdánidá tí a ń gbà béèrè ìbéèrè bẹ́ẹ̀ nínú Yorùbá òde òní.
