source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: yo
  text: Jésù wí pé, “Ẹ gbé òkúta náà kúrò.” Mátà, arábìnrin ẹni tí ó ti kú náà,[a] wí fún un pé, “Olúwa, ó ti ń rùn báyìí,[b] nítorí ó ti kú ọjọ́ mẹ́rin.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “arábìnrin ẹni tí ó ti kú náà.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “ó ti ń run òórùn búburú”; ọ̀rọ̀ Gíríìkì náà túmọ̀ sí jíjáde òórùn, èyí tí àyíká náà fi hàn pé òórùn búburú ni.
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “ẹni ọjọ́ kẹrin ni”; ìtumọ̀ rẹ̀ ni pé ó ti kú fún ọjọ́ mẹ́rin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Ẹ gbé … kúrò
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì túmọ̀ sí kí wọ́n mú òkúta náà kúrò ní ẹnu ibojì. ‘Ẹ gbé … kúrò’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ àṣẹ náà mọ́.
- source_word: τὸν λίθον
  choice: òkúta náà
  rationale: Nínú ọ̀rọ̀ nípa ibojì, λίθος ni òkúta tí a fi dí ẹnu ibojì; ‘òkúta náà’ ṣe kedere láìfi ohun tí kò sí nínú ẹsẹ náà kún un.
- source_word: τοῦ τετελευτηκότος
  choice: ọkùnrin tí ó ti kú náà
  rationale: Perfect participle náà tọ́ka sí ẹni tí ó kú, tí ó sì wà ní ipò òkú. Gbólóhùn yìí jẹ́ kedere, ó sì bá Yorùbá òde òní mu ju ọ̀rọ̀ bí ‘olóògbé’ lọ nínú àyíká yìí.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìwọ̀n ọlá àti ìtumọ̀ Johannine ti κύριος mọ́; ‘Ọ̀gá’ tàbí ‘Bàbá’ lè dín ìtumọ̀ náà kù sí ìkíni ọ̀wọ̀ lasan.
- source_word: ἤδη
  choice: báyìí
  rationale: Pẹ̀lú ‘ó ti ń rùn,’ ‘báyìí’ fi hàn pé ipò náà ti dé ní àkókò tí Mátà ń sọ̀rọ̀.
- source_word: ὄζει
  choice: ó ti ń rùn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjáde òórùn, tí àyíká ikú sì fi hàn pé òórùn búburú ni. ‘Ó ti ń rùn’ jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé, tí kò sì rọ ìtumọ̀ náà sí gbolohun aláìlẹ́ni bí ‘òórùn ti ń jáde.’
- source_word: τεταρταῖος
  choice: ọjọ́ kẹrin nìyí tí ó ti kú
  rationale: Adjective Gíríìkì náà túmọ̀ ní ṣókí pé ẹni náà jẹ́ ẹni ọjọ́ kẹrin ní ikú. Yorùbá nílò ìtúmọ̀ gbólóhùn láti mú un yé; yíyan yìí pa àwòrán ‘ọjọ́ kẹrin’ mọ́ láìfi ‘nínú ibojì’ kún un.
- source_word: γάρ
  choice: nítorí
  rationale: γάρ ṣàlàyé ìdí tí Mátà fi kọ̀ láti ṣí ibojì; ‘nítorí’ sọ ìbáṣepọ̀ ìdí náà ní kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ Mátà sí Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ gba àyè fún ọlá àti ìwọ̀n ẹ̀kọ́ nípa ẹni tí Jésù jẹ́ nínú Ìhìn Rere Jòhánù, láìfi ipá mú ẹsẹ yìí sọ ìjẹ́wọ́ tó ju ohun tí àyíká rẹ̀ fìdí múlẹ̀ lọ. ‘Ọ̀gá’ lè sọ ọ́ di ìkíni ọ̀wọ̀ lasan.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn níbi tí ó ti yẹ, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. Àṣẹ ‘Ẹ gbé … kúrò’ fi ọ̀pọ̀ ènìyàn tí Ἄρατε ń bá sọ̀rọ̀ hàn. A yàgò fún fífi ‘nínú ibojì’ sínú apá ọjọ́ mẹ́rin, nítorí kò sí ní tààràtà nínú Gíríìkì.
