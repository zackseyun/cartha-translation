  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Ṣé mi ò sọ fún ọ pé, bí o bá gbàgbọ́, ìwọ yóò rí ògo Ọlọ́run?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì lo àkókò ìsinsìnyí nínú ìtàn, àkókò tí ó ti kọjá (‘sọ’) jẹ́ èdè Yorùbá àdánidá nínú ìtàn. ‘Fún un’ fi αὐτῇ hàn gẹ́gẹ́ bí ẹni tí Jésù ń bá sọ̀rọ̀, ìyẹn Mátà ní àyíká ẹsẹ náà.
- source_word: Οὐκ εἶπόν σοι
  choice: Ṣé èmi kò sọ fún ọ
  rationale: Èyí pa ìbéèrè àsọyé tí ó ń retí ìdáhùn ìmúdájú mọ́. Fífì ‘èmi’ hàn mú ìtẹnumọ́ inú ọ̀rọ̀ Gíríìkì náà jáde ní Yorùbá.
- source_word: ἐὰν πιστεύσῃς
  choice: bí o bá gbàgbọ́
  rationale: ‘Gbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù lọ fún πιστεύω, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú lílo ọ̀rọ̀ náà káàkiri Ìhìn Rere Jòhánù láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
- source_word: ὄψῃ
  choice: ìwọ yóò rí
  rationale: ‘Yóò rí’ tú àkókò ọjọ́ iwájú náà ní kedere. ‘Ìwọ’ fi tẹnumọ́ ẹni kejì ẹyọ kan hàn lọ́nà àdánidá lẹ́yìn gbólóhùn oní条件.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: ògo Ọlọ́run
  rationale: ‘Ògo’ jẹ́ ìtumọ̀ Bíbélì tí ó fẹsẹ̀ múlẹ̀ fún δόξα, ó sì pa ìtumọ̀ ìfihàn ọlá àti agbára Ọlọ́run mọ́. Ìṣọ̀kan ọ̀rọ̀ Yorùbá ‘ògo Ọlọ́run’ jẹ́ àdánidá, ó sì lè fi ìbátan genitive náà hàn láìyanju bóyá ó jẹ́ ohun-ìní tàbí àpèjúwe.
theological_decisions:
- issue: Ìbátan ìgbàgbọ́ sí rírí ògo Ọlọ́run
  choice: Tú ọ̀rọ̀ náà gẹ́gẹ́ bí ìlérí oní条件 tí Jésù sọ tààrà sí Mátà.
  alternative: Kà á sí ìlànà gbogbogbò nípa ìgbàgbọ́ àti iṣẹ́ ìyanu, tàbí sí ìlérí tí ó mọ́ sí jíjí Lásárù dìde nìkan.
  rationale: Ẹsẹ náà fúnra rẹ̀ sọ ọ́ gẹ́gẹ́ bí ọ̀rọ̀ oní条件 sí ẹni kan. Ìtumọ̀ náà kò gbọ́dọ̀ mú kí ààlà tàbí ìlò ẹ̀kọ́ ìsìn rẹ̀ fẹ̀ sí i ju ohun tí ọ̀rọ̀ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. ‘Ṣé’ jẹ́ àmì ìbéèrè àsọyé ti Yorùbá òde òní, nígbà tí ‘yóò’ àti ‘ògo Ọlọ́run’ pa ìwọ̀ntúnwọ̀nsì Bíbélì mọ́.
