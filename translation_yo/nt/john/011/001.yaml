  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “Ọkùnrin kan” ń ṣàpẹẹrẹ τις pẹ̀lú akọ ẹni náà; “sì wà tí ó ń ṣàìsàn” ń gbé ἦν δέ ... ἀσθενῶν kalẹ̀ ní èdè Yorùbá tí ó wọ́pọ̀; àwọn gbolohun ìbílẹ̀ Betani àti abúlé Maria àti Marta sì pa ìtọ́kasí méjèèjì mọ́. “Ará Betani” jẹ́ ìtumọ̀ àdánidá tí ó yẹ fún ἀπὸ Βηθανίας nínú àyíká yìí.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa, ó sì ní ìṣàn ọrọ̀ rere. “Marta arábìnrin rẹ̀” ń tọ́ka sí Marta gẹ́gẹ́ bí arábìnrin Maria láì mú ìdàrúdàpọ̀ wá. Àmì ohùn wa lórí àwọn ọ̀rọ̀ Yorùbá ibi tí ó bá yẹ; àìsí àmì ohùn lórí àwọn orúkọ jẹ́ ìlò tí a gba wọ́pọ̀ nínú ìkọ̀wé Bíbélì Yorùbá.
  terminology: “Ṣàìsàn,” “abúlé,” àti “ará” jẹ́ àwọn ọ̀rọ̀ ìforúkọsílẹ̀ tí ó bá ìtumọ̀ àti ìforúkọsílẹ̀ ìtàn mu. “Lasaru,” “Betani,” “Maria,” àti “Marta” tẹ̀lé ìlò àwọn orúkọ Bíbélì Yorùbá tí ó wọ́pọ̀. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìjọ tàbí ìtumọ̀ àfikún tí a fi kún ẹsẹ̀ náà.
