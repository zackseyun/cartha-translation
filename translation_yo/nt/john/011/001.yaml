id: JHN.11.1
reference: John 11:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: yo
  text: Ọkùnrin kan sì wà tí ó ń ṣàìsàn, Lasaru ará Betani, láti abúlé Maria àti Marta arábìnrin rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: sì wà
  rationale: “Sì” fi ìsopọ̀ onírẹ̀lẹ̀ tí δέ ní hàn láì sọ ọ́ di ìtakora líle; “wà” sì jẹ́ ìtumọ̀ ἦν nínú gbólóhùn tó ń fi ẹni kan hàn.
- source_word: τις
  choice: ọkùnrin kan
  rationale: τις ń tọ́ka sí ẹni pàtó kan tí a kò tíì dárúkọ; “ọkùnrin kan” bá akọ Lazarù mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἀσθενῶν
  choice: tí ó ń ṣàìsàn
  rationale: Nínú àyíká yìí, participle náà túmọ̀ sí pé ara ẹni náà kò yá, kì í ṣe àìlera lásán. Àmì “ń” tún fi ipò tó ń bá a lọ hàn.
- source_word: Λάζαρος
  choice: Lasaru
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìlò Bíbélì Yorùbá tó wọ́pọ̀ àti ìró Yorùbá.
- source_word: ἀπὸ Βηθανίας
  choice: ará Betani
  rationale: “Ará Betani” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Betani ni ibi tí Lasaru ti wá tàbí ibi tí ó ń gbé.
- source_word: ἐκ τῆς κώμης
  choice: láti abúlé
  rationale: κώμη jẹ́ ìletò kékeré tàbí abúlé, ἐκ sì ń tọ́ka sí orísun tàbí ibi tí ẹni ti wá.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: Maria àti Marta arábìnrin rẹ̀
  rationale: Gbóhùn náà sọ pé Marta ni arábìnrin Maria. Ìṣètò ọ̀rọ̀ yìí pa ìbáṣepọ̀ náà mọ́ ní Yorùbá láì fi àlàyé tí kò sí nínú orísun kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo “sì” gẹ́gẹ́ bí àmì ìtẹ̀síwájú ìtàn, kì í ṣe ọ̀rọ̀ àkókò bí “nígbà náà.”
