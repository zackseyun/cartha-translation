  text: ἐκείνη ⸀δὲ ὡς ἤκουσεν ⸀ἠγέρθη ταχὺ καὶ ⸀ἤρχετο πρὸς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: yo
  text: Nígbà tí ó sì gbọ́ ọ̀rọ̀ náà,[a] ó yára dìde, ó sì lọ sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà títẹ̀lé Gíríìkì: “Ẹni náà, nígbà tí ó gbọ́, ó yára dìde, ó sì ń lọ sí ọ̀dọ̀ rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη
  choice: ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Màríà nínú àyíká ẹsẹ náà; “ó” jẹ́ ọ̀nà àdánidá ní Yorùbá, láìfi “obìnrin náà” kún un.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú, kì í ṣe àmì ìyàtọ̀ líle.
- source_word: ὡς
  choice: nígbà tí
  rationale: Ó ń fi àkókò tí ìṣe náà ṣẹlẹ̀ hàn; kò pọndandan kí a mú un lágbára sí “ní kété tí.”
- source_word: ἤκουσεν
  choice: gbọ́ ọ̀rọ̀ náà
  rationale: Ìtumọ̀ rẹ̀ ni “gbọ́”; “ọ̀rọ̀ náà” ń tọ́ka sí ohun tí Màtá sọ fún un ní ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἠγέρθη
  choice: dìde
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì rẹ̀ dà bí ọ̀rọ̀-ìṣe àfaragà, ní àyíká yìí ó túmọ̀ sí pé ẹni náà dìde, kì í ṣe pé ẹlòmíràn gbé e dìde.
- source_word: ταχὺ
  choice: yára
  rationale: Ó ń fi ìkánjú tàbí ìṣe kíákíá hàn ní ọ̀nà Yorùbá tó wọ́pọ̀.
- source_word: ἤρχετο
  choice: lọ
  rationale: Àkókò ọ̀rọ̀-ìṣe Gíríìkì náà lè fi ìrìn tó ń lọ lọ́wọ́ hàn, ṣùgbọ́n “lọ” jẹ́ ìtumọ̀ àdánidá nínú ìtẹ̀síwájú ìtàn Yorùbá.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: Ó ń tọ́ka sí ìṣípò lọ sí ibi tí Jesu wà; “sọ́dọ̀ rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá fún ìlọ sí ọ̀dọ̀ ènìyàn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àkọsílẹ̀ ìsàlẹ̀ pa ìfarahàn ἐκείνη àti ipa imperfect ἤρχετο mọ́.
