  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: yo
  text: Lẹ́yìn tí ó ti sọ nǹkan wọ̀nyí, ó tún sọ fún wọn pé, “Lásárù, ọ̀rẹ́ wa, ti lọ sùn,[a] ṣùgbọ́n mo ń lọ kí n lè jí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tí ó ṣe kedere sí i, “ti kú.” Níhìn-ín, Jésù lo ìsùn gẹ́gẹ́ bí àkàwé fún ikú; àwọn ọmọ-ẹ̀yìn rẹ̀ kò kọ́kọ́ lóye ọ̀rọ̀ rẹ̀ nínú àwọn ẹsẹ tó tẹ̀ lé e.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Lẹ́yìn tí ó sọ nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì sọ ìtẹ̀lé àkókò μετὰ τοῦτο ní èdè Yorùbá àdánidá láì tún gbólóhùn náà ṣe lọ́nà líle.
- source_word: λέγει αὐτοῖς
  choice: ó sọ fún wọn pé
  rationale: A lo àkókò tí ó ti kọjá fún historical present náà, gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú ìtàn Yorùbá; “pé” sì mú ọ̀rọ̀ tààrà tó tẹ̀ lé e wọlé lọ́nà àdánidá.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: Lásárù ọ̀rẹ́ wa
  rationale: “Ọ̀rẹ́ wa” jẹ́ ìtumọ̀ kedere, àdánidá fún ὁ φίλος ἡμῶν, ó sì pa ìtẹnumọ́ ìbáṣepọ̀ náà mọ́.
- source_word: κεκοίμηται
  choice: ti lọ sùn
  rationale: Ó pa àkàwé oorun sísùn mọ́, ó sì fi ipò tí ó ti ṣẹlẹ̀ tí ó ṣì ń bá a lọ hàn, gẹ́gẹ́ bí perfect Greek náà.
- source_word: ἀλλὰ πορεύομαι
  choice: ṣùgbọ́n mo ń lọ
  rationale: “Ṣùgbọ́n” pa ìyàtọ̀ ἀλλά mọ́; “mo ń lọ” sì sọ ìrìn tí Jésù pinnu láti ṣe ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: láti jí i
  rationale: Infinitive “láti” sọ ète ἵνα ní kedere, “jí i” sì pa àwòrán jíjí ẹni kúrò lójú oorun mọ́ ní ọ̀nà ṣókí àti àdánidá.
theological_decisions:
- issue: Bóyá kí a túmọ̀ κεκοίμηται ní tààrà sí “ti kú” tàbí kí a pa àkàwé oorun sísùn mọ́
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí “ti lọ sùn” nínú ọ̀rọ̀ pàtàkì
  alternative: ti kú
  rationale: Jésù mọ̀ọ́mọ̀ lo oorun sísùn gẹ́gẹ́ bí àkàwé fún ikú, àwọn ọmọ-ẹ̀yìn sì kọ́kọ́ lóye rẹ̀ ní ìtumọ̀ gidi ti oorun. Pípa àkàwé náà mọ́ ń dá àìgbọ́ra-ẹni-yé inú ìtàn àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ sí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. Gbólóhùn náà rọrùn fún òǹkàwé lásán, ó sì pa àkàwé àti ìdàrúdàpọ̀ inú ìtàn Gíríìkì mọ́.
