  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ Gíríìkì mọ́ ní pàtàkì: ‘orílẹ̀-èdè náà’ jẹ́ ẹyọ kan, ‘àwọn ọmọ Ọlọ́run’ kò ní ìdíyelé akọ/abo, àti ‘di ọ̀kan’ kò ṣàfikún ohun tí Gíríìkì kò sọ. Ṣùgbọ́n ‘ṣùgbọ́n pẹ̀lú kí’ kò ṣe ìṣọ̀kan ìyàtọ̀ àti ète (ἀλλ’ ἵνα καί) dáadáa nínú Yorùbá.'
  naturalness: ‘Ṣùgbọ́n kí ó tún lè’ jẹ́ ìṣàn Yorùbá tó rọrùn, ó sì fi ‘ṣùgbọ́n ... pẹ̀lú/also’ àti ète ‘ἵνα’ hàn ní kedere ju ‘ṣùgbọ́n pẹ̀lú kí ó lè’ lọ. ‘Tí ó ti fọ́n ká’ tún dá ipò ìtànkálẹ̀ tí participle perfect Gíríìkì náà ń sọ hàn lọ́nà adayeba.
  terminology: ‘Orílẹ̀-èdè náà,’ ‘àwọn ọmọ Ọlọ́run,’ ‘kó ... jọ,’ àti ‘di ọ̀kan’ yẹ, wọ́n sì yẹra fún fífi ‘ara kan’ tàbí ìtumọ̀ ẹ̀kọ́ ìsìn pàtó kún un.
