id: JHN.11.52
reference: John 11:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: yo
  text: Kì í sì í ṣe fún orílẹ̀-èdè náà nìkan[a][b], ṣùgbọ́n kí ó tún lè kó àwọn ọmọ Ọlọ́run tí ó ti fọ́n ká jọ di ọ̀kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í ṣe fún orílẹ̀-èdè náà nìkan, ṣùgbọ́n kí ó lè kó àwọn ọmọ Ọlọ́run tí ó ti fọ́n ká jọ di ọ̀kan.”
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, “orílẹ̀-èdè náà” ń tọ́ka sí orílẹ̀-èdè àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: orílẹ̀-èdè náà
  rationale: Ó pa ìtumọ̀ ẹ̀yọ kan tó jẹ́ ti àwùjọ mọ́; nínú àyíká ọ̀rọ̀, ó ń tọ́ka sí orílẹ̀-èdè àwọn Júù, láì fi àlàyé náà sínú ọ̀rọ̀ pàtàkì.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète tàbí àbájáde hàn lọ́nà àdánidá ní Yorùbá, ó sì bá ìlò subjunctive nínú Gíríìkì mu.
- source_word: τέκνα τοῦ θεοῦ
  choice: àwọn ọmọ Ọlọ́run
  rationale: τέκνα túmọ̀ sí àwọn ọmọ láì fi ọkùnrin tàbí obìnrin ṣe ààlà; yíyan yìí pa ìtumọ̀ gbogbogbò náà mọ́.
- source_word: διεσκορπισμένα
  choice: tí ó fọ́n ká
  rationale: Ó ṣàfihàn ipò àwọn ọmọ náà gẹ́gẹ́ bí àwọn tí wọ́n ti tú ká sí ibi púpọ̀, ní èdè Yorùbá tó ṣe kedere.
- source_word: συναγάγῃ
  choice: kó ... jọ
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá láti sọ ìkójọpọ̀ àwọn tí ó ti fọ́n ká sí àwùjọ kan.
- source_word: εἰς ἕν
  choice: di ọ̀kan
  rationale: Ó pa kúkúrú àti àìsọ pàtó Gíríìkì mọ́, láì ṣàfikún ‘ara kan’ tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: kì í sì í ṣe fún orílẹ̀-èdè náà nìkan, ṣùgbọ́n pẹ̀lú
  rationale: Ó tẹ̀ síwájú láti inú èrò ẹsẹ tó ṣáájú nípa ikú Jésù fún àwọn ẹlòmíràn, ó sì pa ìyàtọ̀ ‘kì í ṣe ... nìkan, ṣùgbọ́n pẹ̀lú’ mọ́.
theological_decisions:
- issue: Ta ni ‘àwọn ọmọ Ọlọ́run’ jẹ́?
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí àwùjọ tó gbòòrò ju orílẹ̀-èdè àwọn Júù lọ, tí a ó kó jọ nípasẹ̀ ikú Jésù, láì sọ ètò ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
  alternative: Àwọn Júù tó wà ní ìtànkálẹ̀ nìkan; tàbí gbogbo àwọn onígbàgbọ́ àyànfẹ́ láti inú Júù àti Kèfèrí.
  rationale: Gíríìkì fi ‘orílẹ̀-èdè náà’ wé àwùjọ àwọn ọmọ Ọlọ́run tí ó fọ́n ká, ṣùgbọ́n kò sọ ààlà àwùjọ kejì náà ní kíkún. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Àtòjọ ọ̀rọ̀ náà tẹ̀ lé ìṣàn èdè Yorùbá, ó sì pa ìdààmú ìtumọ̀ àti àìsọ pàtó inú Gíríìkì mọ́.
