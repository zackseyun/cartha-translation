id: JHN.11.20
reference: John 11:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Màtá gbọ́ pé Jésù ń bọ̀[a], ó lọ pàdé rẹ̀; ṣùgbọ́n Màríà ń jókòó nínú ilé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀rọ̀-ìṣe Gíríìkì wà ní àkókò ìsinsìnyí, ní tààrà: “Jésù ń bọ̀.” Nínú ìtàn ní àkókò tí ó ti kọjá, èyí lè tún ní ìtumọ̀ pé ó wà lójú ọ̀nà bíbọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ń so ìṣẹ̀lẹ̀ yìí pọ̀ mọ́ ohun tí ó ṣáájú, ó sì bá ìtẹ̀síwájú ìtàn mu ní Yorùbá.
- source_word: ὡς
  choice: nígbà tí
  rationale: Níhìn-ín, ó ń ṣí gbólóhùn tó ń tọ́ka sí àkókò sílẹ̀; ‘nígbà tí’ jẹ́ èdè Yorùbá tó ṣe kedere láì fi ìtumọ̀ ‘ní kété tí’ kún un.
- source_word: ἤκουσεν
  choice: gbọ́
  rationale: Ó túmọ̀ ἀκούω ní tààrà, láì yí i sí ‘mọ̀’ tàbí ‘gbọ́ ìròyìn’.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì dá ìsinsìnyí inú gbólóhùn ìròyìn Gíríìkì dúró lọ́nà àdánidá ní Yorùbá.
- source_word: ὑπήντησεν
  choice: lọ pàdé rẹ̀
  rationale: Ó pa ìtumọ̀ ìlọ sí ọ̀dọ̀ ẹni kan láti pàdé rẹ̀ mọ́, láì fi ‘jáde’ kún ohun tí Gíríìkì kò sọ ní gbangba.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ kékeré tó wà láàárín ohun tí Mátà ṣe àti ipò Màríà hàn.
- source_word: ἐν τῷ οἴκῳ
  choice: nínú ilé
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì jẹ́ èdè Yorùbá àdánidá fún ibi tí Màríà wà.
- source_word: ἐκαθέζετο
  choice: ń jókòó
  rationale: Àmì ‘ń’ fi ipò tó ń bá a lọ ní àkókò ìtàn hàn, láì fi ìtumọ̀ pé ó mọ̀ọ́mọ̀ ‘dúró síbi ìjókòó’ kún un.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Mátà / Màríà / Jésù
  rationale: Àwọn orúkọ náà ni a kọ ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn tó yẹ.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó rọrùn fún òǹkàwé gbogbogbò. A lo ‘ń’ láti pa ìṣe tó ń lọ lọ́wọ́ mọ́ nínú ἔρχεται àti ἐκαθέζετο, a sì yà ìṣe Mátà sọ́tọ̀ sí ipò Màríà nípasẹ̀ ‘ṣùgbọ́n’.
