id: JHN.11.23
reference: John 11:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Arákùnrin rẹ̀ yóò jí dìde.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Aorist-like narrative past is natural in Yorùbá, which does not morphologically mark the Greek historical present; this avoids an unnatural tense imitation while retaining the direct narrative force.
- source_word: αὐτῇ
  choice: fún un
  rationale: This naturally expresses the dative indirect object, ‘to her,’ without unnecessarily repeating Mátà’s name.
- source_word: Ἀναστήσεται
  choice: yóò jí dìde
  rationale: In this death context, ‘jí dìde’ naturally denotes rising from the dead. It preserves the intransitive sense and does not explicitly foreground an external agent as ‘will be raised’ would.
- source_word: ὁ ἀδελφός σου
  choice: arákùnrin rẹ
  rationale: This is the standard natural Yorùbá expression for ‘your brother,’ and the context identifies the male sibling Lásárù.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: The personal name is rendered in its established Yorùbá form; the Greek article requires no separate representation.
theological_decisions:
- issue: Resurrection wording
  choice: yóò jí dìde
  alternative: a ó jí i dìde
  rationale: The chosen wording conveys that the brother will rise from death while preserving the Greek form’s lack of an explicitly stated raising agent. It does not decide within this verse whether Jesus means immediate restoration or the final resurrection.
translation_notes:
  register: Standard, dignified, and readily understandable Yorùbá with full tone marks where natural. The connective pé introduces the direct quotation idiomatically. No footnote is needed because Yorùbá ‘jí dìde’ naturally carries the resurrection sense without requiring an equivalent of English ‘again.’
