  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù ń sọ pé[a], “Ẹ wò bí ó ṣe fẹ́ràn rẹ̀ tó!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará ilẹ̀ Jùdíà,” bí a bá ka ọ̀rọ̀ náà sí ìtọ́kasí tó dá lórí ẹkùn ilẹ̀ sí àwọn olùwòran Júù tí wọ́n wà níbẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ pé
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé ọ̀pọ̀ ènìyàn ń sọ ọ́; ‘ń sọ pé’ pa apá yìí mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ohun tí àwọn olùwòran sọ mọ́ ẹkún Jésù ní ẹsẹ tó ṣáájú, ó sì lè fi ìyọrísí tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà; nínú àyíká yìí, ó ń tọ́ka sí àwọn Júù tí wọ́n wà níbẹ̀ láti bá wọn ṣọ̀fọ̀, kì í ṣe sí gbogbo àwọn Júù lápapọ̀.
- source_word: Ἴδε
  choice: Ẹ wò ó
  rationale: Àṣẹ ni fún fífi àfiyèsí sí ohun kan; ‘Ẹ wò ó’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá nínú ọ̀rọ̀ tí ọ̀pọ̀ ènìyàn ń sọ.
- source_word: πῶς
  choice: bí ... tó
  rationale: Ètò ọ̀rọ̀ Yorùbá yìí lè fi bí ìfẹ́ náà ṣe rí àti bí ó ṣe jin tó hàn láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐφίλει
  choice: fẹ́ràn
  rationale: φιλέω níbí ń sọ ìfẹ́ onífẹ̀ẹ́ ti ara ẹni; ‘fẹ́ràn’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì yẹ fún àyíká náà.
- source_word: αὐτόν
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Lásárù; ‘rẹ̀’ bá ìṣètò ọ̀rọ̀ ‘fẹ́ràn rẹ̀’ mu ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ οἱ Ἰουδαῖοι nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ pàtàkì náà pa ìtọ́kasí orísun mọ́. Síbẹ̀, àyíká ẹsẹ yìí fi hàn pé àwọn olùwòran Júù tó wà níbi ìṣọ̀fọ̀ ni a ń sọ, kì í ṣe gbogbo ẹ̀yà náà; àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn ìtumọ̀ tó dá lórí ẹkùn ilẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye nírọ̀rùn. A lo ‘ń sọ pé’ láti pa ìṣe tó ń lọ lọ́wọ́ mọ́, a sì lo ‘Ẹ wò ó ... tó!’ gẹ́gẹ́ bí ọ̀rọ̀ ìyàlẹ́nu àdánidá.
