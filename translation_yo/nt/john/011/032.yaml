  verdict: revise
  source_fidelity: 'The clause structure and actions are faithfully conveyed: Mary arrives, sees Jesus, falls at his feet, and speaks a past counterfactual condition. The primary adjustment is that οὖν here most naturally advances the narrative; “Nígbà náà” conveys this without the stronger inferential force that “Nítorí náà” can carry.'
  naturalness: The revised sentence is fluent Standard Yoruba. The conditional construction “Ìbá ṣe pé ... kì bá tí kú” naturally expresses the unreal past condition and result.
  terminology: “Olúwa” appropriately retains the weight of κύριε in Johannine usage while the footnote preserves the respectful-address alternative. “Ọ̀gá” is retained as a usable contextual equivalent for “Sir,” though it is explicitly presented only as an alternative.
  issues:
  - severity: low
    issue: “Nítorí náà” may sound more inferential than the narrative connective οὖν requires here.
    rationale: In this immediate narrative sequence, “Nígbà náà” more directly represents “So/Then” while avoiding an unnecessary implication that Mary's arrival is chiefly a logical conclusion.
  revised_text: Nígbà náà, nígbà tí Màríà dé ibi tí Jésù wà, tí ó sì rí i, ó wólẹ̀ ní ẹsẹ̀ rẹ̀, ó sì wí fún un pé, “Olúwa[a], ìbá ṣe pé o wà níhìn-ín, arákùnrin mi kì bá tí kú.”
