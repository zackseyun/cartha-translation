id: JHN.11.32
reference: John 11:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: yo
  text: Nígbà náà, nígbà tí Màríà dé ibi tí Jésù wà, tí ó sì rí i, ó wólẹ̀ ní ẹsẹ̀ rẹ̀, ó sì wí fún un pé, “Olúwa[a], ìbá ṣe pé o wà níhìn-ín, arákùnrin mi kì bá tí kú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tí a fi ń pe ẹnì kan; níbí a túmọ̀ rẹ̀ sí “Olúwa” ní ìbámu pẹ̀lú ìlò ọ̀rọ̀ κύριος àti bí Ìhìn Rere Jòhánù ṣe fi Jésù hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì lè fi ìtẹ̀síwájú tàbí àbájáde inú ìtàn hàn.
- source_word: ὡς ἦλθεν
  choice: nígbà tí ... dé
  rationale: Ọ̀nà àdáyébá ní Yorùbá láti sọ ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀ nígbà tí Màríà dé.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: ibi tí Jésù wà
  rationale: Ó pa ìtumọ̀ gbólóhùn ibi náà mọ́ láìfi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἰδοῦσα αὐτόν
  choice: tí ó sì rí i
  rationale: Ó sọ participle náà di gbólóhùn Yorùbá àdáyébá, ó sì pa bí àwọn ìṣe náà ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: ó wólẹ̀ ní ẹsẹ̀ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún wíwólẹ̀ níwájú ẹnì kan lẹ́gbẹ̀ẹ́ ẹsẹ̀ rẹ̀; kò pinnu bóyá ìbọ̀wọ̀ ni tàbí ìṣubú nítorí ìbànújẹ nìkan.
- source_word: λέγουσα αὐτῷ
  choice: ó sì wí fún un pé
  rationale: Ó jẹ́ ìsopọ̀ ọ̀rọ̀ àdáyébá ní Yorùbá fún fífi ọ̀rọ̀ Màríà hàn.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìwúwo ọ̀rọ̀ κύριε mọ́ nínú ìtàn Jòhánù, bí ó tilẹ̀ jẹ́ pé ó tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀.
- source_word: εἰ ἦς ὧδε
  choice: ìbá ṣe pé o wà níhìn-ín
  rationale: Ìkọ̀lé “ìbá ṣe pé” fi ipò àròsọ tí kò ṣẹlẹ̀ ní àkókò tí ó ti kọjá hàn lọ́nà Yorùbá àdáyébá.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: kì bá tí kú
  rationale: Ó sọ àbájáde ohun tí kò ṣẹlẹ̀ ní àkókò tí ó ti kọjá, gẹ́gẹ́ bí οὐκ ἄν pẹ̀lú aorist ṣe túmọ̀ sí níbí.
- source_word: μου ὁ ἀδελφός
  choice: arákùnrin mi
  rationale: μου jẹ́ àmì ohun-ìní, “arákùnrin mi” sì ni ọ̀nà Yorùbá àdáyébá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριε nínú ọ̀rọ̀ tí Màríà bá Jésù sọ
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” bá ìlò κύριος nínú Ìhìn Rere Jòhánù mu, ó sì yẹra fún dídín ọ̀rọ̀ náà kù sí ìkíni ìbọ̀wọ̀ lásán; àkọ́lé ìsàlẹ̀ ṣì pa ìtumọ̀ kejì rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìkọ̀lé gbólóhùn náà jẹ́ àdáyébá fún òǹkàwé gbogbogbò, ṣùgbọ́n ó pa ìsopọ̀ àti àìdánilójú inú Gíríìkì mọ́.
