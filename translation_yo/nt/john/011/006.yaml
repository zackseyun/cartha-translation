  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Jésù gbọ́ pé Lásárù ń ṣàìsàn, nígbà náà ni ó dúró ní ibi tí ó wà fún ọjọ́ méjì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ọ̀rọ̀ yìí so ìṣẹ̀lẹ̀ náà mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì tún fi àkókò hàn; gbolohun Yorùbá yìí pa ipa méjèèjì mọ́ lọ́nà àdánidá.
- source_word: ἤκουσεν
  choice: gbọ́
  rationale: Èyí ni ìtumọ̀ tààrà ti ἀκούω ní àyíká yìí, láìfi èrò míì kún un.
- source_word: ὅτι ἀσθενεῖ
  choice: pé Lasaru ń ṣàìsàn
  rationale: Nínú ìtàn yìí, ἀσθενέω túmọ̀ sí àìsàn ara. A lo orúkọ Lasaru dípò ọ̀rọ̀ arọ́pò-orúkọ nítorí pé lílo “ó” fún Jesu àti Lasaru nínú gbólóhùn kan náà lè da òǹkàwé Yorùbá rú. “Ń ṣàìsàn” tún pa ìṣe tí ó ń lọ lọ́wọ́ ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τότε μὲν
  choice: ó dúró … fún ọjọ́ méjì sí i
  rationale: Ìtẹ̀síwájú àkókò wà nínú ọ̀rọ̀ náà; “sí i” fi hàn pé Jesu tẹ̀ síwájú ní dídúró níbẹ̀, ó sì mú ìtàn náà ṣàn lọ́nà Yorùbá láìlo ọ̀rọ̀ ìtẹnumọ́ tí yóò le.
- source_word: ἔμεινεν
  choice: ó dúró
  rationale: Μένω túmọ̀ sí pé ẹni náà kò kúrò ní ibi tí ó wà; “dúró” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé ní àyíká yìí.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: ní ibi tí ó wà
  rationale: Èyí pa ìtẹnumọ́ ibi inú Gíríìkì mọ́ láìjẹ́ kí gbólóhùn Yorùbá korò.
- source_word: δύο ἡμέρας
  choice: fún ọjọ́ méjì
  rationale: Èyí sọ iye àkókò náà ní tààrà, gẹ́gẹ́ bí accusative of duration inú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ tí ó lè wà nínú bí Jesu ṣe dúró lẹ́yìn tí ó gbọ́ nípa àìsàn Lasaru
  choice: A sọ pé Jesu dúró fún ọjọ́ méjì sí i láìṣàlàyé ìdí rẹ̀.
  alternative: Ṣíṣe àtúnrọ̀ gbolohun náà láti fi hàn pé ìdádúró náà jẹ́ ọgbọ́n àánú tàbí láti dín ìforígbárí inú ìtàn náà kù.
  rationale: 'Ẹsẹ yìí mọ̀ọ́mọ̀ fi ìforígbárí náà sílẹ̀: Jesu gbọ́ nípa àìsàn náà, síbẹ̀ ó dúró. Ìtumọ̀ kò gbọ́dọ̀ yanjú ohun tí ọ̀rọ̀ orísun kò ṣàlàyé.'
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn kíkún ni a lò. Èdè náà jẹ́ ọ̀wọ̀, ó ṣe déédéé, ó sì yé òǹkàwé òde òní. A tún orúkọ Jesu àti Lasaru sọ fún ìmúlérí ẹni tí ọ̀rọ̀ arọ́pò-orúkọ kọ̀ọ̀kan ń tọ́ka sí, nítorí pé “ó … pé ó …” lè ṣókùnkùn ní Yorùbá.
