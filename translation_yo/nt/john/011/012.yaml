source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: yo
  text: Nítorí náà, àwọn ọmọ-ẹ̀yìn náà sọ fún un pé, “Olúwa, bí ó bá ti sùn[a], ara rẹ̀ yóò yá[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó túbọ̀ tẹ̀ lé ọ̀rọ̀ náà gan-an, “bí ó bá ti lọ sùn.” Jésù ti fi oorun ṣàpẹẹrẹ ikú Lasaru, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rò pé oorun lásán ni ó ń sọ.
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀-ìṣe Gíríìkì náà tún lè túmọ̀ sí “a ó gbà á là,” ṣùgbọ́n níbí ó ń tọ́ka sí ìmúláradá kúrò nínú àìsàn: “ara rẹ̀ yóò yá” tàbí “ara rẹ̀ yóò sàn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ àwọn ọmọ-ẹ̀yìn jẹ́ ìpinnu tí wọ́n mú jáde láti inú ohun tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Àmì ìdámọ̀ nínú Gíríìkì tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn tí a ti mọ̀ tẹ́lẹ̀; ‘náà’ mú ìtọ́kasí yẹn hàn ní Yorùbá.
- source_word: αὐτῷ
  choice: fún un
  rationale: Orúkọ arọ́pò-orúkọ náà tọ́ka sí Jésù, ṣùgbọ́n a pa ìlànà orísun mọ́ nípa lílo arọ́pò-orúkọ.
- source_word: Κύριε
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bá κύριος mu, ó sì pa ìbọ̀wọ̀ àti ìtumọ̀ tó jinlẹ̀ tí ọ̀rọ̀ náà lè ní nínú Ìhìn Rere Jòhánù mọ́.
- source_word: εἰ κεκοίμηται
  choice: bí ó bá ti sùn
  rationale: ‘Bí’ pa ipò àdéhùn εἰ mọ́; ‘bá ti sùn’ sì fi ipò tó ti wáyé tí perfect κεκοίμηται ń tọ́ka sí hàn, nígbà tó tún jẹ́ ọ̀rọ̀ oorun lásán gẹ́gẹ́ bí àwọn ọmọ-ẹ̀yìn ṣe lóye rẹ̀.
- source_word: σωθήσεται
  choice: ara rẹ̀ yóò yá
  rationale: Nínú àyíká àìsàn, σῴζω lè túmọ̀ sí jí ara dìde tàbí rí ìlera padà. ‘Ara rẹ̀ yóò yá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé aláìsàn yóò sàn, láìfi ìtumọ̀ ìgbàlà ẹ̀mí kún ẹsẹ náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí àwọn ọmọ-ẹ̀yìn ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ ìbọ̀wọ̀ mọ́, ó sì jẹ́ kí ìtumọ̀ nípa ẹni tí Jésù jẹ́ nínú Jòhánù dúró láìfipá yan ìtumọ̀ kan ṣoṣo.
- issue: Bóyá kí a mú ìtumọ̀ méjì ti κεκοίμηται—oorun àti ikú—hàn ní pàtó nínú ọ̀rọ̀ àkọ́kọ́
  choice: Lo ọ̀rọ̀ oorun lásán nínú ọ̀rọ̀ àkọ́kọ́
  alternative: Lo gbólóhùn tó lè túmọ̀ sí oorun tàbí ikú ní kedere
  rationale: Kókó ìtàn ni pé àwọn ọmọ-ẹ̀yìn lóye ọ̀rọ̀ àpẹẹrẹ Jésù nípa ikú Lasaru bí oorun lásán. ‘Bí ó bá ti sùn’ pa àìgbọ́ye wọn mọ́, àwọn ẹsẹ tó tẹ̀ lé e sì máa ṣàlàyé rẹ̀.
- issue: Bí a ṣe túmọ̀ σωθήσεται nínú àyíká àìsàn
  choice: ara rẹ̀ yóò yá
  alternative: a ó gbà á là
  rationale: Ìtumọ̀ ìlera ló bá èrò àwọn ọmọ-ẹ̀yìn mu níbí. Àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘gbà là’ tí ọ̀rọ̀ Gíríìkì náà tún lè ní pamọ́ fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ara rẹ̀ yóò yá’ jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún ìmúbọ̀sípò láti inú àìsàn; a fi àwọn àlàyé sí ibi tí ọ̀rọ̀ Gíríìkì ní ìtumọ̀ míì.
