id: JHN.11.28
reference: John 11:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: yo
  text: Nígbà tí ó sì ti sọ èyí, ó lọ, ó sì pe Màríà arábìnrin rẹ̀ ní ìkọ̀kọ̀[a], ó sọ pé, “Olùkọ́[b] náà wà níhìn-ín, ó sì ń pè ọ́[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ní àṣírí.” Ọ̀rọ̀ Gíríìkì náà fi hàn pé ó sọ̀rọ̀ láìjẹ́ kí àwọn ẹlòmíràn gbọ́.
    reason: lexical_alternative
  - marker: b
    text: 'A tún lè túmọ̀ rẹ̀ sí “Ọ̀gá.” Ní Gíríìkì: “Olùkọ́.”'
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “ó pè ọ́.” Ìṣe ìsinsìnyí nínú Gíríìkì náà lè túmọ̀ sí “ó ń pè ọ́”; níhìn-ín, ó ṣeé ṣe kó túmọ̀ sí pé ó ń fẹ́ kí o wá sọ́dọ̀ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Nígbà tí ó sì ti sọ èyí
  rationale: Aorist participle náà ń tọ́ka sí ohun tí ó ṣẹ̀ṣẹ̀ parí kí ìṣe tó tẹ̀ lé e bẹ̀rẹ̀; gbolohun yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn.
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó kúrò ní ibi tí ó wà; “ó lọ” ṣe kedere, ó sì bá ìtàn Yorùbá mu.
- source_word: ἐφώνησεν Μαριὰμ
  choice: ó sì pe Màríà
  rationale: Nínú àyíká yìí, φωνέω túmọ̀ sí pípe ẹnì kan wá, kì í ṣe kíkàn ké sí i nìkan.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: arábìnrin rẹ̀
  rationale: Èyí ń dá Màríà mọ̀ gẹ́gẹ́ bí arábìnrin obìnrin náà, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: λάθρᾳ
  choice: ní ìkọ̀kọ̀
  rationale: Adverb náà fi hàn pé kò bá a sọ̀rọ̀ ní gbangba tàbí ní etí àwọn ẹlòmíràn; “ní ìkọ̀kọ̀” pa ìtumọ̀ yìí mọ́ láìfi ète ẹ̀tàn kún un.
- source_word: εἰποῦσα
  choice: ó sọ pé
  rationale: Participle yìí ń ṣáájú ọ̀rọ̀ tí ẹni náà sọ ní tààrà; “ó sọ pé” jẹ́ ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ náà wọlé.
- source_word: Ὁ διδάσκαλος
  choice: Olùkọ́ náà
  rationale: διδάσκαλος túmọ̀ sí olùkọ́, ó sì jẹ́ orúkọ oyè ọ̀wọ̀ fún Jésù níhìn-ín; a kò fi ìtumọ̀ àṣẹ tí kò hàn gbangba sínú rẹ̀.
- source_word: πάρεστιν
  choice: wà níhìn-ín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ẹni náà wà níbẹ̀ tàbí pé ó ti dé; “wà níhìn-ín” pa ìtumọ̀ ìwàníbẹ̀ rẹ̀ mọ́ ní tààrà.
- source_word: φωνεῖ σε
  choice: ń pè ọ́
  rationale: Present tense náà lè fi ìṣe tó ń lọ lọ́wọ́ hàn; nínú àyíká yìí, ó túmọ̀ sí pé Jésù ń fẹ́ kí Màríà wá sọ́dọ̀ rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ orúkọ oyè διδάσκαλος fún Jésù
  choice: Olùkọ́ náà
  alternative: Ọ̀gá náà
  rationale: “Olùkọ́” ni ìtumọ̀ lexical tó sún mọ́ ọ̀rọ̀ Gíríìkì jù, ó sì pa ọ̀wọ̀ inú orúkọ oyè náà mọ́ láìfi ẹ̀kọ́ tàbí àṣẹ míì tí ọ̀rọ̀ náà kò sọ kún un.
- issue: Ìtumọ̀ λάθρᾳ
  choice: ní ìkọ̀kọ̀
  alternative: ní àṣírí
  rationale: Àyíká náà fi ìbánisọ̀rọ̀ tí àwọn ẹlòmíràn kò gbọ́ hàn, ṣùgbọ́n kò sọ pé ẹ̀tàn tàbí ìbẹ̀rù ló fà á; yíyan yìí kò fi ète àfikún sí ìtàn náà.
- issue: Agbára present tense inú φωνεῖ σε
  choice: ó sì ń pè ọ́
  alternative: ó sì pè ọ́
  rationale: Fífi “ń” sí i pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, nígbà tí àyíká náà tún jẹ́ kí a lóye rẹ̀ gẹ́gẹ́ bí ìpè láti wá sọ́dọ̀ Jésù.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí àwọn ọ̀rọ̀ ní kíkún, a sì pa bí ìtàn Gíríìkì ṣe ń tẹ̀ lé ara rẹ̀ mọ́ ní ọ̀nà Yorùbá àdánidá.
