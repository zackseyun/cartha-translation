id: JHN.11.27
reference: John 11:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: yo
  text: Ó sọ fún un pé, “Bẹ́ẹ̀ ni, Olúwa; mo ti gbàgbọ́ pé ìwọ ni Mèsáyà[a], Ọmọ Ọlọ́run, ẹni tí ń bọ̀ wá sí ayé[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός (Christos) jẹ́ àkọlé tó túmọ̀ sí ẹni tí a fi òróró yàn; a túmọ̀ rẹ̀ sí “Mèsáyà” níhìn-ín láti pa ìtumọ̀ àkọlé náà mọ́.
    reason: alternative_reading
  - marker: b
    text: Ní ọ̀nà míì, “ẹni tí ó ń bọ̀ wá sí ayé.” Ọ̀rọ̀ Gíríìkì náà ní ọ̀rọ̀ ìṣe àkókò ìsinsìnyí tí ó ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ; a lè sọ ọ́ ní kíkún gẹ́gẹ́ bí gbólóhùn ìbátan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Ó sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lo ìṣe àkókò ìsinsìnyí nínú ìtàn, lílo àkókò tí ó ti kọjá jẹ́ àṣà ìtàn àdánidá ní Yorùbá. Àyíká ọ̀rọ̀ fi hàn pé Mátà ni ẹni tí ń sọ̀rọ̀.
- source_word: Ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Èyí jẹ́ ìdáhùn ìjẹ́rìí tí ó ṣe kedere, tí ó sì bá ìjíròrò náà mu.
- source_word: κύριε
  choice: Olúwa
  rationale: Nínú ọ̀rọ̀ ìjẹ́wọ́ yìí, ‘Olúwa’ pa ọ̀wọ̀ àti ìtumọ̀ ẹ̀sìn inú àkọlé náà mọ́ ju ‘ọ̀gá’ lọ.
- source_word: πεπίστευκα
  choice: mo ti gbàgbọ́
  rationale: Ìṣe pípé Gíríìkì tọ́ka sí ìgbàgbọ́ tí ó bẹ̀rẹ̀ tẹ́lẹ̀ tí ó sì dúró títí di ìsinsìnyí; ‘mo ti gbàgbọ́’ pa agbára yẹn mọ́ ní Yorùbá àdánidá.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Χριστός jẹ́ àkọlé ẹni àmì òróró; ‘Mèsáyà’ pa ìtumọ̀ àti àyíká ìrètí Júù rẹ̀ mọ́, dípò kí a ka á bí orúkọ lásán.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì pa ìwọ̀n àti agbára àkọlé ìjẹ́wọ́ náà mọ́.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: ẹni tí ń bọ̀ wá sí ayé
  rationale: Gbólóhùn náà fi Jésù hàn gẹ́gẹ́ bí ẹni tí a ń retí, ẹni tí ń bọ̀ sínú ayé ènìyàn; àpólà ìbátan yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí àkọlé ìjẹ́wọ́
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín, ọ̀rọ̀ náà jẹ́ àkọlé tí ó sọ ẹni tí Jésù jẹ́, kì í ṣe orúkọ lásán. ‘Mèsáyà’ mú ìtumọ̀ ẹni àmì òróró àti ìrètí ọba-olùgbàlà jáde.
- issue: Agbára κύριε nínú ọ̀rọ̀ Mátà
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Àyíká ìjẹ́wọ́ pé Jésù ni Mèsáyà àti Ọmọ Ọlọ́run ń ti ìtumọ̀ ọ̀wọ̀ àti ẹ̀sìn lẹ́yìn, láìfi ohun tí kò sí nínú ọ̀rọ̀ náà kún un.
- issue: Ìtumọ̀ àkókò ìṣe πεπίστευκα
  choice: mo ti gbàgbọ́
  alternative: mo gbàgbọ́
  rationale: Ìtumọ̀ tí a yàn fi hàn pé ìgbàgbọ́ náà ti wáyé tẹ́lẹ̀, ipò rẹ̀ sì ṣì dúró; èyí pa ìfarahàn ìṣe pípé Gíríìkì mọ́.
translation_notes:
  register: A lo Yorùbá àpéwọ̀, ọ̀wọ̀, àti ìjẹ́wọ́ tí ó bójú mu fún ìtẹ̀jáde Bíbélì òde òní. Àwọn àmì ohùn wà níbi tí ó ti jẹ́ àdánidá, àwọn àkọlé ‘Olúwa,’ ‘Mèsáyà,’ àti ‘Ọmọ Ọlọ́run’ sì dúró ní ọ̀nà tó níyì, tí ó ṣeé lóye fún òǹkàwé gbogbo.
