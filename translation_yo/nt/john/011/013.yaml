id: JHN.11.13
reference: John 11:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: yo
  text: Jésù ti sọ nípa ikú Lásárù, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn náà rò pé ó ń sọ̀rọ̀ nípa oorun gidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ọ̀rọ̀ Gíríìkì náà jẹ́ ‘oorun ti oorun’; ìtẹnumọ́ ni pé oorun gidi ni, kì í ṣe ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: ti sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ pluperfect, ó sì tọ́ka sí ohun tí Jésù ti sọ ṣáájú ìrònú tí àwọn ọmọ-ẹ̀yìn ní.
- source_word: δὲ … δὲ
  choice: (a kò túmọ̀ àkọ́kọ́ ní tààrà) … ṣùgbọ́n
  rationale: δὲ àkọ́kọ́ jẹ́ àsopọ̀ ìtàn kékeré tí èdè Yorùbá kò nílò láti sọ ní gbangba níbí; èkejì fi ìtumọ̀ Jésù àti àṣìṣe àwọn ọmọ-ẹ̀yìn wéra, nítorí náà ‘ṣùgbọ́n’ bá a mu.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: nípa ikú Lásárù
  rationale: περί pẹ̀lú genitive túmọ̀ sí ‘nípa.’ Lílo orúkọ Lásárù mú ẹni tí αὐτοῦ ń tọ́ka sí ṣe kedere, ó sì yẹra fún kí ‘ikú rẹ̀’ dà bí ẹni pé ikú Jésù ni.
- source_word: ἐκεῖνοι
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà ń tọ́ka sí àwọn ọmọ-ẹ̀yìn tí àyíká ọ̀rọ̀ ti mẹ́nu kàn; sísọ ẹni tí wọ́n jẹ́ mú Yorùbá ṣe kedere láì yí ìtumọ̀ padà.
- source_word: ἔδοξαν
  choice: rò pé
  rationale: Nínú àyíká yìí, δοκέω ń sọ nípa èrò tí kò tọ́ tí àwọn ọmọ-ẹ̀yìn ní; ‘rò pé’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: nípa sísùn oorun
  rationale: Gbólóhùn náà ń tọ́ka sí oorun gidi, ní ìyàtọ̀ sí lílo ‘sùn’ gẹ́gẹ́ bí àpèjúwe fún ikú. ‘Sísùn oorun’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́.
- source_word: λέγει
  choice: ó ń sọ̀rọ̀
  rationale: Bó tilẹ̀ jẹ́ pé present ni fọ́ọ̀mù Gíríìkì, ó ṣiṣẹ́ gẹ́gẹ́ bí historical present; ‘ó ń sọ̀rọ̀’ bá èrò tí wọ́n ní nígbà náà mu.
theological_decisions:
- issue: Bóyá lílo ‘sùn’ fún ikú yẹ kí ó túmọ̀ sí ẹ̀kọ́ pàtó kan nípa ipò àwọn òkú
  choice: Sọ ní kedere pé ikú Lásárù ni Jésù ń tọ́ka sí, kí a sì fi hàn pé oorun gidi ni àwọn ọmọ-ẹ̀yìn rò pé ó ní lọ́kàn.
  alternative: Lo ọ̀rọ̀ tó lè fi ẹ̀kọ́ kan nípa ipò ọkàn lẹ́yìn ikú kún ẹsẹ náà.
  rationale: 'Ẹsẹ náà ṣàlàyé àìgbọ́ra-ẹni-yé nínú ìtàn: Jésù lo sísùn gẹ́gẹ́ bí àpèjúwe ikú, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn gbà pé oorun gidi ni. Kò yẹ kí ìtumọ̀ fi ẹ̀kọ́ ìjọ kan kún un.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́wọ̀, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn níbi tó yẹ, a sì yan ‘sísùn oorun’ dípò gbólóhùn líle tí yóò fara wé genitive Gíríìkì ní tààrà.
