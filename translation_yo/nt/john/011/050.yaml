id: JHN.11.50
reference: John 11:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: yo
  text: Ẹ kò sì ronú pé ó sàn fún yín kí ọkùnrin kan kú fún àwọn ènìyàn[a], kí gbogbo orílẹ̀-èdè má sì ṣègbé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àǹfààní àwọn ènìyàn”; gbólóhùn náà tún lè ní ìtumọ̀ “ní ipò àwọn ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Bẹ́ẹ̀ ni ẹ kò
  rationale: Ó so ìbáwí yìí mọ́ ọ̀rọ̀ tó ṣáájú, ó sì fi kún un ní ọ̀nà àdánidá ní Yorùbá.
- source_word: λογίζεσθε
  choice: ronú
  rationale: Nínú àyíká ìgbìmọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ọgbọ́n gbé ọ̀ràn yẹ̀ wò tàbí ṣírò ohun tó máa ṣe wọ́n láǹfààní.
- source_word: συμφέρει
  choice: ó sàn
  rationale: Ó sọ àǹfààní tó dá lórí ìfiwéra ní èdè Yorùbá tó ṣe kedere, láìsọ ọ̀rọ̀ náà di àlàyé jù.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó pa ìtumọ̀ dátífù àǹfààní mọ́, ó sì fi hàn pé Káyáfà ń sọ ohun tó máa ṣe wọ́n láǹfààní.
- source_word: ἵνα
  choice: kí
  rationale: ‘Kí’ ló bá gbólóhùn ‘ó sàn fún yín’ mu ní Yorùbá, ó sì mú ìbáṣepọ̀ àkóónú/àbájáde inú gbólóhùn Gíríìkì jáde.
- source_word: εἷς ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Ó pa ẹyọ ọ̀kan àti ìṣàmì akọ inú Gíríìkì mọ́.
- source_word: ἀποθάνῃ
  choice: kú
  rationale: Ó sọ ìṣe ikú ní tààràtà, ní ìbámu pẹ̀lú gbólóhùn ‘kí ... kú.’
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: nítorí àwọn ènìyàn
  rationale: ‘Nítorí’ níbí lè tọ́ka sí ikú fún àǹfààní wọn tàbí ikú ní ipò wọn; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ méjèèjì mọ́.
- source_word: λαοῦ
  choice: àwọn ènìyàn
  rationale: Ó tọ́ka sí àwọn ènìyàn Júù gẹ́gẹ́ bí àwùjọ orílẹ̀-èdè, ó sì jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ‘the people.’
- source_word: ὅλον τὸ ἔθνος
  choice: gbogbo orílẹ̀-èdè
  rationale: Ó fi gbogbo àwùjọ náà hàn gẹ́gẹ́ bí ẹ̀yà àti orílẹ̀-èdè kan, kì í ṣe àwọn Kèfèrí.
- source_word: ἀπόληται
  choice: ṣègbé
  rationale: Ó mú ìtumọ̀ ìparun tàbí òfo ńlá jáde ní ọ̀nà tó lágbára, tó sì bójú mu ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ὑπὲρ nípa ikú Jésù
  choice: A lo ‘nítorí àwọn ènìyàn’ nínú ẹsẹ̀ pàtàkì.
  alternative: ‘fún àǹfààní àwọn ènìyàn’ tàbí ‘ní ipò àwọn ènìyàn’
  rationale: Káyáfà ń sọ̀rọ̀ nípa ọgbọ́n ìṣèlú, ṣùgbọ́n ajíhìnrere sọ lẹ́yìn náà pé ọ̀rọ̀ rẹ̀ jẹ́ àsọtẹ́lẹ̀ láìmọ̀. Ìtumọ̀ tó gbòòrò yìí pa àǹfààní, aṣojú, àti ìrópò mọ́ láìfipá yan ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹ/yín’ gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn síbi tí ó yẹ.
