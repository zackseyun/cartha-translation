id: JHN.11.21
reference: John 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: yo
  text: Mátà sì sọ fún Jésù pé, “Olúwa[a], ká ní o wà níhìn-ín, arákùnrin mi kì bá tí kú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá”; ọ̀rọ̀ Gíríìkì náà lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí a fi ń pe ẹnì kan, ṣùgbọ́n “Olúwa” tún pa ìtumọ̀ tó ṣeé ṣe nípa ẹni tí Jésù jẹ́ mọ́ nínú Ìhìnrere Jòhánù.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: sì
  rationale: Nínú ìtàn yìí, οὖν ń so ọ̀rọ̀ Mátà mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀. “Sì” jẹ́ ọ̀nà àdánidá ní Yorùbá láti tẹ̀síwájú nínú ìtàn, láìfi ìtumọ̀ ìdí tàbí àbájáde tó lágbára jù kún un.
- source_word: εἶπεν ... πρὸς τὸν Ἰησοῦν
  choice: sọ fún Jésù pé
  rationale: Àkójọpọ̀ yìí fi Jésù hàn gẹ́gẹ́ bí ẹni tí Mátà ń bá sọ̀rọ̀. “Sọ fún Jésù pé” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá ìtàn mu.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ fún ẹni tó ga, ó sì tún lè ru ìtumọ̀ ẹ̀kọ́ nípa ẹni tí Jésù jẹ́ nínú Ìhìnrere Jòhánù. Ó pa ìwọ̀n ìtumọ̀ Gíríìkì mọ́ ju “Ọ̀gá” lọ.
- source_word: εἰ ἦς ὧδε
  choice: ká ní o wà níhìn-ín
  rationale: “Ká ní” fi ipò àròsọ tí kò ṣẹlẹ̀ hàn lọ́nà àdánidá ní Yorùbá; “o wà níhìn-ín” sì túmọ̀ ὧδε ní tààrà.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: kì bá tí kú
  rationale: “Kì bá tí kú” sọ àbájáde ohun àtijọ́ tí kò ṣẹlẹ̀, ó sì bá οὐκ + ἄν + aorist indicative mu.
- source_word: ὁ ἀδελφός μου
  choice: arákùnrin mi
  rationale: Níhìn-ín ἀδελφός ń tọ́ka sí Lásárù, àbúrò tàbí ẹ̀gbọ́n Mátà tó jẹ́ ọkùnrin; “arákùnrin mi” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ láì pinnu bóyá ó jẹ́ àbúrò tàbí ẹ̀gbọ́n.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ tí Mátà fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: '“Olúwa” pa méjèèjì mọ́: ó lè jẹ́ ìkíni ọ̀wọ̀, ó sì lè ní ìtumọ̀ tó jinlẹ̀ nípa Jésù. Ẹsẹ̀ yìí fúnra rẹ̀ kò fipá mú ká yan ọ̀kan ṣoṣo nínú méjèèjì.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtijọ́-kì-í-ṣe, tó bójú mu, tó sì ṣeé yé fún òǹkàwé òde òní. A lo “ká ní ... kì bá tí ...” láti sọ ipò àtijọ́ tí kò ṣẹlẹ̀ lọ́nà Yorùbá àdánidá; a sì fi àmì ohùn sí ibi tó yẹ.
