  source_fidelity: 'Ìtumọ̀ náà fi gbogbo àwọn apá pàtàkì ti Gíríìkì hàn dáadáa: οὖν gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn (“sì”), ìsọ̀rọ̀ Mátà sí Jésù, ìpè Κύριε, ipò àròsọ àtijọ́ tí kò ṣẹlẹ̀, àti àbájáde pé arákùnrin rẹ̀ kì bá tí kú. Ìlànà “ká ní ... kì bá tí ...” pa ìdí-ọba ìpò àròsọ náà mọ́ láìfi ìtúmọ̀ míì kún un.'
  naturalness: “Mátà sì sọ fún Jésù pé” jẹ́ Yorùbá òde òní tó mọ́ àti tó bójú mu. “Ká ní o wà níhìn-ín, arákùnrin mi kì bá tí kú” jẹ́ ọ̀nà àdánidá láti sọ ohun tí kò ṣẹlẹ̀ ní ìgbà tí ó ti kọjá. Àmì ohùn àti ìkọ̀wé orúkọ wà ní ìpele tó yẹ.
  terminology: “Olúwa” bá ìpinnu iṣẹ́ náà fún κύριε mu, ó sì ń pa agbára ìkíni ọ̀wọ̀ àti ìfẹ́sẹ̀mulẹ̀ ìtumọ̀ Kristẹni tó ṣeé ṣe nínú Jòhánù mọ́. “Arákùnrin mi” tọ́ka pẹ̀lú ìdánilójú sí arákùnrin Mátà, kì í ṣe arákùnrin nínú ìgbàgbọ́. Àlàyé-ẹsẹ̀ [a] jẹ́ ìtọ́nisọ́nà tó yẹ, ó sì so mọ́ “Olúwa” ní ibi tí ó tọ́.
