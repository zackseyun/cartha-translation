  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀kan nínú wọn, Káyáfà, ẹni tí ó jẹ́ olórí àlùfáà ní ọdún náà, sọ fún wọn pé, “Ẹ̀yin kò mọ̀ ohunkóhun rárá.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Ṣùgbọ́n ọ̀kan nínú wọn
  rationale: Àkójọpọ̀ εἷς ... τις ń tọ́ka sí ẹnì kan lára ẹgbẹ́ náà. ‘Ọ̀kan nínú wọn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá; ‘Ṣùgbọ́n’ sì fi ìyípadà oníwọ̀nba láti inú ìjíròrò tó ṣáájú hàn.
- source_word: Καϊάφας
  choice: Káyáfà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ Gíríìkì yìí ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí fi ipò àlùfáà gíga kan ṣoṣo yàtọ̀ sí àwọn olórí láàárín àwọn àlùfáà lápapọ̀.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ẹni tí ó jẹ́ olórí àlùfáà ní ọdún náà
  rationale: Gbólóhùn aláápọn náà ṣàpèjúwe Káyáfà. ‘Ní ọdún náà’ jẹ́ Yorùbá tó ṣe déédé, láìfi àlàyé míì kún àkíyèsí àkókò tí Jòhánù ṣe.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ tí ẹni kan sọ sí àwọn ẹlòmíràn wọlé.
- source_word: Ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ jáde ní Gíríìkì ní ìtẹnumọ́; ‘Ẹ̀yin’ pa ìtẹnumọ́ sí ẹgbẹ́ tí Káyáfà ń bá wí mọ́.
- source_word: οὐκ οἴδατε οὐδέν
  choice: kò mọ ohunkóhun rárá
  rationale: Àìfẹ́ méjì nínú Gíríìkì jẹ́ ìtẹnumọ́, kì í ṣe kí wọ́n fagilé ara wọn. ‘Ohunkóhun rárá’ mú ìbáwí líle náà jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Àkíyèsí Jòhánù nípa ipò Káyáfà ní ọdún náà
  choice: ẹni tí ó jẹ́ olórí àlùfáà ní ọdún náà
  alternative: ẹni tí ó jẹ́ olórí àlùfáà ọdún náà
  rationale: A túmọ̀ ọ́ gẹ́gẹ́ bí àpèjúwe ìtàn ní tààrà, láìṣàlàyé bí ipò olórí àlùfáà ṣe ń ṣiṣẹ́ tàbí láìyanjú ìtumọ̀ ìkọ̀kọ̀ inú ìtàn Jòhánù.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìbáwí ìparí jẹ́ líle gẹ́gẹ́ bí Gíríìkì, ṣùgbọ́n ó ṣàn lọ́nà àdánidá ní Yorùbá.
