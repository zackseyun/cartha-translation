language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: yo
  text: Nítorí náà, inú Jésù sì tún ru gidigidi[a], ó sì dé ibi ìsìnkú náà. Ihò àpáta ni ibi náà, òkúta kan sì bo ẹnu ọ̀nà rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó bínú gidigidi nínú ara rẹ̀,” tàbí “ó dààmú gidigidi nínú ara rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lágbára gan-an, ó sì lè fi ìmọ̀lára tó ju ìbànújẹ́ nìkan lọ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nígbà náà
  rationale: Ó ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì ń mú ìtàn náà tẹ̀ síwájú lọ́nà àdánidá ní Yorùbá.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé ìdàrúdàpọ̀ inú Jésù tún ṣẹlẹ̀ gẹ́gẹ́ bí ó ti ṣẹlẹ̀ ṣáájú.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: inú rẹ̀ sì ń ru gidigidi
  rationale: Gbólóhùn yìí pa agbára ìmọ̀lára inú náà mọ́ láì fi dandan sọ pé ìbànújẹ́ nìkan ni tàbí ìbínú nìkan; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì hàn.
- source_word: ἔρχεται
  choice: dé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ àsìkò ìsinsìnyí nínú ìtàn, àsìkò àtẹ̀yìnwá tí ó hàn nínú ‘dé’ bá ìtàn Yorùbá mu.
- source_word: μνημεῖον
  choice: ibi ibojì
  rationale: Ó tọ́ka sí ibi tí a sin òkú sí, tí àyíká ẹsẹ náà sì ṣàpèjúwe gẹ́gẹ́ bí ihò àpáta.
- source_word: σπήλαιον
  choice: ihò àpáta
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ ihò inú àpáta tí a lò bí ibojì.
- source_word: λίθος
  choice: òkúta
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún òkúta tí a fi ti ibojì.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: wọ́n sì fi òkúta kan dí ẹnu ọ̀nà rẹ̀
  rationale: Nítorí ibojì náà jẹ́ ihò àpáta, gbólóhùn yìí sọ ipò òkúta náà ní kedere àti lọ́nà àdánidá, bí ó ṣe wà ní ẹnu ọ̀nà láti dí i.
theological_decisions:
- issue: Agbára àti irú ìmọ̀lára tí ἐμβριμώμενος sọ nípa Jésù
  choice: A sọ pé inú Jésù ń ru gidigidi, láì pààlà rẹ̀ sí ìbànújẹ́ tàbí ìbínú nìkan.
  alternative: Inú bí Jésù gidigidi; tàbí ọkàn Jésù dàrú gidigidi.
  rationale: Ọ̀rọ̀ Gíríìkì náà lágbára, ó sì lè ní ìtumọ̀ ìbínú tàbí ìdàrúdàpọ̀ ọkàn tó jinlẹ̀. Ọ̀rọ̀ inú ẹsẹ náà kò pinnu ìmọ̀lára kan ṣoṣo, nítorí náà a pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá àti tó ṣe kedere ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ihò àpáta’ àti ‘dí ẹnu ọ̀nà rẹ̀’ mú àwòrán ibojì náà yé òǹkàwé lójú ẹsẹ̀, láì mú ẹ̀kọ́ ìsìn ẹgbẹ́ kankan wọ inú rẹ̀.
