id: JHN.11.54
reference: John 11:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: yo
  text: Nítorí náà, Jésù kò tún rìn ní gbangba láàárín àwọn Júù[a] mọ́, ṣùgbọ́n ó kúrò níbẹ̀ lọ sí agbègbè tí ó wà nítòsí aginjù, sí ìlú kan tí a ń pè ní Éfúrémù; ó sì dúró níbẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín àwọn ará Jùdíà.” Nínú ìwé Jòhánù, “àwọn Júù” lè tọ́ka ní pàtó sí àwọn ará Jùdíà tàbí sí àwọn aláṣẹ Júù, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde ìdìtẹ̀ tí a ṣẹ̀ṣẹ̀ sọ nínú ẹsẹ tó ṣáájú hàn, ó sì bá èdè Yorùbá ọ̀wọ̀ mu.
- source_word: οὐκέτι παρρησίᾳ περιεπάτει
  choice: kò tún máa rìn ní gbangba
  rationale: “Kò tún” fi dídá ìṣe tẹ́lẹ̀ dúró hàn; “ní gbangba” túmọ̀ παρρησίᾳ gẹ́gẹ́ bí ìfarahàn ní gbangba, “máa rìn” sì pa ìṣe tí ó ń lọ lọ́wọ́ nínú περιεπάτει mọ́.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: láàárín àwọn Júù
  rationale: Ó pa ìtumọ̀ àwùjọ ẹni náà mọ́ láìfi dandan sọ pé àwọn aṣáájú nìkan ni; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ agbègbè “àwọn ará Jùdíà” mọ́.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: ó kúrò níbẹ̀ lọ
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìṣípadà láti ibi kan sí òmíràn, tí ó sì pa agbára ìtàn náà mọ́.
- source_word: χώραν ἐγγὺς τῆς ἐρήμου
  choice: agbègbè tí ó wà nítòsí aginjù
  rationale: “Agbègbè” tọ́ka sí ilẹ̀ tàbí àgbègbè kan, kì í ṣe orílẹ̀-èdè òde òní; “aginjù” bá ilẹ̀ tí ènìyàn kò pọ̀ sí mu.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: sí ìlú kan tí a ń pè ní Éfúrémù
  rationale: “Ìlú” lè bo ìlú ńlá tàbí kékeré bí πόλις ṣe rí; “tí a ń pè ní” jẹ́ ọ̀nà Yorùbá àdánidá láti tú λεγομένην.
- source_word: κἀκεῖ ἔμεινεν μετὰ τῶν μαθητῶν
  choice: ó sì dúró níbẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn náà
  rationale: “Dúró níbẹ̀” bá ìtumọ̀ μένω nínú ìrìn-àjò mu; “àwọn ọmọ-ẹ̀yìn náà” kò ṣàfikún ọ̀rọ̀ ohun-ìní tí kò sí nínú Gíríìkì.
theological_decisions:
- issue: Ẹni tí Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ ẹ̀yà, agbègbè, tàbí àwọn aláṣẹ gẹ́gẹ́ bí àyíká ọ̀rọ̀. Níhìn-ín, gbólóhùn náà sọ ibi tí Jésù kò fi ara hàn ní gbangba mọ́, kò sì dá gbogbo àwọn Júù lẹ́bi; àlàyé pa ìtumọ̀ agbègbè tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, kedere, àti ti òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì yan “Éfúrémù” gẹ́gẹ́ bí ìkọ̀wé orúkọ Ephraim tí ó rọrùn fún olùkà Yorùbá.
