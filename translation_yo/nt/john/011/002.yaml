id: JHN.11.2
reference: John 11:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: yo
  text: Màríà ni ẹni tí ó fi òróró olóòórùn dídùn[a] kun Olúwa, tí ó sì fi irun rẹ̀ nu ẹsẹ̀ rẹ̀; Lásárù, arákùnrin rẹ̀, sì ń ṣàìsàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun ìkunra olóòórùn dídùn”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí òróró tàbí ohun ìkunra tí a fi òórùn dídùn sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Màríà yìí ni ẹni
  rationale: Àgbékalẹ̀ yìí dá Màríà mọ̀ ní ọ̀nà àdánidá ní Yorùbá, ó sì jẹ́ kí δέ ṣiṣẹ́ gẹ́gẹ́ bí ìtẹ̀síwájú ọ̀rọ̀ láì fi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἡ ἀλείψασα
  choice: tí ó fi ... yan
  rationale: Àpólà aláápọn aorist náà ń ṣàpèjúwe Màríà nípa ohun tí ó ṣe; gbolohun àsopọ̀ Yorùbá yìí jẹ́ àdánidá, kò sì fipá mú àmì àkókò tí èdè Yorùbá kò nílò níbí.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Ó pa oyè ọlá àti ìwúwo ìtàn κύριος mọ́ nígbà tí a ń tọ́ka sí Jésù.
- source_word: μύρῳ
  choice: òróró olóòórùn dídùn
  rationale: μύρον túmọ̀ sí òróró tàbí ohun ìkunra tí a fi òórùn dídùn sí; yíyan yìí ṣe kedere, ó sì bá ìṣe fífi òróró yàn mu.
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: tí ó sì fi ... nu ẹsẹ̀ rẹ̀
  rationale: ἐκμάσσω túmọ̀ sí píparẹ́ tàbí píparẹ́ kí ó gbẹ; ‘nu’ ni ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye ní àyíká yìí.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: fi irun rẹ̀
  rationale: Dative náà jẹ́ ti ohun èlò; ‘fi irun rẹ̀’ fi ìtumọ̀ yẹn hàn ní Yorùbá àdánidá.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: Lásárù, arákùnrin rẹ̀
  rationale: Ó pa ìbátan Màríà àti Lásárù mọ́ ní kedere, bí ó tilẹ̀ jẹ́ pé a pín gbolohun Gíríìkì sí apá méjì fún ìrọ̀rùn Yorùbá.
- source_word: ἠσθένει
  choice: ń ṣàìsàn
  rationale: Nínú àyíká yìí, ἀσθενέω ń tọ́ka sí àìsàn ara; àmì ‘ń’ bá imperfect Gíríìkì mu nípa fífi ipò tó ń lọ lọ́wọ́ hàn.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí oyè Jésù
  choice: Olúwa
  alternative: ọ̀gá
  rationale: ‘Olúwa’ pa ọlá, ipa ìtàn, àti ìwúwo ẹ̀kọ́-ìgbàgbọ́ oyè náà mọ́; ‘ọ̀gá’ lè dín un kù sí ìbátan àwùjọ lásán.
translation_notes:
  register: Yorùbá àpéjọ, ti òde òní, tí ó ní iyì ni a lò. ‘Màríà yìí ni ẹni’ ń ṣiṣẹ́ gẹ́gẹ́ bí ìdánimọ̀ àlàyé, àmì àárín-gbolohun sì ń jẹ́ kí ìbátan Màríà àti Lásárù ṣe kedere láì dá èrò orísun rú.
