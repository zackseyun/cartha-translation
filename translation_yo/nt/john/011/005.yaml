  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: yo
  text: Jésù sì fẹ́ràn Mátà àti arábìnrin rẹ̀ àti Lásárù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: fẹ́ràn
  rationale: Ọ̀rọ̀ yìí wá láti ἀγαπάω; “fẹ́ràn” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìfẹ́ tí Jésù ní sí wọn. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà wà ní imperfect, àyíká yìí ń tọ́ka sí ìfẹ́ tí ó ń bá a lọ, èyí tí “fẹ́ràn” lè sọ lọ́nà tí kò ní le koko.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń so gbólóhùn yìí mọ́ ìtàn tó ṣáájú; “sì” dára ní Yorùbá láìfi ìtumọ̀ àtakò líle kún un.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: arábìnrin rẹ̀
  rationale: Èyí túmọ̀ nọ́ọ̀nù àti arọ́pò-orúkọ ohun-ìní náà lọ́nà Yorùbá tí ó ṣe déédé, láìfi orúkọ Màríà kún ẹsẹ yìí.
- source_word: Μάρθαν
  choice: Mátà
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá tí ó wọ́pọ̀.
- source_word: Λάζαρον
  choice: Lásárù
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá tí ó wọ́pọ̀.
- source_word: καὶ ... καὶ ... καὶ
  choice: àti ... àti ... àti
  rationale: Àtúnṣe καί náà ń so àwọn mẹ́tẹ̀ẹ̀ta pọ̀ ní ìwọ̀ntúnwọ̀nsì; pípa “àti” mọ́ ní ọ̀kọ̀ọ̀kan ń tẹ̀ lé ètò Gíríìkì.
theological_decisions:
- issue: Agbára imperfect ἠγάπα nípa ìfẹ́ Jésù
  choice: Gbólóhùn tó rọrùn nípa ìfẹ́ tí Jésù ní, tí ó sì ń bá a lọ, sí Mátà, arábìnrin rẹ̀, àti Lásárù
  alternative: Kí a túmọ̀ ọ́ sí pé ó bẹ̀rẹ̀ sí nífẹ̀ẹ́ wọn, tàbí kí a tẹnumọ́ rẹ̀ gẹ́gẹ́ bí “ń fẹ́ràn”
  rationale: Imperfect náà sábà ń ṣàpèjúwe ipò tí ó ń bá a lọ ní àkókò tí ó ti kọjá. Ẹsẹ náà sọ ìfẹ́ Jésù láìfi ẹ̀kọ́ tàbí ìmọ̀lára míì tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Yorùbá àpéjọ tí ó bójú mu, tí ó ní àmì ohùn ní kíkún, tó sì ṣeé lóye fún òǹkàwé òde òní. “Sì” ń pa àsopọ̀ ìtàn mọ́, nígbà tí àtúnṣe “àti” ń ṣètìlẹ́yìn fún ìwọ̀ntúnwọ̀nsì àwọn orúkọ mẹ́tẹ̀ẹ̀ta.
