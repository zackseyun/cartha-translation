translation:
  language: yo
  text: Jésù sunkún[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù da omijé silẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà ń tọ́ka ní pàtó sí sísọ omijé; ó yàtọ̀ sí ẹkún ohùn rara tí a ṣàpèjúwe níbòmíràn nínú àyíká ìtàn yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: sunkún
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ aorist active indicative, ẹni kẹta ẹyọ, láti inú δακρύω, ó sì ń tọ́ka sí sísọ omijé. “Sunkún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó ṣe àdánidá, tí kò sì fi ìtumọ̀ pé ó ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ sí í sunkún kún ọ̀rọ̀ Gíríìkì náà.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Orúkọ àdáni pẹ̀lú article ni ó jẹ́ olùṣe nínú gbólóhùn Gíríìkì. Ní Yorùbá, “Jésù” nìkan ni ìtumọ̀ àdánidá.
theological_decisions:
- issue: Ìfihàn ìmọ̀lára Jésù
  choice: Jésù sunkún
  alternative: Omijé Jésù dà
  rationale: Ìtumọ̀ náà fi ìmọ̀lára ènìyàn tòótọ́ ti Jésù hàn ní ọ̀nà ìtàn tó rọrùn, láì dín un kù tàbí mú un lágbára ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, kúkúrú, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá yẹ.
