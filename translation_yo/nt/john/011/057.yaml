  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: yo
  text: Àwọn olórí àlùfáà àti àwọn Farisí sì ti pàṣẹ pé bí ẹnikẹ́ni bá mọ ibi tí ó wà, kí ó sọ ibi náà fún wọn, kí wọ́n lè mú un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mú un” lè túmọ̀ sí “dì í mú” tàbí “mu un ní agbára” nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: ti pàṣẹ
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ pluperfect, ó sì fi hàn pé wọ́n ti ṣe ohun náà ṣáájú àkókò ìtàn yìí; “ti pàṣẹ” sọ ìṣe tí ó ti ṣẹlẹ̀ tẹ́lẹ̀ ní Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú láìfi ìtakora líle hàn; “sì” bá iṣẹ́ yìí mu ní Yorùbá.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ọ̀pọ̀-orúkọ náà tọ́ka sí àwọn aláṣẹ àgbà nínú ẹgbẹ́ àlùfáà, kì í ṣe pé ọ̀pọ̀ àlùfáà àgbà kan náà ló wà nípò.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni àkọsílẹ̀ orúkọ ẹgbẹ́ Júù náà tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: ἐντολὰς
  choice: pàṣẹ
  rationale: Nínú àyíká ìṣàkóso yìí, ó túmọ̀ sí àṣẹ tí àwọn olórí gbé kalẹ̀, kì í ṣe ìmọ̀ràn lásán.
- source_word: ἵνα ἐάν τις γνῷ ποῦ ἐστιν
  choice: pé bí ẹnikẹ́ni bá mọ ibi tí ó wà
  rationale: Ìtumọ̀ yìí pa gbólóhùn oníṣ条件 náà mọ́, ó sì tọ́ka sí àkóónú àṣẹ náà. “Ó wà” tún pa present tense Gíríìkì mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: μηνύσῃ
  choice: kí ó fi tó wọn létí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ kí àwọn aláṣẹ mọ̀ tàbí jíjẹ́rìí ibi tí ẹni náà wà; fífi “wọn” kún un mú ẹni tí a ó sọ fún ṣe kedere láti inú àyíká.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: kí wọn lè mú un
  rationale: Gbólóhùn náà sọ ète àṣẹ náà. “Mú un” jẹ́ ọ̀nà Yorùbá àdánidá fún lílo agbára láti gba ẹni náà, ó sì lè ní ìtumọ̀ mímú ẹni ní àṣẹ láìfi ètò òfin kan pàtó kún un.
