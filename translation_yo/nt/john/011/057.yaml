  source_fidelity: Ìtumọ̀ náà mú ìbáṣepọ̀ àwọn olórí àlùfáà àti àwọn Farisí, ìṣe pluperfect nínú “ti pàṣẹ,” ipò àìmọ̀dájú “bí ẹnikẹ́ni bá mọ,” àti ète “kí wọ́n lè mú un” hàn dáadáa. Ṣùgbọ́n “fi tó wọn létí” túmọ̀ sí rán wọn létí ju kí ó túmọ̀ sí jíjẹ́ kí àwọn aláṣẹ mọ̀/ṣíṣọ ìròyìn fún wọn lọ; nítorí náà kò ṣe aṣojú μηνύσῃ dáadáa nínú àyíká yìí.
  naturalness: “Fi tó wọn létí” kò dára gẹ́gẹ́ bí ọ̀rọ̀ ìròyìn sí àwọn aláṣẹ; ó lè jẹ́ kí òǹkàwé lóye pé ẹni náà kan ń rántí ohun kan fún wọn. “Kí ó sọ ibi tí ó wà fún wọn” jẹ́ kedere, ó sì jẹ́ Yorùbá àgbéléwọ̀n.
  terminology: “Àwọn olórí àlùfáà,” “àwọn Farisí,” àti “mú un” yẹ. Àmì-àlàyé nípa “fiṣẹ́ mú un” nílò àtúnṣe sí “fi iṣẹ́ mú un,” ṣùgbọ́n “fi iṣẹ́ mú un” kò dájú gẹ́gẹ́ bí yíyàn ọ̀rọ̀ tó bá πιάσωσιν mu; “mu un”/“fi agbára mú un” dára jù.
