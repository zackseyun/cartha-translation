translation_notes:
  register: Èdè Yorùbá àgbéléwọ̀n, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A pa àmì ohùn mọ́ níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹ̀ka kan pàtó.
