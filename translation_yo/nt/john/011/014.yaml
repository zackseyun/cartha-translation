  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: yo
  text: Nígbà náà ni Jésù sọ fún wọn ní kedere pé, “Lásárù ti kú.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  choice: Nítorí náà
  rationale: Àpapọ̀ ọ̀rọ̀ náà ń tẹ ìtàn náà síwájú, ó sì ń fi àbájáde ohun tí a sọ ṣáájú hàn. ‘Nítorí náà’ jẹ́ ọ̀nà àdánidá láti fi ipa ìyípadà àti ìyọrísí náà hàn ní Yorùbá.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe déédé fún ‘ó sọ fún wọn,’ láìfi ìtumọ̀ míì kún un.
- source_word: παρρησίᾳ
  choice: ní kedere
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà yàtọ̀ sí ọ̀rọ̀ àfiwé nípa oorun tí Jésù sọ tẹ́lẹ̀; ó túmọ̀ sí pé ó sọ ohun náà láìṣàpèjúwe tàbí ṣíṣókùnkùn.
- source_word: Λάζαρος
  choice: Lásárù
  rationale: A lo ìrísí orúkọ náà tí ó wọ́pọ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἀπέθανεν
  choice: ti kú
  rationale: Aorist náà sọ nípa ìṣẹ̀lẹ̀ ikú tí ó ti ṣẹlẹ̀. ‘Ti kú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó tún fi ipò rẹ̀ lọ́wọ́lọ́wọ́ hàn.
theological_decisions:
- issue: Ìtumọ̀ ohun tí Jésù sọ nípa ipò Lásárù
  choice: Ọ̀rọ̀ tààrà pé Lásárù ti kú nípa ti ara
  alternative: Kí a tún lo àfiwé oorun tí ó wà ní ẹsẹ ṣáájú
  rationale: Ọ̀rọ̀ Gíríìkì ἀπέθανεν tú àìyédè ọ̀rọ̀ àfiwé oorun ṣáájú kedere; nítorí náà, ìtumọ̀ kò gbọ́dọ̀ pa àfiwé náà mọ́ níbí.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó lọ́lá, tó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A yan ‘ní kedere’ fún παρρησίᾳ láti fi ìyàtọ̀ rẹ̀ sí ọ̀rọ̀ àfiwé ṣáájú hàn.
