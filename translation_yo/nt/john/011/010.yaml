id: JHN.11.10
reference: John 11:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni bá ń rìn ní òru, ó máa ń kọsẹ̀, nítorí ìmọ́lẹ̀ kò sí nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìmọ́lẹ̀ kò sí pẹ̀lú rẹ̀.” Èdè Gíríìkì sọ ní tààràtà pé, “nínú rẹ̀,” èyí tí ó lè túmọ̀ sí ju pé ìmọ́lẹ̀ òde kò sí lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: Ṣùgbọ́n bí ... bá
  rationale: Ó pa ìyàtọ̀ tí δέ ń fi hàn mọ́, ó sì tú ἐὰν sí ọ̀nà àdéhùn tí ó bá èdè Yorùbá mu.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó fi ìtumọ̀ àpapọ̀ tí arọ́pò-orúkọ aláìlórúkọ náà ní hàn láì fi sí ẹni kan pàtó.
- source_word: περιπατῇ
  choice: ń rìn
  rationale: Ó pa àwòrán rírìn gangan mọ́, ó sì ṣí sí ìtumọ̀ ìwà tàbí ti ẹ̀mí tí ọ̀rọ̀ náà lè ní nínú Jòhánù.
- source_word: ἐν τῇ νυκτί
  choice: ní òru
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ wíwà tàbí rírìn ní àkókò òru, ó sì pa àwòrán òru mọ́ dípò yíyí i sí ‘òkùnkùn.’
- source_word: προσκόπτει
  choice: ó máa ń kọsẹ̀
  rationale: Fọ́ọ̀mù yìí mú ipa àpapọ̀ gbolóhùn àdéhùn náà jáde, ó sì pa ìtumọ̀ gangan àti àkàwé ti προσκόπτει mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó sọ ìdí tí ẹni náà fi ń kọsẹ̀ ní kedere.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ti àdánidá, ó sì pa àwòrán ìmọ́lẹ̀ àti agbára ìtumọ̀ ẹ̀mí rẹ̀ mọ́.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: kò sí nínú rẹ̀
  rationale: Ó tẹ̀lé ἐν ní pẹkipẹki gẹ́gẹ́ bí ‘nínú,’ láì sọ ọ́ di àìsí ìmọ́lẹ̀ ní àyíká ẹni náà nìkan.
theological_decisions:
- issue: Ìtọ́kasí àti agbára ọ̀rọ̀ ‘ìmọ́lẹ̀ kò sí nínú rẹ̀’
  choice: 'Pa ọ̀rọ̀ inú ẹni náà mọ́: ‘kò sí nínú rẹ̀.’'
  alternative: ‘ìmọ́lẹ̀ kò sí pẹ̀lú rẹ̀,’ gẹ́gẹ́ bí àìsí ìmọ́lẹ̀ lóde nìkan.
  rationale: ἐν túmọ̀ sí ‘nínú’ lọ́nà àdánidá, èdè ìmọ́lẹ̀ àti òkùnkùn nínú Jòhánù sì lè ní ìjinlẹ̀ ti ẹ̀mí. Ìtumọ̀ yìí pa ìforígbárí náà mọ́ láì pinnu pé ó jẹ́ ti ara nìkan tàbí ti ẹ̀mí nìkan.
translation_notes:
  register: Èdè Yorùbá àpéjọ tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo ‘ní òru’ fún ọ̀rọ̀ àdánidá, ṣùgbọ́n a pa ‘nínú rẹ̀’ mọ́ nítorí ìtumọ̀ Gíríìkì àti ìjinlẹ̀ èdè Jòhánù.
