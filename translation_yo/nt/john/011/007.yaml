source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: yo
  text: Lẹ́yìn èyí, ó wá sọ fún àwọn ọmọ-ẹ̀yìn náà pé, “Ẹ jẹ́ kí a tún lọ sí Jùdíà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Lẹ́yìn èyí
  rationale: Àpapọ̀ gbólóhùn náà ń tọ́ka sí ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú ìtàn. ‘Lẹ́yìn èyí’ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú àkókò mọ́ láìṣe àfikún tí kò sí nínú Gíríìkì.
- source_word: λέγει
  choice: ó sọ
  rationale: Gíríìkì lo àkókò ìsinsìnyí gẹ́gẹ́ bí historical present. Yorùbá kì í fi ìrísí àkókò hàn bí Gíríìkì; ‘ó sọ’ jẹ́ ọ̀nà àdánidá láti ròyìn ìṣẹ̀lẹ̀ náà, láìsọ ìtumọ̀ di ohun míì.
- source_word: τοῖς μαθηταῖς
  choice: fún àwọn ọmọ-ẹ̀yìn náà
  rationale: ‘Àwọn ọmọ-ẹ̀yìn’ jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún μαθηταί. ‘Náà’ ń tọ́ka sí ẹgbẹ́ tí a ti mọ̀ nínú àyíká ọ̀rọ̀, láìfi ọ̀rọ̀ ‘rẹ̀’ tí kò hàn gbangba nínú Gíríìkì kún un.
- source_word: Ἄγωμεν
  choice: Ẹ jẹ́ kí a ... lọ
  rationale: 'Èyí fi agbára hortatory subjunctive hàn: Jésù ń pe ara rẹ̀ àti àwọn ọmọ-ẹ̀yìn rẹ̀ sí ìgbésẹ̀ kan náà. Ọ̀nà yìí jẹ́ mímọ́, àdánidá, ó sì ṣeé lóye ní Yorùbá òde òní.'
- source_word: εἰς τὴν Ἰουδαίαν
  choice: sí Jùdíà
  rationale: ‘Sí’ fi ìdarí ìrìnàjò hàn lọ́nà àdánidá ní Yorùbá, ó sì lè gba ìtumọ̀ ‘to/into’ ti εἰς nínú àyíká yìí láìní àlàyé àfikún.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ fi hàn pé wọ́n máa padà lọ sí agbègbè tí wọ́n ti lọ tẹ́lẹ̀, ó sì jẹ́ ìbámu taara àti àdánidá fún πάλιν.
theological_decisions:
- issue: Historical present nínú ìròyìn Jòhánù
  choice: Lo ‘ó sọ’ gẹ́gẹ́ bí ìròyìn Yorùbá àdánidá
  alternative: ‘Ó ń sọ’ láti fara mọ́ fọ́ọ̀mù ìsinsìnyí Gíríìkì ní pẹkipẹki
  rationale: ‘Ó ń sọ’ lè dà bí ìṣe tó ń lọ lọ́wọ́ ju historical present lọ ní Yorùbá. ‘Ó sọ’ pa ìṣẹ̀lẹ̀ ìtàn mọ́ kedere, kò sì yí kókó ẹ̀kọ́ ìgbàgbọ́ kankan padà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ mímọ́, ọ̀wọ̀, àti àdánidá fún òǹkàwé òde òní. A kò fi àmì àlàyé sí εἰς, nítorí ‘sí’ ni Yorùbá lè bo méjèèjì ‘to’ àti ‘into’ ní àyíká yìí, nítorí náà àṣàyàn Gẹ̀ẹ́sì náà kò fa àìṣedéédé gidi nínú ìtumọ̀ Yorùbá.
