id: JHN.17.8
reference: John 17:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: yo
  text: Nítorí àwọn ọ̀rọ̀ tí o fi fún mi ni mo ti fi fún wọn[a]; wọ́n sì gbà wọ́n, wọ́n sì mọ̀ ní tòótọ́ pé láti ọ̀dọ̀ rẹ ni mo ti jáde wá[b], wọ́n sì gbàgbọ́ pé ìwọ ni ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àsọyé tí o fi fún mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti ọ̀dọ̀ rẹ ni mo ti wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: àwọn ọ̀rọ̀
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ àti ti ohun tí a sọ mọ́; ó ṣeé lóye ju yíyí i padà sí ‘iṣẹ́ ìránṣẹ́’ kan ṣoṣo lọ.
- source_word: ἔδωκάς ... δέδωκα
  choice: o fi fún mi ... mo ti fi fún wọn
  rationale: ‘Fi ... fún’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún fífúnni ní ọ̀rọ̀; ‘mo ti fi fún’ tún fi hàn pé iṣẹ́ náà ti parí, àbájáde rẹ̀ sì wà.
- source_word: ἔλαβον
  choice: wọ́n gbà wọ́n
  rationale: ‘Gbà’ bá ohun tí a fi fún wọn mu, kò sì fi ìtumọ̀ ‘fọwọ́ sí’ tí ó túmọ̀ sí ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ἔγνωσαν ἀληθῶς
  choice: wọ́n mọ̀ ní tòótọ́
  rationale: Ó túmọ̀ ἀληθῶς ní tààrà, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání láìfi ìtumọ̀ ìdánilójú nìkan rọ́pò rẹ̀.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: láti ọ̀dọ̀ rẹ ni mo ti jáde wá
  rationale: Ó pa èrò orísun àti ìjáde tí ọ̀rọ̀ Gíríìkì ní mọ́, láìsọ ìbáṣepọ̀ náà di ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ fúnra rẹ̀ kò ṣàlàyé.
- source_word: ἐπίστευσαν
  choice: wọ́n gbàgbọ́
  rationale: Nítorí pé gbólóhùn ὅτι tẹ̀ lé e, ‘gbàgbọ́ pé’ sọ ìgbàgbọ́ nínú òtítọ́ ọ̀rọ̀ kan ní tààrà.
- source_word: ἀπέστειλας
  choice: ìwọ ni ó rán mi
  rationale: ‘Rán’ jẹ́ ìbámu Yorùbá tó ṣe kedere fún iṣẹ́ bíbanisọ lọ, ó sì pa ìtẹnumọ́ lórí ‘ìwọ’ mọ́.
- source_word: ὅτι (initial)
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé, bí ὅτι ṣe ń ṣiṣẹ́ ní àyíká yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ Jesu àti Baba nínú παρὰ σοῦ ἐξῆλθον
  choice: láti ọ̀dọ̀ rẹ ni mo ti jáde wá
  alternative: láti ọ̀dọ̀ rẹ ni mo ti wá
  rationale: Ìtumọ̀ àkọ́kọ́ pa agbára ἐξῆλθον (‘jáde wá’) àti orísun παρά mọ́, ṣùgbọ́n kò fi ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn sí i.
- issue: Ìtumọ̀ πιστεύω pẹ̀lú gbólóhùn ὅτι
  choice: wọ́n gbàgbọ́ pé
  alternative: wọ́n ní ìgbẹ́kẹ̀lé pé
  rationale: ‘Gbàgbọ́ pé’ bá ìṣètò gbólóhùn tó sọ ohun tí wọ́n gbà pé ó jẹ́ òtítọ́ mu; ‘ní ìgbẹ́kẹ̀lé’ lè yí agbára rẹ̀ sí ìbáṣepọ̀ ju èdè orísun lọ.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, ti òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo ‘ìwọ ni ó’ láti pa ìtẹnumọ́ σύ mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
