  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: yo
  text: Mo sì ti fi orúkọ rẹ hàn fún wọn, èmi yóò sì fi í hàn, kí ìfẹ́ tí o fi fẹ́ràn mi lè wà nínú wọn, kí èmi náà sì lè wà nínú wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώρισα
  choice: Mo sì ti sọ ... di mímọ̀
  rationale: Ó fi ìtumọ̀ causative γνωρίζω hàn ní Yorùbá àdánidá, ó sì bá àkókò aorist àti àfiwé rẹ̀ pẹ̀lú γνωρίσω mu.
- source_word: τὸ ὄνομά σου
  choice: orúkọ rẹ
  rationale: Ó pa àpèjúwe gidi ‘orúkọ’ mọ́, láì fi ìtumọ̀ bí ‘ìwà rẹ’ tàbí ‘ẹni tí ìwọ jẹ́’ rọ́pò rẹ̀ nínú ọ̀rọ̀ pàtàkì.
- source_word: γνωρίσω
  choice: èmi yóò sì tún sọ ọ́ di mímọ̀
  rationale: Ọ̀rọ̀ ọjọ́ iwájú náà bá γνωρίσω mu; ‘ọ́’ tọ́ka padà sí orúkọ, ‘tún’ sì mú ìbáṣepọ̀ pẹ̀lú ohun tí a ti ṣe tẹ́lẹ̀ yéni ní Yorùbá.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí sọ ète tàbí àbájáde tí ἵνα lè ní jáde ní Yorùbá àdánidá.
- source_word: ἡ ἀγάπη
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún ἀγάπη níhìn-ín.
- source_word: ἣν ἠγάπησάς με
  choice: tí o fi fẹ́ràn mi
  rationale: Ìlò ‘fi’ mú ọ̀nà tàbí ìfẹ́ tí Baba fi fẹ́ Ọmọ hàn, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn.
- source_word: ἐν αὐτοῖς
  choice: nínú wọn
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún ἐν pẹ̀lú dative, ó sì pa àkòrí wíwà-inú-ẹni nínú Jòhánù mọ́.
- source_word: ᾖ
  choice: lè wà
  rationale: Ó fi subjunctive lẹ́yìn ἵνα hàn lọ́nà Yorùbá àdánidá.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: kí èmi náà sì wà nínú wọn
  rationale: Yorùbá nílò kí a sọ ọ̀rọ̀-ìṣe náà jáde fún ìtumọ̀ kedere; ‘náà’ fi κἀγώ hàn, láì yí ìṣọ̀kan àwọn ohun méjèèjì padà.
theological_decisions:
- issue: Ìtumọ̀ ‘orúkọ rẹ’ nínú ẹ̀kọ́ Jòhánù
  choice: Pa ‘orúkọ rẹ’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘ìwà rẹ’ tàbí ‘ẹni tí ìwọ jẹ́’
  rationale: ‘Orúkọ’ ní agbára láti tọ́ka sí ẹni tí Ọlọ́run jẹ́ àti ìwà rẹ̀ tí ó ti fi hàn, ṣùgbọ́n fífi àlàyé náà sí inú ọ̀rọ̀ pàtàkì yóò tú ohun tí Gíríìkì fi sílẹ̀ ní àkúnya.
- issue: Ìbáṣepọ̀ ìfẹ́ Ọlọ́run àti wíwà Kristi nínú wọn ní gbólóhùn ìkẹyìn
  choice: 'Ṣe àfihàn wọn gẹ́gẹ́ bí ohun méjì tí a so pọ̀: ‘kí ìfẹ́ ... lè wà nínú wọn, kí èmi náà sì wà nínú wọn.’'
  alternative: Ṣe ọ̀kan lára wọn ní ìdí tàbí àbájáde èkejì.
  rationale: Gíríìkì so àwọn òtítọ́ méjèèjì pọ̀ láì sọ pé ọ̀kan ló fa èkejì; ìtumọ̀ náà pa ìdọ́gba àti àkúnya yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní ọlá, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ìwọ/o’ fún ẹni kan gẹ́gẹ́ bí Yorùbá àdánidá, a sì lo ‘wọn’ fún àwọn ọmọ-ẹ̀yìn púpọ̀.
