review_pass:
  verdict: revise
  source_fidelity: Àwọn ọ̀rọ̀ Gíríìkì ἐγνώρισα/γνωρίσω túmọ̀ sí ‘jẹ́ kí a mọ̀’ tàbí ‘fi hàn,’ kì í ṣe ‘sọ di mímọ̀,’ èyí tí ó túmọ̀ sí mímọ́ tàbí yíyà sí mímọ́. ‘Tún’ kò sí nínú Gíríìkì, nítorí náà a yọ ọ́ kúrò. Ìpìlẹ̀ ἵνα àti ìṣọ̀kan ìfẹ́ náà pẹ̀lú wíwà Jesu nínú wọn ni a pa mọ́.
  naturalness: ‘Fi orúkọ rẹ hàn fún wọn’ jẹ́ Yorùbá boṣewa, ó sì dáa fún ìtumọ̀ ìfihàn/mímú-mọ̀. Fífi ‘lè’ sí apá kejì tún jẹ́ kí ìpìlẹ̀ ìfẹ́-ètè náà kedere ní Yorùbá.
  terminology: ‘Orúkọ rẹ,’ ‘ìfẹ́,’ àti ‘nínú wọn’ dáa, wọ́n sì pa ọ̀rọ̀ àti àkòrí Jòhánù mọ́. Àlàyé ìsàlẹ̀ nípa ‘orúkọ’ ni a tún kọ́ kí ó má bàa sọ ohun tí ọ̀rọ̀ pàtàkì kọjá.
