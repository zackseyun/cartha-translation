source:
  edition: SBLGNT
  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: yo
  text: Sọ wọ́n di mímọ́ nínú òtítọ́[a]; ọ̀rọ̀ rẹ jẹ́ òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ rẹ ni òtítọ́.” Nínú Gíríìkì, ἀλήθεια (“òtítọ́”) wà ní ipò orúkọ-àpèjúwe, kò sì ní article; èyí lè tẹnumọ́ ànímọ́ náà (“jẹ́ òtítọ́”) dípò ìdánimọ̀ lásán.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: Sọ … di mímọ́
  rationale: Ọ̀rọ̀-ìṣe àṣẹ aorist ni; gbólóhùn Yorùbá yìí mú ìtumọ̀ fífi ènìyàn ya sọ́tọ̀ fún Ọlọ́run àti jíjẹ́ mímọ́ jáde ní èdè adayébá.
- source_word: αὐτοὺς
  choice: wọ́n
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ olùgbà ọ̀pọ̀ ni, ó sì ń tọ́ka sí àwọn ọmọ-ẹ̀yìn.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: nínú òtítọ́
  rationale: “Nínú” pa ààyè fún ìtumọ̀ jíjẹ́ nínú agbègbè òtítọ́ àti ṣíṣe nípasẹ̀ òtítọ́, láì dín ἐν kù sí ohun èlò nìkan.
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: Níhìn-ín, λόγος ni ọ̀rọ̀ tí Ọlọ́run ti sọ tàbí fi hàn; “ọ̀rọ̀” jẹ́ èdè Yorùbá tó mọ́gbọ́n dání, ó sì bá ìlò Johanu mu.
- source_word: ὁ σὸς
  choice: rẹ
  rationale: Àpólà Gíríìkì náà túmọ̀ sí ọ̀rọ̀ tí ó jẹ́ ti ẹni tí a ń bá sọ̀rọ̀; “rẹ” ni ọ̀nà Yorùbá adayébá láti fi hàn.
- source_word: ἀλήθειά ἐστιν
  choice: jẹ́ òtítọ́
  rationale: Orúkọ-àpèjúwe ἀλήθεια kò ní article ní Gíríìkì; “jẹ́ òtítọ́” pa agbára ànímọ́ rẹ̀ mọ́ dípò yíyí i sí “jẹ́ òtítọ́” gẹ́gẹ́ bí àpèjúwe lasán.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ἀλήθεια nínú gbólóhùn kejì gẹ́gẹ́ bí ànímọ́ tàbí ìdánimọ̀ pàtó
  choice: ọ̀rọ̀ rẹ jẹ́ òtítọ́
  alternative: ọ̀rọ̀ rẹ ni òtítọ́ náà
  rationale: Nítorí ἀλήθεια tí ó jẹ́ predicate kò ní article, ànímọ́ òtítọ́ ni ó ṣeé ṣe kí ó tẹnumọ́. Ìtumọ̀ yìí fìdí òtítọ́ ọ̀rọ̀ Ọlọ́run múlẹ̀ láì fi ìtumọ̀ pàtó kan lé Gíríìkì lórí; a sì tọ́ka sí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì yé òǹkàwé òde òní ni a lò. “Sọ … di mímọ́” jẹ́ adayébá ju lílo ọ̀rọ̀ àjèjì fún “sanctify” lọ, nígbà tí “nínú òtítọ́” pa fífẹ̀ ìtumọ̀ preposition Gíríìkì mọ́. Àmì ohùn kún ibi tí ó yẹ.
