source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: yo
  text: Èmi sì ti fi ògo tí ìwọ ti fi fún mi fún wọn[a], kí wọ́n lè jẹ́ ọ̀kan, gẹ́gẹ́ bí àwa jẹ́ ọ̀kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Èmi pẹ̀lú ti fi ògo tí ìwọ ti fi fún mi fún wọn.” Ọ̀rọ̀ Gíríìkì κἀγώ lè tẹnumọ́ ìtumọ̀ àfikún pé “èmi pẹ̀lú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Èmi sì
  rationale: Àkójọpọ̀ καί + ἐγώ so gbólóhùn yìí mọ́ ohun tó ṣáájú, ó sì mú ‘èmi’ hàn kedere. ‘Sì’ lè ní ìtumọ̀ ìtẹ̀síwájú tàbí àfikún láìfi ọ̀kan ṣoṣo múlẹ̀.
- source_word: δόξαν
  choice: ògo
  rationale: ‘Ògo’ pa ìwọ̀n ìtumọ̀ θεολογικὸς ti δόξα mọ́ nínú Ìhìn Rere Jòhánù; kò dín in kù sí ọlá ènìyàn tàbí ẹwà ìta.
- source_word: ἣν δέδωκάς μοι
  choice: tí ìwọ fi fún mi
  rationale: Àpẹẹrẹ ‘ti ... fi fún’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí ògo náà, ó sì pa ìṣe tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ń bá a lọ mọ́.
- source_word: δέδωκα αὐτοῖς
  choice: ti fi ... fún wọn
  rationale: A lo ‘ti’ láti fi hàn pé fífún náà ti ṣẹlẹ̀, ipa rẹ̀ sì dúró; ‘fún wọn’ jẹ́ ìṣètò ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἵνα ὦσιν
  choice: kí wọ́n lè jẹ́
  rationale: ‘Kí ... lè’ sọ ète tàbí àbájáde tí a ń fẹ́ hàn ní Yorùbá àdánidá, ní ìbámu pẹ̀lú ἵνα àti ọ̀rọ̀-ìṣe aláìdánilójú ὦσιν.
- source_word: ἓν
  choice: ọ̀kan
  rationale: ‘Ọ̀kan’ pa àkótán ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí ìṣọ̀kan láìtumọ̀ rẹ̀ sí jíjẹ́ ẹni kan náà.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra hàn kedere ní èdè Yorùbá òde òní.
- source_word: ἡμεῖς ἕν
  choice: àwa ti jẹ́ ọ̀kan
  rationale: ‘Àwa’ pa ìtẹnumọ́ arọ́pò-orúkọ mọ́; ‘jẹ́ ọ̀kan’ sì yàgò fún ṣíṣe àlàyé irú ìṣọ̀kan náà ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Irú ìṣọ̀kan àwọn onígbàgbọ́ ní ìfiwéra pẹ̀lú ìṣọ̀kan Baba àti Ọmọ
  choice: kí wọ́n lè jẹ́ ọ̀kan, gẹ́gẹ́ bí àwa ti jẹ́ ọ̀kan
  alternative: Láti túmọ̀ rẹ̀ ní pàtó sí ìṣọ̀kan ìbáṣepọ̀, ìṣọ̀kan iṣẹ́, ìṣọ̀kan ilé-ìjọsìn, tàbí kíkópa nínú ìyè Ọlọ́run
  rationale: Ọ̀rọ̀ náà fi ìṣọ̀kan àwọn ọmọ-ẹ̀yìn wé ti Baba àti Ọmọ, ṣùgbọ́n kò ṣàlàyé irú ìṣọ̀kan náà níbí. Ìtumọ̀ náà jẹ́ kí ìṣòro ẹ̀kọ́-ìgbàgbọ́ yìí dúró láìfi ìtumọ̀ ẹ̀sìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A pa àtúnṣe ọ̀rọ̀ ‘fi ... fún ... fún’ mọ́ nítorí ó ṣàfihàn ìbáṣepọ̀ àwọn fífún méjèèjì nínú orísun, bó tilẹ̀ jẹ́ pé ó ní ìtúnrá díẹ̀.
