  terminology: ‘Ògo,’ ‘ọ̀kan,’ àti ‘gẹ́gẹ́ bí’ jẹ́ àwọn yíyan tó péye. ‘Ọ̀kan’ ń pa àìmú-ìtumọ̀ púpọ̀ kún ἓν mọ́; kò sọ irú ìṣọ̀kan náà di pàtó. Àkọsílẹ̀ ẹsẹ̀ a ń ṣàlàyé agbára àfikún κἀγώ láìsọ pé ó jẹ́ dandan.
