id: JHN.17.4
reference: John 17:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: yo
  text: Mo ti ṣe ọ́ lógo lórí ilẹ̀ ayé nípa píparí iṣẹ́ tí o fi fún mi láti ṣe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí mo parí iṣẹ́ tí o fi fún mi láti ṣe.”
    reason: Àṣàyàn ìtumọ̀ fún participle τελειώσας, èyí tí a lè lóye gẹ́gẹ́ bí ohun tó ń bá ìṣe pàtàkì lọ tàbí gẹ́gẹ́ bí àkókò.
lexical_decisions:
- source_word: ἐδόξασα
  choice: ṣe ọ́ lógo
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ Johanu mọ́ pé Jésù mú ògo wá fún Baba, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé ju ‘bọ̀wọ̀ fún’ lọ ní àyíká ẹ̀kọ́ ìgbàgbọ́ yìí.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó pa ìtumọ̀ ibi tí ἐπί pẹ̀lú ọ̀rọ̀-orúkọ ẹlẹ́ni-kejì ń fi hàn mọ́, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: τελειώσας
  choice: nípa píparí
  rationale: Aorist participle náà lè ṣàlàyé ọ̀nà tí Jésù gbà ṣe Baba lógo; ‘nípa píparí’ mú ìbáṣepọ̀ yẹn hàn ní kedere láì sọ àṣàyàn gírámà míì nù.
- source_word: τὸ ἔργον
  choice: iṣẹ́
  rationale: ‘Iṣẹ́’ jẹ́ ìtumọ̀ tààrà, tó sì yẹ fún iṣẹ́ àṣẹ tí Baba gbé fún Jésù nínú Johanu.
- source_word: δέδωκάς μοι
  choice: tí o fi fún mi
  rationale: Ọ̀rọ̀ yìí sọ ìṣe fífún náà àti ipa rẹ̀ tó ṣì wà di òní; ó jẹ́ àdánidá ní Yorùbá.
- source_word: ἵνα ποιήσω
  choice: láti ṣe
  rationale: ‘Láti ṣe’ fi ète iṣẹ́ tí a fi fún un hàn ní Yorùbá tó rọrùn, tó sì péye.
- source_word: ἐγώ σε
  choice: Mo ... ọ́
  rationale: Àfihàn ẹni àkọ́kọ́ àti ẹni kejì wà ní kedere; fífi ‘èmi fúnra mi’ kún un yóò jẹ́ ìtúmọ̀ àṣejù ní Yorùbá.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín bí Jésù ṣe Baba lógo àti τελειώσας
  choice: 'A tú participle náà sí ọ̀nà tàbí ohun èlò: Jésù ṣe Baba lógo nípa píparí iṣẹ́ náà.'
  alternative: A tún lè tú u sí ‘lẹ́yìn tí mo parí iṣẹ́ náà’ tàbí ‘mo ṣe ọ́ lógo lórí ilẹ̀ ayé; mo parí iṣẹ́ náà.’
  rationale: Ètò ọ̀rọ̀ Gíríìkì bá ìtumọ̀ ọ̀nà mu dáadáa, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn participle oníṣòwò mọ́, láì fi ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òye-gbogbo-ni ni a lò. A lo ‘ṣe ... lógo’ láti pa ìtumọ̀ pàtàkì Johanu mọ́, ‘lórí ilẹ̀ ayé’ fún ìtumọ̀ ibi, àti ‘nípa píparí’ láti fi ìbáṣepọ̀ participle hàn. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
