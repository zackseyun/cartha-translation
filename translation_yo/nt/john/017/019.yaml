source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: yo
  text: Nítorí wọn, èmi sì ya ara mi sí mímọ́[a], kí àwọn náà lè jẹ́ ẹni tí a ti yà sí mímọ́ nínú òtítọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ya ara mi sọ́tọ̀.” Ọ̀rọ̀-ìṣe Gíríìkì kan náà ni a lò lẹ́yìn náà nínú ẹsẹ yìí fún “yà sí mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú òtítọ́ náà”; fi wé 17:17.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: Nítorí wọn
  rationale: Ó fi hàn pé ohun tí Jésù ṣe jẹ́ fún àǹfààní wọn, láìfi ìtumọ̀ ìrọ́pò kún ọ̀rọ̀ náà.
- source_word: ἁγιάζω ἐμαυτόν
  choice: ya ara mi sí mímọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ti yíya ara ẹni sọ́tọ̀ fún Ọlọ́run àti iṣẹ́ rẹ̀; ó yẹ fún Jésù ju èrò pé ó ń di mímọ́ kúrò nínú àìmọ́ lọ.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìkọ̀ yìí ń sọ ète tàbí àbájáde tí a fẹ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: καὶ αὐτοὶ
  choice: àwọn pẹ̀lú
  rationale: Ó pa ìtumọ̀ àfikún àti ìtẹnumọ́ náà mọ́ ní èdè Yorùbá tó rọrùn.
- source_word: ἡγιασμένοι
  choice: jẹ́ ẹni tí a yà sí mímọ́
  rationale: Ó pa gbòngbò ọ̀rọ̀ kan náà mọ́ pẹ̀lú ‘ya ara mi sí mímọ́,’ ó sì fi ohùn àṣeṣe àti ipò tí ìṣe náà mú wá hàn.
- source_word: ἐν ἀληθείᾳ
  choice: nínú òtítọ́
  rationale: Ó fi òtítọ́ hàn gẹ́gẹ́ bí àyíká tàbí ipò yíya sí mímọ́, láìfi atọ́ka tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìtumọ̀ bí Jésù ṣe ya ara rẹ̀ sí mímọ́
  choice: Jésù ya ara rẹ̀ sọ́tọ̀, ó sì fi ara rẹ̀ fún iṣẹ́ Ọlọ́run nítorí àwọn ọmọ-ẹ̀yìn.
  alternative: Jésù mú ara rẹ̀ di mímọ́ ní ti ìwà.
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ἁγιάζω túmọ̀ sí ìyàsọ́tọ̀ àti ìfara-ẹni-fúnni, kì í ṣe pé Jésù ń kọjá láti inú àìmọ́ sí mímọ́.
- issue: Agbára ἐν ἀληθείᾳ
  choice: nínú òtítọ́
  alternative: nínú òtítọ́ náà; nípasẹ̀ òtítọ́
  rationale: Gíríìkì kò ní atọ́ka níbí; ìtumọ̀ yìí pa àìdánilójú tó bófin mu mọ́, ó sì tún jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹsẹ 17 ṣeé gbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye. A lo ‘ya ... sí mímọ́’ láti pa ìtumọ̀ ìyàsọ́tọ̀ àti àtúnlò gbòngbò Gíríìkì mọ́; a sì fi àwọn àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
