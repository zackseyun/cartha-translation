revisions:
- from: Èmi kò bẹ̀ ọ́ pé kí o mú wọn kúrò nínú ayé, bí kò ṣe pé kí o pa wọ́n mọ́ kúrò lọ́wọ́ ẹni ibi náà.[a]
  to: N kò ń bẹ̀ ọ́ pé kí o mú wọn kúrò nínú ayé, ṣùgbọ́n pé kí o pa wọ́n mọ́ kúrò lọ́wọ́ ẹni búburú.[a]
  rationale: Àtúnṣe náà yọ ìtẹnumọ́ ẹni-ọba tí orísun kò sọ, ó lo ìṣe tí ń lọ lọwọ fún ἐρωτῶ, ó sì rọ́pò ọ̀rọ̀ tí kò wọ́pọ̀ «ẹni ibi náà» pẹ̀lú «ẹni búburú». A ṣetọju ìtumọ̀ ara-ẹni tí a yàn nínú ọ̀rọ̀ àkọ́kọ́, ṣùgbọ́n a fi ìtumọ̀ aláìlẹ́ni «ibi» sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe jẹ́ aláìdánilójú.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:23Z'
