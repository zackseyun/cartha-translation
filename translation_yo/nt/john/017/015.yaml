id: JHN.17.15
reference: John 17:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: yo
  text: N kò ń bẹ̀ ọ́ pé kí o mú wọn kúrò nínú ayé, ṣùgbọ́n pé kí o pa wọ́n mọ́ kúrò lọ́wọ́ ẹni búburú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí o pa wọ́n mọ́ kúrò nínú ibi.” Ọ̀rọ̀ Gíríìkì náà, τοῦ πονηροῦ, lè túmọ̀ sí “ẹni búburú” tàbí “ibi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: Mo bẹ̀ ọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí bíbéèrè tàbí bíbẹ ẹnì kan; nínú àdúrà Jesu sí Baba, “bẹ̀ ọ́” jẹ́ èdè Yorùbá àdánidá tó sì yẹ fún ọ̀wọ̀.
- source_word: ἄρῃς
  choice: mú ... kúrò
  rationale: Ó ṣàfihàn mímú wọn kúrò ní ibi kan, ó sì bá ìtumọ̀ αἴρω pẹ̀lú ἐκ mu.
- source_word: κόσμου
  choice: ayé
  rationale: “Ayé” ni ìtumọ̀ Yorùbá tó gbòòrò, tó sì jẹ́ àdánidá fún κόσμος láì fi ìtumọ̀ pàtó kan kún un.
- source_word: τηρήσῃς
  choice: pa ... mọ́
  rationale: “Pa mọ́” lè sọ ìṣọ́ra, ààbò, àti ìtọ́jú; ó ṣetọju ìtumọ̀ gbòòrò ti τηρέω láì sọ ọ̀nà ààbò náà di pàtó jù.
- source_word: ἐκ
  choice: kúrò lọ́wọ́
  rationale: Pẹ̀lú “pa ... mọ́,” ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí a dáàbò bo wọn lọ́wọ́ ewu tàbí ẹni kan.
- source_word: τοῦ πονηροῦ
  choice: ẹni ibi náà
  rationale: Àpólà Gíríìkì náà lè tọ́ka sí ẹni ibi kan tàbí sí ibi ní gbogbogbòò. “Ẹni ibi náà” mú ìtumọ̀ ti ara ẹni tí àyíká ọ̀rọ̀ Johanu ṣe àtìlẹ́yìn fún, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
theological_decisions:
- issue: Bóyá τοῦ πονηροῦ túmọ̀ sí ibi ní gbogbogbòò tàbí ẹni ibi náà
  choice: ẹni ibi náà
  alternative: ibi
  rationale: Ìrísí Gíríìkì náà ní àìdánilójú gidi, ṣùgbọ́n lílo rẹ̀ nínú àwọn ìwé Johanu àti àyíká ààbò Ọlọ́run ṣe àtìlẹ́yìn fún ẹni ibi kan. A fi ìtumọ̀ “ibi” sínú àlàyé ìsàlẹ̀ kí a má bàa mú àìdánilójú ẹ̀kọ́ ìgbàgbọ́ náà kúrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì, tí àwọn òǹkàwé gbogbo lè lóye. “Bí kò ṣe pé” ṣetọju ìyàtọ̀ láàárín àwọn ẹ̀bẹ̀ méjèèjì; a sì fi àmì ohùn sí ibi tí ó yẹ.
