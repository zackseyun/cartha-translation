  - severity: medium
    issue: «Ẹni ibi náà» kò rọrùn, ó sì lè dà bí ẹni búburú kan tí a ti mẹ́nuba tẹ́lẹ̀.
    rationale: «Ẹni búburú» jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere síi fún ìtumọ̀ ara-ẹni ti «the evil one». «Náà» tún lè mú ìtọ́kasí padà sí ẹni kan tí àyíká ò ti dárúkọ.
  - severity: low
