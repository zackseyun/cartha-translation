  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ àkọ́kọ́ ẹsẹ̀ náà dáadáa: Jesu kò béèrè pé kí Baba mú àwọn ọmọlẹ́yìn rẹ̀ kúrò nínú ayé, ṣùgbọ́n pé kí ó pa wọ́n mọ́ kúrò lọ́wọ́ ewu náà. Síbẹ̀, «Èmi» ń fi ìtẹnumọ́ kún ẹni-ọba tí kò hàn nínú Gíríìkì, «ẹni ibi náà» sì kì í ṣe ọ̀nà Yorùbá tó rọrùn tàbí tó péye láti fi hàn ẹni búburú náà. A gbọdọ̀ pa àìdánilójú τοῦ πονηροῦ mọ́ nínú àlàyé ìsàlẹ̀.'
  naturalness: «N kò ń bẹ̀ ọ́» jẹ́ ọ̀nà àdánidá láti sọ ἐρωτῶ ní àyíká àdúrà, ó sì ń fi ìṣe tí ń lọ lọwọ hàn. «Ṣùgbọ́n pé» jẹ́ ìyàtọ̀ tó mọ́ láàárín ohun tí Jesu kò béèrè àti ohun tí ó béèrè. «Ẹni búburú» jẹ́ ìsọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání ju «ẹni ibi náà» lọ ní ìtumọ̀ ẹni kan.
  terminology: A ti pa «ayé» fún κόσμος, «mú ... kúrò» fún αἴρω, àti «pa ... mọ́» fún τηρέω mọ́. «Ẹni búburú» ń gbé ìtumọ̀ ti ara-ẹni fún τοῦ πονηροῦ kalẹ̀ láì dárúkọ Èṣù tàbí láti fi ìtumọ̀ ẹ̀kọ́ kan tí Gíríìkì kò sọ ní tààrà hàn; àlàyé ìsàlẹ̀ ń pa ìtumọ̀ «ibi» mọ́.
