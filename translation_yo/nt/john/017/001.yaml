id: JHN.17.1
reference: John 17:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: yo
  text: Jésù sọ nǹkan wọ̀nyí. Ó sì gbé ojú rẹ̀ sókè sí ọ̀run, ó ní, “Baba, wákàtí náà dé. Ṣe Ọmọ rẹ lógo, kí Ọmọ náà lè ṣe ọ lógo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ aláìlẹ́mìí yìí ń tọ́ka sẹ́yìn sí àwọn ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ; ‘nǹkan wọ̀nyí’ jẹ́ Yorùbá àdánidá tí ó pa ìtọ́kasí náà mọ́.
- source_word: ἐλάλησεν
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ‘sọ̀rọ̀,’ ‘sọ’ bá ohun tí a sọ ṣáájú àti gbólóhùn tó tẹ̀ lé e mu dáadáa ní Yorùbá.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: gbé ojú rẹ̀ sókè
  rationale: Èyí pa ìṣe ara tí ọ̀rọ̀ Gíríìkì ṣàpèjúwe mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: εἰς τὸν οὐρανόν
  choice: sí ọ̀run
  rationale: ‘Sí’ fi ìdarí ojú rẹ̀ sí ọ̀run hàn gẹ́gẹ́ bí εἰς ṣe rí níbí.
- source_word: Πάτερ
  choice: Baba
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè tààrà; a kò fi ‘mi’ kún un nítorí kò sí nínú Gíríìkì.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: wákàtí náà dé
  rationale: ‘Wákàtí’ pa àwòrán pàtàkì tí ó ń tún fara hàn nínú ìwé Jòhánù mọ́; ‘dé’ sọ dídé àkókò tí a yàn náà ní ṣókí àti nípa ti ẹ̀dá.
- source_word: δόξασόν
  choice: Ṣe … lógo
  rationale: ‘Ṣe lógo’ pa ìtumọ̀ ìfihàn ògo àti fífi ọlá fún ẹni mọ́, ó sì bá lílo δοξάζω nínú Jòhánù mu.
- source_word: σου τὸν υἱόν
  choice: Ọmọ rẹ
  rationale: Èyí fi ìní tí ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: ἵνα
  choice: kí … lè
  rationale: Àkójọpọ̀ yìí fi ète tàbí àbájáde tí ἵνα ń ṣàfihàn hàn kedere ní Yorùbá.
- source_word: ὁ υἱὸς
  choice: Ọmọ náà
  rationale: ‘Náà’ pa árítíkì Gíríìkì mọ́, ó sì ṣàfihàn ìyípadà láti ‘Ọmọ rẹ’ sí ‘Ọmọ náà’ láì tún ‘rẹ’ fi kún ọ̀rọ̀ orísun.
- source_word: δοξάσῃ σέ
  choice: lè ṣe ọ́ lógo
  rationale: ‘Lè’ bá ọ̀rọ̀-ìṣe abẹ́ ἵνα mu, ‘ọ́’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni kejì gẹ́gẹ́ bí ohun tí ìṣe náà kàn.
theological_decisions:
- issue: Ìṣe ògo tí Baba àti Ọmọ ń ṣe fún ara wọn
  choice: “Ṣe Ọmọ rẹ lógo, kí Ọmọ náà lè ṣe ọ́ lógo”
  alternative: “Fi ọlá fún Ọmọ rẹ, kí òun náà lè fi ọlá fún ọ”
  rationale: A pa ọ̀rọ̀ kan náà, δοξάζω, mọ́ ní ìhà méjèèjì láti dáàbò bo ìbáradọ́gba àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà, láì fi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- issue: Bí a ṣe fi Ọmọ hàn gẹ́gẹ́ bí orúkọ oyè fún Jésù
  choice: A kọ “Ọmọ” pẹ̀lú lẹ́tà ńlá.
  alternative: ọmọ
  rationale: Nínú àyíká yìí, Ọmọ ń tọ́ka sí Jésù ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Baba; lẹ́tà ńlá ń ran òǹkàwé lọ́wọ́ láti mọ ìtọ́kasí náà, kò sì yí ìtumọ̀ ọ̀rọ̀ Gíríìkì padà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ ti ẹ̀dá; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘wákàtí’ dípò ‘àkókò’ láti pa àkòrí pàtàkì Jòhánù mọ́.
