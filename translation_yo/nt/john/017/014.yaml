id: JHN.17.14
reference: John 17:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: yo
  text: 'Mo ti fi ọ̀rọ̀ rẹ fún wọn, ayé sì ti kórìíra wọn, nítorí wọn kì í ṣe ti ayé[a], gẹ́gẹ́ bí èmi náà kì í ṣe ti ayé.


    [a] Ní tààrà, “láti inú ayé.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ibi tí ohun kan ti wá tàbí sí jíjẹ́ ti ibì kan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “láti inú ayé.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ibi tí ohun kan ti wá tàbí sí jíjẹ́ ti ibì kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: Mo ti fi … fún wọn
  rationale: Ìlò “ti” fi iṣẹ́ tí a ti parí, tí àbájáde rẹ̀ sì ń bá a lọ hàn, bí perfect Gíríìkì ṣe túmọ̀ sí níbí.
- source_word: λόγον
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” jẹ́ àfihàn àdánidá fún λόγος, ó sì pa ìlò ọ̀rọ̀ pàtàkì inú ìwé Jòhánù mọ́ láì dín un kù sí “iṣẹ́ ìránṣẹ́” nìkan.
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” pa ìtúmọ̀ gbòòrò κόσμος mọ́; ọ̀rọ̀ tó yí i ká ló fi ìṣọ̀tá ayé sí Ọlọ́run hàn.
- source_word: ἐμίσησεν
  choice: ti kórìíra
  rationale: Àkópọ̀ “ti” àti “kórìíra” sọ ìṣe tí ó ti ṣẹlẹ̀ di òtítọ́ tó ṣì dúró, ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí ayé fi kórìíra wọn hàn ní kedere.
- source_word: ἐκ τοῦ κόσμου
  choice: kì í ṣe ti ayé
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì lè tọ́ka sí ìpilẹ̀ṣẹ̀ tàbí jíjẹ́ ti ayé. Àlàyé ìsàlẹ̀ ojú ìwé pa àwòrán “láti inú” tí ἐκ ní mọ́.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra láàárín àwọn ọmọ-ẹ̀yìn àti Jésù hàn ní tààrà.
theological_decisions:
- issue: Ìbáṣepọ̀ àwọn ọmọ-ẹ̀yìn àti Jésù pẹ̀lú “ayé”
  choice: wọn kì í ṣe ti ayé … gẹ́gẹ́ bí èmi náà kì í ṣe ti ayé
  alternative: wọn kò ti inú ayé wá … gẹ́gẹ́ bí èmi náà kò ti inú ayé wá
  rationale: A pa ìfiwéra inú ẹsẹ náà mọ́ láì sọ pé ó jẹ́ ti àwùjọ nìkan tàbí fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un. Àlàyé náà jẹ́ kí ìṣòro ìtumọ̀ ἐκ—ìpilẹ̀ṣẹ̀ tàbí jíjẹ́ ti ibì kan—wà ní ṣíṣí.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Fi ọ̀rọ̀ rẹ fún wọn” àti “kórìíra” jẹ́ gbólóhùn tí òǹkàwé lásán lè lóye, nígbà tí ìtun “ti ayé” pa ìró àti ìfiwéra ẹsẹ Gíríìkì mọ́.
