id: JHN.17.21
reference: John 17:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: yo
  text: kí gbogbo wọn lè jẹ́ ọ̀kan[a], gẹ́gẹ́ bí ìwọ, Baba, ṣe wà nínú mi, tí èmi sì wà nínú rẹ; kí àwọn náà pẹ̀lú lè wà nínú wa[b], kí ayé lè gbàgbọ́[c] pé ìwọ ni ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí gbogbo wọn lè wà ní ìṣọ̀kan.” Ní tààrà, Gíríìkì sọ pé “kí gbogbo wọn lè jẹ́ ọ̀kan,” èyí tí ó pa ìtumọ̀ ìṣọ̀kan tó gbòòrò mọ́ láì dín un kù sí apá kan ṣoṣo.
    reason: lexical_alternative
  - marker: b
    text: Àtúnsọ “nínú” (“nínú mi,” “nínú rẹ,” “nínú wa”) jẹ́ èdè pàtàkì nínú Johanu fún ìbágbépọ̀ àti ìkópa; ó lágbára ju ìbákẹ́gbẹ́ lásán lọ.
    reason: cross_reference
  - marker: c
    text: Tàbí, “lè bẹ̀rẹ̀ sí í gbàgbọ́.” Gíríìkì lè tọ́ka sí pé ayé yóò gbàgbọ́, láì sọ ní pàtó bóyá ìtẹnumọ́ wà lórí bíbẹ̀rẹ̀ sí í gbàgbọ́ tàbí títẹ̀síwájú nínú ìgbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta tí ἵνα ń darí ni a fi “kí ... lè” túmọ̀, láti pa ìṣàn ète tàbí àbájáde ọ̀rọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Èyí fi ààyè gbogbo àwọn tí Jésù ń gbàdúrà fún hàn ní kedere.
- source_word: ἓν
  choice: ọ̀kan
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé “ọ̀kan”; yíyan “ọ̀kan” pa ìtumọ̀ ìṣọ̀kan rẹ̀ mọ́ láì dín un kù sí irú ìṣọ̀kan kan ṣoṣo.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Èyí fi ìfiwéra láàárín jíjẹ́ ọ̀kan àwọn onígbàgbọ́ àti ìbáṣepọ̀ Baba àti Ọmọ hàn kedere.
- source_word: πάτερ
  choice: Baba
  rationale: A pa ọ̀rọ̀ ìpè tààrà náà mọ́; ó ní agbára ìbáṣepọ̀ àti ẹ̀kọ́ nípa Ọlọ́run.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: nínú mi ... nínú rẹ
  rationale: A túmọ̀ ἐν ní ọ̀nà kan náà ní gbogbo ibi, láti pa èdè Johanu nípa wíwà ara ẹni nínú ẹnì kejì àti ìkópa mọ́.
- source_word: κἀγώ
  choice: tí èmi sì
  rationale: 'Ọ̀nà yìí so ìbáṣepọ̀ alábápín náà pọ̀ ní Yorùbá àdánidá: Baba wà nínú Ọmọ, Ọmọ sì wà nínú Baba.'
- source_word: καὶ αὐτοὶ
  choice: àwọn náà pẹ̀lú
  rationale: “Pẹ̀lú” pa agbára àfikún καί mọ́, ó sì so ìkópa àwọn ọmọ-ẹ̀yìn mọ́ ìbáṣepọ̀ Baba àti Ọmọ.
- source_word: ἐν ἡμῖν
  choice: nínú wa
  rationale: Èyí tẹ̀lé Gíríìkì, ó sì pa èdè Johanu nípa ìkópa àti wíwà nínú mọ́; “láàárín wa” yóò mú un dà bí ìbákẹ́gbẹ́ lásán.
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Johanu tó wọ́pọ̀, ó sì pa ìwọ̀n gbígbòòrò àti ìtumọ̀ ẹ̀kọ́ Ọlọ́run ti κόσμος mọ́.
- source_word: πιστεύῃ
  choice: lè gbàgbọ́
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti túmọ̀ subjunctive lẹ́yìn ἵνα, láì fi dandan kún un pé ìgbàgbọ́ náà ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ tàbí ń bá a lọ.
- source_word: ἀπέστειλας
  choice: ìwọ ni ó rán mi
  rationale: Ìṣe àkókò tí ó ti kọjá ni a lò, ìṣètò “ìwọ ni” sì fi kókó sí ẹni tí ó rán Jésù gẹ́gẹ́ bí σύ tí ó farahàn ní Gíríìkì.
theological_decisions:
- issue: Irú jíjẹ́ ọ̀kan àwọn onígbàgbọ́ ní ìbámu pẹ̀lú Baba àti Ọmọ
  choice: A lo “ọ̀kan,” a sì pa “nínú wa” mọ́ láì fi àlàyé ẹ̀kọ́ kan kún un.
  alternative: “kí gbogbo wọn lè wà ní ìṣọ̀kan” tàbí “kí gbogbo wọn lè ní ète kan náà”
  rationale: Ẹsẹ̀ náà fi ìṣọ̀kan àwọn onígbàgbọ́ wé ìbáṣepọ̀ Baba àti Ọmọ, ṣùgbọ́n kò sọ pé ìṣọ̀kan ètò, ìwà, ète, tàbí ìwàláàyè pàtó ni. “Ọ̀kan” pa ìjìnlẹ̀ àti àìsọ pàtó yìí mọ́ láì gbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọ inú rẹ̀.
- issue: Èdè Johanu nípa wíwà ara ẹni nínú ẹnì kejì
  choice: A lo “nínú mi,” “nínú rẹ,” àti “nínú wa” ní gbogbo ibi.
  alternative: “pẹ̀lú mi / pẹ̀lú rẹ / pẹ̀lú wa” tàbí “ní ìṣọ̀kan pẹ̀lú wa”
  rationale: Gíríìkì tún ἐν ṣe, èdè yìí sì lágbára ju ìbákẹ́gbẹ́ lásán lọ. Títúmọ̀ rẹ̀ ní tààrà pa ìtumọ̀ ìkópa àti ìbágbépọ̀ rẹ̀ mọ́ láì yanjú àìsọ pàtó inú orísun.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtẹ̀jáde náà pa àtúnsọ “nínú” àti ìṣètò àwọn gbólóhùn ète mẹ́tẹ̀ẹ̀ta mọ́, nígbà tí “kí ... lè” mú kí ó rọrùn fún òǹkàwé Yorùbá òde òní.
