id: JHN.17.9
reference: John 17:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: yo
  text: Èmi ń bẹ̀bẹ̀[b] fún wọn[a]. Èmi kò ń bẹ̀bẹ̀ fún ayé, ṣùgbọ́n fún àwọn tí o ti fi fún mi, nítorí tirẹ ni wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa wọn” dípò “fún wọn”; ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ méjèèjì nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ń gbàdúrà”; ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù, ọ̀rọ̀-ìṣe náà túmọ̀ sí “béèrè” tàbí “bẹ̀bẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: ń béèrè
  rationale: Ó pa ìtumọ̀ ìpilẹ̀ ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí ‘béèrè’ tàbí ‘bẹ̀bẹ̀,’ ó sì lo ọ̀nà ìṣe tí ń lọ lọ́wọ́ láti bá àdúrà tí Jésù ń gbà ní àkókò náà mu.
- source_word: περὶ αὐτῶν
  choice: nípa wọn
  rationale: ‘Nípa wọn’ tẹ̀ lé ìtumọ̀ περί pẹ̀lú ọ̀rọ̀-orúkọ abẹ́ gẹ́gẹ́ bí ‘nípa’ tàbí ‘ní ti,’ ó sì fi ààyè sílẹ̀ fún ìtumọ̀ ìbẹ̀bẹ̀ ‘fún wọn’ nínú àlàyé ìsàlẹ̀.
- source_word: κόσμου
  choice: ayé
  rationale: ‘Ayé’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κόσμος nínú Jòhánù; a kò dín ìtumọ̀ rẹ̀ kù sí gbogbo aráyé tàbí ètò búburú kan.
- source_word: ὧν δέδωκάς μοι
  choice: àwọn tí o ti fi fún mi
  rationale: Ìtumọ̀ yìí tọ́ka sí ẹgbẹ́ ènìyàn, ó sì lo ‘ti’ láti fi hàn pé fífún náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ṣì wà.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí Jésù fi ń béèrè nípa wọn hàn ní kedere.
- source_word: σοί εἰσιν
  choice: tirẹ ni wọ́n
  rationale: Ó pa agbára ohun-ìní àti ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἐγὼ
  choice: Èmi
  rationale: A pa arọ́pò-orúkọ tí a sọ ní gbangba mọ́ láti fi ìtẹnumọ́ olùsọ̀ hàn.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó mú ìyàtọ̀ tó lágbára láàárín ‘kì í ṣe nípa ayé’ àti ‘nípa àwọn tí o ti fi fún mi’ jáde lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí ἐρωτῶ di ọ̀rọ̀ àdúrà ní tààrà
  choice: ń béèrè
  alternative: ń gbàdúrà fún
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà wà nínú àdúrà sí Baba, ἐρωτάω túmọ̀ sí ‘béèrè’ tàbí ‘bẹ̀bẹ̀’ ní ìpilẹ̀; ‘ń béèrè’ kò fi èdè ẹ̀sìn tí ó ju ti orísun lọ kún un.
- issue: Ìwọ̀n ìtumọ̀ ‘ayé’ ní ìyàtọ̀ sí àwọn tí Baba fi fún Ọmọ
  choice: ayé
  alternative: gbogbo aráyé; ètò ayé aláìgbàgbọ́
  rationale: κόσμος ní ọ̀pọ̀ ìṣúra ìtumọ̀ nínú Jòhánù. A pa ‘ayé’ mọ́ láìyanju ìṣòro ẹ̀kọ́ nípa ṣíṣe é ní pàtó sí ìtumọ̀ kan.
- issue: Ìtumọ̀ περί nínú ọ̀rọ̀ ìbẹ̀bẹ̀
  choice: nípa wọn
  alternative: fún wọn
  rationale: ‘Nípa wọn’ sún mọ́ ìṣètò Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ jẹ́wọ́ pé nínú àyíká àdúrà ó tún lè túmọ̀ sí ‘fún wọn.’
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A tún ṣe àtúnṣe ibi àmì àlàyé [b] sí lẹ́yìn ‘ń béèrè,’ nítorí àlàyé náà jẹ mọ́ ἐρωτῶ, kì í ṣe gbólóhùn ‘àwọn tí o ti fi fún mi.’
