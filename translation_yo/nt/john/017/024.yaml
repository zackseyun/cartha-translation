id: JHN.17.24
reference: John 17:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: yo
  text: Baba, àwọn tí o ti fi fún mi[a] ni mo fẹ́ kí àwọn náà wà pẹ̀lú mi níbi tí mo wà, kí wọ́n lè rí ògo mi tí o ti fi fún mi, nítorí pé o fẹ́ràn mi ṣáájú ìpìlẹ̀ ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó jẹ́ ní tààrà pé, “ohun tí o ti fi fún mi”; gbólóhùn náà ń tọ́ka sí àkójọpọ̀ àwọn ènìyàn tí Baba fi fún Ọmọ, nítorí náà a túmọ̀ rẹ̀ sí “àwọn tí o ti fi fún mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Baba
  rationale: Ọ̀rọ̀ ìpè tààrà sí Ọlọ́run ni; “Baba” jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi ọ̀rọ̀ aṣàpẹẹrẹ míì kún Gíríìkì.
- source_word: ὃ δέδωκάς μοι
  choice: àwọn tí o ti fi fún mi
  rationale: Bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ Gíríìkì náà jẹ́ aláìlẹ́mìí ẹyọ, ó ń tọ́ka sí àkójọpọ̀ àwọn ènìyàn; ọ̀rọ̀ ọ̀pọ̀ tó tẹ̀ lé e sì mú ìtumọ̀ yìí dájú.
- source_word: θέλω
  choice: ni mo fẹ́
  rationale: Ó pa agbára ìfẹ́-ọkàn mọ́ nínú àdúrà láì sọ ọ́ di àṣẹ tàbí ìfẹ́ aláìlágbára.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: níbi tí mo wà
  rationale: Ìtumọ̀ Yorùbá àdánidá ni, tí ó pa ìtọ́kasí ibi mọ́.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: kí wọ́n wà pẹ̀lú mi
  rationale: Ó sọ àkóónú ohun tí Jésù fẹ́ ní Yorùbá tó ṣe kedere; àwọn tí a mẹ́nu kàn ni yóò wà pẹ̀lú rẹ̀.
- source_word: θεωρῶσιν
  choice: kí wọ́n lè rí
  rationale: “Rí” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún wíwo tàbí ṣíṣàkíyèsí ògo náà.
- source_word: τὴν δόξαν τὴν ἐμὴν
  choice: ògo mi
  rationale: Ó pa ìní àti ìtẹnumọ́ Gíríìkì mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: ἣν δέδωκάς μοι
  choice: tí o ti fi fún mi
  rationale: “Ti fi fún” fi hàn pé fífún náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ń bá a lọ.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó mú ìbáṣepọ̀ ìdí tí gbolohun Gíríìkì fi hàn ṣe kedere.
- source_word: ἠγάπησάς με
  choice: o ti fẹ́ràn mi
  rationale: Ó sọ ìfẹ́ Baba sí Ọmọ ní ọ̀nà Yorùbá àdánidá, pẹ̀lú ìtọ́kasí pé ó ti wà ṣáájú ìṣẹ̀dá.
- source_word: πρὸ καταβολῆς κόσμου
  choice: ṣáájú ìpilẹ̀ṣẹ̀ ayé
  rationale: Ó pa àkókò ṣáájú dídá ayé mọ́, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Ìwàláàyè Ọmọ ṣáájú ìṣẹ̀dá tí ìfẹ́ Baba ṣáájú ìpilẹ̀ṣẹ̀ ayé ń tọ́ka sí
  choice: 'A pa gbólóhùn àkókò náà mọ́ ní tààrà: “o ti fẹ́ràn mi ṣáájú ìpilẹ̀ṣẹ̀ ayé.”'
  alternative: Àtúnsọ tí yóò sọ ìtọ́kasí ṣáájú ìṣẹ̀dá di àpẹẹrẹ tàbí tí yóò dín agbára rẹ̀ kù.
  rationale: Gíríìkì sọ ìfẹ́ Baba sí Ọmọ ṣáájú ìpilẹ̀ṣẹ̀ ayé ní kedere; ìtumọ̀ kò gbọ́dọ̀ rọ̀ ọ́ tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- issue: Agbára θέλω nínú àdúrà Jésù
  choice: “ni mo fẹ́”
  alternative: “mo pàṣẹ” tàbí ọ̀rọ̀ tó lè dà bí ìfẹ́ aláìlágbára
  rationale: Yíyan yìí pa ìfẹ́-ọkàn tó lágbára mọ́, ṣùgbọ́n kò yanjú ìforígbárí tó wà láàárín ìfẹ́ àti ẹ̀bẹ̀ nínú àdúrà náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá bá ìlò àdánidá mu; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo “Baba” fún ọ̀rọ̀ ìpè, “ni mo fẹ́” fún ìfẹ́-ọkàn nínú àdúrà, àti “ìpilẹ̀ṣẹ̀ ayé” fún ìtọ́kasí dídá ayé.
