base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: yo
  text: Nísinsin yìí, wọ́n ti mọ̀ pé gbogbo ohun tí o ti fi fún mi wá láti ọ̀dọ̀ rẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun tí o ti fi fún mi ti ọ̀dọ̀ rẹ ni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Nísinsìnyí
  rationale: Ó fi ìpele ìsinsìnyí hàn nínú òye àwọn ọmọ-ẹ̀yìn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἔγνωκαν
  choice: wọ́n ti mọ̀
  rationale: Àkókò perfect ní Gíríìkì fi ìmọ̀ tí wọ́n ti dé bá, tí ó sì ń bá a lọ, hàn; ‘wọ́n ti mọ̀’ mú àbájáde yẹn jáde ní Yorùbá.
- source_word: ὅτι
  choice: pé
  rationale: Àsopọ̀ àkóónú Yorùbá tó wọ́pọ̀, tí ó ń ṣáájú ohun tí wọ́n ti mọ̀.
- source_word: πάντα ὅσα
  choice: gbogbo ohun tí
  rationale: Ó pa ìtumọ̀ àpapọ̀ àti ìbátan gbólóhùn Gíríìkì mọ́ ní Yorùbá tó ṣe kedere.
- source_word: δέδωκάς μοι
  choice: o ti fi fún mi
  rationale: ‘Ti ... fún’ ń ṣàfihàn iṣe tí ó ti ṣẹlẹ̀ pẹ̀lú ipa tó ṣì wà; ‘fi fún mi’ jẹ́ ọ̀nà àdánidá láti sọ fífúnni ní àyíká yìí.
- source_word: παρὰ σοῦ
  choice: ti ọ̀dọ̀ rẹ
  rationale: Ó ṣàfihàn orísun—pé ohun gbogbo náà wá láti ọ̀dọ̀ ẹni tí Jesu ń bá sọ̀rọ̀.
- source_word: εἰσιν
  choice: ni
  rationale: Àsọfúnni ‘ni’ bá ìtumọ̀ pé orísun ohun gbogbo náà ni Baba mu, láìfipá yan bóyá a ó tú u sí ‘jẹ́ ti ọ̀dọ̀ rẹ’ tàbí ‘wá láti ọ̀dọ̀ rẹ.’
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín àwọn ohun tí Baba fi fún Ọmọ àti orísun wọn
  choice: “gbogbo ohun tí o ti fi fún mi ti ọ̀dọ̀ rẹ ni”
  alternative: “gbogbo ohun tí o ti fi fún mi wá láti ọ̀dọ̀ rẹ”
  rationale: Àṣàyàn náà tẹnu mọ́ Baba gẹ́gẹ́ bí orísun gbogbo ohun tí Ọmọ gbà, láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé lasán.
