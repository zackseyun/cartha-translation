  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: yo
  text: Gẹ́gẹ́ bí o ti fún un ní àṣẹ lórí gbogbo ènìyàn[a], kí ó lè fún gbogbo àwọn tí o ti fi fún un[b] ní ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀-léraléra, “lórí gbogbo ẹran ara.” Èyí jẹ́ ọ̀nà ìsọ Bíbélì Gíríìkì fún gbogbo ènìyàn.
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀-léraléra, “gbogbo ohun tí o ti fi fún un.” Ní Gíríìkì, ọ̀rọ̀ náà wà ní ẹyọ, kì í sì í ṣe akọ tàbí abo, ṣùgbọ́n a lò ó gẹ́gẹ́ bí àpapọ̀ fún àwọn ènìyàn tí a fi fún Ọmọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó pa agbára ìfiwéra ọ̀rọ̀ Gíríìkì mọ́, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: ἔδωκας αὐτῷ ἐξουσίαν
  choice: ìwọ ti fún un ní àṣẹ
  rationale: “Àṣẹ” fi ẹ̀tọ́ àti agbára ìṣàkóso tí a fi lé ẹni lọ́wọ́ hàn, kì í ṣe agbára lásán; “ti fún” tún sọ ìṣe tí ó ti ṣẹlẹ̀ ní kedere.
- source_word: πάσης σαρκός
  choice: lórí gbogbo ẹran ara
  rationale: A pa àwòrán àti ọ̀nà ìsọ Bíbélì “gbogbo ẹran ara” mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé fi ìtumọ̀ rẹ̀ gẹ́gẹ́ bí gbogbo ènìyàn hàn.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó sọ ète tàbí àbájáde tí a pinnu ní Yorùbá àdánidá láì sọ ọ́ di ohun tí ó lágbára ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: πᾶν ὃ δέδωκας αὐτῷ
  choice: gbogbo àwọn tí ìwọ ti fi fún un
  rationale: Èyí jẹ́ Yorùbá àdánidá fún gbólóhùn àpapọ̀ aláìlẹ́mìí ẹyọ kan tí Gíríìkì lò fún àwọn ènìyàn; “ti fi fún un” fi ìṣe tí ó ti parí tí ipa rẹ̀ ṣì wà hàn.
- source_word: δώσῃ αὐτοῖς ζωὴν αἰώνιον
  choice: kí ó lè fún ... ní ìyè àìnípẹ̀kun
  rationale: Ìṣètò “fún ẹni ní ohun” jẹ́ àdánidá ní Yorùbá, ó sì pa ète gbólóhùn náà àti ìtumọ̀ ìyè tí kò ní òpin mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín àṣẹ Ọmọ lórí gbogbo ẹran ara àti àwọn tí Baba fi fún un
  choice: A pa ìwọ̀n àṣẹ náà mọ́ gẹ́gẹ́ bí èyí tí ó kan “gbogbo ẹran ara,” a sì sọ àwọn olùgbà ìyè àìnípẹ̀kun ní pàtó gẹ́gẹ́ bí “gbogbo àwọn tí ìwọ ti fi fún un.”
  alternative: Láti tú “gbogbo ẹran ara” sí “gbogbo ènìyàn,” tàbí láti tú πᾶν ὃ ní ọ̀rọ̀-léraléra sí “gbogbo ohun tí.”
  rationale: Ọ̀rọ̀ náà fúnra rẹ̀ yà àṣẹ tí ó gbòòrò sí gbogbo ẹran ara sọ́tọ̀ kúrò lára àwọn tí Baba fi fún Ọmọ. Ìtumọ̀ yìí pa ìyàtọ̀ àti ìnira ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìfi èrò ẹ̀sìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba; a pa àwòrán Bíbélì “gbogbo ẹran ara” mọ́, pẹ̀lú àlàyé fún òǹkàwé òde òní.
