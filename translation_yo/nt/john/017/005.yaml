id: JHN.17.5
reference: John 17:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: yo
  text: Àti nísinsin yìí, Baba, ìwọ ni kí o fi ògo fún mi ní ọ̀dọ̀ ara rẹ[a] pẹ̀lú ògo tí mo ní ní ọ̀dọ̀ rẹ kí ayé tó wà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ara rẹ”; gbólóhùn Gíríìkì náà lè tọ́ka ní tààrà sí ìsúnmọ́ra tàbí wíwà níwájú Baba.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ayé tó bẹ̀rẹ̀ sí í wà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: ṣe mí lógo
  rationale: Ọ̀rọ̀ yìí pa èdè pàtàkì Jòhánù mọ́ nípa ògo àti fífi ògo fún ẹnì kejì; ó sì lágbára ju lílo ọ̀rọ̀ tó túmọ̀ sí ‘bọ̀wọ̀ fún mi’ lọ.
- source_word: σύ, πάτερ
  choice: Baba, ìwọ fúnra rẹ
  rationale: ‘Ìwọ fúnra rẹ’ mú ìtẹnumọ́ inú arọ́pò-orúkọ σύ jáde, nígbà tí ‘Baba’ pa ìpè tààrà inú àdúrà mọ́.
- source_word: παρὰ σεαυτῷ
  choice: ní ọ̀dọ̀ rẹ
  rationale: παρά pẹ̀lú dátífù ń tọ́ka sí wíwà lẹ́gbẹ̀ẹ́ ẹni tàbí níwájú rẹ. ‘Ní ọ̀dọ̀ rẹ’ jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá, tó sì pa ìtumọ̀ ìbáṣepọ̀ àti ìsúnmọ́ra mọ́.
- source_word: τῇ δόξῃ
  choice: pẹ̀lú ògo
  rationale: Dátífù náà so ọ̀nà fífi ògo fún un mọ́ ògo tí gbólóhùn tó tẹ̀ lé ń ṣàlàyé; ‘pẹ̀lú ògo’ jẹ́ kedere láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ᾗ εἶχον
  choice: tí mo ní
  rationale: Imperfect εἶχον ń tọ́ka sí ògo tí Jésù ní tẹ́lẹ̀; àsìkò tí gbólóhùn náà sọ mú kí ‘tí mo ní’ túmọ̀ rẹ̀ lọ́nà àdánidá.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: kí ayé tó wà
  rationale: Ìṣètò infinitive yìí fi àkókò tó ṣáájú hàn. ‘Kí ayé tó wà’ jẹ́ Yorùbá tó rọrùn, ó sì pa ìtumọ̀ pé ayé kò tíì sí mọ́.
- source_word: παρὰ σοί
  choice: ní ọ̀dọ̀ rẹ
  rationale: Gẹ́gẹ́ bí gbólóhùn παρά tó ṣáájú, èyí ń fi ìsúnmọ́ra tàbí wíwà pẹ̀lú Baba hàn. Àtúnsọ ‘ní ọ̀dọ̀ rẹ’ tún pa ìbáramu inú Gíríìkì mọ́.
- source_word: κόσμον
  choice: ayé
  rationale: ‘Ayé’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún κόσμος níbí, tó ń tọ́ka sí ayé tàbí gbogbo ohun ẹ̀dá.
theological_decisions:
- issue: Wíwà Ọmọ ṣáájú ìṣẹ̀dá ayé
  choice: A túmọ̀ gbólóhùn àkókò náà ní tààrà gẹ́gẹ́ bí ògo tí Jésù ní ní ọ̀dọ̀ Baba kí ayé tó wà.
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ògo tí a kàn ti pinnu fún un lọ́jọ́ iwájú.
  rationale: Gíríìkì sọ ní tààrà pé ó ní ògo náà ní ọ̀dọ̀ Baba ṣáájú wíwà ayé; ìtumọ̀ kò yẹ kí ó rẹ̀ ẹ́ sílẹ̀ tàbí kí ó fi àlàyé tó ju ẹsẹ náà lọ kún un.
- issue: Irú ògo tí Ọmọ ní ní ọ̀dọ̀ Baba
  choice: A pa ‘ògo’ mọ́ láìfi ìtumọ̀ míì kún un.
  alternative: Ọlá ńlá tàbí iyì.
  rationale: Ẹsẹ náà sọ̀rọ̀ nípa ògo ṣùgbọ́n kò ṣàlàyé irú rẹ̀ síwájú níbí. Pípa ‘ògo’ mọ́ ń dáàbò bo èdè Jòhánù àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó bójú mu fún àdúrà, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ, a sì pa àtúnsọ ‘ní ọ̀dọ̀ rẹ’ mọ́ láti fi ìbáramu àwọn gbólóhùn παρά méjèèjì hàn.
