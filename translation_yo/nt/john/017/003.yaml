id: JHN.17.3
reference: John 17:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: yo
  text: 'Èyí sì ni ìyè àìnípẹ̀kun: pé kí wọ́n mọ̀ ọ́—ìwọ, Ọlọ́run tòótọ́ kan ṣoṣo—àti Jésù Mèsáyà[a], ẹni tí ìwọ rán.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè jẹ́ oyè (“Mèsáyà”), ó sì lè dà bí apá kan nínú orúkọ (“Kristi”) ní àwọn àyíká kan.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: Èyí sì ni
  rationale: “Sì” ń pa agbára àsopọ̀ δέ mọ́ ní Yorùbá àdánidá, láì sọ ọ́ di ìtakora líle.
- source_word: ἡ αἰώνιος ζωὴ
  choice: ìyè àìnípẹ̀kun
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún ìyè tí kò ní òpin, ó sì bá ìtumọ̀ ọ̀rọ̀ Johanu mu.
- source_word: ἵνα γινώσκωσι
  choice: pé kí wọ́n mọ̀
  rationale: “Pé kí” fi hàn pé gbólóhùn tó tẹ̀ lé ń ṣàlàyé ohun tí ìyè àìnípẹ̀kun jẹ́; “mọ̀” tún lè gbé ìtumọ̀ ìmọ̀ ẹni àti ìbáṣepọ̀.
- source_word: σὲ
  choice: ọ́—ìwọ
  rationale: “Ọ́” ni arọ́pò-orúkọ olùgbà tó bá gírámà Yorùbá mu; “ìwọ” tó tẹ̀ lé e ń mú àfikún ìdánimọ̀ Gíríìkì náà hàn.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: Ọlọ́run tòótọ́ kan ṣoṣo
  rationale: Ìtumọ̀ yìí pa ìyàsọ́tọ̀ μόνον àti ìtumọ̀ ‘tòótọ́/gidi’ ti ἀληθινός mọ́ ní ọ̀nà Yorùbá tó rọrùn.
- source_word: καὶ
  choice: àti
  rationale: Àsopọ̀ lasán ni, tí ó so ẹni tí a ń bá sọ̀rọ̀ àti Jésù tí a rán pọ̀ gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe “mọ̀” ń tọ́ka sí.
- source_word: ὃν ἀπέστειλας
  choice: ẹni tí ìwọ rán
  rationale: Ó pa gbólóhùn ìbátan àti iṣẹ́ tí Baba fún Jésù mọ́; “rán” jẹ́ ìṣe àkókò tó kọjá tó bá aorist mu ní àyíká yìí.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésù Mèsáyà
  rationale: Χριστός ṣì ní agbára oyè ‘Mèsáyà’ ní àyíká ìjẹ́wọ́ àti àlàyé yìí; àṣàyàn ìbílẹ̀ “Jésù Kristi” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ “Ọlọ́run tòótọ́ kan ṣoṣo” pẹ̀lú Jésù
  choice: A fi Baba hàn gẹ́gẹ́ bí ẹni tí Jésù ń pè ní “Ọlọ́run tòótọ́ kan ṣoṣo,” a sì yà Jésù sọ́tọ̀ gẹ́gẹ́ bí ẹni tí Baba rán.
  alternative: Ṣíṣe àfikún ọ̀rọ̀ láti mú ẹ̀kọ́ Mẹ́talọ́kan hàn gbangba, tàbí yíyọ ìyàtọ̀ tó wà láàárín Baba àti Jésù kúrò.
  rationale: Ìtumọ̀ náà pa ọ̀rọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ inú ẹsẹ náà mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- issue: Ìtumọ̀ Χριστόν
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, oyè ẹni àmì-òróró náà ṣì ṣe pàtàkì; síbẹ̀, nítorí Χριστός lè ti ń ṣiṣẹ́ bí orúkọ-oyè, a pa “Kristi” mọ́ gẹ́gẹ́ bí àṣàyàn ìbílẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àmì gígùn yí àfikún “ìwọ, Ọlọ́run tòótọ́ kan ṣoṣo” ká, kí àtòjọ ohun méjì tí “mọ̀” ń ṣàkóso lè ṣe kedere láì tún ọ̀rọ̀-ìṣe náà ṣe.
