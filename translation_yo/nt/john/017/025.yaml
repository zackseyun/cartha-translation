  source_fidelity: 'Ìtumọ̀ náà ṣàfihàn ìtumọ̀ Gíríìkì dáadáa: a pe Ọlọ́run ní Baba olódodo, a pa ìtakora láàárín ayé àti Jesu mọ́, a sì kò fi orúkọ àlàyé kún “àwọn wọ̀nyí.” Síbẹ̀, “bí ayé kò tilẹ̀ mọ̀ ọ́” lè dà bí gbolohuǹ-ipò (“if the world does not know you”) ní Yorùbá. “Bí ó tilẹ̀ jẹ́ pé” mú ìfẹ̀yìntì/concessive náà hàn ní kedere, láì fi ìtumọ̀ míì kún un.'
