id: JHN.17.25
reference: John 17:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: yo
  text: Baba olódodo, bí ó tilẹ̀ jẹ́ pé ayé[a] kò mọ̀ ọ́, èmi sì mọ̀ ọ́,[b] àwọn wọ̀nyí sì mọ̀ pé ìwọ ni ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ayé” nínú ìwé Jòhánù sábà máa ń tọ́ka, kì í ṣe sí gbogbo ohun tí a dá nìkan, ṣùgbọ́n sí aráyé nínú ìyapa wọn kúrò lọ́dọ̀ Ọlọ́run.
    reason: cross_reference
  - marker: b
    text: 'Ó tún lè jẹ́: “Baba olódodo, ayé kò sì mọ̀ ọ́, ṣùgbọ́n èmi mọ̀ ọ́, àwọn wọ̀nyí sì mọ̀ pé ìwọ ni ó rán mi.” Gbogbo ọ̀rọ̀-ìṣe “mọ̀” wọ̀nyí wà ní aorist nínú Gíríìkì; Yorùbá kò ní láti fi àmì àkókò mìíràn kún wọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Baba olódodo
  rationale: Àpèjúwe tààrà ni gíríìkì; “olódodo” pa ìtumọ̀ ìwà títọ́ àti òdodo Ọlọ́run mọ́ láì fi í mọ́ ìdájọ́ òfin nìkan.
- source_word: καὶ
  choice: bí ... kò tilẹ̀
  rationale: 'Nínú àyíká ọ̀rọ̀ yìí, καὶ àkọ́kọ́ ní agbára ìyọ̀ǹda: ayé kò mọ Baba, ṣùgbọ́n Jesu mọ̀ ọ́. Ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì mú ìtakora náà hàn.'
- source_word: ὁ κόσμος
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tó gbooro tó sì bá κόσμος mu; ó jẹ́ kí ìtumọ̀ Johanu nípa aráyé tí ó yà kúrò lọ́dọ̀ Ọlọ́run dúró láì dín in kù sí àlàyé kan ṣoṣo.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: kò mọ̀ / mọ̀ / mọ̀
  rationale: Yorùbá kò fi fọ́ọ̀mù ọ̀rọ̀-ìṣe pàtó ṣe ìyàtọ̀ bí aorist tàbí perfect Gẹ̀ẹ́sì. Àyíká àdúrà náà fi hàn pé ìmọ̀ yìí ní ìbáṣepọ̀ àti ìwúlò títí di ìsinsìnyí.
- source_word: ἐγὼ δέ
  choice: èmi sì
  rationale: “Èmi” pa ìtẹnumọ́ arọ́pò-orúkọ náà mọ́, “sì” sì fi ìtakora pẹ̀lú àìmọ̀ ayé hàn ní Yorùbá àdánidá.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ó tẹ̀lé arọ́pò-orúkọ atọ́ka gíríìkì pẹ́kípẹ́kí, láì fi “àwọn ọmọ-ẹ̀yìn” kún ọ̀rọ̀ gẹ́gẹ́ bí ìtumọ̀ alálàyé.
- source_word: σύ με ἀπέστειλας
  choice: ìwọ ni ó rán mi
  rationale: Ìkọ́lé “ìwọ ni” pa ìtẹnumọ́ σύ mọ́, ó sì sọ ìránṣẹ́ Jesu ní kedere àti ní èdè Yorùbá ọlọ́lá.
theological_decisions:
- issue: Ìtumọ̀ δίκαιε gẹ́gẹ́ bí ànímọ́ Baba
  choice: Baba olódodo
  alternative: Baba onídàájọ́ òdodo
  rationale: “Olódodo” ní ìwọ̀n ìtumọ̀ ìwà rere àti òdodo tó gbooro; àṣàyàn kejì lè dín ọ̀rọ̀ náà kù sí ìdájọ́.
- issue: Ìtumọ̀ κόσμος nínú Johanu
  choice: ayé
  alternative: àwọn ènìyàn ayé / ètò ayé
  rationale: “Ayé” pa ìtumọ̀ onírúurú ọ̀rọ̀ orísun mọ́, pẹ̀lú ẹ̀dá àti aráyé nínú ìyapa wọn kúrò lọ́dọ̀ Ọlọ́run, láì yan ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
- issue: Ìrísí àkókò àwọn aorist γινώσκω
  choice: kò mọ̀ / mọ̀ / mọ̀
  alternative: kò wá mọ̀ / ti mọ̀ / ti mọ̀
  rationale: Ìrísí Yorùbá tó rọrùn yìí kò fi ìṣẹ̀lẹ̀ ìmọ̀ náà sí àkókò kan pàtó ju ohun tí orísun sọ lọ; àlàyé ìsàlẹ̀ sọ pé aorist ni gbogbo wọn.
- issue: Ìbáṣepọ̀ καὶ àkọ́kọ́
  choice: bí ... kò tilẹ̀
  alternative: ayé kò sì mọ̀ ọ́
  rationale: Àṣàyàn pàtàkì mú ìtumọ̀ ìyọ̀ǹda tí àyíká ń tọ́ka sí hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ àsopọ̀ tààrà mọ́ gẹ́gẹ́ bí ohun tó ṣeé ṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye. A lo “ìwọ” fún ọ̀rọ̀ tààrà sí Baba, “èmi sì” àti “ìwọ ni” sì pa àwọn ìtẹnumọ́ inú gíríìkì mọ́. Àwọn àmì ohùn ni a kọ níbi tí wọ́n ti yẹ.
