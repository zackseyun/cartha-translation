  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: yo
  text: Kì í ṣe fún àwọn wọ̀nyí nìkan ni mo ń béèrè, ṣùgbọ́n mo tún ń béèrè fún àwọn tí ń gba mí gbọ́ nípasẹ̀ ọ̀rọ̀ wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτῶ
  choice: béèrè
  rationale: Nínú ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí bí Jésù ṣe ń béèrè lọ́wọ́ Baba; “béèrè” ṣe kedere, kò sì fi ìtumọ̀ àdúrà kan kún un láìnídí.
- source_word: περὶ τούτων
  choice: fún àwọn wọ̀nyí
  rationale: Bí ó tilẹ̀ jẹ́ pé περί pẹ̀lú genitive lè jẹ́ “nípa,” nínú àdúrà Yorùbá, “béèrè fún” jẹ́ ọ̀nà àdánidá láti sọ pé a ń ṣe ìbéèrè nítorí ẹnì kan; “àwọn wọ̀nyí” kò sọ ẹni tí wọ́n jẹ́ ní pàtó ju Gíríìkì lọ.
- source_word: μόνον
  choice: nìkan
  rationale: “Nìkan” fi ààlà tí μόνον ń gbé kalẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἀλλὰ καὶ
  choice: ṣùgbọ́n ... pẹ̀lú
  rationale: Ìṣètò yìí pa ìyàtọ̀ àti àfikún inú ἀλλὰ καὶ mọ́ ní Yorùbá tó rọrùn.
- source_word: τῶν πιστευόντων
  choice: àwọn tí ó gba mí gbọ́
  rationale: Participle náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ; gbólóhùn yìí pa agbára ọ̀rọ̀-ìṣe mọ́, kò sì sọ ọ́ di orúkọ ẹgbẹ́ kan.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: nípasẹ̀ ọ̀rọ̀ wọn
  rationale: “Ọ̀rọ̀” lè túmọ̀ sí ohun tí wọ́n sọ tàbí iṣẹ́ ìjẹ́rìí wọn, ó sì pa ìbáṣepọ̀ pẹ̀lú λόγος mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: εἰς ἐμέ
  choice: gba mí gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún πιστεύω εἰς pẹ̀lú ẹni gẹ́gẹ́ bí ohun tí ìgbàgbọ́ dojú kọ; yíyí εἰς sí “sínú” ní tààràtà kì í ṣe Yorùbá àdánidá.
- source_word: Οὐ ... μόνον
  choice: Èmi kò béèrè ... nìkan
  rationale: Fífi “Èmi” sí iwájú ń pa ìtẹnumọ́ inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí “kò ... nìkan” ń fi àgbékalẹ̀ ìkọ̀ àti ààlà náà hàn.
theological_decisions:
- issue: Ìwọ̀n àwọn tí àdúrà Jésù kàn lẹ́yìn àwọn ọmọ-ẹ̀yìn tó wà níbẹ̀
  choice: Ọ̀rọ̀ náà kan àwọn mìíràn tí wọ́n gba Jésù gbọ́ nípasẹ̀ ẹ̀rí àwọn ọmọ-ẹ̀yìn.
  alternative: Ó lè tọ́ka sí ẹgbẹ́ kékeré kan tí wọ́n ti ń bẹ̀rẹ̀ sí í gbàgbọ́ nípasẹ̀ àwọn ọmọ-ẹ̀yìn ní àkókò náà.
  rationale: Present participle πιστευόντων kò sọ àkókò ọjọ́ iwájú ní gbangba. Nítorí náà, a kò fi “tí yóò” kún un; èyí jẹ́ kí ọ̀rọ̀ náà lè kan àwọn tó ń gbàgbọ́ nígbà náà àti àwọn tó máa gbàgbọ́ lẹ́yìn náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì bójú mu fún kíkà ní gbangba. A lo “béèrè fún” dípò “béèrè nípa” nítorí pé èyí ni Yorùbá àdánidá nínú àdúrà ìbẹ̀bẹ̀. Kò sí àlàyé ẹsẹ̀ tí ó pọn dandan, nítorí náà kò sí àmì àlàyé nínú ọ̀rọ̀.
