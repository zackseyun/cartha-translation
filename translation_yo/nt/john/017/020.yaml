  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà: Jésù kò fi ìbéèrè rẹ̀ mọ́ àwọn wọ̀nyí nìkan, ó sì kàn àwọn tí ń gba a gbọ́ nípasẹ̀ ọ̀rọ̀ wọn. Ṣùgbọ́n ìṣètò “ṣùgbọ́n fún ... pẹ̀lú” lè dà bí pé “pẹ̀lú” ń túmọ̀ sí ‘together,’ kì í sì fi ἀλλὰ καὶ hàn ní kedere. Àtúnṣe náà mú ìfikún náà hàn gbangba nípasẹ̀ “mo tún ń béèrè.”'
  naturalness: “Kì í ṣe fún ... nìkan ni mo ń béèrè, ṣùgbọ́n mo tún ń béèrè fún ...” jẹ́ Yorùbá boṣewa, ó sì rọrùn fún kíkà ní gbangba. “Àwọn tí ń gba mí gbọ́” ń pa agbára participle tí ń lọ lọwọ mọ́ dáadáa.
  terminology: “Ń béèrè fún” jẹ́ ọ̀nà tó yẹ fún ìbéèrè Jésù sí Baba nínú àyíká àdúrà, láìrọ́pò ọ̀rọ̀ náà pátápátá pẹ̀lú “ń gbàdúrà.” “Gba mí gbọ́” jẹ́ ìtumọ̀ Yorùbá àdánidá fún πιστεύειν εἰς ἐμέ, “ọ̀rọ̀ wọn” sì pa ìṣípayá λόγος mọ́.
