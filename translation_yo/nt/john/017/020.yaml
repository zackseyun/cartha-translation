  to: Kì í ṣe fún àwọn wọ̀nyí nìkan ni mo ń béèrè, ṣùgbọ́n mo tún ń béèrè fún àwọn tí ń gba mí gbọ́ nípasẹ̀ ọ̀rọ̀ wọn.
  rationale: A tún ìṣètò gbólóhùn náà ṣe nìkan láti jẹ́ kí ἀλλὰ καὶ (‘ṣùgbọ́n ... tún’) hàn kedere àti kí Yorùbá náà rọrùn sí i. A pa ìtumọ̀ ìbẹ̀bẹ̀ ‘fún,’ ìṣe tí ń lọ lọwọ nínú “tí ń gba,” àti ìbáṣepọ̀ ‘nípasẹ̀ ọ̀rọ̀ wọn’ mọ́. A kò fi àmì ọjọ́ iwájú kún un.
