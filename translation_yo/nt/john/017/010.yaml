id: JHN.17.10
reference: John 17:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: yo
  text: Gbogbo ohun tí ó jẹ́ tèmi ni tirẹ̀[a], ohun tí ó sì jẹ́ tirẹ̀ ni tèmi; a sì ti yin mí lógo nínú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘nípasẹ̀ wọn’ tàbí ‘láàárín wọn.’ Gíríìkì náà ní ‘nínú wọn,’ èyí tí ó lè fi ipò, ọ̀nà, tàbí ìfihàn hàn ní àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: Gbogbo ohun tí ó jẹ́ tèmi
  rationale: Ẹ̀yà ọ̀rọ̀ orúkọ àìdá-kan pàtó yìí ní ìtumọ̀ gbogbo ohun tó jẹ́ ti Jésù. Ìtumọ̀ yìí bójú mu ní Yorùbá, ó sì pa ìwọ̀n gbígbòòrò ọ̀rọ̀ náà mọ́ láìjẹ́ kó dà bí ohun ìní ti ara nìkan.
- source_word: σά
  choice: tirẹ̀
  rationale: Ọ̀rọ̀ arọ́pò ohun-ìní yìí sọ ní ṣókí pé ohun náà jẹ́ ti Baba, ó sì bá ìlànà gbólóhùn Yorùbá mu.
- source_word: τὰ σὰ ἐμά
  choice: ohun tí ó sì jẹ́ tirẹ̀ ni tèmi
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ ohun-ìní alápadà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere àti tó dùn létí.
- source_word: δεδόξασμαι
  choice: a sì ti ṣe mí lógo
  rationale: Fáàbù perfect passive náà tọ́ka sí ohun tí a ti ṣe tí àbájáde rẹ̀ ṣì dúró. ‘A ti ṣe mí lógo’ fi ìṣe aláìṣe-taara àti ìtumọ̀ tí ń bá a lọ hàn.
- source_word: ἐν αὐτοῖς
  choice: nínú wọn
  rationale: ‘Nínú wọn’ ni ìtumọ̀ tààrà jù lọ fún ἐν αὐτοῖς, àwọn tí Baba fi fún Ọmọ sì ni ‘wọn’ ń tọ́ka sí ní àyíká ọ̀rọ̀ náà. Ó tún jẹ́ kí àìdájú tó lè túmọ̀ sí ibi, ohun èlò, tàbí ìfihàn wà láìyanju rẹ̀ ní ìkọ̀kọ̀.
theological_decisions:
- issue: Ohun-ìní alápadà láàárín Ọmọ àti Baba
  choice: 'A túmọ̀ gbólóhùn náà ní tààrà gẹ́gẹ́ bí ohun-ìní alápadà: ‘Gbogbo ohun tí ó jẹ́ tèmi ni tirẹ̀, ohun tí ó sì jẹ́ tirẹ̀ ni tèmi.’'
  alternative: Kí a mú un rọ̀ sí ìfọwọ́sowọ́pọ̀ nínú iṣẹ́ nìkan dípò ohun-ìní tí wọ́n ní ní ti gidi.
  rationale: Gíríìkì sọ ohun-ìní alápadà ní kedere. A kò mú un rọ̀, bẹ́ẹ̀ ni a kò fi èdè ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún ohun tí ẹsẹ náà sọ.
- issue: Ohun tí ‘nínú wọn’ tọ́ka sí àti bí ó ṣe ń ṣiṣẹ́
  choice: A pa ọ̀rọ̀ tó fi ipò hàn, ‘nínú wọn,’ mọ́ nínú ẹsẹ pàtàkì.
  alternative: ‘Nípasẹ̀ wọn’ gẹ́gẹ́ bí ohun èlò, tàbí ‘láàárín wọn’ gẹ́gẹ́ bí wíwà pẹ̀lú wọn.
  rationale: ἐν lè ní ọ̀pọ̀ ìtumọ̀ ní àyíká ọ̀rọ̀ yìí, ṣùgbọ́n Gíríìkì kò mú wa yan ọ̀kan ṣoṣo. Ìtumọ̀ pàtàkì pa àìdájú náà mọ́, àlàyé ìsàlẹ̀ sì darúkọ àwọn ìtumọ̀ mìíràn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ó jẹ́ tèmi/tirẹ̀’ láti sọ ohun-ìní ní ti ẹ̀dá, a sì lo ‘ṣe mí lógo’ fún passive δοξάζω. Àmì ohùn wà níbi tí ó ti yẹ.
