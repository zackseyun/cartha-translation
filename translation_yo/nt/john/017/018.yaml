source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: yo
  text: Gẹ́gẹ́ bí ìwọ ti rán mi sí ayé, èmi náà sì ti rán wọn sí ayé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra hàn ní kedere láàárín bí Baba ṣe rán Jésù àti bí Jésù ṣe rán àwọn ọmọ-ẹ̀yìn rẹ̀.
- source_word: ἐμὲ
  choice: mi
  rationale: Ó jẹ́ ẹni tí ἀπέστειλας ń tọ́ka sí gẹ́gẹ́ bí ẹni tí a rán; “mi” ni ìtumọ̀ Yorùbá tó ṣe déédé.
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: ti rán / ti rán
  rationale: Lílo ọ̀rọ̀ kan náà ní ìhà méjèèjì pa ìbáradọ́gba tí Gíríìkì mọ̀ọ́mọ̀ dá sílẹ̀ mọ́, láìfi ìtumọ̀ àfikún bí “fiṣẹ́ rán” sínú ẹsẹ náà.
- source_word: εἰς τὸν κόσμον
  choice: sí ayé
  rationale: Ní Yorùbá àdánidá, “rán ... sí ayé” sọ ìlọsí ibi iṣẹ́-ìránṣẹ́ náà; “ayé” tún pa ìtumọ̀ pàtàkì κόσμος nínú Jòhánù mọ́ láìṣe àlàyé rẹ̀ kọjá ohun tí ọ̀rọ̀ náà sọ.
- source_word: κἀγὼ
  choice: èmi náà sì
  rationale: “Èmi” fi ìtẹnumọ́ ẹni hàn, “náà” sì mú agbára àfikún καί jáde; “sì” so ìhà kejì mọ́ ti àkọ́kọ́ lọ́nà Yorùbá tó rọgbọ.
- source_word: αὐτοὺς
  choice: wọn
  rationale: Ó tọ́ka sí àwọn ọmọ-ẹ̀yìn nínú àyíká ọ̀rọ̀, “wọn” sì ni arọ́pò-orúkọ tó yẹ.
theological_decisions:
- issue: Ìbáradọ́gba iṣẹ́-ìránṣẹ́ láàárín bí Baba ṣe rán Ọmọ àti bí Ọmọ ṣe rán àwọn ọmọ-ẹ̀yìn
  choice: 'Pa ọ̀rọ̀-ìṣe kan náà mọ́: “rán ... rán.”'
  alternative: “rán ... fiṣẹ́ rán” tàbí “rán ... gbé iṣẹ́ lé lọ́wọ́”
  rationale: Ọ̀rọ̀ náà ń fi àwọn ìrán méjèèjì wé ara wọn, ṣùgbọ́n kò sọ pé ipò tàbí irú iṣẹ́ Ọmọ àti ti àwọn ọmọ-ẹ̀yìn jẹ́ ọ̀kan náà. Lílo “rán” ní ìhà méjèèjì pa ìfarajọ Gíríìkì mọ́ láìṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A yan “sí ayé” dípò “sínú ayé” nítorí pé ó jẹ́ ìsọ̀rọ̀ Yorùbá tó túbọ̀ jẹ́ àdánidá lẹ́yìn “rán,” nígbà tó ṣì pa ìtọ́sọ́nà εἰς mọ́.
