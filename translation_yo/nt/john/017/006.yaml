  to: Mo ti fi orúkọ rẹ hàn[a][b] fún àwọn ènìyàn[c] tí o fi fún mi láti inú ayé[d]. Wọ́n jẹ́ tìrẹ, o sì fi wọ́n fún mi, wọ́n sì ti pa ọ̀rọ̀ rẹ mọ́[e].
