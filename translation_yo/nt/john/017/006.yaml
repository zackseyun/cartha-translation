id: JHN.17.6
reference: John 17:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: yo
  text: Mo ti fi orúkọ rẹ hàn[a][b] fún àwọn ènìyàn[c] tí o fi fún mi láti inú ayé[d]. Wọ́n jẹ́ tìrẹ, o sì fi wọ́n fún mi, wọ́n sì ti pa ọ̀rọ̀ rẹ mọ́[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo ti ṣí orúkọ rẹ payá.”
    reason: lexical_alternative
  - marker: b
    text: “Orúkọ rẹ” ń tọ́ka sí ìdánimọ̀ àti ìwà tí Ọlọ́run ti fi hàn, kì í ṣe orúkọ ìpè lásán.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn ọkùnrin”; ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka ní pàtó sí àwọn ọmọ-ẹ̀yìn Jésù tí wọ́n jẹ́ ọkùnrin.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “láti ayé.”
    reason: lexical_alternative
  - marker: e
    text: Tàbí, “wọ́n sì ti ṣègbọràn sí ọ̀rọ̀ rẹ”; Gíríìkì sọ ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ gangan pé, “wọ́n ti pa ọ̀rọ̀ rẹ mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: Mo ti fi … hàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ohun kan hàn tàbí jíjẹ́ kí a mọ̀ ọ́. ‘Mo ti fi … hàn’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣípayá náà mọ́.
- source_word: τὸ ὄνομα
  choice: orúkọ rẹ
  rationale: A pa àwòrán gangan ti Gíríìkì mọ́. Ní àyíká Jòhánù, ‘orúkọ’ ní í ṣe pẹ̀lú ẹni tí Ọlọ́run jẹ́ àti ìwà rẹ, kì í ṣe ìpè lásán.
- source_word: τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: ἄνθρωποι lè tọ́ka sí àwọn ènìyàn lápapọ̀. Bí ó tilẹ̀ jẹ́ pé àwọn ọmọ-ẹ̀yìn ọkùnrin ni àyíká ẹsẹ̀ yìí ń tọ́ka sí ní pàtó, ‘àwọn ènìyàn’ ni ìbámu tó dára jù lọ pẹ̀lú agbára ọ̀rọ̀ Gíríìkì láìfi akọ kún un.
- source_word: οὓς ἔδωκάς μοι
  choice: tí o fi fún mi
  rationale: Ó ṣe àfihàn ìṣe tí Baba ṣe ní kedere, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn ìbátan náà.
- source_word: ἐκ τοῦ κόσμου
  choice: láti inú ayé
  rationale: ‘Láti inú’ pa agbára ἐκ mọ́, ní fífi hàn pé a mú wọn jáde lára ayé tàbí láti àárín rẹ̀, kì í ṣe pé wọ́n kúrò ní ilẹ̀ ayé ní ti ara.
- source_word: σοὶ ἦσαν
  choice: Tìrẹ ni wọ́n
  rationale: Èyí tẹ̀ lé ìṣọ̀kan àti ìtẹnumọ́ gbólóhùn Gíríìkì, ó sì jẹ́ Yorùbá tó rọrùn, tó níyì.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: o sì fi wọ́n fún mi
  rationale: Àmì ‘sì’ mú κἀμοί wá, ìtòlẹ́sẹẹsẹ Yorùbá náà sì ṣe àlàyé ẹni tí a fi wọ́n fún láìsí líle èdè.
- source_word: τὸν λόγον σου
  choice: ọ̀rọ̀ rẹ
  rationale: ‘Ọ̀rọ̀’ pa ìbámu pẹ̀lú λόγος àti ìjinlẹ̀ ọ̀rọ̀ náà nínú Jòhánù mọ́; ‘ẹ̀kọ́’ tàbí ‘ìhìn’ yóò dín agbára rẹ̀ kù.
- source_word: τετήρηκαν
  choice: wọ́n ti pa … mọ́
  rationale: Àkókò perfect náà ni ‘ti … mọ́’ ń ṣàfihàn, ‘pa ọ̀rọ̀ mọ́’ sì lè ní ìtumọ̀ títọ́jú, dídúró ṣinṣin nínú rẹ̀, àti ṣíṣègbọràn sí i.
theological_decisions:
- issue: Ìtumọ̀ ‘orúkọ rẹ’ nínú ẹ̀kọ́ Jòhánù
  choice: A pa ‘orúkọ rẹ’ mọ́ nínú àkọsílẹ̀ pàtàkì.
  alternative: ‘ẹni tí ìwọ jẹ́’ tàbí ‘ìwà rẹ’
  rationale: Ọ̀rọ̀ náà ní í ṣe pẹ̀lú ìdánimọ̀, ìwà, àti ìṣípayá Baba, ṣùgbọ́n àkọsílẹ̀ Gíríìkì lo ‘orúkọ.’ Kí a pa á mọ́ ń jẹ́ kí ìjinlẹ̀ ẹ̀kọ́ náà wà láìsọ ọ́ di àlàyé onítumọ̀.
- issue: Akọ tàbí ìtumọ̀ lápapọ̀ nínú τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ ti gbogbo ènìyàn, bí ó tilẹ̀ jẹ́ pé àwọn ọmọ-ẹ̀yìn ọkùnrin ni ó ń tọ́ka sí ní àyíká yìí. A yan ọ̀rọ̀ Yorùbá tó pa agbára ọ̀rọ̀ náà mọ́, a sì ṣàlàyé ẹni tí ó ń tọ́ka sí nínú àlàyé ìsàlẹ̀.
- issue: Baba fi àwọn ènìyàn fún Ọmọ
  choice: A túmọ̀ ìfúnni náà ní tààrà láìṣàlàyé ètò ìgbàlà kan sínú rẹ̀.
  alternative: Kí a túmọ̀ ọ́ gẹ́gẹ́ bí ẹ̀kọ́ ìyàn àìnídìí tàbí gẹ́gẹ́ bí ìdáhùn tí Ọlọ́run mọ̀ tẹ́lẹ̀.
  rationale: Ẹsẹ̀ náà sọ pé Baba fi àwọn wọ̀nyí fún Ọmọ, ṣùgbọ́n kò ṣàlàyé gbogbo ọ̀nà tàbí ètò ẹ̀kọ́ tó wà lẹ́yìn ìfúnni náà. Ìtumọ̀ náà pa ìfọkànsìn àti ìfarapa ẹ̀kọ́ inú àkọsílẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti àdúrà ọ̀wọ̀, ó níyì, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘o’ fún arọ́pò-orúkọ ẹnìkejì nítorí pé èdè Gíríìkì jẹ́ ẹyọ, láìfi ìlànà ẹ̀sìn ẹgbẹ́ kan kún un.
