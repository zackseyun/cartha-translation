id: JHN.17.11
reference: John 17:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: yo
  text: Èmi kò sì sí ní ayé mọ́, àwọn fúnra wọn sì wà ní ayé, èmi sì ń bọ̀ sí ọ̀dọ̀ rẹ. Baba Mímọ́, pa wọ́n mọ́ nínú orúkọ rẹ[a], orúkọ tí o ti fi fún mi[b], kí wọ́n lè jẹ́ ọ̀kan, gẹ́gẹ́ bí àwa ṣe jẹ́ ọ̀kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “pa wọ́n mọ́ nípasẹ̀ orúkọ rẹ” tàbí “dáàbò bo wọ́n pẹ̀lú orúkọ rẹ.” Gbólóhùn Gíríìkì náà lè fi ipò, ọ̀nà, tàbí àṣẹ hàn.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ẹ̀dà àfọwọ́kọ kan ka a sí “pa wọ́n mọ́ nínú orúkọ rẹ, èyí tí o ti fi fún mi,” nígbà tí a lè lóye àwọn mìíràn sí “pa àwọn tí o ti fi fún mi mọ́ nínú orúkọ rẹ.” Ìtumọ̀ yìí tẹ̀ lé ẹ̀dà SBLGNT, níbi tí gbolohun “tí o ti fi fún mi” ti tọ́ka sí “orúkọ.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: kò … mọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi hàn pé ipò kan kò tẹ̀ síwájú mọ́ láti ojú ìwòye olùsọ̀rọ̀.
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún κόσμος níhìn-ín, ó sì pa ìtumọ̀ Johanu mọ́ nípa ibi ìgbé ayé ènìyàn tí àwọn ọmọ-ẹ̀yìn ṣì wà.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: èmi sì ń bọ̀ wá sọ́dọ̀ rẹ
  rationale: Ìṣe tí ń lọ lọ́wọ́ yìí fi ìtọ́sọ́nà sí ẹni tí a ń bá sọ̀rọ̀ hàn, ó sì pa ìwòye ọ̀rọ̀ Gíríìkì “bọ̀” mọ́ dípò yíyí i sí “lọ.”
- source_word: πάτερ ἅγιε
  choice: Baba Mímọ́
  rationale: Àdúrà ìpè yìí jẹ́ ti ara Yorùbá, ó sì pa ìbátan “Baba” àti ìwà mímọ́ rẹ̀ mọ́.
- source_word: τήρησον
  choice: pa wọ́n mọ́
  rationale: “Pa … mọ́” lè gba ìtumọ̀ pípa mọ́, ṣíṣọ́, àti dídáàbò bo láì dín ọ̀rọ̀ náà kù sí ààbò ara nìkan.
- source_word: ἐν τῷ ὀνόματί σου
  choice: nínú orúkọ rẹ
  rationale: “Nínú” pa ààyè ìtumọ̀ ἐν mọ́ gẹ́gẹ́ bí ipò tàbí àgbègbè ìbáṣepọ̀, láì pinnu pé ohun èlò tàbí agbára nìkan ni.
- source_word: ᾧ δέδωκάς μοι
  choice: èyí tí o ti fi fún mi
  rationale: “Èyí” tọ́ka sí “orúkọ,” gẹ́gẹ́ bí ìbámu ọ̀rọ̀ arọ́pò-orúkọ nínú ẹ̀dà SBLGNT.
- source_word: ἵνα ὦσιν ἓν
  choice: kí wọ́n lè jẹ́ ọ̀kan
  rationale: Ọ̀rọ̀ yìí fi ète hàn, “ọ̀kan” sì pa èrò ìṣọ̀kan mọ́ láì sọ wọ́n di ènìyàn kan ṣoṣo.
- source_word: καθὼς ἡμεῖς
  choice: gẹ́gẹ́ bí àwa náà ti jẹ́ ọ̀kan
  rationale: Yorùbá nílò kí àfiwé náà pé; ṣíṣe àtúnṣe “jẹ́ ọ̀kan” jẹ́ ohun tí Gíríìkì fi sílẹ̀ ní àfojúsùn, kò sì ṣàlàyé irú ìṣọ̀kan náà ju ohun tí ẹsẹ sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ “pa wọ́n mọ́ nínú orúkọ rẹ”
  choice: A fi “nínú orúkọ rẹ” sí ọ̀rọ̀ pàtàkì láì ṣàlàyé rẹ̀ síwájú.
  alternative: “pa wọ́n mọ́ nípasẹ̀ orúkọ rẹ” tàbí “dáàbò bo wọ́n pẹ̀lú orúkọ rẹ”
  rationale: Gbólóhùn Gíríìkì lè tọ́ka sí ipò, ọ̀nà, tàbí àṣẹ; ìtumọ̀ yìí pa àìdánilójú tòótọ́ yẹn mọ́.
- issue: Agbára àfiwé “kí wọ́n lè jẹ́ ọ̀kan, gẹ́gẹ́ bí àwa”
  choice: A pa àfiwé gidi mọ́ láàárín ìṣọ̀kan àwọn ọmọ-ẹ̀yìn àti ìṣọ̀kan Baba àti Ọmọ, láì ṣàfikún àlàyé nípa irú ìṣọ̀kan náà.
  alternative: Ìṣọ̀kan ìfọwọ́sowọ́pọ̀ lásán, tàbí fífi ìdánimọ̀ oníwà kan náà lé àfiwé náà lórí
  rationale: Ọ̀rọ̀ náà ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ tó lágbára, ṣùgbọ́n kò ṣàlàyé ìṣọ̀kan náà ní ẹsẹ yìí; ìtumọ̀ náà kò gbọ́dọ̀ dín in kù tàbí fi ẹ̀kọ́ tó wá lẹ́yìn kún un.
- issue: Ohun tí ᾧ tọ́ka sí àti ìyàtọ̀ inú àwọn ẹ̀dà àfọwọ́kọ
  choice: A jẹ́ kí “èyí” tọ́ka sí “orúkọ” gẹ́gẹ́ bí SBLGNT.
  alternative: “pa àwọn tí o ti fi fún mi mọ́ nínú orúkọ rẹ”
  rationale: Ìbámu akọ-abo àti iye nínú ẹ̀dà orísun tí a yàn so arọ́pò-orúkọ mọ́ ὀνόματι, ṣùgbọ́n àwọn ẹ̀dà àfọwọ́kọ mìíràn àti òye míì yẹ kí a mẹ́nu kàn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. “Àwọn fúnra wọn” tẹnu mọ́ αὐτοὶ, “bọ̀ wá sọ́dọ̀ rẹ” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìtọ́sọ́nà sí ẹni tí a ń bá sọ̀rọ̀.
