id: JHN.17.23
reference: John 17:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: yo
  text: Èmi wà nínú wọn, ìwọ sì wà nínú mi, kí a lè mú wọn dé ìpéye nínú jíjẹ́ ọ̀kan[a], kí ayé lè mọ̀ pé ìwọ ni ó rán mi àti pé o fẹ́ràn wọn gẹ́gẹ́ bí o ti fẹ́ràn mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a lè sọ wọ́n di pípé nínú jíjẹ́ ọ̀kan,” tàbí, “kí a lè mú wọn dé ìparí nínú ìṣọ̀kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: nínú wọn / nínú mi
  rationale: Ó pa èdè ìgbé-inú-ẹni tí ó ṣe pàtàkì nínú Jòhánù mọ́, dípò yíyí àkọ́kọ́ sí ‘láàárín wọn,’ èyí tí yóò dín ìtumọ̀ ìrẹ́pọ̀ jinlẹ̀ kù.
- source_word: τετελειωμένοι
  choice: mú wọn pé
  rationale: Ọ̀rọ̀ yìí fi ipò tí ìṣe mímú dé òpin ti yọrí sí hàn. ‘Mú wọn pé’ lè túmọ̀ sí mímú dé ìpéye tàbí ìparí, láìfi dandan sọ pé ó jẹ́ àìlẹ́ṣẹ̀ pátápátá.
- source_word: εἰς ἕν
  choice: dé inú ìṣọ̀kan
  rationale: 'Ó fi ìdarí àti àbájáde tí εἰς ἕν ní hàn: a ń mú wọn lọ sí ipò jíjẹ́ ọ̀kan, kì í ṣe pé a kàn ń ṣàpèjúwe ipò kan tí ó ti wà tẹ́lẹ̀.'
- source_word: γινώσκῃ
  choice: lè mọ̀
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá àdánidá fún subjunctive nínú gbólóhùn ète ἵνα, láìfi àlàyé míì kún un.
- source_word: κόσμος
  choice: ayé
  rationale: ‘Ayé’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κόσμος nínú Jòhánù, ó sì pa ààyè ìtumọ̀ rẹ̀ mọ́ láìṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘àwọn ènìyàn ayé.’
- source_word: ἀπέστειλας
  choice: rán mi
  rationale: Ó túmọ̀ iṣẹ́ rírán Ọmọ ní ọ̀nà tó ṣe kedere, tó sì bá èdè Yorùbá mu.
- source_word: ἠγάπησας
  choice: fẹ́ràn
  rationale: Ó pa àtúnsọ ọ̀rọ̀ ìfẹ́ nínú ẹsẹ náà mọ́ ní ibi méjèèjì.
- source_word: καθὼς
  choice: gan-an gẹ́gẹ́ bí
  rationale: Ó pa agbára ìfiwéra náà mọ́, láìsọ ọ́ di àfiwé tí kò lágbára tàbí ṣàlàyé bí ìfẹ́ náà ṣe dọ́gba.
theological_decisions:
- issue: Agbára àfiwé nínú ‘o fẹ́ràn wọn ... gẹ́gẹ́ bí o ti fẹ́ràn mi’
  choice: Fi àfiwé náà hàn tààrà pẹ̀lú ‘gan-an gẹ́gẹ́ bí.’
  alternative: ‘bí o ti fẹ́ràn mi’ tàbí ‘pẹ̀lú irú ìfẹ́ kan náà’
  rationale: καθὼς gbé àfiwé gidi kalẹ̀. Ìtumọ̀ náà kò gbọ́dọ̀ dín ìwúwo ọ̀rọ̀ nípa ìfẹ́ Baba sí àwọn onígbàgbọ́ kù, bẹ́ẹ̀ ni kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
- issue: Ìtumọ̀ τετελειωμένοι nínú àyíká ọ̀rọ̀
  choice: Ṣe àfihàn mímú dé ìpéye tàbí ìparí sí inú ìṣọ̀kan.
  alternative: ‘sọ wọ́n di pípé nínú ọ̀kan’ tàbí ‘parí wọn nínú ìṣọ̀kan’
  rationale: Nínú àyíká Jòhánù, τελειόω sábà ń tọ́ka sí mímú ohun kan dé òpin tàbí ìpéye rẹ̀. ‘Mú wọn pé dé inú ìṣọ̀kan’ pa èrò yìí mọ́ láìfi dandan kà á sí àìlẹ́ṣẹ̀ pátápátá.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Èmi ... ìwọ’ pa ìtẹnumọ́ àwọn arọ́pò-orúkọ Gíríìkì mọ́; ‘nínú’ sì pa èdè ìgbé-inú-ẹni ti Jòhánù mọ́. Gbólóhùn méjèèjì tí ‘kí’ bẹ̀rẹ̀ fi ìtẹ̀lé àwọn ἵνα méjì hàn.
