revisions:
- from: Èmi wà nínú wọn, ìwọ sì wà nínú mi, kí a lè mú wọn pé dé inú ìṣọ̀kan[a], kí ayé lè mọ̀ pé ìwọ ni ó rán mi, àti pé o fẹ́ràn wọn gan-an gẹ́gẹ́ bí o ti fẹ́ràn mi.
  to: Èmi wà nínú wọn, ìwọ sì wà nínú mi, kí a lè mú wọn dé ìpéye nínú jíjẹ́ ọ̀kan[a], kí ayé lè mọ̀ pé ìwọ ni ó rán mi àti pé o fẹ́ràn wọn gẹ́gẹ́ bí o ti fẹ́ràn mi.
  rationale: The revision replaces an unnatural phrase with idiomatic Yoruba that preserves the passive/resultative sense of τετελειωμένοι and its contextual orientation to unity. It also retains the Greek pronoun emphasis in “ìwọ ni ó,” the repeated purpose clauses, and the unqualified comparison of the Father’s love.
  reviewer_model: gpt-5.6-terra
