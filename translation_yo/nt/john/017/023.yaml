    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural phrase with idiomatic Yoruba that preserves the passive/resultative sense of τετελειωμένοι and its contextual orientation to unity. It also retains the Greek pronoun emphasis in “ìwọ ni ó,” the repeated purpose clauses, and the unqualified comparison of the Father’s love.
