  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: yo
  text: Ṣùgbọ́n ní báyìí, èmi ń bọ̀ wá sọ́dọ̀ rẹ, mo sì ń sọ nǹkan wọ̀nyí nínú ayé, kí ayọ̀ tèmi lè kún pátápátá nínú wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “kí ayọ̀ tèmi lè pé nínú wọn,” tàbí “kí ayọ̀ tèmi lè kún láàárín wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n ní báyìí
  rationale: Ó fi ìyípadà sí ipò ìsinsìnyí hàn, pẹ̀lú ìtakora kékeré tí δέ ní.
- source_word: πρὸς σὲ ἔρχομαι
  choice: èmi ń bọ̀ wá sọ́dọ̀ rẹ
  rationale: Ọ̀rọ̀ yìí fi ìṣípò lọ sí ọ̀dọ̀ Baba hàn; ‘ń bọ̀ wá’ bá ojú ìwòye ẹni tí a ń tọ̀ lọ mu ní Yorùbá.
- source_word: ταῦτα λαλῶ
  choice: mo sì ń sọ nǹkan wọ̀nyí
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìṣe sísọ̀rọ̀ tí ó ń lọ lọ́wọ́.
- source_word: ἐν τῷ κόσμῳ
  choice: nígbà tí mo wà nínú ayé
  rationale: Ìtumọ̀ àkókò yìí jẹ́ kó ṣe kedere pé Jésù ń sọ̀rọ̀ nígbà tó ṣì wà nínú ayé, láìsọ àkòrí κόσμος nù.
- source_word: ἵνα ἔχωσιν
  choice: kí ... lè
  rationale: Ilana yìí fi ète tàbí àbájáde tí a pinnu hàn ní Yorùbá àdánidá.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: ayọ̀ tèmi
  rationale: '‘Tèmi’ pa ìtẹnumọ́ ohun-ìní inú èdè Gíríìkì mọ́: ayọ̀ tí ó jẹ́ ti Jésù fúnra rẹ̀.'
- source_word: πεπληρωμένην ἐν ἑαυτοῖς
  choice: kún inú wọn pátápátá
  rationale: Πληρόω fi jíjẹ́ kíkún dé òpin hàn; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì so kíkún ayọ̀ mọ́ inú àwọn ọmọ-ẹ̀yìn.
theological_decisions:
- issue: Irú ‘ayọ̀ tèmi’
  choice: Ayọ̀ tí ó jẹ́ ti Jésù fúnra rẹ̀, tí yóò sì kún inú àwọn ọmọ-ẹ̀yìn rẹ̀.
  alternative: Ayọ̀ nípa Jésù.
  rationale: ἐμὴν ní ìtumọ̀ ohun-ìní tó lágbára jù lọ níhìn-ín; a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ìbáṣepọ̀ πεπληρωμένην àti ἐν ἑαυτοῖς
  choice: Ayọ̀ náà kún inú wọn pátápátá.
  alternative: Kí ayọ̀ náà pé nínú wọn tàbí láàárín wọn.
  rationale: Ẹ̀dà yìí yan ìtumọ̀ inú ẹni tó ṣeé ṣe jù lọ, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn àṣàyàn gírámà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye; a lo ‘nígbà tí mo wà nínú ayé’ fún ìtumọ̀ àdánidá ti ἐν τῷ κόσμῳ, àti ‘ayọ̀ tèmi’ láti pa ìtẹnumọ́ Gíríìkì mọ́.
