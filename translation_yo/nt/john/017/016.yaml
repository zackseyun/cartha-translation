id: JHN.17.16
reference: John 17:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: yo
  text: Wọ́n kì í ṣe ti ayé[a], gẹ́gẹ́ bí èmi kì í ṣe ti ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti inú ayé.” Ọ̀rọ̀ Gíríìkì ἐκ lè tọ́ka sí orísun, ìpilẹ̀ṣẹ̀, tàbí jíjẹ́ ti ohun kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: ti
  rationale: Nínú gbólóhùn Yorùbá “kì í ṣe ti ayé,” “ti” lè sọ ìpilẹ̀ṣẹ̀ tàbí jíjẹ́ ti ẹgbẹ́ kan; ó jẹ́ ọ̀nà àdánidá láti túmọ̀ ἐκ ní àyíká yìí, láì fi àlàyé tó dín ìtumọ̀ kù sínú ọ̀rọ̀ náà.
- source_word: κόσμου
  choice: ayé
  rationale: “Ayé” ni ìtumọ̀ Yorùbá tó rọrùn, tó sì pa ìjìnlẹ̀ ìlò κόσμος nínú Jòhánù mọ́ láì tú un sí “ètò ayé” tàbí “ayé ẹlẹ́ṣẹ̀.”
- source_word: οὐκ εἰσὶν
  choice: Wọn kì í ṣe
  rationale: Ó mú ìsẹ̀lẹ̀ ìkọ̀ sẹ́yìn ti ọ̀rọ̀ ìṣe εἰμί wá ní Yorùbá àdánidá, ó sì sọ ipò wọn tó ń bá a lọ.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra tó ṣe kedere hàn láàárín àwọn ọmọ-ẹ̀yìn àti Jésù.
- source_word: ἐγὼ
  choice: èmi náà
  rationale: “Èmi” pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́; “náà” jẹ́ kí ìfiwéra náà ṣe kedere ní Yorùbá.
- source_word: οὐκ εἰμὶ
  choice: kì í ṣe
  rationale: Ìkọ̀ sẹ́yìn ẹni kìn-ín-ní ti εἰμί ni a sọ ní ọ̀nà Yorùbá tó ṣe déédéé pẹ̀lú abala àkọ́kọ́.
- source_word: ἐκ τοῦ κόσμου
  choice: ti ayé
  rationale: A tún gbólóhùn kan náà lò ní abala méjèèjì, bí Gíríìkì ṣe ṣe; ó lè tọ́ka sí ìpilẹ̀ṣẹ̀ tàbí jíjẹ́ ti ayé.
theological_decisions:
- issue: Ìtumọ̀ “ayé” nínú ẹ̀kọ́ Jòhánù
  choice: Pa “ayé” mọ́ láì fi àlàyé ìtumọ̀ kún un nínú ọ̀rọ̀ pàtàkì.
  alternative: “ètò ayé” tàbí “ayé tó yà kúrò lọ́dọ̀ Ọlọ́run”
  rationale: κόσμος ní ìjìnlẹ̀ ìtumọ̀ nínú Jòhánù, ṣùgbọ́n ẹsẹ̀ yìí kò sọ ìtumọ̀ náà di ọ̀kan ṣoṣo; “ayé” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Ìbáṣepọ̀ ἐκ pẹ̀lú κόσμος
  choice: “ti ayé” nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó tún lè túmọ̀ sí “láti inú ayé.”
  alternative: “láti inú ayé” nínú ọ̀rọ̀ pàtàkì
  rationale: “Ti ayé” dára sí etí Yorùbá, ó sì lè mú jíjẹ́ ti ẹgbẹ́ kan hàn; àkọ́lé ìsàlẹ̀ pa ìtumọ̀ ìpilẹ̀ṣẹ̀ tí ἐκ ní mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. Àtúnwí “ti ayé” pa ìṣọ̀kan àti ìtẹnumọ́ inú Gíríìkì mọ́.
