id: JHN.17.12
reference: John 17:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: yo
  text: Nígbà tí mo wà pẹ̀lú wọn, èmi ń pa wọ́n mọ́ nínú orúkọ rẹ, èyí tí o ti fi fún mi; mo sì ṣọ́ wọn, kò sì sí ẹnì kan nínú wọn tí ó ṣègbé bí kò ṣe ọmọ ìparun[b], kí Ìwé Mímọ́ lè ṣẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘Ọmọ ìparun’ jẹ́ àkànlò ọ̀rọ̀ bí ti èdè Hébérù; a tún lè túmọ̀ rẹ̀ sí ‘ẹni tí ìparun ń dúró de’ tàbí, gẹ́gẹ́ bí ìtumọ̀ àtijọ́, ‘ọmọ ègbé.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Nígbà tí mo wà pẹ̀lú wọn
  rationale: Ó fi àkókò tí Jésù wà pẹ̀lú àwọn ọmọ-ẹ̀yìn hàn ní ọ̀nà Yorùbá tí ó ṣe déédé, láì mú ìtumọ̀ náà jìnà sí Gíríìkì.
- source_word: ἐγὼ ἐτήρουν αὐτοὺς
  choice: èmi ń pa wọ́n mọ́
  rationale: ‘Èmi’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ‘ń pa wọ́n mọ́’ sì ṣàfihàn iṣẹ́ tí ń lọ lọ́wọ́ nínú ọ̀rọ̀-ìṣe aláìpé.
- source_word: ἐν τῷ ὀνόματί σου
  choice: nínú orúkọ rẹ
  rationale: Ìtumọ̀ yìí dúró sítòsí ọ̀rọ̀ orísun, ó sì pa ìjìnlẹ̀ ‘orúkọ’ gẹ́gẹ́ bí ìṣípayá ìwà àti àṣẹ Ọlọ́run mọ́ láì ṣàlàyé rẹ̀ rékọjá.
- source_word: ᾧ δέδωκάς μοι
  choice: èyí tí o ti fi fún mi
  rationale: Arọ́pò-orúkọ ìbátan náà jẹ́ akọ̀-abo àárín, ẹyọ kan, ó sì bá ‘orúkọ’ mu ju ‘wọn’ lọ; ‘ti fi fún mi’ tún ṣàfihàn àbájáde tí ó dúró títí.
- source_word: καὶ ἐφύλαξα
  choice: mo sì ṣọ́ wọn
  rationale: ‘Ṣọ́’ yàtọ̀ sí ‘pa mọ́,’ ó sì pa agbára ọ̀rọ̀ φυλάσσω gẹ́gẹ́ bí ṣíṣọ́ tàbí dídáàbò bo mọ́.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: kò sì sí ẹnì kan nínú wọn tí ó ṣègbé
  rationale: ‘Ṣègbé’ bá ìwúwo ἀπόλλυμι mu, ó sì ju èrò ohun tí ó kàn sọnù lọ; ó yẹ fún àyíká ọ̀rọ̀ ọlọ́wọ̀ yìí.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: ọmọ ìparun
  rationale: Ó pa àkànlò èdè Semitic náà mọ́ ní ọ̀nà ṣókí, láì sọ ọ́ di ẹ̀kọ́ pàtó nípa ìpinnu àyànmọ́.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: kí Ìwé Mímọ́ lè ṣẹ
  rationale: Ó pa ìtumọ̀ ète tàbí àbájáde ἵνα mọ́, ‘Ìwé Mímọ́’ sì tọ́ka sí ẹ̀rí Ìwé Mímọ́ tí a mọ̀ sí aláṣẹ.
theological_decisions:
- issue: Ohun tí ᾧ δέδωκάς μοι ń tọ́ka sí
  choice: 'Ó ń tọ́ka sí ‘orúkọ rẹ’: ‘orúkọ rẹ, èyí tí o ti fi fún mi.’'
  alternative: 'Kí a kà á sí àwọn ọmọ-ẹ̀yìn: ‘àwọn tí o fi fún mi.’'
  rationale: Gíríìkì tí a fún níbí ní arọ́pò-orúkọ ìbátan akọ̀-abo àárín, ẹyọ kan, tí ó bá ὀνόματι (‘orúkọ’) mu, kì í ṣe αὐτούς (‘wọn’) tí ó jẹ́ akọ, ọ̀pọ̀.
- issue: Ìtumọ̀ ὁ υἱὸς τῆς ἀπωλείας
  choice: ‘ọmọ ìparun,’ àkànlò Semitic tí ó so ẹni náà mọ́ ìparun.
  alternative: ‘ẹni tí ìparun ń dúró de’ tàbí ‘ọmọ ègbé.’
  rationale: Ìtumọ̀ tí ó sún mọ́ fọ́ọ̀mù orísun pa ìṣòro àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́, kò sì fi ẹ̀kọ́ nípa àyànmọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn kíkún, ní ìlànà ọ̀rọ̀ ọlọ́wọ̀ ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘pa wọ́n mọ́’ àti ‘ṣọ́ wọn’ láti pa ìyàtọ̀ láàárín τηρέω àti φυλάσσω mọ́.
