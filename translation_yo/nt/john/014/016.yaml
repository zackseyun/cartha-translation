source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: yo
  text: Èmi yóò sì béèrè lọ́wọ́ Baba, òun yóò sì fún yín ní Alágbèjà[a] mìíràn, kí ó lè wà pẹ̀lú yín títí láéláé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Olùrànlọ́wọ́,” “Olùdámọ̀ràn,” tàbí, ní ìbílẹ̀, “Olùtùnú,” fún ọ̀rọ̀ Gíríìkì παράκλητος.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Èmi yóò sì
  rationale: Àkópọ̀ καί àti ἐγώ so gbólóhùn yìí mọ́ ohun tó ṣáájú, ó sì tẹnumọ́ ẹni tó ń sọ̀rọ̀ díẹ̀. “Èmi yóò sì” jẹ́ àdánidá ní Yorùbá láì fi ìtẹnumọ́ kún un jù.
- source_word: ἐρωτήσω τὸν πατέρα
  choice: béèrè lọ́wọ́ Baba
  rationale: “Béèrè lọ́wọ́” fi ìbéèrè tàbí ìrawọ́ ẹ̀bẹ̀ hàn lọ́nà Yorùbá tó ṣe kedere. “Baba” pa àpèjúwe pàtó náà mọ́ láì ṣàfikún “Baba mi,” èyí tí kò sí nínú Gíríìkì.
- source_word: ἄλλον παράκλητον
  choice: Alágbàwí mìíràn
  rationale: “Mìíràn” pa ìtumọ̀ ἄλλον mọ́. “Alágbàwí” fi ẹni tó dúró fún ẹlòmíràn tàbí tó ń gbèjà rẹ̀ hàn, ó sì pa ìwúwo ti παράκλητος mọ́; àwọn ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: δώσει ὑμῖν
  choice: òun yóò sì fún yín ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ọ̀rọ̀ ìṣe ọjọ́ iwájú náà àti ẹni tí a ó fi ẹ̀bùn náà fún.
- source_word: ἵνα ᾖ μεθ’ ὑμῶν
  choice: kí ó lè máa wà pẹ̀lú yín
  rationale: “Kí ó lè” pa ète tàbí àbájáde tí ἵνα pẹ̀lú subjunctive ń fi hàn mọ́; “máa wà” mú ìwà-pẹ̀lú tó ń bá a lọ hàn lọ́nà àdánidá.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láéláé
  rationale: Èyí ni àdánidá Yorùbá fún gbolohun àkànlò èdè Gíríìkì tó túmọ̀ sí ìwà tí kò ní òpin.
theological_decisions:
- issue: Ìtumọ̀ παράκλητος nínú ìlérí nípa Ẹ̀mí
  choice: Alágbàwí
  alternative: Olùrànlọ́wọ́, Olùdámọ̀ràn, tàbí Olùtùnú
  rationale: “Alágbàwí” pa ìṣe aṣojú àti ìgbèjà mọ́, ó sì ń tọ́ka sí ẹni kan, kì í ṣe agbára lásán. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó gbòòrò; nítorí náà, a fi àwọn àṣàyàn pàtàkì sínú àlàyé ìsàlẹ̀ láì pinnu gbogbo iṣẹ́ ẹni tí a ṣèlérí.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Òun” jẹ́ kí ìtọ́kasí sí Baba ṣe kedere, “máa wà” sì jẹ́ kí ìlérí ìwà-pẹ̀lú tó ń bá a lọ dun ní àdánidá.
