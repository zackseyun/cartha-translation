id: JHN.14.12
reference: John 14:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: yo
  text: “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹni tí ó bá gba mí gbọ́, ẹni náà yóò ṣe àwọn iṣẹ́ tí èmi ń ṣe; yóò sì ṣe àwọn iṣẹ́ tí ó tóbi jù ìwọ̀nyí lọ, nítorí èmi ń lọ sí ọ̀dọ̀ Baba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ àgbékalẹ̀ oníṣọ̀kan méjì náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi òtítọ́ ọ̀rọ̀ náà múlẹ̀.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: ẹni tí ó bá gba mí gbọ́
  rationale: Ó tú participle olóórúkọ náà sí Yorùbá àdánidá, ó sì ní ìtumọ̀ gbogbogbò fún ẹnikẹ́ni tí ó bá ní ìgbàgbọ́ nínú Jesu.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: ‘Àwọn iṣẹ́’ pa èdè pàtàkì ti Ìhìn Rere Jòhánù mọ́, ó sì lè tọ́ka sí iṣẹ́ àti àmì Jesu láì dín ìtumọ̀ rẹ̀ kù.
- source_word: ἃ ἐγὼ ποιῶ
  choice: tí èmi ń ṣe
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ hàn ní Yorùbá, nígbà tí ‘èmi’ pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: κἀκεῖνος ποιήσει
  choice: yóò ṣe ... pẹ̀lú
  rationale: ‘Pẹ̀lú’ gbé ìtumọ̀ ‘ẹni náà náà/also’ jáde ní ọ̀nà Yorùbá tí ó rọrùn, ‘yóò ṣe’ sì pa ọjọ́-ọ̀la ποιήσει mọ́.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: yóò sì ṣe àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ
  rationale: A tún ‘àwọn iṣẹ́’ tí a lóye láti inú gbólóhùn tó ṣáájú sọ, kí Yorùbá lè péye, láì ṣàlàyé irú ọ̀nà tí àwọn iṣẹ́ náà fi tóbi jù.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó sọ ìdí tí gbólóhùn Gíríìkì ń fún ní kedere.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: èmi ń lọ sọ́dọ̀ Baba
  rationale: Ó pa present tí ó ní agbára ọjọ́-ọ̀la tó sún mọ́lé mọ́, ‘sọ́dọ̀’ sì ṣàfihàn ìtọ́sọ́nà πρὸς lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ’
  choice: 'A fi gbólóhùn náà sílẹ̀ ní ìtumọ̀ rẹ̀ tí ó gbòòrò: ẹni tí ó gba Jesu gbọ́ yóò ṣe àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ, ìdí rẹ̀ sì ní í ṣe pẹ̀lú lílọ Jesu sọ́dọ̀ Baba.'
  alternative: A lè ṣàlàyé ‘tóbi’ gẹ́gẹ́ bí èyí tí ó gbòòrò sí i, tí ó ṣe pàtàkì sí i nínú ìtàn ìràpadà, tàbí iṣẹ́ tí Ẹ̀mí ń fún ìjọ lágbára láti ṣe.
  rationale: Ẹsẹ náà kò sọ ọ̀nà pàtó tí àwọn iṣẹ́ náà fi tóbi jù; nítorí náà, ìtumọ̀ kò fi ẹ̀kọ́ ìtumọ̀ kan tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. Èdè náà ní ọlá, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. ‘Ẹni tí ó bá’ yàgò fún fífi akọ tàbí abo tí Yorùbá kò fi hàn sínú aṣojú olókan Gíríìkì.
