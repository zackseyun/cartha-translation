- from: “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹni tí ó bá gba mí gbọ́ yóò ṣe àwọn iṣẹ́ tí èmi ń ṣe pẹ̀lú; yóò sì ṣe àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ, nítorí èmi ń lọ sọ́dọ̀ Baba.”
  to: “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹni tí ó bá gba mí gbọ́, ẹni náà yóò ṣe àwọn iṣẹ́ tí èmi ń ṣe; yóò sì ṣe àwọn iṣẹ́ tí ó tóbi jù ìwọ̀nyí lọ, nítorí èmi ń lọ sí ọ̀dọ̀ Baba.”
