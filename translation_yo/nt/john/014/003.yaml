  - severity: low
    issue: “Ààyè” lè ní ìtumọ̀ àǹfààní tàbí àkókò, kì í sì ṣe ibi ní pàtó ní gbogbo àyíká.
    rationale: Τόπον túmọ̀ sí “ibi”; “ibi kan” jẹ́ kedere, ó sì fi ohun tí “ibi” náà jẹ́ sílẹ̀ láìfikún ìtumọ̀.
  - severity: medium
