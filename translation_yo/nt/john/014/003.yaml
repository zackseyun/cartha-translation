  to: Bí mo bá lọ, tí mo bá sì pèsè ibi kan fún yín, mo ń bọ̀ lẹ́ẹ̀kan sí i[a], èmi yóò sì gbà yín sí ọ̀dọ̀ mi, kí ẹ̀yin pẹ̀lú lè wà níbi tí èmi wà.[b]
  rationale: Àtúnṣe náà mú àídájú ọjọ́ iwájú ti ἐὰν ... καὶ ... subjunctive hàn ní Yorùbá, yan “ibi kan” gẹ́gẹ́ bí ìbámu tààrà fún τόπον, ó sì rọ́pò ọ̀rọ̀ tí kò rọrùn pẹ̀lú “gbà yín sí ọ̀dọ̀ mi,” tó bá παραλήμψομαι ... πρὸς ἐμαυτόν mu. A ti pa ìrísí ìsinsìnyí tí ó ní ìtọ́kasí ọjọ́ iwájú nínú “mo ń bọ̀” mọ́, a kò sì pinnu irú wíwá náà nínú ìtumọ̀ tàbí àlàyé abẹ́lẹ̀.
