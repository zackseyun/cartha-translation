    rationale: Παραλήμψομαι ... πρὸς ἐμαυτόν sọ nípa gbígba àwọn ọmọ-ẹ̀yìn sí ọ̀dọ̀ ara ẹni. “Gbà yín sí ọ̀dọ̀ mi” jẹ́ ìtumọ̀ Yorùbá àdánidá tó dá ìtumọ̀ yẹn dúró.
