id: JHN.14.3
reference: John 14:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: yo
  text: Bí mo bá lọ, tí mo bá sì pèsè ibi kan fún yín, mo ń bọ̀ lẹ́ẹ̀kan sí i[a], èmi yóò sì gbà yín sí ọ̀dọ̀ mi, kí ẹ̀yin pẹ̀lú lè wà níbi tí èmi wà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Èmi yóò tún padà wá.” Ọ̀rọ̀ Gíríìkì lo ìrísí ọ̀rọ̀ ìsinsìnyí (“mo ń bọ̀”) pẹ̀lú ìtumọ̀ ọjọ́ iwájú.
    reason: lexical_alternative
  - marker: b
    text: Èrò àwọn atúmọ̀ yàtọ̀ síra nípa bóyá “mo ń bọ̀ lẹ́ẹ̀kan sí i” ń tọ́ka ní pàtó sí ìpadàbọ̀ Jésù ní òpin, àwọn ìfarahàn rẹ̀ lẹ́yìn àjíǹde, wíwá Ẹ̀mí, tàbí ìlérí alápọ̀ọ́pọ̀ tó gba ohun tó ju ọ̀kan nínú ìwọ̀nyí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: Bí mo bá sì lọ
  rationale: Ọ̀rọ̀ yìí fi ohun tí yóò ṣẹlẹ̀ lọ́jọ́ iwájú hàn gẹ́gẹ́ bí àbájáde tí a gbé ka ohun mìíràn; “lọ” sì ni ìtumọ̀ tààrà ti πορεύομαι ní àyíká ọ̀rọ̀ yìí.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: pèsè àyè sílẹ̀ fún yín
  rationale: “Pèsè … sílẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a mú ohun kan ṣe tán; “àyè” pa ìtumọ̀ τόπος mọ́ láìṣe àlàyé ohun tí àyè náà jẹ́.
- source_word: πάλιν ἔρχομαι
  choice: mo ń bọ̀ lẹ́ẹ̀kan sí i
  rationale: Ìtumọ̀ yìí pa ìrísí ọ̀rọ̀ ìsinsìnyí ἔρχομαι àti agbára ìlérí rẹ̀ mọ́, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tọ́ka sí ọjọ́ iwájú ní àyíká yìí.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: èmi yóò sì mú yín wá sọ́dọ̀ ara mi
  rationale: Gbólóhùn yìí sọ ní èdè Yorùbá òde òní pé Jésù yóò mú àwọn ọmọ-ẹ̀yìn rẹ̀ wọ inú wíwà pẹ̀lú òun, ó sì pa agbára ìbáṣepọ̀ inú πρὸς ἐμαυτόν mọ́.
- source_word: ἵνα
  choice: kí
  rationale: “Kí” ni ọ̀nà Yorùbá àdánidá láti mú gbólóhùn ète wọlé, gẹ́gẹ́ bí ἵνα ṣe rí níbí.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: níbi tí èmi wà
  rationale: Lílo “èmi” dípò “mo” gbé ìtẹnumọ́ inú ἐγώ jáde láìfi ohun tí kò sí nínú orísun kún un.
- source_word: καὶ ὑμεῖς ἦτε
  choice: kí ẹ̀yin pẹ̀lú lè wà
  rationale: “Lè wà” pa ìrísí ète ti subjunctive ἦτε mọ́; “ẹ̀yin pẹ̀lú” sì fi ìtẹnumọ́ καὶ ὑμεῖς hàn.
theological_decisions:
- issue: Irú ìpadàbọ̀ Jésù tí πάλιν ἔρχομαι ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìlérí ìpadàbọ̀ ọjọ́ iwájú, láìsọ pàtó ọ̀nà tàbí àsìkò rẹ̀.
  alternative: Ó lè tọ́ka sí ìfarahàn Jésù lẹ́yìn àjíǹde, wíwá Ẹ̀mí, ìpadàbọ̀ rẹ̀ ní òpin, tàbí ìlérí alápọ̀ọ́pọ̀ tó gba ohun tó ju ọ̀kan nínú ìwọ̀nyí.
  rationale: Ẹsẹ náà ṣe ìlérí pé Jésù yóò tún wà pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀, yóò sì mú wọn wá sọ́dọ̀ ara rẹ̀; ṣùgbọ́n kò yẹ kí ìtumọ̀ pinnu àríyànjiyàn nípa ìṣẹ̀lẹ̀ pàtó tí ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yẹra fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
