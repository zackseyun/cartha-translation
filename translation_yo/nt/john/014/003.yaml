  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìṣọ̀kan ìtumọ̀ Gíríìkì mọ́ dáadáa: ìlànà àídájú ọjọ́ iwájú, ìmúrasílẹ̀ ibi fún àwọn ọmọ-ẹ̀yìn, ìlérí wíwá padà, gbígbà wọn sí ọ̀dọ̀ Jésù, àti ète pé kí wọ́n wà níbi tí ó wà. Ṣùgbọ́n ìṣe-ọrọ̀ méjì tí ó tẹ̀lé “Bí mo bá lọ” yẹ kí ó ní àmì àídájú kan náà ní Yorùbá.'
  naturalness: “Tí mo sì pèsè” lẹ́yìn “Bí mo bá lọ” kò fi ìtọ́kasí ọjọ́ iwájú/àídájú hàn kedere bí “tí mo bá sì pèsè.” Pẹ̀lú bẹ́ẹ̀, “mú yín wá sọ́dọ̀ ara mi” kì í ṣe ọ̀nà tí ó rọrùn jù lọ nínú Yorùbá òde òní fún παραλήμψομαι ... πρὸς ἐμαυτόν; “gbà yín sí ọ̀dọ̀ mi” jẹ́ àdánidá, ó sì pa ìtumọ̀ gbígba ẹni sínú ìwàláàyè tirẹ̀ mọ́.
  terminology: “Ibi” jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì péye fún τόπον ní àyíká yìí; ó yẹra fún ìtumọ̀ “ààyè” gẹ́gẹ́ bí àǹfààní tàbí àkókò. Àwọn ọ̀rọ̀ Jésù àti Ẹ̀mí nínú àlàyé abẹ́lẹ̀ wà ní ìforúkọsílẹ̀ tó yẹ, kò sì fi ìpinnu ẹ̀kọ́ ìsìn kan kún un.
