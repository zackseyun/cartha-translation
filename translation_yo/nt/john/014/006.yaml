id: JHN.14.6
reference: John 14:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Èmi ni ọ̀nà àti òtítọ́ àti ìyè. Kò sí ẹni tí ó ń wá sọ́dọ̀ Bàbá bí kò ṣe nípasẹ̀ mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: Yorùbá kò fi àkókò ìṣe hàn nínú ọ̀rọ̀-ìṣe bí Gíríìkì tàbí Gẹ̀ẹ́sì. Nínú ìtàn yìí, ‘sọ fún un’ jẹ́ ọ̀nà àdánidá láti mú ìsinsìnyí ìtàn Gíríìkì wá láìfi ìtumọ̀ mìíràn kún un.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: ‘Èmi’ tí a sọ ní kíkún pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ‘ni’ sì jẹ́ ìsopọ̀ àdánidá ní Yorùbá.
- source_word: ἡ ὁδός
  choice: ọ̀nà
  rationale: ‘Ọ̀nà’ lè túmọ̀ sí ipa tàbí ọ̀nà ìrìn ní ti ara àti ọ̀nà ìwọlé ní ìtumọ̀ àpẹẹrẹ, bí ọ̀rọ̀ Gíríìkì ṣe rí níhìn-ín.
- source_word: ἡ ἀλήθεια
  choice: òtítọ́
  rationale: ‘Òtítọ́’ ni ìbámu tààrà àti èdè Yorùbá àdánidá fún ἀλήθεια, láìdín ìtumọ̀ rẹ̀ kù sí ‘ohun gidi’ nìkan.
- source_word: ἡ ζωή
  choice: ìyè
  rationale: ‘Ìyè’ pa fífẹ̀ ìtumọ̀ ζωή mọ́ nínú Jòhánù, láìfi àlàyé bí ‘ìyè ayérayé’ kún ohun tí ẹsẹ yìí sọ.
- source_word: οὐδεὶς ἔρχεται
  choice: Kò sí ẹni tí ó ń wá
  rationale: Gbólóhùn yìí sọ òtítọ́ gbogbogbò pé kò sí ẹnikẹ́ni tí ó wá; àmì ‘ń’ mú ìṣe tí ó máa ń ṣẹlẹ̀ tàbí tí ó ń lọ lọ́wọ́ hàn ní Yorùbá.
- source_word: πρὸς τὸν πατέρα
  choice: sọ́dọ̀ Bàbá
  rationale: ‘Sọ́dọ̀’ fi ìlọsíwájú sí ọ̀dọ̀ ẹnì kan hàn. ‘Bàbá’ dúró gẹ́gẹ́ bí orúkọ oyè Ọlọ́run ní àyíká ọ̀rọ̀ yìí.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: 'Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìyàsọ́tọ̀ tí εἰ μὴ fi hàn: ‘àfi’ tàbí ‘bí kò ṣe.’'
- source_word: δι’ ἐμοῦ
  choice: nípasẹ̀ mi
  rationale: ‘Nípasẹ̀ mi’ pa ìtumọ̀ ọ̀nà tàbí alárinà inú διά pẹ̀lú ẹ̀yà olùní mọ́ dáadáa ju ṣíṣe e ní ‘pẹ̀lú mi’ lọ.
theological_decisions:
- issue: Jésù nìkan ni ọ̀nà sí ọ̀dọ̀ Bàbá
  choice: Kò sí ẹni tí ó ń wá sọ́dọ̀ Bàbá bí kò ṣe nípasẹ̀ mi.
  alternative: Kò sí ẹni tí ó ń wá sọ́dọ̀ Bàbá àfi nípasẹ̀ mi.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìyàsọ́tọ̀ yìí ní tààrà. A kò rọ ọ́, bẹ́ẹ̀ ni a kò fi ẹ̀kọ́ ẹ̀sìn tí kò sí nínú ẹsẹ náà kún un.
- issue: Àwọn orúkọ àsọtẹ́lẹ̀ mẹ́ta tí Jésù lò fún ara rẹ̀
  choice: ọ̀nà àti òtítọ́ àti ìyè
  alternative: ọ̀nà, òtítọ́ àti ìyè
  rationale: Àtúnlò ‘àti’ pa ìtẹnumọ́ àti ìṣètò mẹ́ta inú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé fífi àmì àkójọ lò lè rọrùn díẹ̀ ní Yorùbá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Jésù’ àti ‘Bàbá’ gẹ́gẹ́ bí ìkọ̀wé àti oyè tó wọ́pọ̀. A kò fi àlàyé ẹ̀kọ́ ìsìn kún ọ̀rọ̀ orísun.
