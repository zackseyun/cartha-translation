  source_fidelity: 'Ìtumọ̀ náà mú ìtẹ̀lé ọ̀rọ̀ Gíríìkì náà dáadáa: Jésù ń fi àlàáfíà sílẹ̀, ó ń fi àlàáfíà tirẹ̀ fún wọn, ó sì yà fífúnni tirẹ̀ sọ́tọ̀ sí ti ayé. Ṣùgbọ́n gbolohun ìkẹyìn àti àlàyé ìsàlẹ̀ nílò ìmúdára kékeré kí μηδέ àti δειλιάω lè hàn ní kedere síi.'
  naturalness: “Bẹ́ẹ̀ ni kí ó má ṣe fòyà” lè yéni, ṣùgbọ́n ìtúnwí “Ẹ má sì jẹ́ kí ó fòyà” jẹ́ Yorùbá ìgbàlódé tó rọrùn síi, ó sì pa àṣẹ àfikún δεύτερη mọ́. “Kì í ṣe bí ayé ṣe ń fúnni ni mo ń fún yín” jẹ́ ìtúmọ̀ àfiwé tó mọ́gbọ́n dání ju “Èmi kò fi fún yín bí ayé ti ń fi fúnni.”
  terminology: “Àlàáfíà,” “ayé,” “ọkàn yín,” àti “fòyà” bá ọ̀rọ̀ Gíríìkì àti ìlò Bíbélì Yorùbá mu. Àmọ́ “jíjẹ́ onítìjú nítorí ẹ̀rù” nínú ìsàlẹ̀ kò pé fún δειλιάω, nítorí onítìjú sábà ń tọ́ka sí ẹni tí ojú tì, kì í ṣe ẹni tí ó bẹ̀rù tàbí tí ìgboyà rẹ̀ rọ̀.
