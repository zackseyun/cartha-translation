id: JHN.14.27
reference: John 14:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: yo
  text: Àlàáfíà ni mo fi sílẹ̀ fún yín; àlàáfíà tèmi ni mo fi fún yín. Kì í ṣe bí ayé ṣe ń fúnni ni mo ń fún yín. Ẹ má ṣe jẹ́ kí ọkàn yín dààmú, ẹ má sì jẹ́ kí ó fòyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó má ṣe bẹ̀rù,” tàbí “kí ó má ṣe pàdánù ìgboyà.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ jíjẹ́ ẹni ìbẹ̀rù tàbí pípadánù ìgboyà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: Àlàáfíà
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ìtumọ̀ àdánidá fún ‘àlàáfíà,’ ó sì lè gba ìtumọ̀ tó gbòòrò ju àìsí ìjà lọ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí.
- source_word: ἀφίημι
  choice: mo fi sílẹ̀
  rationale: Ó tẹ̀ lé ìtumọ̀ pé Jésù ń fi àlàáfíà sílẹ̀ fún àwọn ọmọ-ẹ̀yìn rẹ̀; kò fi èrò ogún tí ‘fi jogún’ lè mú wọlé ní tààràtà.
- source_word: τὴν ἐμὴν
  choice: àlàáfíà tèmi
  rationale: ‘Tèmi’ pa ìtẹnumọ́ ohun-ìní inú Gíríìkì mọ́, ó sì yà àlàáfíà Jésù sọ́tọ̀ kúrò nínú ohun tí ayé ń fúnni.
- source_word: δίδωμι
  choice: mo fi fún yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ‘mo fún yín,’ ó sì pa àsọtúnṣe ọ̀rọ̀-ìṣe náà àti ìyàtọ̀ sí fífúnni ti ayé mọ́.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: Èmi kò fi fún yín bí ayé ti ń fi fúnni
  rationale: Ó mú àfiwé àti ìtẹnumọ́ ‘Èmi’ hàn gbangba, ní èdè Yorùbá tó ṣàn láì ṣàlàyé bí fífúnni ti ayé ṣe rí ju ohun tí Gíríìkì sọ lọ.
- source_word: κόσμος
  choice: ayé
  rationale: ‘Ayé’ ni ìtumọ̀ Yorùbá tí a mọ̀ fún κόσμος nínú Jòhánù, ó sì pa ìwọ̀n ìtumọ̀ rẹ̀ mọ́ láì dín un kù sí àwùjọ ènìyàn tàbí ètò ayé nìkan.
- source_word: μὴ ταρασσέσθω
  choice: Ẹ má ṣe jẹ́ kí ... dààmú
  rationale: Ó mú àṣẹ Gíríìkì tí ó ní ìtumọ̀ ‘má jẹ́ kí ó wà nínú ìdàrúdàpọ̀’ jáde ní Yorùbá àdánidá, ó sì lè bá ìtumọ̀ Jòhánù 14:1 mu.
- source_word: ὑμῶν ἡ καρδία
  choice: ọkàn yín
  rationale: Ó pa ẹyọ ọ̀rọ̀ ‘ọkàn’ àti arọ́pò-orúkọ ọ̀pọ̀ ‘yín’ mọ́, gẹ́gẹ́ bí ọkàn àwọn ọmọ-ẹ̀yìn tí a kà papọ̀.
- source_word: μηδὲ δειλιάτω
  choice: bẹ́ẹ̀ ni kí ó má ṣe fòyà
  rationale: ‘Fòyà’ mú ìbẹ̀rù àti pípadánù ìgboyà tí δειλιάω ní jáde, láì lo ọ̀rọ̀ líle tó lè túmọ̀ sí ìwà ojo.
theological_decisions:
- issue: Irú àlàáfíà tí Jésù ń fúnni
  choice: Àlàáfíà / àlàáfíà tèmi
  alternative: Ìfọ̀kànbalẹ̀ inú; ìwà-pípé májẹ̀mú ọjọ́ iwájú; ìpadàrẹ́ pẹ̀lú Ọlọ́run
  rationale: Ẹsẹ̀ náà kò sọ àlàáfíà yìí di ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí nìkan. Fífi ‘àlàáfíà’ sílẹ̀ láì ṣàlàyé rẹ̀ jù pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ tó gbòòrò àti ìfòyemọ̀ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ ... yín’ tọ́ka sí ọ̀pọ̀ ènìyàn, nígbà tí ‘ọkàn’ wà ní ẹyọ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì. Àtúnṣe ‘bẹ́ẹ̀ ni’ mú μηδέ jáde gẹ́gẹ́ bí ìfikún àṣẹ kejì.
