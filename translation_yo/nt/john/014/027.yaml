revisions:
- from: Àlàáfíà ni mo fi sílẹ̀ fún yín; àlàáfíà tèmi ni mo fi fún yín. Èmi kò fi fún yín bí ayé ti ń fi fúnni. Ẹ má ṣe jẹ́ kí ọkàn yín dààmú, bẹ́ẹ̀ ni kí ó má ṣe fòyà.[a]
  to: Àlàáfíà ni mo fi sílẹ̀ fún yín; àlàáfíà tèmi ni mo fi fún yín. Kì í ṣe bí ayé ṣe ń fúnni ni mo ń fún yín. Ẹ má ṣe jẹ́ kí ọkàn yín dààmú, ẹ má sì jẹ́ kí ó fòyà.[a]
  rationale: Àtúnṣe náà pa ìtumọ̀ gbooro ti εἰρήνην mọ́, ó sì pa ìyàtọ̀ láàárín fífúnni Jésù àti ti ayé mọ́ láì ṣàlàyé ohun tí “ayé” tàbí “àlàáfíà” túmọ̀ sí ju bí ẹsẹ̀ ṣe sọ lọ. A tún ṣe ìtúnṣe díẹ̀ sí gbolohun àṣẹ àti ìsàlẹ̀ kí Yorùbá rẹ̀ le rọrùn, kí ìtumọ̀ δειλιάω sì péye.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:28:12Z'
