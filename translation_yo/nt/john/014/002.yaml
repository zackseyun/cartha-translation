id: JHN.14.2
reference: John 14:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: yo
  text: Nínú ilé Baba mi, ọ̀pọ̀ ibi ìgbé wà[a]. Bí kò bá rí bẹ́ẹ̀[b], ǹjẹ́ mo ìbá ti sọ fún yín pé mo ń lọ láti pèsè ibi kan fún yín?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yàrá púpọ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ibi tí a ń dúró tàbí tí a ń gbé; “ibi ìgbé” gbooro, ó sì pa ìsopọ̀ mọ́ àkòrí dídúró tàbí gbígbé nínú orí yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Bí kò bá rí bẹ́ẹ̀, mo ìbá ti sọ fún yín; nítorí mo ń lọ láti pèsè ibi kan fún yín.” A tún lè ka gbólóhùn Gíríìkì náà gẹ́gẹ́ bí ìsọfúnni dípò ìbéèrè aláhùn-ìdáhùn.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: ilé
  rationale: “Ilé” ni ìtumọ̀ àdánidá jù lọ níbí; ó pa àwòrán ilé Baba mọ́ láì túmọ̀ ọ́ sí agbo ilé tàbí ìdílé.
- source_word: πατρός μου
  choice: Baba mi
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún ‘ti Baba mi’; lílo lẹ́tà ńlá fún “Baba” ń tọ́ka sí Ọlọ́run nínú ọ̀rọ̀ Jesu.
- source_word: μοναὶ πολλαί
  choice: ibi ìgbé púpọ̀
  rationale: μονή túmọ̀ sí ibi tí a ń gbé tàbí tí a ń dúró; “ibi ìgbé” gbooro ju “yàrá” lọ, ó sì pa ìsopọ̀ pẹ̀lú àkòrí dídúró/gbígbé nínú Jòhánù 14 mọ́.
- source_word: εἰ δὲ μή
  choice: Bí kò bá rí bẹ́ẹ̀
  rationale: Ó sọ ipò tí a fi pamọ́ sínú gbólóhùn Gíríìkì náà jáde ní Yorùbá kedere àti lọ́nà àdánidá.
- source_word: εἶπον ἂν ὑμῖν
  choice: ǹjẹ́ èmi ìbá ti sọ fún yín
  rationale: “Ìbá ti sọ” ṣe àfihàn ọ̀rọ̀ àídájú tí ó tọ́ka sí ohun tí ìbá ti ṣẹlẹ̀, “ǹjẹ́” sì mú agbára ìbéèrè aláhùn-ìdáhùn jáde.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ṣàgbékalẹ̀ àkóónú ohun tí Jesu ìbá sọ; ó bá ìtumọ̀ ὅτι gẹ́gẹ́ bí atọ́ka àkóónú mu.
- source_word: πορεύομαι
  choice: mo ń lọ
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ pẹ̀lú ìtọ́ka ọjọ́ iwájú tí ọ̀rọ̀ Gíríìkì ní nínú àyíká yìí mọ́.
- source_word: ἑτοιμάσαι
  choice: láti pèsè … sílẹ̀
  rationale: Ìṣètò yìí fi ète ìlọ náà hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘láti múra/pèsè.’
- source_word: τόπον
  choice: ààyè
  rationale: “Ààyè” gbooro bí τόπος, kò sì dín un kù sí “yàrá,” ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó fi dative oníàǹfààní hàn, ó sì jẹ́ kí ọ̀pọ̀ ènìyàn inú “yín” ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ μονή ní ìbámu pẹ̀lú àwòrán ohun ọjọ́ iwájú
  choice: ibi ìgbé púpọ̀
  alternative: yàrá púpọ̀; ààfin púpọ̀
  rationale: “Ibi ìgbé” pa ìtumọ̀ gbooro ti ibi dídúró tàbí gbígbé mọ́. Kò fi àwòrán ààfin tí ọ̀rọ̀ náà kò béèrè fún kún un, bẹ́ẹ̀ ni kò fi dandan sọ pé àwọn ibi náà jẹ́ yàrá inú ilé kan.
- issue: Àmì ìdádúró àti agbára gbólóhùn kejì
  choice: 'Ìbéèrè aláhùn-ìdáhùn: “Bí kò bá rí bẹ́ẹ̀, ǹjẹ́ èmi ìbá ti sọ fún yín pé …?”'
  alternative: 'Gbólóhùn ìsọfúnni: “Bí kò bá rí bẹ́ẹ̀, èmi ìbá ti sọ fún yín; nítorí mo ń lọ láti pèsè ààyè sílẹ̀ fún yín.”'
  rationale: Ọ̀rọ̀ Gíríìkì lè gba ìṣètò méjèèjì nítorí pé àmì ìdádúró kì í ṣe apá ti àkọsílẹ̀ ìpilẹ̀ṣẹ̀. Ìbéèrè aláhùn-ìdáhùn bá ìṣàn ọ̀rọ̀ mu dáadáa, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn mìíràn tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá àkànṣe, ọ̀wọ̀, àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ibi ìgbé” àti “ààyè” jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye, tí wọn kò sì dín ìtumọ̀ Gíríìkì kù sí àwòrán ìkọ́lé kan pàtó.
