  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà ní gbogbo rẹ̀: οἰκία jẹ́ “ilé,” μοναὶ πολλαί jẹ́ “ọ̀pọ̀ ibi ìgbé,” àti ìbéèrè aláhùn-ìdáhùn náà jẹ́ ìṣètò tí ó ṣeé gbà fún εἰ δὲ μή, εἶπον ἂν ὑμῖν ὅτι. Ṣùgbọ́n “pèsè ààyè sílẹ̀” lè túmọ̀ sí fífi ààyè sílẹ̀ tàbí ṣíṣí ààyè sílẹ̀; kò ṣe kedere bí ìmúrasílẹ̀ “ibi kan” ti τόπον ṣe rí.'
