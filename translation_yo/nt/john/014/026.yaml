id: JHN.14.26
reference: John 14:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: yo
  text: Ṣùgbọ́n Alágbèjà[a], Ẹ̀mí Mímọ́, ẹni tí Baba yóò rán ní orúkọ mi, òun yóò kọ́ yín ní ohun gbogbo, yóò sì mú kí ẹ rántí gbogbo ohun tí mo sọ fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “Olùrànlọ́wọ́,” “Olùdámọ̀ràn,” tàbí “Olùtùnú” fún “Alágbèjà” (Gíríìkì: paraklētos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Alágbàwí
  rationale: Ọ̀rọ̀ yìí fi ẹni tí ń dúró fún ẹlòmíràn, tí ń gbèjà rẹ̀, tí ó sì ń ràn án lọ́wọ́ hàn. “Alágbàwí” pa ipa ẹni àti ti aṣojú mọ́; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tí ó ṣeé ṣe sílẹ̀.
- source_word: πνεῦμα τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó wọ́pọ̀, tí ó sì bá akọlé Gíríìkì mu.
- source_word: ὃ πέμψει ὁ πατὴρ
  choice: ẹni tí Baba yóò rán
  rationale: “Ẹni tí” fi hàn pé Ẹ̀mí náà jẹ́ ẹni tí ó ń ṣe iṣẹ́, kì í ṣe agbára aláìlẹ́ni-nínú lásán.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Ó pa àwòrán àti ìtẹ̀sí ọ̀rọ̀ Gíríìkì mọ́ láì fi dandan yan láàárín àṣẹ, aṣojú, tàbí ṣíṣe nítorí ẹnì kan.
- source_word: ἐκεῖνος
  choice: òun
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ onítẹnumọ́ “òun” dá àfiyèsí padà sí Alágbàwí, ó sì jẹ́ kí ipa ẹni rẹ̀ hàn gbangba.
- source_word: διδάξει ὑμᾶς πάντα
  choice: yóò kọ́ yín ní ohun gbogbo
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹ̀dá, ó ṣe kedere, ó sì pa fífẹ̀ ìlérí náà mọ́.
- source_word: ὑπομνήσει ὑμᾶς
  choice: yóò mú kí ẹ rántí
  rationale: 'Èyí sọ ìtumọ̀ olùṣe ti ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá: yóò fa kí wọ́n rántí.'
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: gbogbo ohun tí mo sọ fún yín
  rationale: Ó tẹ̀ lé ìkọ̀lé ọ̀rọ̀ Gíríìkì, ó sì mọ́gbọ́n dání ní Yorùbá òde òní.
theological_decisions:
- issue: Ìtọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni
  choice: Lílo “ẹni tí” àti “òun”
  alternative: Lílo ọ̀rọ̀ arọ́pò-orúkọ tí kò fi ẹni hàn
  rationale: Bí ó tilẹ̀ jẹ́ pé πνεῦμα jẹ́ akọ-orúkọ àárín ní gírámà Gíríìkì, παράκλητος àti ἐκεῖνος fi ipa ẹni àti ìṣe onítẹnumọ́ hàn. Yorùbá yìí pa èyí mọ́ láì fi ẹ̀kọ́ àfikún kún un.
- issue: Ìtumọ̀ παράκλητος
  choice: Alágbàwí
  alternative: Olùrànlọ́wọ́, Olùdámọ̀ràn, tàbí Olùtùnú
  rationale: Kò sí ọ̀rọ̀ Yorùbá kan ṣoṣo tí ó gba gbogbo ìtumọ̀ ọ̀rọ̀ Gíríìkì náà. “Alágbàwí” dáàbò bo ìtumọ̀ aṣojú àti ìgbèjà, nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa àwọn ojú ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. “Yín” àti “ẹ” jẹ́ ọ̀pọ̀ ènìyàn nínú àyíká yìí.
