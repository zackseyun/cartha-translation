  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: yo
  text: N kò ní fi yín sílẹ̀ bí àwọn ọmọ aláìní òbí[a]; mo ń bọ̀ wá sọ́dọ̀ yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “N kò ní fi yín sílẹ̀ láìní ìtọ́jú òbí.” Àwòrán inú ọ̀rọ̀ Gíríìkì ni ti àwọn ọmọ tí a fi sílẹ̀ láìsí ìtọ́jú òbí.
    reason: lexical_alternative
  - marker: b
    text: “Mo ń bọ̀ wá sọ́dọ̀ yín” lè tọ́ka sí wíwá Jésù lẹ́yìn àjíǹde rẹ̀, wíwá rẹ̀ nípasẹ̀ Ẹ̀mí Mímọ́, tàbí ìpadàbọ̀ rẹ̀ lọ́jọ́ iwájú; gbólóhùn Gíríìkì náà fúnra rẹ̀ kò fi dandan mú kí a yan ọ̀kan ṣoṣo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: kì yóò fi yín sílẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé kò ní fi wọ́n sílẹ̀ tàbí kọ̀ wọ́n sílẹ̀; ìtumọ̀ yìí bá ọ̀rọ̀ ὀρφανούς mu lọ́nà àdánidá ní Yorùbá.
- source_word: ὀρφανούς
  choice: bí ọmọ aláìní òbí
  rationale: Ó pa àwòrán gidi ti àwọn ọmọ tí kò ní ìtọ́jú òbí mọ́, láì dín un kù sí ìmọ̀lára pé a kọ ènìyàn sílẹ̀ nìkan.
- source_word: ἔρχομαι
  choice: èmi ń bọ̀
  rationale: Ìṣe àsìkò ìsinsìnyí Gíríìkì ní agbára ohun tó sún mọ́lé tàbí tó dájú; “ń bọ̀” pa ìmọ̀lára ìsinsìnyí náà mọ́ ní Yorùbá.
- source_word: πρὸς ὑμᾶς
  choice: wá sọ́dọ̀ yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣípò lọ sí ọ̀dọ̀ àwọn ènìyàn.
- source_word: Οὐκ
  choice: kì yóò
  rationale: Àtakò pẹ̀lú ìṣe ọjọ́ iwájú ni a fi “kì yóò” hàn ní Yorùbá.
theological_decisions:
- issue: Ohun tí “èmi ń bọ̀ wá sọ́dọ̀ yín” ń tọ́ka sí àti ìgbà rẹ̀
  choice: A túmọ̀ gbólóhùn náà láì sọ pàtó bóyá Jésù ń tọ́ka sí wíwá rẹ̀ lẹ́yìn àjíǹde, wíwá rẹ̀ nípasẹ̀ Ẹ̀mí Mímọ́, tàbí ìpadàbọ̀ rẹ̀ lọ́jọ́ iwájú.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìfarahàn Jésù lẹ́yìn àjíǹde, wíwá rẹ̀ nínú tàbí nípasẹ̀ Ẹ̀mí Mímọ́, tàbí ìpadàbọ̀ rẹ̀ níkẹyìn.
  rationale: Àyíká ọ̀rọ̀ náà ní àwọn ìlérí nípa Ẹ̀mí, ṣùgbọ́n gbólóhùn Gíríìkì náà tún lè tọ́ka sí wíwá Jésù fúnra rẹ̀. Ìtumọ̀ náà kò yan ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, kedere, àti àdánidá. A lo “ọmọ aláìní òbí” láti pa àwòrán ìdílé mọ́, àti “ń bọ̀ wá sọ́dọ̀ yín” láti pa ìmọ̀lára ìṣe tó ń sún mọ́lé mọ́.
