id: JHN.14.20
reference: John 14:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: yo
  text: Ní ọjọ́ náà, ẹ̀yin yóò mọ̀ pé èmi wà nínú Baba mi, ẹ̀yin sì wà nínú mi, èmi sì wà nínú yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún ọ̀rọ̀ náà “nínú” lò ní gbogbo apá mẹ́tẹ̀ẹ̀ta láti tẹ̀ lé èdè Gíríìkì àti àkòrí Jòhánù nípa wíwà nínú ara wọn. A lè ṣàlàyé rẹ̀ sí “wà ní ìṣọ̀kan pẹ̀lú,” ṣùgbọ́n ìyẹn túmọ̀ àwòrán náà ju ọ̀rọ̀ orísun lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ní ọjọ́ náà
  rationale: Gbólóhùn yìí ń tọ́ka sí àkókò kan pàtó. “Ní ọjọ́ náà” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa ìtẹnumọ́ ἐκείνῃ mọ́.
- source_word: γνώσεσθε
  choice: ẹ̀yin yóò mọ̀
  rationale: Ọ̀rọ̀ ọjọ́ iwájú náà túmọ̀ sí pé àwọn ọmọ-ẹ̀yìn yóò ní ìmọ̀ tàbí òye yìí. “Yóò mọ̀” jẹ́ èdè Yorùbá tó ṣe kedere láìfi ipa tí kò pọndandan sí ìlànà dídi ẹni tó mọ̀.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: A fi ọ̀rọ̀ arọ́pò-orúkọ olókìkí “ẹ̀yin” hàn gbangba láti pa ìtẹnumọ́ tí ὑμεῖς ní mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí wọn yóò mọ̀ sílẹ̀; kì í ṣe gbólóhùn tó ń sọ ìdí.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: èmi wà nínú Baba mi
  rationale: “Nínú” pa àwòrán ἐν mọ́, “Baba mi” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìbáṣepọ̀ ọmọ sí Baba. A fi “wà” kún un gẹ́gẹ́ bí èdè Yorùbá ṣe béèrè.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: ẹ̀yin sì wà nínú mi
  rationale: A tún lo “nínú” láti pa ìṣọ̀kan ọ̀rọ̀ àti àwòrán ìgbé-inú-ẹni-kìíní-kejì ti Jòhánù mọ́.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: èmi sì wà nínú yín
  rationale: κἀγώ túmọ̀ sí “èmi sì”; “nínú yín” pa èrò ìgbé-inú ara-ẹni ní ìhà méjèèjì mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Èdè ìgbé-inú ara-ẹni ti Jòhánù (ἐν ... ἐν ... ἐν)
  choice: 'A pa “nínú” mọ́ ní gbogbo ìgbà mẹ́tẹ̀ẹ̀ta: “èmi wà nínú Baba mi, ẹ̀yin sì wà nínú mi, èmi sì wà nínú yín.”'
  alternative: “Mo wà ní ìṣọ̀kan pẹ̀lú Baba mi, ẹ̀yin sì wà ní ìṣọ̀kan pẹ̀lú mi, èmi sì wà ní ìṣọ̀kan pẹ̀lú yín.”
  rationale: “Nínú” pa àwòrán àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́. Yíyí i sí “ní ìṣọ̀kan pẹ̀lú” yóò túmọ̀ àwòrán náà sí ọ̀nà kan ṣoṣo ju bí orísun ṣe ṣe lọ.
- issue: Ìbáṣepọ̀ Jésù sí Baba
  choice: “Èmi wà nínú Baba mi”
  alternative: “Èmi àti Baba mi jẹ́ ọ̀kan ní ìwà-ẹ̀dá” tàbí “Mo wà pẹ̀lú Baba mi.”
  rationale: Ìtumọ̀ náà kò dín agbára ọ̀rọ̀ Jòhánù kù, bẹ́ẹ̀ ni kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ ti ìgbà tó tẹ̀ lé e sínú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A lo “ẹ̀yin” àti “èmi” láti pa ìtẹnumọ́ àwọn ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, a sì yan “Baba” gẹ́gẹ́ bí orúkọ oyè nínú ìbáṣepọ̀ yìí.
