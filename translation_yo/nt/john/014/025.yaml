  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: yo
  text: Mo ti sọ àwọn nǹkan wọ̀nyí fún yín nígbà tí mo ṣì wà pẹ̀lú yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘nígbà tí mo ṣì ń dúró pẹ̀lú yín’ tàbí ‘nígbà tí mo ṣì ń gbé láàárín yín.’ Èdè Gíríìkì lo participle ọ̀rọ̀ ìṣe tó túmọ̀ sí ‘dúró’ tàbí ‘wà’; Jòhánù sì máa ń lo ọ̀rọ̀ yìí léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ afihàn aláìlẹ́mìí ọ̀pọ̀ ni; yíyan ‘àwọn nǹkan wọ̀nyí’ pa ìtumọ̀ ọ̀pọ̀ mọ́, ó sì ń tọ́ka sí àwọn ẹ̀kọ́ tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: λελάληκα
  choice: mo ti sọ
  rationale: Ìṣe aláṣepé ni èdè Gíríìkì; ‘mo ti sọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé Jésù ti sọ àwọn ọ̀rọ̀ náà, tí wọ́n sì ṣì ṣe pàtàkì ní àkókò yìí.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ni, ó ń tọ́ka sí àwọn ọmọ-ẹ̀yìn; ‘fún yín’ sọ ọ́ ní kedere láìfi ‘gbogbo’ kún ohun tí orísun kò sọ.
- source_word: παρ’ ὑμῖν
  choice: pẹ̀lú yín
  rationale: παρά pẹ̀lú dative ń fi ìsúnmọ́ tàbí wíwà ní ọ̀dọ̀ ẹnì kan hàn; ‘pẹ̀lú yín’ ni Yorùbá àdánidá jù lọ ní àyíká yìí.
- source_word: μένων
  choice: nígbà tí mo ṣì wà
  rationale: Participle ìsinsìnyí ti μένω ni. ‘Nígbà tí mo ṣì wà’ mú ìṣe tí ń bá a lọ àti wíwà Jésù pẹ̀lú wọn jáde ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ fi àṣàyàn tó sún mọ́ ‘dúró/gbé’ hàn.
theological_decisions:
- issue: Bí a ṣe lè pa àtúnlò ọ̀rọ̀ μένω nínú Jòhánù mọ́ láìsọ Yorùbá di líle
  choice: nígbà tí mo ṣì wà pẹ̀lú yín
  alternative: nígbà tí mo ṣì ń dúró pẹ̀lú yín; nígbà tí mo ṣì ń gbé láàárín yín
  rationale: Μένω jẹ́ ọ̀rọ̀ pàtàkì tí Jòhánù máa ń tún lò, ṣùgbọ́n ‘dúró’ lè túmọ̀ sí dídúró lórí ẹsẹ̀ ní Yorùbá, ‘gbé láàárín’ sì lè fi ìtumọ̀ ibùgbé kún un. ‘Ṣì wà pẹ̀lú yín’ pa ìtumọ̀ ìwàníhìn-ín tí ń bá a lọ mọ́, láìfi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. ‘Mo ti sọ’ àti ‘mo ṣì wà pẹ̀lú yín’ jẹ́ àdánidá, wọ́n sì pa àkókò àti ìṣe tí ń bá a lọ nínú orísun mọ́.
