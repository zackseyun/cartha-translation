id: JHN.14.15
reference: John 14:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: yo
  text: “Bí ẹ bá nífẹ̀ẹ́ mi, ẹ ó pa àwọn àṣẹ mi mọ́.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ ó gbọ́ràn sí àwọn àṣẹ mi.” Ọ̀rọ̀ náà lè túmọ̀ sí pípa ohun kan mọ́, ṣíṣe àkíyèsí rẹ̀, ṣíṣọ́ ọ, tàbí gbígbọ́ràn sí i; “pa … mọ́” pa ìtumọ̀ rẹ̀ tó gbòòrò mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Bí
  rationale: Ó ṣe àmì gbólóhùn oní条件; ‘Bí’ ni ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ ‘if’ hàn láìsọ ọ́ di ohun tó máa ń ṣẹlẹ̀ ní gbogbo ìgbà.
- source_word: ἀγαπᾶτέ
  choice: ẹ bá nífẹ̀ẹ́
  rationale: Fọ́ọ̀mù yìí jẹ́ ẹni kejì ọ̀pọ̀ nínú subjunctive lẹ́yìn ἐάν. ‘Ẹ bá nífẹ̀ẹ́’ jẹ́ ìkọ́lé Yorùbá àdánidá fún gbólóhùn oní条件, ó sì pa ìtumọ̀ ìfẹ́ mọ́.
- source_word: με
  choice: mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbà iṣẹ́ náà ń tọ́ka sí Jésù; ‘mi’ ni ìtumọ̀ tààrà.
- source_word: ἐντολάς
  choice: àwọn àṣẹ
  rationale: ἐντολή lè túmọ̀ sí àṣẹ tàbí òfin tí a pàṣẹ. ‘Àwọn àṣẹ’ jẹ́ èdè Yorùbá tó ṣe kedere, tó ní ìwọ̀n, tí kò sì fi ìtumọ̀ míì kún un.
- source_word: τὰς ἐμὰς
  choice: mi
  rationale: Àkójọpọ̀ article àti possessive náà túmọ̀ sí ohun tí í ṣe ti Jésù; ìkọ́lé ‘àwọn àṣẹ mi’ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ ohun-ìní náà mọ́ láìdi ọ̀rọ̀ náà rú.
- source_word: τηρήσετε
  choice: ẹ ó pa … mọ́
  rationale: Future active indicative, ẹni kejì ọ̀pọ̀. ‘Ẹ ó pa … mọ́’ pa ọjọ́-ọ̀la girama náà mọ́, ó sì gbé ìtumọ̀ gbígbé àṣẹ mú, ṣíṣe àkíyèsí rẹ̀, àti ṣíṣọ́ ọ mọ́ ju ‘gbọ́ràn’ nìkan lọ.
theological_decisions:
- issue: Bóyá τηρήσετε yẹ kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí àṣẹ tààrà tàbí gẹ́gẹ́ bí ọ̀rọ̀ nípa ohun tí yóò ṣẹlẹ̀
  choice: 'Ọ̀rọ̀ ọjọ́-ọ̀la: “ẹ ó pa àwọn àṣẹ mi mọ́”'
  alternative: 'Ìtumọ̀ aláṣẹ: “ẹ pa àwọn àṣẹ mi mọ́”'
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ future indicative, kì í ṣe imperative. Ìtumọ̀ náà pa ìfarahàn pé ìfẹ́ sí Jésù ń yọrí sí pípa àwọn àṣẹ rẹ̀ mọ́, láìsọ ọ́ di àṣẹ tààrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣeé lóye ni a lò. “Ẹ” fi hàn pé àwọn ọmọ-ẹ̀yìn bí ẹgbẹ́ ni Jésù ń bá sọ̀rọ̀. Àmì ohùn ni a fi sí ibi tí ó yẹ.
