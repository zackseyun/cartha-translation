  source_fidelity: 'Ìtumọ̀ náà pa ìbáṣepọ̀ ìdánimọ̀ tó wà nínú Gíríìkì mọ́: ẹni tí ó ní àwọn àṣẹ Jesu tí ó sì ń pa wọ́n mọ́ ni ẹni tí ó fẹ́ràn un. Ó tún pa ìtẹ̀lé ìfẹ́ Baba, ìfẹ́ Jesu, àti ìfihàn ara Jesu mọ́. Ṣùgbọ́n “tí ó bá ní” lè fa ìtumọ̀ gbólóhùn ìdíwọ̀n (conditional) wọlé, níbi tí participle present substantival ti ń ṣe àpèjúwe ẹni aṣojú. A lè mú un sun mọ́ orísun pẹ̀lú “tí ó ní.”'
  naturalness: Yorùbá inú àkọsílẹ̀ jẹ́ adayeba lápapọ̀. “Ẹni tí ó ní … tí ó sì ń pa wọ́n mọ́” kedere, ó sì yẹ fún ìforúkọsílẹ̀ mímọ́ ti òde òní. Ní ìpín kejì, fífi “èmi” tún ṣáájú “yóò sì fi ara mi hàn án” kò pọndandan; a lè so àwọn iṣẹ́ náà pọ̀ láìpadanu ìtẹnumọ́ κἀγώ.
  terminology: '“Àwọn àṣẹ,” “pa wọ́n mọ́,” “fẹ́ràn,” àti “fi ara mi hàn” yẹ, wọ́n sì pa àtúnlò ọ̀rọ̀ ìfẹ́ àti ìtumọ̀ ἐμφανίσω mọ́. Àmì ìsàlẹ̀ tó wà lọwọlọwọ ní aṣiṣe pataki: “sọ ara mi di mímọ̀” túmọ̀ sí kí ẹni di mímọ́/ọba-mímọ́, kì í ṣe “make myself known/show myself.” A gbọdọ̀ rọ́pò rẹ̀ pẹ̀lú àṣàyàn tí ó túmọ̀ sí ìṣípayá tàbí jíjẹ́ kí ẹni mọ Jesu.'
