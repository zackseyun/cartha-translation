id: JHN.14.21
reference: John 14:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: yo
  text: Ẹni tí ó ní àwọn àṣẹ mi, tí ó sì ń pa wọ́n mọ́, òun ni ẹni tí ó fẹ́ràn mi. Ẹni tí ó sì fẹ́ràn mi, Baba mi yóò fẹ́ràn rẹ̀; èmi náà yóò fẹ́ràn rẹ̀, yóò sì fi ara mi hàn án.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èmi yóò sì jẹ́ kí ó mọ̀ mí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ara ẹni hàn tàbí jíjẹ́ kí a mọ ẹni; níbí ó ṣeé ṣe kí ó tẹnumọ́ ìṣípayá ara ẹni ní ti ìbáṣepọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ẹni tí ó bá ní
  rationale: Àpilẹ̀kọ pẹ̀lú participle náà ń tọ́ka sí ẹnikẹ́ni gẹ́gẹ́ bí aṣojú; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára gbogbogbò rẹ̀ mọ́.
- source_word: ἐντολάς
  choice: àwọn àṣẹ
  rationale: “Àṣẹ” ṣàfihàn ọlá-àṣẹ ọ̀rọ̀ Jesu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún òǹkàwé òde òní.
- source_word: τηρῶν
  choice: ń pa wọ́n mọ́
  rationale: “Pa … mọ́” ní Yorùbá lè túmọ̀ sí ṣíṣègbọràn sí àṣẹ àti dídúró ṣinṣin nínú rẹ̀; èyí pa ìtumọ̀ Johannine ti τηρέω mọ́ ju “gbọ́ràn” nìkan lọ.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: òun ni ẹni tí ó fẹ́ràn mi
  rationale: '“Òun ni” pa ìtẹnumọ́ ἐκεῖνος mọ́: ẹni tó ní àwọn àṣẹ náà tó sì ń pa wọ́n mọ́ ni gan-an ni ẹni tó fẹ́ràn Jesu.'
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: fẹ́ràn / yóò fẹ́ràn / yóò fẹ́ràn
  rationale: A tún gbòǹgbò “fẹ́ràn” ṣe bí Gíríìkì ṣe tún ἀγαπάω ṣe, kí ìsopọ̀ láàárín ìfẹ́ ẹni náà, ti Baba, àti ti Jesu má bàjẹ́.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: Ẹni tí ó bá sì fẹ́ràn mi
  rationale: “Sì” jẹ́ asopọ̀ pẹ̀lẹ́ tí ó bá δέ mu níbí, kì í ṣe àtakò líle.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: Baba mi yóò fẹ́ràn rẹ̀
  rationale: Yorùbá máa ń lo gbólóhùn olùṣe ní ti àdánidá ju passive lọ; ìtumọ̀ náà ṣì pa Baba mọ́ gẹ́gẹ́ bí olùfẹ́ràn, láìfi nǹkan kún un.
- source_word: κἀγὼ
  choice: èmi náà
  rationale: “Èmi náà” pa agbára àfikún καὶ ἐγώ mọ́, ó sì tẹnumọ́ ìṣe Jesu tó tẹ̀ lé ti Baba.
- source_word: ἐμφανίσω
  choice: fi ara mi hàn
  rationale: Gbólóhùn Yorùbá yìí lè túmọ̀ sí fífi ara ẹni hàn tàbí jíjẹ́ kí ẹni mìíràn mọ ẹni; ó pa ààyè ìtumọ̀ ἐμφανίζω mọ́ láìdín un kù sí ìfarahàn ojú lásán.
- source_word: ἐμαυτόν
  choice: ara mi
  rationale: “Ara mi” pa reflexive náà mọ́, ó sì fi hàn pé Jesu fúnra rẹ̀ ni yóò ṣe ìfihàn náà.
- source_word: αὐτὸν / αὐτῷ
  choice: rẹ̀ / án
  rationale: Àwọn arọ́pò-orúkọ Yorùbá kò ní àmì akọ tàbí abo; “rẹ̀” àti “án” tọ́ka sí ẹni kan náà ní ọ̀nà àdánidá láìyí singular aṣojú náà padà sí plural.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìfẹ́ àti pípa àṣẹ mọ́
  choice: 'A túmọ̀ syntax náà gẹ́gẹ́ bí ìdánimọ̀: ẹni tó ní àwọn àṣẹ Jesu tó sì ń pa wọ́n mọ́ ni ẹni tó fẹ́ràn rẹ̀.'
  alternative: Pípa àṣẹ mọ́ jẹ́ ẹ̀rí ìfẹ́, tàbí ó ń jèrè ìfẹ́ Ọlọ́run.
  rationale: Gíríìkì sọ ìdánimọ̀ tó lágbára, ṣùgbọ́n kò fi èdè okùnfà tàbí èrè kún un. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
- issue: Irú ìfihàn ara Jesu
  choice: “èmi yóò sì fi ara mi hàn án”
  alternative: “èmi yóò sì sọ ara mi di mímọ̀ fún un”
  rationale: “Fi ara mi hàn” pa àìdánilójú tó wà nínú ἐμφανίσω mọ́ láàárín ìfarahàn àti ìṣípayá ara ẹni; àlàyé ìsàlẹ̀ ṣàlàyé ààyè méjèèjì.
- issue: Masculine singular aṣojú nínú Gíríìkì
  choice: A lo “ẹni” àti arọ́pò-orúkọ singular Yorùbá tí kò ní gender.
  alternative: Lílo ọ̀rọ̀ akọ pàtó tàbí plural.
  rationale: Gíríìkì lo masculine singular pẹ̀lú agbára aṣojú. Yorùbá kò fi gender hàn nínú arọ́pò-orúkọ, nítorí náà “ẹni…rẹ̀…án” pa singular àti ìtumọ̀ gbogbogbò mọ́ láìfi akọ tàbí abo tí Yorùbá kò béèrè sí i.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “bá” fún agbára gbogbogbò ẹni aṣojú, “pa … mọ́” fún nuance ti ìgbọràn oníṣinṣin, àti àwọn àmì ohùn ní kíkún níbi tí wọ́n ti jẹ́ àdánidá. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tí ó kan.
