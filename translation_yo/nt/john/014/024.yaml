id: JHN.14.24
reference: John 14:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: yo
  text: Ẹni tí kò fẹ́ràn mi kì í pa àwọn ọ̀rọ̀ mi mọ́. Ọ̀rọ̀[a] tí ẹ ń gbọ́ kì í ṣe tèmi, ṣùgbọ́n ti Baba tí ó rán mi ni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìhìn tí ẹ ń gbọ́.”
    reason: λόγος lè túmọ̀ sí ọ̀rọ̀ tàbí ìhìn gẹ́gẹ́ bí odindi ẹ̀kọ́ kan.
  - marker: b
    text: Tàbí, “kì í ṣe tèmi, ṣùgbọ́n ó wá láti ọ̀dọ̀ Baba tí ó rán mi.”
    reason: Genitive τοῦ … πατρός lè fi jíjẹ́ ti Baba tàbí wíwá láti ọ̀dọ̀ Baba hàn nínú àyíká yìí.
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Ẹni tí kò nífẹ̀ẹ́ mi
  rationale: 'Ọ̀nà yìí mú ìtumọ̀ àpapọ̀ ti articular participle jáde ní èdè Yorùbá àdánidá: ẹni yòówù tí àìnífẹ̀ẹ́ sí Jésù ń ṣàpèjúwe rẹ̀.'
- source_word: τοὺς λόγους μου
  choice: àwọn ọ̀rọ̀ mi
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà λόγους mọ́, ó sì tọ́ka sí àwọn ohun tí Jésù sọ tàbí kọ́ni.
- source_word: τηρεῖ
  choice: pa … mọ́
  rationale: Nínú àyíká Johanu, gbólóhùn yìí lè ní ìtumọ̀ ṣíṣègbọ́ràn sí ọ̀rọ̀ àti dídúró ṣinṣin nínú rẹ̀; ‘pa … mọ́’ kò fi ìtumọ̀ náà mọ́ sí ṣíṣègbọ́ràn nìkan.
- source_word: ὁ λόγος
  choice: Ọ̀rọ̀
  rationale: Ẹyọ ọ̀rọ̀ λόγος tọ́ka sí ẹ̀kọ́ tàbí iṣẹ́ tí a gbọ́ gẹ́gẹ́ bí odindi kan. ‘Ọ̀rọ̀’ pa àsopọ̀ pẹ̀lú ìlò λόγος nínú Johanu mọ́, bí ó tilẹ̀ jẹ́ pé ‘ìhìn’ tún ṣeé ṣe.
- source_word: ὃν ἀκούετε
  choice: tí ẹ ń gbọ́
  rationale: Ó tú present ἀκούετε sí Yorùbá àdánidá láì fi ‘láti ọ̀dọ̀ mi’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: kì í ṣe tèmi
  rationale: Èyí ni ìtumọ̀ tààrà ti predicate possessive ἐμός, ó sì pa ìfìwéra tí ó tẹ̀ lé mọ́.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: ṣùgbọ́n ti Baba tí ó rán mi ni
  rationale: Genitive náà ni a fi ‘ti Baba’ hàn, nígbà tí ‘tí ó rán mi’ ń ṣàlàyé Baba. Ìṣètò yìí bófin mu, ó sì jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ọ̀rọ̀ Jésù àti ọ̀rọ̀ Baba
  choice: kì í ṣe tèmi, ṣùgbọ́n ti Baba tí ó rán mi ni
  alternative: kì í ṣe tèmi, ṣùgbọ́n ó wá láti ọ̀dọ̀ Baba tí ó rán mi
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìyàtọ̀ àwọn ẹni àti ìṣọ̀kan ọ̀rọ̀ wọn mọ́, láì tú ìforígbárí inú ọ̀rọ̀ náà sílẹ̀ tàbí fi èrò ẹ̀kọ́ ìsìn kan kún un. Ó fi hàn pé Baba ni orísun ọ̀rọ̀ náà nínú iṣẹ́ rírán Ọmọ, kì í ṣe pé Jésù ń sẹ́ àṣẹ tàbí ọ̀rọ̀ tirẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. ‘Kì í …’ ń sọ ìwà tí ó máa ń ṣẹlẹ̀ tàbí ohun tí ó jẹ́ àbùdá ẹni, ní ìbámu pẹ̀lú present participle àti present verb Gíríìkì.
