  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
translation:
  language: yo
  text: Ibi tí mo ń lọ, ẹ sì mọ ọ̀nà náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà á pé, “Ẹ sì mọ ibi tí mo ń lọ, ẹ sì mọ ọ̀nà náà.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ Yorùbá tó ṣe déédéé fún ìtẹ̀síwájú ọ̀rọ̀, láìfi ìtẹnumọ́ tuntun kún un.
- source_word: ὅπου
  choice: ibi tí
  rationale: Ó túmọ̀ sí ibi tàbí ààyè tí ohun kan ti ń ṣẹlẹ̀; “ibi tí” jẹ́ ọ̀nà àdánidá láti dá gbólóhùn ìbátan bẹ̀rẹ̀ ní Yorùbá.
- source_word: ἐγὼ
  choice: mo
  rationale: Arọ́pò-orúkọ ẹni kìíní ni; Yorùbá fi “mo” hàn gẹ́gẹ́ bí olùṣe ọ̀rọ̀-ìṣe náà.
- source_word: ὑπάγω
  choice: ń lọ
  rationale: Ó pa ìtumọ̀ ìlọ tí ó ń lọ lọ́wọ́ tàbí tí ó sún mọ́lé mọ́, láìfi ìtumọ̀ ‘ń fi wọ́n sílẹ̀’ kún ọ̀rọ̀ náà.
- source_word: οἴδατε
  choice: ẹ mọ
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí pípé, ìtumọ̀ rẹ̀ jẹ́ ti àsìkò ìsinsìnyí; “ẹ mọ” sì bá a mu.
- source_word: τὴν ὁδόν
  choice: ọ̀nà náà
  rationale: ὁδός lè jẹ́ ojú ọ̀nà, ipa ọ̀nà, tàbí ọ̀nà ní ìtumọ̀ fífẹ̀. “Ọ̀nà náà” dá ìtumọ̀ rẹ̀ dúró, ó sì fi pàtó-orúkọ inú èdè Gíríìkì hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ètò àwọn gbólóhùn àti ìbátan ‘ibi tí mo ń lọ’ sí ‘ọ̀nà náà’
  choice: Ibi tí mo ń lọ, ẹ sì mọ ọ̀nà náà.
  alternative: Ẹ sì mọ ọ̀nà sí ibi tí mo ń lọ.
  rationale: Yíyí ‘ibi tí mo ń lọ’ sí iwájú tẹ̀ lé ètò àti ìtẹnumọ́ Gíríìkì, ó sì jẹ́ Yorùbá àdánidá. A kò fi “sí” kún un, nítorí ọ̀rọ̀-orísun kò sọ ìbátan náà nípasẹ̀ àsopọ̀ bẹ́ẹ̀; èyí pa àìṣe-kedere díẹ̀ tó wà nínú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ẹ” fún ọ̀pọ̀ ẹni tí Jésù ń bá sọ̀rọ̀; gbogbo àmì ohùn ni a fi sí ibi tí ó bá yẹ.
