id: JHN.14.7
reference: John 14:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: yo
  text: Bí ẹ bá ti mọ̀ mí, ẹ ì bá ti mọ̀ Baba mi pẹ̀lú. Láti ìsinsin yìí lọ, ẹ mọ̀ ọ́, ẹ sì ti rí i.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: ti mọ / mọ̀
  rationale: 'A lo ọ̀rọ̀-ìṣe “mọ̀” fún ìmọ̀ ẹni nípa ìbáṣepọ̀ àti ìdánimọ̀, ní fífi ìyàtọ̀ àkókò inú Gíríìkì hàn: “ti mọ” nínú gbólóhùn àkọ́kọ́ àti “mọ̀” fún ohun tó jẹ́ òtítọ́ láti ìsinsin yìí lọ.'
- source_word: ᾔδειτε
  choice: ẹ bá ti mọ
  rationale: Ìtumọ̀ yìí mú ìṣètò ọ̀rọ̀ àìṣẹlẹ̀ ti εἰ … ἄν àti ìrísí àkókò tó ti kọjá hàn ní Yorùbá tó ṣe déédéé.
- source_word: ἀπ’ ἄρτι
  choice: Láti ìsinsin yìí lọ
  rationale: Ó túmọ̀ ìbẹ̀rẹ̀ láti àkókò yìí síwájú ní èdè Yorùbá adayeba.
- source_word: ἑωράκατε
  choice: ẹ sì ti rí i
  rationale: “Ti rí” fi perfect Greek hàn gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà.
- source_word: πατέρα μου
  choice: Baba mi
  rationale: “Baba mi” jẹ́ ìtumọ̀ tààrà, adayeba; lẹ́tà ńlá fi hàn pé ó jẹ́ orúkọ oyè fún Ọlọ́run láìfi ẹ̀kọ́ ẹ̀sìn míì kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín mímọ Jesu, mímọ Baba, àti rírí Baba
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí Jesu ṣe so mímọ ara rẹ̀ pọ̀ mọ́ mímọ Baba, tó sì sọ pé àwọn ọmọ-ẹ̀yìn ti rí Baba.
  alternative: Ṣàlàyé “rí i” sí “rí i nínú mi” tàbí sọ ọ́ di mímọ̀ nípa ìṣọ̀kan ìwà wọn.
  rationale: Orísun kò ní “nínú mi” nínú ẹsẹ yìí, nítorí náà a kò ṣàfikún àlàyé ẹ̀kọ́ ẹ̀sìn tí yóò dín agbára tàbí ìpèníjà ọ̀rọ̀ náà kù.
- issue: Agbára ìtẹnumọ́ nínú γινώσκετε
  choice: “ẹ mọ̀ ọ́”
  alternative: “ẹ mọ̀ ọ́ dájúdájú”
  rationale: Gíríìkì kò ní ọ̀rọ̀ àfikún fún “dájúdájú”; ìtẹnumọ́ Gẹ̀ẹ́sì “do know” jẹ́ ti ìlò èdè Gẹ̀ẹ́sì, Yorùbá sì sọ ọ́ ní kedere láìsí àfikún.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ara ọ̀rọ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún òǹkàwé òde òní. “Ká ní … ẹ bá ti …” jẹ́ ọ̀nà adayeba láti fi ipò àìṣẹlẹ̀ ti ohun tó ti kọjá hàn.
