  source_fidelity: 'Ìtumọ̀ náà tọ́jú àwọn èrò pàtàkì nínú Gíríìkì: Júdásì tí kì í ṣe Iskariotu, ìpè náà “Olúwa,” ìbéèrè τί γέγονεν, ète ọjọ́ iwájú nínú μέλλεις, ìfihàn ara ẹni, àti κόσμος gẹ́gẹ́ bí “ayé.” Síbẹ̀, ìsopọ̀ ìkẹyìn “tí kì í sì í ṣe fún ayé” kò fi ìyàtọ̀ καὶ οὐχί hàn ní kedere, ó sì lè dà bí ìtẹ̀síwájú ìdánimọ̀ Júdásì. “ṣùgbọ́n kì í ṣe fún ayé” dáa jù.'
