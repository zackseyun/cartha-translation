base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: yo
  text: Júdásì (kì í ṣe Iskariotu) sọ fún un pé, “Olúwa, kí ló ṣẹlẹ̀ tí o fi fẹ́ fi ara rẹ hàn[a][b] fún wa, ṣùgbọ́n kì í ṣe fún ayé?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́ kí a mọ̀ ọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fihàn ara rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ní Gíríìkì jẹ́ ìsinsìnyí ìtàn; “sọ” jẹ́ ọ̀nà àdánidá láti sọ ọ́ nínú ìtàn Yorùbá.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Júdásì (kì í ṣe Iskariotu)
  rationale: Àlàyé inú àkámọ́ yà Júdásì yìí sọ́tọ̀ kúrò lọ́dọ̀ Júdásì Iskariotu, láì fi ìdánimọ̀ mìíràn kún un.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” jẹ́ akọ́lé ọ̀wọ̀ tí ó sì pa ìwúwo ẹ̀kọ́ nípa ẹni tí Jésù jẹ́ mọ́.
- source_word: τί γέγονεν ὅτι
  choice: kí ló ṣẹlẹ̀ tí
  rationale: Ó fi ìbéèrè hàn nípa ohun tí ó ti ṣẹlẹ̀, tí ó sì yọrí sí ète tí Jésù sọ; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Ó pa àwọn tí ìfihàn náà ń tọ̀ sí mọ́ gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ, láì ṣàlàyé ju orísun lọ.
- source_word: μέλλεις
  choice: o fẹ́
  rationale: Nínú àyíká yìí μέλλω ń tọ́ka sí ète ohun tí yóò ṣẹlẹ̀; “fẹ́” sọ ète náà ní Yorùbá àdánidá láì mú kí ó dà bí ohun tí yóò ṣẹlẹ̀ lójú ẹsẹ̀ dandan.
- source_word: ἐμφανίζειν σεαυτόν
  choice: fi ara rẹ hàn
  rationale: Gbólóhùn náà pa ipa arọ́pò-orúkọ ara-ẹni mọ́, ó sì lè túmọ̀ sí fífi ara ẹni hàn tàbí jíjẹ́ kí a mọ ẹni náà.
- source_word: κόσμῳ
  choice: ayé
  rationale: “Ayé” pa ọ̀rọ̀ pàtàkì ti Jòhánù mọ́, láì pinnu bóyá gbogbo aráyé tàbí ètò ayé tí kò gba Ọlọ́run gbọ́ ni ó túmọ̀ sí níbí.
theological_decisions:
- issue: Ìtumọ̀ κόσμος nínú Jòhánù
  choice: ayé
  alternative: àwọn ènìyàn ayé; ètò ayé aláìgbàgbọ́
  rationale: Ẹsẹ̀ yìí kò fipá mú wa láti yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí. “Ayé” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ àti àìdánilójú tó wà nínú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. Àwọn àmì àlàyé méjèèjì ni a so mọ́ “fi ara rẹ hàn,” nítorí àwọn àlàyé náà jẹ́ àṣàyàn ìtumọ̀ fún ἐμφανίζειν σεαυτόν.
