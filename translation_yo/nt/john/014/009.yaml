id: JHN.14.9
reference: John 14:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: yo
  text: Jésù wí fún un pé, “Ṣé mo ti wà pẹ̀lú yín fún ìgbà pípẹ́ báyìí[a], síbẹ̀ o kò tíì mọ̀ mí, Fílípì? Ẹni tí ó ti rí mi ti rí Baba. Báwo ni ìwọ ṣe lè wí pé, ‘Fi Baba hàn wá’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìgbà pípẹ́ tó bẹ́ẹ̀.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún Τοσούτῳ χρόνῳ, tó tún ń tẹnumọ́ bí àkókò náà ṣe gùn tó.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: fún ìgbà pípẹ́ báyìí
  rationale: Gbólóhùn yìí fi bí àkókò náà ṣe gùn tó hàn, ó sì pa agbára ìbéèrè tí Jésù fi ń bá Fílípì wí mọ́ ní Yorùbá àdánidá.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: mo ti wà pẹ̀lú yín
  rationale: Ìsọ̀rí ‘ti wà’ fi hàn pé wíwà Jésù pẹ̀lú wọn ti ń bá a lọ títí dé àkókò ọ̀rọ̀ náà; ‘yín’ tún pa ọ̀pọ̀ ènìyàn inú ὑμῶν mọ́.
- source_word: οὐκ ἔγνωκάς με
  choice: síbẹ̀ o kò tíì mọ̀ mí
  rationale: ‘Kò tíì mọ̀ mí’ fi ipò tí perfect náà ń tọ́ka sí hàn, ‘síbẹ̀’ sì mú ìbáwí inú ọ̀rọ̀ náà jáde láì yí ìtumọ̀ rẹ̀ padà.
- source_word: Φίλιππε
  choice: Fílípì
  rationale: Èyí ni ìkọ̀wé orúkọ náà ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Ẹni tí ó ti rí mi
  rationale: ‘Ẹni tí’ ń tú participle olórúkọ náà jáde ní Yorùbá àdánidá, ‘ti rí’ sì pa ìṣe perfect náà mọ́.
- source_word: ἑώρακεν τὸν πατέρα
  choice: ti rí Baba
  rationale: Yorùbá kì í nílò article kan níbi yìí; ‘Baba’ pa ọ̀rọ̀ Johanu àti ìtẹnumọ́ gbólóhùn Jésù mọ́ láì fi ‘Baba mi’ kún un.
- source_word: πῶς σὺ λέγεις
  choice: Báwo ni ìwọ ṣe lè wí
  rationale: Ọ̀nà yìí mú ìyàlẹ́nu àti àtakò inú ìbéèrè rhetorical náà hàn; ‘ìwọ’ pa ìtẹnumọ́ σὺ mọ́.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Fi Baba hàn wá
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àṣẹ pé kí a fi ẹnì kan hàn fún àwọn míì, ó sì pa àṣẹ tààrà náà mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ tó wà láàárín rírí Jésù àti rírí Baba
  choice: Ẹni tí ó ti rí mi ti rí Baba
  alternative: Ẹni tí ó ti rí mi ti rí bí Baba ṣe rí
  rationale: A pa gbólóhùn líle ti Kristi mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́. A kò sọ ọ́ di àfiwé lásán, bẹ́ẹ̀ ni a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A fi àmì ohùn kún ọ̀rọ̀ ní kíkún níbi tó bá yẹ, a sì lo ‘Ṣé’ láti mú ìbéèrè ìbáwí náà dun bí Yorùbá àdánidá.
