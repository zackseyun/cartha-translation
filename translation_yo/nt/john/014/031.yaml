id: JHN.14.31
reference: John 14:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: yo
  text: Ṣùgbọ́n kí ayé lè mọ̀ pé mo nífẹ̀ẹ́ Baba, mo ń ṣe gan-an gẹ́gẹ́ bí Baba ti pàṣẹ fún mi.[a] Ẹ dìde; ẹ jẹ́ ká lọ kúrò níhìn-ín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Bí Baba ti pàṣẹ fún mi, bẹ́ẹ̀ ni mo ṣe ń ṣe.”'
    reason: Àṣàyàn yìí pa ìṣètò ìbámu καθώς ... οὕτως (“bí ... bẹ́ẹ̀”) mọ́ ní gbangba sí i.
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó pa agbára ìtakora mọ́, ó sì so ọ̀rọ̀ yìí mọ́ ohun tí Jésù sọ ṣáájú.
- source_word: ἵνα γνῷ
  choice: kí ... lè mọ̀
  rationale: Ìṣọ̀kan yìí fi ète hàn ní Yorùbá àdánidá, gẹ́gẹ́ bí ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́ṣe ṣe rí.
- source_word: ὁ κόσμος
  choice: ayé
  rationale: “Ayé” pa ọ̀rọ̀ pàtàkì tí Jòhánù máa ń lò mọ́, ó sì lè tọ́ka sí aráyé lápapọ̀ nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἀγαπῶ
  choice: mo nífẹ̀ẹ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́ tí ó dúró ṣinṣin ní àsìkò ìsinsìnyí.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: A kò fi arọ́pò-orúkọ ohun-ìní kún un, nítorí Giriki sọ “Baba,” kì í ṣe “Baba mi.” Lílò lẹ́tà ńlá fi hàn pé oyè ìbátan ni.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: mo ń ṣe gan-an gẹ́gẹ́ bí Baba ti pàṣẹ fún mi
  rationale: “Gẹ́gẹ́ bí” àti “gan-an” fi ìbámu pípé ti καθώς ... οὕτως hàn, “pàṣẹ” sì pa agbára ἐντέλλομαι mọ́ láì rọ̀ ọ́ sí “kọ́ mi” tàbí “tọ́ mi.”
- source_word: Ἐγείρεσθε
  choice: Ẹ dìde
  rationale: Àṣẹ náà jẹ́ ọ̀pọ̀ ènìyàn; “Ẹ dìde” ṣe kedere, ó sì yẹ fún èdè ọlọ́lá ti òde òní.
- source_word: ἄγωμεν
  choice: ẹ ká lọ
  rationale: “Ká lọ” jẹ́ ọ̀nà Yorùbá àdánidá fún abẹ́ṣe ìṣírí ẹni-kìíní ọ̀pọ̀, “ẹ” sì ń bá àṣẹ ọ̀pọ̀ ẹni tí ó ṣáájú mu.
- source_word: ἐντεῦθεν
  choice: kúrò níhìn-ín
  rationale: Ó fi ìlọkúrò ní ibi tí wọ́n wà hàn ní tààràtà.
theological_decisions:
- issue: Oyè ìbátan πατήρ nínú ẹ̀kọ́ Jòhánù nípa Kristi
  choice: Baba
  alternative: Baba mi
  rationale: Ìtumọ̀ náà kò fi ohun-ìní tí kò sí nínú Giriki kún un; ó pa ọ̀nà tí ẹsẹ náà gbà ṣàfihàn ìbátan Ọmọ sí Baba mọ́.
- issue: Agbára ἐντέλλομαι nínú àjọṣe Baba àti Ọmọ
  choice: pàṣẹ
  alternative: tọ́ mi sọ́nà
  rationale: Ọ̀rọ̀ Giriki túmọ̀ sí fífi àṣẹ tàbí ojúṣe léni lọ́wọ́. A kò rọ agbára rẹ̀ nítorí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan; ẹsẹ náà fúnra rẹ̀ tẹnu mọ́ ìfẹ́ àti ìgbọràn Ọmọ.
- issue: Ìbámu καθώς ... οὕτως
  choice: mo ń ṣe gan-an gẹ́gẹ́ bí ...
  alternative: bí ... bẹ́ẹ̀ ni mo ṣe ń ṣe
  rationale: Àwọn méjèèjì pa ìbámu tó wà nínú Giriki mọ́. Àkọ́kọ́ dùn mọ́ Yorùbá òde òní, èkejì sì fara mọ́ ètò ọ̀rọ̀ Giriki jù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. “Ẹ ká lọ” jẹ́ ìṣírí àpapọ̀ tó bá “Ẹ dìde” mu, kò sì di ọ̀rọ̀ náà mọ́ èdè ìjọ kan pàtó.
