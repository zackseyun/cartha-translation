  to: Tòmásì sọ fún un pé, “Olúwa, a kò mọ ibi tí ìwọ ń lọ. Báwo ni a ṣe lè mọ ọ̀nà náà?”[a]
  rationale: A tún akọtọ́ orúkọ náà ṣe sí ‘Tòmásì’ gẹ́gẹ́ bí ìlànà Yorùbá. A yọ àṣàyàn àlàyé ‘lágbára láti mọ,’ nítorí kò jẹ́ Yorùbá adayeba fún δύναμαι, a sì fi àlàyé tó jẹ́ òtítọ́ nípa àtúnlò ọ̀rọ̀ Gíríìkì fún ‘mọ’ sílẹ̀. Àwọn ìyókù ni a pa mọ́ nítorí wọ́n jẹ́ olóòótọ́ sí orísun náà, wọ́n sì jẹ́ adayeba.
