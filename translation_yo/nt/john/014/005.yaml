  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìbéèrè Tọ́másì, ìtumọ̀ Κύριε gẹ́gẹ́ bí “Olúwa,” ìlọ Jesu, agbára nínú δυνάμεθα, àti àtúnlò ‘mọ’ mọ́. ‘Ọ̀nà náà’ jẹ́ ìtumọ̀ ti ẹ̀dá fún τὴν ὁδόν, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.'
