  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: yo
  text: Tòmásì sọ fún un pé, “Olúwa, a kò mọ ibi tí ìwọ ń lọ. Báwo ni a ṣe lè mọ ọ̀nà náà?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀rọ̀ Gíríìkì kan náà fún “mọ” ni a lò lẹ́ẹ̀mejì nínú ẹsẹ yìí: nínú “a kò mọ” àti nínú “mọ ọ̀nà náà.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Tọ́másì sọ fún un pé
  rationale: A lo ìgbà àtijọ́ nínú ìtàn Yorùbá fún historical present λέγει; ‘sọ fún un’ túmọ̀ αὐτῷ lọ́nà àdánidá.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ ọ̀wọ̀ àti ìdánimọ̀ ọmọ-ẹ̀yìn mọ́ láì sọ ọ́ di ìkíni ọ̀wọ̀ lásán.
- source_word: οὐκ οἴδαμεν
  choice: a kò mọ
  rationale: ‘Mọ’ ni ìbámu tààrà pẹ̀lú οἶδα, ó sì jẹ́ kí àtúnlò ọ̀rọ̀ náà hàn nínú ìbéèrè tó tẹ̀ lé e.
- source_word: ποῦ ὑπάγεις
  choice: ibi tí ìwọ ń lọ
  rationale: Èyí jẹ́ Yorùbá àdánidá, ó sì pa ìjinlẹ̀ ọ̀rọ̀ inú Jòhánù mọ́ láì ṣàlàyé ibi tí Jésù ń lọ ṣáájú àsìkò.
- source_word: πῶς δυνάμεθα
  choice: Báwo ni a ṣe lè
  rationale: Gbólóhùn yìí sọ ìbéèrè nípa agbára tàbí ṣíṣeéṣe lọ́nà Yorùbá tó wọ́pọ̀.
- source_word: τὴν ὁδὸν
  choice: ọ̀nà náà
  rationale: ‘Ọ̀nà’ lè túmọ̀ sí ipa tàbí ọ̀nà ìrìn, ó sì pa ìsopọ̀ pẹ̀lú ẹsẹ tó tẹ̀ lé e mọ́.
- source_word: εἰδέναι
  choice: mọ
  rationale: Àtúnlò ‘mọ’ ṣe àfihàn pé fọ́ọ̀mù ọ̀rọ̀-ìṣe kan náà ni Gíríìkì lò nínú οἴδαμεν àti εἰδέναι.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lè wà nínú ὑπάγεις ní Jòhánù
  choice: ibi tí ìwọ ń lọ
  alternative: ibi tí ìwọ ń lọ kúrò sí / ibi tí ìwọ ń padà sí
  rationale: Ọ̀rọ̀ Tọ́másì fi àìmọ̀ ibi tí Jésù ń lọ hàn; ìtumọ̀ aláìṣàlàyé yìí pa ìfẹ̀dọ̀tí ìtàn àti ìjinlẹ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́ láì fi ìtumọ̀ ẹsẹ tó tẹ̀ lé e sínú ẹsẹ yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi ‘ìwọ’ hàn nítorí pé αὐτῷ àti ὑπάγεις tọ́ka sí Jésù, ṣùgbọ́n a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
