id: JHN.14.17
reference: John 14:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: yo
  text: Ẹ̀mí òtítọ́[a], ẹni tí ayé kò lè gbà, nítorí pé ayé kò rí i, bẹ́ẹ̀ ni kò mọ̀ ọ́. Ṣùgbọ́n ẹ̀yin mọ̀ ọ́, nítorí pé ó ń gbé pẹ̀lú yín, yóò sì wà nínú yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “èyí tí ayé kò lè gbà … nítorí pé ayé kò rí i, bẹ́ẹ̀ ni kò mọ̀ ọ́.” Ọ̀rọ̀ Gíríìkì fún “Ẹ̀mí” (πνεῦμα) jẹ́ ọ̀rọ̀ neuter nínú gírámà Gíríìkì, bí ó tilẹ̀ jẹ́ pé ẹni ni ó ń tọ́ka sí nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú “nínú yín” sí “láàárín yín.” Arọ́pò-orúkọ Gíríìkì náà jẹ́ ọ̀pọ̀, nítorí náà ó lè ní ìtumọ̀ àjọṣepọ̀; síbẹ̀, “nínú yín” ló pa ìyàtọ̀ rẹ̀ sí “pẹ̀lú yín” mọ́ dáadáa jù.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Ẹ̀mí òtítọ́
  rationale: Ó pa ìtumọ̀ àti ìṣètò ọ̀rọ̀ Gíríìkì ‘Ẹ̀mí ti òtítọ́’ mọ́ ní ọ̀nà Yorùbá tó ṣe déédéé, ó sì tọ́ka sí Ẹ̀mí Mímọ́ nínú àyíká ọ̀rọ̀ náà.
- source_word: κόσμος
  choice: ayé
  rationale: ‘Ayé’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún κόσμος, ó sì pa ìbú ìtumọ̀ ọ̀rọ̀ Johanu mọ́ láì fi kún un pé gbogbo ènìyàn tàbí ètò ayé ọlọ̀tẹ̀ nìkan ni.
- source_word: οὐ δύναται λαβεῖν
  choice: kò lè gbà
  rationale: ‘Kò lè’ pa agbára-modal δύναται mọ́, ‘gbà’ sì jẹ́ ìtumọ̀ àdánidá fún λαβεῖν nínú àyíká yìí.
- source_word: θεωρεῖ
  choice: rí
  rationale: ‘Rí’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, tí kò sì fi ìtumọ̀ ‘lóye’ tàbí ‘fiyèsí’ tí kò dájú kún ọ̀rọ̀ Gíríìkì.
- source_word: γινώσκει / γινώσκετε
  choice: mọ̀ / mọ̀
  rationale: Lílo ọ̀rọ̀ kan náà pa ìbáṣepọ̀ tó wà láàárín àìmọ̀ ayé àti ìmọ̀ àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ jáde ní Gíríìkì ní ìtẹnumọ́; ‘ẹ̀yin’ fi ìtẹnumọ́ àti ọ̀pọ̀ ènìyàn hàn ní Yorùbá.
- source_word: παρ’ ὑμῖν μένει
  choice: ó ń gbé pẹ̀lú yín
  rationale: ‘Ń gbé’ sọ ìwà títẹ̀síwájú μένει ní èdè àdánidá, ‘pẹ̀lú yín’ sì pa ìtumọ̀ παρά mọ́.
- source_word: ἐν ὑμῖν ἔσται
  choice: yóò wà nínú yín
  rationale: ‘Nínú yín’ ni ìtumọ̀ tó sún mọ́ ἐν ὑμῖν jù, ó sì pa ìyàtọ̀ rẹ̀ sí ‘pẹ̀lú yín’ mọ́; bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ náà jẹ́ ọ̀pọ̀, a kò yanjú àìdánilójú náà ní ìkọ̀kọ̀.
theological_decisions:
- issue: Ìtọ́ka sí Ẹ̀mí gẹ́gẹ́ bí ẹni, bí ó tilẹ̀ jẹ́ pé πνεῦμα jẹ́ ọ̀rọ̀ akọ-nlá-àìlẹ́mìí ní gírámà Gíríìkì
  choice: Lo ‘ẹni’ àti àwọn arọ́pò-orúkọ tó tọ́ka sí ẹni fún Ẹ̀mí
  alternative: Lo ‘èyí’ gẹ́gẹ́ bí ìtọ́ka tí kò fi jíjẹ́ ẹni hàn
  rationale: Àyíká ọ̀rọ̀ náà ń fi Ẹ̀mí hàn gẹ́gẹ́ bí olùṣe tó jẹ́ ẹni. Èyí kò tako gírámà Gíríìkì, nítorí akọ gírámà ọ̀rọ̀ kì í pinnu irú ẹni tàbí ohun tí ọ̀rọ̀ náà ń tọ́ka sí.
- issue: Ìbáṣepọ̀ Ẹ̀mí pẹ̀lú àwọn onígbàgbọ́ nínú παρά àti ἐν
  choice: Pa méjèèjì mọ́ gẹ́gẹ́ bí ‘pẹ̀lú yín’ àti ‘nínú yín’
  alternative: Tú ἐν ὑμῖν sí ‘láàárín yín’
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìyàtọ̀ àwọn gbólóhùn méjèèjì mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ àjọṣepọ̀ tó ṣeé ṣe hàn láì fipá yanjú rẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí òǹkàwé lasán lè lóye ni a lò. A lo àmì ohùn ní kíkún níbi tó bá bá ìlànà Yorùbá mu. ‘Ó ń gbé’ jẹ́ àdánidá ju ‘ó dúró’ lọ ní àyíká yìí, nígbà tí ‘yóò wà nínú yín’ pa ìlọsíwájú láti wíwà pẹ̀lú wọn sí wíwà nínú wọn mọ́.
