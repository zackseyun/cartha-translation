language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí ọkàn yín dààmú. Ẹ gba Ọlọ́run gbọ́[a][b]; ẹ sì gba mí náà gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Ẹ̀yin gba Ọlọ́run gbọ́; ẹ gba mí náà gbọ́ pẹ̀lú.” Ìrísí ọ̀rọ̀ Gíríìkì πιστεύετε lè jẹ́ gbólóhùn ìmúdájú (“ẹ̀yin gba ... gbọ́”) tàbí àṣẹ (“ẹ gba ... gbọ́”).
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Ẹ gbẹ́kẹ̀ lé Ọlọ́run; ẹ sì gbẹ́kẹ̀ lé mi náà.” Ọ̀rọ̀-ìṣe náà lè ní ìtumọ̀ fífi ara ẹni lé ẹnì kan lọ́wọ́, kì í ṣe gbígba ohun kan gbọ́ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: Ẹ má ṣe jẹ́ kí ... dààmú
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ ìkọ̀, ó sì bá ẹni kẹta ẹyọ kan mu ní Gíríìkì. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa àwòrán ‘kí ọkàn má ṣe dààmú’ mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ìbẹ̀rù tàbí àníyàn nìkan.
- source_word: ὑμῶν ἡ καρδία
  choice: ọkàn yín
  rationale: ‘Ọkàn’ jẹ́ ẹyọ kan, nígbà tí ‘yín’ ń tọ́ka sí gbogbo àwọn ọmọ-ẹ̀yìn. Èyí pa ẹyọ àkójọpọ̀ inú Gíríìkì mọ́, ó sì jẹ́ ọ̀nà tí Yorùbá ń gbà sọ ọ́ lọ́nà àdánidá.
- source_word: πιστεύετε
  choice: Ẹ gba ... gbọ́
  rationale: ‘Gba ... gbọ́’ lè túmọ̀ sí gbígbàgbọ́ àti fífi ara ẹni lé ẹnì kan lọ́wọ́ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń béèrè. A lo àṣẹ nínú ẹsẹ̀ pàtàkì, ṣùgbọ́n a pa àìdánilójú ìrísí ọ̀rọ̀ Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: εἰς τὸν θεόν
  choice: Ọlọ́run
  rationale: Lẹ́yìn ‘gba ... gbọ́,’ Yorùbá máa ń fi ẹni tí a gbà gbọ́ ṣe ohun tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí ní tààràtà; kò pọn dandan láti tú εἰς lọ́tọ̀ pẹ̀lú ‘nínú,’ èyí tí kò ní dùn bí Yorùbá àdánidá níbí.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: ẹ sì gba mí náà gbọ́
  rationale: ‘Sì’ àti ‘náà’ mú agbára àfikún καί jáde, ìtúnlò ‘gba ... gbọ́’ sì pa ìbáradọ́gba àwọn gbólóhùn méjèèjì mọ́. ‘Mí’ jẹ́ ọ̀nà Yorùbá àdánidá fún ἐμέ nínú ipò yìí.
theological_decisions:
- issue: Bóyá πιστεύετε méjèèjì jẹ́ gbólóhùn ìmúdájú tàbí àṣẹ
  choice: 'A tú méjèèjì sí àṣẹ: ‘Ẹ gba Ọlọ́run gbọ́; ẹ sì gba mí náà gbọ́.’'
  alternative: '‘Ẹ gba Ọlọ́run gbọ́; ẹ sì gbọ́dọ̀ gba mí náà gbọ́’ is not the indicative alternative. Genuine alternative: ‘Ẹ̀yin gba Ọlọ́run gbọ́; ẹ gba mí náà gbọ́ pẹ̀lú.’'
  rationale: Ìrísí πιστεύετε lè jẹ́ ìmúdájú tàbí àṣẹ fún ẹni kejì ọ̀pọ̀, nítorí ìkọ̀wé wọn jọ ara wọn. Àṣẹ ìkọ̀ tí ó ṣáájú àti ọ̀rọ̀ ìtùnú Jésù mú kí àṣẹ méjèèjì bá àyíká mu, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ìtumọ̀ ìmúdájú fún àkọ́kọ́ ṣeé ṣe.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó sì yé òǹkàwé gbogbogbò. Àmì ohùn wà níbi tí ó bá yẹ. ‘Ọkàn yín’ pa ẹyọ àkójọpọ̀ orísun mọ́, ‘ẹ ...’ sì fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀.
