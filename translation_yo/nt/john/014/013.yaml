id: JHN.14.13
reference: John 14:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: yo
  text: Ohunkóhun tí ẹ bá sì béèrè ní orúkọ mi, èyí ni èmi yóò ṣe, kí a lè fi ògo fún Baba nínú Ọmọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Ọmọ.” Gíríìkì náà ní, “nínú Ọmọ”; èyí lè tọ́ka sí agbègbè tàbí ọ̀nà tí a fi ń fi ògo fún Baba.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: ohunkóhun tí ẹ bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ohun tí a kò dá pàtó àti ìgbòòrò hàn. ‘Ohunkóhun tí ẹ bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ yẹn mọ́.
- source_word: αἰτήσητε
  choice: ẹ béèrè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti béèrè tàbí tọrọ ohun kan; ‘béèrè’ bá àyíká ọ̀rọ̀ àdúrà mu, ó sì pa nọ́ńbà ọ̀pọ̀ ẹni kejì mọ́ nípasẹ̀ ‘ẹ’.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Èyí pa ọ̀rọ̀ Jòhánù náà mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ‘nípasẹ̀ àṣẹ mi’ nìkan; ó lè ní ìtumọ̀ ìṣojú, àṣẹ àti ìṣọ̀kan pẹ̀lú Jésù.
- source_word: τοῦτο
  choice: èyí ni
  rationale: A pa ọ̀rọ̀ atọ́ka tí ó ṣe kedere nínú Gíríìkì mọ́, a sì lo ìtẹnumọ́ Yorùbá àdánidá.
- source_word: ποιήσω
  choice: èmi yóò ṣe
  rationale: ‘Ṣe’ pa ìtumọ̀ gbígbòòrò ποιέω mọ́, ‘èmi’ sì mú ìtẹnumọ́ ọ̀rọ̀ náà jáde.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Àkójọpọ̀ yìí fi ète hàn ní Yorùbá àdánidá, gẹ́gẹ́ bí ἵνα ṣe ń ṣe nínú ẹsẹ náà.
- source_word: δοξασθῇ
  choice: gba ògo
  rationale: ‘Kí Baba lè gba ògo’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìtumọ̀ ọ̀rọ̀ ìṣe aláìṣe ti δοξάζω, ó sì pa èdè ‘ògo’ ti Bíbélì mọ́.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Gíríìkì sọ ‘Baba,’ kì í ṣe ‘Baba mi.’ Lílò rẹ̀ gẹ́gẹ́ bí orúkọ oyè Ọlọ́run bá ìlò Jòhánù mu.
- source_word: ἐν τῷ υἱῷ
  choice: nínú Ọmọ
  rationale: ‘Nínú Ọmọ’ pa ἐν mọ́, kò sì fipá mú ìtumọ̀ náà di ‘nípasẹ̀ Ọmọ’ nìkan.
theological_decisions:
- issue: Ìtumọ̀ bíbèèrè ‘ní orúkọ mi’
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘ní orúkọ mi’ láì fi àlàyé míì rọ́pò rẹ̀.
  alternative: ‘Nípasẹ̀ àṣẹ mi,’ ‘ní ìṣọ̀kan pẹ̀lú mi,’ tàbí ‘gẹ́gẹ́ bí ìwà àti ìfẹ́ mi.’
  rationale: Gbólóhùn náà ní ọ̀pọ̀ ìtumọ̀ tó jọra nínú Jòhánù. Ìtumọ̀ tààrà yìí pa ìjìnlẹ̀ rẹ̀ mọ́, kò sì gbé ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
- issue: Agbára ìtumọ̀ ἐν τῷ υἱῷ
  choice: ‘Nínú Ọmọ.’
  alternative: ‘Nípasẹ̀ Ọmọ.’
  rationale: ἐν lè tọ́ka sí ibi tàbí ipò tí ohun ti ṣẹlẹ̀, ó sì tún lè ní agbára ọ̀nà tí ohun fi ṣẹlẹ̀. Àkọsílẹ̀ pàtàkì pa àìdánilójú tó wà nínú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ’ pa ọ̀pọ̀ ẹni kejì mọ́; ‘èyí ni èmi yóò ṣe’ sì mú ìtẹnumọ́ inú Gíríìkì hàn. A gbe àmì àlàyé [a] sí ‘nínú Ọmọ,’ ibi tí àlàyé náà ń ṣàlàyé gan-an.
