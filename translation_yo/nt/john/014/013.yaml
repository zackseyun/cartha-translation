  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìgbòòrò ὅ τι ἂν, ọ̀pọ̀ ẹni kejì nínú αἰτήσητε, ‘ní orúkọ mi,’ ìtẹnumọ́ τοῦτο, àti ète ἵνα mọ́ dáadáa. ‘Kí Baba lè gba ògo’ jẹ́ èdè tí a lè lóye, ṣùgbọ́n ‘kí a lè fi ògo fún Baba’ túmọ̀ passive δοξασθῇ ní tààrà síi, láì fi hàn pé Baba fúnra rẹ̀ ni ó ń ṣe ìṣe náà.
  naturalness: Ọ̀rọ̀ Yorùbá náà jẹ́ ti ìgbàlódé, ó sì ní ìwọ̀n ìyì tó yẹ. ‘Ohunkóhun tí ẹ bá sì béèrè’ àti ‘èyí ni èmi yóò ṣe’ jẹ́ àdánidá, ó sì pa ìtẹnumọ́ gbólóhùn Gíríìkì mọ́.
  terminology: ‘Orúkọ mi,’ ‘Baba,’ ‘ògo,’ àti ‘Ọmọ’ bá ọ̀rọ̀ Bíbélì Yorùbá mu. ‘Nínú Ọmọ’ dá àìpinnu tó wà nínú ἐν τῷ υἱῷ sílẹ̀, níbi tí ‘nípasẹ̀ Ọmọ’ ti yẹ gẹ́gẹ́ bí àṣàyàn nínú àlàyé.
  issues:
