    rationale: A gbọdọ̀ so àmì àlàyé mọ́ ọ̀rọ̀ tàbí gbólóhùn tí ó ń ṣàlàyé taara, kí ìtọ́kasí rẹ̀ má bàa dàrú.
  - severity: low
