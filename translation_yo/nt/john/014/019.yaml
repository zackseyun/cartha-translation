id: JHN.14.19
reference: John 14:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: yo
  text: Ní ìgbà díẹ̀ sí i, ayé kì yóò rí mi mọ́; ṣùgbọ́n ẹ̀yin yóò rí mi.[a] Nítorí pé èmi wà láàyè, ẹ̀yin pẹ̀lú yóò sì wà láàyè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “rí” níbi méjèèjì lè tún ní ìtumọ̀ wíwo tàbí kíyèsí pẹ̀lú àfiyèsí, kì í ṣe wíwo lójú lásán.
    reason: lexical_alternative
  - marker: b
    text: “Ẹ̀yin pẹ̀lú yóò sì wà láàyè” lè tọ́ka sí bí àwọn ọmọ-ẹ̀yìn ṣe ń pín nínú ìyè àjíǹde Jesu, ìyè ẹ̀mí ní ìṣọ̀kan pẹ̀lú rẹ̀, tàbí àwọn méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Ó ku ìgbà díẹ̀ sí i
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àkókò kúkúrú kan ṣì kù, ó sì pa ìtumọ̀ ohun tí yóò ṣẹlẹ̀ láìpẹ́ mọ́.
- source_word: ὁ κόσμος
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún κόσμος, ó sì jẹ́ kí ìtumọ̀ tí ọ̀rọ̀ náà sábà máa ń ní nínú Jòhánù—àwọn ènìyàn tí wọn kò mọ Jesu—wà ní ṣíṣí láì fi àlàyé kún un.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: kì yóò rí / yóò rí
  rationale: “Rí” jẹ́ ọ̀rọ̀ àdánidá, ó sì lè gba ìtumọ̀ rírí ní ojú tàbí mímọ̀ ní ìjìnlẹ̀. A lo àmì ọjọ́ iwájú nítorí àkókò tí ἔτι μικρὸν àti οὐκέτι tọ́ka sí.
- source_word: οὐκέτι
  choice: kì yóò ... mọ́
  rationale: Ìlànà “kì yóò ... mọ́” sọ ìdádúró ohun kan láti àkókò tó ń bọ̀ lọ́nà Yorùbá tó ṣe kedere.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ayé àti àwọn ọmọ-ẹ̀yìn nípa bí wọn yóò ṣe rí Jesu.
- source_word: ὅτι
  choice: Nítorí pé
  rationale: 'Ó mú ìtumọ̀ ìdí tàbí ìpìlẹ̀ gbangba: ìyè àwọn ọmọ-ẹ̀yìn dá lórí pé Jesu wà láàyè.'
- source_word: ἐγὼ ζῶ
  choice: èmi wà láàyè
  rationale: “Èmi” pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, “wà láàyè” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ζῶ láì dín ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ kù.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: ẹ̀yin pẹ̀lú yóò wà láàyè
  rationale: “Pẹ̀lú” dúró fún καί, “yóò” sì pa ọjọ́ iwájú ζήσετε mọ́, láì sọ irú ìyè tí a ń tọ́ka sí di èyí kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ bí àwọn ọmọ-ẹ̀yìn yóò ṣe “rí” Jesu
  choice: A túmọ̀ rẹ̀ ní ọ̀nà gbígbòòrò gẹ́gẹ́ bí “yóò rí mi.”
  alternative: Rírí Jesu ní ti ara lẹ́yìn àjíǹde, mímọ̀ ọ́n nípa ìgbàgbọ́, tàbí ìtumọ̀ aláwọ̀ púpọ̀ tí ó gba àwọn méjèèjì.
  rationale: θεωρέω àti àyíká ọ̀rọ̀ Jòhánù lè ní ìró ju ọ̀kan lọ. Ìtumọ̀ kò yẹ kí ó pinnu ohun tí Gíríìkì kò sọ ní pàtó.
- issue: Ìtumọ̀ “ẹ̀yin pẹ̀lú yóò wà láàyè”
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní gbígbòòrò láì dín in kù sí irú ìyè kan.
  alternative: Ìyè àjíǹde nìkan, ìyè ẹ̀mí ní ìṣọ̀kan pẹ̀lú Jesu, tàbí ìyè ayérayé tí ó gba àwọn méjèèjì.
  rationale: ζήσετε lè tọ́ka sí ìpín nínú ìyè Jesu nísinsìnyí àti ìyè àjíǹde ní ọjọ́ iwájú. Ìtumọ̀ gbígbòòrò pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. A lo “ẹ̀yin” láti fi ọ̀pọ̀ ènìyàn hàn, a sì pa ìtẹnumọ́ “èmi” mọ́.
