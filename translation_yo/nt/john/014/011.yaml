id: JHN.14.11
reference: John 14:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: yo
  text: Ẹ gba mí gbọ́ pé mo wà nínú Baba, Baba sì wà nínú mi. Ṣùgbọ́n bí bẹ́ẹ̀ kọ́, ẹ gbàgbọ́ nítorí àwọn iṣẹ́ náà fúnra wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ gbàgbọ́ nítorí iṣẹ́ wọ̀nyẹn fúnra wọn.” Ọ̀rọ̀ Gíríìkì fún “ẹ gbàgbọ́” ní ìparí kò sọ ohun tí a ní láti gbàgbọ́ ní kedere; èrò náà ni pé àwọn iṣẹ́ náà fúnra wọn jẹ́ ìpìlẹ̀ tó lágbára fún ìgbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Ẹ gba mí gbọ́
  rationale: Ọ̀rọ̀ àṣẹ pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ ní dative túmọ̀ sí ‘ẹ gba mí gbọ́.’ Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìpe ti ara ẹni mọ́ láì fi ìtumọ̀ míràn kún un.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣí gbólóhùn tí ó sọ ohun tí wọ́n ní láti gbàgbọ́, kì í ṣe ìdí tí wọ́n fi ní láti gbàgbọ́.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: nínú Baba ... nínú mi
  rationale: ‘Nínú’ pa àwòrán ìgbé-inú-ẹni-kọọkan ti Jòhánù mọ́, láì yí i padà sí àlàyé bí ‘jẹ́ ọ̀kan pẹ̀lú.’
- source_word: εἰ δὲ μή
  choice: Ṣùgbọ́n bí bẹ́ẹ̀ kọ́
  rationale: Ó fi ìyàtọ̀ àti ọ̀nà kejì hàn bí àwọn olùgbọ́ kò bá gba ọ̀rọ̀ àkọ́kọ́ náà.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: nítorí àwọn iṣẹ́ náà fúnra wọn
  rationale: ‘Nítorí’ fi ìdí tàbí ìpìlẹ̀ ìgbàgbọ́ hàn; ‘fúnra wọn’ sì mú ìtẹnumọ́ αὐτά jáde.
- source_word: πιστεύετε
  choice: ẹ gbàgbọ́
  rationale: Ọ̀rọ̀ àṣẹ náà kò ní ohun tí a sọ ní kedere pé kí wọ́n gbàgbọ́ sí; ìtumọ̀ yìí pa àìsọ ohun náà mọ́.
theological_decisions:
- issue: Ìgbé Ọmọ nínú Baba àti Baba nínú Ọmọ
  choice: Pa ọ̀rọ̀ ìbáṣepọ̀ náà mọ́ gẹ́gẹ́ bí ‘mo wà nínú Baba, Baba sì wà nínú mi.’
  alternative: ‘Èmi àti Baba jẹ́ ọ̀kan’ tàbí ‘mo jẹ́ ọ̀kan pẹ̀lú Baba.’
  rationale: Ọ̀rọ̀ orísun sọ ìgbé-inú-ẹni-kọọkan, ó sì yẹ kí a má ṣe rọ́pò rẹ̀ pẹ̀lú àkótán ẹ̀kọ́ ìgbàgbọ́ tàbí àlàyé tó ju ohun tí a kọ lọ.
- issue: Àwọn iṣẹ́ gẹ́gẹ́ bí ìpìlẹ̀ fún ìgbàgbọ́
  choice: Fi ìṣe àṣẹ kejì sílẹ̀ láì sọ ohun tí wọ́n gbọ́dọ̀ gbàgbọ́ sí, kí ‘àwọn iṣẹ́ náà fúnra wọn’ sì jẹ́ ìdí rẹ̀.
  alternative: ‘Ẹ gbà mí gbọ́ nítorí àwọn iṣẹ́’ tàbí ‘ẹ gbàgbọ́ nínú mi nítorí àwọn iṣẹ́.’
  rationale: πιστεύετε kejì kò ní object ní Gíríìkì; fífi ‘mí’ tàbí ‘nínú mi’ kún un yóò yanju ohun tí orísun fi sílẹ̀ ní àìsọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn nínú ọ̀rọ̀ àṣẹ, ‘Baba’ fún πατήρ nínú àjọṣe yìí, àti àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
