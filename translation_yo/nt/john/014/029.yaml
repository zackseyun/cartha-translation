  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: yo
  text: Nísinsin yìí, mo ti sọ fún yín kí ó tó ṣẹlẹ̀[a], kí ẹ lè gbàgbọ́[c] nígbà tí ó bá ṣẹlẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó tó wá sí ìmúṣẹ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí ó bá wá sí ìmúṣẹ.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀-ìṣe náà tún lè ní ìtumọ̀ “gbẹ́kẹ̀ lé,” ṣùgbọ́n “gbàgbọ́” ni ìtumọ̀ tí a sábà máa ń lò fún un nínú Jòhánù níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Nísinsìnyí sì
  rationale: Àyànfẹ́ yìí pa ìtumọ̀ àkókò νῦν àti àsopọ̀ καί mọ́, ó sì jẹ́ ọ̀nà àdánidá láti so gbólóhùn náà mọ́ ohun tí ó ṣáájú ní Yorùbá.
- source_word: εἴρηκα ὑμῖν
  choice: mo ti sọ fún yín
  rationale: Àmì ìṣe pípé εἴρηκα tọ́ka sí ọ̀rọ̀ tí a ti sọ tẹ́lẹ̀ tí ipa rẹ̀ ṣì wà; “mo ti sọ fún yín” fi èyí hàn ní Yorùbá, ó sì mú ὑμῖν jáde gẹ́gẹ́ bí “fún yín.”
- source_word: πρὶν γενέσθαι
  choice: kí ó tó ṣẹlẹ̀
  rationale: πρίν pẹ̀lú ọ̀rọ̀-ìṣe àìlópin aorist γενέσθαι túmọ̀ sí pé ohun kan kò tíì ṣẹlẹ̀. “Kí ó tó ṣẹlẹ̀” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, ohun tí “ó” dúró fún sì hàn láti inú àyíká ọ̀rọ̀.
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: ἵνα fi ète hàn. Ìlò “kí … lè” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa agbára ète náà mọ́.
- source_word: ὅταν γένηται
  choice: nígbà tí ó bá ṣẹlẹ̀
  rationale: ὅταν pẹ̀lú subjunctive tọ́ka sí ohun tí a retí ní ọjọ́ iwájú. “Nígbà tí ó bá ṣẹlẹ̀” pa ìtumọ̀ náà àti àtúnsọ gbòǹgbò γίνομαι mọ́.
- source_word: πιστεύσητε
  choice: ẹ lè gbàgbọ́
  rationale: πιστεύω sábà máa ń túmọ̀ sí “gbàgbọ́” nínú Jòhánù, bó tilẹ̀ jẹ́ pé ó tún lè ní agbára ìgbẹ́kẹ̀lé. “Ẹ lè gbàgbọ́” bá subjunctive tí ἵνα ń darí mu, láì pinnu bóyá ó jẹ́ ìgbàgbọ́ tuntun tàbí fífún ìgbàgbọ́ tó ti wà lókun.
theological_decisions:
- issue: Agbára πιστεύσητε nínú àyíká ọ̀rọ̀
  choice: ẹ lè gbàgbọ́
  alternative: ẹ lè máa bá a lọ ní gbígbàgbọ́; ẹ lè gbẹ́kẹ̀ lé e
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí mímú ìgbàgbọ́ wá tàbí fífún ìgbàgbọ́ tí ó ti wà lókun nígbà tí àsọtẹ́lẹ̀ náà bá ṣẹ. Ìtumọ̀ “gbàgbọ́” pa ààyè ìtumọ̀ méjèèjì mọ́, kò sì fi ẹ̀kọ́ ìsìn kan lé ẹsẹ náà lórí.
translation_notes:
  register: A lo Yorùbá àpéwọ̀, ọ̀wọ̀, àti òde òní. “Nísinsìnyí sì” jẹ́ ìsopọ̀ ọ̀rọ̀ tó bójú mu; “kí ó tó ṣẹlẹ̀” àti “nígbà tí ó bá ṣẹlẹ̀” pa àtúnsọ tó wà nínú Gíríìkì mọ́. A lo arọ́pò-orúkọ ọ̀pọ̀ “yín/ẹ” fún ὑμῖν àti ìṣe ẹni kejì ọ̀pọ̀.
