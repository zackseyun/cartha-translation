  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: yo
  text: Bí ẹ bá béèrè ohunkóhun lọ́wọ́ mi ní orúkọ mi[a], èmi yóò ṣe é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ka a pé, “Bí ẹ bá béèrè ohunkóhun ní orúkọ mi, èmi yóò ṣe é,” láìsí “lọ́wọ́ mi.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Bí … bá
  rationale: Ìṣètò ‘Bí … bá’ ni ọ̀nà Yorùbá àdánidá láti fi gbé gbólóhùn oníṣ шарт условный tí ἐάν ń ṣe.
- source_word: τι
  choice: ohunkóhun
  rationale: Ó fi hàn pé ohun tí a lè béèrè kò ní ààlà pàtó, gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì ṣe túmọ̀ sí níbí.
- source_word: αἰτήσητέ
  choice: ẹ bá béèrè
  rationale: Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ni ọ̀rọ̀ Gíríìkì; ‘ẹ’ àti ‘bá béèrè’ mú ìyẹn àti ìtumọ̀ ìbéèrè tàbí ẹ̀bẹ̀ jáde lọ́nà Yorùbá àdánidá.
- source_word: με
  choice: lọ́wọ́ mi
  rationale: Nínú Yorùbá, ‘béèrè … lọ́wọ́ mi’ ni gbólóhùn àdánidá fún bíbẹ̀rẹ̀ ohun kan lọ́dọ̀ ẹni; ó sì pa ‘mi’ tó wà nínú ẹ̀dà Gíríìkì mọ́ ní kedere.
- source_word: ἐν τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Ó pa àwòrán àti ìfihàn Johanu mọ́ láì fi àlàyé ìtumọ̀ bí ‘nípasẹ̀ àṣẹ mi’ kún ọ̀rọ̀ náà.
- source_word: ἐγὼ
  choice: èmi
  rationale: ‘Èmi’ ń fi ìtẹnumọ́ díẹ̀ tó wà nínú arọ́pò-orúkọ Gíríìkì tó hàn gbangba mú jáde láì ṣe àfikún tó pọ̀jù.
- source_word: ποιήσω
  choice: yóò ṣe é
  rationale: Ó tú ọjọ́ iwájú Gíríìkì sí Yorùbá àdánidá, ‘é’ sì tọ́ka sí ohun tí a béèrè.
theological_decisions:
- issue: Wíwà με (‘mi’) nínú Johanu 14:14 àti pé ó fi hàn pé Jesu ni a ń béèrè lọ́wọ́ rẹ̀ ní tààrà
  choice: Fi ‘lọ́wọ́ mi’ sínú ọ̀rọ̀ pàtàkì
  alternative: Bí ẹ bá béèrè ohunkóhun ní orúkọ mi, èmi yóò ṣe é.
  rationale: SBLGNT tí a fún wa ní με, nítorí náà a túmọ̀ rẹ̀ ní kedere. Níwọ̀n bí àwọn ẹ̀dà mìíràn kò ti ní ọ̀rọ̀ náà, a pa ìyàtọ̀ tó ní ìjẹ́pàtàkì nípa ẹni tí a ń bẹ̀bẹ̀ sí mọ́ nínú àlàyé ìsàlẹ̀, láì pinnu ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ kọjá ohun tí ẹ̀rí ọ̀rọ̀ náà fi hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A lo ‘ẹ’ fún ẹni kejì ọ̀pọ̀, gẹ́gẹ́ bí fọ́ọ̀mù Gíríìkì ṣe rí.
