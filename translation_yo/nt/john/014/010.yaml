id: JHN.14.10
reference: John 14:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: yo
  text: Ìwọ kò ha gbàgbọ́ pé mo wà nínú Baba, Baba sì wà nínú mi? Àwọn ọ̀rọ̀ tí mo ń sọ fún yín, kì í ṣe láti ara mi[a] ni mo ń sọ wọ́n; ṣùgbọ́n Baba tí ó ń gbé nínú mi[b] ni ó ń ṣe àwọn iṣẹ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìdáṣe ara mi” tàbí “ní àṣẹ ara mi.” Gbólóhùn náà lè tọ́ka sí sísọ̀rọ̀ ní ìdáṣe tàbí lábẹ́ àṣẹ ẹni fúnra rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ó dúró nínú mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: gbàgbọ́
  rationale: “Gbàgbọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún πιστεύω, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àkòrí ìgbàgbọ́ tó ń padà wá nínú Ìhìn Rere Jòhánù. “Ìwọ” tún fi hàn pé ẹni kan ṣoṣo ni Jesu ń bá sọ níbí.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: nínú Baba ... nínú mi
  rationale: A pa àwòrán ìbágbé inú ara ẹni ti èdè Gíríìkì mọ́, láì túmọ̀ rẹ̀ sí “jẹ́ ọ̀kan pẹ̀lú,” èyí tí yóò jẹ́ àlàyé ju ìtumọ̀ lọ.
- source_word: ῥήματα
  choice: àwọn ọ̀rọ̀
  rationale: Èyí ni ìtumọ̀ tààrà, tó ṣe kedere, tó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá òde òní mu.
- source_word: λέγω ... λαλῶ
  choice: ń sọ ... ń sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀rọ̀-ìṣe méjì, lílo “sọ” ní ibi méjèèjì ló jẹ́ Yorùbá àdánidá jù lọ; fífi ìyàtọ̀ ọ̀rọ̀ sí i ní tipátipá yóò mú kí gbólóhùn náà le tàbí dà bí èdè àtijọ́.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: láti ọ̀dọ̀ ara mi
  rationale: Ó pa èrò orísun, ìdáṣe, tàbí àṣẹ ara ẹni mọ́ láì yan ọ̀kan nínú wọn gẹ́gẹ́ bí ìtumọ̀ kan ṣoṣo.
- source_word: μένων
  choice: tí ó ń gbé inú mi
  rationale: “Ń gbé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìwà-títẹ̀síwájú ti μένω; ó tún yẹra fún ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò ṣe àdánidá.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: ń ṣe àwọn iṣẹ́ rẹ̀
  rationale: “Ṣe” jẹ́ ọ̀rọ̀-ìṣe Yorùbá àdánidá, “àwọn iṣẹ́ rẹ̀” sì pa ọ̀rọ̀ pàtàkì ti Jòhánù àti arọ́pò-orúkọ αὐτοῦ mọ́.
theological_decisions:
- issue: Ìbágbé Ọmọ nínú Baba àti Baba nínú Ọmọ
  choice: mo wà nínú Baba, Baba sì wà nínú mi
  alternative: Èmi àti Baba jẹ́ ọ̀kan; mo wà ní ìṣọ̀kan pẹ̀lú Baba
  rationale: Ìtumọ̀ náà pa ọ̀rọ̀ ìbáṣepọ̀ Gíríìkì mọ́ láì fi ẹ̀kọ́ ìsìn tàbí gbólóhùn láti ibòmíràn rọ́pò rẹ̀.
- issue: Orísun ọ̀rọ̀ Jesu àti iṣẹ́ Baba
  choice: kì í ṣe láti ọ̀dọ̀ ara mi ni mo ti ń sọ wọn; ... Baba ... ni ó ń ṣe àwọn iṣẹ́ rẹ̀
  alternative: Èmi kò sọ̀rọ̀ ní agbára ara mi; Baba ni ó ń ṣiṣẹ́ nípasẹ̀ mi
  rationale: Èyí pa ìyàtọ̀ ẹni Baba àti Ọmọ mọ́, bákan náà ni ó pa ìṣọ̀kan àti ìgbẹ́kẹ̀lé tó wà nínú iṣẹ́ wọn mọ́, láì sọ Ọmọ di ẹ̀dá lásán tàbí tú ọ̀rọ̀ náà sí ẹ̀kọ́ ìsìn tí kò sí ní tààrà nínú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. “Ìwọ” jẹ́ ẹyọ̀ gẹ́gẹ́ bí πιστεύεις, ṣùgbọ́n “yín” jẹ́ ọ̀pọ̀ gẹ́gẹ́ bí ὑμῖν. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó ti bá ìkọ̀wé Yorùbá àdánidá mu.
