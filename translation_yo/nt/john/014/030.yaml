id: JHN.14.30
reference: John 14:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: yo
  text: Èmi kì yóò bá yín sọ̀rọ̀ púpọ̀ mọ́, nítorí olùṣàkóso ayé ń bọ̀[a]. Kò sì ní ohunkóhun nínú mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olùṣàkóso ayé yìí.” Àwọn ìtumọ̀ kan fi “yìí” kún un ní ìbámu pẹ̀lú àwọn gbólóhùn tó jọ ọ́ ní Jòhánù, ṣùgbọ́n Gíríìkì níbí kàn sọ pé “ti ayé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kò ní ẹ̀tọ́ kankan lórí mi” tàbí “kò ní ohun tí yóò fi di mí mú.” Gíríìkì sọ ní tààrà pé, “kò ní ohunkóhun nínú mi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω
  choice: Èmi kì yóò bá yín sọ̀rọ̀ púpọ̀ mọ́
  rationale: Ọ̀rọ̀ náà fi hàn pé láti ìsinsìnyí lọ, Jésù kò ní máa bá wọn sọ̀rọ̀ púpọ̀ mọ́. ‘Sọ̀rọ̀ púpọ̀’ tú πολλὰ tí a lò bí ọ̀rọ̀-àpèjúwe fún λαλήσω ní èdè Yorùbá àdánidá.
- source_word: μεθ’ ὑμῶν
  choice: bá yín sọ̀rọ̀
  rationale: μετά pẹ̀lú genitive tọ́ka sí ìbáṣepọ̀; àkójọpọ̀ ọ̀rọ̀ Yorùbá ‘bá yín sọ̀rọ̀’ mú ìtumọ̀ ìjíròrò pẹ̀lú àwọn ọmọ-ẹ̀yìn jáde dáadáa.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Ìṣe àsìkò ìsinsìnyí níbí ní agbára ohun tó ń ṣẹlẹ̀ láìpẹ́; ‘ń bọ̀’ sọ ìsúnmọ́ rẹ̀ ní kedere.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: alákòóso ayé
  rationale: ‘Alákòóso’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἄρχων, ‘ayé’ sì tẹ̀lé κόσμος láìfi ‘yìí’ kún ohun tí Gíríìkì kò sọ níbí.
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: Kò sì ní ohunkóhun nínú mi
  rationale: Ìtumọ̀ yìí pa ìṣètò ọ̀rọ̀ Gíríìkì tó ṣókí àti tó ní ìtumọ̀ gbòòrò mọ́, láìdín in kù sí ẹ̀tọ́, agbára, tàbí ìdí kan ṣoṣo.
theological_decisions:
- issue: Ta ni ‘alákòóso ayé’ ń tọ́ka sí?
  choice: A pa oyè náà mọ́ gẹ́gẹ́ bí ‘alákòóso ayé,’ láìrọ́pò rẹ̀ pẹ̀lú ‘Sátánì.’
  alternative: Sátánì; tàbí àpẹẹrẹ gbogbogbò ti àwọn agbára ibi inú ayé.
  rationale: Ní àyíká Ìhìn Rere Jòhánù, oyè náà sábà ń tọ́ka sí Sátánì, ṣùgbọ́n Gíríìkì lo oyè náà fúnra rẹ̀. Ìtumọ̀ náà kò fi ìdánimọ̀ tí a fojú inú rí sínú ọ̀rọ̀ pàtó.
- issue: Ìtumọ̀ ‘kò ní ohunkóhun nínú mi’
  choice: A pa gbólóhùn náà mọ́ ní ọ̀nà tó sún mọ́ Gíríìkì.
  alternative: Kò ní ẹ̀tọ́ kankan lórí mi; kò lè di mí mú; kò ní agbára lórí mi.
  rationale: Gbólóhùn Gíríìkì lè túmọ̀ sí pé alákòóso náà kò ní ẹ̀tọ́, ìdí, ibi ìdìmú, tàbí ohun tó jọ ọ́ pẹ̀lú Jésù. Yíyan ọ̀kan ṣoṣo nínú ìwọ̀nyí nínú àyọkà yóò dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. A yan ‘kì yóò ... mọ́’ dípò ọ̀rọ̀ ojoojúmọ́ bí ‘mi ò ní ... mọ́,’ a sì lo àmì ohùn ní kíkún níbi tó bá yẹ.
