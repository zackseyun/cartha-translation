id: JHN.14.8
reference: John 14:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: yo
  text: Fílípì sọ fún un pé, “Olúwa[a], fi Baba hàn wá, ìyẹn sì tó fún wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.”
    reason: κύριος tí a lò gẹ́gẹ́ bí ọ̀rọ̀ ìpè lè jẹ́ ‘Olúwa’ tàbí ọ̀rọ̀ ọ̀wọ̀ ‘Ọ̀gá.’
lexical_decisions:
- source_word: Λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí ìtàn, àkókò tí ó ti kọjá ni Yorùbá àdánidá máa ń lò nínú irú ìtàn yìí.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó fi ẹni tí Fílípì ń bá sọ̀rọ̀ hàn; ‘fún un’ ni ọ̀nà Yorùbá àdánidá.
- source_word: Φίλιππος
  choice: Fílípì
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe àti kọ ọ́ ní Yorùbá.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè κύριος lè túmọ̀ sí ‘Olúwa’ tàbí ọ̀rọ̀ ọ̀wọ̀ bí ‘Ọ̀gá’; níbí, ‘Olúwa’ bá ọ̀wọ̀ tí Fílípì fi ń bá Jésù sọ̀rọ̀ àti àyíká ìwé Jòhánù mu.
- source_word: δεῖξον
  choice: fi … hàn
  rationale: Àṣẹ-ẹ̀bẹ̀ yìí túmọ̀ sí mímú kí ẹnì kan rí tàbí mọ ohun kan; ‘fi … hàn’ jẹ́ Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: ἡμῖν
  choice: wá
  rationale: Dátífù ọ̀pọ̀ ènìyàn lẹ́yìn ‘fi … hàn’ ni a sọ ní Yorùbá pé ‘hàn wá.’
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Baba Jésù; ‘Baba’ pa ìtumọ̀ ìbátan àti oyè náà mọ́.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so ẹ̀bẹ̀ náà mọ́ abajade tí Fílípì sọ pé yóò tó, ní ọ̀nà Yorùbá tó rọrùn.
- source_word: ἀρκεῖ
  choice: tó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ohun kan péye tàbí pé ó tó; ‘tó’ jẹ́ kúkúrú, kedere, ó sì bá ìsinsìnyí Gíríìkì mu.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Pẹ̀lú ‘tó,’ Yorùbá àdánidá fi ẹni tí ohun náà tó fún hàn nípasẹ̀ ‘fún wa.’
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí Fílípì fi ń pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ọ̀wọ̀ àti ìwọ̀n ìtumọ̀ Kristọ́lọ́jì inú àyíká Jòhánù mọ́ láìfi ìtumọ̀ míì kún un; síbẹ̀, ‘Ọ̀gá’ jẹ́ ìtumọ̀ ọ̀wọ̀ tí gírámà náà tún lè gbà, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, títọ́, tí ó ní ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtòlẹ́sẹẹsẹ ẹ̀bẹ̀ àti ìdáhùn Gíríìkì mọ́ ní ọ̀nà Yorùbá àdánidá.
