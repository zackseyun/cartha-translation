  source_fidelity: 'Ìtumọ̀ náà fi gbogbo àwọn ẹ̀yà pàtàkì Gíríìkì hàn dáadáa: Fílípì ni ẹni tó ń sọ̀rọ̀ sí Jésù; ‘Olúwa’ ń ṣojú Κύριε; ‘fi Baba hàn wá’ ń tú δεῖξον ἡμῖν τὸν πατέρα; ‘ìyẹn sì tó fún wa’ sì ń pa καὶ ἀρκεῖ ἡμῖν mọ́. ‘Sọ’ jẹ́ ìmúdọ́gba àdánidá fún ìsinsìnyí ìtàn Λέγει nínú ìtàn Yorùbá.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, rọrùn, ó sì yẹ fún ìjíròrò tó ní ọ̀wọ̀. ‘Fi Baba hàn wá’ àti ‘tó fún wa’ jẹ́ ọ̀nà ìsọ̀rọ̀ tí ó dára, tí kò sì pọ̀n dandan.
  terminology: ‘Olúwa’ yẹ fún Κύριε nínú àyíká Jòhánù yìí, nígbà tí àlàyé ìsàlẹ̀ náà ń pa ìṣeeṣe ọ̀rọ̀ ìpè ọ̀wọ̀ ‘Ọ̀gá’ mọ́ láìgbẹ̀mí ìtumọ̀ kan mọ́ra. ‘Baba’ pẹ̀lú ìkọ̀wé olú-ìfẹ̀sẹ̀jẹ̀ ń tọ́ka dáadáa sí Baba Ọlọ́run nínú àyíká náà.
