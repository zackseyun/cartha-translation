id: JHN.14.28
reference: John 14:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: yo
  text: Ẹ ti gbọ́ pé mo sọ fún yín pé, ‘Èmi ń lọ, mo sì ń bọ̀ wá sọ́dọ̀ yín.’ Ká ní ẹ nífẹ̀ẹ́ mi, ẹ ì bá ti yọ̀[a] pé mo ń lọ sọ́dọ̀ Baba, nítorí Baba tóbi ju mí lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ì bá yọ̀ pé mo ń lọ sọ́dọ̀ Baba.” Ìrísí ọ̀rọ̀ Gíríìkì lè gba ìtumọ̀ gbogbogbò yìí, ṣùgbọ́n “ẹ ì bá ti yọ̀” bá ipò àròsọ tí kò ṣẹlẹ̀ mu jù nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: A túmọ̀ “Baba tóbi ju mí lọ” gẹ́gẹ́ bí a ti kọ ọ́, láìfi àlàyé ìtumọ̀ bí “ní ipò” tàbí “ní àṣẹ” kún un.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Ẹ ti gbọ́
  rationale: Aorist náà tọ́ka sí ohun tí àwọn ọmọ-ẹ̀yìn ti gbọ́ tẹ́lẹ̀; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún ìgbọ́ tí ó ti ṣẹlẹ̀.
- source_word: Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς
  choice: Èmi ń lọ, mo sì ń bọ̀ wá sọ́dọ̀ yín
  rationale: Ó pa ìyàtọ̀ ìṣípò méjèèjì mọ́—lọ kúrò àti bọ̀ wá sọ́dọ̀ wọn—pẹ̀lú agbára ọjọ́ iwájú tí ọ̀rọ̀ ìsinsìnyí ní nínú àyíká yìí.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Ká ní ẹ nífẹ̀ẹ́ mi
  rationale: ‘Ká ní’ fi ipò àròsọ tí kò bá òtítọ́ mu hàn lọ́nà Yorùbá tí ó ṣe kedere, láìsọ pé wọn kò ní ìfẹ́ kankan sí Jesu.
- source_word: ἐχάρητε ἄν
  choice: ẹ ì bá ti yọ̀
  rationale: Àkójọpọ̀ aorist àti ἄν fi èsì tí ì bá ti ṣẹlẹ̀ hàn; ‘ì bá ti yọ̀’ mú ìtumọ̀ àtakò-sí-òtítọ́ náà jáde ní Yorùbá.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: mo ń lọ sọ́dọ̀ Baba
  rationale: Ó ṣàfihàn ìlọ sí ibi ẹni kan, ó sì pa ‘Baba’ mọ́ gẹ́gẹ́ bí orúkọ oyè Johanu láìfikún ‘Baba mi.’
- source_word: μείζων μού ἐστιν
  choice: tóbi ju mí lọ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ comparative μέγας; a kò fi àlàyé bí ‘ní ipò’ tàbí ‘ní àṣẹ’ kún un.
theological_decisions:
- issue: Ìtumọ̀ ‘Baba tóbi ju mí lọ’ ní ìbáṣepọ̀ pẹ̀lú ẹ̀kọ́ nípa Baba àti Ọmọ
  choice: 'Pa ìfiwéra náà mọ́ ní tààrà: ‘Baba tóbi ju mí lọ.’'
  alternative: Baba ga ju mí lọ ní ipò tàbí ní àṣẹ; tàbí Baba tóbi ju mí lọ ní ti ipò mi gẹ́gẹ́ bí ènìyàn.
  rationale: Gíríìkì sọ ìfiwéra náà láìfi ààlà tàbí àlàyé kún un. Ìtumọ̀ náà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ẹsẹ náà mọ́, kò sì fi ìtumọ̀ ẹgbẹ́ ìjọ kan sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. ‘Ẹ’ ni ọ̀pọ̀ ènìyàn nítorí ὑμεῖς/ὑμῖν, kì í ṣe àmì ọ̀wọ̀ sí ẹni kan. A lò ‘Baba’ gẹ́gẹ́ bí orúkọ oyè, láìfikún ohun-ìní tí Gíríìkì kò sọ.
