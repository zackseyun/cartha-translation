id: JHN.14.23
reference: John 14:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: yo
  text: Jésù dá a lóhùn, ó sì wí fún un pé, “Bí ẹnikẹ́ni bá fẹ́ràn mi, yóò pa ọ̀rọ̀ mi mọ́[a]. Baba mi náà yóò fẹ́ràn rẹ̀, àwa yóò sì wá sọ́dọ̀ rẹ̀, a ó sì ṣe ibùgbé lọ́dọ̀ rẹ̀[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀kọ́ mi” tàbí “ohun tí mo sọ” dípò “ọ̀rọ̀ mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “a ó sì ṣe ibi gbígbé lọ́dọ̀ rẹ̀” tàbí “a ó sì ṣe ilé wa lọ́dọ̀ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jésù dá a lóhùn, ó sì wí fún un pé
  rationale: Ó pa ìṣètò ọ̀rọ̀ Gíríìkì méjèèjì mọ́—‘dáhùn’ àti ‘wí’—ní ọ̀nà Yorùbá tí ó bójú mu fún ìtàn ọlọ́lá.
- source_word: Ἐάν τις
  choice: Bí ẹnikẹ́ni bá
  rationale: Ó fi ipò àídájú àti ìtànkálẹ̀ sí ẹnikẹ́ni hàn láìfi akọ tàbí abo kún un.
- source_word: ἀγαπᾷ με
  choice: nífẹ̀ẹ́ mi
  rationale: ‘Nífẹ̀ẹ́’ ni ọ̀nà Yorùbá àdánidá fún ìṣe ἀγαπάω ní àyíká ìbáṣepọ̀ yìí.
- source_word: τὸν λόγον μου τηρήσει
  choice: yóò pa ọ̀rọ̀ mi mọ́
  rationale: ‘Pa … mọ́’ gba ìtumọ̀ títọ́jú, dídúró ṣinṣin nínú, àti ṣíṣe ìgbọ́ràn sí ọ̀rọ̀ náà, láìdín τηρέω kù sí ìgbọ́ràn sí òfin nìkan.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Baba mi yóò sì nífẹ̀ẹ́ rẹ̀
  rationale: Ó pa orúkọ ìbáṣepọ̀ ‘Baba mi’ àti ìṣe ‘nífẹ̀ẹ́’ mọ́; ‘rẹ̀’ jẹ́ arọ́pò-orúkọ ẹnì-kẹta tí kò fi akọ tàbí abo hàn ní Yorùbá.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: àwa yóò sì wá sọ́dọ̀ rẹ̀
  rationale: ‘Wá sọ́dọ̀ rẹ̀’ fi ìṣípò sún mọ́ ẹni náà hàn, ‘àwa’ sì mú kókó ẹni méjì nínú ọ̀rọ̀-ìṣe ọ̀pọ̀ Gíríìkì yọ kedere.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: a ó sì ṣe ibùgbé wa pẹ̀lú rẹ̀
  rationale: ‘Ibùgbé’ bá μονή mu gẹ́gẹ́ bí ibi gbígbé tàbí ìdúró; gbólóhùn náà pa ìṣe ‘ṣe’ àti wíwà pẹ̀lú ẹni náà mọ́.
theological_decisions:
- issue: Àwọn ọ̀rọ̀-ìṣe ọ̀pọ̀ nínú ‘a ó wá … a ó sì ṣe’
  choice: A fi ‘àwa’ àti ‘a’ hàn gẹ́gẹ́ bí Jésù àti Baba tí ń ṣe ìṣe náà papọ̀.
  alternative: A lè sọ ọ́ lọ́nà tí kò tẹnumọ́ ẹni púpọ̀, ṣùgbọ́n ìyẹn yóò bo ọ̀rọ̀-ìṣe ọ̀pọ̀ Gíríìkì mọ́lẹ̀.
  rationale: ἐλευσόμεθα àti ποιησόμεθα jẹ́ ẹni-kìíní ọ̀pọ̀ ní kedere; ìtumọ̀ náà pa ìṣe àpapọ̀ àti ìyàtọ̀ àwọn ẹni tí a mẹ́nu kàn mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ẹni kan ṣoṣo tí a sọ ní ọ̀nà àpapọ̀
  choice: A lo ‘ẹnikẹ́ni’ àti ‘rẹ̀,’ tí ó jẹ́ ẹyọ ṣùgbọ́n tí kò ṣe àfihàn akọ tàbí abo.
  alternative: A lè tún akọ tàbí abo sọ ní kedere, ṣùgbọ́n èyí kò sí nínú Gíríìkì, Yorùbá kò sì béèrè rẹ̀.
  rationale: τις àti αὐτόν/αὐτῷ tọ́ka sí ẹni kan ṣoṣo ní ọ̀nà àpapọ̀; èdè Yorùbá lè pa ìyẹn mọ́ láìyan akọ tàbí abo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó yẹ. ‘Pa ọ̀rọ̀ mọ́’ jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún fífi ọ̀rọ̀ sí ọkàn àti ṣíṣe gẹ́gẹ́ bí rẹ̀; ‘ibùgbé’ sì dá ìró Johanu ti dídúró tàbí gbígbé mọ́.
