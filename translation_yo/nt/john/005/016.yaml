id: JHN.5.16
reference: John 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: yo
  text: Nítorí èyí, àwọn Júù ń ṣe ìnúnibíni sí Jésù[a], nítorí ó ń ṣe àwọn nǹkan wọ̀nyí ní ọjọ́ Ìsinmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà,” tàbí, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀, “àwọn aṣáájú Júù.” Nínú Johanu, ọ̀rọ̀ yìí sábà máa ń tọ́ka sí ẹgbẹ́ kan pàtó tó ń tako Jésù, kì í ṣe gbogbo àwọn Júù láìsí ìyàtọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó tọ́ka sí ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ gẹ́gẹ́ bí ìdí ohun tó tẹ̀ lé e, ó sì pa agbára ìtumọ̀ ìdí mọ́.
- source_word: ἐδίωκον
  choice: ń ṣe inúnibíni sí
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; gbólóhùn yìí sọ àtakò oníṣòro láì fi ète láti pa Jesu tó hàn ní ẹsẹ 18 kún un.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà fún orúkọ ọ̀pọ̀ yìí; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ní àyíká ọ̀rọ̀ Johanu ó lè tọ́ka sí ẹgbẹ́ kan pàtó, kì í ṣe gbogbo Júù láìsí ìyàtọ̀.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ demonstrative náà mọ́, ó sì tọ́ka sí àwọn ìṣe tí ìtàn náà ṣẹ̀ṣẹ̀ sọ.
- source_word: ἐποίει
  choice: ó ń ṣe
  rationale: Àmì “ń” fi ìṣe tó ń bá a lọ hàn, ní ìbámu pẹ̀lú aspect aláìpé Gíríìkì.
- source_word: ἐν σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìṣe náà ṣẹlẹ̀ ní àkókò Sábáàtì.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Johanu
  choice: àwọn Júù
  alternative: àwọn aṣáájú Júù; àwọn ará Judea
  rationale: Ọ̀rọ̀ pàtàkì náà pa ìtumọ̀ lexical tààrà mọ́, kò sì dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù sí àwọn aṣáájú láìsí ẹ̀rí kedere nínú gbólóhùn. Àlàyé ìsàlẹ̀ ojú ìwé dáàbò bo ìtumọ̀ àyíká ọ̀rọ̀, kí a má bàa ka a sí gbogbo Júù láìsí ìyàtọ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo “ọjọ́ Ìsinmi” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún Sábáàtì, a sì fi àmì ohùn sí ibi tí ó bá àdánidá èdè mu.
