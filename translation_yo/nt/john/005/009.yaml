  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ara ọkùnrin náà sì dá[a]; ó gbé àkéte rẹ̀, ó sì ń rìn[b]. Ọjọ́ Sábáàtì sì ni ọjọ́ náà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin náà di ẹni tí ara rẹ̀ dá.” Gíríìkì sọ pé ó “di ẹni aláìlera-mọ́” tàbí ẹni tí ara rẹ̀ dá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó bẹ̀rẹ̀ sí í rìn.” Fọ́ọ̀mù ọ̀rọ̀ ìṣe Gíríìkì lè tẹnumọ́ ìṣe tó ń bá a lọ; nínú àyíká yìí, a tún lè lóye rẹ̀ gẹ́gẹ́ bí ìbẹ̀rẹ̀ rírìn rẹ̀ lẹ́yìn ìwòsàn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ọjọ́ Ìsinmi ni ọjọ́ náà.” Gíríìkì sọ ní tààrà pé, “Sábáàtì sì ni ní ọjọ́ náà.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn ní èdè Yorùbá tó ṣe kedere pé ìwòsàn náà ṣẹlẹ̀ lójijì, láìsí ìdádúró.
- source_word: ἐγένετο ὑγιὴς
  choice: di aláìsàn-mọ́
  rationale: 'Ọ̀rọ̀ yìí pa ìyípadà ipò tí Gíríìkì sọ mọ́: ọkùnrin náà di ẹni tí àìsàn kò ṣe mọ́, láìfi fọ́ọ̀mù àfipá kún un.'
- source_word: ὁ ἄνθρωπος
  choice: ọkùnrin náà
  rationale: Ó bá akọ tí ẹni tí àyíká ìtàn ń tọ́ka sí mu, ó sì ṣe kedere pé ẹni kan náà ni.
- source_word: ἦρε
  choice: gbé
  rationale: Nínú àyíká yìí, ó túmọ̀ sí gbígbé ohun ìtẹ́sí tí a lè gbé lọ; ‘gbé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì ṣe kedere.
- source_word: κράβαττον
  choice: àkéte
  rationale: Ó tọ́ka sí ohun ìtẹ́sí tàbí ohun ìsùn rírọrùn tí a lè ká tàbí gbé, kì í ṣe ibùsùn ńlá dandan.
- source_word: περιεπάτει
  choice: ń rìn
  rationale: Àmì ìṣe aláìparí Gíríìkì lè tẹnumọ́ ìṣe tó ń bá a lọ; ‘ń rìn’ pa ìtumọ̀ yẹn mọ́ láìdá sí i pé ó ṣẹ̀ṣẹ̀ bẹ̀rẹ̀, bó tilẹ̀ jẹ́ pé àyíká lè fi èyí hàn.
- source_word: Ἦν δὲ
  choice: sì ni
  rationale: δέ jẹ́ ìyípadà ìtàn tàbí àlàyé níbí, kì í ṣe àtakò líle; ìṣètò ‘sì ni’ jẹ́ ti Yorùbá àdánidá.
- source_word: σάββατον
  choice: Ọjọ́ Ìsinmi
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ọjọ́ Sábáàtì àwọn Júù, ó sì yẹra fún lílo ọ̀rọ̀ àjèjì níbi tí ọ̀rọ̀ ìbílẹ̀ ti ṣe kedere.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ọjọ́ náà
  rationale: Ìṣètò ‘Ọjọ́ Ìsinmi sì ni ọjọ́ náà’ jẹ́ Yorùbá àdánidá fún gbólóhùn Gíríìkì náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ σάββατον nínú àlàyé ìtàn
  choice: Ọjọ́ Ìsinmi
  alternative: ọjọ́ Sábáàtì
  rationale: Gíríìkì sọ ní ti gidi pé ‘Sábáàtì ni ní ọjọ́ náà.’ ‘Ọjọ́ Ìsinmi’ dá ìtọ́kasí ọjọ́ mímọ́ àwọn Júù dúró, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè jẹ́ Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ. A yan ‘àkéte’ dípò ‘ibùsùn’ nítorí ohun tí κράβαττον sábà ń tọ́ka sí jẹ́ ohun ìsùn kékeré tí a lè gbé. A pa àìdánilójú aspect περιεπάτει mọ́ nínú àlàyé ìsàlẹ̀.
