source:
  edition: SBLGNT
  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: yo
  text: Ẹ̀yin ti ránṣẹ́ sí Jòhánù, ó sì ti jẹ́rìí[a] sí òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì ti fi ẹ̀rí hàn sí òtítọ́.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún μεμαρτύρηκε tó pa èrò fífi ẹ̀rí hàn mọ́.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fara hàn ní Gíríìkì fún ìtẹnumọ́ díẹ̀; “Ẹ̀yin” pa ìtẹnumọ́ yẹn mọ́ láìfi “ẹ̀yin fúnra yín” kun un ju bó ṣe yẹ lọ.
- source_word: ἀπεστάλκατε
  choice: ti rán àwọn ènìyàn
  rationale: Ọ̀rọ̀-ìṣe yìí wà ní àkókò pípé, ó sì tọ́ka sí ìránṣẹ́ tí wọ́n ti ṣe tí ó ṣì ṣe pàtàkì. Ní Yorùbá, fífi “àwọn ènìyàn” hàn mú gbólóhùn náà ṣe kedere pé àwọn aṣojú ni wọ́n rán, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn, kì í ṣe pé wọ́n kàn fi ìhìn ránṣẹ́.
- source_word: πρὸς Ἰωάννην
  choice: sí Jòhánù
  rationale: “Sí” ni ọ̀nà àdánidá láti fi ìtọ́sọ́nà sí ẹni kan hàn; a pa orúkọ “Jòhánù” mọ́ láìfi “Onítẹ̀bọmi” kún un, nítorí Gíríìkì kò fi àkọlé náà síbí.
- source_word: μεμαρτύρηκε
  choice: ti jẹ́rìí
  rationale: '“Jẹ́rìí” jẹ́ èdè Yorùbá tó ṣe kedere fún fífi ẹ̀rí hàn, ó sì pa ìtumọ̀ ẹni-ẹlẹ́rìí mọ́. “Ti” tún fi ipa àkókò pípé hàn: ẹ̀rí náà ti wáyé, ó sì ṣì ní ìwúlò.'
- source_word: τῇ ἀληθείᾳ
  choice: sí òtítọ́
  rationale: “Sí òtítọ́” túmọ̀ ìbáṣepọ̀ dative lẹ́yìn ọ̀rọ̀-ìṣe náà lọ́nà tààrà, ó sì pa ìtumọ̀ pàtàkì “òótọ́ náà” nínú ìwé Jòhánù mọ́ láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ sí i.
theological_decisions:
- issue: Ìlò “òótọ́” nínú ìwé Jòhánù
  choice: òótọ́
  alternative: ohun tó jẹ́ òótọ́
  rationale: Gíríìkì ní article, ó sì ṣeé ṣe kí “òótọ́” ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀ nínú àyíká Jòhánù. “Òótọ́” pa ààyè fún ìtumọ̀ yẹn mọ́ láìdín un kù sí ìwà òdodo tàbí láìsọ ọ́ di ẹ̀kọ́ kan pàtó.
translation_notes:
  register: Èdè Yorùbá àpéwọ̀, ọlọ́lá, tó sì ṣeé lóye ni a lò. “Àwọn ènìyàn” jẹ́ àfikún tí àyíká ọ̀rọ̀ béèrè fún láti mú ohun tí “rán sí Jòhánù” túmọ̀ sí ṣe kedere ní Yorùbá; a kò fi ipò tàbí ẹ̀kọ́ ìsìn kankan kún Jòhánù.
