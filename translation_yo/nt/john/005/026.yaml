  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí Baba ti ní ìyè nínú ara rẹ̀[a], bẹ́ẹ̀ náà ni ó fún[b] Ọmọ náà láti ní ìyè nínú ara rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìyè nínú ara rẹ̀” lè tọ́ka sí ìyè tí ó jẹ́ ti ẹni fúnra rẹ̀. Ìtumọ̀ náà pa ọ̀rọ̀ Gíríìkì mọ́ dípò lílo ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ onímọ̀ bí “ìyè tí kò gbára lé ẹlòmíràn.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ó fún Ọmọ náà láti ní ìyè nínú ara rẹ̀.” Ọ̀rọ̀ ìṣe Gíríìkì náà jẹ́ ọ̀rọ̀ tí a sábà máa ń lò fún “fún”; a pa èdè fífún náà mọ́ nínú ìtumọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” mú ìtumọ̀ àsopọ̀ γάρ jáde, “gẹ́gẹ́ bí” sì bẹ̀rẹ̀ àfiwé ὥσπερ ní Yorùbá àdánidá.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Orúkọ oyè tí ó tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Baba nínú ọ̀rọ̀ Jòhánù; a lo lẹ́tà ńlá fún ìtọ́kasí yìí.
- source_word: ἔχει ζωὴν
  choice: ní ìyè
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣe ìsinsìnyí àti ohun tí ó ń ṣe sílẹ̀ ní tààrà, láìfi àlàyé kún un.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: ìyè nínú ara rẹ̀
  rationale: Ó pa gbólóhùn asọ̀rí ἐν ἑαυτῷ mọ́, ó sì yẹra fún fífi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ onímọ̀ bí “ìyè tí kò gbára lé ẹlòmíràn” sínú ẹsẹ̀ náà.
- source_word: οὕτως καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó mú ìbáramu ὥσπερ … οὕτως àti ìtumọ̀ καί gẹ́gẹ́ bí “náà” hàn ní Yorùbá tó ṣàn dáadáa.
- source_word: τῷ υἱῷ
  choice: Ọmọ
  rationale: Ó jẹ́ olùgbà nínú ìkọ́lé tí ἔδωκεν ń darí; lẹ́tà ńlá fi hàn pé oyè Kristi ni nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἔδωκεν
  choice: fi fún
  rationale: Ó pa ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ Gíríìkì náà, “fún,” mọ́, ní àkókò tí ó ti kọjá, láìsọ ọ́ di ọ̀rọ̀ nípa àṣẹ tàbí ìyọ̀ǹda nìkan.
- source_word: ζωὴν ἔχειν
  choice: láti ní ìyè
  rationale: Ìtumọ̀ Yorùbá àdánidá ni fún àpólà ọ̀rọ̀-ìṣe aláìlẹ́ni tí ó parí ìtumọ̀ ἔδωκεν.
- source_word: ἐν ἑαυτῷ
  choice: nínú ara rẹ̀
  rationale: A tún gbólóhùn kan náà lò fún Ọmọ bí a ti lò ó fún Baba, kí ìbáramu inú ọ̀rọ̀ Gíríìkì má bàjẹ́.
theological_decisions:
- issue: Bóyá kí a sọ “ìyè nínú ara rẹ̀” di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ nípa wíwà láìgbára lé ẹlòmíràn
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “ìyè nínú ara rẹ̀.”
  alternative: “ìyè tí kò gbára lé ẹlòmíràn” tàbí ọ̀rọ̀ onímọ̀ tó bá aseity mu
  rationale: Gíríìkì sọ ἐν ἑαυτῷ. Ìtumọ̀ yìí pa agbára àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú ẹsẹ̀ mọ́ láìfi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó wá lẹ́yìn sínú rẹ̀.
- issue: Bí a ṣe máa túmọ̀ ἔδωκεν nínú ìbáṣepọ̀ Baba àti Ọmọ
  choice: “fi fún Ọmọ láti ní”
  alternative: “fún Ọmọ ní àṣẹ láti ní”
  rationale: Ọ̀rọ̀ náà sọ pé Baba fún Ọmọ láti ní ìyè nínú ara rẹ̀. “Fi fún” pa èdè fífún mọ́, ṣùgbọ́n “ní àṣẹ” lè dín ọ̀rọ̀ náà kù sí ìyọ̀ǹda tàbí àṣẹ, èyí tí Gíríìkì kò sọ ní kedere. A kò dín ìwà Ọlọ́run Ọmọ kù, bẹ́ẹ̀ ni a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìbáramu Baba àti Ọmọ mọ́, a sì yẹra fún ọ̀rọ̀ onímọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí ní tààrà nínú Gíríìkì.
