    rationale: Nítorí pé Gíríìkì fi ohun tí a gbé sílẹ̀ gẹ́gẹ́ bí ohun tí àyíká ti mọ̀, àmì ẹsẹ kan ń ṣàlàyé arọ́pò-orúkọ Yorùbá náà ní kedere.
