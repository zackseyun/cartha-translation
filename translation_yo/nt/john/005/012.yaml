  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: yo
  text: Nítorí náà, wọ́n béèrè lọ́wọ́ rẹ̀ pé, “Ta ni ọkùnrin náà tí ó sọ fún ọ pé, ‘Gbé e[a], kí o sì rìn’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní èdè Gíríìkì: “Gbé, kí o sì rìn.” Ohun tí a ó gbé ni a fi sílẹ̀ nínú ọ̀rọ̀ náà, ṣùgbọ́n àyíká ẹsẹ ṣáájú fi hàn pé àkéte tàbí ibùsùn kékeré tí ọkùnrin náà dùbúlẹ̀ lé lò ń tọ́ka sí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wọ́n bi í
  rationale: Ọ̀rọ̀ náà jẹ́ aorist active indicative, ẹni kẹta ọ̀pọ̀; ‘wọ́n bi í’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n béèrè lọ́wọ́ ọkùnrin tí a mú lára dá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ ní ẹsẹ tó ṣáájú, ó sì fi ìtẹ̀síwájú tàbí àbájáde hàn.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Ta ni ọkùnrin náà
  rationale: ἄνθρωπος ń tọ́ka sí ọkùnrin kan pàtó níbí; ìtumọ̀ yìí pa ìbéèrè Gíríìkì mọ́ ní ọ̀nà tó ṣe kedere ní Yorùbá.
- source_word: ὁ εἰπών σοι
  choice: tí ó sọ fún ọ
  rationale: Participle náà ń dá ọkùnrin náà mọ̀ nípasẹ̀ ohun tí ó ti sọ; ‘tí ó sọ fún ọ’ jẹ́ àdánidá, ó sì fara mọ́ ìtumọ̀ orísun.
- source_word: Ἆρον
  choice: Gbé e sókè
  rationale: Aorist imperative ti αἴρω ni. Ohun tí a ó gbé kò farahàn nínú ẹsẹ yìí, ṣùgbọ́n arọ́pò-orúkọ ‘e’ jẹ́ kí àṣẹ náà pé ní Yorùbá láì sọ ohun náà ní pàtó.
- source_word: καὶ περιπάτει
  choice: kí o sì máa rìn
  rationale: Present imperative náà lè fi ìṣe tí ń tẹ̀ síwájú hàn; ‘máa rìn’ jẹ́ àṣẹ Yorùbá àdánidá, láì fi àlàyé tó kọjá ohun tí Gíríìkì sọ kún un.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A kò fi àlàyé ẹ̀kọ́ ìsìn kankan tí kò sí nínú orísun kún un.
