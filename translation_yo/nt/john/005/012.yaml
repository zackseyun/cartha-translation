    rationale: Bí ó tilẹ̀ jẹ́ pé περιπάτει jẹ́ present imperative, nínú àṣẹ ìmúláradá yìí “rìn” ń pa ìtumọ̀ rẹ̀ mọ́ láì ṣe ìtumọ̀ aspect rẹ̀ ju.
