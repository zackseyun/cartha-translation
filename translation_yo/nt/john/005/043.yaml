id: JHN.5.43
reference: John 5:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: yo
  text: Èmi ti wá ní orúkọ Bàbá mi,[a] ẹ̀yin kò sì gbà mí. Bí ẹlòmíràn bá wá ní orúkọ tirẹ̀,[b] ẹ ó gbà á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú àṣẹ Bàbá mi.” Ọ̀nà ìsọ̀rọ̀ Gíríìkì náà, “ní orúkọ,” lè túmọ̀ sí ṣíṣe gẹ́gẹ́ bí aṣojú ẹni tàbí pẹ̀lú àṣẹ rẹ̀, lẹ́gbẹ̀ẹ́ ìtumọ̀ orúkọ fúnra rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pẹ̀lú àṣẹ tirẹ̀.” Gbólóhùn náà, “ní orúkọ tirẹ̀,” wà ní ìyàtọ̀ gbangba pẹ̀lú wíwá Jesu “ní orúkọ Bàbá mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Èmi ti wá
  rationale: Ọ̀rọ̀-ìṣe náà wà ní perfect tense, ó ń tọ́ka sí wíwá tí ó ti ṣẹlẹ̀ tí ipò rẹ̀ sì ṣì dúró; “ti wá” sọ èyí ní Yorùbá àdánidá.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: ní orúkọ Baba mi
  rationale: Ó pa àpèjúwe Gíríìkì “ní orúkọ” mọ́, èyí tí ó lè ní ìtumọ̀ aṣojú àti àṣẹ láì dín ọ̀rọ̀ náà kù sí ìtumọ̀ kan ṣoṣo.
- source_word: λαμβάνετέ με
  choice: ẹ̀yin kò sì gbà mí
  rationale: “Gbà” ní àyíká yìí túmọ̀ sí kí wọ́n tẹ́wọ́ gba Jesu tàbí gba ẹni tí ó jẹ́, kì í ṣe mímú un nípa ti ara; ó tún jẹ́ kí àtakò pẹ̀lú gbólóhùn ìkẹyìn dúró.
- source_word: ἄλλος
  choice: ẹlòmíràn
  rationale: Ìtumọ̀ tààrà tí kò fi irú ẹni náà hàn ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: ní orúkọ ara rẹ̀
  rationale: Ó pa ìfarawé àti ìyàtọ̀ mọ́ láàárín wíwá Jesu ní orúkọ Baba rẹ̀ àti wíwá ẹlòmíràn ní orúkọ tirẹ̀.
- source_word: ἐκεῖνον λήμψεσθε
  choice: ẹ ó gbà á
  rationale: Future náà jẹ́ “ẹ ó gbà á”; lílo “gbà” lẹ́ẹ̀kan sí i pa agbára àtakò ọ̀rọ̀ náà mọ́.
- source_word: πατρός μου
  choice: Baba mi
  rationale: Ní àyíká Johanu, ẹni tí Jesu ń pè ní Baba mi ni Ọlọ́run; lẹ́tà ńlá fún “Baba” ń fi ìtọ́kasí yìí hàn láì fi ọ̀rọ̀ míì kún un.
theological_decisions:
- issue: Bóyá kí a sọ ní kedere pé “Baba mi” ni Ọlọ́run Baba
  choice: Lo “Baba mi” pẹ̀lú lẹ́tà ńlá, láì fi “Ọlọ́run” kún ọ̀rọ̀ náà.
  alternative: “baba mi” pẹ̀lú lẹ́tà kékeré, tàbí “Ọlọ́run Baba mi.”
  rationale: Àyíká ihinrere Johanu fi ẹni tí a tọ́ka sí hàn kedere; lẹ́tà ńlá ràn olùkà lọ́wọ́ láì fikún ohun tí kò sí nínú Gíríìkì.
- issue: Bóyá kí a tú “ní orúkọ” sí èdè àṣẹ nínú ẹsẹ̀ náà
  choice: Pa “ní orúkọ Baba mi” àti “ní orúkọ ara rẹ̀” mọ́.
  alternative: “pẹ̀lú àṣẹ Baba mi” àti “nípasẹ̀ àṣẹ ara rẹ̀.”
  rationale: Àpèjúwe Gíríìkì lè tọ́ka sí àṣẹ àti aṣojú, ṣùgbọ́n yíyàn ọ̀kan ṣoṣo nínú ẹsẹ̀ yóò dín ìtumọ̀ rẹ̀ kù, yóò sì sọ ìfarawé pàtàkì náà di aláìlágbára.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Ẹ̀yin” mú ìtẹnumọ́ pronoun Gíríìkì tí ó farahàn nínú fọ́ọ̀mù ọ̀rọ̀-ìṣe náà hàn, “ẹ ó” sì jẹ́ ọjọ́ iwájú boṣewa.
