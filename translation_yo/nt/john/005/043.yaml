  terminology: “Bàbá mi,” “ní orúkọ,” àti “gbà” jẹ́ àwọn ọ̀rọ̀ tó yẹ, tí wọ́n sì pa ìtumọ̀ àti ìró ọrọ̀ Johanu mọ́. “Ní orúkọ tirẹ̀” dára ju “ní orúkọ ara rẹ̀” lọ fún ìfarawé pẹ̀lú “ní orúkọ Bàbá mi.”
