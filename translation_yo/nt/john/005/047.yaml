  verdict: approve
  source_fidelity: Ìtumọ̀ náà ń mú ìbáṣepọ̀ ìtakora àti àídájú ti εἰ δὲ (“Ṣùgbọ́n bí”) hàn, ó sì pa ìfarakanra méjèèjì ti πιστεύω mọ́ pẹ̀lú “gba ... gbọ́.” “Àwọn ohun tí ó kọ sílẹ̀” yẹ fún τοῖς ἐκείνου γράμμασιν nínú àyíká Mósè, àti “ẹ ó ṣe” ń fi ọjọ́ iwájú πιστεύσετε hàn. Ìbéèrè ìrònú “báwo ni ...?” bá πῶς mu dáadáa.
  naturalness: Yorùbá náà jẹ́ èdè boṣewa, adayeba, àti ti ìforíbalẹ̀ tó yẹ fún ọ̀rọ̀ Jésù. Àmì ohùn àti ìkọ̀wé “sílẹ̀,” “gbọ́,” àti “ọ̀rọ̀” wà ní ìlò tó tọ́. Ẹsẹ náà ṣàn dáadáa láì fi ìtumọ̀ kún un.
  terminology: “Gba ... gbọ́” jẹ́ àṣàyàn tó dára fún gbigba ẹ̀rí tàbí ọ̀rọ̀ gẹ́gẹ́ bí òtítọ́, ó sì jẹ́ ìbámu fún àwọn ìṣẹ̀lẹ̀ πιστεύω méjèèjì. “Àwọn ọ̀rọ̀ mi” jẹ́ ìtumọ̀ kedere fún τοῖς ἐμοῖς ῥήμασιν. Àlàyé ẹsẹ̀-ìsàlẹ̀ náà dá ìtumọ̀ míì ti γράμματα (“lẹ́tà”) sílẹ̀, ó sì mọ̀ọ́mọ̀ tọ́ka sí Mósè láti inú àyíká ọ̀rọ̀.
