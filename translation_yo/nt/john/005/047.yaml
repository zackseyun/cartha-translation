id: JHN.5.47
reference: John 5:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ kò bá gba àwọn ohun tí ó kọ sílẹ̀ gbọ́[a], báwo ni ẹ ó ṣe gba àwọn ọ̀rọ̀ mi gbọ́?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn lẹ́tà rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí lẹ́tà tàbí ìkọ̀wé; níhìn-ín, ó ń tọ́ka sí ohun tí Mósè kọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa ìtumọ̀ ìtakora δέ mọ́, ó sì fi εἰ hàn gẹ́gẹ́ bí ọ̀rọ̀ àídájú ní Yorùbá àdánidá.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: àwọn ohun tí ó kọ sílẹ̀
  rationale: Gbólóhùn yìí túmọ̀ γράμματα gẹ́gẹ́ bí àwọn ìkọ̀wé Mósè, láì fi kún un pé gbogbo wọn jẹ́ ‘Ìwé Mímọ́,’ ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ní tààràtà.
- source_word: οὐ πιστεύετε
  choice: ẹ kò bá gba ... gbọ́
  rationale: ‘Gba ... gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ènìyàn ka ẹ̀rí tàbí ọ̀rọ̀ kan sí òtítọ́; àkópọ̀ ‘kò bá’ bá gbólóhùn àídájú mu.
- source_word: πῶς
  choice: báwo ni ... ṣe
  rationale: Ó pa ìbéèrè ọ̀nà tàbí bí ohun kan yóò ṣe ṣeé ṣe mọ́, láì yí i padà sí gbólóhùn ìtumọ̀ míì.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: àwọn ọ̀rọ̀ mi
  rationale: ‘Àwọn ọ̀rọ̀ mi’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ῥήματα, ó sì pa ìyàtọ̀ tó wà láàárín ohun tí Mósè kọ àti ohun tí Jésù sọ mọ́.
- source_word: πιστεύσετε
  choice: ẹ ó ṣe gba ... gbọ́
  rationale: ‘Ó’ fi ìtọ́kasí ọjọ́ iwájú inú πιστεύσετε hàn, ‘gba ... gbọ́’ sì pa ìbáradọ́gba pẹ̀lú πιστεύετε nínú apá àkọ́kọ́ mọ́.
theological_decisions:
- issue: Ẹni tí ἐκείνου (‘rẹ̀’) ń tọ́ka sí
  choice: A fi í hàn nípasẹ̀ ‘ó’ láì tún orúkọ Mósè sọ nínú ẹsẹ náà.
  alternative: Kí a sọ ní tààràtà pé ‘àwọn ohun tí Mósè kọ sílẹ̀.’
  rationale: Jòhánù 5:45–46 ti dárúkọ Mósè ní kedere. Ìtumọ̀ yìí pa ìṣọ̀kan ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, nígbà tí àyíká ọ̀rọ̀ ṣì mú ẹni tí a ń tọ́ka sí ṣe kedere.
- issue: Ìtumọ̀ πιστεύω nínú ẹsẹ yìí
  choice: gba ... gbọ́
  alternative: gbẹ́kẹ̀ lé
  rationale: Níbí, kókó ọ̀rọ̀ ni jíjẹ́wọ́ pé ẹ̀rí àwọn ìkọ̀wé Mósè àti àwọn ọ̀rọ̀ Jésù jẹ́ òtítọ́. ‘Gba ... gbọ́’ bá àwọn apá méjèèjì mu, ó sì pa ìṣọ̀kan ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye lójoojúmọ́ ni a lò. ‘Ẹ’ jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn níbí, ó bá àwọn ẹni tí Jésù ń bá sọ̀rọ̀ mu. Àwọn àmì ohùn ni a fi sí ibi tí wọ́n ti yẹ.
