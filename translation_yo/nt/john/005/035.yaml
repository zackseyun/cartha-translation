source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: yo
  text: Òun ni fìtílà tí ń jó, tí ó sì ń tàn ìmọ́lẹ̀; ẹ̀yin sì fẹ́ láti yọ̀ gidigidi fún ìgbà díẹ̀[a] nínú ìmọ́lẹ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìgbà kan.” Gbólóhùn Gíríìkì náà túmọ̀ sí fún àkókò tó ní ààlà; kò ṣe dandan pé ó túmọ̀ sí wákàtí kan gangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Òun
  rationale: Ọ̀rọ̀ arọ́pò afihàn yìí ń tọ́ka sí Jòhánù pẹ̀lú ìtẹnumọ́; “Òun” jẹ́ ọ̀nà àdánidá láti gbé ìtẹnumọ́ náà jáde ní Yorùbá.
- source_word: λύχνος
  choice: fìtílà
  rationale: λύχνος túmọ̀ sí fìtílà tí a ń tan, kì í ṣe ìmọ́lẹ̀ fúnra rẹ̀. Èyí pa ìyàtọ̀ tó wà láàárín Jòhánù gẹ́gẹ́ bí ẹni tó ń jẹ́rìí àti Jésù gẹ́gẹ́ bí ìmọ́lẹ̀ mọ́.
- source_word: καιόμενος καὶ φαίνων
  choice: tí ń jó, tí ó sì ń tan ìmọ́lẹ̀
  rationale: 'Àwọn participle méjèèjì ṣàpèjúwe iṣẹ́ tó ń bá a lọ: fìtílà náà ń jó, ó sì ń tan ìmọ́lẹ̀. Gbólóhùn yìí ṣe kedere, ó sì jẹ́ àdánidá ní Yorùbá.'
- source_word: ἠθελήσατε
  choice: ẹ̀yin sì fẹ́
  rationale: “Fẹ́” fi ìfẹ́-ọkàn tàbí ìtẹ̀sí wọn hàn láìsọ pé ìfẹ́ náà pẹ́ tàbí pé wọ́n fi dandan yan ohun náà.
- source_word: ἀγαλλιαθῆναι
  choice: láti yọ̀ gidigidi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ayọ̀ tó lágbára; “yọ̀ gidigidi” mú ìtẹnumọ́ yẹn jáde ní èdè Yorùbá òde òní.
- source_word: πρὸς ὥραν
  choice: fún ìgbà díẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí àkókò tó ní ààlà, kì í ṣe wákàtí kan gangan ní dandan.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: nínú ìmọ́lẹ̀ rẹ̀
  rationale: “Nínú ìmọ́lẹ̀ rẹ̀” pa àwòrán èdè ti wíwà nínú tàbí ní ìbáṣepọ̀ pẹ̀lú ìmọ́lẹ̀ Jòhánù mọ́.
theological_decisions:
- issue: Ìyàtọ̀ àpẹẹrẹ láàárín Jòhánù àti Jésù nínú àwòrán ìmọ́lẹ̀ ní Ìhìn Rere Jòhánù
  choice: A pe Jòhánù ní “fìtílà,” kì í ṣe “ìmọ́lẹ̀.”
  alternative: “Òun ni ìmọ́lẹ̀.”
  rationale: Gíríìkì lo λύχνος, kì í ṣe φῶς. Ìyàtọ̀ yìí pa ipò Jòhánù gẹ́gẹ́ bí ẹlẹ́rìí tó ń tan ìmọ́lẹ̀ mọ́, láìdá a pọ̀ mọ́ ẹni tí Ìhìn Rere náà pè ní ìmọ́lẹ̀ tòótọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì gbé àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé gan-an.
