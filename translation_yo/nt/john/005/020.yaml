id: JHN.5.20
reference: John 5:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: yo
  text: Nítorí Baba fẹ́ Ọmọ náà, ó sì ń fi gbogbo ohun tí òun fúnra rẹ̀ ń ṣe hàn án; yóò sì fi àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ hàn án, kí ẹnu yín lè yà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹnu yín yóò yà.” Ìtòlẹ́sẹẹsẹ ἵνα pẹ̀lú subjunctive nínú èdè Gíríìkì lè fi ète hàn; ní àyíká ọ̀rọ̀ yìí, ó tún lè fi ìyàlẹ́nu àwọn olùgbọ́ Jesu hàn gẹ́gẹ́ bí àbájáde.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: nífẹ̀ẹ́
  rationale: Ó sọ ìfẹ́ Baba sí Ọmọ ní èdè Yorùbá àdánidá, láìsọ φιλέω di ìfẹ́ tí ó rẹlẹ̀ ju ἀγαπάω lọ.
- source_word: δείκνυσιν ... δείξει
  choice: ń fi ... hàn ... yóò sì fi ... hàn
  rationale: A pa àsopọ̀ ọ̀rọ̀-ìṣe méjèèjì mọ́, pẹ̀lú ìṣe tí ń lọ lọ́wọ́ àti ọjọ́ iwájú.
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: gbogbo ohun tí òun fúnra rẹ̀ ń ṣe
  rationale: “Gbogbo ohun” mú ìtẹnumọ́ πάντα jáde; “òun fúnra rẹ̀” sì pa ìtẹnumọ́ αὐτός mọ́, nígbà tí “ń ṣe” fi ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: μείζονα τούτων ... ἔργα
  choice: àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ
  rationale: “Àwọn iṣẹ́” bá àṣà ọ̀rọ̀ Johanu mu, ìfiwéra náà sì ṣe kedere àti àdánidá ní Yorùbá.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: kí ẹnu lè yà yín
  rationale: Ìfihàn Yorùbá àdánidá ni fún ìyàlẹ́nu; “kí ... lè” pa ààyè ìtumọ̀ ète tàbí àbájáde tí ἵνα àti ọ̀rọ̀-ìṣe subjunctive ní mọ́.
theological_decisions:
- issue: Irú ìfẹ́ Baba sí Ọmọ tí φιλέω ń sọ
  choice: nífẹ̀ẹ́
  alternative: fẹ́ràn gan-an / ní ìfẹ́ ọkàn sí
  rationale: Nínú Johanu, φιλέω àti ἀγαπάω lè ní ìtumọ̀ tí ó bára mu; “nífẹ̀ẹ́” kò dín ìbáṣepọ̀ Baba àti Ọmọ kù, bẹ́ẹ̀ ni kò fi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọrọ̀ náà kò béèrè sí i.
- issue: Agbára ἵνα ὑμεῖς θαυμάζητε gẹ́gẹ́ bí ète tàbí àbájáde
  choice: kí ẹnu lè yà yín
  alternative: ẹnu yóò yà yín
  rationale: “Kí ... lè” tọ́ka sí ète, ṣùgbọ́n ó tún lè gba àbájáde tí a retí; ó yàgò fún fífi ìtumọ̀ kan ṣoṣo lé Gíríìkì lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye. “Baba” àti “Ọmọ” gba lẹ́tà ńlá nítorí àwọn orúkọ ìbáṣepọ̀ fún Ọlọ́run àti Jesu. “Kí ẹnu lè yà yín” jẹ́ ọ̀nà Yorùbá àdánidá ju ìtumọ̀ gígùn bí “kí ẹ lè ṣe ìyanu” lọ.
