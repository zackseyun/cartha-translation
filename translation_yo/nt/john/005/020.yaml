revisions:
- from: Nítorí Baba nífẹ̀ẹ́ Ọmọ, ó sì ń fi gbogbo ohun tí òun fúnra rẹ̀ ń ṣe hàn án. Yóò sì fi àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ hàn án, kí ẹnu lè yà yín.[a]
  to: Nítorí Baba fẹ́ Ọmọ náà, ó sì ń fi gbogbo ohun tí òun fúnra rẹ̀ ń ṣe hàn án; yóò sì fi àwọn iṣẹ́ tí ó tóbi ju ìwọ̀nyí lọ hàn án, kí ẹnu yín lè yà.[a]
