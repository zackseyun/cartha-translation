  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí[a], àjọ̀dún àwọn Júù kan wà; Jésù sì gòkè lọ sí Jerúsálẹ́m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Lẹ́yìn èyí” tàbí “Lẹ́yìn náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Èyí pa ọ̀pọ̀ nǹkan inú ταῦτα mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti so ìṣẹ̀lẹ̀ tuntun mọ́ ohun tó ṣáájú.
- source_word: ἦν
  choice: wà
  rationale: Ọ̀rọ̀ ìṣe yìí fi hàn pé àjọ̀dún kan ń bẹ ní àkókò náà, ó sì bá ìrísí imperfect ti εἰμί mu.
- source_word: ἑορτὴ
  choice: àjọ̀dún
  rationale: Àjọ̀dún jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ayẹyẹ ẹ̀sìn tàbí ọjọ́ àkànṣe tí àwọn ènìyàn ń ṣe ní àsìkò kan.
- source_word: τῶν Ἰουδαίων
  choice: ti àwọn Júù
  rationale: Ní àyíká yìí, genitive náà ń sọ àwọn ènìyàn tí àjọ̀dún náà jẹ́ tiwọn tàbí tí wọ́n ń ṣe é; kò dá lórí àwọn olùgbé Jùdíà nìkan.
- source_word: ἀνέβη
  choice: gòkè lọ
  rationale: Èyí pa ìtumọ̀ lílọ sókè mọ́, gẹ́gẹ́ bí gíga ilẹ̀ Jerúsálẹ́m àti èdè ìrìn-àjò sí ìlú náà.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́m
  rationale: Èyí ni orúkọ ìlú náà ní ìlò Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn tó yẹ.
theological_decisions:
- issue: Ohun tí Ἰουδαίων ń tọ́ka sí nínú ẹsẹ yìí
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Nítorí pé ọ̀rọ̀ náà ń ṣàpèjúwe àjọ̀dún, ó ṣeé ṣe jù pé ó ń tọ́ka sí àjọ̀dún àwọn Júù gẹ́gẹ́ bí ènìyàn àti ẹ̀sìn wọn, kì í ṣe sí àwọn olùgbé agbègbè Jùdíà nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbéléwọ̀n, ọlọ́lá, tó sì rọrùn fún òǹkàwé òde òní. “Àjọ̀dún kan ti àwọn Júù” yàgò fún ìtumọ̀ àìtọ́ tí “àjọ̀dún àwọn Júù kan” lè ní, bí ẹni pé àwọn Júù díẹ̀ nìkan ni a ń tọ́ka sí.
