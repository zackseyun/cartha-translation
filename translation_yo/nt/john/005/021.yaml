id: JHN.5.21
reference: John 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí Baba ti ń jí àwọn òkú dìde, tí ó sì ń sọ wọ́n di alààyè, bẹ́ẹ̀ náà ni Ọmọ ń sọ àwọn tí ó fẹ́ di alààyè.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” mú agbára àlàyé γάρ jáde, “gẹ́gẹ́ bí” sì bẹ̀rẹ̀ ìfiwéra ὥσπερ ní Yorùbá àdánidá.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Orúkọ oyè fún Ọlọ́run ní àyíká ọ̀rọ̀ yìí; lílo lẹ́tà ńlá ń pa ìtọ́kasí pàtó mọ́.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: ń jí àwọn òkú dìde
  rationale: Ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún jíjí òkú dìde, ó sì pa ìtumọ̀ àjíǹde mọ́.
- source_word: ζῳοποιεῖ
  choice: ń sọ wọ́n di alààyè
  rationale: Ó túmọ̀ sí mímú ẹni di alààyè tàbí fífi ìyè fún un; “wọ́n” tọ́ka sí àwọn òkú ní gbangba, gẹ́gẹ́ bí ìṣètò gírámà Yorùbá ṣe ń béèrè lọ́nà àdánidá.
- source_word: οὕτως καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó tẹ̀síwájú nínú ìfiwéra tó dọ́gba láàárín iṣẹ́ Baba àti ti Ọmọ.
- source_word: ὁ υἱὸς
  choice: Ọmọ
  rationale: Orúkọ oyè Kristẹni ní àyíká ọ̀rọ̀ Jòhánù, tí ó dúró ní ìbámu pẹ̀lú “Baba.”
- source_word: οὓς θέλει
  choice: àwọn tí ó bá fẹ́
  rationale: Ó pa ìfẹ́-inú àti yíyan ẹni mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ relative plural yìí.
- source_word: ζῳοποιεῖ
  choice: ń sọ … di alààyè
  rationale: Àtúnsọ̀rọ̀ kan náà ni a lò fún ìṣẹ̀lẹ̀ kejì láti pa ìfarajọ Baba àti Ọmọ mọ́.
theological_decisions:
- issue: Ìfarajọ Baba àti Ọmọ nínú fífúnni ní ìyè
  choice: 'A pa ìfarajọ tó ṣe kedere mọ́: bí Baba ṣe ń sọ òkú di alààyè, bẹ́ẹ̀ náà ni Ọmọ ń sọ àwọn tí ó bá fẹ́ di alààyè.'
  alternative: Láti tú ọ̀rọ̀ náà ká ní ọ̀nà tí yóò dín agbára ìfarajọ náà kù.
  rationale: Gíríìkì fi iṣẹ́ fífúnni ní ìyè ti Baba àti ti Ọmọ wé ara wọn ní tààràtà; ìtumọ̀ náà kò fi ẹ̀kọ́ míì kún un, bẹ́ẹ̀ ni kò dín ẹ̀rí Kristi rẹ̀ kù.
- issue: θέλει àti ìfẹ́-inú Ọmọ
  choice: àwọn tí ó bá fẹ́
  alternative: àwọn tí ó bá pinnu; àwọn tí ó bá fẹ́ràn
  rationale: “Fẹ́” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ye kedere fún ìfẹ́-inú tàbí ìpinnu, láìsọ ọ̀rọ̀ náà di àtijọ́ tàbí fífi ìtumọ̀ ìfẹ́ni kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A yan “sọ … di alààyè” dípò gbólóhùn tó lè dà bí fífúnni ní ohun kan, kí agbára ζῳοποιεῖ hàn kedere.
