  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbo apá pàtàkì: ìṣètò ìtàn, ibi tẹ́ńpìlì, ìwòsàn tí ó ti ṣẹlẹ̀, àṣẹ pé kí ó má dẹ́ṣẹ̀ mọ́, àti ìkìlọ̀ nípa ohun búburú tí ó lè ṣẹlẹ̀ sí i. Ṣùgbọ́n “ju èyí lọ” ń sọ afíwéra náà di èyí tí a mẹ́nuba ní kedere—ìyẹn, sí àìsàn ìṣáájú—nígbà tí Gíríìkì kan sọ pé “ohun tí ó burú jù” láì sọ ohun tí a ń fi wé e ní tààrà.'
