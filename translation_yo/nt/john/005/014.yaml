id: JHN.5.14
reference: John 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí, Jésù rí i nínú tẹ́ńpìlì, ó sì sọ fún un pé, “Wò ó, ara rẹ ti dá.[a] Má ṣe dẹ́ṣẹ̀ mọ́, kí ohun tó burú sí i má bàa ṣẹlẹ̀ sí ọ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà jù bẹ́ẹ̀ lọ, “o ti di alára-dídá,” èyí tó tẹnu mọ́ ipò ìlera rẹ̀ gẹ́gẹ́ bí àbájáde ohun tó ti ṣẹlẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ìkìlọ̀ yìí kò sọ ní kedere bóyá ẹ̀ṣẹ̀ kan pàtó ló fa àìsàn rẹ̀ tẹ́lẹ̀, bẹ́ẹ̀ ni kò sọ bóyá “ohun tó burú sí i” jẹ́ ìjìyà ayé yìí, ìdájọ́ ìkẹyìn, tàbí àwọn méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nǹkan inú ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ọ̀nà tí Jòhánù fi ń tẹ ìtàn síwájú mu.
- source_word: εὑρίσκει
  choice: rí i
  rationale: A lo ìṣe àtẹ̀yìnwá gẹ́gẹ́ bí ó ti jẹ́ àdánidá nínú ìtàn Yorùbá, bí ó tilẹ̀ jẹ́ pé ìsinsìnyí ìtàn ni Gíríìkì lò.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; “tẹ́ńpìlì” jẹ́ ọ̀rọ̀ kúkúrú tó mọ́gbọ́n dání.
- source_word: Ἴδε
  choice: Wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ ìpe-àkíyèsí tó jẹ́ àdánidá ní Yorùbá, láì ní ohùn àtijọ́.
- source_word: ὑγιὴς γέγονας
  choice: ara rẹ ti dá
  rationale: Ó fi ìyípadà tí ó ti ṣẹlẹ̀ àti ipò ìlera tó ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: μηκέτι ἁμάρτανε
  choice: Má ṣe dẹ́ṣẹ̀ mọ́
  rationale: Ó pa àṣẹ láti jáwọ́ nínú ẹ̀ṣẹ̀ mọ́ láì fi dandan sọ pé ìṣe náà ń lọ lọ́wọ́ nígbà yẹn.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: kí ohun tí ó burú ju èyí lọ má bàa ṣẹlẹ̀ sí ọ
  rationale: Ó sọ ìkìlọ̀ ní Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ ohun búburú tó pọ̀ ju ti tẹ́lẹ̀ lọ mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ẹ̀ṣẹ̀ àti ìjìyà nínú ìkìlọ̀ Jésù
  choice: A túmọ̀ ìkìlọ̀ náà ní tààrà láì sọ pé ẹ̀ṣẹ̀ kan pàtó ló fa àìsàn ọkùnrin náà, tàbí pé irú ìjìyà kan ṣoṣo ni “ohun tí ó burú ju” túmọ̀ sí.
  alternative: A lè ka a sí ìjẹ̀wọ́ pé ẹ̀ṣẹ̀ kan pàtó ló fa àìsàn rẹ̀, tàbí pé ìkìlọ̀ náà ń tọ́ka sí ìjìyà ayé yìí nìkan tàbí ìdájọ́ ìkẹyìn nìkan.
  rationale: Gíríìkì so ìkìlọ̀ lòdì sí ẹ̀ṣẹ̀ pọ̀ mọ́ ewu ohun tó burú jù, ṣùgbọ́n kò ṣàlàyé ohun tó fa àìsàn àkọ́kọ́ tàbí irú ohun búburú náà; ìtumọ̀ náà gbọ́dọ̀ pa àìdájú yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ara rẹ ti dá” jẹ́ àdánidá fún òǹkàwé gbogbo ènìyàn, “Má ṣe dẹ́ṣẹ̀ mọ́” sì pa agbára àṣẹ àti àìdájú apá ìṣe Gíríìkì mọ́.
