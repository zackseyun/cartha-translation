  to: Lẹ́yìn nǹkan wọ̀nyí, Jésù rí i nínú tẹ́ńpìlì, ó sì sọ fún un pé, “Wò ó, ara rẹ ti dá.[a] Má ṣe dẹ́ṣẹ̀ mọ́, kí ohun tó burú sí i má bàa ṣẹlẹ̀ sí ọ.”[b]
