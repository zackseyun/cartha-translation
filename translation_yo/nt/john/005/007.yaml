id: JHN.5.7
reference: John 5:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: yo
  text: Ọkùnrin aláìsàn náà dá a lóhùn pé, “Olúwa, èmi kò ní ẹnikẹ́ni láti fi mi sínú adágún náà nígbà tí omi bá rú; ṣùgbọ́n nígbà tí mo ń bọ̀, ẹlòmíràn máa ń sọ̀kalẹ̀ ṣáájú mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: Ọkùnrin aláìsàn náà
  rationale: Ó túmọ̀ sí ẹni tí àìsàn ń ṣe; fífi ‘ọkùnrin’ hàn bá ẹni tí àyíká ọ̀rọ̀ ń tọ́ka sí mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ náà lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tàbí ìnagijẹ ‘Olúwa’; ‘Olúwa’ pa ìtumọ̀ àti ìfarapamọ́ ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ Gíríìkì mọ́ láìfi àlàyé mìíràn kún un.
- source_word: βάλῃ με
  choice: gbé mi sínú
  rationale: Nínú àyíká yìí, ó ń sọ nípa ríran ẹni tí kò lágbára lọ́wọ́ láti wọ inú adágún; ‘gbé mi sínú’ jẹ́ èdè Yorùbá tó ṣe kedere ju ìtumọ̀ gangan ‘sọ mi sínú’ lọ.
- source_word: κολυμβήθραν
  choice: adágún
  rationale: Ó tọ́ka sí adágún omi tí a ṣe fún wíwẹ̀; ‘adágún’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání nínú àyíká yìí.
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: omi bá rú
  rationale: Ó pa ìtumọ̀ pé omi ń mì tàbí ń dàrú mọ́, ó sì dun bí Yorùbá àdánidá.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγὼ
  choice: ṣùgbọ́n bí mo ṣe ń bọ̀
  rationale: Ó ṣàfihàn pé ní àkókò tí ọkùnrin náà ń gbìyànjú láti dé ibẹ̀, ẹlòmíràn máa ń ṣáájú rẹ̀.
- source_word: καταβαίνει
  choice: a ti sọ̀kalẹ̀
  rationale: ‘Sọ̀kalẹ̀’ tẹ̀lé àwòrán Gíríìkì pé ẹni náà ń lọ sí ìsàlẹ̀ sínú adágún; àmì ‘a’ fi ìṣe tí ó máa ń ṣẹlẹ̀ hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Κύριε
  choice: Olúwa
  alternative: Ọ̀gá / Alàgbà
  rationale: 'A yan ‘Olúwa’ láti pa àfojúsùn ọ̀rọ̀ Gíríìkì àti ìfarapamọ́ rẹ̀ mọ́: ó lè jẹ́ ìkíni ọ̀wọ̀, ó sì tún lè jẹ́ ìnagijẹ tó jinlẹ̀ sí i nínú Ìhìn Rere Jòhánù. A kò fi ìtumọ̀ kan ṣoṣo lé e lórí.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘a ti sọ̀kalẹ̀’ gẹ́gẹ́ bí ìṣe àṣà tí ó máa ń ṣẹlẹ̀, a sì pa ìyàtọ̀ tó wà láàárín ‘Olúwa’ gẹ́gẹ́ bí ọ̀rọ̀ ìbọ̀wọ̀ àti ìnagijẹ ẹ̀sìn mọ́.
