  to: Ẹ ń ṣàwárí àwọn Ìwé Mímọ́, nítorí nínú wọn ni ẹ rò pé ẹ ní ìyè àìnípẹ̀kun;[a] àwọn náà sì ni ń jẹ́rìí nípa mi.
