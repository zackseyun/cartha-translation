source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: yo
  text: Ẹ ń ṣàwárí àwọn Ìwé Mímọ́, nítorí nínú wọn ni ẹ rò pé ẹ ní ìyè àìnípẹ̀kun;[a] àwọn náà sì ni ń jẹ́rìí nípa mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “Ẹ ṣàwárí àwọn Ìwé Mímọ́,” bí a bá ka Ἐραυνᾶτε sí àṣẹ dípò afihàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Ẹ ń ṣàwárí inú
  rationale: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ afihàn (‘ẹ ń ṣàwárí’) tàbí àṣẹ (‘Ẹ ṣàwárí’). Àyíká ọ̀rọ̀ náà tẹ̀ sí afihàn pé Jésù ń ṣàpèjúwe ohun tí àwọn olùgbọ́ rẹ̀ máa ń ṣe; a pa ìtumọ̀ àṣẹ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τὰς γραφάς
  choice: Ìwé Mímọ́
  rationale: Nínú ìlò Jòhánù, ó tọ́ka sí àwọn ìwé mímọ́ Ísírẹ́lì; ‘Ìwé Mímọ́’ ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere tí ó sì bójú mu.
- source_word: ὅτι
  choice: nítorí
  rationale: 'A mú un gẹ́gẹ́ bí atọ́ka ìdí: èrò wọn nípa ìyè àìnípẹ̀kun ni ìdí tí wọn fi ń ṣàwárí inú Ìwé Mímọ́.'
- source_word: δοκεῖτε
  choice: ẹ rò
  rationale: Ó sọ ìgbàgbọ́ tàbí èrò tí wọn ní, pẹ̀lú ìbáwí kékeré tí àyíká ọ̀rọ̀ náà ní, láìfi ohun míì kún un.
- source_word: ἐν αὐταῖς
  choice: inú rẹ̀
  rationale: Ó tọ́ka sí Ìwé Mímọ́ gẹ́gẹ́ bí ibi tí wọn rò pé àwọn ti ní ìyè; lílo arọ́pò-orúkọ ẹyọ bá àṣà Yorùbá mu nígbà tí ‘Ìwé Mímọ́’ jẹ́ àkójọpọ̀ kan.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìyè tí kò ní òpin, ó sì bá gbólóhùn pàtàkì Jòhánù mu.
- source_word: ἐκεῖναί
  choice: àwọn Ìwé Mímọ́ wọ̀nyẹn
  rationale: A tún orúkọ náà sọ dípò arọ́pò-orúkọ nítorí ìtumọ̀ kedere, a sì lo ‘wọ̀nyẹn’ láti pa ìtẹnumọ́ arọ́pò afihan Gíríìkì mọ́.
- source_word: αἱ μαρτυροῦσαι
  choice: ni ó ń jẹ́rìí
  rationale: ‘Jẹ́rìí’ pa àwọ̀ ìtumọ̀ ẹlẹ́rìí tàbí ẹ̀rí nínú Jòhánù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: περὶ ἐμοῦ
  choice: nípa mi
  rationale: ‘Nípa mi’ jẹ́ ìtumọ̀ Yorùbá tààrà àti àdánidá fún περί pẹ̀lú ọ̀rọ̀-orúkọ oníṣe genitive níbí.
theological_decisions:
- issue: Ìṣesí ọ̀rọ̀-ìṣe Ἐραυνᾶτε
  choice: 'Afihàn: ‘Ẹ ń ṣàwárí inú Ìwé Mímọ́’'
  alternative: 'Àṣẹ: ‘Ẹ ṣàwárí inú Ìwé Mímọ́’'
  rationale: Ìrísí Gíríìkì náà lè jẹ́ afihàn tàbí àṣẹ. Àyíká ẹsẹ yìí àti àwọn ẹsẹ tó tẹ̀ lé e mú kí afihàn ṣeé ṣe jù, nítorí Jésù ń ṣàpèjúwe bí wọn ṣe ń ṣàwárí Ìwé Mímọ́ ṣùgbọ́n tí wọn kò wá sọ́dọ̀ rẹ̀. A fi àṣàyàn àṣẹ sínú àlàyé ìsàlẹ̀ kí a má bàa mú àìdánilójú tó wà nínú orísun kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó lóye fún òǹkàwé òde òní, ó sì lo arọ́pò ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀.
