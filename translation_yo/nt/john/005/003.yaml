  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: yo
  text: Nínú wọn ni ọ̀pọ̀ àwọn aláìsàn dùbúlẹ̀—àwọn afọ́jú, àwọn arọ, àti àwọn tí ẹ̀yà ara wọn rọgbẹ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ẹ̀yà ara wọn gbẹ.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “gbẹ” tàbí “rọgbẹ,” ó sì lè tọ́ka sí ọwọ́, ẹsẹ̀, tàbí ẹ̀yà ara mìíràn tí ó rọgbẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: Nínú àwọn wọ̀nyí
  rationale: Ó pa ọ̀rọ̀-arọ́pò-orúkọ abo ọ̀pọ̀ mọ́, ó sì jẹ́ kí ohun tí ó ń tọ́ka sí—àwọn ẹnu-ọ̀nà abẹ́lé tí ẹsẹ tó ṣáájú mẹ́nu kàn—hàn láti inú àyíká ọ̀rọ̀ láìfi orúkọ tí kò sí nínú Gíríìkì kún un.
- source_word: κατέκειτο
  choice: dùbúlẹ̀ sí
  rationale: Àìpé ọ̀rọ̀-ìṣe náà ń ṣàpèjúwe bí wọ́n ṣe wà níbẹ̀ ní ipò ìdùbúlẹ̀; ‘dùbúlẹ̀ sí’ jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: πλῆθος
  choice: ọ̀pọ̀
  rationale: Ó sọ iye ńlá kan ní ọ̀nà tí ó ṣe kedere, tí ó sì wọ́pọ̀ ní Yorùbá òde òní, láìfi èrò pé wọ́n jẹ́ àwùjọ tí ń rìn tàbí tí ó péjọ fún ayẹyẹ kún un.
- source_word: τῶν ἀσθενούντων
  choice: àwọn aláìsàn
  rationale: Nínú àyíká yìí, participle náà tọ́ka sí àwọn tí àìsàn tàbí àìlera ara ń ṣe, kì í ṣe àìlera ìwà tàbí ti ẹ̀mí.
- source_word: τυφλῶν
  choice: àwọn afọ́jú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tààrà fún àwọn tí kò ríran, ó sì bá àtòjọ àwọn ipò ara mu.
- source_word: χωλῶν
  choice: àwọn arọ
  rationale: ‘Arọ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí àìlera ẹsẹ̀ tàbí ìrìn ń ṣe, ó sì túmọ̀ χωλός ní tààrà.
- source_word: ξηρῶν
  choice: àwọn tí ẹ̀yà ara wọn rọ
  rationale: Ní ti ara, ξηρός túmọ̀ ní pàtó sí ‘gbẹ’ tàbí ‘rẹ̀’; gbólóhùn yìí sọ àbájáde ìṣiṣẹ́ ẹ̀yà ara ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá, a sì pa ìtẹ̀sí àtòjọ Gíríìkì mọ́.
