id: JHN.5.6
reference: John 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: yo
  text: Nígbà tí Jésù rí ọkùnrin yìí tí ó dùbúlẹ̀, tí ó sì mọ̀ pé ọkùnrin náà ti ní àìlera náà fún ìgbà pípẹ́[a], ó bi í pé, “Ṣé o fẹ́ kí ara rẹ̀ yá?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé ó ti wà níbẹ̀ fún ìgbà pípẹ́.”
    reason: Gbólóhùn Gíríìkì náà jẹ́ ọ̀rọ̀ àkànlò; ní àyíká rẹ̀ ó sún mọ́ bí àìlera ọkùnrin náà ti pé, ṣùgbọ́n a tún lè ka a sí bí ó ti pé ní ibi náà.
lexical_decisions:
- source_word: τοῦτον
  choice: ọkùnrin yìí
  rationale: Ọ̀rọ̀ arọ́pò-ìtọ́ka náà ń tọ́ka sí ọkùnrin aláìlera tí àyíká ẹsẹ̀ náà ti sọ̀rọ̀ nípa rẹ̀; fífi ‘ọkùnrin’ kún un mú ìtọ́kasí náà ṣe kedere, ó sì bá Yorùbá àdánidá mu.
- source_word: ἰδὼν
  choice: Nígbà tí Jésù rí
  rationale: A tú participle aorist náà sí gbólóhùn àsìkò láti fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn ní Yorùbá àdánidá.
- source_word: κατακείμενον
  choice: tí ó dùbúlẹ̀
  rationale: ‘Dùbúlẹ̀’ fi ipò ara ọkùnrin náà hàn ní ṣókí, láìfi ọ̀nà tàbí ìdí tí ó fi wà ní ipò náà kún ẹsẹ̀.
- source_word: γνοὺς
  choice: tí ó sì mọ̀
  rationale: Èyí sọ ìmọ̀ Jésù ní tààrà, ṣùgbọ́n kò sọ bóyá ó mọ̀ ọ́n ní ọ̀nà àrà ọ̀tọ̀ tàbí nípasẹ̀ ìròyìn tàbí àkíyèsí.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: ó ti wà níbẹ̀ fún ìgbà pípẹ́
  rationale: Gíríìkì jẹ́ ọ̀rọ̀ àkànlò tí ohun tí àkókò náà kan kò fara hàn ní kíkún. Ìtumọ̀ yìí bá ibi ìṣẹ̀lẹ̀ lẹ́gbẹ̀ẹ́ adágún mu; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ míì tí ó lè tọ́ka sí àìlera rẹ̀ mọ́.
- source_word: λέγει αὐτῷ
  choice: ó bi í pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní present historical, past narrative ni Yorùbá ń lò ní àdánidá. Nítorí ohun tí ó tẹ̀ lé e jẹ́ ìbéèrè, ‘ó bi í pé’ ṣe kedere ju ‘ó sọ fún un pé’ lọ.
- source_word: Θέλεις
  choice: Ṣé o fẹ́
  rationale: Èyí mú ìfẹ́ tàbí ìmúratán tí θέλω lè túmọ̀ sí jáde ní ọ̀nà tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: ὑγιὴς γενέσθαι
  choice: kí ara rẹ̀ dá
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí wíwá sí ipò ìlera, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìbéèrè nípa yíyá kúrò nínú àìlera. Ó yàgò fún ọ̀rọ̀ oníṣègùn tàbí èrò ẹ̀kọ́ ìsìn tí kò sí nínú Gíríìkì.
theological_decisions:
- issue: Irú ìmọ̀ tí γνοὺς ń sọ nípa Jésù
  choice: A sọ pé Jésù mọ̀, láìṣàlàyé ọ̀nà tí ó gbà mọ̀.
  alternative: Láti sọ pé ó mọ̀ nípasẹ̀ agbára àrà ọ̀tọ̀, tàbí pé ó gbọ́ tàbí ṣàkíyèsí rẹ̀ lọ́nà ti ẹ̀dá.
  rationale: Ẹsẹ̀ náà sọ pé Jésù mọ̀ pé ọkùnrin náà ti pé ní ipò yìí, ṣùgbọ́n kò sọ ibi tí ìmọ̀ náà ti wá. Ìtumọ̀ kò gbọ́dọ̀ pinnu ohun tí ọ̀rọ̀ náà kò pinnu.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. ‘Ṣé’ jẹ́ àmì ìbéèrè tí ó wọ́pọ̀, tí ó sì mú ọ̀rọ̀ Jésù dún bí ìbéèrè tààrà ní Yorùbá àdánidá.
