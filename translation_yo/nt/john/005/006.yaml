  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìṣe Jésù—rí ọkùnrin náà, mímọ̀ ìpò rẹ̀, àti bíbèèrè lọ́wọ́ rẹ̀—jáde dáadáa. Síbẹ̀, πολὺν ἤδη χρόνον ἔχει, ní àyíká ẹsẹ̀ 5, ń tọ́ka ní àkọ́kọ́ sí bí àìlera ọkùnrin náà ti pé; ‘ó ti wà níbẹ̀’ jẹ́ ìtumọ̀ àyíká tí ó ṣeé ṣe ṣugbọn kì í ṣe èyí tó súnmọ́ ìfarahàn Gíríìkì jù lọ. A ti mú ìtumọ̀ àìlera náà wá sí ọ̀rọ̀ pàtàkì, a sì fi ìtumọ̀ ibi sí ìsàlẹ̀ ojú ìwé.
  naturalness: ‘Kí ara rẹ̀ dá’ lè yéni, ṣùgbọ́n ‘kí ara rẹ̀ yá’ jẹ́ ọ̀nà Yorùbá òde òní tí ó mọ́gbọ́n dání láti sọ ìpadàbọ̀ sí ìlera, ó sì ń hàn ìtumọ̀ ìbẹ̀rẹ̀-tuntun ti γενέσθαι. Fífún ‘ọkùnrin náà’ ní gbangba nínú gbólóhùn pé ó ti pé nínú àìlera tún yẹra fún àìdánilójú pé ta ni ‘ó’ ń tọ́ka sí.
  terminology: Jésù, àìlera, àti ìbéèrè ìlera náà wà ní ìforúkọsílẹ̀ tó yẹ fún Yorùbá boṣewa. Ìtumọ̀ náà kò sọ ọ̀nà tí Jésù gbà mọ̀, kò sì fi ẹ̀kọ́ ìsìn kún un.
  issues:
