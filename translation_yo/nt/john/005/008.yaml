  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: yo
  text: Jésù wí fún un pé, “Dìde, gbé àkéte rẹ[a], kí o sì rìn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibùsùn rẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àkéte tàbí ibùsùn kékeré tí ènìyàn ń sùn lé, kì í ṣe dandan ibùsùn ńlá.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: wí
  rationale: Ọ̀rọ̀ yìí ń pa ìsinsìnyí ìtàn Gíríìkì mọ́ láìfi àkókò tí kò sí nínú ọ̀rọ̀ ìpilẹ̀ kún un; ó sì bá ìforúkọsílẹ̀ ọlọ́lá mu.
- source_word: αὐτῷ
  choice: fún un
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ẹni tí Jésù ń bá sọ̀rọ̀.
- source_word: Ἔγειρε
  choice: Dìde
  rationale: Àṣẹ tààrà ni fún ọkùnrin náà láti dìde kúrò níbi tí ó dùbúlẹ̀; kò fi ọ̀rọ̀ ìwòsàn tí kò sí nínú ẹsẹ yìí kún un.
- source_word: ἆρον
  choice: gbé
  rationale: Ó túmọ̀ sí láti gbé ohun náà sókè tàbí mú un; ‘gbé’ ṣe kedere, ó sì bá ohun tí a lè rù mu.
- source_word: κράβαττόν
  choice: àkéte
  rationale: Ọ̀rọ̀ Gíríìkì ń tọ́ka sí ohun ìtẹ́lẹ̀ rírọ̀ tí ó rọrùn láti gbé, kì í ṣe dandan ibùsùn ńlá; ‘àkéte’ jẹ́ ọ̀rọ̀ Yorùbá tí ó bá àyíká yìí mu.
- source_word: περιπάτει
  choice: máa rìn
  rationale: Níhìn-ín ó ń tọ́ka sí rírìn ní ti ara. ‘Máa rìn’ jẹ́ àṣẹ Yorùbá àdánidá, ó sì jẹ́ kí ìṣe rírìn náà hàn láìfi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Irú àṣẹ Jésù nínú àyíká ìwòsàn
  choice: 'A túmọ̀ àwọn àṣẹ mẹ́tẹ̀ẹ̀ta gẹ́gẹ́ bí àṣẹ ti ara tààrà: dìde, gbé àkéte, kí ó sì máa rìn.'
  alternative: “Dìde, kí a sì mú ọ láradá,” tàbí ọ̀rọ̀ míì tí ó sọ ìwòsàn ní gbangba.
  rationale: Ìwòsàn hàn gbangba nínú àyíká náà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ọ́ nínú àwọn àṣẹ náà; nítorí náà a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa ọlọ́lá, tí ó ṣe kedere fún òǹkàwé òde òní. A lo “wí” fún ìtàn tí ó ní ìwọ̀ntúnwọ̀nsì, “àkéte” fún ohun ìsùn tí ó ṣeé gbé, àti àwọn àmì ohùn níbi tí wọ́n ti yẹ.
