  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ náà fara mọ́ Gíríìkì dáadáa: ‘Bí ... bá,’ ‘èmi,’ ‘ń jẹ́rìí nípa ara mi,’ àti ‘ẹ̀rí mi kì í ṣe òtítọ́’ ń pa ìtumọ̀ àti ìtẹnumọ́ gbólóhùn náà mọ́. Ìtumọ̀ pàtàkì náà kò yanju ìfẹ̀sẹ̀mulẹ̀ àríyànjiyàn ọ̀rọ̀ ẹlẹ́rìí nípa fífi ìtumọ̀ òfin dáradára rọ́pò ‘òtítọ́.’'
