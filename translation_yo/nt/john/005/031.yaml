  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: yo
  text: “Bí èmi bá ń jẹ́rìí nípa ara mi, ẹ̀rí mi kì í ṣe òtítọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rí mi kò gbéṣẹ́,” ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ òfin nípa ẹ̀rí àwọn ẹlẹ́rìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Bí ... bá
  rationale: Ó fi gbólóhùn oníwà-ìfẹ̀hónúhàn hàn lọ́nà àdánidá ní Yorùbá, láì fi ìtumọ̀ ‘nígbàkúùgbà’ kún un.
- source_word: ἐγὼ
  choice: èmi
  rationale: A pa arọ́pò-orúkọ tí a tẹnumọ́ nínú Gíríìkì mọ́, kí ìtẹnumọ́ díẹ̀ lórí ẹni tí ń sọ̀rọ̀ lè hàn.
- source_word: μαρτυρῶ
  choice: ń jẹ́rìí
  rationale: ‘Jẹ́rìí’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, ó sì pa ìtumọ̀ fífi ẹ̀rí hàn, pẹ̀lú àwọ̀ òfin rẹ̀, mọ́.
- source_word: περὶ ἐμαυτοῦ
  choice: nípa ara mi
  rationale: Èyí túmọ̀ ‘nípa/tí ó kan ara mi’ ní tààrà, láì yí i sí ‘ní àtìlẹ́yìn fún ara mi,’ èyí tí yóò fi ìtumọ̀ òfin kún un ju bó ṣe yẹ lọ.
- source_word: ἡ μαρτυρία μου
  choice: ẹ̀rí mi
  rationale: ‘Ẹ̀rí’ jẹ́ ọ̀rọ̀ àdánidá fún testimony ní Yorùbá, ó sì bá ‘jẹ́rìí’ mu gẹ́gẹ́ bí ọ̀rọ̀ ìdílé kan náà ní ìtumọ̀.
- source_word: οὐκ ἔστιν ἀληθής
  choice: kì í ṣe òtítọ́
  rationale: Èyí pa agbára tààrà ti ἀληθής (‘òtítọ́’) mọ́, kò sì dín un kù sí ìtumọ̀ òfin nìkan bí ‘kò lẹ́tọ̀ọ́’ tàbí ‘kò ní ìmúṣẹ.’
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Jésù pé ẹ̀rí rẹ̀ ‘kì í ṣe òtítọ́’
  choice: A túmọ̀ ọ́ ní tààrà sí ‘ẹ̀rí mi kì í ṣe òtítọ́,’ kí ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ náà lè dúró.
  alternative: ‘ẹ̀rí mi kò ní ìmúṣẹ’ tàbí ‘a kò lè gba ẹ̀rí mi gẹ́gẹ́ bí ẹ̀rí tó pé’
  rationale: Gíríìkì lo ἀληθής (‘òtítọ́’). Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ nípa ẹlẹ́rìí lè tọ́ka sí bóyá ẹ̀rí ní ìmúṣẹ lábẹ́ òfin, kò yẹ kí ìtumọ̀ pàtàkì yanjú ìṣòro náà nípa fífi ìtumọ̀ òfin tóóró rọ́pò ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá ìṣedéédé òde òní pẹ̀lú àmì ohùn kíkún; èdè náà níyì, ó sì ṣe kedere fún òǹkàwé lásán. A lo ‘jẹ́rìí’ àti ‘ẹ̀rí’ láti pa àwọ̀ ọ̀rọ̀ ẹlẹ́rìí àti ti òfin mọ́ láì jẹ́ kí gbólóhùn náà di èdè òfin líle.
