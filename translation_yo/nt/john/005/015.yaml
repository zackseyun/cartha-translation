id: JHN.5.15
reference: John 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: yo
  text: Ọkùnrin náà lọ, ó sì ròyìn fún àwọn Júù pé Jésù ni ẹni tí ó mú un láradá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aṣáájú Júù,” tàbí “àwọn ará Jùdíà,” ní ìbámu pẹ̀lú bí a ṣe lóye lílo ọ̀rọ̀ “àwọn Júù” nínú Jòhánù ní àyíká ọ̀rọ̀ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: kúrò níbẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífi ibi ìṣẹ̀lẹ̀ sílẹ̀; ‘kúrò níbẹ̀’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìṣípò mọ́.
- source_word: ὁ ἄνθρωπος
  choice: Ọkùnrin náà
  rationale: Ó tọ́ka sí ọkùnrin tí a mú láradá nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἀνήγγειλεν
  choice: ròyìn fún
  rationale: ἀναγγέλλω lè túmọ̀ sí jíṣẹ́, kéde, tàbí ròyìn; ‘ròyìn fún’ bá fífi ìsọfúnni náà dé ọ̀dọ̀ àwọn Júù mu láìfi ìtumọ̀ ìkéde gbangba kún un.
- source_word: τοῖς Ἰουδαίοις
  choice: fún àwọn Júù
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì náà mọ́ láìdín ìtumọ̀ rẹ̀ sí àwọn aṣáájú Júù nìkan; àlàyé ìtumọ̀ míì wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: ὅτι
  choice: pé
  rationale: Àsopọ̀ àdánidá ní Yorùbá fún ṣíṣàgbékalẹ̀ ohun tí ọkùnrin náà ròyìn.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Ìkọ̀wé orúkọ náà ní ìlànà Yorùbá tí ó wọ́pọ̀.
- source_word: ἐστιν
  choice: ni
  rationale: ‘Ni’ jẹ́ àsopọ̀ ìdánimọ̀ àdánidá ní Yorùbá, kò sì pọn dandan láti fi àkókò ìṣe hàn bí Gíríìkì ṣe lo present tense.
- source_word: ὁ ποιήσας
  choice: ẹni tí ó mú
  rationale: Ó fi Jésù hàn gẹ́gẹ́ bí olùṣe ìṣe tí ó ti ṣẹlẹ̀ ṣáájú ìròyìn náà, ó sì pa ìtumọ̀ ποιέω mọ́.
- source_word: αὐτὸν ὑγιῆ
  choice: un láradá
  rationale: ‘Mú un láradá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a mú kí ara rẹ̀ dá, ó sì bá àyíká ìwòsàn mu.
theological_decisions:
- issue: Ẹni tí ‘àwọn Júù’ ń tọ́ka sí nínú Ìhìn Rere Jòhánù
  choice: Pa ‘àwọn Júù’ mọ́ nínú ọ̀rọ̀ pàtàkì, kí a sì ṣàlàyé àwọn ìtumọ̀ àyíká ọ̀rọ̀ nínú àkọsílẹ̀ ìsàlẹ̀.
  alternative: ‘Àwọn aṣáájú Júù’ tàbí ‘àwọn ará Jùdíà.’
  rationale: τοῖς Ἰουδαίοις kò sọ ‘àwọn aṣáájú’ ní tààrà, bí ó tilẹ̀ jẹ́ pé lílo ọ̀rọ̀ náà nínú Jòhánù lè tọ́ka sí àwọn aláṣẹ Júù ní àyíká kan. Ìtumọ̀ pàtàkì kò gbọ́dọ̀ yanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ní rọrùn. A lo ‘sì’ láti pa ìṣàn ìtàn καί mọ́, a sì lo ‘mú un láradá’ gẹ́gẹ́ bí gbólóhùn ìwòsàn àdánidá.
