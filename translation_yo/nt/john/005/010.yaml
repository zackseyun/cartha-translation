id: JHN.5.10
reference: John 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: yo
  text: Nígbà náà, àwọn Júù[a] ń sọ fún ọkùnrin tí a ti wò sàn náà pé, “Ọjọ́ Ìsinmi ni; kò sì bófin mu fún ọ láti gbé[b] àkéte rẹ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “àwọn olórí Júù” tàbí “àwọn ará Jùdíà,” gẹ́gẹ́ bí ọ̀nà tí Jòhánù gbà lo ọ̀rọ̀ náà níhìn-ín.
    reason: alternative_reading
  - marker: b
    text: Tàbí “gbé sókè” tàbí “kó àkéte rẹ.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ tí a tú sí “àkéte” ń tọ́ka sí ohun ìtẹ́lẹ̀ fún sísùn tí a lè gbé kiri, kì í ṣe dandan ibùsùn ńlá.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Ìṣe aláìparí náà ń fi ọ̀rọ̀ tí ó ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra hàn; “ń sọ” mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìṣẹ̀lẹ̀ tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ taara ti ọ̀rọ̀ Gíríìkì. Ẹsẹ yìí fúnra rẹ̀ kò dín àwọn tí a ń tọ́ka sí kù sí àwọn olórí Júù tàbí àwọn ará Jùdíà nìkan.
- source_word: τῷ τεθεραπευμένῳ
  choice: fún ọkùnrin tí a ti mú lára dá náà
  rationale: Apá ọ̀rọ̀ perfect passive fi ìwòsàn tí ó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì ṣì dúró hàn. “Ọkùnrin” bá ẹni tí àyíká ọ̀rọ̀ ń tọ́ka sí mu.
- source_word: Σάββατόν ἐστιν
  choice: Ọjọ́ Ìsinmi ni òní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ọjọ́ Sábáàtì ni ọjọ́ náà, láìfi ìtumọ̀ àìlópó kún un.
- source_word: οὐκ ἔξεστίν σοι
  choice: kò bófin mu fún ọ
  rationale: Ó pa ìtumọ̀ ohun tí òfin tàbí àṣẹ ẹ̀sìn kò fàyè gbà mọ́, ó sì bá àríyànjiyàn nípa pípa Ọjọ́ Ìsinmi mọ́ mu.
- source_word: ἆραι
  choice: láti gbé
  rationale: αἴρω lè túmọ̀ sí gbé sókè, gbé, tàbí kó lọ. Níhìn-ín, “gbé” pa ìtumọ̀ náà mọ́ láìfi bóyá gbígbé sókè ni tàbí gbígbé kiri ṣe pàtó ju orísun lọ.
- source_word: κράβαττον
  choice: àkéte
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun ìtẹ́lẹ̀ kékeré tí a lè gbé kiri fún sísùn, kì í ṣe dandan ibùsùn ńlá tàbí ibùsùn oníférémù.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú ìwé Jòhánù
  choice: àwọn Júù
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: A pa ọ̀rọ̀ orísun mọ́ nítorí ẹsẹ yìí kò sọ ní pàtó pé àwọn olórí ni tàbí pé ìtumọ̀ àgbègbè Jùdíà nìkan ni. Àlàyé ìsàlẹ̀ jẹ́ kí àwọn ìtumọ̀ mìíràn tó ṣeé ṣe hàn láìyanju àríyànjiyàn náà ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá àtẹ̀jáde tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà ní ibi tí wọ́n ti jẹ́ àdánidá. “Ọjọ́ Ìsinmi” jẹ́ ọ̀rọ̀ tí ó mọ́gbọ́n dání fún Sábáàtì nínú àyíká ẹsẹ yìí, “kò bófin mu” sì pa ìrísí òfin àti ẹ̀sìn ti ἔξεστιν mọ́.
