  to: Nígbà náà, àwọn Júù[a] ń sọ fún ọkùnrin tí a ti wò sàn náà pé, “Ọjọ́ Ìsinmi ni; kò sì bófin mu fún ọ láti gbé[b] àkéte rẹ[c].”
