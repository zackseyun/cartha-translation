id: JHN.5.34
reference: John 5:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: yo
  text: Ṣùgbọ́n èmi kò gba ẹ̀rí láti ọ̀dọ̀ ènìyàn; kàkà bẹ́ẹ̀, mo sọ nǹkan wọ̀nyí kí ẹ̀yin lè rí ìgbàlà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: láti ọ̀dọ̀ ènìyàn
  rationale: Παρά pẹ̀lú ẹ̀yà genitive ń tọ́ka sí orísun. “Láti ọ̀dọ̀ ènìyàn” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ẹ̀rí náà wá láti ọ̀dọ̀ ènìyàn, ó sì pa ẹyọ ἀνθρώπου mọ́ láì sọ ọ́ di ẹni pàtó kan.
- source_word: μαρτυρίαν
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” túmọ̀ sí ohun tí a jẹ́rìí sí, ó sì bá àyíká ọ̀rọ̀ nípa jíjẹ́rìí mu; kò dà á pọ̀ mọ́ ẹni tí ń jẹ́rìí.
- source_word: λαμβάνω
  choice: gba
  rationale: “Gba” jẹ́ ìbámu tààrà àti àdánidá fún λαμβάνω nínú gbólóhùn “gba ẹ̀rí,” ó sì pa ìgbà ìsinsìnyí mọ́.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ọ̀pọ̀ neuter demonstrative mọ́ ní Yorùbá, dípò fífi í rọ̀ sí “èyí.”
- source_word: λέγω
  choice: mo sọ
  rationale: “Mo sọ” jẹ́ ọ̀nà Yorùbá àdánidá fún present indicative ní àyíká yìí, pẹ̀lú nǹkan tí a sọ gẹ́gẹ́ bí object.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: kí ẹ̀yin lè rí ìgbàlà
  rationale: “Kí ... lè” mú ète ἵνα jáde, “ẹ̀yin” sì pa ìtẹnumọ́ explicit ὑμεῖς mọ́. “Rí ìgbàlà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò sọ ìgbàlà di ìdásílẹ̀ ti ara nìkan tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- source_word: δὲ ... ἀλλὰ
  choice: Ṣùgbọ́n ... kàkà bẹ́ẹ̀
  rationale: 'Àkójọpọ̀ yìí mú ìtakora náà hàn gbangba: Jésù kọ́ pé ó gbára lé ẹ̀rí ènìyàn, lẹ́yìn náà ó sọ ète tí ó fi ń sọ àwọn nǹkan wọ̀nyí.'
theological_decisions:
- issue: Ìtumọ̀ “σωθῆτε” nínú àyíká ọ̀rọ̀
  choice: kí ẹ̀yin lè rí ìgbàlà
  alternative: kí a lè gbà yín là
  rationale: A pa ìtumọ̀ ìgbàlà tó gbòòrò mọ́ láì dín in kù sí ìdásílẹ̀ kúrò nínú ewu ti ara, láì sì fi àwòṣe ẹ̀kọ́ ìgbàgbọ́ ẹ̀ya ìjọ kan lé e lórí. Àṣàyàn míì lè mú passive Gíríìkì jáde sí i, ṣùgbọ́n ó lè dà bí ìgbàlà kúrò nínú ewu ojú ara ní Yorùbá.
translation_notes:
  register: Yorùbá àkọ́ṣe, ọ̀wọ̀, àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ẹ̀yin” mú ìtẹnumọ́ orúkọ-arọ́pò explicit nínú Gíríìkì hàn; “kàkà bẹ́ẹ̀” sì jẹ́ kí ìyípadà láti ìkọ̀sí ète gbọ́dọ̀ ṣe kedere.
