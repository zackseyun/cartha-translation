id: JHN.5.36
reference: John 5:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: yo
  text: Ṣùgbọ́n èmi ní ẹ̀rí tí ó tóbi ju ti Jòhánù lọ, nítorí àwọn iṣẹ́ tí Baba ti fi fún mi láti mú wọn parí—àwọn iṣẹ́ wọ̀nyí gan-an tí mo ń ṣe—ń jẹ́rìí nípa mi pé Baba ti rán mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρίαν
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìjẹ́rìí tàbí ohun tí ń fi òtítọ́ múlẹ̀; ó sì bá àyíká ọ̀rọ̀ nípa fífi ẹni tí Jésù jẹ́ múlẹ̀ mu.
- source_word: μείζω τοῦ Ἰωάννου
  choice: tí ó tóbi ju ti Jòhánù lọ
  rationale: 'Èyí pa ìfiwéra àti àfojúdi gíríìkì mọ́: “ti Jòhánù” ń tọ́ka sí ẹ̀rí Jòhánù láìfi àlàyé tí kò sí nínú ọ̀rọ̀ kún un.'
- source_word: ἔργα
  choice: àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” lè gba gbogbo iṣẹ́ tí Baba gbé lé Jésù lọ́wọ́, títí kan àwọn àmì rẹ̀, láìdín ìtumọ̀ rẹ̀ kù sí iṣẹ́ ìyanu nìkan.
- source_word: δέδωκέν μοι
  choice: ti fi fún mi
  rationale: Ìṣe àṣekágbá náà fi hàn pé Baba ti fi àwọn iṣẹ́ náà fún un, ipa fífún náà sì ṣì wà; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: “Baba” pa orúkọ oyè ìbáṣepọ̀ náà mọ́ láìṣàfikún “Ọlọ́run” tàbí “Baba mi,” èyí tí kò sí ní kedere nínú gíríìkì.
- source_word: ἵνα τελειώσω αὐτά
  choice: láti parí
  rationale: “Láti parí” sọ ète tí Baba fi àwọn iṣẹ́ náà fún Jésù, ó sì pa ìtumọ̀ mímú wọn dé òpin mọ́.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: àwọn iṣẹ́ wọ̀nyí gan-an tí mo ń ṣe
  rationale: “Gan-an” mú ìtẹnumọ́ αὐτά jáde, “mo ń ṣe” sì fi ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: ń jẹ́rìí nípa mi
  rationale: Gbólóhùn yìí pa àwòrán ẹ̀rí ìdájọ́ àti ìtumọ̀ fífi òtítọ́ nípa Jésù múlẹ̀ mọ́.
- source_word: ἀπέσταλκεν
  choice: ni ó rán mi
  rationale: Ìtẹnumọ́ “ni ó” jẹ́ kí Baba hàn gẹ́gẹ́ bí ẹni tí ó rán Jésù; ọ̀rọ̀ náà sì dúró ní Yorùbá àdánidá láìsọ agbára ìránṣẹ́ náà di ohun tí ó ti kọjá tán.
theological_decisions:
- issue: Irú ẹ̀rí tí ń fi ẹni tí Jésù jẹ́ múlẹ̀
  choice: Àwọn iṣẹ́ tí Baba fi fún Jésù ni ẹ̀rí tí ó ga ju ti Jòhánù lọ, wọ́n sì fi hàn pé Baba ni ó rán an.
  alternative: Kí a túmọ̀ àwọn iṣẹ́ náà sí iṣẹ́ ìyanu nìkan tí ń fi àṣẹ hàn.
  rationale: ἔργα gbòòrò ju iṣẹ́ ìyanu nìkan lọ nínú Jòhánù; ìtumọ̀ náà kò dín iṣẹ́ tí Ọlọ́run gbé lé Jésù lọ́wọ́ kù.
- issue: Ìtumọ̀ ὁ πατήρ ní ìbáṣepọ̀ pẹ̀lú Jésù
  choice: Baba
  alternative: Ọlọ́run; Baba mi
  rationale: Gíríìkì ní “Baba” gẹ́gẹ́ bí orúkọ oyè, kò sì ní arọ́pò-orúkọ ohun-ìní níbí; nítorí náà, a kò fi ohun tí kò sí kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe “àwọn iṣẹ́ wọ̀nyí gan-an” pa ìtẹnumọ́ ọ̀rọ̀ gíríìkì mọ́, àmì gígùn sì mú ìdákẹ́jẹ inú gbólóhùn hàn kedere.
