id: JHN.5.22
reference: John 5:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: yo
  text: Nítorí Baba kì í ṣe ìdájọ́ ẹnikẹ́ni, ṣùgbọ́n ó ti fi gbogbo ìdájọ́ fún Ọmọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ọ̀rọ̀ tó ṣáájú; ‘Nítorí’ jẹ́ ọ̀nà àdánidá láti mú ipa γάρ jáde, nígbà tí àìfarahàn οὐδέ wà nínú gbólóhùn odi náà.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Nínú àyíká Jòhánù, èyí jẹ́ orúkọ oyè fún Ọlọ́run nínú ìbáṣepọ̀ rẹ̀ pẹ̀lú Ọmọ; lẹ́tà ńlá ń fi oyè náà hàn.
- source_word: κρίνει
  choice: ṣe ìdájọ́
  rationale: Ìṣe àkókò ìsinsìnyí ń sọ òtítọ́ gbogbogbò; ‘ṣe ìdájọ́’ kò dín ìtumọ̀ náà kù sí fífi ẹ̀bi kan ẹni nìkan, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú κρίσιν.
- source_word: οὐδένα
  choice: ẹnikẹ́ni
  rationale: Pẹ̀lú ‘kì í’, ọ̀rọ̀ yìí ń sọ àìsí ẹnikẹ́ni pátápátá ní Yorùbá àdánidá.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín pé Baba kì í ṣe ìdájọ́ ẹnikẹ́ni àti pé ó fi gbogbo ìdájọ́ fún Ọmọ.
- source_word: τὴν κρίσιν πᾶσαν
  choice: gbogbo ìdájọ́
  rationale: Ó pa orúkọ ‘ìdájọ́’ àti ìkúnrẹ́rẹ́ πᾶσαν mọ́, láì ṣàfikún ‘àṣẹ láti ṣe ìdájọ́’ tí ó jẹ́ àlàyé ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: δέδωκεν
  choice: ó ti fi ... fún
  rationale: ‘Ó ti fi ... fún’ ń mú ìṣe tí a ti parí tí àbájáde rẹ̀ sì dúró títí di ìsinsìnyí jáde, gẹ́gẹ́ bí perfect tense Gíríìkì.
- source_word: τῷ υἱῷ
  choice: Ọmọ
  rationale: Gíríìkì ní article ṣùgbọ́n kò ní arọ́pò-orúkọ ohun-ìní; ‘Ọmọ’ pẹ̀lú lẹ́tà ńlá ń pa oyè Kristi mọ́ láì ṣàfikún ‘Ọmọ rẹ̀.’
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìdájọ́ Baba àti ìdájọ́ Ọmọ
  choice: 'A túmọ̀ gbólóhùn náà ní tààràtà: Baba kì í ṣe ìdájọ́ ẹnikẹ́ni, ṣùgbọ́n ó ti fi gbogbo ìdájọ́ fún Ọmọ.'
  alternative: Kí a ṣàlàyé rẹ̀ sí ‘Baba kì í dá ẹnikẹ́ni lẹ́jọ́ láìsí Ọmọ,’ tàbí kí a dín ‘gbogbo ìdájọ́’ kù sí ìdájọ́ ìkẹyìn nìkan.
  rationale: Orísun náà kò ní àwọn ọ̀rọ̀ amúbáramu wọ̀nyí; ìtumọ̀ náà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ mọ́ láì yanjú rẹ̀ ní ìkọ̀kọ̀.
- issue: Orúkọ oyè Kristi ‘Ọmọ’
  choice: A pa ‘Ọmọ’ mọ́ gẹ́gẹ́ bí orúkọ oyè.
  alternative: Ọmọ rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ‘rẹ̀’; oyè náà sì ṣe pàtàkì nínú àfihàn ìbáṣepọ̀ Baba àti Ọmọ nínú Jòhánù.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘kì í ṣe ìdájọ́’ fún òtítọ́ gbogbogbò, àti ‘ó ti fi ... fún’ láti fi perfect tense hàn. Kò sí àlàyé ẹsẹ̀ tó pọndandan.
