base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: yo
  text: Nítorí bí ẹ̀yin bá gba Mósè gbọ́, ẹ̀yin ìbá gba mí gbọ́,[a] nítorí òun ni ó kọ̀wé nípa mi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin ìbá gbẹ́kẹ̀ lé mi.” Ọ̀rọ̀-ìṣe Gíríìkì kan náà ni a lò nínú apá méjèèjì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí ẹni náà ni ó kọ̀wé nípa mi”; “ẹni náà” ń fi ìtẹnumọ́ ọ̀rọ̀ Gíríìkì ἐκεῖνος hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí, ká ní
  rationale: “Nítorí” pa ìsopọ̀ γάρ mọ́ pẹ̀lú àríyànjiyàn tó ṣáájú, “ká ní” sì fi ipò àròsọ tí kò ṣẹlẹ̀ hàn lọ́nà Yorùbá àdánidá.
- source_word: ἐπιστεύετε
  choice: ẹ̀yin gba ... gbọ́
  rationale: “Gba ẹni gbọ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún πιστεύω pẹ̀lú ẹni nínú dátífù; àkókò àti àìṣẹlẹ̀ ipò náà wà nínú “ká ní ... ì bá.”
- source_word: Μωϋσεῖ
  choice: Mósè
  rationale: Orúkọ tí ó wọ́pọ̀ tí ó sì ṣe déédéé ní Yorùbá fún Mósè.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: ẹ̀yin ì bá gba èmi náà gbọ́
  rationale: “Ì bá” túmọ̀ ipa àpapọ̀ imperfect àti ἄν gẹ́gẹ́ bí abajade ipò tí kò ṣẹlẹ̀. “Gba èmi gbọ́” kò fi ìtumọ̀ ‘gbọ́kàn lé/inú’ tí kò hàn gbangba nínú dátífù kún un.
- source_word: περὶ γὰρ ἐμοῦ
  choice: nítorí ... nípa mi
  rationale: “Nípa mi” jẹ́ ìtumọ̀ Yorùbá àdánidá fún περί pẹ̀lú jenitífù, “nítorí” sì tún fi ìdí tí gbólóhùn náà fún hàn.
- source_word: ἐκεῖνος
  choice: òun ni ó
  rationale: Fọ́ọ̀mù ìtẹnumọ́ yìí mú agbára demonstrative ἐκεῖνος jáde ju “ó” lásán lọ, ó sì ń tọ́ka sí Mósè.
- source_word: ἔγραψεν
  choice: kọ̀wé
  rationale: Ọ̀rọ̀-ìṣe àṣeyọrí yìí sọ ìṣe tí Mósè ṣe ní àkókò tó kọjá láìfi àlàyé míì kún un.
theological_decisions:
- issue: Irú ẹ̀rí tí ìwé Mósè jẹ́ sí Jésù
  choice: ó kọ̀wé nípa mi
  alternative: ó kọ̀wé ní ti èmi
  rationale: Èyí pa ẹ̀sùn ọ̀rọ̀ Gíríìkì mọ́ pé àwọn ìkọ̀wé Mósè ń tọ́ka sí Jésù, láìsọ pé ẹsẹ kan pàtó ni tàbí láìfẹ̀ sí i pẹ̀lú ìtumọ̀ ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹ̀yin” àti “èmi” mú ìtẹnumọ́ àwọn arọ́pò-orúkọ jáde; “ká ní ... ì bá” jẹ́ ọ̀nà àdánidá láti sọ ipò àtakò sí òtítọ́.
