  text: ἦν δέ τις ἄνθρωπος ἐκεῖ ⸀τριάκοντα ὀκτὼ ἔτη ἔχων ἐν τῇ ἀσθενείᾳ ⸀αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: yo
  text: Ọkùnrin kan sì wà níbẹ̀, tí ó ti ní àìsàn fún ọdún méjì-dín-lógójì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú àìlera rẹ̀” tàbí “nínú àrùn rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, ἀσθένεια, lè tọ́ka ní ọ̀nà gbogbogbò sí àìlera ara tàbí àìsàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: sì wà
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú, kì í ṣe àmì ìtakora líle. “sì wà” jẹ́ ọ̀nà àdánidá láti mú agbára àsopọ̀ náà jáde láìfi ọ̀rọ̀ àkókò kún un.
- source_word: τις ἄνθρωπος
  choice: ọkùnrin kan
  rationale: τις pẹ̀lú ἄνθρωπος ń fi ẹni kan tí a kò tíì dá mọ̀ hàn. “Ọkùnrin kan” jẹ́ Yorùbá àdánidá, ó sì pa ìtọ́kasí akọ ẹyọ kan mọ́.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ibi adágún tí àyíká ọ̀rọ̀ ti mẹ́nu kàn; “níbẹ̀” ni ìtumọ̀ tààrà tó bá Yorùbá mu.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: ọdún méjì-dín-lógójì
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún nọ́mbà ọdún méjì-dín-lógójì (38).
- source_word: ἔχων
  choice: ó ti wà
  rationale: Participle náà, pẹ̀lú gbólóhùn tó ń sọ bí àkókò ṣe gùn tó, ṣàpèjúwe ipò tí ó ń bá a lọ títí di àsìkò ìtàn náà. “ó ti wà” mú ìtẹ̀síwájú àti gígùn ipò náà jáde ní Yorùbá.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: nínú àìsàn rẹ̀
  rationale: ἀσθένεια lè túmọ̀ sí àìlera, àìsàn tàbí àrùn. “nínú àìsàn rẹ̀” dúró sún mọ́ àkójọpọ̀ ọ̀rọ̀ Gíríìkì, kò sì sọ irú àrùn pàtó kan tí ẹsẹ yìí kò sọ.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbòò. Àmì àsopọ̀ “sì” pa ìṣàn ìtàn mọ́ láìfi ìtakora tàbí ọ̀rọ̀ àkókò tí kò sí nínú orísun kún un.
