  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ẹni akọ kan, ibi náà, àti àkókò ọdún méjì-dín-lógójì jáde dáadáa. Síbẹ̀, ìsọfúnni náà ní ìbẹ̀rẹ̀ ('Ọkùnrin kan sì wà níbẹ̀; ó ti wà nínú àìsàn rẹ̀...') kì í ṣàn dáadáa ní Yorùbá fún ipò àìsàn tí ó ti pẹ́. Àtúnṣe náà pa ìtumọ̀ ἐν τῇ ἀσθενείᾳ αὐτοῦ mọ́ gẹ́gẹ́ bí àìsàn/àìlera tí ọkùnrin náà ti ní fún àkókò gígùn, láìsọ irú àìsàn pàtó kan.
