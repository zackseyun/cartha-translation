id: JHN.5.28
reference: John 5:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí èyí yà yín lẹ́nu, nítorí wákàtí kan ń bọ̀, nígbà tí gbogbo àwọn tí ó wà nínú àwọn ibojì[a] yóò gbọ́ ohùn rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn sàréè.” Ọ̀rọ̀ Gíríìkì μνημεῖα lè tọ́ka sí ibi ìsìnkú lápapọ̀; a yan “àwọn ibojì” láti pa àwòrán ibi tí a sin òkú sí mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Ẹ má ṣe jẹ́ kí èyí yà yín lẹ́nu
  rationale: Ọ̀rọ̀ ìgbọ́wọ́ dúró nínú ọ̀pọ̀ ènìyàn. Ìṣàpẹẹrẹ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé kí ohun kan má ṣe ya àwọn olùgbọ́ lẹ́nu, ó sì pa agbára θαυμάζω mọ́.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò afihàn yìí tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí wọn kò fi gbọdọ̀ yà lẹ́nu hàn ní kedere.
- source_word: ἔρχεται ὥρα
  choice: wákàtí kan ń bọ̀
  rationale: A pa àwòrán ‘wákàtí’ mọ́ dípò fífi ‘àkókò’ rọ́pò rẹ̀, nítorí ὥρα ní ìwúwo pàtàkì nínú ìwé Jòhánù. ‘Kan’ bá àìní àpèjúwe pàtó nínú Gíríìkì mu.
- source_word: ἐν ᾗ
  choice: nígbà tí
  rationale: Èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì ṣe àdánidá fún gbólóhùn ìbátan tó túmọ̀ sí ‘nínú èyí tí.’
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: gbogbo àwọn tí ó wà nínú àwọn ibojì
  rationale: ‘Gbogbo àwọn tí’ fi ìlò πάντες pẹ̀lú àpilẹ̀kọ hàn. ‘Àwọn ibojì’ pa àwòrán ibi ìsìnkú tó ṣe kedere mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἀκούσουσιν
  choice: yóò gbọ́
  rationale: Ó fi ọjọ́ iwájú hàn, ‘gbọ́’ sì ni ìtumọ̀ àdánidá fún ἀκούω níbí.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ohùn rẹ̀
  rationale: φωνή túmọ̀ sí ohùn ẹni ní àyíká yìí; àkójọpọ̀ ọ̀rọ̀ Gíríìkì kò nílò ìfikún míì ní Yorùbá.
theological_decisions:
- issue: Èdè àjíǹde tí ọ̀rọ̀ nípa àwọn tó wà nínú ibojì ń tọ́ka sí
  choice: A pa àwòrán ibi ìsìnkú náà mọ́ pẹ̀lú ‘àwọn ibojì,’ láìṣàlàyé àjíǹde sínú ẹsẹ náà.
  alternative: Lílo ‘àwọn sàréè’ tàbí fífi ‘àwọn òkú’ kún un.
  rationale: Ẹsẹ náà ń tọ́ka sí àjíǹde ara, ṣùgbọ́n ìtumọ̀ gbọ́dọ̀ pa ọ̀rọ̀ inú àkọsílẹ̀ fúnra rẹ̀ mọ́, kí ó má sì yanjú tàbí mú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ gbòòrò sí i.
translation_notes:
  register: Yorùbá ìṣàmúlò òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ẹ… yín’ pa ọ̀pọ̀ ènìyàn inú ọ̀rọ̀ Gíríìkì mọ́; ‘nígbà tí’ mú ìṣàn gbólóhùn náà jẹ́ àdánidá ju ìtúmọ̀ gígún ‘nínú èyí tí’ lọ.
