  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Ẹni tí ó mú mi láradá, òun ni ó sọ fún mi pé, ‘Gbé àkéte rẹ[a], kí o sì máa rìn.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibùsùn”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àkéte tàbí ohun ìtẹ́lẹ̀ rírọrùn tí a fi ń sùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá wọn lóhùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan fèsì sí ohun tí àwọn ẹlòmíràn sọ tàbí béèrè.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Ẹni tí ó mú mi láradá
  rationale: Gbólóhùn yìí túmọ̀ àpólà alábápín oníṣọ̀kan náà lọ́nà Yorùbá àdánidá, ó sì fi ìwòsàn ara hàn láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἐκεῖνός
  choice: òun náà
  rationale: Arọ́pò-orúkọ Gíríìkì náà ní ìtẹnumọ́; “òun náà” pa ìtẹnumọ́ yẹn mọ́ dípò lílo “ó” lásán.
- source_word: Ἆρον
  choice: Gbé
  rationale: Àṣẹ náà ń pe fún ìṣe kan pàtó, ìyẹn láti gbé ohun tí ó wà nílẹ̀ sókè; “gbé” ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: κράβαττόν
  choice: àkéte
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ohun ìtẹ́lẹ̀ rírọrùn tí a fi ń sùn, kì í ṣe dandan ohun èlò ilé ńlá bí ibùsùn òde òní; “àkéte” mú ìtumọ̀ yẹn jáde dáadáa.
- source_word: περιπάτει
  choice: kí o sì máa rìn
  rationale: Ìlànà yìí sọ àṣẹ láti rìn; “máa rìn” jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún àṣẹ oníṣe-títẹ̀síwájú náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ asopọ̀ náà ní ìyípadà tàbí ìtakora díẹ̀ sí ọ̀rọ̀ àwọn tí wọ́n bá a sọ̀rọ̀; “Ṣùgbọ́n” bá àyíká náà mu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àpèjúwe ìwòsàn náà
  choice: mú mi láradá
  alternative: mú mi pé pérépéré
  rationale: Àyíká ẹsẹ̀ náà ń sọ nípa ìwòsàn ara. “Mú mi láradá” pa ìtumọ̀ gidi náà mọ́, láìfi ìtumọ̀ ẹ̀mí tàbí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò fi dandan mú wá kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbogbò. A lo “òun náà” láti pa ìtẹnumọ́ inú Gíríìkì mọ́, a sì lo “àkéte” láti yẹra fún àwòrán ibùsùn ńlá ti òde òní.
