id: JHN.5.41
reference: John 5:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: yo
  text: Èmi kò gba ògo lọ́wọ́ àwọn ènìyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ògo” níhìn-ín tún lè jẹ́ “ọlá” tàbí “ìyìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: ògo
  rationale: “Ògo” pa ìsopọ̀ ọ̀rọ̀ δόξα mọ́ pẹ̀lú àkòrí ògo ní gbogbo Ìhìn Rere Jòhánù; ní àyíká yìí, ó tún lè túmọ̀ sí ọlá tàbí ìyìn tí àwọn ẹlòmíràn ń fúnni.
- source_word: παρὰ ἀνθρώπων
  choice: lọ́wọ́ àwọn ènìyàn
  rationale: παρά pẹ̀lú genitive ń tọ́ka sí orísun. “Lọ́wọ́ àwọn ènìyàn” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé nǹkan wá láti ọ̀dọ̀ ènìyàn, ó sì jẹ́ kí ἀνθρώπων dúró gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀ fún ẹ̀dá ènìyàn.
- source_word: οὐ λαμβάνω
  choice: Èmi kò gba
  rationale: “Kò gba” tú λαμβάνω ní tààrà gẹ́gẹ́ bí gbígba tàbí fífi ohun tí a fúnni sílẹ̀; simple present náà bá gbólóhùn Yorùbá mu. Fífi “Èmi” síwájú ń mú ìtẹnumọ́ ẹni àkọ́kọ́ hàn.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Jesu nípa ìtẹ́wọ́gbà ènìyàn
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìkọ̀ pé Jesu gba ògo rẹ̀ láti ọ̀dọ̀ ènìyàn.
  alternative: Kí a túmọ̀ ọ́ sí pé Jesu kò “wá” tàbí kò “fẹ́” ìyìn ènìyàn, tàbí pé kò gba ọlá kankan rárá lọ́wọ́ ẹnikẹ́ni.
  rationale: Àyíká fi hàn pé iṣẹ́ àti ìdánimọ̀ Jesu kò sinmi lórí ìyìn ènìyàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ “kò gba,” kì í ṣe “kò wá.” Nítorí náà, a kò fi àlàyé ìtumọ̀ kun ọ̀rọ̀ pàtàkì, a sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. “Lọ́wọ́ àwọn ènìyàn” jẹ́ àdánidá ju ìtumọ̀ líle “láti ọ̀dọ̀ àwọn ènìyàn” lọ, ó sì pa ìtumọ̀ orísun mọ́. A lo àmì ohùn ní kíkún níbi tí ó yẹ.
