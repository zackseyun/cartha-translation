  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: yo
  text: Ó sì fún un ní àṣẹ láti ṣe ìdájọ́, nítorí pé òun ni Ọmọ Ènìyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí pé ọmọ ènìyàn kan ni,” ìyẹn ni, nítorí pé ó ní ẹ̀dá ènìyàn. Ìtumọ̀ àkọ́kọ́ náà pa ìlò gbólóhùn náà gẹ́gẹ́ bí oyè, èyí tí ó ṣeé ṣe jù lọ nínú Jòhánù, mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí àṣẹ tàbí ẹ̀tọ́ tí a fi lé ẹnì kan lọ́wọ́ láti ṣe iṣẹ́ ìdájọ́, kì í ṣe agbára lásán.
- source_word: ἔδωκεν αὐτῷ
  choice: fún un
  rationale: Èyí fi ìṣe fífi àṣẹ náà fún Ọmọ hàn ní tààrà, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: κρίσιν ποιεῖν
  choice: láti ṣe ìdájọ́
  rationale: Gbólóhùn yìí pa ìtumọ̀ iṣẹ́ ìdájọ́ mọ́, ó sì jẹ́ èdè Yorùbá tí ó bójú mu, dípò ṣíṣe àlàyé rẹ̀ jù.
- source_word: ὅτι
  choice: nítorí pé
  rationale: ὅτι ń sọ ìdí tí a fi fún un ní àṣẹ náà, nítorí náà ìtumọ̀ onídí ni ó yẹ níbí.
- source_word: υἱὸς ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Nínú Ìhìn Rere Jòhánù, gbólóhùn yìí sábà máa ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè Jésù; lílo àwọn lẹ́tà ńlá ń jẹ́ kí iṣẹ́ yẹn ṣe kedere láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἐστίν
  choice: òun ni
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti tẹnu mọ́ ẹni tí ó jẹ́ Ọmọ Ènìyàn, bí àyíká ọ̀rọ̀ ṣe ń béèrè.
theological_decisions:
- issue: Bóyá υἱὸς ἀνθρώπου jẹ́ orúkọ oyè Kristi tàbí ọ̀rọ̀ gbogbogbò fún ẹni tí ó ní ẹ̀dá ènìyàn
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí orúkọ oyè “Ọmọ Ènìyàn.”
  alternative: “ọmọ ènìyàn kan,” ìyẹn ẹni tí ó ní ẹ̀dá ènìyàn
  rationale: Ìlò rẹ̀ nínú Jòhánù àti àyíká ọ̀rọ̀ nípa àṣẹ ìdájọ́ ṣe àtìlẹ́yìn fún orúkọ oyè tí ó ní ìbáṣepọ̀ pẹ̀lú Dáníẹ́lì 7. Síbẹ̀, àìsí áríkìlì nínú Gíríìkì jẹ́ kí ìtumọ̀ gbogbogbò nípa ẹ̀dá ènìyàn ṣì ṣeé ronú lé; àlàyé ìsàlẹ̀ ni a fi pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. “Àṣẹ” àti “ṣe ìdájọ́” pa àwọ̀ òfin ti orísun mọ́, nígbà tí “Ó sì fún un” ń so ẹsẹ náà mọ́ ọ̀rọ̀ tí ó ṣáájú lọ́nà àdánidá.
