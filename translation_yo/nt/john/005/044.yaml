id: JHN.5.44
reference: John 5:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: yo
  text: Báwo ni ẹ ṣe lè gbàgbọ́[b], nígbà tí ẹ ń gba ògo[a] lọ́wọ́ ara yín, tí ẹ kò sì ń wá ògo láti ọ̀dọ̀ Ọlọ́run kan ṣoṣo[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ọlá,” ní ibi méjèèjì tí “ògo” ti fara hàn (Gíríìkì: δόξα).'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Báwo ni ó ṣe lè ṣeé ṣe fún yín láti gbàgbọ́...?”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ọlọ́run náà nìkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: Báwo ni ẹ ṣe lè gbàgbọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè àsọyé nípa bí gbígbàgbọ́ ṣe lè ṣeé ṣe. ‘Lè’ fi agbára tàbí àǹfààní ṣíṣe tí δύνασθε túmọ̀ sí hàn ní Yorùbá àdánidá, ‘gbàgbọ́’ sì pa ìtumọ̀ πιστεῦσαι mọ́ láì fi ẹ̀kọ́ ìsìn kan kún un.
- source_word: ὑμεῖς
  choice: ẹ
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ ènìyàn náà wà ní kedere nínú gbólóhùn Yorùbá; fífi ọ̀rọ̀ amúnáwá bí ‘ẹ̀yin fúnra yín’ kún un yóò mú ìtẹnumọ́ náà pọ̀ ju ti Gíríìkì lọ.
- source_word: δόξαν
  choice: ògo
  rationale: ‘Ògo’ pa àtúnṣe ọ̀rọ̀ kan náà mọ́ nínú apá méjèèjì, ó sì jẹ́ kí ìyàtọ̀ láàárín ògo láti ọ̀dọ̀ ènìyàn àti ògo láti ọ̀dọ̀ Ọlọ́run hàn. ‘Ọlá’ jẹ́ àṣàyàn tó bá àyíká mu.
- source_word: παρ’ ἀλλήλων
  choice: lọ́wọ́ ara yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ènìyàn ń gba nǹkan lọ́wọ́ ara wọn ní ìpadàǹpadà.
- source_word: λαμβάνοντες
  choice: ẹ ń gba
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ hàn, ‘gba’ sì jẹ́ ìtumọ̀ tààrà tí kò fi èrò ‘fọwọ́ sí’ kún ọ̀rọ̀ náà.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: tí ẹ kò sì ń wá
  rationale: Ìṣètò yìí so ìhùwàsí kejì mọ́ ti àkọ́kọ́ ní Yorùbá tó ṣe kedere, ó sì pa ìkọ̀ ‘οὐ’ àti ìtumọ̀ wíwá ohun kan mọ́.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: ògo tí ó ti ọ̀dọ̀ Ọlọ́run kan ṣoṣo wá
  rationale: Gbólóhùn ìbátan náà fi orísun ògo hàn kedere, ‘Ọlọ́run kan ṣoṣo’ sì sọ ìyàsọ́tọ̀ μόνος láì fi ẹ̀kọ́ mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ πιστεῦσαι nínú àyíká Johanu
  choice: gbàgbọ́
  alternative: gbẹ́kẹ̀ lé
  rationale: ‘Gbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá gboogi tó lè gba ìtumọ̀ ìgbàgbọ́ àti ìgbẹ́kẹ̀lé; kò dín ọ̀rọ̀ Gíríìkì náà sí ẹ̀kọ́ ìsìn pàtó kan.
- issue: Pípa δόξα mọ́ ní ọ̀nà kan náà nínú apá méjèèjì
  choice: ògo ... ògo
  alternative: ọlá ... ọlá
  rationale: Lílo ọ̀rọ̀ kan náà lẹ́ẹ̀mejì pa ìfarawé àti ìforígbárí tó wà nínú Gíríìkì mọ́ láàárín ohun tí ó ti ọ̀dọ̀ ènìyàn wá àti ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá.
- issue: Ìtumọ̀ τοῦ μόνου θεοῦ
  choice: Ọlọ́run kan ṣoṣo
  alternative: Ọlọ́run náà nìkan
  rationale: Àṣàyàn náà jẹ́wọ́ ìyàsọ́tọ̀ Ọlọ́run gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ, láì mú ìtumọ̀ ti Kristi tàbí èyíkéyìí tó lòdì sí i wọ inú ẹsẹ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún, ó sì ní ìwọ̀ntúnwọ̀nsì àti iyì tó yẹ fún ẹsẹ Bíbélì. A lo ‘nígbà tí’ láti mú ìbáṣepọ̀ láàárín ìbéèrè àti àwọn ìhùwàsí méjèèjì ṣe kedere, láì yí agbára ìbéèrè àsọyé náà padà.
