id: JHN.5.45
reference: John 5:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: yo
  text: Ẹ má ṣe rò pé èmi ni yóò fẹ̀sùn kàn yín níwájú Baba[a]. Ẹnì kan wà tí ń fẹ̀sùn kàn yín—Mósè[b], ẹni tí ẹ ti gbé ìrètí yín lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe lérò pé èmi ni yóò gbé ẹ̀sùn kalẹ̀ lòdì sí yín níwájú Baba.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, Mósè—ẹni tí ẹ gbẹ́kẹ̀ lé, pàápàá gẹ́gẹ́ bí alárinà àti ẹlẹ́rìí òfin—ni yóò dúró gẹ́gẹ́ bí ẹni tí ń fẹ̀sùn kàn yín.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Ẹ má ṣe rò
  rationale: Ó jẹ́ ìkìlọ̀ tààrà tí ó túmọ̀ sí ‘ẹ má ṣe rò’ tàbí ‘ẹ má ṣe lérò’; ọ̀rọ̀ yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: κατηγορήσω
  choice: yóò fẹ̀sùn kàn
  rationale: ‘Fẹ̀sùn kàn’ pa ìtumọ̀ ọ̀rọ̀ ilé-ẹjọ́ mọ́ láì mú un lágbára dé ‘dá lẹ́bi,’ èyí tí ó kọjá ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: πρὸς τὸν πατέρα
  choice: níwájú Baba
  rationale: Nínú àyíká ẹ̀sùn, ‘níwájú Baba’ jẹ́ ọ̀nà àdánidá láti fi hàn pé a ń gbé ẹ̀sùn kalẹ̀ níwájú ẹni kan, ó sì pa orúkọ oyè Johanu ‘Baba’ mọ́.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Ẹnì kan wà tí ń fẹ̀sùn kàn yín
  rationale: Ìtumọ̀ yìí pa ìfihàn ẹni mìíràn gẹ́gẹ́ bí olùfẹ̀sùn-kàn mọ́, ‘tí ń’ sì fi ipa participle ìsinsìnyí hàn.
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni irú orúkọ náà tí a mọ̀, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: εἰς ὃν
  choice: ẹni tí ... lé
  rationale: Ìṣètò ‘gbé ìrètí ... lé’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ìrètí sínú tàbí lé ẹnì kan, láì fi ‘àwọn ìwé Mósè’ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἠλπίκατε
  choice: ẹ ti gbé ìrètí yín lé
  rationale: Àkókò perfect náà ń tọ́ka sí ìgbésẹ̀ tí abájáde rẹ̀ ṣì dúró; ‘ẹ ti gbé ìrètí yín lé’ mú ìṣe náà àti ìgbẹ́kẹ̀lé tí ó ń bá a lọ hàn.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ilé-ẹjọ́ nínú gbólóhùn Jésù
  choice: A lo ‘fẹ̀sùn kàn’ dípò ‘dá lẹ́bi.’
  alternative: Èmi ni yóò dá yín lẹ́bi níwájú Baba.
  rationale: κατηγορέω túmọ̀ sí fífi ẹ̀sùn kan ẹni tàbí gbígbé ẹ̀sùn kalẹ̀, kì í ṣe ìdájọ́ ìkẹyìn pé ẹni náà jẹ̀bi. Èyí pa àwòrán ilé-ẹjọ́ mọ́ láì fi ẹ̀kọ́ tí ẹsẹ náà kò sọ kún un.
- issue: Ohun tí ìrètí wọn nínú Mósè tọ́ka sí
  choice: A sọ pé wọ́n gbé ìrètí wọn lé Mósè fúnra rẹ̀.
  alternative: Wọ́n gbé ìrètí wọn lé òfin Mósè tàbí àwọn ìwé Mósè.
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ so Mósè mọ́ àwọn ohun tí ó kọ, Mósè fúnra rẹ̀ ni Gíríìkì dárúkọ. Ìtumọ̀ náà jẹ́ kí àyíká ṣàlàyé ìbáṣepọ̀ yìí dípò kí a fi ìtumọ̀ àlàyé sínú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. ‘Ẹ’ pa ọ̀pọ̀ ènìyàn tí ὑμεῖς ń tọ́ka sí mọ́; ‘fẹ̀sùn kàn’ dá àwòrán ilé-ẹjọ́ dúró; ‘gbé ìrètí ... lé’ sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìgbẹ́kẹ̀lé tó ti fìdí múlẹ̀.
