  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: yo
  text: Baba tí ó rán mi—òun ni ó ti jẹ́rìí nípa mi[a]. Ẹ kò tíì gbọ́ ohùn rẹ̀ rí, bẹ́ẹ̀ ni ẹ kò tíì rí ìrísí rẹ̀ rí[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Baba tí ó rán mi fúnra rẹ̀ ti jẹ́rìí nípa mi.” Ọ̀rọ̀ Gíríìkì ἐκεῖνος tẹnu mọ́ Baba lẹ́yìn gbólóhùn “Baba tí ó rán mi.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “bí ó ṣe farahàn.” Ọ̀rọ̀ Gíríìkì εἶδος lè tọ́ka sí ìrísí tàbí fọ́ọ̀mù tí ojú lè rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: Baba tí ó rán mi
  rationale: Gbólóhùn asọ̀rọ̀-orúkọ náà fi ipa ìdánimọ̀ tí ó wà nínú participle Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: ἐκεῖνος
  choice: òun náà
  rationale: “Òun náà” tún tọ́ka sí Baba, ó sì pa ìtẹnumọ́ demonstrative Gíríìkì mọ́ láì di ọ̀rọ̀ àjèjì ní Yorùbá.
- source_word: μεμαρτύρηκεν
  choice: ti jẹ́rìí
  rationale: Àkójọpọ̀ “ti” àti “jẹ́rìí” sọ iṣe tí ó ti ṣẹlẹ̀ tí ẹ̀rí rẹ̀ sì ṣì dúró; ó tún pa èrò ẹ̀rí mọ́.
- source_word: περὶ ἐμοῦ
  choice: nípa mi
  rationale: “Nípa mi” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ‘concerning/about me.’
- source_word: οὔτε ... οὔτε
  choice: kò ... bẹ́ẹ̀ ni ... kò
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkọ̀ méjì tí ó so pọ̀ hàn.
- source_word: φωνὴν αὐτοῦ
  choice: ohùn rẹ̀
  rationale: “Ohùn” ni ìtumọ̀ tí ó bá àyíká gbígbọ́ mu jù lọ.
- source_word: πώποτε ἀκηκόατε
  choice: kò tíì gbọ́ ... rí
  rationale: “Kò tíì ... rí” fi ìtumọ̀ ‘ẹ kò gbọ́ nígbà kankan títí di ìsinsìnyí’ hàn, ó sì bá perfect tí a sẹ́ mu.
- source_word: εἶδος αὐτοῦ
  choice: ìrísí rẹ̀
  rationale: “Ìrísí” lè túmọ̀ sí fọ́ọ̀mù tàbí bí ẹni ṣe farahàn; kò pinnu irú ìríran tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἑωράκατε
  choice: kò tíì rí ... rí
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọn kò ní ìrírí rírí rẹ̀ rí títí di àkókò ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtẹnumọ́ ἐκεῖνος nígbà tí ó ń tọ́ka sí Baba
  choice: Fi “òun náà” sínú ọ̀rọ̀ pàtàkì.
  alternative: “Ó ti jẹ́rìí” tàbí “òun fúnra rẹ̀ ti jẹ́rìí.”
  rationale: “Òun náà” pa ìtẹnumọ́ Gíríìkì mọ́ pé Baba tí ó rán Jésù ni ẹlẹ́rìí náà, láì fi ẹ̀kọ́ mìíràn kún un.
- issue: Ìtumọ̀ εἶδος αὐτοῦ
  choice: “ìrísí rẹ̀”
  alternative: “àwòrán ara rẹ̀” tàbí “bí ó ṣe farahàn.”
  rationale: “Ìrísí” pa àyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, kò sì dájú ju bó ṣe yẹ lọ bóyá ó ń tọ́ka sí fọ́ọ̀mù tí ojú lè rí tàbí ìfarahàn.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àmì gígùn náà ń jẹ́ kí ìpadàtọ́ka “òun náà” ṣaláìní àìyedè, ìkọ̀ méjì sì jẹ́ ti Yorùbá àdánidá. A pa àmì kọ́mà ìparí mọ́ nítorí ẹsẹ yìí ń bá gbólóhùn ẹsẹ tó tẹ̀ lé e lọ.
