  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé èrò Gíríìkì náà dáadáa ní gbogbogbòò, pẹ̀lú ìtẹnumọ́ “Èmi,” ìbámu gbígbọ́ àti ìdájọ́, àti ẹni aláìlórúkọ tí ó rán Jesu. Síbẹ̀, “dá ohunkóhun ṣe” lè tọ́ka sí dídá ohun ṣẹ̀dá ju ṣíṣe ohunkóhun lọ, “láti inú ara mi” kì í ṣe ọ̀nà tó mọ́ jùlọ láti ṣàfihàn ἀπ’ ἐμαυτοῦ, àti “ìfẹ́ ti ara mi” lè túmọ̀ sí ìfẹ́-sí-ara-ẹni ju ìfẹ́/ìfẹ́-ọkàn ẹni fúnra rẹ̀ lọ.
  naturalness: Àtúnṣe náà lo Yorùbá boṣewa tí ó rọrùn àti tí ó bá ọ̀nà ìsọ̀rọ̀ òde òní mu. “Bí mo ti ń gbọ́ ni mo ń ṣe ìdájọ́” jẹ́ ìkọ̀sẹ̀pọ̀ tó dára, àti “ohun tí èmi fúnra mi fẹ́” yọ àìmọ̀ye kúrò nínú gbolohun ìkẹyìn.
  terminology: A pa ìsopọ̀ κρίνω/κρίσις mọ́ pẹ̀lú “ṣe ìdájọ́/ìdájọ́.” “Òdodo” yẹ gan-an fún δικαία ní àyíká ìdájọ́. A kò fi “Bàbá” kún “ẹni tí ó rán mi,” nítorí ọrọ̀ Gíríìkì kò sọ orúkọ náà níbí.
  issues:
