  to: “Èmi kò lè ṣe ohunkóhun láti ara mi. Bí mo ti ń gbọ́ ni mo ń ṣe ìdájọ́, ìdájọ́ mi sì jẹ́ òdodo, nítorí kì í ṣe ohun tí èmi fúnra mi fẹ́ ni mo ń wá, bí kò ṣe ohun tí ẹni tí ó rán mi fẹ́.”
