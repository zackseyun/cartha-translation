  - severity: medium
    issue: “ìfẹ́ ti ara mi” fún τὸ θέλημα τὸ ἐμὸν
    rationale: Ọ̀rọ̀ náà lè gbọ́ bí ìfẹ́-sí-ara-ẹni (self-love). “Ohun tí èmi fúnra mi fẹ́” ń sọ ìfẹ́-ọkàn/will tí a tẹnumọ́ ní Gíríìkì ní kedere.
  - severity: low
    issue: “láti inú ara mi”
    rationale: Bí ó tilẹ̀ jẹ́ pé ó lè ṣàfihàn orísun, “láti ara mi” dáa jù fún ἀπ’ ἐμαυτοῦ nínú gbolohun Yorùbá yìí, ó sì yẹra fún ìrònú ‘láti inú mi’ gẹ́gẹ́ bí ojú-inú.
