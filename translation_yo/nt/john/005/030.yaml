id: JHN.5.30
reference: John 5:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: yo
  text: “Èmi kò lè ṣe ohunkóhun láti ara mi. Bí mo ti ń gbọ́ ni mo ń ṣe ìdájọ́, ìdájọ́ mi sì jẹ́ òdodo, nítorí kì í ṣe ohun tí èmi fúnra mi fẹ́ ni mo ń wá, bí kò ṣe ohun tí ẹni tí ó rán mi fẹ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: Èmi kò lè
  rationale: Ó pa àfikún ìtẹnumọ́ ἐγώ mọ́ nípasẹ̀ “Èmi,” ó sì tú δύναμαι ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: dá ohunkóhun ṣe láti inú ara mi
  rationale: “Dá ... ṣe” fi hàn pé kì í ṣe ní ìdásílẹ̀ tàbí láti orísun ara rẹ̀ ni Ọmọ ti ń ṣe nǹkan; “ohunkóhun” bá ìkọ̀ οὐδέν mu ní Yorùbá àdánidá.
- source_word: καθὼς ἀκούω
  choice: Bí mo ti ń gbọ́ ni
  rationale: Ó fi ìbámu tó wà láàárín gbígbọ́ àti ṣíṣe ìdájọ́ hàn, ìṣe aláìparí “ń” sì bá ìwòye àsìkò ìsinsìnyí mu.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: mo ṣe ń ṣe ìdájọ́ / ìdájọ́ mi
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ ìdájọ́ méjèèjì mọ́, ó sì yẹ fún àyíká ìdájọ́.
- source_word: δικαία
  choice: tọ́
  rationale: Nínú àyíká ìdájọ́, “tọ́” sọ pé ìdájọ́ náà bá òdodo àti ohun tí ó yẹ mu láìfi ìtumọ̀ míì kún un.
- source_word: ζητῶ
  choice: wá
  rationale: “Wá” jẹ́ ìtumọ̀ Yorùbá tó rọrùn fún fífi ohun kan ṣe ète tàbí ohun tí ẹni ń lépa.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: ìfẹ́ ti ara mi
  rationale: Ó pa ìtẹnumọ́ ohun-ìní inú Gíríìkì mọ́, ó sì yà á sí mímọ́ kúrò nínú ìfẹ́ ẹni tó rán an.
- source_word: τοῦ πέμψαντός με
  choice: ẹni tí ó rán mi
  rationale: Ó tú àpólà aláìlórúkọ náà ní tààrà, láìfi “Baba” sí ibi tí Gíríìkì kò ti lò ó.
theological_decisions:
- issue: Ìbáṣepọ̀ ìṣe Ọmọ sí ẹni tó rán an nínú ἀπ’ ἐμαυτοῦ
  choice: láti inú ara mi
  alternative: nípa ara mi
  rationale: Àṣàyàn yìí pa èrò orísun àti àìṣe ní òmìnira kúrò lọ́dọ̀ ẹni tó rán an mọ́, láìdá ìṣòro náà sí ìtumọ̀ pé kò ní agbára rárá.
- issue: δικαία pẹ̀lú κρίσις
  choice: ìdájọ́ mi sì tọ́
  alternative: ìdájọ́ mi sì jẹ́ òdodo
  rationale: “Tọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìdájọ́ tó yẹ, tó pé, tí kò sì ṣàìṣòdodo; ó yẹ fún àyíká yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “dá ohunkóhun ṣe láti inú ara mi” láti pa ìtumọ̀ orísun àti àìṣe lọ́tọ̀ mọ́; kò sí àlàyé ẹ̀kọ́ ìsìn tí a fi kún ọ̀rọ̀ náà.
