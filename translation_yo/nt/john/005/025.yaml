id: JHN.5.25
reference: John 5:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: yo
  text: “Lóòótọ́, lóòótọ́ ni mo wí fún yín pé, wákàtí kan ń bọ̀, ó sì wà nísinsin yìí, nígbà tí àwọn òkú yóò gbọ́ ohùn Ọmọ Ọlọ́run, àwọn tí ó gbọ́ náà yóò yè.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè tú apá ìkẹyìn náà sí: “àwọn tí ń gbọ́ yóò yè.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ aláṣẹ tí àtúnwí Gíríìkì ní mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere tí ó sì ní iyì.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ó pa ọ̀rọ̀ taara àti ìlù ọ̀rọ̀ oníyì ti gbolohun náà mọ́; ‘yín’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
- source_word: ἔρχεται ὥρα
  choice: wákàtí kan ń bọ̀
  rationale: ‘Wákàtí’ túmọ̀ ὥρα ní tààrà, ‘kan’ sì bá àìsí article nínú Gíríìkì mu láìsọ ọ́ di ‘àkókò’ lásán.
- source_word: καὶ νῦν ἐστιν
  choice: ó sì dé nísinsin yìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wákàtí náà ti wà báyìí, nígbà tí ó ṣì pa ìforígbárí àkókò ọjọ́ iwájú àti ìmúṣẹ lọ́wọ́lọ́wọ́ mọ́.
- source_word: οἱ νεκροὶ
  choice: àwọn òkú
  rationale: Ó jẹ́ ìtumọ̀ taara tí kò pinnu bóyá òkú nípa ẹ̀mí tàbí nípa ara ni a ń tọ́ka sí.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: yóò gbọ́ ohùn
  rationale: ‘Ohùn’ yẹ fún φωνή nínú ọ̀rọ̀ nípa ẹni, ‘gbọ́’ sì jẹ́ ìtumọ̀ àdánidá tí kò fi ìgbọràn kún ohun tí ọ̀rọ̀ náà sọ.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa orúkọ oyè Kristi náà mọ́ ní kíkún àti ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: οἱ ἀκούσαντες
  choice: àwọn tí ó bá sì gbọ́
  rationale: Ìṣe aorist participle náà ni a mú jáde gẹ́gẹ́ bí ìṣe tí yóò ṣẹlẹ̀ ṣáájú àbájáde náà; ‘bá’ mú ìbáṣepọ̀ láàárín gbígbọ́ àti yíyè hàn láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: ζήσουσιν
  choice: yóò yè
  rationale: ‘Yè’ túmọ̀ sí láti wà láàyè, ó sì yẹra fún ṣíṣe ìtumọ̀ náà ní pàtó sí àjíǹde ara nìkan.
theological_decisions:
- issue: Ohun tí ‘àwọn òkú’ ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ ní ṣókí sí ‘àwọn òkú,’ láìfi ‘nípa ẹ̀mí’ tàbí ‘nípa ara’ kún un.
  alternative: ‘Àwọn tí ó kú nípa ẹ̀mí’ tàbí ‘àwọn òkú nípa ara.’
  rationale: ‘Ó sì dé nísinsin yìí’ lè tọ́ka sí ìmúwàláàyè lọ́wọ́lọ́wọ́, ṣùgbọ́n àyíká Jòhánù 5 tún ń retí àjíǹde ara. Ìtumọ̀ náà kò yẹ kí ó mú ọ̀kan ṣoṣo nínú wọn.
- issue: Orúkọ oyè Kristi, ‘Ọmọ Ọlọ́run’
  choice: A pa ‘Ọmọ Ọlọ́run’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘Ọmọ tí ó jẹ́ ti Ọlọ́run.’
  rationale: Èyí bá Gíríìkì mu ní tààrà, ó sì pa orúkọ oyè Kristi mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìbáṣepọ̀ ‘gbọ́’ àti ‘yè’
  choice: ‘Àwọn tí ó bá sì gbọ́ yóò yè.’
  alternative: ‘Àwọn tí ó ti gbọ́ yóò yè.’
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá àdánidá nínú gbolohun ọjọ́ iwájú, ṣùgbọ́n àkọsílẹ̀ ẹsẹ̀ ṣàfihàn pé aorist participle tún lè jẹ́ kí a túmọ̀ rẹ̀ sí ‘tí ó ti gbọ́.’
translation_notes:
  register: Èdè Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Wákàtí kan ń bọ̀, ó sì dé nísinsin yìí’ mú ìlù ọ̀rọ̀ náà ṣe kedere fún òǹkàwé òde òní, ó sì pa ìforígbárí láàárín ohun tí ń bọ̀ àti ohun tí ó ti wà lọ́wọ́lọ́wọ́ mọ́. Àmì àkọsílẹ̀ [a] wà nínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí a ti béèrè.
