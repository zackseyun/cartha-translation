  - severity: low
    issue: ‘àwọn tí ó bá sì gbọ́’
    rationale: Ẹ̀yà ‘bá’ lè fún un ní ìrísí ìpò-ìfẹ̀ ‘bí wọ́n bá gbọ́,’ nígbà tí Gíríìkì ní participle tó ń ṣàpèjúwe àwọn olùgbọ́. ‘Àwọn tí ó gbọ́ náà’ pa ìṣe tí ó ṣáájú ìyè mọ́ láìṣàfikún ìpò-ìfẹ̀.
