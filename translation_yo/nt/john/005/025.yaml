  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní ọ̀pọ̀lọpọ̀: ìtẹnumọ́ Ἀμὴν ἀμὴν, ‘wákàtí kan ń bọ̀,’ ‘àwọn òkú,’ ‘ohùn Ọmọ Ọlọ́run,’ àti ìlérí ìyè ni a gbé kalẹ̀ dáadáa. Ṣùgbọ́n ‘ó sì dé nísinsin yìí’ sọ ìmúṣẹ tí ó ti dé tán ní kedere ju καὶ νῦν ἐστιν (‘ó sì wà nísinsin yìí’) lọ.'
  naturalness: Yorùbá rẹ̀ jẹ́ boṣewa, ó sì ní àmì ohùn tó pé. ‘Ó sì wà nísinsin yìí’ jẹ́ ọ̀nà àdánidá àti tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ ju ‘ó sì dé nísinsin yìí’ lọ. Yíyí ‘àwọn tí ó bá sì gbọ́’ sí ‘àwọn tí ó gbọ́ náà’ yọ ìdíwọ̀n ìpò-ìfẹ̀ (‘bí’) tí kò hàn gbangba nínú Gíríìkì kúrò, ó sì fara mọ́ aorist participle náà.
  terminology: ‘Ọmọ Ọlọ́run,’ ‘àwọn òkú,’ ‘ohùn,’ àti ‘yè’ yẹ, wọ́n sì pa ìtumọ̀ ẹ̀kọ́ ìsìn tí a kò gbọ́dọ̀ ti pinnu ṣáájú mọ́. A kò fi hàn pé ‘àwọn òkú’ jẹ́ ti ara nìkan tàbí ti ẹ̀mí nìkan.
