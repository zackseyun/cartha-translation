id: JHN.5.29
reference: John 5:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: yo
  text: wọ́n yóò sì jáde—àwọn tí wọ́n ti ṣe rere, sí àjíǹde ìyè[a]; ṣùgbọ́n àwọn tí wọ́n ti ṣe ohun búburú, sí àjíǹde ìdájọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àjíǹde ìdálẹ́bi” dípò “àjíǹde ìdájọ́.” Ọ̀rọ̀ Gíríìkì náà sọ pé “ìdájọ́,” èyí tí ìtumọ̀ rẹ̀ gbòòrò sí i; “ìdálẹ́bi” jẹ́ ìtumọ̀ tóóró tí àwọn ìtumọ̀ Bíbélì kan lò.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: wọn yóò sì jáde
  rationale: Nínú ọ̀rọ̀ yìí, àwọn òkú ń jáde láti inú ibojì; “jáde” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá àyíká ẹsẹ 28–29 mu.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: àwọn tí wọ́n ti ṣe rere
  rationale: Ó fi ìṣe rere hàn ní ṣókí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere láìfi irú iṣẹ́ kan pàtó kún un.
- source_word: ἀνάστασιν ζωῆς
  choice: àjíǹde ìyè
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ onírun-orúkọ inú Gíríìkì mọ́, dípò yíyanju rẹ̀ ní kíkún gẹ́gẹ́ bí “àjíǹde sí ìyè.”
- source_word: τὰ φαῦλα πράξαντες
  choice: àwọn tí wọ́n ti ṣe búburú
  rationale: “Ṣe búburú” mú ìtumọ̀ ìwà búburú inú àyíká ìdájọ́ jáde ní èdè Yorùbá tí ó wọ́pọ̀, láìsọ ọ́ di ohun tí kò níye lórí nìkan.
- source_word: ἀνάστασιν κρίσεως
  choice: àjíǹde ìdájọ́
  rationale: κρίσις túmọ̀ sí “ìdájọ́” ní ìtumọ̀ gbòòrò; yíyan “ìdálẹ́bi” nínú ara ẹsẹ̀ yóò dín ìtumọ̀ orísun kù.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ọ̀rọ̀ yìí fi ìyàtọ̀ láàárín ẹgbẹ́ méjèèjì àti ohun tí ó ń dúró de wọn hàn kedere.
theological_decisions:
- issue: Bóyá κρίσεως yẹ kí a túmọ̀ rẹ̀ ní ìtumọ̀ gbòòrò bí “ìdájọ́” tàbí ní ìtumọ̀ tóóró bí “ìdálẹ́bi”
  choice: ìdájọ́
  alternative: ìdálẹ́bi
  rationale: Ọ̀rọ̀ Gíríìkì κρίσις kò fúnra rẹ̀ béèrè pé kí a dín ìtumọ̀ rẹ̀ kù sí ìdálẹ́bi. “Ìdájọ́” pa fífún ọ̀rọ̀ náà ní àyè rẹ̀ àti ìfẹ̀sẹ̀mulẹ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò tíì yanjú mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti kíkà-rọrùn ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa ìṣètò ìyàtọ̀ méjì inú Gíríìkì mọ́, a sì lò àmì gígùn láti so ọ̀rọ̀ náà mọ́ àyíká ẹsẹ̀ tó ṣáájú.
