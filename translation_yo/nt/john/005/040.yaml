  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: yo
  text: Síbẹ̀, ẹ̀yin kò fẹ́ wá sọ́dọ̀ mi, kí ẹ lè ní ìyè[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àti pé ẹ̀yin kò fẹ́ wá sọ́dọ̀ mi, kí ẹ lè ní ìyè.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà tún lè jẹ́ “àti.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Ìhìn Rere Johanu, “ìyè” sábà máa ń ní ìtumọ̀ tí ó kún sí i, ìyẹn ìyè láti ọ̀dọ̀ Ọlọ́run—ìyè àìnípẹ̀kun—bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ “àìnípẹ̀kun” kò sí níhìn-ín.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Síbẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé καί sábà máa ń túmọ̀ sí “àti,” níhìn-ín ó fi ìyàtọ̀ hàn láàárín ẹ̀rí tí ó tọ́ka sí Jesu àti àìfẹ́ àwọn olùgbọ́ rẹ̀ láti tọ̀ ọ́ wá. “Síbẹ̀” mú ìyàtọ̀ náà jáde lọ́nà àdánidá.
- source_word: οὐ θέλετε
  choice: ẹ̀yin kò fẹ́
  rationale: θέλω ń sọ̀rọ̀ nípa fífẹ́ tàbí níní ìfẹ́-ọkàn. “Ẹ̀yin kò fẹ́” pa ìtumọ̀ yìí mọ́ láìmú un le débi “ẹ̀yin kọ̀ jálẹ̀.” Fífìdí “ẹ̀yin” múlẹ̀ tún bá ìtẹnumọ́ inú ọ̀rọ̀ náà mu.
- source_word: ἐλθεῖν πρός με
  choice: wá sọ́dọ̀ mi
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti tọ ẹnì kan wá. “Wá sọ́dọ̀ mi” jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa àwòrán wíwá sọ́dọ̀ Jesu mọ́, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí “gbà mí gbọ́.”
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: ἵνα ń fi ète hàn níhìn-ín. “Kí ẹ lè” sọ ète náà ní Yorùbá tí ó ṣe kedere, tí ó sì bá gbólóhùn náà mu.
- source_word: ζωὴν
  choice: ìyè
  rationale: ζωή túmọ̀ sí “ìyè.” Nínú Ìhìn Rere Johanu, ó sábà ní ìtumọ̀ jíjinlẹ̀ ti ìyè láti ọ̀dọ̀ Ọlọ́run, ṣùgbọ́n ọ̀rọ̀ “àìnípẹ̀kun” kò sí nínú ẹsẹ yìí.
- source_word: ἔχητε
  choice: ẹ lè ní
  rationale: Ọ̀rọ̀-ìṣe yìí jẹ́ subjunctive lẹ́yìn ἵνα. “Ẹ lè ní” fi ète náà hàn lọ́nà Yorùbá àdánidá láìfi àìdánilójú tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Bóyá kí ζωὴν jẹ́ “ìyè” tàbí “ìyè àìnípẹ̀kun”
  choice: ìyè
  alternative: ìyè àìnípẹ̀kun
  rationale: Bí Johanu tilẹ̀ sábà máa ń lo ζωή fún ìyè tí Ọlọ́run ń fúnni, αἰώνιος (“àìnípẹ̀kun”) kò sí níhìn-ín. Nítorí náà, a pa ọ̀rọ̀ orísun mọ́, a kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ẹsẹ náà.
- issue: Bóyá kí “wá sọ́dọ̀ mi” jẹ́ àlàyé tààrà gẹ́gẹ́ bí gbígbàgbọ́
  choice: wá sọ́dọ̀ mi
  alternative: gbà mí gbọ́; wá sọ́dọ̀ mi pẹ̀lú ìgbàgbọ́
  rationale: Nínú Johanu, wíwá sọ́dọ̀ Jesu ní ìbátan tímọ́tímọ́ pẹ̀lú gbígbàgbọ́, ṣùgbọ́n ọ̀rọ̀ orísun lo àwòrán “wá.” Mímú àwòrán náà dúró ń yẹra fún pípa àwòrán náà dà sí àlàyé nínú ẹsẹ pàtàkì.
translation_notes:
  register: A lo Yorùbá àtẹ̀wọ́dá, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àmì ohùn kún, a sì lo “ẹ̀yin” láti fi ọ̀pọ̀ ènìyàn tí Jesu ń bá sọ̀rọ̀ hàn àti láti pa ìtẹnumọ́ inú Gíríìkì mọ́.
