  to: Nítorí[a] áńgẹ́lì kan máa ń sọ̀kalẹ̀ sínú adágún náà láti ìgbà dé ìgbà, ó sì máa ń da omi náà rú. Nítorí náà, ẹni àkọ́kọ́ tí ó bá wọ inú rẹ̀ lẹ́yìn tí omi náà rú, máa ń di ẹni tí ara rẹ̀ yá[b] kúrò nínú àìsàn èyíkéyìí tí ó ń ṣe é.
