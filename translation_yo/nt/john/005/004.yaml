id: JHN.5.4
reference: John 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: yo
  text: Nítorí[a] áńgẹ́lì kan máa ń sọ̀kalẹ̀ sínú adágún náà láti ìgbà dé ìgbà, ó sì máa ń da omi náà rú. Nítorí náà, ẹni àkọ́kọ́ tí ó bá wọ inú rẹ̀ lẹ́yìn tí omi náà rú, máa ń di ẹni tí ara rẹ̀ yá[b] kúrò nínú àìsàn èyíkéyìí tí ó ń ṣe é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí, pẹ̀lú ìdajì ìkẹyìn ẹsẹ 3, kò sí nínú àwọn papírù Gíríìkì àkọ́kọ́ tí ó kù, bí Papyrus 66 àti Papyrus 75 ti ọ̀rúndún kẹta, tàbí nínú àwọn àfọwọ́kọ pàtàkì ti ọ̀rúndún kẹrin, Sinaiticus àti Vaticanus. Ó wà nínú ọ̀pọ̀ jù lọ àṣà àwọn àfọwọ́kọ Byzantine, àti nínú àwọn ìtumọ̀ Látìn àti Síríákì ìgbàanì. Ọ̀pọ̀ àwọn onímọ̀ ka a sí àfikún àkọ̀wé ìgbàanì, láti ṣàlàyé ìdí tí àwọn aláìlera fi péjọ sí adágún náà.
    reason: textual_critical
  - marker: b
    text: Tàbí, “a máa mú un láradá.”
    reason: previous_rendering
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: láti ìgbà dé ìgbà
  rationale: Ó fi ìṣẹ̀lẹ̀ tí ń ṣẹlẹ̀ lẹ́ẹ̀kọ̀ọ̀kan hàn, láìsọ pé ó ní àsìkò pàtó tí a ti ṣètò.
- source_word: κατέβαινεν
  choice: máa ń sọ̀kalẹ̀
  rationale: Àkókò imperfect Gíríìkì fi ìṣe àṣà tí ó ń tún ṣẹlẹ̀ nígbà àtijọ́ hàn; ‘máa ń’ ni ó sọ èyí ní Yorùbá àdánidá.
- source_word: ἐτάρασσεν τὸ ὕδωρ
  choice: máa rú omi náà
  rationale: ‘Rú omi’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé a dá omi rú tàbí mú kí ó ru.
- source_word: ὑγιὴς ἐγίνετο
  choice: a máa mú un láradá
  rationale: Ó pa ìtumọ̀ ìmúláradá àti ìṣe tí ó máa ń ṣẹlẹ̀ mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: kúrò nínú àìsàn èyíkéyìí tí ó bá ń ṣe é
  rationale: Ní ọ̀rọ̀ nípa àìsàn, κατέχω túmọ̀ sí àìsàn tí ó dì mọ́ ènìyàn tàbí tí ó ń yọ ọ́ lẹ́nu; ‘tí ó bá ń ṣe é’ jẹ́ ọ̀nà Yorùbá tí gbogbo ènìyàn lóye.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣeé lóye. A lo ‘máa ń’ láti fi imperfect ti àwọn ìṣe àṣà hàn. Àmì [a] tọ́ka sí ìyàtọ̀ pàtàkì nínú àwọn àfọwọ́kọ, [b] sì fi ọ̀nà mìíràn ti gbolohun ὑγιὴς ἐγίνετο hàn.
