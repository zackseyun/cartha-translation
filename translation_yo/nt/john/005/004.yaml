  source_fidelity: Ìtumọ̀ náà mú ìṣe tí ó máa ń ṣẹlẹ̀ léraléra nínú κατέβαινεν àti ἐγίνετο hàn dáadáa. Ṣùgbọ́n gbolohun “a máa mú un láradá” fi olùṣe ìmúláradá kan kún ọ̀rọ̀ náà, níbi tí Gíríìkì ti sọ pé ẹni náà fúnra rẹ̀ “máa ń di ẹni tí ara rẹ̀ yá.”
  naturalness: “Ó sì máa ń da omi náà rú” jẹ́ ìsọ̀rọ̀ Yorùbá tó túbọ̀ ṣe kedere ju “a sì máa rú omi náà” lọ. “Máa ń di ẹni tí ara rẹ̀ yá” sì jẹ́ ọ̀nà àdánidá láti sọ ὑγιὴς ἐγίνετο láìfi agbára ìmúláradá sí ẹlòmíràn.
  terminology: Adágún, áńgẹ́lì, àìsàn, àti àwọn orúkọ àwọn àfọwọ́kọ náà yẹ. A tún ṣàtúnṣe àlàyé akọ̀sílẹ̀ ìsàlẹ̀ kí ó má bà a dà bí ẹni pé gbogbo àwọn àfọwọ́kọ Gíríìkì àkọ́kọ́ ni ó pàdánù ẹsẹ náà, àti kí ó má sọ pé akọ̀wé kan ṣoṣo ni ó dá a sí.
