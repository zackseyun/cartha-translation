  terminology: ‘Ẹ̀rí’ fún μαρτυρία àti ‘jẹ́rìí’ fún μαρτυρεῖ jẹ́ ọ̀rọ̀ tó tọ́, tí ó yẹ fún ìforúkọsílẹ̀ ẹ̀rí/ìdájọ́ inú àyíká yìí. A tún ṣe àtúnṣe àlàyé ẹsẹ̀-isàlẹ̀, nítorí ‘fi ẹ̀rí jẹ́’ kò jẹ́ ìsọ̀rọ̀ Yorùbá tó bófin mu.
