id: JHN.5.32
reference: John 5:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: yo
  text: Ẹlòmíràn wà tí ń jẹ́rìí nípa mi[a], mo sì mọ̀ pé ẹ̀rí tí ó ń jẹ́rìí nípa mi jẹ́ òótọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ń fi ẹ̀rí hàn nípa mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: Ẹlòmíràn
  rationale: Ó túmọ̀ sí ẹni mìíràn, ó sì pa ìyàtọ̀ sí ẹ̀rí Jesu fúnra rẹ̀ mọ́ láì sọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ὁ μαρτυρῶν
  choice: tí ń jẹ́rìí
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ń lọ lọ́wọ́ hàn; ‘ń jẹ́rìí’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe kedere.
- source_word: περὶ ἐμοῦ
  choice: nípa mi
  rationale: Níbi yìí, περί pẹ̀lú ọ̀rọ̀-orúkọ nínú genitive ń tọ́ka sí kókó tàbí ẹni tí ẹ̀rí náà dá lé; ‘nípa mi’ jẹ́ àfihàn Yorùbá tó bá a mu.
- source_word: οἶδα
  choice: mo mọ̀
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ ìmọ̀ yìí ni ‘mo mọ̀.’
- source_word: ἀληθής
  choice: òótọ́
  rationale: Ó sọ ànímọ́ ẹ̀rí náà pé ó jẹ́ òtítọ́, ó ṣeé gbẹ́kẹ̀ lé; ‘òótọ́’ kò fi ìtumọ̀ àfikún kún un.
- source_word: ἡ μαρτυρία
  choice: ẹ̀rí
  rationale: ‘Ẹ̀rí’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún testimony, ó sì pa ìrísí ọ̀rọ̀ ilé-ẹjọ́ inú àyíká náà mọ́.
- source_word: ἣν μαρτυρεῖ
  choice: tí ó ń jẹ́
  rationale: A pa ìsopọ̀ ọ̀rọ̀ tó wà láàárín ‘ẹ̀rí’ àti ‘jẹ́rìí’ mọ́, pẹ̀lú gbólóhùn àlàyé ‘tí ó ń jẹ́,’ bó tilẹ̀ jẹ́ pé ìsọ̀rọ̀ náà tún ara rẹ̀ sọ díẹ̀ gẹ́gẹ́ bí ara ìkọ̀wé Johanu.
theological_decisions:
- issue: Ta ni ‘ẹlòmíràn’ (ἄλλος) ń tọ́ka sí?
  choice: A túmọ̀ ọ́ ní gbogbogbòò sí ‘Ẹlòmíràn’ láì dá ẹni náà mọ̀ nínú ẹsẹ yìí.
  alternative: Ó lè tọ́ka sí Johanu Onítẹ̀bọmi, Baba, tàbí ẹlẹ́rìí mìíràn ní ìtumọ̀ ilé-ẹjọ́.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò sọ ẹni náà ní pàtó. Nítorí náà, ìtumọ̀ yìí pa àìdánilójú inú orísun mọ́, kò sì fi èrò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbòò. A mọ̀ọ́mọ̀ pa àtúnsọ ‘ẹ̀rí … ń jẹ́’ mọ́ láti ṣàfihàn ìsopọ̀ ọ̀rọ̀ inú Gíríìkì.
