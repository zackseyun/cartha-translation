  source_fidelity: Ìtumọ̀ náà pa ‘ẹlòmíràn’ mọ́ láì sọ ẹni tí ó jẹ́, ó sì túmọ̀ ìṣe ẹ̀rí, ‘mo mọ̀,’ àti ìdánilójú pé ẹ̀rí náà jẹ́ òótọ́ dáadáa. Ṣùgbọ́n ‘tí ó ń jẹ́ nípa mi’ kò lè rú iṣẹ́ μαρτυρεῖ; ó yí ìtumọ̀ ọ̀rọ̀ náà padà sí ‘eating/being’ dípò ‘testifying.’
