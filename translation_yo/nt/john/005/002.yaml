  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: yo
  text: Ní Jerúsálẹ́mù, lẹ́gbẹ̀ẹ́ Ẹnubodè Àgùntàn[c], adágún kan wà; ní èdè Hébérù[a], a ń pè é ní Bẹtisádà[b], ó sì ní ìloro márùn-ún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní èdè Aramaiki.” Ọ̀rọ̀ tí Jòhánù lò fún “èdè Hébérù” sábà máa ń tọ́ka sí èdè àwọn ará agbègbè Jùdíà, kì í ṣe Hébérù àtijọ́ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní “Bẹtisátà” tàbí “Bẹtisáídà” dípò “Bẹtisádà.”
    reason: textual_variant
  - marker: c
    text: Ó ṣeé ṣe kí ọ̀rọ̀ Gíríìkì náà tọ́ka sí agbègbè Ẹnubodè Àgùntàn (fi wé Nehemáyà 3:1; 12:39); a lóye “Ẹnubodè” bí ó tilẹ̀ jẹ́ pé kò fara hàn ní tààràtà nínú ẹsẹ yìí.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: wà
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ἔστιν ni a pa mọ́ pẹ̀lú “wà”; δέ jẹ́ asopọ̀ fẹ́lẹ́fẹ́ tí kò nílò ọ̀rọ̀ àfikún ní Yorùbá.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: Ní Jerúsálẹ́mù
  rationale: A lo orúkọ ìlú tí ó wọ́pọ̀ ní Yorùbá, láìtẹ̀lé ọ̀pọ̀ nọ́ńbà nínú ìrísí Gíríìkì.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: lẹ́gbẹ̀ẹ́ Ẹnubodè Àgùntàn[c]
  rationale: Gbólóhùn Gíríìkì yìí fi orúkọ tí a ń ṣàlàyé sílẹ̀; àyíká àti ìmọ̀ nípa Jerúsálẹ́mù tọ́ka sí agbègbè Ẹnubodè Àgùntàn. Àkọ́lé ẹnubodè náà ni a ṣàfikún fún ìtumọ̀ tó ṣe kedere, a sì samí rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: κολυμβήθρα
  choice: adágún kan
  rationale: “Adágún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ibi omi tí a kó jọ; “kan” mú àgbékalẹ̀ aláìní àfihàn pàtó ti Gíríìkì jáde lọ́nà àdánidá.
- source_word: ἡ ἐπιλεγομένη
  choice: tí a ń pè ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ní orúkọ kan.
- source_word: Ἑβραϊστὶ
  choice: ní èdè Hébérù[a]
  rationale: A tẹ̀lé ohun tí ọ̀rọ̀ Gíríìkì sọ ní tààràtà, ṣùgbọ́n àlàyé ìsàlẹ̀ tọ́ka sí pé ó lè túmọ̀ sí èdè Aramaiki agbègbè náà.
- source_word: Βηθεσδά
  choice: Bẹtisádà[b]
  rationale: A tẹ̀lé Bηθεσδά nínú SBLGNT, a sì ṣe àfihàn àwọn ìrísí mìíràn nínú àwọn àfọwọ́kọ ní àlàyé ìsàlẹ̀.
- source_word: πέντε στοὰς ἔχουσα
  choice: ó ní ọ̀nà àbẹ́ òrùlé márùn-ún
  rationale: στοά túmọ̀ sí ọ̀nà tí òrùlé bò, tí àwọn ọ̀wọ̀n sì sábà ń gbé ró. Ìtumọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá ju ọ̀rọ̀ àjèjì bí “pórítíkò” lọ.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Ọ̀nà àbẹ́ òrùlé” jẹ́ àlàyé tó rọrùn fún στοά, ó sì yẹra fún ọ̀rọ̀ àyálò tí ọ̀pọ̀ ènìyàn kò mọ̀. A tò àwọn àmì àlàyé lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
