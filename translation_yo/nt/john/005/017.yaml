  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀπεκρίνατο αὐτοῖς· Ὁ πατήρ μου ἕως ἄρτι ἐργάζεται κἀγὼ ἐργάζομαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Baba mi ń ṣiṣẹ́ títí di ìsinsìnyí, èmi náà sì ń ṣiṣẹ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn sí ẹ̀sùn inú àyíká ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìdáhùn Jésù.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: ó dá wọn lóhùn pé
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ Gíríìkì fún ‘ó dá wọn lóhùn’ mu.
- source_word: Ὁ πατήρ μου
  choice: Baba mi
  rationale: Ó pa ìbátan ti ara ẹni àti ìtumọ̀ ẹ̀kọ́ nípa Ọlọ́run mọ́, láìfi àlàyé míì kún ọ̀rọ̀ náà.
- source_word: ἕως ἄρτι
  choice: títí di ìsinsìnyí
  rationale: Ó túmọ̀ sí ìtẹ̀síwájú iṣẹ́ dé àkókò tí a wà yìí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà.
- source_word: ἐργάζεται
  choice: ń ṣiṣẹ́
  rationale: Àmì ‘ń’ fi iṣẹ́ tó ń lọ lọ́wọ́ hàn ní Yorùbá, ó sì mú ipa ìṣe àsìkò ìsinsìnyí nínú Gíríìkì jáde lọ́nà àdánidá.
- source_word: κἀγὼ
  choice: èmi náà sì
  rationale: ‘Èmi náà’ pa ìtẹnumọ́ adarí-orúkọ àti ìfikún Jésù mọ́ lẹ́gbẹ̀ẹ́ iṣẹ́ Baba; ‘sì’ so àwọn gbólóhùn méjèèjì pọ̀.
- source_word: ἐργάζομαι
  choice: ń ṣiṣẹ́
  rationale: Ó bá ọ̀rọ̀ tí a lò fún iṣẹ́ Baba dọ́gba, ó sì pa ìṣe tí ń tẹ̀ síwájú mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ iṣẹ́ Jésù pẹ̀lú iṣẹ́ Baba ní ọjọ́ ìsinmi
  choice: “Baba mi ń ṣiṣẹ́ títí di ìsinsìnyí, èmi náà sì ń ṣiṣẹ́.”
  alternative: “Baba mi máa ń ṣiṣẹ́ títí di ìsinsìnyí, èmi náà sì máa ń ṣiṣẹ́.”
  rationale: Ìtumọ̀ yìí pa ìfiwéra tààrà láàárín iṣẹ́ Baba àti iṣẹ́ Jésù mọ́, kò sì rọ ìdọ́gba inú gbólóhùn Gíríìkì náà tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A kò fi àlàyé ìsàlẹ̀ ojú ewé sí i, nítorí ‘ń ṣiṣẹ́’ ń sọ ìṣe tó ń lọ lọ́wọ́ kedere ní Yorùbá, kò sì nílò àṣàyàn gírámà Gẹ̀ẹ́sì simple/progressive.
