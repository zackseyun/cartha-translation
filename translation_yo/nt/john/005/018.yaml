id: JHN.5.18
reference: John 5:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: yo
  text: Nítorí èyí ni àwọn Júù[a] ṣe túbọ̀ ń wá ọ̀nà láti pa á, nítorí pé kì í ṣe pé ó ń rú ọjọ́ Ìsinmi nìkan, ṣùgbọ́n ó tún ń pe Ọlọ́run ní Baba tirẹ̀, nípa ṣíṣe ara rẹ̀ di ẹni dọ́gba pẹ̀lú Ọlọ́run.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú ìwé Jòhánù, “àwọn Júù” sábà máa ń tọ́ka ní pàtó sí àwọn alatako Jésù kan ní ilẹ̀ Jùdíà tàbí sí àwọn aláṣẹ Júù kan, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn; kì í ṣe sí gbogbo àwọn Júù láìsí ìyàtọ̀.
    reason: cultural_note
  - marker: b
    text: Tàbí, “nípa fífi ara rẹ̀ dọ́gba pẹ̀lú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Nítorí èyí
  rationale: Yorùbá yìí fi ìbáṣepọ̀ ìdí àti àbájáde hàn ní ti ẹ̀dá; fífi ọ̀rọ̀ méjì tí ó túmọ̀ sí ‘nítorí náà’ tẹ̀ lé ara wọn kì í ṣe ti ẹ̀dá ní Yorùbá.
- source_word: μᾶλλον ἐζήτουν ... ἀποκτεῖναι
  choice: túbọ̀ ń wá ọ̀nà láti pa á
  rationale: ‘Túbọ̀’ mú ìtẹnumọ́ afiwéra μᾶλλον jáde, ‘ń wá ọ̀nà’ sì ṣàfihàn ìṣe tí ó ń lọ lọ́wọ́ nínú ἐζήτουν.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì fi ìtumọ̀ tó dín ẹni tí a ń tọ́ka sí kù sínú ẹsẹ̀ náà; àlàyé ọ̀rọ̀-ìsàlẹ̀ sọ bí ọ̀rọ̀ náà ṣe máa ń ṣiṣẹ́ nínú Jòhánù.
- source_word: ἔλυε τὸ σάββατον
  choice: ó ń rú ọjọ́ Ìsinmi
  rationale: ‘Rú ọjọ́ Ìsinmi’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún rírú òfin tàbí ìlànà ọjọ́ Sábáàtì, ó sì pa ohùn ẹ̀sùn inú àyíká náà mọ́.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: ó tún ń pe Ọlọ́run ní Baba òun fúnra rẹ̀
  rationale: ‘Òun fúnra rẹ̀’ mú agbára ἴδιον (‘tirẹ̀ gan-an’) jáde, láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: ó sì ń sọ ara rẹ̀ di ẹni tí ó bá Ọlọ́run dọ́gba
  rationale: Ó pa àwòrán ‘ṣíṣe ara rẹ̀ dọ́gba’ àti ìtumọ̀ ìdọ́gba pẹ̀lú Ọlọ́run mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa ìdọ́gba Jésù pẹ̀lú Ọlọ́run
  choice: ó sì ń sọ ara rẹ̀ di ẹni tí ó bá Ọlọ́run dọ́gba
  alternative: ó ń sọ pé òun dọ́gba pẹ̀lú Ọlọ́run
  rationale: Àṣàyàn náà kò dín agbára ọ̀rọ̀ Kristọ́lọ́jì kù, ó sì tẹ̀ lé participle ποιῶν ní pẹkipẹki láì fi èdè ẹ̀kọ́ ìgbàgbọ́ ọjọ́ iwájú kún un.
- issue: Ẹni tí ‘àwọn Júù’ ń tọ́ka sí nínú àyíká Jòhánù
  choice: Pa ‘àwọn Júù’ mọ́ nínú ẹsẹ̀, kí a sì ṣàlàyé àyíká rẹ̀ ní ọ̀rọ̀-ìsàlẹ̀
  alternative: àwọn olórí Júù tàbí àwọn ará Jùdíà
  rationale: οἱ Ἰουδαῖοι fúnra rẹ̀ gbooro ju àwọn àṣàyàn tó dín un kù lọ; ọ̀rọ̀-ìsàlẹ̀ ń dáàbò bo kíkà tí kò fi ẹ̀sùn kan gbogbo àwọn Júù láìsí ìyàtọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo ‘ọjọ́ Ìsinmi’ fún Sábáàtì, a sì fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìtẹnumọ́ àti ìforígbárí ẹ̀kọ́ inú orísun Gíríìkì mọ́.
