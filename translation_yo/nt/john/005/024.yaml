id: JHN.5.24
reference: John 5:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: yo
  text: '**Jòhánù 5:24**


    “Lóòótọ́, lóòótọ́, mo wí fún yín pé, ẹni tí ń gbọ́ ọ̀rọ̀ mi, tí ó sì gba ẹni tí ó rán mi gbọ́, ní ìyè àìnípẹ̀kun; kì í sì í wá sínú ìdájọ́[a], ṣùgbọ́n ó ti kọjá[b] láti inú ikú sínú ìyè.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “kì í wá sínú ìdálẹ́bi.” Ọ̀rọ̀ Gíríìkì κρίσις lè túmọ̀ sí ìdájọ́ lápapọ̀ tàbí, nínú àyíká ọ̀rọ̀ yìí, ìdájọ́ tí kò dára.
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀-ìṣe perfect Gíríìkì fi hàn pé ìyípadà kan ti parí, ṣùgbọ́n àbájáde rẹ̀ ṣì ń bá a lọ: “ó ti kọjá” tàbí “ó ti rékọjá” láti inú ikú sínú ìyè.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó sọ agbára àti ìtẹnumọ́ ọ̀rọ̀ ìṣáájú tí a tún lẹ́ẹ̀mejì, ó sì jẹ́ Yorùbá àdánidá tí òǹkàwé òde òní lè lóye.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ó pa ìsọ̀rọ̀ tààrà náà mọ́, ó sì bá ìforígbárí ọ̀rọ̀ ìbílẹ̀ tó ní iyì mu.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: ẹni tí ó bá ń gbọ́ ... tí ó sì ... gbọ́
  rationale: ‘Ẹni tí ó bá’ fi hàn pé ẹnikẹ́ni ni ọ̀rọ̀ náà ń tọ́ka sí; àmì ‘ń’ tún pa ìṣe tí ó ń bá a lọ mọ́.
- source_word: τὸν λόγον μου
  choice: ọ̀rọ̀ mi
  rationale: Ó sún mọ́ λόγος, ó sì pa ìtumọ̀ ọ̀rọ̀ tàbí iṣẹ́ tí Jésù ń kéde mọ́ láì fi àlàyé kún un.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: gba ẹni tí ó rán mi gbọ́
  rationale: Ìṣọ̀rọ̀ ‘gba ... gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan gba ẹni mìíràn gbọ́ tàbí gbẹ́kẹ̀ lé e; ó tún tẹ̀ lé ohun tí dative Gíríìkì ń tọ́ka sí.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: ní ìyè àìnípẹ̀kun
  rationale: ‘Ní’ fi hàn pé ó ní ìyè náà nísinsìnyí, nígbà tí ‘ìyè àìnípẹ̀kun’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ζωὴ αἰώνιος.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: kì í sì í wá sínú ìdájọ́
  rationale: ‘Kì í ... wá’ pa ìṣe ìsinsìnyí oníwà-pípẹ́ mọ́, ‘sínú’ sì fi ipa εἰς hàn. ‘Ìdájọ́’ kò dín κρίσις kù sí ìdálẹ́bi nìkan.
- source_word: μεταβέβηκεν
  choice: ó ti rékọjá
  rationale: ‘Ó ti’ fi ìṣe tí a ti parí hàn, ‘rékọjá’ sì fi ìyípadà láti ipò kan sí òmíràn hàn; papọ̀, wọ́n mú ipa perfect Gíríìkì jáde lọ́nà àdánidá.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: láti inú ikú sínú ìyè
  rationale: Ó pa ìyàtọ̀ líle láàárín ikú àti ìyè mọ́, ó sì mú ìtọ́sọ́nà àwọn ọ̀rọ̀ atọ́ka ἐκ àti εἰς jáde.
theological_decisions:
- issue: Ìtumọ̀ κρίσις nínú ọ̀rọ̀ ìgbàlà yìí
  choice: ìdájọ́
  alternative: ìdálẹ́bi
  rationale: Ní àyíká ọ̀rọ̀ náà, κρίσις lè ní ìtumọ̀ ìdájọ́ tí àbájáde rẹ̀ kò dára, ṣùgbọ́n ọ̀rọ̀ náà fúnra rẹ̀ gbòòrò ju ‘ìdálẹ́bi’ lọ. ‘Ìdájọ́’ pa àìdánilójú gidi àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Ipa ọ̀rọ̀-ìṣe ìsinsìnyí ἔχει àti perfect μεταβέβηκεν
  choice: ní ìyè àìnípẹ̀kun nísinsìnyí, ó sì ti rékọjá láti inú ikú sínú ìyè pẹ̀lú àbájáde tí ó dúró
  alternative: ìyè ọjọ́ iwájú nìkan tàbí ìdásílẹ̀ ní ọjọ́ ìdájọ́ nìkan
  rationale: Gíríìkì fi ìní ìsinsìnyí àti ìyípadà tí a ti parí tí àbájáde rẹ̀ ń bá a lọ hàn. Ìtumọ̀ náà pa èyí mọ́ láì fi ètò ẹ̀kọ́ ìjọ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Ìtẹnumọ́ àtúnwí ‘Lóòótọ́, lóòótọ́’ àti ìyàtọ̀ ‘ikú/ìyè’ ni a pa mọ́. A gbé àwọn àmì àlàyé [a] àti [b] sí ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
