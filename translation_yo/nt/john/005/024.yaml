  source_fidelity: Ìtumọ̀ náà mú ìtẹnumọ́ Ἀμὴν ἀμὴν, ìní ìsinsìnyí nínú ἔχει, ìdájọ́ gẹ́gẹ́ bí ìtumọ̀ gbòòrò fún κρίσις, àti ipa perfect nínú μεταβέβηκεν dáadáa. Ṣùgbọ́n ìkọ̀lé “ẹni tí ó bá ń gbọ́” ní ìrísí ìpò-àdéhùn tí kò hàn nínú àwọn participle Gíríìkì náà; a tún un ṣe sí ìsọ̀rọ̀ gbogbogbò tí ó sun mọ́ ọ̀rọ̀ ìpilẹ̀.
