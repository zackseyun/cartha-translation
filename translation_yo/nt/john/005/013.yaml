review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi ìwòsàn, àìmọ̀ ọkùnrin náà, àti kíkúrò Jésù hàn dáadáa. Síbẹ̀, ìtúmọ̀ ἐξένευσεν gẹ́gẹ́ bí “láìjẹ́ kí àwọn ènìyàn kíyè sí i” ṣàfikún kókó kan tí Gíríìkì kò sọ ní tààrà; ó dára kí a fi ìfẹ̀hàn ìkúrò láìfa àfiyèsí sílẹ̀ fún àlàyé-ẹ̀sẹ̀. “Nígbà tí” fún ὄχλου ὄντος tún pa ìbáṣepọ̀ attendant circumstance/cause tí ó ṣí silẹ̀ nínú Gíríìkì mọ́ ju “torí pé” lọ.
  naturalness: “A ti mú láradá” jẹ́ ọ̀nà Yorùbá àdánidá ju ìkọ̀ “mú lára dá” lọ. Ìlò “nítorí ... torí pé” nínú gbolohun kan dùn bí àtúnwí ìsopọ̀; àtúnṣe náà jẹ́ kó rọrùn àti kó ṣàn dáadáa.
  terminology: “Mú láradá,” “ẹni tí ó jẹ́,” àti “ọ̀pọ̀ ènìyàn” bá Standard Yorùbá mu. Orúkọ Jésù àti ìfọ̀rọ̀wérọ̀ ìtumọ̀ kò ní ìṣòro ẹ̀kọ́ ìsìn.
  issues:
  - severity: medium
    issue: Àfikún ẹni tí ó máa kíyè sí Jésù
    rationale: “Láìjẹ́ kí àwọn ènìyàn kíyè sí i” sọ ní pàtó pé àwọn ènìyàn náà ni wọn kò kíyè sí i, nígbà tí ἐξένευσεν kan tọ́ka sí ìkúrò tàbí yíyọ kúrò láìfa àfiyèsí. Kí ìfẹ̀hàn náà wà nínú àlàyé-ẹ̀sẹ̀ dára ju kí a sọ ọ́ di àfikún nínú ẹsẹ̀ lọ.
  - severity: low
    issue: Ìkọ̀ ọ̀rọ̀ “mú láradá”
    rationale: Nínú Standard Yorùbá, “mú láradá” ni ìkọ̀ tí ó wọ́pọ̀ àti tí ó dára fún ‘heal’.
