source:
  edition: SBLGNT
  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: yo
  text: Ṣùgbọ́n ọkùnrin tí a ti mú láradá náà kò mọ ẹni tí ó jẹ́, nítorí Jésù ti yọ́ lọ[a], nígbà tí ọ̀pọ̀ ènìyàn wà ní ibi náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti yọ́ kúrò níbẹ̀” tàbí “ti kúrò lọ.” Ọ̀rọ̀ Gíríìkì náà lè fi hàn pé Jésù kúrò láìfa àfiyèsí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: ọkùnrin tí a ti mú lára dá
  rationale: A ṣe àfihàn participle aláìṣe náà gẹ́gẹ́ bí ẹni tí ìwòsàn ti ṣẹlẹ̀ sí tẹ́lẹ̀; ‘ọkùnrin’ bá ẹni tí àyíká ọ̀rọ̀ ń tọ́ka sí mu, bí ó tilẹ̀ jẹ́ pé Yorùbá kò ní àmì akọ nínú gírámà.
- source_word: οὐκ ᾔδει
  choice: kò mọ
  rationale: Èyí ni ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu fún àìmọ̀ ní àyíká ọ̀rọ̀ yìí.
- source_word: τίς ἐστιν
  choice: ẹni tí ó jẹ́
  rationale: Ó pa ìtọ́kasí sí ìdánimọ̀ Jésù mọ́ láìfi àlàyé míì kún un.
- source_word: ἐξένευσεν
  choice: ti yọ́ kúrò níbẹ̀ láìjẹ́ kí àwọn ènìyàn kíyè sí i
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí kíkúrò ní ìkọ̀kọ̀ tàbí láìfa àfiyèsí; gbólóhùn yìí mú ìtumọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: ὄχλου ὄντος
  choice: torí pé ọ̀pọ̀ ènìyàn wà
  rationale: A tú genitive absolute náà gẹ́gẹ́ bí ìdí tàbí ipò tó ṣàlàyé bí Jésù ṣe yọ́ kúrò.
- source_word: ἐν τῷ τόπῳ
  choice: ní ibi náà
  rationale: Èyí tẹ̀ lé ìtumọ̀ ibi tí ọ̀rọ̀ Gíríìkì náà ní, ó sì jẹ́ Yorùbá tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà ní iyì, ṣùgbọ́n ó ṣe kedere fún òǹkàwé lásán; a sì pa agbára ìtumọ̀ ἐξένευσεν mọ́ láìsọ ọ́ di ẹ̀kọ́ ìsìn kan pàtó.
