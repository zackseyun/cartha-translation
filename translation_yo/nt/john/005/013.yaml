  to: Ṣùgbọ́n ọkùnrin tí a ti mú láradá náà kò mọ ẹni tí ó jẹ́, nítorí Jésù ti yọ́ lọ[a], nígbà tí ọ̀pọ̀ ènìyàn wà ní ibi náà.
