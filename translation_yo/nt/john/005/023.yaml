  source_fidelity: 'Ìtumọ̀ náà ń pa èrò pàtàkì Gíríìkì mọ́: ète ἵνα, gbogbo ènìyàn, ìfiwéra καθὼς, àti ìbáṣepọ̀ láàárín àìbọlá fún Ọmọ àti àìbọlá fún Baba tó rán an. Síbẹ̀, ‘lè máa bọlá’ fi ìmọ̀ ìṣe-àṣà/tí ń lọ déédéé kún gbolóhùn ète náà ju bí ó ṣe hàn nínú Gíríìkì lọ. ‘Ẹni tí kò bá bọlá’ lè jẹ́ ìpèníjà oníṣàníyàn (‘if one does not honor’) dípò gbólóhùn gbogbogbò ti apólà alábápín-orúkọ náà.'
