  terminology: A yẹ kí a pa ‘bọlá fún’ mọ́ fún τιμάω ní gbogbo ẹsẹ náà, kí àtúnlò ọ̀rọ̀-ìṣe Gíríìkì náà hàn. Lẹ́tà ńlá nínú ‘Ọmọ’ àti ‘Baba’ bá àyíká Johannine náà àti ìlò Yorùbá Kristẹni mu, láìfi ìtumọ̀ ẹ̀kọ́ míì kún un.
