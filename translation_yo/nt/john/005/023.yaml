id: JHN.5.23
reference: John 5:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: yo
  text: kí gbogbo ènìyàn lè bọlá fún Ọmọ gẹ́gẹ́ bí wọ́n ṣe ń bọlá fún Baba. Ẹni tí kì í bọlá fún Ọmọ kì í bọlá fún Baba tí ó rán an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Èyí fi ète tàbí àbájáde hàn ní Yorùbá àdánidá, ó sì bá agbára ἵνα mu.
- source_word: πάντες
  choice: gbogbo ènìyàn
  rationale: Ó mú ìtumọ̀ ‘gbogbo wọn’ tàbí ‘gbogbo ènìyàn’ ṣe kedere láìfi ẹgbẹ́ kankan kún ọ̀rọ̀ náà.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: bọlá fún
  rationale: ‘Bọlá fún’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọlá tí ó yẹ fún ẹnì kan hàn; a tún pa àtúnlò ọ̀rọ̀-ìṣe náà mọ́ ní gbogbo ẹsẹ náà.
- source_word: τὸν υἱὸν
  choice: Ọmọ
  rationale: Nínú àyíká ọ̀rọ̀ Johanu, ó jẹ́ orúkọ oyè fún Jesu; lẹ́tà ńlá ń ran òǹkàwé lọ́wọ́ láti rí ìlò yìí.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra tó lágbára hàn láàárín ọlá fún Ọmọ àti ọlá fún Baba, láìsọ ju ohun tí Gíríìkì sọ lọ.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Ó jẹ́ orúkọ oyè Ọlọ́run nínú àyíká ọ̀rọ̀ yìí; lẹ́tà ńlá bá ìlò Yorùbá Kristẹni tí ó wọ́pọ̀ mu.
- source_word: ὁ μὴ τιμῶν
  choice: Ẹni tí kò bá bọlá fún
  rationale: Èyí tú àpólà alábápín-orúkọ náà sí Yorùbá àdánidá, ó sì pa ìtumọ̀ gbogbogbò rẹ̀ mọ́.
- source_word: τὸν πέμψαντα αὐτόν
  choice: Baba tí ó rán an
  rationale: Gbólóhùn ìbátan yìí sọ Baba di ẹni tí ó rán Ọmọ, bí àpólà Gíríìkì náà ti ṣe.
- source_word: πέμψαντα
  choice: rán
  rationale: ‘Rán’ ni ìtumọ̀ tààrà tí ó sì wọ́pọ̀ fún πέμπω; ‘fún ní iṣẹ́’ yóò fi ìtumọ̀ àfikún sí i.
theological_decisions:
- issue: Agbára ìfiwéra láàárín bíbọlá fún Ọmọ àti bíbọlá fún Baba
  choice: A lo ‘gẹ́gẹ́ bí’ láti pa ìbámu tó lágbára mọ́.
  alternative: A lè lo ‘bí’ nìkan, ṣùgbọ́n ó lè dín agbára ìfiwéra náà kù.
  rationale: Ìtumọ̀ náà pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ tí ó wà nínú καθὼς mọ́, láìfi èdè ìjẹ́wọ́ ìgbàgbọ́ ti àwọn ọ̀rúndún tó tẹ̀ lé e kún ẹsẹ náà.
- issue: Ìlò lẹ́tà ńlá fún ‘Ọmọ’ àti ‘Baba’
  choice: A kọ méjèèjì pẹ̀lú lẹ́tà ńlá gẹ́gẹ́ bí orúkọ oyè.
  alternative: A lè kọ ‘ọmọ’ àti ‘baba’ pẹ̀lú lẹ́tà kékeré.
  rationale: Àwọn lẹ́tà inú Gíríìkì kì í dá ìpinnu yìí; síbẹ̀, àyíká ọ̀rọ̀ fi hàn pé Jesu àti Ọlọ́run Baba ni a ń tọ́ka sí, lẹ́tà ńlá sì ń mú èyí ṣe kedere láìfi ẹ̀kọ́ tuntun kún un.
- issue: Ẹni tí arọ́pò-orúkọ αὐτόν ń tọ́ka sí
  choice: A tú u sí ‘an,’ èyí tí àyíká ọ̀rọ̀ fi hàn pé Ọmọ ni.
  alternative: 'A lè tún ‘Ọmọ’ sọ ní kíkún: ‘Baba tí ó rán Ọmọ.’'
  rationale: Arọ́pò-orúkọ náà pa ìṣètò Gíríìkì mọ́, Yorùbá sì lè tọ́ka sí Ọmọ ní kedere láti inú àyíká ọ̀rọ̀, láìṣe àfikún tí kò pọndandan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àtúnlò ‘bọlá fún’ àti ìfiwéra inú ẹsẹ náà mọ́.
