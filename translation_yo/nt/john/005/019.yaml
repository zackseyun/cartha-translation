id: JHN.5.19
reference: John 5:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: yo
  text: Nítorí náà, Jésù dá wọn lóhùn, ó sì ń wí fún wọn pé, “Lóòótọ́, lóòótọ́ ni mo wí fún yín, Ọmọ kò lè ṣe ohunkóhun láti ara rẹ̀, bí kò ṣe ohun tí ó bá rí tí Baba ń ṣe; nítorí ohunkóhun tí Ẹni náà bá ṣe, nǹkan wọ̀nyí ni Ọmọ náà pẹ̀lú ń ṣe lọ́nà kan náà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν
  choice: Nítorí náà, Jésù dá wọn lóhùn
  rationale: “Nítorí náà” fi ìsopọ̀ ìtumọ̀ οὖν hàn, “dá wọn lóhùn” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ἀπεκρίνατο.
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: ó sì ń wí fún wọn pé
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ “ń wí” ṣetọju agbára imperfect ἔλεγεν, bí ó tilẹ̀ jẹ́ pé “ó sì wí pé” tún ṣeé lò ní Yorùbá.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́, lóòótọ́ ni mo wí fún yín
  rationale: Ó ṣetọju ìtẹnumọ́ àtúnsọ méjì náà ní èdè tí ó ṣe kedere, tí ó sì ní ọlá.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ... οὐδὲν
  choice: Ọmọ kò lè ṣe ohunkóhun
  rationale: “Kò lè” fi ìtumọ̀ agbára tàbí àìlèṣe inú δύναται hàn, “ohunkóhun” sì bá àkọsílẹ̀ òdì náà mu lọ́nà àdánidá.
- source_word: ἀφ’ ἑαυτοῦ
  choice: láti ọ̀dọ̀ ara rẹ̀
  rationale: Ó tẹ̀lé ìtumọ̀ orísun tàbí ìpilẹ̀ṣẹ̀ inú ἀπό + ọ̀rọ̀ arọ́pò-orúkọ afara-ẹni, láì sọ ọ́ di kìkì ìṣe láìsí ìrànlọ́wọ́.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: bí kò ṣe ohun tí ó bá rí tí Baba ń ṣe
  rationale: Ìtumọ̀ exception náà ni a mú jáde ní Yorùbá àdánidá; “ohun tí” ṣetọju ohun àìsọ pàtó tí τι ń tọ́ka sí.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: nítorí ohunkóhun tí Ẹni náà bá ń ṣe
  rationale: “Ohunkóhun ... bá” ṣetọju generalizing indefiniteness inú relative + ἄν + subjunctive; “Ẹni náà” sì fi ìtẹnumọ́ ἐκεῖνος hàn.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: ohun náà ni Ọmọ pẹ̀lú ń ṣe lọ́nà kan náà
  rationale: Ọ̀rọ̀ yìí pa ìbámu gangan láàárín iṣẹ́ Baba àti iṣẹ́ Ọmọ mọ́, pẹ̀lú ìtumọ̀ καὶ àti ὁμοίως.
theological_decisions:
- issue: Bí a ṣe lè túmọ̀ àìlèṣe Ọmọ láìyọ ìgbẹ́kẹ̀lé àti ìṣọ̀kan iṣẹ́ kúrò nínú ọ̀rọ̀ náà
  choice: Ọmọ kò lè ṣe ohunkóhun láti ọ̀dọ̀ ara rẹ̀
  alternative: Ọmọ kò lè dá ṣe ohunkóhun fúnra rẹ̀
  rationale: Àṣàyàn náà ṣetọju ọ̀rọ̀ tó lágbára nípa àìlèṣe láti orísun ara rẹ̀, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú gbólóhùn náà kún un. Ó jẹ́ kí ìgbẹ́kẹ̀lé àti ìṣọ̀kan iṣẹ́ tí ẹsẹ̀ náà sọ dúró nínú ìnira wọn.
- issue: Lílo “Ọmọ” àti “Baba” gẹ́gẹ́ bí orúkọ oyè
  choice: Ọmọ / Baba
  alternative: ọmọ / baba
  rationale: Nínú àyíká Jòhánù, àwọn ọ̀rọ̀ wọ̀nyí ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè pàtó fún Jésù àti Baba; lẹ́tà ńlá ń ran òǹkàwé lọ́wọ́ láìyí ìtumọ̀ Gíríìkì padà.
- issue: Ìtumọ̀ ìbámu iṣẹ́ Ọmọ pẹ̀lú iṣẹ́ Baba
  choice: ohun náà ni Ọmọ pẹ̀lú ń ṣe lọ́nà kan náà
  alternative: Ọmọ náà sì ń ṣe bẹ́ẹ̀ gẹ́gẹ́ bí Baba
  rationale: Àṣàyàn yìí ṣetọju ìtẹnumọ́ ταῦτα ... ὁμοίως, kò sì dín ọ̀rọ̀ náà kù sí àfarawé lasan tàbí ṣàlàyé irú ìṣọ̀kan náà ju ohun tí ẹsẹ̀ sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Ó sì ń wí” ṣetọju imperfect Gíríìkì, bí ó tilẹ̀ jẹ́ pé ó ní ìforúkọsílẹ̀ díẹ̀ ju “ó sì wí” lọ; “Ẹni náà” jẹ́ ìtẹnumọ́ tí ó mọ̀ọ́mọ̀ tẹ̀lé ἐκεῖνος.
