source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: yo
  text: Ẹ̀yin kò sì ní ọ̀rọ̀ rẹ̀ tí ń dúró nínú yín, nítorí ẹ̀yin kò gba ẹni tí ó rán gbọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: Ọ̀rọ̀
  rationale: Nínú àyíká yìí, λόγος ń tọ́ka sí ọ̀rọ̀ tàbí ìfihàn Ọlọ́run. “Ọ̀rọ̀” jẹ́ èdè Yorùbá tó ṣe déédé, ó sì pa ìró èdè Johanu mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: ἔχετε ... μένοντα
  choice: kò ... dúró nínú yín
  rationale: Ìkọ̀lé “ní ... tí ó ń dúró” máa le ní Yorùbá; “kò dúró nínú yín” sọ ìwàláàyè tí ń bá a lọ tí μένω ní, ó sì jẹ́ èdè àdánidá.
- source_word: ὅτι
  choice: nítorí
  rationale: ὅτι ń fi ìdí ọ̀rọ̀ àkọ́kọ́ hàn níbí; “nítorí” mú ìbáṣepọ̀ ìdí náà jáde kedere.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: ẹni tí ó rán
  rationale: Àrọ́pò-orúkọ ἐκεῖνος ń tọ́ka sí Baba, ṣùgbọ́n Yorùbá lè sọ ó ní “ó” láì lo gbólóhùn líle bí “ẹni náà.” “Ẹni tí ó rán” pa ìtumọ̀ ẹni tí a rán mọ́.
- source_word: τούτῳ ... πιστεύετε
  choice: ẹ̀yin kò gba ẹni ... nígbàgbọ́
  rationale: πιστεύω pẹ̀lú dátífù níbí túmọ̀ sí gbígba ẹni náà gbọ́ tàbí fífi ìgbàgbọ́ sí i. “Gba ... nígbàgbọ́” jẹ́ Yorùbá tó bójú mu, ó sì pa ìtẹnumọ́ lórí ẹni tí Baba rán mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ọ̀rọ̀ Ọlọ́run tó dúró nínú wọn àti àìgbàgbọ́ wọn sí ẹni tí Baba rán
  choice: Ẹsẹ náà sọ pé ọ̀rọ̀ Baba kò dúró nínú wọn, nítorí wọn kò gba ẹni tí ó rán nígbàgbọ́.
  alternative: A lè ka a gẹ́gẹ́ bí àìtọ́jú tàbí àìgbọ́ràn sí Ìwé Mímọ́ nínú ọkàn wọn, dípò gbólóhùn nípa àtúnbí tàbí gbígbé Ọlọ́run inú ènìyàn.
  rationale: Ìtumọ̀ náà pa ìbáṣepọ̀ ìdí tí ὅτι fi hàn mọ́, láì fi ẹ̀kọ́ ìjọ kan nípa àtúnbí, ìfaradà, tàbí ìmọ́lẹ̀ ẹ̀mí kún ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “dúró nínú yín” fún μένοντα láti pa agbára ìtẹ̀síwájú rẹ̀ mọ́ ní ọ̀nà àdánidá. Kò sí àlàyé ìsàlẹ̀ ojú-ewé, nítorí àṣàyàn míì kò pọndandan fún òye ẹsẹ náà.
