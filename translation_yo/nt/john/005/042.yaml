  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: yo
  text: 'Ṣùgbọ́n mo mọ̀ yín: ẹ kò ní ìfẹ́ Ọlọ́run nínú ara yín.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ṣíṣe kedere sí i, “ẹ kò ní ìfẹ́ sí Ọlọ́run nínú ara yín.” Gíríìkì náà tún lè túmọ̀ sí “ìfẹ́ tí ó ti ọ̀dọ̀ Ọlọ́run wá” tàbí “ìfẹ́ tí Ọlọ́run ní.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative ní Yorùbá.
- source_word: ἔγνωκα
  choice: mo mọ̀
  rationale: Perfect yìí ní agbára ipò ìmọ̀ tó ti fìdí múlẹ̀; ‘mo mọ̀’ ni ó sọ èyí ní Yorùbá àdánidá.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ gẹ́gẹ́ bí object ọ̀rọ̀-ìṣe ‘mọ̀.’
- source_word: ὅτι
  choice: ': ẹ kò ní'
  rationale: Àmì olójú méjì mú àkóónú ohun tí Jésù mọ̀ wọlé lọ́nà àdánidá, bí ὅτι ṣe ń ṣe nínú Gíríìkì.
- source_word: τὴν ἀγάπην
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ἀγάπη; Yorùbá kò nílò àfihàn article ọ̀tọ̀ níbí.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: 'Àkójọpọ̀ ‘ìfẹ́ Ọlọ́run’ pa àìdánilójú genitive Gíríìkì mọ́: ó lè túmọ̀ sí ìfẹ́ sí Ọlọ́run tàbí ìfẹ́ tó ti ọ̀dọ̀ Ọlọ́run wá/ti Ọlọ́run.'
- source_word: οὐκ ἔχετε
  choice: ẹ kò ní
  rationale: Ó sọ ipò òde-òní tí wọ́n kò ní ohun náà ní kedere.
- source_word: ἐν ἑαυτοῖς
  choice: nínú ara yín
  rationale: Ó pa ìtumọ̀ reflexive plural àti ìwà inú ẹni mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú ‘τὴν ἀγάπην τοῦ θεοῦ’
  choice: ìfẹ́ Ọlọ́run
  alternative: ìfẹ́ sí Ọlọ́run; ìfẹ́ tó ti ọ̀dọ̀ Ọlọ́run wá; ìfẹ́ Ọlọ́run fún ènìyàn
  rationale: Gíríìkì kò pinnu bóyá Ọlọ́run ni ẹni tí ìfẹ́ náà ń tọ̀ sí tàbí orísun/olóhun ìfẹ́ náà. Àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ‘ìfẹ́ sí Ọlọ́run,’ ṣùgbọ́n a pa àìdánilójú tòótọ́ náà mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ/yín’ láti fi ọ̀pọ̀ ẹni tí ὑμᾶς àti ἑαυτοῖς tọ́ka sí hàn.
