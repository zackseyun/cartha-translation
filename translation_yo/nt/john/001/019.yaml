id: JHN.1.19
reference: John 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: yo
  text: Èyí sì ni ẹ̀rí tí Jòhánù fi jẹ́rìí, nígbà tí àwọn Júù[a] rán àwọn àlùfáà àti àwọn ọmọ Léfì láti Jerúsálẹ́mù láti béèrè lọ́wọ́ rẹ̀ pé, “Ìwọ ta ni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn aṣáájú Júù” tàbí “àwọn ará Jùdíà.” Nínú ìwé Jòhánù, “àwọn Júù” sábà máa ń tọ́ka ní pàtàkì sí àwọn aláṣẹ ẹ̀sìn ní Jùdíà, kì í ṣe sí gbogbo àwọn Júù lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún jíjẹ́rìí tàbí ìfihàn òtítọ́, ó sì pa ìtumọ̀ ọ̀rọ̀ ẹjọ́ àti jíjẹ́rìí tó wọ́pọ̀ nínú Jòhánù mọ́.
- source_word: τοῦ Ἰωάννου
  choice: tí Jòhánù jẹ́
  rationale: Gbólóhùn yìí mú un ṣe kedere pé Jòhánù ni ó jẹ́ ẹ̀rí náà, kì í ṣe pé ẹ̀rí náà jẹ́ nípa Jòhánù.
- source_word: ὅτε
  choice: nígbà tí
  rationale: Ó fi àkókò tí ìjẹ́rìí náà ṣẹlẹ̀ hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἀπέστειλαν
  choice: rán
  rationale: “Rán” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá ìṣe fífi àwọn aṣojú lọ mu.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí tẹ̀ lé ìtumọ̀ tààrà ọ̀rọ̀ Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń ṣàlàyé pé ó lè tọ́ka pàápàá sí àwọn aláṣẹ ẹ̀sìn ní Jùdíà.
- source_word: ἐξ Ἱεροσολύμων
  choice: láti Jerúsálẹ́mù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti fi ibi tí wọ́n ti rán wọn hàn.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: àwọn àlùfáà àti àwọn ọmọ Léfì
  rationale: A pa àwọn ẹgbẹ́ méjèèjì tó ní iṣẹ́ pẹ̀lú tẹ́ńpìlì mọ́ lọ́tọ̀ gẹ́gẹ́ bí orísun ṣe sọ.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: láti béèrè lọ́wọ́ rẹ̀
  rationale: Ó sọ ète tí wọ́n fi rán wọn ní Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: Σὺ τίς εἶ;
  choice: Ìwọ ta ni?
  rationale: Fífi “Ìwọ” sí iwájú pa ìtẹnumọ́ arọ́pò-orúkọ Σὺ mọ́, gbólóhùn náà sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú ìwé Jòhánù
  choice: àwọn Júù
  alternative: àwọn aṣáájú Júù; àwọn ará Jùdíà
  rationale: A pa ọ̀rọ̀ orísun mọ́ nínú ẹsẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé dáàbò bo òǹkàwé lọ́wọ́ lílo rẹ̀ fún gbogbo àwọn Júù láìyàtọ̀. Nínú àyíká yìí, fífi àwọn àlùfáà àti ọmọ Léfì ránṣẹ́ láti Jerúsálẹ́mù fi hàn pé àwọn aláṣẹ ẹ̀sìn ni ó ṣeé ṣe kí ó wà ní àfojúsùn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn “ẹ̀rí tí Jòhánù jẹ́” yọ ìṣiyèméjì tó lè wá nínú “ẹ̀rí Jòhánù” kúrò, “Ìwọ ta ni?” sì pa ìtẹnumọ́ inú Gíríìkì mọ́.
