  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: yo
  text: Àǹdérù, arákùnrin Símónì Pétérù, jẹ́ ọ̀kan lára àwọn méjì tí wọ́n gbọ́ láti ọ̀dọ̀ Jòhánù, tí wọ́n sì tẹ̀ lé e.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arọ́pò-orúkọ ‘e’ ń tọ́ka sí Jésù, gẹ́gẹ́ bí àyíká ìtàn ṣe fi hàn.
    reason: pronoun_referent
lexical_decisions:
- source_word: ἦν
  choice: jẹ́
  rationale: Ọ̀rọ̀-ìṣe àìpé εἰμί jẹ́ àsopọ̀ ìdánimọ̀ níbí; ‘jẹ́’ ni ọ̀nà Yorùbá àdánidá láti sọ pé Àǹdérù jẹ́ ọ̀kan lára àwọn méjì náà.
- source_word: Ἀνδρέας
  choice: Àǹdérù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀ fún Andrew.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: arákùnrin Símónì Pétérù
  rationale: ἀδελφός túmọ̀ sí arákùnrin ìbí ní àyíká yìí; ìṣètò Yorùbá yìí pa ìbátan náà mọ́ ní ọ̀nà àdánidá.
- source_word: εἷς ἐκ τῶν δύο
  choice: ọ̀kan lára àwọn méjì
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá tí ó pa ìtumọ̀ apá kan nínú méjì mọ́.
- source_word: τῶν ἀκουσάντων
  choice: tí wọ́n gbọ́ ọ̀rọ̀
  rationale: ‘Gbọ́ ọ̀rọ̀’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún gbígbọ́ ohun tí Jòhánù sọ; kò fi àkóónú míì kún un.
- source_word: παρὰ Ἰωάννου
  choice: lọ́dọ̀ Jòhánù
  rationale: παρά pẹ̀lú ẹ̀yà genitive ń tọ́ka sí orísun; ‘lọ́dọ̀ Jòhánù’ sọ èyí ní Yorùbá láì fi ‘Onítẹ̀bọmi’ kún ọ̀rọ̀ orísun.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: tí wọ́n sì tẹ̀ lé e
  rationale: ‘Tẹ̀ lé’ bá ἀκολουθέω mu, ‘e’ sì pa arọ́pò-orúkọ αὐτῷ mọ́ láì tún ẹni tí ó ń tọ́ka sí lórúkọ.
theological_decisions:
- issue: Ẹni tí αὐτῷ (‘e’) ń tọ́ka sí
  choice: A pa arọ́pò-orúkọ ‘e’ mọ́; nínú àyíká ìtàn, ó ń tọ́ka sí Jésù.
  alternative: Kí a sọ ‘tẹ̀ lé Jésù’ ní tààrà, tàbí kí a ka a sí Jòhánù.
  rationale: Jòhánù 1:35–39 fi hàn pé àwọn méjèèjì gbọ́ ọ̀rọ̀ Jòhánù, wọ́n sì tẹ̀ lé Jésù. Síbẹ̀, lílo ‘e’ pa irú gbólóhùn Gíríìkì mọ́, kò sì fi ìtumọ̀ àlàyé sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá àgbàṣe, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàgò fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
