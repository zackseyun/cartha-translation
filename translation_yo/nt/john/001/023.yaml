id: JHN.1.23
reference: John 1:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: yo
  text: Ó ní[a], “Èmi ni ohùn ẹni tí ń ké jáde ní aginjù pé, ‘Ẹ ṣe ọ̀nà Olúwa ní títọ́,’ gẹ́gẹ́ bí wòlíì Aísáyà ti sọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè pín gbólóhùn Gíríìkì náà, bí ó tilẹ̀ jẹ́ pé kíkà yìí kò rọrùn tó, pé: “Èmi ni ohùn ní aginjù, ti ẹni tí ń ké jáde.” Ṣùgbọ́n ọ̀rọ̀ inú ẹsẹ náà tẹ̀ lé kíkà tó jẹ́ àdánidá jù lọ níbí.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Ó ní
  rationale: Ọ̀nà àdánidá àti ṣókí ni èyí láti fi ọ̀rọ̀ ẹni bẹ̀rẹ̀ nínú ìjíròrò Yorùbá.
- source_word: Ἐγὼ
  choice: Èmi ni
  rationale: Fọ́ọ̀mù alágbára ‘Èmi’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ‘ni’ sì bá ìdánimọ̀ mu ní Yorùbá.
- source_word: φωνὴ
  choice: ohùn
  rationale: ‘Ohùn’ pa àwòrán pé Jòhánù jẹ́ ohùn kan mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: βοῶντος
  choice: ẹni tí ń ké jáde
  rationale: Ó fi agbára àti gbangba ìkéde ọ̀rọ̀ Gíríìkì hàn ju ọ̀rọ̀ pẹ̀lẹ́ bí ‘ń pè’ lọ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́ fún ibi ahoro, ó sì bá àyíká àsọtẹ́lẹ̀ náà mu.
- source_word: Εὐθύνατε
  choice: Ẹ mú ... tọ́
  rationale: Àṣẹ yìí sọ kí wọ́n ṣe ọ̀nà náà ní títọ́, ó sì pa àwòrán ọ̀nà inú Gíríìkì mọ́.
- source_word: τὴν ὁδὸν
  choice: ọ̀nà
  rationale: ‘Ọ̀nà’ jẹ́ yíyan àdánidá tó lè tọ́ka sí ọ̀nà gidi àti ìtumọ̀ àpẹẹrẹ rẹ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìwọ̀n ọlá àti ìtumọ̀ ẹ̀kọ́ nípa Ọlọ́run nínú àyọlò Aísáyà mọ́.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu pẹ̀lú ohun tí Aísáyà sọ hàn ní Yorùbá àdánidá.
- source_word: εἶπεν
  choice: ti sọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti tọ́ka sí ọ̀rọ̀ tí wòlíì ti sọ tẹ́lẹ̀.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: wòlíì Aísáyà
  rationale: Ètò yìí jẹ́ àdánidá jù lọ ní Yorùbá, ó sì pa ipò Aísáyà gẹ́gẹ́ bí wòlíì mọ́.
theological_decisions:
- issue: Ìtumọ̀ κυρίου nínú àyọlò Aísáyà
  choice: Olúwa
  alternative: ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ ọlá àti ìfarahàn orúkọ Ọlọ́run nínú àyọlò Aísáyà mọ́; ‘ọ̀gá’ yóò sọ agbára ẹ̀kọ́ náà di aláìlágbára.
- issue: Ohun tí gbólóhùn ‘ní aginjù’ ń ṣàlàyé
  choice: ẹni tí ń ké jáde ní aginjù
  alternative: ohùn kan ní aginjù, ti ẹni tí ń ké jáde
  rationale: Èyí ni kíkà tó rọrùn jù lọ nínú Gíríìkì àti Yorùbá, ó sì bá iṣẹ́ Jòhánù ní aginjù mu, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa àìdájú gírámà náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ọlọ́lá, ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a pa àwòrán àsọtẹ́lẹ̀ nípa ohùn, aginjù àti ọ̀nà mọ́.
