id: JHN.1.33
reference: John 1:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: yo
  text: Èmi náà kò mọ̀ ọ́n[a], ṣùgbọ́n ẹni tí ó rán mi láti ṣe ìrìbọmi nínú omi[b] sọ fún mi pé, “Ẹni tí o bá rí Ẹ̀mí ń sọ̀kalẹ̀ sórí rẹ̀, tí ó sì ń dúró lórí rẹ̀[c], òun ni ẹni tí ń ṣe ìrìbọmi nínú Ẹ̀mí Mímọ́[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “Èmi náà kò dá a mọ̀.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àìmọ̀ ẹni tàbí àìdá ẹni náà mọ̀ nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé, “pẹ̀lú omi” àti “pẹ̀lú Ẹ̀mí Mímọ́.” Ọ̀rọ̀ Gíríìkì kan náà (ἐν, “nínú”) ni a lò nínú gbolohun méjèèjì; ọ̀rọ̀ pàtàkì pa ìfararora náà mọ́.
    reason: lexical_alternative
  - marker: c
    text: “Ń dúró” túmọ̀ ọ̀rọ̀ pàtàkì kan nínú Ìhìn Rere Johanu, èyí tí a tún lè túmọ̀ sí “ń wà” tàbí “ń bá a gbé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: Èmi náà kò mọ̀ ọ́n
  rationale: “Èmi náà” fi ìtẹnumọ́ àti ìsopọ̀ καί + ἐγώ hàn; “kò mọ̀ ọ́n” jẹ́ ìtumọ̀ tààrà fún àìmọ̀, ṣùgbọ́n ó ṣì gba ìtumọ̀ àìdá ẹni mọ̀ láàyè.
- source_word: ὁ πέμψας με
  choice: ẹni tí ó rán mi
  rationale: Ó ṣe àfihàn participle tí a lò gẹ́gẹ́ bí orúkọ ní èdè Yorùbá àdánidá, láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò wọ́pọ̀.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: láti máa ṣe ìrìbọmi nínú omi
  rationale: “Láti máa ṣe” fi iṣẹ́ tí a rán Johanu sí hàn; “nínú omi” pa ἐν mọ́, ó sì bá gbolohun tó tẹ̀ lé e nípa Ẹ̀mí Mímọ́ dọ́gba.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Ẹni tí ìwọ bá rí
  rationale: Ìṣètò yìí fi àmì ìdánimọ̀ tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí hàn ní Yorùbá tó ṣe déédéé.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: Ẹ̀mí náà ń sọ̀kalẹ̀ sórí rẹ̀, tí ó sì ń dúró lórí rẹ̀
  rationale: “Ń sọ̀kalẹ̀” àti “ń dúró” mú ìṣe àwọn participle méjèèjì jáde; “dúró” jẹ́ ọ̀rọ̀ ìgbàlódé tó tún pa kókó μένω mọ́.
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: òun ni ẹni tí ń ṣe ìrìbọmi
  rationale: “Òun ni” mú agbára ìdánimọ̀ demonstrative náà jáde, “ẹni tí ń ṣe” sì fi substantival participle hàn lọ́nà àdánidá.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: Ó pa preposition ἐν àti ìfararora rẹ̀ pẹ̀lú “nínú omi” mọ́; àwọn àmì ohùn àti lẹ́tà ńlá ṣe ìdánimọ̀ Ẹ̀mí Ọlọ́run ní kedere.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα / πνεύματι ἁγίῳ
  choice: Ẹ̀mí náà … Ẹ̀mí Mímọ́
  alternative: ẹ̀mí náà … ẹ̀mí mímọ́
  rationale: Àyíká ẹsẹ̀ náà àti gbolohun ìkẹyìn fi hàn pé Ẹ̀mí Ọlọ́run ni a ń tọ́ka sí; lẹ́tà ńlá kò fi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
- issue: Preposition ἐν nínú àwọn gbolohun ìrìbọmi méjèèjì
  choice: nínú omi … nínú Ẹ̀mí Mímọ́
  alternative: pẹ̀lú omi … pẹ̀lú Ẹ̀mí Mímọ́
  rationale: Lílo “nínú” ní ibi méjèèjì pa ìfararora èdè Gíríìkì mọ́, kò sì pinnu ọ̀nà ìṣe ìrìbọmi ju ohun tí ẹsẹ̀ náà sọ lọ.
- issue: Bóyá οὐκ ᾔδειν túmọ̀ sí àìmọ̀ tàbí àìdá ẹni mọ̀
  choice: kò mọ̀ ọ́n
  alternative: kò dá a mọ̀
  rationale: Ìtumọ̀ àkọ́kọ́ ni a fi sínú ọ̀rọ̀ pàtàkì, a sì fi èkejì sínú àlàyé láti pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ìgbàlódé, ó sì yẹ fún kíkà ní gbangba. A yan “ṣe ìrìbọmi” dípò ọ̀rọ̀ àyálò tí kò ṣe dandan, a sì pa ìtẹnumọ́, ìfararora, àti àìdánilójú èdè Gíríìkì mọ́.
