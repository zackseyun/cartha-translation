  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní gbogbogbòò: ìṣe ìsinsìnyí nínú μαρτυρεῖ, perfect nínú κέκραγεν, àti ìdí nínú ὅτι wà ní kedere. Ṣùgbọ́n “ti wá sí iwájú mi” lè ní ìtumọ̀ ìṣísẹ̀ ní ààyè gidi (‘came in front of me’) tí kò yẹ fún ἔμπροσθέν μου γέγονεν ní àyíká yìí. “Ti di ẹni tí ó ṣáájú mi” dara pọ̀ mọ́ γέγονεν, ó sì pa ìtumọ̀ ìṣáájú/ìpò gíga tí ó ṣì ní ìmòye méjì mọ́. “Ó ti wà ṣáájú mi” tún yí imperfect ἦν padà sí perfect; “ó wà ṣáájú mi” sún mọ́ ọ̀rọ̀ ìpilẹ̀.'
