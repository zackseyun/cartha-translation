  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: yo
  text: Jòhánù ń jẹ́rìí nípa rẹ̀, ó sì ti ké jáde pé, “Èyí ni ẹni náà tí mo sọ nípa rẹ̀ pé, ‘Ẹni tí ń bọ̀ lẹ́yìn mi ti di ẹni tí ó ṣáájú mi[a], nítorí ó wà ṣáájú mi[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti gba ipò ṣáájú mi” tàbí “ti ga ju mi lọ.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìṣáájú ní ipò tàbí ní ọlá, kì í ṣe ìtẹ̀lé ní àkókò nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó wà láàyè ṣáájú mi.” “Ó wà ṣáájú mi” sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì jẹ́ kí àyíká ọ̀rọ̀ tọ́ka sí ìwàláàyè rẹ̀ ṣáájú Jòhánù.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: ń jẹ́rìí
  rationale: Fọ́ọ̀mù ìsinsìnyí ‘ń jẹ́rìí’ pa ìṣe tí ó ń lọ lọ́wọ́ tàbí ẹ̀rí tí a gbé kalẹ̀ ní kedere mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀.
- source_word: περὶ αὐτοῦ
  choice: nípa rẹ̀
  rationale: Èyí ni ọ̀nà àdánidá láti sọ περί pẹ̀lú ẹ̀yà-orúkọ ní Yorùbá.
- source_word: κέκραγεν
  choice: ó sì ti ké jáde
  rationale: '‘Ti ké jáde’ fi ìtumọ̀ perfect hàn: ìké náà ti ṣẹlẹ̀, ṣùgbọ́n ẹ̀rí rẹ̀ ṣì dúró; ‘ké jáde’ tún pa agbára ọ̀rọ̀ náà mọ́.'
- source_word: λέγων
  choice: pé
  rationale: Ní Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti so ọ̀rọ̀ tí a ké mọ́ ohun tí a sọ, láìfi àkópọ̀ Gíríìkì le èdè Yorùbá lórí.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Èyí ni ẹni náà tí mo sọ nípa rẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtọ́ka sí ẹni kan náà tí Jòhánù ti sọ̀rọ̀ rẹ̀ tẹ́lẹ̀ mọ́. Kòpúlà ‘ni’ kò fi àsìkò hàn bí ti Gíríìkì, ṣùgbọ́n ‘tí mo sọ’ mú ìtọ́ka sí ohun àtijọ́ ṣe kedere.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Ẹni tí ń bọ̀ lẹ́yìn mi
  rationale: Ó pa àbùdá participle náà mọ́ pẹ̀lú ‘ń bọ̀,’ ‘lẹ́yìn mi’ sì lè tọ́ka sí bí ó ṣe wá lẹ́yìn Jòhánù nínú àkókò tàbí iṣẹ́ ìránṣẹ́.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: ti wá sí iwájú mi
  rationale: ‘Ti wá sí iwájú mi’ jẹ́ Yorùbá tí ó ṣeé lóye, ó pa perfect àti àwòrán ipò iwájú mọ́, kò sì dá ìtumọ̀ náà mọ́ sí ipò ọlá nìkan tàbí tẹ̀lé-tẹ̀lé àkókò nìkan.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí fún gbólóhùn tí ó ṣáájú rẹ̀ ní kedere.
- source_word: πρῶτός μου ἦν
  choice: ó ti wà ṣáájú mi
  rationale: Ó pa ọ̀rọ̀ àkọ́kọ́ mọ́ láìfikún ọ̀rọ̀ ìtumọ̀ bí ‘ó ti wà láàyè’ tàbí ‘ó ti bẹ̀rẹ̀ sí í wà.’ Ó tún jẹ́ kí àyíká ọ̀rọ̀ fi ìwàláàyè Kristi ṣáájú Jòhánù hàn.
theological_decisions:
- issue: Bó ṣe yẹ kí gbólóhùn ìkẹyìn sọ ìwàláàyè Kristi ṣáájú Jòhánù ní tààrà tó
  choice: ó ti wà ṣáájú mi
  alternative: ó ti wà láàyè ṣáájú mi
  rationale: Gbólóhùn náà tọ́ka gidigidi sí ìwàláàyè Kristi ṣáájú Jòhánù, ṣùgbọ́n ‘ó ti wà ṣáájú mi’ sún mọ́ Gíríìkì jù, ó sì jẹ́ kí àyíká Ìhìn Rere Jòhánù ṣàlàyé agbára ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ láìfi àlàyé sínú ìtumọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘ń jẹ́rìí,’ ‘ké jáde,’ àti ‘wá sí iwájú’ nítorí wọ́n ṣeé lóye fún òǹkàwé navẹ́lì, láìsọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan di dandan ju ohun tí Gíríìkì sọ lọ.
