  to: “Èyí ni ẹni tí mo sọ nípa rẹ̀ pé, ‘Lẹ́yìn mi ni ọkùnrin kan ń bọ̀, ẹni tí ó ti ṣáájú mi[a], nítorí ó wà ṣáájú mi[b].’”
