id: JHN.1.30
reference: John 1:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: yo
  text: “Èyí ni ẹni tí mo sọ nípa rẹ̀ pé, ‘Lẹ́yìn mi ni ọkùnrin kan ń bọ̀, ẹni tí ó ti ṣáájú mi[a], nítorí ó wà ṣáájú mi[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ti ga ju mi lọ ní ipò.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìṣáájú tàbí sí ipò tí ó ga ju ti ẹlòmíràn lọ, kì í ṣe ìtẹ̀lé àkókò nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ti wà láàyè ṣáájú mi.” Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí wíwà Jésù ṣáájú, bí ó tilẹ̀ jẹ́ pé Gíríìkì sọ ọ́ ní kúkúrú gẹ́gẹ́ bí “ó wà ṣáájú mi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Èyí ni ẹni
  rationale: Ó pa ìtẹnumọ́ àti ìdánimọ̀ olùtọ́kasí Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: tí mo sọ nípa rẹ̀ pé
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, ὑπέρ túmọ̀ sí ‘nípa’ tàbí ‘ní ti’; gbólóhùn yìí sì ṣe kedere ní Yorùbá.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Lẹ́yìn mi ... ń bọ̀
  rationale: Ó fi ìtẹ̀lé ní àkókò tàbí ní ipò hàn, ó sì pa ìṣètò ìfiwéra Jòhánù mọ́.
- source_word: ἀνὴρ
  choice: ọkùnrin kan
  rationale: Ọ̀rọ̀ náà tọ́ka sí ọkùnrin kan pàtó, kì í ṣe sí ènìyàn láìsọ akọ tàbí abo.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: ó ti wà ní ipò iwájú mi
  rationale: Ọ̀rọ̀ yìí sọ ipò iwájú tí ó ti ṣẹlẹ̀ tí ó sì ń bá a lọ; ‘ní ipò iwájú mi’ lè ní ìtumọ̀ jíjẹ́ ṣáájú tàbí jíjẹ́ ẹni gíga jù lọ láìfi tipátipá yan ọ̀kan.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí gbólóhùn tó ṣáájú fi rí bẹ́ẹ̀ hàn.
- source_word: πρῶτός μου ἦν
  choice: ó ti wà ṣáájú mi
  rationale: Ó pa ọ̀rọ̀ Gíríìkì náà mọ́ ní kúkúrú, pẹ̀lú ààyè fún ìṣáájú ní àkókò àti ìṣáájú ní ipò.
theological_decisions:
- issue: Bí a ṣe máa sọ gbólóhùn ìkẹyìn nípa wíwà Kristi ṣáájú Jòhánù
  choice: ó ti wà ṣáájú mi
  alternative: ó ti wà láàyè ṣáájú mi
  rationale: Àyíká ìwé Jòhánù ń tọ́ka líle sí wíwà Jésù ṣáájú, ṣùgbọ́n Gíríìkì sọ ọ́ ní ọ̀nà kúkúrú tí ó tún lè ní agbára ìtumọ̀ ipò. Ìtumọ̀ tí a yàn kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìṣètò “Lẹ́yìn mi ni...” mú ìtẹnumọ́ ìfiwéra inú ẹsẹ náà jáde fún òǹkàwé òde òní.
