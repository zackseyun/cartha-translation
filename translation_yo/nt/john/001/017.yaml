id: JHN.1.17
reference: John 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: yo
  text: Nítorí pé nípasẹ̀ Mósè ni a fi òfin fúnni; oore-ọ̀fẹ́ àti òtítọ́ sì wá nípasẹ̀ Jésù Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí a ṣe máa ń pè é ní ìbílẹ̀, “Jésù Kristi.”
    reason: Ó pèsè ọ̀nà ìbílẹ̀ tí a fi ń kọ oyè Χριστός sí Yorùbá.
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí pé
  rationale: Ó ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ tó ṣáájú, bí ὅτι ṣe rí nínú àyíká yìí.
- source_word: ὁ νόμος
  choice: òfin
  rationale: Ó tọ́ka sí òfin tí Ọlọ́run fi fún àwọn ènìyàn nípasẹ̀ Mósè; ‘òfin’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi àṣà ìkọ̀wé kékeré tàbí ńlá kún ìtumọ̀ rẹ̀.
- source_word: διὰ Μωϋσέως
  choice: nípasẹ̀ Mósè
  rationale: ‘Nípasẹ̀’ pa ìtumọ̀ Mósè gẹ́gẹ́ bí alárinà mọ́, ó sì bá gbólóhùn tó jọ ọ́ nípa Jésù mu.
- source_word: ἐδόθη
  choice: ni a fi ... fúnni
  rationale: Ìṣẹ̀dá aláìdárúkọ olùṣe yìí pa ohùn àìṣe Gíríìkì mọ́, láìfi orúkọ ẹni tó fúnni kún ẹsẹ náà.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ yìí sọ χάρις gẹ́gẹ́ bí oore tí a fi fúnni lọ́fẹ̀ẹ́, ó sì jẹ́ èdè ẹ̀sìn Yorùbá tó wọ́pọ̀ tí àwọn òǹkàwé òde òní lóye.
- source_word: ἡ ἀλήθεια
  choice: òtítọ́
  rationale: Ó pa ìtumọ̀ òtítọ́ àti ohun tó jẹ́ gidi nínú lílo ọ̀rọ̀ náà nínú Jòhánù mọ́.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jésù Mèsáyà
  rationale: ‘Nípasẹ̀’ tún fi iṣẹ́ alárinà hàn; ‘Mèsáyà’ tú Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró dípò kí a kàn kọ ọ́ bí orúkọ.
- source_word: ἐγένετο
  choice: wá
  rationale: ‘Wá’ jẹ́ ọ̀nà àdánidá láti sọ pé oore-ọ̀fẹ́ àti òtítọ́ farahàn tàbí dé nípasẹ̀ Jésù, láìsọ pé wọ́n ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ sí í wà.
theological_decisions:
- issue: Bí a ṣe tú Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: ‘Mèsáyà’ mú ìtumọ̀ oyè náà—ẹni àmì òróró—jáde ní kedere. Àṣàyàn ìbílẹ̀ ‘Kristi’ wà nínú àlàyé ìsàlẹ̀.
- issue: Ìyàtọ̀ láàárín òfin àti oore-ọ̀fẹ́ pẹ̀lú òtítọ́
  choice: Lo ‘sì’ láti fi ìfiwéra hàn
  alternative: Lo ‘ṣùgbọ́n’ láti fi àtakò hàn
  rationale: Gíríìkì kò lo ọ̀rọ̀ àtakò tó túmọ̀ sí ‘ṣùgbọ́n’; ‘sì’ pa ìfiwéra àti ìdàkejì gbólóhùn mọ́ láìṣe àtakò náà lágbára ju orísun lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìfarajọ́ àwọn gbólóhùn méjèèjì mọ́ pẹ̀lú ‘nípasẹ̀’.
