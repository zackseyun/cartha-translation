  to: Nátánáẹ́lì sì wí fún un pé, “Ǹjẹ́ ohun rere kan lè wá láti Násárẹ́tì bí?”[a] Fílípì sì wí fún un pé, “Wá wò ó.”
  rationale: A rọ́pò àwọn ọ̀rọ̀ tí ń ṣàlàyé ìṣe àwọn olùsọ̀rọ̀ ju bó ṣe wà nínú Gíríìkì lọ pẹ̀lú ‘wí fún un,’ láti pa εἶπεν/λέγει αὐτῷ mọ́. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ kí ó lè ṣàfihàn εἶναι (‘jẹ́/wà’) ní Yorùbá tó rọrùn. Ìbéèrè ìfẹ̀hónúhàn náà, ìṣọ̀kan ìtàn, àti ìpè ‘Wá wò ó’ kò yí ìtumọ̀ padà.
