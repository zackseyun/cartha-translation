source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: yo
  text: Nátánáẹ́lì sì wí fún un pé, “Ǹjẹ́ ohun rere kan lè wá láti Násárẹ́tì bí?”[a] Fílípì sì wí fún un pé, “Wá wò ó.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà gangan jù lọ, “Ǹjẹ́ ohun rere kan lè wà láti Násárẹ́tì bí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: Nátánáẹ́lì sì bi í pé
  rationale: ‘Sì’ pa ìṣàn ìtàn oníṣọ̀kan mọ́; nítorí ohun tó tẹ̀ lé jẹ́ ìbéèrè, ‘bi í pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti túmọ̀ εἶπεν αὐτῷ ní àyíká yìí.
- source_word: Ἐκ Ναζαρὲτ
  choice: láti Násárẹ́tì
  rationale: ἐκ tọ́ka sí orísun tàbí ibi tí ohun ti wá; ‘láti’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì bá ọ̀rọ̀ ibi mu.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: Ǹjẹ́ ohun rere kan lè wá ... bí?
  rationale: ‘lè’ fi ìṣeéṣe tí δύναται ní hàn, ‘ohun rere kan’ sì dúró fún τι ἀγαθόν. ‘wá’ jẹ́ àdánidá ní Yorùbá pẹ̀lú ‘láti’ nígbà tí a ń sọ nípa orísun, bí ó tilẹ̀ jẹ́ pé εἶναι túmọ̀ ní pàtó sí ‘jẹ́/wà’.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Fílípì dá a lóhùn pé
  rationale: Bí Gíríìkì ṣe lo ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nínú ìtàn ni a mú wá sí ọ̀nà ìtàn Yorùbá àdánidá; ‘dá a lóhùn’ bá ìdáhùn Fílípì sí ìbéèrè náà mu láìfi ìtumọ̀ àfikún pàtàkì sí i.
- source_word: Ἔρχου καὶ ἴδε
  choice: Wá wò ó
  rationale: Àwọn ọ̀rọ̀ àṣẹ méjèèjì ni a pa mọ́. ‘Wá wò ó’ jẹ́ ìpè Yorùbá àdánidá, ó sì pa èrò rírí tàbí fífi ojú ara ẹni ṣàyẹ̀wò mọ́.
theological_decisions:
- issue: Ìró ohùn ìbéèrè Nátánáẹ́lì nípa Násárẹ́tì
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìbéèrè tó fi iyèméjì hàn, láìfi ọ̀rọ̀ ẹ̀gàn tàbí ìkórìíra kún un.
  alternative: A lè fi ìró ẹ̀gàn tó lágbára sí i.
  rationale: Ọ̀rọ̀ Gíríìkì fi iyèméjì hàn, ṣùgbọ́n kò sọ ìró ẹ̀gàn ní kedere; ìtumọ̀ náà kò gbọ́dọ̀ pinnu ohun tí orísun fi sílẹ̀ ní àìdánilójú.
- issue: Ìtumọ̀ εἶναι pẹ̀lú ἐκ Ναζαρὲτ
  choice: A lo ‘wá láti Násárẹ́tì’ nínú ẹsẹ̀, a sì tọ́ka sí ìtumọ̀ gangan jù lọ nínú àlàyé ìsàlẹ̀.
  alternative: ‘jẹ́/wà láti Násárẹ́tì’
  rationale: ‘Wá láti’ jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá fún orísun; àlàyé ìsàlẹ̀ pa àìṣedéédé kékeré tó wà láàárín ‘wá’ àti εἶναι (‘jẹ́/wà’) mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá àti orúkọ ẹni/ibi ní ọ̀nà tó bá ìpè Yorùbá mu; a yàgò fún èdè ìjọ kan pàtó.
