  source_fidelity: Ìbéèrè Nátánáẹ́lì àti ìpè Fílípì jẹ́ olóòtítọ́ sí Gíríìkì ní pàtàkì. Síbẹ̀, ‘bi í pé’ yí εἶπεν (‘wí/sọ’) padà sí ‘béèrè,’ àti ‘dá a lóhùn’ jẹ́ ìṣàlàyé ìbáṣepọ̀ tí λέγει αὐτῷ kò sọ ní tààrà. Àtúnṣe náà pa ìṣe ìtàn àti olùgbà ọ̀rọ̀ mọ́ láìfi ìtumọ̀ kún un.
  naturalness: ‘Nátánáẹ́lì sì wí fún un pé’ àti ‘Fílípì sì wí fún un pé’ jẹ́ Yorùbá boṣewa, ó sì sún mọ́ ọ̀nà ìtàn orísun. ‘Wá wò ó’ jẹ́ ìpè kúkúrú, àdánidá, tí ó yẹ fún ‘Ἔρχου καὶ ἴδε.’
  terminology: Àwọn orúkọ náà—Nátánáẹ́lì, Násárẹ́tì, àti Fílípì—wà ní ìkọ̀wé Yorùbá tó wọ́pọ̀. ‘Ohun rere kan’ àti ‘lè wá láti’ pa ìṣeéṣe àti orísun tí δύναται, ἐκ, àti εἶναι ń sọ mọ́, láìfi ìfẹ̀sùn ẹ̀gàn tí ó pọ̀ ju sí ìbéèrè náà.
