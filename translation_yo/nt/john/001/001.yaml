id: JHN.1.1
reference: John 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: yo
  text: Ní ìbẹ̀rẹ̀ ni Ọ̀rọ̀ náà[a] wà, Ọ̀rọ̀ náà sì wà pẹ̀lú Ọlọ́run[b], Ọ̀rọ̀ náà sì jẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: A tún lè sọ pé, “Ọ̀rọ̀ náà ní ìwà Ọlọ́run,” tàbí, “Ohun tí Ọlọ́run jẹ́ ni Ọ̀rọ̀ náà jẹ́.” Ètò ọ̀rọ̀ Gíríìkì fi ìwà Ọlọ́run ti Ọ̀rọ̀ náà hàn, nígbà tó ṣì ń fi Ọ̀rọ̀ náà yà sọ́tọ̀ kúrò lọ́dọ̀ “Ọlọ́run” nínú gbólóhùn tó ṣáájú.
    reason: alternative_reading
  - marker: b
    text: Gbólóhùn ìbẹ̀rẹ̀ yìí ń rán wa létí Gẹnẹsisi 1:1, ó sì so Ọ̀rọ̀ náà pọ̀ mọ́ ìbẹ̀rẹ̀ ìṣẹ̀dá.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Ní ìbẹ̀rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ àdánidá ní Yorùbá, ó sì pa ìṣàròyé sí Gẹnẹsisi 1:1 mọ́.
- source_word: ἦν
  choice: wà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé Ọ̀rọ̀ náà ti wà nígbà tí ‘ìbẹ̀rẹ̀’ dé; ‘wà’ tún jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún àkókò ọ̀rọ̀ Gíríìkì náà.
- source_word: ὁ λόγος
  choice: Ọ̀rọ̀ náà
  rationale: ‘Ọ̀rọ̀’ pa ìtumọ̀ ọ̀rọ̀ tí a sọ, ìfihàn, àti orúkọ ẹni tí Jòhánù ń tọ́ka sí mọ́. ‘Náà’ fi hàn pé ó jẹ́ ẹni pàtó tí àyíká ọ̀rọ̀ náà ń sọ̀rọ̀ nípa rẹ̀.
- source_word: πρὸς τὸν θεόν
  choice: wà pẹ̀lú Ọlọ́run
  rationale: ‘Pẹ̀lú’ sọ ìbáṣepọ̀ àti wíwà papọ̀ ní Yorùbá àdánidá, láìsọ pé Ọ̀rọ̀ náà àti Ọlọ́run jẹ́ ẹni kan náà.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Ó jẹ́ orúkọ Yorùbá tí ó ṣe déédéé fún Ọlọ́run kan ṣoṣo tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Ọ̀rọ̀ náà sì jẹ́ Ọlọ́run
  rationale: Ìtumọ̀ yìí jẹ́ kedere, ó sì fi ìwà tàbí ẹ̀dá Ọlọ́run tí Ọ̀rọ̀ náà ní hàn. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ànímọ́ ọ̀rọ̀ Gíríìkì náà àti ìyàtọ̀ ẹni nínú gbólóhùn tó ṣáájú mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ θεός tí kò ní áríkúlù nínú gbólóhùn ìkẹyìn
  choice: Ọ̀rọ̀ náà sì jẹ́ Ọlọ́run
  alternative: Ọ̀rọ̀ náà ní ìwà Ọlọ́run; tàbí, Ohun tí Ọlọ́run jẹ́ ni Ọ̀rọ̀ náà jẹ́
  rationale: Ìtumọ̀ pàtàkì náà jẹ́rìí sí ẹ̀dá Ọlọ́run tí Ọ̀rọ̀ náà ní, ṣùgbọ́n ọ̀rọ̀ tó ṣáájú ṣì yà Ọ̀rọ̀ náà sọ́tọ̀ kúrò lọ́dọ̀ ẹni tí ó wà pẹ̀lú rẹ̀. Àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí ìtumọ̀ ànímọ́ inú èdè Gíríìkì náà hàn láìdín agbára ọ̀rọ̀ náà kù.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì tún ‘Ọ̀rọ̀ náà’ ṣe láti pa ìlù àti ìtẹnumọ́ ẹsẹ Gíríìkì náà mọ́.
