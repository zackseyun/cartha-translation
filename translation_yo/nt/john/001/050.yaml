  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: yo
  text: Jésù dá a lóhùn, ó sì wí fún un pé, “Nítorí pé mo sọ fún ọ pé mo rí ọ lábẹ́ igi ọ̀pọ̀tọ́ ni o ṣe gbàgbọ́?[a] Iwọ yóò rí àwọn ohun tí ó tóbi jù àwọn wọ̀nyí lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé nítorí pé mo sọ fún ọ pé mo rí ọ lábẹ́ igi ọ̀pọ̀tọ́ ni o ṣe gbàgbọ́?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jésù dá a lóhùn, ó sì wí fún un pé
  rationale: Ó pa àgbékalẹ̀ ìtàn Gíríìkì ‘dáhùn, ó sì wí’ mọ́ ní Yorùbá ọ̀wọ̀, bí ó tilẹ̀ jẹ́ pé àwọn ọ̀rọ̀ méjèèjì jọ ní ìtumọ̀ díẹ̀.
- source_word: Ὅτι ... πιστεύεις;
  choice: Nítorí ... ni ìwọ ṣe gbàgbọ́ bí?
  rationale: Àgbékalẹ̀ ‘nítorí ... ni ... ṣe ... bí?’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìbéèrè ìdí hàn, láìsọ ọ́ di ìbáwí tó lágbára ju ohun tí Gíríìkì sọ lọ.
- source_word: ὅτι εἶδόν σε
  choice: pé mo rí ọ
  rationale: ὅτι kejì ń ṣàfihàn àkóónú ohun tí Jésù sọ; aorist εἶδον sì jẹ́ ‘mo rí’ ní ọ̀nà tó rọrùn àti àdánidá.
- source_word: ὑποκάτω τῆς συκῆς
  choice: lábẹ́ igi ọ̀pọ̀tọ́
  rationale: Ó pa àwòrán ibi náà mọ́; ‘igi ọ̀pọ̀tọ́’ ni orúkọ Yorùbá tí ó wọ́pọ̀ fún igi fig.
- source_word: πιστεύεις
  choice: ìwọ ṣe gbàgbọ́
  rationale: ‘Gbàgbọ́’ bá lílo Johannine mu, ‘ìwọ’ sì fi ìtẹnumọ́ ẹni kejì hàn ní àgbékalẹ̀ ìbéèrè náà.
- source_word: μείζω τούτων
  choice: àwọn ohun tí ó tóbi ju ìwọ̀nyí lọ
  rationale: μείζω jẹ́ ọ̀pọ̀ àìlábùkù tí a lò gẹ́gẹ́ bí orúkọ; ‘àwọn ohun ...’ fi ọ̀pọ̀ àti ìfiwéra náà hàn kedere.
- source_word: ὄψῃ
  choice: Ìwọ yóò rí
  rationale: Ó túmọ̀ ọjọ́ iwájú náà ní Yorùbá òde òní, pẹ̀lú ‘ìwọ’ fún ìtẹnumọ́ ìlérí sí ẹni náà.
theological_decisions:
- issue: Agbára ìbéèrè πιστεύεις;
  choice: 'Ìbéèrè ọ̀rọ̀-àròsọ gidi: ‘ni ìwọ ṣe gbàgbọ́ bí?’'
  alternative: 'Gbólóhùn ìjẹ́rìí, tàbí ìbáwí pẹ̀lẹ́ tó túbọ̀ lágbára: ‘Ìwọ gbàgbọ́ nítorí pé...’'
  rationale: Ìsọ̀rọ̀ àti àtòjọ ọ̀rọ̀ Gíríìkì fara mọ́ ìbéèrè. Ìtumọ̀ náà kò pinnu bóyá ìbéèrè yìí jẹ́ ìyìn tàbí ìbáwí, ó sì jẹ́ kí ìlérí ìṣípayá tó tóbi jù lọ tẹ̀ lé e lọ́nà àdánidá.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, òde òní, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘wí’ nínú àgbékalẹ̀ ìtàn ọ̀wọ̀, àti ‘igi ọ̀pọ̀tọ́’ fún fig tree.
