  to: Jésù dá a lóhùn, ó sì wí fún un pé, “Nítorí pé mo sọ fún ọ pé mo rí ọ lábẹ́ igi ọ̀pọ̀tọ́ ni o ṣe gbàgbọ́?[a] Iwọ yóò rí àwọn ohun tí ó tóbi jù àwọn wọ̀nyí lọ.”
