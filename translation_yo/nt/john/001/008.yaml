  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: yo
  text: Òun kò jẹ́ ìmọ́lẹ̀ náà, ṣùgbọ́n ó wá láti jẹ́rìí nípa ìmọ́lẹ̀ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ Giriki gan-an: “Òun kò jẹ́ ìmọ́lẹ̀ náà, bí kò ṣe kí ó lè jẹ́rìí nípa ìmọ́lẹ̀ náà.” Giriki kò sọ ọ̀rọ̀-ìṣe inú gbólóhùn kejì ní gbangba; àyíká ọ̀rọ̀ ló ń mú un yé wa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν ἐκεῖνος
  choice: Òun kì í ṣe
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “Òun” fi ìtẹnumọ́ ἐκεῖνος hàn ní Yorùbá àdánidá, “kì í ṣe” sì sọ ìkọ̀ tí οὐκ ἦν ní ní ọ̀nà tó bá àyíká ọ̀rọ̀ àpèjúwe ẹni mu.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀ náà
  rationale: “Náà” pa ìdámọ̀ pàtó tí àpilẹ̀kọ Giriki náà fi hàn mọ́, ó sì tọ́ka sí ìmọ́lẹ̀ tí ọ̀rọ̀ ìṣáájú ti sọ.
- source_word: ἀλλ’ ἵνα
  choice: ṣùgbọ́n ó wá láti
  rationale: Giriki fi ọ̀rọ̀-ìṣe kan sílẹ̀ láì sọ ọ́ ní gbangba lẹ́yìn ἀλλά; “ó wá láti” mú ète iṣẹ́ Jòhánù jáde ní Yorùbá tó ṣe kedere, gẹ́gẹ́ bí àyíká ẹsẹ ṣáájú.
- source_word: μαρτυρήσῃ
  choice: jẹ́rìí
  rationale: “Jẹ́rìí” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ó sì pa ìtumọ̀ ẹ̀rí tàbí ìjẹ́rìí ti μαρτυρέω mọ́.
- source_word: περὶ τοῦ φωτός
  choice: nípa ìmọ́lẹ̀ náà
  rationale: “Nípa” jẹ́ ìtumọ̀ Yorùbá àdánidá fún περί pẹ̀lú ẹ̀yà genitive, láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìdámọ̀ àti ipa Jòhánù ní ìbáṣepọ̀ pẹ̀lú ìmọ́lẹ̀
  choice: Ẹsẹ náà sẹ́ pé Jòhánù fúnra rẹ̀ ni ìmọ́lẹ̀, ó sì sọ pé ète wíwá rẹ̀ ni láti jẹ́rìí nípa ìmọ́lẹ̀ náà.
  alternative: A lè túmọ̀ ọ́ ní ọ̀nà tó sún mọ́ ìrísí Giriki pé, “Òun kì í ṣe ìmọ́lẹ̀ náà, bí kò ṣe kí ó lè jẹ́rìí nípa ìmọ́lẹ̀ náà.”
  rationale: Ìtumọ̀ náà pa ìyàtọ̀ tó wà láàárín ẹni tó jẹ́rìí àti ìmọ́lẹ̀ mọ́, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un. “Ó wá” jẹ́ ìmúpọ̀ ọ̀rọ̀-ìṣe tí àyíká tọ́ka sí, kì í ṣe ìfikún ẹ̀kọ́ tuntun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò; a lo “jẹ́rìí” dípò gbólóhùn tó le tàbí tó jẹ́ ti ẹ̀sìn kan pàtó.
