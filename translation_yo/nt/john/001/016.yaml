  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: yo
  text: Nítorí láti inú ẹ̀kúnrẹ́rẹ́ rẹ̀ ni gbogbo wa ti gba, àti oore-ọ̀fẹ́ dípò oore-ọ̀fẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “oore-ọ̀fẹ́ lórí oore-ọ̀fẹ́,” tàbí “oore-ọ̀fẹ́ kan tẹ̀ lé òmíràn.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí oore-ọ̀fẹ́ tí ń tẹ̀ léra bí ẹ̀bùn kan ṣe ń tẹ̀ lé òmíràn, bí ó tilẹ̀ jẹ́ pé ἀντί túmọ̀ sí “dípò” ní pàtàkì.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń fi ìdí tàbí àlàyé ohun tí a sọ ṣáájú hàn, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: láti inú ẹ̀kúnrẹ́rẹ́ rẹ̀
  rationale: “Ẹ̀kúnrẹ́rẹ́” ń tọ́ka sí gbogbo ohun tó kún inú rẹ̀; “láti inú” sì pa èrò orísun tí ἐκ ní mọ́.
- source_word: ἡμεῖς πάντες
  choice: gbogbo wa
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ pẹ̀lú πάντες mọ́ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐλάβομεν
  choice: ni ... ti rí gbà
  rationale: Ìṣètò “ni ... ti” mú ìtẹnumọ́ gbólóhùn náà jáde, “rí gbà” sì sọ ìgbàgbọ́ ohun tí a ti gba tí a sì ní di òní ní ọ̀nà àdánidá.
- source_word: καὶ
  choice: àti
  rationale: Ó so gbólóhùn kejì mọ́ ti àkọ́kọ́ láì fi ìtumọ̀ mìíràn kún un.
- source_word: χάριν ἀντὶ χάριτος
  choice: oore-ọ̀fẹ́ dípò oore-ọ̀fẹ́
  rationale: “Dípò” pa agbára ìtumọ̀ ìpìlẹ̀ ἀντί, ìyẹn ‘ní ipò’ tàbí ‘dípò,’ mọ́, láì yanjú àìdánilójú pé ó lè tún tọ́ka sí oore-ọ̀fẹ́ tí ń tẹ̀ lé òmíràn.
theological_decisions:
- issue: Ìtumọ̀ χάριν ἀντὶ χάριτος
  choice: oore-ọ̀fẹ́ dípò oore-ọ̀fẹ́
  alternative: oore-ọ̀fẹ́ lórí oore-ọ̀fẹ́; oore-ọ̀fẹ́ kan tẹ̀ lé òmíràn
  rationale: Gbólóhùn Gíríìkì náà ní àríyànjiyàn ìtumọ̀. Ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ gígún ἀντί mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ ìtẹ̀lé tàbí àkójọpọ̀ hàn, kí a má bàa yanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí orísun kò yanjú.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye. “Oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀; “ẹ̀kúnrẹ́rẹ́” jẹ́ ọ̀nà àdánidá láti sọ πλήρωμα. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
