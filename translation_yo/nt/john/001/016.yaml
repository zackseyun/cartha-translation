  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “Nítorí” ń ṣiṣẹ́ gẹ́gẹ́ bí ìsopọ̀ àlàyé, “láti inú ẹ̀kúnrẹ́rẹ́ rẹ̀” ń fi ἐκ hàn, “gbogbo wa” ń pa ìtẹnumọ́ ἡμεῖς πάντες mọ́, “dípò” sì dá agbára ìpìlẹ̀ ἀντί sílẹ̀ láì fipá yan ìtumọ̀ kan nínú àwọn ìtumọ̀ tí a ń jiyàn lé lórí. Síbẹ̀, “ti rí gbà” kún ìṣe “gba” ní ọ̀nà tí kò yẹ fún ἐλάβομεν, ó sì lè yí ìtumọ̀ sí “ṣàṣeyọrí gbígba” dípò ìṣe gbígba lásán.'
