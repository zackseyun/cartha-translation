id: JHN.1.51
reference: John 1:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Lóòótọ́, lóòótọ́ ni mo sọ fún yín[a], ẹ ó rí ọ̀run tí a ti ṣí silẹ̀, àti àwọn áńgẹ́lì Ọlọ́run tí ń gòkè lọ, tí ń sọ̀kalẹ̀ sórí Ọmọ Ènìyàn.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yín” àti “ẹ” jẹ́ ọ̀pọ̀ ènìyàn ní èdè Gíríìkì; nítorí náà, ọ̀rọ̀ Jésù gbòòrò ju Nátánáẹ́lì nìkan lọ.
    reason: lexical_alternative
  - marker: b
    text: Àwòrán yìí rántí àlá Jékọ́bù ní Jẹ́nẹ́sísì 28:12; níhìn-ín, àwòrán náà sì dojúkọ Ọmọ Ènìyàn.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ àgbólóhùn Gíríìkì tí a tún sọ lẹ́ẹ̀mejì mọ́, ó sì jẹ́ Yorùbá àdánidá tí òǹkàwé òde òní lè lóye.
- source_word: ὑμῖν
  choice: fún yín
  rationale: “Yín” fi hàn ní kedere pé ọ̀pọ̀ ènìyàn ni ọ̀rọ̀ náà ń tọ́ka sí, bó tilẹ̀ jẹ́ pé Nátánáẹ́lì nìkan ni Jésù kọ́kọ́ ń bá sọ̀rọ̀.
- source_word: ὄψεσθε
  choice: ẹ ó rí
  rationale: Ó tú ìṣe ọjọ́ iwájú náà sí Yorùbá tí ó ṣe kedere, ó sì pa nọ́ńbà ọ̀pọ̀ ẹni mọ́.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: ọ̀run tí ó ṣí sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi ipò ọ̀run tí a ti ṣí hàn láìfi àlàyé míì kún un.
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Nínú ìran yìí, àwọn ìránṣẹ́ ọ̀run ti Ọlọ́run ni ọ̀rọ̀ náà túmọ̀ sí, kì í ṣe àwọn ońṣẹ́ ènìyàn lásán.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: tí ń gòkè lọ, tí wọn sì ń sọ̀kalẹ̀
  rationale: Ó pa ìṣípò méjèèjì àti ìfarahàn rẹ̀ pẹ̀lú Jẹ́nẹ́sísì 28:12 mọ́ ní èdè Yorùbá àdánidá.
- source_word: ἐπὶ
  choice: sórí
  rationale: Ó pa àwòrán ìṣípò àwọn áńgẹ́lì ní ìbáṣepọ̀ pẹ̀lú Ọmọ Ènìyàn mọ́, láìyanjú àìdánilójú àwòrán náà pẹ̀lú àlàyé.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè Jésù tí ó ti fìdí múlẹ̀ nínú èdè Bíbélì Yorùbá, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ Ìwé Mímọ́ míì mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ náà yí láti ẹni kan ṣoṣo nínú “fún un” (αὐτῷ) sí ọ̀pọ̀ ènìyàn nínú “fún yín” àti “ẹ ó rí” (ὑμῖν, ὄψεσθε).
  choice: A fi ọ̀pọ̀ ènìyàn hàn ní kedere nínú àyọkà pàtàkì, a sì ṣàlàyé ìyípadà náà nínú àlàyé ìsàlẹ̀.
  alternative: Kí a lo ọ̀rọ̀ arọ́pò-orúkọ tí kò fi nọ́ńbà hàn, kí àlàyé ìsàlẹ̀ nìkan sì sọ pé ọ̀pọ̀ ni.
  rationale: Yorùbá lè fi ìyàtọ̀ ẹni kan àti ọ̀pọ̀ ènìyàn hàn lọ́nà àdánidá; ṣíṣe bẹ́ẹ̀ pa ìtumọ̀ Gíríìkì mọ́, ó sì fi hàn pé ọ̀rọ̀ náà gbòòrò ju Nátánáẹ́lì nìkan lọ.
- issue: Àwòrán àwọn áńgẹ́lì tí ń gòkè lọ tí wọ́n sì ń sọ̀kalẹ̀ sórí Ọmọ Ènìyàn rántí àlá Jékọ́bù ní Jẹ́nẹ́sísì 28:12.
  choice: A pa àwòrán náà mọ́ nínú àyọkà láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un; àlàyé ìsàlẹ̀ nìkan ni ó tọ́ka sí ìbáṣepọ̀ náà.
  alternative: Kí a túmọ̀ ọ̀rọ̀ náà ní àlàyé gígùn tí yóò sọ pé Jésù ni ibi ìpàdé ọ̀run àti ayé.
  rationale: Gíríìkì fúnra rẹ̀ lo àwòrán náà láìṣàlàyé gbogbo ìtumọ̀ rẹ̀; ìtumọ̀ yẹ kí ó pa àìdánilójú àti agbára àwòrán náà mọ́.
translation_notes:
  register: A lo Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; “Ọmọ Ènìyàn” àti “áńgẹ́lì” pa àwọn ọ̀rọ̀ Bíbélì tí a mọ̀ mọ́, ṣùgbọ́n ìṣètò gbólóhùn náà jẹ́ àdánidá ní Yorùbá.
