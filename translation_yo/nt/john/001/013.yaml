id: JHN.1.13
reference: John 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: yo
  text: Àwọn tí a kò bí láti inú ẹ̀jẹ̀[a], tàbí láti inú ìfẹ́-inú ara, tàbí láti inú ìfẹ́-inú ọkùnrin, bí kò ṣe láti ọ̀dọ̀ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “àwọn ẹ̀jẹ̀.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀, ó sì ṣeé ṣe kó ń tọ́ka sí ìran àbínibí tàbí àwọn òbí ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: àwọn tí
  rationale: Ó so àwọn ẹni tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa wọn mọ́ gbólóhùn yìí, ó sì pa ìtumọ̀ ọ̀pọ̀ mọ́.
- source_word: ἐξ αἱμάτων
  choice: láti inú ẹ̀jẹ̀[a]
  rationale: Ní Yorùbá, “ẹ̀jẹ̀” sábà máa ń jẹ́ ọ̀rọ̀ tí a kì í kà, nítorí náà fífi sí ẹyọ ń dun bí èdè àdánidá; àlàyé ìsàlẹ̀ ojú-ewé pa ọ̀pọ̀ tó ṣàrà ọ̀tọ̀ nínú Gíríìkì àti ìtumọ̀ ìran ènìyàn mọ́.
- source_word: θελήματος
  choice: ìfẹ́-inú
  rationale: “Ìfẹ́-inú” túmọ̀ sí ohun tí ẹni fẹ́ tàbí pinnu, ó sì yẹ fún àtúnwí ọ̀rọ̀ náà ní ibòmíràn méjèèjì.
- source_word: σαρκὸς
  choice: ara
  rationale: “Ara” jẹ́ ọ̀nà àdánidá láti túmọ̀ σάρξ ní àyíká ìbímọ̀ ènìyàn, láìfi èrò “ẹ̀dá ẹlẹ́ṣẹ̀” kún un.
- source_word: ἀνδρὸς
  choice: ọkùnrin
  rationale: Ó pa ìtọ́kasí sí akọ ènìyàn mọ́ ní àyíká ìbímọ̀, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
- source_word: ἐκ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún orísun ẹni tàbí ohun kan, ó sì mú ìyàtọ̀ pẹ̀lú àwọn orísun ènìyàn tó ṣáájú hàn.
- source_word: ἐγεννήθησαν
  choice: a bí
  rationale: Ìṣe aláìṣe “a bí” jẹ́ àdánidá ní Yorùbá, ó sì bá aorist passive mu láìlo ọ̀rọ̀ àtijọ́ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ìpilẹ̀ṣẹ̀ ènìyàn àti ìpilẹ̀ṣẹ̀ láti ọ̀dọ̀ Ọlọ́run
  choice: Ẹsẹ náà kọ́ ìran àbínibí àti ìfẹ́-inú ènìyàn sílẹ̀ gẹ́gẹ́ bí orísun ìbí yìí, ó sì fi Ọlọ́run hàn gẹ́gẹ́ bí orísun rẹ̀.
  alternative: A lè ka ọ̀rọ̀ náà ní pàtó sí ìran ẹ̀yà nìkan, tàbí kí àwọn àṣà ẹ̀kọ́ ìgbàgbọ́ tó wá lẹ́yìn túmọ̀ rẹ̀ lọ́nà sakiramenti tàbí ti ìwàláàyè.
  rationale: Ìkọ̀ mẹ́ta tó wà nínú Gíríìkì yà ìbí yìí sọ́tọ̀ kúrò nínú ìran àti ìfẹ́-inú ènìyàn. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́ láìpinnu ọ̀nà ẹ̀kọ́ ìgbàgbọ́ ẹgbẹ́ kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye. A lo “ìfẹ́-inú” dípò “ìfẹ́” nìkan kí a má bàa mú un dà bí ìfẹ́ni; a sì lo “ẹ̀jẹ̀” gẹ́gẹ́ bí ọ̀rọ̀ tí a kì í kà, pẹ̀lú àlàyé fún ọ̀pọ̀ Gíríìkì tó ṣàrà ọ̀tọ̀.
