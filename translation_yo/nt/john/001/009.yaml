id: JHN.1.9
reference: John 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: yo
  text: Ìmọ́lẹ̀ tòótọ́[a], tí ń tan ìmọ́lẹ̀ sí olúkúlùkù ènìyàn, ń bọ̀ wá sínú ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ìmọ́lẹ̀ tòótọ́, tí ń tan ìmọ́lẹ̀ sí olúkúlùkù ènìyàn tí ó ń wá sínú ayé.” Nínú èdè Gíríìkì, ọ̀rọ̀ náà tí a túmọ̀ sí “ń bọ̀” lè ṣàpèjúwe “olúkúlùkù ènìyàn” dípò “ìmọ́lẹ̀ tòótọ́.”'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: Ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ‘light’; a kò fi lẹ́tà ńlá bẹ̀rẹ̀ rẹ̀, bí ó tilẹ̀ jẹ́ pé ó ń tọ́ka sí Kristi nínú àyíká ọ̀rọ̀ náà.
- source_word: ἀληθινόν
  choice: tòótọ́
  rationale: Ó fi ohun tí ó jẹ́ ojúlówó, gidi, tí ó sì pé hàn, kì í ṣe pé ohun náà kàn bá òtítọ́ mu nìkan.
- source_word: φωτίζει
  choice: ń tan ìmọ́lẹ̀ sí
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa àwòrán ìmọ́lẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, pẹ̀lú agbára ìtumọ̀ rẹ̀ nínú àyíká yìí.
- source_word: πάντα ἄνθρωπον
  choice: olúkúlùkù ènìyàn
  rationale: Ó túmọ̀ sí gbogbo ènìyàn lọ́kọ̀ọ̀kan láìfi ọkùnrin tàbí obìnrin kan sílẹ̀, ó sì bá Yorùbá òde òní mu.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: ń bọ̀ wá sínú ayé
  rationale: Ọ̀rọ̀ àkọ́kọ́ so èyí mọ́ ‘ìmọ́lẹ̀ tòótọ́,’ ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ Jòhánù; àfikún ìtumọ̀ gírámà mìíràn wà ní àlàyé ìsàlẹ̀.
- source_word: κόσμον
  choice: ayé
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédé fún κόσμος nínú àyíká Jòhánù yìí.
- source_word: ἦν
  choice: ń
  rationale: 'A so imperfect ἦν pọ̀ mọ́ participle náà gẹ́gẹ́ bí ìṣe tí ń lọ lọ́wọ́: ‘ń bọ̀ wá.’'
theological_decisions:
- issue: Ohun tí ἐρχόμενον (‘tí ń bọ̀’) ń ṣàpèjúwe
  choice: 'A so ó mọ́ ‘ìmọ́lẹ̀ tòótọ́’: ‘Ìmọ́lẹ̀ tòótọ́ ... ń bọ̀ wá sínú ayé.’'
  alternative: 'A lè so ó mọ́ ‘olúkúlùkù ènìyàn’: ‘... tí ń tan ìmọ́lẹ̀ sí olúkúlùkù ènìyàn tí ó ń wá sínú ayé.’'
  rationale: Nínú gírámà Gíríìkì, participle náà lè ṣàpèjúwe ἄνθρωπον, ṣùgbọ́n àyíká ìwé Jòhánù àti ìtẹnumọ́ ọ̀rọ̀ ìṣáájú lórí wíwá Ìmọ́lẹ̀ sínú ayé ṣe àtìlẹ́yìn fún kí a so ó mọ́ Ìmọ́lẹ̀. A pa àìdánilójú gidi náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘bọ̀ wá’ láti fi ìṣípò sí ibi tí àyíká ọ̀rọ̀ náà ń wò hàn, a sì pa àwòrán ‘ìmọ́lẹ̀’ mọ́ nínú ọ̀rọ̀-ìṣe náà.
