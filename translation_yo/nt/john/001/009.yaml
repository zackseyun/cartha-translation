  source_fidelity: 'Ìtumọ̀ náà fi τὸ φῶς τὸ ἀληθινόν hàn dáadáa gẹ́gẹ́ bí “Ìmọ́lẹ̀ tòótọ́,” ó sì túmọ̀ φωτίζει πάντα ἄνθρωπον ní ìtumọ̀ tí ó bójú mu: “tí ń tan ìmọ́lẹ̀ sí olúkúlùkù ènìyàn.” “Ń bọ̀ wá sínú ayé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti ṣàfihàn kíkà tí ó so ἐρχόμενον εἰς τὸν κόσμον mọ́ Ìmọ́lẹ̀ náà. Àìdánilójú gírámà tí ó lè so participle náà mọ́ ènìyàn ni a pa mọ́ nínú àlàyé ìsàlẹ̀.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti ka. “Tan ìmọ́lẹ̀ sí” dáa nínú àwòrán ọ̀rọ̀ náà, “olúkúlùkù ènìyàn” sì jẹ́ ìtumọ̀ aláìfi ẹnikẹ́ni sílẹ̀ tí ó wúlò fún πάντα ἄνθρωπον. Àmì ohùn àti ìkọ̀wé jẹ́ déédé.
  terminology: “Ìmọ́lẹ̀,” “tòótọ́,” àti “ayé” jẹ́ àwọn ọ̀rọ̀ tó bójú mu nínú ọ̀rọ̀ Jòhánù. A kò sọ ìtumọ̀ Kristẹni tàbí ẹ̀kọ́ ìjọ kan di dandan nínú ìtúmọ̀; a fi ìbáṣepọ̀ Kristi sí Ìmọ́lẹ̀ sílẹ̀ fún àyíká ìwé náà.
