  terminology: “Ọ̀rọ̀,” “ẹran ara,” “ògo,” “Baba,” “oore-ọ̀fẹ́,” and “òtítọ́” are suitable biblical Yoruba terms. The alternative “Ọmọ bíbí kan ṣoṣo” is retained as a traditional-style rendering for “only begotten,” while the main text appropriately uses “Ọmọ kan ṣoṣo.”
