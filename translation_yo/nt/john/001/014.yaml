id: JHN.1.14
reference: John 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: yo
  text: Ọ̀rọ̀ náà sì di ẹran ara, ó sì gbé láàárín wa[a]. Àwa sì rí ògo rẹ̀, ògo bí ti Ọmọ kan ṣoṣo láti ọ̀dọ̀ Baba[b]; ó kún fún oore-ọ̀fẹ́ àti òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó pa àgọ́ rẹ̀ sí láàárín wa”; ọ̀rọ̀ ìṣe náà ń mú àwòrán àgọ́, pàápàá àgọ́ ìjọsìn, wá sí ọkàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ọmọ bíbí kan ṣoṣo”; ọ̀nà mìíràn ni, “Ọmọ aláìlẹ́gbẹ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: Ọ̀rọ̀ náà
  rationale: “Ọ̀rọ̀” jẹ́ akọ́lé tí ó bójú mu fún Logos nínú ọ̀rọ̀ ìṣáájú Jòhánù; ó pa ìtumọ̀ ọlọ́rọ̀ àti ìtọ́kasí rẹ̀ sí ẹni kan mọ́ ju “ìránṣẹ́” tàbí “ìrònú” lọ.
- source_word: σὰρξ
  choice: ẹran ara
  rationale: Ọ̀rọ̀ yìí pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé Ọ̀rọ̀ náà wọ ìwà ènìyàn gidi tí ó ní ara, kì í ṣe pé ó kàn fara hàn bí ènìyàn.
- source_word: ἐγένετο
  choice: di
  rationale: “Di” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyípadà ipò tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: gbé láàárín wa
  rationale: Èyí ṣe kedere ní Yorùbá òde òní, ó sì túmọ̀ sí pé ó ṣe ibùgbé pẹ̀lú wa; àwòrán àgọ́ tàbí àgọ́ ìjọsìn wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐθεασάμεθα
  choice: Àwa sì rí
  rationale: Ó sọ ẹ̀rí ojú taara ní èdè Yorùbá tí ó rọrùn; fífi “Àwa” síwájú tún tẹnumọ́ àwọn ẹlẹ́rìí náà.
- source_word: δόξαν
  choice: ògo
  rationale: “Ògo” ni ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìwọ̀n ìtumọ̀ ẹ̀sìn àti ọlá ọ̀run mọ́.
- source_word: μονογενοῦς
  choice: Ọmọ kan ṣoṣo
  rationale: Èyí sọ ìyàtọ̀ àti àìlẹ́gbẹ́ rẹ̀ ní kedere. “Ọmọ” kò sí ní tààràtà nínú gbólóhùn Gíríìkì yìí, ṣùgbọ́n àyíká Jòhánù 1 àti ìtọ́kasí sí Baba mú un yẹ gẹ́gẹ́ bí àfikún tí ó ṣe kedere ní Yorùbá.
- source_word: παρὰ πατρός
  choice: láti ọ̀dọ̀ Baba
  rationale: Ó sọ orísun àti ìbáṣepọ̀ náà ní Yorùbá àdánidá, nígbà tí “Baba” ń tọ́ka sí Ọlọ́run Baba nínú àyíká yìí.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: ó kún fún oore-ọ̀fẹ́ àti òtítọ́
  rationale: Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa àpapọ̀ èrò “grace and truth” mọ́ láì dín un sí ìtumọ̀ kékeré.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ μονογενοῦς ní àyíká tí ó ń sọ nípa Kristi
  choice: Ọmọ kan ṣoṣo
  alternative: Ọmọ bíbí kan ṣoṣo; Ọmọ aláìlẹ́gbẹ́
  rationale: “Ọmọ kan ṣoṣo” jẹ́ kíkà àìlẹ́gbẹ́ rẹ̀ tí ó ṣe kedere, láì fi ọ̀rọ̀ “bíbí” sí Gíríìkì bí ẹni pé ó jẹ́ apá dandan nínú ìtumọ̀ rẹ̀. Àṣàyàn ìtàn ìjọ náà wà nínú àlàyé ìsàlẹ̀.
- issue: Bóyá kí a fi àwòrán àgọ́ ìjọsìn hàn gbangba nínú ἐσκήνωσεν
  choice: gbé láàárín wa
  alternative: pàgọ́ sí láàárín wa; ṣe ibùgbé rẹ̀ láàárín wa
  rationale: Ọ̀rọ̀ inú ẹsẹ̀ dúró ní kedere, ó sì jẹ́ Yorùbá àdánidá; àlàyé ìsàlẹ̀ pa ìró ìtumọ̀ àgọ́ àti àgọ́ ìjọsìn mọ́ láì sọ àlàyé náà di ìtumọ̀ pàtó kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa àwọn ọ̀rọ̀ Bíbélì tí a mọ̀ dáadáa bí “Ọ̀rọ̀,” “ògo,” “oore-ọ̀fẹ́,” àti “òtítọ́” mọ́.
