  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: yo
  text: Ìmọ́lẹ̀ náà sì ń tàn nínú òkùnkùn, òkùnkùn náà kò sì borí rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òkùnkùn náà kò lóye rẹ̀,” tàbí, “òkùnkùn náà kò mú un.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìborí, mímú, tàbí lílóye.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: Ìmọ́lẹ̀ náà
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí ìmọ́lẹ̀ pàtó tí àyíká ọ̀rọ̀ ìṣáájú ti dá sílẹ̀; “náà” mú ìtọ́kasí yìí hàn ní Yorùbá àdánidá.
- source_word: σκοτίᾳ / σκοτία
  choice: òkùnkùn / òkùnkùn náà
  rationale: “Òkùnkùn” ni ìtumọ̀ àdánidá; ní ìfarahàn kejì, “náà” mú kí ìtakora oníṣàpẹẹrẹ rẹ̀ pẹ̀lú ìmọ́lẹ̀ hàn kedere láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: φαίνει
  choice: ń tàn
  rationale: Àmì “ń” fi iṣẹ́ tí ń lọ lọ́wọ́ hàn, ó sì bá ìṣe àsìkò ìsinsìnyí nínú Gíríìkì mu ní Yorùbá àdánidá.
- source_word: κατέλαβεν
  choice: kò borí
  rationale: Nínú àwòrán ìjà láàárín ìmọ́lẹ̀ àti òkùnkùn, “borí” mú ìtumọ̀ pé òkùnkùn kò ṣẹ́gun ìmọ́lẹ̀ jáde. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí mímú tàbí òye; a pa ìṣiyèméjì yẹn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: αὐτὸ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí “ìmọ́lẹ̀”; “rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí òkùnkùn kò borí.
theological_decisions:
- issue: Ìtumọ̀ κατέλαβεν nínú ìtakora ìmọ́lẹ̀ àti òkùnkùn
  choice: kò borí rẹ̀
  alternative: kò lóye rẹ̀ tàbí kò sì mú un
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ ọgbọ́n-orí pé “lóye” tàbí ìtumọ̀ ìkọlù pé “mú/borí.” Àwòrán ìmọ́lẹ̀ àti òkùnkùn ṣètìlẹ́yìn fún “borí” nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́, kí a má bàa yanjú ìṣiyèméjì ojúlówó náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “ń tàn” fún ìṣe tí ń bá a lọ, a sì lo “náà” láti fi ìtọ́kasí pàtó àti àkòrí ìtakora inú ọ̀rọ̀ náà hàn.
