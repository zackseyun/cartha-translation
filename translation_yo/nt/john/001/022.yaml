  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: yo
  text: Nítorí náà, wọ́n sọ fún un pé, “Ta ni ìwọ, kí a lè dá àwọn tí wọ́n rán wa lóhùn? Kí ni ìwọ sọ nípa ara rẹ̀?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú tí ó jẹ́ àbájáde ìjíròrò tó ṣáájú hàn, ó sì bá ọ̀rọ̀ Yorùbá oníyì mu.
- source_word: εἶπαν ... αὐτῷ
  choice: wọ́n bi í pé
  rationale: Bí ó tilẹ̀ jẹ́ pé λέγω túmọ̀ sí ‘sọ,’ nínú àyíká ìbéèrè tààrà yìí, ‘bi í pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ tí wọ́n sọ sí i wọlé.
- source_word: Τίς εἶ;
  choice: Ta ni ìwọ?
  rationale: Ó pa ìbéèrè kúkúrú nípa ẹni tí ó jẹ́ mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: ἵνα
  choice: Kí a lè
  rationale: Ó ṣàfihàn ète gẹ́gẹ́ bí ἵνα ṣe rí nínú Gíríìkì, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀπόκρισιν δῶμεν
  choice: dá ... lóhùn
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí ni ọ̀nà àdánidá láti sọ pé kí a fi ìdáhùn fún ẹnì kan.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: àwọn tí ó rán wa
  rationale: Ó tú articular participle náà sí ọ̀rọ̀ ìbátan Yorùbá tó ṣe kedere, láìsọ ẹni tí àwọn olùrán náà jẹ́.
- source_word: τί λέγεις
  choice: Kí ni ìwọ sọ
  rationale: Ó pa ìtumọ̀ λέγω mọ́, ó sì béèrè fún ẹ̀rí tí ẹni náà fúnra rẹ̀ sọ nípa ara rẹ̀.
- source_word: περὶ σεαυτοῦ
  choice: nípa ara rẹ
  rationale: Ó mú ìtumọ̀ ìtọ́kasí περί pẹ̀lú arọ́pò-orúkọ afara-ẹni hàn ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ó ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo ‘bi í pé’ fún ìfihàn ọ̀rọ̀ ìbéèrè tààrà, àti ‘dá ... lóhùn’ dípò àtúmọ̀ líle ti ‘fi ìdáhùn fún.’
