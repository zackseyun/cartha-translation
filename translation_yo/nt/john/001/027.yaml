source:
  edition: SBLGNT
  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: yo
  text: ẹni tí ń bọ̀ lẹ́yìn mi, tí mi ò yẹ láti tú okùn bàtà rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ẹni tí ń bọ̀ lẹ́yìn mi, tí mi ò yẹ kí n tú okùn bàtà rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: ẹni tí ń bọ̀ lẹ́yìn mi
  rationale: Ọ̀rọ̀ alábápín pẹ̀lú àpilẹ̀kọ náà ń tọ́ka sí ẹni pàtó kan. ‘Ẹni tí ń bọ̀ lẹ́yìn mi’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ bíbọ̀ lẹ́yìn ní ìtẹ̀lé mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: οὗ
  choice: ẹni tí ... rẹ̀
  rationale: Ètò ‘ẹni tí ... rẹ̀’ fi ìbáṣepọ̀ oníhun hàn ní Yorùbá àdánidá, níbi tí ‘rẹ̀’ ti tọ́ka sí ẹni náà.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: èmi kò yẹ
  rationale: ‘Kò yẹ’ sọ àìní yíyẹ tàbí ẹ̀tọ́ di mímọ́, ó sì pa ìrẹ̀lẹ̀ Johanu mọ́ láìṣe àfikún ìtumọ̀.
- source_word: ἵνα λύσω
  choice: láti tú
  rationale: Lẹ́yìn gbólóhùn tó sọ nípa yíyẹ, ‘láti tú’ jẹ́ ọ̀nà Yorùbá tó rọrùn fún ìṣe tí a ń rò, ó sì bá ìtumọ̀ λύω nípa yíyan okùn bàtà mu.
- source_word: ἱμάντα
  choice: okùn
  rationale: Ní ọ̀rọ̀ bàtà, ‘okùn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a fi dè tàbí so bàtà.
- source_word: τοῦ ὑποδήματος
  choice: bàtà
  rationale: ‘Bàtà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a wọ̀ lẹ́sẹ̀; àyíká àti ‘okùn’ mú irú bàtà ìgbàanì náà ṣe kedere láìlo ọ̀rọ̀ àjèjì.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘lẹ́yìn mi’ pẹ̀lú ẹni tí ń bọ̀
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìtẹ̀lé ní àkókò tàbí iṣẹ́: ‘ẹni tí ń bọ̀ lẹ́yìn mi.’'
  alternative: ẹni tí ń bọ̀ ní ẹ̀yìn mi
  rationale: Nínú àyíká Johanu, ọ̀rọ̀ náà tọ́ka sí ẹni tó tẹ̀ lé e ní ìfarahàn iṣẹ́. Ìtumọ̀ yìí kò fi ọ̀rọ̀ tó wà ní àwọn ẹsẹ tó yí i ká wọ inú gbólóhùn náà, ó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A yan ‘ń bọ̀’ láti pa agbára ọ̀rọ̀ alábápín ìsinsìnyí mọ́, ‘okùn bàtà’ sì jẹ́ àsọyé àdánidá fún ìjánu tàbí okùn bàtà.
