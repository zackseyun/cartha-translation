revisions:
- from: Nígbà náà ni Jésù yíjú padà, ó sì rí i pé wọ́n ń tọ̀ ọ́ lẹ́yìn. Ó bi wọ́n pé, “Kí ni ẹ̀ ń wá?” Wọ́n dá a lóhùn pé, “Rábì” (èyí túmọ̀ sí Olùkọ́)[a], “níbo ni o ń gbé?”[b]
  to: Nígbà náà, Jésù yíjú padà, ó sì rí wọn tí wọ́n ń tọ̀ ọ́ lẹ́yìn. Ó béèrè lọ́wọ́ wọn pé, “Kí ni ẹ̀ ń wá?” Wọ́n dá a lóhùn pé, “Rábì” (èyí túmọ̀ sí “Olùkọ́”), “níbo ni o ń gbé?”
  rationale: A tún ìbẹ̀rẹ̀ ẹsẹ̀ náà ṣe kí ohun tí Jésù rí—àwọn tí ń tẹ̀lé e—hàn kedere gẹ́gẹ́ bí ìtumọ̀ θεασάμενος αὐτούς. A tún lo ọ̀nà ìbéèrè tó wọ́pọ̀ síi nínú Yorùbá. Àwọn ìpinnu ìtumọ̀ pàtàkì fún ζητεῖτε, Ῥαββί, àti μένεις, pẹ̀lú àwọn àlàyé ìsàlẹ̀ ojú-ewé, kò yí padà ní ìtumọ̀.
