  source_fidelity: 'Ìtumọ̀ náà ń fara mọ́ Gíríìkì dáadáa ní gbogbogbò: Jésù yí padà, ó rí àwọn ènìyàn méjèèjì náà tí wọ́n ń tẹ̀lé e, ó béèrè ohun tí wọ́n ń wá, wọ́n sì pè é ní Rábì. Síbẹ̀, “ó sì rí i pé” lè túmọ̀ sí pé ó mọ̀ tàbí ó ṣàkíyèsí pé, dípò kí ó sọ pé ó rí àwọn náà gangan. Àtúnṣe náà mú αὐτούς (‘wọn’) hàn ní kedere gẹ́gẹ́ bí ohun tí Jésù rí.'
