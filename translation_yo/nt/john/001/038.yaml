id: JHN.1.38
reference: John 1:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: yo
  text: Nígbà náà, Jésù yíjú padà, ó sì rí wọn tí wọ́n ń tọ̀ ọ́ lẹ́yìn. Ó béèrè lọ́wọ́ wọn pé, “Kí ni ẹ̀ ń wá?” Wọ́n dá a lóhùn pé, “Rábì” (èyí túmọ̀ sí “Olùkọ́”), “níbo ni o ń gbé?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: yíjú padà
  rationale: Ó fi ìṣe yíyí padà hàn lọ́nà àdánidá ní Yorùbá, láì fi kún un pé ó yí gbogbo ara rẹ̀ tàbí pé ó yí sí ọ̀nà pàtó kan.
- source_word: θεασάμενος
  choice: ó sì rí i
  rationale: Ó mú ìríran pẹ̀lú àkíyèsí jáde ní ọ̀nà Yorùbá tó rọrùn, ó sì bá ìtẹ̀lé ìṣe náà mu.
- source_word: ἀκολουθοῦντας
  choice: wọ́n ń tọ̀ ọ́ lẹ́yìn
  rationale: Àmì ìṣe tó ń lọ lọ́wọ́ wà nínú ‘ń tọ̀,’ ó sì lè túmọ̀ sí títẹ̀lé ní ti ara àti ìbẹ̀rẹ̀ jíjẹ́ ọmọ-ẹ̀yìn láì fipá yan ọ̀kan.
- source_word: Τί ζητεῖτε;
  choice: Kí ni ẹ̀ ń wá?
  rationale: ‘Ń wá’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó lè tọ́ka sí ohun tí ènìyàn ń wá lójú ayé tàbí ohun tó jinlẹ̀ tí ọkàn ń lépa; ó pa àìdánilójú inú ζητέω mọ́.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa oyè Semitic náà mọ́ ní àkọsílẹ̀ ohùn Yorùbá nítorí pé ẹsẹ̀ náà fúnra rẹ̀ ṣàlàyé ìtumọ̀ rẹ̀.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: èyí túmọ̀ sí Olùkọ́
  rationale: Ó ṣe iṣẹ́ àlàyé tí òǹkọ̀wé ṣe, ‘Olùkọ́’ sì jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún Διδάσκαλε gẹ́gẹ́ bí oyè ìpè.
- source_word: ποῦ μένεις;
  choice: níbo ni o ń gbé?
  rationale: Nínú àyíká yìí, ìbéèrè náà jẹ́ nípa ibi tí Jésù dúró sí tàbí ń gbé fún ìgbà náà. ‘Ń gbé’ jẹ́ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú èrò ‘dídúró’ nínú Jòhánù.
theological_decisions:
- issue: Ìtumọ̀ μένω ní ìfarahàn àkọ́kọ́ rẹ̀ nínú Jòhánù, bó tilẹ̀ jẹ́ pé ó ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀ ní àwọn ibòmíràn
  choice: níbo ni o ń gbé?
  alternative: níbo ni o ń dúró?
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ fi hàn pé àwọn ọkùnrin náà ń béèrè ibi tí Jésù ń gbé tàbí dúró sí. Ìtumọ̀ yìí kò pa ìtumọ̀ tó jinlẹ̀ tí μένω ní ní àwọn apá míì run; àlàyé [b] ń jẹ́ kí olùkà rí ìsopọ̀ ọ̀rọ̀ náà.
- issue: ζητέω lè ní ìtumọ̀ ojú-ìwé àti ìtumọ̀ tó jinlẹ̀ nínú ìtàn Jòhánù
  choice: Kí ni ẹ̀ ń wá?
  alternative: Kí ni ẹ̀ ń wá kiri?
  rationale: ‘Kí ni ẹ̀ ń wá?’ jẹ́ àdánidá, ó sì lè gba ìbéèrè lasán àti ìbéèrè nípa ohun tí ọkàn ń lépa. ‘Ń wá kiri’ lè dín ìtumọ̀ náà kù sí wíwá ohun kan lasán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ẹ̀” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn nínú ìbéèrè Jésù, àti “o” fún ẹni kan nínú ìbéèrè sí Jésù.
