source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: yo
  text: Nátánáẹ́lì dá a lóhùn pé, “Rábì, ìwọ ni Ọmọ Ọlọ́run; ìwọ ni Ọba Ísírẹ́lì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá a lóhùn
  rationale: Ọ̀nà Yorùbá àdánidá fún fífi ìdáhùn nínú ìjíròrò hàn; ó bá ìtumọ̀ ἀποκρίνομαι mu.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A pa oyè Júù náà mọ́ ní ìkọ̀wé Yorùbá láti dá àyíká Júù ti ọ̀rúndún kìíní sí, dípò yíyí i sí ‘Olùkọ́.’
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa oyè pàtó àti agbára ọ̀rọ̀ nípa ẹni tí Kristi jẹ́ mọ́ láìfi àlàyé míì kún un.
- source_word: βασιλεὺς
  choice: Ọba
  rationale: ‘Ọba’ ni ìbámu tààrà fún βασιλεύς, ó sì yẹ gẹ́gẹ́ bí oyè ọba tí a so mọ́ Ísírẹ́lì.
- source_word: τοῦ Ἰσραήλ
  choice: Ísírẹ́lì
  rationale: Àkójọpọ̀ ‘Ọba Ísírẹ́lì’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti pa ìbáṣepọ̀ oyè náà mọ́, láìtúmọ̀ rẹ̀ sí ‘Ọba lórí Ísírẹ́lì.’
- source_word: σὺ εἶ … σὺ … εἶ
  choice: ìwọ ni … ìwọ ni
  rationale: Àtúnṣe ọ̀rọ̀ arọ́pò-orúkọ àti ọ̀rọ̀ ìdánimọ̀ pa ìtẹnumọ́ àti ìṣọ̀kan gbólóhùn ìjẹ́wọ́ Gíríìkì mọ́.
- source_word: Ναθαναήλ
  choice: Nátáníẹ́lì
  rationale: A kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà ìkọ̀wé Yorùbá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa ẹni tí Kristi jẹ́ nínú ìjẹ́wọ́ ‘Ọmọ Ọlọ́run’
  choice: Ọmọ Ọlọ́run
  alternative: ọmọ kan ti Ọlọ́run; Ọmọ ti Ọlọ́run
  rationale: A pa oyè náà mọ́ gẹ́gẹ́ bí Gíríìkì ṣe gbé e kalẹ̀, láìsọ ọ́ di aláìlẹ́gbẹ́ tàbí fi èdè ìjẹ́wọ́ ìgbà tó tẹ̀ lé e kún un.
- issue: Ìtumọ̀ ọba-Mèsáyà nínú ‘Ọba Ísírẹ́lì’
  choice: Ọba Ísírẹ́lì
  alternative: Ọba lórí Ísírẹ́lì; Ọba àwọn ọmọ Ísírẹ́lì
  rationale: Ọ̀rọ̀ yìí pa oyè ọba náà àti ìfarahàn ìrètí Mèsáyà mọ́, láìfi ìtumọ̀ àlàyé kún ọ̀rọ̀ orísun.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì pa àtúnṣe ‘ìwọ ni … ìwọ ni’ mọ́ fún ìtẹnumọ́.
