id: JHN.1.39
reference: John 1:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: yo
  text: Ó sọ fún wọn pé, “Ẹ wá, ẹ ó sì rí.” Nítorí náà, wọ́n lọ, wọ́n sì rí ibi tí ó ń dúró, wọ́n sì wà lọ́dọ̀ rẹ̀ ní ọjọ́ náà. Ó tó wákàtí kẹwàá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tí a bá ka wákàtí láti ìlà-oòrùn, èyí jẹ́ nǹkan bí aago mẹ́rin ìrọ̀lẹ́; àwọn kan sì gbà pé a kà á gẹ́gẹ́ bí ìṣírò àkókò àwọn ará Róòmù, èyí tí yóò jẹ́ nǹkan bí aago mẹ́wàá òwúrọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ó sọ fún wọn pé
  rationale: A tú ọ̀rọ̀ ìṣe ìsinsìnyí tí a lò gẹ́gẹ́ bí ìtàn sí àkókò tí ó ti kọjá, èyí tí ó bá ìṣọ̀rọ̀ ìtàn Yorùbá mu.
- source_word: Ἔρχεσθε
  choice: Ẹ wá
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni, ṣùgbọ́n ó ní agbára ìkésíni; ‘Ẹ wá’ jẹ́ ọ̀nà àdánidá, tààrà, tí kò fi ìtumọ̀ kún un.
- source_word: ὄψεσθε
  choice: ẹ ó sì rí i
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú mọ́, ó sì mú ìlérí inú ìkésíni náà jáde ní Yorùbá àdánidá.
- source_word: ἦλθαν οὖν
  choice: Nítorí náà, wọ́n lọ
  rationale: ‘Nítorí náà’ fi àbájáde ìkésíni hàn; ‘wọ́n lọ’ sì bá ojú ìwòye àwọn ọmọ-ẹ̀yìn nínú ìtàn mu.
- source_word: εἶδαν
  choice: wọ́n sì rí
  rationale: Ó jẹ́ ìtumọ̀ tààrà, ó sì pa ìfàsẹ́yìn ọ̀rọ̀ mọ́ láàárín ‘ẹ ó rí’ àti ‘wọ́n rí.’
- source_word: ποῦ μένει
  choice: ibi tí ó ń gbé
  rationale: Nínú àyíká yìí, μένω ń tọ́ka sí ibi tí Jesu ń dúró tàbí ń gbé nígbà náà; gbólóhùn yìí jẹ́ Yorùbá àdánidá láì pinnu bóyá ibùgbé náà jẹ́ ti pípẹ́ tàbí ti ìgbà díẹ̀.
- source_word: παρ’ αὐτῷ
  choice: lọ́dọ̀ rẹ̀
  rationale: Ó lè túmọ̀ sí wíwà ní ibi rẹ̀ àti nínú àjọṣe pẹ̀lú rẹ̀; ‘lọ́dọ̀ rẹ̀’ pa ìtẹ́sí méjèèjì yìí mọ́.
- source_word: ἔμειναν
  choice: wọ́n sì dúró
  rationale: ‘Dúró’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pípa wà níbìkan, ó sì tún pa ìsopọ̀ pẹ̀lú μένει mọ́ dé ìwọ̀n tí ó ṣeé ṣe.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ní ọjọ́ náà
  rationale: Ó tẹ̀ lé ìwọn gbólóhùn Gíríìkì láì fi ‘ìyókù ọjọ́ náà’ tàbí ‘gbogbo ọjọ́ náà’ kún un.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Ó jẹ́ nǹkan bí wákàtí kẹwàá
  rationale: ‘Nǹkan bí’ fi ìsúnmọ́ ὡς hàn, ‘wákàtí kẹwàá’ sì pa ọ̀nà tí orísun fi sọ àkókò mọ́ láì yí i sí aago òde òní nínú ẹsẹ̀.
theological_decisions:
- issue: Bí a ṣe ń ka ‘wákàtí kẹwàá’
  choice: A pa ‘wákàtí kẹwàá’ mọ́ nínú ẹsẹ̀.
  alternative: Ó lè jẹ́ nǹkan bí aago mẹ́rin ìrọ̀lẹ́ bí a bá bẹ̀rẹ̀ sí í kà láti ìlà-oòrùn, tàbí nǹkan bí aago mẹ́wàá òwúrọ̀ gẹ́gẹ́ bí ìṣírò àkókò àwọn ará Róòmù.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ètò ìṣírò àkókò tí a lò. Fífi ọ̀rọ̀ orísun sílẹ̀ nínú ẹsẹ̀, àti ṣíṣe àlàyé àwọn ìtumọ̀ pàtàkì nínú àlàyé ìsàlẹ̀, kò yanju ohun tí ẹsẹ̀ kò yanju.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
