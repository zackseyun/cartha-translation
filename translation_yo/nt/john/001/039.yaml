  to: Ó sọ fún wọn pé, “Ẹ wá, ẹ ó sì rí.” Nítorí náà, wọ́n lọ, wọ́n sì rí ibi tí ó ń dúró, wọ́n sì wà lọ́dọ̀ rẹ̀ ní ọjọ́ náà. Ó tó wákàtí kẹwàá[a].
