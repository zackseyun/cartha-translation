  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: yo
  text: Ọkùnrin kan wà tí a rán láti ọ̀dọ̀ Ọlọ́run wá; orúkọ rẹ̀ ni Jòhánù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: Ọkùnrin kan wà
  rationale: Ọ̀rọ̀ náà ń mú ẹni tuntun wọ inú ìtàn. ‘Ọkùnrin kan wà’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ wíwà hàn, láì túmọ̀ ọ́ sí pé a ṣẹ̀ṣẹ̀ dá a tàbí pé ó kàn fara hàn.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ọkùnrin kan pàtó, ìyẹn Jòhánù.
- source_word: ἀπεσταλμένος
  choice: tí a rán
  rationale: Ó pa ohùn àìṣe mọ́, ó sì fi Jòhánù hàn gẹ́gẹ́ bí ẹni tí ẹlòmíràn rán; àyíká ọ̀rọ̀ sọ pé Ọlọ́run ni orísun iṣẹ́ náà.
- source_word: παρὰ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run wá
  rationale: Παρά pẹ̀lú ẹ̀dá-orúkọ genitive ń tọ́ka sí orísun. Gbólóhùn Yorùbá yìí pa ìtumọ̀ pé Ọlọ́run ni ó ti rán an wá mọ́, dípò fífi ìtẹnumọ́ sí olùṣe nìkan.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: orúkọ rẹ̀ ni Jòhánù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa agbára ìdánimọ̀ ti gbólóhùn Gíríìkì náà mọ́.
- source_word: Ἰωάννης
  choice: Jòhánù
  rationale: A lo ìrísí orúkọ yìí tí ó ti fìdí múlẹ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá.
theological_decisions:
- issue: Ìwà iṣẹ́ tí Jòhánù ń ṣe
  choice: A fi Jòhánù hàn gẹ́gẹ́ bí ẹni tí a rán láti ọ̀dọ̀ Ọlọ́run wá.
  alternative: Ọlọ́run ni ó rán Jòhánù.
  rationale: ἀπεσταλμένος àti παρὰ θεοῦ papọ̀ fi iṣẹ́ rírán láti ọ̀dọ̀ Ọlọ́run hàn. Ìtumọ̀ náà pa orísun iṣẹ́ náà mọ́ láì fi ẹ̀kọ́ míì tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lásán. A lo àmì semicolon láti pa ìṣàn gbólóhùn Gíríìkì kan ṣoṣo mọ́.
