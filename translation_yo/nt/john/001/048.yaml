id: JHN.1.48
reference: John 1:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: yo
  text: Nátánáẹ́lì sọ fún un pé, “Báwo ni o ṣe mọ̀ mí?”[a] Jésù dá a lóhùn, ó sì sọ fún un pé, “Kí Fílípì tó pè ọ́, nígbà tí o wà lábẹ́ igi ọ̀pọ̀tọ́, mo rí ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù, “Láti ibò ni o ṣe mọ̀ mí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: Báwo ni
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààràtà ni ‘láti ibo,’ nínú ìbéèrè yìí ó ń béèrè nípa ọ̀nà tàbí ìpìlẹ̀ tí Jésù fi mọ Nátánáẹ́lì. ‘Báwo ni o ṣe mọ̀ mí?’ jẹ́ Yorùbá àdánidá tí ó pa èrò náà mọ́; àṣàyàn tó sún mọ́ ọ̀rọ̀ Gíríìkì jù wà nínú àlàyé ìsàlẹ̀.
- source_word: γινώσκεις
  choice: o ṣe mọ̀ mí
  rationale: ‘Mọ̀’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún ìmọ̀ ẹni tàbí ojúlùmọ̀ nínú àyíká yìí.
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: dá a lóhùn, ó sì sọ fún un pé
  rationale: Ìtumọ̀ yìí pa àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì, síbẹ̀ ó jẹ́ Yorùbá àdánidá.
- source_word: Πρὸ τοῦ ... φωνῆσαι
  choice: Kí ... tó pè ọ́
  rationale: Ìṣètò ‘kí ... tó’ fi hàn kedere pé ìṣẹ̀lẹ̀ kan ṣáájú òmíràn, gẹ́gẹ́ bí gbólóhùn Gíríìkì ṣe túmọ̀ sí.
- source_word: φωνῆσαι
  choice: pè ọ́
  rationale: ‘Pè’ lè túmọ̀ sí pípe ẹni tàbí yíyanjú láti mú un wá, ó sì bá àyíká ìtàn náà mu.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: nígbà tí o wà lábẹ́ igi ọ̀pọ̀tọ́
  rationale: Ó sọ ipò Nátánáẹ́lì nígbà tí Jésù rí i, ó sì jẹ́ ọ̀nà àdánidá láti tú participle Gíríìkì sí Yorùbá.
- source_word: εἶδόν σε
  choice: mo rí ọ
  rationale: Aorist Gíríìkì jẹ́ ìṣe tó ṣẹlẹ̀ nígbà tó kọjá; ‘mo rí ọ’ tú u ní tààràtà láìfi àlàyé míì kún un.
- source_word: συκῆν
  choice: igi ọ̀pọ̀tọ́
  rationale: Èyí ni orúkọ Yorùbá tó wọ́pọ̀ fún igi fig.
theological_decisions:
- issue: Irú ìmọ̀ tí Jésù ní nípa Nátánáẹ́lì
  choice: A sọ ọ̀rọ̀ Jésù ní tààràtà pé ó rí Nátánáẹ́lì ṣáájú pípe Fílípì, láìṣàlàyé bí ó ṣe rí i.
  alternative: Ṣàlàyé nínú ìtumọ̀ pé ìríran àrà ọ̀tọ̀ tàbí ìmọ̀ àtọ̀runwá ni.
  rationale: Ẹsẹ̀ náà kò sọ ọ̀nà tí Jésù gbà mọ̀ tàbí rí Nátánáẹ́lì. Fífi ọ̀rọ̀ náà sílẹ̀ bí ó ti rí ń pa àìdánilójú àti ìfúnpá ẹ̀kọ́-ìgbàgbọ́ inú àyíká náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘sọ fún un pé’ dípò ọ̀rọ̀ àtijọ́ tó lè nira, ṣùgbọ́n a pa ìtẹ̀sí ọ̀wọ̀ àti àṣà ìtàn Jòhánù mọ́.
