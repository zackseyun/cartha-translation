id: JHN.1.32
reference: John 1:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: yo
  text: Jòhánù sì jẹ́rìí, ó wí pé, “Mo ti rí Ẹ̀mí náà tí ó ń sọ̀kalẹ̀ bí àdàbà[a] láti inú ọ̀run[b], Ẹ̀mí náà sì dúró lórí rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gẹ́gẹ́ bí àdàbà.” Ọ̀rọ̀ Gíríìkì náà ń fi ìjọra hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láti ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: jẹ́rìí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ẹ̀rí hàn tàbí jíjẹ́rìí. “Jẹ́rìí” jẹ́ ọ̀nà Yorùbá tó ṣe déédé, tó sì pa ìtumọ̀ ẹlẹ́rìí mọ́.
- source_word: λέγων
  choice: ó wí pé
  rationale: Ọ̀rọ̀ alábápín yìí ń mú ohun tí Jòhánù jẹ́rìí sí wọlé. “Ó wí pé” dára ní Yorùbá òde òní ju títẹ̀lé ìṣètò Gíríìkì ní líle lọ.
- source_word: Τεθέαμαι
  choice: Mo ti rí
  rationale: Fọ́ọ̀mù pípé náà sọ nípa ohun tí ẹni náà rí fúnra rẹ̀, tí ẹ̀rí rẹ̀ sì ṣì ṣe pàtàkì. “Mo ti rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa agbára yìí mọ́.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí náà
  rationale: Àyíká ẹsẹ̀ 32–33 fi hàn pé Ẹ̀mí Ọlọ́run ni a ń tọ́ka sí. Lílo lẹ́tà ńlá fún “Ẹ̀mí” ń fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn láìfi ọ̀rọ̀ míì kún un.
- source_word: καταβαῖνον
  choice: tí ó ń sọ̀kalẹ̀
  rationale: Ó ṣàpèjúwe ìṣípò láti òkè sí ìsàlẹ̀, ó sì ń ṣe àlàyé sí “Ẹ̀mí náà.” Ọ̀nà yìí jẹ́ àdánidá, ó sì pa ìṣe tó ń lọ lọ́wọ́ mọ́.
- source_word: ὡς περιστερὰν
  choice: bí àdàbà
  rationale: ὡς ń fi ìfiwéra hàn níbí. “Bí àdàbà” pa àwòrán ìfiwéra mọ́, láìsọ pé Ẹ̀mí náà di àdàbà ní ti gidi.
- source_word: ἐξ οὐρανοῦ
  choice: láti inú ọ̀run
  rationale: ἐξ ń tọ́ka sí ìṣípò jáde láti orísun kan. “Láti inú ọ̀run” pa àwòrán ààyè náà mọ́; “láti ọ̀run” náà ṣeé ṣe.
- source_word: ἔμεινεν
  choice: dúró
  rationale: μένω túmọ̀ sí dídúró tàbí wíwà níbẹ̀ láìlọ. “Dúró” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu nínú àyíká yìí.
- source_word: ἐπ’ αὐτόν
  choice: lé e
  rationale: Ọ̀rọ̀ náà fi hàn pé Ẹ̀mí dúró lórí ẹni tí a ń tọ́ka sí. “Lé e” jẹ́ ọ̀nà Yorùbá àdánidá fún “lórí rẹ̀” ní irú gbólóhùn yìí.
theological_decisions:
- issue: Ẹni tí τὸ πνεῦμα ń tọ́ka sí
  choice: “Ẹ̀mí náà” ń tọ́ka sí Ẹ̀mí Mímọ́
  alternative: “ẹ̀mí náà” gẹ́gẹ́ bí ẹ̀mí tí kò ní ìdánimọ̀ pàtó
  rationale: Àyíká Jòhánù 1:32–33 sọ̀rọ̀ nípa àmì Ọlọ́run nígbà ìrìbọmi Jésù àti ẹni tí yóò máa fi Ẹ̀mí Mímọ́ bọmi. Ìtumọ̀ yìí ń tẹ̀lé àyíká láìfi ẹ̀kọ́ ẹ̀sìn míì kún ọ̀rọ̀ náà.
- issue: Agbára ὡς περιστερὰν
  choice: 'ìfiwéra: Ẹ̀mí náà sọ̀kalẹ̀ bí àdàbà'
  alternative: Ẹ̀mí náà sọ̀kalẹ̀ gẹ́gẹ́ bí àdàbà
  rationale: ὡς sábà máa ń fi ìjọra tàbí ìfiwéra hàn. “Bí àdàbà” yàgò fún pípa àìdánilójú inú àwòrán náà rẹ́, kò sì fi dandan mú un pé Ẹ̀mí náà jẹ́ àdàbà ní ti gidi.
- issue: Arọ́pò-orúkọ fún Ẹ̀mí nínú gbólóhùn ìkẹyìn
  choice: “ó” tí kò fi akọ tàbí abo hàn
  alternative: ṣíṣe àtúnlò “Ẹ̀mí náà”
  rationale: Arọ́pò-orúkọ Yorùbá “ó” kò ní ìyàtọ̀ akọ, abo tàbí ohun aláìlẹ́mìí. Nítorí náà, ó lè tọ́ka padà sí Ẹ̀mí náà láìfi akọ tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. Àmì ohùn ni a fi sí ibi tí ó yẹ. “Ó wí pé” àti “lé e” mú gbólóhùn náà dun bí Yorùbá àdánidá, nígbà tí “Ẹ̀mí,” “sọ̀kalẹ̀,” àti “dúró” pa àwọn ọ̀rọ̀ pàtàkì inú orísun Gíríìkì mọ́.
