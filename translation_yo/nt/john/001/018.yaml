revisions:
- from: Kò sí ẹni kankan tí ó ti rí Ọlọ́run rí; Ọlọ́run kan ṣoṣo náà[a], ẹni tí ó wà ní oókan àyà Baba[b], òun ni ó ti sọ Ọlọ́run di mímọ̀[c].
  to: Kò sí ẹni kankan tí ó ti rí Ọlọ́run rí; Ọlọ́run kan ṣoṣo náà[a], ẹni tí ó wà ní àyà Bàbá[b], ni ó ti fi Ọlọ́run hàn[c].
  rationale: The revision corrects the misleading rendering of ἐξηγήσατο and replaces an unclear expression for κόλπος with idiomatic Yoruba while preserving the source text’s metaphor, the emphatic demonstrative force, and the SBLGNT reading “μονογενὴς θεός.” The notes remain anchored to the relevant phrases and preserve the manuscript variant without resolving it doctrinally.
  reviewer_model: gpt-5.6-terra
