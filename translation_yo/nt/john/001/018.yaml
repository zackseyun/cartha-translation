id: JHN.1.18
reference: John 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: yo
  text: Kò sí ẹni kankan tí ó ti rí Ọlọ́run rí; Ọlọ́run kan ṣoṣo náà[a], ẹni tí ó wà ní àyà Bàbá[b], ni ó ti fi Ọlọ́run hàn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé-àfọwọ́kọ kan ní, “Ọmọ kan ṣoṣo” (tàbí “Ọmọ bíbí kan ṣoṣo”), dípò “Ọlọ́run kan ṣoṣo.”
    reason: textual_variant
  - marker: b
    text: A tún lè tú u sí, “lẹ́gbẹ̀ẹ́ Bàbá.” Ní ti gidi, èdè Gíríìkì sọ pé, “ní àyà Bàbá,” èyí tí ó ń fi ìsúnmọ́ra tó jinlẹ̀ hàn.
    reason: lexical_alternative
  - marker: c
    text: A tún lè tú u sí, “ó ti ṣàlàyé ẹni tí Ọlọ́run jẹ́” tàbí “ó ti sọ Ọlọ́run di mímọ̀ fún wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Ọlọ́run
  rationale: Ọ̀rọ̀ yìí ni ohun tí ἑώρακεν ń tọ́ka sí, ó sì jẹ́ ọ̀nà Yorùbá tí ó bójú mu láti pe Ọlọ́run ní ibi yìí.
- source_word: οὐδεὶς
  choice: Kò sí ẹni kankan
  rationale: Ó fi ìkọ̀sílẹ̀ tí ó kan gbogbo ènìyàn hàn ní Yorùbá àdánidá.
- source_word: ἑώρακεν πώποτε
  choice: tí ó ti rí ... rí
  rationale: Ìlò ‘ti ... rí’ mú ìtumọ̀ perfect tense àti πώποτε jáde gẹ́gẹ́ bí ‘rí rí’ tàbí ‘nígbà kan rí,’ láì mú gbolohun náà le.
- source_word: μονογενὴς θεὸς
  choice: Ọlọ́run kan ṣoṣo náà
  rationale: A tẹ̀ lé ẹ̀dà SBLGNT, tí ó ní θεός, a sì tú μονογενής sí ‘kan ṣoṣo’ láti fi ìjẹ́ aláìlẹ́gbẹ́ hàn dípò kí a fi ìtumọ̀ ‘bíbí’ kún un ní pàtó.
- source_word: ὁ ὢν
  choice: ẹni tí ó wà
  rationale: Ó tú participle tí a lò bí orúkọ sí gbólóhùn ìbátan Yorùbá tí ó ṣe kedere.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: ní oókan àyà Baba
  rationale: Ó pa àwòrán κόλπος mọ́, ó sì sọ ìsúnmọ́ra àti ìbátan tímọ́tímọ́ ní Yorùbá àdánidá.
- source_word: ἐκεῖνος
  choice: òun ni
  rationale: Fọ́ọ̀mù yìí pa ìtẹnumọ́ demonstrative náà mọ́, ó sì tọ́ka padà sí ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐξηγήσατο
  choice: ó ti sọ Ọlọ́run di mímọ̀
  rationale: Ó mú èrò ṣíṣàlàyé, ṣíṣí payá, àti mímú ẹni di mímọ̀ jáde; títún ‘Ọlọ́run’ sọ dín àìdánilójú arọ́pò-orúkọ Yorùbá kù.
theological_decisions:
- issue: Ìyàtọ̀ àfọwọ́kọ láàárín μονογενὴς θεός àti ὁ μονογενὴς υἱός
  choice: Ọ̀rọ̀ inú SBLGNT, ‘Ọlọ́run kan ṣoṣo,’ wà nínú àkọ́kọ́; àfọwọ́kọ ‘Ọmọ kan ṣoṣo’ wà ní àlàyé ìsàlẹ̀.
  alternative: Ọmọ kan ṣoṣo; Ọmọ bíbí kan ṣoṣo
  rationale: Èyí tẹ̀ lé orísun tí a pèsè, ó sì pa ìyàtọ̀ àfọwọ́kọ pàtàkì yìí mọ́ láì dá a parí ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ μονογενής
  choice: kan ṣoṣo
  alternative: bíbí kan ṣoṣo; aláìlẹ́gbẹ́
  rationale: ‘Kan ṣoṣo’ fi ìjẹ́ ọ̀kan ṣoṣo àti aláìlẹ́gbẹ́ hàn láì sọ pé apá ‘bíbí’ wà nínú ìtumọ̀ ọ̀rọ̀ náà fúnra rẹ̀.
- issue: Ẹni tí ἐξηγήσατο fi hàn
  choice: A tún ‘Ọlọ́run’ sọ nínú gbólóhùn náà.
  alternative: ó ti fi í hàn; ó ti sọ ọ́ di mímọ̀
  rationale: Àwọn arọ́pò-orúkọ Yorùbá lè ṣókùnkùn ní àyíká yìí; títún orúkọ náà sọ mú kí ó ṣe kedere pé Ọlọ́run ni ẹni tí Ọlọ́run kan ṣoṣo náà sọ di mímọ̀, láì yí ìtumọ̀ orísun padà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Oókan àyà’ pa àwòrán orísun mọ́, nígbà tí ‘òun ni’ pa ìtẹnumọ́ mọ́. Àtúnwí ‘Ọlọ́run’ jẹ́ ti ìmúlò Yorùbá kedere, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
