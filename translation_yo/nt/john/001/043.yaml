source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: yo
  text: Ní ọjọ́ kejì, ó fẹ́ jáde lọ sí Galili[a]. Jésù sì rí Fílípì, ó sì wí fún un pé,[b] “Tẹ̀lé mi.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “lọ sínú ilẹ̀ Galili.” Ọ̀rọ̀ àsopọ̀ Gíríìkì εἰς lè tọ́ka sí lílọ sínú agbègbè kan tàbí lílọ sí ibì kan.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ọ̀rọ̀-ìṣe tí a túmọ̀ sí “rí” àti “wí” wà ní àkókò ìsinsìnyí nínú Gíríìkì; lílo àkókò ìsinsìnyí fún ìtàn ohun tó ti ṣẹlẹ̀ ń mú kí ìtàn náà yè kedere.
    reason: lexical_alternative
  - marker: c
    text: Àṣẹ náà lè túmọ̀ sí kí Fílípì bá Jésù lọ ní ti ara, ó sì tún lè jẹ́ ìpè sí i láti di ọmọ-ẹ̀yìn rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ ní ọjọ́ tí ó tẹ̀ lé e, ó sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: ἠθέλησεν
  choice: ó fẹ́
  rationale: Ìtumọ̀ yìí pa èrò ìfẹ́ tàbí ìpinnu inú tí θέλω ní mọ́, láì sọ ọ́ di ‘ó pinnu’ tí ó lè lágbára ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: ἐξελθεῖν
  choice: jáde lọ
  rationale: Ó tẹ̀ lé ìtumọ̀ ìpilẹ̀ ἐξέρχομαι, ó sì jẹ́ gbólóhùn àdánidá ní Yorùbá nígbà tí ibi tí ẹni náà ń lọ bá tẹ̀ lé e.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς lè túmọ̀ sí lílọ sínú agbègbè kan, ‘sí Galili’ ni ọ̀nà Yorùbá tó ṣe déédéé jù fún ìrìn-àjò lọ sí ibì kan; àlàyé ìtumọ̀ gangan wà ní àlàyé ìsàlẹ̀.
- source_word: εὑρίσκει
  choice: rí
  rationale: Yorùbá sábà máa ń lo àsìkò ìtàn tó bá ọ̀rọ̀ yíká mu; lílo ‘rí’ jẹ́ àdánidá, nígbà tí àlàyé ìsàlẹ̀ tọ́ka sí historical present inú Gíríìkì.
- source_word: λέγει
  choice: wí
  rationale: ‘Wí fún un pé’ jẹ́ ọ̀nà ọ̀wọ̀ àti àdánidá ní Yorùbá; a ṣàlàyé àsìkò present inú Gíríìkì ní àlàyé ìsàlẹ̀.
- source_word: Ἀκολούθει μοι
  choice: Máa tọ̀ mí lẹ́yìn
  rationale: Àṣẹ ‘máa tọ̀’ lè fi ìṣe tí ń bá a lọ hàn, ó sì pa ìṣòro ìtumọ̀ mọ́ láàárín lílọ pẹ̀lú Jésù ní ti ara àti jíjẹ́ ọmọ-ẹ̀yìn rẹ̀.
- source_word: Φίλιππον
  choice: Fílípì
  rationale: A kọ orúkọ náà ní ìrísí tí ó ti wọ́pọ̀ nínú Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A pa ẹni tí ó ṣe ìṣe náà mọ́ ní gbangba gẹ́gẹ́ bí ó ti wà nínú Gíríìkì, kí ìtàn náà lè ṣe kedere.
theological_decisions:
- issue: Agbára àṣẹ Jésù sí Fílípì
  choice: “Máa tọ̀ mí lẹ́yìn” gẹ́gẹ́ bí ìpè tààrà sí jíjẹ́ ọmọ-ẹ̀yìn
  alternative: Ìpè lásán láti bá Jésù rìn ní ti ara
  rationale: Àyíká náà ní ìrìn-àjò nínú, ṣùgbọ́n Ἀκολούθει μοι nínú àwọn Ìhìn Rere tún sábà ń tọ́ka sí ìpè sí jíjẹ́ ọmọ-ẹ̀yìn. Ọ̀rọ̀ Yorùbá náà pa ìtumọ̀ méjèèjì mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtòlẹ́sẹẹsẹ gbólóhùn náà mú ẹni tí ‘ó fẹ́’ jáde lọ ṣe kedere láti inú àyíká, lẹ́yìn náà ó tún dárúkọ Jésù níbi tí Gíríìkì ti fi orúkọ rẹ̀ hàn.
