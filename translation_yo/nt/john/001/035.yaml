  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: yo
  text: Ní ọjọ́ kejì[a], Jòhánù tún wà níbẹ̀ ní ìdúró, àwọn ọmọ-ẹ̀yìn rẹ̀ méjì sì wà pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ní ọjọ́ tí ó tẹ̀ lé e, Jòhánù tún wà ní ìdúró, àwọn ọmọ-ẹ̀yìn rẹ̀ méjì sì wà níbẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Gbólóhùn àkókò yìí túmọ̀ sí ‘ní ọjọ́ tí ó tẹ̀ lé e.’ ‘Ní ọjọ́ kejì’ jẹ́ ọ̀nà àdánidá, ṣókí láti sọ ọ́ ní Yorùbá, ó sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ fi hàn pé ìṣe tàbí ipò náà tún ṣẹlẹ̀ gẹ́gẹ́ bí ó ti rí nínú ìṣẹ̀lẹ̀ ṣáájú.
- source_word: εἱστήκει
  choice: dúró níbẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà ṣàpèjúwe Jòhánù bí ẹni tí ó wà ní ipò dídúró. ‘Dúró níbẹ̀’ jẹ́ àdánidá ní Yorùbá; ‘níbẹ̀’ jẹ́ àfikún fún ìṣàn gbólóhùn, kì í ṣe àlàyé tuntun.
- source_word: ὁ Ἰωάννης
  choice: Jòhánù
  rationale: Èyí ni ọ̀nà tí a sábà ń gbà kọ orúkọ náà ní Yorùbá. Bó tilẹ̀ jẹ́ pé Jòhánù Onítẹ̀bọmi ni àyíká ọ̀rọ̀ ń tọ́ka sí, ẹsẹ náà sọ ‘Jòhánù’ nìkan.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so Jòhánù àti àwọn ọmọ ẹ̀yìn méjì náà pọ̀ lọ́nà àdánidá nínú ìtàn Yorùbá, ó sì pa ìṣọ̀kan rọrùn ti Gíríìkì mọ́.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: àwọn ọmọ ẹ̀yìn rẹ̀ méjì sì wà pẹ̀lú rẹ̀
  rationale: Gíríìkì túmọ̀ ní tààrà sí ‘méjì lára àwọn ọmọ ẹ̀yìn rẹ̀.’ Yorùbá nílò àsọyé kíkún; ‘wà pẹ̀lú rẹ̀’ sọ ipò tí àyíká ọ̀rọ̀ túmọ̀ sí láìyí ìtumọ̀ pé àwọn méjì náà jẹ́ lára àwọn ọmọ ẹ̀yìn rẹ̀.
