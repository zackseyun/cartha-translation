id: JHN.1.45
reference: John 1:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: yo
  text: 'Fílípì rí Nátáníẹ́lì, ó sì sọ fún un pé, “A ti rí ẹni tí Mósè kọ̀wé nípa rẹ̀ nínú Òfin, tí àwọn wòlíì náà sì kọ̀wé nípa rẹ̀: Jésù ọmọ Jósẹ́fù, ẹni tí ó wá láti Násárẹ́tì.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: rí
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ historical present, ṣùgbọ́n àsìkò àtẹ̀yìnwá bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: λέγει
  choice: sọ fún un pé
  rationale: A tú historical present náà sí àsìkò àtẹ̀yìnwá; “sọ fún un pé” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọ̀rọ̀ tààrà bẹ̀rẹ̀.
- source_word: Ὃν ... ἔγραψεν
  choice: ẹni tí ... kọ̀wé nípa rẹ̀
  rationale: Èyí pa ìtọ́kasí sí ẹni kan mọ́, ó sì sọ àkópọ̀ relative-object ti Gíríìkì di Yorùbá tí ó ṣe kedere.
- source_word: ἐν τῷ νόμῳ
  choice: nínú Òfin
  rationale: “Òfin” tọ́ka sí àkójọpọ̀ Ìwé Mímọ́ tí a so mọ́ Mósè, kì í ṣe òfin lápapọ̀.
- source_word: οἱ προφῆται
  choice: àwọn wòlíì
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn wòlíì gẹ́gẹ́ bí ẹlẹ́rìí inú Ìwé Mímọ́.
- source_word: εὑρήκαμεν
  choice: A ti rí
  rationale: '“Ti rí” pa ipa perfect mọ́: ìwárí náà ti ṣẹlẹ̀, abajade rẹ̀ sì wà lọ́wọ́lọ́wọ́.'
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: ọmọ Jósẹ́fù
  rationale: A pa ìdánimọ̀ àwùjọ tí Fílípì sọ mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: ẹni tí ó wá láti Násárẹ́tì
  rationale: “Láti” fi ìtumọ̀ ἀπό hàn ní kedere ju ìtumọ̀ àṣà bí “Jésù ti Násárẹ́tì” lọ.
- source_word: Φίλιππος / Ναθαναὴλ / Μωϋσῆς / Ἰησοῦν / Ἰωσὴφ / Ναζαρέτ
  choice: Fílípì / Nátáníẹ́lì / Mósè / Jésù / Jósẹ́fù / Násárẹ́tì
  rationale: A lo àwọn ìrísí orúkọ tí ó wọ́pọ̀ nínú Yorùbá, pẹ̀lú àmì ohùn níbi tí ó bá yẹ.
theological_decisions:
- issue: Ìtumọ̀ “ọmọ Jósẹ́fù” nípa Kristi
  choice: A pa ọ̀rọ̀ Fílípì mọ́ gẹ́gẹ́ bí “Jésù ọmọ Jósẹ́fù.”
  alternative: “Jésù, ẹni tí a rò pé ó jẹ́ ọmọ Jósẹ́fù” tàbí ṣíṣe àlàyé pé ìbátan òfin/àwùjọ ni.
  rationale: Ẹsẹ̀ náà ròyìn bí Fílípì ṣe dá Jésù mọ̀ nígbà yẹn. Kí a má ṣe fi ìṣọ̀kan ẹ̀kọ́ ìgbàgbọ́ láti ibòmíràn wọ inú ọ̀rọ̀ tí kò sí nínú ẹsẹ̀.
- issue: Ìwọ̀n ọ̀rọ̀ “Mósè nínú Òfin àti àwọn wòlíì”
  choice: 'A sọ àwọn méjèèjì di olùkọ̀wé nípa ẹni náà: Mósè ... àti àwọn wòlíì pẹ̀lú.'
  alternative: Ṣíṣe “àwọn wòlíì” bí ẹni pé wọ́n wà lábẹ́ ohun tí Mósè kọ.
  rationale: Ìṣètò Gíríìkì fi Mósè àti àwọn wòlíì hàn gẹ́gẹ́ bí ẹlẹ́rìí Ìwé Mímọ́ méjì, láìsọ ohun tí wọ́n kọ nípa ẹni náà ní pàtó ju bí Fílípì ti sọ lọ.
translation_notes:
  register: Yorùbá àgbà lónìí tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yàgò fún èdè ẹ̀sìn tí ó le tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ kò sọ.
