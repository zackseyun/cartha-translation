id: JHN.1.21
reference: John 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: yo
  text: Wọ́n sì bi í pé, “Kí wá ni? Ṣé ìwọ ni Èlíjà?” Ó ní[b], “Èmi kọ́.” “Ṣé ìwọ ni Wòlíì náà[a]?” Ó sì dáhùn pé, “Rárá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wòlíì yẹn”; ó ṣeé ṣe kí èyí tọ́ka sí wòlíì bíi Mósè tí àwọn ènìyàn ń retí (Diutarónómì 18:15, 18).
    reason: alternative_reading
  - marker: b
    text: Nínú Gíríìkì, ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí—“ó ní”—gẹ́gẹ́ bí ọ̀nà ìsọ̀rò ìtàn tó ń mú ìṣẹ̀lẹ̀ náà hàn ní ìwàláàyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wọ́n bi í pé
  rationale: Ọ̀rọ̀ yìí fi ìbéèrè tààrà sínú ìtàn. ‘Wọ́n bi í pé’ jẹ́ ọ̀nà Yorùbá àdánidá, ó sì dá ìtumọ̀ ọ̀rọ̀ Gíríìkì náà dúró láìfi agbára àfikún sí i.
- source_word: Τί οὖν;
  choice: Kí wá ni?
  rationale: Gbólóhùn kúkúrú yìí fi ìbéèrè tí ó tẹ̀ lé ìdáhùn ìṣáájú hàn. Ó pa bí ọ̀rọ̀ Gíríìkì náà ṣe kúrú, tó sì gé ṣókí mọ́.
- source_word: σὺ Ἠλίας εἶ
  choice: Ṣé ìwọ ni Èlíjà?
  rationale: ‘Ìwọ’ ṣe àfihàn bí σὺ ṣe ní ìtẹnumọ́, ìṣètò gbólóhùn náà sì jẹ́ ti ìbéèrè Yorùbá àdánidá.
- source_word: Οὐκ εἰμί
  choice: Èmi kọ́
  rationale: Èyí pa ìdáhùn náà mọ́ ní ṣókí àti ní ìtẹnumọ́, láìfi àlàyé tàbí ohun tí kò sí nínú Gíríìkì kún un.
- source_word: Ὁ προφήτης
  choice: Wòlíì náà
  rationale: Ọ̀rọ̀ atọ́ka Gíríìkì tọ́ka sí ẹni pàtó kan tí àwọn ènìyàn ń retí, kì í ṣe wòlíì kan lásán. ‘Wòlíì náà’ pa ìtumọ̀ pàtó yìí mọ́ láìdá ẹni tí ó ń tọ́ka sí lójú nínú ọ̀rọ̀ àkọ́kọ́.
- source_word: λέγει
  choice: Ó ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ọ̀rọ̀ ẹni kan kalẹ̀ nínú ìtàn. Àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àkókò ìsinsìnyí ìtàn.
- source_word: ἀπεκρίθη
  choice: ó dáhùn pé
  rationale: Èyí ni ìtumọ̀ Yorùbá tààrà àti àdánidá fún ọ̀rọ̀-ìṣe ìdáhùn nínú ìtàn.
- source_word: Οὔ
  choice: Rárá
  rationale: Ọ̀rọ̀ òdì tí ó dá dúró yìí jẹ́ ìdáhùn tààrà; ‘Rárá’ ni ọ̀nà Yorùbá àdánidá tí ó bá a mu.
theological_decisions:
- issue: Ta ni ‘Wòlíì náà’ ń tọ́ka sí?
  choice: Wòlíì náà
  alternative: Wòlíì bíi Mósè tí a ń retí; tàbí wòlíì kan lásán
  rationale: Ọ̀rọ̀ atọ́ka inú Gíríìkì fi ẹni tí a mọ̀ tàbí tí a ń retí hàn. A kò ṣàlàyé ẹni náà sínú ọ̀rọ̀ àkọ́kọ́, kí ìbéèrè àti ìfojúsọ́nà inú ẹsẹ náà lè dúró bí ó ti rí.
- issue: Ìkọ̀ Jòhánù pé òun kì í ṣe Èlíjà
  choice: Èmi kọ́
  alternative: Ṣàfikún pé òun kì í ṣe Èlíjà ní ti ara gan-an; tàbí mú un bá àwọn ẹsẹ míì mu nípasẹ̀ àlàyé
  rationale: Ẹsẹ náà gbé ìkọ̀ Jòhánù kalẹ̀ ní tààrà. Ìtumọ̀ kò gbọdọ̀ fi ìṣọ̀kan àlàyé láti ibòmíràn kún ọ̀rọ̀ rẹ̀ tàbí dín agbára ìkọ̀ náà kù.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Kí wá ni?’ pa ìbéèrè Gíríìkì mọ́ ní ṣókí; ‘Èmi kọ́’ àti ‘Rárá’ sì pa ìdáhùn méjèèjì mọ́ ní kúkúrú. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
