  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: yo
  text: 'Èmi náà kò mọ̀ ọ́[a]; ṣùgbọ́n kí a lè fi í hàn fún Ísírẹ́lì ni mo ṣe wá ń ṣe ìrìbọmi nínú omi.


    [a] Tàbí, “Èmi náà kò dá a mọ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ẹni kan kò mọ ẹnì kejì rí, tàbí pé kò dá ẹni náà mọ̀; ọ̀rọ̀ inú ẹsẹ yìí kò fi pàtó yan ọ̀kan nínú àwọn ìtumọ̀ méjèèjì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi náà kò dá a mọ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ẹni kan kò mọ ẹnì kejì rí, tàbí pé kò dá ẹni náà mọ̀; ọ̀rọ̀ inú ẹsẹ yìí kò fi pàtó yan ọ̀kan nínú àwọn ìtumọ̀ méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Èmi kò sì
  rationale: “Èmi” pa ìtẹnumọ́ arọ́pò-orúkọ mọ́, “sì” sì so ẹ̀rí yìí mọ́ ọ̀rọ̀ tó ṣáájú láìfi agbára àfikún tí kò pọn dandan kún un.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: kò mọ̀ ọ́
  rationale: “Mọ̀” jẹ́ gbólóhùn Yorùbá tó gbòòrò, ó sì lè tọ́ka sí àìmọ ẹni tàbí àìdá ẹni mọ̀; èyí pa àìdánilójú inú Gíríìkì mọ́.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àìmọ̀ Johanu tẹ́lẹ̀ àti ìdí iṣẹ́ ìrìbọmi rẹ̀.
- source_word: ἵνα φανερωθῇ
  choice: kí a lè fi í hàn
  rationale: Èyí sọ ète náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ pé a fi ẹni náà hàn mọ́ láìsọ ẹni tó ṣe iṣẹ́ náà ní pàtó.
- source_word: τῷ Ἰσραὴλ
  choice: fún Ísírẹ́lì
  rationale: Ó pa ìtọ́kasí sí Ísírẹ́lì gẹ́gẹ́ bí àwùjọ mọ́, láìṣàlàyé rẹ̀ síwájú ju ọ̀rọ̀ orísun lọ.
- source_word: διὰ τοῦτο
  choice: ìdí tí mo fi … ni pé
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi gbólóhùn náà tọ́ka sí ète tó tẹ̀ lé e.
- source_word: ἦλθον ἐγὼ
  choice: mo fi wá
  rationale: Ó tú aorist náà sí ìṣe tó ṣẹlẹ̀, ó sì bá ìṣètò ìdí àti ète Yorùbá mu.
- source_word: ἐν ὕδατι
  choice: nínú omi
  rationale: Ó tẹ̀ lé ìtumọ̀ ibi tí ἐν ὕδατι ní ní tààrà, láìyí i sí irinṣẹ́ “pẹ̀lú omi.”
- source_word: βαπτίζων
  choice: ṣe ìrìbọmi
  rationale: “Ṣe ìrìbọmi” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún iṣẹ́ náà, kò sì dá irú ọ̀nà tí a gbà ṣe e láṣẹ ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Ohun tí Johanu ní lọ́kàn nígbà tó sọ pé òun kò mọ Jesu
  choice: “kò mọ̀ ọ́,” èyí tí kò pinnu bóyá àìmọ ẹni ni tàbí àìdá ẹni náà mọ̀
  alternative: “kò dá a mọ̀,” tàbí “kò mọ̀ pé òun ni Mèsáyà”
  rationale: Ẹsẹ náà kò ṣàlàyé irú àìmọ̀ tí Johanu ń sọ. Yíyan ọ̀rọ̀ tó gbòòrò pa ìforígbárí àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ orísun mọ́.
- issue: Bí a ṣe fi Jesu hàn fún Ísírẹ́lì
  choice: “kí a lè fi í hàn,” láìdárúkọ ẹni tó fi í hàn
  alternative: “kí ó lè farahàn”
  rationale: Gíríìkì lo ọ̀rọ̀ ìṣe aláìlórúkọ ní ìṣe-àgbà, nítorí náà a kò sọ ẹni tó ṣe ìfihàn náà ní pàtó; a sì pa ìtumọ̀ “fihàn” mọ́ dípò yíyí rẹ̀ sí “farahàn.”
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. A tún ìṣètò gbólóhùn náà ṣe díẹ̀ sí ọ̀nà “ìdí … ni pé …” kí ó lè ṣàn dáadáa ní Yorùbá, ṣùgbọ́n a pa ìtẹ̀síwájú, ìyàtọ̀, àti gbólóhùn ète inú Gíríìkì mọ́. Àmì ohùn kún àwọn ọ̀rọ̀ níbi tí ó ti yẹ.
