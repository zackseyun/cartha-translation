source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: yo
  text: Ẹni yìí wá gẹ́gẹ́ bí ẹlẹ́rìí[a], kí ó lè jẹ́rìí nípa Ìmọ́lẹ̀, kí gbogbo ènìyàn lè gbàgbọ́ nípasẹ̀ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wá fún ẹ̀rí.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, nípasẹ̀ ẹ̀rí Jòhánù; àwọn kan sì ka “rẹ̀” sí Ìmọ́lẹ̀ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Ẹni yìí
  rationale: Ọ̀rọ̀ atọ́ka yìí ń tọ́ka padà sí Jòhánù pẹ̀lú ìtẹnumọ́. “Ẹni yìí” pa agbára atọ́ka náà mọ́, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: ἦλθεν
  choice: wá
  rationale: Ìtumọ̀ àdánidá àti tààrà fún ἔρχομαι ní àyíká ìtàn yìí ni “wá.”
- source_word: εἰς μαρτυρίαν
  choice: gẹ́gẹ́ bí ẹlẹ́rìí
  rationale: Gbólóhùn náà fi ipa tí Jòhánù wá láti ṣe hàn. “Gẹ́gẹ́ bí ẹlẹ́rìí” jẹ́ Yorùbá òde òní tí ó ṣe kedere, ó sì pa ìtumọ̀ ẹ̀rí mọ́.
- source_word: ἵνα μαρτυρήσῃ
  choice: kí ó lè jẹ́rìí
  rationale: “Kí ó lè” fi ète inú ἵνα hàn, “jẹ́rìí” sì mú ìtumọ̀ fífi ẹ̀rí sọ jáde ní kedere.
- source_word: περὶ τοῦ φωτός
  choice: nípa Ìmọ́lẹ̀
  rationale: “Nípa” bá περί pẹ̀lú ọ̀rọ̀-orúkọ oníbàátan mu. A kọ “Ìmọ́lẹ̀” pẹ̀lú lẹ́tà ńlá nítorí pé ní àyíká yìí ó ń ṣiṣẹ́ bí orúkọ atọ́ka fún ẹni náà, kì í ṣe ìmọ́lẹ̀ ti ara lásán.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: kí gbogbo ènìyàn lè gbàgbọ́
  rationale: Ó pa gbólóhùn ète kejì mọ́. “Gbogbo ènìyàn” sọ ìwọ̀n àìní ààlà πάντες ní Yorùbá àdánidá, “gbàgbọ́” sì jẹ́ ìtumọ̀ tó yẹ fún πιστεύω.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: “Nípasẹ̀ rẹ̀” fi ọ̀nà tàbí aṣojú inú διά pẹ̀lú ọ̀rọ̀ oníbàátan hàn, ó sì pa àìdánilójú ẹni tí “rẹ̀” ń tọ́ka sí mọ́.
theological_decisions:
- issue: Ẹni tí δι’ αὐτοῦ (“nípasẹ̀ rẹ̀”) ń tọ́ka sí
  choice: Ó ṣeé ṣe jù pé “rẹ̀” ń tọ́ka sí Jòhánù, ẹlẹ́rìí náà.
  alternative: Àwọn kan ka “rẹ̀” sí atọ́ka sí Ìmọ́lẹ̀ náà.
  rationale: Jòhánù ni olùṣe pàtàkì nínú ẹsẹ náà, àyíká tó tẹ̀ lé e sì ya á sọ́tọ̀ kúrò lọ́dọ̀ Ìmọ́lẹ̀. Síbẹ̀, arọ́pò-orúkọ Gíríìkì fúnra rẹ̀ kò sọ ẹni tí ó ń tọ́ka sí ní tààrà, nítorí náà a pa àìdánilójú náà mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín, ti òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A tún ìṣètò àwọn gbólóhùn ète méjèèjì inú Gíríìkì ṣe nípasẹ̀ “kí ó lè … kí … lè,” láì mú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí orísun kò sọ wọlé.
