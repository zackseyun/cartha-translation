  text: ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: yo
  text: Fílípì sì jẹ́ ọmọ ìlú Bẹtisáídà[a], ìlú tí Áńdérù àti Pétérù ti wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ìlú Áńdérù àti Pétérù,” ìyẹn ni, ìlú ìbílẹ̀ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: jẹ́ ọmọ ìlú
  rationale: Ìṣe àìpé εἰμί ń sọ ipò tàbí ìpilẹ̀ṣẹ̀ Fílípì. Ní Yorùbá, “jẹ́ ọmọ ìlú” jẹ́ ọ̀nà àdánidá láti sọ pé ibẹ̀ ni ẹni ti wá, ju títúmọ̀ rẹ̀ ní ọ̀rọ̀-ọ̀rọ̀ gẹ́gẹ́ bí “wà láti” lọ.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tó ń tẹ ìtàn síwájú; “sì” bá iṣẹ́ yìí mu láìfi ìtakora líle kún un.
- source_word: Φίλιππος
  choice: Fílípì
  rationale: Orúkọ ẹni ni a kọ ní ìbámu pẹ̀lú ìlò Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: ἀπὸ Βηθσαϊδά
  choice: ọmọ ìlú Bẹtisáídà
  rationale: ἀπό ń tọ́ka sí ibi ìpilẹ̀ṣẹ̀. Gbólóhùn Yorùbá “ọmọ ìlú Bẹtisáídà” sọ ìtumọ̀ náà ní kedere àti lọ́nà àdánidá.
- source_word: ἐκ τῆς πόλεως
  choice: ìlú tí … ti wá
  rationale: πόλις lè túmọ̀ sí ìlú ńlá tàbí ìlú lásán; “ìlú” pa ìwọ̀n yẹn mọ́. ἐκ tún ń fi ibi ìpilẹ̀ṣẹ̀ hàn, èyí tí “tí … ti wá” mú jáde ní Yorùbá.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: Áńdérù àti Pétérù
  rationale: Àwọn orúkọ ẹni ni a kọ ní ìbámu pẹ̀lú ìlò Yorùbá. Ìbáṣepọ̀ genitive pẹ̀lú πόλεως ni a túmọ̀ gẹ́gẹ́ bí ìlú tí àwọn méjèèjì ti wá.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé ni a lò. Àtúnsọ “ọmọ ìlú” àti “tí … ti wá” mú ìtumọ̀ ibi ìpilẹ̀ṣẹ̀ ṣe kedere, nígbà tí àlàyé ìsúnmọ́ sí ìṣètò Gíríìkì wà nínú àlàyé ìsàlẹ̀.
