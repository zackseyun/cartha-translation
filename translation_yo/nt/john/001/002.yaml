id: JHN.1.2
reference: John 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: yo
  text: Òun náà wà ní ìbẹ̀rẹ̀ pẹ̀lú Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni yìí wà ní ìbẹ̀rẹ̀ pẹ̀lú Ọlọ́run.”
    reason: Àṣàyàn yìí túmọ̀ οὗτος ní ọ̀nà tó sún mọ́ ìrísí rẹ̀ gẹ́gẹ́ bí “ẹni yìí,” dípò àrọ́pò-orúkọ “Òun náà.”
lexical_decisions:
- source_word: οὗτος
  choice: Òun náà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka padà sí Ọ̀rọ̀ náà ní ẹsẹ 1. “Òun náà” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtẹnumọ́ àtọ́ka náà hàn, láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἦν
  choice: wà
  rationale: Àìpé ọ̀rọ̀-ìṣe εἰμί sọ ipò tí ó ń bá a lọ; “wà” jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἐν ἀρχῇ
  choice: ní ìbẹ̀rẹ̀
  rationale: Ó pa ìrántí Jẹ́nẹ́sísì 1:1 mọ́, ó sì túmọ̀ gbólóhùn Gíríìkì náà ní ọ̀nà àdánidá àti ọlọ́lá ní Yorùbá.
- source_word: πρὸς
  choice: pẹ̀lú
  rationale: Ní àyíká yìí, πρός sọ ìbáṣepọ̀ àti ìyàtọ̀ ẹni; “pẹ̀lú” pa àwọn méjèèjì mọ́ láìṣàlàyé ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé láti tọ́ka sí Ọlọ́run; kò yẹ kí a ṣe àpilẹ̀kọ Gíríìkì náà ní ọ̀rọ̀ sí ọ̀rọ̀ níbi yìí.
theological_decisions:
- issue: Ẹni tí οὗτος ń tọ́ka sí ní ìbáṣepọ̀ pẹ̀lú Jòhánù 1:1
  choice: A mú un gẹ́gẹ́ bí àtọ́ka padà sí Ọ̀rọ̀ náà, a sì túmọ̀ rẹ̀ sí “Òun náà.”
  alternative: “Ẹni yìí”
  rationale: Ẹsẹ náà tún ìdánimọ̀ àti ìbáṣepọ̀ Ọ̀rọ̀ náà nínú ẹsẹ 1 sọ. “Òun náà” jẹ́ ti ara ẹni, ó sì pa agbára àtọ́ka οὗτος mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Agbára ìtumọ̀ πρὸς τὸν θεόν
  choice: Ìbáṣepọ̀ pẹ̀lú ìyàtọ̀ ẹni, tí a sọ di “pẹ̀lú Ọlọ́run.”
  alternative: “sí ọ̀dọ̀ Ọlọ́run” tàbí “níwájú Ọlọ́run”
  rationale: “Pẹ̀lú Ọlọ́run” jẹ́ ọ̀nà tó ṣe déédé jù lọ láti pa ìsúnmọ́ àti ìyàtọ̀ tí gbólóhùn náà ní mọ́, láìfi ẹ̀ka ìmọ̀ nípa ìwà Ọlọ́run tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá àpéjọ tó bá ìgbà mu, tó níyì, tó sì rọrùn fún òǹkàwé lásán. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìṣọ̀kan ọ̀rọ̀ ìṣáájú Jòhánù mọ́.
