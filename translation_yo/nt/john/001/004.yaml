  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: yo
  text: Nínú rẹ̀ ni ìyè wà, ìyè náà sì ni ìmọ́lẹ̀ àwọn ènìyàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: Nínú rẹ̀
  rationale: Ọ̀rọ̀ ἐν pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ dative túmọ̀ sí ‘nínú rẹ̀.’ Nínú àyíká ọ̀rọ̀ yìí, ‘rẹ̀’ ń tọ́ka sí Ọ̀rọ̀ náà, ẹni tí Jòhánù gbé kalẹ̀ gẹ́gẹ́ bí ẹni, kì í ṣe ohun aláìlẹ́mìí.
- source_word: ζωὴ
  choice: ìyè
  rationale: ‘Ìyè’ jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún ζωή, ó sì pa ìjìnlẹ̀ ìtumọ̀ rẹ̀ nínú Jòhánù mọ́ láìfi ‘ìyè àìnípẹ̀kun’ kún un níbi tí Gíríìkì kò ti sọ bẹ́ẹ̀.
- source_word: ἦν
  choice: wà
  rationale: ‘Wà’ mú ìṣe àìpé ἦν jáde lọ́nà àdánidá, ó sì bá ìṣàn ọ̀rọ̀ àkọ́sọ Jòhánù mu.
- source_word: ἡ ζωὴ
  choice: ìyè náà
  rationale: ‘Náà’ fi hàn pé ìyè tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ni gbólóhùn kejì ń tọ́ka sí.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀
  rationale: ‘Ìmọ́lẹ̀’ ni ìtumọ̀ tó ṣe déédé fún φῶς, ó sì pa àwòrán pàtàkì tí Jòhánù ń lò mọ́.
- source_word: τῶν ἀνθρώπων
  choice: aráyé
  rationale: Níhìn-ín ἀνθρώπων ń tọ́ka sí gbogbo ènìyàn lápapọ̀. ‘Aráyé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kíkún, tí kò ní ìdíwọ̀ akọ tàbí abo, ó sì pa ìtumọ̀ genitive náà mọ́ nínú ‘ìmọ́lẹ̀ aráyé.’
theological_decisions:
- issue: Ohun tí αὐτῷ ń tọ́ka sí àti bóyá ó jẹ́ ẹni
  choice: A túmọ̀ ọ́ ní ti ẹni gẹ́gẹ́ bí ‘rẹ̀,’ ó ń tọ́ka sí Ọ̀rọ̀ náà.
  alternative: A lè lò ó fún ohun aláìlẹ́mìí bí a bá ka λόγος sí èrò lásán.
  rationale: Àyíká Jòhánù 1 gbé Ọ̀rọ̀ náà kalẹ̀ ní ọ̀nà ti ẹni, ṣùgbọ́n Yorùbá kò fi akọ tàbí abo hàn nínú ‘rẹ̀’; èyí pa ìtọ́kasí ti ẹni mọ́ láìfi ohun tí ẹsẹ yìí kò sọ kún un.
- issue: Ìtumọ̀ gbogbogbò ti ἀνθρώπων
  choice: ‘Aráyé,’ tó túmọ̀ sí gbogbo ènìyàn.
  alternative: ‘Àwọn ènìyàn’ tàbí ‘ọmọ aráyé.’
  rationale: Ọ̀pọ̀ akọ nínú Gíríìkì níhìn-ín jẹ́ àpapọ̀ fún ẹ̀dá ènìyàn, kì í ṣe fún àwọn ọkùnrin nìkan. ‘Aráyé’ sọ ìtumọ̀ yẹn jáde ní Yorùbá tó mọ́gbọ́n dání.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn kíkún níbi tó yẹ. A yan ‘ìyè’ àti ‘ìmọ́lẹ̀’ láti pa ọ̀rọ̀ àwòrán àti ìwúwo ẹ̀kọ́ inú àkọ́sọ mọ́; ‘ìmọ́lẹ̀ aráyé’ jẹ́ kúkúrú, àdánidá, ó sì ṣàfihàn gbogbo ènìyàn.
