  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ pàtàkì mẹ́ta mọ́: ẹni náà wà nínú ayé; ayé wá sí ìwà nípasẹ̀ rẹ̀; ayé kò mọ̀ ọ́. Síbẹ̀, “ṣùgbọ́n” túmọ̀ καί gẹ́gẹ́ bí ìyàtọ̀ tàbí ìtakora, níbi tí ọ̀rọ̀ Gíríìkì ti lò καί lásán ní gbogbo àwọn gbólóhùn mẹ́ta. Ó yẹ kí a túmọ̀ ọ́ sí “sì”/“àti” láti má ṣe fi ìtakora tí kò wà nínú ọ̀rọ̀ ìpilẹ̀ kún un.'
