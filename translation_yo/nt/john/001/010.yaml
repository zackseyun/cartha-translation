id: JHN.1.10
reference: John 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: yo
  text: Ó wà nínú ayé, ayé sì wá sí ìwà nípasẹ̀ rẹ̀[a], ayé kò sì mọ̀ ọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “a dá ayé nípasẹ̀ rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí “wá sí ìwà” tàbí “bẹ̀rẹ̀ sí í wà.”
    reason: lexical_alternative
  - marker: b
    text: “Kò mọ̀ ọ́” tún lè ní ìtumọ̀ pé “kò dá a mọ̀” tàbí “kò gbà á sí ẹni tí ó jẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún κόσμος. Lílo rẹ̀ ní gbogbo ibi mẹ́tẹ̀ẹ̀ta pa àtúnsọ Gíríìkì mọ́, ó sì jẹ́ kí ìtumọ̀ náà lè kan gbogbo ẹ̀dá tàbí àwọn ènìyàn inú ayé láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἦν
  choice: wà
  rationale: “Wà” sọ ìwàláàyè àti wíwà rẹ̀ nínú ayé ní ọ̀nà tó rọrùn, láìfi èrò ìmọ̀-ìjìnlẹ̀ míì kún ọ̀rọ̀ náà.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: “Nípasẹ̀ rẹ̀” fi ipa alárinà tàbí ọ̀nà tí ayé gbà wá sí ìwà hàn, ó sì bá διά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive mu.
- source_word: ἐγένετο
  choice: wá sí ìwà
  rationale: “Wá sí ìwà” fi hàn pé ayé bẹ̀rẹ̀ sí í wà. Ó tún pa ìyàtọ̀ tó wà láàárín ἦν (“wà”) àti ἐγένετο (“wá sí ìwà”) mọ́.
- source_word: ἔγνω
  choice: mọ̀
  rationale: “Mọ̀” ni ìtumọ̀ tààrà fún γινώσκω, ó sì lè gbé èrò mímọ ẹni, dídámọ̀ ẹni, àti gbígba ẹni sílẹ̀ gẹ́gẹ́ bí ẹni tí ó jẹ́ láìyanju ìtumọ̀ náà sí ọ̀nà kan ṣoṣo.
- source_word: αὐτόν / αὐτοῦ
  choice: ọ́ / rẹ̀
  rationale: Àwọn arọ́pò-orúkọ wọ̀nyí tọ́ka sí Ọ̀rọ̀ náà gẹ́gẹ́ bí ẹni, kì í ṣe gẹ́gẹ́ bí ohun aláìlẹ́mìí.
theological_decisions:
- issue: Ẹni tí kókó-ọ̀rọ̀ tí a kò tún dárúkọ ń tọ́ka sí
  choice: Lo “Ó,” kí ó tọ́ka sí Ọ̀rọ̀ náà gẹ́gẹ́ bí ẹni.
  alternative: Lo arọ́pò-orúkọ ohun aláìlẹ́mìí bí a bá ka “Ọ̀rọ̀” gẹ́gẹ́ bí èrò lásán.
  rationale: Àyíká Johanu 1:1–9 ti ń sọ nípa Ọ̀rọ̀ náà gẹ́gẹ́ bí ẹni. “Ó” pa ìtọ́kasí ti ara ẹni náà mọ́ láìfi ẹ̀kọ́ míì kún un.
- issue: Ìyàtọ̀ láàárín wíwà Ọ̀rọ̀ náà àti bí ayé ṣe bẹ̀rẹ̀ sí í wà
  choice: Túmọ̀ ἐγένετο sí “wá sí ìwà” lẹ́yìn tí a túmọ̀ ἦν sí “wà.”
  alternative: “A dá ayé nípasẹ̀ rẹ̀.”
  rationale: 'Ìyàn yìí pa ìyàtọ̀ inú ọ̀rọ̀ Gíríìkì mọ́: ẹni náà “wà,” ṣùgbọ́n ayé “wá sí ìwà” nípasẹ̀ rẹ̀.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A pa àtúnsọ “ayé” mọ́, a sì lo “wá sí ìwà” láti fi ìyàtọ̀ ọ̀rọ̀-ìṣe Gíríìkì hàn. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
