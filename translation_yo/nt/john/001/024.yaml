  source_fidelity: Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ἀπεσταλμένοι ἦσαν (‘àwọn tí a ti rán’) àti ἐκ (‘láti ọ̀dọ̀’) mọ́. Ṣùgbọ́n ọ̀rọ̀ náà ‘wá láti’ lè túmọ̀ sí ìṣe wíwá/ìdédé, níbi tí ọ̀rọ̀ Gíríìkì ti ń sọ ipò tàbí orísun àwọn ẹni tí a rán, kì í ṣe ìṣe wíwá wọn.
