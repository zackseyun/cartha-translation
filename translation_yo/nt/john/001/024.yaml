  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: yo
  text: Àwọn tí a rán náà sì jẹ́ láti ọ̀dọ̀ àwọn Farisí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn Farisí ni ó rán wọn.” Ní ìtumọ̀ gangan, èdè Gíríìkì fi hàn pé wọ́n jẹ́ láti ọ̀dọ̀ àwọn Farisí.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Asọ̀pọ̀ ìtàn tó wọ́pọ̀ ní Yorùbá; ó ń tẹ̀ síwájú láìfi ìtumọ̀ tuntun kún un.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: àwọn tí a rán náà
  rationale: Ó fi hàn pé wọ́n ti rán àwọn ọkùnrin náà, ó sì yẹ fún ìṣàkóso gbólóhùn Yorùbá láìsọ wọ́n di ‘aṣojú’ lọ́nà tí ó lè túmọ̀ ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: ἐκ
  choice: wá láti ọ̀dọ̀
  rationale: Ó pa ìtumọ̀ orísun tàbí ibi tí wọ́n ti wá mọ́; kì í fi dandan sọ pé àwọn Farisí gan-an ni olùránṣẹ́.
- source_word: τῶν Φαρισαίων
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ náà ní Yorùbá, pẹ̀lú ‘àwọn’ láti fi ọ̀pọ̀ hàn.
theological_decisions:
- issue: Ìbáṣepọ̀ àwọn tí a rán pẹ̀lú àwọn Farisí
  choice: Wọ́n wá láti ọ̀dọ̀ àwọn Farisí, èyí tó tẹnumọ́ orísun wọn.
  alternative: Àwọn Farisí ni ó rán wọn, èyí tó tẹnumọ́ olùṣe ìránṣẹ́.
  rationale: ἐκ pẹ̀lú ọ̀rọ̀ inú genitive sábà ń tọ́ka sí orísun ju olùṣe lọ. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé fi àṣàyàn olùṣe hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní; a lo ‘wá láti ọ̀dọ̀’ láti pa àìdánilójú tó wà láàárín orísun àti olùránṣẹ́ mọ́.
