source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: yo
  text: Jòhánù dá wọn lóhùn pé, “Èmi ń ṣe ìrìbọmi nínú omi. Ẹnì kan ń dúró láàárín yín, ẹni tí ẹ̀yin kò mọ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: Jòhánù dá wọn lóhùn pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Jòhánù fèsì, nígbà tí ‘pé’ sì ṣe iṣẹ́ λέγων láì mú kí gbólóhùn náà wuwo.
- source_word: βαπτίζω
  choice: ń ṣe ìrìbọmi
  rationale: ‘Ṣe ìrìbọmi’ ni ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ dáadáa; kò sì fi ọ̀nà ìṣe ìrìbọmi kan pàtó kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: ἐν ὕδατι
  choice: nínú omi
  rationale: ‘Nínú omi’ pa ìtumọ̀ ἐν mọ́ ní ọ̀nà tí ó ṣe kedere, bí ó tilẹ̀ jẹ́ pé ‘pẹ̀lú omi’ tún ṣeé lò ní Yorùbá.
- source_word: μέσος ὑμῶν
  choice: láàárín yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún wíwà ní àárín ẹgbẹ́ àwọn ẹni tí a ń bá sọ̀rọ̀.
- source_word: ἕστηκεν
  choice: dúró
  rationale: Ìṣe yìí fi ipò tí ó wà nísinsin yìí hàn, ó sì bá agbára perfect Gíríìkì mu láì fi ọ̀rọ̀ àfikún tí kò ṣe pàtàkì sí i.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: ẹni tí ẹ̀yin kò mọ̀
  rationale: ‘Mọ̀’ pa àìmọ̀ ẹni náà mọ́ láì dín ìtumọ̀ rẹ̀ kù sí àìdámọ̀ ojú nìkan; ‘ẹ̀yin’ tẹnumọ́ ὑμεῖς.
theological_decisions:
- issue: Ta ni ẹni tí ó dúró láàárín wọn?
  choice: Ẹnì kan ... ẹni tí
  alternative: Mèsáyà; òun
  rationale: Ẹsẹ̀ yìí kò dárúkọ ẹni náà. Yíyọ̀nda rẹ̀ gẹ́gẹ́ bí ẹni tí a kò tíì dárúkọ pa ìfọ̀kànsìn àti ìdádúró ìtàn náà mọ́, bí ó tilẹ̀ jẹ́ pé àyíká tó gbòòrò ń tọ́ka sí Jésù.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Jòhánù’ àti ‘ìrìbọmi’ jẹ́ àwọn ọ̀rọ̀ tí àwọn òǹkàwé Bíbélì Yorùbá mọ̀, ṣùgbọ́n ìṣètò gbólóhùn náà jẹ́ àdánidá fún òǹkàwé òde òní. Kò sí àlàyé ìsàlẹ̀ ojú ewé nítorí àṣàyàn Gẹ̀ẹ́sì ‘in your midst’ kò yà ní ìtumọ̀ kúrò nínú ‘among you,’ ‘láàárín yín’ sì bo méjèèjì dáadáa.
