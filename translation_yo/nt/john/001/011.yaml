id: JHN.1.11
reference: John 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: yo
  text: Ó wá sí ohun tí ó jẹ́ tirẹ̀[a], àwọn ènìyàn tirẹ̀ kò sì tẹ́wọ́ gbà á[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó wá sí ibi tirẹ̀,” tàbí “Ó wá sí ohun ìní tirẹ̀.” Nínú èdè Gíríìkì, gbólóhùn àkọ́kọ́ tọ́ka sí ohun tàbí ibi, ó sì yàtọ̀ sí “àwọn ènìyàn tirẹ̀” tó tẹ̀ lé e.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kò gbà á,” tàbí “kò kí i káàbọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: sí ohun tí í ṣe tirẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ nọ́ńbà aláìní akọ tàbí abo, ó sì ń tọ́ka sí ohun, ibi, tàbí agbègbè tí ó jẹ́ tirẹ̀, kì í ṣe tààrà sí àwọn ènìyàn. Gbólóhùn Yorùbá yìí pa ìtumọ̀ náà mọ́ láì fi tipátipá sọ pé ilé, ilẹ̀, tàbí ohun ìní nìkan ni.
- source_word: ἦλθεν
  choice: Ó wá
  rationale: Ìtumọ̀ tààrà, tó sì jẹ́ ọ̀nà àdánidá láti sọ ìṣípòpadà ẹni kan sí ibi kan ní Yorùbá.
- source_word: οἱ ἴδιοι
  choice: àwọn ènìyàn tirẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì kejì jẹ́ ọ̀pọ̀ akọ, ó ń tọ́ka sí àwọn ènìyàn. Fífi “àwọn ènìyàn” kún un mú ìyàtọ̀ rẹ̀ sí τὰ ἴδια hàn kedere ní Yorùbá.
- source_word: παρέλαβον
  choice: kò sì gbà á
  rationale: “Gbà” lè túmọ̀ sí kí ènìyàn gba ẹnì kan, tẹ́wọ́ gbà á, tàbí fọwọ́ sí i; nítorí náà, ó pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì dín in kù sí àlejò ṣíṣe nìkan.
- source_word: αὐτόν
  choice: á
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Ọ̀rọ̀ náà nínú àyíká ẹsẹ̀, “á” sì ni àkópọ̀ arọ́pò-orúkọ ẹni kẹta akọ lẹ́yìn ọ̀rọ̀-ìṣe “gbà.”
theological_decisions:
- issue: Ohun tí lílo ἴδιος lẹ́ẹ̀mejì ń tọ́ka sí àti ìyàtọ̀ inú rẹ̀
  choice: Gbólóhùn àkọ́kọ́ ń tọ́ka sí ohun tàbí agbègbè tí ó jẹ́ tirẹ̀; èkejì ń tọ́ka sí àwọn ènìyàn tirẹ̀.
  alternative: A lè ka àwọn méjèèjì sí ìtọ́ka sí àwọn ènìyàn tirẹ̀, tàbí kí a lóye àkọ́kọ́ ní pàtó gẹ́gẹ́ bí ilé tàbí agbo ilé tirẹ̀.
  rationale: Ìyípadà Gíríìkì láti ọ̀pọ̀ aláìní akọ tàbí abo (τὰ ἴδια) sí ọ̀pọ̀ akọ (οἱ ἴδιοι) fi hàn pé ìyàtọ̀ kan wà láàárín ohun/agbègbè tirẹ̀ àti àwọn ènìyàn tirẹ̀. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́, kò sì fi dandan yan ilé, ilẹ̀, tàbí ohun ìní gẹ́gẹ́ bí ohun kan ṣoṣo tí àkọ́kọ́ túmọ̀ sí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ohun tí í ṣe tirẹ̀” ni a lò láti yẹra fún dídín τὰ ἴδια kù sí ilé tàbí ilẹ̀ kan pàtó; “àwọn ènìyàn tirẹ̀” sì mú ìtọ́ka sí ènìyàn nínú οἱ ἴδιοι hàn gbangba. Àwọn àmì ohùn àti àmì ìsàlẹ̀ lẹ́tà ni a lò níbi tó bá yẹ.
