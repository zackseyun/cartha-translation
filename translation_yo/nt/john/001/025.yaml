id: JHN.1.25
reference: John 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: yo
  text: Wọ́n sì béèrè lọ́wọ́ rẹ̀, wọ́n sì wí fún un pé, “Èé ṣe, nígbà náà, tí ìwọ fi ń ṣe ìrìbọmi, bí ìwọ kì í ṣe Mèsáyà,[a] tàbí Èlíjà, tàbí Wòlíì náà?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Χριστός (Christos), àkọlé fún ẹni tí a fi àmì òróró yàn, ẹni tí àwọn Júù ń retí.
    reason: alternative_rendering
  - marker: b
    text: Ó ṣeé ṣe kí “Wòlíì náà” tọ́ka sí wòlíì kan bí Mósè, ẹni tí a ṣèlérí pé yóò wá; wo Diutarónómì 18:15.
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wọ́n béèrè lọ́wọ́ rẹ̀
  rationale: Ó túmọ̀ sí pé wọ́n béèrè ìbéèrè lọ́wọ́ rẹ̀; ọ̀rọ̀ yìí jẹ́ ti àdánidá, kò sì fi ìkọlù kún ohun tí Gíríìkì sọ.
- source_word: εἶπαν αὐτῷ
  choice: wọ́n wí fún un pé
  rationale: A pa àwọn ọ̀rọ̀-ìṣe méjèèjì, ‘béèrè’ àti ‘wí,’ mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: Τί οὖν
  choice: Èé ṣe, nígbà náà
  rationale: Nínú àṣà ọ̀rọ̀ yìí, τί béèrè ìdí, οὖν sì so ìbéèrè náà mọ́ ohun tí a ti sọ ṣáájú.
- source_word: βαπτίζεις
  choice: ìwọ fi ń ṣe ìrìbọmi
  rationale: Àmì ‘ń’ fi hàn pé iṣẹ́ tí ó ń lọ lọ́wọ́ ni wọ́n ń bi í léèrè nípa rẹ̀.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Àkọlé ni Χριστός níbí; ‘Mèsáyà’ pa ìtumọ̀ Júù ti ẹni àmì-òróró tí a ń retí mọ́.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: Orúkọ náà ni a ṣe ní ìbámu pẹ̀lú ìlò Yorùbá tó wọ́pọ̀ nínú Bíbélì.
- source_word: ὁ προφήτης
  choice: Ànábì náà
  rationale: Atọ́ka náà fi hàn pé ẹni pàtó kan tí a mọ̀, tí a sì ń retí, ni a ń tọ́ka sí, kì í ṣe ànábì lásán.
- source_word: οὐδὲ ... οὐδὲ
  choice: tàbí ... tàbí
  rationale: Lẹ́yìn gbólóhùn àìjẹ́wọ́ ‘kì í bá ṣe,’ ‘tàbí ... tàbí’ jẹ́ ọ̀nà Yorùbá àdánidá láti ṣètò àwọn yíyan mẹ́tẹ̀ẹ̀ta.
theological_decisions:
- issue: Bí a ṣe yẹ kí a túmọ̀ Χριστός nínú ìbéèrè ìdánimọ̀ yìí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí àkọlé ẹni tí àwọn Júù ń retí, kì í ṣe gẹ́gẹ́ bí orúkọ ara ẹni.
- issue: Bóyá ὁ προφήτης ń tọ́ka sí ànábì pàtó kan
  choice: Ànábì náà
  alternative: ànábì kan
  rationale: Atọ́ka ὁ àti àyíká ọ̀rọ̀ fi ẹni tí a mọ̀ nínú ìretí àwọn ènìyàn hàn; ó ṣeé ṣe kí ó jẹ́ ànábì bí Mósè, ṣùgbọ́n àlàyé yẹn ni a fi sínú àlàyé ìsàlẹ̀ dípò fífi í sínú ẹsẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé ni a lò. A pa ìtẹ̀síwájú àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì mọ́, a sì lo ‘ìrìbọmi’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ dáadáa. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
