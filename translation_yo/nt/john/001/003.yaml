  source_fidelity: Ìtumọ̀ náà ní ìfẹ́ láti tẹ̀lé SBLGNT nípa sísọ ὃ γέγονεν mọ́ ẹsẹ̀ 3, ó sì pa ìtumọ̀ ‘nípasẹ̀ rẹ̀,’ ‘láìsí rẹ̀,’ àti ìtẹnumọ́ ‘kò tilẹ̀ sí ohun kan’ mọ́. Ṣùgbọ́n ìpele ìkẹyìn nínú ìtumọ̀ àkọ́kọ́ (‘nínú ohun gbogbo...’) kò tọ́ gẹ́gẹ́ bí ọ̀nà ìsopọ̀ gbolohun Yorùbá, ó sì lè dà bí ẹni pé ohun kan wà ‘nínú’ ohun gbogbo. Àtúnṣe náà jẹ́ kí ὃ γέγονεν ṣàlàyé gbogbo ohun tí ó ti wá sí ìwàláàyè, bí ó ti wà nínú ìpín gírámà SBLGNT.
  naturalness: ‘ni ó ti ipasẹ̀ rẹ̀’ jẹ́ àṣìṣe ìkọ̀wé/gírámà; ‘wá sí ìwàláàyè nípasẹ̀ rẹ̀’ jẹ́ Yorùbá boṣewa tó rọrùn, tó sì dáa nínú àkọsílẹ̀ ọlọ́wọ̀. Àtúnṣe ìpín kejì dín ìdàrúdàpọ̀ kù bí ó tilẹ̀ jẹ́ pé àtúnlò ‘wá sí ìwàláàyè’ jẹ́ dandan láti fi ìtẹnumọ́ àti ìsopọ̀ gbolohun Gíríìkì hàn.
  terminology: ‘Ohun gbogbo,’ ‘nípasẹ̀ rẹ̀,’ ‘wá sí ìwàláàyè,’ àti ‘láìsí rẹ̀’ jẹ́ àwọn yíyàn tó péye fún πάντα, δι’ αὐτοῦ, ἐγένετο, àti χωρὶς αὐτοῦ. ‘Kò tilẹ̀ sí ohun kan’ ń pa agbára οὐδὲ ἕν mọ́. Àlàyé ìsàlẹ̀ náà ń pa ìṣeeṣe ìpínrọ̀ míràn mọ́ láì yanju àìdájú ìpilẹ̀ṣẹ̀ náà.
