id: JHN.1.3
reference: John 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: yo
  text: Ohun gbogbo wá sí ìwàláàyè nípasẹ̀ rẹ̀,[a] láìsí rẹ̀, kò tilẹ̀ sí ohun kan nínú gbogbo ohun tí ó ti wá sí ìwàláàyè tí ó wá sí ìwàláàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí a bá fi gbólóhùn ìkẹyìn bẹ̀rẹ̀ ẹsẹ̀ 4: “Ohun tí ó wá sí ìwàláàyè nínú rẹ̀ ni ìyè.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Ohun gbogbo
  rationale: Ọ̀rọ̀ yìí ní agbára tí ó yí gbogbo ohun tí a dá ká; “ohun gbogbo” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ àpapọ̀ náà mọ́.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: διά pẹ̀lú genitive ń tọ́ka sí ẹni tàbí ọ̀nà tí ohun fi ṣẹlẹ̀; “nípasẹ̀ rẹ̀” pa ìtumọ̀ yìí mọ́ láì sọ ọ́ di pé òun ni orísun ìkẹyìn ní tààràtà.
- source_word: ἐγένετο
  choice: wá sí ìwàláàyè
  rationale: γίνομαι níbí túmọ̀ sí wíwá sí ipò jíjẹ́ tàbí sí ìwàláàyè, kì í ṣe iṣẹ́ ṣíṣe ohun kan lásán.
- source_word: χωρὶς αὐτοῦ
  choice: láìsí rẹ̀
  rationale: χωρίς fi ìyapa tàbí àìsí hàn; “láìsí rẹ̀” jẹ́ gbolohun Yorùbá tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ náà mu.
- source_word: οὐδὲ ἕν
  choice: kò tilẹ̀ sí ohun kan
  rationale: “Tilẹ̀” ń mú ìtẹnumọ́ οὐδέ jáde, “ohun kan” sì pa neuter singular ἕν mọ́.
- source_word: ὃ γέγονεν
  choice: nínú ohun gbogbo tí ó ti wá sí ìwàláàyè
  rationale: A so gbólóhùn náà mọ́ ẹsẹ̀ 3 gẹ́gẹ́ bí ìlànà àmì ìdákẹ́jẹ SBLGNT; perfect γέγονεν ni “ó ti wá” fi iṣẹ́ tí ó ṣẹlẹ̀ tí àbájáde rẹ̀ sì dúró hàn.
theological_decisions:
- issue: Ìbáṣepọ̀ gbólóhùn ìkẹyìn ὃ γέγονεν
  choice: 'A so ó mọ́ ẹsẹ̀ 3: “nínú ohun gbogbo tí ó ti wá sí ìwàláàyè.”'
  alternative: 'A lè bẹ̀rẹ̀ ẹsẹ̀ 4 pẹ̀lú rẹ̀ pé: “Ohun tí ó wá sí ìwàláàyè nínú rẹ̀ ni ìyè.”'
  rationale: Àwọn ìwé àfọwọ́kọ Gíríìkì àkọ́kọ́ kò ní àmì ìdákẹ́jẹ ìpilẹ̀ṣẹ̀, nítorí náà, ọ̀nà méjèèjì ṣeé ṣe. Ọ̀rọ̀ pàtàkì tẹ̀lé àmì ìdákẹ́jẹ SBLGNT, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn kejì mọ́ láì mú ìdánilójú ẹ̀kọ́ ìgbàgbọ́ tí orísun kò fi lélẹ̀ wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹnumọ́ àti àìdájú gírámà Gíríìkì mọ́.
