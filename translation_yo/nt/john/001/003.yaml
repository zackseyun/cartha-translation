revisions:
- from: Ohun gbogbo ni ó ti ipasẹ̀ rẹ̀ wá sí ìwàláàyè,[a] láìsí rẹ̀, kò tilẹ̀ sí ohun kan tí ó wá sí ìwàláàyè nínú ohun gbogbo tí ó ti wá sí ìwàláàyè.
  to: Ohun gbogbo wá sí ìwàláàyè nípasẹ̀ rẹ̀,[a] láìsí rẹ̀, kò tilẹ̀ sí ohun kan nínú gbogbo ohun tí ó ti wá sí ìwàláàyè tí ó wá sí ìwàláàyè.
  rationale: A ṣàtúnṣe àṣìṣe ‘ni ó ti ipasẹ̀’ sí ‘nípasẹ̀,’ a sì tún ìpín ìkẹyìn ṣe kí ó lè jẹ́ gbolohun ìdíwọ́ tó ń ṣàlàyé gbogbo ohun tí ó ti wá sí ìwàláàyè. Èyí pa ìpínrọ̀ SBLGNT mọ́, ó sì jẹ́ Yorùbá adayeba ju ìtumọ̀ àkọ́kọ́ lọ. Àlàyé ìsàlẹ̀, àmì rẹ̀, àti ìtumọ̀ àṣàyàn rẹ̀ wà ní ipò tó tọ́.
