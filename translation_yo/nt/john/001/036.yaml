  text: καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: yo
  text: Ó sì tẹjú mọ́ Jesu tí ń rìn, ó wí pé, “Wò ó, Ọ̀dọ́-àgùntàn Ọlọ́run!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: tẹjú mọ́
  rationale: Ó túmọ̀ sí wíwo ẹnì kan dáadáa tàbí fífi ojú sí i, kì í ṣe wíwo lásán.
- source_word: περιπατοῦντι
  choice: bí ó ti ń rìn
  rationale: Ó fi hàn pé Jesu wà ní ipò tí ó ń rìn nígbà tí Johanu wo ọ́.
- source_word: Ἴδε
  choice: Wò ó
  rationale: Àṣẹ kan ni láti fa àfiyèsí àwọn olùgbọ́ sí Jesu; èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá “Look/Behold” mu.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Ọ̀dọ́ Àgùntàn Ọlọ́run
  rationale: Ó pa àwòrán ọ̀dọ́ àgùntàn mọ́, ó sì jẹ́ kí ìbáṣepọ̀ genitive ‘ti Ọlọ́run’ dúró láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- source_word: λέγει
  choice: ó wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí ìtàn, àsìkò àtijọ́ ni Yorùbá àdánidá ń lò nínú ìtàn irú èyí.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú ‘τοῦ θεοῦ’
  choice: Ọ̀dọ́ Àgùntàn Ọlọ́run
  alternative: Ọ̀dọ́ Àgùntàn láti ọ̀dọ̀ Ọlọ́run / Ọ̀dọ́ Àgùntàn tí Ọlọ́run ní
  rationale: Àkópọ̀ ọ̀rọ̀ yìí pa àìdánilójú tó wà nínú Gíríìkì mọ́, láìpinnu bóyá ó túmọ̀ sí ohun-ìní, orísun, tàbí iṣẹ́ tí Ọlọ́run yàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lásán. A lo “Jesu” gẹ́gẹ́ bí ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
