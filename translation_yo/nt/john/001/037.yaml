source:
  edition: SBLGNT
  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ méjèèjì gbọ́ ọ́ bí ó ti ń sọ̀rọ̀,[a] wọ́n sì tẹ̀ lé Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rẹ̀” àti “ó” tọ́ka sí Jòhánù Onítẹ̀bọmi; wo ẹsẹ̀ 35–36.
    reason: Láti jẹ́ kí ẹni tí aṣojú-ọrọ̀ náà tọ́ka sí hàn kedere nínú àyíká náà.
lexical_decisions:
- source_word: ἤκουσαν
  choice: gbọ́
  rationale: Ọ̀rọ̀ náà jẹ́ aorist, ó sì sọ ìṣẹ̀lẹ̀ gbígbọ́ ohun tí a sọ ní ṣókí; “gbọ́” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ níbí.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀ méjèèjì
  rationale: Àpólà náà túmọ̀ sí àwọn ọmọ-ẹ̀yìn méjì tí í ṣe tirẹ̀; nínú àyíká ẹsẹ̀ 35–36, “rẹ̀” tọ́ka sí Jòhánù Onítẹ̀bọmi. “Méjèèjì” jẹ́ ọ̀nà àdánidá láti fi hàn pé àwọn méjì náà lápapọ̀ ni.
- source_word: λαλοῦντος
  choice: ohun tí ó sọ
  rationale: Participle yìí ní í ṣe pẹ̀lú ẹni tí wọ́n gbọ́ nígbà tó ń sọ̀rọ̀. Yorùbá àdánidá sábà máa ń sọ pé “gbọ́ ohun tí ó sọ”; ó pa ìtumọ̀ iṣẹ́ sísọ mọ́ láìfi àfikún sí i.
- source_word: ἠκολούθησαν
  choice: tẹ̀ lé
  rationale: “Tẹ̀ lé” lè túmọ̀ sí lílọ lẹ́yìn ẹnì kan ní ti ara, ó sì tún lè ní ìró ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn; èyí pa ìpele méjèèjì tí ọ̀rọ̀ Gíríìkì lè ní mọ́.
- source_word: τῷ Ἰησοῦ
  choice: Jésù
  rationale: Dative náà ni ẹni tí wọ́n tẹ̀ lé. Ìlò Yorùbá àdánidá ni “tẹ̀ lé Jésù,” láìsí preposition mìíràn.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (“rẹ̀”) ń tọ́ka sí nínú οἱ δύο μαθηταὶ αὐτοῦ
  choice: A mú un gẹ́gẹ́ bí ẹni tó ń tọ́ka sí Jòhánù Onítẹ̀bọmi.
  alternative: A lè fi “àwọn ọmọ-ẹ̀yìn méjèèjì” sílẹ̀, kí ẹni tí wọ́n jẹ́ tirẹ̀ hàn láti inú àyíká nìkan.
  rationale: Ẹsẹ̀ 35–36 fi Jòhánù hàn pẹ̀lú méjì lára àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì sọ̀rọ̀ nípa Jésù. Nítorí náà, “rẹ̀” nínú ẹsẹ̀ 37 ń tọ́ka sí Jòhánù, kì í ṣe Jésù; àlàyé ìsàlẹ̀ ojú ìwé mú èyí ṣe kedere láìṣe àfikún orúkọ sínú ọ̀rọ̀ ẹsẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé òde òní. A lo “tẹ̀ lé” láti pa ìtumọ̀ lílọ lẹ́yìn Jésù àti ìró jíjẹ́ ọmọ-ẹ̀yìn mọ́.
