id: JHN.1.42
reference: John 1:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: yo
  text: Ó mú un lọ sí ọ̀dọ̀ Jésù. Jésù tẹjú mọ́ ọn, ó sì wí pé, “Ìwọ ni Símónì ọmọ Jòhánù[a]; a ó pè ọ́ ní Kéfà” (èyí tí a túmọ̀ sí Pétérù).[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘Jónà’ dípò ‘Jòhánù’; ‘Jòhánù’ ni ọ̀rọ̀ SBLGNT.
    reason: textual_variant
  - marker: b
    text: Kéfà ni orúkọ Sémítíkì tí ó bá Pétérù mu; ìtumọ̀ rẹ̀ ni ‘àpáta’ tàbí ‘òkúta.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Ó mú un wá sọ́dọ̀ Jésù
  rationale: Ọ̀rọ̀ yìí fi hàn pé ó mú ẹni náà dé ọ̀dọ̀ Jésù. ‘Mú un wá sọ́dọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ ìṣípò lọ sí ọ̀dọ̀ ẹni kan mọ́.
- source_word: ἐμβλέψας αὐτῷ
  choice: tẹjú mọ́ ọn
  rationale: ἐμβλέπω lè tọ́ka sí wíwo ẹni pẹ̀lú àkíyèsí, kì í ṣe wíwo lásán. ‘Tẹjú mọ́ ọn’ jẹ́ kedere, ó sì bá agbára ọ̀rọ̀ Gíríìkì mu láìṣe àfikún ìtumọ̀.
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: Ìwọ ni Símónì ọmọ Jòhánù
  rationale: ‘Ìwọ ni’ pa ìtẹnumọ́ arọ́pò-orúkọ σὺ mọ́, ‘ọmọ Jòhánù’ sì jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá fún ‘ọmọkùnrin Jòhánù.’
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: Kéfà ni a ó máa pè ọ́
  rationale: Ìtumọ̀ yìí pa ọjọ́ iwájú àti ìṣe àìtọ́ka ẹni ti κληθήσῃ mọ́. A kọ Κηφᾶς gẹ́gẹ́ bí orúkọ ẹni, ‘Kéfà.’
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: èyí tí a túmọ̀ sí Pétérù
  rationale: Ó pa àlàyé inú akọmọ́ ti Gíríìkì mọ́, ó sì kọ Πέτρος gẹ́gẹ́ bí orúkọ ẹni, ‘Pétérù,’ dípò yíyanjú ìtumọ̀ rẹ̀ sínú àkọsílẹ̀ pàtàkì.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àlàyé Κηφᾶς/Πέτρος
  choice: 'Pa àwọn méjèèjì mọ́ gẹ́gẹ́ bí orúkọ ẹni: ‘Kéfà’ àti ‘Pétérù.’'
  alternative: Túmọ̀ orúkọ náà ní tààràtà sí ‘Àpáta’ tàbí ‘Òkúta.’
  rationale: Ẹsẹ̀ náà ń sọ nípa orúkọ tí Jésù yóò fi pe Símónì, Gíríìkì náà sì fi orúkọ Gíríìkì ṣàlàyé orúkọ Sémítíkì. Pípa wọn mọ́ gẹ́gẹ́ bí orúkọ kò fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ náà; àlàyé ìtumọ̀ ‘àpáta’ tàbí ‘òkúta’ wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo èdè Yorùbá òde òní tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Tẹjú mọ́ ọn’ fi agbára wíwo náà hàn; ‘a ó máa pè ọ́’ sì jẹ́ ìsọ̀rọ̀ àdánidá fún orúkọ tí a ó fi mọ ẹni náà. Àwọn àmì ohùn ni a lò níbi tí ó bá yẹ.
