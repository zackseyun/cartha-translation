review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the movement to Jesus, Jesus’ attentive look, Simon’s paternal identification, and the future naming. The parenthetical gloss correctly preserves the Greek explanation of Κηφᾶς as Πέτρος without turning the name into a theological interpretation.
  naturalness: The Yoruba is generally clear and suitably modern. However, “Kéfà ni a ó máa pè ọ́” introduces an unnecessary habitual nuance through “máa.” “A ó pè ọ́ ní Kéfà” is the more direct and idiomatic future naming construction. “Ó mú un lọ sí ọ̀dọ̀ Jésù” also avoids the speaker-oriented/deictic implication of “wá.”
  terminology: Jésù, Símónì, Jòhánù, Kéfà, and Pétérù are appropriately retained as names. The explanatory footnote rightly identifies Kéfà as a Semitic form corresponding to Pétérù and gives its lexical sense without imposing doctrinal conclusions.
  issues:
  - severity: low
    issue: The verbal particle “máa” in “Kéfà ni a ó máa pè ọ́” can imply repeated or customary calling.
    rationale: κληθήσῃ is a simple future passive, “you will be called.” Removing “máa” more closely matches the source while retaining natural Yoruba.
  - severity: low
    issue: “Mú un wá” is deictically marked as movement toward the narrator/speaker’s location.
    rationale: The Greek merely states that Andrew brought Simon to Jesus. “Mú un lọ sí ọ̀dọ̀ Jésù” is natural and does not add a deictic perspective.
  revised_text: Ó mú un lọ sí ọ̀dọ̀ Jésù. Jésù tẹjú mọ́ ọn, ó sì wí pé, “Ìwọ ni Símónì ọmọ Jòhánù[a]; a ó pè ọ́ ní Kéfà” (èyí tí a túmọ̀ sí Pétérù).[b]
  revised_footnotes:
