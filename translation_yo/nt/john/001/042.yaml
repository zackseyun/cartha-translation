revisions:
- from: Ó mú un wá sọ́dọ̀ Jésù. Jésù tẹjú mọ́ ọn, ó sì wí pé, “Ìwọ ni Símónì ọmọ Jòhánù[a]; Kéfà ni a ó máa pè ọ́” (èyí tí a túmọ̀ sí Pétérù).[b]
  to: Ó mú un lọ sí ọ̀dọ̀ Jésù. Jésù tẹjú mọ́ ọn, ó sì wí pé, “Ìwọ ni Símónì ọmọ Jòhánù[a]; a ó pè ọ́ ní Kéfà” (èyí tí a túmọ̀ sí Pétérù).[b]
  rationale: 'The revision makes two limited changes for closer source fidelity and idiomatic Standard Yoruba: it removes the habitual force of “máa” from the future passive naming statement, and it uses a non-deictically marked expression for bringing Simon to Jesus. The textual-variant and lexical footnotes are retained with their anchors and meanings unchanged.'
