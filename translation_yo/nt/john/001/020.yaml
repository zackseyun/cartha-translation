source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: yo
  text: Ó sì jẹ́wọ́, kò sì sẹ́; ó sì jẹ́wọ́ pé, “Èmi kì í ṣe Mèsáyà náà[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi náà.” Oyè náà ní èdè Gíríìkì ni Χριστός (Christos). Níbí, ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Mèsáyà; nítorí náà, a lò “Mèsáyà” nínú ọ̀rọ̀ pàtàkì.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: jẹ́wọ́
  rationale: Ọ̀rọ̀ yìí ń sọ nípa jíjẹ́wọ́ tàbí kíkéde ohun kan ní gbangba. A tún un ṣe gẹ́gẹ́ bí Gíríìkì ṣe tún un ṣe, kí ìtẹnumọ́ àti ìwúwo ọ̀rọ̀ náà lè dúró.
- source_word: οὐκ ἠρνήσατο
  choice: kò sì sẹ́
  rationale: '“Sẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ ἀρνέομαι, “kọ̀ láti gbà pé ohun kan jẹ́ òtítọ́,” mu. Ó tún pa ìtẹnumọ́ inú gbólóhùn náà mọ́: ó jẹ́wọ́, kò sì sẹ́.'
- source_word: καὶ ... καὶ ... καὶ
  choice: Ó sì ... kò sì ... ó tún ...
  rationale: Àwọn àsopọ̀ yìí pa ìtẹ̀síwájú àti àtúnsọ ìtẹnumọ́ Gíríìkì mọ́ ní Yorùbá àdánidá. “Ó tún jẹ́wọ́” mú kí àtúnsọ ìkẹyìn ṣe kedere láìfi ìyàtọ̀ tí kò sí nínú orísun kún un.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Èmi kì í ṣe
  rationale: “Èmi” dúró gẹ́gẹ́ bí arọ́pò-orúkọ tí a sọ ní kedere, ó sì pa ìtẹnumọ́ Ἐγώ mọ́. “Kì í ṣe” jẹ́ ọ̀nà Yorùbá àdánidá láti sẹ́ ìdánimọ̀ ẹni.
- source_word: ὁ χριστός
  choice: Mèsáyà náà
  rationale: Níbí, Χριστός jẹ́ oyè ẹni àmì òróró tí àwọn ènìyàn ń retí, kì í ṣe orúkọ. “Mèsáyà náà” pa ipò rẹ̀ gẹ́gẹ́ bí oyè àti àpilẹ̀kọ Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà náà
  alternative: Kristi náà
  rationale: Jòhánù ń sẹ́ pé òun ni ẹni àmì òróró tí a ń retí. Nítorí náà, “Mèsáyà” fi àyíká ìrètí Júù hàn, ó sì yẹ ju lílo “Kristi” bí ẹni pé ó jẹ́ orúkọ lọ. Àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀nà ìtumọ̀ kejì mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àtúnsọ “jẹ́wọ́” pa ìlànà àsọyé Gíríìkì mọ́, nígbà tí àmì àárín gbólóhùn (;) jẹ́ kí ìtẹnumọ́ náà ṣe kedere láìsọ ọ̀rọ̀ di líle.
