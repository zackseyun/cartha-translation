  source_fidelity: 'Ìtumọ̀ náà ń pa gbogbo àwọn ẹ̀ka Gíríìkì pàtàkì mọ́: ìyàtọ̀ ‘Ṣùgbọ́n,’ gbígbà ẹni náà, fífún ẹ̀tọ́, jíjẹ́ ọmọ Ọlọ́run, àti gbígbà orúkọ rẹ̀ gbọ́. ‘Ẹ̀tọ́’ jẹ́ ìbámu tó dára fún ἐξουσίαν ní àyíká yìí, ‘ọmọ Ọlọ́run’ sì ń dá τέκνα dúró láì fi akọ-nìkan sí i. Àtúnṣe kékeré kan mú ἔλαβον αὐτόν hàn ní kedere gẹ́gẹ́ bí títẹ́wọ́gbà ẹni kan, dípò ‘gbà á,’ èyí tí ó lè gbooro tàbí dà bí gbigba ohun kan.'
