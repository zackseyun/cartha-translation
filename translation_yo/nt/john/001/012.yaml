id: JHN.1.12
reference: John 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo àwọn tí wọ́n tẹ́wọ́ gbà á, ó fún wọn ní ẹ̀tọ́[a] láti di ọmọ Ọlọ́run—àwọn tí ó gba orúkọ rẹ̀ gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àṣẹ” tàbí “agbára” láti di ọmọ Ọlọ́run; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àṣẹ tí a fi fúnni, ẹ̀tọ́, tàbí agbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: gbogbo àwọn tí
  rationale: Ó fi gbogbo ẹgbẹ́ àwọn ènìyàn tí a ń sọ̀rọ̀ nípa wọn hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó wà láàárín àwọn tó kọ ọ́ sílẹ̀ ní ẹsẹ tó ṣáájú àti àwọn tó gbà á hàn.
- source_word: ἔλαβον αὐτόν
  choice: tí ó gbà á
  rationale: Nínú àyíká yìí, gbà á túmọ̀ sí kí wọ́n tẹ́wọ́ gbà á, kì í ṣe pé wọ́n mú un lọ́nà ti ara; ó sì pa ìtumọ̀ gbígbà mọ́ láì dín un kù sí gbígbàgbọ́ nìkan.
- source_word: ἔδωκεν
  choice: ó fún wọn
  rationale: Èyí ni ìtumọ̀ tààrà fún fífúnni, pẹ̀lú àwọn olùgbà náà gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn.
- source_word: ἐξουσίαν
  choice: ẹ̀tọ́
  rationale: Níhìn-ín ó tọ́ka sí ẹ̀tọ́ tàbí àṣẹ tí a fúnni láti wọ ipò tuntun, kì í ṣe agbára lásán. Àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
- source_word: τέκνα θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì τέκνα kò dá lórí akọ nìkan. Yorùbá ọmọ lè kan akọ tàbí abo, ó sì bá ọ̀rọ̀ orísun mu.
- source_word: γενέσθαι
  choice: láti di
  rationale: Ó fi ìyípadà sí ipò tuntun hàn ju lílo ‘láti jẹ́’ lọ.
- source_word: τοῖς πιστεύουσιν
  choice: àwọn tí ó ... gbọ́
  rationale: Ó ṣe àpèjúwe àwọn ènìyàn tí ìgbàgbọ́ jẹ́ ànímọ́ wọn, ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: gba orúkọ rẹ̀ gbọ́
  rationale: Èyí pa ‘orúkọ rẹ̀’ mọ́, ó sì sọ ìgbẹ́kẹ̀lé tí a darí sí ẹni tí orúkọ náà dúró fún ní ọ̀nà Yorùbá tó wọ́pọ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ‘gbà á’ àti ‘gba orúkọ rẹ̀ gbọ́’
  choice: Pa àwọn gbólóhùn méjèèjì mọ́, kí èkejì ṣàlàyé irú àwọn tó gbà á.
  alternative: Kó wọn jọ sí èrò kan ṣoṣo, kí a sì tú ọ̀kan péré.
  rationale: Gíríìkì pa àwọn ọ̀rọ̀ méjèèjì mọ́; èkejì ń dá àwọn olùgbà náà mọ̀ sí i láì pa àkọ́kọ́ rẹ́. Dídá wọn méjèèjì sílẹ̀ kò fi tipátipá yanjú ìbáṣepọ̀ ẹ̀kọ́ ìgbàgbọ́ wọn.
- issue: Ìtumọ̀ τέκνα nínú jíjẹ́ ọmọ Ọlọ́run
  choice: ọmọ Ọlọ́run
  alternative: àwọn ọmọkùnrin Ọlọ́run
  rationale: τέκνα jẹ́ ọ̀rọ̀ tó kan ọmọ ní gbogbogbòò, kì í ṣe akọ nìkan. ‘Ọmọ’ ní Yorùbá jẹ́ olóòtítọ́ sí ìtumọ̀ yẹn.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àmì ìsàlẹ̀ ojú ìwé [a] wà lẹ́yìn ‘ẹ̀tọ́,’ ọ̀rọ̀ tí àlàyé náà ń tọ́ka sí, dípò lẹ́yìn ‘gbà á.’ Àmì gígùn (—) mú kí gbólóhùn ìkẹyìn ṣiṣẹ́ gẹ́gẹ́ bí àlàyé àwọn olùgbà náà.
