  to: Ní ọjọ́ kejì, ó rí Jésù tí ó ń bọ̀ wá sọ́dọ̀ rẹ̀, ó sì wí pé, “Wò ó, Ọ̀dọ́-àgùntàn Ọlọ́run, ẹni tí ó mú ẹ̀ṣẹ̀ ayé kúrò!”
