id: JHN.1.29
reference: John 1:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: yo
  text: Ní ọjọ́ kejì, ó rí Jésù tí ó ń bọ̀ wá sọ́dọ̀ rẹ̀, ó sì wí pé, “Wò ó, Ọ̀dọ́-àgùntàn Ọlọ́run, ẹni tí ó mú ẹ̀ṣẹ̀ ayé kúrò!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ní ọjọ́ tí ó tẹ̀ lé e.
- source_word: βλέπει
  choice: ó rí
  rationale: Ó pa àsìkò ìsinsìnyí inú ìtàn mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: Ἴδε
  choice: Wò ó
  rationale: Àṣẹ yìí ń pe àfiyèsí àwọn olùgbọ́ sí Jésù; “Wò ó” jẹ́ ọ̀rọ̀ Yorùbá àdánidá àti alágbára.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Ọ̀dọ́ Àgùntàn Ọlọ́run
  rationale: Ìtumọ̀ tààrà ni fún àwòrán ẹranko ìrúbọ náà, ó sì pa ìbáṣepọ̀ “ti Ọlọ́run” mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ὁ αἴρων
  choice: ẹni tí ó mú ... kúrò
  rationale: αἴρω lè túmọ̀ sí gbígbé ohun kan tàbí mímú un kúrò; nínú gbolohun yìí, “mú ... kúrò” ń sọ ipa rẹ̀ ní Yorùbá àdánidá, nígbà tí àwòrán gbígbé ẹrù ṣì lè fara hàn nínú ọ̀rọ̀ náà.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: ẹ̀ṣẹ̀ ayé
  rationale: Nọ́ńbà ẹyọ ti Gíríìkì ni a pa mọ́, èyí tí ó lè tọ́ka sí ẹ̀ṣẹ̀ gẹ́gẹ́ bí odidi ìṣòro gbogbo ayé.
theological_decisions:
- issue: Ìtumọ̀ Ọ̀dọ́ Àgùntàn Ọlọ́run
  choice: A pa àpèjúwe náà mọ́ láìṣàlàyé bóyá ó tọ́ka sí Ìrékọjá, ìrúbọ ẹ̀ṣẹ̀, tàbí àwòrán míì.
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ẹranko ìrúbọ kan pàtó.
  rationale: Ọ̀rọ̀ Gíríìkì funra rẹ̀ ní ìwọ̀n àfihàn tó gbòòrò, nítorí náà kò yẹ kí ìtumọ̀ yan ẹ̀kọ́ ìtumọ̀ kan ṣoṣo.
- issue: Ìwọ̀n ìṣe αἴρων
  choice: “mú ẹ̀ṣẹ̀ ayé kúrò”
  alternative: “gbé ẹ̀ṣẹ̀ ayé”
  rationale: Àyíká ọ̀rọ̀ ń fara mọ́ ìmúkúrò ẹ̀ṣẹ̀, ṣùgbọ́n ọ̀rọ̀ Gíríìkì tún lè ru èrò gbígbé ẹrù; a kò fi àlàyé ẹ̀kọ́ ìgbàlà míì kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kikún; èdè náà jẹ́ títọ́, ọ̀wọ̀, ó sì ṣeé lóye fún àwọn òǹkàwé òde òní. A lo “ó ń bọ̀” láti ṣàfihàn ìṣe tí ó ń lọ lọ́wọ́, àti “ó sì wí pé” gẹ́gẹ́ bí ọ̀nà ìtàn mímọ́ tó ṣì jẹ́ àdánidá.
