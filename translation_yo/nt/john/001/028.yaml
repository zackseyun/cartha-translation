id: JHN.1.28
reference: John 1:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: yo
  text: Nǹkan wọ̀nyí ṣẹlẹ̀ ní Bẹ́tánì, ní òdìkejì Odò Jọ́dánì[a], níbi tí Jòhánù ti ń ṣe ìrìbọmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan àti àwọn àṣà ìtumọ̀ tó wá lẹ́yìn ka “Bẹ́tábárà” dípò “Bẹ́tánì.”
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: Nǹkan wọ̀nyí
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ inú Gíríìkì mọ́, ó sì tọ́ka padà sí àwọn ọ̀rọ̀ àti ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ ròyìn.
- source_word: ἐν Βηθανίᾳ
  choice: ní Bẹ́tánì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ibi tí ìṣẹ̀lẹ̀ kan ti wáyé hàn.
- source_word: ἐγένετο
  choice: ṣẹlẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé àwọn ìṣẹ̀lẹ̀ náà wáyé; ‘ṣẹlẹ̀’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere, tó sì bá ìròyìn mu.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ní òdìkejì Odò Jọ́dánì
  rationale: Ó sọ ibi tó wà ní ìhà kejì odò ní ìbámu pẹ̀lú ojú-ìwòye ìtàn, ó sì ṣe kedere ju títúmọ̀ ọ́ gẹ́gẹ́ bí ‘kọjá’ lọ.
- source_word: ὅπου
  choice: níbi tí
  rationale: Ó mú gbólóhùn tó ń ṣàlàyé ibi wọlé lọ́nà àdánidá ní Yorùbá.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: níbi tí Jòhánù ti ń ṣe ìrìbọmi
  rationale: Ìhun ‘ti ń’ fi iṣẹ́ tó ń bá a lọ hàn, gẹ́gẹ́ bí ìhun periphrastic imperfect inú Gíríìkì; ‘ṣe ìrìbọmi’ jẹ́ ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yorùbá mọ̀.
theological_decisions:
- issue: Orúkọ ibi Βηθανίᾳ (‘Bẹ́tánì’) ní ìfiwéra pẹ̀lú àyípadà Βηθαβαρᾷ (‘Bẹ́tábárà’)
  choice: Bẹ́tánì
  alternative: Bẹ́tábárà
  rationale: SBLGNT tí a pèsè ka Βηθανίᾳ, nítorí náà ọ̀rọ̀ pàtàkì tẹ̀ lé àkọsílẹ̀ Gíríìkì yẹn. A fi ‘Bẹ́tábárà’ sínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àyípadà inú àwọn àfọwọ́kọ àti àṣà ìtumọ̀ kan, láìfi í rọ́pò ọ̀rọ̀ tí a yàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. ‘Odò’ jẹ́ kí Jọ́dánì ṣe kedere gẹ́gẹ́ bí orúkọ odò, nígbà tí ‘ní òdìkejì’ pa ìtumọ̀ πέραν mọ́.
