source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: yo
  text: Jésù rí Nátánáẹ́lì tí ó ń bọ̀ wá sọ́dọ̀ rẹ̀, ó sì sọ nípa rẹ̀ pé, “Wò ó, ọmọ Ísírẹ́lì tòótọ́ ni èyí, ẹni tí ẹ̀tàn kò sí nínú rẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí jẹ́ ìpè láti fa àfiyèsí sí ẹni tí Jésù ń tọ́ka sí; “Wò ó” jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: ọmọ Ísírẹ́lì tòótọ́
  rationale: Ó fi ìtumọ̀ ‘ẹni Ísírẹ́lì ní tòótọ́’ hàn ní èdè Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: δόλος
  choice: ẹ̀tàn
  rationale: “Ẹ̀tàn” bo ìtumọ̀ àrékérekè tàbí ìwà ẹlẹ́tàn tí ọ̀rọ̀ Gíríìkì náà ní.
theological_decisions:
- issue: Ìtumọ̀ ‘ἀληθῶς Ἰσραηλίτης’
  choice: ọmọ Ísírẹ́lì tòótọ́
  alternative: ẹni Ísírẹ́lì ní tòótọ́
  rationale: A yan ọ̀rọ̀ tí ó mọ́gbọ́n dání ní Yorùbá, ṣùgbọ́n a kò sọ pé Jésù ń dá ìlànà ẹ̀kọ́ ìsìn kan kalẹ̀ nípa ẹni tí ó jẹ́ Ísírẹ́lì tòótọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye.
