id: JHN.1.41
reference: John 1:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: yo
  text: Ó kọ́kọ́ rí Símónì, arákùnrin òun tìkára rẹ̀, ó sì sọ fún un pé, “Àwa ti rí Mèsáyà náà” (èyí tí a túmọ̀ sí Kristi).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: ó rí
  rationale: A lo ọ̀rọ̀ ìṣe àtẹ̀yìnwá nínú ìtàn Yorùbá dípò fífi present historical Gíríìkì mú ní tààràtà; ó pa ìtumọ̀ ìṣẹ̀lẹ̀ náà mọ́, ó sì jẹ́ èdè àdánidá.
- source_word: οὗτος
  choice: ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Áńdérù nínú àyíká ẹsẹ; ‘ó’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: 'Ó pa agbára ìtẹ̀lé àsìkò mọ́: ohun tí ó kọ́kọ́ ṣe ni pé ó rí Símónì.'
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: arákùnrin òun fúnra rẹ̀
  rationale: ‘Arákùnrin’ sọ ìbátan akọ ní pàtó, ‘òun fúnra rẹ̀’ sì pa ìtẹnumọ́ ἴδιον mọ́ láì dà bí èdè àjèjì.
- source_word: Σίμωνα
  choice: Símónì
  rationale: A ṣe àkọtọ orúkọ náà gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: λέγει αὐτῷ
  choice: ó sì sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ọ̀rọ̀ tí a sọ sí ẹnì kan, pẹ̀lú àtẹ̀yìnwá tó bá ìtàn mu.
- source_word: Εὑρήκαμεν
  choice: Àwa ti rí
  rationale: Àmì ‘ti’ ń fi ìṣe tí ó ti ṣẹlẹ̀ hàn pẹ̀lú àbájáde rẹ̀ tí ó ṣì ṣe pàtàkì; fífi ‘Àwa’ hàn ń pa ìtẹnumọ́ olùṣe púpọ̀ mọ́.
- source_word: Μεσσίαν
  choice: Mèsáyà
  rationale: A ṣe àfọwọ́kọ orúkọ oyè Semitic náà, gẹ́gẹ́ bí Gíríìkì ṣe ṣe, kí àyíká ìrètí Mèsáyà àwọn Júù má bàa sọnù.
- source_word: μεθερμηνευόμενον
  choice: èyí tí a túmọ̀ sí
  rationale: Ó fi hàn pé akọ̀wé ń fún olùkà ní ìtumọ̀ oyè Semitic náà nínú èdè mìíràn.
- source_word: χριστός
  choice: “Kristi,” ìyẹn, Ẹni tí a fòróró yàn
  rationale: ‘Kristi’ pa ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì χριστός àti àlàyé ìtumọ̀ èdè náà mọ́; ‘Ẹni tí a fòróró yàn’ sì ṣí ìtumọ̀ oyè náà sílẹ̀ fún olùkà Yorùbá òde òní, dípò kí àlàyé inú àkámọ́ di àsọtúnsọ lasan.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ oyè Μεσσίας/χριστός
  choice: “Mèsáyà” fún Μεσσίας; “Kristi,” pẹ̀lú àlàyé “Ẹni tí a fòróró yàn,” fún χριστός
  alternative: “Mèsáyà” ní ibì méjèèjì, tàbí “Mèsáyà … Kristi” láìsí àlàyé
  rationale: Orísun náà mọ̀ọ́mọ̀ gbé oyè Semitic àti èyí tó bá a mu ní Gíríìkì lẹ́gbẹ̀ẹ́ ara wọn. Ṣíṣe àfihàn ‘Kristi’ àti ìtumọ̀ rẹ̀ pa ìbáṣepọ̀ yẹn mọ́, kò sì jẹ́ kí iṣẹ́ àlàyé àkámọ́ náà pòórá fún olùkà Yorùbá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yàgò fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
