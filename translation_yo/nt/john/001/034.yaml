  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: yo
  text: Èmi náà ti rí i, mo sì ti jẹ́rìí pé ẹni yìí ni ẹni tí Ọlọ́run yàn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘Ọmọ Ọlọ́run’ dípò ‘ẹni tí Ọlọ́run yàn.’
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: Èmi náà sì
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ náà àti ìsopọ̀ καί mọ́; ‘náà’ fi ìtẹnumọ́ hàn ní Yorùbá àdánidá.
- source_word: ἑώρακα
  choice: ti rí i
  rationale: Àmì ‘ti’ sọ ìṣe tí ó ti ṣẹlẹ̀ tí ẹ̀rí rẹ̀ sì ṣì dúró; ‘i’ tọ́ka sí Jésù gẹ́gẹ́ bí ohun tí a rí.
- source_word: μεμαρτύρηκα
  choice: ti jẹ́rìí
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún fífi ẹ̀rí hàn, ‘ti’ sì pa agbára perfect náà mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín ó ń ṣàgbékalẹ̀ ohun tí ẹ̀rí náà sọ, kì í ṣe ìdí.
- source_word: οὗτός
  choice: ẹni yìí
  rationale: Ó pa ìtọ́kasí taara mọ́, ó sì jẹ́ adayeba ju ‘èyí’ lọ nígbà tí a ń tọ́ka sí ènìyàn.
- source_word: ἐκλεκτός
  choice: Àyànfẹ́
  rationale: Adjective náà dúró bí orúkọ oyè; ‘Àyànfẹ́’ jẹ́ kedere, adayeba, ó sì fi ẹni tí Ọlọ́run yàn hàn láì lo èdè ẹ̀kọ́ ìsìn tí ó ṣòro.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Nínú ìkọ̀ ‘Àyànfẹ́ Ọlọ́run,’ ìbáṣepọ̀ genitive náà hàn lọ́nà Yorùbá àdánidá, láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Orúkọ oyè nípa Kristi nínú Jòhánù 1:34
  choice: Àyànfẹ́ Ọlọ́run
  alternative: Ọmọ Ọlọ́run
  rationale: Ọ̀rọ̀ SBLGNT tí a pèsè ni ὁ ἐκλεκτὸς τοῦ θεοῦ, nítorí náà a túmọ̀ ọ́ taara. A kò rọ́pò rẹ̀ pẹ̀lú ẹ̀dà ọ̀rọ̀ tí ó mọ́ni lára jù; ṣùgbọ́n a pa ẹ̀dà pàtàkì ‘Ọmọ Ọlọ́run’ mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ adayeba; gbolohun náà tẹ̀ lé ìṣàn Yorùbá láì pàdánù ìtẹnumọ́ tàbí agbára àwọn ọ̀rọ̀ perfect Gíríìkì.
