id: JHN.19.14
reference: John 19:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: yo
  text: Ó jẹ́ ọjọ́ ìmúrasílẹ̀ fún Ìrékọjá[a]; ìgbà náà sì jẹ́ nǹkan bí wákàtí kẹfà. Pilatu sì wí fún àwọn Júù pé, “Ẹ wò ó[b], ọba yín!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú ìṣírò àkókò òde òní, èyí lè túmọ̀ sí “ní nǹkan bí ọ̀sán,” bí a ṣe ń ka àwọn wákàtí náà ṣe rí.
    reason: cultural_note
  - marker: b
    text: Nínú àyíká yìí, “àwọn Júù” lè tọ́ka ní pàtó sí àwọn aláṣẹ ilẹ̀ Jùdíà tàbí àwọn aṣáájú Júù.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: ọjọ́ ìmúrasílẹ̀ fún Àjọ Ìrékọjá
  rationale: “Ọjọ́ ìmúrasílẹ̀” mú ìtumọ̀ àkókò παρασκευή hàn ní Yorùbá àdánidá; “fún Àjọ Ìrékọjá” fi ìbáṣepọ̀ genitive hàn láì pinnu ju ẹ̀rí Gíríìkì lọ.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: ó sì jẹ́ ní ìwọ̀n wákàtí kẹfà
  rationale: Ó pa ọ̀nà ìṣírò wákàtí ti ayé ìgbàanì àti àmì ìsúnmọ́ ὡς mọ́, dípò yíyí i ní pàtó sí ọ̀sán gangan.
- source_word: λέγει
  choice: Pilatu sì wí
  rationale: Orúkọ Pilatu ni a tún sọ fún ìṣípòye adayeba ní Yorùbá, nítorí òun ni ẹni tí àyíká fi hàn pé ó ń sọ̀rọ̀. “Wí” jẹ́ ọ̀rọ̀ ìtàn tó bójú mu; Yorùbá kò nílò láti fara wé historical present Gíríìkì ní gbogbo ibi.
- source_word: τοῖς Ἰουδαίοις
  choice: fún àwọn Júù
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì taara, láì dín ìtọ́kasí náà kù sí àwọn aṣáájú Júù nínú ọ̀rọ̀ àkọ́kọ́.
- source_word: Ἴδε
  choice: Ẹ wò ó
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn “Ẹ wò ó” jẹ́ àdánidá, ó sì pa agbára ìfihàn gbangba ti Ἴδε mọ́.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: ọba yín
  rationale: Ìtumọ̀ Yorùbá àdánidá ni, ó sì pa ìfọwọ́kọ́ olóṣèlú àti irony inú gbólóhùn Pilatu mọ́.
theological_decisions:
- issue: Ìtọ́kasí “àwọn Júù” nínú Ìhìn Rere Johanu
  choice: Pa “àwọn Júù” mọ́ nínú ọ̀rọ̀ àkọ́kọ́
  alternative: àwọn aláṣẹ ilẹ̀ Jùdíà tàbí àwọn aṣáájú Júù
  rationale: τοῖς Ἰουδαίοις kò sọ ìpele tóóró yẹn ní gbangba; àlàyé ìsàlẹ̀ ni ó yẹ kí ó tọ́ka sí ohun tí àyíká lè túmọ̀ sí.
- issue: Ìṣírò “wákàtí kẹfà”
  choice: Pa ọ̀rọ̀ àkókò orísun mọ́
  alternative: ní ìwọ̀n ọ̀sán
  rationale: Èyí pa àìdánilójú nípa bí a ṣe ń ka wákàtí náà mọ́, ó sì yàgò fún pípa ìjiyàn ìtẹ̀lé àkókò mọ́lẹ̀ láìní ẹ̀rí tó pé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. “Àjọ Ìrékọjá” ni a lò fún Passover, “ní ìwọ̀n” sì ń fi ìsúnmọ́ ὡς hàn. Gbogbo àmì àlàyé [a], [b] wà nínú ọ̀rọ̀ àkọ́kọ́.
