source:
  edition: SBLGNT
  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: yo
  text: Àwọn ọmọ-ogun sì hun adé ẹ̀gún, wọ́n sì fi i lé orí rẹ̀, wọ́n sì fi aṣọ elése àlùkò wọ̀ ọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “wọ́n sì da aṣọ elése àlùkò bò ó.”'
    reason: Περιβάλλω lè túmọ̀ sí fífi aṣọ wọ ẹnì kan tàbí dída aṣọ bò ó; àyípadà yìí pa ìtumọ̀ kejì mọ́.
lexical_decisions:
- source_word: στρατιῶται
  choice: àwọn ọmọ-ogun
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ fún àwọn ọmọ ẹgbẹ́ ológun Róòmù nínú àyíká yìí.
- source_word: πλέξαντες
  choice: hun
  rationale: “Hun” sọ bí wọ́n ṣe so àwọn ẹ̀gún pọ̀ láti dá adé náà, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: adé láti ara ẹ̀gún
  rationale: “Adé” pa àwòrán ìṣàkóso tí wọ́n ń fi ṣẹ̀sín mọ́; “láti ara ẹ̀gún” sì fi ohun tí wọ́n fi ṣe é hàn kedere.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: wọ́n gbé e lé e lórí
  rationale: Èyí tú ìtumọ̀ Gíríìkì náà sí Yorùbá àdánidá, pẹ̀lú arọ́pò-orúkọ fún adé àti ẹni tí wọ́n fi lé lórí.
- source_word: ἱμάτιον πορφυροῦν
  choice: aṣọ elése àlùkò
  rationale: ἱμάτιον jẹ́ aṣọ ní ìtumọ̀ gbòòrò, kò sì pọn dandan láti sọ pé aṣọ àwọ̀lékè tàbí aṣọ ọba; “elése àlùkò” jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún àwọ̀ púpọ̀lì tó ní ìtumọ̀ ọba ní àyíká náà.
- source_word: περιέβαλον αὐτόν
  choice: fi … wọ̀ ọ́
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n fi aṣọ náà wọ Jesu; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ míì ti “dá … bò ó” mọ́.
theological_decisions:
- issue: Àwòrán fífi Jesu ṣe ẹlẹ́yà bí ọba
  choice: Sọ ohun tí àwọn ọmọ-ogun ṣe ní tààrà, láìfi àlàyé pé wọ́n ń ṣẹ̀sín kún un.
  alternative: Ṣàlàyé nínú ẹsẹ náà pé wọ́n fi adé àti aṣọ ọba ṣe ẹlẹ́yà rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì ròyìn ìṣe wọn nìkan; adé ẹ̀gún àti aṣọ elése àlùkò fúnra wọn mú ìṣẹ̀sín náà hàn láìfi ìtumọ̀ tí kò sí nínú ẹsẹ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó bójú mu, ó sì ní iyì. A lo “aṣọ” dípò ọ̀rọ̀ tó lè sọ irú aṣọ náà pàtó ju ἱμάτιον lọ.
