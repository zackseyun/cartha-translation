  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èdè Gíríìkì dáadáa ní gbogbogbòò: àwọn ọmọ-ogun hun adé ẹ̀gún, wọ́n fi sí orí Jesu, wọ́n sì fi aṣọ àlùkò wọ̀ ọ́. Ṣùgbọ́n gbolohun “wọ́n gbé e lé e lórí” kò sọ ‘orí rẹ̀’ ní kedere, ó sì lè dà bíi pé a fi adé náà lé adé náà lórí.'
