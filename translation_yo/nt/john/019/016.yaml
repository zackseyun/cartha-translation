  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: yo
  text: Nígbà náà ni ó fi í lé wọn lọ́wọ́, kí a kàn án mọ́ àgbélébùú.[a][b] Nítorí náà, wọ́n gba Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn arọ́pò-orúkọ “wọn” nínú ẹsẹ̀ yìí kò sọ ẹgbẹ́ tí wọ́n ń tọ́ka sí ní pàtó; àyíká ìtàn ló ń ran òǹkàwé lọ́wọ́ láti lóye wọn.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ apá yìí pé, “ó fi í lé wọn lọ́wọ́ láti kàn án mọ́ àgbélébùú.” Gbólóhùn Gíríìkì náà ń fi ète hàn, ṣùgbọ́n a lè sọ ọ́ ní ṣókí ní Yorùbá.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε οὖν
  choice: Nígbà náà ni
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ìgbésẹ̀ tó tẹ̀ lé e nínú ìtàn hàn, ó sì so ìṣe Pilatu mọ́ ohun tó ṣáájú; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá láì tún àwọn àsopọ̀ méjèèjì sọ lọ́nà líle.
- source_word: παρέδωκεν αὐτὸν αὐτοῖς
  choice: ó fi í lé wọn lọ́wọ́
  rationale: Ó sọ ìyípadà ìṣàkóso tàbí àṣẹ lórí Jesu di mímọ̀, ó sì pa àwọn arọ́pò-orúkọ tí Gíríìkì lò mọ́ láì dárúkọ àwọn tí ẹsẹ̀ náà kò dárúkọ.
- source_word: ἵνα σταυρωθῇ
  choice: kí a lè kàn án mọ́ àgbélébùú
  rationale: Ó pa ìtumọ̀ ète inú ἵνα àti ìṣe tí a ṣe sí Jesu mọ́. Arọ́pò-orúkọ àìdárúkọ ‘a’ yẹra fún fífi ẹni tó ṣe iṣẹ́ náà kún ohun tí Gíríìkì fi sílẹ̀ ní àìsọ pàtó.
- source_word: Παρέλαβον
  choice: wọ́n gba
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí gbígba ẹni sí abẹ́ àkóso tàbí ìtọ́jú ẹni; ‘gba’ jẹ́ kúkúrú, ó sì bá ìtàn Yorùbá mu ju fífi ìtumọ̀ bí ‘wọ́n mú un ní ìgbèkùn’ kún un lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìbáṣepọ̀ àbájáde tàbí ìtẹ̀síwájú láàárín fífi Jesu lé wọn lọ́wọ́ àti gbígbà á hàn.
- source_word: Ἰησοῦν
  choice: Jesu
  rationale: Èyí ni orúkọ náà ní ìlò Bíbélì Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Àwọn tí αὐτοῖς àti kókó-ọrọ̀ tí a kò sọ nínú Παρέλαβον ń tọ́ka sí
  choice: Pa ‘wọn’ mọ́ láì dárúkọ ẹgbẹ́ kan pàtó.
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí àwọn olórí àlùfáà àti àwọn olùṣọ́ wọn, tàbí gẹ́gẹ́ bí àwọn ọmọ-ogun Róòmù.
  rationale: Gíríìkì ẹsẹ̀ yìí kò dárúkọ ẹgbẹ́ náà. Ṣíṣe bẹ́ẹ̀ nínú ìtumọ̀ yóò yanjú ohun tí ẹsẹ̀ náà fi sílẹ̀ fún àyíká ìtàn láti ṣàlàyé.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. ‘Fi í lé wọn lọ́wọ́’ jẹ́ àdánidá fún ìfaramọ́ ẹni sí àṣẹ ẹlòmíràn; ‘kàn án mọ́ àgbélébùú’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó mọ́gbọ́n dání. A pa àìsọ ẹni tí ‘wọn’ ń tọ́ka sí mọ́.
