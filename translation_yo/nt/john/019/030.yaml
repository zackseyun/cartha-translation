id: JHN.19.30
reference: John 19:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Jésù gba wáìnì kíkan náà[a], ó wí pé, “Ó ti parí.”[b] Ó sì tẹ orí rẹ̀ balẹ̀, ó fi ẹ̀mí rẹ̀ sílẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “vínígà” tàbí “vínígà wáìnì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí wáìnì tí ó kàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “A ti mú un ṣẹ” tàbí “A ti parí rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ó mí èémí ìkẹyìn.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà sọ pé, “ó fi ẹ̀mí rẹ̀ sílẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Èyí pa ìtumọ̀ àsopọ̀ ìtàn οὖν (‘nítorí náà’) àti àkókò ὅτε (‘nígbà tí’) mọ́ ní Yorùbá àdánidá.
- source_word: ἔλαβεν
  choice: gba
  rationale: Nínú àyíká yìí, Jésù gba ohun tí wọ́n fi fún un; ‘gba’ lè ṣe àfihàn ìtẹ́wọ́gbà rẹ̀ láìfi kún un pé ó mu gbogbo rẹ̀.
- source_word: τὸ ὄξος
  choice: wáìnì kíkan náà
  rationale: ὄξος ń tọ́ka sí wáìnì tí ó ti kan tàbí ọtí wáìnì olówó poku tí ó korò/kikan; ‘wáìnì kíkan’ ṣe kedere ju ‘ọ̀tí kíkan’ tàbí ọ̀rọ̀ tí yóò túmọ̀ sí vinegar lásán lọ.
- source_word: Τετέλεσται
  choice: Ó ti parí
  rationale: Ìṣe pípé inú èdè Gíríìkì fi hàn pé ohun náà ti dé òpin pẹ̀lú àbájáde tí ó dúró. ‘Ó ti parí’ jẹ́ ọ̀nà Yorùbá àdánidá tí kò sọ ohun tí ó parí ní pàtó.
- source_word: κλίνας τὴν κεφαλήν
  choice: Ó sì tẹ orí rẹ̀ ba
  rationale: Èyí tú ìṣe alábápín aorist náà sí Yorùbá àdánidá, ó sì pa ìtẹ̀lé ìṣe náà mọ́ ṣáájú fífi ẹ̀mí jọ̀wọ́.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: ó jọ̀wọ́ ẹ̀mí rẹ̀
  rationale: ‘Jọ̀wọ́’ pa agbára ìtumọ̀ ‘fà á léni lọ́wọ́/fúnni’ mọ́, nígbà tí ‘ẹ̀mí rẹ̀’ jẹ́ Yorùbá àdánidá fún τὸ πνεῦμα nínú ọ̀rọ̀ ikú yìí.
theological_decisions:
- issue: Bóyá παρέδωκεν τὸ πνεῦμα yẹ kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ lásán fún ikú tàbí kí a pa àwòrán fífi ẹ̀mí jọ̀wọ́ mọ́.
  choice: ó jọ̀wọ́ ẹ̀mí rẹ̀
  alternative: ó kú; èémí rẹ̀ sì dá
  rationale: Àṣàyàn náà pa ọ̀rọ̀ Gíríìkì àti ìwọ̀n ọ̀rọ̀ rẹ̀ mọ́, tó sì jẹ́ kí òǹkàwé rí ìṣe náà gẹ́gẹ́ bí ohun tí Jésù ṣe, láìfi ẹ̀kọ́ ìsìn mìíràn tí kò sí nínú ẹsẹ náà kún un.
- issue: Ohun tí Τετέλεσται ń tọ́ka sí kò fara hàn ní tààràtà.
  choice: Ó ti parí
  alternative: A ti mú un ṣẹ; A ti parí rẹ̀
  rationale: A kò sọ ohun tí ó parí tàbí ẹni tí ó parí rẹ̀ ní pàtó, kí àìsọ pàtó inú Gíríìkì àti ìfarahàn ìmúṣẹ rẹ̀ lè dúró.
translation_notes:
  register: A lo Yorùbá boṣewa tí ó ní àmì ohùn, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti àdánidá. Gbólóhùn náà pa ìṣàn ìtàn, àìsọ ohun tí ‘ó ti parí’ jẹ́ ní pàtó, àti ìwọ̀n ọ̀rọ̀ ‘ẹ̀mí’ mọ́.
