  source_fidelity: Ìtumọ̀ náà pa ìtẹ̀lé ìṣẹ̀lẹ̀, ìtumọ̀ ‘wáìnì kíkan,’ àti àìsọ ohun tí Τετέλεσται ń tọ́ka sí mọ́ dáadáa. Ṣùgbọ́n ‘jọ̀wọ́ ẹ̀mí rẹ̀’ kò jẹ́ ọ̀nà Yorùbá tó dájú fún παρέδωκεν τὸ πνεῦμα; jọ̀wọ́ sábà máa ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ìbẹ̀bẹ̀. ‘Fi ẹ̀mí rẹ̀ sílẹ̀’ mú èrò ‘gave up his spirit’ hàn ní kedere, láìdín ìwọ̀n ọ̀rọ̀ Gíríìkì kù.
  naturalness: ‘Tẹ orí rẹ̀ balẹ̀’ jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá àti tó pé ju ‘tẹ orí rẹ̀ ba’ lọ. Ìyókù gbólóhùn náà ní ìforúkọsílẹ̀ mímọ́, tó sì rọrùn fún òǹkàwé òde òní.
  terminology: ‘Wáìnì kíkan’ yẹ fún ὄξος. ‘Ẹ̀mí’ pa ìwọ̀n πνεῦμα mọ́, ó sì yẹ kí a má ṣe rọ́pò ó pẹ̀lú ‘ikú’ nínú ìtumọ̀ àkọ́kọ́.
