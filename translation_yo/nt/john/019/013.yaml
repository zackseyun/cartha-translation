id: JHN.19.13
reference: John 19:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Pílátù gbọ́ àwọn ọ̀rọ̀ wọ̀nyí[a], ó mú Jésù jáde, ó sì jókòó lórí ìtẹ́ ìdájọ́ ní ibi tí a ń pè ní Pátákó Òkúta, tí a sì ń pè ní Gábátà ní èdè Hébérù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì mú un jókòó lórí ìtẹ́ ìdájọ́.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí pé Pílátù mú Jésù jókòó, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ tó ṣeé ṣe jù níbí ni pé Pílátù fúnra rẹ̀ ló jókòó lórí ìtẹ́ ìdájọ́.
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí “ní èdè Hébérù” níbí túmọ̀ sí èdè àwọn Júù tó wọ́pọ̀ ní agbègbè náà, ìyẹn bóyá Árámáíkì, gẹ́gẹ́ bí ó ti rí ní àwọn ibòmíràn nínú ìwé Jòhánù.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ àsọyé tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: nígbà tí Pílátù gbọ́ àwọn ọ̀rọ̀ wọ̀nyí
  rationale: A túmọ̀ aorist participle náà gẹ́gẹ́ bí àsìkò; ‘àwọn ọ̀rọ̀ wọ̀nyí’ tọ́ka sí ohun tí wọ́n ṣẹ̀ṣẹ̀ sọ.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: ó mú Jésù jáde
  rationale: Ó sọ ìrìn jáde di mímọ́ láìfi kún un pé ó fà á tàbí pé ó darí rẹ̀ ní ọ̀nà pàtó kan.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: ó sì jókòó lórí ìtẹ́ ìdájọ́
  rationale: Ní àyíká ẹjọ́ yìí, βῆμα ni ibi tàbí ìtẹ́ tí adájọ́ ti ń ṣe ìdájọ́; ìtumọ̀ tó ṣeé ṣe jù ni pé Pílátù fúnra rẹ̀ ló jókòó.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: ní ibi tí a ń pè ní Pápá Òkúta
  rationale: Pẹ̀lú ìṣe jíjókòó, εἰς tọ́ka sí ibi tí ìrìn náà parí sí; Λιθόστρωτον túmọ̀ sí ilẹ̀ tàbí pápá tí a fi òkúta tẹ́.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: tí a sì ń pè ní Gábátà ní èdè Hébérù
  rationale: A pa ‘Hébérù’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ inú ẹsẹ náà, a sì kọ Gabbatha ní ìbámu pẹ̀lú ìró Yorùbá.
theological_decisions:
- issue: Ẹni tí ἐκάθισεν ń tọ́ka sí
  choice: Pílátù jókòó lórí ìtẹ́ ìdájọ́
  alternative: Pílátù mú Jésù jókòó lórí ìtẹ́ ìdájọ́
  rationale: Fọ́ọ̀mù Gíríìkì náà lè jẹ́ aláìlẹ́ni tí ìṣe dé bá tàbí olùṣe tó mú ẹlòmíràn jókòó. Àyíká ẹjọ́ àti ìṣètò gbólóhùn mú kí Pílátù gẹ́gẹ́ bí ẹni tó jókòó ṣeé ṣe jù; a fi ìtumọ̀ kejì sínú àlàyé ìsàlẹ̀ láti pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ní ìgbà òde òní; a lo àmì ohùn ní kíkún. ‘Ìtẹ́ ìdájọ́’ jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání fún βῆμα, ‘Pápá Òkúta’ sì mú ìtumọ̀ orúkọ Gíríìkì hàn.
