id: JHN.19.15
reference: John 19:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: yo
  text: Nígbà náà ni wọ́n kígbe pé, “Mú un kúrò! Mú un kúrò! Kàn án mọ́ àgbélébùú!” Pílátù bi wọ́n pé, “Ṣé kí n kan ọba yín mọ́ àgbélébùú?” Àwọn olórí àlùfáà dáhùn pé, “A kò ní ọba kan bí kò ṣe Késárì.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A kò ní ọba àfi Késárì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Nígbà náà ni wọ́n kígbe
  rationale: ‘Kígbe’ fi ohùn rara tí κραυγάζω túmọ̀ sí hàn, ‘nígbà náà’ sì ń jẹ́ kí ìtẹ̀síwájú tàbí àbájáde tí οὖν fi hàn yéni ní Yorùbá àdánidá.
- source_word: Ἆρον ἆρον
  choice: Mú un kúrò! Mú un kúrò!
  rationale: Àṣẹ tí a tún sọ lẹ́ẹ̀mejì jẹ́ igbe pé kí a mú Jésù kúrò. Fífi arọ́pò-orúkọ ‘un’ kún un jẹ́ ohun tí gírámà Yorùbá béèrè ní ọ̀nà àdánidá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì fi ẹni tí wọ́n ń tọ́ka sí sílẹ̀ fún àyíká ọ̀rọ̀.
- source_word: σταύρωσον αὐτόν
  choice: Kàn án mọ́ àgbélébùú
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìjìyà ikú Róòmù tí σταυρόω ń tọ́ka sí.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Ṣé kí n kan ọba yín mọ́ àgbélébùú?
  rationale: ‘Ṣé kí n...?’ mú ìbéèrè oníṣiyèméjì inú subjunctive náà jáde, ó sì pa ìpèníjà àti ìfọ̀rọ̀yà Pílátù mọ́.
- source_word: οἱ ἀρχιερεῖς
  choice: Àwọn olórí àlùfáà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú aláṣẹ nínú ẹgbẹ́ àwọn àlùfáà, kì í ṣe dandan pé ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo ni.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: A kò ní ọba mìíràn bí kò ṣe Késárì
  rationale: ‘Bí kò ṣe’ fi ìyàsọ́tọ̀ tí εἰ μὴ ní hàn, ‘mìíràn’ sì mú gbólóhùn náà ṣàn ní Yorùbá láì dín agbára ìkéde wọn kù.
theological_decisions:
- issue: Ìkéde àwọn olórí àlùfáà nípa ẹni tí wọ́n gbà gẹ́gẹ́ bí ọba
  choice: A kò ní ọba mìíràn bí kò ṣe Késárì
  alternative: A kò ní ọba àfi Késárì
  rationale: Ìtumọ̀ náà pa ìkéde ìṣèlú tó lágbára àti ìkọ̀sílẹ̀ gbogbo ọba mìíràn mọ́ nínú àyíká ìtàn náà, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní, ni a lò. Àwọn àmì ohùn wà ní ibi tí wọ́n ti yẹ. A lo ‘àgbélébùú’ àti ‘olórí àlùfáà’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tí ọ̀pọ̀ ènìyàn mọ̀, láì jẹ́ kí èdè náà di ti àtijọ́ jù.
