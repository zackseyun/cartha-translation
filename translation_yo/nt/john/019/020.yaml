id: JHN.19.20
reference: John 19:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: yo
  text: Nítorí náà, ọ̀pọ̀ nínú àwọn Júù ka àkọlé yìí[a], nítorí ibi tí a ti kàn Jésù mọ́ àgbélébùú sún mọ́ ìlú; a sì kọ ọ́ ní èdè Hébérù, ní èdè Látìn àti ní èdè Gíríìkì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe kí “èdè Hébérù” túmọ̀ sí “èdè Arámáíkì”; Jòhánù máa ń lo “Hébérù” fún èdè Sẹ́mítìkì tí àwọn ará ibẹ̀ ń sọ.
    reason: Àṣàyàn ìtumọ̀ ọ̀rọ̀ Ἑβραϊστί.
lexical_decisions:
- source_word: τίτλον
  choice: àkọlé
  rationale: Nínú ọ̀rọ̀ yìí, ó tọ́ka sí ìkọ̀wé tí a fi síbi tí wọ́n kàn Jesu mọ́ àgbélébùú; “àkọlé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu ju ìtumọ̀ gígùn lọ.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: ọ̀pọ̀ nínú àwọn Júù
  rationale: Èyí pa ìtumọ̀ apá-nínú-àpapọ̀ inú genitive Gíríìkì mọ́, kò sì sọ ọ́ di gbogbo àwọn Júù.
- source_word: ἀνέγνωσαν
  choice: ka
  rationale: Ọ̀rọ̀ náà sọ pé wọ́n ka ìkọ̀wé náà; kò fi dandan hàn pé wọ́n kà á sókè.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: ibi ... sún mọ́ ìlú
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti àdánidá, láìfi ẹnu-ọ̀nà ìlú tàbí àlàyé mìíràn kún un.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: ibi tí a ti kàn Jesu mọ́ àgbélébùú
  rationale: Ó pa ohùn àìṣe (passive) Gíríìkì mọ́ láìdárúkọ ẹni tó ṣe iṣẹ́ náà.
- source_word: ἦν γεγραμμένον
  choice: a sì kọ ọ́
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá fún ipò ohun tí a ti kọ sílẹ̀, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: Ἑβραϊστί
  choice: ní èdè Heberu
  rationale: Ó tẹ̀lé ọ̀rọ̀ Gíríìkì ní pàtó; bí ó tilẹ̀ jẹ́ pé nínú lílò Johanu ó lè tọ́ka sí èdè Aramaiki, a fi ìyẹn sínú àlàyé ìsàlẹ̀.
- source_word: Ῥωμαϊστί
  choice: ní èdè Latini
  rationale: Bí ìtumọ̀ ọ̀rọ̀ náà ṣe rí ni “ní ti àwọn Romu,” èdè Latini ni ohun tí ó ń tọ́ka sí.
- source_word: Ἑλληνιστί
  choice: ní èdè Giriki
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì ṣe kedere ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ọgbọ́n àti ìtẹ̀síwájú ìtàn pẹ̀lú ẹsẹ tó ṣáájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ Ἑβραϊστί nínú lílò Johanu
  choice: èdè Heberu nínú ọ̀rọ̀ pàtàkì
  alternative: èdè Aramaiki
  rationale: Gíríìkì sọ “Heberu” ní tààrà, nítorí náà a pa á mọ́ nínú ọ̀rọ̀ pàtàkì. Síbẹ̀, ó ṣeé ṣe kí Johanu máa lo ọ̀rọ̀ náà fún èdè Semitiki tí àwọn ará ibẹ̀ ń sọ, èyí tó lè jẹ́ Aramaiki; a pa àṣàyàn yìí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa olóhùn pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbo. A lo “àgbélébùú” fún crucifixion gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀, láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kankan kún un.
