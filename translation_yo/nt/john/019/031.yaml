  to: Nítorí náà, àwọn Júù[a], níwọ̀n bí ó ti jẹ́ Ọjọ́ Ìmúrasílẹ̀[b], béèrè lọ́wọ́ Pílátù pé kí àwọn ara náà má bàa wà lórí àgbélébùú ní ọjọ́ Sábáàtì—nítorí ọjọ́ Sábáàtì náà jẹ́ ọjọ́ ńlá[c]—kí a fọ́ ẹsẹ̀ wọn, kí a sì gbé wọn kúrò[d].
