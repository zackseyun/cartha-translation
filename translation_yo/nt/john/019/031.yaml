id: JHN.19.31
reference: John 19:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[a], níwọ̀n bí ó ti jẹ́ Ọjọ́ Ìmúrasílẹ̀[b], béèrè lọ́wọ́ Pílátù pé kí àwọn ara náà má bàa wà lórí àgbélébùú ní ọjọ́ Sábáàtì—nítorí ọjọ́ Sábáàtì náà jẹ́ ọjọ́ ńlá[c]—kí a fọ́ ẹsẹ̀ wọn, kí a sì gbé wọn kúrò[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Ìhìn Rere Jòhánù, “àwọn Júù” lè tọ́ka ní àwọn àyíká kan sí àwọn aláṣẹ tàbí àwọn olórí Júù ní pàtó.
    reason: alternative_reading
  - marker: b
    text: Èyí ni ọjọ́ tí wọ́n fi ń múra sílẹ̀ fún ọjọ́ Sábáàtì.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí Sábáàtì náà jẹ́ Sábáàtì ńlá”; ìyẹn ni pé, ó jẹ́ Sábáàtì pàtàkì lọ́tọ̀.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “kí a yọ wọ́n kúrò,” tàbí, ní àyíká yìí, “kí a sọ wọ́n kalẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: Nítorí náà, àwọn Júù
  rationale: οὖν ní ìtumọ̀ àbájáde tàbí ìtẹ̀síwájú nínú àyíká yìí. “Àwọn Júù” pa ìtumọ̀ Ἰουδαῖοι mọ́ láì dín un kù sí àwọn olórí nìkan; àlàyé ìsàlẹ̀ ojú ìwé sọ pé nínú Jòhánù ó lè tọ́ka sí àwọn aláṣẹ Júù.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: nítorí ó jẹ́ Ọjọ́ Ìmúrasílẹ̀
  rationale: παρασκευή níbí ni ọjọ́ tí a fi ń múra sílẹ̀ fún Sábáàtì. Ọ̀rọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: ἵνα μὴ μείνῃ ... τὰ σώματα
  choice: pé kí àwọn òkú náà má bàa wà
  rationale: Ìṣètò “kí ... má bàa” fi ète tí ἵνα pẹ̀lú subjunctive ń sọ hàn. “Àwọn òkú” jẹ́ ọ̀nà àdánidá láti sọ τὰ σώματα ní àyíká àwọn tí wọ́n ti kú.
- source_word: ἐπὶ τοῦ σταυροῦ
  choice: lórí àgbélébùú
  rationale: Èyí ni ìtumọ̀ ibi tí ọ̀rọ̀ Gíríìkì náà ní nínú àyíká yìí, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: ἐν τῷ σαββάτῳ
  choice: ní ọjọ́ Sábáàtì
  rationale: ἐν jẹ́ ti àkókò níbí; “ní ọjọ́ Sábáàtì” jẹ́ kedere, ó sì bá ìlò Yorùbá mu.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: nítorí ọjọ́ Sábáàtì náà jẹ́ ọjọ́ ńlá
  rationale: “Ọjọ́ ńlá” pa μεγάλη mọ́ ní ọ̀nà àdánidá, ó sì tọ́ka sí Sábáàtì pàtàkì kan láì fi ìtumọ̀ ẹ̀sìn tó ju orísun lọ kún un.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: béèrè lọ́wọ́ Pílátù
  rationale: ἠρώτησαν níbí túmọ̀ sí béèrè tàbí ṣe ìbéèrè. “Béèrè lọ́wọ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédé láì ṣàfikún “fún àṣẹ,” bí ó tilẹ̀ jẹ́ pé àyíká fi ìyẹn hàn.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: pé kí a ṣẹ́ ẹsẹ̀ wọn
  rationale: κατάγνυμι túmọ̀ sí ṣẹ́ tàbí fọ́. Ìlò “kí a ṣẹ́” pa ìṣe àìlórúkọ nínú passive Gíríìkì mọ́, ẹsẹ̀ sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún σκέλη níbí.
- source_word: καὶ ἀρθῶσιν
  choice: kí a sì gbé wọn kúrò
  rationale: αἴρω lè túmọ̀ sí gbé, mú kúrò, tàbí yọ kúrò. Yíyan yìí pa ìtumọ̀ náà gbòòrò; àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí ìtumọ̀ tó ṣeé ṣe pé kí a sọ wọ́n kalẹ̀ láti orí àgbélébùú.
theological_decisions:
- issue: Ìtumọ̀ μεγάλη nípa Sábáàtì
  choice: ọjọ́ ńlá
  alternative: Sábáàtì pàtàkì gidigidi; ọjọ́ gíga
  rationale: “Ọjọ́ ńlá” sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì fi pàtàkì Sábáàtì náà hàn láì mú gbólóhùn ìbílẹ̀ ẹ̀sìn kan wọlé.
- issue: Ẹni tí Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; àwọn olórí Júù
  rationale: Ẹsẹ̀ náà kò sọ ní tààrà pé àwọn olórí nìkan ni. A pa ọ̀rọ̀ tó gbòòrò mọ́ nínú ẹsẹ̀, a sì ṣàkọsílẹ̀ ìtumọ̀ tó dín sí àwọn aláṣẹ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. A lo “àgbélébùú,” “Ọjọ́ Ìmúrasílẹ̀,” àti “Sábáàtì” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tó mọ̀ ṣùgbọ́n tó ṣì ṣe kedere.
