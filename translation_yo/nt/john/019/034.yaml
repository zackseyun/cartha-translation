  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀kan nínú àwọn ọmọ ogun náà fi ọ̀kọ̀[a] gún un ní ẹ̀gbẹ́, ẹ̀jẹ̀ àti omi sì jáde lẹ́sẹ̀kẹsẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘fi ọ̀kọ̀ ogun gígùn gún un.’
    reason: lexical_alternative
  - marker: b
    text: Àwọn onítumọ̀ kan lóye ‘ẹ̀jẹ̀ àti omi’ gẹ́gẹ́ bí àmì tàbí gẹ́gẹ́ bí ohun tó ní í ṣe pẹ̀lú àwọn àṣà mímọ́; àwọn mìíràn sì gbà pé àpèjúwe ti ara ni. Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò ṣàlàyé ìjẹ́pàtàkì rẹ̀ níbí.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ohun tí ó ṣáájú pé wọn kò ṣẹ́ egungun ẹsẹ̀ Jésù; ‘Ṣùgbọ́n’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìyàtọ̀ yìí.
- source_word: εἷς τῶν στρατιωτῶν
  choice: ọ̀kan nínú àwọn ọmọ ogun náà
  rationale: Ó pa ìtumọ̀ ìpín nínú ọ̀pọ̀ tí èdè Gíríìkì sọ ní kedere mọ́, dípò lílo ‘ọmọ ogun kan.’
- source_word: λόγχῃ
  choice: fi ọ̀kọ̀
  rationale: λόγχη túmọ̀ sí ọ̀kọ̀ tàbí irin ogun gígùn tí ó ní ṣóńṣó; ‘ọ̀kọ̀’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ jù lọ ní àyíká yìí.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: ẹ̀gbẹ́ rẹ̀
  rationale: ‘Ẹ̀gbẹ́ rẹ̀’ tẹ̀ lé ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì, ó sì tú πλευρά sí ibi ẹ̀gbẹ́ ara láì fi àlàyé tí orísun kò sọ kún un.
- source_word: ἔνυξεν
  choice: gún
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífi ohun olójú ṣóńṣó wọ ara; ‘gún’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kíkún, tí ó sì bá iṣẹ́ ọ̀kọ̀ mu.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: lẹ́sẹ̀kẹsẹ̀ ni ... sì jáde
  rationale: Ó pa ìtẹ̀síwájú καί àti ìtumọ̀ àkókò εὐθύς mọ́; ìgbékalẹ̀ yìí sì dùn bí Yorùbá àdánidá.
- source_word: αἷμα καὶ ὕδωρ
  choice: ẹ̀jẹ̀ àti omi
  rationale: Ìtumọ̀ tààrà ni ó dára jù, nítorí ẹsẹ náà kò ṣàlàyé ìjẹ́pàtàkì gbolóhùn tí kò wọ́pọ̀ yìí.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ‘ẹ̀jẹ̀ àti omi’ gẹ́gẹ́ bí àmì ẹ̀sìn tàbí gẹ́gẹ́ bí àpèjúwe ohun tó ṣẹlẹ̀ sí ara
  choice: A pa ‘ẹ̀jẹ̀ àti omi’ mọ́ gẹ́gẹ́ bí ó ṣe wà, láì ṣàlàyé rẹ̀ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Àwọn kan kà á sí àmì tàbí ohun tó ní í ṣe pẹ̀lú àwọn àṣà mímọ́; àwọn mìíràn kà á sí àpèjúwe ohun tó ṣẹlẹ̀ sí ara.
  rationale: Ẹsẹ náà sọ ohun tó jáde, ṣùgbọ́n kò ṣàlàyé ìtumọ̀ rẹ̀. Ìtumọ̀ náà nítorí náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí orísun fi sílẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún ìtàn Ìwé Mímọ́; a yàgò fún ọ̀rọ̀ ìjọ kan pàtó àti àlàyé ìṣègùn tí orísun kò sọ.
