id: JHN.19.12
reference: John 19:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: yo
  text: Láti ìgbà náà lọ, Pílátù ń wá ọ̀nà láti dá a sílẹ̀.[a] Ṣùgbọ́n àwọn Júù[b] ké jáde pé, “Bí o bá dá ọkùnrin yìí sílẹ̀, ìwọ kì í ṣe ọ̀rẹ́ Késárì. Ẹnikẹ́ni tí ó ń sọ ara rẹ̀ di ọba ń tako Késárì.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí èyí, Pílátù ń bá a lọ ní wíwá ọ̀nà láti dá a sílẹ̀.” Gbólóhùn Gíríìkì ἐκ τούτου lè tọ́ka sí àkókò (“láti ìgbà náà lọ”) tàbí sí ohun tó fa ìṣe náà (“nítorí èyí”).
    reason: lexical_alternative
  - marker: b
    text: Nínú Ìhìn Rere Jòhánù, “àwọn Júù” sábà máa ń tọ́ka ní pàtó sí àwọn aláṣẹ Júù tàbí àwọn Júù kan tí wọ́n ń tako Jésù nínú àyíká ìtàn náà; kò pọndandan kí ó túmọ̀ sí gbogbo àwọn Júù lápapọ̀.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ń sọ̀rọ̀ lòdì sí Késárì” tàbí “ń dojú kọ Késárì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: Láti ìgbà náà lọ
  rationale: Ó mú ìtumọ̀ àkókò, ‘láti ìgbà náà lọ,’ jáde ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ okunfa tí ó tún ṣeé ṣe pamọ́.
- source_word: ἐζήτει
  choice: ń wá ọ̀nà
  rationale: Àkókò imperfect náà fi ìgbìyànjú tí ń bá a lọ tàbí tí a ń ṣe léraléra hàn; ‘ń wá ọ̀nà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìsapá yìí.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: láti dá a sílẹ̀ / dá ... sílẹ̀
  rationale: ‘Dá ... sílẹ̀’ bá ìtújáde ẹni kúrò ní àhámọ́ ní ipò ìdájọ́ mu.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Ṣùgbọ́n àwọn Júù
  rationale: A pa gbólóhùn orísun náà mọ́ láì dín ẹni tí ó ń tọ́ka sí kù sí ‘àwọn olórí Júù’; àlàyé ìsàlẹ̀ ṣàlàyé bí ọ̀rọ̀ náà ṣe máa ń ṣiṣẹ́ nínú Jòhánù.
- source_word: ἐκραύγασαν λέγοντες
  choice: ké jáde pé
  rationale: Ó fi igbe ohùn rara hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ taara wọlé.
- source_word: τοῦτον
  choice: ọkùnrin yìí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka náà mọ́, pẹ̀lú ìró àfojúdi tó lè wà nínú ọ̀rọ̀ àwọn alatako.
- source_word: φίλος τοῦ Καίσαρος
  choice: ọ̀rẹ́ Késárì
  rationale: Ó jẹ́ ìtumọ̀ kíkún, kúkúrú, tí ó sì pa ẹ̀sùn àìṣòtítọ́ sí ọba Romu mọ́ láì sọ pé ó dájú pé oyè ìjọba pàtó ni.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Ẹnikẹ́ni tí ó bá sọ ara rẹ̀ di ọba
  rationale: Ó tẹ̀lé ìtumọ̀ ‘ẹni gbogbo tí ń sọ ara rẹ̀ di ọba’ ní Yorùbá tó yé, láì rọ ọ́ sí ‘ẹni tí ó sọ pé òun jẹ́ ọba.’
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: ń tako Késárì
  rationale: Nínú ọ̀rọ̀ òṣèlú àti ẹ̀sùn yìí, ‘ń tako’ mú ìtumọ̀ fífi ara ẹni dojú kọ Késárì hàn dáadáa; àlàyé ìsàlẹ̀ pa ìtumọ̀ ọ̀rọ̀ ẹnu mọ́ gẹ́gẹ́ bí àṣàyàn.
theological_decisions:
- issue: Ẹni tí ‘àwọn Júù’ ń tọ́ka sí nínú Ìhìn Rere Jòhánù
  choice: A fi ‘àwọn Júù’ sí ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí Gíríìkì ṣe wí.
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Orísun sọ οἱ Ἰουδαῖοι. A kò gbọdọ̀ fi ìtumọ̀ tó dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù sínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ ló yẹ kí ó ṣàlàyé àyíká náà kí a má bàa ka a sí gbogbo àwọn Júù láìyàtọ̀.
- issue: Agbára ἀντιλέγει nínú ẹ̀sùn sí Késárì
  choice: ń tako Késárì
  alternative: ń sọ̀rọ̀ lòdì sí Késárì; ń dojú kọ Késárì
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí sísọ̀rọ̀ lòdì sí ẹni tàbí títako rẹ̀. Nínú àyíká ẹ̀sùn ìṣọ̀tẹ̀ òṣèlú, ‘ń tako’ ni Yorùbá àdánidá jù, ṣùgbọ́n a jẹ́ kí àṣàyàn ọ̀rọ̀ ẹnu hàn ní àlàyé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A lo ‘Késárì’ gẹ́gẹ́ bí orúkọ oyè Romu tí a ti mú bá ìró Yorùbá mu. A yan ‘ń wá ọ̀nà’ láti mú ìṣe tí ń bá a lọ hàn, àti ‘ké jáde pé’ fún igbe gbangba.
