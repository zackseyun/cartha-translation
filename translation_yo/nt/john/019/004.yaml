id: JHN.19.4
reference: John 19:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: yo
  text: Pilatu tún jáde sí òde, ó sì sọ fún wọn pé, “Ẹ wò ó, mo ń mú un jáde wá fún yín, kí ẹ lè mọ̀ pé n kò rí ẹ̀sùn kankan sí i.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “n kò rí ẹ̀bi kankan nínú rẹ̀.” A lè tú gbólóhùn Gíríìkì náà lọ́nà ìbílẹ̀ yìí, ṣùgbọ́n níbí ó ṣeé ṣe kí ó ní ìtumọ̀ pàtó ti ilé-ẹjọ́: Pilatu kò rí ẹ̀sùn tàbí ìpìlẹ̀ ẹjọ́ kankan sí Jésù.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω
  choice: Nígbà náà ni Pilatu tún jáde lọ
  rationale: ‘Tún’ fi ìtúnsẹ̀ tí πάλιν ní hàn, ‘jáde lọ’ sì sọ ìṣípò sí òde tí ἐξῆλθεν ... ἔξω túmọ̀ sí ní Yorùbá àdánidá. ‘Nígbà náà ni’ so ìṣẹ̀lẹ̀ náà mọ́ ìtàn tó ṣáájú láìfi ìtumọ̀ tuntun kún un.
- source_word: λέγει αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí nínú ìtàn, àsìkò àtẹ̀yìnwá ni ó bá ìtàn Yorùbá mu dáadáa.
- source_word: Ἴδε
  choice: Ẹ wò ó
  rationale: Èyí jẹ́ ọ̀rọ̀ pípe àfiyèsí ní èdè Yorùbá òde òní, ó sì pa agbára àṣẹ inú Ἴδε mọ́.
- source_word: ἄγω ὑμῖν αὐτὸν ἔξω
  choice: mo ń mú un jáde tọ̀ yín wá
  rationale: ‘Mú un jáde’ bá ìṣe Pilatu tó ń fi Jésù hàn àwọn ènìyàn mu; ‘tọ̀ yín wá’ mú ὑμῖν hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἵνα γνῶτε
  choice: kí ẹ lè mọ̀
  rationale: Ọ̀rọ̀ yìí pa ète tí ἵνα fi hàn mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ
  choice: n kò rí ẹ̀sùn kankan tí ó lẹ́sẹ̀ nílẹ̀ sí i
  rationale: Nínú àyíká ìdájọ́, αἰτία tọ́ka sí ẹ̀sùn tàbí ìpìlẹ̀ ẹjọ́. ‘Ẹ̀sùn ... tí ó lẹ́sẹ̀ nílẹ̀’ fi hàn pé Pilatu kò rí ẹ̀sùn tó fìdí múlẹ̀ sí Jésù, láìyí ọ̀rọ̀ náà sí ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò ju àyíká ẹjọ́ lọ.
theological_decisions:
- issue: Ọ̀rọ̀ ìdájọ́ nínú ìkéde Pilatu nípa àìjẹ̀bi Jésù
  choice: n kò rí ẹ̀sùn kankan tí ó lẹ́sẹ̀ nílẹ̀ sí i
  alternative: n kò rí ẹ̀bi kankan nínú rẹ̀
  rationale: Yíyan ‘ẹ̀sùn ... tí ó lẹ́sẹ̀ nílẹ̀’ pa ìtumọ̀ αἰτία nínú àyíká ilé-ẹjọ́ mọ́. Ó fi àìrí ìpìlẹ̀ ẹjọ́ sí Jésù hàn, ṣùgbọ́n kò fi ipa mú ọ̀rọ̀ náà di ìkéde ẹ̀kọ́ ìgbàgbọ́ tó kọjá ohun tí Pilatu sọ nínú ìtàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a lo ‘Ẹ wò ó’ dípò ọ̀rọ̀ àtijọ́, a sì pa àyíká ìdájọ́ mọ́ nínú gbólóhùn Pilatu.
