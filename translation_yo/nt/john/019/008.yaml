source:
  edition: SBLGNT
  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: yo
  text: Nígbà tí Pílátù gbọ́ ọ̀rọ̀ yìí, ó túbọ̀ bẹ̀rù,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Nígbà náà, bí ... ti
  rationale: Ó fi àkókò àti ìtẹ̀síwájú ìtàn hàn lọ́nà Yorùbá tó ṣe déédé; “náà” rọra gbé ipa àsopọ̀ οὖν jáde.
- source_word: ἤκουσεν
  choice: gbọ́
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé Pílátù gbọ́ ohun tí wọ́n sọ, kì í ṣe pé ó tẹ́tí sí i pẹ̀lú ìfiyèsí.
- source_word: ὁ Πιλᾶτος
  choice: Pílátù
  rationale: Ìkọ̀wé orúkọ ẹni náà ní Yorùbá pẹ̀lú àmì ohùn tó yẹ.
- source_word: τοῦτον τὸν λόγον
  choice: ọ̀rọ̀ yìí
  rationale: “Ọ̀rọ̀” lè tọ́ka sí gbólóhùn tàbí ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì bá àyíká ẹsẹ ṣáájú mu láì fi ìtumọ̀ míì kún un.
- source_word: μᾶλλον
  choice: tún ... sí i
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí fi ìbẹ̀rù tó pọ̀ ju ti tẹ́lẹ̀ lọ hàn lọ́nà àdánidá.
- source_word: ἐφοβήθη
  choice: ẹ̀rù bà á
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan bẹ̀rù; pẹ̀lú “tún ... sí i,” ó fi ìlọsíwájú ìbẹ̀rù hàn.
theological_decisions:
- issue: Irú ìbẹ̀rù Pílátù
  choice: A sọ ní ṣókí pé ẹ̀rù tún bà á sí i.
  alternative: Láti sọ pé ìbẹ̀rù òṣèlú tàbí ìbẹ̀rù ohun àtọ̀runwá ló bà á.
  rationale: Gíríìkì kò sọ ohun pàtó tó fa ìbẹ̀rù náà tàbí irú ìbẹ̀rù tí ó jẹ́; ìtumọ̀ náà pa àìdánilójú inú ìtàn mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì, ó sì ṣe kedere fún òǹkàwé lásán. A lo àpẹẹrẹ “bí ... ti” fún gbólóhùn àkókò, àti “ẹ̀rù bà á” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá.
