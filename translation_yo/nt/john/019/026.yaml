id: JHN.19.26
reference: John 19:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: yo
  text: Nítorí náà, nígbà tí Jésù rí ìyá rẹ̀ àti ọmọ-ẹ̀yìn tí Jésù fẹ́ràn, ẹni tí ó dúró níbẹ̀, ó sọ fún ìyá rẹ̀ pé, “Obìnrin[a], wò ó, ọmọ rẹ nìyí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ ìpè Gíríìkì yìí jẹ́ ọ̀rọ̀ ọ̀wọ̀, kì í ṣe ọ̀rọ̀ líle tàbí àfojúdi, bí “Obìnrin” ṣe lè dun sí òǹkàwé òde òní.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ipa àsopọ̀ ọ̀rọ̀ náà mọ́, ó sì fi ìtẹ̀síwájú tàbí àbájáde ìtàn hàn ní Yorùbá àdánidá.
- source_word: ἰδὼν
  choice: nígbà tí ... rí
  rationale: Ìtumọ̀ àkókò yìí mú ipa participle aorist náà jáde láì mú kí gbolohun Yorùbá le.
- source_word: τὴν μητέρα
  choice: ìyá rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé àpilẹ̀kọ ni Gíríìkì lò, ọ̀rọ̀ náà ń tọ́ka sí ìyá Jésù; arọ́pò-orúkọ oníhun jẹ́ àdánidá ní Yorùbá.
- source_word: τὸν μαθητὴν
  choice: ọmọ-ẹ̀yìn
  rationale: Ó ń tọ́ka sí ọmọ-ẹ̀yìn kan pàtó tí àyíká ìtàn Jòhánù ti dá mọ̀.
- source_word: παρεστῶτα
  choice: ẹni tí ó dúró níbẹ̀
  rationale: Ó fi hàn pé ọmọ-ẹ̀yìn náà wà níbẹ̀, ó sì dúró lẹ́gbẹ̀ẹ́ ibi ìṣẹ̀lẹ̀ náà.
- source_word: ὃν ἠγάπα
  choice: tí Jésù fẹ́ràn
  rationale: Dídárúkọ Jésù mú ẹni tí ó jẹ́ olùfẹ́ náà ṣe kedere ní Yorùbá láì yí ìtumọ̀ gbólóhùn ìbátan náà padà.
- source_word: λέγει
  choice: ó sọ fún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọ̀rọ̀ tààrà sọ; ó tún bá ìgbésẹ̀ alààyè inú ìtàn mu.
- source_word: Γύναι
  choice: Obìnrin
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ, ó sì pa ọ̀rọ̀ ìpè Gíríìkì mọ́; àlàyé ìsàlẹ̀ ṣàlàyé pé kì í ṣe ọ̀rọ̀ àfojúdi.
- source_word: ἴδε
  choice: wò ó
  rationale: Àṣẹ deictic yìí ń pe ẹni náà láti kíyè sí ìkéde tó tẹ̀ lé e, ó sì ní agbára ju ‘wo’ lásán lọ.
- source_word: ὁ υἱός σου
  choice: ọmọ rẹ nìyí
  rationale: Ìkọ̀lé yìí jẹ́ Yorùbá àdánidá tó fi ọmọ-ẹ̀yìn náà hàn gẹ́gẹ́ bí ẹni tí Jésù ń pè ní ọmọ rẹ̀.
theological_decisions:
- issue: Ìró àti ìtumọ̀ ọ̀rọ̀ ìpè Γύναι sí Màríà
  choice: A lo “Obìnrin” nínú ẹsẹ̀, pẹ̀lú àlàyé ìsàlẹ̀ pé ọ̀rọ̀ ọ̀wọ̀ ni.
  alternative: A lè lò “Ìyá” tàbí “Obìnrin ọ̀wọ́n,” ṣùgbọ́n àwọn wọ̀nyí túmọ̀ ìró ọ̀rọ̀ náà ju ohun tí Gíríìkì sọ lọ.
  rationale: Γύναι kò ní ẹ̀gàn nínú àyíká yìí. Mímú “Obìnrin” dúró pa ìtumọ̀ tààrà mọ́, nígbà tí àlàyé ìsàlẹ̀ ń dènà òye àfojúdi tí òǹkàwé òde òní lè ní.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà ń ṣàn lọ́nà àdánidá, ṣùgbọ́n ó pa ọ̀rọ̀ ìpè tààrà àti ìwọ̀n ọlá inú orísun Gíríìkì mọ́.
