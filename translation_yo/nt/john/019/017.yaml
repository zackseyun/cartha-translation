id: JHN.19.17
reference: John 19:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: yo
  text: Ó sì gbé àgbélébùú náà fúnra rẹ̀[a], ó jáde lọ sí ibi tí a ń pè ní Ibi Agbárí, tí a ń pè ní Gọ́lgọ́tà ní èdè Hébérù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní èdè Aramaiki.” Ọ̀rọ̀ tí Johanu lò fún “ní èdè Hébérù” lè tọ́ka sí èdè Semitiki tí àwọn ènìyàn ń sọ ní Jùdíà nígbà náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: gbé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígbé ohun kan ní ti ara; “gbé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìṣe náà mu.
- source_word: αὑτῷ τὸν σταυρόν
  choice: àgbélébùú náà fúnra rẹ̀
  rationale: Èyí pa agbára arọ́pò-orúkọ ìpadà-sẹ́yìn mọ́, pé òun fúnra rẹ̀ ló gbé e, láìfi ìní tí Gíríìkì kò sọ ní tààràtà kún un.
- source_word: σταυρός
  choice: àgbélébùú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún ohun tí a fi kan Jesu mọ́; Gíríìkì níbí kò fi dandan sọ pé igi àgbélébùú apá nìkan ni.
- source_word: ἐξῆλθεν
  choice: ó jáde lọ
  rationale: Ó túmọ̀ sí pé ó jáde kúrò ní ibì kan; “jáde lọ” jẹ́ ìtumọ̀ Yorùbá àdánidá.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: ibi tí a ń pè ní Ibi Agbárí
  rationale: Ìtumọ̀ yìí pa ìlànà orúkọ ibi náà àti ìtumọ̀ κρανίον, “agbárí,” mọ́ ní Yorùbá tó ṣe kedere.
- source_word: Ἑβραϊστί
  choice: ní èdè Hébérù
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ “ní Hébérù”; ìtumọ̀ àkọ́kọ́ gbọ́dọ̀ pa ọ̀rọ̀ orísun mọ́, nígbà tí àlàyé ìṣeéṣe Aramaiki wà ní àlàyé ìsàlẹ̀.
- source_word: Γολγοθα
  choice: Gọ́lgọ́tà
  rationale: Orúkọ ibi ni; a ṣe àkọsílẹ̀ ìró rẹ̀ ní ọ̀nà tó bá èdè Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ Ἑβραϊστί gẹ́gẹ́ bí Hébérù tàbí Aramaiki
  choice: ní èdè Hébérù
  alternative: ní èdè Aramaiki
  rationale: Gíríìkì sọ Hébérù ní tààràtà, nítorí náà àkọ́kọ́ pa èyí mọ́. Síbẹ̀, ọ̀rọ̀ Johanu lè tọ́ka sí èdè Semitiki àdúgbò Jùdíà, èyí tí ó lè jẹ́ Aramaiki; a fi ìṣeéṣe yẹn sí àlàyé ìsàlẹ̀ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo “fúnra rẹ̀” láti tẹnu mọ́ ẹni tó gbé àgbélébùú náà, láìsọ pé “tirẹ̀” níbi tí ọ̀rọ̀ Gíríìkì ti ní àìdánilójú díẹ̀.
