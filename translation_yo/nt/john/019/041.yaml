id: JHN.19.41
reference: John 19:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: yo
  text: Ní ibi tí a ti kàn án mọ́ àgbélébùú, ọgbà kan wà; nínú ọgbà náà sì ni ibojì tuntun kan wà, nínú èyí tí a kò tíì tẹ́ ẹnikẹ́ni sí rí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ àsopọ̀ ọ̀tọ̀ ní ìbẹ̀rẹ̀
  rationale: Ó jẹ́ àmì ìyípadà kékeré nínú ìtàn; ìṣàn gbólóhùn Yorùbá ti fi ìbáṣepọ̀ náà hàn láìfi ‘nísinsin yìí’ tàbí ìtakò tí kò sí nínú Gíríìkì kún un.
- source_word: τόπῳ
  choice: ibi
  rationale: ‘Ibi’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì bá àyíká ìtàn yìí mu.
- source_word: ὅπου ἐσταυρώθη
  choice: tí a ti kàn án mọ́ àgbélébùú
  rationale: Ìlò ‘a’ aláìdárúkọ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe tí olùṣe rẹ̀ kò jẹ́ kókó, ó sì pa ìfọkànsìn gbolohun Gíríìkì mọ́ lórí ẹni tí a kàn mọ́ àgbélébùú.
- source_word: κῆπος
  choice: ọgbà
  rationale: ‘Ọgbà’ túmọ̀ sí garden láìfi irú ohun ọ̀gbìn pàtó kan kún ọrọ̀ náà.
- source_word: μνημεῖον
  choice: ibojì
  rationale: ‘Ibojì’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi ìsìnkú, ó sì yẹ fún ibi tí a ti lè tẹ́ òkú sí.
- source_word: καινόν
  choice: tuntun
  rationale: Ó pa ìtumọ̀ ‘tuntun’ mọ́; gbólóhùn tó tẹ̀ lé ló ṣàlàyé pé a kò tíì lò ó.
- source_word: ἐν ᾧ
  choice: tí ... sí
  rationale: Àkójọpọ̀ yìí tọ́ka padà sí ibojì náà lọ́nà tó ṣe àdánidá ní Yorùbá.
- source_word: οὐδέπω οὐδεὶς
  choice: a kò tíì ... ẹnikẹ́ni ... rí
  rationale: ‘Kò tíì ... rí’ pa ìtumọ̀ àkókò ‘títí di ìgbà náà’ mọ́, ‘ẹnikẹ́ni’ sì bá àìlódì Gíríìkì mu.
- source_word: ἦν τεθειμένος
  choice: tẹ́ ... sí
  rationale: Nínú àyíká ìsìnkú, ‘tẹ́ ẹni sí ibojì’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi òkú sínú ibojì; ó tún fi ipò tí ó ti wáyé ṣáájú hàn pẹ̀lú ‘kò tíì ... rí.’
theological_decisions:
- issue: Ọ̀rọ̀ àyíká ìsìnkú fún μνημεῖον àti τεθειμένος
  choice: ibojì ... tẹ́ ẹnikẹ́ni sí
  alternative: isà òkú ... gbé ẹnikẹ́ni sí
  rationale: Àṣàyàn yìí fi àyíká ìsìnkú hàn kedere láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un; ‘gbé ... sí’ lè dà bí gbígbé ohun lasán.
- issue: Ohùn ἐσταυρώθη
  choice: tí a ti kàn án mọ́ àgbélébùú
  alternative: tí wọ́n ti kàn án mọ́ àgbélébùú
  rationale: ‘A’ aláìdárúkọ jẹ́ àfihàn tó sún mọ́ passive ní Yorùbá, kò sì sọ àwọn olùṣe náà di kókó tàbí fi olùṣe pàtó kún orísun.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a kò lo ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
