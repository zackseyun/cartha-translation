id: JHN.19.21
reference: John 19:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: yo
  text: Nítorí náà, àwọn olórí àlùfáà àwọn Júù[a] ń sọ fún Pílátù pé, “Má ṣe kọ pé, ‘Ọba àwọn Júù,’ ṣùgbọ́n pé ẹni yẹn sọ pé, ‘Èmi ni ọba àwọn Júù.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará ilẹ̀ Jùdíà” / “Ọba àwọn ará ilẹ̀ Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn Júù lápapọ̀ tàbí sí àwọn ará ilẹ̀ Jùdíà ní pàtó, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń sọ ọ́ léraléra; “ń sọ” pa ìtumọ̀ yẹn mọ́ ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ohun tí wọ́n sọ pọ̀ mọ́ ohun tó ṣẹlẹ̀ ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó ń tọ́ka sí àwọn aṣáájú alufaa, kì í ṣe pé ọ̀pọ̀ ènìyàn ló ń di olórí alufaa kan ṣoṣo mú lẹ́ẹ̀kan náà.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Èyí ni ọ̀nà tí ó wọ́pọ̀, tí ó sì ṣe kedere fún orúkọ ìṣèlú àti ẹ̀sìn náà, “Ọba àwọn Júù”; àṣàyàn “àwọn ará Jùdíà” wà nínú àlàyé ìsàlẹ̀.
- source_word: Μὴ γράφε
  choice: Má ṣe kọ
  rationale: Ó tú àṣẹ ìdènà náà jáde ní Yorùbá àdánidá láìfi ìtumọ̀ míì kún un.
- source_word: ἀλλ’ ὅτι
  choice: ṣùgbọ́n kọ pé
  rationale: “Ṣùgbọ́n” pa ìtakora mọ́, a sì tún ọ̀rọ̀-ìṣe “kọ” ṣe nítorí kíkún gbólóhùn ní Yorùbá, bó tilẹ̀ jẹ́ pé a fi í sílẹ̀ láìtún un sọ nínú Gíríìkì.
- source_word: ἐκεῖνος
  choice: Ẹni yẹn
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò-orúkọ atọ́ka náà mọ́, pẹ̀lú ìjìnnà tàbí ìfojú-kéré tó lè wà nínú rẹ̀, láìfi “ọkùnrin” tí kò ṣe pàtàkì kún un.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Ọba àwọn Júù ni mí
  rationale: Ètò gbólóhùn yìí jẹ́ Yorùbá àdánidá fún orúkọ ipò tí a fi ṣe àpèjúwe ẹni; kò sì fi ọ̀rọ̀ kan tó bá definite article Gíríìkì mu kún un ní gbangba.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú ìtàn ìjìyà Jésù gẹ́gẹ́ bí Jòhánù ṣe kọ ọ́
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: “Àwọn Júù” bá orúkọ ìṣèlú àti ẹ̀sìn tó wà lórí àkọlé náà mu, ó sì yé òǹkàwé Yorùbá lónìí. Síbẹ̀, ọ̀rọ̀ Gíríìkì lè túmọ̀ sí àwọn ará Jùdíà ní àwọn àyíká kan, nítorí náà a pa àṣàyàn náà mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Bóyá a ó fi ohun tó bá definite article mu sínú “Βασιλεὺς τῶν Ἰουδαίων εἰμί”
  choice: Ọba àwọn Júù ni mí
  alternative: Èmi ni Ọba àwọn Júù
  rationale: Gíríìkì kò ní article níwájú βασιλεύς nínú gbólóhùn yìí. Yorùbá kò ní definite article tó bá ti Gíríìkì tàbí Gẹ̀ẹ́sì mu tààrà, nítorí náà a lo ìṣètò àsọyé Yorùbá tí kò pinnu ọ̀ràn náà ju ohun tí orísun sọ lọ.
translation_notes:
  register: A lo Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere, tó sì jẹ́ ti òde òní. “Àwọn olórí àlùfáà” jẹ́ ọ̀rọ̀ ẹ̀sìn tó ti wọ́pọ̀; “Ẹni yẹn” pa ìjìnnà inú ἐκεῖνος mọ́. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì ṣètò àwọn ọ̀rọ̀ inú ọ̀rọ̀ àyọlò kí ìpele ọ̀rọ̀ kọ̀ọ̀kan lè ṣe kedere.
