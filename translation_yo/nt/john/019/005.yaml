  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: yo
  text: Nítorí náà, Jésù jáde wá, ó wọ adé ẹ̀gún àti aṣọ àwọ̀ elése àlùkò. Pílátù sì sọ fún wọn pé, “Ẹ wò ó, ènìyàn náà!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Wò ó, ènìyàn náà.” Ọ̀rọ̀ Gíríìkì náà, Ἰδοὺ, jẹ́ ọ̀rọ̀ ìpe àfiyèsí; ó lè túmọ̀ sí “Ẹ wò ó,” “Ẹ wo,” tàbí “Ẹ kíyèsí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: Nítorí náà, Jésù jáde wá
  rationale: Ọ̀rọ̀ yìí fi ìtẹ̀síwájú tàbí àbájáde ìṣẹ̀lẹ̀ hàn, ó sì pa ìtẹnumọ́ ìjáde síta mọ́. ‘Jáde wá’ bá ojú-ìwòye àwọn tí a ń mú Jésù wá sí iwájú wọn mu.
- source_word: φορῶν
  choice: ó wọ
  rationale: Ó túmọ̀ sí pé ohun náà wà lára ẹni gẹ́gẹ́ bí aṣọ tàbí ohun ọ̀ṣọ́; ‘ó wọ’ jẹ́ èdè Yorùbá àdánidá níhìn-ín.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: adé ẹ̀gún
  rationale: Ó ń tọ́ka sí adé tí a fi ẹ̀gún ṣe, kì í ṣe adé tí ó kàn ní ìbáṣepọ̀ pẹ̀lú ẹ̀gún.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: aṣọ àwọ̀ elése àlùkò
  rationale: ἱμάτιον jẹ́ aṣọ òde ní gbogbogbòò; yíyan ‘aṣọ’ kò fi irú aṣọ kan pàtó kún ohun tí orísun kò sọ. ‘Àwọ̀ elése àlùkò’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ àwọ̀ púpọ̀lù.
- source_word: λέγει αὐτοῖς
  choice: Pílátù sì sọ fún wọn pé
  rationale: Àwọn ẹsẹ tó ṣáájú fi hàn pé Pílátù ni olùsọ̀rọ̀. Dídárúkọ rẹ̀ mú Yorùbá ṣe kedere láì yí olùsọ̀rọ̀ padà; àsìkò ìsinsìnyí Gíríìkì jẹ́ historical present, ṣùgbọ́n àsìkò àtẹ̀yìnwá ni ó dára jù lọ nínú ìtàn Yorùbá.
- source_word: Ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ ìpe àfiyèsí. ‘Ẹ wò ó’ jẹ́ ti àdánidá, ó sì pa agbára ìfihàn ní gbangba mọ́.
- source_word: ὁ ἄνθρωπος
  choice: ọkùnrin náà
  rationale: Ó ń tọ́ka sí Jésù, ọkùnrin pàtó tí Pílátù ń fi hàn fún àwọn ènìyàn. Ìtumọ̀ yìí kò fi ìtumọ̀ ẹ̀kọ́ nípa aṣojú gbogbo ẹ̀dá ènìyàn kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ ὁ ἄνθρωπος nínú ọ̀rọ̀ Pílátù
  choice: ọkùnrin náà
  alternative: ènìyàn náà
  rationale: Ọ̀rọ̀ náà ń tọ́ka ní tààrà sí Jésù gẹ́gẹ́ bí ọkùnrin tí a mú wá síwájú ogunlọ́gọ̀. ‘Ọkùnrin náà’ pa ìtọ́kasí pàtó àti abo rẹ̀ mọ́; bí ó tilẹ̀ jẹ́ pé àwọn kan lè gbọ́ ìtumọ̀ jíjinlẹ̀ nípa ẹ̀dá ènìyàn nínú rẹ̀, a kò gbọ́dọ̀ fi ìtumọ̀ yẹn rọ́pò ìtumọ̀ ojú-ìwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àdánidá, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ nínú ‘Ẹ wò ó’ nítorí pé Pílátù ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀. A fi àmì ohùn sí ibi tí ó yẹ.
