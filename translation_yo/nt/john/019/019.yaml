id: JHN.19.19
reference: John 19:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: yo
  text: 'Pílátù tún kọ àkọlé kan, ó sì fi í sí àgbélébùú náà. A kọ ọ́ pé: “Jésù ará Násárétì, Ọba àwọn Júù[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọba àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn Júù lápapọ̀ tàbí sí àwọn ará Jùdíà ní pàtó, ó da lórí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: àkọlé
  rationale: Nínú ọ̀rọ̀ ìkàn mọ́ àgbélébùú yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí a kọ sí àkọsílẹ̀ tí a fi hàn ní gbangba. “Àkọlé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá gbólóhùn tó tẹ̀ lé e mu.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: ó sì fi í sí orí àgbélébùú náà
  rationale: Èyí dúró mọ́ ọ̀rọ̀ Gíríìkì pé a fi àkọlé náà sí ara tàbí sí orí àgbélébùú, láì fi ìtumọ̀ àfikún pé ó wà lókè àgbélébùú sínú ẹsẹ náà.
- source_word: γεγραμμένον
  choice: A kọ ọ́ pé
  rationale: Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá fún bí a ṣe ń sọ ohun tí àkọlé kan ní, ó sì pa ìtumọ̀ pé ọ̀rọ̀ náà wà ní àkọsílẹ̀ mọ́.
- source_word: Ναζωραῖος
  choice: ará Násárétì
  rationale: “Ará Násárétì” jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó wọ́pọ̀ láti fi orúkọ ìlú ẹni dá a mọ̀, bí ọ̀rọ̀ Gíríìkì ṣe ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ìdánimọ̀.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: Nínú àkọlé ẹ̀sùn ọba yìí, “àwọn Júù” gbé ìtumọ̀ tó wọ́pọ̀ àti agbára ọ̀rọ̀ náà jáde. Ìtumọ̀ “àwọn ará Jùdíà” tó tún ṣeé ṣe ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: δὲ καὶ
  choice: tún
  rationale: “Tún” fi agbára àfikún ọ̀rọ̀ náà hàn lọ́nà Yorùbá tó rọrùn.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tó fìdí múlẹ̀ ní Yorùbá.
- source_word: Πιλᾶτος
  choice: Pílátù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tó fìdí múlẹ̀ ní Yorùbá.
- source_word: σταυροῦ
  choice: àgbélébùú
  rationale: “Àgbélébùú” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ohun èlò ìkàn mọ́ni nínú ìtàn ìjìyà Jésù mu.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú àkọlé náà
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Nínú àkọlé ọba tí a fi sí Jésù, “àwọn Júù” bá ìtumọ̀ tó wọ́pọ̀ jù àti ọ̀rọ̀ ẹ̀sùn náà mu. Síbẹ̀, ọ̀rọ̀ Gíríìkì lè túmọ̀ sí àwọn ará Jùdíà ní àwọn àyíká kan, nítorí náà a pa àṣàyàn yẹn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yan gbólóhùn Yorùbá àdánidá láì mú ìyàtọ̀ ìtumọ̀ tó wà nínú ọ̀rọ̀ Gíríìkì kúrò.
