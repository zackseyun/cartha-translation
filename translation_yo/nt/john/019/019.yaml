  terminology: “Pílátù,” “Jésù,” “Násárétì,” “àgbélébùú,” àti “Ọba àwọn Júù” jẹ́ àwọn ọ̀rọ̀ tó bójú mu nínú Yorùbá. Àlàyé ìsàlẹ̀ náà dáàbò bo ìyàtọ̀ ìtumọ̀ tó wà nínú Ἰουδαίων láì pinnu rẹ̀ ju bó ṣe yẹ lọ.
