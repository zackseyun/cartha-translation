  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbòò: Pílátù ni kókó-ọrọ náà, ó kọ ìkéde/àkọlé kan, ó sì fi í mọ́ àgbélébùú; a tún pa ọ̀rọ̀ àkọlé náà mọ́ ní kíkún. Ṣùgbọ́n “sí orí àgbélébùú náà” lè sọ pé a fi sí òkè àgbélébùú, nígbà tí ἐπὶ τοῦ σταυροῦ sọ pé a fi í sí àgbélébùú náà. A yẹ kí a má ṣe ṣàfikún ipò ‘lókè’ náà.'
