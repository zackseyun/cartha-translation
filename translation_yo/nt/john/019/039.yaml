source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: yo
  text: Níkódémù náà sì wá—ẹni tí ó ti wá bá a ní òru ní ìṣáájú[b]—ó mú àdàlù òjíá àti alóè wá, tó fẹ́rẹ̀ẹ́ jẹ́ ọgọ́rùn-ún lítrà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lítrà kan jẹ́ ìwọ̀n pọ́ǹdì Róòmù, ó tó nǹkan bí gíráàmù 327; ọgọ́rùn-ún lítrà jẹ́ nǹkan bí kìlógíráàmù 32 sí 33 (ìyẹn, nǹkan bí pọ́ǹdì 72).
    reason: cultural_note
  - marker: b
    text: Tàbí, “ẹni tí ó ti wá bá a ní òru ní ìṣáájú,” èyí ń ránni létí Jòhánù 3:1–2.
    reason: cross_reference
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ Νικόδημος
  choice: Níkódémù náà sì wá
  rationale: “Náà” ń pa agbára àfikún καί mọ́, “sì” sì jẹ́ àsopọ̀ ìtàn tí ó bá δέ mu láì sọ ọ́ di ohun tí ó lágbára jù.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: ẹni tí ó kọ́kọ́ tọ̀ ọ́ wá ní òru
  rationale: Gbólóhùn yìí ń dá Níkódémù mọ̀ gẹ́gẹ́ bí ẹni tí ó ti tọ Jesu wá ní òru ní ìṣáájú; “kọ́kọ́” pa ìtọ́kasí τὸ πρῶτον mọ́ láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: φέρων
  choice: ó mú … wá
  rationale: Ìṣe tí participle náà ń fi kún wíwá Níkódémù ni a sọ ní ọ̀nà àdánidá Yorùbá pé ó mú ohun náà wá.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: àdàlù òjíá àti alóè
  rationale: “Àdàlù” túmọ̀ míγμα ní kedere; “òjíá” ni ọ̀rọ̀ Yorùbá fún myrrh, “alóè” sì jẹ́ àkọsílẹ̀ orúkọ ohun olóòórùn dídùn tí a lò fún ìṣètò òkú, kì í ṣe dandan ewé aloe ilé òde òní.
- source_word: ὡς λίτρας ἑκατόν
  choice: ìwọ̀n rẹ̀ sì jẹ́ nǹkan bí ọgọ́rùn-ún lítrà
  rationale: “Nǹkan bí” pa ìsúnmọ́ iye tí ὡς fi hàn mọ́; lítrà ni a yá láti pa ẹ̀ka ìwọ̀n Róòmù àtijọ́ mọ́, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí αὐτόν ń tọ́ka sí nínú gbólóhùn ìdánimọ̀
  choice: “ọ́” ń tọ́ka sí Jesu
  alternative: Láti tún orúkọ “Jesu” sọ ní tààrà
  rationale: Àyíká ìtàn Jòhánù 3:1–2 fi hàn pé Jesu ni a ń tọ́ka sí. Lílo arọ́pò-orúkọ pa irú ọ̀nà tí orísun Gíríìkì gbà sọ ọ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A fi dásì sínú gbólóhùn láti ya àlàyé ìdánimọ̀ Níkódémù sọ́tọ̀, a sì ṣètò àmì àlàyé [b] lẹ́yìn gbólóhùn ìrántí àti [a] lẹ́yìn ẹ̀ka ìwọ̀n tí ọkọọkan ń ṣàlàyé.
