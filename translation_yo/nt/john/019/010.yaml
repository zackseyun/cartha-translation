id: JHN.19.10
reference: John 19:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: yo
  text: Nítorí náà, Pílátù sọ fún un pé, “Ṣé o kò ní bá mi sọ̀rọ̀? Ṣé o kò mọ̀ pé mo ní àṣẹ[a] láti dá ọ sílẹ̀, mo sì ní àṣẹ láti kàn ọ́ mọ́ àgbélébùú?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “agbára” dípò “àṣẹ.” Ọ̀rọ̀ Gíríìkì exousia lè túmọ̀ sí àṣẹ, ẹ̀tọ́, tàbí agbára. “Àṣẹ” ló bá ibi tí Pílátù ti ń sọ̀rọ̀ gẹ́gẹ́ bí alákòóso àti adájọ́ mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: Nítorí náà, Pílátù sọ fún un pé
  rationale: “Nítorí náà” pa ipa ìsopọ̀ àti ìtẹ̀síwájú οὖν mọ́; “sọ fún un” fi dative αὐτῷ hàn ní Yorùbá àdánidá.
- source_word: Ἐμοὶ οὐ λαλεῖς;
  choice: Ṣé o kò ní bá mi sọ̀rọ̀?
  rationale: “bá mi sọ̀rọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtẹnumọ́ Ἐμοὶ (“fún èmi”) àti ohùn ìbáwí ìbéèrè náà mọ́.
- source_word: οὐκ οἶδας ὅτι
  choice: Ṣé o kò mọ̀ pé
  rationale: Ó tẹ̀lé ìtumọ̀ gígùn ti οἶδα àti pé ὅτι ń mú àkóónú ohun tí Pílátù sọ wọlé.
- source_word: ἐξουσίαν ἔχω
  choice: mo ní àṣẹ
  rationale: “Àṣẹ” bá agbára tàbí ẹ̀tọ́ ìṣàkóso àti ìdájọ́ mu ju agbára lásán lọ ní àyíká ọ̀rọ̀ yìí.
- source_word: ἀπολῦσαί σε
  choice: láti dá ọ sílẹ̀
  rationale: Ní àyíká ìdájọ́, gbólóhùn yìí túmọ̀ sí fífi ẹni tí a mú sílẹ̀ lọ láìfi ìdáláre tàbí ìdálẹ́bi míì kún un.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: mo sì ní àṣẹ láti kàn ọ́ mọ́ àgbélébùú
  rationale: A tún “mo ní àṣẹ” sọ gẹ́gẹ́ bí Gíríìkì ṣe tún ἐξουσίαν ἔχω sọ, kí ìtẹnumọ́ àti ìyàtọ̀ láàárín àbájáde méjèèjì lè dúró.
theological_decisions:
- issue: Irú ἐξουσία tí Pílátù sọ pé òun ní
  choice: àṣẹ
  alternative: agbára; ẹ̀tọ́
  rationale: “Àṣẹ” ṣàfihàn ọ̀rọ̀ Pílátù nínú ipò ìṣàkóso àti òfin, ṣùgbọ́n kò fi ìdí rẹ̀ múlẹ̀ pé àṣẹ náà jẹ́ ti ara rẹ̀ pátápátá tàbí pé ó tọ́ ní ojú Ọlọ́run; ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ tó tẹ̀ lé yóò dáhùn ṣì wà.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìbéèrè “Ṣé” mú ohùn ìbáwí Pílátù jáde lọ́nà àdánidá, a sì pa àtúnsọ “mo ní àṣẹ” mọ́ fún ìtẹnumọ́.
