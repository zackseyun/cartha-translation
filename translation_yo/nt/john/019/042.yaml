id: JHN.19.42
reference: John 19:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: yo
  text: Nítorí náà, nítorí ọjọ́ ìmúrasílẹ̀ àwọn Júù[a], àti nítorí pé ibojì náà wà nítòsí, wọ́n gbé Jésù síbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nítorí ọjọ́ ìmúrasílẹ̀ Júù” tàbí “nítorí pé ó jẹ́ Ìmúrasílẹ̀ àwọn Júù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ọ̀rọ̀ atọ́ka ibi ni; fífi í sí inú gbólóhùn ‘níbẹ̀ ni’ pa ìtẹnumọ́ ibi ìsìnkú náà mọ́ ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àbájáde tàbí ìtẹ̀síwájú ìtàn.
- source_word: διὰ τὴν παρασκευὴν
  choice: nítorí ọjọ́ ìmúrasílẹ̀
  rationale: διά pẹ̀lú accusative fi ìdí tàbí okùnfà hàn; ‘ọjọ́ ìmúrasílẹ̀’ jẹ́ kó ṣeé lóye fún òǹkàwé òde òní láìsọ ìtumọ̀ kalẹ́ńdà rẹ̀ di pàtó ju orísun lọ.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó pa àkópọ̀ genitive Gíríìkì mọ́ nínú ‘ọjọ́ ìmúrasílẹ̀ àwọn Júù,’ láìfi ìdájọ́ ẹ̀sìn tàbí ti ẹ̀yà kún un.
- source_word: ὅτι
  choice: àti nítorí pé
  rationale: Ó mú ìdí kejì—pé ibojì náà sún mọ́ wọn—hàn kedere ní Yorùbá, bó tilẹ̀ jẹ́ pé a tún lè ka a gẹ́gẹ́ bí àlàyé ìdí tí wọ́n fi yan ibojì náà.
- source_word: ἐγγὺς
  choice: wà nítòsí
  rationale: Ìtumọ̀ àdánidá ni fún jíjẹ́ pé ibojì náà sún mọ́ ibi tí wọ́n wà.
- source_word: μνημεῖον
  choice: ibojì
  rationale: Ní àyíká ìsìnkú yìí, ‘ibojì’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún ibi tí a pèsè láti tẹ́ òkú sí.
- source_word: ἔθηκαν
  choice: wọ́n tẹ́ ... sí
  rationale: Ní àyíká ìsìnkú, gbólóhùn yìí sọ fífi Jésù sínú ibojì lọ́nà àdánidá, ó sì sún mọ́ ìṣe ‘gbígbé/fífi sí’ tí τίθημι túmọ̀ sí.
- source_word: τὸν Ἰησοῦν
  choice: Jésù
  rationale: Orúkọ ẹni tí ọ̀rọ̀-ìṣe náà kan ni; a lo ìkọ̀wé orúkọ tí ó wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ παρασκευή nínú àyíká ìjìyà àti ikú Jésù
  choice: ọjọ́ ìmúrasílẹ̀
  alternative: Ìmúrasílẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ orúkọ ọjọ́ pàtó, ṣùgbọ́n ‘ọjọ́ ìmúrasílẹ̀’ ṣàlàyé rẹ̀ fún òǹkàwé òde òní láìfi ẹ̀kọ́ kalẹ́ńdà kan tí ẹsẹ náà kò sọ kún un.
- issue: Ìtumọ̀ τῶν Ἰουδαίων nínú ìtàn Jòhánù
  choice: ọjọ́ ìmúrasílẹ̀ àwọn Júù
  alternative: ọjọ́ ìmúrasílẹ̀ Júù; Ìmúrasílẹ̀ àwọn Júù
  rationale: Èyí tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì, kò sì mú kí gbólóhùn náà rọ̀ tàbí le ju bí orísun ṣe sọ ọ́ lọ. Níhìn-ín, ó tọ́ka sí ọjọ́ ìmúrasílẹ̀ nínú àṣà àwọn Júù, kì í ṣe ìdájọ́ lórí àwọn Júù.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn láti lóye. A lo ‘níbẹ̀ ni’ láti mú ìtọ́kasí ibi àti ìtẹnumọ́ ἐκεῖ jáde lọ́nà Yorùbá àdánidá.
