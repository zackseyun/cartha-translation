  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: yo
  text: Ìwé Mímọ́ mìíràn sì tún wí pé:[a] “Wọ́n yóò wo ẹni tí wọ́n gún.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Wọ́n yóò yíjú sí ẹni tí wọ́n gún.” Ìṣètò ọ̀rọ̀ Gíríìkì lè túmọ̀ sí wíwo ẹni náà tàbí yíyíjú sí i; ọ̀rọ̀ náà sì ń tọ́ka sí Sekaráyà 12:10.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé àyọlò Ìwé Mímọ́ mìíràn ni a ń fi kún èyí tí ó ṣáájú; ‘tún’ jẹ́ àsopọ̀ àdánidá ní Yorùbá.
- source_word: ἑτέρα γραφή
  choice: Ìwé Mímọ́ mìíràn
  rationale: γραφή níbí ń tọ́ka sí Ìwé Mímọ́, ἑτέρα sì ń fi ẹ̀rí míì kún un; gbolohun yìí ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: λέγει
  choice: sọ pé
  rationale: Ọ̀rọ̀ ìsinsìnyí nínú Gíríìkì ń gbé Ìwé Mímọ́ kalẹ̀ bí ohun tí ó ṣì ń sọ̀rọ̀; ‘sọ pé’ jẹ́ ọ̀nà àdánidá láti mú àyọlò wọlé.
- source_word: Ὄψονται
  choice: Wọn yóò wo
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwo tí a darí sí ẹnìkan, kì í ṣe rírí lásán; ‘wo’ dá ìdarí ojú sí ẹni náà mọ́.
- source_word: εἰς ὃν
  choice: ẹni tí
  rationale: Lẹ́yìn ọ̀rọ̀-ìṣe wíwo, εἰς ń tọ́ka sí ẹni tí ojú wọn yóò yí sí. Yorùbá ‘wo ẹni tí’ lè gba ìtumọ̀ wíwo sí i tàbí wíwo ẹni náà, nítorí náà ó pa ààyè ìtumọ̀ Gíríìkì mọ́ láìfi ọ̀rọ̀ àfikún sí i.
- source_word: ἐξεκέντησαν
  choice: wọ́n gún
  rationale: Aoristi aláṣe náà tọ́ka sí ìṣe gígún wọ inú ara. ‘Gún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ àgbélébùú àti ìtọ́kasí sí Sekaráyà mu.
theological_decisions:
- issue: Bí a ṣe lè pa agbára ìtọ́kasí sí Sekaráyà àti ìtumọ̀ rẹ̀ nípa Kristi mọ́ láìkó ọ̀rọ̀ míì láti inú Sekaráyà wọ inú ọ̀rọ̀ Johanu
  choice: “Wọn yóò wo ẹni tí wọ́n gún.”
  alternative: “Wọn yóò yíjú sí ẹni tí wọ́n gún.”
  rationale: Ọ̀rọ̀ Gíríìkì Johanu fúnra rẹ̀ ni a tẹ̀ lé. ‘Ẹni tí’ fi ẹni tí a gún hàn gbangba ní ọ̀nà Yorùbá, ó sì jẹ́ kí àyíká ọ̀rọ̀ dá ẹni náà mọ̀ mọ́ Jésù, láìfi ọ̀rọ̀ ẹni-kìíní Ọlọ́run láti Sekaráyà 12:10 kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
