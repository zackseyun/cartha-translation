id: JHN.19.11
reference: John 19:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: yo
  text: Jésù dá a lóhùn pé, “Ìwọ kì bá ní àṣẹ kankan lórí mi, bí a kò bá ti fi í fún ọ láti òkè[a]. Nítorí náà, ẹni tí ó fi mí lé ọ lọ́wọ́[b] ní ẹ̀ṣẹ̀ tó pọ̀ ju.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láti ọ̀run.” Gíríìkì ní “láti òkè,” èyí tí ó sábà máa ń tọ́ka sí orísun ti Ọlọ́run nínú ìwé Jòhánù.
    reason: lexical_alternative
  - marker: b
    text: A kò dárúkọ ẹni tí ó fi Jésù lé Pílátù lọ́wọ́ níbí. Àwọn kan lóye rẹ̀ sí Júdásì, àwọn mìíràn sí Káyáfà, tàbí sí àwọn aṣáájú Júù lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: “Àṣẹ” sọ ẹ̀tọ́ àti agbára ìṣàkóso tí Pílátù ní nínú ọ̀rọ̀ ìdájọ́ yìí; kò dín un kù sí agbára ara lásán.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: àṣẹ kankan lórí mi
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún àṣẹ tí ẹnìkan ní lórí ẹlòmíràn, “kankan” sì pa ìtẹnumọ́ οὐδεμίαν mọ́.
- source_word: δεδομένον σοι
  choice: a kò bá ti fi í fún ọ
  rationale: Àpólà náà fi hàn pé fífi àṣẹ náà fún un ti ṣáájú àṣẹ tí ó ń lò báyìí; lílo “ti” mú ìbáṣepọ̀ àkókò yẹn jáde.
- source_word: ἄνωθεν
  choice: láti òkè
  rationale: Èyí pa àwòrán àti ìtumọ̀ gíríìkì “láti òkè” mọ́, ó sì jẹ́ kí ìtọ́kasí sí orísun ọ̀run dúró láìfi “láti ọ̀run” sínú ẹsẹ̀ gẹ́gẹ́ bí ìtumọ̀ tó ti túmọ̀ sí i jù.
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó mú ìsopọ̀ ìdí àti àbájáde inú gbólóhùn náà jáde ní Yorùbá tó wọ́pọ̀.
- source_word: ὁ παραδούς μέ σοι
  choice: ẹni tí ó fi mí lé ọ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí bá fífi ẹni kan lé ẹlòmíràn lọ́wọ́ mu, kò sì dá ẹni tí a ń tọ́ka sí mọ̀ gẹ́gẹ́ bí Júdásì, Káyáfà, tàbí àwọn aṣáájú Júù.
- source_word: μείζονα ἁμαρτίαν
  choice: ẹ̀ṣẹ̀ títóbi sí i
  rationale: Ó pa ìfiwéra “ẹ̀ṣẹ̀ tí ó tóbi jù” mọ́ láìyí i sí ẹ̀ṣẹ̀ títóbi jù lọ nínú gbogbo ẹ̀ṣẹ̀, tàbí láìrọ́pò “ẹ̀ṣẹ̀” pẹ̀lú “ẹ̀bi.”
theological_decisions:
- issue: Orísun àṣẹ Pílátù tí ἄνωθεν ń tọ́ka sí
  choice: “láti òkè,” pẹ̀lú àlàyé pé ó ń tọ́ka sí orísun ọ̀run tàbí ti Ọlọ́run
  alternative: “láti ọ̀run”
  rationale: Ẹsẹ̀ náà gbé àṣẹ Pílátù lé orísun gíga kan, ṣùgbọ́n kò ṣe àlàyé ẹ̀kọ́ ìṣèlú tó gbòòrò; ìtumọ̀ yìí pa ìwọ̀ntúnwọ̀nsì yẹn mọ́.
- issue: Ta ni ὁ παραδούς μέ σοι ń tọ́ka sí?
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó fi mí lé ọ lọ́wọ́”
  alternative: Júdásì, Káyáfà, tàbí àwọn aṣáájú Júù lápapọ̀
  rationale: Gíríìkì kò dárúkọ ẹni náà níbí; ṣíṣàìdá a mọ̀ pa àìdánilójú gidi inú ẹsẹ̀ náà mọ́.
- issue: Ìfiwéra inú μείζονα ἁμαρτίαν
  choice: “ẹ̀ṣẹ̀ títóbi sí i,” láìsọ ẹni tí a fi wé e ní tààrà
  alternative: “ẹ̀ṣẹ̀ tí ó tóbi ju tìrẹ lọ”
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí Pílátù gẹ́gẹ́ bí ẹni tí a fi wé e, ṣùgbọ́n orísun kò sọ ọ́ ní gbangba; a pa ìfiwéra náà mọ́ láìfikún ohun tí kò fara hàn.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Fi mí lé ọ lọ́wọ́” jẹ́ àṣàyàn àdánidá fún ọ̀rọ̀ ìdájọ́ àti ìfijọni; a yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan àti fún dídá àwọn ohun tí orísun fi sí àìdánilójú mọ̀.
