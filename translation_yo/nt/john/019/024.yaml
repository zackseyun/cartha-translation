    rationale: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν jẹ́ ‘Àwọn ọmọ ogun náà sì ṣe nǹkan wọ̀nyí,’ kì í ṣe gbolohun ìfọwọ́sí tàbí ìbéèrè ní Yorùbá.
  - severity: medium
    issue: Àlàyé a lo ‘dìbò’ gẹ́gẹ́ bí yíyan ọ̀rọ̀ mìíràn fún ṣíṣe kèké.
