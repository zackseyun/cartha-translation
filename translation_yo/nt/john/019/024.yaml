  source_fidelity: Ìtumọ̀ ọ̀rọ̀ àwọn ọmọ ogun àti ọ̀rọ̀ Sáàmù náà sún mọ́ Gíríìkì. Síbẹ̀, gbolohun ìmúṣẹ Ìwé Mímọ́ nínú àpẹẹrẹ náà kò ṣeé túmọ̀ dáadáa ní Yorùbá (‘kí Ìwé Mímọ́ tí ó sọ pé yóò lè ṣẹ’), ó sì dà bí ẹni pé Ìwé Mímọ́ fúnra rẹ̀ ni yóò ṣẹlẹ̀. Gbolohun ìkẹyìn náà náà kò túmọ̀ Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν ní tààrà.
  naturalness: Ọ̀pọ̀ ìpínrọ̀ náà dára, ìfẹ̀sọ̀rọ̀ àwọn ọmọ ogun sì jẹ́ ti ẹnu. Ṣùgbọ́n a nílò láti tún gbolohun ìmúṣẹ náà àti ìparí ẹsẹ̀ ṣe kí Yorùbá náà lè rọrùn, kedere, àti pé.
  terminology: ‘Ìwé Mímọ́,’ ‘àwọn aṣọ,’ ‘ẹ̀wù,’ àti ‘ṣẹ́ kèké’ bá ọ̀rọ̀ inú ẹsẹ̀ mu. Àlàyé ìsàlẹ̀ a yí padà láti máa pe ṣíṣe kèké ní ‘dìbò,’ nítorí dìbò lè túmọ̀ sí ìdìbò/ìbò òde òní, kì í ṣe yíyan nípa kèké.
  issues:
