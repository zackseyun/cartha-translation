id: JHN.19.24
reference: John 19:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: yo
  text: 'Nítorí náà, wọ́n sọ fún ara wọn pé, “Ẹ jẹ́ ká má fà á ya, ṣùgbọ́n ká ṣẹ́ kèké lé e lórí, kí a sì mọ ẹni tí yóò ní í.” Èyí ṣẹlẹ̀ láti mú Ìwé Mímọ́ ṣẹ, èyí tí ó sọ pé:


    “Wọ́n pín àwọn aṣọ mi láàárín ara wọn,

    wọ́n sì ṣẹ́ kèké lórí ẹ̀wù mi.”[b]


    Àwọn ọmọ ogun náà sì ṣe nǹkan wọ̀nyí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ọ̀rọ̀ tí a fa yọ láti Sáàmù 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: ká má fà á ya
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífa aṣọ ya; gbólóhùn náà jẹ́ Yorùbá àdánidá, ó sì bá ọ̀rọ̀ ẹ̀wù mu.
- source_word: αὐτόν
  choice: á / lé e lórí
  rationale: Bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ Gíríìkì jẹ́ akọ, ẹ̀wù tí a mẹ́nu kàn ṣáájú ni ó ń tọ́ka sí; arọ́pò-orúkọ Yorùbá kò ní akọ tàbí abo.
- source_word: λάχωμεν
  choice: ká ṣẹ́ kèké
  rationale: ‘Ṣẹ́ kèké’ jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún yíyan ẹni tí yóò gba ohun kan nípa kèké.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: lé e lórí, láti pinnu ẹni tí yóò ni ín
  rationale: Ó mú ète ṣíṣẹ́ kèké náà hàn ní Yorùbá tó ṣe kedere láìfi èrò tuntun kún ọ̀rọ̀ náà.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: Èyí ṣẹlẹ̀ kí Ìwé Mímọ́ ... yóò lè ṣẹ pé
  rationale: Ó pa ìlànà ìmúṣẹ Ìwé Mímọ́ ti Jòhánù mọ́, ṣùgbọ́n kò fi àlàyé ìpinnu Ọlọ́run tí ó lágbára ju ohun tí Gíríìkì sọ lọ kún un.
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà tọ́ka sí Ìwé Mímọ́, kì í ṣe àkọsílẹ̀ lásán.
- source_word: ἡ λέγουσα
  choice: tí ó sọ pé
  rationale: Ó ṣàgbékalẹ̀ ọ̀rọ̀ tí a fa yọ ní Yorùbá àdánidá.
- source_word: Διεμερίσαντο
  choice: Wọ́n pín
  rationale: Ó sọ ìpín àwọn aṣọ náà láàárín àwọn ọmọ ogun ní ṣókí àti ní kedere.
- source_word: ἱμάτιά
  choice: àwọn aṣọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣọ; yíyan ‘àwọn aṣọ’ jẹ́ èdè Yorùbá òde òní tí gbogbo ènìyàn lè lóye.
- source_word: ἑαυτοῖς
  choice: láàárín ara wọn
  rationale: Ó pa ìtumọ̀ pípín ohun náà fún àwọn ènìyàn inú ẹgbẹ́ náà mọ́.
- source_word: ἱματισμόν
  choice: ẹ̀wù
  rationale: ‘Ẹ̀wù’ pa ìyàtọ̀ díẹ̀ mọ́ láàárín ọ̀rọ̀ yìí àti ‘àwọn aṣọ’ tí ó wà ní ìlà ṣáájú, láìsọ irú ẹ̀wù kan pàtó.
- source_word: ἔβαλον κλῆρον
  choice: wọ́n sì ṣẹ́ kèké
  rationale: Ó ṣàfihàn ìṣe yíyan nípa kèké; Yorùbá kò nílò láti fi ọ̀rọ̀ ẹyọ ‘kèké kan’ hàn kí ìtumọ̀ náà tó pé.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Nítorí náà, ohun tí àwọn ọmọ ogun náà ṣe nìyẹn
  rationale: Ó pa ìtẹnumọ́ ìparí Gíríìkì mọ́ pé àwọn ọmọ ogun náà ló ṣe àwọn ohun tí a ṣẹ̀ṣẹ̀ sọ.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ohun tí àwọn ọmọ ogun ṣe àti ìmúṣẹ Ìwé Mímọ́ nínú ἵνα ἡ γραφὴ πληρωθῇ
  choice: Túmọ̀ ọ́ gẹ́gẹ́ bí gbólóhùn ìmúṣẹ Ìwé Mímọ́, láìṣàlàyé síwájú bí ìfẹ́ Ọlọ́run àti ìṣe ènìyàn ṣe ń ṣiṣẹ́ pọ̀.
  alternative: A lè túmọ̀ ἵνα ní líle síi gẹ́gẹ́ bí ‘ní ète kí Ìwé Mímọ́ lè ṣẹ,’ tàbí gẹ́gẹ́ bí àbájáde pé ‘nípa bẹ́ẹ̀, Ìwé Mímọ́ ṣẹ.’
  rationale: Ìtumọ̀ náà pa ẹ̀rí Jòhánù mọ́ pé ìṣẹ̀lẹ̀ náà mú Ìwé Mímọ́ ṣẹ, ṣùgbọ́n kò yanjú ìforígbárí ẹ̀kọ́-ìgbàgbọ́ tí ọ̀rọ̀ náà fúnra rẹ̀ kò ṣàlàyé.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní ọlá ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Ọ̀rọ̀ àwọn ọmọ ogun jẹ́ ti ìjíròrò àdánidá (‘Ẹ jẹ́ ká ... ká ...’), nígbà tí ọ̀rọ̀ Ìwé Mímọ́ tí a fa yọ ní ìró gíga díẹ̀ ṣùgbọ́n ó ṣì rọrùn láti lóye.
