id: JHN.19.6
reference: John 19:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: yo
  text: Nítorí náà, nígbà tí àwọn olórí àlùfáà àti àwọn ìránṣẹ́ rí i, wọ́n kígbe pé, “Kàn án mọ́ àgbélébùú! Kàn án mọ́ àgbélébùú!” Pílátù sọ fún wọn pé, “Ẹ̀yin fúnra yín ẹ mú un, kí ẹ sì kàn án mọ́ àgbélébùú.[a] Nítorí èmi kò rí ẹ̀sùn kankan sí i.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ mú un fúnra yín, kí ẹ sì kàn án mọ́ àgbélébùú.” Ọ̀rọ̀ Gíríìkì fi “ẹ̀yin” sí i ní pàtó láti tẹnu mọ́ ọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Èmi kò rí ẹ̀bi kankan lára rẹ̀.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ẹ̀sùn tàbí ìpìlẹ̀ fún fífi ẹ̀sùn kan ẹni; ìtumọ̀ tó jẹ mọ́ ìdájọ́ ló ṣe pàtàkì jù níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ó pa ìtẹ̀síwájú àti ìyọrísí inú οὖν mọ́, ó sì fi ìtumọ̀ àkókò ὅτε hàn ní Yorùbá àdánidá.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn aṣáájú àlùfáà ní Jerúsálẹ́mù, kì í ṣe sí olórí àlùfáà kan ṣoṣo.
- source_word: ὑπηρέται
  choice: àwọn ìránṣẹ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn òṣìṣẹ́ abẹ́ àṣẹ àwọn olórí Júù; “ìránṣẹ́” kò fi iṣẹ́ tẹ́ńpìlì tàbí iṣẹ́ ẹ̀ṣọ́ kún ohun tí ẹsẹ náà kò sọ ní pàtó.
- source_word: ἐκραύγασαν λέγοντες
  choice: wọ́n kígbe pé
  rationale: Ìtumọ̀ yìí sọ igbe ohùn rara náà ní ṣókí àti ní Yorùbá àdánidá, láìjẹ́ kí “léγοντες” di àsọtúnsọ tí kò pọndandan.
- source_word: Σταύρωσον σταύρωσον
  choice: Kàn án mọ́ àgbélébùú! Kàn án mọ́ àgbélébùú!
  rationale: Ó pa àṣẹ líle àti àsọtúnsọ Gíríìkì mọ́; a fi arọ́pò-orúkọ ohun tí a ṣe sí hàn nítorí pé ẹni tí wọ́n ń sọ̀rọ̀ nípa rẹ̀ ṣe kedere nínú àyíká ọ̀rọ̀.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Ẹ̀yin fúnra yín ẹ mú un
  rationale: “Ẹ̀yin fúnra yín” mú ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς àti ìyàtọ̀ tí Pílátù fi sáàárín ara rẹ̀ àti wọn hàn.
- source_word: σταυρώσατε
  choice: kí ẹ sì kàn án mọ́ àgbélébùú
  rationale: Ó túmọ̀ àṣẹ náà ní kedere, ó sì so ó mọ́ àṣẹ àkọ́kọ́ lọ́nà tí ó rọrùn ní Yorùbá.
- source_word: αἰτίαν
  choice: ẹ̀sùn kankan
  rationale: Nínú àyíká ìdájọ́ yìí, “ẹ̀sùn” mú ìtumọ̀ òfin tàbí ìpìlẹ̀ fún ẹ̀sùn hàn dáadáa ju ọ̀rọ̀ gbogbogbò bí “ẹ̀bi” lọ.
theological_decisions:
- issue: Ìkéde Pílátù pé kò rí ohun tí a fi lè dá Jésù lẹ́bi
  choice: èmi kò rí ẹ̀sùn kankan sí i
  alternative: èmi kò rí ẹ̀bi kankan lára rẹ̀
  rationale: Aṣàyàn àkọ́kọ́ pa ìtumọ̀ ìdájọ́ αἰτία mọ́, láìsọ gbólóhùn náà di ìkéde ẹ̀kọ́ ìgbàgbọ́ tí ó gbòòrò ju ohun tí Pílátù sọ nínú ẹjọ́ náà lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. A lo “àgbélébùú” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, a sì pa ìgbóná igbe àwọn olórí náà àti ìtẹnumọ́ Pílátù mọ́.
