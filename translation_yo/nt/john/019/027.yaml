source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: yo
  text: Lẹ́yìn náà, ó sọ fún ọmọ ẹ̀yìn náà pé, “Wò ó, ìyá rẹ.” Láti wákàtí náà lọ, ọmọ ẹ̀yìn náà sì gba á sínú ilé tirẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Wò ó
  rationale: Ó pa agbára àṣẹ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ń pe ẹni náà láti kíyè sí ìbáṣepọ̀ tuntun tí Jésù ń tọ́ka sí.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: Láti wákàtí náà lọ
  rationale: Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ ni; ‘wákàtí’ lè tọ́ka sí àkókò pàtó náà, láì fi dandan sọ pé lẹ́sẹ̀kẹsẹ̀ ni.
- source_word: εἰς τὰ ἴδια
  choice: sí ilé tirẹ̀
  rationale: Gbólóhùn náà lè túmọ̀ sí ohun tàbí ibùgbé tirẹ̀; nínú àyíká yìí, ‘ilé tirẹ̀’ sọ ìtumọ̀ ìtọ́jú àti gbígbà wọlé jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú ìbáṣepọ̀ tí ‘ìyá rẹ’ ń dá sílẹ̀
  choice: Pa ọ̀rọ̀ Jésù mọ́ ní tààràtà gẹ́gẹ́ bí ‘ìyá rẹ,’ láì ṣàlàyé rẹ̀ sí i.
  alternative: Ṣàfikún pé Jésù fi Màríà lé ọmọ ẹ̀yìn náà lọ́wọ́ tàbí pé ó dá ìbáṣepọ̀ ẹ̀mí kan sílẹ̀.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò ṣàlàyé gbogbo ìwọ̀n ìbáṣepọ̀ náà; fífi ọ̀rọ̀ náà sílẹ̀ ní ṣókí ń pa àìdánilójú àti ìdíwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ọmọ ẹ̀yìn’ fún μαθητής, ‘mú un lọ sí ilé tirẹ̀’ sì jẹ́ àdánidá ju ìtumọ̀ líle bí ‘gba a sínú àwọn ohun tirẹ̀’ lọ.
