  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí: “Ohun tí mo kọ, mo kọ ọ́.” Èdè Gíríìkì lo perfect lẹ́ẹ̀mejì, èyí tí ó lè tẹnumọ́ pé ohun tí Pílátù kọ ti parí, àbájáde rẹ̀ sì ṣì wà.'
