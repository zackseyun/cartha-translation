lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀-ìṣe aorist deponent yìí túmọ̀ sí pé ó dáhùn; “dáhùn” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́ nínú ìtàn.
- source_word: ὁ Πιλᾶτος
  choice: Pílátù
  rationale: Orúkọ ẹni ni; àpilẹ̀kọ Gíríìkì kò nílò ìtumọ̀ ọ̀tọ̀ ní Yorùbá.
- source_word: Ὃ
  choice: Ohun tí
  rationale: Arọ́pò-orúkọ ìbátan aláìlẹ́mìí ẹyọ kan ni, tí ó dúró gẹ́gẹ́ bí ohun; “ohun tí” jẹ́ Yorùbá àdánidá.
- source_word: γέγραφα
  choice: mo ti kọ
  rationale: Perfect active indicative ni. Ìkọ̀lé “mo ti kọ” fi hàn pé iṣẹ́ náà ti parí, àbájáde rẹ̀ sì ṣì dúró; títún un sọ pa ìtẹnumọ́ Gíríìkì mọ́.
theological_decisions:
- issue: Agbára ìtẹnumọ́ nínú γέγραφα γέγραφα tí a tún sọ lẹ́ẹ̀mejì
  choice: “Ohun tí mo ti kọ, mo ti kọ ọ́.”
  alternative: “Ohun tí mo kọ, mo kọ ọ́.”
  rationale: Ìkọ̀lé “mo ti kọ” pa ìhà perfect mọ́, ó sì fi ìpinnu Pílátù tí kò ní yí padà hàn láìfi àlàyé tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn kíkún níbi tí ó bá jẹ́ àdánidá. A pa àtúnsọ ìpilẹ̀ṣẹ̀ mọ́ láti gbé ìtẹnumọ́ àti ìpinnu tí ó fìdí múlẹ̀ jáde.
