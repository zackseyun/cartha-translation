source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: yo
  text: 'Ó sì tún wọ inú ilé-iṣẹ́ gómìnà[a], ó sì sọ fún Jésù pé, “Níbo ni ìwọ ti wá?” Ṣùgbọ́n Jésù kò fún un ní ìdáhùn.


    [a] Tàbí “pírétóríọ̀mù,” ìyẹn ibùgbé tàbí ilé-iṣẹ́ àṣẹ gómìnà ará Róòmù.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pírétóríọ̀mù,” ìyẹn ibùgbé tàbí ilé-iṣẹ́ àṣẹ gómìnà ará Róòmù.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: wọ inú
  rationale: Ó túmọ̀ sí lílọ sínú ibi kan; “wọ inú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó sì pa ìtumọ̀ ìṣípò náà mọ́.
- source_word: πραιτώριον
  choice: ilé-iṣẹ́ gómìnà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ibùgbé tàbí ilé-iṣẹ́ àṣẹ gómìnà ará Róòmù. “Ilé-iṣẹ́ gómìnà” mú iṣẹ́ ibi náà yé òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa orúkọ àti ìtumọ̀ míì mọ́.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé ìṣe náà ṣẹlẹ̀ lẹ́ẹ̀kan sí i.
- source_word: λέγει
  choice: sọ fún
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí nínú ìtàn, àsìkò tí ó ti kọjá ló bá ìtàn Yorùbá mu; “sọ fún” sì ń ṣáájú ọ̀rọ̀ tí Pilatu sọ tààrà.
- source_word: Πόθεν εἶ σύ
  choice: Níbo ni ìwọ ti wá?
  rationale: Ó béèrè nípa ibi tàbí orísun tí Jésù ti wá. Fífi “ìwọ” hàn pa ìtẹnumọ́ inú σύ mọ́.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: kò fún un ní ìdáhùn
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì, “kò fún un ní ìdáhùn,” mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: καὶ ... καὶ ... δὲ
  choice: Ó sì ... ó sì ... Ṣùgbọ́n
  rationale: Àwọn àsopọ̀ yìí ń darí ìṣàn ìtàn, “Ṣùgbọ́n” sì mú ìyàtọ̀ láàárín ìbéèrè Pilatu àti ìdákẹ́jẹ Jésù hàn.
theological_decisions:
- issue: Ẹni tí kókó-ọrọ̀ tí a kò sọ ní Gíríìkì ń tọ́ka sí
  choice: Lo “Ó,” kí àyíká ìtàn fi hàn pé Pilatu ni.
  alternative: Fi orúkọ “Pilatu” sínú ẹsẹ náà ní tààrà.
  rationale: Gíríìkì kò tún sọ orúkọ Pilatu, bí ó tilẹ̀ jẹ́ pé àyíká fi ẹni náà hàn kedere. “Ó” tẹ̀ lé ìṣètò orísun láì mú ìtumọ̀ rú.
translation_notes:
  register: A lo Yorùbá àtijọ́-kéré, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A gbe àmì [a] lẹ́yìn “ilé-iṣẹ́ gómìnà,” ibi tí ó bá ọ̀rọ̀ πραιτώριον mu.
