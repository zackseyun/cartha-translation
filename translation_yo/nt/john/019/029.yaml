id: JHN.19.29
reference: John 19:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: yo
  text: Ohun ìkòkò kan tí ó kún fún wáìnì kíkan[a] wà níbẹ̀. Nítorí náà, wọ́n fi kànrìnkànrìn kan tí ó kún fún wáìnì kíkan náà sí hísópù[b], wọ́n sì mú un dé ẹnu rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀tí kíkan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wáìnì kíkan tàbí ọ̀tí kíkan; níbí, ó ṣeé ṣe kí ó tọ́ka sí wáìnì kíkan tí àwọn ọmọ ogun ní láti mu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sí ẹ̀ka hísópù” tàbí “pẹ̀lú hísópù.” Gíríìkì náà kan sọ pé “sí/pẹ̀lú hísópù,” a kò sì lè pinnu dájúdájú bí wọ́n ṣe so kànrìnkànrìn náà mọ́ ọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: ohun èlò
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ gbogbogbò fún ohun èlò tàbí ohun tí a fi ń kó nǹkan; ‘ohun èlò’ kò sọ irú àpò náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἔκειτο
  choice: wà níbẹ̀
  rationale: Ó fi ipò ohun èlò náà hàn ní àkókò ìṣẹ̀lẹ̀ náà, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ὄξους
  choice: ọtí wáìnì kíkan
  rationale: Ní àyíká yìí, ὄξος lè tọ́ka sí wáìnì olówó poku tí ó ti kíkan, èyí tí àwọn ọmọ ogun máa ń mu; àlàyé ẹsẹ̀ fi ‘ọ̀tí kíkan’ hàn gẹ́gẹ́ bí òmíràn.
- source_word: μεστόν
  choice: tí ó kún fún
  rationale: Ó túmọ̀ sí pé ohun náà kún fún nǹkan; a lo ọ̀rọ̀ kan náà fún ohun èlò àti kànìnkànìn.
- source_word: σπόγγον
  choice: kànìnkànìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún sponge.
- source_word: οὖν
  choice: nítorí náà
  rationale: Ó so ohun tí wọ́n ṣe pọ̀ mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn.
- source_word: ὑσσώπῳ
  choice: lé hísópù
  rationale: Dátífù Gíríìkì lè túmọ̀ sí ohun tí wọ́n gbé kànìnkànìn lé tàbí ohun tí wọ́n fi ṣe iṣẹ́ náà; ìtumọ̀ yìí dúró sún mọ́ ọ̀rọ̀ orísun láìfi ‘ẹ̀ka’ kún un.
- source_word: περιθέντες
  choice: wọ́n gbé ... lé
  rationale: Participle náà ṣàpèjúwe fífi kànìnkànìn náà mọ́ hísópù ṣáájú kí wọ́n tó gbé e dé ẹnu Jésù.
- source_word: προσήνεγκαν
  choice: wọ́n sì gbé e dé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú tàbí gbígbé ohun kan sún mọ́ ibi kan; ‘gbé e dé’ bá ìṣe tí ara mu níbí.
- source_word: αὐτοῦ τῷ στόματι
  choice: ẹnu rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá ti dátífù ibi tí wọ́n gbé ohun náà dé, láì tún orúkọ Jésù sọ.
theological_decisions:
- issue: Ìtumọ̀ ìtàn àti àṣà ẹ̀sìn tí ὑσσώπῳ lè ní
  choice: Fi ‘hísópù’ sí ọ̀rọ̀ pàtàkì láìṣàlàyé àmì rẹ̀ nínú ẹsẹ̀.
  alternative: Ṣe é ní ‘ẹ̀ka hísópù,’ tàbí yí i sí ‘igi kékeré’/‘ọ̀pá.’
  rationale: Ọ̀rọ̀ Jòhánù lè mú Ìrékọjá tàbí ìwẹ̀nùmọ́ wá sí ìrántí, ṣùgbọ́n ẹsẹ̀ náà kò sọ èyí ní tààrà. Dídá ‘hísópù’ sílẹ̀ pa ìbáṣepọ̀ tó ṣeé ṣe yìí mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó bá jẹ́ àdánidá, a sì yẹra fún pípe ohun èlò náà ní ìkòkò tàbí ìgò nítorí orísun kò sọ irú rẹ̀. ‘Kànìnkànìn’ àti ‘hísópù’ pa àwòrán ìtàn náà mọ́ ní ọ̀nà tí òǹkàwé Yorùbá lè lóye.
