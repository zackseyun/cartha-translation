  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì mọ́: ohun èlò kan tí ó kún fún ὄξος wà níbẹ̀, wọ́n fi kanrìnkànrìn kan tí ó kún fún un sí hísópù, wọ́n sì mú un dé ẹnu rẹ̀. Ṣùgbọ́n ‘gbé ... lé hísópù’ kò rọrùn gan-an nínú Yorùbá, ó sì lè fi ìtumọ̀ ‘on’ kan ṣoṣo múlẹ̀ ju dátífù Gíríìkì tí ó ṣí sí ‘on/with’ lọ.'
