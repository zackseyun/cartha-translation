  to: Ohun ìkòkò kan tí ó kún fún wáìnì kíkan[a] wà níbẹ̀. Nítorí náà, wọ́n fi kànrìnkànrìn kan tí ó kún fún wáìnì kíkan náà sí hísópù[b], wọ́n sì mú un dé ẹnu rẹ̀.
  rationale: Àtúnṣe náà mú ìsọ̀rọ̀ Yorùbá rọrùn síi, ó yọ ìtẹnumọ́ tó pọ̀ nínú ‘ọtí wáìnì,’ ó sì pa àìdájú gírámà ὑσσώπῳ mọ́. Àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ṣàlàyé, àti pé àlàyé kò fi ẹ̀ka hísópù tàbí ìtumọ̀ ìṣàpẹẹrẹ kún ọ̀rọ̀ pàtàkì.
