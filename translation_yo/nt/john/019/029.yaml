  terminology: 'A yẹ kí a lo ‘wáìnì kíkan’ dípò ‘ọtí wáìnì kíkan’: ‘wáìnì’ fúnra rẹ̀ ti ń tọ́ka sí ọtí náà, ìṣàfikún ‘ọtí’ sì pọ̀ ju. ‘Hísópù’ dáa, a kò gbọdọ̀ sọ pé ó jẹ́ ẹ̀ka nínú ọ̀rọ̀ pàtàkì. ‘Kànrìnkànrìn’ ni a ti pa sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ fún sponge.'
