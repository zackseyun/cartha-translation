id: JHN.19.7
reference: John 19:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: yo
  text: Àwọn Júù dá a lóhùn pé, “Àwa ní òfin kan, àti gẹ́gẹ́ bí òfin náà, ó yẹ kí ó kú, nítorí ó sọ ara rẹ̀ di Ọmọ Ọlọ́run.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: dá a lóhùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n fèsì sí i nínú ìtàn.
- source_word: οἱ Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Ó túmọ̀ orúkọ ẹgbẹ́ náà ní tààràtà láì fi kún un pé àwọn aṣáájú nìkan ni, nítorí ẹsẹ yìí kò sọ bẹ́ẹ̀ ní pàtó.
- source_word: νόμον ἔχομεν
  choice: Àwa ní òfin kan
  rationale: “Òfin kan” ṣe àfihàn àìsí atọ́ka ní ìfarahàn àkọ́kọ́ νόμον, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: κατὰ τὸν νόμον
  choice: gẹ́gẹ́ bí òfin náà
  rationale: “Òfin náà” tọ́ka padà sí òfin tí wọ́n ṣẹ̀ṣẹ̀ mẹ́nu kàn, bí atọ́ka inú Gíríìkì ṣe ń ṣiṣẹ́.
- source_word: ὀφείλει ἀποθανεῖν
  choice: ó yẹ kí ó kú
  rationale: Ó pa ìtumọ̀ ojúṣe tàbí ohun tí òfin béèrè mọ́, láì sọ ọ́ di dandan àìyípadà ju Gíríìkì lọ.
- source_word: υἱὸν θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ọ̀rọ̀ Yorùbá yìí lè dúró gẹ́gẹ́ bí oyè aláìlẹ́gbẹ́ ní àyíká Jòhánù, ó sì yẹra fún fífi atọ́ka tí èdè Yorùbá kò nílò kún un.
- source_word: ἑαυτὸν ἐποίησεν
  choice: ó sọ ara rẹ̀ di
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó bójú mu fún ẹ̀sùn pé ẹni náà gbé ara rẹ̀ kalẹ̀ ní ipò kan; ó pa ìṣètò ẹ̀sùn àwọn alatako mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ υἱὸν θεοῦ nínú ẹ̀sùn tí àwọn alatako fi kan Jésù
  choice: Ọmọ Ọlọ́run
  alternative: ọmọ kan ti Ọlọ́run
  rationale: Àyíká Jòhánù fi hàn pé ẹ̀sùn náà kan ipò ọmọ aláìlẹ́gbẹ́, kì í ṣe pé Jésù jẹ́ ọ̀kan lára ọ̀pọ̀ ọmọ Ọlọ́run. Síbẹ̀, ìtumọ̀ náà ń ròyìn ẹ̀sùn wọn, kò sì ń fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa àtúnṣe “òfin kan/òfin náà” mọ́ láti fi ìtọ́kasí padà inú Gíríìkì hàn. Kò sí àlàyé ìsàlẹ̀ ojú ìwé tí ó pọn dandan; àwọn àlàyé Gẹ̀ẹ́sì tí a pèsè dà bí ẹni pé àmì wọn yípo, nítorí náà a kò gbe wọn wọlé lọ́nà tí yóò ṣì olùkà lọ́nà.
