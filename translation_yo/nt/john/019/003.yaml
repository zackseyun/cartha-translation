source:
  edition: SBLGNT
  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: yo
  text: Wọ́n sì ń sún mọ́ ọn, wọ́n sì ń sọ pé,[a] “Kábíyèsí,[b] Ọba àwọn Júù!” Wọ́n sì ń gbá a ní ẹ̀rẹ̀kẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Wọ́n ń sún mọ́ ọn léraléra, wọ́n sì ń sọ pé,” nítorí àwọn ọ̀rọ̀-ìṣe Gíríìkì lè tọ́ka sí ohun tí wọ́n ń ṣe léraléra.
    reason: lexical_alternative
  - marker: b
    text: Ìkíni ọba ni “Kábíyèsí” níhìn-ín; àwọn ọmọ-ogun ń lò ó láti fi ṣẹ̀sín.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: Wọ́n sì ń tọ̀ ọ́ wá, wọ́n sì ń sọ pé
  rationale: Àwọn ọ̀rọ̀-ìṣe aláìparí méjèèjì lè fi hàn pé àwọn ọmọ-ogun ń ṣe èyí léraléra tàbí pé ìṣe náà ń bá a lọ. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìrìn sí ọ̀dọ̀ Jésù àti ẹ̀gàn tí wọ́n ń ṣe mọ́.
- source_word: Χαῖρε
  choice: Kábíyèsí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ ìkíni ọlá fún ọba tí wọ́n fi ń ṣẹ̀sín. “Kábíyèsí” jẹ́ ìkíni ọba tí ó bójú mu ní Yorùbá, tí àyíká sì mú kí ẹ̀gàn inú rẹ̀ hàn.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: Ìtumọ̀ tààrà ni èyí fún oyè náà; ó pa ìtumọ̀ ìṣèlú àti ti Mèsáyà inú ìtàn ìjìyà náà mọ́ láìfi àlàyé kún un.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: Wọ́n sì ń gbá a ní ẹ̀rẹ̀kẹ́
  rationale: ῥαπίσματα ń tọ́ka sí lílù tàbí lígbá ẹni, ní pàtàkì pẹ̀lú ọwọ́. “Ń gbá a ní ẹ̀rẹ̀kẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ lígbá ẹni, “ń” sì pa ipa ìṣe tí ń bá a lọ tàbí tí a ń ṣe léraléra mọ́.
theological_decisions:
- issue: Ìró ohùn ìkíni àwọn ọmọ-ogun sí Jésù
  choice: A túmọ̀ Χαῖρε sí “Kábíyèsí” gẹ́gẹ́ bí ìkíni ọba tí wọ́n fi ń ṣẹ̀sín.
  alternative: “Àlàáfíà” tàbí “Ẹ kú” gẹ́gẹ́ bí ìkíni lásán.
  rationale: Àyíká ìjìyà àti ìlù náà fi hàn pé kì í ṣe ìkíni òótọ́. “Kábíyèsí” ń pa ìkíni ọba àti ẹ̀gàn inú rẹ̀ mọ́ láìyanju ìbéèrè nípa irú ìjọba Jésù.
translation_notes:
  register: Standard Yorùbá pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “tọ̀ ọ́ wá” láti fi ìṣípò sí ọ̀dọ̀ Jésù hàn, “Kábíyèsí” fún ìkíni ọba ẹlẹ́gàn, àti “ń gbá a ní ẹ̀rẹ̀kẹ́” fún ìlù ọwọ́ tí ó ń bá a lọ.
