  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtumọ̀ Gíríìkì dáadáa lápapọ̀. Ṣùgbọ́n σῶμα yẹ kí a túmọ̀ sí “ara” dípò “òkú”: “òkú” ń tọ́ka sí ẹni tí ó kú, nígbà tí σῶμα nínú ẹsẹ̀ yìí jẹ́ ara Jesu. Lílò “ara Jesu” tún dín ìṣòro ìtọ́kasí nínú “òkú rẹ̀” kù.'
