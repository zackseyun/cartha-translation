id: JHN.19.38
reference: John 19:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: yo
  text: Lẹ́yìn nǹkan wọ̀nyí, Jósẹ́fù ará Arimátíà, ẹni tí ó jẹ́ ọmọ-ẹ̀yìn Jesu ṣùgbọ́n tí ó pa ìjẹ́ ọmọ-ẹ̀yìn rẹ̀ mọ́ ní ìkọ̀kọ̀ nítorí ìbẹ̀rù àwọn Júù,[a] bẹ Pílátù pé kí òun lè kó ara Jesu lọ. Pílátù sì fún un ní àṣẹ. Nítorí náà, ó wá, ó sì kó ara Jesu lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní pàtó sí i nínú àyíká ọ̀rọ̀ yìí, ó lè tọ́ka sí àwọn aláṣẹ Júù, tàbí àwọn aláṣẹ ní ilẹ̀ Jùdíà. Johanu sábà máa ń lo “àwọn Júù” fún àwọn tí wọ́n ń tako Jesu, kì í ṣe fún gbogbo àwọn Júù láìyàtọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Lẹ́yìn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ nǹkan inú ταῦτα àti ìtẹ̀síwájú ìtàn Johanu mọ́ ní Yorùbá àdánidá.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: Jósẹ́fù ará Arimátíà
  rationale: Ọ̀rọ̀ “ará” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ibi tí ènìyàn ti wá hàn, ó sì bá ἀπό mu.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: ẹni tí ó jẹ́ ọmọ-ẹ̀yìn Jesu
  rationale: Ó tú gbólóhùn aláìlópìn Gíríìkì sí Yorùbá tí ó ṣe kedere, nígbà tí “ọmọ-ẹ̀yìn” pa ìtumọ̀ μαθητής mọ́.
- source_word: κεκρυμμένος
  choice: tí ó fi ìyẹn pamọ́
  rationale: Ó mú ohun tí a kò sọ ní tààràtà—jíjẹ́ ọmọ-ẹ̀yìn rẹ̀—yé ni, ó sì fi ipò ìfarapamọ́ tí ó ti ń bá a lọ hàn.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: nítorí ìbẹ̀rù àwọn Júù
  rationale: Ìtumọ̀ yìí sún mọ́ ìṣètò Gíríìkì, kò sì sọ ohun tí “àwọn Júù” tọ́ka sí di pàtó ju orísun lọ.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: pé kí òun lè gbé òkú Jesu kúrò
  rationale: “Kí ... lè” fi ète ìbéèrè hàn; “òkú” jẹ́ Yorùbá àdánidá fún ara ẹni tí ó ti kú ní àyíká yìí, “gbé ... kúrò” sì pa ìtumọ̀ αἴρω mọ́.
- source_word: ἐπέτρεψεν
  choice: fún un láṣẹ
  rationale: Ó fi ìyọ̀ǹda tàbí àṣẹ Pílátù hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Nítorí náà, ó wá, ó sì gbé òkú rẹ̀ kúrò
  rationale: “Nítorí náà” ṣàfihàn οὖν, àtúnlò “gbé ... kúrò” sì pa ìbámu αἴρω/ἦρεν mọ́; “rẹ̀” dúró fún αὐτοῦ.
theological_decisions:
- issue: Ohun tí τῶν Ἰουδαίων tọ́ka sí nínú Ìhìn Rere Johanu
  choice: àwọn Júù nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé ìsàlẹ̀ ìwé
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Gíríìkì kò fi ọ̀rọ̀ “olórí” kún un. Títọ́jú “àwọn Júù” pa àìdánilójú àti ìforígbárí ọ̀rọ̀ orísun mọ́, nígbà tí àlàyé ṣèdíwọ́ fún kíkà á bí ẹni pé ó ń dá gbogbo àwọn Júù lẹ́bi láìyàtọ̀.
translation_notes:
  register: Yorùbá àkànṣe òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A yan “òkú Jesu” dípò “ara Jesu” nítorí pé ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ láti tọ́ka sí ara ẹni tí ó ti kú; èyí kò yí ìtumọ̀ σῶμα nínú àyíká náà padà.
