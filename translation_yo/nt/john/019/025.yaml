id: JHN.19.25
reference: John 19:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: yo
  text: Ìyá rẹ̀, arábìnrin ìyá rẹ̀, Màríà ti Kílópà[a], àti Màríà Magdalénè dúró lẹ́gbẹ̀ẹ́ àgbélébùú Jesu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Màríà aya Kílópà.” Èdè Gíríìkì kò sọ irú ìbátan náà ní gbangba, bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ènìyàn ló ka a sí aya Kílópà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè ka èdè Gíríìkì náà bí ẹni pé ó ń dárúkọ obìnrin mẹ́ta, bí “arábìnrin ìyá rẹ̀” bá jẹ́ ẹni kan náà pẹ̀lú “Màríà ti Kílópà.”
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: Àwọn tí ó dúró
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ìdúró tí ó ń bá a lọ ní ibi náà; ìtumọ̀ yìí jẹ́ adayeba ní Yorùbá láìfi ìṣe náà hàn bí ìṣẹ̀lẹ̀ ojijì.
- source_word: δὲ
  choice: kò ṣe é túmọ̀ ní ọ̀tọ̀
  rationale: Níhìn-ín δέ jẹ́ àmì ìtẹ̀síwájú ìtàn, kì í ṣe ìtakò líle; ètò gbólóhùn Yorùbá ti mú ìyípadà ojú ìtàn náà jáde láìfi ọ̀rọ̀ àfikún sí i.
- source_word: παρὰ τῷ σταυρῷ
  choice: lẹ́gbẹ̀ẹ́ àgbélébùú
  rationale: παρά pẹ̀lú dative ń tọ́ka sí wíwà nítòsí; “lẹ́gbẹ̀ẹ́” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìsúnmọ́.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: A so orúkọ Jesu mọ́ àgbélébùú ní tààrà, gẹ́gẹ́ bí genitive inú Gíríìkì.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ìyá rẹ̀
  rationale: Ìtumọ̀ tààrà àti adayeba fún gbólóhùn náà.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: arábìnrin ìyá rẹ̀
  rationale: Ó pa ìbátan tí èdè Gíríìkì sọ mọ́, ó sì yé òǹkàwé Yorùbá.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Maria ti Klopa
  rationale: Genitive náà kò sọ ní gbangba pé Maria jẹ́ aya Klopa. “Maria ti Klopa” pa irú ìbátan náà mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalene
  rationale: Ìkọ̀wé orúkọ tí a mọ̀ sí ẹni tí ó wá láti Magdala, tí ó sì ti wọ́pọ̀ nínú èdè ìjọsìn Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ àti iye àwọn obìnrin lẹ́gbẹ̀ẹ́ àgbélébùú
  choice: 'Ọ̀rọ̀ àkọ́kọ́ ni a ṣètò bí àkójọ obìnrin mẹ́rin: ìyá Jesu, arábìnrin ìyá rẹ̀, Maria ti Klopa, àti Maria Magdalene.'
  alternative: A lè ka “arábìnrin ìyá rẹ̀” àti “Maria ti Klopa” sí obìnrin kan náà, kí iye wọn sì jẹ́ mẹ́ta.
  rationale: Àwọn orúkọ nominative tí καὶ so pọ̀ lè tọ́ka sí mẹ́rin, ṣùgbọ́n ìṣètò Gíríìkì náà ṣókí tó bẹ́ẹ̀ tí apposition ẹni mẹ́ta tún ṣe é ṣe. A fi àṣàyàn kejì sínú àlàyé ìsàlẹ̀ láìdá àríyànjiyàn náà parí.
- issue: Ìbátan Maria pẹ̀lú Klopa
  choice: “Maria ti Klopa”
  alternative: “Maria aya Klopa”
  rationale: Gíríìkì sọ ìbátan pẹ̀lú genitive ṣùgbọ́n kò lo ọ̀rọ̀ “aya.” Ìtumọ̀ àkọ́kọ́ pa àìdánilójú yẹn mọ́; àlàyé ìsàlẹ̀ darúkọ ìtumọ̀ tí ó wọ́pọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ adayeba, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé òde òní. A yàgò fún ọ̀rọ̀ ìbẹ̀rẹ̀ tó túmọ̀ sí “ǹjẹ́/ṣùgbọ́n” nítorí δέ níhìn-ín kàn ń darí ìtàn lọ sí ojú ìṣẹ̀lẹ̀ tuntun. Àmì [a] wà lẹ́yìn “Maria ti Klopa,” àmì [b] sì wà ní òpin àkójọ nítorí pé ó kan bí a ṣe ń ka gbogbo àkójọ náà.
