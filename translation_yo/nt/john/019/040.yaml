id: JHN.19.40
reference: John 19:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: yo
  text: Nítorí náà, wọ́n mú ara Jésù, wọ́n sì fi aṣọ ọ̀gbọ̀ dì í pẹ̀lú àwọn èròjà olóòórùn dídùn, gẹ́gẹ́ bí àṣà ìsìnkú àwọn Júù[a] ṣe rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará Jùdíà,” bí a bá ka ọ̀rọ̀ náà sí ti agbègbè dípò ti ẹ̀yà tàbí ẹ̀sìn; níbí, àyíká náà fi hàn pé àṣà ìsìnkú àwọn Júù lápapọ̀ ni a ń sọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: wọ́n mú
  rationale: Ó túmọ̀ sí pé wọ́n gbé ara náà láti ṣe ìmúrasílẹ̀ ìsìnkú; “mú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé ní àyíká yìí.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe yìí mọ́ ohun tó ṣẹlẹ̀ ní ẹsẹ tó ṣáájú, ó sì fi àbájáde ìtàn hàn.
- source_word: σῶμα
  choice: ara
  rationale: “Ara” tẹ̀ lé ìtumọ̀ ọ̀rọ̀ Gíríìkì láì lo ọ̀rọ̀ líle bí “òkú” gẹ́gẹ́ bí orúkọ ara Jésù.
- source_word: ἔδησαν
  choice: wọ́n sì ... dì í
  rationale: δέω ní ìtumọ̀ dídì tàbí dísopọ̀; “dì í” pa agbára ọ̀rọ̀ náà mọ́, ó sì bá lílo aṣọ ọ̀gbọ̀ mu.
- source_word: ὀθονίοις
  choice: fi aṣọ ọ̀gbọ̀
  rationale: Ó tọ́ka sí àwọn aṣọ kéékèèké tàbí aṣọ ọ̀gbọ̀ tí a lò fún ìmúrasílẹ̀ òkú; Yorùbá lè lo ọ̀rọ̀ àpapọ̀ “aṣọ ọ̀gbọ̀” lọ́nà àdánidá.
- source_word: ἀρωμάτων
  choice: àwọn èròjà olóòórùn dídùn
  rationale: Àwọn ohun olóòórùn tí a lò fún ìsìnkú ni ọ̀rọ̀ náà ń tọ́ka sí; yíyan yìí ṣe kedere ju “turari” lọ, èyí tó lè dín ìtumọ̀ rẹ̀ kù sí ohun tí a ń sun.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi hàn pé ìṣe náà bá àṣà tí a mọ̀ mú.
- source_word: ἔθος ἐστὶν
  choice: àṣà ... ti rí
  rationale: Ìsọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún àṣà tí ó ti fìdí múlẹ̀.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù
  rationale: Ní àyíká yìí, ó tọ́ka sí àṣà ìsìnkú àwọn ènìyàn Júù lápapọ̀, kì í ṣe àwọn aláṣẹ Júù nìkan.
- source_word: ἐνταφιάζειν
  choice: láti máa pèsè òkú sílẹ̀ fún ìsìnkú
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ pípèsè òkú sílẹ̀ fún ìsìnkú, kì í ṣe fífi sínú ibojì nìkan; gbolohun yìí pa ìtumọ̀ yẹn mọ́.
theological_decisions:
- issue: Ìtumọ̀ τοῖς Ἰουδαίοις
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Àyíká náà ń sọ nípa àṣà ìsìnkú ẹ̀sìn àti àṣà àwọn Júù lápapọ̀, kì í ṣe ibi tí wọ́n ń gbé nìkan; àlàyé ìsàlẹ̀ pa àṣàyàn ilẹ̀-ìbílẹ̀ mọ́.
- issue: Ìwọn ìtumọ̀ ἐνταφιάζειν
  choice: pèsè òkú sílẹ̀ fún ìsìnkú
  alternative: sin òkú
  rationale: Ìṣe tí ẹsẹ náà ṣàpèjúwe jẹ́ ìmúrasílẹ̀ ara fún ìsìnkú; “sin òkú” nìkan lè mú kó dà bí ẹni pé wọ́n ti fi ara náà sínú ibojì ní ìgbésẹ̀ yìí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “èròjà olóòórùn dídùn” láti yà àwọn ohun ìmúrasílẹ̀ ìsìnkú sọ́tọ̀ kúrò ní “turari” tí a sábà ń sun. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbolohun tí ó ní “àwọn Júù,” nítorí ibẹ̀ ni àṣàyàn ìtumọ̀ náà ti kan.
