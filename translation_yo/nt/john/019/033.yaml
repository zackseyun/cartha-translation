  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n dé ọ̀dọ̀ Jésù[a], tí wọ́n sì rí i pé ó ti kú,[b] wọn kò fọ́ ẹsẹ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jòhánù tún so èyí pọ̀ mọ́ ọ̀rọ̀ Ìwé Mímọ́ pé: “A kì yóò fọ́ ọ̀kan nínú egungun rẹ̀” (Jòhánù 19:36; fi wé Ẹ́kísódù 12:46; Númérì 9:12; Sáàmù 34:20).'
    reason: cross_reference
  - marker: b
    text: Tàbí, “nígbà tí wọ́n rí i pé ó ti kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Ṣùgbọ́n nígbà tí wọ́n dé ọ̀dọ̀ Jésù
  rationale: A tú ọ̀rọ̀ alábápín náà sí gbólóhùn àsìkò tí ó bá èdè Yorùbá mu. “Ṣùgbọ́n” fi ìyàtọ̀ kékeré tí δέ ní sí ohun tí wọ́n ṣe sí àwọn mìíràn hàn, “dé ọ̀dọ̀ Jésù” sì pa ìṣípòpadà sí ọ̀dọ̀ rẹ̀ mọ́.
- source_word: ὡς εἶδον
  choice: tí wọ́n sì rí i pé
  rationale: Ọ̀rọ̀ yìí fi ohun tí wọ́n rí, tí ó sì jẹ́ ìdí fún ohun tí wọ́n ṣe lẹ́yìn náà, hàn. Ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá láìfikún àlàyé tí kò sí nínú orísun.
- source_word: ἤδη
  choice: ti
  rationale: Nínú gbólóhùn “ó ti kú,” àmì “ti” fi hàn ní kedere pé ikú náà ti ṣẹlẹ̀ kí wọ́n tó dé, èyí tí ó bá ìtumọ̀ ἤδη mu lọ́nà àdánidá ní Yorùbá.
- source_word: τεθνηκότα
  choice: ó ti kú
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì tẹnumọ́ ipò ikú tí ó ti wáyé, “ó ti kú” jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì lè túmọ̀ sí pé ó ti di òkú tàbí pé ó ti kú.
- source_word: οὐ κατέαξαν
  choice: wọn kò ṣẹ́
  rationale: Nínú àyíká yìí, κατάγνυμι túmọ̀ sí fífọ́ egungun tàbí ẹsẹ̀. “Ṣẹ́” ni ọ̀rọ̀ Yorùbá tó bá ìṣe fífọ́ egungun mu.
- source_word: τὰ σκέλη
  choice: ẹsẹ̀ rẹ̀
  rationale: σκέλη ń tọ́ka sí àwọn ẹsẹ̀. Yorùbá sábà máa ń lo orúkọ ara bí “ẹsẹ̀” láìfi àmì ọ̀pọ̀ kún un; ọ̀rọ̀ náà sì dúró gẹ́gẹ́ bí ìtàn, láìlọ síwájú láti sọ “egungun” ṣáájú Jòhánù 19:36.
theological_decisions:
- issue: Ìtọ́kasí tó ṣeé ṣe sí ìmúṣẹ Ìwé Mímọ́ nípa àìṣẹ́ ẹsẹ̀ Jésù
  choice: Ọ̀rọ̀ pàtàkì dúró gẹ́gẹ́ bí ìtàn ohun tí àwọn ọmọ ogun ṣe, láìfikún èdè ìmúṣẹ sí ẹsẹ yìí.
  alternative: Lílo “egungun ẹsẹ̀ rẹ̀” láti mú ìsopọ̀ pẹ̀lú Jòhánù 19:36 hàn gbangba sí i.
  rationale: Jòhánù 19:36 fúnra rẹ̀ ló sọ ìsopọ̀ náà mọ́ ìmúṣẹ Ìwé Mímọ́. Ẹsẹ yìí sọ ohun tí àwọn ọmọ ogun ṣe nìkan; nítorí náà, “ẹsẹ̀ rẹ̀” pa ìtumọ̀ orísun mọ́, akọsilẹ̀ ìsàlẹ̀ sì lè tọ́ka sí ìsopọ̀ ọ̀rọ̀ ẹ̀sìn náà.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó ṣe kedere, tó ní iyì, tí ó sì jẹ́ ti òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Wọn kò ṣẹ́ ẹsẹ̀ rẹ̀” jẹ́ ọ̀nà àdánidá láti sọ pé wọn kò fọ́ àwọn egungun ẹsẹ̀ rẹ̀, láìṣàlàyé ju orísun lọ.
