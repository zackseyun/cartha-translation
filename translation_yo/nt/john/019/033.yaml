review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal arrival, the observation that Jesus had already died, and the consequent omission of the leg-breaking. The Yoruba perfective construction “ó ti kú” suitably conveys ἤδη with τεθνηκότα.
  naturalness: “Ṣẹ́ ẹsẹ̀” is understandable, but “fọ́ ẹsẹ̀” is the clearer and more idiomatic modern Yoruba expression for breaking a person's legs. It also avoids possible uncertainty about the sense of ṣẹ́ in this context.
  terminology: “Jésù,” “Ìwé Mímọ́,” and the retained body-part wording are appropriate. “Ẹsẹ̀ rẹ̀” can naturally carry the plural/generic sense here, as in the Greek plural τὰ σκέλη; no anticipatory insertion of “egungun” is needed in the verse text.
  issues:
  - severity: medium
    issue: The verb “ṣẹ́” in “wọn kò ṣẹ́ ẹsẹ̀ rẹ̀” is less idiomatic and may be semantically less immediate than “fọ́” for the breaking of legs.
    rationale: κατέαξαν denotes breaking the legs in this crucifixion context. “Wọn kò fọ́ ẹsẹ̀ rẹ̀” conveys this physical action more naturally and precisely in contemporary Standard Yoruba without adding “bones” to the main text.
  - severity: low
    issue: The cross-reference footnote’s introductory wording can be made smoother in Yoruba.
    rationale: “Lẹ́yìn náà, Jòhánù so ohun tí wọ́n ṣe yìí pọ̀ mọ́ Ìwé Mímọ́ pé” is intelligible, but “Jòhánù tún so èyí pọ̀ mọ́ ọ̀rọ̀ Ìwé Mímọ́” is more natural while retaining the audit-trail meaning.
  revised_text: Ṣùgbọ́n nígbà tí wọ́n dé ọ̀dọ̀ Jésù[a], tí wọ́n sì rí i pé ó ti kú,[b] wọn kò fọ́ ẹsẹ̀ rẹ̀.
