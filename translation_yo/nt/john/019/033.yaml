revisions:
- from: Ṣùgbọ́n nígbà tí wọ́n dé ọ̀dọ̀ Jésù[a], tí wọ́n sì rí i pé ó ti kú,[b] wọn kò ṣẹ́ ẹsẹ̀ rẹ̀.
  to: Ṣùgbọ́n nígbà tí wọ́n dé ọ̀dọ̀ Jésù[a], tí wọ́n sì rí i pé ó ti kú,[b] wọn kò fọ́ ẹsẹ̀ rẹ̀.
  rationale: 'The revision changes only the verb for the physical act: “fọ́” is the standard natural Yoruba verb for breaking legs. The main clause otherwise preserves the Greek sequence and its implication that Jesus was already dead when they arrived. The cross-reference remains a footnote, so the fulfillment connection is not imported into the verse itself.'
  reviewer_model: gpt-5.6-terra
