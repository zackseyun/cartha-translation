  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: yo
  text: Nígbà náà ni Pilatu mú Jésù, ó sì nà án ní pàṣán.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ṣíṣàlàyé pé ó ṣe é nípasẹ̀ àwọn míì: “Nígbà náà ni Pilatu mú Jésù, ó sì ní kí wọ́n nà á ní pàṣán.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú ìtàn; ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘lẹ́yìn náà’ tàbí ‘nígbà náà.’
- source_word: οὖν
  choice: ni
  rationale: A kò túmọ̀ rẹ̀ sí ọ̀rọ̀ ọ̀tọ̀; ìtẹnumọ́ ‘ni’ pẹ̀lú ‘Nígbà náà’ mú ìlọsíwájú àti ìsopọ̀ ìtàn náà jáde lọ́nà àdánidá.
- source_word: ἔλαβεν
  choice: mú
  rationale: ‘Mú’ ni ìtumọ̀ Yorùbá tó rọrùn fún gbígba tàbí mímú ẹni kan; kò fi agbára líle bí ‘ṣẹ́wọ̀n mú’ kún ọ̀rọ̀ Gíríìkì náà.
- source_word: ὁ Πιλᾶτος
  choice: Pilatu
  rationale: Àkọsílẹ̀ orúkọ Pilate tí ó wọ́pọ̀ nínú Yorùbá; ẹni náà ti jẹ́ mímọ̀ nínú àyíká ọ̀rọ̀.
- source_word: τὸν Ἰησοῦν
  choice: Jésù
  rationale: Àkọsílẹ̀ orúkọ Jesus tí ó wọ́pọ̀ ní Yorùbá, gẹ́gẹ́ bí ẹni tí ìṣe náà dé bá.
- source_word: ἐμαστίγωσεν
  choice: ó sì nà án ní pàṣán
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílu ẹni ní pàṣán tàbí okùn ìnálù; gbolohun yìí ṣe kedere ní Yorùbá òde òní, ó sì pa líle ìjìyà náà mọ́.
theological_decisions:
- issue: Bóyá Pilatu fúnra rẹ̀ ló na Jésù tàbí ó pàṣẹ pé kí àwọn míì nà á
  choice: Fi Pilatu sílẹ̀ gẹ́gẹ́ bí olùṣe àwọn ọ̀rọ̀-ìṣe méjèèjì, láì pinnu bóyá ó ṣe é fúnra rẹ̀ tàbí nípasẹ̀ àṣẹ rẹ̀.
  alternative: Nígbà náà ni Pilatu mú Jésù, ó sì ní kí wọ́n nà án ní pàṣán.
  rationale: Gíríìkì fi Pilatu ṣe olùṣe àwọn ọ̀rọ̀-ìṣe méjèèjì. Yorùbá àkọ́kọ́ pa ètò yẹn mọ́, ṣùgbọ́n bí ó ti rí nínú ìlò èdè nípa aláṣẹ, kò fi dandan mú un pé Pilatu fúnra rẹ̀ ló na Jésù. Àlàyé ìsàlẹ̀ ojú ìwé ni ó fi ọ̀nà ìtúmọ̀ aṣojú hàn.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Nà án ní pàṣán’ ṣe kedere ju ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò sọ ohun èlò ìnálù pàtó lọ.
