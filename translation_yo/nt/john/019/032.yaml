id: JHN.19.32
reference: John 19:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: yo
  text: Nítorí náà, àwọn ọmọ-ogun náà wá, wọ́n sì ṣẹ́ ẹsẹ̀ ẹni àkọ́kọ́ àti ti ẹlòmíràn tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Rẹ̀’ níbí ń tọ́ka sí Jésù.
    reason: referent_clarification
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú tí ó jẹ́ àbájáde ohun tí a sọ nínú ẹsẹ̀ ṣáájú hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: οἱ στρατιῶται
  choice: àwọn ọmọ-ogun náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn ọmọ ẹgbẹ́ ológun Róòmù nínú àyíká yìí; àmì ìtọ́kasí náà tún bá Greek mu.
- source_word: τοῦ μὲν πρώτου
  choice: ẹni àkọ́kọ́
  rationale: Greek kò sọ ‘ọkùnrin’ ní tààrà, ṣùgbọ́n ‘ẹni’ jẹ́ kí ìtọ́kasí sí ènìyàn ṣe kedere láì fi ohun tí kò pọndandan kún un.
- source_word: κατέαξαν
  choice: ṣẹ́
  rationale: ‘Ṣẹ́’ túmọ̀ sí fífi agbára ṣẹ egungun tàbí ẹsẹ̀, ó sì bá ìṣe tí a ń ṣàpèjúwe níbí mu dáadáa.
- source_word: τὰ σκέλη
  choice: ẹsẹ̀
  rationale: Ní Yorùbá, ‘ẹsẹ̀’ lè tọ́ka sí ẹsẹ̀ méjèèjì ní irú gbólóhùn yìí, nítorí náà kò pọndandan láti sọ iye méjì ní pàtó.
- source_word: τοῦ ἄλλου
  choice: ti ẹni kejì
  rationale: Èyí tọ́ka sí ọkùnrin kejì lára àwọn méjì tí a kàn mọ́ àgbélébùú lẹ́gbẹ̀ẹ́ Jésù, ó sì pa ìṣọ̀kan ọ̀rọ̀ Greek mọ́ nípasẹ̀ lílo ‘ti’ láì tún ọ̀rọ̀ ‘ẹsẹ̀’ sọ.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀
  rationale: Gbólóhùn yìí fi iṣẹ́ tí ó ti ṣẹlẹ̀ ṣáájú hàn, ó sì pa arọ́pò-orúkọ Greek mọ́ dípò fífi orúkọ Jésù sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ẹni tí αὐτῷ (‘rẹ̀’) ń tọ́ka sí
  choice: ‘rẹ̀’ ń tọ́ka sí Jésù
  alternative: Ó lè dà bí ẹni pé ó ń tọ́ka sí ẹni àkọ́kọ́ tí a mẹ́nu kàn
  rationale: Nínú àyíká ìtàn Jòhánù, Jésù ni ẹni pàtàkì tí a fi àwọn méjèèjì wé; nítorí náà, ó ṣeé ṣe jù pé arọ́pò-orúkọ náà ń tọ́ka sí Jésù. A pa arọ́pò-orúkọ mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ẹni tí ó ń tọ́ka sí nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìsopọ̀ àti àkójọpọ̀ gbólóhùn Greek mọ́ láì jẹ́ kí Yorùbá dà bí ìtumọ̀ líle.
