base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: yo
  text: 'Nítorí àwọn nǹkan wọ̀nyí ṣẹlẹ̀ kí Ìwé Mímọ́ lè ṣẹ pé: “A kì yóò ṣẹ́ egungun rẹ̀ kan.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “Egungun kan tirẹ̀ kì yóò ṣẹ́.” Ọ̀rọ̀ náà fún “egungun” wà ní ẹyọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ṣẹlẹ̀
  rationale: Ọ̀rọ̀ yìí sọ pé àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ ròyìn wáyé; “ṣẹlẹ̀” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, tó sì bá ìtumọ̀ aorist náà mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí; “Nítorí” pa ipa àsopọ̀ náà mọ́.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ìṣẹ̀lẹ̀ tí a ròyìn ṣáájú, “àwọn nǹkan wọ̀nyí” sì jẹ́ ìtumọ̀ tó sun mọ́ orísun tí ó sì ṣe déédé ní Yorùbá.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò “kí ... lè” fi ète tàbí àbájáde tí ó yọrí sí ìmúṣẹ hàn láì pinnu ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Nínú Jòhánù, γραφή ń tọ́ka sí Ìwé Mímọ́; yíyan “Ìwé Mímọ́” pa ìtumọ̀ ẹ̀sìn àti ẹyọ ọ̀rọ̀ orísun mọ́.
- source_word: πληρωθῇ
  choice: lè ṣẹ
  rationale: “Lè ṣẹ” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun tí Ìwé Mímọ́ sọ dé ìmúṣẹ, ó sì bá subjunctive lẹ́yìn ἵνα mu.
- source_word: Ὀστοῦν
  choice: egungun ... kan
  rationale: 'Orúkọ náà jẹ́ ẹyọ ní Gíríìkì. Yorùbá lè fi ẹyọ àti agbára ìkọ̀ “kan” hàn ní ti ẹ̀dá: “egungun rẹ̀ kan.”'
- source_word: οὐ συντριβήσεται
  choice: A kò ní ṣẹ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọjọ́ iwájú aláìṣe, ‘a kì yóò fọ́/ṣẹ́.’ Yorùbá sábà máa ń lo ẹni àìsọ pàtó “a” fún aláìṣe; “ṣẹ́” sì jẹ́ ọ̀rọ̀ tó bójú mu fún bí a ṣe ń ṣẹ́ egungun.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ oníhun “rẹ̀” tú genitive Gíríìkì náà sí Yorùbá lọ́nà àdánidá.
theological_decisions:
- issue: Bí a ṣe máa tú ẹyọ “egungun” nínú àyọlò Ìwé Mímọ́, pẹ̀lú ìtọ́kasí rẹ̀ sí Ẹ́kísódù 12:46, Númérì 9:12, àti Sáàmù 34:20
  choice: “A kò ní ṣẹ́ egungun rẹ̀ kan.”
  alternative: “Egungun rẹ̀ kan kì yóò ṣẹ́.”
  rationale: Ìtumọ̀ tí a yàn pa ẹyọ ọ̀rọ̀ orísun mọ́, ó sì sọ èrò ‘kò sí ọ̀kan’ ní Yorùbá tó ṣe déédé. Lílò “a” gẹ́gẹ́ bí ẹni àìsọ pàtó ń mú aláìṣe Gíríìkì jáde láì fi ẹni tó ṣe é kún ọ̀rọ̀, ó sì pa ìtọ́kasí Ìwé Mímọ́ àti ìdí ìmúṣẹ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ tó níyì. “A kò ní ṣẹ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún aláìṣe tí kò dárúkọ olùṣe; kò fi olùṣe tuntun tàbí ìtumọ̀ ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀.
