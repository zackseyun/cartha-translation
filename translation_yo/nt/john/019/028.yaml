id: JHN.19.28
reference: John 19:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: yo
  text: Lẹ́yìn èyí, Jésù, ní mímọ̀ pé ohun gbogbo ti parí tán, kí Ìwé Mímọ́ lè ṣẹ, ó wí pé, “Òùngbẹ ńgbẹ mí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo ńgbẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Lẹ́yìn èyí
  rationale: Ó jẹ́ ọ̀nà àdánidá láti fi ìyípadà àkókò hàn, ó sì pa ẹyọ ọ̀rọ̀ atọ́ka τοῦτο mọ́.
- source_word: εἰδὼς
  choice: ní mímọ̀ pé
  rationale: Ó ṣàfihàn pé Jésù mọ ohun tí a mẹ́nu kàn ní àkókò tí ó sọ̀rọ̀, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: ἤδη πάντα τετέλεσται
  choice: ohun gbogbo ti parí tán
  rationale: ‘Ti parí tán’ fi ipò ohun tí a ti mú dé òpin hàn, ó sì mú ìtumọ̀ ἤδη wá nínú àyíká ọ̀rọ̀ ní ọ̀nà Yorùbá àdánidá.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: kí Ìwé Mímọ́ lè ṣẹ
  rationale: Ìtumọ̀ yìí pa ìtumọ̀ ète tàbí àbájáde ἵνα mọ́, ó sì lo ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìmúṣẹ Ìwé Mímọ́.
- source_word: λέγει
  choice: ó wí pé
  rationale: A tú ìsinsìnyí ìtàn Gíríìkì sí ọ̀nà àkókò ìṣe tí ó bá ìtàn Yorùbá mu.
- source_word: Διψῶ
  choice: Òùngbẹ ń gbẹ mí
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ ẹni tí òùngbẹ ń gbẹ mu.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìmọ̀ Jésù, píparí ohun gbogbo, àti ṣíṣe Ìwé Mímọ́
  choice: Ẹsẹ náà sọ pé Jésù mọ̀ pé ohun gbogbo ti parí tán, lẹ́yìn náà ó sọ̀rọ̀ kí Ìwé Mímọ́ lè ṣẹ.
  alternative: A lè ka gbólóhùn náà gẹ́gẹ́ bí pé ọ̀rọ̀ Jésù yọrí sí ṣíṣe Ìwé Mímọ́, láìsọ ètò ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò sí i.
  rationale: A pa ìṣètò àti ìfọ̀rọ̀wérọ̀ inú Gíríìkì mọ́, láìfi èrò kan pàtó nípa ìmọ̀ ọjọ́ iwájú tàbí ìpinnu Ọlọ́run kún ọ̀rọ̀ náà. A tún yà ‘ti parí tán’ (τετέλεσται) sí ọ̀tọ̀ kúrò ní ‘lè ṣẹ’ (τελειωθῇ).
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn síbi tí ó yẹ. A gbé àmì àlàyé [a] sí ọ̀rọ̀ tí àlàyé náà ń tọ́ka sí, dípò lẹ́yìn ‘Lẹ́yìn èyí’.
