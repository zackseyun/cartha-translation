id: JHN.19.18
reference: John 19:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: yo
  text: níbi tí wọ́n ti kàn án mọ́ àgbélébùú, tí wọ́n sì kàn àwọn méjì mìíràn pẹ̀lú rẹ̀, ọ̀kan ní ìhà yìí àti ọ̀kan ní ìhà kejì, Jésù sì wà ní àárín wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: níbi tí
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ọ̀rọ̀ ìbátan ibi hàn, ó sì bá ìtumọ̀ adverb ibi náà mu.
- source_word: ἐσταύρωσαν
  choice: wọ́n ti kàn án mọ́ àgbélébùú
  rationale: Èyí ni gbólóhùn Yorùbá tí ó wọ́pọ̀, tí ó sì péye fún pípa ènìyàn lórí àgbélébùú, láì fi kún bí wọ́n ṣe ṣe é gan-an.
- source_word: μετ’ αὐτοῦ
  choice: pẹ̀lú rẹ̀
  rationale: μετά pẹ̀lú genitive túmọ̀ sí ìbáṣepọ̀ tàbí wíwà papọ̀; ‘pẹ̀lú rẹ̀’ mú un jáde ní ṣókí.
- source_word: ἄλλους δύο
  choice: àwọn méjì mìíràn
  rationale: Ó pa iye àti ìyàtọ̀ àwọn ẹni náà mọ́ láì ṣàfikún ‘ọkùnrin,’ èyí tí kò hàn gbangba nínú Gíríìkì.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: ọ̀kan ní ẹ̀gbẹ́ kọ̀ọ̀kan
  rationale: Ó sọ bí a ṣe pín àwọn méjèèjì sí ẹ̀gbẹ́ méjì ní Yorùbá àdánidá, ó sì pa àwòrán ipò wọn mọ́.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: Jésù sì wà ní àárín wọn
  rationale: Ó fi ipò Jésù ní àárín hàn kedere; ‘sì’ mú ìsopọ̀ δέ jáde láì sọ ọ́ di àtakò líle.
theological_decisions:
- issue: Bóyá kí a sọ ní tààrà pé Jésù wà láàárín àwọn méjì náà
  choice: Jésù sì wà ní àárín wọn
  alternative: Jésù sì ni ẹni àárín
  rationale: Gíríìkì fi Jésù sí ipò àárín lẹ́yìn tí ó mẹ́nu kan àwọn méjì ní ẹ̀gbẹ́ méjèèjì. Ìtumọ̀ yìí jẹ́ kedere ní Yorùbá, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A kò fi àmì àlàyé [a] sí ọ̀rọ̀ nítorí àlàyé Gẹ̀ẹ́sì tí a pèsè kò bá ibi àmì náà wà mu, ó sì ń fúnni ní àtúnṣàkójọpọ̀ ọ̀rọ̀ dípò àlàyé tó ṣe pàtàkì.
