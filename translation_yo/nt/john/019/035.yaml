id: JHN.19.35
reference: John 19:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: yo
  text: Ẹni tí ó ti rí i ti jẹ́rìí, ẹ̀rí rẹ̀ sì jẹ́ òtítọ́, ẹni náà sì mọ̀ pé òtítọ́ ni òun ń sọ, kí ẹ̀yin pẹ̀lú lè gbàgbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ̀yin pẹ̀lú lè máa bá a lọ ní gbígbàgbọ́.” Fọ́ọ̀mù subjunctive ti ìsinsìnyí náà lè ní ìtumọ̀ ohun tí ń bá a lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: ẹni tí ó ti rí i
  rationale: 'Ó pa ìtumọ̀ participle perfect mọ́: ẹni náà rí ohun tí ó ṣẹlẹ̀, ohun tí ó rí sì ṣì ṣe pàtàkì gẹ́gẹ́ bí ẹ̀rí. A kò fi ‘ẹlẹ́rìí ojú’ rọ́pò rẹ̀, kí a má bàa túmọ̀ ju ọ̀rọ̀ Gíríìkì lọ.'
- source_word: μεμαρτύρηκεν
  choice: ti jẹ́rìí
  rationale: Ìṣe perfect náà ń tọ́ka sí ẹ̀rí tí a ti jẹ́, tí agbára rẹ̀ sì ṣì wà. ‘Jẹ́rìí’ jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání, tí ó sì bá àyíká mu.
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: òtítọ́ ni ẹ̀rí rẹ̀
  rationale: Èyí sọ ní tààrà pé ẹ̀rí náà jẹ́ òtítọ́, ó sì ṣe é gbẹ́kẹ̀ lé; kò yí ἀληθινή padà sí ìtumọ̀ tó dín kù bí ‘ojúlówó’ nìkan.
- source_word: ἐκεῖνος
  choice: ẹni náà
  rationale: Ó pa agbára demonstrative náà mọ́ ju lílo ‘ó’ lásán lọ, láì pinnu bóyá akọ̀wé ń tọ́ka sí ara rẹ̀ tàbí sí ẹlẹ́rìí mìíràn.
- source_word: οἶδεν
  choice: mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ perfect, iṣẹ́ rẹ̀ jẹ́ stative present; ‘mọ̀’ ni Yorùbá àdánidá.
- source_word: ἀληθῆ λέγει
  choice: òtítọ́ ni òun ń sọ
  rationale: Ó tú idiom Gíríìkì náà ní Yorùbá àdánidá gẹ́gẹ́ bí sísọ òtítọ́. ‘Òun’ tún jẹ́ kí ẹni tí a ń tọ́ka sí hàn kedere láì fi ìdánimọ̀ kún un.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: kí ẹ̀yin pẹ̀lú lè gbàgbọ́
  rationale: ‘Kí ... lè’ fi ète ἵνα hàn; ‘ẹ̀yin pẹ̀lú’ pa ìtẹnumọ́ καὶ ὑμεῖς mọ́. ‘Gbàgbọ́’ kò pinnu bóyá ìgbàgbọ́ náà bẹ̀rẹ̀ nígbà yẹn tàbí ń bá a lọ.
theological_decisions:
- issue: Ẹni tí àwọn ọ̀rọ̀ ìtẹnumọ́ náà ń tọ́ka sí
  choice: 'A pa ọ̀rọ̀ náà mọ́ ní ẹni kẹta: ‘ẹni tí ó ti rí i’ àti ‘ẹni náà.’'
  alternative: Akọ̀wé tàbí ọmọ-ẹ̀yìn tí Jesu fẹ́ràn ń sọ̀rọ̀ nípa ara rẹ̀ ní ẹni kẹta; tàbí ó ń tọ́ka sí ẹlẹ́rìí mìíràn.
  rationale: Ọ̀rọ̀ Gíríìkì kò dárúkọ ẹlẹ́rìí náà ní pàtó. Ìtumọ̀ náà kò fi ìdánimọ̀ tí kò sí nínú ọ̀rọ̀ orísun kún un.
- issue: Agbára πιστεύητε
  choice: lè gbàgbọ́
  alternative: lè máa bá a lọ ní gbígbàgbọ́
  rationale: Present subjunctive lè ní ìtumọ̀ ìgbàgbọ́ tí ń bá a lọ, ṣùgbọ́n àyíká Johanu tún lè gba ìtumọ̀ bẹ̀rẹ̀ sí í gbàgbọ́. Ọ̀rọ̀ àkọ́kọ́ kò pinnu ọ̀kan ṣoṣo; àlàyé ìsàlẹ̀ ni ó tọ́ka sí àṣàyàn kejì.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. A lo ‘ẹ̀rí/jẹ́rìí’ láti so ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ pọ̀ ní kedere, a sì pa àìdánilójú nípa ẹni tí ẹsẹ̀ náà ń tọ́ka sí mọ́.
