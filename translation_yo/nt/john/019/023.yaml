  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa ní gbogbogbòò: àwọn ọmọ ogun gba àwọn aṣọ òde Jesu, pín wọn sí mẹ́rin, wọ́n sì gba aṣọ àwọ̀tẹ́lẹ̀ náà. Ṣùgbọ́n “títí dé ìsàlẹ̀” sọ ìtòsí ìhún kan tí ọ̀rọ̀ Gíríìkì kò sọ ní tààràtà; δι’ ὅλου ní ìtumọ̀ “jálẹ̀ gbogbo rẹ̀/gbogbo aṣọ náà.” “Ṣùgbọ́n” fún δέ tún lè mú ìyàtọ̀ tó lágbára ju ohun tí ọ̀rọ̀ náà ń ṣe níbí.'
