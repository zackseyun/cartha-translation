reference: John 19:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: yo
  text: Nítorí náà, nígbà tí àwọn ọmọ ogun ti kan Jésù mọ́ àgbélébùú, wọ́n mú àwọn aṣọ òde rẹ̀[a], wọ́n sì pín wọn sí ìpín mẹ́rin, ìpín kan fún ọmọ ogun kọ̀ọ̀kan; wọ́n sì tún mú aṣọ àwọ̀tẹ́lẹ̀ náà. Aṣọ àwọ̀tẹ́lẹ̀ náà kò ní ojúrán[c]; a hun ún láti òkè jálẹ̀ gbogbo aṣọ náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aṣọ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí aṣọ lápapọ̀, ṣùgbọ́n ó ṣeé ṣe kó túmọ̀ sí àwọn aṣọ òde níbí, ní ìyàtọ̀ sí aṣọ àwọ̀tẹ́lẹ̀ tí a mẹ́nu kàn lọ́tọ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “láti òkè.” Nínú àyíká yìí, ó ṣeé ṣe jù pé ó túmọ̀ sí pé a hun aṣọ náà láti apá òkè rẹ̀ jálẹ̀ gbogbo aṣọ náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a hun ún ní odindi kan jálẹ̀ gbogbo aṣọ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Nítorí náà, ... àwọn ọmọ ogun
  rationale: οὖν ń tẹ ìtàn náà síwájú; “Nítorí náà” so ẹsẹ̀ yìí mọ́ ohun tó ṣáájú láìfi ìtumọ̀ ẹ̀kọ́ kan kún un. στρατιῶται ni “àwọn ọmọ ogun.”
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: nígbà tí àwọn ọmọ ogun kan Jesu mọ́ àgbélébùú
  rationale: Àkókò aorist pẹ̀lú ὅτε fi hàn pé kíkàn Jesu mọ́ àgbélébùú ṣáájú pípín aṣọ; ọ̀rọ̀ Yorùbá yìí sọ ìtẹ̀lé ìṣẹ̀lẹ̀ náà lọ́nà àdánidá.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: wọ́n mú àwọn aṣọ òde rẹ̀
  rationale: ἱμάτια lè túmọ̀ sí aṣọ lápapọ̀, ṣùgbọ́n níbí ó ṣeé ṣe kó tọ́ka sí àwọn aṣọ òde ní ìyàtọ̀ sí χιτών tí a mẹ́nu kàn lọ́tọ̀.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: wọ́n sì pín wọn sí ìpín mẹ́rin, ìpín kan fún ọmọ ogun kọ̀ọ̀kan
  rationale: Bí ó tilẹ̀ jẹ́ pé lítírèsọ̀ ni “ṣe ìpín mẹ́rin,” “pín wọn sí ìpín mẹ́rin” jẹ́ Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ μέρος mọ́.
- source_word: καὶ τὸν χιτῶνα
  choice: wọ́n sì tún mú aṣọ àwọ̀tẹ́lẹ̀ náà
  rationale: χιτών jẹ́ aṣọ tí a wọ sún mọ́ ara. “Aṣọ àwọ̀tẹ́lẹ̀” yà á sọ́tọ̀ kúrò nínú àwọn aṣọ òde, “tún” sì fi agbára àfikún καί hàn.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Ṣùgbọ́n aṣọ àwọ̀tẹ́lẹ̀ náà kò ní ojúrán
  rationale: δέ mú àlàyé kékeré tó yà sí ohun tó ṣáájú wọlé; “Ṣùgbọ́n” jẹ́ ìsopọ̀ àdánidá. ἄραφος túmọ̀ sí ohun tí kò ní ojúrán.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: a hun ún láti òkè títí dé ìsàlẹ̀
  rationale: Nínú àyíká aṣọ, ἄνωθεν tọ́ka sí òkè aṣọ, δι’ ὅλου sì sọ pé híhun náà gba gbogbo gígùn rẹ̀. Gbólóhùn yìí jẹ́ Yorùbá àdánidá tó pa àwòrán orísun mọ́.
theological_decisions:
- issue: Ṣíṣe àpẹẹrẹ ẹ̀kọ́ ìgbàgbọ́ láti inú aṣọ Jesu tí kò ní ojúrán
  choice: A ṣe àpèjúwe bí a ṣe hun aṣọ náà nìkan, láìfi ìtumọ̀ àpẹẹrẹ ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
  alternative: Kí a túmọ̀ aṣọ náà gẹ́gẹ́ bí àfihàn aṣọ àlùfáà tàbí ìṣọ̀kan ìjọ.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ ṣàpèjúwe ìkọ́lé aṣọ àti ohun tí àwọn ọmọ ogun ṣe; kò sọ ìtumọ̀ àpẹẹrẹ kan ní tààràtà.
translation_notes:
  register: Yorùbá à标准 tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní tí òǹkàwé lásán lè lóye. “Aṣọ àwọ̀tẹ́lẹ̀” jẹ́ kedere ju gbígbé ọ̀rọ̀ àjèjì “túnìkì” wọlé lọ; “ojúrán” sì jẹ́ ọ̀rọ̀ aṣọ tó bá ἄραφος mu.
