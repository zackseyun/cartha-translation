  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: yo
  text: 'Mo fún yín ní àṣẹ tuntun kan[a]: kí ẹ nífẹ̀ẹ́ ara yín. Gẹ́gẹ́ bí mo ti nífẹ̀ẹ́ yín, kí ẹ̀yin náà nífẹ̀ẹ́ ara yín[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òfin tuntun kan.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ gbolohun kejì náà sí, “gẹ́gẹ́ bí mo ti nífẹ̀ẹ́ yín, kí ẹ̀yin náà lè nífẹ̀ẹ́ ara yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ẹni tó ní ọlá-àṣẹ pàṣẹ pé kí a ṣe; ó sì pa agbára ìwà rere ti ἐντολή mọ́. Àlàyé ìsàlẹ̀ fi “òfin” hàn gẹ́gẹ́ bí ọ̀nà mìíràn.
- source_word: καινὴν
  choice: tuntun
  rationale: “Tuntun” túmọ̀ ìtumọ̀ gbangba ti καινός láì pinnu nínú ẹsẹ yìí bóyá tuntun ní àkókò ni tàbí tuntun ní irú rẹ̀.
- source_word: δίδωμι ὑμῖν
  choice: Mo fún yín ní
  rationale: Èyí pa àwòrán Gíríìkì pé Jésù “fún” wọn ní àṣẹ náà mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédéé.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: kí ẹ nífẹ̀ẹ́ ara yín
  rationale: “Kí ẹ” fi àkóónú àti agbára àṣẹ ti ἵνα-clause hàn; “ara yín” jẹ́ ọ̀nà àdánidá láti sọ reciprocal ἀλλήλους ní Yorùbá.
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó fi ìfẹ́ Jésù hàn gẹ́gẹ́ bí àpẹẹrẹ àti òṣùwọ̀n ìfẹ́ àwọn ọmọ-ẹ̀yìn.
- source_word: ἠγάπησα ὑμᾶς
  choice: mo ti nífẹ̀ẹ́ yín
  rationale: “Mo ti nífẹ̀ẹ́ yín” jẹ́ Yorùbá àdánidá fún ìfẹ́ tí Jésù ti fi hàn sí wọn, láì yí ọ̀rọ̀ náà sí àlàyé gígùn.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: ẹ̀yin náà gbọ́dọ̀ nífẹ̀ẹ́ ara yín
  rationale: “Ẹ̀yin náà” pa ìtẹnumọ́ καὶ ὑμεῖς mọ́; “gbọ́dọ̀” mú agbára ìṣírí-àṣẹ inú ọ̀rọ̀ náà jáde ní Yorùbá. Àlàyé ìsàlẹ̀ pa ìtumọ̀ ète/àbájáde ti ἵνα mọ́.
theological_decisions:
- issue: Irú “àṣẹ tuntun” náà
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “àṣẹ tuntun” láì ṣàlàyé nínú ọ̀rọ̀ pàtàkì ohun tó mú un jẹ́ tuntun.
  alternative: Ó lè túmọ̀ sí tuntun ní àkókò, tuntun ní irú rẹ̀, tàbí tuntun nínú ìmúṣẹ rẹ̀ nípasẹ̀ àpẹẹrẹ Jésù.
  rationale: Ẹsẹ náà pè é ní tuntun, ṣùgbọ́n kò sọ pàtó nínú ara rẹ̀ bó ṣe jẹ́ tuntun; nítorí náà, a kò yanju ìbéèrè ẹ̀kọ́ ìgbàgbọ́ náà nínú ìtumọ̀.
- issue: Agbára ìtumọ̀ ἵνα kejì
  choice: A lo “gbọ́dọ̀” nínú ọ̀rọ̀ pàtàkì láti fi agbára àṣẹ hàn.
  alternative: “Kí ẹ̀yin náà lè nífẹ̀ẹ́ ara yín,” tó lè fi ète tàbí àbájáde hàn.
  rationale: Ìbáṣepọ̀ ἵνα kejì pẹ̀lú àṣẹ àkọ́kọ́ lè jẹ́ ìtẹnumọ́ ohun tí wọ́n gbọ́dọ̀ ṣe tàbí ìsọ ète/àbájáde; àlàyé ìsàlẹ̀ pa ọ̀nà kejì mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn. A lo “nífẹ̀ẹ́” ní ìgbà méjèèjì láti pa àsọtúnsọ ἀγαπάω mọ́.
