id: JHN.13.14
reference: John 13:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: yo
  text: Nítorí náà, bí èmi, Olúwa àti Olùkọ́, bá ti fọ ẹsẹ̀ yín, ẹ̀yin pẹ̀lú yẹ kí ẹ máa fọ ẹsẹ̀ ara yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριος ni a túmọ̀ sí “Olúwa” níhìn-ín nítorí pé ó ṣiṣẹ́ gẹ́gẹ́ bí oyè nínú àyíká ọ̀rọ̀ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: Ǹjẹ́ bí ... bá ...
  rationale: “Bí ... bá” ṣe àfihàn gbólóhùn oníwọ̀n εἰ, “ǹjẹ́” sì so ìpinnu ọ̀rọ̀ náà mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí οὖν ti ṣe.
- source_word: ἐγὼ
  choice: èmi
  rationale: A lo arọ́pò-orúkọ alágbára “èmi” láti pa ìtẹnumọ́ inú Gíríìkì mọ́, ní ìyàtọ̀ sí ojúṣe àwọn ọmọ-ẹ̀yìn.
- source_word: ἔνιψα
  choice: bá ti fọ
  rationale: Ìṣètò “bá ti fọ” jẹ́ èdè Yorùbá àdánidá fún ìṣe tí a ti parí, tí ó sì tún ṣe pàtàkì sí ọ̀rọ̀ tí a ń sọ.
- source_word: ὑμῶν τοὺς πόδας
  choice: ẹsẹ̀ yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi genitive pronoun àti direct object hàn.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ àkọ́kọ́ fún κύριος gẹ́gẹ́ bí oyè tí Jesu lò fún ara rẹ̀ ní àyíká ọ̀rọ̀ yìí.
- source_word: ὁ διδάσκαλος
  choice: Olùkọ́
  rationale: “Olùkọ́” túmọ̀ oyè náà ní tààrà, ó sì dúró lẹ́gbẹ̀ẹ́ “Olúwa” gẹ́gẹ́ bí orúkọ ipò.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin pẹ̀lú
  rationale: “Ẹ̀yin” pa ìtẹnumọ́ arọ́pò-orúkọ mọ́, “pẹ̀lú” sì fi hàn pé àwọn náà gbọ́dọ̀ ṣe bí Jesu ti ṣe.
- source_word: ὀφείλετε
  choice: ó yẹ kí
  rationale: “Ó yẹ kí” fi ojúṣe ìwà rere hàn láì sọ ọ́ di àṣẹ líle ju ìtumọ̀ ọ̀rọ̀ Gíríìkì lọ.
- source_word: ἀλλήλων
  choice: ara yín
  rationale: Nínú àkópọ̀ “ẹsẹ̀ ara yín,” ó túmọ̀ reciprocal “ẹsẹ̀ ara wọn lẹ́nì kìíní-kejì” ní Yorùbá àdánidá.
- source_word: νίπτειν τοὺς πόδας
  choice: máa fọ ẹsẹ̀
  rationale: “Fọ ẹsẹ̀” pa ìṣe pàtó ti fífọ apá ara mọ́; “máa” sì jẹ́ kí ojúṣe tí ń bá a lọ yéni ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí oyè nípa Kristi
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Àyíká ọ̀rọ̀ fi hàn pé oyè ni Jesu ń lò fún ara rẹ̀; “Olúwa” tún pa ìyàtọ̀ láàárín ipò gíga rẹ̀ àti iṣẹ́ ìrẹ̀lẹ̀ rẹ̀ mọ́.
- issue: Irú ojúṣe tí fífọ ẹsẹ̀ jẹ́
  choice: 'A pa ìṣe pàtó náà mọ́: “máa fọ ẹsẹ̀ ara yín”'
  alternative: Ẹ máa fi ìrẹ̀lẹ̀ sin ara yín
  rationale: Gíríìkì sọ fífọ ẹsẹ̀ ní tààrà. Bí ó tilẹ̀ jẹ́ pé ìṣe náà ní ìtumọ̀ àpẹẹrẹ, kò yẹ kí ìtumọ̀ rọ́pò rẹ̀ pẹ̀lú àlàyé gbooro tí ẹsẹ yìí kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin/yín” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, “máa fọ” sì mú kí ojúṣe ìṣe tí ń tẹ̀ síwájú hàn láì yí ìṣe pàtó náà padà sí àpẹẹrẹ lásán.
