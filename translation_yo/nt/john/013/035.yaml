base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: yo
  text: Nípa èyí ni gbogbo ènìyàn yóò fi mọ̀ pé ẹ̀yin ni àwọn ọmọ-ẹ̀yìn mi, bí ẹ bá ní ìfẹ́ sí ara yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ti gidi: “bí ẹ bá ní ìfẹ́ láàárín ara yín”; ìyẹn ni pé, bí ẹ bá ń fi ìfẹ́ hàn sí ara yín.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nípa èyí ni … yóò fi mọ̀
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àmì tàbí ẹ̀rí tí àwọn ènìyàn yóò fi dá àwọn ọmọ-ẹ̀yìn Jesu mọ̀; ìṣètò ‘nípa èyí … fi mọ̀’ jẹ́ èdè Yorùbá àdánidá.
- source_word: γνώσονται
  choice: yóò mọ̀
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú mọ́, ó sì lè túmọ̀ sí mímọ̀ tàbí dídámọ̀ nípa ẹ̀rí.
- source_word: πάντες
  choice: gbogbo ènìyàn
  rationale: Ó fi ìwọ̀n àgbáyé ti ọ̀rọ̀ Gíríìkì hàn láìfi ọkùnrin nìkan sí i.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: ọmọ-ẹ̀yìn mi ni ẹ̀yin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìbáṣepọ̀ ọmọ-ẹ̀yìn pẹ̀lú olùkọ́ rẹ̀.
- source_word: ἐὰν
  choice: bí
  rationale: ‘Bí’ pa ìṣèlérí oníṣ条件 ti ἐὰν mọ́, kò sì sọ pé ìfẹ́ ni wọ́n fi ń jèrè ipò ọmọ-ẹ̀yìn.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ ἀγάπη mu ní àyíká yìí.
- source_word: ἔχητε ἐν ἀλλήλοις
  choice: ẹ bá ní ìfẹ́ sí ara yín
  rationale: Ó sọ ìfẹ́ alábàápín di Yorùbá àdánidá, bó tilẹ̀ jẹ́ pé èdè Gíríìkì sọ ní ti gidi pé kí ìfẹ́ wà láàárín ara wọn.
theological_decisions:
- issue: Ìtumọ̀ πάντες tí ó jẹ́ akọ ní ìlànà gírámà
  choice: gbogbo ènìyàn
  alternative: gbogbo wọn
  rationale: Àwọn ènìyàn lápapọ̀ ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe àwọn ọkùnrin nìkan.
- issue: Irú ipò tí ἐὰν ń fi hàn
  choice: bí ẹ bá ní ìfẹ́ sí ara yín
  alternative: nígbà tí ẹ bá ní ìfẹ́ sí ara yín
  rationale: ‘Bí’ pa àìdájú oníṣ条件 inú Gíríìkì mọ́, ó sì fi ìfẹ́ hàn gẹ́gẹ́ bí àmì ọmọ-ẹ̀yìn, kì í ṣe ohun tí wọ́n fi ń ra tàbí jèrè ipò náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. Ìṣètò ‘Nípa èyí ni … yóò fi mọ̀’ jẹ́ àdánidá, ó sì pa ipa irinṣẹ́/ẹ̀rí ti ἐν τούτῳ mọ́. ‘Ara yín’ ń sọ ìfẹ́ alábàápín láìdi gbolohun náà mú.
