revisions:
- from: Símónì Pétérù wí fún un pé, “Olúwa, ibo ni ìwọ ń lọ?” Jésù dá a lóhùn pé, “Ibi tí èmi ń lọ, ìwọ kò lè tọ̀ mí lẹ́yìn nísinsìnyí[a], ṣùgbọ́n ìwọ yóò tọ̀ mí lẹ́yìn nígbà tó bá yá[b].”
  to: Símónì Pétérù wí fún un pé, “Olúwa, ibò ni o ń lọ?” Jésù dáhùn pé, “Ibi tí mo ń lọ, o kò lè tẹ̀lé mi nísinsìnyí[a], ṣùgbọ́n ìwọ yóò tẹ̀lé mi nígbà tó bá yá[b].”
  rationale: The revision corrects Yoruba orthography, improves idiomatic wording for following Jesus, and aligns the answer formula more closely with the Greek. It preserves the present-tense narrative wording, the contrast between “not now” and “later,” the future force, and the source text’s deliberate lack of specificity concerning Peter’s future following.
  reviewer_model: gpt-5.6-terra
