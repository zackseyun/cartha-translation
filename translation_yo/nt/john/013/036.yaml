review_pass:
  verdict: revise
  source_fidelity: 'The core meaning is accurately conveyed: Simon Peter asks Jesus where he is going, and Jesus says Peter cannot follow now but will follow later. The revision removes an unnecessary explicit object from “Jésù dá a lóhùn,” since the Greek simply says that Jesus answered, and retains the stated ambiguity about the later following.'
  naturalness: The draft is generally clear and suitably dignified. “Ibò” needs its tone mark, and “tẹ̀lé mi” is the more idiomatic modern Yoruba expression for following a person/disciple than “tọ̀ mí lẹ́yìn.” Removing the unneeded explicit pronouns makes the dialogue more natural without losing meaning.
  terminology: “Olúwa” appropriately renders Κύριε. “Tẹ̀lé mi” naturally renders ἀκολουθεῖν with Jesus as its object and preserves the discipleship resonance without making an interpretive claim. The ability nuance of δύναμαι is retained by “kò lè.”
  issues:
  - severity: low
    issue: Missing tone mark in “ibo.”
    rationale: The Standard Yoruba spelling is “ibò” (‘where’).
  - severity: medium
    issue: “tọ̀ mí lẹ́yìn” is less idiomatic here than “tẹ̀lé mi.”
    rationale: Although understandable literally, “tẹ̀lé mi” is the usual natural Yoruba wording for following a person and is especially apt in this discipleship context.
  - severity: low
    issue: “Jésù dá a lóhùn” supplies an object not expressed in the Greek.
    rationale: The referent is clear from context, but “Jésù dáhùn pé” more closely reflects the source without affecting readability.
  - severity: low
    issue: Footnote a describes δύναμαι as ability or opportunity.
    rationale: In this context the lexical point is specifically inability/capacity; adding “àǹfààní” may broaden the sense unnecessarily.
  revised_text: Símónì Pétérù wí fún un pé, “Olúwa, ibò ni o ń lọ?” Jésù dáhùn pé, “Ibi tí mo ń lọ, o kò lè tẹ̀lé mi nísinsìnyí[a], ṣùgbọ́n ìwọ yóò tẹ̀lé mi nígbà tó bá yá[b].”
  revised_footnotes:
