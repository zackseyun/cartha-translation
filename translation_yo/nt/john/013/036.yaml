id: JHN.13.36
reference: John 13:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: yo
  text: Símónì Pétérù wí fún un pé, “Olúwa, ibò ni o ń lọ?” Jésù dáhùn pé, “Ibi tí mo ń lọ, o kò lè tẹ̀lé mi nísinsìnyí[a], ṣùgbọ́n ìwọ yóò tẹ̀lé mi nígbà tó bá yá[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “o kò lè tẹ̀lé mi nísinsìnyí.” Ọ̀rọ̀ Gíríìkì náà fi ìtumọ̀ agbára tàbí ìṣàìlera láti ṣe ohun kan hàn ní kedere.
    reason: lexical_alternative
  - marker: b
    text: “Ìwọ yóò tẹ̀lé mi nígbà tó bá yá” lè tọ́ka sí bí Pétérù yóò ṣe tẹ̀lé Jésù nínú ìjìyà tàbí ikú ní ọjọ́ iwájú; ṣùgbọ́n ọ̀rọ̀ náà fúnra rẹ̀ kò sọ bí èyí yóò ṣe ṣẹlẹ̀ ní pàtó.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: wí
  rationale: A lo ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí láti pa historical present inú ìtàn Jòhánù mọ́, bí ó tilẹ̀ jẹ́ pé ó tún lè ṣe iṣẹ́ àsìkò ìtàn ní Yorùbá.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ tó bójú mu fún κύριος, ó sì pa ìtumọ̀ oyè àti ìjìnlẹ̀ ẹ̀kọ́ nípa Jésù mọ́.
- source_word: ποῦ ὑπάγεις
  choice: ibo ni ìwọ ń lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbéèrè nípa ibi tí ẹni ń lọ, láì fi ibi tí ó ń lọ tàbí ìdí rẹ̀ kún un.
- source_word: ἀπεκρίθη
  choice: dá a lóhùn
  rationale: Gbólóhùn Yorùbá tó ṣe déédé fún ìdáhùn nínú ìjíròrò.
- source_word: Ὅπου ὑπάγω
  choice: Ibi tí èmi ń lọ
  rationale: Ó tún ọ̀rọ̀ ìṣe “ń lọ” inú ìbéèrè Pétérù ṣe, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ ὑπάγεις/ὑπάγω mọ́.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: ìwọ kò lè tọ̀ mí lẹ́yìn nísinsìnyí
  rationale: “Kò lè” fi agbára tàbí àǹfààní ṣíṣe inú δύναμαι hàn ní kedere; “tọ̀ mí lẹ́yìn” jẹ́ ọ̀nà àdánidá fún ἀκολουθέω pẹ̀lú μοι.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: ṣùgbọ́n ìwọ yóò tọ̀ mí lẹ́yìn nígbà tó bá yá
  rationale: “Yóò” pa àsìkò ọjọ́ iwájú mọ́; “ṣùgbọ́n” fi ìtakora sí “kì í ṣe nísinsìnyí” hàn, “nígbà tó bá yá” sì túmọ̀ ὕστερον lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí títọ̀ Jésù lẹ́yìn ní ọjọ́ iwájú túmọ̀ sí fún Pétérù
  choice: A fi gbólóhùn náà sílẹ̀ láì sọ pàtó bóyá ó ń tọ́ka sí ìjìyà tàbí ikú Pétérù, ìpadàbọ̀ rẹ̀ sínú iṣẹ́ ọmọ-ẹ̀yìn, tàbí títẹ̀lé Jésù ní ìtumọ̀ tó gbòòrò.
  alternative: Kí a túmọ̀ ọ́ ní pàtó gẹ́gẹ́ bí àsọtẹ́lẹ̀ ikú ajẹ́rìíkú Pétérù.
  rationale: Gíríìkì sọ pé kò lè tẹ̀lé ní báyìí ṣùgbọ́n yóò tẹ̀lé lẹ́yìn; kò sọ irú títẹ̀lé náà ní pàtó. Ìtumọ̀ náà pa àìmọ̀ọ́mọ̀ yìí àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Àṣàyàn ọ̀rọ̀ jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ìwọ/èmi” fún ìtẹnumọ́ tí àrọ́pò-orúkọ Gíríìkì àti ìtakora ọ̀rọ̀ náà ń gbé jáde.
