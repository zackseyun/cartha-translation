id: JHN.13.2
reference: John 13:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: yo
  text: Nígbà tí oúnjẹ alẹ́ sì ń lọ lọ́wọ́[a], Èṣù ti fi èrò sí ọkàn Júdásì Iskariotu, ọmọ Símónì, láti fi Jesu lé ọwọ́[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí oúnjẹ alẹ́ ń lọ lọ́wọ́.” Ọ̀rọ̀ Gíríìkì kò túmọ̀ sí pé oúnjẹ náà ti parí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ti sún un láti ṣe é.” Ní tààràtà, “ti fi sínú ọkàn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “láti da Jesu.” Ní tààràtà, ọ̀rọ̀ Gíríìkì túmọ̀ sí “láti fi í lé ọwọ́”; nínú àyíká yìí, ìṣe náà jẹ́ ìwà ọ̀dàlẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: Nígbà tí wọ́n sì ń jẹ oúnjẹ alẹ́
  rationale: Gbólóhùn olùní genitive yìí fi hàn pé ìṣẹ̀lẹ̀ náà ń ṣẹlẹ̀ ní àkókò oúnjẹ, kì í ṣe lẹ́yìn tí oúnjẹ parí. Èdè yìí bá Yorùbá òde òní mu.
- source_word: διάβολος
  choice: Èṣù
  rationale: Nínú ìtàn Jòhánù, ọ̀rọ̀ náà ń tọ́ka sí ẹni ibi náà gan-an; “Èṣù” ni orúkọ tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: ti fi èrò sí ọkàn
  rationale: Èyí pa àwòrán “fífi sínú ọkàn” mọ́, ó sì mú kí ohun tí a kò sọ ní Gíríìkì—ìpinnu tàbí èrò—yé ẹni tó ń kà á láì sọ pé Èṣù mú Júdásì ṣe é láìní ìfẹ́ tirẹ̀.
- source_word: καρδίαν
  choice: ọkàn
  rationale: “Ọkàn” pa àkàwé Gíríìkì mọ́, ó sì lè ní ìtumọ̀ ibi ìfẹ́-inú àti èrò nínú Yorùbá.
- source_word: ἵνα παραδοῖ
  choice: láti fi Jesu lé àwọn ọ̀tá rẹ̀ lọ́wọ́
  rationale: παραδίδωμι túmọ̀ sí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́; nínú ọ̀rọ̀ Júdásì, ìṣe náà jẹ́ ìwà ọ̀dàlẹ̀. Ìtumọ̀ yìí pa àwòrán ìfifúnni-lọ́wọ́ mọ́, ó sì mú agbára ọ̀rọ̀ náà hàn.
- source_word: αὐτόν
  choice: Jesu
  rationale: A tún orúkọ Jesu sọ dípò arọ́pò-orúkọ nítorí gbolohun Yorùbá náà ní àwọn ọkùnrin méjì lẹ́gbẹ̀ẹ́ ara wọn; èyí yọ ìdàrúdàpọ̀ kúrò láìyí ẹni tí arọ́pò-orúkọ Gíríìkì ń tọ́ka sí padà.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Júdásì Iskariotu, ọmọ Símónì
  rationale: Ètò yìí tẹ̀ lé àfihàn pé Júdásì ni Iskariotu, Símónì sì ni baba rẹ̀, ó sì yẹra fún ìtumọ̀ tí yóò dà bí ẹni pé Símónì ni a ń pè ní Iskariotu.
theological_decisions:
- issue: Ipa Èṣù àti ojúṣe Júdásì nínú ìwà ọ̀dàlẹ̀
  choice: A sọ pé Èṣù ti fi èrò náà sí ọkàn Júdásì, ṣùgbọ́n Júdásì ṣì ni ẹni tí yóò fi Jesu lé àwọn ọ̀tá rẹ̀ lọ́wọ́.
  alternative: Èṣù ti sún Júdásì láti ṣe é; tàbí Èṣù ló pinnu rẹ̀ nípasẹ̀ Júdásì.
  rationale: Gíríìkì fi ipa Èṣù hàn, síbẹ̀ ó sọ pé Júdásì ni ẹni tí yóò ṣe ìwà náà. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìyanjú rẹ̀ sí ọ̀nà ìpinnu-kádàrá tàbí sí ọ̀nà tí yóò mú ojúṣe Júdásì kúrò.
translation_notes:
  register: Yorùbá àpéjọ tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. “Oúnjẹ alẹ́” jẹ́ èdè òde òní tí ó ṣe kedere; “fi èrò sí ọkàn” pa àkàwé orísun mọ́ ní ọ̀nà àdánidá. A fi àmì àlàyé [c][b] sí ibi tí gbolohun tí wọ́n ń ṣàlàyé parí, gẹ́gẹ́ bí ìtẹ̀jáde ìfọ̀rọ̀wánilẹ́nuwò.
