source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: yo
  text: Jésù mọ̀ pé Bàbá ti fi ohun gbogbo lé e lọ́wọ́, àti pé ó ti ọ̀dọ̀ Ọlọ́run wá[a], ó sì ń lọ sọ́dọ̀ Ọlọ́run[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jáde wá láti ọ̀dọ̀ Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń padà lọ sọ́dọ̀ Ọlọ́run”; Gíríìkì sọ ní ṣókí pé, “ó ń lọ sọ́dọ̀ Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: mọ̀ pé
  rationale: Ó fi ìmọ̀ Jésù hàn gẹ́gẹ́ bí ipò tó ṣáájú ìṣe tó tẹ̀ lé e nínú àyíká ọ̀rọ̀, láìfi ìtumọ̀ àkókò kún un ju bó ṣe yẹ lọ.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Èyí fi ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ aláìlẹ́mìí náà hàn ní kíkún, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἔδωκεν
  choice: ti fi
  rationale: Àmì ‘ti’ fi hàn pé fífi náà ti ṣẹlẹ̀ ṣáájú àkókò ìṣẹ̀lẹ̀ yìí, gẹ́gẹ́ bí ìbáṣepọ̀ ọ̀rọ̀ ṣe fi hàn.
- source_word: εἰς τὰς χεῖρας
  choice: lé òun lọ́wọ́
  rationale: Àṣàọ̀rọ̀ Yorùbá yìí pa àwòrán ọwọ́ mọ́, ó sì túmọ̀ sí fífi ohun sábẹ́ àṣẹ tàbí ìtọ́jú ẹnì kan.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: A pa orúkọ oyè náà mọ́ láìfi arọ́pò-orúkọ ohun-ìní tí kò sí nínú Gíríìkì kún un.
- source_word: ἀπὸ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Èyí pa ‘Ọlọ́run’ mọ́ dípò yíyí i sí ‘Baba,’ ó sì sọ orísun tàbí ibi tí ó ti wá ní Yorùbá àdánidá.
- source_word: ἐξῆλθεν
  choice: ti ... wá
  rationale: ‘Ti ... wá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìpilẹ̀ṣẹ̀ tàbí ibi tí Jésù ti wá, láìfi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
- source_word: πρὸς τὸν θεὸν
  choice: sọ́dọ̀ Ọlọ́run
  rationale: ‘Sọ́dọ̀’ fi ìlọ síhà ọ̀dọ̀ ẹni kan àti ìbáṣepọ̀ pẹ̀lú ẹni náà hàn dáadáa, láìsọ pé ‘padà’ ní pàtó.
- source_word: ὑπάγει
  choice: ń lọ
  rationale: Ìṣe tó ń lọ lọ́wọ́ yìí bá ọ̀rọ̀ Gíríìkì mu, ó sì fi ìlọ tàbí ìkúrò tó ń bọ̀ hàn láìṣe àlàyé ju ọ̀rọ̀ náà lọ.
theological_decisions:
- issue: Ọ̀rọ̀ nípa ibi tí Kristi ti wá nínú ἀπὸ θεοῦ ἐξῆλθεν
  choice: òun ti ọ̀dọ̀ Ọlọ́run wá
  alternative: òun jáde wá láti ọ̀dọ̀ Ọlọ́run
  rationale: Àyànfẹ́ yìí pa ọ̀rọ̀ Jòhánù nípa orísun àti iṣẹ́ Jésù mọ́, ṣùgbọ́n kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ ní tààrà kún un.
- issue: Ibi tí Jésù ń lọ nínú πρὸς τὸν θεὸν ὑπάγει
  choice: ó ń lọ sọ́dọ̀ Ọlọ́run
  alternative: ó ń padà lọ sọ́dọ̀ Ọlọ́run
  rationale: Àyànfẹ́ yìí kò fi ‘padà’ kún Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè mú kí òǹkàwé lóye ìpadà; báyìí ni a ṣe pa àìsọ pàtó inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lò ‘òun’ fún Jésù nínú gbólóhùn abẹ́ láti yẹra fún ìdàrúdàpọ̀ ẹni tí arọ́pò-orúkọ ń tọ́ka sí. A fi àmì kọ́mà sí òpin nítorí ẹsẹ̀ náà ń bá ìṣe ẹsẹ̀ 4 lọ.
