  to: Ẹ̀yin ọmọ mi kéékèèké, mo ṣì wà pẹ̀lú yín fún ìgbà díẹ̀ sí i. Ẹ ó wá mi; bí mo sì ti sọ fún àwọn Júù[a] pé, ‘Ibi tí èmi ń lọ, ẹ̀yin kò lè wá,’ bẹ́ẹ̀ ni mo tún ń sọ fún yín nísinsin yìí.
