id: JHN.13.33
reference: John 13:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: yo
  text: Ẹ̀yin ọmọ mi kéékèèké, mo ṣì wà pẹ̀lú yín fún ìgbà díẹ̀ sí i. Ẹ ó wá mi; bí mo sì ti sọ fún àwọn Júù[a] pé, ‘Ibi tí èmi ń lọ, ẹ̀yin kò lè wá,’ bẹ́ẹ̀ ni mo tún ń sọ fún yín nísinsin yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aṣáájú àwọn Júù.” Nínú ìwé Jòhánù, “àwọn Júù” lè tọ́ka ní pàtó sí àwọn aláṣẹ ní Jùdíà nígbà míì, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Ẹ̀yin ọmọ mi kéékèèké
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́ tó ní ìtumọ̀ ọmọ kékeré. Fífi “mi” kún un mú ìbáṣepọ̀ onífẹ̀ẹ́ náà ṣe kedere ní Yorùbá láìsọ ìtumọ̀ rẹ̀ di ẹ̀kọ́ mìíràn.
- source_word: ἔτι μικρόν
  choice: ìgbà díẹ̀ sí i
  rationale: Ó tọ́ka sí àkókò kúkúrú tó ṣì kù; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ni èmi yóò fi wà pẹ̀lú yín
  rationale: Ó pa ìtumọ̀ wíwà pẹ̀lú wọn mọ́. Àmì ọjọ́ iwájú inú Yorùbá ń ṣiṣẹ́ pọ̀ mọ́ “ìgbà díẹ̀ sí i” láti sọ iye àkókò tó kù, kì í ṣe láti yí ìtumọ̀ ọ̀rọ̀ Gíríìkì padà.
- source_word: ζητήσετέ με
  choice: Ẹ ó wá mi
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn fún ìwádi tàbí lílépa ẹni tí a fẹ́ rí.
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: bí mo sì ti sọ fún àwọn Júù
  rationale: “Àwọn Júù” ni ìtumọ̀ taara Ἰουδαίοις; a kò fi “àwọn aṣáájú” sí ọ̀rọ̀ pàtàkì nítorí ẹsẹ̀ yìí fúnra rẹ̀ kò fi dandan mú ìtumọ̀ náà dín kù.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ibi tí èmi ń lọ
  rationale: Ó sọ ìlọ tàbí ìkúrò lọ́nà Yorùbá tó ṣe kedere, ó sì pa ìtẹnumọ́ ἐγώ mọ́ nípasẹ̀ “èmi.”
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ẹ̀yin kò lè wá
  rationale: “Kò lè” ń fi àìlè ṣe hàn ní tààrà, “wá” sì bá ἐλθεῖν mu ju “lọ” lọ, bó tilẹ̀ jẹ́ pé ibi tí Jésù ń lọ ni a ń sọ̀rọ̀ lé lórí.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: bẹ́ẹ̀ ni mo tún ń sọ fún yín nísinsin yìí
  rationale: Ó mú ìfiwéra pẹ̀lú ohun tí Jésù ti sọ tẹ́lẹ̀ àti lílò ó fún àwọn ọmọ-ẹ̀yìn ní báyìí hàn ní kedere.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίοις nínú àyíká ìwé Jòhánù
  choice: àwọn Júù
  alternative: àwọn aṣáájú àwọn Júù tàbí àwọn aláṣẹ ní Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn Júù lápapọ̀, bí ó tilẹ̀ jẹ́ pé ní àwọn ibòmíràn nínú Jòhánù àyíká ọ̀rọ̀ lè dín ẹni tí ó ń tọ́ka sí kù. Ẹsẹ̀ yìí kò tó láti yan ìtumọ̀ tó dín kù, nítorí náà a pa àìdánilójú náà mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹ̀yin ọmọ mi kéékèèké” ń gbé ìfẹ́ inú ọ̀rọ̀ ìpè náà jáde; ìtẹ̀sí gbolohun tó tẹ̀ lé e sì jẹ́ kedere fún òǹkàwé òde òní. A kò gbe àlàyé Gẹ̀ẹ́sì kejì lórí “you cannot come” wọlé gẹ́gẹ́ bí àlàyé ìsàlẹ̀, nítorí “ẹ̀yin kò lè wá” ti jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìtumọ̀ δύνασθε mọ́.
