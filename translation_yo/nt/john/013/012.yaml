  to: Nítorí náà, nígbà tí ó ti fọ ẹsẹ̀ wọn, tí ó sì mú àwọn aṣọ rẹ̀, tí ó sì tún dùbúlẹ̀ ní tábìlì[a], ó wí fún wọn pé, “Ṣé ẹ lóye ohun tí mo ṣe fún yín[b]?”
