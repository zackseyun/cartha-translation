id: JHN.13.12
reference: John 13:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: yo
  text: Nítorí náà, nígbà tí ó ti fọ ẹsẹ̀ wọn, tí ó sì mú àwọn aṣọ rẹ̀, tí ó sì tún dùbúlẹ̀ ní tábìlì[a], ó wí fún wọn pé, “Ṣé ẹ lóye ohun tí mo ṣe fún yín[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tún jókòó”; ọ̀rọ̀ Gíríìkì náà tọ́ka sí ìdùbúlẹ̀ ní tábìlì nígbà oúnjẹ.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́, “ohun tí mo ṣe sí yín”; ọ̀rọ̀ Gíríìkì náà lè gba ìtumọ̀ méjèèjì, bí ó tilẹ̀ jẹ́ pé “fún yín” bá àyíká iṣẹ́ ìránṣẹ́ mu dáadáa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Nítorí náà, lẹ́yìn tí
  rationale: Ọ̀rọ̀ yìí pa ìtẹ̀síwájú ìtàn mọ́, ó sì fi hàn pé àwọn ìṣe tó tẹ̀ lé e ṣẹlẹ̀ lẹ́yìn fífọ ẹsẹ̀ náà.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: ó ti fọ ẹsẹ̀ wọn
  rationale: Àpólà yìí jẹ́ Yorùbá àdánidá, ó sì fi ìṣe tí ó ti parí ṣáájú ìṣe pàtàkì hàn.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: ó sì mú aṣọ rẹ̀
  rationale: ἔλαβεν túmọ̀ sí pé ó mú tàbí gba aṣọ náà; a kò fi ìtumọ̀ àfikún ‘wọ̀ ọ́’ sínú ọ̀rọ̀ Gíríìkì.
- source_word: ἀνέπεσεν
  choice: ó sì tún jókòó síbi oúnjẹ
  rationale: Ní àṣà àsè ìgbà náà, ọ̀rọ̀ náà ń tọ́ka sí dídùbúlẹ̀ ní tábìlì; ‘jókòó síbi oúnjẹ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó padà gba ipò rẹ̀ níbi àsè, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
- source_word: Γινώσκετε
  choice: Ṣé ẹ lóye
  rationale: Nínú ìbéèrè yìí, kókó rẹ̀ ni bóyá wọ́n mọ ìtumọ̀ àti pàtàkì ohun tí Jésù ṣe, kì í ṣe ìmọ̀ lásán.
- source_word: τί πεποίηκα ὑμῖν
  choice: ohun tí mo ṣe fún yín
  rationale: Ìṣe náà ti parí ṣùgbọ́n ó ṣì ní ìtumọ̀ lọ́wọ́lọ́wọ́; ‘fún yín’ bá ìtumọ̀ iṣẹ́ ìránṣẹ́ mu, bí ó tilẹ̀ jẹ́ pé dative ὑμῖν tún lè túmọ̀ sí ‘sí yín.’
theological_decisions:
- issue: Ìdúró Jésù níbi àsè lẹ́yìn fífọ ẹsẹ̀ àwọn ọmọ-ẹ̀yìn
  choice: tún jókòó síbi oúnjẹ
  alternative: tún dùbúlẹ̀ síbi oúnjẹ
  rationale: A pa àyíká àsè mọ́ ní Yorùbá tó ṣeé lóye, a sì ṣàlàyé pé ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí dídùbúlẹ̀ ní tábìlì, láì sọ ìdúró ara náà di ẹ̀kọ́ ìgbàgbọ́.
- issue: Ìtumọ̀ ὑμῖν nínú ìbéèrè Jésù
  choice: fún yín
  alternative: sí yín
  rationale: ‘Fún yín’ mú abala iṣẹ́ ìránṣẹ́ àti àǹfààní àwọn ọmọ-ẹ̀yìn jáde, ṣùgbọ́n a pa ‘sí yín’ mọ́ gẹ́gẹ́ bí ìtumọ̀ gírámà tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọ̀wọ̀ tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ púpọ̀ fún àwọn ọmọ-ẹ̀yìn, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
