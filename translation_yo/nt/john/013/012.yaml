  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ èrò ẹsẹ̀ náà dáadáa, ṣùgbọ́n “tún jókòó síbi oúnjẹ” kò pa ìtumọ̀ pàtó ἀνέπεσεν mọ́ tó: ó tọ́ka sí ìdùbúlẹ̀/ìgbọ̀nsẹ̀ ní tábìlì ní àṣà àsè ìgbàanì. “Aṣọ rẹ̀” lè jẹ́ ọ̀rọ̀ àpapọ̀ ní Yorùbá, ṣùgbọ́n “àwọn aṣọ rẹ̀” túbọ̀ hàn gbangba fún τὰ ἱμάτια. “Fún yín” jẹ́ ìtúmọ̀ tí ó ṣeé ṣe, pẹ̀lú yíyan mìíràn “sí yín” nínú àlàyé ìsàlẹ̀.'
