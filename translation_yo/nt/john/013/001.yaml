id: JHN.13.1
reference: John 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: yo
  text: Ṣáájú àjọyọ̀ Ìrékọjá, Jésù mọ̀ pé wákàtí rẹ̀ ti dé láti kúrò ní ayé yìí lọ sọ́dọ̀ Baba; ó ti fẹ́ràn àwọn tirẹ̀ tí wọ́n wà ní ayé, ó sì fẹ́ràn wọn títí dé òpin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní kíkún” tàbí “pátápátá.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ó fẹ́ràn wọn títí di òpin, ó sì tún lè túmọ̀ sí pé ó fẹ́ràn wọn ní ẹ̀kúnrẹ́rẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ
  choice: Ṣáájú
  rationale: Πρό pẹ̀lú ọ̀rọ̀-orúkọ nínú genitive ń tọ́ka sí ohun tí ó ṣáájú ní àkókò. A kò fi δέ hàn pẹ̀lú ọ̀rọ̀ ìyàtọ̀ líle, nítorí ó jẹ́ àsopọ̀ onírẹ̀lẹ̀ nínú àyíká yìí.
- source_word: τῆς ἑορτῆς τοῦ πάσχα
  choice: àjọ̀dún Ìrékọjá
  rationale: Ìtumọ̀ náà ni àjọ̀dún Pásíkà àwọn Júù; “àjọ̀dún Ìrékọjá” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ ἑορτή mọ́.
- source_word: εἰδὼς
  choice: mọ̀ pé
  rationale: Participle náà fi hàn pé Jésù mọ ohun tó ń ṣẹlẹ̀ ní àkókò ìṣe pàtàkì náà. Ìlò gbolohun aláìlẹ́gbẹ́ “mọ̀ pé” dára sí Yorùbá àdánidá.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: wákàtí rẹ̀ ti dé
  rationale: 'Èyí pa àpẹẹrẹ ọ̀rọ̀ pàtàkì nínú Jòhánù mọ́: àkókò tí a yàn fún ìjìyà, ìlọkúrò àti ògo Jésù ti dé.'
- source_word: μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: láti kúrò ní ayé yìí lọ sọ́dọ̀ Baba
  rationale: “Kúrò … lọ sọ́dọ̀” fi ìyípadà láti inú ayé yìí sí ọ̀dọ̀ Baba hàn láìsọ ọ́ di ikú nìkan tàbí láìṣàlàyé rẹ̀ ju orísun lọ.
- source_word: ἀγαπήσας
  choice: ó ti fẹ́ràn
  rationale: Àmì àsìkò “ti” fi ìfẹ́ tí ó ti wà tẹ́lẹ̀ hàn. Pínyà gbolohun pẹ̀lú àmì semicolon jẹ́ kí Yorùbá dùn nípa ti ẹ̀dá, bí ó tilẹ̀ jẹ́ pé a pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú ìṣe àkọ́kọ́.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: àwọn tirẹ̀ tí ó wà ní ayé
  rationale: “Àwọn tirẹ̀” pa ìtọ́kasí tó gbòòrò àti ìbáṣepọ̀ inú Giriki mọ́, láìdín un kù sí àwọn ọmọ-ẹ̀yìn nìkan.
- source_word: εἰς τέλος
  choice: títí dé òpin
  rationale: Èyí pa ìtumọ̀ àkókò mọ́, ó sì lè tún gbé ìtumọ̀ ìfẹ́ pípé. Àlàyé ìsàlẹ̀ ojú ìwé sọ àwọn ìtumọ̀ méjèèjì láìyanju àìdánilójú náà.
- source_word: ἠγάπησεν αὐτούς
  choice: ó sì fẹ́ràn wọn
  rationale: A tún lo “fẹ́ràn” fún ἀγαπάω láti pa ìṣọ̀kan ọ̀rọ̀ àti ìtẹnumọ́ Giriki mọ́.
theological_decisions:
- issue: Ìtumọ̀ εἰς τέλος nínú gbólóhùn tó parí ẹsẹ náà
  choice: títí dé òpin
  alternative: dé ìwọ̀n tó pé pátápátá; pátápátá
  rationale: Ọ̀rọ̀ Giriki náà lè tọ́ka sí ìfẹ́ tó dúró títí di ìṣẹ́jú ìkẹyìn àti sí ìfẹ́ ní ẹ̀kúnrẹ́rẹ́. Ìtumọ̀ inú ẹsẹ pa ìfarahàn méjèèjì mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “Baba” gẹ́gẹ́ bí oyè ìbáṣepọ̀ ní ara Jòhánù, a sì lo àmì semicolon láti jẹ́ kí ìtòlẹ́sẹẹsẹ participle Giriki wọ Yorùbá láìdi gbolohun náà lọ́wọ́.
