  terminology: A pa ‘gba’ mọ́ ní gbogbo ẹsẹ náà láti fi àtúnsọ λαμβάνω hàn. ‘Ẹni tí ó rán mi’ ń pa ọ̀rọ̀ orísun mọ́, láìfi ‘Baba’ kún un nínú ọ̀rọ̀ àkọ́kọ́.
