id: JHN.13.20
reference: John 13:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: yo
  text: “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹnikẹ́ni tí ó gba ẹni tí mo bá rán, ó gba mí; ẹni tí ó sì gba mí, ó gba ẹni tí ó rán mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ ìṣáájú tí a tún sọ lẹ́ẹ̀mejì mọ́, ó sì jẹ́ Yorùbá àdánidá tí òǹkàwé òde òní lè lóye.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ó túmọ̀ ọ̀rọ̀ ìkéde náà ní tààrà, ó sì bá ìforítì ọ̀rọ̀ yìí mu.
- source_word: ὁ λαμβάνων ἄν τινα πέμψω
  choice: ẹnikẹ́ni tí ó bá gba ẹni tí mo rán
  rationale: ‘Ẹnikẹ́ni’ àti ‘tí ó bá’ fi ìtumọ̀ gbogbogbò àti àìsọ ẹni pàtó inú ἄν τινα pọ̀ mọ́ fọ́ọ̀mù subjunctive πέμψω hàn.
- source_word: λαμβάνει
  choice: ó gba
  rationale: ‘Gba’ lè túmọ̀ sí gbígba tàbí tẹ́wọ́ gba ènìyàn ní àyíká ọ̀rọ̀ yìí, ó sì jẹ́ kí àtúnsọ ọ̀rọ̀ náà dúró gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: ẹni tí ó sì gba èmi
  rationale: ‘Sì’ ṣe àsopọ̀ aláìlágbára tó bá δέ mu, láìsọ ọ́ di ìtakora; ‘èmi’ fi ìtẹnumọ́ ἐμέ hàn.
- source_word: τὸν πέμψαντά με
  choice: ẹni tí ó rán mi
  rationale: Ó pa ọ̀rọ̀ ìbátan ẹni tó rán Jésù mọ́ láìfi orúkọ oyè kan tí kò sí nínú ẹsẹ náà kún un.
theological_decisions:
- issue: Ìdánimọ̀ ‘ẹni tí ó rán mi’
  choice: ẹni tí ó rán mi
  alternative: Baba tí ó rán mi
  rationale: Nínú àyíká Ìhìn Rere Jòhánù, ọ̀rọ̀ náà ń tọ́ka sí Baba, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò lo oyè ‘Baba’; ìtumọ̀ náà pa ìṣọ̀rọ̀ orísun mọ́.
- issue: Àwọn participle akọ tí wọ́n ní ìtumọ̀ gbogbogbò
  choice: ẹnikẹ́ni / ẹni tí ó
  alternative: ọkùnrin tí ó
  rationale: Àwọn fọ́ọ̀mù akọ náà dúró fún ẹnikẹ́ni lápapọ̀, kì í ṣe fún ọkùnrin nìkan; Yorùbá kò nílò fífi akọ sí i.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì pa àtúnsọ àti ìtẹnumọ́ Gíríìkì mọ́. A lo ‘wí’ dípò ‘sọ’ láti mú ìforítì ìkéde náà hàn láìjẹ́ kí ó di èdè àtijọ́ jù.
