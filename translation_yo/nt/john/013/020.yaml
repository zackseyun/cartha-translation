revisions:
- from: “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹnikẹ́ni tí ó bá gba ẹni tí mo rán, ó gba èmi; ẹni tí ó sì gba èmi, ó gba ẹni tí ó rán mi.”
  to: “Lóòótọ́, lóòótọ́ ni mo wí fún yín, ẹnikẹ́ni tí ó gba ẹni tí mo bá rán, ó gba mí; ẹni tí ó sì gba mí, ó gba ẹni tí ó rán mi.”
  rationale: A tún gírámà arọ́pò-orúkọ ohun-ìṣe ṣe (‘mí’ dípò ‘èmi’) ní ibòmíràn méjèèjì. A tún ṣe ‘mo rán’ sí ‘mo bá rán’ kí ìtumọ̀ aláìpẹ̀kun/subjunctive ti ἄν τινα πέμψω lè hàn. A kò fi ìdánimọ̀ ẹni tí ó rán Jésù sí ‘Baba’ sínú ọ̀rọ̀ àkọ́kọ́, nítorí kò sí ní gbangba nínú ẹsẹ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:27:35Z'
