  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: yo
  text: Èmi kò sọ̀rọ̀ nípa gbogbo yín[a]. Mo mọ àwọn tí mo ti yàn. Ṣùgbọ́n kí Ìwé Mímọ́ lè ṣẹ pé, “Ẹni tí ó ń jẹ búrẹ́dì mi ti gbé ìgìgísẹ̀ rẹ̀ sókè sí mi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó tẹ̀lé ìrísí Gíríìkì pẹ̀lú: “Èmi kò sọ nípa gbogbo yín.”'
    reason: lexical_alternative
  - marker: b
    text: Àyọlò tàbí ìtọ́kasí sí Sáàmù 41:9. Gbólóhùn “gbé ìgìgísẹ̀ rẹ̀ sókè sí mi” jẹ́ àpẹẹrẹ ọ̀rọ̀ fún ìṣọ̀tá àti ìdàlẹ́bi.
    reason: cross_reference_and_lexical_explanation
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Èmi kò sọ̀rọ̀ nípa gbogbo yín
  rationale: Ó pa ìtumọ̀ περὶ (‘nípa’) àti bí ìkọ̀sílẹ̀ náà ṣe kan ‘gbogbo yín’ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: οἶδα
  choice: Mo mọ
  rationale: 'Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí perfect, ìtumọ̀ rẹ̀ ní Koiné jẹ́ ti àsìkò ìsinsìnyí: ‘Mo mọ.’'
- source_word: τίνας ἐξελεξάμην
  choice: àwọn tí mo ti yàn
  rationale: ‘Àwọn tí’ fi hàn pé ènìyàn ni ọ̀rọ̀ náà ń tọ́ka sí; ‘mo ti yàn’ sì pa iṣẹ́ yíyan tí ó ti ṣẹlẹ̀, tí ipa rẹ̀ ṣì wà, mọ́.
- source_word: ἀλλ’ ἵνα
  choice: Ṣùgbọ́n èyí rí bẹ́ẹ̀ kí
  rationale: Ó so gbólóhùn náà pọ̀ lọ́nà Yorùbá tí ó ṣe kedere, láìfi àlàyé ìdí tàbí ìpinnu tí ó ju ohun tí Gíríìkì sọ lọ kún un.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: Ìwé Mímọ́ lè ṣẹ
  rationale: ‘Ìwé Mímọ́’ jẹ́ ọ̀nà àdánidá láti tọ́ka sí Scripture, ‘lè ṣẹ’ sì ṣàfihàn subjunctive passive πληρωθῇ láìsọ ọ́ di dandan ju bó ṣe wà lọ.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Ẹni tí ó ń jẹ búrẹ́dì mi
  rationale: Ó tú participle náà sí ọ̀rọ̀ Yorùbá àdánidá, ó sì so μου mọ́ τὸν ἄρτον gẹ́gẹ́ bí ‘búrẹ́dì mi.’
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: ti gbé gìgísẹ̀ rẹ̀ sókè sí mi
  rationale: Ó pa àwòrán inú Sáàmù mọ́ dípò títú un sí ‘ó dà mí’ tàbí ‘ó ṣọ̀tẹ̀ sí mi’; ‘sí mi’ ṣàfihàn ìkọlù tàbí ọ̀tá tí ἐπ’ ἐμέ ní nínú àyíká yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ yíyan Jesu pẹ̀lú ẹni tí yóò dà á
  choice: A tú ἐξελεξάμην ní tààrà gẹ́gẹ́ bí ‘mo ti yàn,’ láìsọ irú yíyan tí ó jẹ́ nípa ẹ̀kọ́ ìgbàlà.
  alternative: Kí a sọ ọ́ ní ọ̀nà tí yóò fi túmọ̀ sí yíyan sí ìgbàlà nìkan, tàbí yíyan sí ipò àpọ́sítélì nìkan.
  rationale: Ẹsẹ̀ náà kò ṣàlàyé irú yíyan náà; nítorí náà, a pa àìṣedéédé ẹ̀kọ́ ìsìn tí ó wà nínú ọ̀rọ̀ náà mọ́.
- issue: Agbára ἀλλ’ ἵνα nínú ìbáṣepọ̀ ìdàlẹ́bi àti ìmúṣẹ Ìwé Mímọ́
  choice: ‘Ṣùgbọ́n èyí rí bẹ́ẹ̀ kí Ìwé Mímọ́ lè ṣẹ.’
  alternative: ‘Ṣùgbọ́n èyí ṣẹlẹ̀ nítorí pé Ìwé Mímọ́ gbọdọ̀ ṣẹ,’ èyí tí yóò fi ìtumọ̀ ìdánilójú tàbí àṣẹ àyànmọ́ kún un.
  rationale: Ìtumọ̀ náà pa èdè ìmúṣẹ Ìwé Mímọ́ mọ́, ṣùgbọ́n kò ṣàfikún ìdí tàbí ìpinnu tí ọ̀rọ̀ Gíríìkì kò ṣàlàyé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘búrẹ́dì’ fún ἄρτος nítorí pé ó tọ́ka sí oúnjẹ tí a ń jẹ ní àyọlò náà, a sì pa àwòrán ‘gìgísẹ̀’ mọ́.
