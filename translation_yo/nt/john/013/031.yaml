id: JHN.13.31
reference: John 13:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: yo
  text: Nítorí náà, nígbà tí ó ti jáde lọ, Jésù wí pé, “Nísinsin yìí ni a ti fi ògo fún Ọmọ Ènìyàn, a sì ti fi ògo fún Ọlọ́run nínú rẹ̀[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nípasẹ̀ rẹ̀.” Gbólóhùn Giriki náà lè túmọ̀ sí pé a ti fi ògo fún Ọlọ́run nínú Ọmọ náà tàbí nípasẹ̀ rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Nítorí náà, nígbà tí
  rationale: “Nígbà tí” ṣe àfihàn ìgbà tí ohun náà ṣẹlẹ̀, “nítorí náà” sì pa ìtẹ̀síwájú ìtàn àti ìsopọ̀ rẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: ἐξῆλθεν
  choice: ó jáde lọ
  rationale: Ó tọ́ka sí bí Júdásì ṣe kúrò níbẹ̀ nínú ọ̀rọ̀ tó ṣáájú, ó sì pa ìtumọ̀ ìjáde kúrò ní ibi kan mọ́.
- source_word: λέγει
  choice: wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé èdè Giriki lò ọ̀rọ̀-ìṣe àsìkò ìsinsin yìí gẹ́gẹ́ bí ọ̀nà ìtàn, àsìkò àtijọ́ bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: Νῦν
  choice: Nísinsin yìí
  rationale: Ó tẹnu mọ́ pé àkókò pàtàkì tí Jésù ń kéde ti bẹ̀rẹ̀ lẹ́yìn ìjáde Júdásì.
- source_word: ἐδοξάσθη
  choice: ni a ti ṣe … lógo
  rationale: Ilana “a ti ṣe … lógo” pa ohùn àìṣe-tààrà àti ìṣe tí ó ti ṣẹlẹ̀ pẹ̀lú ìyọrísí rẹ̀ mọ́, láìsọ ẹni tó ṣe é ní pàtó.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè tí Jésù máa ń fi pe ara rẹ̀, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú Dáníẹ́lì 7 mọ́.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì jẹ́ ti àṣà fún θεός nínú àyíká yìí.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa ìtumọ̀ ibi tàbí ìbáṣepọ̀ tí ἐν lè ní mọ́, láìfi dandan pinnu pé ohun èlò tàbí aṣojú ni ó túmọ̀ sí.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Jésù nípa ṣíṣe Ọmọ Ènìyàn lógo
  choice: A túmọ̀ àwọn ọ̀rọ̀-ìṣe méjèèjì gẹ́gẹ́ bí ṣíṣe lógo tí ó ti bẹ̀rẹ̀ sí í ṣẹ, láìdín un kù sí agbelebu, àjíǹde, tàbí ìgbéga nìkan.
  alternative: Kí a sọ ọ́ di tọ́ka sí ikú lórí agbelebu nìkan, tàbí sí àjíǹde àti ìgbéga nìkan.
  rationale: Ìhìn Rere Jòhánù sábà máa ń so ikú Jésù, àjíǹde rẹ̀, àti ìpadà rẹ̀ sọ́dọ̀ Baba pọ̀ mọ́ ṣíṣe é lógo; ìtumọ̀ yìí kò yan ọ̀kan ṣoṣo lára wọn.
- issue: Agbára ìtumọ̀ ἐν αὐτῷ
  choice: nínú rẹ̀
  alternative: nípasẹ̀ rẹ̀
  rationale: Gbolohun Giriki náà lè fi ìbáṣepọ̀ hàn tàbí kí ó tọ́ka sí ẹni tí a fi ṣe ohun kan. Ọ̀rọ̀ pàtàkì pa ìtumọ̀ tó sún mọ́ èdè orísun mọ́, àlàyé ìsàlẹ̀ ojú ìwé sì fi èkejì hàn.
translation_notes:
  register: A lo Yorùbá à标准 tó bójú mu, tó ní iyì, tó sì yé òǹkàwé òde òní. A fi àmì ohùn síbi tó yẹ, a sì pa ìfararọ̀ àwọn gbólóhùn méjì nípa ṣíṣe lógo mọ́. Àmì àlàyé [a] wà lẹ́yìn “nínú rẹ̀,” ibi tí àlàyé náà kan ní tààrà.
