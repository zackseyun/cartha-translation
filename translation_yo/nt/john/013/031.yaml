revisions:
- from: Nítorí náà, nígbà tí ó jáde lọ, Jésù wí pé, “Nísinsin yìí ni a ti ṣe Ọmọ Ènìyàn lógo, a sì ti ṣe Ọlọ́run lógo nínú rẹ̀[a].”
  to: Nítorí náà, nígbà tí ó ti jáde lọ, Jésù wí pé, “Nísinsin yìí ni a ti fi ògo fún Ọmọ Ènìyàn, a sì ti fi ògo fún Ọlọ́run nínú rẹ̀[a].”
  rationale: The revision improves idiomatic Yoruba and makes the temporal sequence explicit, without narrowing the scope of glorification or resolving the relational/instrumental ambiguity of ἐν αὐτῷ. The footnote marker remains directly anchored to “nínú rẹ̀.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:27:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft faithfully represents the temporal-logical transition (Ὅτε οὖν), Judas’s departure, Jesus’ speech, the title “Son of Man,” and the parallel passive clauses. Adding náà/ti is not required, but “ó ti jáde lọ” more clearly conveys that the departure precedes Jesus’ statement. “Fi ògo fún” is a more idiomatic Yoruba way to express the Greek passive ἐδοξάσθη while retaining the unspecified agent and the inaugurated/completed force.
  naturalness: “A ti ṣe … lógo” is understandable, but “a ti fi ògo fún …” is more natural and current Standard Yoruba in this context. The focused construction “Nísinsin yìí ni …” preserves the emphasis of Νῦν and the balanced parallelism.
  terminology: “Jésù,” “Ọmọ Ènìyàn,” and “Ọlọ́run” are appropriate established Yoruba biblical terms. The footnote correctly preserves the possible instrumental sense of ἐν αὐτῷ without displacing the more direct main-text rendering “nínú rẹ̀.”
  issues:
  - severity: low
    issue: The departure clause does not explicitly mark anteriority.
    rationale: Although “nígbà tí ó jáde lọ” can work in narrative Yoruba, “nígbà tí ó ti jáde lọ” better represents the completed departure that occasions Jesus’ speech.
  - severity: low
    issue: “A ti ṣe … lógo” is less idiomatic than “a ti fi ògo fún …” in this register.
    rationale: The revision is natural Standard Yoruba and maintains both the Greek passive sense and the parallel structure.
  revised_text: Nítorí náà, nígbà tí ó ti jáde lọ, Jésù wí pé, “Nísinsin yìí ni a ti fi ògo fún Ọmọ Ènìyàn, a sì ti fi ògo fún Ọlọ́run nínú rẹ̀[a].”
  revised_footnotes:
  - marker: a
    text: Tàbí “nípasẹ̀ rẹ̀.” Gbólóhùn Giriki náà lè túmọ̀ sí pé a ti fi ògo fún Ọlọ́run nínú Ọmọ náà tàbí nípasẹ̀ rẹ̀.
    reason: alternative_reading
  revision_rationale: The revision improves idiomatic Yoruba and makes the temporal sequence explicit, without narrowing the scope of glorification or resolving the relational/instrumental ambiguity of ἐν αὐτῷ. The footnote marker remains directly anchored to “nínú rẹ̀.”
