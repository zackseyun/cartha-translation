id: JHN.13.16
reference: John 13:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: yo
  text: Lóòótọ́, lóòótọ́, mo sọ fún yín, ẹrú kò ju ọ̀gá rẹ̀ lọ; bẹ́ẹ̀ ni ẹni tí a rán kò ju ẹni tí ó rán an lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnwí àti ìtẹnumọ́ ọ̀rọ̀ Jesu mọ́ ní Yorùbá àdánidá, ó sì mú ìtumọ̀ ọ̀rọ̀ ìjẹ́rìí pàtàkì náà jáde.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ìtumọ̀ yìí sún mọ́ ìṣètò Gíríìkì, ó sì bá ọ̀rọ̀ ọ̀wọ̀ àti ìtẹnumọ́ tí ó ṣáájú mu.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Nínú àfiwé yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó wà lábẹ́ àṣẹ ọ̀gá; “ẹrú” pa ipò ìṣàkóso tó lágbára nínú Gíríìkì mọ́ ju “ìránṣẹ́” lọ.
- source_word: μείζων
  choice: tóbi ju … lọ
  rationale: Àfiwé Yorùbá yìí ṣàfihàn jíjẹ́ gíga tàbí ọlá ju ẹlòmíràn lọ, ó sì bá ìtumọ̀ méjèèjì nínú ẹsẹ náà mu.
- source_word: κύριος
  choice: ọ̀gá
  rationale: Níhìn-ín ọ̀rọ̀ náà jẹ́ ti ìbáṣepọ̀ láàárín ẹrú àti ẹni tó ni àṣẹ lórí rẹ̀, kì í ṣe dandan orúkọ oyè “Olúwa.”
- source_word: ἀπόστολος
  choice: ẹni tí a rán
  rationale: Ìtumọ̀ iṣẹ́ ọ̀rọ̀ náà ni ẹni tí ẹlòmíràn rán; yíyan èyí mú ìfarajọ rẹ̀ pẹ̀lú “ẹni tí ó rán an” hàn kedere, láì fi ìtumọ̀ oyè pàtó kún un.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: ẹni tí ó rán an
  rationale: Ó tú ìkọ̀ participle Gíríìkì náà sí Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ ẹni tí ń rán àti ẹni tí a rán mọ́.
theological_decisions:
- issue: Bí a ṣe tú κύριος nínú àfiwé tí kì í ṣe orúkọ oyè ní tààrà
  choice: ọ̀gá
  alternative: Olúwa
  rationale: Àyíká ọ̀rọ̀ náà fi ẹrú wé ọ̀gá rẹ̀, nítorí náà “ọ̀gá” pa àfiwé àwùjọ náà mọ́, kò sì fi ìtumọ̀ oyè nípa Kristi sínú ibi tí ọ̀rọ̀ náà kò ti béèrè rẹ̀.
- issue: Bí a ṣe tú ἀπόστολος nínú ìfarajọ pẹ̀lú ẹni tó rán an
  choice: ẹni tí a rán
  alternative: àpọ́sítélì
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí aṣojú tàbí òjíṣẹ́ tí a rán. Nítorí pé gbólóhùn kejì tẹnumọ́ ẹni tó rán an, ìtumọ̀ iṣẹ́ náà ló mú ìfarajọ Gíríìkì hàn kedere jù, láì sọ pé àwọn Àpọ́sítélì Méjìlá nìkan ni a ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹrú/ọ̀gá” láti pa agbára ìbáṣepọ̀ àwùjọ Gíríìkì mọ́, a sì lo “ẹni tí a rán” dípò àyálò-ọ̀rọ̀ ẹ̀sìn kí ìtumọ̀ àyíká hàn gbangba.
