id: JHN.13.13
reference: John 13:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: yo
  text: Ẹ̀yin ń pè mí ní Olùkọ́ àti Olúwa[a], ohun tí ẹ sọ sì tọ́, nítorí bẹ́ẹ̀ ni mo jẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà, kyrios, lè tọ́ka sí ẹni tó ní àṣẹ tàbí ipò olúwa; “Olúwa” ni a lò níbí gẹ́gẹ́ bí ìtumọ̀ orúkọ oyè tó wọ́pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: ń pè mí ní
  rationale: Nínú ìṣètò ọ̀rọ̀ yìí, gbólóhùn náà túmọ̀ sí pípe tàbí dárúkọ ẹnì kan ní orúkọ oyè kan; “ń pè mí ní” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá àkókò ìṣe ọ̀rọ̀ Gíríìkì mu.
- source_word: Ὁ διδάσκαλος
  choice: Olùkọ́
  rationale: “Olùkọ́” sọ ipa ẹni tí ń kọ́ni ní kedere, ó sì yẹ gẹ́gẹ́ bí orúkọ oyè tí àwọn ọmọ-ẹ̀yìn fi ń pe Jésù.
- source_word: Ὁ κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κύριος gẹ́gẹ́ bí orúkọ oyè ọlá àti àṣẹ; ó tún pa ìwọ̀n ìtumọ̀ ẹ̀kọ́ nípa Jésù mọ́ láì ṣe àfikún ohun tí ẹsẹ̀ náà kò sọ.
- source_word: καλῶς λέγετε
  choice: ohun tí ẹ sọ sì tọ́
  rationale: Ọ̀rọ̀ yìí fi hàn pé ohun tí wọ́n pè é jẹ́ èyí tó pé. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìdájọ́ καλῶς mọ́.
- source_word: εἰμὶ γάρ
  choice: nítorí bẹ́ẹ̀ ni mo jẹ́
  rationale: Yorùbá nílò àfikún ìtọ́kasí díẹ̀ sí àwọn orúkọ oyè tó ṣáájú. “Bẹ́ẹ̀ ni mo jẹ́” pa ìjẹ́wọ́ ara ẹni náà mọ́ láì ṣàlàyé rẹ̀ kọjá ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí orúkọ oyè Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú ẹsẹ̀ yìí Jésù fìdí orúkọ oyè κύριος tí àwọn ọmọ-ẹ̀yìn ń lò fún un múlẹ̀. “Olúwa” pa ìwọ̀n ọlá, àṣẹ, àti lílò rẹ̀ gẹ́gẹ́ bí orúkọ oyè nínú Májẹ̀mú Tuntun mọ́; “Ọ̀gá” ṣeé ṣe ní ibi tí a bá tẹnu mọ́ àṣẹ ẹni lórí ẹlòmíràn, ṣùgbọ́n ó dín ìwọ̀n orúkọ oyè náà kù.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀yin/ẹ” láti fi ọ̀pọ̀ ènìyàn hàn, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
