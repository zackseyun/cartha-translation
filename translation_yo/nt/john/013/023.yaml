  to: Ọ̀kan nínú àwọn ọmọ ẹ̀yìn rẹ̀, ẹni tí Jesu fẹ́ràn, ń rọgbọ̀ lẹ́gbẹ̀ẹ́ Jesu[a].
  rationale: The revision retains the draft’s context-sensitive rendering of κόλπος and its literal footnote, while making the meal posture more precise and natural in Standard Yorùbá and removing an added intensifier.
  reviewer_model: gpt-5.6-terra
