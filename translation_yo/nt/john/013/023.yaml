id: JHN.13.23
reference: John 13:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: yo
  text: Ọ̀kan nínú àwọn ọmọ ẹ̀yìn rẹ̀, ẹni tí Jesu fẹ́ràn, ń rọgbọ̀ lẹ́gbẹ̀ẹ́ Jesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní gangan, “ní àyà Jesu”; ọ̀rọ̀ yìí ṣàpèjúwe ipò ẹni kan tí ó rọgbọ̀ sún mọ́ ẹlòmíràn níbi oúnjẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: jókòó rọgbọ̀
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí ènìyàn ṣe jókòó ní ìrọ̀gbọ̀kú níbi oúnjẹ ní ayé Mẹditarenia ìgbàanì; yíyan yìí dá ipò jíjẹun náà mọ́, ó sì ṣeé lóye ní Yorùbá òde òní.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Ọ̀kan nínú àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: Èyí fi ìtumọ̀ àyọkà apá kan lára ẹgbẹ́ hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: lẹ́gbẹ̀ẹ́ Jesu gan-an
  rationale: Nínú àyíká jíjẹun, gbólóhùn náà ń tọ́ka sí ipò ẹni tó rọgbọ̀ sún mọ́ Jesu. Yíyan yìí yàgò fún àwòrán tí ìtumọ̀ gangan lè mú wá ní Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ gangan mọ́.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ẹni tí Jesu fẹ́ràn
  rationale: Ó tú ἀγαπάω sí ‘fẹ́ràn’ ní ọ̀nà tààrà, ó sì pa gbólóhùn àsopọ̀ Gíríìkì mọ́ lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Ipò ọmọ ẹ̀yìn tí Jesu fẹ́ràn ní ìbámu pẹ̀lú Jesu
  choice: lẹ́gbẹ̀ẹ́ Jesu gan-an
  alternative: ní àyà Jesu
  rationale: Àyíká náà jẹ́ ti bí wọ́n ṣe rọgbọ̀ níbi oúnjẹ, kì í ṣe dandan pé ó ń sọ nípa ìṣọ̀kan ẹ̀mí àràmàǹdà. Ọ̀rọ̀ inú ẹsẹ̀ sọ ìsúnmọ́ ibi náà ní kedere, àlàyé ìsàlẹ̀ sì pa àwòrán Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ. ‘Jókòó rọgbọ̀’ ń ṣàlàyé àṣà jíjẹun ìgbàanì láì sọ ọ́ di ‘dùbúlẹ̀,’ ‘lẹ́gbẹ̀ẹ́ Jesu gan-an’ sì ń fi ìsúnmọ́ hàn ní ti ẹ̀dá.
