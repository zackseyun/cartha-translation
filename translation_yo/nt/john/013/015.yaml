  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: yo
  text: Nítorí mo ti fi àpẹẹrẹ kan[a] fún yín, kí ẹ̀yin náà lè ṣe gẹ́gẹ́ bí mo ti ṣe sí yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwòṣe.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ṣe fún yín.” Ọ̀rọ̀-orúkọ arọ́pò ẹni náà wà nínú dative Gíríìkì, èyí tí ó lè túmọ̀ sí “sí yín” tàbí, ní àyíká yìí, “fún yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: àpẹẹrẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àpẹẹrẹ tàbí àwòṣe tí a gbé kalẹ̀ fún àwọn ẹlòmíràn láti tẹ̀ lé; “àpẹẹrẹ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká fífọ ẹsẹ̀ mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí; “Nítorí” sọ ìbáṣepọ̀ náà ní Yorùbá àdánidá.
- source_word: ἔδωκα ὑμῖν
  choice: mo ti fi … fún yín
  rationale: Aorist Gíríìkì tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ ṣe; “mo ti fi … fún yín” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé iṣẹ́ náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ṣì wúlò nísinsìnyí.
- source_word: ἵνα
  choice: kí … lè
  rationale: Ìṣọ̀kan yìí fi ète hàn; “kí … lè” pa agbára ète àti subjunctive mọ́ láì sọ ọ́ di àṣẹ tààrà.
- source_word: καθὼς
  choice: bí
  rationale: “Bí” fi ìbámu láàárín ohun tí Jésù ṣe àti ohun tí àwọn ọmọ-ẹ̀yìn yóò ṣe hàn lọ́nà Yorùbá tó rọrùn.
- source_word: ἐποίησα ὑμῖν
  choice: mo ti ṣe sí yín
  rationale: “Ṣe sí yín” tẹ̀ lé dative Gíríìkì láì fi ìtumọ̀ àǹfààní tí kò ṣe pàtó kún un; àyíká náà fúnra rẹ̀ fi irú iṣẹ́ tí Jésù ṣe hàn.
- source_word: καὶ ὑμεῖς ποιῆτε
  choice: ẹ̀yin náà lè ṣe
  rationale: “Ẹ̀yin náà” pa ìtẹnumọ́ orúkọ arọ́pò náà mọ́, “lè ṣe” sì bá gbólóhùn ète ἵνα àti subjunctive mu.
theological_decisions:
- issue: Ipa àpẹẹrẹ Jésù lórí ohun tí àwọn ọmọ-ẹ̀yìn gbọ́dọ̀ ṣe
  choice: Fi iṣẹ́ Jésù hàn gẹ́gẹ́ bí àpẹẹrẹ tí àwọn ọmọ-ẹ̀yìn yóò tẹ̀ lé, láì pinnu bóyá ó jẹ́ àṣẹ ìṣe fífọ ẹsẹ̀ fún gbogbo àkókò tàbí àpẹẹrẹ ìránṣẹ́ ní ìtumọ̀ gbòòrò.
  alternative: Túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ àṣà fífọ ẹsẹ̀ fún gbogbo onígbàgbọ́, tàbí gẹ́gẹ́ bí àmì lásán tí kò ní ìṣe pàtó láti fara wé.
  rationale: Ọ̀rọ̀ náà sọ ní gbangba pé Jésù fi àpẹẹrẹ lélẹ̀ kí àwọn ọmọ-ẹ̀yìn lè ṣe ní ìbámu pẹ̀lú ohun tó ṣe, ṣùgbọ́n kò dá ìbéèrè nípa bí ìṣe náà ṣe gbọdọ̀ di àṣà ìjọ yanjú.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtẹnumọ́ “ẹ̀yin náà” àti ìbáṣepọ̀ ète “kí … lè” pa ìrísí ọ̀rọ̀ orísun mọ́ láì jẹ́ kí gbólóhùn náà le.
