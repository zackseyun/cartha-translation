    rationale: Gbólóhùn náà kò ní ọ̀rọ̀-ìṣe tó yẹ láti so ara ẹni mọ́ àyà Jesu; nítorí náà, kò ṣe kedere tàbí àdánidá. ‘Ó tì mọ́ àyà Jesu’ tún ìtumọ̀ ìfarakanra náà ṣe.
  - severity: low
    issue: Àlàyé ẹsẹ̀-àlàyé náà sọ ‘dùbúlẹ̀ lẹ́gbẹ̀ẹ́ tábìlì’.
    rationale: Ìpo jíjẹun ìgbàanì jẹ́ rírẹ̀ sílẹ̀ níbi tábìlì; ‘lẹ́gbẹ̀ẹ́ tábìlì’ lè dà bí ẹni pé wọ́n wà ní ẹ̀gbẹ́ tábìlì dípò níbi tábìlì. A tún un ṣe kí ó ṣàlàyé àṣà náà dáadáa.
  revised_text: Nítorí náà, ẹni náà rọ̀ sẹ́yìn ní ọ̀nà yìí, ó tì mọ́ àyà Jesu, ó sì wí fún un pé, “Olúwa, ta ni?”
