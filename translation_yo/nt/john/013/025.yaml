revisions:
- from: Nítorí náà, ẹni náà rọ̀ sẹ́yìn báyìí, ó sì fi ara ti àyà Jesu[a], ó wí fún un pé, “Olúwa, ta ni?”
  to: Nítorí náà, ẹni náà rọ̀ sẹ́yìn ní ọ̀nà yìí, ó tì mọ́ àyà Jesu, ó sì wí fún un pé, “Olúwa, ta ni?”
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí kò pé ní gírámà pẹ̀lú ‘ó tì mọ́ àyà Jesu,’ tó fi ìfarakanra sí àyà Jesu hàn ní kedere. A pa ‘ní ọ̀nà yìí’ mọ́ fún οὕτως, a sì pa ọ̀nà ìtàn ìsinsìnyí ‘ó wí’ mọ́ fún λέγει. Ẹsẹ̀-àlàyé náà ni a tún ṣe fún gírámà àti ìtumọ̀ àṣà jíjẹun.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:27:39Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa àwọn kókó pàtàkì mọ́—ọ̀rọ̀ atọ́ka náà, rírọ̀ sẹ́yìn, àyà Jesu, ìbéèrè náà, àti ‘Olúwa.’ Ṣùgbọ́n ‘ó sì fi ara ti àyà Jesu’ kò pé ní gírámà, kò sì sọ ìfarakanra ἐπὶ τὸ στῆθος ní kedere.
  naturalness: ‘Fi ara ti àyà Jesu’ kì í ṣe àgbékalẹ̀ Yorùbá àdánidá. ‘Tì mọ́ àyà Jesu’ jẹ́ ọ̀nà kedere àti àdánidá láti ṣàfihàn ipò náà. ‘Ní ọ̀nà yìí’ ń mú οὕτως hàn láì ṣe é ní ọ̀rọ̀ líle.
  terminology: ‘Olúwa’ yẹ fún Κύριε níbí. ‘Ta ni?’ jẹ́ ìbéèrè Yorùbá tó pé, ó sì pa àìṣàlàyé akọ tàbí abo nínú Gíríìkì mọ́. ‘Jesu’ jẹ́ ìlò orúkọ tó bójú mu.
