  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: yo
  text: Nítorí náà, ẹni náà rọ̀ sẹ́yìn ní ọ̀nà yìí, ó tì mọ́ àyà Jesu, ó sì wí fún un pé, “Olúwa, ta ni?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: rọ̀ sẹ́yìn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí yíyí ara tàbí rírọ̀ sẹ́yìn nígbà tí a dùbúlẹ̀ jẹun lẹ́gbẹ̀ẹ́ tábìlì; ìtumọ̀ yìí mú ìṣípò ara àti àṣà jíjẹun ìgbà náà hàn ní èdè Yorùbá àdánidá.
- source_word: ἐκεῖνος
  choice: ẹni náà
  rationale: Èyí pa agbára ọ̀rọ̀ atọ́ka ‘ẹni yẹn/ẹni náà’ mọ́ láì fi ọ̀rọ̀ ‘ọmọ-ẹ̀yìn’ kún ohun tí ẹsẹ yìí fúnra rẹ̀ sọ.
- source_word: οὕτως
  choice: báyìí
  rationale: Ó so bí ó ṣe rọ̀ sẹ́yìn pọ̀ mọ́ ipò tí a ṣàpèjúwe nínú ọ̀rọ̀ tó ṣáájú.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: fi ara ti àyà Jesu
  rationale: Gbólóhùn yìí sọ ìfarakanra sí àyà Jesu ní ọ̀nà tí ó ṣe kedere, tí ó sì bá ìṣípò ẹni tí ó dùbúlẹ̀ jẹun mu.
- source_word: λέγει αὐτῷ
  choice: ó wí fún un
  rationale: A pa àsìkò ìsinsìnyí onítàn inú Gíríìkì mọ́ pẹ̀lú ‘ó wí,’ èyí tí ó tún jẹ́ ọ̀nà ìtàn ọlọ́lá ní Yorùbá.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ ọ̀wọ̀ àti agbára orúkọ oyè κύριος mọ́ nínú ìtọ́kasí tààrà sí Jesu.
- source_word: τίς ἐστιν;
  choice: ta ni?
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè ẹni tí Jesu ń tọ́ka sí, láì sọ akọ tàbí abo tí Gíríìkì kò fi hàn ní kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nígbà tí ọmọ-ẹ̀yìn ń bá Jesu sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ lè jẹ́ ọ̀rọ̀ ọ̀wọ̀, ó sì tún pa ìtumọ̀ ẹ̀kọ́ nípa ẹni tí Jesu jẹ́ nínú Ìhìn Rere Johanu sílẹ̀ láì dín in kù sí ìkíni ọ̀wọ̀ lásán.
translation_notes:
  register: A lo èdè Yorùbá ìsinsìnyí tó ṣe kedere, tó sì ní iyì. ‘Ẹni náà’ pa ọ̀rọ̀ atọ́ka Gíríìkì mọ́; ‘rọ̀ sẹ́yìn … fi ara ti àyà’ ṣàlàyé ìṣípò ara láì gbé àṣà jíjẹun òde òní wọ inú ẹsẹ náà.
