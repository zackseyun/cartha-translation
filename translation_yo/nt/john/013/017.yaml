review_pass:
  verdict: revise
  source_fidelity: The two conditional clauses, the plural reference of ταῦτα, and the practical force of ποιῆτε are retained. The draft's rendering of μακάριοί, however, uses an unnatural and semantically unclear formation ("alábùkún-fún"), which should be replaced with idiomatic Yoruba.
  naturalness: '"Alábùkún-fún ni yín" is not natural Standard Yoruba for persons who are blessed; it can be misconstrued because alábùkún ordinarily suggests one associated with or dispensing blessing. The impersonal passive "a bùkún fún yín" is idiomatic and suitably expresses the blessed state without specifying an agent.'
  terminology: '"A bùkún fún yín" is established, dignified biblical Yoruba for μακάριοί and retains more theological weight than "aláyọ̀." "Nǹkan wọ̀nyí" is a natural plural equivalent for ταῦτα, and "ń ṣe wọ́n" appropriately communicates putting the preceding teaching into practice.'
  issues:
  - severity: medium
    issue: '"alábùkún-fún ni yín" is non-idiomatic and unclear.'
    rationale: It is not a safe modern Standard Yoruba expression for “you are blessed” and may suggest a person who blesses rather than one who receives blessing.
  revised_text: Bí ẹ bá mọ̀ nǹkan wọ̀nyí, a bùkún fún yín bí ẹ bá ń ṣe wọ́n.[a]
