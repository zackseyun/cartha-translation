- from: Bí ẹ bá mọ ohun wọ̀nyí, alábùkún-fún ni yín[a] bí ẹ bá ń ṣe wọ́n.
  to: Bí ẹ bá mọ̀ nǹkan wọ̀nyí, a bùkún fún yín bí ẹ bá ń ṣe wọ́n.[a]
  rationale: The revision replaces the unclear calque for “blessed” with idiomatic Yoruba while preserving the source’s two conditions, plural referents, and the sense that blessing attends acting on what is known. The footnote is retained but made more concise and natural.
  reviewer_model: gpt-5.6-terra
