id: JHN.13.17
reference: John 13:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: yo
  text: Bí ẹ bá mọ̀ nǹkan wọ̀nyí, a bùkún fún yín bí ẹ bá ń ṣe wọ́n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “aláyọ̀” tàbí “olóríire.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ipò ojúrere tàbí ìre ẹni, kì í ṣe ìmọ̀lára ayọ̀ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Bí
  rationale: Ó bẹ̀rẹ̀ gbólóhùn onípo; “bí” ni ọ̀nà Yorùbá tó ṣe déédé jù láti fi ìtumọ̀ náà hàn.
- source_word: ταῦτα
  choice: ohun wọ̀nyí
  rationale: Ó ń tọ́ka sí àpẹẹrẹ àti ẹ̀kọ́ Jésù tó ṣáájú, ó sì pa ìtumọ̀ ọ̀pọ̀ nǹkan mọ́.
- source_word: οἴδατε
  choice: ẹ bá mọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí níní ìmọ̀ tàbí mímọ ohun kan; a kò fi ìtumọ̀ “lóye” kún un láìṣe dandan.
- source_word: μακάριοί
  choice: alábùkún-fún
  rationale: Ó ń sọ ipò ẹni tó wà lábẹ́ ojúrere Ọlọ́run, kì í ṣe ìmọ̀lára ayọ̀ lásán.
- source_word: ἐστε
  choice: ni yín
  rationale: Èyí ni àfihàn Yorùbá tó bá ọ̀rọ̀ ìṣe aṣopọ̀ “ẹ jẹ́” mu nínú gbólóhùn yìí.
- source_word: ἐὰν
  choice: bí
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe abẹ́ṣẹ́ tó tẹ̀ lé e, ó fi ipò tí ìmúṣẹ̀ rẹ̀ kò tíì dájú hàn.
- source_word: ποιῆτε
  choice: ẹ bá ń ṣe
  rationale: Ó fi síṣe ohun tí Jésù kọ́ni hàn; “ń ṣe” tún jẹ́ kí ìṣe tí a ń fi ẹ̀kọ́ náà sílò ṣe kedere ní Yorùbá.
- source_word: αὐτά
  choice: wọ́n
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí “ohun wọ̀nyí” láìṣe àtúnwí tí kò pọn dandan.
theological_decisions:
- issue: Ìtumọ̀ μακάριοι nínú ọ̀rọ̀ nípa jíjẹ́ ọmọ-ẹ̀yìn
  choice: alábùkún-fún
  alternative: aláyọ̀ tàbí olóríire
  rationale: “Alábùkún-fún” pa ìtumọ̀ ipò ojúrere àti ìdàgbàsókè lábẹ́ Ọlọ́run mọ́; kò dín ọ̀rọ̀ náà kù sí ìmọ̀lára ayọ̀ tàbí oríire lásán.
translation_notes:
  register: Yorùbá àkókò yìí, tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ẹ” fún ọ̀pọ̀ ẹni gẹ́gẹ́ bí Gíríìkì, a sì fi àmì ohùn sí ibi tí ó bá ẹ̀dá Yorùbá mu.
