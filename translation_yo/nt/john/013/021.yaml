  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ náà pa ọ̀pọ̀ èrò Gíríìkì mọ́ dáadáa: ìsẹ̀lẹ̀ lẹ́yìn ọ̀rọ̀ Jésù, ìdààmú inú rẹ̀, ìjẹ́rìí ọlọ́wọ̀, ìtẹnumọ́ àtúnsọ náà, àti àsọtẹ́lẹ̀ pé ọ̀kan nínú àwọn tí ó wà níbẹ̀ yóò ṣe é. “Yóò fi mí hàn” jẹ́ ọ̀nà Yorùbá tí ó lè túmọ̀ ìwà ọ̀dàlẹ̀ nínú àyíká yìí. Ṣùgbọ́n àlàyé ìsàlẹ̀ atilẹba, “yóò fà mí lé wọn lọ́wọ́,” kò fi ìtumọ̀ παραδώσει hàn dáadáa; ó lè túmọ̀ sí fífà ẹni kúrò lọ́wọ́ wọn. A tún un ṣe sí ọ̀nà tí ó túmọ̀ ‘hand [someone] over’ ní kedere.'
