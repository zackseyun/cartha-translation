id: JHN.13.21
reference: John 13:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: yo
  text: Lẹ́yìn tí Jésù sọ nǹkan wọ̀nyí, ó dààmú nínú ẹ̀mí rẹ̀, ó sì jẹ́rìí, ó wí pé, “Lóòótọ́, lóòótọ́ ni mo sọ fún yín, ọ̀kan nínú yín yóò fi mí hàn[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gangan díẹ̀, “yóò fi mí lé ọwọ́ ẹlòmíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Lẹ́yìn tí Jésù sọ nǹkan wọ̀nyí
  rationale: A tú àpólà aláìlèsọ aorist náà sí gbólóhùn àkókò Yorùbá tó ṣe kedere, tí ó sì pa bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: ó dààmú nínú ẹ̀mí rẹ̀
  rationale: Èyí fi ìdààmú inú Jésù hàn láìfi ìwọ̀n agbára kún ọ̀rọ̀ Gíríìkì; ‘nínú ẹ̀mí rẹ̀’ sì sọ ibi tàbí apá tí ìdààmú náà kàn ní Yorùbá àdánidá.
- source_word: ἐμαρτύρησεν
  choice: ó sì jẹ́rìí
  rationale: ‘Jẹ́rìí’ pa ìtumọ̀ pàtàkì μαρτυρέω nínú ìwé Jòhánù mọ́, ó sì fi hàn pé ọ̀rọ̀ tí ó tẹ̀ lé e jẹ́ ìjẹ́rìí ọlọ́wọ̀.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Àtúnsọ náà pa ìtẹnumọ́ ọ̀rọ̀ Jésù mọ́, ‘lóòótọ́’ sì jẹ́ ọ̀nà àdánidá tí òǹkà Yorùbá òde òní lè lóye.
- source_word: λέγω ὑμῖν
  choice: ni mo sọ fún yín
  rationale: Èyí pa ọ̀rọ̀ tààrà àti ọ̀pọ̀ ẹni tí ὑμῖν ń tọ́ka sí mọ́, ó sì bá ìlànà gbólóhùn Yorùbá mu.
- source_word: εἷς ἐξ ὑμῶν
  choice: ọ̀kan nínú yín
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún gbólóhùn apá-nínú-àpapọ̀ náà, ó sì pa ìyàlẹ́nu pé ẹni náà wà lára àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: παραδώσει με
  choice: yóò fi mí hàn
  rationale: Nínú àyíká yìí, ‘fi mí hàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìwà ọ̀dàlẹ̀ ẹni tó mú kí wọ́n mú Jésù. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gbooro ti ‘fà lé lọ́wọ́’ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìdààmú inú Jésù
  choice: ó dààmú nínú ẹ̀mí rẹ̀
  alternative: ẹ̀mí rẹ̀ dààmú gidigidi
  rationale: Aṣàyàn náà jẹ́ kí ìdààmú gidi Jésù dúró gẹ́gẹ́ bí ẹsẹ náà ṣe sọ ọ́, láìdín ìwà ènìyàn rẹ̀ kù tàbí fi ‘gidigidi’ tí kò hàn gbangba nínú Gíríìkì kún un.
- issue: Bí a ṣe túmọ̀ παραδίδωμι nínú àsọtẹ́lẹ̀ ìwà ọ̀dàlẹ̀
  choice: yóò fi mí hàn
  alternative: yóò fà mí lé wọn lọ́wọ́
  rationale: Àyíká ọ̀rọ̀ mú ìwà ọ̀dàlẹ̀ jáde kedere, nítorí náà ‘fi mí hàn’ ló sọ agbára ọ̀rọ̀ náà dáadáa ní Yorùbá. Síbẹ̀, a pa ìtumọ̀ gangan díẹ̀, ‘fà lé lọ́wọ́,’ mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá àdánidá, ọ̀wọ̀, àti èyí tí òǹkà òde òní lè lóye ni a lò. ‘Ó wí pé’ mú ìró mímọ́ tó yẹ wá láìsọ èdè náà di ti àtijọ́ jù; àmì [a] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé.
