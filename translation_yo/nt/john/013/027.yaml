language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: yo
  text: Lẹ́yìn òkèlè búrẹ́dì náà[a], nígbà náà ni Sátánì wọ inú rẹ̀. Nítorí náà, Jésù sọ fún un pé, “Ohun tí o ń ṣe, ṣe é kíákíá sí i.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘òkèlè náà.’ Ọ̀rọ̀ Gíríìkì ψωμίον túmọ̀ sí ẹ̀ka oúnjẹ kékeré kan; níbí, ó ṣeé ṣe kí ó jẹ́ òkèlè búrẹ́dì tí a tẹ̀ sínú oúnjẹ nígbà àsè.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ṣe é ní kíákíá.’ Ọ̀rọ̀ Gíríìkì τάχιον jẹ́ ọ̀rọ̀ afiwéra (‘ní kíákíá sí i’), èyí tí ‘sí i’ fi hàn nínú ìtumọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: òkèlè búrẹ́dì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹ̀ka oúnjẹ kékeré kan; nínú àyíká àsè yìí, ó ṣeé ṣe kí ó jẹ́ òkèlè búrẹ́dì tí a ti tẹ̀ sínú oúnjẹ. ‘Òkèlè búrẹ́dì’ ṣe kedere, ó sì pa ìtumọ̀ pàtó náà mọ́.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: wọ inú rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára gbólóhùn Gíríìkì náà mọ́, láì sọ ọ́ di àkàwé tàbí fi àlàyé míì kún un.
- source_word: ὁ Σατανᾶς
  choice: Sátánì
  rationale: Orúkọ tàbí oyè yìí ti fẹsẹ̀ múlẹ̀ nínú èdè Yorùbá gẹ́gẹ́ bí ‘Sátánì’; yíyí i sí ‘Ọ̀tá’ nìkan lè mú ìtumọ̀ ìpilẹ̀ rẹ̀ ga ju bí ó ti wà nínú ẹsẹ̀ náà lọ.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Nítorí náà, Jésù sọ fún un
  rationale: A lo ìgbà àtẹ̀yìnwá fún ìtàn Yorùbá tó ṣe àdánidá, nígbà tí ‘Nítorí náà’ ń pa ipa οὖν mọ́.
- source_word: Ὃ ποιεῖς
  choice: Ohun tí o ń ṣe
  rationale: Àmì ‘ń’ fi iṣẹ́ tó ń lọ lọ́wọ́ tàbí tó wà ní kánjúkánjú hàn, láì túmọ̀ ọ́ sí ‘ohun tí o fẹ́ ṣe,’ èyí tí yóò fi ọjọ́ iwájú kún un.
- source_word: ποίησον
  choice: ṣe é
  rationale: Ọ̀rọ̀ àṣẹ kúkúrú yìí pa líle àti kíkánjú àṣẹ Gíríìkì náà mọ́ ní Yorùbá àdánidá.
- source_word: τάχιον
  choice: yára ... sí i
  rationale: ‘Sí i’ pa ìwọ̀n afiwéra inú τάχιον mọ́—ìyẹn, ‘ní kíákíá jù’—ní ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Irú ohun tí Sátánì ṣe sí Judasi
  choice: Pa gbólóhùn tààrà náà mọ́ pé ‘Sátánì wọ inú rẹ̀.’
  alternative: Sátánì gba àṣẹ lórí rẹ̀; ó fi ara rẹ̀ fún Sátánì.
  rationale: Ẹsẹ̀ náà sọ ní tààrà nípa Sátánì tó wọ inú rẹ̀. A kò sọ ọ́ di àkàwé lásán, bẹ́ẹ̀ ni a kò fi ẹ̀kọ́ nípa bí ìṣàkóso yẹn ṣe rí kún ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. A yan ‘òkèlè búrẹ́dì’ dípò gbólóhùn àtijọ́ tàbí èyí tí kò ṣe kedere; a sì lo ‘yára ṣe é sí i’ láti jẹ́ kí afiwéra Gíríìkì náà hàn ní Yorùbá àdánidá.
