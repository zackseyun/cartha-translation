source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: yo
  text: Nígbà náà, lẹ́yìn tí ẹni náà[b] gba òkèlè búrẹ́dì náà[a], ó jáde lẹ́sẹ̀kẹsẹ̀. Òru sì ni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “òkèlè náà” tàbí “ẹ̀yà náà.” Ọ̀rọ̀ Gíríìkì ψωμίον ń tọ́ka sí ẹ̀yà kékeré búrẹ́dì tàbí oúnjẹ níbi oúnjẹ náà.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ọ̀rọ̀ atọ́ka náà ni a túmọ̀ sí “ẹni náà”; ó ní ìtẹnumọ́ ju “ó” lásán lọ, ó sì ṣeé ṣe kí ó máa fa àfiyèsí sí Júdásì.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Jòhánù pé “Òru sì ni” ń tọ́ka sí àkókò gidi; ó sì tún lè mú àkòrí ìmọ́lẹ̀ àti òkùnkùn inú ìwé Ìhìn Rere náà wá sí ọkàn.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: lẹ́yìn tí … gba
  rationale: Ọ̀rọ̀-ìṣe aláìpé aorist yìí tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí mú ìtẹ̀lé ìṣẹ̀lẹ̀ náà hàn ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú rẹ̀, ó sì lè fi ìtẹ̀síwájú tàbí àbájáde ìtàn hàn.
- source_word: τὸ ψωμίον
  choice: òkèlè búrẹ́dì náà
  rationale: ψωμίον túmọ̀ sí ẹ̀yà kékeré búrẹ́dì tàbí oúnjẹ; “òkèlè búrẹ́dì” ṣe kedere pé búrẹ́dì ni, ó sì pa ìtumọ̀ kékeré rẹ̀ mọ́.
- source_word: ἐκεῖνος
  choice: ẹni náà
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka yìí lágbára ju “ó” lásán lọ; “ẹni náà” mú ìtẹnumọ́ sí ẹni tí a ń sọ̀rọ̀ rẹ̀, ìyẹn Júdásì, láìfi ìtumọ̀ míì kún un.
- source_word: ἐξῆλθεν
  choice: ó jáde
  rationale: Ìtumọ̀ tààrà ἐξέρχομαι ni láti jáde; èyí pa ìrísí ibi tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ó ṣe é láìjáfara; ọ̀rọ̀ Yorùbá yìí ṣe kedere, ó sì bá ìwúwo ìtàn náà mu.
- source_word: ἦν δὲ νύξ
  choice: Òru sì ni
  rationale: Ìtumọ̀ kúkúrú yìí sọ àkókò náà ní tààrà, ó sì pa agbára lítíréṣọ̀ gbólóhùn Gíríìkì mọ́ láìṣe àlàyé àmì òkùnkùn sínú ẹsẹ̀ náà.
theological_decisions:
- issue: Bóyá “òru” ní agbára àmì nínú ìwé Jòhánù
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìsọ àkókò ní tààrà: “Òru sì ni.”'
  alternative: Kí a sọ nínú ẹsẹ̀ fúnra rẹ̀ pé òru náà dúró fún òkùnkùn tẹ̀mí.
  rationale: Jòhánù sábà máa ń lo ìmọ́lẹ̀ àti òkùnkùn gẹ́gẹ́ bí àmì, ṣùgbọ́n gbólóhùn Gíríìkì níbí jẹ́ ìsọ àkókò rírọrùn. Ìtumọ̀ náà pa ìṣòro àti ìṣeéṣe àmì rẹ̀ mọ́, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ sínú ọ̀rọ̀.
- issue: Agbára ἐκεῖνος nígbà tí ó ń tọ́ka sí Júdásì
  choice: A pa ìtẹnumọ́ náà mọ́ pẹ̀lú “ẹni náà,” dípò “ó” nìkan.
  alternative: ó
  rationale: Arọ́pò-atọ́ka náà ní ìtẹnumọ́, ó sì lè fi ìjìnnà ìtàn hàn. “Ẹni náà” pa agbára àsọyé náà mọ́ láìfi ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá àpéjọ tí ó bófin mu, tí ó ní àmì ohùn níbi tí ó yẹ, tí ó sì jẹ́ àdánidá fún òǹkàwé òde òní. “Òkèlè búrẹ́dì” ṣe kedere ju lílo “òkèlè” nìkan lọ, “Òru sì ni” sì pa kúkúrú àti ìwúwo lítíréṣọ̀ orísun náà mọ́.
