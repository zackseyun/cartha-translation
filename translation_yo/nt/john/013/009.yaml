id: JHN.13.9
reference: John 13:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: yo
  text: Símónì Pétérù sọ fún un pé, “Olúwa[a], kì í ṣe ẹsẹ̀ mi nìkan, ṣùgbọ́n ọwọ́ mi àti orí mi pẹ̀lú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Ọ̀gá.” Ní Gíríìkì: Kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: A lo ọ̀rọ̀ ìṣe ìtàn Yorùbá tí ó ṣe déédé pẹ̀lú àyíká náà. Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ìsinsìnyí ìtàn, Yorùbá máa ń fi ‘sọ’ hàn lọ́nà àdánidá láìsọ ìtumọ̀ náà nù.
- source_word: αὐτῷ
  choice: fún un
  rationale: Èyí tú ọ̀rọ̀ arọ́pò-orúkọ dátífù náà ní tààrà; a kò fi ‘Jésù’ rọ́pò rẹ̀, nítorí Gíríìkì lo arọ́pò-orúkọ.
- source_word: Σίμων Πέτρος
  choice: Símónì Pétérù
  rationale: A kọ orúkọ ẹni náà gẹ́gẹ́ bí ìlò Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún fífi κύριος pe Jésù, ó sì pa ìjìnlẹ̀ ẹ̀kọ́ nípa ẹni tí Jésù jẹ́ mọ́.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: kì í ṣe ... nìkan, ṣùgbọ́n ... pẹ̀lú
  rationale: 'Ìṣètò yìí mú ìtakora àti àfikún inú Gíríìkì jáde ní Yorùbá àdánidá: kì í ṣe ohun kan nìkan, ṣùgbọ́n àwọn mìíràn pẹ̀lú.'
- source_word: τοὺς πόδας μου
  choice: ẹsẹ̀ mi
  rationale: Ìtumọ̀ tààrà ni, pẹ̀lú arọ́pò ohun-ìní ní ipò tí ó bá Yorùbá mu.
- source_word: τὰς χεῖρας
  choice: ọwọ́ mi
  rationale: Bí Gíríìkì kò tilẹ̀ tún μου sọ, ìṣọ̀kan àwọn ẹ̀yà ara fi hàn pé ọwọ́ Pétérù ni; Yorùbá àdánidá tún ‘mi’ sọ níbí.
- source_word: τὴν κεφαλήν
  choice: orí mi
  rationale: ‘Orí’ ni ìtumọ̀ àdánidá; a fi ‘mi’ kún un gẹ́gẹ́ bí ohun-ìní tí ìṣọ̀kan gbolohun náà fi hàn.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí ọ̀rọ̀ tí Pétérù fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa agbára akọ́lé náà àti ìjìnlẹ̀ rẹ̀ nínú Ìhìn Rere Jòhánù mọ́, láìfi ìtumọ̀ tí ó kọjá àyíká ẹsẹ yìí lé e lórí. Àlàyé ìsàlẹ̀ fi ọ̀nà mìíràn hàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ọ̀nà ìbánisọ̀rọ̀ Pétérù mọ́ ní ṣókí.
