id: JHN.13.37
reference: John 13:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: yo
  text: Pétérù wí fún un pé, “Olúwa, kí nìdí tí n kò fi lè tẹ̀ lé ọ nísinsìnyí[a]? Èmi yóò fi ìwàláàyè mi lélẹ̀ nítorí rẹ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní báyìí gan-an.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, ọ̀rọ̀ Gíríìkì náà ni psychē, tí a lè túmọ̀ sí “ẹ̀mí”; ṣùgbọ́n nínú àkànlò-èdè yìí, ìtumọ̀ rẹ̀ ni “ìwàláàyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: wí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí nínú ìtàn, ‘wí’ bá ọ̀nà ìtàn Yorùbá mu, kò sì yí ìtumọ̀ rẹ̀ padà.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ jẹ́ ọ̀rọ̀ àdúróṣinṣin fún κύριος nígbà tí a bá ń bá Jésù sọ̀rọ̀; ó fi ọ̀wọ̀ hàn, ó sì pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà lè ní mọ́.
- source_word: διὰ τί οὐ δύναμαί
  choice: èé ṣe tí èmi kò fi lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè nípa ìdí tí ẹni kò fi lè ṣe ohun kan, ó sì tẹ̀ lé ìtumọ̀ Gíríìkì pẹkipẹki.
- source_word: σοι ἀκολουθῆσαι
  choice: tẹ̀ lé ọ
  rationale: ‘Tẹ̀ lé’ lè túmọ̀ sí lílọ tọ ẹnì kan lẹ́yìn ní ti ibi àti jíjẹ́ ọmọ-ẹ̀yìn rẹ̀; nítorí náà, ó pa ìtumọ̀ méjèèjì mọ́ nínú ọ̀rọ̀ Jòhánù.
- source_word: ἄρτι
  choice: nísinsìnyí
  rationale: Ọ̀rọ̀ yìí fi àkókò tí wọ́n wà yẹn hàn lọ́nà tó ṣe kedere; ‘ní báyìí gan-an’ tún ṣeé lò láti tẹnu mọ́ ìkánjú rẹ̀.
- source_word: τὴν ψυχήν μου
  choice: ẹ̀mí mi
  rationale: Nínú àpólà yìí, ψυχή ń tọ́ka sí ìwàláàyè ẹni tí ó múra láti fi sílẹ̀ nínú ikú. ‘Ẹ̀mí mi’ jẹ́ àfihàn Yorùbá tó wọ́pọ̀ fún ìwàláàyè ẹni nínú irú ọ̀rọ̀ bẹ́ẹ̀, láìfi ìtumọ̀ àròjinlẹ̀ ‘ọkàn’ kún un.
- source_word: ὑπὲρ σοῦ
  choice: nítorí rẹ
  rationale: ‘Nítorí rẹ’ fi hàn pé Pétérù fẹ́ ṣe é fún àǹfààní Jésù tàbí ní ipò rẹ̀, láìpinnu pàtó láàárín àwọn ìtumọ̀ wọ̀nyẹn.
- source_word: θήσω
  choice: fi … lélẹ̀
  rationale: Pẹ̀lú ψυχή, τίθημι jẹ́ àkànlò-èdè fún fífi ìwàláàyè ẹni sílẹ̀; ‘fi ẹ̀mí lélẹ̀’ jẹ́ ọ̀nà Yorùbá tó bá àwòrán àti ìtumọ̀ náà mu.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ìkéde Pétérù
  choice: ẹ̀mí mi, ní ìtumọ̀ ìwàláàyè mi
  alternative: ọkàn mi
  rationale: Ọ̀rọ̀ inú àyíká náà dá lórí ìmúrasílẹ̀ Pétérù láti kú fún Jésù. ‘Ọkàn mi’ lè mú kí òǹkàwé ronú nípa apá àìrí ènìyàn dípò ìwàláàyè rẹ̀.
- issue: Ìtumọ̀ ἀκολουθέω
  choice: tẹ̀ lé
  alternative: bá ọ lọ
  rationale: ‘Tẹ̀ lé’ pa ìtumọ̀ lílọ tọ Jésù lẹ́yìn àti ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn rẹ̀ mọ́; ‘bá ọ lọ’ yóò dín ọ̀rọ̀ náà kù sí ìrìn àjò nìkan.
translation_notes:
  register: A lo Yorùbá àdánidá, ọlọ́lá, tí àwọn òǹkàwé òde òní lè lóye. Àpólà ‘fi ẹ̀mí mi lélẹ̀’ pa àwòrán inú Gíríìkì mọ́, ‘tẹ̀ lé’ sì pa ìtumọ̀ ibi àti ti ọmọ-ẹ̀yìn mọ́ láìyanju ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà.
