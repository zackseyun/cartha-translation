source:
  edition: SBLGNT
  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: yo
  text: Nítorí ó mọ ẹni tí ń da á[a]; nítorí ìdí èyí ni ó ṣe sọ pé, “Kì í ṣe gbogbo yín ni ó mọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gidi, “ẹni tí ń fi í lé ọwọ́.” Ní àyíká yìí, èyí ń tọ́ka sí ìwà ọ̀dàlẹ̀ Júdásì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ó mọ
  rationale: Fọ́ọ̀mù náà ní ìtumọ̀ ìmọ̀ tí ó wà nígbà náà; ‘ó mọ’ jẹ́ ọ̀nà àdánidá nínú ìtàn Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ tí ó ṣáájú múlẹ̀ ní ọ̀nà àlàyé.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: ẹni tí ń fi í lé wọn lọ́wọ́
  rationale: Ó pa àwòrán ìpilẹ̀ṣẹ̀ παραδίδωμι, ‘fi lé lọ́wọ́,’ mọ́, ó sì fi ipa participle onítẹ̀síwájú hàn; àyíká ìtàn fi hàn pé fífi Jésù lé wọn lọ́wọ́ jẹ́ ìwà ọ̀dàlẹ̀.
- source_word: διὰ τοῦτο
  choice: nítorí ìdí èyí
  rationale: Ó sọ ìsopọ̀ okunfa láàárín ohun tí Jésù mọ àti ohun tí ó sọ ní kedere.
- source_word: εἶπεν ὅτι
  choice: ó ṣe sọ pé
  rationale: ‘Pé’ ni ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí a fa yọ; ‘ṣe’ bá ìtumọ̀ okunfa ti διὰ τοῦτο mu.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  choice: Kì í ṣe gbogbo yín ni ó mọ́
  rationale: Ìkọ̀ ‘kì í ṣe gbogbo yín’ yàgò fún ìtumọ̀ pé kò sí ẹnikẹ́ni tí ó mọ́; ‘mọ́’ pa ìtumọ̀ ìwẹ̀ àti ti inú ọkàn mọ́ nínú àyíká fífọ ẹsẹ̀.
theological_decisions:
- issue: Ìtumọ̀ παραδιδόντα nípa Júdásì
  choice: ẹni tí ń fi í lé wọn lọ́wọ́
  alternative: ẹni tí ń dà á
  rationale: Àṣàyàn náà sún mọ́ àwòrán Gíríìkì, ó sì jẹ́ kí àyíká sọ pé ìṣe náà jẹ́ ìwà ọ̀dàlẹ̀, dípò fífi ìtumọ̀ yẹn nìkan sínú ọ̀rọ̀ pàtàkì.
- issue: Ìtumọ̀ καθαροί nínú ọ̀rọ̀ fífọ ẹsẹ̀
  choice: mọ́
  alternative: jẹ́ mímọ́ nípa ti ẹ̀mí
  rationale: ‘Mọ́’ lè tọ́ka sí ìmọ́ ti ara àti ìwà tàbí ipò inú; ó pa ìfọ̀rọ̀wérọ̀ méjèèjì mọ́ láì pinnu rẹ̀ sí ti ẹ̀mí nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Ọ̀rọ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì pa ìsopọ̀ okunfa àti ìtumọ̀ méjì ti ‘mọ́’ mọ́.
