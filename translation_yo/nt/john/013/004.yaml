base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: yo
  text: 'Ó dìde kúrò nínú oúnjẹ alẹ́[a], ó sì bọ́ àwọn aṣọ òde rẹ̀ sílẹ̀; ó mú aṣọ ìnura kan, ó sì fi í di ara rẹ̀[b].


    [a] Tàbí, “Ó dìde kúrò nínú oúnjẹ náà.”


    [b] Tàbí, “ó sì fi aṣọ ìnura náà di ara rẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó dìde kúrò nínú oúnjẹ náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì fi aṣọ ìnura náà di ara rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται
  choice: Ó dìde
  rationale: The simple Yoruba narrative form naturally expresses his getting up, while retaining the vivid, direct movement of the Greek historical present.
- source_word: ἐκ τοῦ δείπνου
  choice: kúrò níbi oúnjẹ alẹ́
  rationale: This conveys movement away from the supper setting without imposing a modern clock-time sense; the footnote preserves the broader sense ‘meal.’
- source_word: τίθησιν τὰ ἱμάτια
  choice: ó sì bọ́ àwọn aṣọ àwọ̀lékè rẹ̀ sílẹ̀
  rationale: In this context τίθημι means to lay aside or remove, and ἱμάτια denotes outer garments. The wording avoids suggesting that Jesus became completely unclothed.
- source_word: λαβὼν λέντιον
  choice: Ó mú aṣọ ìnura kan
  rationale: ‘Aṣọ ìnura’ is the natural, current Yoruba term for a towel or wiping cloth and clearly communicates the serving cloth intended here.
- source_word: διέζωσεν ἑαυτόν
  choice: ó sì fi í di ara rẹ̀ mọ́
  rationale: This directly and idiomatically expresses fastening the towel around himself. The supplied object pronoun ‘í’ refers unambiguously to the towel.
theological_decisions: []
translation_notes:
  register: Standard, dignified modern Yoruba with full tone marks. The sentence division keeps the sequence clear for ordinary readers while preserving all actions in the Greek. ‘Àwọn aṣọ àwọ̀lékè’ makes the outer-garment sense explicit, and ‘fi í di ara rẹ̀ mọ́’ avoids an archaic equivalent of ‘girded.’
