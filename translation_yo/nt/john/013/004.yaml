  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìṣe inú Gíríìkì dáadáa: ó dìde láti inú oúnjẹ alẹ́, ó bọ́ aṣọ rẹ̀ sílẹ̀, ó mú aṣọ ìnura, ó sì fi í di ara rẹ̀. Àtúnṣe kékeré náà mú ìtumọ̀ ‘outer garments’ hàn ní ọ̀nà tó wọ́pọ̀ síi, ó sì mú gbólóhùn ìdí aṣọ ìnura náà rọrùn síi.'
