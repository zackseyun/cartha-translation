  to: 'Lẹ́yìn náà, ó da omi sínú agbada ìwẹ̀[a], ó sì bẹ̀rẹ̀ sí í fọ ẹsẹ̀ àwọn ọmọ-ẹ̀yìn àti láti fi aṣọ ìnura tí ó fi so mọ́ ẹgbẹ́ rẹ̀[b] nu wọ́n.


    [a] Tàbí, “agbada.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun èlò tí a fi ń ṣe ìwẹ̀.


    [b] Ní ìtumọ̀ tààrà, “èyí tí ó fi di ara rẹ̀ mọ́.” Èyí ń tọ́ka sí aṣọ ìnura tí ó so mọ́ ẹgbẹ́ rẹ̀ fún iṣẹ́.'
  rationale: Àtúnṣe náà mú ìtumọ̀ ìsàlẹ̀ [b] bá ìkọ̀ Gíríìkì ᾧ ἦν διεζωσμένος mu, ó sì mú ìkọ̀ Yorùbá dájú pé Jesu ni ó fi aṣọ ìnura náà so mọ́ ẹgbẹ́ rẹ̀. Ó tún yà agbada ìwẹ̀ sọ́tọ̀ kúrò ní ohun èlò tí a dá fún fífọ ẹsẹ̀ nìkan. A pa ìtumọ̀ àti ìforígbárí ìṣe inú orísun mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:28:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtẹ̀lé ìṣe, omi sínú agbada, ìbẹ̀rẹ̀ fífọ ẹsẹ̀ àwọn ọmọ-ẹ̀yìn, àti fífi aṣọ ìnura nu wọ́n mọ́. Síbẹ̀, ìtumọ̀ ìsàlẹ̀ [b] kò ṣe afihan ìbáṣepọ̀ Gíríìkì náà dáadáa: aṣọ ìnura náà ni Jesu fi di ara rẹ̀ mọ́, kì í ṣe pé ó kan ‘di ara rẹ̀ ní àmùrè.’'
  naturalness: A lè sọ ọ̀rọ̀ náà ní Yorùbá ìgbàlódé tó rọrùn síi nípa lílo “so mọ́ ẹgbẹ́ rẹ̀” fún aṣọ tí a fi dì mọ́ ẹgbẹ́, àti “láti fi ... nu wọ́n” fún ìṣe kejì tí ἤρξατο ń ṣàkóso.
  terminology: “Agbada” àti “aṣọ ìnura” bá νιπτῆρ àti λέντιον mu. A yí “agbada ìfọsẹ̀” padà sí “agbada ìwẹ̀” kí a má ṣe sọ pé ohun èlò náà jẹ́ fún fífọ ẹsẹ̀ nìkan, níwọ̀n bí νιπτῆρ ti jẹ́ agbada ìwẹ̀ ní gbogbogbòò.
  issues:
  - severity: medium
    issue: Ìtumọ̀ ìsàlẹ̀ [b] jẹ́ aláìpé, ó sì jẹ́ àìdánidá díẹ̀.
    rationale: ᾧ ἦν διεζωσμένος túmọ̀ sí ‘èyí tí ó fi di ara rẹ̀ mọ́’/‘èyí tí ó so mọ́ ẹgbẹ́ rẹ̀.’ Ọ̀rọ̀ “tí ó fi di ara rẹ̀ ní àmùrè” lè túmọ̀ sí pé ó wọ àmùrè, kò sì fi aṣọ ìnura náà hàn gẹ́gẹ́ bí ohun èlò tí a fi dì ara.
  - severity: low
    issue: “Agbada ìfọsẹ̀” lè sọ iṣẹ́ agbada náà di pé ó jẹ́ fún ẹsẹ̀ nìkan.
    rationale: νιπτῆρ jẹ́ agbada tàbí ohun èlò ìwẹ̀; àyíká ni ó sọ pé a lo o fún fífọ ẹsẹ̀ nínú ẹsẹ yìí.
