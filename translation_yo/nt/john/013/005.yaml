source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: yo
  text: 'Lẹ́yìn náà, ó da omi sínú agbada ìwẹ̀[a], ó sì bẹ̀rẹ̀ sí í fọ ẹsẹ̀ àwọn ọmọ-ẹ̀yìn àti láti fi aṣọ ìnura tí ó fi so mọ́ ẹgbẹ́ rẹ̀[b] nu wọ́n.


    [a] Tàbí, “agbada.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun èlò tí a fi ń ṣe ìwẹ̀.


    [b] Ní ìtumọ̀ tààrà, “èyí tí ó fi di ara rẹ̀ mọ́.” Èyí ń tọ́ka sí aṣọ ìnura tí ó so mọ́ ẹgbẹ́ rẹ̀ fún iṣẹ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “agbada.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun èlò tí a fi ń ṣe ìwẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ tààrà, “èyí tí ó fi di ara rẹ̀ mọ́.” Èyí ń tọ́ka sí aṣọ ìnura tí ó so mọ́ ẹgbẹ́ rẹ̀ fún iṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Lẹ́yìn náà
  rationale: Ó fi hàn pé ìṣe yìí tẹ̀ lé èyí tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtẹ̀síwájú ìtàn ní Yorùbá.
- source_word: βάλλει ὕδωρ
  choice: ó da omi
  rationale: Bí ó tilẹ̀ jẹ́ pé βάλλω lè túmọ̀ sí fífi tàbí jù ohun kan sí ibì kan, “da omi” ni ọ̀rọ̀ Yorùbá àdánidá fún fífi omi sínú ohun èlò.
- source_word: νιπτῆρα
  choice: agbada ìfọsẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun èlò ìwẹ̀; “agbada ìfọsẹ̀” mú iṣẹ́ rẹ̀ hàn kedere nínú àyíká ọ̀rọ̀ yìí láì fi ohun tí kò sí nínú orísun kún un.
- source_word: ἤρξατο νίπτειν
  choice: ó sì bẹ̀rẹ̀ sí í fọ
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ìṣe mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó wọ́pọ̀.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: ẹsẹ̀ àwọn ọmọ-ẹ̀yìn
  rationale: Èyí jẹ́ ìṣètò ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìbáṣepọ̀ oníwun inú Gíríìkì mọ́.
- source_word: ἐκμάσσειν
  choice: fi … nù wọ́n
  rationale: “Nù” níbí ń sọ ìṣe fífi aṣọ nu omi kúrò lára ẹsẹ̀; arọ́pò-orúkọ “wọ́n” ń tọ́ka sí àwọn ẹsẹ̀.
- source_word: τῷ λεντίῳ
  choice: fi aṣọ ìnura
  rationale: λεντίον jẹ́ aṣọ tí a fi ń nu ara; “aṣọ ìnura” ṣe kedere, ó sì bá àyíká mu.
- source_word: ᾧ ἦν διεζωσμένος
  choice: tí ó dì mọ́ ẹgbẹ́ rẹ̀
  rationale: Èyí sọ ọ̀nà tí ó dì aṣọ náà mọ́ ara rẹ̀ fún iṣẹ́ ní Yorùbá òde òní, láì lo ọ̀rọ̀ àtijọ́ tàbí aláìyé.
