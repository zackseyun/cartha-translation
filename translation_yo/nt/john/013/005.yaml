translation_notes:
  register: 'A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. A pa ìyípadà àsìkò ọ̀rọ̀ inú ìtàn mọ́ ní ọ̀nà Yorùbá tí ó rọrùn: ìṣe títẹ̀ lé ara wọn ni “ó da,” nígbà tí “ó bẹ̀rẹ̀” àti “ó sì ń” mú ìbẹ̀rẹ̀ àti ìtẹ̀síwájú fífọ àti nínú hàn.'
