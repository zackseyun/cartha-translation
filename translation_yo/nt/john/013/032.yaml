id: JHN.13.32
reference: John 13:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: yo
  text: Bí a bá ti yin Ọlọ́run lógo nínú rẹ̀[a], Ọlọ́run náà yóò yin òun lógo nínú ara Ọlọ́run fúnra rẹ̀[b], yóò sì yin òun lógo lẹ́sẹ̀kẹsẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Níwọ̀n bí a ti yin Ọlọ́run lógo nínú rẹ̀.” Gíríìkì lo εἰ (“bí”), bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà lè fi hàn pé ipò yìí jẹ́ òtítọ́.
    reason: alternative_reading
  - marker: b
    text: A tún lè lóye “nínú ara Ọlọ́run fúnra rẹ̀” sí “pẹ̀lú ara Ọlọ́run fúnra rẹ̀” tàbí “nípasẹ̀ ara Ọlọ́run fúnra rẹ̀”; gbólóhùn Gíríìkì náà kúkúrú, ìtumọ̀ rẹ̀ sì jinlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Bí a bá ti
  rationale: Ó pa ìrísí ọ̀rọ̀ oní شرط 'bí' mọ́, nígbà tí 'bá ti' jẹ́ kí Yorùbá náà fi hàn pé ohun tí a sọ lè jẹ́ òtítọ́ tí àyíká ọ̀rọ̀ ti gbà.
- source_word: ἐδοξάσθη
  choice: a bá ti yin ... lógo
  rationale: Ìṣe àìṣeṣe náà ni a fi ọ̀nà Yorùbá àdánidá hàn, ó sì tọ́ka sí ohun tí ó ti ṣẹlẹ̀ láìfi àkókò kún un ju ti Gíríìkì lọ.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa ìtumọ̀ àkọ́kọ́ ti ἐν mọ́, kò sì yí i sí 'nípasẹ̀ rẹ̀,' èyí tí yóò túmọ̀ ọ̀rọ̀ náà síwájú sí i.
- source_word: δοξάσει
  choice: yóò yin ... lógo
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ δοξάζω mọ́ jálẹ̀ ẹsẹ̀ náà, ó sì lágbára ju 'bọ̀wọ̀ fún' lọ.
- source_word: ἐν αὑτῷ
  choice: nínú ara rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò afẹ̀yìntì náà ń tọ́ka padà sí Ọlọ́run; 'nínú ara rẹ̀' pa ìṣọ̀kan àti ìjinlẹ̀ gbólóhùn Gíríìkì mọ́.
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ìṣe tí yóò ṣẹlẹ̀ láìjáfara.
theological_decisions:
- issue: Agbára ìpèníjà εἰ ní àyíká ọ̀rọ̀ tí ó dà bí ohun tí a ti gbà pé ó jẹ́ òtítọ́
  choice: Bí a bá ti yin Ọlọ́run lógo nínú rẹ̀
  alternative: Níwọ̀n bí a ti yin Ọlọ́run lógo nínú rẹ̀
  rationale: Àkọ́kọ́ pa εἰ, 'bí,' mọ́, ṣùgbọ́n àyíká ọ̀rọ̀ lè mú un túmọ̀ sí ipò tí a gbà pé ó jẹ́ òtítọ́. Àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì náà hàn láìyanjú ìfọ̀rọ̀wérọ̀ náà ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ ἐν αὑτῷ
  choice: nínú ara rẹ̀
  alternative: pẹ̀lú ara rẹ̀ tàbí nípasẹ̀ ara rẹ̀
  rationale: Ìtumọ̀ pàtó náà pa gbólóhùn Gíríìkì tí ó kúkúrú tí ó sì jinlẹ̀ mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. A yan “yin ... lógo” láti pa àtúnlò δοξάζω mọ́, a sì lo “òun” fún ẹni tí Ọlọ́run yóò yin lógo, kí ìtọ́kasí sí Jésù yà kedere sí “ara rẹ̀,” tí ó ń tọ́ka padà sí Ọlọ́run.
