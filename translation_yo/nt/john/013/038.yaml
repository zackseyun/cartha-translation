  to: Jésù dá a lóhùn pé, “Ìwọ yóò fi ìyè rẹ silẹ nítorí mi bí?[a] Lóòótọ́, lóòótọ́ ni mo sọ fún ọ, àkùkọ kì yóò kọ títí ìwọ ó fi sẹ́ mi nígbà mẹ́ta.”
