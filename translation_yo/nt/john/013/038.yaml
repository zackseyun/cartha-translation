reference: John 13:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: yo
  text: Jésù dá a lóhùn pé, “Ìwọ yóò fi ìyè rẹ silẹ nítorí mi bí?[a] Lóòótọ́, lóòótọ́ ni mo sọ fún ọ, àkùkọ kì yóò kọ títí ìwọ ó fi sẹ́ mi nígbà mẹ́ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí rẹ.” Ọ̀rọ̀ Giriki náà, ψυχή, lè túmọ̀ sí “ẹ̀mí” tàbí “ìyè”; níbí, ó ń tọ́ka sí fífi ìyè ẹni rúbọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: dá a lóhùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìdáhùn Jésù hàn; àsìkò tí ó ti kọjá bá ìtàn Yorùbá mu ju pípa historical present Giriki mọ́ lọ.
- source_word: ψυχήν
  choice: ẹ̀mí
  rationale: Nínú àṣà ọ̀rọ̀ fífi ψυχή lélẹ̀, ó túmọ̀ sí fífi ìyè ẹni rúbọ. Ní Yorùbá, ‘fi ẹ̀mí rẹ lélẹ̀’ jẹ́ gbólóhùn àdánidá fún fífi ìyè ẹni sílẹ̀, láìfi dandan dá ẹ̀kọ́ kan nípa apá àìrí ènìyàn múlẹ̀.
- source_word: ὑπὲρ ἐμοῦ
  choice: nítorí mi
  rationale: Ó sọ ìṣe fún àǹfààní tàbí ní ipò Jésù ní ọ̀nà kúkúrú, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: θήσεις
  choice: yóò fi ... lélẹ̀
  rationale: Ó pa àwòrán àṣà ọ̀rọ̀ τίθημι τὴν ψυχήν mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí a lè lóye gẹ́gẹ́ bí fífi ìyè ẹni rúbọ.
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa àtúnsọ àti ìtẹnumọ́ ọ̀rọ̀ Jésù mọ́ ní èdè Yorùbá òde òní.
- source_word: οὐ μὴ
  choice: kì yóò
  rationale: Pẹ̀lú gbólóhùn ‘títí ... fi,’ àìjẹ́wọ́ ọjọ́ iwájú yìí lágbára, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἀλέκτωρ
  choice: àkùkọ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún rooster.
- source_word: φωνήσῃ
  choice: kọ
  rationale: ‘Àkùkọ kọ’ ni àṣà ọ̀rọ̀ Yorùbá fún igbe àkùkọ.
- source_word: ἕως οὗ
  choice: títí ... fi
  rationale: Ìkọ̀lé yìí fi ààlà àkókò hàn ní ọ̀nà Yorùbá àdánidá.
- source_word: ἀρνήσῃ με
  choice: sẹ́ mi
  rationale: ‘Sẹ́ ẹni’ túmọ̀ sí kíkọ̀ tàbí ṣíṣe bí ẹni pé a kò mọ ẹni náà; ó bá ìṣẹ̀lẹ̀ Pétérù mu láìṣe àlàyé ju ọ̀rọ̀ Giriki lọ.
- source_word: τρίς
  choice: nígbà mẹ́ta
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó ṣe kedere fún ‘three times.’
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ fífi ara ẹni rúbọ
  choice: ẹ̀mí nínú gbólóhùn ‘fi ẹ̀mí rẹ lélẹ̀’
  alternative: ìyè nínú gbólóhùn ‘fi ìyè rẹ sílẹ̀’
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìmúratán Pétérù láti kú fún Jésù. Gbólóhùn Yorùbá náà mú ìtumọ̀ fífi ìyè rúbọ jáde, láìdín ψυχή kù sí ìtumọ̀ ẹ̀kọ́ nípa ‘ọkàn/ẹ̀mí’ nìkan.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ọ̀wọ̀, kedere, àti àdánidá fún àwọn òǹkàwé òde òní. A pa ìbéèrè ẹlẹ́gàn Jésù, àtúnsọ ‘Lóòótọ́,’ àti àsọtẹ́lẹ̀ ìsẹ́ni Pétérù mọ́.
