  to: Jésù dáhùn pé, “Ẹni tí èmi yóò bù òkèlè búrẹ́dì náà, tí n ó sì fi fún un, òun ni.” Nítorí náà, lẹ́yìn tí ó bù òkèlè búrẹ́dì náà, ó fi fún Júdásì, ọmọ Símónì Iskariotu[a].
