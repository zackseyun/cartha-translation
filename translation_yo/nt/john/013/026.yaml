id: JHN.13.26
reference: John 13:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: yo
  text: Jésù dáhùn pé, “Ẹni tí èmi yóò bù òkèlè búrẹ́dì náà, tí n ó sì fi fún un, òun ni.” Nítorí náà, lẹ́yìn tí ó bù òkèlè búrẹ́dì náà, ó fi fún Júdásì, ọmọ Símónì Iskariotu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Júdásì Iskariotu, ọmọ Símónì.” A lè túmọ̀ ìṣètò ọ̀rọ̀ Gíríìkì náà ní ọ̀nà méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: dáhùn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ‘dáhùn’; Yorùbá sábà máa ń lo ìṣe tí ó ti ṣẹlẹ̀ nínú ìtàn dípò fífi historical present Gíríìkì ṣe ní ọ̀nà tí kò ní dùn bí Yorùbá àdánidá.
- source_word: Ἐκεῖνός ἐστιν
  choice: òun ni
  rationale: ‘Òun ni’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti dá ẹni kan mọ̀, ó sì ní agbára ìtẹnumọ́ demonstrative Gíríìkì.
- source_word: ᾧ
  choice: ẹni tí ... fún un
  rationale: Ìṣètò yìí sọ ẹni tí a ó fún ní òkèlè náà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: βάψω
  choice: yóò fi ... bọ
  rationale: ‘Fi ... bọ’ sọ fífi oúnjẹ rì sínú ohun kan; ‘yóò’ pa ìtumọ̀ ọjọ́ iwájú mọ́ láì mú un lọ sí ìtumọ̀ ìbatisí.
- source_word: ψωμίον
  choice: òkèlè búrẹ́dì
  rationale: ψωμίον jẹ́ ẹ̀ka kékeré tàbí òkèlè búrẹ́dì; ‘òkèlè búrẹ́dì’ ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: καὶ δώσω αὐτῷ
  choice: tí n ó sì fún un
  rationale: Ó pa ìṣe fífún ẹni náà mọ́; ohun tí a fún un ti hàn gbangba láti inú gbólóhùn tó ṣáájú.
- source_word: βάψας οὖν
  choice: Nítorí náà, lẹ́yìn tí ó fi ... bọ
  rationale: ‘Lẹ́yìn tí’ fi hàn pé fífibọ̀ ṣẹlẹ̀ ṣáájú fífún, ‘Nítorí náà’ sì dúró fún οὖν.
- source_word: δίδωσιν
  choice: ó fún
  rationale: Àkókò ìtàn tí Yorùbá ń lò jẹ́ àdánidá níbí, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: Júdásì, ọmọ Símónì Iskariotu
  rationale: Èyí tẹ̀ lé ìsopọ̀ genitive Gíríìkì tó sún mọ́ra jù, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ míì tó ṣeé ṣe mọ́.
theological_decisions:
- issue: Ẹni tí orúkọ àpèjẹ ‘Iskariotu’ ń ṣàpèjúwe nínú gbólóhùn ìkẹyìn
  choice: Júdásì, ọmọ Símónì Iskariotu
  alternative: Júdásì Iskariotu, ọmọ Símónì
  rationale: Σίμωνος Ἰσκαριώτου lè túmọ̀ ní tààrà sí ‘ti Símónì Iskariotu,’ ṣùgbọ́n ó tún ṣeé ka gẹ́gẹ́ bí ìdánimọ̀ àṣà fún Júdásì Iskariotu, ọmọ Símónì. A kò yanju àìdánilójú náà ní ìkọ̀kọ̀; a fi ìtumọ̀ kejì sínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní. A lo ‘búrẹ́dì’ nítorí pé ó jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn mọ̀, a sì lo ‘òkèlè’ láti fi hàn pé ẹ̀ka kékeré ni.
