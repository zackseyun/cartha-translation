id: JHN.13.6
reference: John 13:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: yo
  text: Nítorí náà, ó wá sí ọ̀dọ̀ Símónì Pétérù. Pétérù wí fún un pé,[a] “Olúwa, ìwọ ni o ń fọ ẹsẹ̀ mi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀gá, ìwọ ni o ń fọ ẹsẹ̀ mi?” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ìkíni ọ̀wọ̀; síbẹ̀, “Olúwa” ni a lò gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: ó dé
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ni nínú ìtàn Gíríìkì, ṣùgbọ́n ‘ó dé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó wá dé ọ̀dọ̀ Pétérù, láìyí ìtọ́sọ́nà ìrìn padà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ipa àsopọ̀ àti ìtẹ̀síwájú ìtàn mọ́; níbí ó so dídé Jésù ọ̀dọ̀ Pétérù mọ́ fífọ ẹsẹ̀ àwọn ọmọ-ẹ̀yìn.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: ọ̀dọ̀ Símónì Pétérù
  rationale: ‘Dé ọ̀dọ̀’ jẹ́ gbólóhùn Yorùbá àdánidá fún ìrìn sí ibi tí ènìyàn kan wà.
- source_word: λέγει αὐτῷ
  choice: Pétérù wí fún un pé
  rationale: Olùsọ̀ náà ni Símónì Pétérù gẹ́gẹ́ bí ìtumọ̀ àdánidá ti àyíká; fífi orúkọ rẹ̀ hàn yọ ìṣiyèméjì tí arọ́pò-orúkọ akọ Yorùbá lè dá sílẹ̀, nígbà tí ‘fún un’ ń ṣàfihàn αὐτῷ.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ìkíni ọ̀wọ̀ àti ìró ìtumọ̀ nípa ẹni tí Jésù jẹ́ nínú Ìhìn Rere Jòhánù mọ́; ‘Ọ̀gá’ tún ṣeé ṣe gẹ́gẹ́ bí ìkíni ọ̀wọ̀.
- source_word: σύ
  choice: ìwọ ni
  rationale: Ìlò arọ́pò-orúkọ tí a tẹnumọ́ nínú Gíríìkì ni a fi ‘ìwọ ni’ hàn ní Yorùbá, ó sì mú ìyàlẹ́nu Pétérù jáde.
- source_word: μου
  choice: mi
  rationale: ‘Ẹsẹ̀ mi’ ni ọ̀nà àdánidá láti fi ìní hàn ní Yorùbá.
- source_word: νίπτεις
  choice: o fẹ́ fọ
  rationale: Nínú àyíká, ìbéèrè náà ń dojú kọ ohun tí Jésù fẹ́ ṣe sí Pétérù nígbà tí ó dé ọ̀dọ̀ rẹ̀. ‘Fọ’ bá fífọ apá ara mu, ‘fẹ́’ sì jẹ́ kí ìbéèrè Yorùbá dun ní ti ẹ̀dá láìsọ ọ́ di ìfẹ́ inú lásán.
- source_word: τοὺς πόδας
  choice: ẹsẹ̀
  rationale: Yorùbá sábà máa ń lo ‘ẹsẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀ fún ẹsẹ̀ méjèèjì; ìní náà hàn nínú ‘ẹsẹ̀ mi.’
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ọ̀rọ̀ tí Pétérù sọ sí Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìkíni ọ̀wọ̀ mọ́, ó sì jẹ́ kí ìtumọ̀ Kristológì tí ó lè wà nínú Ìhìn Rere Jòhánù dúró láìfipá mú un. Àmọ́, κύριε lè jẹ́ ìkíni ọ̀wọ̀ lásán ní ibòmíràn, nítorí náà a tọ́ka sí ‘Ọ̀gá’ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ‘Pétérù’ dípò arọ́pò-orúkọ nínú gbólóhùn kejì kí olùsọ̀ má bàa dàrú, nítorí Yorùbá kò fi akọ tàbí abo hàn nínú ‘ó.’
