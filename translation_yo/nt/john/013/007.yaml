- from: Jésù dá a lóhùn, ó sì wí fún un pé, “Ohun tí èmi ń ṣe, ìwọ kò mọ̀ nísinsin yìí,[a] ṣùgbọ́n yóò yé ọ lẹ́yìn àwọn nǹkan wọ̀nyí.”[b]
