source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: yo
  text: Jésù dá a lóhùn, ó sì wí pé, “Ohun tí èmi ń ṣe, ìwọ kò mọ̀ nísinsin yìí,[a] ṣùgbọ́n yóò yé ọ lẹ́yìn àwọn nǹkan wọ̀nyí.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, ọ̀rọ̀-ìṣe méjì ọ̀tọ̀ ni a lò: èyí àkọ́kọ́ sábà máa ń túmọ̀ sí “mọ̀,” èkejì sì lè túmọ̀ sí “wá mọ̀” tàbí “lóye.”'
    reason: lexical_alternative
  - marker: b
    text: “Lẹ́yìn àwọn nǹkan wọ̀nyí” lè tọ́ka sí ohun tí yóò ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ nínú ìṣẹ̀lẹ̀ yìí, tàbí, ní ìtumọ̀ tó gbòòrò, sí àwọn ìṣẹ̀lẹ̀ tó máa wáyé lẹ́yìn náà tí yóò mú kí ohun tí Jésù ṣe yé e.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: dá a lóhùn, ó sì wí fún un pé
  rationale: Ó pa àwọn ọ̀rọ̀-ìṣe méjèèjì, ‘dá lóhùn’ àti ‘wí,’ mọ́ gẹ́gẹ́ bí Gíríìkì, ní ọ̀nà tí ó bá ìtàn Yorùbá mu.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Ohun tí èmi ń ṣe
  rationale: ‘Ń ṣe’ fi hàn pé iṣẹ́ náà ń lọ lọ́wọ́; fífi ‘èmi’ sí i tún pa ìtẹnumọ́ ἐγώ mọ́.
- source_word: οὐκ οἶδας ἄρτι
  choice: ìwọ kò mọ̀ nísinsin yìí
  rationale: ‘Mọ̀’ jẹ́ ìtumọ̀ taara fún οἶδας, ‘nísinsin yìí’ sì sọ àkókò ìsinsin náà ní kedere; ‘ìwọ’ pa ìtẹnumọ́ σὺ mọ́.
- source_word: γνώσῃ
  choice: yóò yé ọ
  rationale: Ó fi òye tí yóò wá lẹ́yìn hàn, ó sì pa ìyàtọ̀ ọ̀rọ̀-ìṣe tó wà láàárín οἶδας àti γνώσῃ mọ́.
- source_word: μετὰ ταῦτα
  choice: lẹ́yìn àwọn nǹkan wọ̀nyí
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí ju ‘lẹ́yìn náà’ lọ, ó sì jẹ́ kí bí àkókò tí gbolohun náà ń tọ́ka sí ṣe gbòòrò tó máa ṣí sílẹ̀.
theological_decisions:
- issue: Àkókò tí Pétérù yóò fi lóye ohun tí Jésù ṣe
  choice: A túmọ̀ μετὰ ταῦτα sí ‘lẹ́yìn àwọn nǹkan wọ̀nyí’ láì sọ pàtó ohun tí ó tọ́ka sí.
  alternative: A lè sọ pé ‘lẹ́yìn náà,’ tàbí kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìgbà tí fífọ ẹsẹ̀ parí, lẹ́yìn àgbélébùú àti àjíǹde, tàbí nípasẹ̀ Ẹ̀mí.
  rationale: Gíríìkì kò pinnu ìṣẹ̀lẹ̀ kan pàtó; ìtumọ̀ náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún òǹkàwé lasán. A pa ìṣètò ‘dá lóhùn … wí’ àti ‘lẹ́yìn àwọn nǹkan wọ̀nyí’ mọ́ nítorí ìbámu pẹ̀lú orísun, láì jẹ́ kí gbolohun náà le.
