review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìyàtọ̀ láàárín οἶδας (‘mọ̀’) àti γνώσῃ (níní òye ní ọjọ́ iwájú) mọ́, ó sì fi μετὰ ταῦτα sílẹ̀ láì pinnu ìṣẹ̀lẹ̀ kan pàtó. Àmọ́, ‘dá a lóhùn, ó sì wí fún un’ tún olùgbà ìṣe kan náà ṣe lẹ́ẹ̀mejì níbi tí Yorùbá ti lè sọ ọ́ ní mímọ́ra sí i.'
  naturalness: ‘Jésù dá a lóhùn, ó sì wí pé’ jẹ́ èdè Yorùbá boṣewa tí ó rọrùn, ó sì ń gbé ìtumọ̀ ‘answered and said to him’ lọ ní ti ara. A tún ṣàtúnṣe akọ́pamọ́ [b] kí ó má ṣe yí ẹni tí a ń bá sọ̀rọ̀ padà láti ẹni kan sí ọ̀pọ̀.
  terminology: ‘Mọ̀,’ ‘yé ọ,’ ‘nísinsin yìí,’ àti ‘lẹ́yìn àwọn nǹkan wọ̀nyí’ yẹ, wọ́n sì bá ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní mu. ‘Yé ọ’ sọ ìmọ̀/òye tí yóò wá ní ọjọ́ iwájú nípa ti ara, láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
  issues:
