id: JHN.13.19
reference: John 13:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: yo
  text: Láti ìsinsìnyí lọ, mo ń sọ fún yín kí ó tó ṣẹlẹ̀, kí ẹ lè gbàgbọ́ nígbà tí ó bá ṣẹlẹ̀ pé “Èmi ni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi ni ẹni náà.” Nínú Gíríìkì, gbólóhùn náà kò ní àfikún-ọrọ̀ ní kedere, ó sì lè tún rántí bí Ọlọ́run ṣe ń dá ara rẹ̀ mọ̀ nínú Aísáyà àti ní àwọn ibòmíràn nínú Jòhánù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Láti ìsinsìnyí lọ
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àkókò ìsinsìnyí àti ohun tí yóò máa bá a lọ; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ìtọ́kasí sí ọjọ́ iwájú mọ́.
- source_word: λέγω ὑμῖν
  choice: mo ń sọ fún yín
  rationale: Àmì ‘ń’ fi iṣe tí ó ń lọ lọ́wọ́ hàn, ‘fún yín’ sì pa ìtọ́kasí tààrà sí àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: πρὸ τοῦ γενέσθαι
  choice: kí ó tó ṣẹlẹ̀
  rationale: Ó fi hàn pé Jesu ń sọ ọ̀rọ̀ náà ṣáájú ìṣẹ̀lẹ̀ tí a kò dárúkọ ní pàtó; èdè náà ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí fi ète tàbí àbájáde tí a pinnu hàn ní Yorùbá láì sọ agbára gbólóhùn Gíríìkì di asán.
- source_word: πιστεύσητε
  choice: ẹ̀yin lè gbàgbọ́
  rationale: ‘Gbàgbọ́’ pa ìsopọ̀ ọ̀rọ̀ pẹ̀lú èdè ìgbàgbọ́ inú Jòhánù mọ́; ‘lè’ bá subjunctive inú gbólóhùn ète mu.
- source_word: ὅταν γένηται
  choice: nígbà tí ó bá ṣẹlẹ̀
  rationale: ‘Bá’ fi ìṣẹ̀lẹ̀ ọjọ́ iwájú tí a ń retí hàn, nígbà tí ‘ṣẹlẹ̀’ jẹ́ ọ̀rọ̀ òde òní tí ó ṣe kedere.
- source_word: ὅτι ἐγώ εἰμι
  choice: pé, “Èmi ni.”
  rationale: ‘Èmi ni’ jẹ́ ìdánimọ̀ ara ẹni tí ó ṣeé lóye ní Yorùbá, kò sì fi àfikún orúkọ tàbí àpèjúwe kan sínú ọ̀rọ̀ Gíríìkì tí kò ní predicate ní gbangba. Ó tún fi ààyè sílẹ̀ fún ìtumọ̀ jinlẹ̀ tí gbólóhùn náà lè ní nínú Jòhánù.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ἐγώ εἰμι tí kò ní predicate ní gbangba, tí ó sì lè rántí bí Ọlọ́run ṣe ń dá ara rẹ̀ mọ̀ nínú Aísáyà àti ní àwọn ibòmíràn nínú Jòhánù
  choice: “Èmi ni”
  alternative: “Èmi ni ẹni náà”
  rationale: “Èmi ni” sún mọ́ ìṣètò orísun, ó sì jẹ́ gbólóhùn Yorùbá tí ó lè ṣiṣẹ́ gẹ́gẹ́ bí ìdánimọ̀ ara ẹni. Kí a má bàa fi predicate tí kò sí nínú Gíríìkì kún un tàbí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ rẹ̀ tán, a pa àìmọ̀-pàtó náà mọ́, a sì ṣàlàyé yíyàn mìíràn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó bójú mu, tí ó ní àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo “ẹ̀yin” láti mú ọ̀pọ̀ ènìyàn inú ὑμῖν/πιστεύσητε hàn kedere.
