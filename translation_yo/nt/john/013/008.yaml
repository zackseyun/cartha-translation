review_pass:
  verdict: revise
  source_fidelity: 'The central meaning is retained, including the emphatic refusal, the washing, and Peter''s share with Jesus. However, “kò lè” ordinarily means “cannot/is not able to,” whereas οὐ μὴ ... εἰς τὸν αἰῶνα is Peter’s emphatic future refusal: “you will never ...”'
  naturalness: “O ò ní ... láéláé” is natural modern Standard Yoruba for an emphatic future negation. “Ìpín pẹ̀lú mi” is clear and preserves the relational-participatory breadth of μέρος μετ’ ἐμοῦ.
  terminology: “Fọ̀ ẹsẹ̀ mi” appropriately renders the explicit feet in Peter’s speech, while “fọ̀ ọ́” retains the Greek’s broader personal object in Jesus’ reply. “Ìpín pẹ̀lú mi” avoids narrowing the statement to a particular doctrinal mechanism.
  issues:
  - severity: medium
    issue: “Ìwọ kò lè fọ ẹsẹ̀ mi láéláé” expresses inability rather than Peter’s emphatic refusal.
    rationale: The Greek οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα strongly denies a future act. Yoruba “kò lè” conventionally means “cannot,” adding a modal-of-ability sense absent from the source.
  revised_text: Pétérù sọ fún un pé, “Ìwọ ò ní fọ̀ ẹsẹ̀ mi láéláé.” Jésù dá a lóhùn pé, “Bí èmi kò bá fọ̀ ọ́, ìwọ kò ní ìpín pẹ̀lú mi.”
