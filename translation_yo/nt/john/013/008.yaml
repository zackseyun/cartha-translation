revisions:
- from: Pétérù sọ fún un pé, “Ìwọ kò lè fọ ẹsẹ̀ mi láéláé.” Jésù dá a lóhùn pé, “Bí èmi kò bá fọ̀ ọ́, ìwọ kò ní ìpín pẹ̀lú mi.”
  to: Pétérù sọ fún un pé, “Ìwọ ò ní fọ̀ ẹsẹ̀ mi láéláé.” Jésù dá a lóhùn pé, “Bí èmi kò bá fọ̀ ọ́, ìwọ kò ní ìpín pẹ̀lú mi.”
  rationale: 'The first clause has been revised from an inability expression to an emphatic future negation, preserving Peter’s forceful refusal without adding a claim that Jesus lacks the ability to wash his feet. No footnote is needed in Yoruba: “ìpín pẹ̀lú mi” is a sufficiently broad rendering of μέρος μετ’ ἐμοῦ, and the English audit-trail alternative does not require a Yoruba footnote anchor.'
