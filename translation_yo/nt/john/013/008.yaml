id: JHN.13.8
reference: John 13:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: yo
  text: Pétérù sọ fún un pé, “Ìwọ ò ní fọ̀ ẹsẹ̀ mi láéláé.” Jésù dá a lóhùn pé, “Bí èmi kò bá fọ̀ ọ́, ìwọ kò ní ìpín pẹ̀lú mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: Ìwọ kò lè fọ … láéláé
  rationale: Àpapọ̀ ọ̀rọ̀ ìkọ̀ emphatic οὐ μή àti εἰς τὸν αἰῶνα fi ìkọ̀ tí ó lágbára hàn. “Kò lè … láéláé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìkọ̀ tàbí ìfẹ̀sẹ̀mulẹ̀ Pétérù nípa ohun ọjọ́ iwájú.
- source_word: μου τοὺς πόδας
  choice: ẹsẹ̀ mi
  rationale: Èyí jẹ́ ìtumọ̀ tààrà fún ohun tí ó jẹ́ ti olùsọ̀; ní Yorùbá, “ẹsẹ̀” lè dúró fún ẹsẹ̀ méjèèjì láìsí àfikún.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Jésù dá a lóhùn
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtàn Ìhìn Rere mu fún ìdáhùn sí ọ̀rọ̀ ẹlòmíràn.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Bí èmi kò bá fọ̀ ọ́
  rationale: Ó pa ìṣètò gbólóhùn oníṣ条件 Greek mọ́, ó sì fi ẹni àkọ́kọ́ “èmi” hàn fún ìtẹnumọ́ tó bá ọ̀rọ̀ Jésù mu.
- source_word: οὐκ ἔχεις μέρος
  choice: ìwọ kò ní ìpín
  rationale: μέρος lè túmọ̀ sí apá, ìpín, tàbí àǹfààní ìkópa. “Ìpín” pa àwòrán ìkópa tàbí jíjẹ́ alábápín mọ́ láìfi ẹ̀kọ́ ìsìn pàtó kún un.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: μετά pẹ̀lú genitive túmọ̀ sí ìbákẹ́gbẹ́ tàbí ìṣọ̀kan “pẹ̀lú,” kì í ṣe “nínú mi.”
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ ní μέρος pẹ̀lú Jésù
  choice: “ìpín pẹ̀lú mi,” èyí tó fi ìkópa àti ìbáṣepọ̀ pẹ̀lú Jésù hàn láìsọ bí èyí ṣe ń ṣiṣẹ́ nípa ẹ̀kọ́ ìgbàlà tàbí àṣà ìsìn kan pàtó
  alternative: “apá pẹ̀lú mi,” tàbí ìtumọ̀ tó sọ ọ́ di ìtọ́kasí pàtó sí ìwẹ̀nùmọ́ sacramenti, iṣẹ́ ìrẹ̀lẹ̀, tàbí ìgbàlà
  rationale: Gíríìkì sọ pé fífọ̀ Jésù ṣe pàtàkì kí Pétérù lè ní μέρος pẹ̀lú rẹ̀, ṣùgbọ́n kò ṣàlàyé ọ̀nà ẹ̀kọ́ ìsìn pàtó tí èyí gbà ṣẹlẹ̀. “Ìpín” jẹ́ kí ìdíwọ̀n àti ìjìnlẹ̀ ọ̀rọ̀ náà wà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn. A lo “fọ ẹsẹ̀” fún νίπτω nínú àyíká fífọ ẹsẹ̀, àti “fọ̀ ọ́” nígbà tí ohun tí a ń fọ yí padà sí gbogbo ẹni náà gẹ́gẹ́ bí Gíríìkì σε ṣe sọ.
