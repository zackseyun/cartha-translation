    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβλεπον
  choice: ń wo
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìṣe tí ó ń lọ lọ́wọ́ hàn; “ń wo” mú ìtumọ̀ yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: εἰς ἀλλήλους
  choice: ara wọn
  rationale: Ó fi hàn pé àwọn ọmọ-ẹ̀yìn náà ń wo ẹnì kejì wọn; “wo ara wọn” ni gbólóhùn Yorùbá tó ṣe kedere.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Àmì ìsọ̀rí Gíríìkì náà tọ́ka sí ẹgbẹ́ tí a ti mọ̀ nínú àyíká ọ̀rọ̀; kò pọndandan láti fi “rẹ̀” kún un.
- source_word: ἀπορούμενοι
  choice: ẹnu sì yà wọ́n, wọn kò mọ
  rationale: Apá ọ̀rọ̀ náà túmọ̀ sí pé wọ́n dààmú, ọ̀rọ̀ sì rú wọn lójú; àsọyé yìí jẹ́ ti Yorùbá àdánidá, ó sì bá ìbéèrè tí ó tẹ̀ lé mu.
- source_word: περὶ τίνος
  choice: ẹni tí ... nípa rẹ̀
  rationale: Ó tọ́ka sí ẹni tí Jésù ń sọ̀rọ̀ nípa rẹ̀, láì sọ ẹni náà di mímọ̀.
- source_word: λέγει
  choice: ó ń sọ̀rọ̀
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀-ìṣe náà mọ́, kò sì tú u sí “ó ní lọ́kàn,” èyí tí yóò jẹ́ àlàyé ju ohun tí Gíríìkì sọ lọ.
