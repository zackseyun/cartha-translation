source:
  edition: SBLGNT
  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: yo
  text: Nítorí náà, Símónì Peteru fi àmì sí ọmọ-ẹ̀yìn náà pé kí ó béèrè pé ẹni tí Jésù ń sọ̀rọ̀ nípa rẹ̀ jẹ́ ta ni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ìṣètò Gíríìkì: “Nítorí náà, Símónì Peteru fi àmì sí i kí ó béèrè ẹni tí ó lè jẹ́ ẹni tí Jésù ń sọ̀rọ̀ nípa rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεύει
  choice: juwọ́ sí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àmì ara hàn láìsọ̀rọ̀; ‘juwọ́ sí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan fi ọwọ́ tàbí ara ṣe àmì sí ẹlòmíràn, láìfi dandan sọ pé ó kan kọ́rí.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe Peteru mọ́ ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ gẹ́gẹ́ bí àbájáde tàbí ìtẹ̀síwájú ìtàn.
- source_word: τούτῳ
  choice: sí ọmọ-ẹ̀yìn náà
  rationale: Aṣàyàn yìí mú ẹni tí ọ̀rọ̀ arọ́pò-atọ́ka náà ń tọ́ka sí ṣe kedere láti inú àyíká ẹsẹ tó ṣáájú, nígbà tí ‘náà’ ṣì pa agbára atọ́ka rẹ̀ mọ́.
- source_word: πυθέσθαι
  choice: pé kí ó béèrè
  rationale: Infinitive náà sọ ohun tí Peteru fẹ́ kí ọmọ-ẹ̀yìn náà ṣe; èdè yìí ṣe kedere, ó sì jẹ́ ti Yorùbá àdánidá.
- source_word: τίς ἂν εἴη
  choice: ẹni tí ó ṣeé ṣe kí ...
  rationale: Ìkọ̀lé ἄν pẹ̀lú optative fi àìdánilójú tàbí ìṣiyèméjì hàn; ‘ó ṣeé ṣe’ pa ìtumọ̀ ‘might be’ yẹn mọ́.
- source_word: περὶ οὗ
  choice: nípa rẹ̀
  rationale: Ó túmọ̀ sí ‘nípa ẹni tí’; ‘nípa rẹ̀’ bá ìlò Yorùbá mu nígbà tí ẹni náà ti fara hàn nínú ìkọ̀lé gbolohun.
- source_word: λέγει
  choice: Jésù máa sọ̀rọ̀
  rationale: Present tense inú ìtàn ni a ṣe ní ọ̀nà tó ń fi ìṣe tó ń lọ hàn. Fífi ‘Jésù’ sí i mú olùsọ̀rọ̀ ṣe kedere ní Yorùbá, láìyí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí padà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo ‘juwọ́ sí’ fún ìbánisọ̀rọ̀ aláìlẹ́nu, a sì pa ìṣiyèméjì τίς ἂν εἴη mọ́ pẹ̀lú ‘ó ṣeé ṣe’. Orúkọ ‘Jésù’ ni a fi rọ́pò arọ́pò-orúkọ tí ó lè rú ìdàrúdàpọ̀ ní Yorùbá.
