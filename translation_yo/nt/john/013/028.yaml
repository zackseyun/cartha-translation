  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: yo
  text: Ṣùgbọ́n, kò sí ẹnì kan nínú àwọn tí wọ́n jókòó níbi oúnjẹ náà tí ó mọ ìdí tí ó fi sọ èyí fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ títẹ̀lé ọ̀rọ̀ Gíríìkì síi, “fún ète wo ni ó fi sọ èyí fún un?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ; “èyí” pa agbára atọ́ka rẹ̀ mọ́ ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ kékeré hàn láàárín ohun tí Jésù sọ àti àìmọ̀ àwọn tó wà níbi oúnjẹ.
- source_word: οὐδεὶς
  choice: kò sí ẹnì kan
  rationale: Ó sọ àìsí ẹnikẹ́ni pátápátá, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἔγνω
  choice: mọ
  rationale: Nínú àyíká yìí, γινώσκω túmọ̀ sí pé wọn kò mọ tàbí lóye ìdí ọ̀rọ̀ náà; “mọ” pa ìtumọ̀ gbòòrò náà mọ́ láìfi àlàyé kún un.
- source_word: τῶν ἀνακειμένων
  choice: nínú àwọn tí wọ́n jókòó síbi oúnjẹ náà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí wọ́n rọ̀gbọ̀kú níbi oúnjẹ gẹ́gẹ́ bí àṣà ìgbà náà. Yorùbá òde òní máa ń sọ pé wọ́n jókòó síbi oúnjẹ; èyí mú ìṣẹ̀lẹ̀ náà yé ni láìjẹ́ kí ìṣètò ara wọn di kókó.
- source_word: πρὸς τί
  choice: ìdí tí
  rationale: Gbólóhùn náà béèrè ète tàbí ìdí; “ìdí tí” jẹ́ ọ̀nà àdánidá jù lọ ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó ṣe déédé hàn.
- source_word: εἶπεν αὐτῷ
  choice: ó fi sọ èyí fún un
  rationale: “sọ … fún un” ni ìbámu Yorùbá tó ṣe kedere fún εἶπεν αὐτῷ; ṣíṣe àtúnṣe “èyí” mú ohun tí τοῦτο tọ́ka sí hàn kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. “Wọ́n jókòó síbi oúnjẹ” ni a lò dípò àpèjúwe àṣà pé wọ́n rọ̀gbọ̀kú, nítorí ó jẹ́ Yorùbá àdánidá tí ó sì pa àyíká àsè mọ́.
