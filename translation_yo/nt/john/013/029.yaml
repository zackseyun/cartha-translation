id: JHN.13.29
reference: John 13:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: yo
  text: Nítorí àwọn kan rò pé, níwọ̀n bí Júdásì ti ní àpótí owó náà[a] lọ́wọ́, Jésù ń sọ fún un pé, “Ra ohun tí a nílò fún àjọ̀dún náà[b],” tàbí pé kí ó fún àwọn òtòṣì ní ohun kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àpò owó.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun èlò tí wọ́n fi ń pa owó ẹgbẹ́ náà mọ́.
    reason: lexical_alternative
  - marker: b
    text: ‘Àjọ̀dún náà’ ń tọ́ka sí àjọ̀dún Ìrékọjá ní àyíká apá yìí.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: àwọn kan
  rationale: Ó tọ́ka sí díẹ̀ lára àwọn tí ó wà níbẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘some’ ní Yorùbá.
- source_word: ἐδόκουν
  choice: rò pé
  rationale: Ó sọ ohun tí àwọn kan gbà pé ó ń ṣẹlẹ̀; ọ̀rọ̀ yìí ṣe kedere, kò sì fi ìdánilójú kún ohun tí Gíríìkì sọ.
- source_word: ἐπεὶ
  choice: níwọ̀n bí ... ti
  rationale: Ó fi ìdí tí wọ́n fi rò bẹ́ẹ̀ hàn, ó sì bá ìṣètò gbólóhùn Yorùbá mu dáadáa.
- source_word: γλωσσόκομον
  choice: àpótí owó
  rationale: Ó túmọ̀ sí ohun èlò tí wọ́n fi ń pa owó ẹgbẹ́ mọ́; ‘àpótí owó’ ṣe kedere láì sọ pàtó ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: εἶχεν
  choice: wà lọ́wọ́
  rationale: Ní àyíká yìí, gbólóhùn náà túmọ̀ sí pé Júdásì ló ní àpótí náà ní ìkáwọ́ rẹ̀; ‘wà lọ́wọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti sọ èyí.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésù ń sọ fún un
  rationale: Ó mú ìtumọ̀ àsìkò ìtàn náà jáde ní Yorùbá, ó sì bá ohun tí àwọn ọmọ-ẹ̀yìn rò pé Jésù ń sọ mu.
- source_word: Ἀγόρασον
  choice: Ra
  rationale: Àṣẹ tààrà àti ti òde òní ni, tó sì bá aorist imperative mu.
- source_word: ὧν χρείαν ἔχομεν
  choice: ohun tí a nílò
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá àdánidá fún ohun gbogbo tí wọ́n nílò, láì mú ọ̀rọ̀ náà le.
- source_word: εἰς τὴν ἑορτήν
  choice: fún àjọ̀dún náà
  rationale: ἑορτή jẹ́ àjọ̀dún ẹ̀sìn; ‘àjọ̀dún’ pa ìtumọ̀ náà mọ́ láì fi ‘Ìrékọjá’ sínú ẹsẹ yìí níbi tí a kò ti tún dárúkọ rẹ̀.
- source_word: τοῖς πτωχοῖς
  choice: àwọn òtòṣì
  rationale: Ó tọ́ka sí àwọn ènìyàn tí wọ́n jẹ́ tálákà; ‘àwọn òtòṣì’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ní iyì.
- source_word: ἵνα τι δῷ
  choice: kí ó fún ... ní ohun kan
  rationale: Ó pa ìṣe tí àwọn ọmọ-ẹ̀yìn rò pé Jésù fẹ́ kí Júdásì ṣe mọ́, ó sì jẹ́ ìṣètò Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá tó ṣe déédé, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. Gbólóhùn ‘wà lọ́wọ́ Júdásì’ fi ìkáwọ́ àpótí owó hàn láì fi èrò míì kún ọ̀rọ̀ Gíríìkì. Gbogbo àmì ohùn ni a lò níbi tí ó bá ṣe àdánidá.
