  to: Nítorí àwọn kan rò pé, níwọ̀n bí Júdásì ti ní àpótí owó náà[a] lọ́wọ́, Jésù ń sọ fún un pé, “Ra ohun tí a nílò fún àjọ̀dún náà[b],” tàbí pé kí ó fún àwọn òtòṣì ní ohun kan.
