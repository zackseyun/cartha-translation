id: JHN.13.10
reference: John 13:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Ẹni tí ó ti wẹ̀ tán kò nílò láti wẹ̀ mọ́, àfi láti fọ ẹsẹ̀ rẹ̀; ṣùgbọ́n ó mọ́ pátápátá. Ẹ̀yin náà mọ́, ṣùgbọ́n kì í ṣe gbogbo yín.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: Ẹni tí ó ti wẹ̀ tán
  rationale: Ọ̀rọ̀ yìí jẹ́ participle perfect ti λούω, ó sì ń tọ́ka sí ẹni tí ó ti wẹ gbogbo ara, tí ipò ìmọ́tótó náà sì ṣì wà. “ti wẹ̀ tán” mú ìṣe tí a ti parí àti ìyàtọ̀ sí fífọ ẹsẹ̀ hàn.
- source_word: οὐκ ἔχει χρείαν
  choice: kò nílò
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti kedere láti sọ pé kò sí ohun tí ó tún ṣe pàtàkì fún un.
- source_word: εἰ μὴ
  choice: nìkan
  rationale: Nínú gbolohun yìí, εἰ μὴ fi ohun kan ṣoṣo tí ó yà sílẹ̀ hàn; lílo “nìkan” pẹ̀lú infinitive náà jẹ́ àdánidá ní Yorùbá.
- source_word: τοὺς πόδας νίψασθαι
  choice: láti wẹ ẹsẹ̀ rẹ̀
  rationale: νίπτω sábà máa ń tọ́ka sí fífọ apá kan ara. “ẹsẹ̀ rẹ̀” mú olùtọ́ka ẹyọ kan inú participle náà ṣe kedere ní Yorùbá.
- source_word: καθαρὸς ὅλος
  choice: gbogbo ara rẹ̀ mọ́
  rationale: Èyí ṣetọju agbára ὅλος, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tí gbogbo ara rẹ̀ mọ́, láìpa ìtumọ̀ ẹ̀mí tí ọ̀rọ̀ “mọ́” tún lè gbé run.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: Ẹ̀yin náà mọ́
  rationale: “Ẹ̀yin” fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀, “mọ́” sì tún ọ̀rọ̀ καθαρός ṣe, kí àwòrán ìwẹ̀ àti ìtumọ̀ àmì rẹ̀ lè dúró.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: ṣùgbọ́n kì í ṣe gbogbo yín
  rationale: Èyí fi hàn gbangba pé àyọkúrò kan wà láàárín àwọn tí Jésù ń bá sọ̀rọ̀, láìsọ ẹni náà ní pàtó.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé λέγει jẹ́ historical present, àkókò àtẹ̀yìnwá ni Yorùbá sábà máa ń lò nínú ìtàn irú èyí; “sọ fún un pé” sì jẹ́ àdánidá.
theological_decisions:
- issue: Ìwẹ̀ ara gangan àti ìmọ́tótó ti ẹ̀mí tí ó wà ní abẹ́ ọ̀rọ̀ náà
  choice: A pa “wẹ̀ tán,” “wẹ ẹsẹ̀,” àti “mọ́” mọ́ láìṣàlàyé àmì ẹ̀mí náà nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàfikún “mọ́ nípa ẹ̀mí,” tàbí tú λούω àti νίπτω méjèèjì sí ọ̀rọ̀ kan náà láìfi ìyàtọ̀ hàn.
  rationale: Ẹsẹ yìí ṣiṣẹ́ ní ìpele ìwẹ̀ ara gangan àti ní ìpele àmì. Pípa àwọn ọ̀rọ̀ ìwẹ̀ náà yàtọ̀ àti lílo “mọ́” jẹ́ kí ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà dúró láìfi ẹ̀kọ́ ìjọ kan lé e lórí.
- issue: Participle akọ ẹyọ kan tí ó ní ìtumọ̀ gbogbogbò
  choice: Ẹni tí ó ti wẹ̀ tán
  alternative: Ọkùnrin tí ó ti wẹ̀ tán
  rationale: Bí fọ́ọ̀mù Gíríìkì ṣe jẹ́ akọ ẹyọ kan, ọ̀rọ̀ òwe gbogbogbò ni ó ń ṣe. “Ẹni” pa ẹyọ kan mọ́, kò sì fi akọ kún ìtumọ̀ níbi tí kò ti ṣe pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, àdánidá, tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “Ẹ̀yin” láti jẹ́ kí ọ̀pọ̀ ènìyàn inú ὑμεῖς ṣe kedere, a sì pa àwòrán ìwẹ̀ àti ìmọ́tótó mọ́.
