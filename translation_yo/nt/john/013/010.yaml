  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ pàtàkì tó wà láàárín λούω, ìwẹ̀ gbogbo ara, àti νίπτω, ìfọ̀ apá kan ara, mọ́ ní èrò; síbẹ̀, “nìkan” nínú ọ̀rọ̀ pàtàkì kò fi εἰ μὴ (“àfi/ayàfi”) hàn dáadáa. Ó lè dà bí ẹni pé a ń sọ pé ẹni náà nílò láti wẹ ẹsẹ̀ rẹ̀ nìkan. Àtúnṣe náà mú àyọkúrò náà hàn kedere, ó sì yà “wẹ̀” sí “fọ” gẹ́gẹ́ bí Gíríìkì ṣe yà wọ́n.
  naturalness: “Kò nílò láti wẹ̀ mọ́, àfi láti fọ ẹsẹ̀ rẹ̀” jẹ́ Yorùbá boṣewa tó rọrùn, tó sì dá ìtumọ̀ gbolohun náà dúró. “Ó mọ́ pátápátá” jẹ́ ọ̀nà àdánidá láti sọ καθαρὸς ὅλος láìfi “ara” kún un, níbi tí Gíríìkì kò ti sọ ara ní kedere.
