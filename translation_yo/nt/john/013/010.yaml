  to: Jésù sọ fún un pé, “Ẹni tí ó ti wẹ̀ tán kò nílò láti wẹ̀ mọ́, àfi láti fọ ẹsẹ̀ rẹ̀; ṣùgbọ́n ó mọ́ pátápátá. Ẹ̀yin náà mọ́, ṣùgbọ́n kì í ṣe gbogbo yín.”
