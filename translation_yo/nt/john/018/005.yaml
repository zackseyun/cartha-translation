  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé SBLGNT ní gbogbogbòò: àwọn ènìyàn náà dá Jésù lóhùn, Jésù dá wọn lóhùn, Júdásì sì wà pẹ̀lú wọn. Ṣùgbọ́n “fi í lé wọn lọ́wọ́” ń dá bí pé Júdásì ń fi Jésù lé àwọn ènìyàn náà lọ́wọ́ ní àkókò gangan náà; παραδιδοὺς jẹ́ participle tí ó lè túmọ̀ sí “ẹni tí yóò fi í lé wọn lọ́wọ́,” ó sì dara láti ṣàfihàn ipa ìtàn náà láìsọ ìṣe náà di ìṣe tí ó ń ṣẹlẹ̀ ní ìṣẹ́jú náà. “Èmi ni ẹni náà” jẹ́ ìtumọ̀ àyíká tí ó yẹ fún Ἐγώ εἰμι, bí ó tilẹ̀ jẹ́ pé ó ṣàfikún ẹni náà fún ìrọ̀rùn Yorùbá.'
