  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: yo
  text: Wọ́n dá a lóhùn pé, “Jésù ará Násárẹ́tì.” Ó sọ fún wọn pé, “Èmi ni ẹni náà.” Júdásì, ẹni tí yóò fi í lé wọn lọ́wọ́, náà sì dúró pẹ̀lú wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jésù ará Násárẹ́tì
  rationale: Ìtumọ̀ àdánidá ní Yorùbá fún ẹni tí ó wá láti Násárẹ́tì; ó dá ìdánimọ̀ tí àwọn olùdáhùn sọ mú.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni ẹni náà
  rationale: Nínú ìjíròrò yìí, ọ̀rọ̀ náà jẹ́ ìdáhùn sí ẹni tí wọ́n ń wá. Àfikún “ẹni náà” jẹ́ ohun tí gírámà Yorùbá nílò láti sọ ìtumọ̀ ọ̀rọ̀ náà ní kedere, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: ẹni tí ó ń fi í lé wọn lọ́wọ́
  rationale: Ó mú ìṣe tí ó ń lọ lọ́wọ́ nínú participle Gíríìkì hàn, ó sì tọ́ka sí ìfini-lé-àwọn-ọ̀tá-lọ́wọ́ ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: dúró pẹ̀lú wọn
  rationale: Ó pa ìtumọ̀ pé Júdásì wà ní ìdúró ní ẹgbẹ́ àwọn tí wọ́n wá mú Jésù mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ἐγώ εἰμι
  choice: Èmi ni ẹni náà
  alternative: Èmi ni
  rationale: “Èmi ni ẹni náà” bá ìbéèrè àti ìdáhùn inú ọ̀rọ̀ yìí mu, ó sì tẹ̀ lé ìtumọ̀ ìdánimọ̀ ẹni tí wọ́n ń wá. A kò lo “Èmi ni” nìkan, nítorí pé ó lè dà bí gbólóhùn tí kò pé ní Yorùbá tàbí kí ó fi tipátipá mú ìtọ́kasí ẹ̀kọ́ ìgbàgbọ́ kan wọ inú ẹsẹ yìí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ọ̀rọ̀ náà tẹ̀ lé ìtòlẹ́sẹẹsẹ àti ìyípadà ìṣe inú orísun Gíríìkì láìjẹ́ kí Yorùbá rẹ̀ le.
