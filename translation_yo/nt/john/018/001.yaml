id: JHN.18.1
reference: John 18:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: yo
  text: Lẹ́yìn tí Jésù ti sọ nǹkan wọ̀nyí, ó jáde pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀, ó sì kọjá sí òdìkejì odò Kídírónì[a]. Ọgbà kan wà níbẹ̀, ó sì wọ inú rẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kọjá sí ìhà kejì ìṣàn omi Kídírónì,” tàbí, “kọjá sí ìhà kejì àfonífojì Kídírónì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìṣàn omi tí omi sábà máa ń ṣàn sí ní àkókò òjò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Lẹ́yìn tí Jésù sọ nǹkan wọ̀nyí
  rationale: A ṣe àpólà aláìlèsọ aorist náà bí gbólóhùn àsìkò láti fi hàn pé ìjáde Jésù ṣẹlẹ̀ lẹ́yìn ọ̀rọ̀ tí ó ṣẹ̀ṣẹ̀ sọ; èyí jẹ́ Yorùbá àdánidá.
- source_word: ἐξῆλθεν
  choice: ó jáde
  rationale: Èyí pa ìtumọ̀ ìṣípòpadà gidi ti ọ̀rọ̀ náà mọ́, láìsọ ọ́ di ‘ó kúrò’ lásán.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Pẹ̀lú’ fi ìbákẹ́gbẹ́ tí σύν pẹ̀lú dative ń tọ́ka sí hàn ní Yorùbá tí ó ṣe kedere.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: sí òdìkejì àfonífojì Kídírónì[a]
  rationale: ‘Sí òdìkejì’ fi ìṣípò kọjá sí apá kejì hàn. ‘Àfonífojì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣeé lóye fún ibi tí ìṣàn omi àsìkò lè máa gba kọjá; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ pàtó ti χείμαρρος mọ́.
- source_word: ὅπου ἦν κῆπος
  choice: Ọgbà kan wà níbẹ̀
  rationale: Ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára existential ti ἦν àti ìtumọ̀ κῆπος mọ́.
- source_word: εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: òun àti àwọn ọmọ-ẹ̀yìn rẹ̀ sì wọ inú rẹ̀
  rationale: ‘Wọ inú rẹ̀’ fi ìtọ́sọ́nà εἰς hàn, ‘òun’ sì dúró fún αὐτός láìfi ìtẹnumọ́ tí kò pọndandan kún un.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pín gbólóhùn Gíríìkì gígùn náà sí gbólóhùn méjì fún àlàyé kedere, láìyí ìtẹ̀lé ìṣẹ̀lẹ̀ tàbí ìtumọ̀ rẹ̀ padà. Orúkọ Κεδρών ni a kọ sí ‘Kídírónì’ gẹ́gẹ́ bí ìró Yorùbá.
