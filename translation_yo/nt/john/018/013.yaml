  terminology: ‘Mú un lọ,’ ‘sọ́dọ̀,’ ‘olórí àlùfáà,’ àti àwọn orúkọ Ánásì/Káyáfà bá ọ̀rọ̀ ìtàn náà mu. ‘Baba aya Káyáfà’ ni ọ̀rọ̀ tó péye fún πενθερός nínú àyíká yìí.
