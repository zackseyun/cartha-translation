id: JHN.18.13
reference: John 18:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: yo
  text: Wọ́n sì kọ́kọ́ mú un lọ sọ́dọ̀ Ánásì, nítorí pé ó jẹ́ baba aya Káyáfà, ẹni tí ó jẹ́ olórí àlùfáà ní ọdún náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: wọ́n mú un lọ
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘darí’ tàbí ‘mú ... lọ.’ Nínú ọ̀rọ̀ nípa mímú Jésù, ‘wọ́n mú un lọ’ jẹ́ Yorùbá àdánidá tí ó fi hàn pé ó wà lábẹ́ àṣẹ àwọn tó mú un.
- source_word: πρὸς Ἅνναν
  choice: sọ́dọ̀ Ánásì
  rationale: πρός pẹ̀lú accusative fi ìlọ sí ọ̀dọ̀ ènìyàn hàn; ‘sọ́dọ̀ Ánásì’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ní àkọ́kọ́ nínú ìtẹ̀lé àwọn ìṣẹ̀lẹ̀.
- source_word: πενθερὸς
  choice: baba ìyàwó
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ pàtó sí baba aya ọkùnrin kan; ‘baba ìyàwó’ ṣe ìbátan náà kedere ní Yorùbá.
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ipò àlùfáà tó ga jù lọ láàárín àwọn Júù.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ní ọdún náà
  rationale: Ó pa àmì àkókò tí Jòhánù sọ mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: Ἅνναν
  choice: Ánásì
  rationale: A ṣàkọlé orúkọ ẹni náà sí ìrísí tó bá èdè Yorùbá mu, a kò túmọ̀ rẹ̀.
- source_word: Καϊάφα
  choice: Káyáfà
  rationale: A ṣàkọlé orúkọ ẹni náà sí ìrísí tó wọ́pọ̀, tó sì rọrùn fún olùkà Yorùbá.
theological_decisions:
- issue: Ẹni tí gbólóhùn ‘ẹni tí ó jẹ́ olórí àlùfáà ní ọdún náà’ ń tọ́ka sí
  choice: Káyáfà
  alternative: Ánásì
  rationale: Nínú Gíríìkì, ọ̀rọ̀ arọ́pò-orúkọ ὃς ń tọ́ka lọ́nà tó ṣe kedere jù lọ sí orúkọ tó sún mọ́ ọn, Καϊάφα. Fífi ‘ẹni tí’ sílé lẹ́yìn Káyáfà mú ìtọ́kasí náà kedere láì dá ìṣiyèméjì tuntun sílẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘mú un lọ’ dípò ìtumọ̀ líle bí ‘darí rẹ̀’ nítorí ipò ìmúsílẹ̀ náà, a sì fi àmi ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
