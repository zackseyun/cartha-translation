revisions:
- from: Nígbà tí ó sì ti sọ nǹkan wọ̀nyí, ọ̀kan lára àwọn ẹ̀ṣọ́[b] tí ó dúró níbẹ̀ gbá Jésù[a], ó ní, “Ṣé báyìí ni o ṣe ń dá olórí àlùfáà lóhùn?”
  to: Nígbà tí ó sì ti sọ nǹkan wọ̀nyí, ọ̀kan lára àwọn ẹ̀ṣọ́[b] tí ó dúró níbẹ̀ lù Jésù[a], ó ní, “Ṣé báyìí ni o ṣe ń dá Àlùfáà Àgbà náà lóhùn?”
  rationale: The revision replaces an unclear strike verb with “lù,” which faithfully reports the physical blow without deciding whether it was specifically a slap or another hand-blow; that lexical range remains in footnote a. It also uses the conventional, precise title “Àlùfáà Àgbà” for the high priest. The footnote anchors are retained and placed with the words they explain.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:34Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal clause, narrative connective, rebuke, and the sense of an official present at the hearing are substantially represented. However, “gbá Jésù” is not a clear, standard rendering of ἔδωκεν ῥάπισμα in this context; “lù Jésù” directly and naturally conveys that he struck Jesus. “Àlùfáà Àgbà” is the established Yoruba designation for the singular high priest (ἀρχιερεύς).
  naturalness: The revised wording is fluent Standard Yoruba. It retains the appropriately forceful rebuke, “Ṣé báyìí ni o ṣe ń dá ... lóhùn?” and avoids the ambiguity of “gbá” without a further complement.
  terminology: “Àwọn ẹ̀ṣọ́” is acceptable for the official ὑπηρέται in this judicial setting, while its lexical breadth is retained in a footnote. “Àlùfáà Àgbà náà” accurately identifies the high priest as a recognized office, rather than merely describing him as a priestly leader.
  issues:
  - severity: medium
    issue: The verb “gbá” is unclear/inadequate here for the blow administered to Jesus.
    rationale: In ordinary Standard Yoruba, “gbá” has several common senses and does not by itself reliably communicate striking a person. The Greek idiom unmistakably reports a physical blow. “Lù Jésù” is clear while not over-specifying the precise form of the strike.
  - severity: low
    issue: “Olórí àlùfáà” is less idiomatic and less terminologically precise than the conventional title for the high priest.
    rationale: “Àlùfáà Àgbà” is the normal Yoruba biblical title for the singular high priest and preserves the office denoted by ἀρχιερεύς.
  revised_text: Nígbà tí ó sì ti sọ nǹkan wọ̀nyí, ọ̀kan lára àwọn ẹ̀ṣọ́[b] tí ó dúró níbẹ̀ lù Jésù[a], ó ní, “Ṣé báyìí ni o ṣe ń dá Àlùfáà Àgbà náà lóhùn?”
