id: JHN.18.22
reference: John 18:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: yo
  text: Nígbà tí ó sì ti sọ nǹkan wọ̀nyí, ọ̀kan lára àwọn ẹ̀ṣọ́[b] tí ó dúró níbẹ̀ lù Jésù[a], ó ní, “Ṣé báyìí ni o ṣe ń dá Àlùfáà Àgbà náà lóhùn?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ìfọwọ́lù tàbí ìlù; ó lè jẹ́ gbígbá ní ẹ̀rẹ̀kẹ́ tàbí irú ìlù míì.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ẹ̀ṣọ́” túmọ̀ ọ̀rọ̀ kan tí ó tún lè túmọ̀ sí àwọn olùrànlọ́wọ́ tàbí ìránṣẹ́; níhìn-ín ó ṣeé ṣe kí ó tọ́ka sí àwọn òṣìṣẹ́ aláṣẹ tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó pa nọ́ńbà púpọ̀ inú Gíríìkì mọ́, ó sì tọ́ka sí àwọn ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ ìtàn pẹ̀lẹ́ ni; “sì” jẹ́ ọ̀nà àdánidá láti tẹ ìtàn náà síwájú láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: αὐτοῦ εἰπόντος
  choice: nígbà tí ó ti sọ
  rationale: Ó tú genitive absolute àti aorist participle sí gbólóhùn àkókò Yorùbá, ó sì fi hàn pé ọ̀rọ̀ Jésù ṣáájú ìgbésẹ̀ tó tẹ̀ lé e.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: ọ̀kan lára àwọn ẹ̀ṣọ́ tí ó dúró níbẹ̀
  rationale: “Ẹ̀ṣọ́” bá iṣẹ́ àwọn òṣìṣẹ́ aláṣẹ ní àyíká ìdájọ́ yìí mu, nígbà tí “tí ó dúró níbẹ̀” pa ìtumọ̀ παρεστηκώς mọ́.
- source_word: ἔδωκεν ῥάπισμα
  choice: gbá
  rationale: “Gbá” lè túmọ̀ sí lílù tàbí lílù ní ẹ̀rẹ̀kẹ́, nítorí náà ó pa àyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láìfi “pẹ̀lú ọwọ́” kún ohun tí a kọ.
- source_word: τῷ Ἰησοῦ
  choice: Jésù
  rationale: Orúkọ ẹni tí wọ́n lù ni, a sì fi sí ipò object tí ó bá gírámà Yorùbá mu.
- source_word: εἰπών
  choice: ó ní
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ọ̀rọ̀ tààrà tó tẹ̀ lé participle náà.
- source_word: Οὕτως
  choice: Ṣé báyìí ni
  rationale: Ó tọ́ka sí ọ̀nà tí Jésù gbà dáhùn, ó sì pa agbára ìbéèrè ìbáwí náà mọ́.
- source_word: ἀποκρίνῃ
  choice: o ṣe ń dá ... lóhùn
  rationale: Ó tú ìṣe dídá ẹnì kan lóhùn ní Yorùbá àdánidá, pẹ̀lú ìmọ̀lára ìbáwí tó wà nínú ìbéèrè náà.
- source_word: τῷ ἀρχιερεῖ
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àlùfáà tó ga jù lọ ní ipò yìí.
theological_decisions:
- issue: Ìdánimọ̀ àwọn ὑπηρέται
  choice: àwọn ẹ̀ṣọ́, ìyẹn àwọn òṣìṣẹ́ aláṣẹ tó wà lẹ́gbẹ̀ẹ́ àwọn olórí àlùfáà
  alternative: àwọn ìránṣẹ́ tàbí àwọn olùrànlọ́wọ́
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ gbòòrò, ṣùgbọ́n ní àyíká ìdájọ́ Jésù nínú Jòhánù, ó ṣeé ṣe jù pé ó ń tọ́ka sí àwọn òṣìṣẹ́ aláṣẹ tẹ́ńpìlì; àlàyé ìsàlẹ̀ ṣì pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “Ṣé báyìí ni...” fún ìbéèrè ìbáwí àdánidá, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹ̀gbẹ́ kan pàtó.
