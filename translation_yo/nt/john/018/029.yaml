id: JHN.18.29
reference: John 18:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: yo
  text: Nítorí náà, Pílátù jáde lọ bá wọn, ó sì wí pé, “Ẹ̀sùn wo ni ẹ mú wá lòdì sí ọkùnrin yìí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: jáde lọ
  rationale: Àpapọ̀ ọ̀rọ̀-ìṣe àti ọ̀rọ̀-àfikún náà tẹnumọ́ ìṣípò láti inú ilé sí òde; “jáde lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ méjèèjì hàn láìsọ ọ̀rọ̀ kan náà lẹ́ẹ̀mejì.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìgbésẹ̀ Pílátù mọ́ ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì lè tọ́ka sí àbájáde tàbí ìtẹ̀síwájú ìtàn.
- source_word: πρὸς αὐτούς
  choice: lọ bá wọn
  rationale: πρός pẹ̀lú accusative tọ́ka sí lílọ sí ọ̀dọ̀ àwọn ènìyàn fún ìpàdé; “lọ bá wọn” jẹ́ èdè Yorùbá tó ṣe déédé.
- source_word: φησίν
  choice: ó sì wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Greek lo historical present, Yorùbá ìtàn àdánidá gba ọ̀nà àsìkò tí ó ti kọjá; “wí pé” ní ìyì, ó sì ṣe kedere.
- source_word: Τίνα κατηγορίαν
  choice: Ẹ̀sùn wo
  rationale: κατηγορία jẹ́ ẹ̀sùn tàbí ẹ̀sùn òfin; “ẹ̀sùn” mú ìtumọ̀ ìdájọ́ náà jáde ní kedere.
- source_word: φέρετε
  choice: ni ẹ mú wá
  rationale: Nínú ọ̀rọ̀ òfin, φέρω túmọ̀ sí mímú tàbí fífi ẹ̀sùn kalẹ̀; “mú wá” pa àwòrán ìṣe orísun mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κατὰ
  choice: lòdì sí
  rationale: κατά pẹ̀lú genitive nínú àyíká ìdájọ́ túmọ̀ sí “lòdì sí.”
- source_word: τοῦ ἀνθρώπου τούτου
  choice: ọkùnrin yìí
  rationale: ἄνθρωπος níbí tọ́ka sí ọkùnrin kan pàtó, kì í ṣe gbogbo aráyé; “ọkùnrin yìí” pa ìtọ́kasí akọ mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ní ibi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún ìtàn ìdájọ́. A lo “ó sì wí pé” dípò ọ̀rọ̀ àsọyé tí ó le koko, àti “ẹ̀sùn” fún ìtumọ̀ òfin tó ṣe kedere.
