id: JHN.18.28
reference: John 18:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: yo
  text: Nítorí náà, wọ́n mú Jésù kúrò lọ́dọ̀ Káyáfà lọ sí ilé ìjọba gómìnà[a]. Ó jẹ́ kùtùkùtù òwúrọ̀. Àwọn fúnra wọn kò wọ inú ilé ìjọba náà, kí wọ́n má bàa di aláìmọ́ ní ti àṣà ìsìn[b], ṣùgbọ́n kí wọ́n lè jẹ oúnjẹ Ìrékọjá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Piretóríọ̀mù,” ìyẹn ibùgbé gómìnà Róòmù àti ibi iṣẹ́ ìjọba àti ìdájọ́ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Di aláìmọ́” ń tọ́ka sí dídi aláìmọ́ ní ti àṣà ìsìn.
    reason: cultural_note
  - marker: c
    text: “Jẹ oúnjẹ Ìrékọjá” lè tọ́ka sí àsè Ìrékọjá pàtó, tàbí, ní ìtumọ̀ fífẹ̀, sí àwọn oúnjẹ àti àṣà ayẹyẹ ní àsìkò Àjọ̀dún Ìrékọjá.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: wọ́n mú ... lọ
  rationale: Ọ̀rọ̀-ìṣe ìsinsìnyí inú ìtàn ni Gíríìkì; a túmọ̀ rẹ̀ sí ìṣe àtijọ́ ní Yorùbá kí ìtàn lè ṣàn lọ́nà àdánidá, nígbà tí ‘mú ... lọ’ sì fi hàn pé Jésù wà lábẹ́ àkóso wọn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ìtàn hàn.
- source_word: πραιτώριον
  choice: ilé ìjọba gómìnà
  rationale: Ó tọ́ka sí ibùgbé ìjọba àti ibi ìdájọ́ aṣojú Róòmù; gbolohun yìí ṣe kedere sí òǹkàwé Yorùbá ju kíkàn ṣe àfàyàtọ orúkọ náà lọ.
- source_word: πρωΐ
  choice: kùtùkùtù òwúrọ̀
  rationale: Ó sọ apá ìbẹ̀rẹ̀ ọjọ́, láìfi dandan mú un pé àkókò ìlà-oòrùn gan-an ni.
- source_word: αὐτοὶ
  choice: Àwọn fúnra wọn
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ó sì fi ìyàtọ̀ hàn láàárín fífi Jésù lé gómìnà lọ́wọ́ àti kíkọ̀ wọn láti wọlé.
- source_word: εἰσῆλθον
  choice: kò wọ inú
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìwọlé sí ilé mu.
- source_word: μιανθῶσιν
  choice: di aláìmọ́ nípa àṣà ìsìn
  rationale: Ó fi hàn pé àìmọ́ ti àṣà ìsìn ni a ń sọ, kì í ṣe ìdọ̀tí ara lasan.
- source_word: φάγωσιν τὸ πάσχα
  choice: jẹ oúnjẹ Ìrékọjá
  rationale: Ó pa èrò jíjẹ mọ́, ó sì yẹra fún pípinnu bóyá oúnjẹ Ìrékọjá pàtó ni tàbí àwọn oúnjẹ ayẹyẹ tó ní í ṣe pẹ̀lú Àjọ̀dún Ìrékọjá.
- source_word: Καϊάφα
  choice: Káyáfà
  rationale: A ṣe àfàyàtọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìpè Yorùbá.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: A lo ìrísí orúkọ tí ó ti wọ́pọ̀, tí àwọn òǹkàwé Yorùbá sì mọ̀.
theological_decisions:
- issue: Ìtumọ̀ ‘jẹ Ìrékọjá’ àti ìṣírò àkókò Ìjìyà Jésù nínú Jòhánù
  choice: jẹ oúnjẹ Ìrékọjá
  alternative: jẹ àsè Ìrékọjá pàtó; jẹ àwọn oúnjẹ ayẹyẹ ní àsìkò Ìrékọjá
  rationale: Ọ̀rọ̀ Gíríìkì kò dá irú oúnjẹ náà pàtó nínú ẹsẹ yìí. Ìtumọ̀ náà àti àlàyé ìsàlẹ̀ ojú ewé pa àìdánilójú yìí mọ́, wọn kò sì fi tipátipá yanjú ìbéèrè nípa bí Jòhánù ṣe ṣètò ọjọ́ àwọn ìṣẹ̀lẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, kedere, àti ti òde òní. “Ilé ìjọba gómìnà” ṣàlàyé ibi náà láìlo ọ̀rọ̀ àjèjì nínú àyọkà pàtàkì; àfàyàtọ náà wà ní àlàyé ìsàlẹ̀ ojú ewé. Gbólóhùn “nípa àṣà ìsìn” yà àìmọ́ ìlànà ìsìn sọ́tọ̀ kúrò nínú ìdọ̀tí ara.
