base_translation:
  language: en
  yaml_path: translation/nt/john/018/027.yaml
  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: yo
  text: Nígbà náà, Peteru tún sẹ́; àkùkọ sì kọ lẹ́sẹ̀kẹsẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì kò sọ ohun tí Peteru sẹ́ ní tààrà; àyíká ọ̀rọ̀ fi hàn pé ó ń dáhùn sí ìbéèrè tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ọ̀rọ̀-ìṣe-àpèjúwe yìí fi hàn pé Peteru tún ṣe ohun kan náà; “tún” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe ṣókí.
- source_word: οὖν
  choice: Nígbà náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ìbéèrè tó ṣáájú, ó sì mú ìtàn lọ síwájú láìfi agbára ìtumọ̀ ‘nítorí náà’ kún un.
- source_word: ἠρνήσατο
  choice: sẹ́ ẹ
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé Peteru kọ ohun tí wọ́n ṣẹ̀ṣẹ̀ béèrè lọ́wọ́ rẹ̀. Yorùbá àdánidá máa ń fi arọ́pò-orúkọ ohun “ẹ” kún un, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ohun tí ó sẹ́ ní tààrà.
- source_word: Πέτρος
  choice: Peteru
  rationale: Èyí ni ìkọ̀wé orúkọ Peter tó wọ́pọ̀ nínú Yorùbá.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ìsẹ̀lẹ̀ kejì mọ́ ti àkọ́kọ́ lọ́nà ìtàn Yorùbá tó rọrùn.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: 'Ó pa ìsúnmọ́ àkókò mọ́: àkùkọ kọ ní kété tí Peteru sẹ́.'
- source_word: ἀλέκτωρ
  choice: àkùkọ
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere fún adìẹ akọ tí ń kọ.
- source_word: ἐφώνησεν
  choice: kọ
  rationale: Nígbà tí àkùkọ jẹ́ olùṣe, “kọ” ni ọ̀rọ̀ Yorùbá àdánidá fún ohùn tí ó pa.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere ni a lò. A fi àmì ohùn sí ibi tó yẹ. Gbólóhùn náà pa ìṣísẹ̀ ìtàn àti ìsẹ̀lẹ̀ tó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ mọ́, ó sì fi àìsọ ohun tí ἠρνήσατο tọ́ka sí hàn nínú àlàyé ìsàlẹ̀.
