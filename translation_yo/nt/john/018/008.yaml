source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: yo
  text: Jésù dáhùn pé, “Mo ti sọ fún yín pé, èmi ni ẹni náà.[a] Nítorí náà, bí ẹ̀yin bá ń wá mi, ẹ jẹ́ kí àwọn wọ̀nyí lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ṣókí, “Èmi ni.” Èdè Gíríìkì kò fi “ẹni náà” kún un; àyíká ọ̀rọ̀ fi hàn pé Jésù ni ẹni tí wọ́n ń wá.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan dáhùn nínú ìjíròrò; ‘pé’ sì ṣí ọ̀rọ̀ tí ó tẹ̀ lé e.
- source_word: Εἶπον ὑμῖν
  choice: Mo ti sọ fún yín
  rationale: Ìṣe náà tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ tẹ́lẹ̀; ‘ti sọ fún yín’ jẹ́ Yorùbá àdánidá tí ó mú ìránnilétí yẹn hàn.
- source_word: ἐγώ εἰμι
  choice: èmi ni ẹni náà
  rationale: Nínú ọ̀rọ̀ ìdánimọ̀ yìí, gbólóhùn náà túmọ̀ sí pé Jésù ni ẹni tí wọ́n ń wá. ‘Èmi ni ẹni náà’ ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gígùn-kúkúrú ‘Èmi ni’ mọ́.
- source_word: ζητεῖτε
  choice: bá ń wá
  rationale: Ìṣẹ̀lẹ̀ náà ń lọ lọ́wọ́ ní àsìkò yẹn, ‘bá ń wá’ sì fi ìṣe tí ó ń tẹ̀ síwájú hàn lọ́nà àdánidá.
- source_word: ἄφετε
  choice: ẹ jẹ́ kí
  rationale: Àṣẹ yìí túmọ̀ sí fífàyè gba wọn láti lọ; ‘ẹ jẹ́ kí’ kò fi ìtumọ̀ àfikún bí ‘tú sílẹ̀’ kún ọ̀rọ̀ náà.
- source_word: τούτους
  choice: àwọn wọ̀nyí
  rationale: Atọ́ka náà ń tọ́ka sí àwọn tí ó wà pẹ̀lú Jésù, ‘àwọn wọ̀nyí’ sì jẹ́ kedere láì fi akọ tàbí ìdánimọ̀ mìíràn kún orísun.
- source_word: ὑπάγειν
  choice: lọ
  rationale: ‘Lọ’ jẹ́ ìtumọ̀ kúkúrú, àdánidá fún fífàyè gba àwọn ẹni náà láti kúrò.
theological_decisions:
- issue: Ìtumọ̀ ἐγώ εἰμι nínú àyíká Ìhìn Rere Jòhánù
  choice: èmi ni ẹni náà
  alternative: Èmi ni
  rationale: Àyíká ìmú Jésù fi hàn pé ó ń dáhùn ìbéèrè nípa ẹni tí wọ́n ń wá, nítorí náà ‘èmi ni ẹni náà’ mú ìtumọ̀ ojú-ẹsẹ̀ yẹn hàn. Síbẹ̀, ‘Èmi ni’ lè gbé ìró ẹ̀kọ́ nípa Ọlọ́run nínú lílo Jòhánù, nítorí náà a pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀rọ̀ àdánidá, ọlọ́lá, tí òǹkàwé òde òní lè lóye. A lo ‘ẹ̀yin’ àti ‘ẹ’ fún ọ̀pọ̀ ènìyàn; a kò fi akọ kún τούτους nítorí Yorùbá kò nílò rẹ̀.
