id: JHN.18.33
reference: John 18:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: yo
  text: Nítorí náà, Pílátù tún wọ inú ibùdó gómìnà[a], ó sì pe Jésù, ó wí fún un pé, “Ṣé ìwọ ni Ọba àwọn Júù[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pírétóríọ̀mù,” ìyẹn ilé ìbùgbé tàbí ibùdó iṣẹ́ ìjọba ti gómìnà Róòmù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn Júù lápapọ̀ tàbí, ní àwọn àyíká kan, sí àwọn ènìyàn ilẹ̀ Jùdíà.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν … πάλιν
  choice: tún wọ inú
  rationale: Àkójọpọ̀ yìí fi hàn pé Pílátù padà wọ ibi náà; “tún wọ inú” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìpadà wọlé mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì lè fi ìtẹ̀síwájú tàbí àbájáde ìtàn hàn.
- source_word: πραιτώριον
  choice: ibùdó gómìnà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ilé tàbí ibùdó iṣẹ́ ìjọba ti gómìnà Róòmù; yíyan yìí ṣe kedere sí òǹkàwé òde òní láì lo ọ̀rọ̀ àjèjì tí kò mọ̀ọ́mọ̀.
- source_word: ἐφώνησεν
  choice: pe
  rationale: Nínú àyíká yìí, φωνέω túmọ̀ sí pé ó pe ẹni náà wá; “pe” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye.
- source_word: εἶπεν αὐτῷ
  choice: ó wí fún un pé
  rationale: Ìtumọ̀ yìí tẹ̀lé λέγω gẹ́gẹ́ bí “sọ/wí,” dípò ṣíṣe é ní “béèrè,” bí ó tilẹ̀ jẹ́ pé gbólóhùn tó tẹ̀ lé jẹ́ ìbéèrè.
- source_word: Σὺ εἶ
  choice: Ṣé ìwọ ni
  rationale: “Ìwọ” pa ìtẹnumọ́ arọ́pò-orúkọ σύ mọ́, “ṣé … ni” sì jẹ́ ọ̀nà àdánidá láti béèrè ìbéèrè ìdánimọ̀ ní Yorùbá.
- source_word: ὁ βασιλεὺς
  choice: Ọba
  rationale: Ó jẹ́ àkọlé ìdánimọ̀ nínú ìbéèrè náà; lẹ́tà ńlá bá ìlò àkọlé mu láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú ẹ̀sùn ìṣèlú tí a gbé wá síwájú Pílátù, “àwọn Júù” ni ìtumọ̀ tó bá àyíká àti àkọlé ọba náà mu jù; “àwọn ará Jùdíà” ṣì ṣeé ṣe nípa ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú àkọlé ọba
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Àyíká ìdájọ́ Róòmù ń fi ẹ̀sùn náà hàn gẹ́gẹ́ bí “Ọba àwọn Júù.” Síbẹ̀, nítorí Ἰουδαῖοι lè ní ìtumọ̀ ilẹ̀ tàbí ẹ̀yà-ẹ̀sìn ní àwọn àyíká kan, a pa àṣàyàn “àwọn ará Jùdíà” mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì fi “Ṣé ìwọ ni” mú ìbéèrè taara àti ìtẹnumọ́ σύ jáde.
