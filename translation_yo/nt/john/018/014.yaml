id: JHN.18.14
reference: John 18:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: yo
  text: Káyáfà sì ni ẹni tí ó ti gba àwọn Júù[a] nímọ̀ràn pé ó sàn kí ọkùnrin kan kú fún àwọn ènìyàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn olórí Júù” tàbí “àwọn ará Jùdíà,” gẹ́gẹ́ bí ìtumọ̀ tí ọ̀rọ̀ náà lè ní nínú àyíká ìwé Jòhánù.
    reason: alternative_reading
  - marker: b
    text: Tàbí “fún àǹfààní àwọn ènìyàn” tàbí “nítorí àwọn ènìyàn”; nínú àyíká yìí, ó tún lè ní ìró ṣíṣe aṣojú fún wọn tàbí ìrúbọ fún wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: sì ni
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò fi ìtakora líle hàn; “sì ni” ń so gbólóhùn náà mọ́ ohun tó ṣáájú lọ́nà àdánidá láìfi ọ̀rọ̀ àsìkò kún un.
- source_word: Καϊάφας
  choice: Káyáfà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: ὁ συμβουλεύσας
  choice: ẹni tí ó ti gba … nímọ̀ràn
  rationale: Ọ̀rọ̀ alábápín aorist tó ní article ń dá Káyáfà mọ̀ nípasẹ̀ ìṣe tó ti ṣe ṣáájú; “tí ó ti gba … nímọ̀ràn” fi ìṣe àtijọ́ yẹn hàn ní Yorùbá àdánidá.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù
  rationale: Èdè Gíríìkì sọ “àwọn Júù” láìfi ọ̀rọ̀ mìíràn dín àwọn tí ó ń tọ́ka sí kù; a pa àìmọ̀ pàtó yẹn mọ́, a sì fi àwọn ìtumọ̀ tó ṣeé ṣe sí àlàyé ìsàlẹ̀.
- source_word: ὅτι συμφέρει
  choice: pé ó sàn
  rationale: συμφέρει túmọ̀ sí ohun tó ṣàǹfààní tàbí tó dára jù; “ó sàn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ ìmọ̀ràn mu.
- source_word: ἕνα ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Ó pa iye ẹyọ kan àti ìtọ́kasí akọ mọ́, níwọ̀n bí ọ̀rọ̀ náà ṣe ń tọ́ka sí Jésù.
- source_word: ἀποθανεῖν
  choice: kú
  rationale: Èyí ni ìtumọ̀ tààrà fún infinitive náà nínú gbólóhùn yìí.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: fún àwọn ènìyàn
  rationale: “Fún” lè fi àǹfààní tàbí ṣíṣe ní ipò àwọn ẹlòmíràn hàn láìdá ìtumọ̀ náà mọ́ ẹ̀kọ́ ìrúbọ tàbí àrọ́pò ní pàtó.
- source_word: λαοῦ
  choice: àwọn ènìyàn
  rationale: λαός túmọ̀ sí “àwọn ènìyàn”; kì í ṣe ἔθνος, “orílẹ̀-èdè,” tí a lò nínú ọ̀rọ̀ tó gbooro ní Jòhánù 11:50.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìràpadà tàbí àrọ́pò tó lè wà nínú ὑπὲρ τοῦ λαοῦ
  choice: fún àwọn ènìyàn
  alternative: ní ipò àwọn ènìyàn; nítorí àwọn ènìyàn
  rationale: ὑπέρ lè túmọ̀ sí fún àǹfààní wọn tàbí ní ipò wọn, ó sì lè ní ìró ìrúbọ nínú àyíká ìtàn Jòhánù. Ọ̀rọ̀ pàtàkì náà pa ìtumọ̀ náà sílẹ̀ láìfi ẹ̀kọ́ pàtó kan mú un.
- issue: Àwọn tí τοῖς Ἰουδαίοις ń tọ́ka sí nínú ìwé Jòhánù
  choice: àwọn Júù
  alternative: àwọn olórí Júù; àwọn ará Jùdíà
  rationale: Orísun náà kò fi ọ̀rọ̀ kankan kún un láti dín ìtọ́kasí rẹ̀ kù. Nítorí náà, a pa ìtumọ̀ gbooro mọ́ nínú ọ̀rọ̀ pàtàkì, a sì sọ àwọn ọ̀nà míì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọlọ́wọ̀, tó sì ṣeé yé fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan tàbí ìtumọ̀ tó ń yanju àìmọ̀ pàtó inú orísun.
