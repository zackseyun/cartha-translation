id: JHN.18.38
reference: John 18:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: yo
  text: Pílátù wí fún un pé, “Kí ni òtítọ́?” Lẹ́yìn tí ó sọ èyí, ó tún jáde lọ sọ́dọ̀ àwọn Júù[a], ó sì wí fún wọn pé, “Èmi kò rí ìdí kankan láti fi ẹ̀sùn kàn án.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aṣáájú Júù.” Nínú ìwé Jòhánù, “àwọn Júù” lè tọ́ka nígbà mìíràn sí àwọn aláṣẹ Jùdíà tàbí ẹgbẹ́ aṣojú tí wọ́n ń tako Jésù nínú àyíká ọ̀rọ̀ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Pílátù wí fún un pé
  rationale: A tú ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí inú ìtàn (λέγει) sí ‘wí’ gẹ́gẹ́ bí ìṣe tó ti ṣẹlẹ̀, èyí sì bá ìròyìn Yorùbá mu.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Kí ni òtítọ́?
  rationale: ‘Òtítọ́’ tú ἀλήθεια ní ọ̀nà tààrà, kò sì fi ohun tí àpilẹ̀kọ kan lè túmọ̀ sí kún ọ̀rọ̀ Gíríìkì náà.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Lẹ́yìn tí ó sọ èyí
  rationale: Ó fi hàn ní kedere pé ọ̀rọ̀ tí Pílátù sọ ṣáájú ìjáde rẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους
  choice: ó tún jáde lọ sọ́dọ̀ àwọn Júù[a]
  rationale: ‘Tún’ pa ìtumọ̀ πάλιν mọ́; ‘jáde lọ sọ́dọ̀’ sì fi ìṣípò kúrò nínú ilé lọ sí ọ̀dọ̀ ẹgbẹ́ tó wà lóde hàn. Àkọ́kọ́ ọ̀rọ̀ ‘àwọn Júù’ ni a pa mọ́, pẹ̀lú àlàyé ní ìsàlẹ̀.
- source_word: καὶ λέγει αὐτοῖς
  choice: ó sì wí fún wọn pé
  rationale: A tún tú λέγει gẹ́gẹ́ bí ọ̀rọ̀ ìṣe inú ìtàn tó ti ṣẹlẹ̀, ní èdè Yorùbá tó rọrùn.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Èmi kò rí ìdí kankan láti fi ẹ̀sùn kàn án
  rationale: Nínú ọ̀rọ̀ ilé ẹjọ́, αἰτία ń tọ́ka sí ìdí tàbí ẹ̀sùn tí a lè fi kan ẹni, kì í ṣe àṣìṣe ìwà lásán. Fífi ‘Èmi’ síwájú tún pa ìtẹnumọ́ Ἐγώ mọ́.
theological_decisions:
- issue: Ẹni tí τοὺς Ἰουδαίους ń tọ́ka sí nínú ìtàn ìjìyà Jésù
  choice: A lo ‘àwọn Júù’ nínú ẹsẹ̀, a sì fi àlàyé pé ó lè túmọ̀ sí ‘àwọn aṣáájú Júù.’
  alternative: àwọn aṣáájú Júù; àwọn ará Jùdíà
  rationale: ‘Àwọn Júù’ tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí àwọn aláṣẹ tàbí aṣojú ẹgbẹ́ tó ń tako Jésù, kì í ṣe gbogbo Júù láìyàtọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ọ̀rọ̀ ilé ẹjọ́ tó ṣe kedere láì sọ αἰτία di àṣìṣe ìwà lásán.
