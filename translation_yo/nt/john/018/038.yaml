  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé Gíríìkì dáadáa: ‘Kí ni òtítọ́?’ ń pa àìsí àfikún ‘náà’ mọ́; ‘Lẹ́yìn tí ó sọ èyí’ ń ṣàfihàn participle aorist náà; ‘ó tún jáde lọ sọ́dọ̀’ ń mú πάλιν ἐξῆλθεν πρὸς wá ní ti ìtàn; ‘Èmi kò rí ìdí kankan láti fi ẹ̀sùn kàn án’ sì ń sọ αἰτία ní ìtumọ̀ ìlànà-ẹjọ́, kì í ṣe ìwà-àìtọ́ lásán. Ìtẹnumọ́ ‘Èmi’ jẹ́ ìbámu tó yẹ pẹ̀lú Ἐγώ.'
  naturalness: Yorùbá náà rọrùn, ó sì jẹ́ ti ìgbàlódé pẹ̀lú ìwọ̀n ìbòwọ̀ tó yẹ fún ìtàn náà. Àmì ohùn àti ìkọ̀wé orúkọ Pílátù, Júù, Jùdíà, àti Jésù wà ní ipò tó dáa. Gbólóhùn ìkẹyìn jẹ́ ọ̀nà àdánidá láti sọ pé kò sí ìpìlẹ̀ ẹ̀sùn sí ẹni náà.
  terminology: ‘Òtítọ́’ jẹ́ ìtumọ̀ tó pé fún ἀλήθεια. ‘Àwọn Júù’ ń pa ọ̀rọ̀ Gíríìkì τοὺς Ἰουδαίους mọ́ ní ọ̀rọ̀ àkọ́kọ́, nígbà tí ìsàlẹ̀-ìwé ń fi àyíká rẹ̀ hàn láì sọ pé gbogbo àwọn Júù ni a ń tọ́ka sí. ‘Ẹ̀sùn’ àti ‘ìdí ... láti fi ẹ̀sùn kàn’ dáa fún àyíká ilé-ẹjọ́.
