id: JHN.18.20
reference: John 18:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: yo
  text: Jésù dá a lóhùn pé, “Mo ti sọ̀rọ̀ sí ayé ní gbangba. Nígbà gbogbo ni mo máa ń kọ́ni nínú sínágọ́gù àti ní àgbègbè tẹ́ńpìlì[a], níbi tí gbogbo àwọn Júù[b] ti máa ń péjọ; èmi kò sì sọ ohunkóhun ní ìkọ̀kọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní tẹ́ńpìlì” tàbí “ní àwọn àgbàlá tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì ἱερόν tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “gbogbo àwọn ènìyàn Júù”; ní àwọn àyíká kan nínú Jòhánù, ó tún lè jẹ́ “gbogbo àwọn ará Jùdíà.” Ìtumọ̀ ọ̀rọ̀ Gíríìkì Ἰουδαῖοι sinmi lórí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: ní gbangba
  rationale: Ó bá ìyàtọ̀ tí ọ̀rọ̀ náà ní sí ἐν κρυπτῷ (‘ní ìkọ̀kọ̀’) mu, ó sì fi hàn pé ọ̀rọ̀ Jésù jẹ́ ti gbangba, kì í ṣe pé ó fi í pamọ́.
- source_word: λελάληκα
  choice: Mo ti bá ... sọ̀rọ̀
  rationale: Àkókò perfect nínú Gíríìkì tọ́ka sí ọ̀rọ̀ tí Jésù ti sọ tẹ́lẹ̀ tí ó sì ṣì ṣe pàtàkì ní àkókò ìdáhùn yìí; ‘Mo ti ... sọ̀rọ̀’ mú èyí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τῷ κόσμῳ
  choice: bá ayé
  rationale: ‘Ayé’ pa àṣà ọ̀rọ̀ κόσμος nínú Jòhánù mọ́, ó sì lè tọ́ka sí àwọn ènìyàn ní gbangba láì dín ìtumọ̀ rẹ̀ kù sí ‘àwọn ará ìlú’ nìkan.
- source_word: πάντοτε ἐδίδαξα
  choice: Nígbà gbogbo ni mo máa ń kọ́ni
  rationale: Ọ̀rọ̀ yìí sọ pé kíkọ́ni ní gbangba jẹ́ ìṣe Jésù déédéé; ìṣètò ‘ni ... máa ń’ jẹ́ ti Yorùbá àdánidá, ó sì pa agbára πάντοτε mọ́.
- source_word: ἐν συναγωγῇ
  choice: nínú sínágọ́gù
  rationale: Ẹyọ ọ̀rọ̀ singular náà lè jẹ́ ti gbogbogbò fún ibi ìjọsìn àti ìkọ́ni àwọn Júù; ‘nínú sínágọ́gù’ jẹ́ kíkójú àti yéye.
- source_word: ἐν τῷ ἱερῷ
  choice: ní àgbègbè tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí gbogbo àgbègbè ilé tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; ‘àgbègbè tẹ́ńpìlì’ dènà àìgbọ́ye yẹn.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: gbogbo àwọn Júù
  rationale: Nínú ọ̀rọ̀ yìí, ibi sínágọ́gù àti tẹ́ńpìlì fi hàn pé ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí àwọn Júù gẹ́gẹ́ bí àwùjọ ẹ̀sìn àti ẹ̀yà, kì í ṣe àwọn olórí wọn nìkan.
- source_word: συνέρχονται
  choice: máa ń péjọ
  rationale: Ó sọ ìpéjọpọ̀ àwùjọ ní ọ̀nà Yorùbá tí ó wọ́pọ̀, ó sì bá àkókò habitual ti àyíká ọ̀rọ̀ mu.
- source_word: ἐν κρυπτῷ ἐλάλησα οὐδέν
  choice: èmi kò sì sọ ohunkóhun ní ìkọ̀kọ̀
  rationale: Ó pa ìtẹnumọ́ ‘ohunkóhun’ mọ́, ó sì mú ìtakora tó wà láàárín ọ̀rọ̀ gbangba àti ọ̀rọ̀ ìkọ̀kọ̀ hàn kedere.
- source_word: ἀπεκρίθη αὐτῷ
  choice: Jésù dá a lóhùn
  rationale: Èyí ni ọ̀nà ìtàn àdánidá ní Yorùbá fún ‘ó dá a lóhùn,’ láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; àwọn ènìyàn Júù
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ tó yàtọ̀ síra gẹ́gẹ́ bí àyíká rẹ̀ nínú Jòhánù. Níhìn-ín, sínágọ́gù àti tẹ́ńpìlì tọ́ka sí àwùjọ àwọn Júù lápapọ̀; bí ó tilẹ̀ rí bẹ́ẹ̀, àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì tó ṣeé ṣe mọ́, láì fi èrò òdì sí àwọn Júù sínú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Sínágọ́gù’ àti ‘tẹ́ńpìlì’ jẹ́ àwọn ọ̀rọ̀ tí àwọn òǹkàwé Bíbélì mọ̀, nígbà tí ‘ní gbangba’ àti ‘ní ìkọ̀kọ̀’ mú ìtakora inú ẹsẹ náà hàn lọ́nà tó rọrùn. A gbé àmì ìsàlẹ̀ [a] sí ‘tẹ́ńpìlì’ àti [b] sí ‘àwọn Júù,’ nítorí ibẹ̀ ni àwọn àlàyé náà ti jẹ mọ́.
