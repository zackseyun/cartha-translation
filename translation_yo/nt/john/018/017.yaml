id: JHN.18.17
reference: John 18:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: yo
  text: Nígbà náà, ọmọbìnrin ìránṣẹ́ náà[a] tí ń ṣọ́ ẹnu-ọ̀nà sọ fún Peteru pé, “Ìwọ náà kì í ṣe ọ̀kan lára àwọn ọmọ ẹ̀yìn ọkùnrin yìí, àbí?” Ó sọ pé, “Èmi kọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọbìnrin ẹrú tó jẹ́ olùṣọ́ ẹnu-ọ̀nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ àti ìtẹ̀síwájú ìtàn mọ́; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu ní àyíká yìí.
- source_word: παιδίσκη
  choice: ọmọbìnrin ìránṣẹ́
  rationale: Ó fi hàn pé obìnrin kékeré kan tó ń ṣiṣẹ́ ìránṣẹ́ ni; ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí ọmọbìnrin ẹrú, èyí tí àlàyé ìsàlẹ̀ fi pamọ́.
- source_word: θυρωρός
  choice: tí ń ṣọ́ ẹnu ọ̀nà
  rationale: Gbólóhùn yìí ṣàlàyé iṣẹ́ rẹ̀ gẹ́gẹ́ bí ẹni tó ń bójú tó ẹnu ọ̀nà ní Yorùbá àdánidá.
- source_word: Μὴ καὶ σὺ
  choice: Ìwọ náà kì í ṣe ... àbí?
  rationale: Ìbéèrè yìí ń retí ìdáhùn òdì; ìlànà ‘kì í ṣe ... àbí?’ mú ìrètí yẹn jáde lọ́nà Yorùbá àdánidá.
- source_word: ἐκ τῶν μαθητῶν
  choice: ọ̀kan lára àwọn ọmọ ẹ̀yìn
  rationale: Ó pa ìtumọ̀ jíjẹ́ ara ẹgbẹ́ kan mọ́ ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: ọkùnrin yìí
  rationale: Ó túmọ̀ ἄνθρωπος gẹ́gẹ́ bí ọkùnrin lasán, kì í ṣe oyè, ó sì pa ìjìnnà inú ọ̀rọ̀ τούτου mọ́.
- source_word: ἐκεῖνος
  choice: Ó
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí Peteru; arọ́pò-orúkọ ni Yorùbá àdánidá ń lò.
- source_word: Οὐκ εἰμί
  choice: Èmi kọ́
  rationale: Ó jẹ́ ìkọ̀sílẹ̀ kúkúrú, tààrà, tó bá àkótán ọ̀rọ̀ Gíríìkì mu láìfi àfikún sí i.
theological_decisions:
- issue: Agbára ìbéèrè òdì tí μή ṣí sílẹ̀
  choice: “Ìwọ náà kì í ṣe ... àbí?” gẹ́gẹ́ bí ìbéèrè tó ń retí ìdáhùn òdì
  alternative: Ìbéèrè pẹlẹbẹ bí “Ṣé ìwọ náà jẹ́ ...?”
  rationale: Ìtumọ̀ yìí pa ìtọ́kasí gírámà àti ọ̀nà tí ìkọ̀ Peteru gbà wá mọ́, láìṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
- issue: Ìtumọ̀ ipò àwùjọ nínú παιδίσκη
  choice: “ọmọbìnrin ìránṣẹ́” nínú ọ̀rọ̀ pàtàkì
  alternative: “ọmọbìnrin ẹrú”
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú obìnrin; nínú ìṣẹ̀lẹ̀ yìí, ọjọ́-orí, akọ-n-bábo, àti iṣẹ́ rẹ̀ ló hàn gbangba jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní; a lo àmi ohùn ní kíkún níbi tó bá yẹ. Ìbéèrè náà jẹ́ ti èdè ojoojúmọ́ ṣùgbọ́n ó ṣì ní ọlá, ìdáhùn Peteru sì dúró ní kúkúrú bí ti orísun.
