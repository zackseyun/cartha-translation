  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìlànà náà ‘wọ́n dá a lóhùn, wọ́n sì wí’ mọ́, ó sì túmọ̀ κακὸν ποιῶν gẹ́gẹ́ bí ṣíṣe ohun búburú, kì í ṣe ẹ̀sùn òfin pàtó. Síbẹ̀, ‘kì í bá ṣe’ kò dára fún ipò àròsọ ìlòdìsí-òtítọ́ yìí; ‘kò bá ṣe’ ni ìkọ́lé Yorùbá boṣewa tó yẹ.'
