source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: yo
  text: Wọ́n dá a lóhùn, wọ́n sì wí fún un pé, “Bí ọkùnrin yìí kò bá ṣe ohun búburú[a], àwa kì bá tí fi í lé ọ lọ́wọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́ ẹni burúkú.”
    reason: Gbólóhùn Gíríìkì náà lè jẹ́ àfihàn ìṣe búburú tàbí àpèjúwe ẹni náà gẹ́gẹ́ bí ẹni burúkú.
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Wọ́n dá a lóhùn, wọ́n sì wí fún un pé
  rationale: Ó pa ìlànà ọ̀rọ̀ ìtàn aláìlẹ́gbẹ́ náà mọ́ nípa fífi àwọn ọ̀rọ̀ ìṣe méjèèjì hàn, bó tilẹ̀ jẹ́ pé èdè Yorùbá lè sọ ọ́ ní kúkúrú sí i.
- source_word: Εἰ μὴ ἦν
  choice: Bí ... kì í bá
  rationale: Ìkọ́lé yìí fi ipò àròsọ tí ó lòdì sí ohun tí àwọn olùfisùn ń sọ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: οὗτος
  choice: ọkùnrin yìí
  rationale: Ó tọ́ka sí Jésù ní ọ̀nà jíjìnnà bí ọ̀rọ̀ Gíríìkì ṣe rí, láìfi ẹ̀gàn tí kò sí nínú rẹ̀ kún un.
- source_word: κακὸν ποιῶν
  choice: ṣe ohun búburú
  rationale: Ó pa agbára ọ̀rọ̀ ìṣe ποιῶν (‘ṣe’) àti ìtumọ̀ ìwà búburú ti κακόν mọ́, láìsọ ọ́ di ẹ̀sùn òfin pàtó.
- source_word: οὐκ ἄν ... παρεδώκαμεν
  choice: àwa kì bá tí fi í lé ... lọ́wọ́
  rationale: Ó fi àbájáde ipò àròsọ tí kò ṣẹlẹ̀ hàn, ó sì mú ìtumọ̀ fífi ẹnì kan lé aláṣẹ lọ́wọ́ jáde ní kedere.
- source_word: σοι ... αὐτόν
  choice: fi í lé ọ lọ́wọ́
  rationale: Àwọn arọ́pò-orúkọ náà tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí wọ́n fi lé Pílátù lọ́wọ́.
theological_decisions:
- issue: Irú ẹ̀sùn tí àwọn olùfisùn fi kan Jésù
  choice: ṣe ohun búburú
  alternative: jẹ́ ẹni burúkú
  rationale: κακὸν ποιῶν jẹ́ gbólóhùn tó túmọ̀ sí ṣíṣe ohun búburú, kì í ṣe orúkọ ìdájọ́ òfin pàtó. Àyànfẹ́ yìí pa ẹ̀sùn gbogbogbò àti àìsọ pàtó wọn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye ni a lò. “Wí fún un” ń pa ìrísí ọ̀rọ̀ ìtàn náà mọ́, nígbà tí “fi í lé ọ lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ẹni kan lé aláṣẹ lọ́wọ́.
