id: JHN.18.18
reference: John 18:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: yo
  text: Àwọn ẹrú[a] àti àwọn òṣìṣẹ́[b] dúró níbẹ̀, wọ́n ti dá iná èédú sílẹ̀ nítorí òtútù mú, wọ́n sì ń yáná. Pétérù pẹ̀lú dúró pẹ̀lú wọn, ó sì ń yáná.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ẹni tí wọ́n jẹ́ ohun ìní tàbí tí wọ́n wà lábẹ́ ìdè iṣẹ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn olùṣọ́.” Àwọn òṣìṣẹ́ àṣẹ ni ọ̀rọ̀ náà ń tọ́ka sí, ó ṣeé ṣe kí wọ́n jẹ́ ti tẹ́ńpìlì tàbí ti ilé olórí àlùfáà.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: àwọn ẹrú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú; ‘ẹrú’ pa ipò ìdè ẹni tó ṣeé ṣe kí àwọn òṣìṣẹ́ ilé olórí àlùfáà ní mọ́, láìfi ìtumọ̀ náà pamọ́.
- source_word: ὑπηρέται
  choice: àwọn òṣìṣẹ́
  rationale: Ní inú Jòhánù, ọ̀rọ̀ náà sábà ń tọ́ka sí àwọn tó ń ṣiṣẹ́ fún àṣẹ, pàápàá àwọn tó ní iṣẹ́ ìmúṣẹ àṣẹ. ‘Àwọn òṣìṣẹ́’ jẹ́ èdè àdánidá, ẹsẹ̀ ìsàlẹ̀ sì ṣàlàyé ipa wọn.
- source_word: ἀνθρακιὰν
  choice: iná ẹ̀yín
  rationale: Ó tọ́ka pàtó sí iná tí a fi ẹ̀yín dá; àlàyé yìí tún ṣe pàtàkì nínú ìtàn Jòhánù.
- source_word: πεποιηκότες
  choice: wọ́n ti dá ... sílẹ̀
  rationale: Èyí fi hàn pé wọ́n ti dá iná náà, àbájáde iṣẹ́ náà sì ṣì wà nígbà tí ìṣẹ̀lẹ̀ náà ń lọ.
- source_word: ὅτι ψῦχος ἦν
  choice: nítorí òtútù mú
  rationale: Ó pa ìtumọ̀ ìdí mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ojú ọjọ́ tutù.
- source_word: ἐθερμαίνοντο
  choice: wọ́n sì ń yáná
  rationale: ‘Ń yáná’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígbóná ara lẹ́gbẹ̀ẹ́ iná, àmì ‘ń’ sì pa ìṣe tó ń bá a lọ mọ́.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: Pétérù pẹ̀lú dúró láàárín wọn
  rationale: ‘Pẹ̀lú’ pa agbára àfikún καί mọ́; ‘láàárín wọn’ fi hàn pé Pétérù wà pẹ̀lú ẹgbẹ́ náà, ‘dúró’ sì sọ ìdúró rẹ̀ ní kedere.
- source_word: θερμαινόμενος
  choice: ó sì ń yáná
  rationale: Ó fara wé ìṣe ẹgbẹ́ náà, ó sì pa ìṣe tí Pétérù ń ṣe lọ́wọ́ mọ́.
- source_word: δέ
  choice: àti / sì gẹ́gẹ́ bí àsopọ̀ inú gbólóhùn
  rationale: A kò fi ‘nísinsìnyí’ sí ìbẹ̀rẹ̀ nítorí δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ níbí, kì í ṣe ọ̀rọ̀ àkókò.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘yáná’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, a sì pa àmì ohùn mọ́ níbi tí ó yẹ.
