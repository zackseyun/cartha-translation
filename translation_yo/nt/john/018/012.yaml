id: JHN.18.12
reference: John 18:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: yo
  text: Nítorí náà, ẹgbẹ́ ọmọ ogun náà, ọ̀gágun náà àti àwọn ẹ̀ṣọ́ àwọn Júù[a] mú Jésù, wọ́n sì dè é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ ‘àwọn olórí Júù’ tàbí ‘àwọn ará Jùdíà,’ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí; ní ọ̀pọ̀ ìgbà, Jòhánù máa ń lo ‘àwọn Júù’ fún ẹgbẹ́ kan pàtó dípò gbogbo àwọn Júù.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì pa agbára ìtẹ̀síwájú tàbí àbájáde ọ̀rọ̀ Gíríìkì mọ́.
- source_word: σπεῖρα
  choice: ẹgbẹ́ ọmọ ogun
  rationale: Ó fi ìtumọ̀ ẹgbẹ́ ológun hàn ní èdè tí òǹkàwé Yorùbá òde òní lè lóye, láì fi ‘Róòmù’ kún ohun tí ọ̀rọ̀ náà kò sọ ní tààrà.
- source_word: χιλίαρχος
  choice: ọ̀gágun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí olórí ọmọ ogun; ‘ọ̀gágun’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ìtàn ọlọ́lá.
- source_word: ὑπηρέται
  choice: àwọn ẹ̀ṣọ́
  rationale: Nínú àyíká ìwé Jòhánù, àwọn wọ̀nyí jẹ́ òṣìṣẹ́ aláṣẹ tó ń mú ènìyàn, kì í ṣe ìránṣẹ́ ilé; ‘àwọn ẹ̀ṣọ́’ fi ipa wọn hàn láì sọ pé ọlọ́pàá tẹ́ńpìlì ni wọ́n.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó tẹ̀ lé gbólóhùn Gíríìkì ní kíkún, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa àwọn ìtumọ̀ tó lè dín ìtọ́kasí náà kù mọ́.
- source_word: συνέλαβον
  choice: mú
  rationale: Nínú àyíká yìí, ‘mú’ túmọ̀ sí dí Jesu mú tàbí gbá a mú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìgbésẹ̀ náà ní Yorùbá.
- source_word: ἔδησαν
  choice: dè
  rationale: Ó túmọ̀ ìṣe dídè ènìyàn ní ṣókí, ní tààrà, àti ní èdè ìtàn tó ní iyì.
theological_decisions:
- issue: Ohun tí τῶν Ἰουδαίων ń tọ́ka sí nínú Jòhánù
  choice: A túmọ̀ ọ́ ní tààrà sí ‘àwọn Júù’ nínú ẹsẹ̀.
  alternative: ‘àwọn olórí Júù’ tàbí ‘àwọn ará Jùdíà’
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò sọ ‘olórí’; nítorí náà, a kò fi ìtumọ̀ tó dín ìtọ́kasí náà kù sínú ọ̀rọ̀ pàtàkì. Àlàyé ìsàlẹ̀ ojú ìwé ń jẹ́ kí òǹkàwé mọ̀ pé Jòhánù kì í lo gbólóhùn yìí nígbà gbogbo fún gbogbo àwọn Júù.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn kíkún, tó ṣe kedere fún òǹkàwé òde òní, tí ó sì pa ìyì ìtàn Bíbélì mọ́. A lo ọ̀rọ̀ ológun tó ṣeé lóye dípò àyálò ọ̀rọ̀ iṣẹ́ Róòmù.
