source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: yo
  text: Pílátù dáhùn pé, “Èmi kì í ṣe Júù[a], àbí? Àwọn ènìyàn tìrẹ àti àwọn olórí àlùfáà ni wọ́n fi ọ́ lé mi lọ́wọ́. Kí ni o ṣe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí ìdánimọ̀ ẹ̀yà tàbí ẹ̀sìn rẹ̀ jẹ́ ti Júù, tàbí ẹni láti agbègbè Jùdíà, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ ìtàn Yorùbá tó wọ́pọ̀, tó sì bá ìdáhùn nínú ìjíròrò mu.
- source_word: Μήτι
  choice: Èmi kì í ṣe ... àbí mo jẹ́?
  rationale: Ìbéèrè Gíríìkì yìí ń retí ìdáhùn òdì; ọ̀nà yìí pa agbára ìbéèrè àsọyé náà mọ́ ní Yorùbá.
- source_word: Ἰουδαῖός
  choice: Júù
  rationale: Ní àyíká ọ̀rọ̀ yìí, Pílátù ń fi ìdánimọ̀ ẹ̀yà àti orílẹ̀-èdè tirẹ̀ yà sọ́tọ̀ sí ti Jésù àti àwọn olùfisùn rẹ̀. “Júù” ni ọ̀rọ̀ tó ṣe kedere jù lọ fún òǹkàwé Yorùbá.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: àwọn ènìyàn tìrẹ fúnra wọn
  rationale: Èyí mú ìtumọ̀ àwọn ènìyàn tàbí orílẹ̀-èdè gẹ́gẹ́ bí àwùjọ jáde, ó sì pa ìtẹnumọ́ tó wà nínú τὸ σὸν mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó ń tọ́ka sí ẹgbẹ́ àwọn aṣáájú àlùfáà ní Jerúsálẹ́mù, kì í ṣe sí olórí àlùfáà kan ṣoṣo.
- source_word: παρέδωκάν
  choice: fi ọ́ lé mi lọ́wọ́
  rationale: Àṣàyàn yìí sọ ìfifún ẹni sí àṣẹ aláṣẹ fún ìdájọ́, láìfi ìtumọ̀ “dalẹ̀” kún un láìnídí.
- source_word: τί ἐποίησας
  choice: Kí ni o ṣe?
  rationale: Ó jẹ́ ìbéèrè Yorùbá tó ṣe kedere nípa ohun tí Jésù ti ṣe, tí ó sì jẹ́ kókó ìwádìí Pílátù.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαῖος nínú Jòhánù
  choice: Júù
  alternative: ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìdánimọ̀ ẹ̀yà tàbí ẹ̀sìn, tàbí sí ẹni láti agbègbè Jùdíà. Ní ẹsẹ yìí, ìbéèrè Pílátù àti gbolohun tó tẹ̀ lé e nípa àwọn ènìyàn Jésù fúnra wọn ṣe àtìlẹ́yìn fún ìtumọ̀ ẹ̀yà tàbí orílẹ̀-èdè; síbẹ̀, àlàyé ìsàlẹ̀ fi ìtumọ̀ agbègbè tó tún ṣeé ṣe hàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìbéèrè àsọyé Pílátù àti ìtẹnumọ́ “tìrẹ fúnra wọn” mọ́.
