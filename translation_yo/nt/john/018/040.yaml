id: JHN.18.40
reference: John 18:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: yo
  text: Nítorí náà, wọ́n tún kígbe pé, “Kì í ṣe ọkùnrin yìí, bí kò ṣe Bárábà!” Bárábà sì jẹ́ ọlọ́ṣà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “adigunjalè”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọlọ́ṣà, adigunjalè, tàbí ọlọ̀tẹ̀ oníjà ní àwọn àyíká kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: wọ́n ... kígbe
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíké tàbí kígbe sókè; “kígbe” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára ohùn náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìdáhùn àwọn ènìyàn pọ̀ mọ́ ìjíròrò tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú hàn.
- source_word: πάλιν
  choice: tún
  rationale: “Tún” fi hàn ní tààrà pé wọ́n ṣe ìgbésẹ̀ náà lẹ́ẹ̀kan sí i.
- source_word: λέγοντες
  choice: pé
  rationale: Lẹ́yìn “kígbe,” àmì àsopọ̀ “pé” ni ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ tí wọ́n sọ wọlé, láì tún ọ̀rọ̀ tí yóò wuwo ṣe.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Kì í ṣe ọkùnrin yìí, bí kò ṣe Bárábà
  rationale: “Ọkùnrin yìí” pa agbára ọ̀rọ̀ atọ́ka τοῦτον mọ́, “bí kò ṣe” sì mú ìyàtọ̀ tó wà nínú àkọsílẹ̀ Gíríìkì jáde ní kedere.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Bárábà
  rationale: A kọ orúkọ ẹni náà ní ìrísí tí ó bá ìró àti ìkọ̀wé Yorùbá mu.
- source_word: ἦν δὲ
  choice: Bárábà sì jẹ́
  rationale: “Sì” mú àlàyé abẹ́lẹ̀ tí δέ gbé wọlé hàn, “jẹ́” sì sọ ipò Bárábà ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: λῃστής
  choice: ọlọ́ṣà
  rationale: “Ọlọ́ṣà” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún olè tó ń fi agbára tàbí ìwà ipá ṣe iṣẹ́ rẹ̀; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó lè tọ́ka sí adigunjalè tàbí ọlọ̀tẹ̀ oníjà mọ́.
theological_decisions:
- issue: Ìtumọ̀ λῃστής gẹ́gẹ́ bí àpèjúwe Bárábà
  choice: ọlọ́ṣà
  alternative: adigunjalè; ọlọ̀tẹ̀ oníjà
  rationale: Ìtumọ̀ pàtàkì ọ̀rọ̀ Gíríìkì náà ni olè tàbí adigunjalè. Ní àwọn àyíká kan ó lè ní ìtumọ̀ ẹni tó ń lo ìwà ipá nínú ìṣọ̀tẹ̀, ṣùgbọ́n ẹsẹ yìí nìkan kò fipá mú ìtumọ̀ yẹn. Nítorí náà, a lo “ọlọ́ṣà” nínú ọ̀rọ̀ pàtàkì, a sì pa àwọn ìtumọ̀ mìíràn mọ́ sínú àlàyé.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yan gbólóhùn àdánidá “wọ́n tún kígbe pé” dípò títẹ̀lé àtòjọ ọ̀rọ̀ Gíríìkì lọ́nà tí yóò wuwo ní Yorùbá.
