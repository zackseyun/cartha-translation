source:
  edition: SBLGNT
  text: ἀπέστειλεν ⸀οὖν αὐτὸν ὁ Ἅννας δεδεμένον πρὸς Καϊάφαν τὸν ἀρχιερέα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: yo
  text: Nítorí náà, Ánásì rán an lọ ní ìdè sí ọ̀dọ̀ Káyáfà, olórí àlùfáà náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀: “Nígbà náà, Ánásì ti rán an lọ ní ìdè sí ọ̀dọ̀ Káyáfà, olórí àlùfáà náà,” bí a bá ka èyí sí àlàyé tí a fi sínú ọ̀rọ̀ láti ṣàlàyé àwọn ìṣẹ̀lẹ̀ tó ṣáájú.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: rán an lọ
  rationale: Ọ̀rọ̀-ìṣe aorist active indicative náà sọ ìṣẹ̀lẹ̀ ìtàn ní tààrà; “rán an lọ” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ènìyàn ránṣẹ́ sí ibòmíràn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa agbára àsopọ̀ ìtàn tàbí èrò mọ́, láìfi ìtumọ̀ míì kún un.
- source_word: δεδεμένον
  choice: bí a ti dè é mọ́
  rationale: Perfect passive participle náà ṣàpèjúwe ipò tí ó wà nígbà tí a rán an lọ; gbólóhùn yìí fi hàn pé ó wà ní dídè láìfi ìtẹnumọ́ “síbẹ̀” kún Giriki.
- source_word: πρὸς
  choice: sí ọ̀dọ̀
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìrìn sí ibì kan àti orúkọ ènìyàn, πρός túmọ̀ sí lílọ sí ọ̀dọ̀ ẹni náà.
- source_word: Καϊάφαν
  choice: Káyáfà
  rationale: Ìkọ̀wé orúkọ Καϊάφας ní Yorùbá, ní ìbámu pẹ̀lú bí a ṣe ń pe àwọn fáwẹ́lì rẹ̀.
- source_word: τὸν ἀρχιερέα
  choice: olórí àlùfáà
  rationale: Ó tọ́ka sí ipò àlùfáà gíga Júù kan ṣoṣo, kì í ṣe ẹgbẹ́ àwọn olórí àlùfáà.
- source_word: ὁ Ἅννας
  choice: Ánásì
  rationale: Ìkọ̀wé orúkọ Ἅννας ní Yorùbá.
theological_decisions:
- issue: Ìtẹ̀lé ìṣẹ̀lẹ̀ náà ní ìbámu pẹ̀lú àwọn ẹsẹ tó yí i ká
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìṣẹ̀lẹ̀ àtijọ́ tó ń tẹ̀ síwájú nínú ìtàn: Ánásì rán Jésù lọ sí ọ̀dọ̀ Káyáfà.'
  alternative: A lè ka ẹsẹ náà gẹ́gẹ́ bí àlàyé àárín gbólóhùn pé Ánásì ti rán an lọ ṣáájú.
  rationale: Aorist indicative Giriki náà sábà máa ń sọ ìṣẹ̀lẹ̀ ìtàn ní tààrà. Bí ó tilẹ̀ jẹ́ pé àríyànjiyàn wà lórí bí ẹsẹ yìí ṣe bá àwọn ìṣẹ̀lẹ̀ tó ṣáájú mu, ọ̀rọ̀ inú ẹsẹ kò yẹ kí ó yan ojútùú ìṣọ̀kan kan láìjẹ́ pé Giriki fúnra rẹ̀ béèrè rẹ̀; àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀nà kejì mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo “olórí àlùfáà” fún ἀρχιερεύς, a sì ṣàfihàn δεδεμένον gẹ́gẹ́ bí ipò Jésù nígbà tí wọ́n rán an lọ.
