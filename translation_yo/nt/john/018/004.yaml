source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: yo
  text: Nítorí náà, Jésù, ẹni tí ó mọ gbogbo ohun tí ń bọ̀ sórí rẹ̀,[a] jáde lọ, ó sì bi wọ́n pé, “Ta ni ẹ̀ ń wá?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun tí ó fẹ́rẹ̀ẹ́ ṣẹlẹ̀ sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú ọ̀rọ̀ àti ìbáṣepọ̀ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ pẹ̀lú ohun tó tẹ̀ lé e hàn.
- source_word: εἰδὼς
  choice: ẹni tí ó mọ
  rationale: Ó sọ pé Jésù ti mọ ohun tí ń bọ̀, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti túmọ̀ participle náà.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: gbogbo ohun tí ń bọ̀ wá ṣẹlẹ̀ sí i
  rationale: Ó pa ìtumọ̀ gbogbo nǹkan àti àwọn ìṣẹ̀lẹ̀ tó ń sún mọ́ Jésù mọ́ láì sọ ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἐξῆλθεν
  choice: jáde lọ
  rationale: Ìtumọ̀ àdánidá fún ἐξέρχομαι ni àyíká yìí, láì fi ìṣe àwòkẹ́kọ̀ọ́ kún un.
- source_word: λέγει
  choice: ó sì bi wọ́n pé
  rationale: Nítorí ọ̀rọ̀ tó tẹ̀ lé e jẹ́ ìbéèrè, ‘bi wọ́n pé’ jẹ́ Yorùbá tó ṣe kedere; a lo àkókò ìtàn dípò historical present Gíríìkì.
- source_word: Τίνα ζητεῖτε
  choice: Ta ni ẹ̀ ń wá?
  rationale: ‘Ta’ jẹ́ arọ́pò-orúkọ ohun tí wọ́n ń wá, ‘ẹ̀’ sì bá ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀ mu; gbólóhùn náà jẹ́ Yorùbá òde òní tó mọ́gbọ́n dání.
theological_decisions:
- issue: Ìmọ̀ Jésù nípa ohun tí ń bọ̀ ṣẹlẹ̀ sí i
  choice: A sọ pé ó mọ gbogbo ohun tí ń bọ̀ wá ṣẹlẹ̀ sí i.
  alternative: A lè sọ ọ́ ní ọ̀nà ìtumọ̀ síwájú pé ó mọ gbogbo ohun tí ó fẹ́ ṣẹlẹ̀ sí i tẹ́lẹ̀.
  rationale: Ọ̀rọ̀ náà pa ìwúwo ìmọ̀ Jésù mọ́, ṣùgbọ́n kò fi ẹ̀kọ́ ìsìn tó kọjá ohun tí ẹsẹ náà sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye.
