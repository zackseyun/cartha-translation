id: JHN.18.25
reference: John 18:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: yo
  text: Símónì Pétérù dúró, ó sì ń móoru. Nítorí náà, wọ́n bi í pé[a], “Ìwọ náà kì í ṣe ọ̀kan lára àwọn ọmọ-ẹ̀yìn rẹ̀, àbí?” Ó sẹ́, ó sì wí pé, “Èmi kọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó dájú pé ìwọ náà kì í ṣe ọ̀kan lára àwọn ọmọ-ẹ̀yìn rẹ̀, àbí?” Ìbéèrè Gíríìkì tí ó lo μή ń retí ìdáhùn òdì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ Σίμων Πέτρος ἑστὼς
  choice: Símónì Pétérù dúró
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò lágbára; Yorùbá kò nílò kí a fi ọ̀rọ̀ àsopọ̀ kan sí iwájú. ἑστὼς ṣàpèjúwe bí Pétérù ṣe ń bá a lọ ní dídúró.
- source_word: θερμαινόμενος
  choice: ó sì ń móoru
  rationale: Èyí túmọ̀ sí pé ó ń mú ara rẹ̀ gbóná. ‘Ń móoru’ jẹ́ ọ̀nà àdánidá ní Yorùbá, a kò sì fi ‘lẹ́gbẹ̀ẹ́ iná’ kún un nítorí kò sí nínú ẹsẹ yìí.
- source_word: εἶπον οὖν αὐτῷ
  choice: Nítorí náà, wọ́n bi í pé
  rationale: οὖν fi ìbáṣepọ̀ àbájáde nínú ìtàn hàn. Bí ó tilẹ̀ jẹ́ pé εἶπον túmọ̀ ní tààrà sí ‘wọ́n sọ fún un,’ nínú àyíká yìí gbólóhùn náà jẹ́ ìbéèrè, nítorí náà ‘wọ́n bi í pé’ jẹ́ Yorùbá àdánidá.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Ìwọ náà kì í ṣe ... àbí?
  rationale: μή ń retí ìdáhùn òdì; ‘kì í ṣe ... àbí?’ pa ìrètí yẹn mọ́, καὶ σὺ sì farahàn nínú ‘ìwọ náà.’
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ọ̀kan lára àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ἐκ pẹ̀lú ẹ̀yà oníranmọ́ fi jíjẹ́ ọmọ ẹgbẹ́ kan hàn; ‘ọ̀kan lára’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Ó sẹ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó kọ́ ẹ̀sùn tàbí ohun tí ìbéèrè náà ń sọ. Yorùbá kò nílò ohun tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí níhìn-ín.
- source_word: Οὐκ εἰμί
  choice: Èmi kọ́
  rationale: Ìdáhùn Yorùbá ṣókí yìí bá ìkọ̀sílẹ̀ Gíríìkì mu, ó sì pa ìtumọ̀ ‘Èmi kì í ṣe ọ̀kan lára wọn’ mọ́ láìfi àlàyé kún un.
theological_decisions:
- issue: Irú ìsẹ́ Pétérù
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí kíkọ́ pé òun jẹ́ ọ̀kan lára àwọn ọmọ-ẹ̀yìn Jésù.
  alternative: Láti mú un fẹ̀ sí i pé, ‘Èmi kì í ṣe ọ̀kan lára wọn.’
  rationale: Gíríìkì jẹ́ ṣókí, ó sì fi apá tí ó yókù sílẹ̀ kí a lóye rẹ̀ láti inú ìbéèrè náà. Ìtumọ̀ náà kò gbòòrò ìsẹ́ náà sí ẹ̀kọ́ ìgbàgbọ́ míì.
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, tó ṣe kedere, tó sì jẹ́ ti òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yorùbá mọ̀, ‘Èmi kọ́’ sì jẹ́ ìdáhùn ṣókí àti àdánidá.
