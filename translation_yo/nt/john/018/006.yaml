id: JHN.18.6
reference: John 18:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: yo
  text: Nítorí náà, nígbà tí ó sọ fún wọn pé,[a] “Èmi ni ẹni náà,” wọ́n lọ sẹ́yìn, wọ́n sì ṣubú lulẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gangan jù, “Èmi ni.” Gbólóhùn Gíríìkì náà tún lè mú àwọn ọ̀rọ̀ pàtàkì “Èmi ni” inú Ìhìn Rere Jòhánù wá sí ìrántí.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ó pa ìsopọ̀ ìtàn tí οὖν ń fi hàn mọ́, ó sì túmọ̀ ὡς gẹ́gẹ́ bí àkókò ní Yorùbá àdánidá.
- source_word: εἶπεν αὐτοῖς
  choice: ó sọ fún wọn pé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ọ̀rọ̀ tí a sọ tààrà sí àwọn ènìyàn.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni ẹni náà
  rationale: Nínú ọ̀rọ̀ yìí, gbólóhùn náà jẹ́ ìdánimọ̀ ẹni tí wọ́n ń wá; “ẹni náà” mú ìtumọ̀ yẹn yé kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan àti ìró ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: wọ́n fà sẹ́yìn
  rationale: Ó sọ ìṣípadà wọn sí ẹ̀yìn ní Yorùbá tó wọ́pọ̀, ó sì bá ìṣẹ̀lẹ̀ ojijì náà mu.
- source_word: ἔπεσαν χαμαί
  choice: wọ́n sì ṣubú lulẹ̀
  rationale: “Ṣubú lulẹ̀” jẹ́ Yorùbá àdánidá tó pa ìṣe ti ara àti ìtọ́sọ́nà sí ilẹ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Ἐγώ εἰμι ní àyíká Ìhìn Rere Jòhánù, níbi tí ó ti lè ní ìró ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀
  choice: Èmi ni ẹni náà
  alternative: Èmi ni
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ fi hàn pé Jésù ń dá ara rẹ̀ mọ̀ gẹ́gẹ́ bí ẹni tí wọ́n ń wá. Síbẹ̀, àlàyé ìsàlẹ̀ pa “Èmi ni” mọ́ nítorí pé ó túmọ̀ Gíríìkì náà ní tààrà, ó sì lè ní ìbáṣepọ̀ pẹ̀lú àwọn ọ̀rọ̀ “Èmi ni” míì nínú Jòhánù.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá.
