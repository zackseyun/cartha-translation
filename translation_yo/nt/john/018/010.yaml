id: JHN.18.10
reference: John 18:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: yo
  text: Nígbà náà, Símónì Peteru, tí ó ní idà, fà á yọ, ó sì fi kọlu ẹrú olórí àlùfáà[a], ó sì gé etí ọ̀tún rẹ̀ kúrò. Orúkọ ẹrú náà sì ni Málíkù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìránṣẹ́ olórí àlùfáà.” Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nígbà náà
  rationale: Ó ń tọ́ka sí ìtẹ̀síwájú ìṣẹ̀lẹ̀ nínú ìtàn, láì sọ ọ́ di àbájáde ọgbọ́n tí ó le ju ohun tí ọ̀rọ̀ Gíríìkì béèrè lọ.
- source_word: ἔχων μάχαιραν
  choice: tí ó ní idà
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún ẹni tí idà wà lọ́wọ́ rẹ̀; “idà” sì bo ìtumọ̀ gbogbogbò ti μάχαιρα láì fi tipátipá sọ pé ó jẹ́ ọ̀bẹ gígùn tàbí idà kúkúrú.
- source_word: εἵλκυσεν αὐτὴν
  choice: fà á yọ
  rationale: Ó fi hàn pé Peteru fa ohun ìjà náà jáde, bó ṣe yẹ nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἔπαισεν
  choice: fi kọlu
  rationale: “Kọlu” ṣe àfihàn lílu ẹni náà ní ọ̀nà tí ó ṣe kedere, tí ó sì bá ìforúkọsílẹ̀ ọlọ́lá mu.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: ẹrú olórí àlùfáà
  rationale: “Ẹrú” pa ìtumọ̀ ìdè àti jíjẹ́ ẹni tí ó wà lábẹ́ ọ̀gá mọ́; ìsopọ̀ rẹ̀ mọ́ olórí àlùfáà tún jẹ́ kí yíyan ọ̀rọ̀ yìí yẹ.
- source_word: ἀπέκοψεν αὐτοῦ τὸ ὠτάριον τὸ δεξιόν
  choice: gé etí ọ̀tún rẹ̀ kúrò
  rationale: Ó túmọ̀ ìṣe gígé kúrò àti ẹ̀gbẹ́ etí náà ní kíkún; a túmọ̀ ὠτάριον sí “etí” nítorí pé fọ́ọ̀mù kékeré náà kò fi dandan túmọ̀ sí “etí kékeré” tàbí “ìsàlẹ̀ etí.”
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Orúkọ ẹrú náà sì ni Málíkù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ ẹni, “sì” sì ń gbé ìtàn náà lọ sí àlàyé tuntun. “Málíkù” jẹ́ àkọsílẹ̀ orúkọ Μάλχος ní ìró Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nínú àyíká yìí, gbólóhùn náà so ẹni náà mọ́ olórí àlùfáà ní ọ̀nà tí “ẹrú” lè ṣàfihàn dáadáa. Síbẹ̀, δοῦλος tún lè jẹ́ “ìránṣẹ́” ní àyíká kan, nítorí náà a pa ìtumọ̀ yẹn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó lọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ní δοῦλος, dípò lẹ́yìn orúkọ Peteru, kí àmì náà lè tọ́ka sí ọ̀rọ̀ tí àlàyé rẹ̀ ń ṣàlàyé.
