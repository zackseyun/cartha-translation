source:
  edition: SBLGNT
  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: yo
  text: Nítorí náà, olórí àlùfáà béèrè lọ́wọ́ Jésù nípa àwọn ọmọ-ẹ̀yìn rẹ̀ àti nípa ẹ̀kọ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘wádìí Jésù lẹ́nu.’ Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ‘béèrè’ tàbí ‘wádìí lẹ́nu’; a lo ‘béèrè lọ́wọ́’ nínú ọ̀rọ̀ pàtàkì nítorí ó jẹ́ ìtumọ̀ Yorùbá tó ṣàdánidá, ó sì bá àyíká ìgbọ́jọ́ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìbéèrè olórí àlùfáà pọ̀ mọ́ àwọn ìṣẹ̀lẹ̀ tó ṣáájú, ó sì pa agbára àsopọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ipò àlùfáà gíga Júù; a kò fi orúkọ Ánásì rọ́pò oyè tí ọ̀rọ̀ Gíríìkì lò.
- source_word: ἠρώτησεν
  choice: béèrè lọ́wọ́
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí bíbéèrè tàbí fífi ìbéèrè wádìí ọ̀rọ̀; ‘béèrè lọ́wọ́’ jẹ́ èdè Yorùbá àdánidá, ó sì ṣì bá ọ̀rọ̀ ìwádìí ní ipò yìí mu.
- source_word: περὶ
  choice: nípa
  rationale: Ó fi kókó tí ìbéèrè náà dá lé hàn ní ibi méjèèjì, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: μαθητῶν
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ó pa ìbáṣepọ̀ olùkọ́ àti àwọn tó ń kọ́ lẹ́yìn rẹ̀ mọ́, ó sì jẹ́ ìtumọ̀ tí a mọ̀ dáadáa nínú àwọn Ìhìn Rere.
- source_word: διδαχῆς
  choice: ẹ̀kọ́
  rationale: ‘Ẹ̀kọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì lè túmọ̀ sí ohun tí Jesu ń kọ́ni láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jẹ́ ti ẹ̀ka kan kún un.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: 'Ní ìṣẹ̀lẹ̀ méjèèjì, arọ́pò-orúkọ náà tọ́ka sí Jesu: àwọn ọmọ-ẹ̀yìn rẹ̀ àti ẹ̀kọ́ rẹ̀.'
theological_decisions:
- issue: Oyè ἀρχιερεύς ní àyíká tí ìtàn náà ń sọ nípa Ánásì, kì í ṣe Káyáfà tí Róòmù gbà sípò ní àkókò náà
  choice: Túmọ̀ oyè Gíríìkì náà ní tààrà sí ‘olórí àlùfáà’
  alternative: ‘Ánásì olórí àlùfáà’ tàbí ‘olórí àwọn àlùfáà’
  rationale: Ìtumọ̀ náà tẹ̀ lé bí olùkọ̀wé ṣe gbé ìtàn kalẹ̀, kò sì fi orúkọ tàbí àlàyé ìṣọ̀kan ìtàn tí kò sí nínú gbólóhùn Gíríìkì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; àmì ohùn àti àmì abẹ́ lẹ́tà ni a lò ní kíkún níbi tó bá yẹ.
