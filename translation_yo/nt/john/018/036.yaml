id: JHN.18.36
reference: John 18:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: yo
  text: Jésù dáhùn pé, “Ìjọba mi kò ti inú ayé yìí wá. Ká ní ìjọba mi ti inú ayé yìí wá, àwọn ìránṣẹ́ mi ì bá máa jà kí a má bàa fi mí lé àwọn Júù[a] lọ́wọ́. Ṣùgbọ́n gẹ́gẹ́ bí ọ̀ràn ti rí, ìjọba mi kò ti ibí wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà”; ó ṣeé ṣe pé àwọn aláṣẹ Jùdíà ní pàtó ni ọ̀rọ̀ náà ń tọ́ka sí níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: ìjọba
  rationale: “Ìjọba” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu jù lọ nínú àyíká yìí, ó sì lè tọ́ka sí agbègbè ọba àti ìṣàkóso rẹ̀.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: ti inú ayé yìí wá
  rationale: Ìtumọ̀ yìí pa èrò orísun tàbí ibi tí ìjọba náà ti wá mọ́, dípò kí ó túmọ̀ sí pé ìjọba náà kò ní ohunkóhun ṣe pẹ̀lú ayé.
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” jẹ́ ìtumọ̀ tààrà àti èyí tí òǹkàwé Yorùbá lóde òní yóò lóye; àyíká ọ̀rọ̀ ń fi ìlànà ayé tí ó dojú kọ Ọlọ́run hàn.
- source_word: ὑπηρέται
  choice: àwọn ìránṣẹ́ mi
  rationale: Ó tọ́ka sí àwọn tí ń ṣiṣẹ́ lábẹ́ àṣẹ ẹlòmíràn, ó sì bá àyíká ìjọba mu láì sọ wọ́n di ológun tàbí ọlọ́pàá ní pàtó.
- source_word: ἠγωνίζοντο ἄν
  choice: ì bá máa jà
  rationale: Ẹ̀ka ọ̀rọ̀ yìí fi ìṣe tí yóò máa bá a lọ nínú ipò àròsọ tí kò ṣẹlẹ̀ hàn.
- source_word: ἵνα μὴ παραδοθῶ
  choice: kí a má bàa fi mí lé … lọ́wọ́
  rationale: Ó sọ ète ìjà náà, ó sì pa ìtumọ̀ fífi ẹni lé ẹlòmíràn lọ́wọ́ mọ́ ní Yorùbá àdánidá.
- source_word: τοῖς Ἰουδαίοις
  choice: àwọn Júù[a]
  rationale: Èyí dúró sún mọ́ ọ̀rọ̀ Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa ìtumọ̀ tó ṣeé ṣe pé àwọn ará Jùdíà tàbí àwọn aláṣẹ wọn ni mọ́.
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n gẹ́gẹ́ bí ọ̀ràn ti rí
  rationale: Ó fi ipò gidi tí ó wà hàn ní ìyàtọ̀ sí ipò àròsọ tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: ἐντεῦθεν
  choice: kò ti ibí wá
  rationale: Ó pa ìtọ́ka ibi “láti ibí” mọ́, láì sọ ọ́ di àtúnṣe gangan ti gbólóhùn àkọ́kọ́.
theological_decisions:
- issue: Irú ìbáṣepọ̀ tí ìjọba Jésù ní pẹ̀lú ayé
  choice: “kò ti inú ayé yìí wá”
  alternative: “kò jẹ́ ti ayé yìí” tàbí “kò sí lára ayé yìí”
  rationale: Gíríìkì tẹnu mọ́ orísun àti ìwà ìjọba náà, kì í ṣe pé ìjọba Jésù kò sí tàbí kò ṣiṣẹ́ nínú ayé rárá.
- issue: Ẹni tí Ἰουδαῖοι ń tọ́ka sí nínú àyíká yìí
  choice: Àkọ́kọ́ ọ̀rọ̀ ní “àwọn Júù,” pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé.
  alternative: “àwọn ará Jùdíà” tàbí “àwọn aláṣẹ Jùdíà”
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí àwọn Júù lápapọ̀ tàbí, ní àyíká kan, àwọn ará Jùdíà tàbí àwọn aláṣẹ wọn. Ìtumọ̀ yìí kò dín àìdánilójú náà kù láìnídìí.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. “Ká ní … ì bá …” mú ipò àròsọ tí kò ṣẹlẹ̀ jáde lọ́nà àdánidá, “gẹ́gẹ́ bí ọ̀ràn ti rí” sì mú ìyàtọ̀ sí ipò gidi hàn.
