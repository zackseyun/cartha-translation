id: JHN.18.37
reference: John 18:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: yo
  text: 'Pílátù sì wí fún un pé, “Ǹjẹ́ nígbà náà, ọba ni ọ?” Jésù dáhùn pé, “Ìwọ ló sọ pé ọba ni èmi.”[a] Nítorí èyí ni a bí mi, nítorí èyí sì ni mo ti wá sí ayé: kí n jẹ́rìí sí òtítọ́. Gbogbo ẹni tí ó jẹ́ ti òtítọ́ ń gbọ́ ohùn mi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ pé, “Ìwọ sọ bẹ́ẹ̀: ọba ni èmi,” tàbí, “Òótọ́ ni o sọ pé ọba ni èmi.” Ọ̀rọ̀ Gíríìkì náà ṣe kúkúrú, a sì lè gbọ́ ọ gẹ́gẹ́ bí ìjẹ́wọ́ tí a fi ààlà sí.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Ǹjẹ́ nígbà náà
  rationale: Ó mú ìtumọ̀ ìbéèrè tí Pilatu fi ń fa ìparí kan jáde láti inú ọ̀rọ̀ tí ó ṣáájú, ó sì jẹ́ Yorùbá àdánidá.
- source_word: βασιλεὺς
  choice: ọba
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún βασιλεύς, ó sì pa ìtumọ̀ ìṣèlú àti ti Mèsáyà mọ́ láìṣe àlàyé kún un.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Ìwọ ni ó sọ pé ọba ni èmi
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, ó sì pa àìdánilójú rẹ̀ mọ́ láàárín ìjẹ́wọ́ tí a fi ààlà sí àti ìdáhùn tí kò fẹ́ lo ọ̀rọ̀ Pilatu gẹ́gẹ́ bí ti ara rẹ̀.
- source_word: γεγέννημαι
  choice: a bí mi
  rationale: Ilana àìdárúkọ olùṣe jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a bí Jesu; kò fi èrò ‘bíbí jáde’ kan tí àyíká yìí kò béèrè kún ọ̀rọ̀ náà.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: mo ti wá sí ayé
  rationale: ‘Ti’ fi ipò tí ó ti ṣẹlẹ̀ tí ó sì ní ìbáṣepọ̀ pẹ̀lú ìsinsìnyí hàn; ‘ayé’ sì jẹ́ ìtumọ̀ κόσμος tó bójú mu níbí.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: kí n lè jẹ́rìí sí òtítọ́
  rationale: Ó sọ ète ἵνα di mímọ́, ó sì pa èdè ẹ̀rí àti ìdájọ́ inú Jòhánù mọ́.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Gbogbo ẹni tí ó wá láti inú òtítọ́
  rationale: Ó pa agbára orísun tàbí ìpilẹ̀ṣẹ̀ inú ἐκ mọ́, dípò kí a yanjú rẹ̀ sí ‘ẹni tí ó jẹ́ ti òtítọ́’ nìkan.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: ń gbọ́ ohùn mi
  rationale: ‘Gbọ́ ohùn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè ní ìtumọ̀ gbígbọ́ àti fífetísílẹ̀, ó sì pa ìbáramu pẹ̀lú àwòrán olùṣọ́-àgùntàn inú Jòhánù mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìdáhùn Jesu sí Pilatu (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: A túmọ̀ ọ́ ní ọ̀nà tó sún mọ́ Gíríìkì pé, “Ìwọ ni ó sọ pé ọba ni èmi,” láìsọ ọ́ di ìjẹ́wọ́ líle tàbí ìkọ̀sílẹ̀.
  alternative: '“Ìwọ sọ bẹ́ẹ̀: ọba ni èmi,” tàbí “Òótọ́ ni o sọ pé ọba ni èmi.”'
  rationale: Gíríìkì náà ṣe kúkúrú, ó sì lè jẹ́ ìjẹ́wọ́ tí a fi ààlà sí. Ìtumọ̀ àkọ́kọ́ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà nínú rẹ̀ mọ́, àkọsílẹ̀ ìsàlẹ̀ sì fi àwọn ọ̀nà mìíràn hàn.
- issue: 'Àwọn gbólóhùn méjì nípa iṣẹ́ Jesu: bíbí rẹ̀ àti wíwá rẹ̀ sí ayé'
  choice: A pa “a bí mi” àti “mo ti wá sí ayé” mọ́ gẹ́gẹ́ bí gbólóhùn ọ̀tọ̀ọ̀tọ̀.
  alternative: Kí a kó àwọn méjèèjì jọ sínú gbólóhùn kan nípa iṣẹ́ tí ó wá ṣe.
  rationale: Ọ̀rọ̀ Jòhánù yà bíbí Jesu sí ọ̀tọ̀ kúrò nínú wíwá rẹ̀ sí ayé; ìtumọ̀ náà kò yẹ kí ó pa ìyàtọ̀ tí ó lè ní ìtumọ̀ nípa ìwá ènìyàn rẹ̀ àti ìránṣẹ́ rẹ̀ rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a lo ‘jẹ́rìí’ láti pa èdè ẹ̀rí mọ́, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹ̀ya kan.
