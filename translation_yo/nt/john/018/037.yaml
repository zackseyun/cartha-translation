revisions:
- from: 'Pilatu sì wí fún un pé, “Ǹjẹ́ nígbà náà, ọba ni ọ?” Jesu dáhùn pé, “Ìwọ ni ó sọ pé ọba ni èmi.”[a] Nítorí èyí ni a bí mi, nítorí èyí sì ni mo ti wá sí ayé: kí n lè jẹ́rìí sí òtítọ́. Gbogbo ẹni tí ó wá láti inú òtítọ́ ń gbọ́ ohùn mi.'
  to: 'Pílátù sì wí fún un pé, “Ǹjẹ́ nígbà náà, ọba ni ọ?” Jésù dáhùn pé, “Ìwọ ló sọ pé ọba ni èmi.”[a] Nítorí èyí ni a bí mi, nítorí èyí sì ni mo ti wá sí ayé: kí n jẹ́rìí sí òtítọ́. Gbogbo ẹni tí ó jẹ́ ti òtítọ́ ń gbọ́ ohùn mi.'
  rationale: The revision corrects the active-motion rendering of ὢν while retaining the Greek phrase’s relational ambiguity, expresses the purpose clause without an added ability nuance, and applies conventional Yoruba tone-marked forms to the names. The concise and potentially qualified nature of Jesus’ reply remains represented in the main text and explained by the existing footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves Pilate's inferential question, kingship language, the distinct perfect clauses concerning birth and coming into the world, the purpose of witness to the truth, and hearing Jesus' voice. However, “tí ó wá láti inú òtítọ́” renders the participle ὢν (‘being’) as an active ‘comes’ and makes ‘from within truth’ more concrete than the Greek relational expression ἐκ τῆς ἀληθείας.
  naturalness: The revision uses natural Standard Yoruba, with conventional tone-marked biblical names and a more idiomatic relational expression for ‘of the truth.’ Removing “lè” from the purpose clause avoids an unintended nuance of ability (‘be able to’) where the Greek expresses purpose.
  terminology: ọba, ayé, jẹ́rìí sí òtítọ́, and ohùn mi are suitable and retain the passage’s political, Johannine testimonial, and relational language. “jẹ́ ti òtítọ́” conveys the relational force without defining it doctrinally.
  issues:
  - severity: medium
    issue: “Gbogbo ẹni tí ó wá láti inú òtítọ́”
    rationale: The Greek says literally ‘everyone who is of/from the truth’ (πᾶς ὁ ὢν ἐκ τῆς ἀληθείας). The Yoruba verb wá means ‘come,’ thereby adding motion and failing to represent ὢν. “Tí ó jẹ́ ti òtítọ́” is natural and preserves the relational ambiguity.
  - severity: low
    issue: “kí n lè jẹ́rìí”
    rationale: The particle lè can suggest ability or possibility. The ἵνα clause states Jesus’ purpose; “kí n jẹ́rìí” conveys that purpose directly.
  - severity: low
    issue: Personal names lack customary Yoruba tone marking
    rationale: Using Pílátù and Jésù better fulfills the stated Standard Yoruba tone-marking convention and accords with common Yoruba biblical usage.
  revised_text: 'Pílátù sì wí fún un pé, “Ǹjẹ́ nígbà náà, ọba ni ọ?” Jésù dáhùn pé, “Ìwọ ló sọ pé ọba ni èmi.”[a] Nítorí èyí ni a bí mi, nítorí èyí sì ni mo ti wá sí ayé: kí n jẹ́rìí sí òtítọ́. Gbogbo ẹni tí ó jẹ́ ti òtítọ́ ń gbọ́ ohùn mi.'
  revised_footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ pé, “Ìwọ sọ bẹ́ẹ̀: ọba ni èmi,” tàbí, “Òótọ́ ni o sọ pé ọba ni èmi.” Ọ̀rọ̀ Gíríìkì náà ṣe kúkúrú, a sì lè gbọ́ ọ gẹ́gẹ́ bí ìjẹ́wọ́ tí a fi ààlà sí.'
    reason: alternative_reading
  revision_rationale: The revision corrects the active-motion rendering of ὢν while retaining the Greek phrase’s relational ambiguity, expresses the purpose clause without an added ability nuance, and applies conventional Yoruba tone-marked forms to the names. The concise and potentially qualified nature of Jesus’ reply remains represented in the main text and explained by the existing footnote.
