id: JHN.18.9
reference: John 18:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: yo
  text: kí ọ̀rọ̀ tí ó ti sọ lè ṣẹ pé, “Nínú àwọn tí ìwọ ti fi fún mi, èmi kò pàdánù ẹnì kan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: kí
  rationale: Ó ṣàfihàn ète tàbí àbájáde ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: πληρωθῇ
  choice: lè ṣẹ
  rationale: Ọ̀rọ̀ yìí fi hàn pé ohun tí Jésù sọ tẹ́lẹ̀ wá sí ìmúṣẹ; “lè ṣẹ” jẹ́ Yorùbá àdánidá tí ó pa agbára gbólóhùn náà mọ́.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: ọ̀rọ̀ tí ó ti sọ
  rationale: λόγος túmọ̀ sí ọ̀rọ̀ pàtó tí Jésù sọ, kì í ṣe orúkọ oyè “Ọ̀rọ̀”; “ti sọ” sì fi hàn pé ó ti sọ ọ́ ṣáájú ìṣẹ̀lẹ̀ yìí.
- source_word: Οὓς δέδωκάς μοι
  choice: Nínú àwọn tí ìwọ ti fi fún mi
  rationale: “Nínú àwọn” mú ìtumọ̀ partitive tó wà nínú ἐξ αὐτῶν hàn, “ti fi fún mi” sì tọ́ka sí fífúnni tí ipa rẹ̀ ṣì dúró.
- source_word: ἀπώλεσα
  choice: kò pàdánù
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé Jésù kò jẹ́ kí àwọn tí a fi sí ìtọ́jú rẹ̀ sọnù, kì í ṣe pé ó pa wọ́n run.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: ẹnì kan
  rationale: Pẹ̀lú àtakò “kò,” ó túmọ̀ sí “kò sí ẹnì kan,” ó sì pa ìtẹnumọ́ Gíríìkì náà mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ èdè ìmúṣẹ
  choice: “kí ọ̀rọ̀ ... lè ṣẹ” gẹ́gẹ́ bí ìmúṣẹ ọ̀rọ̀ Jésù tẹ́lẹ̀
  alternative: “kí ọ̀rọ̀ ... lè wá sí ìmúṣẹ”
  rationale: Jòhánù ń lo èdè ìmúṣẹ fún ọ̀rọ̀ Jésù fúnra rẹ̀, kì í ṣe fún àsọtẹ́lẹ̀ Ìwé Mímọ́ nìkan; ìtumọ̀ yìí kò fi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ἀπώλεσα nípa àwọn ọmọ-ẹ̀yìn
  choice: “èmi kò pàdánù ẹnì kan”
  alternative: “èmi kò jẹ́ kí ẹnì kan ṣègbé”
  rationale: “Pàdánù” bá àyíká ìdáàbòbò àwọn ọmọ-ẹ̀yìn mu, ó sì pa ìfọ̀rọ̀wérọ̀ pẹ̀lú Jòhánù 17:12 àti ìdíwọ̀n ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A kò fi àmì àlàyé [a] sí i nítorí àṣàyàn Gẹ̀ẹ́sì náà kò tọ́ka sí iyatọ̀ gidi nínú ìtumọ̀ orísun, Yorùbá “kò pàdánù ẹnì kan” sì ti mú un hàn kedere.
