  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “kí” mú ἵνα (ète/àbájáde) hàn; “ọ̀rọ̀ tí ó ti sọ” tọ́ka sí ọ̀rọ̀ Jésù tẹ́lẹ̀; “lè ṣẹ” ń sọ ìmúṣẹ πληρωθῇ; “Nínú àwọn tí ìwọ ti fi fún mi” àti “kò pàdánù ẹnì kan” ń pa ìtumọ̀ apá kan nínú ẹgbẹ́ náà àti ìtẹnumọ́ ìkọ̀ Gíríìkì mọ́. “Pàdánù” bá àyíká ìdáàbòbò àwọn ọmọ-ẹ̀yìn mu, láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.'
  naturalness: Yorùbá náà jẹ́ èdè boṣewa, ó ní àmì ohùn tó yẹ, ó sì rọrùn láti ka. Ìlànà “kí ọ̀rọ̀ … lè ṣẹ pé” jẹ́ ìṣètò tí ó wọ́pọ̀ àti tí ó yẹ fún ìforígbárí ìwé-mímọ́ ní Yorùbá. Ìlò “èmi” nínú ọ̀rọ̀ àsọyé náà tún fún ìkọ̀ náà ní ìtẹnumọ́ tó bá ti Gíríìkì mu.
  terminology: “Ọ̀rọ̀” níbí kò dà bí oyè “Ọ̀rọ̀” nínú Jòhánù 1, ṣùgbọ́n ó tọ́ka sí ìsọ̀rọ̀ kan pàtó, gẹ́gẹ́ bí λόγος ṣe rí ní àyíká yìí. “Fi fún mi” ń ṣètọ́jú ìbáṣepọ̀ fífúnni náà, “pàdánù” sì yẹ fún ἀπώλεσα nípa ìtọ́jú àwọn ọmọ-ẹ̀yìn. Kò sí ìdí dandan fún àlàyé ìsàlẹ̀; ìtúmọ̀ Yorùbá ti sọ apá “not one [of them]” ní kedere.
