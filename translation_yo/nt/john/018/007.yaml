  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: yo
  text: Nítorí náà, ó tún béèrè lọ́wọ́ wọn pé, “Ta ni ẹ ń wá?” Wọ́n sì sọ pé, “Jésù ará Násárétì.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “Jésù ẹni Násárétì náà.” A tún lè túmọ̀ ọ́ sí “Jésù ti Násárétì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Nítorí náà, ó tún
  rationale: “Nítorí náà” ń so ìbéèrè yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, “tún” sì fi hàn pé ó ń ṣe ìbéèrè náà lẹ́ẹ̀kan sí i.
- source_word: ἐπηρώτησεν αὐτούς
  choice: bi wọ́n
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe kedere fún bíbéèrè ìbéèrè kan lọ́wọ́ àwọn ènìyàn.
- source_word: Τίνα ζητεῖτε
  choice: Ta ni ẹ ń wá?
  rationale: “Ta” dúró gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí, “ẹ” sì jẹ́ ọ̀pọ̀ ènìyàn; “ń wá” pa ìtumọ̀ ìṣe tí wọ́n ń ṣe ní àkókò náà mọ́.
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì dáhùn pé
  rationale: Nínú àsọyé yìí, δέ ń tẹ ìjíròrò náà síwájú. “Dáhùn” jẹ́ ọ̀nà àdánidá ní Yorùbá nítorí ọ̀rọ̀ wọn jẹ́ ìdáhùn sí ìbéèrè.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jésù ará Násárétì
  rationale: “Ará Násárétì” jẹ́ ọ̀nà Yorùbá tó yéni láti fi orúkọ ibi náà dá Jésù mọ̀, nígbà tó ṣì pa ipa Ναζωραῖος gẹ́gẹ́ bí àpèjúwe ìdánimọ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ναζωραῖος gẹ́gẹ́ bí àpèjúwe Jésù
  choice: Jésù ará Násárétì
  alternative: Jésù ọmọ Násárétì
  rationale: Èyí jẹ́ àpèjúwe ìdánimọ̀ tó ní í ṣe pẹ̀lú ibi, kì í ṣe oyè ẹ̀kọ́ ìgbàgbọ́. “Ará Násárétì” ṣe kedere, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ẹ” fún ọ̀pọ̀ àwọn tí Jésù ń bá sọ̀rọ̀.
