translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní ọlá, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn àkọ́kọ́ mú ìṣe tí àwọn ọmọ-ẹ̀yìn méjèèjì ń ṣe kedere fún òǹkàwé, nígbà tí àlàyé ìsàlẹ̀ pa ìṣètò ọ̀rọ̀ Gíríìkì tí kò sọ ọ̀rọ̀-ìṣe kejì ní gbangba mọ́.
