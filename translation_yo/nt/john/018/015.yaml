  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: yo
  text: Símónì Pétérù sì ń tọ̀ Jésù lẹ́yìn[a], ọmọ-ẹ̀yìn mìíràn sì ń tọ̀ ọ́ lẹ́yìn pẹ̀lú. Ọmọ-ẹ̀yìn náà jẹ́ ẹni tí olórí àlùfáà mọ̀, ó sì bá Jésù wọ inú àgbàlá olórí àlùfáà náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Símónì Pétérù sì ń tọ̀ Jésù lẹ́yìn, àti ọmọ-ẹ̀yìn mìíràn.” Gíríìkì kò tún ìṣe tí ọmọ-ẹ̀yìn kejì náà ń ṣe sọ ní gbangba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: ń tọ̀ ... lẹ́yìn
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ ń ṣàfihàn imperfect Gíríìkì gẹ́gẹ́ bí ìṣe tí ó ń bá a lọ nínú ìtàn.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ tí kò fi ìtakora tí ó lágbára kún ọ̀rọ̀ náà.
- source_word: καὶ ἄλλος μαθητής
  choice: ọmọ-ẹ̀yìn mìíràn sì ń tọ̀ ọ́ lẹ́yìn pẹ̀lú
  rationale: Ìtumọ̀ yìí sọ ìṣe tí ọmọ-ẹ̀yìn kejì náà pín pẹ̀lú Pétérù ní kedere, bí ó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀-ìṣe náà sílẹ̀ láì tún un sọ.
- source_word: μαθητής
  choice: ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ẹni tí ń kọ́ lábẹ́ olùkọ́ tí ó sì ń tọ̀ ọ́ lẹ́yìn mu.
- source_word: ἐκεῖνος
  choice: náà
  rationale: “Náà” tọ́ka padà sí ọmọ-ẹ̀yìn mìíràn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: γνωστὸς
  choice: jẹ́ ẹni tí ... mọ̀
  rationale: Ó pa ìtumọ̀ pé olórí àlùfáà mọ ọmọ-ẹ̀yìn náà mọ́, láì fi kún un pé wọ́n sún mọ́ra gan-an.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó bójú mu fún oyè àlùfáà gíga jù lọ ní àyíká yìí; a pa ẹyọ ọ̀rọ̀ náà mọ́ ní ibi méjèèjì.
- source_word: συνεισῆλθεν
  choice: bá Jésù wọ inú
  rationale: Ó ṣàfihàn pé ọmọ-ẹ̀yìn náà wọlé papọ̀ pẹ̀lú Jésù.
- source_word: αὐλήν
  choice: àgbàlá
  rationale: “Àgbàlá” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ibi tí a fi odi yí ká ní ilé olórí àlùfáà, láì ṣe àfikún pé ààfin ni.
