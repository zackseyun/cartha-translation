id: JHN.18.39
reference: John 18:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: yo
  text: Ṣùgbọ́n ẹ ní àṣà pé kí n dá ẹnì kan sílẹ̀ fún yín nígbà Àjọ̀dún Ìrékọjá. Nítorí náà, ṣé ẹ fẹ́ kí n dá Ọba àwọn Júù[a] sílẹ̀ fún yín?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọba àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn Júù” tàbí “àwọn ará Jùdíà,” gẹ́gẹ́ bí àyíká ọ̀rọ̀; níbí, ó dà bí àkọlé tí a ti ń lò nínú ìtàn ìjìyà Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: àṣà
  rationale: “Àṣà” sọ ní kedere pé ó jẹ́ ìṣe tí wọ́n ti ń tẹ̀ lé láwùjọ, kì í ṣe ìwà ẹnì kọ̀ọ̀kan lásán.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: pé kí n dá ẹnì kan sílẹ̀ fún yín
  rationale: Èyí fi àkóónú àṣà náà hàn; “ẹnì kan” mú ìtọ́ka sí ènìyàn nínú ἕνα yé ni Yorùbá àdánidá.
- source_word: ἀπολύω
  choice: dá ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí bójú mu fún títú ẹlẹ́wọ̀n sílẹ̀, a sì lò ó bákan náà ní ibi méjèèjì.
- source_word: ἐν τῷ πάσχα
  choice: nígbà Àjọ̀dún Ìrékọjá
  rationale: Ó fi àkókò ayẹyẹ náà hàn lọ́nà tí ó ṣe kedere, tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: βούλεσθε οὖν
  choice: Nítorí náà, ṣé ẹ fẹ́
  rationale: “Nítorí náà” pa ìtumọ̀ ìyọrísí οὖν mọ́, “ṣé ẹ fẹ́” sì jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe àdánidá fún ìbéèrè náà.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: Ó pa àkọlé ọba tí a lò nínú ìtàn ìjìyà Jésù mọ́; “àwọn Júù” ni ìtumọ̀ tó wọ́pọ̀ jù lọ nínú àkọlé yìí.
theological_decisions:
- issue: Ìtumọ̀ Ἰουδαίων nínú àkọlé τὸν βασιλέα τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  alternative: Ọba àwọn ará Jùdíà
  rationale: Nínú ìtàn ìjìyà Jésù, gbólóhùn náà ṣiṣẹ́ gẹ́gẹ́ bí àkọlé àti ẹ̀sùn ọba/Mèsáyà. “Àwọn Júù” pa ìtumọ̀ ìtàn náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àṣàyàn agbègbè “àwọn ará Jùdíà” hàn nítorí pé ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ méjèèjì.
translation_notes:
  register: Yorùbá ìbòwọ̀ òde òní ni a lò (“ẹ,” “yín”), pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. Èdè náà ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò.
