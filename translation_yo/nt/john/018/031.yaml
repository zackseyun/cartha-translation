  to: Nítorí náà, Pílátù sọ fún wọn pé, “Ẹ̀yin fúnra yín, ẹ mú un, ẹ sì dá a lẹ́jọ́ gẹ́gẹ́ bí òfin yín.” Àwọn Júù[a] sọ fún un pé, “Kò bófin mu fún wa láti pa ẹnikẹ́ni.”
