id: JHN.18.31
reference: John 18:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: yo
  text: Nítorí náà, Pílátù sọ fún wọn pé, “Ẹ̀yin fúnra yín, ẹ mú un, ẹ sì dá a lẹ́jọ́ gẹ́gẹ́ bí òfin yín.” Àwọn Júù[a] sọ fún un pé, “Kò bófin mu fún wa láti pa ẹnikẹ́ni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “Àwọn Júù” (hoi Ioudaioi); nínú àyíká yìí, àwọn aláṣẹ Júù tàbí àwọn olùfisùn tó ń bá Pílátù sọ̀rọ̀ ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe gbogbo àwọn Júù lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìyọrísí tàbí ìtẹ̀síwájú ìtàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Ẹ̀yin fúnra yín ẹ mú un
  rationale: Àtúmọ̀ yìí pa àṣẹ náà mọ́, ó sì fi ìtẹnumọ́ ọ̀rọ̀-arọ́pò-orúkọ ὑμεῖς hàn ní Yorùbá nípa ‘ẹ̀yin fúnra yín.’
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: gẹ́gẹ́ bí òfin yín
  rationale: κατά pẹ̀lú ẹ̀sùn-orúkọ níbí túmọ̀ sí ṣíṣe ohun kan ní ìbámu pẹ̀lú òfin wọn.
- source_word: κρίνατε αὐτόν
  choice: kí ẹ sì dá a lẹ́jọ́
  rationale: Ní àyíká ọ̀ràn ilé-ẹjọ́ yìí, ‘dá a lẹ́jọ́’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ fífi ẹjọ́ ẹni ṣe tàbí ṣèdájọ́ mọ́ láìfi ètò Róòmù kún un.
- source_word: οἱ Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì ní tààrà, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí nínú àyíká yìí ṣe kedere.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: Kò bófin mu fún wa
  rationale: ἔξεστιν ń sọ ohun tí òfin tàbí àṣẹ fàyè gbà; gbólóhùn Yorùbá yìí bá àyíká òfin mu, ó sì ṣe kedere.
- source_word: ἀποκτεῖναι οὐδένα
  choice: láti pa ẹnikẹ́ni
  rationale: ‘Pa’ pa ìtumọ̀ gbòòrò ἀποκτείνω mọ́, ‘ẹnikẹ́ni’ sì fi ààlà àìní ẹni kan pàtó hàn; àyíká ìdájọ́ ló mú kí ó túmọ̀ sí pípa ẹni gẹ́gẹ́ bí ìjìyà ikú.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Jòhánù 18:31
  choice: Àwọn Júù, pẹ̀lú àlàyé [a] pé àwọn aláṣẹ tàbí olùfisùn Júù tó wà níwájú Pílátù ni àyíká náà ń tọ́ka sí
  alternative: Àwọn aṣáájú Júù; àwọn ará Jùdíà
  rationale: Èyí pa ìrísí ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n ó dènà kí a má ka a bí ẹni pé gbogbo àwọn Júù ni a ń sọ. Àyíká ìtàn fúnra rẹ̀ dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù sí àwọn tó ń bá Pílátù sọ̀rọ̀.
- issue: Ìtumọ̀ ἔξεστιν nínú ọ̀rọ̀ nípa ìjìyà ikú
  choice: Kò bófin mu fún wa
  alternative: A kò gba wa láyè
  rationale: Yíyan ‘kò bófin mu’ mú agbára òfin inú ìjíròrò náà hàn láìdáhùn ìbéèrè ìtàn nípa orísun tàbí ìwọ̀n àṣẹ wọn ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, àkànṣe ọ̀rọ̀ ọlọ́wọ̀ àti àdánidá fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ; ‘Ẹ̀yin fúnra yín’ fi ìtẹnumọ́ Gíríìkì hàn, ‘dá a lẹ́jọ́’ sì mú àyíká òfin náà ṣe kedere.
