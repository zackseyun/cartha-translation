  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: yo
  text: Jésù dá a lóhùn pé, “Bí mo bá sọ̀rọ̀ lọ́nà tí kò tọ́, jẹ́rìí nípa ohun tí kò tọ́ náà; ṣùgbọ́n bí mo bá sọ̀rọ̀ lọ́nà tí ó tọ́, èé ṣe tí o fi ń lù mí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Jésù dá a lóhùn pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìṣe ìdáhùn hàn, ó sì pa ẹni tí a dá lóhùn mọ́ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Bí mo bá sọ ohun tí kò tọ́
  rationale: Ó pa ìtumọ̀ gbólóhùn àídájú àti ìyàtọ̀ κακῶς/καλῶς mọ́, ní èdè tí ó ṣe kedere fún òǹkàwé òde òní.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: jẹ́rìí sí ohun tí kò tọ́ náà
  rationale: “Jẹ́rìí sí” mú ìtumọ̀ ẹ̀rí ní ipò ìdájọ́ jáde; “ohun tí kò tọ́ náà” kò sọ pé ó jẹ́ ìwà búburú tàbí ẹ̀ṣẹ̀ ọ̀daràn ju bí Gíríìkì ṣe sọ lọ.
- source_word: εἰ δὲ καλῶς
  choice: ṣùgbọ́n bí mo bá sọ ohun tí ó tọ́
  rationale: A tún ọ̀rọ̀-ìṣe “sọ” ṣe fún àlàyé ní Yorùbá, nígbà tí a pa ìlòdìsí ohun tí kò tọ́ àti ohun tí ó tọ́ mọ́.
- source_word: τί με δέρεις
  choice: èé ṣe tí ìwọ fi ń lù mí?
  rationale: “Lù” jẹ́ ọ̀rọ̀ gbòòrò tí ó lè túmọ̀ sí gbígbá tàbí lílu, láì fi dandan sọ pé ìgbá ojú kan ṣoṣo tàbí lílu líle ni; “ìwọ” tẹnu mọ́ olùṣe bí ìbéèrè Gíríìkì ṣe dojú kọ ọ́.
theological_decisions:
- issue: Ìdáhùn Jésù sí ìwà ipá tí kò tẹ̀ lé ẹ̀rí òfin
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìpèníjà tó dá lórí ẹ̀rí àti ohun tí ó tọ́, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Láti mú un le sí i gẹ́gẹ́ bí ẹ̀sùn àìṣòdodo, tàbí láti rọ ohùn ìdájọ́ rẹ̀.
  rationale: Gíríìkì béèrè fún ẹ̀rí nípa ohun tí a sọ pé kò tọ́, ó sì béèrè ìdí lílu náà. Ìtumọ̀ yìí pa ìrònú méjèèjì mọ́ láì yanju ìforígbárí náà pẹ̀lú àfikún.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A kò fi àlàyé ẹsẹ̀ sílẹ̀ nítorí àṣàyàn “lù” àti “ohun tí kò tọ́” ti pa ìwọ̀n ìtumọ̀ Gíríìkì mọ́ láì nílò àfikún.
