  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: yo
  text: Jésù dáhùn pé, “Ṣé ìwọ fúnra rẹ ni o ń sọ èyí[a], tàbí àwọn ẹlòmíràn ni wọ́n sọ fún ọ nípa mi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó túmọ̀ ní tààràtà sí “láti ara rẹ,” ìyẹn ni, bóyá ọ̀rọ̀ náà pilẹ̀ láti ọ̀dọ̀ Pílátù fúnra rẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ ìṣe ìtàn tó wọ́pọ̀ fún fífi èsì fún ìbéèrè ni; ó ṣe déédé pẹ̀lú ìjíròrò yìí.
- source_word: Ἀπὸ σεαυτοῦ
  choice: fúnra rẹ
  rationale: Ó fi hàn pé ìbéèrè náà ń wá bóyá ọ̀rọ̀ náà pilẹ̀ láti ọ̀dọ̀ Pílátù fúnra rẹ; èyí jẹ́ èdè Yorùbá àdánidá tó sì pa ìtumọ̀ orísun mọ́.
- source_word: σὺ
  choice: o
  rationale: Àpólà-orúkọ Gíríìkì náà ní ìtẹnumọ́, ṣùgbọ́n àkópọ̀ ‘fúnra rẹ ni o’ ti mú ìtẹnumọ́ yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τοῦτο
  choice: èyí
  rationale: Ó tọ́ka sí ìbéèrè Pílátù tó ṣáájú, ‘èyí’ sì ṣe kedere láìfi ọ̀rọ̀ kún un.
- source_word: λέγεις
  choice: ń sọ
  rationale: Àkókò ìsinsìnyí nínú Gíríìkì bá ìṣe tó ń lọ nínú ìjíròrò mu; ‘ń sọ’ jẹ́ àdánidá ní Yorùbá.
- source_word: ἢ
  choice: tàbí
  rationale: Ó ṣàfihàn ọ̀nà kejì nínú ìbéèrè yíyan láàárín ohun méjì.
- source_word: ἄλλοι
  choice: àwọn ẹlòmíràn
  rationale: Ó tọ́ka sí àwọn ènìyàn mìíràn yàtọ̀ sí Pílátù láìsọ ẹni tí wọ́n jẹ́.
- source_word: εἶπόν σοι
  choice: ló sọ ... fún ọ
  rationale: Aorist náà bá ìṣe tó ti ṣẹlẹ̀ mu, ‘sọ ... fún ọ’ sì jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún sísọ ohun kan fún ẹnì kan.
- source_word: περὶ ἐμοῦ
  choice: nípa mi
  rationale: Ó túmọ̀ sí ohun tó kan Jésù tàbí ohun tí a sọ nípa rẹ̀.
theological_decisions:
- issue: Agbára ìbéèrè Jésù sí Pílátù
  choice: A mú un jáde gẹ́gẹ́ bí ìbéèrè nípa ibi tí ọ̀rọ̀ Pílátù ti pilẹ̀—bóyá láti ọ̀dọ̀ rẹ̀ fúnra rẹ tàbí láti ọ̀dọ̀ àwọn ẹlòmíràn.
  alternative: A lè túmọ̀ ọ́ ní ọ̀nà àlàyé sí i pé, ‘Ṣé ní ìdájọ́ tàbí ìfẹ́ inú ara rẹ ni o fi béèrè èyí?’
  rationale: Gíríìkì tẹnu mọ́ orísun ọ̀rọ̀ náà, kì í ṣe ìdí ọkàn Pílátù ní kíkún; yíyan yìí pa àìdánilójú àti ìfúnpá ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láìyanjú rẹ̀ sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó rọrùn fún gbogbo ènìyàn láti lóye. ‘Fúnra rẹ ni o’ mú ìtẹnumọ́ σὺ àti ìtumọ̀ orísun Ἀπὸ σεαυτοῦ jáde láìjẹ́ kí gbólóhùn náà le ní etí.
