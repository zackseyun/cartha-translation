id: JHN.18.21
reference: John 18:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: yo
  text: “Èé ṣe tí o fi ń bi mí léèrè?[a] Bi àwọn tí wọ́n ti gbọ́ ohun tí mo sọ fún wọn léèrè. Wò ó, àwọn wọ̀nyí mọ ohun tí mo sọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘fọ̀rọ̀ wá mi lẹ́nu wò.’ Nínú àyíká yìí, olórí àlùfáà ń ṣe ìwádìí ọ̀ràn, ṣùgbọ́n ọ̀rọ̀ náà fúnra rẹ̀ tún lè túmọ̀ sí ‘béèrè.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Èé ṣe tí o fi ń bi mí léèrè?
  rationale: Ìbéèrè yìí jẹ́ ìtakò tààrà. ‘Bí ẹnì kan léèrè’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè tọ́ka sí bíbéèrè lásán tàbí fífọ̀rọ̀ wá ẹni lẹ́nu wò, bí àyíká ìgbẹ́jọ́ ṣe fi hàn.
- source_word: ἐρώτησον
  choice: Bi ... léèrè
  rationale: Ọ̀rọ̀ àṣẹ náà béèrè ìgbésẹ̀ tààrà, ó sì pa àtúnṣe ọ̀rọ̀-ìṣe kan náà mọ́ gẹ́gẹ́ bí èdè Gíríìkì.
- source_word: τοὺς ἀκηκοότας
  choice: àwọn tí wọ́n ti gbọ́
  rationale: ‘Ti gbọ́’ fi ipò tí ìgbọ́ wọn ti yọrí sí hàn, ó sì bá perfect participle mu láìfi ‘mí’ kún ohun tí kò sí ní pàtó.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: ohun tí mo sọ fún wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ àkóónú ọ̀rọ̀, láìsọ λαλέω di ìkọ́ni ní pàtó.
- source_word: ἴδε
  choice: Wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ ìpe àfiyèsí tó ṣe kedere, tó sì jẹ́ Yorùbá òde òní.
- source_word: οὗτοι οἴδασιν
  choice: àwọn wọ̀nyí mọ
  rationale: ‘Àwọn wọ̀nyí’ pa agbára atọ́ka οὗτοι mọ́ dípò yíyí i padà sí arọ́pò-orúkọ lásán.
- source_word: ἃ εἶπον ἐγώ
  choice: ohun tí mo sọ
  rationale: Ìtumọ̀ yìí jẹ́ kedere, ó sì yẹra fún fífi ọ̀rọ̀ àfikún bí ‘èmi fúnra mi’ sínú ẹsẹ̀ náà, bó tilẹ̀ jẹ́ pé ἐγώ ní ìtẹnumọ́.
theological_decisions:
- issue: Ìró ọ̀rọ̀ ìfọ̀rọ̀wánilẹ́nuwò níwájú olórí àlùfáà
  choice: Lo ‘bi ... léèrè’ ní ìgbà méjèèjì, kí àyíká ìgbẹ́jọ́ fi agbára ìfọ̀rọ̀wánilẹ́nuwò hàn.
  alternative: Lo ‘fọ̀rọ̀ wá ... lẹ́nu wò,’ èyí tí yóò sọ ìtumọ̀ ìgbẹ́jọ́ di pàtó sí i.
  rationale: Èdè Gíríìkì lè túmọ̀ sí bíbéèrè ní gbogbogbòò tàbí fífọ̀rọ̀ wá ẹni lẹ́nu wò nínú àyíká yìí. Yíyan ọ̀rọ̀ Yorùbá tó lè gba méjèèjì kò fi ẹ̀kọ́ ìsìn tàbí ìtumọ̀ kan ṣoṣo lé ẹsẹ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì pa ìtẹnumọ́ atọ́ka ‘àwọn wọ̀nyí’ àti àtúnṣe ọ̀rọ̀-ìṣe ἐρωτάω mọ́.
