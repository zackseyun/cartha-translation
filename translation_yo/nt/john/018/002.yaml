source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: yo
  text: Júdásì náà, ẹni tí ń dà á[a], mọ ibi náà, nítorí pé ọ̀pọ̀ ìgbà ni Jésù máa ń péjọ níbẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ń fi í lé ọ̀wọ́ ẹlòmíràn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí pé ọ̀pọ̀ ìgbà ni Jésù máa ń pàdé àwọn ọmọ-ẹ̀yìn rẹ̀ níbẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: mọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí níní ìmọ̀ tàbí mímọ ohun kan; “mọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, ó sì fi hàn pé Júdásì mọ ibi náà dáadáa.
- source_word: δὲ καὶ
  choice: náà
  rationale: δὲ ń tẹ ìtàn náà síwájú láìfi ìtakora líle hàn, καὶ sì ní agbára àfikún. Nínú Yorùbá, “náà” fi agbára àfikún náà hàn lọ́nà àdánidá, kò sì pọn dandan láti fi ọ̀rọ̀ ìyípadà kan sí ìbẹ̀rẹ̀ gbólóhùn.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: ẹni tí ń dà á
  rationale: Nínú àyíká ìtàn ìjìyà Jésù, gbólóhùn náà ń tọ́ka sí ìwà Júdásì gẹ́gẹ́ bí ẹni tó ń da Jésù. Ìṣe tó ń lọ lọ́wọ́ nínú “ń dà á” bá participle ti àsìkò ìsinsìnyí mu; àlàyé ìsàlẹ̀ fúnni ní ìtumọ̀ tó sún mọ́ ‘fi lé lọ́wọ́.’
- source_word: τὸν τόπον
  choice: ibi náà
  rationale: “Ibi náà” jẹ́ ìtumọ̀ tààrà, ó sì ń tọ́ka sí ibi pàtó tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn nínú àyíká.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Níhìn-ín ὅτι ń sọ ìdí tí Júdásì fi mọ ibi náà; “nítorí pé” fi ìbáṣepọ̀ okùnfà náà hàn kedere.
- source_word: πολλάκις
  choice: ọ̀pọ̀ ìgbà
  rationale: Ó ń tọ́ka sí ohun tó ṣẹlẹ̀ léraléra; “ọ̀pọ̀ ìgbà” jẹ́ èdè Yorùbá tó wọ́pọ̀, tó sì péye.
- source_word: συνήχθη
  choice: máa ń péjọ
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ passive, ó lè ní ìtumọ̀ intransitive pé kí àwọn ènìyàn kóra jọ tàbí kí wọ́n pàdé. “Máa ń péjọ” fi ìṣe tó sábà máa ń ṣẹlẹ̀ hàn, ó sì pa àwòrán kíkóra jọ mọ́.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: μετά pẹ̀lú genitive túmọ̀ sí ìbákẹ́gbẹ́; “pẹ̀lú” ni ìbámu tó ṣe déédéé. “Àwọn ọmọ-ẹ̀yìn rẹ̀” pa ìbáṣepọ̀ olùkọ́ àti ọmọ-ẹ̀yìn mọ́.
theological_decisions:
- issue: Ìtumọ̀ παραδιδοὺς nípa Júdásì
  choice: ẹni tí ń dà á
  alternative: ẹni tí ń fi í lé wọn lọ́wọ́
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà ní agbára ìwà àdàkàdekè, nítorí náà “ń dà á” sọ ipa Júdásì kedere. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ gidi ti fífi ènìyàn lé ẹlòmíràn lọ́wọ́ mọ́ láìfi ẹni tí ‘wọn’ jẹ́ kún ọ̀rọ̀ orísun.
- issue: Ìtumọ̀ συνήχθη
  choice: Jésù máa ń péjọ níbẹ̀ pẹ̀lú àwọn ọmọ-ẹ̀yìn rẹ̀
  alternative: Jésù máa ń pàdé àwọn ọmọ-ẹ̀yìn rẹ̀ níbẹ̀
  rationale: Àṣàyàn àkọ́kọ́ pa èrò kíkóra jọ mọ́, nígbà tí àṣàyàn kejì jẹ́ Yorùbá tó rọrùn fún ìtumọ̀ ‘pàdé.’ A kò sọ pé àwọn ọmọ-ẹ̀yìn ló kó Jésù jọ, bẹ́ẹ̀ ni a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtijọ́-kò-jù, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. “Júdásì” àti “Jésù” tẹ̀ lé ìpe orúkọ tó wọ́pọ̀ nínú Yorùbá Kristẹni, “ọmọ-ẹ̀yìn” sì jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání fún μαθητής.
