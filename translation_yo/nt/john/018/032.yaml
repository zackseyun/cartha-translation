id: JHN.18.32
reference: John 18:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: yo
  text: kí ọ̀rọ̀ Jesu lè ṣẹ, èyí tí ó ti sọ láti fi hàn irú ikú tí òun yóò kú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni pé, Jesu ti tọ́ka sí ọ̀nà tí òun yóò gbà kú; ó ṣeé ṣe kó ń tọ́ka sí kíkàn án mọ́ àgbélébùú. Wo Johanu 12:32–33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó ṣe àfihàn ète tàbí àbájáde ní Yorùbá àdánidá.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: ọ̀rọ̀ Jesu
  rationale: Níbí, λόγος túmọ̀ sí ọ̀rọ̀ tàbí àsọjáde kan tí Jesu sọ, kì í ṣe oyè ‘Ọ̀rọ̀’ inú Johanu 1:1.
- source_word: πληρωθῇ
  choice: lè ṣẹ
  rationale: ‘Ṣẹ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé àsọtẹ́lẹ̀ tàbí ọ̀rọ̀ kan dé ìmúṣẹ.
- source_word: ὃν εἶπεν
  choice: èyí tí ó ti sọ
  rationale: ‘Ti sọ’ fi hàn pé Jesu ti sọ ọ̀rọ̀ náà ṣáájú ìṣẹ̀lẹ̀ tí a ń ròyìn.
- source_word: σημαίνων
  choice: tí ó fi ń tọ́ka sí
  rationale: Ó pa ìṣe participle náà mọ́ gẹ́gẹ́ bí àlàyé bí ọ̀rọ̀ Jesu ṣe ń fi irú ikú rẹ̀ hàn.
- source_word: ποίῳ θανάτῳ
  choice: irú ikú tí
  rationale: ποίῳ ń béèrè nípa irú tàbí ọ̀nà ikú, kì í ṣe òtítọ́ ikú nìkan.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: òun fẹ́ kú
  rationale: Nínú àyíká yìí, ó tọ́ka sí ikú tí ó ń bọ̀ láìfi èrò àyànmọ́ tó lágbára ju ọ̀rọ̀ Gíríìkì lọ sínú rẹ̀.
theological_decisions:
- issue: Èdè ìmúṣẹ nípa ọ̀rọ̀ tí Jesu ti sọ ṣáájú
  choice: kí ọ̀rọ̀ Jesu lè ṣẹ
  alternative: kí ohun tí Jesu sọ lè ṣẹlẹ̀
  rationale: Yíyàn ‘ṣẹ’ pa kókó ìmúṣẹ ọ̀rọ̀ Jesu mọ́, dípò yíyí i sí àsọyé pé ohun náà wulẹ̀ ṣẹlẹ̀.
- issue: Agbára μέλλω nípa ikú Jesu
  choice: òun fẹ́ kú
  alternative: a ti yàn án láti kú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọjọ́ iwájú tó sún mọ́lé; kò pọndandan kí a fi ẹ̀kọ́ àyànmọ́ tó lágbára kún un.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘òun’ láti mú kí ó ṣe kedere pé Jesu ni ẹni tí yóò kú.
