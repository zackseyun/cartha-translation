id: JHN.18.3
reference: John 18:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: yo
  text: Nítorí náà, nígbà tí Júdásì ti mú ẹgbẹ́ ọmọ ogun àti àwọn ìránṣẹ́ aláṣẹ láti ọ̀dọ̀ àwọn olórí àlùfáà àti láti ọ̀dọ̀ àwọn Farisí, ó wá sí ibẹ̀ pẹ̀lú àwọn àtùpà, àwọn ògùṣọ̀, àti àwọn ohun ìjà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú, ó sì lè fi ìtẹ̀síwájú tàbí àbájáde hàn láìsọ ìtumọ̀ rẹ̀ di ohun kan ṣoṣo.
- source_word: λαβὼν
  choice: mú ... pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Júdásì kọ́kọ́ gba àwọn ẹgbẹ́ náà láti bá a lọ kí ó tó wá sí ibẹ̀; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtẹ̀lé ìṣe náà mọ́.
- source_word: σπεῖραν
  choice: ẹgbẹ́ ọmọ ogun
  rationale: Ó tọ́ka sí ẹgbẹ́ ológun kan, bóyá ẹ̀ka kan lára ẹgbẹ́ ológun Róòmù; a kò fi dandan sọ pé gbogbo ẹgbẹ́ ńlá náà ló wà níbẹ̀.
- source_word: ὑπηρέτας
  choice: àwọn ìránṣẹ́ aláṣẹ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn òṣìṣẹ́ tàbí ẹ̀ṣọ́ tí ń ṣiṣẹ́ fún àwọn aṣáájú Júù, kì í ṣe ìránṣẹ́ ilé lásán.
- source_word: ἀρχιερέων
  choice: àwọn olórí àlùfáà
  rationale: Èyí ń tọ́ka sí àwọn aṣáájú nínú ẹgbẹ́ àwọn àlùfáà, kì í ṣe pé ọ̀pọ̀ ènìyàn ni wọ́n ń ṣe ipò àlùfáà àgbà kan náà lẹ́ẹ̀kan náà.
- source_word: Φαρισαίων
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ náà tí a gbà wọ́pọ̀ ní Yorùbá.
- source_word: ἔρχεται
  choice: ó sì wá
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí láti mú ìtàn náà yè, fọ́ọ̀mù ìtàn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìgbésẹ̀ náà mọ́ ní kedere.
- source_word: ἐκεῖ
  choice: sí ibẹ̀
  rationale: Ó tọ́ka sí ibi tí a ti mẹ́nu kàn nínú àyíká ọ̀rọ̀ tó ṣáájú.
- source_word: φανῶν
  choice: àwọn àtùpà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun ìmọ́lẹ̀ tí a lè gbé kiri; yíyan ‘àtùpà’ tún jẹ́ kí ó yàtọ̀ sí ògùṣọ̀.
- source_word: λαμπάδων
  choice: àwọn ògùṣọ̀
  rationale: Ó sábà ń tọ́ka sí iná tí a dì tàbí ohun tí ń jó bí ògùṣọ̀, èyí sì pa ìyàtọ̀ rẹ̀ sí φανῶν mọ́.
- source_word: ὅπλων
  choice: àwọn ohun ìjà
  rationale: Ó jẹ́ ọ̀rọ̀ gbogbogbò fún àwọn ohun èlò tí a fi ń jagun tàbí fi ipá múni.
theological_decisions:
- issue: Irú àwọn tó wà nínú ẹgbẹ́ tí ó wá mú Jésù àti iye wọn
  choice: A túmọ̀ σπεῖρα sí ‘ẹgbẹ́ ọmọ ogun,’ a sì túmọ̀ ὑπηρέτας sí ‘àwọn ìránṣẹ́ aláṣẹ,’ kí ẹgbẹ́ ológun àti àwọn aṣojú àwọn aláṣẹ Júù lè hàn gẹ́gẹ́ bí ẹgbẹ́ méjì tí wọ́n wá papọ̀.
  alternative: A lè sọ ní gbogbogbò pé ‘àwọn ọmọ ogun àti àwọn ẹ̀ṣọ́,’ tàbí kí a pe σπεῖρα ní ‘ẹ̀ka ọmọ ogun.’
  rationale: Ẹsẹ̀ náà ya σπεῖρα sọ́tọ̀ sí àwọn ὑπηρέται tí wọ́n wá láti ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn Farisí. Ìtumọ̀ náà kò gbọ́dọ̀ pa ìyàtọ̀ yìí rẹ́, bẹ́ẹ̀ ni kò gbọ́dọ̀ fi dájú pé gbogbo cohort Róòmù ló wà níbẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Àwọn ìránṣẹ́ aláṣẹ’ jẹ́ ọ̀rọ̀ tó gbooro tó lè gba iṣẹ́ ẹ̀ṣọ́ wọn láàyè láìfi ‘ọlọ́pàá tẹ́ńpìlì’ sínú ọ̀rọ̀ pàtàkì ju bí Gíríìkì ṣe sọ lọ. A pa àtùpà àti ògùṣọ̀ yàtọ̀ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì méjì náà ṣe yàtọ̀.
