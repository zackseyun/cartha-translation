  source_fidelity: Àtúnṣe kékeré ni a nílò. Nínú ìtumọ̀ àkọ́kọ́, ipò gbólóhùn náà lè jẹ́ kí “láti ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn Farisí” hàn bí ẹni pé ó kan ẹgbẹ́ ọmọ ogun náà pẹ̀lú àwọn ìránṣẹ́ aláṣẹ. Ní Gíríìkì, gbolohun ìpilẹ̀ṣẹ̀ yìí ń ṣàlàyé àwọn ὑπηρέτας, kì í ṣe σπεῖρα. Àtúnṣe náà mú ìyàtọ̀ yìí hàn gbangba.
  naturalness: Ìtumọ̀ tí a ṣe àtúnṣe jẹ́ Yorùbá ìgbàlódé tó rọrùn láti kà, ó sì pa ìlànà ìṣẹ̀lẹ̀ “nígbà tí ó ti ... ó wá” mọ́. “Àwọn ìránṣẹ́ aláṣẹ” jẹ́ ọ̀rọ̀ tó gbòòrò, ṣùgbọ́n ó lè kéré ní ìtumọ̀ iṣẹ́-ìṣọ́; nítorí náà, àlàyé ìsàlẹ̀ ń fún ni ní “àwọn ẹ̀ṣọ́” gẹ́gẹ́ bí yíyan míì.
  terminology: “Àwọn olórí àlùfáà,” “àwọn Farisí,” “àwọn àtùpà,” “àwọn ògùṣọ̀,” àti “àwọn ohun ìjà” bójú mu. “Ẹgbẹ́ ọmọ ogun” pa ìtumọ̀ σπεῖρα mọ́ láìjẹ́rìí pé gbogbo cohort Róòmù ni ó wà níbẹ̀.
