id: JHN.18.26
reference: John 18:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: yo
  text: Ọ̀kan lára àwọn ẹrú olórí àlùfáà[a], ẹni tí ó jẹ́ ìbátan ọkùnrin tí Peteru gé etí rẹ̀ kúrò, sọ pé, “Ṣé èmi kò rí ọ nínú ọgbà pẹ̀lú rẹ̀?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà, δούλων (douloi), lè túmọ̀ sí “àwọn ìránṣẹ́” tàbí “àwọn ẹrú,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí. Níhìn-ín, a lo “àwọn ẹrú” láti pa ipò ìdè tí ọ̀rọ̀ náà ń tọ́ka sí mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: àwọn ẹrú
  rationale: Nínú àyíká ilé olórí àlùfáà yìí, δοῦλος ń tọ́ka sí àwọn ènìyàn tí ó wà ní ipò ìdè iṣẹ́, kì í ṣe òṣìṣẹ́ lásán; “ẹrú” pa ipò àwùjọ náà mọ́.
- source_word: ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ipò àlùfáà gíga jù lọ nínú àyíká yìí.
- source_word: συγγενὴς ὢν
  choice: ẹni tí ó jẹ́ ìbátan
  rationale: Ó mú gbólóhùn aláìlópìn Gíríìkì náà jáde ní Yorùbá àdánidá, ó sì fi hàn pé ẹni tó ń sọ̀rọ̀ jẹ́ ìbátan ẹni tí a gé etí rẹ̀.
- source_word: οὗ
  choice: ọkùnrin tí ... etí rẹ̀
  rationale: A mú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
- source_word: ἀπέκοψεν
  choice: gé ... kúrò
  rationale: Ó sọ ìṣe gígé etí náà kúrò ní kíkún, bí ọ̀rọ̀ Gíríìkì ṣe túmọ̀ sí.
- source_word: ὠτίον
  choice: etí
  rationale: Ìtumọ̀ tààrà àti èdè Yorùbá àdánidá; a kò nílò láti fi ìrísí àdínkù inú ọ̀rọ̀ Gíríìkì hàn.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Ṣé èmi kò rí ọ
  rationale: Ìbéèrè yìí ń retí ìdáhùn pé bẹ́ẹ̀ ni, ó sì pa ìtẹnumọ́ lórí ἐγώ (“èmi”) mọ́.
- source_word: ἐν τῷ κήπῳ
  choice: nínú ọgbà
  rationale: “Ọgbà” jẹ́ ìtumọ̀ Yorùbá tó bójú mu fún κῆπος ní àyíká ibi tí wọ́n ti mú Jésù.
- source_word: μετ’ αὐτοῦ
  choice: pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ tààrà; arọ́pò-orúkọ náà ń tọ́ka sí Jésù gẹ́gẹ́ bí àyíká ṣe fi hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ δοῦλος nínú àyíká ilé tí kì í ṣe àpèjúwe ẹ̀mí
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: “Ẹrú” kò rọ ipò ìdè tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ní àyíká yìí; àkọsílẹ̀ ìsàlẹ̀ fi yíyan “ìránṣẹ́” hàn láìpa ìtumọ̀ àkọ́kọ́ rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “Ṣé” fún ìbéèrè àdánidá tí ń retí ìdáhùn rere, a sì fi “èmi” hàn láti pa ìtẹnumọ́ Gíríìkì mọ́.
