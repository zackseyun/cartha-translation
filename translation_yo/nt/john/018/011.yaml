id: JHN.18.11
reference: John 18:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: yo
  text: Nítorí náà, Jésù sọ fún Pétérù pé, “Fi idà náà sínú àkọ rẹ̀[a]. Ṣé èmi kò gbọdọ̀ mu ago tí Bàbá ti fi fún mi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àkọ” níbí túmọ̀ sí àkọ idà, ìyẹn ohun tí a fi ń bo idà tí a sì ń kó o sí.
    reason: lexical_alternative
  - marker: b
    text: “Ago” jẹ́ àkàwé Bíbélì fún ìjìyà tàbí ìpín tí Ọlọ́run yàn. Fi wé àdúrà Jésù ní Gẹtisémánì (Mátíù 26:39; Máàkù 14:36; Lúùkù 22:42).
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ipa ọ̀rọ̀ àsopọ̀ mọ́, ó sì fi hàn pé ohun tí Jésù sọ jẹ́ ìdáhùn sí ohun tí Pétérù ṣẹ̀ṣẹ̀ ṣe.
- source_word: Βάλε
  choice: Fi … sínú
  rationale: Nínú àyíká yìí, àṣẹ náà túmọ̀ sí fífi idà padà sí ibi tí a ń kó o sí; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: μάχαιραν
  choice: idà
  rationale: “Idà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun ìjà olójú irin yìí, láì fi irú tàbí ìwọ̀n kan tí Gíríìkì kò mú dájú kún un.
- source_word: θήκην
  choice: àkọ
  rationale: “Àkọ” ni ohun tí a fi ń bo, tí a sì ń kó idà sí; ó pa àwòrán gidi inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ποτήριον
  choice: ago
  rationale: A pa àkàwé “ago” mọ́ dípò ṣíṣe àlàyé rẹ̀ sínú ẹsẹ̀ náà, nítorí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àwòrán yìí.
- source_word: δέδωκέν
  choice: ti fi fún mi
  rationale: Ìkọ̀lé “ti fi fún mi” fi hàn pé fífún náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ṣì wà ní báyìí, gẹ́gẹ́ bí perfect tense Gíríìkì.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Ó tẹ̀ lé ọ̀nà tí Jòhánù gbà ń tọ́ka sí Baba, láì fi “Baba mi” tí kò sí ní pàtó nínú Gíríìkì kún un.
- source_word: οὐ μὴ πίω αὐτό;
  choice: Èmi kì yóò ha mu …?
  rationale: Ìbéèrè àsọyé yìí ń retí ìdáhùn pé Jésù yóò mu ago náà ní tòótọ́. “Kì yóò ha” pa agbára ìbéèrè náà mọ́ láì sọ ọ́ di gbólóhùn àlàyé.
theological_decisions:
- issue: Ìtumọ̀ “ago”
  choice: A pa “ago” mọ́ gẹ́gẹ́ bí àkàwé fún ohun tí Baba yàn fún Jésù, pẹ̀lú ìjìyà tó wà nínú rẹ̀.
  alternative: Kí a túmọ̀ ọ́ ní tààrà sí “ìjìyà,” “ikú,” tàbí “ìbínú Ọlọ́run.”
  rationale: Ẹsẹ̀ náà kò túmọ̀ àkàwé náà sí ohun kan ṣoṣo ní pàtó. Pípa “ago” mọ́ ń dáàbò bo ìjìnlẹ̀ àti ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ Jésù pẹ̀lú Baba nínú “Baba ti fi fún mi”
  choice: A sọ ọ́ ní tààrà gẹ́gẹ́ bí ìgbọràn Jésù sí Baba.
  alternative: Kí a fi àlàyé ẹ̀kọ́ ìgbàgbọ́ sí i tàbí kí a sọ pé “Baba mi ti yan èyí fún mi.”
  rationale: Ọ̀rọ̀ náà fi ìgbọràn àtinúwá Jésù hàn, ṣùgbọ́n kò béèrè pé kí ìtumọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbéléwọ̀n, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìkọ̀lé “kì yóò ha” jẹ́ ti ọ̀wọ̀ díẹ̀, ṣùgbọ́n ó bá ohùn ìbéèrè àsọyé tó lágbára nínú Gíríìkì mu.
