id: JHN.18.16
reference: John 18:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù ń dúró níta lẹ́gbẹ̀ẹ́ ẹnu ọ̀nà. Nítorí náà, ọmọ-ẹ̀yìn mìíràn náà, ẹni tí olórí àlùfáà mọ̀[a], jáde lọ bá obìnrin tó ń ṣọ́ ẹnu ọ̀nà sọ̀rọ̀, ó sì mú Pétérù wọlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹni tó jẹ́ ojúlùmọ̀ olórí àlùfáà.’ Ọ̀rọ̀ Gíríìkì náà kò sọ bí ìbáṣepọ̀ wọn ṣe sún mọ́ra tó.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: ń dúró
  rationale: Ìrísí ọ̀rọ̀-ìṣe náà fi ipò tí ó ń bá a lọ hàn; ‘ń dúró’ sọ ìtumọ̀ yìí ní Yorùbá àdánidá láì fi dandan hàn pé ó ti dúró níbẹ̀ fún àkókò gígùn.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: níta lẹ́gbẹ̀ẹ́ ẹnu ọ̀nà
  rationale: Èyí pa ‘níta’ àti ipò rẹ̀ nítòsí ibi ìwọlé mọ́. ‘Ẹnu ọ̀nà’ bá θύρα mu ju ‘ẹnubodè’ lọ, bí ó tilẹ̀ jẹ́ pé àyíká náà lè jẹ́ ẹnu ọ̀nà àgbàlá.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: ọmọ-ẹ̀yìn kejì náà
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής nínú ìtàn Ìhìn Rere, ó sì pa ìbáṣepọ̀ ẹni tó ń tẹ̀ lé olùkọ́ mọ́.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: ẹni tí olórí àlùfáà mọ̀
  rationale: Ìtumọ̀ tààrà yìí kò pinnu bóyá wọ́n jẹ́ ọ̀rẹ́ tímọ́tímọ́ tàbí ojúlùmọ̀ lásán; ó pa àìṣedéédé tó wà nínú γνωστός mọ́.
- source_word: ἀρχιερεύς
  choice: olórí àlùfáà
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ipò àlùfáà gíga jù lọ nínú àyíká Júù.
- source_word: θυρωρῷ
  choice: obìnrin tó ń ṣọ́ ẹnu ọ̀nà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tó wà ní ibi ìwọlé láti máa ṣọ́ ọ; àpilẹ̀kọ akọ-abo abo nínú Gíríìkì fi hàn pé obìnrin ni ẹni náà, nítorí náà a sọ ọ́ kedere ní Yorùbá.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: lọ bá obìnrin tó ń ṣọ́ ẹnu ọ̀nà sọ̀rọ̀
  rationale: Nítorí a kò sọ ohun tí ó wí ní tààrà, ‘bá … sọ̀rọ̀’ jẹ́ ọ̀nà àdánidá láti túmọ̀ ìṣe náà.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: mú Pétérù wọlé
  rationale: Èyí sọ ìgbésẹ̀ mímú un láti òde wọ inú ilé ní Yorùbá tó rọrùn, láì fi àlàyé míì kún un.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtòlẹ́sẹẹsẹ gbólóhùn náà jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n ó pa ìtẹ̀síwájú ìṣe, ipò Pétérù níta, abo ẹni tó ń ṣọ́ ẹnu ọ̀nà, àti àìdájú nípa bí ọmọ-ẹ̀yìn kejì ṣe mọ olórí àlùfáà mọ́.
