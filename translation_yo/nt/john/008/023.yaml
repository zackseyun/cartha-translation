id: JHN.8.23
reference: John 8:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: yo
  text: Ó sì ń sọ fún wọn pé, “Ẹ̀yin ti ìsàlẹ̀ ni[a]; èmi ti òkè ni. Ẹ̀yin ti ayé yìí ni[b]; èmi kì í ṣe ti ayé yìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin jẹ́ ti àwọn ohun tí ó wà ní ìsàlẹ̀ … èmi jẹ́ ti àwọn ohun tí ó wà ní òkè.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Jòhánù, “ayé” sábà máa ń tọ́ka, kì í ṣe sí ilẹ̀ ayé lásán, bí kò ṣe sí ètò ìgbé ayé ènìyàn tí ó yà kúrò lọ́dọ̀ Ọlọ́run.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: ń sọ
  rationale: Àmì àkókò tí kò pé nínú Gíríìkì ń fi ìṣe tí ń lọ lọ́wọ́ hàn; “ń sọ” mú èyí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: Ὑμεῖς / ἐγὼ
  choice: Ẹ̀yin / èmi
  rationale: A pa àwọn arọ́pò-orúkọ tí a tẹnumọ́ nínú Gíríìkì mọ́, kí ìyàtọ̀ tó wà láàárín Jésù àti àwọn olùgbọ́ rẹ̀ lè hàn kedere.
- source_word: ἐκ τῶν κάτω
  choice: ti ìsàlẹ̀ ni
  rationale: Ó pa àwòrán ibi àti ìyàtọ̀ rẹ̀ sí “ti òkè” mọ́ láì sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó sí i.
- source_word: ἐκ τῶν ἄνω
  choice: ti òkè ni
  rationale: Ó bá “ti ìsàlẹ̀ ni” ṣe àtakò lọ́nà tó ṣe kedere, ó sì pa àwòrán inaro ti Jòhánù mọ́.
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tó gbòòrò tí ó lè túmọ̀ sí gbogbo ayé tàbí ètò ènìyàn tó yà sí Ọlọ́run, gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe ń ṣiṣẹ́ nínú Jòhánù.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: ayé yìí
  rationale: A pa atọ́ka “yìí” mọ́ ní ibùdó méjèèjì, kí àgbègbè tàbí ètò tí wọ́n jẹ́ tirẹ̀ àti èyí tí Jésù kì í ṣe tirẹ̀ lè yàtọ̀.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: èmi kì í ṣe ti ayé yìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìkọ̀ àti èrò orísun tàbí jíjẹ́ ti ohun kan mọ́, láì sọ ọ́ di pé “èmi kò jẹ́ ti ẹgbẹ́ ayé yìí” nìkan.
theological_decisions:
- issue: Ìtumọ̀ ìyàtọ̀ láàárín “ti ìsàlẹ̀/ti òkè” àti “ti ayé yìí”
  choice: A pa èdè tó ń tọ́ka sí orísun tàbí àgbègbè ìwàláàyè mọ́, láì ṣàlàyé rẹ̀ sí ẹ̀kọ́ ìgbàgbọ́ kan tóóró.
  alternative: A lè túmọ̀ rẹ̀ lọ́nà tó sọ ìyàtọ̀ ìwà rere àti ìwà búburú, tàbí ti ọ̀run àti ti ilẹ̀, ní tààràtà.
  rationale: Ọ̀rọ̀ Gíríìkì mú ìyàtọ̀ tó lágbára wá, ṣùgbọ́n kò ṣàlàyé àwòrán náà débi pé kí ìtumọ̀ fi ìtumọ̀ kan ṣoṣo lé e lórí. “Ti ìsàlẹ̀,” “ti òkè,” àti “ti ayé yìí” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìyàtọ̀ nípa Kristi mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Ìkọ̀ “kì í ṣe ti” jẹ́ àdánidá nínú Yorùbá, ó sì pa ìtẹnumọ́ “èmi” àti àtakò àwọn gbólóhùn náà mọ́.
