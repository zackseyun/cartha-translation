  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: yo
  text: Nítorí náà, àwọn Farisí sọ fún un pé, “Ìwọ ń jẹ́rìí nípa ara rẹ; ẹ̀rí rẹ kì í ṣe òtítọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rí rẹ kò bófin mu.” Ọ̀rọ̀ Gíríìkì náà ní tààrà sí “kì í ṣe òtítọ́,” ṣùgbọ́n nínú àyíká yìí ó tún lè ní ìtumọ̀ pé ẹ̀rí náà kò ní ìfẹ́sẹ̀mulẹ̀ tàbí ìwúlò ní ti òfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ń fi ìtẹ̀síwájú àti ìyọrísí ọ̀rọ̀ tó ṣáájú hàn; ó bá ìforígbárí inú àyíká náà mu.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: àwọn Farisí sọ fún un
  rationale: Ìtumọ̀ àdánidá ní Yorùbá ni èyí, ó sì pa arọ́pò-orúkọ αὐτῷ mọ́ láì fi ‘Jésù’ kún un.
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: Ìwọ ń jẹ́rìí nípa ara rẹ
  rationale: ‘Ìwọ’ fi ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì hàn; ‘ń jẹ́rìí’ ṣe àfihàn ìṣe àsìkò ìsinsìnyí, ‘nípa ara rẹ’ sì pa kókó ẹ̀rí náà mọ́.
- source_word: ἡ μαρτυρία σου
  choice: ẹ̀rí rẹ
  rationale: ‘Ẹ̀rí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún testimony, ó sì lè ṣiṣẹ́ nínú ọ̀rọ̀ òtítọ́ àti ọ̀rọ̀ ìdájọ́.
- source_word: οὐκ ἔστιν ἀληθής
  choice: kò jẹ́ òtítọ́
  rationale: Èyí ni ìbámu tààrà jù lọ pẹ̀lú ἀληθής, ó sì kò fi agbára dín ìtumọ̀ náà sí ‘kò bófin mu’ nìkan.
theological_decisions:
- issue: Ìtumọ̀ àtakò àwọn Farisí sí ẹ̀rí ẹni nípa ara rẹ
  choice: ẹ̀rí rẹ kò jẹ́ òtítọ́
  alternative: ẹ̀rí rẹ kò lẹ́sẹ̀ nílẹ̀
  rationale: Àyíká náà ní ìró ọ̀ràn òfin, ṣùgbọ́n ἀληθής gbòòrò ju ọ̀rọ̀ òfin pàtó lọ. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ nípa òtítọ́ àti ìwúlò ẹ̀rí mọ́ láì pinnu ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá àjọṣe tó bójú mu, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
