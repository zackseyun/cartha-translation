id: JHN.8.58
reference: John 8:58
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: yo
  text: Jésù sọ fún wọn pé, “Lóòótọ́, lóòótọ́ ni mo sọ fún yín, kí Ábúráhámù tó bẹ̀rẹ̀ sí í wà[a], Èmi ni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “kí a tó bí Ábúráhámù.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ tí ó gbòòrò sí i: “wá sí wíwà” tàbí “bẹ̀rẹ̀ sí í wà.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Mo ti wà.” Gíríìkì náà ka pé “Èmi ni,” ó sì pa ìrísí àsìkò ìsinsìnyí mọ́, pẹ̀lú ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ tí ó ṣeé ṣe nínú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Jésù sọ fún wọn pé
  rationale: Ó jẹ́ ìtumọ̀ àdánidá tí ó sì sún mọ́ ọ̀rọ̀ Gíríìkì fún ọ̀rọ̀ ìṣáájú ìtàn náà.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ tí a sọ lẹ́ẹ̀mejì mọ́, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: λέγω ὑμῖν
  choice: ni mo sọ fún yín
  rationale: Ó fi ìlànà ọ̀rọ̀ pàtàkì tí Jésù máa ń lò nínú Jòhánù hàn lọ́nà Yorùbá tí ó rọrùn.
- source_word: πρὶν
  choice: kí … tó
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi ìṣẹ̀lẹ̀ kan tí ó ṣáájú òmíràn hàn.
- source_word: Ἀβραὰμ
  choice: Ábúráhámù
  rationale: Orúkọ Bíbélì tí ó ti wọ́pọ̀ ní èdè Yorùbá, pẹ̀lú àmì ohùn.
- source_word: γενέσθαι
  choice: wà láàyè
  rationale: Nínú gbólóhùn ‘kí Ábúráhámù tó wà láàyè,’ ó sọ ìbẹ̀rẹ̀ wíwà Ábúráhámù ní ọ̀nà Yorùbá tí ó ṣe kedere, láì dín ọ̀rọ̀ náà kù sí ìbí nìkan; àlàyé ìsàlẹ̀ fi ìtumọ̀ gbooro rẹ̀ hàn.
- source_word: ἐγὼ εἰμί
  choice: Èmi ni
  rationale: Ó pa ìrísí àsìkò ìsinsìnyí àti ìtẹnumọ́ arọ́pò-orúkọ mọ́, ó sì jẹ́ kí agbára àti ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ tí ó ṣeé ṣe nínú ọ̀rọ̀ náà dúró.
theological_decisions:
- issue: Ìtumọ̀ ἐγὼ εἰμί ní ibi tí ó ní ìjẹ́pàtàkì nípa ẹni tí Kristi jẹ́
  choice: Èmi ni
  alternative: Mo ti wà
  rationale: Gíríìkì náà wà ní àsìkò ìsinsìnyí, ó sì dúró ní ọ̀nà tí ó lágbára. ‘Èmi ni’ pa ìrísí gírámà àti ìṣọ̀kan rẹ̀ mọ́, ó sì jẹ́ kí ìbáṣepọ̀ tí ó ṣeé ṣe pẹ̀lú ọ̀rọ̀ ìdánimọ̀ Ọlọ́run hàn láì fi ìtumọ̀ ẹ̀kọ́ kan lé e lórí. ‘Mo ti wà’ lè mú ìtumọ̀ náà rọrùn, ṣùgbọ́n ó lè dín ìforígbárí ọ̀rọ̀ náà kù sí wíwà ṣáájú Ábúráhámù nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Lóòótọ́, lóòótọ́’ láti pa ìtẹnumọ́ mọ́, àti ‘Èmi ni’ láti pa ìrísí ọ̀rọ̀ Gíríìkì àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ rẹ̀ mọ́. Gbogbo àmì àlàyé ìsàlẹ̀ farahàn nínú ọ̀rọ̀ pàtàkì.
