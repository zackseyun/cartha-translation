source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: yo
  text: Ṣé ìwọ kò tóbi ju Ábúráhámù, baba wa, ẹni tí ó kú, lọ ni?[a] Àwọn wòlíì náà sì kú. Ta ni ìwọ ń fi ara rẹ hàn pé ìwọ jẹ́?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìbéèrè Gíríìkì náà ni a gbé kalẹ̀ láti retí ìdáhùn òdì, ìyẹn, ‘Rárá, ìwọ kò tóbi ju Ábúráhámù lọ.’
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà jù, ‘Ta ni ìwọ ń sọ ara rẹ di?’ Ìtumọ̀ àṣà-ọ̀rọ̀ náà ni, ‘Ta ni ìwọ ń fi ara rẹ hàn pé ìwọ jẹ́?’ tàbí ‘Ta ni ìwọ ń sọ pé ìwọ jẹ́?’
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Ṣé ìwọ ... ni?
  rationale: Àkópọ̀ ‘ṣé ... ni?’ pẹ̀lú ìbéèrè yìí ń fi ìfojúsọ́nà pé ìdáhùn kì í ṣe bẹ́ẹ̀ hàn ní Yorùbá, ó sì pa ohùn ìpèníjà mọ́.
- source_word: μείζων
  choice: tóbi ju ... lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ipò tàbí ọlá ẹni wé ti ẹlòmíràn, láì fi ìtumọ̀ tóóró kan lé ọ̀rọ̀ náà lórí.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: Ábúráhámù baba wa
  rationale: Ó pa ìjẹ́ baba ńlá ìran àti ọlá tí ‘πατήρ’ ní nínú àyíká ọ̀rọ̀ náà mọ́.
- source_word: ὅστις ἀπέθανεν
  choice: Òun kú
  rationale: Aorist náà tọ́ka sí òtítọ́ ìṣẹ̀lẹ̀ ikú Ábúráhámù ní ìtàn; ‘kú’ ni ìtumọ̀ tààrà àti àdánidá.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: àwọn wòlíì náà sì kú
  rationale: ‘Náà sì’ fi àfikún àpẹẹrẹ tó jọ ti Ábúráhámù hàn ní Yorùbá tó rọrùn.
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Ta ni ìwọ ń pe ara rẹ sí?
  rationale: 'Èyí sọ ìtumọ̀ àṣà-ọ̀rọ̀ náà ní Yorùbá àdánidá: ẹni tí Jesu ń sọ tàbí ń fi ara rẹ̀ hàn pé òun jẹ́, pẹ̀lú ohùn ẹ̀sùn rẹ̀.'
theological_decisions:
- issue: Ìpèníjà nípa ipò Jesu ní ìfiwéra pẹ̀lú Ábúráhámù àti àwọn wòlíì
  choice: A ṣe ìbéèrè náà bí ìpèníjà tó ń retí ìdáhùn òdì, láì dín agbára rẹ̀ kù.
  alternative: ‘Ṣé ìwọ tóbi ju Ábúráhámù baba wa lọ?’ gẹ́gẹ́ bí ìbéèrè tí kò fi ìfojúsọ́nà ìdáhùn hàn kedere.
  rationale: μή fi hàn pé àwọn olùsọ̀rọ̀ retí pé ìdáhùn yóò jẹ́ ‘rárá.’ Ìtumọ̀ náà pa ìforígbárí nípa ìdánimọ̀ àti àṣẹ Jesu mọ́, láì dá a láhùn nípasẹ̀ ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘tóbi ju ... lọ’ fún μείζων àti ‘ń pe ara rẹ sí’ fún àṣà-ọ̀rọ̀ τίνα σεαυτὸν ποιεῖς. Àmì ohùn ni a fi sí ibi tí ó bá àṣà Yorùbá mu.
