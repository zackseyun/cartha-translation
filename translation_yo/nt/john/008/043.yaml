source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: yo
  text: Èé ṣe tí ẹ kò fi lóye ọ̀nà tí mo ń gbà sọ̀rọ̀? Nítorí pé ẹ kò lè gbọ́ ọ̀rọ̀ mi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìsọ̀rọ̀ mi” tàbí “èdè mi.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí bí Jésù ṣe ń sọ̀rọ̀; ó yàtọ̀ sí “ọ̀rọ̀ mi” nínú gbólóhùn tó tẹ̀ lé e.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ kò ní agbára láti gbọ́ ọ̀rọ̀ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: ọ̀nà tí mo ń gbà sọ̀rọ̀
  rationale: Ó tọ́ka sí bí Jésù ṣe ń sọ̀rọ̀, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí λόγος, èyí tí ó tẹ̀ lé e tí ó ń tọ́ka sí ọ̀rọ̀ tàbí ìhìn rẹ̀.
- source_word: γινώσκετε
  choice: lóye
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí lílóye ohun tí Jésù ń sọ, kì í ṣe mímọ̀ ọ́n lásán.
- source_word: ἀκούειν
  choice: gbọ́
  rationale: Èyí pa ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ Gíríìkì mọ́ láì fi ìtẹ́wọ́gbà tàbí àìfẹ́ gbọ́ kún un ní gbangba.
- source_word: λόγον
  choice: ọ̀rọ̀
  rationale: Ó lè tọ́ka sí ọ̀rọ̀ tàbí ìhìn Jésù; ‘ọ̀rọ̀’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìyàtọ̀ sí λαλιὰ mọ́.
- source_word: οὐ δύνασθε
  choice: ẹ kò lè
  rationale: Ó sọ àìlèṣe ní tààrà, kì í ṣe àìfẹ́ nìkan; gbolohun yìí sì bá Yorùbá òde òní mu.
- source_word: ὅτι
  choice: Nítorí pé
  rationale: Ó mú ìdí fún ìbéèrè tó ṣáájú wọlé ní kedere.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: mo / mi
  rationale: Fífi ‘mo’ sínú gbólóhùn ‘ọ̀nà tí mo ń gbà sọ̀rọ̀’ àti ‘mi’ lẹ́yìn ‘ọ̀rọ̀’ jẹ́ ọ̀nà àdánidá láti fi ìní hàn ní Yorùbá.
theological_decisions:
- issue: Irú àìlèṣe tó wà nínú ‘ẹ kò lè gbọ́ ọ̀rọ̀ mi’
  choice: Ṣe àfihàn rẹ̀ ní tààrà gẹ́gẹ́ bí àìlèṣe, láì ṣàlàyé ohun tó fa á nípa ẹ̀kọ́ ìgbàgbọ́.
  alternative: Kí a túmọ̀ ọ́ sí àìfẹ́ nípa ìwà, líle ọkàn gẹ́gẹ́ bí ìdájọ́, tàbí àìlera nípa ẹ̀mí.
  rationale: Ẹsẹ̀ náà sọ pé wọn kò lè gbọ́, ṣùgbọ́n kò ṣàlàyé gbogbo ohun tó fa àìlèṣe náà; ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, níwọ̀n bí ọ̀rọ̀ Gíríìkì náà ti jẹ́ ẹni kejì ọ̀pọ̀. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
