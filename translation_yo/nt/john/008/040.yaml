  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsìnyí, ẹ̀ ń wá ọ̀nà láti pa mí, ènìyàn kan tí mo ti sọ òtítọ́ tí mo gbọ́ láti ọ̀dọ̀ Ọlọ́run fún yín. Abrahamu kò ṣe èyí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ṣùgbọ́n nísinsìnyí
  rationale: Ó pa ìtakora δέ àti ìtọ́kasí àkókò νῦν mọ́ ní Yorùbá àdánidá.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: ẹ̀ ń wá ọ̀nà láti pa mí
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ó ń lọ lọ́wọ́ àti ète láti pa Jesu hàn, láìfi ìtumọ̀ òfin tàbí ìdálẹ́bi kún un.
- source_word: ἄνθρωπον
  choice: èmi ẹni
  rationale: Ní àyíká gbólóhùn Yorùbá, “èmi ẹni tí” tọ́ka sí Jesu gẹ́gẹ́ bí ènìyàn lọ́nà àdánidá, láìsọ ẹ̀dá ènìyàn rẹ̀ di aláìṣe kedere tàbí fi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
- source_word: τὴν ἀλήθειαν
  choice: òtítọ́
  rationale: Ó mú ohun pàtó tí Jesu sọ wá síwájú; Yorùbá kò nílò àfihàn article bí ti Gíríìkì.
- source_word: ὑμῖν λελάληκα
  choice: ó ti sọ ... fún yín
  rationale: “Ó ti sọ” fi perfect náà hàn gẹ́gẹ́ bí ọ̀rọ̀ tí a ti sọ tí ó sì ṣì ní ìṣe nísinsìnyí; “fún yín” jẹ́ àdánidá fún ẹni tí a sọ ọ̀rọ̀ náà sí.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: tí mo gbọ́ láti ọ̀dọ̀ Ọlọ́run
  rationale: “Láti ọ̀dọ̀” ṣàfihàn orísun ìhìn náà ní kedere láìtúmọ̀ παρά sí wíwà ní iwájú Ọlọ́run.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Abrahamu kò ṣe èyí
  rationale: Ó tẹ̀lé ìtumọ̀ Gíríìkì ní tààrà, ó sì pa ìtakora pẹ̀lú ìwà Abrahamu mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπον nínú bí Jesu ṣe ń tọ́ka sí ara rẹ̀
  choice: èmi ẹni
  alternative: ọkùnrin kan / ènìyàn kan
  rationale: Ìtòlẹ́sẹẹsẹ “èmi ẹni tí” jẹ́ Yorùbá tí ó rọrùn, ó sì jẹ́ kí Jesu pe ara rẹ̀ ní ẹni ènìyàn láìdín ìjẹ́ ènìyàn rẹ̀ kù tàbí mú ọ̀rọ̀ náà dà bí ẹni pé ó ń sọ nípa ẹlòmíràn.
- issue: Orísun ọ̀rọ̀ Jesu nínú παρὰ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  alternative: láti ọ̀dọ̀ Baba
  rationale: Gíríìkì ní “Ọlọ́run,” kì í ṣe “Baba”; a kò fi orúkọ ẹ̀kọ́ ìgbàgbọ́ tí ó ṣe pàtó sí i ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọ̀wọ̀, òde òní, ó sì ṣeé lóye fún òǹkàwé gbogbo ènìyàn. A lo “ẹ̀” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn nítorí ὑμεῖς/ὑμῖν.
