id: JHN.8.31
reference: John 8:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: yo
  text: Nítorí náà, Jésù ń sọ fún àwọn Júù tí wọ́n ti gbà á gbọ́[a] pé, “Bí ẹ̀yin bá dúró nínú ọ̀rọ̀ mi, ẹ̀yin jẹ́ ọmọ-ẹ̀yìn mi ní tòótọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àwọn Júù tí wọ́n ti ní ìgbàgbọ́ nínú rẹ̀.” Ohun tí Gíríìkì sọ ní tààrà ni “tí wọ́n ti gbà á gbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ń sọ
  rationale: Àkókò imperfect ní Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ ní ìgbà àtijọ́; ‘ń sọ’ pa ìrísí ìṣe tí ń tẹ̀ síwájú yìí mọ́ nínú ìtàn Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú, láìfi agbára ìparí ọgbọ́n tó pọ̀ ju ti Gíríìkì lọ kún un.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: fún àwọn Júù tí wọ́n ti gbà á gbọ́
  rationale: ‘Tí wọ́n ti gbà á gbọ́’ fi perfect participle hàn gẹ́gẹ́ bí ìṣe tó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà, ó sì tú αὐτῷ ní tààrà gẹ́gẹ́ bí ẹni tí wọ́n gba ọ̀rọ̀ rẹ̀ gbọ́, dípò fífi ‘nínú rẹ̀’ kún ọ̀rọ̀ àkọ́kọ́.
- source_word: Ἐὰν
  choice: Bí … bá
  rationale: Ìlànà ‘Bí … bá’ ni ọ̀nà Yorùbá àdánidá láti fi gbólóhùn oníṣ条件 subjunctive hàn.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Fífi arọ́pò-orúkọ náà hàn ní kedere pa ìtẹnumọ́ tó wà nínú Gíríìkì mọ́.
- source_word: μείνητε
  choice: dúró
  rationale: ‘Dúró’ pa àwòrán Jòhánù ti wíwà tàbí títẹ̀síwájú nínú ohun kan mọ́, láìlo ọ̀rọ̀ àtijọ́ tàbí ṣíṣe àlàyé ju bó ṣe yẹ lọ.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: nínú ọ̀rọ̀ mi
  rationale: ‘Ọ̀rọ̀ mi’ pa ìtumọ̀ λόγος gẹ́gẹ́ bí ọ̀rọ̀ tàbí ẹ̀kọ́ Jésù mọ́, pẹ̀lú ìró pàtàkì ọ̀rọ̀ náà nínú Ìhìn Rere Jòhánù.
- source_word: ἀληθῶς
  choice: ní tòótọ́
  rationale: Ó fi ìjẹ́mímọ́ àti òtítọ́ ipò ọmọ-ẹ̀yìn hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: μαθηταί μού ἐστε
  choice: ọmọ-ẹ̀yìn mi ni ẹ̀yin
  rationale: Ìṣètò gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtẹnumọ́ predicate náà àti arọ́pò-orúkọ ὑμεῖς mọ́.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω pẹ̀lú dative αὐτῷ
  choice: tí wọ́n ti gbà á gbọ́
  alternative: tí wọ́n ti ní ìgbàgbọ́ nínú rẹ̀
  rationale: Gíríìkì lo arọ́pò-orúkọ dative láìlo εἰς. Nítorí náà, ọ̀rọ̀ pàtàkì tú un ní tààrà gẹ́gẹ́ bí gbígba Jésù gbọ́, kí ó má bàa fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó kún ju ohun tí ìkọ̀wé sọ lọ sí i. Àṣàyàn tí ó wọ́pọ̀ nínú ọ̀rọ̀ Jòhánù wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní ọlá, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo ‘dúró nínú ọ̀rọ̀ mi’ láti pa àwòrán àti ìró ọ̀rọ̀ Jòhánù mọ́, bí ó tilẹ̀ jẹ́ pé ‘tẹ̀ síwájú nínú ẹ̀kọ́ mi’ lè jẹ́ àlàyé tó rọrùn sí i.
