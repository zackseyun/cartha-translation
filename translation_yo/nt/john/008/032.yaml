  edition: SBLGNT
  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: yo
  text: Ẹ ó sì mọ òtítọ́[a], òtítọ́ náà yóò sì sọ yín di òmìnira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ó wá mọ òtítọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ ẹsẹ yìí kò sọ irú òmìnira náà pàtó; àyíká ọ̀rọ̀ tó yí i ká so ó pọ̀ mọ́ òmìnira kúrò lọ́wọ́ ẹ̀ṣẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: ẹ ó mọ
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ọjọ́ iwájú, ó sì túmọ̀ ní tààrà sí ‘ẹ ó mọ.’ Èdè yìí jẹ́ àdánidá ní Yorùbá, kò sì fi dandan mú ìtumọ̀ náà lọ sí ‘ẹ ó bẹ̀rẹ̀ sí í mọ,’ bí ó tilẹ̀ jẹ́ pé àlàyé yẹn ṣeé ṣe.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: òtítọ́ / òtítọ́ náà
  rationale: A pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́. ‘Òtítọ́ náà’ nínú gbólóhùn kejì fi hàn pé òtítọ́ kan náà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ni.
- source_word: ἐλευθερώσει
  choice: yóò sọ ... di òmìnira
  rationale: 'Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára ìṣe okùnfà ọ̀rọ̀ Gíríìkì mọ́: òtítọ́ náà ni yóò mú kí wọ́n di òmìnira.'
- source_word: ὑμᾶς
  choice: yín
  rationale: ‘Yín’ jẹ́ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ nínú ipò àfẹ̀; ó pa ìtumọ̀ ọ̀pọ̀ inú Gíríìkì mọ́ láìfi ìtẹnumọ́ míì kún un.
- source_word: καὶ ... καὶ
  choice: sì ... sì
  rationale: Lílo ‘sì’ lẹ́ẹ̀mejì pa ìṣọ̀kan àti ìlọsíwájú àwọn gbólóhùn Gíríìkì méjèèjì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú òmìnira tí ‘òtítọ́ náà yóò sọ yín di òmìnira’ ń tọ́ka sí
  choice: A kò sọ irú òmìnira náà pàtó nínú ẹsẹ yìí.
  alternative: ‘Òtítọ́ náà yóò sọ yín di òmìnira kúrò lọ́wọ́ ẹ̀ṣẹ̀.’
  rationale: Bí ó tilẹ̀ jẹ́ pé àwọn ẹsẹ tó tẹ̀ lé e so òmìnira náà pọ̀ mọ́ ẹ̀ṣẹ̀, ọ̀rọ̀ ẹsẹ yìí fúnra rẹ̀ kò sọ ohun tí a ó gba òmìnira kúrò lọ́wọ́ rẹ̀. Ìtumọ̀ náà jẹ́ kí àyíká ọ̀rọ̀ ṣàlàyé rẹ̀ dípò fífi àlàyé ẹ̀kọ́ ìgbàgbọ́ sínú ọ̀rọ̀ ẹsẹ náà.
translation_notes:
  register: Yorùbá ìṣedéédé òde òní pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lásán; ‘sọ ... di òmìnira’ jẹ́ àdánidá ju ìtumọ̀ líle tàbí èdè òṣèlú lọ.
