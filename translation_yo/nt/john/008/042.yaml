reference: John 8:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: yo
  text: Jésù wí fún wọn pé, “Ìbá ṣe pé Ọlọ́run ni Baba yín, ẹ̀yin ìbá nífẹ̀ẹ́ mi, nítorí mo wá láti ọ̀dọ̀ Ọlọ́run, mo sì wà níhìn-ín[a]. Nítorí èmi kò wá láti ọ̀dọ̀ ara mi[b], ṣùgbọ́n òun ni ó rán mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀ lé ìrísí ọ̀rọ̀ Gíríìkì jù: “Mo jáde láti ọ̀dọ̀ Ọlọ́run, mo sì ti dé.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Nítorí èmi kò wá fúnra mi.” Ọ̀rọ̀ Gíríìkì lè tẹnu mọ́ orísun (“láti ọ̀dọ̀ ara mi”) tàbí pé kì í ṣe Jésù fúnra rẹ̀ ló dá ìgbésẹ̀ náà bẹ̀rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: Ìbá ṣe pé ... ẹ̀yin ì bá nífẹ̀ẹ́ mi
  rationale: Ìṣọ̀rọ̀ ‘ìbá ṣe pé ... ì bá’ fi hàn pé ọ̀rọ̀ náà jẹ́ ipò tí kò rí bẹ́ẹ̀ ní tòótọ́, bí ìlò imperfect pẹ̀lú ἄν ṣe ń tọ́ka sí.
- source_word: θεὸς πατὴρ ὑμῶν
  choice: Ọlọ́run ni Baba yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé Ọlọ́run ni Baba wọn; ‘Baba’ ní lẹ́tà ńlá nítorí pé ó jẹ́ orúkọ ìbátan fún Ọlọ́run níbí.
- source_word: ἠγαπᾶτε
  choice: ì bá nífẹ̀ẹ́ mi
  rationale: ‘Nífẹ̀ẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἀγαπάω, ‘ì bá’ sì mú agbára gbólóhùn àbájáde tí kò ṣẹ ṣẹ̀.
- source_word: ἐγὼ γὰρ
  choice: nítorí mo
  rationale: γάρ ń fúnni ní ìdí tí wọn ì bá fi nífẹ̀ẹ́ Jésù; ‘nítorí’ mú ìbáṣepọ̀ ìdí náà ṣe kedere.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: mo wá láti ọ̀dọ̀ Ọlọ́run
  rationale: Ọ̀rọ̀ yìí pa èrò orísun mọ́ ní Yorùbá tó rọrùn, láìfi èdè ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún un.
- source_word: καὶ ἥκω
  choice: mo sì wà níhìn-ín
  rationale: ἥκω lè tọ́ka sí dídé pẹ̀lú ipò ìsinsìnyí; ‘wà níhìn-ín’ mú abala ìsinsìnyí náà jáde ní Yorùbá àdánidá.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Nítorí èmi kò wá láti ọ̀dọ̀ ara mi
  rationale: Ìtumọ̀ yìí pa èdè orísun mọ́, ó sì bá ‘láti ọ̀dọ̀ Ọlọ́run’ ṣe àfiwé; ó tún jẹ́ kí àìdánilójú láàárín orísun àti ṣíṣe ohun kan ní ìdáwọ́lé ara ẹni dúró.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: ṣùgbọ́n òun ni ó rán mi
  rationale: ‘Òun ni’ fi ìtẹnumọ́ ἐκεῖνος hàn, ‘rán mi’ sì pa èrò iṣẹ́ tí Ọlọ́run gbé lé Jésù lọ́wọ́ mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ọ̀rọ̀ nípa ibi tí Jésù ti wá láìfi èdè ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún un
  choice: mo wá láti ọ̀dọ̀ Ọlọ́run, mo sì wà níhìn-ín
  alternative: mo ti ọ̀dọ̀ Ọlọ́run jáde, mo sì dé
  rationale: Ìtumọ̀ àkọ́kọ́ fìdí orísun àti wíwà Jésù múlẹ̀ ní èdè Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó tẹ̀ lé ìrísí Gíríìkì jù sílẹ̀ fún àyẹ̀wò.
- issue: Ìtumọ̀ ἀπ’ ἐμαυτοῦ
  choice: kò wá láti ọ̀dọ̀ ara mi
  alternative: kò wá ní ìdáwọ́lé ara mi
  rationale: Àṣàyàn àkọ́kọ́ pa ìbáramu pẹ̀lú ‘láti ọ̀dọ̀ Ọlọ́run’ mọ́; àṣàyàn kejì fi ìtumọ̀ pé Jésù kò dá iṣẹ́ náà bẹ̀rẹ̀ fúnra rẹ̀ hàn. Àlàyé ìsàlẹ̀ pa méjèèjì mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún ọ̀pọ̀ ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtẹnumọ́ àti àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
