source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo tilẹ̀ bá ṣe ìdájọ́[a], ìdájọ́ mi jẹ́ òótọ́, nítorí kì í ṣe èmi nìkan, bí kò ṣe èmi àti Baba tí ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí mo bá ṣe ìdájọ́” tàbí “bí mo bá ní láti ṣe ìdájọ́.” Gbólóhùn onípò Gíríìkì náà lè túmọ̀ lọ́nà wọ̀nyí, ṣùgbọ́n ní àyíká ọ̀rọ̀ yìí ó ṣeé ṣe kí ó ní ìtumọ̀ ìyọ̀ǹda pé, “bí mo tilẹ̀ bá ṣe ìdájọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: bí mo tilẹ̀ ṣe ìdájọ́
  rationale: 'Ọ̀rọ̀ yìí pa ìtumọ̀ ipò tí ó ṣeé ṣe mọ́, ó sì fi agbára ìyọ̀ǹda hàn ní àyíká ọ̀rọ̀ náà: bí Jesu tilẹ̀ bá ṣe ìdájọ́.'
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí gbólóhùn tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti mú ìyípadà ọ̀rọ̀ náà jáde ní Yorùbá.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: ìdájọ́ mi
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ ti ilé-ẹjọ́ tàbí pípa ẹjọ́ mọ́.
- source_word: ἀληθινή
  choice: òtítọ́ ni
  rationale: Yíyan ‘òtítọ́’ pa àrọ̀jinlẹ̀ ọ̀rọ̀ Johanu mọ́, kò sì dín ìtumọ̀ náà kù sí pé ó kàn bófin mu nìkan.
- source_word: μόνος οὐκ εἰμί
  choice: èmi kò dá wà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kì í ṣe òun nìkan ló wà tàbí ṣiṣẹ́.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: èmi àti Baba tí ó rán mi ni a wà papọ̀
  rationale: Ìtumọ̀ yìí mú kí gírámà Yorùbá pé, ó sì pa ìfọwọ́sowọ́pọ̀ Jesu àti Baba tó rán an mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ ìdájọ́ Jesu pẹ̀lú ẹ̀rí Baba
  choice: Ìdájọ́ Jesu jẹ́ òtítọ́ nítorí kò dá wà; Baba tó rán an wà pẹ̀lú rẹ̀.
  alternative: A lè ka ọ̀rọ̀ náà gẹ́gẹ́ bí ẹ̀rí méjì tó bófin mu nìkan, láìfa ìtumọ̀ ẹ̀kọ́ nípa ìbáṣepọ̀ wọn sí i.
  rationale: Gíríìkì náà fi òtítọ́ ìdájọ́ Jesu lé àìdáwà rẹ̀ àti wíwà Baba tó rán an pẹ̀lú rẹ̀. A pa ìdí yìí mọ́ láìtú u sí ẹ̀kọ́ ìsìn tó kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ìdájọ́” láti pa àwọ̀ ilé-ẹjọ́ κρίσις mọ́, a sì lo “Baba” gẹ́gẹ́ bí orúkọ oyè ní àyíká yìí.
