    rationale: Ó lè fún πολλὰ ní ìtẹnumọ́ tó pọ̀ ju ‘many things’ lọ. ‘Ọ̀pọ̀ ohun’ dá ìpọ̀ náà hàn láì fi ìmúgbòòrò kún un.
