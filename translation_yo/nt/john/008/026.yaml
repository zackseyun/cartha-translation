  - severity: low
    issue: Àlàyé-ẹsẹ a tún ohun kan náà ṣe gẹ́gẹ́ bí yíyàn mìíràn
    rationale: Ọ̀rọ̀ inú ẹsẹ náà ti lo ‘nípa yín’ tẹ́lẹ̀, nítorí náà ‘Tàbí, nípa yín’ kì í pese yíyàn gidi. Ó yẹ kí a yọ ọ́ kúrò.
  - severity: low
