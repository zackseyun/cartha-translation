review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ ìpìlẹ̀ Gíríìkì ẹsẹ náà dáadáa: ọ̀pọ̀ ohun, sísọ àti dídájọ́ nípa àwọn olùgbọ́, ẹni tí ó rán Jésù, àti àtúnsọ demonstrative náà. Ṣùgbọ́n ‘fún aráyé’ lè túmọ̀ sí pé aráyé ni olùgbà-ànfààní; ‘sí aráyé’ dá ìhà ìtọ́ka/olùgbọ́ ti εἰς τὸν κόσμον hàn dájú ju.'
