id: JHN.8.26
reference: John 8:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: yo
  text: Ọ̀pọ̀ ohun ni mo ní láti sọ nípa yín, àti láti dá yín lẹ́jọ́. Ṣùgbọ́n ẹni tí ó rán mi jẹ́ olóòótọ́; ohun tí mo sì gbọ́ lọ́dọ̀ rẹ̀, àwọn nǹkan wọ̀nyí ni mo ń sọ sí aráyé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nínú èdè Gíríìkì, a tún ọ̀rọ̀ atọ́ka náà ṣe fún ìtẹnumọ́: “ohun tí mo gbọ́ lọ́dọ̀ rẹ̀, àwọn nǹkan wọ̀nyí ni mo ń sọ sí aráyé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: ọ̀pọ̀lọpọ̀ ohun
  rationale: Ọ̀rọ̀ ajẹtífù ọ̀pọ̀ ní ìrísí àárín-orúkọ ọ̀pọ̀ ni a lò gẹ́gẹ́ bí orúkọ; ‘ọ̀pọ̀lọpọ̀ ohun’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ọ̀pọ̀ mọ́.
- source_word: περὶ ὑμῶν
  choice: nípa yín
  rationale: περί pẹ̀lú genitive ń tọ́ka sí kókó tàbí ẹni tí ọ̀rọ̀ kàn; ‘nípa yín’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: λαλεῖν
  choice: láti sọ
  rationale: Nínú ìsọ̀kan pẹ̀lú κρίνειν, ‘láti sọ’ dun bí Yorùbá àdánidá, ó sì dúró fún ìṣe sísọ̀rọ̀.
- source_word: κρίνειν
  choice: láti dá yín lẹ́jọ́
  rationale: ‘Dá ... lẹ́jọ́’ pa ìtumọ̀ gbígbòòrò κρίνω mọ́ láì dín un kù sí fífi ìdálẹ́bi kan ẹni.
- source_word: ὁ πέμψας με
  choice: ẹni tí ó rán mi
  rationale: Ó tú participle olórúkọ náà sí Yorùbá àdánidá, láì fi ‘Baba’ kún ẹsẹ tí kò pe orúkọ náà ní tààrà.
- source_word: ἀληθής
  choice: olóòótọ́
  rationale: Nípa ẹni tó ń sọ̀rọ̀, ‘olóòótọ́’ lè tọ́ka sí jíjẹ́ ẹni òtítọ́ àti ẹni tí ọ̀rọ̀ rẹ̀ ṣeé gbẹ́kẹ̀ lé, láì fi ìtumọ̀ kan ṣoṣo múlẹ̀ jù.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: ohun tí mo gbọ́ lọ́dọ̀ rẹ̀
  rationale: Ó sọ àkóónú tí Jésù gbọ́ láti ọ̀dọ̀ ẹni tó rán an ní Yorùbá tó wọ́pọ̀.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: A pa demonstrative ọ̀pọ̀ tó tún ọ̀rọ̀ tó ṣáájú mú mọ́, kí ìtẹnumọ́ Gíríìkì má bàa sọnù.
- source_word: λαλῶ
  choice: mo ń sọ
  rationale: Àmì ‘ń’ ń ṣàfihàn present tí ó ń lọ lọ́wọ́, ó sì bá ìkéde síta mu.
- source_word: εἰς τὸν κόσμον
  choice: fún aráyé
  rationale: Pẹ̀lú ọ̀rọ̀ sísọ, εἰς fi ibi tí ọ̀rọ̀ ń lọ hàn; ‘fún aráyé’ jẹ́ Yorùbá àdánidá fún ayé ènìyàn gẹ́gẹ́ bí olùgbọ́.
theological_decisions:
- issue: Ẹni tí ‘ẹni tí ó rán mi’ ń tọ́ka sí
  choice: A fi ìtọ́kasí sí Baba sílẹ̀ ní ìkọ̀kọ̀ gẹ́gẹ́ bí Gíríìkì ṣe rí.
  alternative: Ṣùgbọ́n Baba tí ó rán mi jẹ́ olóòótọ́.
  rationale: Àyíká ìwé Jòhánù mú ẹni náà ṣe kedere, ṣùgbọ́n ẹsẹ yìí kò pe ‘Baba’ ní orúkọ; a kò fi orúkọ tí kò sí nínú orísun kún un.
- issue: Agbára ìtumọ̀ κρίνειν
  choice: láti dá yín lẹ́jọ́
  alternative: láti dá yín lẹ́bi
  rationale: A pa ìtumọ̀ gbígbòòrò ti ṣíṣe ìdájọ́ mọ́; ọ̀rọ̀ náà kò fi dandan sọ pé ìdálẹ́bi nìkan ni.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘yín’ nítorí ὑμῶν jẹ́ ọ̀pọ̀. A pa àtúnsọ demonstrative Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó jẹ́ ìtẹnumọ́ díẹ̀ ní Yorùbá.
