  terminology: ‘Dá yín lẹ́jọ́’ pa κρίνειν mọ́ ní ìtumọ̀ rẹ̀ tó gbòòrò, láì sọ ọ́ di ìdálẹ́bi nìkan. ‘Ẹni tí ó rán mi’ pa ìtọ́kasí tí kò dárúkọ Baba nínú Gíríìkì mọ́. ‘Olóòótọ́’ yẹ fún ἀληθής nínú àyíká yìí.
