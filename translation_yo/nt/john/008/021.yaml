id: JHN.8.21
reference: John 8:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: yo
  text: Nítorí náà, ó tún sọ fún wọn pé, “Èmi ń lọ, ẹ̀yin yóò sì wá mi[a], ẹ̀yin yóò sì kú nínú ẹ̀ṣẹ̀ yín[b]. Ibi tí èmi ń lọ, ẹ̀yin kò lè wá sí[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin yóò sì máa wá mi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wíwá ẹni kan, ó sì tún lè ní ìtumọ̀ ẹ̀mí tó jinlẹ̀ nínú Jòhánù.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì lo ẹyọ pé, “nínú ẹ̀ṣẹ̀ yín.” Àwọn ìtumọ̀ kan máa ń sọ “nínú àwọn ẹ̀ṣẹ̀ yín,” ṣùgbọ́n ẹyọ náà lè tẹnu mọ́ ipò ẹ̀ṣẹ̀ tó ń bá a lọ dípò àwọn ìṣe ẹ̀ṣẹ̀ kọ̀ọ̀kan.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ẹ̀yin kò lágbára láti wá sí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí pọ̀ mọ́ ìjíròrò tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn.
- source_word: πάλιν
  choice: tún
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ó tún bá wọn sọ̀rọ̀ lẹ́ẹ̀kan sí i.
- source_word: Ἐγὼ ὑπάγω
  choice: Èmi ń lọ
  rationale: “Èmi” pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́; “ń lọ” sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó lè túmọ̀ sí lílọ kúrò láìṣe àlàyé ibi tó ń lọ ní kíkún.
- source_word: ζητήσετέ με
  choice: ẹ̀yin yóò sì wá mi
  rationale: “Wá mi” lè túmọ̀ sí lílọ kiri láti rí ẹni kan, ó sì pa ààyè sílẹ̀ fún ìtumọ̀ ẹ̀mí tó lè wà nínú ọ̀rọ̀ náà ní Jòhánù.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: nínú ẹ̀ṣẹ̀ yín
  rationale: Ó pa ọ̀rọ̀-orúkọ ẹyọ “ẹ̀ṣẹ̀” àti agbára ἐν, “nínú,” mọ́, dípò yíyí i sí ọ̀pọ̀ “àwọn ẹ̀ṣẹ̀.”
- source_word: ἀποθανεῖσθε
  choice: ẹ̀yin yóò sì kú
  rationale: Ó tú ọ̀rọ̀ ọjọ́ iwájú Gíríìkì sí Yorùbá kedere, láìfi ìtumọ̀ míì kún un.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Ibi tí èmi ń lọ
  rationale: Ó tún pa ìtẹnumọ́ “èmi” àti ìṣe lílọ tó ń lọ lọ́wọ́ mọ́, gẹ́gẹ́ bí Gíríìkì ṣe tún ὑπάγω lò.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ẹ̀yin kò lè wá sí
  rationale: “Kò lè” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ àìní agbára tàbí àìṣeéṣe tí δύνασθε ń fi hàn; “wá sí” sì bá ojú ìwòye ẹni tó ń sọ̀rọ̀ mu.
theological_decisions:
- issue: Ẹyọ ἁμαρτίᾳ ní ìfiwéra pẹ̀lú ọ̀pọ̀ “àwọn ẹ̀ṣẹ̀”
  choice: nínú ẹ̀ṣẹ̀ yín
  alternative: nínú àwọn ẹ̀ṣẹ̀ yín
  rationale: Gíríìkì lo ẹyọ. Dídá a sílẹ̀ gẹ́gẹ́ bí ẹyọ lè tọ́ka sí ipò ẹ̀ṣẹ̀ tí ń bá a lọ, ṣùgbọ́n ọ̀rọ̀ àkọ́kọ́ kò fi ìtumọ̀ yẹn múlẹ̀ ju bí Gíríìkì ṣe ṣe lọ.
- issue: Ìtumọ̀ jíjinlẹ̀ lílọ Jésù nínú ὑπάγω
  choice: Èmi ń lọ
  alternative: Èmi ń lọ kúrò
  rationale: Nínú Jòhánù, lílọ Jésù lè ní í ṣe pẹ̀lú ikú, àjíǹde àti pípadà sọ́dọ̀ Baba; ṣùgbọ́n “ń lọ” pa ìtumọ̀ ojú-ìwé àti ìjìnlẹ̀ rẹ̀ mọ́ láìsọ ibi tó ń lọ ní tààrà.
- issue: Irú àìṣeéṣe tó wà nínú οὐ δύνασθε ἐλθεῖν
  choice: ẹ̀yin kò lè wá sí
  alternative: ẹ̀yin kò lágbára láti wá sí
  rationale: Ọ̀rọ̀ náà sọ àìní agbára tàbí àìṣeéṣe, ṣùgbọ́n kò ṣàlàyé nínú ẹsẹ yìí nìkan bóyá ìdí rẹ̀ jẹ́ ti ìwà, ti ẹ̀mí tàbí ti ipò; ìtumọ̀ náà kò yan ọ̀kan lára wọn.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tó yẹ, a sì lo “ẹ̀yin” láti mú ọ̀pọ̀ ẹni inú Gíríìkì àti ìtẹnumọ́ rẹ̀ hàn. Ìtúmọ̀ náà kò fi èrò ẹ̀sìn ẹlẹ́gbẹ́ kan kún ọ̀rọ̀.
