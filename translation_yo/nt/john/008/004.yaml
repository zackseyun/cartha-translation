  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: yo
  text: Wọ́n[a] sọ fún un pé, “Olùkọ́, a ti mú obìnrin yìí nígbà tí ó ń ṣe panṣágà gan-an.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ń bá ìtàn obìnrin tí wọ́n mú nínú panṣágà lọ (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: wọ́n sọ
  rationale: Ọ̀rọ̀ náà jẹ́ ìsinsìnyí ìtàn ní Gíríìkì; lílo àsìkò tí ó ti kọjá jẹ́ àdánidá nínú ìtàn Yorùbá.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí jẹ́ ọ̀nà àdánidá, tó sì ní iyì, láti pe ẹni tí ń kọ́ni.
- source_word: κατείληπται
  choice: a mú
  rationale: 'Ìṣe náà jẹ́ perfect passive ní Gíríìkì: wọ́n ti mú un, ó sì wà ní ọwọ́ àwọn olùfisùn; Yorùbá àdánidá fi ‘a mú’ sọ ọ́ ní kíkún.'
- source_word: ἐπαυτοφώρῳ
  choice: ní pàtó bí ó ti ń ṣe
  rationale: Gbólóhùn yìí mú ìtumọ̀ pé a bá ẹni náà níbi ìṣe náà gan-an, kì í ṣe pé ẹ̀rí àyíká nìkan ló wà.
- source_word: μοιχευομένη
  choice: bí ó ti ń ṣe panṣágà
  rationale: Participle ìsinsìnyí náà ṣàpèjúwe ohun tí obìnrin náà ń ṣe ní àkókò tí wọ́n mú un; ‘ṣe panṣágà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àgbèrè tó rú ìdè ìgbéyàwó.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, tí ó sì dára fún kíkà ní gbangba. ‘Ní pàtó bí ó ti ń ṣe’ jẹ́ ọ̀nà àdánidá láti fi agbára ἐπαυτοφώρῳ hàn láì lo àkànlò èdè tí ó lè dà bí ti òde tàbí tí kò bójú mu.
