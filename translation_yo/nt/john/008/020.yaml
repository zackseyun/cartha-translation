source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: yo
  text: Ó sọ àwọn ọ̀rọ̀ wọ̀nyí ní ibi ìṣúra, nígbà tí ó ń kọ́ni nínú tẹ́ńpìlì[a]; kò sì sí ẹni tí ó mú un, nítorí wákàtí rẹ̀ kò tíì dé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àgbàlá tẹ́ńpìlì”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
    reason: lexical_alternative
  - marker: b
    text: Nínú Jòhánù, “wákàtí rẹ̀” ń tọ́ka sí àkókò tí a yàn fún ìjìyà Jésù àti ìṣípayá ògo rẹ̀. Tàbí, “àkókò tí a yàn fún un.”
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ọ̀rọ̀ tí Jésù ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀nà àdánidá láti tú ῥήματα sí Yorùbá.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: ní ibi ìṣúra
  rationale: Ó fi ibi tí wọ́n ń pa tàbí gba ọrẹ sínú tẹ́ńpìlì hàn, láì dín ọ̀rọ̀ náà kù sí àpótí kan ṣoṣo.
- source_word: διδάσκων
  choice: nígbà tí ó ń kọ́ni
  rationale: Ó mú kí ìṣe tí ó ń lọ lẹ́gbẹ̀ẹ́ ìsọ̀rọ̀ náà ṣe kedere, gẹ́gẹ́ bí participle ìsinsìnyí inú Gíríìkì.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ gbòòrò náà mọ́.
- source_word: ἐπίασεν
  choice: mú un
  rationale: Nínú àyíká yìí, ó túmọ̀ sí mímú Jésù lọ́wọ́ pẹ̀lú ète ọ̀tá; ‘mú un’ jẹ́ Yorùbá àdánidá, kò sì fi ìlànà òfin kan kún ọ̀rọ̀ náà.
- source_word: ἡ ὥρα αὐτοῦ
  choice: wákàtí rẹ̀
  rationale: Ìtumọ̀ gangan yìí pa àkòrí pàtàkì inú Jòhánù mọ́, dípò fífi ‘àkókò’ rọ́pò rẹ̀ tí yóò dín agbára àkòrí náà kù.
theological_decisions:
- issue: Ìlò ‘wákàtí rẹ̀’ nínú Jòhánù
  choice: Pa ọ̀rọ̀ gangan ‘wákàtí rẹ̀’ mọ́ nínú ẹsẹ̀.
  alternative: àkókò tí a yàn fún un; àkókò rẹ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀ nínú Jòhánù, ó ń tọ́ka sí àkókò tí a yàn fún ìjìyà àti ògo Jésù; pípa rẹ̀ mọ́ kò yanjú ìfarapamọ́ àti ìnira ọ̀rọ̀ náà láìnídìí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí àwọn òǹkàwé lasán lè lóye. A lo ‘tẹ́ńpìlì’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, a sì lo ‘ibi ìṣúra’ láti fi hàn pé àgbègbè kan ni, kì í ṣe àpótí ọrẹ kan ṣoṣo.
