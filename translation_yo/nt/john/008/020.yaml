- from: Ó sọ àwọn ọ̀rọ̀ wọ̀nyí ní ibi ìṣúra nígbà tí ó ń kọ́ni nínú tẹ́ńpìlì[a]. Síbẹ̀, kò sí ẹni tí ó mú un, nítorí wákàtí rẹ̀ kò tíì dé[b].
  to: Ó sọ àwọn ọ̀rọ̀ wọ̀nyí ní ibi ìṣúra, nígbà tí ó ń kọ́ni nínú tẹ́ńpìlì[a]; kò sì sí ẹni tí ó mú un, nítorí wákàtí rẹ̀ kò tíì dé[b].
  rationale: The revision removes the adversative “Síbẹ̀,” which was not licensed by the Greek conjunction καί, and replaces it with a Yoruba coordinative construction. A minor wording improvement in footnote b better reflects the audit trail’s “suffering and glorification” while retaining the literal main-text expression “wákàtí rẹ̀.”
