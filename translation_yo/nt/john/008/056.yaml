source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: yo
  text: Ábúráhámù, baba yín, yọ̀ gidigidi láti rí ọjọ́ mi[a][b]; ó sì rí i, inú rẹ̀ sì dùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “yọ̀ gidigidi pé òun yóò rí ọjọ́ mi” tàbí “yọ̀ gidigidi kí ó lè rí ọjọ́ mi.” Gbólóhùn Gíríìkì tí ó bẹ̀rẹ̀ pẹ̀lú ἵνα lè ní ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí tí ó sún mọ́ra.
    reason: lexical_alternative
  - marker: b
    text: “Ọjọ́ mi” lè tọ́ka ní gbogbogbò sí ọjọ́ Mèsáyà ti Jésù tàbí sí ìmúṣẹ iṣẹ́ rẹ̀; ẹsẹ yìí fúnra rẹ̀ kò sọ ìṣẹ̀lẹ̀ tàbí àsìkò pàtó tí ó wà lọ́kàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Ábúráhámù
  rationale: Ọ̀nà tí a sábà ń gbà kọ orúkọ baba ńlá náà ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ὁ πατὴρ ὑμῶν
  choice: baba yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn ìní náà, ó sì pa ìbátan tí Jésù tọ́ka sí mọ́.
- source_word: ἠγαλλιάσατο
  choice: yọ̀ gidigidi
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ayọ̀ ńlá tàbí ìdùnnú àkúnwọ́sílẹ̀; “yọ̀ gidigidi” ṣe àfihàn agbára rẹ̀ ní Yorùbá òde òní.
- source_word: ἵνα ἴδῃ
  choice: pé òun yóò rí
  rationale: Ó mú ìfojúsọ́nà Ábúráhámù jáde ní Yorùbá àdánidá, láìfi ìtumọ̀ idi tàbí àkóónú kan ṣoṣo múlẹ̀ pátápátá.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: ọjọ́ mi
  rationale: Ìtumọ̀ tààrà tí ó pa ìjìnlẹ̀ àti àìsọ pàtó ohun tí “ọjọ́” náà tọ́ka sí mọ́.
- source_word: καὶ εἶδεν
  choice: ó sì rí i
  rationale: Arọ́pò-orúkọ “i” tọ́ka padà sí “ọjọ́ mi,” ó sì jẹ́ kí gbólóhùn náà ṣe déédéé ní Yorùbá.
- source_word: καὶ ἐχάρη
  choice: inú rẹ̀ sì dùn
  rationale: Ó pa ìyàtọ̀ díẹ̀ mọ́ láàárín χαίρω àti ἀγαλλιάω, dípò lílo “yọ̀” lẹ́ẹ̀mejì.
theological_decisions:
- issue: Ìtumọ̀ “ọjọ́ mi” nínú ọ̀rọ̀ Jésù nípa Ábúráhámù
  choice: Pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “ọjọ́ mi,” láìsọ ìṣẹ̀lẹ̀ tàbí àsìkò pàtó.
  alternative: Ìgbà iṣẹ́ Jésù lórí ilẹ̀ ayé; ìgbà Mèsáyà; ikú àti àjíǹde rẹ̀; tàbí ọjọ́ ìfarahàn rẹ̀ níkẹyìn.
  rationale: Ẹsẹ náà kò sọ pàtó ohun tí “ọjọ́ mi” túmọ̀ sí; ìtumọ̀ yìí pa àìdánilójú àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́.
- issue: Agbára ἵνα nínú ayọ̀ Ábúráhámù
  choice: “pé òun yóò rí,” gẹ́gẹ́ bí ìfojúsọ́nà sí ohun tí ń bọ̀.
  alternative: “láti rí” tàbí “kí ó lè rí,” gẹ́gẹ́ bí àkóónú tàbí ète.
  rationale: ἵνα pẹ̀lú subjunctive lè ní àwọn ìtumọ̀ tó sún mọ́ra; àkọsílẹ̀ pàtàkì àti àlàyé ìsàlẹ̀ pa àwọn àṣàyàn náà mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tí ó bójú mu, tí ó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; “òun” mú kí ẹni tí yóò rí ọjọ́ náà ṣe kedere.
