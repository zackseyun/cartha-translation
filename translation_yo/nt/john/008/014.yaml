id: JHN.8.14
reference: John 8:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: yo
  text: Jésù dá wọn lóhùn, ó sì wí fún wọn pé, “Bí èmi tilẹ̀ bá ń jẹ́rìí nípa ara mi[a], òótọ́ ni ẹ̀rí mi, nítorí mo mọ ibi tí mo ti wá àti ibi tí mo ń lọ; ṣùgbọ́n ẹ̀yin kò mọ ibi tí mo ti ń bọ̀ tàbí[b] ibi tí mo ń lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bá ń ṣe ẹlẹ́rìí nípa ara mi.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní “àti ibi tí mo ń lọ” dípò “tàbí ibi tí mo ń lọ.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτοῖς
  choice: dá wọn lóhùn, ó sì wí fún wọn pé
  rationale: Ó pa àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́ gẹ́gẹ́ bí àkọsílẹ̀ Jòhánù, ní èdè Yorùbá ọlọ́lá tí ó sì ṣeé lóye.
- source_word: Κἂν
  choice: Bí ... tilẹ̀ bá
  rationale: 'Èyí fi agbára ìyọ̀ǹda hàn: bí ó tilẹ̀ jẹ́ pé Jésù ń jẹ́rìí nípa ara rẹ̀, ẹ̀rí náà ṣì jẹ́ òótọ́.'
- source_word: μαρτυρῶ / μαρτυρία
  choice: ń jẹ́rìí / ẹ̀rí
  rationale: Àwọn ọ̀rọ̀ yìí jẹ́ àdáni Yorùbá tí ó bójú mu fún èrò jíjẹ́rìí tàbí fífi ẹ̀rí hàn, wọ́n sì pa ìtumọ̀ bíi ti ilé-ẹjọ́ mọ́ láì fi agbára lé e jù.
- source_word: ἀληθής
  choice: òótọ́
  rationale: Ó sọ pé ẹ̀rí Jésù bá òtítọ́ mu; a kò dín ìtumọ̀ rẹ̀ kù sí pé ó kàn bófin mu nìkan.
- source_word: πόθεν ἦλθον ... πόθεν ἔρχομαι
  choice: ibi tí mo ti wá ... ibi tí mo ti ń bọ̀
  rationale: 'Ìtumọ̀ yìí fi ìyàtọ̀ àkókò ọ̀rọ̀-ìṣe Gíríìkì hàn bí ó ti ṣeé ṣe ní Yorùbá: ἦλθον tọ́ka sí wíwá tí ó ti ṣẹlẹ̀, ἔρχομαι sì wà ní àkókò ìsinsìnyí.'
- source_word: ποῦ ὑπάγω
  choice: ibi tí mo ń lọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdáni láti sọ ìlọ tí ó ní ibi àfojúsùn.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: ṣùgbọ́n ẹ̀yin kò mọ
  rationale: A pa ìtakora àti ìtẹnumọ́ ọ̀rọ̀-arọ́pò-orúkọ ὑμεῖς mọ́ nípasẹ̀ ‘ẹ̀yin.’
theological_decisions:
- issue: Ìtumọ̀ ẹ̀rí tí Jésù jẹ́ nípa ara rẹ̀
  choice: A sọ pé ẹ̀rí rẹ̀ jẹ́ òótọ́ nítorí ó mọ ibi tí ó ti wá àti ibi tí ó ń lọ.
  alternative: Kí a túmọ̀ ọ́ ní ọ̀nà ilé-ẹjọ́ tóóró pé ẹ̀rí náà ‘bófin mu,’ tàbí kí a fi kún un ní kedere pé ó ń sọ nípa orísun rẹ̀ ní ọ̀run.
  rationale: Ẹsẹ náà fúnra rẹ̀ so òótọ́ ẹ̀rí Jésù mọ́ ìmọ̀ tí ó ní nípa ibi tí ó ti wá àti ibi tí ó ń lọ. Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú gbólóhùn náà kún un, ṣùgbọ́n ó jẹ́ kí àyíká Ìhìn Rere Jòhánù ṣàlàyé ìjẹ́pàtàkì rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe ọlọ́lá, tó ní àmì ohùn ní kíkún, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àtúnṣe ọ̀rọ̀ ‘dá ... lóhùn, ó sì wí’ mọ́ láti tẹ̀ lé ìṣètò Jòhánù, bó tilẹ̀ jẹ́ pé ó ga díẹ̀ ju ọ̀rọ̀ ojoojúmọ́ lọ. A gbé àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé, ‘nípa ara mi,’ kí ìtọ́kasí rẹ̀ lè ṣe kedere.
