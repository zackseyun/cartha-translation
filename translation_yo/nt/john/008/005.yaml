translation:
  language: yo
  text: Nínú Òfin wa, Mósè pàṣẹ pé kí a sọ irú àwọn obìnrin bẹ́ẹ̀ ní òkúta pa.[a] Ìwọ sì, kí ni o wí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí jẹ́ ìtẹ̀síwájú ìtàn obìnrin tí a mú nínú panṣágà (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: τοιαύτας
  choice: irú àwọn obìnrin bẹ́ẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ abo, ọ̀pọ̀, ó sì ń tọ́ka sí irú àwọn obìnrin tí a ń sọ̀rọ̀ nípa wọn; ní àyíká yìí, àwọn tí a mú nínú panṣágà.
- source_word: λιθοβολεῖσθαι
  choice: kí a sọ ... ní òkúta pa
  rationale: Gbólóhùn Yòrùbá yìí sọ ìjìyà ikú nípa jíju òkúta lù ẹni náà títí ó fi kú ní ọ̀nà àdánidá, kedere.
- source_word: ἐνετείλατο
  choice: pàṣẹ
  rationale: Ó bá àṣẹ aláṣẹ tí Mósè fúnni mu, ó sì jẹ́ ọ̀rọ̀ Yòrùbá tí ó wọ́pọ̀, tí ó ní iyì.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín ohun tí Òfin pàṣẹ àti ìbéèrè tí wọ́n ń gbé tọ Jésù wá; a kò fi ọ̀rọ̀ àkókò bí ‘nísinsìnyí’ kún un.
- source_word: σὺ οὖν τί λέγεις;
  choice: Nítorí náà, kí ni ìwọ wí?
  rationale: ‘Nítorí náà’ túmọ̀ οὖν, fífi ‘ìwọ’ hàn sì pa ìtẹnumọ́ orúkọ arọ́pò σὺ mọ́.
theological_decisions:
- issue: Ìtọ́kasí ‘Òfin wa’ àti àṣẹ Mósè
  choice: A pa ọ̀rọ̀ àwọn olùbéèrè mọ́ gẹ́gẹ́ bí ó ti wà, láìṣe àlàyé tàbí ìṣàtúnṣe rẹ̀ nínú ẹsẹ náà.
  alternative: Ṣí àṣẹ Òfin náà sílẹ̀ ní kíkún tàbí mú un bá ẹsẹ Òfin kan pàtó mu.
  rationale: Ẹsẹ náà ń ròyìn bí àwọn olùbéèrè ṣe gbé ọ̀rọ̀ wọn kalẹ̀; kò yẹ kí ìtumọ̀ yanjú ìṣòro ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn àṣẹ inú Deuterónómì.
translation_notes:
  register: Yòrùbá àpapọ̀ tó ní àmì ohùn kíkún, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. ‘Sọ ... ní òkúta pa’ jẹ́ àdánidá ju ìtumọ̀ líle bí ‘jẹ́ kí a sọ ní òkúta’ lọ. A fi àmì àlàyé [a] sí òpin gbólóhùn tó ní àṣẹ lílo òkúta, níbi tí kò ti dá ìṣàn ọ̀rọ̀ rú.
