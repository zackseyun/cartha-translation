id: JHN.8.6
reference: John 8:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: yo
  text: Wọ́n[a] ń sọ èyí láti dán an wò, kí wọ́n lè ní ẹ̀sùn kan sí i. Ṣùgbọ́n Jésù cúbà sílẹ̀, ó sì fi ìka rẹ̀ kọ̀wé sórí ilẹ̀, láìkòbi ara sí wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí jẹ́ ìtẹ̀síwájú ìtàn obìnrin tí wọ́n mú nínú panṣágà (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: láti dán an wò
  rationale: Ó túmọ̀ sí fífi ẹni kan yẹ̀ wò tàbí dán an wò; ní àyíká yìí, ète wọn ni láti mú Jésù wọ inú ìṣòro tí yóò fún wọn ní ọ̀nà láti fẹ̀sùn kàn án.
- source_word: κατηγορίαν
  choice: ẹ̀sùn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹ̀sùn tàbí ẹ̀sùn níwájú òfin; “ẹ̀sùn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀ràn òfin mu.
- source_word: κάτω κύψας
  choice: tẹ̀ ba
  rationale: Ó ṣàpèjúwe bí Jésù ṣe tẹ ara rẹ̀ sílẹ̀; “tẹ̀ ba” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἔγραφεν
  choice: kọ̀wé
  rationale: Ìṣe aláìparí náà lè túmọ̀ sí pé ó ń kọ̀wé; nínú gbolohun Yorùbá yìí, “ó sì ... kọ̀wé” sọ ìṣe náà ní ọ̀nà tó mọ́ láìfi ohun tí ó kọ kún un.
- source_word: μὴ προσποιούμενος
  choice: láìfiyèsí wọn
  rationale: Ó fi hàn pé Jésù kò kọbi ara sí ohun tí wọ́n ń ṣe tàbí sọ. Àfikún “wọn” mú olùtọ́ka tí àyíká ń béèrè hàn láìyí ìtumọ̀ padà.
theological_decisions:
- issue: Ète àwọn olùbéèrè nínú πειράζοντες
  choice: dán an wò
  alternative: dẹkùn mú un / dán an wo láti mú un ṣìnà
  rationale: “Dán an wò” pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, nígbà tí gbólóhùn tó tẹ̀ lé e ṣàlàyé ète búburú wọn láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn wọlé.
translation_notes:
  register: Èdè Yorùbá àgbéléwọ̀n, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A pa àmì ohùn mọ́ níbi tó yẹ, a sì lo “Wọ́n” fún àwọn akọ̀wé àti Farisí tí ẹsẹ tó ṣáájú ń tọ́ka sí.
