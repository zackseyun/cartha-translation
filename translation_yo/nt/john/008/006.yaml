  to: Wọ́n[a] ń sọ èyí láti dán an wò, kí wọ́n lè ní ẹ̀sùn kan sí i. Ṣùgbọ́n Jésù cúbà sílẹ̀, ó sì fi ìka rẹ̀ kọ̀wé sórí ilẹ̀, láìkòbi ara sí wọn.
