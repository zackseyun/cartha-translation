  - severity: low
    issue: “rí ẹ̀sùn kan kàn án” lè dà bí wíwá ẹ̀sùn tí a óò fi kàn án, dípò ìmọ̀ ìtumọ̀ “ní ẹ̀sùn kan sí i.”
    rationale: “Kí wọ́n lè ní ẹ̀sùn kan sí i” sun mọ́ ἵνα ἔχωσιν κατηγορίαν κατ’ αὐτοῦ, ó sì rọrùn sí i nínú Yorùbá.
