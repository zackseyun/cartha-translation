  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ète ìdánwò, ìfẹ́ láti ní ẹ̀sùn sí Jésù, àti ìṣe rẹ̀ ti kíkòwé sórí ilẹ̀ pẹ̀lú ìka rẹ̀ hàn dáadáa. Síbẹ̀, “tẹ̀ ba” kò pé gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àgbéléwọ̀n fún κάτω κύψας; “cúbà sílẹ̀” ṣàfihàn ìtumọ̀ “tẹ̀ sílẹ̀/bẹ̀rẹ̀ sí í tẹ̀ríba” ní kedere. “Láìkòbi ara sí wọn” jẹ́ ìtumọ̀ àdánidá fún ìmọ̀ èrò ìṣàìka-sí ti μὴ προσποιούμενος ní àyíká yìí, ní ìbámu pẹ̀lú audit Gẹ̀ẹ́sì.
  naturalness: Àwọn gbolohun mìíràn rọrùn, wọ́n sì jẹ́ Yorùbá àgbéléwọ̀n. Àmì ohùn náà dára ní gbogbogbòò. Àtúnṣe “cúbà sílẹ̀” àti “ní ẹ̀sùn kan sí i” mú ìsọ̀rọ̀ náà rọrùn, ó sì yẹ fún ìwé mímọ́ ìgbàlódé.
  terminology: “Dán an wò” dáa fún πειράζοντες níbi yìí; “ẹ̀sùn” dáa fún κατηγορίαν; “kọ̀wé sórí ilẹ̀” sì dáa fún ἔγραφεν εἰς τὴν γῆν. A pa “Jésù” mọ́ gẹ́gẹ́ bí ìlò tí ó wọ́pọ̀ nínú Yorùbá.
  issues:
  - severity: medium
    issue: “tẹ̀ ba” nínú gbolohun náà kò jẹ́ ọ̀nà Yorùbá àgbéléwọ̀n tí ó pé fún “bending down.”
