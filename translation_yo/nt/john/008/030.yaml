lexical_decisions:
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìtọ́kasí náà jẹ́ ọ̀pọ̀, ó sì ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ ń sọ; yíyan ọ̀rọ̀ yìí pa ìtumọ̀ ọ̀pọ̀ àti ìsopọ̀ pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: αὐτοῦ λαλοῦντος
  choice: Bí ó ti ń sọ
  rationale: Genitive absolute pẹ̀lú present participle fi hàn pé ìgbàgbọ́ wọn ṣẹlẹ̀ ní àkókò kan náà tí ó ṣì ń bá ọ̀rọ̀ rẹ̀ lọ. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ, ìtumọ̀ rẹ̀ sì ni ‘ọ̀pọ̀.’ Fífikun ‘ènìyàn’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἐπίστευσαν
  choice: gba … gbọ́
  rationale: Aorist indicative náà gbé ìṣẹ̀lẹ̀ náà kalẹ̀ gẹ́gẹ́ bí odidi láìfi dandan túmọ̀ rẹ̀ sí ìbẹ̀rẹ̀ ìgbàgbọ́. ‘Gba òun gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé ẹni.
- source_word: εἰς αὐτόν
  choice: òun
  rationale: Pẹ̀lú πιστεύω, εἰς tọ́ka ìgbàgbọ́ àti ìgbẹ́kẹ̀lé sí Jésù fúnra rẹ̀. Nínú àkópọ̀ ọ̀rọ̀ Yorùbá ‘gba òun gbọ́,’ ọ̀rọ̀ arọ́pò-orúkọ náà mú ẹni tí ìgbàgbọ́ darí sí hàn ní kedere.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω εἰς αὐτόν nínú Ìhìn Rere Jòhánù
  choice: gba òun gbọ́
  alternative: ní ìgbàgbọ́ nínú rẹ̀
  rationale: Àkópọ̀ πιστεύω + εἰς nínú Jòhánù sábà ń sọ ìgbẹ́kẹ̀lé tí a darí sí ẹni kan, kì í ṣe gbígbà pé ọ̀rọ̀ ẹni náà jẹ́ òótọ́ lásán. ‘Gba òun gbọ́’ jẹ́ Yorùbá tó wọ́pọ̀, tó sì lè rú ìtumọ̀ ìgbàgbọ́ àti ìgbẹ́kẹ̀lé yìí láìfi àlàyé ẹ̀kọ́ ìsìn kún un. Àṣàyàn mìíràn túmọ̀ ìdarí yẹn ní gbangba sí i, ṣùgbọ́n kò fi bẹ́ẹ̀ jẹ́ àdánidá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yan gbólóhùn tó ṣeé lóye fún òǹkàwé gbogbogbò láìsọ àìdájú tàbí agbára ẹ̀kọ́ ìsìn inú ọ̀rọ̀ Gíríìkì nù.
