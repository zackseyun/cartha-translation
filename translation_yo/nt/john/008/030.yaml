  text: As he was saying these things[b][a], many believed in him.
translation:
  language: yo
  text: Bí ó ti ń sọ àwọn nǹkan wọ̀nyí[a], ọ̀pọ̀ ènìyàn gba òun gbọ́[b].
  philosophy: optimal-equivalence
