  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἰησοῦς δὲ ἐπορεύθη εἰς τὸ ὄρος τῶν Ἐλαιῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/001.yaml
  text: But Jesus[a] went to the Mount of Olives.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù[a] lọ sí Òkè Ólífì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ̀ yìí ń tẹ̀ síwájú nínú ìtàn obìnrin tí a mú nínú panṣágà (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53 fún ẹ̀rí àwọn àfọwọ́kọ.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπορεύθη (πορεύομαι)
  choice: lọ
  rationale: Ọ̀rọ̀ náà jẹ́ aorist tí ó ní ìtumọ̀ aláṣeyọrí níbí, ó sì ń sọ ìrìn sí ibi kan ní ọ̀nà tó rọrùn; “lọ” ni ọ̀rọ̀ Yorùbá àdánidá jù lọ.
- source_word: ὄρος
  choice: Òkè
  rationale: “Òkè” ni ó bá orúkọ ibi tí a mọ̀ sí Òkè Ólífì mu, ó sì lè túmọ̀ sí òkè ńlá tàbí ibi gíga gẹ́gẹ́ bí àyíká ọ̀rọ̀.
- source_word: τῶν Ἐλαιῶν (ἐλαία)
  choice: Ólífì
  rationale: Gíríìkì jẹ́ ẹ̀yà ọ̀pọ̀ nínú ọ̀nà ìní, ní ti gidi ‘ti àwọn igi ólífì’; “Òkè Ólífì” jẹ́ orúkọ ibi tó ṣe kedere, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: 'Ó so ẹsẹ̀ yìí mọ́ ìtàn tó ṣáájú pẹ̀lú ìyàtọ̀: àwọn yòókù lọ sí ilé wọn, ṣùgbọ́n Jésù lọ sí Òkè Ólífì.'
theological_decisions:
- issue: Ipò ẹsẹ̀ yìí nínú àwọn ẹ̀rí àfọwọ́kọ
  choice: A fi ẹsẹ̀ náà sínú ọ̀rọ̀ pàtàkì, pẹ̀lú àmì àlàyé lẹ́yìn ‘Jésù’.
  alternative: Kí a yọ ẹsẹ̀ náà kúrò nínú ọ̀rọ̀ pàtàkì tàbí kí a fi sí àkámọ́.
  rationale: Àtẹ̀jáde orísun Byzantine tí a fún wa ní ẹsẹ̀ náà; àlàyé ìsàlẹ̀ sì jẹ́ kí òǹkàwé mọ̀ pé ẹ̀rí àfọwọ́kọ ní ìṣòro láìdájọ́ rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ kúkúrú, àdánidá, tí ó sì ní iyì. A lo “Òkè Ólífì” gẹ́gẹ́ bí orúkọ ibi; gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
