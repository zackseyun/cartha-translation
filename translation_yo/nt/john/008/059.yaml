source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: yo
  text: Nítorí náà, wọ́n gbé àwọn òkúta láti ju àwọn òkúta náà sí i, ṣùgbọ́n Jésù fi ara rẹ̀ pamọ́, ó sì jáde kúrò ní tẹ́ńpìlì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní pàtó sí i, “kúrò ní àgbègbè tẹ́ńpìlì àti àwọn àgbàlá rẹ̀.” Ọ̀rọ̀ Gíríìkì ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé tẹ́ńpìlì náà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: wọ́n gbé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n gbé òkúta sókè tàbí mú un sí ọwọ́ fún ìṣe tí wọ́n pinnu; “wọ́n gbé òkúta” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìsopọ̀ pẹ̀lú ọ̀rọ̀ tó ṣáájú hàn.
- source_word: λίθους
  choice: òkúta
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, ó sì bá ọ̀rọ̀ nípa lílo òkúta fún ìwà ipá mu.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: láti sọ lù ú
  rationale: ἵνα pẹ̀lú ọ̀rọ̀-ìṣe subjunctive fi ète hàn; “láti sọ lù ú” sọ ète àti ìkọlù náà ní Yorùbá àdánidá.
- source_word: ἐκρύβη
  choice: fi ara rẹ̀ pamọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ìrísí ọ̀rọ̀ Gíríìkì náà jẹ́ passive, ó lè ní ìtumọ̀ middle níbí; yíyan yìí kò fi hàn pé ẹlòmíràn ló pa Jésù mọ́.
- source_word: ἐξῆλθεν
  choice: ó sì jáde kúrò
  rationale: Ó ṣàfihàn ìṣípò kúrò ní ibi náà ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: kúrò ní tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; àlàyé ìpéye wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Irú ọ̀nà tí Jésù gbà yọ kúrò níbẹ̀
  choice: 'A túmọ̀ ohun tí ẹsẹ náà sọ nìkan: Jésù fi ara rẹ̀ pamọ́, ó sì jáde.'
  alternative: Pípa kún un pé ó la àárín wọn kọjá lọ́nà iṣẹ́ ìyanu tàbí pé kò ṣeé rí mọ́.
  rationale: Ọ̀rọ̀ SBLGNT tí a fi fún wa kò ní àwọn àfikún wọ̀nyẹn; a kò gbọdọ̀ mú àlàyé inú àwọn àṣà àfọwọ́kọ mìíràn wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn, ní èdè àdánidá, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo “tẹ́ńpìlì” nínú ẹsẹ fún ìrọ̀rùn, a sì ṣàlàyé ìtumọ̀ ἱερόν ní ìsàlẹ̀.
