base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: yo
  text: Nítorí náà, wọ́n ń bi í pé, “Ta ni ìwọ?” Jésù dá wọn lóhùn pé, “Ohun gan-an tí mo ti ń sọ fún yín láti ìbẹ̀rẹ̀ ni.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn Gíríìkì níhìn-ín ṣòro láti túmọ̀ dájú. Ó tún ṣeé túmọ̀ pé, “Kí ló dé tí mo fi ń bá yín sọ̀rọ̀ rárá?”
    reason: Láti jẹ́ kí òǹkàwé mọ̀ pé ìtumọ̀ àti àmì ìbéèrè inú ọ̀rọ̀ ìpilẹ̀ jẹ́ ohun tí àwọn onímọ̀ ń yàn ní onírúurú ọ̀nà.
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n ń bi í
  rationale: Ọ̀rọ̀-ìṣe àìpé yìí fi hàn pé wọ́n ń bá a lọ ní bíbéèrè; ‘bi í’ jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ ìbéèrè sí ẹnì kan.
- source_word: Σὺ τίς εἶ;
  choice: Ta ni ìwọ?
  rationale: Èyí pa ìtẹnumọ́ orúkọ-arọ́pò-orúkọ Σὺ mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: Τὴν ἀρχὴν
  choice: láti ìbẹ̀rẹ̀
  rationale: A tẹ̀ lé òye tó bá àyíká ọ̀rọ̀ àti ìtumọ̀ tí POB Gẹ̀ẹ́sì yàn mu, bó tilẹ̀ jẹ́ pé gbólóhùn Gíríìkì náà ṣòro, ó sì lè ní ìtumọ̀ mìíràn.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: Ohun tí mo ti ń sọ fún yín … gan-an
  rationale: ‘Ohun tí’ dúró fún ὅ τι, ‘ń sọ’ sì fi ìṣe tí ó ń bá a lọ hàn; ‘gan-an’ mú agbára καί jáde ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ìdáhùn Jésù nínú gbólóhùn Gíríìkì tí ó ní ìṣòro
  choice: “Ohun tí mo ti ń sọ fún yín láti ìbẹ̀rẹ̀ gan-an ni.”
  alternative: “Èé ṣe tí mo tilẹ̀ ń bá yín sọ̀rọ̀?” tàbí “Lákọ̀ọ́kọ́, ohun tí mo tún ń sọ fún yín ni.”
  rationale: A yàn ìtumọ̀ tó wọ́pọ̀, tó bá àyíká ìbéèrè ‘Ta ni ìwọ?’ mu, tí ó sì bá ìpele ìgbìmọ̀ POB Gẹ̀ẹ́sì mu. Àkọsílẹ̀ ìsàlẹ̀ pa àìdánilójú gidi inú Gíríìkì mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘dá wọn lóhùn’ fún ìtàn aláwọ̀n-ọ̀rọ̀, a sì fi àmì ohùn sí ibi tí ó yẹ.
