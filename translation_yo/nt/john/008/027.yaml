  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: yo
  text: Wọn kò lóye pé nípa Baba ni ó ń bá wọn sọ̀rọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọn kò mọ̀ pé nípa Baba ni ó ń bá wọn sọ̀rọ̀.”
    reason: Àṣàyàn ìtumọ̀ ọ̀rọ̀ οὐκ ἔγνωσαν; “kò mọ̀” túmọ̀ ọ̀rọ̀ náà ní ọ̀nà gígùn ju “kò lóye” lọ.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Wọn kò lóye
  rationale: Nínú àyíká ọ̀rọ̀ yìí, γινώσκω tọ́ka sí pé wọn kò mọ ìtumọ̀ ọ̀rọ̀ Jesu dáadáa. “Kò lóye” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi agbára ìrònú inú ọ̀rọ̀ Gíríìkì hàn, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ “kò mọ̀” mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣe àgbékalẹ̀ kókó ohun tí wọn kò lóye, gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: τὸν πατέρα
  choice: nípa Baba
  rationale: Àkópọ̀ λέγω pẹ̀lú ẹni tí ọ̀rọ̀ dá lé lórí jẹ́ kí “nípa Baba” jẹ́ ìtumọ̀ Yorùbá àdánidá. Nínú àyíká Ìhìn Rere Jòhánù, “Baba” ń tọ́ka sí Ọlọ́run, Baba Jesu.
- source_word: αὐτοῖς
  choice: ń bá wọn sọ̀rọ̀
  rationale: “Bá wọn sọ̀rọ̀” fi hàn ní Yorùbá àdánidá pé àwọn ni Jesu ń sọ ọ̀rọ̀ náà fún.
- source_word: ἔλεγεν
  choice: ni ó ń bá wọn sọ̀rọ̀
  rationale: Àmì “ń” mú ìṣe tí ó ń lọ lọ́wọ́ inú imperfect Gíríìkì jáde; ìṣètò “nípa Baba ni...” tún pa ohun tí ọ̀rọ̀ náà dá lé lórí mọ́.
theological_decisions:
- issue: Ẹni tí “Baba” ń tọ́ka sí
  choice: “Baba” ń tọ́ka sí Ọlọ́run, Baba Jesu.
  alternative: Baba ènìyàn kan
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ nínú Jòhánù máa ń lo “Baba” fún Ọlọ́run gẹ́gẹ́ bí Baba Jesu. Lílo lẹ́tà ńlá ń fi ìdánimọ̀ yìí hàn láìfi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ γινώσκω nínú àyíká yìí
  choice: “lóye”
  alternative: “mọ̀” tàbí “dá mọ̀”
  rationale: “Lóye” fi hàn pé àwọn olùgbọ́ kò mọ ohun tí Jesu ń tọ́ka sí; àlàyé ìsàlẹ̀ ojú ìwé sì pa ìtumọ̀ gígùn “mọ̀” mọ́.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán láti lóye.
