source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: yo
  text: Ta ni nínú yín lè fi hàn pé mo jẹ̀bi ẹ̀ṣẹ̀? Bí mo bá ń sọ òtítọ́, èé ṣe tí ẹ kò gba mí gbọ́?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ta ni nínú yín lè fi ẹ̀rí hàn pé mo jẹ̀bi ẹ̀ṣẹ̀?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èé ṣe tí ẹ kò fi gbẹ́kẹ̀ lé mi?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ọ̀rọ̀ olùsọ̀ gbọ́ àti gbígbẹ́kẹ̀lé e.
    reason: lexical_alternative
  - marker: c
    text: Ní ọ̀rọ̀ gangan, ìbéèrè náà ní “ní ti ẹ̀ṣẹ̀,” èyí tí ó tọ́ka sí ẹ̀ṣẹ̀ gẹ́gẹ́ bí ohun tí a fi ń fẹ̀sùn kàn mí.
    reason: previous_rendering
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Ta ni nínú yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ta ni láàárín yín,’ ó sì pa ìpèníjà tààrà sí àwọn olùgbọ́ mọ́.
- source_word: ἐλέγχει
  choice: lè fi … hàn mí
  rationale: Ní àyíká ìpèníjà yìí, gbólóhùn náà túmọ̀ sí fífi ẹ̀rí mú ẹnì kan tàbí fífi hàn pé ó jẹ̀bi; ‘fi ẹ̀ṣẹ̀ hàn mí’ jẹ́ àdánidá ju lílo ọ̀rọ̀ amòfin líle lọ.
- source_word: περὶ ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Àkópọ̀ ‘fi ẹ̀ṣẹ̀ hàn mí’ sọ ìtumọ̀ pé kí wọ́n fi hàn pé ẹ̀ṣẹ̀ kan wà lára rẹ̀, láì dín ἁμαρτία kù sí ẹ̀ṣẹ̀ pàtó kan.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Bí mo bá ń sọ òtítọ́
  rationale: ‘Bí … bá’ pa ìrísí gbólóhùn oní条件 εἰ mọ́, láì yí i sí ‘nítorí pé,’ bí ó tilẹ̀ jẹ́ pé ìbéèrè náà ní agbára àsọyé.
- source_word: διὰ τί
  choice: èé ṣe
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti ọlọ́lá fún ìbéèrè ìdí ‘kí nìdí?’
- source_word: πιστεύετέ μοι
  choice: ẹ kò fi gbà mí gbọ́
  rationale: ‘Gba mí gbọ́’ lè tọ́ka sí gbígbà ọ̀rọ̀ olùsọ̀ gbọ́, ó sì tún lè ní ìmọ̀lára fífi ìgbẹ́kẹ̀lé sínú ẹni náà, gẹ́gẹ́ bí πιστεύω pẹ̀lú dátífù.
theological_decisions:
- issue: Agbára àsọyé nínú ìpèníjà Jésù nípa àìní ẹ̀ṣẹ̀ àti òtítọ́ ọ̀rọ̀ rẹ̀
  choice: Túmọ̀ àwọn ìbéèrè náà ní tààrà, láì rọ agbára wọn kù tàbí fi ìtumọ̀ àfikún sí wọn.
  alternative: Ṣàlàyé ohun tí ìbéèrè náà túmọ̀ sí ní kedere sí i, bíi ‘Ta ni nínú yín lè fi ẹ̀rí hàn pé mo jẹ̀bi ẹ̀ṣẹ̀ kankan?’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ń gbé ìpèníjà líle kalẹ̀, ó sì so ọ́ mọ́ òtítọ́ ọ̀rọ̀ Jésù. Ìtumọ̀ náà pa ẹ̀rí Kristọ́lójì yìí mọ́ láì fi ẹ̀kọ́ ẹgbẹ́ ìjọ kankan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti jẹ́ àdánidá; èdè náà jẹ́ tààrà, ọlọ́lá, ó sì rọrùn fún òǹkàwé òde òní. Àwọn àmì àlàyé [a][b][c] wà nínú ọ̀rọ̀ pàtàkì.
