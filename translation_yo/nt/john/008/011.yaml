  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: yo
  text: Ó sì wí pé, “Kò sí ẹnì kan, Olúwa.” Jésù sì wí pé, “Èmi náà kò dá ọ lẹ́bi; máa lọ, láti ìsinsìnyí lọ má sì ṣe ẹ̀ṣẹ̀ mọ́.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni ẹsẹ̀ ìkẹyìn nínú ìtàn obìnrin tí wọ́n mú nínú panṣágà (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè yìí lè túmọ̀ sí ọ̀rọ̀ ọ̀wọ̀ bí ‘ọ̀gá,’ ṣùgbọ́n ‘Olúwa’ bá àṣà Bíbélì Yorùbá mu, ó sì fi hàn pé obìnrin náà mọ àṣẹ Jésù.
- source_word: κατακρίνω
  choice: dá … lẹ́bi
  rationale: Àpólà ‘dá ẹni lẹ́bi’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdájọ́ pé ẹni kan jẹ̀bi, ó sì bá ọ̀rọ̀ ẹjọ́ inú àyíká yìí mu.
- source_word: μηκέτι ἁμάρτανε
  choice: láti ìsinsìnyí lọ má sì ṣe ẹ̀ṣẹ̀ mọ́
  rationale: 'Èyí mú ìtumọ̀ àkókò μηκέτι jáde kedere: kí ó dáwọ́ ẹ̀ṣẹ̀ dúró láti àkókò yìí lọ.'
- source_word: πορεύου
  choice: máa lọ
  rationale: ‘Máa lọ’ jẹ́ àṣẹ Yorùbá tó ṣe déédéé, tó sì bá ìtumọ̀ Gíríìkì mu láìfi àlàyé míì kún un.
theological_decisions:
- issue: Ìtumọ̀ κύριε gẹ́gẹ́ bí ọ̀rọ̀ tí obìnrin náà fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Gíríìkì náà lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ lásán tàbí ìjẹ́wọ́ àṣẹ tó ga. ‘Olúwa’ pa ìṣòro ìtumọ̀ náà mọ́ dé ìwọ̀n kan, ó sì tẹ̀ lé lílo ọ̀rọ̀ náà ní ìtàn Jòhánù láìsọ pé obìnrin náà ti ṣe ìjẹ́wọ́ ẹ̀kọ́ ìgbàgbọ́ kan ní kíkún.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. Àtúnṣe ‘láti ìsinsìnyí lọ’ mú ìtumọ̀ μηκέτι hàn ní Yorùbá àdánidá.
