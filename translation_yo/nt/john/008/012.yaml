id: JHN.8.12
reference: John 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: yo
  text: Nígbà náà, Jésù tún sọ̀rọ̀ sí wọn pé, “Èmi ni ìmọ́lẹ̀ ayé. Ẹni tí ó bá tẹ̀lé mi kì yóò rìn nínú òkùnkùn láéláé[a], ṣùgbọ́n yóò ní ìmọ́lẹ̀ ìyè[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “kì yóò rìn nínú òkùnkùn rárá.” Gíríìkì lo ìkọ̀ tó lágbára (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: A tún lè lóye “ìmọ́lẹ̀ ìyè” gẹ́gẹ́ bí “ìmọ́lẹ̀ tí ń fúnni ní ìyè.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Nítorí náà ... tún
  rationale: “Tún” fi hàn pé Jésù tún sọ̀rọ̀, “Nítorí náà” sì so ọ̀rọ̀ yìí mọ́ ìṣàn ọ̀rọ̀ tó ṣáájú láì mú kí ìtumọ̀ ìparí ọgbọ́n náà le ju ti Gíríìkì lọ.
- source_word: ἐλάλησεν ... λέγων
  choice: bá wọn sọ̀rọ̀ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó bá wọn sọ̀rọ̀, lẹ́yìn náà ni ọ̀rọ̀ tí ó sọ tẹ̀ lé.
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Ó tẹ̀ lé ìgbékalẹ̀ gbólóhùn Gíríìkì ní tààrà, ó sì jẹ́ ọ̀nà Yorùbá tó mọ́ láti fi ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ hàn.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: ìmọ́lẹ̀ ayé
  rationale: Ìtumọ̀ yìí ṣe kedere, ó sì pa àwòrán ìmọ́lẹ̀ àti ayé inú ọ̀rọ̀ Jòhánù mọ́.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Ẹni tí ó bá tẹ̀lé mi
  rationale: Ó pa ìtumọ̀ ẹni kọ̀ọ̀kan tí ó ń tẹ̀lé Jésù mọ́, ó sì jẹ́ èdè Yorùbá tó ṣeé lóye.
- source_word: οὐ μὴ περιπατήσῃ
  choice: kì yóò rìn ... láéláé
  rationale: Àfikún “láéláé” mú agbára ìkọ̀ Gíríìkì οὐ μή jáde ní Yorùbá àdánidá.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nínú òkùnkùn
  rationale: Ó pa àwòrán rírìn nínú agbègbè òkùnkùn mọ́.
- source_word: ἕξει
  choice: yóò ní
  rationale: Ìtumọ̀ ọjọ́ iwájú tó rọrùn, tó sì bá Yorùbá mu.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: ìmọ́lẹ̀ ìyè
  rationale: Ó pa ìbáṣepọ̀ tó ṣókí, tó sì ní ọ̀pọ̀ ìtumọ̀ láàárín “ìmọ́lẹ̀” àti “ìyè” mọ́, dípò lílo àlàyé kan ṣoṣo.
theological_decisions:
- issue: Agbára ìdánimọ̀ Jésù nínú Ἐγώ εἰμι
  choice: “Èmi ni” nínú gbólóhùn “Èmi ni ìmọ́lẹ̀ ayé.”
  alternative: Láti fi ìtẹnumọ́ míì kún un kí ó lè tọ́ka ní gbangba sí orúkọ Ọlọ́run.
  rationale: Nínú ẹsẹ yìí, Ἐγώ εἰμι ní àpólà orúkọ tó tẹ̀ lé e. Ìtumọ̀ náà yẹ kí ó pa ìṣètò yìí mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò hàn gbangba sínú ọ̀rọ̀ náà.
- issue: Ìtumọ̀ τὸ φῶς τῆς ζωῆς
  choice: “ìmọ́lẹ̀ ìyè”
  alternative: “ìmọ́lẹ̀ tí ń fúnni ní ìyè”
  rationale: Ìbáṣepọ̀ genitive náà lè ní ju òye kan lọ. Gbólóhùn tó sún mọ́ Gíríìkì pa ìjinlẹ̀ àti àìdánilójú tó bófin mu mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní ibi tó bá èdè àdánidá mu. Àwọn àmì àlàyé ẹsẹ [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, nítorí àwọn àmì inú ìpele ìmọ̀ràn Gẹ̀ẹ́sì kò bá àkóónú àlàyé wọn mu.
