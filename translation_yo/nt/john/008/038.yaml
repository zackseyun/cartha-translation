id: JHN.8.38
reference: John 8:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: yo
  text: Ohun tí mo ti rí ní ọ̀dọ̀ Baba ni mo ń sọ[a]; nítorí náà, ẹ̀yin náà ń ṣe ohun tí ẹ ti gbọ́ láti ọ̀dọ̀ baba yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó túbọ̀ tẹ̀lé Gíríìkì: “Mo ń sọ àwọn ohun tí mo ti rí ní ọ̀dọ̀ Baba; nítorí náà, ẹ̀yin náà ń ṣe àwọn ohun tí ẹ gbọ́ láti ọ̀dọ̀ baba náà.” “Baba” kejì kò ní “yín” ní Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ mú ẹni tí ó ń tọ́ka sí yé (wo ẹsẹ 44). Ó tún ṣeé ṣe láti ka ọ̀rọ̀ ìkẹyìn gẹ́gẹ́ bí àṣẹ: “nítorí náà, ẹ máa ṣe ohun tí ẹ ti gbọ́ láti ọ̀dọ̀ baba yín.”'
    reason: Ó ṣàfihàn ìtumọ̀ tí ó túbọ̀ tẹ̀lé ìṣètò Gíríìkì, àìsí arọ́pò-orúkọ ohun-ìní nínú “baba” kejì, àti àìdánilójú gírámà láàárín indicative àti imperative.
lexical_decisions:
- source_word: ἃ
  choice: ohun tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ aláìlẹ́mìí yìí ń ṣiṣẹ́ gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe kan ń tọ́ka sí; “ohun tí” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: ἑώρακα
  choice: mo ti rí
  rationale: Àkókò perfect tọ́ka sí ohun tí a rí tẹ́lẹ̀ tí ó ṣì ní ìṣe lórí ọ̀rọ̀ ìsinsìnyí; “ti rí” fi èyí hàn ní Yorùbá.
- source_word: παρὰ τῷ πατρὶ
  choice: ní ọ̀dọ̀ Baba
  rationale: παρά pẹ̀lú dative túmọ̀ sí wíwà lẹ́gbẹ̀ẹ́ tàbí níwájú ẹnì kan. “Ní ọ̀dọ̀ Baba” jẹ́ ọ̀nà Yorùbá tó bá àjọṣe àti wíwà pẹ̀lú Baba mu, kì í ṣe pé Baba kàn ni orísun ọ̀rọ̀ náà.
- source_word: λαλῶ
  choice: ni mo ń sọ
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí “sọ.” Ìṣètò “Ohun tí … ni mo ń sọ” jẹ́ àdánidá ní Yorùbá, ó sì jẹ́ kí ohun tí Jésù ń sọ dúró gẹ́gẹ́ bí ohun tààrà ọ̀rọ̀-ìṣe náà.
- source_word: οὖν
  choice: nítorí náà
  rationale: Ó fi ìbáṣepọ̀ ìyọrísí tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn; “nítorí náà” mú ìsopọ̀ yẹn jáde ní kedere.
- source_word: ἠκούσατε
  choice: ẹ ti gbọ́
  rationale: Aorist náà tọ́ka sí ohun tí wọ́n gbọ́ tẹ́lẹ̀; àmì “ti” sọ ìṣe náà di ohun tó ti ṣẹlẹ̀ tí ó sì ní í ṣe pẹ̀lú ìwà wọn báyìí.
- source_word: παρὰ τοῦ πατρὸς
  choice: láti ọ̀dọ̀ baba yín
  rationale: παρά pẹ̀lú genitive fi orísun hàn. Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò ní arọ́pò-orúkọ ohun-ìní níbí, àríyànjiyàn tó yí ẹsẹ náà ká ń fi baba àwọn alátakò Jésù wé Baba rẹ̀; “baba yín” mú èyí ṣe kedere láì sọ ẹni tí baba náà jẹ́ ṣáájú ẹsẹ 44.
- source_word: ποιεῖτε
  choice: ẹ̀yin náà ń ṣe
  rationale: Fọ́ọ̀mù yìí lè jẹ́ indicative tàbí imperative, ṣùgbọ́n àfiwé ohun tí Jésù ń sọ pẹ̀lú ohun tí àwọn olùgbọ́ rẹ̀ ń ṣe, àti ìtẹ̀síwájú sí ẹsẹ 41, ṣe àkàwé indicative ní àkọ́kọ́. Àlàyé ìsàlẹ̀ pa àṣàyàn imperative mọ́.
- source_word: πατήρ / πατρὸς
  choice: Baba / baba
  rationale: “Baba” àkọ́kọ́ tọ́ka sí Ọlọ́run nínú àjọṣe rẹ̀ pẹ̀lú Jésù; “baba” kejì dúró ní lẹ́tà kékeré láti pa ìyàtọ̀ ọ̀rọ̀ náà mọ́ láì tètè sọ pé Èṣù ni.
theological_decisions:
- issue: Bóyá kí a sọ ní tààrà pé “baba” kejì ni Èṣù
  choice: A lò “baba yín” láì sọ pé Èṣù ni.
  alternative: “baba náà” tàbí “Èṣù, baba yín”
  rationale: Ẹsẹ 44 ló sọ ẹni tí baba wọn jẹ́ ní kedere. Kí a má bà a jẹ́ ìlọsíwájú àríyànjiyàn náà, ẹsẹ yìí pa ìtọ́kasí náà mọ́ ní ọ̀nà tí kò tíì péye, bí ó tilẹ̀ jẹ́ pé “yín” ń mú ìyàtọ̀ tó wà láàárín Baba Jésù àti baba àwọn olùgbọ́ rẹ̀ yé ni Yorùbá.
- issue: Bóyá ποιεῖτε jẹ́ gbólóhùn ìròyìn tàbí àṣẹ
  choice: 'A fi hàn gẹ́gẹ́ bí gbólóhùn ìròyìn: “ẹ̀yin náà ń ṣe.”'
  alternative: 'Àṣẹ: “ẹ̀yin náà, ẹ máa ṣe.”'
  rationale: Fọ́ọ̀mù Gíríìkì gba méjèèjì. Àfiwé ìwà wọn àti ẹsẹ 41 fara mọ́ ìròyìn, ṣùgbọ́n a jẹ́wọ́ àṣàyàn àṣẹ nínú àlàyé ìsàlẹ̀ kí a má ṣe pa àìdánilójú ojúlówó náà rẹ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. Ìṣètò “Ohun tí … ni mo ń sọ” àti “láti ọ̀dọ̀” jẹ́ èdè tó rọrùn fún òǹkàwé lónìí, nígbà tí “Baba/baba” ń pa ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìlọsíwájú àríyànjiyàn mọ́.
