id: JHN.8.28
reference: John 8:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: yo
  text: Nítorí náà, Jésù sọ pé, “Nígbà tí ẹ bá gbé Ọmọ Ènìyàn sókè,[a] nígbà náà ni ẹ ó mọ̀ pé Èmi ni,[b] àti pé èmi kò ṣe ohunkóhun láti ara mi, ṣùgbọ́n bí Baba ti kọ́ mi gan-an ni mo ṣe ń sọ nǹkan wọ̀nyí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gbé ... sókè” lè tọ́ka sí gbígbé e sókè ní ti ara, ó sì tún lè túmọ̀ sí gbígbé e ga nínú lílo Jòhánù.
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: “Èmi ni.” Gíríìkì kàn sọ ἐγώ εἰμι (“Èmi ni”) láìsọ ohun tí ó tẹ̀ lé e.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìjíròrò tó ṣáájú, ó sì lè fi àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn.
- source_word: Ὅταν
  choice: Nígbà tí
  rationale: Ó tọ́ka sí ìṣẹ̀lẹ̀ pàtó kan tí yóò ṣẹlẹ̀ lọ́jọ́ iwájú, kì í ṣe ohun tí ń ṣẹlẹ̀ léraléra.
- source_word: ὑψώσητε
  choice: ẹ bá gbé ... sókè
  rationale: 'Ọ̀rọ̀ yìí pa ìtumọ̀ méjèèjì mọ́: gbígbé Jésù sókè ní ti ara lórí àgbélébùú àti gbígbé e ga.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ọ̀nà Yorùbá tó bójú mu fún orúkọ oyè tí Jésù fi ń pe ara rẹ̀, ó sì pa ìsopọ̀ rẹ̀ mọ́ lílo rẹ̀ nínú Ìwé Dáníẹ́lì àti àwọn Ìhìn Rere.
- source_word: γνώσεσθε
  choice: ẹ ó mọ̀
  rationale: Ó fi ìmọ̀ tàbí ìdánimọ̀ tí yóò dé ní ọjọ́ iwájú hàn ní ọ̀nà tó ṣe déédéé ní Yorùbá.
- source_word: ἐγώ εἰμι
  choice: Èmi ni
  rationale: Gíríìkì kò sọ ohun tí ‘Èmi ni’ ń tọ́ka sí ní tààrà; ‘Èmi ni’ jẹ́ èdè Yorùbá àdánidá tó tún pa ìkìlọ̀ àti àìṣe kedere ọ̀rọ̀ náà mọ́.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: láti ara mi
  rationale: Ó pa èrò orísun tàbí ṣíṣe ohun ní ìdásílẹ̀ ara ẹni mọ́, láìfi àlàyé àfikún sínú ọ̀rọ̀ náà.
- source_word: ποιῶ οὐδέν
  choice: èmi kò ṣe ohunkóhun
  rationale: Ó ṣàfihàn gbólóhùn gbogbogbò nípa pé Jésù kò ṣe ohun kan láti orísun ara rẹ̀.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: bí Baba ti kọ́ mi gan-an
  rationale: ‘Bí ... gan-an’ mú ìbámu pẹ̀lú καθώς jáde, ‘Baba’ sì jẹ́ ọ̀nà àdánidá láti túmọ̀ πατήρ nínú àyíká ọ̀rọ̀ Jòhánù.
- source_word: ταῦτα λαλῶ
  choice: ni mo ṣe ń sọ nǹkan wọ̀nyí
  rationale: Ó pa demonstrative ταῦτα mọ́, ó sì sọ gbólóhùn náà ní Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìtumọ̀ ἐγώ εἰμι tí kò ní predicate tí a sọ jáde
  choice: Èmi ni
  alternative: Èmi ni ẹni náà
  rationale: ‘Èmi ni’ pa ọ̀rọ̀ Gíríìkì tó ṣókí, tó sì ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ mọ́ láìfipá sọ pé ó jẹ́ ìtọ́ka orúkọ Ọlọ́run nìkan; àlàyé ìsàlẹ̀ fi àìṣe kedere náà hàn.
- issue: Ìtumọ̀ ὑψώσητε nínú Jòhánù
  choice: gbé ... sókè
  alternative: kàn mọ́ àgbélébùú / gbé ga
  rationale: Àṣàyàn yìí pa ìtumọ̀ méjèèjì mọ́—gbígbé sókè lórí àgbélébùú àti gbígbé ga—dípò kí ó yan ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣe é lóye ni a lò. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí nọ́ńbà ọ̀pọ̀ Gíríìkì ṣe fi hàn. Àwọn àmì ohùn ni a kọ sí ibi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ ẹlẹ́gbẹ́ kan.
