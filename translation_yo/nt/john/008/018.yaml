  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: yo
  text: Èmi ni ẹni tí ń jẹ́rìí nípa ara mi[a], Baba tí ó rán mi náà sì ń jẹ́rìí nípa mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń sọ̀rọ̀ ẹ̀rí nípa ara mi … ń sọ̀rọ̀ ẹ̀rí nípa mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Èmi ni
  rationale: Ó fi ìtẹnumọ́ arọ́pò-orúkọ èmi hàn, ó sì bá àkójọpọ̀ ọ̀rọ̀ tí ó ní àpèjúwe ẹni lẹ́yìn rẹ̀ mu ní Yorùbá.
- source_word: ὁ μαρτυρῶν
  choice: ẹni tí ń jẹ́rìí
  rationale: Àpilẹ̀kọ pẹ̀lú participle náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ, ‘ẹni tí ń jẹ́rìí’; ‘ń’ tún pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: περὶ ἐμαυτοῦ
  choice: nípa ara mi
  rationale: ‘Nípa’ jẹ́ ọ̀nà Yorùbá adayeba fún περί pẹ̀lú genitive, ‘ara mi’ sì pa agbára reflexive mọ́ láì túmọ̀ rẹ̀ sí ‘ní ìtìlẹ́yìn ara mi.’
- source_word: μαρτυρεῖ
  choice: ń jẹ́rìí
  rationale: Lílo ọ̀rọ̀ kan náà bíi ti μαρτυρῶν pa àsopọ̀ èdè ẹ̀rí àti agbára ọ̀ràn-ẹjọ́ inú ẹsẹ náà mọ́.
- source_word: περὶ ἐμοῦ
  choice: nípa mi
  rationale: Ó jẹ́ ìtumọ̀ adayeba, tààrà fún ‘nípa mi’ tàbí ‘ní ti mi.’
- source_word: ὁ πέμψας με πατήρ
  choice: Baba tí ó rán mi
  rationale: Ó tẹ̀lé àpèjúwe participle aorist náà gẹ́gẹ́ bí gbólóhùn ìbátan, láì fi ‘Baba mi’ tàbí ‘Ọlọ́run Baba’ kún ohun tí Gíríìkì kò sọ ní kedere.
theological_decisions:
- issue: Ìtọ́kasí ‘Baba’ nínú àyíká ìwé Jòhánù
  choice: Baba tí ó rán mi
  alternative: Baba mi tí ó rán mi; Ọlọ́run Baba tí ó rán mi
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘Baba’ pẹ̀lú àpèjúwe ‘tí ó rán mi.’ Ìtumọ̀ náà pa ìbáṣepọ̀ àti ẹ̀kọ́ ìsìn inú ọ̀rọ̀ mọ́ láì fi àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ náà kún un.
- issue: Agbára ọ̀rọ̀ ẹ̀rí nínú àyíká bí ti ilé-ẹjọ́
  choice: jẹ́rìí
  alternative: sọ̀rọ̀ ẹ̀rí
  rationale: ‘Jẹ́rìí’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa àwòrán ẹlẹ́rìí àti ẹ̀rí nínú ìjíròrò Jòhánù mọ́. A lò ó lẹ́ẹ̀mejì láti pa ìṣọ̀kan ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá ìpele òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Èmi ni ẹni tí…’ jẹ́ kedere sí òǹkàwé lasán, ‘Baba’ sì dúró láìsí àfikún ìtumọ̀ ẹ̀kọ́ ìsìn.
