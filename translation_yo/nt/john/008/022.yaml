id: JHN.8.22
reference: John 8:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù ń sọ pé[a], “Kò ní pa ara rẹ̀, àbí? Nítorí ó ń sọ pé, ‘Ibi tí èmi ń lọ, ẹ̀yin kò lè wá.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, bóyá, gẹ́gẹ́ bí àyíká ọ̀rọ̀ nínú Ìhìn Rere Jòhánù ṣe rí, “àwọn ará Jùdíà” tàbí “àwọn aṣáájú Júù,” gẹ́gẹ́ bí ìwọ̀n àwọn ènìyàn tí Jòhánù ń tọ́ka sí níbí ṣe gbòòrò tó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àkókò imperfect fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń tún ṣe hàn; ‘ń sọ’ mú apá yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ wọn mọ́ ohun tí Jésù ṣẹ̀ṣẹ̀ sọ, ó sì fi ìyọrísí èrò wọn hàn.
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ ọ̀rọ̀ Gíríìkì náà ní tààrà; bí ó tilẹ̀ jẹ́ pé nínú Jòhánù ó lè tọ́ka sí àwọn ará Jùdíà tàbí àwọn aṣáájú Júù gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí, ẹsẹ yìí kò dín àwọn tí a ń tọ́ka sí kù ní kedere.
- source_word: Μήτι
  choice: Ó dájú pé kò ní ... ?
  rationale: Μήτι bẹ̀rẹ̀ ìbéèrè tí olùbéèrè retí ìdáhùn òdì sí; ọ̀nà yìí fi ìṣiyèméjì wọn hàn ní Yorùbá àdánidá.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: pa ara rẹ̀
  rationale: Ó pa ìtumọ̀ reflexive náà mọ́ ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá ti òde òní.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé pé ohun tí Jésù sọ ni ìdí tí wọ́n fi ń rò báyìí.
- source_word: λέγει
  choice: ó sọ pé
  rationale: Yorùbá máa ń lo ‘sọ pé’ lọ́nà àdánidá láti mú ọ̀rọ̀ ẹni wá, láìsọ àsìkò ọ̀rọ̀ náà di ohun mìíràn.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ibi tí èmi ń lọ
  rationale: Ó fi ìtẹnumọ́ ἐγώ hàn pẹ̀lú ‘èmi,’ ó sì túmọ̀ ìlọ tàbí ìkúrò náà láìfi àlàyé tí kò sí nínú ẹsẹ kún un.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ẹ̀yin kò lè wá
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò ὑμεῖς mọ́ pẹ̀lú ‘ẹ̀yin,’ ó sì fi àìlè ṣe hàn ní ṣókí.
theological_decisions:
- issue: Àwọn tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú Ìhìn Rere Jòhánù
  choice: Pa ìtumọ̀ tààrà ‘àwọn Júù’ mọ́ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: ‘àwọn ará Jùdíà’ tàbí ‘àwọn aṣáájú Júù’
  rationale: Ọ̀rọ̀ Gíríìkì náà kò dín àwọn tí ó ń tọ́ka sí kù ní kedere nínú ẹsẹ yìí. Àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ tí àyíká Ìhìn Rere Jòhánù lè gbà mọ́, kí a má bàa sọ ọ́ di ọ̀rọ̀ nípa gbogbo ẹ̀yà Júù láìṣe àfiyèsí àyíká.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ̀yin’ láti pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò Gíríìkì mọ́.
