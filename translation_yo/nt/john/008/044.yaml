id: JHN.8.44
reference: John 8:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: yo
  text: Ẹ jẹ́ ti baba yín, Èṣù, ẹ sì fẹ́ ṣe àwọn ohun tí baba yín ń fẹ́. Apànìyàn ni ó jẹ́ láti ìbẹ̀rẹ̀, kò sì dúró nínú òtítọ́, nítorí pé kò sí òtítọ́ kankan nínú rẹ̀. Nígbàkigbà tí ó bá ń sọ irọ́[a], láti inú ohun tí ó jẹ́ tirẹ̀ ni ó ń sọ ọ́[b], nítorí pé òpùrọ́ ni, òun sì ni baba irọ́ náà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, Gíríìkì náà ní, “Nígbàkigbà tí ó bá ń sọ irọ́ náà.” A tún lè sọ ọ́ ní ṣókí pé, “Nígbàkigbà tí ó bá ń purọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ó ń sọ láti inú ohun tirẹ̀,” ìyẹn ni pé, láti inú ohun tó jẹ́ ti ìwà tàbí ìṣesí tirẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “baba rẹ̀.” Ó ṣeé ṣe jù lọ pé “rẹ̀” ń tọ́ka sí irọ́ náà. Àwọn mìíràn gbà á ní ọ̀nà gbogbogbò gẹ́gẹ́ bí “baba àwọn irọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ
  choice: Èṣù ni baba yín; láti ọ̀dọ̀ rẹ̀ ni ẹ ti wá
  rationale: Èyí sọ ìtumọ̀ orísun tàbí ìfarakọ́ra tí ἐκ pẹ̀lú εἰμί ní ní ọ̀nà Yorùbá tí ó ṣe kedere, ó sì pa ìbáwí líle náà mọ́.
- source_word: ἐπιθυμίας
  choice: àwọn ohun tí baba yín ń fẹ́
  rationale: Ọ̀rọ̀ yìí gbòòrò ju ìfẹ́kúfẹ̀ẹ́ ti ara lọ; gbolohun yìí fi ìfẹ́ àti ète baba wọn hàn láì fi ìtumọ̀ ìbálòpọ̀ kún un.
- source_word: θέλετε ποιεῖν
  choice: ẹ fẹ́ ṣe
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ìfẹ́ inú àti ìpinnu láti ṣe ohun kan.
- source_word: ἀνθρωποκτόνος
  choice: apànìyàn
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí ẹni tí ń pa ènìyàn, ó sì bá agbára ìdájọ́ ọ̀rọ̀ Gíríìkì mu.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Ó pa ìtọ́kasí àkókò náà mọ́ ní tààràtà, ó sì bá ìlò ọ̀rọ̀ Johanu mu.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: kò dúró nínú òtítọ́
  rationale: Ó pa àwòrán ‘dídúró’ mọ́, kò sì fi dandan sọ pé ó ti wà nínú òtítọ́ rí, lẹ́yìn náà ni ó ṣubú kúrò níbẹ̀.
- source_word: ἀλήθεια
  choice: òtítọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún bí Johanu ṣe ń lo ọ̀rọ̀ náà.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: Nígbàkigbà tí ó bá ń sọ irọ́
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìṣe tí ó máa ń ṣẹlẹ̀; àlàyé ìsàlẹ̀ fi ìṣètò ọ̀rọ̀ Gíríìkì tó túmọ̀ ní tààràtà sí ‘sọ irọ́ náà’ pamọ́.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: láti inú ohun tí ó jẹ́ tirẹ̀ ni ó ti ń sọ ọ́
  rationale: Ó dúró sún mọ́ ọ̀rọ̀ Gíríìkì pé ohun tí ó ń sọ ń jáde láti inú ohun tí í ṣe tirẹ̀, láì sọ ‘ìwà ẹ̀dá’ sínú àyọkà gẹ́gẹ́ bí ohun tí Gíríìkì sọ ní tààràtà.
- source_word: ψεύστης
  choice: òpùrọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá orúkọ ẹni tí irọ́ jẹ́ ìwà rẹ̀ mu.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: baba irọ́ náà
  rationale: Ó mú antecedent tó ṣeé ṣe jù lọ, τὸ ψεῦδος, hàn ní Yorùbá, ó sì fi àṣàyàn mìíràn sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí ὁ πατὴρ αὐτοῦ ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí pé èṣù ni baba tàbí orísun irọ́ náà.
  alternative: A lè ka αὐτοῦ sí ‘baba rẹ̀,’ tàbí kí a ṣe àkópọ̀ rẹ̀ sí ‘baba àwọn irọ́.’
  rationale: τὸ ψεῦδος ni ohun tó sún mọ́ ọn jù lọ tí arọ́pò-orúkọ náà lè tọ́ka sí. Àlàyé ìsàlẹ̀ pa àìdánilójú gírámà náà mọ́ láì dá ẹ̀kọ́ àròsọ kan sílẹ̀ nípa baba èṣù.
- issue: Bóyá ἔστηκεν túmọ̀ sí pé èṣù ti dúró nínú òtítọ́ rí ṣáájú
  choice: ‘kò dúró nínú òtítọ́’ ni a lò, láì sọ pé ó ti wà níbẹ̀ rí.
  alternative: ‘kò dúró ṣinṣin mọ́ nínú òtítọ́’ tàbí ‘kò bá a lọ láti dúró nínú òtítọ́,’ èyí tó lè fi ìdí ìwà tẹ́lẹ̀ múlẹ̀.
  rationale: Gíríìkì sọ pé kò dúró nínú òtítọ́, ṣùgbọ́n ọ̀rọ̀ ‘kò dúró mọ́’ lè dáhùn ìbéèrè ẹ̀kọ́ ìgbàgbọ́ kan tí àyọkà náà kò yanju ní kedere.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó ṣeé lóye lójoojúmọ́, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbolohun àkọ́kọ́ ni a tún tò díẹ̀ kí ìbáṣepọ̀ ‘baba yín, èṣù’ àti ìtumọ̀ ἐκ gẹ́gẹ́ bí orísun lè ṣe kedere ní Yorùbá. Àwọn ọ̀rọ̀ ‘apànìyàn,’ ‘òtítọ́,’ àti ‘òpùrọ́’ pa agbára àti ìtakora inú ẹsẹ náà mọ́.
