  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: yo
  text: Mo mọ̀ pé irú-ọmọ Ábúráhámù ni yín[a]; ṣùgbọ́n ẹ ń wá láti pa mí, nítorí ọ̀rọ̀ mi kò ní ààyè nínú yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “irúgbìn Ábúráhámù” tàbí “àwọn àtọmọdọ́mọ Ábúráhámù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ọ̀rọ̀ mi kò ní ibi gbà nínú yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: irú-ọmọ Ábúráhámù
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ àpapọ̀ tó ń tọ́ka sí ìran nípa ti ara. “Irú-ọmọ” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ ìran mọ́ láì fi èrò nípa ọmọ nípa tẹ̀mí kún un.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: ẹ ń wá ọ̀nà láti pa mí
  rationale: Ó fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì pa agbára ζητέω pẹ̀lú àìsópò-ọ̀rọ̀ mọ́ láì pinnu bóyá ìfẹ́, ìgbìyànjú, tàbí ète ni a fẹ́ tẹnu mọ́.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: ọ̀rọ̀ mi
  rationale: Èyí ni ìtumọ̀ tààrà fún λόγος, ó sì pa ìlò ọ̀rọ̀ Jòhánù tó lè ní ìtumọ̀ onípele mọ́ ju “ìhìn mi” lọ.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: kò rí ààyè nínú yín
  rationale: Ó pa àwòrán pé ọ̀rọ̀ náà kò rí àyè gbà nínú wọn mọ́, láì dín ìtumọ̀ χωρέω kù sí gbígbàgbọ́, ìtẹ́wọ́gbà, tàbí ìtẹ̀síwájú nìkan.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín jíjẹ́ irú-ọmọ Ábúráhámù àti ète wọn láti pa Jésù.
- source_word: οἶδα ὅτι
  choice: Mo mọ̀ pé
  rationale: Ìtumọ̀ tààrà àti àdánidá fún gbólóhùn ìṣáájú àti gbólóhùn àkóónú tó tẹ̀ lé e.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín jíjẹ́ irú-ọmọ Ábúráhámù nípa ti ara àti fífi ìwà Ábúráhámù hàn
  choice: 'A túmọ̀ σπέρμα Ἀβραάμ gẹ́gẹ́ bí ìran nípa ti ara: “irú-ọmọ Ábúráhámù.”'
  alternative: àwọn ọmọ Ábúráhámù
  rationale: Ní àyíká ọ̀rọ̀ yìí, Jésù gbà pé ìran Ábúráhámù ni wọ́n nípa ti ara, ṣùgbọ́n ó dojú kọ ìhùwàsí wọn sí òun. “Irú-ọmọ” kò yára yanju ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí àwọn ẹsẹ tó yí i ká ń mú jáde.
translation_notes:
  register: Yorùbá àkànṣe òde òní pẹ̀lú àmì ohùn kíkún níbi tó bá bá èdè mu; ohùn náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ/yín” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμεῖς/ὑμῖν.
