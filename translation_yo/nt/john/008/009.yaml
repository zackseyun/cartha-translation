  source_fidelity: 'Ìtumọ̀ náà mú èrò pàtàkì Gíríìkì náà dáadáa: gbígbọ́, ìdálẹ́bi ẹ̀rí-ọkàn, jíjáde lọ lọ́kọ̀ọ̀kan láti ọ̀dọ̀ àwọn tí ó dàgbà jù, àti Jésù tí ó ṣẹ́ kù pẹ̀lú obìnrin náà ní àárín. Ṣùgbọ́n ‘bẹ̀rẹ̀ sí í jáde lọ’ ń fi ìbẹ̀rẹ̀ ìṣe kún ἐξήρχοντο, èyí tí ó kan túmọ̀ sí wọ́n jáde/wọ́n ń jáde lọ. ‘Bẹ̀rẹ̀ pẹ̀lú’ yẹ kí ó so mọ́ ìlànà àwọn ẹni tí wọ́n jáde, gẹ́gẹ́ bí ἀρξάμενοι.'
