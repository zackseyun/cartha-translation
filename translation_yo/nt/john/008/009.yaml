id: JHN.8.9
reference: John 8:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn tí ó gbọ́ ọ̀rọ̀ náà[a], tí ẹ̀rí-ọkàn wọn sì ń dá wọn lẹ́bi, jáde lọ lọ́kọ̀ọ̀kan, bẹ̀rẹ̀ pẹ̀lú àwọn tí ó dàgbà jù títí dé àwọn tí ó kẹ́yìn[b]. Jésù nìkan ni ó sì ṣẹ́ kù, obìnrin náà sì dúró ní àárín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí jẹ́ ìtẹ̀síwájú ìtàn obìnrin tí a mú nínú panṣágà (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
  - marker: b
    text: Tàbí, “títí dé ẹni tí ó kẹ́yìn.”
    reason: translation_ambiguity
lexical_decisions:
- source_word: συνείδησις
  choice: ẹ̀rí-ọkàn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún agbára inú ènìyàn tí ń jẹ́rìí sí ohun rere tàbí ohun búburú.
- source_word: ἐλέγχω
  choice: ń dá wọn lẹ́bi
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí bí ẹ̀rí-ọkàn wọn ṣe fi ẹ̀bi wọn hàn sí wọn; ‘dá wọn lẹ́bi’ mú ìdájọ́ inú ọkàn yìí jáde ní èdè Yorùbá àdánidá.
- source_word: πρεσβύτερος
  choice: àwọn tí ó dàgbà jù
  rationale: Ìyàtọ̀ tó wà láàárín àwọn wọ̀nyí àti ‘àwọn tí ó kẹ́yìn’ fi hàn pé ọjọ́-orí ni a ń tẹnumọ́, kì í ṣe ipò àwọn alàgbà nínú ìjọ tàbí àwùjọ.
- source_word: εἷς καθ' εἷς
  choice: lọ lọ́kọ̀ọ̀kan
  rationale: Èyí sọ ní kedere pé ọ̀kọ̀ọ̀kan wọn ni ó jáde ní tẹ̀lé-tẹ̀lé.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: dúró ní àárín
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán obìnrin náà tí ó dúró ní àárín mọ́ láìfi ohun tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìtumọ̀ ‘Jésù nìkan ni ó ṣẹ́ kù’ nígbà tí obìnrin náà ṣì wà níbẹ̀
  choice: Pa ọ̀rọ̀ ‘Jésù nìkan’ mọ́, kí a sì tẹ̀ lé e pẹ̀lú dídúró obìnrin náà ní àárín.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘Jésù nìkan ni ó ṣẹ́ kù lára àwọn olùfisùn.’
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé Jésù nìkan ni ó ṣẹ́ kù, ṣùgbọ́n ó tún mẹ́nu kan obìnrin náà lẹ́sẹ̀kẹsẹ̀. Fífi ‘lára àwọn olùfisùn’ kún un yóò tú ìdíjú náà sí ọ̀nà kan tí orísun kò sọ ní tààrà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn kún ún níbi tí ó bá yẹ. ‘Ẹ̀rí-ọkàn’ àti ‘ń dá wọn lẹ́bi’ jẹ́ ọ̀rọ̀ àdánidá tí ó pa ìtumọ̀ ìwà rere àti ẹ̀bi inú mọ́; ‘àwọn tí ó dàgbà jù’ yẹra fún lílo ‘àwọn alàgbà’ gẹ́gẹ́ bí oyè.
