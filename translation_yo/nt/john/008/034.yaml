  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: yo
  text: 'Jésù dá wọn lóhùn pé, “Lóòótọ́, lóòótọ́ ni mo wí fún yín: gbogbo ẹni tí ó ń ṣe ẹ̀ṣẹ̀ jẹ́ ẹrú ẹ̀ṣẹ̀.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù dá wọn lóhùn
  rationale: Ọ̀nà Yorùbá àdánidá fún ìdáhùn nínú ìjíròrò ni èyí; ó sì pa agbára ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ó sọ ìdánilójú ọ̀rọ̀ Jésù di mímọ̀ fún òǹkàwé Yorùbá, ó sì pa àtúnwí pàtàkì tí ó wọ́pọ̀ nínú Jòhánù mọ́.
- source_word: λέγω ὑμῖν
  choice: ni mo wí fún yín
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ ìpilẹ̀, ó sì ní ìwọ̀ntúnwọ̀nsì àti ìrọ̀rùn nínú Yorùbá.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: olúkúlùkù ẹni tí ó ń dá ẹ̀ṣẹ̀
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ ‘ń dá’ fi ìṣe tí ń bá a lọ tàbí tí ó ti di àṣà hàn, láìfi ọ̀rọ̀ ìtumọ̀ míì kún un.
- source_word: δοῦλος
  choice: ẹrú
  rationale: ‘Ẹrú’ fi ipò ìdè àti wíwà lábẹ́ agbára ẹ̀ṣẹ̀ hàn kedere ju ‘ìránṣẹ́’ lọ, èyí sì bá àkòrí ọ̀rọ̀ náà mu.
- source_word: τῆς ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Nínú gbólóhùn ‘ẹrú ẹ̀ṣẹ̀,’ èdè Yorùbá lè fi ìní tàbí ìṣàkóso hàn láìsí àfikún; ó túmọ̀ sí ẹni tí ẹ̀ṣẹ̀ ń ṣàkóso.
theological_decisions:
- issue: Bóyá ποιῶν ń tọ́ka sí ẹ̀ṣẹ̀ ẹyọ kan tàbí ìṣe tí ń bá a lọ
  choice: olúkúlùkù ẹni tí ó ń dá ẹ̀ṣẹ̀
  alternative: olúkúlùkù ẹni tí ó dá ẹ̀ṣẹ̀
  rationale: Present participle Gíríìkì lè tọ́ka sí ìṣe tí ń bá a lọ tàbí ìwà àṣà. Lílò ‘ń dá’ pa agbára yẹn mọ́, ṣùgbọ́n kò sọ ọ́ di ẹ̀kọ́ ìsìn tó kọjá ohun tí ẹsẹ náà sọ.
- issue: Agbára àpèjúwe δοῦλος
  choice: ẹrú ẹ̀ṣẹ̀
  alternative: ìránṣẹ́ ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ náà ń tẹnumọ́ ìdè àti ìṣàkóso ẹ̀ṣẹ̀; ‘ẹrú’ ni ó pa ìfarahàn líle yẹn mọ́ dáadáa.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Wí fún yín’ ń pa ìdúró ọ̀rọ̀ mímọ́ náà mọ́, nígbà tí gbogbo gbólóhùn ṣì ṣeé lóye fún òǹkàwé lásán.
