  source_fidelity: 'Ìtumọ̀ náà ń mú ìtumọ̀ àwọn gbolohun Gíríìkì náà hàn dáadáa: ìdáhùn sí Jésù, ìjẹ́ irú-ọmọ Ábúráhámù, ìkéde pé wọn kò tíì jẹ́ ẹrú fún ẹnikẹ́ni, àti ìbéèrè ìyàlẹ́nu nípa dídì òmìnira. Síbẹ̀, “Àtọmọdọ́mọ Ábúráhámù ni àwa” lè dà bí ẹni pé wọ́n ń pè ara wọn ní ọ̀pọ̀ “àwọn àtọmọdọ́mọ,” dípò kí ó pa ẹyọ-ọpọ̀ Σπέρμα mọ́ ní kedere. “Irú-ọmọ Ábúráhámù ni àwa” jẹ́ aṣayan tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ náà, tí ó sì jẹ́ Yorùbá àdánidá.'
