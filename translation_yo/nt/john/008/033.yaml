  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: yo
  text: Wọ́n dá a lóhùn pé, “Irú-ọmọ Ábúráhámù ni àwa[a], a kò sì tíì jẹ́ ẹrú fún ẹnikẹ́ni rí[b]. Báwo ni ìwọ ṣe lè sọ pé, ‘Ẹ ó di òmìnira’[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ ẹyọ kan tó túmọ̀ ní tààrà sí “irú-ọmọ Ábúráhámù,” ṣùgbọ́n ó ń tọ́ka sí gbogbo àwọn àtọmọdọ́mọ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “a kò tíì sin ẹnikẹ́ni rí.” Síbẹ̀, nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí jíjẹ́ ẹrú tàbí wíwà nínú ìdè ní pàtàkì.
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ pé, “Ẹ ó lómìnira.” Ní tààrà, Gíríìkì sọ pé, “Ẹ ó di òmìnira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Wọ́n dá a lóhùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n fèsì tààrà sí i, láìtẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì ní líle.
- source_word: Σπέρμα Ἀβραάμ
  choice: Àtọmọdọ́mọ Ábúráhámù
  rationale: Σπέρμα jẹ́ ọ̀rọ̀ ẹyọ kan tí ó dúró fún gbogbo ìran; “àtọmọdọ́mọ” sọ ìran ti ara ní Yorùbá òde òní ní kedere láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: a kò sì tíì jẹ́ ẹrú fún ẹnikẹ́ni rí
  rationale: Ọ̀rọ̀ náà tẹnumọ́ ipò ìgbèkùn tàbí ẹrú nínú àyíká ọ̀rọ̀ òmìnira yìí. “Kò tíì…rí” tún fi ipa perfect àti πώποτε hàn ní Yorùbá àdánidá.
- source_word: πῶς σὺ λέγεις
  choice: Báwo ni ìwọ ṣe lè sọ pé
  rationale: “Ìwọ” pa ìtẹnumọ́ σὺ mọ́, “ṣe lè sọ” sì mú ìyàlẹ́nu àti àtakò inú ìbéèrè náà jáde ní Yorùbá.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Ẹ ó di òmìnira
  rationale: “Di” pa ìyípadà tí γενήσεσθε ń tọ́ka sí mọ́, dípò kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ipò lasán; “òmìnira” bá ìtakora rẹ̀ pẹ̀lú jíjẹ́ ẹrú mu.
theological_decisions:
- issue: Ìtumọ̀ δουλεύω ní àyíká ẹrú àti òmìnira
  choice: jẹ́ ẹrú
  alternative: sìn
  rationale: Àwọn ẹsẹ tó yí i ká ń sọ nípa ẹrú àti òmìnira. “Jẹ́ ẹrú” pa agbára ti ìdè àti ipò abẹ́ àṣẹ mọ́ ju “sìn” lọ, láìyanju ìforígbárí ẹ̀kọ́ ìsìn inú ọ̀rọ̀ náà fún òǹkàwé.
- issue: Ìtumọ̀ Σπέρμα Ἀβραάμ
  choice: Àtọmọdọ́mọ Ábúráhámù
  alternative: Irú-ọmọ Ábúráhámù
  rationale: Èyí ń fi ẹ̀tọ́ tí àwọn olùsọ̀rọ̀ ń sọ pé àwọn ní nítorí ìran ti ara hàn, láìkó ìtumọ̀ pàtó láti àwọn àyíká ẹ̀kọ́ ìsìn mìíràn wọlé.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. “Wọ́n dá a lóhùn” àti “kò tíì…rí” jẹ́ gbólóhùn àdánidá; “ìwọ” pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́. Gbogbo àmì ohùn ni a fi síbi tí ó bá yẹ.
