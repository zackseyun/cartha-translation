id: JHN.8.54
reference: John 8:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: yo
  text: Jésù dáhùn pé[a], “Bí èmi bá yin ara mi lógo, ògo mi kò jẹ́ nǹkan kan. Baba mi ni ẹni tí ń yìn mí lógo, ẹni tí ẹ̀yin sọ pé ó jẹ́ Ọlọ́run wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “Ọlọ́run yín” dípò “Ọlọ́run wa.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn pé
  rationale: Ọ̀nà àdánidá tí Yorùbá fi ń sọ ìdáhùn nínú ìjíròrò ni ‘dáhùn pé’; ó tún mú ọ̀rọ̀ tí ó tẹ̀ lé e wọlé lọ́nà tó ṣe kedere.
- source_word: δοξάσω
  choice: yin ... lógo
  rationale: ‘Yin lógo’ dá ìtumọ̀ δοξάζω àti kókó ògo nínú Ìhìn Rere Jòhánù mọ́, ó sì jẹ́ èdè Yorùbá tó ṣeé lóye.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: ògo mi kò jẹ́ nǹkan kan
  rationale: Ó tẹ̀ lé ìtumọ̀ gírámà Gíríìkì pé ‘ògo mi kì í ṣe nǹkan kan,’ láì ṣàfikún èrò iye tàbí àǹfààní tí kò hàn gbangba nínú orísun.
- source_word: ὁ πατήρ μου
  choice: Baba mi
  rationale: ‘Baba mi’ jẹ́ ìtumọ̀ tààrà, ó sì bá bí Jésù ṣe ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Baba rẹ̀ mu.
- source_word: ὁ δοξάζων με
  choice: ẹni tí ń yìn mí lógo
  rationale: Ìṣẹ̀dá ‘ẹni tí ń ...’ fi àpilẹ̀kọ àti participle tó wà nínú Gíríìkì hàn, nígbà tí àmì ‘ń’ pa ìṣe tí ń lọ tàbí ìwà àpèjúwe náà mọ́.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: ẹni tí ẹ̀yin sọ pé ó jẹ́ Ọlọ́run wa
  rationale: Ó pa gbólóhùn ìbátan àti ìtẹnumọ́ ‘ẹ̀yin’ mọ́, ó sì tẹ̀ lé kíkà SBLGNT, ἡμῶν, ‘wa.’
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Nínú àyíká yìí, Ọlọ́run Ísírẹ́lì ni a ń tọ́ka sí; ‘Ọlọ́run’ ni ọ̀rọ̀ Yorùbá tó yẹ.
- source_word: ἡμῶν
  choice: wa
  rationale: A tẹ̀ lé ọ̀rọ̀ inú SBLGNT, ἡμῶν (‘wa’), nígbà tí a fi ìyàtọ̀ ὑμῶν (‘yín’) sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ọ̀rọ̀ arọ́pò-orúkọ nínú θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: Ọlọ́run wa
  alternative: Ọlọ́run yín
  rationale: Ọ̀rọ̀ àkọ́kọ́ SBLGNT ní ἡμῶν (‘wa’), nítorí náà a lò ó nínú ẹsẹ̀. Nítorí pé àwọn àfọwọ́kọ kan ní ὑμῶν (‘yín’), a tọ́ka sí i nínú àlàyé ìsàlẹ̀ láì yanju ìyàtọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Yin lógo’ ni a lò déédéé láti pa àkòrí δοξάζω/δόξα mọ́; ‘ẹ̀yin’ sì fi ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì hàn.
