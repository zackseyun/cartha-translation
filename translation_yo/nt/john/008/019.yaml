review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperfect ἔλεγον, the connective οὖν, the double negation, and the present contrary-to-fact conditional. The proposed revision retains these features while using a clearer Yoruba counterfactual construction.
  naturalness: The direct-object form “Ẹ kò mọ èmi” is not natural Standard Yoruba in this context; “Ẹ kò mọ̀ mí” is idiomatic. The knowledge verb also needs its underdot/tone spelling (mọ̀), and Bàbá should receive standard tone marking.
  terminology: Bàbá appropriately represents the divine Father in this Johannine context. Retaining “mọ̀” preserves the broad Johannine sense of knowing without narrowing it to recognition or intellectual understanding.
  issues:
  - severity: medium
    issue: The verb ‘mọ̀’ is written repeatedly as ‘mọ’ in the translation.
    rationale: Without the underdot and low tone, mọ is a different Yoruba word (“build”), whereas mọ̀ means “know.” This creates a substantive lexical ambiguity and does not meet the requested tone-marking standard.
  - severity: medium
    issue: “Ẹ kò mọ èmi” is unnatural as the object construction.
    rationale: 'Standard idiomatic Yoruba uses the object pronoun mí after mọ̀: “Ẹ kò mọ̀ mí.” Greek emphasis on ἐμέ need not be reproduced by a non-idiomatic construction.'
  - severity: low
    issue: Bàbá lacks tone marks.
    rationale: The ordinary Yoruba word for father is bàbá. Marking it consistently improves readability and conforms to the target orthography.
  - severity: low
    issue: The counterfactual clause can be phrased more naturally.
    rationale: “Bí ẹ bá mọ̀ mí, ẹ̀yin ìbá mọ̀ Bàbá mi pẹ̀lú” is a natural Yoruba conditional whose ìbá apodosis retains the Greek contrary-to-fact force without the slightly cumbersome “Ìbá ṣe pé” opening.
  revised_text: Nítorí náà, wọ́n ń wí fún un pé, “Níbo ni Bàbá rẹ wà?” Jésù dáhùn pé, “Ẹ kò mọ̀ mí, ẹ kò sì mọ̀ Bàbá mi. Bí ẹ bá mọ̀ mí, ẹ̀yin ìbá mọ̀ Bàbá mi pẹ̀lú.”[a]
