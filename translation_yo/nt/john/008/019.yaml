id: JHN.8.19
reference: John 8:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: yo
  text: Nítorí náà, wọ́n ń wí fún un pé, “Níbo ni Bàbá rẹ wà?” Jésù dáhùn pé, “Ẹ kò mọ̀ mí, ẹ kò sì mọ̀ Bàbá mi. Bí ẹ bá mọ̀ mí, ẹ̀yin ìbá mọ̀ Bàbá mi pẹ̀lú.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tó túbọ̀ tẹnumọ́ ipò tí kò ṣẹ: “Bí ẹ bá ti mọ̀ mí, ẹ̀yin ìbá ti mọ̀ Bàbá mi pẹ̀lú.” Ilana gbolohun Gíríìkì lè jẹ́ kí a túmọ̀ rẹ̀ láti fi ipò tí kò ṣẹ ní ti gidi hàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n ń wí
  rationale: Àkókò imperfect fi ìṣe tí ń lọ lọ́wọ́ tàbí tí ó ń ṣẹlẹ̀ léraléra hàn; ‘wọ́n ń wí’ pa apá yìí mọ́ láìfi ìtẹnumọ́ àpọ̀jù kún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìtẹ̀síwájú tàbí àbájáde.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Níbo ni Baba rẹ wà?
  rationale: Ìbéèrè tààrà ni; ‘Baba’ ń tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀ Jòhánù.
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìṣe ìdáhùn mu ní kíkún.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Ẹ kò mọ èmi, ẹ kò sì mọ Baba mi
  rationale: Ilana ‘ẹ kò… ẹ kò sì…’ mú οὔτε…οὔτε jáde lọ́nà adayeba ní Yorùbá, ó sì pa ìtẹnumọ́ sí ‘èmi’ mọ́.
- source_word: οἶδατε / ᾔδειτε
  choice: mọ / mọ́
  rationale: ‘Mọ̀’ gbòòrò tó láti ní ìmọ̀, ìdánimọ̀, àti ìbáṣepọ̀ nínú rẹ̀; kò dín ìtumọ̀ Jòhánù kù sí òye ọpọlọ nìkan.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Ìbá ṣe pé ẹ mọ mí, ẹ̀yin ìbá mọ Baba mi pẹ̀lú
  rationale: Ilana ‘Ìbá ṣe pé… ìbá…’ fi ipò tí kò ṣẹ ní báyìí hàn; ‘pẹ̀lú’ dúró fún καί, ‘ẹ̀yin’ sì ń mú ìtẹnumọ́ inú èdè Gíríìkì jáde ní Yorùbá adayeba.
- source_word: πατήρ / πατέρα μου
  choice: Baba / Baba mi
  rationale: Lẹ́tà ńlá ń ran olùkà lọ́wọ́ láti rí i pé Ọlọ́run ni a ń tọ́ka sí, láìṣe àfikún sí ìtumọ̀ ọ̀rọ̀ náà.
theological_decisions:
- issue: Bí a ṣe máa kọ ‘Baba’ nígbà tí ó ń tọ́ka sí Ọlọ́run
  choice: A kọ ‘Baba’ pẹ̀lú lẹ́tà ńlá ní gbogbo ẹsẹ náà.
  alternative: A lè kọ ọ́ ní lẹ́tà kékeré gẹ́gẹ́ bí ‘baba’.
  rationale: Àyíká ọ̀rọ̀ Jòhánù fi hàn pé Ọlọ́run ni Baba Jésù; lẹ́tà ńlá ń mú ẹni tí ọ̀rọ̀ ń tọ́ka sí ṣe kedere láìfi ẹ̀kọ́ tuntun kún un.
- issue: Ìtumọ̀ ‘mímọ̀’ Jésù àti Baba
  choice: A pa ọ̀rọ̀ gbòòrò náà ‘mọ̀’ mọ́.
  alternative: A lè lò ‘dámọ̀’ tàbí ‘lóye’.
  rationale: ‘Mọ̀’ pa ìdàpọ̀ ìmọ̀, ìdánimọ̀, àti ìbáṣepọ̀ tí ó wà nínú ọ̀rọ̀ Jòhánù mọ́, dípò kí a pinnu apá kan ṣoṣo.
- issue: Agbára gbolohun ipò εἰ…ἄν
  choice: A lò ‘Ìbá ṣe pé… ìbá…’ láti fi ipò òdì sí ohun tó ń ṣẹlẹ̀ nísinsin yìí hàn.
  alternative: ‘Bí ẹ bá mọ mí, ẹ ó mọ Baba mi pẹ̀lú,’ èyí tí ó lè dà bí ipò tí ó ṣí sílẹ̀ fún ọjọ́ iwájú.
  rationale: 'Imperfect ᾔδειτε pẹ̀lú ἄν nínú àyíká yìí ń tọ́ka sí ohun tí kò rí bẹ́ẹ̀ ní báyìí: wọn kò mọ Jésù, nítorí náà wọn kò mọ Baba náà.'
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ’ jẹ́ ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ó bá àwọn olùbéèrè mu; ‘wọ́n ń wí’ sì pa apá imperfect mọ́. Ilana ‘ẹ kò mọ èmi’ jẹ́ ìtẹnumọ́ díẹ̀ tó fara mọ́ ἐμέ, bí ó tilẹ̀ jẹ́ pé ‘ẹ kò mọ mí’ ni ọ̀nà tó rọrùn jù lọ nínú ọ̀rọ̀ ojoojúmọ́.
