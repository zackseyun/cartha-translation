revisions:
- from: Nítorí náà, wọ́n ń wí fún un pé, “Níbo ni Baba rẹ wà?” Jésù dáhùn pé, “Ẹ kò mọ èmi, ẹ kò sì mọ Baba mi. Ìbá ṣe pé ẹ mọ mí, ẹ̀yin ìbá mọ Baba mi pẹ̀lú.”[a]
  to: Nítorí náà, wọ́n ń wí fún un pé, “Níbo ni Bàbá rẹ wà?” Jésù dáhùn pé, “Ẹ kò mọ̀ mí, ẹ kò sì mọ̀ Bàbá mi. Bí ẹ bá mọ̀ mí, ẹ̀yin ìbá mọ̀ Bàbá mi pẹ̀lú.”[a]
  rationale: The revision corrects the orthography of mọ̀ and bàbá, replaces an unnatural object construction with idiomatic Yoruba, and preserves the source’s ongoing speech, double negation, and contrary-to-fact conditional. The footnote remains anchored to the conditional statement and gives the past-oriented formal alternative without presenting it as the only sense.
