  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú “òfin yín,” ìlànà ìtọ́kasí Ìwé Mímọ́ nínú γέγραπται, àti ìtumọ̀ òtítọ́/ìfẹ́sẹ̀múlẹ̀ nínú àyíká òfin hàn dáadáa. Síbẹ̀, ἀνθρώπων túmọ̀ sí “ènìyàn” ní ìlò gbogbogbò rẹ̀; kì í ṣe ἀνδρῶν, èyí tí yóò sọ “ọkùnrin” ní pàtó. Nítorí náà, “ènìyàn méjì” dáa ju “ọkùnrin méjì” lọ fún ìfẹ́sẹ̀mulẹ̀ sí Gíríìkì.
  naturalness: “Àní nínú òfin yín pàápàá” jẹ́ èdè Yorùbá tó ye ẹni, ṣùgbọ́n fífi “ni” kún un mú ìṣètò gbolóhùn náà rọrùn, ó sì mú ìtẹnumọ́ náà hàn ní ti ẹ̀dá. “Ẹ̀rí àwọn ènìyàn méjì” tún ṣe kedere pé ẹ̀rí náà jẹ́ ti àwọn ẹlẹ́rìí méjì.
  terminology: “Òfin,” “a ti kọ ọ́,” “ẹ̀rí,” àti “òótọ́” bá àyíká ẹ̀sùn/òfin àti ìtọ́kasí Ìwé Mímọ́ mu. A yọ àlàyé ìsàlẹ̀ kúrò nítorí ó sọ pé Gíríìkì ní “ọkùnrin méjì,” èyí tí kò péye ní ti ọ̀rọ̀ ἄνθρωπος.
  issues:
