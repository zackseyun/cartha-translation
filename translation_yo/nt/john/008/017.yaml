id: JHN.8.17
reference: John 8:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: yo
  text: Àní nínú òfin yín pàápàá ni a ti kọ ọ́ pé ẹ̀rí àwọn ènìyàn méjì jẹ́ òótọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμῳ
  choice: òfin
  rationale: Ọ̀rọ̀ náà tọ́ka sí àkójọpọ̀ òfin àti Ìwé Mímọ́ àwọn Júù tí Jésù fi ń gbèjà ọ̀rọ̀ rẹ̀; “òfin” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá, kò sì fi dandan mọ́ àwọn ìwé márùn-ún Mósè nìkan.
- source_word: ὑμετέρῳ
  choice: yín
  rationale: Èyí pa ìtọ́kasí tààrà sí àwọn tí Jésù ń bá sọ̀rọ̀ mọ́, ó sì dáàbò bo bí Jésù ṣe ya ara rẹ̀ sí ẹ̀gbẹ́ díẹ̀ nínú ìjiyàn náà láì mú un le ju ti Gíríìkì lọ.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ àmì ìtọ́kasí sí Ìwé Mímọ́; “a ti kọ ọ́” tún fi hàn pé ohun tí a kọ tẹ̀ síwájú gẹ́gẹ́ bí ohun tó dúró ṣinṣin.
- source_word: δύο ἀνθρώπων
  choice: ọkùnrin méjì
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄνθρωπος lè túmọ̀ sí ènìyàn lápapọ̀, ọ̀rọ̀ Gíríìkì nínú òwe òfin yìí lo ọ̀rọ̀ tó lè túmọ̀ sí ọkùnrin; a pa ìrísí ọ̀rọ̀ náà mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìtumọ̀ tó gbòòrò nínú àlàyé ìsàlẹ̀.
- source_word: μαρτυρία
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá tó bá ipò òfin mu, ó sì lè túmọ̀ sí ohun tí àwọn ẹlẹ́rìí jẹ́rìí sí.
- source_word: ἀληθής
  choice: jẹ́ òótọ́
  rationale: Èyí pa ìtumọ̀ pàtàkì ti ἀληθής mọ́, nígbà tí ọ̀rọ̀ àyíká òfin fúnra rẹ̀ ń tọ́ka sí pé ẹ̀rí náà ní ìfọwọ́sí.
- source_word: καὶ ... δὲ
  choice: Àní ... pàápàá
  rationale: Ìṣọ̀kan yìí mú ìtẹnumọ́ kékeré àti ìsopọ̀ ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ “òfin yín” nínú ìjiyàn náà
  choice: Pa “òfin yín” mọ́ gẹ́gẹ́ bí Jésù ṣe ń bá àwọn alátakò rẹ̀ sọ̀rọ̀ tààrà.
  alternative: “òfin náà” tàbí “òfin tiyín fúnra yín”
  rationale: Gíríìkì ní arọ́pò-orúkọ ẹni kejì ní kedere. Ìtumọ̀ yìí pa ìfàákúrò inú ìjiyàn náà mọ́, ṣùgbọ́n kò fi kún un pé Jésù kọ òfin náà sílẹ̀.
- issue: Ìtumọ̀ ἀνθρώπων nínú òwe òfin
  choice: Lo “ọkùnrin” nínú ẹsẹ̀.
  alternative: “ènìyàn”
  rationale: Èyí tẹ̀ lé ìrísí ọ̀rọ̀ Gíríìkì àti èdè òfin ìgbà náà; àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ó lè dúró fún àwọn ẹlẹ́rìí ènìyàn lápapọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún. “Àní ... pàápàá” mú ìtẹnumọ́ ọ̀rọ̀ ìbẹ̀rẹ̀ jáde, “a ti kọ ọ́” sì jẹ́ ọ̀nà àdánidá láti tọ́ka sí ohun tí Ìwé Mímọ́ sọ.
