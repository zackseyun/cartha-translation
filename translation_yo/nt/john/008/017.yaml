    rationale: Ọ̀rọ̀ Gíríìkì ἄνθρωπος sábà ń túmọ̀ sí ènìyàn/human being ní gbogbogbò, ní ìyàtọ̀ sí ἀνήρ (“ọkùnrin”). Àyíká òfin lè kan ẹlẹ́rìí ènìyàn, ṣùgbọ́n ọ̀rọ̀ orísun kò fi akọ-nìkan hàn. Àlàyé ìsàlẹ̀ tó wà nísinsìnyí sì ń sọ ohun tí Gíríìkì kò sọ ní pàtó.
