  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa: ἀνακύψας ni “gbé ara rẹ̀ sókè,” κατήγοροί ni “olùfisùn,” àti κατέκρινεν ni “dá ọ lẹ́bi.” Àtúnṣe kékeré kan mú ìyàtọ̀ πλὴν τῆς γυναικός (“bí kò ṣe obìnrin náà”) hàn kedere, láì fi “mọ́” tí kò wà nínú Gíríìkì kún un.'
  naturalness: Èdè ẹsẹ náà jẹ́ Yorùbá òde òní tó yẹ fún ìwé mímọ́. “Ó sì rí i pé kò sí ẹnikẹ́ni, bí kò ṣe obìnrin náà” rọrùn, ó sì sun mọ́ ìṣètò ìtumọ̀ Gíríìkì ju ọ̀rọ̀ “kò sí ẹnikẹ́ni mọ́” lọ.
  terminology: “Obìnrin” pa ìpè γυνή mọ́ ní ọ̀nà oníyì; “olùfisùn” àti “dá ọ lẹ́bi” bá àyíká ẹjọ́ mu. Àlàyé ìsàlẹ̀ ni a tún ṣe díẹ̀ kí “earliest Greek manuscripts” di “àwọn àfọwọ́kọ Gíríìkì tó ti pẹ́ jù lọ,” èyí tó jẹ́ ẹ̀dá Yorùbá adayeba.
  issues:
