  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: yo
  text: Nígbà náà, Jésù[a] gbé ara rẹ̀ sókè, ó sì rí i pé kò sí ẹnikẹ́ni, bí kò ṣe obìnrin náà. Ó bi í pé, “Obìnrin, ibo ni àwọn olùfisùn rẹ wà? Ṣé kò sí ẹnikẹ́ni tó dá ọ lẹ́bi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí jẹ́ apá kan nínú ìtàn obìnrin tí wọ́n mú nínú panṣágà (Jòhánù 7:53–8:11), èyí tí kò sí nínú àwọn àfọwọ́kọ Gíríìkì tó ti pẹ́ jù lọ. Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: gbé ara rẹ̀ sókè
  rationale: Ó fi hàn pé Jésù gbé ara rẹ̀ sókè lẹ́yìn tí ó ti tẹ̀ sílẹ̀ láti kọ̀wé sí ilẹ̀; ó yẹra fún ìtumọ̀ pé ó dìde dúró pátápátá.
- source_word: θεασάμενος
  choice: rí i
  rationale: Ó sọ ìríran tààrà pé àwọn ènìyàn náà ti lọ, kò sì fi àfikún ìtumọ̀ sí i.
- source_word: κατήγοροί
  choice: olùfisùn
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn tó ń fi ẹ̀sùn kan obìnrin náà nínú ọ̀rọ̀ tó ní ìrísí ìdájọ́.
- source_word: κατέκρινεν
  choice: dá ọ lẹ́bi
  rationale: Nínú àyíká ìdájọ́ yìí, ó túmọ̀ sí pípolongo ẹni gẹ́gẹ́ bí ẹni tó jẹ̀bi, kì í ṣe ṣíṣe ìdájọ́ lásán.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá àjùmọ̀lò tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Obìnrin” pa ọ̀nà ìpè gẹ́gẹ́ bí γυνή mọ́ láì sọ ọ́ di ẹ̀gàn; “Ṣé” jẹ́ ọ̀nà ìbéèrè àjùmọ̀lò tó ṣe kedere.
