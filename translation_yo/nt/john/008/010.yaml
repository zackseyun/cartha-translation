    rationale: Gíríìkì sọ pé Jésù kò rí ẹnikẹ́ni ayafi obìnrin náà; kò tẹnu mọ́ ìtumọ̀ “any longer.” Àtúnṣe náà pa ìyàsọ́tọ̀ náà mọ́ dáadáa.
  - severity: low
