  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbòò: ó ní àkókò òwúrọ̀, ìpadà Jesu sí ἱερόν, ìwá àwọn ènìyàn sí ọ̀dọ̀ rẹ̀, jíjókòó rẹ̀, àti ìkọ́ni rẹ̀. Síbẹ̀, ‘ń tọ̀ ọ́ wá’ sábà máa ń túmọ̀ sí pé wọ́n ń tẹ̀lé ẹni náà wá, kì í sì sọ ìṣàkóso πρὸς αὐτόν (‘sí ọ̀dọ̀ rẹ̀’) ní kedere.'
