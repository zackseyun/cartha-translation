  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: yo
  text: Ní kùtùkùtù òwúrọ̀, ó tún wá sí àgbàlá tẹ́ńpìlì, gbogbo àwọn ènìyàn sì ń wá sí ọ̀dọ̀ rẹ̀. Ó jókòó, ó sì bẹ̀rẹ̀ sí í kọ́ wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí ń bá ìtàn obìnrin tí wọ́n mú nínú àgbèrè lọ (Jòhánù 7:53–8:11). Ìtàn náà kò sí nínú àwọn ìwé àfọwọ́kọ Gíríìkì tó kùtùkùtù jù lọ. Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Ní kùtùkùtù òwúrọ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí àkókò ìmọ́lẹ̀ òwúrọ̀, ní kété ṣáájú tàbí nígbà tí oòrùn ń yọ; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá fún ‘ní àfẹ̀mọ́júmọ́.’
- source_word: παρεγένετο
  choice: ó tún wá
  rationale: Ó sọ pé ẹni náà dé ibi kan; ‘wá’ bá εἰς τὸ ἱερόν mu lọ́nà àdánidá, πάλιν sì ni ‘tún.’
- source_word: ἱερόν
  choice: àgbàlá tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; àgbàlá ni ibi tí ìkọ́ni fún gbogbo ènìyàn ti máa ń wáyé.
- source_word: καθίσας
  choice: Ó jókòó
  rationale: Aorist participle náà fi hàn pé ó kọ́kọ́ jókòó kí ó tó kọ́ wọn; yíyí padà sí gbólóhùn aládàáṣe jẹ́ àdánidá ní Yorùbá.
- source_word: ἐδίδασκεν
  choice: ó sì bẹ̀rẹ̀ sí í kọ́ wọn
  rationale: Imperfect náà lè jẹ́ ìṣe tí ó bẹ̀rẹ̀ tàbí tí ó ń tẹ̀ síwájú; ‘bẹ̀rẹ̀ sí í kọ́’ mú agbára inceptive tí àyíká ọ̀rọ̀ fàyè gba, láìsọ ìtumọ̀ di ohun tí kò ṣeé yí padà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. ‘Àgbàlá tẹ́ńpìlì’ ń ṣàlàyé ìyàtọ̀ ἱερόν sí ibi mímọ́ inú tẹ́ńpìlì. Àmì àlàyé [a] wà ní òpin ẹsẹ kí ó má bà a da ìṣàn gbólóhùn rú, ó sì tọ́ka sí gbogbo ẹsẹ gẹ́gẹ́ bí apá ìtàn tí ọ̀ràn ẹ̀rí àfọwọ́kọ kàn.
