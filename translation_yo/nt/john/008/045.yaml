  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: yo
  text: Ṣùgbọ́n èmi, nítorí pé mo ń sọ òtítọ́,[a] ẹ kò gbà mí gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ̀lú líle sí i: “Ṣùgbọ́n èmi, nítorí pé mo ń sọ òtítọ́, ẹ kò gbà mí gbọ́.” A tún lè tú ὅτι sí “pé,” ṣùgbọ́n níbí ìtumọ̀ rẹ̀ ṣeé gbà jù gẹ́gẹ́ bí “nítorí pé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a tẹnumọ́ yìí ni a pa mọ́ láti fi ìyàtọ̀ hàn láàárín Jesu àti àwọn tí ó ń bá sọ̀rọ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Níbí, δέ ń fi ìtakora sí ọ̀rọ̀ tó ṣáájú hàn; “Ṣùgbọ́n” ni ó bá èdè Yorùbá àdánidá mu.
- source_word: ὅτι
  choice: nítorí pé
  rationale: 'Ìtumọ̀ okùnfà ló ṣeéṣe jù ní àyíká ọ̀rọ̀ yìí: bí ó tilẹ̀ jẹ́ pé Jesu ń sọ òtítọ́, òtítọ́ náà gan-an ló bá àìgbàgbọ́ wọn pàdé.'
- source_word: τὴν ἀλήθειαν
  choice: òtítọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún ἀλήθεια; Yorùbá kò nílò àfihàn article Gíríìkì lọ́tọ̀ níbí.
- source_word: λέγω
  choice: ń sọ ... fún yín
  rationale: Àkókò ìsinsìnyí ni “ń sọ” fi hàn, “fún yín” sì mú gbólóhùn náà jẹ́ èdè Yorùbá àdánidá láì yí ohun tí a ń sọ padà.
- source_word: οὐ πιστεύετέ μοι
  choice: ẹ kò gbà mí gbọ́
  rationale: πιστεύω pẹ̀lú dative túmọ̀ sí gbígba ẹnì kan gbọ́ tàbí fífi ìgbẹ́kẹ̀lé hàn sí i; “ẹ kò gbà mí gbọ́” pa ìtọ́kasí sí Jesu fúnra rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ὅτι nínú ìbáṣepọ̀ ọ̀rọ̀ òtítọ́ Jesu àti àìgbàgbọ́ àwọn olùgbọ́ rẹ̀
  choice: 'Okùnfà: “nítorí pé èmi ń sọ òtítọ́”'
  alternative: 'Ìtumọ̀ àsọyé/formal: “pé èmi ń sọ òtítọ́”'
  rationale: 'Ìṣàn ọ̀rọ̀ tó yí ẹsẹ̀ náà ká ṣètìlẹ́yìn fún ìtumọ̀ okùnfà, ó sì pa ìyọnu-ìtakora ọ̀rọ̀ náà mọ́: wọn kò gbà á gbọ́ nítorí pé ó ń sọ òtítọ́. Èyí jẹ́ ìpinnu gírámà àti àyíká ọ̀rọ̀, kì í ṣe fífi ẹ̀kọ́ ìsìn kan kún un.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn tí Jesu ń bá sọ̀rọ̀, kì í ṣe gẹ́gẹ́ bí àmì ọ̀wọ̀ fún ẹnì kan ṣoṣo.
