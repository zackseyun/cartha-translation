source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: yo
  text: Ẹ̀yin ń ṣe àwọn iṣẹ́ baba yín.” Wọ́n sọ fún un pé,[a] “A kì í ṣe àwọn ọmọ tí a bí láti inú àgbèrè; Baba kan ṣoṣo ni a ní—Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A kì í ṣe ọmọ àlè.” Ohun tí Gíríìkì sọ ní tààràtà ni, “A kì í ṣe àwọn ọmọ tí a bí láti inú àgbèrè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: ń ṣe
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí fi hàn pé iṣẹ́ náà ń lọ lọ́wọ́, ó sì bá ẹ̀sùn Jesu mu ní àyíká ọ̀rọ̀ yìí.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” jẹ́ ọ̀nà àdánidá láti túmọ̀ ἔργα, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ ποιεῖτε.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: baba yín
  rationale: “Baba” pa ìtumọ̀ ìbátan àti ìran nípa ẹ̀mí mọ́, láìyanju ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ní kánkán.
- source_word: ἐκ πορνείας
  choice: láti inú àgbèrè
  rationale: Àgbèrè níbí dúró fún ìbálòpọ̀ tí kò bófin mu; “láti inú” pa àwòrán orísun tí ἐκ ní mọ́.
- source_word: οὐ γεγεννήμεθα
  choice: A kò bí wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún perfect passive nínú gbólóhùn nípa ìbí.
- source_word: ἕνα πατέρα ἔχομεν
  choice: Baba kan ṣoṣo ni a ní
  rationale: “Kan ṣoṣo” mú ìtẹnumọ́ ἕνα jáde, ìṣètò gbólóhùn náà sì jẹ́ ti Yorùbá àdánidá.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Ọlọ́run ni àfikún tó ń dá Baba kan ṣoṣo náà mọ̀; àmì gígùn ṣe àfihàn ìdánimọ̀ yẹn ní kedere.
theological_decisions:
- issue: Bóyá kí a sọ ìsélẹ̀ “bí láti inú àgbèrè” di “ọmọ àlè” ní kedere
  choice: Pa ọ̀rọ̀ orísun náà mọ́ gẹ́gẹ́ bí “A kò bí wa láti inú àgbèrè” nínú ẹsẹ̀ pàtàkì
  alternative: Àwa kì í ṣe ọmọ àlè
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí pé wọ́n ń sẹ́ pé ọmọ tí a bí láìbófin mu ni wọ́n, ṣùgbọ́n ó sọ ọ́ ní ti ìbí “láti inú πορνεία.” Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ orísun pa ìfojúdi àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú àyíká náà mọ́ láìṣe àlàyé ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní. A lo “àgbèrè” fún πορνεία nítorí pé ó wọ́pọ̀, ó sì ní ìwọ̀n ọ̀rọ̀ tó yẹ; àlàyé ìtumọ̀ “ọmọ àlè” wà nínú àkọsílẹ̀ ìsàlẹ̀.
