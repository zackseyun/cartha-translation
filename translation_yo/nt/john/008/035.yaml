id: JHN.8.35
reference: John 8:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: yo
  text: Ṣùgbọ́n ẹrú[a] kì í dúró nínú ilé títí láé; ọmọ[b] sì ń dúró títí láé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú ọ̀rọ̀ Gíríìkì náà sí ‘ìránṣẹ́’; ṣùgbọ́n ‘ẹrú’ fi ìyàtọ̀ ipò rẹ̀ sí ọmọ nínú ilé hàn dáadáa jù.
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, ‘ọmọ’ lè tún ní ìtọ́ka àìsọtààrà sí Jésù, bí ó tilẹ̀ jẹ́ pé gbólóhùn náà tún dà bí òwe nípa ipò ẹni nínú ilé.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: ẹrú
  rationale: ‘Ẹrú’ fi ipò ẹni tí a dè mọ́ iṣẹ́ àti àìní ẹ̀tọ́ ọmọ ilé hàn, ó sì mú ìyàtọ̀ rẹ̀ sí ‘ọmọ’ ṣe kedere ju ‘ìránṣẹ́’ lọ.
- source_word: μένει
  choice: dúró
  rationale: A lo ‘dúró’ ní ìgbà méjèèjì láti pa àtúnṣe ọ̀rọ̀ Gíríìkì mọ́, kí ó sì sọ ìwà-pẹ́ tàbí ipò tí ń bá a lọ ní èdè Yorùbá àdánidá.
- source_word: οἰκία
  choice: ilé
  rationale: Nínú ọ̀rọ̀ yìí, ‘ilé’ lè tọ́ka sí ibi gbígbé àti àwọn ará ilé papọ̀; ó tipa bẹ́ẹ̀ pa ìtumọ̀ ojúlówó àti ọ̀rọ̀ nípa ipò ẹni nínú ìdílé mọ́.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láé
  rationale: ‘Títí láé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwà-pẹ́ tí kò ní òpin, a sì lò ó ní abala méjèèjì.
- source_word: υἱός
  choice: ọmọ
  rationale: ‘Ọmọ’ bá ọ̀rọ̀ ilé àti ìdílé mu ní Yorùbá, ó sì pa ìyàtọ̀ ipò ọmọ sí ẹrú mọ́ láìfi oyè Kristẹni kan kún ọ̀rọ̀ náà ní tààràtà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ tó wà láàárín òmìnira tí a mẹ́nu kàn ṣáájú àti ipò ẹrú, àti láàárín ẹrú àti ọmọ, hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ tó ṣeé ṣe pé ‘ọmọ’ ń tọ́ka sí Jésù
  choice: A fi ‘ọmọ’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àkàwé nípa ipò nínú ilé, láìsọ ọ́ di oyè pàtó.
  alternative: Ọmọ náà, tàbí Ọmọ Ọlọ́run
  rationale: Gbólóhùn náà dà bí òwe nípa ipò ẹrú àti ọmọ, ṣùgbọ́n àyíká rẹ̀ lè tún mú kí òǹkàwé ronú nípa Jésù. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ méjèèjì mọ́, kò sì yanjú rẹ̀ ṣáájú ẹsẹ tó tẹ̀ lé e.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá; a sì pa àtúnṣe ‘dúró’ àti ‘títí láé’ mọ́ láti fara mọ́ ìṣètò orísun.
