source:
  edition: robinson-pierpont-2005-byzantine
  text: Ὡς δὲ ἐπέμενον ἐρωτῶντες αὐτόν, ἀνακύψας εἶπεν αὐτοῖς, Ὁ ἀναμάρτητος ὑμῶν, πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: yo
  text: Nígbà tí wọ́n sì ń tẹ̀ síwájú ní bíbèèrè lọ́wọ́ rẹ̀,[a] ó gbé ara rẹ̀ sókè, ó sì wí fún wọn pé, “Ẹni tí kò ní ẹ̀ṣẹ̀ nínú yín ni kí ó kọ́kọ́ ju òkúta sí i.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ̀ yìí jẹ́ apá kan nínú ìtàn obìnrin tí wọ́n mú níṣe panṣágà (Jòhánù 7:53–8:11), èyí tí kò sí nínú àwọn ìwé àfọwọ́kọ Gíríìkì tí ó pẹ́ jù lọ. Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: wọ́n ti ń bá a lọ láti bi í léèrè
  rationale: Ìṣọ̀kan ọ̀rọ̀-ìṣe aláìpé ἐπέμενον àti àbọ̀-ọ̀rọ̀-ìṣe ἐρωτῶντες fi hàn pé wọ́n ń tẹ̀ síwájú láìdáwọ́ nínú bíbéèrè lọ́wọ́ rẹ̀.
- source_word: ἀνακύψας
  choice: ó gbé ara rẹ̀ sókè
  rationale: Ó ṣàpèjúwe bí Jésù ṣe gbé ara rẹ̀ sókè kúrò ní ipò tí ó ti tẹ̀ ba láti kọ̀wé sí ilẹ̀; ó yẹ fún ìṣe náà láìfi dandan sọ pé ó dúró ṣánṣán.
- source_word: ἀναμάρτητος
  choice: ẹni tí kò ní ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni tí ẹ̀ṣẹ̀ kò sí lára rẹ̀. Àyànfẹ́ yìí pa ìtumọ̀ ìwà rere àti ọ̀ràn ẹ̀sùn inú àyíká náà mọ́, láìyí i sí ‘ẹni tí kò jẹ̀bi’ nìkan.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: ni kí ó kọ́kọ́ sọ òkúta lù ú
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì pa ìtẹnumọ́ πρῶτος mọ́ pé ẹni bẹ́ẹ̀ ni yóò kọ́kọ́ bẹ̀rẹ̀ sí í sọ òkúta.
theological_decisions:
- issue: Ìtumọ̀ ἀναμάρτητος nínú ọ̀ràn ìdájọ́ obìnrin náà
  choice: ẹni tí kò ní ẹ̀ṣẹ̀
  alternative: ẹni tí kò jẹ̀bi nínú ọ̀ràn yìí
  rationale: Gíríìkì kò fi gbangba dín àìní ẹ̀ṣẹ̀ náà mọ́ ẹ̀ṣẹ̀ kan pàtó tàbí ọ̀ràn yìí nìkan. Nítorí náà, a pa gbígbòòrò àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà mọ́.
translation_notes:
  register: Yorùbá àjùmọ̀lò tí ó bójú mu, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. ‘Bi í léèrè’ àti ‘sọ òkúta lù ú’ jẹ́ ọ̀nà àdánidá fún òǹkàwé òde òní; a yẹra fún ọ̀rọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan pàtó.
