  naturalness: Gbolóhùn náà jẹ́ Yorùbá boṣewa, ó sì rọrùn fún òǹkàwé òde òní. Ìṣètò “bí Ọmọ náà bá ... , ẹ ó ...” jẹ́ àdánidá, àwọn àmì ohùn sì pé. “Sọ yín di òmìnira” àti “ẹ ó di òmìnira” jẹ́ ìṣọ̀kan ìtúmọ̀ tó dára fún ìṣe àti ipò òmìnira nínú ẹsẹ̀ náà.
