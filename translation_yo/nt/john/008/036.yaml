id: JHN.8.36
reference: John 8:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: yo
  text: Nítorí náà, bí Ọmọ náà bá sọ yín di òmìnira, ẹ ó di òmìnira ní tòótọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ ó jẹ́ òmìnira gidi” tàbí “ẹ ó di òmìnira dájúdájú.” Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ pé òmìnira yìí jẹ́ ojúlówó, kì í ṣe ti orúkọ lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Nítorí náà, bí ... bá
  rationale: “Nítorí náà” mú ìtumọ̀ ìparí tàbí àbájáde οὖν jáde, nígbà tí ìṣètò “bí ... bá” jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn àídájú ἐὰν.
- source_word: ὁ υἱὸς
  choice: Ọmọ náà
  rationale: Àmì ìtọ́kasí “náà” àti lẹ́tà ńlá fi hàn pé orúkọ oyè ni, ó sì ń tọ́ka sí Jésù gẹ́gẹ́ bí Ọmọ nínú àyíká ọ̀rọ̀ Jòhánù.
- source_word: ὑμᾶς
  choice: yín
  rationale: “Yín” jẹ́ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀, ó sì pa iye ọ̀pọ̀ inú Gíríìkì mọ́ ní Yorùbá.
- source_word: ἐλευθερώσῃ
  choice: sọ yín di òmìnira
  rationale: Gbólóhùn yìí sọ ìṣe ìdásílẹ̀ kúrò nínú ìsìnrú ní Yorùbá òde òní, ó sì ní ìbáṣepọ̀ ọ̀rọ̀ kedere pẹ̀lú “òmìnira” nínú apá kejì.
- source_word: ὄντως
  choice: ní tòótọ́
  rationale: “Ní tòótọ́” tẹnu mọ́ pé òmìnira náà jẹ́ ojúlówó àti gidi, bí ὄντως ṣe ń ṣe.
- source_word: ἐλεύθεροι ἔσεσθε
  choice: ẹ ó di òmìnira
  rationale: “Ẹ ó di” tọ́ka sí ipò tí yóò jẹ́ àbájáde, ó sì pa àkókò ọjọ́ iwájú àti ìtumọ̀ àpèjúwe ἐλεύθεροι mọ́.
theological_decisions:
- issue: Ta ni “Ọmọ náà” ń tọ́ka sí?
  choice: Orúkọ oyè fún Jésù ní pàtó gẹ́gẹ́ bí Ọmọ
  alternative: ọmọ kan lásán
  rationale: Àpilẹ̀kọ Gíríìkì àti àyíká ọ̀rọ̀ Jòhánù fi hàn pé kì í ṣe ọmọ kan lásán; síbẹ̀, ìtumọ̀ náà kò fi ẹ̀kọ́ míì kún ọ̀rọ̀ náà.
- issue: Irú òmìnira tí ẹsẹ̀ náà ń sọ
  choice: Òmìnira ojúlówó ní ìtumọ̀ gbòòrò tí ọ̀rọ̀ náà gbà
  alternative: òmìnira ti ẹ̀mí nìkan tàbí òmìnira àwùjọ nìkan
  rationale: Bí àyíká ọ̀rọ̀ ṣe ń sọ nípa ìsìnrú ẹ̀ṣẹ̀, ẹsẹ̀ yìí kò dín àbájáde náà sí ẹ̀ka kan ṣoṣo; “òmìnira ní tòótọ́” pa agbára àti ààyè ìtumọ̀ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. Ìṣètò “bí ... bá” àti arọ́pò-orúkọ ọ̀pọ̀ “yín/ẹ” jẹ́ ti Yorùbá àdánidá.
