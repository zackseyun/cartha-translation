  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: yo
  text: Ẹ̀yin ń ṣe ìdájọ́ gẹ́gẹ́ bí ara[a]; èmi kò dá ẹnikẹ́ni lẹ́jọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí òṣùwọ̀n ènìyàn,” tàbí “gẹ́gẹ́ bí ìrísí òde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ jẹ́ mímú jáde ní Gíríìkì, ó sì ní ìtẹnumọ́ díẹ̀. “Ẹ̀yin” jẹ́ ọ̀nà àdánidá láti fi ìyàtọ̀ rẹ̀ sí “èmi” hàn.
- source_word: κατὰ τὴν σάρκα
  choice: nípa ti ara
  rationale: Àṣàyàn yìí pa àwòrán ọ̀rọ̀ σάρξ mọ́, ó sì yàgò fún ṣíṣe ìtumọ̀ rẹ̀ ní pàtó sí “ìwà ẹ̀ṣẹ̀.” Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ ọ̀rọ̀ inú àyíká bí “ní ìbámu pẹ̀lú òṣùwọ̀n ènìyàn” àti “nípa ìrísí òde” hàn.
- source_word: κρίνετε
  choice: ń ṣe ìdájọ́
  rationale: Ìṣe ìsinsìnyí ẹni kejì ọ̀pọ̀ ni. “Ń ṣe ìdájọ́” jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì bá ìtumọ̀ “judge” mu.
- source_word: ἐγὼ
  choice: èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì láti fi ìyàtọ̀ sí ὑμεῖς; “èmi” pa ìtẹnumọ́ àti ìyàtọ̀ yẹn mọ́.
- source_word: οὐ κρίνω οὐδένα
  choice: èmi kò dá ẹnikẹ́ni lẹ́jọ́
  rationale: Ìtumọ̀ yìí pa agbára ìsọdì “ẹnikẹ́ni” mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú κατὰ τὴν σάρκα
  choice: “Nípa ti ara” wà nínú ẹsẹ̀ pàtàkì, kí àwòrán àti ẹdọfu ọ̀rọ̀ Gíríìkì lè dúró.
  alternative: “Ní ìbámu pẹ̀lú òṣùwọ̀n ènìyàn” tàbí “nípa ìrísí òde.”
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà lè tọ́ka sí ìdájọ́ tí a fi òṣùwọ̀n ènìyàn tàbí ohun tí ojú rí ṣe. Ṣíṣe é ní “ara” kò sọ ọ́ di ẹ̀kọ́ pàtó nípa “ìwà ẹ̀ṣẹ̀,” bẹ́ẹ̀ ni kò sì fi ipá yan ọ̀kan ṣoṣo lára àwọn ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye. A lo “ṣe ìdájọ́” ní ìdá àkọ́kọ́ àti “dá … lẹ́jọ́” ní ìdá kejì gẹ́gẹ́ bí àwọn ọ̀nà Yorùbá àdánidá láti sọ κρίνω.
