id: JHN.8.51
reference: John 8:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: yo
  text: Lóòótọ́, lóòótọ́ ni mo wí fún yín, bí ẹnikẹ́ni bá pa ọ̀rọ̀ mi mọ́, dájúdájú, kì yóò rí ikú láéláé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Lóòótọ́, lóòótọ́
  rationale: Ìtúmọ̀ yìí pa àtúnwí ìmúdájú Jésù mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi tẹnumọ́ òtítọ́ ọ̀rọ̀.
- source_word: τηρήσῃ
  choice: bá pa ... mọ́
  rationale: Gbólóhùn “pa ọ̀rọ̀ mọ́” lè túmọ̀ sí fífetí sí i, ṣíṣe é, àti dídúró ṣinṣin nínú rẹ̀; ó bá ìtumọ̀ τηρέω mu ní àyíká yìí.
- source_word: τὸν ἐμὸν λόγον
  choice: ọ̀rọ̀ mi
  rationale: “Ọ̀rọ̀ mi” jẹ́ ìtumọ̀ tààrà, tó ṣe kedere, tí kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún λόγος.
- source_word: θάνατον οὐ μὴ θεωρήσῃ
  choice: dájúdájú, kì yóò rí ikú
  rationale: οὐ μή jẹ́ ìkọ̀ pátápátá tó lágbára; “dájúdájú, kì yóò” mú agbára náà jáde, nígbà tí “rí ikú” pa àwòrán ọ̀rọ̀ θεωρέω mọ́.
- source_word: εἰς τὸν αἰῶνα
  choice: láéláé
  rationale: “Láéláé” ni ọ̀nà Yorùbá tó rọrùn àti àdánidá fún ìtumọ̀ pé kò ní ṣẹlẹ̀ ní ìgbà kankan títí láé.
theological_decisions:
- issue: Ìtumọ̀ “kì yóò rí ikú láéláé” níwájú ikú ara àwọn onígbàgbọ́
  choice: Pa ọ̀rọ̀ àwòrán àti ìdánilójú pátápátá Jésù mọ́ láìṣàlàyé rẹ̀ sínú ẹsẹ náà.
  alternative: Túmọ̀ sí “kì yóò kú nípa ẹ̀mí láéláé” tàbí “kì yóò ní ìrírí ikú ayérayé.”
  rationale: Orísun Gíríìkì sọ “rí ikú” láìfi “nípa ẹ̀mí” tàbí “ayérayé” gẹ́gẹ́ bí àpèjúwe ikú kún un. Fífi àwọn náà sínú ọ̀rọ̀ àkọ́kọ́ yóò yanju ìṣòro ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà fúnra rẹ̀ fi sílẹ̀ ní ìfọ̀rọ̀wérọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “yín” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn nítorí ὑμῖν jẹ́ ọ̀pọ̀, “ẹnikẹ́ni” sì pa àìní ìyàtọ̀ akọ tàbí abo nínú τις mọ́.
