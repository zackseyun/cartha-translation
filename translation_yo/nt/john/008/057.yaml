source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: yo
  text: Nítorí náà, àwọn Júù[a] sọ fún un pé, “Ìwọ kò tíì pé àádọ́ta ọdún, ìwọ sì ti rí Ábúráhámù?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ará Jùdíà,” tàbí “àwọn aṣáájú Júù,” gẹ́gẹ́ bí ẹni tí Jòhánù ń tọ́ka sí nínú àyíká ọ̀rọ̀ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ fún àpèjúwe ìtàn náà. Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn ará Jùdíà tàbí, ní àwọn àyíká kan, àwọn aṣáájú Júù; ṣùgbọ́n ẹsẹ yìí kò fi hàn pé àwọn aṣáájú nìkan ni.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ wọn jẹ́ ìdáhùn tàbí àbájáde ohun tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Ìwọ kò tíì pé àádọ́ta ọdún
  rationale: Gíríìkì sọ ní tààrà pé ẹni náà kò tíì ‘ní’ àádọ́ta ọdún; lílo ‘pé ... ọdún’ ni ọ̀nà Yorùbá àdánidá láti sọ ọjọ́-orí.
- source_word: ἑώρακας
  choice: ìwọ sì ti rí
  rationale: ‘Ti rí’ dá ìṣe pípé ọ̀rọ̀-ìṣe Gíríìkì náà dúró, ó sì pa ìyàlẹ́nu àti àìgbàgbọ́ inú ìbéèrè náà mọ́.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so àwọn gbólóhùn méjèèjì pọ̀ lọ́nà àdánidá, ó sì jẹ́ kí ìbéèrè aláìgbàgbọ́ náà lágbára.
- source_word: Ἀβραὰμ
  choice: Ábúráhámù
  rationale: Èyí ni àkọtọ̀ orúkọ náà tí ó wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ οἱ Ἰουδαῖοι nínú Jòhánù
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà; àwọn aṣáájú Júù
  rationale: Àkọsílẹ̀ Gíríìkì lo àpèjúwe gbogbogbò, kò sì fi àwọn aṣáájú nìkan hàn. Nítorí náà, a pa ìtumọ̀ gbogbogbò mọ́ nínú ẹsẹ, a sì ṣàlàyé àwọn ìtumọ̀ mìíràn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Àtúnṣe gbolohun ọjọ́-orí jẹ́ àdánidá ní Yorùbá láìsọ ìtumọ̀ Gíríìkì nù.
