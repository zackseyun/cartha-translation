id: JHN.8.52
reference: John 8:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: yo
  text: Àwọn Júù sọ fún un pé, “Ní báyìí, a mọ̀ pé o ní ẹ̀mí èṣù.[a] Ábúráhámù kú, àwọn wòlíì náà sì kú, síbẹ̀ ìwọ sọ pé, ‘Bí ẹnikẹ́ni bá pa ọ̀rọ̀ mi mọ́, dájúdájú, kì yóò tọ́ ikú wò láéláé.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí èṣù ti gbà ọ́.” Ní tààrà, Gíríìkì sọ pé, “o ní ẹ̀mí èṣù.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì fi ìtẹnumọ́ sọ pé ẹni náà kò ní tọ́ ikú wò rárá láéláé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Èyí ni ìtumọ̀ tààrà fún ẹgbẹ́ tí ó ń bá Jésù jiyàn níbí; ‘àwọn aṣáájú Júù’ yóò fi ìtumọ̀ tí kò hàn gbangba nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: Νῦν ἐγνώκαμεν
  choice: Ní báyìí, a mọ̀
  rationale: Ó sọ ipò ìmọ̀ tí ó wá látinú ohun tí wọ́n ṣẹ̀ṣẹ̀ gbà pé wọ́n ti rí dájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: δαιμόνιον ἔχεις
  choice: o ní ẹ̀mí èṣù
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì, ‘o ní ẹ̀mí èṣù,’ dípò kí a fi ìtumọ̀ ìṣàlàyé pé ẹ̀mí èṣù ti gbà á hàn nínú ara ẹsẹ̀.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Ábúráhámù kú, àwọn wòlíì náà sì kú
  rationale: Àtúnṣe ọ̀rọ̀-ìṣe ‘kú’ jẹ́ àdánidá ní Yorùbá, ó sì mú kí καί tó so Ábúráhámù àti àwọn wòlíì pọ̀ ṣe kedere.
- source_word: καὶ σὺ λέγεις
  choice: síbẹ̀ ìwọ sọ pé
  rationale: ‘Síbẹ̀’ mú ìtakora tó wà nínú àyíká ọ̀rọ̀ jáde, ‘ìwọ’ sì fi ìtẹnumọ́ tó wà lórí σύ hàn.
- source_word: Ἐάν τις
  choice: Bí ẹnikẹ́ni bá
  rationale: Èyí pa àídájú àti ìtumọ̀ gbogbo ènìyàn tó wà nínú gbólóhùn àdéhùn náà mọ́.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: pa ọ̀rọ̀ mi mọ́
  rationale: ‘Pa … mọ́’ lè túmọ̀ sí ṣíṣọ́, títẹ̀lé, tàbí pípa ohun kan mọ́; nítorí náà, kò dín τηρέω kù sí ìgbọràn nìkan, ó sì pa àṣà ọ̀rọ̀ Jòhánù mọ́.
- source_word: οὐ μὴ γεύσηται θανάτου
  choice: dájúdájú, kì yóò tọ́ ikú wò
  rationale: ‘Dájúdájú, kì yóò’ mú ìkọ̀ emphatic οὐ μή hàn, ‘tọ́ ikú wò’ sì pa àkàwé ‘taste death’ mọ́ láì ṣàlàyé rẹ̀ gẹ́gẹ́ bí irú ikú kan pàtó.
- source_word: εἰς τὸν αἰῶνα
  choice: láéláé
  rationale: ‘Láéláé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìṣẹ̀lẹ̀ náà kì yóò ṣẹlẹ̀ nígbà kankan títí láé; ó yẹra fún ìtumọ̀ pé ẹni náà yóò máa tọ́ ikú wò fún àkókò ayérayé.
theological_decisions:
- issue: Ohun tí ‘tọ́ ikú wò’ túmọ̀ sí nínú ìlérí Jésù
  choice: Pa àkàwé ‘tọ́ ikú wò’ mọ́ láì sọ irú ikú tí ó jẹ́.
  alternative: Túmọ̀ ọ́ ní pàtó sí ikú ara, ikú ti ẹ̀mí, tàbí ikú ìkẹyìn.
  rationale: Àwọn alatako Jésù lóye ọ̀rọ̀ náà nípa ikú ara, ṣùgbọ́n Ìhìn Rere Jòhánù sábà máa ń ní ìtumọ̀ alápele. Ìtumọ̀ náà gbọ́dọ̀ pa ìfọ̀rọ̀wérọ̀ àti àìṣe pàtó yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘síbẹ̀’ àti ‘dájúdájú’ láti mú ìtakora àti ìtẹnumọ́ Gíríìkì hàn láì mú èdè náà le.
