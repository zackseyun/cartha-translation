id: JHN.8.55
reference: John 8:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: yo
  text: Síbẹ̀, ẹ̀yin kò mọ̀ ọ́n[a], ṣùgbọ́n èmi mọ̀ ọ́n. Bí mo bá sọ pé èmi kò mọ̀ ọ́n[b], èmi yóò jẹ́ òpùrọ́ bí ẹ̀yin. Ṣùgbọ́n mo mọ̀ ọ́n, mo sì ń pa ọ̀rọ̀ rẹ̀ mọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ̀yin kò tíì mọ̀ ọ́n.” Ọ̀rọ̀-ìṣe Gíríìkì ἐγνώκατε jẹ́ perfect ní ìrísí; ó lè tẹnu mọ́ ipò àìní ìmọ̀ tòótọ́ wọn tí ó ṣì ń bá a lọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “Bí mo bá tilẹ̀ sọ.” Ìkọ̀lé Gíríìkì náà gbé ìpò àròsọ kalẹ̀; “tilẹ̀” lè fi agbára ‘kódà bí’ inú ọ̀rọ̀ náà hàn.
    reason: lexical_alternative
  - marker: c
    text: “Pa ... mọ́” tún lè túmọ̀ sí “gbọ́ràn sí,” “tẹ̀ lé,” tàbí “ṣọ́.” Nínú Jòhánù, ọ̀rọ̀ náà sábà máa ń ní ìtumọ̀ fífi ìṣòtítọ́ pa ọ̀rọ̀ Ọlọ́run mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: kò tíì mọ̀ ọ́n
  rationale: Ọ̀rọ̀ yìí jẹ́ perfect ní ìrísí, ó sì ń tọ́ka sí ipò àìmọ̀ tí ó ṣì ń bá a lọ. “Kò tíì mọ̀ ọ́n” jẹ́ Yorùbá àdánidá tí ó fi agbára yìí hàn.
- source_word: οἶδα
  choice: mọ̀ ọ́n
  rationale: Bí ó tilẹ̀ jẹ́ pé οἶδα ní ìrísí perfect, ó ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe onípò ní ìsinsìnyí, ìtumọ̀ rẹ̀ sì ni “mọ̀.”
- source_word: κἂν εἴπω
  choice: Bí mo bá sọ
  rationale: Ìkọ̀lé náà gbé ọ̀rọ̀ àròsọ tàbí ohun tí a fi lérò kalẹ̀. “Bí mo bá sọ” jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún fífi hàn pé ohun náà ti ṣẹlẹ̀ ní ti gidi.
- source_word: ἔσομαι
  choice: èmi yóò jẹ́
  rationale: Future ni ọ̀rọ̀ náà ní Gíríìkì, ó sì sọ àbájáde ohun tí a gbé kalẹ̀ nínú gbólóhùn “bí.” Yorùbá “yóò jẹ́” pa ìrísí àbájáde ọjọ́ iwájú náà mọ́.
- source_word: ὅμοιος ὑμῖν
  choice: bí ẹ̀yin
  rationale: Èyí pa ìfiwéra tààràtà mọ́, ó sì fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀.
- source_word: ψεύστης
  choice: òpùrọ́
  rationale: Orúkọ náà túmọ̀ sí ẹni tí ń purọ́, kì í ṣe ẹni tí ó kàn ṣàṣìṣe.
- source_word: τὸν λόγον αὐτοῦ
  choice: ọ̀rọ̀ rẹ̀
  rationale: “Ọ̀rọ̀ rẹ̀” pa ọ̀nà ìsọ̀rọ̀ tí a sábà máa ń rí nínú Jòhánù mọ́, ó sì lè ní ìtumọ̀ ọ̀rọ̀ tí Ọlọ́run sọ tàbí iṣẹ́ ìránṣẹ́ rẹ̀.
- source_word: τηρῶ
  choice: ń pa ... mọ́
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí pípa mọ́, ṣíṣọ́, tàbí ṣíṣe ìgbọràn. “Pa ọ̀rọ̀ rẹ̀ mọ́” jẹ́ Yorùbá àdánidá tí kò dín ìtumọ̀ náà kù sí ṣíṣe àṣẹ nìkan.
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: Síbẹ̀ ... ṣùgbọ́n ... Ṣùgbọ́n
  rationale: Àwọn àsopọ̀ yìí fi ìyàtọ̀ líle hàn láàárín àìmọ̀ àwọn olùgbọ́, ìmọ̀ Jésù, ọ̀rọ̀ àròsọ náà, àti ohun tí ó jẹ́ òótọ́.
theological_decisions:
- issue: Ìjẹ́wọ́ Jésù pé òun mọ Ọlọ́run, ní ìyàtọ̀ sí àwọn alátakò rẹ̀
  choice: A túmọ̀ ọ̀rọ̀ náà ní tààràtà gẹ́gẹ́ bí ìjẹ́wọ́ ìmọ̀ tòótọ́ àti pípa ọ̀rọ̀ Ọlọ́run mọ́.
  alternative: Ṣàfikún ọ̀rọ̀ láti tẹnu mọ́ ipò Ọmọ Ọlọ́run tí kò lẹ́gbẹ́, tàbí rọ ìtumọ̀ “mọ̀” sí ojúlùmọ̀ lásán.
  rationale: Ẹsẹ náà fúnra rẹ̀ fi ìyàtọ̀ tó lágbára hàn láàárín Jésù àti àwọn alátakò rẹ̀ nípa mímọ Ọlọ́run àti pípa ọ̀rọ̀ rẹ̀ mọ́. Ìtumọ̀ kò gbọ́dọ̀ ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà, bẹ́ẹ̀ ni kò gbọ́dọ̀ rọ agbára ìjẹ́wọ́ náà.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ẹ̀yin” pa ọ̀pọ̀ ènìyàn inú ὑμῖν mọ́; “ń pa ọ̀rọ̀ rẹ̀ mọ́” sì jẹ́ àṣà-ìsọ̀rọ̀ Yorùbá tó bójú mu fún τηρέω láì pa àwọn ìtumọ̀ míì rẹ̀ rẹ́.
