  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: yo
  text: Ṣùgbọ́n èmi kò wá ògo ara mi; ẹni kan wà tí ń wá a, tí ó sì ń dájọ́.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ lẹ́tà-lẹ́tà: “ẹni tí ń wá tí ó sì ń dájọ́ wà.” A lóye pé ohun tí ó ń wá ni ògo Jésù, láti inú gbólóhùn tó ṣáájú.'
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká, ọ̀pọ̀ ènìyàn lóye ẹni tí a kò dárúkọ yìí gẹ́gẹ́ bí Bàbá, ṣùgbọ́n Gíríìkì kò sọ ìdánimọ̀ náà ní tààrà níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Ṣùgbọ́n èmi
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tí δέ ń tọ́ka sí hàn, “èmi” sì pa ìtẹnumọ́ ọ̀rọ̀-arọ́pò-orúkọ ἐγώ mọ́.
- source_word: οὐ ζητῶ
  choice: kò wá
  rationale: Ó túmọ̀ ìṣe àsìkò ìsinsìnyí ní ọ̀nà àdánidá, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú ζητῶν ní apá kejì.
- source_word: τὴν δόξαν μου
  choice: ògo ti èmi fúnra mi
  rationale: “Ògo” gba ìtumọ̀ δόξα gẹ́gẹ́ bí ọlá tàbí ògo; “ti èmi fúnra mi” mú ìtẹnumọ́ pé Jésù kò lépa ògo ara rẹ̀ hàn láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ἔστιν ὁ ζητῶν
  choice: ẹni tí ń wá a ... wà
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún gbólóhùn existential Greek, ó sì fi ẹni náà sílẹ̀ láìdárúkọ bí ẹsẹ̀ Gíríìkì ti ṣe. “a” jẹ́ arọ́pò ohun tí a lóye pé ó ń tọ́ka sí ògo Jésù.
- source_word: καὶ κρίνων
  choice: tí ó sì ń ṣe ìdájọ́
  rationale: Ó pa ìbáṣepọ̀ participle kejì mọ́, “ń” sì fi ìṣe tí ń lọ tàbí ìwà tí ó dúró ṣinṣin hàn; “ṣe ìdájọ́” bá ọ̀rọ̀ ìdájọ́ nínú àyíká mu.
theological_decisions:
- issue: Ta ni ẹni tí ń wá ògo Jésù tí ó sì ń ṣe ìdájọ́?
  choice: A kò dárúkọ ẹni náà nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè sọ ní tààrà pé Bàbá ni.
  rationale: Àyíká lè mú kí òǹkàwé lóye ẹni náà gẹ́gẹ́ bí Bàbá, ṣùgbọ́n Gíríìkì kò dárúkọ rẹ̀ níhìn-ín. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlá tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ẹni ... wà” láti pa ìṣètò existential àti àìdárúkọ ẹni náà mọ́, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá.
