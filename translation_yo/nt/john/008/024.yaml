  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: yo
  text: Nítorí náà, mo sọ fún yín pé ẹ ó kú nínú àwọn ẹ̀ṣẹ̀ yín. Nítorí bí ẹ kò bá gbàgbọ́ pé èmi ni,[a] ẹ ó kú nínú àwọn ẹ̀ṣẹ̀ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààrà, “pé èmi ni.” Ọ̀rọ̀ Gíríìkì kò ní ọ̀rọ̀ ìdánimọ̀ kan lẹ́yìn “èmi ni,” ó sì ṣeé ṣe kí ọ̀nà ọ̀rọ̀ yìí ní ìfarahàn ìtumọ̀ tó jinlẹ̀ nínú Ìhìnrere Jòhánù.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Nítorí náà, mo sọ fún yín
  rationale: “Nítorí náà” fi ìsopọ̀ ìmúṣẹ̀ οὖν hàn, “mo sọ fún yín” sì jẹ́ ọ̀nà Yorùbá àdánidá láti tú εἶπον ... ὑμῖν.
- source_word: ἀποθανεῖσθε
  choice: ẹ ó kú
  rationale: Ó tú ọ̀rọ̀ ọjọ́ iwájú náà ní tààrà, láìfi ìtumọ̀ míì bí “parun” kún un.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: nínú àwọn ẹ̀ṣẹ̀ yín
  rationale: Ó pa ọ̀pọ̀ ἁμαρτίαις mọ́, ó sì fi ipò tí wọn wà nínú ẹ̀ṣẹ̀ hàn.
- source_word: ἐὰν γὰρ μὴ
  choice: Nítorí bí ... kò bá
  rationale: “Nítorí” mú γάρ wá, ìṣètò “bí ... kò bá” sì jẹ́ àdánidá fún àídájú odi ἐὰν μή ní Yorùbá.
- source_word: πιστεύσητε
  choice: ẹ ... gbàgbọ́
  rationale: “Gbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì lè ní ìtumọ̀ ìgbẹ́kẹ̀lé nínú ọ̀rọ̀ Jòhánù.
- source_word: ὅτι ἐγώ εἰμι
  choice: pé èmi ni ẹni náà
  rationale: Yorùbá sábà máa ń fẹ́ àfikún ìdánimọ̀ lẹ́yìn “èmi ni”; “ẹni náà” jẹ́ kíkún àdánidá, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ọ̀rọ̀ Gíríìkì tí kò ní àpèjúwe hàn.
theological_decisions:
- issue: Bí a ṣe máa tú ἐγώ εἰμι tí kò ní àpèjúwe tí a sọ ní kedere
  choice: pé èmi ni ẹni náà
  alternative: pé èmi ni
  rationale: Ọ̀rọ̀ náà lè jẹ́ ìdánimọ̀ àdánidá tàbí gbólóhùn aláìní àpèjúwe tí ó lè ní ìró ìṣípayá Ọlọ́run nínú Jòhánù. Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá tó ṣe kedere, àkọsílẹ̀ sì pa àìdánilójú àti ìjìnlẹ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ/yín” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn.
