  source_fidelity: Ìtumọ̀ náà fi aoristi εἶπον, ọjọ́ iwájú ἀποθανεῖσθε, ọ̀pọ̀ ‘ẹ̀ṣẹ̀,’ àti ìpinnu odi ἐὰν μὴ hàn dáadáa. Síbẹ̀, ‘ẹni náà’ nínú ‘pé èmi ni ẹni náà’ ń ṣàfikún kókó-ọrọ̀ tí kò sí nínú Gíríìkì. Yorùbá ‘pé èmi ni’ péye, ó sì pa àìní-àpèjúwe ἐγώ εἰμι mọ́.
