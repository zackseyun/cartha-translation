  footnotes:
  - marker: a
    text: Èyí jẹ́ ìtẹ̀síwájú ìtàn obìnrin tí wọ́n mú nínú àgbèrè (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó túmọ̀ sí pé ó tún ṣe ohun tí ó ti ṣe tẹ́lẹ̀; fífi “sì” kún un mú ìṣàn ìtàn Yorùbá rọrùn.
- source_word: κάτω κύψας
  choice: tẹrí ba
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ṣàpèjúwe bí ẹni ṣe tẹ ara àti orí rẹ̀ sílẹ̀; “tẹrí ba” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe yìí.
- source_word: ἔγραφεν
  choice: ń kọ̀wé
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà lè fi ìṣe tí ó ń lọ lọ́wọ́ hàn; “ń kọ̀wé” pa ìtumọ̀ yẹn mọ́ ní Yorùbá.
- source_word: εἰς τὴν γῆν
  choice: sórí ilẹ̀
  rationale: Ní àyíká yìí, γῆ túmọ̀ sí ojú ilẹ̀ tí ó wà níwájú rẹ̀; “sórí ilẹ̀” ni ọ̀nà Yorùbá àdánidá láti sọ ibi tí ó ti ń kọ̀wé.
