  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé Gíríìkì dáadáa ní gbogbogbò: ó pa ìdáhùn, ìbéèrè olódì, ìtọ́kasí sí ará Samáríà, àti ọ̀rọ̀ gangan ‘ní ẹ̀mí èṣù’ mọ́. Síbẹ̀, ‘sọ ọ́ ní ẹ̀tọ́’ kò ṣe kedere gẹ́gẹ́ bí ìtumọ̀ adayeba fún καλῶς λέγομεν.'
  naturalness: ‘Ṣé àwa kò tọ́ nígbà tí a sọ pé…?’ jẹ́ Yorùbá òde òní tó rọrùn, ó sì mú agbára ìbéèrè olódì náà hàn. Àlàyé ìsàlẹ̀ ojú ìwé a nílò àtúnṣe kékeré, nítorí ‘láìsí àfiwé’ kò túmọ̀ sí ‘without exception’ ní àyíká yìí.
  terminology: ‘Àwọn Júù,’ ‘ará Samáríà,’ àti ‘ẹ̀mí èṣù’ jẹ́ àwọn ọ̀rọ̀ tó yẹ. ‘Ẹ̀mí èṣù’ ń pa δαιμόνιον mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
