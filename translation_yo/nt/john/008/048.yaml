    rationale: ‘Ní ẹ̀tọ́’ sábà ń tọ́ka sí ẹ̀tọ́ tàbí àṣẹ ẹni, ó sì lè dá òǹkàwé lójú pé ọ̀rọ̀ náà nípa right/entitlement dípò pé ohun tí wọ́n sọ jẹ́ ohun tó tọ́.
  - severity: low
