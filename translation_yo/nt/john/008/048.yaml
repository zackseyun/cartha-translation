  to: Àwọn Júù[a] dá a lóhùn, wọ́n sì sọ fún un pé, “Ṣé àwa kò tọ́ nígbà tí a sọ pé ará Samáríà ni ìwọ, àti pé o ní ẹ̀mí èṣù[c]?”
  rationale: A tún ọ̀rọ̀ ìbéèrè náà ṣe sí ‘Ṣé àwa kò tọ́ nígbà tí a sọ pé…?’ kí ó lè ṣe kedere, kí ó sì jẹ́ Yorùbá adayeba, nígbà tí ó ṣì ń pa ìbéèrè olódì Gíríìkì mọ́. A tún ṣàtúnṣe gbolohun kan nínú àlàyé a fún ìtumọ̀ kedere. A fi ààmì ìsàlẹ̀ bẹ́ẹ̀ gẹ́gẹ́ bí àṣàyàn ìtumọ̀, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ pàtàkì tuntun kò nílò rẹ̀ níbi kan pàtó.
