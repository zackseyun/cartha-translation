language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: yo
  text: Àwọn Júù[a] dá a lóhùn, wọ́n sì sọ fún un pé, “Ṣé àwa kò tọ́ nígbà tí a sọ pé ará Samáríà ni ìwọ, àti pé o ní ẹ̀mí èṣù[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ará Jùdíà” tàbí, ní àwọn àyíká ọ̀rọ̀ kan, “àwọn olórí Júù.” Nínú ìwé Jòhánù, “àwọn Júù” sábà máa ń tọ́ka sí ẹgbẹ́ kan tí ń tako Jésù, kì í ṣe gbogbo àwọn Júù láìsí pé a yà ẹnikẹ́ni sọ́tọ̀.
    reason: alternative_reading
  - marker: c
    text: Ní tààrà, “o ní ẹ̀mí èṣù”; àwọn ìtumọ̀ kan túmọ̀ ọ́ ní ọ̀nà àlàyé sí “ẹ̀mí èṣù ń darí rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: dá a lóhùn
  rationale: Ó túmọ̀ sí pé wọ́n fèsì tàbí wọ́n dá ẹni tí ó ń bá wọn sọ̀rọ̀ lóhùn; gbólóhùn yìí bá ìtàn Yorùbá mu dáadáa.
- source_word: οἱ Ἰουδαῖοι
  choice: Àwọn Júù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà; ẹsẹ yìí kò sọ ní pàtó pé àwọn olórí Júù nìkan ni.
- source_word: εἶπαν αὐτῷ
  choice: wọ́n sì sọ fún un
  rationale: Ó pa àwọn ọ̀rọ̀ ìṣe méjèèjì inú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé wọ́n jọ ara wọn díẹ̀.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Ṣé àwa kò sọ ọ́ ní ẹ̀tọ́
  rationale: Ìbéèrè olódì yìí ń retí ìdáhùn pé bẹ́ẹ̀ ni; ‘ní ẹ̀tọ́’ fi ìtumọ̀ καλῶς hàn ní Yorùbá àdánidá.
- source_word: Σαμαρίτης
  choice: ará Samáríà
  rationale: Orúkọ yìí ń tọ́ka sí ìran àti ẹ̀sìn ẹni láti Samáríà, wọ́n sì lò ó gẹ́gẹ́ bí ẹ̀gàn níbí.
- source_word: δαιμόνιον ἔχεις
  choice: o ní ẹ̀mí èṣù
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì ‘ní ẹ̀mí èṣù’ mọ́, kò sì túmọ̀ rẹ̀ sí ọ̀nà tí ó fi dá ipò ìṣàkóso ẹ̀mí náà lórí ẹni náà lájú.
theological_decisions:
- issue: Ẹni tí οἱ Ἰουδαῖοι ń tọ́ka sí nínú ìwé Jòhánù
  choice: Àwọn Júù
  alternative: Àwọn ará Jùdíà; àwọn olórí Júù
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò dín àwọn ẹni náà kù sí àwọn olórí. Àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé nínú ìtàn Jòhánù, ọ̀rọ̀ náà sábà máa ń tọ́ka sí ẹgbẹ́ kan tí ń tako Jésù, kì í ṣe gbogbo Júù láìsí àfiwé.
- issue: Ìtumọ̀ δαιμόνιον ἔχεις
  choice: o ní ẹ̀mí èṣù
  alternative: ẹ̀mí èṣù ń darí rẹ; ẹ̀mí èṣù ń gbé inú rẹ
  rationale: A pa ọ̀rọ̀ orísun ‘ní ẹ̀mí èṣù’ mọ́, kí a má bàa fi ìtumọ̀ tó jinlẹ̀ sí i pé ẹ̀mí náà ti gba gbogbo ara ẹni náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. A pa àtúnwí inú ìtàn Gíríìkì (‘dá a lóhùn, wọ́n sì sọ fún un’) mọ́ láìjẹ́ kí gbólóhùn náà di líle.
