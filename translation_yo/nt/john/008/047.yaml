id: JHN.8.47
reference: John 8:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: yo
  text: Ẹni tí ó wá láti ọ̀dọ̀ Ọlọ́run ń gbọ́ àwọn ọ̀rọ̀ Ọlọ́run. Nítorí èyí ni ẹ̀yin kò fi gbọ́, nítorí pé[a] ẹ̀yin kò wá láti ọ̀dọ̀ Ọlọ́run.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀nà mìíràn láti lóye apá ìkẹyìn ni: “ẹ̀yin kò gbọ́ pé ẹ̀yin kò wá láti ọ̀dọ̀ Ọlọ́run.” Ọ̀rọ̀ àsopọ̀ Gíríìkì ὅτι lè túmọ̀ sí “pé,” ṣùgbọ́n ìtumọ̀ onídí, “nítorí pé,” bá àyíká mu jù.'
    reason: alternative_reading
  - marker: b
    text: A tún lè tú “láti ọ̀dọ̀ Ọlọ́run” sí “jẹ́ ti Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ orísun ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὢν
  choice: Ẹni tí ó ... wá
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni nínú irú àwọn ènìyàn bẹ́ẹ̀, ó sì pa agbára ẹyọ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἐκ τοῦ θεοῦ
  choice: ti ọ̀dọ̀ Ọlọ́run wá
  rationale: ἐκ ń fi orísun hàn níhìn-ín. ‘Ti ọ̀dọ̀ Ọlọ́run wá’ jẹ́ Yorùbá àdánidá tí kò sọ ọ́ di ohun-ìní nìkan.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: àwọn ọ̀rọ̀ Ọlọ́run
  rationale: ‘Àwọn ọ̀rọ̀’ pa ìtumọ̀ ọ̀pọ̀ ῥήματα mọ́, ó sì ṣe kedere, ó sì ní iyì ní Yorùbá òde òní.
- source_word: ἀκούει / ἀκούετε
  choice: ń gbọ́ / kò fi gbọ́
  rationale: A pa àsọtúnsọ ‘gbọ́’ mọ́, láì sọ ọ́ di ‘gbọ́ràn,’ bí ó tilẹ̀ jẹ́ pé àyíká lè ní ìtumọ̀ gbígbọ́ pẹ̀lú ìtẹ́wọ́gbà.
- source_word: διὰ τοῦτο
  choice: Nítorí èyí ni ... fi
  rationale: Ìṣètò Yorùbá yìí ń fi ìdí tàbí àbájáde tí gbólóhùn náà ń tọ́ka sí hàn lọ́nà àdánidá.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò orúkọ Gíríìkì jẹ́ mímú jáde fún ìtẹnumọ́; ‘ẹ̀yin’ pa ìtẹnumọ́ àti ọ̀pọ̀ ẹni mọ́.
- source_word: ὅτι
  choice: nítorí pé
  rationale: A mú un gẹ́gẹ́ bí àsopọ̀ onídí, èyí tí ó bá àyíká mu jù; àmọ́ a tọ́ka sí ìtumọ̀ míì nínú àlàyé ìsàlẹ̀.
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: ẹ̀yin kò ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó tún pa èdè orísun ἐκ mọ́, ó sì jẹ́ kí ìyàtọ̀ tí Johanu gbé kalẹ̀ dúró láì ṣàlàyé rẹ̀ sí ẹ̀kọ́ ìsìn kan pàtó.
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ ‘láti ọ̀dọ̀ Ọlọ́run wá’ nínú àyíká Johanu
  choice: Pa èdè orísun mọ́ gẹ́gẹ́ bí ‘ti ọ̀dọ̀ Ọlọ́run wá.’
  alternative: ‘jẹ́ ti Ọlọ́run’ tàbí pípa á mọ́ sí ìtumọ̀ ìgbàlà kan pàtó
  rationale: Èyí pa ìṣòro àti ìjinlẹ̀ ẹ̀kọ́ ìsìn inú ọ̀rọ̀ náà mọ́, láì fi ẹ̀kọ́ ìsìn ẹ̀ka kan kún un.
- issue: Agbára ἀκούω
  choice: gbọ́
  alternative: gbọ́ràn tàbí tẹ́tí sí tí ó sì tẹ̀lé
  rationale: Nínú àyíká, gbígbọ́ tòótọ́ lè ní ìtẹ́wọ́gbà nínú, ṣùgbọ́n ‘gbọ́’ ló túmọ̀ ọ̀rọ̀ náà ní tààrà, ó sì pa àsọtúnsọ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè òde òní tí ó ní iyì. A lo ‘ti ọ̀dọ̀ ... wá’ fún èdè orísun, a sì lo ‘ẹ̀yin’ láti fi ọ̀pọ̀ ẹni àti ìtẹnumọ́ hàn. Àwọn àmì àlàyé [a] àti [b] wà ní ibi tí àwọn àlàyé méjèèjì ti kan apá ìkẹyìn.
