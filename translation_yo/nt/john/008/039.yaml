  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: yo
  text: Wọ́n dá a lóhùn, wọ́n sì sọ fún un pé, “Ábúráhámù ni baba wa.” Jésù sọ fún wọn pé, “Bí ẹ̀yin bá jẹ́ ọmọ Ábúráhámù, ẹ̀yin ìbá máa ṣe àwọn iṣẹ́ Ábúráhámù.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ ọ́ pé, “Bí ẹ̀yin bá jẹ́ ọmọ Ábúráhámù, ẹ máa ń ṣe àwọn iṣẹ́ Ábúráhámù.” Ọ̀rọ̀-ìṣe Gíríìkì tó wà ní ìrísí imperfect lè tọ́ka sí ipò tí kò bá òtítọ́ mu: bí wọ́n bá jẹ́ ọmọ Ábúráhámù, wọ́n ìbá ṣe àwọn iṣẹ́ Ábúráhámù.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Wọ́n dá a lóhùn, wọ́n sì sọ fún un pé
  rationale: Ó pa àwọn ọ̀rọ̀-ìṣe méjèèjì, ‘dá lóhùn’ àti ‘sọ,’ mọ́ gẹ́gẹ́ bí Gíríìkì ṣe rí, ṣùgbọ́n ó tún jẹ́ èdè Yorùbá àdánidá.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Ábúráhámù ni baba wa
  rationale: Ìṣètò yìí jẹ́ àdánidá ní Yorùbá, ‘ni’ sì tẹnumọ́ ẹni tí wọ́n ń pè ní baba wọn.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù sọ fún wọn pé
  rationale: Yorùbá kò fi àmì àsìkò hàn lórí ọ̀rọ̀-ìṣe bí Gíríìkì; gbólóhùn yìí bá ìsinsìnyí ìtàn λέγει mu láìfi àsìkò míì kún un.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: ọmọ Ábúráhámù
  rationale: ‘Ọmọ’ lè kan ọkùnrin àti obìnrin, ó sì pa ìbátan ọmọ sí baba mọ́ láìdín un kù sí ìran akọ nìkan.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: àwọn iṣẹ́ Ábúráhámù
  rationale: ‘Àwọn iṣẹ́’ pa ìtumọ̀ ohun tí ẹni ṣe àti ìyàtọ̀ tó wà láàárín ìdílé tí a ń pè àti ìwà tí a ń hù mọ́.
- source_word: Εἰ … ἐστε … ἐποιεῖτε
  choice: Bí … bá jẹ́ … ìbá máa ṣe
  rationale: Ìkọ̀lé ‘ìbá máa ṣe’ fi ìṣe tí ó yẹ kí ó máa lọ lọwọ́ hàn, ó sì mú agbára àídájú tàbí ipò tí kò bá òtítọ́ mu tí imperfect ἐποιεῖτε lè ní nínú gbólóhùn oní ‘bí’ jáde.
theological_decisions:
- issue: Irú jíjẹ́ ọmọ Ábúráhámù tí Jésù ń sọ̀rọ̀ nípa rẹ̀
  choice: A túmọ̀ èdè ìbátan náà ní tààrà, a sì jẹ́ kí ìyàtọ̀ láàárín ẹ̀tọ́ tí wọ́n ń sọ àti iṣẹ́ wọn dúró.
  alternative: Kí a ṣàlàyé rẹ̀ ní kedere gẹ́gẹ́ bí kíkọ ìran ti ara tàbí gẹ́gẹ́ bí jíjẹ́ ọmọ nípa ẹ̀mí nìkan.
  rationale: Ẹsẹ yìí fúnra rẹ̀ fi ọ̀rọ̀ wọn pé Ábúráhámù ni baba wọn wé àìṣe iṣẹ́ Ábúráhámù; kò yẹ kí ìtumọ̀ fi ètò ẹ̀kọ́ ìgbàgbọ́ tí ó ju ohun tí ẹsẹ náà sọ lọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì lo ‘ẹ̀yin’ lẹ́ẹ̀kan láti tẹnumọ́ àwọn tí Jésù ń bá sọ̀rọ̀.
