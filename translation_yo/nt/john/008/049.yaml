source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: yo
  text: Jésù dáhùn pé, “Èmi kò ní ẹ̀mí èṣù[a]; ṣùgbọ́n mo ń bọ̀wọ̀ fún Baba mi, ẹ̀yin sì ń bu ọlá mi jẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà àlàyé sí i, “Ẹ̀mí èṣù kò wọ̀ mí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dáhùn
  rationale: Ọ̀rọ̀ ìṣe ìtàn yìí túmọ̀ sí pé Jésù fèsì sí ohun tí wọ́n sọ; ‘dáhùn’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé jù lọ.
- source_word: δαιμόνιον
  choice: ẹ̀mí èṣù
  rationale: ‘Ẹ̀mí èṣù’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹ̀dá ẹ̀mí búburú, ó sì pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì sọ ọ́ di ipò tàbí àìsàn.
- source_word: οὐκ ἔχω
  choice: Èmi kò ní
  rationale: Èyí tẹ̀ lé àkójọpọ̀ ọ̀rọ̀ Gíríìkì ‘kò ní’ ní tààràtà, ó sì pa ìtẹnumọ́ inú Ἐγώ mọ́ nípasẹ̀ ‘Èmi.’
- source_word: τιμῶ
  choice: mo ń bọlá fún
  rationale: ‘Bọlá fún’ sọ ìfiyì àti ọlá tí τιμάω ní, ó sì bá ọ̀rọ̀ òde òní mu.
- source_word: τὸν πατέρα μου
  choice: Baba mi
  rationale: Ní àyíká ọ̀rọ̀ Jòhánù, Jésù ń tọ́ka sí Ọlọ́run; lílo lẹ́tà ńlá fún ‘Baba’ fi ìtọ́kasí yẹn hàn láì fi ohun mìíràn kún un.
- source_word: ἀτιμάζετέ
  choice: ẹ̀yin sì ń tàbùkù sí
  rationale: ‘Tàbùkù sí’ dúró ní ìtakora pẹ̀lú ‘bọlá fún’ ó sì gbé èrò àìfọlá hàn ju pé kí a dín un kù sí èébú ẹnu nìkan.
- source_word: με
  choice: mi
  rationale: A tú ọ̀rọ̀ arọ́pò-orúkọ olùgbà náà ní tààràtà.
theological_decisions:
- issue: Ìtọ́kasí ‘Baba mi’
  choice: A ka ‘Baba’ sí Ọlọ́run gẹ́gẹ́ bí àyíká ọ̀rọ̀ Jòhánù ṣe fi hàn.
  alternative: Kí a ka á sí baba ènìyàn lásán.
  rationale: Nínú ọ̀rọ̀ Jésù ní Jòhánù, ‘Baba mi’ jẹ́ ìtọ́kasí pàtàkì sí Ọlọ́run; lẹ́tà ńlá ń mú èyí hàn láì yanjú ju ohun tí àyíká ọ̀rọ̀ fàyè gbà lọ.
- issue: Ìtumọ̀ ‘ní ẹ̀mí èṣù’
  choice: A pa àpẹẹrẹ ọ̀rọ̀ orísun náà mọ́ pé ‘Èmi kò ní ẹ̀mí èṣù.’
  alternative: ‘Ẹ̀mí èṣù kò gbà mí’ tàbí ‘ẹ̀mí èṣù kò wọ̀ mí.’
  rationale: Àwọn ọ̀nà míì ń ṣàlàyé ìtumọ̀ tí a lè rí nínú gbólóhùn náà, ṣùgbọ́n wọ́n túmọ̀ rẹ̀ jinlẹ̀ sí i ju ọ̀rọ̀ Gíríìkì lọ; nítorí náà, a fi ìtúmọ̀ tààrà sí àkọ́kọ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì yé àwọn òǹkàwé òde òní ni a lò. ‘Èmi’ pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́; àmì àkọsílẹ̀ [a] wà lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
