  source_fidelity: 'Ìtumọ̀ náà mú ìpìlẹ̀ gbólóhùn Gíríìkì náà dáadáa: Jésù dáhùn, ó sẹ́ pé òun ní ẹ̀mí èṣù, ó sì fi bíbọlá fún Baba rẹ̀ ṣe ìtakora sí àìfọlá tí àwọn olùgbọ́ rẹ̀ ń ṣe sí i. Síbẹ̀, ‘ń tàbùkù sí mi’ sábà máa ń tẹ̀ sí ‘sọ̀rọ̀ ìbàjẹ́ sí’ tàbí ‘ṣe ìfipá/ìkórìíra sí,’ nígbà tí ἀτιμάζω ń pa ìtakora ọlá–àìfọlá mọ́. ‘Ń bu ọlá mi jẹ’ jẹ́ ìbámu tó sún mọ́ orísun náà.'
  naturalness: ‘Bọ̀wọ̀ fún’ àti ‘bu ọlá ... jẹ’ jẹ́ ọ̀rọ̀ Yorùbá adayeba, tí wọ́n sì dá ìtakora tí ó wà nínú τιμῶ/ἀτιμάζετε hàn kedere. Àmì ohùn àti ìkọ̀wé gbólóhùn nínú àtúnṣe náà bá Yorùbá ìpele gẹ́gẹ́ mu.
  terminology: ‘Ẹ̀mí èṣù’ pa δαιμόνιον mọ́ gẹ́gẹ́ bí ẹ̀mí búburú, láì yí i padà sí ìtumọ̀ ìwòsàn tàbí ìtúmọ̀ ẹ̀kọ́ ìjọ. ‘Baba mi’ yẹ ní àyíká Jòhánù, ó sì pa ìtọ́kasí Ọlọ́run mọ́. ‘Bọ̀wọ̀ fún’/‘bu ọlá jẹ’ ń dá ìbáṣepọ̀ ọ̀rọ̀ ‘ọlá’ àti ‘àìfọlá’ nínú orísun náà dúró.
