id: JHN.8.29
reference: John 8:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: yo
  text: Ẹni tí ó rán mi sì wà pẹ̀lú mi. Kò fi mí sílẹ̀ ní ìdánìkanwà, nítorí pé mo máa ń ṣe ohun tí ó wu u nígbà gbogbo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: Ẹni tí ó rán mi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe yìí túmọ̀ sí ‘ẹni tí ó rán mi.’ Ó tọ́ka sí Baba, ṣùgbọ́n a pa ọ̀nà ìbátan tí Gíríìkì lò mọ́ láìfi ‘Baba’ kún un.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: wà pẹ̀lú mi
  rationale: μετά pẹ̀lú ọ̀rọ̀ ní genitive ń fi ìwà-pẹ̀lú tàbí ìbákẹ́gbẹ́ hàn. ‘Wà pẹ̀lú mi’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìwàníhìn-ín rẹ̀ mọ́.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Kò fi mí sílẹ̀ nìkan
  rationale: Ọ̀rọ̀ yìí sọ pé ẹni tí ó rán Jésù kò fi í dá wà. Ètò ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, kò sì fipá yanjú bóyá aorist náà yẹ kí a tẹnumọ́ gẹ́gẹ́ bí ìṣẹ̀lẹ̀ àtijọ́ tàbí ipò tí àbájáde rẹ̀ ń bá a lọ.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Níhìn-ín ὅτι ń ṣàfihàn ìdí; ‘nítorí pé’ mú ìbáṣepọ̀ ìdí náà hàn kedere ní Yorùbá òde òní.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: ohun tí ó wu u
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní ti gígún sí ‘àwọn ohun tí ó tẹ́ ẹ lọ́rùn.’ ‘Ohun tí ó wu u’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa èrò ohun tí ó dùn mọ́ ẹni náà mọ́.
- source_word: ποιῶ πάντοτε
  choice: mo máa ń ṣe ... nígbà gbogbo
  rationale: ‘Máa ń ṣe’ ń fi ìṣe àṣà tí ń tẹ̀ síwájú hàn, ‘nígbà gbogbo’ sì pa agbára πάντοτε (‘ní gbogbo ìgbà’) mọ́.
theological_decisions:
- issue: Ta ni ‘Ẹni tí ó rán mi’ ń tọ́ka sí?
  choice: A pa ọ̀rọ̀ ìbátan náà mọ́ gẹ́gẹ́ bí ‘Ẹni tí ó rán mi.’
  alternative: 'Kí a fi ‘Baba’ hàn gbangba: ‘Baba tí ó rán mi.’'
  rationale: Àyíká Ìhìn Rere Jòhánù fi hàn pé Baba ni a ń sọ, ṣùgbọ́n Gíríìkì kò lo orúkọ oyè ‘Baba’ ní ẹsẹ yìí. Dídá gbólóhùn náà mọ́ ń pa ara ìkọ̀wé Jòhánù àti ohun tí orísun sọ mọ́.
- issue: Ìrí ìṣe ἀφῆκεν
  choice: ‘Kò fi mí sílẹ̀ nìkan,’ ọ̀nà tí kò fi àmì àkókò sí i ju bí Yorùbá ṣe nílò lọ.
  alternative: Ọ̀rọ̀ tí yóò tẹnumọ́ ìgbà àtijọ́ tàbí àbájáde tí ń bá a lọ ní pàtó.
  rationale: ἀφῆκεν jẹ́ aorist, ṣùgbọ́n Yorùbá kò ní láti ṣe ìyàtọ̀ rẹ̀ ní ọ̀nà kan náà bí Gẹ̀ẹ́sì. Ìtumọ̀ yìí jẹ́ àdánidá, ó sì bá gbólóhùn tó ṣáájú rẹ̀—‘wà pẹ̀lú mi’—mu.
- issue: Ìbáṣepọ̀ ìdí nínú ὅτι
  choice: A túmọ̀ rẹ̀ sí ‘nítorí pé,’ kí ìdí tí a sọ nínú gbólóhùn náà dúró bí ó ti rí.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àlàyé lasan, bí ‘pé.’
  rationale: Nínú àyíká yìí, ìtumọ̀ ìdí ni ó ṣeé ṣe jù. A kò ṣàlàyé ju ohun tí ẹsẹ náà sọ lọ nípa bí ìṣe Ọmọ àti ìwàníhìn-ín Baba ṣe ní ìbáṣepọ̀.
translation_notes:
  register: Yorùbá àfihàn jẹ́ ti ìpele ọ̀wọ̀, àdánidá, àti òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘Ẹni tí ó rán mi’ dípò fifi ‘Baba’ kún ọ̀rọ̀ orísun; ‘ohun tí ó wu u’ sì jẹ́ gbolohun tí olùkà Yorùbá lásán lè lóye ní rọrùn.
