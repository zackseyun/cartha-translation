  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn kókó Gíríìkì mọ́ dáadáa: ‘Ẹni tí ó rán mi’ jẹ́ ìtumọ̀ tó pé fún ὁ πέμψας με; ‘wà pẹ̀lú mi’ fi μετ’ ἐμοῦ ἐστιν hàn; ‘nítorí pé’ tọ́ fún ὅτι níbí; ‘mo máa ń ṣe ... nígbà gbogbo’ sì ṣàfihàn ìṣe ìbáṣepọ̀/ìwàṣe ti ποιῶ πάντοτε. Ṣùgbọ́n ipò ‘nìkan’ nínú ‘Kò fi mí sílẹ̀ nìkan’ lè túmọ̀ sí ‘kò kàn fi mí sílẹ̀’ (negation of “merely”), kì í sì fi hàn láìlójú pé a fi ẹni náà sílẹ̀ ní ìdánìkanwà, èyí tí μόνον ń sọ nínú orísun.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá òde òní tí ó rọrùn láti ka. Àtúnṣe kékeré sí ‘ní ìdánìkanwà’ yóò mú ìtumọ̀ ‘alone’ hàn kedere, láìfà á sínú ìtumọ̀ tí kò dájú.
  terminology: ‘Ohun tí ó wu u’ jẹ́ àṣàyàn àdánidá fún τὰ ἀρεστὰ αὐτῷ, bí ó tilẹ̀ jẹ́ pé ó lè ní ìtẹ̀sí ‘ohun tí ó fẹ́.’ Nínú àyíká yìí ó gbé ìtumọ̀ ‘ohun tí ó tẹ́ ẹ lọ́rùn’ dáadáa. A kò fi ‘Baba’ kún ‘Ẹni tí ó rán mi,’ nítorí pé orísun kò sọ ọ́ ní ẹsẹ yìí.
  issues:
  - severity: medium
    issue: ‘Kò fi mí sílẹ̀ nìkan’ ní ìmìtìtì ìtumọ̀.
    rationale: Ní Yorùbá, ‘... nìkan’ ní ipò yìí lè ní ìtumọ̀ pé ‘kò kàn/merely ṣe bẹ́ẹ̀,’ dípò ‘kò fi mí sílẹ̀ ní èmi nìkan.’ Μόνον nínú Gíríìkì ṣàpèjúwe με gẹ́gẹ́ bí ẹni tí a fi sílẹ̀ ní òun nìkan. ‘Ní ìdánìkanwà’ yọ ìmìtìtì náà kúrò.
  revised_text: Ẹni tí ó rán mi sì wà pẹ̀lú mi. Kò fi mí sílẹ̀ ní ìdánìkanwà, nítorí pé mo máa ń ṣe ohun tí ó wu u nígbà gbogbo.
