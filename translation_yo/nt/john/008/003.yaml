  text: Ἄγουσιν δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι πρὸς αὐτὸν γυναῖκα ἐν μοιχείᾳ κατειλημμένην· καὶ στήσαντες αὐτὴν ἐν μέσῳ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/003.yaml
  text: Then[a] the scribes and the Pharisees brought to him a woman caught in adultery, and having set her in the midst,
translation:
  language: yo
  text: Nígbà náà[a] ni àwọn akọ̀wé àti àwọn Farisí darí obìnrin kan tí wọ́n mú nínú ìṣe panṣágà wá sọ́dọ̀ rẹ̀; wọ́n sì mú un dúró ní àárín wọn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni ìtẹ̀síwájú ìtàn obìnrin tí wọ́n mú nínú ìṣe panṣágà (Jòhánù 7:53–8:11). Wo àlàyé lórí Jòhánù 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: mú ... wá
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìsinsìnyí ìtàn, ṣùgbọ́n ọ̀nà àdánidá láti sọ ìṣẹ̀lẹ̀ ìtàn ní Yorùbá ni “mú ... wá”; ó tún lè túmọ̀ sí dídarí ẹni wá.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Orúkọ tí ó wọ́pọ̀ nínú Yorùbá Bíbélì fún àwọn amòfin àti olùkọ́ òfin ẹ̀sìn Júù.
- source_word: ἐν μοιχείᾳ κατειλημμένην (καταλαμβάνω)
  choice: tí wọ́n mú nínú ìṣe panṣágà
  rationale: Perfect passive participle náà fi hàn pé wọ́n bá a nígbà ìṣe náà; gbólóhùn yìí jẹ́ kedere, ó sì yẹ fún èdè Yorùbá olówó-ìwà.
- source_word: στήσαντες (ἵστημι)
  choice: wọ́n sì mú un dúró
  rationale: Ó sọ ìgbésẹ̀ tí wọ́n fi obìnrin náà sí ipò dúró níwájú àwọn ènìyàn; “mú un dúró” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐν μέσῳ (μέσος)
  choice: ní àárín wọn
  rationale: Ó tọ́ka sí ibi tí wọ́n gbé obìnrin náà sí láàárín àwùjọ tí ó wà níbẹ̀; “wọn” ṣàlàyé àwùjọ náà láìyí ìtumọ̀ padà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A pa àmì ìtẹ̀síwájú “Nígbà náà” mọ́ pẹ̀lú àlàyé ìyàtọ̀ àfọwọ́kọ.
