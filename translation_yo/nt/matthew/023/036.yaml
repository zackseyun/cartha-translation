  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: yo
  text: Lóòótọ́ ni mo sọ fún yín,[b] gbogbo nǹkan wọ̀nyí[a] yóò dé sórí ìran yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “gbogbo èyí.” Ọ̀rọ̀ náà wà ní ọ̀pọ̀ nínú Gíríìkì: “gbogbo nǹkan wọ̀nyí.”'
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lè lóye “ìran yìí” gẹ́gẹ́ bí “àwọn ènìyàn wọ̀nyí” tàbí gẹ́gẹ́ bí ìran aláìgbàgbọ́ tí ó gbòòrò; ṣùgbọ́n ìtumọ̀ tààrà jù lọ nínú Gíríìkì ni “ìran yìí.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Nínú ọ̀nà ọ̀rọ̀ ἀμὴν λέγω ὑμῖν, ọ̀rọ̀ yìí jẹ́ ìmúdájú pàtàkì tí ó ṣí ọ̀rọ̀ aláṣẹ sílẹ̀. “Lóòótọ́ ni” mú agbára rẹ̀ jáde ní Yorùbá òde òní láì fi í sílẹ̀ gẹ́gẹ́ bí “Àmín.”
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí túmọ̀ ọ̀rọ̀ ìṣe àti arọ́pò-orúkọ náà ní tààrà, ó sì bá ìlò Yorùbá mu nínú ọ̀rọ̀ ìmúdájú.
- source_word: ἥξει
  choice: yóò dé bá
  rationale: Ọ̀rọ̀ náà tọ́ka sí dídé ohun tí a ti sọ tẹ́lẹ̀ sórí àwọn ẹni tí ó kan. “Yóò dé bá” jẹ́ ọ̀nà Yorùbá adayeba láti sọ pé ìṣẹ̀lẹ̀ tàbí ìdájọ́ kan yóò dé sórí ẹnì kan.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Èyí pa ọ̀pọ̀ nọ́ńbà inú Gíríìkì mọ́, ó sì tọ́ka padà sí àwọn ohun tí a mẹ́nu kàn ṣáájú.
- source_word: ἐπὶ
  choice: dé bá
  rationale: Ní ìsopọ̀ pẹ̀lú ἥξει, “dé bá” fi ìṣípòpadà sí ẹni tí ohun náà yóò kàn hàn láì fi ìtumọ̀ ọ̀tá tàbí ìkọlù kún un.
- source_word: γενεὰν ταύτην
  choice: ìran yìí
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ, ó sì pa agbára ìtọ́kasí sí ìran kan mọ́ láì yanjú àríyànjiyàn nípa bí ìtọ́kasí náà ṣe gbòòrò tó.
theological_decisions:
- issue: Ohun tí “ìran yìí” (γενεὰν ταύτην) ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí “ìran yìí” láì fi àlàyé onítumọ̀ kún ọ̀rọ̀ pàtàkì.
  alternative: Àwọn kan lè lóye rẹ̀ gẹ́gẹ́ bí “àwọn ènìyàn wọ̀nyí,” ìran aláìgbàgbọ́ tí ó gbòòrò, àwọn Júù jákèjádò àkókò, tàbí ayé ìsinsìnyí.
  rationale: Gíríìkì ka “ìran yìí” ní tààrà. Ìtumọ̀ náà kò gbọdọ̀ yanjú ọ̀ràn ẹ̀kọ́ nípa ìgbà ìkẹyìn ju ohun tí ọ̀rọ̀ orísun sọ lọ; ó yẹ kí àyíká ọ̀rọ̀ ran òǹkàwé lọ́wọ́ láti pinnu bí ìtọ́kasí náà ṣe gbòòrò tó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó lágbára, ó sì ṣeé lóye fún òǹkàwé òde òní. “Lóòótọ́ ni mo sọ fún yín” pa ìró ọ̀rọ̀ ìmúdájú mímọ́ náà mọ́, nígbà tí “yóò dé bá” jẹ́ Yorùbá adayeba.
