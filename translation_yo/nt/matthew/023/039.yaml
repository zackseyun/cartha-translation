review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú γάρ (‘Nítorí’), ìkọ̀ tí ó lágbára οὐ μή (‘kì yóò ... rárá’), ìbẹ̀rẹ̀ àkókò ἀπ’ ἄρτι, àti ààlà ọjọ́ iwájú ἕως ἂν ... mọ́ dáadáa. Síbẹ̀, ‘Alábùkún-fún’ sábà máa ń tọ́ka sí ẹni tí ń fúnni ní ìbùkún, kì í ṣe ẹni tí a bù kún; nítorí náà kò bá Εὐλογημένος mu níbí.
  naturalness: ‘Olùbùkún ni’ jẹ́ ọ̀nà Yorùbá boṣewa, ti ara, tí ó sì ní ìró àyọlò Sáàmù fún ‘Blessed is.’ Àwọn ìyókù ìlànà gbolohun náà jẹ́ adayébá, ó sì yẹ fún ìforígbọ́wọ́ ìwé mímọ́ òde òní.
  terminology: A túnṣe ‘Alábùkún-fún’ sí ‘Olùbùkún.’ ‘Olúwa’ fún κύριος, ‘orúkọ’ fún ὄνομα, àti ‘ẹni tí ń bọ̀’ fún ὁ ἐρχόμενος dára, kò sì fi ìtumọ̀ ẹ̀sìn kan kún ọ̀rọ̀ orísun.
