id: MAT.23.39
reference: Matthew 23:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: yo
  text: Nítorí mo sọ fún yín pé,[a] láti ìsinsìnyí lọ, ẹ̀yin kì yóò rí mi rárá títí ẹ ó fi sọ pé,[b] ‘Olùbùkún ni ẹni tí ń bọ̀ ní orúkọ Olúwa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin kì yóò rí mi rárá láti ìsinsìnyí lọ títí ẹ ó fi sọ pé.” Èdè Gíríìkì lo ìkọ̀ tí ó lágbára (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí jẹ́ àyọlò tàbí ìtọ́kasí sí Sáàmù 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: Ó pa agbára ìṣàlàyé γάρ mọ́ nípasẹ̀ ‘Nítorí,’ ó sì tú ọ̀rọ̀ ìtọ́kasí taara λέγω ... ὑμῖν sí Yorùbá àdánidá.
- source_word: οὐ μή
  choice: kì yóò ... rárá
  rationale: Àpapọ̀ ‘kì yóò’ àti ‘rárá’ fi ìkọ̀ emphatic Gíríìkì hàn ní Yorùbá tí ó ṣe kedere, láì sọ ọ́ di ‘láéláé,’ èyí tí ó lè bo ààlà ‘títí’ mọ́lẹ̀.
- source_word: ἴδητε
  choice: rí
  rationale: ‘Rí’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé jù fún ὁράω níbí; kò ní ìgbàanì tàbí àfikún ìtumọ̀.
- source_word: ἀπ’ ἄρτι
  choice: láti ìsinsìnyí lọ
  rationale: Ó fi ibẹrẹ̀ àkókò láti ìgbà tí a ń sọ̀rọ̀ hàn ní ọ̀nà Yorùbá àdánidá.
- source_word: ἕως ἂν εἴπητε
  choice: títí ẹ ó fi sọ pé
  rationale: Ìlànà ‘títí ... fi’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ààlà ọjọ́ iwájú tí ἕως ἄν pẹ̀lú subjunctive ń tọ́ka sí.
- source_word: Εὐλογημένος
  choice: Alábùkún-fún ni
  rationale: Ó pa ìtumọ̀ ìbùkún àti ìró Ìwé Mímọ́ mọ́, láì dín ọ̀rọ̀ náà kù sí ‘ẹni tí a yìn.’
- source_word: ὁ ἐρχόμενος
  choice: ẹni tí ń bọ̀
  rationale: Ó ṣàfihàn articular participle náà lọ́nà Yorùbá àdánidá, láì fi ìtumọ̀ oyè Mèsáyà kan tí ọ̀rọ̀ náà kò dá lójú kún un.
- source_word: ἐν ὀνόματι κυρίου
  choice: ní orúkọ Olúwa
  rationale: Ó tẹ̀lé ìṣètò ọ̀rọ̀ orísun, ó sì pa ìró àyọlò Sáàmù mọ́; κύριος ni a tú sí ‘Olúwa.’
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jésù nípa rírí rẹ̀ lọ́jọ́ iwájú àti jíjẹ́wọ́ ọ̀rọ̀ ìbùkún náà
  choice: Ìkéde líle pé wọn kì yóò rí i láti ìsinsìnyí títí wọn yóò fi sọ ọ̀rọ̀ ìbùkún tí a fa yọ, láì sọ ìṣẹ̀lẹ̀ tàbí àkókò pàtó tí èyí yóò ṣẹlẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí ìwọlé ayẹyẹ Jésù, ìpadàbọ̀ kejì, tàbí ìrònúpìwàdà Ísírẹ́lì lọ́jọ́ iwájú.
  rationale: Gíríìkì sọ ààlà ‘títí’ àti ọ̀rọ̀ tí wọn yóò sọ, ṣùgbọ́n kò sọ ìṣẹ̀lẹ̀ ìtàn tàbí ti ọjọ́ ìkẹyìn pàtó; ìtumọ̀ náà kò yan ẹ̀kọ́ ìtumọ̀ kan dípò àwọn yòókù.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àmì ohùn wà níbi tí ó bá yẹ. ‘Ẹ̀yin’ mú púpọ̀ ὑμῖν/ἴδητε/εἴπητε hàn, ‘rárá’ sì pa ìtẹnumọ́ οὐ μή mọ́.
