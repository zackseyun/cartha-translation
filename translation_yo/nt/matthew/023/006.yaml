  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: yo
  text: Wọ́n sì fẹ́ràn ipò ọlá jù lọ níbi àwọn àsè[a][c], àti àwọn ìjókòó ọlá jù lọ nínú àwọn sínágọ́gù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ipò ọlá àkọ́kọ́ níbi tábìlì.” Ní ayé àtijọ́, àwọn ènìyàn máa ń tìgbọ̀n níbi oúnjẹ àjọyọ̀, ipò kan sì máa ń fi ọlá ẹni hàn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí “àwọn ìjókòó àkọ́kọ́.” Ọ̀rọ̀ Gíríìkì tẹnumọ́ àwọn ìjókòó tí ipò àti ọlá wọn ga jù.
    reason: lexical_alternative
  - marker: c
    text: Ní àwọn àsè ilẹ̀ Mẹditaréníà ayé àtijọ́, ibi tí ẹni kọ̀ọ̀kan wà máa ń fi ipò ọlá rẹ̀ hàn gbangba. Nítorí náà, ọ̀rọ̀ yìí ń sọ nípa ìfẹ́ sí ọlá ní gbangba, kì í ṣe ìfẹ́ sí ìtura lásán.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: wọ́n fẹ́ràn
  rationale: Ọ̀rọ̀ náà ń sọ nípa ohun tí wọ́n ní ìfẹ́ sí gidigidi tàbí tí wọ́n máa ń yàn fún ara wọn; “wọ́n fẹ́ràn” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa agbára àríwísí Jésù mọ́.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ ń so àpèjúwe yìí mọ́ ohun tó ṣáájú láìfi ìtakò líle hàn; “sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: πρωτοκλισίαν
  choice: ipò ọlá jù lọ
  rationale: Ó tọ́ka sí ipò títẹ̀gbọ̀n sí tábìlì tí a fi ń bu ọlá fún ẹni pàtàkì ní àsè ayé àtijọ́. “Ipò ọlá jù lọ” mú ìtumọ̀ ipò gíga yẹn jáde láìdá a mọ́ ọ̀nà ìjókòó òde òní.
- source_word: ἐν τοῖς δείπνοις
  choice: níbi àwọn àsè
  rationale: Nínú àyíká yìí, δεῖπνον jẹ́ oúnjẹ àjọyọ̀ tàbí àsè tí ipò ọlá ẹni máa ń hàn gbangba; “àwọn àsè” jẹ́ adayeba, ó sì bá ọ̀pọ̀ nǹkan inú Gíríìkì mu.
- source_word: πρωτοκαθεδρίας
  choice: àwọn ìjókòó ọlá jù lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn ìjókòó tí ipò tàbí ọlá wọn ga jù; yíyan yìí pa ìtumọ̀ ìṣáájú àti ọlá mọ́, kì í ṣe ìtura lásán.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nínú àwọn sínágọ́gù
  rationale: Èyí jẹ́ gbólóhùn ibi tó tọ́ka sí àwọn ibi ìpéjọsìn Júù; “nínú àwọn sínágọ́gù” jẹ́ ìtumọ̀ tààrà tó ṣe kedere.
