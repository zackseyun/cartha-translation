translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ipò ọlá jù lọ” yà sí “àwọn ìjókòó ọlá jù lọ” láti pa ìyàtọ̀ tó wà láàárín πρωτοκλισίαν àti πρωτοκαθεδρίας mọ́, nígbà tí “sínágọ́gù” jẹ́ ọ̀rọ̀ àyálò tó wọ́pọ̀ fún ibi ìpéjọsìn Júù.
