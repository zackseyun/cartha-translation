id: MAT.23.15
reference: Matthew 23:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: yo
  text: “Ègbé ni fún yín, ẹ̀yin akọ̀wé àti Farisí, ẹ̀yin alágàbàgebè! Nítorí ẹ máa ń rìn káàkiri lórí òkun àti lórí ilẹ̀ láti mú ẹnì kan wọ ẹ̀sìn Júù[a]; nígbà tí ó bá sì wọ ọ́, ẹ sọ ọ́ di ọmọ Gẹ̀hẹ́nà[b] ní ìlọ́po méjì ju ẹ̀yin fúnra yín lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láti sọ ẹnì kan di olùyípadà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ọmọ ọ̀run àpáàdì.” Gíríìkì ní “ọmọ Gẹ̀hẹ́nà.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìdálẹ́bi àsọtẹ́lẹ̀ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere ju ìkéde ìbànújẹ́ lásán lọ.
- source_word: γραμματεῖς
  choice: akọ̀wé
  rationale: Ọ̀rọ̀ ìbílẹ̀ tí a mọ̀ fún àwọn amòye àti olùkọ́ Òfin Júù; kò fi ìtumọ̀ àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: Φαρισαῖοι
  choice: Farisí
  rationale: Àkọsílẹ̀ orúkọ ẹgbẹ́ ẹ̀sìn Júù náà ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ὑποκριταί
  choice: alágàbàgebè
  rationale: Ó fi ìhùwàsí ẹni tí ó ń ṣe bí ẹni rere níta ṣùgbọ́n tí inú rẹ̀ yàtọ̀ hàn ní èdè Yorùbá òde òní.
- source_word: περιάγετε
  choice: ẹ máa ń rìn káàkiri
  rationale: Ó ṣàfihàn ìrìnàjò gbígbòòrò àti ìsapá tí ọ̀rọ̀ náà ní, láìjẹ́ kí Yorùbá di líle tàbí àjèjì.
- source_word: τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: lórí òkun àti lórí ilẹ̀
  rationale: Ó pa àwòrán apapọ̀ òkun àti ilẹ̀ mọ́, èyí tí ó túmọ̀ sí lílọ káàkiri ní ibi púpọ̀.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: láti sọ ẹnì kan di olùyípadà
  rationale: “Olùyípadà” jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye, nígbà tí àlàyé ìtàn pé ó lè tọ́ka sí ẹni tí ó yí padà sí ẹ̀sìn Júù wà nínú àlàyé ìsàlẹ̀.
- source_word: ὅταν γένηται
  choice: nígbà tí ó bá sì di ọ̀kan
  rationale: Ó tọ́ka padà sí olùyípadà kan náà, ó sì pa ẹyọ akọ nínú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: υἱὸν γεέννης
  choice: ọmọ Gẹ̀hẹ́nà
  rationale: Ó pa àkànlò èdè Semitic “ọmọ” àti orúkọ Gẹ̀hẹ́nà nínú Gíríìkì mọ́, dípò fífi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
- source_word: διπλότερον ὑμῶν
  choice: ní ìlọ́po méjì ju ẹ̀yin fúnra yín lọ
  rationale: Ó mú ìfiwéra Gíríìkì náà jáde ní Yorùbá tí ó ṣe kedere, ó sì tẹnu mọ́ ìfi ẹni náà wé àwọn tí Jesu ń bá sọ̀rọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ γεέννα
  choice: Gẹ̀hẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ orúkọ Gẹ̀hẹ́nà, tí ó ní ìpìlẹ̀ ìtàn àti ìtumọ̀ ọjọ́ ìdájọ́ nínú àṣà Júù. Dídá orúkọ náà dúró ń pa ìtumọ̀ orísun mọ́; àlàyé ìsàlẹ̀ fi ọ̀nà tí ó wọ́pọ̀ hàn.
- issue: Àkànlò “ọmọ Gẹ̀hẹ́nà”
  choice: Pa “ọmọ” mọ́ gẹ́gẹ́ bí àkànlò ìbátan àti àbùdá
  alternative: ẹni tí ó yẹ fún Gẹ̀hẹ́nà
  rationale: Ìtumọ̀ àlàyé lè rọrùn, ṣùgbọ́n yóò tú àkànlò υἱὸν γεέννης sí ọ̀nà kan ṣoṣo. “Ọmọ Gẹ̀hẹ́nà” pa líle àti ìdààmú ọ̀rọ̀ Jesu mọ́.
- issue: Ẹyọ akọ lẹ́yìn προσήλυτον
  choice: nígbà tí ó bá sì di ọ̀kan, ẹ sọ ọ́
  alternative: nígbà tí irú ẹni bẹ́ẹ̀ bá di olùyípadà
  rationale: Àwọn ọ̀rọ̀ arọ́pò-orúkọ Yorùbá kò pín akọ àti abo, ṣùgbọ́n ẹyọ ọ̀rọ̀ Gíríìkì ṣì hàn kedere nípasẹ̀ “ó” àti “ọ̀kan,” láìfi akọ tàbí abo tí èdè Yorùbá kò fi hàn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti taara, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “ẹ̀yin” àti àfihàn ọ̀pọ̀ “ẹ” fún ọ̀rọ̀ tí Jesu ń sọ sí ẹgbẹ́ kan, a sì lo “ó/ọ́” fún olùyípadà ẹyọ kan. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
