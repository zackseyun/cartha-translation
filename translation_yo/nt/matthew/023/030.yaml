id: MAT.23.30
reference: Matthew 23:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: yo
  text: Ẹ̀yin sì ń wí pé, “Ká ní àwa ti wà ní ọjọ́ àwọn baba wa, àwa kì bá tí jẹ́ alábàáṣepọ̀ pẹ̀lú wọn[a] nínú ẹ̀jẹ̀ àwọn wòlíì[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́ alájọpín pẹ̀lú wọn” tàbí “bá wọn kópa”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípín nínú ìṣe kan tàbí jíjẹ́ alábàáṣiṣẹ́ pẹ̀lú ẹlòmíràn.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, kíkópa nínú dídá ẹ̀jẹ̀ àwọn wòlíì sílẹ̀; wọ́n ń sọ pé àwọn kì bá tí ní ìpín nínú ẹ̀bi ẹ̀jẹ̀ àwọn baba ńlá wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: ẹ̀yin sì ń wí pé
  rationale: Ọ̀rọ̀-ìṣe ìsinsìnyí, ẹni kejì ọ̀pọ̀, ni a túmọ̀ sí ọ̀rọ̀ tí Jésù ń bá wọn sọ ní tààràtà; “ń wí” fi ìṣe tí wọ́n máa ń ṣe hàn.
- source_word: Εἰ ἤμεθα
  choice: Ká ní àwa ti wà
  rationale: Àkójọpọ̀ yìí sọ ipò àròsọ nípa ohun tí kò ṣẹlẹ̀ ní àkókò àtijọ́. “Ká ní … ti wà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ irú àdéhùn òdì sí òtítọ́ bẹ́ẹ̀.
- source_word: ἐν ταῖς ἡμέραις
  choice: ní ọjọ́
  rationale: Ó pa àwòrán “àwọn ọjọ́” inú Gíríìkì mọ́, ó sì túmọ̀ sí ní ìgbà tàbí ní àkókò kan.
- source_word: τῶν πατέρων ἡμῶν
  choice: àwọn baba wa
  rationale: “Baba” tẹ̀ lé ọ̀rọ̀ akọ πατέρων, ó sì tọ́ka sí àwọn baba ńlá wọn láì sọ ọ́ di ọ̀rọ̀ àìlábòsí akọ tàbí abo.
- source_word: οὐκ ἂν ἤμεθα
  choice: àwa kì bá tí … ṣe
  rationale: 'Ìkọ̀ yìí bá ìdáhùn àdéhùn òdì sí òtítọ́ nípa àkókò àtijọ́ mu: wọn ń sọ ohun tí wọn kì bá tí ṣe.'
- source_word: αὐτῶν κοινωνοὶ
  choice: bá wọn ṣe alábàáṣepọ̀
  rationale: Ó mú èrò ìkópa tàbí ìdípapọ̀ pẹ̀lú wọn jáde láì fi ọ̀rọ̀ tó lágbára jù bí “alábápànìyàn” kún ìtumọ̀.
- source_word: ἐν τῷ αἵματι
  choice: nínú ẹ̀jẹ̀
  rationale: Ó pa àwòrán gidi ti “ẹ̀jẹ̀” mọ́, bí Gíríìkì ti ṣe, dípò kí a túmọ̀ rẹ̀ ní pàtó sí pípa tàbí ẹ̀bi ẹ̀jẹ̀.
- source_word: τῶν προφητῶν
  choice: àwọn wòlíì
  rationale: “Àwọn wòlíì” ni ọ̀rọ̀ Yorùbá tí ó fìdí múlẹ̀ fún προφῆται, àwọn tí Ọlọ́run rán láti kéde ọ̀rọ̀ rẹ̀.
theological_decisions:
- issue: Ìwọ̀n ìkópa tí κοινωνοὶ ἐν τῷ αἵματι túmọ̀ sí
  choice: 'A pa èdè ìbáṣepọ̀ àti àwòrán ẹ̀jẹ̀ mọ́: “bá wọn ṣe alábàáṣepọ̀ nínú ẹ̀jẹ̀ àwọn wòlíì.”'
  alternative: “bá wọn kópa nínú pípa àwọn wòlíì” tàbí “jẹ́ alábápànìyàn àwọn wòlíì pẹ̀lú wọn”
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìkópa nínú ẹ̀bi ẹ̀jẹ̀ àwọn tó pa àwọn wòlíì. Ṣùgbọ́n Gíríìkì lo èdè ìbáṣepọ̀ àti “ẹ̀jẹ̀,” nítorí náà a kò sọ ìtumọ̀ náà di pàtó ju orísun lọ nínú ẹsẹ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, àdánidá. “Ká ní … kì bá tí …” ń sọ àdéhùn òdì sí òtítọ́ nípa ohun àtijọ́ ní kedere. A pa ìró Bíbélì “ní ọjọ́ àwọn baba wa” àti àwòrán “ẹ̀jẹ̀ àwọn wòlíì” mọ́.
