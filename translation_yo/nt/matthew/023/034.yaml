id: MAT.23.34
reference: Matthew 23:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: yo
  text: Nítorí náà, wò ó, èmi ń rán àwọn wòlíì, àwọn ọlọ́gbọ́n àti àwọn akọ̀wé sí yín. Ẹ ó pa àwọn kan nínú wọn, ẹ ó sì kàn wọ́n mọ́ àgbélébùú; ẹ ó nà àwọn kan nínú wọn ní àwọn sínágọ́gù yín, ẹ ó sì ṣe inúnibíni sí wọn láti ìlú dé ìlú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: ἰδοὺ
  choice: ẹ wò ó
  rationale: Ìpè fún àfiyèsí ni ọ̀rọ̀ náà; àyànfẹ́ yìí jẹ́ ti Yorùbá òde òní, ó sì tún pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀποστέλλω
  choice: ń rán ... sí yín
  rationale: Àkókò ìsinsìnyí inú Gíríìkì ni a pa mọ́, ó sì lè tọ́ka sí ohun tí Jésù ń ṣe tàbí tí ó ti fẹ́ bẹ̀rẹ̀ sí í ṣe.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Ó jẹ́ orúkọ àwọn amòye àti olùkọ́ Òfin, ṣùgbọ́n ‘akọ̀wé’ pa ọ̀rọ̀ orísun mọ́ láì fi ìtumọ̀ ẹ̀sìn kan lé e lórí.
- source_word: μαστιγώσετε
  choice: ẹ ó nà
  rationale: Ó sọ ìjìyà lílu ní kedere ní èdè Yorùbá àdánidá.
- source_word: συναγωγαῖς
  choice: sínágọ́gù
  rationale: Àyálò ọ̀rọ̀ tí ó wọ́pọ̀, tí ó tọ́ka sí ibi ìpéjọpọ̀ àwọn Júù láì sọ ọ́ di ilé ìjọsìn Kristẹni.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: ẹ ó ṣe inúnibíni sí wọn láti ìlú kan dé ìlú kejì
  rationale: Ó pa ìtumọ̀ ìlépa oníjàngbọ̀n àti ìrìn láàárín àwọn ìlú mọ́.
theological_decisions:
- issue: Ta ni ó ń rán àwọn wòlíì, ọlọ́gbọ́n àti akọ̀wé?
  choice: ‘èmi ń rán’ ni a fi sí ẹnu Jésù gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́ ní tààrà.
  alternative: Láti sọ pé Ọlọ́run ni ó ń rán wọn nípasẹ̀ Jésù.
  rationale: Ọ̀rọ̀ orísun lo ἐγὼ ἀποστέλλω, ó sì yẹ kí a má ṣe ṣàlàyé ìbáṣepọ̀ ẹ̀kọ́ ní ọ̀nà tí ó ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ìyàtọ̀ láàárín àwọn tí a ó pa àti àwọn tí a ó kàn mọ́ àgbélébùú
  choice: ‘Ẹ ó pa àwọn kan nínú wọn, ẹ ó sì kàn wọ́n mọ́ àgbélébùú’
  alternative: Láti túmọ̀ rẹ̀ bí ẹni pé gbogbo àwọn kan náà ni a ó kọ́kọ́ pa, lẹ́yìn náà ni a ó kàn wọ́n mọ́ àgbélébùú.
  rationale: Àtòjọ àwọn ìṣe méjèèjì nínú Gíríìkì lè tọ́ka sí onírúurú ọ̀nà ìpànìyàn; a pa ìṣọ̀kan gírámà mọ́ láì fi àlàyé mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A lo ‘ẹ’ púpọ̀ nítorí ὑμᾶς àti àwọn fáàbù jẹ́ ọ̀pọ̀ ènìyàn. Àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ; ‘sínágọ́gù’ jẹ́ ọ̀rọ̀ àyálò tí ó mọ̀ọ́mọ̀ dá ìtumọ̀ ilé ìpéjọpọ̀ Júù dúró.
