  to: Nítorí náà, wò ó, èmi ń rán àwọn wòlíì, àwọn ọlọ́gbọ́n àti àwọn akọ̀wé sí yín. Ẹ ó pa àwọn kan nínú wọn, ẹ ó sì kàn wọ́n mọ́ àgbélébùú; ẹ ó nà àwọn kan nínú wọn ní àwọn sínágọ́gù yín, ẹ ó sì ṣe inúnibíni sí wọn láti ìlú dé ìlú.
