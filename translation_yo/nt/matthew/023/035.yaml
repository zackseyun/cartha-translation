review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the purpose/result clause, the judicial sense of blood coming upon the addressees, the inclusive Abel-to-Zechariah range, the disputed patronymic, and the specific location between the sanctuary and altar. The present passive participle is also well represented by “tí a ń ta sílẹ̀.”
  naturalness: “Gbogbo ẹ̀jẹ̀ olódodo” is understandable as a biblical metonym, but it is less idiomatic in contemporary Standard Yorùbá and can sound as though the blood itself is morally righteous. “Gbogbo ẹ̀jẹ̀ àwọn olódodo tí a ń ta sílẹ̀” states the intended metonym naturally without materially narrowing the Greek sense.
  terminology: “Ibi mímọ́” appropriately represents ναός in its narrower sanctuary sense, and “pẹpẹ ìrúbọ” appropriately renders altar. The names and the disputed identification should remain as supplied rather than be harmonized.
  issues:
  - severity: low
    issue: The phrase “gbogbo ẹ̀jẹ̀ olódodo” is stylistically ambiguous in Yorùbá.
    rationale: The Greek expression uses “righteous blood” metonymically for the blood of righteous persons. Expanding that metonym to “ẹ̀jẹ̀ àwọn olódodo” is more natural Yorùbá while preserving its referent.
  - severity: low
    issue: Footnote a gives the alternative as “lórí ilẹ̀ náà.”
    rationale: The alternative sense of γῆ is “land,” not necessarily “that land.” “Lórí ilẹ̀” preserves the lexical alternative without adding a demonstrative not present in the source.
  - severity: low
    issue: The wording “so ó mọ́” in footnote b is nonstandard/awkward.
    rationale: “Sopọ̀ mọ́” is a natural Standard Yorùbá expression for identifying or associating one figure with another.
  revised_text: kí gbogbo ẹ̀jẹ̀ àwọn olódodo tí a ń ta sílẹ̀ lórí ilẹ̀ ayé[a] lè wá sórí yín, láti ẹ̀jẹ̀ Ábẹ́lì olódodo títí dé ẹ̀jẹ̀ Sekaráyà ọmọ Berekáyà[b], ẹni tí ẹ̀yin pa láàárín ibi mímọ́ àti pẹpẹ ìrúbọ.
  revised_footnotes:
  - marker: a
    text: Tàbí, “lórí ilẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ilẹ̀ ayé” tàbí “ilẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn èèyàn kò fohùn ṣọ̀kan lórí ẹni tí “Sekaráyà ọmọ Berekáyà” jẹ́. Àwọn kan ń sopọ̀ mọ́ Sekaráyà wòlíì; àwọn mìíràn sì ń sopọ̀ mọ́ Sekaráyà ọmọ Jehoiada (2 Kíróníkà 24:20–22). Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì gẹ́gẹ́ bí a ti kọ ọ́.
    reason: alternative_reading
  revision_rationale: The revision makes the Greek metonym for innocent/righteous blood explicit in idiomatic Yorùbá, while retaining the source’s aspect, accusation, range, and unresolved historical identification. The two footnotes are adjusted only for lexical precision and natural Standard Yorùbá usage.
