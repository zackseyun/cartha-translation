id: MAT.23.35
reference: Matthew 23:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: yo
  text: kí gbogbo ẹ̀jẹ̀ àwọn olódodo tí a ń ta sílẹ̀ lórí ilẹ̀ ayé[a] lè wá sórí yín, láti ẹ̀jẹ̀ Ábẹ́lì olódodo títí dé ẹ̀jẹ̀ Sekaráyà ọmọ Berekáyà[b], ẹni tí ẹ̀yin pa láàárín ibi mímọ́ àti pẹpẹ ìrúbọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lórí ilẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ilẹ̀ ayé” tàbí “ilẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn èèyàn kò fohùn ṣọ̀kan lórí ẹni tí “Sekaráyà ọmọ Berekáyà” jẹ́. Àwọn kan ń sopọ̀ mọ́ Sekaráyà wòlíì; àwọn mìíràn sì ń sopọ̀ mọ́ Sekaráyà ọmọ Jehoiada (2 Kíróníkà 24:20–22). Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì gẹ́gẹ́ bí a ti kọ ọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: kí ... lè
  rationale: Ọ̀nà yìí fi ète tàbí àbájáde ọ̀rọ̀ tó ṣáájú hàn ní Yorùbá àdánidá, láìfi ipò méjèèjì náà dájú ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: lè wá sórí yín
  rationale: Ó pa ìtumọ̀ pé ẹ̀bi ẹ̀jẹ̀ yóò dé bá wọn mọ́, ó sì tún fi ipá ọ̀rọ̀ ἐπί hàn pẹ̀lú ‘sórí yín.’
- source_word: πᾶν αἷμα δίκαιον
  choice: gbogbo ẹ̀jẹ̀ olódodo
  rationale: Èyí pa àwòrán ẹ̀jẹ̀ àti àpèjúwe δίκαιον mọ́; ‘ẹ̀jẹ̀ olódodo’ dúró fún ẹ̀jẹ̀ àwọn olódodo tí a pa.
- source_word: ἐκχυννόμενον
  choice: tí a ń ta sílẹ̀
  rationale: Ìṣe tí ń lọ ní participle present passive ni a fi ‘tí a ń ta sílẹ̀’ hàn, láìsọ ẹni tó ń ṣe é, ó sì pa àwòrán dída ẹ̀jẹ̀ sílẹ̀ mọ́.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: ‘Ilẹ̀ ayé’ bá ìwọ̀n ọ̀rọ̀ láti Ábẹ́lì wá mu, ṣùgbọ́n àṣàyàn ‘ilẹ̀’ nìkan wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: láti ẹ̀jẹ̀ Ábẹ́lì olódodo
  rationale: Ó pa ìtumọ̀ genitive àti orúkọ àpèjúwe ‘olódodo’ mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: títí dé ẹ̀jẹ̀ Sekaráyà ọmọ Berekáyà
  rationale: ‘Láti ... títí dé’ jẹ́ ọ̀nà Yorùbá àdánidá fún ἀπό ... ἕως, a sì kọ orúkọ méjèèjì gẹ́gẹ́ bí Gíríìkì ṣe ní wọn.
- source_word: ὃν ἐφονεύσατε
  choice: ẹni tí ẹ̀yin pa
  rationale: ‘Pa’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún pípa ènìyàn; lílo ‘ẹ̀yin’ fi ìtẹnumọ́ olùṣe tí ó wà nínú fọ́ọ̀mù ọ̀rọ̀-ìṣe Gíríìkì hàn.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: láàárín ibi mímọ́ àti pẹpẹ ìrúbọ
  rationale: ‘Ibi mímọ́’ tọ́ka sí apá tẹ́ńpìlì náà gan-an dípò gbogbo àgbègbè rẹ̀; ‘pẹpẹ ìrúbọ’ sọ iṣẹ́ θυσιαστήριον di mímọ̀ ní Yorùbá.
theological_decisions:
- issue: Ta ni Sekaráyà ọmọ Berekáyà?
  choice: A pa ‘Sekaráyà ọmọ Berekáyà’ mọ́ gẹ́gẹ́ bí ó ṣe wà nínú ọ̀rọ̀ Gíríìkì, láìṣe àtúnṣe tàbí ìbáramu.
  alternative: Àwọn kan dá a mọ̀ mọ́ Sekaráyà wòlíì; àwọn mìíràn dá a mọ̀ mọ́ Sekaráyà ọmọ Jehoiada, wọ́n sì ka ‘ọmọ Berekáyà’ sí ìṣòro nínú àkọsílẹ̀ tàbí àṣà ìtàn.
  rationale: Ìtumọ̀ gbọ́dọ̀ tẹ̀ lé ẹ̀rí ọ̀rọ̀ Gíríìkì, kí ó sì fi àríyànjiyàn ìdánimọ̀ náà sílẹ̀ láìyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn síbi tí ó bá yẹ; a yàgò fún èdè ìjọ kan pàtó àti fún ṣíṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ sínú ọ̀rọ̀ náà.
