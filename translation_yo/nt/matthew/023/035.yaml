- from: kí gbogbo ẹ̀jẹ̀ olódodo tí a ń ta sílẹ̀ lórí ilẹ̀ ayé[a] lè wá sórí yín, láti ẹ̀jẹ̀ Ábẹ́lì olódodo títí dé ẹ̀jẹ̀ Sekaráyà ọmọ Berekáyà[b], ẹni tí ẹ̀yin pa láàárín ibi mímọ́ àti pẹpẹ ìrúbọ.
  to: kí gbogbo ẹ̀jẹ̀ àwọn olódodo tí a ń ta sílẹ̀ lórí ilẹ̀ ayé[a] lè wá sórí yín, láti ẹ̀jẹ̀ Ábẹ́lì olódodo títí dé ẹ̀jẹ̀ Sekaráyà ọmọ Berekáyà[b], ẹni tí ẹ̀yin pa láàárín ibi mímọ́ àti pẹpẹ ìrúbọ.
  rationale: The revision makes the Greek metonym for innocent/righteous blood explicit in idiomatic Yorùbá, while retaining the source’s aspect, accusation, range, and unresolved historical identification. The two footnotes are adjusted only for lexical precision and natural Standard Yorùbá usage.
