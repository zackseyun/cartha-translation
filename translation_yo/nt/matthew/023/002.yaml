  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: yo
  text: Ó wí pé, “Àwọn akọ̀wé àti àwọn Farisí ti jókòó sórí ìjókòó Mósè.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn akọ̀wé àti àwọn Farisí ń jókòó lórí ìjókòó Mósè.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “ti jókòó,” ṣùgbọ́n nínú àyíká yìí ó tún lè tọ́ka sí gbígba ipò àṣẹ olùkọ́ tí a so mọ́ Mósè.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: Ó wí pé
  rationale: Ọ̀rọ̀ aláìṣe yìí ń so ọ̀rọ̀ Jésù mọ́ ẹsẹ tó ṣáájú; lílo gbólóhùn aláṣe jẹ́ ọ̀nà àdánidá ní Yorùbá láti bẹ̀rẹ̀ ọ̀rọ̀ tí a fa yọ.
- source_word: Μωϋσέως καθέδρας
  choice: ìjókòó Mósè
  rationale: Ó pa àwòrán ìjókòó mọ́, nígbà tí ó tún lè tọ́ka sí ipò àṣẹ Mósè gẹ́gẹ́ bí olùkọ́.
- source_word: ἐκάθισαν
  choice: ti jókòó sí
  rationale: Ó fi ìṣe tí ó ti ṣẹlẹ̀ hàn láìfi ọ̀rọ̀ arọ́pò-orúkọ afarahẹ tí kò sí ní Gíríìkì kún un; ó sì tún lè túmọ̀ sí gbígba ipò àṣẹ kan.
- source_word: οἱ γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ẹgbẹ́ àwọn amòye nínú Òfin tí wọ́n ń kọ́ni, láìfẹ̀ sí ìtumọ̀ tó gbòòrò ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ náà ni a kọ ní ìbámu pẹ̀lú bí a ṣe ń pè é ní Yorùbá.
theological_decisions:
- issue: Bóyá ἐκάθισαν túmọ̀ sí jíjókòó lásán tàbí gbígba ipò àṣẹ fún ara wọn
  choice: ti jókòó sí
  alternative: ń jókòó lórí; ti fi ara wọn jókòó sí ipò
  rationale: Àṣàyàn yìí pa ìtumọ̀ ìpilẹ̀ ti jíjókòó mọ́, ó sì ṣí ọ̀nà sí ìtumọ̀ gbígba ipò àṣẹ, láìsọ ní pàtó pé wọ́n fi ara wọn sí ipò náà nígbà tí ọ̀rọ̀ afarahẹ kò sí nínú Gíríìkì.
translation_notes:
  register: Yorùbá tó bójú mu, tó lọ́wọ́lọ́wọ́, tí ó sì ní iyì ni a lò. “Ìjókòó Mósè” pa àkàwé orísun mọ́; àlàyé ìsàlẹ̀ ojú ewé sì pa àìdánilójú inú ἐκάθισαν mọ́.
