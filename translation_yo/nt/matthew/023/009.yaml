id: MAT.23.9
reference: Matthew 23:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: yo
  text: Ẹ má sì pe ẹnikẹ́ni lórí ilẹ̀ ayé ní baba yín[a], nítorí Baba yín kan ṣoṣo ni ẹni tí ń bẹ ní ọ̀run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má sì pe ẹnikẹ́ni ní baba yín lórí ilẹ̀ ayé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí Baba yín kan ṣoṣo ni Baba ọ̀run,” tàbí “nítorí Baba yín kan ṣoṣo ni ẹni tí ó wà ní ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: baba
  rationale: Ó túmọ̀ ọ̀rọ̀ oyè tàbí ìfi-orúkọ-pè ní tààrà, ó sì pa ìbáramu mọ́ pẹ̀lú “Baba” nínú gbólóhùn kejì; a kò fi àlàyé kún un pé ó jẹ́ baba nípa ìbí.
- source_word: μὴ καλέσητε
  choice: Ẹ má … pe
  rationale: Ìṣètò aorist subjunctive pẹ̀lú μή jẹ́ àṣẹ ìdènà. “Ẹ má … pe” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára àṣẹ náà mọ́.
- source_word: ὑμῶν
  choice: yín
  rationale: Arọ́pò-orúkọ genitive náà jẹ́ ohun-ìní ní Yorùbá, “baba yín” àti “Baba yín.”
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó fi ibi tàbí àgbègbè ayé hàn, ó sì dúró ní ìtakora pẹ̀lú Ẹni ọ̀run.
- source_word: εἷς
  choice: ẹnì kan ṣoṣo
  rationale: Nínú Yorùbá, “ẹnì kan” lè túmọ̀ sí “someone”; fífi “ṣoṣo” kún un mú ìtumọ̀ pé ẹni kan ṣoṣo ṣe kedere, gẹ́gẹ́ bí àyíká ọ̀rọ̀ Gíríìkì ṣe ń béèrè.
- source_word: ὑμῶν ὁ πατήρ
  choice: Baba yín
  rationale: Ó pa ìbáṣepọ̀ ara ẹni tí ὑμῶν fi hàn mọ́, pẹ̀lú lẹ́tà ńlá láti tọ́ka sí Baba ọ̀run.
- source_word: ὁ οὐράνιος
  choice: Ẹni ọ̀run
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ. “Ẹni ọ̀run” pa ìrísí tí a samisi yìí mọ́ láì yí i padà sí gbólóhùn ìbùgbé pé “ẹni tí ó wà ní ọ̀run.”
theological_decisions:
- issue: Ìwọ̀n àṣẹ ìdènà Jésù
  choice: A pa àṣẹ náà mọ́ ní ọ̀nà tààrà pé kí wọ́n má pe ẹnikẹ́ni lórí ilẹ̀ ayé ní baba wọn.
  alternative: Láti túmọ̀ ọ́ gẹ́gẹ́ bí ìdènà gbogbo lílo ọ̀rọ̀ “baba” fún ènìyàn, tàbí láti rọ àṣẹ náà nítorí pé a kà á sí àsọdùn.
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìdènà líle, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ pinnu bí ó ṣe kan baba nípa ìbí, ìbáṣepọ̀ àwùjọ, tàbí oyè ẹ̀sìn. Ọ̀rọ̀ tààrà náà jẹ́ kí àyíká pinnu, ó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó ní àmì ohùn kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “Ẹ” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, kì í ṣe àmì ọlá fún ẹni kan. Àmì [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì ní ibi tí àlàyé ìsàlẹ̀-ojú-ewé wọn kan.
