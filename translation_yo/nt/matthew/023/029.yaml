id: MAT.23.29
reference: Matthew 23:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: yo
  text: “Ègbé ni fún yín, ẹ̀yin akọ̀wé àti Farisí, ẹ̀yin alágàbàgebè, nítorí ẹ ń kọ́ àwọn ibojì àwọn wòlíì, ẹ sì ń fi ọ̀ṣọ́ ṣe àwọn ibi ìrántí àwọn olódodo[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ibojì ìrántí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ibi ìrántí tàbí ibojì; níhìn-ín a túmọ̀ rẹ̀ sí “ibi ìrántí” láti yà á sọ́tọ̀ sí “ibojì” tó wà ní apá àkọ́kọ́ ẹsẹ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àwọn wòlíì mọ́; ó lágbára ju ọ̀rọ̀ ìbànújẹ́ lásán lọ, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: γραμματεῖς
  choice: akọ̀wé
  rationale: Orúkọ tí a ti mọ̀ fún àwọn amòye òfin Júù ni; ‘olùkọ́ òfin’ yóò túmọ̀ iṣẹ́ wọn sí i ju bí ọ̀rọ̀ Gíríìkì ṣe sọ lọ.
- source_word: Φαρισαῖοι
  choice: Farisí
  rationale: Àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní ìbámu pẹ̀lú bí a ṣe ń pè é ní Yorùbá.
- source_word: ὑποκριταί
  choice: alágàbàgebè
  rationale: Ó sọ ìhùwàsí ẹni tí ó ń díbọ́n nípa ìwà àti ẹ̀sìn ní èdè Yorùbá àdánidá.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi hàn gbangba pé ohun tó tẹ̀ lé e ni ìdí fún ìkéde ègbé náà.
- source_word: οἰκοδομεῖτε
  choice: ẹ ń kọ́
  rationale: Ó pa ìṣe tí wọ́n ń ṣe mọ́ láìfi kún un pé wọ́n ń tún ohun àtijọ́ kọ́.
- source_word: τάφους
  choice: àwọn ibojì
  rationale: Ó bá ibi ìsìnkú tí a kọ́ mu, ó sì yàtọ̀ sí μνημεῖα ní apá kejì.
- source_word: προφητῶν
  choice: àwọn wòlíì
  rationale: Ó fi ìbáṣepọ̀ ohun-ìní hàn nínú gbólóhùn ‘àwọn ibojì àwọn wòlíì.’
- source_word: κοσμεῖτε
  choice: ẹ sì ń ṣe ... lọ́ṣọ̀ọ́
  rationale: Ìtumọ̀ Yorùbá àdánidá ni fún ṣíṣe ohun kan ní ẹwà tàbí fífi ọ̀ṣọ́ sí i.
- source_word: μνημεῖα
  choice: àwọn ibi ìrántí
  rationale: Ó pa ìtumọ̀ ohun tí ń rántí ẹni tí ó kú mọ́, ó sì yà á sọ́tọ̀ kúrò nínú τάφους (‘ibojì’) tí ó ṣáájú, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè túmọ̀ sí ibojì.
- source_word: δικαίων
  choice: àwọn olódodo
  rationale: Ó túmọ̀ ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tí wọ́n jẹ́ olódodo, láìgbé ẹ̀kọ́ ìsìn mìíràn wọ inú ẹsẹ náà.
theological_decisions:
- issue: Ìtumọ̀ δικαίων ní ọ̀rọ̀ Mátíù yìí
  choice: àwọn olódodo
  alternative: àwọn ẹni ìdájọ́ òdodo
  rationale: ‘Àwọn olódodo’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn ènìyàn tí wọ́n dúró ṣinṣin níwà rere; kò fi ẹ̀kọ́ Pọ́ọ̀lù tàbí ìtumọ̀ ẹ̀sìn pàtó kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì yé gbogbo ènìyàn ni a lò. Àmì ohùn wà níbi tí ó bá yẹ. Ìkéde ‘Ègbé ni fún yín’ pa ìró ìdájọ́ wòlíì mọ́, nígbà tí ìtòlẹ́sẹẹsẹ pẹ̀lú ‘nítorí’ so ìdí ìdálẹ́bi náà mọ́ ọ ní gbólóhùn kan.
