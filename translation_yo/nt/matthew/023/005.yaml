id: MAT.23.5
reference: Matthew 23:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo iṣẹ́ wọn ni wọ́n ń ṣe kí àwọn ènìyàn lè rí wọn; nítorí wọ́n ń mú àwọn àpótí Ìwé Mímọ́[a] wọn gbòòrò sí i, wọ́n sì ń mú àwọn ìṣù etí aṣọ[b] wọn tóbi sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn wọ̀nyí jẹ́ àpò awọ kéékèèké tí ó ní àwọn apá Ìwé Mímọ́ nínú, tí àwọn Júù kan máa ń wọ gẹ́gẹ́ bí ìgbọràn sí àwọn ẹsẹ bí Diutarónómì 6:8.
    reason: cultural_note
  - marker: b
    text: Tàbí, “àwọn fọ́nrán etí aṣọ.” Wo Númérì 15:38–39 nípa àwọn ìṣù tí a máa ń so mọ́ aṣọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ τὰ ἔργα αὐτῶν
  choice: Ṣùgbọ́n gbogbo iṣẹ́ wọn
  rationale: “Gbogbo iṣẹ́ wọn” ṣàfihàn ìkójọpọ̀ gbogbo ohun tí wọ́n ń ṣe, δὲ sì ní agbára ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú, nítorí náà “Ṣùgbọ́n” bá àyíká mu.
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: ni wọ́n ń ṣe kí àwọn ènìyàn lè rí wọn
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ète tí ìkọ̀lé πρὸς τὸ pẹ̀lú infinitive ń fi hàn mọ́. “Àwọn ènìyàn” kò fi ìtumọ̀ náà mọ́ ọkùnrin nìkan.
- source_word: φυλακτήρια
  choice: àwọn àpótí ẹsẹ Bíbélì
  rationale: Ọ̀rọ̀ àlàyé yìí yé òǹkàwé Yorùbá òde òní ju yíya ọ̀rọ̀ “phylacteries” wọlé lọ, ó sì tọ́ka sí àwọn àpò awọ kéékèèké tí ó ní àwọn ẹsẹ Ìwé Mímọ́ nínú.
- source_word: πλατύνουσι
  choice: ń mú ... fẹ̀
  rationale: Ó túmọ̀ sí mímú ohun gbòòrò tàbí fífẹ̀ sí i; ìṣe “mú ... fẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: κράσπεδα
  choice: àwọn ìṣù òwú etí aṣọ
  rationale: Nínú àyíká Júù yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ìṣù òwú tàbí fọ́nrán tí a so mọ́ etí aṣọ, kì í ṣe etí aṣọ lásán.
- source_word: μεγαλύνουσι
  choice: ń mú ... tóbi
  rationale: Ó pa ìtumọ̀ mímú ohun tóbi sí i mọ́ láì pinnu bóyá gígùn tàbí fífẹ̀ rẹ̀ ni a ń tẹnumọ́.
theological_decisions:
- issue: Bí a ṣe máa darúkọ àwọn ohun ìsìn Júù láì sọ wọ́n di ohun búburú fúnra wọn
  choice: Lo “àwọn àpótí ẹsẹ Bíbélì” àti “àwọn ìṣù òwú etí aṣọ,” kí àlàyé ìṣe wọn sì wà ní àkọsílẹ̀ ìsàlẹ̀.
  alternative: Yá ọ̀rọ̀ ilẹ̀ òkèèrè wọlé fún φυλακτήρια, tàbí pe κράσπεδα ní “etí aṣọ” lásán.
  rationale: Ẹsẹ náà ń bá fífi ìṣe ìsìn ṣe àṣehàn wí, kì í ṣe pé àwọn ohun tí Òfin sọ nípa wọn jẹ́ ohun búburú. Ìtumọ̀ náà ṣọ́ra kí ó má ṣe gbé ẹ̀kọ́ tàbí ẹ̀gàn mìíràn wọlé.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá, a sì yan àwọn ọ̀rọ̀ àlàyé fún àwọn ohun àṣà Júù tí ọ̀pọ̀ òǹkàwé lè má mọ̀.
