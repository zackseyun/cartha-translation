id: MAT.23.33
reference: Matthew 23:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: yo
  text: Ẹ̀yin ejò, ọmọ paramọ́lẹ̀! Báwo ni ẹ̀yin yóò ṣe bọ́ lọ́wọ́ ìdájọ́ Gẹhẹ́nà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ìdájọ́ ọ̀run àpáàdì.” Ní èdè Gíríìkì: “Gẹhẹ́nà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄφεις
  choice: ejò
  rationale: Ọ̀rọ̀ yìí jẹ́ ìpè tààrà tí ó fi ejò ṣe àpèjúwe wọn; “ejò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa agbára ẹ̀gàn náà mọ́.
- source_word: γεννήματα
  choice: ọmọ
  rationale: Ó túmọ̀ sí ohun tí a bí tàbí irú-ọmọ; nínú gbólóhùn “ọmọ paramọ́lẹ̀,” ó ṣe kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἐχιδνῶν
  choice: paramọ́lẹ̀
  rationale: Ó tọ́ka sí irú ejò olóró kan, kì í ṣe ejò lápapọ̀; “paramọ́lẹ̀” pa ìyàtọ̀ àti agbára àwòrán náà mọ́.
- source_word: πῶς
  choice: Báwo ni ... yóò ṣe
  rationale: Ìbéèrè àsọyé ni, tí ó ń béèrè nípa ọ̀nà tàbí ìrètí àsálà, láì fi kún un pé kò ṣeé ṣe rárá.
- source_word: φύγητε
  choice: bọ́ lọ́wọ́
  rationale: Ní ìbámu pẹ̀lú “ìdájọ́,” ọ̀rọ̀ Yorùbá yìí túmọ̀ sí yíyọ tàbí àsálà kúrò lábẹ́ ohun tí ń bọ̀.
- source_word: κρίσεως
  choice: ìdájọ́
  rationale: Ó pa ìtumọ̀ ìṣe ìdájọ́ tàbí àbájáde rẹ̀ mọ́, láì túmọ̀ ọ́ ní pàtó sí ìdálẹ́bi.
- source_word: γεέννης
  choice: Gẹhẹ́nà
  rationale: A pa orúkọ Gíríìkì náà mọ́ nítorí ìtàn Júù àti ìtumọ̀ ọjọ́ ìkẹyìn tí ó ní, dípò fífi gbogbo èrò tí ó lè bá “ọ̀run àpáàdì” lọ kún un.
theological_decisions:
- issue: Ìtumọ̀ γέεννα
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: “Gẹhẹ́nà” pa pàtó ọ̀rọ̀ orísun àti àyíká Júù rẹ̀ mọ́. Àlàyé ìsàlẹ̀ fúnni ní ọ̀rọ̀ Yorùbá tí ọ̀pọ̀ ènìyàn mọ̀, láì jẹ́ kí ó rọ́pò ọ̀rọ̀ pàtó inú ẹsẹ̀.
- issue: Agbára ìbéèrè πῶς φύγητε
  choice: Báwo ni ẹ̀yin yóò ṣe bọ́ lọ́wọ́ ...?
  alternative: Ṣé ẹ̀yin lè bọ́ lọ́wọ́ ...?
  rationale: Èyí pa ìbéèrè “báwo” àti ìtọ́kasí ọjọ́ iwájú mọ́, láì sọ ní tààrà pé àsálà kò ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀yin” láti fi hàn pé ẹni púpọ̀ ni Jesu ń bá sọ̀rọ̀, a sì pa líle ọ̀rọ̀ ìkìlọ̀ náà mọ́.
