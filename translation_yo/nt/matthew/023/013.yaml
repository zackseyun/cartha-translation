id: MAT.23.13
reference: Matthew 23:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: yo
  text: “Ṣùgbọ́n ègbé ni fún yín, ẹ̀yin akọ̀wé àti Farisí, ẹ̀yin alágàbàgebè! Nítorí ẹ̀yin ń ti ìjọba ọ̀run[a] pa níwájú àwọn ènìyàn; ẹ̀yin fúnra yín kò wọlé, bẹ́ẹ̀ ni ẹ̀yin kò sì jẹ́ kí àwọn tí ń wọlé wọlé.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìjọba àwọn ọ̀run.” Mátíù máa ń lo gbólóhùn yìí níbi tí àwọn àyíká mìíràn ti lè sọ pé “ìjọba Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn tí ń gbìyànjú láti wọlé.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn tí wíwọlé wọn ń lọ lọ́wọ́ tàbí àwọn tí ń wá ọ̀nà láti wọlé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àwọn wòlíì mọ́ ju ọ̀rọ̀ ìbànújẹ́ lásán lọ, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré àti ìtẹ̀síwájú nínú àwọn ọ̀rọ̀ ègbé hàn.
- source_word: γραμματεῖς
  choice: akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ ìbílẹ̀ tí ó bá orúkọ ẹgbẹ́ àwọn amòfin àti olùkọ́ Ìwé Mímọ́ ní àyíká Ìhìn Rere mu, láì ṣe àlàyé iṣẹ́ wọn sínú ọ̀rọ̀ náà.
- source_word: Φαρισαῖοι
  choice: Farisí
  rationale: Àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní Yorùbá.
- source_word: ὑποκριταί
  choice: alágàbàgebè
  rationale: Ó sọ ìhùwàsí ẹni tí ìfarahàn ẹ̀sìn rẹ̀ kò bá òtítọ́ inú rẹ̀ mu.
- source_word: κλείετε
  choice: ń ti ... pa mọ́
  rationale: Ó pa àwòrán dídènà ọ̀nà wọlé mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tó sì yẹ fún gbólóhùn pàtàkì Mátíù láì dá ìyàtọ̀ ẹ̀kọ́ kan sílẹ̀ láàárín rẹ̀ àti ‘ìjọba Ọlọ́run.’
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: pa mọ́ àwọn ènìyàn
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘ti ... pa,’ ó sọ pé wọ́n dí ọ̀nà sí ìjọba náà lọ́wọ́ àwọn ènìyàn; èyí jẹ́ Yorùbá àdánidá fún àwòrán Gíríìkì.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: εἰσέρχεσθε
  choice: wọlé
  rationale: Ó bá àwòrán wíwọ inú ìjọba mu ní ṣókí.
- source_word: τοὺς εἰσερχομένους
  choice: àwọn tí ń wọlé
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ nínú present participle mọ́, láì pinnu pé ìgbìyànjú lásán ni.
- source_word: ἀφίετε ... εἰσελθεῖν
  choice: jẹ́ kí ... wọlé
  rationale: Ó túmọ̀ ìyọ̀ǹda tàbí fífàyè gba ní Yorùbá àdánidá, ó sì pa ọ̀rọ̀-ìṣe ìkẹyìn εἰσελθεῖν hàn.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία τῶν οὐρανῶν nínú Mátíù
  choice: ìjọba ọ̀run
  alternative: ìjọba àwọn ọ̀run
  rationale: ‘Ìjọba ọ̀run’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ gbólóhùn Mátíù mọ́ láì fi ẹ̀kọ́ ìyàtọ̀ kan kún un.
- issue: Ìtumọ̀ τοὺς εἰσερχομένους
  choice: àwọn tí ń wọlé
  alternative: àwọn tí ń gbìyànjú láti wọlé
  rationale: Present participle lè tọ́ka sí àwọn tí wíwọlé wọn ń lọ lọ́wọ́ tàbí àwọn tí ń wá ọ̀nà láti wọlé; ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú náà mọ́ dáadáa.
- issue: Àwọn tí ἀνθρώπων tọ́ka sí
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ìtọ́kasí náà jẹ́ ti gbogbo ènìyàn, kì í ṣe ti akọ nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà ní iyì àti agbára ọ̀rọ̀ ìdájọ́, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. Àtúnsọ ‘wọlé ... wọlé’ ni a pa mọ́ nítorí ó fara mọ́ àtúnsọ Gíríìkì, ó sì jẹ́ ohun àdánidá ní Yorùbá.
