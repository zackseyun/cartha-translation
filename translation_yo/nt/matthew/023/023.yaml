- from: '“Ègbé ni fún yín, ẹ̀yin akọ̀wé àti Farisí, ẹ̀yin alágàbàgebè! Nítorí ẹ ń san ìdámẹ́wàá lórí míńtì, díìlì àti kúmínì, ṣùgbọ́n ẹ ti kọ àwọn ohun tó ṣe pàtàkì jù lọ nínú Òfin sílẹ̀: ìdájọ́ òdodo, àánú àti ìgbàgbọ́[a]. Àwọn wọ̀nyí ni ó yẹ kí ẹ ṣe, láì kọ àwọn ìyókù sílẹ̀.”'
  to: '“Ègbé ni fún yín, ẹ̀yin akọ̀wé àti Farisí, ẹ̀yin alágàbàgebè! Nítorí ẹ ń san ìdámẹ́wàá lórí míńtì, díìlì àti kúmínì, àti ẹ ti fi àwọn ohun tó ṣe pàtàkì jù lọ nínú Òfin sílẹ̀: ìdájọ́ òdodo, àánú àti ìgbàgbọ́[a]. Àwọn wọ̀nyí ni ó yẹ kí ẹ ṣe, láìfi àwọn ìyókù sílẹ̀.”'
  rationale: A rọ́pò ‘ṣùgbọ́n’ pẹ̀lú ‘àti’ láti fara mọ́ καί nínú ọ̀rọ̀ orísun. A tún ṣe ìparí gbolohun náà ní ‘láìfi ... sílẹ̀’ fún Yorùbá tó rọrùn, a sì mú àlàyé ìsàlẹ̀ πίστις kedere síi nípa fífi ‘ìdúróṣinṣin’ kún un. Àwọn àtúnṣe wọ̀nyí kò yí ìtumọ̀ ẹsẹ̀ náà padà.
