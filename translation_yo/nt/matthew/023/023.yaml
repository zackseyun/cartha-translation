  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbòò: ìkéde ‘Ègbé,’ sísan ìdámẹ́wàá àwọn ewébẹ̀, àti mẹ́tẹ̀ẹ̀ta àwọn ohun pàtàkì nínú Òfin ni a gbé kalẹ̀ ní tòótọ́. Ṣùgbọ́n καί tí ó so àwọn gbólóhùn méjèèjì pọ̀ jẹ́ ‘àti,’ kì í ṣe ‘ṣùgbọ́n’; ìyàtọ̀ tó wà nínú ọ̀rọ̀ náà ti hàn tán nínú ‘ẹ ti fi ... sílẹ̀.’'
