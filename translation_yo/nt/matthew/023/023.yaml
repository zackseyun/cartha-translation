  terminology: ‘Akọ̀wé,’ ‘Farisí,’ ‘Òfin,’ ‘ìdájọ́ òdodo,’ àti ‘àánú’ bá àyíká Bíbélì mu. A pa ‘ìgbàgbọ́’ mọ́ gẹ́gẹ́ bí ìtumọ̀ pàtàkì fún πίστις, a sì tún fi ìtumọ̀ ‘ìṣòtítọ́’/ìdúróṣinṣin hàn nínú àlàyé ìsàlẹ̀ láìfi ìtumọ̀ kan ṣoṣo di dandan.
