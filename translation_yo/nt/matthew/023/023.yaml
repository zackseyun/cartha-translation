id: MAT.23.23
reference: Matthew 23:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: yo
  text: '“Ègbé ni fún yín, ẹ̀yin akọ̀wé àti Farisí, ẹ̀yin alágàbàgebè! Nítorí ẹ ń san ìdámẹ́wàá lórí míńtì, díìlì àti kúmínì, àti ẹ ti fi àwọn ohun tó ṣe pàtàkì jù lọ nínú Òfin sílẹ̀: ìdájọ́ òdodo, àánú àti ìgbàgbọ́[a]. Àwọn wọ̀nyí ni ó yẹ kí ẹ ṣe, láìfi àwọn ìyókù sílẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣòtítọ́” tàbí “ìdúróṣinṣin.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìdúróṣinṣin; nínú àyíká ìwà rere yìí, ọ̀pọ̀ ènìyàn ló lóye rẹ̀ sí ìṣòtítọ́ sí májẹ̀mú.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìkìlọ̀ àti ìdájọ́ àwọn wòlíì mọ́ ju ọ̀rọ̀ ìbànújẹ́ lásán lọ.
- source_word: γραμματεῖς
  choice: akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a ti mọ̀ dáadáa fún àwọn amòfin àti olùkọ́ Òfin nínú àyíká àwọn Ìhìn Rere.
- source_word: ὑποκριταί
  choice: alágàbàgebè
  rationale: Ó sọ ìtumọ̀ ìwà ẹni tó ń díbọ́n di ẹni rere ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἀποδεκατοῦτε
  choice: ẹ ń san ìdámẹ́wàá
  rationale: Ó ṣàlàyé fífi ìdá kan nínú mẹ́wàá fúnni, ó sì pa ìtumọ̀ ẹ̀sìn àti ti Òfin mọ́.
- source_word: ἡδύοσμον, ἄνηθον, κύμινον
  choice: míńtì, díìlì àti kúmínì
  rationale: Àwọn orúkọ ewébẹ̀ àti èròjà olóòórùn wọ̀nyí ni a kọ ní ìró Yorùbá, nítorí kò sí orúkọ Yorùbá kan ṣoṣo tí gbogbo ènìyàn fohùn ṣọ̀kan lé lórí wọn.
- source_word: ἀφήκατε
  choice: ẹ ti kọ ... sílẹ̀
  rationale: Ó fi hàn pé wọ́n fi àwọn ojúṣe pàtàkì náà sí ẹ̀gbẹ́ tàbí ṣàìṣe wọn.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: àwọn ohun tó ṣe pàtàkì jù lọ nínú Òfin
  rationale: Ó mú àfiwé βαρύτερα jáde gẹ́gẹ́ bí ohun tó ní ìjẹ́pàtàkì púpọ̀, ní Yorùbá tó ṣe kedere.
- source_word: κρίσιν
  choice: ìdájọ́ òdodo
  rationale: Nínú àkójọpọ̀ ìwà rere yìí, ọ̀rọ̀ náà ń tọ́ka sí ṣíṣe ohun tó tọ́ àti dídájọ́ láìṣègbè, kì í ṣe ìdájọ́ lásán.
- source_word: ἔλεος
  choice: àánú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún mercy, ó sì bá àyíká ìwà àti májẹ̀mú mu.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Ó pa ìtumọ̀ faith mọ́ nínú àkọsílẹ̀ pàtàkì, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘ìṣòtítọ́’ tí àyíká ìwà rere lè gbà hàn.
theological_decisions:
- issue: Ìtumọ̀ πίστιν nínú àkójọpọ̀ ìdájọ́ òdodo, àánú àti πίστις
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: πίστις lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́. Àkọsílẹ̀ pàtàkì lo ‘ìgbàgbọ́’ láìfi ẹ̀kọ́ ìsìn kan pàtó lé e lórí; àlàyé ìsàlẹ̀ sì pa ìtumọ̀ ìṣòtítọ́ mọ́ nítorí àyíká ìwà àti májẹ̀mú.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ọlọ́wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Òfin’ gẹ́gẹ́ bí orúkọ fún Òfin Mósè, a sì gbe àmì àlàyé [a] sí ‘ìgbàgbọ́,’ ibi tí àṣàyàn ìtumọ̀ náà wà.
