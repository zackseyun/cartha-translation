  to: Nítorí náà, gbogbo ohun tí wọ́n bá sọ fún yín, ẹ ṣe é, kí ẹ sì pa á mọ́; ṣùgbọ́n ẹ má ṣe ní ìbámu pẹ̀lú ìṣe wọn[a], nítorí wọ́n ń sọ, wọ́n kò sì ń ṣe.
  rationale: A tún gbolóhùn àárín náà ṣe sí “ẹ má ṣe ní ìbámu pẹ̀lú ìṣe wọn” kí ó lè jẹ́ Yorùbá tó pé, kí ó sì fara mọ́ ìtumọ̀ κατά (“ní ìbámu pẹ̀lú/gẹ́gẹ́ bí àwòṣe”) àti ἔργα (“ìṣe”). A tún fi àmì ohùn tó yẹ sí “wọ́n” nínú gbolóhùn ìkẹyìn. Kò sí ìtumọ̀ ẹ̀kọ́ ìsìn tàbí àlàyé àfikún tí a fi kún ẹsẹ náà.
