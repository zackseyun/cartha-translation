id: MAT.23.3
reference: Matthew 23:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: yo
  text: Nítorí náà, gbogbo ohun tí wọ́n bá sọ fún yín, ẹ ṣe é, kí ẹ sì pa á mọ́; ṣùgbọ́n ẹ má ṣe ní ìbámu pẹ̀lú ìṣe wọn[a], nítorí wọ́n ń sọ, wọ́n kò sì ń ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe hùwà bí wọ́n ṣe ń hùwà.”
    reason: Àṣàyàn yìí sọ ìtumọ̀ κατὰ τὰ ἔργα αὐτῶν ní Yorùbá tó rọrùn sí i, ṣùgbọ́n kò pa ọ̀rọ̀ “ìṣe” mọ́ ní tààràtà.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Nítorí náà, gbogbo ohun tí ... bá
  rationale: “Gbogbo ohun tí ... bá” fi agbára gbólóhùn àkópọ̀ náà hàn ní Yorùbá àdánidá, “Nítorí náà” sì túmọ̀ οὖν gẹ́gẹ́ bí ìyọrísí ohun tí a ti sọ ṣáájú.
- source_word: εἴπωσιν ὑμῖν
  choice: wọ́n bá sọ fún yín
  rationale: “Sọ fún yín” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ọ̀rọ̀ tí a darí sí àwọn olùgbọ́ hàn, láìfi ìtumọ̀ “kọ́ yín” kún un.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: ẹ ṣe é, kí ẹ sì pa á mọ́
  rationale: 'A ya àwọn ọ̀rọ̀-ìṣe méjèèjì sọ́tọ̀: “ṣe” ń béèrè ìmúṣẹ, “pa ... mọ́” sì ń fi ìtẹ̀síwájú nínú pípa ohun tí a sọ mọ́ hàn.'
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: ṣùgbọ́n ẹ má ṣe gẹ́gẹ́ bí ìṣe wọn
  rationale: “Gẹ́gẹ́ bí” pa ìtumọ̀ ìbámu tàbí àwòṣe inú κατά mọ́; “ìṣe wọn” sì jẹ́ ọ̀nà Yorùbá tó bójú mu fún ἔργα ní àyíká tí ó ń sọ̀rọ̀ nípa ìwà àti ohun tí ènìyàn ń ṣe.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: nítorí wọ́n ń sọ, wọn kò sì ń ṣe
  rationale: Ìtumọ̀ yìí pa ìtakora ṣókí àti àtúnlò “ṣe” mọ́, láìfi ohun tí wọn ń sọ tàbí ṣe kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Bóyá kí a sọ ní pàtó pé ọ̀rọ̀ náà ń tọ́ka sí àṣẹ àwọn akọ̀wé àti Farisí láti kọ́ni
  choice: A fi ẹni tí “wọ́n” ń tọ́ka sí sílẹ̀ fún àyíká ẹsẹ tó ṣáájú láti ṣàlàyé rẹ̀.
  alternative: Kí a túmọ̀ ọ́ sí “gbogbo ohun tí wọ́n bá kọ́ yín” tàbí kí a fi “lórí ìjókòó Mósè” kún un.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò tún àwọn àlàyé wọ̀nyẹn sọ; fífi wọ́n kún un lè dín àìsọ pàtó inú ọ̀rọ̀ orísun kù.
- issue: Bóyá kí a yí àtúnlò ποιέω padà sí onírúurú ọ̀rọ̀ Yorùbá
  choice: A pa àtúnlò “ṣe” mọ́ ní àwọn apá pàtàkì.
  alternative: Lílo àwọn ọ̀rọ̀ bí “mú ṣẹ,” “hùwà,” tàbí “ṣe àfarawé” ní gbogbo ibi.
  rationale: Àtúnlò ọ̀rọ̀-ìṣe náà mú ìtakora láàárín ohun tí wọ́n sọ àti ohun tí wọ́n ṣe lágbára, ó sì jẹ́ apá pàtàkì ti ọ̀nà tí ọ̀rọ̀ Gíríìkì gbà fi àgàbàgebè wọn hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. Àmì ohùn wà níbi tí ó yẹ; ọ̀rọ̀ náà jẹ́ kedere fún òǹkàwé lasán, ó sì pa ìtẹnumọ́ àti àtúnlò inú orísun mọ́.
