id: MAT.23.20
reference: Matthew 23:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: yo
  text: Nítorí náà, ẹni tí ó bá fi pẹpẹ búra, ó fi pẹpẹ náà àti gbogbo ohun tí ó wà lórí rẹ̀ búra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Nítorí náà, ẹni tí ó bá fi ... búra
  rationale: “Nítorí náà” fi ìtumọ̀ ìparí èrò οὖν hàn. Àkójọpọ̀ “ẹni tí ó bá ...” túmọ̀ participle oní-artíkù náà gẹ́gẹ́ bí òfin gbogbogbò, ní Yorùbá àdánidá.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: fi pẹpẹ búra
  rationale: Nínú ọ̀rọ̀ ìbúra, ἐν jẹ́ àfihàn ohun tí a fi búra; “fi ... búra” ni ọ̀nà Yorùbá tó ṣe kedere, θυσιαστήριον sì ni “pẹpẹ.”
- source_word: ὀμνύει
  choice: ó ... búra
  rationale: Ìṣe àkókò ìsinsìnyí yìí sọ òtítọ́ gbogbogbò; “búra” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì pa àtúnṣe ọ̀rọ̀ náà mọ́.
- source_word: ἐν αὐτῷ
  choice: fi pẹpẹ náà ... búra
  rationale: Dípò arọ́pò-orúkọ tí ó lè ṣókùnkùn, a tún “pẹpẹ náà” sọ láti mú ẹni tí αὐτῷ ń tọ́ka sí ṣe kedere, láì yí ìtumọ̀ padà.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: àti gbogbo ohun tí ó wà lórí rẹ̀
  rationale: Gbólóhùn náà gbòòrò ju ẹ̀bùn kan ṣoṣo lọ. “Gbogbo ohun tí ó wà lórí rẹ̀” pa ìwọ̀n gbígbòòrò yẹn mọ́, ó sì bá àyíká pẹpẹ mu.
theological_decisions:
- issue: Ohun tí “gbogbo ohun tí ó wà lórí rẹ̀” ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí gbogbo ohun tí ó wà lórí pẹpẹ, láì sọ pé ẹbọ tàbí ẹ̀bùn nìkan ni.
  alternative: gbogbo ohun tí ó wà lókè rẹ̀; gbogbo àwọn ẹbọ tí ó wà lórí rẹ̀
  rationale: Àyíká ẹsẹ 18–19 mẹ́nu kan ẹ̀bùn lórí pẹpẹ, ṣùgbọ́n èdè Gíríìkì níbí gbòòrò sí i. Ìtumọ̀ náà kò gbọdọ̀ dín ọ̀rọ̀ náà kù ju ohun tí orísun sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Kò sí àlàyé ẹ̀sìn ẹgbẹ́ kan tí a fi kún un.
