    rationale: Kì í yí ìtumọ̀ ẹsẹ̀ padà, ṣùgbọ́n lílo ẹni kejì nínú àlàyé náà (‘ẹ̀rí yín ń dá yín ... lẹ́bi’) jẹ́ kedere, ó sì bá ọ̀rọ̀ ẹsẹ̀ mu.
  - severity: low
    issue: ‘Jẹ́rìí fún ara yín’ nínú àṣàyàn ìsàlẹ̀ lè dà bí ìjẹ́rìí ní ojú rere fún ara ẹni.
    rationale: Dátífù ἑαυτοῖς lè jẹ́ ‘sí/nípa ara yín’ ní Yorùbá láìkó ìmọ̀lára ‘ní ipò ara yín’ tí ‘fún’ lè ní. ‘Jẹ́rìí sí ara yín’ dá ambiguity Gíríìkì náà sílẹ̀ dáadáa.
