  source_fidelity: Ìtumọ̀ àkọ́kọ́ náà ń fi ìmọ̀lára àbájáde ti ὥστε, iṣẹ́ μαρτυρεῖτε, àti ìfi-ẹ̀sùn ara ẹni tí àyíká ń mú wá hàn dáadáa. ‘Ọmọ àwọn tí ó pa àwọn wòlíì ni yín’ pa ìbátan ìdílé àti ìfarajọ ìwà mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa, ó sì dáa fún ìforígbárí Jesu nínú àyíká yìí. A tún ọ̀rọ̀ inú àlàyé ìsàlẹ̀ ṣe díẹ̀ kí ó máa tọ́ka sí àwọn tí a ń bá sọ̀rọ̀ gan-an (‘ẹ̀rí yín ... yín’), kì í ṣe ‘wọn’.
  terminology: ‘Jẹ́rìí,’ ‘ọmọ,’ àti ‘àwọn wòlíì’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu, tó sì dá lórí ìlò Yorùbá òde òní. A ṣe àtúnṣe àṣàyàn inú àlàyé ìsàlẹ̀ sí ‘jẹ́rìí sí ara yín,’ nítorí èyí sún mọ́ datífù Gíríìkì ‘to/about yourselves’ ju ‘fún ara yín’ lọ, nígbà tí ìtumọ̀ àkọ́kọ́ ṣì ń fi agbára àyíká hàn.
  issues:
