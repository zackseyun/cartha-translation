id: MAT.23.31
reference: Matthew 23:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin ń jẹ́rìí lòdì sí ara yín pé ọmọ àwọn tí ó pa àwọn wòlíì ni yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin ń jẹ́rìí sí ara yín.” Èyí sún mọ́ ọ̀nà tí ọ̀rọ̀ Gíríìkì gbà sọ ọ́ ní tààrà, ṣùgbọ́n nínú àyíká yìí, ẹ̀rí yín ń dá yín fúnra yín lẹ́bi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó ń fi àbájáde tàbí ìparí ọ̀rọ̀ tí ó ṣáájú hàn; gbólóhùn yìí jẹ́ àdánidá, ó sì ní agbára ìtumọ̀ náà ní Yorùbá.
- source_word: μαρτυρεῖτε ἑαυτοῖς
  choice: ẹ̀yin ń jẹ́rìí lòdì sí ara yín
  rationale: ‘Jẹ́rìí’ túmọ̀ μαρτυρεῖτε ní kedere. Bó tilẹ̀ jẹ́ pé ἑαυτοῖς lè túmọ̀ ní tààrà sí ‘fún ara yín,’ àyíká ọ̀rọ̀ fi hàn pé ẹ̀rí wọn ń dá wọn lẹ́bi; ‘lòdì sí ara yín’ mú agbára ọ̀rọ̀ náà jáde láìfi àṣàyàn gidi pamọ́, èyí tí àlàyé ìsàlẹ̀ sọ.
- source_word: ὅτι
  choice: pé
  rationale: Ó bẹ̀rẹ̀ àkóónú ẹ̀rí náà, kì í ṣe gbólóhùn ìdí.
- source_word: υἱοί
  choice: ọmọ
  rationale: ‘Ọmọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbátan ọmọ pẹ̀lú àwọn baba rẹ̀, ó sì lè gbé ìtumọ̀ ìran àti ìfarajọ ìwà papọ̀. Yorùbá kì í sábà fi akọ tàbí abo hàn nínú ọ̀rọ̀ yìí, nítorí náà kò yẹ kí a fi ‘ọmọkùnrin’ mú ìtumọ̀ náà le ju bí ó ṣe rí nínú lílo àdánidá lọ.
- source_word: τῶν φονευσάντων
  choice: àwọn tí ó pa
  rationale: ‘Pa’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún pípa ènìyàn; àyíká ọ̀rọ̀ àwọn wòlíì mú ìwà búburú àti àìṣòdodo inú ìṣe náà hàn.
- source_word: τοὺς προφήτας
  choice: àwọn wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ẹgbẹ́ àwọn ońṣẹ́ Ọlọ́run náà.
theological_decisions:
- issue: Bí a ṣe yẹ kí υἱοί fi ìbátan ìran àti ìfarajọ ìwà hàn.
  choice: ọmọ àwọn tí ó pa àwọn wòlíì
  alternative: àwọn àrọ́mọdọ́mọ àwọn tí ó pa àwọn wòlíì
  rationale: ‘Ọmọ’ pa àwòrán ìdílé àti agbára àsọyé Gíríìkì mọ́, ó sì lè tọ́ka sí ìran gidi àti sí ìdúró papọ̀ nínú irú ìwà kan náà. ‘Àrọ́mọdọ́mọ’ yóò tẹ ìran gidi mọ́lẹ̀ ju àwòrán ọmọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá àdánidá mu. A lo ‘ẹ̀yin’ àti ‘yín’ láti mú ọ̀pọ̀ ènìyàn inú ọ̀rọ̀ Gíríìkì hàn, àti ọ̀rọ̀ tí ó ní iyì ṣùgbọ́n tí òǹkàwé òde òní lè lóye.
