  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó tóbi jù láàárín yín yóò jẹ́ ìránṣẹ́ yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni tí ó tóbi ju àwọn yòókù nínú yín lọ yóò jẹ́ ìránṣẹ́ yín.” Ọ̀rọ̀ ìfiwéra Gíríìkì náà lè tọ́ka sí ẹni tó ní ipò gíga jù lọ nínú ẹgbẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζων
  choice: ẹni tí ó tóbi jù
  rationale: Ọ̀rọ̀ ìfiwéra Gíríìkì náà lè ṣiṣẹ́ bí ọ̀rọ̀ tó ń fi ẹni tó ga jù lọ nínú ẹgbẹ́ hàn; gbolohun Yorùbá yìí jẹ́ adayébá, ó sì pa ìtumọ̀ ipò àti ọlá mọ́.
- source_word: ὑμῶν (àkọ́kọ́)
  choice: láàárín yín
  rationale: Ó fi hàn pé ẹni náà wà nínú ẹgbẹ́ àwọn tí a ń bá sọ̀rọ̀, kì í ṣe pé ó kan jẹ́ tiwọn.
- source_word: ἔσται
  choice: yóò jẹ́
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tó ṣe kedere fún ọ̀rọ̀ ọjọ́ iwájú.
- source_word: ὑμῶν (ìkejì)
  choice: yín
  rationale: Ó fi ìbáṣepọ̀ ẹni tó ń ṣe iṣẹ́ fún wọn hàn lọ́nà adayébá nínú ‘ìránṣẹ́ yín.’
- source_word: διάκονος
  choice: ìránṣẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí ẹni tó ń sin àwọn ẹlòmíràn, kì í ṣe oyè tàbí ipò pàtó nínú ìjọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó wà láàárín fífẹ́ ipò ọlá àti jíjẹ́ ìránṣẹ́ hàn.
theological_decisions:
- issue: Ọ̀rọ̀ ipò nínú ẹ̀kọ́ Jésù nípa títóbi àti iṣẹ́ ìsìn
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìyípadà ìlànà ipò: ẹni tó tóbi jù láàárín wọn yóò jẹ́ ìránṣẹ́ wọn.'
  alternative: Ẹni tí ó tóbi ju yín lọ yóò jẹ́ òjíṣẹ́ yín.
  rationale: Èyí pa ìkọ́ni pé títóbi tòótọ́ ń farahàn nínú sísin àwọn ẹlòmíràn mọ́, láìfi ìtumọ̀ oyè ìjọ tí ó wá lẹ́yìn náà kún un.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó níyì; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ìránṣẹ́’ yẹra fún ìtumọ̀ oyè ìjọ, ‘ẹni tí ó tóbi jù’ sì jẹ́ ọ̀nà adayébá láti sọ ìtumọ̀ superlative-like ti μείζων.
