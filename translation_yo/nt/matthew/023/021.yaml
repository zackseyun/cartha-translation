language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá fi tẹ́ńpìlì búra, ẹni náà ń fi tẹ́ńpìlì náà àti Ẹni tí ń gbé inú rẹ̀ búra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘búra nínú tẹ́ńpìlì ... búra nínú rẹ̀’; ní ti gidi, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘nínú,’ ṣùgbọ́n nínú ọ̀nà ìbúra níbí, ó ní ìtumọ̀ ‘fi ... búra.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: Ẹnikẹ́ni tí ó bá ... búra
  rationale: Ọ̀rọ̀ ìṣe aláṣepọ̀ tí ó ní atíkùlù yìí ń tọ́ka sí ẹnikẹ́ni lápapọ̀; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, kò sì fi akọ tàbí abo kún un.
- source_word: ἐν τῷ ναῷ
  choice: fi tẹ́ńpìlì búra
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν sábà túmọ̀ sí ‘nínú,’ nínú ọ̀nà ìbúra yìí ó ń tọ́ka sí ohun tí a fi ń búra; ‘fi ... búra’ ni ọ̀nà Yorùbá tó bá èyí mu.
- source_word: ναῷ
  choice: tẹ́ńpìlì
  rationale: ναός ń tọ́ka sí tẹ́ńpìlì tàbí ibi mímọ́ inú rẹ̀. ‘Tẹ́ńpìlì’ ṣe kedere sí òǹkàwé Yorùbá, ó sì bá àyíká ọ̀rọ̀ nípa tẹ́ńpìlì Jerúsálẹ́mù mu.
- source_word: ὀμνύει
  choice: ó ... búra
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí sọ òfin tàbí ìlànà gbogbogbò; gbolóhùn Yorùbá yìí mú agbára yẹn jáde ní ṣókí.
- source_word: ἐν αὐτῷ
  choice: fi tẹ́ńpìlì náà ... búra
  rationale: A tún orúkọ náà sọ dípò arọ́pò-orúkọ ‘rẹ̀’ láti yẹra fún àìṣedéédé ní Yorùbá, kí ó sì hàn gbangba pé tẹ́ńpìlì ni a ń tọ́ka sí.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Ẹni tí ń gbé inú rẹ̀
  rationale: Ọ̀rọ̀ ìṣe aláṣepọ̀ àsìkò ìsinsìnyí fi Ẹni náà hàn gẹ́gẹ́ bí ẹni tí ń gbé inú tẹ́ńpìlì. ‘Ẹni’ tí a kọ ní lẹ́tà ńlá fi hàn pé Ọlọ́run ni àyíká ọ̀rọ̀ ń tọ́ka sí, láìfi orúkọ tí kò sí nínú Gíríìkì kún un.
- source_word: αὐτόν
  choice: inú rẹ̀
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí ναός, ìyẹn tẹ́ńpìlì; ‘inú rẹ̀’ ni ọ̀nà Yorùbá àdánidá láti sọ pé Ẹni náà ń gbé inú tẹ́ńpìlì.
theological_decisions:
- issue: Ta ni Ẹni tí ń gbé inú tẹ́ńpìlì?
  choice: A lo ‘Ẹni’ pẹ̀lú lẹ́tà ńlá láti fi Ọlọ́run hàn.
  alternative: ‘ẹni tí ń gbé inú rẹ̀’ pẹ̀lú lẹ́tà kékeré, kí ìtọ́kasí náà má ṣe ṣe kedere tó bẹ́ẹ̀.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Jésù ń sọ nípa Ọlọ́run, ẹni tí wíwà rẹ̀ ní tẹ́ńpìlì mú kí ìbúra náà kan án. Lẹ́tà ńlá jẹ́ àmì ìkọ̀wé nìkan; kò fi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. A yan ‘fi ... búra’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ìbúra, a sì pa àwòrán pé Ọlọ́run ń gbé inú tẹ́ńpìlì mọ́.
