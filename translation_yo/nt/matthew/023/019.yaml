source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: yo
  text: 'Ẹ̀yin afọ́jú, nítorí èwo ni ó tóbi jù: ẹ̀bùn náà[a], tàbí pẹpẹ tí ń sọ ẹ̀bùn náà di mímọ́[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun ìrúbọ” dípò “ẹ̀bùn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ń jẹ́ kí ẹ̀bùn náà di mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Ẹ̀yin afọ́jú
  rationale: Ajẹtífù ọ̀pọ̀ tí a lò gẹ́gẹ́ bí orúkọ nínú ìpè tààrà ni; ọ̀rọ̀ yìí pa ìbáwí náà mọ́ láìfi ‘aṣiwèrè’ kún un, nítorí ọ̀rọ̀ bẹ́ẹ̀ kò sí nínú ẹsẹ yìí.
- source_word: τί γὰρ μεῖζον
  choice: nítorí èwo ni ó tóbi jù
  rationale: ‘Èwo’ fi ìbéèrè àfiwé hàn, ‘nítorí’ sì pa ipa ìṣàlàyé γάρ mọ́. ‘Tóbi jù’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ μεῖζον láìyí i sí ‘ó ṣe pàtàkì jù.’
- source_word: τὸ δῶρον
  choice: ẹ̀bùn náà
  rationale: Ẹ̀bùn ni ìtumọ̀ ìpìlẹ̀ δῶρον; nínú àyíká tẹ́ńpìlì ó tún lè túmọ̀ sí ohun tí a fi rúbọ, èyí tí àlàyé ìsàlẹ̀ ojú ewé tọ́ka sí.
- source_word: θυσιαστήριον
  choice: pẹpẹ
  rationale: ‘Pẹpẹ’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ibi ìrúbọ, ó sì bá àyíká ìjọsìn tẹ́ńpìlì mu.
- source_word: τὸ ἁγιάζον
  choice: tí ń sọ … di mímọ́
  rationale: Ìtumọ̀ yìí jẹ́ kedere sí òǹkàwé Yorùbá, ó sì pa ìṣe ìsọdimímọ́ tí ἁγιάζω ń sọ̀rọ̀ rẹ̀ mọ́; ‘ń’ tún fi ìṣe ànímọ́ pẹpẹ náà hàn.
theological_decisions:
- issue: Èdè ìjọsìn ti ἁγιάζω nípa ìbáṣepọ̀ pẹpẹ àti ẹ̀bùn
  choice: pẹpẹ tí ń sọ ẹ̀bùn náà di mímọ́
  alternative: pẹpẹ tí ń yà ẹ̀bùn náà sí mímọ́
  rationale: Yíyan ‘sọ … di mímọ́’ pa ọgbọ́n inú àríyànjiyàn Jesu mọ́ pé pẹpẹ ni ó ń fún ẹ̀bùn náà ní ipò mímọ́, láìdín ọ̀rọ̀ náà kù sí àṣà ìsìn lásán.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn kíkún ni a lò. Ìpè ‘Ẹ̀yin afọ́jú’ jẹ́ ìbáwí tààrà ṣùgbọ́n kò fi ẹ̀gàn tí kò sí nínú Gíríìkì kún un. Gbólóhùn náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba.
