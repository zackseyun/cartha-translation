  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: yo
  text: Nígbà náà ni Jésù sọ̀rọ̀ fún àwọn ènìyàn àti àwọn ọmọ-ẹ̀yìn rẹ̀ pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó tọ́ka sí ìtẹ̀síwájú ìṣẹ̀lẹ̀ nínú ìtàn; ‘Nígbà náà’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Orúkọ ẹni ni; àpilẹ̀kọ Gíríìkì tí ó wà níwájú rẹ̀ kò nílò ìtumọ̀ lọ́tọ̀ ní Yorùbá.
- source_word: ἐλάλησεν
  choice: sọ̀rọ̀
  rationale: Ó pa ìtumọ̀ gbòòrò ti λαλέω mọ́ gẹ́gẹ́ bí ‘sọ̀rọ̀,’ láìfi èrò míì kún un.
- source_word: τοῖς ὄχλοις
  choice: fún àwọn ènìyàn
  rationale: ὄχλοι jẹ́ ọ̀pọ̀ ènìyàn tí ó péjọ; ‘àwọn ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì yàtọ̀ sí ẹgbẹ́ àwọn ọmọ-ẹ̀yìn tí a mẹ́nu kàn lẹ́yìn rẹ̀.
- source_word: καὶ
  choice: àti
  rationale: Àsopọ̀ tó rọrùn láàárín ẹgbẹ́ méjèèjì.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Àwọn ọmọ-ẹ̀yìn rẹ̀’ túmọ̀ ìbáṣepọ̀ olùkọ́ àti àwọn tí ń tẹ̀lé e ní ọ̀nà àdánidá ní Yorùbá.
