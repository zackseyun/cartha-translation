translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn. A fi ‘pé’ sí òpin láti ṣí ọ̀rọ̀ taara tí ẹsẹ tó tẹ̀ lé yóò gbé wọlé, bí ìlò Yorùbá ṣe sábà rí.
