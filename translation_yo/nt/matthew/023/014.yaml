id: MAT.23.14
reference: Matthew 23:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: yo
  text: “Ègbé ni fún yín,[a] ẹ̀yin akọ̀wé àti àwọn Farisí, ẹ̀yin alágàbàgebè! Nítorí ẹ ń jẹ ilé àwọn opó run, ẹ sì ń lo àdúrà gígùn gẹ́gẹ́ bí àwáwí; nítorí náà, ẹ ó gba ìdálẹ́bi tí ó le jù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì àtijọ́ jù lọ, títí kan Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin, bẹ́ẹ̀ ni kò sí nínú àwọn ìtumọ̀ Kọ́pítì àkọ́kọ́. Ṣùgbọ́n ó wà nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ ti ìbílẹ̀ Bísántíọ̀mù, àti nínú Látìn Àtijọ́, Vulgate, àti Síríákì. Ó ṣeé ṣe kí àwọn akọ̀wé ìgbà tó tẹ̀ lé e fi kún un láti mú un bá àwọn ọ̀rọ̀ tó jọ ọ́ ní Máàkù 12:40 àti Lúùkù 20:47 mu. Àwọn àfọwọ́kọ tó ní ẹsẹ yìí kò fohùn ṣọ̀kan nípa bóyá ó yẹ kí ó wà ṣáájú ẹsẹ 13 tàbí lẹ́yìn rẹ̀.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: ẹ ń jẹ ilé àwọn opó run
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘jẹ run’ ní àkàwé, ó sì fi hàn pé wọ́n ń fi ìkà rẹ́ àwọn opó jẹ, tí wọ́n sì ń ba ohun-ìní tàbí agbo ilé wọn jẹ́.
- source_word: προφάσει
  choice: láti fi bo ohun tí ẹ ń ṣe
  rationale: Ó sọ pé àdúrà gígùn wọn jẹ́ ọ̀nà láti bo ète búburú wọn mọ́lẹ̀, kì í ṣe ìfọkànsìn tòótọ́.
- source_word: περισσότερον
  choice: yóò pọ̀ sí i
  rationale: Ní ìbámu pẹ̀lú κρίμα, ó tọ́ka sí ìdálẹ́bi tàbí ìjìyà tí ó le ju ti ẹlòmíràn lọ.
- source_word: κρίμα
  choice: ìdálẹ́bi
  rationale: Nínú àyíká ọ̀rọ̀ yìí, kì í ṣe ìdájọ́ aláìdásí nìkan, bí kò ṣe ìdájọ́ tí ó dá wọn lẹ́bi.
- source_word: ὑποκριταί
  choice: alágàbàgebè
  rationale: Ọ̀rọ̀ Yorùbá yìí ṣàpèjúwe ẹni tí ìwà òde rẹ̀ kò bá ète inú rẹ̀ mu, ó sì yẹ fún ẹ̀sùn tí Jesu ń kàn wọ́n.
theological_decisions:
- issue: Ìwọ̀n ìdálẹ́bi tí περισσότερον κρίμα ń tọ́ka sí
  choice: ìdálẹ́bi tí ẹ ó gba yóò pọ̀ sí i
  alternative: ẹ ó gba ìdálẹ́bi tí ó le jù
  rationale: Ìtumọ̀ yìí pa èrò ìfiwéra inú Gíríìkì mọ́ láìsọ ní pàtó ẹni tàbí ìdálẹ́bi wo ni a fi wé e.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ègbé ni fún yín’ pa agbára ìkìlọ̀ Οὐαὶ mọ́; ‘ẹ ń jẹ ilé àwọn opó run’ sì jẹ́ àkàwé adayeba fún ìrẹ́jẹ ohun-ìní wọn. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn ìbẹ̀rẹ̀ láti jẹ́ kí olùkà rí ìṣòro àfọwọ́kọ lẹ́sẹ̀kẹsẹ̀.
