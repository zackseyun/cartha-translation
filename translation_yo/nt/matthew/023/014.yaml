  source_fidelity: 'Ìtumọ̀ náà pa ìkìlọ̀ Οὐαί, ìrẹ́jẹ tí κατεσθίετε ń ṣàpẹẹrẹ, àti ìdájọ́ tó le jù nínú περισσότερον κρίμα mọ́ dáadáa. Ṣùgbọ́n «láti fi bo ohun tí ẹ ń ṣe» túmọ̀ πρόφασις ní ọ̀nà tó sọ ohun tí Gíríìkì kò sọ ní pàtó: pé wọ́n ń fi àwọn iṣẹ́ kan pàtó bo. Ọ̀rọ̀ náà sọ pé àdúrà gígùn náà jẹ́ àwáwí/pretext wọn.'
  naturalness: Yorùbá náà ní ìwọ̀n ìbáwọ̀ tó yẹ, ó sì ní àmì ohùn rere. «Ẹ ń lo àdúrà gígùn gẹ́gẹ́ bí àwáwí» jẹ́ ọ̀nà adayeba tí ó túmọ̀ πρόφασις ní tààrà, ju ìtumọ̀ tó wà nínú àpilẹ̀kọ lọ.
  terminology: «Àkọ̀wé», «Farisí», «alágàbàgebè», «ilẹ̀ àwọn opó», àti «ìdálẹ́bi» yẹ ní àyíká yìí. A ti yí gbolohun ìkẹyìn sí «ìdálẹ́bi tí ó le jù» láti mú ìfiwéra περισσότερον hàn kedere, dípò ìmọ̀ pé ìwọ̀n kan ń kan pọ̀ sí i.
