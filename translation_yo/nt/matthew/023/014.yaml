  - severity: low
    issue: «ìdálẹ́bi ... yóò pọ̀ sí i»
    rationale: Ó lè dà bí ìdálẹ́bi kan náà ń pọ̀ sí i, dípò ìdálẹ́bi/ìjìyà tí ó pọ̀ tàbí le jù ní ìfiwéra. «ìdálẹ́bi tí ó le jù» jẹ́ kedere sí i.
