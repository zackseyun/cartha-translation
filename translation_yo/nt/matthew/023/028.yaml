id: MAT.23.28
reference: Matthew 23:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, níta, ẹ ń farahàn lójú àwọn ènìyàn bí ẹni pé ẹ jẹ́ olódodo, ṣùgbọ́n ní inú ẹ kún fún àgàbàgebè àti ìwà àìlófin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ gẹ́gẹ́
  rationale: Ó so ẹsẹ yìí mọ́ àfiwé ibojì tí a kùn ní funfun nínú ẹsẹ tó ṣáájú, ó sì mú ìtumọ̀ ‘ní ọ̀nà kan náà’ jáde ní Yorùbá àdánidá.
- source_word: ἔξωθεν
  choice: farahàn
  rationale: Ní ìṣọ̀kan pẹ̀lú φαίνεσθε, ‘farahàn’ sọ bí wọ́n ṣe rí ní ìta sí àwọn olùwò, láìsọ pé wọ́n jẹ́ olódodo ní tòótọ́.
- source_word: φαίνεσθε
  choice: farahàn
  rationale: Ó tọ́ka sí ìrísí tàbí ojú tí wọ́n fi hàn sí àwọn ènìyàn, kì í ṣe ipò inú wọn ní tòótọ́.
- source_word: τοῖς ἀνθρώποις
  choice: lójú àwọn ènìyàn
  rationale: Dátífù náà túmọ̀ sí bí àwọn ènìyàn ṣe ń rí wọn; ‘lójú àwọn ènìyàn’ jẹ́ ọ̀nà Yorùbá àdánidá tó sì ní ìtumọ̀ gbogbo ènìyàn.
- source_word: δίκαιοι
  choice: olódodo
  rationale: Ó pa agbára ìtumọ̀ ìwà àti ẹ̀sìn mọ́, ṣùgbọ́n ọ̀rọ̀ ‘farahàn’ fi hàn pé òdodo náà jẹ́ ti ojú ènìyàn nìkan.
- source_word: ἔσωθεν
  choice: nínú
  rationale: Ó dojú kọ ìrísí òde, ó sì tọ́ka sí òtítọ́ inú wọn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: μεστοὶ
  choice: kún fún
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, àdánidá fún jíjẹ́ pé ohun kan pọ̀ dé inú ẹni.
- source_word: ὑποκρίσεως
  choice: àgàbàgebè
  rationale: Ọ̀rọ̀ Yorùbá yìí mú ìwà ẹ̀tàn tó ń fi ìrísí rere bo òtítọ́ inú ẹni jáde dáadáa.
- source_word: ἀνομίας
  choice: àìbòfinmu
  rationale: Ó pa ìtumọ̀ àìgbọ́ràn sí òfin mọ́, dípò kí a sọ ọ́ di ìwà búburú lápapọ̀.
theological_decisions:
- issue: Bóyá δίκαιοι ń sọ pé wọ́n jẹ́ olódodo ní tòótọ́ tàbí pé wọ́n kàn farahàn bẹ́ẹ̀
  choice: Wọ́n kàn farahàn ní olódodo lójú àwọn ènìyàn
  alternative: Wọ́n jẹ́ olódodo ní tòótọ́
  rationale: φαίνεσθε àti ìyàtọ̀ tó wà láàárín òde àti inú fi hàn pé Jésù ń tú ìrísí èké wọn síta, kì í ṣe pé ó ń fìdí òdodo gidi wọn múlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A kò fi àmì àlàyé sí τοῖς ἀνθρώποις nítorí ‘àwọn ènìyàn’ ti jẹ́ ọ̀rọ̀ àpapọ̀ tí kò ní àìyedè akọ-nìkan ní Yorùbá.
