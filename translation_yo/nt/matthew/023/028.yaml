revisions:
- from: Bẹ́ẹ̀ gẹ́gẹ́, ẹ̀yin pẹ̀lú farahàn ní olódodo lójú àwọn ènìyàn, ṣùgbọ́n nínú, ẹ̀yin kún fún àgàbàgebè àti àìbòfinmu.
  to: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, níta, ẹ ń farahàn lójú àwọn ènìyàn bí ẹni pé ẹ jẹ́ olódodo, ṣùgbọ́n ní inú ẹ kún fún àgàbàgebè àti ìwà àìlófin.
  rationale: The revision separates “níta” (ἔξωθεν) from “ẹ ń farahàn” (φαίνεσθε), retains “lójú àwọn ènìyàn” for the human observers, and makes the apparent—not actual—righteousness explicit without adding doctrinal interpretation. It also maintains the balanced contrast with “ní inú” and uses an idiomatic expression for lawlessness.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the verse’s central external/internal contrast, the merely apparent righteousness before human observers, and the paired charges of hypocrisy and lawlessness. However, it does not express ἔξωθεν distinctly: it merges it into farahàn, which is already needed for φαίνεσθε. The revised wording represents both elements explicitly.'
  naturalness: “Bẹ́ẹ̀ gẹ́gẹ́” is not idiomatic in this connective sense, and “farahàn ní olódodo” is awkward Yoruba. “Bẹ́ẹ̀ náà ni … níta, ẹ … farahàn … bí ẹni pé ẹ jẹ́ olódodo” is clear, natural Standard Yoruba and preserves the rhetorical force.
  terminology: “Àgàbàgebè” is an appropriate term for ὑποκρίσεως. “Ìwà àìlófin” is clearer and more idiomatic than “àìbòfinmu” for ἀνομίας, while retaining the sense of conduct contrary to law rather than reducing it to generic evil.
  issues:
  - severity: medium
    issue: The external adverb ἔξωθεν is not independently represented.
    rationale: The draft uses “farahàn” for both ἔξωθεν and φαίνεσθε. Since the Greek deliberately contrasts ἔξωθεν with ἔσωθεν, Yoruba should explicitly mark the outward aspect, e.g. “níta.”
  - severity: medium
    issue: The opening and predication are not fully idiomatic Yoruba.
    rationale: “Bẹ́ẹ̀ gẹ́gẹ́” and “farahàn ní olódodo” are unnatural. The revision supplies an idiomatic comparative connector and expresses apparent righteousness as “farahàn … bí ẹni pé ẹ jẹ́ olódodo.”
  - severity: low
    issue: “Àìbòfinmu” is less transparent than a standard conduct expression for lawlessness.
    rationale: “Ìwà àìlófin” naturally denotes lawless conduct and maintains the ethical force of ἀνομίας.
  revised_text: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, níta, ẹ ń farahàn lójú àwọn ènìyàn bí ẹni pé ẹ jẹ́ olódodo, ṣùgbọ́n ní inú ẹ kún fún àgàbàgebè àti ìwà àìlófin.
  revised_footnotes: []
  revision_rationale: The revision separates “níta” (ἔξωθεν) from “ẹ ń farahàn” (φαίνεσθε), retains “lójú àwọn ènìyàn” for the human observers, and makes the apparent—not actual—righteousness explicit without adding doctrinal interpretation. It also maintains the balanced contrast with “ní inú” and uses an idiomatic expression for lawlessness.
