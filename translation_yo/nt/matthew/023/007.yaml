source:
  edition: SBLGNT
  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: yo
  text: àti kí àwọn ènìyàn máa kí wọn ní àwọn ibi ọjà, kí àwọn ènìyàn sì máa pè wọ́n ní, ‘Rábì.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀσπασμοὺς
  choice: kí àwọn ènìyàn máa kí wọn tọ̀wọ̀tọ̀wọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìkíni, ṣùgbọ́n nínú àyíká yìí ó ń tọ́ka sí ìkíni ọlá tí wọ́n fẹ́ràn láti máa gbà; gbólóhùn yìí mú ìtumọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ní àwọn ibi ọjà
  rationale: Èyí fi ibi ìta gbangba tí ìkíni náà ti ń ṣẹlẹ̀ hàn, ó sì bá ọ̀pọ̀-orúkọ Gíríìkì mu.
- source_word: καλεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: kí àwọn ènìyàn sì máa pè wọ́n ní
  rationale: Èyí pa ìṣe aláìṣe taara Gíríìkì mọ́ ní ọ̀nà Yorùbá tó rọrùn; ἄνθρωποι níbí jẹ́ ‘àwọn ènìyàn,’ kì í ṣe dandan àwọn ọkùnrin nìkan.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A ṣe àfọwọkọ orúkọ oyè Semitic náà, níwọ̀n bí ọ̀rọ̀ inú ẹsẹ tó tẹ̀ lé e ti ń ṣàlàyé ipa rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ τῶν ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Nínú ọ̀rọ̀ yìí, ἄνθρωποι jẹ́ orúkọ àpapọ̀ fún ènìyàn; kò sí àmì nínú Gíríìkì pé akọ nìkan ni a ń tọ́ka sí.
- issue: Bóyá a ó túmọ̀ Ῥαββί tàbí kí a ṣe àfọwọkọ rẹ̀
  choice: Rábì
  alternative: Olùkọ́
  rationale: Àfọwọkọ náà pa orúkọ oyè pàtó àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àlàyé inú ẹsẹ 8 mọ́, láìfi ìtumọ̀ ẹ̀kọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye. A fi ‘tọ̀wọ̀tọ̀wọ̀’ hàn pé ìkíni ọlá ni àyíká ọ̀rọ̀ náà ń sọ̀rọ̀ nípa rẹ̀, kì í ṣe ìkíni lasán.
