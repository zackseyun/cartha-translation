id: MAT.23.18
reference: Matthew 23:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: yo
  text: Àti pé, “Ẹnikẹ́ni tí ó bá fi pẹpẹ búra, ìbúra náà kò kà sí nǹkan kan[a]; ṣùgbọ́n ẹnikẹ́ni tí ó bá fi ẹ̀bùn[b] tí ó wà lórí rẹ̀ búra, ó ní ojúṣe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, gẹ́gẹ́ bí ẹ̀kọ́ tí Jésù ń dá lẹ́bi, ìbúra tí a fi pẹpẹ búra “kò kà sí nǹkan kan,” ṣùgbọ́n wọ́n ka èyí tí a fi ẹ̀bùn tó wà lórí rẹ̀ búra sí ohun tó dè ẹni.
    reason: cultural_note
  - marker: b
    text: Tàbí “ohun ìrúbọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀bùn tí a mú wá fún Ọlọ́run ní tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Àti pé
  rationale: Ó ń tẹ̀ síwájú nínú àtòjọ àwọn ẹ̀kọ́ tí Jésù ń tọ́ka sí, ó sì mú ọ̀rọ̀ àyọlò tó tẹ̀ lé e wọlé lọ́nà àdánidá ní Yorùbá.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Ẹnikẹ́ni tí ó bá ... búra / ṣùgbọ́n ẹnikẹ́ni tí ó bá ... búra
  rationale: Ìlànà ὅς + ἄν pẹ̀lú aorist subjunctive ń sọ ipò gbogbogbò tí kò dá lórí ẹni kan pàtó; ‘ẹnikẹ́ni tí ó bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára yìí hàn.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: fi pẹpẹ búra
  rationale: Nínú ọ̀rọ̀ ìbúra, ἐν ń tọ́ka sí ohun tí a fi ṣe ìbúra; ‘fi ... búra’ ni ọ̀nà Yorùbá tó ṣe kedere.
- source_word: θυσιαστήριον
  choice: pẹpẹ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún pẹpẹ ìrúbọ ní àyíká tẹ́ńpìlì.
- source_word: οὐδέν ἐστιν
  choice: kò já mọ́ nǹkan kan
  rationale: Ó pa ìtumọ̀ pé irú ìbúra bẹ́ẹ̀ ‘kò níye’ tàbí ‘kò kà’ mọ́, ní ọ̀nà Yorùbá tó ṣeé lóye, láì sọ pé Jésù fúnra rẹ̀ fọwọ́ sí ìdájọ́ náà.
- source_word: ἐν τῷ δώρῳ
  choice: fi ẹ̀bùn búra
  rationale: δῶρον túmọ̀ ní tààrà sí ẹ̀bùn, ṣùgbọ́n ní àyíká tẹ́ńpìlì ó lè jẹ́ ohun tí a mú wá fún Ọlọ́run; àlàyé ẹsẹ̀ ìsàlẹ̀ pa àṣàyàn ‘ọrẹ’ mọ́.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: tí ó wà lórí rẹ̀
  rationale: Ó fi ipò ẹ̀bùn lórí pẹpẹ hàn kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ὀφείλει
  choice: ó ní ojúṣe
  rationale: Ó sọ pé ẹni náà wà lábẹ́ ojúṣe, ṣùgbọ́n kò fi ohun tí ó ní láti ṣe kún ọ̀rọ̀ Gíríìkì, nítorí orísun náà kò sọ ohun náà ní gbangba.
theological_decisions:
- issue: Ohun tí ojúṣe ìbúra náà kan, tí a kò sọ ní gbangba
  choice: ó ní ojúṣe
  alternative: ìbúra rẹ̀ dè é / ó ní láti mú ìbúra náà ṣẹ
  rationale: ὀφείλει kò ní ohun tí ó tẹ̀ lé e gẹ́gẹ́ bí àfojúsùn nínú Gíríìkì. Ìtumọ̀ yìí pa kúkúrú àti àìsọ ohun náà ní gbangba mọ́, bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé pípa ìbúra mọ́ ni a ń sọ.
- issue: Ta ni ó ń sọ pé ìbúra kan kò já mọ́ nǹkan kan
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ àyọlò tí Jésù ń dá lẹ́bi
  alternative: Kí a túmọ̀ ọ́ bí ìlànà tí Jésù fúnra rẹ̀ ń fọwọ́ sí
  rationale: Àyíká Mátíù 23 fi hàn pé Jésù ń fa ẹ̀kọ́ àwọn olùdarí ẹ̀sìn yọ láti bá a wí; àlàyé ẹsẹ̀ ìsàlẹ̀ ń dènà àìgbọ́ye láì fi àlàyé náà sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, pẹ̀lú èdè tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Kò já mọ́ nǹkan kan’ jẹ́ ọ̀rọ̀ àdánidá fún ohun tí a kò kà sí èyí tó ní agbára, ‘ó ní ojúṣe’ sì pa àfojúsùn ὀφείλει tí a kò sọ ní gbangba mọ́.
