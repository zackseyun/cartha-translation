  source_fidelity: 'Ìtumọ̀ náà fi ìtumọ̀ pàtàkì àwọn ọ̀rọ̀ Gíríìkì náà hàn dáadáa: ìbúra ẹni tí ó fi pẹpẹ búra ni a ka sí aláìní agbára, ní ìyàtọ̀ sí èyí tí a fi ẹ̀bùn tó wà lórí pẹpẹ búra. Ṣùgbọ́n ‘kò já mọ́ nǹkan kan’ kì í sọ ìtumọ̀ οὐδέν ἐστιν ní ìbámu pẹ̀lú àyíká yìí; ó lè túmọ̀ sí pé ohun kan ti yapa kúrò nínú ohun mìíràn. ‘Ìbúra náà kò kà sí nǹkan kan’ sọ pé ìbúra náà “kà sí asán” ní kedere, ó sì yẹ fún ọ̀rọ̀ àyọlò tí Jésù ń dá lẹ́bi.'
  naturalness: ‘Ẹnikẹ́ni tí ó bá fi ... búra’ àti ‘ó ní ojúṣe’ jẹ́ Yorùbá àdánidá, tí ó sì yẹ fún ìforúkọsílẹ̀ ìwé mímọ́ òde òní. Fífún ‘ìbúra náà’ ní gbólóhùn àkọ́kọ́ mú kí kókó ‘kò kà sí nǹkan kan’ ṣe kedere, nítorí bí a bá fi ‘ẹnikẹ́ni’ sílẹ̀ gẹ́gẹ́ bí kókó, ó lè dà bí ẹni náà ni kò níye.
  terminology: ‘Pẹpẹ’ yẹ fún θυσιαστήριον, ‘ẹ̀bùn’ sì yẹ fún δῶρον. Ṣùgbọ́n ‘ọrẹ’ kì í ṣe àfidípò tó bojúmu fún δῶρον ní Yorùbá nínú àyíká tẹ́ńpìlì; ó sábà ń túmọ̀ sí ẹni ọ̀rẹ́. ‘Ohun ìrúbọ’ ni àfidípò tó dára fún “offering,” pẹ̀lú àlàyé pé ẹ̀bùn ni a mú wá fún Ọlọ́run.
