source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin, ẹ má ṣe jẹ́ kí a pè yín ní ‘Rábì,’ nítorí ọ̀kan ni Olùkọ́ yín, gbogbo yín sì jẹ́ arákùnrin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Rábì’ jẹ́ oyè Júù tí ó ní ìtumọ̀ olùkọ́. A pa oyè náà mọ́ láti fi àyíká Júù hàn, kí a má sì dà á pọ̀ mọ́ ‘Olùkọ́’ tó wà lẹ́yìn náà.
    reason: lexical_alternative
  - marker: b
    text: ‘Arákùnrin’ túmọ̀ ọ̀pọ̀ akọ ἀδελφοί. Ní àyíká ọ̀rọ̀ yìí, ó lè tọ́ka sí gbogbo àwọn ọmọ-ẹ̀yìn ẹlẹgbẹ́ gẹ́gẹ́ bí ẹgbẹ́ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: kí a má ṣe pè yín
  rationale: Ìṣẹ̀dá ọ̀rọ̀ yìí fi ìfòfindè hàn ní èdè Yorùbá àdánidá, ó sì pa ohùn àìṣe tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: Ῥαββί
  choice: Rábì
  rationale: A ṣe àkọsílẹ̀ orúkọ oyè Júù náà bí ó ti ń dún, kí ipò ìtàn rẹ̀ má bàa sọnù, kí a má sì da a pọ̀ mọ́ διδάσκαλος tó tẹ̀ lé e.
- source_word: εἷς
  choice: kan ṣoṣo
  rationale: Ní Yorùbá, ‘kan ṣoṣo’ ń sọ ìjẹ́-ọ̀kan náà ní kedere àti ní àdánidá láìfi èrò mìíràn kún un.
- source_word: ὁ διδάσκαλος
  choice: olùkọ́ yín
  rationale: Àṣàyàn yìí mú ìbáṣepọ̀ tí ὑμῶν fi hàn jáde ní Yorùbá tó ṣe kedere.
- source_word: πάντες δὲ ὑμεῖς ἀδελφοί ἐστε
  choice: arákùnrin sì ni gbogbo yín
  rationale: Ó pa àpẹẹrẹ ìdílé àti ọ̀pọ̀ akọ ἀδελφοί mọ́, ó sì mú ìtẹnumọ́ ‘gbogbo yín’ jáde ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá Jésù ń fòfin de gbogbo lílo oyè fún ènìyàn pátápátá tàbí ó ń tako fífi oyè wá ipò gíga láàárín àwọn ọmọ-ẹ̀yìn
  choice: A pa ìfòfindè tààrà náà mọ́ láìfẹ̀ sí i ju ọ̀rọ̀ ẹsẹ náà lọ.
  alternative: Kí a túmọ̀ ọ́ bí ìfòfindè pátápátá lórí gbogbo oyè irú ‘Rábì,’ tàbí bí àtakò tó mọ sí ìfẹ́ ipò àwọn alágàbàgebè nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ìfòfindè àti ìdí rẹ̀, ṣùgbọ́n kò ṣàlàyé gbogbo bí a ṣe gbọdọ̀ lò ó lẹ́yìn náà; nítorí náà, ìtumọ̀ kò gbọdọ̀ yanju ìṣòro ẹ̀kọ́ ìgbàgbọ́ yìí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ‘Rábì’ mọ́ gẹ́gẹ́ bí oyè Júù; àmì ohùn ni a lò níbi tí ó bá yẹ.
