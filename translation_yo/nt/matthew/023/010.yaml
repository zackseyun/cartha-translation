source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: yo
  text: Ẹ má sì jẹ́ kí a pè yín ní olùtọ́nisọ́nà, nítorí Mèsáyà ni olùtọ́nisọ́nà yín kan ṣoṣo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Ẹ má sì ṣe
  rationale: Ó ń tẹ̀ síwájú láti inú àwọn ohun tí a kà léèwọ̀ ṣáájú; “sì” pa ìsopọ̀ náà mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: κληθῆτε
  choice: jẹ́ kí a máa pè yín ní
  rationale: Ìṣe aláìṣe náà tọ́ka sí gbígba oyè tàbí orúkọ ìpè; ọ̀rọ̀ yìí ṣe kedere pé àwọn ẹlòmíràn ni wọ́n ń fi oyè náà pè wọ́n.
- source_word: καθηγηταί / καθηγητὴς
  choice: olùtọ́nisọ́nà / olùtọ́nisọ́nà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tó ń darí tàbí tó ń kọ́ni. “Olùtọ́nisọ́nà” mú ìtumọ̀ ìdarí àti ìkọ́ni pọ̀, ó sì yàtọ̀ sí “olùkọ́” tí a lè lò fún διδάσκαλος ní àyíká ẹsẹ yìí.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàgbékalẹ̀ ìdí fún ohun tí a kà léèwọ̀.
- source_word: ὑμῶν ἐστιν εἷς
  choice: yín kan ṣoṣo ni
  rationale: Ìṣètò Yorùbá yìí pa ìní náà àti ìtẹnumọ́ pé ẹni kan ṣoṣo ni mọ́.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níbí, Χριστός jẹ́ oyè ẹni tí a ti fòróró yàn; “Mèsáyà” pa ìtumọ̀ àti àyíká ìrètí Júù mọ́, pẹ̀lú àṣàyàn “Kristi” nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àmì orúkọ ὁ fi hàn pé oyè ni ọ̀rọ̀ náà níbí. “Mèsáyà” mú iṣẹ́ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ àṣàyàn tí ó wọ́pọ̀ mọ́.
- issue: Ìtẹnumọ́ pé olùtọ́nisọ́nà kan ṣoṣo ni
  choice: olùtọ́nisọ́nà yín kan ṣoṣo ni
  alternative: olùtọ́nisọ́nà yín jẹ́ ọ̀kan
  rationale: Àṣàyàn náà jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ εἷς mọ́ láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú orísun.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye ni a lò. Ọ̀pọ̀ ènìyàn ni a ń bá sọ, nítorí náà a lo “Ẹ” àti “yín.” Gbólóhùn náà pa ìsopọ̀ μηδὲ mọ́ pẹ̀lú “sì,” ó sì yẹra fún lílo “olùkọ́” kí ìyàtọ̀ ọ̀rọ̀ yìí sí διδάσκαλος ní àwọn ẹsẹ tó sún mọ́ ọn má bàjẹ́.
