id: MAT.23.4
reference: Matthew 23:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: yo
  text: Wọ́n ń di àwọn ẹrù wúwo pọ̀, wọ́n sì ń gbé wọn lé èjìká àwọn ènìyàn[a]; ṣùgbọ́n àwọn fúnra wọn kò fẹ́ fi ìka wọn kan wọ́n rárá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ènìyàn lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: di … pọ̀
  rationale: Ó pa àwòrán dídì tàbí sísopọ̀ ẹrù mú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ní àyíká yìí.
- source_word: φορτία βαρέα
  choice: ẹrù wúwo
  rationale: Ó pa ìtumọ̀ ẹrù gidi àti àpẹẹrẹ àwọn ohun tó nira láti ru mú láì sọ ohun tí ẹrù náà dúró fún ní pàtó.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: gbé e lé èjìká
  rationale: Ó mú àwòrán ara tó wà nínú Gíríìkì jáde ní Yorùbá tó ṣe déédé.
- source_word: τῶν ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: ἄνθρωποι níbí ń tọ́ka sí ènìyàn lápapọ̀; ‘àwọn ènìyàn’ jẹ́ ìtumọ̀ Yorùbá tó pé, tó sì jẹ́ àdánidá.
- source_word: αὐτοὶ δὲ
  choice: ṣùgbọ́n àwọn fúnra wọn
  rationale: ‘Àwọn fúnra wọn’ pa ìtẹnumọ́ àti ìyàtọ̀ tó wà láàárín ohun tí wọ́n gbé lé àwọn ẹlòmíràn àti ohun tí àwọn kò fẹ́ ṣe mú.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: fi ìka wọn
  rationale: Ó tẹ̀ lé àwòrán ìka kan nínú Gíríìkì, èyí tó fi hàn pé wọn kò fẹ́ ṣe ìsapá tó kéré jù lọ pàápàá.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: kò fẹ́ … ṣí i
  rationale: ‘Kò fẹ́’ fi hàn pé àìfẹ́ ni, kì í ṣe àìlágbára; ‘ṣí i’ sì túmọ̀ κινῆσαι ní tààrà gẹ́gẹ́ bí mímú ohun kúrò ní ipò rẹ̀.
theological_decisions:
- issue: Bí a ó ṣe lóye ‘ẹrù’—gẹ́gẹ́ bí ohun gidi tàbí àpẹẹrẹ
  choice: Pa àwòrán ‘ẹrù wúwo’ mú láì ṣàlàyé ohun tí ó dúró fún.
  alternative: Túmọ̀ ọ́ ní tààrà sí àwọn òfin, àṣẹ ẹ̀sìn, tàbí ojúṣe tí wọ́n ń fi lé àwọn ènìyàn.
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí àwọn ojúṣe tí ó le, ṣùgbọ́n ẹsẹ̀ Gíríìkì fúnra rẹ̀ kò dárúkọ wọn. Pípa àpẹẹrẹ náà mú kò jẹ́ ká fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tóóró kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A pa àwòrán ẹrù, èjìká àti ìka mú. Ọ̀rọ̀ arọ́pò-orúkọ ẹyọ ‘e/i’ tọ́ka sí àkójọpọ̀ ‘ẹrù’ gẹ́gẹ́ bí ohun kan ní ìlò Yorùbá.
