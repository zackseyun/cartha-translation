review_pass:
  verdict: revise
  source_fidelity: Àwọn ìṣe Gíríìkì náà wà ní àkókò ìsinsìnyí, nítorí náà ‘wọ́n ń di … wọ́n sì ń gbé’ ń pa ìṣe tí wọ́n máa ń ṣe mọ́ ju ‘wọ́n a di’ lọ. ‘Ṣí i’ túmọ̀ sí ṣíṣí ohun, kì í sì ṣe κινῆσαι (‘mú/un un kúrò ní ipò; rọ̀’), nítorí náà ó nílò àtúnṣe. ‘Fi ìka wọn kan wọ́n’ jẹ́ ọ̀nà Yorùbá àdánidá tí ń gbé àwòrán ìsapá kékèké àti ìkọ̀ láti ràn lọ́wọ́ kalẹ̀, láì sọ irú ẹrù náà di ohun kan pàtó.
  naturalness: Àtúnṣe náà ń lò Yorùbá ìgbàlódé tó bójú mu. ‘Àwọn ẹrù wúwo’ ń bá ọ̀pọ̀ φορτία mu, ‘wọ́n’ sì ń tọ́ka kedere sí àwọn ẹrù náà. ‘Fi ìka wọn kan wọ́n rárá’ jẹ́ ìsọ̀rọ̀ Yorùbá tí ó rọrùn, tí ó sì ń fi ìtẹnumọ́ àìfẹ́ wọn hàn.
  terminology: ‘Ẹrù wúwo’ ń pa àwòrán φορτία βαρέα mọ́ láì fi ‘òfin’ tàbí ‘àṣẹ ẹ̀sìn’ kún un. ‘Àwọn ènìyàn’ jẹ́ ìtumọ̀ gbooro, tó yẹ, fún τῶν ἀνθρώπων; àlàyé ìsàlẹ̀ náà ń jẹ́ kó ṣe kedere pé kò ní ìtumọ̀ akọ-nìkan.
  issues:
