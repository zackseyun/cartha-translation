    issue: ‘ṣí i’
    rationale: Nínú Yorùbá, ‘ṣí i’ túmọ̀ sí ‘open it’; kò ṣàfihàn κινῆσαι, ìyẹn mímú àwọn ẹrù náà rọ̀ tàbí yípo.
  - severity: low
    issue: ‘Wọ́n a di … wọ́n sì gbé’
    rationale: Ó lè jẹ́ ìṣe ọjọ́ iwájú tàbí ìwà àṣà, ṣùgbọ́n ‘wọ́n ń di … wọ́n sì ń gbé’ ń fara mọ́ àkókò ìsinsìnyí Gíríìkì kedere.
  - severity: low
    issue: Ẹyọ ‘ẹrù’ àti ‘e/i’ fún φορτία
    rationale: Bó tilẹ̀ jẹ́ pé ẹrù lè jẹ́ ọ̀rọ̀ àkójọpọ̀, ọ̀pọ̀ ‘àwọn ẹrù’ àti ‘wọ́n’ ń pa ọ̀pọ̀ orúkọ àti arọ́pò-orúkọ nínú Gíríìkì mọ́ dáadáa.
