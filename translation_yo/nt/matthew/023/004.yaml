revisions:
- from: Wọ́n a di ẹrù wúwo pọ̀, wọ́n sì gbé e lé èjìká àwọn ènìyàn[a]; ṣùgbọ́n àwọn fúnra wọn kò fẹ́ fi ìka wọn ṣí i.
  to: Wọ́n ń di àwọn ẹrù wúwo pọ̀, wọ́n sì ń gbé wọn lé èjìká àwọn ènìyàn[a]; ṣùgbọ́n àwọn fúnra wọn kò fẹ́ fi ìka wọn kan wọ́n rárá.
  rationale: A tún ọ̀rọ̀ ìṣe náà ṣe sí ìsinsìnyí, a sì rọ́pò ‘ṣí i’ pẹ̀lú ọ̀rọ̀-ìsọ̀rọ̀ Yorùbá ‘fi ìka wọn kan wọ́n rárá.’ Èyí pa àwòrán pé wọn kò ní ṣe ìsapá kékèké láti ràn lọ́wọ́ mọ́, ó sì yẹra fún ìtumọ̀ ‘ṣí’ tí kò bá Gíríìkì mu. A tún fi ọ̀pọ̀ ‘àwọn ẹrù/wọ́n’ hàn gẹ́gẹ́ bí φορτία/αὐτά.
