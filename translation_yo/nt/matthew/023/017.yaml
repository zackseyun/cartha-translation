id: MAT.23.17
reference: Matthew 23:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: yo
  text: 'Ẹ̀yin aṣiwèrè àti afọ́jú, nítorí èwo ló tóbi jù: wúrà náà, tàbí tẹ́ńpìlì[a] tí ó sọ wúrà náà di mímọ́[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí tẹ́ńpìlì, ṣùgbọ́n ó lè tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì.
    reason: cultural_note
  - marker: b
    text: Tàbí, “tí ó ya wúrà náà sí mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροὶ
  choice: òmùgọ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ àpọ́nlé ọ̀pọ̀ ènìyàn nínú ìbáwí taara; “òmùgọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa agbára ìbáwí náà mọ́ láìdi èébú òde òní.
- source_word: τυφλοί
  choice: afọ́jú
  rationale: Ó tún jẹ́ àpọ́nlé ọ̀pọ̀ ènìyàn ní tààràtà. “Afọ́jú” bá àwòrán ti ojú ẹ̀mí tí àyíká ọ̀rọ̀ náà ń lò mu, láìfi ìtumọ̀ míì kún un.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Èwo ni ó pọ̀ ju
  rationale: τίς yan láàárín ohun méjì tí a dárúkọ; ìbéèrè Yorùbá “Èwo ni ...?” jẹ́ àdánidá. Ìtẹ̀síwájú ìrònú tí γάρ ń fi hàn wà nínú bí ìbéèrè náà ṣe tẹ̀ lé ìbáwí náà, láìfi “nítorí” tí kò ní dùn mọ́ etí sí i.
- source_word: ὁ χρυσὸς
  choice: wúrà náà
  rationale: Àfikún “náà” tọ́ka sí wúrà pàtó tí àríyànjiyàn nípa ìbúra náà ń sọ̀rọ̀ lé lórí.
- source_word: ὁ ναὸς
  choice: ibi mímọ́
  rationale: ναός níbí lè tọ́ka pàtó sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbègbè tẹ́ńpìlì. “Ibi mímọ́” jẹ́ Yorùbá tó ṣe kedere, tí àlàyé ẹsẹ̀ sì ń ṣàlàyé ìwọ̀n ìtumọ̀ rẹ̀.
- source_word: ὁ ἁγιάσας
  choice: tí ó sọ ... di mímọ́
  rationale: Gbólóhùn yìí pa ìtumọ̀ ẹ̀sìn àti ìjọsìn ti ἁγιάζω mọ́ ní Yorùbá àdánidá. Bí ó tilẹ̀ jẹ́ pé participle náà jẹ́ aorist, àyíká lè jẹ́ kí a lóye rẹ̀ gẹ́gẹ́ bí ohun tí ó ti sọ wúrà náà di mímọ́, láìpinnu pé ó jẹ́ ìṣe ẹ̀ẹ̀kan ṣoṣo.
- source_word: τὸν χρυσόν
  choice: wúrà náà
  rationale: Àtúnlò “wúrà náà” tẹ̀ lé Gíríìkì, ó sì pa ìfiwéra àti ìró àsọyé náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìjọsìn ἁγιάζω ní àyíká tẹ́ńpìlì
  choice: sọ ... di mímọ́
  alternative: yà ... sí mímọ́; sọ ... di ohun mímọ́
  rationale: “Sọ ... di mímọ́” fi hàn pé ibi mímọ́ náà ni ó fún wúrà ní ipò mímọ́, ṣùgbọ́n kò ṣàlàyé ọ̀nà tí èyí fi ṣẹlẹ̀ ju ohun tí orísun sọ lọ.
- issue: Ìtumọ̀ ναός
  choice: ibi mímọ́
  alternative: tẹ́ńpìlì
  rationale: Yíyan “ibi mímọ́” pa ìtọ́kasí tó ṣeé ṣe sí ilé mímọ́ tàbí sanctuary proper mọ́. Àkọ́silẹ̀ ẹsẹ̀ fi hàn pé ọ̀rọ̀ náà tún lè túmọ̀ sí tẹ́ńpìlì ní ọ̀nà gbígbòòrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìbáwí náà lágbára ṣùgbọ́n kò di èébú aláìlọ́lá; ìbéèrè àsọyé àti ìfiwéra ohun mímọ́ méjèèjì dúró ṣinṣin.
