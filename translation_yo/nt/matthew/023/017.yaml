    rationale: ‘Tẹ́ńpìlì’ jẹ́ kedere, àmọ́ àkọsílẹ̀ náà ń dáàbò bo ìtumọ̀ tó ṣeé ṣe, ‘ibi mímọ́ inú tẹ́ńpìlì,’ fún ναός.
