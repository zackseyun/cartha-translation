  source_fidelity: Ìtumọ̀ náà gba ètò ìbéèrè ìfiwéra náà, àtúnlò ‘wúrà náà,’ àti ipa ἁγιάσας gẹ́gẹ́ bí ohun tí tẹ́ńpìlì/ibi mímọ́ ti ṣe sí wúrà náà. Ṣùgbọ́n γάρ (‘nítorí’) kò hàn nínú ìtumọ̀ àkọ́kọ́; ó yẹ kí a ṣàfihàn ìsopọ̀ ìdí tí ọrọ̀ náà ní. ‘Ibi mímọ́’ jẹ́ aṣàyàn tó lè yẹ fún ναός, ṣùgbọ́n ‘tẹ́ńpìlì’ ní ìtumọ̀ àkọ́kọ́ jẹ́ kedere sí olùkà òde òní, nígbà tí àkọsílẹ̀ lè pa ìtumọ̀ ‘ibi mímọ́ inú tẹ́ńpìlì’ mọ́.
  naturalness: ‘Ẹ̀yin aṣiwèrè àti afọ́jú’ jẹ́ ìbáwí taara tó jẹ́ àdánidá nínú Yorùbá ìwé-mímọ́, ó sì yẹ díẹ̀ ju ‘òmùgọ̀’ lọ nínú àkọsílẹ̀ yìí. ‘Èwo ló tóbi jù?’ jẹ́ ìbéèrè ìfiwéra Yorùbá tó rọrùn, tó sì mú μείζων hàn dáadáa.
  terminology: A lo ‘tẹ́ńpìlì’ fún ναός pẹ̀lú àkọsílẹ̀ tó ṣàlàyé pé ó lè tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì. ‘Sọ ... di mímọ́’ dá ìtumọ̀ ìjọsìn ἁγιάζω bó, láìfi ẹ̀kọ́ mìíràn kún un.
