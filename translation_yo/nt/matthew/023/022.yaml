id: MAT.23.22
reference: Matthew 23:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: yo
  text: Ẹnikẹ́ni tó bá fi ọ̀run búra, ìtẹ́ Ọlọ́run àti ẹni tó jókòó lórí rẹ̀[a] ni ó fi búra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ń jókòó lórí rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: Ẹnikẹ́ni tí ó bá ... búra
  rationale: Ọ̀rọ̀-orúkọ aláìlópìn aorist tí a fi article ṣe ń tọ́ka sí ẹnikẹ́ni ní gbogbogbò; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún ìlànà gbogbogbò, láìfi í hàn bí ohun tó ṣẹlẹ̀ ní àtijọ́ nìkan.
- source_word: ἐν
  choice: fi ... búra
  rationale: Nínú ọ̀rọ̀ ìbúra, ἐν pẹ̀lú dative túmọ̀ sí ohun tí ènìyàn fi ṣe ìbúra; àkójọpọ̀ ọ̀rọ̀ Yorùbá tó bójú mu ni “fi ... búra.”
- source_word: οὐρανῷ
  choice: ọ̀run
  rationale: Nínú àyíká ẹ̀sìn Júù yìí, ọ̀run ni a ń tọ́ka sí, kì í ṣe ojú ọ̀run lásán, pàápàá bí a ti so mọ́ ìtẹ́ Ọlọ́run.
- source_word: ὀμνύει
  choice: ó ... búra
  rationale: Present indicative náà ń sọ òtítọ́ gbogbogbò; èdè Yorùbá àdánidá kò nílò àmì àsìkò míì níbí.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: ìtẹ́ Ọlọ́run
  rationale: Ó pa ìbáṣepọ̀ genitive mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó níyì.
- source_word: τῷ καθημένῳ
  choice: ẹni tí ó jókòó
  rationale: Ó pa àpèjúwe ẹni tó wà lórí ìtẹ́ mọ́, láìrọ́pò ọ̀rọ̀ àyíká náà pẹ̀lú “Ọlọ́run” nínú ẹsẹ̀ pàtàkì.
- source_word: ἐπάνω αὐτοῦ
  choice: lórí rẹ̀
  rationale: Nínú àyíká ìtẹ́, ó tọ́ka sí jíjókòó lórí ìtẹ́ náà, kì í ṣe wíwà ní òkè rẹ̀ lọ́tọ̀ sí i.
theological_decisions:
- issue: Ẹni tí “ẹni tí ó jókòó lórí rẹ̀” ń tọ́ka sí
  choice: Àpèjúwe ọlọ́wọ̀ fún Ọlọ́run tí ó jókòó lórí ìtẹ́ ní ọ̀run
  alternative: Kí a fi í sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó jókòó níbẹ̀” láìjẹ́ kó ṣe kedere pé Ọlọ́run ni
  rationale: “Ìtẹ́ Ọlọ́run” tó wà lẹ́sẹ̀kẹsẹ̀ ṣáájú rẹ̀ mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere. Síbẹ̀, a pa àpèjúwe yípo ti Gíríìkì mọ́ dípò kí a fi “Ọlọ́run” rọ́pò rẹ̀ nínú ẹsẹ̀ náà.
translation_notes:
  register: Standard Yoruba pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba. “Ẹnikẹ́ni tí ó bá” fi ìtumọ̀ gbogbogbò hàn, “fi ... búra” sì jẹ́ ọ̀nà Yorùbá àdánidá fún oath formula.
