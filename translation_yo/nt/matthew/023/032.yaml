  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: yo
  text: Ẹ̀yin sì, ẹ mú òṣùwọ̀n àwọn baba ńlá yín kún.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ mú gbogbo òṣùwọ̀n ẹ̀ṣẹ̀ àwọn baba ńlá yín kún.” Ní tààrà, Gíríìkì wí pé, “ẹ mú òṣùwọ̀n àwọn baba ńlá yín kún”; ó lo àpẹẹrẹ ẹ̀bi tí ń kójọ títí tí ó fi dé ààlà rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: náà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, «náà» so àwọn olùgbọ́ pọ̀ mọ́ ìṣe àwọn baba ńlá wọn, ó sì mú ìtẹ̀síwájú àríyànjiyàn Gíríìkì jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba, ó sì ní ìtẹnumọ́; «Ẹ̀yin» pa ìtẹnumọ́ yẹn mọ́, nígbà tí «ẹ» inú ọ̀rọ̀ ìṣe fi ọ̀pọ̀ ènìyàn hàn.
- source_word: πληρώσατε
  choice: ẹ mú ... kún
  rationale: Àṣẹ aorist ẹni kejì ọ̀pọ̀ ni; «ẹ mú ... kún» pa ìrísí àṣẹ àti àpẹẹrẹ ohun tí a ń kó jọ títí ó fi dé ẹ̀kún rẹ̀ mọ́.
- source_word: τὸ μέτρον
  choice: òṣùwọ̀n
  rationale: «Òṣùwọ̀n» pa àpẹẹrẹ ìwọ̀n tàbí iye tí ó lè kún mọ́, láì fi «ẹ̀ṣẹ̀» kún ọ̀rọ̀ pàtó.
- source_word: τῶν πατέρων ὑμῶν
  choice: àwọn baba ńlá yín
  rationale: Nínú àyíká yìí, πατέρων tọ́ka sí àwọn baba ìran wọn; «àwọn baba ńlá yín» jẹ́ Yorùbá àdánidá tó sì pa ìsopọ̀ ìran mọ́.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Jésù jẹ́ àṣẹ tàbí àsọtẹ́lẹ̀ ẹ̀gàn
  choice: 'A pa á mọ́ gẹ́gẹ́ bí àṣẹ tó ní agbára ẹ̀gàn àti ìdájọ́: «ẹ mú ... kún.»'
  alternative: «ẹ̀yin yóò mú ... kún» tàbí «ẹ̀yin ń mú ... kún.»
  rationale: πληρώσατε jẹ́ àṣẹ aorist active, ẹni kejì ọ̀pọ̀. Ìtumọ̀ náà kò sọ ọ́ di àsọtẹ́lẹ̀ lasán, bẹ́ẹ̀ ni kò yọ ìforígbárí ọ̀rọ̀ ìdájọ́ náà kúrò.
- issue: Ohun tí «òṣùwọ̀n» ń díwọ̀n
  choice: A fi àpẹẹrẹ náà sílẹ̀ nínú ọ̀rọ̀ pàtàkì láì ṣàfikún «ẹ̀ṣẹ̀.»
  alternative: «ẹ mú òṣùwọ̀n ẹ̀ṣẹ̀ àwọn baba ńlá yín kún dé ẹ̀kún rẹ̀.»
  rationale: Gíríìkì kò darúkọ «ẹ̀ṣẹ̀» ní tààrà; àyíká ọ̀rọ̀ fi ẹ̀bi tí ń kójọ hàn. Àlàyé ẹsẹ̀ ni ó ṣàlàyé rẹ̀, kí a má bàa tú àìṣe-kedere gidi náà sí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì bójú mu fún kíkà ní gbangba. «Baba ńlá» ni a lò fún àwọn baba ìran, «òṣùwọ̀n» sì pa àpẹẹrẹ orísun mọ́.
