revisions:
- from: “Ègbé ni fún yín, ẹ̀yin afọ́jú amọ̀nà, tí ẹ ń wí pé, ‘Ẹnikẹ́ni tí ó bá fi tẹ́ńpìlì búra, kò já mọ́ nǹkan kan[a]; ṣùgbọ́n ẹnikẹ́ni tí ó bá fi wúrà tẹ́ńpìlì búra, ó di dandan fún un láti mú un ṣẹ.’”
  to: “Ègbé ni fún yín, ẹ̀yin amọ̀nà afọ́jú, tí ẹ ń wí pé, ‘Ẹnikẹ́ni tí ó bá fi tẹ́ńpìlì búra, kò jẹ́ nǹkan kan[a]; ṣùgbọ́n ẹnikẹ́ni tí ó bá fi wúrà tẹ́ńpìlì búra, ó gbọ́dọ̀ mú un ṣẹ.’”
  rationale: Àtúnṣe náà ṣe pàtàkì láti rọ́pò ìsọ̀rọ̀ tí kò pé, ‘kò já mọ́ nǹkan kan,’ pẹ̀lú ‘kò jẹ́ nǹkan kan,’ èyí tí ó bá ọ̀rọ̀ Gíríìkì mu, tí ó sì jẹ́ Yorùbá àdánidá. A tún ṣètò ‘amọ̀nà afọ́jú’ gẹ́gẹ́ bí ìṣọ̀kan tí ó wọ́pọ̀. A kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un; ìmúlò ‘mú un ṣẹ’ ń ṣàlàyé ojúṣe ìbúra tí ọ̀rọ̀ ὀφείλει fi sílẹ̀ ní abẹ́lẹ̀.
