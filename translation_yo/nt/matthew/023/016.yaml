id: MAT.23.16
reference: Matthew 23:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: yo
  text: “Ègbé ni fún yín, ẹ̀yin amọ̀nà afọ́jú, tí ẹ ń wí pé, ‘Ẹnikẹ́ni tí ó bá fi tẹ́ńpìlì búra, kò jẹ́ nǹkan kan[a]; ṣùgbọ́n ẹnikẹ́ni tí ó bá fi wúrà tẹ́ńpìlì búra, ó gbọ́dọ̀ mú un ṣẹ.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “kò jẹ́ nǹkan kan”; ìyẹn ni pé, wọ́n ka irú ìbúra bẹ́ẹ̀ sí èyí tí kò dè ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Ègbé ni fún yín
  rationale: Ó pa ohùn ìdájọ́ àti ìkìlọ̀ alásọtẹ́lẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó lágbára tí a mọ̀ dáadáa.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: ẹ̀yin afọ́jú amọ̀nà
  rationale: Ó pa àwòrán àwọn ẹni tí ń tọ́ àwọn ẹlòmíràn sọ́nà bí ó tilẹ̀ jẹ́ pé àwọn fúnra wọn fọ́jú mọ́.
- source_word: οἱ λέγοντες
  choice: tí ẹ ń wí pé
  rationale: Gbólóhùn ìbátan yìí jẹ́ ọ̀nà àdánidá láti tú participle oní-artíkù náà sí Yorùbá.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Ẹnikẹ́ni tí ó bá ... búra
  rationale: Ìlànà ‘ẹnikẹ́ni tí ó bá’ fi ipò gbogbogbò tí relative clause pẹ̀lú ἄν àti subjunctive ń sọ hàn lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: ἐν τῷ ναῷ
  choice: fi tẹ́ńpìlì búra
  rationale: Nínú ọ̀rọ̀ ìbúra, ἐν ń tọ́ka sí ohun tí a fi ṣe ìbúra; ‘fi ... búra’ ni ọ̀nà Yorùbá tó bá ìtumọ̀ ọ̀rọ̀ náà mu.
- source_word: οὐδέν ἐστιν
  choice: kò já mọ́ nǹkan kan
  rationale: Ó pa ìsọ̀rọ̀ kúkúrú àti ìtumọ̀ pé a ka irú ìbúra bẹ́ẹ̀ sí ohun tí kò dè ẹni mọ́, láì ṣàlàyé rẹ̀ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: wúrà tẹ́ńpìlì
  rationale: Ìtumọ̀ genitive tó ṣe tààrà ni èyí, ó sì pa ìyàtọ̀ láàárín tẹ́ńpìlì àti wúrà rẹ̀ mọ́.
- source_word: ὀφείλει
  choice: ó di dandan fún un láti mú un ṣẹ
  rationale: Nínú àyíká ìbúra, ọ̀rọ̀ náà túmọ̀ sí pé ojúṣe wà lórí ẹni náà; ìtumọ̀ yìí ṣe kedere ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ohun tí ó gbọdọ̀ mú ṣẹ wà ní ìtumọ̀ abẹ́lẹ̀ Gíríìkì.
theological_decisions:
- issue: Ọ̀rọ̀ ìbúra tí a fi ohun kan sílẹ̀ láì sọ ní kíkún àti ojúṣe tí ὀφείλει ń tọ́ka sí
  choice: A pa ìsọ̀rọ̀ àkọ́kọ́ mọ́ ní ṣókí, ‘kò já mọ́ nǹkan kan,’ ṣùgbọ́n a sọ ojúṣe inú gbólóhùn kejì di mímọ̀ pé ‘ó di dandan fún un láti mú un ṣẹ.’
  alternative: A lè sọ ní kíkún pé ‘ìbúra náà kò dè é ... ìbúra náà sì dè é,’ tàbí kí a fi ọ̀rọ̀ náà sílẹ̀ bí ‘ó jẹ gbèsè.’
  rationale: Gíríìkì jẹ́ elliptical ní àwọn apá méjèèjì. Ìtumọ̀ yìí pa ìforígbárí ọ̀rọ̀ Jesu mọ́—ìyàtọ̀ tí àwọn amòfin ń ṣe láàárín àwọn ìbúra—ṣùgbọ́n ó fún òǹkàwé Yorùbá òde òní ní ìtumọ̀ tó ṣe kedere láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforígbárí náà ní ìyì àti agbára ìbáwí. ‘Tẹ́ńpìlì’ ni a lò fún ναός nínú àyíká yìí, ‘amọ̀nà’ sì pa àwòrán ẹni tí ń tọ́ni sọ́nà mọ́.
