id: MAT.23.37
reference: Matthew 23:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: yo
  text: “Jerúsálẹ́mù, Jerúsálẹ́mù, ìwọ tí ń pa àwọn wòlíì, tí o sì ń sọ àwọn tí a rán sí ọ ní òkúta—ẹ̀ẹ̀melòó ni mo fẹ́ kó àwọn ọmọ rẹ̀ jọ, bí àgbébọ̀ adìẹ ṣe ń kó àwọn ọmọ rẹ̀ jọ sábẹ́ ìyẹ́ rẹ̀[a], ṣùgbọ́n ẹ̀yin kò fẹ́!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ẹyẹ” ní gbogbogbòò; ṣùgbọ́n àwòrán ẹyẹ abo tí ń kó àwọn ọmọ rẹ̀ sábẹ́ ìyẹ́ tọ́ka sí àgbébọ̀ adìẹ níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerúsálẹ́mù, Jerúsálẹ́mù
  rationale: Orúkọ ìlú náà ni a ṣe àkọsílẹ̀ rẹ̀ ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá, a sì pa àtúnwí tí ń fi ẹ̀dùn ọkàn àti ìtẹnumọ́ hàn mọ́.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας
  choice: ìwọ tí ń pa àwọn wòlíì
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe tí ó wà ní àkókò ìsinsìnyí ń fi ìṣe tí ó ti di àbùdá hàn; ‘tí ń pa’ mú èyí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: tí o sì ń sọ àwọn tí a rán sí ọ ní òkúta
  rationale: A pa ìfarakanra pẹ̀lú arọ́pò-orúkọ oníṣe àkọ́kọ́ mọ́. ‘Àwọn tí a rán sí ọ’ tún pa ohùn àìṣe àti àwòrán Jerúsálẹ́mù gẹ́gẹ́ bí ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: ποσάκις ἠθέλησα
  choice: ẹ̀ẹ̀melòó ni mo fẹ́
  rationale: ‘Ẹ̀ẹ̀melòó’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè ẹ̀dùn ‘how often,’ ‘mo fẹ́’ sì fi ìfẹ́ tàbí ìmúratán hàn láìsọ ọ́ di ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: kó àwọn ọmọ rẹ jọ
  rationale: ‘Kó ... jọ’ túmọ̀ ìṣe kíkó papọ̀, ‘àwọn ọmọ rẹ’ sì pa àkàwé ìbátan tí ó wà nínú τέκνα mọ́.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: bí àgbébọ̀ adìẹ ṣe ń kó àwọn ọmọ rẹ̀ jọ sábẹ́ ìyẹ́ rẹ̀
  rationale: Ní àyíká yìí, ὄρνις ń tọ́ka sí ẹyẹ abo tí ń dáàbò bo àwọn ọmọ rẹ̀; ‘àgbébọ̀ adìẹ’ mú àwòrán náà ṣe kedere, ‘sábẹ́ ìyẹ́ rẹ̀’ sì pa àwòrán orísun mọ́.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: ṣùgbọ́n ẹ̀yin kò fẹ́
  rationale: ‘Ṣùgbọ́n’ mú ìtakora inú ọ̀rọ̀ jáde lọ́nà àdánidá. ‘Ẹ̀yin’ jẹ́ ọ̀pọ̀ ènìyàn bí fọ́ọ̀mù Gíríìkì, ó sì yàtọ̀ sí Jerúsálẹ́mù ẹlẹ́yọ̀ tí a pè ní ‘ìwọ.’
theological_decisions:
- issue: Ìtakora láàárín ohun tí Jésù fẹ́ àti àìfẹ́ àwọn ará Jerúsálẹ́mù
  choice: A lo ‘mo fẹ́’ àti ‘ẹ̀yin kò fẹ́’ láti pa ọ̀rọ̀ ìfẹ́/ìmúratán kan náà mọ́ ní ẹgbẹ́ méjèèjì.
  alternative: Lílo ọ̀rọ̀ tó lágbára bí ‘mo pinnu,’ tàbí yíyí apá àkọ́kọ́ padà sí ìmọ̀lára àánú nìkan.
  rationale: Orísun náà gbé ìfẹ́ Jésù àti àìfẹ́ àwọn tí a ń bá sọ̀rọ̀ sí ara wọn láìyanjú ìjíròrò tó gbòòrò nípa ìfẹ́ Ọlọ́run, ojúṣe ènìyàn, tàbí Kristolọ́jì.
- issue: Àwọn tí ‘àwọn ọmọ rẹ’ ń tọ́ka sí
  choice: A pa ‘àwọn ọmọ rẹ’ mọ́ gẹ́gẹ́ bí àkàwé fún àwọn ènìyàn tí wọ́n jẹ́ ti Jerúsálẹ́mù.
  alternative: ‘Àwọn ènìyàn rẹ’ tàbí ‘àwọn olùgbé rẹ.’
  rationale: Èyí pa àkàwé ìlú bí ìyá mọ́, kò sì dín àwọn tí ọ̀rọ̀ náà lè tọ́ka sí kù láìsí ẹ̀rí.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Ìyípadà láti ‘ìwọ/ọ’ ẹlẹ́yọ̀ sí ‘ẹ̀yin’ ọ̀pọ̀ ènìyàn ń tẹ̀ lé ìyípadà nọ́ńbà inú Gíríìkì, ó sì mú kí ìlú tí a sọ di ènìyàn àti àwọn ọmọ rẹ̀ yà kedere.
