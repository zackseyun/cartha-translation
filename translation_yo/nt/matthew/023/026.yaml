id: MAT.23.26
reference: Matthew 23:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: yo
  text: Farisí afọ́jú, kọ́kọ́ fọ inú ife àti àwo[a] mọ́, kí apá òde rẹ̀ náà lè di mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “abọ́,” “àwo pẹlẹbẹ,” tàbí “àwo ìgbé-oúnjẹ”; παροψίς jẹ́ ohun èlò tí a fi ń gbé oúnjẹ kalẹ̀.
    reason: Àwọn ìtumọ̀ ọ̀rọ̀ mìíràn tó ṣeé ṣe fún παροψίς ni wọ̀nyí; kò ṣe pàtó bóyá ó rí bí àwo pẹlẹbẹ, abọ́, tàbí àwo ńlá.
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Farisí afọ́jú
  rationale: Àwọn ọ̀rọ̀ méjèèjì jẹ́ àpèjúwe ẹni tí a ń bá sọ ní tààrà; èyí pa orúkọ ẹgbẹ́ náà àti ìfi afọ́jú tẹ̀mí wé e mọ́ láìṣàlàyé àkàwé náà ju bí Gíríìkì ṣe ṣe lọ.
- source_word: καθάρισον
  choice: fọ ... mọ́
  rationale: Ọ̀rọ̀ àṣẹ yìí ń béèrè ìgbésẹ̀ pàtó. ‘Fọ ... mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífọ ohun èlò, ó sì tún jẹ́ kí ìtumọ̀ ìwà rere inú àkàwé náà dúró.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó fi ohun tí ó gbọ́dọ̀ ṣáájú hàn nínú ìtẹ̀lé àti nínú ìrònú gbólóhùn náà.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: inú ife
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún apá inú ohun èlò mímu.
- source_word: καὶ τῆς παροψίδος
  choice: àti àwo[a]
  rationale: παροψίς jẹ́ ohun èlò tí a fi ń gbé oúnjẹ kalẹ̀; ‘àwo’ jẹ́ ọ̀rọ̀ Yorùbá gbòòrò tó bá àwòrán náà mu láìdá irú tàbí ìrísí rẹ̀ pàtó.
- source_word: ἵνα γένηται
  choice: kí ... lè di
  rationale: ‘Di’ pa ìtumọ̀ ìyípadà tàbí àbájáde inú γένηται mọ́, dípò kí a sọ ipo kan lásán.
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ
  choice: kí apá òde rẹ̀ náà
  rationale: ‘Apá òde’ bá ‘inú’ ṣe ní ìtakora mu; ‘náà’ sì ṣàfihàn καί. Arọ́pò-orúkọ ẹyọ kan ‘rẹ̀’ tẹ̀ lé αὐτοῦ tó jẹ́ ẹyọ kan.
- source_word: καθαρόν
  choice: mímọ́
  rationale: ‘Mímọ́’ lè tọ́ka sí ohun èlò tí kò ní ẹ̀gbin, ó sì tún jẹ́ kí ìtumọ̀ ìwà rere inú àkàwé náà ṣeé gbọ́ láìsọ ọ́ di gbangba.
theological_decisions:
- issue: Àwòrán ohun èlò gidi ní ìfiwéra pẹ̀lú ṣíṣe ìtumọ̀ ìwà rere rẹ̀ ní gbangba
  choice: Pa àwòrán fífọ inú àti òde ife àti àwo mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí mímú ìgbésí ayé inú mọ́ kí ìgbésí ayé òde náà lè mọ́.
  rationale: Ọ̀rọ̀ Jésù fi àwòrán ohun èlò ṣe àkàwé. Ṣíṣe ohun tí àkàwé náà ń tọ́ka sí ní gbangba yóò fi àlàyé kún Gíríìkì, yóò sì dín agbára ọ̀rọ̀ rẹ̀ kù.
- issue: Arọ́pò-orúkọ ẹyọ kan lẹ́yìn mẹ́nuba ife àti àwo
  choice: Lo ‘rẹ̀’ gẹ́gẹ́ bí ẹyọ kan, kí a má ṣe tú ìṣòro ìtọ́kasí náà sí rere.
  alternative: Lo ‘wọn’ láti jẹ́ kí ó tọ́ka sí ife àti àwo méjèèjì.
  rationale: αὐτοῦ jẹ́ ẹyọ kan nínú Gíríìkì. Bí ó tilẹ̀ jẹ́ pé a mẹ́nuba ohun èlò méjì, ìtumọ̀ náà kò gbọ́dọ̀ yí nọ́ńbà ọ̀rọ̀ orísun padà láìní dandan.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn kíkún ni a lò. Èdè náà jẹ́ kúkúrú, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. ‘Farisí afọ́jú’ pa líle àpèjúwe tààrà náà mọ́; ‘fọ ... mọ́’ sì jẹ́ ọ̀nà àdánidá fún àwòrán ohun èlò.
