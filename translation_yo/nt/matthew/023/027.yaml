id: MAT.23.27
reference: Matthew 23:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: yo
  text: “Ègbé ni fún yín, ẹ̀yin àwọn akọ̀wé àti àwọn Farisi, ẹ̀yin àwọn alágàbàgebè! Nítorí ẹ dà bí àwọn ibojì tí a ti fi láímù funfun bo,[a] tí ó lẹ́wà ní òde wọn, ṣùgbọ́n tí ó kún fún egungun àwọn òkú àti gbogbo irú èérí ní inú wọn.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ibojì tí a funfun.”
    reason: lexical_alternative
  - marker: b
    text: “Èérí” níbí lè kan àìmọ́ nípa ìlànà ẹ̀sìn àti ìbàjẹ́ ìwà.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ègbé ni fún yín
  rationale: Ó pa ohùn ìdájọ́ àti ìkìlọ̀ líle mọ́; ó lágbára ju ọ̀rọ̀ ìbànújẹ́ lásán lọ.
- source_word: γραμματεῖς
  choice: akọ̀wé
  rationale: Ọ̀rọ̀ Yorùbá Bíbélì tí a mọ̀ fún ẹgbẹ́ àwọn amòfin àti olùkọ́ Ìwé Mímọ́ Júù; ó tún dúró sún mọ́ orúkọ Gíríìkì.
- source_word: Φαρισαῖοι
  choice: Farisí
  rationale: Ìkọlórúkọ ẹgbẹ́ náà ní ọ̀nà tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: ὑποκριταί
  choice: aláwò-mejì
  rationale: Ó sọ ìwà ẹni tí ìrísí ẹ̀sìn rẹ̀ kò bá òtítọ́ inú rẹ̀ mu ní èdè Yorùbá tí ó ṣe kedere.
- source_word: παρομοιάζετε
  choice: ẹ dà bí
  rationale: Ìtumọ̀ àfiwé tí ó ṣe déédé, tí ó sì jẹ́ adayébá nínú ọ̀rọ̀ tààrà.
- source_word: τάφοις κεκονιαμένοις
  choice: ibojì tí a fi ẹfun funfun
  rationale: Ó fi àwòrán ibojì tí a bo pẹ̀lú ẹfun/láìmù hàn ní kedere, láì dín un kù sí ‘ibojì funfun’ lásán.
- source_word: ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ
  choice: tí ó lẹ́wà ní ìta, ṣùgbọ́n ... ní inú
  rationale: Ó pa ìtakora láàárín ìrísí òde àti òtítọ́ inú mọ́ ní ọ̀nà adayébá.
- source_word: γέμουσιν ὀστέων νεκρῶν
  choice: ó kún fún egungun òkú
  rationale: Ó jẹ́ ìtumọ̀ ṣókí, kedere fún egungun àwọn tí ó ti kú.
- source_word: πάσης ἀκαθαρσίας
  choice: gbogbo àìmọ́
  rationale: ‘Àìmọ́’ lè gba èérí ìṣe-àṣà àti ìbàjẹ́ ìwà pọ̀, bí ọ̀rọ̀ Gíríìkì ṣe ní àyè sí méjèèjì.
theological_decisions:
- issue: Ìtumọ̀ ἀκαθαρσία nínú àkàwé náà
  choice: gbogbo àìmọ́
  alternative: gbogbo èérí ìṣe-àṣà; gbogbo ìbàjẹ́ ìwà
  rationale: Ibojì ń rántí àìmọ́ nípa ìlànà ẹ̀sìn Júù, ṣùgbọ́n ìbáwí Jésù tún kan ìbàjẹ́ inú. Ọ̀rọ̀ gbòòrò náà pa méjèèjì mọ́ láì yan ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. A pa àtúnṣe ọ̀rọ̀ ìbáwí, àfiwé ibojì, àti ìtakora ‘ní ìta ... ní inú’ mọ́. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ adayébá.
