id: MAT.23.12
reference: Matthew 23:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: yo
  text: Ṣùgbọ́n ẹnikẹ́ni tí ó bá gbé ara rẹ̀[a] ga, a ó rẹ̀ e sílẹ̀[b]; ẹnikẹ́ni tí ó bá sì rẹ ara rẹ̀ sílẹ̀, a ó gbé e ga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ arọ́pò-orúkọ tí a lò fún ‘ara rẹ̀’ jẹ́ ti akọ ẹyọ kan, ṣùgbọ́n ó dúró fún ẹnikẹ́ni lápapọ̀.
    reason: cultural_note
  - marker: b
    text: Tàbí, “a ó mú un rẹlẹ̀” … “a ó gbé e sókè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ẹnikẹ́ni tí ó bá
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìní ìdíwọ̀ yìí ń sọ òtítọ́ gbogbogbò; ‘ẹnikẹ́ni tí ó bá’ mú ìtumọ̀ òwe náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn sí ọ̀rọ̀ tó ṣáájú, nítorí náà ‘Ṣùgbọ́n’ bá àyíká ọ̀rọ̀ mu.
- source_word: ὑψώσει ἑαυτὸν
  choice: tí ó bá gbé ara rẹ̀ ga
  rationale: ‘Gbé ara rẹ̀ ga’ jẹ́ ọ̀nà Yorùbá àdánidá fún gbígbé ara ẹni ga, ó sì pa ìṣe tí ẹni náà ń ṣe sí ara rẹ̀ mọ́.
- source_word: ταπεινωθήσεται
  choice: a ó rẹ̀ ẹ́ sílẹ̀
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ ọjọ́ iwájú àti bí a kò ṣe dárúkọ olùṣe mọ́. Ó tún lè túmọ̀ sí fífi ẹni náà sí ipò ìrẹ̀lẹ̀ tàbí mímú un rẹlẹ̀.
- source_word: καὶ
  choice: ẹnikẹ́ni tí ó bá sì
  rationale: ‘Sì’ so àwọn gbólóhùn méjèèjì pọ̀ ní ọ̀nà Yorùbá tí ó bá ìṣọ̀kan wọn mu.
- source_word: ταπεινώσει ἑαυτὸν
  choice: tí ó bá rẹ ara rẹ̀ sílẹ̀
  rationale: Ó sọ ìrẹ̀lẹ̀ tí ẹni náà fúnra rẹ̀ yàn, ó sì bá àwòrán ìsàlẹ̀ àti òkè inú ọ̀rọ̀ Gíríìkì mu.
- source_word: ὑψωθήσεται
  choice: a ó gbé e ga
  rationale: Ó pa ìbáramu pẹ̀lú ‘gbé ara rẹ̀ ga’ mọ́, ó fi ọjọ́ iwájú hàn, kò sì sọ ẹni tí yóò ṣe é ní pàtó.
theological_decisions:
- issue: Ẹni tó ń ṣe àwọn ìṣe inú ọ̀rọ̀ àìṣe méjèèjì
  choice: Lo ‘a ó’ láì dárúkọ olùṣe ní pàtó
  alternative: Sọ ní tààrà pé Ọlọ́run ni yóò rẹ ẹni náà sílẹ̀ tàbí gbé e ga
  rationale: Gíríìkì lo ọ̀rọ̀ àìṣe, kò sì dárúkọ olùṣe. Fífi olùṣe sílẹ̀ láìsọ pa àìsọ-tán inú ẹsẹ náà mọ́, bí ó tilẹ̀ jẹ́ pé àyíká lè tọ́ka sí iṣẹ́ Ọlọ́run.
- issue: Ọ̀rọ̀ arọ́pò-orúkọ akọ ẹyọ kan tí ó dúró fún gbogbo ènìyàn
  choice: Lo ‘ara rẹ̀,’ èyí tí kò fi akọ tàbí abo hàn ní Yorùbá, kí àlàyé ìrísí Gíríìkì sì wà nínú àlàyé ìsàlẹ̀
  alternative: Fi ọ̀rọ̀ akọ kan sínú ìtumọ̀ Yorùbá
  rationale: Yorùbá kò pín ọ̀rọ̀ arọ́pò-orúkọ ẹni kẹta sí akọ àti abo. ‘Ara rẹ̀’ jẹ́ ìtumọ̀ gírámà tó pé, tí ó sì jẹ́ kí òtítọ́ gbogbogbò inú Gíríìkì dúró.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Àwọn ọ̀rọ̀ méjèèjì ni a ṣe ní ìbáramu—‘gbé … ga / rẹ̀ … sílẹ̀’—láti pa ìyípadà ipò àti agbára òwe inú orísun mọ́. ‘A ó’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi olùṣe sílẹ̀ láìdárúkọ.
