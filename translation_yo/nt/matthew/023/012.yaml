  source_fidelity: Ìtumọ̀ náà pa ìṣọ̀kan ìlànà gbogbogbò, ìṣe ọjọ́ iwájú, ìṣe ìfọ̀kànsìn ẹni sí ara rẹ̀, àti àwọn ọ̀rọ̀ àìṣe Gíríìkì mọ́. Ṣùgbọ́n ‘ẹ́’ nínú gbólóhùn àkọ́kọ́ jẹ́ arọ́pò-orúkọ ẹni kejì ẹyọ kan (‘ìwọ’ gẹ́gẹ́ bí ohun-ìṣe), kì í ṣe ohun-ìṣe ẹni kẹta tí ó ń tọ́ka sí ‘ẹnikẹ́ni’. A gbọdọ̀ yí i sí ‘e’.
  naturalness: Pẹ̀lú àtúnṣe náà, ‘a ó rẹ̀ e sílẹ̀’ àti ‘a ó gbé e ga’ jẹ́ ìlò Yorùbá tí ó dára, tí ó sì mú ìbáramu òwe inú ẹsẹ̀ náà hàn. Lílo ‘a ó’ fi olùṣe sílẹ̀ láìdárúkọ, gẹ́gẹ́ bí àwọn ọ̀rọ̀ àìṣe Gíríìkì.
  terminology: ‘Gbé ara rẹ̀ ga / rẹ ara rẹ̀ sílẹ̀’ jẹ́ ọ̀rọ̀ tó bójú mu fún ìgbé ara ẹni ga àti ìrẹ̀ ara ẹni sílẹ̀. Àlàyé ìsàlẹ̀ nípa akọ-ẹyọ Gíríìkì jẹ́ pípé, níwọ̀n bí Yorùbá kò ti ní ìyàtọ̀ akọ/abo nínú arọ́pò-orúkọ ẹni kẹta.
