id: MAT.23.25
reference: Matthew 23:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: yo
  text: “Ègbé ni fún yín, ẹ̀yin akọ̀wé àti Farisí, ẹ̀yin alágàbàgebè! Nítorí ẹ ń fọ ìta ifè àti ti àwo mọ́, ṣùgbọ́n inú wọn kún fún ojúkòkòrò àti ìwà àṣejù.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n inú wọn kún fún ìjàfáfá àti àìní ìkóra-ẹni-níjàánu.” Àwọn ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ líle sí i, ìyẹn fífi ipá tàbí ọgbọ́n ẹ̀wẹ̀ gba ohun ẹlòmíràn àti títẹ́ ìfẹ́kúfẹ̀ẹ́ ẹni lọ́rùn láìní ìjánu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ègbé ni fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àsọtẹ́lẹ̀ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere ju ìkédàárò lasán lọ.
- source_word: γραμματεῖς
  choice: akọ̀wé
  rationale: Èyí ni ọ̀rọ̀ ìbílẹ̀ tí a sábà máa ń lò fún ẹgbẹ́ àwọn amòfin yìí nínú ìtàn Ìhìn Rere, láì tú ipa wọn sílẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: Φαρισαῖοι
  choice: Farisí
  rationale: Ó jẹ́ àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní ọ̀nà tí ó wọ́pọ̀, tí ó sì rọrùn fún òǹkà Yorùbá.
- source_word: ὑποκριταί
  choice: ẹ̀yin alágàbàgebè
  rationale: Ó sọ ìwà èké ẹ̀sìn àti fífi ara hàn bí ẹni rere ní ọ̀nà àdánidá àti líle tó bá ọ̀rọ̀ náà mu.
- source_word: καθαρίζετε
  choice: ẹ ń fọ ... mọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe fífọ ohun èlò jíjẹ kí ó mọ́, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: τὸ ἔξωθεν
  choice: ìta
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ìta àti inú mọ́ ní ṣókí.
- source_word: ποτηρίου
  choice: ifè
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun èlò mímu.
- source_word: παροψίδος
  choice: àwo
  rationale: Ọ̀rọ̀ gbogbogbò yìí lè tọ́ka sí ohun èlò tí a fi ń gbé oúnjẹ kalẹ̀, láì fi dandan sọ pé ó jẹ́ abọ́ tàbí àwo pẹlẹbẹ.
- source_word: ἔσωθεν
  choice: inú wọn
  rationale: Ó bá ọ̀rọ̀-ìṣe ọ̀pọ̀ γέμουσιν mu, ó sì pa àwòrán ifè àti àwo méjèèjì mọ́.
- source_word: γέμουσιν
  choice: kún fún
  rationale: Ó tú ìtumọ̀ pé àwọn ohun èlò méjèèjì ‘kún’ jáde ní Yorùbá àdánidá, pẹ̀lú nọ́ńbà ọ̀pọ̀ nínú ‘wọn.’
- source_word: ἁρπαγῆς
  choice: ojúkòkòrò
  rationale: Nínú àwòrán ìwà inú yìí, ó sọ ìfẹ́ láti máa gba nǹkan fún ara ẹni; àlàyé ìsàlẹ̀ tún pa ìtumọ̀ líle bí ìfi agbára gba nǹkan mọ́.
- source_word: ἀκρασίας
  choice: ìwà àṣejù
  rationale: Ó fi ìtẹ̀sí láti tẹ́ ìfẹ́ ara ẹni lọ́rùn láìní ìjánu hàn ní èdè tí òǹkà òde òní lè lóye; àlàyé ìsàlẹ̀ fúnni ní ìtumọ̀ ‘àìní ìkóra-ẹni-níjàánu.’
theological_decisions:
- issue: Ohun tí ‘inú’ ń tọ́ka sí nínú àkàwé náà
  choice: A pa ifè àti àwo mọ́ gẹ́gẹ́ bí ohun tí ‘inú wọn kún,’ láì yí i padà sí ‘inú yín.’
  alternative: “ṣùgbọ́n inú yín kún fún ojúkòkòrò àti ìwà àṣejù”
  rationale: Gíríìkì lo ọ̀rọ̀-ìṣe ọ̀pọ̀ tó ń tọ́ka sí àwọn ohun èlò méjèèjì. Bí ó tilẹ̀ jẹ́ pé àwọn aṣáájú náà ni àkàwé náà ń ṣàpèjúwe, títẹ̀lé àwòrán àwọn ohun èlò kò fi àlàyé tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnṣe ‘ẹ̀yin’ ṣáájú ‘alágàbàgebè’ mú ìbáwí náà dun bí ọ̀rọ̀ Yorùbá àdánidá, láì dín agbára rẹ̀ kù.
