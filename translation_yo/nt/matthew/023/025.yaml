  - severity: medium
    issue: Àlàyé ìsàlẹ̀ tú ἀκρασίας lọ́nà tí kò pé.
    rationale: Gbólóhùn ‘lílo ìfẹ́ ara ẹni láìní ìjánu’ lè túmọ̀ sí lílo ìfẹ́ sí ara ẹni, kì í ṣe ìfẹ́kúfẹ̀ẹ́ tàbí àṣejù aláìní ìjánu. ‘Títẹ́ ìfẹ́kúfẹ̀ẹ́ ẹni lọ́rùn láìní ìjánu’ mú ìtumọ̀ náà hàn dáadáa.
