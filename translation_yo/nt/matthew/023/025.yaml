  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé èdè Gíríìkì dáadáa: ìkéde ìbáwí náà, àwọn akọ̀wé, Farisí, àti alágàbàgebè wà ní ipò ìpè; fífọ́ òde ifè àti àwo, àti ìyàtọ̀ òde/inú náà sì wà ní mímú. ‘Inú wọn kún’ pa nọ́ńbà ọ̀pọ̀ γέμουσιν àti àwòrán ohun èlò méjèèjì mọ́. ‘Ojúkòkòrò’ àti ‘ìwà àṣejù’ jẹ́ ìtumọ̀ tó bójú mu fún ìtumọ̀ ìwà rere/ìwà búburú nínú àyíká yìí, pẹ̀lú àlàyé ìsàlẹ̀ fún ìtumọ̀ ἁρπαγή tó lágbára sí i.'
  naturalness: Gbólóhùn náà dára, ó sì ní ohùn ìbáwí tó bá Yorùbá òde òní mu. Síbẹ̀, ‘ìta ifè àti àwo’ lè dà bí ẹni pé ó ń ṣàpèjúwe ifè àti àwo kan tí ó wà níta. Fífi ‘ti’ kún un (‘ìta ifè àti ti àwo’) mú ìbáṣepọ̀ ìní náà hàn gbangba. Ọ̀rọ̀ àlàyé ìsàlẹ̀ náà nílò àtúnṣe kékeré kí ìtumọ̀ ‘àìní ìkóra-ẹni-níjàánu’ má bà a dọ́gba pẹ̀lú ‘lílo ìfẹ́ ara ẹni’.
  terminology: ‘Akọ̀wé,’ ‘Farisí,’ àti ‘alágàbàgebè’ bá ìforúkọsílẹ̀ ìtàn Ìhìn Rere àti ìforúkọsílẹ̀ ìwà ẹ̀sìn nínú ẹsẹ̀ náà mu. ‘Ìfi agbára gba nǹkan’ nínú àlàyé ìsàlẹ̀ kì í ṣe ọ̀nà Yorùbá tó rọrùn jù; ‘ìjàfáfá’ jẹ́ ọ̀rọ̀ tó ṣókì, tó sì bo ìtumọ̀ ìkógun/ìfipá-gba ohun.
  issues:
