  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: yo
  text: Ẹ̀yin amọ̀nà afọ́jú, ẹ ń fi àlẹ̀ yọ ẹ̀fọn[a] kúrò nínú ohun mímu, ṣùgbọ́n ẹ ń gbe ràkúnmí mì!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ń yẹ ẹ̀fọn kúrò.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífẹ ohun mímu láti yọ ohun àìmọ́ kúrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: afọ́jú tí ń ṣe amọ̀nà
  rationale: Èyí pa àwòrán àwọn ẹni tí ń darí àwọn ẹlòmíràn mọ́, bí ó tilẹ̀ jẹ́ pé àwọn fúnra wọn kò ríran nípa ti ẹ̀mí; ó sì jẹ́ ọ̀rọ̀ Yorùbá adayébá.
- source_word: διϋλίζοντες
  choice: fi àlẹ̀ yọ ... kúrò
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi ohun mímu gba inú àlẹ̀ láti yọ ohun àìmọ́ kúrò; gbólóhùn yìí sọ ìṣe náà ní kedere láì tú àwòrán náà ká.
- source_word: τὸν κώνωπα
  choice: kòkòrò kékeré
  rationale: κώνωψ jẹ́ kòkòrò kékeré bí ẹ̀fọn; yíyan ọ̀rọ̀ gbogbogbò yìí jẹ́ kó yé àwọn òǹkàwé lónìí, ó sì pa ìyàtọ̀ ìwọ̀n rẹ̀ pẹ̀lú ràkúnmí mọ́.
- source_word: τὴν δὲ κάμηλον
  choice: ṣùgbọ́n ... ràkúnmí
  rationale: “Ṣùgbọ́n” mú ìtakora δέ jáde, “ràkúnmí” sì túmọ̀ ẹranko náà tààrà.
- source_word: καταπίνοντες
  choice: ń gbé ... mì
  rationale: Èyí jẹ́ ọ̀nà Yorùbá adayébá àti aláwòrán fún mímú ohun ńlá wọ inú, ó sì pa àsọdùn inú orísun mọ́.
theological_decisions:
- issue: Agbára àkàwé nípa ohun àìmọ́ àti ìwọ̀n ẹ̀ṣẹ̀
  choice: Pa àwòrán gidi ti yíyọ kòkòrò kékeré kúrò nínú ohun mímu àti gbígbé ràkúnmí mì mọ́.
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí fífi ọ̀ràn kékeré ṣe pàtàkì ju ọ̀ràn ńlá lọ.
  rationale: Àsọdùn tó yani lẹ́nu nínú àwòrán méjèèjì ni ó ru ìbáwí ẹsẹ náà; pípa á mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kun ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọ “Ẹ̀yin” mú pé ọ̀rọ̀ náà jẹ́ ìbáwí tààrà sí ọ̀pọ̀ ènìyàn. Èdè náà jẹ́ adayébá, ọ̀wọ̀, ó sì pa àsọdùn líle inú Gíríìkì mọ́.
