  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: yo
  text: “Wò ó,[a] ilé yín ni a fi sílẹ̀ fún yín ní ahoro.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tẹ́ńpìlì yín”; gbólóhùn náà, “ilé yín,” lè tọ́ka pàtó sí tẹ́ńpìlì, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó gbooro sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ ìpe àfiyèsí yìí jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere, ó sì pa agbára ìkéde ọlọ́wọ̀ náà mọ́.
- source_word: ἀφίεται
  choice: a fi ... sílẹ̀
  rationale: Ó pa ìṣe aláìlórúkọ inú passive Gíríìkì mọ́, láì sọ ẹni tó ṣe é tàbí túmọ̀ ọ́ ju bó ṣe yẹ lọ.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó fi dative Gíríìkì hàn, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá nínú àkópọ̀ ‘fi ... sílẹ̀ fún yín.’
- source_word: ὁ οἶκος ὑμῶν
  choice: ilé yín
  rationale: Ó tẹ̀ lé ìtumọ̀ gbooro ti οἶκος, láì dín ìtọ́kasí rẹ̀ kù sí tẹ́ńpìlì, Jerúsálẹ́mù, tàbí ilé Ísírẹ́lì nínú ẹsẹ̀ pàtàkì.
- source_word: ἔρημος
  choice: ní ahoro
  rationale: ‘Ahoro’ mú ìmọ̀lára ibi tí a kọ̀ sílẹ̀ àti ìdájọ́ àsọtẹ́lẹ̀ jáde ju ‘ṣófo’ lọ, ó sì bá àyíká ọ̀rọ̀ mu.
theological_decisions:
- issue: Ohun tí ‘ilé yín’ ń tọ́ka sí
  choice: A fi sí ‘ilé yín’ nínú ẹsẹ̀ pàtàkì.
  alternative: ‘tẹ́ńpìlì yín,’ ‘Jerúsálẹ́mù,’ tàbí ‘ilé Ísírẹ́lì’
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí tẹ́ńpìlì àti Jerúsálẹ́mù, ṣùgbọ́n Gíríìkì gbooro sí i. Yíyan ‘ilé’ pa àìdánilójú àti agbára àsọtẹ́lẹ̀ náà mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìkéde gígún àti ọ̀rọ̀ ìdájọ́ inú ẹsẹ̀ náà mọ́.
