id: MAT.18.31
reference: Matthew 18:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: yo
  text: Nítorí náà, nígbà tí àwọn ẹrú ẹlẹgbẹ́ rẹ̀[a] rí ohun tí ó ṣẹlẹ̀, ìbànújẹ́ bá wọn gidigidi. Wọ́n sì wá ròyìn gbogbo ohun tí ó ṣẹlẹ̀ fún olúwa wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn ìránṣẹ́ ẹlẹgbẹ́ rẹ̀.’ Ọ̀rọ̀ Gíríìkì σύνδουλοι túmọ̀ ní pàtó sí ‘àwọn ẹrú ẹlẹgbẹ́’ tàbí ‘àwọn ìránṣẹ́ ẹlẹgbẹ́,’ ìyẹn àwọn tí wọ́n jọ wà lábẹ́ olúwa kan náà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘ọ̀gá wọn.’ Ọ̀rọ̀ Gíríìkì κύριος lè túmọ̀ sí ‘olúwa’ tàbí ‘ọ̀gá,’ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìtẹ̀síwájú àti àbájáde ohun tí ó ṣẹlẹ̀ ṣáájú hàn ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: σύνδουλοι
  choice: àwọn ẹrú ẹlẹgbẹ́ rẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí wọ́n jọ wà ní ipò ẹrú lábẹ́ olúwa kan náà; ‘ẹrú’ pa ipò ìdè wọn mọ́ nínú àkàwé náà.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: ohun tí ó ṣẹlẹ̀ / gbogbo ohun tí ó ṣẹlẹ̀
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ participle substantival náà ní Yorùbá, nígbà tí ‘gbogbo’ pa agbára πάντα mọ́ ní ìgbà kejì.
- source_word: ἐλυπήθησαν σφόδρα
  choice: ó bà wọ́n nínú jẹ́ gidigidi
  rationale: Gbólóhùn Yorùbá yìí fi ìbànújẹ́ jíjinlẹ̀ hàn, ‘gidigidi’ sì pa agbára σφόδρα mọ́.
- source_word: ἐλθόντες
  choice: wọ́n sì wá
  rationale: Ó mú ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì jáde ní Yorùbá àdánidá láì lo ìtumọ̀ líle bí ‘lẹ́yìn tí wọ́n dé.’
- source_word: διεσάφησαν
  choice: ròyìn
  rationale: Ó bá ọ̀rọ̀ àwọn ọmọ abẹ́ tí ń jẹ́ kí olúwa wọn mọ gbogbo ohun tó ṣẹlẹ̀ mu; ‘gbogbo’ tún fi ẹ̀kúnrẹ́rẹ́ ìròyìn náà hàn.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: fún olúwa wọn
  rationale: ‘Olúwa’ jẹ́ ìtumọ̀ tó yẹ fún κύριος nípa ẹni tó jẹ́ olórí wọn nínú àkàwé, láì sọ pé ẹni àtọ̀runwá ni.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ inú ẹbí δοῦλος nínú àwùjọ àkàwé náà
  choice: àwọn ẹrú ẹlẹgbẹ́ rẹ̀
  alternative: àwọn ìránṣẹ́ ẹlẹgbẹ́ rẹ̀
  rationale: Ipò wọn gẹ́gẹ́ bí ẹrú lábẹ́ olúwa kan náà ṣe pàtàkì sí ìtumọ̀ àkàwé náà; nítorí náà, a kò rọ ọ̀rọ̀ náà di ‘ìránṣẹ́.’
- issue: Ìtumọ̀ κύριος nígbà tí ó ń tọ́ka sí olórí ènìyàn
  choice: olúwa wọn
  alternative: ọ̀gá wọn
  rationale: ‘Olúwa’ pa ìbáṣepọ̀ olórí àti ọmọ abẹ́ mọ́, ṣùgbọ́n àyíká àkàwé náà fi hàn pé olórí ènìyàn ni, kì í ṣe pé ọ̀rọ̀ náà ń tọ́ka tààrà sí Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A gbe àmì àlàyé [a] àti [b] sí lẹ́yìn àwọn ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
