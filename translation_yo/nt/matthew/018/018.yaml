id: MAT.18.18
reference: Matthew 18:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: yo
  text: '“Lóòótọ́ ni mo sọ fún yín: ohunkóhun tí ẹ bá dè ní ilẹ̀ ayé yóò ti jẹ́ ohun tí a ti dè ní ọ̀run, ohunkóhun tí ẹ bá sì tú ní ilẹ̀ ayé yóò ti jẹ́ ohun tí a ti tú ní ọ̀run.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ ní ọ̀nà ìbílẹ̀ pé, “a ó dè é ní ọ̀run ... a ó tú u ní ọ̀run.” Ìṣètò ọ̀rọ̀ Gíríìkì gba ìtumọ̀ yẹn láyè, ṣùgbọ́n ọ̀rọ̀-ìṣe ọjọ́ iwájú pẹ̀lú participle perfect lè tọ́ka sí ipò tí a ti fi ìdí rẹ̀ múlẹ̀ ní ọ̀run; ìdí nìyẹn tí ìtumọ̀ yìí fi ní, “yóò ti jẹ́ ohun tí a ti dè ... ohun tí a ti tú.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó fi ìmúdájú pàtàkì bẹ̀rẹ̀ ọ̀rọ̀ aláṣẹ; ọ̀rọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá òde òní ju lílo ‘Àmín’ nínú gbólóhùn lọ.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó pa ìtọ́ka sí ẹni púpọ̀ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ̀rọ̀ taara ní Yorùbá.
- source_word: ὅσα ἐὰν
  choice: ohunkóhun tí ẹ bá
  rationale: Ìsọ̀rí ‘tí ... bá’ fi àídájú gbogbogbò tí ἐάν ní hàn, ‘ohunkóhun’ sì pa ìwọ̀n gbígbòòrò rẹ̀ mọ́.
- source_word: δήσητε
  choice: dè
  rationale: ‘Dè’ pa àwòrán ìpilẹ̀ṣẹ̀ ti dídè mọ́, kò sì fi ìtumọ̀ rẹ̀ mọ́ sí ‘fi òfin dè’ nìkan.
- source_word: ἐπὶ τῆς γῆς
  choice: ní ayé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún fífi ilẹ̀ ayé yàtọ̀ sí ọ̀run nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἔσται δεδεμένα
  choice: yóò ti di dídè
  rationale: Ìtumọ̀ yìí gbìyànjú láti pa ìpapọ̀ ọ̀rọ̀ ọjọ́ iwájú àti participle perfect passive mọ́, tí ó lè tọ́ka sí ipò tí a ti mú ṣẹ tẹ́lẹ̀ tí ó sì ń bá a lọ.
- source_word: ἐν οὐρανῷ
  choice: ní ọ̀run
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún ọ̀run gẹ́gẹ́ bí ibùgbé Ọlọ́run.
- source_word: λύσητε
  choice: tú
  rationale: ‘Tú’ jẹ́ òdìkejì àdánidá fún ‘dè,’ ó sì pa àwòrán ìtú sílẹ̀ mọ́ láìfi ìtumọ̀ rẹ̀ mọ́ sí ‘fàyè gbà’ nìkan.
- source_word: ἔσται λελυμένα
  choice: yóò ti di títú
  rationale: Gẹ́gẹ́ bí gbólóhùn àkọ́kọ́, èyí ń fi ipò ọjọ́ iwájú tí ó jẹ́ àbájáde ohun tí a ti ṣe tẹ́lẹ̀ hàn.
theological_decisions:
- issue: Agbára àkókò àti ẹ̀kọ́ ìgbàgbọ́ nínú ọ̀rọ̀ dídè àti títú
  choice: yóò ti di dídè ... yóò ti di títú
  alternative: a ó dè é ... a ó tú u
  rationale: Ìṣètò Gíríìkì ἔσται pẹ̀lú perfect passive participle lè fi ipò kan tí ohun tí a ṣe tẹ́lẹ̀ ti mú wá hàn. Ìtumọ̀ àkọ́kọ́ pa ìdọ́gba láàárín iṣẹ́ ní ayé àti ohun tí ó dúró ní ọ̀run mọ́, láìsọ pé ọ̀run kàn ń fọwọ́ sí ìpinnu ènìyàn, bẹ́ẹ̀ ni kò gbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán ‘dè/tú’ mọ́ dípò fífi ìtumọ̀ rẹ̀ mọ́ sí èèwọ̀ àti ìyọ̀ǹda nìkan.
