revisions:
- from: '“Lóòótọ́ ni mo sọ fún yín: ohunkóhun tí ẹ bá dè ní ayé yóò ti di dídè ní ọ̀run, ohunkóhun tí ẹ bá sì tú ní ayé yóò ti di títú ní ọ̀run.”[a]'
  to: '“Lóòótọ́ ni mo sọ fún yín: ohunkóhun tí ẹ bá dè ní ilẹ̀ ayé yóò ti jẹ́ ohun tí a ti dè ní ọ̀run, ohunkóhun tí ẹ bá sì tú ní ilẹ̀ ayé yóò ti jẹ́ ohun tí a ti tú ní ọ̀run.”[a]'
  rationale: 'Àtúnṣe náà rọ́pò ìṣètò tí kò wọ́pọ̀ ‘di dídè/títú’ pẹ̀lú passive state Yorùbá tí ó ṣe kedere: ‘jẹ́ ohun tí a ti dè/tú.’ Ó pa ìtumọ̀ grammar Gíríìkì ἔσται + perfect passive participle mọ́ gẹ́gẹ́ bí ìpò ọjọ́ iwájú tí ó ní àbájáde ohun tí a ti ṣe, ó sì pa ambiguity ìtumọ̀ ìbílẹ̀ mọ́ nínú àlàyé ẹsẹ̀. ‘Ní ilẹ̀ ayé’ sì mú ìtọ́ka spatial sí γῆ kedere.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:09Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìpilẹ̀ àwòrán ‘dè/tú,’ ìtọ́ka ẹni-púpọ̀, àti ìfaratún ààlà ayé–ọ̀run mọ́. Ṣùgbọ́n ‘yóò ti di dídè/títú’ kò jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọn-dánilẹ́kọ̀ọ́ láti sọ perfect passive náà; ó lè dà bí nominalization tí kò ṣàlàyé ẹni tí a dè tàbí tí a tú. ‘Yóò ti jẹ́ ohun tí a ti dè/tú’ fi ipò tí ó ti wà tẹ́lẹ̀ hàn ní kedere, láìfi ìtumọ̀ ẹ̀kọ́ kan kún un.
  naturalness: ‘Yóò ti di dídè’ àti ‘yóò ti di títú’ kò wọ́pọ̀, wọ́n sì le nira fún òǹkàwé ní kíkà gbangba. Ìlò ‘ní ilẹ̀ ayé’ tún jẹ́ kedere ju ‘ní ayé’ lọ nínú ìfìwéra pẹ̀lú ọ̀run, nítorí ó tọ́ka sí ilẹ̀ ayé dípò ìgbésí ayé tàbí ayé ẹni.
  terminology: ‘Dè’ àti ‘tú’ yẹ, wọ́n sì dá àjọṣe lexical δέω/λύω dúró. ‘Ọ̀run’ yẹ fún οὐρανῷ. ‘Lóòótọ́ ni mo sọ fún yín’ jẹ́ ìbẹ̀rẹ̀ ọ̀rọ̀ aláṣẹ tí ó dára ní Yorùbá òde òní.
  issues:
  - severity: medium
    issue: Ìṣètò ‘yóò ti di dídè ... yóò ti di títú’ kò dára ní Yorùbá.
    rationale: Ó jẹ́ ìṣàkójọpọ̀ infinitive/nominal tí kò fi passive perfect state náà hàn ní èdè àdánidá. ‘Yóò ti jẹ́ ohun tí a ti dè/tú’ ń sọ ‘will have been bound/loosed’ ní kedere.
  - severity: low
    issue: ‘Ní ayé’ lè gbòòrò ju ìtumọ̀ spatial ti ἐπὶ τῆς γῆς lọ.
    rationale: ‘Ní ilẹ̀ ayé’ ṣàlàyé ìyàtọ̀ ilẹ̀ ayé àti ọ̀run dáadáa, láìyí ìtumọ̀ ẹsẹ náà padà.
