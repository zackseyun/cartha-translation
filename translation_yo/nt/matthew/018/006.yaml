id: MAT.18.6
reference: Matthew 18:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: yo
  text: Ṣùgbọ́n ẹnikẹ́ni tí ó bá mú ọ̀kan nínú àwọn ẹni kékeré wọ̀nyí tí wọ́n gbà mí gbọ́ kọsẹ̀[a], ó sàn fún un kí a so òkúta ọlọ ńlá tí kẹ́tẹ́kẹ́tẹ́ ń yí[b] mọ́ ọn lọ́rùn, kí a sì rì í nínú òkun gbalasa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú ọ̀kan nínú àwọn ẹni kékeré wọ̀nyí tí wọ́n gbà mí gbọ́ dẹ́ṣẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí mímú ẹni kọsẹ̀, dẹ́ṣẹ̀, tàbí ṣubú kúrò nínú ìgbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “òkúta ọlọ kẹ́tẹ́kẹ́tẹ́,” èyí ni òkúta ọlọ ńlá tí kẹ́tẹ́kẹ́tẹ́ ń yí.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ní ibú òkun.” Ọ̀rọ̀ Gíríìkì náà tọ́ka ní pàtó sí òkun gbalasa, tí ó jìnnà sí etíkun.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: mú ... kọsẹ̀
  rationale: Ó pa àkàwé Gíríìkì mọ́, ó sì lè tọ́ka sí mímú ẹni dẹ́ṣẹ̀, ṣubú nípa ẹ̀mí, tàbí yí padà kúrò nínú ìgbàgbọ́; àlàyé ẹsẹ̀ ṣàfihàn ìtúmọ̀ rẹ̀ tó gbòòrò.
- source_word: μικρῶν τούτων
  choice: àwọn ẹni kékeré wọ̀nyí
  rationale: Èyí kò fi ìtumọ̀ náà mọ́ àwọn ọmọdé nìkan; ó tún lè tọ́ka sí àwọn ọmọ-ẹ̀yìn tí a kà sí kékeré tàbí aláìlágbára.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: tí wọ́n gbà mí gbọ́
  rationale: Ọ̀rọ̀ Yorùbá àdánidá ni fún gbígbàgbọ́ nínú ẹni, ó sì mọ ẹni tí ‘àwọn ẹni kékeré’ jẹ́.
- source_word: συμφέρει αὐτῷ
  choice: ó sàn fún un
  rationale: Ó sọ èrò àfiwé pé ìyẹn yóò dára jù fún un nínú ìkìlọ̀ líle yìí, dípò ìtumọ̀ gígígírí bí ‘ó ní èrè fún un.’
- source_word: μύλος ὀνικὸς
  choice: òkúta ọlọ ńlá tí kẹ́tẹ́kẹ́tẹ́ ń yí
  rationale: Ó mú ìbáṣepọ̀ òkúta ọlọ náà pẹ̀lú kẹ́tẹ́kẹ́tẹ́ hàn, ó sì ṣàlàyé pé òkúta ńlá tí ẹranko ń yí ni, kì í ṣe òkúta ọlọ ọwọ́.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: so ... mọ́ ọn lọ́rùn
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a so ohun kan yí ọrùn ẹni ká.
- source_word: καταποντισθῇ
  choice: rì í
  rationale: Ó fi hàn pé a mú kí ẹni náà rì sínú omi, ní ìbámu pẹ̀lú fọ́ọ̀mù àìṣe ti Gíríìkì.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: sínú òkun gbalasa
  rationale: πέλαγος tọ́ka sí òkun gbígbòòrò tí ó jìnnà sí etíkun; ‘òkun gbalasa’ sọ àwòrán yẹn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ààlà ìtumọ̀ ‘àwọn ẹni kékeré’
  choice: A túmọ̀ ọ́ ní ọ̀nà gbòòrò gẹ́gẹ́ bí àwọn onígbàgbọ́ tí a kà sí kékeré tàbí aláìlágbára.
  alternative: Àwọn ọmọdé kékeré wọ̀nyí tí wọ́n gbà mí gbọ́.
  rationale: Ọmọdé kan wà nínú àyíká ọ̀rọ̀ náà, ṣùgbọ́n gbólóhùn ‘tí wọ́n gbà mí gbọ́’ lè jẹ́ kí ọ̀rọ̀ náà kan àwọn ọmọ-ẹ̀yìn onírẹ̀lẹ̀ tàbí aláìlágbára pẹ̀lú. Ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹni kékeré’ dípò ‘ọmọdé’ láti pa ìtumọ̀ tó gbòòrò mọ́; a sì tú àwòrán òkúta ọlọ kẹ́tẹ́kẹ́tẹ́ sí ọ̀rọ̀ Yorùbá tó ṣe kedere.
