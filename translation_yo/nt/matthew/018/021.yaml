id: MAT.18.21
reference: Matthew 18:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: yo
  text: Nígbà náà ni Peteru sún mọ́ ọn, ó sì wí pé, “Olúwa, ìgbà mélòó ni arákùnrin mi yóò ṣẹ̀ sí mi, tí màá sì dárí jì í? Títí dé ìgbà méje?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin tàbí arábìnrin mi”; Giriki sọ pé “arákùnrin mi” (akọ ẹyọ kan), ṣùgbọ́n nínú àyíká yìí ó lè tọ́ka sí ẹlẹgbẹ́ ọmọ-ẹ̀yìn lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tó ń tẹ ìtàn síwájú, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: προσελθὼν αὐτῷ
  choice: sún mọ́ ọn
  rationale: Ó fi hàn pé Peteru tọ Jesu wá, ó sì sún mọ́ ọn kí ó tó sọ̀rọ̀.
- source_word: ὁ Πέτρος εἶπεν
  choice: Peteru ... wí pé
  rationale: “Wí pé” ń tẹ̀ lé ọ̀rọ̀ ìpilẹ̀ ní pẹkipẹki, bí ó tilẹ̀ jẹ́ pé ohun tí Peteru sọ jẹ́ ìbéèrè.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ọ̀wọ̀ àti ìtumọ̀ ẹ̀sìn tó lè wà nínú κύριος mọ́.
- source_word: ποσάκις
  choice: ìgbà mélòó
  rationale: Ó béèrè iye ìgbà ní pàtó, ní ìbámu pẹ̀lú “ìgbà méje” tó tẹ̀ lé e.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: yóò ṣẹ̀ sí mi
  rationale: Ó pa ìṣe ọjọ́ iwájú àti ẹ̀ṣẹ̀ tí a ṣe sí ẹni kan mọ́ ní Yorùbá àdánidá.
- source_word: ὁ ἀδελφός μου
  choice: arákùnrin mi
  rationale: Ó tú akọ ẹyọ kan tó wà nínú Giriki jáde ní tààrà, láì fi ìtumọ̀ tó gbòòrò kún ọ̀rọ̀ àkọ́kọ́.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: tí èmi yóò sì dárí jì í
  rationale: “Dárí jì” ni ọ̀rọ̀ Yorùbá tó yẹ fún ìdáríjì nínú àyíká ìwà rere yìí; “yóò” tún pa àkókò ọjọ́ iwájú mọ́.
- source_word: ἕως ἑπτάκις
  choice: Títí di ìgbà méje bí?
  rationale: Ó fi ààlà tí Peteru ń dábàá hàn, ìyẹn pé bóyá kó tó ìgbà méje.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀδελφός nínú àyíká yìí
  choice: A lo “arákùnrin mi” nínú ọ̀rọ̀ pàtàkì.
  alternative: “arákùnrin tàbí arábìnrin mi” tàbí “ẹlẹgbẹ́ ọmọ-ẹ̀yìn mi”
  rationale: Giriki jẹ́ akọ ẹyọ kan, ṣùgbọ́n ó lè dúró fún ẹlẹgbẹ́ ọmọ-ẹ̀yìn lápapọ̀ nínú àyíká náà. A pa fọ́ọ̀mù orísun mọ́ nínú ọ̀rọ̀, a sì ṣàlàyé ìtumọ̀ tó lè gbòòrò nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. “Nígbà náà ni ...” ń mú ìṣàn ìtàn jáde lọ́nà àdánidá; “tí èmi yóò sì” sì mú ìbáṣepọ̀ àwọn gbólóhùn ọjọ́ iwájú méjèèjì ṣe kedere.
