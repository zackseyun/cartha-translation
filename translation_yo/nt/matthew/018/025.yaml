id: MAT.18.25
reference: Matthew 18:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: yo
  text: Ṣùgbọ́n nítorí kò lè san gbèsè náà padà, ọ̀gá náà pàṣẹ pé kí a tà á pẹ̀lú aya rẹ̀, àwọn ọmọ rẹ̀, àti gbogbo ohun tí ó ní[a], kí a sì san gbèsè náà padà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé kí a tà ọkùnrin náà àti ìdílé rẹ̀, kí a sì tà àwọn ohun-ìní rẹ̀, kí owó tí wọ́n bá rí lè lọ sí sísan gbèsè náà.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Ṣùgbọ́n nítorí kò lè san gbèsè náà padà
  rationale: 'Àkójọpọ̀ ọ̀rọ̀ yìí fi ipò tàbí ìdí hàn: kò ní ohun tí yóò fi san ohun tí ó jẹ padà. Gbólóhùn Yorùbá yìí sọ ìtumọ̀ náà ní ọ̀nà àdánidá láì sọ pé kò ní ohun-ìní rárá.'
- source_word: ὁ κύριος
  choice: ọ̀gá náà
  rationale: Nínú àkàwé yìí κύριος ń tọ́ka sí ẹni tí ó jẹ́ ọ̀gá ìránṣẹ́ náà, kì í ṣe orúkọ oyè Ọlọ́run ní tààrà. “Ọ̀gá náà” bá àyíká ìtàn mu, ó sì yàgò fún ìtumọ̀ ẹ̀sìn tí kò ṣe dandan.
- source_word: ἐκέλευσεν
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àṣẹ aláṣẹ kan lélẹ̀; “pàṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tó sì yẹ fún àyíká yìí.
- source_word: πραθῆναι
  choice: pé kí a tà á
  rationale: Aorist passive infinitive náà túmọ̀ sí pé kí àwọn ẹlòmíràn tà á; ìṣètò “pé kí a tà á” jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣe aláìlórúkọ mọ́.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: aya rẹ̀, àwọn ọmọ rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé Giriki lo àfihàn pàtó, ohun tí àyíká ń tọ́ka sí ni aya àti ọmọ ẹni tó jẹ gbèsè; arọ́pò-orúkọ ohun-ìní mú un ṣe kedere ní Yorùbá.
- source_word: πάντα ὅσα ἔχει
  choice: gbogbo ohun tí ó ní
  rationale: Èyí tẹ̀ lé ìtumọ̀ gbooro Giriki, tó kan gbogbo ohun-ìní rẹ̀, láì dín un kù sí irú ohun-ìní kan pàtó.
- source_word: καὶ ἀποδοθῆναι
  choice: kí a sì fi owó náà san gbèsè náà
  rationale: 'Passive infinitive kejì ń sọ ète títà náà: kí ìsanpadà wáyé. Yorùbá nílò àlàyé díẹ̀ sí i láti sọ ìbáṣepọ̀ yìí ní kedere; “owó náà” tọ́ka sí owó tí títà yóò mú wá.'
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé
  choice: ọ̀gá náà
  alternative: olúwa náà
  rationale: Níbí, κύριος jẹ́ ọ̀gá ènìyàn kan nínú ìtàn. “Ọ̀gá náà” pa ìbáṣepọ̀ aláṣẹ mọ́, kò sì mú kí òǹkàwé rò pé ẹsẹ̀ náà ń lo oyè Ọlọ́run ní tààrà.
- issue: Bí a ṣe sọ ohun tí a ó san padà
  choice: gbèsè náà
  alternative: ohun tí ó jẹ
  rationale: Àyíká ẹsẹ̀ ṣáájú fi hàn pé gbèsè owó ni ọ̀rọ̀ náà dá lé. “Gbèsè náà” jẹ́ kedere ní Yorùbá, ṣùgbọ́n kò sọ iye tàbí pé owó títà yóò tó láti san gbogbo rẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìsọ̀rọ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. A yan “ọ̀gá” dípò “olúwa” nítorí àyíká ọ̀gá àti ìránṣẹ́ nínú àkàwé.
