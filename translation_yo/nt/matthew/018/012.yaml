id: MAT.18.12
reference: Matthew 18:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: yo
  text: Kí ni ẹ̀yin rò? Bí ọkùnrin kan bá ní ọgọ́rùn-ún àgùntàn, tí ọ̀kan nínú wọn sì ṣìnà[a], ṣé kò ní fi àwọn mọ́kàndínlọ́gọ́rùn-ún sílẹ̀ lórí àwọn òkè[b], kí ó sì lọ wá èyí tí ń ṣìnà[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ṣáko lọ’ tàbí, ní àwọn àyíká kan, ‘a mú un ṣìnà.’ Ọ̀rọ̀ Giriki náà kò fi hàn kedere níbí bóyá ohun mìíràn ló mú un ṣìnà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘lórí àwọn òkè kéékèèké’ tàbí ‘ní agbègbè olókè.’
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààrà: ‘èyí tí ń ṣìnà’; ní ìtumọ̀ ìbílẹ̀: ‘èyí tí ó sọnù.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Kí ni ẹ̀yin rò?
  rationale: Ọ̀rọ̀ ìbéèrè yìí ń pe àwọn olùgbọ́ láti sọ ìdájọ́ wọn; ó jẹ́ Yorùbá àdánidá, ó sì pa àdírẹ́sì ọ̀pọ̀ ènìyàn mọ́.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Bí ọkùnrin kan bá ní
  rationale: Ìtumọ̀ gbolohun Giriki náà níbí ni pé ohun kan jẹ́ ti ọkùnrin kan. ‘Ọkùnrin kan’ pa akọ ẹyọ tí orísun lò mọ́.
- source_word: ἑκατὸν πρόβατα
  choice: ọgọ́rùn-ún àgùntàn
  rationale: Èyí jẹ́ ìtumọ̀ tààrà fún iye náà àti ẹran tí a mẹ́nu kàn.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: ọ̀kan nínú wọn sì ṣìnà
  rationale: ‘Ṣìnà’ lè sọ pé àgùntàn náà yà kúrò ní ọ̀nà láì pinnu bóyá ó ṣe bẹ́ẹ̀ fúnra rẹ̀ tàbí ohun mìíràn mú un ṣìnà.
- source_word: οὐχὶ ἀφήσει
  choice: ṣé kò ní fi ... sílẹ̀
  rationale: Ìbéèrè Giriki náà ń retí ìdáhùn rere. Ọ̀nà Yorùbá yìí jẹ́ àdánidá, ó sì fi ọjọ́ iwájú ọ̀rọ̀-ìṣe náà hàn.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: àwọn mọ́kàndínlọ́gọ́rùn-ún
  rationale: Èyí ni ọ̀nà Yorùbá tí ó tọ́ láti sọ iye mọ́kàndínlọ́gọ́rùn-ún.
- source_word: ἐπὶ τὰ ὄρη
  choice: lórí àwọn òkè
  rationale: Ó pa àwòrán ilẹ̀ gíga tí ọ̀rọ̀ Giriki ὄρη ń gbé jáde mọ́; ‘àwọn òkè kéékèèké’ tún ṣeé ṣe ní àyíká kan.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: kí ó sì lọ wá
  rationale: Ọ̀rọ̀ aláìlópin tó tẹ̀ lé ọ̀rọ̀-ìṣe pàtàkì ni a sọ gẹ́gẹ́ bí àwọn ìṣe méjì tó so pọ̀, èyí sì jẹ́ Yorùbá àdánidá.
- source_word: τὸ πλανώμενον
  choice: èyí tí ń ṣìnà
  rationale: Ó pa ìṣe tó ń lọ lọ́wọ́ nínú participle Giriki mọ́, ó sì tún ọ̀rọ̀ ‘ṣìnà’ ṣe bí orísun ṣe tún gbòǹgbò ọ̀rọ̀ kan náà lò.
theological_decisions:
- issue: Akọ aṣojú nínú ἀνθρώπῳ
  choice: ọkùnrin kan
  alternative: ẹnì kan
  rationale: Orísun jẹ́ akọ ẹyọ ní gírámà, bó tilẹ̀ jẹ́ pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí aṣojú; ìtumọ̀ náà kò sọ fọ́ọ̀mù yìí di aláìní akọ.
- issue: Ìtumọ̀ πλανάω nínú àpẹẹrẹ àgùntàn
  choice: ṣìnà / èyí tí ń ṣìnà
  alternative: rìn gbéregbère / jẹ́ kí ó ṣìnà / èyí tí ó sọnù
  rationale: ‘Ṣìnà’ pa àwòrán àti agbára ìwà rere ọ̀rọ̀ náà mọ́ láì pinnu pé àgùntàn náà mọ̀ọ́mọ̀ ṣe é tàbí pé ẹlòmíràn tan an jẹ. Kò sì fi ọ̀rọ̀ tó túmọ̀ sí ‘sọnù’ rọ́pò πλανάω.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún àwọn òǹkàwé òde òní. ‘Ṣé kò ní …?’ jẹ́ ìbéèrè Yorùbá àdánidá tó ń retí ìdáhùn pé ‘ó máa ṣe bẹ́ẹ̀.’
