  yaml_path: translation/nt/matthew/018/002.yaml
  text: And calling a child to himself, he stood him in their midst.
translation:
  language: yo
  text: Ó sì pe ọmọ kékeré kan wá sọ́dọ̀ ara rẹ̀, ó sì mú un dúró láàárín wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe ... wá sọ́dọ̀ ara rẹ̀
  rationale: Participial form expressing that Jesus summoned the child to himself; this is natural Yoruba while preserving the direction toward him.
- source_word: παιδίον
  choice: ọmọ kékeré kan
  rationale: Conveys a young child without imposing a sex not explicit in the Greek noun.
- source_word: ἔστησεν
  choice: mú un dúró
  rationale: The causative aorist means that he caused or placed the child to stand, more precisely than merely saying he put the child there.
- source_word: ἐν μέσῳ αὐτῶν
  choice: láàárín wọn
  rationale: Natural Yoruba for being in the midst of the disciples.
theological_decisions: []
translation_notes:
  register: Standard Yorùbá with full tone marks; dignified but readily understandable. The child remains ungendered because the Greek παιδίον is neuter and does not identify the child's sex.
