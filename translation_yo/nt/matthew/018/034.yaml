id: MAT.18.34
reference: Matthew 18:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: yo
  text: Ọ̀gá rẹ̀[a] sì bínú, ó sì fi í fún àwọn olùdáni lóró[b], títí yóò fi san gbogbo ohun tí ó jẹ ní gbèsè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Olúwa.” Ọ̀rọ̀ Gíríìkì náà ni kyrios. Níhìn-ín, ó ń tọ́ka sí ọ̀gá ẹrú náà nínú àkàwé, nítorí náà a lo “ọ̀gá” nínú ẹsẹ.
    reason: alternative_reading
  - marker: b
    text: Tàbí “àwọn olùfìyàjẹni”; ní ìtumọ̀ tí kò lágbára tó bẹ́ẹ̀, “àwọn olùṣọ́ ọgbà ẹ̀wọ̀n.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí ń dáni lóró, kì í ṣe àwọn olùṣọ́ lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: bínú
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist tí ó ń ṣàlàyé ipò ọkàn ọ̀gá náà nígbà tó fi ẹrú náà lé àwọn mìíràn lọ́wọ́. “Bínú” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κύριος
  choice: ọ̀gá
  rationale: Nínú àkàwé yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ẹrú náà ń sìn. “Ọ̀gá” mú ìbáṣepọ̀ inú ìtàn náà hàn kedere, kò sì sọ ọ́ di oyè fún Ọlọ́run tàbí Kristi láìnídí.
- source_word: παρέδωκεν
  choice: fi í lé ... lọ́wọ́
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí fífi ẹni kan sábẹ́ àṣẹ tàbí ìkáwọ́ àwọn ẹlòmíràn, ó sì bá ìtumọ̀ ìdájọ́ inú àyíká ọ̀rọ̀ mu.
- source_word: βασανισταῖς
  choice: àwọn olùdáni lóró
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí ń dáni lóró, kì í ṣe àwọn olùṣọ́ ọgbà ẹ̀wọ̀n lásán. Yíyan ọ̀rọ̀ yìí pa líle ìkìlọ̀ àkàwé náà mọ́.
- source_word: ἕως οὗ
  choice: títí yóò fi
  rationale: Èyí jẹ́ gbólóhùn àkókò Yorùbá tó ṣe déédéé, tó sì fi ibi tí ìṣe náà yóò parí hàn.
- source_word: ἀποδῷ
  choice: san
  rationale: Nínú àyíká gbèsè, “san” ni ọ̀rọ̀ Yorùbá àdánidá fún pípa ohun tí ẹni jẹ padà. “Yóò fi” ṣàfihàn ìṣe tí a retí gẹ́gẹ́ bí ibi tí àkókò náà yóò dópin.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: gbogbo ohun tí ó jẹ ní gbèsè
  rationale: Yíyan yìí tẹ̀ lé ìtumọ̀ gbòòrò pé gbogbo ohun tí ó jẹ ni kí ó san, dípò fífi ọ̀rọ̀ náà mọ́ iye owó kan ṣoṣo.
theological_decisions:
- issue: Bóyá kí a tú κύριος sí oyè “Olúwa”
  choice: ọ̀gá
  alternative: Olúwa
  rationale: Ní ipele ìtàn àkàwé náà, κύριος ni ọ̀gá ẹrú yìí. “Ọ̀gá” pa ìtumọ̀ ìtàn mọ́, ó sì yẹra fún yíyanjú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀ sí i tí àkàwé náà lè ní.
- issue: Bí βασανισταῖς ṣe le tó nínú àkàwé ìdájọ́ yìí
  choice: àwọn olùdáni lóró
  alternative: àwọn olùṣọ́ ọgbà ẹ̀wọ̀n
  rationale: “Àwọn olùdáni lóró” pa líle ọ̀rọ̀ Gíríìkì mọ́ láìsọ ju ohun tí ẹsẹ náà wí lọ nípa irú tàbí iye ìjìyà náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn “fi í lé ... lọ́wọ́” jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìfìjìyà àti fífi ẹni sábẹ́ àṣẹ àwọn mìíràn mọ́.
