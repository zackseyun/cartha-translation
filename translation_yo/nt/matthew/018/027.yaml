id: MAT.18.27
reference: Matthew 18:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: yo
  text: Nígbà náà ni àánú ṣe olúwa ẹrú náà[a]; ó dá a sílẹ̀, ó sì fi gbèsè náà[b] jì í.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Olúwa’ níhìn-ín ni ẹni tó jẹ́ olúwa ẹrú náà nínú àkàwé; kì í ṣe ìtọ́ka tààrà sí Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘owó tí a yá’ tàbí ‘ohun tí a yá’ ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: àánú ṣe
  rationale: Ọ̀rọ̀ Yòrùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé ìyọ́nú jíjinlẹ̀ ru ẹni kan; ó pa agbára ìmọ̀lára tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: δὲ
  choice: Nígbà náà ni
  rationale: Níhìn-ín δέ ń tẹ ìtàn náà síwájú; gbólóhùn yìí mú ìtẹ̀síwájú náà hàn ní Yòrùbá àdánidá.
- source_word: κύριος
  choice: olúwa
  rationale: Ní ìbáṣepọ̀ pẹ̀lú ẹrú, ‘olúwa’ túmọ̀ sí ẹni tó ní àṣẹ lórí rẹ̀. A kọ ọ́ pẹ̀lú lẹ́tà kékeré nítorí ọkùnrin inú àkàwé ni a ń tọ́ka sí ní tààrà, kì í ṣe orúkọ oyè Ọlọ́run.
- source_word: δοῦλου
  choice: ẹrú
  rationale: δοῦλος ń tọ́ka sí ẹni tó wà lábẹ́ ìní àti àṣẹ olúwa; ‘ẹrú’ pa ipò ìdè àti àìdọ́gba àṣẹ inú àkàwé náà mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: ἀπέλυσεν αὐτόν
  choice: ó dá a sílẹ̀
  rationale: Ó fi ìtújáde kúrò ní ìdádúró tàbí ẹ̀bi ojú-ẹsẹ̀ hàn láìfi àlàyé míì tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: τὸ δάνειον
  choice: gbèsè náà
  rationale: Bí ó tilẹ̀ jẹ́ pé δάνειον ní pàtó lè túmọ̀ sí ohun tí a yá, ‘gbèsè’ jẹ́ ọ̀rọ̀ Yòrùbá tó ṣe kedere jù lọ fún ohun tí ọkùnrin náà jẹ ní àyíká yìí; àlàyé ìsàlẹ̀ fi ìtumọ̀ pàtó náà pamọ́.
- source_word: ἀφῆκεν αὐτῷ
  choice: ó sì dárí … jì í
  rationale: Àkópọ̀ ọ̀rọ̀ ‘dárí … jì’ lè sọ ìmúkúrò gbèsè, ó sì tún pa ìró ẹ̀kọ́ ìdáríjì inú Mátíù mọ́ láìyí gbèsè owó náà padà sí ẹ̀ṣẹ̀ ní tààrà.
theological_decisions:
- issue: Bóyá κύριος jẹ́ orúkọ oyè Ọlọ́run níhìn-ín
  choice: A túmọ̀ ọ́ sí ‘olúwa’ pẹ̀lú lẹ́tà kékeré, gẹ́gẹ́ bí olúwa ènìyàn inú àkàwé.
  alternative: ‘Olúwa’ gẹ́gẹ́ bí orúkọ oyè Ọlọ́run, tàbí ‘ọ̀gá’.
  rationale: Ẹni tí àyíká ọ̀rọ̀ tọ́ka sí ní tààrà ni olúwa ẹrú náà. Ìtumọ̀ yìí kò sọ pé Ọlọ́run ni ẹni náà ní tààrà, bẹ́ẹ̀ ni kò dí ìfiwéra ẹ̀kọ́ Ọlọ́run tí àkàwé náà lè ní lọ́wọ́.
- issue: Bí a ṣe máa fi ipò δοῦλος hàn
  choice: ‘ẹrú’
  alternative: ‘ìránṣẹ́’
  rationale: Ìní, àṣẹ, àti gbèsè jẹ́ kókó nínú àkàwé náà; ‘ẹrú’ fi ipò ìdè yẹn hàn láìrẹ̀wẹ̀sì rẹ̀.
- issue: Ìbáṣepọ̀ ìdáríjì àti ìmúkúrò gbèsè
  choice: A lo ‘dárí gbèsè náà jì í’.
  alternative: ‘pa gbèsè náà rẹ́’ tàbí ‘fagilé gbèsè náà’.
  rationale: Ọ̀rọ̀ Gíríìkì ἀφίημι lè túmọ̀ sí fífi ohun sílẹ̀ tàbí ìdáríjì. Ìtumọ̀ tí a yàn pa ìtumọ̀ owó àti ìró ìdáríjì méjèèjì mọ́, láìsọ pé gbèsè náà jẹ́ ẹ̀ṣẹ̀ ní tààrà.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, ni a lò. ‘Àánú ṣe’ jẹ́ àdánidá fún ìyọ́nú jíjinlẹ̀; ‘olúwa’ pẹ̀lú lẹ́tà kékeré yà olúwa ènìyàn inú àkàwé sọ́tọ̀ kúrò ní orúkọ oyè Ọlọ́run. Gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
