id: MAT.18.28
reference: Matthew 18:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ẹrú náà jáde, ó rí ọ̀kan lára àwọn ẹrú ẹlẹgbẹ́ rẹ̀, ẹni tí ó jẹ ẹ ní ọgọ́rùn-ún dínárì[b]. Ó sì mú un, ó sì bẹ̀rẹ̀ sí í pa á lọ́rùn, ó ń wí pé, “San ohunkóhun tí o jẹ mí padà[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀ lé ọ̀rọ̀ Gíríìkì náà pẹ̀kípẹ̀kí: “San padà bí o bá jẹ mí ní ohunkóhun.”'
    reason: lexical_alternative
  - marker: b
    text: Dínárì kan jẹ́ owó iṣẹ́ tí òṣìṣẹ́ tàbí ọmọ ogun kan sábà máa ń gbà fún iṣẹ́ ọjọ́ kan.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλος
  choice: ẹrú
  rationale: “Ẹrú” fi ipò ẹni tí ó wà lábẹ́ ìní àti àṣẹ ọ̀gá hàn, ó sì bá àyíká gbèsè àti ìfipámúni inú àkàwé náà mu ju ọ̀rọ̀ rírọ̀ bí “ìránṣẹ́” lọ.
- source_word: ἐξελθὼν δὲ
  choice: Ṣùgbọ́n nígbà tí ... jáde
  rationale: Ó sọ ìyípadà ìtàn tí δέ ń mú wá, ó sì mú ìtumọ̀ àkókò ti participle aorist náà jáde ní Yorùbá àdánidá.
- source_word: συνδούλων
  choice: àwọn ẹrú ẹlẹgbẹ́ rẹ̀
  rationale: Ó pa ìtumọ̀ σύν- (“ẹlẹgbẹ́”) mọ́, ó sì bá “ẹrú” tí a lò fún δοῦλος mu.
- source_word: ὤφειλεν
  choice: jẹ ẹ́ ní
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan jẹ ẹlòmíràn ní owó; iye owó tó tẹ̀ lé e mú kí ìtumọ̀ náà ṣe kedere.
- source_word: ἑκατὸν δηνάρια
  choice: ọgọ́rùn-ún dínárì
  rationale: A pa orúkọ owó ìgbàanì náà mọ́ kí ìyàtọ̀ láàárín gbèsè yìí àti gbèsè ńlá tí a mẹ́nu kàn ṣáájú má bàjẹ́.
- source_word: κρατήσας
  choice: Ó gbá a mú
  rationale: Gbólóhùn yìí fi líle àti ìfipámúni inú ìṣe náà hàn ní Yorùbá tó wọ́pọ̀.
- source_word: ἔπνιγεν
  choice: ó bẹ̀rẹ̀ sí í fún un lọ́rùn
  rationale: Imperfect náà lè tọ́ka sí ìṣe tó ń lọ tàbí ìbẹ̀rẹ̀ ìṣe; “bẹ̀rẹ̀ sí í” pa apá ìtumọ̀ yìí mọ́, “fún un lọ́rùn” sì sọ ìwà ipá náà kedere.
- source_word: Ἀπόδος
  choice: San ... padà
  rationale: Àṣẹ kíkankíkan nípa gbèsè ni ọ̀rọ̀ náà; “san ... padà” jẹ́ Yorùbá àdánidá fún ìbéèrè ìsanwó.
- source_word: εἴ τι ὀφείλεις
  choice: ohunkóhun tí o jẹ mí
  rationale: “Ohunkóhun” pa ìtumọ̀ aláìnídìí ti εἴ τι mọ́, dípò yíyí i sí iye gbèsè kan pàtó.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àkàwé náà
  choice: ẹrú / àwọn ẹrú ẹlẹgbẹ́ rẹ̀
  alternative: ìránṣẹ́ / àwọn ìránṣẹ́ ẹlẹgbẹ́ rẹ̀
  rationale: Ipò ìdè, àṣẹ ọ̀gá, àti ìfipámúni ṣe pàtàkì nínú àyíká ẹsẹ̀ yìí. “Ẹrú” fi òtítọ́ awujọ inú àkàwé náà hàn láìrẹ̀ ọ́ sílẹ̀, láì sì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kankan kún un.
translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó bójú mu, tó ní àmì ohùn níbi tí ó bá yẹ, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Ìtàn náà dúró ní ìforígbárí àti líle rẹ̀; a kò rọ “ẹrú” tàbí ìṣe fífúnni lọ́rùn sí ọ̀rọ̀ tí kò lágbára. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
