id: MAT.18.1
reference: Matthew 18:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: yo
  text: Ní àkókò náà, àwọn ọmọ-ẹ̀yìn wá sí ọ̀dọ̀ Jesu, wọ́n wí pé, “Ta ni ó tóbi ju àwọn ẹlòmíràn lọ ní ìjọba ọ̀run?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Ní àkókò náà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtọ́kasí àkókò yìí, ó sì pa ìtumọ̀ Gíríìkì mọ́.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: tọ Jesu wá
  rationale: Ọ̀rọ̀ yìí sọ pé wọ́n sún mọ́ Jesu tàbí wọ́n wá bá a; ‘tọ Jesu wá’ jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: λέγοντες
  choice: wọ́n sì béèrè pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni ‘wọ́n ń sọ pé,’ ohun tí ó tẹ̀ lé jẹ́ ìbéèrè; yíyan ‘béèrè’ mú kí Yorùbá jẹ́ àdánidá láì yí iṣẹ́ ọ̀rọ̀ náà padà.
- source_word: Τίς ἄρα
  choice: Ta ní ó ha
  rationale: ‘Ha’ fi ìbéèrè tí ἄρα ń tẹnumọ́ hàn láì fi ìtumọ̀ míì kún un.
- source_word: μείζων
  choice: pọ̀jù
  rationale: μείζων jẹ́ fọ́ọ̀mù afiwéra (‘tóbi/pọ̀ ju’), kì í ṣe fọ́ọ̀mù gíga jù lọ. Nínú ìbéèrè yìí, Yorùbá ‘ta ... pọ̀jù’ jẹ́ àdánidá, ó sì pa ìfarahàn afiwéra náà mọ́.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ní ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ní iyì fún gbólóhùn Mátíù yìí.
theological_decisions:
- issue: Bóyá a ó tú μείζων sí ‘ẹni tí ó tóbi jù lọ’ tàbí ‘ẹni tí ó pọ̀jù’
  choice: Ta ní ó ha pọ̀jù
  alternative: Ta ni ó tóbi jù lọ
  rationale: A pa ìrísí afiwéra Gíríìkì mọ́, ní ìbámu pẹ̀lú ẹ̀rí orísun àti àtúnṣe POB Gẹ̀ẹ́sì; a kò sọ ọ́ di superlative ní kedere.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘Jesu’ gẹ́gẹ́ bí àkọsílẹ̀ orúkọ tí ó wọ́pọ̀ nínú Yorùbá.
