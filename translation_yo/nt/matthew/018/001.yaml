  rationale: Àtúnṣe náà mú ọ̀nà ìwàásí àwọn ọmọ-ẹ̀yìn sí Jesu di Yorùbá àdánidá, ó sì ṣàlàyé ìpele afiwéra ti μείζων nípasẹ̀ ìlànà ‘ju ... lọ.’ ‘Wọ́n wí pé’ ń tẹ̀lé λέγοντες pẹkipẹki, nígbà tí ìbéèrè tí ó tẹ̀ lé e ń jẹ́ kí ìtumọ̀ náà rọrùn láti ka.
