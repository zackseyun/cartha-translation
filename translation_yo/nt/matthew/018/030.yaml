source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: yo
  text: Ṣùgbọ́n kò fẹ́[a]. Dípò bẹ́ẹ̀, ó lọ, ó sì jù ú sínú ẹ̀wọ̀n[b] títí yóò fi san ohun tí ó jẹ gbèsè[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kọ̀”; èdè Gíríìkì túmọ̀ ní tààrà pé, “kò fẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó fi í sínú ẹ̀wọ̀n”; ọ̀rọ̀-ìṣe Gíríìkì náà lágbára sí i, ó túmọ̀ ní tààrà pé ó “jù” tàbí ó “sọ ọ́ sínú ẹ̀wọ̀n.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “iye tí ó jẹ gbèsè” tàbí “gbèsè náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ṣùgbọ́n kò
  rationale: A tọ́ka sí ìránṣẹ́ àkọ́kọ́ pẹ̀lú ẹni-kẹta tí ó fara hàn nínú ọ̀rọ̀-ìṣe “kò”; “Ṣùgbọ́n” sì pa ìyàtọ̀ tí δέ mú wá mọ́.
- source_word: οὐκ ἤθελεν
  choice: kò fẹ́
  rationale: Èyí pa ìtumọ̀ ìfẹ́ tàbí ìmúratán inú θέλω mọ́ láì mú un le ju bí “ó kọ̀” ṣe lè rí.
- source_word: ἀλλὰ
  choice: Dípò bẹ́ẹ̀
  rationale: Ó fi ìyàtọ̀ líle hàn láàárín ẹ̀bẹ̀ ẹlẹgbẹ́ rẹ̀ àti ohun tí ó ṣe lẹ́yìn náà.
- source_word: ἀπελθὼν
  choice: ó lọ
  rationale: A tú participle aorist náà sí gbólóhùn Yorùbá àdánidá, nígbà tí a sì pa bí ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: ó sì jù ú sínú ẹ̀wọ̀n
  rationale: “Jù ... sínú” pa agbára àti ìkà tí βάλλω ní nínú àyíká yìí mọ́ ju ọ̀rọ̀ aláìlágbára bí “fi ... sí” lọ.
- source_word: ἕως οὗ
  choice: títí yóò fi
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti fi ààlà àkókò àti ohun tí a ń retí pé yóò ṣẹlẹ̀ hàn.
- source_word: ἀποδῷ
  choice: san
  rationale: “San” bá ìsanwó padà mu, ó sì ṣiṣẹ́ dáadáa pẹ̀lú ìṣètò “títí yóò fi,” èyí tí ó pa ìfojúsọ́nà ìparí iṣẹ́ náà mọ́.
- source_word: τὸ ὀφειλόμενον
  choice: ohun tí ó jẹ
  rationale: Èyí tẹ̀ lé participle tí a lò gẹ́gẹ́ bí orúkọ—“ohun tí a jẹ ní gbèsè”—ní ọ̀nà Yorùbá tó ṣe déédé, láì dín un kù sí orúkọ “gbèsè” nìkan.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní àmì ohùn, tó bọ́gbọ́n mu, tó sì ní iyì. Gbólóhùn méjì mú ìtakora ἀλλά hàn kedere, nígbà tí “jù ú sínú ẹ̀wọ̀n” pa líle ìṣe náà mọ́.
