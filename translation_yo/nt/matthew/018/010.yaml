id: MAT.18.10
reference: Matthew 18:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: yo
  text: “Ẹ ṣọ́ra kí ẹ má ṣe kẹ́gàn ọ̀kan nínú àwọn kékeré wọ̀nyí.[a] Nítorí mo sọ fún yín pé àwọn áńgẹ́lì wọn ní ọ̀run máa ń rí ojú Baba mi tí ń bẹ ní ọ̀run nígbà gbogbo.[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ má ṣe wo ọ̀kan nínú àwọn kékeré wọ̀nyí fojú kéré.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn áńgẹ́lì wọn” lè túmọ̀ sí àwọn áńgẹ́lì tí ó ní ìbáṣepọ̀ pẹ̀lú àwọn kékeré wọ̀nyí tàbí tí ń ṣojú wọn; ẹsẹ yìí nìkan kò pinnu gbogbo ẹ̀kọ́ nípa àwọn áńgẹ́lì aláàbò.
    reason: alternative_reading
  - marker: c
    text: Ní Gíríìkì, “ní àwọn ọ̀run” àti “tí ń bẹ ní àwọn ọ̀run”; a túmọ̀ rẹ̀ ní Yorùbá àdánidá sí “ní ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Ẹ ṣọ́ra kí ẹ má ṣe kẹ́gàn
  rationale: Ọ̀rọ̀ ìṣọ́ra tí ó tẹ̀ lé e pẹ̀lú ìkìlọ̀ ni gírámà Gíríìkì náà fi hàn. ‘Ẹ ṣọ́ra’ jẹ́ Yorùbá àdánidá, ‘kẹ́gàn’ sì pa ìtumọ̀ ṣíṣe ẹnì kan ní ẹni tí kò ṣe pàtàkì mọ́.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: ọ̀kan nínú àwọn kékeré wọ̀nyí
  rationale: Ó pa ààyè ìtumọ̀ μικρῶν mọ́, bóyá àwọn ọmọ kéékèèké tàbí àwọn ẹni rírẹ̀lẹ̀ tí a kà sí kékeré, láì fi sí ọmọ nìkan.
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe déédé fún gbólóhùn ìṣàlàyé tí γάρ mú wọlé.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: àwọn áńgẹ́lì wọn
  rationale: Ó túmọ̀ ìbáṣepọ̀ ohun-ìní náà tààrà láì pinnu pé olúkúlùkù ní áńgẹ́lì aláàbò tirẹ̀.
- source_word: ἐν οὐρανοῖς
  choice: ní ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì náà, ‘ní ọ̀run’ ni àṣà Yorùbá tó bójú mu fún ibi tí Ọlọ́run wà.
- source_word: διὰ παντὸς
  choice: nígbà gbogbo
  rationale: Ó ṣàfihàn ìtumọ̀ ohun tí ń ṣẹlẹ̀ ní gbogbo ìgbà tàbí láìdáwọ́dúró.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: máa ń rí ojú
  rationale: Ó pa àwòrán ojú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, ó sì lè tọ́ka sí àǹfààní wíwà níwájú Ọlọ́run.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Baba mi tí ń bẹ ní ọ̀run
  rationale: Ó pa ọ̀rọ̀ ìbátan Jésù, ‘Baba mi,’ àti gbólóhùn ibi tí ó ń ṣe àpèjúwe rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn áńgẹ́lì wọn’
  choice: Fi gbólóhùn náà sílẹ̀ gẹ́gẹ́ bí ‘àwọn áńgẹ́lì wọn’ láì sọ ọ́ di ẹ̀kọ́ pé ẹni kọ̀ọ̀kan ní áńgẹ́lì aláàbò tirẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí àwọn áńgẹ́lì aláàbò ẹni kọ̀ọ̀kan, tàbí sí àwọn áńgẹ́lì tí ń ṣojú tàbí tí ń ṣe ìránṣẹ́ fún àwọn kékeré náà.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ‘àwọn áńgẹ́lì wọn,’ ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé irú ìbáṣepọ̀ náà ní kíkún. Ìtumọ̀ náà pa àìdánilójú tó wà nínú ọrọ̀ mọ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ẹ/yín’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí Gíríìkì, a sì pa àwòrán ‘rí ojú’ mọ́. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó yẹ.
