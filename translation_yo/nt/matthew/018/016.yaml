  source_fidelity: Ìtumọ̀ náà gba ète ìlànà ἵνα, ìfikún ἔτι, àti ìtumọ̀ òfin ti πᾶν ῥῆμα/σταθῇ dáadáa. Ṣùgbọ́n “fetí sílẹ̀” kì í ṣe ọ̀nà tó péye nínú Yorùbá fún ἀκούσῃ nínú àyíká yìí; “tẹ́tí sí ọ” ṣàfihàn ìgbọ́ pẹ̀lú ìfẹ́sí/ìgbọ́ràn, ó sì mú aṣojú ẹni kejì tí a lérò nínú àyíká tó ṣáájú hàn. “Pẹ̀lú rẹ” tún lè dà bí ẹni pé ó ń tọ́ka sí arákùnrin tí ó ṣẹ̀, kì í ṣe ẹni tí a ń bá sọ̀rọ̀.
  naturalness: Àwọn apá púpọ̀ jẹ́ Yorùbá tó ye ẹni, ṣùgbọ́n “ní ẹnu ẹlẹ́rìí” jẹ́ ìtúmọ̀-lẹ́tà tí kò rọrùn nínú Yorùbá òde òní. “Nípasẹ̀ ẹ̀rí ẹlẹ́rìí” jẹ́ ọ̀nà adayeba nígbà tí àlàyé ìsàlẹ̀-ojúewé lè pa ọ̀rọ̀-ìbílẹ̀ náà mọ́. “Mú ... bá ọ lọ” sì jẹ́ kedere ju “mú ... lọ pẹ̀lú rẹ” lọ.
