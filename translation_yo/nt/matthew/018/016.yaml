  to: Ṣùgbọ́n bí kò bá tẹ́tí sí ọ, mú ẹnì kan tàbí méjì mìíràn bá ọ lọ, kí gbogbo ọ̀ràn lè fìdí múlẹ̀ nípasẹ̀ ẹ̀rí ẹlẹ́rìí méjì tàbí mẹ́ta.[a][b]
  rationale: Àtúnṣe náà ṣe kedere ẹni tí a gbọ́/tí a ń bá lọ, ó sì lo Yorùbá òde òní tó rọrùn fún èdè ẹ̀rí òfin. Ó tún pa ìtumọ̀ ìdí, iye àwọn ẹlẹ́rìí, àti ìwòye pé gbogbo ọ̀ràn ni a máa fìdí múlẹ̀ mọ́. Àlàyé ìsàlẹ̀-ojúewé pa ìtumọ̀ “ní ẹnu” àti ìtọ́kasí Diutarónómì mọ́ láì fi ìtúmọ̀-lẹ́tà tí kò rọrùn sínú ọ̀rọ̀ àkọ́kọ́.
