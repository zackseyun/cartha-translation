  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: yo
  text: Ṣùgbọ́n bí kò bá tẹ́tí sí ọ, mú ẹnì kan tàbí méjì mìíràn bá ọ lọ, kí gbogbo ọ̀ràn lè fìdí múlẹ̀ nípasẹ̀ ẹ̀rí ẹlẹ́rìí méjì tàbí mẹ́ta.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ náà, “ní ẹnu ẹlẹ́rìí méjì tàbí mẹ́ta.”
    reason: lexical_alternative
  - marker: b
    text: Èyí ń tọ́ka sí Diutarónómì 19:15, níbi tí a ti fi ọ̀ràn kan múlẹ̀ nípasẹ̀ ẹlẹ́rìí méjì tàbí mẹ́ta.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: fetí sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìbáwí yìí, ọ̀rọ̀ náà túmọ̀ sí gbígbọ́ pẹ̀lú ìfiyèsí àti ìgbọ́ràn, kì í ṣe pé ohùn kàn wọ etí.
- source_word: παράλαβε μετὰ σοῦ
  choice: mú ... lọ pẹ̀lú rẹ
  rationale: Èyí fi àṣẹ láti mú àwọn ènìyàn mìíràn bá ẹni náà lọ hàn ní Yorùbá àdánidá.
- source_word: ἔτι ἕνα ἢ δύο
  choice: ẹnì kan tàbí méjì mìíràn
  rationale: “Mìíràn” mú ìtumọ̀ ἔτι jáde pé àwọn wọ̀nyí jẹ́ àfikún sí ẹni tí ó kọ́kọ́ lọ.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣọ̀kan yìí sọ ète ìgbésẹ̀ náà jáde lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: ní ẹnu ẹlẹ́rìí méjì tàbí mẹ́ta
  rationale: A pa àwòrán èdè òfin Semitic àti ìtọ́kasí sí Diutarónómì 19:15 mọ́, bí ó tilẹ̀ jẹ́ pé ó túmọ̀ sí nípa ẹ̀rí wọn.
- source_word: σταθῇ
  choice: lè fìdí múlẹ̀
  rationale: Nínú àyíká òfin, ọ̀rọ̀ náà ń sọ nípa fífi ọ̀ràn kan múlẹ̀ tàbí jíjẹ́rìí sí i.
- source_word: πᾶν ῥῆμα
  choice: gbogbo ọ̀ràn
  rationale: Bí ó tilẹ̀ jẹ́ pé ó lè jẹ́ “gbogbo ọ̀rọ̀” ní tààrà, àyíká òfin àti ìtọ́kasí Májẹ̀mú Láéláé fi “gbogbo ọ̀ràn” hàn gẹ́gẹ́ bí ìtumọ̀ tó yẹ jù.
theological_decisions:
- issue: Ìtọ́kasí sí òfin ẹlẹ́rìí Májẹ̀mú Láéláé nínú ìbáwí àwùjọ àwọn onígbàgbọ́
  choice: Pa àpẹẹrẹ “ní ẹnu ẹlẹ́rìí” mọ́, kí a sì lo “gbogbo ọ̀ràn” fún ipa òfin rẹ̀.
  alternative: “Kí ẹ̀rí ẹlẹ́rìí méjì tàbí mẹ́ta lè fi gbogbo ẹ̀sùn múlẹ̀.”
  rationale: Ìtumọ̀ tí a yàn pa ìró Diutarónómì 19:15 àti àìdánilójú tó wà nínú πᾶν ῥῆμα mọ́, láì dín un kù sí “ẹ̀sùn” nìkan.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Fetí sílẹ̀” ṣàfihàn àìgbọ́ràn nínú àyíká náà; “ní ẹnu” pa àwòrán orísun Gíríìkì àti ìtọ́kasí òfin Heberu mọ́.
