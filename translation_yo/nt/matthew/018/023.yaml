id: MAT.18.23
reference: Matthew 18:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: yo
  text: Nítorí ìdí yìí, a fi ìjọba ọ̀run wé ọba kan tí ó fẹ́ ṣe ìṣírò pẹ̀lú àwọn ẹrú rẹ̀.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, δοῦλοι, lè túmọ̀ sí ẹrú tàbí ìránṣẹ́, ṣùgbọ́n ó tẹnumọ́ pé wọ́n wà ní ìdè lábẹ́ ọba.
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, “a mú un dàbí” tàbí “a fi í wé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi ìdí ìtàn àkàwé yìí múlẹ̀ gẹ́gẹ́ bí àbájáde tàbí àlàyé ohun tí ó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ὡμοιώθη
  choice: a fi ... wé
  rationale: Ìṣe aláìṣe ὁμοιόω túmọ̀ sí pé ‘a fi wé’ tàbí ‘a mú kí ó jọ’; yíyan yìí pa ìrísí ìfiwéra àti ohùn aláìṣe náà mọ́ láìsọ ọ́ di ‘jẹ́ bí.’
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni gbólóhùn Mattiu fún ìṣàkóso ọ̀run; ẹyọ ‘ọ̀run’ jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ọba kan
  rationale: βασιλεῖ ń ṣàlàyé irú ẹni tí ἀνθρώπῳ jẹ́; ‘ọba kan’ sọ ìtumọ̀ náà ní Yorùbá kedere láìfi ọ̀rọ̀ àfikún tí kò pọndandan sí i.
- source_word: ἠθέλησεν
  choice: tí ó fẹ́
  rationale: Ó sọ ìfẹ́ tàbí ète ọba náà ní èdè Yorùbá òde òní tí ó rọrùn.
- source_word: συνᾶραι λόγον
  choice: ṣe ìṣírò
  rationale: Àkópọ̀ ọ̀rọ̀ náà tọ́ka sí ṣíṣe àyẹ̀wò àti mímú àkọọ́lẹ̀ owó wá sí ìparí; ‘ṣe ìṣírò pẹ̀lú’ bá àyíká ìṣírò gbèsè mu.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: pẹ̀lú àwọn ẹrú rẹ̀
  rationale: δοῦλοι níbí ń tẹnumọ́ ipò àwọn tí ó wà lábẹ́ àṣẹ ọba tí wọn kò sì ní òmìnira; ‘ẹrú’ fi ipò ìdè náà hàn ju ‘ìránṣẹ́’ lọ.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àkàwé ọba àti ìṣírò gbèsè
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àṣẹ ọba lórí wọn àti ọ̀ràn gbèsè mú kí ipò ìdè wọn ṣe pàtàkì. ‘Ẹrú’ pa ìtumọ̀ líle ti δοῦλος mọ́; àkọsílẹ̀ ẹsẹ̀ fi ‘ìránṣẹ́’ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó wọ́pọ̀.
- issue: Bí a ṣe lè gbé ìfiwéra ìjọba ọ̀run àti ọba kalẹ̀
  choice: a fi ìjọba ọ̀run wé ọba kan
  alternative: ìjọba ọ̀run dàbí ọba kan
  rationale: Yíyan náà pa ohùn aláìṣe ὡμοιώθη mọ́, kò sì yanjú ìdààmú àkàwé náà nípa ṣíṣe ọba náà ní kíkún dọ́gba pẹ̀lú ìjọba.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀, ọ̀wọ̀, àti òde òní pẹ̀lú àmì ohùn ní kíkún. ‘Ṣe ìṣírò pẹ̀lú’ jẹ́ kedere fún àyíká gbèsè, nígbà tí ‘ẹrú’ pa agbára àṣẹ ọba àti ipò ìdè δοῦλοι mọ́.
