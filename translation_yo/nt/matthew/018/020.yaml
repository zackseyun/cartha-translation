id: MAT.18.20
reference: Matthew 18:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: yo
  text: Nítorí níbi tí ẹni méjì tàbí mẹ́ta bá péjọ ní orúkọ mi, níbẹ̀ ni mo wà láàárín wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: níbi tí
  rationale: Ó ṣí gbólóhùn ibi sílẹ̀; “níbi tí” jẹ́ ọ̀nà àdánidá ní Yorùbá, láì fi ìtumọ̀ “níbikíbi” tí ó gbòòrò sí i kún un.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ipa àlàyé tí ó so ọ̀rọ̀ yìí mọ́ àyíká ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: δύο ἢ τρεῖς
  choice: ẹni méjì tàbí mẹ́ta
  rationale: Fífi “ẹni” kún un mú kí ó ṣe kedere ní Yorùbá pé àwọn ènìyàn ni a ń sọ̀rọ̀ nípa wọn, láì yí iye náà padà.
- source_word: συνηγμένοι
  choice: bá péjọ
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún wíwà ní àpapọ̀ gẹ́gẹ́ bí àbájáde kíkóra jọ; ìṣètò “bá” náà bá gbólóhùn ibi mu dáadáa.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: ní orúkọ mi
  rationale: Èyí ni gbólóhùn Yorùbá tó mọ́gbọ́n dání fún pípéjọ pẹ̀lú ìtọ́kasí sí Jésù, lábẹ́ àṣẹ rẹ̀, tàbí nítorí ìfaramọ́ sí i; “sínú orúkọ mi” kì í ṣe àdánidá níbí.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ó bá “níbi tí” sọ̀rọ̀ pọ̀, ó sì pa ìlànà “níbi tí … níbẹ̀” inú Gíríìkì mọ́.
- source_word: εἰμι
  choice: ni mo wà
  rationale: Ó pa ìsọ̀rọ̀ tààrà ti “mo wà” mọ́, láì fi ìtumọ̀ àlàyé bí “mo wà pẹ̀lú wọn” kún un.
- source_word: ἐν μέσῳ αὐτῶν
  choice: láàárín wọn
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì pa àwòrán pé Jésù wà ní àárín wọn mọ́.
theological_decisions:
- issue: Ìtumọ̀ nípa wíwà Kristi láàárín àwọn ọmọ-ẹ̀yìn tí wọ́n péjọ
  choice: A sọ ọ́ ní tààrà pé Jésù wà láàárín àwọn tí wọ́n péjọ ní orúkọ rẹ̀.
  alternative: A lè sọ ọ́ ní ọ̀nà àlàyé pé “mo wà pẹ̀lú wọn,” tàbí kí a so ó mọ́ ẹ̀kọ́ ìjọ tàbí ẹ̀kọ́ sacramenti kan pàtó.
  rationale: Ẹsẹ̀ náà fi ìwàníhìn-ín Jésù múlẹ̀, ṣùgbọ́n kò ṣàlàyé irú tàbí ọ̀nà ìwàníhìn-ín náà; ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà tẹ̀lé àkójọpọ̀ “níbi tí … níbẹ̀” ti orísun, ṣùgbọ́n ó jẹ́ àdánidá ní Yorùbá.
