  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà tọ́ka dáadáa sí gbogbo àwọn èròjà Gíríìkì: οὗ γάρ (“Nítorí níbi tí”), δύο ἢ τρεῖς (“ẹni méjì tàbí mẹ́ta”), συνηγμένοι (“bá péjọ”), εἰς τὸ ἐμὸν ὄνομα (“ní orúkọ mi”), àti ìbáṣepọ̀ οὗ ... ἐκεῖ (“níbi tí ... níbẹ̀”). “Ní orúkọ mi” pa ìtumọ̀ gbólóhùn náà mọ́ láì dín un sí ìtumọ̀ ẹ̀kọ́ ìjọ kan. “Láàárín wọn” sì túmọ̀ ἐν μέσῳ αὐτῶν ní ìbámu pẹ̀lú àwòrán orísun náà.'
  naturalness: 'Gbólóhùn náà jẹ́ Yorùbá ìgbàlódé tó rọrùn, tó sì ní ìforígbárí àdánidá: “Nítorí níbi tí ... bá péjọ ..., níbẹ̀ ni mo wà láàárín wọn.” Lílò “bá péjọ” nínú gbólóhùn ìlànà gbogbogbò jẹ́ àdánidá, ó sì ṣàfihàn ipò ìpéjọ láì fi ìtumọ̀ míì kún un. Àmì ohùn wà ní ibi tí ó yẹ.'
  terminology: “Orúkọ mi” jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún εἰς τὸ ἐμὸν ὄνομα nínú àyíká yìí. “Mo wà láàárín wọn” jẹ́ ìtumọ̀ tààrà, tí kò pinnu irú ìwàníhìn-ín Kristi ní ọ̀nà ẹ̀kọ́ ìsìn pàtó.
