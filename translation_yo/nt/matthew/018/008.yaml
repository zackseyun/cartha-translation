  to: Bí ọwọ́ rẹ tàbí ẹsẹ̀ rẹ bá mú ọ kọsẹ̀[a], gé e kúrò, kí o sì jù ú kúrò lọ́dọ̀ rẹ. Ó sàn fún ọ láti wọ inú ìyè ní àbùkù ọwọ́ tàbí ní arọ, ju pé o ní ọwọ́ méjì tàbí ẹsẹ̀ méjì, kí a sì sọ ọ sínú iná ayérayé.
