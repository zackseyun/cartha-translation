id: MAT.18.8
reference: Matthew 18:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: yo
  text: Bí ọwọ́ rẹ tàbí ẹsẹ̀ rẹ bá mú ọ kọsẹ̀[a], gé e kúrò, kí o sì jù ú kúrò lọ́dọ̀ rẹ. Ó sàn fún ọ láti wọ inú ìyè ní àbùkù ọwọ́ tàbí ní arọ, ju pé o ní ọwọ́ méjì tàbí ẹsẹ̀ méjì, kí a sì sọ ọ sínú iná ayérayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú ọ dẹ́ṣẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ ní tààrà pé “mú ọ kọsẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: mú ọ kọsẹ̀
  rationale: Ó pa àwòrán ìkọsẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí dídẹ́sẹ̀ nípa ìwà láì sọ ìtumọ̀ náà di ohun kan ṣoṣo.
- source_word: ἔκκοψον
  choice: gé e kúrò
  rationale: Àṣẹ yìí lágbára, ó sì bá gígé ọwọ́ tàbí ẹsẹ̀ kúrò mu ní Yorùbá àdánidá.
- source_word: βάλε ἀπὸ σοῦ
  choice: jù ú sọnù kúrò lọ́dọ̀ rẹ
  rationale: Ó fi ìṣe jíjù àti mímú ohun náà jìnnà sí ẹni náà hàn kedere.
- source_word: καλόν σοί ἐστιν
  choice: Ó sàn fún ọ
  rationale: Nínú ìfiwéra tí ἢ ń darí, καλόν ní ìtumọ̀ pé ohun kan sàn ju èkejì lọ.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: láti wọ inú ìyè
  rationale: Ó pa ọ̀rọ̀ ‘ìyè’ àti àwòrán wíwọ inú rẹ̀ mọ́ láì fi ‘ayérayé’ kún ibi tí Gíríìkì kò ti lò ó.
- source_word: κυλλὸν ἢ χωλόν
  choice: pẹ̀lú ọwọ́ kan tàbí ní arọ
  rationale: 'Ìtumọ̀ ọ̀rọ̀-mejèèjì ni a sọ ní ọ̀nà Yorùbá tó ṣe kedere nínú àyíká gígé ọwọ́ tàbí ẹsẹ̀ kúrò: ẹni tí ọwọ́ kan kù àti ẹni tí kò lè rìn dáadáa.'
- source_word: βληθῆναι
  choice: kí a sọ ọ
  rationale: Ilana aláìlórúkọ ‘kí a sọ ọ’ fi ohùn àìṣe Gíríìkì hàn ní Yorùbá láì dá ẹni tó ń ṣe ìṣe náà mọ̀.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: iná ayérayé
  rationale: Nínú àyíká ìdájọ́ yìí, αἰώνιον ń ṣàpèjúwe iná tí kò ní òpin.
theological_decisions:
- issue: Bóyá kí σκανδαλίζει di ọ̀rọ̀ ìwà ‘mú ọ ṣẹ̀’ tàbí kí àwòrán ìkọsẹ̀ dúró
  choice: mú ọ kọsẹ̀
  alternative: mú ọ ṣẹ̀
  rationale: Àṣàyàn náà pa àwòrán Gíríìkì mọ́, nígbà tí àyíká ṣì jẹ́ kí ipa rẹ̀ lórí ẹ̀ṣẹ̀ hàn.
- issue: Ìtumọ̀ ‘ìyè’ nínú εἰς τὴν ζωὴν
  choice: ìyè
  alternative: ìyè ayérayé
  rationale: Àyíká náà ní ìtumọ̀ ọjọ́ iwájú àti ìgbàlà, ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí kàn sọ ‘ìyè’; a kò fi ọ̀rọ̀ míì kún un.
- issue: Bóyá àṣẹ gígé ẹ̀yà ara jẹ́ àkàwé tàbí àṣẹ gangan
  choice: pa àṣẹ líle àti àwòrán gígé kúrò mọ́
  alternative: ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìpè sí ìrònúpìwàdà tó jinlẹ̀
  rationale: Ẹsẹ náà fúnra rẹ̀ kò tú bí a ṣe gbọ́dọ̀ lóye àwòrán náà; ìtumọ̀ kò yẹ kí ó yanjú ìṣòro ìtumọ̀ yẹn ní ipò òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó níyì ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn ‘pẹ̀lú ọwọ́ kan tàbí ní arọ’ jẹ́ ọ̀nà tó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìyàtọ̀ láàárín àbùkù ọwọ́ àti àìlera ẹsẹ̀ mọ́.
