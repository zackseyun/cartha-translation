id: MAT.18.29
reference: Matthew 18:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: yo
  text: Nítorí náà, ẹrú ẹlẹgbẹ́ rẹ̀[a] wólẹ̀, ó sì ń bẹ̀ ẹ́ pé, “Ṣe sùúrù pẹ̀lú mi, èmi yóò sì san án padà fún ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìránṣẹ́ ẹlẹgbẹ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí ó ní ọ̀gá kan náà pẹ̀lú ẹlòmíràn; a lo “ẹrú ẹlẹgbẹ́” níbí nítorí ipò ìdè náà ṣe pàtàkì nínú àkàwé yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: σύνδουλος
  choice: ẹrú ẹlẹgbẹ́ rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí ó jẹ́ ẹrú lábẹ́ ọ̀gá kan náà pẹ̀lú ẹlòmíràn. “Ẹrú ẹlẹgbẹ́” mú ipò ìdè àti àṣẹ ọ̀gá tí ó ṣe pàtàkì nínú àkàwé náà hàn kedere ju “ìránṣẹ́ ẹlẹgbẹ́” lọ.
- source_word: παρεκάλει
  choice: ó sì ń bẹ̀ ẹ́
  rationale: Àkókò imperfect nínú Gíríìkì lè fi ìrawọ́ ẹ̀bẹ̀ tí ń tẹ̀ síwájú hàn; “ń bẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹ̀bẹ̀ onítara yìí.
- source_word: Μακροθύμησον
  choice: Ṣe sùúrù
  rationale: Àṣẹ náà ń béèrè fún ìfaradà àti fífún ẹni ní àkókò; “ṣe sùúrù” jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere, tí kò sì ní ìró àtijọ́.
- source_word: ἐπ’ ἐμοί
  choice: pẹ̀lú mi
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe μακροθυμέω, gbólóhùn yìí túmọ̀ sí fífi sùúrù hàn sí ẹnì kan; “pẹ̀lú mi” bá ìlò Yorùbá mu.
- source_word: ἀποδώσω
  choice: èmi yóò sì san án padà
  rationale: Ní àyíká gbèsè, “san án padà” sọ ìdáhùn ohun tí a jẹ ní gbèsè ní kedere. “Èmi” tún mú ìlérí náà lágbára, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ń fi ẹni tí yóò san án hàn.
- source_word: πεσὼν
  choice: wólẹ̀
  rationale: Ó tọ́ka sí ìṣe ti ara ẹni tí ó ṣubú sílẹ̀ nígbà ẹ̀bẹ̀; “wólẹ̀” jẹ́ kúkúrú, ó sì dá ìfarabalẹ̀ yẹn mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Asopọ̀ yìí ń so ìṣe náà mọ́ ohun tí ó ṣẹlẹ̀ ṣáájú, ó sì lè ní agbára ìyọrísí. “Nítorí náà” pa ìbáṣepọ̀ yẹn mọ́ ní èdè Yorùbá tó bójú mu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ èdè δοῦλος inú σύνδουλος
  choice: Lo “ẹrú ẹlẹgbẹ́ rẹ̀” nínú ọ̀rọ̀ pàtàkì
  alternative: “ìránṣẹ́ ẹlẹgbẹ́ rẹ̀”
  rationale: Àkàwé náà dá lórí ọba, gbèsè, àti àwọn ẹni tí ó wà lábẹ́ àṣẹ. Nítorí náà, “ẹrú” pa ipò ìdè tí ọ̀rọ̀ orísun ń tọ́ka sí mọ́, láì sọ ọ́ di ìránṣẹ́ lasán.
translation_notes:
  register: A lo Yorùbá ìwọ̀nba, òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ó sì ń bẹ̀ ẹ́” pa ìṣe tí ń tẹ̀ síwájú nínú imperfect Gíríìkì mọ́, nígbà tí ọ̀rọ̀ taara náà ṣì rọrùn fún òǹkàwé gbogbo.
