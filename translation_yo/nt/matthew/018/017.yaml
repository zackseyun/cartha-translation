id: MAT.18.17
reference: Matthew 18:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: yo
  text: Ṣùgbọ́n bí ó bá kọ̀ láti fetí sí wọn, sọ ọ́ fún àpéjọ náà.[a] Bí ó bá sì tún kọ̀ láti fetí sí àpéjọ náà, kí o kà á sí aláì-Júù àti agbowó-orí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ìjọ” tàbí “àwùjọ” fún “àpéjọ” (Gíríìkì: ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: kọ̀ láti fetí sí
  rationale: Ó fi ìmọ̀lára ìkọ̀ láti gba ọ̀rọ̀ tàbí láti fetí sí hàn, kì í ṣe pé ẹni náà kò gbọ́ lásán.
- source_word: εἰπὸν
  choice: sọ ọ́ fún
  rationale: Ó jẹ́ àṣẹ láti mú ọ̀ràn náà lọ síwájú àpéjọ; arọ́pò-orúkọ náà ń tọ́ka sí ọ̀ràn tí àyíká ẹsẹ̀ ti sọ.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: àpéjọ
  rationale: Àpéjọ jẹ́ ọ̀rọ̀ àdánidá fún àwùjọ tí ó péjọ, ó sì yẹra fún fífi ìtumọ̀ ilé-iṣẹ́ ìjọ ti àkókò tó tẹ̀ lé e sínú ọ̀rọ̀ náà.
- source_word: ἔστω σοι
  choice: jẹ́ kí ó rí ... lójú rẹ
  rationale: Èyí pa agbára àṣẹ àti ìbáṣepọ̀ dative σοι mọ́ ní Yorùbá àdánidá, láì sọ ọ́ di ìlànà ìbáwí tí ó túbọ̀ gbooro.
- source_word: ὥσπερ
  choice: bí
  rationale: Ó pa ìfiwéra inú Gíríìkì mọ́ ní ọ̀nà tí ó ṣe déédé ní Yorùbá.
- source_word: ὁ ἐθνικὸς
  choice: ẹni tí kì í ṣe Júù
  rationale: Nínú àyíká Júù yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí kò sí nínú àwùjọ májẹ̀mú Júù; yíyan èdè yìí ṣe kedere fún òǹkàwé Yorùbá láì fi ìtumọ̀ ‘abọ̀rìṣà’ kún un.
- source_word: ὁ τελώνης
  choice: agbowó-orí
  rationale: Èyí ni ìtumọ̀ tààrà àti èdè Yorùbá tí ó wọ́pọ̀ fún τελώνης.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία nínú àyíká ìbáwí Mátíù ṣáájú àjíǹde
  choice: àpéjọ
  alternative: ìjọ; ìjọ ènìyàn
  rationale: Àpéjọ ń pa ìtumọ̀ àwùjọ tí ó péjọ mọ́, láì gbé èrò ẹ̀sìn tàbí ètò ìjọ kan pàtó wọ inú ọ̀rọ̀ náà. Àṣàyàn ìbílẹ̀ ‘ìjọ’ wà nínú àlàyé ìsàlẹ̀.
- issue: Bí a ṣe máa wo ẹni tí kò fetí sí àpéjọ
  choice: jẹ́ kí ó rí bí ẹni tí kì í ṣe Júù àti agbowó-orí lójú rẹ
  alternative: máa ṣe sí i bí ẹni tí kì í ṣe Júù àti agbowó-orí; kà á sí ẹni òde
  rationale: Yíyan yìí pa àfiwé inú ọ̀rọ̀ Gíríìkì mọ́, kò sì sọ ọ́ di ẹ̀kọ́ ìyọkúrò nínú ìjọ tí ó gbooro ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. Àmì ohùn ni a lò níbi tí ó bá ṣe àdánidá; ‘fetí sí’ mú ìtumọ̀ gbígbọ́ pẹ̀lú títẹ̀lé ọ̀rọ̀ jáde, ‘lójú rẹ’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi σοι hàn.
