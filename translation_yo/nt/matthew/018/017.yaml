  source_fidelity: Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa nípa ìkọ̀ láti fetí sí, ríròyìn ọ̀ràn náà fún ἐκκλησία, àti ìfiwéra ẹni náà pẹ̀lú ἐθνικός àti τελώνης. Ṣùgbọ́n “jẹ́ kí ó rí bí ... lójú rẹ” lè túmọ̀ sí pé kí ẹni náà dàbí ẹni bẹ́ẹ̀ ní ìrísí, dípò ìtumọ̀ ἔστω σοι, èyí tí ó ń sọ bí ẹni tí a ń bá sọ̀rọ̀ ṣe yẹ kí ó ka ẹni náà sí.
  naturalness: “Kí o kà á sí ...” jẹ́ Yorùbá òde òní tí ó mọ́, ó sì ṣàfihàn ìtumọ̀ ìbáṣepọ̀ “sí ọ” láì fi ìlànà ìyọkúrò tàbí ìbáwí míràn kún ẹsẹ̀ náà. “Aláì-Júù” sì jẹ́ kúkúrú, ó sì dára ju gbolohun “ẹni tí kì í ṣe Júù” lọ fún ẹ̀ka ènìyàn aṣojú tí Gíríìkì lò.
  terminology: “Àpéjọ” yẹ fún ἐκκλησία nínú àkọsílẹ̀ pàtàkì, pẹ̀lú “ìjọ” àti “àwùjọ” gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀. “Agbowó-orí” jẹ́ ìtumọ̀ tó péye fún τελώνης. “Aláì-Júù” ń pa ìtumọ̀ ἐθνικός mọ́ láì fi itumọ̀ “abọ̀rìṣà” tí kò dájú sí i.
