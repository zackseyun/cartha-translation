  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: yo
  text: Nígbà tí ó sì bẹ̀rẹ̀ sí í yẹ àwọn àkọọ́lẹ̀ wò, wọ́n mú onígbèsè kan tí ó jẹ ẹ́ ní ẹgbẹ̀rún mẹ́wàá tálẹ́ńtì[a] wá sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tálẹ́ńtì jẹ́ ìwọ̀n owó ńlá kan ní ìgbàanì; nínú àkàwé yìí, “ẹgbẹ̀rún mẹ́wàá tálẹ́ńtì” ń fi gbèsè tí ó pọ̀ jù lọ hàn.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Nígbà tí ó sì bẹ̀rẹ̀
  rationale: Genitive absolute náà fi ipò àkókò tí ìṣe pàtàkì ṣẹlẹ̀ hàn; “Nígbà tí ó sì bẹ̀rẹ̀” jẹ́ Yorùbá àdánidá, ó sì pa δέ mọ́ gẹ́gẹ́ bí ìtẹ̀síwájú ìtàn.
- source_word: συναίρειν
  choice: sí í ṣírò owó tí àwọn ènìyàn jẹ ẹ́
  rationale: Nínú ọ̀rọ̀ ìṣúná yìí, ọ̀rọ̀ náà túmọ̀ sí ṣíṣe àyẹ̀wò àti ìlànà àkọọ́lẹ̀ gbèsè. Àṣàyàn yìí ṣe kedere sí òǹkàwé Yorùbá láì lo gbólóhùn àjèjì.
- source_word: προσηνέχθη
  choice: wọ́n mú ... wá
  rationale: Aorist passive náà fi hàn pé àwọn mìíràn ló mú onígbèsè náà wá; ìṣe aláìlórúkọ ẹni (“wọ́n mú”) jẹ́ ọ̀nà Yorùbá àdánidá láti sọ passive.
- source_word: αὐτῷ
  choice: sọ́dọ̀ rẹ̀
  rationale: Ó fi ẹni tí wọ́n mú onígbèsè náà tọ̀ wá hàn, ó sì bá ìlò προσφέρω ní passive mu.
- source_word: εἷς ὀφειλέτης
  choice: ẹnì kan tí ó jẹ ẹ́
  rationale: “Ẹnì kan” pa numeral εἷς mọ́, “tí ó jẹ ẹ́” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere ju lílo ọ̀rọ̀ amọ̀ja fún “debtor” lọ.
- source_word: μυρίων ταλάντων
  choice: ẹgbẹ̀rún mẹ́wàá tálẹ́ńtì
  rationale: μύριοι ní ìtumọ̀ iye pàtó “ẹgbẹ̀rún mẹ́wàá” níbí. A pa tálẹ́ńtì mọ́ gẹ́gẹ́ bí ìwọ̀n owó ìgbàanì, nítorí pé yíyí i sí owó òde òní lè mú ìdánilójú èké wá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Gbólóhùn “ṣírò owó tí àwọn ènìyàn jẹ ẹ́” mú àwòrán ìṣírò gbèsè jáde lọ́nà àdánidá.
