  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìpìlẹ̀ Gíríìkì dáadáa: ìṣe ìbẹ̀rẹ̀, ṣíṣe àkọọ́lẹ̀, mímú onígbèsè kan wá sí ọ̀dọ̀ rẹ̀, àti iye ẹgbẹ̀rún mẹ́wàá tálẹ́ńtì wà nínú rẹ̀. Síbẹ̀, “ṣírò owó tí àwọn ènìyàn jẹ ẹ́” lè túmọ̀ sí kíkà iye owó tí gbogbo ènìyàn jẹ ẹ́, dípò ìṣe ‘ṣíṣe/ṣíṣètò àkọọ́lẹ̀’ (συναίρειν).'
