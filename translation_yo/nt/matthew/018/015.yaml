id: MAT.18.15
reference: Matthew 18:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: yo
  text: Ṣùgbọ́n bí arákùnrin rẹ bá ṣẹ̀ ọ́[a], lọ, kí o sì fi ẹ̀ṣẹ̀ rẹ̀ hàn án ní ìkọ̀kọ̀ láàárín ìwọ àti òun nìkan. Bí ó bá fetí sí ọ[b], o ti jèrè arákùnrin rẹ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kò ní “ọ́”; wọ́n kà á pé, “Bí arákùnrin rẹ bá ṣẹ̀, lọ, kí o sì fi ẹ̀ṣẹ̀ rẹ̀ hàn án ní ìkọ̀kọ̀ láàárín ìwọ àti òun nìkan.”
    reason: textual_variant
  - marker: b
    text: Tàbí “bá gbọ́ tirẹ”; ìtumọ̀ rẹ̀ ni pé ó gba ọ̀rọ̀ rẹ sí etí, kì í ṣe gbígbọ́ ohùn lásán.
    reason: lexical_alternative
  - marker: c
    text: “Arákùnrin” jẹ́ akọ ẹyọ kan ní gírámà Gíríìkì; nínú àyíká ọ̀rọ̀, ó lè tọ́ka sí ọmọ-ẹ̀yìn ẹlẹgbẹ́ ẹni ní ọ̀nà tó gbòòrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: bá ṣẹ̀
  rationale: Ọ̀rọ̀ yìí pa agbára ìwà rere àti ti ẹ̀sìn inú ἁμαρτάνω mọ́, ó sì bá ìtumọ̀ àídájú gbogbogbò lẹ́yìn ἐὰν mu ní Yorùbá.
- source_word: εἰς σέ
  choice: ọ́
  rationale: Àpólà yìí fi hàn pé ẹ̀ṣẹ̀ náà dojú kọ ẹni tí a ń bá sọ̀rọ̀; ‘ṣẹ̀ ọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ἀδελφός σου
  choice: arákùnrin rẹ
  rationale: Èyí tẹ̀ lé akọ ẹyọ kan nínú Gíríìkì, láì fi ìtumọ̀ àfikún sí i pé ó gbọdọ̀ túmọ̀ sí gbogbo onígbàgbọ́.
- source_word: ὕπαγε
  choice: lọ
  rationale: Àṣẹ ṣókí, àdánidá ni Yorùbá, tí ó sì mú ìgbésẹ̀ tí a pàṣẹ hàn.
- source_word: ἔλεγξον
  choice: kí o sì fi ẹ̀ṣẹ̀ rẹ̀ hàn án
  rationale: Ó mú ìtumọ̀ fífi àṣìṣe ẹni hàn tàbí mímú un wá sí ìmọ́lẹ̀ jáde, láì lo ọ̀rọ̀ tí yóò dún bí ìbáwí líle jù.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: ní ìkọ̀kọ̀ láàárín ìwọ àti òun nìkan
  rationale: Ó pa ìtẹnumọ́ orísun mọ́ pé ìjíròrò náà gbọdọ̀ jẹ́ ti àwọn méjèèjì nìkan, ó sì dún lọ́nà àdánidá ní Yorùbá.
- source_word: ἀκούσῃ
  choice: bá fetí sí ọ
  rationale: ‘Fetí sí’ túmọ̀ sí gbígbọ́ pẹ̀lú ìfiyèsí àti ìdáhùn, ṣùgbọ́n kò fi dandan ìgbọràn kún ọ̀rọ̀ náà.
- source_word: ἐκέρδησας
  choice: o ti jèrè
  rationale: ‘Jèrè’ pa àwòrán κερδαίνω gẹ́gẹ́ bí ríran ẹnì kan gbà tàbí jíjẹ èrè mọ́, láì fi èrò ‘tún rí gbà’ kún un.
theological_decisions:
- issue: Bóyá kí ἀδελφός jẹ́ ọ̀rọ̀ àpapọ̀ fún ọkùnrin àti obìnrin
  choice: arákùnrin rẹ
  alternative: arákùnrin tàbí arábìnrin rẹ; onígbàgbọ́ bí ìwọ
  rationale: Akọ ẹyọ kan ni Gíríìkì; a pa ìrísí orísun mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìlò gbòòrò tó ṣeé ṣe nínú àlàyé ìsàlẹ̀.
- issue: Ìyàtọ̀ àfọwọ́kọ lórí εἰς σέ
  choice: fi ‘ọ́’ sínú ọ̀rọ̀ pàtàkì
  alternative: ‘bí arákùnrin rẹ bá ṣẹ̀’ láìsí ‘ọ́’
  rationale: SBLGNT tí a pèsè ní εἰς σέ; nítorí ìyàtọ̀ yìí lè nípa lórí bóyá ẹ̀ṣẹ̀ sí ẹni náà nìkan ni ẹsẹ yìí ń sọ, a tọ́ka sí àfọwọ́kọ kúkúrú nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣe kedere fún òǹkàwé òde òní. ‘Fi ẹ̀ṣẹ̀ rẹ̀ hàn án’ yan ìtumọ̀ àárín-gbùngbùn fún ἔλεγξον, tí kò rọ̀ ju bẹ́ẹ̀ lọ tí kò sì le ju bẹ́ẹ̀ lọ.
