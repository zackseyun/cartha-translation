id: MAT.18.4
reference: Matthew 18:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: yo
  text: Nítorí náà, ẹnikẹ́ni tí ó bá rẹ ara rẹ̀ sílẹ̀ bí ọmọ yìí, òun ni ẹni ńlá jù lọ ní ìjọba ọ̀run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: ẹnikẹ́ni tí ó bá
  rationale: Ó ṣe àfihàn ẹni yòówù tí ó bá mú ipò tí a sọ ṣẹ, ó sì bá ìtumọ̀ gbólóhùn Gíríìkì mu ní Yorùbá àdánidá.
- source_word: ταπεινώσει ἑαυτόν
  choice: rẹ ara rẹ̀ sílẹ̀
  rationale: Ó pa ìṣe tí ẹni náà ń ṣe sí ara rẹ̀ mọ́, ó sì túmọ̀ ìrẹ̀lẹ̀ tàbí fífi ara ẹni sí ipò kékeré láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: bí ọmọ yìí
  rationale: Ó tẹ̀ lé àfiwé orísun náà ní tààrà, ó sì tọ́ka sí ọmọ tí ó wà níwájú Jésù nínú àyíká ọ̀rọ̀.
- source_word: ὁ μείζων
  choice: ó tóbi jù lọ
  rationale: Fọ́ọ̀mù náà jẹ́ afíwéra tí àyíká ọ̀rọ̀ ń lò gẹ́gẹ́ bí ipò gíga jù; èdè Yorùbá yìí jẹ́ kedere, ó sì pa ìtẹnumọ́ náà mọ́.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ní iyì fún ọ̀rọ̀ Mátíù; kò túmọ̀ ọ̀rọ̀ náà sí ibi kan ṣoṣo tàbí sí ìjọba ènìyàn.
theological_decisions:
- issue: Ìtẹnumọ́ ọ̀rọ̀ οὗτός ἐστιν
  choice: òun ni ó tóbi jù lọ
  alternative: ó tóbi jù lọ
  rationale: “Òun ni” pa àtúnṣe akọ́lé Gíríìkì àti ìtẹnumọ́ rẹ̀ mọ́, gẹ́gẹ́ bí “he is” nínú àtúnṣe POB, láìdá ẹ̀kọ́ tuntun sílẹ̀.
- issue: Ìtumọ̀ fífi ara ẹni rẹ̀ sílẹ̀ bí ọmọ
  choice: Pa àfiwé náà mọ́ láìṣàlàyé ohun tí ìwà ọmọ náà túmọ̀ sí
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí àìmọwọ́mẹsẹ̀, ìgbọ́ràn, tàbí ìgbẹ́kẹ̀lé
  rationale: Orísun kò sọ irú ànímọ́ ọmọ pàtó ní ẹsẹ yìí; ìtumọ̀ náà kò gbọ́dọ̀ yan ẹ̀kọ́ ìtumọ̀ kan ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ adayeba, ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lò “rẹ ara rẹ̀ sílẹ̀” dípò ọ̀rọ̀ àjèjì tàbí èdè ẹ̀sìn tó le, a sì fi “òun ni” mú ìtẹnumọ́ orísun hàn.
