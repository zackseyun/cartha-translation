    rationale: Àlàyé-ẹsẹ̀ yẹ kí ó fi ìtumọ̀ kúkúrú míì hàn, bí “bí ó bá rí i,” dípò kí ó tún “bí ó bá ṣẹlẹ̀ pé ó rí i” ṣe.
