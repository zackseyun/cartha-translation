id: MAT.18.13
reference: Matthew 18:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: yo
  text: Bí ó bá sì ṣẹlẹ̀ pé ó rí i[a], lóòótọ́ ni mo sọ fún yín pé inú rẹ̀ dùn sí i ju àwọn mọ́kàndínlọ́gọ́rùn-ún tí kò ṣìnà lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó bá rí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: A lo “sì” gẹ́gẹ́ bí àsopọ̀ tó bá ìṣàn àpèjúwe náà mu ní Yorùbá.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: bí ó bá ṣẹlẹ̀ pé ó rí i
  rationale: Èyí pa ìtumọ̀ ìṣẹ̀lẹ̀ tí ó ṣeé ṣe nínú ἐὰν + γένηται + infinitive mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: lóòótọ́ ni mo sọ fún yín
  rationale: Ó pa agbára ọ̀rọ̀ ìmúdájú tí Jésù máa ń lò mọ́, láìlo èdè àtijọ́ tí kò mọ́gbọ́n dání fún òǹkàwé òde òní.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: inú rẹ̀ dùn sí i
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ayọ̀ tí χαίρει ń tọ́ka sí àti ohun tí ayọ̀ náà dá lé.
- source_word: μᾶλλον ἢ
  choice: ju ... lọ
  rationale: Ètò àfiwé Yorùbá yìí túmọ̀ ìfiwéra gidi náà ní tààrà, láìsọ ọ́ di yíyan ọ̀kan sílẹ̀ pátápátá.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: àwọn mọ́kàndínlọ́gọ́rùn-ún
  rationale: A kò tún “àgùntàn” ṣe nítorí pé Gíríìkì náà fi orúkọ náà sílẹ̀, àyíká ọ̀rọ̀ sì ti mú ẹni tí a ń tọ́ka sí ṣe kedere.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: tí kò ṣìnà
  rationale: “Ṣìnà” bá àwòrán àgùntàn tó kúrò ní ọ̀nà mu, ó sì pa ìtumọ̀ pé àwọn mọ́kàndínlọ́gọ́rùn-ún kò wà ní ipò ìṣìnà mọ́.
theological_decisions:
- issue: Agbára ìfiwéra nínú ayọ̀ olùṣọ́ àgùntàn
  choice: A sọ pé inú olùṣọ́ náà dùn sí èyí tí ó rí ju sí àwọn mọ́kàndínlọ́gọ́rùn-ún tí kò ṣìnà lọ.
  alternative: Kí a rọ ìfiwéra náà kù kí ó má bàa dà bí ẹni pé ó fẹ́ ọ̀kan ju àwọn yòókù lọ.
  rationale: μᾶλλον ἢ jẹ́ ìfiwéra tó ṣe kedere. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ àti ìnira ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́, láìfi kún un pé kò bìkítà fún àwọn mọ́kàndínlọ́gọ́rùn-ún tàbí pé iye wọn kéré.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Gbólóhùn àkọ́kọ́ ti pa àṣàyàn àti àìdánilójú inú Gíríìkì mọ́; ìfiwéra ayọ̀ náà kò sì jẹ́ kí a yanjú ìṣòro ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà fi sílẹ̀.
