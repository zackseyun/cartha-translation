    issue: A kò túmọ̀ ὅτι ní kedere lẹ́yìn “lóòótọ́ ni mo sọ fún yín.”
    rationale: Nínú gbolóhùn yìí, ὅτι ṣàfihàn àkóónú ohun tí Jésù sọ. “Pé” jẹ́ àṣàyàn Yorùbá tó dára, tó sì mú ìṣọ̀kan gbolóhùn hàn.
  - severity: low
    issue: “Ju sí àwọn … lọ” ní ìṣàlàyé “sí” tó tún ṣe.
    rationale: Ìlànà ìfiwéra Yorùbá tó rọrùn níbí ni “dùn sí i ju àwọn … lọ”; “sí” kejì kò ṣe dandan.
  - severity: low
