review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àkóónú Gíríìkì mọ́ dáadáa: ìṣẹ̀lẹ̀ tó ṣeé ṣe nínú ἐὰν γένηται εὑρεῖν αὐτό, ìmúdájú ἀμὴν λέγω ὑμῖν, ayọ̀ olùṣọ́, àti ìfiwéra μᾶλλον ἢ. Àmọ́ ὅτι lẹ́yìn ọ̀rọ̀ ìmúdájú yẹ kí ó hàn ní Yorùbá pẹ̀lú “pé,” kí ìbáṣepọ̀ gbolóhùn náà má bàa ṣókùnkùn.'
  naturalness: “Inú rẹ̀ dùn sí i ju sí àwọn … lọ” ní “sí” kejì tí kò pọndandan nínú ìfiwéra Yorùbá, ó sì dín ìròrùn gbolóhùn kù. “Lóòótọ́ ni mo sọ fún yín pé …” jẹ́ èdè boṣewa, kedere, ó sì dáa ju fífi àmì ìdúró dípò “pé” lọ.
  terminology: “Mọ́kàndínlọ́gọ́rùn-ún” jẹ́ ọ̀nà tó tọ́ fún mẹ́rìnlélọ́gọ́rùn-ún-dín-ọ̀kan (99). “Ṣìnà” bá àwòrán àgùntàn tí ó lọ ṣìnà mu, ó sì yẹ fún τοῖς μὴ πεπλανημένοις nínú àyíká yìí. A kò fi “àgùntàn” kún un, nítorí Gíríìkì kò tún orúkọ náà ṣe.
  issues:
