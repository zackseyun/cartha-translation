  to: Bí ó bá sì ṣẹlẹ̀ pé ó rí i[a], lóòótọ́ ni mo sọ fún yín pé inú rẹ̀ dùn sí i ju àwọn mọ́kàndínlọ́gọ́rùn-ún tí kò ṣìnà lọ.
