  to: Nítorí náà, ẹrú náà dojú bolẹ̀ níwájú rẹ̀, ó sì ń tẹríba fún un, ó ń sọ pé, ‘Ṣe sùúrù fún mi, èmi yóò sì san gbogbo rẹ̀ fún ọ.’
  rationale: A ti tún προσεκύνει ṣe sí ‘ó sì ń tẹríba fún un’ láti pa ìṣe ìbọ̀wọ̀ tí imperfect náà ń ṣàpèjúwe mọ́. ‘Dojú bolẹ̀’ ṣì dúró fún πεσών, ‘ó ń sọ pé’ sì mú λέγων hàn láì fi ìbẹ̀bẹ̀ sí ipò ọ̀rọ̀ tí kò sọ ọ́. Àkọsílẹ̀ ìsàlẹ̀ ni a ṣàtúnṣe kí yíyan ‘tẹríba’ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn, kì í ṣe ìtumọ̀ àtúnṣe ìdúró ọrọ̀ kan náà.
