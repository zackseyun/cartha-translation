id: MAT.18.26
reference: Matthew 18:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: yo
  text: Nítorí náà, ẹrú náà dojú bolẹ̀ níwájú rẹ̀, ó sì ń tẹríba fún un, ó ń sọ pé, ‘Ṣe sùúrù fún mi, èmi yóò sì san gbogbo rẹ̀ fún ọ.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: dojú bolẹ̀
  rationale: 'Aorist participle náà fi ìṣe ti ara hàn: ó rẹ ara rẹ̀ sílẹ̀ ní ìrẹ̀lẹ̀. ‘Dojú bolẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìdùbúlẹ̀ bẹ́ẹ̀.'
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe ẹrú náà mọ́ ohun tó ṣẹlẹ̀ ní ẹsẹ tó ṣáájú gẹ́gẹ́ bí àbájáde rẹ̀.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Nínú àkàwé yìí, ipò ẹni tí ó wà lábẹ́ ọ̀gá patapata ṣe pàtàkì; ‘ẹrú’ fi ìtumọ̀ δοῦλος hàn kedere ju ‘ìránṣẹ́’ lọ.
- source_word: προσεκύνει
  choice: níwájú rẹ̀, ó sì ń bẹ̀ ẹ́
  rationale: Imperfect náà fi ìṣe tó ń bá a lọ hàn. Ní àyíká yìí, προσκυνέω túmọ̀ sí fífi ara balẹ̀ ní ọ̀wọ̀ fún ọ̀gá ènìyàn, kì í ṣe dandan ìjọsìn ẹ̀sìn; ‘ó sì ń bẹ̀ ẹ́’ tún mú ìfẹ́ inú ọ̀rọ̀ rẹ̀ hàn láì sọ pé ó ń jọ́sìn.
- source_word: λέγων
  choice: pé
  rationale: Ó ṣí ọ̀rọ̀ tààrà tí ẹrú náà sọ; nínú Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti darí ọ̀rọ̀ náà wọlé lẹ́yìn ‘ń bẹ̀ ẹ́.’
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Ṣe sùúrù fún mi
  rationale: Ó jẹ́ ẹ̀bẹ̀ pé kí ọ̀gá náà ní ìfaradà, kí ó sì dá ìdájọ́ tàbí ìgbésẹ̀ dúró fún ìgbà díẹ̀.
- source_word: πάντα
  choice: gbogbo rẹ̀
  rationale: Neuter plural náà kó gbogbo gbèsè tí a mẹ́nu kàn jọ; ‘gbogbo rẹ̀’ jẹ́ Yorùbá tó ṣe kedere, tó sì bá àyíká gbèsè mu.
- source_word: ἀποδώσω σοι
  choice: èmi yóò sì san ... fún ọ
  rationale: Nínú àyíká gbèsè, ἀποδίδωμι túmọ̀ sí san ohun tí ẹni jẹ padà. Fífi ‘èmi’ hàn tẹnu mọ́ ìlérí ẹrú náà.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω sí ọ̀gá ènìyàn
  choice: Ìdùbúlẹ̀ àti ẹ̀bẹ̀ ní ọ̀wọ̀ fún ọ̀gá
  alternative: ó jọ́sìn fún un
  rationale: Olùgbà ìṣe náà jẹ́ ọba tàbí ọ̀gá inú àkàwé, ìtumọ̀ lẹ́sẹ̀kẹsẹ̀ sì jẹ́ ìdùbúlẹ̀ ìbọ̀wọ̀. ‘Ó jọ́sìn’ lè fi ìtumọ̀ ẹ̀sìn tí àyíká kò béèrè kún un; àkọsílẹ̀ ìsàlẹ̀ ṣì pa àṣàyàn lexical náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọlọ́lá, ó sì yẹ fún òǹkàwé gbogbogbò; a lo ‘ẹrú’ láti pa ipò àwùjọ δοῦλος mọ́.
