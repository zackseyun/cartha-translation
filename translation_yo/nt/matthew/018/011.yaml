  text: Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι τὸ ἀπολωλός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: yo
  text: Nítorí Ọmọ Ènìyàn wá láti gba ohun tí ó sọnù là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì tí ó kùtùkùtù jù lọ (tó fi mọ́ Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin) àti nínú àwọn ìtumọ̀ Kọ́pítì ìjímìjí. Ṣùgbọ́n ó wà nínú Codex Bezae ti ọ̀rúndún karùn-ún, nínú àṣà ọ̀pọ̀ àwọn àfọwọ́kọ Byzantine, àti nínú Vulgate Látìn. Ó ṣeé ṣe kí àwọn akọ̀wé ìgbà tó tẹ̀ lé e fi kún un láti mú un bá Lúùkù 19:10 mu.
    reason: textual_critical
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Àkọ́lé tí ó bá ọ̀rọ̀ Gíríìkì mu, tí ó sì jẹ́ èdè Bíbélì Yorùbá tí a mọ̀ dáadáa.
- source_word: σῶσαι
  choice: láti gba … là
  rationale: Ọ̀nà àdánidá ní Yorùbá láti sọ ìgbàlà tàbí ìdáǹdè kúrò nínú ewu àti ìparun.
- source_word: τὸ ἀπολωλός
  choice: ohun tí ó sọnù
  rationale: Participle náà jẹ́ aláìlẹ́yà, ẹyọ kan, ó sì dúró gẹ́gẹ́ bí orúkọ; ‘ohun tí ó sọnù’ pa irú gírámà àti àìsọ pàtó yìí mọ́ ju bí a bá sọ ‘àwọn ènìyàn tí ó sọnù’ lọ.
theological_decisions:
- issue: Bóyá τὸ ἀπολωλός ń tọ́ka pàtó sí ènìyàn tàbí sí ohun gbogbo tí ó sọnù
  choice: ohun tí ó sọnù
  alternative: ẹni tí ó sọnù / àwọn tí ó sọnù
  rationale: A kò fẹ́ yanjú ohun tí Gíríìkì fi sílẹ̀ ní àìsọ pàtó; fọ́ọ̀mù aláìlẹ́yà ẹyọ kan ni a túmọ̀ ní tààrà.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. Àmì ohùn kún ún níbi tí ó yẹ; ‘gba … là’ jẹ́ gbólóhùn tí ó rọrùn fún òǹkàwé gbogbo, nígbà tí ‘ohun tí ó sọnù’ pa ìrísí aláìlẹ́yà ẹyọ kan ti Gíríìkì mọ́.
