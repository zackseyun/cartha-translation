id: MAT.18.3
reference: Matthew 18:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: yo
  text: Ó sì wí pé, “Lóòótọ́ ni mo wí fún yín, bí ẹ̀yin kò bá yípadà[a] tí ẹ̀yin kò sì di bí àwọn ọmọdé[b], ẹ̀yin kì yóò wọ ìjọba ọ̀run láé[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí a kò bá yí yín padà.” Ìrísí fáàbù Gíríìkì náà lè gba ìtumọ̀ náà, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí, “bí ẹ kò bá yípadà.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ní “àwọn ọmọdé”; ó ṣeé ṣe kí ó tún rántí ọmọdé tí Jésù gbé sí àárín wọn nínú ẹsẹ̀ tó ṣáájú.
    reason: lexical_alternative
  - marker: c
    text: A tún lè sọ pé, “ẹ̀yin kì yóò wọ láéláé.” Èdè Gíríìkì lo ìkọ̀ tí ó ní ìtẹnumọ́ púpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó fi agbára ọ̀rọ̀ ìdánilójú tí Jésù ń lò hàn ní Yorùbá àdánidá, láì fi ọ̀rọ̀ àjèjì ‘Àmín’ sí inú gbólóhùn.
- source_word: στραφῆτε
  choice: yípadà
  rationale: Ó sọ ìyípadà ọ̀nà tàbí ìdarí ẹni ní kedere, ó sì jẹ́ kí ìtumọ̀ náà wà ní ṣíṣí sí ‘ẹ yípadà’ tàbí ‘kí a yí yín padà’ gẹ́gẹ́ bí ìrísí fáàbù Gíríìkì ṣe gbà.
- source_word: γένησθε
  choice: dà
  rationale: ‘Dà bí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ yíyí sí ipò tàbí ìwà kan, ó sì bá γένησθε mu.
- source_word: ὡς τὰ παιδία
  choice: bí àwọn ọmọdé
  rationale: Ó pa àfiwé pẹ̀lú àwọn ọmọ mọ́ láì pinnu pé àìmọ̀kan, ìrẹ̀lẹ̀, tàbí ànímọ́ míì kan pàtó ni a ń tọ́ka sí. ‘Àwọn’ tún lè mú ìfarahàn àpilẹ̀kọ Gíríìkì náà wá sí ọkàn.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ẹ̀yin kì yóò wọ ... láé
  rationale: Àkójọpọ̀ ìkọ̀ Gíríìkì οὐ μή lágbára gan-an; ‘kì yóò ... láé’ mú ìtẹnumọ́ yẹn jáde ní Yorùbá tó ṣe kedere.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni gbólóhùn Yorùbá tó ti fìdí múlẹ̀, tó sì sọ ọ̀rọ̀ Mátíù nípa ìjọba ọ̀run lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ èdè tó dà bí ìyípadà ẹ̀sìn nínú στραφῆτε
  choice: yípadà
  alternative: kí a yí yín padà; ẹ di ẹni ìyípadà
  rationale: ‘Yípadà’ pa ìpè sí ìdarí tuntun mọ́ láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn onímọ̀ kan tàbí láì pinnu ẹni tó fa ìyípadà náà.
- issue: Ohun tí παιδία ń tọ́ka sí nínú ẹ̀kọ́ ọmọ-ẹ̀yìn
  choice: àwọn ọmọdé
  alternative: ọmọdé; àwọn ọmọ kéékèèké
  rationale: Ìtumọ̀ yìí pa àfiwé ọ̀rọ̀ náà mọ́, ṣùgbọ́n kò fi ìwà kan bí àìlẹ́ṣẹ̀ tàbí ìrẹ̀lẹ̀ kún ohun tí ẹsẹ̀ náà kò sọ ní tààrà.
- issue: Agbára ìkọ̀ nínú οὐ μή
  choice: kì yóò wọ ... láé
  alternative: dájúdájú, ẹ kò ní wọ
  rationale: A mú ìkìlọ̀ náà lágbára gẹ́gẹ́ bí Gíríìkì ṣe rí, láì ṣàlàyé ìlànà ẹ̀kọ́ ìgbàlà ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà níyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀yin/yín’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí Gíríìkì ṣe fi hàn.
