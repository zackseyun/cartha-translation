  to: Ó sì wí pé, “Lóòótọ́ ni mo wí fún yín, bí ẹ̀yin kò bá yípadà[a] tí ẹ̀yin kò sì di bí àwọn ọmọdé[b], ẹ̀yin kì yóò wọ ìjọba ọ̀run láé[c].”
  rationale: A tún gbolohun àdéhùn náà ṣe kí ‘yípadà’ àti ‘di bí àwọn ọmọdé’ jẹ́ ohun méjèèjì tí ìkọ̀ náà kàn sí, gẹ́gẹ́ bí Gíríìkì ṣe so àwọn fáàbù méjèèjì pọ̀. A tún ṣàtúnṣe ẹsẹ̀-ìsàlẹ̀ (a) kí ó ṣàlàyé àìdájú ohùn fáàbù náà ní Yorùbá tó péye. Kò sí ìtumọ̀ ẹ̀kọ́-ìsìn tàbí ànímọ́ ọmọdé kan tí a fi kún ẹsẹ̀ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń fi àwọn apá pàtàkì ti Gíríìkì hàn dáadáa: Ἀμὴν gẹ́gẹ́ bí ìfọ̀kànbalẹ̀, στραφῆτε àti γένησθε gẹ́gẹ́ bí ìyípadà méjì tí a so pọ̀, παιδία gẹ́gẹ́ bí ọmọdé, àti οὐ μή gẹ́gẹ́ bí ìkọ̀ alágbára. Ṣùgbọ́n ìṣọ̀kan gírámà nínú gbolohun àdéhùn náà nílò àtúnṣe kí ó lè sọ pé àwọn nǹkan méjèèjì gbọdọ̀ ṣẹlẹ̀: yípadà àti dídì bí ọmọdé.'
  naturalness: ‘Bí ẹ̀yin kò bá yípadà, kí ẹ sì dà’ kò rọrùn gẹ́gẹ́ bí gbolohun àdéhùn Yorùbá, nítorí ‘kí ẹ sì’ lè dà bí ìpè tàbí àṣẹ. ‘Bí ẹ̀yin kò bá yípadà tí ẹ̀yin kò sì di bí àwọn ọmọdé’ jẹ́ ọ̀nà boṣewa, tó hàn gbangba, tó sì dáa síi. ‘Di bí’ tún sọ ‘become like’ ní kedere ju ‘dà bí’ lọ ní àyíká yìí.
  terminology: ‘Ìjọba ọ̀run,’ ‘Lóòótọ́,’ àti ‘àwọn ọmọdé’ bá ìlò Yorùbá ìgbàlódé àti ọ̀rọ̀ Mátíù mu. A ti tún àlàyé ẹsẹ̀-ìsàlẹ̀ (a) ṣe, nítorí ‘aláìlérò’ kò yẹ níbí; ó lè túmọ̀ sí ohun tí a ṣe láìmọ̀ọ́mọ̀, kì í ṣe ìṣòro ohùn/fọọmu fáàbù.
  issues:
  - severity: medium
    issue: Ìṣọ̀kan ‘bí ... kò bá ..., kí ẹ sì ...’
    rationale: Nínú ìtumọ̀ yìí, ‘kí ẹ sì’ lè jẹ́ kí apá kejì dà bí àṣẹ dipo kí ó jẹ́ apá kejì nínú ohun tí ‘bí ... kò bá’ ń darí. Gíríìkì so στραφῆτε àti γένησθε pọ̀ lábẹ́ ‘unless’; Yorùbá náà yẹ kí ó ṣe bẹ́ẹ̀.
  - severity: low
    issue: Ọ̀rọ̀ ‘aláìlérò’ nínú ẹsẹ̀-ìsàlẹ̀ (a)
    rationale: Ọ̀rọ̀ náà kì í ṣàlàyé dáadáa pé fọọmu Gíríìkì lè jẹ́ ‘ẹ yípadà’ tàbí ‘a yí yín padà’; ó lè jẹ́ ìtumọ̀ míì tí kò kan gírámà.
