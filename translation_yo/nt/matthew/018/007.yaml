id: MAT.18.7
reference: Matthew 18:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: yo
  text: Ègbé ni fún ayé nítorí àwọn ohun ìkọ̀sẹ̀[a]; nítorí ó jẹ́ dandan kí àwọn ohun ìkọ̀sẹ̀ náà dé, ṣùgbọ́n ègbé ni fún ọkùnrin náà, ẹni tí ohun ìkọ̀sẹ̀ náà ń dé nípasẹ̀ rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘àwọn ìbínú,’ ‘àwọn ohun tí ń fa ẹ̀ṣẹ̀,’ tàbí ‘àwọn ìdẹ̀kùn.’ Ọ̀rọ̀ Gíríìkì σκάνδαλον/σκάνδαλα ń tọ́ka sí ohun tí ń mú ènìyàn kọsẹ̀, yálà nípa mímú un bínú, fífà á mọ́ra, tàbí fífún un ní àǹfààní láti ṣẹ̀.
    reason: lexical_alternative
  - marker: b
    text: ‘Ọkùnrin náà’ jẹ́ akọ-ẹyọ kan ní èdè Gíríìkì; níhìn-ín, ó dúró fún ẹnikẹ́ni tí irú ohun ìkọ̀sẹ̀ bẹ́ẹ̀ ń dé nípasẹ̀ rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Ègbé ni fún
  rationale: Ó pa agbára ọ̀rọ̀ ìdájọ́ àti ìkìlọ̀ àsọtẹ́lẹ̀ mọ́, ó sì tún jẹ́ kí ìṣọ̀kan ọ̀rọ̀ méjèèjì hàn.
- source_word: κόσμῳ
  choice: ayé
  rationale: Níhìn-ín, ó tọ́ka sí ayé ènìyàn lápapọ̀, kì í ṣe ilẹ̀ ayé tàbí ìṣẹ̀dá ti ara nìkan.
- source_word: ἀπὸ
  choice: nítorí
  rationale: Ó fi ìdí tàbí ohun tí ó fa ègbé náà hàn ní Yorùbá àdánidá.
- source_word: σκάνδαλα / σκάνδαλον
  choice: àwọn ohun ìkọ̀sẹ̀ / ohun ìkọ̀sẹ̀
  rationale: Ó pa àwòrán ohun tí ń mú ènìyàn kọsẹ̀ mọ́, ó sì lè gba ìtumọ̀ ohun tí ń tàn sí ẹ̀ṣẹ̀, ohun ìdẹ̀kùn, tàbí ohun tí ń fa ìṣubú nípa ẹ̀mí.
- source_word: ἀνάγκη
  choice: ó pọndandan
  rationale: Ó sọ pé dandan ni láì pinnu bóyá ìdandan náà jẹ́ ti àṣẹ Ọlọ́run, ti ipò ayé, tàbí ti ohun mìíràn.
- source_word: γάρ
  choice: nítorí
  rationale: Ó so àlàyé tí ó tẹ̀ lé mọ́ ìkéde ègbé àkọ́kọ́.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: dé ... fi ń dé
  rationale: Ó pa àtúnlò ọ̀rọ̀ ìṣe ‘wá/dé’ inú Gíríìkì mọ́ dípò lílo ọ̀rọ̀ àlàyé bí ‘ṣẹlẹ̀.’
- source_word: πλήν
  choice: ṣùgbọ́n
  rationale: Ó fi ìyípadà líle láti inú ìdandan àwọn ohun ìkọ̀sẹ̀ sí ìdájọ́ ẹni tí wọ́n ti ipasẹ̀ rẹ̀ dé hàn.
- source_word: ἀνθρώπῳ
  choice: ọkùnrin náà
  rationale: Ó pa akọ ẹyọ kan inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ṣàlàyé pé ó dúró fún ẹnikẹ́ni.
- source_word: δι’ οὗ
  choice: nípasẹ̀ ẹni tí ... fi
  rationale: Ọ̀nà Yorùbá àdánidá ni láti fi ẹni tí ohun náà ti ipasẹ̀ rẹ̀ dé hàn.
theological_decisions:
- issue: Irú ìdandan tí ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα ń sọ
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìdandan, láì sọ ohun tí ó fa ìdandan náà.
  alternative: ‘Kò lè ṣe kí àwọn ohun ìkọ̀sẹ̀ má dé’ tàbí ọ̀rọ̀ tí yóò fi àṣẹ Ọlọ́run hàn gbangba.
  rationale: Gíríìkì sọ pé ó pọndandan, ṣùgbọ́n kò sọ pé Ọlọ́run ló fa wọn tàbí pàṣẹ wọn; ìtumọ̀ náà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì yanju rẹ̀ ní ìkọ̀kọ̀.
- issue: Agbára aṣojú ti ἀνθρώπῳ
  choice: A pa ‘ọkùnrin náà’ mọ́ nínú ẹsẹ̀, a sì ṣàlàyé pé ó lè dúró fún ẹnikẹ́ni.
  alternative: ‘ẹni náà’ tàbí ‘ẹnikẹ́ni.’
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ kan, bí ó tilẹ̀ jẹ́ pé ìkìlọ̀ náà kan ẹnikẹ́ni tí ohun ìkọ̀sẹ̀ bá ti ipasẹ̀ rẹ̀ dé.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. ‘Ègbé ni fún’ ní agbára ìdájọ́ ju ‘ó ṣe’ lọ; ‘ohun ìkọ̀sẹ̀’ pa àwòrán orísun mọ́. A fi àmì ohùn kún ibi tí ó jẹ́ àdánidá.
