source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá gba ọmọ kan irú bẹ́ẹ̀ ní orúkọ mi, ó gba mí.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tẹ́wọ́ gba.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gba,” “tẹ́wọ́ gba,” tàbí “kà sí ẹni tí a fẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ọmọ kan irú bẹ́ẹ̀”; èdè Gíríìkì kò ní àpèjúwe “kékeré” nínú ẹsẹ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń sọ ipò gbogbogbò kan; ‘Ẹnikẹ́ni tí ó bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìtumọ̀ náà hàn.
- source_word: δέξηται / δέχεται
  choice: gba / gbà
  rationale: ‘Gba’ lè túmọ̀ sí gbígba, kíka ẹni sí, tàbí fífi tọ̀wọ̀tọ̀wọ̀ tẹ́wọ́ gba ẹni. Lílo ọ̀rọ̀ kan náà ní apá méjèèjì pa àtúnwí èdè Gíríìkì mọ́, ó sì mú ìbáṣepọ̀ tó wà láàárín gbígba ọmọ náà àti gbígba Jésù hàn kedere.
- source_word: ἓν παιδίον τοιοῦτο
  choice: irú ọmọ kan bẹ́ẹ̀
  rationale: Èyí ń tọ́ka sí ọmọ tí Jésù gbé sí àárín wọn àti sí ọmọ tí ó jọ irú rẹ̀. A kò fi ‘kékeré’ kún un, nítorí pé μικρόν kò sí nínú ẹsẹ yìí.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: Gbólóhùn yìí fi hàn pé gbígba náà dá lórí ìtọ́kasí sí orúkọ, àṣẹ, tàbí ìfaramọ́ sí Jésù; ‘ní orúkọ mi’ pa ìtẹ̀sí ìtumọ̀ náà mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐμὲ
  choice: èmi ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì ní ìtẹnumọ́. Ìṣètò ‘èmi ni ó gbà’ fi ìtẹnumọ́ náà hàn ní Yorùbá, ó sì mú ìdánimọ̀ aṣojú náà yọ kedere.
theological_decisions:
- issue: Ìdánimọ̀ aṣojú láàárín ọmọ náà àti Jésù
  choice: Ẹsẹ náà sọ pé ẹni tí ó gba irú ọmọ bẹ́ẹ̀ ní orúkọ Jésù gba Jésù fúnra rẹ̀.
  alternative: A lè sọ ọ́ di rírọ̀ pé gbígba ọmọ náà kàn jẹ́ ọ̀nà láti bọlá fún Jésù.
  rationale: Ìyípadà láti ‘irú ọmọ kan bẹ́ẹ̀’ sí ‘èmi,’ pẹ̀lú ìlò ọ̀rọ̀-ìṣe kan náà, fi ìdánimọ̀ aṣojú tó lágbára hàn. Ìtumọ̀ náà pa èyí mọ́ láì fi ẹ̀kọ́ ìjọ tàbí ìtumọ̀ ẹ̀sìn mìíràn tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àtúnwí ọ̀rọ̀-ìṣe Gíríìkì mọ́.
