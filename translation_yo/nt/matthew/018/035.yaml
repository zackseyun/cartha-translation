reference: Matthew 18:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni Baba mi ti ọ̀run yóò ṣe sí yín, bí olúkúlùkù yín kò bá dárí ji arákùnrin rẹ̀[b] láti inú ọkàn yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ pé, “àfi bí olúkúlùkù yín bá dárí ji arákùnrin rẹ̀ láti inú ọkàn yín.”
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin rẹ̀” ń túmọ̀ ọ̀rọ̀ Gíríìkì akọ-ẹyọ̀ kan; nínú àyíká ọ̀rọ̀ yìí, a lo ó ní ọ̀nà aṣojú fún ẹlẹgbẹ́ ọmọ-ẹ̀yìn tàbí ẹlẹgbẹ́ onígbàgbọ́ kọ̀ọ̀kan.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ìkìlọ̀ yìí mọ́ ohun tí ọ̀gá inú àkàwé ṣáájú ṣe, ó sì pa agbára ìfiwéra àti ìyọrísí ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Baba mi ọ̀run
  rationale: Ìtumọ̀ yìí pa ìbátan ‘Baba mi’ àti àpèjúwe ‘ọ̀run’ mọ́ láì sọ ọ́ di gbólóhùn onítumọ̀ àfikún.
- source_word: ποιήσει ὑμῖν
  choice: yóò ṣe sí yín
  rationale: Ó pa ọ̀rọ̀ náà ní fífẹ̀ gẹ́gẹ́ bí Gíríìkì, ó sì jẹ́ kí òǹkàwé tọ́ka sí ìṣe ọ̀gá nínú àkàwé fún ohun tí a kò tún dárúkọ ní kíkún.
- source_word: ἐὰν μὴ
  choice: bí ... kò bá
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ipò òdì tí Gíríìkì gbé kalẹ̀.
- source_word: ἀφῆτε
  choice: dárí ji
  rationale: Nínú ọ̀rọ̀ ẹ̀ṣẹ̀ láàárín ènìyàn àti àwòrán gbèsè inú àkàwé, ọ̀rọ̀ náà túmọ̀ sí fífi ẹ̀ṣẹ̀ jini.
- source_word: ἕκαστος
  choice: olúkúlùkù yín
  rationale: Ó fi hàn pé ojúṣe náà kan ẹnì kọ̀ọ̀kan nínú gbogbo àwọn tí Jesu ń bá sọ̀rọ̀.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Ó pa akọ ẹyọ kan inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ó dúró fún ẹlẹgbẹ́ ọmọ-ẹ̀yìn tàbí onígbàgbọ́.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: láti inú ọkàn yín
  rationale: Ó pa àwòrán inú ọkàn àti ìtọ́kasí sí gbogbo àwọn olùgbọ́ mọ́, ó sì tẹnu mọ́ ìdáríjì àtọkànwá.
theological_decisions:
- issue: Ìwọ̀n àti agbára ìkìlọ̀ náà
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìkìlọ̀ tààrà nípa ohun tí Baba ọ̀run yóò ṣe, ní ìbámu pẹ̀lú ìdájọ́ inú àkàwé.
  alternative: Láti rọ ọ̀rọ̀ náà sí ‘yóò bá yín lò lọ́nà kan náà,’ tàbí láti fi ẹ̀kọ́ nípa ìdálẹ́bi ayérayé tàbí pàdánù èrè kún un.
  rationale: Gíríìkì fi ìkìlọ̀ onípò tó lágbára hàn, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò sọ gbogbo ẹ̀ka ẹ̀kọ́ ìgbàgbọ́ tí ìdájọ́ náà wà. Ìtumọ̀ náà pa ìnira àti àìsọ̀rọ̀-tán yẹn mọ́.
- issue: Ọ̀rọ̀ akọ nínú ἀδελφῷ
  choice: arákùnrin rẹ̀
  alternative: arákùnrin tàbí arábìnrin rẹ̀; ẹlẹgbẹ́ onígbàgbọ́ rẹ̀
  rationale: Ọ̀rọ̀ orísun jẹ́ akọ ẹyọ kan. A pa ìrísí yẹn mọ́ nínú ẹsẹ̀, a sì ṣàlàyé bí ó ṣe ń ṣiṣẹ́ gẹ́gẹ́ bí aṣojú nínú àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, ṣùgbọ́n ní èdè tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Baba mi ọ̀run’ àti ‘láti inú ọkàn yín’ láti pa ìrísí orísun mọ́ níwọ̀n tó bá ṣe àdánidá.
