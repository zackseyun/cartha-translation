id: MAT.18.32
reference: Matthew 18:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: yo
  text: Nígbà náà ni ọ̀gá rẹ̀ pè é wá sọ́dọ̀ rẹ̀, ó sì wí fún un pé, “Ìwọ ẹrú búburú[b], mo fi gbogbo gbèsè yẹn[a] jì ọ́, nítorí pé o bẹ̀ mí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo pa gbogbo gbèsè yẹn rẹ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí yíyan ẹni sílẹ̀ kúrò nínú gbèsè tàbí pípa gbèsè rẹ́, ó sì tún lè túmọ̀ sí dídárí jì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì δοῦλος lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú; a lo “ẹrú” níhìn-ín nítorí pé ìdè rẹ̀ sí ọ̀gá rẹ̀ ṣe pàtàkì nínú àkàwé náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ àkókò nínú ìtàn, ó sì bá ọ̀nà tí a fi ń sọ ìtàn ní Yorùbá mu.
- source_word: προσκαλεσάμενος
  choice: pè é wá sọ́dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó pe ẹni náà sí ọ̀dọ̀ ara rẹ̀; gbólóhùn yìí tún fi àṣẹ ọ̀gá hàn láìfi ìtumọ̀ kún un.
- source_word: ὁ κύριος αὐτοῦ
  choice: ọ̀gá rẹ̀
  rationale: Nínú àkàwé yìí, κύριος ń tọ́ka sí ẹni tó ni ẹrú náà, kì í ṣe orúkọ oyè Ọlọ́run.
- source_word: λέγει αὐτῷ
  choice: ó sì wí fún un
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ìsinsìnyí ìtàn, àkókò tí ó ti kọjá ni èdè Yorùbá fi ń sọ irú ìtàn yìí lọ́nà àdánidá.
- source_word: Δοῦλε πονηρέ
  choice: Ìwọ ẹrú búburú
  rationale: Ẹrú fi ìbáṣepọ̀ ẹni tí ọ̀gá ní lórí rẹ̀ hàn, búburú sì jẹ́ ìdájọ́ ìwà rẹ̀.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: gbogbo gbèsè yẹn
  rationale: Ó ṣàfihàn gbogbo ohun tí ó jẹ ní kíkún, ní ọ̀nà tí ó ṣe kedere tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἀφῆκά σοι
  choice: mo fi … jì ọ́
  rationale: ‘Fi … jì’ lè sọ ìdásílẹ̀ kúrò nínú gbèsè, ó sì tún pa ìsopọ̀ mọ́ èdè ìdáríjì tí àkàwé náà ń lò.
- source_word: ἐπεὶ
  choice: nítorí pé
  rationale: Ó fi ìdí tí ọ̀gá fi ṣe ohun náà hàn ní kedere.
- source_word: παρεκάλεσάς με
  choice: o bẹ̀ mí
  rationale: Ó sọ ẹ̀bẹ̀ líle tí ẹrú náà bẹ̀ ní ọ̀nà àdánidá, ṣókí ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú ìbáṣepọ̀ ọ̀gá àti ẹrú nínú àkàwé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ipò ìdè àti àṣẹ tí ọ̀gá ní lórí ẹni náà ṣe pàtàkì nínú àkàwé; ‘ẹrú’ fi èyí hàn ju ‘ìránṣẹ́’ lọ.
- issue: Ìtumọ̀ ἀφίημι níbi tí gbèsè ti jẹ́ àwòrán ìdáríjì
  choice: fi gbèsè jì
  alternative: pa gbèsè rẹ́
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí rírọ̀ tàbí pípa gbèsè rẹ́, ṣùgbọ́n ó tún ní ìtumọ̀ ìdáríjì. ‘Fi gbèsè jì’ pa méjèèjì mọ́ láìyanju ìfarakanra náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ó sì wí fún un’ ní ìrísí Bíbélì díẹ̀, ṣùgbọ́n ó ṣì jẹ́ èdè tí gbogbo ènìyàn lè lóye.
