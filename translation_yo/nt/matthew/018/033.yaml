id: MAT.18.33
reference: Matthew 18:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: yo
  text: Ṣé kò yẹ kí ìwọ náà ṣàánú ẹrú ẹlẹgbẹ́ rẹ[a], gẹ́gẹ́ bí èmi náà ti ṣàánú rẹ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́ ẹlẹgbẹ́ rẹ,” tàbí “ẹrú tí ẹ jọ ń sin ọ̀gá kan náà.” Ọ̀rọ̀ Gíríìkì σύνδουλος ń tọ́ka sí ẹni tí ó ní ọ̀gá kan náà pẹ̀lú ẹlòmíràn; a lo “ẹrú ẹlẹgbẹ́” níbí láti pa ìtumọ̀ ipò ìdè náà mọ́ nínú àkàwé yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Ṣé kò yẹ kí
  rationale: Ọ̀rọ̀ yìí fi ojúṣe ìwà rere hàn nínú ìbéèrè ìbáwí; ‘Ṣé kò yẹ kí’ jẹ́ Yorùbá àdánidá tó pa agbára ìbéèrè náà mọ́.
- source_word: καὶ σὲ
  choice: ìwọ náà
  rationale: ‘Náà’ fi ìbámu hàn láàárín ohun tí ọba ṣe àti ohun tí ó yẹ kí ẹrú náà ṣe; fífi ‘ìwọ’ hàn kedere tún pa ìtẹnumọ́ arọ́pò-orúkọ mọ́.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: ṣàánú / ti ṣàánú
  rationale: Lílo gbólóhùn kan náà ní ibi méjèèjì pa àtúnlò ọ̀rọ̀ Gíríìkì mọ́. ‘Ṣàánú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún fífi àánú hàn sí ẹnì kan.
- source_word: τὸν σύνδουλόν σου
  choice: ẹrú ẹlẹgbẹ́ rẹ
  rationale: σύνδουλος túmọ̀ sí ẹni tí ó jẹ́ ẹrú pẹ̀lú ẹlòmíràn lábẹ́ ọ̀gá kan náà. ‘Ẹrú ẹlẹgbẹ́ rẹ’ pa ipò ìdè àti ìtumọ̀ σύν- mọ́ nínú àkàwé yìí.
- source_word: ὡς κἀγὼ
  choice: gẹ́gẹ́ bí èmi náà
  rationale: ‘Gẹ́gẹ́ bí’ ṣàfihàn ìfiwéra, ‘èmi náà’ sì pa ìtẹnumọ́ κἀγώ àti ìbámu pẹ̀lú ‘ìwọ náà’ mọ́.
- source_word: σὲ
  choice: rẹ
  rationale: Arọ́pò-orúkọ ẹni kejì jẹ́ ẹni tí ìṣe àánú dé bá; Yorùbá àdánidá ń lo ‘ṣàánú rẹ’.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìdílé δοῦλος nínú σύνδουλος
  choice: ẹrú ẹlẹgbẹ́
  alternative: ìránṣẹ́ ẹlẹgbẹ́; ẹrú tí ẹ jọ ń sin ọ̀gá kan náà
  rationale: Nínú àkàwé ọba àti àwọn tí ó wà lábẹ́ àṣẹ rẹ, ipò ìdè náà ṣe pàtàkì. ‘Ẹrú ẹlẹgbẹ́’ kò rọ ìtumọ̀ náà sí ‘ìránṣẹ́’ lásán, ó sì fi hàn pé ọ̀gá kan náà ni wọ́n ní.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. Ìbéèrè ‘Ṣé kò yẹ kí...?’ mú ìbáwí àti ojúṣe ìwà rere inú ọ̀rọ̀ Gíríìkì jáde; àwọn àmì ohùn ni a lò níbi tí ó bá bá ìlò àdánidá mu.
