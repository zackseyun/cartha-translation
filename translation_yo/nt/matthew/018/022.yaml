id: MAT.18.22
reference: Matthew 18:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: yo
  text: Jésù sọ fún un pé, “Kì í ṣe títí di ìgbà méje ni mo sọ fún ọ, bí kò ṣe títí di ìgbà mẹ́tàdínlọ́gọ́rin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títí di àádọ́rin ìlọ́po méje.”
    reason: Ọ̀rọ̀ Gíríìkì ἑβδομηκοντάκις ἑπτά lè túmọ̀ sí “ìgbà mẹ́tàdínlọ́gọ́rin” tàbí “àádọ́rin ìlọ́po méje.”
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: Ó pa ọ̀rọ̀ arọ́pò-orúkọ náà mọ́ dípò fífi orúkọ Pétérù sí i. Èdè Yorùbá kò fi àkókò ìṣe hàn lórí ọ̀rọ̀-ìṣe bí Gíríìkì, nítorí náà “sọ” lè ṣiṣẹ́ gẹ́gẹ́ bí ìtàn tó ń lọ lọ́wọ́ láìfi ọ̀rọ̀ àfikún tí kò sí nínú orísun kún un.
- source_word: Οὐ λέγω σοι
  choice: Èmi kò sọ fún ọ pé
  rationale: Ìtumọ̀ yìí pa ìtẹnumọ́ ẹni àkọ́kọ́ àti ẹni tí a ń bá sọ̀rọ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: ἕως ἑπτάκις
  choice: Títí di ìgbà méje
  rationale: “Títí di” fi ààlà iye hàn, “ìgbà méje” sì túmọ̀ adverb frequency náà ní kedere.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín iye méje àti iye tó tẹ̀ lé e.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: Títí di ìgbà mẹ́tàdínlọ́gọ́rin
  rationale: A yan ìtumọ̀ “ìgbà mẹ́tàdínlọ́gọ́rin” gẹ́gẹ́ bí kíkà gígùn tó ṣeé ṣe fún gbólóhùn Gíríìkì náà, nígbà tí a pa ìtumọ̀ “àádọ́rin ìlọ́po méje” mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ọ̀rọ̀ iye ἑβδομηκοντάκις ἑπτά tí ó lè ní ìtumọ̀ méjì nínú ẹ̀kọ́ Jésù nípa ìdáríjì
  choice: ìgbà mẹ́tàdínlọ́gọ́rin
  alternative: àádọ́rin ìlọ́po méje
  rationale: Ìkọ̀wé Gíríìkì náà lè túmọ̀ sí mẹ́tàdínlọ́gọ́rin tàbí àádọ́rin tí a sọ di ìlọ́po méje. A yan èkíní nínú ọ̀rọ̀ pàtàkì, a sì fi èkejì sínú àlàyé ìsàlẹ̀, kí a má bàa fi ipá yanjú ohun tí orísun fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àtúnsọ tó wà nínú Gíríìkì mọ́ láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
