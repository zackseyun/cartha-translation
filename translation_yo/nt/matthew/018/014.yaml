id: MAT.18.14
reference: Matthew 18:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni, kì í ṣe ìfẹ́ Baba yín tí ń bẹ ní ọ̀run pé kí ọ̀kan ṣoṣo nínú àwọn kékeré wọ̀nyí ṣègbé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ọ̀kan ṣoṣo nínú àwọn kékeré wọ̀nyí sọnù.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ṣègbé” tàbí “sọnù”; àkàwé àgùntàn tó sọnù tí ó ṣáájú ṣe àtìlẹ́yìn fún ìtumọ̀ kejì.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ọ̀rọ̀ yìí pọ̀ mọ́ àkàwé àti ìtumọ̀ rẹ̀ tí ó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìfiwéra yìí.
- source_word: θέλημα
  choice: ìfẹ́
  rationale: “Ìfẹ́” níbí túmọ̀ sí ohun tí ẹnì kan fẹ́ tàbí pinnu, ó sì bá ọ̀nà tí Yorùbá fi ń sọ “ìfẹ́ Ọlọ́run” mu.
- source_word: ἔμπροσθεν
  choice: ìfẹ́ Baba yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ἔμπροσθεν túmọ̀ ní pàtó sí “níwájú,” gbogbo gbólóhùn náà jẹ́ ọ̀nà Gíríìkì láti sọ ohun tí Baba fẹ́; “kì í ṣe ìfẹ́ Baba yín” jẹ́ Yorùbá àdánidá tí kò yí èrò náà padà.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: Baba yín tí ń bẹ ní ọ̀run
  rationale: Ó pa ìbátan “Baba yín” àti ibi tí ó wà mọ́, ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἵνα ἀπόληται
  choice: pé kí ... ṣègbé
  rationale: “Ṣègbé” fi abájáde búburú tó lágbára hàn, ṣùgbọ́n a fi ìtumọ̀ “sọnù” sínú àlàyé ìsàlẹ̀ nítorí àkàwé àgùntàn tó sọnù.
- source_word: ἓν
  choice: ọ̀kan ṣoṣo
  rationale: Ó mú ìtẹnumọ́ ọ̀kan ṣoṣo nínú ọ̀pọ̀ jáde láì fi ọ̀rọ̀ “kódà” tí kò sí ní Gíríìkì kún un.
- source_word: τῶν μικρῶν τούτων
  choice: nínú àwọn kékeré wọ̀nyí
  rationale: “Àwọn kékeré” pa àwòrán ọ̀rọ̀ náà mọ́, kò sì fi dandan sọ pé àwọn ọmọdé nìkan ni.
theological_decisions:
- issue: Ìtumọ̀ ἀπόληται lẹ́yìn àkàwé àgùntàn tó sọnù
  choice: ṣègbé
  alternative: sọnù
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìparun tàbí sí jíjẹ́ ẹni tó sọnù. Ọ̀rọ̀ inú ẹsẹ̀ fi ìkìlọ̀ tó lágbára hàn pẹ̀lú “ṣègbé,” nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ tí àyíká àkàwé náà ń ṣètìlẹ́yìn fún mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A fi àmì ohùn síbi tí ó yẹ, a sì yẹra fún sísọ “àwọn kékeré” di “àwọn ọmọdé” nìkan.
