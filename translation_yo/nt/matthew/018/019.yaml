id: MAT.18.19
reference: Matthew 18:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: yo
  text: Lẹ́ẹ̀kan sí i, lóòótọ́ ni mo sọ fún yín pé, bí ẹni méjì nínú yín bá fohùn ṣọ̀kan[a] lórí ilẹ̀ ayé nípa ohunkóhun tí wọ́n bá béèrè fún[c], Baba mi tí ń bẹ ní ọ̀run[b] yóò ṣe é fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹni méjì láti inú yín bá wà ní ìṣọ̀kan.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ní àwọn ọ̀run”; a tú un sí “ní ọ̀run” gẹ́gẹ́ bí àṣà èdè Yorùbá.
    reason: lexical_alternative
  - marker: c
    text: Nínú àyíká ọ̀rọ̀, ọ̀rọ̀ yìí tẹ̀ lé ẹ̀kọ́ Jésù nípa àṣẹ àti ìbáwí àwùjọ àwọn onígbàgbọ́ (18:15–18), bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ ẹsẹ yìí fúnra rẹ̀ sọ̀rọ̀ gbígbòòrò nípa àwọn ohun tí wọ́n fohùn ṣọ̀kan láti béèrè fún.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: Lẹ́ẹ̀kan sí i
  rationale: Ó fi hàn pé Jésù tún ń fi ọ̀rọ̀ pàtàkì kan kún ẹ̀kọ́ tó ṣáájú; gbólóhùn yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: lóòótọ́ ni mo sọ fún yín
  rationale: Ó mú ìtẹnumọ́ ọ̀rọ̀ Jésù jáde ní èdè Yorùbá òde òní láìfi àtúkọ ‘àmín’ sínú ọ̀rọ̀ náà.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: bí ẹni méjì nínú yín bá fohùn ṣọ̀kan
  rationale: ‘Fohùn ṣọ̀kan’ túmọ̀ συμφωνέω gẹ́gẹ́ bí wíwà ní èrò kan; ‘nínú yín’ sì dúró fún ἐξ ὑμῶν lọ́nà tó ṣe déédéé.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ibi tí àwọn ènìyàn wà àti Baba tó wà ní ọ̀run mọ́.
- source_word: περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται
  choice: nípa ohunkóhun tí wọ́n bá béèrè fún
  rationale: ‘Ohunkóhun’ pa ìtúmọ̀ gbígbòòrò πᾶν πρᾶγμα mọ́, ‘béèrè fún’ sì bá ìtumọ̀ αἰτέω mu nínú àyíká ìbéèrè.
- source_word: γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου
  choice: Baba mi ... yóò ṣe é fún wọn
  rationale: Ìtumọ̀ yìí jẹ́ èdè Yorùbá tó ṣe kedere, ó sì fi Baba hàn gẹ́gẹ́ bí ẹni tí ìmúṣẹ náà ti ọ̀dọ̀ rẹ̀ wá.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: tí ń bẹ ní ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀, ‘ní ọ̀run’ ni ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́ ní ibi yìí.
theological_decisions:
- issue: Ìwọ̀n ìlérí náà nínú àyíká ọ̀rọ̀
  choice: A tú ọ̀rọ̀ náà ní tààràtà láìfi àlàyé kún un pé ó kan àdúrà nìkan tàbí ìbáwí ìjọ nìkan.
  alternative: Láti sọ ìlérí náà di ti ìpinnu ìbáwí ìjọ nìkan, tàbí láti sọ ọ́ di ìlérí tí kò ní ààlà fún gbogbo ohun tí a bá gbàdúrà fún.
  rationale: Àyíká ẹsẹ 15–18 dá lórí ìbáwí àti àṣẹ àwùjọ àwọn onígbàgbọ́, ṣùgbọ́n ọ̀rọ̀ ẹsẹ yìí fúnra rẹ̀ gbòòrò. Ìtumọ̀ náà pa ìfẹ̀ tó wà láàárín àyíká tó sún mọ́ ọn àti ọ̀rọ̀ gbígbòòrò yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ, a sì yan gbólóhùn tó ṣe kedere fún òǹkàwé lasán láìdín ìtumọ̀ Gíríìkì kù.
