  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, ó sì ní àmì ohùn tó pé ní àwọn ibi pàtàkì. “Fohùn ṣọ̀kan,” “béèrè fún,” àti “yóò ṣe é fún wọn” jẹ́ ọ̀nà àdánidá àti kedere fún òǹkàwé Yorùbá.
  terminology: Aṣàyàn “Baba mi” àti “ní ọ̀run” yẹ, ó sì bá ọ̀rọ̀ ìsìn inú ẹsẹ náà mu láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un. “Ní ọ̀run” jẹ́ ìtumọ̀ àdánidá fún Gíríìkì ọ̀pọ̀, οὐρανοῖς. Àlàyé ẹsẹ-ìsàlẹ̀ náà ṣetọju àìdájú àti gbòòrò ìlérí náà nínú àyíká rẹ̀.
