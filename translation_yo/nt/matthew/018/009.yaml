id: MAT.18.9
reference: Matthew 18:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: yo
  text: Bí ojú rẹ bá sì mú ọ kọsẹ̀[a], yọ ọ́ jáde, kí o sì sọ ọ́ nù kúrò lọ́dọ̀ rẹ. Ó sàn fún ọ láti wọ inú ìyè lọ pẹ̀lú ojú kan ju kí a sọ ọ sínú Gẹhẹ́nà iná pẹ̀lú ojú méjì lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú ọ ṣẹ̀.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí mímú ẹnì kan kọsẹ̀, ṣubú, tàbí ṣẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Gẹhẹ́nà” ń tọ́ka sí ibi ìdájọ́ ìkẹyìn; ní àwọn ìtumọ̀ ìbílẹ̀, a sábà máa ń túmọ̀ ọ́ sí “ọ̀run àpáàdì.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: mú ọ kọsẹ̀
  rationale: Ó pa àwòrán ìkọsẹ̀ mọ́, ó sì lè tọ́ka sí jíjẹ́ kí ènìyàn ṣubú sínú ẹ̀ṣẹ̀ láì dín ìtumọ̀ náà kù sí ìdẹwò nìkan.
- source_word: ἔξελε
  choice: yọ ọ́ jáde
  rationale: Àṣẹ náà le, ó sì ń sọ ní kedere pé kí a mú ojú náà kúrò; gbolohun yìí jẹ́ èdè Yorùbá àdánidá tí ó pa líle àwòrán náà mọ́.
- source_word: βάλε ἀπὸ σοῦ
  choice: sọ ọ́ nù kúrò lọ́dọ̀ rẹ
  rationale: Ó fi ìyapa pátápátá àti ìgbésẹ̀ onípinnu tí ọ̀rọ̀ Gíríìkì ń béèrè hàn.
- source_word: καλόν σοί ἐστιν
  choice: Ó sàn fún ọ
  rationale: Nínú ìfiwéra yìí, καλόν túmọ̀ sí ohun tí ó dára jù tàbí tí ó yẹ ká yàn, kì í ṣe ‘rere’ lásán.
- source_word: μονόφθαλμον
  choice: pẹ̀lú ojú kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘olóju kan’ nínú àyíká gbolohun yìí, ó sì pa àwòrán ara mọ́.
- source_word: εἰς τὴν ζωὴν
  choice: wọ inú ìyè lọ
  rationale: Ó pa ‘ìyè’ mọ́ láì fi ‘ayérayé’ kún un, nítorí ọ̀rọ̀ náà kò sí ní Gíríìkì bí ó tilẹ̀ jẹ́ pé àyíká rẹ̀ ní ìtumọ̀ ọjọ́ ìkẹyìn.
- source_word: βληθῆναι
  choice: kí a sì sọ ọ́ sínú
  rationale: 'Ìtumọ̀ aláìṣe ti βάλλω ni a fi hàn ní ọ̀nà Yorùbá tí ó ṣe kedere: ẹlòmíràn ni yóò sọ ẹni náà sínú ibẹ̀.'
- source_word: γέενναν
  choice: Gẹhẹ́nà
  rationale: A pa orúkọ pàtó inú Gíríìkì mọ́, dípò lílo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó gbòòrò bí ‘ọ̀run àpáàdì.’
- source_word: τοῦ πυρός
  choice: iná
  rationale: ‘Gẹhẹ́nà iná’ pa ìbáṣepọ̀ gẹnitífù àti àwòrán iná mọ́ ní ọ̀nà kúkúrú, àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ γέεννα
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: γέεννα jẹ́ ọ̀rọ̀ pàtó tó ní ìtàn Júù àti ìtumọ̀ ìdájọ́ ọjọ́ ìkẹyìn; pípa á mọ́ kò jẹ́ ká fi gbogbo ìtumọ̀ ẹ̀kọ́ ìsìn tí ‘ọ̀run àpáàdì’ lè gbé wọ inú ẹsẹ náà.
- issue: Ìtumọ̀ εἰς τὴν ζωὴν
  choice: wọ inú ìyè lọ
  alternative: wọ inú ìyè àìnípẹ̀kun lọ
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká náà lè tọ́ka sí ìyè ọjọ́ ìkẹyìn, Gíríìkì kò fi ‘àìnípẹ̀kun’ hàn ní tààrà; a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A pa àwòrán líle ti ẹsẹ náà, ìfiwéra rẹ̀, àti àìsọ ‘ìyè àìnípẹ̀kun’ ní tààrà mọ́.
