id: MAT.10.21
reference: Matthew 10:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: yo
  text: Arákùnrin yóò sì fi arákùnrin rẹ̀ lé ikú lọ́wọ́[a], baba yóò sì fi ọmọ rẹ̀ lé ikú lọ́wọ́; àwọn ọmọ yóò sì dìde sí àwọn òbí wọn, wọn yóò sì pa wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò fi arákùnrin rẹ̀ lé ẹlòmíràn lọ́wọ́ fún ikú.” Ọ̀rọ̀ náà tún lè ní èrò ṣíṣe ọ̀dàlẹ̀ sí ẹnì kan nínú àyíká irú èyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: fi ... lé wọn lọ́wọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ènìyàn lé àwọn aláṣẹ tàbí ọ̀tá lọ́wọ́. Gbólóhùn Yorùbá yìí pa agbára ìtumọ̀ náà mọ́ láì fi dandan túmọ̀ rẹ̀ sí ìwà ọ̀dàlẹ̀.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: arákùnrin ... arákùnrin rẹ̀
  rationale: Ó pa ìbátan akọ tí ọ̀rọ̀ Gíríìkì tọ́ka sí mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: εἰς θάνατον
  choice: láti pa á
  rationale: 'Ó fi ète tàbí àbájáde fífi ẹni náà lé wọn lọ́wọ́ hàn: kí wọ́n pa á.'
- source_word: πατὴρ τέκνον
  choice: baba ... ọmọ rẹ̀
  rationale: τέκνον kò dá akọ tàbí abo mọ́; “ọmọ” ni ìtumọ̀ àdánidá tó sì péye.
- source_word: ἐπαναστήσονται
  choice: yóò dìde sí
  rationale: Ó pa àwòrán Gíríìkì ti dídìde lòdì sí ẹnì kan mọ́, ó sì fi ìtakò líle hàn.
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: Ọ̀rọ̀ náà gba ọmọ akọ àti ọmọ abo, “àwọn ọmọ” sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: ἐπὶ γονεῖς
  choice: sí àwọn òbí wọn
  rationale: Nínú àyíká ọ̀rọ̀ ìkọlù, ἐπί túmọ̀ sí “lòdì sí”; “àwọn òbí” sì bo baba àti ìyá.
- source_word: θανατώσουσιν
  choice: mú kí a pa wọ́n
  rationale: Fáàbù náà lè túmọ̀ sí mímú kí a pa ẹnì kan, pàápàá nípa ìdájọ́ tàbí fífi lé àwọn apànìyàn lọ́wọ́; èyí yẹra fún fífi hàn pé àwọn ọmọ fúnra wọn ló fi ọwọ́ ara wọn pa wọ́n.
- source_word: αὐτούς
  choice: wọ́n
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí “àwọn òbí wọn,” bí ó tilẹ̀ jẹ́ pé akọ ni fọ́ọ̀mù Gíríìkì nítorí ìlànà gírámà.
theological_decisions:
- issue: Àwọn ọ̀rọ̀ ìbátan tó dá akọ mọ́ àti àwọn tó gba akọ àti abo
  choice: Lo “arákùnrin” fún ἀδελφός, ṣùgbọ́n “ọmọ/àwọn ọmọ” àti “àwọn òbí” fún τέκνον/τέκνα àti γονεῖς.
  alternative: Túmọ̀ ἀδελφός ní ọ̀nà gbogbogbò gẹ́gẹ́ bí “ọmọ ìyá kan.”
  rationale: ἀδελφός jẹ́ akọ níbí, nígbà tí τέκνα àti γονεῖς kò fi akọ tàbí abo kan ṣoṣo mọ́. Ìtumọ̀ yìí pa ìyàtọ̀ inú orísun mọ́ láì mú ẹ̀kọ́ ẹ̀sìn àfikún wọlé.
- issue: Bóyá παραδώσει túmọ̀ sí ọ̀dàlẹ̀ ní pàtó
  choice: Fi ìṣe fífi ẹni lé àwọn ọ̀tá tàbí aláṣẹ lọ́wọ́ hàn nínú ọ̀rọ̀ pàtàkì.
  alternative: Lo “dà ... sílẹ̀” tàbí “ṣe ọ̀dàlẹ̀ sí.”
  rationale: Àyíká ẹbí lè ní èrò ọ̀dàlẹ̀ nínú, ṣùgbọ́n fáàbù náà kọ́kọ́ sọ nípa fífi ẹni lé ẹlòmíràn lọ́wọ́. Àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye. “Fi ... lé wọn lọ́wọ́” jẹ́ gbólóhùn àdánidá fún fífi ènìyàn fún àwọn aláṣẹ tàbí ọ̀tá; arọ́pò-orúkọ “wọn” jẹ́ àìsọ ẹni pàtó tí Yorùbá nílò fún ìṣàn gbólóhùn náà.
