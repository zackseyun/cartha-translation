  source_fidelity: Ìtumọ̀ náà dá ìbátan ẹbí, ìṣọ̀kan ìṣe ọjọ́ iwájú, àti ìtakò àwọn ọmọ sí òbí wọn mọ́ dáadáa. Ṣùgbọ́n “mú kí a pa wọ́n” ń yí θανατώσουσιν, fáàbù ìṣe tààrà̀ (“wọn yóò pa wọ́n”), padà sí ìfẹ̀sùn tàbí ìmú-kí-ẹlòmíràn-pa ẹni; èyí kì í pa agbára ìṣe Gíríìkì mọ́. “Láti pa á” lẹ́yìn “fi ... lé wọn lọ́wọ́” tún fi àwọn olùgbà tí a kò sọ nínú orísun kún un, ó sì jẹ́ kí “wọn” má ní ìtọ́kasí kedere.
