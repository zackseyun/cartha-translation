- from: Arákùnrin yóò sì fi arákùnrin rẹ̀ lé wọn lọ́wọ́ láti pa á[a], baba yóò sì fi ọmọ rẹ̀ lé wọn lọ́wọ́; àwọn ọmọ yóò dìde sí àwọn òbí wọn, wọn yóò sì mú kí a pa wọ́n.
  to: Arákùnrin yóò sì fi arákùnrin rẹ̀ lé ikú lọ́wọ́[a], baba yóò sì fi ọmọ rẹ̀ lé ikú lọ́wọ́; àwọn ọmọ yóò sì dìde sí àwọn òbí wọn, wọn yóò sì pa wọ́n.
