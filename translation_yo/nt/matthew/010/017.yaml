id: MAT.10.17
reference: Matthew 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ ṣọ́ra fún àwọn ènìyàn,[a] nítorí wọn yóò fi yín lé àwọn ìgbìmọ̀ lọ́wọ́, wọn yóò sì nà yín ní pàṣán nínú àwọn sínágọ́gù wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ọkùnrin”; ọ̀rọ̀ Gíríìkì náà wà ní ìrísí akọ ọ̀pọ̀, ṣùgbọ́n níbí ó ń tọ́ka sí àwọn ènìyàn lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn yìí jẹ́ ìkìlọ̀ nípa ewu; “ẹ ṣọ́ra” jẹ́ Yorùbá àdánidá tó sì pa agbára ìkìlọ̀ náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ sí ìkìlọ̀ hàn lẹ́yìn ọ̀rọ̀ tó ṣáájú.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: fún àwọn ènìyàn
  rationale: Pẹ̀lú προσέχω, ἀπό tọ́ka sí àwọn tí ewu ti ọ̀dọ̀ wọn wá. “Àwọn ènìyàn” jẹ́ ti gbogbogbò, kò sì dá ọ̀rọ̀ náà mọ́ akọ nìkan.
- source_word: παραδώσουσιν
  choice: wọn yóò fà yín lé ... lọ́wọ́
  rationale: Ó túmọ̀ sí fífi ẹnì kan lé àwọn aláṣẹ tàbí ilé ẹjọ́ lọ́wọ́; yíyan yìí pa ìtumọ̀ ti ọ̀ràn ìdájọ́ mọ́ láìfi ìtumọ̀ ‘dà’ kún un.
- source_word: συνέδρια
  choice: àwọn ìgbìmọ̀
  rationale: Ọ̀pọ̀ orúkọ náà tọ́ka sí àwọn ìgbìmọ̀ ìṣàkóso tàbí ìdájọ́ àdúgbò, kì í ṣe Sànhẹ́dírìn ti Jerúsálẹ́mù nìkan.
- source_word: συναγωγαῖς
  choice: àwọn sínágọ́gù
  rationale: Ó tọ́ka sí àwọn ibi ìpéjọ àti ìjọsìn Júù; “sínágọ́gù” ni àkọsílẹ̀ orúkọ tó mọ́gbọ́n dání ní Yorùbá.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ó so àwọn sínágọ́gù náà mọ́ àwọn ènìyàn tí a mẹ́nu kàn.
- source_word: μαστιγώσουσιν
  choice: wọn yóò ... nà yín ní pàṣán
  rationale: Ó ṣàpèjúwe ìjìyà ara nípa lílu pẹ̀lú pàṣán; gbolohun yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
theological_decisions:
- issue: Ìtumọ̀ akọ tàbí gbogbogbò ti ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ìrísí akọ ọ̀pọ̀, ó ń tọ́ka sí ènìyàn lápapọ̀ níbí, kì í ṣe àwọn ọkùnrin nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àṣẹ ọ̀pọ̀ “ẹ ṣọ́ra” àti àwọn fọ́ọ̀mù “yín” nítorí Jesu ń bá àwọn ọmọ-ẹ̀yìn rẹ̀ lọ́pọ̀ sọ̀rọ̀.
