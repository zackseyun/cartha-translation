  to: Ó tó fún ọmọ-ẹ̀yìn láti dà bí olùkọ́ rẹ̀, àti fún ẹrú láti dà bí ọ̀gá rẹ̀. Bí wọ́n bá pe baálé ilé ní Beelsebulu,[a] mélòómélòó ni wọ́n yóò pe àwọn ará ilé rẹ̀ ní Beelsebulu!
  rationale: 'Àtúnṣe kan ṣoṣo ni a ṣe: a rọ́pò aṣojú ‘bẹ́ẹ̀’ ní gbolohun ìkẹyìn pẹ̀lú ‘ní Beelsebulu,’ kí ìtumọ̀ ìpè-orúkọ tí Gíríìkì fi sílẹ̀ ní ellipsis lè hàn kedere, kí ìjọra a fortiori sì dúró. Àwọn apá yòókù kò nílò àtúnṣe.'
