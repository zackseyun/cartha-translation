  verdict: revise
  source_fidelity: 'Ìpín àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: ἀρκετόν, μαθητής–διδάσκαλος, àti δοῦλος–κύριος ni a ti gbé kalẹ̀ pẹ̀lú ìbátan tó yẹ. ‘Baálé ilé’ àti ‘àwọn ará ilé’ tún pa ìsopọ̀ οἰκοδεσπότης–οἰκιακοί mọ́. Ṣùgbọ́n gbolohun ìkẹyìn, ‘pe àwọn ará ilé rẹ̀ bẹ́ẹ̀,’ kì í sọ ní kedere ohun tí a ó pè wọ́n ní, níbi tí Gíríìkì ti fi ellipsis ‘[pe] wọn ní Beelsebulu’ hàn. Àtúnṣe náà mú ìfihàn yẹn kedere láì yí ìtumọ̀ a fortiori padà.'
