id: MAT.10.25
reference: Matthew 10:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: yo
  text: Ó tó fún ọmọ-ẹ̀yìn láti dà bí olùkọ́ rẹ̀, àti fún ẹrú láti dà bí ọ̀gá rẹ̀. Bí wọ́n bá pe baálé ilé ní Beelsebulu,[a] mélòómélòó ni wọ́n yóò pe àwọn ará ilé rẹ̀ ní Beelsebulu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn kan tún máa ń kọ orúkọ yìí sí Beelsebubu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Ó tó
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan péye tàbí tó, ó sì pa agbára gbolohun Gíríìkì mọ́.
- source_word: μαθητῇ
  choice: ọmọ-ẹ̀yìn
  rationale: Ó fi ìbáṣepọ̀ ẹni tí ń kọ́ lábẹ́ olùkọ́ hàn ju ọ̀rọ̀ tó túmọ̀ sí akẹ́kọ̀ọ́ ilé-ìwé lásán lọ.
- source_word: ἵνα γένηται
  choice: láti dà
  rationale: Nínú àyíká yìí, ó sọ àbájáde tàbí ohun tí ó tó fún ọmọ-ẹ̀yìn; èdè Yorùbá yìí ṣe kedere, ó sì bá ìtumọ̀ mu.
- source_word: διδάσκαλος
  choice: olùkọ́
  rationale: Ó bá ìbátan μαθητής–διδάσκαλος mu, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ κύριος.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Àfiwé pẹ̀lú κύριος ń tẹnumọ́ ipò ẹni tí ó wà lábẹ́ àṣẹ ọ̀gá; ‘ẹrú’ pa ìbáṣepọ̀ àwùjọ yẹn mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: κύριος
  choice: ọ̀gá
  rationale: Níhìn-ín, ọ̀rọ̀ náà jẹ́ ti ìbáṣepọ̀ ẹrú àti ẹni tó ni ín, kì í ṣe oyè ìjẹ́wọ́ ẹ̀sìn ní tààrà.
- source_word: οἰκοδεσπότην
  choice: baálé ilé
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tó jẹ́ olórí tàbí aláṣẹ ilé, ó sì so mọ́ àwòrán àwọn ará ilé.
- source_word: Βεελζεβοὺλ
  choice: Beelsebulu
  rationale: Àkọtọ̀ Yorùbá yìí tẹ̀ lé fọ́ọ̀mù Gíríìkì Beelzebul, pẹ̀lú fáwẹ́lì ìparí tó jẹ́ àdánidá nínú Yorùbá.
- source_word: ἐπεκάλεσαν
  choice: wọ́n bá pe ... ní
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi orúkọ tàbí àpèjúwe kan ẹni; ‘pe ... ní’ ni ọ̀nà Yorùbá tó ṣe tààrà jù.
- source_word: πόσῳ μᾶλλον
  choice: mélòómélòó
  rationale: Ó jẹ́ àṣà ọ̀rọ̀ Yorùbá fún àríyànjiyàn láti ohun kékeré sí ohun tó pọ̀ jù, bíi ‘how much more.’
- source_word: οἰκιακοὺς
  choice: àwọn ará ilé rẹ̀
  rationale: Ó gba gbogbo àwọn tó jẹ́ ti agbo ilé náà, kì í ṣe àwọn ẹrú nìkan, ó sì bá οἰκοδεσπότης mu.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àfiwé agbo ilé
  choice: ọ̀gá
  alternative: Olúwa
  rationale: Àyíká ẹrú–ọ̀gá àti baálé ilé ni gbolohun náà ń lò; ‘ọ̀gá’ pa àfiwé àwùjọ mọ́ láì fi oyè Kristọ́ sí ibi tí ọ̀rọ̀ náà kò ti sọ ọ́ ní tààrà.
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ìyàtọ̀ ipò láàárín δοῦλος àti κύριος ṣe pàtàkì níbí; ‘ẹrú’ fi ìdè àti ìtẹríba ipò náà hàn kedere.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye, ni a lò. ‘Baálé ilé’ àti ‘àwọn ará ilé’ pa eré ọ̀rọ̀ agbo ilé inú Gíríìkì mọ́. A lò ‘mélòómélòó’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún πόσῳ μᾶλλον.
