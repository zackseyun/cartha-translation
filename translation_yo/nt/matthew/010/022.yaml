- from: Ẹ ó sì di ẹni tí gbogbo ènìyàn yóò kórìíra nítorí orúkọ mi.[a] Ṣùgbọ́n ẹni tí ó bá fara dà á dé òpin[b] ni a ó gbà là.[c][d]
  to: Gbogbo ènìyàn yóò sì kórìíra yín nítorí orúkọ mi.[a] Ṣùgbọ́n ẹni tí ó bá faradà títí dé òpin náà ni a ó gbà là.[b][c][d]
  rationale: A tún gbolohun àkọ́kọ́ ṣe kí ó lè sọ pé ‘ẹ̀yin’ ni gbogbo ènìyàn yóò kórìíra, gẹ́gẹ́ bí μισούμενοι ὑπὸ πάντων. A rọ́pò ọ̀rọ̀ ìfaradà náà pẹ̀lú “faradà títí dé òpin,” a sì fi “náà ni” hàn gẹ́gẹ́ bí ìtẹnumọ́ adayeba fún οὗτος. Àwọn akọsilẹ̀ ìsàlẹ̀ ni a ṣètò sí ìtumọ̀ tuntun, láìfi ìpinnu ẹ̀kọ́ ìsìn kún σωθήσεται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:51Z'
