id: MAT.10.22
reference: Matthew 10:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: yo
  text: Gbogbo ènìyàn yóò sì kórìíra yín nítorí orúkọ mi.[a] Ṣùgbọ́n ẹni tí ó bá faradà títí dé òpin náà ni a ó gbà là.[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí mi,” níwọ̀n bí “orúkọ mi” ti ń tọ́ka sí Jesu fúnra rẹ̀ àti ìfaramọ́ sí i.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí ó bá dúró ṣinṣin títí dé òpin.”
    reason: lexical_alternative
  - marker: c
    text: “A ó gbà là” tún lè túmọ̀ sí “a ó dá nídè” tàbí “a ó gbà kúrò nínú ewu,” gẹ́gẹ́ bí a ṣe lóye àyíká ọ̀rọ̀ náà.
    reason: alternative_reading
  - marker: d
    text: 'Ní ìtumọ̀ tí ó fi ìtẹnumọ́ ọ̀rọ̀ Gíríìkì hàn ní tààrà: “Ṣùgbọ́n ẹni tí ó bá faradà títí dé òpin, ẹni yìí ni a ó gbà là.”'
    reason: previous_rendering
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: ẹni tí gbogbo ènìyàn yóò kórìíra
  rationale: Àkójọpọ̀ ọ̀rọ̀ ọjọ́ iwájú náà ń tọ́ka sí ipò tí yóò dé bá àwọn ọmọ-ẹ̀yìn; ‘gbogbo ènìyàn’ sì pa agbára gbogbogbò πάντων mọ́ nínú Yorùbá àdánidá.
- source_word: διὰ τὸ ὄνομά μου
  choice: nítorí orúkọ mi
  rationale: διά pẹ̀lú accusative ń sọ ìdí tàbí okùnfà; ‘orúkọ mi’ pa àwòrán orísun mọ́, tí ó sì lè dúró fún ẹni Jesu, àṣẹ rẹ̀, àti ìfaramọ́ sí i.
- source_word: ὁ δὲ ὑπομείνας
  choice: ẹni tí ó bá fara dà á
  rationale: ‘Fara dà á’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún dídúró ṣinṣin lábẹ́ ìpọ́njú, láìfi èrò ẹ̀kọ́ ìsìn kan kún un.
- source_word: εἰς τέλος
  choice: dé òpin
  rationale: Ó fi hàn pé ìfaradà náà ń bá a lọ títí dé ibi ìparí.
- source_word: οὗτος
  choice: ni
  rationale: Ẹ̀ka ìtẹnumọ́ ‘ni’ ń pa ìtẹnumọ́ arọ́pò-orúkọ οὗτος mọ́ ní Yorùbá tó ṣe déédé, dípò gbolohun líle bí ‘ẹni yìí’.
- source_word: σωθήσεται
  choice: a ó gbà là
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ gbígbàlà, ìdáǹdè, tàbí ìgbàlà kúrò nínú ewu; ‘a ó gbà là’ pa ìfẹ̀ rẹ̀ mọ́ láìdín un kù sí ìdáǹdè ti ara nìkan.
theological_decisions:
- issue: Ìtumọ̀ ìgbàlà ìkẹyìn ní ìbáṣepọ̀ pẹ̀lú ìfaradà
  choice: A pa ọ̀rọ̀ gbòòrò ‘a ó gbà là’ mọ́, láìsọ bóyá ìdáǹdè ní ayé yìí tàbí ìgbàlà ọjọ́ ìkẹyìn ni ó dá lé.
  alternative: A ó dá a sí ‘a ó dá a nídè kúrò lọ́wọ́ ewu’ tàbí ‘yóò rí ìgbàlà ọjọ́ ìkẹyìn.’
  rationale: Ẹsẹ̀ náà so ìfaradà lábẹ́ inúnibíni mọ́ ìgbàlà, ṣùgbọ́n kò yẹ kí ìtumọ̀ yanju àríyànjiyàn ẹ̀kọ́ ìsìn tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún. Ìtẹnumọ́ οὗτος ni a fi ẹ̀ka ‘ni’ hàn lọ́nà àdánidá.
