  source_fidelity: Ìtumọ̀ náà ń fi ìtumọ̀ gbogbo ìpín Gíríìkì hàn, ṣùgbọ́n ìkọ́lé àkọ́kọ́ náà, “Ẹ ó sì di ẹni tí gbogbo ènìyàn yóò kórìíra,” jẹ́ èyí tí kò rọrùn ní Yorùbá, ó sì lè mú kí ‘ẹni’ dà bí ẹni kan dípò ‘ẹ̀yin’ púpọ̀. Ìṣe tí ó hàn gedegbe jù ni láti sọ pé gbogbo ènìyàn yóò kórìíra ‘yín.’ “Faradà títí dé òpin” sì bá ὑπομείνας εἰς τέλος mu ní tààrà ju “fara dà á dé òpin” lọ.
