source:
  edition: SBLGNT
  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: yo
  text: Fílípì àti Bátólómíù, Tómásì àti Mátíù agbowó orí, Jákọ́bù ọmọ Álífíọ̀sì àti Tádéù[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kà pé “Lébáù” (tàbí “Lébáù, ẹni tí a ń pè ní Tádéù”); nínú àtòjọ àwọn aposteli tí Lúùkù kọ, “Júdásì ọmọ Jákọ́bù” ni ó wà ní ipò yìí.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: Fílípì
  rationale: Àkọsílẹ̀ orúkọ náà ní ìlànà Yorùbá tí ó wọ́pọ̀ nínú Bíbélì, pẹ̀lú àmì ohùn.
- source_word: Βαρθολομαῖος
  choice: Bátólómíù
  rationale: Àkọsílẹ̀ orúkọ náà ní ọ̀nà tí olùkà Yorùbá lè pè nírọ̀rùn.
- source_word: Θωμᾶς
  choice: Tómásì
  rationale: Àkọsílẹ̀ orúkọ Gíríìkì náà ní ìlànà Yorùbá tí a mọ̀ dáadáa.
- source_word: Μαθθαῖος
  choice: Mátíù
  rationale: Ìrísí orúkọ náà tí ó ti wọ́pọ̀ nínú lílo Yorùbá.
- source_word: ὁ τελώνης
  choice: agbowó òde
  rationale: Ó túmọ̀ sí ẹni tí ń gba owó orí tàbí owó kọjá; ‘agbowó òde’ jẹ́ ọ̀rọ̀ Yorùbá Bíbélì tí a mọ̀, tí ó sì ṣókí nínú àtòjọ yìí.
- source_word: Ἰάκωβος
  choice: Jákọ́bù
  rationale: Ó tẹ̀lé ìbátan orúkọ Gíríìkì náà pẹ̀lú Jákọ́bù, ó sì yẹra fún fífi àṣà Gẹ̀ẹ́sì ‘James’ lé orísun náà lórí.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: ọmọ Álífíọ̀sì
  rationale: Gbólóhùn oníṣúra-jẹ́ǹítífù náà ń fi baba Jákọ́bù hàn; ‘ọmọ’ mú ìbátan náà ṣe kedere ní Yorùbá.
- source_word: Ἁλφαίου
  choice: Álífíọ̀sì
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìrísí Yorùbá tí ó ṣeé pè.
- source_word: Θαδδαῖος
  choice: Tádéù
  rationale: Ó tú SBLGNT Θαδδαῖος tààrà sí orúkọ Yorùbá; àwọn orúkọ mìíràn wà nínú àkọsílẹ̀ ẹsẹ̀.
- source_word: καὶ
  choice: àti
  rationale: Asopọ̀ Yorùbá tó bá ìtòlẹ́sẹẹsẹ paratactic Gíríìkì mu.
theological_decisions:
- issue: Ìdánimọ̀ aposteli tó gbẹ̀yìn nínú àtòjọ náà
  choice: Tádéù
  alternative: Lébáù; Júdásì ọmọ Jákọ́bù
  rationale: Ọ̀rọ̀ SBLGNT tí a fún wa ka Θαδδαῖος, nítorí náà a fi Tádéù sínú ọ̀rọ̀ pàtàkì. A kò da àwọn ẹ̀rí àfọwọ́kọ àti àtòjọ Lúùkù pọ̀ mọ́ ọn; a sọ wọn ní àkọsílẹ̀ ẹsẹ̀.
translation_notes:
  register: Yorùbá ìpele boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà níyì, ó ṣeé lóye, ó sì pa ìrísí àtòjọ Gíríìkì mọ́. Àmì ẹsẹ̀ [a] wà lẹ́yìn Bátólómíù gẹ́gẹ́ bí ohun èlò tí a gbà, bí ó tilẹ̀ jẹ́ pé àlàyé rẹ̀ kan Tádéù ní ìparí ẹsẹ̀.
