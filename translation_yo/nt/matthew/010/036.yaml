  text: And a man's enemies will be those of his own household[a].
translation:
  language: yo
  text: Àwọn ọ̀tá ẹni yóò jẹ́ àwọn ará ilé rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn ará ilé ẹni ni ọ̀tá rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lo “ènìyàn” ní ẹyọ gẹ́gẹ́ bí aṣojú.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí ó ṣáájú rẹ̀ láìfi ìtumọ̀ míì kún un; fífi “sì” sí ipò yìí jẹ́ àdánidá ní Yorùbá.
- source_word: ἐχθροὶ
  choice: ọ̀tá
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí wọ́n tako ẹni tàbí tí wọ́n bá a ní ọ̀tá; “ọ̀tá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lágbára tó.
- source_word: τοῦ ἀνθρώπου
  choice: ẹni ... rẹ̀
  rationale: ἄνθρωπος níbí dúró fún ẹnì kọ̀ọ̀kan lápapọ̀. Ìtumọ̀ “ẹni ... rẹ̀” pa ìṣe aṣojú yẹn mọ́ ní Yorùbá, níbi tí ọ̀rọ̀ arọ́pò-orúkọ ẹni kẹta kò ti fi akọ tàbí abo hàn.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: àwọn ará ilé ẹni náà
  rationale: οἰκιακοί túmọ̀ sí àwọn tó jẹ́ ti agbo ilé ẹni, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan. “Àwọn ará ilé ẹni náà” jẹ́ àdánidá, ó sì pa ìtẹnumọ́ αὐτοῦ mọ́.
theological_decisions:
- issue: Èdè akọ tó ń ṣojú gbogbo ènìyàn nínú ἀνθρώπου
  choice: ẹni
  alternative: ọkùnrin kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ tó ní ìrísí akọ, ó ń ṣiṣẹ́ gẹ́gẹ́ bí aṣojú ènìyàn lápapọ̀. Yorùbá kò ní arọ́pò-orúkọ akọ/abo ní ẹni kẹta; “ẹni” ni ọ̀nà àdánidá láti pa ìtumọ̀ aṣojú náà mọ́ láìfi akọ tàbí abo tí èdè ìfojúsun kò béèrè kún un.
- issue: Ìbáṣepọ̀ ọ̀tá àti ará ilé
  choice: yóò ... di ọ̀tá rẹ̀
  alternative: ni ọ̀tá rẹ̀
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ àsọtẹ́lẹ̀ ohun tí ìpín yóò mú wá. “Yóò di” mú agbára ọjọ́ iwájú tí a lóye nínú ọ̀rọ̀ náà jáde, ṣùgbọ́n kò sọ pé gbogbo ará ilé jẹ́ ọ̀tá ní gbogbo ìgbà.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ará ilé” ni a lò fún àwọn ọmọ agbo ilé, kì í ṣe ilé gbígbé fúnra rẹ̀. Àmì ohùn ni a fi sí ibi tí ó yẹ.
