id: MAT.10.5
reference: Matthew 10:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: yo
  text: Jésù rán àwọn méjìlá wọ̀nyí jáde, ó sì fún wọn ní àṣẹ pé, “Ẹ má ṣe gba ọ̀nà lọ sí ọ̀dọ̀ àwọn Kèfèrí[a], ẹ má sì wọ ìlú kan ti àwọn ará Samáríà[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe wọ ọ̀nà àwọn Kèfèrí.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ‘ọ̀nà’ ní tààrà, ó sì ṣeé ṣe kó túmọ̀ sí lílọ sí agbègbè àwọn Kèfèrí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìlú àwọn ará Samáríà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: àwọn méjìlá wọ̀nyí
  rationale: Èyí túmọ̀ demonstrative, article àti numeral náà ní tààrà, láìfi ‘ọmọ-ẹ̀yìn’ kún un, nítorí ọ̀rọ̀ náà kò sí nínú Gíríìkì.
- source_word: ἀπέστειλεν
  choice: rán ... jáde
  rationale: ‘Rán ... jáde’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé a rán wọn lọ fún iṣẹ́ kan, láìsọ ọ́ di ìgbékalẹ̀ àṣẹ ayẹyẹ.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: ó sì fún wọn ní àṣẹ pé
  rationale: Gbólóhùn yìí mú agbára ìtọ́ni náà àti ìṣáájú ọ̀rọ̀ tààrà pọ̀ sínú Yorùbá tó mọ́gbọ́n dání; ‘àṣẹ’ pa agbára παραγγέλλω mọ́.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: gba ọ̀nà lọ sí ọ̀dọ̀ àwọn Kèfèrí
  rationale: Èyí pa àwòrán ọ̀nà (ὁδός) mọ́, ó sì sọ ìtọ́sọ́nà sí agbègbè àwọn tí kì í ṣe Júù ní Yorùbá àdánidá.
- source_word: ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká iṣẹ́ ìránṣẹ́ Júù yìí, ọ̀rọ̀ náà tọ́ka sí àwọn tí kì í ṣe Júù. ‘Kèfèrí’ ni ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún ìtumọ̀ yìí, kì í ṣe dandan pé ó ń dá wọn lẹ́bi gẹ́gẹ́ bí aláìnígbàgbọ́.
- source_word: μὴ ἀπέλθητε
  choice: Ẹ má ṣe ... lọ
  rationale: Ìlànà ‘Ẹ má ṣe’ fi ìfòfindè aorist subjunctive náà hàn ní kedere, ‘lọ’ sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: wọ ìlú àwọn ará Samáríà kan
  rationale: ‘Wọ ìlú’ túmọ̀ εἰσέρχομαι lọ́nà àdánidá; ‘ìlú ... kan’ fi àìní article nínú Gíríìkì hàn, ‘àwọn ará Samáríà’ sì pa genitive ẹgbẹ́ ènìyàn náà mọ́.
- source_word: μὴ εἰσέλθητε
  choice: ẹ má sì wọ
  rationale: Ó jẹ́ ìfòfindè tó ṣe tààrà, ó sì bá àtẹ̀lé gbolohun Yorùbá mu.
theological_decisions:
- issue: Ìwọ̀n àti àkókò ìfòfindè nípa àwọn Kèfèrí àti ará Samáríà
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ pàtó fún ìránṣẹ́ àwọn méjìlá yìí, láìfi ọ̀rọ̀ kún un pé ìkọ̀sílẹ̀ náà wà títí láé.
  alternative: Lílo ọ̀rọ̀ tó lè mú kó dà bí ìfòfindè pípé tàbí títí láé lórí àwọn ẹgbẹ́ méjèèjì.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ sọ ìfòfindè tó lágbára nínú ìránṣẹ́ yìí, ṣùgbọ́n kò sọ pé ó jẹ́ ìlànà títí láé. Ìtumọ̀ náà pa agbára àti ìfọ̀rọ̀ṣọ̀kan ẹ̀kọ́ ìsìn inú ẹsẹ̀ mọ́ láìyanjú rẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo ‘Jésù,’ ‘Kèfèrí,’ àti ‘Samáríà’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀, láìfi ẹ̀kọ́ ẹ̀ya ìjọ kankan kún un.
