translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμῶν àti àwọn tí Jésù ń bá sọ̀rọ̀.
