  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: yo
  text: Ẹ má ṣe pèsè wúrà, tàbí fàdákà, tàbí owó bàbà[a] sínú àmùrè yín[b],
  philosophy: optimal-equivalence
