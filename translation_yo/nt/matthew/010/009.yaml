  source_fidelity: Ìtumọ̀ àwọn ohun èlò—wúrà, fàdákà, àti bàbà—pẹ̀lú ‘sínú àmùrè yín’ ń tẹ̀lé Gíríìkì dáadáa. Síbẹ̀, ‘Ẹ má ṣe wá’ lè túmọ̀ sí má ṣe ṣàwárí tàbí má ṣe wá kiri, ó sì kéré sí ìtumọ̀ κτήσησθε, ‘ẹ má ṣe nífẹ̀ẹ́ sí rírí/ìpèsè ohun fún ara yín.’ ‘Ẹ má ṣe pèsè’ dá ìtumọ̀ ìmúrasílẹ̀ fún ìrìn iṣẹ́ náà hàn dáadáa ju, láìdá a sí ‘gbé’ tàbí ‘kó.’
