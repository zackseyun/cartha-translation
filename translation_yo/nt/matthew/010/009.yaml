lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Ẹ má ṣe wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti rí ohun kan gbà tàbí láti pèsè rẹ̀ fún ara ẹni; “ẹ má ṣe wá” fi hàn pé wọn kò gbọ́dọ̀ pèsè owó náà fún ìrìn iṣẹ́ wọn, kì í ṣe pé wọn kò gbọ́dọ̀ kàn gbé e nìkan.
- source_word: χρυσὸν
  choice: wúrà
  rationale: Ó jẹ́ orúkọ ohun èlò náà ní tààràtà, ṣùgbọ́n nínú àyíká yìí ó dúró fún owó wúrà.
- source_word: ἄργυρον
  choice: fàdákà
  rationale: Ó jẹ́ orúkọ ohun èlò náà ní tààràtà, tí ó sì ń tọ́ka sí owó fàdákà níbí.
- source_word: χαλκὸν
  choice: owó bàbà
  rationale: χαλκός lè túmọ̀ sí bàbà tàbí idẹ; nínú àkójọ owó wúrà, fàdákà àti χαλκός, “owó bàbà” jẹ́ ọ̀nà àdánidá láti fi ṣàlàyé owó kékeré láìsọ ìtumọ̀ owó náà nù.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: sí inú àmùrè yín
  rationale: εἰς ń fi ìlọsí ibi hàn, ζώνη sì ni àmùrè tàbí aṣọ ìgbànú; nígbà náà, a lè fi owó pamọ́ sínú rẹ̀. Gbólóhùn yìí pa àwòrán orísun mọ́.
