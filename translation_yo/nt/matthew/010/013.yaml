id: MAT.10.13
reference: Matthew 10:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: yo
  text: Bí ilé náà bá sì yẹ́,[a] kí àlàáfíà yín wá sórí rẹ̀; ṣùgbọ́n bí kò bá yẹ́,[b] kí àlàáfíà yín padà sọ́dọ̀ yín.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ènìyàn inú ilé náà” tàbí “ibùgbé”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ilé náà àti, nípa ìfẹ̀hónúhàn, àwọn tí ń gbé inú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: “Yẹ́” níhìn-ín túmọ̀ sí pé ilé náà bá a mu láti gba àwọn òjíṣẹ́ náà àti àlàáfíà wọn, kì í ṣe pé àwọn tó wà níbẹ̀ jẹ́ aláìlẹ́ṣẹ̀ ní ti ìwà.
    reason: cultural_note
  - marker: c
    text: Tàbí “kí àlàáfíà yín yí padà sọ́dọ̀ yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ilé
  rationale: “Ilé” ni ìbámu tààrà jù lọ; nínú àyíká ọ̀rọ̀ yìí, ó tún lè tọ́ka sí agbo ilé tàbí àwọn olùgbé inú rẹ̀.
- source_word: ἀξία
  choice: yẹ́
  rationale: “Yẹ́” pa ìtumọ̀ ẹni tàbí ilé tí ó bá ipò náà mu mọ́, láì sọ pé wọn jẹ́ aláìlẹ́ṣẹ̀ ní ti ìwà.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún εἰρήνη, ó sì lè gba ìtumọ̀ ìkíni àti ìbùkún ire nínú àyíká yìí.
- source_word: ἐλθάτω ... ἐπ’ αὐτήν
  choice: ẹ jẹ́ kí ... bà lé e
  rationale: Ìtumọ̀ yìí pa agbára àṣẹ ẹni kẹta àti àwòrán àlàáfíà tí ń dé sórí ilé náà mọ́ ní Yorùbá tó ṣàn.
- source_word: πρὸς ὑμᾶς ἐπιστραφήτω
  choice: ẹ jẹ́ kí ... padà sọ́dọ̀ yín
  rationale: Ó fi ìdarí ìpadà tọ àwọn ọmọ-ẹ̀yìn hàn kedere, ó sì pa àṣẹ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μὲν ... δὲ
  choice: bí ... sì; ṣùgbọ́n bí ...
  rationale: Ètò yìí fi ìyàtọ̀ àwọn ipò méjèèjì hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìwà “àlàáfíà yín”
  choice: A pa á mọ́ gẹ́gẹ́ bí àlàáfíà àwọn ọmọ-ẹ̀yìn tí ó lè bà lé ilé tàbí padà sọ́dọ̀ wọn.
  alternative: Ìkíni àlàáfíà yín; ìbùkún àlàáfíà tí ẹ kéde.
  rationale: Ọ̀rọ̀ náà ṣe àlàáfíà bí ohun tí ó lè dé tàbí padà, ṣùgbọ́n kò ṣàlàyé bí èyí ṣe ń ṣẹlẹ̀. Ìtumọ̀ náà pa àwòrán àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì dín in kù sí ìkíni lásán tàbí sọ ọ́ di agbára ẹ̀mí tí a ti ṣètò ní kíkún.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ jẹ́ kí” láti fi àṣẹ ẹni kẹta Gíríìkì hàn, àti “bà lé e” láti pa àwòrán ìtọ́sọ́nà ἐπ’ αὐτήν mọ́.
