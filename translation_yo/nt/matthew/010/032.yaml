id: MAT.10.32
reference: Matthew 10:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: yo
  text: Nítorí náà, ẹnikẹ́ni tí ó bá jẹ́wọ́ mi[a] níwájú àwọn ènìyàn, èmi pẹ̀lú yóò jẹ́wọ́ rẹ̀[b] níwájú Bàbá mi tí ó wà ní ọ̀run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó túmọ̀ ní tààrà sí “tí ó bá jẹ́wọ́ nínú mi.” Ní àyíká yìí, ìtumọ̀ rẹ̀ ni jíjẹ́wọ́ Jésù ní gbangba.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ó túmọ̀ ní tààrà sí “èmi pẹ̀lú yóò jẹ́wọ́ nínú rẹ̀,” tàbí “nípa rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Nítorí náà, ẹnikẹ́ni tí
  rationale: “Ẹnikẹ́ni tí” sọ ìtumọ̀ gbòòrò tí Πᾶς ... ὅστις ní, “Nítorí náà” sì pa ìsopọ̀ ìparí tí οὖν ní mọ́.
- source_word: ὁμολογήσει
  choice: tí ó bá jẹ́wọ́
  rationale: “Jẹ́wọ́” lè túmọ̀ sí jíjẹ́wọ́ tàbí fífi hàn ní gbangba pé ẹni kan mọ Kristi; ó sì jẹ́ kí àtúnsọ ọ̀rọ̀ náà ní apá kejì ẹsẹ náà dúró.
- source_word: ἐν ἐμοὶ
  choice: mi
  rationale: Pẹ̀lú ὁμολογέω, gbólóhùn náà ń tọ́ka sí jíjẹ́wọ́ Jesu. “Jẹ́wọ́ mi” jẹ́ Yorùbá àdánidá ju “jẹ́wọ́ nínú mi” lọ, ṣùgbọ́n a tọ́ka sí ìrísí Gíríìkì nínú àlàyé ìsàlẹ̀.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: níwájú àwọn ènìyàn
  rationale: “Níwájú” fi ìtumọ̀ wíwà ní ojú tàbí ní àárín àwọn míì hàn; “àwọn ènìyàn” sì jẹ́ ọ̀rọ̀ àpapọ̀ tó bá ἀνθρώπων mu láìfi akọ nìkan sí i.
- source_word: ὁμολογήσω κἀγὼ
  choice: èmi pẹ̀lú yóò jẹ́wọ́
  rationale: “Èmi pẹ̀lú” pa ìtẹnumọ́ κἀγώ mọ́, “yóò jẹ́wọ́” sì tún ọ̀rọ̀ ìṣe àkọ́kọ́ ṣe gẹ́gẹ́ bí Gíríìkì.
- source_word: ἐν αὐτῷ
  choice: rẹ̀
  rationale: “Jẹ́wọ́ rẹ̀” ni Yorùbá àdánidá fún ìtumọ̀ pé Jesu yóò jẹ́wọ́ ẹni náà. Àlàyé ìsàlẹ̀ pa ìrísí tí ó túmọ̀ ní tààrà sí “nínú rẹ̀” mọ́.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Baba mi tí ó wà ní ọ̀run
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó mọ́, tó sì pa ìtumọ̀ ibi tí Gíríìkì ní mọ́; bí ó tilẹ̀ jẹ́ pé οὐρανοῖς jẹ́ ọ̀pọ̀ nínú Gíríìkì, “ọ̀run” ni àṣà Yorùbá tó yẹ níbí.
theological_decisions:
- issue: Jíjẹ́wọ́ Jesu ní gbangba àti bí Jesu ṣe máa jẹ́wọ́ ẹni náà padà
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìlérí pé Jesu yóò jẹ́wọ́ ẹni tí ó jẹ́wọ́ rẹ̀ níwájú àwọn ènìyàn.
  alternative: Kí a sọ ní pàtó pé ó ń tọ́ka sí ìdájọ́ ìkẹyìn, tàbí kí a fi ìlànà kan nípa bí ìgbàlà ṣe ń ṣiṣẹ́ kún un.
  rationale: Ẹsẹ náà sọ ìbáṣepọ̀ jíjẹ́wọ́ ara ẹni níwájú Baba, ṣùgbọ́n kò sọ ní pàtó bóyá àkókò náà jẹ́ ìdájọ́ ìkẹyìn tàbí àkókò mìíràn. Ìtumọ̀ náà kò yanju ohun tí ẹsẹ kò yanju.
translation_notes:
  register: A lo Yorùbá àkókò yìí tí ó ṣe kedere, tí ó ní iyì, tí àwọn ènìyàn sì lè lóye. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. A pa ìfararora ọ̀rọ̀ “jẹ́wọ́” ní apá méjèèjì mọ́, a sì lo “àwọn ènìyàn” fún ìtọ́kasí gbogbo ènìyàn.
