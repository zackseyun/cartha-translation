id: MAT.10.24
reference: Matthew 10:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: yo
  text: Ọmọ-ẹ̀yìn kò ga ju olùkọ́ lọ, bẹ́ẹ̀ ni ẹrú[a] kò ga ju ọ̀gá rẹ̀[b] lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “ẹrú” sí “ìránṣẹ́”; ọ̀rọ̀ Gíríìkì δοῦλος lè túmọ̀ sí èyíkéyìí, bí àyíká ọ̀rọ̀ ṣe rí.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ “ọ̀gá” sí “Olúwa”; ṣùgbọ́n níbí, ọ̀rọ̀ náà ń tọ́ka sí ọ̀gá ènìyàn nínú àfiwé náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητὴς
  choice: ọmọ-ẹ̀yìn
  rationale: “Ọmọ-ẹ̀yìn” fi ìbáṣepọ̀ ẹni tí ń kọ́ lẹ́sẹ̀ olùkọ́ hàn, ó sì bá ìtumọ̀ μαθητής nínú àwọn Ìhìn Rere mu ju ọ̀rọ̀ ilé-ẹ̀kọ́ lásán lọ.
- source_word: ὑπὲρ
  choice: ga ju … lọ
  rationale: Pẹ̀lú accusative níbí, ὑπέρ ń tọ́ka sí ipò gíga tàbí jíjẹ́ ẹni tí ó ju ẹlòmíràn lọ; “ga ju … lọ” jẹ́ ọ̀nà àdánidá láti sọ ìfiwéra yìí ní Yorùbá.
- source_word: διδάσκαλον
  choice: olùkọ́
  rationale: “Olùkọ́” ni ìtumọ̀ tààrà tí ó ṣe kedere, ó sì yà sí ọ̀gá nínú àfiwé kejì.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Nínú àfiwé pẹ̀lú κύριος, ọ̀rọ̀ náà ń tẹnumọ́ ipò ẹni tí ó wà lábẹ́ àṣẹ àti ohun-ìní ọ̀gá; “ẹrú” pa agbára ìtumọ̀ náà mọ́ ju “ìránṣẹ́” lọ.
- source_word: κύριον
  choice: ọ̀gá
  rationale: Nínú àfiwé àwùjọ yìí, κύριος ń tọ́ka sí ẹni tí ó ní àṣẹ lórí ẹrú, kì í ṣe oyè fún Ọlọ́run; “ọ̀gá” ṣe ìtumọ̀ náà kedere ní Yorùbá òde òní.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ genitive náà so ọ̀gá mọ́ ẹrú tí a mẹ́nu kàn; “rẹ̀” ni ìtumọ̀ Yorùbá àdánidá.
- source_word: οὐδὲ
  choice: bẹ́ẹ̀ ni … kò
  rationale: Ìṣètò “bẹ́ẹ̀ ni … kò” so àfiwé òdì kejì mọ́ ti àkọ́kọ́ lọ́nà tí ó ṣe àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àfiwé tí kì í ṣe ti ìgbàlà
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àfiwé náà dá lórí ipò ọmọ-ẹ̀yìn sí olùkọ́ àti ti ẹrú sí ọ̀gá. “Ẹrú” fi ìdè, ìṣàkóso, àti ipò abẹ́ àṣẹ tí ó wà nínú δοῦλος hàn; a pa “ìránṣẹ́” mọ́ gẹ́gẹ́ bí òmíràn nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ κύριος nínú àyíká ilé ènìyàn, tí kì í ṣe oyè Ọlọ́run
  choice: ọ̀gá
  alternative: Olúwa
  rationale: Níbí, κύριος jẹ́ ẹni tí ó ga lórí ẹrú nínú àfiwé àwùjọ, kì í ṣe oyè Kristi tàbí Ọlọ́run. “Ọ̀gá” ni ọ̀rọ̀ tí ó ṣe kedere jù lọ ní àyíká yìí, nígbà tí àlàyé ìsàlẹ̀ pa “Olúwa” mọ́ gẹ́gẹ́ bí ìtumọ̀ míì.
translation_notes:
  register: A lo Yorùbá àkànṣe tí ó ní àmì ohùn kíkún, ní èdè òde òní tí ó ní ọlá, tí ó sì rọrùn fún gbogbo ènìyàn. Àtúnṣe “ga ju … lọ” mú àfiwé Gíríìkì wá sí Yorùbá àdánidá láì tú ìtumọ̀ rẹ̀ síwájú ju ohun tí ẹsẹ náà sọ lọ.
