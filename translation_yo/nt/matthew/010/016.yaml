id: MAT.10.16
reference: Matthew 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: yo
  text: “Wò ó, èmi ń rán yín jáde bí àgùntàn láàárín ìkookò. Nítorí náà, ẹ jẹ́ ọlọ́gbọ́n bí ejò, kí ẹ sì jẹ́ aláìlábùkù bí àdàbà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí pe àfiyèsí olùgbọ́ sí ohun pàtàkì tí Jésù fẹ́ sọ; “Wò ó” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ipa yìí hàn.
- source_word: ἀποστέλλω
  choice: ń rán ... jáde
  rationale: Ó fi ìránṣẹ́ àti jíjáde lọ síbi iṣẹ́ hàn, ó sì bá àkókò ìsinsìnyí nínú ọ̀rọ̀ Gíríìkì mu.
- source_word: πρόβατα
  choice: àgùntàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún sheep, ó sì pa àwòrán ailágbára wọn mọ́.
- source_word: ἐν μέσῳ λύκων
  choice: láàárín ìkookò
  rationale: Ó túmọ̀ àwòrán orísun náà ní tààrà, pé àwọn ọmọ-ẹ̀yìn yóò wà ní àárín àwọn tó léwu.
- source_word: φρόνιμοι
  choice: ọlọ́gbọ́n
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ọgbọ́n ìṣe, ìṣọ́ra, àti ìmòye; “ọlọ́gbọ́n” jẹ́ àfihàn Yorùbá tó rọrùn láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
- source_word: οἱ ὄφεις
  choice: ejò
  rationale: “Ejò” ni ọ̀rọ̀ àpapọ̀ tó bójú mu fún snakes/serpents, ó sì jẹ́ kí àfiwé náà dun bí Yorùbá àdánidá.
- source_word: ἀκέραιοι
  choice: aláìlábùkù
  rationale: Ọ̀rọ̀ náà ní èrò ohun tí kò ní àdàlú búburú, tí kò sì ṣe ibi. “Aláìlábùkù” pa ìwà mímọ́ àti àìṣe ibi mọ́ láìdín in kù sí òpè tàbí àìgbọ́n.
- source_word: αἱ περιστεραί
  choice: àdàbà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún doves/pigeons nínú àfiwé yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ọgbọ́n bí ejò àti àìlábùkù bí àdàbà
  choice: Pa àwọn méjèèjì mọ́ gẹ́gẹ́ bí àṣẹ tó ń ṣiṣẹ́ pọ̀
  alternative: Túmọ̀ φρόνιμοι gẹ́gẹ́ bí “ẹlẹ́tan” tàbí ἀκέραιοι gẹ́gẹ́ bí “òmùgọ̀”
  rationale: Ọ̀rọ̀ Gíríìkì kò yin ẹ̀tàn tàbí àìní ìmòye; ó so ọgbọ́n ìṣọ́ra pọ̀ mọ́ ìwà tí kò ní ibi.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A lo “ẹ” fún àṣẹ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμᾶς àti àwọn ọ̀rọ̀ àṣẹ ọ̀pọ̀ nínú Gíríìkì.
