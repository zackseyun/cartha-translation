id: MAT.10.23
reference: Matthew 10:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: yo
  text: Ṣùgbọ́n nígbàkigbà tí wọ́n bá ṣe inúnibíni sí yín ní ìlú yìí, ẹ sá lọ sí ìlú mìíràn.[a] Nítorí, lóòótọ́ ni mo wí fún yín, ẹ̀yin kì yóò tíì parí rírìn ká àwọn ìlú Ísírẹ́lì títí Ọmọ Ènìyàn yóò fi dé.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ sá lọ sí ìlú tó tẹ̀ lé e.” Ní Gíríìkì, ó sọ ní ti gidi pé “sí èkejì/òmíràn,” níbi tí a ti lóye “ìlú” láti inú gbólóhùn tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀yin kì yóò tíì parí àwọn ìlú Ísírẹ́lì.” “Rírìn ká àwọn ìlú” mú ìrìn iṣẹ́-ìránṣẹ́ láti ìlú dé ìlú, èyí tí àyíká ọ̀rọ̀ náà fi hàn, kedere.
    reason: lexical_alternative
  - marker: c
    text: A mọ̀ọ́mọ̀ fi “títí Ọmọ Ènìyàn yóò fi dé” sílẹ̀ láì fi ìtumọ̀ kan ṣoṣo dè é. Àwọn atúmọ̀ yàtọ̀ sí ara wọn lórí bóyá ó ń tọ́ka sí ìdáláre Jésù, dídé rẹ̀ nínú ìdájọ́, tàbí ìpadàbọ̀ rẹ̀ ní òpin.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: nígbàkigbà tí ... bá
  rationale: Ó fi àkókò tí kò dá lójú, tí ó sì lè ṣẹlẹ̀ léraléra hàn; ọ̀rọ̀ Yorùbá yìí mú agbára ‘whenever’ jáde lọ́nà àdánidá.
- source_word: διώκωσιν
  choice: wọ́n bá ṣe inúnibíni sí yín
  rationale: Nínú ọ̀rọ̀ ìránṣẹ́ yìí, ọ̀rọ̀ náà túmọ̀ sí ìpọ́njú àti ìtẹ̀lé ẹni pẹ̀lú ìkórìíra, kì í ṣe lílépa lásán.
- source_word: πόλει ταύτῃ
  choice: ní ìlú yìí
  rationale: Ó pa ìtókasí tòsí ti ταύτῃ mọ́, ó sì jẹ́ ọ̀rọ̀ tààrà.
- source_word: φεύγετε
  choice: ẹ sá lọ
  rationale: Àṣẹ ni fún kíákíá kúrò níbi inúnibíni; ‘sá lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó lágbára, tó sì ṣe kedere.
- source_word: εἰς τὴν ἑτέραν
  choice: sí ìlú mìíràn
  rationale: ‘Ìlú’ ni a lóye láti inú gbólóhùn tó ṣáájú; ἑτέραν lè túmọ̀ sí òmíràn tàbí èkejì, nítorí náà a pa àṣàyàn míì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἀμὴν
  choice: lóòótọ́ ni mo wí fún yín
  rationale: Ó jẹ́ ọ̀nà ọ̀wọ̀ àti àdánidá ní Yorùbá láti fi gbólóhùn pàtàkì, aláṣẹ bẹ̀rẹ̀.
- source_word: οὐ μὴ τελέσητε
  choice: ẹ̀yin kì yóò tíì parí
  rationale: ‘Kì yóò’ pẹ̀lú ‘tíì parí’ mú ìkọ̀ emphatic àti àìparí iṣẹ́ ṣáájú ìṣẹ̀lẹ̀ tó ń bọ̀ hàn.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: àwọn ìlú Ísírẹ́lì
  rationale: Ó tẹ̀lé ìbáṣepọ̀ genitive náà ní ṣókí, ó sì tọ́ka sí àwọn ìlú tó jẹ́ ti Ísírẹ́lì.
- source_word: τελέσητε τὰς πόλεις
  choice: parí líla àwọn ìlú ... já
  rationale: ‘Líla ... já’ sọ ìrìn iṣẹ́-ìránṣẹ́ láti ìlú dé ìlú di mímọ̀ ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ìṣe yìí wà ní ìtumọ̀ abẹ́lẹ̀ Gíríìkì; àlàyé ìsàlẹ̀ pa gbolohun tó sun mọ́ lẹ́tà mọ́.
- source_word: ἕως ἂν ἔλθῃ
  choice: títí ... yóò fi dé
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ààlà àkókò ọjọ́ iwájú tí iṣẹ́ náà kò ní parí ṣáájú rẹ̀.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa ìtumọ̀ gangan àti ìró ọ̀rọ̀ ẹ̀kọ́-ìgbàgbọ́/ìtọ́kasí Dáníẹ́lì mọ́, gẹ́gẹ́ bí orúkọ oyè.
theological_decisions:
- issue: Ìtumọ̀ ‘títí Ọmọ Ènìyàn yóò fi dé’ ní àyíká yìí
  choice: A pa ọ̀rọ̀ náà mọ́ láì sọ irú dídé tí ó jẹ́.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí ìjíǹde àti ìdáláre Jésù, dídé rẹ̀ nínú ìdájọ́ lórí Jerúsálẹ́mù, tàbí ìpadàbọ̀ rẹ̀ ní òpin.
  rationale: Gíríìkì kò yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí ní kedere. Nítorí náà, a pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ náà mọ́ dípò fífi èrò ìtumọ̀ kan sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀rọ̀ tó mọ́gbọ́n dání, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ọ̀pọ̀ ènìyàn oníyì ‘ẹ/ẹ̀yin’ fún àwọn ọmọ-ẹ̀yìn, a sì yàgò fún ọ̀rọ̀ ìjọ kan pàtó.
