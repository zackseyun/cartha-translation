id: MAT.10.42
reference: Matthew 10:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá fún ọ̀kan lára àwọn kékeré wọ̀nyí[b] ní ago omi tútù kan péré nítorí pé ọmọ-ẹ̀yìn ni ẹni náà,[a] lóòótọ́ ni mo wí fún yín, dájúdájú ẹni náà kì yóò pàdánù èrè rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀-sí-ọ̀rọ̀ jù: “ní orúkọ ọmọ-ẹ̀yìn.” Àpólà Gíríìkì náà fi hàn pé a ṣe iṣẹ́ yìí nítorí ìdánimọ̀ olùgbà gẹ́gẹ́ bí ọmọ-ẹ̀yìn.'
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn kékeré” níhìn-ín tọ́ka sí àwọn ọmọlẹ́yìn Jésù tí a kà sí ẹni ipò kékeré, kì í ṣe àwọn ọmọdé nìkan.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Àpólà ọ̀rọ̀ yìí ń sọ nípa ẹnikẹ́ni láì fi ààlà sí ẹni tí ó lè ṣe ohun náà; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ποτίσῃ
  choice: fún ... ní ife omi
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí fí ohun mímu fún ẹnìkan; ọ̀nà yìí ṣe kedere, ó sì bá èdè Yorùbá mu.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: ọ̀kan lára àwọn kékeré wọ̀nyí
  rationale: Ó pa àwòrán ‘àwọn kékeré’ mọ́ láì sọ ọ́ di àwọn ọmọdé nìkan tàbí pinnu pátápátá pé ipò kékeré nìkan ni ó ń tọ́ka sí.
- source_word: ποτήριον ψυχροῦ
  choice: ife omi tútù kan
  rationale: Orúkọ ‘omi’ wà ní àfojúsùn nínú Gíríìkì; fífi í hàn gbangba jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: μόνον
  choice: lásán
  rationale: Ó fi hàn pé ẹ̀bùn náà lè jẹ́ ohun kékeré gan-an—kìkì ife omi tútù kan.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: nítorí pé ọmọ-ẹ̀yìn ni ẹni náà
  rationale: 'Ó sọ ìdí tí a fi ṣe iṣẹ́ náà ní Yorùbá àdánidá: a ṣe é nítorí ìdánimọ̀ olùgbà gẹ́gẹ́ bí ọmọ-ẹ̀yìn. Àlàyé ìsàlẹ̀ pa ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ mọ́.'
- source_word: ἀμὴν λέγω ὑμῖν
  choice: lóòótọ́ ni mo wí fún yín
  rationale: Ó pa ọ̀rọ̀ ìmúdájú àti àṣẹ tí ‘ἀμήν’ ní mọ́ ní èdè Yorùbá ọlọ́lá.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: dájúdájú ... kì yóò pàdánù
  rationale: Ìṣọ̀kan ọ̀rọ̀ yìí ń kọ ohun náà ní líle; ‘dájúdájú’ àti ‘kì yóò’ jọ mú ìtẹnumọ́ náà jáde.
- source_word: μισθὸν αὐτοῦ
  choice: èrè rẹ̀
  rationale: ‘Èrè’ lè túmọ̀ sí ohun tí a san tàbí èrè tí a rí gbà, ó sì yẹ fún àyíká ọ̀rọ̀ yìí.
theological_decisions:
- issue: Ohun tí ‘àwọn kékeré wọ̀nyí’ ń tọ́ka sí
  choice: Pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘àwọn kékeré wọ̀nyí,’ pẹ̀lú àlàyé pé ó ṣeé ṣe kí ó tọ́ka sí àwọn ọmọlẹ́yìn Jésù tí a kà sí ẹni ipò kékeré.
  alternative: Kí a túmọ̀ rẹ̀ sí àwọn ọmọdé nìkan, tàbí sí àwọn onígbàgbọ́ tuntun tàbí aláìlera nìkan.
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa gbígba àwọn ọmọ-ẹ̀yìn nítorí ìbáṣepọ̀ wọn pẹ̀lú Jésù. Ìtumọ̀ náà kò dín ọ̀rọ̀ náà kù sí ẹgbẹ́ kan tí Gíríìkì kò sọ ní pàtó.
- issue: Ìtumọ̀ εἰς ὄνομα μαθητοῦ
  choice: “nítorí pé ọmọ-ẹ̀yìn ni ẹni náà”
  alternative: “ní orúkọ ọmọ-ẹ̀yìn”
  rationale: Ọ̀nà àdánidá náà fi hàn pé ìdánimọ̀ olùgbà gẹ́gẹ́ bí ọmọ-ẹ̀yìn ni ìdí iṣẹ́ náà, láì fi èrò àṣà ìsìn tàbí ọ̀rọ̀ àdúrà kan kún un. Àlàyé ìsàlẹ̀ ṣàfihàn ọ̀nà tí ó tẹ̀lé ìrísí Gíríìkì jù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “ẹni náà” láti yẹra fún fífi akọ tàbí abo tí Gíríìkì kò béèrè kún ọ̀rọ̀ náà; a sì fi àmì ohùn sí ibi tí ó yẹ.
