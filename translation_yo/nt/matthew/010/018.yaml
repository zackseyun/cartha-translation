id: MAT.10.18
reference: Matthew 10:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: yo
  text: A ó sì mú yín lọ síwájú àwọn gómìnà àti àwọn ọba nítorí mi, láti jẹ́ ẹ̀rí fún wọn[b] àti fún àwọn tí kì í ṣe Júù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, a tún lè lóye “fún wọn” sí “lòdì sí wọn,” bí ó tilẹ̀ jẹ́ pé dative Gíríìkì náà kò sọ èyí ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: síwájú àwọn gómìnà àti àwọn ọba
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ἀχθήσεσθε, ἐπί pẹ̀lú accusative túmọ̀ sí pé a mú wọn wá síwájú àwọn aláṣẹ fún ìgbẹ́jọ́ tàbí ìwádìí, kì í ṣe pé wọ́n kàn ń lọ sọ́dọ̀ wọn.
- source_word: ἀχθήσεσθε
  choice: A ó mú yín lọ
  rationale: Èyí ṣàfihàn future passive ἄγω ní Yorùbá àdánidá, láì fi agbára tàbí ìwà ipá tí Gíríìkì kò sọ kún un.
- source_word: ἕνεκεν ἐμοῦ
  choice: nítorí mi
  rationale: Ó sọ ìdí tàbí okùnfà ohun tí yóò ṣẹlẹ̀, ó sì pa ìtọ́kasí ara ẹni sí Jésù mọ́.
- source_word: εἰς μαρτύριον
  choice: láti jẹ́ ẹ̀rí
  rationale: Ọ̀rọ̀ yìí lè tọ́ka sí ète tàbí àbájáde; gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, ó sì pa èrò orúkọ náà mọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dative náà tọ́ka lọ́nà àdánidá sí àwọn gómìnà àti ọba. “Fún wọn” jẹ́ aláìṣègbè, nítorí Gíríìkì kò sọ ní pàtó pé ẹ̀rí náà lòdì sí wọn.
- source_word: τοῖς ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Nínú Mátíù, ἔθνη sábà máa ń tọ́ka sí àwọn tí kì í ṣe Júù. “Àwọn Kèfèrí” mú ìtumọ̀ yẹn jáde, nígbà tí àlàyé ìsàlẹ̀ fi “àwọn orílẹ̀-èdè” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn.
theological_decisions:
- issue: Agbára ìtumọ̀ μαρτύριον αὐτοῖς
  choice: ẹ̀rí fún wọn
  alternative: ẹ̀rí lòdì sí wọn
  rationale: 'Dative αὐτοῖς kò fúnra rẹ̀ fi hàn pé ẹ̀rí ìdálẹ́bi ni. Ìtumọ̀ aláìṣègbè pa àìdánilójú àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́: ẹ̀rí náà lè jẹ́ ìpè sí wọn tàbí ẹ̀rí lòdì sí wọn bí wọ́n bá kọ̀ ọ́.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Síwájú” mú àyíká ìgbẹ́jọ́ jáde; “gómìnà” àti “ọba” jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lóye nírọ̀rùn.
