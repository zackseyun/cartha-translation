  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: yo
  text: Bí ẹ ti ń lọ, ẹ sì máa kéde pé, “Ìjọba ọ̀run[b] ti sún mọ́[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ti wá nítòsí’ tàbí ‘wà nítòsí.’ Ọ̀rọ̀-ìṣe pípé Gíríìkì tẹnumọ́ ìsúnmọ́ tó ti dé, tí ó sì ṣì ní ipa.
    reason: lexical_alternative
  - marker: b
    text: Mátíù sábà máa ń lo ‘ìjọba ọ̀run,’ níbi tí àwọn Ìhìn Rere mìíràn ti sábà máa ń lo ‘ìjọba Ọlọ́run.’
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: bí ẹ ti ń lọ
  rationale: Ọ̀rọ̀ aláìṣe-parí yìí ń fi ìṣe tí ó ń bá àṣẹ náà lọ hàn; ‘bí ẹ ti ń lọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi èrò yẹn hàn.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ so àṣẹ yìí mọ́ ohun tí ó ṣáájú láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: κηρύσσετε
  choice: ẹ máa kéde
  rationale: Ó jẹ́ àṣẹ láti kéde ọ̀rọ̀ ní gbangba pẹ̀lú ọlá-àṣẹ; ‘kéde’ yẹra fún ìtumọ̀ tó lè dín un kù sí ìwàásù inú ilé ìjọsìn nìkan.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá àdánidá, ‘pé’ dára láti mú ọ̀rọ̀ tí a ń kéde wọlé; kò pọndandan láti tún fi ‘ní wíwí’ kún un.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń mú àkóónú ìkéde wọlé. Àmì ọ̀rọ̀ taara pa mọ́ pé àwọn ọ̀rọ̀ tó tẹ̀ lé ni ohun tí wọn yóò kéde.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Fọ́ọ̀mù pípé Gíríìkì tọ́ka sí ohun tí ó ti dé sí ipò ìsúnmọ́, tí ipò náà sì ṣì wà; ‘ti sún mọ́lé’ pa ìṣe tó ti ṣẹlẹ̀ àti èsì rẹ̀ mọ́.
- source_word: ἡ βασιλεία
  choice: ìjọba
  rationale: ‘Ìjọba’ lè gba ìtumọ̀ agbègbè ìṣàkóso àti ìṣe ìṣàkóso, bí ọ̀rọ̀ Gíríìkì náà ṣe lè rí.
- source_word: τῶν οὐρανῶν
  choice: ọ̀run
  rationale: ‘Ọ̀run’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún gbólóhùn Mátíù yìí, láìyí i padà sí ‘Ọlọ́run’ tàbí mú un bá àwọn Ìhìn Rere mìíràn mu.
theological_decisions:
- issue: Ìtumọ̀ ‘ìjọba ọ̀run’
  choice: A pa gbólóhùn Mátíù náà mọ́ gẹ́gẹ́ bí ‘ìjọba ọ̀run.’
  alternative: ìṣàkóso ọ̀run; ìjọba Ọlọ́run
  rationale: Èyí pa ọ̀rọ̀ pàtó tí Mátíù lò mọ́, ó sì jẹ́ kí ‘ìjọba’ lè ní ìtumọ̀ ìṣàkóso àti ilẹ̀ ìjọba láìfi ipa mú ọ̀kan ṣoṣo.
- issue: Ìrísí pípé ti ἤγγικεν
  choice: ‘ti sún mọ́lé,’ èyí tó fi ìsúnmọ́ tó ti dé, tí ó sì ń bá a lọ, hàn
  alternative: wà nítòsí; ti dé
  rationale: Ìtumọ̀ yìí pa agbára fọ́ọ̀mù pípé náà mọ́ láìdá ìjìnlẹ̀ ẹ̀kọ́ nípa àkókò ìjọba náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, a sì yí κηρύσσετε λέγοντες sí ‘kéde … pé’ láti jẹ́ Yorùbá àdánidá láìsọ àkóónú Gíríìkì nù.
