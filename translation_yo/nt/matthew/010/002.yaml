id: MAT.10.2
reference: Matthew 10:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: yo
  text: 'Àwọn ni orúkọ àwọn àpọ́sítélì méjìlá náà: àkọ́kọ́[a] ni Símónì, ẹni tí a ń pè ní Pétérù, àti Áńdérù arákùnrin rẹ̀; Jákọ́bù ọmọ Sébédè, àti Jòhánù arákùnrin rẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àkọ́kọ́” lè fi hàn pé ó ní ipò ọlá láàárín àwọn méjìlá, kì í ṣe ìfẹ̀sẹ̀tò nínú àtòjọ nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: A kò túmọ̀ ọ́ pẹ̀lú ọ̀rọ̀ ìbẹ̀rẹ̀ ọ̀tọ̀
  rationale: δέ jẹ́ àmì ìyípadà kékeré nínú ìsọ̀rọ̀; èdè Yorùbá adayébá kò nílò ‘nísinsìnyí’ tàbí àsopọ̀ míì níbí.
- source_word: δώδεκα ἀποστόλων
  choice: àwọn àpọ́sítélì méjìlá náà
  rationale: ‘Àpọ́sítélì’ ni ọ̀rọ̀ ìjọsìn Yorùbá tí a mọ̀ dáadáa fún ẹgbẹ́ àwọn méjìlá tí Jésù rán; ‘náà’ fi hàn pé ẹgbẹ́ tí a ti mọ̀ ni.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Àwọn orúkọ ... nì wọ̀nyí
  rationale: Èyí pa ìtẹnumọ́ atọ́ka Gíríìkì mọ́, ó sì jẹ́ ìsọ̀rọ̀ Yorùbá adayébá.
- source_word: πρῶτος
  choice: àkọ́kọ́
  rationale: Ó túmọ̀ sí ẹni àkọ́kọ́ nínú àtòjọ; a kò fi ìtumọ̀ ipò àṣẹ kún ọ̀rọ̀ inú ẹsẹ̀.
- source_word: ὁ λεγόμενος
  choice: ẹni tí a ń pè ní
  rationale: Ó fi hàn gbangba pé Pétérù ni orúkọ tí a fi ń pe Símónì.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Nínú àwọn ibi méjèèjì, ἀδελφός tọ́ka sí arákùnrin nípa ìbí; ìlò afijẹ ‘rẹ̀’ jẹ́ Yorùbá adayébá.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: ọmọ Sébédè
  rationale: Àpèjúwe oníṣe-genitive yìí tọ́ka sí Jákọ́bù gẹ́gẹ́ bí ọmọ Sébédè.
theological_decisions:
- issue: Ìtumọ̀ πρῶτος nípa Símónì/Pétérù
  choice: A túmọ̀ rẹ̀ sí ‘àkọ́kọ́’ láì sọ pé ó ní ipò àṣẹ ju àwọn yòókù lọ.
  alternative: Ó lè túmọ̀ sí ẹni tí ó gbajúmọ̀ tàbí tí ó ní ipò ọlá láàárín àwọn méjìlá.
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìtẹ̀lé nínú àtòjọ, ó sì tún lè ní àbájáde ipò ọlá. Ẹsẹ̀ náà fúnra rẹ̀ kò yanju ọ̀ràn náà, nítorí náà àlàyé ìsàlẹ̀ ojú ìwé pa ìṣòro ìtumọ̀ náà mọ́ láì gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kalẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, adayébá, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo àwọn ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Yorùbá, a sì ṣètò gbólóhùn náà kí àtòjọ náà lè ṣe kedere fún òǹkàwé òde òní.
