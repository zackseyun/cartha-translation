  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: yo
  text: Ṣùgbọ́n dípò ìyẹn, ẹ lọ sí ọ̀dọ̀ àwọn àgùntàn tí ó sọnù ti ilé Ísírẹ́lì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n ẹ kúkú lọ sí ọ̀dọ̀ àwọn àgùntàn tí ó ti sọnù ti ilé Ísírẹ́lì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: ẹ lọ
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. “Ẹ lọ” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá àṣẹ iṣẹ́ ìránṣẹ́ yìí mu.
- source_word: δὲ μᾶλλον
  choice: Ṣùgbọ́n dípò bẹ́ẹ̀
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ìyàtọ̀ àti yíyan ibi mìíràn hàn lẹ́yìn àwọn ibi tí a ṣẹ̀ṣẹ̀ kà léèwọ̀; “Ṣùgbọ́n dípò bẹ́ẹ̀” mú ìdarípadà náà jáde ní Yorùbá àdánidá.
- source_word: πρὸς
  choice: sọ́dọ̀
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣípò, πρός tọ́ka sí ibi tàbí àwọn ẹni tí a ń lọ bá. “Sọ́dọ̀” bá lílọ sí ọ̀dọ̀ àwọn ènìyàn mu dáadáa.
- source_word: τὰ πρόβατα
  choice: àwọn àgùntàn
  rationale: Èyí pa àwòrán àfiwé àgùntàn mọ́, dípò kí a tú u sí “àwọn ènìyàn” tàbí kí a sọ ọ́ di “agbo.”
- source_word: τὰ ἀπολωλότα
  choice: tí ó sọnù
  rationale: Participle pípé náà ń ṣàpèjúwe àwọn àgùntàn gẹ́gẹ́ bí èyí tí ó ti sọnù. Nínú àwòrán olùṣọ́-àgùntàn yìí, “sọnù” dára ju ìtumọ̀ bí “parun” lọ.
- source_word: οἴκου Ἰσραήλ
  choice: ilé Ísírẹ́lì
  rationale: “Ilé Ísírẹ́lì” pa ọ̀rọ̀ àpapọ̀ àti ìró Májẹ̀mú Láéláé mọ́, láì tú u sí àlàyé bí “àwọn ọmọ Ísírẹ́lì.”
theological_decisions:
- issue: Àfiwé Ísírẹ́lì sí àwọn àgùntàn tí ó sọnù
  choice: A pa àfiwé náà mọ́ gẹ́gẹ́ bí “àwọn àgùntàn ilé Ísírẹ́lì tí ó sọnù.”
  alternative: àwọn ọmọ Ísírẹ́lì tí wọ́n ti ṣìnà
  rationale: Gíríìkì lo àfiwé àgùntàn ní tààrà, ó sì ní ìbáṣepọ̀ pẹ̀lú àwòrán àwọn wòlíì nínú Ìwé Mímọ́. Pípa á mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó bá ti yẹ, a sì pa àwòrán Bíbélì náà mọ́ ní ọ̀nà tí òǹkàwé lásán lè lóye.
