review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential command, the plural addressees, the two passive future disclosures without identifying an agent, and the parallel universal structure. However, the future-negative construction should be made unambiguously idiomatic in modern Standard Yorùbá.
  naturalness: The wording is generally clear and dignified. Replacing “a kì yóò” with the standard future-negative “a kò ní” improves contemporary naturalness and prevents the habitual/general sense often associated with kì.
  terminology: “bò” and “ṣí payá” retain the covered/revealed imagery well. “ohun ìkọ̀kọ̀” is a natural rendering of κρυπτόν, and the indefinite human agent in “a kò ní” appropriately leaves the Greek divine passive unspecified.
  issues:
  - severity: medium
    issue: Future-negative form “a kì yóò”
    rationale: For a definite future negation (“will not be revealed / made known”), Standard Yorùbá normally uses “a kò ní.” “Kì” commonly marks habitual or gnomic negation and is less precise here.
  revised_text: Nítorí náà, ẹ má ṣe bẹ̀rù wọn, nítorí kò sí ohun tí a bò tí a kò ní ṣí payá, kò sì sí ohun ìkọ̀kọ̀ tí a kò ní mọ̀.
