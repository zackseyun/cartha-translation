id: MAT.10.26
reference: Matthew 10:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe bẹ̀rù wọn, nítorí kò sí ohun tí a bò tí a kò ní ṣí payá, kò sì sí ohun ìkọ̀kọ̀ tí a kò ní mọ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Nítorí náà, ẹ má ṣe bẹ̀rù wọn
  rationale: “Nítorí náà” conveys the inferential οὖν, while the plural polite/collective imperative “ẹ má ṣe bẹ̀rù” naturally addresses the disciples as a group.
- source_word: κεκαλυμμένον
  choice: ohun tí a bò
  rationale: The concrete passive wording retains the image of something covered rather than replacing it with an interpretive abstraction.
- source_word: ἀποκαλυφθήσεται
  choice: a kì yóò ṣí payá
  rationale: “Ṣí payá” naturally expresses disclosure or unveiling and preserves the passive sense through the indefinite-subject construction.
- source_word: κρυπτὸν
  choice: ohun ìkọ̀kọ̀
  rationale: This is a natural Yoruba expression for something hidden or secret.
- source_word: γνωσθήσεται
  choice: a kì yóò mọ̀
  rationale: The indefinite-subject passive construction means that it will become known, without specifying the agent.
theological_decisions:
- issue: Agent of the future revelation and making known
  choice: 'Use Yoruba indefinite-agent passive constructions: “a kì yóò ṣí payá” and “a kì yóò mọ̀.”'
  alternative: Explicitly say that God will reveal and make known everything.
  rationale: The Greek passives do not explicitly identify the agent, so the translation preserves that ambiguity rather than supplying a theological interpretation.
- issue: Scope of the paired sayings
  choice: Retain the comprehensive negatives “kò sí ohun … tí a kì yóò …” in both clauses.
  alternative: Paraphrase as a general statement that truth eventually comes out.
  rationale: The chosen form preserves the emphatic universal structure and parallelism of the Greek.
translation_notes:
  register: Standard Yorùbá with full tone marks; dignified but current and readily understandable. The paired clauses retain the proverbial parallelism of the source.
