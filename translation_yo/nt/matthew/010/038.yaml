source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: yo
  text: Ẹnikẹ́ni tí kò gbé àgbélébùú tirẹ̀, tí kò sì tọ̀ mí lẹ́yìn, kò yẹ fún mi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ sí ‘àgbélébùú tirẹ̀,’ ó sì wà ní ẹyọ kan, ní ìrísí akọ ní gírámà. A lò ó ní ìtumọ̀ gbogbogbò fún olúkúlùkù; ìyẹn ni pé, ọmọ-ẹ̀yìn kọ̀ọ̀kan gbọ́dọ̀ gbé àgbélébùú tirẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ ọ́ ní ṣókí pé, ‘tẹ̀lé mi.’ Gíríìkì fi ìtumọ̀ títọ̀ lẹ́yìn hàn ní kedere sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ẹnikẹ́ni tí
  rationale: Ó fi ìtumọ̀ àìdánimọ̀ àti ti gbogbo ènìyàn hàn lọ́nà Yorùbá àdánidá.
- source_word: λαμβάνει
  choice: gbé
  rationale: Pẹ̀lú àgbélébùú, ‘gbé’ túmọ̀ sí gbígbé ohun náà sókè tàbí gbígbà á lé ara ẹni, ó sì bá àwòrán ọmọ-ẹ̀yìn mu.
- source_word: σταυρὸν αὐτοῦ
  choice: àgbélébùú tirẹ̀
  rationale: ‘Àgbélébùú’ pa àwòrán ohun ìpànìyàn Romu mọ́; ‘tirẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí àgbélébùú ẹni kọ̀ọ̀kan láìfi akọ tàbí abo kún ohun tí èdè Yorùbá kò fi hàn.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: tọ̀ mí lẹ́yìn
  rationale: Ó pa ìtumọ̀ ὀπίσω, ìyẹn títẹ̀lé lẹ́yìn Jesu, mọ́ ju ‘tẹ̀lé mi’ nìkan lọ.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: kò yẹ fún mi
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa ìdájọ́ nípa yíyẹ ẹni fún Jesu mọ́ láìṣàfikún àlàyé.
theological_decisions:
- issue: Ọ̀rọ̀ ọmọ-ẹ̀yìn nípa gbígbé àgbélébùú
  choice: Pa àwòrán gidi náà mọ́ pé kí ẹni náà ‘gbé àgbélébùú tirẹ̀.’
  alternative: Túmọ̀ rẹ̀ ní ṣókí sí ‘gba ìjìyà’ tàbí ‘kọ ara rẹ̀ sílẹ̀.’
  rationale: Ọ̀rọ̀ Gíríìkì lo àgbélébùú ní tààrà; pípa àwòrán náà mọ́ ń jẹ́ kí ìtìjú, ìjìyà, àti ìfaramọ́ olówó iyebíye tí ọmọ-ẹ̀yìn lè dojú kọ má bàjẹ́.
- issue: αὐτοῦ akọ ẹyọ kan tí a lò fún gbogbo ènìyàn
  choice: Lo ‘tirẹ̀,’ èyí tí kò ní akọ tàbí abo ní Yorùbá, kí àtọ́ka sí ẹni kọ̀ọ̀kan sì dúró.
  alternative: Fi akọ hàn ní àlàyé bí ‘àgbélébùú tirẹ̀ fún ọkùnrin náà.’
  rationale: Èdè Yorùbá kì í fi akọ tàbí abo hàn nínú ọ̀rọ̀ arọ́pò-orúkọ yìí. ‘Tirẹ̀’ jẹ́ ìbámu gírámà tó pé, kì í ṣe yíyí ìtumọ̀ padà sí ọ̀pọ̀ ènìyàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, àti àdánidá fún òǹkàwé òde òní. Àwọn àmì àlàyé [a][b] wà lẹ́yìn gbogbo gbólóhùn nítorí pé àlàyé méjèèjì kan àwọn ọ̀rọ̀ inú rẹ̀.
