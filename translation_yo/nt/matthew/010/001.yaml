id: MAT.10.1
reference: Matthew 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: yo
  text: Ó sì pe àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá wá sí ọ̀dọ̀ rẹ̀,[a] ó sì fún wọn ní àṣẹ lórí àwọn ẹ̀mí àìmọ́,[b] láti lé wọn jáde àti láti wo gbogbo àrùn àti gbogbo àìlera sàn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí ó pe àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá wá sí ọ̀dọ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “agbára lórí àwọn ẹ̀mí àìmọ́.” Ọ̀rọ̀ Gíríìkì exousia sábà máa ń ní ìtumọ̀ àṣẹ tàbí ẹ̀tọ́ tí a fi lé ẹnì kan lọ́wọ́.
    reason: lexical_alternative
  - marker: c
    text: Àwọn ọ̀rọ̀ méjì náà, “gbogbo àrùn àti gbogbo àìlera,” dúró fún ọ̀rọ̀ Gíríìkì méjì tó jọra (nosos àti malakia); a tún lè tú wọn sí “gbogbo àrùn àti gbogbo àìsàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe ... wá sọ́dọ̀ ara rẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist middle; ‘pe ... wá sọ́dọ̀ ara rẹ̀’ fi ìtumọ̀ pípe wọn wá sí ọ̀dọ̀ ẹni náà hàn ní Yorùbá àdánidá.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá μαθητής mu nínú àyíká Ìhìnrere; ‘rẹ̀’ ṣàfihàn αὐτοῦ.
- source_word: ἔδωκεν
  choice: ó fún wọn ní
  rationale: Èyí túmọ̀ δίδωμι ní tààrà gẹ́gẹ́ bí fífúnni, láìfi ìtumọ̀ míì kún un.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: ‘Àṣẹ’ ṣàfihàn ẹ̀tọ́ tàbí agbára tí a fi lé ẹnì kan lọ́wọ́, ju agbára lásán lọ.
- source_word: πνευμάτων ἀκαθάρτων
  choice: lórí àwọn ẹ̀mí àìmọ́
  rationale: Genitive náà ń fi ohun tí àṣẹ wọn kàn hàn; ‘lórí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ tí ẹnì kan ní lórí ẹlòmíràn.
- source_word: ὥστε
  choice: láti máa
  rationale: Pẹ̀lú infinitive méjèèjì, ọ̀rọ̀ náà lè tọ́ka sí ète tàbí àbájáde; ‘láti máa’ jẹ́ kí ìbáṣepọ̀ náà dúró láìfi dandan yàn ọ̀kan ṣoṣo.
- source_word: ἐκβάλλειν αὐτά
  choice: lé wọn jáde
  rationale: Nínú àyíká yíyọ ẹ̀mí búburú, ‘lé ... jáde’ jẹ́ ìtumọ̀ àdánidá; ‘wọn’ ń tọ́ka sí àwọn ẹ̀mí àìmọ́.
- source_word: θεραπεύειν
  choice: wo ... sàn
  rationale: ‘Wo ... sàn’ jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún mímú aláìsàn lára dá.
- source_word: πᾶσαν νόσον
  choice: gbogbo àrùn
  rationale: ‘Àrùn’ bá νόσος mu gẹ́gẹ́ bí àìsàn tàbí disease.
- source_word: πᾶσαν μαλακίαν
  choice: gbogbo àìlera
  rationale: ‘Àìlera’ pa ìyàtọ̀ díẹ̀ mọ́ láàárín μαλακία àti νόσος, ó sì lè gba ìtumọ̀ weakness, infirmity, tàbí sickness.
theological_decisions:
- issue: Irú ohun tí Jésù fi fún àwọn ọmọ-ẹ̀yìn
  choice: àṣẹ lórí àwọn ẹ̀mí àìmọ́
  alternative: agbára lórí àwọn ẹ̀mí àìmọ́
  rationale: ἐξουσία sábà ń tọ́ka sí àṣẹ tàbí ẹ̀tọ́ tí a fi fúnni, kì í ṣe agbára aláìní ẹni tó fi ránṣẹ́ nìkan. ‘Àṣẹ’ pa ìtumọ̀ ìránṣẹ́ tí Jésù fi lé wọn lọ́wọ́ mọ́ láìfi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ọmọ-ẹ̀yìn,’ ‘àṣẹ,’ àti ‘ẹ̀mí àìmọ́’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tó mọ́gbọ́n dání, láìgbé èdè ẹ̀ya ìjọ kan wọ inú ẹsẹ náà.
