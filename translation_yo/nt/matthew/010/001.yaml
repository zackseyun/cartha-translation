  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fi àwọn èrò pàtàkì nínú Gíríìkì hàn dáadáa: Jésù pe àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá, ó fún wọn ní àṣẹ lórí ẹ̀mí àìmọ́, fún lílé wọn jáde àti ìwòsàn gbogbo àrùn àti àìlera. Síbẹ̀, ‘láti máa’ ń kó ìtumọ̀ àṣà/tí ń ṣẹlẹ̀ léraléra wọlé tí infinitive Gíríìkì kò sọ ní pàtó. ‘Láti’ nìkan dáa sí i, ó sì pa ìbáṣepọ̀ ὥστε mọ́ láìpinnu pé ète nìkan tàbí àbájáde nìkan ni.'
  naturalness: ‘Pe ... wá sí ọ̀dọ̀ rẹ̀’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì ṣàfihàn ìtumọ̀ ‘pè sí ọ̀dọ̀ ara ẹni’ ní ti προσκαλεσάμενος. A yọ ‘ara’ kúrò nínú gbólóhùn àkọ́kọ́ nítorí ‘sí ọ̀dọ̀ rẹ̀’ ti mú ìtọ́kasí náà hàn tán.
  terminology: ‘Àwọn ọmọ-ẹ̀yìn,’ ‘àṣẹ,’ ‘ẹ̀mí àìmọ́,’ ‘lé ... jáde,’ ‘àrùn,’ àti ‘àìlera’ jẹ́ àwọn ọ̀rọ̀ tí ó bófin mu, tí ó sì jẹ́ àdánidá nínú Yorùbá Bíbélì òde òní. ‘Àṣẹ’ bójú mu fún ἐξουσία ju ‘agbára’ lọ nínú ọ̀rọ̀ àkọ́kọ́.
