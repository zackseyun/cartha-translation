revisions:
- from: Ó sì pe àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá wá sọ́dọ̀ ara rẹ̀,[a] ó sì fún wọn ní àṣẹ lórí àwọn ẹ̀mí àìmọ́,[b] láti máa lé wọn jáde àti láti máa wo gbogbo àrùn àti gbogbo àìlera sàn.[c]
  to: Ó sì pe àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá wá sí ọ̀dọ̀ rẹ̀,[a] ó sì fún wọn ní àṣẹ lórí àwọn ẹ̀mí àìmọ́,[b] láti lé wọn jáde àti láti wo gbogbo àrùn àti gbogbo àìlera sàn.[c]
  rationale: Àtúnṣe náà yọ ‘máa’ kúrò láti má bàa fikún ìtumọ̀ ìṣe àṣà tàbí ìṣe títẹ̀síwájú sí infinitive Gíríìkì. Ó tún ṣe ‘sí ọ̀dọ̀ rẹ̀’ ní ìrọ̀rùn dípò ‘sí ọ̀dọ̀ ara rẹ̀,’ láìpadà ìtumọ̀. Àwọn àmì ẹsẹ̀-ìsàlẹ̀ a, b, c ṣì wà ní ọ̀nà tó bá àwọn àkíyèsí wọn mu.
  reviewer_model: gpt-5.6-terra
