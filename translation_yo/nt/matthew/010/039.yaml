id: MAT.10.39
reference: Matthew 10:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: yo
  text: Ẹni tí ó bá rí ìwàláàyè rẹ̀ yóò pàdánù rẹ̀,[a] ẹni tí ó sì bá pàdánù ìwàláàyè rẹ̀ nítorí mi yóò rí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ψυχή sí ‘ẹ̀mí’ ní àwọn apá méjèèjì. Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ìwàláàyè’ tàbí ‘ẹ̀mí,’ ṣùgbọ́n ‘ìwàláàyè’ bá àyíká pípọ̀nù àti rí ìwàláàyè ẹni nínú jíjẹ́ ọmọ-ẹ̀yìn mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Ẹni tí ó bá rí
  rationale: Àpilẹ̀kọ pẹ̀lú participle náà ń tọ́ka sí ẹnikẹ́ni ní ọ̀nà àpapọ̀. Ìṣètò ‘Ẹni tí ó bá...’ jẹ́ Yorùbá àdánidá fún ọ̀rọ̀ òwe tàbí òtítọ́ gbogbogbò, ó sì pa agbára ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ψυχὴν
  choice: ẹ̀mí ara rẹ̀
  rationale: Nínú àyíká yìí, ψυχή túmọ̀ sí ìwàláàyè ẹni tàbí ẹni fúnra rẹ̀, kì í ṣe dandan apá aláìlẹ́ran kan tí a yà sọ́tọ̀ kúrò lára. ‘Ẹ̀mí ara rẹ̀’ jẹ́ ọ̀nà Yorùbá tí ó lè gba ìtumọ̀ ìwàláàyè ẹni, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé ọ̀nà míì tí a lè gbà túmọ̀ ọ́.
- source_word: ἀπολέσει
  choice: yóò pàdánù
  rationale: Ọ̀rọ̀ náà níbí ń sọ nípa pípọ̀nù, kì í ṣe píparun. ‘Pàdánù’ tún pa ìtakora pẹ̀lú ‘rí’ mọ́.
- source_word: ὁ ἀπολέσας
  choice: ẹni tí ó ... bá pàdánù
  rationale: Bí ó tilẹ̀ jẹ́ pé participle náà jẹ́ aorist, gbólóhùn náà ní agbára òwe gbogbogbò. Ìlò ‘bá’ jẹ́ Yorùbá àdánidá tí ó fi ìtumọ̀ aṣojú ẹnikẹ́ni hàn.
- source_word: ἕνεκεν ἐμοῦ
  choice: nítorí mi
  rationale: ‘Nítorí mi’ sọ ìdí tàbí ohun tí ó mú ẹni ṣe bẹ́ẹ̀, ó sì pa ìfarajìn sí Jésù mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: εὑρήσει
  choice: yóò rí i
  rationale: ‘Rí’ pa ìbámu ọ̀rọ̀ mọ́ pẹ̀lú εὑρὼν ní ìbẹ̀rẹ̀ ẹsẹ, gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: αὐτοῦ / αὐτήν
  choice: ara rẹ̀ / rẹ̀ / i
  rationale: Àwọn arọ́pò-orúkọ Gíríìkì jẹ́ ẹyọ ọkùnrin ní gírámà ṣùgbọ́n wọ́n ní agbára aṣojú gbogbo ènìyàn. Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni kẹta, nítorí náà ‘rẹ̀’ àti ‘i’ jẹ́ deede, wọ́n sì pa ẹyọ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ àdììtú nípa jíjẹ́ ọmọ-ẹ̀yìn
  choice: ẹ̀mí ara rẹ̀, pẹ̀lú àlàyé pé ó ń tọ́ka sí ìwàláàyè ẹni
  alternative: ìwàláàyè ara rẹ̀; ọkàn ara rẹ̀
  rationale: Àyíká náà dá lórí ẹni tí ó fẹ́ dá ìwàláàyè tirẹ̀ sí àti ẹni tí ó fi í sílẹ̀ nítorí Jésù. A kò gbọ́dọ̀ sọ ọ́ di ẹ̀kọ́ tó ń ya ara àti ọkàn sọ́tọ̀. ‘Ẹ̀mí ara rẹ̀’ pa ìjìnlẹ̀ ọ̀rọ̀ náà mọ́, àkọsílẹ̀ sì ṣàlàyé pé ‘ìwàláàyè’ ni ó bá àyíká mu jù.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Ìṣètò méjèèjì ni a ṣe ní ìbámu láti pa àkànṣe àdììtú Gíríìkì mọ́. Àmì ohùn ni a fi sí ibi tí ó yẹ.
