id: MAT.10.27
reference: Matthew 10:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: yo
  text: Ohun tí mo sọ fún yín nínú òkùnkùn[a], ẹ sọ ọ́ nínú ìmọ́lẹ̀; ohun tí ẹ sì gbọ́ ní etí[b], ẹ kéde rẹ̀ lórí àwọn òrùlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “ní ìkọ̀kọ̀ … ní gbangba”; ṣùgbọ́n ọ̀rọ̀ Gíríìkì pa àwòrán “nínú òkùnkùn … nínú ìmọ́lẹ̀” mọ́.
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ rẹ̀ ni pé kí ohun tí a gbọ́ ní ìkọ̀kọ̀ di ohun tí a kéde ní gbangba. Àwọn ilé ìgbàanì sábà máa ń ní òrùlé pẹlẹbẹ, tí ó sì lè jẹ́ ibi gíga tí gbogbo ènìyàn ti lè rí ẹni tó ń kéde.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Ohun tí mo sọ fún yín
  rationale: Èyí tú ọ̀rọ̀ arọ́pò-orúkọ ὃ gẹ́gẹ́ bí ‘ohun tí,’ ó sì fi ìbánisọ̀rọ̀ tààrà sí àwọn ọmọ-ẹ̀yìn hàn ní Yorùbá àdánidá.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nínú òkùnkùn
  rationale: Ó pa àwòrán òkùnkùn mọ́, dípò kí ó túmọ̀ rẹ̀ ní pàtó sí ‘ní ìkọ̀kọ̀,’ ó sì bá ìyàtọ̀ rẹ̀ pẹ̀lú ìmọ́lẹ̀ mu.
- source_word: εἴπατε ἐν τῷ φωτί
  choice: ẹ sọ ọ́ nínú ìmọ́lẹ̀
  rationale: Àṣẹ ‘ẹ sọ’ jẹ́ èdè Yorùbá tó ṣe kedere, ‘nínú ìmọ́lẹ̀’ sì pa àwòrán Gíríìkì àti ìtakora òkùnkùn/ìmọ́lẹ̀ mọ́.
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: ohun tí ẹ sì gbọ́ ní etí
  rationale: ‘Ní etí’ pa àwòrán ìsọfúnni tímọ́tímọ́ mọ́ láì fi ọ̀rọ̀ àlàyé bí ‘tí a sọ ní ìkọ̀kọ̀’ rọ́pò rẹ̀.
- source_word: κηρύξατε
  choice: ẹ kéde rẹ̀
  rationale: ‘Kéde’ ní agbára ìpolongo ní gbangba tí κηρύσσω ní, láì dín ìtumọ̀ rẹ̀ kù sí ìwàásù nínú àpéjọ ìsìn nìkan.
- source_word: ἐπὶ τῶν δωμάτων
  choice: lórí àwọn òrùlé
  rationale: Èyí pa àwòrán àwọn òrùlé pẹlẹbẹ ilé ayé àtijọ́ mọ́, níbi gíga tí a ti lè kéde ohun sí gbangba.
theological_decisions:
- issue: Bóyá kí a pa àwòrán òkùnkùn/ìmọ́lẹ̀ àti etí/òrùlé mọ́ tàbí kí a tú wọn sí ìkọ̀kọ̀/ní gbangba.
  choice: 'A pa àwọn àwòrán náà mọ́ nínú ẹsẹ̀: ‘nínú òkùnkùn … nínú ìmọ́lẹ̀ … ní etí … lórí àwọn òrùlé.’'
  alternative: ‘ní ìkọ̀kọ̀ … ní gbangba … ohun tí a sọ kẹ́lẹ́kẹ́lẹ́ fún yín … ẹ kéde rẹ̀ ní gbangba’
  rationale: Ọ̀rọ̀ Gíríìkì lo àwọn àwòrán tó tako ara wọn láti fi ìsọfúnni tímọ́tímọ́ àti ìkéde ní gbangba hàn. Pípa wọn mọ́ kò fi ìtumọ̀ ẹ̀kọ́ kan tí ó dín jù wọ inú ẹsẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àṣẹ ọ̀pọ̀ ènìyàn ‘ẹ sọ’ àti ‘ẹ kéde’ bá ὑμῖν àti àwọn àṣẹ Gíríìkì mu; a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
