  verdict: revise
  source_fidelity: Ìtumọ̀ orúkọ oyè Καναναῖος gẹ́gẹ́ bí “Kánánáì” dára, ó sì yẹ kí àlàyé ìsàlẹ̀ ojú ìwé pa ìlóye “Olùtara” mọ́. “Ẹni tí ó sì” ń mú ìtumọ̀ ὁ καὶ ... wá ní ìbámu. Ṣùgbọ́n “dà á” kì í ṣe ọ̀nà Yorùbá tó ṣe kedere tàbí tó wọ́pọ̀ láti sọ ìṣe Júdásì nínú àyíká yìí; ó lè fa ìtumọ̀ míì.
  naturalness: “Fi í hàn” jẹ́ ọ̀nà Yorùbá boṣewa, tí ó ti fìdí múlẹ̀ nínú ìforúkọsílẹ̀ Bíbélì, fún ìwà ìfi-Jésù-hàn/ìṣí-Jésù-fún àwọn ọ̀tá rẹ̀, nítorí náà ó bá “betrayed” mu ní àyíká yìí. Àlàyé ìsàlẹ̀ ojú ìwé yẹ kí ó lo “fi í lé ẹlòmíràn lọ́wọ́” kí ìtumọ̀ aláìṣègbè náà kedere, dípò “fi lé lọ́wọ́” tí kò ní kókó-ọ̀rọ̀.
  terminology: Kánánáì àti Ísíkáríótù yẹgẹ́gẹ́ bí àkọlélẹ̀ orúkọ/oyè. “Olùtara” wúlò gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀ ojú ìwé, kì í ṣe ìtumọ̀ pàtàkì. “Fi í hàn” ni a yàn fún παραδοὺς nítorí agbára ìwà ọ̀dàlẹ̀ nínú àyíká náà; “fi í lé ẹlòmíràn lọ́wọ́” ni àṣàyàn tó sún mọ́ ìtumọ̀ ọ̀rọ̀ náà ní gbogbogbòò.
