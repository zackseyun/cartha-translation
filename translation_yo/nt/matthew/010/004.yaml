source:
  edition: SBLGNT
  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: yo
  text: Símónì Kánánáì[a], àti Júdásì Ísíkáríótù, ẹni tí ó sì fi í hàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Símónì Olùtara.” Ní Gíríìkì, “Kánánáì” ni ó wà níhìn-ín; ó ṣeé ṣe kí ó jẹ́ oyè kan láti inú èdè Árámáíkì tàbí Hébérù, tí a sì ti máa ń lóye rẹ̀ sí “Olùtara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí ó sì fi í lé ẹlòmíràn lọ́wọ́.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí “fi lé lọ́wọ́,” ṣùgbọ́n nínú ọ̀ràn Júdásì, “fi í hàn” bá àyíká ìtàn náà mu.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Kánánáì
  rationale: A ṣe àkọlélẹ̀ orúkọ oyè Gíríìkì náà dípò ṣíṣ túmọ̀ rẹ̀ sí “Olùtara,” nítorí Καναναῖος jẹ́ ọ̀rọ̀ tí ó wá láti inú èdè Árámáíkì/Hébérù, kì í sì í ṣe ọ̀rọ̀ Gíríìkì tí ó wọ́pọ̀ fún “Olùtara.” Àlàyé ìsàlẹ̀ ojú ìwé fi ìtumọ̀ tí a sábà máa ń fún un hàn.
- source_word: Ἰσκαριώτης
  choice: Ísíkáríótù
  rationale: A kọ oyè/orúkọ ẹni náà ní ìbámu pẹ̀lú ìró rẹ̀, gẹ́gẹ́ bí ó ti yẹ fún orúkọ àdáni.
- source_word: παραδοὺς
  choice: dà á
  rationale: Bí ó tilẹ̀ jẹ́ pé παραδίδωμι lè túmọ̀ sí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́, nínú àyíká ọ̀rọ̀ nípa Júdásì ó ní agbára ìtumọ̀ ìwà ọ̀dàlẹ̀. “Dà á” sọ èyí ní Yorùbá àdánidá, ní ṣókí.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: ẹni tí ó sì dà á
  rationale: Àpilẹ̀kọ Gíríìkì pẹ̀lú ọ̀rọ̀ ìṣe aláìlópìn ń dá Júdásì mọ̀ nípa ohun tí ó ṣe. Gbólóhùn aláṣepọ̀ Yorùbá jẹ́ ìbámu àdánidá; “sì” tún pa καί mọ́.
theological_decisions:
- issue: Bóyá kí παραδοὺς jẹ́ ọ̀rọ̀ aláìṣègbè “fi í lé wọn lọ́wọ́” tàbí ọ̀rọ̀ tí ó fi ìwà ọ̀dàlẹ̀ hàn
  choice: dà á
  alternative: fi í lé wọn lọ́wọ́
  rationale: Àyíká ìtàn Mátíù ń dá Júdásì mọ̀ nípa ìṣe ọ̀dàlẹ̀ rẹ̀, nítorí náà “dà á” mú agbára ìtumọ̀ náà jáde láìfi ẹ̀kọ́ ìsìn mìíràn kún un. Nítorí ọ̀rọ̀ Gíríìkì náà fúnra rẹ̀ lè ní ìtumọ̀ tí ó gbòòrò sí i, a pa àṣàyàn aláìṣègbè náà mọ́ nínú àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ; a sì kọ àwọn orúkọ àdáni ní ọ̀nà tí olùkà Yorùbá lè pè nírọ̀rùn. A yà Kánánáì sí mímọ́ kúrò nínú ìtumọ̀ tààrà “ará Kénáánì,” kí a má bàa dá oyè náà pọ̀ mọ́ orúkọ ilẹ̀ Kénáánì.
