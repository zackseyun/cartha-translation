  text: As you enter the house[a], greet it.
translation:
  language: yo
  text: Nígbà tí ẹ bá ń wọ inú ilé náà[a], ẹ kí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kí àwọn ará ilé náà”—Gíríìkì sọ pé “ẹ kí i,” níbi tí arọ́pò-orúkọ náà ti ń tọ́ka sí ilé; ó ṣeé ṣe kí “ilé” dúró fún àwọn tó ń gbé inú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: bí ẹ̀yin bá ti ń wọ inú
  rationale: Ọ̀rọ̀ alápín ìsinsìnyí yìí ń ṣiṣẹ́ gẹ́gẹ́ bí gbólóhùn àkókò pẹ̀lú àṣẹ náà; ìtumọ̀ yìí fi hàn pé kíkọ́ni náà ṣẹlẹ̀ nígbà tí wọ́n ń wọlé.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀; “sì” so àṣẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú láì sọ ọ́ di àtakò líle.
- source_word: οἰκίαν
  choice: ilé náà
  rationale: οἰκία lè túmọ̀ sí ilé gẹ́gẹ́ bí ibi tàbí àwọn ará ilé. Nítorí ọ̀rọ̀ náà sọ nípa wíwọ inú rẹ̀, “ilé náà” pa ìtumọ̀ ibi mọ́, ó sì tún lè dúró fún àwọn olùgbé inú rẹ̀.
- source_word: ἀσπάσασθε
  choice: ẹ kí
  rationale: Ó jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. “Ẹ kí” jẹ́ ọ̀nà Yorùbá àdánidá, kedere, àti ọlọ́lá láti sọ pé kí wọ́n fi ìkíni fún un.
- source_word: αὐτήν
  choice: i
  rationale: Arọ́pò-orúkọ abo ẹyọ kan náà tọ́ka sí οἰκίαν. “I” nínú “ẹ kí i” pa ìtọ́kasí sí ilé náà mọ́, dípò yíyí rẹ̀ padà ní pàtó sí àwọn olùgbé.
theological_decisions:
- issue: Bóyá kí a kí ilé náà ní ọ̀nà àpẹẹrẹ tàbí kí a sọ ní pàtó pé àwọn ará ilé ni kí a kí
  choice: 'Pa ọ̀rọ̀ àpẹẹrẹ náà mọ́ nínú ẹsẹ̀: “ẹ kí i”'
  alternative: “ẹ kí àwọn ará ilé náà” tàbí “ẹ kí àwọn tó wà nínú rẹ̀”
  rationale: Gíríìkì fi arọ́pò-orúkọ ẹyọ kan tó ń tọ́ka sí “ilé” hàn gbangba. Bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí àwọn olùgbé ilé náà ni a ní lọ́kàn, a kò yanjú àìdánilójú yẹn sínú ọ̀rọ̀ pàtàkì; àlàyé wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní ibi tó yẹ. A lo “ẹ̀yin” àti “ẹ” láti fi ọ̀pọ̀ ènìyàn tí ọ̀rọ̀ náà ń bá sọ hàn; èdè náà jẹ́ ti òde òní, kedere, àti ọlọ́lá.
