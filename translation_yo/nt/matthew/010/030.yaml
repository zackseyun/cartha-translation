  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: yo
  text: Ṣùgbọ́n àní gbogbo irun orí yín ni a ti kà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti ka wọ́n tán.” Ọ̀nà ìṣe aláfẹ̀ẹ́ tí ó ti parí nínú èdè Gíríìkì lè tẹnumọ́ iṣẹ́ tí a ti ṣe àti àbájáde rẹ̀ tí ó ṣì wà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olúwa onípúpọ̀ ni; “yín” ni ọ̀nà Yorùbá àdánidá láti fi hàn pé irun orí àwọn tí Jésù ń bá sọ̀rọ̀ ni.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora onírẹ̀lẹ̀ hàn nínú ọ̀rọ̀; “Ṣùgbọ́n” bá ìlọsíwájú ọ̀rọ̀ nínú àyíká mu.
- source_word: καὶ
  choice: àní
  rationale: Níbí, καὶ ń tẹ ohun tí ó lè dà bí ohun kékeré mọ́lẹ̀; “àní” mú ìtumọ̀ “àní pàápàá” jáde lọ́nà àdánidá.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: gbogbo irun orí yín
  rationale: “Irun orí” jẹ́ gbólóhùn Yorùbá àdánidá fún irun tí ó wà lórí; “gbogbo” pẹ̀lú ìṣe kíkà ń pa èrò irun kọ̀ọ̀kan mọ́.
- source_word: πᾶσαι
  choice: gbogbo
  rationale: Ó fi àpapọ̀ tí kò yọ ẹyọ kan sílẹ̀ hàn.
- source_word: ἠριθμημέναι εἰσίν
  choice: ni a ti kà
  rationale: Àkójọpọ̀ perfect passive Gíríìkì tọ́ka sí iṣẹ́ tí a ti ṣe, tí àbájáde rẹ̀ sì dúró; “a ti kà” ṣe àfihàn ìṣe tí ó ti parí, láìsọ ẹni tó ṣe é ní tààrà.
theological_decisions:
- issue: Ìwọ̀n ìmọ̀ àti àbójútó Ọlọ́run tí ọ̀rọ̀ náà ń tọ́ka sí
  choice: A pa àwòrán gidi náà mọ́ pé a ti ka gbogbo irun orí wọn, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Ṣíṣe àtúmọ̀ rẹ̀ ní gbangba gẹ́gẹ́ bí àbójútó tàbí ìṣàkóso Ọlọ́run lórí gbogbo ohun.
  rationale: Ẹsẹ náà fúnra rẹ̀ sọ nípa kíkà irun; àyíká ni ó jẹ́ kí òǹkàwé rí ìtumọ̀ rẹ̀ nípa ìmọ̀ àti àbójútó Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye; “àní” pa agbára ìtẹnumọ́ καὶ mọ́, “ni a ti kà” sì mú perfect passive jáde lọ́nà Yorùbá àdánidá.
