revisions:
- from: Ẹ máa wo àwọn aláìsàn sàn, ẹ jí àwọn òkú dìde, ẹ sọ àwọn adẹ́tẹ̀ di mímọ́[a], ẹ lé àwọn ẹ̀mí èṣù jáde. Ọ̀fẹ́ ni ẹ fi gbà á; ẹ fi fúnni lọ́fẹ̀ẹ́.
  to: Ẹ wo àwọn aláìsàn sàn, ẹ jí àwọn òkú dìde[b], ẹ sọ àwọn adẹ́tẹ̀ di mímọ́[a], ẹ lé àwọn ẹ̀mí èṣù jáde. Ọ̀fẹ́ ni ẹ gbà; ẹ sì fúnni lọ́fẹ̀ẹ́.
  rationale: A tún ọ̀rọ̀ náà ṣe díẹ̀ kí a má bàa sọ ohun tí wọ́n gbà di pàtó ju bó ṣe wà nínú Gíríìkì lọ, kí àwọn àṣẹ inú àtòjọ náà jọ ara wọn, àti kí a fi ìyàtọ̀ ẹ̀rí ọwọ́ tí SBLGNT tọ́ka sí hàn. Àkọsílẹ̀ àṣà nípa “adẹ́tẹ̀” ni a pa mọ́ láì yí ìtumọ̀ rẹ̀ padà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:43Z'
review_pass:
  verdict: revise
  source_fidelity: Àwọn àṣẹ mẹ́rin náà àti ìyàtọ̀ wọn nínú àtòjọ náà ni a pa mọ́. Síbẹ̀, àmì ⸂ ⸃ nínú SBLGNT yí ọ̀rọ̀ náà “νεκροὺς ἐγείρετε” ká, tí ó fi hàn pé ẹ̀rí ọwọ́ kọ̀ọ̀kan yàtọ̀ nípa gbolóhùn náà. Ó yẹ kí ìtumọ̀ náà ní àkọsílẹ̀ kan fún un, láì yọ ọ́ kúrò nínú ọ̀rọ̀ àkọ́kọ́. Àtúnṣe ìpín kejì náà tún yẹ kí ó má ṣe fi “á” sọ ohun tí a gbà di pàtó, nítorí Gíríìkì fi ohun náà sílẹ̀ láìsọ̀rọ̀ rẹ̀.
  naturalness: “Ẹ wo àwọn aláìsàn sàn,” “ẹ jí àwọn òkú dìde,” “ẹ sọ àwọn adẹ́tẹ̀ di mímọ́,” àti “ẹ lé àwọn ẹ̀mí èṣù jáde” jẹ́ Yorùbá ìgbàlódé tí ó ṣe kedere. Yíyọ “máa” kúrò nínú àṣẹ àkọ́kọ́ ń mú kí gbogbo àwọn àṣẹ inú àtòjọ náà dúró ní ìrísí kan náà, láì fi ìtumọ̀ àṣà-tẹ̀síwájú kún ọ̀kan nínú wọn nìkan.
  terminology: “Aláìsàn,” “òkú,” “adẹ́tẹ̀,” “di mímọ́,” àti “ẹ̀mí èṣù” bá ọ̀rọ̀ Gíríìkì mu dáadáa. “Di mímọ́” dá ìtumọ̀ ìwòsàn pẹ̀lú ìwẹ̀nùmọ́ tí καθαρίζετε ní mọ́ sílẹ̀. Àkọsílẹ̀ nípa “adẹ́tẹ̀” ń yẹra fún fífi λεπροί dọ́gba pátápátá mọ́ àrùn Hansen òde òní.
  issues:
  - severity: medium
    issue: A kò fi àkọsílẹ̀ hàn fún ọ̀rọ̀ “nekròus egeírete” tí SBLGNT fi àmì ìyàtọ̀ ẹ̀rí ọwọ́ ⸂ ⸃ ká.
    rationale: Nítorí ìpinnu ẹ̀rí ọ̀rọ̀ náà kò dájú pátápátá nínú orísun tí a fún, ìtumọ̀ yẹ kí ó pa ìyàtọ̀ yìí mọ́ ní àkọsílẹ̀, bí ó tilẹ̀ jẹ́ pé a túmọ̀ ọ̀rọ̀ tí SBLGNT tẹ̀ jáde.
  - severity: low
    issue: “Ọ̀fẹ́ ni ẹ fi gbà á” fi ohun-ìṣe “á” kun gbolóhùn Gíríìkì.
    rationale: δωρεὰν ἐλάβετε kò sọ ohun tí wọ́n gbà ní pàtó. Ìtúmọ̀ tí kò lo aṣojú náà ń pa ìṣókùnfà ọrọ̀ orísun mọ́.
  - severity: low
    issue: “Máa” wà nínú àṣẹ ìwòsàn àkọ́kọ́ nìkan.
    rationale: Gbogbo àwọn ọ̀rọ̀-ìṣe mẹ́rin jẹ́ àwọn àṣẹ onípele kan náà nínú Gíríìkì. Àwọn àṣẹ Yorùbá tó rọrùn, tó jọ ara wọn, dá ìṣọ̀kan àtòjọ náà bójú tó.
