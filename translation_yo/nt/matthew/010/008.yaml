source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: yo
  text: Ẹ wo àwọn aláìsàn sàn, ẹ jí àwọn òkú dìde[b], ẹ sọ àwọn adẹ́tẹ̀ di mímọ́[a], ẹ lé àwọn ẹ̀mí èṣù jáde. Ọ̀fẹ́ ni ẹ gbà; ẹ sì fúnni lọ́fẹ̀ẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ tí a sábà máa ń túmọ̀ sí “adẹ́tẹ̀” lè tọ́ka sí onírúurú àrùn awọ ara tó le koko nínú lílo Bíbélì, kì í ṣe àrùn Hansen tí a ń pè ní ẹ̀tẹ̀ lónìí nìkan.
    reason: cultural_note
  - marker: b
    text: Àwọn ìwé ọwọ́ Gíríìkì àtijọ́ kan kò ní ọ̀rọ̀ náà, “ẹ jí àwọn òkú dìde.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: Ẹ máa wo àwọn aláìsàn sàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí kí wọ́n wo àwọn tí ara wọn kò dá sàn; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa àṣẹ náà mọ́.
- source_word: νεκροὺς ἐγείρετε
  choice: ẹ jí àwọn òkú dìde
  rationale: Ó sọ ní tààràtà pé kí wọ́n mú àwọn ẹni tí ó kú dìde, kì í ṣe pé kí wọ́n kàn jí lójú oorun.
- source_word: λεπροὺς καθαρίζετε
  choice: ẹ sọ àwọn adẹ́tẹ̀ di mímọ́
  rationale: “Di mímọ́” pa ìtumọ̀ ìwòsàn àti ìwẹ̀nùmọ́ nípa ẹ̀sìn tí καθαρίζω ní mọ́; akọsilẹ̀ ṣàlàyé pé λεπρός lè gbòòrò ju àrùn ẹ̀tẹ̀ òde òní lọ.
- source_word: δαιμόνια ἐκβάλλετε
  choice: ẹ lé àwọn ẹ̀mí èṣù jáde
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún lílé àwọn ẹ̀mí búburú jáde, ó sì pa agbára ọ̀rọ̀ ἐκβάλλω mọ́.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: Ọ̀fẹ́ ni ẹ fi gbà á; ẹ fi fúnni lọ́fẹ̀ẹ́
  rationale: 'Ó pa ìfiṣọ̀kan àti ìtẹnumọ́ δωρεάν mọ́: ohun tí wọ́n gbà láìsan owó ni kí wọ́n fi fúnni láìsan owó.'
theological_decisions:
- issue: Ìwọ̀n àṣẹ àwọn iṣẹ́ ìyanu
  choice: A túmọ̀ àwọn ọ̀rọ̀ náà gẹ́gẹ́ bí àṣẹ tààrà sí àwọn ọmọ-ẹ̀yìn nínú iṣẹ́ ìránṣẹ́ yìí.
  alternative: Kí a sọ díẹ̀ nínú wọn di àpẹẹrẹ tàbí kí a fi mọ́ iṣẹ́ ìjọ nígbà tó tẹ̀ lé e nìkan.
  rationale: Gíríìkì lo àwọn ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn nínú àtòjọ iṣẹ́ tó ṣe kedere; ìtumọ̀ kò gbọ́dọ̀ dín wọn kù tàbí mú wọn gbòòrò ju ọ̀rọ̀ náà lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Àtúnṣe “ẹ ...” pa àṣẹ ọ̀pọ̀ ènìyàn mọ́; “Ọ̀fẹ́ ni” sì tẹnumọ́ pé wọn kò san owó fún ohun tí wọ́n gbà.
