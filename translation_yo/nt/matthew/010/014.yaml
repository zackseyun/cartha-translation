id: MAT.10.14
reference: Matthew 10:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: yo
  text: 'Ẹnikẹ́ni tí kò bá gbà yín, tí kò sì fetí sí ọ̀rọ̀ yín[a], nígbà tí ẹ bá jáde kúrò ní ilé náà tàbí ìlú náà[c], ẹ gbọn erùpẹ̀ náà kúrò ní ẹsẹ̀ yín[b].


    [a] Tàbí, “Ẹnikẹ́ni tí kò bá gbà yín, tí kò sì gbọ́ ọ̀rọ̀ yín.”


    [b] “Gbọn erùpẹ̀ náà kúrò ní ẹsẹ̀ yín” jẹ́ ìṣe àmì tí ó fi hàn pé àwọn ọmọ-ẹ̀yìn náà ya ara wọn sọ́tọ̀ kúrò lọ́dọ̀ àwọn tí ó kọ ọ̀rọ̀ wọn, àti pé ìdájọ́ ń bẹ lórí irú ìkọ̀sílẹ̀ bẹ́ẹ̀.


    [c] Ọ̀rọ̀ Gíríìkì tí a tú sí “ìlú” lè tọ́ka sí ìlú ńlá tàbí ìlú kékeré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnikẹ́ni tí kò bá gbà yín, tí kò sì gbọ́ ọ̀rọ̀ yín.”
    reason: lexical_alternative
  - marker: b
    text: “Gbọn erùpẹ̀ náà kúrò ní ẹsẹ̀ yín” jẹ́ ìṣe àmì tí ó fi hàn pé àwọn ọmọ-ẹ̀yìn náà ya ara wọn sọ́tọ̀ kúrò lọ́dọ̀ àwọn tí ó kọ ọ̀rọ̀ wọn, àti pé ìdájọ́ ń bẹ lórí irú ìkọ̀sílẹ̀ bẹ́ẹ̀.
    reason: cultural_note
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “ìlú” lè tọ́ka sí ìlú ńlá tàbí ìlú kékeré.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: Ẹnikẹ́ni tí kò bá
  rationale: 'Ìtumọ̀ yìí mú agbára àìdánimọ̀ àti àídájú ọ̀rọ̀ Gíríìkì náà jáde lọ́nà Yorùbá tó ṣe déédéé: ‘ẹnikẹ́ni tí kò bá.’'
- source_word: δέξηται ὑμᾶς
  choice: gbà yín
  rationale: ‘Gbà yín’ lè ní ìtumọ̀ fífi inú rere gba àwọn òjíṣẹ́ àti fífi ojú rere wo iṣẹ́ tí wọ́n mú wá, láìfi ìtumọ̀ míì kún un.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: tí kò sì fetí sí ọ̀rọ̀ yín
  rationale: ‘Fetí sí’ fi hàn pé kì í ṣe gbígbọ́ ohùn lásán, ṣùgbọ́n fífi etí sí ohun tí wọ́n ń sọ; kò sì lọ jìn dé ìgbọ́ràn dandan.
- source_word: ἐξερχόμενοι ἔξω
  choice: nígbà tí ẹ bá jáde kúrò
  rationale: Ó pa ìṣe jíjáde kúrò ní ibi náà mọ́, ó sì so ó mọ́ àṣẹ pàtàkì tó tẹ̀ lé e.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: ní ilé náà tàbí ìlú náà
  rationale: Àtúnlò ‘náà’ mú ìtọ́kasí ibi pàtó náà ṣe kedere. ‘Ìlú’ jẹ́ ọ̀rọ̀ Yorùbá adayeba tó lè gba ìlú ńlá tàbí kékeré.
- source_word: ἐκτινάξατε
  choice: ẹ gbọn ... kúrò
  rationale: Ọ̀rọ̀ yìí sọ ìṣe fífi agbára gbọn ohun kan kúrò níbi tó wà, ó sì bá àwòrán ìṣe àmì náà mu.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: erùpẹ̀ náà kúrò ní ẹsẹ̀ yín
  rationale: ‘Erùpẹ̀’ jẹ́ ìbámu pàtó fún κονιορτός, ‘kúrò ní ẹsẹ̀ yín’ sì sọ ibi tí a ti yọ ọ́ kedere.
theological_decisions:
- issue: Ìṣe àmì ìdájọ́ sí àwọn tó kọ àwọn ọmọ-ẹ̀yìn àti ọ̀rọ̀ wọn
  choice: A pa àṣẹ gidi náà mọ́ pé kí wọ́n gbọn erùpẹ̀ kúrò ní ẹsẹ̀ wọn.
  alternative: Ṣíṣe àlàyé rẹ̀ nínú ẹsẹ̀ náà gẹ́gẹ́ bí ‘ẹ fi wọ́n sílẹ̀ fún ìdájọ́’ tàbí fífi ọ̀rọ̀ láti inú àwọn ẹsẹ̀ tó jọra kún un.
  rationale: Ẹsẹ̀ yìí fúnra rẹ̀ sọ ìṣe àmì náà, ṣùgbọ́n kò ṣàlàyé rẹ̀ ní tààrà. Fífi àwòrán gidi náà sílẹ̀ nínú ọ̀rọ̀ pàtàkì ń yẹra fún fífi ìtumọ̀ láti ibòmíràn wọ inú ẹsẹ̀ náà; àlàyé àṣà wà nínú àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ; èdè náà jẹ́ adayeba, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ọ̀pọ̀-orúkọ ẹni kejì ‘yín/ẹ’ gẹ́gẹ́ bí ọ̀rọ̀ orísun ṣe ń bá àwọn ọmọ-ẹ̀yìn sọ̀rọ̀.
