id: MAT.10.15
reference: Matthew 10:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: yo
  text: “Lóòótọ́ ni mo wí fún yín pé, ní ọjọ́ ìdájọ́, yóò ṣeé fara dà[a] fún ilẹ̀ Sódómù àti Gòmórà[b] ju fún ìlú náà[c] lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò túbọ̀ rọrùn láti fara dà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún Sódómù àti Gòmórà.” Ní ti gidi, Gíríìkì ní “fún ilẹ̀ Sódómù àti Gòmórà.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìlú kékeré tàbí ìlú ńlá; ọ̀rọ̀ Yorùbá “ìlú” lè gba ìtumọ̀ méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó sọ ìmúdájú ọ̀rọ̀ pẹ̀lú agbára àti ọ̀wọ̀, ó sì ṣe kedere ju lílo àfọwọkọ ‘Àmín’ lọ nínú ìbẹ̀rẹ̀ gbólóhùn yìí.
- source_word: λέγω ὑμῖν
  choice: mo wí fún yín
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì jẹ́ ọ̀nà Yorùbá tó níyì fún ọ̀rọ̀ tààrà.
- source_word: ἀνεκτότερον
  choice: yóò ṣeé fara dà ... ju ... lọ
  rationale: Ìṣètò afiwéra yìí mú ìtumọ̀ ‘more bearable/tolerable’ jáde ní Yorùbá àdánidá láìsọ ohun tí ìdájọ́ náà yóò ní nínú ju bí ẹsẹ̀ ṣe sọ lọ.
- source_word: γῇ
  choice: fún ilẹ̀
  rationale: ‘Ilẹ̀’ pa ìtọ́kasí sí agbègbè Sódómù àti Gòmórà mọ́, dípò kí ó túmọ̀ sí gbogbo ayé.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: Sódómù àti Gòmórà
  rationale: Àwọn wọ̀nyí ni ìkọ̀wé orúkọ ibi náà ní Yorùbá, pẹ̀lú àmì ohùn tó bá ìpè wọn mu.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ní ọjọ́ ìdájọ́
  rationale: Ó fi ọjọ́ ìdájọ́ ọjọ́ iwájú hàn ní kedere, láìfikún ètò ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò sọ.
- source_word: πόλει
  choice: ìlú
  rationale: ‘Ìlú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè tọ́ka sí town tàbí city, gẹ́gẹ́ bí πόλις ṣe lè rí.
- source_word: ἐκείνῃ
  choice: náà
  rationale: Ó tọ́ka padà sí ìlú pàtó tí a ti ń sọ̀rọ̀ rẹ̀ láìfikún ìtẹnumọ́ tí kò pọndandan.
theological_decisions:
- issue: Ìtumọ̀ ‘ọjọ́ ìdájọ́’
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ọjọ́ ìdájọ́ ọjọ́ iwájú, láìsọ kúlẹ̀kúlẹ̀ ohun tí yóò ṣẹlẹ̀ ní ọjọ́ náà.
  alternative: Àkókò ìdájọ́ ní ìtumọ̀ gbogbogbò.
  rationale: Gbólóhùn Gíríìkì náà sábà ń tọ́ka sí ìdájọ́ Ọlọ́run ní ọjọ́ iwájú, ṣùgbọ́n ẹsẹ̀ yìí kò ṣàlàyé ètò ẹ̀kọ́ ìsìn tó ju èyí lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó níyì, tó ṣeé lóye fún gbogbo ènìyàn. A lo ‘mo wí fún yín’ láti pa ìrísí ọ̀rọ̀ pàtàkì Jésù mọ́, a sì lo ‘ṣeé fara dà’ fún afiwéra tí ó lágbára ṣùgbọ́n tí kò tú ìtumọ̀ ẹsẹ̀ náà ré kọjá ohun tí Gíríìkì sọ.
