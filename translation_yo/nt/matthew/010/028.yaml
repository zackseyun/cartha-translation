id: MAT.10.28
reference: Matthew 10:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: yo
  text: Ẹ má bẹ̀rù àwọn tí ń pa ara ṣùgbọ́n tí kò lè pa ọkàn. Kàkà bẹ́ẹ̀, ẹ bẹ̀rù ẹni tí ó lè pa ọkàn àti ara run ní Gẹhẹ́nà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ní ọ̀run àpáàdì.” Ọ̀rọ̀ Gíríìkì ni “Gẹhẹ́nà,” ọ̀rọ̀ tí ó wá láti inú Àfonífojì Hínómù, tí a sì ń lò fún ibi ìdájọ́ ìkẹyìn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: bẹ̀rù
  rationale: Ọ̀rọ̀ náà fara hàn lẹ́ẹ̀mejì nínú ìtakora; lílo “bẹ̀rù” ní ibì méjèèjì pa ìṣọ̀kan àti agbára ìkìlọ̀ Gíríìkì mọ́.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: àwọn tí ń pa
  rationale: Participle pẹ̀lú article ń tọ́ka sí ẹgbẹ́ àwọn ènìyàn lápapọ̀; “àwọn tí ń pa” jẹ́ Yorùbá àdánidá tí ó sì pa ìṣe náà mọ́.
- source_word: σῶμα
  choice: ara
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tààrà fún ara ti ẹran-ara.
- source_word: ψυχήν
  choice: ọkàn
  rationale: Nínú ìtakora rẹ̀ pẹ̀lú “ara,” ψυχή ń tọ́ka sí apá ẹni tí kì í ṣe ara lásán; “ọkàn” jẹ́ ọ̀rọ̀ Yorùbá Bíbélì tí ó wọ́pọ̀, bí ó tilẹ̀ jẹ́ pé ó lè ní ìtumọ̀ míì ní àyíká ọ̀rọ̀ mìíràn.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: tí wọn kò lè pa
  rationale: Ìtumọ̀ yìí mú àìlágbára wọn hàn ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn.
- source_word: μᾶλλον
  choice: kàkà bẹ́ẹ̀
  rationale: 'Ó fi ìyípadà àti ìtakora hàn: ẹ má bẹ̀rù àwọn wọ̀nyí; dípò bẹ́ẹ̀, ẹ bẹ̀rù ẹni kejì.'
- source_word: τὸν δυνάμενον
  choice: ẹni tí ó lè
  rationale: Gíríìkì kò dárúkọ ẹni náà ní tààrà; “ẹni tí ó lè” pa àìsọ-orúkọ yẹn mọ́ láìfi ìtumọ̀ kan kún un.
- source_word: ἀπολέσαι
  choice: pa ... run
  rationale: “Pa run” mú ìparun ìdájọ́ tó lágbára inú ἀπόλλυμι hàn, láìṣàlàyé irú ìparun náà ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: ἐν γεέννῃ
  choice: ní Gẹhẹ́nà
  rationale: Ìkọ̀wé orúkọ náà gẹ́gẹ́ bí Gẹhẹ́nà pa ọ̀rọ̀ pàtó Gíríìkì àti ìtàn Juu rẹ̀ mọ́, dípò fífi ọ̀rọ̀ ìtumọ̀ tí ó lè ní àfikún èrò ẹ̀kọ́ ìsìn sí i.
theological_decisions:
- issue: Ta ni “ẹni tí ó lè pa ọkàn àti ara run ní Gẹhẹ́nà” jẹ́?
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó lè,” láìdárúkọ rẹ̀.
  alternative: Ọlọ́run; Sátánì
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tí ó ní àṣẹ ìdájọ́ ìkẹyìn, ṣùgbọ́n Gíríìkì kò dárúkọ ẹni náà. Ìtumọ̀ náà pa àìsọ pàtó yìí àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn rẹ̀ mọ́.
- issue: Bí a ṣe túmọ̀ γέεννα
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: “Gẹhẹ́nà” tẹ̀lé ọ̀rọ̀ orísun, ó sì pa ìbátan rẹ̀ pẹ̀lú Àfonífojì Hínómù àti ìdájọ́ ìkẹyìn mọ́. Àlàyé ìtumọ̀ tí ó mọ̀ sí àwọn òǹkàwé wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú àwọn ọ̀rọ̀-ìṣe ọ̀pọ̀ Gíríìkì. A fi àmì ohùn sí ibi tí ó yẹ, a sì yan gbólóhùn tí ó ṣe kedere fún òǹkàwé lasán.
