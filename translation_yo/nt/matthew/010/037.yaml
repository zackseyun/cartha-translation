id: MAT.10.37
reference: Matthew 10:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: yo
  text: Ẹni tí ó fẹ́ràn baba tàbí ìyá ju mí lọ kò yẹ fún mi[a]; ẹni tí ó sì fẹ́ràn ọmọkùnrin tàbí ọmọbìnrin ju mí lọ kò yẹ fún mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘kò tóótun fún mi.’ Gbólóhùn Gíríìkì náà sọ pé ẹni tí ó fi ẹlòmíràn ṣáájú Jésù nínú ìfẹ́ kò yẹ fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: Ẹni tí ó bá fẹ́ràn
  rationale: Àpilẹ̀kọ pẹ̀lú participle ìsinsìnyí ń tọ́ka sí ẹnikẹ́ni tí ìṣe yìí ń ṣe àpèjúwe rẹ̀. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ẹni kan tí ó dúró fún gbogbo ènìyàn mọ́.
- source_word: πατέρα ἢ μητέρα
  choice: baba tàbí ìyá
  rationale: A túmọ̀ àwọn ọ̀rọ̀ ìbátan náà ní tààrà láìfi ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní tí kò sí nínú Gíríìkì kún un.
- source_word: ὑπὲρ ἐμέ
  choice: ju mí lọ
  rationale: Nínú àyíká ìfiwéra yìí, ὑπέρ túmọ̀ sí fífi ẹnì kan ṣáájú Jésù nínú ìfẹ́. ‘Ju mí lọ’ ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá jù lọ.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: kò yẹ fún mi
  rationale: Èyí pa ìdájọ́ líle ti ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá, láìfikún ìtumọ̀ bíi jíjẹ́ ọmọlẹ́yìn tàbí jíjẹ́ ti Jésù.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so gbólóhùn méjèèjì pọ̀ lọ́nà àdánidá, ó sì pa ìṣọ̀kan ìgbékalẹ̀ wọn mọ́.
- source_word: υἱὸν ἢ θυγατέρα
  choice: ọmọkùnrin tàbí ọmọbìnrin
  rationale: Àwọn ọ̀rọ̀ ìbátan náà ni a túmọ̀ ní tààrà láìfikún arọ́pò-orúkọ ohun-ìní tí kò hàn gbangba nínú Gíríìkì.
theological_decisions:
- issue: Bí a ṣe máa lóye ohun tí Jésù béèrè nípa ìfẹ́ ẹbí
  choice: A fi hàn pé ìfẹ́ àti ìfọkànsìn sí Jésù gbọ́dọ̀ ga ju ti àwọn ìbátan tímọ́tímọ́ lọ.
  alternative: Lílo ọ̀rọ̀ tí ó rọrùn sí i bíi ‘kò fẹ́ràn mi tó,’ tàbí fífi kún un pé ènìyàn gbọ́dọ̀ kórìíra ẹbí rẹ̀.
  rationale: Gíríìkì sọ ìfiwéra ní tààrà (‘ju mí lọ’) ó sì tẹ̀ lé e pẹ̀lú ìdájọ́ pé ẹni náà kò yẹ fún Jésù. Ìtumọ̀ yìí kò sọ pé ìfẹ́ ẹbí burú, kò sì sọ ọ̀rọ̀ náà di aláìlágbára.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àtúnsọ ìbẹ̀rẹ̀ ‘Ẹni tí ó bá fẹ́ràn’ pa ìṣọ̀kan àti ìtẹnumọ́ Gíríìkì mọ́.
