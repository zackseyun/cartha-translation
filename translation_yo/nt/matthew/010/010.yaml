id: MAT.10.10
reference: Matthew 10:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: yo
  text: Ẹ má mú àpò ìrìn-àjò fún ìrìn-àjò, tàbí ẹ̀wù méjì, tàbí bàtà, tàbí ọ̀pá[a]; nítorí òṣìṣẹ́ yẹ fún oúnjẹ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn kan lóye “tàbí ọ̀pá” gẹ́gẹ́ bí ìfòfindè ọ̀pá àfikún, pàápàá ní ìmọ́lẹ̀ Máàkù 6:8, níbi tí a ti gba wọn láyè láti mú ọ̀pá.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: àpò ìrìn-àjò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àpò tí arìnrìn-àjò máa ń gbé fún ohun èlò tàbí oúnjẹ; yíyan ọ̀rọ̀ yìí mú àyíká ìrìn-àjò hàn ní Yorùbá àdánidá.
- source_word: εἰς ὁδὸν
  choice: fún ọ̀nà
  rationale: Gbólóhùn yìí túmọ̀ sí ohun tí a mú lọ fún ìrìn-àjò; “fún ọ̀nà” jẹ́ kúkúrú, ó sì bá ìṣíkiri ọ̀rọ̀ Yorùbá mu.
- source_word: δύο χιτῶνας
  choice: ẹ̀wù méjì
  rationale: χιτών jẹ́ aṣọ tí a wọ mọ́ra. “Ẹ̀wù” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì fi irú aṣọ òde òní tí kò bá àkókò náà mu wọ inú ẹsẹ̀ náà.
- source_word: ὑποδήματα
  choice: bàtà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí a dè sí abẹ́ ẹsẹ̀; “bàtà” ni ọ̀rọ̀ Yorùbá àdánidá fún irú ohun tí a fi ń rìn yìí.
- source_word: ῥάβδον
  choice: ọ̀pá
  rationale: Nínú àyíká yìí, ῥάβδος jẹ́ ọ̀pá ìrìn. A pa ìdènà inú Mátíù mọ́ láì mú un bá Máàkù 6:8 mu.
- source_word: ἄξιος
  choice: yẹ fún
  rationale: “Yẹ fún” sọ ìtumọ̀ jíjẹ́ ẹni tí ó tọ́ sí tàbí tí ó lẹ́tọ̀ọ́ sí ohun kan ní Yorùbá àdánidá.
- source_word: ὁ ἐργάτης
  choice: òṣìṣẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni tí ń ṣiṣẹ́; “òṣìṣẹ́” ṣe kedere, kò sì fi ipò ìjọ kan tí Gíríìkì kò sọ kún un.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: oúnjẹ rẹ̀
  rationale: τροφή túmọ̀ ní tààrà sí oúnjẹ tàbí ohun ìtọ́jú ara. “Oúnjẹ rẹ̀” pa ìtumọ̀ gidi náà mọ́ dípò fífi ìtumọ̀ gbòòrò bí ‘ìpèsè’ tàbí ‘ìtọ́jú’ sí i.
theological_decisions:
- issue: Bí a ṣe lè mú ohun èlò ìrìn-àjò tí Mátíù kà léèwọ̀ bá ìtàn tó jọ ọ́ ní Máàkù mu
  choice: A pa ọ̀rọ̀ Mátíù “tàbí ọ̀pá” mọ́ gẹ́gẹ́ bí ìdènà nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè lóye rẹ̀ pé ọ̀pá àfikún nìkan ni a kà léèwọ̀, pàápàá ní ìfiwéra pẹ̀lú Máàkù 6:8.
  rationale: Gíríìkì Mátíù fi ῥάβδον sínú àkójọ ohun tí wọn kò gbọdọ̀ mú. Ìtumọ̀ náà pa ìyàtọ̀ láàárín àwọn ìtàn náà mọ́, ó sì fi àlàyé míì sí àlàyé ìsàlẹ̀ dípò yíyanjú ìṣòro náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àkójọ ohun ìrìn-àjò àti ìforígbárí tó ṣeé rí pẹ̀lú Máàkù mọ́.
