id: MAT.10.29
reference: Matthew 10:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: yo
  text: Ṣé a kì í ta ológoṣẹ méjì ní asáríọ̀nù kan[b]? Síbẹ̀, kò sí ọ̀kan nínú wọn tí yóò ṣubú lulẹ̀ láìsí Baba yín[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘láìsí Baba yín.’ Gbólóhùn náà lè tọ́ka sí ìmọ̀, àbójútó, tàbí ìfẹ́-inú Baba, ṣùgbọ́n èdè Gíríìkì kò sọ èyí tí ó túmọ̀ sí ní pàtó.
    reason: alternative_reading
  - marker: b
    text: Asáríọ̀nù jẹ́ ẹyọ owó bàbà Róòmù kékeré kan tí iye rẹ̀ kéré gan-an.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: ológoṣẹ
  rationale: Ọ̀rọ̀ náà sábà ń tọ́ka sí ẹyẹ ológoṣẹ ní àyíká ọ̀rọ̀ yìí; èyí ṣe pàtó ju ‘àwọn ẹyẹ kéékèèké’ lọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: ἀσσαρίου
  choice: asáríọ̀nù
  rationale: A pa orúkọ owó bàbà Róòmù yìí mọ́ dípò lílo iye owó òde òní tí kò bá a dọ́gba; àlàyé ìsàlẹ̀ ṣàlàyé bí iye rẹ̀ ti kéré tó.
- source_word: πωλεῖται
  choice: a kì í ta
  rationale: Èyí tú ìṣe tí a sábà máa ń ṣe tí ọ̀rọ̀ ìṣe aláìṣe Gíríìkì tó wà ní àkókò ìsinsìnyí ń fi hàn, ó sì bá ìbéèrè àròsọ Yorùbá mu.
- source_word: ἓν ἐξ αὐτῶν
  choice: ọ̀kan nínú wọn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ apá-kan-lára-ọ̀pọ̀ yìí.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: yóò ṣubú lulẹ̀
  rationale: Gbólóhùn yìí sọ ìṣubú dé orí ilẹ̀ ní Yorùbá àdánidá, ó sì pa ìtọ́kasí ọjọ́ iwájú mọ́.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: láìsí Baba yín
  rationale: Èyí tẹ̀ lé ìtumọ̀ ‘láìsí/láìyàtọ̀ sí’ láìfi ‘ìmọ̀,’ ‘ìfẹ́,’ tàbí ‘ìyọ̀ǹda’ Baba kún ọ̀rọ̀ Gíríìkì tí kò sọ ọ̀nà ìbáṣepọ̀ náà ní pàtó.
- source_word: οὐχὶ ... ;
  choice: Ṣé a kì í ...?
  rationale: Ìbéèrè àròsọ yìí ń retí ìdáhùn bẹ́ẹ̀ ni, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó ṣe kedere ní Yorùbá òde òní.
- source_word: καὶ
  choice: Síbẹ̀
  rationale: 'Ní àyíká yìí, ọ̀rọ̀ náà ń fi ìyàtọ̀ hàn: bí iye àwọn ẹyẹ náà tilẹ̀ kéré, àní ọ̀kan pàápàá kò ṣubú láìsí Baba.'
theological_decisions:
- issue: Ìtumọ̀ ‘láìsí Baba yín’ nípa ìpèsè àti àbójútó Ọlọ́run
  choice: A pa àìdánilójú gbólóhùn Gíríìkì mọ́ pẹ̀lú ‘láìsí Baba yín.’
  alternative: ‘láìsí ìmọ̀ Baba yín’ tàbí ‘láìsí ìfẹ́ Baba yín’
  rationale: Ẹsẹ̀ náà fi ìbáṣepọ̀ Baba pẹ̀lú ohun tó ṣẹlẹ̀ hàn, ṣùgbọ́n kò sọ ní pàtó bóyá ìmọ̀, àbójútó, ìfẹ́, tàbí ìyọ̀ǹda rẹ̀ ni a ń tẹnumọ́. Nítorí náà, a kò mú ẹ̀kọ́ ìtumọ̀ kan ṣoṣo wọ inú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá òde òní tí ó ṣe kedere, tí ó sì ní iyì. ‘Ṣé a kì í ta’ mú ìbéèrè àròsọ náà jẹ́ àdánidá; ‘ológoṣẹ’ jẹ́ ọ̀rọ̀ pàtó fún sparrow; a sì lo ‘Baba’ pẹ̀lú lẹ́tà ńlá nítorí ìtọ́kasí sí Ọlọ́run. A fi àmì ohùn sí ibi tí ó bá èdè Yorùbá àdánidá mu.
