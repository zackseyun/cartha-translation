review_pass:
  verdict: revise
  source_fidelity: 'Ọ̀rọ̀ pàtàkì náà fara mọ́ Greek dáadáa: παραδῶσιν jẹ́ ‘fi yín lé wọn lọ́wọ́’; ìfòyemọ́ nípa bí a ṣe máa sọ̀rọ̀ tàbí ohun tí a máa sọ ni a pa mọ́; a sì ṣètìlẹ́yìn ohùn àìṣe nínú δοθήσεται pẹ̀lú ‘a ó fi … fún yín.’ ‘Ní wákàtí náà’ tún ṣàfihàn ἐν ἐκείνῃ τῇ ὥρᾳ ní ìṣòtítọ́. Ṣùgbọ́n àlàyé ẹsẹ̀-ìsàlẹ̀ náà sọ ‘Ẹ̀mí Baba wọn,’ níbi tí ẹsẹ̀ 20 ti sọ ‘Ẹ̀mí Baba yín’; a gbọdọ̀ ṣàtúnṣe èyí.'
  naturalness: Yorùbá náà jẹ́ èdè òde òní, ó sì dára fún ìkìlọ̀ àti ìtùnú nínú àyíká ìrànṣẹ́. ‘Fi yín lé wọn lọ́wọ́’ jẹ́ ọ̀nà ìsọ̀rọ̀ tí ó lè ṣiṣẹ́ gẹ́gẹ́ bí ìfọwọ́sí sí aláṣẹ/àwọn ẹlòmíràn tí a kò dárúkọ. ‘Ẹ má ṣe ṣàníyàn’ sì jẹ́ ìsọ̀rọ̀ tó hàn gbangba.
  terminology: A pa ìtumọ̀ ‘fi lé lọ́wọ́,’ ‘ṣàníyàn,’ àti ‘sọ̀rọ̀’ mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọsìn tàbí ìdámọ̀ olùfún kan kún ẹsẹ̀ náà. A kò yẹ kí àlàyé náà yí ‘Baba yín’ padà sí ‘Baba wọn.’
