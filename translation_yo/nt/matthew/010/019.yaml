  rationale: A fi ọ̀rọ̀ ẹsẹ̀ náà sílẹ̀ nítorí ó fara mọ́ orísun Greek, ó sì jẹ́ Yorùbá tó bójú mu. A tún àlàyé [a] ṣe nìkan láti ṣàtúnṣe ẹni-ìní ‘Baba yín’ àti láti mú àwọn arọ́pò orúkọ inú àlàyé náà bá ìkìlọ̀ tí a ń bá ‘yín’ sọ mu.
