- from: Ṣùgbọ́n nígbà tí wọ́n bá fi yín lé wọn lọ́wọ́, ẹ má ṣe ṣàníyàn nípa bí ẹ ó ṣe sọ̀rọ̀ tàbí ohun tí ẹ ó sọ; nítorí a ó fi ohun tí ẹ ó sọ fún yín ní wákàtí náà.[a]
