id: MAT.10.19
reference: Matthew 10:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n bá fi yín lé wọn lọ́wọ́, ẹ má ṣe ṣàníyàn nípa bí ẹ ó ṣe sọ̀rọ̀ tàbí ohun tí ẹ ó sọ; nítorí a ó fi ohun tí ẹ ó sọ fún yín ní wákàtí náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà ‘a ó fi … fún yín’ kò dárúkọ ẹni tí yóò fún yín; ẹsẹ tó tẹ̀ lé e sọ pé Ẹ̀mí Baba yín ni yóò máa sọ̀rọ̀ nípasẹ̀ yín.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: ὅταν tọ́ka sí ohun ọjọ́ iwájú tí ó lè ṣẹlẹ̀, nígbà tí δέ sì jẹ́ àsopọ̀ pẹ̀lẹ́ tí ‘Ṣùgbọ́n’ fi ìyípadà ọ̀rọ̀ hàn dáadáa nínú àyíká yìí.
- source_word: παραδῶσιν ὑμᾶς
  choice: wọ́n bá fi yín lé wọn lọ́wọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ènìyàn lé ẹlòmíràn lọ́wọ́, ní pàtàkì fún ìdájọ́ tàbí ìṣàkóso; yíyan yìí jẹ́ àdánidá ní Yorùbá, kò sì fi ìtumọ̀ ‘dà’ kún un.
- source_word: μὴ μεριμνήσητε
  choice: ẹ má ṣe ṣàníyàn
  rationale: μεριμνάω níbí kìlọ̀ fún wọn pé kí wọ́n má ṣe ní àníyàn nípa ẹ̀rí tí wọn yóò jẹ́; ‘ṣàníyàn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: πῶς ἢ τί λαλήσητε
  choice: bí ẹ ó ṣe sọ̀rọ̀ tàbí ohun tí ẹ ó sọ
  rationale: Ìtumọ̀ yìí pa ìyàtọ̀ tó wà láàárín ọ̀nà tí wọn yóò gbà sọ̀rọ̀ àti ohun tí wọn yóò sọ mọ́, ó sì tú ἤ sí ‘tàbí.’
- source_word: δοθήσεται γὰρ ὑμῖν
  choice: nítorí a ó fi ... fún yín
  rationale: A lo gbólóhùn aláìlórúkọ olùṣe láti pa ohùn àìṣe Greek mọ́, kí a má bàa sọ pé Ọlọ́run tàbí Ẹ̀mí ni olùfún níbi tí ẹsẹ yìí kò ti dárúkọ rẹ̀.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ní wákàtí náà
  rationale: Yíyan náà sún mọ́ Greek, ó sì tẹnumọ́ pé ìpèsè náà yóò dé ní àkókò pàtó tí a nílò rẹ̀.
- source_word: τί λαλήσητε
  choice: ohun tí ẹ ó sọ
  rationale: Ó tún ọ̀rọ̀ ìṣáájú ṣe ní Yorùbá àdánidá, ó sì tọ́ka sí ohun tí wọn yóò sọ láìfi àlàyé míì kún un.
theological_decisions:
- issue: Olùfún tí a kò dárúkọ nínú δοθήσεται
  choice: 'Pa gbólóhùn aláìlórúkọ olùṣe mọ́: ‘a ó fi ... fún yín.’'
  alternative: ‘Ọlọ́run yóò fi fún yín’ tàbí ‘Ẹ̀mí yóò fi fún yín.’
  rationale: Greek kò dárúkọ olùfún nínú ẹsẹ yìí. Ẹsẹ tó tẹ̀ lé e ló ṣàlàyé ipa Ẹ̀mí; nítorí náà, a kò yanjú ohun tí ẹsẹ yìí fúnra rẹ̀ fi sílẹ̀ ní àìsọ pàtó.
translation_notes:
  register: Yorùbá ìwọ̀nba, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Fi yín lé wọn lọ́wọ́’ ṣe àfihàn àyíká ìmúni fún ìdájọ́ láìsọ pé ìwà ọ̀dà ni pàtó. Àmì àlàyé [a] wà nínú ọ̀rọ̀ pàtàkì.
