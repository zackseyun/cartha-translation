id: MAT.10.20
reference: Matthew 10:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: yo
  text: Nítorí kì í ṣe ẹ̀yin ni ẹ ń sọ̀rọ̀, bí kò ṣe Ẹ̀mí Baba yín tí ń sọ̀rọ̀ nínú yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ yín.” Gíríìkì ní “nínú yín,” èyí tí ó tún lè túmọ̀ sí pé Ẹ̀mí ń sọ̀rọ̀ nípasẹ̀ àwọn ọmọ-ẹ̀yìn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí kì í ṣe
  rationale: Ó pa agbára àlàyé γάρ àti ìsẹ́ οὐ mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ẹsẹ yìí mọ́ ìdánilójú tó ṣáájú.
- source_word: ὑμεῖς ... ἐστε οἱ λαλοῦντες
  choice: ẹ̀yin ni ẹ ń sọ̀rọ̀
  rationale: “Ẹ̀yin” fi ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì hàn, “ni” sì tẹnumọ́ ẹni tó ń ṣe iṣẹ́ náà; “ń sọ̀rọ̀” pa ìṣe tó ń lọ lọ́wọ́ mọ́.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó mú ìyàtọ̀ líle tó wà láàárín àwọn ọmọ-ẹ̀yìn àti Ẹ̀mí hàn ní Yorùbá àdánidá.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: Ẹ̀mí Baba yín
  rationale: Ó tọ́ka sí Ẹ̀mí Ọlọ́run, ó sì pa ìbátan tó wà nínú “Baba yín” mọ́ láìfi “ọ̀run” kún ọ̀rọ̀ orísun.
- source_word: τὸ λαλοῦν
  choice: tí ń sọ̀rọ̀
  rationale: Gbólóhùn ìbátan náà jẹ́ kó ṣe kedere pé Ẹ̀mí ni ó ń sọ̀rọ̀, ó sì pa ìṣe tí ó ń lọ lọ́wọ́ mọ́.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ fún ἐν; kò yanjú láìnídí bóyá ìtumọ̀ irinṣẹ́ “nípasẹ̀ yín” tún wà nínú ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá ἐν ὑμῖν túmọ̀ sí wíwà inú àwọn ọmọ-ẹ̀yìn tàbí sí sísọ̀rọ̀ nípasẹ̀ wọn
  choice: nínú yín
  alternative: nípasẹ̀ yín
  rationale: Ìtumọ̀ pàtàkì ἐν ni “nínú.” Àyíká ọ̀rọ̀ lè mú kí a tún lóye pé Ẹ̀mí ń sọ̀rọ̀ nípasẹ̀ wọn, ṣùgbọ́n fífi ìyẹn sínú ọ̀rọ̀ pàtàkì yóò yanjú ohun tí Gíríìkì fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin ni” láti pa ìtẹnumọ́ Gíríìkì mọ́, a sì lo “ń sọ̀rọ̀” lẹ́ẹ̀mejì láti fi ìfarajọ́ ìṣètò orísun hàn.
