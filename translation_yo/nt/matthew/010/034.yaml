id: MAT.10.34
reference: Matthew 10:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: yo
  text: Ẹ má ṣe rò pé mo wá[a] láti mú àlàáfíà wá sí ayé. Èmi kò wá láti mú àlàáfíà wá, bí kò ṣe láti mú idà wá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “mo ti wá.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “idà”; nínú àyíká rẹ̀, àwòrán yìí ń tọ́ka sí ìpínya tí wíwá Jesu yóò fa, kì í ṣe ìyìn fún ìwà ipá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Ẹ má ṣe rò
  rationale: Ọ̀rọ̀ yìí jẹ́ ìkìlọ̀ tààrà pé kí àwọn olùgbọ́ má ṣe ní èrò bẹ́ẹ̀. Fífi “Ẹ” lò bá ọ̀pọ̀ ẹni tí ọ̀rọ̀ Gíríìkì ń bá sọ mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἦλθον
  choice: mo wá
  rationale: “Mo wá” sọ aorist náà ní ṣókí, ó sì lè tọ́ka sí wíwá Jesu gẹ́gẹ́ bí iṣẹ́ tí ó wá ṣe. Yorùbá kò fi dandan yà “I came” sí ọ̀tọ̀ kúrò lọ́dọ̀ “I have come” níbí.
- source_word: βαλεῖν
  choice: láti mú ... wá
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ìpilẹ̀ rẹ̀ ni “sọ/jù,” nínú àkópọ̀ ọ̀rọ̀ yìí “mú ... wá” ló sọ ète tàbí àbájáde iṣẹ́ náà ní Yorùbá tí ó ṣe kedere, láìsọ àwòrán idà di ohun mìíràn.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: “Àlàáfíà” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún εἰρήνη nínú àyíká yìí.
- source_word: ἐπὶ τὴν γῆν
  choice: sí ayé
  rationale: Nínú gbólóhùn “mú àlàáfíà wá sí ayé,” èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí àlàáfíà dé sórí ilẹ̀ ayé lápapọ̀; kò dín γῆ kù sí ilẹ̀ agbègbè kan.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: “Bí kò ṣe” fi ìtakora líle tó wà láàárín àlàáfíà àti idà hàn ní kedere lẹ́yìn gbólóhùn àìjẹ́wọ́.
- source_word: μάχαιραν
  choice: idà
  rationale: “Idà” pa àwòrán ohun ìjà tí ọ̀rọ̀ Gíríìkì sọ mọ́. A kò rọ́pò rẹ̀ pẹ̀lú “ìpínya,” nítorí pé ìyẹn yóò tú àwòrán náà sí ìtumọ̀ kan ṣoṣo.
theological_decisions:
- issue: Bóyá kí a tú μάχαιραν sí “ìpínya” nínú ẹsẹ̀ náà
  choice: A pa “idà” mọ́ nínú ẹsẹ̀ náà
  alternative: ìpínya
  rationale: Ọ̀rọ̀ Gíríìkì sọ “idà” ní tààrà. Bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ̀ tó tẹ̀ lé e fi ipa ìpínya hàn, títúmọ̀ rẹ̀ sí “ìpínya” nínú ẹsẹ̀ yìí yóò mú àwòrán orísun àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ tó wà nínú rẹ̀ kúrò.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó ti yẹ. Àtúnsọ “mú ... wá” pa ìṣọ̀kan ìtumọ̀ βαλεῖν mọ́ fún “àlàáfíà” àti “idà,” ó sì jẹ́ kí gbólóhùn náà ye òǹkàwé lasán.
