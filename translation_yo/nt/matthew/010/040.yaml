  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tọ́ka dáadáa sí ẹ̀wọ̀n ìdánimọ̀ tó wà nínú Gíríìkì: gbígba àwọn ọmọ-ẹ̀yìn, Jésù, àti ẹni tí ó rán an. Síbẹ̀, ‘bá’ ń fi ìṣàpẹẹrẹ/ìpò àdéhùn kún un, nígbà tí participle ìsinsìnyí Gíríìkì ń sọ òtítọ́ gbogbogbòò; ‘náà’ nínú ‘èmi náà’ sì kún ìtumọ̀ ‘pẹ̀lú’ tí kò fara hàn ní ọ̀rọ̀ Gíríìkì.'
  naturalness: ‘Ẹni tí ó gba yín, ó gba mí’ jẹ́ Yorùbá boṣewa, ó sì dára ju ìlò ‘bá’ pẹ̀lú ‘èmi’ gẹ́gẹ́ bí ohun-ìṣe lọ. ‘Mí’ ni ìrísí arọ́pò-orúkọ ohun-ìṣe tí ó wúlò jù lọ níbí.
  terminology: A pa ‘gba’ mọ́ ní ìgbà mẹ́tẹ̀ẹ̀ta láti fi ìtúnṣe δέχεται hàn. ‘Ẹni tí ó rán mi’ pa ìtumọ̀ participle náà mọ́, láìsọ ẹni tí ó rán Jésù ní pàtó ju ti ìpilẹ̀ ọ̀rọ̀ lọ.
  issues:
  - severity: medium
    issue: ‘bá’ nínú ‘Ẹni tí ó bá gba’
    rationale: Ó lè jẹ́ ìtumọ̀ gbogbogbòò ní Yorùbá, ṣùgbọ́n ó ṣàfikún àwọ̀n àdéhùn/ọjọ́ iwájú tí Gíríìkì kò samisi. Relative clause aláìní ‘bá’ ń pa generic present source náà mọ́ dáadáa.
  - severity: low
    issue: ‘èmi náà’
    rationale: ‘Náà’ ṣàfikún ‘also/too’; Gíríìkì ní ἐμέ nìkan. ‘Mí’ sì jẹ́ ìlò ohun-ìṣe àdánidá jù lọ.
  - severity: low
    issue: Àlàyé akọsílẹ̀ ‘kíkí ènìyàn káàbọ̀’
    rationale: Ó lè dà bí kí ènìyàn káàbọ̀ ní ti ọ̀rọ̀ ẹnu. ‘Tẹ́wọ́ gba’ tàbí ‘ka àlejò sílẹ̀’ ṣàlàyé ìtumọ̀ δέχομαι ní àyíká ìránṣẹ́ ní kedere.
