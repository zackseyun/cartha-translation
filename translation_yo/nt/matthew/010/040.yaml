id: MAT.10.40
reference: Matthew 10:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: yo
  text: Ẹni tí ó gba yín, ó gba mí[a]; ẹni tí ó gba mí sì gba ẹni tí ó rán mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tẹ́wọ́ gba”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbà, tẹ́wọ́ gba, tàbí kí a ka ènìyàn sílẹ̀, pàápàá ní ti gbígba ìránṣẹ́ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Ẹni tí ó bá gba
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí a fi article ṣe bí orúkọ, ó sì ń tọ́ka sí ẹnikẹ́ni ní gbogbogbòò. Àtẹ̀jáde yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ ẹni kọ̀ọ̀kan mọ́.
- source_word: δέχομαι / δέχεται
  choice: gba
  rationale: ‘Gba’ lè túmọ̀ sí kí a tẹ́wọ́ gba ènìyàn, kí a gbà á sí ọ̀dọ̀ ẹni, tàbí kí a gba iṣẹ́ ìránṣẹ́ rẹ̀. Lílo ọ̀rọ̀ kan náà ní gbogbo ẹsẹ náà pa àsopọ̀ tí Gíríìkì mọ̀ọ́mọ̀ tún ṣe mọ́.
- source_word: ὑμᾶς
  choice: yín
  rationale: ‘Yín’ jẹ́ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀, ó sì fi hàn gbangba pé Jésù ń bá àwọn ọmọ-ẹ̀yìn rẹ̀ ju ẹnì kan lọ sọ̀rọ̀.
- source_word: ἐμέ
  choice: èmi / èmi náà
  rationale: Arọ́pò-orúkọ ẹni kìíní ẹyọ ni, ó ń tọ́ka sí Jésù. Fífi ‘náà’ kún àkọ́kọ́ ń jẹ́ kí ìbáṣepọ̀ ‘ó gba èmi pẹ̀lú’ ṣe kedere ní Yorùbá, láìyí ìtumọ̀ padà.
- source_word: τὸν ἀποστείλαντά με
  choice: ẹni tí ó rán mi
  rationale: Participle aorist active pẹ̀lú article náà ń ṣiṣẹ́ bí orúkọ. Ìtumọ̀ yìí jẹ́ kedere, ó sì pa ẹni náà mọ́ láìfi ‘Baba’ kún ohun tí Gíríìkì kò sọ ní tààràtà.
theological_decisions:
- issue: Ta ni ẹni tí ó rán Jésù?
  choice: ẹni tí ó rán mi
  alternative: Baba tí ó rán mi
  rationale: Àyíká àti ẹ̀kọ́ Mátíù fi Baba hàn gẹ́gẹ́ bí ẹni tí ó rán Jésù, ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí kò pe ‘Baba’ ní tààràtà. A pa ọ̀rọ̀ náà mọ́ bí ó ti wà, kí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ lè dúró láìfi àlàyé kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní ni a lò. A pa àtúnsọ ‘gba’ mọ́ láti fi hàn bí gbígba àwọn ọmọ-ẹ̀yìn ṣe so mọ́ gbígba Jésù àti ẹni tí ó rán an. Àmì ohùn kún ibi tí ó yẹ.
