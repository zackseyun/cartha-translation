id: MAT.10.11
reference: Matthew 10:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: yo
  text: 'Ìlú tàbí abúlé èyíkéyìí tí ẹ bá wọ̀, ẹ wádìí[a] ẹni tí ó yẹ[b] níbẹ̀, kí ẹ sì dúró níbẹ̀ títí ẹ ó fi kúrò.


    [a] Tàbí, “ẹ béèrè,” tàbí “ẹ ṣe ìwádìí.”


    [b] Níhìn-ín, “ẹni tí ó yẹ” lè túmọ̀ sí ẹni tí ó bójú mu láti gba àwọn tí a rán náà sílé tàbí ẹni tí yóò tẹ́wọ́ gba wọn; kò túmọ̀ sí pé ẹni náà ti fi iṣẹ́ rẹ̀ jèrè ojú rere Ọlọ́run.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ béèrè,” tàbí “ẹ ṣe ìwádìí.”
    reason: lexical_alternative
  - marker: b
    text: Níhìn-ín, “ẹni tí ó yẹ” lè túmọ̀ sí ẹni tí ó bójú mu láti gba àwọn tí a rán náà sílé tàbí ẹni tí yóò tẹ́wọ́ gba wọn; kò túmọ̀ sí pé ẹni náà ti fi iṣẹ́ rẹ̀ jèrè ojú rere Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: Ìlú tàbí abúlé èyíkéyìí tí ẹ bá wọ̀
  rationale: “Èyíkéyìí” fi àìdánimọ̀ ibi náà hàn, “wọ̀” sì pa ìtumọ̀ ìlọ-sí-inú ti εἰς/εἰσέρχομαι mọ́. “Ìlú tàbí abúlé” jẹ́ ìyàtọ̀ tó bá πόλις àti κώμη mu ní Yorùbá àkókò yìí.
- source_word: ἐξετάσατε
  choice: ẹ wádìí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ láti fi ìṣọ́ra béèrè kí wọn sì mọ ẹni tó yẹ; “ẹ wádìí” jẹ́ adayeba, ó sì lágbára ju “ẹ béèrè” nìkan lọ.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: ẹni tí ó yẹ níbẹ̀
  rationale: “Ẹni tí ó yẹ” pa ìṣírí ìwúlò tàbí ìbójúmu ti ἄξιος mọ́ láìsọ pé ẹni náà ti jèrè ìgbàlà tàbí ojú rere Ọlọ́run. “Níbẹ̀” so ẹni náà mọ́ ìlú tàbí abúlé tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: κἀκεῖ μείνατε
  choice: kí ẹ sì dúró níbẹ̀
  rationale: “Kí ẹ sì” mú καί wá, “dúró” sì jẹ́ ọ̀rọ̀ Yorùbá adayeba fún mímáa gbé tàbí wà ní ibi kan fún àkókò díẹ̀. “Níbẹ̀” kò fi ohun tí Gíríìkì kò sọ kún un, bíi sísọ pàtó pé ilé ẹni náà ni.
- source_word: ἕως ἂν ἐξέλθητε
  choice: títí ẹ ó fi kúrò
  rationale: 'Èyí sọ ààlà àkókò ọjọ́ iwájú hàn ní Yorùbá adayeba: kí wọn dúró títí di ìgbà tí wọn yóò jáde kúrò ní ibẹ̀.'
theological_decisions:
- issue: Ìtumọ̀ ἄξιος nínú àṣẹ iṣẹ́ ìránṣẹ́
  choice: ẹni tí ó yẹ
  alternative: ẹni tí ó yẹ láti gba yín sílé / ẹni rere
  rationale: “Ẹni tí ó yẹ” pa àyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́. Àyíká ọ̀rọ̀ náà tọ́ka sí ẹni tó bójú mu tàbí tó múra tán láti gba àwọn oníṣẹ́ náà, ṣùgbọ́n a kò fi ìtumọ̀ yẹn sínú ọ̀rọ̀ pàtàkì lọ́nà tí yóò pa gbogbo àìdánilójú rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú àwọn ọmọ-ẹ̀yìn tí a ń bá sọ̀rọ̀. Èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò.
