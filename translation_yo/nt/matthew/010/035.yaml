id: MAT.10.35
reference: Matthew 10:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: yo
  text: Nítorí mo wá láti mú kí ọkùnrin kan kọjú sí baba rẹ̀[a], kí ọmọbìnrin kọjú sí ìyá rẹ̀, àti kí aya ọmọ kọjú sí ìyá ọkọ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti pín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí bẹ́ẹ̀ ní tààrà, ṣùgbọ́n àwọn gbólóhùn “kọjú sí” tó tẹ̀ lé fi hàn pé ìtakora láàárín àwọn ìbátan ni a ń sọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì νύμφη lè túmọ̀ sí “ìyàwó tuntun” ní àwọn àyíká kan; níbí, ó túmọ̀ sí “aya ọmọ” nítorí pé a so ó pọ̀ mọ́ “ìyá ọkọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: mo wá
  rationale: Aorist náà tọ́ka sí wíwá àti iṣẹ́ Jésù; ‘mo wá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé tó ṣáájú, ó sì pa agbára ìdí tàbí àlàyé mọ́.
- source_word: διχάσαι
  choice: láti mú kí ... kọjú sí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pínyà tàbí mímú ìyapa wá; àwọn gbólóhùn κατά tó tẹ̀ lé fi hàn pé ìtakora láàárín àwọn ìbátan ni a ń sọ. Ìtumọ̀ yìí mú ìtakora náà ṣe kedere láì túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄνθρωπος lè túmọ̀ sí ènìyàn lápapọ̀, nínú àkójọ ìdílé yìí ó dúró lẹ́gbẹ̀ẹ́ ọmọbìnrin àti aya ọmọ; nítorí náà, ‘ọkùnrin kan’ pa ìyàtọ̀ akọ mọ́.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: kọjú sí baba rẹ̀
  rationale: κατά pẹ̀lú genitive ń fi ìtakora hàn; ‘kọjú sí’ jẹ́ ọ̀nà Yorùbá àdánidá fún dídìde sí ẹnì kan.
- source_word: θυγατέρα
  choice: ọmọbìnrin
  rationale: Ìtumọ̀ tààrà, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: kọjú sí ìyá rẹ̀
  rationale: Ó pa àtúnṣe ìtakora kan náà mọ́ gẹ́gẹ́ bí èdè Gíríìkì.
- source_word: νύμφην
  choice: aya ọmọ
  rationale: νύμφη lè jẹ́ ‘ìyàwó tuntun,’ ṣùgbọ́n fífi í lẹ́gbẹ̀ẹ́ πενθερά fi hàn pé ìbátan aya ọmọ sí ìyá ọkọ ni a túmọ̀ sí níbí.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: kọjú sí ìyá ọkọ rẹ̀
  rationale: ‘Ìyá ọkọ’ ni ọ̀rọ̀ Yorùbá àdánidá fún ìyá ọkọ aya ọmọ, ó sì pa ìtakora ìdílé náà mọ́.
theological_decisions:
- issue: Irú ipa tí wíwá Jésù ní lórí ìdílé
  choice: A túmọ̀ gbólóhùn náà gẹ́gẹ́ bí ìtakora tó ń dìde láàárín àwọn ìbátan nítorí wíwá Jésù, láì rọ starkness ọ̀rọ̀ náà.
  alternative: Kí a túmọ̀ ó ní ọ̀nà oníṣàlàyé pé inúnibíni nítorí ìfaramọ́ Jésù ló fa ìyapa náà.
  rationale: Gíríìkì sọ ní tààrà pé ó wá láti pín tàbí mú kí àwọn ọmọ ìdílé kọjú sí ara wọn. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un, bẹ́ẹ̀ ni a kò sọ pé ìṣọ̀tá ìdílé jẹ́ ohun rere tí ó ń fẹ́ fúnra rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. Àtúnṣe ‘kọjú sí’ ni a pa mọ́ lẹ́ẹ̀mẹta láti ṣàfihàn àtúnṣe κατά nínú Gíríìkì. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
