  terminology: “Ọkùnrin kan,” “ọmọbìnrin,” “aya ọmọ,” and “ìyá ọkọ rẹ̀” accurately preserve the household triad. The footnotes responsibly retain the lexical alternatives for διχάσαι and νύμφη without introducing interpretive or doctrinal claims.
