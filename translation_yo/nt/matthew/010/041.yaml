id: MAT.10.41
reference: Matthew 10:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: yo
  text: Ẹni tí ó bá gba wòlíì kan nítorí pé ó jẹ́ wòlíì[a] yóò gba èrè wòlíì; ẹni tí ó sì bá gba olódodo kan nítorí pé ó jẹ́ olódodo[b] yóò gba èrè olódodo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Gíríìkì ní, “ní orúkọ wòlíì”; ó tún lè túmọ̀ sí “gẹ́gẹ́ bí wòlíì.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, Gíríìkì ní, “ní orúkọ olódodo”; ó tún lè túmọ̀ sí “gẹ́gẹ́ bí olódodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: Ẹni tí ó bá gba
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni tí ó bá ṣe ìṣe náà ní gbogbogbòò. “Gba” lè túmọ̀ sí gbígba tàbí kíka ẹni náà sí àlejò, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: προφήτην
  choice: wòlíì kan
  rationale: “Wòlíì” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń sọ ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run; “kan” fi àìlódì sí ẹni pàtó hàn.
- source_word: εἰς ὄνομα προφήτου
  choice: nítorí pé ó jẹ́ wòlíì
  rationale: 'Èyí mú ìtumọ̀ àṣà-ọrọ Gíríìkì náà jáde lọ́nà tí ó ṣe kedere ní Yorùbá: a gba ẹni náà lórí ìdánimọ̀ tàbí ipò rẹ̀ gẹ́gẹ́ bí wòlíì. Àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gangan mọ́.'
- source_word: μισθὸν προφήτου
  choice: èrè wòlíì
  rationale: 'Ó pa àìdánilójú genitive náà mọ́: ó lè jẹ́ èrè tí wòlíì ń rí tàbí èrè tí ó yẹ fún ẹni tí ó gba wòlíì.'
- source_word: λήμψεται
  choice: yóò gba
  rationale: Ó ṣàfihàn ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ní tààrà, ó sì pa ìṣọ̀kan pẹ̀lú “gba” ní ìbẹ̀rẹ̀ mọ́.
- source_word: δίκαιον
  choice: olódodo kan
  rationale: “Olódodo” jẹ́ ọ̀rọ̀ àdánidá Yorùbá fún ẹni tí ó jẹ́ δίκαιος. Yorùbá kò fi akọ tàbí abo hàn nínú ọ̀rọ̀ náà, nítorí náà kò yẹ kí a fi “ọkùnrin” kún un láìnídí.
- source_word: εἰς ὄνομα δικαίου
  choice: nítorí pé ó jẹ́ olódodo
  rationale: Ó mú ìtumọ̀ gbígba ẹni náà nítorí ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí olódodo ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń tọ́ka sí ìṣètò gangan Gíríìkì.
- source_word: μισθὸν δικαίου
  choice: èrè olódodo
  rationale: Ó fara wé ìpín àkọ́kọ́, ó sì pa ìbáṣepọ̀ genitive náà mọ́ láì pinnu bóyá èrè tí a fi fún olódodo ni tàbí èrè tí ẹni tó gba olódodo yóò pín.
theological_decisions:
- issue: Ìtumọ̀ àṣà-ọrọ εἰς ὄνομα pẹ̀lú genitive
  choice: Lo “nítorí pé ó jẹ́” nínú ọ̀rọ̀ àkọ́kọ́, kí a sì ṣàlàyé ìtumọ̀ gangan “ní orúkọ” ní àlàyé ìsàlẹ̀ ojú ewé.
  alternative: “ní orúkọ wòlíì/olódodo” tàbí “gẹ́gẹ́ bí wòlíì/olódodo”
  rationale: “Ní orúkọ” lè ṣókùnkùn ní Yorùbá tàbí kí ó dà bí ẹni pé a ń lo orúkọ ẹni kan gẹ́gẹ́ bí àṣẹ. Àyíká ọ̀rọ̀ ń sọ nípa gbígba ẹni kan lórí ìdánimọ̀ rẹ̀; àlàyé náà sì pa ìrísí àti àìdánilójú Gíríìkì mọ́.
- issue: Akọ nínú δίκαιον / δικαίου
  choice: Lo “olódodo,” tí kò ní àmì akọ tàbí abo ní Yorùbá.
  alternative: “ọkùnrin olódodo”
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀nà akọ ẹyọ, Yorùbá ń lo “olódodo” fún ẹni láìfi akọ tàbí abo hàn. Fífi “ọkùnrin” kún un yóò fi ìtumọ̀ kan sí i tí èdè Yorùbá kò nílò.
- issue: Ìtumọ̀ μισθὸν προφήτου / δικαίου
  choice: Pa á mọ́ gẹ́gẹ́ bí “èrè wòlíì / èrè olódodo.”
  alternative: “èrè tí a fi fún wòlíì / olódodo” tàbí “èrè tí ó yẹ fún ẹni tó gba wọn”
  rationale: Genitive Gíríìkì kò sọ ìbáṣepọ̀ náà di pàtó. Ìtumọ̀ Yorùbá yìí pa ìṣòro àti ìfọ̀rọ̀wánilẹ́nuwò ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá yẹ. Ìṣètò àwọn gbolóhùn méjèèjì pa ìfarawé Gíríìkì mọ́, ṣùgbọ́n a tú àṣà-ọrọ εἰς ὄνομα sí Yorùbá àdánidá.
