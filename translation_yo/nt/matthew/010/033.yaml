id: MAT.10.33
reference: Matthew 10:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: yo
  text: Ṣùgbọ́n ẹnikẹ́ni tí ó bá sẹ́ mi níwájú àwọn ènìyàn, èmi náà yóò sẹ́ ẹni náà níwájú Bàbá mi tí ń bẹ ní ọ̀run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, “ní àwọn ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Ṣùgbọ́n ẹnikẹ́ni tí ó bá
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ẹsẹ̀ tó ṣáájú hàn; “ẹnikẹ́ni tí ó bá” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìpèníjà gbogbogbò tí ὅστις pẹ̀lú ἄν àti ọ̀rọ̀-ìṣe subjunctive ń gbé jáde.
- source_word: ἀρνήσηταί με
  choice: sẹ́ mi
  rationale: “Sẹ́” túmọ̀ sí kí ènìyàn kọ́ pé òun mọ ẹlòmíràn tàbí kí ó kọ̀ ọ́ ní gbangba; ó bá ìtumọ̀ ἀρνέομαι àti àyíká ọ̀rọ̀ yìí mu.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: níwájú àwọn ènìyàn
  rationale: “Níwájú” ń tọ́ka sí ṣíṣe ohun kan ní ojú tàbí níwájú àwọn mìíràn; “àwọn ènìyàn” jẹ́ ìtumọ̀ àdánidá fún ἀνθρώπων tó ní agbára gbogbogbò.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: èmi náà yóò sẹ́ ẹni náà
  rationale: Àtúnlò “sẹ́” pa ìbáramu ọ̀rọ̀-ìṣe méjèèjì mọ́; “èmi náà” fi ìtẹnumọ́ κἀγώ hàn, “ẹni náà” sì tọ́ka padà sí ẹnikẹ́ni náà láìfi akọ tàbí abo kún un, nítorí èdè Yorùbá kò pín arọ́pò-orúkọ báyìí.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: níwájú Baba mi
  rationale: Ó pa àjọṣe ọmọ àti Baba tí Jésù sọ mọ́, láìfikún àlàyé mìíràn.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: tí ń bẹ ní ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé οὐρανοῖς jẹ́ ọ̀pọ̀ nínú Gíríìkì, “ní ọ̀run” ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ; a tọ́ka sí ìtumọ̀ gangan nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìsẹ̀padà ìkọ̀ Jésù àti ìkọ̀ ẹni náà
  choice: sẹ́ mi ... èmi náà yóò sẹ́ ẹni náà
  alternative: kọ̀ mí ... èmi náà yóò kọ ẹni náà
  rationale: Lílo ọ̀rọ̀ kan náà fún ìṣẹ̀lẹ̀ méjèèjì pa ìbáramu tó lágbára nínú Gíríìkì mọ́, láìyanju bí ìkọ̀ yìí ṣe ní í ṣe pẹ̀lú ìdájọ́ ìkẹyìn ju ohun tí ẹsẹ̀ náà sọ lọ.
- issue: Ìtọ́kasí akọ nínú ἀνθρώπων àti αὐτόν
  choice: àwọn ènìyàn ... ẹni náà
  alternative: àwọn ọkùnrin ... ọkùnrin náà
  rationale: Nínú àyíká yìí, ἀνθρώπων ní agbára gbogbogbò, kì í ṣe àwọn ọkùnrin nìkan. Èdè Yorùbá kò sì fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni-kẹta, nítorí náà “ẹni náà” jẹ́ ìtọ́kasí tó péye sí “ẹnikẹ́ni.”
- issue: Ọ̀kan tàbí ọ̀pọ̀ fún οὐρανοῖς
  choice: ní ọ̀run
  alternative: ní àwọn ọ̀run
  rationale: “Ní ọ̀run” jẹ́ àsọyé Yorùbá àdánidá fún ibi tí Ọlọ́run wà. Àlàyé ìsàlẹ̀ pa irisi ọ̀pọ̀ inú Gíríìkì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀rọ̀ tó wọ́pọ̀, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. “Tí ń bẹ” jẹ́ ọ̀nà tó níyì díẹ̀ ṣùgbọ́n tó ṣì ṣe kedere.
