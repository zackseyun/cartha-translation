  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: yo
  text: Nítorí náà, ẹ má bẹ̀rù; ẹ ní iye ju ọ̀pọ̀ ẹyẹ ológoṣẹ́ lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ ṣe pàtàkì ju ọ̀pọ̀ ẹyẹ ológoṣẹ́ lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν
  choice: Nítorí náà, ẹ má
  rationale: οὖν fi ìyọrísí ọ̀rọ̀ tó ṣáájú hàn, μὴ sì bá àṣẹ lọ láti sọ ìfòfindè; ‘Nítorí náà, ẹ má’ mú ìsopọ̀ ọgbọ́n àti ìfòfindè náà jáde ní Yorùbá àdánidá.
- source_word: φοβεῖσθε
  choice: bẹ̀rù
  rationale: ‘Ẹ má bẹ̀rù’ ni ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún àṣẹ pé kí ẹnikan má ṣe fòyà.
- source_word: πολλῶν στρουθίων
  choice: ọ̀pọ̀ ológoṣẹ́
  rationale: στρουθίον tọ́ka sí ẹyẹ kékeré, pàápàá ológoṣẹ́, gẹ́gẹ́ bí àyíká ẹsẹ 29 ṣe fi hàn; πολλῶν sì jẹ́ ‘ọ̀pọ̀’ nínú àfiwé.
- source_word: διαφέρετε
  choice: ẹ níye lórí ju … lọ
  rationale: Nínú àyíká yìí, διαφέρω túmọ̀ sí jíjẹ́ ẹni tó níye tàbí tó ṣe pàtàkì ju ohun mìíràn lọ, kì í ṣe pé ó kàn yàtọ̀ sí i. Gbólóhùn yìí jẹ́ Yorùbá àdánidá tó pa agbára àfiwé mọ́.
- source_word: ὑμεῖς
  choice: ẹ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́ nínú Gíríìkì. ‘Ẹ’ bá ọ̀pọ̀ ẹni tí Jésù ń bá sọ̀rọ̀ mu, àfiwé tó tẹ̀ lé e sì mú ìtẹnumọ́ náà hàn láìfi ọ̀rọ̀ tí kò wọ́pọ̀ kún un.
theological_decisions:
- issue: Ìníyelórí àwọn ọmọ-ẹ̀yìn ní àfiwé pẹ̀lú ológoṣẹ́
  choice: ẹ níye lórí ju ọ̀pọ̀ ológoṣẹ́ lọ
  alternative: ẹ ṣe pàtàkì ju ọ̀pọ̀ ológoṣẹ́ lọ
  rationale: Ìtumọ̀ yìí pa àfiwé διαφέρετε mọ́, ó sì bá ọ̀rọ̀ tó ṣáájú nípa ìtọ́jú Baba mu. Kò sọ pé Ọlọ́run kò bìkítà fún àwọn ẹranko; kàkà bẹ́ẹ̀, ó tẹnu mọ́ ìníyelórí àwọn ọmọ-ẹ̀yìn sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹ’ fún ọ̀pọ̀ olùgbọ́, kì í ṣe gẹ́gẹ́ bí àmì ọ̀wọ̀ fún ẹnì kan ṣoṣo.
