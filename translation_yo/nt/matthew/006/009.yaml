id: MAT.6.9
reference: Matthew 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: yo
  text: 'Nítorí náà, báyìí ni kí ẹ máa gbàdúrà: “Baba wa tí ń bẹ ní àwọn ọ̀run[a], kí a kà orúkọ rẹ sí mímọ́[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “ní ọ̀run.” Ọ̀rọ̀ Gíríìkì náà ní “ní àwọn ọ̀run” (ọ̀pọ̀ nọ́ńbà).
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a yà orúkọ rẹ sí mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: báyìí ni
  rationale: Ó tọ́ka sí ọ̀nà tàbí àpẹẹrẹ àdúrà; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ìtọ́ni náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìtọ́ni yìí mọ́ ẹ̀kọ́ tó ṣáájú gẹ́gẹ́ bí ohun tó tẹ̀ lé e tàbí àbájáde rẹ̀.
- source_word: προσεύχεσθε ὑμεῖς
  choice: kí ẹ máa gbàdúrà
  rationale: Ó fi àṣẹ fún ọ̀pọ̀ ènìyàn hàn. Ìṣètò ‘báyìí ni kí ẹ’ tún fún olùgbọ́ ní ìtẹnumọ́ tí ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς ní.
- source_word: Πάτερ ἡμῶν
  choice: Baba wa
  rationale: Ó pa ìpè tààrà sí Baba àti arọ́pò-orúkọ àpapọ̀ ‘wa’ mọ́.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: tí ń bẹ ní àwọn ọ̀run
  rationale: Ó tú ọ̀pọ̀ nọ́ńbà τοῖς οὐρανοῖς ní tààrà, ó sì sọ ìbáṣepọ̀ gbolohun náà ní Yorùbá tó ṣe kedere.
- source_word: ἁγιασθήτω
  choice: kí a ka ... sí mímọ́
  rationale: Ó sọ ẹ̀bẹ̀ pé kí orúkọ Ọlọ́run gba ìyàsọ́tọ̀ àti ọlá tó yẹ ohun mímọ́. Àpẹẹrẹ aláìdárúkọ ‘a’ kò sọ ẹni kan pàtó di olùṣe.
- source_word: τὸ ὄνομά σου
  choice: orúkọ rẹ
  rationale: Ó tẹ̀ lé ọ̀rọ̀ orísun ní tààrà, láì rọ́pò ‘orúkọ’ pẹ̀lú àlàyé ìtumọ̀ rẹ̀.
theological_decisions:
- issue: Ọ̀nà tí a fi tú ìpè sí Baba àti gíga rẹ̀
  choice: Baba wa tí ń bẹ ní àwọn ọ̀run
  alternative: Baba wa tí ń bẹ ní ọ̀run; Baba wa ọ̀run
  rationale: Ọ̀rọ̀ Gíríìkì lo ‘àwọn ọ̀run’ ní ọ̀pọ̀ nọ́ńbà. Yíyan èyí pa ìsúnmọ́ ‘Baba’ àti gíga ‘ní àwọn ọ̀run’ mọ́ láì fi ẹ̀kọ́ míì kún un.
- issue: Ìtumọ̀ ἁγιασθήτω gẹ́gẹ́ bí ẹ̀bẹ̀ nípa ìjẹ́mímọ́ orúkọ Ọlọ́run
  choice: kí a ka orúkọ rẹ sí mímọ́
  alternative: kí orúkọ rẹ di mímọ́; kí a yà orúkọ rẹ sí mímọ́
  rationale: Yíyan yìí kò túmọ̀ sí pé orúkọ Ọlọ́run kò tíì jẹ́ mímọ́; ó béèrè pé kí a mọ̀ ọ́n, kí a sì bọ̀wọ̀ fún un gẹ́gẹ́ bí mímọ́. Ó tún pa àìsọ ẹni tó ṣe iṣẹ́ náà ní pàtó mọ́ dé ìwọ̀n tí èdè Yorùbá gbà.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Báyìí ni kí ẹ máa gbàdúrà’ jẹ́ àṣẹ tó rọrùn fún òǹkàwé òde òní; ‘àwọn ọ̀run’ sì mọ̀ọ́mọ̀ pa ọ̀pọ̀ nọ́ńbà inú orísun mọ́.
