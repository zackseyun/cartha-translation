  naturalness: “Níbi tí … níbẹ̀ ni … náà yóò wà” jẹ́ àgbékalẹ̀ Yorùbá òde-òní tó rọrùn, tó sì mọ́ gẹ́gẹ́ bí àfiwé ibi. “Níbẹ̀” tún jẹ́ ìdáhùn ibi tó bá “níbi tí” mu.
