id: MAT.6.21
reference: Matthew 6:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: yo
  text: Nítorí níbi tí ìṣúra rẹ wà, níbẹ̀ ni ọkàn rẹ náà yóò wà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn kan lè túmọ̀ ọ́ pé, “Nítorí níbi tí ìṣúra rẹ wà, níbẹ̀ ni ọkàn rẹ náà wà.” Ṣùgbọ́n ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ti ọjọ́ iwájú: “yóò wà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ibi tí
  rationale: Ó ṣe àgbékalẹ̀ gbólóhùn tó ń tọ́ka sí ibi; “ibi tí” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì bá “ibẹ̀” mu.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ẹ̀kọ́ tó ṣáájú nípa kíkó ìṣúra jọ.
- source_word: θησαυρός
  choice: ìṣúra
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ọrọ̀ olówó iyebíye àti agbára àpẹẹrẹ rẹ̀ mọ́ láì dín ìtumọ̀ náà kù.
- source_word: σου
  choice: rẹ
  rationale: Ó fi ìní ẹni kejì ẹyọ hàn lọ́nà àdánidá ní Yorùbá, fún “ìṣúra” àti “ọkàn.”
- source_word: ἐκεῖ
  choice: ibẹ̀
  rationale: Ó bá “ibi tí” ṣe ìbáramu, ó sì pa ìṣọ̀kan ṣókí ti èdè Gíríìkì mọ́.
- source_word: ἔσται
  choice: yóò wà
  rationale: Ó pa àkókò ọjọ́ iwájú tí ọ̀rọ̀-ìṣe Gíríìkì ní mọ́, dípò yíyí i sí ọ̀rọ̀ òde-òní.
- source_word: καρδία
  choice: ọkàn
  rationale: “Ọkàn” ni ìtumọ̀ tó fìdí múlẹ̀, tó sì lè gba èrò, ìfẹ́, ìfaramọ́, àti ìdarí inú ènìyàn.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ní ipò yìí, “pẹ̀lú” sọ ìtumọ̀ àfikún “náà/also” lọ́nà tó rọrùn, ó sì so ọkàn mọ́ ibi tí ìṣúra wà.
theological_decisions:
- issue: Agbára àkókò ọjọ́ iwájú nínú ἔσται nínú ọ̀rọ̀ ọgbọ́n
  choice: 'Pa ọjọ́ iwájú mọ́: “yóò wà”'
  alternative: 'Lo òde-òní: “wà” gẹ́gẹ́ bí òtítọ́ tí kò ní àkókò kan pàtó'
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ti ọjọ́ iwájú. Pípa èyí mọ́ kò jẹ́ kí ọ̀rọ̀ náà di àpèjúwe ipò tí kò yí padà nìkan; ó tún fi ìdarí hàn pé ọkàn ènìyàn yóò tẹ̀ lé ibi tí ó fi ìṣúra rẹ̀ sí, láì fi ẹ̀kọ́ ẹ̀sìn kan tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Àkójọpọ̀ “ibi tí … ibẹ̀” pa ìbáramu àti ìṣọ̀kan orísun mọ́.
