id: MAT.6.32
reference: Matthew 6:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: yo
  text: Nítorí gbogbo nǹkan wọ̀nyí ni àwọn orílẹ̀-èdè[a] ń fi taratara wá[b]; nítorí Baba yín ti ọ̀run mọ̀ pé ẹ nílò gbogbo nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn Kèfèrí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn orílẹ̀-èdè” lápapọ̀; ṣùgbọ́n ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí ó tọ́ka sí àwọn tí kì í ṣe Júù.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ń wá” tàbí “ń lépa.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi wíwá ohun kan tọkàntọkàn tàbí láìdáwọ́ dúró hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: àwọn ènìyàn orílẹ̀-èdè mìíràn
  rationale: Ọ̀rọ̀ yìí fi àwọn tí kì í ṣe Júù hàn nínú àyíká ọ̀rọ̀ yìí, láìlo ‘Kèfèrí,’ èyí tí ó lè ní ìtumọ̀ ẹ̀gàn nínú Yorùbá òde òní. Ó tún pa ìbáṣepọ̀ rẹ̀ mọ́ ‘àwọn orílẹ̀-èdè.’
- source_word: ἐπιζητοῦσιν
  choice: ń fi taratara wá
  rationale: ‘Fi taratara wá’ sọ ìwá kiri tí ó jinlẹ̀ tàbí tí ó tẹ̀síwájú, èyí tí ọ̀rọ̀ Gíríìkì lè ní, ní Yorùbá àdánidá.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yín ọ̀run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣókí, tí ó sì mọ́gbọ́n dání láti sọ ‘Baba yín ti ọ̀run,’ nígbà tí ó ń pa ìní ‘yín’ àti àpèjúwe ọ̀run mọ́.
- source_word: οἶδεν
  choice: mọ̀
  rationale: Bó tilẹ̀ jẹ́ pé ìrísí ọ̀rọ̀ Gíríìkì jẹ́ perfect, ó ní ìtumọ̀ àkókò ìsinsìnyí níbí; ‘mọ̀’ ni ìtumọ̀ Yorùbá tí ó péye.
- source_word: χρῄζετε
  choice: ẹ nílò
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá òde òní tí ó ṣe kedere, ó sì túmọ̀ sí pé ohun náà ṣe pàtàkì fún wọn.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: gbogbo nǹkan wọ̀nyí ... gbogbo nǹkan wọ̀nyí
  rationale: A pa àtúnwí inú Gíríìkì mọ́ nítorí ìtẹnumọ́ rẹ̀.
- source_word: γὰρ ... γὰρ
  choice: Nítorí ... nítorí
  rationale: A pa ìsopọ̀ àlàyé méjèèjì mọ́, gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
theological_decisions:
- issue: Ohun tí τὰ ἔθνη ń tọ́ka sí nínú ẹ̀kọ́ Jésù
  choice: àwọn ènìyàn orílẹ̀-èdè mìíràn
  alternative: àwọn orílẹ̀-èdè; àwọn Kèfèrí
  rationale: Nínú àyíká ọ̀rọ̀ náà, ó ṣeé ṣe kí ó tọ́ka sí àwọn tí wọ́n wà lẹ́yìn ààlà àwọn ènìyàn májẹ̀mú, ní ìyàtọ̀ sí àwọn ọmọ-ẹ̀yìn Jésù. Ìtumọ̀ yìí pa ìyàtọ̀ ìtàn náà mọ́ láìfi ìdájọ́ ẹ̀sìn tàbí ẹ̀gàn kún un.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ohùn ọ̀rọ̀ náà jẹ́ adayeba, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A yẹra fún ‘Kèfèrí’ nínú ẹsẹ̀ pàtàkì nítorí ó lè dun bí ẹ̀gàn lónìí, ṣùgbọ́n a fi sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn ìtumọ̀.
