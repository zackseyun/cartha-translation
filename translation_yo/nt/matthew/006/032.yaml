  - severity: low
    issue: ‘àwọn ènìyàn orílẹ̀-èdè mìíràn’
    rationale: Ó ṣàfikún ‘ènìyàn’ àti ‘mìíràn,’ ó sì lè túmọ̀ sí àwọn ènìyàn ilẹ̀ mìíràn ní ìyàtọ̀ sí olùgbọ́ ní gbogbogbò, dípò kí ó pa τὰ ἔθνη mọ́ ní ṣókí. ‘Àwọn orílẹ̀-èdè’ dáa síi; àlàyé ìsàlẹ̀ lè ṣàlàyé ìtókasí àyíká.
  - severity: low
    issue: Gbolohun ‘lẹ́yìn ààlà àwọn ènìyàn májẹ̀mú’ nínú àlàyé a
    rationale: ‘Lẹ́yìn ààlà’ kò dáa ní Yorùbá nínú ìtumọ̀ àfiwé yìí. ‘Àwọn tí kì í ṣe Júù’ tàbí ‘àwọn tí ó wà níta àwọn ènìyàn májẹ̀mú’ ṣe kedere síi.
