  to: Nítorí gbogbo nǹkan wọ̀nyí ni àwọn orílẹ̀-èdè[a] ń fi taratara wá[b]; nítorí Baba yín ti ọ̀run mọ̀ pé ẹ nílò gbogbo nǹkan wọ̀nyí.
  rationale: Àtúnṣe náà ṣàtúnṣe ìpè ‘Baba yín ti ọ̀run’ kí ó lè jẹ́ Yorùbá boṣewa tí ó sì bá Gíríìkì mu. Ó tún rọ́pò ìtumọ̀ gígùn ‘àwọn ènìyàn orílẹ̀-èdè mìíràn’ pẹ̀lú ‘àwọn orílẹ̀-èdè,’ èyí tí ó sún mọ́ τὰ ἔθνη, tí ó sì pa àìdájú ìtókasí ọ̀rọ̀ náà mọ́. A tún ṣe àlàyé ìsàlẹ̀ náà ní Yorùbá tí ó dáa síi, láìsọ ìtumọ̀ àyíká kan di dandan.
