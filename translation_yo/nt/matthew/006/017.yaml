id: MAT.6.17
reference: Matthew 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: yo
  text: Ṣùgbọ́n ìwọ, nígbà tí o bá ń gbààwẹ̀, fi òróró sí orí rẹ[a], kí o sì fọ ojú rẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “fi òróró kun orí rẹ.” Ó lè tọ́ka sí fífi òróró sí ara gẹ́gẹ́ bí ara ìtọ́jú ìrísí ẹni ojoojúmọ́.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, máa pa ìrísí rẹ mọ́ bí ó ti ṣe máa ń rí, dípò kí o jẹ́ kí àwọn ẹlòmíràn mọ̀ nípa ìrísí rẹ pé o ń gbààwẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ṣùgbọ́n ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a tẹnumọ́ pẹ̀lú δέ fi ìyàtọ̀ hàn láàárín ọmọ-ẹ̀yìn náà àti àwọn alágàbàgebè tí a mẹ́nu kàn ṣáájú.
- source_word: νηστεύων
  choice: nígbà tí o bá ń gbààwẹ̀
  rationale: Ọ̀rọ̀ participle náà ń tọ́ka sí àkókò; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì fi hàn pé ìtọ́ni náà kan ẹni tó ń gbààwẹ̀.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: fi òróró sí orí rẹ
  rationale: Nínú àyíká yìí, ἀλείφω ń tọ́ka sí fífi òróró sí ara gẹ́gẹ́ bí ìtọ́jú ara ojoojúmọ́. Àṣàyàn yìí yẹra fún fífi ìtumọ̀ ìlànà ẹ̀sìn kan lé ọ̀rọ̀ náà lórí.
- source_word: καὶ
  choice: kí o sì
  rationale: Ó so àwọn àṣẹ méjèèjì pọ̀ lọ́nà tí ó bá èdè Yorùbá mu.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: kí o sì fọ ojú rẹ
  rationale: νίπτω túmọ̀ sí fífọ́ apá kan ara, πρόσωπον sì ń tọ́ka sí ojú ẹni; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ ti èdè òde òní.
theological_decisions:
- issue: Irú ìtọ́ni tí fífi òróró sí orí àti fífọ ojú jẹ́ nígbà ààwẹ̀
  choice: Jésù ń sọ pé kí ẹni tó ń gbààwẹ̀ máa tọ́jú ìrísí rẹ̀ bí ó ti ṣe máa ń ṣe, dípò kí ó mọ̀ọ́mọ̀ fi ààwẹ̀ rẹ̀ hàn sí àwọn ènìyàn.
  alternative: Ó lè jẹ́ pé fífi òróró sí orí gẹ́gẹ́ bí ìṣe àṣà tàbí ìlànà pàtó kan ni a ń pa láṣẹ.
  rationale: Àyíká ọ̀rọ̀ náà fi ìtọ́ni yìí ṣe òdìkejì bí àwọn alágàbàgebè ṣe ń ba ojú wọn jẹ́ kí àwọn ènìyàn lè rí i pé wọ́n ń gbààwẹ̀. Bí ó tilẹ̀ jẹ́ pé fífi òróró sí ara ní ìtumọ̀ àṣà, ẹsẹ yìí fúnra rẹ̀ kò sọ pé ó jẹ́ ìlànà ẹ̀sìn.
translation_notes:
  register: A lo èdè Yorùbá boṣewa tó lọ́wọ́lọ́wọ́, tó ní ọlá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. “Fi òróró sí orí rẹ” dá ìtumọ̀ ìtọ́jú ara ojoojúmọ́ pamọ́ láìsọ ọ́ di ìlànà ẹ̀sìn.
