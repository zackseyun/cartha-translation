id: MAT.6.18
reference: Matthew 6:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: yo
  text: kí o má bàa hàn sí àwọn ènìyàn bí ẹni tí ń gbààwẹ̀, bí kò ṣe sí Baba rẹ̀ tí ó wà ní ìkọ̀kọ̀[a]; Baba rẹ̀ tí ń rí ní ìkọ̀kọ̀ yóò sì san ẹ̀san fún ọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “ní ibi ìkọ̀kọ̀.” Ọ̀rọ̀ Gíríìkì kan náà tún wà nínú “tí ń rí ní ìkọ̀kọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μὴ φανῇς
  choice: kí o má bàa hàn
  rationale: Ó fi ète hàn, ó sì pa ìtumọ̀ pé kí ẹni náà má ṣe fara hàn ní gbangba mọ́, láì sọ ọ́ di àṣẹ tuntun.
- source_word: τοῖς ἀνθρώποις
  choice: sí àwọn ènìyàn
  rationale: ἄνθρωποι níbí ń tọ́ka sí gbogbo àwọn olùwòran, kì í ṣe àwọn ọkùnrin nìkan; “àwọn ènìyàn” ni ọ̀rọ̀ Yorùbá tó péye, tó sì ṣeé lóye.
- source_word: νηστεύων
  choice: bí ẹni tí ń gbààwẹ̀
  rationale: Gbólóhùn yìí sọ ipò tí ẹni náà fẹ́ kí ó hàn sí àwọn ẹlòmíràn; ìtumọ̀ yìí bá ìṣètò èdè Yorùbá mu láì fi àfikún ẹ̀kọ́ kankan sí i.
- source_word: τῷ πατρί σου
  choice: sí Baba rẹ
  rationale: Ó pa ìfarawé dative mọ́ láàárín “sí àwọn ènìyàn” àti “sí Baba rẹ,” èyí sì mú ìtakora inú ẹsẹ náà ṣe kedere.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: tí ó wà ní ìkọ̀kọ̀
  rationale: “Ní ìkọ̀kọ̀” lè tọ́ka sí ipò àìfarahàn tàbí ibi ìkọ̀kọ̀, ó sì yàgò fún ṣíṣe àlàyé tó ju ohun tí Gíríìkì sọ lọ.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: tí ó ń ríran ní ìkọ̀kọ̀
  rationale: A pa àtúnlò ἐν τῷ κρυφαίῳ mọ́, a kò sì fi ohun tí Baba rí kún ọ̀rọ̀ orísun.
- source_word: ἀποδώσει σοι
  choice: yóò san ẹ̀san fún ọ
  rationale: Ní àyíká ọ̀rọ̀ ìfọkànsìn àti ìdáhùn Ọlọ́run, “san ẹ̀san” sọ ìtumọ̀ ìsanpadà rere náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ta ni τοῖς ἀνθρώποις ń tọ́ka sí?
  choice: àwọn ènìyàn lápapọ̀
  alternative: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ náà jẹ́ masculine plural ní Gíríìkì, ṣùgbọ́n ní àyíká yìí ó ń tọ́ka sí àwọn olùwòran ènìyàn gbogbo, kì í ṣe akọ nìkan.
- issue: Ìtumọ̀ κρυφαίῳ ní ìṣẹ̀lẹ̀ méjèèjì
  choice: ní ìkọ̀kọ̀
  alternative: ní ibi ìkọ̀kọ̀
  rationale: Lílo ọ̀rọ̀ kan náà ní ìṣẹ̀lẹ̀ méjèèjì pa ìsopọ̀ ọ̀rọ̀ orísun mọ́ láàárín ìfarapamọ́ Baba àti rírí rẹ̀, láì sọ di dandan pé ibi pàtó kan ni.
- issue: Ìtumọ̀ ἀποδώσει
  choice: yóò san ẹ̀san fún ọ
  alternative: yóò san án padà fún ọ
  rationale: “San ẹ̀san” bá àyíká ìṣe ìfọkànsìn mu, ṣùgbọ́n kò sọ irú tàbí àkókò ẹ̀san náà ní pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọ “Baba” jẹ́ ọlọ́lá, gbólóhùn náà sì jẹ́ ti òde òní tí àwọn òǹkàwé gbogbo lè lóye.
