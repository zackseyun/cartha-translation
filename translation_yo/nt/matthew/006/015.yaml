id: MAT.6.15
reference: Matthew 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ kò bá dárí àwọn ènìyàn jì, Baba yín náà kì yóò dárí àwọn ìrékọjá yín jì yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀ṣẹ̀” tàbí “àwọn àṣìṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Ṣùgbọ́n bí ... kò bá
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ẹsẹ tó ṣáájú hàn; ìṣètò “bí ... kò bá” sì jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn oníṣ شرط tí a sẹ́.
- source_word: ἀφῆτε
  choice: dárí ... jì
  rationale: Nínú ọ̀rọ̀ nípa ohun tí ènìyàn ṣe sí ẹlòmíràn, ἀφίημι túmọ̀ sí fífi ẹ̀ṣẹ̀ tàbí ìṣìnà ẹni jì í; “dárí ... jì” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: ἄνθρωποι tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan. “Àwọn ènìyàn” pa ìtumọ̀ orúkọ Gíríìkì mọ́ láì sọ ọ́ di “àwọn ẹlòmíràn.”
- source_word: οὐδὲ
  choice: náà kì yóò
  rationale: '“Náà” pẹ̀lú ìsẹ́ “kì yóò” fi ìbáramu odi hàn: bí ẹ̀yin kò bá ṣe bẹ́ẹ̀, Baba yín náà kì yóò ṣe bẹ́ẹ̀.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: Baba yín
  rationale: Èdè Gíríìkì sọ “Baba yín” nìkan; a kò fi “tó wà ní ọ̀run” kún un.
- source_word: ἀφήσει
  choice: dárí ... jì
  rationale: A tún lo ọ̀rọ̀ kan náà gẹ́gẹ́ bí ìfarahàn àkọ́kọ́ ti ἀφίημι, kí ìbáramu inú ẹsẹ náà má bàjẹ́.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: àwọn ìrékọjá yín
  rationale: παραπτώματα jẹ́ àwọn ìṣìnà tàbí ìṣe tí ó ré ààlà ohun tó tọ́ kọjá. “Àwọn ìrékọjá yín” pa ìwúwo ìwà búburú àti àwòrán rékọjá mọ́, láì sọ ọ́ di àṣìṣe kékeré.
theological_decisions:
- issue: Ìbáṣepọ̀ oníṣ شرط láàárín dídárí ji ènìyàn àti dídárí ji Ọlọ́run
  choice: 'A pa gbólóhùn oníṣ شرط náà mọ́ ní tààràtà: bí ẹ̀yin kò bá dárí jì, Baba yín náà kì yóò dárí jì.'
  alternative: Kí a tú u sí àmì ẹ̀rí pé a ti rí ìdáríjì gbà, tàbí sí pípàdánù ìbákẹ́gbẹ́ nìkan.
  rationale: Èdè Gíríìkì fi ìbáṣepọ̀ oníṣ شرط hàn ní tààràtà. Ìtumọ̀ kò gbọ́dọ̀ rọ ọ́ tàbí yanjú ìjàmọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà fi sílẹ̀.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àmì ohùn wà níbi tí wọ́n ti jẹ́ ti àdánidá. Ìtẹ̀sí “dárí ... jì” jẹ́ ti Yorùbá àdánidá, ó sì jẹ́ kí àtúnlò ἀφίημι méjèèjì hàn.
