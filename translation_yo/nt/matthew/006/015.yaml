    issue: Unnecessary emphatic pronoun in the protasis
    rationale: Greek plural morphology does not require an overtly emphatic “ẹ̀yin.” “Bí ẹ kò bá” is more natural while retaining the plural addressees.
  - severity: medium
    issue: Footnote’s final lexical alternative is awkward Yoruba
    rationale: “Àwọn ohun tí ẹ fi ṣẹ̀” is neither an idiomatic nominal alternative nor a close parallel to παραπτώματα. It should be replaced with established lexical alternatives such as “àwọn ẹ̀ṣẹ̀” and “àwọn àṣìṣe.”
  revised_text: Ṣùgbọ́n bí ẹ kò bá dárí àwọn ènìyàn jì, Baba yín náà kì yóò dárí àwọn ìrékọjá yín jì yín.[a]
