id: MAT.6.5
reference: Matthew 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: yo
  text: Nígbàkigbà tí ẹ bá ń gbàdúrà, ẹ kò gbọdọ̀ dàbí àwọn àgàbàgebè, nítorí wọ́n fẹ́ràn láti dúró gbàdúrà nínú àwọn sínágọ́gù àti ní àwọn igun òpópónà fífẹ̀[a], kí àwọn ènìyàn lè rí wọn. Lóòótọ́ ni mo wí fún yín, wọ́n ti gba èrè wọn ní kíkún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí: “ní àwọn igun òpópónà.” Ní tààràtà, Gíríìkì sọ pé: “ní àwọn igun àwọn òpópónà fífẹ̀.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí: “wọ́n ní èrè wọn.” Nínú èdè ìṣòwò, ọ̀rọ̀-ìṣe náà lè túmọ̀ sí pé wọ́n ti gba ohun tí ó tọ́ sí wọn ní kíkún.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: Nígbàkigbà tí ẹ bá ń gbàdúrà
  rationale: “Nígbàkigbà” àti ìlànà “tí ẹ bá” fi hàn pé ọ̀rọ̀ náà kan gbogbo ìgbà tí wọ́n bá ń gbàdúrà, kì í ṣe ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo.
- source_word: οὐκ ἔσεσθε ὡς
  choice: ẹ kò gbọdọ̀ dàbí
  rationale: Èyí sọ agbára ìkìlọ̀ àti àṣẹ inú ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ní Yorùbá àdánidá.
- source_word: ὑποκριταί
  choice: àwọn alágàbàgebè
  rationale: Ọ̀rọ̀ Yorùbá yìí tọ́ka sí àwọn tí ìwà òde wọn kò bá ohun tí ó wà lọ́kàn wọn mu, ó sì bá ìṣe ìfihàn ẹ̀sìn inú àyíká yìí mu.
- source_word: φιλοῦσιν
  choice: wọ́n fẹ́ràn
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́ pé inú wọn dùn sí ìṣe ìfihàn gbangba náà.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nínú àwọn sínágọ́gù
  rationale: Ó pa ibi ìjọsìn Júù tí ọ̀rọ̀ náà tọ́ka sí mọ́ dípò yíyí i padà sí ‘ibi ìpàdé’ lásán.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: ní àwọn igun òpópónà gbangba
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi tí òpópónà ńlá tàbí fífẹ̀ ti hàn sí gbogbo ènìyàn.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: láti dúró gbàdúrà
  rationale: 'Ó tẹ̀lé ìṣètò ìṣe méjèèjì nínú Gíríìkì: dúró, kí wọ́n sì gbàdúrà.'
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: kí àwọn ènìyàn lè rí wọn
  rationale: Ó sọ ète ìṣe wọn ní kedere, ‘àwọn ènìyàn’ sì jẹ́ ọ̀rọ̀ àpapọ̀ tí kò mọ sí akọ nìkan.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Ó pa ìjẹ́rìí pàtàkì àti ohùn ọ̀wọ̀ gbolohun Jesu mọ́ ní Yorùbá tí ó ṣe déédéé.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: wọ́n ti gba èrè wọn ní kíkún
  rationale: '“Ní kíkún” mú ìtumọ̀ ọ̀rọ̀ ìṣòwò ἀπέχουσι jáde: wọ́n ti gba gbogbo ohun tí a ó san fún wọn, kò sì sí ohun mìíràn tí ó kù.'
theological_decisions:
- issue: Agbára ìkìlọ̀ Jesu nínú οὐκ ἔσεσθε ὡς
  choice: ẹ kò gbọdọ̀ dàbí
  alternative: ẹ kì yóò dàbí
  rationale: Àṣàyàn náà mú agbára ìdènà inú ọ̀rọ̀ ọjọ́ iwájú Gíríìkì hàn láì sọ pé Jesu ń sọ àsọtẹ́lẹ̀ nípa ohun tí yóò ṣẹlẹ̀.
- issue: Ìtumọ̀ ἀπέχουσι nípa èrè
  choice: wọ́n ti gba èrè wọn ní kíkún
  alternative: wọ́n ti gba èrè wọn
  rationale: Ọ̀rọ̀ náà lè jẹ́ ọ̀rọ̀ ìṣòwò fún gbígba owó tàbí èrè tán pátápátá. Èyí pa kókó ìkìlọ̀ mọ́ pé ìyìn ènìyàn ni gbogbo èrè tí wọ́n ń wá tí wọ́n sì ti rí gbà, láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba; a lo ọ̀rọ̀ ìtàn-ìsìn “sínágọ́gù” láti pa àyíká Júù mọ́.
