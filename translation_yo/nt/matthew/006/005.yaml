revisions:
- from: Nígbàkigbà tí ẹ bá ń gbàdúrà, ẹ kò gbọdọ̀ dàbí àwọn alágàbàgebè, nítorí wọ́n fẹ́ràn láti dúró gbàdúrà nínú àwọn sínágọ́gù àti ní àwọn igun òpópónà gbangba[a], kí àwọn ènìyàn lè rí wọn. Lóòótọ́ ni mo wí fún yín, wọ́n ti gba èrè wọn ní kíkún[b].
  to: Nígbàkigbà tí ẹ bá ń gbàdúrà, ẹ kò gbọdọ̀ dàbí àwọn àgàbàgebè, nítorí wọ́n fẹ́ràn láti dúró gbàdúrà nínú àwọn sínágọ́gù àti ní àwọn igun òpópónà fífẹ̀[a], kí àwọn ènìyàn lè rí wọn. Lóòótọ́ ni mo wí fún yín, wọ́n ti gba èrè wọn ní kíkún[b].
  rationale: 'The revision makes two limited lexical improvements: it uses the conventional Yoruba biblical term “àgàbàgebè” and replaces “gbangba” with “fífẹ̀” to retain the specific sense of broad streets. The clause order, purpose clause, generic reference to people, solemn saying, and the commercially nuanced ‘received ... in full’ remain faithful to the Greek.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the repeated setting of prayer, the prohibitive warning, the hypocrites’ desire to pray standing in synagogues and at conspicuous street corners, their purpose of being seen by people, and the solemn assurance that they have already received their reward. “Ní kíkún” is a defensible contextual expression of ἀπέχουσι in its commercial ‘received in full’ sense, and its explanatory footnote appropriately identifies that nuance.
  naturalness: Most of the Yoruba is clear and suitable for public reading. However, “àwọn àgàbàgebè” is the more established and natural standard Yoruba designation for ‘hypocrites’ than “àwọn alágàbàgebè.” Also, “òpópónà fífẹ̀” more directly and naturally represents πλατεῖαι (‘broad streets’) than “òpópónà gbangba,” which can instead suggest public streets.
  terminology: Retain “sínágọ́gù” for the historically Jewish setting, “àgàbàgebè” for hypocrites, and “èrè” for reward. “Àwọn ènìyàn” correctly renders the generic human observers without restricting the sense to males.
  issues:
  - severity: medium
    issue: The main text uses “àwọn alágàbàgebè.”
    rationale: “Àwọn àgàbàgebè” is the established, more idiomatic standard Yoruba noun for ‘hypocrites’ and better fits formal biblical register.
  - severity: low
    issue: The main text renders πλατειῶν as “òpópónà gbangba.”
    rationale: “Gbangba” can mean public or open; “fífẹ̀” directly preserves the source sense of broad/wide streets and aligns with the existing footnote.
  revised_text: Nígbàkigbà tí ẹ bá ń gbàdúrà, ẹ kò gbọdọ̀ dàbí àwọn àgàbàgebè, nítorí wọ́n fẹ́ràn láti dúró gbàdúrà nínú àwọn sínágọ́gù àti ní àwọn igun òpópónà fífẹ̀[a], kí àwọn ènìyàn lè rí wọn. Lóòótọ́ ni mo wí fún yín, wọ́n ti gba èrè wọn ní kíkún[b].
