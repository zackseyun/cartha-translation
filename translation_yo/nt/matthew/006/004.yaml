  source_fidelity: Ìtumọ̀ náà pa ète ὅπως ᾖ mọ́ pẹ̀lú “kí ... lè wà,” ó sì fi ἐλεημοσύνη hàn gẹ́gẹ́ bí ìtọrẹ tí a ṣe fún àwọn tálákà, kì í ṣe iṣẹ́ ìfẹ́-rere lápapọ̀. Àtúnsọ “ní ìkọ̀kọ̀” ní apá méjèèjì bá ìtẹnumọ́ Gíríìkì náà mu. “Baba rẹ tí ó sì ń rí ní ìkọ̀kọ̀” jẹ́ ìtumọ̀ tó yẹ fún ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ, láìfi “ti ọ̀run” tàbí ohun mìíràn kún un. “Yóò san èrè fún ọ” tọ́ka dáadáa sí ἀποδώσει σοι, láìpinnu irú èrè náà.
  naturalness: Yorùbá náà jẹ́ boṣewa, ó sì rọrùn láti ka. “Ìtọrẹ rẹ fún àwọn tálákà,” “ní ìkọ̀kọ̀,” àti “san èrè fún ọ” jẹ́ ọ̀nà ìsọ̀rọ̀ tó ṣeé lóye nínú ìforúkọsílẹ̀ ìwé mímọ́ òde òní. Àmì ohùn wà níbi tó ṣe pàtàkì.
  terminology: “Ìtọrẹ ... fún àwọn tálákà” ṣàlàyé ìtumọ̀ àánú/fífúnni fún aláìní tí ἐλεημοσύνη ní. “Baba rẹ” ń pa ọ̀rọ̀ orísun mọ́. “Èrè” nínú “san èrè” ń ṣàfihàn ìsanpadà rere, ṣùgbọ́n kò dá ẹ̀kọ́ kan lórí irú, àkókò, tàbí ọ̀nà ìsanpadà Ọlọ́run.
