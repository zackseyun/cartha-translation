id: MAT.6.4
reference: Matthew 6:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: yo
  text: kí ìtọrẹ rẹ fún àwọn tálákà lè wà ní ìkọ̀kọ̀[a]; Baba rẹ tí ó sì ń rí ní ìkọ̀kọ̀ yóò san èrè fún ọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọrẹ àánú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí ohun tí a fi fún àwọn tálákà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “yóò san án padà fún ọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: kí ... lè wà
  rationale: Ọ̀nà yìí fi ète tí ὅπως àti ọ̀rọ̀-ìṣe abẹ́ ᾖ ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: ἐλεημοσύνη
  choice: ìtọrẹ ... fún àwọn tálákà
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífún àwọn aláìní ní pàtó, kì í ṣe àánú tàbí iṣẹ́ rere lápapọ̀.
- source_word: ἐν τῷ κρυπτῷ
  choice: ní ìkọ̀kọ̀
  rationale: Ó sọ pé ohun náà farasin kúrò ní ojú àwọn ènìyàn; títún gbólóhùn náà sọ ní apá méjèèjì pa ìtẹnumọ́ orísun mọ́.
- source_word: ὁ πατήρ σου
  choice: Baba rẹ
  rationale: Orísun sọ ‘Baba rẹ’ láìfi ‘ọ̀run’ kún un; a kò ṣàfikún ọ̀rọ̀ láti àwọn ẹsẹ tó yí i ká.
- source_word: ὁ βλέπων
  choice: tí ó ń rí
  rationale: Ó mú participle náà jáde gẹ́gẹ́ bí gbólóhùn ìbátan tó bá Yorùbá mu, ó sì pa ìtumọ̀ ìríran tí ń bá a lọ mọ́.
- source_word: ἀποδώσει σοι
  choice: yóò san èrè fún ọ
  rationale: Nínú àyíká yìí, gbólóhùn náà tọ́ka sí ìdáhùn rere Ọlọ́run; ‘san èrè’ jẹ́ Yorùbá tó ṣe kedere láìsọ irú èrè náà.
theological_decisions:
- issue: Irú ìsanpadà Ọlọ́run nínú ἀποδώσει
  choice: yóò san èrè fún ọ
  alternative: yóò san án padà fún ọ
  rationale: ‘San èrè’ fi ìdáhùn rere Ọlọ́run hàn, ṣùgbọ́n kò pinnu bóyá èrè náà jẹ́ ti ayé yìí, ti ayérayé, ti ara, tàbí ti ẹ̀mí. Àṣàyàn ‘san án padà’ pa ìtumọ̀ ìsanpadà tó sún mọ́ fọ́ọ̀mù ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní. A tún ‘ní ìkọ̀kọ̀’ sọ láti pa àtúnwí orísun mọ́.
