id: MAT.6.28
reference: Matthew 6:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: yo
  text: 'Kí nìdí sì ni ẹ fi ń ṣàníyàn nípa aṣọ? Ẹ kíyè sí àwọn lílì inú oko[a], bí wọ́n ti ń dàgbà: wọn kì í ṣe làálàá, bẹ́ẹ̀ ni wọn kì í rán òwú.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn òdòdó igbó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: nípa aṣọ
  rationale: ἔνδυμα tọ́ka sí aṣọ gẹ́gẹ́ bí ohun tí ènìyàn fi ń wọ̀; nínú àyíká ọ̀rọ̀ yìí, “aṣọ” jẹ́ ọ̀rọ̀ àpapọ̀ tó bójú mu ju aṣọ kan pàtó lọ.
- source_word: τί μεριμνᾶτε
  choice: Èé sì ti ṣe tí ẹ fi ń ṣàníyàn
  rationale: μεριμνάω níbí túmọ̀ sí àníyàn inú nípa ohun tí a nílò, tí τί sì ń béèrè ìdí; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì bá àkòrí ẹsẹ̀ tó yí i ká mu.
- source_word: καταμάθετε
  choice: Ẹ kíyè sí
  rationale: Ọ̀rọ̀ àṣẹ náà ń pè fún fífi ara balẹ̀ wo ohun kan kí a lè lóye rẹ̀. “Ẹ kíyè sí” sọ ìwòye pẹ̀lú àfiyèsí ní Yorùbá àdánidá láì fi ìtẹnumọ́ tí kò pọndandan kún un.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: àwọn lílì inú oko
  rationale: κρίνα túmọ̀ ní pàtàkì sí àwọn òdòdó lílì; τοῦ ἀγροῦ fi hàn pé wọ́n wà ní pápá tàbí oko, kì í ṣe pé ènìyàn gbìn wọ́n sínú ọgbà.
- source_word: πῶς αὐξάνουσιν
  choice: bí wọ́n ti ń dàgbà
  rationale: αὐξάνω níbí ń tọ́ka sí ìdàgbàsókè àdánidá àwọn ohun ọ̀gbìn.
- source_word: οὐ κοπιῶσιν
  choice: wọn kì í ṣe làálàá
  rationale: κοπιάω túmọ̀ sí ṣíṣe iṣẹ́ takuntakun tàbí làálàá; gbolohun yìí pa ìyàtọ̀ mọ́ láàárín ìdàgbàsókè òdòdó àti iṣẹ́ ènìyàn.
- source_word: οὐδὲ νήθουσιν
  choice: bẹ́ẹ̀ ni wọn kì í rọ òwú
  rationale: νήθω ni yíyan tàbí rírọ okun láti inú òwú fún ṣíṣe aṣọ. “Rọ òwú” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ iṣẹ́ yíyan okun yìí.
theological_decisions:
- issue: Ìtumọ̀ μεριμνάω nínú ẹ̀kọ́ Jésù nípa ìpèsè
  choice: ṣàníyàn
  alternative: máa ṣe àníyàn / máa dààmú
  rationale: “Ṣàníyàn” mú ìdààmú inú tí ọ̀rọ̀ Gíríìkì ní nínú àyíká yìí jáde, láì sọ pé gbogbo èrò tàbí ìṣọ́ra nípa ohun èlò ayé jẹ́ ohun tí kò tọ́.
- issue: Ìdánimọ̀ τὰ κρίνα
  choice: àwọn lílì
  alternative: àwọn òdòdó igbó
  rationale: Ìtumọ̀ pàtó jù lọ fún κρίνα ni lílì, ṣùgbọ́n ó ṣeé ṣe kí ọ̀rọ̀ náà ní àyè yìí gba àwọn òdòdó igbó tó dà bí lílì; àlàyé ẹsẹ̀ ìsàlẹ̀ pa àṣàyàn náà mọ́ láì yí ọ̀rọ̀ àkọ́kọ́ padà.
translation_notes:
  register: 'Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí nọ́ńbà ọ̀pọ̀ inú Gíríìkì, a sì pa ìfarawé gbolohun méjèèjì mọ́: “wọn kì í ṣe … bẹ́ẹ̀ ni wọn kì í …”.'
