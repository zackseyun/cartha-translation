review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ tó wà nínú δέ mọ́, ó sì fi àṣẹ tí ń bá a lọ ti θησαυρίζετε hàn dáadáa. ‘Àwọn ìṣúra ní ọ̀run,’ ‘kòkòrò aṣọ,’ àti ‘ìbàjẹ́’ fara mọ́ Gíríìkì, láì ṣàlàyé àkàwé ìṣúra ọ̀run ju ohun tí ọ̀rọ̀ náà sọ lọ. Síbẹ̀, ọ̀rọ̀ ‘lu odi já wọlé’ kò mú àwòrán διορύσσω—gbígbẹ́ tàbí gígún gba ogiri—hàn dáadáa.
  naturalness: Gbólóhùn náà lóye, ṣùgbọ́n lílo ‘kì í ti í’ lẹ́ẹ̀mẹjì kò pọ̀n dandan, ‘lu odi já wọlé’ sì kéré sí àdánidá. ‘Gún ògiri wọlé’ jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání láti sọ ìwọlé nípa ogiri, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ ‘gbẹ́/walẹ̀ kọjá’ mọ́.
  terminology: ‘Ìṣúra,’ ‘ọ̀run,’ ‘kòkòrò aṣọ,’ ‘ìbàjẹ́,’ àti ‘àwọn olè’ yẹ fún Yorùbá ìgbàlódé tó ní iyì. A ti tún ọ̀rọ̀ àlàyé [b] ṣe kí gbolohun rẹ̀ jẹ́ Yorùbá tó pé, kí ó sì ṣàlàyé ìṣe ìgbẹ́ gba ogiri amọ̀ kọjá ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì.
