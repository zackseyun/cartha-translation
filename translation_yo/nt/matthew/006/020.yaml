id: MAT.6.20
reference: Matthew 6:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa to àwọn ìṣúra jọ fún ara yín ní ọ̀run, níbi tí kòkòrò aṣọ tàbí ìbàjẹ́[a] kì í pa wọ́n run, àti níbi tí àwọn olè kì í gún ògiri wọlé[b] tàbí jalè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìpata.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ gbígbòòrò sí i, ìyẹn ohun tó ń jẹ nǹkan run, ìbàjẹ́ tàbí ohun tó ń ba nǹkan jẹ́ díẹ̀díẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “walẹ̀ gba inú ogiri kọjá”; ó ṣeé ṣe kí èyí tọ́ka sí àwọn olè tó ń fọ ogiri amọ̀ ilé wọlé.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: ẹ máa to … jọ
  rationale: Ọ̀rọ̀ àṣẹ yìí ń tọ́ka sí ìṣe tí ó yẹ kí ó máa bá a lọ; ‘ẹ máa to … jọ’ jẹ́ Yorùbá àdánidá tó sì pa àwòrán kíkó ìṣúra jọ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí àṣẹ òdì inú ẹsẹ tó ṣáájú.
- source_word: ὑμῖν
  choice: fún ara yín
  rationale: Ó pa ìtumọ̀ pé àwọn tí a ń bá sọ ni yóò jèrè nínú ìṣe náà mọ́.
- source_word: θησαυροὺς
  choice: àwọn ìṣúra
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà inú Gíríìkì àti àwòrán ìṣúra mọ́.
- source_word: ἐν οὐρανῷ
  choice: ní ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ibi tí ìṣúra náà wà.
- source_word: σὴς
  choice: kòkòrò aṣọ
  rationale: Ó túmọ̀ sí kòkòrò tó máa ń jẹ aṣọ àti àwọn ohun ìpamọ́ run; àfikún ‘aṣọ’ mú irú kòkòrò náà ṣe kedere.
- source_word: βρῶσις
  choice: ìbàjẹ́
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ohun tó ń jẹ tàbí tó ń ba nǹkan jẹ́. ‘Ìbàjẹ́’ pa ìtumọ̀ gbígbòòrò náà mọ́ ju kí a fi sí ‘ìpata’ nìkan.
- source_word: ἀφανίζει
  choice: pa … run
  rationale: Ó sọ ìparun tàbí píparẹ́ nǹkan ní Yorùbá tó ṣe kedere.
- source_word: κλέπται
  choice: àwọn olè
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: διορύσσουσιν
  choice: lu odi já wọlé
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí gbígbẹ́ gba inú ohun kan kọjá, ó sì ṣeé ṣe kí ó tọ́ka sí fífọ odi ilé wọlé; yíyan yìí jẹ́ kó ṣe kedere ní Yorùbá òde òní, tí àlàyé ìṣe ìgbẹ́ sì wà ní àlàyé ìsàlẹ̀.
- source_word: κλέπτουσιν
  choice: jalè
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti àdánidá fún ìṣe olè.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn ìṣúra ní ọ̀run’
  choice: A pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘àwọn ìṣúra … ní ọ̀run,’ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: ẹ̀san ọ̀run; ọrọ̀ ti ẹ̀mí
  rationale: Orísun náà kò tú irú ìṣúra náà síwájú; pípa àkàwé mọ́ kò fi èrò kan pàtó nípa ẹ̀san tàbí iṣẹ́ rere wọ ọ̀rọ̀ náà.
- issue: Ìwọ̀n ìtumọ̀ βρῶσις
  choice: ìbàjẹ́
  alternative: ìpata; ohun tó ń jẹ nǹkan run
  rationale: ‘Ìbàjẹ́’ gba ìtumọ̀ ohun tó ń jẹ tàbí ba ohun ayé jẹ́ láàyè, láì dín ọ̀rọ̀ náà kù sí ìpata irin nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ máa …’ fi àṣẹ ọ̀pọ̀ ènìyàn àti ìṣe tó ń bá a lọ hàn. A yà àwọn àmì àlàyé sí àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé gan-an, kí [a] tẹ̀ lé ‘ìbàjẹ́’ àti kí [b] tẹ̀ lé ‘wọlé.’
