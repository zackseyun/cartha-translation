- from: Ṣùgbọ́n ẹ máa to àwọn ìṣúra jọ fún ara yín ní ọ̀run, níbi tí kòkòrò aṣọ tàbí ìbàjẹ́[a] kì í ti í pa wọ́n run, àti níbi tí àwọn olè kì í ti í lu odi já wọlé[b], tí wọn kì í sì í jalè.
  to: Ṣùgbọ́n ẹ máa to àwọn ìṣúra jọ fún ara yín ní ọ̀run, níbi tí kòkòrò aṣọ tàbí ìbàjẹ́[a] kì í pa wọ́n run, àti níbi tí àwọn olè kì í gún ògiri wọlé[b] tàbí jalè.
  rationale: Àtúnṣe náà yí ọ̀nà tí a fi túmọ̀ διορύσσουσιν padà sí ‘gún ògiri wọlé,’ kí ó lè pa àwòrán gígún tàbí gbígbẹ́ gba ogiri kọjá mọ́. A tún mú àlàyé [b] ṣe kedere. Àwọn àmì àlàyé wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, ìyẹn ‘ìbàjẹ́’ àti ìwọlé nípasẹ̀ ogiri.
