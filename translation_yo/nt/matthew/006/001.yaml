revisions:
- from: Ṣùgbọ́n ẹ ṣọ́ra, kí ẹ má ṣe máa ṣe òdodo yín níwájú àwọn ènìyàn pẹ̀lú ète kí wọ́n lè rí yín[a]. Bí bẹ́ẹ̀ kọ́, ẹ kò ní èrè kankan lọ́dọ̀ Baba yín tí ń bẹ ní àwọn ọ̀run[b].
  to: Ṣùgbọ́n ẹ ṣọ́ra kí ẹ má ṣe máa ṣe òdodo yín níwájú àwọn ènìyàn láti jẹ́ kí wọ́n rí i[a]. Bí bẹ́ẹ̀ kọ́, ẹ kò ní ẹ̀san kankan lọ́dọ̀ Baba yín tí ń bẹ ní àwọn ọ̀run[b].
  rationale: The revision corrects the referent in the purpose clause so that the righteous practice, rather than the disciples personally, is what people are intended to see. It also replaces “èrè” with the more contextually natural “ẹ̀san.” The broad, non-sectarian rendering “òdodo” and the Greek plural “àwọn ọ̀run” are retained, as are both audit-trail footnotes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the warning, the broad scope of δικαιοσύνη, the public setting, the purposive clause, and the loss of divine reward. However, “kí wọ́n lè rí yín” makes the people see the disciples themselves, whereas the Greek passive refers to their righteousness/practice being seen. The revision restores that referent.
  naturalness: The register and tone marking are generally strong and natural. “Ẹ̀san” is more idiomatic and semantically apt than “èrè” for divine recompense in this context; “èrè” can primarily suggest profit or gain.
  terminology: “Òdodo” appropriately preserves the broad sense of δικαιοσύνη. “Àwọn ènìyàn,” “Baba yín,” and “àwọn ọ̀run” are suitable. The textual-variant note is retained but states the variant more precisely as charitable giving to those in need.
  issues:
  - severity: medium
    issue: The purpose clause says that people may see “you” rather than see the righteousness/practice.
    rationale: πρὸς τὸ θεαθῆναι αὐτοῖς has the righteousness/practice as the understood item displayed before people. “láti jẹ́ kí wọ́n rí i” naturally refers back to “òdodo yín” and preserves this syntax and sense.
  - severity: low
    issue: “Èrè” is used for μισθός.
    rationale: Though possible in a broad sense, “èrè” commonly evokes profit. “Ẹ̀san” more naturally communicates recompense or reward without narrowing the source.
  revised_text: Ṣùgbọ́n ẹ ṣọ́ra kí ẹ má ṣe máa ṣe òdodo yín níwájú àwọn ènìyàn láti jẹ́ kí wọ́n rí i[a]. Bí bẹ́ẹ̀ kọ́, ẹ kò ní ẹ̀san kankan lọ́dọ̀ Baba yín tí ń bẹ ní àwọn ọ̀run[b].
