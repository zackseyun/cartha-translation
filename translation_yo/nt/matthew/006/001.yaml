id: MAT.6.1
reference: Matthew 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ ṣọ́ra kí ẹ má ṣe máa ṣe òdodo yín níwájú àwọn ènìyàn láti jẹ́ kí wọ́n rí i[a]. Bí bẹ́ẹ̀ kọ́, ẹ kò ní ẹ̀san kankan lọ́dọ̀ Baba yín tí ń bẹ ní àwọn ọ̀run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn iṣẹ́ òdodo yín.” Àwọn àfọwọ́kọ kan ní “fífúnni fún aláìní” dípò “òdodo.”
    reason: textual_variant
  - marker: b
    text: Èdè Gíríìkì ní “àwọn ọ̀run” ní ọ̀pọ̀ nọ́ńbà; ní Yorùbá, a sábà máa ń sọ ọ́ ní ẹyọ pé “ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ onítẹ̀síwájú sí ọ̀pọ̀ ènìyàn ni; “ẹ ṣọ́ra” jẹ́ Yorùbá àdánidá tí ó sì pa agbára ìkìlọ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìtakora sí ẹ̀kọ́ tó ṣáájú hàn.
- source_word: δικαιοσύνην ὑμῶν
  choice: òdodo yín
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti δικαιοσύνη mọ́, láì dín un kù sí fífúnni ní ọrẹ nìkan.
- source_word: μὴ ποιεῖν
  choice: kí ẹ má ṣe máa ṣe
  rationale: Ó fi ohun tí a ní láti yẹra fún àti ìṣe tí ó lè máa tẹ̀ síwájú hàn.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: níwájú àwọn ènìyàn
  rationale: ἀνθρώπων ń tọ́ka sí gbogbo ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: pẹ̀lú ète kí wọ́n lè rí yín
  rationale: Ó pa ète ìṣe náà àti èrò ti jíjẹ́ ẹni tí àwọn mìíràn rí mọ́.
- source_word: εἰ δὲ μή γε
  choice: Bí bẹ́ẹ̀ kọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àbájáde ìkìlọ̀ náà.
- source_word: μισθὸν
  choice: èrè
  rationale: Nínú àyíká yìí, “èrè” túmọ̀ sí ohun tí Ọlọ́run ń fi san ìṣe, láì mú èrò owó iṣẹ́ wọlé lọ́nà tí kò yẹ.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: lọ́dọ̀ Baba yín
  rationale: “Lọ́dọ̀” lè fi ibi tí èrè wà àti ẹni tí ó ti ń wá hàn ní Yorùbá àdánidá.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: tí ń bẹ ní àwọn ọ̀run
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà inú èdè Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé Yorùbá sábà máa ń sọ “ọ̀run” ní ẹyọ.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ δικαιοσύνην nínú ẹsẹ yìí
  choice: “òdodo” ní ìtumọ̀ gbígbòòrò
  alternative: “àwọn iṣẹ́ òdodo” tàbí “fífúnni ní ọrẹ”
  rationale: Àkọsílẹ̀ SBLGNT ní δικαιοσύνην, èyí tí ó ní ìtumọ̀ gbígbòòrò ju fífúnni ní ọrẹ lọ. A kò dín ìtumọ̀ náà kù nínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ ni a fi pa àwọn àṣàyàn mìíràn mọ́.
- issue: Ìtumọ̀ ἀνθρώπων
  choice: “àwọn ènìyàn” lápapọ̀
  alternative: “àwọn ọkùnrin”
  rationale: Àwọn olùwò ènìyàn lápapọ̀ ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe akọ nìkan.
- issue: Ọ̀pọ̀ nọ́ńbà τοῖς οὐρανοῖς
  choice: “ní àwọn ọ̀run”
  alternative: “ní ọ̀run”
  rationale: A pa ìrísí ọ̀pọ̀ nọ́ńbà àti àṣà ọ̀rọ̀ Mátíù mọ́ láì fi ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì lo “ẹ” fún àṣẹ sí ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí orísun Gíríìkì.
