id: MAT.6.34
reference: Matthew 6:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe ṣàníyàn nípa ọ̀la, nítorí ọ̀la yóò ṣàníyàn nípa ara rẹ̀. Ọjọ́ kọ̀ọ̀kan ní ìṣòro[a] tirẹ̀ tó tó fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọjọ́ kọ̀ọ̀kan ní ibi tirẹ̀ tó tó fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ibi,” ṣùgbọ́n níbí ó ṣeé ṣe jù pé ó ń tọ́ka sí ìṣòro tàbí ìpọ́njú ọjọ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: ẹ má ṣe ṣàníyàn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àníyàn tí ń da ọkàn láàmú. “Ṣàníyàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì bá àkòrí Mátíù 6:25–34 mu.
- source_word: εἰς τὴν αὔριον
  choice: nípa ọ̀la
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe μεριμνάω, gbólóhùn náà túmọ̀ sí fífi ọkàn sí ohun ọjọ́ iwájú; “nípa ọ̀la” sọ èyí ní kedere.
- source_word: ἡ αὔριον
  choice: ọ̀la
  rationale: A pa àkàwé ẹni mọ́, níbi tí “ọ̀la” ti dúró bí ẹni pé ó lè ṣe ohun kan.
- source_word: μεριμνήσει αὑτῆς
  choice: yóò ṣàníyàn nípa ara rẹ̀
  rationale: Èyí pa ìtúnlò ọ̀rọ̀ “ṣàníyàn” àti àkàwé ẹni inú orísun mọ́; “ara rẹ̀” dúró fún ọ̀rọ̀ arọ́pò onípadà.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: ọjọ́ kọ̀ọ̀kan ti tó fún un
  rationale: Ìtumọ̀ pínpín ti dative náà ni a sọ ní Yorùbá àdánidá pé “ọjọ́ kọ̀ọ̀kan,” nígbà tí “ti tó fún un” pa ìtumọ̀ ἀρκετόν mọ́.
- source_word: κακία
  choice: ìṣòro
  rationale: Bí ó tilẹ̀ jẹ́ pé κακία lè túmọ̀ sí “ibi,” nínú ọ̀rọ̀ yìí ó ṣeé ṣe jù pé ó ń tọ́ka sí ìpọ́njú tàbí ìṣòro ọjọ́, èyí tó bá àkòrí àníyàn mu.
- source_word: αὐτῆς
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka padà sí “ọjọ́ kọ̀ọ̀kan”; ìṣètò Yorùbá “ti tó fún un” sọ ìbáṣepọ̀ yẹn lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ κακία nínú ọ̀rọ̀ ọgbọ́n nípa àníyàn
  choice: A túmọ̀ ọ́ sí “ìṣòro.”
  alternative: “ibi” tàbí “ìpọ́njú”
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa àníyàn fún ọjọ́ iwájú, gbólóhùn ìkẹyìn sì ń fi hàn pé ọjọ́ kọ̀ọ̀kan ní ẹrù tirẹ̀. “Ìṣòro” pa agbára ìlò ẹ̀kọ́ náà mọ́ láìfi dandan sọ pé ibi ti ìwà búburú ni a ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. A lo “ẹ” gẹ́gẹ́ bí àṣẹ tó ń bá ọ̀pọ̀ ènìyàn sọ, ní èdè àdánidá, ọlọ́lá, tó sì rọrùn fún òǹkàwé òde òní.
