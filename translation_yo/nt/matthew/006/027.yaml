id: MAT.6.27
reference: Matthew 6:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: yo
  text: Ta nínú yín sì lè, nípa àníyàn, fi ìgbọ̀nwọ́ kan kún gígùn ayé rẹ̀[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ìgbọ̀nwọ́ kan kún gíga ara rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìgbà ayé” tàbí “gíga ara.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Ta sì ni nínú yín
  rationale: Ìbéèrè yìí túmọ̀ sí ẹni wo láàárín àwọn olùgbọ́; “sì” jẹ́ àsopọ̀ fẹ́ẹ́rẹ́ tí ó bá ìṣàn ọ̀rọ̀ mu.
- source_word: μεριμνῶν
  choice: nípa ṣíṣe àníyàn
  rationale: Ó fi àníyàn hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun tí ẹni náà ń lò láti gbìyànjú láti ṣe ohun tí a sọ.
- source_word: δύναται
  choice: ó lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ agbára tàbí àǹfààní láti ṣe ohun kan.
- source_word: προσθεῖναι
  choice: fi … kún
  rationale: Ó pa àwòrán fífi ohun kan kún ohun mìíràn mọ́ ní kedere.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: kún gígùn ayé rẹ̀
  rationale: ἡλικία lè tọ́ka sí ìgbà ayé tàbí gíga ara. “Gígùn ayé” bá àyíká ọ̀rọ̀ nípa àníyàn fún ìyè mu, ó sì pa àwòrán ìwọ̀n gígùn mọ́.
- source_word: πῆχυν ἕνα
  choice: ìgbọ̀nwọ́ kan
  rationale: Ìgbọ̀nwọ́ jẹ́ ìwọ̀n gígùn láti igunpa dé ṣóńṣó ọwọ́; pípa ìwọ̀n ìgbàanì yìí mọ́ ń ṣètìlẹ́yìn fún àwòrán ọ̀rọ̀ Gíríìkì.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Aṣẹ̀rọ arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn níbí, ó sì tọ́ka padà sí ẹnikẹ́ni nínú àwọn olùgbọ́.
theological_decisions:
- issue: Ìtumọ̀ ἡλικία nínú ọ̀rọ̀ yìí
  choice: gígùn ayé
  alternative: gíga ara
  rationale: Ìtumọ̀ “ìgbà ayé” bá àríyànjiyàn nípa àníyàn àti ìyè mu, ṣùgbọ́n “gíga ara” tún ṣeé gbà nípa èdè Gíríìkì, nítorí náà a pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn, tó bójú mu, tó sì ṣeé yé fún òǹkàwé òde òní. A pa ìbéèrè àsọyé àti àwòrán ìwọ̀n ìgbọ̀nwọ́ inú orísun mọ́.
