  rationale: 'A tún ọ̀rọ̀ náà ṣe fún ìṣàn Yorùbá tó dára síi: a gbé “sì” sí ibi tí ó rọrùn nínú ìbéèrè, a sì rọ́pò ìlò “nípa ṣíṣe àníyàn” pẹ̀lú “nípa àníyàn.” A pa ìtumọ̀ àkọ́kọ́ “gígùn ayé” mọ́, a sì dáàbò bo àìdájú ἡλικία nípasẹ̀ àlàyé ìsàlẹ̀ “gíga ara.”'
