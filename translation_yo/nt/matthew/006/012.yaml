id: MAT.6.12
reference: Matthew 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: yo
  text: Kí o sì dárí àwọn gbèsè wa jì wá[a], gẹ́gẹ́ bí àwa náà ti dárí ji[b] àwọn tí wọ́n jẹ wá ní gbèsè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ẹ̀ṣẹ̀ wa” tàbí “àwọn àṣìṣe wa.” Ní tààrà, Gíríìkì ní “àwọn gbèsè wa”; ó pa àwòrán ohun tí a jẹ ẹlòmíràn mọ́, ó sì ṣeé ṣe kí ó ń tọ́ka sí ẹ̀ṣẹ̀ tàbí ìṣìnà níhìn-ín.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “dárí ji.” Ọ̀rọ̀ Gíríìkì lè jẹ́ ìṣe àtijọ́ lasan; “ti dárí ji” fi hàn ní Yorùbá pé ìṣe náà ti parí, ó sì ṣe pàtàkì sí ẹ̀bẹ̀ tí a ń bẹ nísinsìnyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Kí o sì
  rationale: “Sì” so ẹ̀bẹ̀ yìí pọ̀ mọ́ àwọn ẹ̀bẹ̀ tó ṣáájú; “kí o” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ inú àdúrà.
- source_word: ἄφες
  choice: dárí … jì wá
  rationale: Nínú ọ̀rọ̀ àdúrà àti gbèsè ìwà rere, ἀφίημι túmọ̀ sí fífi ẹ̀ṣẹ̀ sílẹ̀ tàbí dárí jini. Àkópọ̀ ọ̀rọ̀ Yorùbá “dárí … jì” ni ó dára jù lọ níhìn-ín.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: àwọn gbèsè wa
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ pé ohun tí a jẹ Ọlọ́run ni a ń pè ní “gbèsè,” dípò kí a túmọ̀ rẹ̀ ní tààrà sí “ẹ̀ṣẹ̀.”
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó pa ìfiwéra tó wà láàárín ìdáríjì tí a ń béèrè lọ́wọ́ Ọlọ́run àti èyí tí àwa fúnra wa ṣe mọ́.
- source_word: καὶ ἡμεῖς
  choice: àwa náà
  rationale: “Náà” fi ìtẹnumọ́ Gíríìkì hàn pé àwa pẹ̀lú ti ṣe ìdáríjì.
- source_word: ἀφήκαμεν
  choice: ti dárí ji
  rationale: “Ti” fi ìṣe tí ó ti parí ṣùgbọ́n tí ó ṣì ní ìtumọ̀ nísinsìnyí hàn lọ́nà Yorùbá àdánidá, láìfi ohun tí àsìkò aorist kò sọ kún un.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: àwọn tí wọ́n jẹ wá ní gbèsè
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì tún lo “gbèsè” láti pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú “àwọn gbèsè wa.”
theological_decisions:
- issue: Àwòrán gbèsè fún ẹ̀ṣẹ̀ tàbí àṣìṣe ìwà rere
  choice: Pa “àwọn gbèsè wa” mọ́ sínú ọ̀rọ̀ pàtàkì.
  alternative: “Àwọn ẹ̀ṣẹ̀ wa” tàbí “àwọn àṣìṣe wa.”
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ ní pàtó sí ohun tí a jẹ ẹlòmíràn. Pípa àwòrán gbèsè mọ́ jẹ́ kí ìtumọ̀ náà fara mọ́ orísun, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń jẹ́ kó ye kedere pé ẹ̀ṣẹ̀ tàbí àṣìṣe ni a lè ní lọ́kàn.
- issue: Ìbáṣepọ̀ láàárín ìdáríjì Ọlọ́run àti ìdáríjì ènìyàn
  choice: Lo “gẹ́gẹ́ bí” láìṣàlàyé bóyá ó ń tọ́ka sí àpẹẹrẹ, ìbámu, tàbí ipò.
  alternative: Túmọ̀ rẹ̀ ní ọ̀nà tí yóò sọ pé ìdáríjì ènìyàn ni ó ń fa ìdáríjì Ọlọ́run.
  rationale: ὡς fi àwọn ìṣe méjèèjì wéra, ṣùgbọ́n ẹsẹ yìí nìkan kò tú gbogbo irú ìbáṣepọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà láàárín wọn. Ìtumọ̀ náà pa ìnira yìí mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
- issue: Ìṣe tó parí nínú ἀφήκαμεν
  choice: “ti dárí ji”
  alternative: “dárí ji” gẹ́gẹ́ bí ìṣe àtijọ́ lasan.
  rationale: Aorist lè sọ ìṣe àtijọ́ ní ṣókí; “ti dárí ji” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti fi ìṣe tó ti ṣẹlẹ̀ tí ó sì ní ìbáṣepọ̀ pẹ̀lú ẹ̀bẹ̀ ìsinsìnyí hàn, láìsọ pé Gíríìkì ní àsìkò perfect.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Àwọn tí wọ́n jẹ wá ní gbèsè” jẹ́ àdánidá ju ọ̀rọ̀ àkọlé bí “àwọn onígbèsè wa” lọ, ó sì pa àwòrán gbèsè àti ìbátan àwọn ọ̀rọ̀ inú Gíríìkì mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
