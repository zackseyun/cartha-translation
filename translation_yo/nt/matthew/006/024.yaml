id: MAT.6.24
reference: Matthew 6:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: yo
  text: Kò sí ẹni tí ó lè sin ọ̀gá méjì; nítorí yálà yóò kórìíra ọ̀kan, yóò sì nífẹ̀ẹ́ èkejì, tàbí yóò fara mọ́ ọ̀kan, yóò sì kẹ́gàn èkejì. Ẹ kò lè sin Ọlọ́run àti Mámónì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìní’ tàbí ‘owó.’ Nínú Gíríìkì, ọ̀rọ̀ àyálò ni ‘Mámónì’; ó lè fi ìní hàn bí ọ̀gá alátakò sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Kò sí ẹni
  rationale: 'Ọ̀nà Yorùbá àdánidá ni èyí fún àìdásílẹ̀ gbogbo ènìyàn: ‘kò sí ẹnikẹ́ni.’'
- source_word: δύναται / δύνασθε
  choice: lè / kò lè
  rationale: Ó fi agbára tàbí àǹfààní láti ṣe ohun kan hàn, ó sì pa ìtẹnumọ́ tí a tún ṣe ní òpin ẹsẹ náà mọ́.
- source_word: δυσὶ κυρίοις
  choice: ọ̀gá méjì
  rationale: Nínú àwòrán iṣẹ́ ẹrú yìí, ‘ọ̀gá’ sọ ìbáṣepọ̀ àṣẹ àti iṣẹ́ di mímọ́ ju ‘Olúwa’ lọ, kò sì mú kí a dà á pọ̀ mọ́ orúkọ oyè Ọlọ́run.
- source_word: δουλεύειν
  choice: sin
  rationale: ‘Sin ọ̀gá’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá iṣẹ́ ẹni tí ó wà lábẹ́ àṣẹ ọ̀gá mu; àyíká ọ̀rọ̀ náà ni ó ń gbé ìtumọ̀ iṣẹ́ ẹrú jáde.
- source_word: μισήσει
  choice: yóò kórìíra
  rationale: A pa agbára ọ̀rọ̀ Gíríìkì mọ́, dípò kí a sọ ọ́ di ‘fẹ́ ní kékeré sí i,’ nítorí ìdàkejì rẹ̀ pẹ̀lú ìfẹ́ àti ẹ̀gàn.
- source_word: ἀγαπήσει
  choice: yóò nífẹ̀ẹ́
  rationale: Èyí ni ìtumọ̀ àdánidá fún ìfẹ́, ó sì dúró ní òdìkejì ‘kórìíra.’
- source_word: ἑνὸς ἀνθέξεται
  choice: yóò fara mọ́ ọ̀kan
  rationale: ‘Fara mọ́’ ń sọ fífaramọ́ ẹni kan ṣinṣin àti dídúró tì í jáde ní Yorùbá àdánidá.
- source_word: καταφρονήσει
  choice: yóò kẹ́gàn
  rationale: ‘Kẹ́gàn’ pa ìtumọ̀ yíyẹ ẹni sílẹ̀ àti wíwo ẹni náà gẹ́gẹ́ bí aláìníyelórí mọ́.
- source_word: θεῷ
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédéé fún Θεός níbí.
- source_word: μαμωνᾷ
  choice: Mámónì
  rationale: A pa ọ̀rọ̀ àyálò náà mọ́ láti jẹ́ kí Mámónì dúró bí ọ̀gá alátakò ní ìfiwéra pẹ̀lú Ọlọ́run; àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyíká àjọṣe ọ̀gá àti ẹrú tí kì í ṣe oyè Ọlọ́run
  choice: ọ̀gá
  alternative: olúwa
  rationale: Ọ̀pọ̀ àti àwòrán iṣẹ́ lábẹ́ àṣẹ ń béèrè fún ‘ọ̀gá’; èyí tún yẹra fún dídà á pọ̀ mọ́ oyè Ọlọ́run.
- issue: Ìtumọ̀ μαμωνᾶς
  choice: Mámónì
  alternative: ọrọ̀ tàbí owó
  rationale: Pípamọ́ ọ̀rọ̀ àyálò náà ń pa bí a ṣe sọ ọrọ̀ di ẹni bí ọ̀gá alátakò sí Ọlọ́run mọ́; a fi àwọn ìtumọ̀ kedere sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Sin ọ̀gá’ jẹ́ ọ̀rọ̀ àdánidá, ‘fara mọ́’ sì mú ìtumọ̀ ìdúróṣinṣin jáde láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
