  to: Nítorí náà, mo sọ fún yín pé, ẹ má ṣe ṣàníyàn nípa ìyè yín[a]—ohun tí ẹ ó jẹ—tàbí nípa ara yín—ohun tí ẹ ó wọ̀. Ṣé ìyè kò ju oúnjẹ lọ, ara sì ju aṣọ lọ?
  rationale: 'Àtúnṣe náà ṣe pàtàkì láti mú ìtumọ̀ ψυχή bá àyíká Gíríìkì mu: ‘ìyè’ ni a fi sí inú ẹsẹ̀, nígbà tí ‘ẹ̀mí’ wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn lexical. A tún ṣe ìbéèrè àsọyé ìkẹyìn ní Yorùbá tó dára síi, láìyí ìtumọ̀ tàbí ìwọ̀n ìfiwéra orísun padà.'
