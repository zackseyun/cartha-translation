    rationale: Ní àyíká tí Jesu ti ń sọ nípa ohun tí a máa jẹ àti aṣọ fún ara, ψυχή túmọ̀ sí ìyè ẹni. ‘Ẹ̀mí’ lè mú kí òǹkàwé gbà á gẹ́gẹ́ bí apá aláìrí ènìyàn, èyí tí àyíká kò fi sí iwájú.
  - severity: low
