id: MAT.6.25
reference: Matthew 6:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: yo
  text: Nítorí náà, mo sọ fún yín pé, ẹ má ṣe ṣàníyàn nípa ìyè yín[a]—ohun tí ẹ ó jẹ—tàbí nípa ara yín—ohun tí ẹ ó wọ̀. Ṣé ìyè kò ju oúnjẹ lọ, ara sì ju aṣọ lọ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ẹ̀mí.’ Níhìn-ín, àyíká ọ̀rọ̀ nípa oúnjẹ àti aṣọ fi hàn pé ‘ìyè’ ni ìtumọ̀ tí ó yẹ julọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ yìí so mọ́ ẹ̀kọ́ tí ó ṣáájú, ó sì pa ìtumọ̀ ‘nítorí ìdí yìí’ mọ́ ní Yorùbá àdánidá.
- source_word: μεριμνᾶτε
  choice: ẹ má ṣe ṣàníyàn
  rationale: Ó túmọ̀ sí àníyàn tàbí ìdààmú ọkàn nípa ohun tí a nílò, kì í ṣe pé kí ènìyàn má ṣe ronú tàbí pèsè rárá.
- source_word: ψυχῇ
  choice: ẹ̀mí yín
  rationale: ‘Ẹ̀mí’ lè tọ́ka sí ìyè tàbí gbogbo ẹni náà ní Yorùbá; ọ̀rọ̀ nípa jíjẹun fi hàn pé ìyè ni ó ṣe pàtàkì jù níbí, kì í ṣe ẹ̀mí aláìrí nìkan. Àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ yìí.
- source_word: τί φάγητε
  choice: ohun tí ẹ ó jẹ
  rationale: Ó sọ ìdààmú tí ó dojú kọ ọjọ́ iwájú ní Yorùbá tó ṣe kedere.
- source_word: σώματι
  choice: ara yín
  rationale: Ó tọ́ka tààrà sí ara ènìyàn, ní ìyàtọ̀ sí aṣọ.
- source_word: τί ἐνδύσησθε
  choice: ohun tí ẹ ó wọ̀
  rationale: ‘Wọ̀’ ni ọ̀nà Yorùbá tó rọrùn, tó sì jẹ́ àdánidá fún fífi aṣọ bora.
- source_word: οὐχὶ
  choice: kò ha ... bí?
  rationale: Ìkọ̀lé yìí jẹ́ ìbéèrè àsọyé tí ó ń retí ìdáhùn pé bẹ́ẹ̀ ni.
- source_word: πλεῖόν
  choice: ju ... lọ
  rationale: Ó pa ìfiwéra mọ́ láìfi èrò míràn bí ‘níyelórí’ kún ọ̀rọ̀ náà.
- source_word: τροφῆς
  choice: oúnjẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí ènìyàn ń jẹ láti gbé, ‘oúnjẹ’ sì ṣe kedere ní Yorùbá.
- source_word: ἐνδύματος
  choice: aṣọ
  rationale: Ó jẹ́ ọ̀rọ̀ gbogbogbò fún ohun tí a wọ̀, ó sì bá ‘oúnjẹ’ dọ́gba nínú ìfiwéra náà.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ẹ̀kọ́ Jesu
  choice: A lo ‘ẹ̀mí’ pẹ̀lú àlàyé pé ‘ìyè’ ni ìtumọ̀ rẹ̀ níbí.
  alternative: ìyè; ọkàn
  rationale: Àyíká ọ̀rọ̀ náà dá lórí jíjẹun àti wíwọ aṣọ, nítorí náà ψυχή ń tọ́ka sí ìyè ẹni tàbí gbogbo ẹni náà, kì í ṣe apá aláìrí ti ènìyàn nìkan. Àlàyé náà dènà kí òǹkàwé má ṣe fi ẹ̀kọ́ ìpín ara àti ẹ̀mí tí ẹsẹ̀ náà kò sọ sínú rẹ̀.
translation_notes:
  register: Yorùbá àkọ́tọ̀ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ọ̀rọ̀ náà ṣe kedere fún òǹkàwé gbogbogbò, ó sì pa ìbéèrè àsọyé àti ìfiwéra inú Gíríìkì mọ́.
