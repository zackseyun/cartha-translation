id: MAT.6.8
reference: Matthew 6:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe dàbí wọn, nítorí Baba yín mọ ohun tí ẹ nílò kí ẹ tó béèrè lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Nítorí náà, ẹ má ṣe
  rationale: “Nítorí náà” fi ìbáṣepọ̀ ìparí-ọ̀rọ̀ οὖν hàn, “ẹ má ṣe” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdènà μή sí ọ̀pọ̀ ènìyàn.
- source_word: ὁμοιωθῆτε
  choice: dà bí
  rationale: “Dà bí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún jíjẹ́ tàbí dídà bí ẹlòmíràn; ó tún lè fi ìtumọ̀ yíyípadà tẹ̀ lé àpẹẹrẹ wọn hàn láìdi gbólóhùn náà mọ́ ìtumọ̀ kan ṣoṣo.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí àwọn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn nínú àyíká ọ̀rọ̀, nítorí náà “wọn” tó.
- source_word: οἶδεν
  choice: mọ
  rationale: 'Bí ó tilẹ̀ jẹ́ pé οἶδα ní ìrísí perfect ní Gíríìkì, ìtumọ̀ rẹ̀ níbí jẹ́ ti ìsinsìnyí: “mọ.”'
- source_word: ὁ πατὴρ ὑμῶν
  choice: Baba yín
  rationale: Èdè Gíríìkì sọ “Baba yín” lásán; a kò fi “tí ń bẹ ní ọ̀run” kún un.
- source_word: ὧν χρείαν ἔχετε
  choice: ohun tí ẹ nílò
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá, tó sì sọ àkóónú àìní wọn ní kíkún.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: kí ẹ tó béèrè lọ́wọ́ rẹ̀
  rationale: “Kí ẹ tó” fi àkókò iṣáájú tí πρὸ τοῦ sọ hàn, “béèrè lọ́wọ́ rẹ̀” sì jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún bíbéèrè ohun kan lọ́wọ́ ẹnìkan.
theological_decisions:
- issue: Ìmọ̀ Baba ṣáájú àdúrà
  choice: A sọ ní tààrà pé Baba mọ ohun tí àwọn ọmọ-ẹ̀yìn nílò kí wọ́n tó béèrè lọ́wọ́ rẹ̀.
  alternative: Láti ṣàlàyé nínú ìtumọ̀ pé àdúrà jẹ́ ti ìbáṣepọ̀, kì í ṣe fífi ìròyìn fún Ọlọ́run, tàbí láti fi ẹ̀kọ́ pàtó nípa ìmọ̀ Ọlọ́run kún un.
  rationale: Ẹsẹ náà sọ ìmọ̀ Baba ṣáájú ìbéèrè wọn ní kedere, ṣùgbọ́n kò ṣàlàyé ìdí tí wọ́n fi ṣì gbọ́dọ̀ gbàdúrà. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́ yìí mọ́ láìyanjú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. A lo “ẹ/yín” nítorí pé àwọn arọ́pò-orúkọ Gíríìkì jẹ́ ọ̀pọ̀, a sì pa ohùn ọ̀rọ̀ mọ́ ní ọ̀nà tó níyì, tó ṣe kedere, tí àwọn òǹkàwé òde òní lè lóye.
