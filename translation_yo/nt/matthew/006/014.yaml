id: MAT.6.14
reference: Matthew 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: yo
  text: Nítorí bí ẹ bá dárí àwọn ènìyàn jì fún àwọn àṣìṣe wọn[a], Baba yín tí ń bẹ ní ọ̀run[b] yóò dárí yín jì náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìrékọjá,” “ẹ̀ṣẹ̀ sí ẹlòmíràn,” tàbí “ìwà àìtọ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìkùnà nípa ìwà tàbí gbígbé ìgbésẹ̀ tí kò tọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “Baba yín, ẹni tí í ṣe ti ọ̀run”; ìtumọ̀ ìbílẹ̀ ni “Baba yín ní ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde, “bí” sì fi gbólóhùn oní条件 ἐάν hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀφῆτε … ἀφήσει
  choice: ẹ bá dárí … jì … yóò dárí … jì
  rationale: “Dárí … jì” ni ọ̀rọ̀ Yorùbá àdánidá fún fífi ẹ̀ṣẹ̀ tàbí àṣìṣe ẹni sílẹ̀; lílo rẹ̀ ní ibi méjèèjì pa ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ènìyàn lápapọ̀, kì í ṣe ọkùnrin nìkan.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: àwọn àṣìṣe wọn
  rationale: “Àṣìṣe” lè sọ ìgbésẹ̀ tí kò tọ́ tàbí ìkùnà nípa ìwà, ó sì yẹra fún fífi παράπτωμα dọ́gba pátápátá pẹ̀lú ọ̀rọ̀ tó túmọ̀ sí “ẹ̀ṣẹ̀.” Àlàyé ìsàlẹ̀ fi àwọn ọ̀nà míì hàn.
- source_word: καὶ ὑμῖν
  choice: yín … pẹ̀lú
  rationale: “Yín” ni àfojúsùn ìdáríjì, “pẹ̀lú” sì mú ipa àfikún καί hàn.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yín ti ọ̀run
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ pé Baba náà jẹ́ ti ọ̀run mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ oní条件 láàárín dídárí àwọn ẹlòmíràn jì àti ìdáríjì Ọlọ́run
  choice: 'A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí condition gidi: “bí ẹ bá … yóò …” láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.'
  alternative: Kí a sọ pé ìdáríjì ènìyàn ló ń jẹ́ kí ènìyàn jèrè ìdáríjì Ọlọ́run, tàbí pé ó kàn jẹ́ ẹ̀rí ìdáríjì tí Ọlọ́run ti ṣe tẹ́lẹ̀.
  rationale: Gíríìkì sọ condition náà ní tààrà; ìtumọ̀ gbọ́dọ̀ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ dípò kí ó yanjú rẹ̀ sí ẹ̀gbẹ́ kan.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμεῖς ṣe jẹ́ ọ̀pọ̀, a sì lo àpẹẹrẹ Yorùbá àdánidá “dárí ẹni jì fún ohun kan.”
