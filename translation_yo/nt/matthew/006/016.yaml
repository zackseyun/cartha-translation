id: MAT.6.16
reference: Matthew 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: yo
  text: Nígbàkígbà tí ẹ bá ń gbààwẹ̀, ẹ má ṣe ṣe ojú ìrẹ̀wẹ̀sì bí àwọn alágàbàgebè, nítorí wọ́n ń sọ ojú wọn di ẹni tí kò bójú mu kí ó lè hàn sí àwọn ènìyàn pé wọ́n ń gbààwẹ̀. Lóòótọ́ ni mo sọ fún yín, wọ́n ti gba ìsanwó wọn ní kíkún.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Nígbàkígbà tí ẹ bá ń gbààwẹ̀
  rationale: “Nígbàkígbà” mú ìtumọ̀ àkókò tí ó lè máa ṣẹlẹ̀ léraléra jáde; “ẹ bá ń gbààwẹ̀” sì ṣàfihàn àṣà gbígbààwẹ̀ ní gbogbogbòò.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: ẹ má ṣe mú ojú bàjẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé kí wọn má ṣe mọ̀ọ́mọ̀ gba ìrísí ìbànújẹ́; àfihàn ojú jẹ́ ohun pàtàkì nínú àyíká ẹsẹ̀ náà.
- source_word: ὡς οἱ ὑποκριταὶ
  choice: bí àwọn alágàbàgebè
  rationale: “Alágàbàgebè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tó ń fi ara hàn ní ọ̀nà tí kò bá ohun tó wà nínú rẹ̀ mu.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: wọ́n ń ba ojú wọn jẹ́
  rationale: Ó pa àwòrán ojú inú orísun mọ́, ó sì lè ní ìtumọ̀ mímú kí ojú rí bí ẹni tí ó rẹ̀ tàbí tí ó ń jìyà.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: kí ó lè hàn sí àwọn ènìyàn pé wọ́n ń gbààwẹ̀
  rationale: Ó pa ìdí tí wọ́n fi ṣe bẹ́ẹ̀ mọ́, ó sì tú ἀνθρώποις ní ìtumọ̀ gbogbogbòò rẹ̀ gẹ́gẹ́ bí “àwọn ènìyàn.”
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Ó jẹ́ gbólóhùn Yorùbá adayébá, ọlọ́lá, tó sì pa agbára ìjẹ́rìí ọ̀rọ̀ Jesu mọ́.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: wọ́n ti gba èrè wọn ní kíkún
  rationale: 'Ó mú àṣà ọ̀rọ̀ ìṣòwò inú Gíríìkì jáde: wọ́n ti gba gbogbo ohun tí wọ́n ń retí, kò sì sí èrè mìíràn tó ṣẹ́ kù nínú ọ̀rọ̀ náà.'
theological_decisions:
- issue: Ìtumọ̀ gbogbogbòò τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Nínú àyíká yìí, ἄνθρωποι ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; “àwọn ènìyàn” ni Yorùbá adayébá tó pa ìtumọ̀ náà mọ́.
- issue: Agbára àṣà ọ̀rọ̀ ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: wọ́n ti gba èrè wọn ní kíkún
  alternative: wọ́n ní èrè wọn
  rationale: “Ní kíkún” fi hàn pé èrè ìyìn ènìyàn ni gbogbo ohun tí wọ́n ti rí gbà, láìfi ẹ̀kọ́ ẹ̀sìn mìíràn tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lasán. A lo arọ́pò-orúkọ ọ̀pọ̀ ènìyàn “ẹ/yín” láti bá νηστεύητε àti ὑμῖν mu.
