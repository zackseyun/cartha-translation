  source_fidelity: Ìtumọ̀ náà mú ìbáṣepọ̀ àkókò, ìkìlọ̀ lòdì sí ìfihàn-ara, ìdí tí àwọn alágàbàgebè fi ń ṣe e, àti ìtumọ̀ ọrọ̀-ìṣòwò ti ἀπέχουσιν ... μισθόν wọnú Yorùbá dáadáa. Ṣùgbọ́n “mú ojú bàjẹ́” kì í ṣe ìtumọ̀ adayébá tó pé fún σκυθρωποί; ó lè túmọ̀ sí ibajẹ ojú tàbí mímú un bàjẹ́, nígbà tí Gíríìkì ń tọ́ka sí ìrísí ìbànújẹ́/ìrẹ̀wẹ̀sì tí a gbà ní ìfẹ́fẹ̀ẹ́. “Ba ojú wọn jẹ́” sì dá ìṣe ìbàjẹ́ ojú gidi lójú ju ìṣe ṣíṣe ojú wọn ní ìrísí tí kò bójú mu lọ.
  naturalness: Ìyókù gbólóhùn náà jẹ́ Yorùbá boṣewa tó rọrùn, pẹ̀lú àmì ohùn tó pé ní gbogbogbòò. “Ẹ má ṣe ṣe ojú ìrẹ̀wẹ̀sì” àti “wọ́n ń sọ ojú wọn di ẹni tí kò bójú mu” jẹ́ ìsọ̀rọ̀ adayébá síi, ó sì yà ìpín méjèèjì ti Gíríìkì sọ́tọ̀ ní kedere.
  terminology: “Àwọn alágàbàgebè” yẹ fún ὑποκριταί nínú àyíká yìí. “Àwọn ènìyàn” ṣàfihàn ìtumọ̀ gbogbogbòò τοῖς ἀνθρώποις dáadáa. “Èrè wọn ní kíkún” lè ṣiṣẹ́, ṣùgbọ́n “ìsanwó wọn ní kíkún” mú àwòrán ìsanwó/gbígba ohun tó yẹ ẹni kan ní Gíríìkì hàn ní kedere, láìyi ìtumọ̀ ẹ̀kọ́ ìsìn padà.
