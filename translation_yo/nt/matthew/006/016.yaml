revisions:
- from: Nígbàkígbà tí ẹ bá ń gbààwẹ̀, ẹ má ṣe mú ojú bàjẹ́ bí àwọn alágàbàgebè, nítorí wọ́n ń ba ojú wọn jẹ́ kí ó lè hàn sí àwọn ènìyàn pé wọ́n ń gbààwẹ̀. Lóòótọ́ ni mo sọ fún yín, wọ́n ti gba èrè wọn ní kíkún.
  to: Nígbàkígbà tí ẹ bá ń gbààwẹ̀, ẹ má ṣe ṣe ojú ìrẹ̀wẹ̀sì bí àwọn alágàbàgebè, nítorí wọ́n ń sọ ojú wọn di ẹni tí kò bójú mu kí ó lè hàn sí àwọn ènìyàn pé wọ́n ń gbààwẹ̀. Lóòótọ́ ni mo sọ fún yín, wọ́n ti gba ìsanwó wọn ní kíkún.
  rationale: A tún “mú ojú bàjẹ́” ṣe sí “ṣe ojú ìrẹ̀wẹ̀sì” láti pa σκυθρωποί mọ́ gẹ́gẹ́ bí ìrísí ìrẹ̀wẹ̀sì tí a gbà. A tún “ba ojú wọn jẹ́” ṣe sí “sọ ojú wọn di ẹni tí kò bójú mu” láti fi ἀφανίζουσιν hàn gẹ́gẹ́ bí ìṣètò ìrísí ojú fún ìfihàn-ara, kì í ṣe ìpalára ojú. “Ìsanwó ... ní kíkún” ń gbé ọ̀rọ̀-ìṣòwò ἀπέχουσιν τὸν μισθὸν αὐτῶν kalẹ̀ ní kedere.
