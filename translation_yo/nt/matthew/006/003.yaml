  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ìwọ bá ń ṣe ìtọrẹ fún àwọn aláìní[a], má ṣe jẹ́ kí ọwọ́ òsì rẹ mọ̀ ohun tí ọwọ́ ọ̀tún rẹ ń ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ìwọ bá ń ṣe ìfúnni àánú”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífún àwọn tálákà tàbí aláìní ní ohun ìrànlọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Ṣùgbọ́n nígbà tí ìwọ bá ń ṣe
  rationale: Ọ̀rọ̀ yìí fi ohun tí Jésù ń sọ yàtọ̀ sí ìṣe tí ó ṣẹ̀ṣẹ̀ dá lẹ́bi, ó sì túmọ̀ ọ̀nà gbólóhùn genitive absolute náà sí Yorùbá àdánidá láìsọ ìtumọ̀ rẹ̀ nù.
- source_word: ἐλεημοσύνην
  choice: àánú fún àwọn aláìní
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífún àwọn tálákà tàbí aláìní ní ohun ìrànlọ́wọ́. Yíyan ọ̀rọ̀ yìí jẹ́ èyí tí òǹkàwé òde òní lè lóye, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ míì hàn.
- source_word: μὴ γνώτω
  choice: má ṣe jẹ́ kí ... mọ
  rationale: Èyí ṣàfihàn àṣẹ ìdènà ẹni kẹta ní Yorùbá àdánidá, ó sì pa àkàwé tí ó sọ ọwọ́ di bí ẹni pé ó lè mọ̀ mọ́.
- source_word: ἡ ἀριστερά σου
  choice: ọwọ́ òsì rẹ
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán àti ìfiwé méjèèjì inú ọ̀rọ̀ náà mọ́.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ohun tí ọwọ́ ọ̀tún rẹ ń ṣe
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ ‘ń ṣe’ bá present ποιεῖ mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ àkàwé nípa ọwọ́ òsì àti ọwọ́ ọ̀tún
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí ìkìlọ̀ líle lòdì sí fífi ìtọrẹ hàn fún ìyìn ara ẹni.
  alternative: Tú u sí àlàyé pé kí ènìyàn kàn jẹ́ onírẹ̀lẹ̀, tàbí pé gbogbo fífúnni ní gbangba jẹ́ èèwọ̀.
  rationale: Ọ̀rọ̀ orísun lo àkàwé alágbára àti àsọdùn. Pípa àwòrán náà mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó le ju ohun tí ẹsẹ náà sọ lọ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣe kedere ni a lò. Àmì ohùn wà níbi tí ó yẹ; àwòrán ọwọ́ òsì àti ọwọ́ ọ̀tún sì dúró gẹ́gẹ́ bí ó ti rí nínú orísun.
