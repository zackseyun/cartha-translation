id: MAT.6.33
reference: Matthew 6:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa kọ́kọ́ wá ìjọba rẹ̀ àti òdodo rẹ̀[a], gbogbo nǹkan wọ̀nyí ni a ó sì fi kún un fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo tàbí ìdájọ́ òdodo. Ní àyíká yìí, “òdodo” ń pa ìbáṣepọ̀ tí ó tọ́ pẹ̀lú Ọlọ́run àti ìwà tí ó bá ìfẹ́ rẹ̀ mu mọ́, kì í ṣe ìdájọ́ láwùjọ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: ẹ máa ... wá
  rationale: Ọ̀rọ̀ àṣẹ oníṣe-títẹ̀síwájú yìí ń pe ọ̀pọ̀ ènìyàn sí ìwá kiri tàbí lílépa ohun kan nígbà gbogbo; ‘ẹ máa ... wá’ mú ìtẹ̀síwájú náà hàn ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ìlépa àwọn ohun ìní ayé àti àníyàn tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó pa ìtumọ̀ ipò àkọ́kọ́ àti ohun tí ó yẹ kí a fi síwájú mọ́ láìṣe àlàyé ju ọ̀rọ̀ orísun lọ.
- source_word: βασιλείαν
  choice: ìjọba
  rationale: ‘Ìjọba’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún βασιλεία, ó sì lè gba ìtumọ̀ agbègbè ìjọba àti ìṣàkóso ọba.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: ‘Òdodo’ ní ààyè láti túmọ̀ sí jíjẹ́ ẹni tí ó tọ́ níwájú Ọlọ́run àti ìwà tí ó bá ìfẹ́ rẹ̀ mu; kò fi ọ̀rọ̀ náà mọ́ ìdájọ́ tàbí ìṣèdájọ́ láwùjọ nìkan.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́; ẹni tí ó ń tọ́ka sí ni Ọlọ́run/Baba gẹ́gẹ́ bí ọ̀rọ̀ àyíká ṣe fi hàn.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó tọ́ka padà sí oúnjẹ, ohun mímu, àti aṣọ tí a mẹ́nu kàn nínú ọ̀rọ̀ àyíká.
- source_word: προστεθήσεται
  choice: yóò ... di fífi kún un
  rationale: Ìtumọ̀ yìí pa àkójọpọ̀ ọjọ́ iwájú àti ohùn àfarawà mọ́, ó sì fi èrò pé a ó fi àwọn nǹkan náà kún ohun pàtàkì tí wọ́n ń lépa hàn.
- source_word: ὑμῖν
  choice: fún yín
  rationale: ‘Fún yín’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ẹni tí yóò jèrè ìfikún náà hàn.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Nínú Mátíù, ọ̀rọ̀ náà gbòòrò ju ìdájọ́ láwùjọ lọ; ó ní jíjẹ́ ẹni tí ó tọ́ àti ìwà tí ó bá ìfẹ́ Ọlọ́run mu. A fi àṣàyàn tó ní ìtumọ̀ justice sínú àlàyé ìsàlẹ̀.
- issue: Ẹni tí αὐτοῦ ń tọ́ka sí
  choice: rẹ̀
  alternative: ti Ọlọ́run
  rationale: Arọ́pò-orúkọ náà ni a pa mọ́ gẹ́gẹ́ bí Gíríìkì; ọ̀rọ̀ àyíká mú un ṣe kedere pé Ọlọ́run/Baba ni ẹni tí a ń tọ́ka sí.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. Fọ́ọ̀mù ‘ẹ’ fi hàn pé àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn.
