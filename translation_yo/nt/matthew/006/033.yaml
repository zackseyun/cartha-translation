review_pass:
  verdict: revise
  source_fidelity: 'The principal terms are accurately represented: ‘ẹ máa ... wá’ conveys the present imperative, ‘kọ́kọ́’ preserves priority, and ‘ìjọba rẹ̀’ and ‘òdodo rẹ̀’ retain the Greek pronoun and the breadth of βασιλεία and δικαιοσύνη. The final clause in the draft, however, is not a sound Yoruba rendering of the future passive προστεθήσεται ὑμῖν.'
  naturalness: ‘gbogbo nǹkan wọ̀nyí yóò sì di fífi kún un fún yín’ is grammatically cumbersome and unnatural. The established, natural Yoruba construction ‘gbogbo nǹkan wọ̀nyí ni a ó sì fi kún un fún yín’ clearly expresses that these things will be added for/to the hearers.
  terminology: ‘Ìjọba’ and ‘òdodo’ are appropriate Standard Yoruba biblical terms. The footnote’s alternative is best stated as ‘ìdájọ́ òdodo,’ while explaining that δικαιοσύνη can include justice as well as righteousness; this avoids implying that the word means only a judicial verdict.
  issues:
  - severity: high
    issue: Unnatural and defective rendering of προστεθήσεται
    rationale: The phrase ‘yóò sì di fífi kún un’ is an awkward nominalized construction and does not idiomatically express ‘will be added.’ Recasting with ‘ni a ó sì fi kún un fún yín’ gives a natural future passive/indefinite-agent equivalent without adding theological interpretation.
  - severity: low
    issue: Footnote explanation is stylistically imprecise
    rationale: The existing explanation contrasts ‘òdodo’ with ‘ìdájọ́ tàbí òdodo láwùjọ,’ which is repetitive and can misleadingly reduce justice to a verdict. A concise explanation better preserves the lexical alternative.
  revised_text: Ṣùgbọ́n ẹ máa kọ́kọ́ wá ìjọba rẹ̀ àti òdodo rẹ̀[a], gbogbo nǹkan wọ̀nyí ni a ó sì fi kún un fún yín.
