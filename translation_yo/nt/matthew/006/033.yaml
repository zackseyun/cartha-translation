revisions:
- from: Ṣùgbọ́n ẹ máa kọ́kọ́ wá ìjọba rẹ̀ àti òdodo rẹ̀[a], gbogbo nǹkan wọ̀nyí yóò sì di fífi kún un fún yín.
  to: Ṣùgbọ́n ẹ máa kọ́kọ́ wá ìjọba rẹ̀ àti òdodo rẹ̀[a], gbogbo nǹkan wọ̀nyí ni a ó sì fi kún un fún yín.
  rationale: The revision replaces only the non-idiomatic final clause with a standard natural Yoruba construction for ‘all these things will be added to you.’ It retains the ongoing directive, priority, pronoun ambiguity, and the lexical breadth of ‘righteousness,’ with the justice alternative maintained in the footnote.
  reviewer_model: gpt-5.6-terra
