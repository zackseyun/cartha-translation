id: MAT.6.2
reference: Matthew 6:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: yo
  text: Nítorí náà, nígbàkigbà tí o bá ń fún àwọn aláìní[a], má ṣe fun kàkàkí níwájú rẹ[b], bí àwọn agabagebe ti ń ṣe nínú àwọn sínágọ́gù àti ní àwọn òpópónà, kí àwọn ènìyàn lè fi ògo fún wọn[c]. Lóòótọ́ ni mo wí fún yín, wọ́n ti gba gbogbo ẹ̀san wọn tán[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí o bá ń ṣe iṣẹ́ àánú.” Gbólóhùn Gíríìkì náà ń tọ́ka sí fífúnni láti ran àwọn aláìní lọ́wọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “má ṣe fi kàkàkí kéde rẹ̀.” Ó ṣeé ṣe kí gbólóhùn náà jẹ́ àsọdùn tàbí àkàwé, ṣùgbọ́n Gíríìkì sọ ní tààrà pé, “má ṣe fun kàkàkí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí àwọn ènìyàn lè yìn wọn” tàbí “bu ọlá fún wọn.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “fi ògo fún.”
    reason: lexical_alternative
  - marker: d
    text: 'Gbólóhùn náà jẹ́ ọ̀nà ọ̀rọ̀ ìṣòwò: wọ́n ti gba ẹ̀san wọn ní kíkún, kò sì sí ẹ̀san mìíràn tí wọ́n máa rí.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Nítorí náà, nígbàkigbà tí
  rationale: “Nítorí náà” pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ ohun tó ṣáájú, “nígbàkigbà tí” sì fi hàn pé ó jẹ́ ipò tí ó lè máa ṣẹlẹ̀ léraléra.
- source_word: ποιῇς ἐλεημοσύνην
  choice: tí o bá ń ṣe àánú fún àwọn aláìní
  rationale: Gbólóhùn Gíríìkì náà tọ́ka sí fífún àwọn tálákà tàbí aláìní gẹ́gẹ́ bí iṣẹ́ àánú; èyí jẹ́ Yorùbá àdánidá tí ó ṣe kedere.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: má ṣe fun kàkàkí níwájú rẹ
  rationale: A pa àwòrán kàkàkí inú orísun mọ́ láì pinnu bóyá àsọdùn, àkàwé, tàbí ohun gidi ni.
- source_word: οἱ ὑποκριταὶ
  choice: àwọn alágàbàgebè
  rationale: Ọ̀rọ̀ Yorùbá yìí dára fún àwọn tó ń ṣe ìfọkànsìn fún ìfihàn, kì í ṣe láti inú òtítọ́ ọkàn.
- source_word: συναγωγαῖς
  choice: àwọn sínágọ́gù
  rationale: A lo ọ̀rọ̀ tí a ti mọ̀ fún ibi ìpàdé àti ìjọsìn àwọn Júù.
- source_word: ῥύμαις
  choice: àwọn òpópónà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn ọ̀nà gbangba níbi tí àwọn ènìyàn ti lè rí wọn.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: kí àwọn ènìyàn lè fi ògo fún wọn
  rationale: Èyí pa agbára δοξάζω mọ́ ju “yìn” lọ, ó sì tú ἀνθρώπων sí ìtumọ̀ gbogbogbò rẹ̀, ìyẹn àwọn ènìyàn.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá ọlọ́lá àti àdánidá fún ọ̀rọ̀ ìjẹ́rìí aláṣẹ yìí.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: wọ́n ti gba gbogbo èrè wọn tán
  rationale: “Gbogbo ... tán” mú ìtumọ̀ òwe ìṣòwò náà jáde pé wọ́n ti gba ẹ̀san náà ní kíkún, kò sì sí èyí mìíràn tó kù.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώπων gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin; àwọn ẹlòmíràn
  rationale: Níhìn-ín ọ̀rọ̀ náà ń tọ́ka sí gbogbo àwọn olùwòran ènìyàn, kì í ṣe akọ nìkan.
- issue: Agbára ọ̀rọ̀ δοξασθῶσιν
  choice: fi ògo fún wọn
  alternative: yìn wọn; bu ọlá fún wọn
  rationale: “Fi ògo fún” pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì dá ìyàtọ̀ tó wà láàárín ìyìn ènìyàn àti èrè Ọlọ́run dúró láì túmọ̀ rẹ̀ kọjá ohun tí ẹsẹ̀ náà sọ.
- issue: Ìwòye àwòrán kàkàkí
  choice: A pa ọ̀rọ̀ gidi “fun kàkàkí” mọ́
  alternative: má ṣe kéde rẹ̀; má ṣe fọnnu nípa rẹ̀
  rationale: Orísun kò sọ ní kedere bóyá àsọdùn, àkàwé, tàbí ìṣe gidi ni; ìtumọ̀ náà kò gbọ́dọ̀ yanjú àìdánilójú yìí láìní ẹ̀rí.
translation_notes:
  register: A lo Yorùbá tí ó lọ́lá, tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ ẹ̀kọ́ Jesu mu. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Alágàbàgebè,” “sínágọ́gù,” àti “fi ògo fún” pa ìṣúra ọ̀rọ̀ ẹsẹ̀ náà mọ́, nígbà tí ìṣètò gbólóhùn jẹ́ ti Yorùbá òde òní.
