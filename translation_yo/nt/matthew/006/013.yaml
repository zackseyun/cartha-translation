  verdict: revise
  source_fidelity: 'Ìdáhùn àkọ́kọ́ náà ń tẹ̀lé ìbéèrè méjèèjì nínú Gíríìkì dáadáa: ìbéèrè pé kí a má ṣe mú àwọn tó ń gbàdúrà wọ inú πειρασμόν, àti ìbéèrè ìgbàlà kúrò lọ́dọ̀ τοῦ πονηροῦ. Ṣùgbọ́n ‘ẹni ibi náà’ dà bí ẹni búburú kan tí a ti mẹ́nu kàn tẹ́lẹ̀, ó sì jẹ́ ìtumọ̀ ẹni-kọọkan tí kò dára ní Yorùbá fún ìrísí Gíríìkì tí ó jẹ́ àìdánilójú. ‘Ibi’ nínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú àlàyé ìsàlẹ̀ fún ìtumọ̀ ẹni-kọọkan, dá àìdánilójú orísun náà síi.'
  naturalness: ‘Má sì mú wa wọ inú ìdẹwò’ àti ‘gbà wá lọ́wọ́ ibi’ jẹ́ Yorùbá boṣewa, ìròyìn àdúrà, tí ó sì rọrùn láti lóye. Àlàyé [a] yẹ kí ó lo ‘ìfẹ́kúfẹ̀ẹ́ láti dẹ́ṣẹ̀’ dípò ‘ìtànná sí ẹ̀ṣẹ̀,’ nítorí èyí jẹ́ ọ̀nà ìsọ̀rọ̀ tó mọ́gbọ́n dání fún ìtumọ̀ ‘temptation’ níhìn-ín.
  terminology: Ìdẹwò jẹ́ àṣàyàn tó bójú mu fún πειρασμόν, pẹ̀lú ‘àdánwò’ àti ‘ìpọ́njú’ nínú àlàyé. ‘Gbà wá lọ́wọ́’ jẹ́ ìtumọ̀ àdánidá fún ῥῦσαι. Fún τοῦ πονηροῦ, ‘ibi’ ń fi ìtumọ̀ àárín (neuter) sílẹ̀ nínú ọ̀rọ̀ àkọ́kọ́, nígbà tí ‘Ẹni Búburú náà’ nínú àlàyé ń pa ìṣeéṣe akọ (masculine) mọ́.
  issues:
