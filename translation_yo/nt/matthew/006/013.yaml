    rationale: Ó lè túmọ̀ sí ‘ẹni búburú yẹn náà,’ tí ó ń fi olùtọ́kasí kan tí a ti mọ̀ sínú ẹsẹ̀. Ó tún yan ìtumọ̀ akọ níbi tí Gíríìkì fi àìdánilójú akọ/àárín sílẹ̀.
