id: MAT.6.13
reference: Matthew 6:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: yo
  text: Má sì mú wa wọ inú ìdẹwò[a], ṣùgbọ́n gbà wá lọ́wọ́ ibi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àdánwò” tàbí “ìpọ́njú.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìfẹ́kúfẹ̀ẹ́ láti dẹ́ṣẹ̀ tàbí sí ipò líle tí ń dán ènìyàn wò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹni Búburú náà.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí “ibi” tàbí “Ẹni Búburú náà.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: má sì mú wa wọ inú
  rationale: 'Ọ̀rọ̀ yìí pa ìbéèrè àdúrà náà mọ́ ní tààràtà: kí Ọlọ́run má mú wa wọ inú ipò náà. A kò túmọ̀ rẹ̀ sí ‘má ṣe jẹ́ kí a wọ’ nítorí ìyẹn yóò fi àlàyé tí kò sí ní tààràtà sínú ọ̀rọ̀ Gíríìkì.'
- source_word: πειρασμόν
  choice: ìdẹwò
  rationale: ‘Ìdẹwò’ jẹ́ ọ̀rọ̀ Yorùbá tó bá ìtànná sí ẹ̀ṣẹ̀ mu, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí àdánwò tàbí ìpọ́njú tí ń dán ènìyàn wò; àṣàyàn yẹn wà nínú àlàyé ìsàlẹ̀.
- source_word: ῥῦσαι
  choice: gbà wá lọ́wọ́
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbàlà tàbí ìránnilọ́wọ́ kúrò nínú ewu, ó sì fi iṣẹ́ ìgbàlà Ọlọ́run hàn ní kedere.
- source_word: τοῦ πονηροῦ
  choice: ẹni ibi náà
  rationale: Àṣàyàn yìí ka ọ̀rọ̀ náà sí akọ tí ó ń tọ́ka sí ẹni kan, ‘ẹni ibi náà,’ láì fi orúkọ Èṣù sínú ẹsẹ̀. Níwọ̀n bí ìrísí Gíríìkì náà tún ṣe lè jẹ́ àárín tí ó túmọ̀ sí ‘ibi,’ a pa àṣàyàn kejì mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ τοῦ πονηροῦ
  choice: ẹni ibi náà
  alternative: ibi
  rationale: Ìrísí Gíríìkì náà lè tọ́ka sí ẹni ibi kan tàbí sí ibi ní àpapọ̀. Ọ̀rọ̀ inú ẹsẹ̀ yan ìtumọ̀ ẹni-kọọkan, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú gidi inú ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìró àdúrà tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Gbà wá lọ́wọ́’ jẹ́ gbólóhùn Yorùbá àdánidá; ‘ẹni ibi náà’ yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé ọ̀rọ̀ Gíríìkì lórí.
