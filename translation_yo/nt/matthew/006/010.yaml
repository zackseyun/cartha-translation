id: MAT.6.10
reference: Matthew 6:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: yo
  text: Kí ìjọba rẹ dé; kí ìfẹ́ rẹ ṣẹ[a], gẹ́gẹ́ bí ó ti rí ní ọ̀run, bẹ́ẹ̀ náà ni ní ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ó ṣeé ṣe: “Kí ìjọba rẹ dé; kí ìfẹ́ rẹ ṣẹ, gẹ́gẹ́ bí ó ti rí ní ọ̀run, bẹ́ẹ̀ náà ni ní ayé,” níbi tí a ti lè lóye “gẹ́gẹ́ bí ó ti rí ní ọ̀run, bẹ́ẹ̀ náà ni ní ayé” pé ó kan àwọn ẹ̀bẹ̀ méjèèjì.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: Kí ... dé
  rationale: Ọ̀rọ̀ àṣẹ ẹni-kẹta yìí ń sọ ẹ̀bẹ̀ sí Ọlọ́run. “Kí ... dé” jẹ́ ọ̀nà àdúrà tó ṣe déédéé ní Yorùbá, ó sì pa ìtumọ̀ wíwá tàbí dídé mọ́.
- source_word: βασιλεία
  choice: ìjọba
  rationale: “Ìjọba” lè tọ́ka sí agbára ìṣàkóso àti ilẹ̀ ọba; ó bá lílo βασιλεία mu ní Mátíù láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: γενηθήτω
  choice: kí ... ṣẹ
  rationale: Pẹ̀lú θέλημα, “kí ... ṣẹ” sọ ní ti ẹ̀dá pé kí ohun tí Ọlọ́run fẹ́ wá sí ìmúṣẹ. Ó tún yẹra fún fífi olùṣe kan tí Gíríìkì kò dárúkọ kún un.
- source_word: θέλημα
  choice: ìfẹ́
  rationale: “Ìfẹ́” níhìn-ín túmọ̀ sí ohun tí ẹnì kan fẹ́ tàbí pinnu, kì í ṣe ìfẹ́ni; àyíká gbólóhùn náà mú ìtumọ̀ yìí ṣe kedere.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra hàn ní kedere, bí ὡς ṣe rí nínú Gíríìkì.
- source_word: ἐν οὐρανῷ
  choice: ní ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ibi ọ̀run nínú ìyàtọ̀ ọ̀run àti ayé.
- source_word: καὶ ἐπὶ γῆς
  choice: bẹ́ẹ̀ náà ní ayé
  rationale: Nínú àkójọpọ̀ ὡς ... καί, “gẹ́gẹ́ bí ... bẹ́ẹ̀ náà ...” ń mú ìfiwéra náà jáde lọ́nà Yorùbá tó ṣe déédéé, nígbà tí “ní ayé” fi ìtumọ̀ ἐπὶ γῆς hàn.
theological_decisions:
- issue: Ibi tí gbólóhùn ìfiwéra ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς dé mọ́
  choice: Nínú ọ̀rọ̀ pàtàkì, a so ó mọ́ ẹ̀bẹ̀ kejì, “kí ìfẹ́ rẹ ṣẹ,” nítorí pé èyí ni gbólóhùn tó sún mọ́ ọn jù.
  alternative: A lè lóye “gẹ́gẹ́ bí ní ọ̀run, bẹ́ẹ̀ náà ní ayé” gẹ́gẹ́ bí ohun tó kan “kí ìjọba rẹ dé” àti “kí ìfẹ́ rẹ ṣẹ” papọ̀.
  rationale: Àmì ìdádúró inú àwọn àtẹ̀jáde Gíríìkì òde òní jẹ́ ti àwọn olóòtú, ìṣètò ọ̀rọ̀ náà sì lè gba ìtumọ̀ méjèèjì. A fi ìtumọ̀ tó sún mọ́ gírámà jù sínú ọ̀rọ̀ pàtàkì, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu fún àdúrà ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Kí ... dé” àti “kí ... ṣẹ” jẹ́ ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣì ṣe kedere fún òǹkàwé òde òní. A pa ìṣètò ìfiwéra Gíríìkì mọ́ ní “gẹ́gẹ́ bí ní ọ̀run, bẹ́ẹ̀ náà ní ayé.”
