  source_fidelity: Ìtumọ̀ náà gbé ìfòfindè μή οὖν μεριμνήσητε kalẹ̀ dáadáa gẹ́gẹ́ bí ìkìlọ̀ lòdì sí ìṣàníyàn, ó sì fi ‘Nítorí náà’ hàn fún οὖν. ‘Pé’ ń ṣiṣẹ́ ní Yorùbá gẹ́gẹ́ bí ìfihàn àkóónú ọ̀rọ̀ tí a ń sọ; àwọn ìbéèrè ọjọ́ iwájú mẹ́ta náà sì bá φάγωμεν, πίωμεν, àti περιβαλώμεθα mu. ‘A ó wọ̀’ jẹ́ ìtumọ̀ àdánidá fún wíwọ aṣọ nínú àyíká yìí.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa tí ó yege, ó ní àmì ohùn tó yẹ, ó sì pa ìlànà ìbánisọ̀rọ̀ ọlọ́wọ̀ sí mọ́. Lílò ‘ẹ’ nínú àṣẹ àti ‘a’ nínú àwọn ìbéèrè jẹ́ ọ̀nà àdánidá láti sọ ìbéèrè gbogbogbò tí ń tọ́ka sí àníyàn àwọn olùgbọ́.
  terminology: ‘Ṣàníyàn’ bá ìtumọ̀ μεριμνάω nínú àyíká ìpèsè ohun ìgbẹ́mìíró mu dáadáa, láì túmọ̀ ọ̀rọ̀ náà sí ìfòfindè lòdì sí gbogbo ìmúrasílẹ̀ ọlọ́gbọ́n. Àlàyé ìsàlẹ̀ náà fúnni ní yíyàn ìtumọ̀ tó ṣì wà nínú àgbègbè ìtumọ̀ ọ̀rọ̀ náà.
