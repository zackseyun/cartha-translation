id: MAT.6.31
reference: Matthew 6:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe ṣàníyàn[a] pé, ‘Kí ni a ó jẹ?’ tàbí, ‘Kí ni a ó mu?’ tàbí, ‘Kí ni a ó wọ̀?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ẹ má ṣe jẹ́ kí àníyàn bá yín.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Nítorí náà, ẹ má ṣe ṣàníyàn
  rationale: ‘Nítorí náà’ fi ìtumọ̀ ìyọrísí οὖν hàn. ‘Ẹ má ṣe ṣàníyàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfòfindè ìbànújẹ́-ọkàn nípa ohun èlò; ó sì bá μή pẹ̀lú aorist subjunctive mu láì sọ pé a kò gbọdọ̀ gbèrò lọ́nà tó bójú mu.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá, ‘pé’ ló ṣàdánidá jù láti mú àwọn ìbéèrè taara wọlé gẹ́gẹ́ bí ohun tí ìṣàníyàn ń sọ, bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì lo participle ‘ní sísọ’.
- source_word: Τί
  choice: Kí ni
  rationale: ‘Kí ni’ ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ìbéèrè nípa ohun tí a nílò.
- source_word: φάγωμεν
  choice: a ó jẹ
  rationale: Fọ́ọ̀mù náà jẹ́ deliberative subjunctive nípa ìpèsè ọjọ́ iwájú; ‘a ó jẹ’ mú ìtumọ̀ ọjọ́ iwájú yẹn jáde ní Yorùbá àdánidá.
- source_word: πίωμεν
  choice: a ó mu
  rationale: Ó tẹ̀ lé φάγωμεν gẹ́gẹ́ bí ìbéèrè nípa ohun tí a ó rí mu ní ọjọ́ iwájú.
- source_word: περιβαλώμεθα
  choice: a ó wọ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí wíwọ aṣọ; ‘a ó wọ̀’ ṣe kúkúrú, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἤ ... ἤ ... ἤ
  choice: tàbí ... tàbí ... tàbí
  rationale: Àtúnsọ ‘tàbí’ pa ìtòlẹ́sẹẹsẹ àwọn ìbéèrè mẹ́ta náà mọ́.
theological_decisions:
- issue: Irú ìfòfindè tí Jésù ṣe nípa àwọn ohun kòṣeémáàní
  choice: Túmọ̀ μεριμνήσητε gẹ́gẹ́ bí ìfòfindè ìṣàníyàn, kì í ṣe ìfòfindè gbogbo ètò ọlọ́gbọ́n.
  alternative: Ẹ má ṣe bìkítà rárá.
  rationale: Àyíká ọ̀rọ̀ náà ń bá ìṣàníyàn nípa oúnjẹ, ohun mímu àti aṣọ wí; kò sọ pé ìmúrasílẹ̀ tàbí ètò tó bójú mu jẹ́ ohun tí kò tọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ohùn ọ̀rọ̀ náà ní ọlá, ó ṣe kedere, ó sì rọrùn fún òǹkàwé òde òní. A lo ‘ẹ’ láti fi hàn pé àṣẹ náà ń tọ́ka sí ọ̀pọ̀ ènìyàn.
