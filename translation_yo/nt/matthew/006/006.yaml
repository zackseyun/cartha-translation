id: MAT.6.6
reference: Matthew 6:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ìwọ bá ń gbàdúrà, wọ yàrá ìkọ̀kọ̀ rẹ[a]; tí o bá ti ilẹ̀kùn rẹ pa, gbàdúrà sí Baba rẹ tí ó wà ní ìkọ̀kọ̀. Baba rẹ, ẹni tí ó ń rí ní ìkọ̀kọ̀, yóò san ẹ̀san fún ọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘yàrá inú,’ ‘yàrá ìpamọ́,’ tàbí ‘yàrá kékeré.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí yàrá inú tí a lè lò fún ìfarapamọ́ tàbí fífi nǹkan pamọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘yóò san án padà fún ọ.’ Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ‘dá padà,’ ‘san padà,’ tàbí ‘san ẹ̀san,’ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ṣùgbọ́n nígbà tí ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìwọ ni a fi hàn kedere láti pa ìtakora mọ́ pẹ̀lú àwọn alágàbàgebè tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
- source_word: ὅταν προσεύχῃ
  choice: nígbà tí ìwọ bá ń gbàdúrà
  rationale: Àkójọpọ̀ ὅταν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń tọ́ka sí ohun tí ó máa ń ṣẹlẹ̀; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì fi àṣà àdúrà tí a ń ṣe hàn.
- source_word: εἴσελθε
  choice: wọ inú
  rationale: Ó sọ àṣẹ láti wọ ibi kan ní kedere, ní èdè Yorùbá tó rọrùn.
- source_word: ταμεῖόν
  choice: yàrá inú ilé
  rationale: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ yàrá inú ilé tí a fi ń tọ́jú nǹkan tàbí tí a ti lè dá wà. ‘Yàrá inú ilé’ pa èrò ibi tó farasin mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: κλείσας τὴν θύραν σου
  choice: lẹ́yìn tí o bá sì sé ilẹ̀kùn rẹ
  rationale: Ó fi hàn pé títí ilẹ̀kùn ṣẹlẹ̀ ṣáájú àdúrà, gẹ́gẹ́ bí participle aorist ṣe tọ́ka sí.
- source_word: πρόσευξαι
  choice: gbàdúrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tààrà, tó wọ́pọ̀ fún fífi àdúrà sí Ọlọ́run.
- source_word: τῷ πατρί σου
  choice: sí Baba rẹ
  rationale: A pa ọ̀rọ̀ ìbátan ‘Baba rẹ’ mọ́ láì fi ‘ọ̀run’ kún un, nítorí kò sí nínú gbólóhùn Gíríìkì yìí.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: tí ó wà ní ìkọ̀kọ̀
  rationale: Ó pa èrò ìfarasin mọ́, bẹ́ẹ̀ ni kò sọ ọ́ di ibi pàtó nìkan.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: ẹni tí ó ń rí ní ìkọ̀kọ̀
  rationale: A tún ‘ní ìkọ̀kọ̀’ lò láti pa àtúnlò ọ̀rọ̀ inú Gíríìkì àti ìtakora sí ìfihàn ní gbangba mọ́.
- source_word: ἀποδώσει σοι
  choice: yóò san ẹ̀san fún ọ
  rationale: Nínú àyíká yìí, gbólóhùn náà ń sọ ìdáhùn rere Baba sí àdúrà òdodo; ‘san ẹ̀san’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘san padà’ hàn.
theological_decisions:
- issue: Ìtumọ̀ àtúnlò ἐν τῷ κρυπτῷ
  choice: ní ìkọ̀kọ̀
  alternative: ní ibi ìkọ̀kọ̀; ní ìfarasin; ohun tí a ṣe ní ìkọ̀kọ̀
  rationale: A pa gbólóhùn kan náà mọ́ ní ibi méjèèjì, kí ìfarasin Baba àti rírí rẹ̀ má bàa di ìtumọ̀ ibi pàtó tàbí ohun tí a ṣe ní ìkọ̀kọ̀ nìkan.
- issue: Ìtumọ̀ πατήρ nípa Ọlọ́run
  choice: Baba
  alternative: Baba ọ̀run
  rationale: Jésù pe Ọlọ́run ní ‘Baba rẹ’ ní tààrà; a kò fi ọ̀rọ̀ tí kò sí nínú orísun kún un.
- issue: Ìtumọ̀ ἀποδώσει
  choice: yóò san ẹ̀san fún ọ
  alternative: yóò san án padà fún ọ
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìdáhùn rere Ọlọ́run, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbígbòòrò ti ọ̀rọ̀-ìṣe náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àtúnlò ‘ní ìkọ̀kọ̀’ pa ìlù àti ìtakora inú orísun mọ́; ‘ìwọ’ sì tẹnu mọ́ ẹni tí Jésù ń bá sọ̀rọ̀.
