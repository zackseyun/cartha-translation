- from: Ṣùgbọ́n nígbà tí ìwọ bá ń gbàdúrà, wọ inú yàrá inú ilé rẹ[a]; lẹ́yìn tí o bá sì sé ilẹ̀kùn rẹ, gbàdúrà sí Baba rẹ tí ó wà ní ìkọ̀kọ̀. Baba rẹ, ẹni tí ó ń rí ní ìkọ̀kọ̀, yóò san ẹ̀san fún ọ[b].
  to: Ṣùgbọ́n nígbà tí ìwọ bá ń gbàdúrà, wọ yàrá ìkọ̀kọ̀ rẹ[a]; tí o bá ti ilẹ̀kùn rẹ pa, gbàdúrà sí Baba rẹ tí ó wà ní ìkọ̀kọ̀. Baba rẹ, ẹni tí ó ń rí ní ìkọ̀kọ̀, yóò san ẹ̀san fún ọ[b].
  rationale: Àtúnṣe náà mú kí ìlànà ilẹ̀kùn náà jẹ́ Yorùbá àdánidá, ó sì yọ ìtúnlò tí kò pọ̀n dandan nínú ìtumọ̀ ταμεῖον. A pa ìtẹnumọ́ ‘ìwọ,’ àtúnlò ‘ní ìkọ̀kọ̀,’ àti ìtumọ̀ rere tí ó ṣì gbooro ti ἀποδώσει mọ́. Àwọn àmì àlàyé ìsàlẹ̀ náà dúró ní ibi tí ó yẹ, a sì ṣe kí àlàyé (a) má lo ọ̀rọ̀ àjèjì tí kò wọ́pọ̀.
