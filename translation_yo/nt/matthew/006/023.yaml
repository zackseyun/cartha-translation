id: MAT.6.23
reference: Matthew 6:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: yo
  text: Ṣùgbọ́n bí ojú rẹ bá burú[a], gbogbo ara rẹ yóò ṣókùnkùn. Ǹjẹ́ bí ìmọ́lẹ̀ tí ó wà nínú rẹ bá jẹ́ òkùnkùn, háà ni òkùnkùn náà ṣe pọ̀ tó!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibi,” “tí kò dára,” tàbí bóyá “oníwọ̀wọ́,” ní ìbámu pẹ̀lú àṣà ọ̀rọ̀ nípa “ojú” àti àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: burú
  rationale: “Burú” pa ìtumọ̀ náà mọ́ ní fífẹ̀, láì fi dandan túmọ̀ ọ́ sí ìwà ibi, àìlera ojú, tàbí àìlawọ́ nìkan; ó sì jẹ́ kí àkàwé ojú dúró ṣí sí àwọn ìtumọ̀ tó lè ní.
- source_word: σκοτεινὸν
  choice: ṣókùnkùn
  rationale: Ó túmọ̀ ànímọ́ Gíríìkì náà ní ṣókí, ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu nínú gbólóhùn “gbogbo ara rẹ yóò ṣókùnkùn.”
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà tí ó pa àkàwé ìmọ́lẹ̀ mọ́, láì ṣàlàyé rẹ̀ sí “òye inú” tàbí ìtumọ̀ ẹ̀mí kan pàtó.
- source_word: σκότος
  choice: òkùnkùn
  rationale: Ó pa ìtakora pẹ̀lú “ìmọ́lẹ̀” àti ìtẹnumọ́ ìparí ẹsẹ náà mọ́.
- source_word: πόσον
  choice: yóò ti pọ̀ tó
  rationale: Nínú gbólóhùn ìyàlẹ́nu tí kò pé ní Gíríìkì, ọ̀rọ̀ yìí ń fi ìwọ̀n hàn; “yóò ti pọ̀ tó!” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ agbára ìkìlọ̀ náà.
- source_word: ὀφθαλμός
  choice: ojú
  rationale: A pa “ojú” mọ́ gẹ́gẹ́ bí ara gidi nítorí pé àkàwé náà dá lórí ìríran, èrò inú, àti ìtọ́sọ́nà ìwà.
- source_word: ὅλον τὸ σῶμά σου
  choice: gbogbo ara rẹ
  rationale: Ìtumọ̀ yìí ṣe kedere, ó sì pa ìtẹnumọ́ ὅλον, “gbogbo,” mọ́.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: ìmọ́lẹ̀ tí ó wà nínú rẹ
  rationale: Ó tẹ̀lé ìṣètò àti ìtumọ̀ Gíríìkì pẹ́kípẹ́kí láì fi ọ̀rọ̀ “ìmọ́lẹ̀ inú” kún un, èyí tí ó lè túmọ̀ àkàwé náà jù.
theological_decisions:
- issue: Ìtumọ̀ àkàwé “ojú burúkú”
  choice: A lo “ojú rẹ bá burú” láti jẹ́ kí àkàwé náà ní ìtumọ̀ gbígbòòrò.
  alternative: A lè túmọ̀ ọ́ sí “ojú ibi,” “ojú tí kò dára,” tàbí, gẹ́gẹ́ bí àṣà ọ̀rọ̀ Sẹ́mítíkì àti àyíká ẹsẹ náà, “ojú aláìlawọ́.”
  rationale: 'Mátíù 6:19–24 lè ní ìtumọ̀ tó ń wọ ara wọn: ìwà búburú, ìríran tàbí òye tó yí, àti bóyá àìlawọ́. “Burú” kò fi dandan yan ọ̀kan ṣoṣo, nítorí náà ó pa ìṣòro àti fífẹ̀ ìtumọ̀ náà mọ́.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. “Ǹjẹ́” ń so ìparí ìkìlọ̀ náà mọ́ ohun tó ṣáájú, “yóò ti pọ̀ tó!” sì mú agbára gbólóhùn ìyàlẹ́nu Gíríìkì jáde.
