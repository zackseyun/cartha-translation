  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ pa ìfarahàn àkàwé Gíríìkì náà mọ́ dáadáa: “ojú ... burú,” “ìmọ́lẹ̀,” àti “òkùnkùn” kò yan ìtumọ̀ ẹ̀sìn tàbí ìwà kan ṣoṣo. Síbẹ̀, “yóò ti pọ̀ tó” ní ìparí ń fi àkókò ọjọ́ iwájú kún gbólóhùn Gíríìkì elliptical náà, níbi tí a ti ń sọ ìwọ̀n òkùnkùn náà ní ìyàlẹ́nu. A tún gbọdọ̀ ṣàtúnṣe ìtumọ̀ yíyàn nínú àlàyé ìsàlẹ̀, nítorí “aláìlawọ́” túmọ̀ sí ẹni tí kò lọ́rọ̀/ti kò ní ọrọ̀, kì í ṣe ẹni oníwọ̀wọ́ tàbí aláìfẹ́ láti fúnni.'
