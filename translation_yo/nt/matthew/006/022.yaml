id: MAT.6.22
reference: Matthew 6:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: yo
  text: “Ojú ni fìtílà ara. Nítorí náà, bí ojú rẹ bá ní ìlera[a], gbogbo ara rẹ yóò kún fún ìmọ́lẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ojú rẹ bá jẹ́ kan ṣoṣo,” “bí ojú rẹ bá ṣe kedere,” tàbí “bí ojú rẹ bá pé.” Ọ̀rọ̀ Gíríìkì náà tún lè fi ìtumọ̀ ohun tí kò pínyà hàn, tàbí, ní àwọn àyíká ọ̀rọ̀ kan, ìwà ọ̀làwọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: fìtílà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun èlò tí ń fúnni ní ìmọ́lẹ̀, kì í ṣe ìmọ́lẹ̀ lásán; “fìtílà” pa àkàwé ojú gẹ́gẹ́ bí ohun tó ń tan ìmọ́lẹ̀ sí ara mọ́.
- source_word: σῶμα
  choice: ara
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún àwòrán ara ní ẹsẹ yìí.
- source_word: ὀφθαλμός
  choice: ojú
  rationale: Ìtumọ̀ tààrà yìí bá àwòrán ojú ara àti ìtumọ̀ ìwà tó wà nínú àkàwé náà mu.
- source_word: ἐὰν οὖν
  choice: Nítorí náà, bí … bá
  rationale: “Nítorí náà” pa ìbáṣepọ̀ ìparí-ọ̀rọ̀ οὖν mọ́, “bí … bá” sì fi ipò àídájú ἐὰν hàn ní Yorùbá àdánidá.
- source_word: ἁπλοῦς
  choice: mọ́ dáadáa
  rationale: Nínú àkópọ̀ ọ̀rọ̀ nípa ojú àti ìmọ́lẹ̀, gbólóhùn yìí ṣàpèjúwe ojú tí ó ń ríran lọ́nà tó tọ́. Àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ míì bí “kan ṣoṣo,” “kedere,” “pé,” tàbí ọ̀làwọ́ mọ́.
- source_word: ὅλον
  choice: gbogbo
  rationale: “Gbogbo ara rẹ” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ ohun gbogbo láìsí àyọkúrò hàn.
- source_word: φωτεινὸν
  choice: kún fún ìmọ́lẹ̀
  rationale: Èyí sọ àbájáde ìtanmọ́lẹ̀ sí gbogbo ara ní Yorùbá tó ṣe kedere, ó sì pa àwòrán ìmọ́lẹ̀ mọ́.
- source_word: ἔσται
  choice: yóò …
  rationale: “Yóò” pa àkókò ọjọ́ iwájú inú èdè Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἁπλοῦς nínú àkàwé ojú
  choice: “mọ́ dáadáa” nínú àkọsílẹ̀ pàtàkì
  alternative: “kan ṣoṣo,” “kedere,” “pé,” tàbí, ní àwọn àyíká ọ̀rọ̀ kan, “ọ̀làwọ́”
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ ń sọ nípa ojú gẹ́gẹ́ bí fìtílà ara, ẹsẹ tó tẹ̀ lé sì fi ojú búburú ṣe ìyàtọ̀. Nítorí náà, ọ̀rọ̀ tó ń fi ojú tí ó ń ṣiṣẹ́ dáadáa hàn ló bá àkàwé náà mu jù; síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí ìfẹ̀ ìtumọ̀ àti ìṣòro ọ̀rọ̀ Gíríìkì náà má bàjẹ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ. “Fìtílà” jẹ́ ọ̀rọ̀ tó wọ́pọ̀, “mọ́ dáadáa” sì jẹ́ àdánidá ju ìtumọ̀ líle “kan ṣoṣo” lọ nínú àwòrán ìríran.
