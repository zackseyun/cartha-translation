id: MAT.6.19
reference: Matthew 6:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: yo
  text: Ẹ má ṣe kó ìṣúra jọ fún ara yín ní ayé, níbi tí kòkòrò aṣọ àti ìbàjẹ́ ti ń pa á run,[a] àti níbi tí àwọn olè ti ń já wọlé[b] tí wọ́n sì ń jalè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìpẹ́”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí ń jẹ nǹkan run tàbí ìdíbàjẹ́ ní gbogbogbòò, kì í ṣe ìpẹ́ irin nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “wà tàbí la ogiri kọjá”; ó ṣeé ṣe kí èyí tọ́ka sí àwọn olè tí ń wà tàbí tí ń la ogiri ilé amọ̀ kọjá láti wọlé.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Ẹ má ṣe kó … jọ
  rationale: Ọ̀rọ̀ ìṣè ní àṣẹ pẹ̀lú μή jẹ́ ìfòfindè; ‘kó … jọ’ jẹ́ Yorùbá àdánidá fún fífi ohun pamọ́ sí i ní kẹ̀rẹ̀kẹ̀rẹ̀.
- source_word: ὑμῖν
  choice: fún ara yín
  rationale: Ó fi ìtumọ̀ àfidípò hàn pé àwọn olùgbọ́ ń kó ohun náà jọ fún ohun ìní tàbí àǹfààní tiwọn.
- source_word: θησαυροὺς
  choice: ìṣúra
  rationale: Ó dá ìtumọ̀ ọrọ̀ Gíríìkì tí ó túmọ̀ sí ohun iyebíye tàbí ọrọ̀ tí a kó jọ dúró, kì í sì í dín un kù sí owó nìkan.
- source_word: ἐπὶ τῆς γῆς
  choice: ní ayé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ibi ayé yìí hàn ní ìyàtọ̀ sí ọ̀run nínú ẹsẹ tó tẹ̀ lé e.
- source_word: σὴς
  choice: kòkòrò aṣọ
  rationale: Ó tọ́ka sí kòkòrò moth tí ń jẹ aṣọ tàbí ohun tí a fi aṣọ ṣe; àfikún ‘aṣọ’ mú irú kòkòrò náà yé òǹkàwé Yorùbá.
- source_word: βρῶσις
  choice: ìbàjẹ́
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí jíjẹ run tàbí ìdíbàjẹ́ ní gbogbogbòò, kì í ṣe ìpẹ́ irin nìkan.
- source_word: ἀφανίζει
  choice: ń pa á run
  rationale: Ó sọ píparẹ́ tàbí ìparun ohun náà ní Yorùbá tó ṣe kedere, ó sì bá àwọn olùṣe méjèèjì—kòkòrò àti ìbàjẹ́—mu.
- source_word: κλέπται
  choice: àwọn olè
  rationale: Èyí ni ìbámu Yorùbá tààrà fún àwọn ẹni tí ń jalè.
- source_word: διορύσσουσιν
  choice: ń já wọlé
  rationale: Ó sọ èrò ìfọ́lé wọlé ní Yorùbá òde òní, nígbà tí àlàyé ìtumọ̀ gangan ‘la ogiri kọjá’ wà ní àkọsílẹ̀ ìsàlẹ̀.
- source_word: κλέπτουσιν
  choice: ń jalè
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún gbígba ohun ẹlòmíràn ní ọ̀nà àìtọ́.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ γῆ àti ìyàtọ̀ rẹ̀ sí ọ̀run
  choice: ní ayé
  alternative: lórí ilẹ̀ ayé
  rationale: ‘Ní ayé’ jẹ́ Yorùbá àdánidá, ó sì pa ìyàtọ̀ ibi ayé sí ọ̀run nínú àyíká ọ̀rọ̀ mọ́ láìfi ẹ̀kọ́ míì kún un.
- issue: Ìtumọ̀ βρῶσις
  choice: ìbàjẹ́
  alternative: ìpẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ìpẹ́ irin lọ, ó sì ní èrò ohun tí ń jẹ tàbí ń ba nǹkan jẹ́; ‘ìbàjẹ́’ pa ìwọ̀n yẹn mọ́, nígbà tí àṣàyàn ‘ìpẹ́’ wà ní àkọsílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A lo ọ̀rọ̀ ọ̀wọ̀/ọ̀pọ̀ ‘Ẹ … yín’ fún ẹgbẹ́ àwọn ọmọ-ẹ̀yìn. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán.
