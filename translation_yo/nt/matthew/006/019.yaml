  source_fidelity: Ìtumọ̀ náà mú ìfòfindè tí ó wà nínú Μὴ θησαυρίζετε, ìtumọ̀ àfidípò ‘fún ara yín,’ ìṣúra ilẹ̀-ayé, àti ewu kòkòrò, ìbàjẹ́, àti olè wá ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì. Síbẹ̀, διορύσσουσιν ní ìtumọ̀ gangan ‘wà/lá kọjá’ (gẹ́gẹ́ bí ìfọ́ ogiri), kì í ṣe ‘já wọlé’ lásán; ìtumọ̀ pàtàkì yìí yẹ kí ó hàn kedere nínú àkọsílẹ̀ ìsàlẹ̀.
