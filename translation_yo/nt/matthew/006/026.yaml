  to: 'Ẹ wo àwọn ẹyẹ ojú ọ̀run[a]: wọn kì í fúnrúgbìn, wọn kì í kórè, wọn kì í sì í kó nǹkan jọ sínú àwọn ilé ìpamọ́; síbẹ̀ Baba yín tí ń bẹ ní ọ̀run ń bọ́ wọn. Ẹ̀yin kò ha níye ju wọn lọ[b]?'
