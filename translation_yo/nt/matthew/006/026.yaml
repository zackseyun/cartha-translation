id: MAT.6.26
reference: Matthew 6:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: yo
  text: 'Ẹ wo àwọn ẹyẹ ojú ọ̀run[a]: wọn kì í fúnrúgbìn, wọn kì í kórè, wọn kì í sì í kó nǹkan jọ sínú àwọn ilé ìpamọ́; síbẹ̀ Baba yín tí ń bẹ ní ọ̀run ń bọ́ wọn. Ẹ̀yin kò ha níye ju wọn lọ[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹyẹ sánmà”; ní ìtumọ̀ ìbílẹ̀ kan, “àwọn ẹyẹ afẹ́fẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ̀yin kò ha níye púpọ̀ ju wọn lọ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Ẹ wo
  rationale: Ọ̀rọ̀ àṣẹ yìí pe àwọn olùgbọ́ láti darí àfiyèsí wọn sí àwọn ẹyẹ; “Ẹ wo” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára àṣẹ náà mọ́.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: “Àwọn ẹyẹ” túmọ̀ πετεινά ní ti ẹ̀dá tí ń fò, “ojú ọ̀run” sì tọ́ka sí ojú sánmà tí a ń rí nínú àyíká yìí, láìfi ìtumọ̀ ibùgbé Ọlọ́run kún un.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: fúnrúgbìn ... kórè ... kó nǹkan jọ
  rationale: Àwọn ọ̀rọ̀ yìí pa àwòrán iṣẹ́ àgbẹ̀ àti ìtẹ̀lé àwọn ìṣe mẹ́tẹ̀ẹ̀ta inú Gíríìkì mọ́ ní èdè Yorùbá tó ṣeé lóye.
- source_word: εἰς ἀποθήκας
  choice: sínú àká
  rationale: “Àká” jẹ́ ibi tí a ti ń kó èso oko pamọ́, ó sì bá àyíká iṣẹ́ àgbẹ̀ mu.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yín tí ń bẹ ní ọ̀run
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá tó pa ìbáṣepọ̀ “Baba” àti ìtọ́kasí sí ọ̀run mọ́.
- source_word: τρέφει
  choice: ń bọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé Baba ń fún àwọn ẹyẹ ní oúnjẹ; “ń bọ́ wọn” jẹ́ ìtumọ̀ tààrà tó sì ṣeé lóye.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Ẹ̀yin kò ha níye lórí púpọ̀ ju wọn lọ?
  rationale: Ìbéèrè àròsọ náà ń retí ìdáhùn rere. “Níye lórí púpọ̀ ju” fi ìfiwéra àti agbára μᾶλλον hàn láìṣàfikún ìdí ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ.
theological_decisions:
- issue: Ìye ènìyàn ní ìfiwéra pẹ̀lú àwọn ẹyẹ nínú ọ̀rọ̀ Jesu
  choice: Ẹsẹ̀ náà jẹ́rìí pé àwọn tí Jesu ń bá sọ̀rọ̀ níye lórí púpọ̀ ju àwọn ẹyẹ lọ ní ti àbójútó Ọlọ́run, ṣùgbọ́n kò sọ ìpìlẹ̀ ẹ̀kọ́ ìgbàgbọ́ fún ìyàtọ̀ náà.
  alternative: Láti sọ ní pàtó pé ìṣàpẹẹrẹ Ọlọ́run nínú ènìyàn tàbí ìbáṣepọ̀ májẹ̀mú nìkan ni ìdí tí ènìyàn fi níye lórí ju ẹyẹ lọ.
  rationale: Gíríìkì sọ ìfiwéra iye náà ní kedere, ṣùgbọ́n kò ṣàlàyé ìdí rẹ̀; nítorí náà, ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ tí kò sí nínú ẹsẹ̀ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “kì í” láti fi ìṣe àṣà tàbí ohun tí kì í ṣẹlẹ̀ hàn, a sì lo “síbẹ̀” láti mú ìyàtọ̀ tó wà láàárín àìṣiṣẹ́ àwọn ẹyẹ àti ìpèsè Baba ṣe kedere. Gbogbo àmì àlàyé ìsàlẹ̀ ojú ìwé wà nínú ọ̀rọ̀ pàtàkì.
