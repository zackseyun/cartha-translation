  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ó ní àṣẹ láti wo àwọn ẹyẹ, ìtẹ̀lé ìṣe àgbẹ̀ mẹ́tẹ̀ẹ̀ta, ìpèsè Baba ọ̀run, àti ìbéèrè àròsọ nípa iye ènìyàn. Ṣùgbọ́n “àká” sábà máa ń tọ́ka sí apẹ̀rẹ̀/bàskẹ́ẹ̀tì, kì í ṣe ilé ìpamọ́ ọkà tàbí ibi ìkójọpọ̀ irè oko, nítorí náà kò péye fún ἀποθήκας.'
  naturalness: “Ẹ wo,” “wọn kì í,” àti “Baba yín tí ń bẹ ní ọ̀run” jẹ́ Yorùbá boṣewa tí ó dára. A tún ìbéèrè ìkẹyìn ṣe sí “Ẹ̀yin kò ha níye ju wọn lọ?” kí ó lè jẹ́ èdè àdánidá, kí ó sì má ṣe fi “púpọ̀” kún ìfiwéra Gíríìkì, bí ó tilẹ̀ jẹ́ pé a lè mẹ́nuba ìlò náà nínú àlàyé ìsàlẹ̀.
