id: MAT.6.30
reference: Matthew 6:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: yo
  text: Ṣùgbọ́n bí Ọlọ́run bá ń wọ koríko pápá ní aṣọ báyìí—èyí tí ó wà lónìí, tí a ó sì sọ sínú ìléru[a] lọ́la—ǹjẹ́ kì yóò ha wọ̀ yín ní aṣọ jù bẹ́ẹ̀ lọ, ẹ̀yin tí ìgbàgbọ́ yín kéré[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìléru níbí ni ìléru tí a fi ń yan oúnjẹ; a lè lo koríko àti ewéko pápá tí ó ti gbẹ gẹ́gẹ́ bí ohun ìdáná.
    reason: cultural_note
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ὀλιγόπιστοι jẹ́ ìpè tààrà sí àwọn tí ìgbàgbọ́ wọn kéré; ó ń bá wọn wí nítorí ìgbẹ́kẹ̀lé wọn kò tó.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó fi ìyípadà kékeré nínú ìjiyàn hàn, ó sì bẹ̀rẹ̀ gbólóhùn oníṣ شرط ní Yorùbá àdánidá.
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: koríko pápá
  rationale: χόρτος lè túmọ̀ sí koríko tàbí ewéko inú pápá; ‘koríko pápá’ pa àwòrán ohun ọ̀gbìn igbó tí kò pẹ́ mọ́ láì fi ‘òdòdó’ kún un.
- source_word: σήμερον ὄντα
  choice: èyí tí ó wà lónìí
  rationale: Ó mú ìtumọ̀ gangan ti ‘èyí tí ó ń bẹ lónìí’ jáde ní ọ̀nà Yorùbá tí ó rọrùn, láì fi èrò míì kún un.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: tí a ó sì sọ sínú ìléru lọ́la
  rationale: ‘Ìléru’ tọ́ka sí ibi tí a ti ń yan tàbí sun ohun; àpólà aláìlórúkọ ‘a ó sọ’ ṣe àfihàn ìṣe aláìlórúkọ inú ọ̀rọ̀ Gíríìkì lọ́nà àdánidá.
- source_word: οὕτως ἀμφιέννυσιν
  choice: ń wọ ... ní aṣọ báyìí
  rationale: Ó pa àkàwé wíwọ aṣọ mọ́ dípò yíyí rẹ̀ sí ‘ṣe lọ́ṣọ̀ọ́,’ èyí tí ó lè tẹnu mọ́ ẹwà ju ìpèsè lọ.
- source_word: οὐ πολλῷ μᾶλλον
  choice: ǹjẹ́ kì yóò ha túbọ̀ ... jù bẹ́ẹ̀ lọ
  rationale: Ìbéèrè àsọyé yìí pa agbára ìjiyàn láti ohun kékeré sí ohun títóbi mọ́ ní Yorùbá àdánidá.
- source_word: ὑμᾶς
  choice: yín
  rationale: Ó jẹ́ ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ohun tí Ọlọ́run yóò wọ ní aṣọ; a tún ọ̀rọ̀-ìṣe náà sọ fún ìtumọ̀ kedere.
- source_word: ὀλιγόπιστοι
  choice: ẹ̀yin tí ìgbàgbọ́ yín kéré
  rationale: Ó pa ìpè tààrà àti ìbáwí fún ìgbẹ́kẹ̀lé tí kò tó mọ́, ní èdè Yorùbá òde òní tí kò ṣókùnkùn.
theological_decisions:
- issue: Ìjiyàn nípa ìpèsè Ọlọ́run láti ohun kékeré sí ohun títóbi
  choice: A pa á mọ́ gẹ́gẹ́ bí ìbéèrè àsọyé pé Ọlọ́run yóò túbọ̀ wọ àwọn ọmọ-ẹ̀yìn ní aṣọ.
  alternative: Ṣíṣe é ní gbólóhùn ìjẹ́rìí dípò ìbéèrè.
  rationale: Ìṣètò Gíríìkì àti ìpè tààrà ní ìparí ṣe àtìlẹ́yìn fún ìbéèrè àsọyé; èyí pa agbára ìkìlọ̀ Jesu mọ́ láì fi ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìtumọ̀ ὀλιγόπιστοι
  choice: ẹ̀yin tí ìgbàgbọ́ yín kéré
  alternative: ẹ̀yin aláìnígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì ń bá ìgbàgbọ́ tí kò tó wí, kì í ṣe dandan àìní ìgbàgbọ́ pátápátá; ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní. A pa àwòrán wíwọ koríko ní aṣọ àti ìbéèrè àsọyé mọ́; àwọn àmì ohùn ni a lò níbi tí ó bá jẹ́ àdánidá.
