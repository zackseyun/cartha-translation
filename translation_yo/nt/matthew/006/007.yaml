id: MAT.6.7
reference: Matthew 6:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: yo
  text: Nígbà tí ẹ̀yin bá sì ń gbàdúrà, ẹ má ṣe máa kó ọ̀rọ̀ asán jọ[a] bí àwọn Kèfèrí[b], nítorí wọ́n rò pé a ó gbọ́ àdúrà wọn nítorí ọ̀rọ̀ púpọ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ má ṣe bábálá” tàbí “ẹ má ṣe máa sọ ọ̀rọ̀ tí kò ní ìtumọ̀.” Ọ̀rọ̀ Gíríìkì náà ṣọ̀wọ́n; ó sì lè tọ́ka sí ọ̀rọ̀ òfo, ọ̀rọ̀ tí a ń sọ bí ẹ̀rọ, tàbí ọ̀rọ̀ púpọ̀ tí kò ní èrò inú, dípò àtúnsọ àdúrà tòótọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn tí kì í ṣe Júù” tàbí “àwọn orílẹ̀-èdè.” Ní àyíká Júù yìí, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ènìyàn tàbí orílẹ̀-èdè tí kì í ṣe Júù, ìyẹn àwọn tí kò sí lára àwọn ènìyàn májẹ̀mú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: Nígbà tí ẹ̀yin bá sì ń gbàdúrà
  rationale: Ọ̀rọ̀ yìí fi ipò tí àṣẹ náà ti wúlò hàn, δέ sì ń tẹ̀ síwájú nínú ìkọ́ni Jésù láìfi ìtakora líle hàn.
- source_word: μὴ βατταλογήσητε
  choice: ẹ má ṣe máa kó ọ̀rọ̀ asán jọ
  rationale: Ọ̀rọ̀ Gíríìkì náà ṣọ̀wọ́n, ó sì ṣeé ṣe kí ó tọ́ka sí ọ̀rọ̀ púpọ̀ tí kò ní ìtumọ̀ tàbí tí a ń sọ bí ẹ̀rọ, kì í ṣe sí gbogbo àtúnsọ nínú àdúrà.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: bí àwọn Kèfèrí
  rationale: Nínú àyíká Júù yìí, οἱ ἐθνικοί tọ́ka sí àwọn tí kì í ṣe Júù, ìyẹn àwọn orílẹ̀-èdè tí wọ́n wà lẹ́yìn àwọn ènìyàn májẹ̀mú. “Àwọn Kèfèrí” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣètọ́jú ìtumọ̀ rẹ̀.
- source_word: δοκοῦσιν
  choice: wọ́n rò
  rationale: Ó sọ èrò tàbí ìgbàgbọ́ tí wọ́n ní nípa ohun tí yóò mú kí a gbọ́ àdúrà wọn.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: nítorí ọ̀rọ̀ púpọ̀ wọn
  rationale: Gbólóhùn náà tọ́ka sí ọ̀rọ̀ púpọ̀ gẹ́gẹ́ bí ìdí tí wọ́n fi retí pé a ó gbọ́ tiwọn.
- source_word: εἰσακουσθήσονται
  choice: a ó gbọ́ tiwọn
  rationale: Èyí mú ìtumọ̀ gbígbọ́ ẹni pẹ̀lú ojúrere jáde, láìfi ìtumọ̀ tí ó lágbára jù pé a ó dáhùn sí wọn kún un.
theological_decisions:
- issue: Bóyá Jésù ka gbogbo àtúnsọ nínú àdúrà léèwọ̀ tàbí ó ń ka ọ̀rọ̀ asán tí ó pọ̀ jù léèwọ̀
  choice: ẹ má ṣe máa kó ọ̀rọ̀ asán jọ
  alternative: ẹ má ṣe máa sọ ọ̀rọ̀ kan náà léraléra; ẹ má ṣe máa sọ ọ̀rọ̀ tí kò ní ìtumọ̀
  rationale: Àṣàyàn yìí pa agbára ọ̀rọ̀ Gíríìkì ṣọ́, kò sì sọ pé gbogbo àtúnsọ àdúrà tòótọ́ ni a kà léèwọ̀. Ohun tí ẹsẹ náà ń tako ni lílo ọ̀rọ̀ asán púpọ̀ bí ọ̀nà láti fi mú kí Ọlọ́run fetí síni.
- issue: Ìdánimọ̀ οἱ ἐθνικοί
  choice: àwọn Kèfèrí
  alternative: àwọn abọ̀rìṣà; àwọn orílẹ̀-èdè
  rationale: Àwọn Kèfèrí ń tọ́ka sí àwọn tí kì í ṣe Júù nínú àyíká yìí; “àwọn abọ̀rìṣà” lè fi ẹ̀sìn wọn hàn ju ìdánimọ̀ wọn ní ìbámu pẹ̀lú májẹ̀mú lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Ẹ̀yin” mú ọ̀pọ̀ ènìyàn inú fọ́ọ̀mù Gíríìkì hàn; “a ó gbọ́ tiwọn” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a ó fi ojúrere fetí sí àdúrà wọn.
