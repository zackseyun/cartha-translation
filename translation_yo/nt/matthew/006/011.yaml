  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: yo
  text: Fún wa ní búrẹ́dì ojoojúmọ́ wa lónìí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “búrẹ́dì wa fún òní,” “búrẹ́dì wa fún ọjọ́ tí ń bọ̀,” tàbí “búrẹ́dì tí a nílò.” Ọ̀rọ̀ àpèjúwe Gíríìkì ἐπιούσιον ṣọ̀wọ́n, ìtumọ̀ rẹ̀ gan-an sì ń fa àríyànjiyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον (ἄρτος)
  choice: búrẹ́dì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí búrẹ́dì ní pàtó, bí ó tilẹ̀ jẹ́ pé ó tún lè dúró fún oúnjẹ tàbí ohun ìpèsè lápapọ̀. Yíyan “búrẹ́dì” pa àwòrán ohun jíjẹ tó wà nínú Gíríìkì mọ́.
- source_word: ἡμῶν
  choice: wa
  rationale: Ó jẹ́ arọ́pò-orúkọ tó fi hàn pé búrẹ́dì náà jẹ́ ti àwa tí ń gbàdúrà.
- source_word: ἐπιούσιον (ἐπιούσιος)
  choice: ojoojúmọ́
  rationale: Ọ̀rọ̀ Gíríìkì yìí ṣọ̀wọ́n, ìtumọ̀ rẹ̀ sì ń fa àríyànjiyàn. “Ojoojúmọ́” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá ẹ̀bẹ̀ fún ìpèsè ọjọ́ dé ọjọ́ mu; àmọ́ a fi àwọn ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀ nítorí àìdánilójú gidi náà.
- source_word: δὸς (δίδωμι)
  choice: Fún ... ní
  rationale: Ọ̀rọ̀ àṣẹ taara ni; “fún wa ní” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń béèrè ohun kan.
- source_word: ἡμῖν
  choice: wa
  rationale: Arọ́pò-orúkọ yìí ni ẹni tí a ní kí a fún ní búrẹ́dì náà.
- source_word: σήμερον
  choice: lónìí
  rationale: “Lónìí” ni ìtumọ̀ taara, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἐπιούσιον nínú Àdúrà Olúwa
  choice: ojoojúmọ́
  alternative: fún òní; fún ọjọ́ tí ń bọ̀; tí a nílò fún ìwàláàyè
  rationale: “Ojoojúmọ́” sọ ìgbẹ́kẹ̀lé Ọlọ́run fún ìpèsè ọjọ́ dé ọjọ́ jáde láìfi ìtumọ̀ onímọ̀ kan ṣoṣo múlẹ̀ bí ẹni pé kò sí àríyànjiyàn. A pa àwọn ìtumọ̀ míì mọ́ nínú àlàyé ìsàlẹ̀ kí àìdánilójú ọ̀rọ̀ Gíríìkì náà má bàa sọnù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbéléwọ̀n, tó níyì, tó sì rọrùn fún òǹkàwé òde òní. A lo “búrẹ́dì” dípò “oúnjẹ” nínú ọ̀rọ̀ pàtàkì láti pa àwòrán nǹkan jíjẹ pàtó ti ἄρτος mọ́; “ojoojúmọ́” sì jẹ́ yíyan tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ń pa àìdánilójú ἐπιούσιον mọ́.
