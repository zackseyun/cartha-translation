id: MAT.6.29
reference: Matthew 6:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé, kódà Sólómọ́nì nínú gbogbo ògo rẹ̀ kò múra bí ọ̀kan nínú àwọn wọ̀nyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú gbogbo ọlá-ọ̀ṣọ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ṣùgbọ́n mo sọ fún yín
  rationale: ‘Mo sọ fún yín’ túmọ̀ ọ̀rọ̀-ìṣe λέγω pẹ̀lú ὑμῖν lọ́nà àdánidá ní Yorùbá; ‘Ṣùgbọ́n’ sì fi ìyàtọ̀ onírẹ̀lẹ̀ sí ohun tí ó ṣáájú hàn.
- source_word: οὐδὲ
  choice: kódà ... kò
  rationale: Ìṣètò ‘kódà ... kò’ ń fi ìtẹnumọ́ ‘kódà Sólómọ́nì pàápàá kò’ tí οὐδέ ní hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: Σολομὼν
  choice: Sólómọ́nì
  rationale: A lo ìkọ̀wé orúkọ tí ó wọ́pọ̀ nínú Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: nínú gbogbo ògo rẹ̀
  rationale: ‘Ògo’ pa ìtumọ̀ ọlá àti ẹwà ọba mọ́; ní àyíká yìí, ó ń tọ́ka sí gbogbo ọlá-ọ̀ṣọ́ Sólómọ́nì.
- source_word: περιεβάλετο
  choice: wọ aṣọ tí ó lẹ́wà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwọ aṣọ tàbí fífi aṣọ bo ara. Fífi ‘tí ó lẹ́wà’ kún un mú ìfiwéra pẹ̀lú àwọn òdòdó ṣe kedere ní Yorùbá láìyí kókó ìtumọ̀ padà.
- source_word: ὡς ἓν τούτων
  choice: bí ọ̀kan lára àwọn wọ̀nyí
  rationale: Ó pa ìfiwéra pẹ̀lú òdòdó kan ṣoṣo lára àwọn tí Jésù ń tọ́ka sí mọ́.
theological_decisions:
- issue: Ìtumọ̀ δόξα nípa Sólómọ́nì
  choice: ògo
  alternative: ọlá-ọ̀ṣọ́; ọlá ńlá
  rationale: ‘Ògo’ bá ọ̀rọ̀ Gíríìkì mu, ó sì lè tọ́ka sí ẹwà àti ọlá ọba ní àyíká yìí, láìsọ ọ́ di ògo Ọlọ́run tàbí fi ẹ̀kọ́ ìsìn àkànṣe kún un.
- issue: Ìtumọ̀ fọ́ọ̀mù περιεβάλετο
  choice: wọ aṣọ
  alternative: a wọ aṣọ fún un; fi aṣọ bo ara rẹ̀
  rationale: Fọ́ọ̀mù Gíríìkì lè jẹ́ àárín tàbí aláìṣe, ṣùgbọ́n àyíká ń sọ nípa bí Sólómọ́nì ṣe múra. ‘Wọ aṣọ’ jẹ́ àdánidá, kò sì pinnu bóyá òun fúnra rẹ̀ ni ó wọ̀ ọ́ tàbí ẹlòmíràn ló wọ̀ ọ́ fún un.
translation_notes:
  register: Yorùbá àgbàṣe, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá, a sì pa ìtẹnumọ́ àti ìfiwéra inú Gíríìkì mọ́.
