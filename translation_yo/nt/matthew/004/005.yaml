id: MAT.4.5
reference: Matthew 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: yo
  text: Nígbà náà ni Èṣù mú un lọ sí ìlú mímọ́[a], ó sì gbé e dúró lórí ṣóńṣó tẹ́ńpìlì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni Jerusalẹmu.
    reason: cross_reference
  - marker: b
    text: Tàbí “lórí apá tẹ́ńpìlì tí ó yọ síta.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí etí ilé tí ó yọ síta tàbí ibi tí ó ga jù lọ ní àgbègbè tẹ́ńpìlì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé èyí tí ó ṣáájú rẹ̀ nínú ìtàn.
- source_word: παραλαμβάνει
  choice: mú un lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ẹnì kan lọ pẹ̀lú ẹni; èdè Yorùbá elétò ìtàn sábà máa ń lo ọ̀nà ìṣe tí ó parí dípò àkókò ìsinsìnyí ti ìtàn Gíríìkì.
- source_word: ὁ διάβολος
  choice: Èṣù
  rationale: Èyí ni orúkọ tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá fún ẹni náà nínú àyíká ìtàn yìí.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: sí ìlú mímọ́
  rationale: Ó pa àpèjúwe Gíríìkì mọ́ láì fi orúkọ Jerusalẹmu rọ́pò rẹ̀ nínú ẹsẹ náà.
- source_word: ἔστησεν
  choice: gbé e dúró
  rationale: Ìṣe náà jẹ́ ti fífi ẹlòmíràn dúró sí ibi kan, kì í ṣe pé Jésù dúró fúnra rẹ̀.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: lórí ṣóńṣó
  rationale: “Ṣóńṣó” jẹ́ ọ̀nà àdánidá láti tọ́ka sí ibi gíga tàbí etí ilé tí ó yọ sókè, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àìdánilójú nípa ìtumọ̀ pàtó mọ́.
- source_word: τοῦ ἱεροῦ
  choice: tẹ́ńpìlì
  rationale: ἱερόν lè tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; “tẹ́ńpìlì” lè gba ìtumọ̀ gbígbòòrò yìí ní Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ “ìlú mímọ́”
  choice: Pa “ìlú mímọ́” mọ́ nínú ẹsẹ náà.
  alternative: Jerusalẹmu
  rationale: Orísun Gíríìkì lo àpèjúwe ọlá yìí dípò orúkọ ìlú náà; àlàyé ìsàlẹ̀ ojú ewé ló yẹ fún ìdánimọ̀ rẹ̀.
- issue: Ìtumọ̀ πτερύγιον τοῦ ἱεροῦ
  choice: ṣóńṣó tẹ́ńpìlì
  alternative: apá tẹ́ńpìlì tí ó yọ síta; ibi tí ó ga jù lọ ní àgbègbè tẹ́ńpìlì
  rationale: Ibi pàtó tí ọ̀rọ̀ náà ń tọ́ka sí kò dájú pátápátá; ìtumọ̀ àkọ́kọ́ jẹ́ èyí tí ó ṣeé kà, ṣùgbọ́n àlàyé pa àwọn ìtumọ̀ míì mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa, tí ó ní àmì ohùn níbi tí ó bá yẹ, pẹ̀lú ọ̀rọ̀ ìtàn tí ó ṣe kedere, tí ó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. A lo “Èṣù” gẹ́gẹ́ bí àpèjúwe ẹni náà, “tẹ́ńpìlì” sì ni a lò ní ìtumọ̀ tí ó lè kan gbogbo àgbègbè ilé ìjọsìn náà.
