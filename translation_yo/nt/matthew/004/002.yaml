  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi ìtẹ̀lé àsìkò ti participle νηστεύσας àti ὕστερον hàn dáadáa. Ṣùgbọ́n «ọ̀sán» túmọ̀ sí àkókò ọ̀sán/daytime ju «ọjọ́» (‘days’) lọ; «ọjọ́ ogójì àti òru ogójì» bá Gíríìkì náà mu pẹkipẹki. A tún yí «ebi wá ń pa á» padà sí «ebi wá pa á» kí aorist ἐπείνασεν má bà a dà bí ipò tí ń tẹ̀ síwájú.
  naturalness: «Lẹ́yìn tí ó ti gbààwẹ̀ fún ọjọ́ ogójì àti òru ogójì, ebi wá pa á» jẹ́ Yorùbá boṣewa, òde òní, àti ọ̀nà àdánidá láti sọ pé ebi dé bá a lẹ́yìn ààwẹ̀ náà.
  terminology: «Gbààwẹ̀» jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì yẹ fún νηστεύω. «Ebi pa á» jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún πεινάω nínú àyíká yìí, láìkún un ní ìtumọ̀ ẹ̀kọ́ ìsìn.
