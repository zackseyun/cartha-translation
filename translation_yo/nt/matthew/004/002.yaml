  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti gbààwẹ̀ fún ọjọ́ ogójì àti òru ogójì, ebi wá pa á.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Lẹ́yìn ààwẹ̀ rẹ̀ fún ọjọ́ ogójì àti òru ogójì, ebi pa á.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lẹ́yìn
  rationale: Ní ìbẹ̀rẹ̀ gbólóhùn yìí, ìbáṣepọ̀ ìtàn tí καί ń ṣe ni a fi mọ́ ọ̀rọ̀ àsìkò tó tẹ̀ lé e, kí Yorùbá lè ṣàn lọ́nà àdánidá láìfi ìtumọ̀ tuntun kún un.
- source_word: νηστεύσας
  choice: tí ó ti gbààwẹ̀
  rationale: Ọ̀rọ̀ participle aorist yìí tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ‘tí ó ti gbààwẹ̀’ fi ìbáṣepọ̀ àsìkò náà hàn ní Yorùbá àdánidá.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: fún ogójì ọ̀sán àti ogójì òru
  rationale: Accusative ti ìwọ̀n àsìkò ń sọ bí àkókò náà ṣe gùn tó. ‘Fún’ mú iye àkókò náà ṣe kedere, ‘ọ̀sán àti òru’ sì bá ìyàtọ̀ days/nights inú orísun mu.
- source_word: ὕστερον
  choice: Lẹ́yìn … wá
  rationale: ὕστερον fi hàn pé ebi náà tẹ̀ lé ààwẹ̀. Àkópọ̀ ‘Lẹ́yìn … wá’ jẹ́ ọ̀nà Yorùbá tó rọrùn láti pa ìtẹ̀lé àsìkò yìí mọ́.
- source_word: ἐπείνασεν
  choice: ebi wá ń pa á
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún jíjẹ́ ẹni tí ebi ń pa, ó sì lè sọ ìwọ̀lé sí ipò ebi lẹ́yìn ààwẹ̀ láìdi gbólóhùn náà mọ́ ọn.
theological_decisions:
- issue: Ìtẹnumọ́ ìtàn lórí àìní ara ènìyàn gidi ti Jesu lẹ́yìn ààwẹ̀
  choice: ebi wá ń pa á
  alternative: ó wá bẹ̀rẹ̀ sí í ní ebi
  rationale: Àyànfẹ́ náà sọ ebi gidi rẹ̀ ní kedere, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un. Ọ̀nà mìíràn lè tẹnumọ́ ìbẹ̀rẹ̀ ebi ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé lásán. A yan ‘gbààwẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àìjẹun nítorí ìdí ẹ̀sìn.
