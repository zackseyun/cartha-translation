  to: Nígbà náà ni Jésù sọ fún un pé, “Kúrò, Sátánì! Nítorí a ti kọ ọ́ sílẹ̀ pé, ‘Olúwa Ọlọ́run rẹ ni kí o jọ́sìn[a], kí o sì sìn òun nìkan[b].’”
