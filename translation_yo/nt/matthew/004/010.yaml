reference: Matthew 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: yo
  text: Nígbà náà ni Jésù sọ fún un pé, “Kúrò, Sátánì! Nítorí a ti kọ ọ́ sílẹ̀ pé, ‘Olúwa Ọlọ́run rẹ ni kí o jọ́sìn[a], kí o sì sìn òun nìkan[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “foríbalẹ̀ fún Olúwa Ọlọ́run rẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí fífi ara balẹ̀ tàbí fíforíbalẹ̀ láti fi ọ̀wọ̀ hàn.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ ìṣe tí a túmọ̀ sí “sìn” lè tọ́ka ní pàtó sí iṣẹ́ ìsìn mímọ́ tàbí iṣẹ́ ìsìn ẹ̀sìn tí a ń ṣe fún Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει αὐτῷ
  choice: Nígbà náà ni Jésù sọ fún un pé
  rationale: “Nígbà náà” fi ìtẹ̀síwájú ìtàn hàn. Bí ó tilẹ̀ jẹ́ pé λέγει jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí tí a lò nínú ìtàn, “sọ” ni ọ̀nà àdánidá láti sọ ọ́ nínú Yorùbá láìsọ ìtumọ̀ rẹ̀ nù.
- source_word: Ὕπαγε
  choice: Kúrò níbí
  rationale: Ó jẹ́ àṣẹ líle pé kí ẹni náà lọ kúrò; “Kúrò níbí” ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: Σατανᾶ
  choice: Sátánì
  rationale: A pa orúkọ ẹni náà mọ́ ní ìrísí tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: γέγραπται γάρ
  choice: Nítorí a ti kọ ọ́ pé
  rationale: Ó pa ìtumọ̀ perfect passive tí ń tọ́ka sí ohun tí Ìwé Mímọ́ ti kọ sílẹ̀, tí ó sì ṣì dúró, mọ́.
- source_word: Κύριον τὸν θεόν σου
  choice: Olúwa Ọlọ́run rẹ
  rationale: Ó fi κύριος àti θεός hàn ní kíkún, pẹ̀lú ọ̀rọ̀ arọ́pò ẹni kejì “rẹ.”
- source_word: προσκυνήσεις
  choice: kí o jọ́sìn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìjọ́sìn tí a ń fi fún Ọlọ́run; “jọ́sìn” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: αὐτῷ μόνῳ
  choice: òun nìkan
  rationale: Ìṣètò yìí tẹnu mọ́ pé Ọlọ́run nìkan ṣoṣo ni ó yẹ kí a sìn.
- source_word: λατρεύσεις
  choice: kí o máa sìn
  rationale: “Sìn” pa ìyàtọ̀ mọ́ láàárín λατρεύω àti προσκυνέω, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń ṣàlàyé ìtumọ̀ iṣẹ́ ìsìn mímọ́ rẹ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àwọn ọ̀rọ̀ ìṣe méjì προσκυνέω àti λατρεύω lọ́tọ̀
  choice: Túmọ̀ προσκυνήσεις sí “jọ́sìn,” kí a sì túmọ̀ λατρεύσεις sí “sìn.”
  alternative: Lo “foríbalẹ̀ fún” fún προσκυνήσεις, tàbí lo ọ̀rọ̀ ìjọ́sìn fún àwọn méjèèjì.
  rationale: Gíríìkì lo ọ̀rọ̀ méjì tí ó ní ìbátan ṣùgbọ́n tí kò jẹ́ ọ̀rọ̀ kan náà. Ṣíṣe ìyàtọ̀ wọn pa agbára ọ̀rọ̀ náà mọ́ pé Ọlọ́run nìkan ni ó yẹ fún ìjọ́sìn àti iṣẹ́ ìsìn.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó bójú mu, tí ó ní ọlá, tí àwọn òǹkàwé òde òní sì lè lóye. “Kúrò níbí” mú agbára àṣẹ náà jáde; “òun nìkan” sì fi ìyàsọ́tọ̀ tí μόνῳ ń tẹnu mọ́ hàn.
