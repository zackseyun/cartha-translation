  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtẹ̀lé àwọn ọ̀rọ̀ ìṣe Gíríìkì náà dáadáa: kúrò ní Násárà, wá sí Kápánáúmù, àti gbé ibẹ̀. Ó tún pa ìtumọ̀ ‘ní agbègbè Sébúlúnì àti Náfútálì’ mọ́. Síbẹ̀, ‘ìlú’ jẹ́ àfikún tí kò sí nínú ọ̀rọ̀ Gíríìkì; παραθαλασσία ń ṣàpèjúwe Kápánáúmù gẹ́gẹ́ bí ibi tí ó wà létí òkun.'
