id: MAT.4.13
reference: Matthew 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: yo
  text: Ó fi Násárà[a] sílẹ̀, ó wá sí Kápánáúmù tó wà létí òkun, ó sì tẹ̀ dó síbẹ̀ ní agbègbè Sébúlúnì àti Náfútálì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní èdè Gíríìkì: “Násárà”; ọ̀pọ̀ ìtumọ̀ Bíbélì máa ń lò “Násárẹ́tì.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: Ó fi … sílẹ̀
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist yìí tọ́ka sí ìṣe tí ó ṣáájú ọ̀rọ̀ ìṣe pàtàkì; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ kúrò ní ibẹ̀ mọ́.
- source_word: Ναζαρὰ
  choice: Násárà
  rationale: A ṣe àfọwọkọ orúkọ náà gẹ́gẹ́ bí ìrísí Gíríìkì Ναζαρά ṣe rí, dípò kí a rọ́pò rẹ̀ pẹ̀lú Násárẹ́tì tí ó wọ́pọ̀.
- source_word: ἐλθὼν
  choice: ó wá sí
  rationale: 'A fi ọ̀rọ̀ ìṣe aláàlà hàn láti mú tẹ̀léńtẹ̀lé ìṣẹ̀lẹ̀ náà yé kedere ní Yorùbá: ó kúrò, ó wá, ó sì tẹ̀ dó.'
- source_word: κατῴκησεν
  choice: ó sì tẹ̀ dó síbẹ̀
  rationale: κατοικέω níhìn-ín túmọ̀ sí gbígbé kalẹ̀ sí ibì kan; “tẹ̀ dó” fi ìbẹ̀rẹ̀ gbígbé ibẹ̀ hàn ju “gbé” lásán lọ.
- source_word: Καφαρναοὺμ
  choice: Kápánáúmù
  rationale: Àfọwọkọ Yorùbá tó bá ìró orúkọ Gíríìkì mu.
- source_word: τὴν παραθαλασσίαν
  choice: ìlú tí ó wà létí òkun
  rationale: Àpèjúwe náà ń sọ pé Kápánáúmù wà lẹ́gbẹ̀ẹ́ òkun; “létí òkun” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: ἐν ὁρίοις
  choice: ní agbègbè
  rationale: ὅρια lè túmọ̀ sí ààlà, ilẹ̀, tàbí agbègbè; níhìn-ín “agbègbè” pa ìtúmọ̀ ilẹ̀ tí a so mọ́ àwọn ẹ̀yà náà mọ́ láì dín un sí ìlà ààlà nìkan.
- source_word: Ζαβουλὼν
  choice: Sébúlúnì
  rationale: Ìrísí orúkọ yìí ni ó wọ́pọ̀, ó sì ṣeé kà ní Yorùbá.
- source_word: Νεφθαλίμ
  choice: Náfútálì
  rationale: Ìrísí orúkọ yìí ni ó wọ́pọ̀, ó sì ṣeé kà ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A tú àwọn ọ̀rọ̀ ìṣe alábápín Gíríìkì sí ọ̀wọ́ ọ̀rọ̀ ìṣe tó ṣe kedere ní Yorùbá, láì pàdánù tẹ̀léńtẹ̀lé ìṣẹ̀lẹ̀ náà.
