  to: Àwọn ènìyàn tí wọ́n jókòó nínú òkùnkùn rí ìmọ́lẹ̀ ńlá; àwọn tí wọ́n jókòó ní agbègbè àti ní òjìji ikú[a], ìmọ́lẹ̀ là sí wọn.
  rationale: Àtúnṣe náà ṣàtúnṣe ìṣọ̀kan ọ̀pọ̀ ènìyàn àti aṣojú-ọrọ, yọ ‘fún’ kúrò kí ìtẹ̀lé apá Gíríìkì méjèèjì lè dúró ní ìbáradọ́gba, ó sì tún ‘ní’ sọ fún ìtumọ̀ ipò tó ṣe kedere. A kò yí àwòrán òkùnkùn, ìmọ́lẹ̀, tàbí òjìji ikú padà, bẹ́ẹ̀ ni a kò fi ìtumọ̀ ẹ̀kọ́ ìsìn pàtó kún un.
