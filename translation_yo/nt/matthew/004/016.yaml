  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò-orísun Gíríìkì pàtàkì mọ́: àwọn ènìyàn, jíjókòó nínú òkùnkùn, ìmọ́lẹ̀ ńlá, agbègbè àti òjìji ikú, àti ìmọ́lẹ̀ tí ó là sí wọn. Ṣùgbọ́n ‘fún àwọn’ kò fi ìbáṣepọ̀ ipò tí ó wà nínú gbólóhùn Gíríìkì náà hàn dáadáa, ó sì dín ìbáradọ́gba àwọn apá méjèèjì kù.'
  naturalness: ‘Àwọn ènìyàn tí wọ́n jókòó’ jẹ́ èdè Yorùbá tó rọrùn, tó sì bá olùtọ́ka ọ̀pọ̀ ‘àwọn ènìyàn’ mu dáadáa ju ‘àwọn ènìyàn tí ó jókòó’ lọ. Lílo ‘ní’ níwájú ‘òjìji ikú’ pẹ̀lú tún mú kí àwọn ibi méjèèjì tí orísun náà so pọ̀ hàn kedere.
