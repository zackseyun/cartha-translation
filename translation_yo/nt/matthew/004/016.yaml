id: MAT.4.16
reference: Matthew 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: yo
  text: Àwọn ènìyàn tí wọ́n jókòó nínú òkùnkùn rí ìmọ́lẹ̀ ńlá; àwọn tí wọ́n jókòó ní agbègbè àti ní òjìji ikú[a], ìmọ́lẹ̀ là sí wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú ‘òjìji ikú’ sí ‘òkùnkùn biribiri.’ A pa ‘òjìji ikú’ mọ́ nínú ẹsẹ náà nítorí ọ̀rọ̀ Gíríìkì náà mẹ́nu kan ‘ikú’ ní kedere, ó sì ń ṣe ìrántí àwòrán Bíbélì tí a mọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: àwọn ènìyàn
  rationale: Ó ń tọ́ka sí àwùjọ ènìyàn lápapọ̀; yíyan ‘àwọn ènìyàn’ yẹra fún ìtumọ̀ òṣèlú tàbí ẹ̀yà tí ‘orílẹ̀-èdè’ lè mú wá.
- source_word: καθήμενος / καθημένοις
  choice: tí ó jókòó
  rationale: Ìtumọ̀ tààrà ni ‘jòkòó’; ó sì pa àwòrán àsọtẹ́lẹ̀ àti ìbáradọ́gba àwọn gbólóhùn méjèèjì mọ́, bó tilẹ̀ jẹ́ pé ‘tí ó ń gbé’ tún ṣeé ṣe.
- source_word: σκοτίᾳ
  choice: òkùnkùn
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún ọ̀rọ̀ náà, ó sì jẹ́ kí àwòrán náà lè ní agbára gidi àti ti àpẹẹrẹ láìfi dandan sọ pé ẹ̀ṣẹ̀, àìmọ̀, tàbí ìpọ́njú nìkan ni.
- source_word: φῶς εἶδεν μέγα
  choice: rí ìmọ́lẹ̀ ńlá
  rationale: Ó pa ìṣe tó ti ṣẹlẹ̀ àti ìyàlẹ́nu ìfarahàn ìmọ́lẹ̀ ńlá náà mọ́ ní èdè Yorùbá àdánidá.
- source_word: χώρᾳ
  choice: agbègbè
  rationale: ‘Agbègbè’ fi ibi tàbí ilẹ̀ kan hàn láìjẹ́ kí a rò pé orílẹ̀-èdè òde òní ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: σκιᾷ θανάτου
  choice: òjìji ikú
  rationale: Ó tẹ̀ lé àwọn ọ̀rọ̀ Gíríìkì tó mẹ́nu kan ikú ní kedere, ó sì pa àwòrán Bíbélì tí a mọ̀ mọ́.
- source_word: ἀνέτειλεν
  choice: là
  rationale: Ọ̀rọ̀ yìí ń mú àwòrán ìmọ́lẹ̀ tó ń yọ tàbí tó ń là jáde wá lọ́nà àdánidá ní Yorùbá.
- source_word: αὐτοῖς
  choice: sí wọn
  rationale: Ó fi àwọn olùgbà ìmọ́lẹ̀ náà hàn ní kedere, ó sì bá lílo ‘ìmọ́lẹ̀ là sí wọn’ mu ní Yorùbá.
theological_decisions:
- issue: Irú òkùnkùn àti ìmọ́lẹ̀ tí àwòrán náà dúró fún
  choice: Pa àwòrán òkùnkùn àti ìmọ́lẹ̀ mọ́ láìdín ìtumọ̀ rẹ̀ kù sí ohun kan pàtó.
  alternative: Ṣàlàyé òkùnkùn gẹ́gẹ́ bí ẹ̀ṣẹ̀ tàbí àìmọ̀ àwọn Kèfèrí, kí a sì pe ìmọ́lẹ̀ ní ìfihàn ìgbàlà Mèsáyà ní tààrà.
  rationale: Àyọkà Gíríìkì náà, tó ń sọ àsọtẹ́lẹ̀ Aísáyà, ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀, ṣùgbọ́n kò sọ ní pàtó nínú gbólóhùn yìí pé ohun kan ṣoṣo ni òkùnkùn tàbí ìmọ́lẹ̀ dúró fún.
translation_notes:
  register: A lo Yorùbá boṣewa tó níyì, tó ṣeé lóye ní òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnsọ ‘tí ó jókòó’ pa ìbáradọ́gba ewì àti àsọtẹ́lẹ̀ orísun náà mọ́.
