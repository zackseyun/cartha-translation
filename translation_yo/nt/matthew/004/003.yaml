id: MAT.4.3
reference: Matthew 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: yo
  text: Olùdánwò náà sì sún mọ́ ọn, ó sì wí fún un pé, “Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run[a], sọ fún àwọn òkúta wọ̀nyí pé kí wọ́n di búrẹ́dì[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Níwọ̀n bí ìwọ ti jẹ́ Ọmọ Ọlọ́run.” Gbólóhùn àídájú Gíríìkì náà lè ṣiṣẹ́ gẹ́gẹ́ bí ìpèníjà dípò fífi iyèméjì lásán hàn.
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, ọ̀pọ̀ nọ́ńbà ni “búrẹ́dì” (“àwọn ìṣù búrẹ́dì”). Yorùbá sábà máa ń lo “búrẹ́dì” gẹ́gẹ́ bí orúkọ àpapọ̀ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò sún mọ́ Jésù hàn, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu gẹ́gẹ́ bí iṣẹ́ tí ó ṣáájú ọ̀rọ̀ olùdánwò náà.
- source_word: ὁ πειράζων
  choice: Olùdánwò náà
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ oyè fún ẹni tí ń dán Jésù wò; ó pa ìtumọ̀ dídánwò àti ìtanilọ́wọ́ sí ibi mọ́ láìfi àlàyé ẹ̀kọ́ kan kún un.
- source_word: εἶπεν αὐτῷ
  choice: ó sì wí fún un pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá, ọlọ́lá láti sọ pé ó bá a sọ̀rọ̀, ó sì tẹ̀ lé ìtumọ̀ ọ̀rọ̀ Gíríìkì náà pẹ́kípẹ́kí.
- source_word: Εἰ
  choice: Bí ... bá
  rationale: Ìṣètò ‘bí ... bá’ pa àídájú inú Gíríìkì mọ́, láìdájọ́ pé olùdánwò náà ń ṣiyèméjì tàbí pé ó ti gbà ọ̀rọ̀ náà gbọ́.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Nínú àyíká Mátíù, èyí jẹ́ orúkọ oyè pàtó fún Jésù, kì í ṣe ọ̀kan lára àwọn ọmọ Ọlọ́run lásán.
- source_word: εἰπὲ ἵνα
  choice: sọ fún ... pé kí
  rationale: Ìṣètò yìí fi agbára ọ̀rọ̀ àṣẹ inú gbólóhùn náà hàn ní Yorùbá àdánidá, ṣùgbọ́n kò lo ọ̀rọ̀ tó lágbára ju λέγω lọ bí ‘pa láṣẹ.’
- source_word: οἱ λίθοι οὗτοι
  choice: àwọn òkúta wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà àti ìtẹnumọ́ ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: ἄρτοι
  choice: búrẹ́dì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ nọ́ńbà ni ọ̀rọ̀ Gíríìkì náà, ‘búrẹ́dì’ jẹ́ ọ̀nà àdánidá tí Yorùbá òde òní fi ń sọ ohun jíjẹ náà; àlàyé ìsàlẹ̀ sọ ọ̀pọ̀ nọ́ńbà náà di mímọ̀.
- source_word: γένωνται
  choice: di
  rationale: ‘Di’ jẹ́ ọ̀nà ṣókí, àdánidá, tí kò sì fi ìtumọ̀ àfikún sí γίνομαι.
theological_decisions:
- issue: Agbára gbólóhùn àídájú Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: “Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run”
  alternative: “Níwọ̀n bí ìwọ ti jẹ́ Ọmọ Ọlọ́run” tàbí “Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run nítòótọ́”
  rationale: Gíríìkì lè jẹ́ ìpèníjà dípò iyèméjì lasán. Ọ̀rọ̀ inú àkọ́kọ́ pa ìfojúméjì àti ìforígbárí ẹ̀kọ́ náà mọ́ láìyanju rẹ̀ fún òǹkàwé.
- issue: Orúkọ oyè Kristi υἱὸς τοῦ θεοῦ
  choice: “Ọmọ Ọlọ́run”
  alternative: “ọmọ kan ti Ọlọ́run”
  rationale: Àyíká ìtàn Mátíù fi hàn pé orúkọ oyè pàtó ni èyí fún Jésù, kì í ṣe ìsọ̀rí gbogbogbò fún ọ̀kan lára ọ̀pọ̀ ọmọ.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá tí ó tún ṣe kedere fún òǹkàwé òde òní. “Wí fún un pé” mú ìró Bíbélì ọlọ́lá wá láìdi ọ̀rọ̀ náà sí àtijọ́ tàbí ṣòro láti lóye.
