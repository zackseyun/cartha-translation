id: MAT.4.6
reference: Matthew 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: yo
  text: 'Ó sì sọ fún un pé, “Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run, ju ara rẹ sílẹ̀[a], nítorí a ti kọ ọ́ pé:


    ‘Yóò pàṣẹ fún àwọn áńgẹ́lì rẹ̀ nípa rẹ,’


    àti pé,


    ‘Wọ́n yóò gbé ọ́ sókè lórí ọwọ́ wọn[b],

    kí ẹsẹ̀ rẹ má bàa kọlu òkúta.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “sọ ara rẹ sílẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Wọ́n yóò rù ọ́ lórí ọwọ́ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì sọ
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ní Gíríìkì jẹ́ historical present nínú ìtàn; àsìkò àtijọ́ ni ó bá Yorùbá ìtàn mu jù.
- source_word: Εἰ
  choice: Bí ... bá
  rationale: Ìkọ̀lé àídájú yìí pa agbára ìdánwò náà mọ́ láì sọ pé ẹni tó ń sọ̀rọ̀ ti fohùn ṣọ̀kan pé ọ̀rọ̀ náà jẹ́ òtítọ́.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Nínú àyíká Mátíù, gbólóhùn náà jẹ́ orúkọ oyè tó ń tọ́ka sí ẹni pàtó, kì í ṣe ọ̀kan lára ọ̀pọ̀ ọmọ Ọlọ́run.
- source_word: βάλε σεαυτὸν κάτω
  choice: ju ara rẹ sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere láti sọ àṣẹ pé kí ẹni náà fi ara rẹ̀ sọ̀ kalẹ̀ láti ibi gíga.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí ohun tí a kọ sínú Ìwé Mímọ́, ó sì pa ìtumọ̀ pé ohun tí a kọ náà ṣì dúró mọ́.
- source_word: ἐντελεῖται
  choice: Yóò pàṣẹ
  rationale: Ó fi agbára àṣẹ tí ọ̀rọ̀ ìṣe Gíríìkì náà ní hàn ní kedere.
- source_word: περὶ σοῦ
  choice: nípa rẹ
  rationale: Èyí túmọ̀ περί pẹ̀lú ọ̀rọ̀-orúkọ oníbátan ní tààràtà, ó sì pa ìtumọ̀ ‘concerning you’ mọ́.
- source_word: ἐπὶ χειρῶν
  choice: ní ọwọ́ wọn
  rationale: Ìkọ̀lé yìí jẹ́ èdè Yorùbá àdánidá fún àwòrán pé ọwọ́ àwọn áńgẹ́lì ni yóò gbé e ró.
- source_word: ἀροῦσίν σε
  choice: Wọ́n yóò gbé ọ sókè
  rationale: αἴρω níhìn-ín lè túmọ̀ sí gbígbé sókè tàbí rírù; ‘gbé ọ sókè’ ṣe kedere, ó sì pa àwòrán ààbò náà mọ́.
- source_word: μήποτε προσκόψῃς
  choice: kí ... má bàa kọlu
  rationale: Ìkọ̀lé ‘kí ... má bàa’ fi ète ìdènà μήποτε hàn, ‘kọlu’ sì sọ ìfarakanra ẹsẹ̀ mọ́ òkúta ní pàtó.
- source_word: πρὸς λίθον
  choice: kọlu òkúta
  rationale: ‘Òkúta’ láìsí atọ́ka pàtó bá orúkọ Gíríìkì aláìló atíkù mu, ‘kọlu’ sì gba ìtumọ̀ πρὸς gẹ́gẹ́ bí ìfarakanra.
- source_word: τὸν πόδα σου
  choice: ẹsẹ̀ rẹ
  rationale: A pa ẹyọ ọ̀rọ̀ Gíríìkì náà mọ́ ní Yorùbá.
theological_decisions:
- issue: Agbára Kristọ́lójì ti ‘Ọmọ Ọlọ́run’ nínú ìpèníjà olùdánwò
  choice: A túmọ̀ rẹ̀ sí orúkọ oyè ‘Ọmọ Ọlọ́run.’
  alternative: ‘ọmọ kan ti Ọlọ́run’ tàbí ọ̀rọ̀ tí kò fi oyè ẹni pàtó hàn
  rationale: Nínú ìtàn Mátíù, gbólóhùn náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Kristọ́lójì tí a mọ̀; ìtumọ̀ yìí pa agbára ọ̀rọ̀ orísun mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
- issue: Èṣù ń fa ọ̀rọ̀ Sáàmù 91 yọ láti inú Ìwé Mímọ́
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ó ṣe fa á yọ, láìṣe àtúnṣe tàbí àlàyé nínú ẹsẹ náà.
  alternative: Fífi àlàyé kún ọ̀rọ̀ inú ẹsẹ náà láti sọ bí a ṣe yẹ kí a lóye àyọlò náà
  rationale: Ọ̀rọ̀ orísun fúnra rẹ̀ mú kí a rí pé olùdánwò ń tọ́ka sí Ìwé Mímọ́; ìtumọ̀ kò gbọ́dọ̀ yanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní àmì ohùn níbi tó yẹ, tó sì jẹ́ ọ̀wọ̀, kedere, àti àdánidá fún òǹkàwé òde òní. A lo ìtòlẹ́sẹẹsẹ ewì fún ọ̀rọ̀ tí a fa yọ láti inú Sáàmù.
