id: MAT.4.14
reference: Matthew 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: yo
  text: 'kí ohun tí a ti sọ nípasẹ̀ wòlíì Aísáyà lè ṣẹ, pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: kí … lè
  rationale: Ìṣọ̀kan yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìdí tàbí àbájáde hàn, ó sì pa agbára gbólóhùn ἵνα mọ́.
- source_word: πληρωθῇ
  choice: ṣẹ
  rationale: Nínú ọ̀rọ̀ nípa Ìwé Mímọ́, ‘ṣẹ’ túmọ̀ sí pé ohun tí a ti sọ tẹ́lẹ̀ wá sí ìmúṣẹ; ìṣètò ‘kí … lè ṣẹ’ tún pa ìtumọ̀ subjunctive mọ́ ní Yorùbá àdánidá.
- source_word: τὸ ῥηθὲν
  choice: ohun tí a ti sọ
  rationale: Ó tú participle tí a lò bí ọ̀rọ̀-orúkọ sí Yorùbá tó ṣe kedere, ó sì pa passive rẹ̀ mọ́ láì sọ ẹni tó sọ ọ́ sí gbangba.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: ‘Nípasẹ̀’ fi Aísáyà hàn gẹ́gẹ́ bí alárinà tí ọ̀rọ̀ náà ti gba ẹnu rẹ̀ jáde, dípò kí ó mú un dà bí orísun ìkẹyìn.
- source_word: Ἠσαΐου
  choice: Aísáyà
  rationale: Èyí ni ìkọ̀wé orúkọ wòlíì náà tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: τοῦ προφήτου
  choice: wòlíì
  rationale: Ó pa ipò Aísáyà gẹ́gẹ́ bí wòlíì mọ́. Yorùbá kò nílò article ọ̀tọ̀ níbí.
- source_word: λέγοντος
  choice: 'pé:'
  rationale: Ní Yorùbá, ‘pé:’ ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ àyọlò tó ń bọ̀; yíyí i padà sí ‘ní sísọ pé’ yóò le gan-an, yóò sì dà bí ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀.
theological_decisions:
- issue: Ọ̀nà ìmúṣẹ àsọtẹ́lẹ̀ nínú Mátíù
  choice: kí … lè ṣẹ
  alternative: kí … lè wá sí ìmúṣẹ
  rationale: ‘Ṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bójú mu fún ìmúṣẹ ohun tí Ìwé Mímọ́ sọ. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘nípasẹ̀’ láti pa ìtumọ̀ alárinà mọ́, a sì lo ‘pé:’ láti darí olùkà sí àyọlò ẹsẹ tó tẹ̀ lé e.
