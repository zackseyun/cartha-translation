  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: yo
  text: Láti ìgbà náà ni Jésù ti bẹ̀rẹ̀ sí í kéde pé, “Ẹ ronúpìwàdà, nítorí ìjọba ọ̀run[b] ti sún mọ́lé[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ti dé sí tòsí” tàbí “wà nítòsí.” Ọ̀rọ̀ ìṣe náà wà ní àkókò pípé ní Gíríìkì, ó sì tẹnu mọ́ ọn pé ìsúnmọ́ ìjọba náà ti dé, ó sì ṣì ń bá a lọ.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ìjọba àwọn ọ̀run.” Mátíù sábà máa ń lo gbólóhùn yìí níbi tí àwọn ẹsẹ̀ míì ti sábà máa ń sọ pé “ìjọba Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Láti ìgbà náà
  rationale: Ó fi àmì sí ìyípadà pàtàkì nínú ìtàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: ἤρξατο
  choice: bẹ̀rẹ̀ sí í
  rationale: Ó túmọ̀ ìbẹ̀rẹ̀ iṣẹ́ tó tẹ̀ síwájú ní ọ̀nà àdánidá ní Yorùbá.
- source_word: κηρύσσειν καὶ λέγειν
  choice: kéde pé
  rationale: Ó mú iṣẹ́ ìkéde àti ohun tí a kéde pọ̀ ní Yorùbá tó rọrùn, láìsọ agbára ìkéde ní gbangba nù.
- source_word: Μετανοεῖτε
  choice: Ẹ ronúpìwàdà
  rationale: Ọ̀rọ̀ yìí ń pe ọ̀pọ̀ ènìyàn sí ìyípadà ọkàn àti ìwà; ‘ronúpìwàdà’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tí kò dín ìtumọ̀ náà kù sí ríronú lásán.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: 'Ìlò ‘ti’ pa ìtumọ̀ perfect mọ́: ìsúnmọ́ náà ti ṣẹlẹ̀, ó sì wà bẹ́ẹ̀ títí di ìsinsìnyí.'
- source_word: βασιλεία
  choice: ìjọba
  rationale: Ó lè gba ìtumọ̀ agbára ìṣàkóso àti ilẹ̀ ọba, bí ọ̀rọ̀ Gíríìkì náà ṣe lè rí.
- source_word: τῶν οὐρανῶν
  choice: ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni Gíríìkì, ‘ọ̀run’ ní ẹyọ jẹ́ ìlò Yorùbá àdánidá fún gbólóhùn Mátíù yìí.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  alternative: ìṣàkóso ọ̀run
  rationale: Ó pa ọ̀rọ̀ àrà ọ̀tọ̀ tí Mátíù máa ń lò mọ́, ó sì fi ààyè sílẹ̀ fún ìtumọ̀ ìṣàkóso Ọlọ́run láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Agbára Μετανοεῖτε
  choice: Ẹ ronúpìwàdà
  alternative: Ẹ yí padà
  rationale: Ó ní ìyípadà ọkàn àti ìgbésí ayé nínú, kì í ṣe yíyí èrò padà lásán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́lá, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. ‘kéde pé’ yàgò fún àfikún àsọtẹ́lẹ̀ ẹ̀sìn tó lè wà nínú ‘wàásù,’ ó sì tú ìbáṣepọ̀ κηρύσσειν καὶ λέγειν jáde ní àdánidá.
