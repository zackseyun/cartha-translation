id: MAT.4.24
reference: Matthew 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: yo
  text: Ìròyìn nípa rẹ̀ sì tàn ká gbogbo ilẹ̀ Síríà. Wọ́n sì mú gbogbo àwọn aláìsàn wá sọ́dọ̀ rẹ̀—àwọn tí onírúurú àìsàn àti ìrora ń dá lóró, àwọn tí àwọn ẹ̀mí èṣù ń pọ́n lójú[a], àwọn tí ń ní ìkọlù[b], àti àwọn tí ara wọn rọ—ó sì wo wọ́n sàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘àwọn tí ẹ̀mí èṣù wọ̀,’ tàbí, ‘àwọn abẹ́ agbára ẹ̀mí èṣù.’
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà, σεληνιαζομένους, ní ìsopọ̀ pẹ̀lú òṣùpá ní ìpilẹ̀ rẹ̀; ní ìgbà àtijọ́, àwọn ènìyàn kan máa ń rò pé òṣùpá ló ń fa irú ìkọlù bẹ́ẹ̀. A sábà máa ń túmọ̀ ọ́ sí àwọn aláìsàn wárápá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: Ìròyìn nípa rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí ohun tí àwọn ènìyàn ń gbọ́ nípa Jésù, ìyẹn ìròyìn rẹ̀, kì í ṣe agbára ìgbọ́ràn.
- source_word: ἀπῆλθεν
  choice: tàn ká
  rationale: Èyí fi àwòrán ìròyìn tí ó jáde tó sì dé gbogbo agbègbè hàn ní Yorùbá àdánidá.
- source_word: Συρίαν
  choice: ilẹ̀ Síríà
  rationale: Orúkọ agbègbè náà ni a ṣe àkọsílẹ̀ rẹ̀ ní ọ̀nà Yorùbá tí ó wọ́pọ̀.
- source_word: προσήνεγκαν
  choice: wọ́n mú ... wá sọ́dọ̀ rẹ̀
  rationale: Ó sọ ní kedere pé àwọn ènìyàn mú àwọn aláìsàn tọ Jésù wá.
- source_word: κακῶς ἔχοντας
  choice: gbogbo àwọn aláìsàn
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà àdánidá láti sọ nípa gbogbo àwọn tí ara wọn kò dá.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: àwọn tí onírúurú àìsàn àti ìrora ń dá lóró
  rationale: ‘Onírúurú àìsàn’ pa ìyàtọ̀ oríṣiríṣi mọ́; ‘ìrora ń dá lóró’ sì fi líle ìjìyà tí βάσανοι àti συνεχομένους ń tọ́ka sí hàn láìfi ohun tí orísun kò sọ kún un.
- source_word: δαιμονιζομένους
  choice: àwọn tí àwọn ẹ̀mí èṣù ń ṣe níṣẹ̀
  rationale: Ó jẹ́ Yorùbá òde òní tí ó jẹ́wọ́ ìpọ́njú ẹ̀mí èṣù, ṣùgbọ́n tí kò fi ẹ̀ka ìtumọ̀ ìmọ̀-ẹ̀sìn tóóró kan lé ọ̀rọ̀ Gíríìkì náà lórí.
- source_word: σεληνιαζομένους
  choice: àwọn tó ń ní ìkọlù àìsàn wárápá
  rationale: Èyí sọ àmì àìsàn tí olùkà Yorùbá òde òní lè mọ̀, láìjẹ́wọ́ pé òṣùpá ni ó ń fà á; àlàyé ìtumọ̀ ọ̀rọ̀ ní ti gidi wà ní àlàyé ìsàlẹ̀.
- source_word: παραλυτικούς
  choice: àwọn arọ
  rationale: ‘Àwọn arọ’ jẹ́ ọ̀rọ̀ Yorùbá ṣókí, tí ó wọ́pọ̀ fún àwọn tí ẹ̀yà ara wọn rọ tàbí tí kò lè ṣiṣẹ́.
- source_word: ἐθεράπευσεν
  choice: ó mú wọn lára dá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti ọlọ́lá láti sọ pé ó wo gbogbo wọn sàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ δαιμονιζομένους láìdín ìṣe ẹ̀mí èṣù kù tàbí fi ìtumọ̀ ẹ̀kọ́ kan tí ó tóóró kún un
  choice: àwọn tí àwọn ẹ̀mí èṣù ń ṣe níṣẹ̀
  alternative: àwọn tí ẹ̀mí èṣù wọ̀; àwọn abẹ́ agbára ẹ̀mí èṣù
  rationale: Ìtumọ̀ tí a yàn jẹ́wọ́ pé ìpọ́njú ẹ̀mí èṣù jẹ́ ohun gidi, ṣùgbọ́n ó pa ìwọ̀n ìtumọ̀ participle Gíríìkì mọ́ dípò fífi dandan sọ ọ́ di ‘níní ẹ̀mí èṣù’ ní ìtumọ̀ tóóró.
- issue: Bí a ṣe máa túmọ̀ σεληνιαζομένους láìjẹ́wọ́ ìmọ̀ ìdí àìsàn tí ó so ó mọ́ òṣùpá
  choice: àwọn tó ń ní ìkọlù àìsàn wárápá
  alternative: àwọn tí òṣùpá ń ṣe; àwọn tó ń ní ìkọlù
  rationale: Ìtumọ̀ àkọ́kọ́ sọ irú ìpọ́njú ara tí ọ̀rọ̀ náà ń tọ́ka sí ní èdè tí ó ṣeé lóye, nígbà tí àlàyé ìsàlẹ̀ pa ìsopọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ pẹ̀lú òṣùpá.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà jẹ́ ọlọ́lá, ó sì ṣeé lóye fún àwọn olùkà gbogbogbò. Àmì ìdádúró gígùn ṣàlàyé pé àwọn ẹ̀ka tó tẹ̀ lé e jẹ́ àpẹẹrẹ àwọn aláìsàn tí a mú wá, láìpa àìdánilójú ìbáṣepọ̀ àwọn participle Gíríìkì rẹ́ patapata.
