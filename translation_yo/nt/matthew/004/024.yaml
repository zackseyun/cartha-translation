revisions:
- from: Ìròyìn nípa rẹ̀ sì tàn ká gbogbo ilẹ̀ Síríà. Wọ́n sì mú gbogbo àwọn aláìsàn wá sọ́dọ̀ rẹ̀—àwọn tí onírúurú àìsàn àti ìrora ń dá lóró, àwọn tí àwọn ẹ̀mí èṣù ń ṣe níṣẹ̀[a], àwọn tó ń ní ìkọlù àìsàn wárápá[b], àti àwọn arọ—ó sì mú wọn lára dá.
  to: Ìròyìn nípa rẹ̀ sì tàn ká gbogbo ilẹ̀ Síríà. Wọ́n sì mú gbogbo àwọn aláìsàn wá sọ́dọ̀ rẹ̀—àwọn tí onírúurú àìsàn àti ìrora ń dá lóró, àwọn tí àwọn ẹ̀mí èṣù ń pọ́n lójú[a], àwọn tí ń ní ìkọlù[b], àti àwọn tí ara wọn rọ—ó sì wo wọ́n sàn.
  rationale: The revision preserves the source sequence and ambiguity while using more natural Yoruba for demonic oppression and healing. It replaces the broad term arọ with wording that specifically denotes paralysis, and the footnote continues to document the moon-related etymology of σεληνιαζομένους without endorsing an ancient causal explanation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft faithfully retains every principal source element: the report spreading throughout Syria, people being brought to Jesus, varied diseases and severe sufferings, demonic affliction, seizure-like illness, paralysis, and Jesus'' healing. Two expressions can be made more precise: àwọn arọ may denote lameness or disability more broadly than παραλυτικούς, and mú wọn lára dá is less direct than the ordinary Yoruba expression for physical healing.'
  naturalness: The text is generally clear Standard Yoruba. Replacing the less idiomatic phrase àwọn ẹ̀mí èṣù ń ṣe níṣẹ̀ with àwọn ẹ̀mí èṣù ń pọ́n lójú, simplifying the seizure expression, and using wọ́n sàn improves modern readability and parallelism.
  terminology: Síríà, ìròyìn, onírúurú àìsàn, and ìrora are suitable. àwọn tí ara wọn rọ better represents paralytics without narrowing the condition beyond the Greek. The revised demonic-affliction wording preserves the supernatural referent without forcing a technical doctrine of possession.
  issues:
  - severity: medium
    issue: Àwọn arọ is broader than παραλυτικούς.
    rationale: In current Yoruba usage, arọ may refer to lame or disabled people generally. Àwọn tí ara wọn rọ more directly conveys paralysis.
  - severity: low
    issue: Àwọn ẹ̀mí èṣù ń ṣe níṣẹ̀ is somewhat marked and less idiomatic in this healing-list context.
    rationale: Àwọn ẹ̀mí èṣù ń pọ́n lójú is natural Yoruba for people oppressed or tormented by demons and preserves the Greek's breadth.
  - severity: low
    issue: Ó mú wọn lára dá is less explicit as a rendering of ἐθεράπευσεν.
    rationale: Ó sì wo wọ́n sàn is the conventional, direct Yoruba expression for healing.
  revised_text: Ìròyìn nípa rẹ̀ sì tàn ká gbogbo ilẹ̀ Síríà. Wọ́n sì mú gbogbo àwọn aláìsàn wá sọ́dọ̀ rẹ̀—àwọn tí onírúurú àìsàn àti ìrora ń dá lóró, àwọn tí àwọn ẹ̀mí èṣù ń pọ́n lójú[a], àwọn tí ń ní ìkọlù[b], àti àwọn tí ara wọn rọ—ó sì wo wọ́n sàn.
