id: MAT.4.19
reference: Matthew 4:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ wá tọ̀ mí lẹ́yìn, èmi yóò sì sọ yín di apẹja àwọn ènìyàn.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Greek, gbólóhùn náà túmọ̀ ní tààràtà sí “apẹja àwọn ènìyàn”; “ènìyàn” níbí ń tọ́ka sí gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì sọ
  rationale: Yorùbá máa ń lo ọ̀rọ̀ ìṣe àkókò tí ó ti kọjá ní àlàyé ìtàn; èyí mú ìtumọ̀ Greek historical present jáde lọ́nà àdánidá láì fi ìṣe tí ń lọ lọ́wọ́ kún un.
- source_word: Δεῦτε
  choice: Ẹ wá
  rationale: Ó pa agbára ìpè pàṣẹ náà mọ́, ó sì yà á sọ́tọ̀ kúrò nínú ọ̀rọ̀ tó tẹ̀ lé e.
- source_word: ὀπίσω μου
  choice: tọ̀ mí lẹ́yìn
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ara ẹni tẹ̀ lé ẹlòmíràn gẹ́gẹ́ bí ọmọ-ẹ̀yìn, nígbà tó ṣì pa àwòrán ‘lẹ́yìn mi’ mọ́.
- source_word: ποιήσω
  choice: èmi yóò sọ yín di
  rationale: Ó fi ìlérí ọjọ́ iwájú àti iṣẹ́ ìyípadà tí Jésù fúnra rẹ̀ yóò ṣe hàn kedere.
- source_word: ἁλιεῖς
  choice: apẹja
  rationale: ‘Apẹja’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ẹni tó ń pẹja; kò sì fi akọ tàbí abo tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Nínú àyíká yìí, ἄνθρωπος ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀. ‘Àwọn ènìyàn’ mú ìtumọ̀ gbogbogbò yẹn jáde ní Yorùbá láì dín in sí àwọn ọkùnrin nìkan.
theological_decisions:
- issue: Ìtumọ̀ gbogbogbò ti ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Greek náà ní ìrísí akọ nípa gírámà, ó ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀ níbí. Yorùbá ‘ènìyàn’ kò ní ìyàtọ̀ akọ àti abo, ó sì pa ìtumọ̀ orísun mọ́ láì mú un dín kù.
- issue: Àwòrán ‘apẹja àwọn ènìyàn’
  choice: pa àwòrán ìpẹja mọ́
  alternative: ẹni tí ń mú àwọn ènìyàn wá di ọmọ-ẹ̀yìn
  rationale: Àwòrán náà jẹ́ apá pàtàkì ti ọ̀rọ̀ Jésù, ó sì yẹ kí a má ṣe túmọ̀ rẹ̀ sí ẹ̀kọ́ kan pàtó tàbí ṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: A lo Yorùbá boṣewa tó níyì, tó sì ṣeé lóye ní òde òní. ‘Ẹ wá tọ̀ mí lẹ́yìn’ pa ìpè Δεῦτε àti àwòrán ὀπίσω μου pọ̀ mọ́ ní ọ̀nà àdánidá; ‘èmi’ ni a tẹnumọ́ díẹ̀ láti fi ẹni tí yóò ṣe ìyípadà náà hàn.
