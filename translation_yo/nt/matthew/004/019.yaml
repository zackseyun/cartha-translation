  source_fidelity: 'Ìtumọ̀ náà ń pa gbogbo àwọn apá pàtàkì ti Gíríìkì mọ́: ìpè náà (Δεῦτε), ipò ‘lẹ́yìn mi’ (ὀπίσω μου), ìlérí ọjọ́ iwájú náà, àti àwòrán àwọn apẹja ènìyàn. Lílo àkókò ìtàn tí ó ti kọjá nínú Yorùbá fún λέγει jẹ́ ohun àdánidá, kò sì yí ìṣẹ̀lẹ̀ náà padà.'
