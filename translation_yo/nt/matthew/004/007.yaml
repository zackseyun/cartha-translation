  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: yo
  text: Jésù sọ fún un pé, “A tún kọ ọ pé, ‘Ìwọ kò gbọdọ̀ dán Olúwa[b] Ọlọ́run rẹ wò[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ kò gbọdọ̀ fi Olúwa Ọlọ́run rẹ sí àdánwò.” Ọ̀rọ̀ Gíríìkì ἐκπειράζω lè túmọ̀ sí “dán wò” tàbí “fi sí àdánwò.”
    reason: lexical_alternative
  - marker: b
    text: Èyí jẹ́ àyọlò láti Diutarónómì 6:16. “Olúwa” nínú Gíríìkì ń tẹ̀ lé Septuagint, èyí tí ó lo κύριος gẹ́gẹ́ bí ìtumọ̀ orúkọ Ọlọ́run.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn tó ń ṣáájú ọ̀rọ̀ ẹni; ó pa ẹni tó ń sọ̀rọ̀ àti ẹni tí a ń bá sọ̀rọ̀ mọ́ láìfi agbára míì kún ọ̀rọ̀ Gíríìkì.
- source_word: Πάλιν γέγραπται
  choice: A tún kọ ọ pé
  rationale: “Tún” mú ìtumọ̀ πάλιν jáde, “a kọ ọ” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àgbékalẹ̀ àyọlò Ìwé Mímọ́ γέγραπται, tí ó ń tọ́ka sí ohun tí a ti kọ tí ó sì dúró gẹ́gẹ́ bí àṣẹ.
- source_word: Οὐκ ἐκπειράσεις
  choice: Ìwọ kò gbọdọ̀ dán ... wò
  rationale: Ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ń ṣiṣẹ́ gẹ́gẹ́ bí òfin ìdènà níbí. “Kò gbọdọ̀” mú agbára àṣẹ náà hàn, “dán ... wò” sì pa ààyè ìtumọ̀ ἐκπειράζω mọ́ láìṣàlàyé rẹ̀ ré kọjá.
- source_word: κύριον τὸν θεόν σου
  choice: Olúwa Ọlọ́run rẹ
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá àdánidá fún κύριος, “Ọlọ́run rẹ” sì mú àfikún ìbáṣepọ̀ τὸν θεόν σου jáde. A kò lo ìkọ̀wé OLÚWA nítorí pé orísun lẹ́sẹ̀kẹsẹ̀ jẹ́ κύριος nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyọlò Ìwé Mímọ́ tó ń tọ́ka sí Ọlọ́run Ísírẹ́lì
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì lẹ́sẹ̀kẹsẹ̀ ni κύριον, nítorí náà “Olúwa” ni a lò. Àlàyé ìsàlẹ̀ ojú ìwé sọ pé àyọlò náà tẹ̀ lé Septuagint, tí κύριος ti dúró fún orúkọ Ọlọ́run nínú Hébérù.
- issue: Agbára òfin nínú Οὐκ ἐκπειράσεις
  choice: Ìwọ kò gbọdọ̀ dán ... wò
  alternative: Má ṣe dán ... wò
  rationale: “Kò gbọdọ̀” pa ìrísí òfin ìdènà mọ́ ní Yorùbá tó ṣe kedere, nígbà tí “má ṣe” jẹ́ àṣẹ tààrà tó lè dín ìrísí àyọlò òfin náà kù.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. Àgbékalẹ̀ “A tún kọ ọ pé” jẹ́ kíkà tó rọrùn fún òǹkàwé lónìí, ó sì pa ìlò àṣẹ Ìwé Mímọ́ mọ́. Àwọn àmì ìsàlẹ̀ ojú ìwé [a] àti [b] wà lẹ́yìn àyọlò tí wọ́n ń ṣàlàyé.
