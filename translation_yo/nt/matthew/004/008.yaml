id: MAT.4.8
reference: Matthew 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: yo
  text: Bìlísì tún mú un lọ sí òkè kan tí ó ga gidigidi, ó sì fi gbogbo àwọn ìjọba ayé àti ògo wọn[a] hàn án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọláńlá wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: tún
  rationale: Ó fi hàn pé ìdánwò mìíràn tún ń ṣẹlẹ̀ nínú ìtẹ̀lé ìṣẹ̀lẹ̀ náà; ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘lẹ́ẹ̀kan sí i’ ní Yorùbá.
- source_word: παραλαμβάνει
  choice: mú un lọ
  rationale: Ó sọ ìrìn-àjò pẹ̀lú ẹni náà ní kedere láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un. A lo àsìkò àtijọ́ nítorí pé ó bá ìtàn Yorùbá mu dáadáa.
- source_word: ὁ διάβολος
  choice: Èṣù
  rationale: Èyí ni orúkọ àkọ́lé tí ó wọ́pọ̀, tí ó ṣe kedere fún διάβολος nínú àyíká yìí.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: sí orí òkè kan tí ó ga gidigidi
  rationale: ‘Sí orí òkè’ mú ìṣípò lọ sí ibi náà jáde, ‘ga gidigidi’ sì pa agbára λίαν mọ́ ní Yorùbá àdánidá.
- source_word: δείκνυσιν
  choice: fi ... hàn án
  rationale: Èyí ni ọ̀nà Yorùbá tí ó rọrùn, tí ó sì péye fún fífi ohun kan hàn ẹnì kan.
- source_word: πάσας τὰς βασιλείας
  choice: gbogbo àwọn ìjọba
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ àti ìkúnrẹ́rẹ́ πᾶς mọ́, ó sì pa ìtumọ̀ ìṣèlú àti ti ọba nínú βασιλεία mọ́.
- source_word: τοῦ κόσμου
  choice: ayé
  rationale: Nínú àyíká yìí, κόσμος tọ́ka sí gbogbo ayé; ‘ayé’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù lọ.
- source_word: τὴν δόξαν αὐτῶν
  choice: ògo wọn
  rationale: ‘Ògo’ pa ìbáṣepọ̀ ọ̀rọ̀ δόξα mọ́, ó sì lè tọ́ka sí ọlá àti ọ̀láńlá tí àwọn ìjọba náà ní; àṣàyàn tó túmọ̀ sí ọ̀láńlá wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Irú ìran tí ó ṣẹlẹ̀ lórí òkè nínú ìtàn ìdánwò náà
  choice: A túmọ̀ ìṣẹ̀lẹ̀ náà gẹ́gẹ́ bí a ṣe ròyìn rẹ̀, láì sọ bóyá fífi gbogbo ìjọba hàn jẹ́ ìran, iṣẹ́ agbára àrà ọ̀tọ̀, tàbí ohun tí ojú lè rí láti orí òkè.
  alternative: A lè ṣàlàyé rẹ̀ gẹ́gẹ́ bí ohun tí ojú rí láti orí òkè gidi, tàbí gẹ́gẹ́ bí ìran tàbí ìfihàn agbára àrà ọ̀tọ̀.
  rationale: Ọ̀rọ̀ Gíríìkì kàn sọ pé Èṣù mú Jesu lọ sí orí òkè gíga, ó sì fi gbogbo ìjọba ayé àti ògo wọn hàn án. Ìtumọ̀ náà kò gbọ́dọ̀ yan àlàyé tí orísun kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘tí ó ga gidigidi’ dípò àkójọpọ̀ ọ̀rọ̀ líle, a sì lo àsìkò àtijọ́ tí ó jẹ́ àdánidá nínú ìtàn Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo present historical.
