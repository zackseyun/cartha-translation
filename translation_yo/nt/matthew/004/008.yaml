revisions:
- from: Èṣù tún mú un lọ sí orí òkè kan tí ó ga gidigidi, ó sì fi gbogbo àwọn ìjọba ayé àti ògo wọn[a] hàn án.
  to: Bìlísì tún mú un lọ sí òkè kan tí ó ga gidigidi, ó sì fi gbogbo àwọn ìjọba ayé àti ògo wọn[a] hàn án.
  rationale: The revision retains the source’s narrative ambiguity and all lexical content while using a clearer modern Yorùbá term for the devil and removing the unsupported detail that the destination was the mountain’s summit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the repetition, taking, extreme height, universal scope of the kingdoms, and their glory. However, “Èṣù” can conventionally occur in some older Christian usage but also primarily denotes the distinct Yorùbá òrìṣà; “Bìlísì” identifies ὁ διάβολος more directly in modern Standard Yorùbá. Also, “sí orí òkè” specifically means ‘to the top of a mountain,’ whereas εἰς ὄρος states movement to a mountain without specifying its summit.
  naturalness: The clause sequence is fluent and appropriately narrative. “Sí òkè kan tí ó ga gidigidi” is equally natural and avoids the added specification of ‘top.’
  terminology: Use “Bìlísì” for ‘the devil’ to avoid conflating the Greek title with the Yorùbá religious figure Èṣù. “Ògo wọn” is a suitable rendering of δόξαν αὐτῶν; “ọláńlá wọn” is a valid lexical alternative.
  issues:
  - severity: medium
    issue: “Èṣù” for ὁ διάβολος may be semantically ambiguous in modern Yorùbá.
    rationale: Èṣù is also the proper name of a Yorùbá òrìṣà and is not simply equivalent to the Greek title διάβολος. “Bìlísì” is clearer for the devil/Satanic tempter intended by the source.
  - severity: low
    issue: “sí orí òkè kan” adds ‘to the top of.’
    rationale: The Greek says that he takes him to a very high mountain, but does not expressly state that they reach its summit. “Sí òkè kan” preserves the source’s scope.
  revised_text: Bìlísì tún mú un lọ sí òkè kan tí ó ga gidigidi, ó sì fi gbogbo àwọn ìjọba ayé àti ògo wọn[a] hàn án.
  revised_footnotes:
  - marker: a
    text: Tàbí, “ọláńlá wọn.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s narrative ambiguity and all lexical content while using a clearer modern Yorùbá term for the devil and removing the unsupported detail that the destination was the mountain’s summit.
