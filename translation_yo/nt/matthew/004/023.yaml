id: MAT.4.23
reference: Matthew 4:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: yo
  text: Ó sì ń lọ káàkiri gbogbo Gálílì, ó ń kọ́ni nínú àwọn sínágọ́gù wọn, ó ń kéde ìhìn rere ìjọba náà[a], ó sì ń wo gbogbo àìsàn àti gbogbo àìlera láàárín àwọn ènìyàn sàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìnrere ìjọba náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: ń lọ káàkiri
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi ìrìn-àjò tí ó ń bá a lọ hàn; “ń lọ káàkiri” tún pa ìtumọ̀ pé ó dé oríṣìíríṣìí ibi mọ́.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: káàkiri gbogbo Gálílì
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìrìn, gbólóhùn náà túmọ̀ sí pé ó rìn dé gbogbo agbègbè náà, kì í ṣe pé ó wà níbì kan ṣoṣo nínú rẹ̀.
- source_word: διδάσκων
  choice: ó ń kọ́ni
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún fífi ẹ̀kọ́ kọ àwọn ènìyàn, ó sì fi hàn pé iṣẹ́ náà ń lọ papọ̀ pẹ̀lú ìrìn-àjò rẹ̀.
- source_word: συναγωγαῖς αὐτῶν
  choice: àwọn sínágọ́gù wọn
  rationale: “Sínágọ́gù” tọ́ka sí ibi ìpàdé àti ìjọsìn àwọn Júù, “wọn” sì pa ọ̀rọ̀ arọ́pò-orúkọ inú Gíríìkì mọ́.
- source_word: κηρύσσων
  choice: ó ń kéde
  rationale: “Kéde” mú ìtumọ̀ ìpolongo ní gbangba àti pẹ̀lú àṣẹ tí κηρύσσω ní nínú àyíká yìí.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí túmọ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì náà ní tààràtà, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: τῆς βασιλείας
  choice: ti ìjọba náà
  rationale: Ìsọ̀rí “ti” dúró sún mọ́ ìbátan genitive inú Gíríìkì, láì fi dandan pinnu bóyá ìjọba náà ni ìhìn rere náà jẹ́ ti tàbí pé ìjọba náà ni kókó rẹ̀.
- source_word: θεραπεύων
  choice: ó ń wò ... sàn
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti sọ ìwòsàn gidi, kì í ṣe ìtọju lásán.
- source_word: πᾶσαν νόσον
  choice: gbogbo àìsàn
  rationale: “Àìsàn” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún νόσος, “gbogbo” sì pa ìtẹnumọ́ πᾶσαν mọ́.
- source_word: πᾶσαν μαλακίαν
  choice: gbogbo àìlera
  rationale: “Àìlera” mú ìtumọ̀ àìlágbára tàbí àìsàn inú μαλακία, ó sì jẹ́ kí ìyàtọ̀ díẹ̀ wà láàárín rẹ̀ àti νόσος.
- source_word: ἐν τῷ λαῷ
  choice: láàárín àwọn ènìyàn
  rationale: Èyí sọ ibi tí iṣẹ́ ìwòsàn náà ti ń ṣẹlẹ̀ ní Yorùbá àdánidá, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún λαός.
theological_decisions:
- issue: Ìtumọ̀ εὐαγγέλιον
  choice: ìhìn rere
  alternative: ihinrere
  rationale: “Ìhìn rere” jẹ́ kí ìtumọ̀ gangan hàn kedere ju lílo ọ̀rọ̀ ìjọsìn tí ó ti di ọ̀rọ̀ kan ṣoṣo lọ, láì yí ẹ̀kọ́ inú ọ̀rọ̀ náà padà.
- issue: Ìbátan τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ìhìn rere ti ìjọba náà
  alternative: ìhìn rere nípa ìjọba náà
  rationale: “Ti” pa ìṣọ̀kan genitive àti àìdájú tó bófin mu mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ pé ìjọba náà ni kókó ìhìn náà hàn.
- issue: Ìwọ̀n iṣẹ́ ìwòsàn nínú πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: gbogbo àìsàn àti gbogbo àìlera
  alternative: gbogbo onírúurú àìsàn àti àìlera
  rationale: Àtúmọ̀ náà pa πᾶσαν méjèèjì àti ìtẹnumọ́ àkópọ̀ rẹ̀ mọ́, láì da àwọn ọ̀rọ̀-orúkọ méjèèjì pọ̀ sí ọ̀kan.
translation_notes:
  register: A lo Yorùbá ìpele àárín tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn síbi tí ó bá yẹ, a sì lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ tí a ti mú wọ èdè fún ibi ìpàdé àwọn Júù. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tí àlàyé náà kan, dípò lẹ́yìn “Gálílì.”
