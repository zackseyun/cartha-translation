  to: Ó sì ń lọ káàkiri gbogbo Gálílì, ó ń kọ́ni nínú àwọn sínágọ́gù wọn, ó ń kéde ìhìn rere ìjọba náà[a], ó sì ń wo gbogbo àìsàn àti gbogbo àìlera láàárín àwọn ènìyàn sàn.
