id: MAT.4.4
reference: Matthew 4:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: yo
  text: Ṣùgbọ́n ó dáhùn pé, “A ti kọ ọ́ sílẹ̀ pé, ‘Ènìyàn[a] kì yóò wà láàyè nípa búrẹ́dì nìkan, bí kò ṣe nípa gbogbo ọ̀rọ̀ tí ń jáde nípasẹ̀ ẹnu Ọlọ́run[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ ọkùnrin, ṣùgbọ́n ó dúró fún ẹ̀dá ènìyàn lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “tí ń ti ẹnu Ọlọ́run jáde.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gangan pé ọ̀rọ̀ náà ń jáde nípasẹ̀ ẹnu Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dáhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe ìdáhùn àti ọ̀rọ̀ tó tẹ̀ lé e, láì tún ‘ó dáhùn, ó sì wí’ sọ lọ́nà tí kò pọndandan.
- source_word: Γέγραπται
  choice: A ti kọ ọ́ pé
  rationale: Ó mú ìtumọ̀ perfect passive náà jáde pé a ti kọ ọ̀rọ̀ náà sílẹ̀, ó sì ṣì dúró gẹ́gẹ́ bí Ìwé Mímọ́.
- source_word: ἄρτῳ
  choice: búrẹ́dì
  rationale: ‘Búrẹ́dì’ ni ìtumọ̀ pàtó àti èdè Yorùbá òde òní fún bread; ‘oúnjẹ’ yóò mú ìtumọ̀ náà gbòòrò ju orísun lọ.
- source_word: μόνῳ
  choice: nìkan
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún ‘alone’ nínú gbólóhùn yìí.
- source_word: ζήσεται
  choice: kì yóò wà láàyè
  rationale: Ó fi ọjọ́ iwájú àti ìtumọ̀ ‘live’ hàn ní Yorùbá àdánidá.
- source_word: ὁ ἄνθρωπος
  choice: Ènìyàn
  rationale: ‘Ènìyàn’ tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, ó sì pa agbára aṣojú ti ọ̀rọ̀ Gíríìkì mọ́ láì fi akọ tàbí abo kún un.
- source_word: παντὶ ῥήματι
  choice: gbogbo ọ̀rọ̀
  rationale: ‘Gbogbo ọ̀rọ̀’ jẹ́ àdánidá, ó sì tọ́ka sí gbogbo ohun tí Ọlọ́run sọ.
- source_word: ἐκπορευομένῳ
  choice: tí ń ... jáde
  rationale: Ó pa àwòrán ọ̀rọ̀ tí ń jáde mọ́, ó sì jẹ́ Yorùbá tó yéni.
- source_word: διὰ στόματος θεοῦ
  choice: tí ń gba ẹnu Ọlọ́run jáde
  rationale: ‘Gba ... jáde’ pa διά pẹ̀lú genitive mọ́ gẹ́gẹ́ bí ‘through,’ ó sì dáàbò bo àwòrán ọ̀rọ̀ Ọlọ́run tí ń jáde nípasẹ̀ ẹnu rẹ̀.
theological_decisions:
- issue: Agbára aṣojú nínú ὁ ἄνθρωπος
  choice: Ènìyàn
  alternative: Ọkùnrin; gbogbo aráyé
  rationale: Ọ̀rọ̀ náà jẹ́ òtítọ́ gbogbogbò nípa ẹ̀dá ènìyàn, kì í ṣe nípa ọkùnrin kan pàtó; ‘Ènìyàn’ jẹ́ pípéye láì túmọ̀ rẹ̀ sí ọ̀nà ẹ̀kọ́ ìsìn kan.
- issue: Àgbékalẹ̀ àyọlò Ìwé Mímọ́ Γέγραπται
  choice: A ti kọ ọ́ pé
  alternative: Ó wà ní kíkọ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún fífi àyọlò Ìwé Mímọ́ bẹ̀rẹ̀, ó sì pa agbára ohun tí a ti kọ sílẹ̀ mọ́.
- issue: διά στόματος θεοῦ
  choice: tí ń gba ẹnu Ọlọ́run jáde
  alternative: tí ń ti ẹnu Ọlọ́run jáde
  rationale: A yan ‘gba’ láti pa ìtumọ̀ ‘through’ ti διά mọ́; àlàyé ìsàlẹ̀ fi ọ̀nà Yorùbá míì tó wọ́pọ̀ hàn láì pa ìyàtọ̀ orísun run.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘búrẹ́dì’ dípò ‘oúnjẹ’ láti yẹra fún fífẹ̀ ìtumọ̀ ἄρτος gbòòrò. Gbogbo àmì ohùn àti àmì ìsàlẹ̀ ni a lò níbi tí ó bá yẹ.
