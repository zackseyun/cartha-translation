review_pass:
  verdict: revise
  source_fidelity: 'The principal sense of the Greek is retained: Jesus answers, introduces a Scripture citation, and contrasts bread alone with every divine utterance. However, “tí ń gba ẹnu Ọlọ́run jáde” is not idiomatic Yoruba for a word issuing through/from a mouth and obscures the participial image.'
  naturalness: The verse is otherwise clear and suitably dignified in Standard Yoruba. “Tí ń jáde nípasẹ̀ ẹnu Ọlọ́run” is grammatical and natural enough while preserving the Greek διά (“through”) rather than silently substituting the more familiar “from.”
  terminology: “Ènìyàn,” “búrẹ́dì,” “wà láàyè,” and “ọ̀rọ̀” are appropriate. “A ti kọ ọ́ sílẹ̀ pé” is a clear Yoruba scriptural-citation formula and conveys the established written form of Γέγραπται.
  issues:
  - severity: medium
    issue: The expression “tí ń gba ẹnu Ọlọ́run jáde” is syntactically and idiomatically defective.
    rationale: In Yoruba, “gba ... jáde” does not naturally express an utterance proceeding through a speaker’s mouth. Recasting it as “tí ń jáde nípasẹ̀ ẹnu Ọlọ́run” preserves the source’s image and its διά wording.
  - severity: low
    issue: Footnote b repeats the same unclear Yoruba expression.
    rationale: Its literal explanation should use a grammatical form, so that the note genuinely clarifies the translation.
