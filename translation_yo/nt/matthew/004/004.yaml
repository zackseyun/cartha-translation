- from: Ṣùgbọ́n ó dáhùn pé, “A ti kọ ọ́ pé, ‘Ènìyàn[a] kì yóò wà láàyè nípa búrẹ́dì nìkan, bí kò ṣe nípa gbogbo ọ̀rọ̀ tí ń gba ẹnu Ọlọ́run jáde[b].’”
  to: Ṣùgbọ́n ó dáhùn pé, “A ti kọ ọ́ sílẹ̀ pé, ‘Ènìyàn[a] kì yóò wà láàyè nípa búrẹ́dì nìkan, bí kò ṣe nípa gbogbo ọ̀rọ̀ tí ń jáde nípasẹ̀ ẹnu Ọlọ́run[b].’”
  rationale: The revision corrects the sole substantive Yoruba idiom problem without altering the source meaning. “Nípasẹ̀ ẹnu Ọlọ́run” retains the Greek’s “through the mouth of God,” while the footnote records the more compact Yoruba alternative that can convey the same mouth-origin image.
