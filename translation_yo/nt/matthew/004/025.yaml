  source_fidelity: Ìtumọ̀ náà pa ìṣe ἠκολούθησαν, àtòjọ àwọn agbègbè, àti ìtumọ̀ àyè πέραν τοῦ Ἰορδάνου mọ́ dáadáa. Ṣùgbọ́n «Àwọn ogunlọ́gọ̀ ènìyàn» kò sọ πολλοὶ (‘púpọ̀’) ní kedere tó; a tún un ṣe láti fi ọ̀pọ̀lọpọ̀ ogunlọ́gọ̀ hàn.
