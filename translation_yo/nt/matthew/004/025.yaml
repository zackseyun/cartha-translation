id: MAT.4.25
reference: Matthew 4:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: yo
  text: Ọ̀pọ̀lọpọ̀ ogunlọ́gọ̀ ènìyàn sì tẹ̀ lé e láti Gálílì, Dekapólì, Jerusalẹmu, Jùdíà, àti òdìkejì Odò Jọ́dánì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìhà kejì Odò Jọ́dánì.”
    reason: Àṣàyàn ìtumọ̀ fún πέραν τοῦ Ἰορδάνου; ó lè tọ́ka sí agbègbè tó wà kọjá tàbí ní ìhà kejì Odò Jọ́dánì.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: tẹ̀ lé e
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún títẹ̀ lé ẹnì kan; ó lè túmọ̀ sí pé wọ́n ń tọ̀ ọ́ lẹ́yìn ní ti ara láì fi dandan sọ pé gbogbo wọn ti di ọmọ-ẹ̀yìn rẹ̀.
- source_word: ὄχλοι πολλοὶ
  choice: àwọn ogunlọ́gọ̀ ènìyàn
  rationale: Ó fi hàn pé ọ̀pọ̀lọpọ̀ ènìyàn ni wọ́n péjọ, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: ἀπὸ
  choice: láti
  rationale: Ó tọ́ka sí ibi tí àwọn ènìyàn náà ti wá, ó sì ń darí gbogbo àtòjọ àwọn agbègbè náà.
- source_word: Γαλιλαίας
  choice: Gálílì
  rationale: Àkọtọ̀ orúkọ agbègbè náà ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: Δεκαπόλεως
  choice: Dekapólì
  rationale: Àyíkọ orúkọ agbègbè àwọn ìlú mẹ́wàá náà; fífi í sílẹ̀ gẹ́gẹ́ bí orúkọ pàtàkì yàgò fún àlàyé tí kò sí nínú ẹsẹ náà.
- source_word: Ἱεροσολύμων
  choice: Jerusalẹmu
  rationale: Orúkọ ìlú náà ní ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: Ἰουδαίας
  choice: Jùdíà
  rationale: Àyíkọ Yorùbá fún orúkọ agbègbè náà.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: òdìkejì Odò Jọ́dánì
  rationale: Ó pa ìtumọ̀ ibi tí ó wà kọjá tàbí ní ìhà kejì Jọ́dánì mọ́, láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: καὶ ... καὶ ... καὶ
  choice: àti ... àti
  rationale: A pa ìsopọ̀ àkójọ àwọn ibi náà mọ́ ní ọ̀nà tí ó bá èdè Yorùbá mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ, a sì pa àtòjọ ibi àti àìdánilójú kékeré inú πέραν τοῦ Ἰορδάνου mọ́.
