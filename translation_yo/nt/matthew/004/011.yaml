source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: yo
  text: Nígbà náà ni Èṣù fi í sílẹ̀; sì wò ó, àwọn áńgẹ́lì wá, wọ́n sì ń ṣe ìránṣẹ́ fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn áńgẹ́lì wá, wọ́n sì ń sìn ín.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “ṣe ìránṣẹ́” tàbí “sìn”; ìrísí imperfect rẹ̀ fi hàn pé ìṣe náà ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó ń tọ́ka sí ohun tó ṣẹlẹ̀ lẹ́yìn ìṣẹ̀lẹ̀ tó ṣáájú, ó sì jẹ́ àsopọ̀ ìtàn tó ṣe déédé ní Yorùbá.
- source_word: ἀφίησιν
  choice: fi í sílẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí nínú Gíríìkì gẹ́gẹ́ bí ìsinsìnyí ìtàn, àkójọpọ̀ yìí sọ ìṣe tó ṣẹlẹ̀; ‘fi í sílẹ̀’ jẹ́ ọ̀nà àdánidá láti sọ pé èṣù kúrò lọ́dọ̀ Jésù.
- source_word: ὁ διάβολος
  choice: èṣù
  rationale: Ní àyíká ìdánwò yìí, ọ̀rọ̀ náà jẹ́ orúkọ ìdánimọ̀ ẹni tí a mọ̀ sí Sátánì; ‘èṣù’ jẹ́ ìtumọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì yé àwọn òǹkàwé.
- source_word: ἰδοὺ
  choice: sì kíyèsí i
  rationale: Ó pa agbára àmì ọ̀rọ̀ tó ń pe òǹkàwé láti fiyè sí ìṣẹ̀lẹ̀ tuntun àti àìròtẹ́lẹ̀ mọ́.
- source_word: ἄγγελοι
  choice: àwọn áńgẹ́lì
  rationale: Àyíká náà ń tọ́ka sí àwọn ẹ̀dá ọ̀run, kì í ṣe àwọn ońṣẹ́ ènìyàn lásán.
- source_word: προσῆλθον
  choice: wá
  rationale: Ó sọ ìsúnmọ́ wọn dé ọ̀dọ̀ Jésù ní ọ̀nà kúkúrú, àdánidá nínú Yorùbá.
- source_word: διηκόνουν
  choice: ń ṣe ìránṣẹ́
  rationale: Àmì ‘ń’ fi hàn pé iṣẹ́ náà ń bá a lọ, ní ìbámu pẹ̀lú àkókò imperfect Gíríìkì; gbólóhùn náà tún lè túmọ̀ sí ‘ń sìn ín.’
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó fi Jésù hàn gẹ́gẹ́ bí ẹni tí iṣẹ́ àwọn áńgẹ́lì náà ń ṣe fún.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ διάβολος nínú ìtàn ìdánwò Jésù
  choice: èṣù
  alternative: ẹni af̀ọ̀rọ̀-èké-ba-ni-lórúkọ jẹ́
  rationale: Níbí, διάβολος jẹ́ orúkọ ìdánimọ̀ Sátánì, kì í ṣe àpèjúwe ìwà rẹ̀ lásán. ‘Èṣù’ mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Ìtumọ̀ διηκόνουν àti bí ìṣe náà ṣe ń bá a lọ
  choice: wọ́n sì ń ṣe ìránṣẹ́ fún un
  alternative: wọ́n sì ń sìn ín
  rationale: Àwọn méjèèjì ṣeé ṣe; àṣàyàn àkọ́kọ́ pa ìtumọ̀ iṣẹ́ ìrànlọ́wọ́ mọ́, àmì ‘ń’ sì fi ìṣe tó ń bá a lọ hàn, láìsọ irú iṣẹ́ náà ní pàtó ju Gíríìkì lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Sì kíyèsí i’ pa ìtẹnumọ́ ἰδοὺ mọ́, nígbà tí ‘ń ṣe ìránṣẹ́’ sọ ìṣe tó ń bá a lọ ní ọ̀nà tó yé òǹkàwé lónìí.
