id: MAT.4.12
reference: Matthew 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: yo
  text: Nígbà tí ó gbọ́ pé a ti fi Jòhánù lé ẹlòmíràn lọ́wọ́[a], ó kúrò níbẹ̀ lọ sí Galili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i nínú àyíká ọ̀rọ̀ yìí, “a ti mú Jòhánù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Nígbà tí ó gbọ́
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist yìí tọ́ka sí àkókò tí ìṣe pàtàkì ṣẹlẹ̀; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbátan àkókò mọ́.
- source_word: δὲ
  choice: kò ṣe àfihàn rẹ̀ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: δέ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ níbí, kì í ṣe ìyàtọ̀ líle; ìṣàn gbólóhùn Yorùbá ti fi iṣẹ́ rẹ̀ hàn láìfi ọ̀rọ̀ bí “ṣùgbọ́n” kún un.
- source_word: Ἰωάννης
  choice: Jòhánù
  rationale: Èyí ni ìrísí orúkọ náà tí ó ti wọ́pọ̀ nínú Yorùbá Bíbélì, pẹ̀lú àmì ohùn.
- source_word: παρεδόθη
  choice: a ti fi ... lé àwọn aláṣẹ lọ́wọ́
  rationale: Ìtumọ̀ yìí pa ààyè ìtumọ̀ παραδίδωμι gẹ́gẹ́ bí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́ mọ́, ó sì mú ẹni tí a fi í lé lọ́wọ́ yé ní àyíká ọ̀rọ̀ láìdín un kù sí mímú nìkan.
- source_word: ἀνεχώρησεν
  choice: ó sá lọ
  rationale: Ní Yorùbá, “sá lọ” lè túmọ̀ sí yíyọ kúrò tàbí lọ sí ibòmíràn nítorí ipò kan; ó mú ìdáhùn sí ìròyìn náà hàn, láìsọ ní pàtó pé ẹ̀rù ló mú un.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: “sí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtọ́sọ́nà εἰς hàn; Galili ni ìrísí orúkọ ibi náà tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ παραδίδωμι nípa Jòhánù
  choice: a ti fi Jòhánù lé àwọn aláṣẹ lọ́wọ́
  alternative: a ti mú Jòhánù
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ọ̀rọ̀ ìmọ̀-ẹ̀sùn fún mímú lọ, ó sì lè ní ìró fífi ẹni kan lé agbára ẹlòmíràn lọ́wọ́. Ọ̀rọ̀ inú àkọ́kọ́ pa ìwọ̀n yẹn mọ́; àlàyé ìsàlẹ̀ fúnni ní ìtumọ̀ tó ṣe pàtó sí àyíká.
translation_notes:
  register: Yorùbá àpapọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A kò fi àsopọ̀ ọ̀tọ̀ túmọ̀ δέ, nítorí ìṣàn ìtàn Yorùbá kò nílò rẹ̀ níbí.
