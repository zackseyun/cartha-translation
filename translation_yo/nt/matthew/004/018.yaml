source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: yo
  text: Bí ó ti ń rìn lẹ́gbẹ̀ẹ́ Òkun Galili, ó rí arákùnrin méjì, Símónì ẹni tí a ń pè ní Pétérù, àti Àńdérù, arákùnrin rẹ̀, wọ́n ń ju àwọ̀n sínú òkun[a], nítorí àwọn apẹja ni wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọ̀n ìpẹja tí a máa ń jù”; ọ̀rọ̀ Gíríìkì náà tọ́ka sí irú àwọ̀n ìpẹja tí a máa ń fi ọwọ́ jù sínú omi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: Bí ó ti ń rìn
  rationale: Ọ̀rọ̀ participle ìsinsìnyí fi hàn pé rírìn náà ń lọ lọ́wọ́ nígbà tí ó rí wọn; gbólóhùn Yorùbá yìí mú ìṣe tó ń bá a lọ jáde lọ́nà àdánidá.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: lẹ́gbẹ̀ẹ́ Òkun Galili
  rationale: παρά pẹ̀lú accusative níbí túmọ̀ sí wíwà tàbí rírìn ní ẹ̀gbẹ́ ohun kan; “Òkun Galili” ni orúkọ ibi náà.
- source_word: εἶδεν
  choice: ó rí
  rationale: Aorist indicative ὁράω jẹ́ ìtàn ìṣẹ̀lẹ̀ tó rọrùn; “ó rí” pa ìtumọ̀ tààrà náà mọ́.
- source_word: δύο ἀδελφούς
  choice: àwọn arákùnrin méjì
  rationale: Àwọn méjèèjì jẹ́ ọkùnrin, wọ́n sì jẹ́ ọmọ ìyá kan gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe mú un dájú.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simoni, ẹni tí a ń pè ní Peteru
  rationale: Ọ̀rọ̀ yìí sọ orúkọ Simoni àti orúkọ míì tí a fi ń pè é; relative clause Yorùbá náà ṣe kedere, kò sì fi ìtumọ̀ míì kún un.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: Anderu arákùnrin rẹ̀
  rationale: Gbólóhùn apposition náà ń fi ìbátan Anderu sí Simoni hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: βάλλοντας
  choice: Wọ́n ń ju
  rationale: Present participle náà ṣàpèjúwe ohun tí wọ́n ń ṣe nígbà tí Jesu rí wọn; “ń ju” fi ìṣe tó ń lọ lọ́wọ́ hàn.
- source_word: ἀμφίβληστρον
  choice: àwọ̀n aṣọ́wọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọ̀n tí apẹja máa ń fi ọwọ́ sọ tàbí jù sí orí omi, kì í ṣe àwọ̀n fífà; yíyan ọ̀rọ̀ pàtó yìí yà á sọ́tọ̀.
- source_word: εἰς τὴν θάλασσαν
  choice: sínú òkun
  rationale: εἰς fi ìṣípò sínú ohun kan hàn; “sínú” mú ìdarí yíyẹn jáde.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: nítorí apẹja ni wọ́n
  rationale: γάρ ń fúnni ní ìdí tàbí àlàyé abẹ́lẹ̀; ìṣètò “apẹja ni wọ́n” jẹ́ Yorùbá àdánidá, ó sì tọ́ka sí iṣẹ́ wọn.
