- from: Bí ó ti ń rìn lẹ́gbẹ̀ẹ́ Òkun Galili, ó rí àwọn arákùnrin méjì, Simoni, ẹni tí a ń pè ní Peteru, àti Anderu arákùnrin rẹ̀. Wọ́n ń ju àwọ̀n aṣọ́wọ́ sínú òkun[a], nítorí apẹja ni wọ́n.
  to: Bí ó ti ń rìn lẹ́gbẹ̀ẹ́ Òkun Galili, ó rí arákùnrin méjì, Símónì ẹni tí a ń pè ní Pétérù, àti Àńdérù, arákùnrin rẹ̀, wọ́n ń ju àwọ̀n sínú òkun[a], nítorí àwọn apẹja ni wọ́n.
  rationale: The revision replaces an unclear net term with the ordinary Yoruba word “àwọ̀n,” preserves the Greek term’s more specific casting sense in the footnote, regularizes the plural occupational expression, and supplies natural tone marks for the personal names. It retains the source’s single narrative sentence and its explanatory force.
