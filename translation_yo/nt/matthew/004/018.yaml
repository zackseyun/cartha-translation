review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the participial setting, the two literal brothers, Simon/Peter and Andrew, the action of throwing a net into the sea, and the explanatory statement that they were fishermen. However, “àwọ̀n aṣọ́wọ́” is not a clear or idiomatic Standard Yoruba designation for the Greek ἀμφίβληστρον and risks obscuring the referent.
  naturalness: The narrative is generally natural. Using “àwọ̀n” in the text is clearer and more idiomatic, while the specific kind of net can remain in the footnote. “Àwọn apẹja ni wọ́n” is also the more natural plural occupational expression here.
  terminology: “Òkun Galili,” “Símónì,” “Pétérù,” and “Àńdérù” are suitable Yoruba forms for the location and names. “àwọ̀n” properly renders the generic textual sense of fishing net; the note preserves the lexical specificity of a thrown/casting net.
  issues:
  - severity: medium
    issue: “àwọ̀n aṣọ́wọ́” for ἀμφίβληστρον
    rationale: This compound is not a sufficiently clear, established, or natural term for a casting net in Standard Yoruba. The Greek denotes a net cast or thrown for fishing, not a garment-like object. “àwọ̀n” is clear in the text, with “àwọ̀n ìpẹja tí a máa ń jù” retained as a footnoted specification.
  - severity: low
    issue: Singular occupational predicate “apẹja ni wọ́n”
    rationale: Though comprehensible, “Àwọn apẹja ni wọ́n” more naturally expresses that both men were fishermen.
  revised_text: Bí ó ti ń rìn lẹ́gbẹ̀ẹ́ Òkun Galili, ó rí arákùnrin méjì, Símónì ẹni tí a ń pè ní Pétérù, àti Àńdérù, arákùnrin rẹ̀, wọ́n ń ju àwọ̀n sínú òkun[a], nítorí àwọn apẹja ni wọ́n.
  revised_footnotes:
  - marker: a
    text: Tàbí, “àwọ̀n ìpẹja tí a máa ń jù”; ọ̀rọ̀ Gíríìkì náà tọ́ka sí irú àwọ̀n ìpẹja tí a máa ń fi ọwọ́ jù sínú omi.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unclear net term with the ordinary Yoruba word “àwọ̀n,” preserves the Greek term’s more specific casting sense in the footnote, regularizes the plural occupational expression, and supplies natural tone marks for the personal names. It retains the source’s single narrative sentence and its explanatory force.
