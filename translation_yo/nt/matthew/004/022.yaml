- from: Wọ́n sì fi ọkọ̀ ojú omi náà àti baba wọn sílẹ̀ lẹ́sẹ̀kẹsẹ̀, wọ́n sì tẹ̀ lé e.[a]
  to: Wọ́n sì fi ọkọ̀ ojú omi náà àti baba wọn sílẹ̀ lẹ́sẹ̀kẹsẹ̀[a], wọ́n tẹ̀ lé e.
  rationale: The translation itself is retained substantively because it faithfully renders the Greek. The redundant second ‘sì’ is removed for smoother narration, and the footnote marker is moved to the word it annotates. The footnote is replaced with a natural Yoruba lexical alternative for ‘lẹ́sẹ̀kẹsẹ̀’.
