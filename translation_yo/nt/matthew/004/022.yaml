id: MAT.4.22
reference: Matthew 4:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: yo
  text: Wọ́n sì fi ọkọ̀ ojú omi náà àti baba wọn sílẹ̀ lẹ́sẹ̀kẹsẹ̀[a], wọ́n tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní kíákíá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó ń tẹ ìtàn náà síwájú láìfi ìtakò líle kún un.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára àti ìdáhùn tí kò ní ìjáfara hàn ní Yorùbá àdánidá.
- source_word: ἀφέντες
  choice: fi ... sílẹ̀
  rationale: Ó pa ìtumọ̀ pé wọ́n kọ́kọ́ fi ọkọ̀ àti baba wọn sílẹ̀ kí wọ́n tó tẹ̀ lé e mọ́, láìsọ pé wọ́n kọ̀ wọ́n sílẹ̀ títí láé.
- source_word: τὸ πλοῖον
  choice: ọkọ̀ ojú omi náà
  rationale: Èyí bá ọkọ̀ ìpẹja inú àyíká ọ̀rọ̀ náà mu, ó sì ṣe kedere ju ‘ọkọ̀’ nìkan lọ.
- source_word: τὸν πατέρα αὐτῶν
  choice: baba wọn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ìbátan tí Gíríìkì sọ ní tààrà.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wọ́n sì tẹ̀ lé e
  rationale: ‘Tẹ̀ lé’ pa ìtumọ̀ ìrìn lẹ́yìn ẹni kan àti ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn mọ́.
- source_word: οἱ
  choice: wọ́n
  rationale: Àpilẹ̀kọ náà dúró gẹ́gẹ́ bí arọ́pò-orúkọ fún àwọn arákùnrin méjì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; ‘wọ́n’ ni Yorùbá àdánidá.
theological_decisions:
- issue: Ìdáhùn ọmọ-ẹ̀yìn àti fífi baba wọn sílẹ̀
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìgbésẹ̀ kíákíá àti pàtàkì láti fi ọkọ̀ àti baba wọn sílẹ̀ kí wọ́n lè tẹ̀ lé Jesu.
  alternative: Kí a sọ pé wọ́n kọ baba wọn sílẹ̀ títí láé, tàbí pé wọ́n kàn yà kúrò lọ́dọ̀ rẹ̀ fún ìgbà díẹ̀.
  rationale: ἀφέντες tẹnu mọ́ fífi sílẹ̀, ṣùgbọ́n kò dá ìbéèrè bí ó ṣe pẹ́ tó lóhùn. Ìtumọ̀ náà kò fi ẹ̀kọ́ tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ọkọ̀ ojú omi’ láti yà πλοῖον sọ́tọ̀ kedere, a sì tún kókó-ọrọ̀ ‘wọ́n’ sọ kí gbólóhùn náà lè ṣàn lọ́nà àdánidá.
