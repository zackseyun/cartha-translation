  source_fidelity: 'The draft accurately represents the sequence and force of the Greek: the men promptly leave the nets and follow Jesus. “Fi àwọn àwọ̀n náà sílẹ̀” suitably renders ἀφέντες τὰ δίκτυα, and “tẹ̀ lé e” preserves both the literal and emerging discipleship sense of ἠκολούθησαν αὐτῷ.'
  naturalness: The two consecutive uses of “sì,” especially after the sentence-initial “Lẹ́sẹ̀kẹsẹ̀,” are slightly less idiomatic than a Yoruba focus construction. Using “Lẹ́sẹ̀kẹsẹ̀ ni …” makes the promptness natural and emphatic, while retaining “sì” for the narrative continuation to following.
  terminology: “Àwọn àwọ̀n náà” is appropriate in context for the fishing nets, and “tẹ̀ lé e” is standard, natural Yoruba for following a person without over-specifying discipleship.
