  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀ ni wọ́n fi àwọn àwọ̀n náà sílẹ̀, wọ́n sì tẹ̀ lé e.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ó ń mú ìtàn tẹ̀ síwájú; “sì” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìsopọ̀ náà mọ́ láìfi ìtakora kún un.
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ náà tẹnumọ́ pé ìdáhùn wọn kò pẹ́; “lẹ́sẹ̀kẹsẹ̀” sọ ìyára náà ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: ἀφέντες
  choice: fi ... sílẹ̀
  rationale: 'Aorist participle náà ṣáájú ìṣe pàtàkì: wọ́n kọ́kọ́ fi àwọ̀n sílẹ̀, lẹ́yìn náà wọ́n tẹ̀ lé e. Ìtumọ̀ yìí jẹ́ àdánidá, kò sì lágbára ju ọ̀rọ̀ orísun lọ bí “kọ̀ sílẹ̀ pátápátá” ṣe lè rí.'
- source_word: τὰ δίκτυα
  choice: àwọn àwọ̀n náà
  rationale: “Àwọ̀n” ni ohun èlò ìpẹja tí àyíká ọ̀rọ̀ ń tọ́ka sí; “náà” ń ṣàfihàn article Gíríìkì láìfi “tiwọn” tàbí “ìpẹja” kún ọ̀rọ̀ orísun.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wọ́n tẹ̀ lé e
  rationale: “Tẹ̀ lé e” lè túmọ̀ sí lílọ lẹ́yìn rẹ̀ ní ti ara àti dídarapọ̀ mọ́ ọn gẹ́gẹ́ bí ọmọ-ẹ̀yìn, nítorí náà ó pa ìwọ̀nú méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn nínú ἠκολούθησαν αὐτῷ
  choice: wọ́n tẹ̀ lé e
  alternative: wọ́n lọ lẹ́yìn rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí títẹ̀ lé ẹni kan ní ti ara àti sí ìbáṣepọ̀ ọmọ-ẹ̀yìn nínú àwọn Ìhìn Rere. “Wọ́n tẹ̀ lé e” pa ìtumọ̀ méjèèjì mọ́ láìsọ ẹ̀kọ́ ìgbàgbọ́ kan jáde ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àtúnṣe gbolohun Yorùbá àdánidá, pẹ̀lú àmì ohùn níbi tí ó yẹ.
