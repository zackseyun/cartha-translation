id: MAT.4.21
reference: Matthew 4:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: yo
  text: Ó sì tẹ̀ síwájú láti ibẹ̀, ó rí arákùnrin méjì mìíràn, Jákọ́bù ọmọ Sébédè àti Jòhánù arákùnrin rẹ̀. Wọ́n wà nínú ọkọ̀ ojú omi pẹ̀lú Sébédè baba wọn, wọ́n sì ń tún àwọ̀n wọn ṣe. Ó sì pè wọ́n.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: tẹ̀ síwájú láti ibẹ̀
  rationale: Ó fi hàn pé Jésù kúrò ní ibi tí ó ti wà, ó sì ń bá ìrìn rẹ̀ lọ; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìlọsíwájú mọ́.
- source_word: εἶδεν
  choice: ó rí
  rationale: Ìtumọ̀ ìtàn lasan ni ọ̀rọ̀ náà níbí; kò yẹ kí a gbé e ga sí ‘ó kíyè sí.’
- source_word: ἄλλους δύο ἀδελφούς
  choice: arákùnrin méjì mìíràn
  rationale: ‘Mìíràn’ fi hàn pé àwọn méjèèjì yìí jẹ́ àfikún sí àwọn arákùnrin méjì tí a mẹ́nu kàn ṣáájú.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jákọ́bù ọmọ Sébédè
  rationale: Ìsopọ̀ oníjẹnítífù Gíríìkì ń sọ ẹni tí baba Jákọ́bù jẹ́; ‘ọmọ Sébédè’ sọ ọ́ ní kedere àti ní Yorùbá àdánidá.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Jòhánù arákùnrin rẹ̀
  rationale: Ó dá Jòhánù mọ̀ gẹ́gẹ́ bí arákùnrin Jákọ́bù láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: ἐν τῷ πλοίῳ
  choice: nínú ọkọ̀ ojú omi
  rationale: Ní àyíká iṣẹ́ apẹja, πλοῖον túmọ̀ sí ọkọ̀ ojú omi, kì í ṣe ọkọ̀ òkun ńlá.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: pẹ̀lú Sébédè baba wọn
  rationale: μετά pẹ̀lú jẹnítífù fi ìbákẹ́gbẹ́ hàn; àtúmọ̀ yìí tún pa bí orísun ṣe dá Sébédè mọ̀ gẹ́gẹ́ bí baba wọn méjèèjì mọ́.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: wọ́n sì ń tún àwọ̀n wọn ṣe
  rationale: Nínú iṣẹ́ apẹja, καταρτίζω túmọ̀ sí mímú àwọ̀n padà sí ipò rere, èyí tí ‘tún ... ṣe’ sọ ní kedere.
- source_word: ἐκάλεσεν αὐτούς
  choice: ó sì pè wọ́n
  rationale: Àtúmọ̀ tààrà yìí pa àkòrí ìpè nínú ìtàn náà mọ́, láìfi ohun tí ẹsẹ yìí kò sọ kún un.
theological_decisions:
- issue: Ìtumọ̀ ìkẹ́yìn ti ἐκάλεσεν nínú àyíká jíjẹ́ ọmọ-ẹ̀yìn
  choice: ó sì pè wọ́n
  alternative: ó sì pè wọ́n láti máa tọ̀ ọ́ lẹ́yìn
  rationale: Àyíká fi hàn pé ìpè sí jíjẹ́ ọmọ-ẹ̀yìn ni, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ pé ó pè wọ́n nìkan. A jẹ́ kí àyíká pèsè ohun tí ìpè náà túmọ̀ sí, dípò fífi ọ̀rọ̀ kún orísun.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A pín gbolohun Gíríìkì gígùn náà sí gbólóhùn mẹ́ta fún ìṣàn Yorùbá àdánidá, láìyí ìtẹ̀lé ìṣẹ̀lẹ̀ tàbí ìtumọ̀ padà. A lo àwọn orúkọ àṣà Yorùbá Jákọ́bù, Sébédè, àti Jòhánù.
