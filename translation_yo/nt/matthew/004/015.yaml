  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé àtòjọ àti ìṣọ̀kan ọ̀rọ̀ Gíríìkì dáadáa: ilẹ̀ méjèèjì, ọ̀nà òkun, ìhà kejì Jordani, àti Galili. ‘Àwọn Kèfèrí’ lè jẹ́ ìtumọ̀ ìbílẹ̀ fún τῶν ἐθνῶν, ṣùgbọ́n nínú Yorùbá òde òní ó sábà máa ń ní ìtumọ̀ ẹlẹ́gàn tàbí ti ẹ̀sìn pàtó (‘aláìgbọ́gbọ́’), èyí tí ó lè fi ìdájọ́ kan kún ọ̀rọ̀ Gíríìkì.'
  naturalness: ‘Ilẹ̀ Sebuluni àti ilẹ̀ Naftali’ àti ‘ọ̀nà òkun’ jẹ́ Yorùbá tó mọ́, tí ó sì pa ohun ewì àyọlò náà mọ́. ‘Ní ìhà kejì Jordani’ jẹ́ ọ̀nà tí ó rọrùn, tí ó sì jẹ́ àìdásí-ojú-ìwòye fún πέραν τοῦ Ἰορδάνου.
  terminology: Fún τῶν ἐθνῶν, ‘àwọn tí kì í ṣe Júù’ ń mú ìyàtọ̀ Júù/àwọn orílẹ̀-èdè tí àyíká Mátíù ń tọ́ka sí hàn ní kedere, láì lo ọ̀rọ̀ ‘Kèfèrí’ tó lè ní ẹ̀rù ìdájọ́. Àlàyé ìsàlẹ̀ ń pa yíyàn ‘àwọn orílẹ̀-èdè’ mọ́ gẹ́gẹ́ bí ìtumọ̀ lexical mìíràn.
  issues:
