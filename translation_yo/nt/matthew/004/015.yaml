    issue: ‘Àwọn Kèfèrí’ fún τῶν ἐθνῶν
    rationale: Bí ó tilẹ̀ jẹ́ pé ó jẹ́ ọ̀rọ̀ ìbílẹ̀ nínú àwọn ìtumọ̀ Bíbélì Yorùbá, nínú lílò òde òní ó lè túmọ̀ sí ‘aláìgbọ́gbọ́’ tàbí ọ̀rọ̀ ẹlẹ́gàn. Gíríìkì nínú gbolohun yìí ń tọ́ka ní pàtàkì sí àwọn tí kì í ṣe Júù/àwọn orílẹ̀-èdè, kì í ṣe ìdájọ́ nípa ìgbàgbọ́ wọn.
  - severity: low
