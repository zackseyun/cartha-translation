id: MAT.4.15
reference: Matthew 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: yo
  text: '“Ilẹ̀ Sebuluni àti ilẹ̀ Naftali,

    ọ̀nà òkun, ní ìhà kejì Jordani,

    Galili àwọn tí kì í ṣe Júù[a]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Galili àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Ilẹ̀ / ilẹ̀
  rationale: Ó tọ́ka sí agbègbè ilẹ̀ ní ọ̀rọ̀ àyọlò yìí, kì í ṣe gbogbo ayé tàbí erùpẹ̀; a tún pa ìṣọ̀kan àtúnṣe Gíríìkì mọ́.
- source_word: Ζαβουλὼν
  choice: Sebuluni
  rationale: Ìkọ̀wé orúkọ yìí tẹ̀ lé bí orúkọ ẹ̀yà àti agbègbè náà ṣe wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Ìkọ̀wé Yorùbá tó ṣe kedere fún orúkọ ẹ̀yà àti agbègbè náà.
- source_word: ὁδὸν θαλάσσης
  choice: ọ̀nà òkun
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ náà mọ́ láì pinnu bóyá ọ̀nà pàtó kan ni tàbí agbègbè tó ní í ṣe pẹ̀lú òkun.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ní òdìkejì Jordani
  rationale: Ó fi èdè àgbègbè Gíríìkì hàn láì fi ojú-ìwòye ibi kan pàtó lé e lórí.
- source_word: Γαλιλαία
  choice: Galili
  rationale: Orúkọ agbègbè náà gẹ́gẹ́ bí ó ṣe wọ́pọ̀ ní Yorùbá.
- source_word: τῶν ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká Júù ti Mátíù àti ìtọ́kasí Aísáyà, ó túmọ̀ sí àwọn tí kì í ṣe Júù; ọ̀rọ̀ yìí jẹ́ kí ìyàtọ̀ ẹ̀yà àti ẹ̀sìn náà ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἐθνῶν nínú àyọlò Aísáyà
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Àyíká Mátíù ń tẹnumọ́ ìbáṣepọ̀ Galili pẹ̀lú àwọn ènìyàn tí kì í ṣe Júù. Síbẹ̀, ‘àwọn orílẹ̀-èdè’ jẹ́ ìtumọ̀ gidi míì, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọ̀wọ̀, àti tó ṣeé lóye ni a lò. Ìlà ewì àti ìṣọ̀kan gbolohun inú àyọlò ni a pa mọ́; àmì ìdádúró gígùn ní òpin fi hàn pé àyọlò náà ń bá a lọ ní ẹsẹ tó tẹ̀ lé.
