revisions:
- from: Ó sì wí fún un pé, “Gbogbo nǹkan wọ̀nyí ni èmi yóò fi fún ọ, bí ìwọ bá wolẹ̀, tí o sì sìn mí[a].”
  to: Ó sì wí fún un pé, “Gbogbo nǹkan wọ̀nyí ni èmi yóò fún ọ, bí o bá wolẹ̀, tí o sì jọ́sìn fún mi[a].”
  rationale: 'The revision retains the source''s conditional offer and its two related actions: falling down and worshiping. It replaces the broader "sìn mí" with "jọ́sìn fún mi" to convey προσκυνέω precisely in this religiously charged context, while preserving alternatives in the footnote. It also removes unwarranted second-person emphasis and simplifies "yóò fi fún" to the direct Yoruba expression "yóò fún."'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the connective, the pronoun-only reference, the comprehensive "all these things," the conditional construction, and the sequence of falling down followed by προσκυνέω. However, "sìn mí" can naturally mean "serve me" in Yoruba, whereas προσκυνήσῃς here specifically denotes worship/homage; the immediate context supports an explicit worship term.
  naturalness: '"Bí ìwọ bá" introduces unnecessary contrastive emphasis not present in the Greek. "Bí o bá wolẹ̀, tí o sì jọ́sìn fún mi" is fluent Standard Yoruba and retains the bodily act and the ensuing worship.'
  terminology: Use "jọ́sìn fún mi" for προσκυνήσῃς μοι in this context. This distinguishes worship from "sìn," which is especially useful in view of Matthew 4:10, where Greek uses a distinct verb for service. "Foríbalẹ̀ fún mi" and "fi ọlá fún mi" remain suitable lexical alternatives in the note.
  issues:
  - severity: medium
    issue: '"sìn mí" is semantically broader than προσκυνήσῃς.'
    rationale: In modern Yoruba it may denote serving someone rather than specifically worshiping or paying homage. The source context warrants the more explicit "jọ́sìn fún mi."
  - severity: low
    issue: The conditional subject "ìwọ" is unnecessarily emphatic.
    rationale: Greek has an unmarked second-person verb. Removing "ìwọ" produces a more natural Yoruba conditional without adding contrast.
  revised_text: Ó sì wí fún un pé, “Gbogbo nǹkan wọ̀nyí ni èmi yóò fún ọ, bí o bá wolẹ̀, tí o sì jọ́sìn fún mi[a].”
  revised_footnotes:
