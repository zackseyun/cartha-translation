id: MAT.4.9
reference: Matthew 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: yo
  text: Ó sì wí fún un pé, “Gbogbo nǹkan wọ̀nyí ni èmi yóò fún ọ, bí o bá wolẹ̀, tí o sì jọ́sìn fún mi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “foríbalẹ̀ fún mi” tàbí “fi ọlá fún mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí foríbalẹ̀ tàbí fífi ọlá fún ẹnìkan, ṣùgbọ́n àyíká ọ̀rọ̀ níbí ń tọ́ka sí ìjọsìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn tí ó bá ìṣàn ọ̀rọ̀ mu, láìfi ìtumọ̀ àkókò kún un.
- source_word: εἶπεν αὐτῷ
  choice: wí fún un
  rationale: Ó pa àwọn arọ́pò-orúkọ inú Gíríìkì mọ́, kò sì fi orúkọ ẹni tí ẹsẹ̀ yìí kò dárúkọ kún un.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Gbogbo nǹkan wọ̀nyí ni èmi yóò fi fún ọ
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ ti Ταῦτά àti agbára àkópọ̀ πάντα mọ́; ìṣètò “ni èmi yóò fi” tún fi ìlérí náà hàn ní Yorùbá àdánidá.
- source_word: ἐὰν
  choice: bí … bá
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ipò àdéhùn hàn.
- source_word: πεσὼν
  choice: wolẹ̀
  rationale: Ó pa àwòrán ìṣe ara, ìyẹn ṣíṣubú tàbí fífi ara balẹ̀, mọ́ láìsọ ọ́ di ìjọsìn fúnra rẹ̀.
- source_word: προσκυνήσῃς μοι
  choice: sìn mí
  rationale: Nínú àyíká ìdánwò yìí àti ìdáhùn ẹsẹ̀ tó tẹ̀ lé e, ọ̀rọ̀ náà ní agbára ìjọsìn; “sìn mí” sọ èyí ní Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω nínú ohun tí Satani béèrè lọ́wọ́ Jésù
  choice: sìn mí
  alternative: foríbalẹ̀ fún mi; fi ọlá fún mi
  rationale: Àyíká ìdánwò àti ọ̀rọ̀ nípa pé Ọlọ́run nìkan ni a gbọdọ̀ máa sìn nínú ẹsẹ̀ tó tẹ̀ lé e ń tọ́ka sí ìjọsìn, kì í ṣe ọlá ìṣèlú lásán. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì náà hàn.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “wí” gẹ́gẹ́ bí ọ̀rọ̀ ìtàn tó ní iyì, “wolẹ̀” fún ìṣe ara, àti “sìn mí” fún agbára ẹ̀sìn inú àyíká náà.
