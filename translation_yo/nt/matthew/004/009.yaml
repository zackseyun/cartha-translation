    text: Tàbí, “foríbalẹ̀ fún mi” tàbí “fi ọlá fún mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí foríbalẹ̀ tàbí fífi ọlá fún ẹnìkan, ṣùgbọ́n àyíká ọ̀rọ̀ níbí ń tọ́ka sí ìjọsìn.
    reason: lexical_alternative
  revision_rationale: 'The revision retains the source''s conditional offer and its two related actions: falling down and worshiping. It replaces the broader "sìn mí" with "jọ́sìn fún mi" to convey προσκυνέω precisely in this religiously charged context, while preserving alternatives in the footnote. It also removes unwarranted second-person emphasis and simplifies "yóò fi fún" to the direct Yoruba expression "yóò fún."'
