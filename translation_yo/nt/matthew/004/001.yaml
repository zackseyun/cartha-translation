id: MAT.4.1
reference: Matthew 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: yo
  text: Nígbà náà ni Ẹ̀mí darí Jésù gòkè lọ sí aginjù, kí Èṣù lè dán an wò[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí Èṣù lè dán Jésù wò” ní ìtumọ̀ fífi í yẹ̀ wò. Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí dídán ẹni wò ní ọ̀nà ìdẹwò tàbí fífi ẹni náà yẹ̀ wò; ṣùgbọ́n nítorí pé Èṣù ni olùṣe níbí, àyíká ọ̀rọ̀ tó tẹ̀ lé ń fi ìtumọ̀ ìdẹwò hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ àkókò tó ń fi ìṣẹ̀lẹ̀ yìí tẹ̀ lé èyí tó ṣáájú; ó bá Yorùbá ìgbàlódé mu.
- source_word: ἀνήχθη
  choice: darí Jésù lọ
  rationale: A yí ọ̀nà àfihàn aláìṣe Gíríìkì padà sí ọ̀nà olùṣe tó jẹ́ àdánidá ní Yorùbá, láìsọ ẹni tó darí rẹ̀ nù. A kò fi “gòkè” kún un nítorí pé kò ṣe pàtàkì sí ìtumọ̀ ní Yorùbá, ó sì lè mú kí òǹkàwé ronú nípa gíga ilẹ̀ ju ìdarí lọ.
- source_word: εἰς τὴν ἔρημον
  choice: lọ sí aginjù
  rationale: “Aginjù” lè tọ́ka sí ilẹ̀ aṣálẹ̀ tàbí ibi ẹhànnà, láìfi irú ilẹ̀ pàtó kan lé ọ̀rọ̀ náà lórí.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: Ẹ̀mí darí
  rationale: Àyíká ìtàn lẹ́yìn ìbatisí Jésù fi hàn pé Ẹ̀mí Ọlọ́run ni; “Ẹ̀mí” pa ọ̀rọ̀ Gíríìkì mọ́ láìfi “Mímọ́” kún un.
- source_word: πειρασθῆναι
  choice: kí ... lè dán an wò
  rationale: “Dán an wò” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìdẹwò ní àyíká yìí, ó sì tún lè ru ìtumọ̀ fífi ẹni kan yẹ̀ wò. Àlàyé ìsàlẹ̀ pa ìtumọ̀ méjèèjì mọ́.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: Èṣù
  rationale: Ní àyíká yìí διάβολος jẹ́ orúkọ oyè ọ̀tá ti ara ẹni; “Èṣù” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún un.
theological_decisions:
- issue: Ta ni τοῦ πνεύματος ń tọ́ka sí?
  choice: Ẹ̀mí Ọlọ́run ni “Ẹ̀mí” ń tọ́ka sí.
  alternative: ẹ̀mí kan tàbí ẹ̀mí Jésù fúnra rẹ̀
  rationale: Ẹ̀mí tó sọ̀kalẹ̀ sórí Jésù nínú ìṣẹ̀lẹ̀ ìbatisí tó ṣáájú ni àyíká ìtàn ń tọ́ka sí.
- issue: Ìtumọ̀ πειρασθῆναι
  choice: kí Èṣù lè dán Jésù wò ní ọ̀nà ìdẹwò
  alternative: láti fi Jésù yẹ̀ wò tàbí dán an mọ́
  rationale: Nítorí Èṣù ni olùṣe àti nítorí ohun tó ṣẹlẹ̀ lẹ́yìn náà, ìdẹwò ni ìtumọ̀ tó lágbára jù níbí; síbẹ̀, a kò pa ìtumọ̀ fífi ẹni yẹ̀ wò rẹ́, a sì ṣàlàyé rẹ̀ ní àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé ìgbàlódé. A lo gbólóhùn olùṣe (“Ẹ̀mí darí”) dípò àfihàn aláìṣe Gíríìkì, nítorí èyí ni ó jẹ́ àdánidá jù ní Yorùbá; a sì pa àṣẹ àwọn olùṣe àti ète ìṣẹ̀lẹ̀ mọ́.
