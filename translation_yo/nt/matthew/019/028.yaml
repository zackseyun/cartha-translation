id: MAT.19.28
reference: Matthew 19:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: yo
  text: 'Jésù sì wí fún wọn pé, “Lóòótọ́ ni mo wí fún yín: Ní ìgbà ìsọ̀tun[a], nígbà tí Ọmọ Ènìyàn bá jókòó lórí ìtẹ́ ògo rẹ̀, ẹ̀yin tí ẹ ti tẹ̀lé mi yóò tún jókòó lórí ìtẹ́ méjìlá, ẹ ó sì ṣe ìdájọ́[b] àwọn ẹ̀yà Ísírẹ́lì méjìlá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àtúndá,” “ayé tuntun,” tàbí “àtúnbí.” Níhìn-ín, ó ṣeé ṣe jù pé ọ̀rọ̀ náà ń tọ́ka sí ìsọ̀tun ọjọ́ iwájú tí ó ní í ṣe pẹ̀lú ìjọba Ọmọ Ènìyàn, kì í ṣe àtúnbí ẹnì kọ̀ọ̀kan.
    reason: lexical_alternative
  - marker: b
    text: “Ṣe ìdájọ́” tún lè ní ìtumọ̀ lílo àṣẹ láti ṣàkóso tàbí láti darí ìjọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó pa agbára ọ̀rọ̀ ìfìdí-múlẹ̀ tí Jésù fi ń bẹ̀rẹ̀ ọ̀rọ̀ pàtàkì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀκολουθήσαντές μοι
  choice: ẹ̀yin tí ẹ ti tọ̀ mí lẹ́yìn
  rationale: Ó dá àwọn tí Jésù ń bá sọ̀rọ̀ mọ̀ gẹ́gẹ́ bí àwọn tí wọ́n ti tẹ̀ lé e, ó sì fi ẹni tí wọ́n tẹ̀ lé hàn kedere.
- source_word: παλιγγενεσίᾳ
  choice: ní ìgbà ìsọ̀tun
  rationale: Ìsọ̀tun lè tọ́ka sí àtúndá tàbí mímú ohun padà di tuntun. Nínú àyíká ẹsẹ̀ yìí, ó bá ìṣẹ̀lẹ̀ ọjọ́ iwájú nígbà ìjọba Ọmọ Ènìyàn mu, láì sọ ọ́ di àtúnbí ẹnì kọ̀ọ̀kan.
- source_word: ὅταν καθίσῃ
  choice: nígbà tí ... bá jókòó
  rationale: Àkópọ̀ ‘nígbà tí ... bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣẹ̀lẹ̀ ọjọ́ iwájú tí Gíríìkì fi ὅταν àti subjunctive hàn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ orúkọ oyè náà tí ó pa ìfarahàn rẹ̀ nínú ìwé Dáníẹ́lì àti ìtumọ̀ Mèsáyà rẹ̀ mọ́.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: lórí ìtẹ́ ògo rẹ̀
  rationale: Ó tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì pa ìforúkọsílẹ̀ gíga ti gbólóhùn náà mọ́.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: ẹ̀yin ... yóò tún jókòó
  rationale: ‘Tún’ mú ìtumọ̀ καί jáde pé àwọn ọmọ-ẹ̀yìn náà pẹ̀lú yóò jókòó, lẹ́yìn tí a ti sọ nípa jíjókòó Ọmọ Ènìyàn.
- source_word: κρίνοντες
  choice: ẹ ó sì máa ṣe ìdájọ́
  rationale: ‘Ṣe ìdájọ́’ ni ìtumọ̀ taara jù lọ; kò fi dandan yan bóyá àṣẹ ìjọba tún wà nínú rẹ̀.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: àwọn ẹ̀yà Ísírẹ́lì méjìlá
  rationale: Ó jẹ́ ìtumọ̀ kedere àti àdánidá fún àwọn ìpín ẹ̀yà méjìlá ti Ísírẹ́lì.
theological_decisions:
- issue: Ìtumọ̀ παλιγγενεσία nínú àyíká yìí
  choice: ìsọ̀tun ọjọ́ iwájú tí ó ní í ṣe pẹ̀lú jíjókòó Ọmọ Ènìyàn lórí ìtẹ́
  alternative: àtúnbí ẹnì kọ̀ọ̀kan; ayé tuntun; ìgbà tuntun
  rationale: Àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa ìtẹ́ Ọmọ Ènìyàn àti ìdájọ́ ọjọ́ iwájú, kì í ṣe nípa ìyípadà ẹnì kọ̀ọ̀kan. A kò sọ ètò ìjọba ọjọ́ iwájú kan pàtó sí i.
- issue: Ìwọ̀n ìtumọ̀ κρίνοντες
  choice: ṣe ìdájọ́
  alternative: ṣàkóso; darí ìjọba
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ àṣẹ ìṣàkóso nínú àyíká kan, ṣùgbọ́n ‘ṣe ìdájọ́’ pa ìtumọ̀ rẹ̀ tí ó hàn gbangba mọ́, ó sì yàgò fún fífi ètò ìṣèlú tàbí ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá ìlò àdánidá mu. ‘Lóòótọ́ ni mo wí fún yín’ àti ‘ìtẹ́ ògo rẹ̀’ pa ìforúkọsílẹ̀ gíga ti ọ̀rọ̀ Jésù mọ́, nígbà tí ìṣètò gbólóhùn náà ṣì ṣe kedere fún òǹkàwé lónìí.
