  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń fi gbogbo àwọn ẹ̀yà pàtàkì nínú Gíríìkì hàn: ìfìdí-múlẹ̀ ‘Ἀμὴν,’ ìsọ̀tun ọjọ́ iwájú, jíjókòó Ọmọ Ènìyàn lórí ìtẹ́ ògo rẹ̀, ìtẹ́ méjìlá, àti ìdájọ́ àwọn ẹ̀yà Ísírẹ́lì méjìlá. Ṣùgbọ́n ‘tọ̀ mí lẹ́yìn’ kì í ṣe ọ̀nà tó dára jù lọ láti túmọ̀ ἀκολουθήσαντές μοι nínú Yorùbá ìgbàlódé; ‘tẹ̀lé mi’ ni ìlò tó ṣe kedere. ‘Ẹ ó sì ṣe ìdájọ́’ tún sún mọ́ κρίνοντες ju ‘ẹ ó sì máa ṣe ìdájọ́,’ tí ó lè fi àṣà ìṣe tí ń ṣẹlẹ̀ léraléra kún un.'
