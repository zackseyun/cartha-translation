  terminology: ‘Ọmọ Ènìyàn,’ ‘ìtẹ́ ògo rẹ̀,’ ‘ìsọ̀tun,’ àti ‘ṣe ìdájọ́’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu. Àwọn àlàyé ìsàlẹ̀ pa àìdájú ìtumọ̀ παλιγγενεσία àti ìfẹ̀hàn ìṣàkóso tí κρίνοντες lè ní mọ́ láì fi ẹ̀kọ́ ìjọsìn kan kún ẹsẹ̀ náà.
