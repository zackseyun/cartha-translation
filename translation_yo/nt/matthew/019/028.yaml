  to: 'Jésù sì wí fún wọn pé, “Lóòótọ́ ni mo wí fún yín: Ní ìgbà ìsọ̀tun[a], nígbà tí Ọmọ Ènìyàn bá jókòó lórí ìtẹ́ ògo rẹ̀, ẹ̀yin tí ẹ ti tẹ̀lé mi yóò tún jókòó lórí ìtẹ́ méjìlá, ẹ ó sì ṣe ìdájọ́[b] àwọn ẹ̀yà Ísírẹ́lì méjìlá.”'
  rationale: A rọ́pò ọ̀rọ̀ ìtẹ̀lé náà pẹ̀lú ‘tẹ̀lé mi,’ èyí tí ó jẹ́ ìtumọ̀ Yorùbá tó péye fún ἀκολουθέω nínú àyíká ọmọ-ẹ̀yìn. A sì yọ ‘máa’ kúrò kí ìtumọ̀ má ba fi ìṣe àṣà tàbí ìṣe alákòókò kún participle Gíríìkì náà. A pa ìṣètò, ìforúkọsílẹ̀, àwọn àmì àlàyé, àti àìdájú tó yẹ nípa ìsọ̀tun àti ìdájọ́ mọ́.
