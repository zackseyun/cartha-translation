  rationale: A ṣàtúnṣe “Èé ṣe” sí “Èéṣe” gẹ́gẹ́ bí ọ̀nà ìkọ̀wé boṣewa, a sì rọ́pò ìṣètò tó le náà pẹ̀lú “Ẹnì kan ni ó dára náà.” Èyí jẹ́ Yorùbá tó dáa sí i, ó sì ṣì pa àrà ìlànà Gíríìkì—ẹnì kan kan ni ẹni rere—mọ́. A pa “náà” mọ́ láti tọ́ka sẹ́yìn sí “ohun tí ó dára,” láìtumọ̀ εἷς sí “níkanṣoṣo” nínú ọ̀rọ̀ àkọ́kọ́. A tún àlàyé [b] ṣe kí ó má bà a mu gẹ́gẹ́ bí àṣàyàn ìtumọ̀ tó yàtọ̀.
