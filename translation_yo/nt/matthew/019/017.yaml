id: MAT.19.17
reference: Matthew 19:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: yo
  text: Ó sì sọ fún un pé[a], “Èéṣe tí o fi ń béèrè lọ́wọ́ mi nípa ohun tí ó dára? Ẹnì kan ni ó dára náà[b]. Ṣùgbọ́n bí o bá fẹ́ wọ inú ìyè, pa àwọn òfin mọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan àti àwọn ìtàn tó jọ èyí kà pé, “Èéṣe tí o fi ń pè mí ní ẹni rere? Kò sí ẹni rere bí kò ṣe ẹnì kan ṣoṣo—Ọlọ́run.” Ṣùgbọ́n ọ̀rọ̀ Mátíù nínú SBLGNT kà pé, “Èéṣe tí o fi ń béèrè lọ́wọ́ mi nípa ohun tí ó dára? Ẹnì kan ni ó dára náà.”
    reason: textual_variant
  - marker: b
    text: Tàbí, ní ọ̀nà ọ̀rọ̀ tó túbọ̀ rọrùn, “Ẹnì kan ṣoṣo ni ó dára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Èé ṣe tí o fi ń béèrè lọ́wọ́ mi nípa ohun tí ó dára?
  rationale: ‘Ohun tí ó dára’ mú ìtumọ̀ àìṣòdodo ti τοῦ ἀγαθοῦ jáde, ó sì yẹra fún yíyí ọ̀rọ̀ Mátíù padà láti bá àwọn ẹsẹ tó jọ ọ́ nínú Máàkù àti Lúùkù mu.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Ẹnì kan ni ẹni tí ó dára náà
  rationale: Ìtumọ̀ yìí pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́ níbi tí εἷς àti ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ, ὁ ἀγαθός, ti fara hàn. Ó tún pa ìsopọ̀ mọ́ ‘ohun tí ó dára’ nínú gbólóhùn tó ṣáájú, bí ó tilẹ̀ jẹ́ pé ọ̀nà ọ̀rọ̀ náà ní àmì pàtàkì díẹ̀.
- source_word: εἰ δὲ θέλεις
  choice: Ṣùgbọ́n bí o bá fẹ́
  rationale: ‘Fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìfẹ́-ọkàn tàbí ète; ‘ṣùgbọ́n’ sì fi ìyípadà kékeré tí δέ ń mú wá hàn.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: wọ inú ìyè
  rationale: Ó pa àwòrán wíwọlé sínú ìyè mọ́ láìfi ‘ìyè àìnípẹ̀kun’ kún un, nítorí pé gbólóhùn Gíríìkì yìí kò sọ bẹ́ẹ̀ ní tààrà.
- source_word: τήρησον τὰς ἐντολάς
  choice: pa àwọn òfin mọ́
  rationale: ‘Pa òfin mọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ṣíṣe ohun tí àṣẹ Ọlọ́run béèrè.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ Jésù pẹ̀lú ìwà rere Ọlọ́run àti ẹni tí Kristi jẹ́
  choice: A tú ọ̀rọ̀ Mátíù gẹ́gẹ́ bí ìbéèrè nípa ‘ohun tí ó dára’ àti ìdáhùn pé ‘Ẹnì kan ni ẹni tí ó dára náà,’ láìfi kún un pé Jésù ń sẹ́ pé òun dára, láì sì ṣe é ní ìbámu tipátipá pẹ̀lú Máàkù tàbí Lúùkù.
  alternative: “Èé ṣe tí o fi ń pè mí ní ẹni rere? Kò sí ẹni rere bí kò ṣe ẹnì kan ṣoṣo—Ọlọ́run.”
  rationale: Ọ̀rọ̀ inú SBLGNT fún Mátíù yàtọ̀ sí bí Máàkù àti Lúùkù ṣe kọ ọ́. Ìtumọ̀ náà gbọ́dọ̀ pa ìyàtọ̀ yìí àti ìfọ̀rọ̀dá-ẹ̀kọ́ rẹ̀ mọ́, láìfi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ ní tààrà wọ inú rẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ, ní ọ̀nà tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn ‘Ẹnì kan ni ẹni tí ó dára náà’ mọ̀ọ́mọ̀ pa àrà ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ fúnni ní ọ̀nà Yorùbá tó rọrùn sí i. A gbé àmì [b] sí lẹ́yìn gbólóhùn tí àlàyé rẹ̀ ń tọ́ka sí.
