id: MAT.19.23
reference: Matthew 19:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: yo
  text: Nígbà náà ni Jésù sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Lóòótọ́ ni mo wí fún yín[a], ó máa ṣòro[b] fún ọkùnrin ọlọ́rọ̀ láti wọ ìjọba ọ̀run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àmín, mo wí fún yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kì yóò rọrùn fún ọkùnrin ọlọ́rọ̀ láti wọ ìjọba ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nígbà náà
  rationale: Ó ń fi ìtẹ̀síwájú tàbí ìyípadà inú ìtàn hàn; ‘Nígbà náà’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀, tí ó sì fìdí múlẹ̀ ní Yorùbá.
- source_word: εἶπεν τοῖς μαθηταῖς αὐτοῦ
  choice: sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Sọ fún’ jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìṣáájú àsọyé; ‘rẹ̀’ pa αὐτοῦ mọ́, ‘àwọn ọmọ-ẹ̀yìn’ sì jẹ́ ìtumọ̀ tó bójú mu fún μαθηταῖς.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Ó pa ìtẹnumọ́ àti ọlá inú ọ̀rọ̀ Jésù mọ́ ní Yorùbá òde òní; àṣàyàn tó sún mọ́ fọ́ọ̀mù Gíríìkì wà nínú àlàyé ìsàlẹ̀.
- source_word: πλούσιος
  choice: ọkùnrin ọlọ́rọ̀
  rationale: Àpèjúwe náà dúró gẹ́gẹ́ bí orúkọ, ó sì jẹ́ akọ ní ẹyọ kan; ‘ọkùnrin ọlọ́rọ̀’ pa ìtumọ̀ àti akọ mọ́ láì mú un gbòòrò sí ‘ẹni ọlọ́rọ̀.’
- source_word: δυσκόλως
  choice: ó máa ṣòro fún … láti
  rationale: Ìṣètò yìí sọ ọ̀nà tàbí ìṣòro ìwọlé náà ní Yorùbá àdánidá, láì sọ pé kò ṣeé ṣe rárá.
- source_word: εἰσελεύσεται
  choice: láti wọ
  rationale: ‘Wọ’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún lílọ sínú ibì kan; àmì ọjọ́ iwájú wà nínú ‘ó máa ṣòro.’
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni ọ̀rọ̀ Mátíù tó fìdí múlẹ̀ ní Yorùbá; ‘ìjọba’ pa èrò ìṣàkóso ọba mọ́, ‘ọ̀run’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀pọ̀ οὐρανῶν Gíríìkì.
theological_decisions:
- issue: Akọ inú πλούσιος tí a lò gẹ́gẹ́ bí orúkọ
  choice: ọkùnrin ọlọ́rọ̀
  alternative: ẹni ọlọ́rọ̀
  rationale: Gíríìkì jẹ́ akọ ní ẹyọ kan, ó sì ń tọ́ka sí ẹni àpẹẹrẹ kan; ìtumọ̀ náà pa akọ tó wà nínú orísun mọ́ láì yí i sí ọ̀rọ̀ aláìlákọ̀-lábò.
- issue: Bí a ṣe túmọ̀ Ἀμὴν nínú ọ̀rọ̀ ìtẹnumọ́ Jésù
  choice: Lóòótọ́
  alternative: Àmín
  rationale: ‘Lóòótọ́’ fi agbára àti ìdánilójú ọ̀rọ̀ náà hàn ní Yorùbá tó ṣe kedere; àlàyé ìsàlẹ̀ pa ‘Àmín’ mọ́ gẹ́gẹ́ bí àṣàyàn tó sún mọ́ fọ́ọ̀mù orísun.
- issue: Ìwọ̀n agbára δυσκόλως
  choice: ó máa ṣòro fún … láti wọ
  alternative: kì yóò rọrùn fún … láti wọ
  rationale: A kò mú adífá náà túmọ̀ sí àìṣeéṣe pátápátá; a pa ìṣòro gidi tí ọ̀rọ̀ náà sọ mọ́, nígbà tí ẹsẹ tó tẹ̀ lé e lè mú ìdíyelé náà jinlẹ̀ sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣeé lóye fún òǹkàwé lasán. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ gbólóhùn tí àṣàyàn kọ̀ọ̀kan kan.
