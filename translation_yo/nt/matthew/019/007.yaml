  source_fidelity: 'Àkọsílẹ̀ pàtàkì náà fara mọ́ Gíríìkì: ‘pàṣẹ’ ń pa ἐνετείλατο mọ́, ‘ìwé ìkọ̀sílẹ̀’ ń tú βιβλίον ἀποστασίου dáadáa, ‘lé e lọ’ sì ń ṣàfihàn ἀπολῦσαι αὐτήν láì ṣáájú túmọ̀ ọ́ ní kíkún sí ‘kọ̀ sílẹ̀.’ Fífi ‘ọkùnrin’ àti ‘aya rẹ̀’ hàn jẹ́ ìmúṣiṣẹ́ àfojúsùn tó bá àyíká ìkọ̀sílẹ̀ àti arọ́pò-orúkọ abo náà mu, láì fi ‘wa’ tí kò sí nínú ọ̀rọ̀ orísun kún un.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, ó sì rọrùn fún kíkà ní gbangba. Àmì ohùn wà ní ibi tí ó yẹ. Àkọsílẹ̀ ìsàlẹ̀ náà, síbẹ̀, nílò kí a tún un ṣe díẹ̀ kí ohun tí a fi sínú àpèjúwe rẹ̀ jẹ́ ọ̀rọ̀ aláfojúsùn pípé (‘lé e lọ’), kí ìbáṣepọ̀ ìtumọ̀ náà sì má ṣe fi ‘ṣùgbọ́n’ hàn bí ẹni pé ìtumọ̀ méjèèjì tako ara wọn.
  terminology: ‘Mósè,’ ‘ìwé ìkọ̀sílẹ̀,’ àti ‘kọ̀ ọ́ sílẹ̀’ jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání nínú Yorùbá Bíbélì òde òní. ‘Lé e lọ’ dá ìtumọ̀ àwòrán ἀπολύω dúró, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ń ṣàlàyé ipa rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ìkọ̀sílẹ̀ nínú àyíká yìí.
  issues:
