source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: yo
  text: Wọ́n sọ fún un pé, “Èé ṣe nígbà náà tí Mósè fi pàṣẹ pé kí ọkùnrin fún aya rẹ̀ ní ìwé ìkọ̀sílẹ̀, kí ó sì lé e lọ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó sì kọ̀ ọ́ sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “lé e lọ,” ó sì ń ṣiṣẹ́ nínú àyíká yìí gẹ́gẹ́ bí ọ̀rọ̀ fún kíkọ aya sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Wọ́n sọ fún un pé
  rationale: A tú present historical náà sí àsìkò àtẹ̀yìnwá gẹ́gẹ́ bí ìtàn Yorùbá ti máa ń ṣàn ní ti ẹ̀dá.
- source_word: Τί οὖν
  choice: Èé ṣe nígbà náà
  rationale: Ó fi agbára ìbéèrè àtakò náà hàn lẹ́yìn ọ̀rọ̀ Jésù, dípò ìtumọ̀ líle pé ‘Kí ni nígbà náà.’
- source_word: Μωϋσῆς
  choice: Mósè
  rationale: Èyí ni orúkọ Bíbélì tó wọ́pọ̀, tó sì ṣe kedere ní Yorùbá.
- source_word: ἐνετείλατο
  choice: fi pàṣẹ
  rationale: 'Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́: àwọn olùbéèrè náà sọ pé Mósè pàṣẹ, kì í ṣe pé ó kàn yọ̀ǹda.'
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: kí ọkùnrin fún aya rẹ̀ ní ìwé ìkọ̀sílẹ̀
  rationale: ‘Ìwé ìkọ̀sílẹ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìwé òfin ìkọ̀sílẹ̀; fífi ‘ọkùnrin’ àti ‘aya rẹ̀’ hàn mú ipa àwọn alábápín ọ̀rọ̀ tí infinitive Gíríìkì fi sílẹ̀ ní àfojúsùn ṣe kedere láì fi ‘wa’ kún un.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: kí ó sì lé e lọ
  rationale: Ó pa àwòrán gidi ti ‘jíṣẹ́ lọ’ mọ́, nígbà tí àyíká àti ‘ìwé ìkọ̀sílẹ̀’ ṣàlàyé pé ìkọ̀sílẹ̀ ni a ń sọ.
theological_decisions:
- issue: Bóyá kí a tú ọ̀rọ̀ àwọn olùbéèrè náà ní ọ̀nà tí yóò ti bá àtúnṣe Jésù ní ẹsẹ tó tẹ̀ lé e mu
  choice: Pa ‘pàṣẹ’ mọ́ nínú ẹsẹ náà
  alternative: ‘yọ̀ǹda’ tàbí ‘gbà láàyè’
  rationale: ἐνετείλατο túmọ̀ sí pé ó pàṣẹ. Ẹsẹ yìí gbọ́dọ̀ pa bí àwọn olùbéèrè ṣe gbé ọ̀rọ̀ náà kalẹ̀ mọ́, láì mú àtúnṣe Jésù ní ẹsẹ tó tẹ̀ lé e wọ inú rẹ̀ ṣáájú àkókò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ti ṣe déédéé. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘aya rẹ̀’ láti jẹ́ kí obìnrin tí αὐτήν ń tọ́ka sí ṣe kedere, láì fi ‘wa’ tí kò sí nínú Gíríìkì kún un.
