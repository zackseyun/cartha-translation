    rationale: Nítorí αὐτήν jẹ́ àfojúsùn tí a sọ gbangba nínú Gíríìkì, ìtumọ̀ Yorùbá tó yẹ kí a tọ́ka sí ni “lé e lọ,” kì í ṣe “lé lọ.”
  - severity: low
    issue: Lílo “ṣùgbọ́n” nínú àkọsílẹ̀ ìsàlẹ̀ lè dà bí ìtumọ̀ ‘lé e lọ’ àti ‘kọ̀ ọ́ sílẹ̀’ jẹ́ ohun tó tako ara wọn.
    rationale: Ìtumọ̀ méjèèjì jẹ́ àṣàyàn ọ̀rọ̀; ìkejì ń ṣàlàyé bí ọ̀rọ̀ náà ṣe ń ṣiṣẹ́ nínú àyíká ìkọ̀sílẹ̀. A lè sọ èyí láì lo asopò ìtakora.
