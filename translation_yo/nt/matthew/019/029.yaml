id: MAT.19.29
reference: Matthew 19:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá ti fi àwọn ilé, tàbí àwọn arákùnrin, tàbí àwọn arábìnrin, tàbí baba, tàbí ìyá, tàbí aya, tàbí àwọn ọmọ, tàbí àwọn oko sílẹ̀ nítorí orúkọ mi, yóò gba ìlọ́po ọgọ́rùn-ún, yóò sì jogún ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Ọ̀rọ̀ yìí jẹ́ ti gbogbo ẹni kọ̀ọ̀kan tí ó bá bá ipò náà mu; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìwọ̀n gbogbo ènìyàn mọ́.
- source_word: ἀφῆκεν
  choice: ti fi ... sílẹ̀
  rationale: Ó sọ nípa ohun tí ẹni náà ti fi sílẹ̀ nítorí jíjẹ́ ọmọ-ẹ̀yìn, láìfi ìtumọ̀ líle bí ‘kọ̀ sílẹ̀ pátápátá’ kún un.
- source_word: οἰκίας
  choice: ilé
  rationale: ‘Ilé’ lè tọ́ka sí ilé gbígbé tàbí ohun-ìní ilé, ó sì bá ‘oko’ mu nínú àkójọ ohun-ìní.
- source_word: ἀδελφοὺς ... ἀδελφὰς
  choice: arákùnrin ... arábìnrin
  rationale: A pa àwọn ọ̀rọ̀ ìbátan méjèèjì mọ́ lọ́tọ̀ gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: γυναῖκα
  choice: aya
  rationale: Nínú àkójọ ìbátan ẹbí yìí, γυνή túmọ̀ sí aya ju ‘obìnrin’ lápapọ̀ lọ.
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn ọmọ ẹni nínú àkójọ ẹbí.
- source_word: ἀγρούς
  choice: oko
  rationale: ‘Oko’ sọ ilẹ̀ àgbẹ̀ tàbí oko ní ọ̀nà tí ó ṣe kedere, láìsọ irú ìní ilẹ̀ náà pàtó ju orísun lọ.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: nítorí orúkọ mi
  rationale: Ó pa àpẹẹrẹ ‘orúkọ mi’ àti ìtumọ̀ ìfaramọ́ sí Jesu mọ́, dípò kí a rọ́pò rẹ̀ pẹ̀lú ‘nítorí mi.’
- source_word: ἑκατονταπλασίονα
  choice: ìlọ́po ọgọ́rùn-ún
  rationale: Ìtumọ̀ yìí pa agbára iye náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí a lè lóye ní kedere.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: yóò jogún ìyè àìnípẹ̀kun
  rationale: ‘Jogún’ pa àwòrán ogún ti κληρονομέω mọ́, ‘ìyè àìnípẹ̀kun’ sì jẹ́ ìtumọ̀ àdánidá ti ζωὴ αἰώνιος.
theological_decisions:
- issue: Ìtumọ̀ γυνή nínú àkójọ ohun tí ọmọ-ẹ̀yìn fi sílẹ̀
  choice: aya
  alternative: obìnrin
  rationale: Àyíká ọ̀rọ̀ jẹ́ àkójọ ìbátan inú ilé; ‘aya’ ni ó bá a mu, láìdámọ̀ràn pé kí a fi àwọn obìnrin lápapọ̀ sílẹ̀.
- issue: Ìtumọ̀ ἕνεκεν τοῦ ὀνόματός μου
  choice: nítorí orúkọ mi
  alternative: nítorí mi
  rationale: Mímú ‘orúkọ mi’ dúró pa àpẹẹrẹ àti ìwúwo ẹ̀kọ́ nípa ẹni, ọlá àṣẹ, àti ìdánimọ̀ Jesu mọ́.
- issue: Ìtumọ̀ ἑκατονταπλασίονα
  choice: ìlọ́po ọgọ́rùn-ún
  alternative: ìlọ́po ọgọ́rùn-ún iye rẹ̀
  rationale: Àṣàyàn náà ṣàfihàn ọgọ́rùn-ún ìlọ́po ní ṣókí, láìṣàlàyé irú tàbí ọ̀nà tí ìsanpadà náà yóò gbà ju ọ̀rọ̀ Gíríìkì lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo àtòjọ pẹ̀lú ‘tàbí’ láti pa ìṣètò orísun mọ́.
