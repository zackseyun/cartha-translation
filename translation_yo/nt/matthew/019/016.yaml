reference: Matthew 19:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: yo
  text: Sì wò ó, ẹnì kan wá sọ́dọ̀ rẹ̀, ó sì wí pé, “Olùkọ́, ohun rere wo ni mo gbọdọ̀ ṣe[a] kí n ní ìyè àìnípẹ̀kun?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Iṣẹ́ rere wo ni mo gbọdọ̀ ṣe ...?” Ọ̀rọ̀ Gíríìkì τί ἀγαθὸν lè túmọ̀ sí “ohun rere”; pẹ̀lú ọ̀rọ̀ náà “ṣe,” ó tún lè tọ́ka sí “iṣẹ́ rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa καί mọ́ gẹ́gẹ́ bí ìsopọ̀ ìtàn, ó sì mú agbára ἰδού tí ń pe olùkà sí àkíyèsí jáde ní Yorùbá àdánidá.
- source_word: εἷς
  choice: ẹnì kan
  rationale: Èyí kò fi kún un pé ọkùnrin ni tàbí pé ó jẹ́ ọlọ́rọ̀; ó pa àìsọ pàtó inú ẹsẹ̀ yìí mọ́.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: tí ó tọ̀ ọ́ wá sọ pé
  rationale: 'Gbólóhùn ìbátan náà pa ìtẹ̀lé participle aorist mọ́: ẹni náà kọ́kọ́ tọ̀ ọ́ wá, lẹ́yìn náà ni ó sọ̀rọ̀.'
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Èyí ni ìtumọ̀ tààrà àti èdè Yorùbá tó wọ́pọ̀ fún akọ́lé olùkọ́ tàbí olùkọ́ni.
- source_word: τί ἀγαθὸν
  choice: ohun rere wo
  rationale: Ó pa ọ̀rọ̀ Gíríìkì tó ṣí sí ‘ohun rere’ mọ́, láì fi dandan túmọ̀ rẹ̀ sí iṣẹ́ rere nìkan.
- source_word: ποιήσω
  choice: ni mo gbọdọ̀ ṣe
  rationale: Ó mú agbára ìbéèrè ìmọ̀ràn deliberative náà jáde ní Yorùbá àdánidá, láì dá ẹ̀kọ́ nípa iṣẹ́ rere sí i.
- source_word: ἵνα σχῶ
  choice: kí n lè ní
  rationale: Ó fi ète tàbí àbájáde ἵνα hàn, ó sì túmọ̀ ἔχω ní ọ̀nà tààrà sí ‘ní.’
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Gbólóhùn yìí jẹ́ èdè Yorùbá tó mọ́, tó sì dá ìtumọ̀ ìyè tí kò ní òpin dúró.
theological_decisions:
- issue: Bóyá kí a sọ ẹni tó ń sọ̀rọ̀ náà di ọkùnrin tàbí ọ̀dọ́mọkùnrin ọlọ́rọ̀
  choice: ẹnì kan
  alternative: ọkùnrin kan; ọ̀dọ́mọkùnrin ọlọ́rọ̀ kan
  rationale: εἷς nìkan ni ẹsẹ̀ yìí sọ. A kò kó àlàyé láti àwọn ẹsẹ̀ tó tẹ̀ lé e tàbí láti ìtàn tó jọ ọ́ wọ inú ẹsẹ̀ yìí.
- issue: Agbára ìbéèrè nípa ṣíṣe ohun rere àti níní ìyè àìnípẹ̀kun
  choice: ohun rere wo ni mo gbọdọ̀ ṣe kí n lè ní ìyè àìnípẹ̀kun?
  alternative: iṣẹ́ rere wo ni kí n ṣe láti jèrè ìyè àìnípẹ̀kun?
  rationale: Èyí pa ìbéèrè ẹni náà tó dojú kọ ìṣe mọ́, láì yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ nípa iṣẹ́, ẹ̀tọ́, tàbí ìgbàlà fún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣì ṣe kedere fún olùkà òde òní; ‘Sì kíyèsí i’ ní ìrísí Bíbélì díẹ̀ láti pa agbára ìtàn ἰδού mọ́.
