  source_fidelity: 'Ìtumọ̀ náà ń mú ìtumọ̀ Gíríìkì náà dáadáa: ìdáhùn náà, ìbéèrè òdì náà, ìtọ́kasí sí ìbẹ̀rẹ̀ ìṣẹ̀dá, àti ‘akọ àti abo’ gbogbo wọn wà. Ṣùgbọ́n ‘láti ìbẹ̀rẹ̀’ yẹ kí ó sún mọ́ iṣẹ́ ‘dá,’ gẹ́gẹ́ bí ó ti ń ṣàlàyé ὁ κτίσας nínú Gíríìkì, kì í ṣe pé ó ń ṣàlàyé ‘ṣe wọn.’'
  naturalness: ‘Ó dá wọn lóhùn pé’ àti ‘Ṣé ẹ̀yin kò kà á pé’ jẹ́ Yorùbá boṣewa, àdánidá, tó sì yẹ fún ìforígbárí Jésù. ‘Ẹni tí ó dá wọn láti ìbẹ̀rẹ̀ ṣe wọn ní akọ àti abo’ pa ìyàtọ̀ ‘dá/ṣe’ mọ́, bí ó tilẹ̀ jẹ́ pé ìtẹ̀lé ọ̀rọ̀ náà jẹ́ ti ọ̀nà ìtúmọ̀ tó sún mọ́ orísun.
