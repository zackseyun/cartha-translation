source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: yo
  text: Ó dá wọn lóhùn pé, “Ṣé ẹ̀yin kò kà á[a] pé ẹni tí ó dá wọn[b] láti ìbẹ̀rẹ̀ ṣe wọn ní akọ àti abo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin kò ha kà á pé…?”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ẹni tí ó dá”; a tún lè túmọ̀ rẹ̀ sí “Ẹlẹ́dàá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ó dá wọn lóhùn pé
  rationale: Èdè Yorùbá àdánidá ń fi gbólóhùn yìí hàn ní ṣókí bí ‘ó dá wọn lóhùn pé’; kò pọndandan láti tún ‘ó sì wí’ kún un.
- source_word: Οὐκ ἀνέγνωτε
  choice: Ṣé ẹ̀yin kò kà á
  rationale: Ìbéèrè òdì yìí ń pe àwọn olùgbọ́ níjà lórí ohun tí wọ́n ti kà nínú Ìwé Mímọ́. ‘Ṣé ẹ̀yin kò kà á’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìbéèrè náà mọ́.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ ń ṣàgbékalẹ̀ àkóónú ohun tí ó yẹ kí wọ́n ti kà.
- source_word: ὁ κτίσας
  choice: ẹni tí ó dá wọn
  rationale: Èyí tẹ̀lé àpólà alápartísípù Gíríìkì ní kedere, láì sọ ọ́ di orúkọ oyè ‘Ẹlẹ́dàá.’
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Èyí pa ìró èdè ìṣẹ̀dá inú Jẹ́nẹ́sísì mọ́, ó sì jẹ́ ìtumọ̀ tààrà ti àpólà náà.
- source_word: ἄρσεν καὶ θῆλυ
  choice: akọ àti abo
  rationale: Àwọn ọ̀rọ̀ yìí pa méjì ìṣẹ̀dá tí Gíríìkì àti Jẹ́nẹ́sísì sọ mọ́, láì yí wọn sí ‘ọkùnrin àti obìnrin.’
- source_word: ἐποίησεν αὐτούς
  choice: ṣe wọn
  rationale: Lílo ‘ṣe’ yà ἐποίησεν sọ́tọ̀ kúrò lọ́dọ̀ κτίσας, tí a túmọ̀ sí ‘dá,’ ó sì yẹra fún àsọtúnsọ tí kò pọndandan.
theological_decisions:
- issue: Ọ̀rọ̀ ìṣẹ̀dá náà gẹ́gẹ́ bí ìtọ́kasí sí Jẹ́nẹ́sísì 1:27
  choice: Pa ‘akọ àti abo’ mọ́ nínú ẹsẹ̀ pàtàkì láì ṣe àlàyé àfikún.
  alternative: ‘ṣe wọn ní ọkùnrin àti obìnrin’ tàbí ‘ṣe wọn gẹ́gẹ́ bí akọ àti abo’
  rationale: Jésù ń tọ́ka tààrà sí ìtàn ìṣẹ̀dá. ‘Akọ àti abo’ sún mọ́ Gíríìkì àti ìtọ́kasí Jẹ́nẹ́sísì jù, ó sì kò fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ míì tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ṣé’ fún ìbéèrè òdì àdánidá, a sì fi ọ̀nà ‘ẹ̀yin kò ha…’ sínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn tó ní ìforígbárí díẹ̀ sí i. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá.
