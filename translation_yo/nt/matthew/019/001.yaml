id: MAT.19.1
reference: Matthew 19:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé nígbà tí Jésù parí àwọn ọ̀rọ̀ wọ̀nyí, ó kúrò ní Gálílì, ó sì dé agbègbè Jùdíà ní òdìkejì odò Jọ́dánì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kọjá odò Jọ́dánì.”
    reason: πέραν tún lè jẹ́ ‘kọjá’ tàbí ‘ní ìkọjá’ odò; àfikún yìí pa ọ̀nà ìtumọ̀ míì tó ṣeé ṣe mọ́.
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìyípadà ìtàn Gíríìkì hàn, láì lo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò mọ́gbọ́n dání.
- source_word: ὅτε ἐτέλεσεν
  choice: nígbà tí ... parí
  rationale: Ó fi hàn pé Jésù kọ́kọ́ parí àsọyé náà kí ìgbésẹ̀ tó tẹ̀ lé e tó wáyé.
- source_word: τοὺς λόγους τούτους
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: Ó tọ́ka sí àsọyé tí Jésù ṣẹ̀ṣẹ̀ parí, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: ó kúrò ní Gálílì
  rationale: Èyí sọ ìkúrò ní ibi kan ní èdè Yorùbá àdánidá, nígbà tó tún pa ìtumọ̀ ìrìn-àjò náà mọ́.
- source_word: ἦλθεν εἰς
  choice: ó sì dé
  rationale: ‘Ó dé’ fi ìrìn dé ibi tuntun hàn lọ́nà tó bójú mu nínú ìtàn Yorùbá.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: agbègbè Jùdíà
  rationale: ὅρια lè túmọ̀ sí ààlà tàbí agbègbè; níbí, ‘agbègbè’ bá ọ̀rọ̀ ìrìn-àjò mu ju fífi ààlà pàtó kan hàn lọ.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ní òdìkejì odò Jọ́dánì
  rationale: Èyí fi ipò ní apá kejì odò hàn kedere, ó sì pa ìtumọ̀ πέραν mọ́ láì pinnu ju ohun tí Gíríìkì sọ lọ.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tó bá yẹ, a sì fi orúkọ ilẹ̀ àti odò sílẹ̀ ní fọ́ọ̀mù Yorùbá tó wọ́pọ̀.
