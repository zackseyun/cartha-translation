  source_fidelity: The translation accurately represents the narrative transition, the completion of Jesus’ preceding words, his departure from Galilee, and his arrival in the Judean region on the far side of the Jordan. “Ní òdìkejì odò Jọ́dánì” appropriately conveys πέραν τοῦ Ἰορδάνου without over-specifying the route.
  naturalness: The Yoruba is clear, modern, and suitably dignified for biblical narrative. Tone marks are consistently and naturally supplied. “Ó sì ṣẹlẹ̀ pé” is a viable narrative transition, and the sequence of clauses reads smoothly.
  terminology: Jésù, Gálílì, Jùdíà, and odò Jọ́dánì are consistently rendered. “Àwọn ọ̀rọ̀ wọ̀nyí” and “agbègbè Jùdíà” are faithful and idiomatic contextual equivalents. The footnote preserves a legitimate alternative sense for πέραν.
