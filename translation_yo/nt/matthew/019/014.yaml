id: MAT.19.14
reference: Matthew 19:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù wí pé, “Ẹ jẹ́ kí àwọn ọmọ náà wá sọ́dọ̀ mi, ẹ má sì ṣe dí wọn lọ́wọ́ láti wá sọ́dọ̀ mi, nítorí ìjọba ọ̀run jẹ́ ti irú àwọn wọ̀nyí.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀ gangan ní Gíríìkì: “nítorí irú àwọn wọ̀nyí ni ìjọba ọ̀run.” “Irú àwọn wọ̀nyí” lè tọ́ka sí àwọn ọmọ tó wà níbẹ̀ àti sí àwọn ènìyàn tí wọ́n jẹ́ irú wọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Ẹ jẹ́ kí
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí fífúnni láàyè ní àyíká ọ̀rọ̀ yìí; “Ẹ jẹ́ kí” jẹ́ èdè Yorùbá àdánidá tó sì pa agbára àṣẹ náà mọ́.
- source_word: τὰ παιδία
  choice: àwọn ọmọ náà
  rationale: “Àwọn ọmọ” bo ìtumọ̀ παιδία láìfi kún un pé ọmọ kékeré gan-an ni; “náà” tọ́ka sí àwọn ọmọ tí a mẹ́nu kàn ní àyíká ọ̀rọ̀.
- source_word: μὴ κωλύετε
  choice: ẹ má sì ṣe dá wọn dúró
  rationale: κωλύω ní ìtumọ̀ dídènà tàbí ṣíṣe ìdíwọ́; gbólóhùn yìí jẹ́ èdè Yorùbá tó wọ́pọ̀, kò sì pinnu bóyá ìdènà náà ti ń ṣẹlẹ̀ tẹ́lẹ̀.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: àwọn ọmọ náà wá sọ́dọ̀ mi ... dá wọn dúró
  rationale: 'A ṣètò gbólóhùn náà gẹ́gẹ́ bí Yorùbá àdánidá: àṣẹ pé kí wọn wá sọ́dọ̀ Jésù, lẹ́yìn náà kí a má dá wọn dúró.'
- source_word: τῶν γὰρ τοιούτων
  choice: nítorí ... jẹ́ ti irú àwọn wọ̀nyí
  rationale: '“Irú àwọn wọ̀nyí” pa agbára aṣojú τοιούτων mọ́: ó tọ́ka sí àwọn ọmọ tó wà níbẹ̀, ó sì tún lè kan àwọn ènìyàn irú wọn láìṣàlàyé irú ànímọ́ náà.'
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀nà tí Mátíù sábà máa ń lò gbólóhùn náà mu.
- source_word: ἐστὶν
  choice: jẹ́ ti
  rationale: Pẹ̀lú genitive τῶν ... τοιούτων, “jẹ́ ti” sọ ìbáṣepọ̀ ohun-ìní tàbí ẹni tí ìjọba náà yẹ fún jáde ní Yorùbá àdánidá, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Bóyá Jésù ń tọ́ka sí àwọn ọmọ gangan nìkan tàbí sí àwọn ènìyàn tí wọ́n jẹ́ irú wọn pẹ̀lú
  choice: “irú àwọn wọ̀nyí”
  alternative: “àwọn ọmọ wọ̀nyí” tàbí “àwọn tó dà bí ọmọ”
  rationale: '“Irú àwọn wọ̀nyí” pa àìdánilójú inú Gíríìkì mọ́: ó bẹ̀rẹ̀ pẹ̀lú àwọn ọmọ tó wà níbẹ̀, ṣùgbọ́n kò dí ìtumọ̀ mọ́ wọn nìkan, bẹ́ẹ̀ ni kò sọ ní pàtó ohun tó mú kí ẹlòmíràn dà bí wọn.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; ọ̀rọ̀ náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “sọ́dọ̀ mi” dípò ìtumọ̀ líle ti πρός με, àti “dá wọn dúró” fún κωλύω.
