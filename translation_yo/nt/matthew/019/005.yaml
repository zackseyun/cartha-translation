id: MAT.19.5
reference: Matthew 19:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: yo
  text: ó sì wí pé, “Nítorí èyí, ọkùnrin yóò fi baba àti ìyá rẹ̀ sílẹ̀, yóò sì darapọ̀ mọ́ aya rẹ̀[a], àwọn méjèèjì yóò sì di ara kan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “yóò sì so pọ̀ mọ́ aya rẹ̀” tàbí “yóò sì rọ̀ mọ́ aya rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí ìsopọ̀ tímọ́tímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Nítorí èyí
  rationale: Ó jẹ́ gbólóhùn ìdí tó ṣe kedere, ó sì pa agbára ìtumọ̀ ‘fún ìdí yìí’ mọ́ ní Yorùbá àdánidá.
- source_word: καταλείψει
  choice: yóò fi ... sílẹ̀
  rationale: Ó ṣàfihàn ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ní Yorùbá òde òní, láìsọ ọ́ di ọ̀rọ̀ àtijọ́.
- source_word: ἄνθρωπος
  choice: ọkùnrin
  rationale: Nínú àyọlò ìgbéyàwó yìí, ọ̀rọ̀ náà tọ́ka sí ẹni akọ ní ìbámu pẹ̀lú ‘aya rẹ̀,’ kì í ṣe sí ènìyàn lápapọ̀.
- source_word: κολληθήσεται
  choice: yóò sì darapọ̀ mọ́
  rationale: Ó sọ ìsopọ̀ tímọ́tímọ́ di Yorùbá tó ṣe kedere, láìfi ìmọ̀lára ‘rọ̀ mọ́’ kún ohun tí ọ̀rọ̀ Gíríìkì ní láti túmọ̀ sí.
- source_word: γυναικὶ αὐτοῦ
  choice: aya rẹ̀
  rationale: Àyíká ìgbéyàwó mú kí ‘aya’ jẹ́ ìtumọ̀ tó yẹ dípò ‘obìnrin.’
- source_word: οἱ δύο
  choice: àwọn méjèèjì
  rationale: Ó pa ìtọ́kasí kedere sí àwọn méjì náà mọ́, kò sì há a sínú gbólóhùn míì.
- source_word: εἰς σάρκα μίαν
  choice: di ara kan
  rationale: ‘Di’ ṣàfihàn àbájáde tàbí ìwọlé sínú ìṣọ̀kan tuntun, ‘ara kan’ sì pa àwòrán pàtàkì inú Gẹnẹsisi mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ akọ nínú àyọlò nípa ìgbéyàwó
  choice: ọkùnrin ... aya rẹ̀
  alternative: ènìyàn ... ọkọ tàbí aya rẹ̀
  rationale: Àyọlò Gẹnẹsisi náà sọ ní pàtó nípa ọkùnrin àti aya rẹ̀; fífi akọ náà hàn pa ìtumọ̀ orísun mọ́ láìyí i sí ọ̀rọ̀ gbogbogbò nípa gbogbo ènìyàn.
- issue: Ọ̀nà láti túmọ̀ àpèjúwe ìṣọ̀kan ìgbéyàwó
  choice: àwọn méjèèjì yóò sì di ara kan
  alternative: àwọn méjèèjì yóò sì jẹ́ ara kan
  rationale: ‘Di’ bá ἔσονται εἰς mu gẹ́gẹ́ bí ìyípadà sí ipò ìṣọ̀kan tuntun, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ àti ìbáṣepọ̀ inú àyọlò náà mọ́ láìṣàlàyé rẹ̀ ju bó ti wà lọ.
- issue: Ẹni tí ó sọ ọ̀rọ̀ àyọlò náà
  choice: ó sì wí pé
  alternative: Ọlọ́run sì wí pé
  rationale: Gíríìkì kò tún dárúkọ olùsọ̀rọ̀ ní ẹsẹ yìí. Lílò ‘ó’ pa ìgbẹ́kẹ̀lé gírámà rẹ̀ mọ́, kò sì yanju ìṣòro ẹni tí ọ̀rọ̀ inú Gẹnẹsisi jẹ́ ní ọ̀nà tí orísun kò fi ṣe.
translation_notes:
  register: Yorùbá àpapọ̀, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún. A fi àmì ìbéèrè sí òpin nítorí semicolon Gíríìkì (;) jẹ́ àmì ìbéèrè, ẹsẹ yìí sì ń parí ìbéèrè tí ó bẹ̀rẹ̀ ní ẹsẹ 4. A kò tún fi ‘ó’ síwájú ẹsẹ náà ní lẹ́tà ńlá nítorí καὶ εἶπεν ń bá gbólóhùn ẹsẹ tó ṣáájú lọ.
