id: MAT.19.3
reference: Matthew 19:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: yo
  text: Àwọn Farisí sì wá sọ́dọ̀ rẹ̀ láti dán an wò, wọ́n sì bi í pé, “Ǹjẹ́ ó bófin mu fún ọkùnrin láti kọ aya rẹ̀ sílẹ̀ fún ìdí èyíkéyìí?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “lórí ìpìlẹ̀ èyíkéyìí” tàbí “fún gbogbo ìdí.” Gbólóhùn Gíríìkì náà jẹ́ ìbéèrè òfin tí ó gbòòrò nípa àwọn ìdí tí a lè fi kọ aya sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: tọ̀ ọ́ wá
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé wọ́n sún mọ́ ọn tàbí wọ́n wá bá a; ‘tọ̀ ọ́ wá’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtọ́sọ́nà ìṣe náà mọ́.
- source_word: πειράζοντες
  choice: láti dán an wò
  rationale: πειράζω lè túmọ̀ sí dídán ẹnìkan wò, dídẹ ẹ́ wò, tàbí fífi í sínú ìdẹwò. ‘Láti dán an wò’ pa ìtumọ̀ ọ̀rọ̀ náà àti ète ọ̀tá inú àyíká ìtàn mọ́ láìfi àlàyé tí ó ju ti orísun lọ kún un.
- source_word: ἔξεστιν
  choice: ó bófin mu
  rationale: Ìbéèrè náà dá lórí ohun tí òfin gbà láàyè. ‘Ó bófin mu’ jẹ́ Yorùbá òde òní tí ó ṣe kedere fún àríyànjiyàn nípa òfin.
- source_word: ἀνθρώπῳ
  choice: fún ọkùnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄνθρωπος lè ní ìtumọ̀ gbogbogbò, ọ̀rọ̀ ‘aya rẹ̀’ fi hàn pé ọkọ ọkùnrin ni a ń tọ́ka sí níbí.
- source_word: ἀπολῦσαι
  choice: láti kọ aya rẹ̀ sílẹ̀
  rationale: Nínú àyíká ìgbéyàwó, ἀπολύω tọ́ka sí yíyà ìgbéyàwó ká, kì í ṣe rírán ẹnìkan lọ lásán. ‘Kọ aya rẹ̀ sílẹ̀’ ni ọ̀nà Yorùbá àdánidá fún ìkọ̀sílẹ̀.
- source_word: γυναῖκα αὐτοῦ
  choice: aya rẹ̀
  rationale: γυνή lè túmọ̀ sí obìnrin tàbí aya, ṣùgbọ́n ọ̀rọ̀ arọ́pò oníhun àti àyíká ìkọ̀sílẹ̀ béèrè fún ‘aya rẹ̀.’
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: fún ìdí èyíkéyìí
  rationale: Gbólóhùn náà béèrè bóyá ìdí yówù tí ọkùnrin bá fún lè jẹ́ ìpìlẹ̀ ìkọ̀sílẹ̀. Ìtumọ̀ yìí pa fífẹ̀ ìbéèrè òfin náà mọ́.
theological_decisions:
- issue: Bí a ṣe máa ṣàfihàn ìbéèrè òfin nípa ìkọ̀sílẹ̀ láìfi ìpinnu ẹ̀kọ́ ìsìn kan kún un
  choice: Ǹjẹ́ ó bófin mu fún ọkùnrin láti kọ aya rẹ̀ sílẹ̀ fún ìdí èyíkéyìí?
  alternative: Ǹjẹ́ a gba ọkùnrin láàyè láti kọ aya rẹ̀ sílẹ̀ lórí ìpìlẹ̀ èyíkéyìí?
  rationale: Ẹsẹ̀ náà gbé ìbéèrè àríyànjiyàn òfin kalẹ̀; kò tíì fúnni ní ìdáhùn. Ìtumọ̀ yìí pa fífẹ̀ ìbéèrè náà àti ìforígbárí ẹ̀kọ́ inú rẹ̀ mọ́ láìṣe ìdájọ́ fún èrò ẹ̀sìn kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Kọ aya rẹ̀ sílẹ̀’ jẹ́ gbólóhùn àdánidá fún ìkọ̀sílẹ̀, nígbà tí ‘ó bófin mu’ pa ìró àríyànjiyàn òfin mọ́.
