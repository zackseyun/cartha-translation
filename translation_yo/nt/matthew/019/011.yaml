id: MAT.19.11
reference: Matthew 19:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Kì í ṣe gbogbo ènìyàn ló lè gba ọ̀rọ̀ yìí[a], bí kò ṣe àwọn tí a ti fi ọ̀rọ̀ yìí fún[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àsọyé yìí” tàbí “ẹ̀kọ́ yìí.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ọ̀rọ̀ passive náà túmọ̀ sí pé Ọlọ́run ni olùfúnni, ṣùgbọ́n Gíríìkì kò dárúkọ olùṣe náà ní tààràtà.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: ó sọ fún wọn pé
  rationale: Ọ̀nà àdánidá ní Yorùbá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹnì kan sọ fún àwọn mìíràn; ó bá aorist λέγω mu láì fi ìtumọ̀ ‘dáhùn’ kún un.
- source_word: Οὐ πάντες
  choice: Kì í ṣe gbogbo ènìyàn
  rationale: Ó sọ ìkọ̀ gbogbo ènìyàn ní Yorùbá òde òní lọ́nà tí ó ṣe kedere, láì túmọ̀ sí pé kò sí ẹnikẹ́ni rárá.
- source_word: χωροῦσι
  choice: ló lè gba
  rationale: Ní ìsopọ̀ pẹ̀lú λόγον, χωρέω túmọ̀ sí níní ààyè fún ọ̀rọ̀ kan tàbí gbígbà á. ‘Lè gba’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ agbára láti tẹ́wọ́ gba mọ́.
- source_word: τὸν λόγον τοῦτον
  choice: ọ̀rọ̀ yìí
  rationale: ‘Ọ̀rọ̀ yìí’ tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì pa ààyè àwọn ìtumọ̀ bí ‘àsọyé yìí’ tàbí ‘ẹ̀kọ́ yìí’ mọ́.
- source_word: ἀλλ’ οἷς
  choice: bí kò ṣe àwọn tí
  rationale: Ọ̀rọ̀ yìí fi ààlà sí ẹgbẹ́ àwọn tí ó lè gba ọ̀rọ̀ náà; ‘bí kò ṣe’ jẹ́ ìyàtọ̀ onídíwọ̀n tí ó bá ἀλλά mu.
- source_word: δέδοται
  choice: a ti fi fún
  rationale: 'Ìkọ́lé aláìdárúkọ olùṣe yìí pa perfect passive mọ́: a ti fi ohun náà fún wọn, ipa ìfúnni náà sì ṣì wà, ṣùgbọ́n a kò dárúkọ ẹni tí ó fún wọn.'
theological_decisions:
- issue: Ta ni olùfúnni tí passive δέδοται ń tọ́ka sí?
  choice: A pa olùfúnni mọ́ láìdárúkọ nípasẹ̀ ‘a ti fi fún.’
  alternative: ‘àwọn tí Ọlọ́run ti fi fún’
  rationale: Ó ṣeé ṣe kí passive náà tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùfúnni, ṣùgbọ́n Gíríìkì kò dárúkọ rẹ̀. Ìtumọ̀ àkọ́kọ́ kò gbọ́dọ̀ mú ohun tí a fi sílẹ̀ ní àìsọ di mímọ́ láìsí àní-àní.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. ‘Ló’ jẹ́ ìdájọ́pọ̀ àdánidá ti ‘ni ó.’
