  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀pọ̀ àwọn tí wọ́n jẹ́ àkọ́kọ́ yóò jẹ́ ìkẹyìn, àwọn tí wọ́n jẹ́ ìkẹyìn yóò sì jẹ́ àkọ́kọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó sún mọ́ Gíríìkì jù: “Ṣùgbọ́n ọ̀pọ̀ ẹni àkọ́kọ́ yóò jẹ́ ẹni ìkẹyìn, ẹni ìkẹyìn sì [yóò jẹ́] ẹni àkọ́kọ́.” Gíríìkì náà kúrú gan-an, ó sì ní ìrísí òwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀ àwọn
  rationale: Ọ̀rọ̀ ajẹ́tífù náà dúró gẹ́gẹ́ bí orúkọ fún ẹgbẹ́ ènìyàn tí a kò dá mọ̀ ní pàtó; “ọ̀pọ̀ àwọn” jẹ́ ọ̀nà àdánidá láti fi hàn pé ọ̀pọ̀ ènìyàn ni.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn sí ọ̀rọ̀ tó ṣáájú nípa èrè àti ipò.
- source_word: ἔσονται
  choice: ni yóò jẹ́
  rationale: Ó ṣàfihàn ọ̀rọ̀ ọjọ́ iwájú lọ́nà Yorùbá tó ṣe kedere, tí kò sì jẹ́ àtijọ́.
- source_word: πρῶτοι
  choice: ẹni àkọ́kọ́
  rationale: Ó pa èrò ipò tàbí ipò-ọlá mọ́ láì sọ pé ó jẹ́ ti àkókò nìkan.
- source_word: ἔσχατοι
  choice: ẹni ìkẹyìn
  rationale: Ó jẹ́ òdìkejì tààrà fún “ẹni àkọ́kọ́,” ó sì pa àpẹẹrẹ ọ̀rọ̀ òwe náà mọ́.
- source_word: πρῶτοι ἔσχατοι
  choice: àwọn tí ó jẹ́ ẹni àkọ́kọ́ ni yóò jẹ́ ẹni ìkẹyìn
  rationale: A fi “àwọn tí ó jẹ́” kún un gẹ́gẹ́ bí ohun tí gírámà Gíríìkì túmọ̀ sí, kí gbolohun náà lè ṣàn lọ́nà àdánidá ní Yorùbá.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: àwọn ẹni ìkẹyìn sì ni yóò jẹ́ ẹni àkọ́kọ́
  rationale: A tún ọ̀rọ̀-ìṣe ọjọ́ iwájú tí Gíríìkì fi sílẹ̀ láti jẹ́ òye nínú abala kejì sọ, nítorí Yorùbá nílò rẹ̀ fún kíkún àti ìmọ̀ye tó rọrùn.
theological_decisions:
- issue: Irú ìyípadà ipò tí ọ̀rọ̀ náà ń sọ
  choice: A pa á mọ́ gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò nípa ìyípadà ipò tàbí ipò-ọlá.
  alternative: Kí a sọ ọ́ ní pàtó gẹ́gẹ́ bí ọ̀rọ̀ nípa ìgbàlà, wíwọ ìjọba wọlé, èrè àwọn ọmọ-ẹ̀yìn, tàbí ipò láwùjọ.
  rationale: Ẹsẹ náà kò sọ ibi tí ìyípadà náà kan sí ní pàtó; ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ kan tí ó dín ìtumọ̀ rẹ̀ kù wọ inú rẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tó ní àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó bójú mu, ó sì ní ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ mímọ́. A yan ìtumọ̀ tó ṣàn dáadáa ju títẹ̀lé ìṣọ̀kan ọ̀rọ̀ Gíríìkì lọ ní gbogbo ibi, ṣùgbọ́n àlàyé ìsúnmọ́-orísun wà nínú àlàyé ìsàlẹ̀.
