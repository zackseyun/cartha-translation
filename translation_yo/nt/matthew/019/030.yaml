  to: Ṣùgbọ́n ọ̀pọ̀ àwọn tí wọ́n jẹ́ àkọ́kọ́ yóò jẹ́ ìkẹyìn, àwọn tí wọ́n jẹ́ ìkẹyìn yóò sì jẹ́ àkọ́kọ́.[a]
