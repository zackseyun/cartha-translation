id: MAT.19.26
reference: Matthew 19:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù tẹjú mọ́ wọn, ó sì sọ fún wọn pé, “Lọ́dọ̀ ènìyàn, èyí kò ṣeé ṣe; ṣùgbọ́n lọ́dọ̀ Ọlọ́run, ohun gbogbo ni ó ṣeé ṣe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: tẹjú mọ́ wọn
  rationale: Ó túmọ̀ sí pé Jésù darí ojú rẹ̀ sí wọn ní pàtó. ‘Tẹjú mọ́ wọn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi agbára ìṣe náà hàn láìsọ ọ́ di líle ju orísun lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń fi ìyàtọ̀ díẹ̀ hàn nínú ìdáhùn Jésù sí ohun tí ó ṣáájú; ‘Ṣùgbọ́n’ bá ìtumọ̀ àti ìṣàn ọ̀rọ̀ mu.
- source_word: εἶπεν αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: A pa αὐτοῖς mọ́ ní ‘fún wọn,’ a sì lo ‘pé’ láti ṣí ọ̀rọ̀ tààrà sílẹ̀ ní Yorùbá àdánidá.
- source_word: παρὰ ἀνθρώποις
  choice: Lọ́dọ̀ ènìyàn
  rationale: παρά pẹ̀lú dative ń tọ́ka sí ibi agbára tàbí ohun tí ó ṣeé ṣe wà. ‘Lọ́dọ̀ ènìyàn’ jẹ́ ọ̀nà Yorùbá tí ó bójú mu, ‘ènìyàn’ sì dúró fún gbogbo ẹ̀dá ènìyàn láìka akọ tàbí abo sí.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí ọ̀ràn tí wọ́n ṣẹ̀ṣẹ̀ ń jíròrò; ‘èyí’ jẹ́ ìtumọ̀ tààrà, kedere.
- source_word: ἀδύνατόν ἐστιν
  choice: kò ṣeé ṣe
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá fún ohun tí kò lè ṣẹlẹ̀ tàbí tí ènìyàn kò lè ṣe.
- source_word: παρὰ δὲ θεῷ
  choice: ṣùgbọ́n lọ́dọ̀ Ọlọ́run
  rationale: 'A tún ọna tí a gbà túmọ̀ παρά ṣe láti pa ìwọ̀ntúnwọ̀nsì ìlà Gíríìkì mọ́: ‘lọ́dọ̀ ènìyàn ... lọ́dọ̀ Ọlọ́run.’'
- source_word: πάντα δυνατά
  choice: ohun gbogbo ni ó ṣeé ṣe
  rationale: ‘Ohun gbogbo’ pa agbára πάντα mọ́, ‘ni ó ṣeé ṣe’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì ní ìtẹnumọ́ tó bá ọ̀rọ̀ àkójọpọ̀ náà mu.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώποις nínú gbólóhùn tí ó kan gbogbo aráyé
  choice: ènìyàn
  alternative: àwọn ènìyàn / ẹ̀dá ènìyàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀, ó ń sọ̀rọ̀ nípa aráyé lápapọ̀. Nínú Yorùbá, ‘ènìyàn’ lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ fún gbogbo ẹ̀dá ènìyàn, ó sì pa ìtakora pẹ̀lú ‘Ọlọ́run’ mọ́ láìfi akọ tàbí abo kún un.
- issue: Ààlà ìtumọ̀ ‘ohun gbogbo ni ó ṣeé ṣe’
  choice: Pa gbólóhùn àkójọpọ̀ orísun mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ohun gbogbo tí ó bá ìfẹ́ Ọlọ́run mu
  rationale: Orísun sọ πάντα δυνατά ní kíkún nínú àyíká ìgbàlà. Ìtumọ̀ kò yẹ kí ó dín ọ̀rọ̀ náà kù tàbí kí ó fi àlàyé ẹ̀kọ́ kan sínú ara ẹsẹ̀ tí kò sí nínú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbo. Ìwọ̀ntúnwọ̀nsì ‘lọ́dọ̀ ènìyàn ... lọ́dọ̀ Ọlọ́run’ pa àtúnṣe ọ̀rọ̀ inú orísun mọ́.
