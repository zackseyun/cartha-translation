  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: yo
  text: Bọ̀wọ̀ fún baba rẹ àti ìyá rẹ,[a] kí o sì nífẹ̀ẹ́ ọmọnìkejì rẹ bí ara rẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tí ó sún mọ́ ìrísí ọ̀rọ̀ Gíríìkì: “Bọ̀wọ̀ fún baba rẹ àti ìyá rẹ, ìwọ yóò sì nífẹ̀ẹ́ ọmọnìkejì rẹ bí ara rẹ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Bọ̀wọ̀ fún
  rationale: Ó sọ pé kí a fi ọlá tí ó tọ́ hàn sí ẹni náà, kì í ṣe pé kí a kàn ní èrò rere nípa rẹ̀. Ó tún pa ìwọ̀n àṣẹ inú Òfin Mẹ́wàá mọ́.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: baba rẹ àti ìyá rẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé àròkọ ni Gíríìkì lò dípò arọ́pò-orúkọ ohun-ìní, àṣẹ náà ń tọ́ka sí baba àti ìyá ẹni tí a ń bá sọ̀rọ̀, gẹ́gẹ́ bí ọ̀rọ̀ inú Òfin Mẹ́wàá.
- source_word: Ἀγαπήσεις
  choice: kí o sì nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ Gíríìkì wà ní ìrísí ọjọ́ iwájú nínú àyọlò àṣẹ Tórà, ṣùgbọ́n ó ní agbára àṣẹ. Ìtumọ̀ yìí mú un jáde ní Yorùbá àdánidá gẹ́gẹ́ bí àṣẹ, ní ìbámu pẹ̀lú Τίμα.
- source_word: τὸν πλησίον σου
  choice: ọmọnìkejì rẹ
  rationale: ‘Ọmọnìkejì’ níbí túmọ̀ sí ẹlòmíràn tí ènìyàn ní ojúṣe sí, ó sì gbòòrò ju aládùúgbò ilé lásán lọ.
- source_word: ὡς σεαυτόν
  choice: bí ara rẹ
  rationale: Ó pa àfiwé kúkúrú inú Gíríìkì mọ́ láìfi ọ̀rọ̀ àlàyé tí kò sí nínú rẹ̀ kún un.
theological_decisions:
- issue: Ìrísí àwọn àṣẹ nínú àyọlò àwọn òfin
  choice: 'A túmọ̀ Τίμα àti Ἀγαπήσεις gẹ́gẹ́ bí àṣẹ taara: “Bọ̀wọ̀ … kí o sì nífẹ̀ẹ́ …”'
  alternative: “Bọ̀wọ̀ fún baba rẹ àti ìyá rẹ, ìwọ yóò sì nífẹ̀ẹ́ ọmọnìkejì rẹ bí ara rẹ.”
  rationale: Gíríìkì darapọ̀ ọ̀rọ̀ àṣẹ (Τίμα) mọ́ ọ̀rọ̀ ọjọ́ iwájú (Ἀγαπήσεις), nítorí pé Jésù ń fa ọ̀rọ̀ àwọn òfin yọ. Yorùbá àdánidá ń fi agbára àṣẹ náà hàn dáadáa nípasẹ̀ “kí o sì nífẹ̀ẹ́,” nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa ìrísí ọjọ́ iwájú mọ́ gẹ́gẹ́ bí òmíràn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ọmọnìkejì” dípò “aládùúgbò” kí ìtumọ̀ má bàa dín kù sí ẹni tó ń gbé nítòsí ilé nìkan; a sì lo “nífẹ̀ẹ́” láti fi ìtumọ̀ ìfẹ́ hàn ní kedere.
