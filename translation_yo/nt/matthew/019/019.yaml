  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: “Bọ̀wọ̀ fún” mú Τίμα hàn gẹ́gẹ́ bí àṣẹ, “kí o sì nífẹ̀ẹ́” dá agbára àṣẹ Ἀγαπήσεις hàn ní Yorùbá, “ọmọnìkejì rẹ” sì jẹ́ ọ̀rọ̀ ìbílẹ̀ tí ó fìdí múlẹ̀ fún τὸν πλησίον σου nínú àyọlò òfin yìí. Àfiwé “bí ara rẹ” pa ὡς σεαυτόν mọ́ láìfi ìtumọ̀ míì kún un.'
  naturalness: Ọ̀rọ̀ inú ẹsẹ̀ náà jẹ́ Yorùbá boṣewa, ó sì ní ìwọ̀n ọ̀rọ̀ mímọ́ tó yẹ. Àmọ́ gbolohun “tó tẹ̀ lé ìrísí ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí” nínú àkọsílẹ̀ ìsàlẹ̀ kò dára ní Yorùbá; “pẹ́kípẹ́kí” kò yẹ ní àyíká yẹn.
