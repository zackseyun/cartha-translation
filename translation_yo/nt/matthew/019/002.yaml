  source_fidelity: 'The draft accurately conveys the two coordinated aorist actions: many people followed Jesus, and he healed them at that location. The plural sense of ὄχλοι πολλοί is adequately represented by “Ọ̀pọ̀lọpọ̀ ènìyàn,” though it is somewhat less explicit about separate crowds than a literal rendering would be.'
