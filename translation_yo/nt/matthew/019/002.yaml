  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: yo
  text: Ọ̀pọ̀lọpọ̀ ènìyàn sì tẹ̀ lé e, ó sì mú wọn láradá níbẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: tẹ̀ lé
  rationale: Ọ̀rọ̀ yìí sọ nípa lílọ tẹ̀ lé ẹnì kan ní ìtàn náà; ‘tẹ̀ lé’ jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn kún un láìnídí.
- source_word: αὐτῷ
  choice: e
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí àwọn ènìyàn tẹ̀ lé; ‘e’ ni arọ́pò-orúkọ ohun tí ó bá ‘tẹ̀ lé’ mu níbí.
- source_word: ὄχλοι πολλοί
  choice: ọ̀pọ̀lọpọ̀ ènìyàn
  rationale: Gíríìkì náà túmọ̀ ní tààrà sí ọ̀pọ̀ àwùjọ ènìyàn; ‘ọ̀pọ̀lọpọ̀ ènìyàn’ sọ iye púpọ̀ náà ní Yorùbá àdánidá.
- source_word: ἐθεράπευσεν
  choice: ó mú wọn lára dá
  rationale: Ní àyíká ìwòsàn yìí, ‘mú wọn lára dá’ jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún mímú àwọn aláìsàn láradá.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ yìí padà tọ́ka sí àwọn ènìyàn tí wọ́n tẹ̀ lé Jésù.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: ‘Níbẹ̀’ pa ìtọ́kasí ibi tí ọ̀rọ̀ Gíríìkì náà ní mọ́ ní ṣókí àti ní ti àdánidá.
- source_word: καὶ ... καὶ
  choice: sì ... sì
  rationale: ‘Sì’ so àwọn ìṣẹ̀lẹ̀ méjèèjì pọ̀, ó sì pa ìṣàn ìtàn alásopọ̀ Gíríìkì mọ́ ní Yorùbá tí ó yọ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbo ènìyàn.
