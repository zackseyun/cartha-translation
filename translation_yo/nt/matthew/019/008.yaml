id: MAT.19.8
reference: Matthew 19:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: yo
  text: Ó sọ fún wọn pé, “Nítorí líle ọkàn yín ni Mósè fàyè gba yín láti kọ àwọn aya yín sílẹ̀[a], ṣùgbọ́n láti ìbẹ̀rẹ̀ kò rí bẹ́ẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “láti rán àwọn aya yín lọ”; nínú àyíká yìí, ìtumọ̀ rẹ̀ ni láti kọ wọn sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ó sọ fún wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo àkókò ìsinsìnyí nínú ìtàn, àkókò tí ó ti kọjá ni ó bá ìtàn Yorùbá òde òní mu lọ́nà àdánidá.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Nítorí líle ọkàn yín
  rationale: Èyí mú ìtumọ̀ ìdí tí πρός pẹ̀lú accusative ní níbí jáde, ó sì pa àwòrán ọ̀rọ̀ inú Bíbélì nípa ọkàn líle mọ́.
- source_word: ἐπέτρεψεν
  choice: ṣe yọ̀ǹda fún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífúnni láàyè gẹ́gẹ́ bí ìyọ̀ǹda, kì í ṣe àṣẹ tàbí ìfọwọ́sí ohun náà.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: láti kọ àwọn aya yín sílẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ ìgbéyàwó yìí, gbólóhùn náà ń tọ́ka sí ìkọ̀sílẹ̀ aya, kì í ṣe kìkì rírán obìnrin lọ.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀pẹ̀pẹ̀
  rationale: Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì dá ìtọ́kasí sí ìbẹ̀rẹ̀ ìṣẹ̀dá dúró.
- source_word: οὐ γέγονεν οὕτως
  choice: kò rí bẹ́ẹ̀
  rationale: Ó sọ ipò tí kò ti fìdí múlẹ̀ láti ìbẹ̀rẹ̀ jáde ní Yorùbá kedere, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Bóyá ohun tí Mósè ṣe jẹ́ àṣẹ, ìfọwọ́sí, tàbí ìyọ̀ǹda
  choice: Mósè ṣe yọ̀ǹda fún yín
  alternative: Mósè pàṣẹ fún yín
  rationale: ἐπέτρεψεν ń sọ nípa fífúnni láàyè gẹ́gẹ́ bí ìyọ̀ǹda; kò túmọ̀ sí pé Mósè pàṣẹ ìkọ̀sílẹ̀ tàbí pé ó gbà á gẹ́gẹ́ bí ohun àkọ́kọ́ tí ó yẹ.
- issue: Bóyá kí a sọ èrò ìṣẹ̀dá Ọlọ́run ní kedere ju ọ̀rọ̀ Gíríìkì lọ
  choice: ṣùgbọ́n láti ìbẹ̀rẹ̀pẹ̀pẹ̀ kò rí bẹ́ẹ̀
  alternative: ṣùgbọ́n láti ìbẹ̀rẹ̀pẹ̀pẹ̀ èyí kì í ṣe ètò Ọlọ́run
  rationale: Àṣàyàn náà pa àìsọ̀rọ̀-tán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì fi àyíká ẹsẹ̀ náà ṣàlàyé ìtọ́kasí sí ìṣẹ̀dá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. “Líle ọkàn” pa àwòrán Bíbélì mọ́; “ṣe yọ̀ǹda fún” yà ìyọ̀ǹda sọ́tọ̀ kúrò nínú àṣẹ; “ìbẹ̀rẹ̀pẹ̀pẹ̀” jẹ́ ọ̀nà àdánidá láti tọ́ka sí ìbẹ̀rẹ̀ ìṣẹ̀dá.
