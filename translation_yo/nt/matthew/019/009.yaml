id: MAT.19.9
reference: Matthew 19:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé, ẹnikẹ́ni tí ó bá kọ aya rẹ̀ sílẹ̀—bí kò ṣe nítorí ìṣekúṣe[a]—tí ó sì fẹ́ obìnrin mìíràn, ó ṣe panṣágà; ẹni tí ó bá sì fẹ́ obìnrin tí a kọ sílẹ̀, ó ṣe panṣágà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí kò ṣe lórí ìdí ìṣekúṣe.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ohun tóóró bí “àgbèrè,” àwọn kan sì máa ń lóye rẹ̀ sí “àìṣòótọ́ nípa ìbálòpọ̀.”
    reason: lexical_alternative
  - marker: b
    text: 'Àwọn àfọwọ́kọ kan kò ní gbólóhùn yìí: “ẹni tí ó bá sì fẹ́ obìnrin tí a kọ sílẹ̀, ó ṣe panṣágà.”'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ṣùgbọ́n mo sọ fún yín pé
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ onírẹ̀lẹ̀ tí δέ ní nínú ọ̀rọ̀ yìí hàn; “mo sọ fún yín” sì jẹ́ ọ̀nà Yorùbá àdánidá fún λέγω ... ὑμῖν.
- source_word: ὃς ἂν
  choice: ẹnikẹ́ni tí ó bá
  rationale: Àkópọ̀ ọ̀rọ̀ yìí fi ipò gbogbogbò tí kò tọ́ka sí ẹnì kan pàtó hàn; “ẹnikẹ́ni tí ó bá” mú agbára yẹn jáde ní Yorùbá.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: kọ aya rẹ̀ sílẹ̀
  rationale: Nínú àyíká ìgbéyàwó, ἀπολύω túmọ̀ sí ìkọ̀sílẹ̀, γυνή sì túmọ̀ sí aya. Gbólóhùn Yorùbá yìí ṣe kedere pé ọkọ ló kọ aya sílẹ̀.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: bí kò ṣe nítorí ìṣekúṣe
  rationale: “Bí kò ṣe nítorí” fi gbólóhùn àyọkúrò náà hàn. “Ìṣekúṣe” jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò fún ìwà ìbálòpọ̀ tí kò tọ́, láì dín πορνεία kù sí panṣágà nìkan.
- source_word: γαμήσῃ ἄλλην
  choice: tí ó sì fẹ́ ẹlòmíràn
  rationale: ἄλλην jẹ́ abo nínú Gíríìkì, ṣùgbọ́n “fẹ́ ẹlòmíràn” jẹ́ Yorùbá tó ṣe déédé, àyíká náà sì ti fi hàn pé obìnrin mìíràn ni.
- source_word: μοιχᾶται
  choice: ó ṣe panṣágà
  rationale: “Ṣe panṣágà” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ṣíṣe àgbèrè sí ẹni tí kì í ṣe ọkọ tàbí aya ẹni.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: ẹni tí ó bá sì fẹ́ obìnrin tí ọkọ rẹ̀ kọ̀ sílẹ̀, ó ṣe panṣágà
  rationale: Ìtumọ̀ yìí pa agbára gbogbogbò ti articular participle mọ́, ó sì sọ ipo obìnrin náà di kedere láì fi ohun tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìtumọ̀ πορνεία nínú gbólóhùn àyọkúrò
  choice: ìṣekúṣe
  alternative: panṣágà; àgbèrè; àìṣòótọ́ nípa ìbálòpọ̀
  rationale: πορνεία gbòòrò ju panṣágà nìkan lọ. “Ìṣekúṣe” pa ìbú rẹ̀ mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìjọ kan pàtó lé ẹsẹ náà lórí; àlàyé ìsàlẹ̀ sọ àwọn ìtumọ̀ tóóró mìíràn.
- issue: Wíwà gbólóhùn ìkẹyìn καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Fi í sínú ọ̀rọ̀ pàtàkì, kí a sì samisi àríyànjiyàn ẹ̀dà ní [b]
  alternative: Yọ ọ́ kúrò nítorí pé kò sí nínú àwọn àfọwọ́kọ kan
  rationale: SBLGNT tí a pèsè ní gbólóhùn náà, bí ó tilẹ̀ jẹ́ pé àmì rẹ̀ fi ìyàtọ̀ àfọwọ́kọ hàn. Nítorí náà, a túmọ̀ rẹ̀ sínú ọ̀rọ̀ pàtàkì, a sì pa àìdánilójú ẹ̀rí àfọwọ́kọ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, àti kíkà-rọrùn fún òǹkàwé òde òní. Àmì ìdákẹ́jẹ gígùn yà gbólóhùn àyọkúrò sọ́tọ̀ láti mú ìbáṣepọ̀ gírámà kedere.
