  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: yo
  text: Lẹ́yìn tí ó gbé ọwọ́ lé wọn, ó kúrò níbẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ìṣe yìí mọ́ ìtàn tó ṣáájú lọ́nà àdánidá, láìfi ìtumọ̀ tuntun kún un.
- source_word: ἐπιθεὶς
  choice: Lẹ́yìn tí ó ... gbé ... lé
  rationale: Aorist participle náà tọ́ka sí ìṣe tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ọ̀nà yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: ọwọ́ lé wọn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìṣe fífi ọwọ́ sí ara ẹnì kan. Kíkọ ọ̀rọ̀ náà ní 'ọwọ́' dípò 'àwọn ọwọ́' kò sọ iye ọwọ́ pàtó, gẹ́gẹ́ bí ìlò Yorùbá ṣe máa ń rí.
- source_word: ἐπορεύθη
  choice: ó kúrò
  rationale: Nínú àyíká ìtàn yìí, ó túmọ̀ sí pé ó lọ kúrò ní ibi náà; 'ó kúrò' jẹ́ èdè Yorùbá tó ṣe kedere, tó sì ní iyì.
- source_word: ἐκεῖθεν
  choice: níbẹ̀
  rationale: Pẹ̀lú 'ó kúrò,' 'níbẹ̀' ń sọ 'láti ibẹ̀' ní Hockey Yorùbá àdánidá láìṣe àtúnlò ọ̀rọ̀ tí kò pọndandan.
theological_decisions:
- issue: Irú ìṣe Jésù ní fífi ọwọ́ lé wọn
  choice: A pa ìṣe gidi náà mọ́ gẹ́gẹ́ bí fífi ọwọ́ lé wọn.
  alternative: Láti túmọ̀ rẹ̀ ní tààrà bí 'ó súre fún wọn.'
  rationale: Gíríìkì sọ ìṣe fífi ọwọ́ lé wọn ní kedere; àyíká lè fi ìbùkún hàn, ṣùgbọ́n a kò fi ìtumọ̀ ẹ̀kọ́ ìsìn tàbí ti àṣà ìyàsímímọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó rọrùn, ó ní iyì, ó sì yẹ fún àwọn òǹkàwé òde òní. A kò nílò àlàyé ìsàlẹ̀ ojú ìwé, nítorí ìyàtọ̀ Gẹ̀ẹ́sì tó wà láàárín 'after laying' àti 'having laid' lè hàn ní kedere nínú gbólóhùn Yorùbá kan ṣoṣo.
