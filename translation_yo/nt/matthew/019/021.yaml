id: MAT.19.21
reference: Matthew 19:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: yo
  text: Jésù wí fún un pé, “Bí o bá fẹ́ jẹ́ ẹni pípé[a], lọ, ta àwọn ohun ìní rẹ, kí o sì fún àwọn òtòṣì; ìwọ yóò sì ní ìṣúra ní ọ̀run. Lẹ́yìn náà, wá, sì tẹ̀lé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ẹni tí ó pé déédéé” tàbí “ẹni tí ó dàgbà dénú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésù wí fún un pé
  rationale: ‘Wí fún un pé’ jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún fífi ọ̀rọ̀ ìtàn hàn ní Yorùbá, láìfi irú bí ó ṣe sọ ọ́ kún un.
- source_word: τέλειος
  choice: ẹni pípé
  rationale: ‘Ẹni pípé’ lè gbé ìtumọ̀ ẹni tí ó pé tàbí tí ó kún déédéé, láìdín agbára ìbéèrè Jésù kù. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì tí ọ̀rọ̀ Gíríìkì náà lè ní hàn.
- source_word: ὕπαγε
  choice: lọ
  rationale: Àṣẹ kedere àti àdánidá ni ‘lọ’ fún ὕπαγε.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: ta àwọn ohun ìní rẹ
  rationale: ‘Àwọn ohun ìní rẹ’ dúró fún dúkìá tàbí ohun tí ẹni náà ní; a kò fi ‘gbogbo’ kún un nítorí pé kò sí ọ̀rọ̀ pàtó fún un nínú Gíríìkì.
- source_word: δὸς πτωχοῖς
  choice: fi owó náà fún àwọn òtòṣì
  rationale: Ohun tí a ó fi fún wọn jẹ́ owó tí títà ohun ìní mú wá; Yorùbá nílò kí ohun tí a ń fi fúnni ṣe kedere, bí ó tilẹ̀ jẹ́ pé ó wà ní ìtumọ̀ ọ̀rọ̀ Gíríìkì láìsọ ọ́ jáde.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: ìwọ yóò sì ní ìṣúra ní ọ̀run
  rationale: Èyí túmọ̀ ọjọ́-ọ̀la ἕξεις ní tààrà, ó sì lo ‘ọ̀run’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ọ̀pọ̀ οὐρανοῖς nínú gbólóhùn yìí.
- source_word: δεῦρο ἀκολούθει μοι
  choice: Lẹ́yìn náà, wá tọ̀ mí lẹ́yìn
  rationale: ‘Wá’ pa ìpè δεῦρο mọ́, ‘lẹ́yìn náà’ sì mú ìtẹ̀lé àwọn àṣẹ náà hàn; ‘tọ̀ mí lẹ́yìn’ jẹ́ èdè ọmọ-ẹ̀yìn tí ó ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ τέλειος nípa jíjẹ́ ọmọ-ẹ̀yìn
  choice: ẹni pípé
  alternative: ẹni tí ó pé déédéé; ẹni tí ó dàgbà dénú
  rationale: 'A pa agbára àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́: ó lè tọ́ka sí pípé, kíkún, tàbí ìdàgbàsókè dénú. A kò túmọ̀ rẹ̀ ní ọ̀nà tí yóò fi dá ẹ̀kọ́ ìsìn kan nípa àìlẹ́ṣẹ̀ sílẹ̀, bẹ́ẹ̀ ni a kò sọ ìbéèrè ìfọkànsìn pípé di rírọ̀.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘ẹni pípé’ nítorí pé ó ye òǹkàwé lásán, a sì fi àlàyé kún un láti pa ìbú ìtumọ̀ τέλειος mọ́.
