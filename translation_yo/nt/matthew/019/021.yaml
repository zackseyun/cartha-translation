  to: Jésù wí fún un pé, “Bí o bá fẹ́ jẹ́ ẹni pípé[a], lọ, ta àwọn ohun ìní rẹ, kí o sì fún àwọn òtòṣì; ìwọ yóò sì ní ìṣúra ní ọ̀run. Lẹ́yìn náà, wá, sì tẹ̀lé mi.”
