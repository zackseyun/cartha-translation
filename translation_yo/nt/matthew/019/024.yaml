id: MAT.19.24
reference: Matthew 19:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: yo
  text: Mo tún sọ fún yín pé, ó rọrùn fún ràkúnmí[a] láti gba ojú abẹ́rẹ́[b] kọjá ju fún ọkùnrin ọlọ́rọ̀ láti wọ ìjọba Ọlọ́run lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn kan ti dábàá “okùn” dípò “ràkúnmí,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí ní “ràkúnmí.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “láti gba ihò abẹ́rẹ́ kọjá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Mo tún sọ fún yín pé
  rationale: “Tún” fi ìtúmọ̀ πάλιν hàn, δέ sì jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò nílò ọ̀rọ̀ ọ̀tọ̀ ní Yorùbá. Gbólóhùn náà jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún àsọyé tààrà.
- source_word: εὐκοπώτερόν ἐστιν
  choice: ó rọrùn … ju … lọ
  rationale: Ìlànà afiwéra Yorùbá “rọrùn … ju … lọ” mú ìtumọ̀ comparative náà jáde ní kedere.
- source_word: κάμηλον
  choice: ràkúnmí
  rationale: Ọ̀rọ̀ Gíríìkì tí a ní nínú SBLGNT túmọ̀ sí “ràkúnmí,” kì í ṣe “okùn”; èyí pa àwòrán àsọdùn tó lágbára mọ́.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: láti gba ojú abẹ́rẹ́ kọjá
  rationale: “Ojú abẹ́rẹ́” ni ọ̀nà Yorùbá tó wọ́pọ̀ fún ihò kékeré inú abẹ́rẹ́ ìránṣọ, “gba … kọjá” sì fi ìṣípò la ihò náà hàn.
- source_word: ἢ πλούσιον
  choice: ju fún ọkùnrin ọlọ́rọ̀ … lọ
  rationale: “Ọkùnrin ọlọ́rọ̀” pa ìtọ́kasí akọ ẹyọ kan ti πλούσιον mọ́, ó sì bá ìlànà afiwéra Yorùbá mu.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: láti wọ ìjọba Ọlọ́run
  rationale: “Wọ” jẹ́ ọ̀rọ̀ àdánidá fún ìwọlé, “ìjọba Ọlọ́run” sì pa gbólóhùn pàtàkì βασιλεία τοῦ θεοῦ mọ́.
theological_decisions:
- issue: Ìtumọ̀ àwòrán ràkúnmí àti ojú abẹ́rẹ́
  choice: A pa á mọ́ gẹ́gẹ́ bí àsọdùn tó mọ̀ọ́mọ̀ fi ohun tí ó ṣòro dé góńgó hàn.
  alternative: Kí a ka “ojú abẹ́rẹ́” sí orúkọ ẹnubodè kan ní Jerúsálẹ́mù, tàbí kí a ka “okùn” dípò “ràkúnmí.”
  rationale: Ẹ̀rí Gíríìkì sọ “ràkúnmí” àti ihò abẹ́rẹ́ ìránṣọ ní tààrà. Kò sí ìdí nínú ọ̀rọ̀ náà láti sọ ọ́ di ẹnubodè tàbí láti dín agbára àsọdùn náà kù; a sì fi ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú àyíká ọ̀rọ̀ náà sílẹ̀ láìyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Ràkúnmí,” “ojú abẹ́rẹ́,” àti “wọ ìjọba Ọlọ́run” jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé lásán, láìsọ àsọdùn náà di àlàyé ẹ̀kọ́ ìsìn kan pàtó.
