id: MAT.19.12
reference: Matthew 19:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: yo
  text: Nítorí àwọn ìwẹ̀fà kan wà tí a bí bẹ́ẹ̀ láti inú ìyá wọn wá, àwọn ìwẹ̀fà kan sì wà tí àwọn ènìyàn sọ di ìwẹ̀fà, àwọn ìwẹ̀fà kan sì wà tí wọ́n sọ ara wọn di ìwẹ̀fà nítorí ìjọba ọ̀run[a]. Ẹni tí ó bá lè gba èyí, kí ó gbà á[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n gé ẹ̀yà ìbímọ wọn kúrò.” Ọ̀pọ̀ àwọn atúmọ̀ ló gbà pé àpèjúwe ni èyí fún yíyan láti má ṣe ìgbéyàwó nítorí ìjọba Ọlọ́run.
    reason: alternative_reading
  - marker: b
    text: Ní tààrà sí i, “Ẹni tí ó bá lè fàyè gba èyí, kí ó fàyè gbà á.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: àwọn ìwẹ̀fà
  rationale: “Ìwẹ̀fà” ni ọ̀rọ̀ Yorùbá tí a fi ń pe eunuch. Lílo rẹ̀ ní gbogbo ibi mẹ́tẹ̀ẹ̀ta pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìtumọ̀ “àwọn tí kò ṣègbéyàwó” rọ́pò ọ̀rọ̀ orísun.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: tí wọ́n bí bẹ́ẹ̀ láti inú ìyá wọn wá
  rationale: Èyí pa àwòrán “láti inú ìyá” mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ipò náà ti rí bẹ́ẹ̀ láti ìbí.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: tí àwọn ènìyàn sọ di ìwẹ̀fà
  rationale: Èyí fi ẹni tó ṣe ìṣe náà hàn kedere, ó sì pa ìbátan tó wà láàárín ọ̀rọ̀-orúkọ εὐνοῦχοι àti ọ̀rọ̀-ìṣe εὐνουχίσθησαν mọ́.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: tí wọ́n sọ ara wọn di ìwẹ̀fà
  rationale: Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì pa ọ̀rọ̀ líle náà àti àìdánilójú bóyá a gbọ́dọ̀ yé e ní ti ara gan-an tàbí lọ́nà àpèjúwe mọ́.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: nítorí ìjọba ọ̀run
  rationale: “Nítorí” lè sọ ìdí tàbí ète tí ìkọ̀sílẹ̀ náà fi wáyé, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédéé fún διά pẹ̀lú accusative níhìn-ín.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Ẹni tí ó bá lè gba èyí, kí ó gbà á
  rationale: “Gba” sọ ìtumọ̀ àfiwé χωρέω gẹ́gẹ́ bí títẹ́wọ́ gba ẹ̀kọ́ tó nira ní Yorùbá tó rọrùn, nígbà tí “kí ó gbà á” pa agbára àṣẹ ìṣírí náà mọ́.
theological_decisions:
- issue: Bóyá εὐνούχισαν ἑαυτοὺς túmọ̀ sí ìṣe ti ara ní tààrà tàbí àpèjúwe fífi ìgbéyàwó sílẹ̀
  choice: A lo “sọ ara wọn di ìwẹ̀fà” nínú ẹsẹ náà láìṣàlàyé rẹ̀ síwájú.
  alternative: “gé ẹ̀yà ìbímọ ara wọn kúrò” tàbí “yàn láti má ṣe ìgbéyàwó”
  rationale: Ẹsẹ náà fúnra rẹ̀ kò pinnu kedere bóyá ọ̀rọ̀ náà jẹ́ ti ara gan-an, àṣejù ọ̀rọ̀, tàbí àpèjúwe fún àìṣe ìgbéyàwó. Nítorí náà, a pa ìdíjú ẹ̀kọ́ náà mọ́, a sì fi àlàyé sí àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ χωρεῖν nínú ìṣírí tó parí ẹsẹ náà
  choice: “gba èyí”
  alternative: “fi àyè sílẹ̀ fún èyí” tàbí “tẹ́wọ́ gba èyí”
  rationale: “Gba” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún gbígba ẹ̀kọ́ tàbí ọ̀rọ̀ kan, ó sì yẹra fún gbólóhùn líle tí yóò dín ìtumọ̀ àfiwé ọ̀rọ̀ Gíríìkì kù.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ìwẹ̀fà” jẹ́ ọ̀rọ̀ pàtó tó pa ìtumọ̀ àti àtúnwí ọ̀rọ̀ Gíríìkì mọ́; àwọn gbólóhùn tó yí i ká mú kí ìtumọ̀ rẹ̀ hàn láìfi èrò ẹ̀sìn ẹgbẹ́ kan kún un. A gbé àmì [a] sí lẹ́yìn gbólóhùn tí ó kan εὐνούχισαν ἑαυτοὺς, àti [b] sí lẹ́yìn ìṣírí ìkẹyìn, kí àmì kọ̀ọ̀kan bá àlàyé tirẹ̀ mu.
