id: MAT.19.13
reference: Matthew 19:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: yo
  text: Nígbà náà ni a mú àwọn ọmọ wá sọ́dọ̀ rẹ̀, kí ó lè gbé ọwọ́ lé wọn, kí ó sì gbàdúrà; ṣùgbọ́n àwọn ọmọ-ẹ̀yìn bá wọn[a] wí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wọn” lè tọ́ka sí àwọn ọmọ náà tàbí sí àwọn tí wọ́n mú wọn wá.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ohun tí ó ṣẹlẹ̀ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtẹ̀síwájú ìtàn ní Yorùbá.
- source_word: προσηνέχθησαν
  choice: a mú ... wá
  rationale: Ọ̀rọ̀ aláìlẹ́ni-pàtó ‘a mú’ ń fi ìṣe àìṣe-tọ́ka-ẹni náà hàn lọ́nà Yorùbá tó ṣe déédé, láìsọ ẹni tí ó mú wọn wá.
- source_word: παιδία
  choice: àwọn ọmọ
  rationale: Ó túmọ̀ sí àwọn ọmọ, tí ó ṣeé ṣe kí wọ́n jẹ́ ọmọ kékeré; ṣùgbọ́n ‘àwọn ọmọ’ kò fi ìtumọ̀ àfikún tí ọ̀rọ̀ Gíríìkì kò fi dandan mú wọlé.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó pa ète tí gbólóhùn Gíríìkì ń sọ mọ́ ní Yorùbá àdánidá.
- source_word: τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: gbé ọwọ́ lé wọn
  rationale: Èyí ni àṣàyàn Yorùbá tó ṣe déédé fún fífi ọwọ́ lé ẹnìkan. Bí ó tilẹ̀ jẹ́ pé ‘ọwọ́’ wà ní ọ̀pọ̀ nínú Gíríìkì, Yorùbá sábà máa ń lo ‘ọwọ́’ gẹ́gẹ́ bí orúkọ àkójọpọ̀ nínú gbólóhùn yìí.
- source_word: προσεύξηται
  choice: gbàdúrà
  rationale: Ọ̀rọ̀ náà kò sọ ohun tàbí ẹni tí àdúrà náà jẹ́ fún ní tààrà, nítorí náà a kò fi ‘fún wọn’ kún un.
- source_word: οἱ δὲ μαθηταὶ
  choice: ṣùgbọ́n àwọn ọmọ-ẹ̀yìn
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ tó wà láàárín ète àwọn tó mú àwọn ọmọ wá àti ìhùwàsí àwọn ọmọ-ẹ̀yìn hàn.
- source_word: ἐπετίμησαν
  choice: bá ... wí
  rationale: ‘Bá ẹni wí’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ìbáwí tàbí lílé ẹnìkan lẹ́nu.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Arọ́pò-orúkọ Gíríìkì náà lè tọ́ka sí àwọn ọmọ tàbí sí àwọn tó mú wọn wá. ‘Wọn’ pa àìdájú yẹn mọ́.
theological_decisions:
- issue: Ohun tí αὐτοῖς tó wà ní òpin ẹsẹ náà ń tọ́ka sí
  choice: wọn
  alternative: àwọn ọmọ; tàbí àwọn tí wọ́n mú àwọn ọmọ náà wá
  rationale: Gíríìkì kò yan ọ̀kan nínú wọn ní kedere. Ìtumọ̀ náà lo arọ́pò-orúkọ tí kò yanjú àìdájú yìí, kí ó má bàa fi ìtumọ̀ kan lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa àìdájú arọ́pò-orúkọ ìpilẹ̀ṣẹ̀ mọ́.
