id: MAT.19.10
reference: Matthew 19:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ sọ fún un pé,[a] “Bí ọ̀ràn ọkùnrin pẹ̀lú aya rẹ̀ bá rí bẹ́ẹ̀, kò ṣàǹfààní láti gbéyàwó.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ọ̀ràn ọkùnrin pẹ̀lú aya kan bá rí bẹ́ẹ̀.” Gbólóhùn Gíríìkì náà kúkúrú, ó sì tún lè túmọ̀ sí “ipò” dípò “ọ̀ràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: sọ fún un pé
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí Gíríìkì jẹ́ ìsinsìnyí ìtàn níbí; àsìkò àtẹ̀yìnwá ni Yorùbá fi ń sọ ìtàn yìí lọ́nà àdánidá.
- source_word: μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Ìhìn Rere tí ó wọ́pọ̀ fún àwọn akẹ́kọ̀ọ́ tí wọ́n tún ń tẹ̀lé Jésù.
- source_word: Εἰ οὕτως ἐστίν
  choice: Bí ... bá rí bẹ́ẹ̀
  rationale: Ìkọ́lé àdánidá ní Yorùbá fún gbólóhùn oníṣ条件 tí ó ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ.
- source_word: ἡ αἰτία
  choice: ọ̀ràn
  rationale: Ní àyíká yìí αἰτία túmọ̀ sí ọ̀ràn tàbí ipò, kì í ṣe okùnfà ní ìtumọ̀ líle.
- source_word: τοῦ ἀνθρώπου
  choice: ọkùnrin
  rationale: Ẹyọ akọ náà ń tọ́ka sí ọkùnrin gẹ́gẹ́ bí ọkọ nínú àyíká ìgbéyàwó.
- source_word: μετὰ τῆς γυναικός
  choice: pẹ̀lú aya rẹ̀
  rationale: γυνή túmọ̀ sí aya nínú àyíká ìgbéyàwó; ‘rẹ̀’ mú ìbáṣepọ̀ náà ṣe kedere lọ́nà Yorùbá àdánidá.
- source_word: οὐ συμφέρει
  choice: kò ṣàǹfààní
  rationale: Ó pa ìtumọ̀ àǹfààní tàbí ohun tí ó dára fún ẹni mọ́ láì sọ ọ́ di àṣẹ tàbí ìmọ̀ràn lásán.
- source_word: γαμῆσαι
  choice: láti gbéyàwó
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ọkùnrin láti wọ inú ìgbéyàwó, ní ìbámu pẹ̀lú akọ tí orísun sọ.
theological_decisions:
- issue: Èdè akọ nínú ἀνθρώπου ... γυναικός
  choice: ọkùnrin pẹ̀lú aya rẹ̀
  alternative: ènìyàn pẹ̀lú ọkọ tàbí aya rẹ̀
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ sọ nípa ìgbéyàwó ọkùnrin àti obìnrin, orísun sì lo akọ ẹyọ àti γυνή ní ìtumọ̀ aya; a kò yí èdè akọ náà sí èdè àìlábọ̀sí.
translation_notes:
  register: Yorùbá àpapọ̀, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìtumọ̀ náà pa ìṣòro kékeré inú ἡ αἰτία àti àìsí arọ́pò-orúkọ ohun-ìní gbangba nínú Gíríìkì mọ́ ní àlàyé ìsàlẹ̀.
