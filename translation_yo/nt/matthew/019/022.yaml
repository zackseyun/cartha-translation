id: MAT.19.22
reference: Matthew 19:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ọ̀dọ́kùnrin náà gbọ́ ọ̀rọ̀ yìí[a], ó bá tirẹ̀ lọ pẹ̀lú ìbànújẹ́[b], nítorí ó ní ohun ìní púpọ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbólóhùn yìí.” “Ọ̀rọ̀” ní Gíríìkì níbí ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ìbànújẹ́.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe bí ó ṣe kúrò níbẹ̀ ní ipò ìbànújẹ́.
    reason: lexical_alternative
  - marker: c
    text: 'Ní àṣà ìtumọ̀ kan, “dúkìá ńlá.” Ṣùgbọ́n Gíríìkì tẹnu mọ́ iye wọn ní ọ̀pọ̀: “ohun ìní púpọ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ... gbọ́
  rationale: Aorist participle náà ń tọ́ka sí àkókò àti ìtẹ̀lé ìṣẹ̀lẹ̀; ọ̀rọ̀ yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ọ̀rọ̀ Jésù àti ìhùwàpadà ọ̀dọ́kùnrin náà.
- source_word: νεανίσκος
  choice: ọ̀dọ́kùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ọ̀dọ́kùnrin; a kò fi ‘olórí’ kún un láti inú ìtàn tó jọ ọ́ ní ìwé mìíràn.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ yìí
  rationale: Nínú àyíká ọ̀rọ̀, ó ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ, ó sì dúró sún mọ́ ìtumọ̀ gangan.
- source_word: ἀπῆλθεν
  choice: ó bá tirẹ̀ lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà kúrò níbẹ̀, ó sì bá ọ̀nà rẹ̀ lọ.
- source_word: λυπούμενος
  choice: pẹ̀lú ìbànújẹ́
  rationale: Present participle náà ṣàpèjúwe ipò ìbànújẹ́ tó bá ìlọkúrò rẹ̀ lọ.
- source_word: ἦν γὰρ ἔχων
  choice: nítorí ó ní
  rationale: Periphrastic imperfect náà fi ipò ìní tó ń bá a lọ hàn; ọ̀nà yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κτήματα πολλά
  choice: ohun ìní púpọ̀
  rationale: κτήματα túmọ̀ sí ohun ìní tàbí dúkìá, πολλά sì tẹnu mọ́ ọ̀pọ̀ rẹ̀ dípò bí ó ṣe tóbi.
theological_decisions:
- issue: Bóyá kí a fi ìdánimọ̀ ‘olórí’ kún un láti inú ìtàn tó jọ ọ́
  choice: ọ̀dọ́kùnrin
  alternative: ọ̀dọ́kùnrin olórí
  rationale: Gíríìkì Mátíù ní ẹsẹ yìí pè é ní ọ̀dọ́kùnrin nìkan. Fífi ‘olórí’ kún un yóò jẹ́ mímú àlàyé láti inú Lúùkù wá, kì í ṣe títúmọ̀ ọ̀rọ̀ Mátíù fúnra rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ó bá tirẹ̀ lọ’ gẹ́gẹ́ bí ọ̀rọ̀ ìtàn àdánidá, láìfi ìtumọ̀ míì kún ọ̀rọ̀ orísun.
