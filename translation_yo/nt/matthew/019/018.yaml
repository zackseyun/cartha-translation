id: MAT.19.18
reference: Matthew 19:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: yo
  text: Ó béèrè lọ́wọ́ rẹ̀ pé, “Àwọn wo?” Jésù sì wí pé, “Ìwọ kò gbọdọ̀ pànìyàn; ìwọ kò gbọdọ̀ ṣe panṣágà; ìwọ kò gbọdọ̀ jalè; ìwọ kò gbọdọ̀ jẹ́rìí èké.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Àwọn wo?
  rationale: Ọ̀rọ̀ arọ́pò afẹ́sọ́nà obìnrin ọ̀pọ̀ yìí tọ́ka sí àwọn àṣẹ tí a mẹ́nuba ṣáájú; ‘Àwọn wo?’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtọ́kasí náà mọ́.
- source_word: Οὐ φονεύσεις
  choice: Ìwọ kò gbọdọ̀ pànìyàn
  rationale: ‘Pànìyàn’ túmọ̀ φονεύω gẹ́gẹ́ bí pípa ènìyàn, kì í ṣe gbogbo lílo ọ̀rọ̀ ‘pa’ láìsí ìyàtọ̀.
- source_word: Οὐ μοιχεύσεις
  choice: Ìwọ kò gbọdọ̀ ṣe panṣágà
  rationale: ‘Ṣe panṣágà’ jẹ́ gbólóhùn Yorùbá tí ó wọ́pọ̀ fún ìbálòpọ̀ tí ó rú ìdúróṣinṣin ìgbéyàwó.
- source_word: Οὐ κλέψεις
  choice: Ìwọ kò gbọdọ̀ jalè
  rationale: ‘Jalè’ jẹ́ ìtumọ̀ Yorùbá tààrà fún κλέπτω.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: Ìwọ kò gbọdọ̀ jẹ́rìí èké
  rationale: Ìtumọ̀ yìí pa àwòrán ẹ̀rí tàbí ìjẹ́rìí èké mọ́, dípò fífi í ṣe irọ́ ní gbogbogbòò.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Τὸ ṣáájú àkójọ àwọn àṣẹ
  choice: A kò túmọ̀ ọ́ lọ́tọ̀; àkójọ náà bẹ̀rẹ̀ tààrà lẹ́yìn ‘pé’
  alternative: ‘Àwọn wọ̀nyí ni:’ tàbí títẹ̀lé Gẹ̀ẹ́sì ní lílo ‘The:’
  rationale: Τὸ lè ṣiṣẹ́ gẹ́gẹ́ bí àmì ìṣáájú ọ̀rọ̀ tí a ń tọ́ka sí tàbí tí a ń fa yọ. Yorùbá àdánidá kò nílò àmì-orúkọ yìí níbi yìí, àti pé fífi ‘Àwọn wọ̀nyí ni’ kun un lè sọ ìtumọ̀ náà di pàtó ju Gíríìkì lọ.
- issue: Agbára òfin inú οὐ pẹ̀lú ọ̀rọ̀-ìṣe ọjọ́ iwájú
  choice: ‘kò gbọdọ̀’
  alternative: ‘má ṣe’ tàbí ‘ìwọ kì yóò’
  rationale: Nínú àyọkà Òfin Mẹ́wàá, ọ̀nà yìí ń sọ ìdènà òfin. ‘Kò gbọdọ̀’ jẹ́ èdè Yorùbá àdánidá tí ó pa agbára àṣẹ náà mọ́ láìsọ ọ́ di àsọtẹ́lẹ̀ ọjọ́ iwájú.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa àtẹ̀lé àwọn àṣẹ àti ìfarahàn wọn gẹ́gẹ́ bí ọ̀rọ̀ tí Jésù fa yọ mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
