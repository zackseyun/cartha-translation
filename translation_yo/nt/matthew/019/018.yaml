  verdict: revise
  source_fidelity: Àkọ́kọ́ ọ̀rọ̀ náà ní λέγει, ìṣe lọwọlọwọ-ìtàn (“ó ń sọ/béèrè”), nígbà tí àkọ́ọ́lẹ̀ náà lo “Ó wí,” tí ó lè dà bí ìṣe tí ó ti kọjá. Bákan náà, ἐἶπεν túmọ̀ sí “wí/sọ”; “dáhùn” bá àyíká ọ̀rọ̀ mu, ṣùgbọ́n “wí” ń tẹ̀lé ọ̀rọ̀ Gíríìkì ní tààrà síi. Àwọn ìdènà mẹ́rin náà, pẹ̀lú ìyàtọ̀ “pànìyàn” fún φονεύσεις àti “jẹ́rìí èké” fún ψευδομαρτυρήσεις, jẹ́ olóòtítọ́ sí ìtumọ̀.
  naturalness: “Ó béèrè lọ́wọ́ rẹ̀ pé” jẹ́ Yorùbá òde-òní tí ó dára fún ọ̀rọ̀ ìbéèrè náà, ó sì pa ìtọ́kasí “sí i” mọ́. “Jésù sì wí pé” jẹ́ ìlò tó rọrùn, tó sì bá ọ̀rọ̀ títọ́ náà mu. “Kò gbọdọ̀” jẹ́ ọ̀nà àdánidá láti gbé àṣẹ ìdènà náà kalẹ̀.
  terminology: “Pànìyàn,” “ṣe panṣágà,” “jalè,” àti “jẹ́rìí èké” yẹ fún àwọn ọ̀rọ̀ Gíríìkì náà. A kò nílò láti tú Τὸ sí ọ̀rọ̀ Yorùbá olómìnira; ìfihàn àkójọ ní tààrà jẹ́ àdánidá, kò sì fi ìtumọ̀ míì kún un.
  issues:
