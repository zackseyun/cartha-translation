id: MAT.19.25
reference: Matthew 19:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: yo
  text: Nígbà tí àwọn ọmọ-ẹ̀yìn náà gbọ́ èyí, ẹnu yà wọ́n gidigidi, wọ́n sì wí pé, “Ta ni ó ha lè là?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí ... gbọ́ èyí
  rationale: Aorist participle náà ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìhùwàpadà wọn. Gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá; “èyí” sì ń tọ́ka sí ọ̀rọ̀ Jésù tó ṣáájú.
- source_word: δὲ
  choice: '[ó fara sin nínú ìlọsíwájú ìtàn]'
  rationale: δέ ń fi ìtàn tẹ̀ síwájú tàbí ń fi ìyàtọ̀ kékeré hàn. Ní Yorùbá, “Nígbà tí...” ti mú ìyípadà náà hàn láìfi àsopọ̀ mìíràn kún un.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àwọn tí ń kọ́ lẹ́sẹ̀ olùkọ́ tí wọ́n sì ń tẹ̀ lé e; níbí, àwọn ọmọ-ẹ̀yìn Jésù ni.
- source_word: ἐξεπλήσσοντο
  choice: ẹnu yà wọ́n
  rationale: Ọ̀rọ̀ náà fi ìyàlẹ́nu tó mú wọn ní ìṣọ̀kan hàn. Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì bá imperfect náà mu gẹ́gẹ́ bí ìhùwàpadà wọn.
- source_word: σφόδρα
  choice: gidigidi
  rationale: Ó ń mú agbára ìyàlẹ́nu náà pọ̀ sí i, “gidigidi” sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìwọ̀n tó ga hàn.
- source_word: λέγοντες
  choice: wọ́n sì wí pé
  rationale: Present participle tó ń mú ọ̀rọ̀ tí wọ́n sọ wọlé ni; fífi í ṣe ọ̀rọ̀-ìṣe pípé jẹ́ àdánidá nínú ìtàn Yorùbá.
- source_word: Τίς
  choice: Ta ni
  rationale: Ọ̀rọ̀ ìbéèrè náà ń tọ́ka sí ènìyàn, “Ta ni” sì ni ìtumọ̀ Yorùbá tààrà.
- source_word: ἄρα
  choice: ha
  rationale: Particle ìbéèrè “ha” ń mú ìyàlẹ́nu àti ìparí èrò wọn jáde lẹ́yìn ọ̀rọ̀ Jésù, láìsọ ìtumọ̀ náà di ohun tó le ju ti Gíríìkì lọ.
- source_word: δύναται
  choice: lè
  rationale: Ó ń sọ nípa agbára tàbí ṣíṣeéṣe; “lè” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye.
- source_word: σωθῆναι
  choice: là
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìgbàlà ní ìbámu pẹ̀lú wíwọ inú ìjọba Ọlọ́run. “Là” pa passive sense mọ́ ní Yorùbá láìṣe àlàyé nípa ọ̀nà ìgbàlà.
theological_decisions:
- issue: Ìtumọ̀ σωθῆναι nínú àyíká ọ̀rọ̀ yìí
  choice: là
  alternative: gba ìgbàlà; gba ìdálẹ́kùn
  rationale: Ọ̀rọ̀ tó yí ẹsẹ yìí ká jẹ mọ́ wíwọ inú ìjọba Ọlọ́run àti ìṣòro ọlọ́rọ̀ láti wọ̀ ọ́. “Là” jẹ́ ọ̀rọ̀ ìgbàlà tó ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ tó yẹ, ṣùgbọ́n kò fi ẹ̀kọ́ ẹ̀sìn kan pàtó kún ọ̀nà tí ìgbàlà fi ń ṣẹlẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; “ẹnu yà wọ́n gidigidi” àti “Ta ni ó ha lè là?” jẹ́ ọ̀rọ̀ Yorùbá tó ṣàn dáadáa, tí ó sì pa agbára àti ìbéèrè Gíríìkì mọ́.
