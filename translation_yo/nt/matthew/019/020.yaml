  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: yo
  text: Ọ̀dọ́mọkùnrin náà sọ fún un pé, “Mo ti pa gbogbo wọ̀nyí mọ́.[a] Kí ni mo ṣì ṣàìní?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo ti ṣọ́ gbogbo wọ̀nyí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kí ni mo ṣì kù sí?”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: A lo ọ̀rọ̀ ìṣe ìtàn ní ọ̀nà àdánidá Yorùbá; fọ́ọ̀mù yìí kò fi dandan yà àkókò ìsinsìnyí kúrò ní àkókò ìtàn.
- source_word: αὐτῷ
  choice: fún un
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ẹni tí ọ̀rọ̀ náà tọ́ sí lẹ́yìn “sọ” ní Yorùbá.
- source_word: ὁ νεανίσκος
  choice: ọ̀dọ́mọkùnrin náà
  rationale: νεανίσκος túmọ̀ sí ọ̀dọ́mọkùnrin; a kò fi “olórí” kún un, nítorí kò sí nínú ẹsẹ yìí.
- source_word: Πάντα ταῦτα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí gbogbo àwọn àṣẹ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì ṣe kedere ní Yorùbá.
- source_word: ἐφύλαξα
  choice: mo ti pa mọ́
  rationale: “Pa mọ́” lè túmọ̀ sí pípa àṣẹ mọ́ tàbí ṣíṣe ohun tí àṣẹ béèrè; “ti” mú ìṣe àtijọ́ tó ní ìbáṣepọ̀ pẹ̀lú ìsinsìnyí jáde lọ́nà àdánidá.
- source_word: τί
  choice: kí ni
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ fún ìbéèrè tààrà “kí ni?”
- source_word: ἔτι
  choice: ṣì
  rationale: “Ṣì” fi ìtumọ̀ ohun tó kù tàbí tó ń bá a lọ hàn.
- source_word: ὑστερῶ
  choice: mo kù sí
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ àìpé tàbí ohun tí ó ṣì kù mọ́, láì pinnu bóyá ohun-ìní, ìwà, tàbí ìgbọràn ni.
theological_decisions:
- issue: Ìdájọ́ ọ̀dọ́mọkùnrin náà nípa ìgbọràn ara rẹ̀
  choice: A gbé ọ̀rọ̀ rẹ̀ kalẹ̀ gẹ́gẹ́ bí ẹ̀sùn tí òun fúnra rẹ̀ sọ pé òun ti pa gbogbo àwọn àṣẹ náà mọ́, láì fi àmì ìtẹ́wọ́gbà tàbí ẹ̀gàn sí i.
  alternative: A lè túmọ̀ ọ́ bí ẹ̀sùn tó jẹ́ òótọ́ lọ́kàn rẹ̀ ṣùgbọ́n tó ṣìnà, tàbí bí àṣejù ọ̀rọ̀.
  rationale: Gíríìkì sọ ẹ̀sùn náà ní tààrà; ìtumọ̀ kò gbọ́dọ̀ dá ìbéèrè ẹ̀kọ́ ìgbàgbọ́ nípa bóyá ẹ̀sùn náà tọ́ sílẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Ọ̀dọ́mọkùnrin” jẹ́ àdánidá ju “ọ̀dọ́” lọ, “pa àṣẹ mọ́” sì jẹ́ àsọyé tó mọ́gbọ́n dání fún ìgbọràn sí àṣẹ.
