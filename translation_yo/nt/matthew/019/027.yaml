id: MAT.19.27
reference: Matthew 19:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: yo
  text: Nígbà náà ni Peteru dá a lóhùn pé, “Wò ó, àwa ti fi ohun gbogbo sílẹ̀, a sì ti tọ̀ ọ́ lẹ́yìn. Kí ni yóò ha wà fún wa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti pe àfiyèsí sí ohun tí olùsọ fẹ́ tẹnumọ́; ó bá ‘kíyèsí i’ mu, ṣùgbọ́n ó wọ́pọ̀ sí i nínú ọ̀rọ̀ òde òní.
- source_word: ἀφήκαμεν πάντα
  choice: àwa ti fi ohun gbogbo sílẹ̀
  rationale: Ó fi ìtumọ̀ pípa ohun gbogbo tì tàbí fífi í sílẹ̀ hàn, ó sì pa tẹnumọ́ arọ́pò-orúkọ ἡμεῖς mọ́ nípasẹ̀ ‘àwa.’
- source_word: ἠκολουθήσαμέν σοι
  choice: a sì ti tọ̀ ọ́ lẹ́yìn
  rationale: ‘Tọ ẹnì kan lẹ́yìn’ jẹ́ ọ̀nà Yorùbá àdánidá fún ṣíṣe ọmọlẹ́yìn; àkókò pípé náà bá ìṣe tí wọ́n ti bẹ̀rẹ̀ mu.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Kí ni yóò ha wà fún wa?
  rationale: ‘Ha’ gbé ìtumọ̀ ἄρα jáde gẹ́gẹ́ bí ìbéèrè àbájáde—níwọ̀n bí èyí ti rí bẹ́ẹ̀, kí ni yóò jẹ́ tiwa—láìfi èrè tàbí ẹ̀san kún ohun tí Gíríìkì kò sọ ní tààrà.
theological_decisions:
- issue: Bóyá a ó tú ohun tí yóò ‘wà fún wa’ sí ‘èrè’ tàbí ‘ẹ̀san’
  choice: 'Pa ọ̀rọ̀ náà mọ́ ní àìsọ pàtó: “Kí ni yóò ha wà fún wa?”'
  alternative: “Kí ni ẹ̀san wa yóò jẹ́?”
  rationale: Gíríìkì sọ ἔσται ἡμῖν ní gbólóhùn gbòòrò, kì í sì í lo ọ̀rọ̀ pàtó fún ‘ẹ̀san.’ Ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí ọrọ̀ orísun fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní èdè ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. ‘Wò ó’ jẹ́ àṣẹ ẹyọ ẹni kejì, ‘tọ̀ ọ́ lẹ́yìn’ sì yàgò fún ìṣòro ìkójọpọ̀ fáwẹ́lì nínú kíkọ.
