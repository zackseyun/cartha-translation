id: MAT.19.6
reference: Matthew 19:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: yo
  text: Nítorí náà, wọn kì í ṣe méjì mọ́, bí kò ṣe ara kan. Nítorí náà, ohun tí Ọlọ́run ti so pọ̀, kí ènìyàn[a] má ṣe yà á sọ́tọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ènìyàn” níbí túmọ̀ sí ẹ̀dá ènìyàn kankan; kì í ṣe ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tí ó ṣáájú hàn ní ọ̀nà tí ó ṣe déédéé, tí ó sì bójú mu ní Yorùbá.
- source_word: οὐκέτι εἰσὶν δύο
  choice: wọn kì í ṣe méjì mọ́
  rationale: Ó pa ìtumọ̀ ìyípadà ipò tí οὐκέτι ní mọ́, ó sì mú ìyàtọ̀ láàárín ‘méjì’ àti ‘ara kan’ dúró.
- source_word: σὰρξ μία
  choice: ara kan
  rationale: ‘Ara kan’ jẹ́ ọ̀rọ̀ àdáyébá ní Yorùbá fún ìṣọ̀kan ìgbéyàwó, ó sì pa ìtẹnumọ́ àti ìtọ́kasí sí Gẹnẹsisi mọ́ láì tú u sí ìtumọ̀ ẹ̀kọ́ mìíràn.
- source_word: ὃ οὖν
  choice: Nítorí náà, ohun tí
  rationale: ‘Ohun tí’ ń tọ́ka sí ìṣọ̀kan tí Ọlọ́run dá sílẹ̀, ‘Nítorí náà’ sì mú agbára ìparí èrò οὖν jáde.
- source_word: συνέζευξεν
  choice: ti so pọ̀
  rationale: Ó sọ ìṣe pípẹ̀lú àwọn méjèèjì di ọ̀kan ní ọ̀nà àdáyébá, ó sì ní ìfarahàn àwòrán sísopọ̀ tí ọ̀rọ̀ Gíríìkì náà ní.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: Nínú Gíríìkì, ọ̀rọ̀ náà jẹ́ ẹyọ ọ̀rọ̀ tí ó dúró fún ẹ̀dá ènìyàn lápapọ̀. ‘Ènìyàn’ ni ó ṣàfihàn ìtumọ̀ gbogbogbò yìí ní kedere láì sọ pé ọkùnrin nìkan ni.
- source_word: μὴ χωριζέτω
  choice: kí ènìyàn má ṣe yà á sọ́tọ̀
  rationale: Ìkọ̀lé ‘kí ... má ṣe’ ń gbé agbára àṣẹ ìdènà náà jáde ní Yorùbá òde òní; ‘yà á sọ́tọ̀’ sì bá ìtumọ̀ yíyà ohun tí a so pọ̀ mu.
theological_decisions:
- issue: Ìtumọ̀ gbogbogbò ti ἄνθρωπος nínú ìdènà nípa ìgbéyàwó
  choice: ènìyàn
  alternative: ọkùnrin; ẹnikẹ́ni
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ ọ̀rọ̀ tí ó ní ìtumọ̀ aṣojú gbogbo ẹ̀dá ènìyàn. ‘Ènìyàn’ pa iye ẹyọ náà mọ́, ó sì jẹ́ kí ìdènà náà kan gbogbo ènìyàn bí orísun ṣe sọ.
- issue: Èdè ìṣọ̀kan ìgbéyàwó σὰρξ μία tí ó ń ṣe ìrántí Gẹnẹsisi
  choice: ara kan
  alternative: ẹran ara kan; ara kan ṣoṣo
  rationale: ‘Ara kan’ jẹ́ èdè Yorùbá tí ó ṣe kedere, tí ó sì pa ìsopọ̀ pẹ̀lú ọ̀rọ̀ ìṣẹ̀dá mọ́. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. Àṣẹ ìdènà náà lágbára ṣùgbọ́n kò ní èdè àtijọ́ tí ó le fún òǹkàwé òde òní.
