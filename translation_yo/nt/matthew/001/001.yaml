source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: yo
  text: Ìwé ìtàn ìran[a] Jésù Mèsáyà[b], ọmọ Dáfídì, ọmọ Ábúráhámù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ìwé ìpilẹ̀ṣẹ̀” tàbí “Ìwé ìbí.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ “ìpilẹ̀ṣẹ̀” tó gbòòrò, bí ó tilẹ̀ jẹ́ pé “ìtàn ìran” bá àtòjọ ìran tó tẹ̀ lé mu jù lọ.
    reason: alternative_reading
  - marker: b
    text: A tún lè pe “Mèsáyà” ní “Kristi.” Χριστός jẹ́ oyè tó túmọ̀ sí ẹni tí a fòróró yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Ìwé
  rationale: Βίβλος túmọ̀ sí ìwé tàbí àkọsílẹ̀; níbí ó ṣiṣẹ́ gẹ́gẹ́ bí àkọlé, “Ìwé” sì pa ìforúkọsílẹ̀ ọlọ́lá náà mọ́.
- source_word: γενέσεως
  choice: ìtàn ìran
  rationale: γένεσις lè túmọ̀ sí ìpilẹ̀ṣẹ̀, ìbí, tàbí ìtàn ìran. Àtòjọ àwọn baba ńlá tó tẹ̀ lé mú kí “ìtàn ìran” jẹ́ yíyan tó bá ọ̀rọ̀ yìí mu jù lọ, láìfi ìtumọ̀ tó gbòòrò sí i pamọ́.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A lo irú orúkọ tí ó wọ́pọ̀ nínú Yorùbá fún Ἰησοῦ.
- source_word: χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; “Mèsáyà” fi ipò ọba àti ìlérí Júù tó wà nínú oyè náà hàn kedere ju lílo “Kristi” bí ẹni pé ó jẹ́ orúkọ ìdílé lọ.
- source_word: υἱοῦ Δαυὶδ
  choice: ọmọ Dáfídì
  rationale: υἱός túmọ̀ ní tààrà sí “ọmọ,” ṣùgbọ́n ó tún lè tọ́ka sí àtọmọdọ́mọ. “Ọmọ Dáfídì” pa ìtumọ̀ ìran àti oyè Mèsáyà tó ní í ṣe pẹ̀lú ìjọba Dáfídì mọ́.
- source_word: υἱοῦ Ἀβραάμ
  choice: ọmọ Ábúráhámù
  rationale: “Ọmọ Ábúráhámù” pa àsopọ̀ ìran àti májẹ̀mú mọ́; nínú àyíká yìí, “ọmọ” ní ìtumọ̀ àtọmọdọ́mọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹsẹ̀ yìí, ọ̀rọ̀ náà ṣiṣẹ́ gẹ́gẹ́ bí oyè Jésù, kì í ṣe orúkọ ìdílé. “Mèsáyà” pa ìtumọ̀ ‘ẹni tí a fòróró yàn’ àti ìrètí ọba tí a ṣèlérí mọ́.
- issue: Ìtumọ̀ γενέσεως nínú àkọlé
  choice: ìtàn ìran
  alternative: ìpilẹ̀ṣẹ̀ tàbí ìbí
  rationale: Àtòjọ ìran tó tẹ̀ lé jẹ́ kí “ìtàn ìran” bá àyíká mu jù lọ; síbẹ̀, ọ̀rọ̀ Gíríìkì náà lè ní ìró ìpilẹ̀ṣẹ̀ tàbí ìbí, a sì pa àìdánilójú yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá ìlò àdánidá mu. Èdè náà rọrùn, ó níyì, ó sì pa ìṣètò àkọlé Gíríìkì àti àsopọ̀ ìran mọ́.
