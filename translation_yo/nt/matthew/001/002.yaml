id: MAT.1.2
reference: Matthew 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: yo
  text: Ábúráhámù bí Ísákì,[a] Ísákì sì bí Jákọ́bù, Jákọ́bù sì bí Júdà àti àwọn arákùnrin rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ábúráhámù ni baba Ísákì.” Ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ “di baba fún” nínú àtòjọ ìran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú ìtàn ìran, ọ̀rọ̀ yìí túmọ̀ sí pé ọkùnrin kan ni baba ẹni tí a dárúkọ. “Bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì bá àtòjọ ìran mu láì fi dandan sọ pé kò sí ìran kankan láàárín wọn.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ kì í fi ìtakora hàn; ó ń so ìpele kọ̀ọ̀kan nínú àtòjọ ìran pọ̀. “Sì” jẹ́ àsopọ̀ àdánidá ní Yorùbá.
- source_word: Ἰούδαν
  choice: Júdà
  rationale: Orúkọ yìí ń tọ́ka sí Júdà, ọmọ Jákọ́bù àti baba ńlá ẹ̀yà Júdà, kì í ṣe Júdásì ti Májẹ̀mú Tuntun.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ níhìn-ín, ó sì ń tọ́ka sí àwọn ọmọkùnrin Jákọ́bù yòókù; nítorí náà “àwọn arákùnrin rẹ̀” péye ju ọ̀rọ̀ tó lè ní àwọn arábìnrin nínú lọ.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: Ábúráhámù / Ísákì / Jákọ́bù
  rationale: A lo àwọn ìrísí orúkọ Bíbélì tí ó wọ́pọ̀, tí ó sì ṣe déédé ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ ìbímọ̀ nínú àtòjọ ìran
  choice: Lo “bí” ní gbogbo ẹsẹ yìí
  alternative: Lo gbólóhùn gígùn bí “di baba fún” tàbí “ni baba”
  rationale: “Bí” pa agbára ìran baba mọ́, ó sì jẹ́ Yorùbá àdánidá. Kò tún pinnu láìnídìí pé ẹni tí a dárúkọ jẹ́ ọmọ tààrà láìsí ìran kankan láàárín wọn.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “sì” láti mú kí àtòjọ náà ṣàn lọ́nà àdánidá, a sì fi àmì ohùn sí ibi tí ó yẹ.
