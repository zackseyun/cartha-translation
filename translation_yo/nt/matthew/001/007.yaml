id: MAT.1.7
reference: Matthew 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: yo
  text: Sólómọ́n sì bí Rèhóbóámù, Rèhóbóámù sì bí Ábíjà, Ábíjà sì bí Ásáfù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ka a sí “Ásà,” gẹ́gẹ́ bí orúkọ ọba Júdà tí a mẹ́nu kàn nínú 1 Àwọn Ọba 15 àti 2 Kíróníkà 14–16; ṣùgbọ́n Ἀσάφ (“Ásáfù”) ni ọ̀rọ̀ Gíríìkì níhìn-ín ka.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú ìtàn ìran, ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ baba tàbí baba ńlá ẹni nínú ìlà ìran. “Bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìṣètò ìtàn ìran mu láìfi ọ̀rọ̀ kún un.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ kì í fi ìtakora hàn; ó ń so ìpele kọ̀ọ̀kan nínú ìtẹ̀síwájú ìran pọ̀. “Sì” ni asopọ̀ Yorùbá tó bá a mu.
- source_word: Σολομών
  choice: Sólómọ́n
  rationale: Àkọsílẹ̀ orúkọ náà ní ìrísí Yorùbá tí a mọ̀, pẹ̀lú àmì ohùn.
- source_word: Ῥοβοάμ
  choice: Rèhóbóámù
  rationale: Ìkọ̀wé orúkọ náà ní ìrísí Yorùbá tó ṣeé pè ní ti ẹ̀dá.
- source_word: Ἀβιά
  choice: Ábíjà
  rationale: Ìrísí Yorùbá tí a mọ̀ fún orúkọ ọba náà ni a lò, dípò títẹ̀lé ìró Gíríìkì ní tààràtà.
- source_word: Ἀσάφ
  choice: Ásáfù
  rationale: A tẹ̀lé ọ̀rọ̀ inú ẹ̀dà Gíríìkì tí a pèsè, Ἀσάφ, a kò sì yí i padà láti mú un bá àkọsílẹ̀ àwọn ọba inú Májẹ̀mú Láéláé mu.
theological_decisions:
- issue: Bóyá kí a mú orúkọ inú ìtàn ìran Mátíù bá àkọsílẹ̀ ọba Májẹ̀mú Láéláé mu nípa títúmọ̀ Ἀσάφ sí “Ásà.”
  choice: A fi “Ásáfù” sí ọ̀rọ̀ àkọ́kọ́.
  alternative: Àwọn àfọwọ́kọ kan ní “Ásà,” orúkọ ọba Júdà.
  rationale: Ẹ̀dà Gíríìkì tí a yàn gẹ́gẹ́ bí orísun ní Ἀσάφ. Nítorí náà, a pa ìka rẹ̀ mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì ṣàlàyé ìka mìíràn ní àlàyé ìsàlẹ̀ láìfi tipátipá mú àwọn àkọsílẹ̀ náà dọ́gba.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnṣe “X sì bí Y” jẹ́ kúkúrú, ó ṣeé lóye, ó sì bá ìṣètò ìtàn ìran mu. A gbe àmì [a] lẹ́yìn “Ásáfù,” nítorí ibẹ̀ gan-an ni ìyàtọ̀ àfọwọ́kọ náà kàn.
