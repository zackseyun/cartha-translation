id: MAT.1.3
reference: Matthew 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: yo
  text: Júdà sì bí Pérésì àti Sérà nípasẹ̀ Támárì; Pérésì bí Hésírónì, Hésírónì sì bí Árámù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ Gẹ̀ẹ́sì kan ní “Rámù” níbí, gẹ́gẹ́ bí ọ̀nà mìíràn tí wọ́n gbà kọ orúkọ náà tàbí àṣà tí wọ́n tẹ̀ lé; ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí ní “Árámù.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Júdà
  rationale: Orúkọ yìí tọ́ka sí baba ńlá àti ẹ̀yà Júdà nínú Ìwé Mímọ́; fọ́ọ̀mù Yorùbá yìí mú kí ìbámu pẹ̀lú Májẹ̀mú Láéláé hàn kedere.
- source_word: δὲ
  choice: sì
  rationale: Ní ìtàn ìran yìí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò fi ìtakò hàn; “sì” bá ìṣàn èdè Yorùbá mu.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú àkọsílẹ̀ ìran, ọ̀rọ̀ náà túmọ̀ sí pé ọkùnrin náà ni baba ẹni tí a dárúkọ; “bí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì rọrùn láti kà nínú irú àkọsílẹ̀ bẹ́ẹ̀.
- source_word: Φαρὲς
  choice: Pérésì
  rationale: Ìkọ̀wé orúkọ yìí tẹ̀ lé fọ́ọ̀mù Hébérù פֶּרֶץ, ó sì ń mú ìbámu àwọn orúkọ inú Májẹ̀mú Láéláé àti Májẹ̀mú Tuntun dúró.
- source_word: Ζάρα
  choice: Sérà
  rationale: Ìkọ̀wé Yorùbá yìí dúró fún orúkọ Hébérù זֶרַח, dípò kí a kan fara wé ìrísí Gíríìkì.
- source_word: ἐκ τῆς Θαμάρ
  choice: láti ara Támárì
  rationale: Gbólóhùn yìí sọ ìpilẹ̀ ọmọ láti ọ̀dọ̀ ìyá rẹ̀ ní kedere, ó sì pa àkíyèsí pàtàkì tí Mátíù ṣe sí Támárì mọ́.
- source_word: Ἑσρώμ
  choice: Hésírónì
  rationale: Fọ́ọ̀mù yìí bá orúkọ Hébérù חֶצְרוֹן mu, ó sì ṣe ìbámu pẹ̀lú ìtàn ìran inú Májẹ̀mú Láéláé.
- source_word: Ἀράμ
  choice: Árámù
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè jẹ́ Ἀράμ; nítorí náà, a túmọ̀ orúkọ náà ní tààràtà, láì yí i padà sí “Rámù” nítorí àṣà ìtumọ̀ kan.
theological_decisions:
- issue: Bóyá kí a mú orúkọ ìkẹyìn bá “Rámù” tí ó wọ́pọ̀ nínú àwọn àkọsílẹ̀ ìran mìíràn mu
  choice: Árámù
  alternative: Rámù
  rationale: Ẹ̀dà Gíríìkì SBLGNT tí a fi ṣe orísun ní Ἀράμ. A tẹ̀ lé ẹ̀rí ọ̀rọ̀ orísun, a kò sì fi ipá mú un bá àṣà ìtumọ̀ tàbí àkọsílẹ̀ ìran mìíràn mu; akọsilẹ̀ ìsàlẹ̀ fi fọ́ọ̀mù kejì pamọ́ fún àyẹ̀wò.
translation_notes:
  register: A lo Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe orúkọ tẹ̀ lé ìbámu pẹ̀lú àwọn orúkọ Hébérù níbi tí ó yẹ, ṣùgbọ́n “Árámù” tẹ̀ lé ọ̀rọ̀ Gíríìkì tí a pèsè ní tààràtà. A fi àmì akọsilẹ̀ [a] sí orúkọ tí akọsilẹ̀ náà ń ṣàlàyé.
