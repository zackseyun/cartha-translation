  verdict: revise
  source_fidelity: Àpẹẹrẹ ìtẹ̀síwájú ìran náà àti àsopọ̀ δέ ni a ti pa mọ́ dáadáa pẹ̀lú “sì ... bí ...”. Ṣùgbọ́n Ùsáyà jẹ́ orúkọ tí ó lè dá ìdàpọ̀ pọ̀ mọ́ Aísáyà, kì í sì í ṣe ìrísí Yorùbá tí ó wọ́pọ̀ fún Ὀζίας/Uzziah. A tún ṣe ìtọ́kasí orúkọ Hesekáyà sí Hẹsekiah, ìrísí Yorùbá ìbílẹ̀ tí ó bá ọba náà mu.
