id: MAT.1.9
reference: Matthew 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: yo
  text: Ussiah sì bí Jotamu[a], Jotamu sì bí Ahasi, Ahasi sì bí Hẹsekiah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἐγέννησεν ni a sábà máa ń túmọ̀ sí “bí” tàbí “jẹ́ baba fún”; nínú àtòjọ ìran yìí, a lò “bí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Ùsáyà
  rationale: A lo orúkọ Yorùbá tí a mọ̀ fún ọba Júdà yìí, dípò kí a ṣe àdàkọ ìró Gíríìkì náà ní tààràtà.
- source_word: δὲ
  choice: sì
  rationale: Nínú àtòjọ ìran yìí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń mú ìtàn tẹ̀ síwájú; “sì” bá àtúnṣe ọ̀rọ̀ náà mu ní Yorùbá.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú ìtàn ìdílé Yorùbá, “bí” jẹ́ ọ̀rọ̀ kúkúrú, àdánidá, tí ó sì bójú mu fún ìran tí baba mú wá; ó tún pa ìlù àtúnṣe ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Ἰωαθάμ
  choice: Jótámù
  rationale: A lo irú orúkọ Yorùbá tí ó bá ọba Júdà tí a mọ̀ nínú Májẹ̀mú Láéláé mu.
- source_word: Ἀχάζ
  choice: Áhásì
  rationale: A lo irú orúkọ Yorùbá tí ó wọ́pọ̀ fún ọba Júdà yìí, dípò àdàkọ ìró Gíríìkì péré.
- source_word: Ἑζεκίαν
  choice: Hesekáyà
  rationale: A lo irú orúkọ Yorùbá tí a mọ̀ fún ọba Júdà yìí nínú Májẹ̀mú Láéláé.
theological_decisions:
- issue: Ìtumọ̀ γεννάω nínú àtòjọ ìran
  choice: A túmọ̀ rẹ̀ sí “bí,” gẹ́gẹ́ bí ìtẹ̀síwájú ìran láti ọ̀dọ̀ baba.
  alternative: jẹ́ baba fún; jẹ́ baba ńlá ìran fún
  rationale: Ọ̀rọ̀ Mátíù gbé ìtẹ̀síwájú ìran baba kalẹ̀ ní tààràtà, ó sì tún gbólóhùn kan náà ṣe. “Bí” pa ìtumọ̀ àti ìlù yẹn mọ́ láì fi ìtumọ̀ “baba ńlá ìran” kún ohun tí ẹsẹ yìí sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tí ó ní iyì, ó sì rọrùn láti lóye. A pa àtúnṣe “X sì bí Y” mọ́ láti fara mọ́ ìṣètò àti ìlù ọ̀rọ̀ Gíríìkì. A fi àmì ohùn sí orúkọ àti ọ̀rọ̀ níbi tí ó ti yẹ.
