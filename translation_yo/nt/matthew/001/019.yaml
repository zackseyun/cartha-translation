id: MAT.1.19
reference: Matthew 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: yo
  text: Jósẹ́fù, ọkọ rẹ̀[a], ẹni tí ó jẹ́ olódodo, tí kò sì fẹ́ fi í sí ìtìjú ní gbangba[b], pinnu láti kọ̀ ọ́ sílẹ̀ ní ìkọ̀kọ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àfẹ́sọ́nà rẹ̀.” Gíríìkì ní “ọkùnrin/ọkọ rẹ̀,” èyí tó fi agbára òfin ìfẹ́sọ́nà Júù hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sọ ọ́ di àpẹẹrẹ” tàbí “dójú tì í ní gbangba.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “rán an lọ ní ìkọ̀kọ̀.” Nínú àyíká yìí, ó ń tọ́ka sí ìkọ̀sílẹ̀ lábẹ́ òfin ní àkókò ìfẹ́sọ́nà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: ọkọ rẹ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘ọkùnrin rẹ̀’ tàbí ‘ọkọ rẹ̀.’ Nínú àyíká yìí, ìfẹ́sọ́nà Júù ní agbára òfin, ìgbésẹ̀ láti tú u ká sì ni a ń sọ; ‘ọkọ rẹ̀’ ni Yorùbá àdánidá tó mú ìbáṣepọ̀ òfin náà hàn.
- source_word: δίκαιος
  choice: olódodo
  rationale: ‘Olódodo’ pa ìtumọ̀ ìwà títọ́ níwájú Ọlọ́run àti ènìyàn mọ́, láìfi dandan pinnu bóyá títẹ̀lé òfin tàbí àánú ni a tẹnumọ́ jù.
- source_word: δειγματίσαι
  choice: fi í hàn sí ìtìjú ní gbangba
  rationale: Gbólóhùn yìí mú èrò fífi ènìyàn hàn ní gbangba pẹ̀lú ìtìjú tó tẹ̀ lé e jáde, láìsọ ìjìyà kan pàtó tí Gíríìkì kò sọ.
- source_word: ἐβουλήθη
  choice: pinnu
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ète tàbí ìpinnu tí a ti ronú lé lórí; ‘pinnu’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
- source_word: λάθρᾳ
  choice: ní ìkọ̀kọ̀
  rationale: Ó túmọ̀ sí ṣíṣe ohun ní ọ̀nà àṣírí tàbí ní ìdákẹ́jẹ, láìsọ ọ́ di gbangba.
- source_word: ἀπολῦσαι
  choice: kọ̀ ọ́ sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìgbéyàwó, ‘kọ aya sílẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìkọ̀sílẹ̀, ó sì mú agbára òfin inú àyíká náà hàn ju ‘rán an lọ’ lọ.
- source_word: δὲ
  choice: a fi ìtẹ̀síwájú ìtàn hàn nípasẹ̀ ìṣètò gbólóhùn
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn síwájú; Yorùbá kò nílò kí a túmọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀ ọ̀tọ̀ níbí.
- source_word: ὢν καὶ μὴ θέλων
  choice: ẹni tí ó jẹ́ ... tí kò sì fẹ́
  rationale: Ìṣètò yìí pa àwọn participle Gíríìkì mọ́ gẹ́gẹ́ bí àlàyé abẹ́lẹ̀ fún ìpinnu Jósẹ́fù, ó sì jẹ́ Yorùbá tó ń ṣàn dáadáa.
theological_decisions:
- issue: Ìtumọ̀ δίκαιος nípa ìwà Jósẹ́fù
  choice: A lò ‘olódodo’ láìsọ bóyá pípa òfin mọ́, àánú, tàbí àwọn méjèèjì ni ọ̀rọ̀ náà túmọ̀ sí ní pàtó.
  alternative: A lè lò àlàyé tó tẹnumọ́ pé ó ń pa òfin mọ́ tàbí pé ó ṣàánú Màríà.
  rationale: Gíríìkì pe Jósẹ́fù ní δίκαιος, ó sì so èyí mọ́ àìfẹ́ rẹ̀ láti dójú ti Màríà ní gbangba. Ìtumọ̀ náà pa ìdọ́gba àti ìfàṣẹ́yìn tó wà láàárín ìwà títọ́ àti àánú mọ́.
- issue: Ipò òfin ìbáṣepọ̀ Jósẹ́fù àti Màríà
  choice: A lò ‘ọkọ rẹ̀’ àti ‘kọ̀ ọ́ sílẹ̀.’
  alternative: ‘Àfẹ́sọ́nà rẹ̀’ àti ‘já ìfẹ́sọ́nà náà,’ tàbí ‘ọkùnrin rẹ̀’ àti ‘rán an lọ.’
  rationale: Ìfẹ́sọ́nà Júù nígbà náà jẹ́ ìdè òfin tí ìtúsílẹ̀ rẹ̀ nílò ìkọ̀sílẹ̀. Àwọn ọ̀rọ̀ inú àyọkà mú èyí yé òǹkàwé òde òní, àwọn àṣàyàn mìíràn sì wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A yàgò fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan àti fún àlàyé tó lè fòpin sí àìdájú inú Gíríìkì.
