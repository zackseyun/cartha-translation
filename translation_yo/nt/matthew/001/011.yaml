source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: yo
  text: Josáyà sì bí Jẹkoníà àti àwọn arákùnrin rẹ̀ ní àkókò ìkólọ àwọn ènìyàn lọ sí Bábílónì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò ìgbèkùn sí Bábílónì.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkó àwọn ènìyàn kúrò ní ilẹ̀ wọn ní tipátipá tàbí sí ìgbèkùn; “ìkólọ àwọn ènìyàn lọ” tẹnu mọ́ pé kì í ṣe pé wọ́n fi ìfẹ́ ara wọn lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú ìtàn ìran yìí, γεννάω ń tọ́ka sí jíjẹ́ baba nínú ìlà ìran. “Bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì bá àgbékalẹ̀ ìtàn ìran mu; kò fipá pinnu bóyá gbogbo ìsopọ̀ jẹ́ ti baba àti ọmọ lẹ́sẹ̀kẹsẹ̀.
- source_word: Ἰεχονίαν
  choice: Jẹkoníà
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìlànà ìkọ̀wé Yorùbá, pẹ̀lú àmì ohùn tó bá bí a ṣe ń pè é mu.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, ó sì ń tọ́ka sí àwọn arákùnrin ọkùnrin rẹ̀, kì í ṣe gbogbo ọmọ ìyá tàbí ọmọ baba láìka akọ tàbí abo.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: ní àkókò tí a kó àwọn ènìyàn lọ sí Bábílónì
  rationale: ἐπί pẹ̀lú ẹ̀ka genitive níbí jẹ́ àmì àkókò. μετοικεσία túmọ̀ sí kíkó ènìyàn kúrò ní ilẹ̀ wọn, pàápàá ní tipátipá; gbolohun yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì fi ìṣẹ̀lẹ̀ àti ibi tí wọ́n kó wọn lọ hàn.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ nínú àtòjọ ìran; “sì” ń so ẹsẹ yìí mọ́ ohun tó ṣáájú lọ́nà àdánidá.
theological_decisions:
- issue: Ìkékúrú àwọn ìran nínú ìlà ìdílé Mátíù
  choice: Túmọ̀ àlàyé ìran gẹ́gẹ́ bí Gíríìkì ṣe gbé e kalẹ̀, láìṣe àlàyé ìbámu ìtàn sínú ọ̀rọ̀ ẹsẹ náà.
  alternative: Ka γεννάω sí jíjẹ́ baba ńlá tàbí ẹni tó ṣáájú nínú ìran, dípò baba ọmọ lẹ́sẹ̀kẹsẹ̀ ní gbogbo ibi.
  rationale: Àwọn ìtàn ìran lè fo àwọn ìran kan, ṣùgbọ́n ìtumọ̀ gbọ́dọ̀ pa ọ̀nà tí orísun gbà sọ̀rọ̀ mọ́, kí ó má sì yanjú ìṣòro ìtàn ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní. A lo “bí” gẹ́gẹ́ bí àṣà Yorùbá nínú ìtàn ìran, “a kó àwọn ènìyàn lọ” sì sọ ipá tó wà nínú μετοικεσία di mímọ̀ láìdi ọ̀rọ̀ náà mọ́ ìtumọ̀ kan ṣoṣo.
