id: MAT.1.20
reference: Matthew 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: yo
  text: Ṣùgbọ́n bí ó ti ń ronú lórí nǹkan wọ̀nyí, kíyèsí i, angẹli kan ti Olúwa farahàn sí i lójú àlá, ó ní, “Jósẹ́fù, ọmọ Dáfídì, má bẹ̀rù láti mú Màríà aya rẹ wọlé,[a] nítorí ọmọ tí ó wà nínú rẹ̀ ti ọ̀dọ̀ Ẹ̀mí Mímọ́ wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “láti gba Màríà gẹ́gẹ́ bí aya rẹ.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí mímú un wọ ilé Jósẹ́fù nínú ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: bí ó ti ń ronú lórí
  rationale: Ó fi hàn pé Jósẹ́fù ṣì ń gbé ọ̀ràn náà yẹ̀ wò nínú ọkàn rẹ̀; kò sọ pé ó ti ṣe ìpinnu tán.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: A pa àmì ìtẹnumọ́ àti ìyípadà òjijì nínú ìtàn mọ́ ní ọ̀nà Yorùbá tí ó bójú mu.
- source_word: ἄγγελος κυρίου
  choice: angẹli Olúwa kan
  rationale: Àìsí article níwájú ἄγγελος fara hàn nínú “kan,” láìsọ ọ́ di angẹli pàtó kan tí Gíríìkì kò fi dandan tọ́ka sí.
- source_word: κατ’ ὄναρ
  choice: lójú àlá
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìfarahàn tí ó ṣẹlẹ̀ nínú àlá.
- source_word: ἐφάνη
  choice: farahàn án
  rationale: Ó mú ìtumọ̀ ìfarahàn hàn kedere, pẹ̀lú Jósẹ́fù gẹ́gẹ́ bí ẹni tí angẹli náà farahàn sí.
- source_word: υἱὸς Δαυίδ
  choice: ọmọ Dáfídì
  rationale: Ó pa ìbátan ìran Dáfídì àti ìró ìlérí Mèsáyà mọ́.
- source_word: μὴ φοβηθῇς
  choice: má bẹ̀rù
  rationale: Àṣẹ ìdènà yìí jẹ́ kúkúrú, àdánidá, ó sì pa ìtumọ̀ ìbẹ̀rù mọ́.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: láti mú Màríà aya rẹ wọlé
  rationale: “Mú ... wọlé” ṣàlàyé gbígba Màríà sínú ilé rẹ̀ nínú ìgbéyàwó, nígbà tí “aya rẹ” pa ipò ìbáṣepọ̀ tí Gíríìkì sọ mọ́.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: ọmọ tí ó wà nínú rẹ̀
  rationale: Yorùbá àdánidá ń sọ ọmọ inú oyún ní tààrà; yíyan “ọmọ” mú ipò inú oyún náà yé kedere, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo participle aláìlẹ́ni neuter.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: ti ọ̀dọ̀ Ẹ̀mí Mímọ́ wá
  rationale: “Ti ọ̀dọ̀ ... wá” fi orísun tí ἐκ ń tọ́ka sí hàn kedere, láì sọ Ẹ̀mí Mímọ́ di agbára aláìlẹ́ni.
theological_decisions:
- issue: Ìtumọ̀ κυρίου nínú ἄγγελος κυρίου
  choice: Olúwa
  alternative: Jèhófà tàbí YHWH
  rationale: “Olúwa” túmọ̀ κύριος ní tààrà, kò sì fi ìdánimọ̀ teofani Májẹ̀mú Láéláé kan lé ẹsẹ̀ náà lórí.
- issue: Ẹni tí πνεύματός ... ἁγίου ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: agbára Ẹ̀mí Mímọ́ tàbí ẹ̀mí mímọ́ kan
  rationale: Nínú ìtàn ìbí Mátíù, gbólóhùn náà tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí orísun oyún náà, kì í ṣe ẹ̀mí àìlẹ́ni kan tàbí agbára lásán.
- issue: Bí a ṣe sọ ipò Màríà nígbà tí Jósẹ́fù yóò gbà á
  choice: aya rẹ
  alternative: gẹ́gẹ́ bí aya rẹ
  rationale: Gíríìkì pè Màríà ní “aya rẹ” ní tààrà. A kò fi “gẹ́gẹ́ bí” sínú ọ̀rọ̀ àkọ́kọ́, kí a má bàa dá àyípadà ipò tuntun kan tí ẹsẹ̀ náà kò sọ sílẹ̀.
translation_notes:
  register: Èdè Yorùbá àfẹnusọ tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Kíyèsí i” pa agbára àmì ìtàn ἰδοὺ mọ́; “mú ... wọlé” sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún gbígba aya sínú ilé nínú ìgbéyàwó.
