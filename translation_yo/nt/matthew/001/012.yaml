id: MAT.1.12
reference: Matthew 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: yo
  text: Lẹ́yìn ìkó àwọn ènìyàn lọ sí Bábílónì[a], Jekonia bí Ṣealtieli, Ṣealtieli sì bí Serubbabeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “lẹ́yìn ìgbèkùn sí Bábílónì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí bí a ṣe fi ipá kó àwọn ènìyàn kúrò ní ilẹ̀ wọn lọ sí ìgbèkùn ní Bábílónì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Lẹ́yìn tí
  rationale: μετά pẹ̀lú ọ̀rọ̀-orúkọ ní ipò accusative fi àkókò tí ó tẹ̀ lé ohun kan hàn. δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò pọn dandan láti túmọ̀ lọ́tọ̀ nínú Yorùbá.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: tí a kó àwọn ènìyàn lọ sí Bábílónì
  rationale: μετοικεσία ń tọ́ka sí kíkó àwọn ènìyàn kúrò ní ilẹ̀ wọn lọ sí ìgbèkùn. Èdè yìí mú ipá tí ó wà nínú ìṣẹ̀lẹ̀ náà hàn, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: Ἰεχονίας
  choice: Jekonáyà
  rationale: A lo ìrísí orúkọ tí ó bá ìpè Yorùbá mu, tí ó sì ṣọ́ ìbáṣepọ̀ rẹ̀ pẹ̀lú orúkọ Hébérù.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú àkọsílẹ̀ ìran, “bí” jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì mọ́ láti fi ìtẹ̀síwájú ìran baba hàn. Kò pọn dandan pé kí ó túmọ̀ sí ìbátan baba-ọmọ tí kò ní ìran kankan láàárín.
- source_word: Σαλαθιήλ
  choice: Ṣealitíẹ́lì
  rationale: Ìkọ̀wé orúkọ náà ni a mú bá ìró Yorùbá mu, ní ìbámu pẹ̀lú ìrísí Hébérù tí a mọ̀ sí Shealtiel.
- source_word: δὲ
  choice: sì
  rationale: Nínú gbólóhùn kejì, δέ so ìpele ìran tó tẹ̀ lé e pọ̀ mọ́ ti àkọ́kọ́; “sì” ni àsopọ̀ Yorùbá tó bá a mu dáadáa.
- source_word: Ζοροβαβέλ
  choice: Serubábélì
  rationale: Ìrísí yìí mú orúkọ náà bá ìró àti ìkọ̀wé Yorùbá mu, ó sì jẹ́ èyí tí ó ṣeé dá mọ̀ gẹ́gẹ́ bí Zerubbabel.
theological_decisions:
- issue: Ìtumọ̀ γεννάω nínú àkọsílẹ̀ ìran
  choice: Lo “bí” fún ìtẹ̀síwájú ìran nípasẹ̀ ìlà baba, láìfi dandan mú un pé baba àti ọmọ náà jẹ́ ẹni méjì tí kò sí ìran mìíràn láàárín wọn.
  alternative: “ni baba” tàbí “di baba”
  rationale: Àṣà àkọsílẹ̀ ìran lè lo ọ̀rọ̀ ìbímọ̀ fún ìran ọmọ tàbí àtọmọdọ́mọ. “Bí” pa ìlànà inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá àdánidá láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan gbólóhùn tí ó ṣe kedere ju ọ̀rọ̀ àjèjì bí “ìfipá-ránṣẹ́” lọ, a sì pa àtúnṣe ìran inú Gíríìkì mọ́.
