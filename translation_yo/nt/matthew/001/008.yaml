id: MAT.1.8
reference: Matthew 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: yo
  text: Àsáfù sì bí Jèhóṣáfátì[a], Jèhóṣáfátì sì bí Jórámù, Jórámù sì bí Ùsáyà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “Ásà” dípò “Àsáfù”; “Ásà” náà sì bá orúkọ ọba Jùdà inú àkọsílẹ̀ ìran Májẹ̀mú Láéláé mu.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Àsáfù
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì Ἀσὰφ gẹ́gẹ́ bí ó ṣe wà nínú SBLGNT, láì ṣe àtúnṣe rẹ̀ sí Ásà ní ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ fi ẹ̀rí àfọwọ́kọ àti ìbámu pẹ̀lú ìtàn Májẹ̀mú Láéláé hàn.
- source_word: δὲ
  choice: sì
  rationale: Nínú àkọsílẹ̀ ìran yìí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́, kì í ṣe àmì ìtakora; “sì” jẹ́ ọ̀nà Yorùbá tó bójú mu fún àsopọ̀ tí a tún ń lò ní ẹsẹ náà.
- source_word: ἐγέννησεν
  choice: bí
  rationale: “Bí” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì dúró ṣinṣin fún ìbátan baba sí ọmọ nínú àkọsílẹ̀ ìran; ó yẹra fún gbólóhùn gígùn tàbí ọ̀rọ̀ àtijọ́.
- source_word: Ἰωσαφάτ
  choice: Jèhóṣáfátì
  rationale: Èyí ni ìrísí Yorùbá tí a mọ̀ fún orúkọ ọba Júù yìí, ó sì ń jẹ́ kí ìdánimọ̀ rẹ̀ pẹ̀lú ẹni inú Májẹ̀mú Láéláé ṣe kedere.
- source_word: Ἰωράμ
  choice: Jórámù
  rationale: A tẹ̀lé ìrísí kúkúrú ti Gíríìkì Ἰωράμ, dípò fífi ìrísí Hébérù gígùn sí i.
- source_word: Ὀζίαν
  choice: Ùsáyà
  rationale: A lo ìrísí Yorùbá tí a mọ̀ fún ọba Júù náà, dípò àkọsílẹ̀ Gíríìkì tó sún mọ́ “Osíásì,” kí orúkọ náà lè bá ìdánimọ̀ Májẹ̀mú Láéláé mu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìtẹ̀síwájú àkọsílẹ̀ ìran tí δὲ àti ἐγέννησεν tún ara wọn ṣe
  choice: Pa gbogbo ìsopọ̀ baba sí ọmọ mọ́, kí a sì tún “sì bí” ṣe ní ọ̀nà Yorùbá tó ṣe déédé.
  alternative: Darapọ̀ àwọn gbólóhùn náà pọ̀ sí ọ̀rọ̀ kan tó rọ̀ ju, tàbí lo “ó di baba” lẹ́ẹ̀kọ̀ọ̀kan.
  rationale: Ìtúnṣe “sì bí” pa ìlànà àti ìtẹnumọ́ Gíríìkì mọ́ láì mú kí Yorùbá di líle tàbí àtijọ́.
- issue: Bóyá kí a ṣe Ἀσὰφ ní Ásà nínú ọ̀rọ̀ pàtàkì láti bá àkọsílẹ̀ Májẹ̀mú Láéláé mu
  choice: Pa “Àsáfù” mọ́ nínú ọ̀rọ̀ pàtàkì, kí a sì fi “Ásà” àti ìdí rẹ̀ sínú àlàyé ìsàlẹ̀.
  alternative: Lo “Ásà” nínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí àtúnṣe tó bá ìtàn ìran àwọn ọba Júù mu.
  rationale: SBLGNT tí a fi ṣe orísun ní Ἀσὰφ; fífi í sí ọ̀rọ̀ pàtàkì ń bọ̀wọ̀ fún ẹ̀rí Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ ń pa ìyàtọ̀ àfọwọ́kọ àti ìṣòro ìtàn mọ́ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye. A pa àtúnṣe ìlànà àkọsílẹ̀ ìran mọ́ nípasẹ̀ “sì bí,” a sì lo àwọn ìrísí orúkọ Yorùbá tí wọ́n ṣeé dá mọ̀, láì pa ìyàtọ̀ Ἀσὰφ/Ásà mọ́lẹ̀.
