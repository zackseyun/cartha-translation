id: MAT.1.16
reference: Matthew 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: yo
  text: Jákọ́bù sì bí Jósẹ́fù, ọkọ Màríà. Láti inú Màríà ni a bí Jésù, ẹni tí a ń pè ní Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà, Christos, túmọ̀ sí ẹni tí a fi òróró yàn.
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: “Sì” ń tẹ ìtàn ìran náà síwájú lọ́nà àdánidá, láìfi ìtakò tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú àkọsílẹ̀ ìran, “bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún jíjẹ́ baba ẹni tàbí mímú ìran jáde; ó bá ìlò γεννάω níbí mu.
- source_word: τὸν ἄνδρα Μαρίας
  choice: ọkọ Màríà
  rationale: Níbi tí ἀνήρ ti bá orúkọ Màríà nínú ẹ̀yà olùní yìí, ìtumọ̀ ìbáṣepọ̀ ìgbéyàwó—“ọkọ”—ni ó ṣe kedere.
- source_word: ἐξ ἧς
  choice: ẹni tí a ti inú rẹ̀
  rationale: Gbólóhùn yìí tọ́ka sí Màríà nìkan, gẹ́gẹ́ bí arọ́pò-orúkọ abo ẹyọ kan nínú Gíríìkì ṣe fi hàn; “ti inú rẹ̀” tún pa agbára ἐκ (“láti inú”) mọ́.
- source_word: ἐγεννήθη
  choice: a ... bí
  rationale: Ìṣètò aláìṣe Yorùbá yìí fi ìyípadà láti inú “Jákọ́bù bí Jósẹ́fù” sí bí a ṣe bí Jésù láti inú Màríà hàn, láìsọ pé Jósẹ́fù ni ó bí i.
- source_word: ὁ λεγόμενος
  choice: ẹni tí a ń pè ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ oyè tí a fi ń pe ẹnì kan.
- source_word: χριστός
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ní gbólóhùn yìí, kì í ṣe apá orúkọ bí ẹni pé “Jésù Kristi”; “Mèsáyà” mú ìtumọ̀ oyè ẹni àmìòróró náà jáde.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú gbólóhùn ìdánimọ̀ nípa Jésù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Gbólóhùn ὁ λεγόμενος χριστός fi χριστός hàn gẹ́gẹ́ bí oyè. A túmọ̀ ọ́ sí “Mèsáyà” láti pa iṣẹ́ oyè rẹ̀ mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi “Kristi” hàn gẹ́gẹ́ bí ọ̀nà mìíràn.
- issue: Ìyípadà láti bí Jósẹ́fù sí bí Jésù láti inú Màríà
  choice: “Jákọ́bù ... bí Jósẹ́fù,” ṣùgbọ́n “a ti inú [Màríà] bí Jésù”
  alternative: Lílo “bí” lọ́nà kan náà fún Jósẹ́fù àti Jésù, èyí tó lè mú Jósẹ́fù dà bí ẹni tó bí Jésù
  rationale: Gíríìkì yí padà láti ἐγέννησεν tó jẹ́ ọ̀rọ̀ ṣíṣe sí ἐγεννήθη tó jẹ́ ọ̀rọ̀ aláìṣe, ó sì lo ἐξ ἧς tó tọ́ka sí Màríà. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹni tí a ti inú rẹ̀ bí Jésù” jẹ́ kíkún díẹ̀ ju ọ̀rọ̀ ojoojúmọ́ lọ, ṣùgbọ́n ó mọ́gbọ́n dání, ó sì pa ìtọ́kasí pàtó sí Màríà àti ìṣètò aláìṣe inú Gíríìkì mọ́.
