id: MAT.1.21
reference: Matthew 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: yo
  text: Yóò sì bí ọmọkùnrin kan, ìwọ yóò sì pe orúkọ rẹ̀ ní Jésù[a], nítorí òun ni yóò gba àwọn ènìyàn rẹ̀ là nínú àwọn ẹ̀ṣẹ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orúkọ Jésù jẹ́ ìrísí Gíríìkì tí ó bá orúkọ Hébérù tàbí Árámáíkì Yeshua (Jóṣúà) mu; ó ní ìbáṣepọ̀ pẹ̀lú èrò pé ‘Yáhwè ń gbà là.’ Àlàyé Mátíù pé ‘nítorí òun ni yóò gba ... là’ ń tọ́ka sí eré-ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: Yóò bí
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú nípa ìbímọ; ‘yóò bí’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa agbára àsọtẹ́lẹ̀ náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àsopọ̀ rírọ̀; ‘sì’ bá ìṣàn ọ̀rọ̀ Yorùbá mu láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: υἱὸν
  choice: ọmọkùnrin kan
  rationale: Ó tọ́ka sí ọmọ akọ tí a ó bí; ‘kan’ mú àìní arọ́pò-orúkọ pàtó inú Gíríìkì jáde lọ́nà àdánidá ní Yorùbá.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ìwọ yóò sì pe orúkọ rẹ̀ ní
  rationale: Èyí pa àgbékalẹ̀ ọ̀rọ̀ fífi orúkọ sọmọ mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: A lo irú orúkọ ẹni náà tí ó ti fìdí múlẹ̀ ní Yorùbá fún ẹni Majẹmu Tuntun yìí.
- source_word: αὐτὸς
  choice: òun ni
  rationale: Ipò àti ìlò arọ́pò-orúkọ náà ní Gíríìkì tẹnu mọ́ ẹni tí yóò ṣe iṣẹ́ ìgbàlà; ‘òun ni’ pa ìtẹnumọ́ yẹn mọ́ ní Yorùbá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí a fi ní kí a pe orúkọ ọmọ náà ní Jésù.
- source_word: σώσει
  choice: yóò gba … là
  rationale: ‘Gba … là’ ni ọ̀nà Yorùbá tó ṣe déédéé fún ìgbàlà tàbí ìdáǹdè, ó sì bá ọ̀rọ̀ nípa ẹ̀ṣẹ̀ mu.
- source_word: τὸν λαὸν αὐτοῦ
  choice: àwọn ènìyàn rẹ̀
  rationale: Èyí pa ìbáṣepọ̀ ohun-ìní inú ‘his people’ mọ́ láìdín wọn kù sí Ísírẹ́lì nìkan tàbí mú wọn gbòòrò sí gbogbo aráyé.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: kúrò nínú àwọn ẹ̀ṣẹ̀ wọn
  rationale: ‘Kúrò nínú’ fi ìyapa tí ἀπό ń tọ́ka sí hàn, ‘àwọn ẹ̀ṣẹ̀’ sì pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìtẹnumọ́ αὐτός lórí ẹni tí yóò gba àwọn ènìyàn náà là
  choice: A lo ‘òun ni yóò gba’ láti pa ìtẹnumọ́ mọ́.
  alternative: ‘yóò gba’ láìsí ‘òun ni’
  rationale: Gíríìkì fi ẹni ọmọ náà hàn gẹ́gẹ́ bí olùṣe ìgbàlà ní pàtó; èdè náà kò fi ẹ̀kọ́ míì kún ọ̀rọ̀.
- issue: Ààlà ìtumọ̀ ‘àwọn ènìyàn rẹ̀’
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘àwọn ènìyàn rẹ̀.’
  alternative: ‘àwọn ènìyàn rẹ̀ Ísírẹ́lì’ tàbí ‘gbogbo ẹni tí ó jẹ́ tirẹ̀’
  rationale: Àyíká ìtàn ní ìbáṣepọ̀ Júù, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò tú ààlà ẹgbẹ́ náà síwájú; ìtumọ̀ náà pa àìdánilójú tó wà nínú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé lásán; a pa àgbékalẹ̀ àsọtẹ́lẹ̀ àti ìtẹnumọ́ Gíríìkì mọ́ láìjẹ́ kí gbolóhùn náà le.
