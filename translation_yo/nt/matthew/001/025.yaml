revisions:
- from: Kò sì mọ̀ ọ́n[a] títí ó fi bí ọmọkùnrin kan[b]; ó sì pe orúkọ rẹ̀ ní Jésù.[c]
  to: Kò sì mọ̀ ọ́[a] títí di ìgbà tí Màríà bí ọmọkùnrin kan[b]; ó sì pe orúkọ rẹ̀ ní Jésù.[c]
  rationale: The revision corrects the erroneous footnote, uses the proper Yoruba object pronoun, and makes Mary explicitly the subject of the birth clause. It retains the Greek euphemism in the main text, preserves the noncommittal force of ἕως οὗ concerning what followed the birth, and keeps the source's naming formulation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the temporal boundary of ἕως οὗ, the indefinite υἱόν, and Joseph's naming of Jesus. However, the main clause's «títí ó fi bí» leaves the subject of «bí» syntactically unclear in Yoruba, and footnote b incorrectly states that Jesus gave birth ("tí Jésù bí") rather than that Mary gave birth to Jesus.
  naturalness: «Kò sì mọ̀ ọ́» can retain the source euphemism when its meaning is clarified in a note. «Títí di ìgbà tí Màríà bí ọmọkùnrin kan» is clearer and natural Standard Yoruba. The alternate naming expression is more idiomatic as «ó fún un ní orúkọ Jésù.»
  terminology: Jésù and ọmọkùnrin kan are appropriate. The object pronoun after mọ̀ should be «ọ́», not «ọ́n». The explicit marital-relations alternative is more natural as «kò ní ìbálòpọ̀ pẹ̀lú rẹ̀.»
  issues:
  - severity: medium
    issue: Ambiguous subject in the temporal clause
    rationale: In «títí ó fi bí», Yoruba grammar does not clearly identify Mary as the one who gave birth. The Greek subject of ἔτεκεν is Mary, and the translation should state this without adding interpretation.
  - severity: high
    issue: Footnote b reverses the birth subject
    rationale: «títí di ìgbà tí Jésù bí» literally says that Jesus gave birth. It must instead refer to Jesus's birth or to Mary giving birth to him.
  - severity: low
    issue: Object-pronoun spelling after mọ̀
    rationale: The direct object is «ọ́» in «mọ̀ ọ́»; «ọ́n» is not the appropriate form here.
  - severity: low
    issue: Footnote c's alternate naming idiom is awkward
    rationale: «Ó sọ ọ́ ní Jésù» is less idiomatic and can be unclear. «Ó fún un ní orúkọ Jésù» naturally conveys 'he named him Jesus.'
  revised_text: Kò sì mọ̀ ọ́[a] títí di ìgbà tí Màríà bí ọmọkùnrin kan[b]; ó sì pe orúkọ rẹ̀ ní Jésù.[c]
