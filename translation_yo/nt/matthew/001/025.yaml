id: MAT.1.25
reference: Matthew 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: yo
  text: Kò sì mọ̀ ọ́[a] títí di ìgbà tí Màríà bí ọmọkùnrin kan[b]; ó sì pe orúkọ rẹ̀ ní Jésù.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ṣíṣe kedere sí i, “kò ní ìbálòpọ̀ pẹ̀lú rẹ̀.” Gíríìkì sọ pé “kò mọ̀ ọ́,” ó sì lo “mọ̀” gẹ́gẹ́ bí ọ̀nà àfiwé fún ìbálòpọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Títí di ìgbà tí” sọ ohun tó jẹ́ òótọ́ títí di ìbí Jésù; fúnra rẹ̀, kò pinnu ohun tó ṣẹlẹ̀ lẹ́yìn náà.
    reason: alternative_reading
  - marker: c
    text: Tàbí, ní ọ̀nà tó túbọ̀ rọrùn, “ó fún un ní orúkọ Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: mọ̀ ọ́n
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘mọ̀,’ ṣùgbọ́n níhìn-ín ó jẹ́ ọ̀nà àfiwé tí a fi ń sọ nípa ìbálòpọ̀. Yíyan ‘mọ̀ ọ́n’ pa ìṣàpẹẹrẹ inú orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ rẹ̀ hàn kedere.
- source_word: ἕως οὗ
  choice: títí ó fi
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi ààlà àkókò hàn. Fúnra rẹ̀, kò pinnu ohun tó ṣẹlẹ̀ lẹ́yìn ìbí náà.
- source_word: ἔτεκεν
  choice: bí
  rationale: ‘Bí’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì bá ìtumọ̀ τίκτω mu ní àyíká yìí.
- source_word: υἱόν
  choice: ọmọkùnrin kan
  rationale: Orúkọ náà kò ní àfihàn pàtó ní Gíríìkì; ‘ọmọkùnrin kan’ pa èyí mọ́ láìfi ìtẹnumọ́ tí kò sí nínú orísun kún un.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: ó sì pe orúkọ rẹ̀ ní Jésù
  rationale: Èyí tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì ará Sémítì ní ọ̀nà tí ó tún jẹ́ Yorùbá àdánidá. ‘Ó sọ ọ́ ní Jésù’ jẹ́ àṣàyàn tó túbọ̀ rọrùn.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: ‘Jésù’ ni ìkọ̀wé orúkọ tí a mọ̀ sí mímọ́ jù lọ ní Yorùbá fún ẹni yìí nínú Májẹ̀mú Tuntun.
theological_decisions:
- issue: Bóyá ‘títí ó fi’ ń sọ ohun tó ṣẹlẹ̀ sí ìbáṣepọ̀ Màríà àti Jósẹ́fù lẹ́yìn ìbí Jésù
  choice: A tú ἕως οὗ sí ‘títí ó fi’ láìsọ pé ìbálòpọ̀ bẹ̀rẹ̀ tàbí pé kò bẹ̀rẹ̀ lẹ́yìn náà.
  alternative: Àwọn kan gbà pé gbólóhùn náà ń tọ́ka sí pé ìbálòpọ̀ tọkọtaya bẹ̀rẹ̀ lẹ́yìn ìbí; àwọn mìíràn sì gbà pé kò sọ pé ipò náà yí padà rárá.
  rationale: Gbólóhùn Gíríìkì náà fi ohun tó jẹ́ òótọ́ títí dé ìbí hàn, ṣùgbọ́n fúnra rẹ̀ kò yanjú ohun tó ṣẹlẹ̀ lẹ́yìn náà. Ìtumọ̀ yìí pa àìdánilójú inú ẹsẹ náà mọ́ láìgbé ẹ̀kọ́ ìjọ kan wọ inú rẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. Gbólóhùn ‘mọ̀ ọ́n’ pa àfiwé orísun mọ́; àlàyé ìsàlẹ̀ mú ìtumọ̀ rẹ̀ yé ni kedere. Àwọn àmì àlàyé [a], [b], àti [c] wà lẹ́gbẹ̀ẹ́ apá tí ọ̀kọ̀ọ̀kan wọn ń ṣàlàyé.
