  source_fidelity: Ìtumọ̀ náà fi τοῦτο δὲ ὅλον hàn dáadáa gẹ́gẹ́ bí “Gbogbo èyí sì,” ó sì tọ́ka sí gbogbo ìṣẹ̀lẹ̀ tí ó ṣáájú. “ṣẹlẹ̀” bá γέγονεν mu ní ọ̀nà Yorùbá adayeba. Ìṣètò “kí ... lè ṣẹ” ṣètọ́jú agbára ète/àbájáde tí ἵνα πληρωθῇ ní láì mú un pinnu sí ète tàbí àbájáde nìkan. “ohun tí Olúwa sọ nípasẹ̀ wòlíì náà” pa ìyàtọ̀ ὑπὸ κυρίου àti διὰ τοῦ προφήτου mọ́, àti “bí ó ti wí pé” ṣiṣẹ́ gẹ́gẹ́ bí ìṣípayá sí àyọlò tí ó tẹ̀ lé.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá àpapọ̀ tó mọ́gbọ́n dání, pẹ̀lú àmì ohùn tí ó yẹ. “Gbogbo èyí sì ṣẹlẹ̀” àti “nípasẹ̀ wòlíì náà” jẹ́ ìlò tó rọrùn fún òǹkàwé òde òní. “Bí ó ti wí pé” jẹ́ ọ̀nà Bíbélì tí ó bófin mu láti ṣí ọ̀rọ̀ ìtẹ̀síwájú.
  terminology: “Olúwa” fún κύριος àti “wòlíì” fún προφήτης jẹ́ ọ̀rọ̀ ìjọsìn/Bíbélì tí ó fìdí múlẹ̀ nínú Yorùbá. A kò fi “Ọlọ́run” kún κύριος, nítorí náà a kò ṣàfikún ohun tí Gíríìkì kò sọ. Ọ̀rọ̀ “ṣẹ” ní ibi yìí dáa fún ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀.
