id: MAT.1.22
reference: Matthew 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: yo
  text: 'Gbogbo èyí sì ṣẹlẹ̀[a] kí ohun tí Olúwa sọ nípasẹ̀ wòlíì náà lè ṣẹ, bí ó ti wí pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Gbogbo nǹkan yìí sì ṣẹlẹ̀.” Gbólóhùn Gíríìkì τοῦτο δὲ ὅλον tẹnu mọ́ gbogbo ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Gbogbo èyí sì
  rationale: “Gbogbo èyí” ń tọ́ka sí gbogbo ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe, ó sì pa ìtẹnumọ́ ὅλον mọ́. “Sì” jẹ́ àsopọ̀ àkọsílẹ̀ tó bá δέ mu láì fi ìtumọ̀ àkókò ‘nísinsin yìí’ kún un.
- source_word: γέγονεν
  choice: ṣẹlẹ̀
  rationale: Ọ̀rọ̀ yìí sọ pé àwọn ìṣẹ̀lẹ̀ náà ti wáyé; “ṣẹlẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá àti òde òní fún un.
- source_word: ἵνα πληρωθῇ
  choice: kí ... lè ṣẹ
  rationale: Ìṣètò “kí ... lè” lè gba ète àti àbájáde wọlé, nígbà tí “ṣẹ” pa èrò ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀ mọ́.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: ohun tí Olúwa sọ
  rationale: Ó sọ ohun tí a sọ ní ọ̀nà Yorùbá tó rọrùn, ó sì fi Olúwa hàn gẹ́gẹ́ bí olùsọ̀rọ̀ pàtàkì láì fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: διὰ τοῦ προφήτου
  choice: nípasẹ̀ wòlíì náà
  rationale: “Nípasẹ̀” pa ìyàtọ̀ mọ́ láàárín Olúwa gẹ́gẹ́ bí orísun ọ̀rọ̀ náà àti wòlíì gẹ́gẹ́ bí ẹni tí ọ̀rọ̀ náà gba ẹnu rẹ̀ jáde.
- source_word: λέγοντος
  choice: bí ó ti wí pé
  rationale: Ó ṣí ọ̀nà fún àyọlò tó tẹ̀ lé, ó sì tọ́ka sí wòlíì náà gẹ́gẹ́ bí ẹni tó kéde ọ̀rọ̀ náà.
theological_decisions:
- issue: Ipa Olúwa àti ti wòlíì nínú ọ̀rọ̀ àsọtẹ́lẹ̀
  choice: “ohun tí Olúwa sọ nípasẹ̀ wòlíì náà”
  alternative: “ohun tí wòlíì náà sọ láti ọ̀dọ̀ Olúwa”
  rationale: Gíríìkì fi ὑπό hàn fún Olúwa gẹ́gẹ́ bí olùsọ̀rọ̀ pàtàkì, ó sì lo διά fún wòlíì gẹ́gẹ́ bí alárinà. Ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́ láì ṣàlàyé ẹ̀kọ́ ìmísí ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ète tàbí àbájáde nínú ọ̀rọ̀ ìmúṣẹ
  choice: “kí ... lè ṣẹ”
  alternative: “nípa bẹ́ẹ̀, ... ṣẹ”
  rationale: ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́ lè tọ́ka sí ète, àbájáde, tàbí àwọn méjèèjì. “Kí ... lè ṣẹ” pa ìfọkànsìn yìí mọ́ láì pinnu ìbéèrè náà ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó mọ́gbọ́n dání, tó ní àmì ohùn níbi tí ó ti yẹ. “Wòlíì” àti “Olúwa” jẹ́ àwọn ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yorùbá òde òní mọ̀ dáadáa; ìtòlẹ́sẹẹsẹ gbólóhùn náà sì jẹ́ ti ara Yorùbá, kì í ṣe àfarawé gírámà Gíríìkì lasán.
