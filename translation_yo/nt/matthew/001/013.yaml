id: MAT.1.13
reference: Matthew 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: yo
  text: Serubbabeli sì bí Abiudi; Abiudi sì bí Eliakimu; Eliakimu sì bí Asori.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Serubábélì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí àwọn olùsọ Yorùbá ṣe lè kà á, láì túmọ̀ orúkọ ẹni náà.
- source_word: δέ
  choice: sì
  rationale: Nínú àtòjọ ìran yìí, δέ kì í fi ìtakora hàn; ó ń so gbólóhùn kọ̀ọ̀kan pọ̀, èyí tí “sì” ṣe lọ́nà àdánidá ní Yorùbá.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú ìtàn ìran baba sí ọmọ, “bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó rọrùn, tí ó sì pa ìlànà ọ̀rọ̀ Gíríìkì mọ́. Àlàyé ẹsẹ̀ ń jẹ́ kí ó ṣe kedere pé àtòjọ ìran lè ṣókí.
- source_word: Ἀβιούδ
  choice: Ábíúdì
  rationale: Ìkọ̀wé orúkọ ẹni náà tẹ̀ lé ìró Gíríìkì ní ọ̀nà tí ó ṣeé kà ní Yorùbá.
- source_word: Ἐλιακίμ
  choice: Élíákímù
  rationale: Ìkọ̀wé orúkọ náà pa àwọn ìró pàtàkì Gíríìkì mọ́, pẹ̀lú fáwẹ́lì ìparí tó mú un rọrùn láti pè ní Yorùbá.
- source_word: Ἀζώρ
  choice: Ásórì
  rationale: Ìkọ̀wé orúkọ náà jẹ́ àfihàn ìró Gíríìkì tó bójú mu fún òǹkàwé Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ γεννάω nínú àtòjọ ìran tí ó lè fo àwọn ìran kan
  choice: bí
  alternative: jẹ́ baba ńlá fún
  rationale: “Bí” pa àfihàn ìran tààrà inú Gíríìkì mọ́ láì pinnu bóyá gbogbo orúkọ jẹ́ baba àti ọmọ lẹ́sẹ̀kẹsẹ̀. Àlàyé ẹsẹ̀ sọ pé irú àtòjọ yìí lè jẹ́ ṣókí, nítorí náà a kò yí ọ̀rọ̀ pàtàkì sí “jẹ́ baba ńlá fún.”
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “sì” léraléra láti pa ìṣàn àtòjọ Gíríìkì mọ́.
