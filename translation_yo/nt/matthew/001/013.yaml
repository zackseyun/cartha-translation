  naturalness: The clause pattern is natural in formal Yoruba biblical genealogy. The supplied name spellings with added tone marks are less idiomatic than established Standard Yoruba biblical forms, and the footnote’s wording can be made smoother and more exact.
  terminology: Use the established Yoruba biblical spellings Serubbabeli, Abiudi, Eliakimu, and Asori. Retain “bí” for γεννάω. The note should identify the repeated item as a verb (ọ̀rọ̀-ìṣe) and express genealogical compression naturally.
