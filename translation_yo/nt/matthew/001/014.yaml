id: MAT.1.14
reference: Matthew 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: yo
  text: Asori sì bí Sadoku, Sadoku sì bí Akimu, Akimu sì bí Eliudu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Asori
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń sọ orúkọ Gíríìkì ní Yorùbá, a sì fi fáwẹ́lì kún un láti mú kí ó rọrùn láti pè.
- source_word: δέ
  choice: sì
  rationale: Nínú ìtàn ìran yìí, δέ jẹ́ àsopọ̀ tó ń so ọ̀rọ̀ kọ̀ọ̀kan mọ́ èkejì. “Sì” jẹ́ ọ̀nà àdánidá àti ṣókí láti fi ìtẹ̀síwájú náà hàn ní Yorùbá.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú àkọsílẹ̀ ìran, ọ̀rọ̀ náà túmọ̀ sí pé ọkùnrin kan ló bí ẹni tó tẹ̀ lé e tàbí pé ó jẹ́ baba ńlá rẹ̀. “Bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó bá ọ̀rọ̀ ìran mu, láìlo èdè àtijọ́ tàbí gbólóhùn gígùn.
- source_word: τὸν
  choice: kò ní ìtumọ̀ ọ̀tọ̀ nínú ẹsẹ yìí
  rationale: Àpilẹ̀kọ akúsatífù Gíríìkì náà ń samì sí olùgbà ìṣe ṣáájú orúkọ ẹni; Yorùbá kò nílò àpilẹ̀kọ bẹ́ẹ̀ níbi yìí.
- source_word: Σαδώκ
  choice: Sadoku
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní irú ọ̀nà tí ètò ìró Yorùbá lè gbà.
- source_word: Ἀχίμ
  choice: Akimu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà láti inú Gíríìkì, pẹ̀lú fáwẹ́lì ìparí tó mú kí pípe rẹ̀ bá ètò ìró Yorùbá mu.
- source_word: Ἐλιούδ
  choice: Eliudu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà láti inú Gíríìkì ní ọ̀nà tó rọrùn fún olùkà Yorùbá láti pè.
theological_decisions:
- issue: Bóyá ἐγέννησεν ń tọ́ka sí baba ọmọ tààrà tàbí baba ńlá nínú ìran
  choice: Lo “bí” gẹ́gẹ́ bí ọ̀rọ̀ ìran tí ó lè ṣiṣẹ́ fún ìbátan baba-ọmọ tàbí ìtẹ̀lé ìran.
  alternative: “jẹ́ baba” tàbí “di baba”
  rationale: Àwọn àkọsílẹ̀ ìran Bíbélì lè fo àwọn ìran kan; “bí” pa ìṣísẹ̀ gbólóhùn Gíríìkì mọ́ láìfi àlàyé tí orísun kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó ṣókí, tí ó sì tẹ̀ lé àtúnsọ gbólóhùn Gíríìkì. A lo “sì” lẹ́ẹ̀kọ̀ọ̀kan láti pa ìlànà àsopọ̀ δέ mọ́. Àwọn àmì ohùn kò sí lórí àwọn orúkọ àjèjì nítorí pé ohùn wọn kò dájú nínú àṣà Yorùbá, ṣùgbọ́n a fi fáwẹ́lì ṣe wọn ní ìbámu pẹ̀lú ètò ìró Yorùbá.
