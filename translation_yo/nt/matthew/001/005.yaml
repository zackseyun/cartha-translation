id: MAT.1.5
reference: Matthew 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: yo
  text: Sálímónì sì ni baba Bóásì nípasẹ̀ Ráhábù[a]; Bóásì sì ni baba Óbédì nípasẹ̀ Rúùtù, Óbédì sì ni baba Jésè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “láti ọ̀dọ̀ Ráhábù” àti “láti ọ̀dọ̀ Rúùtù.” Ọ̀rọ̀ Gíríìkì ἐκ wà pẹ̀lú orúkọ ìyá kọ̀ọ̀kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú àkọsílẹ̀ ìran, “bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún jíjẹ́ baba ọmọ kan tàbí mú kí ìran tẹ̀ síwájú. Ó bá ìlà baba mu láì lo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí kò wọ́pọ̀.
- source_word: ἐκ
  choice: láti ara
  rationale: Ọ̀rọ̀ yìí fi orísun ọmọ nípasẹ̀ ìyá hàn. “Láti ara” pa ìtọ́ka sí Ráhábù àti Rúùtù mọ́, ó sì sún mọ́ ìtumọ̀ Gíríìkì ju kí a sọ ìbátan baba nìkan lọ.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ kì í ṣe àmì àtakò; ó kan so àwọn ìpele àkọsílẹ̀ ìran pọ̀. “Sì” ni àsopọ̀ Yorùbá tó ṣe déédéé fún iṣẹ́ yìí.
- source_word: Σαλμὼν
  choice: Sálímónì
  rationale: Fọ́ọ̀mù orúkọ Yorùbá tó ṣeé dá mọ̀, tí ó sì tẹ̀ lé bí a ṣe máa ń kọ orúkọ yìí nínú Bíbélì Yorùbá.
- source_word: Βόες
  choice: Bóásì
  rationale: Fọ́ọ̀mù Yorùbá tí a mọ̀ fún Bóásì ti Májẹ̀mú Láéláé, kí ìdánimọ̀ ẹni náà lè bá ara rẹ̀ mu láàárín àwọn Májẹ̀mú.
- source_word: Ῥαχάβ
  choice: Ráhábù
  rationale: Àkọlé Yorùbá tó ṣeé dá mọ̀ fún orúkọ obìnrin náà.
- source_word: Ἰωβὴδ
  choice: Óbédì
  rationale: Fọ́ọ̀mù Yorùbá tó bá ẹni tí a mọ̀ nínú Májẹ̀mú Láéláé mu, dípò lílo àkọsílẹ̀ Gíríìkì lásán.
- source_word: Ῥούθ
  choice: Rúùtù
  rationale: Fọ́ọ̀mù Yorùbá tí a mọ̀ fún orúkọ Rúùtù àti ìwé tó jẹ́ orúkọ rẹ̀.
- source_word: Ἰεσσαί
  choice: Jésè
  rationale: Fọ́ọ̀mù Yorùbá tó wọ́pọ̀ fún baba Dáfídì, tó sì mú kí ìdánimọ̀ rẹ̀ hàn kedere.
theological_decisions:
- issue: Àgbékalẹ̀ ìran àti fífi orúkọ àwọn ìyá sínú rẹ̀
  choice: A pa ìlà baba mọ́ pẹ̀lú “bí,” a sì fi “láti ara Ráhábù” àti “láti ara Rúùtù” sọ ipa àwọn ìyá ní kedere.
  alternative: “Sálímónì ni baba Bóásì” láì mẹ́nu kan ìbátan ọmọ náà sí ìyá rẹ̀ nínú àgbékalẹ̀ kan náà.
  rationale: Gíríìkì náà mọ̀ọ́mọ̀ lo ἐκ pẹ̀lú orúkọ ìyá kọ̀ọ̀kan. Ìtumọ̀ kò yẹ kí ó pa àkíyèsí pàtàkì yìí rẹ́, bẹ́ẹ̀ ni kò yẹ kí ó yí àkọsílẹ̀ náà padà kúrò nínú ìlà baba.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àgbékalẹ̀ “bí … láti ara …” mọ̀ọ́mọ̀ pa ìlà baba àti ìtọ́ka sí ìyá méjèèjì mọ́, bó tilẹ̀ jẹ́ pé ó ní ìrísí ọ̀rọ̀ àkọsílẹ̀ ìran díẹ̀.
