id: MAT.1.18
reference: Matthew 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: yo
  text: 'Ìbí Jésù Mèsáyà[a] rí báyìí: Nígbà tí Màríà, ìyá rẹ̀, ti ṣe ìfẹ́sọ́nà sí Jósẹ́fù[b], ṣáájú kí wọ́n méjèèjì tó darapọ̀[c], a rí i pé ó lóyún láti ọ̀dọ̀ Ẹ̀mí Mímọ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” A tú oyè Gíríìkì Χριστός sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ mọ́.
    reason: alternative_reading
  - marker: b
    text: “Ṣe ìfẹ́sọ́nà” níbí túmọ̀ sí àdéhùn ìgbéyàwó tí a ti fìdí rẹ̀ múlẹ̀ lábẹ́ òfin; ó lágbára ju ìfẹ́sọ́nà òde òní lọ.
    reason: cultural_note
  - marker: c
    text: “Kí wọ́n tó darapọ̀” tún lè túmọ̀ sí kí wọ́n tó mú ìṣọ̀kan ọkọ àti aya ṣẹ nípa ìbálòpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: ìbí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ìbí Jésù àti bí ó ṣe wá sí ayé; “ìbí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ níbí.
- source_word: Ἰησοῦ χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà níbí, kì í ṣe orúkọ ìdílé; fífi “Mèsáyà” sílẹ̀ ń pa ìtumọ̀ oyè náà mọ́.
- source_word: οὕτως ἦν
  choice: ṣe ṣẹlẹ̀ nìyí
  rationale: Gbólóhùn yìí ń ṣàlàyé ọ̀nà tí ìṣẹ̀lẹ̀ náà gbà wáyé; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ipa àlàyé Gíríìkì mọ́.
- source_word: μνηστευθείσης
  choice: a ti fi ... ṣèfẹ́sọ́nà fún
  rationale: Ó ń tọ́ka sí ìlérí ìgbéyàwó tí a ti fìdí rẹ̀ múlẹ̀, tí ó lágbára ju àdéhùn ìfẹ́ ti òde òní lọ.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: ṣáájú kí àwọn méjèèjì tó parapọ̀
  rationale: “Parapọ̀” pa ọ̀nà ìsọ̀rọ̀ pẹ̀lẹ́ ti Gíríìkì mọ́, ó sì lè tọ́ka sí dídá ilé papọ̀ àti ìbálòpọ̀ ọkọ àti aya láìfi ọ̀kan ṣoṣo múlẹ̀.
- source_word: εὑρέθη
  choice: a rí i pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a ṣàwárí ipò náà, láìfikún ẹni tó kọ́kọ́ ṣàwárí rẹ̀.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: ó ti lóyún
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó ṣe kedere, láti sọ pé obìnrin ní ọmọ nínú.
- source_word: ἐκ πνεύματος ἁγίου
  choice: láti ọ̀dọ̀ Ẹ̀mí Mímọ́
  rationale: ἐκ ń fi orísun hàn; “láti ọ̀dọ̀” ń pa ìtumọ̀ orísun náà mọ́, Ẹ̀mí Mímọ́ sì ni ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè nínú ìṣáájú ìtàn yìí; “Mèsáyà” ń mú ìtumọ̀ oyè náà hàn gbangba.
- issue: Ẹni tí πνεύματος ἁγίου ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ kan
  rationale: Nínú ìtàn ìbí tí Mátíù kọ, gbólóhùn náà ń tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run; àìsí árítíkù nínú Gíríìkì kò sọ ọ́ di ẹ̀mí kan tí a kò mọ̀.
- issue: Ìtumọ̀ συνελθεῖν
  choice: parapọ̀
  alternative: bẹ̀rẹ̀ sí í gbé papọ̀ / ní ìbálòpọ̀
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀nà ìsọ̀rọ̀ pẹ̀lẹ́ tí ó lè ní ìtumọ̀ ìṣọ̀kan ìgbéyàwó, títí kan ìbálòpọ̀; a kò yan ìtumọ̀ tó dín àìdájú rẹ̀ kù.
translation_notes:
  register: A lo Yorùbá àgbàdojú, olóògo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn síbi tí ó bá yẹ, a sì pa ọ̀nà ìsọ̀rọ̀ pẹ̀lẹ́ àti àìdájú συνελθεῖν mọ́.
