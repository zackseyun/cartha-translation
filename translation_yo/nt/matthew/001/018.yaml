  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì Gíríìkì náà wá: ìbí Jésù ẹni tí a ń pè ní Mèsáyà, ìfẹ́sọ́nà Màríà sí Jósẹ́fù, àkókò ṣáájú ìṣọ̀kan wọn, oyún rẹ̀, àti orísun náà, Ẹ̀mí Mímọ́. Ṣùgbọ́n ìbẹ̀rẹ̀ ọrọ̀ náà, “Bí ìbí ... ṣe ṣẹlẹ̀ nìyí,” kò dára ní Yorùbá, ó sì ń sọ γένεσις/οὕτως ἦν ní ọ̀nà tí kò péye. “Lẹ́yìn tí” tún ń fi ìbátan àkókò tí kò sí nínú Gíríìkì kún un.'
  naturalness: 'Àtúnṣe náà ń lo gbólóhùn Yorùbá òde òní tó dára: “Ìbí ... rí báyìí.” A tún rọ́pò ọ̀nà ìfẹ́sọ́nà tí ó dùn díẹ̀ sí “ti ṣe ìfẹ́sọ́nà sí,” a sì yọ “ti” kúrò nínú “ó ti lóyún,” nítorí oyún náà jẹ́ ipò tí a rí, kì í ṣe ìṣẹ̀lẹ̀ míràn tí a gbọ́dọ̀ fi ìpẹ́yà àkókò hàn.'
  terminology: “Mèsáyà” yẹ fún Χριστός gẹ́gẹ́ bí oyè. “Ẹ̀mí Mímọ́” jẹ́ ìtumọ̀ tó péye fún πνεύματος ἁγίου nínú àyíká yìí. “Darapọ̀” pa ọ̀nà ìsọ̀rọ̀ pẹ̀lẹ́ ti συνελθεῖν mọ́, láìsọ pé ìbálòpọ̀ nìkan ni dandan.
  issues:
