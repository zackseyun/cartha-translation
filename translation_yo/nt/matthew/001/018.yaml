    rationale: μνηστευθείσης jẹ́ participle tó ṣètò àyíká ìṣẹ̀lẹ̀ náà, kò sì ní ìtumọ̀ ‘lẹ́yìn tí.’ “Nígbà tí” dá àìlékọja yìí dúró.
  - severity: low
