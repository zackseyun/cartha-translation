    issue: Ìbẹ̀rẹ̀ gbolóhùn náà kò dára ní Yorùbá.
    rationale: “Bí ìbí Jésù Mèsáyà ṣe ṣẹlẹ̀ nìyí” jẹ́ ìkọ̀lé tí kò fọgbọ́n dáadáa. Gíríìkì náà jẹ́ ìfihàn bí ìbí náà ṣe rí/wáyé; “Ìbí Jésù Mèsáyà rí báyìí” sọ èyí ní kedere.
  - severity: medium
