id: MAT.1.17
reference: Matthew 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: yo
  text: Nítorí náà, gbogbo àwọn ìran láti Ábúráhámù dé Dáfídì jẹ́ mẹ́rìnlá; láti Dáfídì dé ìgbà ìkólọ sí Bábílónì jẹ́ mẹ́rìnlá; láti ìgbà ìkólọ sí Bábílónì dé Mèsáyà[a] sì jẹ́ mẹ́rìnlá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà, χριστός, túmọ̀ sí ẹni tí a fi òróró yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Nítorí náà, gbogbo ìran
  rationale: “Nítorí náà” fi agbára àkópọ̀ àti ìyọrísí οὖν hàn, “gbogbo ìran” sì pa Πᾶσαι αἱ γενεαὶ mọ́ ní kedere.
- source_word: ἀπὸ ... ἕως
  choice: láti ... dé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti fi ààlà ìbẹ̀rẹ̀ àti òpin hàn.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: ìgbà tí a kó àwọn ènìyàn lọ sí ìgbèkùn ní Bábílónì
  rationale: Ọ̀rọ̀ náà tọ́ka sí fífi àwọn ènìyàn kúrò ní ilẹ̀ wọn lọ sí ìgbèkùn; ìtumọ̀ yìí jẹ́ kedere, ó sì yẹra fún lílo “ìgbèkùn” nìkan bí ẹni pé ọ̀rọ̀ náà kò ní ìtumọ̀ ìkó-kúrò.
- source_word: τοῦ χριστοῦ
  choice: Mèsáyà
  rationale: Nínú òpin ìtàn ìran yìí, χριστός jẹ́ oyè ẹni tí a fòróró yàn, kì í ṣe orúkọ lásán; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: γενεαὶ δεκατέσσαρες
  choice: ìran mẹ́rìnlá
  rationale: Ó túmọ̀ gígùn ìtẹ̀lé ìran náà sí iye ìran mẹ́rìnlá, ó sì tún àtúnṣe ọ̀rọ̀ Gíríìkì náà ṣe ní gbogbo apá mẹ́tẹ̀ẹ̀ta.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Ábúráhámù / Dáfídì / Bábílónì
  rationale: Àwọn wọ̀nyí ni ìkọ̀wé orúkọ tó wọ́pọ̀, tó sì bá ìró Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ τοῦ àti ipò ọ̀rọ̀ náà gẹ́gẹ́ bí òpin ìtàn ìran fi hàn pé oyè ni ó jẹ́ níbí. “Mèsáyà” mú ìtumọ̀ ẹni tí a fòróró yàn jáde láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìgbékalẹ̀ apá mẹ́tẹ̀ẹ̀ta àti àtúnwí “ìran mẹ́rìnlá” ni a pa mọ́ láti ṣàfihàn ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ orísun.
