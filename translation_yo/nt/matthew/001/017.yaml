- from: Nítorí náà, gbogbo ìran láti Ábúráhámù dé Dáfídì jẹ́ ìran mẹ́rìnlá; láti Dáfídì dé ìgbà tí a kó àwọn ènìyàn lọ sí ìgbèkùn ní Bábílónì jẹ́ ìran mẹ́rìnlá; láti ìgbà tí a kó wọn lọ sí ìgbèkùn ní Bábílónì dé Mèsáyà[a] sì jẹ́ ìran mẹ́rìnlá.
  to: Nítorí náà, gbogbo àwọn ìran láti Ábúráhámù dé Dáfídì jẹ́ mẹ́rìnlá; láti Dáfídì dé ìgbà ìkólọ sí Bábílónì jẹ́ mẹ́rìnlá; láti ìgbà ìkólọ sí Bábílónì dé Mèsáyà[a] sì jẹ́ mẹ́rìnlá.
  rationale: A yí “ìran” padà sí “àwọn ìran” láti fi ọ̀pọ̀ αἱ γενεαὶ hàn. A tún lo “ìgbà ìkólọ sí Bábílónì” ní ìgbà méjèèjì láti fi μετοικεσία hàn ní ọ̀nà kúkúrú, ìbámu, àti ti ara Yorùbá, láìsọnù ìtumọ̀ ìkó lọ sí ilẹ̀ míràn. Àtúnṣe àlàyé ìsàlẹ̀ náà mú ìtumọ̀ “anointed” rọrùn síi nínú Yorùbá.
