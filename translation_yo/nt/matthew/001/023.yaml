id: MAT.1.23
reference: Matthew 1:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: yo
  text: “Wò ó, wúńdíá[a] náà yóò lóyún, yóò sì bí ọmọkùnrin kan; wọ́n[b] yóò sì pe orúkọ rẹ̀ ní Immanuẹli[c]”—èyí tí ìtumọ̀ rẹ̀ jẹ́, “Ọlọ́run wà pẹ̀lú wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ọ̀dọ́bìnrin.” Síbẹ̀, nínú àyíká Mátíù, ọ̀rọ̀ Gíríìkì παρθένος àti ìtàn ìbí tí ó yí i ká ṣètìlẹ́yìn fún “wúńdíá.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “wọ́n yóò pe”; ọ̀rọ̀ ẹni-kẹta ọ̀pọ̀ ni, tí kò sọ àwọn ẹni náà ní pàtó.
    reason: lexical_alternative
  - marker: c
    text: A tún lè kọ orúkọ náà sí “Emanuẹli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ tí ń pe àfiyèsí mọ́, ó sì bá ìwọ̀n ọ̀rọ̀ àsọtẹ́lẹ̀ mu ní Yorùbá òde òní.
- source_word: παρθένος
  choice: wúńdíá
  rationale: Nínú àyíká ìtàn Mátíù nípa oyún àrà, ọ̀rọ̀ Gíríìkì náà tọ́ka sí obìnrin tí kò tíì ní ìbálòpọ̀; ‘wúńdíá’ sọ ìtumọ̀ yìí ní kedere.
- source_word: ἐν γαστρὶ ἕξει
  choice: yóò lóyún
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àpólà Gíríìkì náà, tí ó túmọ̀ ní tààrà sí ‘yóò ní nínú ilé ọlẹ̀.’
- source_word: τέξεται υἱόν
  choice: yóò sì bí ọmọkùnrin kan
  rationale: Ó mú ìtumọ̀ ìbímọ àti akọ ọmọ náà jáde ní Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
- source_word: καλέσουσιν
  choice: àwọn ènìyàn yóò sì pe
  rationale: Ẹni-kẹta ọ̀pọ̀ Gíríìkì kò sọ ẹni pàtó; ‘àwọn ènìyàn’ pa ìtumọ̀ aláìlórúkọ yẹn mọ́ dípò yíyí rẹ̀ sí gbólóhùn amúlò.
- source_word: Ἐμμανουήλ
  choice: Immanuẹli
  rationale: Àkọsílẹ̀ orúkọ náà bá bí a ṣe ń kọ ọ́ ní Yorùbá mu, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ìtumọ̀ tí ẹsẹ náà fún un mọ́.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: èyí tí a túmọ̀ sí
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì tẹ̀lé ìtumọ̀ aláìlórúkọ ti apá ọ̀rọ̀ Gíríìkì náà.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Ọlọ́run wà pẹ̀lú wa
  rationale: Ó sọ ìtumọ̀ orúkọ náà ní kedere láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ kún un.
theological_decisions:
- issue: Ìtumọ̀ παρθένος nínú ẹsẹ tó ṣe pàtàkì sí oyún wúńdíá
  choice: wúńdíá
  alternative: ọ̀dọ́bìnrin
  rationale: Ọ̀rọ̀ Gíríìkì Mátíù àti àyíká ìtàn oyún àrà Jésù ṣètìlẹ́yìn fún ‘wúńdíá.’ A fi ‘ọ̀dọ́bìnrin’ sínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn tí a máa ń jíròrò nípa Aísáyà 7:14, láìjẹ́ kí ó borí àyíká Mátíù.
- issue: Agbára ìtumọ̀ orúkọ Immanuẹli
  choice: Ọlọ́run wà pẹ̀lú wa
  alternative: Pẹ̀lú wa ni Ọlọ́run wà
  rationale: A pa ìtumọ̀ tí ẹsẹ fúnra rẹ̀ fún orúkọ náà mọ́, láìsọ ọ́ di àlàyé gígùn nípa bí Ọlọ́run ṣe di ènìyàn.
translation_notes:
  register: Yorùbá àkọ́ṣe, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. Àmì ohùn kún ibi tí ó yẹ. ‘Wò ó’ mú ohùn àsọtẹ́lẹ̀ àti ìpè sí àfiyèsí jáde; ‘àwọn ènìyàn yóò pe’ mú ẹni-kẹta ọ̀pọ̀ aláìlórúkọ inú Gíríìkì hàn ní ọ̀nà Yorùbá àdánidá.
