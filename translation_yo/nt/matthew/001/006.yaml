  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí Jésè, Dáfídì gẹ́gẹ́ bí ọba, àti Sólómọ́nì. Ṣùgbọ́n “nípasẹ̀ aya Uráyà” sábà máa ń túmọ̀ sí ‘through/by means of’ ní Yorùbá, kì í sì jẹ́ ọ̀nà àdánidá jù lọ láti sọ ìbímọ nínú ìran. “Láti ara aya Uráyà” ń mú agbára ἐκ (‘láti ara ẹni náà’) wá síta dáadáa, ó sì pa ọ̀rọ̀ àìdárúkọ Mátíù mọ́.
