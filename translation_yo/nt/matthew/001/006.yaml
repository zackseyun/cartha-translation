  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: yo
  text: Jésè sì bí Dáfídì ọba. Dáfídì sì bí Sólómọ́nì láti ara aya Uráyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, èdè Gíríìkì sọ pé, “láti ara [obìnrin] Uráyà,” èyí jẹ́ àsọyé kúkúrú tí ó túmọ̀ sí “láti ara aya Uráyà.” Mátíù kò dárúkọ Bátíṣébà níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú àkọsílẹ̀ ìran, “bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún jíjẹ́ baba ọmọ; ó bá ọkùnrin tó jẹ́ olùṣe nínú gbólóhùn mu, ó sì yẹra fún ọ̀rọ̀ àtijọ́ tàbí àsọyé gígùn.
- source_word: βασιλέα
  choice: ọba
  rationale: Ó pa ìdánimọ̀ pàtó Dáfídì gẹ́gẹ́ bí ọba mọ́, gẹ́gẹ́ bí àpilẹ̀kọ Gíríìkì ṣe tẹnumọ́ ipò rẹ̀.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: nípasẹ̀ aya Uráyà
  rationale: Ó sọ àsọyé Gíríìkì tí ó fi “obìnrin/aya” sílẹ̀ ní ọ̀nà Yorùbá tó yé, láìfi orúkọ Bátíṣébà kún un tàbí yọ ìbátan rẹ̀ sí Uráyà kúrò.
- source_word: Ἰεσσαὶ
  choice: Jésè
  rationale: Ìkọ̀wé orúkọ tí ó bá ìró Yorùbá àti àmì ohùn mu.
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Ìkọ̀wé orúkọ tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: Σολομῶνα
  choice: Sólómọ́nì
  rationale: Ìkọ̀wé orúkọ tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: Οὐρίου
  choice: Uráyà
  rationale: Ìkọ̀wé orúkọ tí ó wọ́pọ̀ ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: δέ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó bá tẹ̀lé-tẹ̀lé àkọsílẹ̀ ìran mu, láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìtọ́ka Mátíù sí Bátíṣébà láìdárúkọ rẹ̀
  choice: Pa ọ̀rọ̀ àìtààrà “aya Uráyà” mọ́.
  alternative: “Bátíṣébà” tàbí “ẹni tí ó ti jẹ́ aya Uráyà.”
  rationale: Gíríìkì mọ̀ọ́mọ̀ dá obìnrin náà mọ̀ nípasẹ̀ Uráyà. Ìtumọ̀ náà pa ìró ìtàn àti ìfọ̀rọ̀wérọ̀ ìwà rere inú 2 Sámúẹ́lì mọ́, láìyanjú rẹ̀ nípa fífi orúkọ tí Mátíù kò lò kún un.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ, a sì pa ìṣètò ìran àti ìtọ́ka ọba mọ́.
