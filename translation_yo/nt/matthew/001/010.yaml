id: MAT.1.10
reference: Matthew 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: yo
  text: Hesekáyà sì bí Manásè, Manásè sì bí Ámósì[a], Ámósì sì bí Josáyà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìtumọ̀ kan ní “Ámónì” níbí, láti mú un bá orúkọ ọba Júdà nínú 2 Àwọn Ọba 21 mu; ṣùgbọ́n ọ̀rọ̀ Gíríìkì inú Mátíù ní “Ámósì.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú ìtàn ìran, γεννάω ń sọ nípa ẹni tí ó bí tàbí tí ìran ti ọ̀dọ̀ rẹ̀ wá. “Bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó kúrú, tó sì bá àtòjọ ìran mu; nínú àyíká yìí, ẹni tí a dárúkọ gẹ́gẹ́ bí baba ni kókó.
- source_word: Ἑζεκίας
  choice: Hesekáyà
  rationale: A ṣe orúkọ náà ní ìbámu pẹ̀lú bí orúkọ Hébérù tí ọba Júdà yìí ń jẹ́ ṣe wọ́pọ̀ ní Yorùbá.
- source_word: Μανασσῆς
  choice: Manásè
  rationale: Ìkọ̀wé Yorùbá tó ṣeé kà fún orúkọ ẹni náà, pẹ̀lú àmì ohùn tó yẹ.
- source_word: Ἀμώς
  choice: Ámósì
  rationale: Ọ̀rọ̀ Gíríìkì inú SBLGNT jẹ́ Ἀμώς, kì í ṣe Ἀμών; nítorí náà, ẹsẹ̀ pàtàkì tẹ̀ lé “Ámósì,” láì ṣe àtúnṣe rẹ̀ sí Ámónì.
- source_word: Ἰωσίας
  choice: Josáyà
  rationale: Ìkọ̀wé Yorùbá tó ṣeé kà fún orúkọ ọba náà, tí ó sì bá ìrísí orúkọ Hébérù rẹ̀ mu.
- source_word: δέ
  choice: sì
  rationale: Nínú àtòjọ ìran tí ń tẹ̀ síwájú, δέ jẹ́ àsopọ̀ rírọrùn. “Sì” ń mú ìtẹ̀síwájú gbolohun hàn ní Yorùbá láì fi ìtumọ̀ ìtakora kún un.
theological_decisions:
- issue: Ìyàtọ̀ láàárín orúkọ inú ọ̀rọ̀ Gíríìkì Mátíù àti orúkọ ọba Júdà nínú àwọn ìwé Àwọn Ọba/Ìtàn Ọjọ́
  choice: Lo “Ámósì” nínú ẹsẹ̀ pàtàkì, gẹ́gẹ́ bí Ἀμώς inú SBLGNT.
  alternative: Lo “Ámónì” láti mú orúkọ náà bá ọba inú 2 Àwọn Ọba 21 mu.
  rationale: Ìtumọ̀ náà tẹ̀ lé ẹ̀rí ọ̀rọ̀ Gíríìkì dípò kí ó mú un bá àkọsílẹ̀ Majẹmu Láéláé mu ní ìkọ̀kọ̀. Àlàyé ìsàlẹ̀ ojú ìwé pa ìṣòro orúkọ náà mọ́ fún òǹkàwé.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ṣeé lóye ní ìgbà òde òní. A lo “bí” fún àtòjọ ìran, “sì” fún ìtẹ̀síwájú, a sì fi àmì ohùn sí àwọn orúkọ àti ọ̀rọ̀ níbi tí ó bá yẹ.
