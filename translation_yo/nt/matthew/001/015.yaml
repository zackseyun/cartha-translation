id: MAT.1.15
reference: Matthew 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: yo
  text: Eliudu sì bí Eleasari, Eleasari sì bí Mattani, Mattani sì bí Jakọbu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Ẹliudu
  rationale: A ṣe àkọ̀kọ̀ orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: Nínú àtòjọ ìran yìí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ̀síwájú láti ọ̀dọ̀ ẹni kan sí òmíràn; “sì” jẹ́ ọ̀nà àdánidá láti fi èyí hàn ní Yorùbá.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú ìtàn ìran, γεννάω túmọ̀ sí jíjẹ́ baba tàbí baba ńlá ẹni tí a dárúkọ; “bí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àṣà àtòjọ ìran mu.
- source_word: τὸν
  choice: (a kò túmọ̀ ọ́ lọ́tọ̀)
  rationale: Àpilẹ̀kọ Gíríìkì náà ń samisi ẹni tí ìṣe náà kàn, ṣùgbọ́n Yorùbá kò nílò ọ̀rọ̀ kan níwájú orúkọ ẹni nínú gbólóhùn yìí.
- source_word: Ἐλεάζαρ
  choice: Eleasari
  rationale: A ṣe àkọ̀kọ̀ orúkọ náà ní ọ̀nà tí ó bá ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá mu.
- source_word: Ματθάν
  choice: Mattani
  rationale: A ṣe àkọ̀kọ̀ orúkọ náà ní ọ̀nà tí ó bá ìró orúkọ Gíríìkì náà àti ìkọ̀wé Yorùbá mu.
- source_word: Ἰακώβ
  choice: Jakọbu
  rationale: “Jakọbu” ni ìrísí orúkọ yìí tí ó ti wọ́pọ̀ nínú èdè Yorùbá, ó sì dúró fún Ἰακώβ.
theological_decisions:
- issue: Bí a ṣe máa fi ìbátan ìran tí ἐγέννησεν ń tọ́ka sí hàn
  choice: Lo “bí” láì fi kún un pé gbogbo wọn jẹ́ ọmọ tààrà.
  alternative: Lo “jẹ́ baba” tàbí “jẹ́ baba ńlá.”
  rationale: Èdè ìtàn ìran lè tọ́ka sí ìbátan baba-ọmọ tàbí sí ìran tó jìn síra. “Bí” pa ìṣókí orísun mọ́, kò sì fi àlàyé ìbátan tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàlódé tó ṣe kedere, tó ní iyì, tí ó sì tẹ̀ lé ìṣókí àti àtúnṣe ìtàn ìran inú orísun Gíríìkì. A lo àmì ohùn níbi tí ó bá yẹ, ṣùgbọ́n a kò fi àmì ohùn kún àwọn orúkọ àjèjì tí ìró wọn kò dá lórí tónì Yorùbá.
