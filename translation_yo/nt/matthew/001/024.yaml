id: MAT.1.24
reference: Matthew 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: yo
  text: Nígbà náà, Jósefù jí nínú oorun, ó sì ṣe gẹ́gẹ́ bí áńgẹ́lì Olúwa ti pàṣẹ fún un, ó sì gba aya rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘ó mú aya rẹ̀ wá sọ́dọ̀ rẹ̀’ tàbí ‘ó mú aya rẹ̀ wọ ilé rẹ̀.’ Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ mímú tàbí gbígba ẹnì kan sínú ilé ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς … ἀπὸ τοῦ ὕπνου
  choice: jí lójú oorun
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé ẹni kan tají; ó pa ìtumọ̀ gbólóhùn Gíríìkì mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: δὲ
  choice: Nígbà náà
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kì í ṣe pé ó ń fi ìtakora líle hàn.
- source_word: ἐποίησεν ὡς
  choice: ṣe gẹ́gẹ́ bí
  rationale: Ó fi hàn pé ìṣe Jósẹ́fù bá àṣẹ tí ó gbà mu.
- source_word: προσέταξεν
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àṣẹ tí ó ní agbára fún ẹnì kan.
- source_word: ὁ ἄγγελος κυρίου
  choice: áńgẹ́lì Olúwa
  rationale: Èyí jẹ́ ìtumọ̀ kedere àti ọ̀nà tí ó wọ́pọ̀ nínú èdè Bíbélì Yorùbá fún gbólóhùn náà.
- source_word: παρέλαβεν
  choice: mú … wá sọ́dọ̀ ara rẹ̀
  rationale: παραλαμβάνω lè túmọ̀ sí gbígba tàbí mímú ẹnì kan sọ́dọ̀ ẹni; yíyan yìí bá ipò ìgbéyàwó mu, ó sì jẹ́ kí ìtumọ̀ gbígbà sínú ilé ẹni fara hàn láì sọ ọ́ di ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: aya rẹ̀
  rationale: Nínú àyíká ìfọ̀rọ̀wérọ̀ àti ìdè ìgbéyàwó yìí, γυνή ní ìtumọ̀ ‘aya,’ bí ó tilẹ̀ jẹ́ pé ẹsẹ tó tẹ̀ lé e fi hàn pé wọn kò tíì ní ìbálòpọ̀.
theological_decisions:
- issue: Ìtumọ̀ γυνή ṣáájú ìbálòpọ̀ tọkọtaya
  choice: aya rẹ̀
  alternative: obìnrin náà
  rationale: Mátíù ń sọ̀rọ̀ ní ìbámu pẹ̀lú ipò òfin àti àṣà ìgbéyàwó wọn. ‘Aya rẹ̀’ kò sọ pé ìbálòpọ̀ ti wáyé; ẹsẹ 25 ló ṣàlàyé ọ̀ràn yẹn.
- issue: Ìtumọ̀ κύριος nínú ἄγγελος κυρίου
  choice: áńgẹ́lì Olúwa
  alternative: áńgẹ́lì Yáhwè
  rationale: ‘Olúwa’ pa ọ̀nà tí Gíríìkì gbà sọ ọ́ mọ́, ó sì bá ọ̀rọ̀ Bíbélì Yorùbá tí ó ṣeé lóye mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘jí lójú oorun’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, a sì fi àmì àlàyé sí ‘mú … wá sọ́dọ̀ ara rẹ̀’ nítorí fífẹ̀ ìtumọ̀ παραλαμβάνω.
