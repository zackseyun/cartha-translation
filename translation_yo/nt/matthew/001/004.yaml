id: MAT.1.4
reference: Matthew 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: yo
  text: Árámù[a] sì bí Ámínádábù, Ámínádábù sì bí Náásónì, Náásónì sì bí Sálímónì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Rámù.” Ọ̀rọ̀ Gíríìkì ní Árámù (Ἀρὰμ), ṣùgbọ́n “Rámù” ni fọ́ọ̀mù orúkọ náà nínú àkọsílẹ̀ ìran Hébérù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Árámù
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì Ἀράμ ní ọ̀nà tó bá ìró Yorùbá mu; a fi ‘Rámù’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí orúkọ Hébérù tí ọ̀pọ̀ ìtumọ̀ máa ń lò.
- source_word: δὲ
  choice: sì
  rationale: Nínú ìtàn ìran yìí, δέ ń so ìpele kọ̀ọ̀kan mọ́ èkejì, kì í ṣe àmì ìtakora líle. ‘Sì’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìtẹ̀síwájú yìí.
- source_word: ἐγέννησεν
  choice: bí
  rationale: Nínú àkọsílẹ̀ ìran, γεννάω túmọ̀ sí pé ọkùnrin kan ni baba ẹni tí a dárúkọ lẹ́yìn rẹ̀. ‘Bí’ jẹ́ ọ̀rọ̀ Yorùbá kúkúrú, àdánidá, tí a sì mọ̀ dáadáa nínú àkọsílẹ̀ ìran; àyíká ọ̀rọ̀ fi hàn pé ìbímọ̀ nípasẹ̀ baba ni a ń sọ.
- source_word: Ἀμιναδάβ
  choice: Ámínádábù
  rationale: Ìkọ̀wé yìí mú orúkọ Gíríìkì náà wọ ìró àti ìlànà sílẹ́bù Yorùbá láì sọ ìdánimọ̀ rẹ̀ nù.
- source_word: Ναασσών
  choice: Náásónì
  rationale: A tẹ̀lé fọ́ọ̀mù Gíríìkì Ναασσών ní pẹkipẹki, pẹ̀lú fáwẹ́lì ìparí tó jẹ́ kí orúkọ náà rọrùn láti pè ní Yorùbá.
- source_word: Σαλμών
  choice: Sálímónì
  rationale: A ṣe àkọsílẹ̀ Σαλμών ní ọ̀nà tó bá ètò ìró Yorùbá mu, nígbà tí a pa ìdánimọ̀ orúkọ ẹni nínú ìran náà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. A lo àtúnsọ ìran ‘X sì bí Y,’ èyí tó jẹ́ kedere, ọlọ́lá, tí ó sì wọ́pọ̀ nínú Yorùbá. Àtúnṣe orúkọ tẹ̀lé ẹ̀rí Gíríìkì ní àkọ́kọ́, nígbà tí a mú wọn bá ìró Yorùbá mu.
