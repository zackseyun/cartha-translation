id: MAT.24.11
reference: Matthew 24:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: yo
  text: Ọ̀pọ̀ wòlíì èké yóò sì dìde,[b] wọ́n yóò sì ṣì ọ̀pọ̀ ènìyàn lọ́nà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n yóò tan ọ̀pọ̀ ènìyàn jẹ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó gbé ọ̀pọ̀ wòlíì èké dìde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọ̀pọ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi iye tí ó pọ̀ hàn, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: ψευδοπροφῆται
  choice: èké wòlíì
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí àwọn wòlíì tí kì í ṣe òótọ́ tàbí tí ń tan ènìyàn jẹ; ‘èké wòlíì’ jẹ́ gbólóhùn Bíbélì Yorùbá tí ó mọ́gbọ́n dání.
- source_word: ἐγερθήσονται
  choice: yóò dìde
  rationale: ‘Dìde’ lè sọ nípa bí àwọn ẹni wọ̀nyí yóò ṣe farahàn tàbí bẹ̀rẹ̀ sí í ṣiṣẹ́ láìfi dandan túmọ̀ sí àjíǹde kúrò nínú òkú; àṣàyàn míì wà nínú àlàyé ìsàlẹ̀.
- source_word: πλανήσουσιν
  choice: wọn yóò sì ṣi ... lọ́nà
  rationale: Ó pa àwòrán ìṣìnà inú ọ̀rọ̀ Gíríìkì mọ́, ó sì lè gba ìtànjẹ, ìkọ́ni àṣìṣe, tàbí ìdarí sí ọ̀nà búburú láìdín ìtumọ̀ náà kù.
- source_word: πολλούς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Fífi ‘ènìyàn’ kún un mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere ní Yorùbá, nígbà tí ó ṣì pa ìtumọ̀ ‘ọ̀pọ̀’ mọ́.
- source_word: καὶ ... καὶ
  choice: sì ... sì
  rationale: Àtúnlò ‘sì’ so àwọn ìṣe ọjọ́ iwájú méjèèjì pọ̀ lọ́nà àdánidá, ó sì pa agbára ìkìlọ̀ tí ń tẹ̀ síwájú mọ́.
theological_decisions:
- issue: Irú ìṣìnà tí πλανήσουσιν ń sọ̀rọ̀ nípa rẹ̀
  choice: Ẹsẹ̀ náà kìlọ̀ pé àwọn èké wòlíì yóò ṣi ọ̀pọ̀ ènìyàn lọ́nà, láìsọ ọ̀nà pàtó tàbí bí ìṣìnà náà yóò ṣe jinlẹ̀ tó.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìtànjẹ nínú ẹ̀kọ́ ìgbàgbọ́, ìwà, tàbí ọ̀ràn ọjọ́ ìkẹyìn ní pàtàkì.
  rationale: πλανάω ní ìtumọ̀ gbígbòòrò; ìtumọ̀ Yorùbá náà kò fi ẹsẹ̀ náà mọ́ ẹ̀ka ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
- issue: Ìtumọ̀ fọ́ọ̀mù pásífù ἐγερθήσονται
  choice: ‘Yóò dìde’ ni a lò gẹ́gẹ́ bí ìfarahàn tàbí ìbẹ̀rẹ̀ iṣẹ́ àwọn èké wòlíì.
  alternative: ‘A ó jí wọn dìde’ tàbí ‘a ó gbé wọn dìde.’
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ pásífù, ṣùgbọ́n ní àyíká yìí ó lè jẹ́ ọ̀rọ̀ àdánidá fún bí àwọn ẹni kan ṣe ń farahàn. Àlàyé ìsàlẹ̀ pa ìtumọ̀ pásífù náà mọ́ láìjẹ́ kí ọ̀rọ̀ àkọ́kọ́ dà bí ẹni pé ó ń sọ nípa àjíǹde.
translation_notes:
  register: Yorùbá àgbàlágba tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. ‘Èké wòlíì’ pa ìró Bíbélì mọ́, ‘ṣi ... lọ́nà’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìdarí ènìyàn sí ìṣìnà.
