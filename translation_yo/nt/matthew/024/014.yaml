id: MAT.24.14
reference: Matthew 24:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: yo
  text: A ó sì kéde ìhìn rere yìí ti ìjọba ní gbogbo ayé[a] gẹ́gẹ́ bí ẹ̀rí fún gbogbo àwọn orílẹ̀-èdè[b]; nígbà náà ni òpin yóò dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní gbogbo ilẹ̀ tí ènìyàn ń gbé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún gbogbo àwọn ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: a ó kéde
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ọjọ́ iwájú ní fọ́ọ̀mù àìṣe-taara, ó sì tẹnumọ́ pípolongo ní gbangba. “A ó kéde” jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ yẹn mọ́ láìfi ọ̀rọ̀ ṣọ́ọ̀ṣì kan sí i.
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí túmọ̀ sí ìròyìn rere tàbí ìhìn ayọ̀. “Ìhìn rere” ṣe kedere fún òǹkàwé òde òní, ó sì yẹ fún ọ̀rọ̀ nípa ìjọba Ọlọ́run.
- source_word: τῆς βασιλείας
  choice: ti ìjọba
  rationale: Ìtumọ̀ yìí tẹ̀ lé ìbáṣepọ̀ genitive inú Gíríìkì, ó sì jẹ́ kí “ìhìn rere ti ìjọba” lè pa ìwọ̀n àìṣedéédé mọ́ láàárín ohun tí ó jẹ́ ti ìjọba àti ohun tí ó jẹ́ nípa ìjọba.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: ní gbogbo ayé
  rationale: οἰκουμένη ń tọ́ka sí gbogbo ilẹ̀ tí ènìyàn ń gbé tàbí ayé ènìyàn. “Ní gbogbo ayé” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì pa ìtànkálẹ̀ tó gbòòrò mọ́.
- source_word: εἰς μαρτύριον
  choice: láti ṣe ẹ̀rí
  rationale: Gbólóhùn yìí lè fi ète tàbí àbájáde hàn. “Láti ṣe ẹ̀rí” pa agbára ọ̀rọ̀ ẹ̀rí mọ́ láìpinnu bóyá ẹ̀rí náà wà fún wọn tàbí lòdì sí wọn.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: fún gbogbo àwọn orílẹ̀-èdè
  rationale: ἔθνη níbí ní ìtànkálẹ̀ sí àwọn orílẹ̀-èdè tàbí àwọn ènìyàn ayé, kì í ṣe dandan àwọn Kèfèrí ní ìyàtọ̀ sí àwọn Júù. “Gbogbo àwọn orílẹ̀-èdè” pa àwòrán Gíríìkì àti ìwọ̀n àgbáyé mọ́.
- source_word: ἥξει
  choice: yóò dé
  rationale: ἥκω túmọ̀ sí láti dé tàbí wá. Ní Yorùbá, “òpin yóò dé” jẹ́ àdánidá ju “òpin yóò wá” lọ nínú àyíká yìí.
- source_word: τὸ τέλος
  choice: òpin
  rationale: “Òpin” ni ìtumọ̀ tó ṣe kedere jù lọ, ó sì yẹra fún fífi ètò ẹ̀kọ́ nípa ìgbà ìkẹyìn tí kò hàn gbangba sínú ẹsẹ náà.
theological_decisions:
- issue: Ìwọ̀n οἰκουμένη àti ἔθνη nínú ọ̀rọ̀ nípa òpin
  choice: 'Lo èdè tó ní ìwọ̀n àgbáyé: “ní gbogbo ayé” àti “fún gbogbo àwọn orílẹ̀-èdè.”'
  alternative: “Ní gbogbo ilẹ̀ tí ènìyàn ń gbé” àti “fún gbogbo àwọn ènìyàn.”
  rationale: Ẹsẹ náà fi ìtànkálẹ̀ tó gbòòrò hàn ṣáájú “òpin,” ṣùgbọ́n kò yẹ kí ìtumọ̀ náà fi dandan mọ́ Ilẹ̀ Ọba Róòmù nìkan tàbí ètò iṣẹ́ ìránṣẹ́ àti ìgbà ìkẹyìn kan pàtó.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A lo “kéde” dípò ọ̀rọ̀ ṣọ́ọ̀ṣì tó le ju, a sì lo “ìhìn rere” gẹ́gẹ́ bí ọ̀rọ̀ tó ṣe kedere. Àwọn àlàyé ìsàlẹ̀ méjèèjì ní àmì tó bá wọn mu nínú ọ̀rọ̀ pàtàkì.
