revisions:
- from: 'Ṣùgbọ́n ẹ mọ èyí pé: Ká ní baálé ilé náà mọ apá ìṣọ́ alẹ́ wo ni olè náà yóò dé[a], ìbá wà lójúfò, kì bá sì jẹ́ kí a já wọ ilé rẹ̀[b].'
  to: 'Ṣùgbọ́n ẹ mọ èyí: Bí baálé ilé náà bá ti mọ ìṣọ́ wo ní òru tí olè náà ń bọ̀[a], ìbá ti wà lójúfò, kò sì ní jẹ́ kí wọ́n já ilé rẹ̀ wọlé[b].'
  rationale: Àtúnṣe náà mú ìbáṣepọ̀ àsìkò àti ipò-àìṣẹlẹ̀ nínú Gíríìkì hàn kedere, ó sì lo àwọn ọ̀rọ̀ Yorùbá tó rọrùn láìsọnù ìtumọ̀ ìṣọ́ òru tàbí àwòrán híhu ògiri já. Àwọn àmì àlàyé ìsàlẹ̀ dúró ní ibi tí ó bá ọ̀rọ̀ wọn mu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:04Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìṣètò ipò-àìṣẹlẹ̀ ("bí ó bá ti mọ ... ìbá ti ...") àti ìtumọ̀ pàtàkì ẹsẹ náà dáadáa. Síbẹ̀, "olè náà yóò dé" dín ipa ìwò lọwọlọwọ nínú ἔρχεται kù díẹ̀; "ń bọ̀" dára jù nínú àpẹẹrẹ yìí. "Ìṣọ́ wo ní òru" sì sún mọ́ ποίᾳ φυλακῇ ju "apá ìṣọ́ alẹ́ wo" lọ.
  naturalness: '"Ká ní ... ìbá ... kì bá" ṣeé lóye, ṣùgbọ́n ìkọ̀lé "Bí ... bá ti mọ ... ìbá ti ..." jẹ́ Yorùbá ìwé mímọ́/àjùmọ̀lò tó rọrùn, tó sì fi ìmọ̀ tí ó yẹ kó ti wà ṣáájú hàn kedere. A tún ṣe gbolóhùn jíjàwọlé náà ní ọ̀nà tí ó wọ́pọ̀.'
  terminology: '"Baálé ilé" yẹ fún οἰκοδεσπότης nínú àpẹẹrẹ yìí. "Wà lójúfò" yẹ fún ἐγρηγόρησεν. A pa ìtumọ̀ gangan διορυχθῆναι—híhu/gígbẹ́ ògiri já—mọ́ nínú àlàyé ìsàlẹ̀, nígbà tí ọ̀rọ̀ àkọ́kọ́ ń lo ìtumọ̀ àjùmọ̀lò "já ... wọlé."'
  issues:
