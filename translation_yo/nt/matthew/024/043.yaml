    rationale: '"Apá ìṣọ́ alẹ́ wo" wúlò ṣùgbọ́n ó wuwo díẹ̀. "Ìṣọ́ wo ní òru" jẹ́ ohun tí a máa ń sọ ní Yorùbá, ó sì pa ìpín òru tí φυλακή ń tọ́ka sí mọ́.'
  - severity: low
