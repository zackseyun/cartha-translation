id: MAT.24.43
reference: Matthew 24:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: yo
  text: 'Ṣùgbọ́n ẹ mọ èyí: Bí baálé ilé náà bá ti mọ ìṣọ́ wo ní òru tí olè náà ń bọ̀[a], ìbá ti wà lójúfò, kò sì ní jẹ́ kí wọ́n já ilé rẹ̀ wọlé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ní ìṣọ́ wo.” Ìṣọ́ jẹ́ ọ̀kan lára àwọn apá tí a pín òru sí.
    reason: cultural_note
  - marker: b
    text: Ní tààràtà, “kí a gbẹ́ ògiri ilé rẹ̀ já.” Èyí ń tọ́ka sí bí olè ṣe lè gbẹ́ tàbí hú ògiri ilé já láti wọ inú rẹ̀ ní ayé àtijọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Ṣùgbọ́n ẹ mọ èyí pé
  rationale: Ó pa ìyípadà ọ̀rọ̀ tí δέ mú wá àti àṣẹ tààrà sí àwọn olùgbọ́ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: οἰκοδεσπότης
  choice: baálé ilé náà
  rationale: “Baálé ilé” ń tọ́ka sí ẹni tó jẹ́ olórí agbo ilé, láìfi èrò òde òní nípa jíjẹ́ olówó ilé kún ọ̀rọ̀ náà.
- source_word: ποίᾳ φυλακῇ
  choice: apá ìṣọ́ alẹ́ wo
  rationale: Ó mú ìtumọ̀ φυλακή gẹ́gẹ́ bí ọ̀kan lára àwọn apá tí a pín òru sí hàn, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ὁ κλέπτης ἔρχεται
  choice: olè náà yóò dé
  rationale: Nínú gbólóhùn àròsọ tí kò ṣẹlẹ̀ yìí, “yóò dé” fi ohun tí baálé ilé ìbá ti mọ ṣáájú hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐγρηγόρησεν ἂν
  choice: ìbá wà lójúfò
  rationale: “Wà lójúfò” ní ìtumọ̀ dídúró jíjí àti ṣíṣọ́ra, ó sì bá àwòrán olè tó ń wá lóru mu.
- source_word: οὐκ ἂν εἴασεν
  choice: kì bá sì jẹ́ kí
  rationale: Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ohun tí ẹni náà kì bá ti gbà láàyè.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: kí a já wọ ilé rẹ̀
  rationale: Ó sọ ìtumọ̀ jíjá wọ ilé láti jalè ní Yorùbá tó ṣe kedere; àlàyé ìtumọ̀ gangan ti ‘híhu já’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àwòrán οἰκοδεσπότης
  choice: baálé ilé náà
  alternative: olówó ilé náà
  rationale: Èyí jẹ́ àpẹẹrẹ, kì í ṣe oyè ẹ̀kọ́ ìgbàgbọ́. “Baálé ilé” pa ipa ẹni tó jẹ́ olórí agbo ilé mọ́, láìfi èrò pé ó ní ilé náà nípa òfin kún un.
- issue: Bí a ṣe gbé àwòrán jíjá ilé wọlé ní ayé àtijọ́ kalẹ̀
  choice: kí a já wọ ilé rẹ̀
  alternative: kí a hú ilé rẹ̀ já
  rationale: Ọ̀rọ̀ àkọ́kọ́ sọ ní pàtó nípa híhu ògiri tàbí ilé já. A yan ọ̀rọ̀ Yorùbá tó ń sọ ìṣe olè náà ní kedere, a sì pa àwòrán ìtàn náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ká ní … ìbá … kì bá sì …” fi ipò àròsọ tí kò ṣẹlẹ̀ hàn lọ́nà àdánidá, “wà lójúfò” sì rọrùn fún òǹkàwé òde òní.
