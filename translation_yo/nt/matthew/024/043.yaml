    issue: Ìkọ̀lé ipò-àìṣẹlẹ̀ àti àsìkò ìṣe
    rationale: '"Ká ní baálé ilé náà mọ ... olè náà yóò dé" lè ṣiṣẹ́, ṣùgbọ́n "Bí ... bá ti mọ ... tí ... ń bọ̀, ìbá ti ..." mú pluperfect ᾔδει, ìwò lọwọlọwọ ἔρχεται, àti apodosis ἐγρηγόρησεν ἄν hàn lọ́nà tó dájú síi.'
  - severity: low
