id: MAT.24.26
reference: Matthew 24:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: yo
  text: Nítorí náà, bí wọ́n bá sọ fún yín pé, “Wò ó, ó wà ní aginjù[a],” ẹ má ṣe jáde lọ; “Wò ó, ó wà nínú àwọn yàrá inú ilé[b],” ẹ má ṣe gbà á gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní aṣálẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú àwọn yàrá ìpamọ́” tàbí “nínú àwọn yàrá ìkọ̀kọ̀.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn yàrá inú ilé tàbí àwọn yàrá àdáni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Nítorí náà, bí ... bá
  rationale: “Nítorí náà” ń fi ìbáṣepọ̀ ọ̀rọ̀ yìí pẹ̀lú ìkìlọ̀ tó ṣáájú hàn, “bí ... bá” sì ń pa ìtumọ̀ àídájú mọ́.
- source_word: εἴπωσιν ὑμῖν
  choice: wọ́n bá sọ fún yín
  rationale: Ẹni kẹta ọ̀pọ̀ nínú Gíríìkì kò tọ́ka sí ẹgbẹ́ kan pàtó; “wọ́n” pa àìsọ ẹni náà mọ́.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ tí a fi ń pe àfiyèsí sí ohun kan lẹ́sẹ̀kẹsẹ̀, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: “Aginjù” lè túmọ̀ sí ilẹ̀ ìdáhoro tàbí aṣálẹ̀, láìfi dandan mú àwòrán ilẹ̀ yanrìn nìkan wọ inú ọ̀rọ̀ náà.
- source_word: ἐστίν
  choice: ó wà
  rationale: Ọ̀rọ̀ Gíríìkì fi ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ sílẹ̀ fún àyíká ọ̀rọ̀; arọ́pò-orúkọ “ó” jẹ́ dandan ní Yorùbá, ṣùgbọ́n a kò fi oyè bí “Mèsáyà” kún un.
- source_word: μὴ ἐξέλθητε
  choice: ẹ má ṣe jáde lọ
  rationale: Ó jẹ́ àṣẹ ìdènà, “jáde lọ” sì pa ìtumọ̀ ìṣípò kúrò ní ibi kan mọ́.
- source_word: ἐν τοῖς ταμείοις
  choice: nínú àwọn yàrá inú ilé
  rationale: ταμεῖον lè jẹ́ yàrá inú ilé, yàrá ìpamọ́, tàbí yàrá ìkọ̀kọ̀; àṣàyàn yìí gbòòrò tó láti má ṣe pinnu irú yàrá náà ju ohun tí Gíríìkì sọ lọ.
- source_word: μὴ πιστεύσητε
  choice: ẹ má ṣe gbà á gbọ́
  rationale: “Á” tọ́ka sí ẹ̀sùn tí wọ́n sọ, kì í ṣe dandan pé ó tọ́ka sí àwọn tí wọ́n sọ ọ́.
theological_decisions:
- issue: Ẹni tí ἐστίν ń tọ́ka sí láìdárúkọ rẹ̀
  choice: A lo “ó wà,” láìfi orúkọ tàbí oyè kún un.
  alternative: “Mèsáyà wà níbẹ̀” tàbí “ó wà níbẹ̀”
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ẹni tí wọ́n ń kéde pé ó dé, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò tún pe orúkọ tàbí oyè rẹ̀; ìtumọ̀ náà pa àìsọ tààrà yìí mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. Ìtòlẹ́sẹẹsẹ àwọn gbolohun méjèèjì ni a pa mọ́ pẹ̀lú àmì adádúró, láìfi “tàbí” tí kò sí nínú Gíríìkì kún un.
