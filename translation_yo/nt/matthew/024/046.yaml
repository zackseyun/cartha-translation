source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: yo
  text: Alábùkún-fún ni ìránṣẹ́ náà tí olúwa rẹ̀, nígbà tí ó bá dé, yóò bá ní ṣíṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Alábùkún-fún
  rationale: Ó sọ ipò ẹni tí Ọlọ́run ṣe ojúrere sí, ó sì bá ìlò ẹ̀sìn àti èdè Yorùbá ọlọ́lá mu.
- source_word: δοῦλος
  choice: ìránṣẹ́
  rationale: Nínú àkópọ̀ òwe yìí, “ìránṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tó wà lábẹ́ àṣẹ olúwa ilé, láìfi ìtumọ̀ ìsìnrú tí ọ̀rọ̀ Gíríìkì lè ní sílẹ̀ pátápátá.
- source_word: κύριος
  choice: olúwa
  rationale: “Olúwa” pa ìbáṣepọ̀ àṣẹ tó wà láàárín κύριος àti δοῦλος mọ́, ó sì yẹra fún yíyí ọ̀rọ̀ náà sí “ọ̀gá” nìkan.
- source_word: οὕτως ποιοῦντα
  choice: tí ó sì ń ṣe bẹ́ẹ̀
  rationale: Ó tọ́ka padà sí iṣẹ́ tí a ṣàpèjúwe ṣáájú, gẹ́gẹ́ bí Gíríìkì ṣe ṣe, láìṣàlàyé ohun tí ẹsẹ yìí kò tún sọ.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú òwe náà
  choice: olúwa rẹ̀
  alternative: ọ̀gá rẹ̀
  rationale: “Olúwa” pa ìró ẹ̀kọ́ ìsìn àti ìbáṣepọ̀ olúwa–ìránṣẹ́ mọ́, ṣùgbọ́n kò fi tipátipá sọ pé ọ̀rọ̀ náà jẹ́ orúkọ àkọ́lé Ọlọ́run níbí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmi ohùn ní kíkún. Ìṣètò gbolóhùn náà jẹ́ àdánidá ní Yorùbá, nígbà tó ń pa ìtumọ̀ àti ìfojúsọ́nà ìpadàbọ̀ olúwa mọ́.
