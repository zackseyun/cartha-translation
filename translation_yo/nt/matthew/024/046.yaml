  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi μακάριος, δοῦλος, κύριος, ἐλθών, àti οὕτως ποιοῦντα hàn dáadáa. Síbẹ̀, ìṣètò gbolóhùn nínú àkọ́pamọ́ náà mú kí ‘tí ó sì ń ṣe bẹ́ẹ̀’ dà bí gbolóhùn alákọ̀ọ́rẹ́, dípò kí ó jẹ́ ohun tí olúwa rí ìránṣẹ́ náà ń ṣe. Àtúnṣe náà so ‘ní ṣíṣe bẹ́ẹ̀’ mọ́ ‘yóò bá,’ gẹ́gẹ́ bí ìbáṣepọ̀ participle ποιοῦντα pẹ̀lú εὑρήσει.
  naturalness: ‘Alábùkún-fún,’ ‘ìránṣẹ́,’ àti ‘olúwa rẹ̀’ jẹ́ Yorùbá ọlọ́lá tí ó yẹ. ‘Yóò bá ní ṣíṣe bẹ́ẹ̀’ jẹ́ ọ̀nà kedere àti àdánidá láti sọ pé olúwa náà yóò rí ìránṣẹ́ náà nígbà tó ń ṣe ohun náà.
  terminology: A pa ‘olúwa’ mọ́ fún κύριος, láìfi ìdánimọ̀ Ọlọ́run kún ọ̀rọ̀ òwe náà. ‘Ìránṣẹ́’ pa ìbáṣepọ̀ ẹni tó wà lábẹ́ àṣẹ olúwa mọ́. Kò sí àlàyé ẹ̀sìn tàbí ẹsẹ míràn tí a fi kún un.
