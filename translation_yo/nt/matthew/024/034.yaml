id: MAT.24.34
reference: Matthew 24:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: yo
  text: “Lóòótọ́ ni mo sọ fún yín pé, ìran yìí kì yóò kọjá lọ rárá títí gbogbo nǹkan wọ̀nyí yóò fi ṣẹlẹ̀[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn ènìyàn yìí’ tàbí ‘ẹ̀yà yìí.’ Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ tó gbòòrò sí i, ṣùgbọ́n ‘ìran’ ni ìtumọ̀ tó tààrà jù lọ níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó fi ìmúdájú ọ̀rọ̀ Jesu hàn ní Yorùbá àdánidá, láì lo àkọsílẹ̀ ohùn ‘Àmín’ tí ó lè dà bí ìdáhùn àdúrà.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtọ́ka sí àwọn olùgbọ́ púpọ̀ mọ́.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ ló ń ṣe àgbékalẹ̀ gbólóhùn ohun tí Jesu sọ ní Yorùbá.
- source_word: οὐ μὴ παρέλθῃ
  choice: kì yóò kọjá lọ rárá
  rationale: Àpapọ̀ ‘kì yóò’ àti ‘rárá’ fi agbára ìkọ̀ emphatic Gíríìkì οὐ μή hàn, nígbà tí ‘kọjá lọ’ pa àwòrán ọ̀rọ̀ παρέρχομαι mọ́.
- source_word: ἡ γενεὰ αὕτη
  choice: ìran yìí
  rationale: ‘Ìran yìí’ ni ìtumọ̀ tààrà jù lọ fún γενεά, ó sì pa àìdánilójú ìtumọ̀ ọ̀rọ̀ náà mọ́ láì fi èrò nípa ìgbà ìkẹyìn kún un.
- source_word: ἕως ἂν
  choice: títí … yóò fi
  rationale: Ètò ‘títí … yóò fi’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ààlà ọjọ́ iwájú tí ἕως ἂν ń tọ́ka sí.
- source_word: πάντα ταῦτα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nǹkan tí fọ́ọ̀mù nọ́ńbà púpọ̀ Gíríìkì tọ́ka sí mọ́.
- source_word: γένηται
  choice: ṣẹlẹ̀
  rationale: Nínú àyíká yìí, γίνομαι túmọ̀ sí pé àwọn ìṣẹ̀lẹ̀ náà yóò wáyé; ‘ṣẹlẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ‘ἡ γενεὰ αὕτη’ nínú àsọyé nípa àwọn ohun tó ń bọ̀
  choice: ìran yìí
  alternative: àwọn ènìyàn yìí; ẹ̀yà yìí
  rationale: A yan ìtumọ̀ ọ̀rọ̀ tó tààrà jù lọ, kí a má bàa yanju àríyànjiyàn nípa àsọtẹ́lẹ̀ ọjọ́ ìkẹyìn nínú ìtumọ̀ Bíbélì fúnra rẹ̀. Àlàyé ìsàlẹ̀ ojú ewé jẹ́ kí olùkà mọ àwọn ìtumọ̀ tó gbòòrò sí i.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún àwọn olùkà òde òní. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà wà ní kíkún níbi tí ó ti yẹ; ‘nǹkan’ ni a kọ ní ìbámu pẹ̀lú àkọtọ̀ Yorùbá.
