id: MAT.24.19
reference: Matthew 24:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: yo
  text: Ṣùgbọ́n, ègbé ni fún àwọn tí ó lóyún àti àwọn tí ń fún ọmọ lọ́mú ní àwọn ọjọ́ wọ̀nyẹn![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “àwọn obìnrin tí ó lóyún àti àwọn obìnrin tí ń fún ọmọ lọ́mú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ
  choice: ègbé ni fún
  rationale: Ó pa agbára ọ̀rọ̀ àsọtẹ́lẹ̀ àti ẹkún nítorí ìpọ́njú tó ń bọ̀ mọ́; ó lágbára ju ọ̀rọ̀ ìbànújẹ́ lásán lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré hàn láti inú ìkìlọ̀ tó ṣáájú, láìjẹ́ kí ìtakora náà le jù.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: àwọn tí ó lóyún
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti túmọ̀ àṣà-ọrọ Gíríìkì náà, tó túmọ̀ sí àwọn tó ní oyún.
- source_word: ταῖς θηλαζούσαις
  choice: àwọn tí ń fún ọmọ lọ́mú
  rationale: Ó sọ ìṣe fífún ọmọ ní ọmú ní kedere, ó sì pa ìṣòro pàtàkì tí ipò náà yóò mú wá mọ́.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ní àwọn ọjọ́ wọ̀nyẹn
  rationale: Ó jẹ́ gbólóhùn àkókò tó ṣe déédé pẹ̀lú orísun, tó sì jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Àwọn tí àwọn àpólà-orúkọ abo náà ń tọ́ka sí
  choice: àwọn tí ó lóyún àti àwọn tí ń fún ọmọ lọ́mú
  alternative: àwọn obìnrin tí ó lóyún àti àwọn obìnrin tí ń fún ọmọ lọ́mú
  rationale: Èdè Gíríìkì fi ìbálòpọ̀ abo hàn ní kedere, ṣùgbọ́n Yorùbá kò ní ìyàtọ̀ abo nínú ‘àwọn tí’. Ìtumọ̀ yìí jẹ́ àdánidá, ipò oyún àti fífún ọmọ lọ́mú sì mú ẹni tí a ń tọ́ka sí yéni láìfi ọ̀rọ̀ tí kò sí nínú orísun kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. A fi àmì ohùn sí ibi tó bá èdè àdánidá mu, a sì lo ‘fún ọmọ lọ́mú’ gẹ́gẹ́ bí ọ̀rọ̀ tí gbogbo ènìyàn lè lóye fún fífún ọmọ ní ọmú.
