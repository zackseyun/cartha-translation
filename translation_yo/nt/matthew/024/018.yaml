review_pass:
  verdict: revise
  source_fidelity: 'Àkọsílẹ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ìdènà ni a fi fún ẹni tó wà ní oko kí ó má lọ gba aṣọ rẹ̀. Síbẹ̀, “tí ó bá wà” fi ìdíwọ̀n/ìṣèjọba kan kún un tí kò hàn nínú ὁ ἐν τῷ ἀγρῷ, àti “gba” kì í ṣe ọ̀nà tó pé jù fún ἆραι (‘mú/take’) nínú àyíká yìí.'
  naturalness: “Má ṣe padà sẹ́yìn láti mú” jẹ́ ọ̀nà Yorùbá boṣewa, ti òde òní, tó sì ṣàfihàn ìkìlọ̀ pàjáwìrì náà ní kedere. “Aṣọ òde” jẹ́ ọ̀rọ̀ tó rọrùn àti adayeba fún aṣọ ìta/ìbòrí.
  terminology: “Ẹni tí ó wà ní oko” pa ìtọ́ka sí ẹni kan mọ́ láì fi í mọ́ akọ nìkan. “Aṣọ òde” bá ἱμάτιον mu gẹ́gẹ́ bí aṣọ tí a wọ lókè; àlàyé ìsàlẹ̀ ń pa àwọn ìṣàfilọ́lẹ̀ ọrọ̀ míì mọ́.
  issues:
  - severity: medium
    issue: “tí ó bá wà”
    rationale: “Bá” ń fi èrò ‘bí ẹni bá wà’/ìpèníjà kan kún un. Ọ̀rọ̀ Gíríìkì náà ń tọ́ka taara sí ẹni tí ó wà ní oko.
  - severity: medium
    issue: “lọ gba” fún ἆραι
    rationale: “Gba” lè túmọ̀ sí receive, obtain, tàbí take; níbí ἆραι túmọ̀ sí mú ohun-ìní ẹni. “Láti mú” jẹ́ kedere sí i, ó sì pa ìbáṣepọ̀ ète (infinitive of purpose) mọ́.
  - severity: low
    issue: Àṣàyàn aṣọ nínú àlàyé ìsàlẹ̀
    rationale: Níwọ̀n bí ìtumọ̀ àkọ́kọ́ ti jẹ́ “aṣọ òde,” ó yẹ kí àlàyé ìsàlẹ̀ má tún sọ ọ́ gẹ́gẹ́ bí àṣàyàn mìíràn; ó yẹ kí ó fún “aṣọ rẹ̀” àti “aṣọ àwọ̀lékè rẹ̀” nípò àṣàyàn.
  revised_text: Kí ẹni tí ó wà ní oko má ṣe padà sẹ́yìn láti mú aṣọ òde rẹ̀.[a]
