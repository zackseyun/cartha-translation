source:
  edition: SBLGNT
  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: yo
  text: Kí ẹni tí ó wà ní oko má ṣe padà sẹ́yìn láti mú aṣọ òde rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ rẹ̀” tàbí “aṣọ àwọ̀lékè rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: ẹni tí ó bá wà ní oko
  rationale: Gbólóhùn yìí ń tọ́ka sí ẹnikẹ́ni tó wà ní oko, láì fi ìtumọ̀ náà mọ́ ọkùnrin nìkan; ó sì pa agbára ẹni kan gẹ́gẹ́ bí àpẹẹrẹ mọ́.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: má ṣe yí padà lọ
  rationale: Àṣẹ ìdènà ni ọ̀rọ̀ Gíríìkì náà; ‘má ṣe yí padà lọ’ jẹ́ Yorùbá àdánidá tó fi ìkìlọ̀ pàjáwìrì náà hàn.
- source_word: ἆραι
  choice: gba
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà sọ ète yíyí padà, ìyẹn láti lọ gba ohun kan.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: aṣọ àwọ̀lékè rẹ̀
  rationale: ἱμάτιον sábà máa ń jẹ́ aṣọ tí a wọ sí òde lórí aṣọ mìíràn. ‘Aṣọ àwọ̀lékè’ ṣe kedere sí òǹkàwé Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn tó gbòòrò sí i pamọ́.
theological_decisions:
- issue: Ìṣàpẹẹrẹ akọ nínú ọ̀rọ̀ arọ́pò orúkọ Gíríìkì
  choice: ẹni tí ó bá wà ní oko
  alternative: ọkùnrin tí ó wà ní oko
  rationale: Akọ ní gírámà ni ọ̀rọ̀ Gíríìkì, ṣùgbọ́n ó dúró fún ẹnikẹ́ni nínú ìkìlọ̀ yìí. Ìtumọ̀ náà kò fi ọ̀rọ̀ náà mọ́ akọ nìkan, ó sì pa ìtọ́ka sí ẹni kọ̀ọ̀kan mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún ìkìlọ̀ pàjáwìrì inú àyíká ẹsẹ̀ náà.
