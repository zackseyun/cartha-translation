  rationale: Àtúnṣe náà yọ ìdíwọ̀n tí “bá” fi kún ọ̀rọ̀ náà, ó sì rọ́pò “gba” pẹ̀lú “mú” láti ṣàfihàn ἆραι ní kedere. “Padà sẹ́yìn láti mú” pa ìdènà àti ète ìpadàsẹ́yìn mọ́, nígbà tí “aṣọ òde” àti àlàyé ìsàlẹ̀ ń ṣètọ́jú ibú ọrọ̀ ἱμάτιον.
