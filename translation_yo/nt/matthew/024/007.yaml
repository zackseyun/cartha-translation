id: MAT.24.7
reference: Matthew 24:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: yo
  text: Nítorí orílẹ̀-èdè yóò dìde sí orílẹ̀-èdè[a], ìjọba yóò sì dìde sí ìjọba, ìyàn àti ìmìtìtì ilẹ̀ yóò sì wáyé ní onírúurú ibi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò dìde lòdì sí orílẹ̀-èdè.” Lílò ọ̀rọ̀ náà ní èdè Gíríìkì ń fi ìbẹ̀rẹ̀ ìṣọ̀tá láàárín àwọn ènìyàn hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti ibi dé ibi” tàbí “ní ibi ọ̀tọ̀ọ̀tọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: yóò dìde sí
  rationale: Ọ̀rọ̀ náà nínú àṣà èdè yìí ń tọ́ka sí dídìde sí ẹlòmíràn pẹ̀lú ìṣọ̀tá; ó ń fi ìbẹ̀rẹ̀ ìjà hàn láì sọ pé Ọlọ́run ni ó gbé wọn dìde.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí.
- source_word: ἔθνος
  choice: orílẹ̀-èdè
  rationale: Ní ìbámu pẹ̀lú βασιλεία, ó túmọ̀ sí àwùjọ ènìyàn tàbí agbègbè olóṣèlú kan; ‘orílẹ̀-èdè’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù lọ níbí.
- source_word: ἐπὶ ἔθνος
  choice: sí orílẹ̀-èdè
  rationale: ἐπί pẹ̀lú accusative nínú àṣà èdè ìṣọ̀tá yìí túmọ̀ sí ‘lòdì sí’; nínú Yorùbá, ‘dìde sí’ sọ ìtumọ̀ náà lọ́nà àdánidá.
- source_word: βασιλεία
  choice: ìjọba
  rationale: Níhìn-ín ó tọ́ka sí ilẹ̀ tàbí agbára ìjọba kan, ó sì bá ‘orílẹ̀-èdè’ rìn ní ìfarawé.
- source_word: ἔσονται
  choice: yóò wáyé
  rationale: Èyí jẹ́ lílo εἰμί láti sọ pé àwọn ìṣẹ̀lẹ̀ náà yóò ṣẹlẹ̀; ‘yóò wáyé’ jẹ́ Yorùbá àdánidá.
- source_word: λιμοὶ
  choice: ìyàn
  rationale: Ó tọ́ka sí àìní oúnjẹ líle ní ọ̀pọ̀ ibi. Yorùbá sábà máa ń lo ‘ìyàn’ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ láì fi àmì ọ̀pọ̀ kún un.
- source_word: σεισμοὶ
  choice: ìmìtìtì ilẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìṣẹ̀lẹ̀ tí ilẹ̀ ń mì.
- source_word: κατὰ τόπους
  choice: láti ibì kan dé ibòmíràn
  rationale: Gbólóhùn náà ní agbára pínpín, ó ń tọ́ka sí àwọn ibi púpọ̀, kì í ṣe ibi kan ṣoṣo. Àlàyé ìsàlẹ̀ tún fi ‘ní onírúurú ibi’ hàn gẹ́gẹ́ bí yíyan mìíràn.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἔθνος nínú ọ̀rọ̀ nípa ìjà ìgbà ìkẹyìn
  choice: orílẹ̀-èdè
  alternative: àwọn ènìyàn; ẹ̀yà ènìyàn
  rationale: Ìfarawé rẹ̀ pẹ̀lú ‘ìjọba’ ń ṣe àtìlẹ́yìn fún ìtumọ̀ àwùjọ tàbí agbègbè olóṣèlú, láì dín un kù sí àwọn Kèfèrí tàbí ẹ̀yà kan pàtó.
- issue: Agbára future passive/middle ἐγερθήσεται
  choice: yóò dìde sí
  alternative: a ó gbé e dìde sí; yóò bẹ̀rẹ̀ sí í dojú kọ
  rationale: Ìtumọ̀ yìí pa ìbẹ̀rẹ̀ ìṣọ̀tá mọ́, ṣùgbọ́n kò fi okunfa láti ọ̀dọ̀ Ọlọ́run kún ohun tí ẹsẹ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àtúnṣe ìṣe náà nínú ‘ìjọba yóò sì dìde sí ìjọba’ jẹ́ àdánidá ní Yorùbá, ó sì mú ìfarawé Gíríìkì hàn kedere. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ.
