language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: yo
  text: Ṣùgbọ́n bí ìránṣẹ́ búburú náà[a] bá sọ nínú ọkàn rẹ̀ pé, ‘Ọ̀gá mi ń pẹ́[b],’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹrú búburú náà.” Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí “ìránṣẹ́” tàbí “ẹrú,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Olúwa mi ń pẹ́.” Níhìn-ín, “ọ̀gá” bá àyíká ilé inú àkàwé náà mu; ọ̀rọ̀ Gíríìkì náà ni kyrios.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” fi ipò àídájú tí ἐὰν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń sọ hàn, “ṣùgbọ́n” sì pa ìyàtọ̀ kékeré tí δέ mú wá mọ́.
- source_word: εἴπῃ
  choice: bá sọ
  rationale: Ìṣọ̀kan “bí ... bá sọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ipò àídájú náà, láìsọ ọ́ di ohun tí ó máa ń ṣẹlẹ̀ ní gbogbo ìgbà.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ìránṣẹ́ búburú náà
  rationale: “Búburú” sọ ìwà àìmọ́ rere tí κακός ń tọ́ka sí; “ìránṣẹ́” bá ojúṣe ẹni inú ilé mu ní àkàwé yìí, nígbà tí àmì “náà” pa agbára demonstrative ἐκεῖνος mọ́. “Ẹrú” ṣì jẹ́ ìtumọ̀ tó ṣeé ṣe, a sì fi í sínú àlàyé ìsàlẹ̀.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: nínú ọkàn ara rẹ̀
  rationale: Èyí pa àwòrán “nínú ọkàn” mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún èrò inú tàbí ọ̀rọ̀ tí ènìyàn ń sọ fún ara rẹ̀.
- source_word: Χρονίζει
  choice: ń pẹ́
  rationale: “Ń pẹ́” fi ìṣe tó ń bá a lọ hàn, ó sì sọ bí ìránṣẹ́ náà ṣe ń wo ìdádúró ọ̀gá rẹ̀ ní Yorùbá àdánidá.
- source_word: μου ὁ κύριος
  choice: Ọ̀gá mi
  rationale: Nínú àyíká ilé àti àkàwé yìí, κύριος túmọ̀ sí ẹni tó jẹ́ olórí ìránṣẹ́ náà. “Ọ̀gá mi” ṣe àjọṣe yẹn kedere láìfi oyè ẹ̀sìn tí kò pọn dandan kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú àkàwé ilé yìí
  choice: Ọ̀gá mi
  alternative: Olúwa mi
  rationale: Ní ipele ìtàn àkàwé náà, ọ̀rọ̀ náà ń tọ́ka sí olórí ìránṣẹ́ inú ilé. “Ọ̀gá” fi ìtumọ̀ ojú-ìtàn hàn kedere; àlàyé ìsàlẹ̀ sì pa “Olúwa” mọ́ gẹ́gẹ́ bí àṣàyàn, torí àwọn olùkà lè rí ẹni tí àkàwé náà ń tọ́ka sí ní ìjìnlẹ̀.
- issue: Bí a ṣe túmọ̀ δοῦλος nínú ẹsẹ yìí
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: Àkàwé náà tẹnu mọ́ ojúṣe ẹni tí a fi ilé sí lọ́wọ́ àti ìwà rẹ̀. “Ìránṣẹ́” jẹ́ Yorùbá àdánidá fún ipa yẹn, ṣùgbọ́n “ẹrú” tún lè ṣàfihàn ipò ìdè tí δοῦλος lè ní, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpéwọ̀n, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “bí ... bá” fún conditional, “nínú ọkàn ara rẹ̀” láti pa àwòrán orísun mọ́, àti “ń pẹ́” fún ìdádúró tó ń bá a lọ.
