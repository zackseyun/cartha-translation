id: MAT.24.47
reference: Matthew 24:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: yo
  text: Lóòótọ́ ni mo wí fún yín pé, yóò fi án ṣe alábòójútó lórí gbogbo ohun ìní rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun tí ó ní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìtẹnumọ́ àti ọlá inú ọ̀rọ̀ ìkéde Jesu jáde ní Yorùbá àdánidá, láì lo àfàwòrán ọ̀rọ̀ ‘Àmín.’
- source_word: λέγω ὑμῖν
  choice: mo wí fún yín
  rationale: Ó pa ìlànà ọ̀rọ̀ ìkéde náà mọ́, ó sì jẹ́ èdè Yorùbá ọlọ́lá tí ó ṣe kedere.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàfihàn gbólóhùn tí ó sọ ohun tí Jesu ń kéde.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: olùṣàkóso gbogbo ohun ìní rẹ̀
  rationale: Pẹ̀lú ‘fi í ṣe,’ ọ̀rọ̀ yìí sọ bí a ṣe yan ẹnì kan sí ipò àbójútó lórí gbogbo ohun tí ó jẹ́ ti ọ̀gá náà; ‘ohun ìní’ jẹ́ ọ̀rọ̀ Yorùbá ṣókí tí ó bá ìtumọ̀ náà mu.
- source_word: καταστήσει
  choice: yóò fi í ṣe olùṣàkóso
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí yíyan ẹnì kan sí ipò àbójútó, kì í ṣe fífi sí ibì kan lásán.
- source_word: αὐτόν
  choice: í
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ìránṣẹ́ ọkùnrin olóòtítọ́ àti ọlọ́gbọ́n tí a mẹ́nu kàn ṣáájú, ó sì pa ìtọ́kasí ẹyọ ọkùnrin inú Gíríìkì mọ́.
theological_decisions:
- issue: Irú èrè tàbí ojúṣe tí ọ̀gá fi lé ìránṣẹ́ náà lọ́wọ́
  choice: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí yíyan ìránṣẹ́ náà láti ṣàkóso gbogbo ohun ìní ọ̀gá rẹ̀.
  alternative: Kí a ṣàlàyé rẹ̀ nínú ìtumọ̀ gẹ́gẹ́ bí àṣẹ nínú ìjọ tàbí èrè ọ̀run ní ìgbà ìkẹyìn.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ sọ nípa fífi ojúṣe ìríjú tó gbòòrò sí i lé e lọ́wọ́ nínú àkàwé náà; ìtumọ̀ kò gbọ́dọ̀ fi ètò ẹ̀kọ́ ìgbàgbọ́ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
