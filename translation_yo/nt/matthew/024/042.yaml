id: MAT.24.42
reference: Matthew 24:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: yo
  text: Nítorí náà, ẹ máa ṣọ́nà[a], nítorí ẹ kò mọ ọjọ́ wo ni Olúwa yín ń bọ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa ṣọ́ra” tàbí “ẹ máa wà lójúfò.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Olúwa yín bọ̀” tàbí “Olúwa yín yóò bọ̀.” Èdè Gíríìkì lo ìrísí àsìkò ìsinsìnyí.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ẹ máa ṣọ́nà
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì ń pe wọ́n sí ìṣọ́ra tí ń bá a lọ. “Ẹ máa ṣọ́nà” jẹ́ Yorùbá àdánidá, ó sì pa àwòrán ìṣọ́nà mọ́ láì dín un kù sí mímúra lásán.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde ẹ̀kọ́ tí ó ṣáájú.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún àṣẹ náà ní Yorùbá tí ó ṣe kedere.
- source_word: οὐκ οἴδατε
  choice: ẹ kò mọ
  rationale: Ó túmọ̀ ìṣe mímọ̀ tí a sẹ́ ní tààrà, láì fi ìtumọ̀ míì kún un.
- source_word: ποίᾳ ἡμέρᾳ
  choice: ọjọ́ wo ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àsìkò ọjọ́ pàtó tí wọn kò mọ̀.
- source_word: ὁ κύριος ὑμῶν
  choice: Olúwa yín
  rationale: Ó pa oyè κύριος àti ọ̀rọ̀ arọ́pò ohun-ìní ọ̀pọ̀ mọ́ ní ọ̀nà tí ó bójú mu ní Yorùbá.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Fọ́ọ̀mù àsìkò ìsinsìnyí yìí pa ìwúrí àti ìfojúsọ́nà ọ̀rọ̀ náà mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa ọjọ́ ìkẹyìn nínú àsìkò ìsinsìnyí ἔρχεται
  choice: ń bọ̀
  alternative: yóò dé; máa ń bọ̀
  rationale: “Ń bọ̀” pa fọ́ọ̀mù ìsinsìnyí Gíríìkì àti ìmọ̀lára pé ìbọ̀ náà ń sún mọ́lé mọ́, láì pinnu ẹ̀kọ́ pàtó kan nípa àsìkò rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ẹ” àti “yín” nítorí àwọn ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀.
