id: MAT.24.45
reference: Matthew 24:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: yo
  text: “Ǹjẹ́ ta ni ẹrú[a] olóòótọ́ àti ọlọ́gbọ́n náà, ẹni tí ọ̀gá[b] rẹ̀ fi ṣe olórí àwọn ará ilé rẹ̀ láti fún wọn ní oúnjẹ ní àkókò tí ó yẹ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí; “ẹrú” fi ipò ẹni tó wà lábẹ́ àṣẹ ọ̀gá hàn ní kedere sí i níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Olúwa.” Nínú àwòrán agbo ilé yìí, a lo “ọ̀gá” láti fi ipò ẹni tó ní àṣẹ nínú ilé hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Ǹjẹ́ ta ni
  rationale: Ó mú ìbéèrè tí ń fa ìtumọ̀ jáde láti inú ẹ̀kọ́ tó ṣáájú wá sí Yorùbá àdánidá.
- source_word: πιστὸς
  choice: olóòótọ́
  rationale: Ó ṣàpèjúwe ẹni tí a lè gbẹ́kẹ̀ lé, tí ó sì ń ṣe ojúṣe rẹ̀ pẹ̀lú ìṣòtítọ́.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Nínú àwòrán ilé yìí, ọ̀rọ̀ náà tọ́ka sí ẹni tí ó wà lábẹ́ àṣẹ ọ̀gá; ‘ẹrú’ pa agbára ìtumọ̀ Gíríìkì mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: φρόνιμος
  choice: ọlọ́gbọ́n
  rationale: Ó fi ọgbọ́n ìṣe àti ìfọ̀rọ̀wérọ̀ hàn ní Yorùbá tó ṣe kedere.
- source_word: κατέστησεν
  choice: yàn sí orí
  rationale: Ó sọ pé ọ̀gá fi ẹni náà sí ipò ojúṣe àti àṣẹ lórí àwọn ará ilé.
- source_word: κύριος
  choice: ọ̀gá
  rationale: Nínú àkàwé ìṣàkóso ilé, ‘ọ̀gá’ fi ìbáṣepọ̀ ẹni tó ní àṣẹ àti ẹrú hàn ní kedere.
- source_word: οἰκετείας
  choice: àwọn ará ilé
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn ènìyàn inú agbo ilé, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan.
- source_word: τοῦ δοῦναι
  choice: láti máa fún
  rationale: Ó pa ète yíyan ẹni náà mọ́, ó sì bá iṣẹ́ tí a ń ṣe déédéé mu.
- source_word: τροφὴν
  choice: oúnjẹ wọn
  rationale: Ìtumọ̀ tó rọrùn, tó sì yẹ fún pípèsè ohun jíjẹ fún àwọn ará ilé.
- source_word: ἐν καιρῷ
  choice: ní àkókò tí ó yẹ
  rationale: Ó fi àkókò tó bójú mu hàn, kì í ṣe àkókò lásán.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé ilé
  choice: ọ̀gá
  alternative: Olúwa
  rationale: ‘Ọ̀gá’ pa ojú àkàwé ìṣàkóso ilé mọ́ láìfi oyè Kristẹni hàn gbangba ju ohun tí gbolohun náà fúnra rẹ̀ sọ lọ; síbẹ̀, ‘Olúwa’ jẹ́ ìtumọ̀ míì tó ṣeé ṣe.
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: ‘Ẹrú’ fi ipò ẹni tó wà lábẹ́ àṣẹ ọ̀gá hàn ní agbára, bí ọ̀rọ̀ Gíríìkì ṣe rí; ‘ìránṣẹ́’ jẹ́ ọ̀rọ̀ tó rọ̀ sí i tí a tún lè lò gẹ́gẹ́ bí àyíká ṣe rí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà ní ọlá, ó ṣe kedere fún òǹkàwé òde òní. A lo ‘àwọn ará ilé’ láti mú ẹ̀yà ènìyàn inú οἰκετεία hàn, a sì lo ‘láti máa fún’ fún iṣẹ́ pípèsè tó ń ṣẹlẹ̀ déédéé.
