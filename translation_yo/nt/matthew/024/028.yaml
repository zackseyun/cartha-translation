id: MAT.24.28
reference: Matthew 24:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: yo
  text: Ibikíbi tí òkú bá wà, ibẹ̀ ni àwọn idì yóò kóra wọn jọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹyẹ ajẹ òkú.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí “idì,” ṣùgbọ́n nínú àwòrán àwọn ẹyẹ tí ń kóra wọn jọ síbi òkú, ó lè tọ́ka sí àwọn ẹyẹ ajẹ òkú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Ibikíbi tí ... bá wà
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ àìnídìí ibi kan pàtó jáde, ó sì bá ìlò Yorùbá mu fún ‘wherever ... may be.’
- source_word: πτῶμα
  choice: òkú
  rationale: ‘Òkú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ara ohun alààyè tí ó ti kú; kò fi dandan sọ bóyá ènìyàn tàbí ẹranko ni.
- source_word: συναχθήσονται
  choice: yóò kó ara wọn jọ sí
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ passive, gbólóhùn Yorùbá yìí sọ ìkójọpọ̀ àwọn ẹyẹ náà lọ́nà àdánidá láìfi aṣojú kan kún un.
- source_word: ἀετοί
  choice: àwọn ẹyẹ idì
  rationale: Nínú àwòrán àwọn ẹyẹ tí ń kóra jọ síbi òkú, ‘ẹyẹ idì’ lè tọ́ka sí ẹyẹ ńlá ajẹkù-òkú ní Yorùbá. Síbẹ̀, ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ‘ẹyẹ idì ńlá’ (eagles), nítorí náà a pa ìyàtọ̀ náà mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ òwe náà
  choice: A túmọ̀ àwòrán náà gẹ́gẹ́ bí ó ti rí, láìsọ ohun tí òkú tàbí àwọn ẹyẹ dúró fún.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ìdájọ́ tí kò ṣeé yẹ̀, ìfarahàn bíbọ Ọmọ Ènìyàn, ìparun Jerúsálẹ́mù, tàbí àmì ogun Róòmù.
  rationale: Gíríìkì kò sọ ohun tí òkú tàbí àwọn ẹyẹ ṣàpẹẹrẹ ní kedere; fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan sínú ọ̀rọ̀ náà yóò mú àìṣedéédé inú rẹ̀ kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ kúkúrú, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn ‘kó ara wọn jọ sí’ jẹ́ àdánidá ju passive gígùn lọ.
