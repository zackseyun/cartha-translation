translation:
  language: yo
  text: Nígbà náà, kí àwọn tí ó wà ní Jùdíà sá lọ sí àwọn òkè ńlá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “nígbà náà, àwọn tí ó wà ní Jùdíà gbọdọ̀ sá lọ sí àwọn òkè ńlá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀lé àkókò hàn nínú ọ̀rọ̀ Jésù, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ‘nígbà yẹn/lẹ́yìn náà’ ní àyíká yìí.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: àwọn tí ó wà ní Jùdíà
  rationale: Gbólóhùn yìí tọ́ka sí àwọn ènìyàn tí wọ́n wà ní agbègbè Jùdíà láì fi àlàyé mìíràn kún un.
- source_word: Ἰουδαίᾳ
  choice: Jùdíà
  rationale: Èyí ni àkọsílẹ̀ orúkọ ilẹ̀ náà ní Yorùbá, ó sì mú ìtọ́kasí ibi náà dúró kedere.
- source_word: φευγέτωσαν
  choice: kí ... sá lọ
  rationale: Ìṣe àṣẹ ẹni-kẹta ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì; ‘kí ... sá lọ’ jẹ́ àṣẹ tó ṣe kedere, tó sì bá èdè Yorùbá mu láì sọ ọ́ di gbólóhùn ìròyìn.
- source_word: ἐπὶ τὰ ὄρη
  choice: sí àwọn òkè ńlá
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe tí ó fi ìṣípò hàn, gbólóhùn náà tọ́ka sí ibi tí wọn yóò sá lọ; ‘sí àwọn òkè ńlá’ pa ìtumọ̀ ibi-àfojúsùn àti ọ̀pọ̀ òkè mọ́.
theological_decisions:
- issue: Agbára àṣẹ nínú ìkìlọ̀ nípa ohun tí ń bọ̀
  choice: A lo àṣẹ tààrà ‘kí ... sá lọ.’
  alternative: ‘Àwọn ... gbọdọ̀ sá lọ.’
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àṣẹ pàjáwìrì, kì í ṣe àsọyé ẹ̀kọ́ ìgbàgbọ́ kan. Ìtumọ̀ yìí pa agbára ìkìlọ̀ Jésù mọ́ láì fi èrò nípa bí àsọtẹ́lẹ̀ náà ṣe máa ṣẹ sí i.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Kí ... sá lọ’ jẹ́ ọ̀nà àdánidá láti sọ àṣẹ ẹni-kẹta, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà tó tẹnu mọ́ dandan hàn.
