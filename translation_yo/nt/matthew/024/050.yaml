id: MAT.24.50
reference: Matthew 24:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: yo
  text: Ọ̀gá[a] ẹrú[b] náà yóò dé ní ọjọ́ tí ẹrú náà kò retí, àti ní wákàtí tí kò mọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “olúwa ẹrú náà.” Ọ̀rọ̀ Gíríìkì κύριος lè túmọ̀ sí “olúwa” tàbí “ọ̀gá”; níbí, ó ń tọ́ka sí ẹni tó ní àṣẹ lórí ẹrú nínú àkàwé náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì δοῦλος ń tọ́ka sí ẹni tó wà nínú ipò iṣẹ́ ìdè; “ẹrú” ló túbọ̀ bá ipò tó hàn nínú àkàwé yìí mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: yóò dé
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí túmọ̀ sí wíwá tàbí dídé; “yóò dé” bá àyíká ìpadàbọ̀ ọ̀gá tí a kò retí mu lọ́nà àdánidá ní Yorùbá.
- source_word: κύριος
  choice: ọ̀gá
  rationale: Nínú àkàwé yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ní àṣẹ lórí ẹrú, kì í ṣe lílo oyè “Olúwa” ní tààrà fún Ọlọ́run.
- source_word: δούλου
  choice: ẹrú
  rationale: “Ẹrú” pa ipò ìdè àti àjọṣe àṣẹ tó hàn gbangba láàárín κύριος àti δοῦλος mọ́, dípò fífi ọ̀rọ̀ rọ̀ sí “ìránṣẹ́.”
- source_word: ἐκείνου
  choice: náà
  rationale: “Náà” tọ́ka padà sí ẹrú pàtó tí a ti ń sọ̀rọ̀ rẹ̀, bí ọ̀rọ̀ atọ́ka Gíríìkì ṣe ń ṣe.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: ní ọjọ́ tí ẹrú náà kò retí rẹ̀
  rationale: Èyí pa àìdánilójú ọjọ́ náà àti ìtumọ̀ pé ẹrú náà kò retí dídé ọ̀gá rẹ̀ mọ́; fífi “ẹrú náà” tún hàn mú ẹni tí ó ń retí ṣe kedere.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: ní wákàtí tí kò mọ̀
  rationale: Ìtumọ̀ yìí pa ìfararora ọ̀rọ̀ “ọjọ́/wákàtí” mọ́, ó sì sọ àìmọ̀ ẹrú náà ní ṣókí.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyíká ilé àti àkàwé
  choice: ọ̀gá
  alternative: Olúwa
  rationale: “Ọ̀gá” ṣàfihàn ẹni tó ga jù nínú àjọṣe ọ̀gá àti ẹrú tó wà nínú ìtàn náà. “Olúwa” lè mú kí òǹkàwé ka a sí oyè Ọlọ́run tàbí ti Kristi ní tààrà, bó tilẹ̀ jẹ́ pé àkàwé náà ní ìtumọ̀ nípa ìpadàbọ̀ Ọmọ Ènìyàn.
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nítorí àjọṣe ìdè àti àṣẹ ló ṣe pàtàkì nínú àkàwé yìí, “ẹrú” mú agbára ọ̀rọ̀ orísun jáde dáadáa ju “ìránṣẹ́” lọ.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A tún “ẹrú náà” sọ nínú gbólóhùn ọjọ́ láti yà ẹni tí kò retí dídé ọ̀gá rẹ̀ sọ́tọ̀ kedere, láìyí ìtumọ̀ orísun padà.
