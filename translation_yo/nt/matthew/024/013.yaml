  text: But the one who endures to the end will be saved[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó bá faradà títí dé òpin, òun ni a ó gbà là[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dé òpin.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó yọ ọ́ kúrò nínú ewu.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàlà tàbí ìdálọ́wọ́; a lo ọ̀rọ̀ tó gbòòrò níbí nítorí àyíká ọ̀rọ̀ náà kò fipá mú wa láti yan ìtumọ̀ kan ṣoṣo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: ẹni tí ó bá fara dà á
  rationale: Àpilẹ̀kọ pẹ̀lú participle aorist náà ń tọ́ka sí ẹni tí ìfaradà ń ṣe àpèjúwe rẹ̀. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, kò sì fi akọ tàbí abo kún ọ̀rọ̀ náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ díẹ̀ hàn sí àwọn ìkìlọ̀ tó ṣáájú nípa àwọn tí yóò ṣubú kúrò; “Ṣùgbọ́n” mú ìyàtọ̀ náà jáde kedere.
- source_word: ὑπομείνας (ὑπομένω)
  choice: fara dà á
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí dídúró ṣinṣin lábẹ́ ìdánwò tàbí ìpọ́njú. “Fara dà á” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: εἰς τέλος
  choice: dé òpin
  rationale: Gbólóhùn náà sọ nípa títẹ̀ síwájú títí dé ibi ìparí. “Dé òpin” pa àwòrán ìtọ́sọ́nà Gíríìkì mọ́; “títí dé òpin” tún ṣeé ṣe.
- source_word: οὗτος
  choice: ni
  rationale: οὗτος jẹ́ àmì ìtẹnumọ́ tó tún ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn mú. Ìṣètò Yorùbá “ẹni ... ni” pa ìtẹnumọ́ náà mọ́ lọ́nà àdánidá láì fi “ẹni yìí” tó le ní ìró àjèjì sí i.
- source_word: σωθήσεται
  choice: a ó gbà là
  rationale: Ọ̀rọ̀ náà jẹ́ ọjọ́ iwájú aláìṣe, ó sì lè túmọ̀ sí gbígbà là ní ìtumọ̀ ìgbàlà tàbí ìdálọ́wọ́. “A ó gbà là” jẹ́ gbòòrò tó láti pa àwọn méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ σωθήσεται nínú ọ̀rọ̀ ìfaradà títí dé òpin
  choice: a ó gbà là
  alternative: a ó dá sílẹ̀ / a ó yọ kúrò nínú ewu
  rationale: Ẹsẹ̀ náà kò sọ ní pàtó bóyá ó ń tọ́ka sí ìgbàlà ìkẹyìn, ìdálọ́wọ́ kúrò nínú ìpọ́njú, tàbí àwọn méjèèjì. Ìtumọ̀ yìí kò fi èrò ẹ̀kọ́ ìsìn kan pàtó lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ìṣètò “ẹni ... ni” láti mú ìtẹnumọ́ Gíríìkì jáde lọ́nà Yorùbá àdánidá; àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
