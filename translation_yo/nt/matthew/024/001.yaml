id: MAT.24.1
reference: Matthew 24:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: yo
  text: Jésù sì jáde kúrò ní tẹ́ńpìlì, ó sì ń lọ. Àwọn ọmọ-ẹ̀yìn rẹ̀ sì sún mọ́ ọn láti fi àwọn ilé tẹ́ńpìlì náà hàn án.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν túmọ̀ sí gbogbo àgbègbè tàbí àkójọpọ̀ ilé tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: jáde kúrò
  rationale: 'Ọ̀rọ̀ alábápín aorist náà ṣàfihàn ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì: Jésù kọ́kọ́ jáde, lẹ́yìn náà ó ń lọ. “Jáde kúrò” pa ìtumọ̀ ìdarí ìṣípò mọ́.'
- source_word: ἱεροῦ
  choice: tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo àgbègbè tàbí àkójọpọ̀ ilé tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé nìkan. “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, a sì ṣàlàyé ìtumọ̀ fífẹ̀ rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: ἐπορεύετο
  choice: ó ń lọ
  rationale: Ìrísí imperfect náà fi ìṣe tí ó ń bá a lọ hàn. “Ó ń lọ” pa apá ìtumọ̀ yìí mọ́ láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: προσῆλθον
  choice: tọ̀ ọ́ wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n sún mọ́ ọn tàbí wọ́n tọ̀ ọ́ wá. Yíyan yìí bá ìṣípò Jésù mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐπιδεῖξαι
  choice: láti fi ... hàn án
  rationale: Infinitive náà sọ ète tí àwọn ọmọ-ẹ̀yìn fi tọ̀ ọ́ wá. “Láti fi ... hàn án” jẹ́ ìtumọ̀ tààrà tí ó sì ṣe kedere.
- source_word: οἰκοδομὰς
  choice: àwọn ilé
  rationale: Nínú àyíká yìí, οἰκοδομή ń tọ́ka sí àwọn ilé tàbí àwọn ohun tí a kọ́. “Àwọn ilé” jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn lè lóye nírọ̀rùn.
- source_word: τοῦ ἱεροῦ
  choice: tẹ́ńpìlì náà
  rationale: Genitive náà fi hàn pé àwọn ilé náà jẹ́ ti àgbègbè tẹ́ńpìlì. Ọ̀rọ̀ “náà” ń mú ìtọ́kasí padà sí tẹ́ńpìlì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions:
- issue: Ìtumọ̀ ἱερόν ní ìyàtọ̀ sí ναός
  choice: tẹ́ńpìlì
  alternative: gbogbo àgbègbè tẹ́ńpìlì
  rationale: ἱερόν túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé nìkan. A lo “tẹ́ńpìlì” nínú ẹsẹ fún ìṣàn èdè, a sì pa ìyàtọ̀ ọ̀rọ̀ náà mọ́ nínú àlàyé ìsàlẹ̀ láì gbé ẹ̀kọ́ ìsìn kan wọ inú ẹsẹ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àdánidá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìtòlẹ́sẹẹsẹ “jáde ... ó sì ń lọ” pa ìyàtọ̀ aspect ti ἐξελθὼν àti ἐπορεύετο mọ́.
