id: MAT.24.30
reference: Matthew 24:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: yo
  text: Nígbà náà ni àmì Ọmọ Ènìyàn yóò farahàn ní ọ̀run[a]. Nígbà náà ni gbogbo àwọn ẹ̀yà ilẹ̀ ayé yóò ṣọ̀fọ̀[b], wọn yóò sì rí Ọmọ Ènìyàn tí ó ń bọ̀ lórí àwọn ìkùukùu ọ̀run pẹ̀lú agbára àti ògo ńlá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ojú ọ̀run.” Ọ̀rọ̀ Gíríìkì οὐρανός lè túmọ̀ sí “ọ̀run” tàbí “ojú ọ̀run,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo àwọn ẹ̀yà ilẹ̀ náà.” Ọ̀rọ̀ Gíríìkì γῆ lè túmọ̀ sí “ilẹ̀ ayé” tàbí “ilẹ̀.”
    reason: alternative_reading
  - marker: c
    text: Gbólóhùn náà, “tí ó ń bọ̀ lórí àwọn ìkùukùu ọ̀run,” rántí Dáníẹ́lì 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: yóò farahàn
  rationale: Ọ̀rọ̀ yìí fi hàn pé ohun náà yóò di ohun tí a lè rí; ‘farahàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́ láìfi ìtumọ̀ míì kún un.
- source_word: σημεῖον
  choice: àmì
  rationale: ‘Àmì’ ni ìtumọ̀ tó ṣe kedere jù lọ, ó sì lè dúró fún àmì ìṣẹ̀lẹ̀ láìsọ irú àmì náà pàtó.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: '‘Àmì Ọmọ Ènìyàn’ pa ìṣòro ìbátan ọ̀rọ̀ Gíríìkì mọ́: ó lè jẹ́ àmì tó jẹ́ ti Ọmọ Ènìyàn tàbí àmì tó ní í ṣe pẹ̀lú rẹ̀, láìyanju rẹ̀ nínú ìtumọ̀.'
- source_word: ἐν τῷ οὐρανῷ
  choice: ní ọ̀run
  rationale: ‘Ọ̀run’ bá ìforúkọsílẹ̀ apokaliptiki mu, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ojú ọ̀run; àlàyé ìsàlẹ̀ pa àṣàyàn yẹn mọ́.
- source_word: κόψονται
  choice: yóò pohùnréré ẹkún
  rationale: Nínú àṣà ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí ṣíṣe ọ̀fọ̀ tàbí ẹkún. ‘Pohùnréré ẹkún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, láìfi ìṣe lílu ara kún ẹsẹ náà.
- source_word: φυλαὶ
  choice: àwọn ẹ̀yà
  rationale: ‘Àwọn ẹ̀yà’ ṣoju ìtumọ̀ ‘tribes’ tààrà, ó sì pa àwòrán àwọn ìran tàbí ẹgbẹ́ ènìyàn mọ́.
- source_word: τῆς γῆς
  choice: ilẹ̀ ayé
  rationale: Àyíká ọ̀rọ̀ tó kan ọ̀run àti ìkùukùu ṣe àtìlẹ́yìn fún ìtumọ̀ gbogbo ayé; síbẹ̀, ‘ilẹ̀ náà’ ṣì ṣeé ṣe, a sì fi sí àlàyé ìsàlẹ̀.
- source_word: ὄψονται
  choice: wọn yóò sì rí
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó rọrùn, tó sì sọ ìríran náà ní tààrà.
- source_word: ἐρχόμενον
  choice: tí ó ń bọ̀
  rationale: Fọ́ọ̀mù ‘ń bọ̀’ pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì bá ọ̀rọ̀ Yorùbá mu.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: lórí ìkùukùu ọ̀run
  rationale: Ìtumọ̀ yìí tẹ̀ lé àwòrán ibi tí ó wà nínú Gíríìkì, ó sì pa ìtọ́kasí sí Dáníẹ́lì 7:13 mọ́.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: pẹ̀lú agbára àti ògo ńlá
  rationale: Èyí pa ètò Gíríìkì mọ́ nípa so ‘ńlá’ mọ́ ‘ògo,’ ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘àmì Ọmọ Ènìyàn’
  choice: A pa ìbátan ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘àmì Ọmọ Ènìyàn.’
  alternative: ‘àmì tí ó jẹ́ ti Ọmọ Ènìyàn’ tàbí ‘àmì náà, èyíinì ni Ọmọ Ènìyàn fúnra rẹ̀’
  rationale: Gíríìkì kò pinnu bóyá àmì náà jẹ́ ohun tó jẹ́ tirẹ̀, ohun tó tọ́ka sí i, tàbí òun fúnra rẹ̀. Ìtumọ̀ náà kò yanju àríyànjiyàn yìí ní ìkọ̀kọ̀.
- issue: Ìwọ̀n γῆ nínú ‘gbogbo àwọn ẹ̀yà ilẹ̀ ayé’
  choice: A lo ‘ilẹ̀ ayé’ nínú ẹsẹ pàtàkì.
  alternative: ‘ilẹ̀ náà’
  rationale: Àyíká àgbáyé àti apokaliptiki ṣe àtìlẹ́yìn fún ‘ilẹ̀ ayé,’ ṣùgbọ́n ìtumọ̀ tó dojú kọ ilẹ̀ Ísírẹ́lì ṣì ṣeé ṣe; àlàyé ìsàlẹ̀ ni a fi pa á mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ọmọ Ènìyàn’ ni akọle tí a pa mọ́, ‘pohùnréré ẹkún’ sì sọ ìbànújẹ ọ̀fọ̀ ní ọ̀nà Yorùbá àdánidá.
