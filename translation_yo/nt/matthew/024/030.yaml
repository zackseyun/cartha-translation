revisions:
- from: Nígbà náà ni àmì Ọmọ Ènìyàn yóò farahàn ní ọ̀run[a]. Nígbà náà ni gbogbo àwọn ẹ̀yà ilẹ̀ ayé yóò pohùnréré ẹkún[b], wọn yóò sì rí Ọmọ Ènìyàn tí ó ń bọ̀ lórí ìkùukùu ọ̀run pẹ̀lú agbára àti ògo ńlá[c].
  to: Nígbà náà ni àmì Ọmọ Ènìyàn yóò farahàn ní ọ̀run[a]. Nígbà náà ni gbogbo àwọn ẹ̀yà ilẹ̀ ayé yóò ṣọ̀fọ̀[b], wọn yóò sì rí Ọmọ Ènìyàn tí ó ń bọ̀ lórí àwọn ìkùukùu ọ̀run pẹ̀lú agbára àti ògo ńlá[c].
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ ìṣọ̀fọ̀ tí kò wọ́pọ̀ pẹ̀lú “yóò ṣọ̀fọ̀,” èyí tó jẹ́ Yorùbá àdánidá tí ó fi κόψονται hàn dáadáa. A tún fi àmì ọ̀pọ̀ sí “ìkùukùu” láti bá νεφελῶν mu. Kò sí ìpinnu ẹ̀kọ́ ìsìn tàbí ìdínkù nínú àwọn ìtumọ̀ tí orísun fi sílẹ̀ ní àìdájú.
