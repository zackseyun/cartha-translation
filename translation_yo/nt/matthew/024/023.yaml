base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: yo
  text: Nígbà náà, bí ẹnikẹ́ni bá sọ fún yín pé, “Wò ó, Mèsáyà náà wà níhìn-ín!” tàbí pé, “Ó wà níhìn-ín!” ẹ má ṣe gbà á gbọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìkìlọ̀ yìí so ohun tí ó ṣáájú pọ̀, ó sì tọ́ka sí àkókò tàbí ìtẹ̀síwájú ọ̀rọ̀ náà.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: bí ẹnikẹ́ni bá sọ fún yín pé
  rationale: Ó pa ìtumọ̀ gbólóhùn oníṣ条件 náà mọ́, pẹ̀lú ẹni tí a kò dá mọ̀ ní pàtó.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí ń pe àfiyèsí olùgbọ́ sí ohun tí ẹni náà fẹ́ fi hàn; ‘Wò ó’ jẹ́ ọ̀nà Yorùbá àdánidá tí kì í ṣe ti àtijọ́ jù.
- source_word: ὧδε
  choice: níhìn-ín / Níhìn-ín!
  rationale: Ó túmọ̀ sí ibi tí ó sún mọ́ ẹni tó ń sọ̀rọ̀. Ní ìṣẹ̀lẹ̀ kejì, a pa kúkúrú àti àìpé gbólóhùn Gíríìkì mọ́.
- source_word: ὁ χριστός
  choice: Mèsáyà náà
  rationale: Níbí, ọ̀rọ̀ náà jẹ́ oyè ẹni àmì òróró tí a ń retí, kì í ṣe orúkọ lásán. ‘Náà’ tún fi àpilẹ̀kọ Gíríìkì àti ìdánimọ̀ ẹni tí wọ́n ń sọ pé ó dé hàn.
- source_word: μὴ πιστεύσητε
  choice: ẹ má ṣe gbà á gbọ́
  rationale: Ó jẹ́ ìkìlọ̀ pé kí wọ́n má ṣe gba ẹ̀sùn tàbí ìkéde náà gbọ́; arọ́pò-orúkọ ‘á’ ń tọ́ka sí ohun tí a sọ, kì í ṣe dandan sí ẹni tó sọ ọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi / ẹni àmì òróró náà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹni ìgbàlà tí a ń retí, nítorí náà ‘Mèsáyà’ jẹ́ kí iṣẹ́ rẹ̀ gẹ́gẹ́ bí oyè hàn gbangba láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Ẹni tàbí ohun tí a kò gbọdọ̀ gbà gbọ́
  choice: ẹ má ṣe gbà á gbọ́
  alternative: ẹ má ṣe gbà ẹni náà gbọ́ / ẹ má ṣe gbàgbọ́
  rationale: Gíríìkì kò sọ ohun tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí ní pàtó. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì tọ́ka sí ìkéde náà láìpinnu pé ẹni tí wọ́n ń tọ́ka sí ni a kò gbọdọ̀ gbà gbọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn níbi tí ó bá jẹ́ àdánidá, a sì pa ìkìlọ̀ taara àti kúkúrú ti orísun Gíríìkì mọ́.
