  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: yo
  text: Bí a kò bá ti dín ọjọ́ wọ̀nyẹn kù[a], kò sí ènìyàn kankan tí a ì bá gbà là[b]; ṣùgbọ́n nítorí àwọn àyànfẹ́, a ó dín ọjọ́ wọ̀nyẹn kù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “gé ọjọ́ wọ̀nyẹn kúrú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pípa ohun kúrú tàbí dídín rẹ̀ kù.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà, “gbogbo ẹran ara,” jẹ́ àsọyé Bíbélì tó túmọ̀ sí “ènìyàn kankan” tàbí “ẹnikẹ́ni tó wà láàyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: a kò bá dín ... kù / a ó dín ... kù
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pípa ohun kúrú tàbí dídín ìwọ̀n rẹ̀ kù. “Dín ọjọ́ ... kù” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé iye àkókò àwọn ọjọ́ náà yóò dín kù, ó sì pa agbára ọ̀rọ̀ ìpilẹ̀ mọ́ láì fi ẹni tó ṣe é hàn.
- source_word: οὐκ ἂν ἐσώθη
  choice: kò sí ... tí ì bá là
  rationale: Ìṣètò yìí fi àbájáde ohun tí kò ṣẹlẹ̀ hàn. “Tí ì bá là” pa ìtumọ̀ ìgbàlà tàbí pípa ẹ̀mí mọ́ sílẹ̀ láì fi ọ̀rọ̀ náà mọ́ ìgbàlà ẹ̀mí nìkan tàbí ìwàláàyè ti ara nìkan.
- source_word: πᾶσα σάρξ
  choice: kò sí ẹran ara kankan
  rationale: Èyí pa àwòrán àsọyé Bíbélì náà mọ́. Nínú gbólóhùn tí a kọ̀ yìí, ó túmọ̀ sí pé kò sí ènìyàn kankan tí ì bá là.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: ṣùgbọ́n nítorí àwọn àyànfẹ́
  rationale: “Nítorí” lè gbé ìtumọ̀ ìdí àti àǹfààní tí διά pẹ̀lú accusative ní níhìn-ín. “Àwọn àyànfẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó péye fún àwọn tí a yàn, láì pinnu ta ni ẹgbẹ́ náà ní pàtó.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: ọjọ́ wọ̀nyẹn
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, àdánidá fún ọ̀rọ̀ atọ́ka Gíríìkì náà.
- source_word: καὶ εἰ μὴ
  choice: Àti bí ... kò bá
  rationale: Èyí pa ìbẹ̀rẹ̀ àsopọ̀ àti ìṣètò gbólóhùn oníṣ条件 Gíríìkì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ “àwọn àyànfẹ́” nínú ọ̀rọ̀ nípa ìkẹyìn ayé
  choice: A fi “àwọn àyànfẹ́” sílẹ̀ láì ṣe àlàyé ẹgbẹ́ tí wọ́n jẹ́.
  alternative: Àwọn ènìyàn Ọlọ́run tí ó yàn; àwọn onígbàgbọ́; àwọn olóòótọ́ tó ṣẹ́ kù
  rationale: Ẹsẹ yìí kò ṣàlàyé ní pàtó gbogbo àwọn tí ọ̀rọ̀ náà kàn. Ìtumọ̀ náà kò yanju àríyànjiyàn bóyá ó ń tọ́ka sí Ísírẹ́lì, ìjọ, tàbí àṣẹ́kù olóòótọ́.
- issue: Ìtumọ̀ σῴζω nínú àyíká ọ̀rọ̀ yìí
  choice: “Tí ì bá là,” tí ó pa èrò ìgbàlà mọ́ nígbà tí àyíká ọ̀rọ̀ ń tọ́ka sí pípa ẹ̀mí mọ́.
  alternative: Tí ì bá yè; tí a ì bá pa mọ́ láàyè
  rationale: “Là” ní àyè ìtumọ̀ tó fẹ̀ sí i ju “yè” lọ, nítorí náà kò fi ọ̀rọ̀ Gíríìkì náà mọ́ ìwàláàyè ti ara nìkan tàbí ìgbàlà ẹ̀mí nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì. “Dín ọjọ́ ... kù” jẹ́ àdánidá ju gbólóhùn tí a túmọ̀ lọ́rọ̀-lọ́rọ̀ lọ; “ẹran ara” sì pa àsọyé Bíbélì mọ́ pẹ̀lú àlàyé ìsàlẹ̀ ìwé. A fi gbogbo àmì ohùn sí ibi tí ó yẹ.
