  source_fidelity: 'Ìtumọ̀ náà gba ìpilẹ̀ ìtumọ̀ ẹsẹ náà ní gbogbogbò: ìpò-oníṣòro ti ohun tí kò ṣẹlẹ̀, ìdínkù ọjọ́ wọ̀nyẹn, àti ìdí náà fún àwọn àyànfẹ́. Síbẹ̀, “tí ì bá là” yí ohùn passive ti ἐσώθη sí ohun tí ẹni náà ṣe fúnra rẹ̀, ó sì nílò àtúnṣe sí “tí a ì bá gbà là.” A tún fi “ti” kún ọ̀rọ̀ oníṣòro láti fi ìtumọ̀ past counterfactual ti ἐκολοβώθησαν hàn.'
  naturalness: “Ẹran ara kankan” kò wọ́pọ̀ gẹ́gẹ́ bí àsọyé Yorùbá fún ènìyàn; ó lè dà bí ẹran ìjẹun. “Ènìyàn kankan” jẹ́ Yorùbá ìgbàlódé, ó sì sọ ìtumọ̀ àsọyé πᾶσα σάρξ ní àyíká yìí ní kedere. A yọ “Àti” ní ìbẹ̀rẹ̀, nítorí “Bí” nìkan jẹ́ ìbẹ̀rẹ̀ tó rọrùn, tó sì dára jù nínú Yorùbá.
  terminology: “Àwọn àyànfẹ́” yẹ, ó sì pa ἐκλεκτοί mọ́ láì ṣàlàyé tàbí fi ẹ̀kọ́ ìjọ kan kún un. “Gbà là” pa ọ̀rọ̀ σῴζω mọ́ ju “yè” lọ, bí ó tilẹ̀ jẹ́ pé àyíká rẹ̀ ń tọ́ka sí ìwàláàyè.
