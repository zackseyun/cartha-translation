  - severity: low
    issue: “ọjọ́ ìsinmi kan” lè ṣe àìpàtó náà lágbára ju bó ṣe yẹ lọ nínú Yorùbá.
    rationale: σάββατῳ kò ní árítíkù, ṣùgbọ́n àìsí árítíkù Gíríìkì kò fipá mú ‘kan.’ Ọ̀rọ̀ Yorùbá “ní ọjọ́ ìsinmi” lè jẹ́ kí ìtọ́kasí sí Sábáàtì dúró ní àìṣètò tí ó yẹ; a sì lè pa aṣayan ‘kan’ mọ́ nínú àlàyé ìsàlẹ̀.
