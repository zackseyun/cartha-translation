  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa gbàdúrà pé kí ìsálọ yín má ṣẹlẹ̀ ní ìgbà òtútù tàbí ní ọjọ́ ìsinmi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọjọ́ ìsinmi kan.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ẹ máa gbàdúrà
  rationale: Àṣẹ ìsinsìnyí fún ọ̀pọ̀ ènìyàn ni; “ẹ máa gbàdúrà” jẹ́ Yorùbá àdánidá, ó sì lè fi ìtẹ̀síwájú ìṣe náà hàn láì fi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìtakora díẹ̀ sí ìkìlọ̀ tó ṣáájú hàn.
- source_word: ἵνα μὴ γένηται
  choice: pé kí ... má ṣẹlẹ̀
  rationale: Ó sọ ohun tí wọ́n gbọ́dọ̀ gbàdúrà fún; “má ṣẹlẹ̀” bá ìtumọ̀ γίνομαι gẹ́gẹ́ bí ìṣẹ̀lẹ̀ mu.
- source_word: ἡ φυγὴ ὑμῶν
  choice: ìsá àsálà yín
  rationale: Ó túmọ̀ sí fífi ibi ewu sílẹ̀ nípa sísá; ọ̀rọ̀ yìí kò sọ pé àsálà náà yóò ṣàṣeyọrí.
- source_word: χειμῶνος
  choice: ní ìgbà òtútù
  rationale: Ọ̀nà àdánidá ni èyí láti sọ àkókò ọdún tí χειμών ń tọ́ka sí ní Yorùbá.
- source_word: μηδὲ σαββάτῳ
  choice: tàbí ní ọjọ́ ìsinmi kan
  rationale: μηδέ so ipò kejì mọ́ àdúrà òdì náà; “ọjọ́ ìsinmi kan” pa àìsí árítíkù nínú Gíríìkì mọ́, nígbà tí ó ń tọ́ka sí Sábáàtì Júù.
theological_decisions:
- issue: Bóyá a ó sọ σαββάτῳ ní ọ̀nà pàtó tàbí àìpàtó
  choice: ní ọjọ́ ìsinmi kan
  alternative: ní ọjọ́ ìsinmi náà
  rationale: Ọ̀rọ̀ Gíríìkì kò ní árítíkù, nítorí náà “ọjọ́ ìsinmi kan” fara mọ́ ìrísí rẹ̀ dáadáa. Síbẹ̀, “ọjọ́ ìsinmi náà” jẹ́ òye tó ṣeé ṣe, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ìsá àsálà” láti yà φυγή kúrò nínú “àsálà” tí ó lè túmọ̀ sí ìgbàlà tó ṣàṣeyọrí; a sì fi àmì ohùn sí ibi tí ó bá àdánidá mu.
