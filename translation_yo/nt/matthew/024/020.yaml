  to: Ṣùgbọ́n ẹ máa gbàdúrà pé kí ìsálọ yín má ṣẹlẹ̀ ní ìgbà òtútù tàbí ní ọjọ́ ìsinmi[a].
  rationale: Àtúnṣe náà yọ ìtúnlò “ìsá àsálà” kúrò, ó sì fi “ìsálọ” rọ́pò rẹ̀ gẹ́gẹ́ bí ìbámu tó sún mọ́ φυγή. A tún lo “ní ọjọ́ ìsinmi” láì fi “kan” sí ọrọ̀ àkọ́kọ́, nítorí èyí jẹ́ Yorùbá àdánidá tí ó ń dá àìsí árítíkù Gíríìkì sílẹ̀ láì dá ìtumọ̀ kan lórí ọrọ̀ náà; aṣayan àìpàtó ni a pa mọ́ nínú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:28Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń gbé ìbéèrè àdúrà, ìfẹ́kúfẹ̀ẹ́ pé ìsálọ náà má ṣẹlẹ̀, ìgbà òtútù, àti ọjọ́ Sábáàtì/ìsinmi kalẹ̀ dáadáa. Síbẹ̀, “ìsá àsálà” dà bí ìtúnlò ọ̀rọ̀ méjì tó ń sọ ohun kan náà, ó sì lè fi ìtumọ̀ ‘escape’ tó ti ṣàṣeyọrí kún φυγή. “Ìsálọ” túmọ̀ φυγή ní kedere, láì ṣàfikún àbájáde kan.
  naturalness: “Ẹ máa gbàdúrà” àti ìṣètò gbolóhùn náà jẹ́ Yorùbá boṣewa tí ó dára. Rírọ́pò “ìsá àsálà” pẹ̀lú “ìsálọ” mú gbolóhùn náà rọrùn, kedere, àti àdánidá sí i. Ní Yorùbá, “ní ọjọ́ ìsinmi” láìsí “kan” lè pa àìpàtó/pàtó tí Gíríìkì fi sílẹ̀ mọ́ dáadáa ju “ọjọ́ ìsinmi kan,” tí ó lè dà bí ọjọ́ ìsinmi èyíkéyìí.
  terminology: “Ọjọ́ ìsinmi” jẹ́ ọ̀rọ̀ tí ó lè tọ́ka sí Sábáàtì nínú ìforígbárí Jùdáìkì; a pa ìtumọ̀ “ọjọ́ ìsinmi kan” mọ́ nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí aṣayan. Kò yẹ kí a fi ìtumọ̀ ẹ̀kọ́ ìjọ kún ẹsẹ̀ náà.
  issues:
