source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: yo
  text: Ọ̀run àti ayé yóò kọjá lọ, ṣùgbọ́n ọ̀rọ̀ mi kì yóò kọjá lọ láéláé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ mi dájúdájú kì yóò kọjá lọ.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀nà ìsísọ òdì tó lágbára (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Ọ̀run
  rationale: Nínú ìsọ̀kan ọ̀rọ̀ náà pẹ̀lú γῆ, ó tọ́ka sí ọ̀run gẹ́gẹ́ bí apá kan nínú gbogbo ohun tí a dá, kì í ṣe ojú ọ̀run tí a ń rí nìkan.
- source_word: ἡ γῆ
  choice: ayé
  rationale: Nínú gbólóhùn ‘ọ̀run àti ayé,’ γῆ ní ìtumọ̀ gbogbo ayé, kì í ṣe ilẹ̀ agbègbè kan pàtó.
- source_word: παρελεύσεται
  choice: yóò kọjá lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bójú mu láti sọ pé ètò ìṣẹ̀dá tó wà yìí yóò dópin, láì fi bí ìparun náà yóò ṣe ṣẹlẹ̀ kún ọ̀rọ̀ náà.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín bí ọ̀run àti ayé ṣe máa kọjá lọ àti bí ọ̀rọ̀ Jesu ṣe máa dúró.
- source_word: οἱ λόγοι μου
  choice: ọ̀rọ̀ mi
  rationale: ‘Ọ̀rọ̀ mi’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí gbogbo ohun tí Jesu sọ; ó sì lè ní ìtumọ̀ àkójọpọ̀ bí Gíríìkì λόγοι tó jẹ́ ọ̀pọ̀.
- source_word: οὐ μὴ παρέλθωσιν
  choice: kì yóò kọjá lọ láéláé
  rationale: Ìkìlọ̀ òdì alágbára οὐ μή ni a fi ‘kì yóò … láéláé’ hàn, èyí tó mú ìdánilójú pé ọ̀rọ̀ Jesu kò ní kọjá lọ rárá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jesu láti dúró títí
  choice: A túmọ̀ gbólóhùn náà gẹ́gẹ́ bí ìyàtọ̀ tó lágbára láàárín ayé ìṣẹ̀dá tó máa kọjá lọ àti ọ̀rọ̀ Jesu tí kò ní kọjá lọ láéláé.
  alternative: Kí a fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un nípa àṣẹ Ọlọ́run tàbí àìlópin ọ̀rọ̀ náà.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ sọ ìdánilójú àti ìdúróṣinṣin ọ̀rọ̀ Jesu, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ kan tí kò fara hàn nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A yan ‘ayé’ dípò ‘ilẹ̀’ nítorí ìwọ̀n àgbáyé inú gbólóhùn náà, a sì fi ‘láéláé’ hàn láti mú agbára οὐ μή jáde.
