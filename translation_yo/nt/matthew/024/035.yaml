  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: ‘Ọ̀run àti ayé’ ń pa ìwọ̀n àgbáyé ti ὁ οὐρανὸς καὶ ἡ γῆ mọ́; ‘yóò kọjá lọ’ yẹ fún παρελεύσεται; ‘ṣùgbọ́n’ ń fi ìyàtọ̀ δέ hàn; ‘kì yóò … láéláé’ sì mú ìfẹnumọ́ òdì οὐ μή jáde. Lílò ‘ọ̀rọ̀ mi’ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ jẹ́ ohun àdánidá nínú Yorùbá, bí ó tilẹ̀ jẹ́ pé λόγοι jẹ́ ọ̀pọ̀ nínú Gíríìkì.'
  naturalness: 'Gbólóhùn náà jẹ́ Yorùbá boṣewa, tó ní ìwọ̀ntúnwọ̀nsì àti ìgbọ́gbọ̀nṣe tó yẹ fún ọ̀rọ̀ ìwé mímọ́. Àmì ohùn wà níbi tó yẹ. Ṣùgbọ́n ‘ìkìlọ̀ òdì’ nínú àlàyé abẹ́lẹ̀ kò tọ́: ìkìlọ̀ túmọ̀ sí warning, kì í ṣe negation grammatical.'
