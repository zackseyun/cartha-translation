id: MAT.24.10
reference: Matthew 24:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: yo
  text: Nígbà náà, ọ̀pọ̀ ènìyàn yóò kọsẹ̀[a], wọn yóò sì da ara wọn[b], wọn yóò sì kórìíra ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a óò mú ọ̀pọ̀ ènìyàn kọsẹ̀,” tàbí, “inú ọ̀pọ̀ ènìyàn yóò bí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọn yóò fi ara wọn lé lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìṣẹ̀lẹ̀ yìí hàn gẹ́gẹ́ bí ohun tí yóò tẹ̀ lé àwọn ohun tí Jésù ṣẹ̀ṣẹ̀ sọ; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: σκανδαλισθήσονται
  choice: yóò kọ̀sẹ̀ kúrò nínú ìgbàgbọ́
  rationale: Nínú àyíká inúnibíni yìí, ọ̀rọ̀ náà tọ́ka sí ìṣubú tàbí yíyí kúrò lẹ́yìn ìgbàgbọ́, kì í ṣe pé inú ẹni kàn dùn nìkan. Àlàyé ìgbàgbọ́ mú ìtumọ̀ náà yé kedere ní Yorùbá láìsọ ẹ̀kọ́ ìsìn kan pàtó.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Adáṣepọ̀ ajẹtífù náà ń tọ́ka sí ọ̀pọ̀ ènìyàn; fífi “ènìyàn” kún un jẹ́ mímọ́ àti àdánidá ní Yorùbá.
- source_word: ἀλλήλους
  choice: ara wọn
  rationale: Ó pa ìtumọ̀ ìṣe tí àwọn ènìyàn ń ṣe sí ara wọn mọ́ ní ọ̀nà Yorùbá tí ó rọrùn.
- source_word: παραδώσουσιν
  choice: yóò fi ara wọn lé àwọn ọ̀tá lọ́wọ́
  rationale: Ní ìtumọ̀ gígùn, ọ̀rọ̀ náà ni “fi lé lọ́wọ́”; àyíká inúnibíni fi hàn pé fífi àwọn ẹlòmíràn fún àwọn ọ̀tá ni a ń sọ, èyí tó tún ní agbára ìtumọ̀ ìwà ọ̀dàlẹ̀.
- source_word: μισήσουσιν
  choice: yóò kórìíra
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti àdánidá fún ìkórìíra líle tàbí ìṣọ̀tá.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Nígbà náà ... wọn yóò sì ... wọn yóò sì ...
  rationale: Àtúnsọ “sì” pa ìlù ìtẹ̀síwájú àti ìbísí àwọn ìṣẹ̀lẹ̀ inú Gíríìkì mọ́, nígbà tí ìbẹ̀rẹ̀ náà sì bá ìlò Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλισθήσονται ní àyíká inúnibíni ọjọ́ ìkẹyìn
  choice: yóò kọ̀sẹ̀ kúrò nínú ìgbàgbọ́
  alternative: yóò jẹ́ kí wọn kọsẹ̀; inú wọn yóò sì bí
  rationale: Àyíká náà ń lọ láti inú ìṣubú sí fífi ara ẹni lé ọ̀tá lọ́wọ́ àti ìkórìíra. Yíyan “kọ̀sẹ̀ kúrò nínú ìgbàgbọ́” fi bí ìyapa náà ti ṣe le koko hàn, ṣùgbọ́n kò pinnu ètò ẹ̀kọ́ ìsìn kan nípa ìpẹ̀yìndà.
- issue: Agbára ìtumọ̀ παραδώσουσιν
  choice: yóò fi ara wọn lé àwọn ọ̀tá lọ́wọ́
  alternative: wọn yóò da ara wọn
  rationale: Ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ ìpilẹ̀ ni “fi lé lọ́wọ́.” Àfikún “àwọn ọ̀tá” jẹ́ kó ṣeé lóye ní Yorùbá nínú àyíká inúnibíni, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa ìtumọ̀ “ṣe ọ̀dàlẹ̀” mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. Àwọn gbolohun “kọ̀sẹ̀ kúrò nínú ìgbàgbọ́” àti “fi ara wọn lé àwọn ọ̀tá lọ́wọ́” ń darapọ̀ ìṣòtítọ́ sí Gíríìkì mọ́ èdè Yorùbá òde òní tí gbogbo ènìyàn lè lóye.
