id: MAT.24.9
reference: Matthew 24:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: yo
  text: Nígbà náà ni wọn yóò fi yín lé ìpọ́njú lọ́wọ́[a], wọn yóò sì pa yín; gbogbo àwọn orílẹ̀-èdè[b] yóò sì kórìíra yín nítorí orúkọ mi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lé ìyà lọ́wọ́” tàbí “lé ìnúnibíni lọ́wọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wàhálà líle, ìnilára, tàbí ìpọ́njú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “gbogbo orílẹ̀-èdè”; tàbí, èyí tí kò ṣeé ṣe tó bẹ́ẹ̀ ní àyíká ọ̀rọ̀ yìí, “gbogbo àwọn tí kì í ṣe Júù.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “nítorí orúkọ mi”; ìyẹn ni pé, nítorí ìfaramọ́ wọn sí Jésù àti ohun tí orúkọ rẹ̀ dúró fún.
    reason: clarification
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìṣẹ̀lẹ̀ tí yóò tẹ̀ lé e hàn nínú ọ̀rọ̀ àsọtẹ́lẹ̀ Jésù, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘nígbà náà.’
- source_word: παραδώσουσιν ὑμᾶς
  choice: wọn yóò fi yín lé ... lọ́wọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ẹnì kan lé agbára ẹlòmíràn lọ́wọ́. Gbólóhùn Yorùbá yìí pa ìtumọ̀ ọ̀tá náà mọ́ láì fi kún un pé ìwà ọ̀dàlẹ̀ ni dandan.
- source_word: εἰς θλῖψιν
  choice: lé ìpọ́njú lọ́wọ́
  rationale: ‘Ìpọ́njú’ lè gba ìtumọ̀ ìyà, wàhálà líle, tàbí ìnúnibíni, ó sì pa agbára ọ̀rọ̀ náà àti ìfarahàn rẹ̀ nínú àsọtẹ́lẹ̀ ọjọ́ iwájú mọ́.
- source_word: ἀποκτενοῦσιν
  choice: wọn yóò sì pa yín
  rationale: Ìtumọ̀ tààrà ni ‘pa’; kò fi ìdájọ́ ìwà kun ọ̀rọ̀ Gíríìkì náà bí ‘pànìyàn’ ṣe lè ṣe.
- source_word: ἔσεσθε μισούμενοι
  choice: yóò sì kórìíra yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àkópọ̀ ọ̀rọ̀ ìṣe ọ̀rọ̀ Gíríìkì mu.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: gbogbo àwọn orílẹ̀-èdè
  rationale: ‘Orílẹ̀-èdè’ fi bí àtakò náà ṣe kárí ayé hàn ju kí a fi dandan túmọ̀ ἔθνη sí àwọn tí kì í ṣe Júù.
- source_word: διὰ τὸ ὄνομά μου
  choice: nítorí orúkọ mi
  rationale: Ó pa àwòrán ‘orúkọ’ inú orísun mọ́; níhìn-ín, orúkọ dúró fún ẹni Jésù àti ìfaramọ́ ẹni sí i.
theological_decisions:
- issue: Ìtumọ̀ θλῖψις nínú ọ̀rọ̀ àsọtẹ́lẹ̀ nípa ọjọ́ iwájú
  choice: ìpọ́njú
  alternative: ìyà; ìnúnibíni; wàhálà líle
  rationale: ‘Ìpọ́njú’ lè tọ́ka sí ìyà àti ìnúnibíni lásán, ó sì tún lè ní ìwọ̀n àsọtẹ́lẹ̀ ọjọ́ ìkẹyìn; kò fi ètò ẹ̀kọ́ ìsìn kan pàtó lé ẹsẹ náà lórí.
- issue: Ìtumọ̀ ἔθνη
  choice: àwọn orílẹ̀-èdè
  alternative: àwọn tí kì í ṣe Júù
  rationale: Àyíká ọ̀rọ̀ fi àtakò tó gbòòrò hàn; kò béèrè pé ká fi ìyàtọ̀ Júù àti aláìṣe-Júù síwájú.
- issue: Ìtumọ̀ ‘nítorí orúkọ mi’
  choice: pa àwòrán ‘orúkọ’ mọ́ nínú ẹsẹ náà
  alternative: nítorí pé ẹ jẹ́ ọmọlẹ́yìn mi
  rationale: Ìtumọ̀ àlàyé náà jẹ́ òtítọ́, ṣùgbọ́n pípa ‘orúkọ’ mọ́ ń ṣètìlẹ́yìn fún ìjìnlẹ̀ èdè Bíbélì láì sọ ìtumọ̀ rẹ̀ di ọ̀kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà tẹ̀ lé ìtẹ̀sí orísun Gíríìkì, ṣùgbọ́n ó lo ìṣètò ọ̀rọ̀ Yorùbá àdánidá.
