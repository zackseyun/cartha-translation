id: MAT.24.3
reference: Matthew 24:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: yo
  text: Bí ó ti jókòó lórí Òkè Ólífì, àwọn ọmọ-ẹ̀yìn wá sọ́dọ̀ rẹ ní ìkọ̀kọ̀, wọ́n ní, “Sọ fún wa, ìgbà wo ni àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀, kí sì ni àmì wíwá rẹ[a] àti òpin sáà náà[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wíwà rẹ” tàbí “dídé rẹ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìmúṣẹ sáà náà”; ní ìtumọ̀ àtọwọ́dọ́wọ́, “òpin ayé.”
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Bí ó ti jókòó
  rationale: A gbé àkópọ̀ genitive absolute náà jáde gẹ́gẹ́ bí gbólóhùn àkókò; ó fi hàn pé jíjókòó náà ń lọ lọ́wọ́ nígbà tí àwọn ọmọ-ẹ̀yìn dé.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: lórí Òkè Ólífì
  rationale: “Òkè Ólífì” jẹ́ orúkọ ibi tí ó ṣe kedere ní Yorùbá, ó sì bá ìtumọ̀ orúkọ Gíríìkì náà mu.
- source_word: προσῆλθον αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n sún mọ́ ọn, wọ́n sì wá bá a.
- source_word: κατ’ ἰδίαν
  choice: ní àdáni
  rationale: Ó túmọ̀ sí pé wọn kò bá a sọ̀rọ̀ ní gbangba tàbí láàárín ọ̀pọ̀ ènìyàn; “ní àdáni” kò fi dandan túmọ̀ sí pé ohun ìkọ̀kọ̀ búburú kan wà.
- source_word: Εἰπὸν ἡμῖν
  choice: Sọ fún wa
  rationale: Ìtumọ̀ àdánidá fún àṣẹ-ìbéèrè náà ní Yorùbá ni èyí.
- source_word: πότε ταῦτα ἔσται
  choice: ìgbà wo ni àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀
  rationale: “Yóò ṣẹlẹ̀” sọ ìtumọ̀ ọjọ́ iwájú ti ἔσται ní kedere, ó sì jẹ́ àdánidá ju ìtumọ̀ gẹ́gẹ́-bí-ọ̀rọ̀ “yóò wà” lọ.
- source_word: σημεῖον
  choice: àmì
  rationale: “Àmì” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ohun tí ń tọ́ka sí tàbí fi ìṣẹ̀lẹ̀ kan hàn.
- source_word: παρουσίας
  choice: wíwá
  rationale: Nínú ìbéèrè tó ń wo ọjọ́ iwájú yìí, “wíwá” lè gba ìtumọ̀ dídé tàbí fífi ara hàn, láìfi ẹ̀kọ́ pàtó kan kún ọ̀rọ̀ náà.
- source_word: συντελείας τοῦ αἰῶνος
  choice: òpin sáà yìí
  rationale: “Sáà” ń tọ́ka sí àkókò tàbí era kan, ó sì yẹra fún yíyí αἰών padà sí ayé gẹ́gẹ́ bí gbogbo ohun tí a dá.
theological_decisions:
- issue: Ìtumọ̀ παρουσία nínú ọ̀rọ̀ nípa ọjọ́ iwájú
  choice: wíwá
  alternative: wíwà níhìn-ín; dídé
  rationale: Παρουσία lè túmọ̀ sí wíwà níbẹ̀ tàbí dídé. “Wíwá” jẹ́ ọ̀rọ̀ Yorùbá tó rọ̀ tó láti gbé agbára ìbéèrè ọjọ́ iwájú náà, láìpinnu gbogbo àríyànjiyàn nípa bí ìṣẹ̀lẹ̀ náà yóò ṣe rí.
- issue: Ìtumọ̀ συντελείας τοῦ αἰῶνος
  choice: òpin sáà yìí
  alternative: ìparí pípé sáà yìí; òpin ayé
  rationale: Gíríìkì ń sọ̀rọ̀ nípa ìparí tàbí ìmúṣẹ sáà kan, kì í ṣe ní pàtó nípa ìparun gbogbo àgbáyé. “Òpin sáà yìí” pa ìyàtọ̀ yẹn mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye. “Ní àdáni” yẹra fún ìmọ̀lára àṣírí tí “ní ìkọ̀kọ̀” lè mú wá; “sáà” sì pa ìyàtọ̀ αἰών mọ́ láìdá a pọ̀ mọ́ gbogbo àgbáyé.
