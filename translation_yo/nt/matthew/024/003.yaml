revisions:
- from: Bí ó ti jókòó lórí Òkè Ólífì, àwọn ọmọ-ẹ̀yìn tọ̀ ọ́ wá ní àdáni, wọ́n ní, “Sọ fún wa, ìgbà wo ni àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀, kí sì ni àmì wíwá rẹ[a] àti ti òpin sáà yìí[b]?”
  to: Bí ó ti jókòó lórí Òkè Ólífì, àwọn ọmọ-ẹ̀yìn wá sọ́dọ̀ rẹ ní ìkọ̀kọ̀, wọ́n ní, “Sọ fún wa, ìgbà wo ni àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀, kí sì ni àmì wíwá rẹ[a] àti òpin sáà náà[b]?”
  rationale: Àtúnṣe náà mú ọ̀rọ̀ náà rọrùn ní Yorùbá, yọ ìfikún “níhìn-ín” kúrò nínú àlàyé παρουσία, ó sì ṣàtúnṣe “sáà yìí” sí “sáà náà” kí ó lè sún mọ́ τοῦ αἰῶνος. Ó pa àìdájú tó wà nínú παρουσία àti συντέλεια mọ́ nínú àwọn àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:26Z'
