id: MAT.24.32
reference: Matthew 24:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: yo
  text: 'Ẹ sì kọ́ àkàwé náà láti ara igi ọ̀pọ̀tọ́: ní kété tí ẹ̀ka rẹ̀ bá rọ̀, tí ó sì yọ ewé[b], ẹ mọ̀ pé ìgbà ẹ̀ẹ̀rùn[c] sún mọ́lé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí “rú ewé.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì θέρος lè túmọ̀ sí “ìgbà ẹ̀ẹ̀rùn,” àti ní àwọn àyíká ọ̀rọ̀ kan, àsìkò ìkórè; ìtumọ̀ àsìkò ni ó bá àwòrán igi ọ̀pọ̀tọ́ mu jù níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: Ẹ sì ... lára igi ọ̀pọ̀tọ́
  rationale: “Lára igi ọ̀pọ̀tọ́” fi igi náà hàn gẹ́gẹ́ bí orísun ohun tí a ó kọ́; “sì” sì ń gbé agbára ìsopọ̀ δέ jáde láì fi ọ̀rọ̀ àkókò bí “nísinsin yìí” kún un.
- source_word: μάθετε
  choice: Ẹ ... kọ́
  rationale: Ọ̀rọ̀ àṣẹ aorist náà jẹ́ ìpè tààrà sí ọ̀pọ̀ ènìyàn; “ẹ kọ́” jẹ́ èdè Yorùbá àdánidá fún kí ènìyàn gba ẹ̀kọ́ lára ohun kan.
- source_word: τὴν παραβολήν
  choice: àkàwé
  rationale: “Àkàwé” pa ìtumọ̀ àfiwé tàbí àpèjúwe tí παραβολή ní mọ́, láì sọ ọ́ di ẹ̀kọ́ ìtumọ̀ kan ṣoṣo.
- source_word: ὅταν ἤδη
  choice: ní kété tí ... bá
  rationale: Èyí sọ ipò àkókò gbogbogbò àti bí àmì náà ṣe bẹ̀rẹ̀ sí í hàn; ó jẹ́ ọ̀nà Yorùbá àdánidá fún “nígbà tí ó bá ti ṣẹlẹ̀ tán dé ìpele yìí.”
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: ẹ̀ka rẹ̀ bá rọ̀
  rationale: “Bá rọ̀” fi ìyípadà sí ipò tuntun hàn, ó sì bá ìrọ̀rùn ẹ̀ka tuntun mu ju ọ̀rọ̀ tí yóò túmọ̀ sí pé ẹ̀ka náà kò lágbára lọ.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: tí ó sì yọ ewé
  rationale: “Yọ ewé” jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún ewé tí ń rú jáde lára igi.
- source_word: γινώσκετε
  choice: ẹ mọ̀
  rationale: Èyí pa irú ìsọ̀rọ̀ ìmọ̀ gbogbogbò ti present indicative mọ́; a kò sọ ọ́ di àṣẹ míì.
- source_word: ἐγγὺς τὸ θέρος
  choice: ìgbà ẹ̀ẹ̀rùn ti sún mọ́lé
  rationale: Nínú àwòrán igi ọ̀pọ̀tọ́ yìí, θέρος tọ́ka sí àsìkò ẹ̀ẹ̀rùn; “ti sún mọ́lé” sọ bí àsìkò náà ṣe wà nítòsí lọ́nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ àwòrán igi ọ̀pọ̀tọ́
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí àpèjúwe àsìkò tí a fi ń mọ̀ pé ohun kan ti sún mọ́lé.
  alternative: Kí a sọ nínú ìtumọ̀ pé igi ọ̀pọ̀tọ́ dúró fún Ísírẹ́lì, tàbí pé ó jẹ́ àpẹẹrẹ ẹ̀dá lásán tí kò ní ìtumọ̀ míì.
  rationale: Ẹsẹ̀ Gíríìkì fúnra rẹ̀ kò dá igi ọ̀pọ̀tọ́ mọ́ Ísírẹ́lì níbí; nítorí náà, a pa àwòrán náà àti ààyè fún ìtumọ̀ ọ̀rọ̀ àsọtẹ́lẹ̀ rẹ̀ mọ́ láì pinnu àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nínú ìtumọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ẹ” tọ́ka sí ọ̀pọ̀ olùgbọ́, “sì” sì so ẹsẹ̀ náà mọ́ ọ̀rọ̀ tó ṣáájú láì fi “nísinsin yìí” tí kò sí nínú orísun kún un.
