id: MAT.24.39
reference: Matthew 24:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: yo
  text: Wọ́n kò sì mọ̀ títí di ìgbà tí ìkún omi fi dé, tí ó sì gbá gbogbo wọn lọ; bẹ́ẹ̀ náà ni wíwá Ọmọ Ènìyàn yóò rí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: wọn kò sì mọ̀
  rationale: Ó pa ìtumọ̀ Gíríìkì mọ́ láì fi ohun tí wọn kò mọ̀ kún un; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: κατακλυσμός
  choice: ìkún omi
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìkún omi ńlá; àyíká ẹsẹ̀ náà tọ́ka sí ìkún omi ní ọjọ́ Nóà.
- source_word: ἦρεν ἅπαντας
  choice: ó sì gbá gbogbo wọn lọ
  rationale: ἦρεν lè túmọ̀ sí gbígbé tàbí mímú kúrò; nínú àyíká ìkún omi, ‘gbá ... lọ’ jẹ́ àwòrán tí ó ṣe kedere, tí kò sì dín agbára ìṣẹ̀lẹ̀ náà kù.
- source_word: παρουσία
  choice: wíwá
  rationale: ‘Wíwá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìfarahàn tàbí dídé ẹni tí a ń retí, láì fi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀ náà.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó jẹ́ ìtumọ̀ àkọlé náà ní ọ̀nà tí a mọ̀ dáadáa nínú Bíbélì Yorùbá, ó sì pa ìṣọ̀kan ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ οὐκ ἔγνωσαν
  choice: wọn kò sì mọ̀
  alternative: wọn kò sì kíyè sí i
  rationale: A yan ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì, nítorí pé ẹsẹ̀ náà kò sọ ní pàtó bóyá àìmọ̀, àìlóye, tàbí àìkíyèsí ni ó wà lọ́kàn.
- issue: Àfikún καὶ ṣáájú ἡ παρουσία
  choice: bẹ́ẹ̀ náà ni
  alternative: bẹ́ẹ̀ náà pẹ̀lú ni
  rationale: Nínú gbólóhùn Yorùbá yìí, ‘bẹ́ẹ̀ náà’ ti fi ìtumọ̀ ‘also’ hàn ní ti ẹ̀dá; fífi ‘pẹ̀lú’ kún un lè mú kí ó wuwo láì yí ìtumọ̀ padà.
translation_notes:
  register: Yorùbá àมาตรฐาน pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa ìfiwéra àti àìsọ ohun tí àwọn ènìyàn kò mọ̀ ní pàtó mọ́.
