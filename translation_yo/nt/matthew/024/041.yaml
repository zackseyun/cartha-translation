  source_fidelity: Ìtumọ̀ náà fi abo púpọ̀ ti ἀλήθουσαι hàn ní kedere pẹ̀lú “Àwọn obìnrin méjì,” ó sì pa ìyàtọ̀ “ọ̀kan ... ọ̀kan” mọ́. “A ó mú” àti “a ó sì fi ... sílẹ̀” tún dá àìdánilójú ìtumọ̀ ìṣẹ̀lẹ̀ eschatological dúró bí ó ti wà nínú Gíríìkì. Àmọ́, ἐν τῷ μύλῳ túmọ̀ sí ibi/ní ọlọ; “lọ ọlọ” lè jẹ́ ọ̀nà lílọ ohun kan, ṣùgbọ́n kò fi ìbáṣepọ̀ ibi “ní ọlọ” hàn lójú gẹ́gẹ́ bí ọ̀rọ̀ ìpilẹ̀.
