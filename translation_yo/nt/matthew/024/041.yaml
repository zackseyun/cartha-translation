  terminology: “Obìnrin,” “ọlọ,” “mú,” àti “fi sílẹ̀” bá ìforúkọsílẹ̀ ìtàn-àsọtẹ́lẹ̀ tó níyì mu. A kò yẹ kí a ṣàfikún ìtumọ̀ ìgbàlà tàbí ìdájọ́ sí ọ̀rọ̀ àkọ́kọ́.
