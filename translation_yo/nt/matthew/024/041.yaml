  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: yo
  text: Àwọn obìnrin méjì[a] yóò máa lọ ní ọlọ[b]; a ó mú ọ̀kan, a ó sì fi ọ̀kan sílẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà mìíràn: “Obìnrin méjì tí ń lọ ní ọlọ.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ti abo, púpọ̀, ó sì fi hàn pé obìnrin ni àwọn ẹni méjèèjì.'
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní ọlọ ọwọ́” tàbí “pẹ̀lú òkúta ọlọ”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọlọ tàbí òkúta ọlọ ní pàtó.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì sọ ní ṣókí pé a mú ọ̀kan, a sì fi ọ̀kan sílẹ̀; kò sọ níbí bóyá mímú náà jẹ́ fún ìgbàlà tàbí fún ìdájọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο
  choice: méjì
  rationale: Nọ́ńbà náà ń tọ́ka sí ẹni méjì; ọ̀rọ̀ arọ́pò-orúkọ abo tó tẹ̀ lé e ló fi hàn pé obìnrin ni wọ́n.
- source_word: ἀλήθουσαι
  choice: àwọn obìnrin ... yóò máa lọ ọlọ
  rationale: Ọ̀rọ̀ náà jẹ́ participle abo, púpọ̀, ó sì túmọ̀ sí ‘lọ ọlọ.’ Fífi ‘àwọn obìnrin’ kún un jẹ́ dandan láti fi abo tó wà nínú Gíríìkì hàn ní Yorùbá; ‘yóò máa’ sì bá àyíká àsọtẹ́lẹ̀ náà mu.
- source_word: ἐν τῷ μύλῳ
  choice: lọ ọlọ
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún iṣẹ́ lílọ ohun èlò ọlọ; kò pinnu bóyá gbogbo ọlọ ni tàbí òkúta ọlọ pàtó.
- source_word: μία ... μία
  choice: ọ̀kan ... ọ̀kan
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ẹni méjèèjì mọ́ ní kedere.
- source_word: παραλαμβάνεται
  choice: a ó mú ọ̀kan
  rationale: Ìtumọ̀ yìí jẹ́ ti ṣókí, ó sì pa àìdánilójú mọ́ nípa ibi tí a mú ẹni náà sí tàbí bóyá ìgbàlà tàbí ìdájọ́ ni ó túmọ̀ sí.
- source_word: καὶ
  choice: a ó sì
  rationale: ‘Sì’ so ìṣe kejì pọ̀ mọ́ ti àkọ́kọ́ láìfi ìtumọ̀ àtakò tí kò sí nínú Gíríìkì kún un.
- source_word: ἀφίεται
  choice: fi ọ̀kan sílẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ‘jẹ́ kí ó kù’ tàbí ‘fi sílẹ̀,’ láìmú ìtumọ̀ náà le ju ti Gíríìkì lọ.
theological_decisions:
- issue: Bóyá kí a sọ abo àwọn ẹni tí participle náà ń tọ́ka sí ní gbangba
  choice: Àwọn obìnrin méjì
  alternative: Ẹni méjì
  rationale: ἀλήθουσαι jẹ́ abo, púpọ̀; nítorí náà, ìtumọ̀ yẹ kí ó fi hàn pé obìnrin ni àwọn méjèèjì.
- issue: Bóyá kí a ṣàlàyé παραλαμβάνεται àti ἀφίεται gẹ́gẹ́ bí ìgbàlà tàbí ìdájọ́
  choice: a ó mú ọ̀kan, a ó sì fi ọ̀kan sílẹ̀
  alternative: a ó mú ọ̀kan lọ sí ìgbàlà, a ó sì fi èkejì sílẹ̀ fún ìdájọ́; tàbí òdìkejì èyí
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ ohun tí mímú ẹni náà tàbí fífi ẹni kejì sílẹ̀ túmọ̀ sí nípa ẹ̀kọ́ ìgbàlà àti ìdájọ́. Ìtumọ̀ náà pa àìdánilójú àti ìforígbárí ìtumọ̀ yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìsọ̀rọ̀ náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbòò. Gbólóhùn “lọ ọlọ” jẹ́ ọ̀nà Yorùbá àdánidá fún iṣẹ́ lílọ ní ọlọ.
