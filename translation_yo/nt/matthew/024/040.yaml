  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní ìwòye gbogbogbò: ‘Nígbà náà,’ ibi iṣẹ́ ní oko, àti ìyàtọ̀ láàárín ẹni tí a mú lọ àti ẹni tí a fi sílẹ̀ ni a ti pa mọ́. ‘Ọkùnrin méjì’ jẹ́ ìpinnu tí ó ṣeé gbà nínú àyíká ìfiwéra àwọn ọkùnrin ní ẹsẹ yìí àti àwọn obìnrin ní ẹsẹ tó tẹ̀lé. Síbẹ̀, ‘èkejì’ túmọ̀ sí ‘ẹni kejì’ ó sì ṣàfikún ìlànà ordinal tí Gíríìkì kò sọ; εἷς ... εἷς tún ọ̀rọ̀ náà ṣe ní ìwọ̀n kan náà.'
