base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: yo
  text: Nígbà náà, ọkùnrin méjì yóò wà ní oko; a ó mú ọ̀kan lọ[a], a ó sì fi ọ̀kan sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó mú ọ̀kan lọ pẹ̀lú.” Ọ̀rọ̀ ìṣe náà fúnra rẹ̀ kò sọ bóyá a mú ẹni náà lọ fún ìgbàlà tàbí fún ìdájọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ àyíká àsọtẹ́lẹ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘ní àkókò náà’ ní Yorùbá.
- source_word: δύο ἔσονται
  choice: ọkùnrin méjì yóò wà
  rationale: Bí ó tilẹ̀ jẹ́ pé δύο túmọ̀ sí ‘méjì,’ àwọn ọ̀rọ̀ akọ εἷς ... εἷς àti àpẹẹrẹ àwọn obìnrin ní ẹsẹ tó tẹ̀ lé fi hàn pé ọkùnrin ni àwọn méjèèjì nínú àwòrán yìí.
- source_word: ἐν τῷ ἀγρῷ
  choice: ní oko
  rationale: Ìtumọ̀ ibi tó ṣe tààrà, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: εἷς
  choice: ọ̀kan / èkejì
  rationale: ‘Ọ̀kan’ àti ‘èkejì’ mú ìyàtọ̀ tó wà láàárín àwọn méjèèjì ṣe kedere ní Yorùbá láì tún ‘ọkùnrin’ sọ.
- source_word: παραλαμβάνεται
  choice: a ó mú ọ̀kan lọ
  rationale: Ìṣe aláìlórúkọ ní ọ̀nà ọ̀rọ̀ ọjọ́ iwájú jẹ́ àdánidá ní Yorùbá, ‘mú ... lọ’ sì pa àìdánilójú mọ́ nípa bóyá gbígbé náà jẹ́ fún ìgbàlà tàbí ìdájọ́.
- source_word: ἀφίεται
  choice: a ó fi èkejì sílẹ̀
  rationale: Ó túmọ̀ sí pé a kò mú ẹni kejì lọ; kò fi ìtumọ̀ líle bí ‘kọ̀ sílẹ̀ pátápátá’ kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá παραλαμβάνεται túmọ̀ sí mímú ẹni lọ fún ìgbàlà tàbí fún ìdájọ́
  choice: Pa á mọ́ gẹ́gẹ́ bí ‘a ó mú ọ̀kan lọ,’ láì sọ ète rẹ̀ ní pàtó.
  alternative: ‘A ó gba ọ̀kan là’ tàbí ‘a ó mú ọ̀kan lọ fún ìdájọ́.’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò pinnu ète gbígbé náà ní kedere; ìtumọ̀ gbọ́dọ̀ pa àìdánilójú àti ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Bóyá kí a sọ akọ àwọn méjèèjì ní kedere
  choice: Lo ‘ọkùnrin méjì.’
  alternative: ‘Èèyàn méjì’ tàbí ‘méjì.’
  rationale: Àwọn arọ́pò-orúkọ akọ εἷς ... εἷς àti àpẹẹrẹ àwọn obìnrin ní ẹsẹ tó tẹ̀ lé ṣe àtìlẹ́yìn fún àwòrán àwọn ọkùnrin méjì nínú ẹsẹ yìí.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ìṣe aláìlórúkọ ‘a ó’ láti ṣàfihàn passive Gíríìkì láì dá ẹni tó ṣe ìṣe náà mọ̀.
