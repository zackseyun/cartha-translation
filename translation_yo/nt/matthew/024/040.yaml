  terminology: ‘Oko,’ ‘mú ... lọ,’ àti ‘fi ... sílẹ̀’ yẹ, wọ́n sì pa àìdánilójú ti παραλαμβάνεται mọ́. Àlàyé ìsàlẹ̀ yẹ kí ó lo ‘mú ... lọ pẹ̀lú,’ kì í ṣe ‘mú ... pẹ̀lú’ nìkan, kí yíyàn ọ̀rọ̀ náà lè hàn ní kíkún.
