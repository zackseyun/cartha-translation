id: MAT.24.29
reference: Matthew 24:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: yo
  text: “Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀ lẹ́yìn ìpọ́njú ọjọ́ wọ̀nyẹn, oòrùn yóò ṣókùnkùn, òṣùpá kì yóò sì tan ìmọ́lẹ̀ rẹ̀, àwọn ìràwọ̀ yóò sì jábọ́ láti ọ̀run[a], a ó sì mì àwọn agbára ọ̀run[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láti ojú ọ̀run.”
    reason: οὐρανός lè túmọ̀ sí ọ̀run tàbí ojú ọ̀run; àṣàyàn yìí jẹ́ kí òǹkàwé rí ìtumọ̀ mìíràn náà.
  - marker: b
    text: “Àwọn agbára ọ̀run” lè tọ́ka sí àwọn agbára àgbáyé, àwọn ohun ojú ọ̀run, tàbí àwọn alágbára ọ̀run; gbólóhùn Gíríìkì náà kò sọ èyí tó jẹ́ ní pàtó.
    reason: Àlàyé yìí pa àìdánilójú ìtumọ̀ gbólóhùn Gíríìkì mọ́ láìyan ọ̀kan ṣoṣo.
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀
  rationale: “Lẹ́sẹ̀kẹsẹ̀” fi agbára ìtumọ̀ àkókò Εὐθέως hàn ní Yorùbá òde òní; “Ṣùgbọ́n” sì mú ìyípadà kékeré tí δὲ ń ṣe nínú ọ̀rọ̀ náà jáde.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: lẹ́yìn ìpọ́njú ọjọ́ wọ̀nyẹn
  rationale: “Ìpọ́njú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìṣòro líle tàbí ìyà tí θλῖψις ń tọ́ka sí, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú “ọjọ́ wọ̀nyẹn” mọ́.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: oòrùn yóò ṣókùnkùn
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé oòrùn yóò di òkùnkùn, láìfi ìtumọ̀ àfikún sí ẹni tàbí ohun tó fa á.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: òṣùpá kì yóò sì tan ìmọ́lẹ̀ rẹ̀
  rationale: Gbólóhùn yìí ṣe àfihàn àwòrán pé òṣùpá kò ní mú ìmọ́lẹ̀ rẹ̀ jáde, ó sì jẹ́ Yorùbá àdánidá ju ìtumọ̀ ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ bí “fúnni ní ìmọ́lẹ̀” lọ.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: àwọn ìràwọ̀ yóò sì jábọ́ láti ọ̀run
  rationale: “Jábọ́” mú ìtumọ̀ ìṣubú láti ibi gíga hàn dáadáa; “ọ̀run” sì pa àyè ìtumọ̀ “heaven/sky” tí οὐρανός ní mọ́.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: àwọn agbára àwọn ọ̀run
  rationale: Ìtumọ̀ yìí pa ọ̀pọ̀ nọ́ńbà nínú τῶν οὐρανῶν àti àìdánilójú δυνάμεις mọ́, láìpinnu bóyá ó ń tọ́ka sí agbára àgbáyé, àwọn ohun ojú ọ̀run, tàbí àwọn ẹ̀dá alágbára ní ọ̀run.
- source_word: σαλευθήσονται
  choice: yóò sì mì tìtì
  rationale: “Mì tìtì” jẹ́ ọ̀nà Yorùbá tó lágbára, tó sì bójú mu fún ohun tí a mì tàbí tí a rú kúrò ní ipò rẹ̀.
theological_decisions:
- issue: Irú àwọn àmì àgbáyé inú èdè àsọtẹ́lẹ̀ àti àfihàn
  choice: A pa àwòrán oòrùn, òṣùpá, ìràwọ̀ àti àwọn agbára ọ̀run mọ́ gẹ́gẹ́ bí orísun ṣe sọ ọ́.
  alternative: Láti tú gbogbo rẹ̀ sí ìṣẹ̀lẹ̀ ìmọ̀ ìjìnlẹ̀ nípa àwọn ohun ojú ọ̀run nìkan, tàbí sí àmì ìṣèlú àti ìdájọ́ nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì kò pinnu ní kedere bóyá gbogbo àwòrán náà jẹ́ ti ara, ti àmì, tàbí àwọn méjèèjì; nítorí náà, ìtumọ̀ náà kò gbọ́dọ̀ fi ètò ẹ̀kọ́ nípa òpin ayé kan lé e lórí.
- issue: Ìdánimọ̀ “àwọn agbára àwọn ọ̀run”
  choice: A fi gbólóhùn náà sílẹ̀ ní ọ̀nà gbígbòòrò.
  alternative: Láti pè wọ́n ní àwọn áńgẹ́lì, àwọn ohun ojú ọ̀run, tàbí àwọn agbára àgbáyé ní pàtó.
  rationale: δυνάμεις τῶν οὐρανῶν lè gba ọ̀pọ̀ ìtumọ̀; fífi àìdánilójú yẹn pamọ́ ń bọ̀wọ̀ fún orísun.
translation_notes:
  register: Yorùbá ìwé mímọ́ tó bójú mu, tó ní iyì, ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. A tún gbe àwọn àmì àlàyé [a] àti [b] sí ibi tí ọ̀kọ̀ọ̀kan ń ṣàlàyé gan-an.
