  to: “Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀ lẹ́yìn ìpọ́njú ọjọ́ wọ̀nyẹn, oòrùn yóò ṣókùnkùn, òṣùpá kì yóò sì tan ìmọ́lẹ̀ rẹ̀, àwọn ìràwọ̀ yóò sì jábọ́ láti ọ̀run[a], a ó sì mì àwọn agbára ọ̀run[b].”
