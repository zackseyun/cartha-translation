  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa nípa rírán àwọn áńgẹ́lì, ìpè, kíkó àwọn àyànfẹ́ jọ, ‘ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin,’ àti ìwọ̀n àwọn ọ̀run. Ṣùgbọ́n ‘àwọn tí ó yàn’ lè túmọ̀ sí ‘àwọn tí wọ́n yàn’ ní Yorùbá, dípò ‘àwọn ẹni tí ó yàn’; ó yẹ kí a mú ìbáṣepọ̀ ‘rẹ̀’ inú ἐκλεκτοὺς αὐτοῦ hàn kedere. Gbólóhùn ‘láti òpin kan àwọn ọ̀run’ sì nílò ìṣètò gírámà tó dára jù.
  naturalness: Àwọn ọ̀rọ̀ bí ‘láti inú ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin’ àti ‘láti òpin kan àwọn ọ̀run’ kò ṣẹ̀ṣẹ̀ dára jù nínú Yorùbá ìgbàlódé. ‘Láti àwọn ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin’ àti ‘láti òpin kan ti àwọn ọ̀run dé òpin kejì wọn’ jẹ́ kedere, wọ́n sì pa àwòrán orísun náà mọ́.
  terminology: ‘Àwọn áńgẹ́lì’ yẹ fún ἀγγέλους. ‘Àwọn àyànfẹ́ rẹ̀’ jẹ́ ọ̀nà tó mọ́, tó sì wọ́pọ̀ láti fi ἐκλεκτούς αὐτοῦ hàn, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn tó ju ti ẹsẹ̀ náà lọ kún un. ‘Ìpè ńlá’ ń pa àìdájú μικρὸ/μεγάλη—níbí μεγάλη—mọ́ dáadáa ju fífi ‘ìró’ kún un gẹ́gẹ́ bí ìtumọ̀ pàtàkì.
