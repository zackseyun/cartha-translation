    rationale: ἐκ jẹ́ ‘láti,’ kì í ṣe dandan ‘láti inú.’ ‘Láti àwọn ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin’ jẹ́ kíkà àkànlò tó rọrùn.
