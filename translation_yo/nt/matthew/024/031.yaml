id: MAT.24.31
reference: Matthew 24:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: yo
  text: Ó sì yóò rán àwọn áńgẹ́lì rẹ̀ pẹ̀lú ìpè ńlá[a], wọ́n yóò sì kó àwọn àyànfẹ́ rẹ̀[b] jọ láti àwọn ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin[c], láti òpin kan ti àwọn ọ̀run dé òpin kejì wọn[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “pẹ̀lú ìpè tí ń dún sókè” tàbí “pẹ̀lú ìró ìpè.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “àwọn ẹni tí ó yàn.”'
    reason: lexical_alternative
  - marker: c
    text: Gbólóhùn náà, “ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin,” jẹ́ àkànlò èdè tó túmọ̀ sí ibi jíjìnnà jù lọ ní gbogbo ìhà.
    reason: cultural_note
  - marker: d
    text: 'Ní Gíríìkì: “láti àwọn òpin àwọn ọ̀run dé àwọn òpin wọn”; ó túmọ̀ sí láti òpin kan dé òpin kejì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: máa rán
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú yìí túmọ̀ sí pé yóò rán wọn jáde fún iṣẹ́ kan; “máa rán” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọjọ́ iwájú nínú àyíká yìí.
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Nínú àyíká ọ̀rọ̀ nípa ìpadà Ọmọ Ènìyàn, àwọn ẹ̀dá ọ̀run ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: pẹ̀lú ìró ìpè ńlá
  rationale: Ìtumọ̀ yìí pa àwòrán ìpè mọ́, ó sì jẹ́ kí agbara ìró tí μεγάλη lè tọ́ka sí hàn ní Yorùbá àdánidá, láìfi dandan pinnu bóyá “ńlá” ń ṣàpèjúwe ìpè náà tàbí ìró rẹ̀.
- source_word: ἐπισυνάξουσιν
  choice: wọn yóò sì kó ... jọ
  rationale: “Kó ... jọ” sọ ìṣe kíkó àwọn ènìyàn papọ̀ ní kedere; “wọn” ń tọ́ka sí àwọn áńgẹ́lì.
- source_word: ἐκλεκτούς
  choice: àwọn tí ó yàn
  rationale: Ó sọ ìtumọ̀ pé Ọlọ́run ti yàn wọ́n ní èdè Yorùbá tí ó ṣe kedere, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn kan tí ó lè ní ìtumọ̀ àfikún sí i.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: láti inú ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin
  rationale: A pa àwòrán ọ̀rọ̀ Gíríìkì náà mọ́ dípò yíyí i padà sí “ìhà mẹ́rẹ̀ẹ̀rin”; ó jẹ́ àkànlò èdè fún gbogbo ìhà jíjìnnà.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: láti òpin kan àwọn ọ̀run dé òpin kejì
  rationale: Ìtumọ̀ àdánidá yìí fi ìwọ̀n gbogbo agbègbè náà hàn, ó sì pa ọ̀pọ̀ “àwọn ọ̀run” inú Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἐκλεκτούς láìfi èrò ẹ̀kọ́ ìsìn kan lé e lórí
  choice: àwọn tí ó yàn
  alternative: àwọn àyànfẹ́ rẹ̀
  rationale: Ẹsẹ̀ náà sọ pé wọ́n jẹ́ ẹni tí ó yàn, ṣùgbọ́n kò ṣàlàyé gbogbo ètò ẹ̀kọ́ nípa yíyan. Ìtumọ̀ pàtàkì náà pa ìdí yẹn mọ́ láìyanju ìjiyàn ẹ̀kọ́ ìsìn.
- issue: Ìwọ̀n ibi tí a ó ti kó àwọn tí a yàn jọ
  choice: láti inú ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin, láti òpin kan àwọn ọ̀run dé òpin kejì
  alternative: láti gbogbo ìhà ayé
  rationale: A pa àwòrán tó gbòòrò, tó sì ní ìfarahàn ti ọ̀run inú orísun Gíríìkì mọ́, dípò dín in kù sí àlàyé nípa ilẹ̀ ayé nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa àwòrán ìpè, ẹ̀fúùfù mẹ́rẹ̀ẹ̀rin àti àwọn ọ̀run mọ́.
