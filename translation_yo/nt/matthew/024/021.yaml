id: MAT.24.21
reference: Matthew 24:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: yo
  text: Nítorí nígbà náà, ìpọ́njú ńlá[a] yóò wà, irú èyí tí kò tíì ṣẹlẹ̀ rí láti ìbẹ̀rẹ̀ ayé títí di ìsinsìnyí, tí kì yóò sì tún ṣẹlẹ̀ mọ́ láéláé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdààmú ńlá” tàbí “ìnira ńlá.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìṣòro tó le, ìnira, tàbí ìfipámúnilára.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Nítorí nígbà náà
  rationale: “Nítorí” pa agbára àlàyé γάρ mọ́, “nígbà náà” sì túmọ̀ τότε ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἔσται
  choice: yóò wà
  rationale: Pẹ̀lú “ìpọ́njú ńlá” gẹ́gẹ́ bí olùṣe, “yóò wà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun náà yóò dé tàbí yóò ṣẹlẹ̀.
- source_word: θλῖψις μεγάλη
  choice: ìpọ́njú ńlá
  rationale: “Ìpọ́njú” lè túmọ̀ sí ìnira, ìdààmú, tàbí ìfipámúnilára tó le; “ńlá” sì fi μεγάλη hàn tààrà. Àṣàyàn yìí pa ìwúwo ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn pàtó kún un.
- source_word: οἵα
  choice: irú èyí tí
  rationale: Gbólóhùn yìí fi ìfiwéra tó dá lórí irú àti bí ohun náà ṣe le tó hàn ní Yorùbá àdánidá.
- source_word: οὐ γέγονεν
  choice: kò tíì ṣẹlẹ̀ rí
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí kò tíì wáyé títí dé àkókò tí a ń sọ̀rọ̀; “kò tíì ṣẹlẹ̀ rí” mú ìtumọ̀ perfect náà àti agbára ìkọ̀ náà jáde.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: láti ìbẹ̀rẹ̀ ayé
  rationale: “Ayé” ni ìtumọ̀ tó ṣe déédéé fún κόσμος níbí, gbólóhùn náà sì jẹ́ àfihàn àkókò tó ṣe kedere.
- source_word: ἕως τοῦ νῦν
  choice: títí di ìsinsìnyí
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó péye, tó sì wọ́pọ̀ fún gbólóhùn àkókò náà.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: tí kì yóò sì tún ṣẹlẹ̀ mọ́ láéláé
  rationale: “Kì yóò … mọ́ láéláé” mú ìkọ̀ ọjọ́ iwájú tó lágbára nínú οὐ μή jáde, “tún” sì fi ìfiwéra pẹ̀lú ohun tí a ṣẹ̀ṣẹ̀ sọ hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ θλῖψις tó ní ìwúwo ní ọ̀rọ̀ nípa òpin àkókò
  choice: ìpọ́njú
  alternative: ìdààmú; ìnira; ìyà
  rationale: “Ìpọ́njú” pa ìwúwo àti àfojúsùn ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n kò sọ pé ó jẹ́ orúkọ ìṣẹ̀lẹ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó. Àwọn ìtumọ̀ míì wà nítorí θλῖψις lè tọ́ka sí ìdààmú, ìnira, tàbí ìfipámúnilára.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ tó bójú mu, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. A lo “kò tíì ṣẹlẹ̀ rí” àti “kì yóò sì tún ṣẹlẹ̀ mọ́ láéláé” láti pa ìfiwéra àti ìkọ̀ tó lágbára nínú orísun mọ́.
