id: MAT.24.49
reference: Matthew 24:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: yo
  text: ó sì bẹ̀rẹ̀ sí í lu àwọn ẹlẹ́rú ẹlẹgbẹ́ rẹ̀[a], ó sì ń jẹ, ó sì ń mu pẹ̀lú àwọn ọ̀mùtí[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́ ẹlẹgbẹ́ rẹ̀.” Ní ti gidi, ọ̀rọ̀ Gíríìkì túmọ̀ sí “àwọn ẹrú ẹlẹgbẹ́,” ó sì tẹnu mọ́ pé olúwa kan náà ni wọ́n jọ wà lábẹ́ rẹ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn tí ń mutí yó.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn tí ìmutípara jẹ́ ìwà wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: bẹ̀rẹ̀ sí í lu
  rationale: Àkójọpọ̀ ọ̀rọ̀-ìṣe náà túmọ̀ sí bíbẹ̀rẹ̀ ìṣe kan; “bẹ̀rẹ̀ sí í lu” jẹ́ Yorùbá àdánidá, ó sì lè fi ìlù léraléra hàn nínú àyíká yìí.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: àwọn ẹlẹ́rú ẹlẹgbẹ́ rẹ̀
  rationale: σύνδουλος ń tọ́ka sí àwọn tí wọ́n jọ jẹ́ ẹrú lábẹ́ ọ̀gá kan náà. “Àwọn ẹlẹ́rú ẹlẹgbẹ́ rẹ̀” pa ipò ìsìnrú tí wọ́n jọ ní mọ́ láìsọ wọ́n di ìránṣẹ́ lásán.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: ó sì ń jẹ, ó sì ń mu
  rationale: Ìlò àkókò ìsinsìnyí nínú Gíríìkì lè ṣàpèjúwe ìṣe tí ń bá a lọ tàbí ìwà àṣà; àmì “ń” mú èyí jáde ní Yorùbá.
- source_word: μετὰ τῶν μεθυόντων
  choice: pẹ̀lú àwọn ọ̀mùtí
  rationale: Participle náà ń ṣàpèjúwe àwọn tí ìmutípara jẹ́ ìwà wọn. “Àwọn ọ̀mùtí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìforúkọ ẹni gẹ́gẹ́ bí ìwà rẹ̀ mu.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ inú ẹbí δοῦλος ní συνδούλους
  choice: àwọn ẹlẹ́rú ẹlẹgbẹ́ rẹ̀
  alternative: àwọn ìránṣẹ́ ẹlẹgbẹ́ rẹ̀
  rationale: Nínú àkàwé ilé olúwa yìí, ipò àwọn tí olúwa kan náà ní láṣẹ lórí ṣe pàtàkì. “Ẹlẹ́rú” fi òtítọ́ àwùjọ àti agbára ọ̀rọ̀ Gíríìkì hàn ju “ìránṣẹ́” lọ.
- issue: Bí a ṣe máa túmọ̀ μεθυόντων
  choice: àwọn ọ̀mùtí
  alternative: àwọn tí ń mutí yó
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn tí ìmutípara ń dá mọ̀. Ọ̀rọ̀ àkọ́kọ́ jẹ́ ṣókí, àdánidá, ó sì pa ìtumọ̀ ìwà àṣà mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ fi ọ̀nà míì hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọ “ẹlẹ́rú ẹlẹgbẹ́” jẹ́ ọlọ́lá ṣùgbọ́n ó ṣì yé òǹkàwé òde òní; ìṣètò “ó sì ń jẹ, ó sì ń mu” jẹ́ àdánidá, ó sì mú ìṣe tó ń bá a lọ jáde.
