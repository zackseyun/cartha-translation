id: MAT.24.24
reference: Matthew 24:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: yo
  text: Nítorí àwọn Mèsáyà èké[a] àti àwọn wòlíì èké yóò dìde, wọn yóò sì ṣe àwọn àmì ńlá àti àwọn ohun ìyanu, láti mú, bí ó bá ṣeé ṣe[c], àwọn àyànfẹ́ pàápàá ṣìnà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn Kristi èké.” Ọ̀rọ̀ Gíríìkì lo oyè Christos; a túmọ̀ rẹ̀ sí “Mèsáyà” níhìn-ín nítorí pé oyè ni, kì í ṣe orúkọ ẹni.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “tan … jẹ.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí mímú ẹnì kan rìn gbéregbère tàbí kúrò ní ọ̀nà tó tọ́; nítorí náà ni a ṣe lò “mú … ṣìnà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “bí ó bá lè ṣeé ṣe.” Gíríìkì kàn sọ pé “bí ó bá ṣeé ṣe,” láì sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: yóò dìde
  rationale: Ọ̀rọ̀ yìí níhìn-ín ń sọ nípa àwọn ènìyàn tí yóò dìde síta tàbí tí yóò farahàn láàárín àwọn ènìyàn; “yóò dìde” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ láì fi dandan túmọ̀ sí àjíǹde òkú.
- source_word: ψευδόχριστοι
  choice: àwọn Mèsáyà èké
  rationale: Χριστός jẹ́ oyè níhìn-ín, nítorí náà “Mèsáyà” bá ìtumọ̀ oyè náà mu ju lílo “Kristi” bí ẹni pé ó jẹ́ orúkọ lọ; ψευδο- sì di “èké.”
- source_word: ψευδοπροφῆται
  choice: àwọn wòlíì èké
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tí ó sì wọ́pọ̀ fún ọ̀rọ̀ àkópọ̀ Gíríìkì náà.
- source_word: δώσουσιν
  choice: wọn yóò sì ṣe
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan δίδωμι ni “fún,” pẹ̀lú “àmì àti ohun ìyanu,” Yorùbá àdánidá máa ń sọ pé ẹnì kan “ṣe” irú nǹkan bẹ́ẹ̀.
- source_word: σημεῖα μεγάλα
  choice: àwọn àmì ńlá
  rationale: “Àmì” pa agbára σημεῖον gẹ́gẹ́ bí ohun tí ń tọ́ka sí ohun mìíràn mọ́, dípò kí a sọ ọ́ di iṣẹ́ ìyanu nìkan; μεγάλα sì di “ńlá.”
- source_word: τέρατα
  choice: àwọn ohun ìyanu
  rationale: Ọ̀rọ̀ yìí ń tẹnumọ́ ohun tó ń ya ènìyàn lẹ́nu; “àwọn ohun ìyanu” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ ọ́.
- source_word: ὥστε πλανῆσαι
  choice: láti mú … ṣìnà
  rationale: Ìtumọ̀ yìí pa èrò àfojúsùn tàbí àbájáde tí ὥστε pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ń gbé jáde mọ́, láì fi tipátipá yan ọ̀kan nínú méjèèjì.
- source_word: πλανῆσαι
  choice: mú … ṣìnà
  rationale: πλανάω lè túmọ̀ sí mímú ẹnì kan kúrò ní ọ̀nà tó tọ́, kì í ṣe pípa irọ́ fún un nìkan; “mú … ṣìnà” pa àwòrán yìí mọ́.
- source_word: εἰ δυνατὸν
  choice: bí ó bá ṣeé ṣe
  rationale: Èyí tẹ̀lé gbólóhùn Gíríìkì kúkúrú náà ní tààrà, kò sì fi ìtumọ̀ àtakò tí kò hàn gbangba sínú rẹ̀.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: àwọn àyànfẹ́ pàápàá
  rationale: καί ní agbára “pàápàá” níhìn-ín, ἐκλεκτούς sì jẹ́ àwọn tí a yàn; “àwọn àyànfẹ́” jẹ́ ọ̀rọ̀ Yorùbá Bíbélì tó mọ́gbọ́n dání.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ψευδόχριστοι níbi tí Χριστός ti jẹ́ oyè
  choice: àwọn Mèsáyà èké
  alternative: àwọn Kristi èké
  rationale: “Mèsáyà” fi hàn pé oyè ni ọ̀rọ̀ náà ní àyíká ìkìlọ̀ yìí, ó sì pa gbòǹgbò ìrètí Mèsáyà ti àwọn Júù mọ́.
- issue: Agbára εἰ δυνατὸν nípa àwọn àyànfẹ́
  choice: bí ó bá ṣeé ṣe
  alternative: bí ó bá lè ṣeé ṣe rárá
  rationale: Gíríìkì sọ ipò náà ní ṣókí, kò sì pinnu ní gbangba bóyá ó ṣeé ṣe tàbí kò ṣeé ṣe. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà sílẹ̀ láì dájọ́ rẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà tẹ̀lé ìṣàn ọ̀rọ̀ Yorùbá àdánidá, ṣùgbọ́n ó pa àwòrán àti àìdánilójú pàtàkì inú Gíríìkì mọ́.
