id: MAT.24.6
reference: Matthew 24:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: yo
  text: Ẹ ó sì gbọ́ nípa àwọn ogun àti ìròyìn nípa àwọn ogun[a]. Ẹ ṣọ́ra kí ẹ má fòyà, nítorí ó gbọdọ̀ ṣẹlẹ̀; ṣùgbọ́n òpin kò tíì dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn agbasọ ogun.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìròyìn, ìhìn, tàbí agbasọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: Ẹ ó sì máa
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ohun tí a retí pé yóò ṣẹlẹ̀ lọ́jọ́ iwájú; “ẹ ó sì máa gbọ́” jẹ́ Yorùbá àdánidá tó pa agbára ìfojúsọ́nà náà mọ́.
- source_word: ἀκούειν
  choice: gbọ́ nípa
  rationale: Nínú àyíká yìí, gbígbọ́ ni nípa ìròyìn tàbí ìṣẹ̀lẹ̀, kì í ṣe pé etí ń gbọ́ ariwo ogun náà ní tààràtà.
- source_word: πολέμους
  choice: àwọn ogun
  rationale: πόλεμος sábà máa ń túmọ̀ sí ogun ní kíkún, kì í ṣe ìjà kan ṣoṣo.
- source_word: ἀκοὰς πολέμων
  choice: ìròyìn àwọn ogun
  rationale: ἀκοή lè túmọ̀ sí ìròyìn, ìgbọ́ròyìn, tàbí ohun tí ènìyàn gbọ́. “Ìròyìn àwọn ogun” kò fi dandan sọ pé ìròyìn náà jẹ́ irọ́.
- source_word: ὁρᾶτε
  choice: Ẹ rí i pé
  rationale: Àṣẹ náà ń mú ìkìlọ̀ wọlé, ó sì túmọ̀ sí pé kí àwọn olùgbọ́ rí dájú pé wọn kò ṣe ohun tí ó tẹ̀ lé e.
- source_word: μὴ θροεῖσθε
  choice: ẹ má ṣe fòyà
  rationale: θροέομαι ń tọ́ka sí jíjẹ́ kí ìṣẹ̀lẹ̀ dáni láàmú tàbí múni fòyà; gbolohun yìí jẹ́ kedere, ó sì bójú mu ní Yorùbá òde òní.
- source_word: δεῖ γὰρ γενέσθαι
  choice: nítorí ó ní láti ṣẹlẹ̀
  rationale: δεῖ sọ pé ohun náà pọndandan, γενέσθαι sì túmọ̀ sí “ṣẹlẹ̀.” A fi “ó” sílẹ̀ láì sọ ohun pàtó ju bí Gíríìkì ṣe sọ ọ́ lọ.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: ṣùgbọ́n òpin kò tíì dé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé òpin náà kò tíì wáyé, láì ṣàlàyé irú òpin náà síwájú sí i.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ nípa ohun ìkẹyìn nínú τὸ τέλος
  choice: òpin
  alternative: ìparí ohun gbogbo
  rationale: “Òpin” pa gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ẹsẹ̀ náà sínú ètò ẹ̀kọ́ kan pàtó nípa àwọn ìṣẹ̀lẹ̀ ìkẹyìn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àṣẹ ẹni púpọ̀ ni a lò. Èdè náà jẹ́ àdánidá fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A gbé àmì àlàyé [a] sí lẹ́yìn gbolohun tí ó ń ṣàlàyé, ìyẹn “ìròyìn àwọn ogun.”
