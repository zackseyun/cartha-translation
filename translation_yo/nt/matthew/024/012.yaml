source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: yo
  text: Àti nítorí pé àìlófin yóò pọ̀ sí i,[a] ìfẹ́ ọ̀pọ̀ ènìyàn[b] yóò di tútù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí bí àìlófin ṣe ń pọ̀ sí i.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìfẹ́ àwọn ènìyàn púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: nítorí tí ... yóò pọ̀ sí i
  rationale: διά pẹ̀lú infinitive tí ó ní article ń fi ìdí hàn. Ọ̀rọ̀ yìí pa agbára ìṣe πληθυνθῆναι mọ́, ó sì bá àyíká ọjọ́ iwájú mu; Yorùbá kò nílò kí a fi irú passive Gíríìkì náà hàn ní ọ̀nà líle.
- source_word: ἀνομίαν
  choice: ìwà àìlófin
  rationale: Ó túmọ̀ sí ṣíṣe láìka òfin sí tàbí rírú òfin, ní pàtàkì òfin Ọlọ́run. ‘Ìwà àìlófin’ ṣe kedere ju ọ̀rọ̀ gbogbogbò bí ‘ìwà búburú’ lọ.
- source_word: ψυγήσεται
  choice: yóò di tútù
  rationale: Èyí pa àkàwé ohun tí ń tutù mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún bí ìfẹ́ ṣe ń dín kù tàbí ń kú.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ìtumọ̀ Yorùbá tó ṣe déédé fún ἀγάπη, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: τῶν πολλῶν
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó pa bí ẹgbẹ́ náà kò ṣe ní ààlà pàtó mọ́, láìsọ ọ́ di ‘ọ̀pọ̀ jù lọ’ tàbí láìdín in kù sí ẹgbẹ́ àwọn onígbàgbọ́ nìkan.
theological_decisions:
- issue: Ààlà àwọn tí ‘ìfẹ́ ọ̀pọ̀ ènìyàn’ tọ́ka sí
  choice: ọ̀pọ̀ ènìyàn
  alternative: àwọn onígbàgbọ́ púpọ̀ / ìfẹ́ láàárín àwọn ènìyàn
  rationale: τῶν πολλῶν kò sọ ní pàtó bóyá àwọn ọmọ-ẹ̀yìn, gbogbo ènìyàn, tàbí ẹgbẹ́ adalu ni. A pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá bá èdè mu. Gbólóhùn náà pa àkàwé ‘di tútù’ àti àìdánilójú τῶν πολλῶν mọ́.
