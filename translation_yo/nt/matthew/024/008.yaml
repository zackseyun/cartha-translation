  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo nǹkan wọ̀nyí ni ìbẹ̀rẹ̀ ìrora ìbí ọmọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrora ìrọbí.” Ọ̀rọ̀ Gíríìkì náà ń lo ìrora tí obìnrin ń jẹ nígbà tí ó ń bímọ gẹ́gẹ́ bí àkàwé fún ìpele ìbẹ̀rẹ̀ ìpọ́njú tí ń bọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: gbogbo
  rationale: Pẹ̀lú ταῦτα, ó túmọ̀ sí ‘gbogbo nǹkan wọ̀nyí,’ ó sì tọ́ka sí gbogbo àwọn ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ náà fi ìyípadà kékeré tàbí ìtakora hàn láàárín àkọsílẹ̀ àwọn ìṣẹ̀lẹ̀ tó ṣáájú àti àlàyé Jésù nípa wọn.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó tọ́ka padà sí àwọn ìṣẹ̀lẹ̀ tí a mẹ́nu kàn ṣáájú; gbólóhùn yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀρχὴ
  choice: ìbẹ̀rẹ̀
  rationale: Ó fi hàn pé àwọn ìṣẹ̀lẹ̀ náà kì í ṣe òpin fúnra rẹ̀, bí kò ṣe ìpele àkọ́kọ́ ohun tí ń bọ̀.
- source_word: ὠδίνων
  choice: ìrora ìrọbí
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìrora tí obìnrin ń jẹ nígbà ìrọbí. ‘Ìrora ìrọbí’ pa àkàwé ibí ọmọ mọ́, ó sì ṣe kedere ní Yorùbá òde òní.
theological_decisions:
- issue: Agbára àkàwé ọ̀rọ̀ ὠδίνων
  choice: Pa àkàwé ibí ọmọ mọ́ gẹ́gẹ́ bí ‘ìrora ìrọbí.’
  alternative: Ìrora; ìpọ́njú; ìrora ibí ọmọ
  rationale: Ẹsẹ náà fi àwọn ìdàrúdàpọ̀ tó ṣáájú hàn gẹ́gẹ́ bí ìpele ìbẹ̀rẹ̀ ohun tó ń bọ̀, kì í ṣe òpin fúnra rẹ̀. Mímú àkàwé ìrọbí náà dúró ń pa ìfọ̀kànbalẹ̀ àti àìdánilójú nípa ohun ìkẹyìn mọ́ láìfi ètò ẹ̀kọ́ ìgbà ìkẹyìn kan pàtó kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ìrora ìrọbí’ láti mú àkàwé inú orísun Gíríìkì dúró; a lo ‘ni’ gẹ́gẹ́ bí àmì ìdánimọ̀ nínú gbólóhùn náà.
