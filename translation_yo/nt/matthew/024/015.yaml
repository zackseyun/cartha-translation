id: MAT.24.15
reference: Matthew 24:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: yo
  text: Nítorí náà, nígbà tí ẹ bá rí “ohun ìríra ìdahoro” tí a sọ nípasẹ̀ Dáníẹ́lì wòlíì, tí ó dúró ní ibi mímọ́ kan—kí ẹni tí ń kà á lóye—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ ní ọ̀nà ìbílẹ̀ pé, “ní ibi mímọ́ náà.”
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ pé, “ohun ìríra tí ń sọ ibi di ahoro” tàbí “ohun ìríra tí ó fa ìdahoro”; gbólóhùn náà ń ṣe ìrántí ọ̀rọ̀ inú Dáníẹ́lì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Nítorí náà, nígbà tí
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ οὖν mọ́ gẹ́gẹ́ bí àbájáde tàbí ìyípadà nínú àsọyé, ó sì fi ὅταν hàn gẹ́gẹ́ bí ohun tí a ń retí lọ́jọ́ iwájú.
- source_word: ἴδητε
  choice: ẹ bá rí
  rationale: Ìtumọ̀ tààrà ti ὁράω ni a lò, ìkọ̀ṣẹ́ ‘bá’ sì bá gbólóhùn àkókò ọjọ́ iwájú mu ní Yorùbá.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ohun ìríra ìsọdahoro
  rationale: Ó pa ìṣètò ọ̀rọ̀ Gíríìkì àti ìtọ́kasí rẹ̀ sí Dáníẹ́lì mọ́ láì pinnu bóyá ìsọdahoro náà jẹ́ àbájáde ohun ìríra náà tàbí ànímọ́ rẹ̀.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: tí a sọ nípasẹ̀ Dáníẹ́lì wòlíì
  rationale: ‘Nípasẹ̀’ fi ipa διά gẹ́gẹ́ bí ọ̀nà tàbí aṣojú ọ̀rọ̀ àsọtẹ́lẹ̀ hàn; ó sì yàgò fún fífi Dáníẹ́lì hàn bí orísun ìkẹyìn ọ̀rọ̀ náà.
- source_word: ἑστὸς
  choice: tí ó dúró
  rationale: Ó tú participle ἵστημι ní tààrà, láì ṣàfikún èrò pé ẹnì kan gbé ohun náà kalẹ̀.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: ní ibi mímọ́ kan
  rationale: ‘Kan’ fi àìní article nínú Gíríìkì hàn, láì fi dandan sọ pé ibi náà ni apá pàtó kan nínú tẹ́ńpìlì.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: kí ẹni tí ń kà á lóye
  rationale: Ó pa ìkìlọ̀ àárín gbólóhùn àti agbára àṣẹ νοείτω mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá τόπῳ ἁγίῳ tọ́ka sí ibi mímọ́ kan tàbí ibi mímọ́ pàtó kan
  choice: ní ibi mímọ́ kan
  alternative: ní ibi mímọ́ náà
  rationale: Gíríìkì kò ní article níwájú τόπῳ; nítorí náà, ọ̀rọ̀ pàtàkì kò fi tẹ́ńpìlì tàbí apá rẹ̀ kan pàtó múlẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká lè mú kí a lóye rẹ̀ bẹ́ẹ̀.
- issue: Ìbáṣepọ̀ genitive nínú βδέλυγμα τῆς ἐρημώσεως
  choice: ohun ìríra ìsọdahoro
  alternative: ohun ìríra tí ń sọ ibi di ahoro; ohun ìríra tí ó fa ìsọdahoro
  rationale: Ìtumọ̀ pàtàkì pa àìdánilójú àti ìró ọ̀rọ̀ inú Dáníẹ́lì mọ́, dípò kí ó pinnu irú ìbáṣepọ̀ tó wà láàárín ohun ìríra àti ìsọdahoro.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbọ́yé fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A fi gbólóhùn ìkìlọ̀ sí àárín àmì gígùn láti pa ìṣètò parenthetical orísun mọ́.
