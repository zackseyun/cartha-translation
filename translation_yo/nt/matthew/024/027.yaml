id: MAT.24.27
reference: Matthew 24:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí mànàmáná ṣe ń yọ láti ìlà-oòrùn tí ó sì ń hàn títí dé ìwọ̀-oòrùn, bẹ́ẹ̀ náà ni wíwá Ọmọ Ènìyàn[a] yóò rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wíwà” tàbí “dídé.” Ọ̀rọ̀ Gíríìkì παρουσία lè túmọ̀ sí “wíwà” tàbí “dídé,” ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí wíwá Ọmọ Ènìyàn ní ọjọ́ iwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: Ó pa ìtumọ̀ ìṣàlàyé γάρ àti ìfiwé ὥσπερ mọ́ ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: ἀστραπή
  choice: mànàmáná
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ìmọ́lẹ̀ ojú ọ̀run tí ń kọjá lójijì ni.
- source_word: ἐξέρχεται
  choice: ti ń já
  rationale: Nípa mànàmáná, ‘ń já’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, ó sì fi ìfarahàn rẹ̀ lójijì hàn.
- source_word: ἀπὸ ἀνατολῶν
  choice: láti ìlà-oòrùn
  rationale: Ó mú ìtọ́sọ́nà ìlà-oòrùn tí ó dojú kọ ìwọ̀-oòrùn jáde ní kedere.
- source_word: φαίνεται ἕως δυσμῶν
  choice: tí a sì ń rí i dé ìwọ̀-oòrùn
  rationale: Ó pa ìtumọ̀ pé a rí i àti bí ìríran náà ṣe dé òpin ìwọ̀-oòrùn mọ́.
- source_word: οὕτως ἔσται
  choice: bẹ́ẹ̀ ni ... yóò rí
  rationale: Ìtumọ̀ yìí pa ìfiwé àti agbára ọjọ́ iwájú mọ́ ní Yorùbá àdánidá.
- source_word: παρουσία
  choice: wíwá
  rationale: Nínú àyíká àsọtẹ́lẹ̀ yìí, ‘wíwá’ sọ ìṣẹ̀lẹ̀ ọjọ́ iwájú náà di mímọ́, láìfi ìtumọ̀ míì tí ọ̀rọ̀ Gíríìkì lè ní pamọ́.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ oyè náà tí a mọ̀ sí, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú Dáníẹ́lì 7.
theological_decisions:
- issue: Ìtumọ̀ παρουσία nínú ọ̀rọ̀ nípa ohun ọjọ́ iwájú
  choice: wíwá
  alternative: wíwà níbẹ̀; dídé
  rationale: Àfiwé mànàmáná tọ́ka sí ìfarahàn Ọmọ Ènìyàn ní gbangba tí kò ṣeé ṣàṣìṣe. ‘Wíwá’ sọ agbára ìṣẹ̀lẹ̀ ọjọ́ iwájú náà jáde láìgbé ètò ẹ̀kọ́ ìsìn kan lé e lórí; àmọ́ àlàyé ìsàlẹ̀ pa ìtumọ̀ míì tí παρουσία lè ní mọ́.
translation_notes:
  register: Yorùbá tó péye, tó níyì, tó sì rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
