- from: Ẹni tí ó bá wà lórí òrùlé[a] kò gbọdọ̀ sọ̀kalẹ̀ láti mú àwọn ohun tí ó wà nínú ilé rẹ̀.
  to: Ẹni tí ó wà lórí òrùlé[a] kò gbọdọ̀ sọ̀kalẹ̀ láti mú àwọn ohun inú ilé rẹ̀.
  rationale: A yọ “bá” kúrò láti pa ìtọ́kasí taara ti ọrọ̀-ìsorí Gíríìkì mọ́. A tún rọ́pò gbolohun ìbátan tó ṣàfikún ìtumọ̀ díẹ̀ pẹ̀lú “àwọn ohun inú ilé rẹ̀,” èyí tó jẹ́ àdánidá ní Yorùbá, tó sì fara mọ́ elliptical τὰ ἐκ τῆς οἰκίας αὐτοῦ. A pa ìkìlọ̀, ìṣípò ìsọ̀kalẹ̀, àti àlàyé àṣà nípa òrùlé pẹlẹbẹ mọ́.
  reviewer_model: gpt-5.6-terra
