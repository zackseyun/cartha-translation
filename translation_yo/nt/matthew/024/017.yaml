source:
  edition: SBLGNT
  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: yo
  text: Ẹni tí ó wà lórí òrùlé[a] kò gbọdọ̀ sọ̀kalẹ̀ láti mú àwọn ohun inú ilé rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, òkè ilé pẹlẹbẹ tí àwọn ènìyàn lè máa lò.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Ẹni tí ó bá wà lórí òrùlé
  rationale: Gbólóhùn náà ń tọ́ka sí ẹnikẹ́ni tó wà ní apá òkè ilé; “ẹni tí ó bá” jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni kan tí a fi ṣe àpẹẹrẹ, láì fi akọ tàbí abo kún ohun tí ọ̀rọ̀ náà fẹ́ sọ.
- source_word: δώματος
  choice: òrùlé
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí òkè ilé, ní pàtàkì òrùlé pẹlẹbẹ tí a lè lò ní àṣà ìgbà náà. “Òrùlé” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ, pẹ̀lú àlàyé àṣà nínú àlàyé ìsàlẹ̀.
- source_word: μὴ καταβάτω
  choice: kò gbọdọ̀ sọ̀kalẹ̀
  rationale: Èyí fi ìkìlọ̀ pàṣẹ tí ó lágbára hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣípò láti òkè sí ìsàlẹ̀ mọ́.
- source_word: ἆραι
  choice: láti mú
  rationale: Infinitive náà ń sọ ète sọ̀kalẹ̀; “láti mú” fi ète yẹn hàn ní ṣókí, láì fi ìtumọ̀ míì kún un.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: àwọn ohun tí ó wà nínú ilé rẹ̀
  rationale: Gbólóhùn Gíríìkì náà jẹ́ ọ̀nà àkótán fún àwọn ohun-ìní inú ilé. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, kò sì fi dandan túmọ̀ wọn sí gbogbo “ẹrù” tàbí “ohun-ìní” rẹ̀.
- source_word: οἰκίας
  choice: ilé
  rationale: “Ilé” pa ìtumọ̀ ilé gẹ́gẹ́ bí ibi tí a lè sọ̀kalẹ̀ wọ̀ mọ́, dípò fífi ìmọ̀lára ibùgbé tàbí ìdílé sí i.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Àrọ́pò-orúkọ Yorùbá “rẹ̀” jẹ́ àdánidá, kò sì ní àmì akọ tàbí abo; èyí kò yí ìtọ́kasí ẹni kan ṣoṣo nínú Gíríìkì padà.
theological_decisions:
- issue: Ìtọ́kasí akọ tí a fi ṣe àpẹẹrẹ
  choice: Lo “ẹni” àti “rẹ̀,” tí kò fi akọ tàbí abo hàn ní Yorùbá
  alternative: Fi “ọkùnrin” tàbí ọ̀rọ̀ akọ kan kún un
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àrọ́pò-orúkọ akọ ní gírámà, ìtọ́kasí náà jẹ́ ti ẹnikẹ́ni tí ipò yìí bá kan. Yorùbá kò fi akọ hàn nínú “ó/rẹ̀,” nítorí náà fífi ọ̀rọ̀ akọ kún un yóò túmọ̀ ju orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. “Kò gbọdọ̀” mú ìkìlọ̀ náà lágbára, nígbà tí ìtòlẹ́sẹẹsẹ gbólóhùn náà ṣì rọrùn fún òǹkàwé òde òní.
