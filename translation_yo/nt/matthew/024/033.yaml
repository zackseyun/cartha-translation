revisions:
- from: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, nígbà tí ẹ bá rí gbogbo nǹkan wọ̀nyí, ẹ mọ̀ pé ó sún mọ́lé, ó dé ẹnu àwọn ilẹ̀kùn.[a]
  to: Bákan náà, ẹ̀yin pẹ̀lú, nígbà tí ẹ bá rí gbogbo nǹkan wọ̀nyí, ẹ mọ̀ pé ó sún mọ́lé, ó wà ní etí àwọn ilẹ̀kùn.[a]
  rationale: The revision retains the source’s ambiguity concerning the subject of “is near,” its plural “doors,” and its emphatic comparison with the preceding illustration. It removes the added arrival sense in “ó dé” and uses a more natural Yoruba locative expression for being at the doors.
