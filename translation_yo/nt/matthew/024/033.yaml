review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparison, future temporal clause, plural “all these things,” and the unstated subject of ἐγγύς ἐστιν. However, “ó dé ẹnu àwọn ilẹ̀kùn” introduces an additional assertion (“it has arrived”) not present in the Greek and is not the most natural rendering of ἐπὶ θύραις.
  naturalness: “Bákan náà” and “ó wà ní etí àwọn ilẹ̀kùn” are more idiomatic modern Standard Yoruba in this context. The revision avoids the somewhat awkward repetition of two near-arrival expressions in the draft.
  terminology: The impersonal/potentially personal pronoun “ó” properly retains the Greek’s unspecified subject. The footnote continues to offer the personal alternative without deciding the referent.
  issues:
  - severity: medium
    issue: The phrase “ó dé ẹnu àwọn ilẹ̀kùn” adds the verb “dé” (“arrive/reach”).
    rationale: ἐπὶ θύραις is a locative expression, “at the doors,” qualifying “is near”; it does not explicitly say that the subject has arrived. “Ó wà ní etí àwọn ilẹ̀kùn” represents the location/image without this addition.
  - severity: low
    issue: “Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú” is understandable but less concise and natural than “Bákan náà, ẹ̀yin pẹ̀lú.”
    rationale: Both preserve οὕτως καὶ ὑμεῖς, but the revised wording is smoother in modern Standard Yoruba.
  revised_text: Bákan náà, ẹ̀yin pẹ̀lú, nígbà tí ẹ bá rí gbogbo nǹkan wọ̀nyí, ẹ mọ̀ pé ó sún mọ́lé, ó wà ní etí àwọn ilẹ̀kùn.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “òun ti sún mọ́lé.” Ọ̀rọ̀ Gíríìkì kò sọ kókó-ọ̀rọ̀ náà ní gbangba.
    reason: alternative_reading
  revision_rationale: The revision retains the source’s ambiguity concerning the subject of “is near,” its plural “doors,” and its emphatic comparison with the preceding illustration. It removes the added arrival sense in “ó dé” and uses a more natural Yoruba locative expression for being at the doors.
