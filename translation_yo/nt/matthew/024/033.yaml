id: MAT.24.33
reference: Matthew 24:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: yo
  text: Bákan náà, ẹ̀yin pẹ̀lú, nígbà tí ẹ bá rí gbogbo nǹkan wọ̀nyí, ẹ mọ̀ pé ó sún mọ́lé, ó wà ní etí àwọn ilẹ̀kùn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òun ti sún mọ́lé.” Ọ̀rọ̀ Gíríìkì kò sọ kókó-ọ̀rọ̀ náà ní gbangba.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú
  rationale: Ó pa ìfiwéra pẹ̀lú àpèjúwe igi ọ̀pọ̀tọ́ tó ṣáájú mọ́, ó sì tẹnu mọ́ àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí àwọn tó ń kíyè sí àmì náà.
- source_word: ὅταν ἴδητε
  choice: nígbà tí ẹ bá rí
  rationale: Àkópọ̀ ὅταν àti aorist subjunctive tọ́ka sí ohun ọjọ́ iwájú; ọ̀rọ̀ Yòrùbá yìí jẹ́ àdánidá, kò sì fi ìtumọ̀ ìṣẹ̀lẹ̀ tó ń ṣẹlẹ̀ léraléra kún un.
- source_word: πάντα ταῦτα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó ṣàfihàn ọ̀pọ̀ nọ́ńbà neuter náà ní tààrà láì túmọ̀ wọn ní àfikún gẹ́gẹ́ bí ‘àwọn ìṣẹ̀lẹ̀.’
- source_word: γινώσκετε
  choice: ẹ mọ̀
  rationale: Ó pa agbára àṣẹ inú ọ̀rọ̀ náà mọ́ ní ọ̀nà tí ó ṣe déédé fún Yòrùbá.
- source_word: ἐγγύς ἐστιν
  choice: ó sún mọ́lé
  rationale: Yorùbá lè lo arọ́pò-orúkọ ‘ó’ láì sọ ohun tí ó dúró fún ní pàtó; èyí pa àìsọ kókó-ọ̀rọ̀ inú Gíríìkì mọ́ dáadáa ju yíyan ‘òun’ tàbí fífi orúkọ ohun kan sí i lọ.
- source_word: ἐπὶ θύραις
  choice: ó dé ẹnu àwọn ilẹ̀kùn
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ θύραις mọ́, ó sì ṣàfihàn àwòrán ohun tí ó ti sún dé etílé gan-an.
theological_decisions:
- issue: Kókó-ọ̀rọ̀ tí a kò sọ ní ἐγγύς ἐστιν
  choice: Lo ‘ó sún mọ́lé’ láì sọ ẹni tàbí ohun tí ‘ó’ dúró fún ní pàtó.
  alternative: ‘Òun ti sún mọ́lé’ tàbí ‘ó ti sún mọ́lé’ pẹ̀lú àlàyé pé Ọmọ Ènìyàn ni.
  rationale: Gíríìkì kò sọ kókó-ọ̀rọ̀ náà ní gbangba. ‘Ó’ lè tọ́ka sí ẹni tàbí ohun kan ní Yòrùbá, nítorí náà ó jẹ́ kí àìdánilójú bóyá Ọmọ Ènìyàn, ìṣẹ̀lẹ̀ tó ń bọ̀, tàbí òpin náà ni a ń sọ̀rọ̀ nípa rẹ̀ dúró.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. ‘Ẹ̀yin’ àti ‘ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀; ‘ó dé ẹnu àwọn ilẹ̀kùn’ pa àwòrán àti nọ́ńbà ọ̀pọ̀ inú Gíríìkì mọ́.
