  source_fidelity: 'Ìtumọ̀ náà ń gbé ìdáhùn Jesu, ìbéèrè àsọjáde rẹ̀, àti àsọtẹ́lẹ̀ ìparun pátápátá kalẹ̀ dáadáa. Síbẹ̀, ìparí náà, “láì wó o lulẹ̀,” ní arọ́pò-orúkọ tí kò ní ìtọ́kasí kedere, ó sì lè dà bí ẹni pé òkúta kan nìkan ni a ń wó. Àtúnṣe náà sọ ìtumọ̀ ìkọ̀ emphatic Gíríìkì náà di kedere: kò sí òkúta kankan tí yóò ṣẹ́kù lórí òkúta mìíràn, nítorí gbogbo wọn ni a ó wó lulẹ̀.'
