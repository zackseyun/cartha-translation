id: MAT.24.2
reference: Matthew 24:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Ṣé ẹ̀yin kò rí gbogbo nǹkan wọ̀nyí? Lóòótọ́ ni mo wí fún yín, kò sí òkúta kan tí a ó fi sílẹ̀ níhìn-ín lórí òkúta mìíràn; gbogbo wọn ni a ó wó lulẹ̀.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pa run.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí títú ilé ká tàbí wíwó ilé lulẹ̀; “wó lulẹ̀” pa àwòrán àwọn òkúta tí a yọ kúrò ní ipò wọn mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dá wọn lóhùn pé
  rationale: Ìtumọ̀ yìí fi èrò ìdáhùn hàn ní Yorùbá àdánidá; fífi ọ̀rọ̀ méjèèjì ṣe ní tààràtà yóò le gan-an.
- source_word: Οὐ βλέπετε
  choice: Ṣé ẹ̀yin kò rí
  rationale: Ó pa ìbéèrè àsọjáde tí ó ń retí ìfẹ̀sì mú, ó sì bójú mu fún rírí ní ojú àti mímọ ohun tí ó wà níwájú wọn.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó ṣàfihàn nọ́ńbà ọ̀pọ̀ àti ìtọ́kasí sí àwọn ilé tẹ́ńpìlì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Ó mú agbára ọ̀rọ̀ ìfìdí múlẹ̀ Jesu jáde ní èdè Yorùbá ọlọ́wọ̀ àti tí ó ṣe kedere.
- source_word: οὐ μὴ ἀφεθῇ
  choice: a kì yóò fi ... sílẹ̀
  rationale: Àkópọ̀ kì yóò fi àti láì wó o lulẹ̀ ń fi ìkọ̀ emphatic Gíríìkì hàn ní ọ̀nà Yorùbá àdánidá.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ọ̀rọ̀ ibi yìí tọ́ka sí àgbègbè tẹ́ńpìlì tí wọ́n wà níbẹ̀.
- source_word: λίθος ἐπὶ λίθον
  choice: òkúta kan ... lórí òkúta mìíràn
  rationale: Ó tú àkànlò Gíríìkì náà sí Yorùbá kedere, ó sì tẹnu mọ́ bí ìwópalẹ̀ náà yóò ṣe pé pérépéré.
- source_word: καταλυθήσεται
  choice: láì wó o lulẹ̀
  rationale: Wó ... lulẹ̀ bá ìwó ilé mu, ó sì pa àwòrán gidi ti yíyọ àwọn òkúta kúrò ní ipò wọn mọ́.
theological_decisions:
- issue: Ìwọ̀n àti agbára àsọtẹ́lẹ̀ Jesu nípa tẹ́ńpìlì
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àsọtẹ́lẹ̀ gidi nípa píparun ilé tẹ́ńpìlì pátápátá.
  alternative: Kí a ka a ní pàtàkì gẹ́gẹ́ bí àmì ìdájọ́ tàbí kí a so ó mọ́ ètò ẹ̀kọ́ ìgbà ìkẹyìn kan pàtó.
  rationale: Ọ̀rọ̀ nípa òkúta tí a kò ní fi sílẹ̀ lórí òkúta mìíràn jẹ́ ọ̀rọ̀ ilé gidi. Ìtumọ̀ náà kò fi ètò ẹ̀kọ́ ẹ̀sìn tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Ṣé ẹ̀yin kò rí” jẹ́ ìbéèrè àsọjáde àdánidá; “Lóòótọ́ ni mo wí fún yín” pa ìfìdí-múlẹ̀ ἀμήν mọ́.
