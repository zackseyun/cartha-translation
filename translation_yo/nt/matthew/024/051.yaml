id: MAT.24.51
reference: Matthew 24:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: yo
  text: yóò sì gé e sí méjì[a], yóò sì fún un ní ìpín pẹ̀lú àwọn àgàbàgebè[b]. Ibẹ̀ ni ẹkún àti ìpayínkeke yóò wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà àlàyé: “yóò fìyà jẹ ẹ́ gidigidi.” Ní tààràtà, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “gé sí méjì.”'
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ìpín tirẹ̀” tàbí “ìpín rẹ̀ pẹ̀lú àwọn àgàbàgebè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: yóò gé e sí méjì
  rationale: Èyí pa ìtumọ̀ gidi ti ọ̀rọ̀ Gíríìkì mọ́—‘gé sí méjì’—dípò yíyí i padà sí àlàyé gbogbogbò bí ‘yóò fìyà jẹ ẹ́ gidigidi.’
- source_word: μέρος
  choice: ìpín
  rationale: ‘Ìpín’ bá ìtumọ̀ ‘portion/share’ mu, ó sì pa àìdánilójú ọ̀rọ̀ náà mọ́ láì sọ ọ́ di ibi kan pàtó nìkan.
- source_word: ὑποκριτῶν
  choice: àwọn alágàbàgebè
  rationale: Ọ̀rọ̀ Yorùbá yìí túmọ̀ sí àwọn tí ìrísí òde wọn kò bá ohun tí wọ́n jẹ́ ní tòótọ́ mu, ó sì bá agbára ọ̀rọ̀ náà nínú Mátíù mu.
- source_word: ἐκεῖ
  choice: Ibẹ̀
  rationale: Ó tọ́ka sí ipò ìdájọ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: κλαυθμός
  choice: ẹkún
  rationale: ‘Ẹkún’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún gbólóhùn ìdájọ́ tí Mátíù máa ń lò.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ìpayínkeke
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí a mọ̀ dáadáa fún fífi ìpayín hàn, ó sì pa àwòrán líle inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá kí a rọ ìtumọ̀ διχοτομήσει sí gbólóhùn kan nípa ìjìyà líle
  choice: 'Pa ọ̀rọ̀ gidi náà mọ́: ‘yóò gé e sí méjì’'
  alternative: ‘yóò fìyà jẹ ẹ́ gidigidi’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní àwòrán gidi yìí; mímú un wá sínú ẹsẹ náà pa agbára ìkìlọ̀ mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kan lé e lórí.
- issue: Bí a ṣe máa sọ τὸ μέρος αὐτοῦ ... θήσει
  choice: ‘yóò yan ìpín rẹ̀ pẹ̀lú àwọn alágàbàgebè’
  alternative: ‘yóò fi í sí àárín àwọn alágàbàgebè’ tàbí ‘yóò yan ipò rẹ̀ láàárín wọn’
  rationale: ‘Ìpín’ pa èrò ohun tí a yàn fún ẹni mọ́, láìpinnu bóyá ogún, àyànmọ́, tàbí ibi ni ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà tẹ̀ lé ìṣísẹ̀ ọ̀rọ̀ Gíríìkì, ó sì pa àwòrán ìdájọ́ líle àti àìdánilójú ‘ìpín’ mọ́.
