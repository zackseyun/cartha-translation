id: MAT.24.44
reference: Matthew 24:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin náà, ẹ múra sílẹ̀, nítorí Ọmọ Ènìyàn ń bọ̀ ní wákàtí tí ẹ kò retí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní wákàtí tí ẹ kò rò pé yóò dé.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “rò” tàbí “gbọ́kàn lé”; ní àyíká ọ̀rọ̀ yìí, ó tún lè túmọ̀ sí “retí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó tọ́ka padà sí ìkìlọ̀ tó ṣáájú, ó sì fi àbájáde rẹ̀ hàn lọ́nà àdánidá nínú Yorùbá.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní gbangba pẹ̀lú καί tẹnu mọ́ pé àwọn olùgbọ́ náà wà lára àwọn tí ìkìlọ̀ náà kàn.
- source_word: γίνεσθε ἕτοιμοι
  choice: ẹ múra sílẹ̀
  rationale: Àṣẹ yìí ń pe àwọn olùgbọ́ láti wà ní ipò ìmúrasílẹ̀. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára àṣẹ náà mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: ὅτι
  choice: nítorí
  rationale: Níhìn-ín, ὅτι ń ṣàlàyé ìdí tí wọ́n fi gbọ́dọ̀ múra sílẹ̀.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: ní wákàtí tí ẹ kò retí
  rationale: Èyí mú ìtumọ̀ àkókò inú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá tó ṣe kedere. δοκεῖτε lè túmọ̀ sí ‘rò’ tàbí ‘lérò,’ ṣùgbọ́n ‘retí’ bá ọ̀rọ̀ ìkìlọ̀ nípa àkókò àìmọ̀ mu jù; àṣàyàn gidi kejì wà nínú àlàyé ìsàlẹ̀.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ tààrà àti orúkọ oyè tí a mọ̀ sí rere nínú Bíbélì Yorùbá; ó pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìfarahàn sí Dáníẹ́lì mọ́.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Ìṣe àsìkò ìsinsìnyí náà ń fi ìṣẹ̀lẹ̀ ọjọ́ iwájú hàn bí ohun tó dájú, tó sì ń sún mọ́lé; ‘ń bọ̀’ pa ìwà yìí mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ orúkọ oyè Kristi ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni tí ó jẹ́ ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa ìrísí orúkọ oyè náà, ìfarahàn rẹ̀ sí Dáníẹ́lì, àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́. Àṣàyàn kejì jẹ́ àlàyé tí ó lè mú ìtumọ̀ náà dín kù.
translation_notes:
  register: A lo Yorùbá àdánidá, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa àṣẹ, ìkìlọ̀, àti àìmọ̀ àkókò ìpadàbọ̀ náà mọ́.
