revisions:
- from: Nítorí ọ̀pọ̀ ènìyàn yóò wá ní orúkọ mi, wọn yóò máa sọ pé, ‘Èmi ni Mèsáyà náà,’[a] wọn yóò sì ṣi ọ̀pọ̀ ènìyàn lọ́nà.
  to: Nítorí ọ̀pọ̀ ènìyàn yóò wá ní orúkọ mi, nígbà tí wọ́n ń sọ pé, ‘Èmi ni Mèsáyà náà,’[a] wọ́n yóò sì mú ọ̀pọ̀ ènìyàn ṣìnà.
  rationale: A tún ọ̀rọ̀ participle náà ṣe sí “nígbà tí wọ́n ń sọ” fún ìṣàn Yorùbá tó dára, a sì lo “mú ... ṣìnà” fún ìtumọ̀ kedere ti πλανάω. A ṣàtúnṣe àlàyé àkọsílẹ̀ ìsàlẹ̀ kí ó lè ṣàfihàn ìtumọ̀ χριστός ní òtítọ́. “Mèsáyà náà” ni a fi sílẹ̀ gẹ́gẹ́ bí oyè tí a ń sọ pé àwọn ẹlẹ́tàn náà ń jọ̀wọ́ ara wọn sí.
