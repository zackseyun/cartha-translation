id: MAT.24.5
reference: Matthew 24:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ènìyàn yóò wá ní orúkọ mi, nígbà tí wọ́n ń sọ pé, ‘Èmi ni Mèsáyà náà,’[a] wọ́n yóò sì mú ọ̀pọ̀ ènìyàn ṣìnà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi ni Kristi náà.” Ọ̀rọ̀ Gíríìkì náà ni ὁ χριστός, ìyẹn ẹni tí a ti fi òróró yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó túmọ̀ sí ‘ọ̀pọ̀’; fífi ‘ènìyàn’ kún un mú kí gbolohun náà ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára àlàyé tí γὰρ ní mọ́, nípa so ẹsẹ yìí mọ́ ìkìlọ̀ tó ṣáájú.
- source_word: ἐλεύσονται
  choice: yóò wá
  rationale: Èyí ni ìtumọ̀ ọjọ́ iwájú tó ṣe déédé fún ἔρχομαι nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: ní orúkọ mi
  rationale: 'Ọ̀rọ̀ Yorùbá yìí pa àìdánilójú gidi náà mọ́: ó lè tọ́ka sí lílo orúkọ Jesu tàbí sí fífi ara ẹni hàn bí ẹni tó ní àṣẹ tàbí ìdánimọ̀ rẹ̀.'
- source_word: λέγοντες
  choice: wọn yóò máa sọ pé
  rationale: Ó mú iṣẹ́ participle náà jáde lọ́nà Yorùbá àdánidá láì fi ìtumọ̀ ‘wọn yóò máa kéde’ tàbí ‘wọn yóò máa pe ara wọn’ kún un.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Èmi ni Mèsáyà náà
  rationale: ‘Èmi’ pa ìtẹnumọ́ ἐγώ mọ́; ‘Mèsáyà’ sì fi χριστός hàn gẹ́gẹ́ bí oyè ẹni àmì òróró tí a retí, kì í ṣe bí orúkọ lasan.
- source_word: πλανήσουσιν
  choice: yóò sì ṣi ... lọ́nà
  rationale: Àṣàyàn yìí pa àwòrán pípa ènìyàn kúrò ní ọ̀nà tó tọ́ mọ́, ó sì tún ní agbára ìtanilẹ́jẹ tí πλανάω ní.
- source_word: πολλοὺς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó ṣe kedere pé àwọn ènìyàn ni object ọ̀rọ̀-ìṣe náà, ó sì jẹ́ Yorùbá tó rọrùn láti lóye.
theological_decisions:
- issue: Bí a ṣe túmọ̀ χριστός nínú ọ̀rọ̀ àwọn olùjẹ́wọ́ èké
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, χριστός jẹ́ oyè ẹni àmì òróró tí a ń retí; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn kedere ju lílo ‘Kristi’ bí ẹni pé ó jẹ́ orúkọ lọ. Àkọsílẹ̀ ìsàlẹ̀ fi àṣàyàn ìtumọ̀ kejì hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘wọn yóò máa sọ’ láti yàgò fún àkójọpọ̀ participle tí kò ṣe àdánidá ní Yorùbá, a sì fi àmì ohùn sí ibi tí ó yẹ.
