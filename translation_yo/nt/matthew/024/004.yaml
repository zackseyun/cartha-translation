  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: yo
  text: Jésù sì dá wọn lóhùn pé, “Ẹ ṣọ́ra kí ẹnikẹ́ni má bàa mú yín ṣìnà.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “tan yín jẹ.”'
    reason: 'Àṣàyàn ìtumọ̀ ọ̀rọ̀: πλανάω tún lè tẹnumọ́ ẹ̀tàn ní tààràtà.'
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: dá wọn lóhùn pé
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà ìtàn tí ó túmọ̀ sí pé Jésù fèsì, ó sì bẹ̀rẹ̀ sí sọ̀rọ̀. ‘Dá wọn lóhùn pé’ jẹ́ Yorùbá àdánidá tí kò tún ìtumọ̀ kan náà sọ lẹ́ẹ̀mejì.
- source_word: Βλέπετε
  choice: Ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn yìí níbí túmọ̀ sí kí àwọn olùgbọ́ wà lójúfò kí wọn sì ṣọ́ra. ‘Ẹ ṣọ́ra’ sọ ìkìlọ̀ náà ní Yorùbá òde òní tí ó ṣe kedere.
- source_word: μή τις
  choice: kí ẹnikẹ́ni má bàa
  rationale: Àkójọpọ̀ μή pẹ̀lú ọ̀rọ̀-ìṣe subjunctive lẹ́yìn àṣẹ fi ìdènà hàn. Ìṣọ̀kan ‘kí … má bàa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ohun tí a kìlọ̀ nípa rẹ̀ má ṣẹlẹ̀.
- source_word: πλανήσῃ
  choice: mú yín ṣìnà
  rationale: πλανάω lè túmọ̀ sí mímú ènìyàn kúrò ní ọ̀nà tó tọ́, ṣi ènìyàn lọ́nà, tàbí tan ènìyàn jẹ. ‘Mú yín ṣìnà’ pa àwòrán jíjáde kúrò ní ọ̀nà mọ́, ó sì gba ìtumọ̀ ẹ̀tàn àti ìdarí tí kò tọ́ láyè.
theological_decisions:
- issue: Ìrú ìkìlọ̀ tí πλανήσῃ ń sọ
  choice: Ìkìlọ̀ gbogbogbò pé kí a má ṣe mú wọn ṣìnà
  alternative: Ìkìlọ̀ tó dín kù sí títan wọn jẹ nìkan
  rationale: Ní àyíká ọ̀rọ̀ náà, ewu náà lè ní ẹ̀tàn inú àti fífi ènìyàn sí ọ̀nà tí kò tọ́ nínú. ‘Mú yín ṣìnà’ pa ìwọ̀nyí méjèèjì mọ́ láì fi ìtumọ̀ náà mọ́ ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá Àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘Ẹ … yín’ bá àwọn ọmọ-ẹ̀yìn tí Jésù ń bá sọ̀rọ̀ mu.
