  to: Ṣùgbọ́n ní ti ọjọ́ àti wákàtí náà, kò sí ẹni tí ó mọ̀—àní àwọn áńgẹ́lì ọ̀run, bẹ́ẹ̀ ni Ọmọ náà—bí kò ṣe Baba nìkan.[a]
  rationale: A yọ ‘kò mọ̀’ kúrò lẹ́yìn ‘àwọn áńgẹ́lì ọ̀run’ kí ‘kò sí ẹni tí ó mọ̀’ lè ṣe akoso àwọn áńgẹ́lì àti Ọmọ náà papọ̀. Èyí fara mọ́ ìṣètò Gíríìkì náà, ó sì mú ìtumọ̀ ‘nor the Son’ hàn ní kedere, láì ṣàlàyé tàbí dín ìfẹ̀ẹ́ ìtumọ̀ Kristi kù. A tún àkọsílẹ̀ ìsàlẹ̀ ṣe kí ọ̀rọ̀ tí ó mẹ́nuba bá ti inú ọ̀rọ̀ pàtàkì mu.
