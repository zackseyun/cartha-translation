id: MAT.24.36
reference: Matthew 24:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti ọjọ́ àti wákàtí náà, kò sí ẹni tí ó mọ̀—àní àwọn áńgẹ́lì ọ̀run, bẹ́ẹ̀ ni Ọmọ náà—bí kò ṣe Baba nìkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kò ní ‘bẹ́ẹ̀ ni Ọmọ náà.’ Ọ̀rọ̀ pàtàkì tẹ̀lé bí SBLGNT ṣe kà á.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ṣùgbọ́n ní ti
  rationale: ‘Ní ti’ fi kókó ọ̀rọ̀ tuntun hàn fún περί pẹ̀lú ẹ̀yà olùní, ‘ṣùgbọ́n’ sì pa ìyípadà tàbí ìtakora díẹ̀ tí δέ ní mọ́.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ọjọ́ àti wákàtí náà
  rationale: Ó tọ́ka sí àkókò pàtó gẹ́gẹ́ bí gbólóhùn Gíríìkì náà, láì tún ‘náà’ sọ lọ́nà tí kò ṣe pàtàkì ní Yorùbá.
- source_word: οὐδεὶς οἶδεν
  choice: kò sí ẹni tí ó mọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìkọ̀sílẹ̀ gbogbo ènìyàn tí οὐδείς ní mọ́.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: àní àwọn áńgẹ́lì ọ̀run kò mọ̀
  rationale: ‘Àní’ mú ìtẹnumọ́ οὐδέ jáde, ‘àwọn áńgẹ́lì ọ̀run’ sì jẹ́ ìtumọ̀ adayébá fún οἱ ἄγγελοι τῶν οὐρανῶν.
- source_word: οὐδὲ ὁ υἱός
  choice: bẹ́ẹ̀ ni Ọmọ náà
  rationale: Ó tẹ̀ síwájú nínú àtòjọ àwọn tí kò mọ̀, ó sì pa ‘Ọmọ’ mọ́ gẹ́gẹ́ bí oyè tí a mọ̀ dáadáa, láì rọ ìtumọ̀ rẹ̀.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Nínú gbólóhùn ìkọ̀sílẹ̀ yìí, ó túmọ̀ sí ‘except,’ kì í ṣe ọ̀rọ̀ àídájú ‘unless.’
- source_word: ὁ πατὴρ μόνος
  choice: Baba nìkan
  rationale: ‘Nìkan’ fi hàn pé Baba nikan ṣoṣo ni ó mọ̀, ‘Baba’ sì dúró gẹ́gẹ́ bí oyè Ọlọ́run.
theological_decisions:
- issue: Ìtumọ̀ nípa Kristi nínú ‘οὐδὲ ὁ υἱός’
  choice: Fi ‘bẹ́ẹ̀ ni Ọmọ náà’ sí ọ̀rọ̀ pàtàkì láì dín un kù tàbí ṣàlàyé rẹ̀ sí i.
  alternative: Kí a yọ ọ́ kúrò nítorí ìyàtọ̀ inú àwọn àfọwọ́kọ kan, tàbí kí a sọ ọ́ lọ́nà míì láti dín ìṣòro ẹ̀kọ́ ìgbàgbọ́ kù.
  rationale: SBLGNT ní gbólóhùn náà. Ìtumọ̀ gbọdọ̀ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà dá sílẹ̀ mọ́, kì í ṣe láti yanjú rẹ̀ nípasẹ̀ àlàyé tàbí ìyọkúrò.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ adayébá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘wákàtí’ láti pa ìpín àkókò pàtó ti ὥρα mọ́, a sì lo àwọn àmì gígùn láti jẹ́ kí àtòjọ àwọn tí kò mọ̀ ṣe kedere.
