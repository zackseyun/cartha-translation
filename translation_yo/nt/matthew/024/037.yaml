  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí àwọn ọjọ́ Nóà ti rí, bẹ́ẹ̀ náà ni wíwá[a] Ọmọ Ènìyàn yóò ṣe rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “wíwà”: ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “wíwà” tàbí “dídé,” ṣùgbọ́n níbí ó ń tọ́ka sí wíwá Ọmọ Ènìyàn ní ọjọ́ iwájú.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: gẹ́gẹ́ bí ... bẹ́ẹ̀ náà ni
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ìfiwéra tó lágbára hàn ní Yorùbá, ó sì pa ìṣọ̀kan ‘gẹ́gẹ́ bí ... bẹ́ẹ̀’ inú Gíríìkì mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé ẹsẹ yìí mọ́ pẹ̀lú ohun tí a sọ ṣáájú.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: ọjọ́ Nóà ti rí
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe apá àkọ́kọ́ sílẹ̀ láìsọ; ‘ti rí’ ni àfikún díẹ̀ tó yẹ ní Yorùbá láti mú ìfiwéra náà péye láìtúmọ̀ rẹ̀ ju bó ṣe wà lọ.
- source_word: Νῶε
  choice: Nóà
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
- source_word: ἔσται
  choice: yóò rí
  rationale: Nínú àgbékalẹ̀ ‘gẹ́gẹ́ bí ... ti rí, bẹ́ẹ̀ ... yóò rí,’ èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ bí ohun kan yóò ṣe rí.
- source_word: παρουσία
  choice: wíwá
  rationale: Nínú ọ̀rọ̀ àsọtẹ́lẹ̀ ọjọ́ iwájú yìí, ‘wíwá’ sọ ìdé tàbí dídé Ọmọ Ènìyàn ní èdè Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ míì, ‘wíwà,’ mọ́.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa oyè tí Jésù máa ń lò fún ara rẹ̀ àti ìsopọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ παρουσία nínú ọ̀rọ̀ nípa ohun tí yóò ṣẹlẹ̀ ní ọjọ́ iwájú
  choice: wíwá
  alternative: wíwà (níbẹ̀)
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí dídé Ọmọ Ènìyàn ní ọjọ́ iwájú, nítorí náà ‘wíwá’ jẹ́ ọ̀rọ̀ Yorùbá tó bá iṣẹlẹ̀ mu jù. Síbẹ̀, a kò fi ìtumọ̀ ‘wíwà’ pamọ́; a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, tó lọ́lá ṣùgbọ́n tó ṣeé lóye. Àgbékalẹ̀ ‘gẹ́gẹ́ bí ... bẹ́ẹ̀ náà ni’ jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìfiwéra Gíríìkì mọ́.
