  source_fidelity: Ìtumọ̀ náà pa ìsopọ̀ àlàyé γάρ mọ́, ó sì fi ìfiwéra ὥσπερ ... οὕτως hàn dáadáa. ‘Wíwá’ jẹ́ ìtumọ̀ tó yẹ fún παρουσία nínú àyíká ọjọ́ iwájú yìí, ‘Ọmọ Ènìyàn’ sì pa oyè náà mọ́. Àmọ́, fífi ‘àwọn’ kún ‘ọjọ́’ mú púpọ̀ αἱ ἡμέραι hàn kedere, àti ‘yóò ṣe rí’ ni ó pe ìfiwéra Yorùbá náà dáadáa.
