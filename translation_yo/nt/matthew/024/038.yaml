id: MAT.24.38
reference: Matthew 24:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: yo
  text: Nítorí, gẹ́gẹ́ bí ó ṣe jẹ́ ní àwọn ọjọ́ ṣáájú ìkún omi, wọ́n ń jẹ, wọ́n sì ń mu, wọ́n ń gbéyàwó, wọ́n sì ń fi àwọn ènìyàn fúnni ní ìgbéyàwó,[a] títí di ọjọ́ tí Nóà wọ inú ọkọ̀ náà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń gbéyàwó, a sì ń fi wọ́n fúnni ní ìgbéyàwó.” Ọ̀rọ̀ Gíríìkì kejì lè túmọ̀ sí fífi ẹlòmíràn fúnni ní ìgbéyàwó tàbí sí jíjẹ́ ẹni tí a fi fúnni ní ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: Ó pa agbára ìṣàlàyé γάρ àti ìfiwéra ὡς mọ́ ní Yorùbá àdánidá.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: wọ́n ń jẹ, wọ́n sì ń mu
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ hàn, bí ìṣọ̀kan ọ̀rọ̀-ìṣe aláìpé àti àwọn participle Gíríìkì ṣe túmọ̀ sí.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: ní àwọn ọjọ́ ṣáájú ìkún omi
  rationale: Ó jẹ́ gbólóhùn àkókò tí ó ṣe kedere, ‘ìkún omi’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó bá ìṣẹ̀lẹ̀ Nóà mu.
- source_word: γαμοῦντες
  choice: wọ́n ń gbéyàwó
  rationale: Ó túmọ̀ γαμέω sí ìwọlé sínú ìgbéyàwó, láìfi ẹ̀ṣẹ̀ tàbí àṣejù kún un.
- source_word: γαμίζοντες
  choice: wọ́n sì ń fi ènìyàn fúnni ní ìgbéyàwó
  rationale: Ó pa ìyàtọ̀ ọ̀rọ̀ mọ́ láàárín γαμοῦντες àti γαμίζοντες, ó sì yàgò fún fífi akọ tàbí abo tí Gíríìkì kò sọ kún un.
- source_word: ἄχρι ἧς ἡμέρας
  choice: títí di ọjọ́ tí
  rationale: Ó fi òpin àwọn ìṣe tí ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Nóà wọ inú ọkọ̀ ńlá náà
  rationale: ‘Wọ inú’ ṣàfihàn ìwọlé náà ní kedere; ‘ọkọ̀ ńlá náà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣeé lóye fún κιβωτός nínú ìtàn Nóà.
theological_decisions:
- issue: Bóyá kí a fi àwọn ìṣe náà hàn bí àṣejù ẹlẹ́ṣẹ̀ tàbí bí ìgbésí ayé ojoojúmọ́ tí ń bá a lọ láìmọ̀ nípa ìdájọ́
  choice: A túmọ̀ wọn ní ọ̀nà àìṣègbè gẹ́gẹ́ bí àwọn ìṣe ènìyàn ojoojúmọ́.
  alternative: Láti lo ọ̀rọ̀ tí yóò dá àṣejù tàbí àìbìkítà ẹ̀ṣẹ̀ lẹ́bi.
  rationale: Àwọn participle Gíríìkì kò ní àfikún ọ̀rọ̀ ìdájọ́ ìwà; àyíká fi ìgbésí ayé àrà-ọ̀tọ̀ tí ó ń lọ ṣáájú ìdájọ́ òjijì hàn.
translation_notes:
  register: Yorùbá ìgbàlódé, oníyì, tí ó ṣeé lóye fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. A yan ‘ọkọ̀ ńlá náà’ dípò gbígbé ọ̀rọ̀ Gẹ̀ẹ́sì ‘áàkì’ wọlé, kí ìtumọ̀ lè ṣe kedere ní Yorùbá, nígbà tí àyíká Nóà ń dá ohun tí ọkọ̀ náà jẹ́ mọ̀.
