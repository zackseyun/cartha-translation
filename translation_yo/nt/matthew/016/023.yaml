id: MAT.16.23
reference: Matthew 16:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: yo
  text: Ṣùgbọ́n ó yí padà, ó sì sọ fún Peteru pé, “Lọ sí ẹ̀yìn mi, Satani![a] O jẹ́ ohun ìkọ̀sẹ̀ fún mi, nítorí pé o kì í fi ọkàn rẹ sí àwọn ohun ti Ọlọ́run, ṣùgbọ́n sí àwọn ohun ti ènìyàn.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà ìbílẹ̀: “Lọ sẹ́yìn mi, Satani!”'
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ohun ti ènìyàn” túmọ̀ sí àwọn àníyàn tàbí èrò ti ẹ̀dá ènìyàn lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: ó yí padà
  rationale: Ọ̀rọ̀ yìí fi ìyípadà ara Jésù hàn nípa ti ara, ó sì jẹ́ ọ̀nà àdánidá láti sọ participle aorist tí ó ní ìtumọ̀ intransitive ní Yorùbá.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Lọ sí ẹ̀yìn mi
  rationale: Ó pa ìtumọ̀ àyè ti ὀπίσω mọ́, ó sì tẹ̀ lé agbára àṣẹ Ὕπαγε láì sọ ọ́ di ‘kúrò lọ́dọ̀ mi’ nìkan.
- source_word: Σατανᾶ
  choice: Satani
  rationale: A pa orúkọ tàbí oyè náà mọ́ gẹ́gẹ́ bí ìkìlọ̀ líle, láì pinnu bóyá Jésù ń pe Peteru ní Satani tàbí pé ó ń bá ipa Satani nínú ọ̀rọ̀ Peteru wí.
- source_word: σκάνδαλον
  choice: ohun ìkọ̀sẹ̀
  rationale: Èyí pa àwòrán ohun tí ń múni kọsẹ̀ mọ́, ó sì bá ọ̀rọ̀ Peteru tí ń gbìyànjú láti dá Jésù dúró mu.
- source_word: ἐμοῦ
  choice: fún mi
  rationale: Pẹ̀lú σκάνδαλον, gbólóhùn yìí fi ẹni tí ìdènà náà kan hàn ní Yorùbá àdánidá.
- source_word: φρονεῖς
  choice: o fi ọkàn sí
  rationale: Ó túmọ̀ sí ìtọ́sọ́nà èrò àti ohun tí ẹni kan kà sí pàtàkì, kì í ṣe èrò tí ó ṣẹ̀ṣẹ̀ kọjá lọ́kàn.
- source_word: τὰ τοῦ θεοῦ
  choice: àwọn ohun ti Ọlọ́run
  rationale: Ìtumọ̀ yìí dúró sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa ìyàtọ̀ rẹ̀ pẹ̀lú àwọn ohun ti ènìyàn mọ́.
- source_word: τὰ τῶν ἀνθρώπων
  choice: àwọn ohun ti ènìyàn
  rationale: ‘Ènìyàn’ jẹ́ ọ̀rọ̀ aṣojú fún aráyé lápapọ̀ ní Yorùbá, ó sì pa ìtakora láàárín ohun ti Ọlọ́run àti ohun ti ẹ̀dá ènìyàn mọ́ láì dín ìtumọ̀ rẹ̀ kù.
theological_decisions:
- issue: Agbára tí pípe Peteru ní ‘Satani’ ní
  choice: A fi ‘Satani’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ tí Jésù fi bá Peteru wí ní tààràtà.
  alternative: ‘Ọ̀tá’ tàbí ṣíṣe kedere pé Satani ń ṣiṣẹ́ nípasẹ̀ Peteru.
  rationale: Ọ̀rọ̀ Gíríìkì kò yanju bóyá Jésù ń dá Peteru mọ̀ mọ́ Satani gan-an tàbí ó ń fi ipa ọ̀tá tí ọ̀rọ̀ rẹ̀ ń ṣe hàn. Ìtumọ̀ náà pa líle àti àìdánilójú yìí mọ́.
- issue: Ìtumọ̀ ἀνθρώπων nínú ìtakora pẹ̀lú Ọlọ́run
  choice: ‘àwọn ohun ti ènìyàn’
  alternative: ‘àwọn ohun ti àwọn ọkùnrin’ tàbí ‘àwọn àníyàn ti ẹ̀dá ènìyàn’
  rationale: Nínú àyíká yìí, ἀνθρώπων ń tọ́ka sí aráyé lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan. ‘Ènìyàn’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún pa ìtakora ẹ̀dá ènìyàn àti Ọlọ́run mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn ‘fi ọkàn sí’ mú ìtọ́sọ́nà èrò φρονεῖς jáde; ‘ohun ìkọ̀sẹ̀’ sì pa àwòrán Gíríìkì mọ́. A gbe àmì àlàyé [b] lẹ́yìn ‘àwọn ohun ti ènìyàn,’ ibi tí àlàyé náà ń tọ́ka sí ní ti gidi.
