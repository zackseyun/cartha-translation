  source_fidelity: 'Ìtumọ̀ náà fi gbogbo àwọn èrò pàtàkì nínú Gíríìkì hàn: Jésù yí padà, ó bá Peteru sọ̀rọ̀, ó pe e ní Satani, ó pè é ní ohun ìkọ̀sẹ̀, ó sì ṣètò ìtakora láàárín ohun ti Ọlọ́run àti ohun ti ènìyàn. Síbẹ̀, gbolóhùn àlàyé [a] lọwọlọwọ, “Kúrò lẹ́yìn mi,” lè túmọ̀ sí kí ẹni náà kúrò ní ipò tí ó wà lẹ́yìn Jésù, èyí tí ó yí ìtọ́sọ́nà ὀπίσω μου pa dà. Àtúnṣe náà mú ìtọ́sọ́nà náà dáa síi.'
