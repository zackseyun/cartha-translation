id: MAT.16.8
reference: Matthew 16:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù, nígbà tó mọ̀ èyí, ó ní, “Ẹ̀yin tí ìgbàgbọ́ yín kéré, kí ló dé tí ẹ fi ń jíròrò láàárín yín pé ẹ kò mú búrẹ́dì?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹ kò mú àwọn búrẹ́dì”; ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ “ẹ kò gba àwọn búrẹ́dì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: mọ èyí
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist yìí fi hàn pé Jésù ti mọ ohun tí wọ́n ń sọ kí ó tó dáhùn. A fi “èyí” kún un láti tọ́ka sí ọ̀rọ̀ tó ṣáájú, bí ó tilẹ̀ jẹ́ pé ohun tí ó mọ kò fara hàn ní tààràtà nínú Gíríìkì.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora hàn bí Jésù ṣe dá sí ìjíròrò àwọn ọmọ-ẹ̀yìn.
- source_word: εἶπεν
  choice: ó ní
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti ṣáájú ọ̀rọ̀ tí ẹni kan sọ, títí kan ìbéèrè.
- source_word: Τί
  choice: èé ṣe
  rationale: Nínú gbólóhùn yìí, Τί ń béèrè ìdí tí wọ́n fi ń jíròrò, kì í ṣe ohun tí wọ́n ń sọ lásán.
- source_word: διαλογίζεσθε
  choice: ẹ fi ń jíròrò
  rationale: Ó túmọ̀ sí ìrònú tàbí ìfọ̀rọ̀wérọ̀ tí àwọn ọmọ-ẹ̀yìn ń ṣe pẹ̀lú ara wọn; “jíròrò” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá àyíká mu.
- source_word: ἐν ἑαυτοῖς
  choice: láàárín ara yín
  rationale: Gbólóhùn náà lè túmọ̀ sí inú ara wọn tàbí láàárín ara wọn. Àyíká yìí tọ́ka sí ìfọ̀rọ̀wérọ̀ wọn pẹ̀lú ara wọn, ṣùgbọ́n èdè náà kò ṣe àfikún ohun tí kò sí.
- source_word: ὀλιγόπιστοι
  choice: Ẹ̀yin tí ìgbàgbọ́ yín kéré
  rationale: Ó pa agbára ìbáwí tààràtà mọ́, ó sì fi àìpé ìgbẹ́kẹ̀lé àwọn ọmọ-ẹ̀yìn hàn láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàgbékalẹ̀ kókó ohun tí wọ́n ń jíròrò—pé wọn kò ní búrẹ́dì—dípò kí a sọ ọ́ di ìdí pẹ̀lú “nítorí pé.”
- source_word: ἄρτους
  choice: búrẹ́dì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀, Yorùbá sábà máa ń lo “búrẹ́dì” gẹ́gẹ́ bí orúkọ ohun tí a kò nílò láti kà ní àyíká yìí. Àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan náà hàn.
- source_word: οὐκ ἐλάβετε
  choice: ẹ kò ní búrẹ́dì
  rationale: Ní tààràtà, ó túmọ̀ sí pé wọn kò mú tàbí gba àwọn ìṣù búrẹ́dì; nínú àyíká, àbájáde rẹ̀ ni pé wọn kò ní búrẹ́dì. Ìtumọ̀ àdánidá yìí pa èrò náà mọ́, a sì ṣàkọsílẹ̀ ọ̀nà gangan ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Agbára ìbáwí ὀλιγόπιστοι
  choice: A túmọ̀ ọ́ sí “Ẹ̀yin tí ìgbàgbọ́ yín kéré,” gẹ́gẹ́ bí ìbáwí sí ìgbẹ́kẹ̀lé wọn tí kò pé.
  alternative: Kí a mú un rọrùn sí àìlóye lásán, láìsọ nípa ìgbàgbọ́.
  rationale: Ọ̀rọ̀ Gíríìkì náà dá ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé wọn lẹ́bi ní tààràtà. Ìtumọ̀ náà pa agbára ẹ̀kọ́ yìí mọ́ láìsọ ọ́ di gbólóhùn ẹ̀kọ́ ìsìn tó gbòòrò ju àyíká lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì; “èé ṣe,” “jíròrò,” àti “láàárín ara yín” jẹ́ àdánidá fún òǹkàwé Yorùbá lónìí. A gbé ọ̀rọ̀ ìpè ὀλιγόπιστοι sí iwájú ìbéèrè láti jẹ́ kí ó ṣàn dáadáa ní Yorùbá, láìyí agbára ìbáwí rẹ̀ padà.
