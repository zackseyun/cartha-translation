id: MAT.16.3
reference: Matthew 16:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: yo
  text: Ní òwúrọ̀, ẹ sì ń sọ pé, ‘Ojú ọjọ́ yóò burú lónìí, nítorí ọ̀run ń pupa, ó sì ṣókùnkùn.’ Ẹ mọ bí a ṣe ń túmọ̀ ìrísí ojú ọ̀run, ṣùgbọ́n ẹ kò lè túmọ̀ àwọn àmì àwọn àkókò[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Àwọn àmì àwọn àkókò’ lè tọ́ka sí ìjẹ́pàtàkì ti ìgbà náà nípa ti ẹ̀mí, títí kan àwọn iṣẹ́ Jésù gẹ́gẹ́ bí Mèsáyà.
    reason: alternative_reading
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ àtijọ́ kan kò ní apá ẹsẹ̀ yìí láti ‘Ẹ mọ bí’ dé òpin.
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: ní òwúrọ̀
  rationale: Ó jẹ́ ọ̀rọ̀ àkókò; ‘ní òwúrọ̀’ jẹ́ Yorùbá àdánidá, ó sì bá ìyàtọ̀ àkókò inú ọ̀rọ̀ náà mu.
- source_word: χειμών
  choice: ojú ọjọ́ yóò burú
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ojú ọjọ́ búburú tàbí oníjì, kì í ṣe àsìkò òtútù. Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àsọtẹ́lẹ̀ ojú ọjọ́ búburú.
- source_word: πυρράζει
  choice: ojú ọ̀run pupa
  rationale: Ó pa ìtumọ̀ àwọ̀ pupa mọ́ láìfi agbára míì kún un.
- source_word: στυγνάζων
  choice: ó sì ṣú biribiri
  rationale: Ó fi ojú ọ̀run tí ó ṣókùnkùn, tí ó sì dà bí ẹni pé ojú ọjọ́ fẹ́ burú hàn ní Yorùbá àdánidá.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: ìrísí ojú ọ̀run
  rationale: ‘Ojú’ ni ìtumọ̀ gígùn πρόσωπον, ṣùgbọ́n nínú àṣà ọ̀rọ̀ yìí, gbogbo bí ojú ọ̀run ṣe rí ni a ń tọ́ka sí; ‘ìrísí ojú ọ̀run’ pa àwòrán náà àti ìtumọ̀ rẹ̀ mọ́.
- source_word: γινώσκετε διακρίνειν
  choice: ẹ mọ bí ẹ ṣe lè mọ ohun tí ... túmọ̀ sí
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń sọ nípa agbára tí a kọ́ láti fi ìrísí kan yé tàbí láti túmọ̀ rẹ̀; ìṣètò yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: ‘Àwọn àmì’ pa agbára ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ohun tí ń tọ́ka sí òtítọ́ tàbí ìṣẹ̀lẹ̀ pàtàkì kan.
- source_word: καιρῶν
  choice: àwọn àkókò
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí àwọn àkókò tàbí ìgbà pàtàkì, kì í ṣe àsìkò ojú ọjọ́ nìkan; yíyan ọ̀rọ̀ gbogbogbò yìí kò fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: οὐ δύνασθε
  choice: ẹ kò lè mọ
  rationale: Ó sọ àìlèṣe ní tààrà, ó sì pa ìfarawe pẹ̀lú gbólóhùn tó ṣáájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn àmì àkókò’
  choice: A pa gbólóhùn náà mọ́ ní ọ̀nà tó gbòòrò, láìdín in kù sí àwọn àmì òpin ayé nìkan.
  alternative: ‘àwọn àmì ìgbà yìí’ tàbí ‘àwọn àmì àsìkò Mèsáyà’
  rationale: Ọ̀rọ̀ Gíríìkì lè gba ìtumọ̀ ìjẹ́pàtàkì ìgbà tí Jésù wà àti àwọn iṣẹ́ rẹ̀, ó sì tún lè ní ìró ohun tó ní í ṣe pẹ̀lú ìmúṣẹ ète Ọlọ́run. Ìtumọ̀ náà yẹ kí ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Ìbáwí Jésù nípa agbára láti túmọ̀ àmì
  choice: A pa ìyàtọ̀ tó wà láàárín lílóye ojú ọ̀run àti àìlóye àmì àkókò mọ́.
  alternative: Láti sọ pé àwọn olùgbọ́ náà mọ àmì náà ṣùgbọ́n wọ́n mọ̀ọ́mọ̀ kọ̀ ọ́
  rationale: Ẹsẹ̀ náà sọ àìlèṣe ní kedere; kò yẹ kí ìtumọ̀ fi ìdí pàtó mú ohun tó fa àìlèṣe náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ojú ọjọ́ yóò burú’ àti ‘ṣú biribiri’ jẹ́ àwọn àṣà ọ̀rọ̀ ojú ọjọ́ tó wọ́pọ̀; a lo ‘ìrísí ojú ọ̀run’ láti pa àwòrán πρόσωπον mọ́ láìjẹ́ kí gbólóhùn náà le.
