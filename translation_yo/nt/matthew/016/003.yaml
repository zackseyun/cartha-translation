  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ẹsẹ̀ Gíríìkì mọ́: àsọtẹ́lẹ̀ ojú ọjọ́ tí ó dá lórí ojú ọ̀run, àti ìbáwí nípa àìlè túmọ̀ àwọn àmì àwọn àkókò. Síbẹ̀, ‘ẹ sì máa ń sọ’ fi ìṣe àṣà tí ń ṣẹlẹ̀ léraléra kún ọ̀rọ̀ náà, níbi tí Gíríìkì ti ń ṣàfihàn ọ̀rọ̀ àsọtẹ́lẹ̀ ní àkókò òwúrọ̀. ‘Mọ ohun tí ... túmọ̀ sí’ sì gùn ju, ó sì ń sọ ìtumọ̀ náà di àlàyé ju ‘διακρίνειν’ lọ.'
  naturalness: ‘Ní òwúrọ̀, ẹ sì ń sọ pé’ àti ‘Ẹ mọ bí a ṣe ń túmọ̀ ìrísí ojú ọ̀run’ jẹ́ Yorùbá boṣewa tí ó rọrùn, tí ó sì dáa ju ‘ẹ sì máa ń sọ’ àti ‘Ẹ mọ bí ẹ ṣe lè mọ ohun tí ... túmọ̀ sí’ lọ. ‘Ọ̀run ń pupa, ó sì ṣókùnkùn’ ń sọ àwọ̀ pupa àti ìrísí ìbànújẹ/dúdú ojú ọ̀run ní kedere.
