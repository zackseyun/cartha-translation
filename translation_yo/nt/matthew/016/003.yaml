revisions:
- from: Ní òwúrọ̀ ẹ sì máa ń sọ pé, ‘Ojú ọjọ́ yóò burú lónìí, nítorí ojú ọ̀run pupa, ó sì ṣú biribiri.’ Ẹ mọ bí ẹ ṣe lè mọ ohun tí ìrísí ojú ọ̀run túmọ̀ sí, ṣùgbọ́n ẹ kò lè mọ ohun tí àwọn àmì àkókò[a] túmọ̀ sí.[b]
  to: Ní òwúrọ̀, ẹ sì ń sọ pé, ‘Ojú ọjọ́ yóò burú lónìí, nítorí ọ̀run ń pupa, ó sì ṣókùnkùn.’ Ẹ mọ bí a ṣe ń túmọ̀ ìrísí ojú ọ̀run, ṣùgbọ́n ẹ kò lè túmọ̀ àwọn àmì àwọn àkókò[a].[b]
  rationale: Àtúnṣe náà yọ ìtumọ̀ ìṣe àṣà tí ‘máa ń’ kún un kúrò, ó sì rọ́pò ìṣètò ọ̀rọ̀ tó gùn pẹlu ọ̀nà Yorùbá tí ó kedere fún agbára láti túmọ̀ tàbí láti mọ ìrísí ohun kan. Ó pa ìyàtọ̀ láàárín ìtumọ̀ ìrísí ojú ọ̀run àti àìlè túmọ̀ àmì àwọn àkókò mọ́, ó sì dá ìfẹ̀sẹ̀mulẹ̀ àyíyàn ẹsẹ̀ náà sílẹ̀ nínú àlàyé ìsàlẹ̀.
