id: MAT.16.12
reference: Matthew 16:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: yo
  text: Nígbà náà ni wọ́n yé e pé kò sọ pé kí wọ́n ṣọ́ra fún ìwúkàrà búrẹ́dì[a], bí kò ṣe fún ẹ̀kọ́ àwọn Farisí àti Sadusí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwúkàrà àwọn ìṣù búrẹ́dì.” Ọ̀rọ̀ orúkọ Gíríìkì níbí wà ní ọ̀pọ̀ nọ́ńbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi àkókò tí àwọn ọmọ-ẹ̀yìn ṣẹ̀ṣẹ̀ lóye ọ̀rọ̀ Jésù hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: συνῆκαν
  choice: wọ́n yé e
  rationale: Ó sọ pé wọ́n dé ibi tí wọ́n ti lóye ohun tí Jésù ní lọ́kàn; gbólóhùn yìí ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: οὐκ εἶπεν
  choice: kò sọ pé
  rationale: Ó pa ìtúmọ̀ ìsẹ̀lẹ̀ àtijọ́ Gíríìkì mọ́ láìfi ìlànà àkókò tí kò ṣe pàtàkì kún un.
- source_word: προσέχειν
  choice: kí wọ́n ṣọ́ra fún
  rationale: Nínú ọ̀rọ̀ ìkìlọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí wíwà lójúfò tàbí ṣíṣọ́ra fún ohun kan.
- source_word: ἀπὸ τῆς ζύμης
  choice: fún ìwúkàrà
  rationale: “Ìwúkàrà” ni ọ̀rọ̀ Yorùbá fún ohun tí ń mú ìyẹ̀fun wú; ó pa àwòrán àfiwé inú ọ̀rọ̀ náà mọ́.
- source_word: τῶν ἄρτων
  choice: inú àwọn ìṣù búrẹ́dì
  rationale: Ọ̀pọ̀ nọ́ńbà Gíríìkì ni a fi “àwọn ìṣù búrẹ́dì” hàn; “inú” mú ìbáṣepọ̀ ìwúkàrà àti búrẹ́dì ṣe kedere ní Yorùbá láìyí ohun tí wọ́n kọ́kọ́ rò padà.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó fi ìtakora tó lágbára hàn láàárín ohun tí wọn rò tẹ́lẹ̀ àti ohun tí Jésù ní lọ́kàn.
- source_word: διδαχῆς
  choice: ẹ̀kọ́
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a ń kọ́ni, láìlo ọ̀rọ̀ ẹ̀sìn tó le.
- source_word: Φαρισαίων
  choice: àwọn Farisí
  rationale: Ìkọ̀wé orúkọ ẹgbẹ́ náà ní fọ́ọ̀mù tí ó wọ́pọ̀, tí ó sì rọrùn fún àwọn òǹkàwé Yorùbá.
- source_word: Σαδδουκαίων
  choice: àwọn Sadusí
  rationale: Ìkọ̀wé orúkọ ẹgbẹ́ náà ní fọ́ọ̀mù Yorùbá tí ó wọ́pọ̀, tí ó sì ṣeé kà ní àdánidá.
theological_decisions:
- issue: Agbára àfiwé “ìwúkàrà”
  choice: A fi “ìwúkàrà” sílẹ̀ gẹ́gẹ́ bí àfiwé, a sì jẹ́ kí ẹsẹ náà fúnra rẹ̀ ṣàlàyé rẹ̀ gẹ́gẹ́ bí “ẹ̀kọ́ àwọn Farisí àti àwọn Sadusí.”
  alternative: Láti fi ọ̀rọ̀ ìtumọ̀ bí “àgàbàgebè” tàbí “ẹ̀kọ́ búburú” kún ọ̀rọ̀ pàtàkì.
  rationale: Ẹsẹ náà sọ pé ẹ̀kọ́ wọn ni àfiwé náà ń tọ́ka sí, ṣùgbọ́n kò túbọ̀ sọ irú àbùkù ẹ̀kọ́ náà níbí; nítorí náà a kò fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu; a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
