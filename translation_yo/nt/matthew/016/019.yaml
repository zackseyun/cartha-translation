id: MAT.16.19
reference: Matthew 16:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: yo
  text: 'Èmi kì í ṣe dandan; ìtúmọ̀ àtúnṣe: “N óò fún ọ ní àwọn kọ́kọ́rọ́ ìjọba ọ̀run[a]. Ohunkóhun tí o bá dè lórí ilẹ̀ ayé yóò jẹ́ ohun tí a ti dè ní ọ̀run[b][c], ohun yòówù tí o bá sì tú sílẹ̀ lórí ilẹ̀ ayé yóò jẹ́ ohun tí a ti tú sílẹ̀ ní ọ̀run.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan sí i, “ìjọba àwọn ọ̀run.” Mátíù máa ń lo gbólóhùn yìí ní ọ̀pọ̀ ìgbà.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan ní, “a ó dè … a ó tú sílẹ̀.” Ṣùgbọ́n ìrísí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí pé ní àkókò náà, yóò jẹ́ ohun tí a ti dè tàbí tí a ti tú sílẹ̀ ní ọ̀run.
    reason: alternative_reading
  - marker: c
    text: “Dè” àti “tú sílẹ̀” lè ní ìtumọ̀ dídènà àti fífàyè gbà, tàbí fífi ojúṣe lélẹ̀ àti gbígbé e kúrò; síbẹ̀, ìtumọ̀ yìí pa àkàwé Gíríìkì mọ́.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Èmi yóò fún ọ ní
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni δώσω, σοι sì jẹ́ ẹni tí a ń fún; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ìlérí ọjọ́ iwájú mọ́. A fi “Èmi” hàn nítorí ìtẹnumọ́ tí ó wà nínú ọ̀rọ̀ Jesu.
- source_word: τὰς κλεῖδας
  choice: àwọn kọ́kọ́rọ́
  rationale: Ó pa àwòrán “àwọn kọ́kọ́rọ́” mọ́ láì ṣàlàyé rẹ̀ sí irú àṣẹ kan pàtó.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún gbólóhùn Mátíù; àkọsílẹ̀ ìsàlẹ̀ fi ọ̀pọ̀ nọ́mbà Gíríìkì hàn.
- source_word: ὃ ἐὰν
  choice: ohunkóhun tí … bá / ohun yòówù tí … bá
  rationale: Àwọn gbólóhùn méjèèjì ń sọ ohun àìlópìn; àwọn ìtumọ̀ Yorùbá méjèèjì jẹ́ ti ẹ̀dá, wọ́n sì yẹra fún àsọtúnsọ líle.
- source_word: δήσῃς
  choice: dè
  rationale: “Dè” pa àkàwé Gíríìkì mọ́, pẹ̀lú àǹfààní ìtumọ̀ rẹ̀ nípa dídènà tàbí fífi ojúṣe léni, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó sí i.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìyàtọ̀ ilẹ̀ ayé àti ọ̀run hàn.
- source_word: ἔσται δεδεμένον
  choice: yóò jẹ́ ohun tí a ti dè
  rationale: Ọ̀nà yìí fi ọjọ́ iwájú ἔσται àti ipò tí iṣẹ́ pípé δεδεμένον ti mú wá hàn; ó dára ju kí a sọ pé “a ó dè é” lọ, èyí tí kò ní fi apá pípé náà hàn.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní ọ̀run
  rationale: “Ní ọ̀run” jẹ́ Yorùbá tí ó ṣe déédéé; àkọsílẹ̀ ìsàlẹ̀ sọ pé ọ̀pọ̀ nọ́mbà ni Gíríìkì lò.
- source_word: λύσῃς
  choice: tú sílẹ̀
  rationale: Ó jẹ́ alábàákẹ́gbẹ́ àdánidá fún “dè,” ó sì pa àkàwé ìtúsílẹ̀ mọ́.
- source_word: ἔσται λελυμένον
  choice: yóò jẹ́ ohun tí a ti tú sílẹ̀
  rationale: Gẹ́gẹ́ bí gbólóhùn àkọ́kọ́, èyí pa ọjọ́ iwájú àti abajade iṣẹ́ tí a ti parí mọ́.
theological_decisions:
- issue: Ìrísí ọ̀rọ̀ àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ nínú “dè/tú sílẹ̀”
  choice: “yóò jẹ́ ohun tí a ti dè/tú sílẹ̀ ní ọ̀run”
  alternative: “a ó dè/tú u sílẹ̀ ní ọ̀run” tàbí “yóò di dídè/títú sílẹ̀ ní ọ̀run”
  rationale: ἔσται pẹ̀lú ọ̀rọ̀-àpèjúwe pípé aláìṣiṣẹ́ lè tọ́ka sí ipò ọjọ́ iwájú tí iṣẹ́ tí a ti ṣe tẹ́lẹ̀ yọrí sí. Ìtumọ̀ yìí ń pa agbára gírámà náà mọ́, ṣùgbọ́n kò sọ ní pàtó irú àṣẹ ìjọ tàbí ìlànà ẹ̀sìn kan tí ẹsẹ náà kò ṣàlàyé.
- issue: Ìtumọ̀ “àwọn kọ́kọ́rọ́ ìjọba ọ̀run”
  choice: A pa àkàwé “àwọn kọ́kọ́rọ́” mọ́.
  alternative: Àṣẹ láti gba ènìyàn wọlé tàbí láti dá wọn dúró; àṣẹ ìríjú
  rationale: Àwòrán náà lè túmọ̀ sí àṣẹ, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àkàwé. Fífi í sílẹ̀ bẹ́ẹ̀ ń yẹra fún fífi ètò ìjọ kan pàtó kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán “kọ́kọ́rọ́,” “dè,” àti “tú sílẹ̀” mọ́, a sì lo àtòjọ ọ̀rọ̀ Yorùbá tí ó rọrùn láti fi ìrísí pípé ọjọ́ iwájú Gíríìkì hàn.
