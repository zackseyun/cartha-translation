id: MAT.16.28
reference: Matthew 16:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: yo
  text: Lóòótọ́ ni mo sọ fún yín pé, àwọn kan wà lára àwọn tí ó dúró níhìn-ín, tí wọn kì yóò tọ́ ikú wò rárá[a] títí tí wọn yóò fi rí Ọmọ Ènìyàn tí ó ń bọ̀ nínú ìjọba rẹ̀.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kì yóò tọ́ ikú wò ní ọ̀nà kankan”; Gíríìkì lo ìkọ̀ tí ó lágbára gan-an.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “Ọmọ Ènìyàn tí ó ń bọ̀ nínú ìjọba rẹ̀,” lè tọ́ka sí ìyípadà-ògo, àjíǹde àti ìgbéga, ìdájọ́ lórí Jerúsálẹ́mù, tàbí ìpadàbọ̀ ní òpin ayé; ẹsẹ yìí fúnra rẹ̀ kò sọ ìṣẹ̀lẹ̀ tí ó túmọ̀ sí ní pàtó.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “nínú ìṣàkóso ọba rẹ̀” tàbí “nínú ìjọba-ọba rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìdánilójú ọlọ́wọ̀ àti ọ̀rọ̀ pàtàkì tí ἀμὴν fi ń bẹ̀rẹ̀ gbólóhùn jáde ní Yorùbá àdánidá, láì fi dandan ṣe àkọlèsílẹ̀ ọ̀rọ̀ Gíríìkì náà.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìsọ̀rọ̀ ẹni àkọ́kọ́ àti ìtọ́ka tààrà sí ọ̀pọ̀ olùgbọ́ mọ́.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: àwọn kan wà lára àwọn tí ó dúró níhìn-ín
  rationale: Ó pa ìtumọ̀ apá-kan-lára-ọ̀pọ̀ mọ́, ó sì sọ ọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: wọn kì yóò tọ́ ikú wò rárá
  rationale: ‘Tọ́ ikú wò’ pa àwòrán ‘tọ́ ikú’ mọ́, ‘rárá’ sì mú ìkọ̀ emphatic οὐ μή hàn.
- source_word: ἕως ἂν ἴδωσιν
  choice: títí wọn yóò fi rí
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ààlà àkókò ọjọ́ iwájú tí ó wà nínú Gíríìkì.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè àti ìró ìran àsọtẹ́lẹ̀ náà mọ́ láì ṣe àlàyé rẹ̀ sínú ìtumọ̀.
- source_word: ἐρχόμενον
  choice: tí ó ń bọ̀
  rationale: Ó tú participle náà tààrà, láì fi ‘ní agbára’ tàbí àfikún mìíràn tí kò sí nínú ẹsẹ yìí kún un.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: nínú ìjọba rẹ̀
  rationale: ‘Ìjọba’ lè tọ́ka sí ilẹ̀ ọba tàbí ìṣàkóso ọba, nítorí náà ó pa ààyè ìtumọ̀ βασιλεία mọ́ láì dín un kù sí ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ohun tí ‘Ọmọ Ènìyàn tí ó ń bọ̀ nínú ìjọba rẹ̀’ ń tọ́ka sí
  choice: A tú gbólóhùn náà gẹ́gẹ́ bí ó ṣe wà, láì sọ ìṣẹ̀lẹ̀ kan pàtó.
  alternative: Ìyípadà-ògo, àjíǹde àti ìgbéga, Pẹ́ńtíkọ́sì, ìdájọ́ lórí Jerúsálẹ́mù, tàbí ìpadàbọ̀ ní òpin ayé.
  rationale: Gíríìkì kò sọ ìṣẹ̀lẹ̀ náà ní pàtó; ìtumọ̀ gbọ́dọ̀ pa àìdánilójú àti ìfúnpọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Agbára ìtumọ̀ βασιλεία
  choice: ìjọba
  alternative: ìṣàkóso ọba tàbí ìjọba-ọba
  rationale: ‘Ìjọba’ pa àwòrán ọ̀rọ̀ náà àti ìtumọ̀ rẹ̀ gẹ́gẹ́ bí agbègbè tàbí ìṣàkóso mọ́, láì yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Tọ́ ikú wò’ pa àwòrán orísun mọ́, ‘rárá’ sì jẹ́ kí ìkọ̀ líle náà ṣe kedere fún òǹkàwé.
