  to: Nítorí kí ni yóò ṣe ènìyàn lóore bí ó bá jèrè gbogbo ayé, ṣùgbọ́n tí ó pàdánù ìyè rẹ̀?[a] Tàbí kí ni ènìyàn yóò fi pààrọ̀ fún ìyè rẹ̀?
