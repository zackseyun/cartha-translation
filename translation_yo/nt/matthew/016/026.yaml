  source_fidelity: Ìtumọ̀ náà pa ìbéèrè àsọyé méjèèjì, ipò àfojúsùn náà, ‘gbogbo ayé,’ ìtakora àdánù, àti èrò pàṣípààrọ̀ mọ́. Síbẹ̀, ‘èrè wo ni yóò jẹ́ fún ènìyàn’ kò sọ ὠφεληθήσεται ní Yorùbá àdánidá dáadáa. ‘Kí ni yóò ṣe ènìyàn lóore’ sọ èrè/àǹfààní ìṣe náà kedere. Yíyàn ‘ìyè’ fún ψυχή dáa pẹ̀lú ọ̀rọ̀ àyíká, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń pa ‘ẹ̀mí’ mọ́ gẹ́gẹ́ bí àṣàyàn tó ṣe pàtàkì.
