id: MAT.16.26
reference: Matthew 16:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: yo
  text: Nítorí kí ni yóò ṣe ènìyàn lóore bí ó bá jèrè gbogbo ayé, ṣùgbọ́n tí ó pàdánù ìyè rẹ̀?[a] Tàbí kí ni ènìyàn yóò fi pààrọ̀ fún ìyè rẹ̀?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “ìyè rẹ̀” ní ìgbà méjèèjì sí “ẹ̀mí rẹ̀.” Ọ̀rọ̀ Gíríìkì ψυχή lè tọ́ka sí ìyè, ẹ̀mí, tàbí ẹni náà fúnra rẹ̀, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Nítorí èrè wo ni
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ mọ́ ọ̀rọ̀ tó ṣáájú, “èrè wo ni” sì dá ìbéèrè àsọyé τί àti àkòrí èrè dúró ní Yorùbá àdánidá.
- source_word: ὠφεληθήσεται
  choice: yóò jẹ́ fún ènìyàn
  rationale: Pẹ̀lú “èrè wo,” gbólóhùn yìí sọ ní kedere pé a ń béèrè ohun tí ènìyàn yóò jèrè tàbí àǹfààní tí yóò rí, láìfi èdè líle tàbí àjèjì ṣe e.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: “Ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ẹni kan ní ìtumọ̀ àpapọ̀; kò fi akọ tàbí abo tí Gíríìkì kò tẹnumọ́ sí i.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Èyí ni ìṣètò àdánidá Yorùbá fún ipò àròsọ tàbí àfojúsùn.
- source_word: τὸν κόσμον ὅλον
  choice: gbogbo ayé
  rationale: Ó pa ìtumọ̀ gbogbo ohun tó wà ní ayé mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: κερδήσῃ
  choice: jèrè
  rationale: “Jèrè” mú àwòrán èrè tàbí ohun tí a rí gbà jáde, ó sì bá ìtakora pẹ̀lú àdánù mu.
- source_word: τὴν δὲ ψυχὴν αὐτοῦ
  choice: ṣùgbọ́n tí ó pàdánù ẹ̀mí rẹ̀
  rationale: “Ṣùgbọ́n” fi ìtakora δέ hàn. “Ẹ̀mí” lè tọ́ka sí ìyè ẹni tàbí apá inú ẹni, ó sì pa ààyè ìtumọ̀ ψυχή mọ́; àlàyé ìsàlẹ̀ ojú ewé ṣàfihàn àṣàyàn “ìyè.”
- source_word: ζημιωθῇ
  choice: pàdánù
  rationale: Ọ̀rọ̀ yìí sọ àdánù ohun iyebíye ní Yorùbá tó ṣe kedere, láìfipá pinnu bóyá àdánù náà jẹ́ ìjìyà, ìkọ̀sílẹ̀, tàbí fífi ohun kan rúbọ.
- source_word: ἢ τί
  choice: Tàbí kí ni
  rationale: Ó bẹ̀rẹ̀ ìbéèrè àsọyé kejì, gẹ́gẹ́ bí Gíríìkì.
- source_word: δώσει
  choice: yóò fi
  rationale: Nínú àkójọpọ̀ “fi ... pààrọ̀,” ó mú ìṣe fífi ohun kan fúnni gẹ́gẹ́ bí pàṣípààrọ̀ hàn, tí ó sì pa ọjọ́ iwájú mọ́.
- source_word: ἀντάλλαγμα
  choice: pààrọ̀
  rationale: “Fi ... pààrọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí a fi dípò ohun mìíràn, láìyí i sí ọ̀rọ̀ ìràpadà tó ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtó.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: ẹ̀mí rẹ̀
  rationale: A lo ìtumọ̀ kan náà fún ψυχή ní ẹ̀ẹ̀kejì láti pa ìfarajọ àwọn ìbéèrè méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ nípa àdánù tó ga jù
  choice: ẹ̀mí
  alternative: ìyè; ara ẹni
  rationale: “Ẹ̀mí” jẹ́ ìtumọ̀ Yorùbá tí a mọ̀ dáadáa fún ψυχή nínú ọ̀rọ̀ yìí, ṣùgbọ́n ψυχή tún lè túmọ̀ sí ìyè tàbí ara ẹni lápapọ̀. Àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gbooro yẹn mọ́, kí ìtumọ̀ má bàa fi ìpín ẹ̀dá ènìyàn kan pàtó lé ẹsẹ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. Àwọn àmì ohùn kún níbi tí ó bá yẹ. Ìbéèrè àsọyé méjèèjì àti àwòrán èrè, àdánù, àti pàṣípààrọ̀ ni a pa mọ́.
