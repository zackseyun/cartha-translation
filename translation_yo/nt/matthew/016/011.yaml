id: MAT.16.11
reference: Matthew 16:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: yo
  text: Èé ṣe tí ẹ kò fi lóye pé kò sọ fún yín nípa búrẹ́dì? Ṣùgbọ́n ẹ ṣọ́ra fún ìwúkàrà àwọn Farisí àti Sadusí[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kíyèsára fún ìwúkàrà àwọn Farisí àti Sadusí.”
    reason: lexical_alternative
  - marker: b
    text: “Ìwúkàrà” jẹ́ àkàwé níbí; ẹsẹ tó tẹ̀ lé ṣàlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ àwọn Farisí àti Sadusí.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Èé ṣe tí ẹ kò fi yé e
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè ìbáwí nípa àìlóye wọn. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ìbéèrè náà mọ́ láìṣe àfikún ìtumọ̀.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: pé èmi kò sọ̀rọ̀ nípa búrẹ́dì fún yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄρτων jẹ́ ọ̀pọ̀ nínú Gíríìkì, “búrẹ́dì” gẹ́gẹ́ bí orúkọ àkójọpọ̀ jẹ́ èdè Yorùbá àdánidá nínú àyíká yìí. “Èmi” mú ìtẹnumọ́ olùsọ̀ jáde ní kedere.
- source_word: προσέχετε ... ἀπό
  choice: ẹ ṣọ́ra fún
  rationale: Àṣẹ náà jẹ́ ìkìlọ̀ láti má ṣe jẹ́ kí ohun kan ní ipa lórí ẹni, kì í ṣe pé kí wọ́n kàn fiyè sí i. “Ẹ ṣọ́ra fún” jẹ́ ọ̀nà Yorùbá tí ó bá ìkìlọ̀ yìí mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ ṣe àfihàn ìyípadà pẹ̀lú ìtakora díẹ̀ láti inú àìlóye nípa búrẹ́dì sí ìkìlọ̀ gidi.
- source_word: τῆς ζύμης
  choice: ìwúkàrà
  rationale: “Ìwúkàrà” pa àwòrán ohun tí ń mú ìyẹ̀fun wú mọ́, ó sì jẹ́ kí àkàwé inú orísun dúró láìtúmọ̀ ọ́ sí “ẹ̀kọ́” ṣáájú ẹsẹ tó tẹ̀ lé.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: àwọn Farisí àti Sadusí
  rationale: Àwọn wọ̀nyí ni orúkọ Yorùbá tí a mọ̀ fún ẹgbẹ́ Júù méjèèjì; ìbáṣepọ̀ náà fi ìwúkàrà tí ó jẹ́ ti wọn tàbí tí ó ṣàpẹẹrẹ ìwà wọn hàn.
theological_decisions:
- issue: Agbára àkàwé “ìwúkàrà”
  choice: Fi “ìwúkàrà” sílẹ̀ gẹ́gẹ́ bí àkàwé nínú ẹsẹ yìí.
  alternative: Túmọ̀ ọ́ ní tààrà sí “ẹ̀kọ́ àwọn Farisí àti Sadusí.”
  rationale: Ẹsẹ tó tẹ̀ lé ló ṣàlàyé pé ẹ̀kọ́ wọn ni àkàwé náà ń tọ́ka sí. Fífipamọ́ àkàwé níbí tẹ̀ lé ọ̀rọ̀ orísun, ó sì kò fi àlàyé ẹsẹ tó tẹ̀ lé wọ ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, “búrẹ́dì” fún ἄρτων ní ìtumọ̀ àkójọpọ̀, àti “ìwúkàrà” láti pa àkàwé orísun mọ́. Àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
