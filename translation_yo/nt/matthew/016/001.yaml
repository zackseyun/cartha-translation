id: MAT.16.1
reference: Matthew 16:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: yo
  text: Àwọn Farisí àti Sadusí sì tọ̀ ọ́ wá, wọ́n ń dán an wò[a], wọ́n sì béèrè pé kí ó fi àmì kan láti ọ̀run hàn wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń dán an wò láti mú un ṣubú,” tàbí “wọ́n ń gbìyànjú láti dẹkùn mú un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò tọ Jesu hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n sún mọ́ ọn kí wọ́n lè bá a sọ̀rọ̀.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ náà ni a kọ ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: Σαδδουκαῖοι
  choice: àwọn Sadusí
  rationale: Orúkọ ẹgbẹ́ náà ni a kọ ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: πειράζοντες
  choice: wọ́n ń dán an wò
  rationale: Ó pa ìtumọ̀ ìdánwò mọ́, ó sì jẹ́ kí ìhùwàsí ọ̀tá inú ọ̀rọ̀ náà hàn láìsọ ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐπηρώτησαν
  choice: wọ́n sì béèrè
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìbéèrè pé kí Jesu ṣe ohun kan mu.
- source_word: σημεῖον
  choice: àmì kan
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì láìfi ọ̀rọ̀ ìtumọ̀ míì bí ‘àmì iṣẹ́ ìyanu’ kún un.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó fi orísun àmì náà hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐπιδεῖξαι
  choice: kí ó fi ... hàn wọ́n
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìbéèrè pé kí Jesu ṣàfihàn àmì náà sí wọn.
theological_decisions:
- issue: Ìhùwàsí ọ̀tá nínú ìbéèrè àwọn Farisí àti Sadusí
  choice: wọ́n ń dán an wò
  alternative: wọ́n ń dán an wo láti mú un sínú ẹ̀gẹ́; wọ́n ń dán an wo láti mú un dẹ́ṣẹ̀
  rationale: ‘Dán an wò’ pa ìtumọ̀ πειράζοντες àti àìdánilójú tó wà nínú rẹ̀ mọ́. Ó fi hàn pé ìbéèrè náà kì í ṣe ti ọkàn rere, ṣùgbọ́n kò túmọ̀ ète wọn ju ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ lọ.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. A lo ‘tọ̀ ọ́ wá’ fún ìṣípò sún mọ́ Jesu, a sì pa àtẹ̀lé iṣẹ́ inú Gíríìkì mọ́ ní ọ̀nà tí ó rọrùn láti lóye.
