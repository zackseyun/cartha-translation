id: MAT.16.18
reference: Matthew 16:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: yo
  text: Èmi náà sì sọ fún ọ pé, ìwọ ni Pétérù; lórí àpáta yìí[a] ni èmi yóò kọ ìjọ mi, àwọn ẹnubodè Hédíìsì[b] kì yóò sì borí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àpáta yìí” lè tọ́ka sí Pétérù, sí ìjẹ́wọ́ Pétérù, tàbí sí Pétérù gẹ́gẹ́ bí ẹni tí ó jẹ́wọ́ àti àpọ́sítélì aṣojú.
    reason: alternative_reading
  - marker: b
    text: 'Gíríìkì: “Hédíìsì,” ìyẹn ni, ibùgbé àwọn òkú. Ní àwọn ìtumọ̀ ìbílẹ̀: “àpáàdì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: Èmi náà sì
  rationale: “Èmi náà” ń pa ìtẹnumọ́ κἀγώ mọ́, “sì” sì ń fi ìtẹ̀síwájú tàbí ìyàtọ̀ kékeré tí δέ ní hàn láì sọ ọ́ di ìtakora líle.
- source_word: σοι λέγω
  choice: sọ fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan ń bá ẹlòmíràn sọ̀rọ̀ ní tààrà.
- source_word: Πέτρος
  choice: Pétérù
  rationale: Orúkọ ẹni náà ni a kọ ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀; àlàyé ìsàlẹ̀ ojú ewé ń jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú πέτρα dúró láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: orí àpáta yìí ... sí
  rationale: Ìṣètò “orí ... ni ... kọ ... sí” jẹ́ èdè Yorùbá àdánidá, ó sì pa àwòrán ìkọ́lé àti agbára ọ̀rọ̀ atọ́ka “yìí” mọ́.
- source_word: οἰκοδομήσω
  choice: èmi yóò kọ
  rationale: “Kọ” pa àwòrán ìkọ́lé inú οἰκοδομέω mọ́, ọjọ́ iwájú “yóò” sì bá fọ́ọ̀mù Gíríìkì mu.
- source_word: μου τὴν ἐκκλησίαν
  choice: ìjọ mi
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwùjọ àwọn tó jẹ́ ti Kristi, “mi” sì pa ọ̀rọ̀ ohun-ìní μου mọ́.
- source_word: πύλαι ᾅδου
  choice: àwọn ẹnubodè Hédíìsì
  rationale: “Àwọn ẹnubodè” pa àwòrán àti nọ́ńbà púpọ̀ Gíríìkì mọ́. “Hédíìsì” yà ᾅδης sọ́tọ̀ kúrò ní Gẹ́hẹ́nà tàbí èrò àpáàdì gẹ́gẹ́ bí ibi ìjìyà ìkẹyìn.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: kì yóò sì borí rẹ̀
  rationale: “Borí rẹ̀” sọ ìtumọ̀ pé láti lágbára ju tàbí láti ṣẹ́gun di Yorùbá tó ṣe kedere; “rẹ̀” ń tọ́ka padà sí ìjọ.
theological_decisions:
- issue: Ohun tí “àpáta yìí” (πέτρᾳ) ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “àpáta yìí” láì sọ pàtó ẹni tàbí ohun tí ó dúró fún.
  alternative: Ó lè tọ́ka sí Pétérù fúnra rẹ̀, sí ìjẹ́wọ́ Pétérù, tàbí sí Pétérù gẹ́gẹ́ bí olùjẹ́wọ́ àti àpọ́sítélì aṣojú.
  rationale: Gíríìkì ní eré-ọ̀rọ̀ láàárín Πέτρος àti πέτρα, ṣùgbọ́n kò fòpin sí gbogbo ìjíròrò nípa ohun tí àpáta náà dúró fún. Ìtumọ̀ náà àti àlàyé rẹ̀ pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Ìtumọ̀ ᾅδης
  choice: Hédíìsì
  alternative: ibùgbé àwọn òkú; àpáàdì
  rationale: “Hédíìsì” sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì yẹra fún fífi èrò nípa ibi ìjìyà ìkẹyìn sínú ẹsẹ̀ náà níbi tí ọ̀rọ̀ náà lè túmọ̀ sí agbègbè tàbí àṣẹ ikú.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlànà Yorùbá mu, a sì pa àwòrán ìkọ́lé, ẹnubodè, àti ìṣẹ́gun inú orísun Gíríìkì mọ́.
