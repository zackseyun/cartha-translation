id: MAT.16.9
reference: Matthew 16:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: yo
  text: Ṣé ẹ kò tíì lóye[a], bẹ́ẹ̀ ni ẹ kò sì rántí ìṣù búrẹ́dì márùn-ún fún ẹgbẹ̀rún márùn-ún ènìyàn, àti àwọn agbọ̀n mélòó tí ẹ kó jọ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ẹ kò lóye títí di báyìí?”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “tí ẹ gbà” tàbí “tí ẹ mú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: kò tíì
  rationale: Ó fi ìtumọ̀ àkókò hàn pé òye náà kò tíì dé, ó sì bá ohùn ìbáwí inú ìbéèrè Jesu mu. Ní Yorùbá, ‘kò tíì’ lè túmọ̀ sí ‘not yet’ tàbí ‘still not’ gẹ́gẹ́ bí àyíká ọ̀rọ̀.
- source_word: νοεῖτε
  choice: lóye
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí mímọ ìtumọ̀ àwọn iṣẹlẹ̀ tó ti ṣẹlẹ̀, kì í ṣe wíwo tàbí fífi ara mọ̀ nìkan.
- source_word: οὐδὲ
  choice: tí ẹ kò sì
  rationale: Ìsọ̀rọ̀ yìí so àwọn ọ̀rọ̀-ìṣe méjèèjì pọ̀ lábẹ́ ìkọ̀, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘nor.’
- source_word: μνημονεύετε
  choice: rántí
  rationale: Ó tọ́ka sí pípa iṣẹ́ ìyanu tó ṣáájú mọ́ ní ìrántí; ‘rántí’ jẹ́ ọ̀rọ̀ tó ṣe tààrà, tó sì wọ́pọ̀.
- source_word: τοὺς πέντε ἄρτους
  choice: ìṣù búrẹ́dì márùn-ún
  rationale: Ἄρτοι ní àyíká ìtàn yìí jẹ́ àwọn ìṣù búrẹ́dì; fífi ‘ìṣù’ kún un mú àwòrán ohun tí a kà ní márùn-ún ṣe kedere.
- source_word: τῶν πεντακισχιλίων
  choice: fún ẹgbẹ̀rún márùn-ún ènìyàn
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí ìṣù búrẹ́dì tí ó ní í ṣe pẹ̀lú fífún ẹgbẹ̀rún márùn-ún ní oúnjẹ; ‘fún’ sọ ìbáṣepọ̀ náà ní Yorùbá àdánidá láìfi ẹ̀kọ́ míì kún un.
- source_word: πόσους κοφίνους
  choice: iye agbọ̀n
  rationale: Κόφινος jẹ́ agbọ̀n; ìbéèrè náà ń béèrè iye àwọn agbọ̀n tí wọ́n ní lẹ́yìn iṣẹ́ ìyanu náà.
- source_word: ἐλάβετε
  choice: ẹ kó jọ
  rationale: Bí ó tilẹ̀ jẹ́ pé λαμβάνω sábà máa ń túmọ̀ sí ‘gbà’ tàbí ‘mú,’ àyíká ìtàn jíjẹ àwọn ẹgbẹ̀rún fi hàn pé wọ́n kó àjẹkù sínú agbọ̀n. ‘Kó jọ’ sọ iṣẹ́ náà ní Yorùbá òde òní tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gangan mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ṣé’ mú kí ìbéèrè ìbáwí náà dun bí ọ̀rọ̀ Yorùbá àdánidá; ‘ẹ’ sì bá ọ̀rọ̀-orúkọ ọ̀pọ̀ inú Gíríìkì mu. Gbólóhùn náà jẹ́ kedere fún òǹkàwé òde òní, ṣùgbọ́n ó pa ìbéèrè àti ìfọ̀rọ̀wérọ̀ orísun mọ́.
