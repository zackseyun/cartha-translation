  to: Láti ìgbà náà ni Jésù bẹ̀rẹ̀ sí í fi hàn àwọn ọmọ ẹ̀yìn rẹ̀ pé ó ní láti lọ sí Jerúsálẹ́mù, kí ó sì jìyà ọ̀pọ̀ nǹkan láti ọ̀dọ̀ àwọn àgbààgbà, àwọn olórí àlùfáà àti àwọn akọ̀wé[b][a], kí a sì pa á, àti pé ní ọjọ́ kẹta, a ó jí i dìde[c].
