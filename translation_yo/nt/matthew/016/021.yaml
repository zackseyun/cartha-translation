id: MAT.16.21
reference: Matthew 16:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: yo
  text: Láti ìgbà náà ni Jésù bẹ̀rẹ̀ sí í fi hàn àwọn ọmọ ẹ̀yìn rẹ̀ pé ó ní láti lọ sí Jerúsálẹ́mù, kí ó sì jìyà ọ̀pọ̀ nǹkan láti ọ̀dọ̀ àwọn àgbààgbà, àwọn olórí àlùfáà àti àwọn akọ̀wé[b][a], kí a sì pa á, àti pé ní ọjọ́ kẹta, a ó jí i dìde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó jìyà púpọ̀.” Gíríìkì sọ ní tààrà pé, “kí ó jìyà ọ̀pọ̀ nǹkan,” èyí tó lè tẹnu mọ́ onírúurú ìjìyà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ọwọ́ àwọn àgbààgbà, àwọn olórí àlùfáà àti àwọn akọ̀wé.” Gbólóhùn náà lè ní ìbáṣepọ̀ pẹ̀lú ìjìyà, àti bóyá pẹ̀lú pípa náà.
    reason: alternative_reading
  - marker: c
    text: 'Tàbí, “ó máa jí dìde.” Gíríìkì lo ohùn àfaradà: “a ó jí i dìde.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Láti ìgbà náà
  rationale: Ó samí sí ìbẹ̀rẹ̀ apá tuntun nínú ìtàn náà, ó sì pa agbára ọ̀rọ̀ àkókò Gíríìkì mọ́.
- source_word: ἤρξατο
  choice: bẹ̀rẹ̀ sí í
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbẹ̀rẹ̀ ìṣe tí ó ń tẹ̀ síwájú hàn.
- source_word: δεικνύειν
  choice: fi hàn
  rationale: Ó tẹ̀ lé ìtumọ̀ ìpilẹ̀ṣẹ̀ pé kí a sọ ohun kan di mímọ̀ tàbí kí a fihàn, láì fi àlàyé tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún àwọn tí ń tẹ̀ lé Jésù tí wọ́n sì ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀.
- source_word: δεῖ αὐτὸν
  choice: òun ní láti
  rationale: Ó pa agbára dandan mọ́, nígbà tí ó kò sọ pàtó ibi tí dandan náà ti wá.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: lọ sí Jerúsálẹ́mù
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún lílọ sí ibi kan, ó sì pa ìtọ́sọ́nà mọ́.
- source_word: πολλὰ παθεῖν
  choice: jìyà ohun púpọ̀
  rationale: Ó fi nọ́ńbà ọ̀pọ̀ nínú πολλὰ hàn, tó ń jẹ́ kí onírúurú ìjìyà ṣeé gbọ́, dípò kìkì ìwọ̀n ìjìyà.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: láti ọ̀dọ̀ àwọn àgbààgbà, àwọn olórí àlùfáà àti àwọn akọ̀wé
  rationale: “Láti ọ̀dọ̀” jẹ́ ìbámu àdánidá pẹ̀lú ἀπό, ó sì pa ìbáṣepọ̀ orísun tàbí aṣojú ìjìyà mọ́.
- source_word: πρεσβυτέρων
  choice: àwọn àgbààgbà
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ẹgbẹ́ àwọn aṣáájú Júù, kì í ṣe àwọn àgbàlagbà lásán nínú àyíká yìí.
- source_word: ἀρχιερέων
  choice: àwọn olórí àlùfáà
  rationale: Nínú ọ̀pọ̀ nọ́ńbà, ó tọ́ka sí ẹgbẹ́ àwọn àlùfáà alákòóso, kì í ṣe pé ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo wà lẹ́ẹ̀kan náà.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù; àlàyé iṣẹ́ wọn gẹ́gẹ́ bí amòfin lè jẹ́ ìtumọ̀ tó túbọ̀ gbòòrò.
- source_word: ἀποκτανθῆναι
  choice: kí a sì pa òun
  rationale: Ó fi ìṣe aláìlẹ́ni tí a dárúkọ hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ pé a ó pa Jésù mọ́.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: ní ọjọ́ kẹta, a ó jí òun dìde
  rationale: Ìṣètò yìí ṣe kedere ní Yorùbá, ó sì pa ohùn àfaradà Gíríìkì mọ́ nípasẹ̀ ẹni ìṣe tí a kò dárúkọ.
theological_decisions:
- issue: Agbára δεῖ nínú àsọtẹ́lẹ̀ ìjìyà Jésù
  choice: òun ní láti
  alternative: ó yẹ kí òun; ó pọndandan fún un láti
  rationale: Gíríìkì sọ pé ó jẹ́ dandan, ṣùgbọ́n kò ṣàlàyé nínú gbólóhùn yìí bóyá dandan náà jẹ́ ìpinnu Ọlọ́run, ìmúṣẹ Ìwé Mímọ́, tàbí ohun mìíràn. Ìtumọ̀ yìí pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láì tú u sí ọ̀nà kan ṣoṣo.
- issue: Ohùn ἐγερθῆναι
  choice: a ó jí òun dìde
  alternative: òun yóò jí dìde
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àfaradà. Fífi ẹni tó jí i dìde sílẹ̀ láìdárúkọ pa ìtumọ̀ orísun mọ́, ó sì kò sọ ju ohun tí ẹsẹ náà sọ lọ.
- issue: Bí ἀπό ṣe kan gbogbo àtòjọ ìjìyà àti pípa
  choice: Fi “láti ọ̀dọ̀” mọ́ ìjìyà ní pàtó, kí àkọsílẹ̀ ìsàlẹ̀ ojú ewé sì sọ pé ó tún lè kan pípa.
  alternative: Túmọ̀ ọ́ pé gbogbo ìjìyà àti pípa wá láti ọwọ́ àwọn aṣáájú náà.
  rationale: Ìṣètò Gíríìkì lè jẹ́ kí gbolohun ἀπό náà ní ìbáṣepọ̀ pẹ̀lú ìjìyà àti pípa lápapọ̀. A kò gbọdọ̀ fi àìdánilójú èdè yìí pamọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Òun” mú kí ẹni tí gbogbo àwọn ọ̀rọ̀ dandan náà ń tọ́ka sí ṣe kedere, “a ó” sì jẹ́ ọ̀nà àdánidá láti pa àfaradà mọ́ láìdárúkọ aṣojú ìṣe. Àwọn àmì àlàyé [a], [b], [c] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
