    rationale: Ó ṣe kedere, ṣùgbọ́n “ó”/“á” nínú ìtẹ̀síwájú gbólóhùn jẹ́ àdánidá sí i ní Yorùbá, láì sọ ìtumọ̀ di aláìlójú.
