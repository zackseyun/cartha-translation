  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtòlẹ́sẹẹsẹ pàtàkì ti Gíríìkì mọ́: ìbẹ̀rẹ̀ ìtọ́ni tuntun, dandan náà, lílọ sí Jerúsálẹ́mù, ìjìyà, pípa, àti jíjí dìde ní ọjọ́ kẹta. Síbẹ̀, “ohun púpọ̀” kì í ṣe ọ̀nà Yorùbá tí ó rọrùn tàbí tí ó ṣe kedere ní àyíká “jìyà”; “ọ̀pọ̀ nǹkan” dára sí i. Àmì àlàyé [b] tún nílò kí a gbe e sí ibì kan tí ó so mọ́ ἀπό/láti ọ̀dọ̀, kì í ṣe sí “pa á.”'
  naturalness: Àtúnṣe náà yọ ìlò “òun” tí a tún léraléra kúrò, ó sì lo “ó” àti “á” ní ọ̀nà Yorùbá ìgbàlódé tó ní iyì. “Jìyà ọ̀pọ̀ nǹkan” jẹ́ ìtumọ̀ tí ó dára ju “jìyà ohun púpọ̀” lọ, nígbà tí ó ṣì ń pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́.
  terminology: “Àwọn àgbààgbà,” “àwọn olórí àlùfáà,” àti “àwọn akọ̀wé” jẹ́ àwọn ọ̀rọ̀ tó bójú mu fún àwọn ẹgbẹ́ aṣáájú Júù wọ̀nyí. “A ó jí i dìde” pa ohùn àfaradà ἐγερθῆναι mọ́ láìdárúkọ ẹni tó ṣe ìṣe náà.
  issues:
