id: MAT.16.25
reference: Matthew 16:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá fẹ́ gba ìyè rẹ̀ là yóò pàdánù rẹ̀; ṣùgbọ́n ẹnikẹ́ni tí ó bá pàdánù ìyè rẹ̀ nítorí mi yóò rí i.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Nítorí ẹnikẹ́ni tí ó bá ...; ṣùgbọ́n ẹnikẹ́ni tí ó bá ...
  rationale: Àkójọpọ̀ ọ̀rọ̀ ìbátan pẹ̀lú ἐὰν/ἂν ń sọ ipò gbogbogbò tí kò dá lórí ẹni kan pàtó; “ẹnikẹ́ni tí ó bá” ni ọ̀nà Yorùbá àdánidá láti sọ ọ́. “Nítorí” pa ìsopọ̀ γάρ mọ́ pẹ̀lú ẹsẹ tó ṣáájú, “ṣùgbọ́n” sì fi ìtakora δέ hàn.
- source_word: θέλῃ
  choice: fẹ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìfẹ́-inú tàbí ohun tí ẹni kan pinnu láti ṣe; “fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá àyíká mu.
- source_word: ψυχὴν
  choice: ẹ̀mí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ψυχή ń tọ́ka sí ìyè ẹni—ẹni náà gẹ́gẹ́ bí alààyè—nínú àfiwé fífi í pamọ́, pípàdánù rẹ̀, àti rírí i. “Ẹ̀mí” bá àsọyé Yorùbá “gba ẹ̀mí là” àti “pàdánù ẹ̀mí” mu, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ tó gbòòrò ti ọ̀rọ̀ Gíríìkì náà hàn.
- source_word: σῶσαι
  choice: gba ... là
  rationale: “Gba ... là” ni ọ̀nà Yorùbá àdánidá fún fífi ìyè pamọ́ tàbí yíyọ ẹnì kan kúrò nínú ewu, ó sì pa ìtakora rẹ̀ pẹ̀lú “pàdánù” mọ́.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: yóò pàdánù / bá pàdánù
  rationale: Ní àyíká yìí, ἀπόλλυμι túmọ̀ sí pípàdánù ìyè, kì í ṣe dandan píparun rẹ̀ pátápátá. “Yóò pàdánù” pa ọ̀rọ̀ ọjọ́ iwájú ti gbólóhùn àkọ́kọ́ mọ́; “tí ó bá pàdánù” sì bá ìṣètò ipò gbogbogbò ti gbólóhùn kejì mu.
- source_word: ἕνεκεν ἐμοῦ
  choice: nítorí mi
  rationale: Gbólóhùn yìí sọ ìdí tàbí ohun tó mú kí ẹni náà ṣe bẹ́ẹ̀. “Nítorí mi” jẹ́ kíkún, àdánidá, ó sì pa ìfaradà nítorí Jésù mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: εὑρήσει
  choice: yóò rí i
  rationale: “Rí” ni ìtumọ̀ tààrà ti εὑρίσκω, ó sì pa àdììtú alágbára tó wà láàárín pípàdánù ẹ̀mí àti rírí i mọ́, dípò ṣíṣe àlàyé rẹ̀ sí “jèrè.”
- source_word: αὐτοῦ / αὐτήν
  choice: rẹ̀ / rẹ̀ / i
  rationale: Yorùbá kò nílò àmì akọ tàbí abo nínú arọ́pò-orúkọ yìí. “Rẹ̀” ń tọ́ka sí ẹnikẹ́ni náà, “i” sì ń tọ́ka padà sí ẹ̀mí tí a mẹ́nu kàn.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú àdììtú nípa jíjẹ́ ọmọ-ẹ̀yìn
  choice: ẹ̀mí, pẹ̀lú ìtumọ̀ pàtàkì ti ìyè ẹni nínú àyíká yìí
  alternative: ìyè; ara ẹni; ọkàn
  rationale: Àyíká fífi ìyè ẹni sílẹ̀ nítorí Jésù mú kí ìtumọ̀ “ìyè” ṣe pàtàkì jù, ṣùgbọ́n ψυχή lè ní ìtumọ̀ tó gbòòrò ju ìyè ara nìkan lọ. “Ẹ̀mí” ṣiṣẹ́ lọ́nà àdánidá nínú àwọn gbólóhùn Yorùbá tó wà níbí, àlàyé ìsàlẹ̀ sì dènà fífi ọ̀rọ̀ náà mọ́ ìtumọ̀ ẹ̀mí aláìlérò ara nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìṣọ̀kan ọ̀rọ̀ “ẹ̀mí” àti àdììtú “pàdánù ... rí” mọ́.
