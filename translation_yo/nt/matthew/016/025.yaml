    text: Ọ̀rọ̀ Gíríìkì náà, psychē, tí a túmọ̀ sí “ìyè” ní gbogbo ẹsẹ yìí, tún lè túmọ̀ sí “ẹ̀mí” tàbí “ara ẹni,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
