review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the general conditional structure, future results, contrast, and the causal phrase “for my sake.” However, rendering ψυχή primarily as “ẹ̀mí” obscures its contextual sense of one’s life in the save/lose/find paradox. The source and English audit appropriately give “life” priority while retaining “soul” as an alternative.
  naturalness: The syntax is clear and idiomatic Standard Yoruba. “Gba ìyè rẹ̀ là,” “pàdánù ìyè rẹ̀,” and “yóò rí i” are natural and preserve the compact paradox.
  terminology: Use “ìyè” in the text for ψυχή in this context. Retain “ẹ̀mí” in the footnote as the principal lexical alternative; “ọkàn” is not needed here, since it can suggest ‘heart/mind’ rather than the intended alternative.
  issues:
  - severity: medium
    issue: ψυχή is rendered “ẹ̀mí” in the main text.
    rationale: In this discipleship saying, ψυχή most directly denotes a person’s life, as shown by the paired actions of saving, losing, and finding it. “Ẹ̀mí” may be understood more narrowly as spirit/soul and therefore changes the contextual emphasis.
  - severity: low
    issue: The footnote includes “ọkàn” as an alternative.
    rationale: Although psychē has a broad semantic range, “ọkàn” commonly denotes heart or inner mind in Yoruba and is not a necessary or especially clear alternative in this verse.
  revised_text: Nítorí ẹnikẹ́ni tí ó bá fẹ́ gba ìyè rẹ̀ là yóò pàdánù rẹ̀; ṣùgbọ́n ẹnikẹ́ni tí ó bá pàdánù ìyè rẹ̀ nítorí mi yóò rí i.
  revised_footnotes:
