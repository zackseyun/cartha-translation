revisions:
- from: Nítorí ẹnikẹ́ni tí ó bá fẹ́ gba ẹ̀mí rẹ̀ là[a] yóò pàdánù rẹ̀; ṣùgbọ́n ẹnikẹ́ni tí ó bá pàdánù ẹ̀mí rẹ̀ nítorí mi yóò rí i.
  to: Nítorí ẹnikẹ́ni tí ó bá fẹ́ gba ìyè rẹ̀ là yóò pàdánù rẹ̀; ṣùgbọ́n ẹnikẹ́ni tí ó bá pàdánù ìyè rẹ̀ nítorí mi yóò rí i.
  rationale: 'The revision gives ψυχή its contextually primary sense, “ìyè,” while preserving the source’s repeated term and paradoxical sequence: save life, lose it; lose life for Jesus’ sake, find it. The footnote preserves the significant ‘soul/spirit’ alternative without making it the main reading.'
  reviewer_model: gpt-5.6-terra
