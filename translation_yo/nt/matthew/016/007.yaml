  register: Yorùbá ìpele àárín, tó bójú mu, tó sì ṣeé yé fún òǹkàwé òde òní. A pa ìsọ̀rí ọ̀rọ̀ Gíríìkì mọ́ láìfi “Nítorí pé” kún un; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
