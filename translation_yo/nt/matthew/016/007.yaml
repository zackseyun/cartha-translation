  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ àkọ́kọ́ dáadáa ní ọ̀pọ̀ apá: “Wọ́n sì” bá δέ mu, ìṣe tí ń tẹ̀síwájú wà, a sì pa ọ̀rọ̀ “A kò mú búrẹ́dì …” mọ́ láìfi ìdí kan tí kò sí nínú Gíríìkì kún un. Síbẹ̀, “ń bá ara wọn sọ̀rọ̀” lè kan ìbánisọ̀rọ̀ lasán; διελογίζοντο túmọ̀ sí ìjíròrò/ìrònúpọ̀ tí ń lọ láàárín wọn. “ń jíròrò láàárín ara wọn” mú ìyẹn hàn kedere. “mú … dání” tún sún mọ́ ‘take along’ ju “mú … wá,” tí ó ní ìtọ́ka ìwá-sí-ibi kan tí Gíríìkì kò sọ, lọ.'
