  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: yo
  text: Wọ́n sì ń jíròrò láàárín ara wọn pé, “A kò mú búrẹ́dì dání.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A kò mú búrẹ́dì wá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti fi hàn ní Yorùbá.
- source_word: διελογίζοντο
  choice: ń bá ara wọn sọ̀rọ̀
  rationale: Àkókò imperfect fi ìjíròrò tí ń lọ lọ́wọ́ hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìjíròrò láàárín wọn.
- source_word: ἐν ἑαυτοῖς
  choice: ara wọn
  rationale: Ó fi hàn pé ìjíròrò náà wà láàárín àwọn ọmọ-ẹ̀yìn fúnra wọn, kì í ṣe ọ̀rọ̀ tí wọ́n ń sọ fún gbogbo ènìyàn.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá, “pé” ń ṣàgbékalẹ̀ ohun tí wọ́n sọ lọ́nà àdánidá, láìní láti tún “wọ́n ń sọ” ṣe.
- source_word: Ἄρτους
  choice: búrẹ́dì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀, ó ń tọ́ka sí búrẹ́dì gẹ́gẹ́ bí oúnjẹ ìrìn-àjò; “búrẹ́dì” ló mọ́gbọ́n dání jù ní Yorùbá òde òní.
- source_word: οὐκ ἐλάβομεν
  choice: A kò mú … wá
  rationale: λαμβάνω lè túmọ̀ sí “mú” tàbí “gbà,” ṣùgbọ́n ní àyíká ìrìn-àjò ó túmọ̀ sí mímú ohun kan dání lọ; “mú … wá” sọ èrò náà ní Yorùbá àdánidá.
