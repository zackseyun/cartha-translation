id: MAT.16.14
reference: Matthew 16:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: yo
  text: Wọ́n sì wí pé, “Àwọn kan ní Johanu Onítẹ̀bọmi ni, àwọn mìíràn ní Elijah ni, àwọn mìíràn sì ní Jeremiah tàbí ọ̀kan lára àwọn wòlíì.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, láti sọ ọ́ ní kedere: “Àwọn kan ní ìwọ ni Johanu Onítẹ̀bọmi, àwọn mìíràn ní Elijah, àwọn mìíràn sì ní Jeremiah tàbí ọ̀kan lára àwọn wòlíì.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì wí pé
  rationale: δέ ń so ìdáhùn náà pọ̀ mọ́ ìtàn tó ṣáájú láìfi ìtakò líle kún un; ‘wí pé’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún ọ̀rọ̀ tí a ròyìn.
- source_word: Οἱ μὲν
  choice: Àwọn kan ní
  rationale: μέν bẹ̀rẹ̀ pípín àwọn èrò sí ìsọ̀rí; ‘àwọn kan ní’ jẹ́ èdè Yorùbá àdánidá, ó sì jẹ́ kí ẹni tí wọ́n ń dá mọ̀ dúró ní àfojúsùn gẹ́gẹ́ bí Gíríìkì.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Johanu Onítẹ̀bọmi
  rationale: ‘Johanu’ ni orúkọ Bíbélì Yorùbá tí a mọ̀, ‘Onítẹ̀bọmi’ sì ṣàfihàn ipa βαπτιστής gẹ́gẹ́ bí ẹni tí ń ṣe ìtẹ̀bọmi.
- source_word: ἄλλοι δὲ
  choice: àwọn mìíràn ní
  rationale: Ó ń tẹ̀ síwájú nínú pípín àwọn ìdáhùn sí ìsọ̀rí; àtúnṣe ‘ní’ mú àkójọ náà ṣe kedere ní Yorùbá láìfi ìtakò tí kò sí kún un.
- source_word: Ἠλίαν
  choice: Elijah
  rationale: A lo ìrísí orúkọ náà tí ó wọ́pọ̀ ní Yorùbá òde òní, pẹ̀lú ìtọ́kasí sí wòlíì Majẹmu Láéláé.
- source_word: ἕτεροι δὲ
  choice: àwọn mìíràn sì ní
  rationale: ἕτεροι ń fi ẹgbẹ́ mìíràn kún àkójọ; ‘sì’ ń jẹ́ kí ìtẹ̀síwájú náà dán mọ́rán ní Yorùbá.
- source_word: Ἰερεμίαν
  choice: Jeremiah
  rationale: A lo ìrísí orúkọ Bíbélì tí ó wọ́pọ̀, láìfi ìtumọ̀ míràn kún orúkọ náà.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: tàbí ọ̀kan lára àwọn wòlíì
  rationale: ‘tàbí’ pa ìyàn mìíràn mọ́ gẹ́gẹ́ bí ἤ, ‘ọ̀kan lára’ sì bá ἕνα τῶν mu láìfi ‘mìíràn’ tí kò hàn gbangba nínú Gíríìkì kún un.
theological_decisions:
- issue: Ẹni tí àwọn ìdánimọ̀ náà ń tọ́ka sí
  choice: 'A fi ẹni náà sí àfojúsùn nínú ẹsẹ yìí: ‘Àwọn kan ní Johanu Onítẹ̀bọmi ni…’'
  alternative: ‘Àwọn kan ní ìwọ ni Johanu Onítẹ̀bọmi…’
  rationale: Gíríìkì ṣe àkójọ àwọn ìdánimọ̀ náà ní ọ̀nà àkùdé, ó sì gbẹ́kẹ̀ lé ìbéèrè Jesu nínú ẹsẹ tó ṣáájú. Yorùbá lè pa àkùdé yìí mọ́ ní ti ara láìsọ pé ‘ìwọ ni.’
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. Àkójọ náà ní ìṣàn ọ̀rọ̀ àdánidá; a sì pa àkùdé Gíríìkì mọ́ nínú ọ̀rọ̀ pàtàkì, nígbà tí àlàyé tó péye sí i wà nínú àkọsílẹ̀ ìsàlẹ̀.
