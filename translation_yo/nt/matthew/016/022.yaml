id: MAT.16.22
reference: Matthew 16:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: yo
  text: Pétérù sì mú un lọ sí ẹ̀gbẹ́ kan, ó sì bẹ̀rẹ̀ sí í bá a wí pé, “Kí ó má ṣe rí bẹ́ẹ̀ sí ọ, Olúwa![a] Èyí kò ní ṣẹlẹ̀ sí ọ láéláé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àkànlò èdè Gíríìkì níbí kúkúrú ni, ìtumọ̀ rẹ̀ kò sì pé ní ojú ọ̀rọ̀. A tún lè tú u sí, “Kí Ọlọ́run ṣàánú rẹ, Olúwa!” tàbí “Kí Ọlọ́run má ṣe jẹ́, Olúwa!”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: fà á sẹ́gbẹ̀ẹ́ kan
  rationale: Ọ̀rọ̀ yìí fi hàn pé Pétérù fa Jésù sọ́dọ̀ ara rẹ̀ ní ìkọ̀kọ̀; gbólóhùn Yorùbá yìí mú ìtumọ̀ pé ó mú un kúrò níwájú àwọn ẹlòmíràn jáde.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: bẹ̀rẹ̀ sí í bá a wí
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ inú ἤρξατο mọ́, “bá a wí” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìbániwí líle.
- source_word: Ἵλεώς σοι
  choice: Kí ó má rí bẹ́ẹ̀ fún ọ
  rationale: Èyí pa àdúrà tàbí ìfẹ́ pé kí ohun tí a sọ má ṣẹlẹ̀ mọ́ láìfi “Ọlọ́run” kún ọ̀rọ̀ Gíríìkì, nítorí orúkọ Ọlọ́run kò fara hàn ní tààrà nínú rẹ̀.
- source_word: κύριε
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κύριος, ó sì pa ọ̀wọ̀ tí Pétérù fi ń bá Jésù sọ̀rọ̀ àti ìró Kristọ́lójì inú ìwé náà mọ́.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Èyí kò ní ṣẹlẹ̀ sí ọ láéláé
  rationale: “Kò ní … láéláé” mú ìkọ̀ tí a tẹnumọ́ gidigidi nínú οὐ μή pẹ̀lú ọ̀rọ̀ ọjọ́ iwájú jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa tú àtakò Pétérù láìfi ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un
  choice: Kí ó má rí bẹ́ẹ̀ fún ọ, Olúwa!
  alternative: Kí Ọlọ́run má jẹ́, Olúwa! / Kí Ọlọ́run ṣàánú rẹ, Olúwa!
  rationale: Ἵλεώς σοι jẹ́ àkànlò èdè kúkúrú tí ìtumọ̀ rẹ̀ kò pé ní ojú ọ̀rọ̀. Àṣàyàn àkọ́kọ́ pa àtakò àti ìfẹ́ Pétérù pé kí ohun náà má ṣẹlẹ̀ mọ́, ṣùgbọ́n kò sọ “Ọlọ́run” ní kedere níbi tí Gíríìkì kò ti ṣe bẹ́ẹ̀. Àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. “Fà á sẹ́gbẹ̀ẹ́ kan” àti “bá a wí” jẹ́ àdánidá ju títú ọ̀rọ̀ Gíríìkì lẹ́yọ-ọ̀rọ̀ lọ; a sì fi àmì ohùn síbi tí ó yẹ.
