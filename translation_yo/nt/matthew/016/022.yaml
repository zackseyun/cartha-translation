  source_fidelity: 'Ìtumọ̀ náà ṣàfihàn gbogbo àwọn èrò pàtàkì nínú Gíríìkì: Pétérù mú Jésù kúrò lọ́tọ̀, ó bẹ̀rẹ̀ sí í bá a wí, ó sọ àtakò rẹ̀ ní ọ̀rọ̀ àkànlò, ó sì lo ìkọ̀ tó lágbára fún ohun tí kò ní ṣẹlẹ̀. Síbẹ̀, “fà á sẹ́gbẹ̀ẹ́ kan” lè ní ìró fífi agbára fà ẹni kan, níbi tí προσλαβόμενος ní àyíká ọ̀rọ̀ yìí dára jù lọ gẹ́gẹ́ bí mímú un lọ sọ́tọ̀. A tún nílò láti ṣàtúnṣe ọ̀kan nínú àwọn àṣàyàn ìsàlẹ̀ ojú ewé kí Yorùbá rẹ̀ péye.'
