id: MAT.16.4
reference: Matthew 16:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: yo
  text: “Ìran búburú tí ó sì ń ṣe panṣágà[a] ń wá àmì kan, ṣùgbọ́n a kì yóò fi àmì kankan fún un bí kò ṣe àmì Jónà[b].” Ó sì fi wọ́n sílẹ̀, ó lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìran aláìṣòótọ́.” Gíríìkì sọ ní tààrà pé “tí ń ṣe panṣágà,” ó sì ṣeé ṣe kí èyí máa rántí èdè àwọn wòlíì nípa àìṣòótọ́ sí májẹ̀mú.
    reason: lexical_alternative
  - marker: b
    text: Mátíù 12:39–40 ṣàlàyé “àmì Jónà” nípa ọjọ́ mẹ́ta àti òru mẹ́ta Jónà, ó sì fi àpẹẹrẹ náà wé ohun tí yóò ṣẹlẹ̀ sí Ọmọ Ènìyàn.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: Ìran
  rationale: “Ìran” jẹ́ ọ̀rọ̀ Yorùbá tó bá γενεά mu níbí, ó sì ń tọ́ka sí àwùjọ àwọn ènìyàn ìgbà náà láì sọ ọ́ di “àwọn ènìyàn” lásán.
- source_word: πονηρὰ
  choice: búburú
  rationale: “Búburú” fi ìbàjẹ́ ìwà tí πονηρά ń sọ hàn ní èdè Yorùbá tó ṣe déédéé.
- source_word: μοιχαλὶς
  choice: tí ó sì ń ṣe panṣágà
  rationale: Gbólóhùn yìí pa àwòrán panṣágà inú Gíríìkì mọ́, ó sì lè gbé ìtumọ̀ àìṣòótọ́ sí Ọlọ́run gẹ́gẹ́ bí èdè àwọn wòlíì láì fi ìtumọ̀ yẹn rọ́pò àwòrán náà.
- source_word: σημεῖον
  choice: àmì
  rationale: “Àmì” jẹ́ ìtumọ̀ tààrà tó sì ṣàn ní Yorùbá; a kò fi “iṣẹ́ ìyanu” kún un nítorí Gíríìkì kò sọ ọ́ ní pàtó.
- source_word: ἐπιζητεῖ
  choice: ń wá
  rationale: “Ń wá” sọ ìṣe wíwá àmì náà ní tààrà, nígbà tí àyíká ọ̀rọ̀ ń fi ìpinnu búburú wọn hàn.
- source_word: δοθήσεται
  choice: a kì yóò fi ... fún un
  rationale: Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ̀rọ̀ ìṣe aláìlórúkọ ọjọ́ iwájú δοθήσεται.
- source_word: αὐτῇ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò ẹyọ “un” padà tọ́ka sí “ìran” gẹ́gẹ́ bí odindi kan.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: “Bí kò ṣe” fi hàn pé àmì Jónà nìkan ni a yọ sílẹ̀ gẹ́gẹ́ bí àfiwé.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: àmì Jónà
  rationale: Ìtumọ̀ yìí pa ìsopọ̀ oníṣẹ̀lẹ̀ inú Gíríìkì àti àìdánilójú ohun tí gbólóhùn náà ń tọ́ka sí mọ́.
- source_word: καταλιπὼν
  choice: fi wọ́n sílẹ̀
  rationale: Ó sọ pé Jesu kọ̀ wọ́n sílẹ̀ ṣáájú kí ó tó lọ, ní ọ̀nà Yorùbá tó rọrùn.
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: “Ó lọ” jẹ́ ọ̀nà Yorùbá kedere, àdánidá fún ìkúrò rẹ̀ níbẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “ìran ... tí ń ṣe panṣágà”
  choice: Pa àwòrán panṣágà mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: “Ìran aláìṣòótọ́”
  rationale: Àwòrán náà lè rántí èdè àwọn wòlíì nípa àìṣòótọ́ sí májẹ̀mú, ṣùgbọ́n μοιχαλίς fúnra rẹ̀ lo àwòrán panṣágà. Dídá a sílẹ̀ bẹ́ẹ̀ ń pa agbára àti ìfòyemọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Ìtumọ̀ “àmì Jónà”
  choice: Pa gbólóhùn náà mọ́ láì ṣàlàyé rẹ̀ nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ikú àti àjíǹde Jesu.
  rationale: Mátíù 12:39–40 ṣàlàyé àpẹẹrẹ Jónà síwájú sí i, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ ọ́ ní ṣókí. Nítorí náà, a kò fi àlàyé ẹsẹ mìíràn kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Tí ó sì ń ṣe panṣágà” jẹ́ àdánidá ju lílo “panṣágà” gẹ́gẹ́ bí ajẹtífù lọ, ó sì pa àwòrán Gíríìkì mọ́. Ìtòlẹ́sẹẹsẹ gbólóhùn kejì jẹ́ kúkúrú láti fara mọ́ ìyára ọ̀rọ̀ orísun.
