id: MAT.16.16
reference: Matthew 16:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: yo
  text: Símónì Pétérù sì dáhùn pé, “Ìwọ ni Mèsáyà[a], Ọmọ Ọlọ́run alààyè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Oye Gíríìkì Χριστός lè jẹ́ “Kristi”; níhìn-ín a túmọ̀ rẹ̀ sí “Mèsáyà” láti fi hàn pé oyè ni, àti láti pa àyíká ìrètí Mèsáyà àwọn Júù mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: dáhùn pé
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà ìbánisọ̀rọ̀ tí ó túmọ̀ sí pé ẹni náà fèsì. “Dáhùn pé” jẹ́ Yorùbá àdánidá, ó sì yẹra fún àtúnwí líle bí “dáhùn, ó sì wí.”
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú pẹ̀lú ìyípadà kékeré sí ìdáhùn Pétérù; “sì” mú ìṣàn yìí jáde láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: Σίμων Πέτρος
  choice: Símónì Pétérù
  rationale: A kọ orúkọ ẹni náà ní ìrísí tí ó wọ́pọ̀, tí ó sì bá ìró èdè Yorùbá mu.
- source_word: Σὺ
  choice: Ìwọ
  rationale: Arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì, ó sì ní ìtẹnumọ́; fífi “Ìwọ” sí iwájú gbólóhùn pa ìtẹnumọ́ náà mọ́.
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níhìn-ín, kì í ṣe apá kan orúkọ ẹni. “Mèsáyà” pa ìtumọ̀ oyè ẹni tí Ọlọ́run fòróró yàn àti àyíká ìrètí àwọn Júù mọ́.
- source_word: ὁ υἱός
  choice: Ọmọ
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè pàtó. Nínú àkójọpọ̀ “Ọmọ Ọlọ́run,” ìdánimọ̀ pàtó náà ṣe kedere ní Yorùbá láìfi ọ̀rọ̀ àfikún kún un.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: Ọlọ́run alààyè
  rationale: “Ọlọ́run alààyè” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa àpèjúwe attributive Gíríìkì mọ́.
theological_decisions:
- issue: Ṣíṣe Χριστός bí oyè tàbí bí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ìjẹ́wọ́ Pétérù, Χριστός jẹ́ oyè Mèsáyà. A lo “Mèsáyà” nínú ọ̀rọ̀, a sì fi “Kristi” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó ti wọ́pọ̀.
- issue: Ìtumọ̀ oyè “Ọmọ Ọlọ́run”
  choice: Ọmọ Ọlọ́run alààyè
  alternative: —
  rationale: A pa ọ̀rọ̀ ìjẹ́wọ́ àti oyè inú Gíríìkì mọ́ láìṣàlàyé rẹ̀ síwájú pẹ̀lú àgbékalẹ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ òde òní, ó ní ọlá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tí ó bá ṣe àdánidá; àwọn orúkọ àjèjì ni a ṣe ní ìbámu pẹ̀lú ìró Yorùbá.
