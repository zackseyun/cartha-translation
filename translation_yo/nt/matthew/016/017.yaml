id: MAT.16.17
reference: Matthew 16:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: yo
  text: Jésù sì dá a lóhùn pé, “Alábùkún-fún ni ìwọ, Símónì Bárìónà,[a] nítorí ẹran-ara àti ẹ̀jẹ̀ kò fi èyí hàn ọ́,[b] bí kò ṣe Baba mi tí ń bẹ ní ọ̀run.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Símónì ọmọ Jónà.” Bárìónà jẹ́ ìrísí Árámáíkì tí ń fi baba ẹni hàn, tí a pa mọ́ nínú ọ̀rọ̀ Gíríìkì.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ẹran-ara àti ẹ̀jẹ̀”; àpólà yìí ń tọ́ka sí àwọn ènìyàn tàbí sí orísun tó jẹ́ ti ènìyàn lásán.
    reason: cultural_note
  - marker: c
    text: Ní tààràtà, “ní àwọn ọ̀run”; a lo “ní ọ̀run” gẹ́gẹ́ bí ìlò Yorùbá àdánidá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Jésù sì dá a lóhùn pé
  rationale: Ìtumọ̀ yìí sọ ọ̀rọ̀ Gíríìkì tó túmọ̀ sí ‘dáhùn, ó sì wí fún un’ ní Yorùbá àdánidá, láì tún ọ̀rọ̀ kan náà sọ lọ́nà tí kò pọndandan; ‘sì’ ń bá ìtàn náà lọ.
- source_word: Μακάριος
  choice: Alábùkún-fún ni ìwọ
  rationale: ‘Alábùkún-fún’ pa ìwọ̀n ẹ̀sìn àti ìtẹ́wọ́gbà Ọlọ́run tó wà nínú μακάριος mọ́ ju ọ̀rọ̀ tó kàn túmọ̀ sí ayọ̀ lọ.
- source_word: Σίμων Βαριωνᾶ
  choice: Símónì Bárìónà
  rationale: A ṣe orúkọ méjèèjì ní ìkọ̀wé Yorùbá, a sì pa ìrísí orúkọ baba lédè Árámáíkì tí Gíríìkì fi pamọ́ mọ́; àlàyé ìsàlẹ̀ ojú ìwé sọ ìtumọ̀ rẹ̀.
- source_word: ὅτι
  choice: nítorí
  rationale: Níhìn-ín ὅτι ń fi ìdí tí Jésù fi pe Símónì ní alábùkún-fún hàn.
- source_word: σὰρξ καὶ αἷμα
  choice: ẹran-ara àti ẹ̀jẹ̀
  rationale: A pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, èyí tí ó ń tọ́ka sí ènìyàn tàbí orísun tó jẹ́ ti ènìyàn lásán; àlàyé ìsàlẹ̀ ojú ìwé ń mú ìtumọ̀ àṣà rẹ̀ ṣe kedere.
- source_word: ἀπεκάλυψέν σοι
  choice: kò fi èyí hàn ọ́
  rationale: ‘Fi ... hàn’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣípayá tàbí mímú ohun tí a kò mọ̀ di mímọ̀. ‘Èyí’ ń tọ́ka sí ìjẹ́wọ́ Símónì nínú ẹsẹ tó ṣáájú, bí ó tilẹ̀ jẹ́ pé ohun tí ọ̀rọ̀-ìṣe náà ń ṣe sí kò fara hàn gbangba nínú Gíríìkì.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: bí kò ṣe Baba mi
  rationale: Ọ̀rọ̀ yìí fi ìyàtọ̀ tó lágbára hàn láàárín orísun ènìyàn àti Baba gẹ́gẹ́ bí orísun ìṣípayá náà.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: tí ń bẹ ní ọ̀run
  rationale: Ó tẹ̀lé ìtumọ̀ ‘ẹni tí ó wà ní àwọn ọ̀run’ ní Yorùbá tó ṣe déédé, ní lílo ‘ọ̀run’ ní ẹyọ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Orísun ìjẹ́wọ́ Símónì
  choice: A pa ìyàtọ̀ mọ́ láàárín orísun ènìyàn lásán (‘ẹran-ara àti ẹ̀jẹ̀’) àti ìṣípayá láti ọ̀dọ̀ Baba.
  alternative: Kí a túmọ̀ ‘ẹran-ara àti ẹ̀jẹ̀’ sí èrò Símónì fúnra rẹ̀ nìkan, tàbí sí olùkọ́ ènìyàn kan pàtó.
  rationale: Àpólà Gíríìkì náà kọ orísun ènìyàn sílẹ̀ ní gbogbogbò, ṣùgbọ́n kò sọ bóyá ó ń tọ́ka pàtó sí ìrònú Símónì tàbí sí olùkọ́ mìíràn. Ìtumọ̀ náà kò fi ipa mú ọ̀kan nínú àwọn ìtumọ̀ tóóró wọ̀nyẹn.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán ‘ẹran-ara àti ẹ̀jẹ̀’ àti orúkọ Bárìónà mọ́, ṣùgbọ́n a ṣàlàyé wọn ní ìsàlẹ̀ ojú ìwé.
