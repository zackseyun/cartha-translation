  register: Yorùbá boṣewa, ẹlẹ́yẹ-ọ̀rọ̀ tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
