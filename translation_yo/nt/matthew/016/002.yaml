  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ gbogbogbò ọrọ̀ Gíríìkì náà dáadáa: ìdáhùn sí àwọn ènìyàn, ọ̀rọ̀ àsọtẹ́lẹ̀ tí wọ́n máa ń sọ, ojú ọjọ́ rere, àti ojú ọ̀run pupa. Ṣùgbọ́n «alẹ́ bá lẹ́» tọ́ka sí ìbẹ̀rẹ̀ òru/dídú, níbi tí ὀψίας γενομένης ti ń tọ́ka sí ìrọ̀lẹ́ tí ó dé; nítorí náà a nílò àtúnṣe kékeré.'
