  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Nígbà tí ìrọ̀lẹ́ bá dé, ẹ máa ń sọ pé, ‘Ojú ọjọ́ yóò dára, nítorí ojú ọ̀run[a] pupa ni.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘ọ̀run’; ṣùgbọ́n nínú ọ̀rọ̀ yìí nípa ojú ọjọ́, ‘ojú ọ̀run’ ni ó bá a mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dá wọn lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà ìṣáájú ọ̀rọ̀ ẹni tí ń fèsì. ‘Ó dá wọn lóhùn pé’ jẹ́ Yorùbá àdánidá tó pa iṣẹ́ rẹ̀ mọ́ láìfi àtúnwí ‘dáhùn ó sì sọ’ kún un.
- source_word: Ὀψίας γενομένης
  choice: Nígbà tí alẹ́ bá lẹ́
  rationale: Ó fi àkókò hàn, ó sì túmọ̀ sí ìgbà tí ìrọ̀lẹ́ dé. Ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì bá ìṣe tí a máa ń ṣe mu.
- source_word: λέγετε
  choice: ẹ máa ń sọ
  rationale: Àmì ìṣe àṣà ‘máa ń’ fi hàn pé èyí ni ohun tí wọ́n sábà ń sọ, gẹ́gẹ́ bí ìtumọ̀ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nínú Gíríìkì níbí.
- source_word: Εὐδία
  choice: Ojú ọjọ́ yóò dára
  rationale: Ọ̀rọ̀ náà tọ́ka sí ojú ọjọ́ rere tàbí tí kò ní ìjì; gbolohun yìí ṣe kedere pé àsọtẹ́lẹ̀ ojú ọjọ́ ni.
- source_word: πυρράζει
  choice: pupa
  rationale: Ó ṣàpèjúwe bí ojú ọ̀run ṣe rí ní àwọ̀ pupa. Yorùbá ‘ojú ọ̀run pupa’ jẹ́ kúkúrú, ó sì jẹ́ àdánidá.
- source_word: οὐρανός
  choice: ojú ọ̀run
  rationale: Ní àyíká ọ̀rọ̀ nípa ojú ọjọ́, ó ń tọ́ka sí ojú ọ̀run tí a ń wò, kì í ṣe ibùgbé Ọlọ́run.
