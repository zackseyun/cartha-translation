  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: yo
  text: Bẹ́ẹ̀ ni ẹ kò rántí ìṣù búrẹ́dì méje fún ẹgbẹ̀rún mẹ́rin ènìyàn[a], àti iye agbọ̀n ńlá tí ẹ kó jọ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ìṣù búrẹ́dì méje ti ẹgbẹ̀rún mẹ́rin ènìyàn.”'
    reason: Ìtumọ̀ míì fún genitive τῶν τετρακισχιλίων; “fún ẹgbẹ̀rún mẹ́rin” ṣàfihàn ìṣẹ̀lẹ̀ jíjẹ àwọn ènìyàn náà ní kedere.
lexical_decisions:
- source_word: οὐδὲ
  choice: Tàbí ẹ kò rántí
  rationale: οὐδὲ ń tẹ̀ síwájú nínú ọ̀wọ́ àwọn ìbéèrè tí Jésù ń béèrè. Ní Yorùbá, “Tàbí ẹ kò rántí” mú ọ̀rọ̀ tí a fi sílẹ̀ nítorí àkótán padà wá láti inú àyíká ẹsẹ tó ṣáájú, ó sì mú kí ìbéèrè náà ṣe kedere láì yí ìtumọ̀ rẹ̀ padà.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ìṣù búrẹ́dì méje
  rationale: ἄρτους túmọ̀ sí àwọn ìṣù búrẹ́dì nínú ìtàn jíjẹ àwọn ènìyàn; “ìṣù búrẹ́dì” pa àwòrán ohun tí a lè kà mọ́.
- source_word: τῶν τετρακισχιλίων
  choice: fún ẹgbẹ̀rún mẹ́rin ènìyàn
  rationale: Genitive náà tọ́ka sí bí a ṣe fi búrẹ́dì náà bọ́ ẹgbẹ̀rún mẹ́rin; “fún” jẹ́ ọ̀nà àdánidá láti sọ ìbáṣepọ̀ yìí ní Yorùbá, a sì fi “ènìyàn” kún un fún ìmọ̀ kedere.
- source_word: πόσας
  choice: iye
  rationale: πόσας jẹ́ ọ̀rọ̀ ìbéèrè tó ń béèrè nípa iye àwọn agbọ̀n; “iye ... tí” jẹ́ gbólóhùn Yorùbá tó ṣe àdánidá níbí.
- source_word: σπυρίδας
  choice: agbọ̀n ńlá
  rationale: σπυρίς ń tọ́ka sí irú agbọ̀n tó tóbi; “agbọ̀n ńlá” pa ìyàtọ̀ rẹ̀ mọ́ sí κόφινος nínú ìtàn míì.
- source_word: ἐλάβετε
  choice: ẹ kó jọ
  rationale: Nínú àyíká kíkó àjẹkù oúnjẹ jọ, “kó jọ” sọ ìṣe náà ní Yorùbá òde òní tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn. A tún ọ̀rọ̀-ìṣe “ẹ kò rántí” ṣe láti inú ìbéèrè tó ṣáájú nítorí pé Gíríìkì fi í sílẹ̀ gẹ́gẹ́ bí àkótán.
