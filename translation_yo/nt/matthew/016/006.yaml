id: MAT.16.6
reference: Matthew 16:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún wọn pé, “Ẹ ṣọ́ra, kí ẹ sì yẹra fún ìwúkàrà[a] àwọn Farisí àti àwọn Sadusí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “yèèsì.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ìwúkàrà; Jésù lò ó gẹ́gẹ́ bí àpèjúwe, ó sì ṣàlàyé rẹ̀ lẹ́yìn náà nípa ẹ̀kọ́ tàbí ipa àwọn Farisí àti àwọn Sadusí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré tàbí ìyípadà ọ̀rọ̀ hàn láti inú ohun tó ṣáájú; “Ṣùgbọ́n” bá ìṣàn ọ̀rọ̀ mu níbí.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan bá àwọn mìíràn sọ̀rọ̀, ó sì dúró nítòsí ìtumọ̀ Gíríìkì.
- source_word: Ὁρᾶτε
  choice: Ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ ìkìlọ̀ ní àyíká yìí, kì í ṣe àṣẹ láti fi ojú wo nìkan.
- source_word: προσέχετε
  choice: kí ẹ sì yẹra
  rationale: Ó tún ìkìlọ̀ náà mú lágbára. Pẹ̀lú “Ẹ ṣọ́ra,” ó pa àtúnṣe ọ̀rọ̀ méjèèjì mọ́ ní Yorùbá tó ṣe déédéé.
- source_word: ἀπὸ
  choice: fún
  rationale: Pẹ̀lú “yẹra,” Yorùbá àdánidá ń lo “yẹra fún” láti sọ ohun tí a gbọ́dọ̀ ṣọ́ra rẹ̀.
- source_word: ζύμης
  choice: ìwúkàrà
  rationale: “Ìwúkàrà” pa àwòrán àpèjúwe Gíríìkì mọ́, láì fi ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ tàbí ipa sí inú ẹsẹ yìí ṣáájú àlàyé tó tẹ̀ lé.
- source_word: Φαρισαίων
  choice: àwọn Farisí
  rationale: Orúkọ Yorùbá tí a sábà máa ń lò fún ẹgbẹ́ yìí; “àwọn” fi ọ̀pọ̀ hàn.
- source_word: Σαδδουκαίων
  choice: àwọn Sadusí
  rationale: Orúkọ Yorùbá tí a sábà máa ń lò fún ẹgbẹ́ yìí; “àwọn” fi ọ̀pọ̀ hàn.
theological_decisions:
- issue: Agbára àpèjúwe ζύμης
  choice: Pa “ìwúkàrà” mọ́ gẹ́gẹ́ bí àpèjúwe, láì túmọ̀ rẹ̀ sí ẹ̀kọ́ tàbí ipa nínú ọ̀rọ̀ pàtàkì.
  alternative: Túmọ̀ ọ́ ní tààrà sí “ẹ̀kọ́” tàbí “ipa.”
  rationale: Jésù ṣàlàyé àpèjúwe náà lẹ́yìn-ọ̀-rẹyìn nínú àyíká ọ̀rọ̀, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ lo ζύμη. Pípa àpèjúwe náà mọ́ kò jẹ́ kí ìtumọ̀ tó tẹ̀ lé wọ inú ẹsẹ yìí ṣáájú àkókò.
translation_notes:
  register: 'Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A lo ọ̀pọ̀ àṣẹ ọlọ́lá “Ẹ,” a sì pa àtúnṣe ìkìlọ̀ méjì ti Gíríìkì mọ́ ní ọ̀nà àdánidá: “Ẹ ṣọ́ra, kí ẹ sì yẹra.”'
