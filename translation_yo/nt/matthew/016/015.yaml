  yaml_path: translation/nt/matthew/016/015.yaml
  text: He says to them[a], “But who do you say that I am?”
translation:
  language: yo
  text: Ó wí fún wọn pé, “Ṣùgbọ́n ẹ̀yin ńkọ́, ta ni ẹ sọ pé mo jẹ́?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ó sọ
  rationale: Ọ̀rọ̀ náà jẹ́ present historical ní Gíríìkì; Yorùbá sábà máa ń lo ọ̀rọ̀ ìṣe aláìní àmì àsìkò nínú ìtàn, nítorí náà “Ó sọ” jẹ́ àdánidá, ó sì lè bá ìtumọ̀ yìí mu láìfi àsìkò àfikún sí i.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó fi àwọn tí a ń bá sọ̀rọ̀ hàn gẹ́gẹ́ bí ẹni tí ọ̀rọ̀ náà tọ́ sí.
- source_word: Ὑμεῖς
  choice: ẹ̀yin
  rationale: Arọ́pò-orúkọ tí a kọ síta ní Gíríìkì ní ìtẹnumọ́; “ẹ̀yin” tí a yà sọ́tọ̀ lẹ́yìn “ṣùgbọ́n” pa ìyàtọ̀ yẹn mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi èrò àwọn ọmọ-ẹ̀yìn wé èrò àwọn ẹlòmíràn tí a mẹ́nu kàn ṣáájú, ó sì ń fi ìyàtọ̀ hàn.
- source_word: τίνα
  choice: ta ni
  rationale: Ìbéèrè Yorùbá àdánidá fún ẹni tí wọ́n ń dá mọ̀ ni “ta ni,” ó sì bá ipa τίνα gẹ́gẹ́ bí àṣekún ẹni mu.
- source_word: με
  choice: èmi
  rationale: Nínú gbólóhùn Yorùbá “pé èmi jẹ́,” “èmi” ni ẹni tí ọ̀rọ̀ náà dá lé; lílo rẹ̀ tún pa ìtẹnumọ́ ìdánimọ̀ mọ́.
- source_word: λέγετε
  choice: ẹ̀yin ń sọ
  rationale: Ó jẹ́ ọ̀rọ̀ ìṣe present, ẹni kejì ọ̀pọ̀; “ń sọ” fi ìṣe ìṣírò tàbí ìdáhùn wọn lọ́wọ́ hàn ní Yorùbá àdánidá.
- source_word: εἶναι
  choice: pé èmi jẹ́
  rationale: Ilana accusative-and-infinitive ti Gíríìkì ni a sọ di gbólóhùn aláìgbẹ̀sẹ̀ Yorùbá pẹ̀lú “pé,” èyí tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
theological_decisions:
- issue: Ìtẹnumọ́ lórí ìdáhùn àwọn ọmọ-ẹ̀yìn fúnra wọn
  choice: “Ṣùgbọ́n ẹ̀yin, ta ni ẹ̀yin ń sọ pé èmi jẹ́?”
  alternative: “Ṣùgbọ́n ta ni ẹ̀yin ń sọ pé èmi jẹ́?”
  rationale: Gíríìkì kọ Ὑμεῖς síta láti tẹ “ẹ̀yin” mọ́lẹ̀ ní ìyàtọ̀ sí èrò àwọn ènìyàn mìíràn. Atúmọ̀ yìí pa ìtẹnumọ́ náà mọ́ láìfi ohun tí wọ́n máa jẹ́wọ́ ní ẹsẹ tó tẹ̀ lé e kún ọ̀rọ̀ Jesu.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé lasán. A tún “ẹ̀yin” sọ láti ṣàfihàn ìtẹnumọ́ Ὑμεῖς; kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí pé èdè Yorùbá náà lè sọ accusative-and-infinitive náà ní ọ̀nà àdánidá láìsọ ìtumọ̀ rẹ̀ nù.
