id: MAT.16.20
reference: Matthew 16:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: yo
  text: Nígbà náà ni ó pàṣẹ ṣinṣin fún àwọn ọmọ-ẹ̀yìn náà pé kí wọn má sọ fún ẹnikẹ́ni pé òun ni Mèsáyà náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi náà.” Àkọ́lé Gíríìkì Χριστός ni a túmọ̀ sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ mọ́ gẹ́gẹ́ bí àkọ́lé.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn ní ọ̀nà àdánidá nínú èdè Yorùbá.
- source_word: διεστείλατο
  choice: ó pàṣẹ ṣinṣin
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àṣẹ líle tàbí ìtọ́ni tí a tẹnumọ́; ‘pàṣẹ ṣinṣin’ pa agbára àṣẹ náà mọ́ láì fi èrò ewu kún un.
- source_word: τοῖς μαθηταῖς
  choice: fún àwọn ọmọ-ẹ̀yìn náà
  rationale: Àpilẹ̀kọ ọ̀rọ̀ Gíríìkì ń tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn tí a ti mọ̀; ‘náà’ mú ìdánimọ̀ yẹn hàn láì fi ‘rẹ̀’ tí kò sí nínú gbólóhùn kún un.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: pé kí wọn má sọ fún ẹnikẹ́ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún àkóónú àṣẹ tí ó ka gbogbo ènìyàn sí, láìsí ẹni tí a yọ sílẹ̀.
- source_word: ὅτι αὐτός ἐστιν
  choice: pé òun ni
  rationale: ‘Òun’ tọ́ka padà sí Jésù, ó sì bá ìrísí ọ̀rọ̀ ìròyìn lẹ́yìn ‘pé’ mu ní Yorùbá.
- source_word: ὁ χριστός
  choice: Mèsáyà náà
  rationale: Χριστός jẹ́ àkọ́lé níbí, kì í ṣe orúkọ lásán. ‘Mèsáyà’ pa ìtumọ̀ àkọ́lé ẹni àmì-òróró mọ́, ‘náà’ sì ṣàfihàn ìdánimọ̀ pàtó tí àpilẹ̀kọ Gíríìkì ń tọ́ka sí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí àkọ́lé
  choice: Mèsáyà náà
  alternative: Kristi náà
  rationale: Nínú àyíká yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí àkọ́lé Mèsáyà tí a ń retí. Títúmọ̀ rẹ̀ sí ‘Mèsáyà’ jẹ́ kí ìtumọ̀ àkọ́lé náà hàn, dípò kí a kan kọ ọ́ gẹ́gẹ́ bí orúkọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbéléwọ̀n tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
