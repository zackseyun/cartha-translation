id: MAT.16.27
reference: Matthew 16:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: yo
  text: Nítorí Ọmọ Ènìyàn fẹ́rẹ̀ẹ́ wá[a] nínú ògo Baba rẹ̀ pẹ̀lú àwọn áńgẹ́lì rẹ̀, nígbà náà ni yóò sì san ohun tí ó yẹ fún olúkúlùkù gẹ́gẹ́ bí ìṣe rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò wá” tàbí “ń bọ̀ wá.” Gíríìkì sọ pé ó “fẹ́rẹ̀ẹ́ wá,” èyí tí ó pa ìmọ̀lára pé wíwá náà sún mọ́lé mọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ohun tí ó ti ṣe.” Ọ̀rọ̀ Gíríìkì fún “ìṣe” jẹ́ ẹyọ kan, ṣùgbọ́n a lò ó nípa ìṣe tàbí ìhùwàsí olúkúlùkù.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: fẹ́rẹ̀ẹ́ dé
  rationale: Ó pa ìtumọ̀ ohun tí ó sún mọ́lé tàbí tí ó fẹ́ ṣẹlẹ̀ mọ́, dípò kí a sọ ọ́ di ọ̀rọ̀ ọjọ́ iwájú lásán.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń fún ọ̀rọ̀ tó ṣáájú ní ìdí tàbí àlàyé.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ Yorùbá tí a mọ̀ sí orúkọ oyè yìí, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú àwòrán inú Dáníẹ́lì mọ́.
- source_word: ἔρχεσθαι
  choice: dé
  rationale: Nínú àkópọ̀ ‘fẹ́rẹ̀ẹ́ dé,’ ‘dé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ wíwá ẹni kan dé; ó tún pa ìtumọ̀ dídé Ọmọ Ènìyàn mọ́.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: nínú ògo Baba rẹ̀
  rationale: ‘Nínú’ pa ἐν mọ́ gẹ́gẹ́ bí ipò tàbí ìfarahàn tí dídé náà yóò wáyé, ‘Baba rẹ̀’ sì fi ìbáṣepọ̀ genitive hàn.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: pẹ̀lú àwọn áńgẹ́lì rẹ̀
  rationale: Ó túmọ̀ ìbákẹ́gbẹ́ tí μετά pẹ̀lú genitive ń sọ, ó sì pa ọ̀rọ̀ ìní náà mọ́.
- source_word: καὶ τότε
  choice: nígbà náà ni ... sì
  rationale: 'Ìṣètò Yorùbá yìí fi ìtẹ̀síwájú hàn: dídé kọ́kọ́, ìsanpadà lẹ́yìn náà, ó sì pa asopọ̀ καί mọ́.'
- source_word: ἀποδώσει
  choice: yóò san án fún
  rationale: Ó sọ fífún ẹni kọ̀ọ̀kan ní ohun tí ó tọ́ sí i nínú ìdájọ́, láì dín un kù sí èrè rere nìkan.
- source_word: ἑκάστῳ
  choice: olúkúlùkù
  rationale: Ó pa agbára distributive mọ́, ó ń tọ́ka sí ẹnì kọ̀ọ̀kan lọ́tọ̀ọ̀tọ̀.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: gẹ́gẹ́ bí ìṣe rẹ̀
  rationale: ‘Ìṣe’ lè túmọ̀ sí iṣẹ́, ìhùwàsí, tàbí ohun tí ẹni náà ṣe; singular rẹ̀ sì bá πρᾶξιν mu.
theological_decisions:
- issue: Agbára eschatological μέλλει nípa dídé Ọmọ Ènìyàn
  choice: Pa ìmọ̀lára pé dídé náà sún mọ́lé mọ́ pẹ̀lú ‘fẹ́rẹ̀ẹ́ dé.’
  alternative: ‘yóò dé’ tàbí ‘ń bọ̀ wá’
  rationale: Gíríìkì lo μέλλω pẹ̀lú infinitive, èyí tí ó sábà ń fi ohun tí ó sún mọ́lé hàn. Ìtumọ̀ náà kò yẹ kí ó yanjú àríyànjiyàn nípa àkókò nípa fífi ọ̀rọ̀ ọjọ́ iwájú lásán rọ́pò rẹ̀.
- issue: Ìdájọ́ gẹ́gẹ́ bí ìṣe
  choice: ‘yóò san án fún olúkúlùkù gẹ́gẹ́ bí ìṣe rẹ̀’
  alternative: ‘yóò san èrè fún olúkúlùkù gẹ́gẹ́ bí ohun tí ó ṣe’
  rationale: ‘San án fún’ lè ní ìsan rere tàbí ìsan búburú gẹ́gẹ́ bí ohun tó tọ́ sí ẹni náà, nítorí náà kò fi èrè rere nìkan wọ ẹsẹ̀ náà; ‘ìṣe’ sì pa singular àti ìtumọ̀ ìwà tàbí iṣẹ́ ẹni mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. ‘Fẹ́rẹ̀ẹ́ dé’ jẹ́ ọ̀nà àdánidá láti pa ìsúnmọ́ μέλλει mọ́; ‘san án fún’ yàgò fún mímú ìdájọ́ náà di èrè rere nìkan. Àmì ohùn kíkún wà níbi tí ó bá yẹ.
