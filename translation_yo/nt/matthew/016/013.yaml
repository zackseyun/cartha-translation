id: MAT.16.13
reference: Matthew 16:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: yo
  text: Nígbà tí Jésù dé agbègbè Kesaréà Fílípì, ó ń béèrè lọ́wọ́ àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ta ni àwọn ènìyàn ń sọ pé Ọmọ Ènìyàn[a] jẹ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ Ènìyàn” ni ọ̀nà pàtàkì tí Jésù fi máa ń tọ́ka sí ara rẹ̀; àwọn mìíràn lè túmọ̀ rẹ̀ sí “Ẹni Ènìyàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Nígbà tí Jésù dé
  rationale: Aorist participle náà ń ṣètò àkókò ìṣẹ̀lẹ̀ tuntun; “Nígbà tí … dé” jẹ́ Yorùbá àdánidá, ó sì gbé ìtumọ̀ àkókò náà jáde láìfi ọ̀rọ̀ bí “nísinsìnyí” kún orísun.
- source_word: εἰς τὰ μέρη
  choice: agbègbè
  rationale: μέρη níbí túmọ̀ sí ìlú àti ilẹ̀ tó yí i ká, kì í ṣe “àwọn apá” ní ìtumọ̀ gígún.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Kesaríà Fílípì
  rationale: Àkọsílẹ̀ orúkọ ibi náà ní Yorùbá, tí ó pa ìyàtọ̀ rẹ̀ mọ́ kúrò lọ́dọ̀ Kesaríà mìíràn.
- source_word: ἠρώτα
  choice: ó ń béèrè lọ́wọ́
  rationale: Àmì imperfect ní Gíríìkì fi ìṣe tó ń lọ hàn; “ó ń béèrè” pa apá ìtumọ̀ yẹn mọ́.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún μαθητής nínú àwọn Ìhìn Rere.
- source_word: λέγων
  choice: pé
  rationale: Yorùbá máa ń fi “pé” bẹ̀rẹ̀ ọ̀rọ̀ tí a fa yọ; èyí mú ìtumọ̀ participle náà jáde láìjẹ́ kí gbolohun náà le.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι
  choice: Ta ni àwọn ènìyàn ń sọ pé
  rationale: ἄνθρωποι jẹ́ gbogbo ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; “Ta ni … ń sọ pé” jẹ́ ìbéèrè Yorùbá àdánidá.
- source_word: εἶναι
  choice: jẹ́
  rationale: “Jẹ́” ni ọ̀nà Yorùbá tó ṣe kedere láti sọ ìdánimọ̀ ẹni nínú ìbéèrè aláìtàárà yìí.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí pa ìṣètò ọ̀rọ̀ àti ìwọ̀n akọ́lé tó wà nínú Gíríìkì mọ́, ó sì jẹ́ ọ̀nà ìtọ́ka sí ara rẹ̀ tí Jésù sábà máa ń lò.
theological_decisions:
- issue: Ìtumọ̀ ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: “Ọmọ Ènìyàn” pa ìró Dáníẹ́lì 7 àti àìdánilójú tó mọ̀ọ́mọ̀ wà láàárín ọ̀rọ̀ ìtọ́ka sí ènìyàn àti akọ́lé mọ́; “Ẹni Ènìyàn” lè túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “pé” dípò títẹ̀lé λέγων ní ọ̀rọ̀ sí ọ̀rọ̀, kí gbolohun náà lè ṣàn lọ́nà Yorùbá àdánidá.
