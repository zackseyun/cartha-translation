id: MAT.16.24
reference: Matthew 16:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: yo
  text: Nígbà náà ni Jésù sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Bí ẹnikẹ́ni bá fẹ́ wá tẹ̀ lé mi, kí ó sẹ́ ara rẹ̀, kí ó gbé àgbélébùú rẹ̀, kí ó sì máa tẹ̀ lé mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àsìkò tó so ọ̀rọ̀ yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀; ‘Nígbà náà’ jẹ́ èdè Yorùbá àdánidá.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Àwọn ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn tó ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tẹ̀ lé e.
- source_word: Εἴ τις θέλει
  choice: Bí ẹnikẹ́ni bá fẹ́
  rationale: Ó pa ìtumọ̀ àídájú àti ìfẹ́ inú mọ́, ó sì kàn gbogbo ẹni láìka akọ tàbí abo.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: wá tẹ̀ lé mi
  rationale: Ó mú àwòrán jíjẹ́ ọmọ-ẹ̀yìn jáde ní Yorùbá àdánidá, láìfi kàn túmọ̀ sí rírìn lẹ́yìn ẹnì kan.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: kí ó kọ ara rẹ̀ sílẹ̀
  rationale: Ó ṣàfihàn ìpinnu líle láti má ṣe fi ara ẹni àti ìfẹ́ tirẹ̀ ṣe olórí; ó ṣe kedere ju gbolohun tí ó lè dà bí sísọ pé ẹni kò mọ ara rẹ̀ lọ.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: kí ó gbé àgbélébùú rẹ̀
  rationale: ‘Gbé’ níbí túmọ̀ sí gbígbé ohun sókè fún ríru; ‘àgbélébùú’ ni ọ̀rọ̀ Yorùbá tí a fìdí rẹ̀ múlẹ̀ fún σταυρός.
- source_word: ἀκολουθείτω μοι
  choice: kí ó sì máa tẹ̀ lé mi
  rationale: ‘Máa tẹ̀ lé’ fi ìṣe tí ń bá a lọ hàn, gẹ́gẹ́ bí present imperative Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ kíkọ ara ẹni sílẹ̀
  choice: kí ó kọ ara rẹ̀ sílẹ̀
  alternative: kí ó sẹ́ ara rẹ̀
  rationale: Àṣàyàn náà pa ìpè sí ìkọ̀sẹ̀ ara-ẹni mọ́, ṣùgbọ́n ó yẹra fún ìtumọ̀ àìtọ́ pé kí ẹni purọ́ nípa ẹni tí òun jẹ́ tàbí kí ó kórìíra ara rẹ̀.
- issue: Ìbáṣepọ̀ láàárín gbígbé àgbélébùú àti jíjẹ́ ọmọ-ẹ̀yìn
  choice: A pa àwòrán ‘àgbélébùú rẹ̀’ mọ́ láìṣàlàyé rẹ̀ sínú ẹsẹ náà
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìfaradà ìṣòro tàbí ikú
  rationale: Ọ̀rọ̀ Gíríìkì ní àwòrán líle tó lè ní ìfaradà, ìtìjú, àti ikú nínú; pípa àwòrán náà mọ́ ń yẹra fún dídín ìtumọ̀ rẹ̀ kù.
- issue: Ìrísí akọ ẹyọ kan nínú Gíríìkì gẹ́gẹ́ bí aṣojú gbogbo ènìyàn
  choice: ẹnikẹ́ni … kí ó … ara rẹ̀ … rẹ̀
  alternative: ọkùnrin kan … kí ó … ara rẹ̀
  rationale: Àrọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn. Nítorí náà, gbolohun yìí pa ẹyọ kan àti àfojúsùn gbogbo ènìyàn mọ́ láìfi akọ tàbí abo kún orísun.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá èdè. ‘Kí ó sì máa tẹ̀ lé mi’ yàtọ̀ díẹ̀ sí ‘wá tẹ̀ lé mi’ láti fi ìtẹ̀síwájú àṣẹ ìkẹyìn hàn.
