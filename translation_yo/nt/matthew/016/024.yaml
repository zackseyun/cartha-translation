review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, audience, conditional invitation, personal cross, and continuing command to follow are all retained. However, "kí ó kọ ara rẹ̀ sílẹ̀" more naturally suggests abandoning or neglecting oneself and is less exact for ἀπαρνησάσθω ἑαυτόν, ‘deny/disown oneself.’
  naturalness: The Yoruba is clear, reverent, and uses tone marks well. The revised wording below retains its natural modern register while using the established direct expression for self-denial.
  terminology: Jésù, àwọn ọmọ-ẹ̀yìn, àgbélébùú, and tẹ̀ lé are appropriate established Christian Yoruba terms. "Sẹ́ ara rẹ̀" is the more direct equivalent for the key self-denial expression.
  issues:
  - severity: medium
    issue: The rendering “kí ó kọ ara rẹ̀ sílẹ̀” for ἀπαρνησάσθω ἑαυτόν is imprecise.
    rationale: The Greek calls for denying or disowning oneself. “Kọ ara ẹni sílẹ̀” can convey abandoning oneself, which shifts the command’s sense. “Kí ó sẹ́ ara rẹ̀” preserves the source expression without explanatory expansion.
  revised_text: Nígbà náà ni Jésù sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Bí ẹnikẹ́ni bá fẹ́ wá tẹ̀ lé mi, kí ó sẹ́ ara rẹ̀, kí ó gbé àgbélébùú rẹ̀, kí ó sì máa tẹ̀ lé mi.”
