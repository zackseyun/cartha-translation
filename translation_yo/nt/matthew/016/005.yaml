source:
  edition: SBLGNT
  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: yo
  text: Nígbà tí àwọn ọmọ-ẹ̀yìn dé ìhà kejì, wọ́n ti gbàgbé láti mú búrẹ́dì[a] lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, ọ̀rọ̀ náà wà ní ọ̀pọ̀: ‘àwọn ìṣù búrẹ́dì.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Nígbà tí ... dé
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó ṣe déédéé ní Yorùbá, láìsọ ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì nù.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àyíká Ìhìn Rere mu fún àwọn ọmọ-ẹ̀yìn Jésù.
- source_word: εἰς τὸ πέραν
  choice: dé òdìkejì
  rationale: Ó fi ìrìnàjò dé apá kejì hàn ní ọ̀nà àdánidá; a kò fi ‘adágún’ kún un nítorí kò sí nínú ẹsẹ yìí gan-an.
- source_word: ἐπελάθοντο
  choice: wọ́n ti gbàgbé
  rationale: ‘Ti gbàgbé’ fi hàn pé ìgbàgbé náà ti ṣẹlẹ̀ ṣáájú àkókò tí wọ́n dé, gẹ́gẹ́ bí ìtàn náà ṣe ń lọ.
- source_word: ἄρτους
  choice: búrẹ́dì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ (‘àwọn ìṣù búrẹ́dì’), ‘búrẹ́dì’ gẹ́gẹ́ bí orúkọ ohun àìníye jẹ́ èdè Yorùbá àdánidá nínú àyíká yìí.
- source_word: λαβεῖν
  choice: láti mú ... dání
  rationale: Èyí tú ìtumọ̀ mímú oúnjẹ náà bá ara wọn lọ ní ọ̀nà tí ó ṣe kedere, tó sì bá ọ̀rọ̀ Gíríìkì mu.
