  source_fidelity: 'Ìtumọ̀ náà gba ìbáṣepọ̀ gírámà Gíríìkì náà dáadáa: participle náà jẹ́ gbólóhùn àkókò, ‘wọ́n ti gbàgbé’ yẹ fún ἐπελάθοντο nínú ìtàn, àti ‘búrẹ́dì’ jẹ́ ìtumọ̀ àdánidá fún ἄρτους, bí ó tilẹ̀ jẹ́ pé ó wà ní ọ̀pọ̀ nínú Gíríìkì. Àtúnṣe kékeré kan ń mú ọ̀nà ìrìnàjò nínú λαβεῖν hàn ní ìrọ̀rùn ju ‘dání’ lọ.'
