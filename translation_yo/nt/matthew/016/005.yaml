  terminology: ‘Àwọn ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ tó yẹ fún οἱ μαθηταὶ. ‘Búrẹ́dì’ bá ìforúkọsílẹ̀ ìgbàlódé mu. Àlàyé ẹsẹ̀ ìsàlẹ̀ yẹ kí ó sọ kedere pé ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì náà.
