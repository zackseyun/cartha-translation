id: MAT.5.3
reference: Matthew 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: yo
  text: Alábùkún[a] ni àwọn òtòṣì ní ẹ̀mí[b], nítorí pé tiwọn ni ìjọba ọ̀run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “aláyọ̀” tàbí “àwọn tí ipò wọn dára.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ipò rere lábẹ́ ojú rere Ọlọ́run, kì í ṣe ìmọ̀lára ayọ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn òtòṣì ní ẹ̀mí” tún lè túmọ̀ sí “àwọn tí ó jẹ́ òtòṣì nípa tẹ̀mí” tàbí “àwọn tí ó mọ àìní tẹ̀mí wọn.” A pa ìsọ Gíríìkì mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ọ̀nà kan ṣoṣo.
    reason: alternative_reading
  - marker: c
    text: Ní Gíríìkì, “ìjọba àwọn ọ̀run” ni. Èyí jẹ́ ọ̀nà ìsọ tí Mátíù sábà máa ń lò, tí a sì sábà máa ń túmọ̀ sí “ìjọba ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Alábùkún-fún
  rationale: Ọ̀rọ̀ yìí fi ipò rere tí ojú rere Ọlọ́run mú wá hàn, kì í ṣe ìmọ̀lára ayọ̀ lásán. Ó sì bá ọ̀nà tí a sábà ń gbà sọ àwọn ọ̀rọ̀ ìbùkún mu.
- source_word: οἱ πτωχοὶ
  choice: àwọn òtòṣì
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì tí ó ń tọ́ka sí àwọn tí ó wà nínú ipò àìní mọ́, láì dín ìtumọ̀ rẹ̀ kù sí àwọn alágbe nìkan.
- source_word: τῷ πνεύματι
  choice: ní ẹ̀mí
  rationale: Ó pa ọ̀rọ̀ Gíríìkì mọ́ ní ṣókí, ó sì jẹ́ kí ìtumọ̀ rẹ̀ ṣí sílẹ̀ dípò kí a túmọ̀ rẹ̀ ní pàtó sí ìrẹ̀lẹ̀ tàbí mímọ àìní tẹ̀mí ẹni.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó fi hàn ní èdè Yorùbá òde òní pé gbólóhùn tó tẹ̀ lé e ni ìdí ìbùkún náà.
- source_word: αὐτῶν ἐστιν
  choice: tiwọn ni
  rationale: Ìṣètò yìí jẹ́ ti ẹ̀dá Yorùbá, ó tẹnu mọ́ pé ìjọba náà jẹ́ ti ẹgbẹ́ yìí, ó sì pa ìgbà ìsinsìnyí ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἡ βασιλεία
  choice: ìjọba
  rationale: “Ìjọba” jẹ́ ọ̀rọ̀ tí ó yé gbogbo ènìyàn, ó sì lè gbé èrò agbègbè ìjọba àti àṣẹ ọba papọ̀.
- source_word: τῶν οὐρανῶν
  choice: ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì, “ọ̀run” ni ìsọ Yorùbá àdánidá fún gbólóhùn Mátíù yìí.
theological_decisions:
- issue: Ìtumọ̀ “àwọn òtòṣì ní ẹ̀mí”
  choice: A pa gbólóhùn náà mọ́ láì fi àlàyé ìtumọ̀ kan sínú ẹsẹ̀ náà.
  alternative: Àwọn tí ó mọ àìní tẹ̀mí wọn; àwọn onírẹ̀lẹ̀; àwọn tí ó jẹ́ òtòṣì nípa tẹ̀mí.
  rationale: Ọ̀rọ̀ Gíríìkì ní ìtumọ̀ jíjinlẹ̀ tí ó ṣí sí ọ̀nà ju ẹyọ kan lọ. Ṣíṣe àlàyé rẹ̀ nínú ẹsẹ̀ náà yóò yan ìtumọ̀ kan níbi tí orísun kò ti ṣe bẹ́ẹ̀.
- issue: Ìgbà ìsinsìnyí nínú jíjẹ́ tiwọn ti ìjọba
  choice: “tiwọn ni”
  alternative: yóò jẹ́ tiwọn; a ó fi fún wọn.
  rationale: ἐστιν wà ní ìgbà ìsinsìnyí; nítorí náà, a kò yí i padà sí èrè ọjọ́ iwájú nìkan.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìṣètò “Alábùkún-fún ni…” mú ìrísí ọ̀rọ̀ ìbùkún náà hàn, nígbà tí “àwọn òtòṣì ní ẹ̀mí” pa àìṣedéédé ìtumọ̀ orísun mọ́.
