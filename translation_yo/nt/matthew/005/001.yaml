id: MAT.5.1
reference: Matthew 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: yo
  text: Nígbà tí ó rí àwọn ogunlọ́gọ̀ náà, ó gun òkè náà lọ. Nígbà tí ó sì jókòó[a], àwọn ọmọ-ẹ̀yìn rẹ̀ wá sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn tí ó jókòó, àwọn ọmọ-ẹ̀yìn rẹ̀ wá sọ́dọ̀ rẹ̀.” Èdè Gíríkì lo ìṣètò genitive absolute.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Nígbà tí ó rí
  rationale: Aorist participle náà ń sọ ipò àkókò tó yí ọ̀rọ̀-ìṣe pàtàkì ká. ‘Nígbà tí ó rí’ jẹ́ Yorùbá àdánidá, kò sì fi dandan mú un túmọ̀ sí pé ìgbésẹ̀ kejì pẹ́ gan-an lẹ́yìn ìríran náà.
- source_word: δὲ
  choice: —
  rationale: Ẹ̀ka àsopọ̀ onírẹ̀lẹ̀ ni δέ níbí; Yorùbá àdánidá kò nílò kí a fi ọ̀rọ̀ pàtó rọ́pò rẹ̀ ní ìbẹ̀rẹ̀ gbólóhùn.
- source_word: τοὺς ὄχλους
  choice: àwọn ogunlọ́gọ̀ náà
  rationale: ‘Àwọn ogunlọ́gọ̀’ pa ọ̀pọ̀ (plural) inú Giriki mọ́, ó sì tọ́ka sí ọ̀pọ̀ àwùjọ ènìyàn.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ó gun orí òkè náà lọ
  rationale: Ọ̀rọ̀ yìí fi ìlọ sókè sí òkè hàn. ‘Gun orí òkè náà lọ’ jẹ́ Yorùbá tó ṣe kedere, tó sì pa article pàtó náà mọ́ láì sọ pé òkè náà ní orúkọ pàtó.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Nígbà tí ó sì jókòó
  rationale: Genitive absolute náà ń fi ìbáṣepọ̀ àkókò tàbí ipò hàn. ‘Nígbà tí ó sì jókòó’ jẹ́ àdánidá, kò sì mú kí ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ le ju Giriki lọ.
- source_word: προσῆλθαν αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: ‘Tọ̀ ọ́ wá’ túmọ̀ ìsúnmọ́ ẹni náà lọ́nà Yorùbá tó rọrùn, ó sì bá ìṣàn ìtàn mu.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún akẹ́kọ̀ọ́ tàbí olùtẹ̀lé olùkọ́ ní àyíká yìí.
theological_decisions:
- issue: Article pàtó inú τὸ ὄρος
  choice: orí òkè náà
  alternative: orí òkè kan
  rationale: ‘Náà’ pa article Giriki mọ́, ṣùgbọ́n kò fi dandan dá òkè náà mọ̀ gẹ́gẹ́ bí òkè kan tó ní orúkọ pàtó.
- issue: Ìtẹ̀lé àkókò inú καθίσαντος αὐτοῦ
  choice: Nígbà tí ó sì jókòó
  alternative: Lẹ́yìn tí ó jókòó
  rationale: Giriki lè fi àkókò tàbí ipò tó bá ìṣẹ̀lẹ̀ kejì rìn hàn; yíyan ‘nígbà tí’ kò fi ìtẹ̀lé líle tàbí ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìtàn tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A yà gbólóhùn Giriki kan sí méjì fún ìṣàn Yorùbá tó dára.
