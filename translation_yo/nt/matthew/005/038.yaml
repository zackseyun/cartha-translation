base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: yo
  text: 'Ẹ ti gbọ́ pé a sọ pé: “Ojú fún ojú, àti eyín fún eyín.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ ní ọ̀nà gangan pé, “Ojú dípò ojú, àti eyín dípò eyín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ẹ ti gbọ́
  rationale: Ìṣe aorist yìí wà nínú ọ̀rọ̀ ìṣáájú tí Mátíù máa ń lò; ‘Ẹ ti gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ohun tí àwọn olùgbọ́ ti gbà gẹ́gẹ́ bí àṣà tàbí ẹ̀kọ́ hàn.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí wọ́n gbọ́ sílẹ̀, gẹ́gẹ́ bí àsopọ̀ gbólóhùn Yorùbá.
- source_word: ἐρρέθη
  choice: a sọ pé
  rationale: Ó pa ìtumọ̀ aláìlórúkọ ti passive náà mọ́ láìfi ẹni tó sọ ọ́ kún un.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Ojú dípò ojú
  rationale: ‘Dípò’ fi ìtumọ̀ pàṣípààrọ̀ tàbí ohun tí ó dúró ní ipò ohun mìíràn hàn, ó sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ òfin náà mọ́.
- source_word: καὶ
  choice: àti
  rationale: Àsopọ̀ tó rọrùn láàárín àwọn apá méjèèjì.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: eyín dípò eyín
  rationale: Ó tẹ̀ lé ìṣọ̀kan apá àkọ́kọ́, ó sì pa àgbékalẹ̀ òfin tó dọ́gba mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìlànà òfin ìgbẹ̀san tó dọ́gba tí Jésù tọ́ka sí
  choice: Ojú dípò ojú, àti eyín dípò eyín
  alternative: Ojú fún ojú, àti eyín fún eyín
  rationale: ‘Dípò’ tú ἀντί ní kedere gẹ́gẹ́ bí pàṣípààrọ̀ tàbí ìrọ́pò, láìdájọ́ ṣáájú bóyá òfin náà ń béèrè ìgbẹ̀san ní ti gidi tàbí ìjìyà tó bá ìpalára mu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì pa àtúnwí òfin Gíríìkì mọ́.
