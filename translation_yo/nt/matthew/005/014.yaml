  verdict: approve
  source_fidelity: The translation accurately represents the explicit plural address (Ẹ̀yin), the metaphorical identification as “ìmọ́lẹ̀ ayé,” and the impossibility stated by οὐ δύναται. “Ìlú tí ó wà lórí òkè kò lè farapamọ́” naturally conveys a city situated on an elevation that cannot be hidden. Although κειμένη is more specifically “lying/situated,” “tí ó wà” is an appropriately restrained and idiomatic rendering for a city.
  naturalness: The wording is clear, modern Standard Yorùbá with appropriate tone marking. “Ìmọ́lẹ̀ ayé” and “lórí òkè” are idiomatic and preserve the compact proverbial register. “Farapamọ́” is natural in this context.
