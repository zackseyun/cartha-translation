id: MAT.5.14
reference: Matthew 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: yo
  text: Ẹ̀yin ni ìmọ́lẹ̀ ayé. Ìlú tí ó wà lórí òkè kò lè farapamọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀ gẹ́gẹ́ bí ó ṣe sún mọ́ Gíríìkì: “Ìlú tí ó dùbúlẹ̀ lórí òkè kò lè farapamọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ hàn gbangba, ó sì ní ìtẹnumọ́ nínú Gíríìkì; “Ẹ̀yin” fi àdírẹ́sì ọ̀pọ̀ àti ìtẹnumọ́ náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: τὸ φῶς
  choice: ìmọ́lẹ̀
  rationale: “Ìmọ́lẹ̀” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún àwòrán yìí; ìtumọ̀ náà dúró gẹ́gẹ́ bí ìdánimọ̀ tààrà, kì í ṣe ànímọ́ aláìlópin.
- source_word: τοῦ κόσμου
  choice: ayé
  rationale: “Ayé” mú ìtumọ̀ κόσμος gẹ́gẹ́ bí gbogbo ayé ènìyàn tàbí ètò ayé yìí, ó sì pa ìbáṣepọ̀ ‘ìmọ́lẹ̀ ayé’ mọ́ láì túmọ̀ sí ‘ìmọ́lẹ̀ fún ayé.’
- source_word: οὐ δύναται
  choice: kò lè
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ àìṣeéṣe tàbí àìlágbára.
- source_word: πόλις
  choice: Ìlú
  rationale: “Ìlú” jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún πόλις, ó sì lè tọ́ka sí ìlú ńlá tàbí ibùgbé ol olùgbé tó ṣe pàtàkì ní àyíká.
- source_word: κρυβῆναι
  choice: farapamọ́
  rationale: Ọ̀rọ̀ yìí sọ ipò jíjẹ́ ohun tí a kò rí tàbí tí ó pamọ́; “farapamọ́” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún àwòrán yìí.
- source_word: ἐπάνω ὄρους
  choice: lórí òkè
  rationale: ὄρος lè túmọ̀ sí òkè ńlá tàbí òkè kékeré; “òkè” pa ìwọ̀n ìtumọ̀ náà mọ́ láì fi irú ilẹ̀ kan pàtó kún un.
- source_word: κειμένη
  choice: tí ó wà
  rationale: Participle náà túmọ̀ sí ‘tí ó dùbúlẹ̀/tí ó wà ní ibi kan’; fún ìlú, “tí ó wà” jẹ́ Yorùbá tó mọ́gbọ́n dání, tí ó sì fi ipò rẹ̀ hàn láì daba pé ẹnì kan ṣẹ̀ṣẹ̀ gbé e síbẹ̀.
theological_decisions:
- issue: Ìdánimọ̀ àwọn ọmọ-ẹ̀yìn gẹ́gẹ́ bí ìmọ́lẹ̀
  choice: Ẹ̀yin ni ìmọ́lẹ̀ ayé
  alternative: Ẹ̀yin ni ìmọ́lẹ̀ fún ayé
  rationale: A pa àkàwé ìdánimọ̀ tààrà inú Gíríìkì mọ́; a kò yí genitive náà padà sí ète tàbí iṣẹ́ ‘fún ayé,’ èyí tí yóò jẹ́ àlàyé ju ìtumọ̀ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àmì ohùn kún ibi tí ó yẹ; “Ẹ̀yin” fi ọ̀pọ̀ ènìyàn àti ìtẹnumọ́ hàn, “tí ó wà lórí òkè” sì jẹ́ àdánidá ju lílo “dùbúlẹ̀” fún ìlú nínú ọ̀rọ̀ pàtàkì lọ.
