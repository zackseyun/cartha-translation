id: MAT.5.10
reference: Matthew 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: yo
  text: Ìbùkún ni fún àwọn tí a ti ṣe inúnibíni sí nítorí òdodo[a], nítorí tiwọn ni ìjọba ọ̀run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìwà tó tọ́ níwájú Ọlọ́run àti ṣíṣe ohun tó bá ìdájọ́ òdodo mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Ìbùkún ni fún
  rationale: Ó pa ìtumọ̀ ìkéde ìbùkún mọ́, kò sì sọ ọ́ di ìmọ̀lára ayọ̀ lásán.
- source_word: οἱ δεδιωγμένοι
  choice: àwọn tí a ti ṣe inúnibíni sí
  rationale: Ó fi participle perfect passive hàn gẹ́gẹ́ bí àwọn ẹni tí wọ́n ti jìyà inúnibíni, tí ipò náà sì ṣì kan wọ́n.
- source_word: ἕνεκεν
  choice: nítorí
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìdí tàbí ohun tó fa inúnibíni náà.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” lè tọ́ka sí ìwà tó bá ìfẹ́ Ọlọ́run mu àti sí ṣíṣe ohun tó tọ́; àlàyé ìsàlẹ̀ pa ìtumọ̀ ìdájọ́ òdodo mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó mú ìdí tí ìkéde ìbùkún náà fi jẹ́ òtítọ́ wọlé lọ́nà àdánidá.
- source_word: αὐτῶν
  choice: tiwọn
  rationale: Ó tú genitive ìní náà ní ṣókí, ní Yorùbá àdánidá.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Gbólóhùn Yorùbá tó mọ́gbọ́n dání fún ọ̀rọ̀ pàtàkì Mátíù, tó ń tọ́ka sí ìṣàkóso Ọlọ́run láti ọ̀run.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” jẹ́ àṣàyàn tó gbòòrò, tó lè gba ìwà rere àti ìbámu pẹ̀lú ìfẹ́ Ọlọ́run; “ìdájọ́ òdodo” jẹ́ ìtumọ̀ mìíràn tó ṣeé ṣe, a sì pa á mọ́ nínú àlàyé láì fi tipátipá yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà níyì, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “Ìbùkún ni fún” gẹ́gẹ́ bí ìkéde ìbùkún, kì í ṣe àpèjúwe ìmọ̀lára ayọ̀ nìkan.
