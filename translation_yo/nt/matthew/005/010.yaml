  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “Ìbùkún ni fún” ń ṣiṣẹ́ gẹ́gẹ́ bí ìkéde μακάριοι; “àwọn tí a ti ṣe inúnibíni sí” ń gbé ipò perfect passive δεδιωγμένοι kalẹ̀; “nítorí òdodo” ń ṣàfihàn ἕνεκεν δικαιοσύνης; àti “tiwọn ni ìjọba ọ̀run” ń pa ìdí ὅτι àti genitive αὐτῶν mọ́. “Ìjọba ọ̀run” jẹ́ ìtumọ̀ Yorùbá tí ó ti fìdí múlẹ̀ fún βασιλεία τῶν οὐρανῶν.'
  naturalness: Yorùbá náà jẹ́ boṣewa, ó ní àmì ohùn tó yẹ, ó sì ní ìforígbárí ìkéde ọlọ́wọ̀ tó bá ara àwọn ọrọ̀ ìbùkún mu. “Ìbùkún ni fún àwọn tí...” jẹ́ ọ̀nà adayeba àti kedere, bí ó tilẹ̀ jẹ́ pé àwọn àtúnṣe ìtàn Bíbélì míì lè lo ìṣètò ọ̀rọ̀ mìíràn.
  terminology: “Òdodo” jẹ́ ìbámu tó dára pẹ̀lú δικαιοσύνη nínú àyíká Mátíù, láì fi ìtumọ̀ rẹ̀ kún un ju ohun tí ọ̀rọ̀ náà sọ lọ. Àlàyé ìsàlẹ̀ náà ń pa ìfẹ̀hónúhàn “ìdájọ́ òdodo” mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn, ó sì ṣàlàyé ibú-ìtumọ̀ náà láì tẹ̀síwájú sí ẹ̀kọ́ ìjọ kan.
