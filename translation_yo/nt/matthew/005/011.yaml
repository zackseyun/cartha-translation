id: MAT.5.11
reference: Matthew 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: yo
  text: “Alábùkún ni ẹ̀yin nígbà tí àwọn ènìyàn bá gàn yín[a], tí wọ́n bá sì ṣe inúnibíni sí yín, tí wọ́n bá sì fi irọ́ sọ onírúurú ohun búburú sí yín nítorí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ̀rọ̀ ẹ̀gàn sí yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Alábùkún-fún ni ẹ̀yin
  rationale: Ó pa ìlànà ọ̀rọ̀ ìbùkún inú àwọn Ìbùkún Ayọ̀ mọ́, ó sì ní ìtumọ̀ ẹ̀sìn tó yẹ ju ọ̀rọ̀ tó lè túmọ̀ sí oríire lásán lọ.
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ipò tí ó lè ṣẹlẹ̀ ní ọjọ́ iwájú tàbí nígbàkigbà.
- source_word: ὀνειδίσωσιν
  choice: bá gàn yín
  rationale: Ó sọ èébú tàbí ọ̀rọ̀ àbùkù ní èdè Yorùbá òde òní tó ṣe kedere.
- source_word: διώξωσιν
  choice: bá sì ṣe inúnibíni sí yín
  rationale: Ó pa ìtumọ̀ ìhùwàsí ọ̀tá àti ìpọ́njú nítorí ìfaramọ́ Jésù mọ́, láì fi mọ́ irú ìpọ́njú kan ṣoṣo.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: bá sì ... sọ onírúurú ohun búburú sí yín
  rationale: “Onírúurú ohun búburú” fi ìbú kíkún ọ̀rọ̀ Gíríìkì hàn ní Yorùbá àdánidá; “sí yín” ń fi ọ̀rọ̀ tí a sọ lòdì sí wọn hàn.
- source_word: ψευδόμενοι
  choice: purọ́
  rationale: Ó jẹ́ kí ó ṣe kedere pé àwọn ẹ̀sùn tàbí ọ̀rọ̀ búburú náà kì í ṣe òtítọ́.
- source_word: ἕνεκεν ἐμοῦ
  choice: nítorí mi
  rationale: Ó sọ ìdí tààrà pé ìfaramọ́ Jésù ni ó fa ìtakò náà; ó tún jẹ́ Yorùbá òde òní tó rọrùn.
theological_decisions:
- issue: Irú ìtakò tí ẹsẹ̀ náà ń sọ
  choice: A fi ẹ̀gàn, inúnibíni, àti ẹ̀sùn èké hàn gẹ́gẹ́ bí ọ̀nà ìtakò tó gbòòrò nítorí Jésù.
  alternative: Kí a dín “inúnibíni” kù sí ìwà ipá ara nìkan tàbí kí a ka gbogbo ọ̀rọ̀ náà sí ìbanilórúkọjẹ́ nìkan.
  rationale: Àwọn ọ̀rọ̀-ìṣe mẹ́ta tí a so pọ̀ ń tọ́ka sí ọ̀rọ̀ èébú, ìpọ́njú ọ̀tá, àti ọ̀rọ̀ búburú èké. Ìtumọ̀ náà kò fi ọ̀kan dípò gbogbo wọn.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀yin/yín” fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ὑμεῖς/ὑμᾶς. A kò fi àmì [b] sínú ẹsẹ̀ nítorí “onírúurú” fúnra rẹ̀ ti jẹ́ ìtumọ̀ àdánidá, kò sì sí àlàyé míì tó yẹ láti yà á sọ́tọ̀.
