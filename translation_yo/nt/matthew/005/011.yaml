  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn apá pàtàkì ti Gíríìkì náà mọ́: ìbùkún náà, ẹ̀gàn, inúnibíni, ọ̀rọ̀ búburú èké, àti ìdí náà—nítorí Jésù. Síbẹ̀, ‘purọ́ sọ’ kò dára gẹ́gẹ́ bí ìṣọ̀kan ọ̀rọ̀ Yorùbá fún ψευδόμενοι; ‘fi irọ́ sọ’ mú ìtumọ̀ adverbial náà hàn kedere.'
