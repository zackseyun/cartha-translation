  terminology: ‘Gàn,’ ‘ṣe inúnibíni sí,’ àti ‘ohun búburú’ bá ọ̀rọ̀ ìpilẹ̀ mu, wọ́n sì dá ìyàtọ̀ ẹ̀gàn, inúnibíni, àti ẹ̀sùn èké sílẹ̀. ‘Nítorí mi’ dáa fún ἕνεκεν ἐμοῦ, kò sì fi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
  issues:
