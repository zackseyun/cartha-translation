source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: yo
  text: Ẹ má sì fi ilẹ̀ ayé búra, nítorí pé àpótí ìtìsẹ̀ ẹsẹ̀ rẹ̀ ni[a]; ẹ má sì fi Jerúsálẹ́mù búra[b], nítorí pé ìlú Ọba ńlá náà ni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ìtọ́kasí sí Aísáyà 66:1: “ilẹ̀ ayé sì ni àpótí ìtìsẹ̀ ẹsẹ̀ mi.”'
    reason: cross_reference
  - marker: b
    text: Giriki fi ọ̀rọ̀ tí ìtumọ̀ rẹ̀ sábà jẹ́ “sí Jerúsálẹ́mù” (εἰς Ἱεροσόλυμα) lò; níhìn-ín ó ṣeé ṣe kí ó jẹ́ ọ̀nà àṣà èdè fún “fi Jerúsálẹ́mù búra.”
    reason: lexical_alternative
  - marker: c
    text: Ìtọ́kasí sí Sáàmù 48:2, níbi tí a ti pe Jerúsálẹ́mù ní “ìlú Ọba ńlá náà.”
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: má sì …; bẹ́ẹ̀ ni má …
  rationale: Ọ̀rọ̀ náà ń tẹ̀ síwájú nínú àṣẹ ìdènà ẹsẹ tó ṣáájú. Ìtumọ̀ yìí mú ìbáṣepọ̀ ‘nor … nor’ jáde ní Yorùbá àdánidá, bó tilẹ̀ jẹ́ pé a tún ọ̀rọ̀ ìṣe ‘búra’ sọ kí gbolohun náà lè yé kedere.
- source_word: ἐν τῇ γῇ
  choice: fi ilẹ̀ ayé búra
  rationale: Nínú ọ̀rọ̀ ìbúra, ἐν ní ìtumọ̀ ohun tí a fi búra. ‘Fi … búra’ ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún àṣà ọ̀rọ̀ yìí.
- source_word: γῇ
  choice: ilẹ̀ ayé
  rationale: Àyíká ọ̀rọ̀ fi ilẹ̀ yìí wé ọ̀run àti Jerúsálẹ́mù; nítorí náà, gbogbo ilẹ̀ ayé ni a ń tọ́ka sí, kì í ṣe ilẹ̀ agbègbè kan.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ń sọ ìdí tí kò fi yẹ kí a fi àwọn nǹkan wọ̀nyí búra.
- source_word: ὑποπόδιόν
  choice: àpótí ìtìsẹ̀
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a gbé ẹsẹ̀ lé, ó sì pa àwòrán ọba àti ìjọba Ọlọ́run mọ́.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: ẹsẹ̀ rẹ̀
  rationale: A pa ìtọ́ka sí ẹsẹ̀ àti arọ́pò-orúkọ ẹni kẹta mọ́ láì fi orúkọ Ọlọ́run kún ohun tí Giriki kò sọ ní tààrà.
- source_word: εἰς Ἱεροσόλυμα
  choice: fi Jerúsálẹ́mù búra
  rationale: Bí ó tilẹ̀ jẹ́ pé εἰς sábà máa ń túmọ̀ sí ‘sí’ tàbí ‘sì í’, nínú àṣà ọ̀rọ̀ ìbúra níhìn-ín ó ń ṣiṣẹ́ gẹ́gẹ́ bí ohun tí a fi búra. A fi àlàyé ìtumọ̀ gangan sí àkọsílẹ̀ ìsàlẹ̀.
- source_word: πόλις
  choice: ìlú
  rationale: Èyí ni ìbámu Yorùbá tó ṣe tààrà fún πόλις ní àyíká yìí.
- source_word: τοῦ μεγάλου βασιλέως
  choice: Ọba ńlá náà
  rationale: Ọ̀rọ̀ yìí pa ìní àti ìyì gbolohun Giriki mọ́, ó sì bá ìtọ́kasí Sáàmù 48:2 mu.
theological_decisions:
- issue: Ẹni tí ‘rẹ̀’ nínú ‘àpótí ìtìsẹ̀ ẹsẹ̀ rẹ̀’ ń tọ́ka sí
  choice: A pa arọ́pò-orúkọ ‘rẹ̀’ mọ́, láì fi ‘Ọlọ́run’ sí i ní tààrà.
  alternative: ‘Àpótí ìtìsẹ̀ ẹsẹ̀ Ọlọ́run’ tàbí arọ́pò-orúkọ tí a kọ lọ́nà tó fi Ọlọ́run hàn gbangba.
  rationale: Giriki αὐτοῦ kò fi orúkọ Ọlọ́run sọ ní tààrà, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ àti Aísáyà 66:1 fi hàn pé Ọlọ́run ni a ń tọ́ka sí. Ìtumọ̀ náà kò gbọ́dọ̀ mú ohun tí orísun fi sílẹ̀ lọ́nà àìsọgbangba di ohun tí a ti pinnu ju bẹ́ẹ̀ lọ.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní ìyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A tún ọ̀rọ̀ ìṣe ‘búra’ sọ lẹ́ẹ̀mejì láti mú ìdènà méjèèjì ṣe kedere ní Yorùbá, bó tilẹ̀ jẹ́ pé Giriki gbára lé ọ̀rọ̀ ìṣe inú ẹsẹ tó ṣáájú. Àwọn àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
