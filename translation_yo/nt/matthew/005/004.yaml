  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: yo
  text: Ìbùkún ni fún àwọn tí ń ṣọ̀fọ̀[a], nítorí a ó tù wọ́n nínú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn tí ń ṣèbànújẹ́.’ Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbòòrò; kò sì sọ ohun tí ó fa ọ̀fọ̀ tàbí ìbànújẹ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Aláyọ̀ ni
  rationale: Ó pa ìlànà ọ̀rọ̀ ìbùkún mọ́ ní Yorùbá, ó sì ń sọ bí Ọlọ́run ṣe ka irú àwọn ènìyàn bẹ́ẹ̀ sí, kì í ṣe ìmọ̀lára ayọ̀ wọn lásán.
- source_word: οἱ πενθοῦντες
  choice: àwọn tí ń ṣọ̀fọ̀
  rationale: Ó tú participle tó ní article náà sí ọ̀pọ̀ ènìyàn ní Yorùbá àdánidá. ‘Ń ṣọ̀fọ̀’ lè gba ìbànújẹ́, àdánù, tàbí ẹ̀dùn ọkàn láàyè láì sọ ohun tó fà á pàtó.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tàbí ìpìlẹ̀ ìkéde ìbùkún náà hàn ní ọ̀nà tó ṣe kedere.
- source_word: αὐτοὶ
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́ díẹ̀ nínú Gíríìkì, ṣùgbọ́n ‘wọ́n’ jẹ́ Yorùbá àdánidá; ìṣètò gbólóhùn náà ti ń gbé ìtẹnumọ́ náà jáde.
- source_word: παρακληθήσονται
  choice: a ó tù wọ́n nínú
  rationale: 'Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún gbólóhùn passive ọjọ́ iwájú náà: wọn yóò gba ìtùnú. Ó tún jẹ́ kí ẹni tó ń tù wọ́n nínú má ṣe jẹ́ dandan láti sọ ní kedere, gẹ́gẹ́ bí Gíríìkì.'
theological_decisions:
- issue: Ìwọ̀n ohun tí ṣíṣọ̀fọ̀ nínú ọ̀rọ̀ ìbùkún náà túmọ̀ sí
  choice: A túmọ̀ ọ́ ní gbòòrò sí ‘àwọn tí ń ṣọ̀fọ̀,’ láì sọ bóyá ẹ̀ṣẹ̀, àdánù, ìnilára, tàbí ìrètí ọjọ́ iwájú ni wọ́n ń ṣọ̀fọ̀ lé lórí.
  alternative: A lè dín in kù sí ‘àwọn tí ń ṣọ̀fọ̀ nítorí ẹ̀ṣẹ̀ wọn’ tàbí ìtumọ̀ pàtó mìíràn.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ohun tó fa ọ̀fọ̀ náà. Ìtumọ̀ gbòòrò pa àìsọ pàtó àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́, láì fi èrò ẹ̀sìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lasan; ‘a ó tù wọ́n nínú’ pa passive ti Gíríìkì mọ́ ní Yorùbá àdánidá.
