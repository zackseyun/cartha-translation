  to: Fi fún ẹni tí ń béèrè lọ́wọ́ rẹ, má sì yí padà kúrò lọ́dọ̀ ẹni tí ó fẹ́ yá nǹkan lọ́wọ́ rẹ.
  rationale: A rọ́pò ìtúmọ̀ ìpín kejì pẹ̀lú ọ̀rọ̀ Yorùbá tó pa ìṣe àwòrán ἀποστραφῇς mọ́, láìdín àṣẹ náà kù sí ìkọ̀ láti fún. A tún lo participle ‘ń béèrè’ láti ṣètọ́jú ìwà gbogbogbòò ti τῷ αἰτοῦντί. Ìtúnṣe kò fi ohun tí a máa yá, ìdí tàbí ààlà kankan kún ẹsẹ̀ náà.
