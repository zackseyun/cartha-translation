  verdict: revise
  source_fidelity: 'Ìdájọ́ àkọ́kọ́ náà dá ìbéèrè àti àṣẹ ‘fún’ hàn dáadáa, ìṣòro kan sì wà nínú ìpín kejì: ‘má sì kọ̀ láti fún’ yí ἀποστραφῇς (‘má yí padà/má sá kúrò’) padà sí ‘má kọ̀ láti fún,’ ó sì tún fi ‘fún’ kún ibi tí Gíríìkì ti ń sọ nípa yíyàgò kúrò lọ́dọ̀ ẹni náà. Ìtúnṣe náà pa àwòrán àti agbára ìdènà Gíríìkì mọ́.'
  naturalness: ‘Fi fún ẹni tí ń béèrè lọ́wọ́ rẹ’ jẹ́ ọ̀nà Yorùbá òde òní tó mọ́, ó sì sún mọ́ participle Gíríìkì ju ‘ẹni tí ó bá béèrè’ lọ, èyí tí ó lè dun bí ìṣẹ̀lẹ̀ ìjọ̀ọ́jọ̀. ‘Má sì yí padà kúrò lọ́dọ̀ ẹni tí ó fẹ́ yá nǹkan lọ́wọ́ rẹ’ jẹ́ èdè ìwàásù tó ní ìyì tí ó sì ṣàfihàn ìtumọ̀ náà kedere.
  terminology: ‘Yá nǹkan lọ́wọ́ rẹ’ tọ́ fún δανίσασθαι nínú àyíká yìí, ó sì yẹra fún fífi ‘owó’ kún un. ‘Fi fún’ ṣètọ́jú àṣẹ δός. A kò nílò àlàyé ìsàlẹ̀ tuntun, nítorí ìtumọ̀ Yorùbá ti lè pa ìyàtọ̀ ọ̀rọ̀ náà mọ́ láìjẹ́ pé ó ṣókùnfà ìdààmú.
