source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: yo
  text: Fi fún ẹni tí ń béèrè lọ́wọ́ rẹ, má sì yí padà kúrò lọ́dọ̀ ẹni tí ó fẹ́ yá nǹkan lọ́wọ́ rẹ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτοῦντί
  choice: ẹni tí ó bá béèrè lọ́wọ́ rẹ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí ó ní àpilẹ̀kọ náà ń tọ́ka sí ẹnikẹ́ni tó ń béèrè ní gbogbogbòò. ‘Ẹni tí ó bá béèrè lọ́wọ́ rẹ’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ gbogbogbòò mọ́.
- source_word: δός
  choice: Fi fún
  rationale: Àṣẹ aorist ni; ‘Fi fún’ sọ àṣẹ náà ní tààràtà láìfi agbára modal míì kún un.
- source_word: θέλοντα
  choice: ẹni tí ó fẹ́
  rationale: Ó túmọ̀ sí ẹni tí ó ní ìfẹ́ tàbí ète láti ṣe ohun tí infinitive tó tẹ̀ lé sọ; ‘ẹni tí ó fẹ́’ jẹ́ ọ̀nà Yorùbá tó rọrùn jù.
- source_word: ἀπὸ σοῦ
  choice: lọ́wọ́ rẹ
  rationale: Nínú ọ̀rọ̀ yíyá, ‘lọ́wọ́ rẹ’ ni Yorùbá àdánidá fún orísun ohun tí a fẹ́ yá.
- source_word: δανίσασθαι
  choice: yá nǹkan
  rationale: Infinitive náà túmọ̀ sí ‘láti yá.’ Nítorí Gíríìkì kò sọ pé owó nìkan ni, ‘nǹkan’ pa àyè ìtumọ̀ náà mọ́ láìdín in sí owó.
- source_word: μὴ ἀποστραφῇς
  choice: má sì kọ̀ láti fún
  rationale: Gẹ́gẹ́ bí àṣẹ ìdènà, gbólóhùn náà sọ pé kí ẹni náà má ṣe yí padà kúrò lọ́dọ̀ ẹni tó fẹ́ yá. Ní Yorùbá, ‘má kọ̀ láti fún’ mú ète ọ̀rọ̀ náà jáde ní kedere, bó tilẹ̀ jẹ́ pé ó tú àwòrán ‘yí padà’ sí ìtumọ̀ rẹ̀.
theological_decisions:
- issue: Ìwọ̀n àti agbára àṣẹ ìwà rere Jésù
  choice: A túmọ̀ ọ́ sí àṣẹ tààrà tí ó kan ẹni tó bá béèrè àti ẹni tó fẹ́ yá, láìfi ààlà tí kò sí nínú Gíríìkì kún un.
  alternative: Láti dín àṣẹ náà kù sí àwọn ẹni tí a bá kọ́kọ́ dá lẹ́jọ́ pé wọ́n yẹ, tàbí láti sọ ọ́ ní ọ̀nà tó rọ agbára rẹ̀.
  rationale: Ẹsẹ̀ náà ní àwọn àṣẹ méjì tó ṣe kedere nínú Ìwàásù Lórí Òkè. Ìtumọ̀ yẹ kí ó pa agbára àti ìwọ̀n gbogbogbòò wọn mọ́ láìkó àfikún ẹ̀kọ́ ìsìn wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì, pẹ̀lú àmì ohùn ní ibi tó yẹ. ‘Yá nǹkan lọ́wọ́ rẹ’ yẹra fún fífi ‘owó’ kún ohun tí orísun kò sọ. A lo ‘má kọ̀ láti fún’ dípò ìtumọ̀ gígán ‘má yí padà kúrò lọ́dọ̀’ nítorí ó jẹ́ Yorùbá tó ṣe kedere nínú àyíká yíyá.
