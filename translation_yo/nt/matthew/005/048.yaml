id: MAT.5.48
reference: Matthew 5:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin gbọdọ̀ jẹ́ pípé[a], gẹ́gẹ́ bí Baba yín tí ń bẹ ní ọ̀run ṣe jẹ́ pípé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “kíkún,” “odindi,” tàbí “tí ó dàgbà dénú.” Ọ̀rọ̀ Gíríìkì τέλειος lè túmọ̀ sí ohun tí ó kún tàbí tí ó dàgbà dénú, pẹ̀lú ìtumọ̀ “pípé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: ẹ̀yin gbọdọ̀ jẹ́
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni èdè Gíríìkì, ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ tàbí ìṣírí ní àyíká yìí. “Ẹ̀yin gbọdọ̀ jẹ́” mú agbára ìpè náà jáde ní Yorùbá àdánidá láìsọ ọ́ di àsọtẹ́lẹ̀ lásán.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ yìí so ẹ̀kọ́ tó ṣáájú nípa fífẹ́ àwọn ọ̀tá pọ̀.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: A pa arọ́pò-orúkọ tí a tẹnumọ́ nínú Gíríìkì mọ́, kí ìpè náà lè dojú kọ àwọn olùgbọ́ ní tààrà.
- source_word: τέλειοι / τέλειός
  choice: pípé
  rationale: “Pípé” ni ìtumọ̀ tààrà tó sì pa àfiwé tó wà láàárín àwọn ọmọ-ẹ̀yìn àti Baba mọ́. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tí ọ̀rọ̀ náà lè ní hàn.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó gbé àfiwé náà jáde ní Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yín ọ̀run
  rationale: Ìtumọ̀ kúkúrú, àdánidá fún Baba yín tí í ṣe ti ọ̀run; lílo lẹ́tà ńlá fún “Baba” fi hàn pé Ọlọ́run ni a ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ τέλειος nínú ìpè sí ìwà rere
  choice: pípé
  alternative: pé pátápátá; kún; dàgbà dénú
  rationale: “Pípé” pa agbára ìpè àti àfiwé pẹ̀lú Baba mọ́. Nínú àyíká Mátíù 5:43–47, ọ̀rọ̀ náà tún lè tọ́ka sí ìfẹ́ tó pé, tó kún, tí kò sì pín sí méjì; àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ yìí wà láìdín ìpè inú ẹsẹ náà kù.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Ẹ̀yin” pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́; “Baba yín ọ̀run” jẹ́ ọ̀nà kúkúrú tí ó ṣe àdánidá láti sọ “Baba yín ti ọ̀run.”
