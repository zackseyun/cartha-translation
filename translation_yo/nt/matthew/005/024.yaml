  to: Fi ẹ̀bùn rẹ sílẹ̀ níbẹ̀ níwájú pẹpẹ, kí o sì lọ. Kọ́kọ́ bá arákùnrin rẹ[b] làjà[a]; lẹ́yìn náà, wá, kí o sì fi ẹ̀bùn rẹ rúbọ.
