id: MAT.5.24
reference: Matthew 5:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: yo
  text: Fi ẹ̀bùn rẹ sílẹ̀ níbẹ̀ níwájú pẹpẹ, kí o sì lọ. Kọ́kọ́ bá arákùnrin rẹ[b] làjà[a]; lẹ́yìn náà, wá, kí o sì fi ẹ̀bùn rẹ rúbọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣe àlàáfíà pẹ̀lú arákùnrin rẹ.”
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin” túmọ̀ ọ̀rọ̀ Gíríìkì akọ ẹyọ kan; nínú àyíká ọ̀rọ̀ yìí, ìlànà ìlàjà lè kan àjọṣe pẹ̀lú àwọn ẹlòmíràn ní ọ̀nà tó gbòòrò sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: Fi … sílẹ̀ níbẹ̀
  rationale: “Fi … sílẹ̀” sọ ìlànà pé kí a fi ohun náà dúró sí ibi tí ó wà; “níbẹ̀” sì pa ìtọ́ka ibi inú ἐκεῖ mọ́.
- source_word: τὸ δῶρόν σου
  choice: ẹ̀bùn rẹ
  rationale: “Ẹ̀bùn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún δῶρον; ọ̀rọ̀ pẹpẹ àti rúbọ mú kí ó hàn gbangba pé ẹ̀bùn sí Ọlọ́run ni.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: níwájú pẹpẹ
  rationale: Ó pa ìbáṣepọ̀ ibi tí Gíríìkì sọ mọ́, “pẹpẹ” sì jẹ́ ọ̀rọ̀ tí a mọ̀ fún ibi fífi ẹbọ rú.
- source_word: ὕπαγε
  choice: kí o sì lọ
  rationale: Ìtumọ̀ àṣẹ ìrìn ni; ọ̀nà yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì so àṣẹ náà mọ́ èyí tó ṣáájú.
- source_word: πρῶτον
  choice: Kọ́kọ́
  rationale: Ó tẹnumọ́ pé ìlàjà gbọ́dọ̀ ṣáájú píparí fífi ẹ̀bùn rúbọ.
- source_word: διαλλάγηθι
  choice: bá … làjà
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí mímú àjọṣe padà bọ̀ sí ipò àlàáfíà, ó sì dá agbára ìlànà Gíríìkì dúró láìsọ ẹni tí ó jẹ̀bi.
- source_word: τῷ ἀδελφῷ σου
  choice: arákùnrin rẹ
  rationale: Ó pa akọ ẹyọ kan tí ἀδελφός ní mọ́, láìfi “ará ẹlẹgbẹ́ nínú ìgbàgbọ́” kún ohun tí ọ̀rọ̀ náà kò sọ ní pàtó.
- source_word: καὶ τότε ἐλθὼν
  choice: lẹ́yìn náà, padà wá
  rationale: Ó fi tẹ̀lé-tẹ̀lé ìṣẹ̀lẹ̀ hàn ní Yorùbá àdánidá. “Padà” jẹ́ ohun tí àyíká ọ̀rọ̀ túmọ̀ sí, nítorí ẹni náà ti fi ẹ̀bùn sílẹ̀ ní pẹpẹ kí ó tó lọ.
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: fi ẹ̀bùn rẹ rúbọ
  rationale: “Rúbọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún fífi ohun kan fún Ọlọ́run ní àyíká pẹpẹ; “fi ẹ̀bùn rẹ” pa ohun tí a ń rú mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφός nínú ẹ̀kọ́ nípa àjọṣe ènìyàn
  choice: arákùnrin rẹ
  alternative: arákùnrin tàbí arábìnrin rẹ; ẹni ẹlẹgbẹ́ rẹ
  rationale: Gíríìkì jẹ́ akọ ẹyọ kan. A pa ìrísí ọ̀rọ̀ orísun mọ́ nínú ẹsẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ìlànà ìlàjà lè kan àjọṣe pẹ̀lú àwọn ẹlòmíràn pẹ̀lú.
- issue: Bí a ṣe máa ṣàfihàn διαλλάγηθι gẹ́gẹ́ bí àṣẹ aláìṣe
  choice: bá … làjà
  alternative: jẹ́ kí ìlàjà wà láàárín ìwọ àti …; ṣe àlàáfíà pẹ̀lú …
  rationale: “Bá … làjà” jẹ́ àdánidá ní Yorùbá, kò sì pinnu ẹni tí ó bẹ̀rẹ̀ ẹ̀ṣẹ̀ tàbí ẹni tí ó ní gbogbo ẹrù ìmúpadàbọ̀sípò. Nípa bẹ́ẹ̀, ó pa ìfọ̀rọ̀wérọ̀ àti ìṣòro ẹ̀kọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì rọrùn fún òǹkàwé òde òní. A lo “rúbọ” nítorí àyíká pẹpẹ, a sì lo “bá … làjà” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá tí kò fi ẹ̀bi kàn ẹnì kan ní pàtó.
