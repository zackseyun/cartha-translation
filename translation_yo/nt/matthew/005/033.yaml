id: MAT.5.33
reference: Matthew 5:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: yo
  text: “Ẹ tún ti gbọ́ pé a sọ fún àwọn ènìyàn ìgbàanì pé, ‘Ẹ kò gbọdọ̀ búra èké[a], ṣùgbọ́n ẹ gbọdọ̀ mú àwọn ìbúra yín ṣẹ fún Olúwa[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kò gbọdọ̀ rú ìbúra”; ọ̀rọ̀-ìṣe náà lè tọ́ka sí bíbúra èké tàbí rírú ìbúra.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún OLÚWA,” ní ìbámu pẹ̀lú orúkọ Ọlọ́run ti májẹ̀mú nínú ìpìlẹ̀ Májẹ̀mú Láéláé.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Ẹ tún ti gbọ́
  rationale: “Tún” fi hàn pé Jésù ń tẹ̀ síwájú nínú ọ̀wọ́ àwọn àpẹẹrẹ rẹ̀; “ti gbọ́” jẹ́ ọ̀nà àdánidá láti sọ pé ohun náà ti dé etí wọn tẹ́lẹ̀.
- source_word: ἠκούσατε
  choice: ẹ ti gbọ́
  rationale: Ẹni púpọ̀ ni Jésù ń bá sọ̀rọ̀; àkókò ọ̀rọ̀ Gíríìkì náà bá ìtumọ̀ pé wọ́n ti gbọ́ ẹ̀kọ́ yìí tẹ́lẹ̀ mu.
- source_word: ἐρρέθη
  choice: a sọ
  rationale: Ìtumọ̀ aláìdárúkọ olùsọ yìí pa ìrísí ọ̀rọ̀ àìṣe Gíríìkì mọ́ láì fi ẹni tí ó sọ ọ́ kún un.
- source_word: τοῖς ἀρχαίοις
  choice: fún àwọn ènìyàn ìgbàanì
  rationale: Ó tọ́ka sí àwọn ìran ayé àtijọ́, kì í ṣe àwọn àgbàlagbà lásán.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Ẹ kò gbọdọ̀ búra èké
  rationale: “Búra èké” lè túmọ̀ sí jíjẹ́rìí èké nípasẹ̀ ìbúra tàbí híha ìbúra; kò fi ìtumọ̀ náà mọ́ ẹ̀ṣẹ̀ ilé-ẹjọ́ nìkan.
- source_word: ἀποδώσεις
  choice: ẹ gbọdọ̀ mú ... ṣẹ
  rationale: Nínú àyíká ìbúra, ọ̀rọ̀ náà túmọ̀ sí ṣíṣe ohun tí ẹni ti ṣe àdéhùn láti ṣe; “mú ... ṣẹ” jẹ́ èdè Yorùbá àdánidá fún ìmúṣẹ ìlérí tàbí ìbúra.
- source_word: τῷ κυρίῳ
  choice: fún Olúwa
  rationale: κύριος níbí tọ́ka sí Ọlọ́run; “Olúwa” jẹ́ ìtumọ̀ Yorùbá tí ó bójú mu, láì sọ pé Gíríìkì fúnra rẹ̀ ní orúkọ májẹ̀mú Hébérù.
- source_word: τοὺς ὅρκους σου
  choice: àwọn ìbúra yín
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìbúra mọ́, ó sì lo arọ́pò-orúkọ ọ̀pọ̀ ènìyàn bí ó ti yẹ fún àwọn tí Jésù ń bá sọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkótán ẹ̀kọ́ tí ó ní ìpìlẹ̀ nínú Ìwé Mímọ́ Ísírẹ́lì
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ κυρίῳ, Jésù sì ń ṣe àkótán ẹ̀kọ́ Ìwé Mímọ́ dípò kí ó fa gbólóhùn Hébérù kan tí ó ní Tẹ́tírágírámatọ́n yọ ní tààràtà. Nítorí náà, “Olúwa” wà nínú ọ̀rọ̀ pàtàkì, a sì pa “OLÚWA” mọ́ gẹ́gẹ́ bí àṣàyàn tí ìpìlẹ̀ Májẹ̀mú Láéláé lè ṣe àtìlẹ́yìn fún.
- issue: Ìwọ̀n ìtumọ̀ ἐπιορκέω
  choice: búra èké
  alternative: da ìbúra rú
  rationale: Ọ̀rọ̀-ìṣe náà lè tọ́ka sí ìbúra èké tàbí híha ìbúra. “Búra èké” dá ìtumọ̀ àkọ́kọ́ dúró, àkọsílẹ̀ ìsàlẹ̀ sì pa ìtumọ̀ kejì mọ́ láì sọ ọ̀rọ̀ náà di ẹ̀ṣẹ̀ ilé-ẹjọ́ nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye ní òde òní. A lo “ẹ” fún àwùjọ tí Jésù ń bá sọ̀rọ̀, “ènìyàn ìgbàanì” láti yẹra fún ìtumọ̀ pé àgbàlagbà nìkan, àti “mú ìbúra ṣẹ” gẹ́gẹ́ bí gbólóhùn Yorùbá àdánidá.
