  to: Ṣùgbọ́n mo sọ fún yín pé, ẹ má ṣe tako ẹni búburú.[a] Kàkà bẹ́ẹ̀, bí ẹnikẹ́ni bá gbá ọ ní ẹ̀rẹ̀kẹ́ ọ̀tún,[b] yí ẹ̀rẹ̀kẹ́ kejì sí i pẹ̀lú.
  rationale: A ṣe gbolóhùn ìbẹ̀rẹ̀ náà ní Yorùbá àdánidá, a sì sọ “ẹ̀rẹ̀kẹ́ kejì” ní kedere kí ìtọ́kasí náà má bàa dàrú. Àlàyé [a] ń dáàbò bo àìdánilójú gírámà τῷ πονηρῷ, àti [b] ti tún di àṣàyàn ọ̀rọ̀ gidi dipo àlàyé àfikún.
  reviewer_model: gpt-5.6-terra
