review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ti Gíríìkì náà dáadáa: ìfẹ̀hónúhàn náà, àìtakò ẹni búburú, ìgbá ní ẹ̀rẹ̀kẹ́ ọ̀tún, àti yíyí ẹ̀rẹ̀kẹ́ kejì. Síbẹ̀, “yí èkejì sí i” fi ohun tí a ń yí sílẹ̀ ní ọ̀nà tí ó lè má hàn gbangba ní Yorùbá. Fífi “ẹ̀rẹ̀kẹ́” hàn jẹ́ ìṣàtúnṣe tó ṣeé dáàbò bo láì fi ìtumọ̀ tuntun kún un.'
  naturalness: “Ṣùgbọ́n èmi sọ fún yín pé” kò rọrùn gẹ́gẹ́ bí gbolóhùn Yorùbá òde òní; “Ṣùgbọ́n mo sọ fún yín pé” jẹ́ àdánidá. “Yí ẹ̀rẹ̀kẹ́ kejì sí i pẹ̀lú” sì jẹ́ gbolóhùn tí ó péye, tí ó sì mọ́gbọ́n dání ju “yí èkejì sí i pẹ̀lú” lọ.
  terminology: “Ẹni búburú” jẹ́ àṣàyàn tó bójú mu fún τῷ πονηρῷ nínú àyíká ẹni tó ń lu ẹlòmíràn, nígbà tí àlàyé ìsàlẹ̀ ń pa àwọn ìtumọ̀ míì—“ibi” àti “Ẹni Búburú náà”—mọ́. “Gbá” bá ìṣe ìlù ọwọ́ ní ẹ̀rẹ̀kẹ́ mu.
  issues:
  - severity: medium
    issue: Gbolóhùn ìbẹ̀rẹ̀ náà ní ìṣọ̀kan ọ̀rọ̀-ìṣe tí kò wọ́pọ̀.
    rationale: Nínú Yorùbá boṣewa, “èmi sọ” nínú àyíká yìí kò rọrùn bí “mo sọ.” Ìtẹnumọ́ ἐγώ kò ṣe dandan kí a máa ṣe àfihàn rẹ̀ pẹ̀lú arọ́pò orúkọ aládàáṣiṣẹ́ tí ó jẹ́ àìdánidá.
