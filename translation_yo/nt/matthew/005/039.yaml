- from: 'Ṣùgbọ́n èmi sọ fún yín pé, ẹ má ṣe tako ẹni búburú.[a] Kàkà bẹ́ẹ̀, bí ẹnikẹ́ni bá gbá ọ ní ẹ̀rẹ̀kẹ́ ọ̀tún,[b] yí èkejì sí i pẹ̀lú.


