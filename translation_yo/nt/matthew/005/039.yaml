    issue: “Èkejì” nínú gbolóhùn àkọ́kọ́ kò sọ ẹ̀yà ara tí a ń tọ́ka sí ní kedere.
    rationale: Bó tilẹ̀ jẹ́ pé Gíríìkì lo ellipsis, Yorùbá máa ń ka “yí ẹ̀rẹ̀kẹ́ kejì sí i” ní kedere àti ní àdánidá. Ìyípadà yìí ń ṣàlàyé ohun tí àyíká ti sọ tẹ́lẹ̀, kì í sì fi èrò “fún un” tàbí ìtumọ̀ mìíràn kún un.
  - severity: low
