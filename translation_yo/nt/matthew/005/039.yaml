id: MAT.5.39
reference: Matthew 5:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé, ẹ má ṣe tako ẹni búburú.[a] Kàkà bẹ́ẹ̀, bí ẹnikẹ́ni bá gbá ọ ní ẹ̀rẹ̀kẹ́ ọ̀tún,[b] yí ẹ̀rẹ̀kẹ́ kejì sí i pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe tako ibi”; ìtumọ̀ mìíràn sì ni, “ẹ má ṣe tako Ẹni Búburú náà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “yí èkejì sí i pẹ̀lú.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ṣùgbọ́n èmi sọ fún yín pé
  rationale: “Ṣùgbọ́n” fi ìtakora δέ hàn, lílo “èmi” sì pa ìtẹnumọ́ ἐγώ mọ́. Gbólóhùn náà jẹ́ ti Yorùbá àdánidá, ó sì pa ohùn àṣẹ Jesu mọ́.
- source_word: μὴ ἀντιστῆναι
  choice: ẹ má ṣe tako
  rationale: “Tako” túmọ̀ sí dídìde sí tàbí kíkọjú ìjà sí ohun kan. Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́ láì dín ìtumọ̀ rẹ̀ kù sí gbígbẹ̀san nìkan.
- source_word: τῷ πονηρῷ
  choice: ẹni búburú
  rationale: Àpẹẹrẹ ẹni tí ó gbá ẹlòmíràn lẹ́yìn gbólóhùn yìí ṣe àtìlẹ́yìn fún ìtumọ̀ ẹni búburú. Àmọ́, nítorí Gíríìkì náà tún lè túmọ̀ sí ibi tàbí Ẹni Búburú náà, a pa àwọn ìtumọ̀ wọ̀nyẹn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ὅστις
  choice: bí ẹnikẹ́ni bá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára aláìdánimọ̀ àti ìrísí àídájú ọ̀rọ̀ Gíríìkì hàn.
- source_word: ῥαπίζει
  choice: gbá
  rationale: Nínú àyíká ẹ̀rẹ̀kẹ́, “gbá” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún lílù ẹni pẹ̀lú ọwọ́, ó sì lè gbé èrò ẹ̀gàn tàbí ìtìjú inú ìṣe náà.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: ní ẹ̀rẹ̀kẹ́ ọ̀tún
  rationale: “Ẹ̀rẹ̀kẹ́” bá ọ̀nà Yorùbá tí a fi ń sọ ibi tí wọ́n gbá ènìyàn mu ju “egungun ẹ̀rẹ̀kẹ́” lọ; “ní” sì mú ìtumọ̀ εἰς jáde ní àdánidá.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: yí èkejì sí i pẹ̀lú
  rationale: “Yí” pa ìtumọ̀ gangan στρέφω mọ́, “èkejì” sì tọ́ka sí ẹ̀rẹ̀kẹ́ kejì gẹ́gẹ́ bí àyíká ṣe fi hàn, láì fi ìtumọ̀ alágbára bí “fi fún un” kún un.
theological_decisions:
- issue: Ìtumọ̀ τῷ πονηρῷ
  choice: ẹni búburú
  alternative: “ibi” tàbí “Ẹni Búburú náà”
  rationale: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ àìlẹ́ni, ẹni búburú lápapọ̀, tàbí ẹni ibi pàtó. Àpẹẹrẹ tó tẹ̀ lé e tọ́ka sí ẹni tó ń ṣe ìpalára, nítorí náà “ẹni búburú” wà nínú àkọ́kọ́; àlàyé ìsàlẹ̀ sì pa àìdánilójú ojúlówó náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ. “Ẹ má ṣe” bá ọ̀rọ̀ sí ọ̀pọ̀ ènìyàn mu, “sí i” sì jẹ́ ọ̀nà Yorùbá àdánidá fún “sí ẹni náà.”
