id: MAT.5.30
reference: Matthew 5:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: yo
  text: Bí ọwọ́ ọ̀tún rẹ bá sì ń mú ọ kọsẹ̀[a], gé e kúrò, kí o sì sọ ọ́ nù. Nítorí ó sàn fún ọ kí ọ̀kan lára àwọn ẹ̀yà ara rẹ ṣègbé ju kí gbogbo ara rẹ lọ sínú Gẹhẹ́nà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń mú ọ dẹ́ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà pé “ń mú ọ kọsẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀run àpáàdì.” “Gẹhẹ́nà” jẹ́ ọ̀rọ̀ Gíríìkì tó ní ìpilẹ̀ rẹ̀ nínú Àfonífojì Hínómù, tí a sì ń lò fún ìdájọ́ ọjọ́ iwájú.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: ọwọ́ ọ̀tún rẹ
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti sọ ‘ọwọ́ ọ̀tún,’ ó sì pa àwòrán ẹ̀yà ara inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: σκανδαλίζει
  choice: ń mú ọ kọsẹ̀
  rationale: Ó pa àkàwé ìkọsẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tó tún lè túmọ̀ sí mímú ènìyàn ṣubú sínú ẹ̀ṣẹ̀ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ἔκκοψον
  choice: gé e kúrò
  rationale: Àṣẹ yìí taara, ó lágbára, ó sì yẹ fún gígé ọwọ́ kúrò.
- source_word: βάλε ἀπὸ σοῦ
  choice: sọ ọ́ nù
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì fi ìmúkúrò àti ìkọ̀sílẹ̀ pátápátá hàn.
- source_word: συμφέρει γάρ σοι
  choice: Nítorí ó sàn fún ọ
  rationale: Ó sọ ìfiwéra ohun tó dára jù lọ ní Yorùbá adayébá, kì í ṣe èrè owó.
- source_word: ἵνα ἀπόληται
  choice: kí ... ṣègbé
  rationale: ‘Ṣègbé’ pa agbára àti ìkìlọ̀ inú ἀπόληται mọ́ láì sọ ọ́ di ọ̀rọ̀ pẹ̀lẹ́.
- source_word: ἓν τῶν μελῶν σου
  choice: ọ̀kan lára àwọn ẹ̀yà ara rẹ
  rationale: ‘Ẹ̀yà ara’ jẹ́ Yorùbá tó ṣe kedere, ó sì gbòòrò ju ‘ẹsẹ̀ tàbí ọwọ́’ lọ bí μέλος ṣe rí.
- source_word: ὅλον τὸ σῶμά σου
  choice: gbogbo ara rẹ
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ẹ̀yà ara kan àti gbogbo ara mọ́ ní ọ̀nà adayébá.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: lọ sínú Gẹhẹ́nà
  rationale: ‘Lọ sínú’ tẹ̀ lé ìtumọ̀ ìṣípò ἀπέρχομαι pẹ̀lú εἰς; ‘Gẹhẹ́nà’ sì pa orúkọ Gíríìkì tó ní ìtàn pàtàkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ γέεννα
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: Gẹhẹ́nà jẹ́ ọ̀rọ̀ tó wá láti Àfonífojì Hínómù, tí a sì lò fún ìdájọ́ ọjọ́ iwájú. Pípa orúkọ náà mọ́ kò jẹ́ ká kó gbogbo ìtumọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e wọ inú ẹsẹ̀ náà; àlàyé ìsàlẹ̀ ojú ìwé fún òǹkàwé ní ìtumọ̀ tó wọ́pọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní ibi tó yẹ. A pa àkàwé ‘kọsẹ̀,’ líle àwọn àṣẹ, àti ìyàtọ̀ láàárín ẹ̀yà ara kan àti gbogbo ara mọ́; a kò tú ọ̀rọ̀ náà ní ọ̀nà tó máa pinnu bóyá àṣẹ náà jẹ́ àkàwé tàbí ohun tí a ní láti ṣe ní tààrà.
