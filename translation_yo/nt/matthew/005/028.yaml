id: MAT.5.28
reference: Matthew 5:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: yo
  text: Ṣùgbọ́n èmi sọ fún yín pé, olúkúlùkù ẹni tí ó bá wo obìnrin kan[a] láti ní ìfẹ́kúfẹ̀ẹ́ sí i[b][c], ó ti ṣe panṣágà pẹ̀lú rẹ̀ nínú ọkàn rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aya kan.” Ọ̀rọ̀ Gíríìkì γυνή lè túmọ̀ sí “obìnrin” tàbí “aya,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti fẹ́ ẹ ní ìfẹ́kúfẹ̀ẹ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “pẹ̀lú ète láti ní ìfẹ́kúfẹ̀ẹ́ sí i.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ṣùgbọ́n èmi sọ fún yín
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tí δέ mú wá hàn, “èmi” sì pa ìtẹnumọ́ ἐγώ mọ́; gbólóhùn náà jẹ́ Yorùbá àdánidá tí ó sì tẹ̀ lé orísun pẹkipẹki.
- source_word: πᾶς ὁ βλέπων
  choice: olúkúlùkù ẹni tí ó bá wo
  rationale: Ìtumọ̀ yìí fi agbára gbogbogbò πᾶς hàn láìfi akọ kún ọ̀rọ̀ náà ju bí Gíríìkì ṣe béèrè lọ.
- source_word: γυναῖκα
  choice: obìnrin kan
  rationale: γυνή lè túmọ̀ sí “obìnrin” tàbí “aya” gẹ́gẹ́ bí àyíká ọ̀rọ̀. “Obìnrin kan” pa gbólóhùn ìwà rere gbogbogbò náà mọ́, láìdín ìtumọ̀ orísun kù sí aya nìkan.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: pẹ̀lú ète láti fẹ́ ẹ ní ìfẹ́kúfẹ̀ẹ́
  rationale: πρὸς pẹ̀lú infinitive oní-artikeli ń tọ́ka sí ète tàbí ìdí tí ẹni náà fi ń wò. “Fẹ́ ẹ” pa ìbòòrò ἐπιθυμέω mọ́, “ní ìfẹ́kúfẹ̀ẹ́” sì mú kí ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ búburú tí àyíká ọ̀rọ̀ ń sọ yé kedere.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: ó ti ṣe panṣágà pẹ̀lú rẹ̀
  rationale: “Ó ti” mú ἤδη àti àbájáde aorist náà jáde ní Yorùbá àdánidá; “ṣe panṣágà pẹ̀lú” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún μοιχεύω pẹ̀lú ẹni tí a tọ́ka sí.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: nínú ọkàn rẹ̀
  rationale: “Ọkàn” jẹ́ ìtumọ̀ ìbílẹ̀ àti àdánidá fún καρδία, ó sì lè dúró fún inú ẹni, èrò àti ìfẹ́-ọkàn rẹ̀.
theological_decisions:
- issue: Bóyá kí γυνή jẹ́ “obìnrin” tàbí “aya” nínú ọ̀rọ̀ nípa panṣágà
  choice: obìnrin
  alternative: aya
  rationale: Gíríìkì kò sọ ipò ìgbéyàwó obìnrin náà ní kedere. “Obìnrin” kò dín ọ̀rọ̀ náà kù ju orísun lọ, nígbà tí àyíká panṣágà ṣì pa ìwọ̀n ìwà rere rẹ̀ mọ́.
- issue: Bóyá kí ἐπιθυμέω jẹ́ “fẹ́” tàbí “ní ìfẹ́kúfẹ̀ẹ́ sí”
  choice: fẹ́ ẹ ní ìfẹ́kúfẹ̀ẹ́
  alternative: ní ìfẹ́kúfẹ̀ẹ́ sí i
  rationale: Ọ̀rọ̀ Gíríìkì ní ìtumọ̀ tí ó gbòòrò ju ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ nìkan lọ, ṣùgbọ́n àyíká yìí fi hàn pé ìfẹ́ búburú ti ìbálòpọ̀ ni. Àkójọpọ̀ ọ̀rọ̀ yìí pa ìbòòrò ọ̀rọ̀ náà àti pàtó àyíká rẹ̀ pọ̀.
- issue: Bóyá πρὸς τὸ ἐπιθυμῆσαι ń sọ ète ẹni tí ń wò tàbí àbájáde wíwo lásán
  choice: pẹ̀lú ète láti
  alternative: tí wíwo náà sì mú kí ó fẹ́ ẹ
  rationale: Ìṣètò πρὸς τό pẹ̀lú infinitive sábà ń fi ète tàbí ìtọ́sọ́nà ìfẹ́-ọkàn hàn; a kò túmọ̀ ọ́ sí ìríran lásán tàbí ìfẹ́ tí ó dé láìròtẹ́lẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. “Panṣágà” pa ọ̀rọ̀ Bíbélì tí àwọn oníṣe Yorùbá mọ̀ mọ́, nígbà tí ìṣètò gbólóhùn náà jẹ́ ti òde òní àti àdánidá.
