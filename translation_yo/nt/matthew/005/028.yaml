- from: Ṣùgbọ́n èmi sọ fún yín pé, olúkúlùkù ẹni tí ó bá wo obìnrin kan[a] pẹ̀lú ète láti fẹ́ ẹ ní ìfẹ́kúfẹ̀ẹ́[b][c], ó ti ṣe panṣágà pẹ̀lú rẹ̀ nínú ọkàn rẹ̀.
  to: Ṣùgbọ́n èmi sọ fún yín pé, olúkúlùkù ẹni tí ó bá wo obìnrin kan[a] láti ní ìfẹ́kúfẹ̀ẹ́ sí i[b][c], ó ti ṣe panṣágà pẹ̀lú rẹ̀ nínú ọkàn rẹ̀.
