  verdict: revise
  source_fidelity: 'The draft correctly represents the emphatic contrast, the generic scope of πᾶς ὁ βλέπων, γυναῖκα as “obìnrin,” the purposive force of πρὸς τὸ + infinitive, the completed force of ἤδη, and the inward location of the act. The rendering of ἐπιθυμῆσαι needs a syntactic adjustment: “fẹ́ ẹ ní ìfẹ́kúfẹ̀ẹ́” is redundant and less idiomatic than a direct purposive expression.'
  naturalness: The sentence is otherwise clear, formal, and natural Standard Yoruba. “Láti ní ìfẹ́kúfẹ̀ẹ́ sí i” is more idiomatic than “fẹ́ ẹ ní ìfẹ́kúfẹ̀ẹ́,” while retaining the contextual sexual sense without making the Greek verb more specific than necessary.
  terminology: “Obìnrin” appropriately preserves the lexical ambiguity of γυνή, with “aya” retained in a footnote. “Ṣe panṣágà pẹ̀lú rẹ̀” is retained as an established biblical-register rendering of μοιχεύω. “Ọkàn” suitably renders καρδία.
  issues:
