id: MAT.5.25
reference: Matthew 5:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: yo
  text: Yára, ní inú rere sí olùfisùn rẹ[a], nígbà tí ìwọ àti òun ṣì wà lójú ọ̀nà, kí olùfisùn náà má bàa fi ọ́ lé adájọ́ lọ́wọ́, kí adájọ́ sì fi ọ́ lé òṣìṣẹ́ ilé ẹjọ́ lọ́wọ́, kí a sì jù ọ́ sínú ẹ̀wọ̀n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí a ṣe lè sọ ọ́ lọ́nà àdánidá nínú ọ̀rọ̀ ẹjọ́, “Yára bá olùfisùn rẹ parí ọ̀rọ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: máa ní inú rere sí
  rationale: Èyí pa ìtumọ̀ ìpìlẹ̀ náà mọ́, ìyẹn pé kí ènìyàn ní èrò rere tàbí inú rere sí ẹnì kejì. Ọ̀rọ̀ “máa” tún fi hàn pé àṣẹ náà ń béèrè ìwà tàbí ìṣe tí ó ń bá a lọ, láì sọ ọ́ di àṣẹ láti ṣe àdéhùn nìkan.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: olùfisùn
  rationale: Àyíká ẹsẹ náà jẹ́ ti ilé ẹjọ́, pẹ̀lú adájọ́, òṣìṣẹ́ ilé ẹjọ́ àti ẹ̀wọ̀n. “Olùfisùn” sọ ipa ẹni tí ń gbé ẹjọ́ sí ẹnì kejì ní kedere, ó sì lè tún un ṣe ní àwọn ibi méjèèjì bí Gíríìkì ṣe ṣe.
- source_word: ταχὺ
  choice: yára
  rationale: “Yára” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìkìlọ̀ pé kí a ṣe ohun náà láìjáfara hàn.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: nígbà tí ìwọ àti òun ṣì wà lójú ọ̀nà
  rationale: Ìtumọ̀ yìí pa àwòrán gidi ti àwọn méjèèjì tí wọ́n wà lójú ọ̀nà mọ́, láìfi “ọ̀nà sí ilé ẹjọ́” kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: μήποτέ
  choice: kí ... má ba à
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìkìlọ̀ tàbí ohun tí a fẹ́ yẹra fún.
- source_word: παραδῷ
  choice: fi ... lé ... lọ́wọ́
  rationale: Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa èrò fífi ẹni kan sí abẹ́ àṣẹ ẹlòmíràn mọ́.
- source_word: κριτῇ / κριτής
  choice: adájọ́
  rationale: “Adájọ́” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún ẹni tó ń dá ẹjọ́.
- source_word: ὑπηρέτῃ
  choice: òṣìṣẹ́ ilé ẹjọ́
  rationale: Nínú ìtẹ̀lé ọ̀rọ̀ ẹjọ́ yìí, ọ̀rọ̀ náà tọ́ka sí òṣìṣẹ́ abẹ́ àṣẹ adájọ́ tó ń mú ìpinnu rẹ̀ ṣẹ. Àfikún “ilé ẹjọ́” mú ipa náà yé kedere láìyan ipò iṣẹ́ kan tó lè jẹ́ ti àṣà òde òní nìkan.
- source_word: εἰς φυλακὴν
  choice: sínú ẹ̀wọ̀n
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìkìlọ̀ pàtàkì inú ẹsẹ náà mu.
- source_word: βληθήσῃ
  choice: kí a sì jù ọ́
  rationale: “Jù” pa agbára àwòrán ọ̀rọ̀ Gíríìkì mọ́ ju ọ̀rọ̀ bí “fi ọ́ sí” lọ. Lílò “a” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí a kò dárúkọ olùṣe rẹ̀, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe wà ní ìṣe àfarajìn.
theological_decisions:
- issue: Bóyá kí a tú àṣẹ ìbẹ̀rẹ̀ náà sí ọ̀rọ̀ àdéhùn ẹjọ́ tàbí kí a pa ìtumọ̀ inú rere rẹ̀ mọ́
  choice: A lo “máa ní inú rere sí” nínú ọ̀rọ̀ pàtàkì.
  alternative: “Yára bá olùfisùn rẹ parí ọ̀rọ̀.”
  rationale: Àyíká ilé ẹjọ́ mú ìtumọ̀ píparí aáwọ̀ tàbí ṣíṣe àdéhùn ṣeé ṣe. Síbẹ̀, εὐνοέω fúnra rẹ̀ ń tọ́ka sí níní inú rere tàbí èrò rere sí ẹnì kejì. Nítorí náà, a pa ìtumọ̀ ìpìlẹ̀ náà mọ́ nínú ọ̀rọ̀ pàtàkì, a sì fi ìtumọ̀ àdánidá ti àyíká ẹjọ́ sí àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí ó yẹ. “Lójú ọ̀nà” pa àwòrán orísun mọ́, “òṣìṣẹ́ ilé ẹjọ́” sì ṣàlàyé ipa ὑπηρέτης láìlo orúkọ ipò iṣẹ́ tó lè jẹ́ ti àṣà kan pàtó.
