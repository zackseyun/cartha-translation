language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: yo
  text: “A sì ti sọ pé, ‘Ẹnikẹ́ni tí ó bá kọ aya rẹ̀ sílẹ̀[a], kí ó fún un ní ìwé ìkọ̀sílẹ̀.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “rán aya rẹ̀ lọ … ìwé ìkọ̀sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “rán lọ” tàbí “fi sílẹ̀,” ṣùgbọ́n nínú àyíká òfin ìgbéyàwó yìí, ó ń tọ́ka sí ìkọ̀sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: A sì ti sọ pé
  rationale: Ìṣe àìṣe ní àkókò tí ó ti kọjá nínú ọ̀nà ìṣáájú ọ̀rọ̀ tí Mátíù máa ń lò ni a túmọ̀ sí ọ̀nà Yorùbá àdánidá yìí; ó fi hàn pé ọ̀rọ̀ tí a ti sọ tẹ́lẹ̀ ni a ń tọ́ka sí.
- source_word: δέ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ Yorùbá tó lè fi ìyípadà tàbí ìyàtọ̀ pẹ̀lẹ́ hàn láìfi ìtakora tí ó lágbára ju ti Gíríìkì lọ sínú ẹsẹ náà.
- source_word: Ὃς ἂν
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Àpapọ̀ yìí ń sọ ipò gbogbogbò tí kò dá lórí ẹni pàtó; ọ̀rọ̀ Yorùbá yìí bá ìtumọ̀ “ẹnikẹ́ni” mu.
- source_word: ἀπολύσῃ
  choice: kọ aya rẹ̀ sílẹ̀
  rationale: Nínú àyíká òfin ìgbéyàwó, ó túmọ̀ sí fífi aya sílẹ̀ tàbí ìkọ̀sílẹ̀. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì tún pa ìtumọ̀ gangan ti ‘rán lọ/firánṣẹ́ kúrò’ mọ́ díẹ̀.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: aya rẹ̀
  rationale: Àyíká ìgbéyàwó àti arọ́pò-orúkọ ohun-ìní mú kí γυνή túmọ̀ sí “aya,” kì í ṣe “obìnrin” lásán.
- source_word: δότω
  choice: mọ̀ọ́ ... fún un
  rationale: Àṣẹ ẹni-kẹta ni; “mọ̀ọ́” fi agbára àṣẹ tàbí ojúṣe hàn ní Yorùbá òde òní lọ́nà àdánidá.
- source_word: αὐτῇ
  choice: fún un
  rationale: Ọ̀rọ̀ yìí sọ pé aya náà ni ẹni tí a gbọ́dọ̀ fún ní ìwé náà.
- source_word: ἀποστάσιον
  choice: ìwé ìkọ̀sílẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìwé òfin tí ń jẹ́rìí sí ìkọ̀sílẹ̀; “ìwé ìkọ̀sílẹ̀” ṣe kedere, ó sì bójú mu ní Yorùbá òde òní.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ Jésù pẹ̀lú ìpèsè òfin Mósè nípa ìkọ̀sílẹ̀
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí àyọlò ọ̀rọ̀ òfin tí a ti sọ tẹ́lẹ̀, láìsọ pé ẹsẹ yìí fúnra rẹ̀ fọwọ́ sí i tàbí tako ó.
  alternative: Kí a túmọ̀ ọ́ bí àṣẹ Jésù tó ń fọwọ́ sí ìlànà ìkọ̀sílẹ̀, tàbí bí àpèjúwe ẹ̀kọ́ tí ó wọ́pọ̀ lásán.
  rationale: Ẹsẹ yìí ṣáájú ìdáhùn Jésù ní ẹsẹ tó tẹ̀ lé e. Ìtumọ̀ kò gbọ́dọ̀ pinnu àríyànjiyàn ẹ̀kọ́ nípa ìkọ̀sílẹ̀ ṣáájú àkókò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “aya” gẹ́gẹ́ bí akọ-abo tó wà nínú orísun, a sì pa ìrísí àyọlò òfin mọ́.
