id: MAT.5.13
reference: Matthew 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: yo
  text: Ẹ̀yin ni iyọ̀ ilẹ̀ ayé. Ṣùgbọ́n bí iyọ̀ bá pàdánù adùn rẹ̀, kí ni a ó fi mú un ní iyọ̀ mọ́? Kò tún wúlò fún ohunkóhun mọ́, bí kò ṣe láti sọ ọ́ síta, kí àwọn ènìyàn sì tẹ̀ ẹ́ mọ́lẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ẹ̀yin ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí dúró gbangba, ó sì ní ìtẹnumọ́ nínú Gíríìkì. “Ẹ̀yin ni” fi ìtẹnumọ́ náà hàn ní Yorùbá àdánidá.
- source_word: τὸ ἅλας τῆς γῆς
  choice: iyọ̀ ilẹ̀ ayé
  rationale: “Ilẹ̀ ayé” mú ìtumọ̀ gbòòrò ti γῆ (“ilẹ̀/ayé”) jáde, ó sì jẹ́ gbólóhùn Yorùbá tó bójú mu fún àkàwé náà.
- source_word: μωρανθῇ
  choice: bá pàdánù adùn rẹ̀
  rationale: Nígbà tí ọ̀rọ̀-ìṣe yìí bá kan iyọ̀, ó túmọ̀ sí pé iyọ̀ ti di aláìní adùn tàbí ti pàdánù ìyọ̀ rẹ̀. Gbólóhùn yìí ṣe kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: kí ni a ó fi mú un ní iyọ̀ mọ́?
  rationale: Èyí pa ìbéèrè nípa ohun tí a lè fi mú iyọ̀ náà ní ìyọ̀ padà mọ́, ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Kò tún wúlò fún ohunkóhun mọ́
  rationale: ἰσχύει níhìn-ín ń tọ́ka sí jíjẹ́ ohun tó wúlò tàbí tó lè ṣiṣẹ́; “wúlò” mú ìtumọ̀ náà jáde ní ṣókí.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: bí kò ṣe láti sọ ọ́ síta
  rationale: “Sọ ọ́ síta” pa ìṣe sísọ ohun náà jáde àti agbára ibi ti ἔξω mọ́.
- source_word: καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: kí àwọn ènìyàn sì tẹ̀ ẹ́ mọ́lẹ̀
  rationale: “Tẹ̀ ẹ́ mọ́lẹ̀” mú àwòrán títẹ ohun kan lábẹ́ ẹsẹ̀ jáde. ἄνθρωποι níhìn-ín jẹ́ gbogbo ènìyàn lápapọ̀, nítorí náà “àwọn ènìyàn” ni ìbámu tó péye.
theological_decisions:
- issue: Ìtumọ̀ àkàwé iyọ̀ tí ó pàdánù adùn
  choice: Pa àkàwé náà mọ́ láìṣàlàyé ẹni tàbí ohun tí ó dúró fún nínú ẹsẹ̀ náà
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí pípàdánù ipa ẹ̀mí tàbí ìjẹ́rìí
  rationale: Ẹsẹ̀ Gíríìkì fúnra rẹ̀ fi àkàwé náà sílẹ̀ fún olùgbọ́ láti lóye nínú ọ̀rọ̀ tó yí i ká; fífi ìtumọ̀ ẹ̀kọ́ kan sínú ọ̀rọ̀ náà yóò ré kọjá ohun tí orísun sọ.
- issue: Àwọn tí wọ́n ń tẹ iyọ̀ náà mọ́lẹ̀ (ὑπὸ τῶν ἀνθρώπων)
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: ἄνθρωποι níhìn-ín ní ìtumọ̀ gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn akọ nìkan. Yorùbá “àwọn ènìyàn” tọ́ka sí gbogbo ènìyàn láìpàdánù ìtumọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀rọ̀ ọlọ́lá, tó ṣe kedere, tó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá òde òní mu. A pa àwòrán iyọ̀, sísọ ọ́ síta, àti títẹ̀ ẹ́ mọ́lẹ̀ mọ́.
