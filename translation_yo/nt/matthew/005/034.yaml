id: MAT.5.34
reference: Matthew 5:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: yo
  text: 'Ṣùgbọ́n èmi sọ fún yín pé, ẹ má ṣe búra rárá: bẹ́ẹ̀ ni ẹ má ṣe búra nípa ọ̀run, nítorí pé ìtẹ́ Ọlọ́run ni;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ṣùgbọ́n èmi sọ fún yín pé
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ δὲ hàn, “èmi” sì pa ìtẹnumọ́ arọ́pò-orúkọ ἐγώ mọ́.
- source_word: μὴ ὀμόσαι ὅλως
  choice: ẹ má ṣe búra rárá
  rationale: Ó sọ ìfòfin sí ìbúra ní kedere; “rárá” mú ὅλως, ‘pátápátá/rárá,’ jáde ní Yorùbá àdánidá.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: bóyá ní ọ̀run
  rationale: Nínú ọ̀rọ̀ ìfòfin, “bóyá” túmọ̀ sí ‘kódà nípa ọ̀run’; “ní ọ̀run” tẹ̀ lé àwòrán orísun ní ti búra ní ohun kan.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: nítorí ìtẹ́ Ọlọ́run ni
  rationale: “Nítorí” mú ìtumọ̀ ìdí ti ὅτι jáde; ìṣètò yìí jẹ́ Yorùbá tó ṣe déédéé, tó sì pa gbólóhùn ‘ìtẹ́ Ọlọ́run’ mọ́.
theological_decisions:
- issue: Ìwọ̀n ìfòfin μὴ ὀμόσαι ὅλως
  choice: ẹ má ṣe búra rárá
  alternative: ẹ má ṣe búra lọ́nà asán
  rationale: Orísun sọ ‘má ṣe búra rárá,’ kò sì fi ọ̀rọ̀ ‘asán’ kún un. A pa ìfòfin gbígbòòrò àti ìṣòro ìtumọ̀ rẹ̀ mọ́ láì dín un kù.
- issue: Ìbáṣepọ̀ ọ̀run sí Ọlọ́run
  choice: nítorí ìtẹ́ Ọlọ́run ni
  alternative: nítorí Ọlọ́run jókòó lórí rẹ̀
  rationale: A pa àpèjúwe gangan pé ọ̀run jẹ́ ìtẹ́ Ọlọ́run mọ́, láì tú un sí ẹ̀kọ́ ìtumọ̀ mìíràn.
translation_notes:
  register: Yorùbá àkànṣe, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Ẹ” bá ọ̀pọ̀ ènìyàn inú ὑμῖν mu. Àmì ìdádúró—dá ìlànà àkọ́kọ́ pọ̀ mọ́ àpẹẹrẹ tí ó tẹ̀ lé e; semicolon fi hàn pé ẹsẹ náà ń bá a lọ.
