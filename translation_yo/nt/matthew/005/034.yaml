    rationale: ‘Bóyá’ túmọ̀ sí ‘whether/perhaps’; μήτε níbí jẹ́ apá ìtẹ̀lé ìfòfin, ‘neither/nor.’ Ìyípadà nílò láti má bà á jẹ́ pé a ń fúnni ní ààyè yíyan.
  - severity: medium
    issue: ‘ní ọ̀run’ fún ἐν τῷ οὐρανῷ
    rationale: Ní ìlò ọ̀rọ̀ búra, a nílò ‘nípa ọ̀run’ láti fi ìtumọ̀ ‘by heaven’ hàn; ‘ní ọ̀run’ dára sí ‘in heaven’.
