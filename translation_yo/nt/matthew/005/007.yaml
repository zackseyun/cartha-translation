  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: yo
  text: Ìbùkún ni fún àwọn aláàánú, nítorí a ó ṣàánú fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn yóò rí àánú gbà.” Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ aláìṣe ọjọ́ iwájú, kò sì dárúkọ ẹni tí yóò ṣàánú fún wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Alábùkún ni
  rationale: Ó ń sọ ipò àwọn tí Ọlọ́run ṣe ojúrere sí, kì í ṣe ìmọ̀lára ayọ̀ lásán; ó sì bá ọ̀nà tí a sábà ń gbà sọ àwọn ọ̀rọ̀ ìbùkún mu.
- source_word: οἱ ἐλεήμονες
  choice: àwọn aláàánú
  rationale: Àpèjúwe náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tí wọ́n máa ń ṣàánú; ‘aláàánú’ jẹ́ kúkúrú, ó sì pa ìsopọ̀ ọ̀rọ̀ àánú mọ́ pẹ̀lú ìlérí tó tẹ̀ lé e.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tàbí ìpìlẹ̀ ìbùkún náà hàn ní Yorùbá adayébá.
- source_word: αὐτοὶ
  choice: wọn
  rationale: Ó tọ́ka pàtó sí àwọn aláàánú náà gẹ́gẹ́ bí àwọn tí yóò rí àánú, láì fi ọ̀rọ̀ àfikún tí yóò mú gbólóhùn náà wúwo sí i.
- source_word: ἐλεηθήσονται
  choice: a ó ṣàánú fún wọn
  rationale: Ọ̀rọ̀ yìí fi ọjọ́ iwájú àti ìṣe tí a ṣe sí wọn hàn. Lílo ‘a’ aláìtọ́ka kò dárúkọ ẹni tó máa ṣàánú, ó sì tún pa àtúnlò gbòǹgbò ọ̀rọ̀ ‘àánú’ mọ́.
theological_decisions:
- issue: Ta ni yóò ṣàánú fún wọn?
  choice: 'A kò dárúkọ olùṣe: “a ó ṣàánú fún wọn.”'
  alternative: Ọlọ́run yóò ṣàánú fún wọn.
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀-ìṣe aláìṣe, kò sì dárúkọ olùṣe. Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà lè tọ́ka sí Ọlọ́run, ìtumọ̀ yìí kò fi ohun tí ẹsẹ náà kò sọ ní gbangba kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa irú gbólóhùn kúkúrú ti àwọn ọ̀rọ̀ ìbùkún mọ́.
