id: MAT.5.47
reference: Matthew 5:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: yo
  text: Bí ẹ̀yin bá sì kí àwọn arákùnrin yín nìkan[a], kí ni ohun àrà ọ̀tọ̀ tí ẹ ń ṣe? Àwọn aláìjẹ́ Júù[b] pàápàá kò ha ṣe bákan náà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin àti arábìnrin yín,” tàbí “àwọn ará yín”; èdè Gíríìkì ní “àwọn arákùnrin,” ṣùgbọ́n ó lè tọ́ka ní gbòòrò sí àwọn tó wà nínú ẹgbẹ́ ẹni.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “àwọn orílẹ̀-èdè” tàbí “àwọn tí kì í ṣe Júù”; ní àwọn àyíká kan, a lè túmọ̀ rẹ̀ sí “àwọn abọ̀rìṣà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: ń kí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ìkíni tàbí ọ̀rọ̀ ìkíni hàn; “kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, láì fi èrò àlejò gbígbà kún un.
- source_word: ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Èdè Gíríìkì jẹ́ akọ ní ọ̀pọ̀, nítorí náà a pa ìtumọ̀ yẹn mọ́ nínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ fi hàn pé ó tún lè tọ́ka sí àwọn ará tàbí ẹgbẹ́ ẹni ní ìtumọ̀ tó gbòòrò.
- source_word: μόνον
  choice: nìkan
  rationale: Ó fi ààlà sí àwọn tí a ń kí; “nìkan” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere níbí.
- source_word: τί περισσὸν ποιεῖτε
  choice: kí ni ẹ̀yin ń ṣe tí ó tayọ?
  rationale: περισσόν tọ́ka sí ohun tó kọjá ohun tí ó wọ́pọ̀ tàbí tó ṣàrà ọ̀tọ̀; “tí ó tayọ” mú agbára ìbéèrè ọ̀rọ̀àsọyé náà jáde ní Yorùbá àdánidá.
- source_word: ἐθνικοὶ
  choice: Àwọn Kèfèrí
  rationale: Ní àyíká Júù yìí, ọ̀rọ̀ náà tọ́ka sí àwọn tí kì í ṣe Júù. “Kèfèrí” ni ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún Gentile, bí ó tilẹ̀ jẹ́ pé ó lè ní ìró ẹ̀sìn tó lágbára síi ní lílò òde òní; ìtumọ̀ míràn wà nínú àlàyé.
- source_word: τὸ αὐτὸ
  choice: bákan náà
  rationale: Gbólóhùn náà túmọ̀ sí “ohun kan náà”; “ṣe bákan náà” jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀδελφοὺς nínú ẹ̀kọ́ ìwà rere
  choice: A túmọ̀ rẹ̀ sí “àwọn arákùnrin” nínú ọ̀rọ̀ pàtàkì.
  alternative: “àwọn arákùnrin àti arábìnrin” tàbí “àwọn ará yín”
  rationale: Èyí pa fọ́ọ̀mù akọ ọ̀pọ̀ ti Gíríìkì mọ́, ṣùgbọ́n àlàyé jẹ́ kí ìtumọ̀ tó lè kan àwọn ọmọ ẹgbẹ́ ẹni lápapọ̀ dúró láì pinnu rẹ̀ ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ ἐθνικοὶ
  choice: A lo “Àwọn Kèfèrí” gẹ́gẹ́ bí ọ̀rọ̀ ìbílẹ̀ Bíbélì Yorùbá fún àwọn tí kì í ṣe Júù.
  alternative: “àwọn tí kì í ṣe Júù” tàbí “àwọn abọ̀rìṣà”
  rationale: Ọ̀rọ̀ Gíríìkì náà ní pàtàkì ń fi àwọn tí kì í ṣe Júù yà sọ́tọ̀; a yẹra fún “àwọn abọ̀rìṣà” nínú ọ̀rọ̀ pàtàkì nítorí ó lè fi ìdájọ́ ẹ̀sìn tó lágbára ju orísun lọ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ náà ní ọlá, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “kò ha” láti pa ìbéèrè ọ̀rọ̀àsọyé οὐχί mọ́, àti “pàápàá” láti mú ìtẹnumọ́ “àwọn Kèfèrí pẹ̀lú” jáde.
