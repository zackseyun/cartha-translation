  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: yo
  text: Alábùkún ni àwọn onírẹ̀lẹ̀[b], nítorí àwọn ni yóò jogún ayé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ilẹ̀’; ó ṣeé ṣe kí gbólóhùn yìí jẹ́ ìṣàtúnisọ sí Sáàmù 37:11, níbi tí a ti lè lóye ìlérí náà ní ọ̀nà ilẹ̀ májẹ̀mú àti ní ìtumọ̀ tó gbòòrò sí i.
    reason: alternative_reading
  - marker: b
    text: Tàbí, ‘àwọn onínú-tútù’; ‘onírẹ̀lẹ̀’ níbí túmọ̀ sí ẹni tó ní ìrẹ̀lẹ̀ àti ìwà tútù, kì í ṣe ẹni aláìlera.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Aláyọ̀ ni
  rationale: Ọ̀nà àdánidá ní Yorùbá fún gbólóhùn ìbùkún; ó tọ́ka sí ipò rere lábẹ́ ojú rere Ọlọ́run, kì í ṣe ìmọ̀lára ayọ̀ lásán.
- source_word: οἱ πραεῖς
  choice: àwọn onírẹ̀lẹ̀
  rationale: Ó ṣàfihàn ìrẹ̀lẹ̀ onínú-tútù tí πραΰς túmọ̀ sí, kì í ṣe àìlera tàbí ẹ̀rù.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tàbí ìdáláre fún ìkéde ìbùkún náà hàn ní Yorùbá òde òní.
- source_word: αὐτοὶ
  choice: àwọn
  rationale: Fífi ọ̀rọ̀ arọ́pò-orúkọ náà síwájú nínú ‘àwọn ni’ pa ìtẹnumọ́ Gíríìkì mọ́ láì wuwo.
- source_word: κληρονομήσουσι
  choice: yóò jogún
  rationale: ‘Jogún’ fi ìtumọ̀ gbígba ohun gẹ́gẹ́ bí ogún hàn, ó sì pa èdè ìlérí ogún mọ́.
- source_word: τὴν γῆν
  choice: ayé
  rationale: ‘Ayé’ jẹ́ ìtumọ̀ gbòòrò àti àdánidá fún γῆ níbí; ‘ilẹ̀’ ṣì ṣeé ṣe nítorí ìṣàtúnsọ Sáàmù 37:11.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ τὴν γῆν
  choice: ayé
  alternative: ilẹ̀
  rationale: γῆ lè túmọ̀ sí gbogbo ayé tàbí ilẹ̀ ìlérí. Àkọ́kọ́ gbé ìlérí náà kalẹ̀ ní ọ̀nà gbòòrò, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ilẹ̀ májẹ̀mú tó ṣeé ṣe nínú Sáàmù 37:11 mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó yé àwọn òǹkàwé òde òní. Àgbékalẹ̀ ‘Aláyọ̀ ni …’ mú ìrísí ìkéde àwọn ìbùkún náà dúró; ‘àwọn ni’ ń pa ìtẹnumọ́ αὐτοὶ mọ́.
