id: MAT.5.26
reference: Matthew 5:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: yo
  text: Lóòótọ́ ni mo sọ fún ọ pé, ìwọ kì yóò jáde kúrò níbẹ̀ rárá títí tí ìwọ yóò fi san ẹyọ owó kódírátì tó kẹ́yìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kódírátì jẹ́ ẹyọ owó Róòmù kékeré kan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìfìdí-ọ̀rọ̀ múlẹ̀ pẹ̀lú ọlá ní Yorùbá, láì fi ‘Àmín’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ tí a kò túmọ̀.
- source_word: λέγω σοι
  choice: mo sọ fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìtọ́kasí tààrà sí ẹni kan.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: dájúdájú, ìwọ kì yóò jáde
  rationale: ‘Dájúdájú’ àti ‘kì yóò’ pa agbára ìkọ̀ emphatic οὐ μή mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐκεῖθεν
  choice: kúrò níbẹ̀
  rationale: Ó sọ ìṣípò kúrò ní ibi náà ní ọ̀nà Yorùbá tó jẹ́ ti ẹ̀dá.
- source_word: ἕως ἂν ἀποδῷς
  choice: títí ìwọ yóò fi san
  rationale: Ilana ‘títí ... yóò fi’ fi ààlà ọjọ́ iwájú hàn, ‘san’ sì bá ọ̀rọ̀ gbèsè mu.
- source_word: τὸν ἔσχατον
  choice: tó kẹ́yìn
  rationale: Ó tọ́ka sí ẹyọ owó ìkẹyìn nínú iye tí a ní láti san, láì fi ìtẹnumọ́ tí kò sí kún un.
- source_word: κοδράντην
  choice: ẹyọ owó kódírátì
  rationale: A pa orúkọ owó Róòmù náà mọ́ ní fífi ohùn Yorùbá pè é, a sì fi ‘ẹyọ owó’ kún un fún òye kedere.
theological_decisions:
- issue: Bóyá kí a tú ọ̀rọ̀ náà ní ọ̀nà tó pinnu pé ó ń tọ́ka sí ìdájọ́ ìkẹyìn, ìwẹ̀nùmọ́ lẹ́yìn ikú, tàbí ẹ̀wọ̀n nítorí gbèsè nìkan.
  choice: A pa àwòrán ẹni tí a há mọ́ nítorí gbèsè mọ́, láì pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan.
  alternative: Kí a tú un gẹ́gẹ́ bí àpẹẹrẹ ìdájọ́ Ọlọ́run tàbí ìwẹ̀nùmọ́ lẹ́yìn ikú.
  rationale: Gíríìkì sọ pé ẹni náà kò ní jáde títí yóò fi san gbogbo rẹ̀; kò sọ ẹ̀kọ́ pàtó nípa ohun tí àwòrán náà dúró fún.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn, tó lọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘kódírátì’ láti pa orúkọ owó ìgbàanì náà mọ́, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
