  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: yo
  text: Ẹ ti gbọ́ pé a sọ pé,[a] ‘Ìwọ kò gbọdọ̀ ṣe panṣágà.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gẹ́lẹ́ sí i, ‘Ẹ gbọ́ pé a sọ pé.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ẹ ti gbọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ aorist indicative, ṣùgbọ́n nínú ọ̀nà ìṣílétí yìí, ‘Ẹ ti gbọ́’ jẹ́ Yorùbá àdánidá tí ó fi ohun tí àwọn olùgbọ́ ti gbà gẹ́gẹ́ bí ẹ̀kọ́ hàn. Ó tún bá ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀ mu.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàgbékalẹ̀ àkóónú ohun tí wọ́n gbọ́, ‘pé’ sì ni asopọ̀ Yorùbá tí ó yẹ.
- source_word: ἐρρέθη
  choice: a ti sọ
  rationale: Passive aorist tí kò dárúkọ ẹni tó sọ ọ́ ni. Yorùbá ‘a ti sọ’ pa àìdárúkọ olùsọ̀rọ̀ mọ́, ó sì jẹ́ àdánidá ju ìtumọ̀ líle bí ‘a ti sọ ọ́’ lọ ní àyíká yìí.
- source_word: Οὐ μοιχεύσεις
  choice: Ìwọ kò gbọdọ̀ ṣe panṣágà
  rationale: Future indicative náà ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ ìdènà. ‘Ìwọ kò gbọdọ̀’ mú ìrísí àṣẹ òfin náà jáde, ‘ṣe panṣágà’ sì jẹ́ ọ̀rọ̀ Yorùbá tó péye, tó sì wọ́pọ̀ fún ìṣe àgbèrè ẹni tó ti ní ọkọ tàbí aya.
theological_decisions:
- issue: Ìbáṣepọ̀ pẹ̀lú àṣẹ inú Òfin Mẹ́wàá
  choice: Ìwọ kò gbọdọ̀ ṣe panṣágà.
  alternative: Má ṣe panṣágà.
  rationale: Ìtumọ̀ yìí pa ìrísí àṣẹ òfin tí Jésù ń tọ́ka sí mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un. Àṣàyàn kejì jẹ́ Yorùbá àdánidá pẹ̀lú, ṣùgbọ́n kò fi ìró àṣẹ òfin náà hàn tó bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. ‘Ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀, nígbà tí ‘Ìwọ’ inú àṣẹ náà pa ọ̀nà tí òfin fi ń bá olúkúlùkù sọ̀rọ̀ mọ́.
