id: MAT.5.9
reference: Matthew 5:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: yo
  text: Alábùkún ni àwọn tí ń mú àlàáfíà wá, nítorí a ó pè wọ́n ní àwọn ọmọ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, ọ̀rọ̀ náà jẹ́ ti akọ ní ọ̀pọ̀, “àwọn ọmọkùnrin Ọlọ́run,” ṣùgbọ́n a lè lò ó pẹ̀lú ìtumọ̀ tó kan gbogbo ọmọ.
    reason: Àṣàyàn ọ̀rọ̀ àti àlàyé nípa èdè ọmọ akọ tó ní agbára aṣojú.
lexical_decisions:
- source_word: μακάριοι
  choice: Alábùkún ni fún
  rationale: Ọ̀nà àdámọ̀ Yorùbá fún ọ̀rọ̀ ìbùkún yìí ni; ó fi ojúrere Ọlọ́run àti ipò rere ẹni hàn ju ọ̀rọ̀ tí yóò túmọ̀ sí ìmọ̀lára ayọ̀ lásán lọ.
- source_word: εἰρηνοποιοί
  choice: àwọn tí ń mú àlàáfíà wá
  rationale: 'Ó sọ ìṣe wọn ní kedere: kì í ṣe àwọn tí wọ́n ní àlàáfíà nìkan, bí kò ṣe àwọn tí wọ́n ń ṣiṣẹ́ láti mú un wá.'
- source_word: ὅτι
  choice: nítorí
  rationale: Ó pa ìtumọ̀ ìdí tàbí ìpìlẹ̀ ìbùkún tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: αὐτοὶ
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì tó láti gbé ìtẹnumọ́ inú àgbékalẹ̀ gbolohun náà.
- source_word: υἱοὶ θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: “Ọmọ” ni ọ̀rọ̀ Yorùbá àdámọ̀ fún ìbátan ọmọ sí òbí, kò sì fi akọ tàbí abo hàn fúnra rẹ̀. Àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀.
- source_word: κληθήσονται
  choice: a ó pè wọ́n ní
  rationale: Ó ṣe àfihàn ọjọ́ iwájú àti ìṣe aláìlórúkọ ti ọ̀rọ̀ Gíríìkì láì túmọ̀ ọ́ sí ìdánimọ̀ láwùjọ nìkan.
theological_decisions:
- issue: Èdè ọmọ akọ nínú υἱοὶ θεοῦ
  choice: ọmọ Ọlọ́run
  alternative: àwọn ọmọkùnrin Ọlọ́run
  rationale: Yorùbá kì í lo “ọmọkùnrin” gẹ́gẹ́ bí ọ̀rọ̀ àpẹẹrẹ fún gbogbo ọmọ lọ́nà àdámọ̀; lílo rẹ̀ nínú àkọ́kọ́ lè mú kí òǹkàwé rò pé àwọn akọ nìkan ni a ń sọ. “Ọmọ Ọlọ́run” pa ìbátan ọmọ àti ipò rẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ ń tọ́ka sí ìrísí akọ ti orísun Gíríìkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Àwọn tí ń mú àlàáfíà wá” jẹ́ àdámọ̀ ju ṣíṣe ọ̀rọ̀ àkópọ̀ tuntun fún “peacemakers” lọ.
