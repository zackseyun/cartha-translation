id: MAT.5.12
reference: Matthew 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: yo
  text: Ẹ yọ̀, kí inú yín sì dùn gidigidi, nítorí ẹ̀san yín pọ̀ ní ọ̀run[a]; nítorí bákan náà ni wọ́n ṣe inúnibíni sí àwọn wòlíì tí wọ́n wà ṣáájú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “ní àwọn ọ̀run.” Mátíù sábà máa ń lo ọ̀rọ̀ náà ní ọ̀pọ̀ níbi tí Yorùbá ti máa ń sọ “ọ̀run” ní ẹyọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: Ẹ yọ̀
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ó pe àwọn olùgbọ́ láti fi ayọ̀ hàn ní kíkún, ó sì bá Yorùbá òde òní mu.
- source_word: ἀγαλλιᾶσθε
  choice: kí inú yín sì dùn gidigidi
  rationale: Ó lágbára ju χαίρετε lọ, nítorí náà ‘gidigidi’ pa ìtẹnumọ́ ayọ̀ ńlá mọ́ ní èdè tó ṣe kedere.
- source_word: μισθὸς
  choice: ẹ̀san
  rationale: Nínú ọ̀rọ̀ nípa inúnibíni àti ohun tí Ọlọ́run yóò fi san padà, ‘ẹ̀san’ dára ju ọ̀rọ̀ tó túmọ̀ sí owó iṣẹ́ lásán lọ.
- source_word: πολὺς
  choice: pọ̀
  rationale: Ó ṣàpèjúwe bí ẹ̀san náà ti tóbi tàbí ti pọ̀; ‘ẹ̀san yín pọ̀’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ní ọ̀run[a]
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì, ẹyọ ‘ọ̀run’ ni Yorùbá máa ń lò lọ́nà àdánidá fún ibùgbé ọ̀run; àlàyé ìsàlẹ̀ fi irú ọ̀pọ̀ inú orísun hàn.
- source_word: οὕτως
  choice: bákan náà
  rationale: Ó so inúnibíni sí àwọn ọmọ-ẹ̀yìn pọ̀ mọ́ irú ohun tí àwọn wòlíì ti fara dà, láì sọ pé gbogbo kúlẹ̀kúlẹ̀ wọn jẹ́ ọ̀kan náà.
- source_word: ἐδίωξαν
  choice: wọ́n ṣe inúnibíni sí
  rationale: Nínú àyíká yìí, διώκω túmọ̀ sí lílépa tàbí ṣíṣe ènìyàn ní ibi nítorí ohun tí ó dúró fún; ‘ṣe inúnibíni sí’ sọ ìtumọ̀ ọ̀tá náà kedere.
- source_word: προφήτας
  choice: àwọn wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn aṣojú Ọlọ́run tí ó sọ ọ̀rọ̀ rẹ̀.
- source_word: τοὺς πρὸ ὑμῶν
  choice: tí wọ́n wà ṣáájú yín
  rationale: Ó pa ìtumọ̀ pé àwọn wòlíì náà ti wà ṣáájú àwọn olùgbọ́ nínú ìtàn mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ‘ní àwọn ọ̀run’
  choice: ní ọ̀run
  alternative: ní àwọn ọ̀run
  rationale: Ìyàtọ̀ náà jẹ́ ti èdè, kì í ṣe yíyan ẹ̀kọ́ ìgbàgbọ́ kan. Yorùbá sábà máa ń lo ‘ọ̀run’ ní ẹyọ fún ibùgbé ọ̀run, nígbà tí àlàyé ìsàlẹ̀ ń pa irú ọ̀pọ̀ Gíríìkì mọ́.
- issue: Ìbáṣepọ̀ οὕτως pẹ̀lú inúnibíni àwọn wòlíì
  choice: bákan náà
  alternative: lọ́nà yìí
  rationale: ‘Bákan náà’ fi ìfiwéra tí àyíká ọ̀rọ̀ ń béèrè hàn, láì ṣàfikún ìtumọ̀ pé irú inúnibíni náà bá ara mu ní gbogbo ọ̀nà.
translation_notes:
  register: A lo Yorùbá àjọṣe tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àṣẹ ọ̀pọ̀ ẹni ‘Ẹ’ àti àmì ohùn ni a lò ní kíkún; a yẹra fún ọ̀rọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan pàtó.
