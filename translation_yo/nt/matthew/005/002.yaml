    text: 'Tàbí, ní ìtumọ̀ tí ó sún mọ́ ìrísí ọ̀rọ̀ ìpilẹ̀ṣẹ̀: “Ó sì ti la ẹnu rẹ̀, ó ń kọ́ wọn, ó ní.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: A lo “sì” gẹ́gẹ́ bí àsopọ̀ ìtàn tó bá καί mu, láì fi ìtumọ̀ àkókò tó lágbára bí “lẹ́yìn náà” kún un.
- source_word: ἀνοίξας
  choice: la
  rationale: Ọ̀rọ̀ àìpẹ́ aorist yìí túmọ̀ ní ti gidi sí “nígbà tí ó la”; ṣíṣe e ní ọ̀rọ̀-ìṣe tó tẹ̀ lé ara wọn jẹ́ èdè Yorùbá àdánidá, ó sì pa àwòrán ìpilẹ̀ṣẹ̀ mọ́.
- source_word: τὸ στόμα αὐτοῦ
  choice: ẹnu rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún “ẹnu rẹ̀,” ó sì pa ọ̀nà ọ̀rọ̀ tí ń ṣí ọ̀rọ̀ pàtàkì sílẹ̀ mọ́.
- source_word: ἐδίδασκεν
  choice: ó sì ń kọ́ wọn
  rationale: Àmì “ń” fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì bá abala imperfect ti ọ̀rọ̀ Gíríìkì mu láì sọ pé ìṣe náà ṣẹ̀ṣẹ̀ bẹ̀rẹ̀.
- source_word: αὐτοὺς
  choice: wọn
  rationale: A pa arọ́pò-orúkọ náà mọ́, láì pinnu nínú ẹsẹ yìí nìkan bóyá àwọn ọmọ-ẹ̀yìn tàbí gbogbo ènìyàn ni.
- source_word: λέγων
  choice: ó ní
  rationale: Nínú Yorùbá ìtàn, “ó ní” ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ tí ó tẹ̀ lé sílẹ̀; ó mú iṣẹ́ participle λέγων ṣẹ láì mú gbolohun náà le.
