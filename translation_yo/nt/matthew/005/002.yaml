translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán “la ẹnu rẹ̀” àti ìṣe tó ń lọ nínú ἐδίδασκεν mọ́; a sì lo “ó ní” dípò “ó ń wí pé” nítorí pé ó jẹ́ ọ̀nà Yorùbá tó rọrùn jù lọ láti ṣí àyọkà ọ̀rọ̀ taara sílẹ̀.
