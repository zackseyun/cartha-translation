id: MAT.5.17
reference: Matthew 5:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: yo
  text: “Ẹ má ṣe rò pé mo wá[a] láti fagilé Òfin tàbí Àwọn Wòlíì; èmi kò wá láti fagilé wọn, bí kò ṣe láti mú wọn ṣẹ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ti wá,” ní ibi méjèèjì tí “mo wá” ti fara hàn.
    reason: lexical_alternative
  - marker: b
    text: “Mú wọn ṣẹ” tún lè ní ìtumọ̀ “mú wọn dé ìparí” tàbí “mú wọn hàn ní ẹ̀kúnrẹ́rẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Ẹ má ṣe rò
  rationale: Ọ̀rọ̀ yìí jẹ́ ìkìlọ̀ fún ọ̀pọ̀ ènìyàn, ó sì túmọ̀ sí ‘ẹ má ṣe rò.’ Ó bá èdè Yorùbá òde òní mu, ó sì pa agbára ìfòfinró inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἦλθον
  choice: mo wá
  rationale: Aorist Gíríìkì náà lè jẹ́ ‘mo wá’ ní Yorùbá láìfi ìtumọ̀ míì kún un. ‘Mo ti wá’ tún ṣeé ṣe, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
- source_word: καταλῦσαι
  choice: láti fagi lé
  rationale: Níbi tí ọ̀rọ̀ náà ti ń tọ́ka sí Òfin àti Àwọn Wòlíì, ‘fagi lé’ sọ ìtumọ̀ fífi ohun kan sí ẹ̀gbẹ́, sọ ọ́ di asán, tàbí fòpin sí agbára rẹ̀, dípò ìparun ohun ti ara.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: Òfin tàbí Àwọn Wòlíì
  rationale: Àwọn lẹ́tà ńlá fi hàn pé gbólóhùn yìí ń tọ́ka sí àwọn apá Ìwé Mímọ́ Ísírẹ́lì, kì í ṣe òfin tàbí àwọn wòlíì lápapọ̀. ‘Tàbí’ sì pa ἢ mọ́.
- source_word: ἀλλὰ πληρῶσαι
  choice: bí kò ṣe láti mú wọn ṣẹ
  rationale: ‘Mú ... ṣẹ’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pípé ohun tí a ti sọ tàbí ohun tí a pinnu. ‘Wọn’ ń tọ́ka padà sí Òfin àti Àwọn Wòlíì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbòòrò πληρόω mọ́.
theological_decisions:
- issue: Ìtumọ̀ πληρῶσαι nípa ìbáṣepọ̀ Jésù pẹ̀lú Òfin àti Àwọn Wòlíì
  choice: mú wọn ṣẹ
  alternative: mú wọn dé ìparí; mú wọn hàn ní ẹ̀kúnrẹ́rẹ́; fi ìdí wọn múlẹ̀
  rationale: A kò fi ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ náà. ‘Mú wọn ṣẹ’ jẹ́ gbólóhùn tó gbòòrò tó lè gba ìtumọ̀ mímú dé ète rẹ̀, mímú dé ìparí, tàbí fífi hàn ní ẹ̀kúnrẹ́rẹ́, láìyanju gbogbo ìjàmbá ìtumọ̀ náà ní ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ’ fi hàn pé Jésù ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀. A lo ‘fagi lé’ gẹ́gẹ́ bí ọ̀rọ̀ tó yé àwọn ènìyàn lónìí fún fífi òfin tàbí àṣẹ sílẹ̀, a sì lo ‘Òfin’ àti ‘Àwọn Wòlíì’ gẹ́gẹ́ bí orúkọ àwọn apá Ìwé Mímọ́.
