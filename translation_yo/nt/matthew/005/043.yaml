  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: yo
  text: “Ẹ ti gbọ́ pé a ti sọ pé[a], ‘Fẹ́ràn aládùúgbò rẹ, kí o sì kórìíra ọ̀tá rẹ.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Apá àkọ́kọ́ ń sọ àsọtúnsọ Lefitiku 19:18; apá kejì (“kí o sì kórìíra ọ̀tá rẹ”) kì í ṣe àyọlò tààrà láti inú Májẹ̀mú Láéláé, ṣùgbọ́n ó ń fi ìkọ́ni tí a ti gbà hàn, èyí tí Jésù ń ṣàtúnṣe.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ẹ ti gbọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ohun tí àwọn olùgbọ́ ti gbọ́ tẹ́lẹ̀, ó sì bá ọ̀nà àdánidá tí a fi ń sọ ọ́ ní Yorùbá mu.
- source_word: ἐρρέθη
  choice: a ti sọ pé
  rationale: Èyí pa ìrísí aláìlórúkọ ẹni tó sọ̀rọ̀ mọ́, láì sọ ẹni tí Gíríìkì kò dárúkọ.
- source_word: Ἀγαπήσεις
  choice: Kí ìwọ kí ó fẹ́ràn
  rationale: Ọ̀nà yìí fi ipa àṣẹ inú ọ̀rọ̀ ọjọ́ iwájú Gíríìkì hàn ní Yorùbá tó ṣe kedere, ó sì tẹnumọ́ ẹni tí àṣẹ náà kàn.
- source_word: τὸν πλησίον σου
  choice: aládùúgbò rẹ
  rationale: ‘Aládùúgbò’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni ẹlẹgbẹ́ ẹni nínú ọ̀rọ̀ ìwà rere yìí, ó sì bá ìtọ́kasí sí Lefitiku 19:18 mu.
- source_word: μισήσεις
  choice: kí o sì kórìíra
  rationale: Èyí ń bá agbára àṣẹ inú gbólóhùn àkọ́kọ́ lọ, ó sì túmọ̀ μισέω ní tààrà gẹ́gẹ́ bí ‘kórìíra.’
- source_word: τὸν ἐχθρόν σου
  choice: ọ̀tá rẹ
  rationale: ‘Ọ̀tá’ ni ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì yẹ fún ìyàtọ̀ ìwà rere tí ẹsẹ yìí gbé kalẹ̀.
theological_decisions:
- issue: Ipò gbólóhùn náà, ‘kí o sì kórìíra ọ̀tá rẹ’
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí apá kan nínú ọ̀rọ̀ tí Jésù sọ pé àwọn olùgbọ́ rẹ ti gbọ́.
  alternative: Kí a mú gbogbo ọ̀rọ̀ náà bí àyọlò tààrà láti inú Ìwé Mímọ́, tàbí kí a ṣàlàyé nínú ọ̀rọ̀ pàtàkì pé apá kejì jẹ́ àṣà ìkọ́ni nìkan.
  rationale: Gíríìkì gbé e kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ kan ṣoṣo tí ‘Ẹ ti gbọ́ pé a ti sọ pé’ ṣáájú rẹ. Síbẹ̀, apá kejì kì í ṣe àṣẹ tààrà láti inú Májẹ̀mú Láéláé; àlàyé ìsàlẹ̀ ni ó ṣàlàyé ìyàtọ̀ yìí láì yí ọ̀rọ̀ Jésù padà.
translation_notes:
  register: Yorùbá àkànṣe tó ní ọlá, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo ‘Ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí Gíríìkì ṣe fi hàn, ṣùgbọ́n ‘ìwọ/rẹ’ wà nínú àyọlò náà nítorí àwọn ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì jẹ́ ẹyọ.
