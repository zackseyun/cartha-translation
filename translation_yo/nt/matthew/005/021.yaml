id: MAT.5.21
reference: Matthew 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: yo
  text: “Ẹ ti gbọ́ pé a sọ fún àwọn ènìyàn ìgbàanì[a] pé, ‘Ìwọ kò gbọdọ̀ ṣe ìpànìyàn[b]; ẹnikẹ́ni tí ó bá ṣe ìpànìyàn yóò sì ní láti dojú kọ ìdájọ́.’[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn ìgbà àtijọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní àṣà, “Ìwọ kò gbọdọ̀ pànìyàn”; ṣùgbọ́n ọ̀rọ̀ Gíríìkì níhìn-ín túmọ̀ sí ìpànìyàn ní pàtó, kì í ṣe gbogbo irú pípa.
    reason: lexical_alternative
  - marker: c
    text: A tún lè dópin ọ̀rọ̀ àyọlò náà lẹ́yìn “ìpànìyàn,” kí apá tó bẹ̀rẹ̀ ní “ẹnikẹ́ni” jẹ́ àbájáde òfin tó tẹ̀ lé e.
    reason: previous_rendering
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ẹ ti gbọ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹ̀kọ́ tí ọ̀pọ̀ olùgbọ́ ti gbọ́ tí wọ́n sì mọ̀; “Ẹ” tún fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀.
- source_word: ἐρρέθη
  choice: a sọ
  rationale: Ìtumọ̀ aláìdárúkọ ẹni tó sọ̀rọ̀ ni èyí, ó sì yẹra fún fífi Ọlọ́run tàbí Mósè sípò gẹ́gẹ́ bí ẹni tí Gíríìkì kò dárúkọ níhìn-ín.
- source_word: τοῖς ἀρχαίοις
  choice: fún àwọn ènìyàn ìgbàanì
  rationale: Ó pa ìtumọ̀ dative mọ́ pé àwọn ènìyàn ayé àtijọ́ ni a sọ ọ̀rọ̀ náà fún, kì í ṣe pé àwọn ni wọ́n sọ ọ́.
- source_word: Οὐ φονεύσεις
  choice: Ìwọ kò gbọdọ̀ ṣe ìpànìyàn
  rationale: φονεύω túmọ̀ sí pípa ènìyàn lọ́nà ìpànìyàn, kì í ṣe gbogbo irú pípa. “Kò gbọdọ̀” gbé agbára òfin ìfòfindè náà jáde ní Yorùbá àdánidá.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: ẹnikẹ́ni tí ó bá sì ṣe ìpànìyàn
  rationale: “Ẹnikẹ́ni tí ó bá” fi ipò gbogbogbò tí relative clause pẹ̀lú ἄν àti subjunctive ń sọ hàn lọ́nà Yorùbá tó wọ́pọ̀.
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: yóò ní láti dojú kọ ìdájọ́
  rationale: Ó fi ojúṣe ẹni náà láti dáhùn sí ìdájọ́ hàn láìsọ κρίσις di ilé-ẹjọ́ pàtó kan tàbí ìdálẹ́bi ìkẹyìn.
theological_decisions:
- issue: Ìtumọ̀ òfin kẹfà tí a fa yọ
  choice: ṣe ìpànìyàn
  alternative: pani
  rationale: Ọ̀rọ̀ Gíríìkì φονεύω kéré sí “pani” ní ìtẹ́wọ́gbà ìtumọ̀, nítorí ó ń tọ́ka sí murder, kì í ṣe gbogbo pípa láìsí ìyàtọ̀.
- issue: Ẹni tí a sọ ọ̀rọ̀ náà fún
  choice: fún àwọn ènìyàn ìgbàanì
  alternative: láti ọ̀dọ̀ àwọn ènìyàn ìgbàanì
  rationale: Dative τοῖς ἀρχαίοις tọ́ka sí àwọn olùgbà ọ̀rọ̀ náà. A kò yí i padà sí pé àwọn ènìyàn ìgbàanì ni orísun ọ̀rọ̀ náà.
- issue: Ìwọ̀n ọ̀rọ̀ àyọlò
  choice: Òfin àti àbájáde ìdájọ́ wà nínú ọ̀rọ̀ àyọlò kan ṣoṣo
  alternative: Kí ọ̀rọ̀ àyọlò dópin lẹ́yìn òfin nìkan
  rationale: Àmì ìdádúró inú Gíríìkì lè jẹ́ kí a ka gbogbo ẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ kan tí wọ́n ti gbọ́, ṣùgbọ́n bí ọ̀rọ̀ àyọlò ṣe gùn tó kò dájú pátápátá.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá, a sì yà “Ẹ” (ọ̀pọ̀ olùgbọ́) sí “Ìwọ” (ẹni kọ̀ọ̀kan nínú òfin) gẹ́gẹ́ bí Gíríìkì ṣe yà wọ́n.
