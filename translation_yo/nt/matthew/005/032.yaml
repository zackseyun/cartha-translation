id: MAT.5.32
reference: Matthew 5:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: yo
  text: Ṣùgbọ́n èmi sọ fún yín pé, ẹnikẹ́ni tí ó bá kọ aya rẹ̀ sílẹ̀, bí kò ṣe nítorí ọ̀ràn ìwà ìbálòpọ̀ tí kò bófin mu[a], ó mú kí aya rẹ̀ ṣe panṣágà[b]; ẹni tí ó bá sì fẹ́ obìnrin tí a ti kọ̀ sílẹ̀, ó ṣe panṣágà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Ìwà ìbálòpọ̀ tí kò bófin mu’ ni a fi túmọ̀ ọ̀rọ̀ Gíríìkì porneia, ọ̀rọ̀ gbígbòòrò fún ìwà ìbálòpọ̀ tí kò tọ́; àwọn mìíràn túmọ̀ ọ́ sí ‘àgbèrè’ tàbí ‘ìwà àìmọ́.’
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ìrísí Gíríìkì jù: ‘ó mú kí aya rẹ̀ di panṣágà.’ Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ohùn àìṣeṣe ní ìrísí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: kọ … sílẹ̀ / obìnrin tí a ti kọ̀ sílẹ̀
  rationale: Nínú ọ̀ràn ìgbéyàwó, ἀπολύω túmọ̀ sí kíkọ aya sílẹ̀ tàbí ìkọ̀sílẹ̀, kì í ṣe fífi ẹni ránṣẹ́ lọ lásán. Àwọn ọ̀rọ̀ méjèèjì pa ìtumọ̀ ìgbéyàwó àti òfin mọ́.
- source_word: γυναῖκα
  choice: aya
  rationale: Bí ó tilẹ̀ jẹ́ pé γυνή lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya,’ ọ̀rọ̀ arọ́pò ohun-ìní αὐτοῦ àti ọ̀rọ̀ ìkọ̀sílẹ̀ fi hàn pé ‘aya’ ni ìtumọ̀ rẹ̀ níbí.
- source_word: παρεκτὸς λόγου πορνείας
  choice: bí kò ṣe nítorí ìṣekúṣe nípa ìbálòpọ̀
  rationale: παρεκτός fi ohun tí a yọ sílẹ̀ hàn, λόγου sì ní agbára ‘ìdí’ tàbí ‘ọ̀ràn.’ ‘Ìṣekúṣe nípa ìbálòpọ̀’ pa ìtumọ̀ gbígbòòrò πορνεία mọ́ láì dín in kù sí panṣágà nìkan.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: ó mú kí aya náà ṣe panṣágà
  rationale: ποιέω pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ń fi ìmúṣẹ tàbí ìfa ohun kan hàn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìrísí àìṣeṣe ti μοιχευθῆναι mọ́.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: ẹni tí ó bá … fẹ́
  rationale: Gbólóhùn aláropò pẹ̀lú ἐάν ń sọ ipò gbogbogbò tí kò dá lórí ẹni kan pàtó; ‘ẹni tí ó bá … fẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi èyí hàn.
- source_word: μοιχᾶται
  choice: ó ṣe panṣágà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ láti sọ pé ẹnì kan hùwà àgbèrè sí ọkọ tàbí aya.
- source_word: πᾶς ὁ ἀπολύων
  choice: ẹnikẹ́ni tí ó bá kọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ alábápín akọ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí gbólóhùn gbogbogbò. ‘Ẹnikẹ́ni tí ó bá kọ’ fi agbára gbogbogbò náà hàn, ‘aya rẹ̀’ sì pa ipò ọkùnrin nínú àyíká ọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ìyọkúrò παρεκτὸς λόγου πορνείας
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìyọkúrò gidi: ‘bí kò ṣe nítorí ìṣekúṣe nípa ìbálòpọ̀.’'
  alternative: ‘bí kò ṣe nínú ọ̀ràn ìgbéyàwó tí kò bófin mu’ tàbí ‘bí kò ṣe nítorí àgbèrè’
  rationale: Gíríìkì fi ìyọkúrò hàn ní tààrà, ṣùgbọ́n kò yẹ kí ìtumọ̀ túmọ̀ πορνεία sí irú ẹ̀ṣẹ̀ ìbálòpọ̀ kan ṣoṣo. Èyí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ lórí ààlà gbólóhùn náà mọ́.
- issue: Agbára μοιχευθῆναι lẹ́yìn ποιεῖ
  choice: A lo gbólóhùn àdánidá ‘ó mú kí aya náà ṣe panṣágà’ nínú ẹsẹ̀, a sì fi ìtumọ̀ tó sún mọ́ ìrísí àìṣeṣe sínú àlàyé ìsàlẹ̀.
  alternative: ‘ó mú kí aya náà di panṣágà’ tàbí ‘ó mú kí a ṣe panṣágà sí i’
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ àìṣeṣe ní ìrísí, àwọn olùtumọ̀ sì ń jíròrò bóyá agbára rẹ̀ jẹ́ ṣíṣe panṣágà tàbí dídì ẹni panṣágà. Gbólóhùn pàtàkì jẹ́ kedere ní Yorùbá, àlàyé ìsàlẹ̀ sì yàgò fún píparí àríyànjiyàn náà láìsọ.
translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. ‘Kọ aya … sílẹ̀’ jẹ́ gbólóhùn àdánidá fún ìkọ̀sílẹ̀; ‘ìṣekúṣe nípa ìbálòpọ̀’ sì yàtọ̀ sí ‘panṣágà’ kí ìtumọ̀ gbígbòòrò πορνεία má bàa dín kù.
