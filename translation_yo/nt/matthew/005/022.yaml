id: MAT.5.22
reference: Matthew 5:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: yo
  text: Ṣùgbọ́n èmi ń sọ fún yín pé, ẹnikẹ́ni tí ó bá ń bínú sí arákùnrin rẹ̀ yóò wà nínú ewu ìdájọ́[a]; ẹni tí ó bá sì sọ fún arákùnrin rẹ̀ pé, ‘Rákà,’[b] yóò wà nínú ewu ìgbìmọ̀ ìdájọ́[c]; ẹni tí ó bá sì sọ pé, ‘Òmùgọ̀!’ yóò wà nínú ewu iná Gẹhẹ́nà.[d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan fi ‘láìsí ìdí’ kún un lẹ́yìn ‘ń bínú sí arákùnrin rẹ̀.’ Àwọn ẹ̀rí ìwé àfọwọ́kọ àkọ́kọ́ tí ó sì lágbára jù kò ní ọ̀rọ̀ náà.
    reason: textual_variant
  - marker: b
    text: ‘Rákà’ jẹ́ ọ̀rọ̀ ẹ̀gàn Aramaiki; ó fẹ́rẹ̀ẹ́ túmọ̀ sí ‘orí òfo’ tàbí ‘ẹni tí kò wúlò.’
    reason: cultural_note
  - marker: c
    text: Ó tún lè jẹ́ ‘Sanhẹ́dírìn,’ ìgbìmọ̀ alákòóso àwọn Júù.
    reason: alternative_reading
  - marker: d
    text: ‘Arákùnrin’ tú ọ̀rọ̀ akọ ẹyọ kan; ọ̀rọ̀ náà lè dúró fún ẹnìkejì lápapọ̀, kì í ṣe arákùnrin ọkùnrin nìkan.
    reason: lexical_alternative
  - marker: e
    text: Ó tún lè jẹ́ ‘iná ọ̀run àpáàdì.’ ‘Gẹhẹ́nà’ pa ọ̀rọ̀ pàtó tí Jésù lò mọ́; ó wá láti inú àwòrán Àfonífojì Hínómù tí ó ní ìbáṣepọ̀ pẹ̀lú ìdájọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ṣùgbọ́n èmi sọ fún yín pé
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ δέ jáde, ‘èmi’ sì pa ìtẹnumọ́ ἐγώ mọ́ ní Yorùbá àdánidá.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: ẹnikẹ́ni tí ó bá ń bínú
  rationale: Ó fi ìtumọ̀ gbogbogbò ti participle ìsinsìnyí hàn láì fi àlàyé asiko tí kò sí nínú Gíríìkì kún un.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: sí arákùnrin rẹ̀
  rationale: ‘Sí’ bá dative lẹ́yìn ọ̀rọ̀ ìbínú mu; ‘arákùnrin’ pa akọ ẹyọ ἀδελφός mọ́, nígbà tí àlàyé ìlò aṣojú rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: ἔνοχος ἔσται
  choice: yóò jẹ́ ẹni tí … lè dé bá / lè dá lẹ́bi
  rationale: Àwọn gbólóhùn wọ̀nyí sọ jíjíyọ sí ìdájọ́ tàbí ẹ̀bi ní Yorùbá àdánidá, wọ́n sì pa àwòrán ti ilé-ẹjọ́ mọ́.
- source_word: τῇ κρίσει
  choice: ìdájọ́
  rationale: Ó pa àìdánilójú mọ́ bóyá ọ̀rọ̀ náà tọ́ka sí ilé-ẹjọ́ kan pàtó tàbí sí ìlànà ìdájọ́.
- source_word: Ῥακά
  choice: Rákà
  rationale: A ṣe àkọsílẹ̀ ohùn ọ̀rọ̀ Aramaiki náà dípò títú ìtumọ̀ ẹ̀gàn rẹ̀ sínú ọ̀rọ̀ pàtàkì; àlàyé wà ní ìsàlẹ̀.
- source_word: τῷ συνεδρίῳ
  choice: ìgbìmọ̀ ìdájọ́
  rationale: Ó tú ìtumọ̀ gbogbogbò ‘council’ jáde láì pinnu dandan pé Sanhedrin ńlá ni.
- source_word: Μωρέ
  choice: Òmùgọ̀!
  rationale: Ó jẹ́ ọ̀rọ̀ ẹ̀gàn tààrà tí ó bá vocative Gíríìkì mu, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: iná Gẹhẹ́nà lè dé bá
  rationale: ‘Gẹhẹ́nà’ pa ọ̀rọ̀ ìtàn àti àwòrán Jùù mọ́; ‘iná’ pa τοῦ πυρός mọ́ nínú gbólóhùn Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ γέεννα
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì / iná ọ̀run àpáàdì
  rationale: Yíyan ‘Gẹhẹ́nà’ pa ìpilẹ̀ ọ̀rọ̀ náà nínú Àfonífojì Hínómù àti àwòrán ìdájọ́ mọ́, láì kó gbogbo èrò ẹ̀kọ́ ìgbà tó tẹ̀ lé e wọ inú ọ̀rọ̀ náà.
- issue: Akọ ẹyọ ἀδελφός
  choice: arákùnrin
  alternative: arákùnrin tàbí arábìnrin / ọmọ ìjọ ẹlẹgbẹ́
  rationale: Ọ̀rọ̀ pàtàkì pa akọ ẹyọ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ṣàlàyé pé ó lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ aṣojú fún àwọn ẹlòmíràn pẹ̀lú.
- issue: Ìpele àwọn ìkìlọ̀ ìdájọ́ mẹ́ta
  choice: Pa ìfarajọ àti ìlọsíwájú wọn mọ́ láì ṣàlàyé ìbáṣepọ̀ wọn ju ohun tí ọ̀rọ̀ sọ lọ
  alternative: Ka gbogbo wọn sí ìpele ìjìyà mẹ́ta pàtó tàbí sí ọ̀nà mẹ́ta ti sísọ ohun kan náà
  rationale: Ọ̀rọ̀ Gíríìkì ní ìfarajọ tó lágbára, ṣùgbọ́n kò tú bí gbogbo ìpele náà ṣe ní í ṣiṣẹ́ ní ẹ̀kọ́ ìdájọ́; ìtumọ̀ kò yẹ kí ó yanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘yín’ fún plural ὑμῖν. A kọ ‘Rákà’ àti ‘Gẹhẹ́nà’ ní ọ̀nà tí olùkà Yorùbá lè pè, nígbà tí àwọn àlàyé ìsàlẹ̀ pa ìtàn àti àṣà orísun wọn mọ́.
