id: MAT.5.29
reference: Matthew 5:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: yo
  text: Ṣùgbọ́n bí ojú ọ̀tún rẹ bá ń mú ọ kọsẹ̀[a], yọ ọ́ jáde, kí o sì sọ ọ́ nù kúrò lọ́dọ̀ rẹ. Nítorí ó sàn fún ọ kí ọ̀kan nínú àwọn ẹ̀yà ara rẹ ṣègbé ju kí a sọ gbogbo ara rẹ sínú Gẹhẹ́nà[b] lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ń mú ọ dẹ́ṣẹ̀.”'
    reason: lexical_alternative
  - marker: b
    text: Gẹhẹ́nà ni ìrísí Gíríìkì orúkọ kan tó ní ìbáṣepọ̀ pẹ̀lú Àfonífojì Hínómù; ní àṣà ìtumọ̀ Bíbélì, a sábà máa ń pè é ní “ọ̀run àpáàdì.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ń mú ọ kọsẹ̀
  rationale: Ó pa àwòrán ìkọsẹ̀ inú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá; ní àyíká yìí ó tún lè túmọ̀ sí mímú ènìyàn dẹ́ṣẹ̀.
- source_word: ἔξελε
  choice: yọ ọ́ jáde
  rationale: Àṣẹ náà lágbára, ó sì ń sọ nípa yíyọ ojú kúrò ní ipò rẹ̀; ọ̀rọ̀ yìí ṣe kedere láì sọ àwòrán náà di ẹlẹ́rù ju orísun lọ.
- source_word: βάλε ἀπὸ σοῦ
  choice: sọ ọ́ nù kúrò lọ́dọ̀ rẹ
  rationale: Ó fi agbára àṣẹ βάλε àti ìyapa tí ἀπὸ σοῦ ń tọ́ka sí hàn.
- source_word: συμφέρει
  choice: ó sàn fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ohun tó jẹ́ àǹfààní tàbí tó dára jù fún ẹnì kan.
- source_word: ἀπόληται
  choice: ṣègbé
  rationale: Ó pa ìwúwo ìtumọ̀ pípadànù tàbí ìparun mọ́ láì pinnu ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: μελῶν
  choice: àwọn ẹ̀yà ara
  rationale: Ó túmọ̀ sí àwọn apá ara, ó sì bá ojú mu dáadáa ju ‘ọwọ́ tàbí ẹsẹ̀’ lọ.
- source_word: βληθῇ
  choice: kí a sọ
  rationale: Ìṣe aláìsọ ẹni tó ṣe é yìí pa ohùn àìṣe-taara Gíríìkì mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: γέενναν
  choice: Gẹhẹ́nà
  rationale: A pa orúkọ pàtó Gíríìkì náà mọ́, dípò yíyanjú gbogbo ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ pẹ̀lú ‘ọ̀run àpáàdì.’
- source_word: ὁ δεξιὸς
  choice: ọ̀tún
  rationale: Ó pa àlàyé pàtó pé ojú ọ̀tún ni orísun mẹ́nu kàn mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtẹ̀síwájú pẹ̀lú ìyàtọ̀ díẹ̀ sí ọ̀rọ̀ tó ṣáájú hàn.
theological_decisions:
- issue: Ìtumọ̀ γέεννα
  choice: Gẹhẹ́nà
  alternative: ọ̀run àpáàdì
  rationale: Pípa Gẹhẹ́nà mọ́ ń dáàbò bo ọ̀rọ̀ pàtó tí orísun lò àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Àfonífojì Hínómù, láì fi àwọn ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó dé lẹ́yìn kún un.
- issue: Agbára àwòrán σκανδαλίζω
  choice: ń mú ọ kọsẹ̀
  alternative: ń mú ọ dẹ́ṣẹ̀
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa àwòrán ìkọsẹ̀ inú orísun mọ́; àyíká ẹsẹ̀ náà fi hàn pé ẹ̀ṣẹ̀ wà nínú ohun tí àwòrán náà ń tọ́ka sí, nítorí náà a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa àṣẹ líle àti ìfiwéra tó wà nínú orísun mọ́, ṣùgbọ́n ó yẹra fún èdè àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn tí orísun kò sọ ní tààrà.
