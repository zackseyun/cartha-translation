  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: yo
  text: Ṣùgbọ́n kí ọ̀rọ̀ yín jẹ́ ‘Bẹ́ẹ̀ ni, bẹ́ẹ̀ ni,’ tàbí ‘Bẹ́ẹ̀ kọ́, bẹ́ẹ̀ kọ́.’ Ohunkóhun tí ó ju wọ̀nyí lọ jẹ́ láti ọ̀dọ̀ ẹni búburú náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti inú ibi.” Ọ̀rọ̀ Gíríìkì τοῦ πονηροῦ lè tọ́ka sí “ẹni búburú náà” tàbí sí “ibi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: kí ... jẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ ẹni kẹta ní ìsinsìnyí; ‘kí ... jẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣílétí hàn.
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: Níhìn-ín ó tọ́ka sí ohun tí ènìyàn sọ; ‘ọ̀rọ̀’ pa kúkúrú àti agbára òwe inú gbólóhùn náà mọ́.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘Bẹ́ẹ̀ ni, bẹ́ẹ̀ ni,’ tàbí, ‘Bẹ́ẹ̀ kọ́, bẹ́ẹ̀ kọ́’
  rationale: A pa ìsọ̀rọ̀ méjì-méjì inú Gíríìkì mọ́ fún ìtẹnumọ́ àti ìlù ọ̀rọ̀, nígbà tí ‘tàbí’ mú ìyàtọ̀ àwọn ìdáhùn méjèèjì ṣe kedere.
- source_word: περισσὸν
  choice: ohunkóhun tí ó bá kọjá èyí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí ó lé ju ìdáhùn bẹ́ẹ̀ ni/bẹ́ẹ̀ kọ́ lọ; ìtumọ̀ yìí jẹ́ ti èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ àfiwé náà mọ́.
- source_word: τούτων
  choice: èyí
  rationale: Ó ń tọ́ka padà sí àwọn ìdáhùn méjèèjì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; Yorùbá lè lo ‘èyí’ gẹ́gẹ́ bí àkójọpọ̀ wọn.
- source_word: ἐκ
  choice: láti ọ̀dọ̀ ... ni ó ti wá
  rationale: Ó fi orísun hàn; ìṣètò yìí sọ ìtumọ̀ orísun náà ní Yorùbá kedere.
- source_word: τοῦ πονηροῦ
  choice: ẹni ibi
  rationale: Àpilẹ̀kọ pẹ̀lú ajẹtífù oníbìkítà náà lè tọ́ka sí ẹni kan, ó sì ṣeé ṣe kí ó túmọ̀ sí Èṣù nínú Mátíù; ‘ẹni ibi’ pa ìtọ́kasí ti ara ẹni náà mọ́ láìfi orúkọ tí Gíríìkì kò lò kún un.
theological_decisions:
- issue: Bóyá τοῦ πονηροῦ túmọ̀ sí ibi ní àìjẹ́-ẹni tàbí ẹni ibi kan
  choice: ẹni ibi
  alternative: ibi
  rationale: Ìkọ̀wé Gíríìkì gba ìtumọ̀ méjèèjì, ṣùgbọ́n lílo ὁ πονηρός nínú Mátíù sábà máa ń tọ́ka sí ẹni kan. A yan ìtumọ̀ ti ara ẹni nínú ẹsẹ̀, a sì fi èkejì sínú àlàyé ìsàlẹ̀ kí àìdánilójú inú orísun má bàa sọnù.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ kúkúrú, ọlọ́lá, ó sì pa àtúnwí àti ìlù ọ̀rọ̀ inú Gíríìkì mọ́.
