revisions:
- from: Ṣùgbọ́n kí ọ̀rọ̀ yín jẹ́, ‘Bẹ́ẹ̀ ni, bẹ́ẹ̀ ni,’ tàbí, ‘Bẹ́ẹ̀ kọ́, bẹ́ẹ̀ kọ́.’ Ohunkóhun tí ó bá kọjá èyí láti ọ̀dọ̀ ẹni ibi[a] ni ó ti wá.
  to: Ṣùgbọ́n kí ọ̀rọ̀ yín jẹ́ ‘Bẹ́ẹ̀ ni, bẹ́ẹ̀ ni,’ tàbí ‘Bẹ́ẹ̀ kọ́, bẹ́ẹ̀ kọ́.’ Ohunkóhun tí ó ju wọ̀nyí lọ jẹ́ láti ọ̀dọ̀ ẹni búburú náà[a].
