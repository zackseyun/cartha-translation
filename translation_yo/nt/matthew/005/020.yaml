id: MAT.5.20
reference: Matthew 5:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: yo
  text: Nítorí mo sọ fún yín pé, bí òdodo yín kò bá pọ̀ ju ti àwọn akọ̀wé àti àwọn Farisí[a] lọ, ẹ̀yin kì yóò wọ ìjọba ọ̀run láéláé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo àti ìdájọ́ òdodo; ní àyíká Mátíù 5 yìí, “òdodo” ló bójú mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Nítorí mo sọ fún yín pé
  rationale: “Nítorí” fi agbára àlàyé γάρ hàn; “mo sọ fún yín” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìbánisọ̀rọ̀ tààrà mọ́.
- source_word: ἐὰν μὴ
  choice: bí ... kò bá
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ipò òdì tí ó ṣe pàtàkì, ìyẹn “unless.”
- source_word: περισσεύσῃ ... πλεῖον
  choice: pọ̀ ju ... lọ
  rationale: Ó fi ìfiwéra tí ó túmọ̀ sí jíjẹ́ púpọ̀ tàbí gíga ju òṣùwọ̀n ẹlòmíràn hàn láìfi ọ̀rọ̀ àjèjì kún un.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: òdodo yín
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún δικαιοσύνη ní àyíká ìwà títọ́ àti ṣíṣe ohun tí ó tọ́; ó tún lè ní ìtumọ̀ ìdájọ́ òdodo.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: “Àwọn akọ̀wé” pa orúkọ ẹgbẹ́ àwọn amòye Ìwé Òfin mọ́, dípò ṣíṣe àlàyé iṣẹ́ wọn nínú ọ̀rọ̀ pàtàkì.
- source_word: Φαρισαίων
  choice: àwọn Farisí
  rationale: Èyí ni àfọwọ́kọ orúkọ ẹgbẹ́ náà tó wọ́pọ̀, tó sì ṣe kedere ní Yorùbá.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ẹ̀yin kì yóò wọ ... láéláé
  rationale: Àpapọ̀ “kì yóò” àti “láéláé” fi ìkọ̀ tí ó lágbára gan-an nínú οὐ μή hàn ní Yorùbá àdánidá.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni gbólóhùn Yorùbá tó dúró ṣinṣin, tó sì pa ọ̀nà pàtó tí Mátíù ń gbà sọ ọ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àyíká Mátíù 5
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Níhìn-ín, àyíká náà ń sọ̀rọ̀ nípa ìwà àti ìgbọràn tó tọ́ níwájú Ọlọ́run, nítorí náà “òdodo” bójú mu jù. Àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ “ìdájọ́ òdodo” mọ́ gẹ́gẹ́ bí ohun tí ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí.
- issue: Ohun tí a ń fi wéra nínú πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: òdodo yín ... ju ti àwọn akọ̀wé àti àwọn Farisí lọ
  alternative: òdodo yín ... ju àwọn akọ̀wé àti àwọn Farisí lọ
  rationale: Fífi “ti” kún un mú kedere pé òdodo àwọn ẹgbẹ́ méjèèjì ni a ń fi wéra, kì í ṣe pé òdodo ni a ń fi wé àwọn ènìyàn náà fúnra wọn.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti àdánidá. Gbólóhùn náà pa ìfiwéra àti ìkọ̀ líle ti orísun Gíríìkì mọ́, láìsọ irú òdodo tí Jésù ní lọ́kàn di ẹ̀kọ́ ẹ̀sìn kan pàtó.
