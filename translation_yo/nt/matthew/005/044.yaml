id: MAT.5.44
reference: Matthew 5:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: yo
  text: Ṣùgbọ́n èmi ń sọ fún yín pé, ẹ nífẹ̀ẹ́ àwọn ọ̀tá yín, kí ẹ sì gbàdúrà fún[a] àwọn tí ń ṣe ìnúnibíni sí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ipò àwọn tí ń ṣe ìnúnibíni sí yín.”
    reason: Yíyan ìtumọ̀ ọ̀rọ̀ Gíríìkì ὑπέρ; ó lè túmọ̀ sí gbígbàdúrà ní ipò ẹni kan tàbí fún un.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ṣùgbọ́n èmi sọ fún yín pé
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tí δέ mú wá hàn, “èmi” sì pa ìtẹnumọ́ ἐγώ mọ́. Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì bá ọ̀rọ̀ tí ó tẹ̀ lé e mu.
- source_word: ἀγαπᾶτε
  choice: ẹ nífẹ̀ẹ́
  rationale: Ó fi àṣẹ náà hàn ní kedere, ó sì yẹra fún “ẹ fẹ́,” tí ó tún lè túmọ̀ sí pé kí ènìyàn fẹ́ tàbí yan ohun kan.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: àwọn ọ̀tá yín
  rationale: Ìtumọ̀ tààrà àti àdánidá ni èyí fún ọ̀rọ̀ tí ń tọ́ka sí àwọn ẹni tí ìbáṣepọ̀ ọ̀tá wà láàárín wọn àti àwọn olùgbọ́.
- source_word: προσεύχεσθε
  choice: kí ẹ sì gbàdúrà
  rationale: “Gbàdúrà” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún προσεύχομαι; ìṣètò “kí ẹ sì” jẹ́ kí àṣẹ kejì bá ti àkọ́kọ́ lọ ní àdánidá.
- source_word: ὑπὲρ
  choice: fún
  rationale: Ní ibi yìí, ὑπέρ pẹ̀lú ọ̀rọ̀ inú genitive túmọ̀ sí gbígbàdúrà nítorí ẹnì kan tàbí fún ire rẹ̀. “Fún” ni ọ̀nà Yorùbá tó ṣe kedere jù lọ láìfi àlàyé kún ọ̀rọ̀.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: àwọn tí ń ṣe inúnibíni sí yín
  rationale: Ó pa ìṣe tí participle náà ń sọ mọ́, ó sì fi hàn pé àwọn ẹni wọ̀nyí ń ṣe ìṣe inúnibíni náà.
theological_decisions:
- issue: Ìwọ̀n àṣẹ láti nífẹ̀ẹ́ àwọn ọ̀tá
  choice: A túmọ̀ àṣẹ méjèèjì ní tààrà láìṣàlàyé irú ìfẹ́ náà tàbí ohun pàtó tí àdúrà náà gbọ́dọ̀ béèrè.
  alternative: Láti sọ ọ́ di “ṣe rere fún àwọn ọ̀tá yín,” tàbí láti fi kún un pé kí a gbàdúrà fún ìbùkún, ìrònúpìwàdà, tàbí ìyípadà wọn.
  rationale: Ẹsẹ náà pàṣẹ ìfẹ́ sí àwọn ọ̀tá àti àdúrà fún àwọn aninilára, ṣùgbọ́n kò ṣàlàyé gbogbo bí a ṣe máa mú àwọn àṣẹ náà ṣẹ tàbí ohun pàtó tí a ó béèrè nínú àdúrà. Ìtumọ̀ náà pa agbára àti ìforígbárí ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. “Èmi” ń pa ìtẹnumọ́ orísun Gíríìkì mọ́; “àwọn tí ń ṣe inúnibíni sí yín” sì jẹ́ àdánidá, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
