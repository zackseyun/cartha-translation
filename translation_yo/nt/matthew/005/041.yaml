  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá sì fi ipá mú ọ lọ ní máìlì kan[a], lọ pẹ̀lú rẹ ní máìlì méjì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘fi àṣẹ mú ọ ṣe iṣẹ́.’ Ó sábà máa ń tọ́ka sí iṣẹ́ tí aláṣẹ fi ipá mú ènìyàn ṣe.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ‘méjì’ nìkan ni a kọ ní apá kejì; ‘máìlì’ ni a lóye láti inú apá àkọ́kọ́.
    reason: source_ellipsis
lexical_decisions:
- source_word: ὅστις
  choice: Ẹnikẹ́ni tí ó bá
  rationale: 'Ó fi ìtumọ̀ arọ́pò-orúkọ aláìnídìí náà hàn gẹ́gẹ́ bí ọ̀ràn gbogbogbò: ẹnikẹ́ni tó bá ṣe bẹ́ẹ̀.'
- source_word: ἀγγαρεύσει
  choice: fi ipá mú ọ láti bá a lọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífi agbára tàbí àṣẹ mú ènìyàn ṣe iṣẹ́ tàbí lọ ní ọ̀nà kan. Ìtumọ̀ yìí pa ìfipámúni mọ́, láì sọ pé ọmọ ogun Róòmù ni ẹni náà.
- source_word: μίλιον ἕν
  choice: máìlì kan
  rationale: Ó tú ìwọ̀n ọ̀nà Róòmù náà ní tààrà, ó sì pa nọ́ńbà kan mọ́.
- source_word: ὕπαγε
  choice: bá a lọ
  rationale: Ọ̀rọ̀ àṣẹ náà túmọ̀ sí kí ẹni náà lọ tàbí tẹ̀ síwájú; fífi ‘bá a’ kún un mú ìbáṣepọ̀ μετ’ αὐτοῦ ṣe kedere ní Yorùbá.
- source_word: μετ’ αὐτοῦ
  choice: bá a
  rationale: μετά pẹ̀lú ẹ̀yà-orúkọ genitive ń fi ìbákẹ́gbẹ́ hàn; ‘bá a’ jẹ́ ọ̀nà àdánidá láti sọ ‘pẹ̀lú rẹ̀’ nínú gbólóhùn yìí.
- source_word: δύο
  choice: ní máìlì méjì
  rationale: Ní Gíríìkì, ‘méjì’ nìkan ni a kọ, ṣùgbọ́n ‘máìlì’ ni a lóye láti inú apá àkọ́kọ́. A tún orúkọ ìwọ̀n náà sọ kí Yorùbá lè ṣe kedere, kí ó sì dùn mọ́ etí.
theological_decisions:
- issue: Ìtàn-àwùjọ nípa iṣẹ́ tí aláṣẹ fi ipá múni ṣe
  choice: A tú u gẹ́gẹ́ bí ìfipámúni láti bá ẹlòmíràn lọ, láì dárúkọ ọmọ ogun Róòmù.
  alternative: Kí a sọ ní pàtó pé ọmọ ogun Róòmù ló fi ipá mú ẹni náà ru ẹrù tàbí ṣe iṣẹ́.
  rationale: Ọ̀rọ̀ ἀγγαρεύσει àti ìtọ́kasí máìlì lè rántí àṣà Róòmù ti fífi àṣẹ múni ṣe iṣẹ́, ṣùgbọ́n ẹsẹ náà kò dárúkọ ọmọ ogun tàbí ẹrù. Ìtumọ̀ náà pa agbára ìfipámúni mọ́ láì fi àlàyé ìtàn kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìsọ̀rọ̀ náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì; ‘fi ipá mú’ ṣàfihàn ìfipámúni, nígbà tí ‘bá a lọ’ pa àṣẹ àti ìbákẹ́gbẹ́ inú orísun mọ́.
