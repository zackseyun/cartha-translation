  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: yo
  text: Ẹni tí ó bá fẹ́ pe ọ́ lẹ́jọ́[a] kí ó sì gba aṣọ inú rẹ, jẹ́ kí ó gba aṣọ òde rẹ pẹ̀lú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fẹ́ kí a dá ọ lẹ́jọ́.” Ọ̀rọ̀ Gíríìkì náà ní ti gidi tọ́ka sí wíwà lábẹ́ ìdájọ́ ní ibi ẹjọ́ òfin.
    reason: lexical_alternative
  - marker: b
    text: “Aṣọ inú” ni aṣọ tí a wọ sún mọ́ ara; “aṣọ òde” ni aṣọ tí a wọ lórí rẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: Ẹni tí ó bá fẹ́
  rationale: Ó fi ẹni àìsọ pàtó hàn, ó sì pa ìtumọ̀ ìfẹ́ tàbí ìpinnu inú θέλω mọ́ ní Yorùbá àdánidá.
- source_word: σοι κριθῆναι
  choice: mú ọ lọ sí ilé ẹjọ́
  rationale: Ní ọ̀rọ̀ yìí, infinitive náà tọ́ka sí gbígbé ẹjọ́ òfin dìde sí ẹni tí a ń bá sọ; gbólóhùn yìí jẹ́ Yorùbá tí ó ṣe kedere, ó sì jẹ́ kí àlàyé ìtumọ̀ gangan wà nínú àlàyé ìsàlẹ̀.
- source_word: χιτῶνά
  choice: aṣọ abẹ́
  rationale: χίτων jẹ́ aṣọ inú tí a wọ sún mọ́ ara; yíyan ‘aṣọ abẹ́’ pa ìyàtọ̀ rẹ̀ mọ́ sí ἱμάτιον láìlo ọ̀rọ̀ àjèjì.
- source_word: λαβεῖν
  choice: gba
  rationale: Ó sọ ní tààrà nípa gbígba ohun-ìní ẹni nínú ọ̀ràn ẹjọ́.
- source_word: ἄφες
  choice: jẹ́ kí ó mú
  rationale: Àṣẹ náà ní ìtumọ̀ jíjẹ́wọ́ tàbí fífi ohun náà sílẹ̀ fún un; ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa líle àṣẹ náà mọ́.
- source_word: ἱμάτιον
  choice: aṣọ àwọ̀lékè
  rationale: ἱμάτιον jẹ́ aṣọ òde tí a wọ lé aṣọ inú; ‘aṣọ àwọ̀lékè’ mú ìyàtọ̀ àṣà yẹn hàn kedere.
- source_word: καὶ ... καὶ
  choice: … pẹ̀lú
  rationale: '‘Pẹ̀lú’ mú ipa àfikún καί kejì hàn: kí ẹni náà tún gba aṣọ òde náà.'
theological_decisions:
- issue: Agbára ìlànà ìwà rere Jesu nínú awuyewuye òfin
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ tààrà fún ìyọ̀ǹda tí kò gbẹ̀san, láìrọ̀ ọ́ sí àkàwé lásán.
  alternative: Kí a túmọ̀ ọ́ ní fífẹ̀ sí i gẹ́gẹ́ bí ìlànà gbogbogbò nípa fífi ẹ̀tọ́ ẹni sílẹ̀.
  rationale: ἄφες jẹ́ àṣẹ, àwòrán aṣọ méjèèjì sì jẹ́ ohun gidi nínú ipò òfin àti àwùjọ. Ìtumọ̀ gbọ́dọ̀ pa ọ̀rọ̀ Jesu tí ó lágbára mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní ni a lò. Àwọn àmì ohùn kún un níbi tí ó bá yẹ. A yan ‘ilé ẹjọ́’ fún ìtumọ̀ òfin tí ó ṣe kedere, a sì pa ìyàtọ̀ aṣọ inú àti aṣọ òde mọ́.
