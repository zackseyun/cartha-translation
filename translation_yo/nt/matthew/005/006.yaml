id: MAT.5.6
reference: Matthew 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: yo
  text: Ìbùkún ni fún àwọn tí ebi àti òùngbẹ ń pa fún òdodo[a], nítorí a ó mú wọn yó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo, ìdájọ́ òdodo, tàbí ohun tí ó tọ́ níwájú Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Aláyọ̀ ni
  rationale: Ọ̀rọ̀ yìí jẹ́ ìkéde ipò rere láti ọ̀dọ̀ Ọlọ́run, kì í ṣe ìmọ̀lára ayọ̀ lásán. “Aláyọ̀ ni” jẹ́ ọ̀nà àdánidá, ọ̀wọ̀, tí a sì mọ̀ dáadáa nínú èdè Yorùbá fún ìkéde irú ìbùkún yìí.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: àwọn tí ebi àti òùngbẹ ń pa
  rationale: Àwọn ọ̀rọ̀ ìṣe aláìparí ní Gíríìkì ń fi ìfẹ́ líle tí ó ń bá a lọ hàn. Àpólà Yorùbá yìí pa àwòrán ebi àti òùngbẹ mọ́, ó sì jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀.
- source_word: τὴν δικαιοσύνην
  choice: fún òdodo
  rationale: “Òdodo” lè tọ́ka sí ìwà títọ́, ìdájọ́ òdodo, àti ohun tí ó tọ́ níwájú Ọlọ́run; nítorí náà, ó pa ìbú ọrọ̀ Gíríìkì mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó mú ìdí tí ìkéde ayọ̀ náà fi rí bẹ́ẹ̀ wọlé lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: αὐτοὶ
  choice: wọn
  rationale: Yorùbá kò nílò àfikún ọ̀rọ̀ ìtẹnumọ́ níbí; “wọn” dá ìtọ́kasí sí àwọn kan náà dúró láìjẹ́ kí gbólóhùn náà wuwo.
- source_word: χορτασθήσονται
  choice: a ó mú wọn yó
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọjọ́ iwájú, aláìṣe-taara, ó sì ní àwòrán jíjẹ títí ènìyàn fi yó. “A ó mú wọn yó” pa àwòrán ìtẹ́lọ́rùn ebi mọ́, ó sì fi ẹni tí ń ṣe é sílẹ̀ láìdárúkọ gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo; ohun tí ó tọ́ níwájú Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì lè gba ìwà títọ́ ẹni, ìbáṣepọ̀ títọ́, àti ìdájọ́ òdodo láwùjọ. A lo “òdodo” nínú ẹsẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tí ó gbòòrò, a sì ṣàlàyé àǹfààní ìtumọ̀ mìíràn ní àlàyé ìsàlẹ̀.
- issue: Aláìṣe-taara inú χορτασθήσονται
  choice: a ó mú wọn yó
  alternative: wọn yóò yó
  rationale: Àṣàyàn náà pa ìṣe aláìṣe-taara mọ́, kò sì sọ Ọlọ́run ní tààrà gẹ́gẹ́ bí olùṣe níbi tí ọ̀rọ̀ Gíríìkì kò ti dárúkọ rẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè mú kí a lóye rẹ̀ bẹ́ẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán ebi, òùngbẹ, àti jíjẹ títí di yíyó mọ́.
