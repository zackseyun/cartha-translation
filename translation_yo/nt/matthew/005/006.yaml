revisions:
- from: Aláyọ̀ ni àwọn tí ebi àti òùngbẹ ń pa fún òdodo[a], nítorí a ó mú wọn yó.
  to: Ìbùkún ni fún àwọn tí ebi àti òùngbẹ ń pa fún òdodo[a], nítorí a ó mú wọn yó.
  rationale: The revision changes only the beatitude formula, replacing a potentially emotion-focused expression with the standard Yoruba declaration of blessing. The remaining wording faithfully retains the Greek's continuing hunger-and-thirst imagery, the broad contested term δικαιοσύνη, and the unstated agent of the future passive.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the ongoing hunger-and-thirst image, the object "righteousness," the causal clause, and the future passive sense of χορτασθήσονται. However, "Aláyọ̀ ni" can primarily suggest personal happiness in contemporary Yoruba and does not as clearly preserve the beatitude's declarative blessedness as "Ìbùkún ni fún."
  naturalness: The sentence is otherwise idiomatic Standard Yoruba. "Ìbùkún ni fún àwọn tí..." is the more natural, reverent, and established Yoruba beatitude register, while retaining clear modern usage and full tone marks.
  terminology: Use "Ìbùkún" for μακάριοι to preserve the religious/declarative force without reducing it to an emotional state. Retain "òdodo" for δικαιοσύνη; its possible justice sense is appropriately retained in the footnote. "A ó mú wọn yó" naturally conveys the future passive without explicitly naming the agent.
  issues:
  - severity: medium
    issue: '"Aláyọ̀ ni" is too readily understood as "happy."'
    rationale: Although it can function in a beatitude-like declaration, it more easily foregrounds a psychological state than μακάριοι's pronouncement of blessedness. "Ìbùkún ni fún" is both natural Yoruba and semantically closer in this scriptural register.
  revised_text: Ìbùkún ni fún àwọn tí ebi àti òùngbẹ ń pa fún òdodo[a], nítorí a ó mú wọn yó.
  revised_footnotes:
  - marker: a
    text: Tàbí, “fún ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo, ìdájọ́ òdodo, tàbí ohun tí ó tọ́ níwájú Ọlọ́run.
    reason: alternative_reading
  revision_rationale: The revision changes only the beatitude formula, replacing a potentially emotion-focused expression with the standard Yoruba declaration of blessing. The remaining wording faithfully retains the Greek's continuing hunger-and-thirst imagery, the broad contested term δικαιοσύνη, and the unstated agent of the future passive.
