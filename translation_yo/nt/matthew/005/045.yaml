id: MAT.5.45
reference: Matthew 5:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: yo
  text: kí ẹ̀yin lè di ọmọkùnrin[a] Baba yín tí ń bẹ ní ọ̀run[b], nítorí ó ń mú kí oòrùn tirẹ̀ ràn sórí àwọn ẹni búburú àti àwọn ẹni rere, ó sì ń jẹ́ kí òjò rọ̀[c] sórí àwọn olódodo àti àwọn aláìṣòdodo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọ Baba yín.” Ọ̀rọ̀ Gíríìkì náà ní “ọmọkùnrin”; a pa á mọ́ nínú ọ̀rọ̀ pàtàkì kí èdè ìbátan ọmọkùnrin sí baba má bàa sọnù.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ní àwọn ọ̀run”; “ní ọ̀run” ni a lò nítorí pé ó jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn yìí.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ó ń rọ̀ sórí.” “Ó ń jẹ́ kí òjò rọ̀ sórí” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: kí
  rationale: “Kí” ṣe àfihàn ète tàbí àbájáde ní Yorùbá lọ́nà àdánidá.
- source_word: γένησθε
  choice: ẹ̀yin lè di
  rationale: “Di” pa ìtumọ̀ wíwá sí ipò kan mọ́, dípò yíyí ọ̀rọ̀ náà padà sí “jẹ́” tí ó dúró ṣinṣin; “lè” sì bá ọ̀rọ̀ subjunctive náà mu.
- source_word: υἱοὶ
  choice: ọmọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní kedere. “Ọmọkùnrin” pa èdè ìbátan ọmọ sí baba mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ náà ó kan gbogbo ọmọ-ẹ̀yìn.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: Baba yín
  rationale: Èyí túmọ̀ gbólóhùn genitive náà ní tààrà, ó sì pa ọ̀rọ̀ “Baba” mọ́ gẹ́gẹ́ bí orúkọ ìbátan.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: tí ń bẹ ní ọ̀run
  rationale: “Ní ọ̀run” ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe àdánidá jù fún gbólóhùn Mátíù yìí, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀.
- source_word: ὅτι
  choice: nítorí
  rationale: “Nítorí” fi ìdí tí ó ṣàlàyé gbólóhùn tó ṣáájú hàn ní kedere.
- source_word: τὸν ἥλιον αὐτοῦ
  choice: oòrùn tirẹ̀
  rationale: “Tirẹ̀” pa ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní αὐτοῦ mọ́, ó sì tẹnumọ́ pé oòrùn jẹ́ ti Ọlọ́run.
- source_word: ἀνατέλλει
  choice: ń mú kí ... ràn
  rationale: Pẹ̀lú “oòrùn” gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà ń ṣe sí, gbólóhùn causative yìí jẹ́ Yorùbá àdánidá, ó sì pa iṣẹ́ Ọlọ́run mọ́.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: sí orí àwọn ẹni búburú àti àwọn ẹni rere
  rationale: Àwọn adjective Gíríìkì náà dúró gẹ́gẹ́ bí orúkọ ènìyàn; “àwọn ẹni búburú” àti “àwọn ẹni rere” sọ èyí di kedere ní Yorùbá, ó sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ náà mọ́.
- source_word: βρέχει
  choice: ń rọ òjò
  rationale: Èyí tẹ̀lé ọ̀rọ̀-ìṣe Gíríìkì náà pẹ́kípẹ́kí, ó sì jẹ́ gbólóhùn Yorùbá tí ó fi Ọlọ́run hàn gẹ́gẹ́ bí olùṣe.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: sí orí àwọn olódodo àti àwọn aláìṣòdodo
  rationale: “Olódodo” àti “aláìṣòdodo” jẹ́ méjì ọ̀rọ̀ ìwà rere àti ìwà àìtọ́ tí ó bá δίκαιος àti ἄδικος mu, tí ó sì wọ́pọ̀ nínú èdè Bíbélì Yorùbá.
theological_decisions:
- issue: Èdè akọ nípa jíjẹ́ ọmọ Baba
  choice: ọmọkùnrin Baba yín
  alternative: ọmọ Baba yín
  rationale: Nítorí υἱοὶ jẹ́ akọ ní kedere, a pa “ọmọkùnrin” mọ́ nínú ọ̀rọ̀ pàtàkì. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ náà lè tọ́ka sí gbogbo àwọn ọmọ-ẹ̀yìn, láìpa àwòrán ìbátan ọmọkùnrin sí baba rẹ́.
- issue: Agbára γένησθε ní ìbámu pẹ̀lú jíjẹ́ ọmọ Ọlọ́run
  choice: ẹ̀yin lè di
  alternative: ẹ̀yin lè jẹ́; kí ó lè hàn pé ẹ̀yin jẹ́
  rationale: “Di” pa agbára ọ̀rọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ kún un pé ìṣe ènìyàn fúnra rẹ̀ ló dá ìgbà-ọmọ níwájú Ọlọ́run sílẹ̀. Àyíká ọ̀rọ̀ náà tẹnumọ́ bí àwọn ọmọ-ẹ̀yìn ṣe ń fara wé ìwà Baba wọn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ó jẹ́ ọ̀rọ̀ òde òní tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìwọ̀ntúnwọ̀nsì àwọn méjì-méjì—“àwọn ẹni búburú àti àwọn ẹni rere,” “àwọn olódodo àti àwọn aláìṣòdodo”—mọ́.
