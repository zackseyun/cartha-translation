id: MAT.5.46
reference: Matthew 5:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: yo
  text: Nítorí bí ẹ bá nífẹ̀ẹ́ àwọn tó nífẹ̀ẹ́ yín, ẹ̀san wo ni ẹ ní[a]? Àní àwọn agbowó-orí kò ha ṣe ohun kan náà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “owó iṣẹ́ wo ni ẹ ní?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “owó iṣẹ́” tàbí “ẹ̀san”; níbí, ó ń tọ́ka sí ohun tí a rí gbà gẹ́gẹ́ bí ẹ̀san nínú ẹ̀kọ́ Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” pa ìsopọ̀ γάρ mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú, “bí” sì fi ipò àídájú ἐάν hàn ní Yorùbá àdánidá.
- source_word: ἀγαπήσητε
  choice: ẹ̀yin bá nífẹ̀ẹ́
  rationale: Àkójọpọ̀ “bá” àti ọ̀rọ̀ ìṣe ìsinsìnyí sọ ipò gbogbogbò tí aorist subjunctive náà ń fi hàn, láìfi apá ìṣe kún un ju bó ṣe yẹ lọ.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: àwọn tó nífẹ̀ẹ́ yín
  rationale: Ó tú participle tí a lò gẹ́gẹ́ bí orúkọ sí Yorùbá tó ṣe kedere, ó sì pa àtúnlò gbòǹgbò ἀγαπάω mọ́.
- source_word: τίνα μισθὸν ἔχετε
  choice: èrè wo ni ẹ ní
  rationale: “Èrè” lè túmọ̀ sí ohun tí a rí gbà nítorí ìṣe, ó sì bá ọ̀rọ̀ ẹ̀kọ́ ìwà rere yìí mu láìsọ pé ènìyàn fi iṣẹ́ ra ojúrere Ọlọ́run.
- source_word: οὐχὶ καὶ
  choice: Àní ... kò ha
  rationale: “Kò ha” jẹ́ ìbéèrè àsọyé tó ń retí ìdáhùn bẹ́ẹ̀ ni; “Àní” sì mú agbára ìtẹnumọ́ καί jáde.
- source_word: οἱ τελῶναι
  choice: àwọn agbowó-orí
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tí ń gba owó-orí tàbí owó kọjá ní àyíká ìtàn náà.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: ń ṣe ohun kan náà
  rationale: Ó sọ ìṣe kan náà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ní ọ̀nà Yorùbá tó rọrùn, tó sì pé.
theological_decisions:
- issue: Ìtumọ̀ μισθός nínú ẹ̀kọ́ ìwà rere Jésù
  choice: èrè
  alternative: owó iṣẹ́
  rationale: “Èrè” pa èrò ẹ̀san tàbí ohun tí a ó rí gbà mọ́ nínú àyíká ẹ̀kọ́ náà, láìfi ẹ̀kọ́ kan pàtó nípa rírí ìgbàlà nípasẹ̀ iṣẹ́ sínú ẹsẹ̀ náà; àlàyé ìsàlẹ̀ sì pa ìtumọ̀ “owó iṣẹ́” mọ́ gẹ́gẹ́ bí àṣàyàn èdè.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ẹ̀yin” nínú gbólóhùn àkọ́kọ́ fún ìtẹnumọ́, lẹ́yìn náà a lo “ẹ” lọ́nà àdánidá.
