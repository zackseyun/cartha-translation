id: MAT.5.19
reference: Matthew 5:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: yo
  text: Nítorí náà, ẹnikẹ́ni tí ó bá sọ ọ̀kan lára àwọn òfin wọ̀nyí tí ó kéré jù lọ di ohun tí kò di dandan[a], tí ó sì kọ́ àwọn ẹlòmíràn láti ṣe bẹ́ẹ̀, a ó pè é ní ẹni tí ó kéré jù lọ ní ìjọba ọ̀run; ṣùgbọ́n ẹnikẹ́ni tí ó bá ṣe wọn, tí ó sì kọ́ wọn, òun ni a ó pè ní ẹni ńlá ní ìjọba ọ̀run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó bá tú ọ̀kan lára àwọn òfin wọ̀nyí sílẹ̀,” tàbí “tí ó bá rú un.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “tú”; níhìn-ín ó ń tọ́ka sí fífi agbára òfin kan rọ̀ tàbí sí sísọ ọ́ di ohun tí kò di dandan mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìtumọ̀ ìyọrísí mọ́, ó sì so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tí ó ṣáájú nípa ìdúróṣinṣin Òfin.
- source_word: λύσῃ
  choice: sọ ... di ohun tí kò ṣe pàtàkì
  rationale: Nínú àyíká òfin, λύω túmọ̀ sí fífi agbára òfin rọ̀ tàbí kíkà á sí ohun tí kò di ni mọ́; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì yẹra fún dídín ìtumọ̀ náà kù sí rírú òfin nìkan.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: ọ̀kan lára àwọn òfin wọ̀nyí tí ó kéré jù lọ
  rationale: Ó pa ìtumọ̀ pé òfin kan wà lára àwọn tí a kà sí èyí tí ó kéré jù lọ mọ́ láìfi ìtúmọ̀ míì kún un.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: kọ́ àwọn ẹlòmíràn láti ṣe bẹ́ẹ̀
  rationale: “Àwọn ẹlòmíràn” fi ìtọ́kasí gbogbo ènìyàn hàn ní Yorùbá àdánidá, “láti ṣe bẹ́ẹ̀” sì tọ́ka padà sí fífi òfin náà sílẹ̀ gẹ́gẹ́ bí ohun tí kò ṣe pàtàkì.
- source_word: ἐλάχιστος κληθήσεται
  choice: a ó pè é ní ẹni tí ó kéré jù lọ
  rationale: Ó tú káλεω gẹ́gẹ́ bí “pè,” ó sì pa ipò ìfiwéra ἐλάχιστος mọ́.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ní ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó ṣe kedere, láti sọ àpólà pàtàkì ti Mátíù.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: ń ṣe wọ́n, tí ó sì ń kọ́ wọn
  rationale: Ó pa ìṣe àti kíkọ́ àwọn òfin náà mọ́ gẹ́gẹ́ bí ohun méjì tí a so pọ̀.
- source_word: οὗτος μέγας κληθήσεται
  choice: òun ni a ó pè ní ẹni ńlá
  rationale: “Òun ni” pa ìtẹnumọ́ ọ̀rọ̀-atọ́ka οὗτος àti ìyàtọ̀ sí ẹni àkọ́kọ́ mọ́; “ẹni ńlá” jẹ́ ìtumọ̀ taara ti μέγας nínú ọ̀rọ̀ ipò.
theological_decisions:
- issue: Ìtumọ̀ ipò “ẹni tí ó kéré jù lọ/ẹni ńlá” nínú ìjọba
  choice: Fi àwọn méjèèjì hàn gẹ́gẹ́ bí ipò nínú ìjọba ọ̀run, láìsọ pé ẹni àkọ́kọ́ ni a lé jáde tàbí pé èkejì ní ipò èrè kan pàtó.
  alternative: Tú “ẹni tí ó kéré jù lọ” sí ẹni tí kò ní wọ ìjọba, tàbí “ẹni ńlá” sí ipò èrè ọ̀run tí a ti pinnu.
  rationale: Ọ̀rọ̀ Gíríìkì sọ “nínú ìjọba ọ̀run”; ó yẹ kí ìtumọ̀ pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanjú rẹ̀.
- issue: Ìtọ́kasí τοὺς ἀνθρώπους
  choice: Lo “àwọn ẹlòmíràn,” èyí tí ó tọ́ka sí àwọn ènìyàn lápapọ̀.
  alternative: Lo “àwọn ọkùnrin,” èyí tí ó lè dà bí ẹni pé ọkùnrin nìkan ni a ń tọ́ka sí ní Yorùbá òde òní.
  rationale: Nínú àyíká yìí, ọ̀pọ̀ akọ Gíríìkì jẹ́ ti gbogbo ènìyàn; “àwọn ẹlòmíràn” mú ìtọ́kasí náà jáde lọ́nà àdánidá.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Gbólóhùn náà pa ìṣọ̀kan àti ìyàtọ̀ àwọn apá Gíríìkì mọ́, ṣùgbọ́n ó yẹra fún ìtumọ̀ líle tí kò wọ́pọ̀ ní Yorùbá.
