id: MAT.5.16
reference: Matthew 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: yo
  text: Bákan náà, kí ìmọ́lẹ̀ yín tàn níwájú àwọn ènìyàn, kí wọn lè rí àwọn iṣẹ́ rere yín, kí wọn sì fi ògo fún Baba yín tí ó wà ní àwọn ọ̀run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “tí ó wà ní ọ̀run.” Nínú Gíríìkì, ọ̀rọ̀ náà wà ní ọ̀pọ̀ nọ́ńbà: “ní àwọn ọ̀run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so àṣẹ yìí pọ̀ mọ́ àpẹẹrẹ fìtílà àti ìmọ́lẹ̀ tí ó ṣáájú, ó sì ń tọ́ka sí ọ̀nà tí ìmọ́lẹ̀ náà yóò gbà tàn.
- source_word: λαμψάτω
  choice: kí ... tàn
  rationale: Ìtumọ̀ yìí fi agbára àṣẹ ẹni kẹta hàn ní Yorùbá àdánidá láìfi ìtumọ̀ míì kún un.
- source_word: τὸ φῶς ὑμῶν
  choice: ìmọ́lẹ̀ yín
  rationale: Ó pa ọ̀rọ̀ náà mọ́ ní ẹyọ bí ó ti rí ní Gíríìkì, ṣùgbọ́n ó lè dúró fún ẹ̀rí gbogbo àwọn ọmọ-ẹ̀yìn lápapọ̀.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: níwájú àwọn ènìyàn
  rationale: “Àwọn ènìyàn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí gbogbo ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ὅπως
  choice: kí ... lè ... kí ... sì
  rationale: Ilana yìí sọ ète tàbí àbájáde tí gbolohun Gíríìkì ń tọ́ka sí ní Yorùbá tó já gaara.
- source_word: ἴδωσιν
  choice: kí wọn lè rí
  rationale: Ó mú ìṣe abẹ́-ọrọ̀ tí ὅπως ń darí jáde lọ́nà àdánidá.
- source_word: τὰ καλὰ ἔργα
  choice: àwọn iṣẹ́ rere yín
  rationale: “Iṣẹ́ rere” jẹ́ ìtumọ̀ tó mọ́gbọ́n dání, tó wọ́pọ̀, tí ó sì pa èrò iṣẹ́ ọlọ́lá tàbí iṣẹ́ tó dára mọ́.
- source_word: δοξάσωσιν
  choice: kí wọn sì fi ògo fún
  rationale: Ó sọ fífi ògo fún Ọlọ́run ní kedere, ó sì pa ìwọ̀n ẹ̀sìn ọ̀rọ̀ δοξάζω mọ́.
- source_word: τὸν πατέρα ὑμῶν
  choice: Baba yín
  rationale: Ó pa èdè ìbátan tó ṣe pàtàkì nínú Mátíù mọ́ ní Yorùbá àdánidá.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: tí ó wà ní àwọn ọ̀run
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà οὐρανοῖς tó wà nínú Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé ẹyọ “ọ̀run” tún wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ gbogbogbò ti ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀. “Àwọn ènìyàn” pa ìtumọ̀ yẹn mọ́ láìdín in kù sí akọ nìkan.
- issue: Ọ̀pọ̀ nọ́ńbà οὐρανοῖς
  choice: ní àwọn ọ̀run
  alternative: ní ọ̀run
  rationale: A pa ọ̀pọ̀ nọ́ńbà inú orísun Gíríìkì mọ́ nínú àkọ́kọ́ ọ̀rọ̀, nígbà tí àlàyé ìsàlẹ̀ fi àṣàyàn ẹyọ tó wọ́pọ̀ hàn.
- issue: Ìbáṣepọ̀ iṣẹ́ rere àti fífi ògo fún Ọlọ́run
  choice: Àwọn ènìyàn rí iṣẹ́ rere, wọ́n sì fi ògo fún Baba
  alternative: Àwọn iṣẹ́ rere ń mú ògo bá àwọn ọmọ-ẹ̀yìn fúnra wọn
  rationale: 'A tẹ̀ lé ìṣàn gbolohun náà láìsọ ẹ̀kọ́ míì sínú rẹ̀: ète tí a sọ ni pé àwọn tó rí iṣẹ́ rere náà yóò fi ògo fún Baba.'
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A yan “Bẹ́ẹ̀ náà ni kí...” láti pa ìsopọ̀ mọ́ àpẹẹrẹ fìtílà tó ṣáájú, a sì lo “àwọn ènìyàn” nítorí pé ó jẹ́ gbogbogbò ní Yorùbá.
