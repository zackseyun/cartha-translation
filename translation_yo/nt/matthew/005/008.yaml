id: MAT.5.8
reference: Matthew 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: yo
  text: Alábùkún ni àwọn tí ọkàn wọn jẹ́ mímọ́[a], nítorí àwọn náà yóò rí Ọlọ́run.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ọkàn wọn mọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ìlérí náà, “yóò rí Ọlọ́run,” lè tọ́ka sí wíwọlé tààrà sí iwájú Ọlọ́run, títí kan ìmúṣẹ rẹ̀ ní ọjọ́ iwájú; a pa ọ̀rọ̀ náà mọ́ láì dín ìtumọ̀ rẹ̀ kù.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Alábùkún ni
  rationale: Ó pa ìtumọ̀ ipò ẹni tí Ọlọ́run ṣe ojúrere sí mọ́, láì sọ ọ́ di ìmọ̀lára ayọ̀ lásán.
- source_word: καθαροὶ τῇ καρδίᾳ
  choice: àwọn tí ọkàn wọn mọ́
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti sọ pé ìwà mímọ́ náà jẹ́ ti inú ẹni, kì í ṣe ti ìta tàbí ti àṣà ìwẹ̀nùmọ́ nìkan.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tàbí ìdáláre ìbùkún náà hàn ní èdè Yorùbá òde òní.
- source_word: αὐτοὶ
  choice: àwọn gan-an
  rationale: Ó mú ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì náà jáde pé àwọn ènìyàn wọ̀nyí gan-an ni yóò gba ìlérí náà.
- source_word: τὸν θεὸν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà fún ẹni tí ọ̀rọ̀-ìṣe ὄψονται ń tọ́ka sí gẹ́gẹ́ bí ohun tí wọn yóò rí.
- source_word: ὄψονται
  choice: yóò rí
  rationale: Ó jẹ́ ìlérí ọjọ́ iwájú ní èdè Yorùbá tó ṣe kedere, láì fi àlàyé míì kún un.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn náà “rí Ọlọ́run”
  choice: A pa ọ̀rọ̀ tààrà náà mọ́ pé “yóò rí Ọlọ́run.”
  alternative: “yóò wà níwájú Ọlọ́run” tàbí “yóò rí Ọlọ́run ní òpin ayé”
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ jíjinlẹ̀ nípa wíwọlé sí iwájú Ọlọ́run àti ìmúṣẹ ọjọ́ iwájú, ṣùgbọ́n kò sọ ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí ní kíkún. Nítorí náà, a kò dín ìlérí náà kù sí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó níyì. “Alábùkún ni” bá ìlànà àwọn ọ̀rọ̀ ìbùkún mu, “ọkàn wọn mọ́” sì jẹ́ ọ̀nà àdánidá láti tọ́ka sí ìwà inú. “Àwọn gan-an” pa ìtẹnumọ́ αὐτοὶ mọ́.
