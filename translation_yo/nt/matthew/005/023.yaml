id: MAT.5.23
reference: Matthew 5:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: yo
  text: Nítorí náà, bí o bá ń mú ẹ̀bùn rẹ wá sí orí pẹpẹ, tí o sì bá rántí níbẹ̀ pé arákùnrin rẹ ní ohun kan lòdì sí ọ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin tàbí arábìnrin rẹ”; Gíríìkì sọ pé “arákùnrin,” ọ̀rọ̀ akọ ẹyọ kan tí ó lè dúró fún akọ àti abo nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Nítorí náà, bí
  rationale: “Nítorí náà” pa ìtumọ̀ ìyọrísí οὖν mọ́, “bí” sì fi ipò àídájú ἐάν hàn ní Yorùbá àdánidá.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: ìwọ bá ń mú ẹ̀bùn rẹ wá
  rationale: Àkópọ̀ “bá ń ... wá” mú ìṣe tí ó ń lọ lọ́wọ́ nínú àpẹẹrẹ náà jáde; “ẹ̀bùn” bá δῶρον mu láì sọ ọ́ di irú ọrẹ kan pàtó.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sí orí pẹpẹ
  rationale: “Sí orí” fi ìdarí ìṣe náà sí ojú pẹpẹ rúbọ hàn, ó sì pa àwòrán ibi ìrúbọ tí θυσιαστήριον ní mọ́.
- source_word: κἀκεῖ μνησθῇς
  choice: tí o sì rántí níbẹ̀
  rationale: Ó pa ìsopọ̀ “àti” àti ìtẹnumọ́ ibi “níbẹ̀” mọ́, “rántí” sì jẹ́ ìtumọ̀ Yorùbá tààrà fún μνησθῇς.
- source_word: ὁ ἀδελφός σου
  choice: arákùnrin rẹ
  rationale: Ó tẹ̀ lé ọ̀rọ̀ akọ ẹyọ ἀδελφός. Àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí a mọ̀ pé ọ̀rọ̀ náà lè dúró fún ọmọ ìyá tàbí ẹlẹgbẹ́ ìgbàgbọ́ láì yí ọ̀rọ̀ inú ẹsẹ̀ padà.
- source_word: ἔχει τι κατὰ σοῦ
  choice: ní ohun kan lòdì sí ọ
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún àpólà náà, ó sì pa àìsọ ohun tí τι jẹ́ ní pàtó mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ìbátan akọ ἀδελφός
  choice: arákùnrin rẹ
  alternative: arákùnrin tàbí arábìnrin rẹ; ẹlẹgbẹ́ onígbàgbọ́ rẹ
  rationale: Orísun Gíríìkì lo akọ ẹyọ. Ìtumọ̀ pàtàkì kò yẹ kí ó sọ ọ́ di ọ̀rọ̀ àìlábòsí akọ tàbí abo, bí ó tilẹ̀ jẹ́ pé ó lè dúró fún àwọn mìíràn nínú àyíká yìí; àlàyé [a] ni ó tọ́ka sí ìlò fífẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé. “Pẹpẹ” ni a lò fún pẹpẹ ìrúbọ; àyíká ẹsẹ̀ náà mú ìtumọ̀ ìsìn rẹ̀ ṣe kedere.
