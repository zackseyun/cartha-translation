id: MAT.5.36
reference: Matthew 5:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: yo
  text: Má sì fi orí rẹ búra, nítorí ìwọ kò lè sọ irun kan di funfun tàbí dúdú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: Bẹ́ẹ̀ ni kí o má ṣe
  rationale: Ó ń tẹ̀ síwájú nínú ọ̀wọ́ àwọn ohun tí a kà léèwọ̀ ní àwọn ẹsẹ tó ṣáájú; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣọ̀kan òdì náà mọ́.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: fi orí rẹ
  rationale: Pẹ̀lú ὀμόσῃς, ọ̀rọ̀ náà tọ́ka sí ohun tí ẹni fi ń búra; ‘fi orí rẹ búra’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ὀμόσῃς
  choice: kí o má ṣe ... búra
  rationale: Aorist subjunctive lẹ́yìn μήτε jẹ́ ìkìlọ̀ tàbí òfin òdì; ìṣètò ‘kí o má ṣe búra’ mú agbára ìkìlọ̀ náà jáde kedere.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí a fi kà ìbúra náà léèwọ̀.
- source_word: οὐ δύνασαι
  choice: ìwọ kò lè
  rationale: Ó fi àìlágbára ènìyàn hàn ní ṣókí, ní kedere, àti ní Yorùbá àdánidá.
- source_word: μίαν τρίχα
  choice: irun kan
  rationale: Ó pa ìtẹnumọ́ orísun náà mọ́ pé ènìyàn kò lágbára lórí irun kan ṣoṣo pàápàá.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: funfun tàbí dúdú
  rationale: Àwọn ni ìtumọ̀ àkọ́kọ́ ti àwọn ọ̀rọ̀ àwọ̀ méjèèjì, wọ́n sì pa ìyàtọ̀ tó lágbára nínú Gíríìkì mọ́.
- source_word: ποιῆσαι
  choice: sọ ... di
  rationale: Nínú àyíká yìí ποιέω túmọ̀ sí mímú ohun kan wá sí ipò kan; ‘sọ ... di’ jẹ́ àdánidá ju lílo ‘ṣe’ lásán lọ ní Yorùbá.
theological_decisions:
- issue: Ìrú ìfòfin dè ìbúra tí ẹsẹ yìí ń sọ
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìfòfin dè fífi orí ẹni búra, láì mú un gbòòrò sí ẹ̀kọ́ pé gbogbo ìbúra ní gbogbo ipò ni a kà léèwọ̀.
  alternative: Kí a túmọ̀ ọ́ sí ìfòfin dè gbogbo irú ìbúra, tàbí sí ìdálẹ́bi àwọn ọ̀nà ìbúra ẹ̀tàn nìkan.
  rationale: Ẹsẹ náà fúnra rẹ̀ dá lórí fífi orí ẹni búra, ó sì fi àìlágbára àti ààlà ènìyàn ṣe ìdí rẹ̀. Ìtumọ̀ náà kò yẹ kí ó dá àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò ju ọ̀rọ̀ ẹsẹ náà lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. A kò fi àmì àlàyé [a] sí ọ̀rọ̀ náà, nítorí àlàyé Gẹ̀ẹ́sì tí a pèsè ń tún apá ìkẹyìn ẹsẹ náà sọ dípò kí ó fúnni ní ìtumọ̀ Yorùbá míì tó yẹ.
