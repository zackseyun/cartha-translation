  source_fidelity: 'Ìtumọ̀ náà ń mú ìtumọ̀ Gíríìkì náà jáde dáadáa: ìfòfin dè fífi orí ẹni búra, ìdí ìfòfin náà, àti àìlágbára láti sọ irun ẹyọ kan di funfun tàbí dúdú, gbogbo wọn wà níbẹ̀. Àmọ́, ìyànfẹ́ “Bẹ́ẹ̀ ni” fún μήτε kò bá ìṣọ̀kan òdì tí μήτε ń tẹ̀ síwájú mu ní Yorùbá.'
