revisions:
- from: Bẹ́ẹ̀ ni àwọn ènìyàn kì í tan fìtílà kí wọ́n sì gbé e sábẹ́ agbọ̀n ìwọ̀n[a]; dípò bẹ́ẹ̀, orí ìdúró fìtílà ni wọ́n ń gbé e sí, ó sì ń tan ìmọ́lẹ̀ fún gbogbo àwọn tó wà nínú ilé.[b]
  to: Àwọn ènìyàn kì í tan fìtílà, kí wọ́n sì gbé e sábẹ́ agbọ̀n ìwọ̀n[a]; ṣùgbọ́n wọ́n máa ń gbé e sí orí ìdúró fìtílà, ó sì ń tan ìmọ́lẹ̀ fún gbogbo àwọn tó wà nínú ilé.[b]
  rationale: A yọ “Bẹ́ẹ̀ ni” kúrò nítorí kò ṣe aṣojú iṣẹ́ οὐδέ lọ́nà àdánidá nínú àyíká náà. A tún lo “ṣùgbọ́n” láti fi ἀλλά hàn ní tààrà, àti “wọ́n máa ń gbé e sí” láti pa ìṣe gbogbogbò tó wà nínú ọ̀rọ̀ náà mọ́. A ṣàtúnṣe akọsílẹ̀ a fún ìpéye ìtumọ̀ μόδιος, láì yí ìtumọ̀ ẹsẹ̀ náà padà.
