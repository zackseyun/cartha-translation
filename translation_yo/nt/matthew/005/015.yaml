id: MAT.5.15
reference: Matthew 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: yo
  text: Àwọn ènìyàn kì í tan fìtílà, kí wọ́n sì gbé e sábẹ́ agbọ̀n ìwọ̀n[a]; ṣùgbọ́n wọ́n máa ń gbé e sí orí ìdúró fìtílà, ó sì ń tan ìmọ́lẹ̀ fún gbogbo àwọn tó wà nínú ilé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sábẹ́ ohun èlò ìwọ̀n.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìwọ̀n fún ohun gbígbẹ kan àti, nípa ìgbòòrò ìtumọ̀, ohun èlò tí a fi ń wọ̀n ọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì ń tàn fún gbogbo àwọn tó wà nínú ilé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Bẹ́ẹ̀ ni ... kì í
  rationale: Ó so àpẹẹrẹ òdì míì mọ́ ọ̀rọ̀ tó ṣáájú, ó sì bá ọ̀nà tí Yorùbá fi ń sọ òtítọ́ gbogbogbò mu.
- source_word: καίουσιν λύχνον
  choice: àwọn ènìyàn kì í tan fìtílà
  rationale: Ọ̀rọ̀-ìṣe ọ̀pọ̀ tí kò ní olùṣe tí a dárúkọ jẹ́ ti gbogbogbò; “àwọn ènìyàn” mú èyí hàn ní Yorùbá. “Tan fìtílà” ni gbólóhùn àdánidá fún mímú fìtílà bẹ̀rẹ̀ sí í jó.
- source_word: ὑπὸ τὸν μόδιον
  choice: sábẹ́ agbọ̀n ìwọ̀n
  rationale: μόδιος jẹ́ ìwọ̀n ohun gbígbẹ àti ohun èlò tí a fi ń wọ̀n ọ́; “agbọ̀n ìwọ̀n” pa iṣẹ́ ohun èlò náà mọ́ láì lo ọ̀rọ̀ àjèjì.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: dípò bẹ́ẹ̀, orí ìdúró fìtílà
  rationale: “Ìdúró fìtílà” ṣàlàyé λυχνία gẹ́gẹ́ bí ohun tí a gbé fìtílà lé; “dípò bẹ́ẹ̀” fi ìtakora ἀλλά hàn kedere.
- source_word: λάμπει
  choice: ó sì ń tan ìmọ́lẹ̀
  rationale: Ó pa àwòrán fìtílà tó ń tàn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: fún gbogbo àwọn tó wà nínú ilé
  rationale: Ó pa ìtẹnumọ́ πᾶσιν mọ́, ó sì túmọ̀ οἰκία ní ọ̀nà àyè, ìyẹn ilé, kì í ṣe ìdílé.
theological_decisions:
- issue: Olùṣe ọ̀pọ̀ ti gbogbogbò tí kò hàn gbangba nínú Gíríìkì
  choice: àwọn ènìyàn kì í tan fìtílà
  alternative: ẹnikẹ́ni kì í tan fìtílà
  rationale: “Àwọn ènìyàn” pa nọ́ńbà ọ̀pọ̀ àti ìtumọ̀ òwe gbogbogbò mọ́; kò fi “wọ́n” sílẹ̀ láìsí ẹni tí ó tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún òǹkàwé gbogbogbò. “Kì í ... kí wọ́n sì ...” fi àṣà ìṣe gbogbogbò hàn.
