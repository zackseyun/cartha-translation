revisions:
- from: Nítorí lóòótọ́ ni mo wí fún yín pé, títí ọ̀run àti ayé yóò fi kọjá lọ, lẹ́tà íótà kan[a] tàbí ìlà kékeré kan[b] kì yóò kọjá lọ lára òfin rárá, títí gbogbo nǹkan yóò fi ṣẹlẹ̀.[c]
  to: Nítorí, lóòótọ́ ni mo wí fún yín pé, títí ọ̀run àti ayé yóò fi kọjá lọ, lẹ́tà íótà kan[a] tàbí àmì kékeré kan[b] kì yóò kọjá kúrò nínú òfin rárá, títí gbogbo nǹkan yóò fi ṣẹlẹ̀.[c]
  rationale: 'The revision makes two limited lexical improvements: it renders ἀπὸ τοῦ νόμου with an explicit “from/out of the law” construction, and it uses a broader term for κεραία. The temporal phrasing, solemn register, emphatic negation, and deliberately broad rendering of πάντα γένηται are retained.'
  reviewer_model: gpt-5.6-terra
