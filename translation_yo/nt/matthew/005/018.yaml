    reason: lexical_alternative
  - marker: c
    text: 'Tàbí: “títí gbogbo rẹ̀ yóò fi ṣẹ” tàbí “títí gbogbo rẹ̀ yóò fi dé ìmúṣẹ.”'
    reason: alternative_reading
  revision_rationale: 'The revision makes two limited lexical improvements: it renders ἀπὸ τοῦ νόμου with an explicit “from/out of the law” construction, and it uses a broader term for κεραία. The temporal phrasing, solemn register, emphatic negation, and deliberately broad rendering of πάντα γένηται are retained.'
