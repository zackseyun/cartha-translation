id: MAT.5.18
reference: Matthew 5:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: yo
  text: Nítorí, lóòótọ́ ni mo wí fún yín pé, títí ọ̀run àti ayé yóò fi kọjá lọ, lẹ́tà íótà kan[a] tàbí àmì kékeré kan[b] kì yóò kọjá kúrò nínú òfin rárá, títí gbogbo nǹkan yóò fi ṣẹlẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni lẹ́tà Gíríìkì tó kéré jù lọ; a tún lè pè é ní “lẹ́tà kékeré kan.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni àmì ìkọ̀wé tín-ín-rín kan tó lè fi lẹ́tà kan yàtọ̀ sí òmíràn.
    reason: lexical_alternative
  - marker: c
    text: 'Tàbí: “títí gbogbo rẹ̀ yóò fi ṣẹ” tàbí “títí gbogbo rẹ̀ yóò fi dé ìmúṣẹ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: lóòótọ́ ni
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìmúdájú ọ̀rọ̀ hàn, ó sì pa agbára ọ̀rọ̀ ìṣáájú tí Jésù sọ mọ́.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí rẹ̀.
- source_word: λέγω ὑμῖν
  choice: mo wí fún yín pé
  rationale: Ó tẹ̀lé ìtumọ̀ Gíríìkì pẹ́kípẹ́kí, ó sì ní ìforúkọsílẹ̀ ọ̀rọ̀ tó yẹ fún àsọyé aláṣẹ.
- source_word: ἕως ἂν παρέλθῃ
  choice: títí ... yóò fi kọjá lọ
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún ohun ọjọ́ iwájú tí yóò dé òpin kan, ó sì pa àwòrán ‘kọjá lọ’ mọ́.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ọ̀run àti ayé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ àpapọ̀ gbogbo ẹ̀dá ayé àti ọ̀run.
- source_word: ἰῶτα ἓν
  choice: lẹ́tà íótà kan
  rationale: A pa orúkọ lẹ́tà Gíríìkì náà mọ́ kí ìtumọ̀ orísun má bàa sọnù, a sì fi ‘lẹ́tà’ kún un fún òye olùkà.
- source_word: μία κεραία
  choice: ìlà kékeré kan
  rationale: Ó ń tọ́ka sí ìlà tàbí àmì tín-ín-rín kan nínú ìkọ̀wé lẹ́tà; ọ̀rọ̀ yìí ṣe kedere ní Yorùbá òde òní.
- source_word: οὐ μὴ παρέλθῃ
  choice: kì yóò kọjá lọ ... rárá
  rationale: Àkójọpọ̀ ‘kì ... rárá’ gbé ìkọ̀ Gíríìkì tó lágbára jáde ní Yorùbá àdánidá.
- source_word: ἀπὸ τοῦ νόμου
  choice: lára òfin
  rationale: ‘Lára’ fi hàn pé kò sí apá kankan nínú òfin tí yóò kọjá lọ, láìfi ìtumọ̀ kan pàtó lé νόμος lórí ju ohun tí àyíká sọ lọ.
- source_word: ἕως ἂν πάντα γένηται
  choice: títí gbogbo nǹkan yóò fi ṣẹlẹ̀
  rationale: Ó pa ìtumọ̀ gbòòrò ti γίνομαι gẹ́gẹ́ bí ohun tó wáyé mọ́, láìdín un kù sí ètò ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
theological_decisions:
- issue: Ohun tí νόμος ń tọ́ka sí
  choice: òfin
  alternative: Òfin Mósè/Tórà ní pàtó, tàbí Ìwé Mímọ́ àtijọ́ ní ìtumọ̀ gbòòrò
  rationale: Àyíká Mátíù 5:17–19 ń tọ́ka sí ‘Òfin àti Àwọn Wòlíì,’ ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ sọ νόμος. Ìtumọ̀ náà pa ‘òfin’ mọ́ láìyanju bí ó ṣe gbòòrò tó.
- issue: Agbára ìtumọ̀ πάντα γένηται
  choice: títí gbogbo nǹkan yóò fi ṣẹlẹ̀
  alternative: títí gbogbo rẹ̀ yóò fi ṣẹ tàbí parí ní ìmúṣẹ
  rationale: γίνομαι lè túmọ̀ sí ohun tó ṣẹlẹ̀ tàbí ohun tó dé ìmúṣẹ. Ọ̀rọ̀ inú àkọ́kọ́ pa ààyè ìtumọ̀ yìí sílẹ̀, àlàyé ìsàlẹ̀ sì fi ọ̀nà kejì hàn.
translation_notes:
  register: A lo Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún olùkà òde òní. Àwọn àmì ohùn kún ibi tí ó yẹ. ‘Lóòótọ́ ni mo wí fún yín’ pa ìrísí àsọyé aláṣẹ mọ́; ‘kì ... rárá’ sì gbé ìkọ̀ tó lágbára jáde. A kọ ‘òfin’ ní lẹ́tà kékeré láti má ṣe fi ìtumọ̀ tó dín kù tàbí tó gbòòrò ju Gíríìkì lọ lé e lórí.
