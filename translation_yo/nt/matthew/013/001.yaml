id: MAT.13.1
reference: Matthew 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: yo
  text: Ní ọjọ́ náà, Jésù jáde kúrò ní ilé, ó sì jókòó lẹ́gbẹ̀ẹ́ òkun[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘Ní ọjọ́ kan náà,’ bí a bá ka gbólóhùn náà sí èyí tó ń tẹnumọ́ ìtẹ̀síwájú láti inú ohun tó ṣẹlẹ̀ ṣáájú, dípò pé ó kàn ń tọ́ka sí àkókò.
    reason: alternative_reading
  - marker: b
    text: A tún lè sọ pé ‘nítòsí òkun.’ Gbólóhùn Gíríìkì náà túmọ̀ sí ibi kan nítòsí òkun, ṣùgbọ́n kò sọ bí ibẹ̀ ṣe jìnnà sí etí omi ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Ní ọjọ́ náà
  rationale: Ó jẹ́ gbólóhùn àkókò tó bá Yorùbá òde òní mu, ó sì pa ìtọ́ka sí ọjọ́ náà mọ́ láìfi ọ̀rọ̀ ‘kan náà’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: jáde kúrò ní ilé
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist náà ń ṣáájú ìṣe pàtàkì; fífi í hàn gẹ́gẹ́ bí ìṣe tó tẹ̀ lé ara rẹ̀ jẹ́ èdè Yorùbá àdánidá. ‘Kúrò ní ilé’ mú ibi tí ó jáde kúrò níbẹ̀ hàn kedere.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A kọ orúkọ ẹni náà ní ìlànà ìkọ̀wé Yorùbá tó wọ́pọ̀.
- source_word: ἐκάθητο
  choice: ó sì jókòó
  rationale: Fọ́ọ̀mù imperfect náà fi ìṣe tó ń lọ tàbí ipò ìjókòó hàn nínú ìtàn; ‘jókòó’ jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ìran náà kalẹ̀ láìfi ìtumọ̀ pé ó ṣẹ̀ṣẹ̀ mú ìjókòó rẹ̀ kún un.
- source_word: παρὰ τὴν θάλασσαν
  choice: lẹ́gbẹ̀ẹ́ òkun
  rationale: Παρά pẹ̀lú accusative níhìn-ín tọ́ka sí ipò nítòsí òkun, láìsọ bí ó ṣe jìnnà sí etí omi ní pàtó.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún níbi tó yẹ; ọ̀rọ̀ náà jẹ́ ti ìgbàlódé, ọlọ́lá, ó sì rọrùn fún òǹkàwé lásán láti lóye. Àwọn àmì àlàyé [a] àti [b] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé.
