id: MAT.13.8
reference: Matthew 13:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: yo
  text: Ṣùgbọ́n irúgbìn mìíràn ṣubú sórí ilẹ̀ rere, ó sì ń so èso—ọ̀kan ní ìlọ́po ọgọ́rùn-ún, òmíràn ní ìlọ́po ọgọ́ta, òmíràn sì ní ìlọ́po ọgbọ̀n.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: irúgbìn mìíràn
  rationale: Ọ̀rọ̀ ajẹtífù aláìláàlàyé tó wà ní ọ̀pọ̀ nínú Gíríìkì dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí irúgbìn inú àkàwé náà; a fi “irúgbìn” kún un fún ìmọ̀ kedere ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi àbájáde yìí ṣe ìyàtọ̀ sí ohun tó ṣẹlẹ̀ sí àwọn irúgbìn tí a sọ ṣáájú.
- source_word: ἔπεσεν
  choice: ṣubú
  rationale: Èyí pa àwòrán gangan ti irúgbìn tó ṣubú mọ́, dípò ṣíṣe àlàyé rẹ̀ sí “a gbìn ín.”
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: sórí ilẹ̀ rere
  rationale: Nínú ọ̀rọ̀ iṣẹ́ àgbẹ̀ yìí, “ilẹ̀ rere” túmọ̀ sí ilẹ̀ tó dára fún irúgbìn, ó sì jẹ́ gbólóhùn àdánidá ní Yorùbá.
- source_word: ἐδίδου καρπόν
  choice: ó sì ń so èso
  rationale: Àmì àkókò aláìpé nínú Gíríìkì tọ́ka sí ìṣe tó ń lọ tàbí tó máa ń ṣẹlẹ̀; “ń so èso” mú èyí àti àwòrán iṣẹ́ àgbẹ̀ jáde lọ́nà àdánidá.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ọ̀kan ní ìlọ́po ọgọ́rùn-ún, òmíràn ní ìlọ́po ọgọ́ta, òmíràn sì ní ìlọ́po ọgbọ̀n
  rationale: Èyí tẹ̀ lé ìpínkiri Gíríìkì “ọ̀kan…òmíràn…òmíràn,” ó sì sọ kedere pé àwọn iye náà jẹ́ ìlọ́po èso tí irúgbìn kọ̀ọ̀kan mú jáde.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A pa ìṣe tó ń lọ nínú ἐδίδου mọ́ nípasẹ̀ “ń so èso,” a sì lo ìṣètò “ọ̀kan…òmíràn…òmíràn” láìfi ẹ̀kọ́ ìsìn kankan kún ọ̀rọ̀ náà.
