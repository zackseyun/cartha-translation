  source_fidelity: Ìtumọ̀ náà fi ἄλλα hàn gẹ́gẹ́ bí “irúgbìn mìíràn,” ó pa ìṣe gangan ἔπεσεν (“ṣubú”) mọ́, ó sì túmọ̀ ἐπὶ τὴν γῆν τὴν καλὴν ní ìbámu pẹ̀lú àyíká iṣẹ́ àgbẹ̀. “Ó sì ń so èso” ń fi apá ìṣe tí ó ń lọ nínú ἐδίδου hàn lọ́nà tó yẹ. Ìṣètò “ọ̀kan… òmíràn… òmíràn” ṣètọ́jú ìpínkiri μὲν/δὲ/δὲ àti ìyàtọ̀ àwọn ìwọ̀n èso.
  naturalness: Yorùbá náà jẹ́ àdánidá, òde òní, ó sì yẹ fún ìforúkọsílẹ̀ mímọ́. “Ilẹ̀ rere,” “ń so èso,” àti “ní ìlọ́po…” jẹ́ ọ̀rọ̀ tó ṣe kedere nínú àwòrán irúgbìn. Àmì ohùn àti ìkọ̀wé pọ̀n dáradára.
  terminology: Aṣàyàn “irúgbìn,” “ilẹ̀ rere,” àti “èso” bá ọ̀rọ̀ àgbẹ̀ inú àkàwé náà mu. “Ìlọ́po ọgọ́rùn-ún/ọgọ́ta/ọgbọ̀n” sọ ìtumọ̀ ìwọ̀n-ìbísí náà di mímọ́ láìfi ìtumọ̀ ẹ̀sìn tàbí ìmọ̀ ẹ̀kọ́ kún un.
