id: MAT.13.32
reference: Matthew 13:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: yo
  text: Lóòótọ́, ó kéré ju gbogbo irúgbìn lọ; ṣùgbọ́n nígbà tí ó bá dàgbà, ó tóbi ju àwọn ewéko inú ọgbà lọ, ó sì di igi[b], tó bẹ́ẹ̀ tí àwọn ẹyẹ ojú ọ̀run[a] fi ń wá, tí wọ́n sì ń tẹ́ ìtẹ́ nínú àwọn ẹ̀ka rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “àwọn ẹyẹ ojú afẹ́fẹ́”; “àwọn ẹyẹ ojú ọ̀run” túmọ̀ τὰ πετεινὰ τοῦ οὐρανοῦ ní tààrà sí i.
    reason: lexical_alternative
  - marker: b
    text: Àwòrán àwọn ẹyẹ tí ń tẹ́ ìtẹ́ nínú àwọn ẹ̀ka igi lè mú àwọn àwòrán Májẹ̀mú Láéláé nípa igi ńlá tó dúró fún ìjọba wá sí ọkàn (fún àpẹẹrẹ, Ìsíkíẹ́lì 17:23; Dáníẹ́lì 4:12), ṣùgbọ́n ẹsẹ̀ yìí kò sọ ìtumọ̀ àwòrán náà ní tààrà.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: ó kéré ju gbogbo irúgbìn lọ
  rationale: Èyí pa ìrísí afíwéra Gíríìkì mọ́ dípò lílo ọ̀rọ̀ tó túmọ̀ sí ‘èyí tó kéré jù lọ,’ ó sì jẹ́ Yorùbá àdánidá.
- source_word: μέν ... δέ
  choice: Lóòótọ́ ... ṣùgbọ́n
  rationale: Àkójọpọ̀ yìí mú ìyàtọ̀ láàárín ìbẹ̀rẹ̀ kékeré irúgbìn náà àti bí ó ṣe tóbi níkẹyìn hàn gbangba.
- source_word: ὅταν ... αὐξηθῇ
  choice: nígbà tí ó bá dàgbà
  rationale: Ó sọ ìdàgbàsókè tí yóò ṣẹlẹ̀ ní kíkún ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: μεῖζον τῶν λαχάνων
  choice: ó tóbi ju àwọn ohun ọ̀gbìn inú ọgbà lọ
  rationale: λάχανα níhìn-ín jẹ́ àwọn ohun ọ̀gbìn tí a ń gbin sínú ọgbà; yíyan ‘ohun ọ̀gbìn inú ọgbà’ kò fi ìtumọ̀ náà mọ́ ewébẹ̀ tàbí ewé olóòórùn nìkan.
- source_word: γίνεται δένδρον
  choice: ó sì di igi
  rationale: Èyí pa àwòrán tó lágbára nínú Gíríìkì mọ́ láì sọ ọ́ di ohun tó dà bí igi lásán.
- source_word: ὥστε ἐλθεῖν
  choice: tó bẹ́ẹ̀ tí ... fi ń wá
  rationale: Àgbékalẹ̀ yìí fi àbájáde ìdàgbàsókè igi náà hàn ní Yorùbá àdánidá.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: ‘Ojú ọ̀run’ bá οὐρανός mu ní àyíká yìí, ó sì jẹ́ gbólóhùn Yorùbá tó mọ́gbọ́n dání.
- source_word: κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ
  choice: wọ́n sì ń tẹ́ ìtẹ́ sí àwọn ẹ̀ka rẹ̀
  rationale: Nínú àyíká àwọn ẹyẹ àti ẹ̀ka igi, ‘tẹ́ ìtẹ́’ sọ ìtumọ̀ gbígbé tàbí ṣíṣe ibùgbé kalẹ̀ ní kedere.
theological_decisions:
- issue: Ó ṣeé ṣe kí àwòrán àwọn ẹyẹ tí ń tẹ́ ìtẹ́ sínú igi ńlá tọ́ka sí àwọn àwòrán igi ìjọba nínú Májẹ̀mú Láéláé.
  choice: A pa àwòrán náà mọ́ gẹ́gẹ́ bí ó ṣe wà, láì túmọ̀ àwọn ẹyẹ náà sí àwọn orílẹ̀-èdè tàbí àwọn ènìyàn nínú ọ̀rọ̀ ẹsẹ̀ náà.
  alternative: Kí a sọ ní tààrà pé àwọn ẹyẹ dúró fún àwọn orílẹ̀-èdè tàbí àwọn ènìyàn tí wọ́n rí ààbò nínú ìjọba Ọlọ́run.
  rationale: Ẹsẹ̀ náà lè mú Ìsíkíẹ́lì 17:23 àti Dáníẹ́lì 4:12 wá sí ọkàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò ṣàlàyé àmì náà ní tààrà; nítorí náà, ìtumọ̀ náà kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀kọ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ohun ọ̀gbìn inú ọgbà’ jẹ́ gbólóhùn tó yé àwọn òǹkàwé lasán, ‘tẹ́ ìtẹ́’ sì jẹ́ ọ̀rọ̀ àdánidá fún ohun tí ẹyẹ ń ṣe lórí ẹ̀ka igi. A gbé àmì [a] sí lẹ́yìn gbólóhùn tí àlàyé rẹ̀ kan, dípò lẹ́yìn ‘irúgbìn.’
