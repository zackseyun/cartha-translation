id: MAT.13.56
reference: Matthew 13:56
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: yo
  text: Gbogbo àwọn arábìnrin rẹ̀ kò ha wà pẹ̀lú wa bí? Níbo ni ọkùnrin yìí wá ti rí gbogbo nǹkan wọ̀nyí gbà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn obìnrin ìbátan rẹ̀.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí “àwọn arábìnrin” níbí, ṣùgbọ́n àwọn kan túmọ̀ ọ́ ní ọ̀nà tí ó gbòòrò sí i nítorí àwọn ìjíròrò ẹ̀kọ́ ìsìn tó wáyé lẹ́yìn náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: àwọn arábìnrin
  rationale: Èyí ni ìtumọ̀ ìbátan ẹ̀jẹ̀ tí ó wọ́pọ̀ jù lọ fún ọ̀rọ̀ Gíríìkì náà, ó sì bá ọ̀rọ̀ nípa agbo ilé Jésù nínú àyíká ẹsẹ náà mu.
- source_word: οὐχὶ πᾶσαι
  choice: gbogbo kò ha ... bí?
  rationale: Ìbéèrè àsọyé yìí ń retí ìdáhùn bẹ́ẹ̀ ni, ó sì tẹnumọ́ gbogbo àwọn arábìnrin náà.
- source_word: πρὸς ἡμᾶς
  choice: wà pẹ̀lú wa
  rationale: Ó fi hàn pé wọ́n wà ní àárín àwọn ènìyàn agbègbè náà; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: πόθεν
  choice: níbo ni ... ti rí ... gbà
  rationale: Ó béèrè orísun ohun tí Jésù ní; ìsọyìí mú ìtumọ̀ orísun náà jáde ní Yorùbá àdánidá.
- source_word: οὖν
  choice: nígbà náà
  rationale: Ó so ìbéèrè náà mọ́ ìpinnu tí àwọn ará ìlú ń fà láti inú ohun tí wọ́n mọ̀ nípa ìdílé Jésù.
- source_word: τούτῳ
  choice: ọkùnrin yìí
  rationale: Ó tọ́ka sí Jésù ní ọ̀nà tí ó ní ìró àìbọ̀wọ̀ díẹ̀, gẹ́gẹ́ bí àyíká ọ̀rọ̀ náà ṣe fi hàn.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó tọ́ka ní gbogbogbòò sí ọgbọ́n àti iṣẹ́ agbára tí a mẹ́nu kàn ṣáájú.
theological_decisions:
- issue: Irú ìbátan tí ‘àwọn arábìnrin’ ní pẹ̀lú Jésù
  choice: Túmọ̀ ἀδελφαὶ ní ìtumọ̀ rẹ̀ tí ó wọ́pọ̀ pé ‘àwọn arábìnrin.’
  alternative: Àwọn obìnrin ìbátan rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí arábìnrin níbí. Yíyàn ìtumọ̀ ìbátan tí ó gbòòrò sí i lè fi ìpinnu ẹ̀kọ́ ìgbà tó tẹ̀ lé e sínú ẹsẹ náà; àlàyé ìsàlẹ̀ ni ó dára fún yíyan mìíràn náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìbéèrè àsọyé ‘kò ha ... bí?’ pa ìfojúsọ́nà ìdáhùn rere mọ́, nígbà tí ‘ọkùnrin yìí’ ń gbé ìró ìtọ́kasí tí kò fi bẹ́ẹ̀ bọ̀wọ̀ hàn.
