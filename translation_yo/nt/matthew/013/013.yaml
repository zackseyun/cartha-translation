id: MAT.13.13
reference: Matthew 13:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: yo
  text: Nítorí èyí ni mo fi ń sọ̀rọ̀ fún wọn nínú àwọn òwe àkàwé, nítorí pé nígbà tí wọ́n ń wò, wọn kò rí, àti nígbà tí wọ́n ń gbọ́, wọn kò gbọ́, bẹ́ẹ̀ ni wọn kò sì lóye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “bí ó tilẹ̀ jẹ́ pé wọ́n ń wò, wọn kò rí; bí ó tilẹ̀ jẹ́ pé wọ́n ń gbọ́, wọn kò gbọ́.”
    reason: Àwọn ọ̀rọ̀ aláìparí Gíríìkì lè jẹ́ àlàyé àkókò tàbí kí wọ́n ní agbára ìyọ̀ǹda; àlàyé yìí fi ọ̀nà ìtumọ̀ kejì hàn láì pa àìdánilójú náà rẹ́.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí ni
  rationale: Ó pa agbára ìdí tí gbólóhùn Gíríìkì ní mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé ohun tí ó tẹ̀ lé ni ìdí.
- source_word: ἐν παραβολαῖς
  choice: nípa òwe àkàwé
  rationale: ‘Òwe àkàwé’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìtàn tàbí àpẹẹrẹ tí a fi ń kọ́ni ní ẹ̀kọ́; ‘nípa’ fi hàn pé èyí ni ọ̀nà tí Jésù gbà ń sọ̀rọ̀.
- source_word: λαλῶ
  choice: mo fi ń bá wọn sọ̀rọ̀
  rationale: Ìṣe àkókò ìsinsìnyí náà farahàn nínú ‘ń ... sọ̀rọ̀,’ ‘bá wọn’ sì mú ẹni tí a ń sọ̀rọ̀ sí hàn lọ́nà àdánidá.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó túmọ̀ asopọ̀ náà gẹ́gẹ́ bí ìdí, kì í ṣe gẹ́gẹ́ bí àkóónú ọ̀rọ̀ nìkan.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: nígbà tí wọ́n ń wò, wọn kò rí
  rationale: Ó pa ìyàtọ̀ àràmàǹdà tó wà láàárín wíwo àti rírí mọ́ láì fi ìtumọ̀ ẹ̀mí kan kún un ní tààràtà.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: nígbà tí wọ́n ń gbọ́, wọn kò gbọ́
  rationale: Ó tẹ̀ lé ìṣọ̀kan àtẹ̀jáde Gíríìkì, ó sì pa ìfòyemọ̀ ti gbígbọ́ tí kò yọrí sí gbígbọ́ tòótọ́ mọ́.
- source_word: οὐδὲ συνίουσιν
  choice: bẹ́ẹ̀ ni wọn kò sì lóye
  rationale: ‘Lóye’ sọ ìkùnà láti mọ ìtumọ̀ tàbí pàtàkì ohun tí a rí àti ohun tí a gbọ́, láì fi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Agbára àwọn ọ̀rọ̀ aláìparí βλέποντες àti ἀκούοντες
  choice: ‘nígbà tí wọ́n ń wò’ àti ‘nígbà tí wọ́n ń gbọ́’
  alternative: ‘bí ó tilẹ̀ jẹ́ pé wọ́n ń wò’ àti ‘bí ó tilẹ̀ jẹ́ pé wọ́n ń gbọ́’
  rationale: Gíríìkì lè ní agbára ìyàtọ̀ bí ‘bí ó tilẹ̀ jẹ́ pé,’ ṣùgbọ́n ọ̀rọ̀ àkọ́kọ́ kò sọ ìyọ̀ǹda náà ní kedere. Àtúmọ̀ yìí pa àìdánilójú àti ìforígbárí ọ̀rọ̀ náà mọ́.
- issue: Ìtumọ̀ συνίουσιν nínú àyíká ọ̀rọ̀
  choice: ‘lóye’
  alternative: ‘mọ̀ ní kíkún’ tàbí ‘fòye mọ̀’
  rationale: ‘Lóye’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún mímú ìtumọ̀ ohun kan, ó sì yẹra fún fífi ẹ̀sùn tàbí ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ ní tààràtà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. A lo ‘òwe àkàwé’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó mọ́gbọ́n dání fún παραβολή.
