id: MAT.13.10
reference: Matthew 13:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: yo
  text: Nígbà náà ni àwọn ọmọ-ẹ̀yìn náà sún mọ́ Jesu, wọ́n sì sọ fún un pé, “Èé ṣe tí o fi ń bá wọn sọ̀rọ̀ nípasẹ̀ àwọn àkàwé?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Nígbà náà ni
  rationale: Ní àyíká yìí, καί ń tẹ ìtàn náà síwájú lẹ́yìn tí Jesu ti kọ́ àwọn ènìyàn; ‘Nígbà náà ni’ jẹ́ ọ̀nà àdánidá láti fi ìtẹ̀síwájú ìtàn hàn ní Yorùbá.
- source_word: προσελθόντες
  choice: sún mọ́ Jesu
  rationale: Ọ̀rọ̀ náà tọ́ka sí bí àwọn ọmọ-ẹ̀yìn ṣe kọ́kọ́ sún mọ́ ọn kí wọ́n tó sọ̀rọ̀. Fífi ‘Jesu’ sí i mú ẹni tí wọ́n sún mọ́ ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Àmì ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn tí a ti mọ̀ tẹ́lẹ̀; ‘náà’ fi ìdánimọ̀ yẹn hàn láìfi ‘tirẹ̀’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: εἶπαν αὐτῷ
  choice: wọ́n sì sọ fún un pé
  rationale: Èyí pa ìtumọ̀ gangan ti ‘wọ́n sọ fún un’ mọ́, bí ó tilẹ̀ jẹ́ pé gbólóhùn tó tẹ̀ lé e jẹ́ ìbéèrè.
- source_word: Διὰ τί
  choice: Èé ṣe tí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti ṣókí fún ìbéèrè nípa ìdí.
- source_word: ἐν παραβολαῖς
  choice: nípasẹ̀ àwọn àkàwé
  rationale: ἐν pẹ̀lú ọ̀rọ̀ dative níbí ń ṣàpèjúwe ọ̀nà tàbí èlò tí Jesu fi ń sọ̀rọ̀; ‘nípasẹ̀ àwọn àkàwé’ mú èyí ṣe kedere ní Yorùbá.
- source_word: λαλεῖς
  choice: o fi ń bá wọn sọ̀rọ̀
  rationale: Àkókò ìṣe tó ń lọ nínú Gíríìkì bá ìlò ‘ń’ mu, ‘bá wọn sọ̀rọ̀’ sì jẹ́ Yorùbá àdánidá fún sísọ̀rọ̀ sí àwùjọ kan.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Arọ́pò-orúkọ yìí tọ́ka sí àwọn tí Jesu ń bá sọ̀rọ̀; ‘wọn’ wà nínú gbólóhùn ‘bá wọn sọ̀rọ̀’ ní ọ̀nà àdánidá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ, ní èdè ọ̀wọ̀, àdánidá, tí ó sì ṣeé yé fún òǹkàwé òde òní. ‘Àkàwé’ ni ọ̀rọ̀ tí ó wọ́pọ̀ fún παραβολή nínú àyíká Bíbélì. A kò fi àmì àlàyé [a] sí ọ̀rọ̀ náà, nítorí ‘sún mọ́ Jesu’ ti pa ìtẹnumọ́ Gíríìkì mọ́ kedere, kò sì nílò àṣàyàn ọ̀rọ̀ míì.
