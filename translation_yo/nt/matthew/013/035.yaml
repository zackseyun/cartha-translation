id: MAT.13.35
reference: Matthew 13:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: yo
  text: 'Kí ohun tí a sọ nípasẹ̀ wòlíì náà lè ṣẹ, bí ó ti wí pé:


    “Èmi yóò ṣí ẹnu mi nípasẹ̀ àwọn àkàwé;

    ẹ̀mi yóò sọ àwọn ohun tí a ti fi pamọ́ láti ìpìlẹ̀[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “láti ìpìlẹ̀ ayé.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως
  choice: Kí ... lè
  rationale: Ètò ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde hàn, ó sì bá ọ̀rọ̀ ìmúṣẹ Mátíù mu.
- source_word: πληρωθῇ
  choice: ṣẹ
  rationale: “Kí ... lè ṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìmúṣẹ ohun tí a ti sọ tẹ́lẹ̀, láìfi ìtumọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: τὸ ῥηθὲν
  choice: ohun tí a sọ
  rationale: Ó tú àpólà alábápín ọ̀rọ̀ náà sí Yorùbá tó rọrùn, tó sì pa ìtumọ̀ rẹ̀ mọ́.
- source_word: διὰ τοῦ προφήτου
  choice: nípasẹ̀ wòlíì náà
  rationale: “Nípasẹ̀” pa ìtumọ̀ wòlíì gẹ́gẹ́ bí ẹni tí Ọlọ́run fi ránṣẹ́ sọ ọ̀rọ̀ náà mọ́.
- source_word: λέγοντος
  choice: bí ó ti wí pé
  rationale: Ọ̀nà àdánidá ní Yorùbá láti darí olùkà wọ inú ọ̀rọ̀ àyọlò náà.
- source_word: Ἀνοίξω ... τὸ στόμα μου
  choice: Èmi yóò la ẹnu mi
  rationale: Ó tẹ̀ lé àwòrán ewì inú orísun, ó sì jẹ́ gbólóhùn Yorùbá tó ṣeé lóye.
- source_word: ἐν παραβολαῖς
  choice: ní àwọn àkàwé
  rationale: “Àkàwé” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún irú ẹ̀kọ́ tí παραβολή ń tọ́ka sí ní Mátíù.
- source_word: ἐρεύξομαι
  choice: èmi yóò sọ
  rationale: Ọ̀rọ̀ Gíríìkì náà ní agbára ìtumọ̀ sísọ ohun jáde; “sọ” jẹ́ kedere àti àdánidá ní Yorùbá, láìsọ ọ̀rọ̀ náà di aláìmọ̀ nítorí ìtumọ̀ gangan jù.
- source_word: κεκρυμμένα
  choice: àwọn ohun tí a ti fi pamọ́
  rationale: Ó pa ìtumọ̀ aláìṣe àti ipò ohun tí ó ti wà ní ìpamọ́ mọ́, dípò lílo “àṣírí,” èyí tí ó lè túmọ̀ sí ohun míì.
- source_word: ἀπὸ καταβολῆς
  choice: láti ìgbà ìpilẹ̀ṣẹ̀
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá tó pé ní ti èdè, ó sì tẹ̀ lé àyọkà Gíríìkì tí a pèsè, èyí tí kò ní κόσμου (“ayé”).
theological_decisions:
- issue: Orúkọ ẹni tí a fa ọ̀rọ̀ rẹ̀ yọ
  choice: wòlíì náà
  alternative: Ásáfù wòlíì náà
  rationale: Àyọkà SBLGNT tí a pèsè sọ “wòlíì náà” nìkan; a kò fi orúkọ tí kò sí nínú orísun kún un.
- issue: Ìwọ̀n àpólà ἀπὸ καταβολῆς
  choice: láti ìgbà ìpilẹ̀ṣẹ̀
  alternative: láti ìgbà ìpilẹ̀ṣẹ̀ ayé
  rationale: Àyọkà Gíríìkì tí a fún wa kò ní κόσμου (“ayé”). A pa ìtumọ̀ yẹn mọ́ nínú àkọ́kọ́, a sì tọ́ka sí ẹ̀dà gígùn nínú àlàyé ìsàlẹ̀ láìyanjú àìdánilójú àfọwọ́kọ ní ìdákẹ́jẹ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ó ṣeé lóye fún olùkà òde òní, ó sì pa ìrísí ewì ọ̀rọ̀ àyọlò náà mọ́.
