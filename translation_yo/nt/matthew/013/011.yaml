id: MAT.13.11
reference: Matthew 13:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: yo
  text: Ó dá wọn lóhùn pé, “Nítorí pé a ti fi fún yín[b] láti mọ àwọn ohun ìjìnlẹ̀[a] ti ìjọba ọ̀run, ṣùgbọ́n a kò fi fún àwọn yẹn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn àṣírí.”
    reason: lexical_alternative
  - marker: b
    text: Ìṣe aláìlórúkọ náà kò dárúkọ ẹni tó fúnni; nínú àyíká yìí, a lè lóye ẹni náà sí Ọlọ́run.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ó dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àsọyé Gíríìkì tí ó túmọ̀ sí pé ó dá wọn lóhùn, láìṣe àtúnṣe ọ̀rọ̀ méjì náà lọ́nà líle.
- source_word: Ὅτι
  choice: Nítorí pé
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ὅτι ń ṣàlàyé ìdí tí Jésù fi ń bá àwọn ènìyàn sọ̀rọ̀ ní òwe; “Nítorí pé” mú ìbáṣepọ̀ ìdí náà hàn kedere.
- source_word: ὑμῖν δέδοται γνῶναι
  choice: a ti fi fún yín láti mọ
  rationale: Ìtumọ̀ yìí pa ìṣe aláìlórúkọ mọ́, ó sì fi ipò tí ó wà nísinsìnyí nítorí ohun tí a ti fi fún wọn hàn.
- source_word: τὰ μυστήρια
  choice: àwọn ohun ìjìnlẹ̀
  rationale: “Àwọn ohun ìjìnlẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó níyì, tó sì lè tọ́ka sí òtítọ́ Ọlọ́run tí ó ti fara sin ṣùgbọ́n tí a ń ṣí payá, kì í ṣe ohun tí kò ṣeé lóye lásán.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: ti ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá àti tí a mọ̀ dáadáa fún gbólóhùn Mátíù yìí; ẹyọ “ọ̀run” dúró fún plural Gíríìkì ní Yorùbá láìyí ìtumọ̀ rẹ̀ padà.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: ṣùgbọ́n a kò fi fún àwọn yẹn
  rationale: “Àwọn yẹn” pa ìyàtọ̀ tó wà láàárín ὑμῖν àti ἐκείνοις mọ́, nígbà tí “a kò fi fún” tún ìṣe aláìlórúkọ ti apá àkọ́kọ́ ṣe.
theological_decisions:
- issue: Ẹni tí ó fúnni kò jẹ́ dídárúkọ nínú δέδοται
  choice: Pa ìṣe aláìlórúkọ mọ́ pẹ̀lú “a ti fi fún yín” àti “a kò fi fún àwọn yẹn”
  alternative: “Ọlọ́run ti fi fún yín”
  rationale: Bí ó tilẹ̀ jẹ́ pé Ọlọ́run ni a lè lóye gẹ́gẹ́ bí olùfúnni, Gíríìkì kò dárúkọ rẹ̀. Ìtumọ̀ náà kò gbọ́dọ̀ sọ ohun tí orísun fi sílẹ̀ ní ìtumọ̀ àfojúsùn di mímúlẹ̀.
- issue: Ìtumọ̀ μυστήρια nínú ọ̀rọ̀ ìjọba
  choice: àwọn ohun ìjìnlẹ̀
  alternative: àwọn àṣírí
  rationale: Yíyan “àwọn ohun ìjìnlẹ̀” pa èrò àwọn òtítọ́ Ọlọ́run tí a ń ṣí payá mọ́, láìdín ọ̀rọ̀ náà kù sí àṣírí lásán tàbí fi ẹ̀kọ́ ẹgbẹ́ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìṣètò gbólóhùn náà pa ìyàtọ̀ “fún yín/àwọn yẹn” àti ìṣe aláìlórúkọ orísun mọ́.
