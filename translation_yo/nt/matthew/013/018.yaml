  text: Ὑμεῖς οὖν ἀκούσατε τὴν παραβολὴν τοῦ ⸀σπείραντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin, ẹ fetí sí àkàwé ẹni tí ó fún irúgbìn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fara hàn ní Gíríìkì fún ìtẹnumọ́, ó sì jẹ́ ọ̀pọ̀ ènìyàn; “ẹ̀yin” pa ìtẹnumọ́ àti iye ọ̀pọ̀ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so àṣẹ yìí mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì lè fi àbájáde tàbí ìyípadà ọ̀rọ̀ hàn; “Nítorí náà” bójú mu ní Yorùbá.
- source_word: ἀκούσατε
  choice: ẹ fetí sí
  rationale: Ó jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn. “Ẹ fetí sí” jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ gbígbọ́ pẹ̀lú àfiyèsí mọ́, láìgbé e dé “ẹ lóye,” èyí tí yóò túmọ̀ ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: παραβολὴν
  choice: àkàwé
  rationale: “Àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún irú ẹ̀kọ́ àfiwé tí παραβολή ń tọ́ka sí níhìn-ín.
- source_word: τοῦ σπείραντος
  choice: ẹni tí ó fún irúgbìn
  rationale: 'Àpapọ̀ ọ̀rọ̀ náà jẹ́ àfẹnusọ alábápín tí a sọ di orúkọ, ní ìṣe àtijọ́: “ẹni tí ó fún irúgbìn.” Yíyan èyí yẹra fún yíyí rẹ̀ padà sí oyè pàtó bí “afúnrúgbìn,” ó sì tẹ̀lé ìrísí Gíríìkì pẹkipẹki.'
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti kedere. A fi “ẹ̀yin” hàn gbangba láti pa ìtẹnumọ́ inú Gíríìkì mọ́, a sì lo àṣẹ ọ̀pọ̀ “ẹ fetí sí.” Gbólóhùn náà jẹ́ ti òde òní láìsọ ìtumọ̀ tí orísun kò sọ.
