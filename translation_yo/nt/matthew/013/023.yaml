  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé èrò àkọ́kọ́ Gíríìkì dáadáa—irúgbìn tó wà ní ilẹ̀ rere ń ṣàpẹẹrẹ ẹni tó gbọ́ ọ̀rọ̀, tó sì yé e, tó sì ń so èso ní ìwọ̀n ọ̀tọ̀ọ̀tọ̀. Ṣùgbọ́n “a fún sí” kì í ṣe ọ̀nà Yorùbá tó ṣe kedere tàbí tó wọ́pọ̀ fún σπαρείς nínú àwòrán irúgbìn; “a gbìn sí” dára jù. Àlàyé-ẹsẹ̀ [a] náà tún yí àṣàyàn ọ̀rọ̀ Gẹ̀ẹ́sì padà sí ìtumọ̀ àlàyé dípò àṣàyàn lexical tí ó bá γῆ mu.
  naturalness: “Ẹni tí a gbìn sí ilẹ̀ rere” jẹ́ Yorùbá àdánidá nínú àyíká àgbẹ̀. A tún ṣàtúnṣe ibi δή sí “ní tòótọ́,” kí ìtẹnumọ́ rẹ̀ kan ìso èso, kì í ṣe ìdánimọ̀ “Òun gan-an ni.”
  terminology: “Ilẹ̀ rere,” “ọ̀rọ̀ náà,” “gbọ́,” “yé e,” àti “so èso” bá ìforúkọsílẹ̀ Bíbélì Yorùbá àti ìlò òde òní mu. “Mú èso jáde” pa ποιεῖ mọ́ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe kejì láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
  issues:
