- from: Ṣùgbọ́n ẹni tí a fún sí orí ilẹ̀ rere[a] ni ẹni tí ó ń gbọ́ ọ̀rọ̀ náà, tí ó sì yé e. Òun gan-an ni ó ń so èso, ó sì ń mú èso jáde—ọ̀kan ní ọgọ́rùn-ún, òmíràn ní ọgọ́ta, àti òmíràn ní ọgbọ̀n.[b]
  to: Ṣùgbọ́n ẹni tí a gbìn sí ilẹ̀ rere[a] ni ẹni tí ó ń gbọ́ ọ̀rọ̀ náà, tí ó sì yé e; ẹni náà ní tòótọ́ ń so èso, ó sì ń mú èso jáde—ọ̀kan ní ọgọ́rùn-ún, òmíràn ní ọgọ́ta, àti òmíràn ní ọgbọ̀n.[b]
