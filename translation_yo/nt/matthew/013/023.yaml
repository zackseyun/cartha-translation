id: MAT.13.23
reference: Matthew 13:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí a gbìn sí ilẹ̀ rere[a] ni ẹni tí ó ń gbọ́ ọ̀rọ̀ náà, tí ó sì yé e; ẹni náà ní tòótọ́ ń so èso, ó sì ń mú èso jáde—ọ̀kan ní ọgọ́rùn-ún, òmíràn ní ọgọ́ta, àti òmíràn ní ọgbọ̀n.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lórí ilẹ̀ rere.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ọ̀kan ọgọ́rùn-ún, òmíràn ọgọ́ta, àti òmíràn ọgbọ̀n”; ìyẹn ni pé, iye èso tí ọ̀kọ̀ọ̀kan mú jáde yàtọ̀ síra. A tún lè sọ pé, “ìlọ́po ọgọ́rùn-ún … ọgọ́ta … ọgbọ̀n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: sí orí ilẹ̀ rere
  rationale: Nínú àyíká iṣẹ́ àgbẹ̀ yìí, “ilẹ̀ rere” túmọ̀ sí ilẹ̀ tí ó dára fún irúgbìn, kì í ṣe pé ilẹ̀ náà ní ìwà rere. “Sí orí” fi ipa ἐπί hàn ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: σπαρείς
  choice: ẹni tí a fún sí
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aláìṣe ní Gíríìkì. Ìtumọ̀ yìí pa àwòrán irúgbìn tí a fún mọ́, bó tilẹ̀ jẹ́ pé ẹni tí irúgbìn náà dúró fún ni ẹsẹ̀ náà ń ṣàlàyé.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ẹni tí ó ń gbọ́ ọ̀rọ̀ náà
  rationale: “Ń gbọ́” fi ìṣe tí ó jẹ́ àṣà ẹni náà hàn; “ọ̀rọ̀ náà” sì pa ọ̀nà ìsọ̀rọ̀ ìhìnrere inú àyọkà náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
- source_word: συνιείς
  choice: tí ó sì yé e
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún níní òye ohun tí a gbọ́. Arọ́pò-orúkọ “e” ń tọ́ka sí ọ̀rọ̀ náà.
- source_word: δὴ
  choice: gan-an
  rationale: “Gan-an” fi ìtẹnumọ́ patikulu δή hàn ní èdè Yorùbá tó ṣe déédé, láìsọ ọ́ di gbólóhùn líle tàbí àjèjì.
- source_word: καρποφορεῖ
  choice: ń so èso
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ fún ìso èso, ó sì pa àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ àpèjúwe náà mọ́.
- source_word: ποιεῖ
  choice: ń mú èso jáde
  rationale: A túmọ̀ ọ́ lọ́tọ̀ sí καρποφορεῖ kí àwọn ọ̀rọ̀-ìṣe méjèèjì inú Gíríìkì lè hàn, ṣùgbọ́n a sọ “èso” kún un fún ìtumọ̀ tó ṣe kedere ní Yorùbá.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ọ̀kan ní ọgọ́rùn-ún, òmíràn ní ọgọ́ta, àti òmíràn ní ọgbọ̀n
  rationale: Ọ̀nà yìí fi ìyàtọ̀ iye èso tí ọ̀kọ̀ọ̀kan mú jáde hàn. A kò fi “ìlọ́po” sínú àyọkà pàtàkì nítorí kò sí ní tààràtà nínú Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká náà ń tọ́ka sí iye èso.
theological_decisions:
- issue: Irú ìdáhùn tí ẹni ilẹ̀ rere ń ṣe sí ọ̀rọ̀ náà
  choice: A ṣàpèjúwe ẹni náà gẹ́gẹ́ bí ẹni tí ó gbọ́ ọ̀rọ̀ náà, tí ó yé e, tí ó sì so èso ní ìwọ̀n oríṣiríṣi.
  alternative: A lè túmọ̀ rẹ̀ ní ọ̀nà àlàyé tó fi ìforítì tàbí ìyípadà ọkàn tòótọ́ hàn ní kedere.
  rationale: Gíríìkì fúnra rẹ̀ tẹnumọ́ gbígbọ́, òye, àti síso èso; kò sọ àwọn ẹ̀ka ẹ̀kọ́ ìgbàgbọ́ tó wá lẹ́yìn bí ìforítì àwọn ẹni mímọ́ tàbí ẹ̀rí àtúnbí ní tààràtà. Ìtumọ̀ náà kò fi ìpinnu ẹ̀sìn ẹgbẹ́ kankan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàlà tó níyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A gbe àmì àlàyé [a] sí lẹ́yìn “ilẹ̀ rere,” ibi tí àlàyé yíyan ọ̀rọ̀ náà ti bá mu, dípò lẹ́yìn “yé e,” nítorí àkóónú àlàyé náà ń ṣàlàyé γῆ.
