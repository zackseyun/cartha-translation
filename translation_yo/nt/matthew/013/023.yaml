    issue: “a fún sí” fún σπαρείς
    rationale: Ní Yorùbá òde òní, “fún” sábà máa ń túmọ̀ sí ‘give’; nínú gbolohun yìí ó lè dà bí pé a fún ẹni kan sí ilẹ̀. “A gbìn sí” fi ìṣe gbíngbin irúgbìn hàn ní kedere.
  - severity: low
    issue: Àmì ìtẹnumọ́ δή nínú “Òun gan-an ni”
    rationale: “Gan-an” ní ibi yẹn lè tẹnu mọ́ ẹni náà (‘that very person’) dípò ìṣe καρποφορεῖ. “Ní tòótọ́” tẹnu mọ́ pé ẹni náà ló ń so èso, gẹ́gẹ́ bí δή.
  - severity: low
    issue: Àlàyé-ẹsẹ̀ [a] kò jẹ́ àṣàyàn lexical tó dọ́gba
    rationale: “Ilẹ̀ tó dára fún irúgbìn” ṣàlàyé ìtumọ̀ ‘rere’ ju bí ó ti jẹ́ àṣàyàn ìtumọ̀ ‘upon the good ground.’ Àlàyé yẹ kí ó fúnni ní “lórí ilẹ̀ rere.”
