id: MAT.13.47
reference: Matthew 13:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: yo
  text: Lẹ́ẹ̀kan sí i, ìjọba ọ̀run dàbí àwọ̀n ńlá kan[a] tí a sọ sínú òkun, tí ó sì ń kó láti inú gbogbo irú jọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọ̀n kan’; ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí àwọ̀n ńlá tí a ń fà gba inú omi.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, ‘tí ó ń kó láti inú gbogbo irú jọ.’ Gíríìkì kò dárúkọ ohun tí àwọ̀n náà kó; ẹja ni a lóye láti inú àwòrán pípa ẹja náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Bákan náà
  rationale: Ó fi òwe yìí kún àwọn òwe tó ṣáájú rẹ̀; ọ̀rọ̀ yìí ṣe kedere, ó sì bá Yorùbá ìsinsìnyí mu.
- source_word: ὁμοία ἐστὶν
  choice: dàbí
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi ìfiwéra hàn, ó sì pa àwòrán òwe náà mọ́.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Ó pa gbólóhùn pàtàkì ti Mátíù mọ́ láì yí i sí ‘ìjọba Ọlọ́run’ tàbí ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: σαγήνῃ
  choice: àwọ̀n ńlá kan
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọ̀n ńlá tí a ń fà gba inú omi; ‘àwọ̀n ńlá’ ṣe ìyàtọ̀ rẹ̀ sí àwọ̀n kékeré ní Yorùbá tó ṣe kedere.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: tí a sọ sínú òkun
  rationale: ‘Sọ sínú’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún jíju àwọ̀n, ‘òkun’ sì pa θάλασσα mọ́ dípò yíyí i sí adágún.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: tí ó sì kó ẹja oríṣiríṣi jọ
  rationale: ‘Kó ... jọ’ ṣàfihàn ìṣe συναγαγούσῃ lọ́nà àdánidá. A fi ‘ẹja’ kún un nítorí àwòrán pípa ẹja mú kó ṣe kedere, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà kò fara hàn ní Gíríìkì; àlàyé ìsàlẹ̀ sọ èyí.
theological_decisions:
- issue: Ìtumọ̀ ‘ìjọba ọ̀run’
  choice: Pa gbólóhùn Mátíù ‘ìjọba ọ̀run’ mọ́.
  alternative: ‘ìjọba Ọlọ́run’ tàbí ‘ìṣàkóso ọ̀run’
  rationale: Gbólóhùn orísun náà yẹ kí ó dúró láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó rọ́pò rẹ̀.
- issue: Ohun tí àwọ̀n náà kó jọ
  choice: Fi ‘ẹja’ hàn nínú ọ̀rọ̀ àkọ́kọ́, kí àlàyé ìsàlẹ̀ sì sọ pé ó wà nínú àwòrán náà dípò nínú ọ̀rọ̀ Gíríìkì ní tààrà.
  alternative: ‘tí ó sì kó láti inú gbogbo irú jọ’
  rationale: Gíríìkì fi ohun tí a kó jọ sílẹ̀ láì dárúkọ rẹ̀. Yorùbá àdánidá nílò ìtumọ̀ tó ṣe kedere níbí, ṣùgbọ́n àlàyé náà ń dáàbò bo àìsọ ohun náà ní gbangba nínú orísun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì jẹ́ ti èdè ìsinsìnyí. A lo ‘Bákan náà’ gẹ́gẹ́ bí àsopọ̀ pẹ̀lú àwọn òwe tó ṣáájú, ‘àwọ̀n ńlá’ sì yẹra fún ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ iṣẹ́ pípa ẹja tí ọ̀pọ̀ ènìyàn kò mọ̀.
