id: MAT.13.22
reference: Matthew 13:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: yo
  text: Ní ti ẹni tí a gbìn sí àárín ẹ̀gún, òun ni ẹni tí ó ń gbọ́ ọ̀rọ̀ náà; ṣùgbọ́n àníyàn ìgbà ayé yìí[a] àti ìtànjẹ ọrọ̀[b] ń fún ọ̀rọ̀ náà pa, ẹni náà sì di aláìso èso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àníyàn ayé yìí.” Gíríìkì náà ní, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ gan-an, “àníyàn ìgbà ayé yìí.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ẹ̀tàn ọrọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Ní ti ẹni tí a fún sí àárín àwọn ẹ̀gún
  rationale: Èyí pa àpèjúwe ẹni kan tí a fún mọ́ gẹ́gẹ́ bí Gíríìkì akọ ẹyọ, ó sì lo ‘sí àárín’ ní ọ̀nà àdánidá fún àwòrán irúgbìn láàárín ẹ̀gún.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ẹni tí ó ń gbọ́ ọ̀rọ̀ náà
  rationale: Ọ̀rọ̀-ìṣe aláìparí ἀκούων di gbólóhùn ìbátan àdánidá ní Yorùbá; ‘ọ̀rọ̀ náà’ tọ́ka sí iṣẹ́ tí a ń kéde nínú àkàwé náà.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: àníyàn ìgbà ayé yìí
  rationale: ‘Àníyàn’ mú agbára òdì μέριμνα jáde, ‘ìgbà ayé yìí’ sì pa ìtumọ̀ àkókò αἰών mọ́ láì sọ ọ́ di ayé ti ara lásán.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: bí ọrọ̀ ṣe ń tanni jẹ
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún agbára ẹ̀tàn tí ọrọ̀ ní; àmì ohùn tún ya ọrọ̀ (wealth) sọ́tọ̀ kúrò lọ́dọ̀ ọ̀rọ̀ (word).
- source_word: συμπνίγει τὸν λόγον
  choice: ń fún ọ̀rọ̀ náà pa
  rationale: ‘Fún … pa’ pa àwòrán ohun ọ̀gbìn tí ẹ̀gún fún pa mọ́, ó sì fi hàn pé àwọn nǹkan wọ̀nyí kò jẹ́ kí ọ̀rọ̀ náà dàgbà.
- source_word: ἄκαρπος γίνεται
  choice: ẹni náà sì di aláìléso
  rationale: Gbólóhùn náà tọ́ka sí olùgbọ́ gẹ́gẹ́ bí àlàyé àkàwé ṣe ń ṣe, kì í ṣe pé ọ̀rọ̀ fúnra rẹ̀ ni ó di aláìléso.
theological_decisions:
- issue: Ìtumọ̀ αἰών
  choice: ìgbà ayé yìí
  alternative: ayé yìí
  rationale: αἰών ní pàtàkì ń tọ́ka sí sáà tàbí ìgbà kan. ‘Ìgbà ayé yìí’ pa ìyàtọ̀ àkókò àti ìwà tó wà nínú ọ̀rọ̀ náà mọ́, nígbà tí ‘ayé yìí’ ṣì jẹ́ ìtumọ̀ tó ṣeé ṣe.
- issue: Ẹni tàbí ohun tí ó di aláìléso
  choice: ẹni náà sì di aláìléso
  alternative: ó sì di aláìléso / ọ̀rọ̀ náà sì di aláìléso
  rationale: Bí ó tilẹ̀ jẹ́ pé àwòrán náà bẹ̀rẹ̀ pẹ̀lú ohun tí a fún, Jésù dá ẹni tí ó gbọ́ ọ̀rọ̀ náà mọ̀ gẹ́gẹ́ bí ohun tí àlàyé náà ń tọ́ka sí. Yíyan ‘ẹni náà’ kò fi hàn pé ọ̀rọ̀ náà fúnra rẹ̀ ló kùnà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé lóye. A pa àwòrán iṣẹ́ àgbẹ̀ àti ìyípadà láti inú irúgbìn sí ẹni tó gbọ́ ọ̀rọ̀ mọ́; a tún ṣọ́ ìyàtọ̀ àmì ohùn láàárín ‘ọ̀rọ̀’ (message/word) àti ‘ọrọ̀’ (wealth).
