revisions:
- from: Ní ti ẹni tí a fún sí àárín àwọn ẹ̀gún, òun ni ẹni tí ó ń gbọ́ ọ̀rọ̀ náà; ṣùgbọ́n àníyàn ìgbà ayé yìí[a] àti bí ọrọ̀ ṣe ń tanni jẹ[b] ń fún ọ̀rọ̀ náà pa, ẹni náà sì di aláìléso.
  to: Ní ti ẹni tí a gbìn sí àárín ẹ̀gún, òun ni ẹni tí ó ń gbọ́ ọ̀rọ̀ náà; ṣùgbọ́n àníyàn ìgbà ayé yìí[a] àti ìtànjẹ ọrọ̀[b] ń fún ọ̀rọ̀ náà pa, ẹni náà sì di aláìso èso.
  rationale: The revision restores the essential sowing verb, keeps the original’s personal application of the parable, and uses natural Yoruba expressions while preserving the contrast between the proclaimed ọ̀rọ̀ and material ọrọ̀. The two audit-trail footnote anchors and their intended alternatives are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the hearer as the referent, preserves the contrastive force, renders μέριμνα as anxiety, retains αἰών as a temporal ‘age,’ and makes the final result personal. However, ‘a fún’ means ‘was given,’ not ‘was sown,’ and therefore fails to render σπαρείς.
  naturalness: Most of the register is clear Standard Yoruba, but ‘a fún sí àárín’ is not idiomatic for sowing. ‘a gbìn sí àárín’ correctly carries the agricultural image. ‘ìtànjẹ ọrọ̀’ is a more concise and natural nominal rendering of ‘the deceitfulness of wealth’ than the verbal circumlocution in the draft. ‘aláìso èso’ is transparent modern Yoruba for becoming unfruitful.
  terminology: ‘ọ̀rọ̀’ (word/message) and ‘ọrọ̀’ (wealth) are appropriately distinguished by tone marks. ‘Ìgbà ayé yìí’ suitably represents ‘this age’; the footnote retains the viable contextual alternative ‘ayé yìí.’
  issues:
  - severity: high
    issue: ‘a fún sí àárín àwọn ẹ̀gún’
    rationale: Fún means ‘give,’ whereas σπαρείς is ‘having been sown.’ This changes the parable image and must be corrected to gbìn.
  - severity: medium
    issue: ‘bí ọrọ̀ ṣe ń tanni jẹ’
    rationale: The phrase communicates a broadly similar idea but is less direct and less idiomatic than a noun phrase for ἡ ἀπάτη τοῦ πλούτου. ‘Ìtànjẹ ọrọ̀’ preserves the Greek construction and makes wealth’s deception explicit.
  - severity: low
    issue: ‘aláìléso’
    rationale: It is understandable, but ‘aláìso èso’ is clearer and more naturally preserves the agricultural ‘fruit’ imagery of ἄκαρπος.
  revised_text: Ní ti ẹni tí a gbìn sí àárín ẹ̀gún, òun ni ẹni tí ó ń gbọ́ ọ̀rọ̀ náà; ṣùgbọ́n àníyàn ìgbà ayé yìí[a] àti ìtànjẹ ọrọ̀[b] ń fún ọ̀rọ̀ náà pa, ẹni náà sì di aláìso èso.
  revised_footnotes:
  - marker: a
    text: Tàbí, “àníyàn ayé yìí.” Gíríìkì náà ní, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ gan-an, “àníyàn ìgbà ayé yìí.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ẹ̀tàn ọrọ̀.”
    reason: lexical_alternative
  revision_rationale: The revision restores the essential sowing verb, keeps the original’s personal application of the parable, and uses natural Yoruba expressions while preserving the contrast between the proclaimed ọ̀rọ̀ and material ọrọ̀. The two audit-trail footnote anchors and their intended alternatives are retained.
