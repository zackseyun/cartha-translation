  to: Nígbà tí ó dé ìlú ìbílẹ̀ rẹ̀, ó ń kọ́ wọn ní sínágọ́gù wọn, débi pé ẹnu yà wọ́n, wọ́n sì wí pé, “Níbo ni ọkùnrin yìí ti rí ọgbọ́n yìí àti àwọn iṣẹ́ agbára[a] wọ̀nyí?”
