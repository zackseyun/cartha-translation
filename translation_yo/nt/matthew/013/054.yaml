id: MAT.13.54
reference: Matthew 13:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: yo
  text: Nígbà tí ó dé ìlú ìbílẹ̀ rẹ̀, ó ń kọ́ wọn ní sínágọ́gù wọn, débi pé ẹnu yà wọ́n, wọ́n sì wí pé, “Níbo ni ọkùnrin yìí ti rí ọgbọ́n yìí àti àwọn iṣẹ́ agbára[a] wọ̀nyí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn iṣẹ́ alágbára”; ìyẹn ni, àwọn iṣẹ́ tí agbára fi ara hàn, tí a sábà máa ń pè ní iṣẹ́ ìyanu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: ìlú ìbílẹ̀ rẹ̀
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí ìlú tí a mọ Jésù sí gẹ́gẹ́ bí ọmọ ìbẹ̀, kì í ṣe orílẹ̀-èdè. ‘Ìlú ìbílẹ̀ rẹ̀’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún hometown tàbí native place.
- source_word: ἐδίδασκεν
  choice: ó ń kọ́ wọn
  rationale: Àmì imperfect nínú Gíríìkì fi hàn pé iṣẹ́ kíkọ́ni náà ń lọ lọ́wọ́ ní àkókò àtijọ́; ‘ó ń kọ́ wọn’ pa ìtumọ̀ yẹn mọ́.
- source_word: συναγωγῇ
  choice: sínágọ́gù
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ibi ìpéjọsìn àwọn Júù; ‘sínágọ́gù’ ni ọ̀rọ̀ tí ó ṣe kedere jù lọ ní Yorùbá òde òní.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: débi pé ẹnu yà wọ́n, wọ́n sì wí
  rationale: ὥστε ń sọ àbájáde; gbólóhùn Yorùbá yìí fi hàn pé ìyàlẹ́nu àti ọ̀rọ̀ wọn jẹ́ àbájáde ẹ̀kọ́ rẹ̀.
- source_word: Πόθεν
  choice: Níbo ni ... ti rí
  rationale: Πόθεν béèrè nípa orísun ohun kan. ‘Níbo ni ... ti rí’ jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè ibi tí ọgbọ́n àti iṣẹ́ agbára náà ti wá.
- source_word: τούτῳ
  choice: ọkùnrin yìí
  rationale: Ọ̀rọ̀ atọ́ka náà ní ìrísí jíjìnnà díẹ̀ nínú ọ̀rọ̀ àwọn ará ìlú; ‘ọkùnrin yìí’ mú ìrísí yẹn jáde lọ́nà àdánidá.
- source_word: σοφία
  choice: ọgbọ́n
  rationale: ‘Ọgbọ́n’ ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, ó sì bá ìjìnlẹ̀ òye àti agbára kíkọ́ni tí àwọn olùgbọ́ rí mu.
- source_word: δυνάμεις
  choice: àwọn iṣẹ́ agbára
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtàkì sí ‘àwọn agbára,’ ṣùgbọ́n ó lè tọ́ka sí àwọn iṣẹ́ tí agbára fi ara hàn. ‘Àwọn iṣẹ́ agbára’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́ láì fi ‘iṣẹ́ ìyanu’ ṣe ìtumọ̀ rẹ̀ pátápátá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δυνάμεις nípa àwọn iṣẹ́ àrà ọ̀tọ̀ Jésù
  choice: àwọn iṣẹ́ agbára
  alternative: àwọn iṣẹ́ ìyanu
  rationale: ‘Àwọn iṣẹ́ agbára’ pa ìtumọ̀ agbára inú ọ̀rọ̀ Gíríìkì mọ́, ó sì fi àyè sílẹ̀ fún bí ọ̀rọ̀ náà ṣe ń tọ́ka sí iṣẹ́ tí agbára hàn nínú rẹ̀. ‘Àwọn iṣẹ́ ìyanu’ ṣeé lò, ṣùgbọ́n ó túmọ̀ ọ̀rọ̀ náà ní pàtó ju orísun lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì lo ‘sínágọ́gù’ gẹ́gẹ́ bí ọ̀rọ̀ ìdásílẹ̀ tó ti wọ́pọ̀.
