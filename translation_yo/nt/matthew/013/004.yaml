  - severity: low
    issue: ‘sí ẹ̀gbẹ́ ọ̀nà’
    rationale: ‘Sí’ lè tẹnu mọ́ ìhùwàsí ìlọ sí ibi; Gíríìkì παρά τὴν ὁδόν ń sọ ibi tí irúgbìn náà ṣubú sí lẹ́gbẹ̀ẹ́ ọ̀nà. ‘Lẹ́gbẹ̀ẹ́ ọ̀nà’ dájú sí i.
