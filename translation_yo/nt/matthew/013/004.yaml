source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: yo
  text: Bí ó sì ti ń fúnrúgbìn, àwọn irúgbìn kan[a] ṣubú lẹ́gbẹ̀ẹ́ ọ̀nà, àwọn ẹyẹ sì wá jẹ wọ́n run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ní tààrà, ‘àwọn ohun kan ṣubú lẹ́gbẹ̀ẹ́ ọ̀nà’; a mú ‘irúgbìn’ wá láti inú àyíká ọ̀rọ̀ nípa afúnrúgbìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Bí ó ti ń fún irúgbìn ká
  rationale: Ẹ̀yà ọ̀rọ̀ yìí fi hàn pé ìṣubú náà ṣẹlẹ̀ ní àkókò tí ó ń fún irúgbìn ká; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àkókò mọ́.
- source_word: ἃ μὲν
  choice: àwọn irúgbìn kan
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí ‘àwọn ohun kan,’ ṣùgbọ́n ó ń tọ́ka sí irúgbìn nínú àyíká ọ̀rọ̀ náà. Fífi ‘irúgbìn’ kún un mú kí Yorùbá ṣe kedere láìyí ìtumọ̀ padà.
- source_word: ἔπεσεν
  choice: ṣubú
  rationale: Ìṣe tó parí nínú ìtàn ni aorist yìí ń sọ; ‘ṣubú’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: παρὰ τὴν ὁδόν
  choice: sí ẹ̀gbẹ́ ọ̀nà
  rationale: παρά pẹ̀lú accusative níbí tọ́ka sí ibi lẹ́gbẹ̀ẹ́ ọ̀nà; ‘sí ẹ̀gbẹ́ ọ̀nà’ pa ìdarí ìṣubú àti ipò náà mọ́.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: àwọn ẹyẹ sì wá
  rationale: A ṣe participle náà bí ìṣe tó tẹ̀ lé e ní Yorùbá. πετεινά túmọ̀ sí àwọn ẹyẹ tàbí ohun abìyẹ́, ‘àwọn ẹyẹ’ sì bá àyíká yìí mu láìfi ‘ojú ọ̀run’ kún ohun tí kò sí nínú ẹsẹ náà.
- source_word: κατέφαγεν
  choice: jẹ wọ́n run
  rationale: Ọ̀rọ̀ Gíríìkì náà ní agbára ju ‘jẹ’ lásán lọ; ‘jẹ wọ́n run’ fi hàn pé àwọn ẹyẹ pa wọ́n jẹ tán.
- source_word: αὐτά
  choice: wọ́n
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí àwọn irúgbìn, ‘wọ́n’ sì jẹ́ arọ́pò-orúkọ Yorùbá tó yẹ fún wọn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘fún irúgbìn ká’ fún iṣẹ́ afúnrúgbìn, àti ‘jẹ wọ́n run’ láti pa agbára ọ̀rọ̀ Gíríìkì mọ́.
