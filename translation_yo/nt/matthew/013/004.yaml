  terminology: ‘Fúnrúgbìn,’ ‘irúgbìn,’ ‘ọ̀nà,’ àti ‘jẹ wọ́n run’ bá ìforúkọsílẹ̀ ìtàn ìjọsìn tó ní ìyì mu, wọ́n sì pa agbára κατέφαγεν mọ́ láìfi ìtumọ̀ míì kún un.
  issues:
