  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: ìṣe afúnrúgbìn tó ń ṣẹlẹ̀, díẹ̀ lára irúgbìn tí ó ṣubú ní ẹ̀gbẹ́ ọ̀nà, àti àwọn ẹyẹ tí wọ́n wá jẹ ẹ́ run. Àmì àlàyé náà tún tọ́ka dáadáa sí ọ̀rọ̀ ἃ μὲν, tí ó jẹ́ ‘àwọn ohun kan’ ní tààrà ṣùgbọ́n tí àyíká fi hàn pé irúgbìn ni.'
