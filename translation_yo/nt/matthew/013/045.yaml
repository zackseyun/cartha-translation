source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: yo
  text: Lẹ́ẹ̀kan sí i[a], ìjọba ọ̀run dà bí oníṣòwò kan tí ń wá àwọn péálì dáradára.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tí ó sún mọ́ ìṣètò ọ̀rọ̀ Gíríìkì: “Lẹ́ẹ̀kan sí i, ìjọba ọ̀run dà bí ẹni kan, oníṣòwò, tí ń wá àwọn péálì dáradára.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Bẹ́ẹ̀ sì ni
  rationale: Ó fi àfiwé míì kún ọ̀wọ́ àwọn òwe nípa ìjọba; gbolohun yìí jẹ́ èdè Yorùbá àdánidá fún ìtẹ̀síwájú ọ̀rọ̀ náà.
- source_word: ὁμοία ἐστὶν
  choice: dà bí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ láti sọ àfiwé.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Ó pa ọ̀rọ̀ pàtàkì tí Mátíù máa ń lò mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe déédéé.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: oníṣòwò kan
  rationale: ἐμπόρῳ ti sọ irú ẹni náà; fífi ‘ọkùnrin kan’ kún un kò pọndandan ní Yorùbá, ṣùgbọ́n ‘kan’ ń fi àìsọ pàtó inú Gíríìkì hàn.
- source_word: ζητοῦντι
  choice: tí ń wá
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ inú participle ìsinsìnyí hàn ní Yorùbá àdánidá.
- source_word: καλοὺς μαργαρίτας
  choice: àwọn péálì dáradára
  rationale: καλός níbí ń tọ́ka sí dídára tàbí ìtayọ̀ wọn, kì í ṣe ẹwà ojú nìkan; ‘dáradára’ pa ìtumọ̀ yẹn mọ́.
theological_decisions:
- issue: Ibi tí àfiwé ọ̀rọ̀ òwe náà kọ́kọ́ dojú kọ
  choice: A fi ìjọba náà wé oníṣòwò náà ní tààràtà.
  alternative: A fi ìjọba náà wé gbogbo ìṣẹ̀lẹ̀ oníṣòwò kan tó ń wá àwọn péálì dáradára.
  rationale: Ìṣètò Gíríìkì ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ mú oníṣòwò náà wá gẹ́gẹ́ bí ohun tí àfiwé náà kọ́kọ́ tọ́ka sí. A kò ṣàlàyé àpẹẹrẹ náà kọjá ohun tí ẹsẹ yìí sọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. ‘Péálì’ ni a lò gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún pearl.
