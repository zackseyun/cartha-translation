  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: yo
  text: Nígbà náà, lẹ́yìn tí ó ti fi ogunlọ́gọ̀ ènìyàn sílẹ̀, ó wọ inú ilé. Àwọn ọmọ-ẹ̀yìn rẹ̀ sì wá sọ́dọ̀ rẹ̀, wọ́n ní, “Ṣàlàyé òwe àpẹẹrẹ àwọn èpò inú oko náà fún wa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òwe àpẹẹrẹ àwọn èpò darnel inú oko náà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka ní pàtó sí darnel, irú èpò kan tó jọ àlìkámà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tó ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì bá Yorùbá àdánidá mu.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: lẹ́yìn tí ó fi àwọn èrò náà sílẹ̀
  rationale: Ó fi hàn pé Jésù kúrò lọ́dọ̀ ọ̀pọ̀ ènìyàn náà kí ó tó wọ ilé; ‘àwọn èrò’ ṣe àfihàn ọ̀pọ̀ ènìyàn tó péjọ.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: ó wọ inú ilé
  rationale: Ìtumọ̀ àdánidá ni fún ìṣípò láti òde wọ ilé, láìfi ‘wá’ tàbí ‘lọ’ tí ojú ìwòye wọn lè yàtọ̀ kún un.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì tọ̀ ọ́ wá
  rationale: ‘Tọ̀ ọ́ wá’ sọ ìsúnmọ́ wọn sí i ní Yorùbá tó ṣe kedere; ‘àwọn ọmọ-ẹ̀yìn rẹ̀’ jẹ́ ìtumọ̀ possessive tó bójú mu.
- source_word: Διασάφησον ἡμῖν
  choice: Ṣàlàyé ... fún wa
  rationale: Ọ̀rọ̀ àṣẹ náà béèrè pé kí ó mú ìtumọ̀ náà ṣe kedere fún wọn; ‘ṣàlàyé’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó wọ́pọ̀.
- source_word: τὴν παραβολὴν
  choice: òwe àpẹẹrẹ
  rationale: Ó pa irú ẹ̀kọ́ àfiwé náà mọ́, ó sì ṣe kedere sí òǹkàwé Yorùbá pé kì í ṣe òwe kúkúrú lasan.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: nípa àwọn èpò inú oko
  rationale: Ó mú ìbáṣepọ̀ genitive Gíríìkì jáde ní Yorùbá àdánidá. ζιζάνια jẹ́ èpò búburú kan, ó ṣeé ṣe kí ó jẹ́ darnel tó jọ àlìkámà.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
