revisions:
- from: Nígbà náà, lẹ́yìn tí ó fi àwọn èrò náà sílẹ̀, ó wọ inú ilé. Àwọn ọmọ-ẹ̀yìn rẹ̀ sì tọ̀ ọ́ wá, wọ́n ní, “Ṣàlàyé òwe àpẹẹrẹ nípa àwọn èpò inú oko fún wa.”[a]
  to: Nígbà náà, lẹ́yìn tí ó ti fi ogunlọ́gọ̀ ènìyàn sílẹ̀, ó wọ inú ilé. Àwọn ọmọ-ẹ̀yìn rẹ̀ sì wá sọ́dọ̀ rẹ̀, wọ́n ní, “Ṣàlàyé òwe àpẹẹrẹ àwọn èpò inú oko náà fún wa.”[a]
  rationale: A rọ́pò ọ̀rọ̀ tó lè ní ìtumọ̀ míì (‘àwọn èrò’) pẹ̀lú ọ̀rọ̀ tó ṣe kedere fún ogunlọ́gọ̀ ènìyàn, a sì ṣàtúnṣe ọ̀nà ìsúnmọ́ àwọn ọmọ-ẹ̀yìn sí i fún Yorùbá àdánidá. A tún fi ‘náà’ hàn fún àpilẹ̀kọ pàtó nínú ‘the field.’ Ìtumọ̀ ζιζάνια wà ní fífẹ̀ gẹ́gẹ́ bí ‘èpò,’ nígbà tí akọsilẹ̀ ìsàlẹ̀ ń pa ìfẹ̀sẹ̀mulẹ̀ darnel mọ́.
