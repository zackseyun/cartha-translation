  source_fidelity: The clause correctly identifies the sower of the good seed as the Son of Man. However, adding sílẹ̀ to fún irúgbìn makes the agricultural action unambiguously ‘sow,’ rather than potentially ‘give seed.’
  naturalness: Ó dáhùn pé is natural Yoruba speech introduction. Ẹni tí ó ń fún irúgbìn rere sílẹ̀ is clear, idiomatic in biblical Yoruba register, and preserves the Greek substantival participle without unnecessary expansion.
  terminology: Ọmọ Ènìyàn appropriately retains the established Gospel title and its Danielic resonance. The footnote is retained, with smoother wording for the title’s established Gospel and theological significance.
