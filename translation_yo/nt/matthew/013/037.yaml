id: MAT.13.37
reference: Matthew 13:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Ὁ σπείρων τὸ καλὸν σπέρμα ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: yo
  text: Ó dáhùn pé, “Ẹni tí ó ń fún irúgbìn rere sílẹ̀ ni Ọmọ Ènìyàn.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ẹni Ènìyàn.” Orúkọ oyè Gíríìkì náà, “Ọmọ Ènìyàn,” mú Dáníẹ́lì 7 wá sí ìrántí; a sì pa á mọ́ níbí nítorí pé ó ti fìdí múlẹ̀ nínú àwọn Ìhìn Rere àti nínú ìjẹ́pàtàkì ẹ̀kọ́ ìgbàgbọ́ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ó dáhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀nà àdánidá láti fi ìdáhùn hàn; ‘Ó dáhùn pé’ yẹra fún àtúnwí líle bí ‘ní dídáhùn, ó wí.’
- source_word: Ὁ σπείρων
  choice: Ẹni tí ó ń fún irúgbìn
  rationale: Ọ̀rọ̀ aláìlópìn tó ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ń dá ẹni náà mọ̀ nípa iṣẹ́ rẹ̀. ‘Ẹni tí ó ń fún irúgbìn’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ iṣẹ́ tí a ń ṣe mọ́.
- source_word: τὸ καλὸν σπέρμα
  choice: irúgbìn rere
  rationale: καλός níbí túmọ̀ sí ohun tó dára tàbí tó yẹ, kì í ṣe ẹwà lásán. ‘Irúgbìn’ lè dúró gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ bíi ti Gíríìkì.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè tí Jésù sábà máa ń fi tọ́ka sí ara rẹ̀ nínú àwọn Ìhìn Rere, ó sì ní ìró Dáníẹ́lì 7. Ìtumọ̀ yìí pa ọ̀nà ọ̀rọ̀ àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ orúkọ oyè Kristi, υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: Gbólóhùn náà jẹ́ orúkọ oyè tó ní ìbáṣepọ̀ pẹ̀lú àwòrán apokalíptì àti Mèsáyà nínú Dáníẹ́lì 7; ‘Ọmọ Ènìyàn’ pa ìbáṣepọ̀ Bíbélì àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ yẹn mọ́ láì sọ ọ́ di àlàyé onítumọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A fi àmì àlàyé [a] sí lẹ́yìn orúkọ oyè tí ó ń ṣàlàyé.
