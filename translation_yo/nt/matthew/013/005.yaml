  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: yo
  text: Àwọn irúgbìn mìíràn sì ṣubú sórí ilẹ̀ olókùúta[a], níbi tí ilẹ̀ kò ti pọ̀; wọ́n sì hù jáde lẹ́sẹ̀kẹsẹ̀, nítorí ilẹ̀ náà kò ní ìjìnlẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “sórí àwọn ibi olókùúta”; gbólóhùn náà ń tọ́ka sí ilẹ̀ tín-ín-rín tí àpáta wà ní abẹ́ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Àwọn irúgbìn mìíràn sì
  rationale: Ọ̀rọ̀ ajẹ́tífù ọ̀pọ̀ aláìlábùdá náà ń tọ́ka sí àwọn irúgbìn inú ẹsẹ tó ṣáájú; fífi “irúgbìn” kún un mú ìtumọ̀ náà ṣe kedere ní Yorùbá, “sì” sì pa ìyàtọ̀ δέ mọ́.
- source_word: ἔπεσεν
  choice: bọ́
  rationale: Èyí túmọ̀ sí pé wọ́n ṣubú tàbí bọ́ síbẹ̀; kò fi ìtumọ̀ “a fún” kún ọ̀rọ̀ Gíríìkì náà.
- source_word: ἐπὶ τὰ πετρώδη
  choice: sórí ilẹ̀ olókùúta
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi tí òkúta wà lábẹ́ ilẹ̀ tín-ín-rín, láìsọ pé òkúta nìkan ni gbogbo ibi náà.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: níbi tí wọn kò ti ní ilẹ̀ púpọ̀
  rationale: Ọ̀rọ̀ náà fi hàn pé ilẹ̀ tí irúgbìn lè dàgbà sínú rẹ̀ kò pọ̀; arọ́pò-orúkọ ọ̀pọ̀ bá “àwọn irúgbìn” mu ní Yorùbá.
- source_word: καὶ εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀ ni wọn sì
  rationale: “Lẹ́sẹ̀kẹsẹ̀” pa agbára ìtumọ̀ ìyára εὐθέως mọ́ ní èdè Yorùbá òde òní.
- source_word: ἐξανέτειλεν
  choice: hù jáde
  rationale: Nípa irúgbìn, “hù jáde” jẹ́ gbólóhùn àdánidá fún bí ewéko ṣe yọ láti inú ilẹ̀.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: nítorí ilẹ̀ náà kò jìn
  rationale: Ó pa ìdí tí ọ̀rọ̀ Gíríìkì sọ mọ́, ó sì ṣàlàyé ní kedere pé ìpele ilẹ̀ náà kò ní ìjìnlẹ̀ tó.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ọ̀rọ̀ “ilẹ̀ olókùúta” pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé ń pa àwòrán ilẹ̀ tín-ín-rín lórí àpáta mọ́.
