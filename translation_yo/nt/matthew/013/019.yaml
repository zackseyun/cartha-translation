id: MAT.13.19
reference: Matthew 13:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: yo
  text: Nígbà tí ẹnikẹ́ni bá gbọ́ ọ̀rọ̀ ìjọba náà, tí kò sì yé e, ẹni búburú náà[a] máa ń wá, ó sì ń já ohun tí a ti gbìn sínú ọkàn rẹ̀ gbà. Èyí ni ẹni tí a gbìn sí ẹ̀gbẹ́ ọ̀nà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni ibi náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí a gbìn lẹ́gbẹ̀ẹ́ ọ̀nà” tàbí “ní etí ọ̀nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: Nígbà tí ẹnikẹ́ni bá gbọ́
  rationale: Èyí sọ gbólóhùn participle oníṣe genitive náà di ọ̀rọ̀ àkókò/ìṣẹ̀lẹ̀ gbogbogbò ní Yorùbá, ó sì pa agbára distributive πᾶς mọ́ pẹ̀lú “ẹnikẹ́ni.”
- source_word: λόγον τῆς βασιλείας
  choice: ọ̀rọ̀ ìjọba náà
  rationale: “Ọ̀rọ̀” pa àwòrán ọ̀rọ̀ gẹ́gẹ́ bí irúgbìn mọ́; genitive náà lè túmọ̀ sí ọ̀rọ̀ tí ó jẹ́ ti ìjọba tàbí ọ̀rọ̀ nípa ìjọba, nítorí náà a kò ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: μὴ συνιέντος
  choice: tí kò sì yé e
  rationale: Ọ̀nà Yorùbá àdánidá ni fún àìlóye; “e” ń tọ́ka sí ọ̀rọ̀ ìjọba náà.
- source_word: ὁ πονηρὸς
  choice: ẹni ibi náà
  rationale: Article àti àyíká fi hàn pé aṣojú ti ara ẹni ni, ṣùgbọ́n a kò sọ orúkọ rẹ̀ níbi tí ẹsẹ̀ náà kò ti sọ ọ́.
- source_word: ἁρπάζει
  choice: já ... gbà
  rationale: Ọ̀rọ̀ yìí fi ìgbésẹ̀ òjijì, alágbára hàn, gẹ́gẹ́ bí ἁρπάζω.
- source_word: τὸ ἐσπαρμένον
  choice: ohun tí a ti fún
  rationale: Participial passive perfect neuter náà túmọ̀ sí ohun tí a ti fún; ó pa iṣẹ́ tí a ṣe sí ohun náà mọ́ láìfi ẹni tó fún un kún un.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: sínú ọkàn rẹ̀
  rationale: “Ọkàn” pa èdè anthropological Bíbélì mọ́; “rẹ̀” bá ẹni ẹyọ kan tó dúró fún gbogbo ènìyàn mu.
- source_word: οὗτός ἐστιν
  choice: Èyí ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìdánimọ̀ tí Jésù ń ṣe.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: ẹni tí a fún sí ẹ̀gbẹ́ ọ̀nà
  rationale: Ó pa àkànlò metonymy Gíríìkì mọ́, níbi tí a ti fi ẹni tó gbọ́ ọ̀rọ̀ náà wé ohun tí a fún lẹ́gbẹ̀ẹ́ ọ̀nà.
theological_decisions:
- issue: Ìdánimọ̀ ὁ πονηρὸς
  choice: aṣojú ibi ti ara ẹni (“ẹni ibi náà”)
  alternative: ibi gẹ́gẹ́ bí agbára tí kì í ṣe ẹni
  rationale: Article àti iṣẹ́ rẹ̀—ó wá, ó sì já ohun tí a fún gbà—tì í lẹ́yìn gẹ́gẹ́ bí ẹni kan; síbẹ̀, a kò pe orúkọ kan tí ẹsẹ̀ náà kò sọ.
- issue: Ọ̀rọ̀ akọ ẹyọ kan nínú αὐτοῦ
  choice: “ọkàn rẹ̀”
  alternative: “ọkàn wọn” tàbí fífi pronoun náà sílẹ̀
  rationale: “Ẹnikẹ́ni” jẹ́ ti gbogbo ènìyàn, ṣùgbọ́n “rẹ̀” pa ẹyọ kan inú Gíríìkì mọ́ láìjẹ́ kí Yorùbá di líle.
- issue: Metonymy ẹni àti irúgbìn
  choice: “ẹni tí a fún”
  alternative: “irúgbìn tí ó bọ́ sí ẹ̀gbẹ́ ọ̀nà”
  rationale: Orísun náà sọ ẹni tí a fún, bí ó tilẹ̀ jẹ́ pé nínú àwòrán náà irúgbìn ni a fún; a pa ìdàpọ̀ àwòrán yìí mọ́ dípò yíyanjú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. “A fún” ni a lò fún àwòrán fífún irúgbìn, “já ... gbà” sì mú ìwà òjijì àti agbára ọ̀rọ̀ Gíríìkì jáde.
