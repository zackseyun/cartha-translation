  to: Nígbà tí ẹnikẹ́ni bá gbọ́ ọ̀rọ̀ ìjọba náà, tí kò sì yé e, ẹni búburú náà[a] máa ń wá, ó sì ń já ohun tí a ti gbìn sínú ọkàn rẹ̀ gbà. Èyí ni ẹni tí a gbìn sí ẹ̀gbẹ́ ọ̀nà[b].
  rationale: A rọ́pò “fún” pẹ̀lú “gbìn” nítorí pé Gíríìkì náà ń sọ nípa ohun tí a gbin, kì í ṣe ohun tí a fún. A tún lo aspect àṣà “máa ń ... ń” fún àwọn lọwọlọwọ Gíríìkì, a sì yan “ẹni búburú náà” gẹ́gẹ́ bí ìtumọ̀ Yorùbá tó mọ́gbọ́n-dani fún ὁ πονηρός, pẹ̀lú àṣàyàn lexical nínú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
