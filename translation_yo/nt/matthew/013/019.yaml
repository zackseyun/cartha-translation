  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́ka sí gbogbo àwọn ẹ̀ka Gíríìkì pàtàkì, ó sì pa ìtumọ̀ ti ara-ẹni nínú ὁ πονηρός àti metonymy nínú ὁ ... σπαρείς mọ́. Ṣùgbọ́n “a ti fún” tumọ̀ sí ‘a ti give,’ kì í sì ṣe ‘a ti sow,’ nítorí náà ó yí τὸ ἐσπαρμένον àti σπαρείς padà ní pàtàkì.
  naturalness: Èdè náà dára ní ìwọ̀n púpọ̀, ṣùgbọ́n “a ti gbìn” ni ọ̀rọ̀ Yorùbá tó dájú fún fífún irúgbìn/síse irúgbìn. “Máa ń wá” àti “ń já ... gbà” mú ìṣe gbogbogbò ti àwọn lọwọlọwọ Gíríìkì jáde dáadáa.
  terminology: “Ọ̀rọ̀ ìjọba náà,” “ọkàn rẹ̀,” àti “ẹni búburú náà” jẹ́ ọ̀rọ̀ boṣewa, tó ṣe kedere, tí ó sì bá register ẹsẹ̀ náà mu. “Ẹni búburú náà” jẹ́ ìtumọ̀ àdánidá fún ẹni ibi náà láìsọ orúkọ kan tí orísun kò sọ.
  issues:
