    issue: A lò “fún” níbi méjèèjì fún ἐσπαρμένον àti σπαρείς.
    rationale: “Fún” túmọ̀ sí láti give; kò túmọ̀ sí láti sow. Ó gbọdọ̀ jẹ́ “gbìn” kí àwòrán irúgbìn àti ìtumọ̀ passive ti Gíríìkì má bàa sọnù.
  - severity: low
    issue: Àwọn ìṣe “a wá, a sì já” lè dà bí ìṣe ọjọ́ iwájú ju ìṣe àṣà/gbogbogbò lọ.
    rationale: Àwọn present Gíríìkì nínú àlàyé òwe yìí ń ṣàpèjúwe ohun tí ó máa ń ṣẹlẹ̀. “Máa ń” ń mú èyí hàn ní Yorùbá.
