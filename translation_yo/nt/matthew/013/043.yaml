id: MAT.13.43
reference: Matthew 13:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: yo
  text: Nígbà náà ni àwọn olódodo yóò tàn[a] bí oòrùn nínú ìjọba Baba wọn. Ẹni tí ó ní etí[b], kí ó gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò tàn yọ.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní, “Ẹni tí ó ní àwọn etí, kí ó gbọ́”—ìpè ẹyọ kan tí ó dúró fún gbogbo ẹni tó yẹ kí ó fiyè sí ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó fi àkókò ìṣẹ̀lẹ̀ tí yóò tẹ̀ lé àlàyé tó ṣáájú hàn; ẹ̀ka ‘ni’ jẹ́ kí ìtẹnumọ́ náà dùn bí Yorùbá àdánidá.
- source_word: οἱ δίκαιοι
  choice: àwọn olódodo
  rationale: Ó tọ́ka sí àwọn ẹni tí a kà sí olódodo, láì dín ìtumọ̀ náà kù sí ìwà rere nìkan tàbí fi ẹ̀kọ́ ẹ̀sìn kan kun un.
- source_word: ἐκλάμψουσιν
  choice: yóò tàn
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú àti àwòrán ìmọ́lẹ̀ mọ́; ‘tàn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, nígbà tí àfiwé oòrùn ń fi bí ìmọ́lẹ̀ náà ṣe lágbára hàn.
- source_word: ὡς ὁ ἥλιος
  choice: bí oòrùn
  rationale: ‘Bí’ mú àfiwé Gíríìkì wá sí Yorùbá lọ́nà àdánidá.
- source_word: ἐν τῇ βασιλείᾳ
  choice: nínú ìjọba
  rationale: Ó bá ìtumọ̀ ibi tàbí àgbègbè tí gbolohun náà ní mu, ó sì tún pa èrò ìṣàkóso ọba mọ́.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: Baba wọn
  rationale: Ó tẹ̀ lé Gíríìkì ní pẹkipẹki láì fi ‘ọ̀run’ kún ọ̀rọ̀ tí kò sí nínú ẹsẹ yìí.
- source_word: ὁ ἔχων ὦτα
  choice: Ẹni tí ó ní etí
  rationale: Ó jẹ́ ìpè sí ẹnì kọ̀ọ̀kan ní irú ọ̀nà aṣojú; Yorùbá kò nílò àmì akọ tàbí abo níbí.
- source_word: ἀκουέτω
  choice: kí ó gbọ́
  rationale: Ìkọ̀lé ‘kí ó’ mú àṣẹ ẹni kẹta nínú Gíríìkì jáde, ‘gbọ́’ sì lè túmọ̀ sí gbígbọ́ pẹ̀lú fífi ọkàn sí i.
theological_decisions:
- issue: Ìpè aṣojú sí ẹnì kọ̀ọ̀kan ní ìparí ẹsẹ
  choice: Ẹni tí ó ní etí, kí ó gbọ́
  alternative: Ẹnikẹ́ni tí ó bá ní etí, kí ó fetí sílẹ̀
  rationale: A pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n a kò fi akọ tàbí abo kún un nítorí pé arọ́pò-orúkọ Yorùbá ‘ó’ kò fi ìbálòpọ̀ hàn. ‘Gbọ́’ tún pa ìfọ̀rọ̀wérọ̀ láàárín gbígbọ́ àti ṣíṣe ìgbọràn mọ́.
- issue: Ìtumọ̀ βασιλεία ní àyíká yìí
  choice: ìjọba
  alternative: ìṣàkóso
  rationale: Àpólà ‘nínú ...’ ń tọ́ka sí ibi tàbí agbègbè ìjọba ní àyíká ọjọ́ ìkẹyìn; ‘ìjọba’ bá ìkọ̀lé náà mu láì kọ ìtumọ̀ ìṣàkóso sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀nà ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Baba’ gẹ́gẹ́ bí orúkọ ìbátan tí ó tọ́ka sí Ọlọ́run, a sì pa àwòrán oòrùn àti ìjọba mọ́.
