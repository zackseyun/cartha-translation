id: MAT.13.42
reference: Matthew 13:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: yo
  text: Wọ́n yóò sì jù wọ́n sínú ìléru iná. Níbẹ̀ ni ẹkún àti lílọ eyín yóò wà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ βαλοῦσιν αὐτούς
  choice: wọn yóò sì jù wọ́n
  rationale: “Jù” fi agbára ìṣe βάλλω hàn ní Yorùbá àdánidá, “wọ́n” sì pa ìtọ́kasí ọ̀pọ̀ αὐτούς mọ́ láìṣe àfikún ẹni tí ó ń tọ́ka sí.
- source_word: εἰς τὴν κάμινον τοῦ πυρός
  choice: sínú ìléru iná
  rationale: Ọ̀rọ̀ yìí pa àwòrán gidi ti iléru àti iná mọ́, ó sì tẹ̀ lé ìbáṣepọ̀ genitive Gíríìkì láìrọ́pò rẹ̀ pẹ̀lú ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ míràn.
- source_word: ἐκεῖ
  choice: Níbẹ̀
  rationale: “Níbẹ̀” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì tọ́ka padà sí ibi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ὁ κλαυθμός
  choice: ẹkún
  rationale: “Ẹkún” jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún kíkún ẹ̀dùn, láìfi ìtumọ̀ tó le ju ti orísun lọ kún un.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ìpayínkeke
  rationale: “Ìpayínkeke” jẹ́ gbólóhùn Yorùbá àdánidá fún fífi eyín kọlu ara wọn tàbí lilọ eyín, ó sì pa àwòrán ìpọ́njú inú gbólóhùn Mátíù mọ́.
theological_decisions:
- issue: Àwòrán ìdájọ́ nínú “ìléru iná”
  choice: Pa àwòrán gidi náà mọ́ gẹ́gẹ́ bí “ìléru iná.”
  alternative: Ṣàlàyé rẹ̀ tààrà gẹ́gẹ́ bí ọ̀run àpáàdì tàbí iná ọ̀run àpáàdì.
  rationale: Orísun ń lo àkàwé tó lágbára nípa ìdájọ́; ìtumọ̀ náà kò gbọ́dọ̀ rọ ọ́ tàbí fi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
- issue: Ìtumọ̀ “ẹkún àti ìpayínkeke”
  choice: Pa méjèèjì mọ́ gẹ́gẹ́ bí àpèjúwe ìpọ́njú àti ìdájọ́.
  alternative: Fi ìpayínkeke túmọ̀ sí ìbínú nìkan tàbí fi gbogbo gbólóhùn náà mọ sí ìbànújẹ́ nìkan.
  rationale: Gbólóhùn Gíríìkì lè ní ìmọ̀lára ìbànújẹ́, ìpọ́njú, tàbí ìbínú nínú; a kò dín àìdánilójú yìí kù sí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá àpéjọ tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Ìbẹ̀rẹ̀ pẹ̀lú “wọn yóò sì” pa ìtẹ̀síwájú καὶ mọ́ láti inú ẹsẹ tó ṣáájú.
