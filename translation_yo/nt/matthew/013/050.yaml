id: MAT.13.50
reference: Matthew 13:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: yo
  text: Wọ́n yóò sì ju wọ́n sínú ìléru iná[a]. Ní ibẹ̀ ni ẹkún àti ìpayínkékè eyín yóò gbé wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ lọ́nà àdánidá sí i pé, “ìléru tó ń jó.” Ọ̀rọ̀ Gíríìkì náà ní tààràtà ni “ìléru iná.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: wọn yóò sì sọ
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú tó túmọ̀ sí fífi agbára ju ohun kan sí ibì kan; “sọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ yìí mọ́ láìlo èdè àtijọ́.
- source_word: αὐτοὺς
  choice: wọ́n
  rationale: Arọ́pò-orúkọ olùgbà ọ̀rọ̀ yìí ń tọ́ka sí àwọn ẹni búburú tí ẹsẹ tó ṣáájú mẹ́nu kàn.
- source_word: κάμινον τοῦ πυρός
  choice: ìléru iná
  rationale: Èyí tẹ̀lé àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ní pẹkipẹki, ó sì pa àwòrán ìdájọ́ tó ṣe kedere mọ́.
- source_word: ἐκεῖ
  choice: Ní ibẹ̀
  rationale: Ó fi ibi tí ìṣẹ̀lẹ̀ náà yóò ti ṣẹlẹ̀ hàn ní kedere, bí ọ̀rọ̀ Gíríìkì náà ṣe ń ṣe.
- source_word: ἔσται
  choice: ni ... yóò wà
  rationale: Ìṣètò ọ̀rọ̀ Yorùbá yìí sọ wíwà ní ọjọ́ iwájú jáde lọ́nà àdánidá.
- source_word: ὁ κλαυθμὸς
  choice: ẹkún
  rationale: “Ẹkún” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún sísunkún nítorí ìbànújẹ́ tàbí ìrora, láìfi ìtumọ̀ míì kún un.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ìpayínkeke
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí a mọ̀ dáadáa fún fífi eyín pa keke nítorí ìrora, ìbínú, tàbí ìdààmú; ó pa àìdánilójú inú àwòrán náà mọ́.
theological_decisions:
- issue: Àwòrán ìdájọ́ ní ọ̀rọ̀ nípa òpin ayé
  choice: A pa “ìléru iná,” “ẹkún,” àti “ìpayínkeke” mọ́ gẹ́gẹ́ bí àwòrán tó ṣe kedere.
  alternative: Kí a túmọ̀ ọ̀rọ̀ náà sí àsọyé tó ṣàlàyé pé àwọn ènìyàn yóò sunkún, wọn yóò sì lọ eyín nítorí ìrora.
  rationale: Orísun náà kò ṣàlàyé gbogbo ohun tí àwòrán wọ̀nyí dúró fún. Ìtumọ̀ náà kò rọ ìdájọ́ náà, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ẹ̀sìn kan tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní ọ̀wọ̀ ni a lò. A fi àmì ohùn síbi tó yẹ, a sì yan “ìpayínkeke” nítorí pé ó jẹ́ gbólóhùn tó mọ́gbọ́n dání, tó sì pa agbára ọ̀rọ̀ Mátíù mọ́.
