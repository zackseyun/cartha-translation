id: MAT.13.52
reference: Matthew 13:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Nítorí náà, gbogbo akọ̀wé tí a ti kọ́ fún ìjọba ọ̀run[a] dàbí olùṣàkóso ilé[b] kan, ẹni tí ń mú ohun tuntun àti ohun àtijọ́ jáde láti inú ibi ìṣúra rẹ̀[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “tí a ti sọ di ọmọ-ẹ̀yìn ìjọba ọ̀run.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ẹni tí a kọ́ tàbí ẹni tí a sọ di ọmọ-ẹ̀yìn.
    reason: alternative_reading
  - marker: b
    text: Tàbí “baálé ilé” tàbí “ẹni tó ń darí agbo ilé.”
    reason: lexical_alternative
  - marker: c
    text: “Ibi ìṣúra” lè tọ́ka sí ìṣúra fúnra rẹ̀ tàbí yàrá ìkójọ tí a ti ń mú àwọn ohun iyebíye jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi ìtumọ̀ ìparí tàbí àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ hàn ní Yorùbá àdánidá.
- source_word: πᾶς γραμματεὺς
  choice: gbogbo akọ̀wé
  rationale: “Akọ̀wé” ni ìtumọ̀ tààrà fún γραμματεύς, ó sì yẹra fún fífi ìtumọ̀ náà mọ́ olùkọ́ òfin nìkan.
- source_word: μαθητευθεὶς
  choice: tí a ti kọ́
  rationale: Ọ̀rọ̀ náà jẹ́ aláìṣe ní Gíríìkì, ó sì lè túmọ̀ sí ẹni tí a ti kọ́ tàbí sọ di ọmọ-ẹ̀yìn; àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: nípa ìjọba ọ̀run
  rationale: Dátífù náà kò rọrùn láti pinnu; “nípa” fi ìbáṣepọ̀ rẹ̀ pẹ̀lú ìjọba ọ̀run hàn láìfipá mú un túmọ̀ sí “fún” tàbí “nínú.”
- source_word: ὅμοιός ἐστιν
  choice: dàbí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún fífi ohun méjì wé ara wọn.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: olórí agbo ilé kan
  rationale: Ó ṣàfihàn ẹni tó ní àṣẹ lórí ilé àti àwọn ará ilé, kì í ṣe ẹni tó ní ilé gẹ́gẹ́ bí dúkìá nìkan.
- source_word: ἐκβάλλει
  choice: ń mú ... jáde
  rationale: Nínú àwòrán ibi ìṣúra yìí, ọ̀rọ̀ náà túmọ̀ sí mímú ohun jáde, kì í ṣe lílé e jáde.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: láti inú ibi ìṣúra rẹ̀
  rationale: “Ibi ìṣúra” pa ìmọ̀ ibi ìkójọ ohun iyebíye àti ohun ìṣúra fúnra rẹ̀ mọ́.
- source_word: καινὰ καὶ παλαιά
  choice: ohun tuntun àti ohun àtijọ́
  rationale: Ó pa bí Gíríìkì ṣe to tuntun ṣáájú àtijọ́ mọ́, ó sì sọ àwọn ajẹtífù aláìlorúkọ náà di ọ̀rọ̀ Yorùbá tó pé.
theological_decisions:
- issue: Ìtumọ̀ μαθητευθεὶς pẹ̀lú γραμματεύς àti ìjọba ọ̀run
  choice: Akọ̀wé tí a ti kọ́ nípa ìjọba ọ̀run
  alternative: Akọ̀wé tí a ti sọ di ọmọ-ẹ̀yìn ìjọba ọ̀run
  rationale: Àṣàyàn yìí pa èrò ìkọ́ni àti ìdásílẹ̀ ẹni mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn wà ní gbangba.
- issue: Ìtumọ̀ οἰκοδεσπότης
  choice: olórí agbo ilé
  alternative: baálé ilé tàbí ẹni tó ni ilé
  rationale: Ó pa ipa ẹni tó ń darí agbo ilé mọ́ láìsọ pé akọ nìkan ni tàbí pé ohun-ìní ilé ni kókó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Olórí agbo ilé” yẹra fún ìtumọ̀ ohun-ìní nìkan, “nípa ìjọba ọ̀run” sì pa àìdánilójú dátífù Gíríìkì mọ́.
