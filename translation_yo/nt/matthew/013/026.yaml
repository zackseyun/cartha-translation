base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ohun ọ̀gbìn náà hù, tí wọ́n sì so èso, nígbà náà ni àwọn èpò náà pẹ̀lú fara hàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, àwọn tares. Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí irú èpò kan pàtó tí ó jọ àlìkámà, bí darnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: ὅτε ṣe àgbékalẹ̀ gbólóhùn àkókò, δέ sì jẹ́ àsopọ̀ oníwọ̀nba tí ó fi ìyàtọ̀ díẹ̀ hàn sí ohun tí ó ṣáájú.
- source_word: ἐβλάστησεν
  choice: rú jáde
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé ohun ọ̀gbìn bẹ̀rẹ̀ sí í yọ tàbí rú; ‘rú jáde’ jẹ́ ọ̀rọ̀ àgbẹ̀ Yorùbá tí ó ṣe kedere ní àyíká yìí.
- source_word: ὁ χόρτος
  choice: ohun ọ̀gbìn náà
  rationale: Ní àkójọpọ̀ àpẹẹrẹ oko yìí, χόρτος ń tọ́ka sí irúgbìn tí ń dàgbà, kì í ṣe koríko lasán; yíyan yìí kò sì sọ irú rẹ̀ di pàtó ju orísun lọ.
- source_word: καρπὸν ἐποίησεν
  choice: so èso
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá ti gbólóhùn Gíríìkì ‘ṣe èso’; ‘so èso’ lè tọ́ka sí ohun tí ohun ọ̀gbìn mú jáde láìfi ‘ọkà’ kún orísun lọ́nà tí kò pọndandan.
- source_word: τότε
  choice: nígbà náà ni
  rationale: Ó samisi ìgbà tí ohun tó tẹ̀ lé ṣẹlẹ̀, ‘ni’ sì mú ìtẹnumọ́ àkókò náà jáde ní Yorùbá.
- source_word: ἐφάνη
  choice: fara hàn
  rationale: Ó túmọ̀ sí pé ohun náà di èyí tí a lè rí tàbí mọ̀ sí; ‘fara hàn’ jẹ́ àfihàn Yorùbá tó bá a mu.
- source_word: καὶ τὰ ζιζάνια
  choice: àwọn èpò náà pẹ̀lú
  rationale: ζιζάνια jẹ́ ọ̀pọ̀ orúkọ fún èpò inú oko, καί sì ní agbára àfikún níbí, èyí tí ‘pẹ̀lú’ fi hàn.
theological_decisions:
- issue: Ìdánimọ̀ pàtó ti ζιζάνια
  choice: A túmọ̀ rẹ̀ ní gbogbogbò gẹ́gẹ́ bí ‘àwọn èpò’ nínú ọ̀rọ̀ pàtàkì.
  alternative: Irú èpò kan pàtó tí ó jọ àlìkámà, bí darnel.
  rationale: Ẹsẹ̀ náà kò fi ẹ̀rí tó pé múlẹ̀ láti sọ irú ewé búburú náà ní pàtó; ‘àwọn èpò’ jẹ́ kedere, ó sì pa àìdánilójú inú orísun mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti èyí tí gbogbo ènìyàn lè lóye; a lo àfihàn iṣẹ́ àgbẹ̀ tó jẹ́ àdánidá. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ní ‘àwọn èpò’.
