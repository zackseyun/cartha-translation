revisions:
- from: Ṣùgbọ́n nígbà tí ohun ọ̀gbìn náà rú jáde, tí ó sì so èso, nígbà náà ni àwọn èpò náà pẹ̀lú fara hàn.[a]
  to: Ṣùgbọ́n nígbà tí àwọn ohun ọ̀gbìn náà hù, tí wọ́n sì so èso, nígbà náà ni àwọn èpò náà pẹ̀lú fara hàn.[a]
  rationale: Àtúnṣe náà mú χόρτος hàn gẹ́gẹ́ bí ohun ọ̀gbìn inú oko ní ọ̀nà tí ó dára sí i ní Yorùbá, ó sì mú ìfarakanra ọ̀rọ̀-orúkọ àti ọ̀rọ̀-ìṣe (“àwọn ... wọ́n”) péye. Ó pa “so èso” mọ́, nítorí èyí fara mọ́ καρπὸν ἐποίησεν láìsọ irú èso náà di pàtó. Àlàyé ẹsẹ̀ náà sì pa àwọn àṣàyàn ìtumọ̀ mọ́ láìjẹ́ kó dà bí ẹni pé a ti dá irú ewé náà mọ̀ dájú.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:25Z'
