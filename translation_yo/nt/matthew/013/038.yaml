id: MAT.13.38
reference: Matthew 13:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: yo
  text: Pápá náà ni ayé; irúgbìn rere náà sì ni àwọn ọmọ ìjọba; àwọn èpò[a] náà sì ni àwọn ọmọ ẹni ibi náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní pàtó sí i, “èpò dánẹ́lì,” irú èpò kan tí ó jọ àlìkámà nígbà tí ó ṣì ń dàgbà.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ọmọ” níbí jẹ́ ọ̀rọ̀ ìbáṣepọ̀; ó ń tọ́ka sí àwọn tí wọ́n jẹ́ ti ìjọba tàbí ti ẹni ibi náà, gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe wà.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: pápá
  rationale: Ó pa àwòrán iṣẹ́ àgbẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere ní àyíká òwe yìí.
- source_word: κόσμος
  choice: ayé
  rationale: Nínú àlàyé yìí, ó tọ́ka sí ayé ní gbogbogbò gẹ́gẹ́ bí ibi tí fífúnrúgbìn ti ń ṣẹlẹ̀.
- source_word: καλὸν σπέρμα
  choice: irúgbìn rere
  rationale: Ó pa àwòrán ohun tí a fún sínú ilẹ̀ mọ́, ó sì fi ìyàtọ̀ rẹ̀ sí èpò hàn kedere.
- source_word: οὗτοί εἰσιν
  choice: ni àwọn
  rationale: Yorùbá kò nílò àfihàn akọ púpọ̀ ọ̀tọ̀ bí Gíríìkì; ìṣètò yìí fi hàn pé àwọn ènìyàn ni irúgbìn náà dúró fún.
- source_word: υἱοὶ τῆς βασιλείας
  choice: àwọn ọmọ ìjọba
  rationale: “Àwọn ọmọ” ni ọ̀nà àdánidá ní Yorùbá fún ìbáṣepọ̀ àti jíjẹ́ ti ẹgbẹ́ kan; kò dá abo kan ṣoṣo mọ́ ní lílo Yorùbá.
- source_word: ζιζάνια
  choice: èpò
  rationale: Ó jẹ́ ọ̀rọ̀ òde òní tí ó rọrùn láti lóye fún ewéko búburú láàárín irúgbìn, nígbà tí àlàyé ẹsẹ̀ ń tọ́ka sí irú èpò pàtó.
- source_word: τοῦ πονηροῦ
  choice: ẹni ibi
  rationale: Àpilẹ̀kọ àti akọ ẹyọ Gíríìkì ṣe àtìlẹ́yìn fún ẹni kan gẹ́gẹ́ bí olùtọ́ka; “ẹni ibi” pa ìtumọ̀ ẹni aláìṣòdodo náà mọ́ láìfi orúkọ míì kún un.
theological_decisions:
- issue: Bóyá τοῦ πονηροῦ túmọ̀ sí ibi láìjẹ́ ẹni tàbí ẹni ibi kan
  choice: ẹni ibi
  alternative: ibi
  rationale: Gírámà Gíríìkì nínú gbólóhùn “àwọn ọmọ ẹni ibi” tẹ̀ sí olùtọ́ka ẹni kan, ṣùgbọ́n a kò sọ pé Sátánì tàbí Èṣù ní tààrà nítorí ẹsẹ̀ náà kò lo orúkọ wọ̀nyẹn.
- issue: Bóyá υἱοὶ yẹ kí ó jẹ́ “àwọn ọmọkùnrin” tàbí ọ̀rọ̀ aṣojú ìbáṣepọ̀
  choice: àwọn ọmọ
  alternative: àwọn ọmọkùnrin
  rationale: Nínú ọ̀rọ̀ Yorùbá, “ọmọ” ni àfihàn ìbáṣepọ̀ tí ó ṣe déédé pẹ̀lú ìlò Semitic/Gíríìkì yìí, ó sì lè tọ́ka sí gbogbo àwọn tí ó jẹ́ ti ìjọba láìsọ ìtumọ̀ náà di ti akọ nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, àti ti òde òní. A lo “sì” láti pa ìtẹ̀síwájú àwọn δὲ mẹ́ta mọ́ láìjẹ́ kí gbólóhùn náà le.
