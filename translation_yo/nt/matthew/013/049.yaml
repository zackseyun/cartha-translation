  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: yo
  text: 'Bẹ́ẹ̀ ni yóò rí ní òpin sáà náà[a]: àwọn áńgẹ́lì yóò jáde, wọ́n yóò sì ya àwọn ènìyàn búburú sọ́tọ̀ kúrò láàárín àwọn olódodo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí sáà náà bá pé dé ẹ̀kúnrẹ́rẹ́.” Ọ̀rọ̀ Gíríìkì náà sọ nípa òpin sáà tàbí ìgbà kan, kì í sì í tọ́ka sí ilẹ̀ ayé fúnra rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà
  rationale: Ó fi bí àkàwé náà ṣe bá ìtumọ̀ rẹ̀ mu hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘bẹ́ẹ̀ ni yóò rí.’
- source_word: ἔσται
  choice: ni yóò rí
  rationale: Ó sọ ohun tí yóò ṣẹlẹ̀ lọ́jọ́ iwájú ní ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bójú mu.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: ní òpin sáà náà
  rationale: ‘Òpin’ mú èrò ìparí tàbí ìpé dé ẹ̀kúnrẹ́rẹ́ jáde; ‘sáà’ sì dúró fún αἰών gẹ́gẹ́ bí àkókò tàbí ètò ayé kan, kì í ṣe ayé àìrígbẹ̀yà tàbí ilẹ̀ ayé fúnra rẹ̀.
- source_word: ἐξελεύσονται
  choice: yóò jáde
  rationale: Ìtumọ̀ tààrà àti àdánidá ni fún ìṣe jáde lọ.
- source_word: οἱ ἄγγελοι
  choice: àwọn áńgẹ́lì
  rationale: Ní àyíká ọ̀rọ̀ ìdájọ́ ìkẹyìn yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn áńgẹ́lì ọ̀run, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: ἀφοριοῦσιν
  choice: ya … sọ́tọ̀
  rationale: Ó fi ìṣe yíyan ẹgbẹ́ kan kúrò nínú ẹgbẹ́ mìíràn hàn ní kedere.
- source_word: τοὺς πονηροὺς
  choice: àwọn ènìyàn búburú
  rationale: Ajẹtífù Gíríìkì náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn; fífi ‘ènìyàn’ sí i mú èyí ṣe kedere ní Yorùbá.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: kúrò láàárín àwọn olódodo
  rationale: 'Ó pa àwòrán ẹgbẹ́ méjèèjì tí wọ́n ti dàpọ̀ mọ́ra mọ́: a yọ àwọn búburú kúrò láàárín àwọn olódodo.'
theological_decisions:
- issue: Ìtumọ̀ αἰών nínú ọ̀rọ̀ nípa òpin
  choice: sáà
  alternative: ayé
  rationale: ‘Sáà’ ń tọ́ka sí ìgbà tàbí ètò àkókò kan, ó sì yẹra fún fífi ìtumọ̀ pé gbogbo àgbáyé ti ara yóò parun sínú ọ̀rọ̀ tí Gíríìkì kò sọ ní pàtó.
- issue: Ta ni οἱ ἄγγελοι ń tọ́ka sí?
  choice: àwọn áńgẹ́lì ọ̀run
  alternative: àwọn ońṣẹ́
  rationale: Àyíká àlàyé Jésù nípa ìdájọ́ ìkẹyìn fi hàn pé àwọn ẹ̀dá ọ̀run ni, kì í ṣe àwọn ońṣẹ́ ènìyàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé navọ̀n. ‘Sáà’ ni a lò láti pa ìyàtọ̀ αἰών mọ́ láì mú ‘ayé’ tí ó lè túmọ̀ sí world wọ inú rẹ̀.
