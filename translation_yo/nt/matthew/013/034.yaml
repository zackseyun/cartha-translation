  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: yo
  text: Jésù fi àkàwé sọ gbogbo nǹkan wọ̀nyí fún àwọn èrò; kò sì sọ ohunkóhun fún wọn láìlo àkàwé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í sọ ohunkóhun fún wọn láìlo àkàwé.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí ohun tí ó máa ń ṣe tàbí sí ohun tó ṣẹlẹ̀ nígbà náà.
    reason: Ìrísí imperfect ti ọ̀rọ̀-ìṣe Gíríìkì gba ìtumọ̀ ìṣe àṣà tàbí ìṣe àtijọ́ lasán láàyè.
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó pa agbára atọ́ka náà (‘wọ̀nyí’) àti ìtumọ̀ pé gbogbo wọn mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐλάλησεν
  choice: sọ
  rationale: Ọ̀rọ̀-ìṣe aorist yìí ṣe àkójọpọ̀ ohun tí Jésù sọ; ‘sọ’ bá ọ̀nà Yorùbá mu pẹ̀lú ohun tí a sọ àti àwọn tí a sọ fún.
- source_word: ἐν παραβολαῖς
  choice: fi àkàwé
  rationale: ἐν tọ́ka sí ọ̀nà tàbí ohun èlò tí a fi sọ̀rọ̀. ‘Fi àkàwé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tí ó sì pa ìtumọ̀ παραβολή mọ́ láìdín in kù sí òwe kúkúrú nìkan.
- source_word: τοῖς ὄχλοις
  choice: fún àwọn èrò
  rationale: ‘Àwọn èrò’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì pa nọ́ńbà púpọ̀ inú Gíríìkì mọ́.
- source_word: χωρὶς παραβολῆς
  choice: láìlo àkàwé
  rationale: Ó túmọ̀ χωρίς pẹ̀lú genitive gẹ́gẹ́ bí ‘láìsí/láìlo,’ ó sì pa παραβολῆς tó jẹ́ ẹyọ kan mọ́.
- source_word: οὐδὲν ἐλάλει
  choice: kì í sì í sọ ohunkóhun
  rationale: Ìṣètò ‘kì í … sọ’ fi ipa imperfect hàn gẹ́gẹ́ bí ohun tí ó máa ń ṣe ní àyíká ìtàn yìí, ní Yorùbá tó ṣe déédéé.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí àwọn èrò, a sì túmọ̀ rẹ̀ ní tààrà láìṣe àtúnwí tí kò pọndandan.
theological_decisions:
- issue: Agbára imperfect nínú ἐλάλει ní gbólóhùn kejì
  choice: 'A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìṣe àṣà ní àyíká yìí: ‘kì í … sọ.’'
  alternative: 'A lè túmọ̀ rẹ̀ gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ nígbà kan: ‘kò sọ ohunkóhun fún wọn láìlo àkàwé.’'
  rationale: Imperfect lè fi ìṣe tó ń bá a lọ tàbí ìṣe àṣà hàn. Àyíká náà tẹnu mọ́ ọ̀nà tí Jésù fi ń kọ́ àwọn èrò níbí, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ọ̀nà míì tó ṣeé ṣe hàn, láìsọ ọ́ di ẹ̀kọ́ ìjọ kan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. ‘Àkàwé’ ṣe kedere ju ‘òwe’ lọ fún παραβολή nínú àyíká yìí, ‘àwọn èrò’ sì jẹ́ ọ̀nà àdánidá láti sọ ọ̀pọ̀ ènìyàn tí ó péjọ.
