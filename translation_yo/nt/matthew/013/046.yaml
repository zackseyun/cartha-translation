review_pass:
  verdict: revise
  source_fidelity: The draft retains the explicit singular ‘kan,’ the pearl’s exceptional value, the sequential actions of finding, going away, selling all he had, and buying it. Its light connective ‘sì’ appropriately represents δέ.
  naturalness: ‘tí ó níye lórí gidigidi’ is not idiomatic Standard Yoruba for ‘of great value.’ ‘tí iye rẹ̀ pọ̀ gidigidi’ is clear, natural, and conveys the intended exceptional worth. Adding a comma after ‘ó lọ’ improves the action sequence.
  terminology: ‘Péálì’ is an acceptable modern Yoruba term for ‘pearl.’ The footnote’s ‘olówó iyebíye’ is awkward in this context; ‘iyebíye’ directly and naturally renders ‘precious.’
  issues:
  - severity: medium
    issue: Idiomatic rendering of πολύτιμον
    rationale: The phrase ‘tí ó níye lórí gidigidi’ is unnatural. Recasting it as ‘tí iye rẹ̀ pọ̀ gidigidi’ preserves ‘of great value’ in idiomatic Yoruba.
  - severity: low
    issue: Footnote alternative wording
    rationale: ‘Péálì olówó iyebíye kan’ is less natural and can suggest a pearl-owner rather than a precious pearl. ‘Péálì iyebíye kan’ is the straightforward lexical alternative.
