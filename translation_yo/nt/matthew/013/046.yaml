id: MAT.13.46
reference: Matthew 13:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: yo
  text: Nígbà tí ó sì rí péálì kan tí iye rẹ̀ pọ̀ gidigidi[a], ó lọ, ó ta gbogbo ohun tí ó ní, ó sì rà á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “péálì iyebíye kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: nígbà tí ó sì rí
  rationale: A ṣe àfihàn iṣẹ́ tí ó ṣáájú àwọn ọ̀rọ̀-ìṣe pàtàkì pẹ̀lú gbólóhùn àkókò; “sì” mú ìsopọ̀ δέ tí kò lágbára gẹ́gẹ́ bí àtakò hàn.
- source_word: ἕνα
  choice: kan
  rationale: “Kan” pa nọ́ńbà ẹyọ kan mọ́, ó sì tẹnumọ́ pé péálì pàtàkì kan ṣoṣo ni.
- source_word: πολύτιμον
  choice: tí ó níye lórí gidigidi
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá òde òní tó ṣe kedere fún ohun tí iye rẹ̀ ga lọ́pọ̀lọpọ̀, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: μαργαρίτην
  choice: péálì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún pearl, ó sì bójú mu ní àyíká ọ̀rọ̀ yìí.
- source_word: ἀπελθὼν
  choice: ó lọ
  rationale: A yí participle náà sí ọ̀rọ̀-ìṣe pípé fún ìṣàn Yorùbá adayeba, ní mímú tẹ̀lé-tẹ̀lé ìṣe náà mọ́.
- source_word: πέπρακεν
  choice: ta
  rationale: “Ta” fi ìṣe títà tí ó parí hàn ní ṣókí àti ní Yorùbá adayeba.
- source_word: πάντα ὅσα εἶχεν
  choice: gbogbo ohun tí ó ní
  rationale: Ó pa ìtumọ̀ gbogbo-gbòò πάντα àti gbólóhùn ìbátan ὅσα εἶχεν mọ́.
- source_word: ἠγόρασεν
  choice: rà
  rationale: “Rà” ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tó sì bá ìforúkọsílẹ̀ òde òní mu.
- source_word: αὐτόν
  choice: á
  rationale: Àrọ́pò-orúkọ nǹkan ni ó tọ́ka padà sí péálì; ìrísí Yorùbá yìí kò gbé akọ abo gírámà Gíríìkì wọlé.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó níyì, tí ó sì rọrùn fún òǹkàwé gbogbo; a lo àmì ohùn níbi tí ó bá jẹ́ adayeba. Àwọn ọ̀rọ̀-ìṣe tẹ̀lé ara wọn ní kedere, gẹ́gẹ́ bí ìṣètò ìṣe inú Gíríìkì.
