id: MAT.13.30
reference: Matthew 13:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: yo
  text: Ẹ jẹ́ kí àwọn méjèèjì máa dàgbà pọ̀ títí di ìgbà ìkórè. Ní àkókò ìkórè, èmi yóò sọ fún àwọn olùkórè pé, ‘Ẹ kọ́kọ́ kó àwọn èpò[a] náà jọ, kí ẹ sì dì wọ́n sí ìdì-ìdì láti fi iná sun wọ́n; ṣùgbọ́n ẹ kó àlìkámà náà sínú àká mi.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn èpò dánẹ́lì,” irú èpò kan tó jọ àlìkámà nígbà tó ń dàgbà; ní ìtumọ̀ ìbílẹ̀, “tares.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: Ẹ jẹ́ kí
  rationale: Ọ̀rọ̀ àṣẹ yìí ń fúnni láàyè pé kí ohun kan máa bá a lọ; ‘Ẹ jẹ́ kí’ jẹ́ ọ̀nà Yorùbá àdánidá fún àṣẹ irú bẹ́ẹ̀.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: àwọn méjèèjì máa dàgbà pọ̀
  rationale: Ó pa ìtumọ̀ συν- mọ́ gẹ́gẹ́ bí ‘pọ̀,’ ó sì fi hàn pé àwọn irúgbìn méjèèjì ni a ń tọ́ka sí.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: títí di ìgbà ìkórè
  rationale: Ó fi ìkórè hàn gẹ́gẹ́ bí ìṣẹ̀lẹ̀ kan pàtó tí a ń dúró de.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: Ní àkókò ìkórè
  rationale: καιρός tọ́ka sí àkókò tó yẹ tàbí tí a yàn; gbólóhùn yìí jẹ́ kedere, ó sì bá Yorùbá òde òní mu.
- source_word: θερισταῖς
  choice: àwọn olùkórè
  rationale: Ọ̀rọ̀ yìí sọ àwọn tí iṣẹ́ wọn ni láti kórè ní tààrà.
- source_word: Συλλέξατε πρῶτον
  choice: Ẹ kọ́kọ́ kó ... jọ
  rationale: ‘Ẹ kọ́kọ́’ pa ìtẹ̀lé iṣẹ́ mọ́, ‘kó ... jọ’ sì jẹ́ ìtumọ̀ àdánidá fún συλλέγω.
- source_word: τὰ ζιζάνια
  choice: àwọn èpò
  rationale: ζιζάνια jẹ́ èpò búburú kan, ó ṣeé ṣe kí ó jẹ́ dánẹ́lì. ‘Àwọn èpò’ rọrùn fún gbogbo ènìyàn, nígbà tí àlàyé ìdánimọ̀ pàtó wà ní àlàyé ìsàlẹ̀.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: dì wọ́n sí ìdì-ìdì
  rationale: Ó fi iṣẹ́ dídì wọn sí ọ̀pọ̀ ìdì hàn ní Yorùbá àdánidá.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: láti fi iná sun wọ́n
  rationale: Ó pa ète iṣẹ́ náà àti ìparun nípasẹ̀ iná mọ́ láìfi ìtumọ̀ ìdájọ́ kún àwòrán òwe náà.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: ṣùgbọ́n ẹ kó àlìkámà náà sínú àká mi
  rationale: ‘Àlìkámà’ dá σῖτος mọ̀ ní àyíká yìí, ‘àká’ sì jẹ́ ibi ìkójọ irúgbìn, tó bá àwòrán iṣẹ́ àgbẹ̀ mu.
theological_decisions:
- issue: Àwòrán òwe nípa ìyapa ìkẹyìn
  choice: Pa gbogbo àwòrán iṣẹ́ àgbẹ̀ mọ́ láìsọ ìtumọ̀ rẹ̀ nípa ìdájọ́ ní tààrà.
  alternative: Láti túmọ̀ gẹ́gẹ́ bí ‘láti pa wọ́n run’ tàbí láti mẹ́nu kan ìdájọ́ ìkẹyìn.
  rationale: Jésù ṣì ń sọ òwe ní ẹsẹ yìí, ìtumọ̀ òwe náà sì wá lẹ́yìn náà. Nítorí náà, ìtumọ̀ yìí kò gbọ́dọ̀ fi àlàyé tó tẹ̀ lé e sínú ọ̀rọ̀ òwe fúnra rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ ...’ bá àwọn fọ́ọ̀mù Gíríìkì mu. A gbé àmì àlàyé [a] lẹ́gbẹ̀ẹ́ ‘èpò,’ ọ̀rọ̀ tí àlàyé náà ń ṣàlàyé.
