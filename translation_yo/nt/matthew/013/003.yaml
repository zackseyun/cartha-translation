id: MAT.13.3
reference: Matthew 13:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλάλησεν αὐτοῖς πολλὰ ἐν παραβολαῖς λέγων· Ἰδοὺ ἐξῆλθεν ὁ σπείρων τοῦ σπείρειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: yo
  text: Ó sì sọ ọ̀pọ̀ nǹkan fún wọn ní àwọn àkàwé, ó ní, “Ẹ wò ó, afúnrúgbìn náà jáde lọ láti fúnrúgbìn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραβολαῖς
  choice: òwe
  rationale: “Òwe” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àpèjúwe ìkọ́ni tí ó fi ohun tí a mọ̀ ṣàlàyé òtítọ́; ọ̀pọ̀ nǹkan ni a sọ, ṣùgbọ́n irú ọ̀nà ìkọ́ni ni a ń tọ́ka sí.
- source_word: Ἰδοὺ
  choice: Wò ó!
  rationale: Ó pa agbára ìpe sí àkíyèsí mọ́ ní ọ̀nà tí ó ṣe kedere, tí ó sì bá Yorùbá òde òní mu.
- source_word: ὁ σπείρων
  choice: Afúnrúgbìn kan
  rationale: Ó ṣàfihàn ẹni tí iṣẹ́ rẹ̀ nínú ìtàn náà ni fífún irúgbìn, láìfi ìtumọ̀ àpẹẹrẹ kún un.
- source_word: τοῦ σπείρειν
  choice: láti fúnrúgbìn
  rationale: Ó mú ète jíjáde ẹni náà hàn ní ṣókí, gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Ìdánimọ̀ afúnrúgbìn
  choice: A kò sọ ẹni tí afúnrúgbìn dúró fún nínú ẹsẹ yìí.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí Jésù tàbí oníwàásù.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò tíì tú àpẹẹrẹ náà; fífi ìdánimọ̀ kún un yóò yanjú ohun tí àyíká ọ̀rọ̀ fi sílẹ̀ fún ìtúmọ̀ lẹ́yìn náà.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “Ó sì” láti pa ìbáṣepọ̀ καὶ mọ́; “sọ … fún wọn” jẹ́ àdánidá ju títẹ̀lé ìṣètò Gíríìkì lọ ní líle.
