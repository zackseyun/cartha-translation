- from: Ó sì fi òwe sọ ọ̀pọ̀ nǹkan fún wọn pé, “Wò ó! Afúnrúgbìn kan jáde lọ láti fúnrúgbìn.”
  to: Ó sì sọ ọ̀pọ̀ nǹkan fún wọn ní àwọn àkàwé, ó ní, “Ẹ wò ó, afúnrúgbìn náà jáde lọ láti fúnrúgbìn.”
  rationale: A tún ọ̀rọ̀ náà ṣe kí παραβολαῖς hàn gẹ́gẹ́ bí “àwọn àkàwé,” kí ìṣètò “sọ ọ̀pọ̀ nǹkan fún wọn” bá Gíríìkì καὶ ἐλάλησεν αὐτοῖς πολλὰ mu, a sì yọ “kan” kúrò nínú afúnrúgbìn láti má ṣe fi iye tí kò ṣe kedere kún un. Àmì ìpe Ἰδού ni “Ẹ wò ó” ń ṣàfihàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:53Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń mú ìtumọ̀ Gíríìkì gbòòrò wá, ṣùgbọ́n “fi òwe sọ” lè dá bí ẹni pé a ń sọ òwe léraléra, níbi tí παραβολαῖς ti tọ́ka sí ọ̀nà ìkọ́ni nípasẹ̀ àpẹẹrẹ/àkàwé. “Afúnrúgbìn kan” sì fi ‘kan’ kún un, bí ó tilẹ̀ jẹ́ pé ọ̀ríkì pàtó Gíríìkì náà lè ṣiṣẹ́ ní àkàwé láìní iye ‘ọ̀kan’ gẹ́gẹ́ bí ìdánilójú.
  naturalness: “Ó sì sọ ọ̀pọ̀ nǹkan fún wọn ní àwọn àkàwé” jẹ́ ìṣètò Yorùbá tó rọrùn, tó sì ṣàfihàn pé ọ̀pọ̀ ohun ni a sọ nípasẹ̀ irú ọ̀nà ìkọ́ni náà. “Ẹ wò ó” jẹ́ ìpè sí àkíyèsí tó dára, láìní ìdàrúdàpọ̀ ìtumọ̀.
  terminology: “Àkàwé” bá παραβολή mu dáadáa nínú àyíká ìtàn ìkọ́ni Jésù; ó yà sí “òwe,” èyí tí ó sábà ń túmọ̀ sí proverbi. “afúnrúgbìn” àti “fúnrúgbìn” jẹ́ ọ̀rọ̀ tó bójú mu.
  issues:
  - severity: medium
    issue: “òwe” fún παραβολαῖς
    rationale: Ní Yorùbá òde òní, “òwe” sábà ń tọ́ka sí proverb, nígbà tí παραβολή nínú ẹsẹ yìí jẹ́ àpẹẹrẹ ìkọ́ni/allegorical story. “Àkàwé” ń dá ìyàtọ̀ náà bójú mu síi.
  - severity: low
    issue: “Afúnrúgbìn kan”
    rationale: “kan” kì í ṣe dandan nínú Gíríìkì. Àpilẹ̀kọ ὁ lè jẹ́ ìtọ́kasí sí ẹni afúnrúgbìn nínú àkàwé, kì í ṣe ìmúdájú iye ẹni kan.
  revised_text: Ó sì sọ ọ̀pọ̀ nǹkan fún wọn ní àwọn àkàwé, ó ní, “Ẹ wò ó, afúnrúgbìn náà jáde lọ láti fúnrúgbìn.”
