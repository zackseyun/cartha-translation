id: MAT.13.48
reference: Matthew 13:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: yo
  text: Nígbà tí àwọ̀n náà kún, wọ́n fà á sókè sí etíkun, wọ́n jókòó, wọ́n sì kó àwọn ẹja rere sínú àwọn ohun èlò[a], ṣùgbọ́n wọ́n ju àwọn tí ó bàjẹ́[b] síta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ gbogbogbò fún àwọn ohun tí a fi ń kó nǹkan sí; kò fi dandan túmọ̀ sí apẹ̀rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘àwọn tí kò dára.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘tí ó jẹrà,’ ‘tí ó bàjẹ́,’ tàbí, ní ọ̀nà gbogbogbò, ‘tí kò wúlò.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: Nígbà tí àwọ̀n náà kún
  rationale: Ọ̀rọ̀ arọ́pò ἣν ń tọ́ka sí àwọ̀n inú ẹsẹ tó ṣáájú. Pípè é ní ‘àwọ̀n náà’ jẹ́ kedere, ó sì mú ìbẹ̀rẹ̀ gbólóhùn náà jẹ́ ti Yorùbá àdánidá; ‘kún’ sì ṣe àfihàn ἐπληρώθη ní ṣókí.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: wọ́n fà á sókè sí etíkun
  rationale: Ìtumọ̀ yìí pa ìṣe fífa àwọ̀n kúrò nínú omi dé etíkun mọ́ láì sọ pé etíkun yanrìn ni.
- source_word: καθίσαντες
  choice: wọ́n jókòó
  rationale: Ó sọ ìṣe tó tẹ̀ lé e ní ọ̀nà ìtàn Yorùbá tó ṣe déédéé.
- source_word: συνέλεξαν τὰ καλὰ
  choice: wọ́n sì kó àwọn ẹja rere
  rationale: ‘Ẹja’ kò fara hàn ní tààrà nínú Gíríìkì, ṣùgbọ́n àyíká àwọ̀n àti yíyan ohun inú rẹ̀ mú un ṣe kedere; fífi ọ̀rọ̀ náà hàn ń mú Yorùbá yé ni kíkún láì fi èrò tuntun kún un.
- source_word: εἰς ἄγγη
  choice: sínú àwọn ohun èlò
  rationale: ἄγγη jẹ́ ọ̀rọ̀ gbogbogbò fún ohun tí a fi ń kó nǹkan sí. ‘Àwọn ohun èlò’ kò dín ìtumọ̀ rẹ̀ kù sí apẹ̀rẹ̀ tàbí irú ohun kan pàtó.
- source_word: τὰ δὲ σαπρά
  choice: ṣùgbọ́n ... àwọn tí ó bàjẹ́
  rationale: σαπρά lè túmọ̀ sí ohun tó jẹrà, tó bàjẹ́, tàbí tí kò wúlò. ‘Àwọn tí ó bàjẹ́’ pa àwòrán ẹja tí kò dára mọ́, ó sì yẹra fún dídín ọ̀rọ̀ náà sí jíjẹrà nìkan.
- source_word: ἔξω ἔβαλον
  choice: wọ́n ju ... síta
  rationale: Ó ṣe àfihàn agbára ìṣe àti ìkọ̀sílẹ̀ inú gbólóhùn Gíríìkì ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ àwòrán yíyan ẹja inú òwe náà
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ pípa ẹja, láì fi àlàyé nípa ìdájọ́ ìkẹyìn sínú ọ̀rọ̀ rẹ̀.
  alternative: Lílo àwọn ọ̀rọ̀ ìtumọ̀ tó ti ń tọ́ka sí ìdájọ́ ìkẹyìn ṣáájú àlàyé tó wà nínú àwọn ẹsẹ tó tẹ̀ lé e.
  rationale: Ẹsẹ yìí fúnra rẹ̀ ń sọ àwòrán òwe náà; àlàyé rẹ̀ wà lẹ́yìn rẹ̀. Ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́, kò sì fi ẹ̀kọ́ ìtumọ̀ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ìtàn tó mọ́, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. A lo ‘àwọ̀n náà’ láti mú ohun tí ἣν ń tọ́ka sí ṣe kedere, a sì pa àwòrán pípa ẹja mọ́ láì mú àlàyé òwe inú àwọn ẹsẹ tó tẹ̀ lé e wọ inú ẹsẹ yìí.
