id: MAT.13.40
reference: Matthew 13:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: yo
  text: Nítorí náà, gẹ́gẹ́ bí a ṣe ń kó àwọn èpò búburú[a] jọ, tí a sì ń fi iná sun wọ́n, bẹ́ẹ̀ náà ni yóò rí ní ìparí sáà náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn èpò tí ń hù láìfẹ́, ó sì ṣeé ṣe kí ó jẹ́ irú èpò tí a ń pè ní darnel.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ní ìtumọ̀ àṣà, “ní ìparí ayé.” Ní tààrà, “ní ìparí sáà náà”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí sáà tàbí ìgbà, kì í ṣe dandan sí àgbáyé ti ara.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Nítorí náà, gẹ́gẹ́ bí
  rationale: “Nítorí náà” fi ìtumọ̀ ìtẹ̀síwájú tàbí àbájáde οὖν hàn, “gẹ́gẹ́ bí” sì dá ìfiwéra ὥσπερ dúró ní kedere.
- source_word: συλλέγεται
  choice: a ti ń kó ... jọ
  rationale: Ìtumọ̀ yìí bá ọ̀rọ̀ iṣẹ́ àgbẹ̀ mu, ó sì fi ìṣe tí a sábà ń ṣe nínú àpẹẹrẹ náà hàn láìsọ ẹni tó ń ṣe é.
- source_word: τὰ ζιζάνια
  choice: àwọn èpò búburú
  rationale: ζιζάνια túmọ̀ sí èpò tó léwu, ó ṣeé ṣe kí ó jẹ́ darnel. “Àwọn èpò búburú” ṣe kedere fún òǹkàwé Yorùbá lónìí láìfi irú ewé kan tí kò wọ́pọ̀ mọ́ wọn lé ọrọ̀ náà lórí.
- source_word: πυρὶ καίεται
  choice: a sì ń fi iná sun wọ́n
  rationale: “Fi iná sun” fi ipa irinṣẹ́ dative πυρί àti ìṣe καίω hàn ní Yorùbá àdánidá, láìmú ìtumọ̀ náà jù sí “parun pátápátá.”
- source_word: οὕτως ἔσται
  choice: bẹ́ẹ̀ náà ni yóò rí
  rationale: Ó pa ìfiwéra mọ́, ó sì fi ọjọ́ iwájú ἔσται hàn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: ní ìparí ayé yìí
  rationale: “Ìparí” mú ìtumọ̀ ìpé tàbí òpin συντέλεια jáde. Nínú Yorùbá àdánidá, “ayé yìí” lè tọ́ka sí sáà ìsinsìnyí, bí ó tilẹ̀ jẹ́ pé “ayé” tún lè yọrí sí òye ayé gẹ́gẹ́ bí àgbáyé; àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ Gíríìkì.
theological_decisions:
- issue: Gbólóhùn nípa òpin ọjọ́, τοῦ αἰῶνος
  choice: ní ìparí ayé yìí
  alternative: ní ìparí sáà yìí
  rationale: “Ayé yìí” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì lè tọ́ka sí ìgbà tàbí ètò ayé ìsinsìnyí. Àkọ́kọ́ Gíríìkì sọ nípa αἰών, ìyẹn sáà kan, kì í ṣe dandan pé àgbáyé ti ara; àlàyé ìsàlẹ̀ pa ìyàtọ̀ yìí mọ́ láìfi ètò ẹ̀kọ́ nípa òpin ayé kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A yan “èpò búburú” dípò ọ̀rọ̀ ewé onímọ̀ pàtó, a sì lo àlàyé ìsàlẹ̀ láti pa ìtumọ̀ àkókò αἰών mọ́.
