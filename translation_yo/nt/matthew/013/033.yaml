id: MAT.13.33
reference: Matthew 13:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: yo
  text: Ó sọ òwe mìíràn fún wọn pé, “Ìjọba ọ̀run dà bí ìwúkàrà[a] tí obìnrin kan mú, tí ó sì fi pamọ́ sínú[c] òṣùwọ̀n ìyẹ̀fun mẹ́ta[b], títí gbogbo rẹ̀ fi wú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìwúkàrà ni ohun tí a fi ń mú ìyẹ̀fun tí a pò wú.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “sáà mẹ́ta ìyẹ̀fun”; sáà jẹ́ òṣùwọ̀n ìgbàanì, òṣùwọ̀n mẹ́ta yìí sì jẹ́ iye ìyẹ̀fun púpọ̀.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “dà á pọ̀ mọ́” tàbí “lọ ọ́ sínú”; ní tààrà, Gíríìkì ní “fi pamọ́ sínú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Ó sọ òwe mìíràn fún wọn
  rationale: Ó ṣàfihàn pé Jésù fi òwe àfikún sọ̀rọ̀ sí wọn, ní Yorùbá àdánidá.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere tí ó sì bójú mu fún gbólóhùn Mátíù yìí; ọ̀pọ̀ nǹkan tí ọ̀rọ̀ Gíríìkì fi hàn nínú ‘àwọn ọ̀run’ jẹ́ ìlànà èdè Semitic.
- source_word: ζύμῃ
  choice: ìwúkàrà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a fi ń mú ìyẹ̀fun wú; ‘ìwúkàrà’ jẹ́ ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní lè lóye láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
- source_word: ἐνέκρυψεν εἰς
  choice: fi pamọ́ sínú
  rationale: Èyí pa agbára gidi ti ọ̀rọ̀ Gíríìkì mọ́, èyí tí ó túmọ̀ sí fífi ohun kan pamọ́ sínú ohun mìíràn, bó tilẹ̀ jẹ́ pé nínú iṣẹ́ yíyan àkàrà ó tún lè túmọ̀ sí dídà á pọ̀ mọ́ ìyẹ̀fun.
- source_word: ἀλεύρου σάτα τρία
  choice: òṣùwọ̀n ìyẹ̀fun mẹ́ta
  rationale: Ó sọ pé òṣùwọ̀n mẹ́ta ni, ní ọ̀nà tí ó ṣeé lóye; àlàyé ìsàlẹ̀ ojú ìwé dá orúkọ òṣùwọ̀n ìgbàanì àti bí iye náà ṣe pọ̀ sí.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: títí gbogbo rẹ̀ fi ní ìwúkàrà
  rationale: Ó pa ìṣe aláìdárúkọ inú Gíríìkì àti ὅλον (‘gbogbo rẹ̀’) mọ́, láìfi ‘odidi ìyẹ̀fun tí a ti pò’ kún ohun tí orísun kò sọ ní tààrà.
theological_decisions:
- issue: Bóyá ìwúkàrà ní ìtumọ̀ rere tàbí búburú nínú òwe náà
  choice: A lo ‘ìwúkàrà’ láìsọ pé àpẹẹrẹ náà dára tàbí pé ó burú.
  alternative: A lè túmọ̀ àwòrán náà gẹ́gẹ́ bí ohun rere nítorí bí ìjọba ṣe ń tàn ká, tàbí gẹ́gẹ́ bí ohun búburú nítorí àwọn ibi míì tí ìwúkàrà ti ní ìtumọ̀ òdì.
  rationale: Ẹsẹ yìí fúnra rẹ̀ tẹnu mọ́ bí ohun díẹ̀ tí a fi pamọ́ ṣe dé gbogbo ìyẹ̀fun; ìtumọ̀ kò gbọ́dọ̀ pinnu àríyànjiyàn ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò pinnu ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀nà ìsọ̀rọ̀ náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A pa àwòrán ‘fífi pamọ́ sínú’ mọ́, a sì ṣàlàyé ọ̀nà ìsọ̀rọ̀ tó rọrùn jù lọ ní àlàyé ìsàlẹ̀ ojú ìwé.
