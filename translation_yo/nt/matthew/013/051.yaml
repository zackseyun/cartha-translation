id: MAT.13.51
reference: Matthew 13:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: yo
  text: “Ṣé ẹ ti lóye gbogbo nǹkan wọ̀nyí?” Wọ́n wí fún un pé, “Bẹ́ẹ̀ ni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Ṣé ẹ ti lóye
  rationale: Ọ̀rọ̀-ìṣe aorist, ẹni kejì ọ̀pọ̀, ń béèrè bóyá òye náà ti ṣẹlẹ̀ títí dé àsìkò yìí. ‘Ṣé ẹ ti lóye’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: ταῦτα πάντα
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Ó pa àpapọ̀ arọ́pò-orúkọ atọ́ka àti ‘gbogbo’ mọ́, ó sì tọ́ka sí gbogbo ẹ̀kọ́ àti òwe tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: λέγουσιν αὐτῷ
  choice: Wọ́n wí fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo historical present, àkókò tí ó ti kọjá jẹ́ àdánidá nínú ìtàn Yorùbá; ‘fún un’ sì pa αὐτῷ mọ́.
- source_word: Ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ìdáhùn ìfọwọ́sí ṣókí ni; a kò fi oyè tàbí ọ̀rọ̀ ọ̀wọ̀ kún un nítorí kò sí nínú orísun.
theological_decisions:
- issue: Bóyá kí a fi oyè ọ̀wọ̀ kún ìdáhùn àwọn ọmọ-ẹ̀yìn
  choice: Pa ìdáhùn náà mọ́ sí ‘Bẹ́ẹ̀ ni.’
  alternative: ‘Bẹ́ẹ̀ ni, Olúwa.’
  rationale: Gíríìkì ní Ναί nìkan. Fífi ‘Olúwa’ kún un yóò mú ohun tí orísun kò sọ wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. ‘Ṣé’ jẹ́ ọ̀nà ìbéèrè àdánidá; ‘wí’ ń pa ìforúkọsílẹ̀ ọlọ́lá díẹ̀ mọ́ láì di èdè àtijọ́.
