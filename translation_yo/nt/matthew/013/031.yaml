id: MAT.13.31
reference: Matthew 13:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: yo
  text: Ó tún gbé òwe mìíràn kalẹ̀ fún wọn, ó ní, “Ìjọba ọ̀run dà bí irúgbìn músítádì kan, tí ọkùnrin kan mú, tí ó sì fún sínú oko rẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: fi ... lé wọn níwájú
  rationale: Ọ̀rọ̀ yìí pa àwòrán fífi ohun kan síwájú àwọn olùgbọ́ mọ́, ó sì túmọ̀ sí pé ó gbé òwe náà kalẹ̀ fún wọn.
- source_word: παραβολὴν
  choice: òwe
  rationale: Ní Yorùbá Bíbélì àti nínú ọ̀rọ̀ ìgbàlódé, “òwe” jẹ́ ọ̀rọ̀ tí a mọ̀ dáadáa fún irú ìtàn àfiwé tí Jésù fi ń kọ́ni.
- source_word: Ὁμοία ἐστὶν
  choice: dà bí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti bẹ̀rẹ̀ àfiwé, láì sọ pé gbogbo apá méjèèjì dọ́gba pátápátá.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ìjọba ọ̀run
  rationale: Ó pa gbólóhùn pàtàkì tí Mátíù sábà máa ń lò mọ́, ó sì lè ní ìtumọ̀ ìṣàkóso Ọlọ́run àti agbègbè tí ìṣàkóso náà dé.
- source_word: κόκκῳ σινάπεως
  choice: irúgbìn músítádì kan
  rationale: “Irúgbìn” fi hàn kedere pé ohun tí a fún ni; “músítádì” jẹ́ ìtumọ̀ orúkọ irú ewéko náà ní èdè Yorùbá òde òní.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: tí ọkùnrin kan mú
  rationale: Ó pa ẹni kan ṣoṣo tó jẹ́ akọ nínú ìtàn náà mọ́, ó sì sọ participle Gíríìkì náà ní ọ̀nà Yorùbá adayeba.
- source_word: ἔσπειρεν
  choice: fún
  rationale: “Fún irúgbìn” ni ọ̀rọ̀ iṣẹ́ àgbẹ̀ Yorùbá tó péye fún fífi irúgbìn kéékèèké sínú ilẹ̀; ó ṣe pàtó ju “gbìn” lọ ní àyíká yìí.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: sínú oko rẹ̀
  rationale: “Oko” bá àyíká iṣẹ́ àgbẹ̀ mu, “rẹ̀” sì pa ìní ẹni náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn Mátíù βασιλεία τῶν οὐρανῶν
  choice: Ìjọba ọ̀run
  alternative: Ìṣàkóso ọ̀run
  rationale: “Ìjọba ọ̀run” pa ọ̀rọ̀ ìbílẹ̀ Mátíù mọ́, kò sì fi ìtumọ̀ náà mọ́ ìṣe ìṣàkóso nìkan; ó jẹ́ kí ìtumọ̀ ìjọba àti ìṣàkóso Ọlọ́run dúró papọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àtẹ̀lé àwọn ìṣe Gíríìkì mọ́ ní ọ̀nà Yorùbá adayeba.
