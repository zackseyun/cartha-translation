id: MAT.13.21
reference: Matthew 13:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: yo
  text: Ṣùgbọ́n kò ní gbòǹgbò nínú ara rẹ̀; ìdúró rẹ̀ kì í pé. Nígbà tí ìpọ́njú tàbí inúnibíni bá dé nítorí ọ̀rọ̀ náà, lẹ́sẹ̀kẹsẹ̀ ni ó ṣubú kúrò[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kọsẹ̀” tàbí “ohun náà mú un kọsẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé a mú ẹnì kan kọsẹ̀ tàbí pé ó bínú nítorí ohun kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: gbòǹgbò
  rationale: Ó pa àwòrán ohun ọ̀gbìn inú òwe náà mọ́ ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: ἐν ἑαυτῷ
  choice: nínú ara rẹ
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò-orúkọ náà mọ́, ó sì tọ́ka sí ohun tí kò fìdí múlẹ̀ nínú ẹni náà.
- source_word: πρόσκαιρός
  choice: ó sì máa ń dúró fún ìgbà díẹ̀ péré
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ẹni tí ìdúró rẹ̀ kì í pé; ó yẹra fún gbolohun tí yóò dà bí ẹni pé ọjọ́ ayé rẹ̀ ló kúrú.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: Nígbà tí ìpọ́njú tàbí inúnibíni bá dé
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò tí ó ṣe kedere; “ìpọ́njú” mú èrò ìfúnni-lẹ́ṣẹ̀ tàbí ìnira inú θλῖψις wá, “inúnibíni” sì jẹ́ ọ̀rọ̀ Yorùbá tí ó péye fún διωγμός.
- source_word: διὰ τὸν λόγον
  choice: nítorí ọ̀rọ̀ náà
  rationale: Ó pa ìsopọ̀ λόγος mọ́ pẹ̀lú “ọ̀rọ̀” tí a gbìn nínú òwe náà, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi bí ìṣubú náà ṣe yára hàn ní Yorùbá òde òní.
- source_word: σκανδαλίζεται
  choice: ó ṣubú kúrò
  rationale: Nínú àyíká yìí, ó sọ àbájáde ìkọsẹ̀ ẹni tí kò fara da ìpọ́njú; àlàyé ìsàlẹ̀ ojú ìwé pa àwòrán “kọsẹ̀” àti àyè ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλίζεται nínú àyíká ọmọ-ẹ̀yìn àti òwe
  choice: ó ṣubú kúrò
  alternative: ó kọsẹ̀; ohun náà mú un kọsẹ̀; ó bínú nítorí rẹ̀
  rationale: “Ó ṣubú kúrò” fi ìkùnà láti dúró ṣinṣin hàn láì pinnu gbogbo ìbéèrè ẹ̀kọ́ ìsìn nípa ìpadà-kúrò-nínú-ìgbàgbọ́. Àlàyé [a] jẹ́ kí ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì náà ṣí sílẹ̀.
- issue: Ohun tí λόγος ń tọ́ka sí
  choice: ọ̀rọ̀ náà
  alternative: ìhìn náà
  rationale: “Ọ̀rọ̀ náà” pa àtúnṣe ọ̀rọ̀ inú òwe mọ́, nígbà tí àlàyé [b] mú kedere pé ìhìn tí a kéde ni a ń sọ, láì ṣe àfikún ohun tí kò sí nínú orísun.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn síbi tí ó bá yẹ, a sì pa àwòrán gbòǹgbò àti ọ̀rọ̀ tí a gbìn mọ́. Gbólóhùn méjì ni a lò fún ìṣàn ọ̀rọ̀ tí ó rọrùn, bí ó tilẹ̀ jẹ́ pé Gíríìkì so àwọn apá náà pọ̀.
