id: MAT.13.57
reference: Matthew 13:57
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: yo
  text: Inú wọn sì bí sí i.[a] Ṣùgbọ́n Jésù sọ fún wọn pé, “Wòlíì kì í ṣe aláìní ọlá, bí kò ṣe ní ìlú ìbílẹ̀ rẹ̀[b] àti ní àárín àwọn ará ilé rẹ̀.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kọ̀ ọ́ nítorí rẹ̀.” Ní tààràtà, “wọ́n kọsẹ̀ nínú rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ilẹ̀ ìbílẹ̀ rẹ̀” tàbí “ní ibi ìbílẹ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní ilé tirẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ilé tí a ń gbé tàbí àwọn ará ilé àti ìdílé ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: wọ́n kọsẹ̀ lára rẹ̀
  rationale: Ó pa àwòrán ìpilẹ̀ ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n nínú Yorùbá ó lè túmọ̀ sí pé ohun tí wọ́n rí nínú Jésù mú wọn kọ̀ ọ́ tàbí mú inú wọn bí sí i; àlàyé ìsàlẹ̀ fi ìtumọ̀ yìí hàn kedere.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ṣùgbọ́n Jésù sọ fún wọn
  rationale: Ṣùgbọ́n fi ìyípadà àti ìtakora kékeré tí δέ ní sí ìhùwàsí wọn hàn.
- source_word: προφήτης
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ṣe kedere fún ẹni tí Ọlọ́run rán láti sọ ọ̀rọ̀ rẹ̀.
- source_word: ἄτιμος
  choice: aláìní ọlá
  rationale: Ó pa èrò ọlá àti àìní ọlá mọ́, ó sì bá ìrísí òwe náà mu láì sọ ọ́ di pé wọ́n tàbùkù sí i nìkan.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi àyọkúrò hàn nínú gbólóhùn òwe yìí.
- source_word: πατρίδι
  choice: ìlú ìbílẹ̀ rẹ̀
  rationale: Nínú àyíká ìtàn náà, ó tọ́ka sí ibi tí ẹni ti jẹ́ ọmọ ìbílẹ̀, pàápàá Násárétì, kì í ṣe orílẹ̀-èdè ní gbogbogbòò.
- source_word: οἰκίᾳ αὐτοῦ
  choice: agbo ilé tirẹ̀
  rationale: Agbo ilé lè tọ́ka sí àwọn ènìyàn ilé àti ìdílé ẹni, kì í ṣe ilé gẹ́gẹ́ bí ilé tí a kọ́ nìkan; “tirẹ̀” mú αὐτοῦ hàn.
theological_decisions:
- issue: Ìwọ̀n òwe Jésù nípa kíkọ wòlíì sílẹ̀
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí òwe gbogbogbò nípa wòlíì tí kò ní ọlá ní àyíká ìbílẹ̀ àti agbo ilé rẹ̀.
  alternative: Kí a túmọ̀ ọ́ ní ọ̀nà tí yóò tẹnumọ́ àìgbàgbọ́ ìdílé Jésù ní pàtó.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ jẹ́ òwe tí Jésù lò sí ipò yìí; kò yẹ kí ìtumọ̀ fi ẹ̀kọ́ míràn kún un tàbí dín ìtumọ̀ rẹ̀ mọ́ ìdílé nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye. A lo àpẹẹrẹ òwe “kì í ṣe ... bí kò ṣe” láti pa ìrísí àti ìtakora ọ̀rọ̀ Gíríìkì mọ́. Àwọn àmì ohùn wà níbi tí ó bá yẹ.
