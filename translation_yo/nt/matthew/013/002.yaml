source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: yo
  text: Ọ̀pọ̀ ogunlọ́gọ̀ sì kóra jọ sọ́dọ̀ rẹ̀, tó bẹ́ẹ̀ tí ó fi wọ ọkọ̀ ojú omi kan[a], ó sì jókòó; gbogbo ogunlọ́gọ̀ náà sì dúró ní etí omi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ó gun ọkọ̀ ojú omi kan.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ní etí iyanrìn’ tàbí ‘lẹ́bàá òkun.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: kóra jọ
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ènìyàn péjọ; ó sì bá lílo àìṣe-aláṣe ti ọ̀rọ̀ Gíríìkì mu ní àyíká yìí.
- source_word: πρὸς αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: Ó fi ìlọsí ẹni kan hàn ní kedere, láì fi ìtumọ̀ ‘yí i ká’ kún ohun tí orísun kò sọ ní tààrà.
- source_word: ὄχλοι πολλοί
  choice: àwọn ogunlọ́gọ̀ ńlá
  rationale: Ó pa ìlò ọ̀pọ̀ ti ὄχλοι mọ́, ó sì sọ πολλοί ní ọ̀nà Yorùbá tí ó ṣe àdánidá gẹ́gẹ́ bí bí àwọn ogunlọ́gọ̀ náà ti tóbi.
- source_word: ὥστε
  choice: tó bẹ́ẹ̀ tí ó fi
  rationale: Gbólóhùn yìí fi àbájáde ohun tó ṣáájú hàn ní ọ̀nà Yorùbá àdánidá.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: wọ ọkọ̀ ojú omi kan
  rationale: Ó túmọ̀ ìwọlé sínú ọkọ̀ ojú omi ní kedere, ó sì yẹ fún ìtàn àtẹ̀lé ní Yorùbá òde òní.
- source_word: καθῆσθαι
  choice: jókòó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye fún fífi ara sí ipò ìjókòó.
- source_word: πᾶς ὁ ὄχλος
  choice: gbogbo ogunlọ́gọ̀ náà
  rationale: Ó pa bí Mátíù ṣe yí padà láti ọ̀pọ̀ ‘ogunlọ́gọ̀’ sí àkójọpọ̀ kan ṣoṣo mọ́.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: ní etíkun
  rationale: ‘Etíkun’ jẹ́ ọ̀rọ̀ àárín gbùngbùn tó lè túmọ̀ sí etí omi tàbí ibi iyanrìn lẹ́gbẹ̀ẹ́ omi, láì sọ ibi náà di pàtó ju orísun lọ.
- source_word: εἱστήκει
  choice: dúró
  rationale: Ó ṣàpèjúwe ipò tí ogunlọ́gọ̀ náà wà nígbà tí Jésù jókòó sínú ọkọ̀, ní ọ̀nà ìtàn Yorùbá tó ṣe àdánidá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó ti yẹ. Ìṣètò gbólóhùn náà pa ìbáṣepọ̀ ìdí-àbájáde ti ὥστε mọ́, ó sì pa ìyípadà láti àwọn ogunlọ́gọ̀ púpọ̀ sí gbogbo ogunlọ́gọ̀ gẹ́gẹ́ bí àkójọpọ̀ kan mọ́.
