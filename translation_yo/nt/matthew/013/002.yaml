- from: Àwọn ogunlọ́gọ̀ ńlá sì kóra jọ sọ́dọ̀ rẹ̀, tó bẹ́ẹ̀ tí ó fi wọ ọkọ̀ ojú omi kan, ó sì jókòó[a]; gbogbo ogunlọ́gọ̀ náà sì dúró ní etíkun[b].
  to: Ọ̀pọ̀ ogunlọ́gọ̀ sì kóra jọ sọ́dọ̀ rẹ̀, tó bẹ́ẹ̀ tí ó fi wọ ọkọ̀ ojú omi kan[a], ó sì jókòó; gbogbo ogunlọ́gọ̀ náà sì dúró ní etí omi[b].
