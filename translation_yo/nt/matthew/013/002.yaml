review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the gathering, Jesus' entering a boat and sitting, and the crowd's standing at the shore. However, àwọn ogunlọ́gọ̀ ńlá means “large multitudes,” whereas πολλοί primarily marks a plurality/number (“many crowds”).
  naturalness: The syntax is generally natural. Ọ̀pọ̀ ogunlọ́gọ̀ is a more direct and natural way to preserve the Greek plural-plus-many emphasis. Ní etí omi is a neutral, idiomatic rendering of the unspecified shore.
  terminology: Ọkọ̀ ojú omi, jókòó, and dúró are suitable. The boat alternative should be anchored to ọkọ̀ ojú omi, not to jókòó, and its wording should correspond only to the lexical alternative it documents.
  issues:
  - severity: medium
    issue: Àwọn ogunlọ́gọ̀ ńlá renders the crowds as large rather than many.
    rationale: πολλοί means “many”; while large crowds may be a reasonable English idiom, the Yoruba wording can preserve the source distinction more closely with Ọ̀pọ̀ ogunlọ́gọ̀.
  - severity: low
    issue: Footnote a is anchored after jókòó although it documents the alternative for entering/boarding the boat.
    rationale: Moving the anchor to ọkọ̀ ojú omi kan makes the note's scope clear and aligns it with εἰς πλοῖον ἐμβάντα.
  revised_text: Ọ̀pọ̀ ogunlọ́gọ̀ sì kóra jọ sọ́dọ̀ rẹ̀, tó bẹ́ẹ̀ tí ó fi wọ ọkọ̀ ojú omi kan[a], ó sì jókòó; gbogbo ogunlọ́gọ̀ náà sì dúró ní etí omi[b].
  revised_footnotes:
