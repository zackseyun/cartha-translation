    text: Tàbí, ‘ó gun ọkọ̀ ojú omi kan.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ní etí iyanrìn’ tàbí ‘lẹ́bàá òkun.’
    reason: lexical_alternative
  revision_rationale: The revision renders πολλοί as Ọ̀pọ̀ rather than implying physical size, retains the collective singular gbogbo ogunlọ́gọ̀ náà, uses a neutral expression for αἰγιαλός, and relocates footnote a to the boat-entering expression that it actually qualifies.
