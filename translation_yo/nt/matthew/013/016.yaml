  source_fidelity: 'Ìtumọ̀ náà pa ìyàtọ̀ δὲ, ìbùkún μακάριοι, àti ìfaramọ́ ìtumọ̀ gangan ti “rí” àti “gbọ́” mọ́. Síbẹ̀, “ń ríran” kì í ṣe yíyan tó dára jù lọ fún βλέπουσιν níhìn-ín: ọ̀rọ̀ Gíríìkì náà jẹ́ àsìkò ìsinsìnyí tí ó lè tọ́ka sí ìṣe tàbí ipò gbogbogbò, kì í sì béèrè fún ìtẹ̀síwájú tàbí àtúnlò nínú Yorùbá. “wọ́n rí” pa àìdájú/aspect náà mọ́ dáadáa, ó sì fara mọ́ ìfiwéra “wọ́n gbọ́.”'
