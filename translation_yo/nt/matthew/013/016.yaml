source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: yo
  text: Ṣùgbọ́n alábùkún ni ojú yín, nítorí wọ́n rí, àti etí yín, nítorí wọ́n gbọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àwọn ọmọ-ẹ̀yìn tí wọ́n rí, tí wọ́n sì gbọ́, àti àwọn tí ẹsẹ tó ṣáájú sọ pé wọn kò rí tàbí gbọ́ ní ti òye.
- source_word: μακάριοι
  choice: alábùkún
  rationale: Ó pa èrò pé ojú rere àti oore Ọlọ́run wà lórí wọn mọ́, dípò kí ó túmọ̀ sí ìmọ̀lára ayọ̀ lásán.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: ojú yín
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ọ̀rọ̀ ohun-ìní náà, ó sì pa àfiyèsí sí ojú àwọn ọmọ-ẹ̀yìn fúnra wọn mọ́.
- source_word: ὅτι βλέπουσιν
  choice: nítorí wọ́n ń ríran
  rationale: A ka ὅτι sí àsopọ̀ tó ń sọ ìdí; ìṣe àtẹ̀síwájú “ń ríran” bá ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí Gíríìkì mu ní Yorùbá àdánidá.
- source_word: τὰ ὦτα ὑμῶν
  choice: etí yín
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe déédéé, ó sì bá “ojú yín” rìn ní ìfiwéra.
- source_word: ὅτι ἀκούουσιν
  choice: nítorí wọ́n ń gbọ́
  rationale: Ó sọ ìdí tí etí wọn fi jẹ́ alábùkún, ó sì pa ìfiwéra pẹ̀lú rírí mọ́.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: ń ríran / ń gbọ́
  rationale: Àwọn ọ̀rọ̀ ìfòye ara gangan ni a lò, láìfi “lóye” tàbí “gbọ́kàn sí” kún un, kí ìtumọ̀ jíjinlẹ̀ inú àyíká ọ̀rọ̀ lè dúró láìjẹ́ pé a ti pinnu rẹ̀ sínú ìtumọ̀.
theological_decisions:
- issue: Bóyá kí a sọ rírí àti gbígbọ́ di ohun tẹ̀mí ní kedere
  choice: A pa ọ̀rọ̀ ìfòye ara “ń ríran” àti “ń gbọ́” mọ́.
  alternative: “ń fòye mọ̀” àti “ń lóye”
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ohun tó ju ìfòye ara lọ wà nínú rẹ̀, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ lo ọ̀rọ̀ rírí àti gbígbọ́. Yíyan wọn pa ìdààmú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́, ó sì jẹ́ kí àyíká ọ̀rọ̀ ṣàlàyé ohun tó jinlẹ̀ sí i.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ìṣètò “alábùkún ni ojú yín” jẹ́ ọ̀rọ̀ tó níyì, tó sì pa àkójọpọ̀ bíi ti ọ̀rọ̀ ìbùkún inú Gíríìkì mọ́. “Ń ríran” jẹ́ àdánidá ju “ń rí” lọ nígbà tí ojú fúnra rẹ̀ ni olùṣe.
