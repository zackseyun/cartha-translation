source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: yo
  text: Nígbà tí Jésù sì parí àwọn òwe wọ̀nyí[a], ó kúrò níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ti ọ̀rọ̀-sí-ọ̀rọ̀: “Ó sì ṣẹlẹ̀ pé nígbà tí Jésù parí àwọn òwe wọ̀nyí, ó kúrò níbẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Nígbà tí ... sì
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà ìyípadà nínú ìtàn, ó sì fi àkókò hàn. ‘Nígbà tí ... sì’ jẹ́ Yorùbá àdánidá tí ó pa ìsopọ̀ ìṣẹ̀lẹ̀ mọ́ láìfi ọ̀rọ̀ líle kún un.
- source_word: ἐτέλεσεν
  choice: parí
  rationale: ‘Parí’ túmọ̀ sí mímú ohun dé òpin, ó sì bá iṣẹ́ tí Jésù ṣẹ̀ṣẹ̀ ṣe ṣáájú ìlọkúrò rẹ̀ mu.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ọ̀nà àkọsílẹ̀ orúkọ Ἰησοῦς tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: τὰς παραβολὰς ταύτας
  choice: àwọn òwe wọ̀nyí
  rationale: ‘Àwọn òwe’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún παραβολαί, ‘wọ̀nyí’ sì tọ́ka sí àwọn tí ó wà níwájú lẹ́sẹ̀kẹsẹ̀.
- source_word: μετῆρεν
  choice: ó kúrò
  rationale: Ọ̀rọ̀ náà sọ pé ó fi ibi náà sílẹ̀, láìsọ ọ̀nà tàbí ibi tí ó lọ ní kíkún. ‘Ó kúrò’ jẹ́ àdánidá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: ἐκεῖθεν
  choice: níbẹ̀
  rationale: Pẹ̀lú ‘kúrò,’ ‘níbẹ̀’ ń fi ibi tí ó ti lọ hàn ní Yorùbá àdánidá.
