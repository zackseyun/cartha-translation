id: MAT.13.12
reference: Matthew 13:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá ní[a], a ó fún un sí i, yóò sì ní ní ọ̀pọ̀ yanturu; ṣùgbọ́n ẹnikẹ́ni tí kò bá ní, àní ohun tí ó ní ni a ó gbà kúrò lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A kò sọ ohun tí ẹni náà ‘ní’ ní pàtó nínú Gíríìkì.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ὅστις
  choice: ẹnikẹ́ni tí ó bá
  rationale: Ó jẹ́ arọ́pò-orúkọ aláìlódodo tí ń sọ ìlànà kan tí ó kan ẹnikẹ́ni. Ọ̀rọ̀ Yorùbá yìí jẹ́ ti àdánidá, ó sì pa ìtumọ̀ pínpín náà mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé ọ̀rọ̀ tí ó ṣáájú, gẹ́gẹ́ bí Gíríìkì.
- source_word: ἔχει
  choice: ní
  rationale: A fi ohun tí ẹni náà ní sílẹ̀ láìdárúkọ rẹ̀, bí orísun Gíríìkì ti ṣe, kí a má bàa dín ìtumọ̀ náà kù sí òye tàbí ìmọ̀ nípa ìjọba Ọlọ́run nìkan.
- source_word: δοθήσεται αὐτῷ
  choice: a ó fún un sí i
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá fún fífún ẹni náà ní púpọ̀ sí i. ‘Sí i’ mú ìtumọ̀ tí ọ̀rọ̀ tó tẹ̀ lé e ń tọ́ka sí hàn, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ‘púpọ̀ sí i’ ní tààràtà.
- source_word: περισσευθήσεται
  choice: yóò sì ní lọ́pọ̀ yanturu
  rationale: Ó sọ ipò ọ̀pọ̀ yanturu tí ọ̀rọ̀-ìṣe Gíríìkì περισσεύω ń tọ́ka sí ní Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó pa ìyàtọ̀ tó lágbára láàárín àwọn gbólóhùn méjèèjì mọ́.
- source_word: καὶ ὃ ἔχει
  choice: àní ohun tí ó ní
  rationale: '‘Àní’ mú agbára ìyàlẹ́nu καί hàn: kódà ohun tí a sọ pé ẹni náà ní pàápàá.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: a ó gbà kúrò lọ́wọ́ rẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a ó mú ohun náà kúrò nínú ohun-ìní ẹni náà.
theological_decisions:
- issue: Ohun tí ‘ní’ ń tọ́ka sí
  choice: A kò dárúkọ ohun náà nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Láti túmọ̀ ọ́ ní pàtó sí òye, ìtẹ́wọ́gbà ọ̀rọ̀, tàbí ìmọ̀ àwọn àṣírí ìjọba ọ̀run.
  rationale: Àyíká ẹsẹ náà ní í ṣe pẹ̀lú bí ènìyàn ṣe gba ẹ̀kọ́ Jésù àti àṣírí ìjọba ọ̀run, ṣùgbọ́n Gíríìkì kò sọ ohun tí ‘ní’ ń tọ́ka sí. Fífi í sílẹ̀ bẹ́ẹ̀ pa àìsọ pàtó àti fífẹ̀ ìtumọ̀ náà mọ́.
- issue: Arọ́pò-orúkọ akọ ẹyọ kan nínú Gíríìkì
  choice: A lò ‘ẹnikẹ́ni … un … rẹ̀,’ èyí tí kò ní àmì akọ tàbí abo ní Yorùbá.
  alternative: Kí a fi ọ̀rọ̀ kan kún un láti fi akọ hàn.
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú àwọn arọ́pò-orúkọ wọ̀nyí. Ìtumọ̀ náà ṣì pa ẹyọ kan àti agbára aṣojú-gbogbo-ènìyàn tí Gíríìkì ní mọ́ láìfi ìtumọ̀ tuntun kún un.
translation_notes:
  register: Yorùbá boṣewa ti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lásán. ‘Lọ́pọ̀ yanturu’ jẹ́ gbólóhùn Yorùbá àdánidá fún ọ̀pọ̀ tí ó rékọjá ìwọ̀n; ‘àní’ sì pa ìtẹnumọ́ àwíyé náà mọ́.
