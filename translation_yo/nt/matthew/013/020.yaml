id: MAT.13.20
reference: Matthew 13:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: yo
  text: Ní ti ẹni tí a gbìn ní ilẹ̀ olókùúta[a], òun ni ẹni tí ńgbọ́ ọ̀rọ̀ náà, tí ó sì gbà á lẹ́sẹ̀kẹsẹ̀ pẹ̀lú ayọ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì, “ẹni tí a gbìn sórí àwọn ibi olókùúta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Ní ti ẹni tí a fún sí àwọn ibi olókùúta
  rationale: “Ní ti” mú δέ gẹ́gẹ́ bí ìyípadà ọ̀rọ̀ pẹ̀lẹ́; gbólóhùn náà sì pa àwòrán ẹni tí a fún mọ́, bí Gíríìkì ṣe so irúgbìn àti ẹni tí ó gbọ́ ọ̀rọ̀ pọ̀.
- source_word: πετρώδη
  choice: àwọn ibi olókùúta
  rationale: Ó túmọ̀ sí ilẹ̀ tàbí ibi tí òkúta pọ̀ sí; yíyan ọ̀rọ̀ yìí pa ọ̀pọ̀-nọ́mbà àti àwòrán ilẹ̀ Gíríìkì mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: σπαρείς
  choice: tí a fún
  rationale: Ọ̀rọ̀-ìṣe àìṣe ni, ó sì pa àwòrán iṣẹ́ fífún irúgbìn mọ́ ní Yorùbá tó ṣe déédéé.
- source_word: οὗτός ἐστιν
  choice: òun ni
  rationale: Ìdánimọ̀ tààrà ni; kò tú àkàwé náà sí “dúró fún,” nítorí náà ó pa ìṣòro àfihàn inú Gíríìkì mọ́.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ẹni tí ó gbọ́ ọ̀rọ̀ náà
  rationale: A ṣe participle náà sí gbólóhùn aláṣepọ̀ tó bá Yorùbá mu; “ọ̀rọ̀ náà” pa àkòrí λόγος mọ́.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára ìdáhùn náà hàn ní Yorùbá adayeba.
- source_word: μετὰ χαρᾶς
  choice: pẹ̀lú ayọ̀
  rationale: Ó pa nọ́ńbà χαρά mọ́, dípò yíyí i sí ọ̀rọ̀-àpèjúwe ìṣe.
- source_word: λαμβάνων αὐτόν
  choice: tí ó sì gbà á
  rationale: “Gbà” lè túmọ̀ sí gbigba tàbí tẹ́wọ́ gba ní àyíká yìí; “á” tọ́ka padà sí ọ̀rọ̀ náà.
theological_decisions:
- issue: Ohun tí “ẹni tí a fún” ń tọ́ka sí nínú àlàyé àkàwé náà
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí “ẹni tí a fún sí àwọn ibi olókùúta,” kí gbólóhùn tó tẹ̀ lé e lè dá ẹni náà mọ̀ gẹ́gẹ́ bí olùgbọ́.
  alternative: “Irúgbìn tí a fún sí ilẹ̀ olókùúta dúró fún ẹni tí…”
  rationale: Gíríìkì fi irúgbìn tí a fún àti ẹni tí ó gbọ́ ọ̀rọ̀ jọ sínú gbólóhùn kúkúrú kan. Ìtumọ̀ yìí kò tú ìfarahàn àti ìṣòro ẹ̀kọ́ inú àkàwé náà sí àlàyé tí ó ṣe kedere ju orísun lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “fún sí” gẹ́gẹ́ bí ọ̀rọ̀ iṣẹ́ àgbẹ̀, a sì pa àkàwé Gíríìkì tí ó pe ẹni náà ní ohun tí a fún mọ́.
