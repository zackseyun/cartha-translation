  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí oòrùn yọ, ooru sun un; nítorí kò ní gbòǹgbò, ó sì gbẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì rọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Ṣùgbọ́n nígbà tí oòrùn yọ
  rationale: Ọ̀rọ̀ yìí jẹ́ genitive absolute tó ń fi àkókò hàn; “nígbà tí oòrùn yọ” jẹ́ Yorùbá àdánidá, “ṣùgbọ́n” sì mú ìyàtọ̀ kékeré tí δέ ní wá.
- source_word: ἐκαυματίσθη
  choice: ooru jó wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí bí ooru ṣe jó ewéko. Ìtumọ̀ yìí bá àwòrán ohun ọ̀gbìn mu, kò sì túmọ̀ sí pé iná gan-an jó wọn.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: nítorí wọn kò ní
  rationale: διά pẹ̀lú infinitive oní-àpilẹ̀kọ ń sọ ìdí; gbólóhùn “nítorí wọn kò ní” sọ ìdí náà ní Yorùbá tó ṣe kedere.
- source_word: ῥίζαν
  choice: gbòǹgbò
  rationale: Orúkọ náà wà ní ẹyọ nínú Gíríìkì, Yorùbá “gbòǹgbò” sì lè dúró gẹ́gẹ́ bí orúkọ àkójọpọ̀ ní àyíká yìí.
- source_word: ἐξηράνθη
  choice: wọ́n sì rọ
  rationale: Nínú àyíká ohun ọ̀gbìn, ξηραίνω lè túmọ̀ sí pé ohun ọ̀gbìn rọ tàbí gbẹ. “Rọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun ọ̀gbìn tó pàdánù agbára rẹ̀.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo arọ́pò-orúkọ ọ̀pọ̀ “wọn” nítorí “àwọn irúgbìn” tí àyíká ẹsẹ ṣáájú ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé àwọn fọ́ọ̀mù Gíríìkì nínú ẹsẹ yìí jẹ́ ẹyọ.
