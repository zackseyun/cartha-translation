  terminology: ‘Oòrùn,’ ‘ooru,’ àti ‘gbòǹgbò’ yẹ, wọ́n sì ní àmì ohùn tó yẹ. A pa ìtumọ̀ ìdí náà mọ́ pẹ̀lú ‘nítorí kò ní gbòǹgbò.’
