    rationale: Bí ó tilẹ̀ jẹ́ pé ó lè ṣeé gbọ́, ó lè túmọ̀ sí pé àsọtẹ́lẹ̀ náà ń ṣẹlẹ̀. Ọ̀rọ̀ náà nínú Gíríìkì sọ pé àsọtẹ́lẹ̀ náà ń rí ìmúṣẹ nínú wọn.
  - severity: low
    issue: Ìbẹ̀rẹ̀ “Àti pé, nínú wọn ni ...”
