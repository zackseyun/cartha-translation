  - severity: low
    issue: “a fa yọ nípasẹ̀ èdè Gíríìkì” nínú àkọsílẹ̀ ìsàlẹ̀
    rationale: Àpèjúwe náà kò rọrùn, ó sì lè dà bí ìtumọ̀ tí a yọ kúrò níbì kan. “Tí a fa kọjá sí èdè Gíríìkì” ṣe kedere pé a ń tọ́ka sí ìrísí Sẹ́mítíkì tí Gíríìkì gbé wọlé.
