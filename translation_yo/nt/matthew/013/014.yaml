id: MAT.13.14
reference: Matthew 13:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: yo
  text: 'Àsọtẹ́lẹ̀ Aísáyà sì ń ní ìmúṣẹ nínú wọn[a], èyí tí ó sọ pé: “Ẹ ó gbọ́ nítòótọ́, ṣùgbọ́n ẹ kì yóò lóye rárá; ẹ ó sì wò, ṣùgbọ́n ẹ kì yóò fi òye rí rárá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “Nípa gbígbọ́ ni ẹ ó gbọ́ ... àti pé nípa wíwo ni ẹ ó wò.” Èyí jẹ́ ọ̀nà ìtẹnumọ́ ti èdè Hébérù tí a fa kọjá sí èdè Gíríìkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: ń ṣẹ
  rationale: Ọ̀rọ̀-ìṣe aláìṣe ní àkókò ìsinsìnyí yìí fi hàn pé àsọtẹ́lẹ̀ náà ń ní ìmúṣẹ nínú àwọn ènìyàn wọ̀nyí. “Ń ṣẹ” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ ìsinsìnyí àti aláìṣe mọ́, láìfi kún un pé ìmúṣẹ náà ti parí pátápátá.
- source_word: αὐτοῖς
  choice: nínú wọn
  rationale: Dátífù náà túmọ̀ sí pé àsọtẹ́lẹ̀ náà ní ìmúṣẹ nínú ọ̀ràn àwọn ènìyàn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; “nínú wọn” sọ èyí ní Yorùbá tó ṣe kedere.
- source_word: προφητεία Ἠσαΐου
  choice: àsọtẹ́lẹ̀ Aísáyà
  rationale: Èyí tẹ̀ lé ìbáṣepọ̀ jenitífù Gíríìkì, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédéé.
- source_word: ἡ λέγουσα
  choice: èyí tí ó sọ pé
  rationale: Ó mú iṣẹ́ pàtísípù oníṣe-ìdámọ̀ tí ń ṣáájú ọ̀rọ̀ àyọlò jáde ní kedere.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Ẹ ó gbọ́ nítòótọ́
  rationale: Ìtumọ̀ yìí mú ìtẹnumọ́ inú àkójọpọ̀ ọ̀rọ̀ Sẹ́mítíkì náà jáde ní Yorùbá àdánidá; àkọsílẹ̀ ìsàlẹ̀ fi ìtumọ̀ tí ó sún mọ́ ìrísí Gíríìkì hàn.
- source_word: οὐ μὴ συνῆτε
  choice: ṣùgbọ́n ẹ kì yóò lóye rárá
  rationale: “Rárá” mú agbára ìkọ̀ emphatic οὐ μή jáde, “lóye” sì bá συνίημι mu.
- source_word: βλέποντες βλέψετε
  choice: ẹ ó sì wò
  rationale: “Wò” ń tọ́ka sí ìṣe wíwo gẹ́gẹ́ bí βλέπω; ìtẹnumọ́ àtúnṣe inú Gíríìkì ni àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé kí ọ̀rọ̀ àkọ́kọ́ lè dúró ní Yorùbá tó rọrùn.
- source_word: οὐ μὴ ἴδητε
  choice: ṣùgbọ́n ẹ kì yóò fi òye rí rárá
  rationale: “Fi òye rí” yà ìfòye-inú ὁράω níbí sí ọ̀tọ̀ kúrò nínú wíwo lásán tí βλέπω sọ, “rárá” sì pa agbára ìkọ̀ náà mọ́.
theological_decisions:
- issue: Irú ìmúṣẹ àsọtẹ́lẹ̀ náà
  choice: Àsọtẹ́lẹ̀ Aísáyà ń ṣẹ nínú àwọn ènìyàn náà.
  alternative: Àsọtẹ́lẹ̀ náà wulẹ̀ ní àpẹẹrẹ nínú wọn, tàbí ó parí ìmúṣẹ rẹ̀ pátápátá nínú wọn.
  rationale: “Ń ṣẹ” pa èdè ìmúṣẹ inú Gíríìkì mọ́ láìdáhùn ní ti ẹ̀kọ́ ìgbàgbọ́ sí bí líle ọkàn, àyànmọ́, tàbí ìmúṣẹ náà ṣe ń ṣiṣẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” fún púpọ̀ ẹni kejì gẹ́gẹ́ bí Gíríìkì ṣe ní i.
