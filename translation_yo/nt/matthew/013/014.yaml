revisions:
- from: 'Àti pé, nínú wọn ni àsọtẹ́lẹ̀ Aísáyà ń ṣẹ[a], èyí tí ó sọ pé: “Ẹ ó gbọ́ nítòótọ́, ṣùgbọ́n ẹ kì yóò lóye rárá; ẹ ó sì wò, ṣùgbọ́n ẹ kì yóò fi òye rí rárá.”'
  to: 'Àsọtẹ́lẹ̀ Aísáyà sì ń ní ìmúṣẹ nínú wọn[a], èyí tí ó sọ pé: “Ẹ ó gbọ́ nítòótọ́, ṣùgbọ́n ẹ kì yóò lóye rárá; ẹ ó sì wò, ṣùgbọ́n ẹ kì yóò fi òye rí rárá.”'
  rationale: Àtúnṣe náà mú ἀναπληροῦται hàn gẹ́gẹ́ bí ìmúṣẹ àsọtẹ́lẹ̀ tí ń lọ lọwọlọwọ, ó sì tún gbolohun ìṣáájú ṣe sí Yorùbá tó rọrùn. Àyọlò náà wà gẹ́gẹ́ bí a ṣe kọ ọ́, nítorí ó fi ìtẹnumọ́, ìkọ̀ tó lágbára, àti ìyàtọ̀ láàrin wíwo àti rírí pẹ̀lú òye hàn, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:38:08Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ gbólóhùn àyọlò náà pa ìtumọ̀ ìgbọ́, wíwo, àti àìlóye/àìmòye tó lágbára nínú οὐ μή mọ́ dáadáa. Síbẹ̀, “ń ṣẹ” kì í sọ ìlànà ìmúṣẹ àsọtẹ́lẹ̀ (ἀναπληροῦται) ní kedere tó; “ń ní ìmúṣẹ” sun mọ́ ọ̀rọ̀ ìpilẹ̀ síi.
  naturalness: “Àti pé, nínú wọn ni ...” dùn bí ìtẹ̀lé Gẹ̀ẹ́sì, kò sì rọrùn nínú Yorùbá òde òní. “Àsọtẹ́lẹ̀ Aísáyà sì ń ní ìmúṣẹ nínú wọn” jẹ́ gbolohun tó dáa, tó sì wúlò ní ìforúkọsílẹ̀ ìwé mímọ́.
  terminology: “Àsọtẹ́lẹ̀ Aísáyà,” “lóye,” àti “fi òye rí” jẹ́ àwọn ọ̀rọ̀ tó yẹ. A túnṣe ọ̀rọ̀ ìṣáájú sí “ń ní ìmúṣẹ” kí ìtumọ̀ ἀναπληροῦται má bàa dà bí pé àsọtẹ́lẹ̀ kan ń ṣẹlẹ̀ lásán.
  issues:
