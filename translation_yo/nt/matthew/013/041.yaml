  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: yo
  text: Ọmọ Ènìyàn yóò rán àwọn áńgẹ́lì rẹ̀ jáde, wọn yóò sì kó gbogbo ohun tí ń fa ìkọ̀sẹ̀[a] àti àwọn tí ń hu ìwà àìlófin[b] kúrò nínú ìjọba rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun ìkọ̀sẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tàbí ipa tí ń mú kí ènìyàn dẹ́ṣẹ̀ tàbí kí ó ṣubú kúrò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ń ṣe àìlófin.” Ọ̀nà tí a gbà sọ ọ́ tẹnumọ́ ìwà àìgbọ́ràn sí òfin tí ó ń bá a lọ, tí ó sì ti di ìwà ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: yóò rán ... jáde
  rationale: Ọ̀rọ̀ yìí fi iṣẹ́ ọjọ́ iwájú hàn, ó sì pa ìtumọ̀ rírán àwọn aṣojú lọ láti ṣe iṣẹ́ kan mọ́.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ orúkọ oyè náà tí ó ti fẹsẹ̀ múlẹ̀, tí ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú àwòrán inú Dáníẹ́lì mọ́.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: àwọn áńgẹ́lì rẹ̀
  rationale: Nínú àyíká ìdájọ́ yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn áńgẹ́lì ọ̀run, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: συλλέξουσιν
  choice: wọn yóò sì kó
  rationale: “Kó” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún kíkó àwọn nǹkan tàbí ènìyàn jọ, ó sì bá àwòrán ìkórè inú àkàwé náà mu.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: kúrò nínú ìjọba rẹ̀
  rationale: “Kúrò nínú” fi hàn pé a ń mú wọn jáde láti inú àgbègbè ìjọba Ọmọ Ènìyàn.
- source_word: πάντα τὰ σκάνδαλα
  choice: gbogbo ohun tí ń mú ènìyàn kọsẹ̀
  rationale: Ìtumọ̀ yìí jẹ́ kí ipa ohun tó ń fa ẹ̀ṣẹ̀ tàbí ìṣubú hàn, láì fi ọ̀rọ̀ náà mọ́ ohun kan ṣoṣo.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: àwọn tí ń hu ìwà àìlófin
  rationale: “Tí ń hu” fi ìṣe tí ó ń bá a lọ tàbí tí ó ti di àṣà hàn; “ìwà àìlófin” sì pa èrò àìgbọ́ràn sí òfin mọ́.
theological_decisions:
- issue: Ìtumọ̀ orúkọ oyè ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni tí ó jẹ́ ènìyàn
  rationale: “Ọmọ Ènìyàn” pa ìtumọ̀ oyè náà àti ìró Dáníẹ́lì 7 mọ́; àṣàyàn kejì lè sọ ìtumọ̀ rẹ̀ di gbólóhùn àlàyé lásán.
- issue: Ìwọ̀n ìtumọ̀ σκάνδαλα nínú àyíká ìdájọ́
  choice: gbogbo ohun tí ń mú ènìyàn kọsẹ̀
  alternative: gbogbo ohun ìkọ̀sẹ̀
  rationale: Àṣàyàn yìí lè gba ènìyàn, ipa tàbí ohun tó ń mú ẹlòmíràn dẹ́ṣẹ̀ sínú, láì dín ọ̀rọ̀ náà kù sí ohun tí ń mú inú bíni nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán ìkórè àti ìdájọ́ inú àyíká ẹsẹ̀ náà mọ́.
