id: MAT.13.39
reference: Matthew 13:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: yo
  text: Ọ̀tá tí ó gbìn wọ́n ni Bìlísì; ìkórè ni ìparí sáà yìí[a], àwọn olùkórè sì ni àwọn áńgẹ́lì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìparí pípé ti sáà yìí”; ní ìbílẹ̀, “òpin ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: ọ̀tá
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ ẹni tí ó dúró lòdì mọ́ ẹlòmíràn mọ́.
- source_word: ὁ σπείρας αὐτά
  choice: tí ó fún irúgbìn wọn
  rationale: Ó tọ́ka sí iṣẹ́ fífún irúgbìn tí ọ̀tá náà ṣe, ó sì jẹ́ kí àwòrán iṣẹ́ àgbẹ̀ inú òwe náà dúró ṣinṣin; “wọn” ń tọ́ka padà sí èpò.
- source_word: διάβολος
  choice: Èṣù
  rationale: Ní àyíká ọ̀rọ̀ yìí, διάβολος jẹ́ orúkọ ìdánimọ̀ ẹni búburú náà, Èṣù, kì í ṣe àpèjúwe “afọ̀rọ̀-èké-bani-lórúkọ” lásán.
- source_word: θερισμὸς
  choice: ìkórè
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún harvest, ó sì bá àwòrán iṣẹ́ àgbẹ̀ mu.
- source_word: συντέλεια αἰῶνός
  choice: òpin ayé yìí
  rationale: “Ayé yìí” níbí ń sọ nípa sáà tàbí ìgbà tí ó wà nísinsìnyí, kì í ṣe dandan pé gbogbo ohun àgbáyé yóò parun; “òpin” mú ìtumọ̀ ìparí àti ìmúṣẹ sáà náà jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: θερισταὶ
  choice: àwọn olùkórè
  rationale: Ó pa àwòrán àwọn tí ń kórè mọ́, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: ἄγγελοί
  choice: àwọn áńgẹ́lì
  rationale: Àyíká ọ̀rọ̀ ìdájọ́ ní òpin sáà fi hàn pé àwọn ẹ̀dá ọ̀run ni, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: δὲ
  choice: sì
  rationale: “Sì” ń fi ìlọsíwájú àti ìyàtọ̀ díẹ̀ láàárín àwọn gbólóhùn hàn lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ αἰών nínú συντέλεια αἰῶνός
  choice: òpin ayé yìí
  alternative: ìparí pípé sáà yìí; òpin ayé
  rationale: Àfikún “yìí” mú kí “ayé” túmọ̀ sí ìgbà tàbí sáà tó ń lọ báyìí, láìfi ìtumọ̀ ìparun gbogbo ìṣẹ̀dá kún ọ̀rọ̀ Gíríìkì. Àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ “ìparí pípé” mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àwòrán iṣẹ́ àgbẹ̀ àti ìtẹ̀sí ọ̀rọ̀ Gíríìkì mọ́.
