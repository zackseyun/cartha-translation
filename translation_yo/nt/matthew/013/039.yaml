revisions:
- from: Ọ̀tá tí ó sì fún irúgbìn wọn ni Èṣù; ìkórè ni òpin ayé yìí[a], àwọn olùkórè sì ni àwọn áńgẹ́lì.
  to: Ọ̀tá tí ó gbìn wọ́n ni Bìlísì; ìkórè ni ìparí sáà yìí[a], àwọn olùkórè sì ni àwọn áńgẹ́lì.
  rationale: The revision restores αὐτά as the object of the sowing action, uses the unambiguous Standard Yoruba biblical term Bìlísì for διάβολος, and renders συντέλεια αἰῶνος as the culmination/end of an age rather than potentially the destruction of the world. The footnote preserves both the fuller lexical alternative and the traditional rendering.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the enemy, harvest, end-of-the-age concept, and angels. However, “tí ó sì fún irúgbìn wọn” does not mean “who sowed them”; its possessive wording changes the Greek object αὐτά. “Èṣù” is also not a safe rendering of ὁ διάβολος in Standard Yoruba, since it conventionally denotes a distinct Yoruba oriṣa rather than the biblical Devil.
  naturalness: “Ìparí sáà yìí” is a clearer modern Standard Yoruba expression for the temporal sense of συντέλεια αἰῶνος than “òpin ayé yìí.” The revised clauses remain concise and retain the parable’s agricultural imagery.
  terminology: Use “Bìlísì” for “the devil,” avoiding conflation with Èṣù. Use “gbìn wọ́n” for the completed act of sowing them; it is natural Yoruba in this agricultural metaphor. “Àwọn áńgẹ́lì” and “àwọn olùkórè” are retained.
  issues:
  - severity: high
    issue: “tí ó sì fún irúgbìn wọn” does not render ὁ σπείρας αὐτά accurately.
    rationale: The Greek participle means “who sowed,” and αὐτά is its direct object (“them,” referring to the weeds). The draft instead speaks of giving/sowing “their seed,” altering both syntax and meaning.
  - severity: high
    issue: “Èṣù” is used for ὁ διάβολος.
    rationale: In Yoruba religious and cultural usage, Èṣù is the name of a Yoruba oriṣa and should not be equated with the biblical Devil. “Bìlísì” is the established unambiguous biblical designation.
  - severity: medium
    issue: “òpin ayé yìí” can be read as the end of the physical world.
    rationale: Although the supplied rationale intends a temporal sense, αἰών here is an age. “Ìparí sáà yìí” more directly preserves that sense and the culminating force of συντέλεια.
  revised_text: Ọ̀tá tí ó gbìn wọ́n ni Bìlísì; ìkórè ni ìparí sáà yìí[a], àwọn olùkórè sì ni àwọn áńgẹ́lì.
  revised_footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìparí pípé ti sáà yìí”; ní ìbílẹ̀, “òpin ayé.”
    reason: lexical_alternative
  revision_rationale: The revision restores αὐτά as the object of the sowing action, uses the unambiguous Standard Yoruba biblical term Bìlísì for διάβολος, and renders συντέλεια αἰῶνος as the culmination/end of an age rather than potentially the destruction of the world. The footnote preserves both the fuller lexical alternative and the traditional rendering.
