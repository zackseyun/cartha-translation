id: MAT.13.15
reference: Matthew 13:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: yo
  text: Nítorí ọkàn àwọn ènìyàn yìí ti di aláìmòye[a]; wọ́n ń fi etí wọn gbọ́ pẹ̀lú ìṣòro, wọ́n sì ti di ojú wọn mọ́, kí wọn má bàa fi ojú wọn rí, kí wọn má bàa fi etí wọn gbọ́, kí wọn má bàa fi ọkàn wọn lóye, kí wọn má bàa yí padà[b], èmi yóò sì wò wọ́n sàn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ọkàn àwọn ènìyàn yìí ti di nípọn” tàbí “ti sanra”; níbí ó ń tọ́ka sí ọkàn tí ó ti di aláìmòye tàbí aláìní ìmọ̀lára.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “padà.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ yìí wá láti inú Aísáyà 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: ti kú yin-in
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí dídìpọn tàbí sísanra, ṣùgbọ́n nípa ọkàn ó ń tọ́ka sí àìní ìmọ̀lára àti ìmòye. “Ti kú yin-in” jẹ́ àkàwé Yorùbá tó ṣe kedere, tó sì yẹra fún fífi “ọkàn líle” rọ́pò àwòrán inú orísun.
- source_word: καρδία
  choice: ọkàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún inú ènìyàn gẹ́gẹ́ bí ibùdó ìmòye àti ìfẹ́ inú; ó tún bá lílo ọkàn fún òye ní apá tó tẹ̀ lé e mu.
- source_word: λαοῦ τούτου
  choice: àwọn ènìyàn yìí
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ τούτου mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘this people’ ní Yorùbá òde òní.
- source_word: βαρέως ἤκουσαν
  choice: wọ́n ń fi etí wọn gbọ́ pẹ̀lú ìṣòro
  rationale: βαρέως ní àwòrán ‘wúwo,’ ṣùgbọ́n pẹ̀lú gbígbọ́ ó túmọ̀ sí gbígbọ́ tó nira tàbí tó díwọ̀n. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: ἐκάμμυσαν
  choice: wọ́n sì ti di ojú wọn
  rationale: 'Ó pa ohùn aṣiṣeṣe náà mọ́: àwọn ènìyàn fúnra wọn ni wọ́n di ojú wọn. “Ti di” tún fi ìṣe tó ti ṣẹlẹ̀ ṣùgbọ́n tí àbájáde rẹ̀ ṣì wà hàn.'
- source_word: μήποτε
  choice: kí wọn má bà á
  rationale: Ọ̀nà Yorùbá yìí ń fi ìkìlọ̀ tàbí ète òdì tí μήποτε lè ní hàn, láìyanjú bóyá gẹ́gẹ́ bí ète tàbí àbájáde ni a gbọ́dọ̀ lóye rẹ̀.
- source_word: συνῶσιν
  choice: lóye
  rationale: “Lóye” sọ ìmòye inú tàbí mímọ ìtumọ̀ ohun kan ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tó rọrùn.
- source_word: ἐπιστρέψωσιν
  choice: yí padà
  rationale: Ó pa ìtumọ̀ yíyí tàbí pípadà sí ọ̀nà mìíràn mọ́, láìfi èdè ẹ̀kọ́ ìjọ kan bí ‘di ẹni ìgbàgbọ́’ sínú ẹsẹ náà.
- source_word: ἰάσομαι
  choice: èmi yóò sì mú wọn láradá
  rationale: Ó tẹ̀ lé ọ̀nà ọjọ́ iwájú ti fáàbù Gíríìkì, ó sì pa Ọlọ́run gẹ́gẹ́ bí olùṣe ìwòsàn mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìdájọ́ Ọlọ́run àti ojúṣe àwọn ènìyàn nínú gbólóhùn μήποτε
  choice: kí wọn má bà á rí ... gbọ́ ... lóye ... yí padà, èmi yóò sì mú wọn láradá
  alternative: bí bẹ́ẹ̀ kọ́, wọn ì bá rí ... wọn ì bá yí padà, èmi ì bá sì mú wọn láradá
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìrísí gbólóhùn Gíríìkì àti ìdààmú ẹ̀kọ́ ìgbàgbọ́ inú àyọlò Aísáyà mọ́. Kò sọ ìṣòro náà di ète Ọlọ́run nìkan tàbí ojúṣe ènìyàn nìkan; ó sì pa ìṣe àwọn ènìyàn nínú dídí ojú wọn mọ́.
- issue: Ìtumọ̀ ìyípadà nínú ἐπιστρέψωσιν
  choice: yí padà
  alternative: padà
  rationale: “Yí padà” lè ní ìtumọ̀ ìyí ọ̀nà tàbí pípadà sọ́dọ̀ Ọlọ́run, ṣùgbọ́n kò fi èdè ẹ̀kọ́ ẹ̀sìn tí ó ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe òde òní, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún gbogbo ènìyàn. A lo “kú yin-in” gẹ́gẹ́ bí àkàwé àdánidá, a sì lo “pẹ̀lú ìṣòro” dípò gbólóhùn aláìlẹ́sẹ̀ “gbọ́ ní wíwúwo.” Àtúnṣe μήποτε ni a tún ṣe ní ọ̀nà kan náà ní gbogbo ìpele láti pa ìtẹ̀lé àti ìfúnpá ọ̀rọ̀ orísun mọ́.
