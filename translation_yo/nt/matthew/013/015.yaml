  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé ètò ẹsẹ̀ Gíríìkì dáadáa, ó sì pa ìforígbárí inú μήποτε mọ́. Síbẹ̀, “kú yin-in” kò bá ἐπαχύνθη mu dáadáa: ó lè túmọ̀ sí ikú pátápátá, kì í sì ṣe ìwúwo ọkàn tàbí ìmòye tó ṣókùnkùn. “Di ojú wọn” tún lè túmọ̀ sí dí/blocking rather than shutting their eyes.'
  naturalness: Àwọn ọ̀rọ̀ bí “kí wọn má bà á fi ojú wọn ríran” kò wọ́pọ̀ nínú Yorùbá òde òní; ìlò “rí” láìsí atúnlò náà dára jù. “Di ojú wọn mọ́” jẹ́ ọ̀nà tí ó ṣe kedere fún ìṣe ìmúlò wọn nínú títì ojú.
  terminology: A pa “ọkàn,” “lóye,” “yí padà,” àti “wò wọ́n sàn” mọ́ gẹ́gẹ́ bí àwọn ọ̀rọ̀ tí ó ṣe kedere, ti kò sì fi ìtumọ̀ ẹ̀kọ́ ìjọ kún ἐπιστρέψωσιν. Àlàyé ìsàlẹ̀ fún ἐπαχύνθη tún dá ìtumọ̀ àwòrán “di nípọn/sanra” sílẹ̀.
