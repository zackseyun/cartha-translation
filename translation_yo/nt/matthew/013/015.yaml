  to: Nítorí ọkàn àwọn ènìyàn yìí ti di aláìmòye[a]; wọ́n ń fi etí wọn gbọ́ pẹ̀lú ìṣòro, wọ́n sì ti di ojú wọn mọ́, kí wọn má bàa fi ojú wọn rí, kí wọn má bàa fi etí wọn gbọ́, kí wọn má bàa fi ọkàn wọn lóye, kí wọn má bàa yí padà[b], èmi yóò sì wò wọ́n sàn.[c]
