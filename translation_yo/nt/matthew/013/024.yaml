id: MAT.13.24
reference: Matthew 13:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: yo
  text: Ó tún gbé àkàwé mìíràn kalẹ̀ fún wọn, ó ní, “Ìjọba ọ̀run dà bí[a] ọkùnrin kan tí ó fún irúgbìn rere sínú oko rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A fi ìjọba ọ̀run wé ọkùnrin kan tí ó fún irúgbìn rere sínú oko rẹ̀.”
    reason: Ὡμοιώθη jẹ́ ọ̀rọ̀-ìṣe passive, èyí tí a lè túmọ̀ ní ọ̀nà tó sún mọ́ ìrísí Gíríìkì pé “a fi ... wé”; “dà bí” ni ọ̀nà Yorùbá tó rọrùn jù nínú ìbẹ̀rẹ̀ àkàwé.
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: àkàwé mìíràn
  rationale: “Àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìtàn àfiwé tí ń kọ́ni; “mìíràn” sì fi hàn pé àkàwé yìí tẹ̀ lé àwọn mìíràn.
- source_word: παρέθηκεν αὐτοῖς
  choice: gbé ... kalẹ̀ fún wọn
  rationale: Èyí pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́—pé a gbé ẹ̀kọ́ kan kalẹ̀ níwájú àwọn olùgbọ́—ṣùgbọ́n ó ṣì jẹ́ èdè Yorùbá àdánidá.
- source_word: λέγων
  choice: ó ní
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti so gbólóhùn ìṣáájú mọ́ ọ̀rọ̀ tí a fa yọ.
- source_word: Ὡμοιώθη
  choice: dà bí
  rationale: Nínú ọ̀nà tí Mátíù gbà ń bẹ̀rẹ̀ àkàwé ìjọba, “dà bí” sọ ìfiwéra náà ní kedere láìfi ìtumọ̀ àkókò tí kò pọndandan kún un.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tó mọ́gbọ́n dání àti tó wọ́pọ̀ fún gbólóhùn pàtàkì ti Mátíù, ó sì tọ́ka sí ìṣàkóso láti ọ̀run.
- source_word: ἀνθρώπῳ
  choice: ọkùnrin kan
  rationale: Ẹni inú àkàwé náà jẹ́ akọ nínú ọ̀rọ̀ Gíríìkì, nítorí náà “ọkùnrin kan” pa ìtọ́kasí náà mọ́.
- source_word: σπείραντι καλὸν σπέρμα
  choice: tí ó fún irúgbìn rere
  rationale: “Fún irúgbìn” jẹ́ gbólóhùn iṣẹ́ àgbẹ̀ Yorùbá tó ṣe kedere, “irúgbìn rere” sì pa ìyàtọ̀ tó ń bọ̀ láàárín irúgbìn rere àti èpò mọ́.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: sínú oko rẹ̀
  rationale: “Oko rẹ̀” fi ìní ọkùnrin náà hàn ní tààrà, “sínú” sì bá iṣẹ́ fífún irúgbìn mu ní èdè Yorùbá.
theological_decisions:
- issue: Ọ̀nà ìtúmọ̀ gbólóhùn ìjọba ti Mátíù
  choice: Ìjọba ọ̀run
  alternative: Ìjọba àwọn ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé οὐρανῶν jẹ́ ọ̀pọ̀ nínú Gíríìkì, “ọ̀run” ní ẹyọ ni ọ̀nà Yorùbá àdánidá tí kò yí ìtumọ̀ ìṣàkóso Ọlọ́run padà.
- issue: Agbára Ὡμοιώθη nínú ìbẹ̀rẹ̀ àkàwé
  choice: dà bí
  alternative: a fi ... wé
  rationale: “Dà bí” jẹ́ ọ̀nà àdánidá láti sọ ìfiwéra inú àkàwé. Àfikún ìsàlẹ̀ ojú ewé pa ọ̀nà ìtumọ̀ passive tó sún mọ́ ìrísí Gíríìkì mọ́ láìfipá mú un wọ inú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “àkàwé” dípò “òwe” láti mú irú ìtàn ìkọ́ni yìí ṣe kedere, a sì lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
