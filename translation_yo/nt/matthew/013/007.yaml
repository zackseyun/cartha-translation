  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: yo
  text: Àwọn irúgbìn mìíràn sì ṣubú sí àárín àwọn ẹ̀gún[a]; àwọn ẹ̀gún náà sì hù sókè, wọ́n sì fún wọn pa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó túmọ̀ ní tààrà sí “ṣubú sí orí àwọn ẹ̀gún”; a lò “sí àárín àwọn ẹ̀gún” nítorí pé ó jẹ́ ọ̀nà àdánidá ní Yorùbá nínú àyíká iṣẹ́ àgbẹ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Àwọn irúgbìn mìíràn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ tí ó tọ́ka sí àwọn irúgbìn nínú àkópọ̀ òwe náà ni; fífi “irúgbìn” hàn mú kí Yorùbá ṣe kedere, láìfi èrò tuntun kún un.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú gẹ́gẹ́ bí àsopọ̀ tí kò fi ìtakora líle hàn; “sì” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἔπεσεν
  choice: bọ́
  rationale: Èyí pa ìtumọ̀ gidi ti πίπτω, ‘ṣubú/bọ́,’ mọ́, dípò ṣíṣàlàyé rẹ̀ sí ‘a fúnrúgbìn.’
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: sí àárín àwọn ẹ̀gún
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐπί pẹ̀lú accusative lè túmọ̀ ní tààrà sí ‘sí orí,’ ‘sí àárín’ ni Yorùbá àdánidá fún irúgbìn tí ó bọ́ sí ibi tí ẹ̀gún wà tàbí yóò ti hù.
- source_word: ἀκάνθας / ἄκανθαι
  choice: àwọn ẹ̀gún
  rationale: “Ẹ̀gún” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè tọ́ka sí ewéko ẹlẹ́gùn nínú àyíká iṣẹ́ àgbẹ̀ yìí.
- source_word: ἀνέβησαν
  choice: hù sókè
  rationale: Ó pa àwòrán ìdàgbàsókè sókè tí ἀναβαίνω ní mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá fún ewéko ní Yorùbá.
- source_word: ἔπνιξαν
  choice: fún wọn pa
  rationale: Ọ̀rọ̀ yìí pa àwòrán lílágbára ti πνίγω, ‘fún pa,’ mọ́, ó sì bá bí ẹ̀gún ṣe lè dí irúgbìn lọ́wọ́ láti dàgbà mu.
- source_word: αὐτά
  choice: wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ náà tọ́ka padà sí àwọn irúgbìn; “wọn” pa ìtọ́kasí náà mọ́ láìṣe àlàyé ju orísun lọ.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé lásán; a sì pa àwòrán iṣẹ́ àgbẹ̀ àti lílágbára ọ̀rọ̀ Gíríìkì mọ́.
