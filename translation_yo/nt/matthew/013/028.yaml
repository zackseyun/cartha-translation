id: MAT.13.28
reference: Matthew 13:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ọ̀tá kan ló ṣe èyí.” Àwọn ẹrú[a] náà sì wí fún un pé, “Ǹjẹ́ o fẹ́ kí a lọ kó wọn jọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà, δοῦλοι (douloi), lè túmọ̀ sí “àwọn ẹrú” tàbí “àwọn ìránṣẹ́,” ní ìbámu pẹ̀lú àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé, tí ó sì bójú mu láti fi ọ̀rọ̀ àsọyé taara hàn.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: Ọ̀tá kan
  rationale: Bí ó tilẹ̀ jẹ́ pé gbólóhùn Gíríìkì náà ní ἄνθρωπος (‘ènìyàn’), iṣẹ́ rẹ̀ níbí ni láti fi ọ̀tá náà hàn gẹ́gẹ́ bí ẹnì kan; ‘Ọ̀tá kan’ ni ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: τοῦτο ἐποίησεν
  choice: ni ó ṣe èyí
  rationale: Ìtumọ̀ yìí pa àfihàn τοῦτο àti ìṣe tí ó ti ṣẹlẹ̀ mọ́, ó sì tẹnumọ́ ẹni tí ó ṣe é lọ́nà àdánidá ní Yorùbá.
- source_word: δοῦλοι
  choice: àwọn ẹrú
  rationale: ‘Ẹrú’ fi ipò ìdè àti ìṣàkóso olúwa wọn hàn ní kedere nínú àkàwé iṣẹ́ oko yìí; a fi ‘ìránṣẹ́’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn tí ó lè bá àyíká náà mu.
- source_word: Θέλεις
  choice: Ǹjẹ́ o fẹ́
  rationale: ‘Fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ìfẹ́ tàbí ìpinnu, èyí tí θέλω ń sọ.
- source_word: οὖν
  choice: sì
  rationale: Ní àyíká yìí, οὖν ń mú ìjíròrò náà tẹ̀ síwájú; ‘sì’ ṣe iṣẹ́ ìsopọ̀ yẹn lọ́nà àdánidá láìfi ìtumọ̀ ìparí ọgbọ́n tí ó lágbára kún un.
- source_word: ἀπελθόντες
  choice: kí a lọ
  rationale: Ìṣètò yìí fi ìṣe lílọ tí ó ṣáájú ìkójọ hàn ní Yorùbá tí ó rọrùn.
- source_word: συλλέξωμεν
  choice: kó ... jọ
  rationale: ‘Kó jọ’ bá ìṣe kíkó èpò papọ̀ nínú oko mu, ó sì jẹ́ ọ̀rọ̀ àdánidá.
- source_word: αὐτά
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò ọ̀pọ̀ yìí tọ́ka sí àwọn èpò inú àyíká ẹsẹ náà; ‘wọn’ ni ìtọ́kasí Yorùbá tí ó yẹ.
theological_decisions:
- issue: Ìtumọ̀ δοῦλοι nínú àkàwé náà
  choice: àwọn ẹrú
  alternative: àwọn ìránṣẹ́
  rationale: ‘Àwọn ẹrú’ pa ipò ìdè àti ìbáṣepọ̀ wọn pẹ̀lú olúwa ilé náà mọ́. Síbẹ̀, ‘àwọn ìránṣẹ́’ tún lè jẹ́ ìtumọ̀ tó bá àyíká iṣẹ́ ilé tàbí oko mu, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀ láìsọ pé kókó ẹ̀kọ́ àkàwé náà sinmi lórí ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yàgò fún ìtumọ̀ líle bí ‘ọ̀tá ènìyàn kan,’ èyí tí kì í ṣe ọ̀rọ̀ Yorùbá àdánidá.
