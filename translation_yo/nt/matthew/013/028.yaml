  to: Ó sì sọ fún wọn pé, “Ọ̀tá kan ló ṣe èyí.” Àwọn ẹrú[a] náà sì wí fún un pé, “Ǹjẹ́ o fẹ́ kí a lọ kó wọn jọ?”
  rationale: A yọ ‘rẹ̀’ kúrò nítorí pé kò sí nínú ọ̀rọ̀ ìpilẹ̀, a sì rọ́pò ‘bi í pé’ pẹ̀lú ‘wí fún un pé’ láti fara mọ́ λέγουσιν αὐτῷ. A pa gbogbo ìtumọ̀ àkàwé náà, ọ̀rọ̀ ‘àwọn ẹrú,’ àti àlàyé ìsàlẹ̀ tó ní àmì [a] mọ́.
