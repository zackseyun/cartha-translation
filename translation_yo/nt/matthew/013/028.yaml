  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀lọpọ̀ ìtumọ̀ Gíríìkì náà dáadáa: ọ̀tá kan ló ṣe ìṣe náà, àwọn δοῦλοι sì béèrè ìfẹ́ olúwa náà láti lọ kó àwọn èpò náà jọ. Ṣùgbọ́n ‘rẹ̀’ nínú ‘Àwọn ẹrú rẹ̀’ kì í sí nínú ẹsẹ̀ Gíríìkì yìí; bí ó tilẹ̀ jẹ́ pé àyíká àkàwé náà lè jẹ́ kó hàn pé ti olúwa ni wọ́n, a kò yẹ kí a fi àmì ìní náà kún ọ̀rọ̀ ẹsẹ̀. ‘Wí fún un’ tún sún mọ́ λέγουσιν (‘wọn sọ fún un’) ju ‘bi í’ lọ, bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ wọn jẹ́.'
  naturalness: ‘Ọ̀tá kan ló ṣe èyí’ àti ‘Ǹjẹ́ o fẹ́ kí a lọ kó wọn jọ?’ jẹ́ Yorùbá òde òní tí ó dára, tí ó sì yẹ fún àkàwé náà. ‘Àwọn ẹrú náà sì wí fún un pé’ jẹ́ ìṣètò tó mọ́gbọ́n dání, tó sì jẹ́ kí ìbéèrè tó tẹ̀ lé e hàn kedere.
  terminology: ‘Àwọn ẹrú’ jẹ́ ìtumọ̀ tí ó bójú mu fún δοῦλοι nínú àkàwé yìí, níbi tí ìbáṣepọ̀ ìsàkóso olúwa àti àwọn abẹ́ rẹ̀ ti hàn. Àlàyé ‘àwọn ìránṣẹ́’ gẹ́gẹ́ bí àṣàyàn ìtumọ̀ jẹ́ tó, ó sì ní àmì [a] tó bá ọ̀rọ̀ náà mu.
