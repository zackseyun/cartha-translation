  source_fidelity: Ìtumọ̀ náà ń fi ìpè àṣẹ ẹni-kẹta nínú ἀκουέτω hàn dáadáa pẹ̀lú “kí ó gbọ́,” àti “etí” lè dúró fún ọ̀pọ̀ etí nínú Yorùbá. Ṣùgbọ́n “tí ó bá ní” fi ìtumọ̀ ìpò/àdéhùn (“bí ẹni bá ní”) kún substantival participle ὁ ἔχων. “Ẹni tí ó ní” sún mọ́ ọ̀rọ̀ orísun, ó sì jẹ́ Yorùbá àdánidá.
