  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: yo
  text: Ẹni tí ó ní etí, kí ó gbọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ẹni tí ó bá ní
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ pẹ̀lú participle náà ń tọ́ka sí ẹnikẹ́ni ní gbogbogbòò. “Ẹni tí ó bá ní” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ yìí mọ́ láì fi akọ tàbí abo kún un.
- source_word: ὦτα
  choice: etí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni ọ̀rọ̀ Gíríìkì náà, “etí” lè jẹ́ ọ̀kan tàbí ọ̀pọ̀ ní Yorùbá gẹ́gẹ́ bí àyíká ọ̀rọ̀; nínú gbólóhùn yìí ó túmọ̀ sí etí ẹni méjèèjì, ó sì jẹ́ ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: ἀκουέτω
  choice: kí ó gbọ́
  rationale: Ìṣẹ̀lẹ̀ àṣẹ ẹni kẹta nínú Gíríìkì ni a fi “kí ó gbọ́” hàn lọ́nà àdánidá. “Gbọ́” pa ìsopọ̀ pẹ̀lú gbígbọ́ mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé gbígbọ́ pẹ̀lú àfiyèsí àti ìtẹ́wọ́gbà ni a ń béèrè.
theological_decisions:
- issue: Ọ̀rọ̀ akọ tí a lò fún gbogbo ènìyàn nínú Gíríìkì
  choice: Ẹni tí ó bá ní etí, kí ó gbọ́.
  alternative: Ẹnikẹ́ni tí ó bá ní etí, kí ó fetí sílẹ̀.
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú “ẹni” àti “ó,” nítorí náà ìtumọ̀ náà lè tọ́ka sí gbogbo ènìyàn ní ti ẹ̀dá, nígbà tí ó sì ń pa ìṣọ̀kan ẹni kan àti agbára ọ̀rọ̀ ìkìlọ̀ náà mọ́. A kò nílò láti yí i sí ọ̀pọ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Kí ó gbọ́” pa àṣẹ kúkúrú àti ìró ọ̀rọ̀ Jesu mọ́; àmì ohùn ni a lò níbi tí ó yẹ.
