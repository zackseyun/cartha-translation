id: MAT.13.29
reference: Matthew 13:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: yo
  text: Ṣùgbọ́n ó ní, “Rárá; kí ẹ má bàa fa àlìkámà tu pẹ̀lú wọn bí ẹ ṣe ń kó àwọn èpò[a] jọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “irú èpò kan tí ó jọ àlìkámà”; ó ṣeé ṣe kí ó jẹ́ èpò darnel, tí ó lè jọ àlìkámà ní ìbẹ̀rẹ̀ ìdàgbàsókè rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: ó ní
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí ìtàn, ‘ó ní’ jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ̀rọ̀ ẹni nínú ìtàn.
- source_word: Οὔ
  choice: Rárá
  rationale: Ó mú ìdáhùn òdì tààrà náà jáde ní Yorùbá tí ó ṣe kedere.
- source_word: μήποτε
  choice: kí ó má bàa jẹ́ pé
  rationale: Ó fi ìkìlọ̀ nípa ohun búburú tí ó ṣeé ṣe kí ó ṣẹlẹ̀ hàn, láì sọ ọ́ di ohun tí yóò ṣẹlẹ̀ dájúdájú.
- source_word: συλλέγοντες
  choice: bí ẹ ti ń kó … jọ
  rationale: Ó fi hàn pé kíkó àwọn èpò jọ àti fífa àlìkámà tu lè ṣẹlẹ̀ ní àkókò kan náà; ó sì bá ọ̀rọ̀ tí a ń bá ọ̀pọ̀ ìránṣẹ́ sọ mu.
- source_word: ζιζάνια
  choice: àwọn èpò
  rationale: ‘Àwọn èpò’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ewéko búburú inú oko; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ewéko pàtó tí ó lè jọ àlìkámà mọ́.
- source_word: ἐκριζώσητε
  choice: ẹ ó fa … tu … kúrò ní gbòǹgbò
  rationale: Gbólóhùn yìí sọ ìtumọ̀ fífa ohun jáde láti gbòǹgbò rẹ̀ ní kíkún, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἅμα αὐτοῖς
  choice: pẹ̀lú wọn
  rationale: Ó ṣàfihàn pé àlìkámà lè jáde papọ̀ mọ́ àwọn èpò náà.
- source_word: σῖτον
  choice: àlìkámà
  rationale: Nínú àyíká iṣẹ́ oko yìí, ọ̀rọ̀ náà tọ́ka sí àlìkámà ní pàtó ju ọkà lápapọ̀ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ζιζάνια nínú òwe tí a mọ̀ dáadáa
  choice: àwọn èpò
  alternative: irú èpò kan tí ó jọ àlìkámà ní ìbẹ̀rẹ̀ ìdàgbàsókè rẹ̀
  rationale: Kókó ẹ̀kọ́ ẹsẹ náà kò sinmi lórí dídá irú ewéko náà mọ̀ ní pàtó. Ọ̀rọ̀ gbogbogbò tí ó ṣe kedere ló wà nínú àyọkà, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa àṣàyàn tó ṣe pàtó mọ́ láì fi í múlẹ̀ bí ohun tí kò ṣeé ṣiyèméjì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ àdánidá tó ní iyì. ‘Ó ní’ ni a lò fún historical present; ‘kí ó má bàa jẹ́ pé’ pa ìṣiyèméjì àti ìkìlọ̀ μήποτε mọ́.
