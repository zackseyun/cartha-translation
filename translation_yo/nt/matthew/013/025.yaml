id: MAT.13.25
reference: Matthew 13:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ènìyàn ń sùn, ọ̀tá rẹ̀ wá, ó sì fún èpò búburú sí àárín àlìkámà, ó sì lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: àwọn ọkùnrin náà
  rationale: Nínú àyíká iṣẹ́ oko yìí, ó tọ́ka sí àwọn ọkùnrin tí ń ṣiṣẹ́ tàbí ṣọ́ oko; yíyan ‘àwọn ọkùnrin’ tún bá ẹ̀rí àtúnṣe tí a pèsè mu.
- source_word: ὁ ἐχθρὸς
  choice: ọ̀tá rẹ̀
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ Gíríìkì àti ìbátan onílé náà mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐπέσπειρεν
  choice: fún ... sáàárín
  rationale: ‘Fún’ ni ọ̀rọ̀ Yorùbá àdánidá fún fífi irúgbìn sínú ilẹ̀; ‘sáàárín’ ṣàfihàn pé a fọn wọn ká sínú àlìkámà.
- source_word: ζιζάνια
  choice: èpò búburú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí irú èpò kan tó jọ àlìkámà ní ìbẹ̀rẹ̀ ìdàgbàsókè; ‘èpò búburú’ jẹ́ ọ̀rọ̀ tó yé gbogbo ènìyàn láìsọ irú ọ̀gbìn pàtó ju ẹ̀rí lọ.
- source_word: σίτου
  choice: àlìkámà
  rationale: Ìtumọ̀ àdánidá àti pàtó fún wheat ní Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ ọ̀tá àti èpò búburú
  choice: A kò fi ìdánimọ̀ tàbí ìtumọ̀ àpẹẹrẹ kún ẹsẹ yìí.
  alternative: Láti pe ọ̀tá ní Èṣù tàbí láti sọ ohun tí èpò náà dúró fún nínú ẹsẹ yìí.
  rationale: Ẹsẹ náà fúnra rẹ̀ sọ ‘ọ̀tá rẹ̀’ nìkan; àlàyé àpẹẹrẹ náà wá lẹ́yìn náà, nítorí náà a pa ìtẹ̀síwájú àti ìfọ̀rọ̀wérọ̀ ìtàn náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán.
