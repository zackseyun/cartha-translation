id: MAT.13.44
reference: Matthew 13:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: yo
  text: Ìjọba ọ̀run dàbí ìṣúra tí a fi pamọ́ nínú oko kan,[a] tí ọkùnrin kan rí, tí ó sì tún fi í pamọ́. Nítorí ayọ̀ rẹ̀,[b] ó lọ, ó ta gbogbo ohun tí ó ní, ó sì ra oko náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìjọba ọ̀run dàbí ìṣúra tí a fi pamọ́ nínú oko.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Nítorí ayọ̀ rẹ̀, ó lọ kúrò, ó sì ta gbogbo ohun ìní rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: dàbí
  rationale: Ọ̀nà àfiwé yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìrísí àkàwé náà mọ́.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Ìjọba ọ̀run
  rationale: “Ìjọba” lè tọ́ka sí agbègbè ìjọba àti sí ìṣàkóso; “ọ̀run” sì jẹ́ ọ̀nà Yorùbá àdánidá láti pa gbólóhùn Mátíù mọ́.
- source_word: θησαυρῷ
  choice: ìṣúra
  rationale: Ó túmọ̀ sí ohun iyebíye tí a kó pamọ́; àìsí atọ́ka nínú Yorùbá bá àfiwé aláìdánimọ̀ mu.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: tí a fi pamọ́ sínú oko kan
  rationale: Ó fi ipò ìṣúra tí ó wà ní ìpamọ́ hàn; “oko kan” jẹ́ àdánidá fún oko tí a kò tíì dá mọ̀ tẹ́lẹ̀.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: tí ọkùnrin kan rí
  rationale: Ó pa ẹni akọ nínú ìtàn náà mọ́, ó sì ṣètò gbolohun náà ní Yorùbá àdánidá.
- source_word: ἔκρυψεν
  choice: tí ó sì tún fi pamọ́
  rationale: Ọ̀rọ̀-arọ́pò ohun náà hàn gbangba nínú àyíká; “tún” mú kí ó ṣe kedere pé lẹ́yìn rírí ìṣúra náà ni ọkùnrin náà fi í pamọ́ lẹ́ẹ̀kan sí i.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: Nítorí ayọ̀ rẹ̀
  rationale: Àsopọ̀ náà ń sọ ìdí tí ó fi ṣe ohun tí ó tẹ̀ lé, nígbà tí ó tún pa ìmọ̀lára ayọ̀ mọ́.
- source_word: ὑπάγει
  choice: ó lọ
  rationale: Ó jẹ́ ọ̀nà kúkúrú, àdánidá fún ìgbésẹ̀ ìtàn tí a sọ ní àkókò ìsinsìnyí nínú Gíríìkì.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: ó ta gbogbo ohun tí ó ní
  rationale: Ó pa ìtumọ̀ pé kò fi ohunkóhun sílẹ̀ mọ́, láìfi “ní ìní” kún ohun tí orísun kò sọ ní pàtó.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: ó sì ra oko náà
  rationale: “Oko náà” tọ́ka sí oko pàtó tí ìṣúra wà nínú rẹ̀, gẹ́gẹ́ bí ἐκεῖνον ṣe ń tẹnumọ́.
theological_decisions:
- issue: Ìtumọ̀ βασιλεία
  choice: Ìjọba
  alternative: Ìṣàkóso
  rationale: “Ìjọba” pa ìwọ̀n ìtumọ̀ tó lè jẹ́ agbègbè tàbí ìṣàkóso mọ́, láìdá ìṣòro ìtumọ̀ náà sí ọ̀nà kan ṣoṣo.
- issue: Ìfihàn akọ nínú ἄνθρωπος
  choice: ọkùnrin kan
  alternative: ẹnì kan
  rationale: Ẹni inú àkàwé náà jẹ́ akọ gẹ́gẹ́ bí ìṣètò Gíríìkì ṣe fi hàn; yíyàn yìí kò yí ẹni àpẹẹrẹ náà padà sí ọ̀rọ̀ àìlákọ̀-lábò.
- issue: Ìṣe ọkùnrin náà lẹ́yìn rírí ìṣúra
  choice: tí ó sì tún fi pamọ́
  alternative: tí ó sì fi pamọ́
  rationale: A kò ṣàlàyé ìwà rere tàbí ìwà búburú ìṣe náà; a kan pa ìtẹ̀síwájú ìtàn mọ́, níbi tí ìṣúra ti wà ní ìpamọ́ tẹ́lẹ̀, tí ọkùnrin náà sì fi í pamọ́ lẹ́yìn tí ó rí i.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, pẹ̀lú èdè òde òní, ọ̀wọ̀, àti ọ̀nà ìtàn tó rọrùn fún òǹkàwé gbogbogbò. A lo “oko” fún ἀγρός, a sì yẹra fún ṣíṣe àlàyé ìwà tàbí ẹ̀kọ́ ìsìn tí ẹsẹ̀ náà kò sọ.
