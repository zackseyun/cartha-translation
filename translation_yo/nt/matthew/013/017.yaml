id: MAT.13.17
reference: Matthew 13:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: yo
  text: Nítorí, lóòótọ́, mo sọ fún yín pé ọ̀pọ̀ àwọn wòlíì àti àwọn olódodo[a] ní ìfẹ́ gidigidi láti rí ohun tí ẹ̀yin ń rí, ṣùgbọ́n wọn kò rí i, àti láti gbọ́ ohun tí ẹ̀yin ń gbọ́, ṣùgbọ́n wọn kò gbọ́ ọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn olódodo.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀-àpèjúwe tí a lò bí ọ̀rọ̀-orúkọ; ó ń tọ́ka sí àwọn ẹni olódodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: lóòótọ́ ni
  rationale: Ó fi ìmúdájú ọ̀rọ̀ Jesu hàn ní ọ̀nà tí ó jẹ́ àdánidá ní Yorùbá, láì kan ṣe àfọwọ́kọ ‘àmín.’
- source_word: γὰρ
  choice: nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí fún un.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ó pa ìsọ̀rọ̀ tààrà àti ọ̀nà gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: ọ̀pọ̀ àwọn wòlíì àti àwọn olódodo
  rationale: ‘Àwọn olódodo’ mú ajẹtífù tó dúró bí ọ̀rọ̀-orúkọ hàn, ó sì yà wọ́n sí ẹ̀ka tí ó gbooro ju àwọn wòlíì nìkan lọ.
- source_word: ἐπεθύμησαν
  choice: ni ó ti ń hára gàgà
  rationale: Ọ̀rọ̀ yìí mú ìfẹ́-ọkàn líle àti ìyánhànhàn wọn hàn, láì fi èrò ìfẹ́ búburú kún un.
- source_word: ἃ βλέπετε
  choice: ohun tí ẹ̀yin ń rí
  rationale: Ó pa ohun tí a rí náà mọ́ láì sọ pé ó jẹ́ Jesu, Ìjọba, tàbí ohun mìíràn tí ẹsẹ̀ náà kò dárúkọ.
- source_word: οὐκ εἶδαν
  choice: wọn kò rí i
  rationale: Ó sọ òtítọ́ ìtàn pé wọn kò rí ohun tí wọ́n fẹ́ rí, pẹ̀lú arọ́pò-orúkọ tó tọ́ka sí ‘ohun.’
- source_word: ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: ohun tí ẹ̀yin ń gbọ́, ṣùgbọ́n wọn kò gbọ́ ọ
  rationale: Ó pa ìfarajọ́ tó wà láàárín rírí àti gbígbọ́ mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ δίκαιοι
  choice: àwọn olódodo
  alternative: àwọn ènìyàn olódodo
  rationale: Ajẹtífù Gíríìkì náà ń ṣiṣẹ́ bí ọ̀rọ̀-orúkọ ní ọ̀pọ̀; ‘àwọn olódodo’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ẹ̀ka àwọn ẹni ìran àtijọ́ tí wọ́n dúró ṣinṣin mọ́.
- issue: Ohun tí wọ́n rí àti ohun tí wọ́n gbọ́
  choice: A fi wọ́n sílẹ̀ gẹ́gẹ́ bí ‘ohun tí ẹ̀yin ń rí’ àti ‘ohun tí ẹ̀yin ń gbọ́.’
  alternative: Ṣí wọn túmọ̀ sí ‘Messáyà’ tàbí ‘àwọn àṣírí Ìjọba.’
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí ìfihàn Ìjọba nínú iṣẹ́ Jesu, ṣùgbọ́n ẹsẹ̀ náà fúnra rẹ̀ kò dárúkọ ohun náà ní pàtó; ìtumọ̀ yìí kò yanjú àìsọ pàtó náà lọ́nà àfikún.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ̀yin’ mú ọ̀pọ̀ ẹni inú ὑμῖν/βλέπετε/ἀκούετε hàn kedere. Àtúnṣe ‘ni ó ti ń hára gàgà’ jẹ́ àdánidá, ó sì fi agbára ἐπεθύμησαν hàn.
