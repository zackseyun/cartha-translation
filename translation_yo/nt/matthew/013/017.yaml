  to: Nítorí, lóòótọ́, mo sọ fún yín pé ọ̀pọ̀ àwọn wòlíì àti àwọn olódodo[a] ní ìfẹ́ gidigidi láti rí ohun tí ẹ̀yin ń rí, ṣùgbọ́n wọn kò rí i, àti láti gbọ́ ohun tí ẹ̀yin ń gbọ́, ṣùgbọ́n wọn kò gbọ́ ọ.
