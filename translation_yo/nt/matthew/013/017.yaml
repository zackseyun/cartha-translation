  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn ẹ̀ka ọ̀rọ̀ pàtàkì mọ́: àwọn wòlíì àti àwọn olódodo jẹ́ ẹgbẹ́ méjì, ohun tí a ń rí àti ohun tí a ń gbọ́ wà ní àìsọ pàtó gẹ́gẹ́ bíi nínú Gíríìkì, a sì tún sọ pé àwọn ẹni ìran ìṣáájú kò rí tàbí gbọ́ wọn. Síbẹ̀, ìsọ̀rọ̀ “ni ó ti ń hára gàgà” ń fún ἐπεθύμησαν ní ìrísí ìṣe tó ń lọ (progressive) àti ìtọ́kasí àkókò tí kò hàn nínú aorist náà. Àtúnṣe náà lo ọ̀nà Yorùbá tó rọrùn, tó sì dúró sí ìfẹ́-ọkàn líle tí ọ̀rọ̀ náà ní.'
