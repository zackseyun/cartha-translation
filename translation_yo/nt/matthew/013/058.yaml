source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: yo
  text: Kò sì ṣe ọ̀pọ̀ iṣẹ́ agbára níbẹ̀ nítorí àìgbàgbọ́ wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ọ̀pọ̀ iṣẹ́ ìyanu” tàbí “ọ̀pọ̀ iṣẹ́ tí agbára hàn nínú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn iṣẹ́ agbára, ó sì túmọ̀ sí iṣẹ́ ìyanu nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: Kò sì ṣe
  rationale: “Sì” ń tẹ ìtàn náà síwájú gẹ́gẹ́ bí καί, “kò” sì tako ọ̀rọ̀-ìṣe náà. “Ṣe” jẹ́ ìtumọ̀ tó gbooro, tó sì bá ποιέω mu ní àkópọ̀ yìí.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ó jẹ́ ọ̀rọ̀ ibi tó tọ́ka sí ìlú ìbílẹ̀ rẹ̀ nínú àyíká ẹsẹ̀ náà.
- source_word: δυνάμεις πολλὰς
  choice: ọ̀pọ̀ iṣẹ́ agbára
  rationale: δύναμις lè túmọ̀ sí agbára, ṣùgbọ́n ní irú àyíká yìí ó ń tọ́ka sí àwọn iṣẹ́ tí agbára Ọlọ́run hàn nínú wọn. “Iṣẹ́ agbára” pa ìsopọ̀ pẹ̀lú èrò agbára mọ́ láì fi ìtumọ̀ “iṣẹ́ ìyanu” nìkan rọ́pò rẹ̀; “ọ̀pọ̀” sì túmọ̀ πολλὰς.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: nítorí àìgbàgbọ́ wọn
  rationale: διά pẹ̀lú accusative ń sọ ohun tó fa ìṣẹ̀lẹ̀ náà; ἀπιστία sì túmọ̀ sí àìgbàgbọ́ tàbí àìní ìgbàgbọ́. “Àìgbàgbọ́” pa agbára odi ọ̀rọ̀ náà mọ́, ó sì bá bí wọ́n ṣe kọ̀ ọ́ sílẹ̀ nínú àyíká náà mu.
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà sọ pé kò lè ṣe iṣẹ́ agbára tàbí pé kò ṣe ọ̀pọ̀ iṣẹ́ agbára nítorí àìgbàgbọ́ wọn
  choice: “Kò sì ṣe ọ̀pọ̀ iṣẹ́ agbára níbẹ̀”
  alternative: “Kò sì lè ṣe ọ̀pọ̀ iṣẹ́ ìyanu níbẹ̀”
  rationale: Gíríìkì sọ οὐκ ἐποίησεν, ìyẹn “kò ṣe,” kì í ṣe ọ̀rọ̀ tó túmọ̀ sí “kò lè ṣe.” Ìtumọ̀ yìí kò fi àìlèṣe kún ohun tí Mátíù sọ, ó sì pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láì yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá àfẹnusọ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà ṣe kúkúrú, ó ní ọlá, ó sì ṣe kedere fún òǹkàwé gbogbo. A fi olùṣe tí àyíká ti jẹ́ kó ṣe kedere sílẹ̀ láì tún orúkọ rẹ̀ sọ, gẹ́gẹ́ bí ìlò Yorùbá ti rí.
