id: MAT.13.27
reference: Matthew 13:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: yo
  text: Àwọn ẹrú baálé ilé náà sì wá sọ́dọ̀ rẹ̀, wọ́n sì wí fún un pé, “Olúwa, ṣé kì í ṣe irúgbìn rere ni o gbìn sínú oko rẹ? Níbo ni èpò wọ̀nyí ti wá nígbà náà?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò sún mọ́ ẹni náà hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ iṣẹ́ tí ó ṣáájú εἶπον ní Yorùbá.
- source_word: δοῦλοι
  choice: ẹrú
  rationale: “Ẹrú” pa ipò àwọn tí wọ́n wà lábẹ́ àṣẹ olúwa wọn mọ́, láì sọ ọ́ di “ìránṣẹ́” lásán.
- source_word: οἰκοδεσπότου
  choice: baálé ilé
  rationale: “Baálé ilé” túmọ̀ sí ẹni tí ó jẹ́ olórí àti aláṣẹ ilé, ó sì bá àjọṣe rẹ̀ pẹ̀lú àwọn ẹrú mu.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó dúró ṣinṣin fún κύριος; níbí ó tún ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ sí baálé ilé.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: ṣé kì í ṣe irúgbìn rere ni o gbìn
  rationale: Ìbéèrè yìí ń retí ìdáhùn rere, “béẹ̀ ni”; ìṣètò “ṣé kì í ṣe ... ni” pa agbára yẹn mọ́ ní Yorùbá àdánidá.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: sínú oko rẹ
  rationale: “Sínú oko rẹ” jẹ́ ọ̀nà àdánidá ní Yorùbá fún fífún irúgbìn sínú ilẹ̀ oko tí ẹni náà ní.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: Níbo ni èpò wọ̀nyí ti wá nígbà náà?
  rationale: Ó pa ìbéèrè nípa orísun àwọn èpò àti ìtumọ̀ ìyọrísí οὖν mọ́, ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: ζιζάνια
  choice: èpò
  rationale: “Èpò” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ewéko búburú inú oko; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ pàtó tí ó ṣeé ṣe, dánẹ́lì, mọ́.
theological_decisions:
- issue: Ìtumọ̀ δοῦλοι nínú àkàwé ilé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ẹsẹ̀ náà kò kọ́ ẹ̀kọ́ ìgbàgbọ́ kan nípa oko ẹrú, ṣùgbọ́n “ẹrú” kò rọ ipò ìbáṣepọ̀ wọn pẹ̀lú olúwa wọn kù bí “ìránṣẹ́” ṣe lè ṣe.
- issue: Ìtumọ̀ κύριε gẹ́gẹ́ bí ọ̀rọ̀ ìkíni
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú àkàwé yìí, ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọ̀wọ̀ sí baálé ilé, kì í ṣe ìjẹ́wọ́ ní tààràtà nípa ẹni tí Kristi jẹ́; síbẹ̀ “Olúwa” pa ìbámu pẹ̀lú ìtumọ̀ κύριος mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; a lo “wọ́n wí fún un” dípò ọ̀rọ̀ ìfọ̀rọ̀wérọ̀ tí kò ní iyì.
