id: MAT.13.55
reference: Matthew 13:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: yo
  text: Ṣé èyí kì í ṣe ọmọ gbẹ́nàgbẹ́nà náà? Ṣé a kì í pe ìyá rẹ̀ ní Màríà, àwọn arákùnrin rẹ̀[a] sì ni Jákọ́bù, Jósẹ́fù[b], Símónì àti Júdásì?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìbátan rẹ̀” tàbí “àwọn ará rẹ̀.” Ọ̀rọ̀ Gíríìkì náà sábà máa ń túmọ̀ sí “àwọn arákùnrin,” ṣùgbọ́n àwọn kan lóye rẹ̀ ní ìtumọ̀ ìbátan tó gbòòrò sí i níbí.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé-àfọwọ́kọ kan ní “Jósẹ́sì” dípò “Jósẹ́fù.”
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: gbẹ́nàgbẹ́nà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí oníṣẹ́-ọnà tó ń fi igi tàbí ohun èlò ìkọ́lé ṣiṣẹ́. “Gbẹ́nàgbẹ́nà” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ ní àyíká yìí, bó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ lè gbòòrò sí oníṣẹ́ ìkọ́lé.
- source_word: υἱός
  choice: ọmọ
  rationale: Àyíká ẹbí mú kí ìtumọ̀ ọmọkùnrin hàn gbangba; ní Yorùbá, “ọmọ” ni àdàkọ àdánidá nínú gbólóhùn “ọmọ gbẹ́nàgbẹ́nà.”
- source_word: λέγεται
  choice: a kì í pe ... ní
  rationale: Èyí fi ìṣe aláìlórúkọ nínú ọ̀rọ̀ Gíríìkì hàn ní Yorùbá àdánidá, ó sì túmọ̀ sí “a ń pè é ní” tàbí “orúkọ rẹ̀ ni.”
- source_word: Μαριὰμ
  choice: Màríà
  rationale: Èyí ni irú orúkọ náà tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: ἀδελφοὶ
  choice: àwọn arákùnrin
  rationale: Ìtumọ̀ tí ó wọ́pọ̀ jù lọ ni “àwọn arákùnrin.” A kò yanjú àríyànjiyàn nípa bí ìbátan wọn ṣe rí nínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ tó lè gbòòrò sí i.
- source_word: Ἰάκωβος
  choice: Jákọ́bù
  rationale: Èyí ni àfihàn orúkọ náà tó mọ́gbọ́n dání tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: Ἰωσὴφ
  choice: Jósẹ́fù
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ inú SBLGNT; àyípadà ìwé-àfọwọ́kọ “Jósẹ́sì” wà nínú àlàyé ìsàlẹ̀.
- source_word: Σίμων
  choice: Símónì
  rationale: Àkọsílẹ̀ Yorùbá tó wọ́pọ̀ fún orúkọ náà.
- source_word: Ἰούδας
  choice: Júdásì
  rationale: Àkọsílẹ̀ yìí fi orúkọ Gíríìkì hàn ní kedere, láì fi ìdánimọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: οὐχ ... ;
  choice: Ṣé ... kì í ṣe ...? Ṣé ... kì í ...?
  rationale: Ìlànà ìbéèrè Yorùbá yìí fi ìbéèrè àsọyé tí ó ń retí ìdáhùn ìfẹ̀sẹ̀múlẹ̀ hàn, ó sì pa ìṣètò ìbéèrè méjì ti Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοὶ αὐτοῦ àti irú ìbátan àwọn ọkùnrin náà pẹ̀lú Jésù
  choice: Lo “àwọn arákùnrin rẹ̀” nínú ọ̀rọ̀ pàtàkì.
  alternative: “Àwọn ìbátan rẹ̀” tàbí “àwọn ará rẹ̀.”
  rationale: “Àwọn arákùnrin” ni ìtumọ̀ ojúlówó tí ó wọ́pọ̀ jù lọ fún ἀδελφοί. Àdàkọ náà kò gbọdọ̀ pinnu bóyá ọmọ ìyá kan náà ni wọ́n tàbí ìbátan mìíràn; àlàyé ìsàlẹ̀ pa ìtumọ̀ tó gbòòrò mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn níbi tó yẹ, ni a lò. Ìbéèrè “Ṣé ... kì í ...?” jẹ́ ti èdè òde òní, ó ṣe kedere fún gbogbo ènìyàn, ó sì ṣì ní ọ̀wọ̀ àti ìtẹ́wọ́gbà tó yẹ fún ìtẹ̀jáde Bíbélì.
