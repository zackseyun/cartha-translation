  rationale: A tún gbólóhùn ìbí náà ṣe láti yọ ìmọ̀lára pé ìbí náà ti parí ní ọjọ́ iwájú kúrò, kí a sì fi hàn ní kedere pé ìbéèrè náà jẹ́ nípa ibi tí a ń retí bí Mèsáyà sí. Kò sí ìyípadà sí ìtumọ̀ tàbí ìforúkọsílẹ̀ ẹsẹ náà.
