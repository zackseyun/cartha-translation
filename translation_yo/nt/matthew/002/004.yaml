id: MAT.2.4
reference: Matthew 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: yo
  text: Ó sì kó gbogbo àwọn olórí àlùfáà àti àwọn akọ̀wé àwọn ènìyàn jọ, ó ń béèrè lọ́wọ́ wọn níbi tí a ó bí Mèsáyà sí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Oyè Gíríìkì Χριστός túmọ̀ sí ẹni àmì-òróró; “Mèsáyà” níhìn-ín mú àyíká ìretí Mèsáyà ti àwọn Júù hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: kó ... jọ
  rationale: Ọ̀rọ̀ yìí fi hàn pé ó pe àwọn ènìyàn náà jọ; ìṣe náà ṣáájú ó sì so mọ́ ìbéèrè tó tẹ̀ lé e.
- source_word: πάντας
  choice: gbogbo
  rationale: Ó pa ìtumọ̀ pé gbogbo àwọn tó wà nínú àwọn ẹgbẹ́ méjèèjì mọ́.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí tọ́ka sí àwọn aṣáájú nínú ẹgbẹ́ àwọn àlùfáà, kì í ṣe pé gbogbo wọn ló ń di ipò àlùfáà àgbà kan ṣoṣo mú.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tààrà fún àwọn amòfin ẹ̀sìn tí a mọ̀ sí akọ̀wé ní àyíká Bíbélì, láìfi àlàyé ìtumọ̀ kún ọ̀rọ̀ inú ẹsẹ.
- source_word: τοῦ λαοῦ
  choice: àwọn ènìyàn
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́ láìfi àfikún pé 'àwọn Júù' sínú ẹsẹ náà.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: ó ń béèrè lọ́wọ́ wọn
  rationale: Àmì àkókò aláìparí nínú Gíríìkì fi ìbéèrè tó ń lọ lọ́wọ́ hàn; 'ń béèrè lọ́wọ́ wọn' jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ποῦ
  choice: níbi tí
  rationale: Ó mú ìbéèrè nípa ibi ṣẹ̀ṣẹ̀ gẹ́gẹ́ bí orísun.
- source_word: ὁ χριστὸς
  choice: Mèsáyà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ oyè fún ọba ẹni àmì-òróró tí àwọn Júù ń retí, kì í ṣe orúkọ lásán.
- source_word: γεννᾶται
  choice: a ó ti bí
  rationale: Ọ̀rọ̀ náà jẹ́ aláìṣe ní Gíríìkì, ó sì ń tọ́ka sí ìbí tí a ń retí; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtọ́kasí ọjọ́ iwájú mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká náà sọ nípa ẹni àmì-òróró tí àsọtẹ́lẹ̀ àwọn Júù ń tọ́ka sí. 'Mèsáyà' mú àyíká ìretí Júù náà hàn, nígbà tí àlàyé ìsàlẹ̀ fi 'Kristi' hàn gẹ́gẹ́ bí ìtumọ̀ míì.
translation_notes:
  register: Èdè Yorùbá àkókò yìí tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa 'akọ̀wé' mọ́ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó sún mọ́ orísun, a sì lo 'ó ń béèrè lọ́wọ́ wọn' láti fi ìṣe tó ń lọ lọ́wọ́ hàn.
