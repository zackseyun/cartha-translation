id: MAT.2.13
reference: Matthew 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti lọ, sì kíyèsí i, angẹli Olúwa kan farahàn Jóṣẹ́fù lójú àlá[a], ó ní, “Dìde, mú ọmọ náà àti ìyá rẹ̀, kí o sì sá lọ sí Ejibiti. Dúró níbẹ̀ títí tí èmi yóò fi sọ fún ọ; nítorí Herodu fẹ́rẹ̀ẹ́ wá ọmọ náà láti pa á.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé-àfọwọ́kọ kan yàtọ̀ nípa gbolohun náà, “farahàn Jóṣẹ́fù lójú àlá.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Lẹ́yìn tí wọ́n lọ tán
  rationale: Ó fi hàn pé ìlọkúrò àwọn àlejò tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ti ṣẹlẹ̀ ṣáájú ìran náà; ọ̀rọ̀ yìí sì jẹ́ Yorùbá àdánidá.
- source_word: ἰδοὺ
  choice: kíyèsi i
  rationale: A pa àmì ìtàn tó ń pe akiyesi mọ́, ní èdè ọ̀wọ̀ tó ṣeé lóye.
- source_word: ἄγγελος κυρίου
  choice: angẹli Olúwa kan
  rationale: Àìsí atíkù pàtó nínú Gíríìkì ṣe àtìlẹ́yìn fún ìtumọ̀ aláìlópìn ‘kan’; ‘Olúwa’ sì jẹ́ ìtumọ̀ akọ́lé κύριος.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: farahàn Jóṣẹ́fù lójú àlá
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àsìkò ìsinsìnyí, àsìkò àtẹ̀yìnwá bá ìtàn Yorùbá mu; κατ’ ὄναρ túmọ̀ sí ìfarahàn nínú àlá.
- source_word: Ἐγερθεὶς παράλαβε
  choice: Dìde, mú
  rationale: Participle náà ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ tó ṣáájú àṣẹ kejì; ‘mú’ níbí túmọ̀ sí kí ó mú wọn lọ pẹ̀lú ara rẹ̀.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: ọmọ náà àti ìyá rẹ̀
  rationale: Ó pa ìtọ́kasí pàtó sí ọmọ náà mọ́, pronoun náà sì tọ́ka sí ìyá ọmọ náà láìsí ìdàrúdàpọ̀.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: sá lọ sí Ejibiti
  rationale: ‘Sá lọ’ mú ìkánjú àti ewu inú φεύγω jáde ní Yorùbá àdánidá.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: Dúró níbẹ̀ títí èmi yóò fi sọ fún ọ
  rationale: ‘Dúró níbẹ̀’ ni ìtumọ̀ àdánidá fún wíwà níbẹ̀ títí dé àkókò ọjọ́ iwájú tí a kò tíì sọ pàtó; ‘èmi’ pa ẹni tó ń sọ̀rọ̀ mọ́ kedere.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: nítorí Herodu fẹ́ bẹ̀rẹ̀ sí í wá
  rationale: μέλλει pẹ̀lú infinitive fi ète tàbí ìṣe tó sún mọ́lé hàn; ọ̀rọ̀ yìí kò sọ pé ìwá náà ti bẹ̀rẹ̀.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: láti pa á run
  rationale: ἀπόλλυμι túmọ̀ sí píparun; nínú àyíká yìí ó jẹ́ pípa ọmọ náà, ‘pa á run’ sì pa agbára ọ̀rọ̀ orísun mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ἄγγελος κυρίου
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ ni ìtumọ̀ Bíbélì tó bójú mu fún akọ́lé κύριος ní àkójọpọ̀ ọ̀rọ̀ yìí, láìfi ẹ̀kọ́ ìjọ kan kún un.
- issue: Bóyá ἄγγελος κυρίου jẹ́ angẹli kan tàbí akọ́lé pàtó
  choice: angẹli Olúwa kan
  alternative: angẹli Olúwa náà
  rationale: Gíríìkì kò ní atíkù pàtó níbí, nítorí náà ‘kan’ pa ìtumọ̀ gírámà tó ṣeé ṣe jù mọ́; a kò fi ìdánimọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ọlọ́wọ̀, kedere, àti ti ìtàn Bíbélì, láìlo èdè àtijọ́ tí kò ṣeé lóye. Kò sí àlàyé ìsàlẹ̀ ojú-ewé nítorí àwọn ìyàtọ̀ pàtàkì ni a lè fi hàn taara nínú ìtumọ̀.
