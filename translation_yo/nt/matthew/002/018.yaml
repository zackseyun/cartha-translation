id: MAT.2.18
reference: Matthew 2:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: yo
  text: '“A gbọ́ ohùn kan ní Rámà,


    ẹkún àti ìdárò ńlá;


    Rákélì ń sunkún fún àwọn ọmọ rẹ̀,


    kò sì fẹ́ gba ìtùnú,[a]


    nítorí wọn kò sí mọ́.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kọ̀ láti gba ìtùnú.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “nítorí wọn kò sí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: ohùn kan
  rationale: “Ohùn” ṣètọ́jú ìtumọ̀ voice/sound, ó sì bá àwòrán àsọtẹ́lẹ̀ tí a sọ di ẹni bí ẹni mu.
- source_word: ἐν Ῥαμὰ
  choice: ní Rámà
  rationale: “Ní” ni ọ̀nà àdánidá láti sọ ibi tí a ti gbọ́ ohùn náà; a kọ orúkọ ibìkan náà sí Rámà.
- source_word: ἠκούσθη
  choice: A gbọ́
  rationale: Ìṣe aláìlórúkọ yìí fi ìròyìn àìtọ́ka ẹni tó gbọ́ ọ hàn, bí ìṣe àfarawà inú Gíríìkì.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: ẹkún àti ọ̀fọ̀ ńlá
  rationale: “Ẹkún” fi igbe ẹkún hàn, “ọ̀fọ̀ ńlá” sì pa agbára πολύς mọ́ ní Yorùbá tó ṣe kedere, tó sì ní iyì.
- source_word: Ῥαχὴλ κλαίουσα
  choice: Rákélì ń sunkún
  rationale: “Ń sunkún” pa ìṣe tó ń lọ lọ́wọ́ mọ́, láìṣe àlàyé àpẹẹrẹ Rákélì sínú ọ̀rọ̀ náà.
- source_word: τὰ τέκνα αὐτῆς
  choice: àwọn ọmọ rẹ̀
  rationale: τέκνα jẹ́ ọ̀rọ̀ gbogbogbò fún àwọn ọmọ, kì í ṣe àwọn ọmọkùnrin nìkan.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: kò sì fẹ́ gba ìtùnú
  rationale: Èyí tẹ̀lé ìtumọ̀ “kò fẹ́/kò múra tán” ju ọ̀rọ̀ tó le sí i bí “ó kọ̀” lọ, ó sì sọ àfarawà gbígba ìtùnú ní Yorùbá àdánidá.
- source_word: ὅτι οὐκ εἰσίν
  choice: nítorí wọn kò sí mọ́
  rationale: Ó pa líle àti àìṣàlàyé gbólóhùn Gíríìkì mọ́, láìfi ọ̀rọ̀ “wọ́n ti kú” kún un ní tààrà.
theological_decisions:
- issue: Ìrú ẹni tí Rákélì jẹ́ nínú ọ̀rọ̀ àsọtẹ́lẹ̀ náà
  choice: A fi Rákélì sílẹ̀ gẹ́gẹ́ bí ẹni abiyamọ nínú àsọtẹ́lẹ̀, láìṣàlàyé àmì rẹ̀ nínú ọ̀rọ̀ pàtàkì.
  alternative: Láti túmọ̀ Rákélì ní tààrà gẹ́gẹ́ bí àmì fún àwọn ìyá Ísírẹ́lì, tàbí gẹ́gẹ́ bí ìyá kan tó ń sọ̀rọ̀ ní ti gidi.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kan gbé àyọlò Jeremáyà kalẹ̀; ìtumọ̀ kò gbọdọ̀ yanju ìbáṣepọ̀ àpẹẹrẹ àti ìtàn tí ọ̀rọ̀ náà fi sílẹ̀ ní fífẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Ìlà ewì ń tẹ̀lé ìṣètò ọ̀rọ̀ àsọtẹ́lẹ̀ náà. Gbogbo àmì àlàyé ìsàlẹ̀ ojú ìwé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
