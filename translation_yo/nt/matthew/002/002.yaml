  to: wọ́n ń sọ pé, “Níbo ni ọba àwọn Júù tí a bí wà? Nítorí a rí ìràwọ̀ rẹ̀ ní ìlà-oòrùn[a], a sì wá láti foríbalẹ̀ fún un[b].”
  rationale: The revision corrects the Yoruba construction of “born king of the Jews,” restores a direct rendering of λέγοντες, and supplies the natural tone-marked interrogative “Níbo.” It leaves the source ambiguity in ἐν τῇ ἀνατολῇ and προσκυνῆσαι intact through the existing anchored footnotes.
