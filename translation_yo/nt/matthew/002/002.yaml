id: MAT.2.2
reference: Matthew 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: yo
  text: wọ́n ń sọ pé, “Níbo ni ọba àwọn Júù tí a bí wà? Nítorí a rí ìràwọ̀ rẹ̀ ní ìlà-oòrùn[a], a sì wá láti foríbalẹ̀ fún un[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nígbà tí ìràwọ̀ rẹ̀ yọ.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí “ní ìlà-oòrùn” tàbí kí ó tọ́ka sí ìgbà tí ìràwọ̀ náà yọ.
    reason: alternative_reading
  - marker: b
    text: Tàbí “láti jọ́sìn rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ìbọ̀wọ̀ fún ọba tàbí jíjọ́sìn, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n ń béèrè pé
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí ó ṣáájú ohun tí àwọn amòye náà sọ. Nínú àyíká yìí, ọ̀rọ̀ wọn jẹ́ ìbéèrè, nítorí náà “wọ́n ń béèrè pé” jẹ́ èdè Yorùbá àdánidá tí ó pa iṣẹ́ ọ̀rọ̀ náà mọ́.
- source_word: Ποῦ ἐστιν
  choice: Ibo ni ... wà?
  rationale: Èyí jẹ́ ìbéèrè nípa ibi tí ẹni náà wà; ìṣètò “Ibo ni ... wà?” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ὁ τεχθεὶς
  choice: ẹni tí a bí
  rationale: Ó pa àkópọ̀ participle passive mọ́ láì fi kún un pé ọmọ tuntun ni, ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún oyè ọba náà, ó sì pa agbára ìṣèlú àti ti Mèsáyà inú gbólóhùn náà mọ́.
- source_word: εἴδομεν γὰρ
  choice: Nítorí a rí
  rationale: “Nítorí” fi hàn pé gár ń sọ ìdí ìbéèrè wọn; “a rí” sì tú aorist náà sí ìṣe tí ó ti ṣẹlẹ̀ ní ọ̀nà àdánidá.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: ìràwọ̀ rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ possessive tó rọrùn, tí kò pinnu irú àmì ojú ọ̀run tí ìràwọ̀ náà jẹ́.
- source_word: ἐν τῇ ἀνατολῇ
  choice: ní ìlà-oòrùn
  rationale: Ìtumọ̀ yìí bá ọ̀nà tí a sábà ń ló mu, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí nígbà tí ìràwọ̀ náà yọ; a pa ìṣiyèméjì náà mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἤλθομεν
  choice: a sì wá
  rationale: Ìṣe dídé wọn ti ṣẹlẹ̀, ó sì ní ìbáṣepọ̀ pẹ̀lú ohun tí wọ́n ń ṣe nígbà tí wọ́n sọ̀rọ̀; “a sì wá” jẹ́ àdánidá ní Yorùbá.
- source_word: προσκυνῆσαι αὐτῷ
  choice: láti foríbalẹ̀ fún un
  rationale: “Foríbalẹ̀ fún” lè sọ ìbọ̀wọ̀ jíjinlẹ̀ fún ọba, ó sì tún lè ní ìtumọ̀ ìjọsìn gẹ́gẹ́ bí àyíká ṣe rí. Ó pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ láì yanjú rẹ̀ ní ọ̀nà ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ προσκυνῆσαι nípa ọmọ náà
  choice: láti foríbalẹ̀ fún un
  alternative: láti jọ́sìn rẹ̀
  rationale: Àwọn olùsọ̀rọ̀ ń wá Ọba àwọn Júù, nítorí náà ìbọ̀wọ̀ fún ọba wà nínú àyíká lẹ́sẹ̀kẹsẹ̀. Síbẹ̀, ọ̀rọ̀ náà lè túmọ̀ sí ìjọsìn pẹ̀lú; àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì náà mọ́, láì dín ẹ̀rí Mátíù nípa ẹni tí Jésù jẹ́ kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní ọlá ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yan “foríbalẹ̀ fún” láti pa ìtumọ̀ ìbọ̀wọ̀ ọba àti ìjọsìn méjèèjì sílẹ̀. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ṣàlàyé.
