  source_fidelity: 'Ìtumọ̀ náà mú ìtòlẹ́sẹẹsẹ àti àwọn kókó ìtumọ̀ Gíríìkì náà dáadáa: Hẹ́rọ́dù pè àwọn mágì ní ìkọ̀kọ̀, ó sì rí ìsọfúnni nípa àkókò ìfarahàn ìràwọ̀ náà lọ́wọ́ wọn. Síbẹ̀, ìdàpọ̀ ọrọ̀ náà “wádìí dájú lọ́wọ́ wọn ìgbà” kò rọrùn gan-an nínú Yorùbá, ó sì yẹ kí a sọ ìbéèrè/ìwádìí náà nípa àkókò náà ní kedere. Àfikún “ti” nínú “ti fara hàn” ń fi hàn pé ìfarahàn náà ti ṣẹlẹ̀ ṣáájú ìwádìí Hẹ́rọ́dù, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ náà.'
