lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àmì àkókò tó ń tẹ ìtàn náà síwájú ní Yorùbá àdánidá.
- source_word: Ἡρῴδης
  choice: Hẹ́rọ́dù
  rationale: Ìkọ orúkọ náà ní ọ̀nà tó bá ìpè Yorùbá mu.
- source_word: λάθρᾳ
  choice: ní ìkọ̀kọ̀
  rationale: Ó fi hàn pé Hẹ́rọ́dù ṣe ohun náà láìjẹ́ kí àwọn ẹlòmíràn mọ̀.
- source_word: καλέσας
  choice: pe
  rationale: Ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá pípè àwọn ènìyàn wá sí ọ̀dọ̀ ẹni mu; ìtòlẹ́sẹẹsẹ gbólóhùn náà pa ipa participle mọ́.
- source_word: τοὺς μάγους
  choice: àwọn mágì náà
  rationale: Ìkọlélórúkọ yìí pa ìtumọ̀ pàtó ti μάγοι mọ́, kò sì fi àwòrán àṣà tó wá lẹ́yìn kún un.
- source_word: ἠκρίβωσεν
  choice: wádìí dájú
  rationale: Ó mú èrò ṣíṣe ìwádìí láti mọ ohun kan pẹ̀lú ìpéye jáde ní Yorùbá tó ṣe kedere.
- source_word: παρ’ αὐτῶν
  choice: lọ́wọ́ wọn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn náà ni orísun ìsọfúnni.
- source_word: τὸν χρόνον
  choice: ìgbà
  rationale: Ó tọ́ka sí àkókò ìṣẹ̀lẹ̀ náà láìṣe àfikún ìtumọ̀ tí kò pọn dandan.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: tí ìràwọ̀ náà farahàn
  rationale: Ó sọ gbólóhùn participle náà di gbólóhùn àkókò tó ṣe kedere ní Yorùbá, nígbà tó pa ìṣẹ̀lẹ̀ ìfarahàn ìràwọ̀ mọ́.
