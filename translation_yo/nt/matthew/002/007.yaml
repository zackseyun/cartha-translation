  to: Nígbà náà ni Hẹ́rọ́dù pe àwọn mágì náà ní ìkọ̀kọ̀, ó sì wádìí lọ́wọ́ wọn ní ìpéye nípa àkókò tí ìràwọ̀ náà ti fara hàn.[a]
