id: MAT.2.23
reference: Matthew 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: yo
  text: Ó sì dé, ó sì gbé ní ìlú kan tí a ń pè ní Násárẹ́tì, kí ohun tí a ti sọ nípasẹ̀ àwọn wòlíì lè ṣẹ pé, “A ó pè é ní ará Násárẹ́tì[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Násárénì.” Àwọn onímọ̀ kò fohùn ṣọ̀kan nípa àsọtẹ́lẹ̀ pàtó tó wà lẹ́yìn gbólóhùn náà, “A ó pè é ní ará Násárẹ́tì.” Ó ṣeé ṣe kí Matteu ṣe àkótán àwọn kókó inú ọ̀rọ̀ àwọn wòlíì dípò kí ó fa ọ̀rọ̀ yọ láti inú ẹsẹ kan pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ó sì dé
  rationale: Aorist participle náà ń tọ́ka sí ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; lílo gbólóhùn aláṣẹ pẹ̀lú ‘sì’ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣe mọ́.
- source_word: κατῴκησεν
  choice: ó sì tẹ̀dó sí
  rationale: ‘Tẹ̀dó sí’ túmọ̀ sí gbígbé ibùgbé kalẹ̀ ní ibi kan, ó sì bá ìtumọ̀ κατοικέω mu ju ọ̀rọ̀ tí yóò kan túmọ̀ sí wíwà níbẹ̀ fún ìgbà díẹ̀ lọ.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: sí ìlú kan tí a ń pè ní Násárẹ́tì
  rationale: ‘Sí’ pa ìtọ́sọ́nà εἰς mọ́ lẹ́yìn ‘tẹ̀dó,’ ‘ìlú’ sì jẹ́ ìtumọ̀ tó ṣe déédé fún πόλις. Násárẹ́tì jẹ́ ìkọ̀wé orúkọ náà ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: ὅπως πληρωθῇ
  choice: kí ... lè ṣẹ
  rationale: Àkójọpọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde hàn, ó sì pa ìlànà ìmúṣẹ àsọtẹ́lẹ̀ Matteu mọ́ láìfi ìdánilójú míì kún un.
- source_word: τὸ ῥηθὲν
  choice: ohun tí a ti sọ
  rationale: Ó ṣe àfihàn participle passive náà ní Yorùbá tó mọ́gbọ́n dání; ‘ti’ tún fi hàn pé ọ̀rọ̀ náà ti wáyé ṣáájú ìmúṣẹ rẹ̀.
- source_word: διὰ τῶν προφητῶν
  choice: nípasẹ̀ àwọn wòlíì
  rationale: ‘Nípasẹ̀’ pa ìtumọ̀ àwọn wòlíì gẹ́gẹ́ bí ọ̀nà tàbí aṣojú tí a fi sọ ọ̀rọ̀ náà mọ́, bẹ́ẹ̀ ni ó pa plural ‘àwọn wòlíì’ mọ́.
- source_word: Ναζωραῖος
  choice: ará Násárẹ́tì
  rationale: Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn náà tọ́ka sí ẹni tí a so mọ́ Násárẹ́tì. Ìtumọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá, nígbà tí àfihàn orúkọ ‘Násárénì’ wà nínú àlàyé ìsàlẹ̀.
- source_word: κληθήσεται
  choice: A ó pè é
  rationale: Ó pa future passive mọ́ ní ọ̀nà Yorùbá àdánidá, ó sì yẹ fún ọ̀rọ̀ àsọtẹ́lẹ̀.
theological_decisions:
- issue: Irú ìtọ́kasí àsọtẹ́lẹ̀ tí kò ní ẹsẹ kan ṣoṣo nínú Májẹ̀mú Láéláé tó bá a mu ní ọ̀rọ̀-kí-ọ̀rọ̀
  choice: Pa ‘nípasẹ̀ àwọn wòlíì’ mọ́ ní plural, láìdá ẹsẹ náà mọ́ àsọtẹ́lẹ̀ kan pàtó.
  alternative: So ó ní pàtó mọ́ Isaiah 11:1, tàbí túmọ̀ ọ́ gẹ́gẹ́ bí àkótán ẹ̀kọ́ àwọn wòlíì nípa ìrẹ̀lẹ̀ àti ìkọ̀sílẹ̀ Mèsáyà.
  rationale: Gíríìkì sọ ‘àwọn wòlíì’ ní plural, kò sì dárúkọ ìwé tàbí wòlíì kan. Ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú yìí mọ́ dípò fífi ìtumọ̀ àfojúsùn kan sínú ọ̀rọ̀ pàtàkì.
- issue: Ìtumọ̀ Ναζωραῖος
  choice: ará Násárẹ́tì
  alternative: Násárénì; Násírì
  rationale: Àyíká ọ̀rọ̀ so ọ̀rọ̀ náà mọ́ ìlú Násárẹ́tì. ‘Násárénì’ jẹ́ àfihàn tó sún mọ́ ìrísí ọ̀rọ̀ Gíríìkì, nítorí náà a fi sí àlàyé ìsàlẹ̀. ‘Násírì’ kò yẹ, nítorí pé ó tọ́ka sí ẹ̀jẹ́ Násírì tó yàtọ̀, kì í ṣe ẹni láti Násárẹ́tì.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì lo ‘tẹ̀dó sí’ àti ‘nípasẹ̀’ láti pa ìtumọ̀ orísun mọ́ ní èdè àdánidá.
