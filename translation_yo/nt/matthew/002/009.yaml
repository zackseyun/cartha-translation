id: MAT.2.9
reference: Matthew 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ ọba tán, wọ́n bá ọ̀nà wọn lọ. Kíyèsí i! Ìràwọ̀ tí wọ́n ti rí ní ìlà-oòrùn[a] ń lọ níwájú wọn, títí ó fi dé, tí ó sì dúró lókè ibi tí ọmọ náà wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ìràwọ̀ náà ń yọ.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ìlà-oòrùn gẹ́gẹ́ bí ibi tàbí apá ayé, tàbí sí yíyọ ìràwọ̀ kan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Nígbà tí wọ́n gbọ́ ọba tán
  rationale: Àkópọ̀ yìí tú participle aorist náà sí gbólóhùn àkókò Yorùbá, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́. “Ọba” nìkan ni Gíríìkì sọ; a kò fi “Hẹ́rọ́dù” kún un.
- source_word: ἐπορεύθησαν
  choice: wọ́n bá ọ̀nà wọn lọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n tẹ̀ síwájú nínú ìrìn wọn lẹ́yìn tí wọ́n kúrò lọ́dọ̀ ọba.
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa àmì ọ̀rọ̀ tó ń pe àfiyèsí sí ìṣẹ̀lẹ̀ tuntun àti ìyanu mọ́, láìlo èdè àtijọ́ tí kò rọrùn.
- source_word: ἀστήρ
  choice: ìràwọ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún ọ̀rọ̀ náà.
- source_word: ὃν εἶδον
  choice: tí wọ́n ti rí
  rationale: “Ti rí” fi hàn pé rírí ìràwọ̀ náà ti ṣẹlẹ̀ ṣáájú ìrìn tó ń ṣáájú wọn nísinsin yìí.
- source_word: ἐν τῇ ἀνατολῇ
  choice: ní ìlà-oòrùn
  rationale: Ó pa ìtumọ̀ ibi tàbí apá ayé tó wọ́pọ̀ mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì ṣàfihàn ìtumọ̀ awòràwọ̀ tó tún ṣeé ṣe.
- source_word: προῆγεν αὐτούς
  choice: ń lọ níwájú wọn
  rationale: Ó tẹ̀lé àwòrán Gíríìkì pé ìràwọ̀ náà ń lọ níwájú wọn, láìfi ọ̀nà tí ó gbà ń darí wọn ṣe àlàyé ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: títí ó fi dé, tí ó sì dúró
  rationale: 'Ó pa ìtẹ̀lé àwọn ìṣe méjèèjì mọ́: ó kọ́kọ́ dé, lẹ́yìn náà ó dúró.'
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: lókè ibi tí ọmọ náà wà
  rationale: Ó sọ ipò ìràwọ̀ náà sí ibi tí ọmọ náà wà ní ọ̀nà Yorùbá tó ṣe kedere, tí ó sì sún mọ́ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ ἐν τῇ ἀνατολῇ nínú ìtàn ìràwọ̀ náà
  choice: ní ìlà-oòrùn
  alternative: nígbà tí ó ń yọ
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí ìlà-oòrùn gẹ́gẹ́ bí ibi tàbí sí àkókò tí ìràwọ̀ kan ń yọ. Ọ̀rọ̀ inú ẹsẹ náà kò fipá mú wa láti yanju àríyànjiyàn náà; nítorí náà, àkọ́kọ́ wà nínú ẹsẹ, èkejì sì wà nínú àlàyé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìmúnilójú ìtàn inú “ἰδοὺ” mọ́ pẹ̀lú “Sì wò ó.”
