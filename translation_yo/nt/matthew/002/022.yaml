id: MAT.2.22
reference: Matthew 2:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó gbọ́ pé Akẹ́láù ń jọba lórí Jùdíà ní ipò Hẹ́rọ́dù, baba rẹ̀, ẹ̀rù bà á láti lọ síbẹ̀. Lẹ́yìn tí a kìlọ̀[a] fún un lójú àlá, ó kúrò lọ sí àwọn agbègbè ilẹ̀ Gálílì,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí a fún un ní ìtọ́nisọ́nà”; ọ̀rọ̀ náà sábà máa ń tọ́ka sí ìkìlọ̀ tàbí ìtọ́nisọ́nà láti ọ̀dọ̀ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ó gbọ́
  rationale: Ó fi iṣẹlẹ̀ tí ó ṣáájú ìbẹ̀rù hàn ní Yorùbá àdánidá, láì sọ participle Gíríìkì di líle.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìdènà tuntun sí èrò tí a sọ ṣáájú hàn.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: ń jọba lórí Jùdíà
  rationale: ‘Jọba lórí’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ ìṣàkóso ọba àti agbègbè rẹ̀ mọ́.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: ní ipò Hẹ́rọ́dù baba rẹ̀
  rationale: Ó pa ìtumọ̀ rirọ́pò tàbí jíjẹ arọ́pò baba rẹ̀ mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: ẹ̀rù bà á láti lọ síbẹ̀
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, ó sì pa ìbẹ̀rù àti ibi tí ó fẹ́ lọ mọ́.
- source_word: χρηματισθεὶς
  choice: lẹ́yìn tí a kìlọ̀ fún un
  rationale: Ó pa irú ọ̀rọ̀ aláìlórúkọ olùṣe mọ́; kò fi ‘Ọlọ́run’ kún ibi tí Gíríìkì kò ti dárúkọ olùkìlọ̀.
- source_word: κατ’ ὄναρ
  choice: lójú àlá
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìkìlọ̀ tàbí ìtọ́nisọ́nà tí ènìyàn rí nínú àlá.
- source_word: ἀνεχώρησεν
  choice: ó sá lọ
  rationale: Nínú àyíká ewu yìí, ‘sá lọ’ fi ìkúrò pẹ̀lú ìṣọ́ra hàn dáadáa ju ‘lọ’ lásán lọ, láì sọ pé ogun ń lé e.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: sí àwọn agbègbè Gálílì
  rationale: Ó fi ọ̀pọ̀ μέρη hàn gẹ́gẹ́ bí àwọn apá tàbí agbègbè ilẹ̀ Gálílì.
theological_decisions:
- issue: Bóyá kí a dárúkọ Ọlọ́run gẹ́gẹ́ bí olùkìlọ̀ nínú χρηματισθείς
  choice: 'A pa gbólóhùn aláìlórúkọ olùṣe mọ́: ‘a kìlọ̀ fún un.’'
  alternative: ‘Ọlọ́run kìlọ̀ fún un’ tàbí ‘ó gba ìtọ́nisọ́nà láti ọ̀dọ̀ Ọlọ́run.’
  rationale: Lílo ọ̀rọ̀ náà nínú Mátíù sábà máa ń tọ́ka sí ìbánisọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run, ṣùgbọ́n Gíríìkì kò dárúkọ olùṣe níbí. Ìtumọ̀ pàtàkì pa àìsọ olùṣe yẹn mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé àfojúsùn ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn orúkọ ni a kọ sí Akeláù, Hẹ́rọ́dù, Jùdíà, àti Gálílì. Kọ́mà ìparí ni a pa mọ́ nítorí ẹsẹ náà ń bá a lọ sínú ẹsẹ 23.
