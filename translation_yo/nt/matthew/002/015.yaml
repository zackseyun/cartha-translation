id: MAT.2.15
reference: Matthew 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: yo
  text: Ó sì wà níbẹ̀ títí di ikú Hẹ́rọ́dù, kí ohun tí Olúwa sọ nípasẹ̀ wòlíì lè ṣẹ[a], pé, “Mo pe ọmọ mi jáde láti Íjíbítì.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ohun tí Olúwa ti sọ nípasẹ̀ wòlíì lè ṣẹ.”
    reason: lexical_alternative
  - marker: b
    text: Mátíù fa ọ̀rọ̀ yìí yọ láti Hóséà 11:1. Ní àyíká rẹ̀ ní Hóséà, ‘ọmọ mi’ ń tọ́ka sí Ísírẹ́lì; níbí Mátíù fi hàn pé Jésù mú Ìwé Mímọ́ yẹn ṣẹ.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: Ó sì wà níbẹ̀
  rationale: Èyí túmọ̀ ọ̀rọ̀ Gíríìkì ní tààrà gẹ́gẹ́ bí ‘ó wà níbẹ̀,’ láìfi ìtumọ̀ ‘ó dúró’ kún un.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: títí di ikú Hẹ́rọ́dù
  rationale: τελευτή níbí ń tọ́ka sí òpin ìgbésí ayé, ìyẹn ikú; ìṣètò yìí tún pa àkópọ̀ ọ̀rọ̀-orúkọ inú Gíríìkì mọ́.
- source_word: ἵνα πληρωθῇ
  choice: kí ... lè ṣẹ
  rationale: Ó pa èrò ìdí tàbí àbájáde inú ἵνα àti ohùn àìṣe ti πληρόω mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀ ní Yorùbá.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: ohun tí Olúwa sọ nípasẹ̀ wòlíì
  rationale: ‘Ohun tí ... sọ’ jẹ́ Yorùbá àdánidá fún articular passive participle; ‘Olúwa’ ni orísun ọ̀rọ̀, ‘nípasẹ̀ wòlíì’ sì fi wòlíì hàn gẹ́gẹ́ bí aṣojú tí a lò.
- source_word: λέγοντος
  choice: pé
  rationale: ‘Pé’ ni ọ̀nà Yorùbá tó ṣe déédé jù láti ṣàgbékalẹ̀ ọ̀rọ̀ àyọlò, dípò títúmọ̀ participle náà ní líle gẹ́gẹ́ bí ‘ní sísọ pé.’
- source_word: Ἐξ Αἰγύπτου ἐκάλεσα
  choice: Mo pe ... jáde láti Íjíbítì
  rationale: ‘Pe’ pa ìtumọ̀ καλέω mọ́; ‘jáde láti’ mú agbára ἐξ hàn, ìyẹn ìpè láti inú ilẹ̀ náà jáde.
- source_word: τὸν υἱόν μου
  choice: ọmọ mi
  rationale: Ní Yorùbá, ‘ọmọ mi’ ni gbólóhùn àdánidá fún ọmọkùnrin ẹni nínú àyíká yìí; ó pa ìbátan ọmọ-sí-baba mọ́ láìfi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìmúṣẹ Hóséà 11:1 nínú àyọlò Mátíù
  choice: A pa gbólóhùn ‘kí ... lè ṣẹ’ mọ́ láìṣàlàyé irú ìmúṣẹ náà nínú ẹsẹ̀.
  alternative: Kí a túmọ̀ ọ́ bí àsọtẹ́lẹ̀ tààrà nìkan, tàbí kí a sọ ní kedere pé Jésù ń tún ìrírí Ísírẹ́lì ṣe.
  rationale: Mátíù sọ pé Ìwé Mímọ́ ṣẹ, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò fi ẹ̀kọ́ pàtó kan lélẹ̀ nípa bí ìmúṣẹ náà ṣe ń ṣiṣẹ́. Ìtumọ̀ náà pa ìfọkànsìn àti ìforígbárí ẹ̀kọ́ inú ọ̀rọ̀ mọ́.
- issue: κύριος nínú gbólóhùn ìmúṣẹ
  choice: Olúwa
  alternative: OLÚWA
  rationale: Gíríìkì ní κυρίου; ‘Olúwa’ túmọ̀ rẹ̀ láìfi àmì pàtàkì orúkọ Ọlọ́run tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. ‘Ó sì’ so ẹsẹ̀ mọ́ ìtàn tó ṣáájú; ‘pé’ ṣàgbékalẹ̀ àyọlò ní ọ̀nà Yorùbá àdánidá. A lo àmì ohùn níbi tó bá bójú mu, pẹ̀lú àwọn orúkọ Hẹ́rọ́dù àti Íjíbítì.
