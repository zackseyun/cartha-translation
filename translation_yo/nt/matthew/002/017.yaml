  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: yo
  text: Nígbà náà ni ohun tí a ti sọ nípasẹ̀ Jeremáyà wòlíì ṣẹ̀, pé:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣẹ̀, ní sísọ pé:”
    reason: Ó tọ́ka sí ìtumọ̀ tí ó tẹ̀lé ìrísí participle λέγοντος pẹ̀lú “ní sísọ,” bí ó tilẹ̀ jẹ́ pé “pé” nìkan ló rọrùn sí i ní Yorùbá.
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú àkókò nínú ìtàn hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐπληρώθη
  choice: ṣẹ̀
  rationale: Ọ̀rọ̀ yìí pa èdè ìmúṣẹ àsọtẹ́lẹ̀ ti Mátíù mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí ó wá sí ìmúṣẹ.
- source_word: τὸ ῥηθὲν
  choice: ohun tí a ti sọ
  rationale: Ó ṣe àfihàn participle olórúkọ náà gẹ́gẹ́ bí ohun tí a ti sọ tẹ́lẹ̀.
- source_word: διὰ Ἰερεμίου
  choice: nípasẹ̀ Jeremáyà
  rationale: Ó pa ìtumọ̀ διά pẹ̀lú genitive mọ́, Jeremáyà sì farahàn gẹ́gẹ́ bí ẹni tí a fi ọ̀rọ̀ náà sọ.
- source_word: τοῦ προφήτου
  choice: wòlíì
  rationale: Ó dá ipa Jeremáyà gẹ́gẹ́ bí wòlíì mọ̀ ní èdè Yorùbá ṣókí àti àdánidá.
- source_word: λέγοντος
  choice: 'pé:'
  rationale: Nínú Yorùbá, “pé” ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ àyọlò tó tẹ̀ lé; ó yẹra fún gbólóhùn tí kò rọrùn bí “ní sísọ pé.”
theological_decisions:
- issue: Èdè ìmúṣẹ àsọtẹ́lẹ̀ ti Mátíù
  choice: Pa ìmúṣẹ mọ́ ní kedere pẹ̀lú “ṣẹ̀”
  alternative: ṣẹlẹ̀ láti mú ... ṣẹ
  rationale: Gíríìkì sọ pé ohun tí a ti sọ ni ó ṣẹ̀; a kò fi èrò ìdí tàbí ète kún un.
- issue: Ẹni tí λέγοντος ń tọ́ka sí
  choice: Lo “pé:” gẹ́gẹ́ bí aṣáájú ọ̀rọ̀ àyọlò
  alternative: ní sísọ pé
  rationale: λέγοντος bá “Jeremáyà wòlíì” mu ní ìlànà gíríìkì, ṣùgbọ́n “pé:” ń gbé iṣẹ́ rẹ̀ jáde ní Yorùbá láìdá ẹni tó ń sọ̀rọ̀ láàmú.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá; a lo àmì ohùn ní kíkún. “Nípasẹ̀” dá ìtumọ̀ aṣojú/irinṣẹ́ mọ́, “wòlíì” sì jẹ́ ọ̀rọ̀ Bíbélì tí gbogbo ènìyàn mọ̀.
