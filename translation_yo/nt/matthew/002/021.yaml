id: MAT.2.21
reference: Matthew 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: yo
  text: Ó sì dìde, ó mú ọmọ náà àti ìyá rẹ̀, ó sì wọ ilẹ̀ Ísírẹ́lì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ ìtàn náà síwájú, kò sì fi ìtakora líle hàn; “sì” jẹ́ àsopọ̀ ìtàn tí ó bá èdè Yorùbá mu.
- source_word: ἐγερθεὶς
  choice: dìde
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó dìde láti ṣe ohun tí a pàṣẹ; fífi ọ̀rọ̀-ìṣe tẹ̀lé ara wọn jẹ́ ọ̀nà àdánidá ní Yorùbá fún ìṣe tí ó ṣẹlẹ̀ ní tẹ̀lé-tẹ̀lé.
- source_word: παρέλαβε
  choice: mú
  rationale: Ní àyíká yìí, παραλαμβάνω túmọ̀ sí mímú àwọn ènìyàn lọ pẹ̀lú ara ẹni; “mú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò fi èrò míì kún un.
- source_word: τὸ παιδίον
  choice: ọmọ náà
  rationale: παιδίον ń tọ́ka sí ọmọ; “ọmọ náà” pa àfihàn pàtó tí àpilẹ̀kọ Gíríìkì náà ní mọ́.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ìyá rẹ̀
  rationale: αὐτοῦ tọ́ka sí ọmọ náà lọ́nà àdánidá; “ìyá rẹ̀” jẹ́ gbolohun Yorùbá tó rọrùn tí ó sì pa ìbáṣepọ̀ náà mọ́.
- source_word: εἰσῆλθεν
  choice: wọ
  rationale: εἰσέρχομαι túmọ̀ sí wíwọ inú ibi kan; “wọ” jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì bójú mu pẹ̀lú “ilẹ̀ Ísírẹ́lì.”
- source_word: εἰς γῆν Ἰσραήλ
  choice: ilẹ̀ Ísírẹ́lì
  rationale: Gbolohun náà ń tọ́ka sí agbègbè tàbí ilẹ̀ orílẹ̀-èdè Ísírẹ́lì; “ilẹ̀ Ísírẹ́lì” pa ìtumọ̀ àgbègbè àti ti orílẹ̀-èdè mọ́ láìṣe àlàyé ju orísun lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere ni a lò. Àtẹ̀jáde náà pa bí àwọn ìṣe ṣe tẹ̀ lé ara wọn mọ́, ó sì yẹra fún fífi akọ́lé tàbí àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú Gíríìkì kún un.
