id: MAT.2.8
reference: Matthew 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: yo
  text: Lẹ́yìn tí ó rán wọn lọ sí Bẹ́tílẹ́hẹ́mù, ó ní, “Ẹ lọ, kí ẹ sì wádìí dáadáa nípa ọmọ náà. Nígbà tí ẹ bá rí i, ẹ ròyìn fún mi, kí èmi náà lè wá tẹrí ba fún un[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jọ́sìn fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí títẹrí ba fún ẹni kan gẹ́gẹ́ bí ìfihàn ọlá fún ọba, tàbí sí jíjọ́sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: Ó sì rán wọn lọ
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì εἶπεν; Yorùbá àdánidá lè fi ìtẹ̀lé ìṣe hàn pẹ̀lú ‘ó sì rán wọn lọ ... ó ní,’ láì lo gbólóhùn líle bí ‘lẹ́yìn tí ó rán wọn.’
- source_word: Πορευθέντες
  choice: Ẹ lọ
  rationale: Participle yìí ń ṣiṣẹ́ pẹ̀lú agbára àṣẹ ní ìbámu pẹ̀lú ἐξετάσατε; ‘Ẹ lọ’ jẹ́ àṣẹ tó ṣe kedere, tó sì bá Yorùbá mu.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: kí ẹ sì fara balẹ̀ wádìí
  rationale: Àpapọ̀ ọ̀rọ̀-ìṣe àti adverb náà túmọ̀ sí ìwádìí tó péye, tó sì ṣọ́ra. ‘Fara balẹ̀ wádìí’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: περὶ τοῦ παιδίου
  choice: nípa ọmọ náà
  rationale: περί tọ́ka sí ohun tí ìwádìí náà dá lé. ‘Nípa ọmọ náà’ pa ìtumọ̀ gírámà mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: παιδίου
  choice: ọmọ
  rationale: παιδίον túmọ̀ sí ọmọ; kò pọndandan láti fi ‘kékeré’ kún un nínú ẹsẹ yìí.
- source_word: ἐπὰν δὲ εὕρητε
  choice: Nígbà tí ẹ bá rí i
  rationale: ἐπάν pẹ̀lú subjunctive ń fi ohun tó lè ṣẹlẹ̀ hàn tí a ń retí. ‘Nígbà tí ... bá’ pa àìdánilójú tó wà nínú èdè orísun mọ́ láì sọ ọ́ di ìdánilójú pátápátá.
- source_word: ἀπαγγείλατέ μοι
  choice: ẹ padà wá ròyìn fún mi
  rationale: ἀπαγγέλλω ní ìmọ̀lára mímú ìròyìn padà wá. ‘Padà wá ròyìn fún mi’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: ὅπως
  choice: kí
  rationale: Nínú ọ̀rọ̀ yìí, ‘kí’ ń ṣàfihàn ète, gẹ́gẹ́ bí ὅπως.
- source_word: κἀγὼ
  choice: èmi náà
  rationale: κἀγώ tẹnumọ́ pé Hẹ́rọ́dù ń sọ pé òun pẹ̀lú ní ète kan náà; ‘èmi náà’ mú ìtẹnumọ́ yẹn hàn.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: lè lọ foríbalẹ̀ fún un
  rationale: Participle àti subjunctive náà di ìṣe méjì tó ń tẹ̀ lé ara wọn ní Yorùbá. ‘Foríbalẹ̀ fún un’ pa ààyè ìtumọ̀ προσκυνέω mọ́ láàárín ọ̀wọ̀ fún ọba àti ìjọsìn.
theological_decisions:
- issue: Ìtumọ̀ προσκυνήσω αὐτῷ ní ti ọmọ náà
  choice: foríbalẹ̀ fún un
  alternative: jọ́sìn fún un
  rationale: προσκυνέω lè túmọ̀ sí fíforíbalẹ̀ tàbí fífi ọlá fún ẹni ọba, ó sì tún lè túmọ̀ sí ìjọsìn. Nítorí ọ̀rọ̀ Hẹ́rọ́dù níbí jẹ́ ohun tí ó sọ pé òun fẹ́ ṣe sí ẹni tí a bí gẹ́gẹ́ bí ọba, ‘foríbalẹ̀ fún un’ dáàbò bo àìdánilójú lexical náà; àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ ‘jọ́sìn’ náà hàn.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ’ nítorí Hẹ́rọ́dù ń bá àwọn amòye náà sọ̀rọ̀. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó ti yẹ; orúkọ Bẹ́tílẹ́hẹ́mù ni a ṣe àkọsílẹ̀ gẹ́gẹ́ bí ìkọ̀wé Yorùbá.
