    text: Tàbí, “ó dàrú” tàbí “ó ní ìdààmú.”
    reason: lexical_alternative
  - marker: b
    text: “Gbogbo Jerúsálẹ́mù” lo orúkọ ìlú fún àwọn olùgbé rẹ̀; ó lè jẹ́ ọ̀nà gbígbòòrò tàbí àsọdùn láti ṣàpèjúwe ìdààmú tí ó tàn ká ìlú náà.
    reason: alternative_reading
  revision_rationale: The revision restores a single, natural Yoruba predicate for the two coordinated subjects, corresponding to Greek ἐταράχθη. It avoids adding 'heart' and avoids making Jerusalem itself appear mentally confused, while preserving the metonymic wording 'gbogbo Jerúsálẹ́mù' and its stated interpretive breadth in the footnote.
