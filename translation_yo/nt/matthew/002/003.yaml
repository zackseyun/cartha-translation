id: MAT.2.3
reference: Matthew 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: yo
  text: Nígbà tí Ọba Hẹ́rọ́dù gbọ́ èyí, ó dààmú[a], gbogbo Jerúsálẹ́mù sì dààmú pẹ̀lú rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dàrú” tàbí “ó ní ìdààmú.”
    reason: lexical_alternative
  - marker: b
    text: “Gbogbo Jerúsálẹ́mù” lo orúkọ ìlú fún àwọn olùgbé rẹ̀; ó lè jẹ́ ọ̀nà gbígbòòrò tàbí àsọdùn láti ṣàpèjúwe ìdààmú tí ó tàn ká ìlú náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Nígbà tí ... gbọ́ èyí
  rationale: Aorist participle náà ń ṣiṣẹ́ gẹ́gẹ́ bí gbólóhùn àkókò. “Gbọ́ èyí” jẹ́ èdè Yorùbá àdánidá, ó sì mú ohun tí a kò sọ ní tààrà—ìròyìn àwọn amòye láti ìlà-oòrùn—wá láti àyíká ọ̀rọ̀.
- source_word: δὲ
  choice: Nígbà tí ...; ... sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀. Ìtumọ̀ rẹ̀ wà nínú ìṣètò gbólóhùn àkókò àti “sì,” láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Ọba Hẹ́rọ́dù
  rationale: Èyí ni ìtòlẹ́sẹẹsẹ orúkọ oyè àti orúkọ ẹni tí ó bá Yorùbá òde òní mu, ó sì pa ipò βασιλεύς mọ́.
- source_word: ἐταράχθη
  choice: ọkàn rẹ̀ dàrú
  rationale: Ẹ̀rọ-ọ̀rọ̀ náà túmọ̀ sí pé ìdàrúdàpọ̀ tàbí ìdágìrì ọkàn dé bá a. Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, kò sì pinnu bí ìdààmú náà ti le tó ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: gbogbo Jerúsálẹ́mù
  rationale: A pa àpèjúwe ìlú fún àwọn olùgbé rẹ̀ mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì, dípò fífi “àwọn ènìyàn” tàbí “àwọn olórí” kún ọ̀rọ̀ pàtàkì.
- source_word: μετ’ αὐτοῦ
  choice: pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ tààrà tí ó sì bá Yorùbá mu; ó so ìdàrúdàpọ̀ Jerúsálẹ́mù mọ́ ti Hẹ́rọ́dù.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ πᾶσα Ἱεροσόλυμα
  choice: A tọ́ka sí ìlú náà lápapọ̀, ní lílo orúkọ ìlú fún àwọn olùgbé rẹ̀.
  alternative: Ó lè jẹ́ àsọdùn fún ọ̀pọ̀ ènìyàn ní Jerúsálẹ́mù, tàbí kó túmọ̀ sí àwọn olórí ìlú náà ní pàtàkì.
  rationale: Gíríìkì sọ orúkọ ìlú náà lápapọ̀. Ìtumọ̀ náà pa èdè yìí àti ìfòyemọ̀ inú ìtàn mọ́, kò sì dín ọ̀rọ̀ náà kù sí ẹgbẹ́ kan tí ẹsẹ̀ náà kò dárúkọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé lasán; a pa àpèjúwe Gíríìkì àti àìdánilójú ìwọ̀n “gbogbo Jerúsálẹ́mù” mọ́.
