revisions:
- from: Nígbà tí Ọba Hẹ́rọ́dù gbọ́ èyí, ọkàn rẹ̀ dàrú[a], gbogbo Jerúsálẹ́mù sì dàrú pẹ̀lú rẹ̀.[b]
  to: Nígbà tí Ọba Hẹ́rọ́dù gbọ́ èyí, ó dààmú[a], gbogbo Jerúsálẹ́mù sì dààmú pẹ̀lú rẹ̀.[b]
  rationale: The revision restores a single, natural Yoruba predicate for the two coordinated subjects, corresponding to Greek ἐταράχθη. It avoids adding 'heart' and avoids making Jerusalem itself appear mentally confused, while preserving the metonymic wording 'gbogbo Jerúsálẹ́mù' and its stated interpretive breadth in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:23Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal clause, royal title, proper name, corporate reference to Jerusalem, and association with Herod are retained. However, the Greek has one predicate, ἐταράχθη ('was troubled/alarmed'), governing both Herod and Jerusalem. The draft's 'ọkàn rẹ̀ dàrú' adds 'his heart' for Herod and then applies the same heart-specific idiom to the city, which is not a suitable preservation of the Greek's parallel construction.
  naturalness: '''Ọkàn rẹ̀ dàrú'' is natural for an individual, but ''gbogbo Jerúsálẹ́mù sì dàrú'' is less natural and shifts the city-wide reaction toward confusion. ''Ó dààmú ... gbogbo Jerúsálẹ́mù sì dààmú'' is idiomatic, clear, and works naturally both for Herod and for the city-name used corporately.'
  terminology: Ọba Hẹ́rọ́dù and Jerúsálẹ́mù are retained. 'Dààmú' adequately conveys the inner disturbance/alarm of ἐταράχθη without specifying fear, panic, or a particular cause.
  issues:
  - severity: medium
    issue: The main text uses a heart-specific expression for Herod and repeats its verbal element for Jerusalem.
    rationale: The source employs the same passive verb for both subjects and does not mention Herod's heart. The resulting city predicate is awkward in Yoruba and weakens the source's deliberately parallel formulation.
  - severity: low
    issue: Footnote a's alternatives are tied to the added expression 'ọkàn rẹ̀' rather than directly to the source verb.
    rationale: Once the main predicate is made source-aligned, the lexical alternatives should describe equivalent renderings of being troubled or disturbed, not add an explicit 'heart'.
  revised_text: Nígbà tí Ọba Hẹ́rọ́dù gbọ́ èyí, ó dààmú[a], gbogbo Jerúsálẹ́mù sì dààmú pẹ̀lú rẹ̀.[b]
  revised_footnotes:
