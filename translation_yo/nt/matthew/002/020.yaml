id: MAT.2.20
reference: Matthew 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: yo
  text: ó ní, “Dìde, mú ọmọ náà àti ìyá ọmọ náà, kí o sì lọ sí ilẹ̀ Ísírẹ́lì, nítorí àwọn tí ń wá láti pa ọmọ náà ti kú[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà sí i: “àwọn tí ń wá ìwàláàyè ọmọ náà ti kú.”'
    reason: Ó fi ìṣètò ọ̀rọ̀ Gíríìkì hàn ní tààrà sí i; ìtumọ̀ inú ẹsẹ̀ náà sì ń sọ ète ikú tí idiomu náà ní nínú àyíká yìí ní kedere.
lexical_decisions:
- source_word: λέγων
  choice: ó ní
  rationale: Ọ̀rọ̀ yìí jẹ́ participle tó ń so ọ̀rọ̀ áńgẹ́lì mọ́ ohun tó ṣẹlẹ̀ nínú ẹsẹ tó ṣáájú. “Ó ní” jẹ́ ọ̀nà àdánidá ní Yorùbá láti bẹ̀rẹ̀ ọ̀rọ̀ ẹni kan láì sọ ìsopọ̀ náà di líle.
- source_word: Ἐγερθείς
  choice: Dìde
  rationale: Bí ó tilẹ̀ jẹ́ participle aorist passive ní Gíríìkì, ó ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ nínú ọ̀rọ̀ yìí; “Dìde” sọ agbára àṣẹ náà jáde lọ́nà àdánidá.
- source_word: παράλαβε
  choice: mú
  rationale: Níbí, παραλαμβάνω túmọ̀ sí kí Jóṣẹ́fù mú wọn lọ pẹ̀lú ara rẹ̀; “mú” ṣe kedere, ó sì bá èdè Yorùbá mu.
- source_word: τὸ παιδίον
  choice: ọmọ náà
  rationale: παιδίον túmọ̀ sí ọmọ; kò pọn dandan láti fi ìtumọ̀ míì kún un bí “ọmọ kékeré.”
- source_word: τὴν μητέρα αὐτοῦ
  choice: ìyá rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí ọmọ náà; “ìyá rẹ̀” jẹ́ ìtumọ̀ tó péye, tó sì rọrùn.
- source_word: πορεύου
  choice: lọ
  rationale: Àṣẹ yìí túmọ̀ sí láti lọ tàbí bẹ̀rẹ̀ ìrìn-àjò; “lọ” ni ọ̀rọ̀ Yorùbá tó ṣe tààrà jù lọ ní àyíká yìí.
- source_word: εἰς γῆν Ἰσραήλ
  choice: sí ilẹ̀ Ísírẹ́lì
  rationale: “Ilẹ̀ Ísírẹ́lì” pa ìtumọ̀ γῆ mọ́ gẹ́gẹ́ bí agbègbè tàbí ilẹ̀ náà, dípò kí a sọ orúkọ orílẹ̀-èdè nìkan.
- source_word: τεθνήκασιν
  choice: ti kú
  rationale: Perfect tense náà tọ́ka sí ikú tó ti ṣẹlẹ̀, tí ipò rẹ̀ sì dúró títí di ìsinsìnyí. “Ti kú” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ èyí.
- source_word: οἱ ζητοῦντες
  choice: àwọn tí ń wá
  rationale: Èyí pa àwòrán ìwá kiri tàbí ìlépa inú participle náà mọ́ láì fi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: láti gba ẹ̀mí ọmọ náà
  rationale: Nínú àyíká ewu ikú yìí, ψυχή túmọ̀ sí ẹ̀mí ní ìtumọ̀ ìwàláàyè, kì í ṣe ọkàn aláìrí. Fífi “láti gba” kún un mú ète láti pa ọmọ náà yé kedere ní Yorùbá, láì yí ìtumọ̀ ọ̀rọ̀ náà padà.
theological_decisions:
- issue: Ìtumọ̀ ψυχή níbi tí wọ́n ti ń halẹ̀ mọ́ ìwàláàyè ọmọ náà
  choice: ẹ̀mí, ní ìtumọ̀ ìwàláàyè tí wọ́n fẹ́ gbà
  alternative: ọkàn
  rationale: Àkójọpọ̀ ọ̀rọ̀ “wá ψυχή” ní àyíká ìtàn yìí túmọ̀ sí wíwá láti pa ẹni náà. “Ọkàn” lè mú ẹ̀kọ́ nípa apá aláìrí ènìyàn wọ inú ẹsẹ náà, èyí tí kì í ṣe ohun tí àyíká ọ̀rọ̀ ń sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì, ó rọrùn fún òǹkàwé òde òní, ó sì pa ìsopọ̀ ẹsẹ yìí mọ́ pẹ̀lú ẹsẹ tó ṣáájú.
