id: MAT.2.1
reference: Matthew 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: yo
  text: Lẹ́yìn tí a bí Jésù ní Bẹ́tílẹ́hẹ́mù ní Jùdíà, ní àwọn ọjọ́ Hẹ́rọ́dù ọba, wò ó, àwọn amòye[a] láti ìlà-oòrùn dé sí Jerúsálẹ́mù,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn mágì.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ọkùnrin onímọ̀ láti ìlà-oòrùn; ó ṣeé ṣe kí wọ́n ní ìbáṣepọ̀ pẹ̀lú ìmọ̀ ìràwọ̀ tàbí ọgbọ́n ààfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Lẹ́yìn tí a bí Jésù
  rationale: Ẹgbẹ́-ọ̀rọ̀ genitive absolute yìí fi ìbí Jésù ṣe ìṣẹ̀lẹ̀ abẹ́lẹ̀ tí ó ṣáájú ìṣe pàtàkì náà. “Lẹ́yìn tí a bí Jésù” sọ ìbáṣepọ̀ àkókò náà ní Yorùbá àdánidá, láìfi ọ̀rọ̀ bí “nísinsin yìí” kún δέ.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: ní Bẹ́tílẹ́hẹ́mù ní Jùdíà
  rationale: A ṣe àfọwọ́kọ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìlò Yorùbá; “ní Jùdíà” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti dá Bẹ́tílẹ́hẹ́mù yìí mọ̀.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: ní ọjọ́ Hẹ́rọ́dù ọba
  rationale: Ìtumọ̀ yìí pa àwòrán ìpilẹ̀ṣẹ̀ “ní ọjọ́” mọ́, ó sì fi Hẹ́rọ́dù àti ipò rẹ̀ gẹ́gẹ́ bí ọba hàn láìṣàlàyé rékọjá ohun tí Gíríìkì sọ.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: “Kíyèsí i” jẹ́ àmì àsọyé tó pe àfiyèsí sí ìṣẹ̀lẹ̀ tó tẹ̀ lé e, ó sì pa agbára ἰδού mọ́ ní èdè Yorùbá tó lóye.
- source_word: μάγοι
  choice: àwọn amòye
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn onímọ̀ láti Ìlà Oòrùn, tí ó ṣeé ṣe kí iṣẹ́ wọn ní ìbáṣepọ̀ pẹ̀lú ìmọ̀ ìràwọ̀ tàbí ọgbọ́n ààfin. “Àwọn amòye” rọrùn fún òǹkàwé, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀rọ̀ oníṣẹ́ náà mọ́.
- source_word: ἀπὸ ἀνατολῶν
  choice: láti ìlà-oòrùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìtumọ̀ “láti àwọn agbègbè ìlà-oòrùn,” láìsọ ibi pàtó tí ọ̀rọ̀ Gíríìkì kò sọ.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: dé sí Jerúsálẹ́mù
  rationale: “Dé sí” sọ ìrìn-àjò àti dídé sí ibi tí a ń lọ ní kedere, ó sì bá ìlò Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ μάγοι láìkó àṣà ìtàn tó wá lẹ́yìn sínú ẹsẹ̀ náà
  choice: àwọn amòye
  alternative: àwọn mágì
  rationale: A kò pè wọ́n ní ọba, a kò sọ iye wọn, bẹ́ẹ̀ ni a kò fi kúlẹ̀kúlẹ̀ tí ẹsẹ̀ náà kò ní kún un. Àlàyé ìsàlẹ̀ ojú ìwé fi ìtumọ̀ oníṣẹ́ àti ààyè àìdánilójú ọ̀rọ̀ náà hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn níbi tó yẹ; a sì pa “kíyèsí i” mọ́ gẹ́gẹ́ bí àmì àsọyé tó ní agbára. A gbé àmì [a] lẹ́gbẹ̀ẹ́ “àwọn amòye,” nítorí ibẹ̀ ni àlàyé náà ń tọ́ka sí.
