  naturalness: Ọ̀rọ̀ náà dára, ó sì ní ìyì. “Ẹni tí ó kéré jù lọ” jẹ́ ọ̀nà tí a lè fi gba ìsọni ẹni sí Bẹ́tílẹ́hẹ́mù nínú àyọlò náà, ṣùgbọ́n a ṣe àtúnṣe kékeré sí ọ̀rọ̀ iṣẹ́ olùṣọ́ àgùntàn láti mú un rọrùn, láì fi ìtumọ̀ àtúnlò kún un.
  terminology: “Ilẹ̀ Júdà,” “àwọn alákòóso Júdà,” àti “alákòóso kan” ń tẹ̀ lé ọ̀rọ̀ Gíríìkì náà ní òtítọ́. “Ṣe olùṣọ́ àgùntàn” pa àwòrán olùṣọ́ mọ́; àlàyé ìsàlẹ̀ sì tọ́ka níwọ̀ntúnwọ̀nsì sí ìtumọ̀ ìṣàkóso tí ποιμαίνω lè ní.
