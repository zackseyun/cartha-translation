id: MAT.2.6
reference: Matthew 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: yo
  text: '“Ìwọ náà, Bẹ́tílẹ́hẹ́mù, ilẹ̀ Júdà,


    kì í ṣe ẹni tí ó kéré jù lọ rárá


    láàárín àwọn alákòóso Júdà;


    nítorí láti inú rẹ ni alákòóso kan yóò wá[a],


    ẹni tí yóò ṣe olùṣọ́ àgùntàn[b]


    fún àwọn ènìyàn mi, Ísírẹ́lì.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “yóò jáde wá”; ní ọ̀rọ̀ gangan, “yóò jáde.”
    reason: lexical_alternative
  - marker: b
    text: “Ṣe olùṣọ́ àgùntàn” tún lè ní ìtumọ̀ “ṣàkóso,” nítorí náà ó so àwòrán ìtọ́jú agbo pọ̀ mọ́ ti ìṣàkóso ọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: ilẹ̀
  rationale: Nínú àfikún sí Bẹ́tílẹ́hẹ́mù, ọ̀rọ̀ náà ń tọ́ka sí agbègbè Júdà, kì í ṣe erùpẹ̀ tàbí ayé lápapọ̀.
- source_word: οὐδαμῶς
  choice: kì í ṣe ... rárá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ìkọ̀sílẹ̀ tí ó lágbára hàn, bí adverb Gíríìkì náà ṣe rí.
- source_word: ἐλαχίστη
  choice: ẹni tí ó kéré jù lọ
  rationale: Ó sọ nípa ipò tàbí pàtàkì, kì í ṣe ìwọ̀n ara nìkan; fífi Bẹ́tílẹ́hẹ́mù hàn bí ẹni jẹ́ ohun tí àpèjúwe inú ẹsẹ náà fàyè gbà.
- source_word: ἡγεμόσιν
  choice: àwọn alákòóso
  rationale: Ó pa ìtumọ̀ ìṣàkóso mọ́ láì fi ipò ìjọba pàtó kan kún un.
- source_word: ἐξελεύσεται
  choice: yóò ti wá
  rationale: Pẹ̀lú ‘láti inú rẹ,’ èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà yóò farahàn láti Bẹ́tílẹ́hẹ́mù; ìtumọ̀ gangan pé ‘jáde’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἡγούμενος
  choice: alákòóso kan
  rationale: Participle tí a lò bí orúkọ yìí ń sọ iṣẹ́ ẹni tí ń darí tàbí ṣàkóso; ‘alákòóso’ pa àwòrán ọba mọ́.
- source_word: ποιμανεῖ
  choice: yóò máa ṣe olùṣọ́ àgùntàn
  rationale: Ó pa àwòrán iṣẹ́ olùṣọ́ àgùntàn mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ó tún lè ní ìtumọ̀ ìṣàkóso.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: àwọn ènìyàn mi, Ísírẹ́lì
  rationale: Èyí pa gbólóhùn májẹ̀mú náà àti ìbáṣepọ̀ apposition Ísírẹ́lì mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ọba àti ti olùṣọ́ àgùntàn nínú àpèjúwe ẹni tí ń bọ̀
  choice: Lo ‘alákòóso kan’ fún ἡγούμενος, kí a sì lo ‘yóò máa ṣe olùṣọ́ àgùntàn’ fún ποιμανεῖ.
  alternative: Láti túmọ̀ méjèèjì pẹ̀lú èdè ìṣàkóso nìkan, tàbí pẹ̀lú èdè iṣẹ́ olùṣọ́ àgùntàn nìkan.
  rationale: Ẹsẹ náà so ìṣàkóso àti iṣẹ́ olùṣọ́ àgùntàn pọ̀. Pípa àwòrán méjèèjì mọ́ kò jẹ́ kí ìtumọ̀ ọrọ̀ náà dín kù sí ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìlà ewì ń tẹ̀ lé ìṣètò ọ̀rọ̀ àyọlò náà, ó sì jẹ́ kí ìtẹnumọ́ ‘rárá’ àti ìyàtọ̀ láàárín kékeré àti alákòóso hàn gbangba.
