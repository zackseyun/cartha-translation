  rationale: Àtúnṣe náà yọ àsọyé aspect tí kò hàn nínú Gíríìkì kúrò nínú “yóò máa ṣe,” ó sì mú ìtumọ̀ ἐξελεύσεται rọrùn sí i ní Yorùbá nípasẹ̀ yíyọ “ti” kúrò. Ó pa ìtẹnumọ́, ìsọni ẹni nínú àyọlò, ìṣàkóso, àti àwòrán olùṣọ́ àgùntàn mọ́.
