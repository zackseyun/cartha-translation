id: MAT.2.14
reference: Matthew 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: yo
  text: Ó sì dìde, ó mú ọmọ náà àti ìyá rẹ̀, ó sì lọ ní òru sí Ejibiti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì kúrò lọ sí Ejibiti.”
    reason: “Lọ sí” àti “kúrò lọ sí” lè ṣàfihàn ìlọ sí ibi àfojúsùn tí εἰς Αἴγυπτον ń sọ; “kúrò lọ” tún pa agbára ἀνεχώρησεν mọ́.
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ onírẹ̀lẹ̀ ni δέ níbí, tó ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti so àwọn ìṣẹ̀lẹ̀ náà pọ̀ ní Yorùbá.
- source_word: ἐγερθεὶς
  choice: dìde
  rationale: Ọ̀rọ̀ alábápín aorist yìí fi hàn pé lẹ́sẹ̀kẹsẹ̀ ni Jósẹ́fù gbé ìgbésẹ̀; “dìde” dára, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
- source_word: παρέλαβε
  choice: mú ... lọ
  rationale: Ní àyíká ọ̀rọ̀ yìí, παραλαμβάνω túmọ̀ sí mímú àwọn ènìyàn bá ara ẹni lọ, kì í ṣe gbígbà wọ́n lásán.
- source_word: τὸ παιδίον
  choice: ọmọ náà
  rationale: παιδίον tọ́ka sí ọmọ; “ọmọ náà” mú ìtumọ̀ pàtó inú àyíká ọ̀rọ̀ jáde láìfi ìtẹnumọ́ mìíràn kún un.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ìyá rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí ọmọ náà; “ìyá rẹ̀” pa ìbáṣepọ̀ yẹn mọ́ lọ́nà àdánidá.
- source_word: νυκτὸς
  choice: ní òru
  rationale: Genitive ti àkókò yìí sọ pé ní àkókò òru ni ìgbésẹ̀ náà ṣẹlẹ̀; “ní òru” ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: ἀνεχώρησεν
  choice: kúrò lọ
  rationale: ἀναχωρέω lè túmọ̀ sí kíkúrò tàbí fífàsẹ́yìn; “kúrò lọ” fi ìlọkúrò sí ibòmíràn hàn láìṣàlàyé ìdí rẹ̀ ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: εἰς Αἴγυπτον
  choice: sí Ejibiti
  rationale: εἰς fi ìrìn sí ibi àfojúsùn hàn; “sí Ejibiti” ni ìtumọ̀ tó ṣe tààrà ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tó yẹ, a sì pa tẹ̀lé-tẹ̀lé ìṣe inú Gíríìkì mọ́.
