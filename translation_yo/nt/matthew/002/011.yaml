id: MAT.2.11
reference: Matthew 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: yo
  text: 'Nígbà tí wọ́n wọ inú ilé náà, wọ́n rí ọmọ náà pẹ̀lú Màríà ìyá rẹ̀. Wọ́n tẹrí ba níwájú rẹ̀[a]. Nígbà tí wọ́n ṣí ìṣúra wọn, wọ́n fi àwọn ẹ̀bùn fún un: wúrà, tùràrí, àti òjíá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n jọ́sìn fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìjọsìn tàbí tẹríba/fífi ọ̀wọ̀ ọlọ́lá hàn, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: ilé
  rationale: “Ilé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ilé gbígbé, ó sì pa ibi pàtó tí Gíríìkì sọ mọ́ láìfi àlàyé mìíràn kún un.
- source_word: παιδίον
  choice: ọmọ
  rationale: “Ọmọ” jẹ́ ọ̀rọ̀ àdánidá tí kò fi ọjọ́ orí tàbí ìbálòpọ̀ kún ohun tí παιδίον sọ.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: pẹ̀lú Màríà ìyá rẹ̀
  rationale: Ó fi ìbáṣepọ̀ μετά àti ìdánimọ̀ Màríà gẹ́gẹ́ bí ìyá ọmọ náà hàn ní Yorùbá tó rọrùn.
- source_word: πεσόντες
  choice: wọ́n dojú bolẹ̀
  rationale: Gbólóhùn yìí fi ìfarabalẹ̀ ara wọn sílẹ̀ níwájú ọmọ náà hàn ní ọ̀nà àdánidá, láìdín un kù sí kíkàn tẹrí ba.
- source_word: προσεκύνησαν
  choice: wọ́n fi ọ̀wọ̀ jíjinlẹ̀ fún un
  rationale: Yíyan yìí pa ìtumọ̀ ìbọ̀wọ̀ ọlọ́lá mọ́, láìpinnu ní pàtó pé ọ̀rọ̀ náà túmọ̀ sí ìjọsìn Ọlọ́run nìkan; àṣàyàn “wọ́n jọ́sìn fún un” wà nínú àlàyé ìsàlẹ̀.
- source_word: θησαυροὺς
  choice: ìṣúra wọn
  rationale: “Ìṣúra” lè tọ́ka sí ohun iyebíye tàbí ibi tí a kó wọn sí, bí ọ̀rọ̀ Gíríìkì náà ṣe lè rí; a kò fi “àpótí” kún un nítorí èyí yóò ṣe pàtó ju orísun lọ.
- source_word: προσήνεγκαν
  choice: wọ́n fi … fún un
  rationale: Nínú ọ̀rọ̀ fífúnni ní ẹ̀bùn, gbólóhùn yìí jẹ́ Yorùbá àdánidá fún fífi tàbí mímú ẹ̀bùn wá síwájú ẹni kan.
- source_word: δῶρα
  choice: àwọn ẹ̀bùn
  rationale: “Ẹ̀bùn” ni ìtumọ̀ tó ṣe kedere jù lọ, kò sì fi èrò ẹbọ tàbí àṣà ìsìn tí ọ̀rọ̀ Gíríìkì kò fi dandan lé e lórí kún un.
- source_word: λίβανον
  choice: tùràrí
  rationale: “Tùràrí” ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún ohun olóòórùn dídùn tí a ń sun; nínú àyíká yìí ó dúró fún frankincense.
- source_word: σμύρναν
  choice: òjíá
  rationale: “Òjíá” ni orúkọ Yorùbá tí a sábà lò fún myrrh, ohun olóòórùn dídùn tí σμύρνα ń tọ́ka sí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ προσκυνέω nípa ọmọ náà
  choice: wọ́n fi ọ̀wọ̀ jíjinlẹ̀ fún un
  alternative: wọ́n jọ́sìn fún un
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbọ̀wọ̀ gíga fún ọba tàbí ìjọsìn. Ọ̀rọ̀ inú ẹsẹ náà kò fi dandan yanjú agbára ẹ̀kọ́ ìgbàgbọ́ rẹ̀; nítorí náà, àkọ́kọ́ túmọ̀ ọ́ ní ọ̀nà tó pa ìbòòrò ìtumọ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ sì tọ́ka sí ìtumọ̀ “jọ́sìn.”
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A pín gbólóhùn gígùn Gíríìkì sí gbólóhùn mẹ́ta fún kíkà tó rọrùn, ṣùgbọ́n a pa ìtẹ̀lé àwọn ìṣe àti gbogbo kókó inú orísun mọ́. A fi àmì àlàyé [a] sí lẹ́yìn gbólóhùn tó túmọ̀ προσκυνέω, nítorí ibẹ̀ ni àlàyé náà ń tọ́ka sí.
