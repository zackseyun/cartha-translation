- from: Wọ́n sì sọ fún un pé, “Ní Bẹ́tílẹ́hẹ́mù ti Jùdíà, nítorí báyìí ni a ti kọ ọ́[a] nípasẹ̀ wòlíì náà pé:”
  to: Wọ́n sì sọ fún un pé, “Ní Bẹ́tílẹ́hẹ́mù ilẹ̀ Jùdíà, nítorí báyìí ni a ti kọ ọ́ sílẹ̀[a] nípasẹ̀ wòlíì náà pé:”
