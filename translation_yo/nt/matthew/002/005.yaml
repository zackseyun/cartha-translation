id: MAT.2.5
reference: Matthew 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: yo
  text: Wọ́n sì sọ fún un pé, “Ní Bẹ́tílẹ́hẹ́mù ilẹ̀ Jùdíà, nítorí báyìí ni a ti kọ ọ́ sílẹ̀[a] nípasẹ̀ wòlíì náà pé:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti kọ ọ́.” Gíríìkì lo ìrísí pípé aláìṣe, èyí tí ó jẹ́ ọ̀nà tí a sábà máa ń gbà tọ́ka sí Ìwé Mímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: Ọ̀rọ̀ arọ́pò orúkọ náà ń tọ́ka sí àwọn olórí àlùfáà àti àwọn akọ̀wé inú ẹsẹ tó ṣáájú; “sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò fi ìtakora tí kò sí sínú ọ̀rọ̀ náà.
- source_word: εἶπαν αὐτῷ
  choice: sọ fún un
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan sọ ohun kan fún ẹlòmíràn, láìfi ìtumọ̀ míì kún ọ̀rọ̀-ìṣe λέγω.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: Ní Bẹ́tílẹ́hẹ́mù ti Jùdíà
  rationale: “Ní” ń fi ibi hàn, “ti Jùdíà” sì pa agbára ìdánimọ̀ inú ọ̀rọ̀ ìbátan Gíríìkì mọ́, ó ń sọ Bẹ́tílẹ́hẹ́mù wo ni wọ́n ní lọ́kàn.
- source_word: οὕτως γὰρ
  choice: nítorí báyìí ni
  rationale: “Nítorí” mú ìdí tí wọ́n fi dáhùn bẹ́ẹ̀ jáde, “báyìí” sì ń tọ́ka sí ọ̀rọ̀ Ìwé Mímọ́ tí yóò tẹ̀ lé.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ìrísí aláìṣe pípé Gíríìkì ń tọ́ka sí ohun tí a kọ sílẹ̀ tẹ́lẹ̀ tí ó sì ṣì dúró; “a ti kọ ọ́” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ yìí mọ́.
- source_word: διὰ τοῦ προφήτου
  choice: nípasẹ̀ wòlíì náà
  rationale: “Nípasẹ̀” pa èrò ohun èlò tàbí alárinà inú διά pẹ̀lú ọ̀rọ̀ ìbátan mọ́, láìsọ ẹni tí ó jẹ́ orísun ọ̀rọ̀ náà ní pàtó ju bí Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Ọ̀nà tí àsọtẹ́lẹ̀ gbà dé
  choice: nípasẹ̀ wòlíì náà
  alternative: láti ọwọ́ wòlíì náà
  rationale: “Nípasẹ̀” fi wòlíì hàn gẹ́gẹ́ bí alárinà ọ̀rọ̀ náà, ó sì tẹ̀ lé διά pẹ̀lú ọ̀rọ̀ ìbátan láìfi ẹ̀kọ́ ìsìn kan tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A tún pa àmì ìdádúró tó ṣí ọ̀rọ̀ àyọlò ẹsẹ tó tẹ̀ lé mọ́ ní òpin.
