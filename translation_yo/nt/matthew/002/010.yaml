  text: ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: yo
  text: Nígbà tí wọ́n rí ìràwọ̀ náà, wọ́n sì yọ̀ gidigidi pẹ̀lú ayọ̀ ńlá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, ní tààràtà: “wọ́n yọ̀ ní ayọ̀ ńlá gidigidi”; ọ̀nà ọ̀rọ̀ yìí jẹ́ ìtẹnumọ́ alágbára.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí wọ́n ... rí
  rationale: Aorist participle náà ní iṣẹ́ àsìkò ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ àsìkò náà mọ́.
- source_word: δὲ
  choice: sì
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú, kì í ṣe àmì ìtakora líle; “sì” bá iṣẹ́ yìí mu ní Yorùbá.
- source_word: τὸν ἀστέρα
  choice: ìràwọ̀ náà
  rationale: Ìtumọ̀ ἀστήρ ni “ìràwọ̀,” “náà” sì tọ́ka sí ìràwọ̀ pàtó tí a ti mẹ́nu kàn tẹ́lẹ̀.
- source_word: ἐχάρησαν
  choice: inú wọn dùn
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù náà rí bí passive/deponent, ìtumọ̀ rẹ̀ ṣiṣẹ́ bí active; “inú wọn dùn” jẹ́ ọ̀nà Yorùbá àdánidá fún ayọ̀ tí wọ́n ní.
- source_word: χαρὰν μεγάλην
  choice: pẹ̀lú ayọ̀ ńlá
  rationale: Cognate accusative yìí ń fi agbára kún ọ̀rọ̀-ìṣe; gbólóhùn pẹ̀lú “pẹ̀lú” jẹ́ kíkà àdánidá ní Yorùbá, ó sì pa “ayọ̀ ńlá” mọ́.
- source_word: σφόδρα
  choice: lọ́pọ̀lọpọ̀
  rationale: Ọ̀rọ̀ náà ń mú gbogbo gbólóhùn ayọ̀ náà lágbára gidigidi; “lọ́pọ̀lọpọ̀” fún un ní ìtẹnumọ́ gíga ní Yorùbá tó ṣeé lóye.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan ọ̀nà ọ̀rọ̀ àdánidá, ṣùgbọ́n a pa ìtẹnumọ́ alágbára inú Gíríìkì mọ́; àmì àlàyé [a] wà lẹ́yìn “ìràwọ̀ náà” gẹ́gẹ́ bí ìpele ìtọ́kasí tí a pèsè.
