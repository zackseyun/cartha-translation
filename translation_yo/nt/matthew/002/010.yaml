revisions:
- from: Nígbà tí wọ́n sì rí ìràwọ̀ náà[a], inú wọn dùn pẹ̀lú ayọ̀ ńlá lọ́pọ̀lọpọ̀.
  to: Nígbà tí wọ́n rí ìràwọ̀ náà, wọ́n sì yọ̀ gidigidi pẹ̀lú ayọ̀ ńlá[a].
  rationale: The revision renders the temporal participle with “Nígbà tí wọ́n rí,” retains δέ as the mild narrative connector “sì,” and preserves the specific star. It replaces the unsuitable abundance/frequency sense of lọ́pọ̀lọpọ̀ with gidigidi for σφόδρα, while retaining the Greek cognate and emphatic construction through yọ̀ ... pẹ̀lú ayọ̀ ńlá. The footnote is moved to the expression it actually explains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the star and the temporal force of ἰδόντες, but “lọ́pọ̀lọpọ̀” is not the best rendering of σφόδρα here: it commonly denotes abundance, multiplicity, or frequency rather than the adverbial intensity intended. The cognate emphatic construction should also remain transparently represented.'
  naturalness: “Inú wọn dùn pẹ̀lú ayọ̀ ńlá lọ́pọ̀lọpọ̀” is understandable, but its final intensifier is awkward in this context. “Wọ́n sì yọ̀ gidigidi pẹ̀lú ayọ̀ ńlá” is natural, elevated modern Yorùbá and retains the Greek’s deliberately intensified joy expression.
  terminology: Ìràwọ̀ náà is correct for τὸν ἀστέρα. Yọ̀, ayọ̀, ńlá, and gidigidi appropriately convey the verbal joy, cognate noun, greatness, and strong intensification without theological over-specification.
  issues:
  - severity: medium
    issue: The rendering of σφόδρα as “lọ́pọ̀lọpọ̀” is semantically imprecise.
    rationale: σφόδρα intensifies the rejoicing/joy (“exceedingly, very greatly”), whereas lọ́pọ̀lọpọ̀ ordinarily evokes being many, plentiful, or repeated. Gidigidi is the standard idiomatic intensifier here.
  - severity: low
    issue: Footnote anchor [a] is attached to “ìràwọ̀ náà,” though the note explains the emphatic joy expression.
    rationale: The anchor should follow the expression it explains, so readers do not infer that the note concerns “star.”
  revised_text: Nígbà tí wọ́n rí ìràwọ̀ náà, wọ́n sì yọ̀ gidigidi pẹ̀lú ayọ̀ ńlá[a].
