id: MAT.2.12
reference: Matthew 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: yo
  text: Nígbà tí a sì ti kìlọ̀ fún wọn nínú àlá[a] pé kí wọ́n má ṣe padà lọ sọ́dọ̀ Hẹ́rọ́dù, wọ́n gba ọ̀nà mìíràn[b] lọ sí ilẹ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí a ti kìlọ̀ fún wọn láti ọ̀run nínú àlá.” Àfọwọ́ṣe ọ̀rọ̀ Gíríìkì náà ń fi ìkìlọ̀ láti ọ̀dọ̀ Ọlọ́run hàn, bí ó tilẹ̀ jẹ́ pé ẹsẹ yìí kò dárúkọ Ọlọ́run ní tààrà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ ọ̀nà mìíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: tí wọ́n gba ìkìlọ̀
  rationale: Gbólóhùn yìí tú participle passive náà sí Yorùbá àdánidá, ó sì fi orísun ìkìlọ̀ náà sílẹ̀ láì dárúkọ Ọlọ́run níbi tí ẹsẹ náà kò ti dárúkọ rẹ̀ ní tààrà.
- source_word: κατ’ ὄναρ
  choice: nínú àlá
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere, fún ohun tí ènìyàn rí tàbí gbà nígbà àlá.
- source_word: μὴ ἀνακάμψαι
  choice: pé kí wọn má padà
  rationale: ‘Pé kí wọn má padà’ sọ àkóónú ìkìlọ̀ náà ní Yorùbá àdánidá, ó sì bá ọ̀rọ̀ ìrìnàjò mu.
- source_word: πρὸς Ἡρῴδην
  choice: sọ́dọ̀ Hẹ́rọ́dù
  rationale: ‘Sọ́dọ̀’ fi ìlọsí ẹni kan hàn ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó yẹ ní àyíká yìí.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: gba ọ̀nà mìíràn
  rationale: Èyí mú ìtumọ̀ ọ̀nà ìrìnàjò gidi jáde ní èdè Yorùbá tó rọrùn, láì sọ ọ́ di àpèjúwe ẹ̀mí.
- source_word: ἀνεχώρησαν
  choice: wọ́n ... lọ
  rationale: Nínú àyíká ìrìnàjò yìí, ‘lọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé wọ́n kúrò níbẹ̀; ‘kúrò’ lè tún ṣeé lò ṣùgbọ́n yóò mú ibi tí wọ́n fi sílẹ̀ wá síwájú ju ibi tí wọ́n ń lọ lọ.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: sí ilẹ̀ wọn
  rationale: ‘Ilẹ̀ wọn’ lè túmọ̀ sí orílẹ̀-èdè tàbí agbègbè ìbílẹ̀ wọn, ó sì pa ìwọ̀n àìdánilójú χώρα mọ́ dáadáa.
theological_decisions:
- issue: Orísun àtọ̀runwá tí passive χρηματισθέντες ń tọ́ka sí
  choice: A sọ pé ‘wọ́n gba ìkìlọ̀’ láì fi ‘lọ́dọ̀ Ọlọ́run’ kún ọ̀rọ̀ pàtàkì.
  alternative: ‘Ọlọ́run kìlọ̀ fún wọn’ tàbí ‘wọ́n gba ìkìlọ̀ àtọ̀runwá.’
  rationale: Àyíká àti lílo ọ̀rọ̀ náà ń tọ́ka sí pé ìkìlọ̀ náà wá láti ọ̀dọ̀ Ọlọ́run, ṣùgbọ́n Gíríìkì ẹsẹ yìí kò dárúkọ Ọlọ́run ní tààrà. Ìtumọ̀ yìí pa ìtọ́kasí náà mọ́ láì sọ ohun tí orísun kò sọ ní gbangba.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘gba ìkìlọ̀’ dípò passive aláìdánidá, a sì fi àmì ohùn sí ibi tó yẹ.
