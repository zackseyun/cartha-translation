  to: Nígbà tí a sì ti kìlọ̀ fún wọn nínú àlá[a] pé kí wọ́n má ṣe padà lọ sọ́dọ̀ Hẹ́rọ́dù, wọ́n gba ọ̀nà mìíràn[b] lọ sí ilẹ̀ wọn.
  rationale: Àtúnṣe náà mú ẹ̀wẹ̀ participle Gíríìkì náà padà nípasẹ̀ “a ti kìlọ̀ fún wọn,” ó sì jẹ́ kí ìbéèrè ìkìlọ̀ náà jẹ́ Yorùbá tó péye pẹlu “kí wọ́n má ṣe padà lọ.” A kò fi Ọlọ́run kún ọ̀rọ̀ pàtàkì, nítorí a kò dárúkọ rẹ̀ nínú ẹsẹ náà. Ọ̀nà mìíràn àti ilẹ̀ wọn ni a pa mọ́ láì dín ìtumọ̀ wọn kù.
