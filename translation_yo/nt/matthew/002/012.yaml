  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ pa ìtumọ̀ ẹsẹ náà mọ́ ní gbogbogbò: ìkìlọ̀ nínú àlá, àìpadà lọ sọ́dọ̀ Hẹ́rọ́dù, àti ìpadà sí ilẹ̀ wọn nípasẹ̀ ọ̀nà mìíràn. Ṣùgbọ́n lílo “Lẹ́yìn tí wọ́n sì gba” yí participle passive Gíríìkì padà sí ìṣe tí wọ́n fi ara wọn ṣe, ó sì jẹ́ ìbẹ̀rẹ̀ gbolóhùn tí kò rọrùn. “A ti kìlọ̀ fún wọn” dá passive náà àti ìtọ́kasí sí olùkìlọ̀ tí a kò dárúkọ mọ́ dáadáa.'
  naturalness: “Nígbà tí a sì ti kìlọ̀ fún wọn” jẹ́ Yorùbá ìgbàlódé tó mọ́, tó sì tẹ̀lé ìṣọ̀kan gbolóhùn ẹsẹ náà. “Kí wọ́n má ṣe padà lọ” jẹ́ ìlànà èdè tó péye ju “kí wọn má padà” lọ nínú ìkọ̀wé ìwé mímọ́. “Gba ọ̀nà mìíràn lọ” sì jẹ́ ọ̀nà àdánidá fún ìrìnàjò nípasẹ̀ ọ̀nà mìíràn.
