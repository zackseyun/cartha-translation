id: MAT.2.16
reference: Matthew 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: yo
  text: Nígbà náà, nígbà tí Hẹ́rọ́dù rí i pé àwọn Magi[b] ti tàn án jẹ[a], inú bí i gidigidi. Ó rán àwọn ènìyàn lọ, ó sì pa gbogbo àwọn ọmọkùnrin tí ó wà ní Bẹ́tílẹ́hẹ́mù àti ní gbogbo agbègbè rẹ̀, tí ọjọ́ orí wọn jẹ́ ọdún méjì tàbí kéré sí i, gẹ́gẹ́ bí àkókò tí ó ti wádìí dájú lọ́dọ̀ àwọn Magi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ gangan, “ti ṣe ẹlẹ́yà rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ ìbílẹ̀, “àwọn amòye.” Ọ̀rọ̀ Gíríìkì náà ni Magi, àwọn amòye-awòràwọ̀ láti Ìlà Oòrùn.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ àkókò tó ń fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé èyí tó ṣáájú.
- source_word: ἰδὼν ὅτι
  choice: nígbà tí ... rí i pé
  rationale: Ó mú ìtumọ̀ ìfiyèsí participle náà jáde ní Yorùbá àdánidá.
- source_word: ἐνεπαίχθη
  choice: ti tàn án jẹ
  rationale: Nínú àyíká ọ̀rọ̀ yìí, àwọn Magi kò padà sọ́dọ̀ Hẹ́rọ́dù, wọ́n sì tipa bẹ́ẹ̀ mú kí ète rẹ̀ já sí asán. Àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gangan tó lè jẹ́ ‘ṣe ẹlẹ́yà’ mọ́.
- source_word: τῶν μάγων
  choice: àwọn Magi
  rationale: Àyálò orúkọ yìí pa ìdánimọ̀ wọn gẹ́gẹ́ bí àwọn amòye àti awòràwọ̀ láti Ìlà Oòrùn mọ́, láì fi àṣà tó wá lẹ́yìn kún un.
- source_word: ἐθυμώθη λίαν
  choice: inú bí i gidigidi
  rationale: Ọ̀rọ̀ Yorùbá àdánidá yìí fi ìbínú tí λίαν mú lágbára hàn kedere.
- source_word: ἀποστείλας
  choice: Ó rán àwọn ènìyàn lọ
  rationale: Ó sọ ìránṣẹ́ àwọn aṣojú di kedere, èyí tí ìṣe pípa náà ń béèrè nínú àyíká ọ̀rọ̀.
- source_word: ἀνεῖλεν
  choice: ó sì pa
  rationale: Ìtumọ̀ taara, òde òní, tó sì bá ìwà ipá ọ̀rọ̀ Gíríìkì mu.
- source_word: πάντας τοὺς παῖδας
  choice: gbogbo àwọn ọmọkùnrin
  rationale: Nínú àyíká ìtàn náà, παῖδας ń tọ́ka sí àwọn ọmọ ọkùnrin tí Hẹ́rọ́dù ń wá láti pa.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: ní Bẹ́tílẹ́hẹ́mù àti ní gbogbo agbègbè rẹ̀
  rationale: ‘Agbègbè rẹ̀’ sọ ilẹ̀ tó yí ìlú náà ká ní Yorùbá tó ṣe kedere, dípò ‘ààlà’ tó lè túmọ̀ sí ìlà ààlà nìkan.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: láti ọmọ ọdún méjì sọ̀kalẹ̀
  rationale: Ó fi ọmọ ọdún méjì sínú iye ọjọ́-orí tó pọ̀ jù, ó sì kan gbogbo ẹni tó kéré sí i.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: gẹ́gẹ́ bí àkókò tí ó ti fi ìwádìí mọ̀ dájú lọ́dọ̀ àwọn Magi
  rationale: ἠκρίβωσεν túmọ̀ sí pé ó wádìí àkókò náà dáadáa, ó sì mọ̀ ọ́n dájú; kì í ṣe pé òun fúnra rẹ̀ pinnu àkókò náà.
theological_decisions:
- issue: Ìtumọ̀ μάγοι
  choice: àwọn Magi
  alternative: àwọn amòye
  rationale: ‘Magi’ pa ìdánimọ̀ àṣà àti ìtàn wọn mọ́ láì sọ pé wọ́n jẹ́ ọba tàbí láì dín iṣẹ́ wọn kù sí ọgbọ́n lasán.
- issue: Ìtumọ̀ ἐνεπαίχθη
  choice: ti tàn án jẹ
  alternative: ti ṣe ẹlẹ́yà rẹ̀
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Hẹ́rọ́dù rí ara rẹ̀ bí ẹni tí àwọn Magi fi ọgbọ́n kọjá; àlàyé [a] pa ìtumọ̀ ‘ṣe ẹlẹ́yà’ tó tún ṣeé ṣe mọ́.
- issue: Aṣojú nínú ἀποστείλας ἀνεῖλεν
  choice: Ó rán àwọn ènìyàn lọ, ó sì pa
  alternative: Ó ránṣẹ́, ó sì mú kí wọ́n pa
  rationale: Àyànfẹ́ náà pa àgbékalẹ̀ pé Hẹ́rọ́dù ni ẹni tó fa ìpànìyàn náà mọ́, nígbà tó tún jẹ́ kedere pé ó fi àwọn aṣojú ṣe é; a kò yọ ojúṣe rẹ̀ kúrò tàbí fi ọ̀rọ̀ tí kò sí kún ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, tó níyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. A fi àwọn àmì àlàyé [a] àti [b] sí lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé gan-an, dípò títẹ̀ lé àṣìṣe ipò àmì inú ipele ìfọ̀rọ̀wánilẹ́nuwò Gẹ̀ẹ́sì.
