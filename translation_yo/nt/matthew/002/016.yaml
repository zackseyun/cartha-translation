    issue: ‘tí ó ti fi ìwádìí mọ̀ dájú’ kò ṣàn dáadáa ní Yorùbá.
    rationale: Kíkó ‘fi ìwádìí mọ̀ dájú’ pọ̀ níbí kò fi ohun tí Hẹ́rọ́dù wádìí hàn ní kedere. ‘Tí ó ti wádìí dájú’ ń sọ pé ó rí àkókò náà mọ̀ dáadáa láti ọ̀dọ̀ àwọn Magi, èyí tó bá ἠκρίβωσεν mu.
  - severity: low
    issue: ‘láti ọmọ ọdún méjì sọ̀kalẹ̀’ lè má ṣe kedere fún gbogbo òǹkàwé nípa ìkànsí ọmọ ọdún méjì.
