  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì ní pàtàkì: ìbínú Hẹ́rọ́dù, rírán àwọn ènìyàn, pípa àwọn ọmọkùnrin ní Bẹ́tílẹ́hẹ́mù àti agbègbè rẹ̀, àti ìpinnu ọjọ́-orí tí ó dá lórí àkókò tí ó mọ̀ láti ọ̀dọ̀ àwọn Magi. Àmọ́, gbolóhùn ikẹyìn náà nílò àtúnṣe kékeré kí ó lè sọ ἠκρίβωσεν (''wádìí/mọ̀ dájú'') ní Yorùbá tó mọ́gbọ́n dání.'
  naturalness: Yorùbá náà jẹ́ boṣewa, ó sì rọrùn láti ka. ‘Tí ọjọ́ orí wọn jẹ́ ọdún méjì tàbí kéré sí i’ ṣe kedere ju ‘láti ọmọ ọdún méjì sọ̀kalẹ̀’ lọ nípa pé ọmọ ọdún méjì wà nínú iye náà. ‘Ní ìtumọ̀ ìbílẹ̀’ sì jẹ́ ọ̀nà adayeba ju ‘Ní àṣà ìtumọ̀ kan’ lọ nínú àlàyé ìsàlẹ̀ ojú ewé.
  terminology: ‘Àwọn Magi’ dáàbò bo ọ̀rọ̀ μάγοι láì dín un kù sí ‘àwọn amòye’; àlàyé ìsàlẹ̀ ojú ewé náà fúnni ní aṣayan ìbílẹ̀. ‘Ti tàn án jẹ’ yẹ fún agbára àyíká ἐνεπαίχθη, àti àlàyé [a] ń pa aṣayan ‘ṣe ẹlẹ́yà’ mọ́. ‘Pa’ yẹ fún ἀνεῖλεν nínú ọ̀rọ̀ ìtàn líle yìí.
  issues:
