id: MAT.2.19
reference: Matthew 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí Hẹ́rọ́dù kú, kíyèsí i, áńgẹ́lì Olúwa kan[a] farahàn sí Jósẹ́fù lójú àlá ní Íjíbítì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “áńgẹ́lì Olúwa náà.” Ní èdè Gíríìkì, kò sí árítíkì ṣáájú ọ̀rọ̀ náà “áńgẹ́lì.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: lẹ́yìn tí ... kú
  rationale: Aorist participle in a genitive absolute is temporal here; this naturally expresses that Herod’s death preceded the appearance.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Marks the narrative transition while retaining the mild contrast with the preceding danger under Herod.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: A dignified, current Yoruba attention-marker that preserves the vivid narrative force.
- source_word: ἄγγελος κυρίου
  choice: áńgẹ́lì Olúwa kan
  rationale: The absence of the article before ἄγγελος is represented naturally by kan, while Olúwa conveys κύριος as the divine title.
- source_word: φαίνεται
  choice: farahàn
  rationale: Conveys the historical present’s vivid appearance without forcing an unnatural tense distinction in Yoruba.
- source_word: κατ’ ὄναρ
  choice: lójú àlá
  rationale: Natural Yoruba idiom for an appearance or revelation received in a dream.
- source_word: τῷ Ἰωσὴφ
  choice: Jósẹ́fù
  rationale: The verb phrase farahàn Jósẹ́fù naturally identifies Joseph as the person to whom the angel appears.
- source_word: ἐν Αἰγύπτῳ
  choice: ní Íjíbítì
  rationale: Straightforward locative rendering identifying Joseph’s location.
theological_decisions:
- issue: Rendering of κύριος in ἄγγελος κυρίου
  choice: Olúwa
  alternative: Olúwa náà / Ọ̀gá
  rationale: Olúwa is the established and contextually fitting Yoruba divine title; Ọ̀gá would suggest an ordinary human master.
- issue: Article with ἄγγελος
  choice: áńgẹ́lì Olúwa kan
  alternative: áńgẹ́lì Olúwa náà
  rationale: Greek has no article before ἄγγελος, so the main text gives the straightforward indefinite sense, while the note preserves the traditional definite possibility without imposing it.
translation_notes:
  register: Standard Yoruba with full tone marks, using a dignified but readily understandable narrative register. Kíyèsí i preserves the solemn attention-marking function of ἰδού, and lójú àlá is idiomatic Yoruba.
