id: MAT.11.22
reference: Matthew 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé, ní ọjọ́ ìdájọ́, yóò rọrùn síi fún Tírè àti Sídónì ju fún yín lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “yóò ṣeé fara dà síi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ọ̀rọ̀ ìbáwí tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá òde òní.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín pé
  rationale: Ó pa ìtọ́ka ẹni àkọ́kọ́, àdírẹ́sì ọ̀pọ̀ ènìyàn, àti ìtẹnumọ́ ọ̀rọ̀ Jésù mọ́ ní Yorùbá tó ṣe kedere.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: fún Tírè àti Sídónì
  rationale: “Fún” ṣàfihàn àwọn tí ìfiwéra náà kàn, gẹ́gẹ́ bí dative Gíríìkì ṣe ń ṣiṣẹ́ pẹ̀lú ajẹtífù afiwéra.
- source_word: ἀνεκτότερον
  choice: yóò túbọ̀ rọrùn ... láti fara dà á
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí ó ṣeé fara dà ní ìwọ̀n tó pọ̀ ju; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ afiwéra mọ́.
- source_word: ἔσται
  choice: yóò
  rationale: Ó fi àsìkò ọjọ́ iwájú ti ọ̀rọ̀-ìṣe Gíríìkì hàn láìlo èdè àtijọ́ tàbí ọ̀rọ̀ àfikún.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ní ọjọ́ ìdájọ́
  rationale: Ó fi àkókò ìdájọ́ náà hàn ní ọ̀nà tó ṣe kedere, tó sì bá ìlò Yorùbá mu.
- source_word: κρίσεως
  choice: ìdájọ́
  rationale: “Ìdájọ́” pa ìtumọ̀ iṣẹ́ adájọ́ mọ́, kò sì dín un kù sí ìdálẹ́bi nìkan.
- source_word: ἢ ὑμῖν
  choice: ju fún yín lọ
  rationale: Èyí ni ìkọ́lé afiwéra Yorùbá tó péye, ó sì pa ọ̀pọ̀ ènìyàn tí “ὑμῖν” ń tọ́ka sí mọ́.
theological_decisions:
- issue: Ìrú ìdájọ́ ọjọ́ iwájú tí a ń tọ́ka sí
  choice: ní ọjọ́ ìdájọ́
  alternative: ní ọjọ́ ìdájọ́ kan
  rationale: Bí ó tilẹ̀ jẹ́ pé kò sí article nínú gbólóhùn Gíríìkì, àyíká Mátíù tọ́ka sí ọjọ́ ìdájọ́ tí a mọ̀ sí ti ọjọ́ iwájú. Ìtumọ̀ yìí kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “Tírè” àti “Sídónì” gẹ́gẹ́ bí àkọsílẹ̀ orúkọ tó bá ìró wọn mu.
