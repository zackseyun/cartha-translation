id: MAT.11.6
reference: Matthew 11:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: yo
  text: Ìbùkún sì ni fún ẹni tí kò bá kọsẹ̀ nítorí mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò bá bínú sí mi” tàbí “tí kò bá rí ìdènà nínú mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: sì
  rationale: “Sì” so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú rẹ̀ lọ́nà àdánidá nínú Yorùbá.
- source_word: μακάριος
  choice: Ìbùkún ni fún
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ẹ̀sìn àti ìkéde ojúrere Ọlọ́run mọ́ ju “aláyọ̀” lọ, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ irú ìkéde ìbùkún bẹ́ẹ̀.
- source_word: ὃς ἐὰν μὴ
  choice: ẹni tí kò bá
  rationale: Ó fi ẹni àìdá kan hàn lábẹ́ ipò kan, ó sì pa agbára ẹyọ ọ̀rọ̀ Gíríìkì náà mọ́ ní Yorùbá tó ṣe kedere.
- source_word: σκανδαλισθῇ
  choice: kọsẹ̀
  rationale: “Kọsẹ̀” pa àwòrán ìkọsẹ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí jíjẹ́ kí ohun kan dí ẹni lọ́wọ́ láti gba Jésù gbọ́ tàbí láti dúró ṣinṣin nínú rẹ̀; Yorùbá kò nílò kí a fi ìṣe àìṣe náà hàn ní ọ̀nà líle tí kò bá àdánidá mu.
- source_word: ἐν ἐμοί
  choice: nítorí mi
  rationale: Nínú àjọṣe rẹ̀ pẹ̀lú σκανδαλισθῇ, gbólóhùn náà ń fi Jésù hàn gẹ́gẹ́ bí ẹni tàbí ohun tí ìkọsẹ̀ náà dá lé; “nítorí mi” jẹ́ kedere, ó sì pa ìdí tàbí àkókò ìkọsẹ̀ náà mọ́ láìsọ pé Jésù mọ̀ọ́mọ̀ ń mú ẹni kọsẹ̀.
theological_decisions:
- issue: Bí a ṣe máa pa agbára σκανδαλισθῇ mọ́ ní ìbámu pẹ̀lú Jésù
  choice: 'Pa àwòrán ìkọsẹ̀ mọ́ nínú ọ̀rọ̀ pàtàkì: “kò bá kọsẹ̀ nítorí mi.”'
  alternative: “kò bá kọ̀ mí sílẹ̀ nítorí ohun tí mo ṣe” tàbí “kò bá bínú sí mi”
  rationale: 'Àwòrán ìkọsẹ̀ náà lè ní ìtumọ̀ tó jinlẹ̀ ju ìbínú ọkàn lásán lọ: ó lè kan àìgbàgbọ́, ìfàsẹ́yìn, tàbí jíjẹ́ kí Jésù àti iṣẹ́ rẹ̀ di ohun ìdènà. Ìtumọ̀ yìí kò fi ipá yan ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyẹn.'
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. “Ìbùkún ni fún” jẹ́ ọ̀nà tó ṣe kedere fún òǹkàwé òde òní, “kọsẹ̀” sì pa àwòrán orísun Gíríìkì mọ́. Àmì ohùn ni a fi sí ibi tí ó yẹ.
