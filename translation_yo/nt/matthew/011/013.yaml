  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: yo
  text: Nítorí gbogbo àwọn wòlíì àti Òfin sọ àsọtẹ́lẹ̀ títí dé ìgbà Jòhánù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “títí dé Jòhánù” tàbí “títí di àkókò Jòhánù.” Ó lè fi Jòhánù hàn gẹ́gẹ́ bí òpin ẹ̀rí àsọtẹ́lẹ̀, tàbí gẹ́gẹ́ bí ààlà tí ìyípadà kan ti bẹ̀rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: gbogbo
  rationale: Ó ń tọ́ka sí gbogbo àwùjọ àwọn wòlíì lápapọ̀, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà ṣe rí.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí a sọ ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí rẹ̀.
- source_word: οἱ προφῆται
  choice: àwọn wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ìtumọ̀ àwọn tí ń sọ̀rọ̀ ní orúkọ Ọlọ́run mu.
- source_word: ὁ νόμος
  choice: Òfin
  rationale: Lẹ́tà ńlá fi hàn pé Òfin Mósè gẹ́gẹ́ bí apá Ìwé Mímọ́ ni a ń tọ́ka sí, kì í ṣe òfin lásán.
- source_word: ἕως Ἰωάννου
  choice: títí dé ìgbà Jòhánù
  rationale: Ó sọ ààlà àkókò náà ní Yorùbá àdánidá, ṣùgbọ́n kò pinnu bóyá Jòhánù wà nínú àkókò àsọtẹ́lẹ̀ náà tàbí pé òun ni ààlà ìyípadà rẹ̀.
- source_word: ἐπροφήτευσαν
  choice: ni ó sọ àsọtẹ́lẹ̀
  rationale: Ó pa ìtumọ̀ iṣẹ́ àsọtẹ́lẹ̀ mọ́, ó sì jẹ́ kí Òfin àti àwọn wòlíì jẹ́ olùṣe ẹyọ kan náà, gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́.
theological_decisions:
- issue: Bóyá ὁ νόμος jẹ́ òfin lápapọ̀ tàbí orúkọ apá Ìwé Mímọ́
  choice: Òfin
  alternative: òfin
  rationale: Àpapọ̀ ọ̀rọ̀ náà, “àwọn wòlíì àti Òfin,” tọ́ka sí ẹ̀rí Ìwé Mímọ́ Ísírẹ́lì; lẹ́tà ńlá ń jẹ́ kí èyí ṣe kedere láìfi èrò tuntun kún ọ̀rọ̀ náà.
- issue: Bóyá ἕως Ἰωάννου ka Jòhánù mọ́ sáà àwọn wòlíì tàbí pé ó fi í ṣe ààlà rẹ̀
  choice: títí dé ìgbà Jòhánù
  alternative: títí dé Jòhánù
  rationale: Ìtumọ̀ yìí pa èdè ààlà àkókò mọ́, kò sì fipá yan ọ̀kan nínú àwọn ìtumọ̀ méjèèjì tí Gíríìkì lè gbà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo “Òfin” gẹ́gẹ́ bí orúkọ àkójọpọ̀ Ìwé Mímọ́, a sì pa àìdánilójú inú “ἕως Ἰωάννου” mọ́ ní ẹsẹ àti àlàyé ìsàlẹ̀.
