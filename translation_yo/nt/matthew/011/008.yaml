id: MAT.11.8
reference: Matthew 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: yo
  text: Ṣùgbọ́n kí ni ẹ jáde lọ wò? Ọkùnrin kan tí ó wọ aṣọ rírọ̀ bí? Ẹ wò ó,[a] àwọn tí wọ́n ń wọ aṣọ rírọ̀ wà ní àwọn ilé àwọn ọba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kíyèsí i.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìpe sí àkíyèsí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àwọn ààfin ọba.” Gíríìkì náà sọ ní tààrà pé, “ní àwọn ilé àwọn ọba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó ń tẹ̀ síwájú nínú ìyàtọ̀ inú àwọn ìbéèrè àfiwé Jésù, ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: kí ni ẹ jáde lọ wò
  rationale: Ó pa τί mọ́ gẹ́gẹ́ bí ‘kí ni,’ ó sì fi ète ἰδεῖν pẹ̀lú ἐξήλθατε hàn lọ́nà Yorùbá tó ṣe déédéé.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Ẹni ọkùnrin kan ṣoṣo ni ọ̀rọ̀ náà ń tọ́ka sí níbí, ìtọ́kasí náà sì bá Jòhánù mu.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: tí ó wọ aṣọ rírọ̀
  rationale: ‘Aṣọ rírọ̀’ pa àwòrán gidi μαλακοῖς mọ́, nígbà tí àyíká ọ̀rọ̀ ń fi hàn pé aṣọ dídára tàbí adùn ni.
- source_word: ἰδοὺ
  choice: Ẹ wò ó
  rationale: Gbólóhùn ìpe-àkíyèsí Yorùbá ti òde òní ni, ó sì pa agbára àsọyé náà mọ́.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: àwọn tí wọ́n ń wọ aṣọ rírọ̀
  rationale: Àmì ‘ń’ fi ìṣe àṣà tàbí ohun tí wọ́n máa ń ṣe hàn, gẹ́gẹ́ bí φοροῦντες; àtúnlò ‘aṣọ rírọ̀’ sì pa ìṣọ̀kan ọ̀rọ̀ mọ́.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: wà ní ilé àwọn ọba
  rationale: Ó tẹ̀lé ọ̀pọ̀ ‘ilé’ àti ‘ọba’ nínú Gíríìkì ní kíkún ju ìtumọ̀ aláyọkúrò ‘ààfin’ lọ.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A pa àsọyé ìbéèrè Jésù àti àtúnlò ‘aṣọ rírọ̀’ mọ́. A gbe àmì àlàyé [a] lẹ́yìn ọ̀rọ̀ tó ń ṣàlàyé, [b] sì tẹ̀ lé gbólóhùn nípa ilé àwọn ọba.
