id: MAT.11.21
reference: Matthew 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: yo
  text: “Ègbé ni fún ọ, Kórásínì! Ègbé ni fún ọ, Bẹtisáídà! Nítorí pé bí àwọn iṣẹ́ agbára[a] tí a ṣe láàárín yín bá ṣẹlẹ̀ ní Tírè àti Sídónì, wọ́n ìbá ti ronúpìwàdà tipẹ́tipẹ́ nínú aṣọ ọ̀fọ̀ àti eérú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn iṣẹ́ ìyanu”; ní Gíríìkì, “àwọn iṣẹ́ agbára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Ègbé ni fún ọ
  rationale: Ó pa ìkìlọ̀ ìdájọ́ àti ìbànújẹ́ inú ọ̀rọ̀ àsọtẹ́lẹ̀ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti bá ìlú kọ̀ọ̀kan sọ̀rọ̀ ní Yorùbá.
- source_word: Χοραζίν
  choice: Kórásínì
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá.
- source_word: Βηθσαϊδά
  choice: Bẹtisáídà
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá.
- source_word: αἱ δυνάμεις
  choice: àwọn iṣẹ́ agbára
  rationale: Èyí fi ìtumọ̀ agbára inú δυνάμεις hàn, ó sì tọ́ka sí àwọn iṣẹ́ àgbàyanu tí agbára Ọlọ́run farahàn nínú wọn láìfi ìtumọ̀ náà mọ́ ọ̀rọ̀ kan ṣoṣo.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ọ̀pọ̀, ó sì ń tọ́ka sí ohun tí ó ṣẹlẹ̀ ní àárín àwọn olùgbé ìlú, kì í ṣe nínú ọkàn wọn.
- source_word: πάλαι
  choice: tipẹ́tipẹ́
  rationale: Ó sọ ní kedere pé ìrònúpìwàdà náà ìbá ti wáyé ní ìgbà pípẹ́ ṣáájú àkókò yìí.
- source_word: μετενόησαν
  choice: ronú pìwà dà
  rationale: Èyí ni gbólóhùn Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe àfihàn ìyípadà ọkàn àti ìpadà kúrò nínú ẹ̀ṣẹ̀.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: nínú aṣọ ọ̀fọ̀ àti eérú
  rationale: Ó mú àwòrán àṣà ìbànújẹ́ àti ìrònúpìwàdà wá sí Yorùbá ní ọ̀nà tí òǹkàwé òde òní lè lóye.
theological_decisions:
- issue: Ìfiwéra Jésù láàárín Kórásínì àti Bẹtisáídà sí Tírè àti Sídónì
  choice: A pa á mọ́ gẹ́gẹ́ bí gbólóhùn àtakò sí ohun tí ó ṣẹlẹ̀, tí ó ń fi ẹ̀bi àwọn ìlú tí wọ́n rí iṣẹ́ agbára náà ṣùgbọ́n tí wọn kò ronú pìwà dà hàn.
  alternative: Kí a ka a sí àsọdùn ọ̀rọ̀ lásán tí kò ní ìdájọ́ afiwéra gidi nínú.
  rationale: Ìlànà ‘ká ní ... wọn ìbá ti’ pa ìfiwéra àti ìdíwọ̀n ẹ̀bi inú Gíríìkì mọ́ láìfi ìkọ́ni míì kún un.
translation_notes:
  register: Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ ‘Ègbé ni fún ọ’ ní agbára ọ̀rọ̀ àsọtẹ́lẹ̀, nígbà tí ‘ká ní ... wọn ìbá ti’ jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn àtakò sí ohun tí ó ṣẹlẹ̀. Èdè náà jẹ́ ọlọ́lá, ṣùgbọ́n ó ṣì ṣeé lóye fún òǹkàwé òde òní.
