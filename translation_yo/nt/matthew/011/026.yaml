base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni[a], Baba, nítorí bẹ́ẹ̀ ni ó ṣe tẹ́ ọ lọ́rùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí bẹ́ẹ̀ ni ó jẹ́ ìfẹ́ rere rẹ,” tàbí, “nítorí èyí dùn mọ́ ọ lójú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìfọwọ́sí tàbí ìjẹ́wọ́ hàn nínú àdúrà.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Orúkọ yìí ń ṣiṣẹ́ bí ọ̀rọ̀ ìpè tààrà; “Baba” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní iyì láìfi ọ̀rọ̀ àtijọ́ kún un.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó mú ìtumọ̀ ìdí tí ọ̀rọ̀ Gíríìkì ní níbí jáde ní Yorùbá àdánidá.
- source_word: οὕτως
  choice: èyí
  rationale: Ó tọ́ka padà sí ọ̀nà tí Baba gbà fi ohun hàn tàbí fi í pamọ́ nínú ẹsẹ tó ṣáájú; “èyí” mú ìtọ́kasí náà ṣe kedere.
- source_word: εὐδοκία ἐγένετο
  choice: ni ó dára
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà sọ pé ohun tí a mẹ́nu kàn jẹ́ ohun ìtẹ́wọ́gbà tàbí ohun tó mú inú Baba dùn; “dára” pa ìtumọ̀ ìtẹ́wọ́gbà mọ́ láìsọ ọ́ di àṣẹ tàbí ète tí a ti pinnu tẹ́lẹ̀.
- source_word: ἔμπροσθέν σου
  choice: lójú rẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún “níwájú rẹ” ní ìtumọ̀ ohun tí ẹni náà rí sí rere tàbí tẹ́wọ́ gbà.
theological_decisions:
- issue: Bóyá εὐδοκία yẹ kí ó túmọ̀ sí ète tàbí àṣẹ Ọlọ́run, tàbí ohun tó dára tó sì tẹ́ Baba lọ́rùn
  choice: èyí ni ó dára lójú rẹ
  alternative: èyí ni ìfẹ́ rere rẹ
  rationale: Ìtumọ̀ àkọ́kọ́ fi ìtẹ́wọ́gbà àti inú dídùn Baba hàn, ṣùgbọ́n kò fi ìtumọ̀ tó lágbára jù lọ nípa àṣẹ tàbí ète tí a ti pinnu tẹ́lẹ̀ wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì pa àdúrà tààrà àti ìtumọ̀ tí kò fi ète tàbí àṣẹ kan pàtó lé εὐδοκία lórí mọ́.
