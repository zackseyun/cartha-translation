id: MAT.11.11
reference: Matthew 11:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: yo
  text: '“Lóòótọ́ ni mo sọ fún yín: láàárín àwọn tí obìnrin bí[b], kò sí ẹni tí ó ti dìde[a] tí ó tóbi ju Jòhánù Onítẹ̀bọmi lọ. Síbẹ̀, ẹni tí ó kéré jù lọ[c] ní ìjọba ọ̀run tóbi ju òun lọ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ti gbé dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “ti dìde” tàbí “a ti gbé dìde”; níhìn-ín ó ṣeé ṣe kí ó tọ́ka sí jíjáde wá sí ojú ìtàn, kì í ṣe àjíǹde òkú.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn tí obìnrin bí” jẹ́ àṣà ọ̀rọ̀ Sẹ́mítì tí ó túmọ̀ sí àwọn ènìyàn.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ẹni tí ó kéré sí i” tàbí “ẹni kékeré jù.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ àfiwé ní gírámà, ṣùgbọ́n ó lè tọ́ka sí ẹni tí ipò tàbí ọlá rẹ̀ kéré jù lọ ní ìjọba ọ̀run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀ ìfìdí-múlẹ̀ aláṣẹ yìí jáde ní Yorùbá àdánidá, láìlo ọ̀rọ̀ àyálò “Àmín” nínú gbólóhùn.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ìtumọ̀ tààrà, tí ó sì jẹ́ ọ̀nà ìsọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: οὐκ ἐγήγερται
  choice: kò sí ẹni tí ó tíì dìde
  rationale: “Dìde” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí jíjáde wá sí ojú ìtàn; “tí ó tíì” fi ipò àkókò pípé ọ̀rọ̀-ìṣe náà hàn láìfipá sọ ọ́ di àjíǹde òkú.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: lára àwọn tí obìnrin bí
  rationale: Ó pa àṣà ọ̀rọ̀ Sẹ́mítì náà mọ́ ní Yorùbá tó ṣeé lóye, dípò yíyí i padà sí “lára gbogbo ènìyàn.”
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: tí ó tóbi ju Jòhánù Onítẹ̀bọmi lọ
  rationale: “Tóbi ju … lọ” jẹ́ àfiwé Yorùbá àdánidá; “Onítẹ̀bọmi” sì tú ipa βαπτιστής sí Yorùbá ní kedere.
- source_word: ὁ δὲ μικρότερος
  choice: Síbẹ̀, ẹni tí ó kéré jù lọ
  rationale: Ó sọ agbára ìyàtọ̀ δέ jáde, ó sì mú ìtumọ̀ ẹni tó ní ipò kékeré jù lọ hàn lọ́nà àdánidá, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ìpele àfiwé.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ní ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún gbólóhùn pàtàkì tí Mátíù máa ń lò; ó pa èrò ìjọba Ọlọ́run mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: tóbi ju òun lọ
  rationale: Ó pa àfiwé alágbára náà mọ́; “òun” tọ́ka sí Jòhánù ní kedere nínú Yorùbá.
theological_decisions:
- issue: Bí títóbi Jòhánù ṣe jọmọ́ ẹni tí ó kéré jù lọ ní ìjọba ọ̀run
  choice: A tú àfiwé méjèèjì gẹ́gẹ́ bí ó ti wà, láìṣàlàyé ohun tí ó mú ẹni tí ó kéré jù lọ ní ìjọba ọ̀run tóbi ju Jòhánù lọ.
  alternative: Kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìyàtọ̀ láàárín sáà májẹ̀mú àtijọ́ àti àǹfààní àwọn ọmọ ìjọba nínú májẹ̀mú tuntun.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò ṣàlàyé ìdí tàbí irú “títóbi” tí ó ní lọ́kàn; ìtumọ̀ náà pa àdììtú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọ “Jòhánù Onítẹ̀bọmi” jẹ́ kedere, ó ní iyì, ó sì ṣàlàyé ipa rẹ̀ láìgbára lé ọ̀rọ̀ àyálò. Gbólóhùn náà pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ mímọ́ àti ìrọ̀rùn fún òǹkàwé lasán mọ́.
