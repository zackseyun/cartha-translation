revisions:
- from: '“Lóòótọ́ ni mo sọ fún yín: lára àwọn tí obìnrin bí, kò sí ẹni tí ó tíì dìde[a] tí ó tóbi ju Jòhánù Onítẹ̀bọmi lọ[b]. Síbẹ̀, ẹni tí ó kéré jù lọ[c] ní ìjọba ọ̀run tóbi ju òun lọ.”'
  to: '“Lóòótọ́ ni mo sọ fún yín: láàárín àwọn tí obìnrin bí[b], kò sí ẹni tí ó ti dìde[a] tí ó tóbi ju Jòhánù Onítẹ̀bọmi lọ. Síbẹ̀, ẹni tí ó kéré jù lọ[c] ní ìjọba ọ̀run tóbi ju òun lọ.”'
  rationale: A rọ́pò ìkọ̀ “tí ó tíì dìde” pẹ̀lú perfect affirmative “tí ó ti dìde,” èyí tí ó pa ìtumọ̀ οὐκ ἐγήγερται mọ́ nínú ìkọ̀ àkọ́kọ́ “kò sí ẹni.” A ṣàtúnṣe akọsílẹ̀ lexical náà, a sì ṣètò àwọn àmì akọsílẹ̀ sí ibi tí wọ́n tọ́ka sí. Ìyókù gbolohun náà ni a fi sílẹ̀ nítorí ó jẹ́ olóòótọ́ sí orísun náà, ó sì jẹ́ Yorùbá àdánidá.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:24Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ètò gbogbogbò àti ìfiwéra paradoxical nínú Gíríìkì náà dáadáa. Ṣùgbọ́n “tí ó tíì dìde” jẹ́ ìkọ̀, ó sì yí οὐκ ἐγήγερται padà sí “kò tí ì sí ẹni kankan tí ó dìde,” dípò “kò sí ẹni tí ó dìde tí ó pọ̀/tóbi ju Jòhánù lọ.” A tún tún ìtumọ̀ akọsílẹ̀ a ṣe kí ó má sọ ìtumọ̀ causative kan tí ọ̀rọ̀ Gíríìkì náà kò ní.
  naturalness: Yorùbá náà ní ìròọrun, ó sì bá ìforúkọsílẹ̀ ìwé mímọ́ òde òní mu. “Láàárín àwọn tí obìnrin bí” jẹ́ ìṣọ̀kan díẹ̀ sí i ní àyíká yìí; “tóbi ju ... lọ” sì jẹ́ àfiwé àdánidá.
  terminology: “Jòhánù Onítẹ̀bọmi,” “ìjọba ọ̀run,” àti “ẹni tí ó kéré jù lọ” yẹ, wọ́n sì pa ìtumọ̀ àti àìlàyé ìtumọ̀ ẹ̀kọ́ ìjọsìn Gíríìkì mọ́. A ti gbe àmì akọsílẹ̀ “àwọn tí obìnrin bí” sún mọ́ ọ̀rọ̀ tí akọsílẹ̀ náà ń ṣàlàyé.
  issues:
  - severity: high
    issue: “tí ó tíì dìde” nínú gbolohun akọkọ
    rationale: Tíì jẹ́ ọ̀rọ̀ ìkọ̀ nínú Yorùbá, nítorí náà ó lè túmọ̀ sí pé kò sí ẹni tí ó ti dìde rárá. Gíríìkì náà sọ pé kò sí ẹni tí ó dìde tí ó pọ̀ ju Jòhánù lọ; “tí ó ti dìde” ni ó yẹ.
  - severity: medium
    issue: Àkọsílẹ̀ a sọ “jẹ́ kí ó dìde” gẹ́gẹ́ bí àṣàyàn
    rationale: ἐγήγερται jẹ́ perfect passive, kì í ṣe causative “jẹ́ kí ó dìde.” Àṣàyàn tó bá a mu ni “a ti gbé dìde.”
  - severity: low
    issue: Àmì akọsílẹ̀ b wà lẹ́yìn orúkọ Jòhánù
    rationale: Àkọsílẹ̀ b ṣàlàyé “àwọn tí obìnrin bí”; fífi àmì náà tẹ̀lé gbólóhùn yẹn mú ìtọ́kasí rẹ̀ hàn kedere.
