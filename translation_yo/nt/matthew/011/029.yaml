id: MAT.11.29
reference: Matthew 11:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: yo
  text: Ẹ gbé àjàgà mi lé ọrùn yín, ẹ sì kọ́ láti ọ̀dọ̀ mi, nítorí ẹni pẹ̀lẹ́[a] àti onírẹ̀lẹ̀ ní ọkàn ni mí, ẹ ó sì rí ìsinmi fún ọkàn yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oníwà tútù àti ẹni ìrẹ̀lẹ̀ ní ọkàn.”
    reason: Àṣàyàn ọ̀rọ̀ fún πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ; ó ń pa ìtumọ̀ ìwà pẹ̀lẹ́ àti ìrẹ̀lẹ̀ inú mọ́.
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Ẹ gba àjàgà mi sí ọrùn yín
  rationale: Àṣẹ náà ń pe àwọn olùgbọ́ púpọ̀ láti fi ara wọn sábẹ́ àjàgà Jésù. Fífi “sí ọrùn yín” hàn mú àwòrán àjàgà náà yé kedere ní Yorùbá láì sọ àpèjúwe náà di àsọyé lásán.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: kí ẹ sì kọ́ láti ọ̀dọ̀ mi
  rationale: Èyí fi àṣẹ kejì hàn lọ́nà Yorùbá àdánidá, ó sì pa èrò kíkẹ́kọ̀ọ́ lọ́dọ̀ Jésù mọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń ṣàlàyé ìdí tí ó fi yẹ kí wọ́n kọ́ láti ọ̀dọ̀ rẹ̀.
- source_word: πραΰς
  choice: oníwà tútù
  rationale: Ó túmọ̀ sí ìwà pẹ̀lẹ́ tí kì í le koko tàbí hùwà ipá; “oníwà tútù” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, láì túmọ̀ sí àìlera.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: mo sì ní ìrẹ̀lẹ̀ ọkàn
  rationale: Ó pa ìrẹ̀lẹ̀ gẹ́gẹ́ bí ìwà inú mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣeé lóye.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: ẹ ó sì rí ìsinmi
  rationale: Ọ̀rọ̀ ọjọ́ iwájú náà jẹ́ ìlérí tààrà, “ìsinmi” sì pa ìtumọ̀ ἀνάπαυσις àti ìró èdè Ìwé Mímọ́ mọ́.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: fún ọkàn yín
  rationale: Dátífù náà jẹ́ àdánidá ní Yorùbá pẹ̀lú “fún.” “Ọkàn” níbí ń tọ́ka sí ìyè inú tàbí gbogbo ẹni, kì í ṣe ẹ̀yà ara nìkan.
theological_decisions:
- issue: Àpèjúwe ìwà Jésù nínú πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: oníwà tútù ni mí, mo sì ní ìrẹ̀lẹ̀ ọkàn
  alternative: ẹni pẹ̀lẹ́ àti ẹni rírẹ̀lẹ̀ ní ọkàn ni mí
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ tí Jésù sọ nípa ara rẹ̀ mọ́, ó sì fi ìwà pẹ̀lẹ́ àti ìrẹ̀lẹ̀ inú hàn láì fi àìlera kún πραΰς tàbí yanju ẹ̀kọ́ ìgbàgbọ́ kan tí ọ̀rọ̀ náà kò sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán “àjàgà” mọ́ dípò píparọ̀ rẹ̀ sí ìgbọràn tàbí ẹ̀kọ́ nìkan.
