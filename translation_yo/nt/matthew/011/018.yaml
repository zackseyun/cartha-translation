id: MAT.11.18
reference: Matthew 11:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: yo
  text: Nítorí Johanu wá, kò jẹ, kò sì mu,[a] wọ́n sì ń wí pé, ‘Ó ní ẹ̀mí èṣù.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Ẹ̀mí èṣù ti gbà á.’ Ní ti gangan, Gíríìkì náà ní, ‘Ó ní ẹ̀mí èṣù.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: wá
  rationale: Ọ̀rọ̀ aorist ἔρχομαι tọ́ka sí bí Johanu ṣe dé sí àárín àwọn ènìyàn láti bẹ̀rẹ̀ iṣẹ́ rẹ̀; ‘wá’ jẹ́ ọ̀nà àdánidá, ṣókí ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ọ̀rọ̀ tí ó ṣáájú; ‘Nítorí’ pa ìbáṣepọ̀ àlàyé yẹn mọ́.
- source_word: Ἰωάννης
  choice: Johanu
  rationale: Orúkọ Yorùbá tí a sábà máa ń lò fún Ἰωάννης, ẹni tí àyíká ọ̀rọ̀ fi hàn pé Johanu Onítẹ̀bọmi ni.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: kò jẹ, kò sì mu
  rationale: Èyí pa ìṣọ̀kan μήτε…μήτε àti ìgbé ayé àìjẹ-àìmu Johanu mọ́ láìfi ‘àkàrà’ tàbí ‘wáìnì’ kún ohun tí Gíríìkì ẹsẹ̀ yìí kò sọ.
- source_word: καὶ λέγουσιν
  choice: wọ́n sì ń wí pé
  rationale: ‘ń wí’ ṣàfihàn ìṣe tí ó ń lọ tàbí ọ̀rọ̀ tí àwọn ènìyàn máa ń sọ, nígbà tí ‘wọ́n’ kò sọ àwọn olùfisùn náà ní pàtó, gẹ́gẹ́ bí Gíríìkì.
- source_word: Δαιμόνιον ἔχει
  choice: Ó ní ẹ̀mí èṣù
  rationale: Èyí tẹ̀lé ìtumọ̀ gígùn pé ‘ó ní ẹ̀mí èṣù,’ ó sì yà δαιμόνιον sọ́tọ̀ kúrò nínú διάβολος. ‘Ẹ̀mí èṣù’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹ̀mí búburú.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ẹ̀sùn tó ní δαιμόνιον nínú rẹ̀
  choice: Ó ní ẹ̀mí èṣù
  alternative: Ẹ̀mí èṣù ti gbà á
  rationale: Ẹsẹ̀ náà ń ròyìn ẹ̀sùn tí àwọn ènìyàn fi kan Johanu, kì í ṣe pé akọ̀wé ń fìdí rẹ̀ múlẹ̀. Ìtumọ̀ tí a yàn dúró sítòsí ọ̀rọ̀ Gíríìkì, kò sì fi ìtumọ̀ tó lágbára ju ohun tí a kọ sí i kún un.
translation_notes:
  register: Yorùbá àṣàdéédé pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A pa ìsọ̀rọ̀ ṣókí μήτε…μήτε mọ́, láìfi oúnjẹ tàbí ohun mímu kan pàtó kún un.
