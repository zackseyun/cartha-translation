  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì dáadáa: ‘kí ni’ ń béèrè ohun tí wọ́n jáde lọ láti rí; ‘Wòlíì kan?’ ń pa ìbéèrè kúkúrú náà mọ́; ‘Bẹ́ẹ̀ ni’ túmọ̀ ναί; ‘ó sì ju wòlíì lọ’ sì dá καὶ περισσότερον προφήτου padà láì ṣàlàyé ipò Jòhánù ju ohun tí ọ̀rọ̀ náà sọ lọ.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá òde òní tó níyì, tó sì rọrùn láti ka. Fífi ‘láti’ sí ‘jáde lọ láti wò’ mú ète tí infinitive ἰδεῖν ń sọ hàn kedere, láì yi ìtumọ̀ padà.
  terminology: ‘Wòlíì’ jẹ́ ọ̀rọ̀ tó yẹ fún προφήτης. ‘Ó sì ju wòlíì lọ’ jẹ́ ìfiwéra Yorùbá tó dára, ó sì yẹ kí a má ṣe fi ‘ẹni tó tóbi’ sínú ọ̀rọ̀ pàtàkì, nítorí èyí lè mú ìtumọ̀ tí a ti ṣàlàyé wọlé.
  issues:
