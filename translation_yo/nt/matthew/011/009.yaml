    issue: Ibi àmì akọsílẹ̀ [a]
    rationale: Nínú English POB audit trail, akọsílẹ̀ náà so mọ́ ‘Yes.’ Nínú àtúnṣe Yorùbá, ó yẹ kí àmì náà wà lẹ́yìn ‘Bẹ́ẹ̀ ni’ dípò ní òpin ẹsẹ̀, kí anchor náà lè bá ohun tí akọsílẹ̀ ń ṣàlàyé mu.
  - severity: low
    issue: Ìsọ̀rọ̀ ní ‘jáde lọ wò’
    rationale: Ó ṣeé lóye, ṣùgbọ́n ‘jáde lọ láti wò’ fi ìbáṣepọ̀ ète tí ἰδεῖν ní hàn kedere sí i nínú Yorùbá.
  - severity: low
    issue: Ọ̀rọ̀ akọsílẹ̀ ‘Ní ti gidi’
    rationale: ‘Ní ti ọ̀rọ̀ gangan’ jẹ́ ọ̀nà tó péye jù láti ṣàfihàn pé a ń sọ nípa ìtumọ̀ gangan, kì í ṣe ìmúdájú ‘ní ti gidi.’
