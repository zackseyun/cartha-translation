id: MAT.11.9
reference: Matthew 11:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: yo
  text: Ṣùgbọ́n kí ni ẹ jáde lọ láti wò? Wòlíì kan? Bẹ́ẹ̀ ni,[a] mo sọ fún yín, ó sì ju wòlíì lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti ọ̀rọ̀ gangan, Gíríìkì náà ní, “ó ju wòlíì lọ”; a tún lè túmọ̀ rẹ̀ sí, “ẹni tó tóbi ju wòlíì lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìbéèrè yìí ṣe ìyàtọ̀ sí àwọn ìbéèrè àsọyé tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé ní àyíká yìí.
- source_word: τί ἐξήλθατε
  choice: kí ni ẹ jáde lọ
  rationale: τί túmọ̀ sí ohun tí wọ́n jáde lọ láti rí, kì í ṣe ìdí tí wọ́n fi jáde; ‘kí ni’ pa ìtumọ̀ ohun tí ìbéèrè náà ń béèrè mọ́.
- source_word: ἰδεῖν
  choice: wò
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ àìlẹ́ni tó ń sọ ète ìjáde wọn; ‘lọ wò’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: προφήτην
  choice: Wòlíì kan
  rationale: Ọ̀rọ̀ náà kò ní article, ìbéèrè náà sì ń tọ́ka sí ẹni kan nínú irú àwọn wòlíì; ‘kan’ mú èyí ṣe kedere ní Yorùbá.
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó jẹ́ ìdáhùn ìfìdí-múlẹ̀ tààrà sí ìbéèrè àsọyé náà.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ gbólóhùn àdánidá, tó sì tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kí-pẹ́kí láì di Yorùbá àjèjì.
- source_word: καὶ περισσότερον προφήτου
  choice: ó sì ju wòlíì lọ
  rationale: περισσότερον pẹ̀lú genitive προφήτου ń ṣe ìfiwéra. Yorùbá nílò kókó ọ̀rọ̀ tí a mọ̀ láti inú àyíká, nítorí náà ‘ó’ ń tọ́ka sí Jòhánù láì fi àlàyé míì kún un.
theological_decisions:
- issue: Ipò Jòhánù Onítẹ̀bọmi nínú ọ̀rọ̀ Jésù
  choice: ó sì ju wòlíì lọ
  alternative: ó sì jẹ́ ẹni tó tóbi ju wòlíì lọ
  rationale: Ìtumọ̀ yìí gbé Jòhánù ga ju ẹ̀ka wòlíì lọ, ṣùgbọ́n kò ṣàlàyé bí ó ṣe ju wòlíì lọ tàbí fi ẹ̀kọ́ ìsìn kan kún ohun tí gbólóhùn Gíríìkì sọ.
translation_notes:
  register: A lo Yorùbá àtijọ́-kò-jù, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì lo ‘ẹ/yín’ gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn tí Jésù ń bá sọ̀rọ̀.
