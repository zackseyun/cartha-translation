  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: yo
  text: Ṣùgbọ́n kí ni èmi yóò fi ìran yìí wé? Ó dà bí àwọn ọmọdé tí wọ́n jókòó ní àwọn ibi ọjà[a], tí wọ́n ń pè àwọn yòókù[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn gbangba ọjà.” Ọ̀rọ̀ Gíríìkì ἀγοραῖς ń tọ́ka sí àwọn àgbègbè ọjà gbangba tí àwọn ènìyàn ti máa ń péjọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí wọ́n ń pè àwọn ọmọdé yòókù.” Gíríìkì sọ pé “àwọn yòókù”; àyíká àkàwé náà ló fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: kí ni èmi yóò fi ... wé?
  rationale: Ìbéèrè olóhùn ọjọ́ iwájú náà ń wá ohun tí a ó fi ṣe àfiwé; ìṣètò ‘kí ni ... fi ... wé?’ jẹ́ Yorùbá àdánidá tí ó sì pa agbára ìbéèrè náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìyàtọ̀ díẹ̀ hàn nínú ọ̀rọ̀; ‘Ṣùgbọ́n’ bá ìyípadà àsọyé yìí mu láìfi ìtakora tó lágbára kún un.
- source_word: τὴν γενεὰν ταύτην
  choice: ìran yìí
  rationale: γενεά ń tọ́ka sí àwọn ènìyàn ìgbà kan náà tí a ń wò gẹ́gẹ́ bí ẹgbẹ́; ‘ìran yìí’ jẹ́ ọ̀rọ̀ Yorùbá tó péye, tó sì wọ́pọ̀.
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: Ó dà bí àwọn ọmọdé
  rationale: ‘Ó dà bí’ sọ ìfarajọ náà ní kedere àti ní Yorùbá àdánidá; ‘àwọn ọmọdé’ kò fi ìtumọ̀ kékeré tí àyíká kò béèrè kún un.
- source_word: καθημένοις
  choice: tí wọ́n jókòó
  rationale: Ó ṣàpèjúwe bí àwọn ọmọdé náà ṣe wà níbi náà, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ní àwọn ibi ọjà
  rationale: ἀγορά túmọ̀ sí àgbègbè ọjà tàbí gbangba ìpàdé; ‘ibi ọjà’ jẹ́ èdè òde òní tí gbogbo ènìyàn lè lóye, nígbà tí àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ gbangba náà.
- source_word: ἃ προσφωνοῦντα
  choice: tí wọ́n ń ké pe
  rationale: Ó mú ìtumọ̀ pípe tàbí sísọ̀rọ̀ sókè sí ẹlòmíràn jáde, ó sì bá àwòrán àwọn ọmọdé ní gbangba mu.
- source_word: τοῖς ἑτέροις
  choice: àwọn yòókù
  rationale: Yíyan ‘àwọn yòókù’ pa àìsọ pàtó Gíríìkì mọ́; àyíká àkàwé náà ló ń fi hàn pé àwọn ọmọdé mìíràn ni.
