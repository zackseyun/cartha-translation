  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: yo
  text: ó wí fún un pé, “Ìwọ ha ni Ẹni Tí Ń Bọ̀[a], tàbí kí a retí ẹlòmíràn?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹni tí ó ń bọ̀” tàbí “ẹni tí yóò wá.” Gbólóhùn Gíríìkì náà lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè fún Mèsáyà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: ó sì wí fún un pé
  rationale: “Wí fún un pé” jẹ́ ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ tí a sọ tààrà wọlé. “Sì” so gbólóhùn náà mọ́ ìtàn inú ẹsẹ tó ṣáájú, bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀ Gíríìkì ọ̀tọ̀ fún un nínú àyọkà tí a pèsè.
- source_word: Σὺ εἶ
  choice: Ìwọ ha ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “Ìwọ” pa ìtẹnumọ́ σύ mọ́; “ha” sì jẹ́ àmì ìbéèrè tó bójú mu nínú Yorùbá olówó iyì.
- source_word: ὁ ἐρχόμενος
  choice: Ẹni tí ń Bọ̀
  rationale: Èyí pa àwòrán ẹni tó ń bọ̀ mọ́, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè Mèsáyà láì fi ọ̀rọ̀ “Mèsáyà” kún ohun tí Gíríìkì sọ. Lílo lẹ́tà ńlá fi agbára orúkọ oyè inú àyíká hàn.
- source_word: ἢ
  choice: tàbí
  rationale: Àsopọ̀ àṣàyàn Yorùbá tó ṣe déédé pẹ̀lú ἢ.
- source_word: ἕτερον
  choice: ẹlòmíràn
  rationale: “Ẹlòmíràn” túmọ̀ sí ẹni mìíràn tàbí ẹni tí ó yàtọ̀, ó sì bá ẹni tí a ń retí mu ní ti ẹ̀dá ènìyàn.
- source_word: προσδοκῶμεν
  choice: kí a retí
  rationale: Nínú ìbéèrè àgbéyẹ̀wò yìí, “kí a retí” sọ ìtumọ̀ deliberative náà ní Yorùbá àdánidá, ó sì pa ẹni àkọ́kọ́ ọ̀pọ̀ “a” mọ́.
theological_decisions:
- issue: Agbára orúkọ oyè Mèsáyà nínú ὁ ἐρχόμενος
  choice: Ẹni tí ń Bọ̀
  alternative: ẹni tí yóò wá; ẹni tí a ń retí
  rationale: Àpilẹ̀kọ pẹ̀lú participle àti àyíká ìbéèrè Jòhánù ń tọ́ka sí ẹni ìlérí tí a ń retí. Ìtumọ̀ yìí pa àìdánilójú gírámà mọ́—ó lè jẹ́ àpèjúwe tàbí orúkọ oyè—láì sọ ọ́ di “Mèsáyà” ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo; “wí fún un pé” àti “Ìwọ ha ni” mú ìṣàn ìtàn àti ìbéèrè olówó iyì pọ̀.
