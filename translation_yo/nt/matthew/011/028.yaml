  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: yo
  text: Ẹ wá sọ́dọ̀ mi, gbogbo ẹ̀yin tí ń ṣe làálàá, tí a ti gbé ẹrù wúwo lé lórí yín,[a] èmi yóò sì fún yín ní ìsinmi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘tí a ti di ẹrù wúwo lé lórí.’ Ẹ̀yà ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí a ti gbé ẹrù lé, tí wọ́n sì ṣì wà nínú ipò tí ẹrù náà mú wá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘èmi yóò mú ara yín tù.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú kí ẹnì kan sinmi tàbí mímú ara ẹni tù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Ẹ wá sọ́dọ̀ mi
  rationale: Ọ̀rọ̀ ìpè ni Δεῦτε, πρός με sì ń tọ́ka sí wíwá sí ọ̀dọ̀ ẹni kan. ‘Ẹ wá sọ́dọ̀ mi’ jẹ́ ọ̀nà Yorùbá àdánidá, ó sì fi hàn pé ọ̀pọ̀ ènìyàn ni a ń pè.
- source_word: πάντες
  choice: gbogbo ẹ̀yin
  rationale: Ó pa ìtumọ̀ tí ó kan gbogbo àwọn tí a ṣàpèjúwe mọ́, ó sì tún mú ọ̀pọ̀-orúkọ inú ọ̀rọ̀ Gíríìkì hàn gbangba.
- source_word: οἱ κοπιῶντες
  choice: tí ń ṣe làálàá
  rationale: κοπιάω tọ́ka sí ṣíṣe iṣẹ́ àṣekára tí ń mú ènìyàn rẹ̀. ‘Ṣe làálàá’ pa ìṣe tí ó ń lọ lọ́wọ́ àti àárẹ̀ tó lè ti inú rẹ̀ jáde mọ́ láìfi àlàyé kún un.
- source_word: πεφορτισμένοι
  choice: tí ẹrù sì ń wúwo lórí yín
  rationale: Ẹ̀yà ọ̀rọ̀ yìí jẹ́ perfect passive, ó ń sọ nípa àwọn tí a ti gbé ẹrù lé tí wọ́n sì ṣì wà lábẹ́ ìnira rẹ̀. Gbólóhùn Yorùbá yìí sọ ipò ìwúwo ẹrù náà ní ọ̀nà tó ṣe kedere, tí ó sì jẹ́ àdánidá.
- source_word: κἀγὼ
  choice: èmi yóò sì
  rationale: ‘Èmi’ pa àfiyèsí díẹ̀ tí ó wà lórí ẹni tí ń sọ̀rọ̀ mọ́; ‘sì’ sì so ìlérí náà mọ́ ìpè tó ṣáájú.
- source_word: ἀναπαύσω ὑμᾶς
  choice: fún yín ní ìsinmi
  rationale: ἀναπαύω lè túmọ̀ sí mímú kí ẹnì kan sinmi tàbí jí ara rẹ̀. ‘Fún yín ní ìsinmi’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ gbígbòòrò ìlérí náà mọ́.
theological_decisions:
- issue: Irú ìsinmi tí ἀναπαύσω ń ṣèlérí
  choice: fún yín ní ìsinmi
  alternative: mú ara yín tù; fún ọkàn yín ní ìsinmi
  rationale: Ẹsẹ̀ yìí fúnra rẹ̀ kò sọ pé ìsinmi náà jẹ́ ti ara, ti ọkàn, ti ẹ̀mí, tàbí ti ọjọ́ iwájú nìkan. Ìtumọ̀ gbígbòòrò yìí pa gbogbo ààyè ìtumọ̀ náà mọ́, kò sì fi ẹ̀kọ́ ìsìn kan tí kò hàn gbangba sínú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àmì ohùn kún ibi tí ó yẹ. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘Ẹ/ẹ̀yin/yín’ bá πάντες àti ὑμᾶς mu. A gbe àmì àlàyé [a] lẹ́yìn gbólóhùn tó túmọ̀ πεφορτισμένοι, àti [b] lẹ́yìn ìlérí ἀναπαύσω, kí àmì kọ̀ọ̀kan lè bá àlàyé rẹ̀ mu.
