id: MAT.11.20
reference: Matthew 11:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: yo
  text: Nígbà náà ni ó bẹ̀rẹ̀ sí í bá àwọn ìlú níbi tí ọ̀pọ̀ jù lọ nínú àwọn iṣẹ́ agbára rẹ̀ ti ṣẹlẹ̀ wí[a], nítorí wọn kò ronúpìwàdà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè tú “àwọn iṣẹ́ agbára” sí “àwọn iṣẹ́ ìyanu” tàbí “àwọn iṣẹ́ alágbára” (Gíríìkì: dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àmì àkókò tó ń ṣí ìpele tuntun nínú ìtàn; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá.
- source_word: ἤρξατο ὀνειδίζειν
  choice: ó bẹ̀rẹ̀ sí í ... wí
  rationale: “Ó bẹ̀rẹ̀ sí í” pa ìtumọ̀ ìbẹ̀rẹ̀ iṣẹ́ náà mọ́; “bá ... wí” sì fi ẹ̀gàn tàbí ìbániwí tó wà nínú ὀνειδίζω hàn láì sọ ọ́ di ìdálẹ́bi ní ilé ẹjọ́.
- source_word: τὰς πόλεις ἐν αἷς
  choice: àwọn ìlú tí ... níbẹ̀
  rationale: Èyí túmọ̀ ìbátan ibi náà ní Yorùbá tó ṣe déédé, ó sì jẹ́ kí “àwọn ìlú” dúró gẹ́gẹ́ bí ẹni tí a ń bá wí.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: ó ti ṣe ọ̀pọ̀ jù lọ nínú iṣẹ́ agbára rẹ̀
  rationale: “Ó ti ṣe” fi hàn pé àwọn iṣẹ́ náà ti ṣẹlẹ̀ ṣáájú ìbániwí; “ọ̀pọ̀ jù lọ” pa superlative πλεῖσται mọ́; “iṣẹ́ agbára” sì fi ìtumọ̀ δύναμις gẹ́gẹ́ bí iṣẹ́ alágbára tàbí iṣẹ́ ìyanu hàn.
- source_word: ὅτι οὐ μετενόησαν
  choice: nítorí wọn kò ronúpìwàdà
  rationale: “Nítorí” sọ ìdí ìbániwí náà; “ronúpìwàdà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìwọ̀n ìtumọ̀ ìyípadà ọkàn àti ìpadà kúrò nínú ẹ̀ṣẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δυνάμεις ní àyíká iṣẹ́ ìyanu
  choice: iṣẹ́ agbára
  alternative: iṣẹ́ ìyanu
  rationale: “Iṣẹ́ agbára” pa ìfarahàn agbára tó wà nínú ọ̀rọ̀ Gíríìkì mọ́, láì dín un kù sí ẹ̀ka “iṣẹ́ ìyanu” nìkan; àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ọ̀nà míì.
- issue: Ìtumọ̀ μετενόησαν
  choice: wọn kò ronúpìwàdà
  alternative: wọn kò yí ọkàn wọn padà
  rationale: “Ronúpìwàdà” jẹ́ ọ̀rọ̀ tó bójú mu fún ìdáhùn ìwà àti ti ẹ̀mí tí ọrọ̀ náà ń béèrè, láì fi ẹ̀kọ́ ẹ̀sìn ẹ̀ka kan kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Ìṣètò gbólóhùn náà jẹ́ ti Yorùbá àdánidá, ṣùgbọ́n ó pa ìbẹ̀rẹ̀ ìṣe, iye tó pọ̀ jù, àti ìdí ìbániwí inú Gíríìkì mọ́.
