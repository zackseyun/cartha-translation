revisions:
- from: Nígbà náà ni ó bẹ̀rẹ̀ sí í bá àwọn ìlú tí ó ti ṣe ọ̀pọ̀ jù lọ nínú iṣẹ́ agbára rẹ̀ níbẹ̀ wí[a], nítorí wọn kò ronúpìwàdà.
  to: Nígbà náà ni ó bẹ̀rẹ̀ sí í bá àwọn ìlú níbi tí ọ̀pọ̀ jù lọ nínú àwọn iṣẹ́ agbára rẹ̀ ti ṣẹlẹ̀ wí[a], nítorí wọn kò ronúpìwàdà.
