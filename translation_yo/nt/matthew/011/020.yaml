    text: 'A tún lè tú “àwọn iṣẹ́ agbára” sí “àwọn iṣẹ́ ìyanu” tàbí “àwọn iṣẹ́ alágbára” (Gíríìkì: dynameis).'
    reason: lexical_alternative
  revision_rationale: The revision preserves the meaning and register of the draft while improving the locative relative construction, explicitly reflecting the plural mighty works, and retaining the source's event-focused wording.
