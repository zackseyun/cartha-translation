id: MAT.11.7
reference: Matthew 11:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: yo
  text: Nígbà tí àwọn ọkùnrin wọ̀nyí sì ń lọ, Jésù bẹ̀rẹ̀ sí í sọ̀rọ̀ sí àwọn ènìyàn nípa Jòhánù pé, “Kí ni ẹ jáde lọ sí aginjù láti wò[a]? Esùsú kan tí afẹ́fẹ́ ń mì[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti rí?”
    reason: lexical_alternative
  - marker: b
    text: Àwòrán esùsú tí afẹ́fẹ́ ń mì lè tọ́ka sí àìdúróṣinṣin tàbí yíyí ọkàn padà; ìbéèrè Jésù ń retí ìdáhùn òdì nípa Jòhánù.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Nígbà tí àwọn ọkùnrin wọ̀nyí sì ń lọ
  rationale: Gbólóhùn yìí fi hàn pé ìlọ wọn àti bí Jésù ṣe bẹ̀rẹ̀ sí í sọ̀rọ̀ ṣẹlẹ̀ ní àkókò kan náà. “Àwọn ọkùnrin wọ̀nyí” mú kí ó ṣe kedere ní Yorùbá pé àwọn ọmọ-ẹ̀yìn Jòhánù tí a mẹ́nu kàn ṣáájú ni a ń tọ́ka sí.
- source_word: ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις
  choice: Jésù bẹ̀rẹ̀ sí í bá àwọn èrò sọ̀rọ̀
  rationale: “Bẹ̀rẹ̀ sí í” ṣe àfihàn ἤρξατο pẹ̀lú infinitive, “bá ... sọ̀rọ̀” sì jẹ́ ọ̀nà àdánidá láti sọ pé ó ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀.
- source_word: περὶ Ἰωάννου
  choice: nípa Jòhánù
  rationale: περί pẹ̀lú genitive ń tọ́ka sí kókó ọ̀rọ̀; “nípa” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Kí ni ẹ jáde lọ sí aginjù láti wò?
  rationale: τί jẹ́ ìbéèrè “kí ni?” kì í ṣe “kí ló dé?”, θεάσασθαι sì ní ìtumọ̀ wíwo ohun kan pẹ̀lú àfiyèsí. “Aginjù” bá àyíká ilẹ̀ Jùdíà mu.
- source_word: κάλαμον ὑπὸ ἀνέμου σαλευόμενον
  choice: Esùsú kan tí afẹ́fẹ́ ń mì
  rationale: “Esùsú” ni ìtumọ̀ gígùn-ún-rẹ́rẹ́ κάλαμος níbí, “tí afẹ́fẹ́ ń mì” sì pa ìṣe passive participle mọ́ ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí Τούτων (“àwọn wọ̀nyí”) ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí “àwọn ọkùnrin wọ̀nyí,” ìyẹn àwọn ọmọ-ẹ̀yìn Jòhánù nínú àyíká ẹsẹ tó ṣáájú.
  alternative: A lè sọ pé “wọ́n” tàbí “àwọn wọ̀nyí” láì sọ pé ọkùnrin ni wọ́n.
  rationale: Ṣíṣe ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ní kedere ń mú ìtàn náà rọrùn láti lóye, kò sì fi ẹ̀kọ́ ìgbàgbọ́ tuntun kún un.
- issue: Ìtumọ̀ àwòrán esùsú tí afẹ́fẹ́ ń mì
  choice: A pa á mọ́ gẹ́gẹ́ bí ìbéèrè àfiwé tí ó ń retí ìdáhùn òdì nípa Jòhánù.
  alternative: A lè ṣàlàyé ìtumọ̀ rẹ̀ tààrà nínú ẹsẹ pé Jòhánù kì í ṣe aláìdúróṣinṣin.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àwòrán àti ìbéèrè dípò àlàyé tààrà; títọ́jú irú ọ̀nà yìí kò jẹ́ kí ìtumọ̀ yanju ohun tí òǹkọ̀wé fi sílẹ̀ gẹ́gẹ́ bí àfiwé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Àwọn èrò” jẹ́ ọ̀nà àdánidá láti ṣe plural τοῖς ὄχλοις, “esùsú” sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lásán lè lóye.
