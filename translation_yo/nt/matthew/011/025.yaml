id: MAT.11.25
reference: Matthew 11:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: yo
  text: Ní àkókò náà, Jésù dáhùn, ó sì wí pé, “Mo yin ọ́, Baba, Olúwa ọ̀run àti ayé, nítorí pé o fi àwọn nǹkan wọ̀nyí pamọ́ fún àwọn ọlọ́gbọ́n àti àwọn olóye, o sì ṣí wọn payá fún àwọn ọmọ ọwọ́.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ kékeré.” Ó ṣeé ṣe kí “àwọn ọmọ ọwọ́” jẹ́ àpèjúwe àwọn tí wọ́n jẹ́ onírẹ̀lẹ̀ tàbí tí wọ́n múra tán láti gba ọ̀rọ̀ bí ọmọ kékeré.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Ní àkókò náà
  rationale: Ó jẹ́ gbólóhùn àkókò tó bá Yorùbá òde òní mu, tí kò sì sọ pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ lójú ẹsẹ̀.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: dáhùn pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti gbé àkópọ̀ ọ̀rọ̀ Gíríìkì náà jáde, kódà nígbà tí kò sí ìbéèrè kan tí a mẹ́nu kàn ṣáájú.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Mo yin ọ́
  rationale: Nínú ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń fi ìjẹ́wọ́ gbangba tí ó kún fún ìyìn tàbí ọpẹ́ hàn; ‘Mo yin ọ́’ mú ohùn ìjọsìn náà jáde láìdá a mọ́ ìjẹ́wọ́ ẹ̀ṣẹ̀.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Baba, Olúwa ọ̀run àti ayé
  rationale: Ó pa ìpè méjèèjì mọ́, ó sì fi àṣẹ Baba lórí ọ̀run àti ayé hàn ní èdè Bíbélì tó ṣe kedere.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó fi ìdí tàbí ohun tí ó fa ìyìn Jésù hàn ní kedere.
- source_word: ἔκρυψας
  choice: o fi ... pamọ́
  rationale: Ó túmọ̀ ìṣe taara tí ọ̀rọ̀ Gíríìkì fi fún Baba, láìrọ̀ ọ́ sí èdè ìyọ̀ǹda.
- source_word: ταῦτα ... αὐτά
  choice: àwọn nǹkan wọ̀nyí ... wọn
  rationale: Ó pa ìtọ́ka orísun náà mọ́ láìṣàlàyé ohun tí ‘àwọn nǹkan wọ̀nyí’ jẹ́ ju bí àyíká ọ̀rọ̀ ṣe sọ lọ.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: fún àwọn ọlọ́gbọ́n àti àwọn olóye
  rationale: Àwọn ọ̀rọ̀ méjèèjì pa ìyàtọ̀ kékeré mọ́ láàárín ọgbọ́n àti òye, wọ́n sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἀπεκάλυψας
  choice: o sì ṣí wọn payá
  rationale: ‘Ṣí ... payá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ohun tí ó farapamọ́ hàn.
- source_word: νηπίοις
  choice: àwọn ọmọ ọwọ́
  rationale: Ó pa àwòrán ọmọ kékeré mọ́, dípò kí a rọ́pò rẹ̀ pẹ̀lú ìtumọ̀ àlàyé bí ‘àwọn onírẹ̀lẹ̀.’
theological_decisions:
- issue: Ìṣe Ọlọ́run nínú fífi pamọ́ àti ṣíṣí payá
  choice: 'Pa ìṣe taara Baba mọ́: ‘o fi ... pamọ́ ... o sì ṣí ... payá.’'
  alternative: ‘O jẹ́ kí ó wà ní ìpamọ́’ tàbí ọ̀rọ̀ ìyọ̀ǹda mìíràn.
  rationale: Àwọn ọ̀rọ̀ ìṣe Gíríìkì jẹ́ aláṣe, Baba sì ni olùṣe. Ìtumọ̀ náà pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
- issue: Ìtumọ̀ νηπίοις
  choice: ‘Àwọn ọmọ ọwọ́,’ pẹ̀lú àlàyé pé ó lè jẹ́ àwòrán àwọn tó gba ọ̀rọ̀ bí ọmọ kékeré.
  alternative: ‘Àwọn ọmọ kékeré’ tàbí ìtumọ̀ àlàyé ‘àwọn onírẹ̀lẹ̀.’
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ọmọ ọwọ́ ní ti gidi, ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó jẹ́ àpèjúwe. A pa àwòrán náà àti àìdánilójú tó tọ́ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní ọ̀wọ̀, tó ṣe kedere, tí ó sì bá kíkà ní gbangba mu. A lo ‘ń’ inú ‘nǹkan’ gẹ́gẹ́ bí àkọtọ̀ Yorùbá tó wọ́pọ̀, a sì fi àmì ohùn síbi tí ó yẹ.
