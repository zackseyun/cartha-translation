    rationale: Ó lè tọ́ka sí àwọn ènìyàn alágbára lásán. “Àwọn oníìfipá” ń pa ìtumọ̀ forceful/violent ti βιασταί mọ́, nígbà tí a kò fi ìtumọ̀ kan tí kò dájú kún un.
