id: MAT.11.12
reference: Matthew 11:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: yo
  text: Ṣùgbọ́n láti ọjọ́ Jòhánù Oníbatisí títí di ìsinsin yìí, ìjọba ọ̀run ń fara da ìwà ipá, àwọn oníwà ipá sì ń fi ipá gbà á.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjọba ọ̀run ń tẹ̀ síwájú pẹ̀lú agbára, àwọn oníìfipá sì ń di i mú.” Ọ̀rọ̀-ìṣe Gíríìkì tí a túmọ̀ sí “ń fara da ìwà ipá” tún lè ní ìtumọ̀ àárín.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Ṣùgbọ́n láti
  rationale: “Láti” fi ìbẹ̀rẹ̀ àkókò hàn, “ṣùgbọ́n” sì pa ìyípadà kékeré nínú ọ̀rọ̀ mọ́ láì sọ ọ́ di àtakò líle.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: ọjọ́ Jòhánù Oníbatisí
  rationale: Èyí pa àwòrán èdè Gíríìkì ti “àwọn ọjọ́” mọ́ ní ọ̀nà tí ó ṣeé lóye ní Yorùbá; “Oníbatisí” ń tọ́ka sí ẹni tí ń ṣe ìbatisí.
- source_word: ἕως ἄρτι
  choice: títí di ìsinsin yìí
  rationale: Gbólóhùn Yorùbá àdánidá fún ìtẹ̀síwájú láti àkókò Jòhánù dé àkókò tí Jésù ń sọ̀rọ̀.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún gbólóhùn pàtàkì tí Mátíù máa ń lò, ó sì lè túmọ̀ sí ìjọba tàbí ìṣàkóso tó ní í ṣe pẹ̀lú ọ̀run.
- source_word: βιάζεται
  choice: ń jìyà ìwà ipá
  rationale: A yan ìtumọ̀ aláìṣe ti ọ̀rọ̀ Gíríìkì náà nínú àkọ́kọ́, nítorí ó bá gbólóhùn tó tẹ̀ lé nípa àwọn oníwà ipá mu; àìdánilójú gidi rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: βιασταὶ
  choice: àwọn oníwà ipá
  rationale: Ó ṣàfihàn àwọn ẹni tí ń lo agbára tàbí ìwà ipá. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, Yorùbá kò fi akọ hàn ní ọ̀nà kan náà, nítorí náà “àwọn oníwà ipá” ni àdánidá jù.
- source_word: ἁρπάζουσιν αὐτήν
  choice: ń fi agbára gbà á
  rationale: Ó pa ìtumọ̀ gbígba ohun kan pẹ̀lú agbára mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere ju ìtumọ̀ gígún lọ.
theological_decisions:
- issue: Ìtumọ̀ βιάζεται ní ìbáṣepọ̀ pẹ̀lú ìjọba ọ̀run
  choice: 'A lò ìtumọ̀ aláìṣe nínú àkọ́kọ́: “ìjọba ọ̀run ń jìyà ìwà ipá.”'
  alternative: 'A lè lóye rẹ̀ ní ìtumọ̀ àárín/aláìrékọjá pé: “ìjọba ọ̀run ń tẹ̀ síwájú pẹ̀lú agbára.”'
  rationale: Èdè Gíríìkì náà ní àìdánilójú gidi. Ìtumọ̀ aláìṣe bá ọ̀rọ̀ nípa àwọn oníwà ipá tó ń fi agbára gbà á mu, ṣùgbọ́n ìtumọ̀ pé ìjọba ń tẹ̀ síwájú pẹ̀lú agbára náà ní ẹ̀rí èdè tó lágbára; nítorí náà a pa á mọ́ nínú àlàyé dípò kí a yanju ìforígbárí náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ìsinsin yìí” fún àkókò ìsinsin àti “fi agbára gbà” láti mú ìwà ipá inú ἁρπάζω hàn.
