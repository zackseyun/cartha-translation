  source_fidelity: Ìtumọ̀ àkọ́kọ́ ń pa ìbẹ̀rẹ̀ àkókò, ìjọba ọ̀run, ìtumọ̀ aláìṣe tí ó ṣeé ṣe fún βιάζεται, àti ìṣe ìfi-ipá-n-gba ti ἁρπάζω mọ́. Ṣùgbọ́n “ń fi agbára gbà á” lè túmọ̀ sí gbigba tàbí ìtẹ́wọ́gbà pẹ̀lú agbára, kì í sì fi ìtumọ̀ ìfipá ti ἁρπάζω hàn kedere tó. “Ń fara da ìwà ipá” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere jù fún ìtumọ̀ passive náà.
