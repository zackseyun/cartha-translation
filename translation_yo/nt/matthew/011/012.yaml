  to: Ṣùgbọ́n láti ọjọ́ Jòhánù Oníbatisí títí di ìsinsin yìí, ìjọba ọ̀run ń fara da ìwà ipá, àwọn oníwà ipá sì ń fi ipá gbà á.[a]
  rationale: Àtúnṣe náà mú kí ìwà ipá nínú ìṣe àwọn βιασταί àti ἁρπάζουσιν hàn kedere síi, ó sì mú kí gbolohun passive nínú àkọ́kọ́ dáa síi ní Yorùbá. Àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ àárín/intransitive tí a ń jiyàn rẹ̀ mọ́, láì yanju àìdánilójú Gíríìkì náà.
