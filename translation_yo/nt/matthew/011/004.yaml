source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: yo
  text: 'Jésù sì dá wọn lóhùn[a] pé, “Ẹ lọ ròyìn fún Jòhánù ohun tí ẹ ń gbọ́ àti ohun tí ẹ ń rí:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ gangan, “Jésù sì dáhùn, ó sì wí fún wọn pé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ẹsẹ̀ yìí pọ̀ mọ́ ìtàn tó ṣáájú lọ́nà àdánidá, láìfi ìtumọ̀ àkókò kún un.
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: dá wọn lóhùn … pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ìlò ọ̀rọ̀ Gíríìkì náà hàn; ó pa ìṣe dídáhùn àti ìfihàn ẹni tí a ń bá sọ̀rọ̀ mọ́, láìjẹ́ kí gbólóhùn náà le koko.
- source_word: Πορευθέντες
  choice: Ẹ lọ
  rationale: Ọ̀rọ̀ alábápín yìí ń bá àṣẹ tó tẹ̀ lé e ṣiṣẹ́, nítorí náà “Ẹ lọ” fi agbára àṣẹ àti ìtẹ̀lé ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: ἀπαγγείλατε
  choice: ròyìn fún
  rationale: “Ròyìn fún” túmọ̀ sí jíṣẹ́ ohun tí ẹni náà ti gbọ́ tàbí rí padà fún ẹlòmíràn, ó sì bá iṣẹ́ àwọn aṣojú Jòhánù mu.
- source_word: Ἰωάννῃ
  choice: fún Jòhánù
  rationale: Dátífù náà ń tọ́ka sí ẹni tí wọn yóò jíṣẹ́ fún; “fún Jòhánù” ni ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: ohun tí ẹ ń gbọ́ àti ohun tí ẹ ń rí
  rationale: Àtúnsọ “ohun tí” jẹ́ kí àwọn ìrírí méjèèjì—gbọ́ àti rí—ṣe kedere, nígbà tí àmì “ń” fi ìṣe tó ń lọ lọ́wọ́ hàn.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A kọ orúkọ náà ní ìlànà Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àkójọpọ̀ ọ̀rọ̀ ìtàn ἀποκριθεὶς … εἶπεν
  choice: Jésù sì dá wọn lóhùn pé
  alternative: Jésù sì dáhùn, ó sì wí fún wọn pé
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá tó rọrùn, tó sì pa iṣẹ́ ọ̀rọ̀ Gíríìkì mọ́. Àṣàyàn kejì túmọ̀ ìṣètò ọ̀rọ̀ náà ní tààràtà sí i, ṣùgbọ́n ó tún ohun kan náà sọ ní ọ̀nà tí kò fi bẹ́ẹ̀ jẹ́ àdánidá. Kò sí ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ láàárín wọn.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹ” fi hàn pé ọ̀pọ̀ ènìyàn ni Jésù ń bá sọ̀rọ̀. Àmì ìdákẹ́jẹ méjì ní òpin fi hàn pé ọ̀rọ̀ Jésù ń bá a lọ ní ẹsẹ̀ tó tẹ̀ lé e.
