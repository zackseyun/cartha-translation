id: MAT.11.30
reference: Matthew 11:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: yo
  text: Nítorí àjàgà mi dára, ẹrù mi sì fẹ́rẹ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: àjàgà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ohun tí a fi ń so ẹranko pọ̀ fún iṣẹ́; ní àpẹẹrẹ, ó tọ́ka sí ìtẹríba fún àṣẹ àti ẹ̀kọ́ Jesu.
- source_word: χρηστός
  choice: dára
  rationale: χρηστός lè túmọ̀ sí ohun tí ó dára, tí ó ṣàǹfààní, tí kò sì le koko fún ẹni tí ó ń lò ó. “Dára” pa ìtumọ̀ rere àti ìrẹ̀lẹ̀ ọ̀rọ̀ náà mọ́ láì sọ ọ́ di “rọrùn” nìkan.
- source_word: φορτίον
  choice: ẹrù
  rationale: “Ẹrù” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a gbé, ó sì bá àwòrán inú ẹsẹ yìí mu.
- source_word: ἐλαφρόν
  choice: fẹ́rẹ́
  rationale: “Fẹ́rẹ́” túmọ̀ sí pé ẹrù náà kò wúwo, èyí sì jẹ́ ìtumọ̀ tààrà ti ἐλαφρόν ní àyíká ọ̀rọ̀ yìí.
theological_decisions:
- issue: Ìtumọ̀ χρηστός nípa àjàgà Jesu
  choice: dára
  alternative: rọrùn; jẹ́ onínúure
  rationale: A kò sọ pé ìtẹ̀lé Jesu kò ní ìṣòro rárá; “dára” fi hàn pé àjàgà rẹ̀ yẹ, ó ṣàǹfààní, kò sì ní ìwà líle. Ó tún yẹra fún fífi ànímọ́ ènìyàn “onínúure” mọ́ àjàgà lọ́nà tí kò bá Yorùbá mu.
translation_notes:
  register: Yorùbá boṣewa, kúkúrú, ọ̀wọ̀, àti èdè tí ó ṣeé lóye. A lo “àjàgà” gẹ́gẹ́ bí àwòrán pàtàkì inú Gíríìkì, a sì fi àmì ohùn sí gbogbo ọ̀rọ̀ níbi tí ó ti yẹ.
