id: MAT.11.14
reference: Matthew 11:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: yo
  text: Bí ẹ bá sì fẹ́ tẹ́wọ́ gbà á, òun ni Èlíjà, ẹni tí yóò wá.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹ bá fẹ́ gbà á.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, a dá Jòhánù Onírìbọmi mọ̀ gẹ́gẹ́ bí aṣáájú-ọ̀nà tó dà bí Èlíjà, ẹni tí a ṣèlérí pé yóò wá; fi Málekì 4:5 àti Mátíù 17:10–13 wé e.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Àti pé
  rationale: Ó pa ìsopọ̀ pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́ ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: εἰ θέλετε δέξασθαι
  choice: bí ẹ bá fẹ́ gbà á
  rationale: “Fẹ́” fi ìmúratán hàn, “gbà á” sì túmọ̀ δέξασθαι ní ti fífi ọkàn gba ohun tí Jésù sọ; arọ́pò-orúkọ ohun náà wà nínú “á” bí ó tilẹ̀ jẹ́ pé a kò sọ ọ́ ní Gíríìkì.
- source_word: αὐτός
  choice: òun
  rationale: “Òun” tọ́ka sí Jòhánù Onírìbọmi, ó sì lè pa ìtẹnumọ́ díẹ̀ tí αὐτός ní mọ́ láìfi ọ̀rọ̀ kún un jù.
- source_word: ἐστιν Ἠλίας
  choice: ni Èlíjà
  rationale: Ó pa ìdánimọ̀ gígúnná ti Gíríìkì mọ́, láìrọ̀ ọ́ sí “ó dà bí Èlíjà” tàbí “ó ṣe iṣẹ́ Èlíjà.”
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: tí ń bọ̀
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tí a ń retí pé yóò dé, ó sì pa ìfojúsọ́nà àsọtẹ́lẹ̀ náà mọ́.
theological_decisions:
- issue: Ìdánimọ̀ Jòhánù Onírìbọmi pẹ̀lú Èlíjà
  choice: “òun ni Èlíjà tí ń bọ̀”
  alternative: “òun ni ẹni tó ń ṣe iṣẹ́ Èlíjà” tàbí “ó dà bí Èlíjà”
  rationale: Gíríìkì sọ ìdánimọ̀ náà ní tààrà, ṣùgbọ́n ó fi gbolohun àídájú nípa fífi ọkàn gbà á ṣáájú rẹ̀. Ìtumọ̀ náà pa agbára ọ̀rọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanjú rẹ̀ fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí θέλετε ṣe jẹ́ ọ̀pọ̀.
