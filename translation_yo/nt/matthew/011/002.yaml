source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: yo
  text: Nígbà tí Jòhánù gbọ́ ní ẹ̀wọ̀n nípa àwọn iṣẹ́ Mèsáyà[a], ó fi àwọn ọmọ-ẹ̀yìn rẹ̀ ránṣẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn iṣẹ́ Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: kò ṣe é túmọ̀ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: Ó ń samí sí ìyípadà nínú ìtàn; ìbẹ̀rẹ̀ gbólóhùn pẹ̀lú “Nígbà tí” mú ìṣàn ọ̀rọ̀ náà hàn lọ́nà àdánidá láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἀκούσας
  choice: Nígbà tí Jòhánù gbọ́
  rationale: Ọ̀rọ̀ àbọ̀ aorist náà fi iṣẹ́ tí ó ṣáájú ríránṣẹ́ hàn; gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: ní ọgbà ẹ̀wọ̀n
  rationale: Ó sọ ibi tí Jòhánù wà nígbà tó gbọ́ ìròyìn náà; “ọgbà ẹ̀wọ̀n” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” pa ìtumọ̀ gbooro ἔργα mọ́, ó sì lè kan iṣẹ́ ìyanu àti gbogbo ohun tí ẹni náà ń ṣe.
- source_word: τοῦ χριστοῦ
  choice: Mèsáyà[a]
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” pa ìtumọ̀ ẹni tí a fòróró yàn àti àyíká Hébérù mọ́.
- source_word: πέμψας
  choice: ó ránṣẹ́
  rationale: Ohun tí a rán kò fara hàn títí dé ẹsẹ tó tẹ̀ lé; “ránṣẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fi ìránṣẹ́ ránṣẹ́.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: nípasẹ̀ àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: διά pẹ̀lú genitive fi àwọn ọmọ-ẹ̀yìn hàn gẹ́gẹ́ bí alárinà tí ó gbé iṣẹ́ náà ṣe.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àyíká yìí, nítorí náà “Mèsáyà” mú ìtumọ̀ àti gbòǹgbò Hébérù rẹ̀ hàn; àṣàyàn ìbílẹ̀ “Kristi” wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
