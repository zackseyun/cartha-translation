id: MAT.11.10
reference: Matthew 11:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: yo
  text: Òun ni ẹni tí a kọ̀wé nípa rẹ̀ pé, “Wò ó, mo ń rán òjíṣẹ́ mi ṣáájú rẹ[a], ẹni tí yóò pèsè ọ̀nà rẹ̀ sílẹ̀ níwájú rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “níwájú ojú rẹ.” Gíríìkì pa àwòrán ojú ẹni mọ́ nínú àyọlò Ìwé Mímọ́; “ṣáájú rẹ” ni ọ̀nà Yorùbá tó rọrùn sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Òun ni ẹni
  rationale: Ó fi ìdánimọ̀ onítẹnumọ́ Gíríìkì hàn ní Yorùbá àdánidá, láì fi ọ̀rọ̀ míì kún ẹni tí a ń tọ́ka sí.
- source_word: περὶ οὗ γέγραπται
  choice: tí a kọ̀wé nípa rẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn ìtọ́kasí Ìwé Mímọ́ náà, tí ó sì pa ìtumọ̀ ‘nípa ẹni tí’ mọ́.
- source_word: Ἰδοὺ
  choice: Kíyèsí i
  rationale: Ó pa ohùn àsọtẹ́lẹ̀ àti ìpè láti fiyè sí ohun tó tẹ̀ lé mọ́, láì jẹ́ ọ̀rọ̀ ojoojúmọ́ jù.
- source_word: ἀποστέλλω
  choice: mo ń rán
  rationale: Àmì ‘ń’ mú ìṣe àsìkò ìsinsìnyí tó ní agbára ohun tó ń bọ̀ nítòsí hàn.
- source_word: ἄγγελόν
  choice: òjíṣẹ́
  rationale: Nínú àyíká yìí ọ̀rọ̀ náà ń tọ́ka sí aṣojú ènìyàn, Jòhánù, kì í ṣe ẹ̀dá ọ̀run; ‘òjíṣẹ́’ sì jẹ́ ọ̀rọ̀ Yorùbá tó péye fún messenger.
- source_word: πρὸ προσώπου σου
  choice: ṣáájú rẹ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ẹni tí a rán lọ níwájú ẹlòmíràn; àlàyé ìsàlẹ̀ fi àwòrán gangan ‘níwájú ojú rẹ’ hàn.
- source_word: κατασκευάσει
  choice: yóò pèsè ... sílẹ̀
  rationale: Ó sọ ìmúrasílẹ̀ ọjọ́ iwájú náà ní Yorùbá tó ṣe kedere, ó sì bá àwòrán ọ̀nà mu.
- source_word: τὴν ὁδόν σου
  choice: ọ̀nà rẹ̀
  rationale: ‘Ọ̀nà’ lè jẹ́ ojú ọ̀nà gangan tàbí ọ̀nà ní ìtumọ̀ àpẹẹrẹ, gẹ́gẹ́ bí ὁδός.
- source_word: ἔμπροσθέν σου
  choice: níwájú rẹ
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé fún ‘níwájú rẹ,’ ó sì jẹ́ kí gbólóhùn kejì inú àyọlò náà dúró.
theological_decisions:
- issue: Àwọn gbólóhùn méjì tó jọra fún ‘níwájú rẹ’ nínú àyọlò Ìwé Mímọ́
  choice: A pa àwọn méjèèjì mọ́ gẹ́gẹ́ bí ‘ṣáájú rẹ’ àti ‘níwájú rẹ.’
  alternative: Kí a rọ́ wọn pọ̀ sí gbólóhùn kan ṣoṣo, bí ‘ṣáájú rẹ.’
  rationale: Gíríìkì ní πρὸ προσώπου σου àti ἔμπροσθέν σου lọ́tọ̀ọ̀tọ̀. Pípa àwọn méjèèjì mọ́ ń dá àtúnwí onítẹnumọ́ àti ìrísí àyọlò náà dúró láì túmọ̀ rẹ̀ sí ẹ̀kọ́ ìsìn kan pàtó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì pẹ̀lú àmì ohùn níbi tó yẹ. ‘Kíyèsí i’ pa ìforúkọsílẹ̀ àsọtẹ́lẹ̀ mọ́; ‘òjíṣẹ́’ sì yẹra fún pípe aṣojú ènìyàn náà ní áńgẹ́lì.
