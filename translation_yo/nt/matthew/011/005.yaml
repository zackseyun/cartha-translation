id: MAT.11.5
reference: Matthew 11:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: yo
  text: Àwọn afọ́jú ń rí, àwọn arọ ń rìn; a ń wẹ àwọn tó ní àrùn ẹ̀tẹ̀ mọ́, àwọn adití ń gbọ́; a ń jí àwọn òkú dìde, a sì ń kéde ìhìn rere fún àwọn tálákà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “a ń wàásù ìhìn rere fún wọn.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ohùn ìṣe-àìṣe: “àwọn tálákà ni a ń mú ìhìn rere dé bá wọn.”'
    reason: lexical_alternative
  - marker: b
    text: Àkójọ yìí ń dún bí Aísáyà 35:5–6 àti 61:1, ó sì ń fi àwọn àmì tó ní í ṣe pẹ̀lú iṣẹ́ Mèsáyà hàn.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: Àwọn afọ́jú ń ríran
  rationale: “Àwọn afọ́jú” mú ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ ènìyàn jáde ní ti ẹ̀dá; “ń ríran” sọ ìmúpadàbọ̀sípò agbára ìríran ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: χωλοὶ περιπατοῦσιν
  choice: àwọn arọ ń rìn
  rationale: Ó pa ọ̀rọ̀ Gíríìkì tó ṣókí mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn tí kò lè rìn déédéé.
- source_word: λεπροὶ καθαρίζονται
  choice: àwọn tó ní àrùn ẹ̀tẹ̀ ń di mímọ́
  rationale: Gbólóhùn yìí bọ̀wọ̀ fún ẹni tí àìsàn náà ń ṣe ju fífi àmì àìsàn ṣe orúkọ wọn lọ; “ń di mímọ́” sì pa ìtumọ̀ ìwẹ̀nùmọ́ ti καθαρίζονται mọ́, dípò kí ó dín in kù sí ìwòsàn nìkan.
- source_word: κωφοὶ ἀκούουσιν
  choice: àwọn adití ń gbọ́
  rationale: Nítorí pé ἀκούουσιν túmọ̀ sí “gbọ́,” κωφοί níbí ń tọ́ka sí àwọn adití, kì í ṣe àwọn odi.
- source_word: νεκροὶ ἐγείρονται
  choice: a ń jí àwọn òkú dìde
  rationale: Ọ̀nà aláṣe-àìlórúkọ “a ń” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé a ń gbé àwọn òkú dìde láì sọ ẹni tó ń ṣe iṣẹ́ náà, ó sì bá fọ́ọ̀mù passive Gíríìkì mu.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: a ń kéde ìhìn rere fún àwọn tálákà
  rationale: Ó pa àwọn tálákà mọ́ gẹ́gẹ́ bí olùgbà ìkéde náà, ó sì sọ ìtumọ̀ ọ̀rọ̀-ìṣe εὐαγγελίζομαι ní èdè Yorùbá òde òní láì fi ọ̀rọ̀ ìjọ tó lè dín ìtumọ̀ rẹ̀ kù sí i.
theological_decisions:
- issue: Ìtumọ̀ εὐαγγελίζονται àti ìbáṣepọ̀ rẹ̀ pẹ̀lú “ìhìn rere”
  choice: a ń kéde ìhìn rere fún àwọn tálákà
  alternative: a ń wàásù ìhìn rere fún àwọn tálákà
  rationale: “Kéde ìhìn rere” mú ìtumọ̀ ìkéde ayọ̀ àti ipò àwọn tálákà gẹ́gẹ́ bí olùgbà rẹ̀ jáde, láì sọ ọ̀rọ̀ náà di ọ̀rọ̀ iṣẹ́ ìjọ nìkan.
- issue: Àwọn iṣẹ́ ìyanu gẹ́gẹ́ bí àmì iṣẹ́ Mèsáyà
  choice: Pa àkójọ àwọn iṣẹ́ náà mọ́ láì fi gbólóhùn ìmúṣẹ àsọtẹ́lẹ̀ kún ẹsẹ náà
  alternative: Fi hàn ní pàtó nínú ẹsẹ pé àwọn iṣẹ́ náà ń mú àsọtẹ́lẹ̀ Aísáyà ṣẹ
  rationale: Ẹsẹ Gíríìkì náà ń ṣe àfihàn àwọn iṣẹ́ náà, ó sì ń dún bí Aísáyà 35:5–6 àti 61:1, ṣùgbọ́n kò fi gbólóhùn ìmúṣẹ àsọtẹ́lẹ̀ kun un ní tààrà; àlàyé ìtọ́kasí ni a fi sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “àwọn tó ní àrùn ẹ̀tẹ̀” dípò fífi àìsàn ṣe orúkọ àwọn ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, a sì lo “a ń” gẹ́gẹ́ bí aláṣe àìlórúkọ láti túmọ̀ passive Gíríìkì ní ọ̀nà Yorùbá àdánidá.
