id: MAT.11.27
reference: Matthew 11:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: yo
  text: Baba mi ti fi ohun gbogbo lé mi lọ́wọ́. Kò sí ẹni tí ó mọ[a] Ọmọ bí kò ṣe Baba; bẹ́ẹ̀ ni kò sí ẹni tí ó mọ Baba bí kò ṣe Ọmọ, àti ẹnikẹ́ni tí Ọmọ bá fẹ́ láti fi Baba hàn fún un.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “mọ ní kíkún” tàbí “mọ dáadáa” ní àwọn gbólóhùn méjèèjì; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímọ ní kíkún tàbí ní àjọṣe tímọ́tímọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹnikẹ́ni tí Ọmọ bá yàn láti fi Baba hàn fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀pọ̀ àìdá abo tàbí akọ, ó sì ní ìtumọ̀ gbígbòòrò; “ohun gbogbo” pa ìwọ̀n àpapọ̀ rẹ̀ mọ́ láì fi àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: παρεδόθη
  choice: ti fi … lé mi lọ́wọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí sọ ìfifúnni tàbí ìfiṣọ́wọ́lé ní ọ̀nà àdánidá, ó sì pa èrò ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì dúró mọ́.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Baba mi
  rationale: Ó tọ́ka sí Ọlọ́run gẹ́gẹ́ bí Baba Jesu; lílo “Baba” gẹ́gẹ́ bí orúkọ ipò pa ìbáṣepọ̀ pàtàkì náà mọ́.
- source_word: ἐπιγινώσκει
  choice: mọ
  rationale: Nínú àyíká yìí, “mọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tí ó lè gba ìmọ̀ jinlẹ̀ tàbí tímọ́tímọ́. A kò fi “ní kíkún” sínú àyọkà pàtàkì nítorí pé agbára ìtẹnumọ́ ọ̀rọ̀ Gíríìkì náà kò dájú ní gbogbo lílò rẹ̀; àṣàyàn náà wà nínú àlàyé ìsàlẹ̀.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: Ọmọ / Baba
  rationale: Àwọn méjèèjì jẹ́ orúkọ ipò tí ó wà ní ìbáṣepọ̀ pẹ̀lú ara wọn nínú ẹsẹ yìí.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìyọkúrò lẹ́yìn gbólóhùn òdì.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: ẹnikẹ́ni tí Ọmọ bá fẹ́ láti fi Baba hàn fún un
  rationale: “Bá fẹ́” pa ìfẹ́ àti ìpinnu Ọmọ mọ́, “fi … hàn” sì sọ ìṣípayá ní èdè Yorùbá tó ṣe kedere. A tún sọ “Baba” dípò arọ́pò-orúkọ lásán kí ẹni tí a ń fihàn má bà a dàrú.
theological_decisions:
- issue: Agbára ἐπιγινώσκω nínú ìmọ̀ tí Baba àti Ọmọ ní nípa ara wọn
  choice: A túmọ̀ rẹ̀ sí “mọ,” a sì fi “mọ ní kíkún” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn.
  alternative: “mọ ní kíkún” tàbí “mọ dáadáa”
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ ìmọ̀ jinlẹ̀ tàbí tímọ́tímọ́, ṣùgbọ́n kò pọn dandan pé kó ní afikún “ní kíkún” níbí. “Mọ” pa àìdájú ọ̀rọ̀ náà mọ́, nígbà tí ìyọkúrò “bí kò ṣe” ṣì fi ìmọ̀ aláìlẹ́gbẹ́ láàárín Baba àti Ọmọ hàn.
- issue: Ìfẹ́ tàbí ìpinnu tí βούληται ń sọ
  choice: “Ọmọ bá fẹ́ láti”
  alternative: “Ọmọ bá yàn láti” tàbí “ẹni tí ó bá jẹ́ ìfẹ́ Ọmọ láti fihàn fún”
  rationale: Àṣàyàn yìí sọ pé ìṣípayá náà dá lórí ìfẹ́ àti ìgbésẹ̀ Ọmọ, láì sọ ó di ìfẹ́ asán tàbí láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì ya gbólóhùn àkọ́kọ́ sọ́tọ̀ kí gígùn àyọkà má bà a dí òye.
