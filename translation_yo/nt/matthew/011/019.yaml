id: MAT.11.19
reference: Matthew 11:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: yo
  text: Ọmọ Ènìyàn wá, ó ń jẹun, ó sì ń mu, wọ́n sì wí pé, “Ẹ wò ó, alájẹkì àti ọ̀mùtí, ọ̀rẹ́ àwọn agbowó-orí àti àwọn ẹlẹ́ṣẹ̀!” A sì dá ọgbọ́n láre[a] nípa àwọn iṣẹ́ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A sì fi àwọn iṣẹ́ rẹ̀ hàn pé ọgbọ́n tọ́.”
    reason: lexical_alternative
  - marker: b
    text: 'Àwọn ìwé àfọwọ́kọ kan ní “àwọn ọmọ” dípò “àwọn iṣẹ́”: “A sì dá ọgbọ́n láre nípa àwọn ọmọ rẹ̀.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè náà mọ́ ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá Bíbélì, láì tú ìtumọ̀ rẹ̀ sí ẹ̀kọ́ kan pàtó.
- source_word: ἐσθίων καὶ πίνων
  choice: ó ń jẹ, ó sì ń mu
  rationale: Ó sọ ìṣe tí ó ń ṣẹlẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́, ó sì pa ìyàtọ̀ rẹ̀ sí ìgbé ayé Johanu mọ́ láì fi ‘àsè’ kún un.
- source_word: Ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ọ̀rọ̀ ìkìlọ̀ tàbí fífi ẹni hàn ní ọ̀nà àdánidá, tí ó sì bá ẹ̀sùn tí ọ̀pọ̀ ènìyàn ń sọ mu.
- source_word: φάγος
  choice: alájẹkì
  rationale: Ọ̀rọ̀ ẹ̀gàn ni, kì í ṣe àpèjúwe ẹni tí ó kàn ń jẹun; ‘alájẹkì’ mú ẹ̀sùn jíjẹ àjẹjù jáde.
- source_word: οἰνοπότης
  choice: ọ̀mùtí
  rationale: Ó mú ẹ̀sùn mímu àjẹjù jáde, dípò ìtumọ̀ aláìlẹ́gàn bí ‘ẹni tí ń mu wáìnì.’
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: ọ̀rẹ́ àwọn agbowó-orí àti àwọn ẹlẹ́ṣẹ̀
  rationale: Ó pa àjọṣe gírámà àti agbára ẹ̀sùn ẹgbẹ́-awùjọ àti ti ẹ̀sìn inú ọ̀rọ̀ náà mọ́.
- source_word: ἐδικαιώθη
  choice: dá ... láre
  rationale: Ó lè túmọ̀ sí fífi hàn pé ohun kan tọ́ tàbí pé a jẹ́rìí sí òdodo rẹ̀; ‘dá ... láre’ sún mọ́ ìrísí Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ọ̀nà àdánidá mìíràn.
- source_word: ἡ σοφία
  choice: ọgbọ́n
  rationale: A pa àwòrán ọgbọ́n gẹ́gẹ́ bí ẹni mọ́ láì dá a mọ́ Jésù tàbí ètò Ọlọ́run ní tààràtà.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: nípa àwọn iṣẹ́ rẹ̀
  rationale: Ó tẹ̀lé ἔργων nínú SBLGNT, ó sì fi hàn pé àwọn ohun tí ọgbọ́n ń ṣe ni ó jẹ́rìí sí i.
theological_decisions:
- issue: Ìtumọ̀ ‘ọgbọ́n’ nínú gbólóhùn ìkẹyìn
  choice: A pa ‘ọgbọ́n’ mọ́ gẹ́gẹ́ bí ẹni tí a ń sọ̀rọ̀ nípa rẹ̀, láì dá a mọ́ ẹnì kan tàbí ètò kan ní pàtó.
  alternative: Kí a sọ pé ọgbọ́n náà ni Jésù fúnra rẹ̀, tàbí ọgbọ́n àti ètò ìgbàlà Ọlọ́run.
  rationale: Ọ̀rọ̀ náà kò sọ ìdánimọ̀ yẹn ní gbangba; pípa àwòrán rẹ̀ mọ́ kò ní yanju ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà fi sílẹ̀.
- issue: Ọ̀rọ̀ inú gbólóhùn ìkẹyìn
  choice: A lo ‘àwọn iṣẹ́’ gẹ́gẹ́ bí SBLGNT ṣe ní ἔργων.
  alternative: ‘Àwọn ọmọ’ (τέκνων), gẹ́gẹ́ bí àwọn ìwé àfọwọ́kọ kan àti Lúùkù 7:35.
  rationale: Ìtumọ̀ àkọ́kọ́ gbọ́dọ̀ tẹ̀lé ẹ̀dà Gíríìkì tí a pèsè, ṣùgbọ́n a tọ́ka sí ìyàtọ̀ pàtàkì náà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ẹ wò ó’ mú ohùn ẹ̀sùn gbogbo ènìyàn jáde; ‘alájẹkì’ àti ‘ọ̀mùtí’ sì pa agbára ọ̀rọ̀ ẹ̀gàn Gíríìkì mọ́.
