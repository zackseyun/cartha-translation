id: MAT.11.15
reference: Matthew 11:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: yo
  text: Ẹni tí ó ní etí[a], kí ó gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Ẹnikẹ́ni tí ó ní etí, kí ó gbọ́.” Gíríìkì lo gbólóhùn ẹyọ kan tí ó ń tọ́ka sí ẹnikẹ́ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ẹni tí ó ní
  rationale: Àpilẹ̀kọ pẹ̀lú participle yìí ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀-orúkọ, ó sì ń tọ́ka ní gbogbogbò sí ẹnikẹ́ni tí ó ní ohun tí a mẹ́nu kàn. “Ẹni tí ó ní” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ ẹyọ kan náà mọ́.
- source_word: ὦτα
  choice: etí
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀; ní Yorùbá, “etí” lè tọ́ka sí etí méjèèjì láìfi àmì ọ̀pọ̀ “àwọn” kún un, ó sì jẹ́ ọ̀nà àdánidá jù lọ nínú àṣẹ yìí.
- source_word: ἀκουέτω
  choice: kí ó gbọ́
  rationale: Èyí ń ṣàfihàn àṣẹ ẹni-kẹta tí ó wà nínú Gíríìkì. “Gbọ́” pa àwòrán gbígbọ́ mọ́, ó sì tún lè ní ìtumọ̀ fífetísílẹ̀ àti ṣíṣe ohun tí a gbọ́.
theological_decisions:
- issue: Gbólóhùn ẹyọ akọ tí a lò fún gbogbo ènìyàn
  choice: Ẹni tí ó ní etí, kí ó gbọ́.
  alternative: Ẹnikẹ́ni tí ó ní etí, kí ó gbọ́.
  rationale: Gíríìkì lo àkójọpọ̀ ẹyọ akọ ní gírámà ṣùgbọ́n ó ní ìtumọ̀ gbogbogbò. “Ẹni” ní Yorùbá pa ẹyọ àti ìtumọ̀ aṣojú náà mọ́ láìfi akọ tàbí abo tí èdè Yorùbá kò fi hàn sí i.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, kúkúrú, ọ̀wọ̀, ó sì tẹ̀ lé ìrísí òwe àti àṣẹ inú ọ̀rọ̀ Gíríìkì. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
