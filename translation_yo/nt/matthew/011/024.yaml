  to: Ṣùgbọ́n mo sọ fún yín pé yóò ṣeé fara dà fún ilẹ̀ Sódómù ní ọjọ́ ìdájọ́ ju fún ọ lọ[a].
  rationale: A ti yí arọ́pò-orúkọ lẹ́yìn λέγω ὑμῖν sí ‘yín’ láti pa ọ̀pọ̀ Gíríìkì mọ́. ‘Ọ’ ní ìparí ni a fi sílẹ̀, nítorí σοί jẹ́ ẹyọ tí ó ń bá ìlú tí a sọ di ẹni sọ̀rọ̀. A tún mú àlàyé yíyàn ọ̀rọ̀ nínú ẹsẹ̀ abẹ́lẹ̀ di gbolóhùn Yorùbá tó pé, láìyí ìtumọ̀ àfọwọ́kọ náà padà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Àtúnyẹ̀wò kan yẹ: λέγω ὑμῖν ní orísun jẹ́ ẹni-kejì ọ̀pọ̀ (‘mo sọ fún yín’), bí ó tilẹ̀ jẹ́ pé σοί ní òpin ẹsẹ̀ jẹ́ ẹyọ (‘ọ’) nítorí ìlú tí a ń bá sọ̀rọ̀ sí. Ìtumọ̀ ‘ilẹ̀ Sódómù,’ ìfiwéra ‘ṣeé fara dà,’ àti ‘ní ọjọ́ ìdájọ́’ fara mọ́ Gíríìkì dáadáa.'
  naturalness: ‘Yóò ṣeé fara dà fún ilẹ̀ Sódómù … ju fún ọ lọ’ jẹ́ ìṣètò Yorùbá tó ṣeé lóye, tó sì pa ìtumọ̀ afiwéra aláìlò ẹni pàtó mọ́. Yíyí ‘fún ọ’ àkọ́kọ́ sí ‘fún yín’ ń mú ìfarahàn ọ̀rọ̀ náà bá àdírẹ́sì ọ̀pọ̀ nínú Gíríìkì mu, láìpa ẹyọ ‘ọ’ ní òpin run.
  terminology: ‘Ìjọ́ ìdájọ́’ jẹ́ ọ̀rọ̀ Yorùbá boṣewa tó péye fún ἡμέρᾳ κρίσεως. ‘Ṣeé fara dà’ dá ἀνεκτότερον (tolerable/bearable) lórí dáadáa; àlàyé ẹsẹ̀ abẹ́lẹ̀ tún fúnni ní yíyàn ọ̀rọ̀ tó sún mọ́ ‘rọrùn.’
  issues:
  - severity: high
    issue: ‘mo sọ fún ọ’ túmọ̀ λέγω ὑμῖν gẹ́gẹ́ bí ẹni-ẹyọ.
    rationale: Ὑμῖν jẹ́ dátífù ẹni-kejì ọ̀pọ̀. Ẹsẹ̀ náà ní ìyípadà mọ̀ọ́mọ̀ láti ‘yín’ (àwọn olùgbọ́) sí ‘ọ’ (ìlú kan tí a sọ di ẹni) ní σοί; ìtumọ̀ gbọ́dọ̀ pa ìyàtọ̀ náà mọ́.
  - severity: low
    issue: Ìdí ìpinnu lexical tó wà nínú àkọsílẹ̀ sọ pé λέγω ὑμῖν jẹ́ ẹni kan ṣoṣo.
    rationale: A nílò láti ṣàtúnṣe rẹ̀ nínú ìtumọ̀ gangan; ìtúmọ̀ tí a ṣàtúnṣe ń yan ‘fún yín.’
