id: MAT.11.24
reference: Matthew 11:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé yóò ṣeé fara dà fún ilẹ̀ Sódómù ní ọjọ́ ìdájọ́ ju fún ọ lọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘yóò rọrùn láti fara dà fún un.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú ọ̀rọ̀ Yorùbá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún ọ
  rationale: Ó pa ọ̀rọ̀ tààrà àti ẹni kan ṣoṣo tí a ń bá sọ nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: γῇ Σοδόμων
  choice: fún ilẹ̀ Sódómù
  rationale: Ó mú γῇ, ‘ilẹ̀’ tàbí ‘agbègbè,’ jáde ní kedere dípò kí a sọ ‘Sódómù’ nìkan.
- source_word: ἀνεκτότερον
  choice: yóò ṣeé fara dà ... ju ... lọ
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ohun tí ó túmọ̀ sí pé ipò kan yóò ṣeé gbà tàbí fara dà ju òmíràn lọ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ní ọjọ́ ìdájọ́
  rationale: Ó tọ́ka sí àkókò ìdájọ́ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ, láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: ἢ σοί
  choice: ju fún ọ lọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ẹyọ nínú Gíríìkì; ‘ọ’ pa ìbáwí tààrà sí ìlú tí a sọ di ẹni mọ́.
theological_decisions:
- issue: Ẹni tí σοί ẹyọ ń tọ́ka sí
  choice: A lo ‘ọ’ gẹ́gẹ́ bí ọ̀rọ̀ sí ẹni kan, ìyẹn ìlú tí a ń bá sọ bí ẹni.
  alternative: ‘ẹ̀yin ènìyàn ibẹ̀’ tàbí ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀
  rationale: Gíríìkì lo ẹyọ, ó sì ń bá ọ̀nà àsọtẹ́lẹ̀ tí a fi ń bá ìlú sọ̀rọ̀ lọ; fífi í sí ọ̀pọ̀ yóò túmọ̀ rẹ̀ ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye lójoojúmọ́; a fi àmì ohùn síbi tí ó yẹ. Ìṣètò gbólóhùn náà pa ìfarawé Gíríìkì mọ́ láìjẹ́ kí Yorùbá rẹ̀ le.
