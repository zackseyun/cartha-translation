id: MAT.11.23
reference: Matthew 11:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: yo
  text: Ìwọ náà, Káfánáúmù, ṣé a ó gbé ọ ga dé ọ̀run ní? Ìwọ yóò sọ̀ kalẹ̀ dé Hédíìsì.[a] Nítorí bí àwọn iṣẹ́ agbára tí ó ṣẹlẹ̀ nínú rẹ bá ti ṣẹlẹ̀ ní Sódómù, ìlú náà ì bá ti wà títí di òní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilẹ̀ àwọn òkú.” Ọ̀rọ̀ Gíríìkì náà ni Hédíìsì, kì í ṣe Gẹ̀hẹ́nà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kápánáúmù
  rationale: A ṣe àkọsílẹ̀ orúkọ ìlú náà ní ìbámu pẹ̀lú ìró Gíríìkì, a sì fi àmì ohùn Yorùbá sí i kí kíkà rẹ̀ lè rọrùn.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: ṣé a ó gbé ọ ga dé ọ̀run?
  rationale: A mú μή gẹ́gẹ́ bí ohun tó bẹ̀rẹ̀ ìbéèrè àfiwé tí ó ń retí ìdáhùn òdì. ‘Gbé ọ ga’ pa ìtumọ̀ ὑψόω àti àwòrán ibi gíga mọ́.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Ìwọ yóò sọ̀ kalẹ̀ dé Hédíìsì
  rationale: ‘Sọ̀ kalẹ̀’ túmọ̀ καταβαίνω ní tààrà, ‘Hédíìsì’ sì pa ọ̀rọ̀ Gíríìkì ᾅδης mọ́ láì fi ìtumọ̀ Gẹ̀hẹ́nà tàbí ọ̀run àpáàdì kún un.
- source_word: δυνάμεις
  choice: àwọn iṣẹ́ agbára
  rationale: Àṣàyàn yìí sọ pé iṣẹ́ gidi ni wọ́n, ó sì tún pa èrò agbára inú δυνάμεις mọ́ láì dín un kù sí òye ìyanu nìkan.
- source_word: γενόμεναι ἐν σοί
  choice: tí ó ṣẹlẹ̀ nínú rẹ
  rationale: Gbólóhùn náà pa ìṣe γίνομαι àti lílo ìlú gẹ́gẹ́ bí ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: ἐγενήθησαν
  choice: bá ti ṣẹlẹ̀
  rationale: Ìṣètò ‘bá ti …’ bá ipò àròsọ tí kò ṣẹlẹ̀ ní ti gidi mu, ó sì ṣàfihàn pé iṣẹlẹ̀ náà ì bá ti ṣáájú àbájáde rẹ̀.
- source_word: ἔμεινεν ἂν
  choice: ì bá ti wà
  rationale: ‘Ì bá ti wà’ fi ipò àròsọ tí ἄν ń tọ́ka sí hàn, ó sì ka Sódómù sí ìlú kan ṣoṣo gẹ́gẹ́ bí ọ̀rọ̀-ìṣe ẹyọ kan inú Gíríìkì.
- source_word: μέχρι τῆς σήμερον
  choice: títí di òní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá adayeba láti sọ àkókò tó gùn dé ọjọ́ òní.
theological_decisions:
- issue: Ìtumọ̀ ᾅδης
  choice: Hédíìsì
  alternative: ilẹ̀ àwọn òkú
  rationale: Àkọsílẹ̀ orúkọ Gíríìkì náà yà ᾅδης sọ́tọ̀ kúrò nínú Gẹ̀hẹ́nà, kò sì fi ẹ̀kọ́ ìsìn tí ọ̀rọ̀ ‘ọ̀run àpáàdì’ lè dá sí i kún ẹsẹ náà. Àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ọ̀nà ìtumọ̀ tó ṣe kedere sí i.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó níyì ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì lo ìbéèrè àfiwé adayeba àti ọ̀nà àròsọ ‘bá ti … ì bá ti …’ láti pa ìṣètò Gíríìkì mọ́ ní Yorùbá tó ṣe kedere.
