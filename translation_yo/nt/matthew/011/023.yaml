revisions:
- from: Ìwọ náà, Kápánáúmù, ṣé a ó gbé ọ ga dé ọ̀run? Ìwọ yóò sọ̀ kalẹ̀ dé Hédíìsì.[a] Nítorí bí àwọn iṣẹ́ agbára tí ó ṣẹlẹ̀ nínú rẹ bá ti ṣẹlẹ̀ ní Sódómù, ìlú náà ì bá ti wà títí di òní.
  to: Ìwọ náà, Káfánáúmù, ṣé a ó gbé ọ ga dé ọ̀run ní? Ìwọ yóò sọ̀ kalẹ̀ dé Hédíìsì.[a] Nítorí bí àwọn iṣẹ́ agbára tí ó ṣẹlẹ̀ nínú rẹ bá ti ṣẹlẹ̀ ní Sódómù, ìlú náà ì bá ti wà títí di òní.
