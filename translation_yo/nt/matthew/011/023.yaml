review_pass:
  verdict: revise
  source_fidelity: The rhetorical negative question, descent to Hades, contrary-to-fact conditional, and temporal result are substantially retained. However, the transliteration “Kápánáúmù” does not represent the Greek consonant φ; “Káfánáúmù” more closely reflects Καφαρναούμ.
  naturalness: The Yoruba is generally clear and appropriately formal. Adding the sentence-final interrogative particle “ní?” makes the opening rhetorical question more idiomatic and unambiguously interrogative in Standard Yoruba.
  terminology: “Àwọn iṣẹ́ agbára” suitably renders δυνάμεις, and “Hédíìsì” appropriately preserves the distinction between ᾅδης and Gẹ̀hẹ́nà. The footnote’s alternative is accurate and useful.
  issues:
  - severity: medium
    issue: Place-name transliteration
    rationale: Kápánáúmù uses /p/ where Greek Καφαρναούμ has φ (/f/). Káfánáúmù is a closer Yoruba transliteration and avoids an unnecessary divergence from the source name.
  - severity: low
    issue: Opening rhetorical-question punctuation
    rationale: The sentence is understandable as written, but adding “ní?” after “ọ̀run” gives the rhetorical question its natural Standard Yoruba closing form.
  revised_text: Ìwọ náà, Káfánáúmù, ṣé a ó gbé ọ ga dé ọ̀run ní? Ìwọ yóò sọ̀ kalẹ̀ dé Hédíìsì.[a] Nítorí bí àwọn iṣẹ́ agbára tí ó ṣẹlẹ̀ nínú rẹ bá ti ṣẹlẹ̀ ní Sódómù, ìlú náà ì bá ti wà títí di òní.
  revised_footnotes:
