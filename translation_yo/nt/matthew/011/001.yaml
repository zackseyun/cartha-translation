id: MAT.11.1
reference: Matthew 11:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: yo
  text: Nígbà tí Jésù sì parí fífún àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá ní ìtọ́ni[a], ó kúrò níbẹ̀ láti kọ́ni àti láti wàásù ní àwọn ìlú wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pàṣẹ fún àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn “àwọn ìlú wọn” kò fi ẹni tí “wọn” ń tọ́ka sí hàn kedere nínú èdè Gíríìkì; ó lè jẹ́ àwọn ìlú àwọn ọmọ-ẹ̀yìn, tàbí ní gbogbogbòò àwọn ìlú àwọn ènìyàn agbègbè náà.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Nígbà tí ... sì
  rationale: Àgbékalẹ̀ ìtàn Mátíù yìí ń so ohun tí ó tẹ̀ lé mọ́ ohun tí ó ṣáájú, ó sì ń fi àkókò hàn. Èdè yìí mú iṣẹ́ méjèèjì ṣẹ ní Yorùbá àdánidá láìfi gbolohun tí kò rọrùn bí ‘ó sì ṣẹlẹ̀ nígbà tí’ kún un.
- source_word: ἐτέλεσεν
  choice: parí
  rationale: Ó fi hàn pé Jésù ti parí iṣẹ́ fífún wọn ní ìtọ́ni kí ó tó kúrò níbẹ̀.
- source_word: διατάσσων
  choice: fífún ... ní ìtọ́ni
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífún ẹnìkan ní ìtọ́ni tàbí àṣẹ pẹ̀lú ọlá àṣẹ. ‘Fífún ... ní ìtọ́ni’ bá ọ̀rọ̀ ìránṣẹ́ tí Jésù sọ fún àwọn ọmọ-ẹ̀yìn mu, nígbà tí àlàyé ìsàlẹ̀ fi ‘pàṣẹ’ pamọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀ méjìlá
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún μαθητής nínú àyíká Ìhìn Rere, a sì pa iye méjìlá mọ́ ní kedere.
- source_word: μετέβη ἐκεῖθεν
  choice: ó kúrò níbẹ̀
  rationale: Èyí sọ ìṣípò láti ibi tí ó wà tẹ́lẹ̀ ní Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: láti lọ kọ́ni àti láti wàásù
  rationale: Àwọn ọ̀rọ̀ àìlẹ́ni tí a fi atọ́ka sí ṣe àfihàn ète. A pa ìyàtọ̀ tó wà láàárín kíkọ́ni àti pípolongo ọ̀rọ̀ mọ́.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: ní àwọn ìlú wọn
  rationale: ‘Ìlú’ lè tọ́ka sí ìlú ńlá tàbí ìlú kékeré ní Yorùbá, ó sì bá πόλις mu. ‘Wọn’ pa àìdájú ẹni tí αὐτῶν ń tọ́ka sí mọ́.
theological_decisions:
- issue: Ẹni tí αὐτῶν (‘wọn’) nínú ‘ní àwọn ìlú wọn’ ń tọ́ka sí
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘àwọn ìlú wọn,’ láìsọ ẹni tí ‘wọn’ jẹ́ ní pàtó.
  alternative: Àwọn ìlú àwọn ọmọ-ẹ̀yìn; àwọn ìlú àwọn Júù; tàbí àwọn ìlú agbègbè náà.
  rationale: Gíríìkì kò sọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ní kedere. Yíyan ọ̀kan nínú àwọn ìtumọ̀ náà nínú ẹsẹ̀ fúnra rẹ̀ yóò fi ìtumọ̀ tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ kò fi dandan múlẹ̀ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, tí ó sì ṣeé yé fún ọ̀pọ̀ ènìyàn. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó jẹ́ ti ẹ̀ka kan ṣoṣo.
