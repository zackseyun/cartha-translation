id: MAT.11.17
reference: Matthew 11:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: yo
  text: Wọ́n ń wí pé, ‘A fẹ́ fèrè fún yín, ẹ kò jó; a kọ orin ọ̀fọ̀[a], ẹ kò sì lu ara yín[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘a ṣọ̀fọ̀,’ tàbí ‘a kọ orin ìsìnkú.’
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, ‘ẹ kò lu ara yín.’ Èyí ń tọ́ka sí àṣà lílu àyà tàbí ara ẹni gẹ́gẹ́ bí àmì ọ̀fọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Wọ́n ń wí pé
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí mú ẹ̀dùn ọkàn àwọn ọmọdé inú àpẹẹrẹ náà wá síwájú lọ́nà tó ṣe kedere.
- source_word: Ηὐλήσαμεν
  choice: Àwa fun fèrè fún yín
  rationale: αὐλέω túmọ̀ sí fífún fèrè tàbí irú ohun èlò afẹ́fẹ́ bẹ́ẹ̀; ‘fun fèrè’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì pa ohun èlò náà mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó fi hàn pé eré fèrè náà jẹ́ ohun tí wọ́n ṣe fún àwọn ẹlòmíràn.
- source_word: ὠρχήσασθε
  choice: ẹ̀yin kò sì jó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjó; kò pọn dandan láti fi ìtumọ̀ afarahàn kún un nínú Yorùbá.
- source_word: ἐθρηνήσαμεν
  choice: àwa kọ orin ọ̀fọ̀
  rationale: θρηνέω ń tọ́ka sí ṣíṣe ọ̀fọ̀, ní pàtàkì ọ̀fọ̀ ikú; yíyan ‘kọ orin ọ̀fọ̀’ pa ìfarajọ pẹ̀lú eré fèrè mọ́.
- source_word: ἐκόψασθε
  choice: ẹ̀yin kò sì lu ara yín ní ọ̀fọ̀
  rationale: Ní àyíká yìí, κόπτω ní ọ̀nà àárín ń tọ́ka sí lílu ara ẹni gẹ́gẹ́ bí àmì ọ̀fọ̀. Ìtumọ̀ yìí pa àwòrán àṣà inú Gíríìkì mọ́ láì dín in kù sí ‘ṣọ̀fọ̀’ nìkan.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn kíkún. Ìtẹnumọ́ ‘àwa/ẹ̀yin’ mú ìtakora inú ẹ̀dùn àwọn ọmọdé náà hàn. A tú ἐκόψασθε ní ọ̀nà tó sún mọ́ àsọyé orísun, nígbà tí àlàyé ìṣe àṣà náà wà nínú àlàyé ìsàlẹ̀.
