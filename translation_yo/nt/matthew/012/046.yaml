id: MAT.12.46
reference: Matthew 12:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: yo
  text: Nígbà tí ó ṣì ń sọ̀rọ̀ fún àwọn ogunlọ́gọ̀, wò ó, ìyá rẹ̀ àti àwọn arákùnrin rẹ̀[a] dúró níta, wọ́n ń wá a láti bá a sọ̀rọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ìbátan rẹ̀,’ bí a bá gba ἀδελφοί ní ìtumọ̀ gbígbòòrò. Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, a sì túmọ̀ rẹ̀ sí ‘àwọn arákùnrin’ nínú ẹsẹ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Nígbà tí ó ṣì ń ... sọ̀rọ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé iṣẹ́ sísọ̀rọ̀ náà ṣì ń lọ lọ́wọ́ nígbà tí ìṣẹ̀lẹ̀ tuntun ṣẹlẹ̀; èyí sì jẹ́ ọ̀nà àdánidá láti sọ genitive absolute náà ní Yorùbá.
- source_word: τοῖς ὄχλοις
  choice: àwọn ogunlọ́gọ̀
  rationale: Fọ́ọ̀mù Gíríìkì náà jẹ́ ọ̀pọ̀; ‘àwọn ogunlọ́gọ̀’ pa ìtumọ̀ ọ̀pọ̀ ènìyàn mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó jẹ́ àmì àsọyé tó fa àfiyèsí sí ìṣẹ̀lẹ̀ tuntun; ‘kíyèsí i’ pa agbára ìtàn alárinrin náà mọ́.
- source_word: ἡ μήτηρ
  choice: ìyá rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ arọ́pò oníhun kò tún fara hàn lẹ́gbẹ̀ẹ́ μήτηρ, àyíká ọ̀rọ̀ fi hàn pé ìyá Jesu ni, ‘ìyá rẹ̀’ sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: àwọn arákùnrin rẹ̀
  rationale: ἀδελφοί jẹ́ akọ ní ọ̀pọ̀ nínú ẹsẹ̀ yìí; ‘àwọn arákùnrin rẹ̀’ ń tẹ̀ lé ìrísí ọ̀rọ̀ náà láìdájọ́ irú ìbátan wọn ní kíkún.
- source_word: εἱστήκεισαν ἔξω
  choice: dúró níta
  rationale: Fọ́ọ̀mù ọ̀rọ̀-ìṣe náà sọ ipò tí wọ́n wà nínú rẹ̀; ‘dúró níta’ jẹ́ Yorùbá àdánidá, kò sì fi ‘ilé’ kún ohun tí ẹsẹ̀ náà kò sọ ní tààrà.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: wọ́n ń wá ọ̀nà láti bá a sọ̀rọ̀
  rationale: ζητοῦντες ní ìtumọ̀ ìsapá pẹ̀lú ète; ‘ń wá ọ̀nà’ pa èrò yẹn mọ́ ju lílo ‘fẹ́’ nìkan lọ, ‘bá a sọ̀rọ̀’ sì jẹ́ Yorùbá tó wọ́pọ̀ fún αὐτῷ λαλῆσαι.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί nípa ìdílé Jesu
  choice: àwọn arákùnrin rẹ̀
  alternative: àwọn ọmọ ìyá rẹ̀ / àwọn ìbátan rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, ‘àwọn arákùnrin rẹ̀’ sì ni ìtumọ̀ ojú-ọ̀rọ̀ tó sun mọ́ ọn jù. Ìtumọ̀ náà kò pinnu bóyá arákùnrin gan-an, arákùnrin ọlọ́kan-lára, tàbí ìbátan tímọ́tímọ́ ni wọ́n; àlàyé ìsàlẹ̀ ojú ewé ló pa àìdánilójú yẹn mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Kíyèsí i’ pa ìfààfihàn ἰδού mọ́, ‘ń wá ọ̀nà’ sì fi ìsapá inú ζητοῦντες hàn láìjẹ́ kí gbólóhùn náà le fún òǹkàwé lasán.
