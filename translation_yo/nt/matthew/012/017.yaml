base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: yo
  text: 'kí ohun tí a sọ nípasẹ̀ Aísáyà wòlíì lè ṣẹ, gẹ́gẹ́ bí ó ti wí pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó mú gbólóhùn ète tàbí àbájáde wọlé ní Yorùbá láì fi dandan pinnu ọ̀kan ṣoṣo láàárín ète àti àbájáde.
- source_word: πληρωθῇ
  choice: lè ṣẹ
  rationale: Ó pa ìtumọ̀ àṣeparí àsọtẹ́lẹ̀ mọ́, ó sì fi ìṣesí subjunctive lẹ́yìn ἵνα hàn lọ́nà àdánidá ní Yorùbá.
- source_word: τὸ ῥηθὲν
  choice: ohun tí a ti sọ
  rationale: Ó tú participle oníarticle náà sí ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì pa ohùn passive mọ́.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Ó tọ́ka sí Aísáyà gẹ́gẹ́ bí alárinà tí a fi jíṣẹ́, kì í ṣe gẹ́gẹ́ bí orísun ìkẹyìn ọ̀rọ̀ náà.
- source_word: Ἠσαΐου
  choice: Aísáyà
  rationale: Èyí ni irúkọ wòlíì náà tí ó wọ́pọ̀, tí a sì kọ pẹ̀lú àmì ohùn Yorùbá.
- source_word: τοῦ προφήτου
  choice: wòlíì
  rationale: Ó pa àpèjúwe Aísáyà gẹ́gẹ́ bí wòlíì mọ́ ní ṣókí àti ní èdè àdánidá.
- source_word: λέγοντος
  choice: 'pé:'
  rationale: Nínú Yorùbá, ‘pé’ pẹ̀lú àmì ìdádúró méjì ni ọ̀nà àdánidá láti mú àyọlò tó ń bọ̀ wọlé, dípò títúmọ̀ participle náà ní líle gẹ́gẹ́ bí ‘ó ń sọ pé.’
theological_decisions:
- issue: Ipa wòlíì nínú gbólóhùn àyọlò
  choice: nípasẹ̀ wòlíì Aísáyà
  alternative: láti ẹnu wòlíì Aísáyà / láti ọwọ́ wòlíì Aísáyà
  rationale: ‘Nípasẹ̀’ bá διά pẹ̀lú genitive mu, ó sì pa ìyàtọ̀ mọ́ láàárín ẹni tí ọ̀rọ̀ ti pilẹ̀ṣẹ̀ àti wòlíì tí a fi ọ̀rọ̀ náà jíṣẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘nípasẹ̀’ láti pa ìtumọ̀ alárinà mọ́, ‘pé:’ sì so ẹsẹ yìí mọ́ àyọlò tó bẹ̀rẹ̀ ní ẹsẹ tó tẹ̀ lé e.
