id: MAT.12.15
reference: Matthew 12:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: yo
  text: Ṣùgbọ́n Jésù, nígbà tí ó mọ̀ nípa èyí[a], ó kúrò níbẹ̀. Ọ̀pọ̀ ènìyàn sì tẹ̀ lé e, ó sì mú gbogbo wọn láradá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n Jésù, nígbà tí ó mọ̀, ó kúrò níbẹ̀.” Ọ̀rọ̀ Gíríìkì kò sọ ohun tí Jésù mọ̀ ní tààrà; àyíká ọ̀rọ̀ inú ẹsẹ tó ṣáájú ló mú un yé wa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: nígbà tí Jésù mọ èyí
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist, ó sì fi hàn pé Jésù ti mọ ohun tí ó ṣẹlẹ̀ kí ó tó yẹ̀ kúrò. “Èyí” tọ́ka sí ìmọ̀ràn búburú àwọn Farisí inú ẹsẹ tó ṣáájú, láìṣàfikún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἀνεχώρησεν
  choice: ó yẹ̀ kúrò
  rationale: “Yẹ̀ kúrò” jẹ́ ọ̀nà Yorùbá tó bójú mu láti fi ìfàsẹ́yìn tàbí kíkúrò níwájú àtakò hàn, láìsọ pé Jésù sá nítorí ẹ̀rù.
- source_word: ἐκεῖθεν
  choice: níbẹ̀
  rationale: Ó túmọ̀ sí kíkúrò ní ibi náà; “kúrò níbẹ̀” jẹ́ gbólóhùn Yorùbá tó ṣe déédéé.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Ọ̀pọ̀ ènìyàn sì tẹ̀ lé e
  rationale: πολλοί túmọ̀ sí “ọ̀pọ̀” láìjẹ́ pé ó dandan kí a pè wọ́n ní ogunlọ́gọ̀; fífi “ènìyàn” kún un mú kí Yorùbá ṣe kedere, ó sì jẹ́ ti ẹ̀dá.
- source_word: ἐθεράπευσεν
  choice: ó sì mú ... láradá
  rationale: “Mú láradá” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ìwòsàn nínú àyíká Ìhìn Rere.
- source_word: αὐτοὺς πάντας
  choice: gbogbo wọn
  rationale: Èyí pa agbára πάντας mọ́, ó sì fi hàn pé gbogbo àwọn tí a ń tọ́ka sí ni ó mú láradá.
theological_decisions:
- issue: Ohun tí γνοὺς ní gẹ́gẹ́ bí àfojúsùn
  choice: A túmọ̀ rẹ̀ sí “mọ èyí,” níbi tí “èyí” ti ń tọ́ka sí ète ọ̀tá inú ẹsẹ tó ṣáájú.
  alternative: “Jésù mọ̀, ó sì yẹ̀ kúrò níbẹ̀” tàbí “nígbà tí Jésù gbọ́ nípa rẹ̀.”
  rationale: Gíríìkì kò sọ àfojúsùn ọ̀rọ̀-ìṣe náà ní tààrà, ṣùgbọ́n àyíká ọ̀rọ̀ ló pèsè rẹ̀. “Èyí” pa ìsopọ̀ mọ́ ẹsẹ tó ṣáájú láìtúmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- issue: Ìtumọ̀ kíkúrò Jésù
  choice: “ó yẹ̀ kúrò” láti fi ìfàsẹ́yìn tó mọ̀ọ́mọ̀ ṣe hàn.
  alternative: “ó kúrò” tàbí “ó lọ kúrò.”
  rationale: Yíyàn yìí pa ìtumọ̀ ìfàsẹ́yìn níwájú àtakò mọ́, ṣùgbọ́n kò fi ẹ̀rù tàbí ojò sí Jésù lọ́rùn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yan “yẹ̀ kúrò” láti pa ìtumọ̀ ìfàsẹ́yìn mọ́ láìjẹ́ kí gbólóhùn náà dà bí èdè àtijọ́ jù.
