revisions:
- from: Ṣùgbọ́n nígbà tí Jésù mọ èyí[a], ó yẹ̀ kúrò níbẹ̀. Ọ̀pọ̀ ènìyàn sì tẹ̀ lé e, ó sì mú gbogbo wọn láradá.
  to: Ṣùgbọ́n Jésù, nígbà tí ó mọ̀ nípa èyí[a], ó kúrò níbẹ̀. Ọ̀pọ̀ ènìyàn sì tẹ̀ lé e, ó sì mú gbogbo wọn láradá.
  rationale: The revision replaces the modal expression “yẹ̀ kúrò” with the neutral, idiomatic narrative expression “kúrò níbẹ̀,” preserving the Greek statement that Jesus withdrew without adding an implication of obligation. It also corrects the tone mark in mọ̀ and makes the supplied contextual object read naturally in Yoruba. The footnote continues to signal that the Greek leaves the object of ‘knowing’ unstated.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jesus’ prior awareness, departure, the many who followed, and the comprehensive healing. However, “ó yẹ̀ kúrò” normally conveys obligation or propriety (“he ought to leave”), rather than ἀνεχώρησεν, which here denotes his departure/withdrawal.
  naturalness: The verse is otherwise clear, modern Standard Yoruba. “Ó kúrò níbẹ̀” is idiomatic and avoids introducing an unintended modal sense. Adding “nípa” with “mọ̀ nípa èyí” is natural Yoruba for awareness of a matter.
  terminology: “Jésù,” “Ọ̀pọ̀ ènìyàn,” “tẹ̀ lé e,” and “mú ... láradá” are appropriate and natural in the Gospel register. Tone marking is corrected for mọ̀ (‘know’).
  issues:
  - severity: medium
    issue: “ó yẹ̀ kúrò” renders ἀνεχώρησεν with an unintended modal sense.
    rationale: 'In Standard Yoruba, yẹ̀ commonly means ‘be fitting/appropriate’ or ‘ought to.’ The Greek is an indicative narrative verb: Jesus withdrew/departed. “Ó kúrò níbẹ̀” preserves the asserted action without implying that he was obliged to leave.'
  - severity: low
    issue: The verb ‘know’ lacks its required low-tone mark in “mọ èyí.”
    rationale: The verb meaning ‘know’ is mọ̀. Correct tone marking improves accuracy and readability.
  revised_text: Ṣùgbọ́n Jésù, nígbà tí ó mọ̀ nípa èyí[a], ó kúrò níbẹ̀. Ọ̀pọ̀ ènìyàn sì tẹ̀ lé e, ó sì mú gbogbo wọn láradá.
  revised_footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n Jésù, nígbà tí ó mọ̀, ó kúrò níbẹ̀.” Ọ̀rọ̀ Gíríìkì kò sọ ohun tí Jésù mọ̀ ní tààrà; àyíká ọ̀rọ̀ inú ẹsẹ tó ṣáájú ló mú un yé wa.
    reason: lexical_alternative
  revision_rationale: The revision replaces the modal expression “yẹ̀ kúrò” with the neutral, idiomatic narrative expression “kúrò níbẹ̀,” preserving the Greek statement that Jesus withdrew without adding an implication of obligation. It also corrects the tone mark in mọ̀ and makes the supplied contextual object read naturally in Yoruba. The footnote continues to signal that the Greek leaves the object of ‘knowing’ unstated.
