id: MAT.12.50
reference: Matthew 12:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó bá ṣe ìfẹ́ Baba mi tí ń bẹ ní ọ̀run, òun náà ni arákùnrin mi, arábìnrin mi, àti ìyá mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, àwọn ọ̀rọ̀ tí a túmọ̀ sí ‘ẹnikẹ́ni’ àti ‘òun náà’ wà ní fọ́ọ̀mù akọ-ẹyọ nípa gírámà, ṣùgbọ́n wọ́n ń tọ́ka sí ẹnikẹ́ni, yálà ọkùnrin tàbí obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: ẹnikẹ́ni tí ó bá
  rationale: Ìtumọ̀ yìí fi ipò àìdájú tó ṣí sí gbogbo ènìyàn hàn ní Yorùbá àdánidá, ó sì bá ìtumọ̀ ‘ẹnikẹ́ni tí’ mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú.
- source_word: ποιήσῃ
  choice: ṣe
  rationale: ‘Ṣe ìfẹ́’ tẹ̀lé àkópọ̀ ποιέω pẹ̀lú θέλημα ní tààrà; ‘gbọ́ràn’ yóò dín ìtumọ̀ rẹ̀ kù nípa túmọ̀ rẹ̀ sí ìgbọ́ràn nìkan.
- source_word: τὸ θέλημα
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí ẹnì kan fẹ́ tàbí pinnu; nínú àkópọ̀ ‘ṣe ìfẹ́ Baba,’ ó pa ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ àti ìbáṣepọ̀ náà mọ́.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Baba mi tí ń bẹ ní ọ̀run
  rationale: Ó pa àpèjúwe Baba náà gẹ́gẹ́ bí ẹni tí ó wà ní ọ̀run mọ́, láì sọ ọ́ di àkọlé ‘Baba ọ̀run’.
- source_word: αὐτός
  choice: òun náà
  rationale: 'Fọ́ọ̀mù yìí fi ìtẹnumọ́ αὐτός hàn: ẹni náà gan-an ni ọmọ ẹbí tòótọ́.'
- source_word: ἀδελφὸς
  choice: arákùnrin mi
  rationale: Ó jẹ́ ìbámu tààrà, ó sì pa ẹyọ ọ̀rọ̀ náà mọ́.
- source_word: ἀδελφὴ
  choice: arábìnrin mi
  rationale: Ó jẹ́ ìbámu tààrà, ó sì pa ìtọ́ka obìnrin tó ṣe kedere nínú Gíríìkì mọ́.
- source_word: μήτηρ
  choice: ìyá mi
  rationale: Ó jẹ́ ìbámu tààrà, ó sì pa ẹyọ àti ipa ẹbí náà mọ́.
- source_word: ἐστίν
  choice: ni
  rationale: Àmì ìdánimọ̀ ‘ni’ ni Yorùbá àdánidá fún copula nínú gbólóhùn yìí.
theological_decisions:
- issue: Ọ̀rọ̀ akọ ẹyọ tó dúró fún gbogbo ènìyàn
  choice: ẹnikẹ́ni ... òun náà
  alternative: ọkùnrin yòówù ... òun
  rationale: Fọ́ọ̀mù akọ ẹyọ Gíríìkì jẹ́ ti gírámà, ó sì ní agbára àpapọ̀, kì í ṣe pé ó fi àwọn obìnrin sílẹ̀. Yorùbá kò nílò àmì akọ nínú ọ̀rọ̀ arọ́pò-orúkọ ẹni-kẹta; ‘ẹnikẹ́ni ... òun náà’ pa ìtumọ̀ àpapọ̀ àti ìtẹnumọ́ mọ́ láì fi akọ tí kò ṣe pàtàkì kún un. Àwọn ọ̀rọ̀ ‘arákùnrin,’ ‘arábìnrin,’ àti ‘ìyá’ ṣì pa àtòjọ ipa ẹbí kọọkan mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Tí ń bẹ ní ọ̀run’ jẹ́ ọ̀nà tó ní iyì tí ó sì sun mọ́ orísun; ‘òun náà’ mú ìtẹnumọ́ Gíríìkì jáde. Àmì àlàyé [a] wà lẹ́yìn gbogbo gbólóhùn nítorí ó ṣàlàyé agbára àpapọ̀ ọ̀rọ̀ náà.
