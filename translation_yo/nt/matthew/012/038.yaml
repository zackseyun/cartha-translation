id: MAT.12.38
reference: Matthew 12:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: yo
  text: Nígbà náà, àwọn kan lára àwọn akọ̀wé àti àwọn Fárísí dá a lóhùn pé, “Olùkọ́, a fẹ́ rí àmì kan[a] láti ọ̀dọ̀ rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àmì iṣẹ́ ìyanu.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àmì iṣẹ́ ìyanu, ṣùgbọ́n ọ̀rọ̀ pàtàkì náà pa ìtumọ̀ gbòòrò náà, “àmì,” mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ohun tó ṣáájú rẹ̀ nínú ìtàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘nígbà náà’ ní Yorùbá.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: dá a lóhùn
  rationale: Èyí pa ìtumọ̀ ‘dáhùn’ mọ́, bó tilẹ̀ jẹ́ pé kò sí ìbéèrè tààrà ní ẹsẹ yìí; ó tún sọ ẹni tí wọ́n ń bá sọ̀rọ̀ ní kedere.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: àwọn kan lára àwọn akọ̀wé àti àwọn Fárísí
  rationale: ‘Àwọn kan lára’ fi hàn pé kì í ṣe gbogbo àwọn tó wà nínú ẹgbẹ́ méjèèjì; ‘akọ̀wé’ àti ‘Fárísí’ jẹ́ àwọn orúkọ ẹgbẹ́ tó bá ọ̀rọ̀ Gíríìkì mu.
- source_word: λέγοντες
  choice: pé
  rationale: Ní Yorùbá àdánidá, ‘pé’ ni a fi ń ṣí ọ̀rọ̀ tààrà lẹ́yìn ‘dá a lóhùn’; yíyí participle náà sí ‘wọ́n ń wí pé’ yóò wuwo láìfi ìtumọ̀ kún un.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ó túmọ̀ sí ẹni tó ń kọ́ni, láìfi agbára tàbí oyè mìíràn tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: θέλομεν
  choice: a fẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere fún fífẹ́ tàbí ìfẹ́-ọkàn.
- source_word: ἀπὸ σοῦ
  choice: láti ọ̀dọ̀ rẹ
  rationale: Ó fi Jésù hàn gẹ́gẹ́ bí orísun àmì tí wọ́n ń béèrè, ó sì dun bí Yorùbá àdánidá.
- source_word: σημεῖον
  choice: àmì kan
  rationale: ‘Àmì’ pa ìtumọ̀ gbòòrò ti ọ̀rọ̀ Gíríìkì mọ́; àyíká lè fi hàn pé iṣẹ́ ìyanu ni wọ́n ń retí láìjẹ́ pé a fi ìtumọ̀ tó dín kù sínú ẹsẹ náà.
- source_word: ἰδεῖν
  choice: rí
  rationale: Ìtumọ̀ tààrà ni ‘rí’; kò fi àlàyé bí ‘jẹ́rìí sí’ tí kò pọn dandan kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Irú ‘àmì’ tí σημεῖον ń tọ́ka sí
  choice: àmì
  alternative: àmì iṣẹ́ ìyanu
  rationale: Nínú àyíká yìí, ó ṣeé ṣe kí wọ́n máa béèrè iṣẹ́ ìyanu gẹ́gẹ́ bí ẹ̀rí ìdánimọ̀ Jésù. Síbẹ̀, σημεῖον fúnra rẹ̀ túmọ̀ sí ‘àmì,’ nítorí náà a pa ìtumọ̀ gbòòrò náà mọ́ nínú ọ̀rọ̀ pàtàkì, a sì fi ìtumọ̀ tó ṣeé ṣe sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yí participle Gíríìkì padà sí ìṣètò ọ̀rọ̀ Yorùbá àdánidá.
