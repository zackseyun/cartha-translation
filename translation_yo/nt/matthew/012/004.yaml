id: MAT.12.4
reference: Matthew 12:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: yo
  text: bí ó ti wọ ilé Ọlọ́run, tí wọ́n sì jẹ[a] búrẹ́dì tí a gbé sí iwájú Ọlọ́run[b], èyí tí kò bófin mu fún un láti jẹ, tàbí fún àwọn tí ó wà pẹ̀lú rẹ̀, bí kò ṣe fún àwọn àlùfáà nìkan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “ó sì jẹ,” dípò “wọ́n sì jẹ.”
    reason: textual_variant
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “búrẹ́dì ìfihàn,” ìyẹn búrẹ́dì mímọ́ tí a gbé kalẹ̀ níwájú Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: bí ó ti
  rationale: Nínú ìbéèrè tí ẹsẹ yìí ń tẹ̀ síwájú, ‘bí ó ti’ jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ohun tí Jesu ń tọ́ka sí nínú ìtàn Dafidi.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ó ti wọ ilé Ọlọ́run
  rationale: Ó pa ìṣe wíwọlé àti gbólóhùn ‘ilé Ọlọ́run’ mọ́, láì fi ‘àgọ́ ìjọsìn’ tàbí àlàyé míì rọ́pò ohun tí Gíríìkì sọ.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: búrẹ́dì tí a gbé sí iwájú Ọlọ́run
  rationale: Gbólóhùn yìí ṣàlàyé ní èdè Yorùbá òde òní pé búrẹ́dì mímọ́ náà ni a gbé kalẹ̀ níwájú Ọlọ́run, ó sì yẹra fún ọ̀rọ̀ àtijọ́ tí ọ̀pọ̀ ènìyàn lè má lóye.
- source_word: ἔφαγον
  choice: wọ́n sì jẹ
  rationale: A tẹ̀ lé kíkà ọ̀pọ̀ ènìyàn nínú SBLGNT; ó tún bá ìtọ́ka tó tẹ̀ lé e sí àwọn tí ó wà pẹ̀lú Dafidi mu.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: èyí tí kò bófin mu fún un láti jẹ
  rationale: ‘Kò bófin mu’ pa agbára òfin àti ìlànà ìjọsìn inú ἐξὸν mọ́ ju ọ̀rọ̀ aláìlágbára bí ‘a kò gbà á láàyè’ lọ.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: bẹ́ẹ̀ ni kò bófin mu fún àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: Ó sọ ìtumọ̀ náà ní kedere, ó sì pa àjọṣe àwọn ẹlẹgbẹ́ Dafidi mọ́ láì fi àlàyé tí kò sí nínú orísun kún un.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: bí kò ṣe fún àwọn àlùfáà nìkan
  rationale: ‘Bí kò ṣe’ fi ìyọkúrò hàn, ‘nìkan’ sì pa ìtumọ̀ ìyasọ́tọ̀ μόνοις mọ́.
theological_decisions:
- issue: Agbára òfin àti ìlànà ìjọsìn nínú ἐξὸν
  choice: kò bófin mu
  alternative: a kò yọ̀ǹda fún un
  rationale: Ìjiyàn Jesu dá lórí ìlànà mímọ́ tí a mọ̀, kì í ṣe lórí àṣà lasán; ‘kò bófin mu’ fi èyí hàn láì ṣàfikún ẹ̀kọ́ ẹ̀sìn kan.
- issue: Ẹni tàbí àwọn ẹni tí ἔφαγον ń tọ́ka sí
  choice: wọ́n sì jẹ
  alternative: ó sì jẹ
  rationale: SBLGNT tí a pèsè ní ọ̀nà ọ̀pọ̀ ènìyàn, ἔφαγον. A fi kíkà ẹyọ ọ̀kan pamọ́ sínú àlàyé ìsàlẹ̀ dípò kí a yanju ìyàtọ̀ àfọwọ́kọ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. A lo ‘búrẹ́dì’ nítorí ó wọ́pọ̀ ní èdè òde òní; àlàyé tó tẹ̀ lé e mú ìtumọ̀ ìjọsìn rẹ̀ kedere. Àwọn àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
