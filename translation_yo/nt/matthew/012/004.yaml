  terminology: '“Búrẹ́dì tí a gbé sí iwájú Ọlọ́run” jẹ́ ìtumọ̀ kedere fún ἄρτους τῆς προθέσεως. Ṣùgbọ́n “àkàrà ìfihàn” nínú àlàyé ìsàlẹ̀ kò yẹ: àkàrà kì í ṣe búrẹ́dì/loaf nínú ìtumọ̀ ọ̀rọ̀ ìjọsìn yìí. “Búrẹ́dì ìfihàn” jẹ́ àṣàyàn tó péye.'
