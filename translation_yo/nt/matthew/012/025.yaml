revisions:
- from: Ṣùgbọ́n ó mọ èrò inú wọn[a], ó sì sọ fún wọn pé, “Gbogbo ìjọba tí ó pínyà sí ara rẹ̀ a di ahoro[b], gbogbo ìlú tàbí ilé[c] tí ó pínyà sí ara rẹ̀ kì yóò sì dúró.”
  to: Ṣùgbọ́n ó mọ èrò inú wọn[a], ó sì sọ fún wọn pé, “Gbogbo ìjọba tí ó yapa sí ara rẹ̀ a di ahoro[b], gbogbo ìlú tàbí ilé[c] tí ó yapa sí ara rẹ̀ kì yóò sì dúró.”
  rationale: The revision replaces a less idiomatic expression for self-opposing division with natural Standard Yoruba while preserving the Greek ambiguity and proverbial formulation. It also corrects the grammatical form of one lexical-alternative footnote. The anchors remain attached to their respective words.
