review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Jesus’ knowledge of their inward thoughts without specifying its means, and it preserves the maxim’s scope: kingdom, city, or house internally divided. The present-result force of ἐρημοῦται and future force of οὐ σταθήσεται are retained adequately.'
  naturalness: The wording is generally clear and dignified Standard Yoruba. However, “tí ó pínyà sí ara rẹ̀” is less idiomatic for the established sense of a body being divided against itself. “Tí ó yapa sí ara rẹ̀” is more natural and clearly expresses internal opposition. The alternative in footnote b also needs grammatical correction.
  terminology: “Èrò inú,” “ìjọba,” “ìlú,” and “ilé” are appropriate. The footnote on ilé appropriately preserves the possible household sense of οἰκία. No theological interpretation is added.
  issues:
  - severity: medium
    issue: “pínyà sí ara rẹ̀” is not the clearest natural rendering of internal division.
    rationale: Although understandable, it can suggest simply being split apart. “Yapa sí ara rẹ̀” idiomatically communicates the adversative internal division expressed by μερισθεῖσα καθ’ ἑαυτῆς.
  - severity: low
    issue: Footnote b’s alternative “a parun” is grammatically unsuitable in this context.
    rationale: As an alternative for a singular kingdom, “ó parun” is grammatical, while “a run ún” can express passive destruction. This correction does not alter the verse’s sense.
  revised_text: Ṣùgbọ́n ó mọ èrò inú wọn[a], ó sì sọ fún wọn pé, “Gbogbo ìjọba tí ó yapa sí ara rẹ̀ a di ahoro[b], gbogbo ìlú tàbí ilé[c] tí ó yapa sí ara rẹ̀ kì yóò sì dúró.”
