id: MAT.12.25
reference: Matthew 12:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: yo
  text: Ṣùgbọ́n ó mọ èrò inú wọn[a], ó sì sọ fún wọn pé, “Gbogbo ìjọba tí ó yapa sí ara rẹ̀ a di ahoro[b], gbogbo ìlú tàbí ilé[c] tí ó yapa sí ara rẹ̀ kì yóò sì dúró.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìrònú” tàbí “ète inú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ó parun” tàbí “a run ún.”
    reason: lexical_alternative
  - marker: c
    text: Níhìn-ín, “ilé” tún lè túmọ̀ sí “àwọn ará ilé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ó mọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìmọ̀ tàbí òye ohun tó wà lọ́kàn. ‘Ó mọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, kò sì sọ bí ó ṣe ní ìmọ̀ náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ fi ìyípadà kékeré tàbí ìtakora hàn nínú ọ̀rọ̀; ‘Ṣùgbọ́n’ bá ìyípadà ìjiyàn inú àyíká ọ̀rọ̀ mu.
- source_word: ἐνθυμήσεις
  choice: èrò inú
  rationale: Ó lè túmọ̀ sí èrò, ìrònú jinlẹ̀, tàbí ète inú. ‘Èrò inú’ jẹ́ adayeba ní Yorùbá, ó sì pa ìtumọ̀ náà mọ́ láì dín un sí ète búburú nìkan.
- source_word: Πᾶσα βασιλεία
  choice: Gbogbo ìjọba
  rationale: Ìsọ yìí jẹ́ òwe tó kan ìjọba kọ̀ọ̀kan; ‘Gbogbo ìjọba’ pa agbára gbogbogbò πᾶσα mọ́.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: tí ó pínyà sí ara rẹ̀
  rationale: Gbólóhùn yìí fi ìpínyà inú ẹgbẹ́ kan sí ara rẹ̀ hàn. Ìtumọ̀ Yorùbá náà jẹ́ kedere, ó sì pa agbára ìtakora κατά mọ́.
- source_word: ἐρημοῦται
  choice: a di ahoro
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí dídi ahoro tàbí wíwó lulẹ̀. ‘A di ahoro’ jẹ́ ìsọ àsìkò gbogboogbo ní Yorùbá, ó sì pa àbájáde líle náà mọ́ láì fi olùṣe kan kún un.
- source_word: πόλις ἢ οἰκία
  choice: ìlú tàbí ilé
  rationale: πόλις ni ‘ìlú,’ οἰκία sì lè jẹ́ ilé gẹ́gẹ́ bí ibi tàbí àwọn ará ilé. ‘Ilé’ pa ọ̀rọ̀ Gíríìkì mọ́ ní fífẹ̀, àlàyé ìsàlẹ̀ sì tọ́ka sí ìtumọ̀ kejì.
- source_word: οὐ σταθήσεται
  choice: kì yóò dúró
  rationale: Gbólóhùn ọjọ́ iwájú náà túmọ̀ sí pé kò ní dúró ṣinṣin tàbí máa bá a lọ. ‘Kì yóò dúró’ jẹ́ ṣókí, adayeba, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Irú ọ̀nà tí Jésù gbà mọ èrò inú wọn
  choice: A sọ kìkì pé ó mọ èrò inú wọn, láì ṣàlàyé bí ó ṣe mọ̀ ọ́n.
  alternative: Láti sọ ní pàtó pé ó mọ̀ ọ́n nípa agbára àtọ̀runwá, nípa ìmísí àsọtẹ́lẹ̀, tàbí nípa fífi ohun tó rí yé ara rẹ̀.
  rationale: Ẹsẹ náà fìdí ìmọ̀ rẹ̀ múlẹ̀, ṣùgbọ́n kò ṣàlàyé ọ̀nà tí ìmọ̀ náà gbà dé ọ̀dọ̀ rẹ̀. Ìtumọ̀ náà kò yẹ kí ó yanjú ohun tí orísun fi sílẹ̀ ní àìsọtán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìsọ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘a di ahoro’ gẹ́gẹ́ bí ìsọ òwe gbogboogbo, nígbà tí ‘kì yóò dúró’ pa ọjọ́ iwájú ọ̀rọ̀ Gíríìkì mọ́.
