    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s rebuke, metaphor, and sequence while replacing an unclear overflow expression with natural Yoruba. The footnote at b retains “àkúnwọ́sílẹ̀” as a closer image-based alternative, whereas the main text uses a readily understood expression for the heart’s abundance.
