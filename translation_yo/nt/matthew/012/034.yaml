review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the vocative rebuke, rhetorical question, moral force of πονηροί, and the heart-to-speech causal image. However, “ohun tí ó kún inú ọkàn dé àkúnwọ́sílẹ̀” is not idiomatic Yoruba and does not clearly express the Greek idea of abundance/overflow as the source from which speech proceeds.
  naturalness: “Ẹ̀yin ọmọ paramọ́lẹ̀” is a clear and forceful Yoruba rendering of the metaphor. “Níwọ̀n bí ẹ ti jẹ́ ènìyàn búburú” more naturally conveys the participial circumstance than the temporal “nígbà tí ẹ jẹ́ búburú.” Recasting the final clause produces fluent modern Standard Yoruba while preserving its compact proverbial character.
  terminology: Retain “ọkàn” for καρδία and “ènìyàn búburú” for the ethical force of πονηροί. “Paramọ́lẹ̀” appropriately preserves the viper image; the alternate “irú-ọmọ paramọ́lẹ̀” should be presented as a lexical alternative without an unnecessary repeated vocative.
  issues:
  - severity: medium
    issue: The phrase “ohun tí ó kún inú ọkàn dé àkúnwọ́sílẹ̀” is awkward and semantically unclear.
    rationale: It does not naturally convey περισσεύματος (“abundance, overflow”) in Yoruba. “Láti inú ọ̀pọ̀ ohun tí ó kún inú ọkàn” clearly expresses that the mouth’s speech proceeds from the heart’s abundance.
  - severity: low
    issue: “Nígbà tí” can make πονηροὶ ὄντες sound primarily temporal.
    rationale: The Greek participle describes their moral condition in the rhetorical question. “Níwọ̀n bí” better carries the contextual/causal sense without making the relation overly explicit.
  revised_text: “Ẹ̀yin ọmọ paramọ́lẹ̀[a], báwo ni ẹ ṣe lè sọ ohun rere, níwọ̀n bí ẹ ti jẹ́ ènìyàn búburú? Nítorí láti inú ọ̀pọ̀ ohun tí ó kún inú ọkàn[b] ni ẹnu ń sọ̀rọ̀.”
  revised_footnotes:
