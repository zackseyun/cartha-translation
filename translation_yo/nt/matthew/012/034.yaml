- from: “Ẹ̀yin ọmọ paramọ́lẹ̀[a], báwo ni ẹ ṣe lè sọ ohun rere, nígbà tí ẹ jẹ́ búburú? Nítorí ohun tí ó kún inú ọkàn dé àkúnwọ́sílẹ̀[b] ni ẹnu ń sọ̀rọ̀.”
  to: “Ẹ̀yin ọmọ paramọ́lẹ̀[a], báwo ni ẹ ṣe lè sọ ohun rere, níwọ̀n bí ẹ ti jẹ́ ènìyàn búburú? Nítorí láti inú ọ̀pọ̀ ohun tí ó kún inú ọkàn[b] ni ẹnu ń sọ̀rọ̀.”
