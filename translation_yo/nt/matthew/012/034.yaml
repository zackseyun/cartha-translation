id: MAT.12.34
reference: Matthew 12:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: yo
  text: “Ẹ̀yin ọmọ paramọ́lẹ̀[a], báwo ni ẹ ṣe lè sọ ohun rere, níwọ̀n bí ẹ ti jẹ́ ènìyàn búburú? Nítorí láti inú ọ̀pọ̀ ohun tí ó kún inú ọkàn[b] ni ẹnu ń sọ̀rọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin irú-ọmọ paramọ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Nítorí láti inú àkúnwọ́sílẹ̀ ọkàn ni ẹnu ń sọ̀rọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Ẹ̀yin ọmọ paramọ́lẹ̀
  rationale: ‘Ọmọ’ ṣe àfihàn ohun tí a bí tàbí irú-ọmọ, ‘paramọ́lẹ̀’ sì pa àwòrán ejò olóró inú Gíríìkì mọ́. Fífí ‘ẹ̀yin’ síwájú mú kí ìpè sí ọ̀pọ̀ ènìyàn ṣe kedere ní Yorùbá.
- source_word: πῶς δύνασθε
  choice: báwo ni ẹ ṣe lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbéèrè àsọyé tí ń fi àìlèṣe tàbí àìbójúmu hàn.
- source_word: ἀγαθὰ λαλεῖν
  choice: sọ ohun rere
  rationale: Ó pa ìtumọ̀ àwọn ọ̀rọ̀ rere tàbí ohun tí ó dára mọ́ láìfi àlàyé míì kún un.
- source_word: πονηροὶ ὄντες
  choice: nígbà tí ẹ jẹ́ búburú
  rationale: ‘Búburú’ pa ìdájọ́ ìwà inú ọ̀rọ̀ Gíríìkì mọ́, ó sì lágbára ju àpèjúwe pé ohun kan kò dára lásán lọ.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Nítorí ohun tí ó kún inú ọkàn dé àkúnwọ́sílẹ̀
  rationale: Ọ̀rọ̀ yìí pa àwòrán ohun tí ó pọ̀ débi pé ó ń ṣàn jáde mọ́, ó sì so ìsọ̀rọ̀ mọ́ ohun tí ó kún inú ẹni.
- source_word: τὸ στόμα λαλεῖ
  choice: ni ẹnu ń sọ̀rọ̀
  rationale: Ìtumọ̀ yìí tẹ̀lé gbólóhùn Gíríìkì ní tààrà, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Agbára àkàwé ‘ọkàn’ (καρδία)
  choice: Pa ‘ọkàn’ mọ́ gẹ́gẹ́ bí àárín inú ẹni, ibi èrò, ìfẹ́ àti ìwà.
  alternative: inú ẹni; èrò inú
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Bíbélì tí ó gbòòrò, tí kò fi ìtumọ̀ rẹ̀ mọ́ ìmọ̀lára nìkan tàbí ọpọlọ nìkan.
- issue: Ìdájọ́ ìwà nínú πονηροὶ ὄντες
  choice: jẹ́ búburú
  alternative: jẹ́ ẹni ibi; jẹ́ ẹni burúkú
  rationale: Èyí pa ìwọ̀n ìbáwí àti ìdájọ́ ìwà inú ọ̀rọ̀ náà mọ́ láìmú un le ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àwọn ọ̀rọ̀ náà jẹ́ àdánidá fún òǹkàwé lónìí, ṣùgbọ́n wọ́n pa líle ìbáwí, àwòrán paramọ́lẹ̀, àti àkúnwọ́sílẹ̀ ohun inú ọkàn mọ́.
