id: MAT.12.9
reference: Matthew 12:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: yo
  text: Ó sì kúrò níbẹ̀, ó lọ sínú sínágọ́gù wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: “Sì” so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú rẹ̀ láì fi ìtumọ̀ àkókò kún ọ̀rọ̀ Gíríìkì.
- source_word: μεταβὰς ἐκεῖθεν
  choice: kúrò níbẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìṣípo kúrò ní ibi tí a ṣẹ̀ṣẹ̀ sọ hàn; gbólóhùn Yorùbá yìí jẹ́ adayeba, ó sì pa ìtumọ̀ náà mọ́.
- source_word: ἦλθεν
  choice: ó lọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ἔρχομαι lè túmọ̀ sí “wá,” ojú ìwòye ìtàn àti ìṣípo kúrò ní ibi kan sí òmíràn mú kí “lọ” jẹ́ èdè Yorùbá tó bá àyíká mu.
- source_word: εἰς τὴν συναγωγὴν
  choice: sínú sínágọ́gù
  rationale: “Sínú” pa agbára ìtọ́sọ́nà εἰς mọ́, ìyẹn ìwọlé sí inú ibi náà; “sínágọ́gù” ni ọ̀rọ̀ tí a mọ̀ fún ibi ìpéjọsìn àwọn Júù.
- source_word: αὐτῶν
  choice: wọn
  rationale: Arọ́pò-orúkọ olùní púpọ̀ náà ni a túmọ̀ ní tààrà, láì sọ ẹni tí “wọn” ń tọ́ka sí ní pàtó ju bí ọ̀rọ̀ Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Ẹni tí gbólóhùn “sínágọ́gù wọn” ń tọ́ka sí
  choice: A fi sílẹ̀ ní ọ̀nà àìdásí-ẹgbẹ́ gẹ́gẹ́ bí “sínágọ́gù wọn.”
  alternative: ibi ìpéjọ wọn; sínágọ́gù tí ó jẹ́ tiwọn
  rationale: Gíríìkì sọ συναγωγὴν αὐτῶν nìkan, kò sì fi ìta-kora tàbí ìyapa ẹ̀ya kan hàn ní pàtó. Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ àfikún sí i.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ kedere, ọlọ́lá, ó sì yẹ fún òǹkàwé òde òní. A lo “sínágọ́gù” gẹ́gẹ́ bí ọ̀rọ̀ ìtàn àti ẹ̀sìn tí a mọ̀, dípò àlàyé gígùn.
