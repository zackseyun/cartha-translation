id: MAT.12.30
reference: Matthew 12:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: yo
  text: Ẹni tí kò bá wà pẹ̀lú mi ń lòdì sí mi, ẹni tí kò bá sì kójọ pẹ̀lú mi ń tú ká.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: Ẹni tí kò bá wà
  rationale: Ọ̀rọ̀ yìí fi ẹni kan tí ìwà rẹ̀ jẹ́ pé kò wà pẹ̀lú Jésù hàn ní ọ̀nà gbogbogbò; “Ẹni tí kò bá wà” jẹ́ èdè Yorùbá àdánidá tí ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: μετά pẹ̀lú ọ̀rọ̀ inú genitive ń tọ́ka sí ìbáṣepọ̀ tàbí wíwà ní ìṣọ̀kan pẹ̀lú ẹnì kan; “pẹ̀lú mi” ni ìtumọ̀ tààrà tí kò fi àlàyé míì kún un.
- source_word: κατ’ ἐμοῦ
  choice: ń lòdì sí mi
  rationale: κατά pẹ̀lú genitive níbí túmọ̀ sí àtakò; “ń lòdì sí mi” fi àtakò náà hàn kedere ní Yorùbá.
- source_word: συνάγων
  choice: kójọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkó àwọn ohun tàbí ènìyàn jọ; “kójọ” pa àwòrán ìkórè tàbí ìtọ́jú agbo mọ́ láì sọ ọ́ di pàtó ju orísun lọ.
- source_word: σκορπίζει
  choice: ń tú ká
  rationale: “ń tú ká” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtúká, ó sì dúró ní ìtakora pẹ̀lú “kójọ” gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: καὶ
  choice: sì
  rationale: “sì” so gbólóhùn méjèèjì pọ̀ ní ọ̀nà àfikún, ó sì jẹ́ àdánidá ju lílo “àti” lọ ní àárín àwọn gbólóhùn Yorùbá wọ̀nyí.
theological_decisions:
- issue: Agbára ìtakora pípé nínú ọ̀rọ̀ Jésù
  choice: A mú un jáde gẹ́gẹ́ bí ọ̀rọ̀ tí kò dín ìyàtọ̀ láàárín wíwà pẹ̀lú Jésù àti lílòdì sí i kù.
  alternative: Àtúnsọ tó rọrùn ṣùgbọ́n tó lè dín agbára ìtakora náà kù.
  rationale: Gíríìkì gbé gbólóhùn méjì tó lágbára tí ó sì jọ ara wọn kalẹ̀ láìsí ọ̀rọ̀ amúrọ̀; ìtumọ̀ Yorùbá pa ìfúnpá àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìfi ìpinnu ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ẹni tí…” gẹ́gẹ́ bí ìtọ́kasí gbogbogbò, a sì lo ìṣe onítẹ̀síwájú “ń lòdì… / ń tú ká” láti fi ipò àti àbájáde tí ọ̀rọ̀ náà ń sọ hàn. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan, nítorí àṣàyàn “Ẹni tí” ti gba ìtumọ̀ gbogbogbò ti ὁ pẹ̀lú participle dáadáa.
