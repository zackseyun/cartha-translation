id: MAT.12.3
reference: Matthew 12:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Ṣé ẹ kò ti ka ohun tí Dáfídì ṣe nígbà tí ebi pa á, tí ebi sì pa àwọn tí ó wà pẹ̀lú rẹ̀?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “Ṣé ẹ kò ti ka ohun tí Dáfídì ṣe nígbà tí ebi pa òun àti àwọn tí ó wà pẹ̀lú rẹ̀?” Nínú èdè Gíríìkì, a lè lóye pé ebi pa Dáfídì àti àwọn tí ó wà pẹ̀lú rẹ̀, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe ẹyọ kan tí a lò tọ́ka ní pàtó sí Dáfídì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ṣùgbọ́n ó
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀; “Ṣùgbọ́n” bá ọ̀rọ̀ ìdáhùn Jésù sí ẹ̀sùn àwọn Farisí mu níhìn-ín.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó bá wọn sọ̀rọ̀, láìfi ìtumọ̀ míì kún un.
- source_word: Οὐκ ἀνέγνωτε
  choice: Ṣé ẹ kò ti ka
  rationale: Ìbéèrè àsọyé yìí ń tọ́ka sí ohun tí ó yẹ kí àwọn olùgbọ́ ti mọ̀ nínú Ìwé Mímọ́; ọ̀rọ̀ yìí ṣe bẹ́ẹ̀ ní Yorùbá òde òní.
- source_word: τί ἐποίησεν
  choice: ohun tí ... ṣe
  rationale: ποιέω túmọ̀ sí “ṣe” ní ìtàn yìí; kò nílò àlàyé àfikún.
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Orúkọ náà ni a kọ ní ìrísí tí ó wọ́pọ̀, tí ó sì bá ìró Yorùbá mu.
- source_word: ὅτε ἐπείνασεν
  choice: nígbà tí ebi pa á
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún “nígbà tí ebi ń pa á/nígbà tí ebi pa á,” láìgbọ́n aspect ọ̀rọ̀ Gíríìkì ju bó ṣe yẹ lọ.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: tí ebi sì pa àwọn tí ó wà pẹ̀lú rẹ̀
  rationale: A tún ọ̀rọ̀-ìṣe tí gbolohun Gíríìkì fi sílẹ̀ ṣe kedere, kí gbolohun Yorùbá lè pé, nígbà tí a ṣì tọ́ka sí àwọn tí wọ́n wà pẹ̀lú Dáfídì.
theological_decisions:
- issue: Bí ọ̀rọ̀ ebi ṣe kan Dáfídì àti àwọn tí ó wà pẹ̀lú rẹ̀
  choice: A sọ ní pàtó pé ebi pa Dáfídì, ebi sì pa àwọn tí ó wà pẹ̀lú rẹ̀.
  alternative: “nígbà tí ebi pa á, àti àwọn tí ó wà pẹ̀lú rẹ̀” tàbí “nígbà tí ebi pa òun àti àwọn tí ó wà pẹ̀lú rẹ̀”
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ẹyọ kan, ó sì tọ́ka ní tààrà sí Dáfídì, ṣùgbọ́n gbolohun tí ó tẹ̀ lé e lè jẹ́ kí ebi náà kan àwọn ẹlẹgbẹ́ rẹ̀. A yan ọ̀rọ̀ Yorùbá tí ó pé, a sì pa ìṣòro ìtumọ̀ náà mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. “Ṣé ẹ kò ti ka” jẹ́ ìbéèrè àsọyé tí ó ṣe kedere fún òǹkàwé lónìí; “ebi pa á” sì jẹ́ àṣàọ̀rọ̀ Yorùbá àdánidá. A fi àmì ohùn sí ibi tí ó bá ìkọ̀wé Yorùbá mu.
