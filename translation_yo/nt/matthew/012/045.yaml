  to: Nígbà náà ni ó lọ, ó sì mú àwọn ẹ̀mí mìíràn méje tí ó burú ju òun fúnra rẹ̀ lọ[a] bá ara rẹ̀ lọ. Wọ́n wọ inú rẹ̀, wọ́n sì ń gbé ibẹ̀; ipò ìkẹyìn ọkùnrin náà sì burú ju ti ìṣáájú lọ[b]. Bẹ́ẹ̀ gẹ́gẹ́ ni yóò rí sí ìran búburú yìí.
  rationale: 'A tún àwọn ibi méjì ṣe fún ìfararọ́ sí ìtumọ̀ ìṣe àti ibi nínú Gíríìkì: ẹ̀mí náà mú àwọn ẹ̀mí mìíràn bá ara rẹ̀ lọ, wọ́n sì wọ inú ọkùnrin náà. Àwọn ìtumọ̀ pàtàkì míì, pẹ̀lú ìfiwéra ipò ìkẹyìn àti ìṣáájú àti ìlò “ìran búburú,” ni a pa mọ́. Àwọn àmì ẹsẹ̀ àti àwọn ìdí wọn wà ní ipò tó bá ọ̀rọ̀ mu.'
