id: MAT.12.45
reference: Matthew 12:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: yo
  text: Nígbà náà ni ó lọ, ó sì mú àwọn ẹ̀mí mìíràn méje tí ó burú ju òun fúnra rẹ̀ lọ[a] bá ara rẹ̀ lọ. Wọ́n wọ inú rẹ̀, wọ́n sì ń gbé ibẹ̀; ipò ìkẹyìn ọkùnrin náà sì burú ju ti ìṣáájú lọ[b]. Bẹ́ẹ̀ gẹ́gẹ́ ni yóò rí sí ìran búburú yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀mí méje mìíràn tí ó yàtọ̀, tí wọ́n burú ju òun fúnra rẹ̀ lọ.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn ohun ìkẹyìn ti ọkùnrin náà burú ju àwọn ohun àkọ́kọ́ lọ”; àkànlò-èdè ni èyí, tí ó túmọ̀ sí pé ipò rẹ̀ ní ìkẹyìn burú ju ipò rẹ̀ tẹ́lẹ̀ lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìgbésẹ̀ tó tẹ̀ lé e nínú ìtàn hàn ní Yorùbá àdánidá.
- source_word: πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: ó lọ, ó sì mú ... wá pẹ̀lú rẹ̀
  rationale: Ó pa ìtẹ̀síwájú àwọn ìṣe méjèèjì àti ìtumọ̀ pé ó mú wọn bá ara rẹ̀ lọ mọ́.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: àwọn ẹ̀mí mìíràn méje
  rationale: “Mìíràn” túmọ̀ sí àwọn ẹ̀mí àfikún sí ti àkọ́kọ́ láìfi dandan sọ pé irú wọn yàtọ̀.
- source_word: πονηρότερα ἑαυτοῦ
  choice: tí ó burú ju òun fúnra rẹ̀ lọ
  rationale: Ó mú ìfiwéra ìwà ibi inú Gíríìkì jáde ní èdè tí ó ṣe kedere.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Wọ́n wọlé, wọ́n sì ń gbé ibẹ̀
  rationale: Ó sọ participle náà di ọ̀rọ̀-ìṣe Yorùbá àdánidá, ó sì fi ìgbé tí ń bá a lọ hàn.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: ipò ìkẹyìn ọkùnrin náà
  rationale: Eyi ni ìtumọ̀ àkànlò-èdè náà, tí ó ń tọ́ka sí bí ọ̀ràn ẹni náà ṣe parí.
- source_word: χείρονα τῶν πρώτων
  choice: burú ju ti ìṣáájú lọ
  rationale: Ó pa ìfiwéra láàárín ipò ìkẹyìn àti ipò tẹ́lẹ̀ mọ́ ní Yorùbá ṣókí.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Bẹ́ẹ̀ náà ni yóò rí fún ìran búburú yìí
  rationale: Ó fi ìlò àpẹẹrẹ náà sí ìran yìí hàn láìṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn.
theological_decisions:
- issue: Ìtumọ̀ πνεύματα nínú ọ̀rọ̀ nípa agbára ẹ̀mí búburú
  choice: àwọn ẹ̀mí
  alternative: àwọn ẹ̀mí èṣù
  rationale: Gíríìkì sọ pé “ẹ̀mí”; àyíká ọ̀rọ̀ ti fi hàn pé ẹ̀mí àìmọ́ ni, nítorí náà a kò nílò láti fi “èṣù” kún un.
- issue: Ìtumọ̀ ἀνθρώπου
  choice: ọkùnrin náà
  alternative: ẹni náà
  rationale: Ọ̀rọ̀ àpẹẹrẹ náà jẹ́ ẹyọ kan, ó sì jẹ́ akọ ní gírámà; “ọkùnrin” pa àkójọpọ̀ yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ń gbé” láti fi ìgbé pípẹ́ hàn.
