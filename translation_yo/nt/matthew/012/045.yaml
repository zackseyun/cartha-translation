  terminology: “Àwọn ẹ̀mí,” “ọkùnrin náà,” àti “ìran búburú yìí” bójú mu πνεύματα, ἀνθρώπου, àti γενεᾷ ... πονηρᾷ. A pa ìtumọ̀ àpẹẹrẹ ti τὰ ἔσχατα ... χείρονα τῶν πρώτων mọ́ gẹ́gẹ́ bí ipò ìkẹyìn tí ó burú ju ti ìṣáájú lọ.
