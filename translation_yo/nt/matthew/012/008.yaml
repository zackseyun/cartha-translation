  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: yo
  text: Nítorí, Ọmọ Ènìyàn ni Olúwa Sábáàtì.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọmọ Ènìyàn ni aláṣẹ lórí Sábáàtì.”
    reason: lexical_alternative
  - marker: b
    text: “Ọmọ Ènìyàn” ni àkọlé tí Jésù sábà máa ń fi pe ara rẹ̀ nínú àwọn Ìhìn Rere. A tún lè túmọ̀ ọ̀rọ̀ náà ní ọ̀nà gbogbogbòò sí “ọmọ ènìyàn,” ṣùgbọ́n èyí lè dín ìró àkọlé tí ó ṣeé ṣe kó ní kù.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa agbára àlàyé ọ̀rọ̀ náà mọ́, ó sì so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú.
- source_word: κύριος
  choice: Olúwa
  rationale: Ó fi ipò àṣẹ tó lágbára hàn, ó sì pa ìwúwo ẹ̀kọ́ nípa ẹni Kristi mọ́ láì dín un kù sí ‘ọ̀gá’.
- source_word: τοῦ σαββάτου
  choice: ọjọ́ ìsinmi
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí Sábáàtì gẹ́gẹ́ bí ọjọ́ mímọ́ tí a yà sọ́tọ̀ fún ìsinmi; ìbáṣepọ̀ genitive náà wà nínú ‘Olúwa ọjọ́ ìsinmi.’
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa àkọlé tí Jésù máa ń fi pe ara rẹ̀ nínú àwọn Ìhìn Rere mọ́, pẹ̀lú ìtumọ̀ tó ṣeé ṣe kó ní sí Dáníẹ́lì 7.
- source_word: ἐστιν
  choice: ni
  rationale: ‘Ni’ ni copula Yorùbá tó bá gbólóhùn àfihàn yìí mu lọ́nà àdánidá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa Kristi nínú κύριος ... τοῦ σαββάτου
  choice: Ọmọ Ènìyàn ni Olúwa ọjọ́ ìsinmi
  alternative: Ọmọ Ènìyàn ni aláṣẹ lórí ọjọ́ ìsinmi
  rationale: ‘Olúwa’ pa ìkéde àṣẹ tó lágbára mọ́, láì fi ohun tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- issue: Ìtumọ̀ ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: ẹni tí ó jẹ́ ènìyàn
  rationale: Àkọlé ìbílẹ̀ náà pa ìró àkọlé àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ míì mọ́; yíyí i sí gbólóhùn gbogbogbòò lè sọ ìtumọ̀ rẹ̀ di pẹlẹbẹ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ọjọ́ ìsinmi’ fún Sábáàtì kí ó lè yé òǹkàwé lójoojúmọ́, nígbà tí ‘Olúwa’ àti ‘Ọmọ Ènìyàn’ pa ìwúwo àti ìfojúsùn ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
