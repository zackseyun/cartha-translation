id: MAT.12.32
reference: Matthew 12:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá sọ ọ̀rọ̀ lòdì sí Ọmọ Ènìyàn,[a] a ó dárí jì í; ṣùgbọ́n ẹnikẹ́ni tí ó bá sọ̀rọ̀ lòdì sí Ẹ̀mí Mímọ́, a kì yóò dárí jì í, ní ìgbà ayé yìí tàbí ní èyí tí ń bọ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “sọ ohun kan lòdì sí Ọmọ Ènìyàn.”'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì αἰών túmọ̀ sí “ìgbà ayé” tàbí “sáà” níhìn-ín. Ní apá kejì, Gíríìkì sọ ní tààràtà pé “ní èyí tí ń bọ̀,” nígbà tí a lóye “ìgbà ayé” láti inú apá àkọ́kọ́.
    reason: lexical_and_elliptical_clarification
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: Ẹnikẹ́ni tí ó bá ... ṣùgbọ́n ẹnikẹ́ni tí ó bá
  rationale: Àkópọ̀ arọ́pò-orúkọ àti ἐάν/ἄν ń fi ipò gbogbogbò tí kò dá lórí ẹni kan hàn; ọ̀rọ̀ Yorùbá yìí pa ìtumọ̀ ‘ẹnikẹ́ni’ mọ́ lọ́nà àdánidá.
- source_word: εἴπῃ λόγον
  choice: sọ ọ̀rọ̀
  rationale: Ó pa λόγον mọ́ gẹ́gẹ́ bí ‘ọ̀rọ̀,’ ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédéé fún sísọ ohun kan.
- source_word: κατὰ
  choice: lòdì sí
  rationale: Nínú àyíká yìí, κατά pẹ̀lú ẹ̀ka genitive tọ́ka sí ọ̀rọ̀ ọ̀tá tàbí àtakò tí a darí sí ẹnì kan; ‘lòdì sí’ jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí pa oyè náà àti ìró Mèsáyà rẹ̀ mọ́, láì sọ ọ́ di ‘ọmọkùnrin kan’ tàbí ṣàlàyé rẹ̀ kọjá ohun tí Gíríìkì sọ.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: a ó dárí jì í / a kì yóò dárí jì í
  rationale: Ìkọ́lé aláìlẹ́ni Gíríìkì jẹ́ passive; ‘a ó’ ní Yorùbá ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà àdánidá láti pa ẹni tó ń dárí jì mọ́ ní àìsọ, ó sì mú ìyàtọ̀ rere àti òdì dúró.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá òde òní tó ṣe déédéé fún oyè náà.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: ní ìgbà ayé yìí tàbí ní èyí tí ń bọ̀
  rationale: ‘Ìgbà ayé’ mú ìtumọ̀ àkókò αἰών jáde, kì í ṣe ibi tàbí àgbáyé; ‘èYí tí ń bọ̀’ pa àfojúdi Gíríìkì mọ́ níbi tí a ti lóye αἰών láti inú apá àkọ́kọ́.
theological_decisions:
- issue: Ìyàtọ̀ àkókò láàárín αἰών yìí àti èyí tí ń bọ̀
  choice: ní ìgbà ayé yìí tàbí ní èyí tí ń bọ̀
  alternative: ní ayé yìí tàbí ní ayé tí ń bọ̀
  rationale: Yíyan ‘ìgbà ayé’ fi hàn pé àwọn sáà méjì ni ẹsẹ̀ náà ń fi wé ara wọn, kì í ṣe àwọn ibi méjì; ó pa ìfojúsùn ọjọ́ iwájú mọ́ láì gbé ètò ẹ̀kọ́ ìsìn pàtó wọlé.
- issue: Irú ẹ̀ṣẹ̀ tí a kò ní dárí jì
  choice: Pa ìkìlọ̀ pé kí a má sọ̀rọ̀ lòdì sí Ẹ̀mí Mímọ́ mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn kún un
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀ṣẹ̀ ìtàn kan ṣoṣo tàbí gẹ́gẹ́ bí àìronúpìwàdà títí dé òpin
  rationale: Ẹsẹ̀ náà sọ àbájáde ọ̀rọ̀ lòdì sí Ẹ̀mí Mímọ́, ṣùgbọ́n kò ṣàlàyé ìwà náà pẹ̀lú ìdíwọ̀n ẹ̀kọ́ ìsìn tó péye; ìtumọ̀ náà kò gbọ́dọ̀ yanju ohun tí ọ̀rọ̀ orísun fi sílẹ̀ fún ìtumọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàlagbà tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yàgò fún ọ̀rọ̀ ìjọ kan pàtó. ‘A ó dárí jì í’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa passive Gíríìkì àti ẹni tó ń ṣe ìdáríjì mọ́ láìsọ.
