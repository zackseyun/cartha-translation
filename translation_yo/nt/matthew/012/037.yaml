  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: yo
  text: Nítorí nípa ọ̀rọ̀ rẹ ni a ó fi dá ọ láre[a], àti nípa ọ̀rọ̀ rẹ ni a ó fi dá ọ lẹ́bi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó fìdí rẹ múlẹ̀ pé o wà ní ẹ̀tọ́,” tàbí “a ó kéde pé o kò jẹ̀bi.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ilé-ẹjọ́, pé a kéde pé ẹni náà wà ní ẹ̀tọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: nípa
  rationale: Ní ibi yìí, ἐκ fi ìpìlẹ̀ tàbí ẹ̀rí ìdájọ́ hàn; “nípa” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ọ̀rọ̀ ẹni ni a ó fi ṣe ìdájọ́ rẹ̀.
- source_word: γάρ
  choice: Nítorí
  rationale: γάρ ṣàlàyé ìdí fún ìkìlọ̀ tí ó ṣáájú nípa ọ̀rọ̀ ẹnu.
- source_word: λόγων σου
  choice: ọ̀rọ̀ rẹ
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àwọn ohun tí ẹni náà sọ. Yorùbá lè lo “ọ̀rọ̀” gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀ ní ẹyọ kan, nígbà tí àtúnsọ rẹ̀ sì pa ìbáramu àwọn gbólóhùn méjèèjì mọ́.
- source_word: δικαιωθήσῃ
  choice: a ó fi dá ọ láre
  rationale: Fọ́ọ̀mù àìṣe olùṣe ọjọ́ iwájú náà ní ìtumọ̀ ilé-ẹjọ́ ní àyíká yìí. “Dá ... láre” túmọ̀ sí pípolongo pé ẹni náà wà ní ẹ̀tọ́ tàbí pé kò jẹ̀bi, láìfi èrò ẹ̀kọ́ ìsìn kan kún un.
- source_word: καταδικασθήσῃ
  choice: a ó fi dá ọ lẹ́bi
  rationale: Ó jẹ́ ọ̀rọ̀ ìdájọ́ tí ó tako δικαιωθήσῃ ní tààrà; “dá ... lẹ́bi” jẹ́ èdè Yorùbá àdánidá fún pípolongo ẹ̀bi.
theological_decisions:
- issue: Ìtumọ̀ ilé-ẹjọ́ ti δικαιόω ní ìbáṣepọ̀ pẹ̀lú ọ̀rọ̀ ẹni àti ìdájọ́
  choice: “a ó fi dá ọ láre,” ní èrò pípolongo ẹni ní ẹ̀tọ́ tàbí àìjẹ̀bi
  alternative: “a ó fi fìdí rẹ̀ múlẹ̀ pé o wà ní ẹ̀tọ́” tàbí “a ó dá ọ sílẹ̀ pé o kò jẹ̀bi”
  rationale: Ìfarawe rẹ̀ pẹ̀lú “dá ọ lẹ́bi” mú àyíká ilé-ẹjọ́ hàn gbangba. Ìtumọ̀ yìí pa ìforígbárí ọ̀rọ̀ Gíríìkì mọ́, kò sì sọ ju ohun tí ẹsẹ náà sọ lọ nípa ipa ọ̀rọ̀ ẹni gẹ́gẹ́ bí ẹ̀rí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. Àtúnsọ “nípa ọ̀rọ̀ rẹ” pa ìbáramu àti ìtẹnumọ́ inú Gíríìkì mọ́; àkójọpọ̀ “a ó fi dá...” jẹ́ àdánidá, ó sì fi ìṣe aláìlórúkọ ti ọ̀rọ̀ Gíríìkì hàn.
