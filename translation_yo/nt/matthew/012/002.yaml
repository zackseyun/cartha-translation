  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “Ṣùgbọ́n” ṣàfihàn δὲ ní ìfaradà tó yẹ; “nígbà tí ... rí i” tú participle ἰδόντες sí ọ̀nà Yorùbá tí ó rọrùn; “Wò ó” gbé agbára Ἰδοὺ kalẹ̀; a sì pa àtúnlò “ń ṣe ... láti ṣe” fún ποιοῦσιν ... ποιεῖν mọ́. “Kò bófin mu” jẹ́ ìtumọ̀ tó bójú mu fún ὃ οὐκ ἔξεστιν, láìṣe ìpinnu nípa irú òfin tí ẹ̀sùn náà tọ́ka sí.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìpele-gíga tó dáa, tó sì ń lò ìforúkọsílẹ̀ Bíbélì tí ó mọ̀ wọ́pọ̀. “Àwọn ọmọ-ẹ̀yìn rẹ,” “sọ fún un pé,” àti “ní ọjọ́ Ìsinmi” jẹ́ àṣàyàn tí ó hàn gbangba, tí ó sì bá ìforúkọsílẹ̀ ẹsẹ̀ náà mu. Àmì ohùn ni a fi sí ibi tí ó yẹ.
