id: MAT.12.2
reference: Matthew 12:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn Farisí rí i, wọ́n sọ fún un pé, “Wò ó, àwọn ọmọ-ẹ̀yìn rẹ ń ṣe ohun tí kò bófin mu láti ṣe ní ọjọ́ Ìsinmi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a kò gbà láàyè láti ṣe ní ọjọ́ Ìsinmi.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ὃ οὐκ ἔξεστιν, tó tẹnu mọ́ ohun tí a kò fàyè gbà dípò èdè òfin.
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ìṣẹ̀lẹ̀ tó ṣáájú hàn ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: ἰδόντες
  choice: nígbà tí ... rí i
  rationale: A tú participle aorist náà sí gbólóhùn àsìkò; “rí i” tọ́ka sí ohun tí àwọn ọmọ-ẹ̀yìn ń ṣe, bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: εἶπαν αὐτῷ
  choice: wọ́n sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣàìṣàfikún fún gbólóhùn ìsọ̀rọ̀ yìí.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ ìtọ́ka àti ẹ̀sùn náà mọ́ ní èdè Yorùbá òde òní.
- source_word: μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ọ̀rọ̀ yìí pa ìbáṣepọ̀ olùkọ́ àti àwọn tó ń kọ́ lẹ́yìn rẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Bíbélì tí a mọ̀ dáadáa.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: ń ṣe ... láti ṣe
  rationale: A pa àtúnlò ọ̀rọ̀ ποιέω mọ́ láìsọ ọ̀rọ̀ náà di àjùmọ̀sọ tí kò sí nínú Gíríìkì.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ohun tí kò bófin mu
  rationale: Ó sọ àìní ìyọ̀ǹda ní ìforúkọsílẹ̀ òfin-ẹ̀sìn, ṣùgbọ́n kò pinnu bóyá òfin Ìwé Mímọ́ tàbí àṣà ìtumọ̀ òfin àwọn Farisí ni wọ́n ń tọ́ka sí.
- source_word: ἐν σαββάτῳ
  choice: ní ọjọ́ Ìsinmi
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún ọjọ́ Sábáàtì gẹ́gẹ́ bí ọjọ́ ìsinmi tí a ń pa mọ́.
theological_decisions:
- issue: Irú ẹ̀sùn tí àwọn Farisí fi kàn wọ́n
  choice: A tú ἔξεστιν sí “kò bófin mu,” èyí tó ní ìtumọ̀ òfin àti ìyọ̀ǹda.
  alternative: “a kò gbà láàyè”
  rationale: Ẹsẹ̀ náà sọ ẹ̀sùn wọn, ṣùgbọ́n kò dájọ́ pé ẹ̀sùn náà tọ́ tàbí sọ pàtó ibi tí òfin tí wọ́n ní lọ́kàn ti wá. Ìtumọ̀ yìí pa àìdánilójú àti ìforígbárí inú ìtàn náà mọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo “ọjọ́ Ìsinmi” fún Sábáàtì, a sì fi àmì ohùn sí ibi tí ó yẹ. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí àṣàyàn ọ̀rọ̀ náà kan.
