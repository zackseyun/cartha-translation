revisions:
- from: Àwọn ọkùnrin Nínéfè yóò dìde ní ọjọ́ ìdájọ́ pẹ̀lú ìran yìí, wọn yóò sì dá a lẹ́bi, nítorí wọ́n ronú pìwà dà nígbà tí Jónà wàásù[a]. Sì kíyèsí i, ohun tí ó tóbi ju Jónà lọ wà níhìn-ín[b].
  to: Àwọn ọkùnrin Nínéfè yóò dìde ní ọjọ́ ìdájọ́ pẹ̀lú ìran yìí, wọn yóò sì dá a lẹ́bi, nítorí wọ́n ronúpìwàdà nígbà ìwàásù Jónà[a]. Sì kíyèsí i, ohun tí ó tóbi ju Jónà lọ wà níhìn-ín[b].
  rationale: The revision regularizes the Yoruba repentance idiom, makes the relationship to Jonah’s preaching more natural, and refines the footnote so that it explains the Greek neuter without narrowing its referent or adding an interpretive claim not expressed in the source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:34Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the masculine ‘men of Nineveh,’ their future rising in the judgment with this generation, condemnation, repentance in connection with Jonah’s proclamation, and the neuter comparative expression, ‘something greater than Jonah.’ The temporal wording ‘nígbà tí Jónà wàásù’ is somewhat less precise than the Greek response-to-proclamation construction, but does not substantially alter the sense.
  naturalness: ‘Wọ́n ronú pìwà dà’ is understandable, but the established, natural Standard Yoruba verb is ‘wọ́n ronúpìwàdà.’ ‘Nígbà ìwàásù Jónà’ is also smoother and more compact than ‘nígbà tí Jónà wàásù’ while retaining the intended sense.
  terminology: ‘Ìdájọ́,’ ‘dá ... lẹ́bi,’ ‘ronúpìwàdà,’ and ‘ìwàásù’ are suitable formal biblical terms. The wording ‘ohun tí ó tóbi ju Jónà lọ’ appropriately preserves the Greek neuter without forcing a personal masculine referent. The explanatory footnote should avoid introducing ‘òtítọ́’ (‘truth’), which is not specified by the Greek.
  issues:
  - severity: medium
    issue: The repentance verb is written as ‘ronú pìwà dà.’
    rationale: The conventional and idiomatic Standard Yoruba form for μετανοέω in this context is the unified verb ‘ronúpìwàdà.’
  - severity: low
    issue: The first footnote repeats the non-idiomatic repentance expression and the main text uses a finite temporal clause for Jonah’s preaching.
    rationale: Updating both to ‘ronúpìwàdà’ and using ‘nígbà ìwàásù Jónà’ provides natural Yoruba while retaining the Greek’s connection between repentance and Jonah’s proclamation.
  - severity: low
    issue: Footnote b says the neuter may emphasize ‘òtítọ́’ (‘truth’) present in Jesus.
    rationale: πλεῖον is deliberately broad; ‘òtítọ́’ narrows the possible referent. A neutral description of a greater reality or thing present here better preserves the expression’s ambiguity.
  revised_text: Àwọn ọkùnrin Nínéfè yóò dìde ní ọjọ́ ìdájọ́ pẹ̀lú ìran yìí, wọn yóò sì dá a lẹ́bi, nítorí wọ́n ronúpìwàdà nígbà ìwàásù Jónà[a]. Sì kíyèsí i, ohun tí ó tóbi ju Jónà lọ wà níhìn-ín[b].
  revised_footnotes:
  - marker: a
    text: Tàbí, “nítorí wọ́n ronúpìwàdà ní ìdáhùn sí ìkéde Jónà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí ó tóbi ju Jónà lọ wà níhìn-ín.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀rọ̀ neuter; ní tààrà, “ohun tí ó tóbi ju Jónà lọ.” Èyí lè tẹnu mọ́ ohun gíga jù Jónà lọ tí ó wà níhìn-ín, kì í ṣe fífi ènìyàn méjì wéra nìkan.
    reason: alternative_reading
  revision_rationale: The revision regularizes the Yoruba repentance idiom, makes the relationship to Jonah’s preaching more natural, and refines the footnote so that it explains the Greek neuter without narrowing its referent or adding an interpretive claim not expressed in the source.
