id: MAT.12.41
reference: Matthew 12:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: yo
  text: Àwọn ọkùnrin Nínéfè yóò dìde ní ọjọ́ ìdájọ́ pẹ̀lú ìran yìí, wọn yóò sì dá a lẹ́bi, nítorí wọ́n ronúpìwàdà nígbà ìwàásù Jónà[a]. Sì kíyèsí i, ohun tí ó tóbi ju Jónà lọ wà níhìn-ín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí wọ́n ronúpìwàdà ní ìdáhùn sí ìkéde Jónà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí ó tóbi ju Jónà lọ wà níhìn-ín.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀rọ̀ neuter; ní tààrà, “ohun tí ó tóbi ju Jónà lọ.” Èyí lè tẹnu mọ́ ohun gíga jù Jónà lọ tí ó wà níhìn-ín, kì í ṣe fífi ènìyàn méjì wéra nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Àwọn ọkùnrin Nínéfè
  rationale: Ó pa akọ tó ṣe kedere nínú ἄνδρες mọ́, ó sì sọ ìbátan wọn sí Nínéfè ní Yorùbá àdánidá.
- source_word: ἀναστήσονται
  choice: yóò dìde
  rationale: “Dìde” pa àwòrán jíjí dìde mọ́, ó sì lè ní ìtumọ̀ àjíǹde nínú ọ̀rọ̀ ìdájọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐν τῇ κρίσει
  choice: ní ọjọ́ ìdájọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí ìṣẹ̀lẹ̀ ìdájọ́ ọjọ́ iwájú.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: pẹ̀lú ìran yìí
  rationale: Ó tú μετά pẹ̀lú genitive ní tààrà gẹ́gẹ́ bí “pẹ̀lú,” kò sì fi ìtumọ̀ “lòdì sí” kún un ṣáájú ọ̀rọ̀ ìdálẹ́bi tó tẹ̀ lé.
- source_word: κατακρινοῦσιν αὐτήν
  choice: wọn yóò sì dá a lẹ́bi
  rationale: “Dá ... lẹ́bi” jẹ́ ìtumọ̀ Yorùbá àdánidá fún κατακρίνω; “a” ń tọ́ka padà sí ìran yìí.
- source_word: μετενόησαν
  choice: wọ́n ronú pìwà dà
  rationale: Gbólóhùn yìí sọ ìrònúpìwàdà ní kedere, kì í sì í dín un kù sí yíyí èrò lasán.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: nígbà tí Jónà wàásù
  rationale: Ó jẹ́ Yorùbá àdánidá tó so ìrònúpìwàdà wọn mọ́ ìwàásù Jónà; àlàyé ìsàlẹ̀ fi ìtumọ̀ ìdáhùn sí ìkéde náà hàn.
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó fa àfiyèsí olùgbọ́ ní ọ̀nà ọ̀wọ̀ àti ọ̀rọ̀ Yorùbá òde òní, bí ἰδού ṣe ń ṣe.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ohun tí ó tóbi ju Jónà lọ wà níhìn-ín
  rationale: “Ohun” pa ìrísí neuter πλεῖον àti ìmọ̀lára ohun gíga tó wà níbẹ̀ mọ́, láìyí i sí “ẹni” ní pàtó.
theological_decisions:
- issue: Bí a ṣe máa tú πλεῖον Ἰωνᾶ tó ń tọ́ka sí Jésù
  choice: ohun tí ó tóbi ju Jónà lọ wà níhìn-ín
  alternative: ẹni tí ó tóbi ju Jónà lọ wà níhìn-ín
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ neuter, nítorí náà “ohun” pa àìṣedéédé rẹ̀ mọ́, ó sì lè tọ́ka sí òtítọ́ tó tóbi jù lọ tó wà nínú Jésù àti iṣẹ́ rẹ̀, láìkọjá ohun tí ọ̀rọ̀ náà sọ.
- issue: Akọ nínú ἄνδρες
  choice: àwọn ọkùnrin
  alternative: àwọn ará Nínéfè
  rationale: ἄνδρες jẹ́ akọ ní pàtó; “àwọn ọkùnrin” pa ìyẹn mọ́ dípò lílo ọ̀rọ̀ gbogbogbò.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “wàásù” fún ìrọ̀rùn òye, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ “ìkéde” mọ́.
