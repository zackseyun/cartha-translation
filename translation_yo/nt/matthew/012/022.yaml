  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tọ́pa ìtòlẹ́sẹẹsẹ àti àwọn èrò pàtàkì nínú Gíríìkì dáadáa: a mú ọkùnrin náà wá, ó jẹ́ afọ́jú, κωφός sì ń tọ́ka níhìn-ín sí àìlè sọ̀rọ̀, Jesu sì mú un láradá tí ó fi sọ̀rọ̀, ó sì rí. Síbẹ̀, “ọkùnrin náà” nínú gbólóhùn àbájáde kò tún gbé ìtọ́kasí κωφός náà jáde bí ọ̀rọ̀ Gíríìkì ṣe tún un ṣe; àtúnṣe kékeré náà ń mú ìbámu náà hàn kedere.'
  naturalness: Èdè náà jẹ́ Yorùbá òde òní tó yege, pẹ̀lú àmì ohùn tó pé. A tún ìparí gbólóhùn ṣe sí “ó sì lè rí,” èyí tó jẹ́ ọ̀nà tí ó wọ́pọ̀, tó sì rọrùn ju “ó sì ríran” lọ nínú àyíká yìí.
  terminology: “Ẹ̀mí èṣù ń dá lóró” pa ìtọ́kasí kedere sí ìpọ́njú ẹ̀mí èṣù mọ́, láì yí i sí ìṣègùn tàbí láì sọ ìlànà pàtó nípa bí ìpọ́njú náà ṣe rí. “Tí kò lè sọ̀rọ̀” jẹ́ àṣàyàn tó yẹ fún κωφός nípasẹ̀ àbájáde ìtàn náà. Àlàyé ẹsẹ̀ ìsàlẹ̀ náà ń pa ìtumọ̀ mìíràn, “tí kò gbọ́,” mọ́ ní ibi tí a fi àmì [a] sí.
  issues:
  - severity: low
    issue: Àtún-ìtọ́kasí κωφός nínú gbólóhùn àbájáde kò hàn nínú “ọkùnrin náà.”
    rationale: Gíríìkì tún lo τὸν κωφόν (‘ẹni tí kò lè sọ̀rọ̀ náà’ ní àyíká yìí). Fífi àpèjúwe náà padà sínú Yorùbá ń dá ìbámu ọ̀rọ̀ náà sílẹ̀, ó sì mú kí ìdí tí ó fi sọ̀rọ̀ hàn gbangba.
  - severity: low
    issue: “Tí ó sì ríran” kì í jẹ́ ọ̀nà tó rọrùn jù lọ fún àbájáde ìwòsàn nínú gbólóhùn yìí.
    rationale: “Ó sì lè rí” jẹ́ èdè Yorùbá tó ṣe kedere fún ìmúpadàbọ̀ agbára ìríran, ó sì bá abajade λαλεῖν καὶ βλέπειν mu.
