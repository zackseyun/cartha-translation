id: MAT.12.22
reference: Matthew 12:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: yo
  text: Nígbà náà ni wọ́n mú ọkùnrin kan tí ẹ̀mí èṣù ń dá lóró, tí ó fọ́jú, tí kò sì lè sọ̀rọ̀,[a] wá sọ́dọ̀ rẹ̀. Ó sì mú un láradá, tó bẹ́ẹ̀ tí ẹni tí kò lè sọ̀rọ̀ náà fi sọ̀rọ̀, tí ó sì lè rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí kò gbọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹni tí kò gbọ́ tàbí ẹni tí kò lè sọ̀rọ̀; níhìn-ín, àyíká ọ̀rọ̀ ń ṣe àtìlẹ́yìn fún “tí kò lè sọ̀rọ̀,” nítorí àbájáde ìmúláradá ni pé ó sọ̀rọ̀, ó sì ríran.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àmì àkókò tó ń so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì bá Yorùbá àdánidá mu.
- source_word: προσηνέχθη αὐτῷ
  choice: wọ́n mú ... wá sọ́dọ̀ rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ìṣe àgbàwí, ẹni tó ṣe iṣẹ́ náà kò hàn; ìtumọ̀ Yorùbá aláìsọ ẹni pàtó yìí jẹ́ àdánidá, kò sì fi ẹni tuntun kún ọ̀rọ̀ náà.
- source_word: δαιμονιζόμενος
  choice: tí ẹ̀mí èṣù ń dá lóró
  rationale: Ó pa ìtọ́kasí sí agbára ẹ̀mí èṣù mọ́ ní kedere, ní èdè Yorùbá tó ṣeé lóye, láì sọ ọ́ di àìsàn ìṣègùn tàbí láì pinnu ìwọ̀n ìṣàkóso ẹ̀mí náà ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: τυφλὸς
  choice: tí ó fọ́jú
  rationale: Ìbáramu tààrà fún àìríran.
- source_word: κωφός
  choice: tí kò sì lè sọ̀rọ̀
  rationale: κωφός lè túmọ̀ sí adití tàbí ẹni tí kò lè sọ̀rọ̀; gbólóhùn àbájáde tó mẹ́nu kan sísọ̀rọ̀ àti ríran ń tọ́ka sí àìlera ọ̀rọ̀ níhìn-ín.
- source_word: ἐθεράπευσεν αὐτόν
  choice: Ó sì mú un láradá
  rationale: Ìtumọ̀ Yorùbá àdánidá fún ìwòsàn nínú ìtàn iṣẹ́ ìyanu, pẹ̀lú arọ́pò-orúkọ ẹni náà.
- source_word: ὥστε
  choice: tó bẹ́ẹ̀ tí ... fi
  rationale: Ó fi àbájáde ìmúláradá hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: ọkùnrin náà fi lè sọ̀rọ̀, tí ó sì ríran
  rationale: Ó sọ àbájáde méjèèjì ní kedere, ó sì yẹra fún àtúnṣe àpèjúwe gígùn tí kò pọndandan.
theological_decisions:
- issue: Irú èdè tí a lò fún ìpọ́njú ẹ̀mí èṣù
  choice: 'Pa ìtọ́kasí kedere sí ẹ̀mí èṣù mọ́: “tí ẹ̀mí èṣù ń dá lóró”'
  alternative: “tí èṣù wọ̀” tàbí yí i padà sí àìsàn ọpọlọ
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìbáṣepọ̀ pẹ̀lú ẹ̀mí èṣù ní kedere. Àṣàyàn yìí kò pa apá ẹ̀mí rẹ́, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ pàtó nípa bí èṣù ṣe ń gbé inú ẹni kún un.
- issue: Ìtumọ̀ κωφός ní àyíká ọ̀rọ̀ yìí
  choice: Ẹni tí kò lè sọ̀rọ̀
  alternative: Adití, tàbí adití tí kò sì lè sọ̀rọ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ méjì tó ṣeé ṣe, ṣùgbọ́n àbájáde náà sọ pé ó sọ̀rọ̀, kò sọ pé ó gbọ́; nítorí náà, àìlè sọ̀rọ̀ ni àyíká ọ̀rọ̀ ń ṣe àtìlẹ́yìn fún.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀mí èṣù ń dá lóró” dípò ọ̀rọ̀ tó lè gbé ẹ̀kọ́ ẹ̀sìn kan wọlé nípa ìwọ̀n ìṣàkóso ẹ̀mí náà.
