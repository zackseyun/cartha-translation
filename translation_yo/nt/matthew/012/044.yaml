  verdict: revise
  source_fidelity: 'The draft accurately retains the sequence, the spirit''s possessive expression “ilé mi,” the house metaphor, and the three predicates: vacant, swept, and put in order. However, “níbi tí mo ti jáde” is less exact than an expression that explicitly says the spirit came out of the house, and “a ti gbá a mọ́” is not the clearest standard-Yorùbá rendering of the swept condition.'
  naturalness: The register is generally clear and modern. Revising the relative clause to “tí mo ti jáde kúrò nínú rẹ̀” removes a slight ambiguity, while “a ti gbá a tán” gives a more idiomatic completed sweeping action.
  terminology: “ilé,” “ṣófo,” and “ṣe é létòletò” are suitable and preserve the metaphor without interpretive expansion. The alternatives in the footnotes are appropriate once their wording is aligned cleanly with the revised text.
  issues:
  - severity: medium
    issue: The phrase “níbi tí mo ti jáde” does not explicitly express departure from the house.
    rationale: 'ὅθεν ἐξῆλθον refers back to “my house”: the spirit says it came out from it. “tí mo ti jáde kúrò nínú rẹ̀” preserves that referential relationship more clearly in Yorùbá.'
  - severity: low
    issue: “a ti gbá a mọ́” is potentially unclear or non-idiomatic for a house that has been swept.
    rationale: “a ti gbá a tán” naturally marks the completed sweeping conveyed by the perfect passive participle σεσαρωμένον, without adding a distinct action.
  - severity: low
    issue: Footnote b unnecessarily retains the conjunction “a sì ti” within an alternative phrase.
    rationale: A lexical alternative should directly replace the anchored predicate; “ṣe é lọ́ṣọ̀ọ́” is cleaner and more readily usable.
