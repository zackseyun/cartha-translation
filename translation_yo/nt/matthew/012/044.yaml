id: MAT.12.44
reference: Matthew 12:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: yo
  text: Nígbà náà, ó sọ pé, “Èmi yóò padà sí ilé mi, tí mo ti jáde kúrò nínú rẹ̀.” Nígbà tí ó sì dé, ó rí i pé ilé náà ṣófo[a], a ti gbá a tán, a sì ti ṣe é létòletò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò sí ẹni tó ń gbé inú rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ṣe é lọ́ṣọ̀ọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει
  choice: Nígbà náà, ó sọ pé
  rationale: “Nígbà náà” fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn. “Ó sọ pé” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ọ̀rọ̀ ẹ̀mí àìmọ́ náà, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí fún ìtàn aláàyè.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Èmi yóò padà sí ilé mi
  rationale: Ó pa ìtumọ̀ ìpadà àti ẹ̀tọ́ tí ẹ̀mí náà ń pè ní “ilé mi” mọ́; fífi “Èmi” síbẹ̀ tún mú ìpinnu rẹ̀ lágbára ní Yorùbá.
- source_word: ὅθεν ἐξῆλθον
  choice: níbi tí mo ti jáde
  rationale: Ó pa àwòrán jíjáde kúrò nínú ilé mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédéé.
- source_word: ἐλθὸν εὑρίσκει
  choice: Nígbà tí ó sì dé, ó rí i
  rationale: A tú participle aorist náà sí gbólóhùn àsìkò tó jẹ́ àdánidá ní Yorùbá, tí ó sì pa bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: σχολάζοντα
  choice: ṣófo
  rationale: Nínú àkópọ̀ ọ̀rọ̀ ilé, “ṣófo” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì lè túmọ̀ sí pé kò sí olùgbé nínú rẹ̀. Àlàyé ìsàlẹ̀ fi ìtumọ̀ “kò sí ẹni tó ń gbé inú rẹ̀” hàn.
- source_word: σεσαρωμένον
  choice: a ti gbá a mọ́
  rationale: Ó fi ipò tí ó ti wáyé lẹ́yìn gbígbá ilé náà hàn, ó sì mú èrò pé a ti gbá a di mímọ́ jáde ní Yorùbá.
- source_word: κεκοσμημένον
  choice: a sì ti ṣe é létòletò
  rationale: κοσμέω lè túmọ̀ sí títò nǹkan létòletò tàbí ṣíṣe é lọ́ṣọ̀ọ́. Ọ̀rọ̀ àkọ́kọ́ yìí kò fi ohun ọ̀ṣọ́ kún àwòrán náà láìdandan; àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ “ilé” gẹ́gẹ́ bí ibi tí ẹ̀mí àìmọ́ ń padà sí
  choice: A pa “ilé” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ inú ẹsẹ náà, láìrọ́pò rẹ̀ pẹ̀lú “ẹni” tàbí “ìgbésí ayé.”
  alternative: Èmi yóò padà sọ́dọ̀ ẹni tí mo jáde kúrò lára rẹ̀.
  rationale: Orísun Gíríìkì lo àwòrán ilé. Pípa àwòrán náà mọ́ kò jẹ́ kí ìtumọ̀ àlàyé kan di ohun tí ẹsẹ náà sọ ní tààràtà.
- issue: Bóyá σχολάζοντα túmọ̀ sí “ṣófo” tàbí “kò sí olùgbé”
  choice: A lo “ṣófo” nínú ọ̀rọ̀ àkọ́kọ́, a sì fi “kò sí ẹni tó ń gbé inú rẹ̀” sínú àlàyé ìsàlẹ̀.
  alternative: kò sí ẹni tó ń gbé inú rẹ̀
  rationale: Àwọn ìtumọ̀ méjèèjì bá ọ̀rọ̀ orísun mu. Yíyan “ṣófo” pa kúkúrú àti àwòrán ilé mọ́, nígbà tí àlàyé ìsàlẹ̀ kò jẹ́ kí èrò àìní olùgbé sọnù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lásán. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé gan-an.
