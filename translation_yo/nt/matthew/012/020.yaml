revisions:
- from: Kì yóò ṣẹ́ ọ̀pá esùsú tí ó ti bàjẹ́, bẹ́ẹ̀ ni kì yóò pa òwú fìtílà tí ń rú èéfín[a], títí yóò fi mú kí ìdájọ́ òdodo ṣẹ́gun.[b]
  to: Kì yóò ṣẹ́ ọ̀pá esùsú tí a ti fọ́, bẹ́ẹ̀ ni kì yóò pa iná okùn iná fìtílà tí ń rú èéfín[a], títí tí yóò fi mú kí ìdájọ́ òdodo ṣẹ́gun.[b]
  rationale: The revision sharpens the damaged-reed image to match the Greek participle, identifies the smoking material as a lamp wick in natural Yoruba, and makes the extinguishing action idiomatic. It retains the draft’s rendering of κρίσις as ‘ìdájọ́ òdodo’ while preserving ‘ìdájọ́’ as an alternative, thereby maintaining the source term’s interpretive range.
