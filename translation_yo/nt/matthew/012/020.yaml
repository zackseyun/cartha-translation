id: MAT.12.20
reference: Matthew 12:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: yo
  text: Kì yóò ṣẹ́ ọ̀pá esùsú tí a ti fọ́, bẹ́ẹ̀ ni kì yóò pa iná okùn iná fìtílà tí ń rú èéfín[a], títí tí yóò fi mú kí ìdájọ́ òdodo ṣẹ́gun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òwú línì (flax) tí ń rú èéfín ni kì yóò paná.” Ní tààràtà, ọ̀rọ̀ Gíríìkì náà tọ́ka sí òwú línì tí a fi ṣe okùn iná fìtílà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “títí tí yóò fi mú ìdájọ́ dé ibi ìṣẹ́gun.”
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: ọ̀pá esùsú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí esùsú tàbí ọ̀pá rẹ̀; ‘ọ̀pá esùsú’ mú àwòrán àsọtẹ́lẹ̀ náà ṣe kedere ní Yorùbá.
- source_word: συντετριμμένον
  choice: tí ó ti bàjẹ́
  rationale: Ó ṣàpèjúwe ohun tí a ti pa lára tàbí tí ó ti fọ́ díẹ̀, ṣùgbọ́n tí kò tíì ṣẹ́ pátápátá. ‘Tí ó ti bàjẹ́’ pa ìyàtọ̀ yìí mọ́ láì sọ pé ó ti ṣẹ́ tán.
- source_word: κατεάξει
  choice: kì yóò ṣẹ́
  rationale: ‘Ṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ohun bí ọ̀pá fọ́ tàbí já.
- source_word: λίνον
  choice: òwú fìtílà
  rationale: Ní àwòrán yìí, λίνον ni òwú ọ̀gbọ̀ tí a fi ṣe okùn iná inú fìtílà; ‘òwú fìtílà’ jẹ́ kó yé òǹkàwé òde òní lẹ́sẹ̀kẹsẹ̀.
- source_word: τυφόμενον
  choice: tí ń rú èéfín
  rationale: Ó ń ṣàpèjúwe òwú fìtílà tí iná rẹ̀ ti fẹ́ kú, tí ó sì ń rú èéfín.
- source_word: σβέσει
  choice: kì yóò pa
  rationale: Nípa iná, ‘pa’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún pípa iná fìtílà.
- source_word: ἕως ἂν
  choice: títí yóò fi
  rationale: Ìtumọ̀ yìí fi àkókò ọjọ́ iwájú tí gbólóhùn náà ń lọ sí hàn ní Yorùbá àdánidá.
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: mú kí ... ṣẹ́gun
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ń tọ́ka sí mímú ohun dé àbájáde ìṣẹ́gun; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìtumọ̀ ìṣẹ́gun mọ́.
- source_word: τὴν κρίσιν
  choice: ìdájọ́ òdodo
  rationale: κρίσις lè túmọ̀ sí ìdájọ́ tàbí ìmúdásílẹ̀ òdodo. Nínú ọ̀rọ̀ Ìránṣẹ́ Aísáyà yìí, ‘ìdájọ́ òdodo’ sọ ìtumọ̀ tó gbòòrò náà di mímọ̀ láì sọ ọ́ di ìdájọ́ ẹ̀bi nìkan.
theological_decisions:
- issue: Ìtumọ̀ κρίσις nínú àyọlò nípa Ìránṣẹ́ Aísáyà
  choice: ìdájọ́ òdodo
  alternative: ìdájọ́
  rationale: Àyíká ọ̀rọ̀ náà kan bí Ìránṣẹ́ ṣe ń mú ètò Ọlọ́run tó tọ́ ṣẹ, kì í ṣe pípèdájọ́ ẹ̀bi nìkan. Àfikún ‘òdodo’ mú ìtumọ̀ yìí hàn, nígbà tí àlàyé ìsàlẹ̀ pa ‘ìdájọ́’ mọ́ gẹ́gẹ́ bí ìtumọ̀ tó ṣeé ṣe.
- issue: Bí a ṣe tú àwòrán λίνον inú fìtílà
  choice: òwú fìtílà ... pa
  alternative: òwú ọ̀gbọ̀ ... paná rẹ̀
  rationale: Gíríìkì ń tọ́ka sí òwú ọ̀gbọ̀ tí a lò gẹ́gẹ́ bí okùn iná inú fìtílà. Ọ̀rọ̀ inú ẹsẹ̀ mú ohun tí a ń tọ́ka sí yé òǹkàwé òde òní, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ ohun èlò náà mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti ti òde òní. Gbólóhùn náà pa àwòrán ewì àti ìrẹ̀lẹ̀ Ìránṣẹ́ mọ́, ṣùgbọ́n ó lo ‘òwú fìtílà’ àti ‘mú kí ... ṣẹ́gun’ láti jẹ́ kí ìtumọ̀ ṣe kedere fún òǹkàwé Yorùbá lónìí.
