review_pass:
  verdict: revise
  source_fidelity: The draft preserves the twofold negation and the final telic clause well, and it appropriately renders εἰς νῖκος as a victorious outcome. However, ‘tí ó ti bàjẹ́’ is too broad (‘spoiled/damaged’) for συντετριμμένον, which specifically depicts something crushed or broken. ‘Òwú fìtílà’ is intelligible but less precise and natural than ‘okùn iná fìtílà’ for the lamp wick meant by λίνον in this context.
  naturalness: 'The revised wording uses idiomatic Yoruba collocations: a reed may be ‘tí a ti fọ́,’ while a lamp’s wick is naturally identified as ‘okùn iná fìtílà’ and its flame is ‘pa iná.’ The poetic parallelism and restrained register are retained.'
  terminology: ‘Ìdájọ́ òdodo’ is a defensible contextual rendering of κρίσις as justice, without eliminating the legitimate alternative ‘ìdájọ́’ in the footnote. The footnote’s lexical alternative is revised so that it actually identifies flax/linen and does not use the unclear expression ‘òwú ọ̀gbọ̀.’
  issues:
  - severity: medium
    issue: ‘tí ó ti bàjẹ́’ for συντετριμμένον
    rationale: Bàjẹ́ commonly means spoiled, ruined, or generally damaged. The Greek image is specifically of a reed that has been crushed/broken.
  - severity: medium
    issue: ‘òwú fìtílà’ and ‘pa òwú fìtílà’
    rationale: The referent is a lamp wick, not merely cotton associated with a lamp. ‘Okùn iná fìtílà’ and ‘pa iná’ are clearer, more idiomatic Yoruba expressions.
  - severity: low
    issue: Lexical-alternative footnote uses ‘òwú ọ̀gbọ̀’
    rationale: This does not clearly communicate flax/linen in contemporary Standard Yoruba. A parenthetical identification of flax/linen is more transparent and auditable.
  revised_text: Kì yóò ṣẹ́ ọ̀pá esùsú tí a ti fọ́, bẹ́ẹ̀ ni kì yóò pa iná okùn iná fìtílà tí ń rú èéfín[a], títí tí yóò fi mú kí ìdájọ́ òdodo ṣẹ́gun.[b]
  revised_footnotes:
  - marker: a
    text: Tàbí, “òwú línì (flax) tí ń rú èéfín ni kì yóò paná.” Ní tààràtà, ọ̀rọ̀ Gíríìkì náà tọ́ka sí òwú línì tí a fi ṣe okùn iná fìtílà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “títí tí yóò fi mú ìdájọ́ dé ibi ìṣẹ́gun.”
    reason: alternative_reading
  revision_rationale: The revision sharpens the damaged-reed image to match the Greek participle, identifies the smoking material as a lamp wick in natural Yoruba, and makes the extinguishing action idiomatic. It retains the draft’s rendering of κρίσις as ‘ìdájọ́ òdodo’ while preserving ‘ìdájọ́’ as an alternative, thereby maintaining the source term’s interpretive range.
