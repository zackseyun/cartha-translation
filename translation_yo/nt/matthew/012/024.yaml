id: MAT.12.24
reference: Matthew 12:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn Farisí gbọ́, wọ́n sọ pé, “Ọkùnrin yìí kì í lé àwọn ẹ̀mí èṣù jáde bí kò ṣe nípasẹ̀ Beelsebulu[a], olórí àwọn ẹ̀mí èṣù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelsebulu: Fọ́ọ̀mù ìbílẹ̀ ni “Beelsebubu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora hàn sí ìhùwàsí rere àwọn ènìyàn nínú ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative δὲ ní Yorùbá.
- source_word: ἀκούσαντες
  choice: nígbà tí àwọn Farisí gbọ́
  rationale: Aorist participle náà ní agbára àkókò níbí. A kò fi ohun tí wọ́n gbọ́ kún un nítorí Yorùbá lè lo ‘gbọ́’ láìsọ ohun náà ní gbangba nígbà tí àyíká ọ̀rọ̀ ti mú un yé.
- source_word: Οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó pa ìtọ́kasí demonstrative náà mọ́, ó sì lè gbé ohùn àbùkù tàbí àfojúdi àwọn Farisí jáde láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐκβάλλει
  choice: kì í lé … jáde
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún lílé ẹ̀mí èṣù jáde; ìrísí ‘kì í’ bá present tense inú ẹ̀sùn gbogbogbò náà mu.
- source_word: δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn ẹ̀dá ẹ̀mí búburú tí δαιμόνια ń tọ́ka sí nínú àyíká ọ̀rọ̀ yìí.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Ó sọ ìyọkúrò tàbí ọ̀nà kan ṣoṣo tí àwọn Farisí fi ẹ̀sùn kàn án ní Yorùbá àdánidá.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: nípasẹ̀ Beelsebulu
  rationale: ἐν ní agbára ọ̀nà tàbí aṣojú níbí; ‘nípasẹ̀’ mú ẹ̀sùn náà yé kedere láìtúmọ̀ rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: Βεελζεβοὺλ
  choice: Beelsebulu
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú fọ́ọ̀mù Gíríìkì Beelzebul, tí a sì mú un bá ìró àti ìkọ̀wé Yorùbá mu; fọ́ọ̀mù àṣà Beelsebubu wà nínú àlàyé ìsàlẹ̀.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: olórí àwọn ẹ̀mí èṣù
  rationale: ‘Olórí’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ẹni tó ní ipò àṣẹ lórí ẹgbẹ́ kan, ó sì pa ìtumọ̀ ἄρχων mọ́.
theological_decisions:
- issue: Ohùn àfojúdi inú demonstrative Οὗτος
  choice: Ọkùnrin yìí
  alternative: Ẹni yìí; Òun
  rationale: ‘Ọkùnrin yìí’ pa ìtọ́kasí tó lágbára àti ohùn àbùkù tó ṣeé ṣe nínú ẹ̀sùn àwọn Farisí mọ́, láìfi ẹ̀kọ́ ìgbàgbọ́ míì kún ọ̀rọ̀ náà.
- issue: Fọ́ọ̀mù orúkọ Βεελζεβούλ
  choice: Beelsebulu
  alternative: Beelsebubu
  rationale: Ọ̀rọ̀ àkọ́kọ́ tẹ̀ lé fọ́ọ̀mù inú SBLGNT, Βεελζεβούλ; a pa fọ́ọ̀mù àṣà tó mọ̀ sí ọ̀pọ̀ ènìyàn mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Agbára ἐν nínú ẹ̀sùn náà
  choice: nípasẹ̀
  alternative: nínú; nípa agbára
  rationale: Nínú àyíká yìí, ἐν lè tọ́ka sí ọ̀nà tàbí aṣojú. ‘Nípasẹ̀’ pa ẹ̀sùn náà mọ́ láìsọ ní pàtó bóyá agbára, àṣẹ, tàbí ìfọwọ́sowọ́pọ̀ ni àwọn Farisí ní lọ́kàn.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn níbi tó yẹ, ni a lò. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé lasán. A gbe àmì àlàyé [a] sí orúkọ tí àlàyé náà ń ṣàlàyé.
