id: MAT.12.19
reference: Matthew 12:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: yo
  text: Kì yóò jiyàn, bẹ́ẹ̀ ni kì yóò ké jáde[a]; kò sì sí ẹni tí yóò gbọ́ ohùn rẹ̀ ní àwọn òpópónà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kì yóò ṣàríyàn tàbí kígbe, kò sì sí ẹni tí yóò gbọ́ ohùn rẹ̀ ní àwọn ibi ìtagbangba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρίσει
  choice: yóò jiyàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkó ara ẹni sínú ìjà ọ̀rọ̀ tàbí awuyewuye. “Jiyàn” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó bá àwòrán ìránṣẹ́ tí kì í ṣe oníjà mu, láì sọ pé kò lè sọ̀rọ̀ ní gbangba rárá.
- source_word: κραυγάσει
  choice: yóò ké jáde
  rationale: Ó ń tọ́ka sí kíké tàbí pígbé ohùn sókè. “Ké jáde” mú ìtumọ̀ ìkéde olóhùn gíga wá, ó sì dá ìbáramu àwọn gbólóhùn méjèèjì dúró.
- source_word: ἀκούσει τις
  choice: kò sì sí ẹni tí yóò gbọ́
  rationale: Ìkọ̀sílẹ̀ ẹni àìsọ pàtó nínú Gíríìkì ni a sọ ní Yorùbá àdánidá gẹ́gẹ́ bí “kò sí ẹni tí…,” èyí tí ó pa ìtumọ̀ “ẹnikẹ́ni kì yóò gbọ́” mọ́.
- source_word: ἐν ταῖς πλατείαις
  choice: ní àwọn òpópónà
  rationale: πλατεῖα lè jẹ́ òpópónà gbígbòòrò tàbí ibi ìtagbangba. “Àwọn òpópónà” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún àyíká gbangba, nígbà tí àlàyé ìsàlẹ̀ fi “àwọn gbàgede ìtagbangba” hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: φωνὴν αὐτοῦ
  choice: ohùn rẹ̀
  rationale: φωνή níbí túmọ̀ sí ohùn ènìyàn; “ohùn rẹ̀” ni ìtumọ̀ Yorùbá tó ṣe tààrà tó sì ṣe kedere jù.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: Kì yóò… bẹ́ẹ̀ ni kì yóò…; kò sì sí ẹni…
  rationale: Ìṣètò yìí pa agbára ìkọ̀sílẹ̀ mẹ́ta nínú Gíríìkì mọ́, ó sì ń dun bí Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ ẹsẹ yìí pẹ̀lú àsọtẹ́lẹ̀ nípa Ìránṣẹ́ inú Aísáyà àti ìwà Mèsáyà
  choice: A ṣe àpèjúwe Mèsáyà gẹ́gẹ́ bí ẹni tí kì í ṣe oníjà, tí kì í sì fi ariwo polongo ara rẹ̀ ní gbangba.
  alternative: A lè túmọ̀ ọ́ lọ́nà tó tẹ̀ lé ọ̀rọ̀ Gíríìkì gan-an pé “Kì yóò báni fà á, bẹ́ẹ̀ ni kì yóò kígbe,” láti mú ohùn àsọtẹ́lẹ̀ ìbílẹ̀ jáde.
  rationale: Gíríìkì ń ṣàpèjúwe ìwà pẹ̀lẹ́, aláìjà ti Jésù nínú ìmúṣẹ Aísáyà 42:2. Ìtumọ̀ náà kò sọ pé kò sọ̀rọ̀ ní gbangba rárá tàbí pé ó jẹ́ aláìṣe-nǹkan; ó ń tẹnu mọ́ pé kì í ṣe oníjà tàbí ẹni tí ń fi ariwo gbé ara rẹ̀ ga.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbo. “Jiyàn” àti “ké jáde” yàgò fún èdè àtijọ́, nígbà tí àlàyé ìsàlẹ̀ pa àwọn àṣàyàn ìtumọ̀ míì mọ́.
