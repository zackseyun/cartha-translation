  to: Àbí ẹ̀yin kò ha kà nínú Òfin pé ní àwọn ọjọ́ Ìsinmi, àwọn àlùfáà ní tẹ́ńpìlì ń sọ ọjọ́ Ìsinmi di ọjọ́ lásán, síbẹ̀ wọn kò jẹ̀bi?[a][b][c]
