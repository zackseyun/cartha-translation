  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtakora ìbéèrè Gíríìkì náà dáadáa: àwọn àlùfáà ń ṣe ohun kan sí ọjọ́ Ìsinmi, ṣùgbọ́n wọn kò jẹ̀bi. Síbẹ̀, “tíì” ń fi ìtumọ̀ ‘títí di àkókò yìí/yet’ kún οὐκ ἀνέγνωτε láìjẹ́ pé ọ̀rọ̀ orísun béèrè fún un. “Di aláìmọ́” sì lè tọ́ka sí àìmọ́ ìṣe-ẹ̀sìn/uncleanness dípò ìtumọ̀ βεβηλοῦσιν, ìyẹn ṣíṣe ohun mímọ́ bí ohun lásán.'
