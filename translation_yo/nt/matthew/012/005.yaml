id: MAT.12.5
reference: Matthew 12:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: yo
  text: Àbí ẹ̀yin kò ha kà nínú Òfin pé ní àwọn ọjọ́ Ìsinmi, àwọn àlùfáà ní tẹ́ńpìlì ń sọ ọjọ́ Ìsinmi di ọjọ́ lásán, síbẹ̀ wọn kò jẹ̀bi?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ń rú ọjọ́ Ìsinmi” tàbí “ń ba ọjọ́ Ìsinmi jẹ́.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ṣíṣe ohun mímọ́ bí ohun lásán, tàbí ohun tí kò ní ìjẹ́mímọ́ mọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ó jẹ́ “ní àwọn ọjọ́ Ìsinmi,” èyí tí ó ṣeé ṣe kí ó tọ́ka sí ohun tí ń ṣẹlẹ̀ léraléra, kì í ṣe ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo.
    reason: lexical_alternative
  - marker: c
    text: “Òfin” níbí ń tọ́ka sí Òfin Mósè nínú Ìwé Mímọ́, ó sì ṣeé ṣe kí ó ní àwọn ìlànà nípa iṣẹ́ àlùfáà ní ọjọ́ Ìsinmi lọ́kàn (wo Númérì 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ń fi àríyànjiyàn mìíràn láti inú Ìwé Mímọ́ kún ọ̀rọ̀ Jésù, ó sì bá ìṣàn ìbéèrè àsọyé Yorùbá mu.
- source_word: οὐκ ἀνέγνωτε
  choice: ẹ̀yin kò ha tíì kà
  rationale: Èyí jẹ́ ìbéèrè àsọyé tí ó ń tọ́ka sí ohun tí ó yẹ kí àwọn olùgbọ́ ti mọ̀ nínú Ìwé Mímọ́.
- source_word: ἐν τῷ νόμῳ
  choice: nínú Òfin
  rationale: “Òfin” níbí ń tọ́ka sí Òfin Mósè gẹ́gẹ́ bí apá kan Ìwé Mímọ́, kì í ṣe òfin lápapọ̀.
- source_word: τοῖς σάββασιν
  choice: ní àwọn ọjọ́ Ìsinmi
  rationale: Ìtumọ̀ yìí pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, ó sì fi hàn pé iṣẹ́ náà máa ń ṣẹlẹ̀ léraléra ní ọjọ́ Ìsinmi.
- source_word: οἱ ἱερεῖς
  choice: àwọn àlùfáà
  rationale: Ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn àlùfáà tẹ́ńpìlì tí ń ṣe iṣẹ́ ẹbọ.
- source_word: ἐν τῷ ἱερῷ
  choice: inú tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí àgbègbè tẹ́ńpìlì lápapọ̀; “inú tẹ́ńpìlì” jẹ́ ọ̀rọ̀ àdánidá tí ó sì ṣe kedere ní Yorùbá.
- source_word: τὸ σάββατον
  choice: ọjọ́ Ìsinmi
  rationale: Ó ń tọ́ka sí ọjọ́ tàbí ìlànà Sábáàtì tí iṣe àwọn àlùfáà kan.
- source_word: βεβηλοῦσιν
  choice: ń sọ ... di aláìmọ́
  rationale: Ó mú ìtumọ̀ pípa ohun mímọ́ dà bí ohun tí kò mọ́ tàbí ohun lásán jáde, ó sì pa agbára ìtakora ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀναίτιοί εἰσιν
  choice: wọn kò jẹ̀bi
  rationale: Ó fi àìsí ẹ̀bi lábẹ́ Òfin hàn ní kedere, ó sì dá ìtakora pẹ̀lú “sọ ... di aláìmọ́” dúró.
theological_decisions:
- issue: Bóyá kí a rọ ọ̀rọ̀ Jésù kí ó má dà bí ẹni pé àwọn àlùfáà ń ba ọjọ́ Ìsinmi jẹ́ ní tòótọ́
  choice: 'Pa ọ̀rọ̀ líle náà mọ́: “ń sọ ọjọ́ Ìsinmi di aláìmọ́,” pẹ̀lú “wọn kò jẹ̀bi.”'
  alternative: “ń rú ọjọ́ Ìsinmi, síbẹ̀ wọn jẹ́ aláìlẹ́bi” tàbí ọ̀rọ̀ tí a rọ̀ sí i nípa iṣẹ́ wọn
  rationale: 'Gíríìkì mọ̀ọ́mọ̀ fi ìtakora sílẹ̀: iṣẹ́ tẹ́ńpìlì àwọn àlùfáà lè dà bí fífi ọjọ́ Ìsinmi ṣe ohun lásán, ṣùgbọ́n wọn kò ní ẹ̀bi. A kò gbọdọ̀ yanjú ìtakora náà fún òǹkàwé.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. “Àbí ... kò ha” pa ìrísí ìbéèrè àsọyé mọ́; “síbẹ̀” mú ìtakora inú gbólóhùn náà hàn láì yanjú rẹ̀.
