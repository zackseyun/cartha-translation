id: MAT.12.13
reference: Matthew 12:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: yo
  text: Nígbà náà ni ó sọ fún ọkùnrin náà pé, “Na ọwọ́ rẹ jáde.” Ó sì na ọwọ́ rẹ̀ jáde; ọwọ́ náà sì padà sí ipò rere, ó sì le bí ọwọ́ kejì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ọwọ́ náà sì sàn.” Ọ̀rọ̀ Gíríìkì tẹnu mọ́ pé ọwọ́ náà padà sí ipò tó yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀, ó sì bá ìṣàn ìtàn Yorùbá mu.
- source_word: λέγει
  choice: ó sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo àsìkò ìsinsìnyí gẹ́gẹ́ bí ìsinsìnyí inú ìtàn, àsìkò àtijọ́ ni èdè Yorùbá máa ń lò lọ́nà àdánidá nínú irú ìtàn bẹ́ẹ̀.
- source_word: τῷ ἀνθρώπῳ
  choice: fún ọkùnrin náà
  rationale: Nínú àyíká ẹsẹ yìí, ἄνθρωπος ń tọ́ka sí ọkùnrin kan pàtó.
- source_word: Ἔκτεινόν
  choice: Na ... jáde
  rationale: Ó jẹ́ àṣẹ tààrà, èyí sì ni ọ̀nà Yorùbá tó ṣe kedere fún ìgbésẹ̀ tí a ṣàpèjúwe.
- source_word: σου τὴν χεῖρα
  choice: ọwọ́ rẹ
  rationale: χείρ túmọ̀ sí ọwọ́ ní pàtàkì nínú àyíká yìí.
- source_word: ἐξέτεινεν
  choice: Ó sì nà án jáde
  rationale: Ó tún ọ̀rọ̀ ìṣe inú àṣẹ náà ṣe, bí Gíríìkì ṣe tún un ṣe; arọ́pò-orúkọ “án” mú ohun tí ó nà jáde ṣe kedere.
- source_word: ἀπεκατεστάθη
  choice: ọwọ́ náà sì padà bọ̀ sí bó ṣe yẹ
  rationale: Ọ̀rọ̀ náà tẹnu mọ́ ìmúpadàbọ̀ sí ipò tó tọ́, kì í ṣe ìwòsàn lásán.
- source_word: ὑγιὴς
  choice: ó sì wà ní ìlera
  rationale: Ó sọ pé ọwọ́ náà le dáadáa, ó sì yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún ọ̀rọ̀ náà.
- source_word: ὡς ἡ ἄλλη
  choice: bí èkejì
  rationale: Ìrísí abo ọ̀rọ̀ Gíríìkì ń tọ́ka sí ọwọ́ kejì; Yorùbá lè fi “èkejì” sọ ọ́ lọ́nà àdánidá láìṣe àfikún tí kò pọndandan.
theological_decisions:
- issue: Irú àpèjúwe ìwòsàn náà
  choice: Ọwọ́ ọkùnrin náà padà sí ipò tó yẹ, ó sì wà ní ìlera.
  alternative: Ọwọ́ náà sàn.
  rationale: Èyí pa ìtumọ̀ ìmúpadàbọ̀ inú ἀπεκατεστάθη mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó lọ́wọ́, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yan ìtumọ̀ tó dúró láàárín títẹ̀lé ìrísí Gíríìkì àti ìṣàn Yorùbá àdánidá.
