  to: Nígbà náà ni ó sọ fún ọkùnrin náà pé, “Na ọwọ́ rẹ jáde.” Ó sì na ọwọ́ rẹ̀ jáde; ọwọ́ náà sì padà sí ipò rere, ó sì le bí ọwọ́ kejì[a].
