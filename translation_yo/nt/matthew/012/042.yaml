id: MAT.12.42
reference: Matthew 12:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: yo
  text: Ayaba Gúúsù[b] yóò dìde nígbà ìdájọ́ pẹ̀lú ìran yìí, yóò sì dá ìran náà lẹ́bi, nítorí ó wá láti òpin ilẹ̀ ayé láti gbọ́ ọgbọ́n Sólómọ́nì. Wò ó, ohun tí ó pọ̀ ju Sólómọ́nì lọ[a] wà níhìn-ín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ẹni tí ó pọ̀ ju Sólómọ́nì lọ wà níhìn-ín.’ Ọ̀rọ̀ Gíríìkì náà wà ní ìrísí neuter (‘ohun tí ó pọ̀ ju’), èyí sì lè tẹnumọ́ ìtayọ tí ó wà nínú Jésù àti iṣẹ́ rẹ̀.
    reason: alternative_reading
  - marker: b
    text: ‘Ayaba Gúúsù’ ń tọ́ka sí ayaba Ṣébà (1 Àwọn Ọba 10:1–13; 2 Kíróníkà 9:1–12), bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì kò dárúkọ Ṣébà ní tààràtà.
    reason: cross_reference
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Ayaba Gúúsù
  rationale: Ó túmọ̀ sí ‘ayaba ti Gúúsù.’ Èyí pa ọ̀rọ̀ Gíríìkì mọ́ láì fi ‘Ṣébà’ kún ẹsẹ̀ náà, bó tilẹ̀ jẹ́ pé àkọsílẹ̀ Májẹ̀mú Láéláé fi hàn pé ayaba Ṣébà ni.
- source_word: ἐγερθήσεται
  choice: yóò dìde
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘a ó jí i dìde’ tàbí ‘yóò dìde.’ ‘Yóò dìde’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ àjíǹde àti dídìde gẹ́gẹ́ bí ẹlẹ́rìí ní ìdájọ́ mọ́.
- source_word: ἐν τῇ κρίσει
  choice: nígbà ìdájọ́
  rationale: Ó tọ́ka sí ìdájọ́ pàtó tí ń bọ̀; ‘nígbà ìdájọ́’ sọ èyí ní Yorùbá tí ó ṣe kedere.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: pẹ̀lú ìran yìí
  rationale: μετά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive túmọ̀ sí ‘pẹ̀lú,’ kì í ṣe ‘lòdì sí.’ Ìtakora wá nínú gbólóhùn tó tẹ̀ lé e pé ayaba náà yóò dá ìran náà lẹ́bi.
- source_word: κατακρινεῖ αὐτήν
  choice: yóò sì dá ìran náà lẹ́bi
  rationale: κατακρίνω túmọ̀ sí ‘dá lẹ́bi.’ A tún ‘ìran náà’ sọ dípò lílo arọ́pò-orúkọ kan tí ìtọ́kasí rẹ̀ lè má ṣe kedere ní Yorùbá.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: láti òpin ilẹ̀ ayé
  rationale: Èyí jẹ́ ọ̀nà àsọyé fún ibi jíjìnnà púpọ̀; ‘òpin ilẹ̀ ayé’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ láti sọ ọ́.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: láti gbọ́ ọgbọ́n Sólómọ́nì
  rationale: 'Infinitive náà fi ète ìrìn-àjò rẹ̀ hàn: ó wá kí ó lè gbọ́ ọgbọ́n Sólómọ́nì.'
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ọ̀rọ̀ yìí pe olùgbọ́ láti fiyè sí ohun pàtàkì tí ó tẹ̀ lé e; ‘kíyèsí i’ ní agbára ọ̀wọ̀ àti ìtẹnumọ́ tó yẹ.
- source_word: πλεῖον Σολομῶνος
  choice: ohun tí ó tóbi ju Sólómọ́nì lọ
  rationale: πλεῖον jẹ́ neuter ní Gíríìkì. ‘Ohun tí ó tóbi ju’ pa ìrísí yẹn àti ààyè ìtumọ̀ rẹ̀ mọ́, dípò yíyí i lẹ́sẹ̀kẹsẹ̀ sí ‘ẹni tí ó tóbi ju.’
- source_word: ὧδε
  choice: wà níhìn-ín
  rationale: ὧδε túmọ̀ sí ‘níhìn-ín’; fífi ‘wà’ kún un mú gbólóhùn náà pé ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe yẹ kí a tú πλεῖον, ọ̀rọ̀ afiwéra neuter, ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Jésù
  choice: ohun tí ó tóbi ju Sólómọ́nì lọ
  alternative: ẹni tí ó tóbi ju Sólómọ́nì lọ
  rationale: Gíríìkì lo neuter πλεῖον, èyí tí ó lè tẹnumọ́ gbogbo òtítọ́ ńlá tí ó wà níhìn-ín nínú Jésù àti iṣẹ́ rẹ̀. ‘Ohun tí ó tóbi ju’ pa ìṣòro àti fífẹ̀ ìtumọ̀ yẹn mọ́, láì sẹ́ pé Jésù fúnra rẹ̀ ni ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘Ayaba’ àti ‘ìran’ gẹ́gẹ́ bí ọ̀rọ̀ ìwé mímọ́ tí ó wọ́pọ̀, ṣùgbọ́n a tún ‘ìran náà’ sọ láti yẹra fún arọ́pò-orúkọ aláìṣe kedere. Àwọn àmì ìró ohùn ni a fi sí ibi tí ó yẹ.
