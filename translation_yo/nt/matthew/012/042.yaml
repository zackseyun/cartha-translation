  terminology: ‘Ayaba Gúúsù,’ ‘ìdájọ́,’ ‘ìran yìí,’ àti ‘dá ... lẹ́bi’ yẹ fún ìforúkọsílẹ̀ ìwé-mímọ́. A pa ‘Ṣébà’ mọ́ nínú àlàyé nìkan, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
