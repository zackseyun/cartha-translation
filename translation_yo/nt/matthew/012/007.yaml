id: MAT.12.7
reference: Matthew 12:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: yo
  text: 'Ṣùgbọ́n ìbá ṣe pé ẹ ti mọ ohun tí ọ̀rọ̀ yìí túmọ̀ sí: “Àánú ni mo fẹ́, kì í ṣe ẹbọ,”[b] ẹ kì bá ti dá àwọn aláìlẹ́bi[a] lẹ́bi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aláìṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Jésù ń fa ọ̀rọ̀ inú Hóséà 6:6 yọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: ẹ ti mọ
  rationale: Àkójọpọ̀ ‘ti mọ’ fi ìṣe tí ó yẹ kí ó ti ṣẹlẹ̀ tẹ́lẹ̀ hàn, ó sì bá gbólóhùn àròsọ òdì ‘ìbá ṣe pé’ mu.
- source_word: τί ἐστιν
  choice: ohun tí ọ̀rọ̀ yìí túmọ̀ sí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n lóye ìtumọ̀ ẹsẹ Ìwé Mímọ́ tí a ń tọ́ka sí.
- source_word: ἔλεος
  choice: àánú
  rationale: ‘Àánú’ sọ ìyọ́nú àti ìṣe rere sí ẹni mìíràn ní kedere láì fi ìtumọ̀ ẹ̀kọ́ kan tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: θέλω
  choice: mo fẹ́
  rationale: ‘Mo fẹ́’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì yẹ fún ọ̀rọ̀ àsọtẹ́lẹ̀ láti fi ìfẹ́ Ọlọ́run hàn.
- source_word: θυσίαν
  choice: ẹbọ
  rationale: ‘Ẹbọ’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ohun tí a fi rú ẹbọ, ó sì pa ìyàtọ̀ inú àsọyé náà mọ́.
- source_word: κατεδικάσατε
  choice: ẹ kì bá ti dá ... lẹ́bi
  rationale: Àpẹẹrẹ ‘kì bá ti’ fi àbájáde ohun tí kò ṣẹlẹ̀ hàn, ‘dá ... lẹ́bi’ sì pa agbára ọ̀rọ̀ ìdájọ́ Gíríìkì mọ́.
- source_word: ἀναιτίους
  choice: àwọn aláìlẹ́bi
  rationale: ‘Àwọn aláìlẹ́bi’ bá ìtumọ̀ ọ̀ràn ìdájọ́ mu, ó sì so mọ́ gbólóhùn ‘dá ... lẹ́bi’ lọ́nà àdánidá.
theological_decisions:
- issue: Bí a ṣe máa pa ìyàtọ̀ inú ọ̀rọ̀ Hósíà 6:6 mọ́ láì sọ pé ẹbọ kò bófin mu rárá
  choice: “Àánú ni mo fẹ́, kì í ṣe ẹbọ”
  alternative: “Àánú ni mo fẹ́ ju ẹbọ lọ”
  rationale: Ìtumọ̀ àkọ́kọ́ pa bí ọ̀rọ̀ Gíríìkì ṣe mú ìyàtọ̀ náà le gan-an mọ́, láì túmọ̀ ọ́n sí àlàyé tí yóò dín agbára ọ̀rọ̀ Jésù kù tàbí yanjú ìforígbárí ẹ̀kọ́ inú rẹ̀.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, àti ti òde òní. Àpẹẹrẹ ‘ìbá ṣe pé ... kì bá ti ...’ pa ipò àròsọ òdì ti Gíríìkì mọ́, àwọn àmì ohùn sì wà níbi tí wọ́n ti yẹ.
