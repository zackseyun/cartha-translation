  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: yo
  text: Ó sì kìlọ̀ fún wọn gidigidi pé kí wọn má ṣe jẹ́ kí a mọ̀ ọ́n ní gbangba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó bá wọn wí gidigidi,” tàbí, “Ó sì pàṣẹ fún wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: Àsopọ̀ ìtàn ni καὶ; ‘sì’ ń bá ìṣàn ọ̀rọ̀ Yorùbá mu láìfi ìtumọ̀ tuntun kún un.
- source_word: ἐπετίμησεν
  choice: kìlọ̀ fún wọn gidigidi
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí bíbáni wí, kíkìlọ̀ líle, tàbí fífi àṣẹ líle fúnni. Nínú àyíká yìí, gbólóhùn tó tẹ̀ lé e fi hàn pé ìkìlọ̀ líle ni kí wọn má ṣe polongo rẹ̀; yíyan ‘kìlọ̀ ... gidigidi’ kò fi ẹ̀sùn ìwà búburú kan wọn bí ‘bá wọn wí’ ṣe lè ṣe.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Arọ́pò-orúkọ dative plural tó ń tọ́ka sí àwọn tí Jésù ń bá sọ̀rọ̀ nínú àyíká.
- source_word: ἵνα μὴ
  choice: pé kí wọn má ṣe
  rationale: ἵνα pẹ̀lú μή àti subjunctive ń sọ ohun tí ìkìlọ̀ tàbí àṣẹ náà ní nínú; èyí ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: sọ òun di mímọ̀ fún àwọn ènìyàn
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí mímú ẹni kan hàn gbangba tàbí jíjẹ́ kí a mọ̀ ọ́n. ‘Fún àwọn ènìyàn’ mú ìtumọ̀ gbangba náà yé kedere láìsọ ìdí tí Jésù fi pàṣẹ bẹ́ẹ̀.
theological_decisions:
- issue: Irú ìtọ́ni Jésù nípa pípolongo rẹ̀
  choice: Ìkìlọ̀ líle pé kí wọn má ṣe sọ ọ́ di mímọ̀ fún àwọn ènìyàn
  alternative: Bíbá àwọn tí ó ń bá sọ̀rọ̀ wí, tàbí fífi àṣẹ líle fún wọn
  rationale: Gíríìkì fi agbára ìtọ́ni náà hàn, ṣùgbọ́n kò sọ ìdí ẹ̀kọ́ ìgbàgbọ́ tí Jésù fi fẹ́ dín pípolongo rẹ̀ kù. Ìtumọ̀ náà pa ìdí yẹn mọ́ láìdájọ́ rẹ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. Àmì ohùn ni a lò níbi tí ó bá yẹ; ‘òun’ ni a yàn láti fi ìtọ́kasí αὐτόν hàn láìdà á pọ̀ mọ́ àwọn tí a ń sọ̀rọ̀ sí.
