revisions:
- from: Ó sì kìlọ̀ fún wọn gidigidi pé kí wọn má ṣe sọ òun di mímọ̀ fún àwọn ènìyàn.[a]
  to: Ó sì kìlọ̀ fún wọn gidigidi pé kí wọn má ṣe jẹ́ kí a mọ̀ ọ́n ní gbangba.[a]
  rationale: A rọ́pò ọ̀nà tí kò dájú, ‘sọ òun di mímọ̀ fún àwọn ènìyàn,’ pẹ̀lú ‘jẹ́ kí a mọ̀ ọ́n ní gbangba,’ láti fi φανερὸν αὐτὸν ποιήσωσιν hàn ní kedere àti ní ti ẹ̀dá Yorùbá. A kò fi olùgbọ́ tàbí ìdí ìtọ́ni Jésù kún ẹsẹ náà. Àkọsílẹ̀ ẹsẹ̀ fi àwọn aṣàyàn ìtumọ̀ tó ṣeé ṣe fún ἐπετίμησεν hàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:38Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ἐπετίμησεν gẹ́gẹ́ bí ìkìlọ̀ líle, ó sì tọ́ka dáadáa sí ‘wọn.’ Ṣùgbọ́n ‘sọ òun di mímọ̀ fún àwọn ènìyàn’ kò jẹ́ ọ̀nà tó dájú láti tú φανερὸν αὐτὸν ποιήσωσιν; ‘di mímọ̀’ lè yọrí sí ìmọ̀ ‘mímọ́/sísọ di mímọ́,’ ó sì fi ‘fún àwọn ènìyàn’ kún ohun tí kò wà ní Gíríìkì.
  naturalness: ‘Kí wọn má ṣe jẹ́ kí a mọ̀ ọ́n ní gbangba’ jẹ́ Yorùbá òde òní tó mọ́gbọ́n dání, ó sì mú èrò mímú un hàn sí gbogbo ènìyàn/mímú un di ẹni tí a mọ̀ ní gbangba wá láìfi olùgbọ́ tuntun kún un.
  terminology: A pa ìfarahàn ìtọ́ni líle mọ́ pẹ̀lú ‘kìlọ̀ ... gidigidi.’ ‘Mọ̀ ọ́n ní gbangba’ ní ìtumọ̀ tó yẹ fún φανερὸν ποιεῖν nínú àyíká yìí, láìkó ìdí ẹ̀kọ́ ìgbàgbọ́ kankan wọ inú ẹsẹ náà.
  issues:
  - severity: medium
    issue: ‘sọ òun di mímọ̀ fún àwọn ènìyàn’
    rationale: Ìsọ̀rọ̀ náà lè túmọ̀ sí sísọ ọ́ di mímọ́ tàbí fífi ọ̀rọ̀ rẹ̀ hàn, kì í sì ṣe ìtumọ̀ àdánidá tó ṣe kedere fún ‘mú un di ẹni tí a mọ̀ ní gbangba.’ Ó tún ṣàfikún ‘fún àwọn ènìyàn,’ nígbà tí Gíríìkì kò sọ olùgbọ́ náà ní kedere.
  revised_text: Ó sì kìlọ̀ fún wọn gidigidi pé kí wọn má ṣe jẹ́ kí a mọ̀ ọ́n ní gbangba.[a]
