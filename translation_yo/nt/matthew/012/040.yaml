id: MAT.12.40
reference: Matthew 12:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí Jónà ṣe wà nínú ikùn ẹ̀dá òkun ńlá[a] fún ọjọ́ mẹ́ta àti òru mẹ́ta[c], bẹ́ẹ̀ náà ni Ọmọ Ènìyàn yóò wà ní ọkàn ilẹ̀ ayé[b] fún ọjọ́ mẹ́ta àti òru mẹ́ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹja ńlá.” Ọ̀rọ̀ Gíríìkì náà túbọ̀ gbòòrò ju orúkọ ẹranko kan pàtó lọ; ó túmọ̀ sí ẹ̀dá ńlá inú omi tàbí òkun.
    reason: lexical_alternative
  - marker: b
    text: “Ní ọkàn ilẹ̀ ayé” lè tọ́ka sí ìsìnkú, ibojì, ìsàlẹ̀ ilẹ̀, tàbí ibùgbé àwọn òkú; a pa àkàwé Gíríìkì náà mọ́ nínú ẹsẹ.
    reason: alternative_reading
  - marker: c
    text: Àwọn kan ka “ọjọ́ mẹ́ta àti òru mẹ́ta” sí ọ̀nà àsọyé tí ó lè ní àwọn apá ọjọ́ mẹ́ta nínú; àwọn mìíràn sì gbà á gẹ́gẹ́ bí ìsọfúnni àkókò tó muna.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” fi ipa ìṣàlàyé γάρ hàn, “gẹ́gẹ́ bí” sì mú ìfiwéra ὥσπερ jáde ní Yorùbá àdánidá.
- source_word: Ἰωνᾶς
  choice: Jónà
  rationale: Orúkọ tí ó ti fìdí múlẹ̀ ní Yorùbá fún Jónà.
- source_word: ἐν τῇ κοιλίᾳ
  choice: nínú ikùn
  rationale: “Ikùn” jẹ́ ìtumọ̀ àdánidá fún κοιλία ní àyíká yìí, ó sì bá ìtọ́kasí sí ìtàn Jónà mu.
- source_word: τοῦ κήτους
  choice: ẹ̀dá òkun ńlá
  rationale: κῆτος tọ́ka sí ẹ̀dá ńlá inú omi/òkun láìfi dandan sọ irú ẹranko pàtó; ọ̀rọ̀ yìí yẹra fún fífi “ẹja” tàbí “ẹja ńlá bíi whale” kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: ọjọ́ mẹ́ta àti òru mẹ́ta
  rationale: Ìtumọ̀ tààrà tí ó pa àtúnṣọ àsọyé àkókò Gíríìkì mọ́ ní ibi méjèèjì.
- source_word: οὕτως
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó so apá kejì ìfiwéra pọ̀ mọ́ ti àkọ́kọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa oyè ìwé mímọ́ àti ìtumọ̀ ọ̀rọ̀ náà mọ́ láìsọ ọ́ di gbólóhùn ìtumọ̀.
- source_word: ἔσται
  choice: yóò wà
  rationale: Ìtumọ̀ ọjọ́ iwájú εἰμί ní tààrà, láìfi èrò “yóò dúró” tàbí ìtẹ̀síwájú tí kò hàn gbangba kún un.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: ní ọkàn ilẹ̀ ayé
  rationale: Ó pa àwòrán “ọkàn” (καρδία) mọ́, dípò yíyan ìtumọ̀ kan ṣoṣo bí ibojì, ìsàlẹ̀ ilẹ̀, tàbí ibùgbé àwọn òkú.
theological_decisions:
- issue: Ìtumọ̀ “ọkàn ilẹ̀ ayé”
  choice: A pa àwòrán ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “ní ọkàn ilẹ̀ ayé.”
  alternative: nínú ibojì; ní ìsàlẹ̀ ilẹ̀; ní ibùgbé àwọn òkú
  rationale: Gbólóhùn Gíríìkì jẹ́ àkàwé, kò sì fi dandan yan ọ̀kan nínú àwọn ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ wọ̀nyí. Ìtumọ̀ àkọ́kọ́ kò yẹ kí ó parí àríyànjiyàn náà.
- issue: Agbára ọ̀rọ̀ “ọjọ́ mẹ́ta àti òru mẹ́ta”
  choice: A pa àsọyé àkókò náà mọ́ ní tààrà.
  alternative: Ọ̀nà àsọyé Semitic tí ó lè ka apá ọjọ́ mẹ́ta sí ọjọ́ mẹ́ta; àkókò wákàtí méjìléláàádọ́rin gbáko
  rationale: Ẹsẹ náà sọ “ọjọ́ mẹ́ta àti òru mẹ́ta” ní kedere; ìtumọ̀ kò yanju àríyànjiyàn nípa bí a ṣe ń ka àkókò náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé navnav. A yan “ẹ̀dá òkun ńlá” láti jẹ́ àdánidá ṣùgbọ́n kí ó má ṣe dín κῆτος kù sí irú ẹranko kan; a sì pa “ọkàn ilẹ̀ ayé” mọ́ láti dáàbò bo àìdánilójú àkàwé àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tó wà nínú orísun.
