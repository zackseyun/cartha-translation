id: MAT.12.33
reference: Matthew 12:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: yo
  text: “Ẹ sọ igi náà di rere, kí èso rẹ̀ náà sì di rere[a]; tàbí ẹ sọ igi náà di jíjẹrà, kí èso rẹ̀ náà sì di jíjẹrà[b]. Nítorí láti inú èso rẹ̀ ni a ti ń mọ igi náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kà igi náà sí rere, kí ẹ sì ka èso rẹ̀ sí rere.” Ọ̀rọ̀ Gíríìkì jẹ́ àṣẹ ní gírámà, ṣùgbọ́n ó lè ṣiṣẹ́ gẹ́gẹ́ bí ìpèníjà láti kà ohun sí irú rẹ̀ tàbí láti fi irú rẹ̀ hàn.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì σαπρός lè túmọ̀ sí ohun tí ó jẹrà, tí ó bàjẹ́, tàbí tí kò níye mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: ẹ sọ ... di
  rationale: Ọ̀rọ̀ yìí pa ìlànà àṣẹ ẹni púpọ̀ mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘make ... become.’ Ní àyíká yìí ó tún lè ní agbára ọ̀rọ̀ àfiwé bí ‘ẹ kà sí,’ ṣùgbọ́n a kò yí àṣẹ Gíríìkì padà.
- source_word: δένδρον
  choice: igi
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédéé, ó sì pa àwòrán àfiwé náà mọ́.
- source_word: καλός
  choice: rere / dára
  rationale: ‘Rere’ bá igi mu, ‘dára’ sì jẹ́ ọ̀nà Yorùbá tí ó rọrùn fún èso; àwọn méjèèjì pa ìtumọ̀ ohun tí ó dára àti ìfarahàn ìwà rere mọ́ láì dín un kù sí ìlera ara nìkan.
- source_word: καρπός
  choice: èso
  rationale: ‘Èso’ ni ìbámu tààrà àti àdánidá fún àwòrán igi yìí ní Yorùbá.
- source_word: σαπρός
  choice: jíjẹrà / jẹrà
  rationale: Àṣàyàn yìí mú àwòrán ohun tí ó bàjẹ́ tàbí tí ó ti rà hàn gbangba, ó sì lè bá igi àti èso mu.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: nítorí nípa èso igi
  rationale: ‘Nítorí’ fi ìbáṣepọ̀ àlàyé γάρ hàn, ‘nípa èso’ sì sọ ἐκ lọ́nà Yorùbá àdánidá gẹ́gẹ́ bí ohun tí a fi dá igi mọ̀.
- source_word: γινώσκεται
  choice: ni a fi ń mọ̀ ọ́n
  rationale: 'Èyí pa ìtumọ̀ ìṣe àìsọ ẹni tó ṣe é àti ìṣe tí ó ń ṣẹlẹ̀ ní gbogbogbòò mọ́: èso ni àmì tí a fi ń dá igi mọ̀.'
theological_decisions:
- issue: Agbára àwọn ọ̀rọ̀ àṣẹ nínú àfiwé Jésù
  choice: 'A pa wọ́n mọ́ gẹ́gẹ́ bí àṣẹ tààrà: ‘Ẹ sọ igi náà di...’'
  alternative: ‘Ẹ kà igi náà sí...’ tàbí ‘Bí ẹ bá sọ igi náà di...’
  rationale: Gíríìkì lo àṣẹ aorist lẹ́ẹ̀mejì. Bó tilẹ̀ jẹ́ pé ó lè jẹ́ ìpèníjà ọ̀rọ̀ tàbí pé ó túmọ̀ sí kí wọ́n fi igi hàn bí irú rẹ̀, pípa àṣẹ náà mọ́ kò fi ìtumọ̀ ẹ̀kọ́ kan tí a ti yàn tẹ́lẹ̀ bo ìfọ̀rọ̀wérọ̀ inú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ‘ẹ’ fún àṣẹ ẹni púpọ̀ gẹ́gẹ́ bí Gíríìkì. Àtúnṣe kékeré láàárín ‘rere/dára’ àti ‘jíjẹrà/jẹrà’ jẹ́ kí gbolohun náà dun bí Yorùbá àdánidá, nígbà tí ìfarakanra àfiwé náà ṣì dúró.
