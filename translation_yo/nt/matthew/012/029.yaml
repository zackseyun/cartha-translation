id: MAT.12.29
reference: Matthew 12:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: yo
  text: Àbí báwo ni ẹnikẹ́ni ṣe lè wọ ilé ọkùnrin alágbára, kí ó sì fipá gba àwọn ohun ìní rẹ̀[a], bí kò bá kọ́kọ́ dè[b] ọkùnrin alágbára náà? Nígbà náà ni yóò kó ohun gbogbo inú ilé rẹ̀ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun èlò rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka ní pàtó sí ohun èlò inú ilé, tàbí ní gbogbogbòò sí àwọn ohun ìní.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “so mọ́lẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ṣe àfihàn àlàyé mìíràn tí ó so mọ́ àríyànjiyàn tó ṣáájú, ó sì bójú mu fún ìbéèrè àròsọ ní Yorùbá.
- source_word: δύναταί τις
  choice: ni ẹnikẹ́ni ṣe lè
  rationale: Ó pa agbára tàbí ṣíṣeéṣe àti ìtumọ̀ ẹni tí kò ní pàtó mọ́ nínú ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: ọkùnrin alágbára
  rationale: Ó pa àwòrán ọkùnrin kan tí ó lágbára mọ́, láì sọ àkàwé náà di àlàyé ẹ̀kọ́ ìgbàgbọ́.
- source_word: τὰ σκεύη αὐτοῦ
  choice: àwọn ohun ìní rẹ̀
  rationale: Ní pàtó, σκεύη lè túmọ̀ sí àwọn ohun èlò tàbí ohun èlò inú ilé; nínú àkàwé yìí ó lè gbòòrò sí gbogbo ohun ìní ẹni náà.
- source_word: ἁρπάσαι
  choice: já ... gbà
  rationale: Ó fi hàn pé a fi ipá gba ohun náà, ṣùgbọ́n kò tíì fi ìtumọ̀ ìkógun tó lágbára jù lọ tí διαρπάσει ní hàn.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: bí kò bá kọ́kọ́ dè
  rationale: Ó pa ìpèsè àìṣeéṣe àti ìtẹ̀lé àkókò ‘kọ́kọ́’ mọ́; ‘dè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún fífi ìdè mú ẹni.
- source_word: διαρπάσει
  choice: yóò ... kó ... ní ìkógun
  rationale: ‘Kó ní ìkógun’ fi ìṣe jíjẹ ohun gbogbo lọ lẹ́yìn fífi agbára borí olówó ilé hàn, ó sì yàtọ̀ sí ‘já ... gbà’ tó ṣáájú.
theological_decisions:
- issue: Èdè akọ nínú àkàwé
  choice: ọkùnrin alágbára / ẹnikẹ́ni
  alternative: alágbára náà / ẹnì kan
  rationale: Gíríìkì lo àwòrán akọ ní pàtó fún ẹni alágbára, nítorí náà a pa ‘ọkùnrin alágbára’ mọ́; ‘ẹnikẹ́ni’ sì mú ìtumọ̀ ẹni tí kò ní pàtó jáde ní Yorùbá àdánidá.
- issue: Ìwọ̀n àkàwé ‘ilé’ àti ‘ohun ìní’
  choice: Pa àwòrán olè tó wọ ilé mọ́ láì túmọ̀ gbogbo ẹ̀kúnrẹ́rẹ́ rẹ̀ sí ẹ̀kọ́ ìgbàgbọ́ nínú ẹsẹ náà
  alternative: Túmọ̀ ‘ilé’ sí agbègbè àṣẹ àti ‘ohun ìní’ sí àwọn ẹni tàbí ohun tó wà lábẹ́ agbára ẹ̀mí
  rationale: Àyíká ẹsẹ náà dá lórí àṣẹ Jésù lórí àwọn agbára ẹ̀mí búburú, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gbé àkàwé ilé àti ìkógun kalẹ̀; ìtumọ̀ kò yẹ kí ó fi àlàyé àkàwé kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. ‘Àbí’ àti ìṣètò ‘báwo ni ... ṣe lè’ mú ìbéèrè àròsọ náà dun bí Yorùbá àdánidá; ‘kó ... ní ìkógun’ sì pa agbára àkàwé ìjínigbé ilé mọ́.
