revisions:
- from: Àbí báwo ni ẹnikẹ́ni ṣe lè wọ ilé ọkùnrin alágbára, kí ó sì já àwọn ohun ìní rẹ̀ gbà[a], bí kò bá kọ́kọ́ dè[b] ọkùnrin alágbára náà? Nígbà náà ni yóò sì kó ilé rẹ̀ ní ìkógun.
  to: Àbí báwo ni ẹnikẹ́ni ṣe lè wọ ilé ọkùnrin alágbára, kí ó sì fipá gba àwọn ohun ìní rẹ̀[a], bí kò bá kọ́kọ́ dè[b] ọkùnrin alágbára náà? Nígbà náà ni yóò kó ohun gbogbo inú ilé rẹ̀ lọ.
  rationale: 'A tún àwọn ibi méjì ṣe fún ìbámu tó dára jù lọ pẹ̀lú ìtumọ̀ Gíríìkì àti ìlò Yorùbá: ‘fipá gba’ yà ἁρπάσαι sọ́tọ̀ kúrò nínú ìkógun tó kúnrẹ́rẹ́ ti διαρπάσει, nígbà tí ‘kó ohun gbogbo inú ilé rẹ̀ lọ’ jẹ́ ìpèdè adayeba fún ìkógun ilé. A pa ìtumọ̀ àkàwé náà mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:36:13Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìbéèrè àròsọ, ìtẹ̀lé ‘kọ́kọ́… nígbà náà,’ àti ìyàtọ̀ láàárín ἁρπάσαι àti διαρπάσει mọ́ dáadáa. Síbẹ̀, ‘já … gbà’ kò ṣe kedere tó nípa ìgbọ́wọ́ nípasẹ̀ agbára, ‘kó ilé rẹ̀ ní ìkógun’ sì kì í ṣe ìpèdè Yorùbá tí ó wọ́pọ̀ fún ìkógun ilé.
  naturalness: Àtúnṣe náà lo ‘fipá gba’ fún gbígba ohun nípasẹ̀ agbára, ó sì lo ‘kó ohun gbogbo inú ilé rẹ̀ lọ’ fún jíjẹ ohun inú ilé lọ lẹ́yìn dídè ẹni alágbára náà. Èyí jẹ́ Yorùbá òde òní tí ó hàn gbangba, tí ó sì pa agbára ìṣe διαρπάσει mọ́.
  terminology: ‘Ọkùnrin alágbára,’ ‘ohun ìní,’ ‘dè,’ àti ‘ilé’ jẹ́ àwọn ọ̀rọ̀ tó bá àwòrán Gíríìkì mu. Àlàyé ìsàlẹ̀ a tún ṣàtúnṣe kí ‘ohun èlò’ má ṣe tún ara rẹ̀ sọ lásán, kí ó sì ṣàlàyé σκεύη ní kedere.
  issues:
  - severity: medium
    issue: ‘já àwọn ohun ìní rẹ̀ gbà’
    rationale: Ìpèdè náà lè gbọ́ bí ìjà tàbí ìgbàpadà ohun kan; ἁρπάσαι níbí jẹ́ gbígba ohun lọ nípasẹ̀ agbára. ‘Fipá gba’ ṣàfihàn èyí ní kedere.
  - severity: medium
    issue: ‘kó ilé rẹ̀ ní ìkógun’
    rationale: Àkójọpọ̀ ọ̀rọ̀ yìí kò rọrùn gẹ́gẹ́ bí Yorùbá àdánidá. ‘Kó ohun gbogbo inú ilé rẹ̀ lọ’ jẹ́ ọ̀nà ìbílẹ̀ tí ó mú ìtumọ̀ διαρπάσει—jíjẹ ohun inú ilé lọ pátápátá—jáde.
  - severity: low
    issue: Ìtúmọ̀ àlàyé ìsàlẹ̀ [a] tún ‘ohun èlò’ sọ
    rationale: Ìsọ̀rọ̀ náà tún ara rẹ̀ ṣe ní ‘àwọn ohun èlò tàbí ohun èlò inú ilé.’ A ṣàtúnṣe rẹ̀ sí ìyàtọ̀ tó kedere láàárín ohun èlò inú ilé àti ohun ìní lápapọ̀.
