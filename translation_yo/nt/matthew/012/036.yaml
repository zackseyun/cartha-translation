id: MAT.12.36
reference: Matthew 12:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé àwọn ènìyàn yóò jíhìn nípa gbogbo ọ̀rọ̀ asán[a] tí ènìyàn yóò sọ ní ọjọ́ ìdájọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ tí kò so èso” tàbí “ọ̀rọ̀ àìbìkítà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí kò ṣiṣẹ́, tí kò so èso, tàbí tí a sọ láìbìkítà.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ṣùgbọ́n mo sọ fún yín
  rationale: Ọ̀rọ̀ náà jẹ́ ìkìlọ̀ tààrà láti ẹnu Jésù. “Ṣùgbọ́n” fi ìyàtọ̀ onírẹ̀lẹ̀ tí δέ ní sí ohun tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: πᾶν ῥῆμα ἀργόν
  choice: gbogbo ọ̀rọ̀ àìbìkítà
  rationale: πᾶν ní agbára pínpín, ìyẹn “gbogbo ọ̀kọ̀ọ̀kan.” ῥῆμα tọ́ka sí ọ̀rọ̀ tí a sọ, ἀργόν sì lè túmọ̀ sí ohun tí kò ṣiṣẹ́, tí kò so èso, tàbí tí a sọ láìbìkítà. “Ọ̀rọ̀ àìbìkítà” mú ìkìlọ̀ nípa ojúṣe ọ̀rọ̀ jáde láìfi ìwà búburú kan pàtó kún un.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: tí wọ́n bá sọ
  rationale: Ẹni tí a ń tọ́ka sí ni gbogbo ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan. Ìlò “bá” nínú gbólóhùn ìbátan bá ìtumọ̀ ọjọ́ iwájú àti ìṣẹ̀lẹ̀ gbogbogbò mu ní Yorùbá àdánidá.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: yóò jíhìn nípa gbogbo ọ̀rọ̀
  rationale: Àpapọ̀ ἀποδίδωμι àti λόγος jẹ́ ọ̀nà ìsọ̀rọ̀ fún jíjíhìn tàbí fífúnni ní àlàyé nípa ohun kan. “Jíhìn nípa” pa ìtọ́ka περὶ αὐτοῦ mọ́ ní kedere.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ní ọjọ́ ìdájọ́
  rationale: Ìtumọ̀ náà jẹ́ àkókò tí ìdájọ́ yóò wáyé; “ní ọjọ́ ìdájọ́” jẹ́ Yorùbá tó mọ́gbọ́n dání, tó sì pa ìtumọ̀ ìdájọ́ mọ́.
theological_decisions:
- issue: Agbára ìwà rere tàbí ìwà búburú inú ἀργόν
  choice: ọ̀rọ̀ àìbìkítà
  alternative: ọ̀rọ̀ asán; ọ̀rọ̀ tí kò so èso
  rationale: Ọ̀rọ̀ Jésù jẹ́ ìkìlọ̀ pé ènìyàn ní ojúṣe fún ohun tó sọ níwájú ìdájọ́ Ọlọ́run. “Àìbìkítà” fi àìní ojúṣe hàn, ṣùgbọ́n kò fi ìtumọ̀ “ọ̀rọ̀ burúkú” tàbí “ọ̀rọ̀ èébú” tí Gíríìkì kò sọ kún un.
- issue: Àwọn tí οἱ ἄνθρωποι ń tọ́ka sí
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin; ẹ̀dá ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe akọ nìkan; “àwọn ènìyàn” ni ọ̀nà Yorùbá tó ṣe kedere jù.
- issue: Ohun tí a ó jíhìn nípa rẹ̀
  choice: nípa gbogbo ọ̀rọ̀ ... tí wọ́n bá sọ
  alternative: wọ́n yóò jíhìn nípa rẹ̀
  rationale: Fífi ohun tí jíjíhìn dá lé hàn tààrà pa περὶ αὐτοῦ mọ́, ó sì yẹra fún arọ́pò-orúkọ ẹyọ kan tí ó lè dà bí ẹni pé kò bá “gbogbo ọ̀rọ̀” mu ní Yorùbá.
translation_notes:
  register: A lo Yorùbá àjùmọ̀lò tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Jíhìn” jẹ́ ọ̀rọ̀ tó bójú mu fún ìdáhùn ẹni níwájú ìdájọ́, “àwọn ènìyàn” sì jẹ́ àkójọpọ̀ tó kan gbogbo akọ àti abo.
