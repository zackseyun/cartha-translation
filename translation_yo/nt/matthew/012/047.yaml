  rationale: 'Àtúnṣe kan ṣoṣo ni a ṣe: a yọ “ọ̀nà” kúrò nítorí pé orísun kò sọ̀rọ̀ nípa ọ̀nà tàbí ìmúrasílẹ̀ kan. “Wọ́n fẹ́ láti bá ọ sọ̀rọ̀” sọ ìfẹ́/ìmúlò ζητοῦντες ní Yorùbá òde òní, láìfi ìdí mìíràn kún un. A pa ìtumọ̀ perfect lọwọlọwọ ti ἑστήκασιν mọ́ pẹ̀lú “dúró níta,” a sì dá àkọsílẹ̀ ìyàtọ̀ àyọkà sílẹ̀.'
