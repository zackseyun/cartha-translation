id: MAT.12.47
reference: Matthew 12:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: yo
  text: Nígbà náà, ẹnì kan sọ fún un pé,[a] “Wò ó, ìyá rẹ àti àwọn arákùnrin rẹ dúró níta, wọ́n fẹ́ láti bá ọ sọ̀rọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kò ní ẹsẹ yìí.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Nígbà náà, ẹnì kan sọ fún un pé
  rationale: δέ jẹ́ àsopọ̀ ìtàn tí kò fi ìtakora líle hàn; “Nígbà náà” mú ìtàn tẹ̀ síwájú lọ́nà àdánidá. τις jẹ́ aláìlópin, nítorí náà “ẹnì kan” bá a mu.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ yìí ń pe àfiyèsí ẹni tí a ń bá sọ̀rọ̀; “Wò ó” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó pa agbára ìtọ́ka náà mọ́.
- source_word: μήτηρ σου
  choice: ìyá rẹ
  rationale: Ìtumọ̀ tààrà ti gbólóhùn oníhun náà ni, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: οἱ ἀδελφοί σου
  choice: àwọn arákùnrin rẹ
  rationale: Nínú àyíká ìtàn yìí, ἀδελφοί tọ́ka sí àwọn ọkùnrin ìdílé; “àwọn arákùnrin rẹ” pa akọ-ǹlá inú orísun mọ́ láìsọ ìbátan náà di ohun tí ó ju ẹ̀rí orísun lọ.
- source_word: ἔξω ἑστήκασιν
  choice: dúró níta
  rationale: Àkókò perfect ti ἵστημι ń fi ipò tí ó wà lọ́wọ́ hàn lẹ́yìn tí wọ́n ti dúró; “dúró níta” sọ ipò yẹn ní ṣókí, ó sì pa ἔξω mọ́ ní kedere.
- source_word: ζητοῦντές
  choice: wọ́n ń wá ọ̀nà
  rationale: ζητέω ní ìtumọ̀ ìwá tàbí ìsapá láti ṣe ohun kan. “Ń wá ọ̀nà” jẹ́ àdánidá ní Yorùbá, ó sì pa èrò participle tí ń lọ lọ́wọ́ mọ́ láìdá ìdí wọn lẹ́jọ́.
- source_word: σοι λαλῆσαι
  choice: láti bá ọ sọ̀rọ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá àdánidá fún infinitive λαλῆσαι pẹ̀lú dative σοι, ó sì túmọ̀ sí láti sọ̀rọ̀ sí ẹni náà tàbí pẹ̀lú rẹ̀.
theological_decisions:
- issue: Ipò àyọkà Matthew 12:47 nínú àwọn ìwé àfọwọ́kọ
  choice: Fi ẹsẹ náà sínú ọ̀rọ̀ pàtàkì gẹ́gẹ́ bí SBLGNT tí a pèsè, kí a sì fi àkọsílẹ̀ sọ pé àwọn ìwé àfọwọ́kọ kan kò ní ẹsẹ yìí.
  alternative: Má ṣe fi ẹsẹ náà sínú ọ̀rọ̀ pàtàkì nítorí pé kò sí nínú àwọn ẹlẹ́rìí àfọwọ́kọ kan.
  rationale: Orísun SBLGNT tí a fi fún iṣẹ́ náà ní ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé a fi àmì àìdánilójú àyọkà yí i ká. Fífi í sínú ọ̀rọ̀ àti fífi ìyàtọ̀ náà sínú àlàyé ìsàlẹ̀ jẹ́ kedere, ó sì yẹra fún píparẹ́ ìṣòro àyọkà náà ní ìdákẹ́jẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Wò ó” pa ohùn ìpe-àfiyèsí mọ́, “bá ọ sọ̀rọ̀” sì jẹ́ àdánidá ju ìtumọ̀ líle tààrà lọ.
