id: MAT.12.1
reference: Matthew 12:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: yo
  text: Ní àkókò náà, Jésù gba inú àwọn oko ọkà kọjá ní ọjọ́ Ìsinmi[a]. Ebi sì pa àwọn ọmọ-ẹ̀yìn rẹ̀, wọ́n sì bẹ̀rẹ̀ sí í já àwọn ìpẹ́ ọkà, wọ́n sì ń jẹ ẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘ní àwọn ọjọ́ Ìsinmi’; ọ̀pọ̀ yìí jẹ́ ọ̀nà àsọyé tó túmọ̀ sí ‘ní ọjọ́ Ìsinmi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Ní àkókò náà
  rationale: Ó jẹ́ àmì àkókò nínú ìtàn; gbólóhùn yìí bá èdè Yorùbá òde òní mu, kò sì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἐπορεύθη
  choice: gba ... kọjá
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà fi hàn pé Jésù ń gba ibẹ̀ kọjá; ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: τοῖς σάββασιν
  choice: ní ọjọ́ Ìsinmi
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni fọ́ọ̀mù Gíríìkì, ó jẹ́ ọ̀nà àsọyé Koiné fún ọjọ́ Ìsinmi kan.
- source_word: διὰ τῶν σπορίμων
  choice: inú àwọn oko ọkà
  rationale: σπόριμος ń tọ́ka sí oko tí a gbìn, pàápàá oko ọkà; ‘oko ọkà’ ṣe kedere fún òǹkàwé Yorùbá.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: δέ níbí ń so ìṣẹ̀lẹ̀ tó tẹ̀ lé e pọ̀ mọ́ ti àkọ́kọ́, kì í ṣe àtakò tó lágbára.
- source_word: ἐπείνασαν
  choice: Ebi sì pa
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ebi bẹ̀rẹ̀ sí í pa ẹnì kan; ó tún bá ìṣe aorist náà mu nínú àyíká yìí.
- source_word: ἤρξαντο
  choice: wọ́n sì bẹ̀rẹ̀ sí í
  rationale: Ó pa ìbẹ̀rẹ̀ ìṣe náà mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́.
- source_word: τίλλειν
  choice: já
  rationale: ‘Já’ sọ ìṣe fífi ọwọ́ yọ àwọn ìpẹ́ ọkà kúrò lára igi wọn ní ṣókí àti ní àdánidá.
- source_word: στάχυας
  choice: àwọn ìpẹ́ ọkà
  rationale: ‘Ìpẹ́ ọkà’ ń tọ́ka sí apá ọkà tó gbé àwọn hóró, ó sì ṣe pàtó ju sísọ ‘ọkà’ lásán lọ.
- source_word: καὶ ἐσθίειν
  choice: wọ́n sì ń jẹ ẹ́
  rationale: Ó mú ìṣe jíjẹ tí ó tẹ̀ lé jíjá ọkà jáde ní Yorùbá tó rọ̀, ó sì pa ìbáṣepọ̀ àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ σάββασιν
  choice: ní ọjọ́ Ìsinmi
  alternative: ní àwọn ọjọ́ Ìsinmi
  rationale: Ọ̀pọ̀ fọ́ọ̀mù Gíríìkì jẹ́ àṣà àsọyé fún ọjọ́ Ìsinmi kan níbí. Lílo ẹyọ kan dènà èrò tí kò tọ́ pé ọ̀pọ̀ ọjọ́ Ìsinmi ni ìṣẹ̀lẹ̀ náà gba.
translation_notes:
  register: A lo Yorùbá boṣewa òde òní pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lásán; ‘ọjọ́ Ìsinmi’ àti ‘ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Bíbélì tí a mọ̀ dáadáa láìgbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọ inú ẹsẹ náà.
