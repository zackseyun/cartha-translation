source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: yo
  text: Ẹnu sì ya gbogbo àwọn ènìyàn náà, wọ́n sì ń sọ pé, “Ṣé ẹni yìí lè jẹ́ Ọmọ Dáfídì[a]?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ Dáfídì” jẹ́ orúkọ oyè Mèsáyà; ó ń tọ́ka sí olùgbàlà ọba tí a ṣèlérí pé yóò wá láti inú ìran Dáfídì.
    reason: cross_reference
  - marker: b
    text: 'Tàbí, ní ọ̀nà tó tú agbára ìbéèrè náà sílẹ̀ ní tààrà sí i: “Dájúdájú, ẹni yìí kì í ṣe Ọmọ Dáfídì, àbí?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: Ẹnu sì ya
  rationale: Ọ̀rọ̀ yìí fi ìyàlẹ́nu líle hàn. Àkànlò-èdè Yorùbá ‘ẹnu ya’ jẹ́ ọ̀nà àdánidá, tó sì lóye fún òǹkàwé òde òní láti sọ pé ohun tí wọ́n rí yà wọ́n lẹ́nu gidigidi.
- source_word: πάντες οἱ ὄχλοι
  choice: gbogbo àwọn èrò náà
  rationale: ‘Gbogbo’ pa πάντες mọ́, ‘àwọn èrò’ sì pa ìwúlò ọ̀pọ̀ nínú ὄχλοι mọ́ láìsọ ọ́ di ogunlọ́gọ̀ kan ṣoṣo.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ pé
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ tàbí ọ̀rọ̀ tí ọ̀pọ̀ ènìyàn ń sọ hàn, gẹ́gẹ́ bí àkókò aláìpé nínú Gíríìkì ṣe lè túmọ̀ sí.
- source_word: Μήτι
  choice: Ṣé ẹni yìí lè jẹ́
  rationale: Ìbéèrè yìí ní ìṣiyèméjì, ó sì sábà máa ń retí ìdáhùn òdì. ‘Ṣé ... lè jẹ́’ pa ìyàlẹ́nu àti ṣíṣe àgbéyẹ̀wò wọn mọ́ láìsọ ìkọ̀sílẹ̀ wọn di ohun tó lágbára jù.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: Èyí pa orúkọ oyè Mèsáyà tó wà nínú Gíríìkì mọ́ dípò ṣíṣe àlàyé rẹ̀ sínú ọ̀rọ̀ pàtàkì náà.
theological_decisions:
- issue: Ìtumọ̀ Mèsáyà nínú ‘Ọmọ Dáfídì’
  choice: Pa ‘Ọmọ Dáfídì’ mọ́ gẹ́gẹ́ bí orúkọ oyè nínú ọ̀rọ̀ pàtàkì.
  alternative: Mèsáyà; ajogún Dáfídì tí a ṣèlérí
  rationale: Orísun Gíríìkì lo orúkọ oyè fúnra rẹ̀. Fífi í sílẹ̀ bẹ́ẹ̀ pa ìtàn, ìfojúsọ́nà ọba àti ìwúwo ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, láìfi ìtumọ̀ kan rọ́pò ọ̀rọ̀ orísun.
- issue: Agbára ìbéèrè Μήτι
  choice: 'Lo ìbéèrè oníṣiyèméjì: ‘Ṣé ẹni yìí lè jẹ́ ...?’'
  alternative: ‘Dájúdájú, ẹni yìí kì í ṣe ... àbí?’
  rationale: Μήτι lè retí ìdáhùn òdì, ṣùgbọ́n nínú àyíká yìí àwọn èrò ń ṣe kàyéfì. Ọ̀rọ̀ pàtàkì pa ìṣiyèméjì náà mọ́; àlàyé ìsàlẹ̀ sì tọ́ka sí agbára òdì tó tún ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Àkànlò ‘ẹnu ya’ mú ìyàlẹ́nu líle jáde lọ́nà Yorùbá àdánidá.
