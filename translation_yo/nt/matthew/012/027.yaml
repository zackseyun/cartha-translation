id: MAT.12.27
reference: Matthew 12:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: yo
  text: Bí ó bá sì ṣe pé nípasẹ̀ Béélísébúlù[a] ni mo fi ń lé àwọn ẹ̀mí èṣù jáde, nípasẹ̀ ta ni àwọn ọmọ yín fi ń lé wọn jáde? Nítorí náà, àwọn fúnra wọn ni yóò jẹ́ àwọn onídàájọ́ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì: “Béélísébúlù”; àwọn ìtumọ̀ kan ní “Béélísébúbù.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: nípasẹ̀ Béélísébúlù
  rationale: Ní àyíká ẹ̀sùn yìí, ἐν ní ìtumọ̀ ohun èlò tàbí agbára tí a fi ṣe ohun kan; “nípasẹ̀” mú ìtumọ̀ náà jáde ní Yorùbá àdánidá. A ṣe àkọsílẹ̀ orúkọ Βεελζεβούλ gẹ́gẹ́ bí Béélísébúlù.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: ń lé àwọn ẹ̀mí èṣù jáde
  rationale: “Lé … jáde” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìfipá lé ẹ̀mí búburú kúrò; “àwọn ẹ̀mí èṣù” sì dúró fún δαιμόνια ní èdè òde òní.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: àwọn ọmọ yín
  rationale: Èyí pa àwòrán ìbátan inú υἱοί mọ́ láì pinnu bóyá ó túmọ̀ sí ọmọ gangan, ọmọ-ẹ̀yìn, tàbí àwọn ẹni ẹgbẹ́ wọn.
- source_word: ἐν τίνι
  choice: nípasẹ̀ ta
  rationale: Gẹ́gẹ́ bí ἐν àkọ́kọ́, gbólóhùn náà ń béèrè ẹni tàbí agbára tí wọ́n fi ń lé àwọn ẹ̀mí èṣù jáde; “nípasẹ̀ ta” jẹ́ àdánidá, ó sì pa ìbéèrè nípa aṣojú tàbí agbára mọ́.
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi ìparí ọgbọ́n tí ó jáde láti inú ìbéèrè àtakò hàn ní ṣókí.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: àwọn fúnra wọn ni yóò jẹ́ onídàájọ́ yín
  rationale: Ìtumọ̀ yìí pa orúkọ κριταί àti àkókò ọjọ́ iwájú mọ́. “Àwọn fúnra wọn” tún mú ìtẹnumọ́ αὐτοὶ hàn.
theological_decisions:
- issue: Ìdánimọ̀ àti bí a ṣe kọ Βεελζεβούλ
  choice: Béélísébúlù
  alternative: Béélísébúbù
  rationale: A tẹ̀ lé fọ́ọ̀mù orúkọ inú SBLGNT, Βεελζεβούλ, dípò kí a mú un bá fọ́ọ̀mù ìbílẹ̀ tó mọ̀ síi mu. Èyí jẹ́ ìpinnu lórí àkọsílẹ̀ orúkọ, kì í ṣe ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
- issue: Ta ni “àwọn ọmọ yín” ń tọ́ka sí?
  choice: A pa “àwọn ọmọ yín” mọ́ láì túmọ̀ rẹ̀ sí ẹgbẹ́ kan pàtó.
  alternative: àwọn ọmọ-ẹ̀yìn yín / àwọn ènìyàn yín
  rationale: υἱοί jẹ́ ọ̀rọ̀ ìbátan, ṣùgbọ́n nínú àyíká yìí ó lè tọ́ka sí àwọn ọmọ ẹgbẹ́ tàbí ọmọ-ẹ̀yìn àwọn olùgbọ́. Pípa ọ̀rọ̀ náà mọ́ ń dáàbò bo àìdánilójú inú orísun.
- issue: Ìtumọ̀ pé wọn yóò jẹ́ “onídàájọ́”
  choice: A pa àpèjúwe ìdájọ́ náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ọjọ́ iwájú.
  alternative: wọn yóò dá yín lẹ́jọ́
  rationale: Gíríìkì lo orúkọ κριταί, “àwọn onídàájọ́,” kì í ṣe ọ̀rọ̀-ìṣe nìkan. Ìtumọ̀ náà kò ṣàlàyé bóyá èyí jẹ́ ìdájọ́ ní tààràtà tàbí ẹ̀rí ìtakora tí ìṣe wọn ń jẹ́ sí àwọn olùgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. A yan “nípasẹ̀” fún ἐν oníṣe-èlò, “lé … jáde” fún ìfipá lé ẹ̀mí èṣù kúrò, a sì pa ìtẹnumọ́ αὐτοὶ mọ́ pẹ̀lú “àwọn fúnra wọn.” Gbogbo àmì ohùn ni a fi sí ibi tí ó bá yẹ.
