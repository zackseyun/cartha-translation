id: MAT.12.12
reference: Matthew 12:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: yo
  text: Ǹjẹ́, èwo ni iye ènìyàn pọ̀ ju iye àgùntàn lọ tó bẹ́ẹ̀! Nítorí náà, ó bófin mu láti ṣe rere ní ọjọ́ Ìsinmi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó pa fọ́ọ̀mù Gíríìkì mọ́, “ní àwọn ọjọ́ Ìsinmi.” Ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀, ṣùgbọ́n a sábà máa ń lò ó gẹ́gẹ́ bí àṣà-èdè fún pípa Ọjọ́ Ìsinmi mọ́.
    reason: Àṣàyàn ọ̀rọ̀ míì àti àlàyé àṣà èdè Gíríìkì.
lexical_decisions:
- source_word: πόσῳ οὖν διαφέρει
  choice: Ǹjẹ́ nígbà náà, … ṣeyebíye ju … lọ tó bẹ́ẹ̀
  rationale: 'Ó fi ìbéèrè àsọyé àti ìjiyàn láti ohun kékeré sí ohun ńlá hàn: ènìyàn níye ju àgùntàn lọ púpọ̀.'
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀dá ènìyàn kan ní gbogbogbò, ní ìfiwéra pẹ̀lú àgùntàn.
- source_word: προβάτου
  choice: àgùntàn
  rationale: Ó jẹ́ ohun tí a fi ènìyàn wé lẹ́yìn ọ̀rọ̀ ìfiwéra ‘ju … lọ.’
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó ṣàfihàn àbájáde ọgbọ́n tí a fà jáde láti inú ìfiwéra tó ṣáájú.
- source_word: ἔξεστιν
  choice: ó bófin mu
  rationale: Àríyànjiyàn náà dá lórí ohun tí òfin fàyè gbà ní ọjọ́ ìsinmi, kì í ṣe ìyọ̀ǹda lásán.
- source_word: τοῖς σάββασιν
  choice: ní àwọn ọjọ́ ìsinmi
  rationale: Ó pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè jẹ́ àṣà èdè fún pípa ọjọ́ ìsinmi mọ́.
- source_word: καλῶς ποιεῖν
  choice: láti ṣe rere
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá tí ó sún mọ́ gbolohun Gíríìkì, tí ó sì túmọ̀ sí ṣíṣe ohun rere fún ẹlòmíràn.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπος gẹ́gẹ́ bí aṣojú gbogbo ẹ̀dá ènìyàn
  choice: ènìyàn
  alternative: ọkùnrin kan
  rationale: ἄνθρωπος níbí ń fi ẹ̀dá ènìyàn wé àgùntàn, kò sì ṣe pàtó nípa akọ; ‘ènìyàn’ pa agbára gbogbogbò rẹ̀ mọ́ láìfi ìtumọ̀ míì kún un.
- issue: Ọ̀pọ̀ nǹkan nínú τοῖς σάββασιν
  choice: ní àwọn ọjọ́ ìsinmi
  alternative: ní ọjọ́ ìsinmi
  rationale: A pa fọ́ọ̀mù ọ̀pọ̀ Gíríìkì mọ́ nínú ọ̀rọ̀ àkọ́kọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ó lè jẹ́ àṣà èdè fún ọjọ́ ìsinmi ní gbogbogbò.
translation_notes:
  register: Èdè Yorùbá tó péye, tó níyì, tí ó sì ṣeé lóye ni a lò. Ìbéèrè àsọyé àti àmì ìyàlẹ́nu pa agbára ọ̀rọ̀ Gíríìkì mọ́; ‘ó bófin mu’ bá àríyànjiyàn nípa òfin ọjọ́ ìsinmi mu.
