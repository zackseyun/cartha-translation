id: MAT.12.21
reference: Matthew 12:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: yo
  text: Àwọn orílẹ̀-èdè yóò sì ní ìrètí nínú orúkọ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn Kèfèrí yóò ní ìrètí nínú orúkọ rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: àti pé
  rationale: Ó so gbólóhùn yìí mọ́ àsọyé àsọtẹ́lẹ̀ tó ṣáájú; “àti pé” jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú àyọlò Yorùbá.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: nínú orúkọ rẹ̀
  rationale: Ó pa àwòrán orísun náà mọ́, níbi tí “orúkọ” ti lè dúró fún ẹni náà, ọlá rẹ̀, àti àṣẹ rẹ̀, láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἔθνη
  choice: oríṣìíríṣìí orílẹ̀-èdè
  rationale: Ó fi ìtẹnumọ́ hàn pé àwọn orílẹ̀-èdè àti àwọn ènìyàn tí kì í ṣe Ísírẹ́lì wà nínú ìlérí náà, ó sì pa ìfẹ̀sí àyọlò Aísáyà mọ́.
- source_word: ἐλπιοῦσιν
  choice: yóò ní ìrètí
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ti ọjọ́ iwájú, ó sì túmọ̀ sí níní tàbí gbígbé ìrètí lé ẹnì kan; yíyan yìí pa ìtumọ̀ “hope” mọ́ ju “gbọ́kàn lé” lọ.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη nínú àsọyé nípa Mèsáyà
  choice: oríṣìíríṣìí orílẹ̀-èdè
  alternative: àwọn Kèfèrí
  rationale: “Oríṣìíríṣìí orílẹ̀-èdè” pa ìwọ̀n àgbáyé àsọtẹ́lẹ̀ Aísáyà mọ́, nígbà tí “àwọn Kèfèrí” ṣì jẹ́ ìtumọ̀ tó ṣeé ṣe fún àwọn tí kì í ṣe Júù; àlàyé ìsàlẹ̀ ni a fi pa àṣàyàn kejì náà mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní èdè ọ̀wọ̀ àti èyí tí òǹkàwé òde òní lè lóye. A lo “nínú orúkọ rẹ̀” láti pa ìró àti àìsọ pàtó ti ọ̀rọ̀ Gíríìkì mọ́.
