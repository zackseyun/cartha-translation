id: MAT.12.11
reference: Matthew 12:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Ọkùnrin wo nínú yín ni, bí ó bá ní àgùntàn kan, tí àgùntàn náà bá ṣubú sínú kòtò ní ọjọ́ Sábáàtì[a], tí kì yóò dì í mú, kí ó sì gbé e jáde[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “ní àwọn Sábáàtì”; ọ̀nà àsọyé ni ọ̀pọ̀ yìí fún “ní ọjọ́ Sábáàtì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ó sì gbé e dìde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Ọkùnrin wo nínú yín ni
  rationale: Èyí mú ìbéèrè àsọyé Gíríìkì jáde ní Yorùbá àdánidá, ó sì pa ìtọ́ka akọ ẹyọ kan nínú ἄνθρωπος mọ́.
- source_word: ἕξει πρόβατον ἕν
  choice: bí ó bá ní àgùntàn kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ἕξει jẹ́ ọ̀rọ̀ ọjọ́ iwájú ní ìrísí, ó ń ṣiṣẹ́ nínú àpẹẹrẹ àdéhùn; ‘bí ó bá ní’ ni Yorùbá àdánidá fún un, ‘àgùntàn kan’ sì pa tẹnumọ́ iye kan mọ́.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: tí àgùntàn náà sì ṣubú
  rationale: A tún orúkọ àgùntàn sọ dípò arọ́pò-orúkọ nítorí ìṣedédé àti ìmọ́lẹ̀ èdè Yorùbá, nígbà tí ‘ṣubú’ fi ìṣẹ̀lẹ̀ àdéhùn náà hàn.
- source_word: τοῖς σάββασιν
  choice: ní ọjọ́ Sábáàtì
  rationale: Ọ̀pọ̀ nínú Gíríìkì jẹ́ ọ̀nà àsọyé fún ọjọ́ Sábáàtì; ẹyọ ni ó bá Yorùbá mu jù ní àyíká yìí.
- source_word: εἰς βόθυνον
  choice: sínú kòtò
  rationale: ‘Kòtò’ jẹ́ ọ̀rọ̀ Yorùbá gbòòrò, tí ó sì yẹ fún ihò tàbí ibi jíjìn tí ẹranko lè ṣubú sí, láìfi irú kòtò kan pàtó kún ọ̀rọ̀ náà.
- source_word: οὐχὶ κρατήσει αὐτὸ
  choice: tí kì yóò dì í mú
  rationale: οὐχί ń retí ìdáhùn rere; ìkọ̀lé ‘tí kì yóò’ mú ìfojúsọ́nà yẹn hàn, ‘dì í mú’ sì túmọ̀ sí mímú un ṣinṣin.
- source_word: καὶ ἐγερεῖ
  choice: kí ó sì gbé e jáde
  rationale: Nínú àyíká kòtò, gbígbé àgùntàn náà sókè túmọ̀ sí gbígbé e jáde. Ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì hàn.
theological_decisions:
- issue: Èdè akọ tí ó dúró fún àpẹẹrẹ gbogbogbò
  choice: Ọkùnrin
  alternative: Ẹni
  rationale: Àkọ akọ ẹyọ kan ni ἄνθρωπος níbí, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí àpẹẹrẹ àsọyé. ‘Ọkùnrin’ pa ìrísí orísun mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Ìtumọ̀ ọ̀pọ̀ σάββασιν
  choice: ní ọjọ́ Sábáàtì
  alternative: ní àwọn ọjọ́ Sábáàtì
  rationale: Ọ̀pọ̀ náà jẹ́ ọ̀nà àsọyé Gíríìkì fún Sábáàtì kan nínú àpẹẹrẹ yìí; ẹyọ kò yanjú ìjà ẹ̀kọ́ ìsìn kankan, ó kàn mú ìtumọ̀ gírámà náà hàn ní Yorùbá.
- issue: Bí a ṣe túmọ̀ ἐγερεῖ nínú àyíká kòtò
  choice: gbé e jáde
  alternative: gbé e dìde
  rationale: Orísun lè sọ ní ti gbígbé e sókè, ṣùgbọ́n àyíká fi hàn pé a ń gbé àgùntàn náà jáde kúrò nínú kòtò. A pa ọ̀nà tí ó sún mọ́ ìtumọ̀ gangan mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá, a sì pa ìrísí ìbéèrè àsọyé tí ń retí ìdáhùn rere mọ́.
