id: MAT.12.39
reference: Matthew 12:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Ìran búburú àti panṣágà[a] ń wá àmì, ṣùgbọ́n a kò ní fi àmì kankan fún un, bí kò ṣe àmì Jónà wòlíì[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Panṣágà” lè tọ́ka sí àìṣòótọ́ sí májẹ̀mú, gẹ́gẹ́ bí àwọn wòlíì ṣe máa ń fi àwòrán panṣágà ṣàpèjúwe àìṣòótọ́ sí Ọlọ́run; ó tún lè ní ìtumọ̀ àgbèrè gan-an.
    reason: cross_reference
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “àmì wòlíì Jónà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: ó dá wọn lóhùn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fèsì sí wọn; ó mú ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà jáde láì fi àtúnlò tí yóò le lójú sínú gbolohun.
- source_word: Γενεὰ
  choice: ìran
  rationale: “Ìran” ń tọ́ka sí àwùjọ àwọn ènìyàn ìgbà kan náà, ó sì pa agbára ọ̀rọ̀ ẹyọ tí ó ṣàpèjúwe gbogbo àwùjọ náà mọ́.
- source_word: πονηρὰ
  choice: búburú
  rationale: “Búburú” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìdálẹ́bi ìwà inú ọ̀rọ̀ náà mu.
- source_word: μοιχαλὶς
  choice: panṣágà
  rationale: “Panṣágà” pa àwòrán àgbèrè tàbí àìṣòótọ́ nínú ìgbéyàwó mọ́, ó sì lè ru ìtumọ̀ àsọtẹ́lẹ̀ nípa àìṣòótọ́ sí májẹ̀mú láì sọ pé ìtumọ̀ kan ṣoṣo ni.
- source_word: σημεῖον
  choice: àmì
  rationale: “Àmì” jẹ́ ìtumọ̀ tààrà tí kò fi “iṣẹ́ ìyanu” kún ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ ní gbangba.
- source_word: ἐπιζητεῖ
  choice: ń wá
  rationale: “Ń wá” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu fún ìwádi tàbí ìbéèrè àmì nínú àyíká ọ̀rọ̀ yìí.
- source_word: οὐ δοθήσεται αὐτῇ
  choice: a kò ní fi àmì kankan fún un
  rationale: Ìlò “a” gẹ́gẹ́ bí olùṣe tí a kò dárúkọ jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ìṣe aláìṣe pàtó Gíríìkì jáde; “fún un” ń tọ́ka padà sí “ìran.”
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: “Bí kò ṣe” ń fi ìyọkúrò kan ṣoṣo hàn lọ́nà Yorùbá tí ó wọ́pọ̀.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: àmì Jónà wòlíì
  rationale: Gbólóhùn yìí tẹ̀ lé ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì pẹ̀lú Yorùbá àdánidá, ó sì fi irú àmì náà sílẹ̀ fún àlàyé àyíká ọ̀rọ̀ tó tẹ̀ lé.
theological_decisions:
- issue: Ìtumọ̀ “panṣágà” nínú ìdálẹ́bi Jésù
  choice: A pa àwòrán panṣágà mọ́ nínú ẹsẹ̀ náà.
  alternative: àìṣòótọ́
  rationale: Ọ̀rọ̀ Gíríìkì lè ru àwòrán àwọn wòlíì nípa àìṣòótọ́ sí májẹ̀mú, ó sì tún lè jẹ́ ìdálẹ́bi ìwà panṣágà. Pípa àwòrán náà mọ́ kò yanjú ìforígbárí ìtumọ̀ náà láìtọ́.
- issue: Irú “àmì Jónà”
  choice: A kò ṣe àlàyé irú àmì náà nínú ẹsẹ̀ pàtàkì.
  alternative: àmì bí ohun tí ó ṣẹlẹ̀ sí Jónà; àmì tí Jónà fúnra rẹ̀ jẹ́
  rationale: Ẹsẹ̀ yìí dá gbólóhùn náà sílẹ̀ láì ṣàlàyé rẹ̀ ní kíkún; àyíká ọ̀rọ̀ tó tẹ̀ lé ló ń túbọ̀ ṣàlàyé rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A tún ṣètò àwọn àmì àlàyé ẹsẹ̀ gẹ́gẹ́ bí ibi tí ọ̀kọ̀ọ̀kan jẹ mọ́ nínú ọ̀rọ̀ náà, nítorí àwọn àmì inú ìpele ìmọ̀ràn Gẹ̀ẹ́sì kò bá àkóónú àlàyé wọn mu.
