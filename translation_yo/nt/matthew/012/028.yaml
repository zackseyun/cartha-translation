id: MAT.12.28
reference: Matthew 12:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: yo
  text: Ṣùgbọ́n bí èmi bá fi Ẹ̀mí Ọlọ́run lé àwọn ẹ̀mí èṣù jáde[a], nígbà náà, ìjọba Ọlọ́run ti dé bá yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘nínú Ẹ̀mí Ọlọ́run.’ Gbólóhùn Gíríìkì náà lè fi ọ̀nà tàbí aṣojú iṣẹ́ hàn; níhìn-ín, a túmọ̀ rẹ̀ sí ohun tí Jésù fi ṣe iṣẹ́ náà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí ‘ti dé sórí yín’ tàbí ‘ti dé ọ̀dọ̀ yín.’ Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé ìjọba Ọlọ́run ti dé ibi tí wọ́n wà nípasẹ̀ àwọn iṣẹ́ Jésù.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa ìyípadà kékeré nínú àríyànjiyàn náà mọ́, ó sì fi ipò àníyàn ‘bí’ hàn lọ́nà Yorùbá àdánidá.
- source_word: ἐν πνεύματι θεοῦ
  choice: fi Ẹ̀mí Ọlọ́run
  rationale: Ìlò ‘fi’ fi hàn pé Ẹ̀mí Ọlọ́run ni ọ̀nà tàbí aṣojú agbára tí Jésù fi ń lé àwọn ẹ̀mí èṣù jáde; àkọlé ‘Ẹ̀mí’ tún tọ́ka sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí ẹni, kì í ṣe agbára aláìlẹ́ni-nínú lásán.
- source_word: ἐγὼ
  choice: èmi
  rationale: A pa arọ́pò-orúkọ tí a tẹnumọ́ nínú Gíríìkì mọ́, dípò ‘mo’ tí kò ní ìtẹnumọ́ tó pọ̀ tó.
- source_word: ἐκβάλλω
  choice: lé … jáde
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìṣe yíyọ ẹ̀mí èṣù kúrò lára ẹni mu.
- source_word: τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá òde òní pé àwọn ẹ̀dá ẹ̀mí búburú ni a ń tọ́ka sí.
- source_word: ἄρα
  choice: nígbà náà
  rationale: Ó fi ìparí ọgbọ́n tí ó jáde láti inú gbólóhùn ‘bí’ hàn ní kedere.
- source_word: ἔφθασεν
  choice: ti dé
  rationale: Ó sọ pé ìjọba náà ti dé ní ti gidi, kì í ṣe pé ó kàn sún mọ́lé; ‘ti’ sì fi ipa ohun tí ìṣẹ̀lẹ̀ náà ní lówọ́lọ́wọ́ hàn.
- source_word: ἐφ’ ὑμᾶς
  choice: bá yín
  rationale: Pẹ̀lú ‘dé,’ gbólóhùn yìí sọ pé ìjọba Ọlọ́run ti dé ibi tí àwọn olùgbọ́ wà, ó sì kan wọn, láìsọ ọ́ di ‘ní àárín yín’ nìkan.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí a mọ̀ dáadáa, ó sì lè ní ìtumọ̀ ìṣàkóso Ọlọ́run àti ilẹ̀ ìjọba rẹ̀ láìdín ọ̀rọ̀ náà kù sí ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ‘ìjọba Ọlọ́run’ ní ìbáṣepọ̀ pẹ̀lú bí Jésù ṣe lé àwọn ẹ̀mí èṣù jáde
  choice: Ìléjáde àwọn ẹ̀mí èṣù nípasẹ̀ Ẹ̀mí Ọlọ́run jẹ́ ẹ̀rí pé ìjọba Ọlọ́run ti dé bá àwọn olùgbọ́ Jésù ní ti gidi ní àkókò náà.
  alternative: Pé ìjọba náà kàn sún mọ́lé ṣùgbọ́n kò tíì dé, tàbí pé ọjọ́ iwájú nìkan ni ọ̀rọ̀ náà ń tọ́ka sí.
  rationale: ἔφθασεν túmọ̀ sí dídé tàbí dé ibi kan. A pa ìdí àríyànjiyàn Jésù mọ́ pé àwọn iṣẹ́ rẹ̀ jẹ́ àmì ìṣàkóso Ọlọ́run tó ti bẹ̀rẹ̀ sí í farahàn, láìsọ pé gbogbo ìmúṣẹ ọjọ́ iwájú ti parí.
- issue: Ohun tí ‘Ẹ̀mí Ọlọ́run’ ń tọ́ka sí
  choice: Ó tọ́ka sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí aṣojú Ọlọ́run nínú iṣẹ́ Jésù.
  alternative: Pé ó túmọ̀ sí agbára Ọlọ́run tí kò ní ìtọ́kasí ẹni kankan.
  rationale: πνεύματι θεοῦ nínú àyíká ọ̀rọ̀ yìí fi Ẹ̀mí hàn gẹ́gẹ́ bí aṣojú iṣẹ́ yíyọ àwọn ẹ̀mí èṣù jáde; àkọlé lẹ́tà Yorùbá náà kò fi àfikún èrò ẹ̀kọ́ ìjọ kan sí ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. ‘Èmi’ pa ìtẹnumọ́ Gíríìkì mọ́; ‘lé àwọn ẹ̀mí èṣù jáde’ jẹ́ àdánidá ju títú ọ̀rọ̀ náà lẹ́yọ-ọ̀rọ̀ lọ. Àwọn àlàyé ìsàlẹ̀ pa àìdánilójú tó wà nínú ἐν àti ìrísí dídé tó wà nínú ἔφθασεν ἐφ’ ὑμᾶς mọ́.
