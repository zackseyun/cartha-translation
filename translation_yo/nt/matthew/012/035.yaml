id: MAT.12.35
reference: Matthew 12:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: yo
  text: Ènìyàn rere ń mú àwọn ohun rere jáde láti inú ìṣúra rere rẹ̀[b][a], ènìyàn búburú sì ń mú àwọn ohun búburú jáde láti inú ìṣúra búburú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ἄνθρωπος wà ní ẹyọ akọ nípa gírámà, ṣùgbọ́n a lò ó níhìn-ín gẹ́gẹ́ bí aṣojú ènìyàn lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Àyíká ẹsẹ yìí ń sọ̀rọ̀ ní pàtó nípa ọ̀rọ̀ ẹnu; nítorí náà, “àwọn ohun rere” àti “àwọn ohun búburú” lè tọ́ka ní pàtàkì sí àwọn ọ̀rọ̀ tí ènìyàn ń sọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: rere / àwọn ohun rere
  rationale: “Rere” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìyàtọ̀ ìwà rere yìí; àtúnṣe rẹ̀ nínú “àwọn ohun rere” pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: Ní Yorùbá, “ènìyàn” ni ọ̀nà àdánidá láti sọ ἄνθρωπος ní ìtumọ̀ aṣojú ẹni kan; kò ṣe pàtó sí akọ tàbí abo bí èdè Gíríìkì ti ṣe nípa gírámà.
- source_word: θησαυροῦ
  choice: ìṣúra
  rationale: “Ìṣúra” pa àwòrán ohun iyebíye tàbí ohun tí a kó pamọ́ mọ́, láì sọ ọ́ di ilé ìkójọpọ̀ gidi.
- source_word: ἐκβάλλει
  choice: ń mú ... jáde
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìrìn jáde tí ọ̀rọ̀ Gíríìkì fi hàn mọ́ ju “ń ṣe” tàbí “ń mú jáde” láìsí àfikún ohun lọ.
- source_word: πονηρὸς / πονηρά
  choice: búburú / àwọn ohun búburú
  rationale: “Búburú” ń sọ ìyàtọ̀ ìwà sí “rere” ní kedere, ó sì pa ìṣọ̀kan àtúnwi Gíríìkì mọ́.
- source_word: ἐκ
  choice: láti inú
  rationale: “Láti inú” fi hàn pé ohun tí a mú jáde wá láti inú ìkójọpọ̀ ẹni náà, ó sì bá àwòrán ἐκβάλλει mu.
theological_decisions:
- issue: Ìyàtọ̀ ìwà ẹni àti ohun tí ó ń jáde láti inú rẹ̀
  choice: A fi gbólóhùn náà sílẹ̀ ní fífẹ̀ gẹ́gẹ́ bí “àwọn ohun rere” àti “àwọn ohun búburú.”
  alternative: Láti túmọ̀ àwọn ọ̀rọ̀ àpólà náà ní pàtó sí “ọ̀rọ̀ rere” àti “ọ̀rọ̀ búburú.”
  rationale: Àyíká ẹsẹ náà ń sọ̀rọ̀ nípa ọ̀rọ̀ ẹnu, ṣùgbọ́n Gíríìkì kò fi orúkọ “ọ̀rọ̀” kún un. Ìtumọ̀ àkọ́kọ́ pa fífẹ̀ ọ̀rọ̀ náà àti ìtẹnumọ́ àyíká mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye. A lo “ènìyàn” dípò ọ̀rọ̀ akọ nítorí pé Yorùbá kì í fi akọ tàbí abo hàn nínú orúkọ yìí; a pa ìṣọ̀kan àfiwé àti àtúnwi orísun mọ́.
