source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá ẹni tí ń sọ̀rọ̀ sí i lóhùn pé, “Ta ni ìyá mi, àwọn wo sì ni àwọn arákùnrin mi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀ lé ìgbékalẹ̀ ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Ṣùgbọ́n, ní ìdáhùn, ó wí fún ẹni tí ń sọ̀rọ̀ sí i pé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ṣùgbọ́n ó ... lóhùn pé
  rationale: Èyí mú ìtumọ̀ ọ̀rọ̀ Gíríìkì tó túmọ̀ ní tààrà sí ‘ó dáhùn, ó sì wí’ jáde ní Yorùbá àdánidá; ‘Ṣùgbọ́n’ sì ṣàfihàn ìyípadà ọ̀rọ̀ tí δέ ń tọ́ka sí.
- source_word: τῷ λέγοντι αὐτῷ
  choice: ẹni tí ń bá a sọ̀rọ̀
  rationale: Ọ̀rọ̀ yìí pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì tọ́ka sí ẹni tí ń sọ̀rọ̀ sí Jésù láìfi kún ìtumọ̀ rẹ̀.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Ta ni ìyá mi
  rationale: Ìbéèrè yìí ń béèrè ẹni tí ìyá rẹ̀ jẹ́; ‘Ta ni’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé tí ó sì bá orísun mu.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: àwọn wo sì ni arákùnrin mi
  rationale: ‘Àwọn wo’ fi ọ̀pọ̀ ènìyàn tí τίνες ń tọ́ka sí hàn, ‘sì’ sì so ìbéèrè kejì mọ́ ti àkọ́kọ́. ‘Arákùnrin’ pa ìbátan akọ tí ἀδελφοί lò nínú àyíká yìí mọ́.
theological_decisions:
- issue: Bóyá kí a túmọ̀ ìbéèrè Jésù ní ọ̀nà tó ṣàlàyé ẹni tí a lè kà sí ìdílé rẹ̀
  choice: Pa ìbéèrè náà mọ́ ní tààrà láìfi àlàyé kún un
  alternative: Ta ni ó yẹ kí n kà sí ìyá mi, àwọn wo sì ni ó yẹ kí n kà sí arákùnrin mi?
  rationale: Ẹsẹ tó tẹ̀ lé e ló ń ṣàlàyé bí Jésù ṣe ń wo ìbátan; fífi ìtumọ̀ yẹn sínú ẹsẹ yìí yóò yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí orísun fi sílẹ̀.
- issue: Ìtumọ̀ akọ tàbí àkópọ̀ akọ àti abo fún ἀδελφοί
  choice: arákùnrin mi
  alternative: àwọn arákùnrin àti arábìnrin mi; àwọn ẹ̀gbọ́n-àbúrò mi
  rationale: Nínú ìṣẹ̀lẹ̀ yìí, ọ̀rọ̀ orísun jẹ́ ọ̀pọ̀ akọ, ó sì tọ́ka sí àwọn arákùnrin Jésù tí a mẹ́nu kàn nínú ìtàn náà; nítorí náà, a kò fẹ̀ ọ́ sí i láti ní abo pẹ̀lú.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe déédé, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye ni a lò. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìbéèrè àsọyé àti ìfojúsùn ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́.
