id: MAT.12.26
reference: Matthew 12:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: yo
  text: Bí Sátánì bá sì ń lé Sátánì jáde, ó ti pínyà sí ara rẹ̀; ǹjẹ́ báwo ni ìjọba rẹ̀ yóò ṣe dúró?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἰ
  choice: Bí ... bá sì
  rationale: Ó pa ìsopọ̀ καί mọ́ pẹ̀lú “sì,” ó sì lo ọ̀nà àdéhùn Yorùbá “bí ... bá” fún εἰ ní èdè àdánidá.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Sátánì
  rationale: Orúkọ ẹni náà ni a ṣe àfọwọ́kọ rẹ̀ gẹ́gẹ́ bí ìlò Yorùbá tí ó wọ́pọ̀, dípò títúmọ̀ rẹ̀ sí “Ọ̀tá.”
- source_word: ἐκβάλλει
  choice: ń lé ... jáde
  rationale: “Lé ... jáde” sọ ìṣe yíyọ tàbí lílé ẹ̀mí búburú jáde ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐφ’ ἑαυτὸν
  choice: sí ara rẹ̀
  rationale: Nínú àkópọ̀ pẹ̀lú “pínyà,” ọ̀rọ̀ yìí fi ìtakora inú ẹni fúnra rẹ̀ hàn lọ́nà Yorùbá tí ó bójú mu.
- source_word: ἐμερίσθη
  choice: ó ti pínyà
  rationale: A lo “ti pínyà” láti pa ìtumọ̀ aorist passive àti ipò tí ìṣe àròsọ náà yọrí sí mọ́; ìṣe aláìlórúkọ náà jẹ́ àdánidá ní Yorùbá.
- source_word: πῶς οὖν
  choice: ǹjẹ́ báwo ni ... ṣe
  rationale: “Ǹjẹ́” gbé agbára ìparí-èrò οὖν jáde, “báwo” sì dúró fún πῶς nínú ìbéèrè Yorùbá tí ó ṣe kedere.
- source_word: σταθήσεται
  choice: yóò ... dúró
  rationale: Ó pa àwòrán “dúró” mọ́, pẹ̀lú ìtumọ̀ pé kí ìjọba náà máa bá a lọ tàbí kí ó fìdí múlẹ̀.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: ìjọba rẹ̀
  rationale: “Ìjọba” lè tọ́ka sí agbègbè àṣẹ tàbí ìṣàkóso rẹ̀, ó sì bá àwòrán ìjọba tí ó pínyà mu.
theological_decisions:
- issue: Ìtọ́kasí àti agbára pípa Sátánì ya sí ara rẹ̀
  choice: 'A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí àríyànjiyàn tó fi àbájáde tí kò lè ṣeé gbà hàn: bí Sátánì bá ń lé Sátánì jáde, ó ti pínyà sí ara rẹ̀, ìjọba rẹ̀ kò sì lè dúró.'
  alternative: A lè ṣàlàyé rẹ̀ síwájú nípa fífi àwòrán “ilé tí ó pínyà” láti àyíká ẹsẹ náà sínú rẹ̀.
  rationale: Gíríìkì fúnra rẹ̀ sọ ọgbọ́n ìpínyà inú àti àìlèdúró ìjọba Sátánì láìfi àlàyé míràn kún un; a kò fi àwòrán tí kò sí nínú ẹsẹ náà wọ̀ ọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A yan ìṣètò “Bí ... bá sì” láti pa ìsopọ̀ ọgbọ́n mọ́, a sì lo “ǹjẹ́” fún ìparí-èrò οὖν. Kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí àwọn àṣàyàn míràn kò pọndandan fún pípa àìdánilójú pàtàkì kankan nínú orísun mọ́.
