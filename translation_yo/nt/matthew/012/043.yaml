id: MAT.12.43
reference: Matthew 12:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: yo
  text: Nígbà tí ẹ̀mí àìmọ́ bá jáde kúrò lára ẹni náà, ó ń gba àwọn ibi tí kò ní omi[a] kọjá, ó ń wá ìsinmi, kò sì rí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ibi gbígbẹ.” Ní tààràtà, Gíríìkì ní “àwọn ibi tí kò ní omi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Nígbà tí ... bá
  rationale: Àkójọpọ̀ yìí fi ipò àkókò gbogbogbò hàn. Ìlànà ‘nígbà tí ... bá’ jẹ́ èdè Yorùbá àdánidá fún irú ipò bẹ́ẹ̀; a kò fi δέ ṣe ọ̀rọ̀ atakò nítorí pé ó kàn ń so ọ̀rọ̀ tuntun mọ́ ohun tí ó ṣáájú.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: ẹ̀mí àìmọ́
  rationale: Ó pa ọ̀rọ̀ ‘ẹ̀mí’ mọ́ dípò yíyí i sí ‘ẹ̀mí èṣù,’ ó sì gbé ìtumọ̀ àìmọ́ nípa ìwẹ̀nùmọ́ tí ọ̀rọ̀ Gíríìkì ní jáde.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: bá jáde kúrò lára ẹni náà
  rationale: ‘Jáde kúrò lára’ sọ ìṣípò kúrò nínú ẹni náà ní Yorùbá àdánidá. ἄνθρωπος túmọ̀ sí ènìyàn ní gbogbogbò, nítorí náà ‘ẹni náà’ kò fi akọ tàbí abo kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: ó máa ń gba àwọn ibi tí kò ní omi kọjá
  rationale: ‘Máa ń’ fi ìṣe tí ó sábà máa ń ṣẹlẹ̀ hàn nínú àpẹẹrẹ gbogbogbò yìí. ‘Àwọn ibi tí kò ní omi’ pa àwòrán gidi ἀνύδρων mọ́, ju ‘ibi gbígbẹ’ tí ó túmọ̀ sí i lọ́nà fífẹ̀ díẹ̀.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: ó ń wá ìsinmi
  rationale: Ó fi ìṣe tí ń lọ papọ̀ pẹ̀lú ìrìn ẹ̀mí náà hàn, ó sì pa ìtumọ̀ ἀνάπαυσις gẹ́gẹ́ bí ìsinmi mọ́ láì sọ ọ́ di ibi ìsinmi.
- source_word: καὶ οὐχ εὑρίσκει
  choice: kò sì rí i
  rationale: ‘Sì’ so abala yìí mọ́ èyí tó ṣáájú, ‘i’ sì tọ́ka sí ìsinmi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, bí ó tilẹ̀ jẹ́ pé Gíríìkì fi ohun tí a ń wá sílẹ̀ láì tún un sọ.
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα nínú ọ̀rọ̀ nípa ìlépa ẹ̀mí búburú jáde
  choice: ẹ̀mí
  alternative: ẹ̀mí èṣù
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi hàn pé ẹ̀mí búburú ni, ọ̀rọ̀ orísun sọ πνεῦμα (‘ẹ̀mí’), kì í ṣe δαιμόνιον (‘ẹ̀mí èṣù’). Ìtumọ̀ yìí pa ọ̀rọ̀ orísun àti ìyàtọ̀ rẹ̀ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, àdánidá, tó sì ní iyì. A lo ‘ẹni náà’ fún ἄνθρωπος nítorí pé ọ̀rọ̀ Gíríìkì náà kò fi akọ tàbí abo ẹni náà múlẹ̀. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí àlàyé náà ń ṣàlàyé.
