id: MAT.12.18
reference: Matthew 12:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: yo
  text: “Wò ó, ìránṣẹ́ mi tí mo yàn, olùfẹ́ mi, ẹni tí ọkàn mi dùn sí. Èmi yóò fi Ẹ̀mí mi lé e lórí, òun yóò sì kéde òdodo fún àwọn orílẹ̀-èdè.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ àsọtẹ́lẹ̀ tí ń pe àfiyèsí mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: παῖς
  choice: ìránṣẹ́
  rationale: Nínú àyíká ọ̀rọ̀ Ìránṣẹ́ inú Aísáyà, ọ̀rọ̀ náà túmọ̀ sí ‘ìránṣẹ́,’ kì í ṣe ‘ọmọ’ lásán.
- source_word: ᾑρέτισα
  choice: tí mo yàn
  rationale: Ó fi ìṣe yíyan Ọlọ́run tí ó ti ṣẹlẹ̀ hàn ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: ὁ ἀγαπητός μου
  choice: olùfẹ́ mi
  rationale: Ó fi ìfẹ́ àti iyì tí ó wà nínú ἀγαπητός hàn láìfi ọ̀rọ̀ ìbátan míì kún un.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: ẹni tí ọkàn mi ní inú dídùn sí
  rationale: Ó pa ‘ọkàn mi’ gẹ́gẹ́ bí olùṣe inú Gíríìkì mọ́, ó sì sọ ìtẹ́lọ́rùn onífẹ̀ẹ́ ní èdè Yorùbá àdánidá.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Èmi yóò fi Ẹ̀mí mi lé e lórí
  rationale: Ó tẹ̀lé àwòrán fífi Ẹ̀mí Ọlọ́run lé ẹni náà lórí, èyí tí ó bá èdè ìránṣẹ́ àsọtẹ́lẹ̀ mu.
- source_word: κρίσιν
  choice: ìdájọ́ òdodo
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ ìdájọ́ àti òdodo tí κρίσις lè ní papọ̀, ní pàtàkì nínú iṣẹ́ Ìránṣẹ́ sí àwọn orílẹ̀-èdè.
- source_word: τοῖς ἔθνεσιν
  choice: fún àwọn orílẹ̀-èdè
  rationale: Ó fi ìwọ̀n àgbáyé ti iṣẹ́ náà hàn; ní àyíká yìí ἔθνη túbọ̀ túmọ̀ sí àwọn orílẹ̀-èdè ju ẹgbẹ́ ẹ̀sìn kan lọ.
- source_word: ἀπαγγελεῖ
  choice: yóò kéde
  rationale: ‘Kéde’ bá ìtumọ̀ ìpolongo gbangba àti ọ̀rọ̀ àsọtẹ́lẹ̀ mu.
theological_decisions:
- issue: Ìdánimọ̀ Mèsáyà gẹ́gẹ́ bí παῖς
  choice: A túmọ̀ παῖς sí ‘ìránṣẹ́.’
  alternative: ọmọ; ọmọkùnrin
  rationale: Àyọkà náà ń tọ́ka sí Ìránṣẹ́ inú Aísáyà. ‘Ìránṣẹ́’ pa ìsopọ̀ yẹn mọ́, kò sì fi ìtumọ̀ ìbátan tí ọ̀rọ̀ yìí kò fi hàn níbí kún un.
- issue: Ìtumọ̀ κρίσις nínú iṣẹ́ àsọtẹ́lẹ̀
  choice: A lo ‘ìdájọ́ òdodo’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ìdájọ́; òdodo
  rationale: Kí a má bàa yanjú àìdánilójú ọ̀rọ̀ Gíríìkì ní ọ̀nà kan ṣoṣo, ‘ìdájọ́ òdodo’ fi ìdájọ́ Ọlọ́run àti ìṣètò òdodo rẹ̀ hàn papọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ìrísí ọ̀rọ̀ àsọtẹ́lẹ̀ àti ìtẹnumọ́ ẹni tí ń sọ̀rọ̀ mọ́.
