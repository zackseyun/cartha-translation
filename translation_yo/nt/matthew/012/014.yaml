review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó ṣàfihàn jíjáde àwọn Farisí, ìgbìmọ̀ wọn lòdì sí Jesu, àti ìbéèrè ọ̀nà tí wọ́n lè fi pa á run. Àfikún “lọ” jẹ́ kí ἐξελθόντες hàn ní kíkún nínú Yorùbá láìfi ìtumọ̀ míì kún un.'
  naturalness: 'Gbólóhùn àkọ́kọ́ náà nílò ọ̀rọ̀-ìṣe tí ó hàn gbangba: “àwọn Farisí jáde” lè yé ẹni, ṣùgbọ́n “àwọn Farisí jáde lọ” dára síi fún Yorùbá boṣewa. Àlàyé ìsàlẹ̀ náà ní “mú un kú,” èyí tí kò wọ́pọ̀ tàbí rọrùn nínú Yorùbá òde òní.'
  terminology: “Àwọn Farisí,” “gbìmọ̀ pọ̀,” “lòdì sí i,” àti “pa á run” yẹ fún ìforúkọsílẹ̀ ìtàn mímọ́. “Pa á run” pa ìfara-ẹni-ẹsẹ̀ ἀπολέσωσιν mọ́; “pa á” ni àṣàyàn tó dára láti mẹ́nu kàn nínú àlàyé ìsàlẹ̀.
  issues:
  - severity: low
    issue: Ọ̀rọ̀-ìṣe jíjáde kò pé ní gbangba nínú gbolóhùn àkọ́kọ́.
    rationale: “Àwọn Farisí jáde” lè jẹ́ ìsọ̀rọ̀ kúkúrú, ṣùgbọ́n “àwọn Farisí jáde lọ” jẹ́ ìkọ̀wé boṣewa tó ṣe kedere, ó sì ń tú ἐξελθόντες dáadáa.
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ lo “mú un kú” gẹ́gẹ́ bí àṣàyàn fún ìṣe ikú.
    rationale: “Mú un kú” kò jẹ́ ọ̀nà àdánidá nínú Yorùbá fún “kill/put to death.” “Pa á” jẹ́ kedere, ó sì bójú mu nípasẹ̀ àlàyé pé “pa á run” lè ní ìtumọ̀ ikú nínú àyíká yìí.
  revised_text: Ṣùgbọ́n àwọn Farisí jáde lọ, wọ́n sì gbìmọ̀ pọ̀ lòdì sí i nípa bí wọ́n ṣe lè pa á run[a].
