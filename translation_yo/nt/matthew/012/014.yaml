id: MAT.12.14
reference: Matthew 12:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn Farisí jáde lọ, wọ́n sì gbìmọ̀ pọ̀ lòdì sí i nípa bí wọ́n ṣe lè pa á run[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pa á.” Ọ̀rọ̀ Gíríìkì náà ní “pa á run,” èyí tí ó lè túmọ̀ sí pípa ní ikú nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: jáde
  rationale: Ọ̀rọ̀-ìṣe alábápín aorist náà tọ́ka sí ìgbésẹ̀ tó ṣáájú ìgbìmọ̀ wọn; “jáde” sọ ọ́ ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ mú ìyípadà onírẹ̀lẹ̀ ṣùgbọ́n tó tako ìṣẹ̀lẹ̀ tó ṣáájú wá; “Ṣùgbọ́n” bá ìdáhùn ọ̀tá àwọn Farisí mu.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni àkọsílẹ̀ orúkọ ẹgbẹ́ Júù náà ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: συμβούλιον ἔλαβον
  choice: gbìmọ̀ pọ̀
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí gbígba ìmọ̀ràn; nínú àyíká ọ̀tá yìí, “gbìmọ̀ pọ̀” fi ìpinnu àṣírí wọn hàn láìfi ohun tí ẹsẹ̀ náà kò sọ kún un.
- source_word: κατ’ αὐτοῦ
  choice: lòdì sí i
  rationale: κατά pẹ̀lú genitive níbí ní agbára ìtakò; “lòdì sí i” fi ìṣọ̀tá náà hàn kedere.
- source_word: ὅπως
  choice: nípa bí wọ́n ṣe lè
  rationale: Ó ṣàfihàn ohun tí wọ́n ń gbìmọ̀ lé lórí àti ète wọn; gbólóhùn yìí jẹ́ Yorùbá àdánidá tó tún pa ìtumọ̀ ìwádìí ọ̀nà mọ́.
- source_word: ἀπολέσωσιν
  choice: pa á run
  rationale: ἀπόλλυμι lè túmọ̀ sí píparun tàbí pípa ní ikú. “Pa á run” pa fífẹ̀ ọ̀rọ̀ Gíríìkì náà mọ́, nígbà tí àyíká rẹ̀ ń fi ète ikú hàn.
theological_decisions:
- issue: Bí a ó ṣe sọ ἀπολέσωσιν ní pàtó tó
  choice: pa á run
  alternative: pa á; mú un kú
  rationale: Àyíká náà fi ète ọ̀tá tó ṣeé ṣe kí ó jẹ́ pípa ní ikú hàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà gbòòrò ju ọ̀rọ̀ tó túmọ̀ sí pípa ní ikú nìkan lọ. Nítorí náà, ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ gbígbòòrò náà mọ́, àlàyé ìsàlẹ̀ sì mẹ́nu kan àwọn ìtumọ̀ tó túbọ̀ ṣe pàtó.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀, tó bójú mu fún kíkà ní gbangba. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yan gbólóhùn tó yé òǹkàwé òde òní láìsọ ìtumọ̀ orísun di kékeré.
