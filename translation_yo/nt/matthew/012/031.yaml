id: MAT.12.31
reference: Matthew 12:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: yo
  text: Nítorí náà, mo sọ fún yín pé gbogbo ẹ̀ṣẹ̀ àti ọ̀rọ̀-òdì ni a ó dárí jì àwọn ènìyàn; ṣùgbọ́n ọ̀rọ̀-òdì sí Ẹ̀mí[a] ni a kò ní dárí jì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀mí Mímọ́.” Àyíká ọ̀rọ̀ fi hàn pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé ẹsẹ yìí fúnra rẹ̀ sọ pé “Ẹ̀mí” nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú; ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘nítorí ìdí yìí’.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín pé
  rationale: Ó pa ìtọ́kasí taara sí àwọn olùgbọ́ mọ́, ó sì bá ìlò Yorùbá òde òní mu.
- source_word: πᾶσα ἁμαρτία
  choice: gbogbo ẹ̀ṣẹ̀
  rationale: ‘Gbogbo’ níhìn-ín fi agbára ìpínkiri πᾶσα hàn lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: βλασφημία
  choice: ọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ àfojúdi sí ohun ti Ọlọ́run; gbolohun yìí ṣe kedere ju lílo ọ̀rọ̀ àyálò lọ.
- source_word: ἀφεθήσεται
  choice: ni a ó dárí jì
  rationale: Ọ̀rọ̀ náà jẹ́ ọjọ́ iwájú ní ohùn àìṣe, ó sì ní ìtumọ̀ ìdáríjì níhìn-ín. ‘A ó dárí jì’ pa ìgbékalẹ̀ yẹn mọ́.
- source_word: τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: Ó tọ́ka sí ènìyàn lápapọ̀, kì í ṣe akọ nìkan; ó sì jẹ́ àwọn tí a fún ní ìdáríjì.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: ṣùgbọ́n ọ̀rọ̀-òdì sí Ẹ̀mí
  rationale: A lóye genitive náà gẹ́gẹ́ bí ẹni tí ọ̀rọ̀-òdì náà dojú kọ. A kò fi ‘Mímọ́’ kún ẹsẹ yìí nítorí pé πνεύματος nìkan ni orísun náà ní, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí Ẹ̀mí Mímọ́.
theological_decisions:
- issue: Bóyá kí a túmọ̀ πνεύματος sí ‘Ẹ̀mí’ tàbí ‘Ẹ̀mí Mímọ́’ nínú ọ̀rọ̀ pàtàkì
  choice: Ẹ̀mí
  alternative: Ẹ̀mí Mímọ́
  rationale: Ẹsẹ yìí fúnra rẹ̀ ní τοῦ πνεύματος (‘Ẹ̀mí’) láìsí ἁγίου (‘Mímọ́’). Àyíká ọ̀rọ̀ mú kí ó ṣe kedere pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ pàtàkì pa ìṣísẹ̀ orísun náà mọ́, a sì fi àlàyé sí ìsàlẹ̀.
- issue: Ìbáṣepọ̀ genitive nínú τοῦ πνεύματος βλασφημία
  choice: ọ̀rọ̀-òdì sí Ẹ̀mí
  alternative: ọ̀rọ̀-òdì Ẹ̀mí
  rationale: Àyíká fi hàn pé Ẹ̀mí ni ẹni tí ọ̀rọ̀-òdì náà dojú kọ, kì í ṣe pé Ẹ̀mí ni ó ń sọ ọ̀rọ̀-òdì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì yẹ fún kíkà ní gbangba. ‘Ọ̀rọ̀-òdì sí Ọlọ́run’ ni a lò fún βλασφημία láti mú ìtumọ̀ ẹ̀gàn tàbí àfojúdi sí Ọlọ́run yé àwọn òǹkàwé lasán; nínú gbólóhùn kejì, ‘sí Ẹ̀mí’ fúnra rẹ̀ ti sọ ohun tí ọ̀rọ̀-òdì náà dojú kọ.
