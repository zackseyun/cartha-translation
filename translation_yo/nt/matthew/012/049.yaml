id: MAT.12.49
reference: Matthew 12:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: yo
  text: Ó sì na ọwọ́ rẹ̀ sí àwọn ọmọ-ẹ̀yìn rẹ̀, ó ní, “Wò ó, ìyá mi àti àwọn arákùnrin[a] mi nìwọ̀nyí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “àwọn arákùnrin”; ọ̀pọ̀ akọ ni a pa mọ́ níbí dípò fífẹ̀ ẹ́ sí “àwọn arákùnrin àti arábìnrin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: na
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ó bá ọ̀rọ̀-ìṣe pàtàkì lọ hàn; “na ọwọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfarahàn ọwọ́ sí ọ̀dọ̀ ẹnì kan.
- source_word: χεῖρα
  choice: ọwọ́
  rationale: Ìtumọ̀ rẹ̀ níbí ni ọwọ́, gẹ́gẹ́ bí ìfarahàn ara tí Jésù ṣe.
- source_word: ἐπὶ
  choice: sí
  rationale: Pẹ̀lú accusative nínú àyíká ìfarahàn yìí, ó tọ́ka sí ibi tí ọwọ́ náà dojú kọ; “sí” sọ ìtọ́sọ́nà náà ní Yorùbá àdánidá.
- source_word: μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìbáṣepọ̀ olùkọ́ àti akẹ́kọ̀ọ́ mọ́.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀rọ̀ náà jẹ́ ìpè láti fa àfiyèsí; “Wò ó” jẹ́ àdánidá, ó sì pa agbára ìtẹnumọ́ rẹ̀ mọ́.
- source_word: μήτηρ
  choice: ìyá
  rationale: Èyí ni ọ̀rọ̀ ìbátan Yorùbá tààrà fún “mother.”
- source_word: ἀδελφοί
  choice: àwọn arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀ akọ; “àwọn arákùnrin” pa ìfihàn akọ àti èdè ìbátan gidi inú gbólóhùn náà mọ́.
theological_decisions:
- issue: Èdè ìbátan nínú bí Jésù ṣe ń tún ìtumọ̀ ìdílé ṣe
  choice: Pa àwọn ọ̀rọ̀ ìbátan tààrà “ìyá” àti “àwọn arákùnrin” mọ́
  alternative: Lo ọ̀rọ̀ gbòòrò bí “ìdílé” tàbí “àwọn ẹ̀gbọ́n-àbúrò”
  rationale: Ẹsẹ̀ náà mọ̀ọ́mọ̀ lo àwọn ọ̀rọ̀ ìbátan pàtó láti fi àwọn ọmọ-ẹ̀yìn Jésù hàn gẹ́gẹ́ bí ìdílé rẹ̀. Ọ̀rọ̀ gbòòrò yóò dín agbára àsọyé náà kù, yóò sì fi ìtumọ̀ tí kò ṣe kedere nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá ṣùgbọ́n àdánidá. A lo “nìyí” láti sọ ìdánimọ̀ ẹni tí ó wà níwájú ní ọ̀nà Yorùbá tó ṣe kedere. Àmì àlàyé kan ṣoṣo ni a lò fún ἀδελφοί; “Wò ó” kò nílò àlàyé míì nítorí ó jẹ́ ìtumọ̀ àdánidá ti ἰδού.
