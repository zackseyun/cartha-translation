revisions:
- from: Sì kíyèsí i, ọkùnrin kan wà níbẹ̀ tí ọwọ́ rẹ̀ kan rọ. Wọ́n sì bi í pé, “Ó ha bófin mu láti mú ènìyàn láradá ní àwọn ọjọ́ Ìsinmi[a]?” Wọ́n béèrè èyí kí wọ́n lè fi ẹ̀sùn kàn án.
  to: Sì wò ó, ọkùnrin kan wà níbẹ̀ tí ọwọ́ rẹ̀ kan ti rẹ̀wẹ̀sì. Wọ́n sì bi í pé, “Ó ha bófin mu láti mú ènìyàn láradá ní àwọn ọjọ́ Sábáàtì[a]?” kí wọ́n lè fi ẹ̀sùn kàn án.
  rationale: Àtúnṣe náà ṣe “ἰδού” ní ọ̀nà Yorùbá tó rọrùn, ó ṣe ipo ọwọ́ ọkùnrin náà kedere láì sọ àìsàn pàtó, ó so ète bíbèèrè wọn mọ́ ìbéèrè náà gẹ́gẹ́ bí ἵνα ṣe hàn, ó sì lo “Sábáàtì” láti dá ìtọ́kasí orísun mọ́. Àlàyé ìsàlẹ̀ ṣì pa ìyàtọ̀ nọ́ńbà Gíríìkì àti ọ̀nà ẹyọ tí Yorùbá máa ń lò mọ́.
