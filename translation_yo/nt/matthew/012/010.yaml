  terminology: “Ó ha bófin mu” dára fún ἔξεστι nínú àyíká òfin ẹ̀sìn. “Àwọn ọjọ́ Sábáàtì” ń jẹ́ kí ìtọ́kasí sí σάββατα hàn kedere ju “àwọn ọjọ́ Ìsinmi,” tí ó lè túmọ̀ sí ọjọ́ ìsinmi èyíkéyìí. “Mú ènìyàn láradá” dára fún θεραπεύειν.
