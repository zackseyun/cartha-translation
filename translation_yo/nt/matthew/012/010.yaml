  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà: ọkùnrin tí ọwọ́ rẹ̀ ní àìlera, ìbéèrè nípa ohun tí òfin fàyè gba ní ọjọ́ Sábáàtì, àti ète láti fẹ̀sùn kan Jesu. Síbẹ̀, “ọwọ́ rẹ̀ kan rọ” kò fi ipo ξηράν hàn ní kedere tó; ó lè dà bí ọwọ́ kan lára ọwọ́ rẹ̀ tí ó rọ̀, dípò ọwọ́ tí ó rẹ̀wẹ̀sì. Àtúnṣe náà mú ìtumọ̀ náà sun mọ́ orísun láì sọ irú àìsàn pàtó di mímọ̀ ju bí Gíríìkì ṣe sọ lọ.'
