id: MAT.12.10
reference: Matthew 12:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: yo
  text: Sì wò ó, ọkùnrin kan wà níbẹ̀ tí ọwọ́ rẹ̀ kan ti rẹ̀wẹ̀sì. Wọ́n sì bi í pé, “Ó ha bófin mu láti mú ènìyàn láradá ní àwọn ọjọ́ Sábáàtì[a]?” kí wọ́n lè fi ẹ̀sùn kàn án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ lọ́nà tí ó wọ́pọ̀ ní Yorùbá pé, “ní ọjọ́ Sábáàtì.” Gíríìkì ní “ní àwọn ọjọ́ Sábáàtì,” ọ̀nà tí ó wọ́pọ̀ láti tọ́ka sí àwọn ọjọ́ Sábáàtì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa ipa ọ̀rọ̀ yìí mọ́ gẹ́gẹ́ bí ohun tí ń pe àfiyèsí sí ohun tuntun nínú ìtàn, láì fi ọ̀rọ̀ náà sílẹ̀.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí akọ ẹnì kọ̀ọ̀kan, kì í ṣe sí aráyé lápapọ̀.
- source_word: χεῖρα ἔχων ξηράν
  choice: tí ọwọ́ rẹ̀ kan rọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti ṣàpèjúwe ọwọ́ tí ó ti rẹ̀wẹ̀sì tàbí tí kò ṣiṣẹ́ dáadáa, láì pinnu àìsàn pàtó tí orísun kò sọ.
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: Wọ́n sì bi í pé
  rationale: Ìtumọ̀ yìí so ọ̀rọ̀-ìṣe àti gbólóhùn alábàápín pọ̀ lọ́nà àdánidá ní Yorùbá, láì fi ìkórìíra kún ọ̀rọ̀-ìṣe náà fúnra rẹ̀.
- source_word: ἔξεστι
  choice: Ó ha bófin mu
  rationale: Ìbéèrè náà jẹ mọ́ ohun tí òfin ẹ̀sìn fàyè gba, kì í ṣe ìyọ̀ǹda láwùjọ lásán.
- source_word: τοῖς σάββασιν
  choice: ní àwọn ọjọ́ Ìsinmi
  rationale: Àwọn ọjọ́ Ìsinmi pa nọ́ńbà púpọ̀ inú Gíríìkì mọ́, nígbà tí ‘ọjọ́ Ìsinmi’ jẹ́ ọ̀nà ẹyọ tó wọ́pọ̀ ní Yorùbá.
- source_word: θεραπεύειν
  choice: láti mú ènìyàn láradá
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún ìmúláradá ara nínú àyíká iṣẹ́ ìyanu.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: kí wọ́n lè fi ẹ̀sùn kàn án
  rationale: Ó pa ète tí ἵνα fi hàn mọ́, ó sì tún pa ìtumọ̀ ọ̀rọ̀ ẹjọ́ inú κατηγορέω mọ́.
theological_decisions:
- issue: Bí a ṣe máa tú ọ̀rọ̀ ọjọ́ Ìsinmi nínú àríyànjiyàn nípa òfin
  choice: ní àwọn ọjọ́ Ìsinmi
  alternative: ní ọjọ́ Ìsinmi
  rationale: Gíríìkì lo nọ́ńbà púpọ̀, τοῖς σάββασιν. A pa èyí mọ́ nínú ẹsẹ̀, ṣùgbọ́n a fi ọ̀nà ẹyọ tó jẹ́ àṣà èdè Yorùbá sínú àlàyé ìsàlẹ̀, kí a má bàa yanju ìyàtọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. ‘Sì kíyèsí i’ ní ìrísí díẹ̀ ti èdè ìtàn mímọ́, ṣùgbọ́n ó ṣì yé ènìyàn, ó sì pa ìpè sí àfiyèsí inú orísun mọ́.
