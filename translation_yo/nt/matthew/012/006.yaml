  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé ohun kan tí ó tóbi ju tẹ́ńpìlì náà lọ wà níhìn-ín[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnì kan tí ó tóbi ju tẹ́ńpìlì náà lọ wà níhìn-ín,” tàbí, “Ẹni tí ó tóbi ju tẹ́ńpìlì náà lọ wà níhìn-ín.” Gíríìkì lo ọ̀rọ̀ àfiwé irú àárín fún “tóbi ju,” ó sì fi ohun tàbí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí sílẹ̀ láìsọ ọ́ ní pàtó.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ní ibí yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ṣùgbọ́n mo sọ fún yín
  rationale: Àwọn ọ̀rọ̀ yìí jẹ́ ọ̀nà ìsọ̀rọ̀ tààrà sí àwùjọ. “Ṣùgbọ́n” fi ìyàtọ̀ pẹ̀lú àríyànjiyàn tó ṣáájú hàn láìsọ δέ di alátakò ju bó ṣe yẹ lọ.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ló ń ṣàgbékalẹ̀ ohun tí Jésù ń sọ ní Yorùbá lọ́nà tó ṣe kedere.
- source_word: τοῦ ἱεροῦ
  choice: ju tẹ́ńpìlì náà lọ
  rationale: ἱερόν sábà máa ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. “Tẹ́ńpìlì náà” jẹ́ ọ̀rọ̀ àdánidá tó sì pa ìdánimọ̀ ibi náà mọ́.
- source_word: μεῖζόν
  choice: ohun tí ó tóbi ju … lọ
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àfiwé ẹyọ kan ní irú àárín (neuter), tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ láìsọ ohun tó ń tọ́ka sí ní tààrà. “Ohun tí ó tóbi” pa àìsọ pàtó yẹn mọ́ dípò kí ó sọ ẹni náà ní kedere.
- source_word: ἐστιν
  choice: wà
  rationale: Nínú gbólóhùn ibi yìí, “wà” ni ọ̀nà Yorùbá àdánidá fún copula ìsinsìnyí.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó túmọ̀ sí “níhìn-ín” tàbí “ní ibí yìí”; “níhìn-ín” ṣe kúkúrú, ó sì jẹ́ àdánidá.
theological_decisions:
- issue: Ìdánimọ̀ ohun tàbí ẹni tí μεῖζόν, ọ̀rọ̀ àfiwé irú àárín, ń tọ́ka sí
  choice: A túmọ̀ ọ́ sí “ohun tí ó tóbi” láìdárúkọ Jésù tàbí sọ “ẹni” nínú ẹsẹ pàtàkì.
  alternative: “Ẹnì kan tí ó tóbi ju tẹ́ńpìlì náà lọ wà níhìn-ín” tàbí “ẹni tí ó tóbi ju tẹ́ńpìlì náà lọ wà níhìn-ín.”
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka gidigidi sí Jésù àti àṣẹ Mèsáyà rẹ̀, Gíríìkì lo irú àárín, kì í ṣe irú akọ. Ìtumọ̀ yìí pa àìsọ pàtó àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà rọrùn fún òǹkàwé gbogbogbò, ṣùgbọ́n ó pa àìsọ pàtó inú Gíríìkì mọ́. Gbogbo àmì àlàyé ìsàlẹ̀ [a] àti [b] farahàn nínú ẹsẹ pàtàkì.
