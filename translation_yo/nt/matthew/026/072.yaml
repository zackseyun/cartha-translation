  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: yo
  text: Ó sì tún fi ìbúra sẹ́ pé, “Èmi kò mọ̀ ọkùnrin náà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: “Sì” pa ìsopọ̀ ìtàn tó rọrùn mọ́ láìfi ìtumọ̀ àkókò míì kún un; “ó” mú ẹni tí a ń sọ̀rọ̀ rẹ̀ hàn ní Yorùbá.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Pétérù tún ṣe ìsẹ́ náà lẹ́ẹ̀kan sí i.
- source_word: ἠρνήσατο
  choice: sẹ́ ẹ̀
  rationale: “Sẹ́” ni ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ kíkọ ohun kan tàbí ọ̀rọ̀ kan ní ọ̀. A fi arọ́pò-orúkọ “ẹ̀” kún un fún ìṣàn èdè Yorùbá, nígbà tí gbólóhùn tó tẹ̀ lé e ń sọ ohun tí ó sẹ́; àkọsílẹ̀ ìsàlẹ̀ fi yíyan tí kò ní ohun ìṣe hàn.
- source_word: μετὰ ὅρκου
  choice: pẹ̀lú ìbúra
  rationale: Ó túmọ̀ ìbúra tó bá ìsẹ́ náà rìn, láìdámọ̀ràn pé ó wà ní ilé ẹjọ́ tàbí lábẹ́ ìlànà ìbúra ọlọ́fíṣì.
- source_word: ὅτι
  choice: pé,
  rationale: “Pé” ṣí ọ̀rọ̀ tí Pétérù fi sẹ́ sílẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: Οὐκ οἶδα
  choice: Èmi kò mọ
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún gbólóhùn ìkọ̀mọ̀; lílo “Èmi” mú ìtẹnumọ́ ọ̀rọ̀ Pétérù jáde lọ́nà àdánidá.
- source_word: τὸν ἄνθρωπον
  choice: ọkùnrin náà
  rationale: Nínú àyíká yìí, ἄνθρωπος ń tọ́ka sí ọkùnrin kan pàtó. “Ọkùnrin náà” pa ọ̀nà jíjìnnà tí Pétérù fi ń tọ́ka sí Jésù mọ́, dípò fífi orúkọ Jésù sínú ọ̀rọ̀ náà.
theological_decisions:
- issue: Ẹni tí “ọkùnrin náà” ń tọ́ka sí nínú ìsẹ́ Pétérù
  choice: Pa gbólóhùn “ọkùnrin náà” mọ́.
  alternative: “òun” tàbí “Jésù”
  rationale: Gíríìkì sọ “ọkùnrin náà” ní kedere. Èyí ń pa ọ̀nà tí Pétérù fi ń ya ara rẹ̀ sọ́tọ̀ kúrò lọ́dọ̀ Jésù mọ́; fífi “Jésù” rọ́pò rẹ̀ yóò túmọ̀ ohun tí ọ̀rọ̀ náà mọ̀ọ́mọ̀ fi sílẹ̀ lọ́nà yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àmì ohùn wà níbi tí ó bá yẹ; gbólóhùn náà pa ìṣàn ìtàn àti líle ìbúra Pétérù mọ́.
