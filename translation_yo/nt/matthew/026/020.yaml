  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: yo
  text: Nígbà tí ó di alẹ́, ó jókòó rọgbọ̀ níbi oúnjẹ pẹ̀lú àwọn ọmọ-ẹ̀yìn méjìlá náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kàn ní ‘pẹ̀lú àwọn méjìlá náà’ dípò ‘pẹ̀lú àwọn ọmọ-ẹ̀yìn méjìlá náà.’
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Nígbà tí ó di alẹ́
  rationale: Gbólóhùn olómìnira inú ọ̀ràn-ìní yìí fi àkókò ìṣẹ̀lẹ̀ hàn. Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé alẹ́ ti dé.
- source_word: ἀνέκειτο
  choice: ó jókòó rọgbọ̀ síbi oúnjẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjẹun ní ìgbọ̀nsẹ̀ ìgbàanì nípa rírọgbọ̀, kì í ṣe jíjókòó lásán. ‘Síbi oúnjẹ’ mú àyíká àsè náà ṣe kedere láìyí ìtumọ̀ padà.
- source_word: μετὰ
  choice: pẹ̀lú
  rationale: Pẹ̀lú ọ̀ràn-ìní, μετά túmọ̀ sí wíwà papọ̀ tàbí ‘pẹ̀lú’; ọ̀rọ̀ Yorùbá yìí bá a mu ní tààrà.
- source_word: τῶν δώδεκα μαθητῶν
  choice: àwọn ọmọ-ẹ̀yìn méjìlá náà
  rationale: μαθητῶν wà nínú SBLGNT, nítorí náà a túmọ̀ ọ́ sí ‘àwọn ọmọ-ẹ̀yìn’; ‘méjìlá náà’ sì tọ́ka sí ẹgbẹ́ tí a mọ̀ dáadáa.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó lọ́lá, ó sì ṣe kedere fún òǹkàwé lásán. ‘Jókòó rọgbọ̀’ ṣàfihàn ìdúró ara níbi àsè ìgbàanì láìfi hàn pé ó dùbúlẹ̀ lásán.
