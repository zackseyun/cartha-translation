review_pass:
  verdict: revise
  source_fidelity: The temporal clause, meal-reclining sense, and explicit reference to the twelve disciples all correspond to the SBLGNT. The textual-variant footnote correctly identifies the omission of μαθητῶν in some manuscripts.
  naturalness: ‘Jókòó rọgbọ̀’ can communicate the ancient meal posture, but ‘síbi oúnjẹ’ normally has directional force (‘to/toward the place of food’). A locative expression is needed for the setting of the meal.
  terminology: ‘Àwọn ọmọ-ẹ̀yìn méjìlá náà’ accurately renders τῶν δώδεκα μαθητῶν and appropriately preserves ‘disciples,’ rather than reducing it to ‘the twelve.’
  issues:
