  to: Nígbà náà, ó bẹ̀rẹ̀ sí í pe èébú wá, ó sì búra pé, “Èmi kò mọ ọkùnrin náà.” Lẹ́sẹ̀kẹsẹ̀ ni àkùkọ kan kọ.
  rationale: Àtúnṣe náà ṣàtúnṣe ọ̀rọ̀ tí kò péye nínú àlàyé ìsàlẹ̀, níbi tí ‘ìkọ̀ rẹ̀’ ti yẹ dípò ‘ìsẹ́ rẹ̀.’ Ó tún jẹ́ kí gbolohun àkùkọ náà dun ní ọ̀nà Yorùbá tó rọrùn. Ìtumọ̀ pàtàkì ṣì dá àìdájú Gíríìkì sílẹ̀ nípa ẹni tí èébú náà kàn; ìfẹ̀hàn pé ó lè jẹ́ èébú sórí ara Peteru wà nínú àlàyé ìsàlẹ̀ nìkan.
