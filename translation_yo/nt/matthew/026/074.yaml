language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: yo
  text: Nígbà náà, ó bẹ̀rẹ̀ sí í pe èébú wá, ó sì búra pé, “Èmi kò mọ ọkùnrin náà.” Lẹ́sẹ̀kẹsẹ̀ ni àkùkọ kan kọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú ìtàn náà.
- source_word: ἤρξατο
  choice: ó bẹ̀rẹ̀ sí í
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ mọ́, ó sì fi bí ìkọ̀sẹ̀ Peteru ṣe le sí i hàn.
- source_word: καταθεματίζειν
  choice: pe èébú wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípe èébú tàbí ègún wá, kì í ṣe sísọ ọ̀rọ̀ àfojúdi lásán; a kò sọ ẹni tí èébú náà kàn ní pàtó nínú àyọkà pàtàkì.
- source_word: ὀμνύειν
  choice: búra
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ìbúra fìdí ọ̀rọ̀ kan múlẹ̀.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣe àgbékalẹ̀ ohun tí Peteru sọ nínú ìbúra rẹ̀.
- source_word: Οὐκ οἶδα
  choice: Èmi kò mọ
  rationale: Ó túmọ̀ gbólóhùn ìsẹ́ náà ní tààrà, pẹ̀lú ‘Èmi’ láti fi ìtẹnumọ́ ìkọ̀ náà hàn.
- source_word: τὸν ἄνθρωπον
  choice: ọkùnrin náà
  rationale: Ó tọ́ka sí ọkùnrin pàtó náà, ìyẹn Jesu, láìfi ‘yìí’ kún ọ̀rọ̀ Gíríìkì.
- source_word: καὶ εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀, … sì
  rationale: Ó pa ìyára ìṣẹ̀lẹ̀ náà àti ìsopọ̀ rẹ̀ mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: ἀλέκτωρ
  choice: àkùkọ kan
  rationale: Orúkọ náà kò ní atọ́ka pàtó nínú Gíríìkì; ‘àkùkọ kan’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐφώνησεν
  choice: kọ
  rationale: ‘Kọ’ ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún igbe àkùkọ.
theological_decisions:
- issue: Ìtumọ̀ καταθεματίζειν nínú ìsẹ́ Peteru
  choice: A túmọ̀ rẹ̀ sí ‘pe èébú wá,’ a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé ó ṣeé ṣe kó jẹ́ èébú tí ó pe sórí ara rẹ̀.
  alternative: Kí a sọ ní pàtó pé Peteru fi ara rẹ̀ gégùn-ún, tàbí pé ó bú Jesu.
  rationale: Nítorí pé ọ̀rọ̀ náà wà lẹ́gbẹ̀ẹ́ ‘búra,’ ó ṣeé ṣe gan-an pé Peteru ń pe èébú sórí ara rẹ̀ láti fi mú ìsẹ́ rẹ̀ le. Síbẹ̀, Gíríìkì kò sọ ẹni tí èébú náà kàn ní tààrà, nítorí náà àyọkà pàtàkì kò yẹ kí ó yanjú àìdájú náà láìsí àlàyé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Pe èébú wá’ yẹra fún ìtumọ̀ pé Peteru kan ń sọ ọ̀rọ̀ àfojúdi, ó sì tún pa àìdájú ẹni tí èébú náà kàn mọ́.
