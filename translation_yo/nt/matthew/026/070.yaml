review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ Gíríìkì náà dáadáa: ìsẹ́ Pétérù wà ní gbangba, ó sì sọ pé kò mọ ohun tí ẹni náà ń sọ. Ṣùgbọ́n, kí a lè ṣàfihàn participle λέγων ní Yorùbá lọ́nà tí ó mọ́, a yẹ kí a yà ìsẹ́ náà sí gbolohun “ó ní,” dípò kí “pé” kan tẹ̀ lé “ó sẹ́.”'
  naturalness: “Ṣùgbọ́n ó sẹ̀ níwájú gbogbo wọn, ó ní, …” jẹ́ Yorùbá boṣewa tó rọrùn, ó sì ṣàlàyé ìbáṣepọ̀ ìsọ̀rọ̀ náà ní ti ara. Àmì ohùn “mọ̀” yẹ kí ó jẹ́ pípé.
  terminology: “sẹ̀,” “níwájú gbogbo wọn,” àti “ohun tí o ń sọ” bá ọ̀rọ̀ orísun mu, wọ́n sì jẹ́ ọ̀rọ̀ Yorùbá ti ìforúkọsílẹ̀ ìtàn ọlọ́wọ̀. A kò sọ ohun tí ó sẹ́ di pàtó ju bí Gíríìkì ṣe fi sílẹ̀.
  issues:
