  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sẹ̀ níwájú gbogbo wọn, ó ní, “N kò mọ̀ ohun tí o ń sọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ó sẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé Pétérù sẹ́ ẹ̀sùn tí ọmọbìnrin náà ṣẹ̀ṣẹ̀ fi kàn án. A kò fi ohun tí ó sẹ́ kún un ní pàtó, nítorí Gíríìkì náà kò sọ ọ́ ní pàtó, Yorùbá sì lè lo ‘sẹ́’ lọ́nà yìí.
- source_word: ἔμπροσθεν πάντων
  choice: níwájú gbogbo wọn
  rationale: Ó fi hàn pé ìsẹ́ náà ṣẹlẹ̀ ní gbangba, níwájú gbogbo àwọn tí ó wà níbẹ̀.
- source_word: λέγων
  choice: pé
  rationale: Nínú Yorùbá àdánidá, ‘pé’ ni a fi ń ṣí ọ̀rọ̀ tí ẹni kan sọ lẹ́yìn irú ọ̀rọ̀-ìṣe yìí; ó mú ìṣàn gbólóhùn náà rọrùn láìyí ìtumọ̀ rẹ̀ padà.
- source_word: Οὐκ οἶδα
  choice: N kò mọ
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀-ìṣe tí a sẹ́; kò fi ìtumọ̀ míì kún un.
- source_word: τί λέγεις
  choice: ohun tí o ń sọ
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì jẹ́ Yorùbá àdánidá nínú àyíká yìí.
theological_decisions:
- issue: Irú ohun tí Pétérù sẹ́
  choice: A fi ọ̀rọ̀ náà sílẹ̀ láìdarúkọ ohun tí ó sẹ́ ní pàtó, bí Gíríìkì ṣe ṣe.
  alternative: Kí a sọ pé Pétérù sẹ́ Jésù ní tààrà, tàbí pé ó sẹ́ pé òun mọ ọmọbìnrin náà.
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ‘ó sẹ́’ gẹ́gẹ́ bí ìdáhùn sí ẹ̀sùn tó ṣáájú, ṣùgbọ́n kò sọ ohun tí ó sẹ́ ní pàtó. Ìtumọ̀ náà kò gbọ́dọ̀ yan ohun tí ọ̀rọ̀ náà fúnra rẹ̀ kò yan.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì. A lo àmì ohùn níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú orísun.
