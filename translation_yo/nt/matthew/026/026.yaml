reference: Matthew 26:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: yo
  text: Bí wọ́n ti ń jẹun[a], Jésù mú búrẹ́dì, lẹ́yìn tí ó bù kún un[b], ó bù ú, ó sì fi fún àwọn ọmọ-ẹ̀yìn, ó sì wí pé, “Ẹ mú, ẹ jẹ[c]; èyí ni ara mi.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí wọ́n ń jẹun.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “lẹ́yìn tí ó bù kún un”; àwọn kan lóye ìṣe náà gẹ́gẹ́ bí dídúpẹ́ lórí búrẹ́dì.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ẹ mú kí ẹ sì jẹ.”
    reason: lexical_alternative
  - marker: d
    text: Ní tààrà, Gíríìkì ní, “èyí ni ara mi.” Àwọn kan túmọ̀ èyí sí “èyí túmọ̀ sí” tàbí “èyí dúró fún ara mi,” ṣùgbọ́n ìtumọ̀ yìí pa ọ̀rọ̀ orísun mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Bí wọ́n ti ń jẹun
  rationale: Gbólóhùn olódì gẹ́gẹ́ bí genitive absolute ń fi àkókò ìṣẹ̀lẹ̀ hàn. Èyí jẹ́ Yorùbá àdánidá fún ohun tí ń lọ lọ́wọ́ nígbà tí ìṣẹ̀lẹ̀ mìíràn bẹ̀rẹ̀; δέ kò ní agbára ìtakò pàtàkì níbí.
- source_word: λαβὼν
  choice: mú
  rationale: Aorist participle náà ṣáájú ìṣe pàtàkì; lílo ọ̀rọ̀-ìṣe Yorùbá ní tẹ̀lé-tẹ̀lé mú ìtàn náà dùn létí láìsọ ìtumọ̀ rẹ̀ nù.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: ἄρτος túmọ̀ sí búrẹ́dì, ó sì lè tọ́ka sí odidi búrẹ́dì kan. ‘Búrẹ́dì’ ṣe kedere sí òǹkàwé Yorùbá òde òní, ó sì yẹra fún ìtumọ̀ ‘àkàrà’ gẹ́gẹ́ bí oúnjẹ ẹ̀wà tí a din.
- source_word: εὐλογήσας
  choice: ó sì súre
  rationale: εὐλογέω ní àyíká oúnjẹ yìí ń tọ́ka sí sísọ ìbùkún. Nítorí pé ohun tí a súre sí kò hàn gbangba nínú Gíríìkì, a kò fi ọ̀rọ̀ àfikún sínú àyọkà pàtàkì.
- source_word: ἔκλασεν
  choice: ó bù ú
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí fífọ́ tàbí bíbu búrẹ́dì; arọ́pò-orúkọ ‘ú’ tọ́ka padà sí búrẹ́dì ní Yorùbá àdánidá.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: ó fi fún àwọn ọmọ-ẹ̀yìn
  rationale: A ṣe participle náà bí ọ̀rọ̀-ìṣe mìíràn nínú ìtẹ̀lé ìṣe. Àpilẹ̀kọ Gíríìkì ń tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn tí a ti mọ̀; kò pọn dandan láti fi ‘rẹ̀’ kún un.
- source_word: Λάβετε φάγετε
  choice: Ẹ gbà, ẹ jẹ
  rationale: Àwọn aorist imperative méjèèjì wà ní tẹ̀lé-tẹ̀lé láìsí àsopọ̀; àmì kọ́má pa ìlànà àti agbára ọ̀rọ̀ orísun mọ́.
- source_word: τοῦτό ἐστιν
  choice: èyí ni
  rationale: ἐστιν jẹ́ copula tó túmọ̀ ní tààrà sí ‘ni’ ní Yorùbá. A kò yí i sí ‘èyí dúró fún’ tàbí ‘èyí túmọ̀ sí’.
- source_word: τὸ σῶμά μου
  choice: ara mi
  rationale: σῶμα jẹ́ ọ̀rọ̀ tó wọ́pọ̀ fún ‘ara’; ohun-ìní μου sì jẹ́ ‘mi’ ní tààrà.
theological_decisions:
- issue: Ọ̀rọ̀ Jésù nípa búrẹ́dì nínú Oúnjẹ Alẹ́ Olúwa
  choice: “Èyí ni ara mi”
  alternative: “Èyí túmọ̀ sí ara mi” tàbí “Èyí dúró fún ara mi”
  rationale: Gíríìkì lo copula ἐστιν ní tààrà. Ìtumọ̀ náà pa ọ̀rọ̀ orísun àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà nínú rẹ̀ mọ́, láìfi èrò ẹ̀ya ìjọ kan sí i.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere, tó sì jẹ́ ti òde òní ni a lò. A yan ‘búrẹ́dì’ dípò ‘àkàrà’ nítorí pé ‘àkàrà’ sábà máa ń túmọ̀ sí oúnjẹ ẹ̀wà tí a din fún òǹkàwé Yorùbá òde òní. Ìtẹ̀lé ọ̀rọ̀-ìṣe kúkúrú—mú, súre, bù, fi fún—bá ìtàn Yorùbá mu, ó sì pa ìtẹ̀lé ìṣe Gíríìkì mọ́.
