    rationale: Λάβετε níbí jẹ́ àṣẹ láti mú/take búrẹ́dì náà. Ní Yorùbá, “Ẹ mú” ló bá ipa yìí mu dáadáa; “Ẹ gbà” sábà ń ní ìtumọ̀ receive/accept.
