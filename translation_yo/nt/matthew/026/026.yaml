  to: Bí wọ́n ti ń jẹun[a], Jésù mú búrẹ́dì, lẹ́yìn tí ó bù kún un[b], ó bù ú, ó sì fi fún àwọn ọmọ-ẹ̀yìn, ó sì wí pé, “Ẹ mú, ẹ jẹ[c]; èyí ni ara mi.”[d]
  rationale: A rọ́pò “súre” pẹ̀lú “bù kún un” láti mú εὐλογήσας hàn ní tààrà, a sì rọ́pò “Ẹ gbà” pẹ̀lú “Ẹ mú” láti fi Λάβετε hàn ní ìlò Yorùbá àdánidá. Àwọn ìyókù pa ìtẹ̀lé ìṣe, ìforúkọsílẹ̀, àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́.
