revisions:
- from: Ṣùgbọ́n mo sọ fún yín pé, láti ìsinsin yìí lọ, èmi kì yóò mu nínú èso àjàrà yìí rárá títí di ọjọ́ náà, nígbà tí èmi yóò bá yín mu ún ní ọ̀tun[a] nínú ìjọba Baba mi.
  to: Ṣùgbọ́n mo sọ fún yín pé, láti ìsinsin yìí lọ, èmi kì yóò mú nínú èso àjàrà yìí rárá títí di ọjọ́ náà, nígbà tí mo bá mú un pẹ̀lú yín ní ọ̀nà tuntun nínú ìjọba Baba mi.
  rationale: A safe correction is required because “ní ọ̀tun” mistranslates καινόν. “Ní ọ̀nà tuntun” naturally expresses the adverbial force in Yoruba while the footnote retains the viable alternative sense “anew.” The revised wording otherwise preserves the source text’s emphasis, temporal sequence, and deliberate ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains the future-oriented emphatic negation, the idiom “fruit of the vine,” the definite future day, shared drinking with the disciples, and the kingdom of Jesus’ Father. However, “ní ọ̀tun” means “on the right/right-hand side” in standard Yoruba and does not render Greek καινόν (“new”; possibly “anew/in a new way”).
  naturalness: Most of the sentence is readable Standard Yoruba. Recasting the future temporal clause as “nígbà tí mo bá mú un” is natural, and “ní ọ̀nà tuntun” gives a clear Yoruba adverbial rendering of the accusative καινόν.
  terminology: “Èso àjàrà,” “ìjọba Baba mi,” and the emphatic “kì yóò mú ... rárá” are suitable. The correction replaces the semantically erroneous “ní ọ̀tun” with “ní ọ̀nà tuntun.”
  issues:
  - severity: high
    issue: “ní ọ̀tun” is used for καινόν.
    rationale: In Yoruba, ọ̀tun denotes “right” (as opposed to left), not “new.” This changes the verse’s meaning and must be corrected.
  - severity: low
    issue: The explanatory footnote’s first alternative needs to distinguish “anew” from the main rendering more directly.
    rationale: A footnote should preserve the lexical ambiguity of καινόν without suggesting that “ní ọ̀tun” is a valid Yoruba expression for it.
  revised_text: Ṣùgbọ́n mo sọ fún yín pé, láti ìsinsin yìí lọ, èmi kì yóò mú nínú èso àjàrà yìí rárá títí di ọjọ́ náà, nígbà tí mo bá mú un pẹ̀lú yín ní ọ̀nà tuntun nínú ìjọba Baba mi.
  revised_footnotes:
  - marker: a
    text: Tàbí, “lẹ́ẹ̀kan sí i.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tuntun ní irú tàbí ní ànímọ́; gbólóhùn náà sì lè fi hàn pé yóò mú un ní ọ̀nà tuntun nínú ìjọba tí ń bọ̀.
    reason: lexical_alternative
  revision_rationale: A safe correction is required because “ní ọ̀tun” mistranslates καινόν. “Ní ọ̀nà tuntun” naturally expresses the adverbial force in Yoruba while the footnote retains the viable alternative sense “anew.” The revised wording otherwise preserves the source text’s emphasis, temporal sequence, and deliberate ambiguity.
