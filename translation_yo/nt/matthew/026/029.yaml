id: MAT.26.29
reference: Matthew 26:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé, láti ìsinsin yìí lọ, èmi kì yóò mú nínú èso àjàrà yìí rárá títí di ọjọ́ náà, nígbà tí mo bá mú un pẹ̀lú yín ní ọ̀nà tuntun nínú ìjọba Baba mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ṣùgbọ́n mo sọ fún yín pé
  rationale: “Ṣùgbọ́n” fi ìyípadà ọ̀rọ̀ tí δέ mú wá hàn láìsọ ìtakora náà di líle jù; “mo sọ fún yín pé” jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: οὐ μὴ πίω
  choice: èmi kì yóò mu ... rárá
  rationale: Àpapọ̀ “kì yóò” àti “rárá” fi ìkọ̀ ọjọ́ iwájú tí ó lágbára nínú οὐ μή hàn ní Yorùbá òde òní.
- source_word: ἀπ’ ἄρτι
  choice: láti ìsinsin yìí lọ
  rationale: Ó tọ́ka sí ìbẹ̀rẹ̀ láti àkókò yìí títí lọ.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: nínú èso àjàrà yìí
  rationale: Ó pa àwòrán àti ọ̀rọ̀ ìpilẹ̀ “èso àjàrà” mọ́ dípò yíyí i padà sí “wáìnì,” bí ó tilẹ̀ jẹ́ pé ohun inú ife ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: títí di ọjọ́ náà
  rationale: “Náà” pa ìtọ́kasí sí ọjọ́ ọ̀la pàtó tí ἐκείνης ní mọ́.
- source_word: ὅταν αὐτὸ πίνω
  choice: nígbà tí èmi yóò ... mu ún
  rationale: Ó sọ ìṣẹ̀lẹ̀ ọjọ́ iwájú tí ὅταν pẹ̀lú subjunctive tọ́ka sí; “ún” tún tọ́ka sí ohun tí a ń mu.
- source_word: μεθ’ ὑμῶν
  choice: bá yín mu
  rationale: Ìṣètò ọ̀rọ̀ “bá yín mu” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ mímu ohun kan pọ̀ pẹ̀lú àwọn ẹlòmíràn.
- source_word: καινὸν
  choice: ní ọ̀tun
  rationale: “Ní ọ̀tun” jẹ́ gbólóhùn kúkúrú tí ó lè tọ́ka sí mímu ún ní ipò tuntun tàbí ní ọ̀nà tuntun, láìfi dandan sọ pé èso àjàrà tuntun ni.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: nínú ìjọba Baba mi
  rationale: Ó tẹ̀lé ìtumọ̀ àti ọlá inú ọ̀rọ̀ Gíríìkì, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Bóyá kí a sọ ohun inú ife náà ní “wáìnì” ní tààràtà tàbí kí a pa àkànlò “èso àjàrà” mọ́
  choice: A pa “èso àjàrà” mọ́ nínú ọ̀rọ̀ náà.
  alternative: wáìnì
  rationale: Gíríìkì sọ “èso/ohun tí àjàrà mú jáde,” kì í ṣe οἶνος. Èyí pa ọ̀rọ̀ orísun mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- issue: Ìtumọ̀ καινὸν nínú àsè ìjọba ọjọ́ iwájú
  choice: ní ọ̀tun
  alternative: ní ọ̀nà tuntun; lẹ́ẹ̀kan sí i
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí tuntun ní irú tàbí ànímọ́, ó sì tún lè ní ìtumọ̀ “lẹ́ẹ̀kan sí i” nínú àyíká yìí. A kò yan ọ̀kan ṣoṣo lára àwọn ìtumọ̀ wọ̀nyí gẹ́gẹ́ bí èyí tí ó dájú.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ní ọ̀tun” ní ìfọwọ́ kan pẹ̀lú èdè Bíbélì àtọwọ́dọ́wọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé mú ìtumọ̀ rẹ̀ ṣe kedere láìyanju àìdánilójú orísun.
