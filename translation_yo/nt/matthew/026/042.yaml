id: MAT.26.42
reference: Matthew 26:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: yo
  text: Ó tún lọ lẹ́ẹ̀kejì, ó sì gbàdúrà pé, “Baba mi, bí èyí kò bá lè kọjá láìjẹ́ pé mo mú un,[a] kí ìfẹ́ rẹ ṣẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Èyí” àti “un” tọ́ka sí ago ìjìyà tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; Gíríìkì ẹsẹ yìí sọ “èyí” àti “òun” nìkan.
    reason: cross_reference
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Ó tún lọ lẹ́ẹ̀kejì
  rationale: “Tún” àti “lẹ́ẹ̀kejì” pa ìtumọ̀ àtúnsọ àti ìgbà kejì mọ́, bí ó tilẹ̀ jẹ́ pé wọn sún mọ́ ara wọn gẹ́gẹ́ bí nínú Gíríìkì.
- source_word: ἀπελθὼν προσηύξατο
  choice: ó lọ ... ó sì gbàdúrà
  rationale: A tú participle aorist àti ọ̀rọ̀-ìṣe pàtàkì sí ọ̀rọ̀-ìṣe méjì tó bá ìtàn Yorùbá mu.
- source_word: Πάτερ μου
  choice: Baba mi
  rationale: Ó jẹ́ àdúrà ìpè taara tó sì pa ìbáṣepọ̀ Ọmọ sí Baba mọ́.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: bí èyí kò bá lè kọjá
  rationale: Ó pa “èyí” tí Gíríìkì lò mọ́, kò sì fi “ago” kún ẹsẹ yìí.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: láìjẹ́ pé mo mu ún
  rationale: Ó sọ ààyè ìyọkúrò “àfi bí mo bá mu ún” ní Yorùbá adayeba, “ún” sì tọ́ka padà sí “èyí.”
- source_word: γενηθήτω τὸ θέλημά σου
  choice: ìfẹ́ rẹ ni kí ó ṣẹ
  rationale: Ó pa agbára àṣẹ/ẹ̀bẹ̀ inú γενηθήτω àti ìtẹríba sí ìfẹ́ Ọlọ́run mọ́; “ṣẹ” tún bá ọ̀rọ̀ àdúrà Mátíù 6:10 mu.
theological_decisions:
- issue: Bóyá kí a sọ “ago” ní pàtó fún τοῦτο / αὐτό
  choice: Pa “èyí” àti “ún” mọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: “ago yìí” àti “ó”
  rationale: Àyíká Mátíù 26:39 fi hàn pé ago ìjìyà ni, ṣùgbọ́n ẹsẹ 42 fúnra rẹ̀ kò tún ποτήριον (“ago”) sọ. Àlàyé ìsàlẹ̀ ni ó ṣàlàyé atọ́ka náà láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- issue: Bí a ṣe tú àdúrà ìtẹríba Jesu
  choice: ìfẹ́ rẹ ni kí ó ṣẹ
  alternative: jẹ́ kí ìfẹ́ rẹ ṣẹ
  rationale: Ìtúmọ̀ yìí pa agbára ìfẹ́kúfẹ̀ẹ́/àṣẹ inú Gíríìkì mọ́, ó sì yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ adayeba àti ọ̀wọ̀; a lo àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn náà pa ìtẹ̀sí Gíríìkì mọ́ ṣùgbọ́n ó ṣètò participle náà gẹ́gẹ́ bí ọ̀rọ̀-ìṣe Yorùbá tó rọrùn.
