id: MAT.26.61
reference: Matthew 26:61
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: yo
  text: Wọ́n wí pé, “Ọkùnrin yìí sọ pé, ‘Mo lè wó tẹ́mpìlì Ọlọ́run[b], kí n sì kọ́ ọ láàárín ọjọ́ mẹ́ta[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “ní ọjọ́ mẹ́ta.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí pé iṣẹ́ náà yóò parí láàárín àkókò yẹn.
    reason: lexical_alternative
  - marker: b
    text: Jòhánù 2:19–21 ṣàlàyé pé ọ̀rọ̀ Jesu nípa tẹ́mpìlì ń tọ́ka sí ara rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Wọ́n wí pé
  rationale: Aorist náà sọ ìṣẹ̀lẹ̀ tó ṣẹlẹ̀ lẹ́ẹ̀kan nínú ìtàn; ‘Wọ́n wí pé’ jẹ́ ọ̀nà àdánidá láti mú ẹ̀rí ẹ̀sùn wọn wọlé.
- source_word: Οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó pa agbára ìtọ́kasí, àti ìró ọ̀rọ̀ ẹ̀sùn, mọ́ ju ‘ẹni yìí’ lọ ní Yorùbá òde òní.
- source_word: ἔφη
  choice: sọ pé
  rationale: Ọ̀rọ̀ náà kàn ń ròyìn ohun tí wọ́n ní ó sọ; kò yẹ kí ìtumọ̀ náà fi agbára bí ‘kéde’ tàbí ‘fẹ̀sùn kan’ kún un.
- source_word: Δύναμαι
  choice: Mo lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ agbára tàbí ohun tí ẹni kan lágbára láti ṣe.
- source_word: καταλῦσαι
  choice: wó
  rationale: Nípa ilé tàbí tẹ́ńpìlì, ‘wó’ túmọ̀ sí fífi ilé náà ṣubú tàbí pípa á run, ó sì bá àyíká ẹ̀sùn náà mu.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: tẹ́ńpìlì Ọlọ́run
  rationale: ‘Tẹ́ńpìlì’ ṣe kedere sí òǹkàwé Yorùbá pé ibi ìjọsìn ńlá ni; àkópọ̀ náà tún pa ìbáṣepọ̀ genitive ‘Ọlọ́run’ mọ́.
- source_word: διὰ τριῶν ἡμερῶν
  choice: láàárín ọjọ́ mẹ́ta
  rationale: Pẹ̀lú genitive, διά lè tọ́ka sí àkókò tí iṣẹ́ kan fi parí. ‘Láàárín ọjọ́ mẹ́ta’ mú ìtumọ̀ yìí jáde ní Yorùbá láìsọ pé ó gbọdọ̀ jẹ́ ní òpin ọjọ́ kẹta gan-an.
- source_word: οἰκοδομῆσαι
  choice: kí n sì kọ́ ọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ‘ọ’ mú ohun tí a ó kọ́ ṣe kedere ní Yorùbá, nígbà tí ‘kọ́’ dúró sún mọ́ ọ̀rọ̀ Gíríìkì ju ‘tún un kọ́’ lọ.
theological_decisions:
- issue: Ohun tí ‘tẹ́ńpìlì Ọlọ́run’ ń tọ́ka sí nínú ẹ̀sùn náà
  choice: A túmọ̀ ẹ̀sùn náà gẹ́gẹ́ bí ọ̀rọ̀ nípa tẹ́ńpìlì ti ara, láìfi àlàyé Jòhánù sí inú ọ̀rọ̀ pàtàkì.
  alternative: Kí ìtumọ̀ náà sọ tààrà pé ara Jesu àti àjíǹde rẹ̀ ni tẹ́ńpìlì náà ń tọ́ka sí.
  rationale: Mátíù ń ròyìn ohun tí àwọn ẹlẹ́rìí ẹ̀sùn ní Jesu sọ. Ó yẹ kí ọ̀rọ̀ pàtàkì pa irú ẹ̀sùn wọn mọ́; àlàyé Kristológì láti Jòhánù yẹ fún àlàyé ìsàlẹ̀ tàbí atọ́kasí.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘tẹ́ńpìlì’ gẹ́gẹ́ bí ọ̀rọ̀ tó wọ́pọ̀, a sì fi àmì ohùn sí ibi tí ó yẹ. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
