  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ Gíríìkì mọ́ dáadáa: àwọn ẹlẹ́rìí ni ó ń sọ, wọ́n sì ń tọ́ka sí Jesu pẹ̀lú ọ̀rọ̀ ẹ̀sùn; ‘Mo lè wó … kí n sì kọ́ ọ’ ń fi àwọn infinitive méjèèjì hàn. ‘Láàárín ọjọ́ mẹ́ta’ jẹ́ ìtumọ̀ tó ṣeé gbà fún διὰ τριῶν ἡμερῶν.'
