review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ tẹ̀ lé SBLGNT dáadáa: ‘èyí,’ ‘ẹ̀jẹ̀ mi ti májẹ̀mú,’ ‘fún ọ̀pọ̀ ènìyàn,’ àti ‘fún ìdáríjì ẹ̀ṣẹ̀’ pa àwọn ìpinnu pàtàkì nínú Giriki mọ́. Kò fi ‘ife’ tàbí ‘tuntun’ kún àyọkà pàtàkì. ‘Tí a ń dà sílẹ̀’ jẹ́ ìtumọ̀ tó ṣeé gbà fún participle passive tí ó wà ní present, bí ó tilẹ̀ jẹ́ pé ‘dà jáde’ sọ àwòrán ἐκχυννόμενον di mímọ́ síi.'
  naturalness: Yorùbá inú àyọkà náà jẹ́ adayeba, ó sì ní àmì ohùn tó yẹ. ‘Tí a ń dà jáde’ jẹ́ ọ̀nà tí ó ṣe kedere ju ‘tí a ń dà sílẹ̀’ lọ fún ẹ̀jẹ̀ tí a ń tú/jáde. A tún yẹ kí àlàyé ìsàlẹ̀ b máa sọ ‘on behalf of’ ní ti gidi, kì í ṣe ‘in place of.’
  terminology: ‘Májẹ̀mú,’ ‘ẹ̀jẹ̀,’ àti ‘ìdáríjì ẹ̀ṣẹ̀’ yẹ fún ìforúkọsílẹ̀ Bíbélì Yorùbá, wọ́n sì ṣètọ́jú ìtàn ìrúbọ àti májẹ̀mú nínú ẹsẹ̀ náà. Àlàyé ìsàlẹ̀ a ṣètọ́jú variant ‘májẹ̀mú tuntun’ láìsọ ọ́ di ọ̀rọ̀ àkọ́kọ́.
  issues:
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ b ní “ní ipò ọ̀pọ̀ ènìyàn.”
    rationale: ‘Ní ipò’ túmọ̀ sí ‘instead of/in place of,’ ó sì lè fi ìtumọ̀ ìròpo tí περί πολλῶν kò sọ ní pàtó sínú ẹsẹ̀ náà. ‘Ní àǹfààní ọ̀pọ̀ ènìyàn’ jẹ́ ìtumọ̀ tó péye fún ‘on behalf of many’ ní àlàyé yìí.
  - severity: low
    issue: “Tí a ń dà sílẹ̀” lè ní ìmọ̀ ‘spill’ tàbí ‘set aside.’
    rationale: ‘Tí a ń dà jáde’ pa àwòrán ‘poured out’ mọ́ ní kedere, láìyí ìtumọ̀ tàbí àkókò participle present passive padà.
