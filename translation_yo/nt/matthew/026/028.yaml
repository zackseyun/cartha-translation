id: MAT.26.28
reference: Matthew 26:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: yo
  text: Nítorí èyí ni ẹ̀jẹ̀ mi ti májẹ̀mú[a], tí a ń dà jáde fún ọ̀pọ̀ ènìyàn[b] fún ìdáríjì ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, “ẹ̀jẹ̀ mi ti májẹ̀mú tuntun.”
    reason: textual_variant
  - marker: b
    text: Tàbí, “ní àǹfààní ọ̀pọ̀ ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò aṣọ́ka náà tọ́ka sí ohun tí Jésù gbé kalẹ̀ níbi oúnjẹ náà. Giriki sọ pé ‘èyí’ nìkan; kò sọ pé ‘ife yìí.’
- source_word: γάρ
  choice: nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé àṣẹ tí Jésù ṣẹ̀ṣẹ̀ pa pé kí wọ́n mu.
- source_word: τὸ αἷμά μου
  choice: ẹ̀jẹ̀ mi
  rationale: Èyí túmọ̀ αἷμα ní tààràtà, ó sì pa ìtumọ̀ ìrúbọ àti májẹ̀mú mọ́.
- source_word: τῆς διαθήκης
  choice: ti májẹ̀mú
  rationale: SBLGNT sọ pé ‘ti májẹ̀mú’ láìfi ‘tuntun’ kún un; nítorí náà, a kò mú ọ̀rọ̀ tí kò sí nínú ẹsẹ̀ Giriki tí a fi lélẹ̀ wọ inú àyọkà pàtàkì.
- source_word: περὶ πολλῶν
  choice: fún ọ̀pọ̀ ènìyàn
  rationale: Nínú àyíká ọ̀rọ̀ ìrúbọ yìí, περί pẹ̀lú ọ̀rọ̀-orúkọ ní genitive lè tọ́ka sí ohun tí a ṣe fún àǹfààní àwọn ẹlòmíràn. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ‘ọ̀pọ̀’ mọ́ láìyí i sí ‘gbogbo.’
- source_word: ἐκχυννόμενον
  choice: tí a ń dà sílẹ̀
  rationale: Ó túmọ̀ participle passive tó ń ṣe àpèjúwe ẹ̀jẹ̀, ó sì pa àwòrán ohun tí a dà jáde mọ́.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: fún ìdáríjì ẹ̀ṣẹ̀
  rationale: Èyí jẹ́ ọ̀nà tó ṣe kedere, tó sì jẹ́ ti Yorùbá òde òní láti sọ ète tàbí àbájáde tí gbólóhùn Giriki náà ń tọ́ka sí.
theological_decisions:
- issue: Bóyá kí a fi ‘tuntun’ kún ‘májẹ̀mú’
  choice: ti májẹ̀mú
  alternative: ti májẹ̀mú tuntun
  rationale: Ọ̀rọ̀ καινῆς (‘tuntun’) kò sí nínú àyọkà SBLGNT tí a pèsè. A tẹ̀ lé àyọkà yẹn, a sì fi ẹ̀dà míì tí ó wọ́pọ̀ sínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ‘fún ọ̀pọ̀ ènìyàn’ nínú ọ̀rọ̀ ètùtù
  choice: fún ọ̀pọ̀ ènìyàn
  alternative: fún gbogbo ènìyàn
  rationale: Giriki ní πολλῶν, ‘ọ̀pọ̀.’ A pa ọ̀rọ̀ náà mọ́ láìdáhùn sí àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa iye àwọn tí ètùtù náà kàn, nítorí ẹsẹ̀ yìí nìkan kò fàyè gba kí a yí i sí ‘gbogbo.’
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A yan ‘dà sílẹ̀’ láti pa àwòrán ἐκχύννω mọ́, a sì yẹra fún fífi ‘ife’ tàbí ‘tuntun’ sínú àyọkà pàtàkì níbi tí Giriki tí a fi lélẹ̀ kò ti ní wọn.
