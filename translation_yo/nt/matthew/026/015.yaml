source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: yo
  text: Ó ní pé, “Kí ni ẹ ó fún mi, èmi yóò sì fi í lé yín lọ́wọ́?” Wọ́n sì wọn ọgbọ̀n owó fàdákà fún un.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Kí ni ẹ̀yin fẹ́ fún mi
  rationale: Ọ̀rọ̀ θέλω lè tọ́ka sí ohun tí ẹni fẹ́ tàbí ohun tí ó múra tán láti ṣe. Nínú ọ̀rọ̀ ìdúnàádúrà yìí, “fẹ́ fún mi” jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé, tí kò sì fi ìtumọ̀ kún ọ̀rọ̀ orísun.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: tí èmi yóò sì fi í lé yín lọ́wọ́
  rationale: παραδίδωμι ní ìtumọ̀ gbígbòòrò bí fífi ẹni lé ẹlòmíràn lọ́wọ́ tàbí jíjọ̀wọ́ rẹ̀ fún un. “Fi í lé yín lọ́wọ́” pa ìtumọ̀ yẹn mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ náà ìṣe Júdásì jẹ́ ìdàlẹ́.
- source_word: οἱ δὲ
  choice: Wọ́n sì
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ nínú ìtàn; “sì” ń so ìdáhùn wọn mọ́ ọ̀rọ̀ Júdásì láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: ἔστησαν αὐτῷ
  choice: wọn ... fún un
  rationale: ἔστησαν nínú gbólóhùn yìí lè túmọ̀ sí ṣíṣètò tàbí yíyẹ iye owó, ṣùgbọ́n ó tún lè mú àwòrán wíwọ̀n owó fàdákà wá. “Wọn ... fún un” pa àwòrán ìṣòwò náà mọ́, kò sì sọ ọ́ di “san án” lásán.
- source_word: τριάκοντα ἀργύρια
  choice: ọgbọ̀n owó fàdákà
  rationale: ἀργύρια túmọ̀ sí owó tàbí àwọn ẹyọ fàdákà láìdárúkọ irú ẹyọ owó pàtó. “Owó fàdákà” jẹ́ èdè Yorùbá àdánidá tí kò sọ iye owó tàbí ẹ̀yà rẹ̀ ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ παραδώσω nínú ìlérí Júdásì
  choice: fi í lé yín lọ́wọ́
  alternative: dà á fún yín / fi í hàn fún yín ní ọ̀nà ìdàlẹ́
  rationale: Ìtumọ̀ àkọ́kọ́ pa fífẹ̀ ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìdájọ́ ìwà tí àyíká ọ̀rọ̀ ń fi hàn sínú ọ̀rọ̀-ìṣe náà fúnra rẹ̀. Síbẹ̀, àyíká ìtàn mú kí òǹkàwé mọ̀ pé ìṣe náà jẹ́ ìdàlẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti èdè òde òní ni a lò. A lo “ẹ̀yin/yín” nítorí ẹni púpọ̀ ni Júdásì ń bá sọ̀rọ̀, a sì lo “fi í lé ... lọ́wọ́” gẹ́gẹ́ bí ọ̀nà àdánidá láti pa ìtumọ̀ παραδίδωμι mọ́.
