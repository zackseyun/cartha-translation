id: MAT.26.64
reference: Matthew 26:64
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Ìwọ ló sọ bẹ́ẹ̀.[a] Ṣùgbọ́n mo sọ fún yín pé, láti ìsinsìnyí lọ, ẹ ó rí Ọmọ Ènìyàn tí ó jókòó ní apá ọ̀tún Agbára[b], tí ó sì ń bọ̀ lórí àwọn ìkùukùu ojú ọ̀run.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwọ ló sọ ọ́.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà àkànṣe láti fi ìfọwọ́sí hàn.
    reason: lexical_alternative
  - marker: b
    text: “Agbára” jẹ́ ọ̀nà ìbọ̀wọ̀ láti tọ́ka sí Ọlọ́run.
    reason: cultural_note
  - marker: c
    text: Èyí ń tọ́ka sí Dáníẹ́lì 7:13 àti Sáàmù 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Ìwọ ni o sọ bẹ́ẹ̀
  rationale: Ó pa ìrísí ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí ìdáhùn ìfọwọ́sí, láì sọ ọ́ di ‘Bẹ́ẹ̀ ni’ lásán tàbí mú un dà bí ìkọ̀kọ̀rọ̀ èsì.
- source_word: πλὴν
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tó lágbára hàn láti inú èsì Jésù sí ìkéde pàtàkì tó tẹ̀ lé e, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἀπ’ ἄρτι
  choice: láti ìsinsìnyí lọ
  rationale: Ó sọ ìbẹ̀rẹ̀ ipò tuntun láti àkókò yìí lọ, láì fi dandan mú un túmọ̀ sí pé ohun gbogbo yóò ṣẹlẹ̀ ní ìṣẹ́jú náà gan-an.
- source_word: ὄψεσθε
  choice: ẹ ó rí
  rationale: Ó tú ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ní tààrà, ó sì pa ọ̀pọ̀ ènìyàn tí ọ̀rọ̀ náà ń tọ́ka sí mọ́.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè tí a mọ̀ dáadáa àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́.
- source_word: καθήμενον
  choice: tí ó jókòó
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó tún lè fi ipò ọlá àti ìjọba hàn nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἐκ δεξιῶν
  choice: ní ọwọ́ ọ̀tún
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ ipò ọlá, àṣẹ àti ìsúnmọ́ tí gbólóhùn náà ń fihàn.
- source_word: τῆς δυνάμεως
  choice: Agbára
  rationale: A pa ọ̀nà ọ̀wọ̀ tí Gíríìkì fi tọ́ka sí Ọlọ́run mọ́, dípò fífi ‘Ọlọ́run’ sínú ọ̀rọ̀ náà ní tààrà.
- source_word: ἐρχόμενον
  choice: tí ó sì ń bọ̀
  rationale: Ó pa àwòrán ìbọ̀ àti ìtọ́kasí sí Dáníẹ́lì 7 mọ́.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: lórí àwọn ìkùukùu ojú ọ̀run
  rationale: Ó tú àwòrán inú Gíríìkì ní kedere, ó sì pa ìró ọ̀rọ̀ Dáníẹ́lì 7:13 mọ́.
theological_decisions:
- issue: Ìtumọ̀ agbára èsì Jésù, Σὺ εἶπας
  choice: 'Ìdáhùn ìfọwọ́sí tí kò yí ọ̀rọ̀ Jésù padà sí ‘Bẹ́ẹ̀ ni’ lásán: ‘Ìwọ ni o sọ bẹ́ẹ̀.’'
  alternative: ‘Bẹ́ẹ̀ ni’ tàbí kíkà á sí èsì tí kò dáhùn ìbéèrè náà.
  rationale: Gbólóhùn Gíríìkì náà ń ṣiṣẹ́ gẹ́gẹ́ bí ìfọwọ́sí, ṣùgbọ́n ó yẹ kí ìtumọ̀ pa ọ̀nà pàtó tí Jésù gbà dáhùn mọ́.
- issue: Ẹni tí ‘Agbára’ (τῆς δυνάμεως) ń tọ́ka sí
  choice: A pa ọ̀rọ̀ ìbọ̀wọ̀ ‘Agbára’ mọ́ gẹ́gẹ́ bí ìtọ́kasí sí Ọlọ́run.
  alternative: Ṣíṣe é ní kedere sí ‘Ọlọ́run’ tàbí ‘Olódùmarè Alágbára.’
  rationale: Ó ṣeé ṣe kí ọ̀rọ̀ náà jẹ́ ọ̀nà ìbọ̀wọ̀ Júù láti tọ́ka sí Ọlọ́run. Fífi ‘Ọlọ́run’ rọ́pò rẹ̀ yóò ṣàlàyé ohun tí ó túmọ̀ sí, ṣùgbọ́n yóò kọjá ọ̀rọ̀ orísun.
- issue: Àkókò àti ìbáṣepọ̀ ‘ẹ ó rí’ pẹ̀lú jíjókòó àti bíbọ̀ Ọmọ Ènìyàn
  choice: A pa jíjókòó ní ọwọ́ ọ̀tún àti bíbọ̀ lórí ìkùukùu pọ̀ gẹ́gẹ́ bí ohun tí wọn yóò rí, láì pinnu ètò àkókò kan ṣoṣo.
  alternative: Kíkà gbogbo rẹ̀ sí ohun tó ṣẹ lẹ́sẹ̀kẹsẹ̀ nìkan tàbí sí ìpadàbọ̀ ọjọ́ iwájú nìkan.
  rationale: Gíríìkì so àwọn ọ̀rọ̀ aláìlópìn méjèèjì pọ̀ gẹ́gẹ́ bí àkóónú ohun tí wọn yóò rí; ìtumọ̀ kò gbọdọ̀ tú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbà ìkẹyìn yìí ní ipò òǹkàwé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì rọrùn fún òǹkàwé gbogbogbòò. A fi àmì ohùn sí àwọn ọ̀rọ̀ ní kíkún níbi tí ó bá jẹ́ àdánidá. Ọ̀rọ̀ ‘Agbára’ jẹ́ àjèjì díẹ̀ ní ipò yìí, ṣùgbọ́n a mọ̀ọ́mọ̀ pa á mọ́ láti ṣe àfihàn ọ̀nà ìbọ̀wọ̀ inú orísun, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
