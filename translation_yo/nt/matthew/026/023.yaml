source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: yo
  text: Ó dáhùn pé, “Ẹni tí ó tẹ ọwọ́ rẹ̀ sínú àwopọ̀ náà pẹ̀lú mi—ẹni yìí ni yóò dà mí[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò fi mí léni lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ó dáhùn pé
  rationale: Àkójọpọ̀ participle àti finite verb yìí jẹ́ ọ̀nà Gíríìkì tí ó túmọ̀ sí ‘ó dáhùn’; ‘pé’ sì mú ọ̀rọ̀ tààrà wọlé lọ́nà àdánidá ní Yorùbá.
- source_word: ἐμβάψας
  choice: tí ó ti fi … bọ inú
  rationale: Aorist participle náà tọ́ka sí ìṣe ìdánimọ̀ tí a ti ṣe; ‘tí ó ti … bọ inú’ fi ìparí ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: μετ’ ἐμοῦ
  choice: pẹ̀lú mi
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún accompaniment.
- source_word: τὴν χεῖρα
  choice: ọwọ́ rẹ̀
  rationale: Gíríìkì lo article fún ẹ̀yà ara níbi tí Yorùbá ti máa ń lo arọ́pò-orúkọ oníhun; èyí mú un ṣe kedere pé ọwọ́ ẹni náà ni.
- source_word: ἐν τῷ τρυβλίῳ
  choice: inú àwopọ̀ náà
  rationale: τρύβλιον jẹ́ ohun èlò jíjẹ bíi àwo jíjinlẹ̀ tàbí abọ́ kékeré; ‘àwopọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun èlò tí a fi oúnjẹ sí.
- source_word: οὗτός
  choice: ẹni yìí
  rationale: Ọ̀rọ̀ demonstrative náà ní ìtẹnumọ́; ‘ẹni yìí’ pa ìtẹnumọ́ náà mọ́ ju arọ́pò-orúkọ lásán lọ.
- source_word: παραδώσει
  choice: yóò dà mí
  rationale: Nínú àyíká ìtàn ìjìyà Jésù, ọ̀rọ̀ náà túmọ̀ sí fífi Jésù lé àwọn ọ̀tá lọ́wọ́ ní ọ̀nà ìwà ọ̀dàlẹ̀; ‘dà mí’ sọ agbára ọ̀dàlẹ̀ náà ní Yorùbá kedere.
theological_decisions:
- issue: Ìtumọ̀ παραδίδωμι nínú àyíká Júdásì
  choice: yóò dà mí
  alternative: yóò fi mí lé wọn lọ́wọ́
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí ‘fi léni lọ́wọ́,’ ṣùgbọ́n àyíká ìbáṣepọ̀ àti ìtàn níbí mú ìwà ọ̀dàlẹ̀ jẹ́ kókó. ‘Dà mí’ jẹ́ kúkúrú, àdánidá, ó sì pa agbára ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìtẹnumọ́ οὗτός mọ́ nípasẹ̀ ‘ẹni yìí,’ a sì ṣàfihàn ìṣe ἐμβάψας gẹ́gẹ́ bí ohun tí a ti ṣe.
