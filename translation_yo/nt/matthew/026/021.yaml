id: MAT.26.21
reference: Matthew 26:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: yo
  text: Bí wọ́n sì ti ń jẹun, ó sọ pé, “Lóòótọ́ ni mo sọ fún yín, ẹnì kan nínú yín yóò fi mí hàn[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ rẹ̀ ní tààrà sí i, “yóò fi mí lé ọwọ́ ẹlòmíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: bí wọ́n sì ti ń jẹun
  rationale: Gbólóhùn genitive absolute náà fi hàn pé jíjẹun wọn ń lọ lọ́wọ́ nígbà tí Jésù sọ̀rọ̀; ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ àsìkò mọ́.
- source_word: Ἀμὴν
  choice: lóòótọ́ ni
  rationale: Ní ìbẹ̀rẹ̀ ọ̀rọ̀ Jésù, ἀμήν jẹ́ ìmúdájú ọlọ́lá tí ó ń tẹnu mọ́ òtítọ́ àti àṣẹ ọ̀rọ̀ tí ó tẹ̀ lé e.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ọ̀rọ̀ tààrà sí ọ̀pọ̀ ènìyàn, ó sì pa ẹni àkọ́kọ́ àti ẹni kejì ọ̀pọ̀ mọ́.
- source_word: εἷς ἐξ ὑμῶν
  choice: ẹ̀nì kan nínú yín
  rationale: Ó sọ ìtumọ̀ apá-inú-àpapọ̀ náà ní kedere àti ní Yorùbá àdánidá.
- source_word: παραδώσει
  choice: yóò fi mí hàn
  rationale: Nínú àyíká ìtàn yìí, gbólóhùn Yorùbá náà sọ ìwà ọ̀dàlẹ̀ ọmọ-ẹ̀yìn kan ní kedere, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbooro ti fífi ẹnì kan lé ẹlòmíràn lọ́wọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ gbooro náà pamọ́.
- source_word: με
  choice: mí
  rationale: Arọ́pò-orúkọ ẹni àkọ́kọ́ gẹ́gẹ́ bí olùgbà ìṣe náà, tí ó tọ́ka sí Jésù.
theological_decisions:
- issue: Ìtumọ̀ παραδώσει nínú àyíká ìjìyà Jésù
  choice: yóò fi mí hàn
  alternative: yóò fi mí lé wọn lọ́wọ́ / yóò fà mí lé wọn lọ́wọ́
  rationale: Àyíká náà jẹ́ kí ìwà ọ̀dàlẹ̀ hàn gbangba, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ tún lè túmọ̀ sí fífi tàbí jíjẹ́ kí ẹnì kan bọ́ sí ọwọ́ ẹlòmíràn. A lo ọ̀nà Yorùbá àdánidá nínú ẹsẹ̀, a sì tọ́ka sí ìtumọ̀ gbooro náà nínú àlàyé láìfi ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “lóòótọ́ ni mo sọ fún yín” gẹ́gẹ́ bí ọ̀rọ̀ ìmúdájú ọlọ́lá, a sì gbé àmì àlàyé [a] sí ibi tí παραδώσει wà, nítorí àlàyé náà jẹ mọ́ ọ̀rọ̀ yẹn.
