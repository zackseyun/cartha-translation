id: MAT.26.10
reference: Matthew 26:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù mọ ohun tí wọ́n ń sọ, ó sì wí fún wọn pé, “Èé ṣe tí ẹ fi ń yọ obìnrin náà lẹ́nu?[a] Ó ṣe iṣẹ́ rere kan fún mi.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èé ṣe tí ẹ fi ń dá obìnrin náà láàmú?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ó ṣe iṣẹ́ ẹlẹ́wà kan sí mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: mọ ohun tí wọ́n ń sọ
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó túmọ̀ sí pé Jésù mọ ohun tó ń ṣẹlẹ̀ kí ó tó dáhùn. Àfikún ‘ohun tí wọ́n ń sọ’ mú ohun tí àyíká ọ̀rọ̀ tọ́ka sí hàn ní Yorùbá àdánidá láì fi èrò tuntun kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn láàárín ìkùnsínú àwọn ọmọ-ẹ̀yìn àti ìdáhùn Jésù.
- source_word: Τί κόπους παρέχετε
  choice: Èé ṣe tí ẹ fi ń yọ … lẹ́nu?
  rationale: Àkójọpọ̀ κόπους àti παρέχετε jẹ́ ọ̀nà àsọyé fún fífi ìdààmú tàbí wàhálà bá ẹnì kan. ‘Yọ … lẹ́nu’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì pa agbára ìbáwí inú ìbéèrè náà mọ́.
- source_word: τῇ γυναικί
  choice: obìnrin náà
  rationale: Dative náà tọ́ka sí obìnrin náà gẹ́gẹ́ bí ẹni tí ìdààmú náà ń kan; ìṣètò ‘yọ obìnrin náà lẹ́nu’ sọ èyí ní Yorùbá àdánidá.
- source_word: ἔργον καλὸν
  choice: iṣẹ́ rere kan
  rationale: καλός lè túmọ̀ sí ohun rere, ohun tó yẹ, tàbí ohun tó lẹ́wà ní ìwà. ‘Iṣẹ́ rere’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tí kò sì fi ẹ̀kọ́ ìsìn àfikún sí ìyìn tí Jésù fún ìṣe obìnrin náà.
- source_word: ἠργάσατο
  choice: ó ṣe
  rationale: Aorist náà sọ nípa ìṣe tí ó ti parí. Yorùbá kò nílò àmì present perfect ọ̀tọ̀ níbí; ‘ó ṣe’ bá àyíká ọ̀rọ̀ mu.
- source_word: εἰς ἐμέ
  choice: fún mi
  rationale: εἰς pẹ̀lú ẹni lè fi ìtọ́sọ́nà tàbí ìbáṣepọ̀ hàn. Nínú ọ̀rọ̀ yìí, ‘fún mi’ jẹ́ Yorùbá àdánidá, bó tilẹ̀ jẹ́ pé ‘sí mi’ tún lè tẹnumọ́ ìtọ́sọ́nà ìṣe náà.
theological_decisions:
- issue: Bí a ṣe yẹ ìṣe obìnrin náà sí
  choice: iṣẹ́ rere kan
  alternative: iṣẹ́ ẹlẹ́wà kan; iṣẹ́ ọlọ́lá kan
  rationale: Ìtumọ̀ náà pa ìyìn rere àti ìbójúmu inú καλόν mọ́, láì sọ ìṣe náà di ẹ̀kọ́ nípa ẹ̀tọ́, ẹbọ, tàbí àṣà ìsìn kan pàtó.
- issue: Ìbáṣepọ̀ tí εἰς ἐμέ ń fi hàn
  choice: fún mi
  alternative: sí mi
  rationale: ‘Fún mi’ bá Yorùbá mu jù lọ nípa iṣẹ́ tí a ṣe ní ìbáṣepọ̀ pẹ̀lú Jésù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ìtọ́sọ́nà ‘sí mi’ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. ‘Yọ … lẹ́nu’ jẹ́ àsọyé tí gbogbo ènìyàn lè lóye; ‘iṣẹ́ rere’ sì jẹ́ ọ̀nà àdánidá láti sọ ìṣe tó dára, tó yẹ, tí ó sì ní ẹwà ìwà. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
