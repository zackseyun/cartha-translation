  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐδύνατο γὰρ ⸀τοῦτο πραθῆναι πολλοῦ καὶ δοθῆναι πτωχοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/009.yaml
  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: yo
  text: Nítorí a lè ti ta èyí ní owó púpọ̀, kí a sì fi owó náà fún àwọn òtòṣì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ní iye púpọ̀” tàbí “ní owó gíga.” Èdè Gíríìkì lo ọ̀nà ìsọ iye tí a fi ta ohun kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: a lè ti
  rationale: Ìṣe aláìparí δύναμαι pẹ̀lú àwọn ọ̀rọ̀-ìṣe àìlẹ́ni ṣe afihan ohun tí ó ṣeé ṣe ní àkókò tí ó ti kọjá ṣùgbọ́n tí kò ṣẹlẹ̀; “a lè ti” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára àlàyé mọ́, ó sì so ọ̀rọ̀ yìí mọ́ ẹ̀dùn-ọkàn tí ó ṣáájú.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka náà tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; “èyí” pa ìṣísẹ̀ Gíríìkì mọ́ láìfi orúkọ ohun náà kún un.
- source_word: πραθῆναι
  choice: ta
  rationale: Aorist passive infinitive πιπράσκω túmọ̀ sí “láti tà”; nínú Yorùbá, ìtumọ̀ aláìní ẹni “a lè ti ta” jẹ́ àdánidá, ó sì fi àǹfààní tí kò ṣẹlẹ̀ nígbà àtijọ́ hàn.
- source_word: πολλοῦ
  choice: ní owó púpọ̀
  rationale: Genitive ti iye ọjà lẹ́yìn πιπράσκω sọ iye tí a fi ta ohun kan; “ní owó púpọ̀” jẹ́ Yorùbá òde òní tí ó ṣe kedere láìsọ iye pàtó.
- source_word: δοθῆναι
  choice: kí a sì fi owó náà fún
  rationale: Aorist passive infinitive δίδωμι bá πραθῆναι rìn. Yorùbá nílò kí ohun tí a máa fún wọn—owó tí títà náà bá mú wá—hàn gbangba; àfikún “owó náà” jẹ́ ìtumọ̀ ìtumọ̀ inú ọ̀rọ̀, kì í ṣe ìyípadà ohun tí Gíríìkì sọ.
- source_word: πτωχοῖς
  choice: àwọn òtòṣì
  rationale: Adjective dative plural tí a lò gẹ́gẹ́ bí orúkọ ń tọ́ka sí àwọn ènìyàn aláìní; “àwọn òtòṣì” jẹ́ kúkúrú, ó sì pa ìtumọ̀ àpapọ̀ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A lo “kí a sì fi owó náà fún” láti mú ìbáṣepọ̀ ọgbọ́n inú gbolohun Gíríìkì yé ni Yorùbá.
