  terminology: “Àwọn òtòṣì” jẹ́ ọ̀rọ̀ àdánidá, tó ní ọ̀wọ̀, fún πτωχοῖς. Ọ̀rọ̀ “ní owó púpọ̀” ń pa ìtumọ̀ iye owó tó pọ̀ mọ́ láìsọ iye pàtó. Àlàyé ẹsẹ̀-ìsàlẹ̀ náà ń fúnni ní àwọn ọ̀nà ìtumọ̀ tó bá ìtumọ̀ genitive iye owó mu.
