  rationale: Àtúnṣe náà ṣàtúnṣe ọ̀rọ̀ pàtàkì fún ἀπώλεια sí “ìṣòfò,” ó sì dín àfikún àlàyé kù níbi tí Gíríìkì ti fi ohun tí wọ́n rí sílẹ̀ fún àyíká. Ó pa ìbéèrè nípa ìdí/ètè, ìbínú àwọn ọmọ-ẹ̀yìn, àti ohùn ìtàn mọ́.
