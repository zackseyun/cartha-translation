  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ọmọ-ẹ̀yìn rí i, inú bí wọn, wọ́n sì wí pé, “Kí ni ìdí tí ìṣòfò yìí fi wà?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: nígbà tí ... rí ohun tí obìnrin náà ṣe
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tí ó bá èdè Yorùbá mu. Gíríìkì kò sọ ohun tí wọ́n rí ní tààrà, nítorí náà a mú ìṣe obìnrin náà wá láti inú àyíká ọ̀rọ̀ dípò ọ̀rọ̀ arọ́pò-orúkọ tí kò ní ìtọ́kasí kedere.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora díẹ̀ hàn láàárín ìṣe obìnrin náà àti ìhùwàsí àwọn ọmọ-ẹ̀yìn.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún μαθηταί; a kò fi “rẹ̀” kún un nítorí kò sí nínú Gíríìkì.
- source_word: ἠγανάκτησαν
  choice: inú bí wọn
  rationale: Ó sọ ìbínú àti àìtẹ́lọ́rùn líle tí ἀγανακτέω ní jáde ní èdè Yorùbá àdánidá.
- source_word: λέγοντες
  choice: wọ́n sì wí pé
  rationale: Àpapọ̀ ọ̀rọ̀-ìṣe yìí jẹ́ ọ̀nà Yorùbá àdánidá láti so ìbínú wọn pọ̀ mọ́ ọ̀rọ̀ tààrà tí wọ́n sọ.
- source_word: Εἰς τί
  choice: Kí ni ìdí tí
  rationale: Ó pa ìtumọ̀ ìbéèrè nípa ète tàbí ìdí mọ́, ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ἡ ἀπώλεια αὕτη
  choice: irú ìsọ̀fúnni yìí
  rationale: Nínú àyíká òróró olówó iyebíye tí a dà sílẹ̀, ἀπώλεια túmọ̀ sí lílo ohun lọ́nà tí àwọn ọmọ-ẹ̀yìn kà sí asán; “ìsọ̀fúnni” mú èrò fífi ohun ṣòfò jáde.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A mú ohun tí ἰδόντες ń tọ́ka sí wá láti ẹsẹ tó ṣáájú láti yàgò fún àìkedere.
