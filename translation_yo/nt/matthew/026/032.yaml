  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí a bá jí mi dìde[a], èmi yóò lọ ṣáájú yín sí Galili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí mo bá jí dìde.” Ní ti gidi, Gíríìkì lo ìrísí passive pé, “lẹ́yìn tí a bá jí mi dìde”; èyí kò dárúkọ ẹni tí ó ṣe ìṣe jíjí náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Ṣùgbọ́n lẹ́yìn tí
  rationale: “Lẹ́yìn tí” fi ìtẹ̀lé àkókò hàn, “ṣùgbọ́n” sì pa ìyàtọ̀ kékeré mọ́ sí àsọtẹ́lẹ̀ ìṣubú àwọn ọmọ-ẹ̀yìn tí ó ṣáájú.
- source_word: τὸ ἐγερθῆναί με
  choice: a bá jí mi dìde
  rationale: 'Èyí pa ìṣe aláìlórúkọ (passive) inú Gíríìkì mọ́: ẹnì kan ni ó jí Jésù dìde, bí ó tilẹ̀ jẹ́ pé a kò dárúkọ ẹni náà. “Jí ... dìde” jẹ́ ọ̀nà Yorùbá àdánidá fún jíjí ẹni kúrò nínú òkú.'
- source_word: προάξω ὑμᾶς
  choice: èmi yóò ṣáájú yín lọ
  rationale: Ó túmọ̀ sí pé Jésù yóò lọ síwájú àwọn ọmọ-ẹ̀yìn rẹ̀; fífi “èmi” hàn mú ìtẹnumọ́ ẹni tí yóò ṣáájú wọn ṣe kedere, láìfi ìtumọ̀ aṣáájú ọ̀nà kún un.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: “Sí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrìn sí agbègbè kan, ó sì pa ìtọ́sọ́nà εἰς mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ àjíǹde nínú ἐγερθῆναί
  choice: lẹ́yìn tí a bá jí mi dìde
  alternative: lẹ́yìn tí mo bá jí dìde
  rationale: A yan àkópọ̀ aláìlórúkọ láti pa ìrísí passive Gíríìkì mọ́ àti láti má ṣe sọ ẹni tó ṣe iṣẹ́ náà ní kedere ju bí ẹsẹ̀ náà ti sọ lọ. Àṣàyàn kejì jẹ́ àdánidá, ṣùgbọ́n ó yí ọ̀rọ̀ náà sí ìṣe tí Jésù fúnra rẹ̀ ṣe.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “yóò” àti àmì ohùn ní kíkún; “Galili” ni àkọsílẹ̀ orúkọ ibi tí ó wọ́pọ̀ nínú Yorùbá.
