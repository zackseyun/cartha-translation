id: MAT.26.24
reference: Matthew 26:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: yo
  text: Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀; ṣùgbọ́n ègbé ni fún ọkùnrin náà tí ó fi Ọmọ Ènìyàn hàn. Ìbá sàn fún un bí a kì bá bí ọkùnrin náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè tí a mọ̀ sí ‘Ọmọ Ènìyàn’ mọ́. Ìyàtọ̀ tí μὲν ... δὲ ń fi hàn jẹ́ kedere nínú ìpín gbólóhùn méjèèjì àti ‘ṣùgbọ́n,’ láìfi ọ̀rọ̀ àfikún tí kò bá Yorùbá mu sí i.
- source_word: ὑπάγει
  choice: ń lọ
  rationale: Ó tú ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí náà ní ṣókí, kò sì fi tipátipá sọ pé ó túmọ̀ sí ikú tàbí kíkúrò nìkan, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ tó yí i ká ń tọ́ka sí ìjìyà tó ń bọ̀.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tí a ti kọ sílẹ̀ dúró gẹ́gẹ́ bí Ìwé Mímọ́ ṣe sọ nípa rẹ̀.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ṣùgbọ́n ègbé ni fún ọkùnrin náà
  rationale: ‘Ègbé’ pa agbára ìkéde ìdájọ́ οὐαί mọ́; ‘ṣùgbọ́n’ sì fi ìyàtọ̀ sí gbólóhùn àkọ́kọ́ hàn. ‘Ọkùnrin náà’ tọ́ka sí ọkùnrin kan pàtó, ìyẹn Júdásì.
- source_word: δι’ οὗ
  choice: ẹni tí a tipasẹ̀ rẹ̀
  rationale: ‘Tipasẹ̀ rẹ̀’ pa ìtumọ̀ aṣojú tàbí ọ̀nà tí διά pẹ̀lú genitive ní mọ́.
- source_word: παραδίδοται
  choice: fi ... hàn
  rationale: Nínú àyíká ọ̀rọ̀ Júdásì, ‘fi ... hàn’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìwà àdàkàdekè. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gbooro ‘fi lé wọn lọ́wọ́’ mọ́.
- source_word: καλὸν ἦν αὐτῷ
  choice: Ìbá sàn fún un
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí ìbá dára tàbí yẹ jù fún ẹni náà nínú ipò àròsọ tí kò ṣẹlẹ̀.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: bí a kò bá bí ọkùnrin náà
  rationale: Ó sọ ipò àròsọ òdì náà ní Yorùbá àdánidá, ó sì tún ‘ọkùnrin náà’ ṣe bí Gíríìkì ṣe tún gbólóhùn náà ṣe fún ìtẹnumọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ohun tí Ìwé Mímọ́ ti kọ sílẹ̀ àti ẹ̀bi ẹni tó fi Jésù hàn
  choice: 'A pa méjèèjì mọ́: Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀, síbẹ̀ ègbé wà fún ẹni tó tipasẹ̀ rẹ̀ fi í hàn.'
  alternative: Kí a tú u lọ́nà tó dín ojúṣe Júdásì kù, tàbí lọ́nà tó dín ìmúṣẹ ohun tí Ìwé Mímọ́ sọ kù.
  rationale: Gíríìkì fi òtítọ́ méjèèjì sí ẹ̀gbẹ́ ara wọn; ìtumọ̀ náà kò gbìyànjú láti yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ kọjá ohun tí ẹsẹ náà sọ.
- issue: Agbára ọ̀rọ̀ pé àìbí ẹni náà ìbá sàn fún un
  choice: A tú u gẹ́gẹ́ bí ọ̀rọ̀ ìdájọ́ tó lágbára, láìfi ìparí ẹ̀kọ́ ìgbàgbọ́ míì kún un.
  alternative: Kí a sọ pé àfiwé àsọdùn lásán ni, tàbí kí a lò ó gẹ́gẹ́ bí ẹ̀rí fún àlàyé kíkún nípa ìpín ẹni náà lẹ́yìn ikú.
  rationale: Ẹsẹ náà sọ bí ìdájọ́ náà ṣe le tó, ṣùgbọ́n kò ṣàlàyé gbogbo ohun tó lè tẹ̀ lé e nípa ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ènìyàn’ gẹ́gẹ́ bí apá orúkọ oyè ‘Ọmọ Ènìyàn,’ a sì lo àmì ìdáhùn láti pa agbára ìkéde ‘ègbé’ mọ́.
