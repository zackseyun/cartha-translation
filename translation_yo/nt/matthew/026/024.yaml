revisions:
- from: Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀; ṣùgbọ́n ègbé ni fún ọkùnrin náà, ẹni tí a tipasẹ̀ rẹ̀ fi Ọmọ Ènìyàn hàn[a]! Ìbá sàn fún un bí a kò bá bí ọkùnrin náà.
  to: Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀; ṣùgbọ́n ègbé ni fún ọkùnrin náà tí ó fi Ọmọ Ènìyàn hàn. Ìbá sàn fún un bí a kì bá bí ọkùnrin náà.
  rationale: The revision corrects the agency construction and the counterfactual conditional while retaining the established Yoruba title, the judicial force of “ègbé,” and the contextual rendering of παραδίδοται as betrayal. The footnote is adjusted to match the revised active clause and continues to preserve the lexical alternative “hand over.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse’s central contrast: the Son of Man’s departure accords with what is written, while the man involved in handing him over faces woe. However, the relative expression “ẹni tí a tipasẹ̀ rẹ̀ fi...” is structurally unnatural and obscures the Greek’s identification of the man as the effective agent. The final counterfactual also requires kì bá, rather than kò bá, for the past contrary-to-fact sense.'
  naturalness: “A tipasẹ̀ rẹ̀” is not idiomatic Standard Yoruba in this construction. Recasting it as an active relative clause is clear and natural. “Ìbá sàn ... bí a kì bá bí ...” naturally expresses the severe counterfactual judgment.
  terminology: “Ọmọ Ènìyàn,” “ègbé,” and “fi ... hàn” are retained. In this biblical context, “fi Ọmọ Ènìyàn hàn” can convey betrayal; the footnote properly preserves the more literal alternative, “fi ... lé lọ́wọ́.”
  issues:
  - severity: medium
    issue: The phrase “ẹni tí a tipasẹ̀ rẹ̀ fi Ọmọ Ènìyàn hàn” is grammatically and idiomatically defective.
    rationale: It combines an impersonal passive-like construction with a malformed expression for agency. Greek δι’ οὗ identifies the specific man through whose agency the handing-over occurs; Yoruba expresses this more naturally with an active relative clause, “tí ó fi Ọmọ Ènìyàn hàn.”
  - severity: medium
    issue: “bí a kò bá bí ọkùnrin náà” does not clearly mark the required past counterfactual.
    rationale: The Greek εἰ οὐκ ἐγεννήθη refers to a birth that did not happen otherwise. Yoruba “bí a kì bá bí...” supplies the appropriate contrary-to-fact form.
  revised_text: Ọmọ Ènìyàn ń lọ gẹ́gẹ́ bí a ti kọ̀wé nípa rẹ̀; ṣùgbọ́n ègbé ni fún ọkùnrin náà tí ó fi Ọmọ Ènìyàn hàn. Ìbá sàn fún un bí a kì bá bí ọkùnrin náà.
  revised_footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin náà tí ó fi Ọmọ Ènìyàn lé lọ́wọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “fi hàn” tàbí, ní tààrà sí i, “fi lé lọ́wọ́”; a yan “fi hàn” níbí nítorí ìwà àdàkàdekè Júdásì ni àyíká ọ̀rọ̀ náà ń sọ.
    reason: lexical_alternative
  revision_rationale: The revision corrects the agency construction and the counterfactual conditional while retaining the established Yoruba title, the judicial force of “ègbé,” and the contextual rendering of παραδίδοται as betrayal. The footnote is adjusted to match the revised active clause and continues to preserve the lexical alternative “hand over.”
