source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: yo
  text: Ṣùgbọ́n Peteru dá a lóhùn pé, “Bí gbogbo wọn tilẹ̀ bá kọsẹ̀[a] nítorí rẹ, èmi kì yóò kọsẹ̀ láéláé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ṣubú” tàbí “kí ó di ìdènà sí wọn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí kí ẹni kọsẹ̀, kí ó gba ìkọlù, tàbí kí ó yà kúrò nínú ìfaramọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Ṣùgbọ́n Peteru dá a lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ ìṣe ‘dáhùn ... sọ fún un’ jẹ́ ọ̀nà ìsọ̀rọ̀ Gíríìkì tí Yorùbá àdánidá lè fi ṣókí sí ‘dá a lóhùn pé.’ ‘Ṣùgbọ́n’ mú ìyàtọ̀ pẹ̀lú àsọtẹ́lẹ̀ Jésù tí ó ṣáájú jáde.
- source_word: Εἰ πάντες
  choice: Bí gbogbo wọn tilẹ̀ bá
  rationale: ‘Bí ... tilẹ̀ bá’ fi agbára ìyọ̀ǹda tí ọ̀rọ̀ Peteru ní hàn, bó tilẹ̀ jẹ́ pé εἰ fúnra rẹ̀ túmọ̀ sí ‘bí.’
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: kọsẹ̀ / kọsẹ̀
  rationale: '‘Kọsẹ̀’ pa àwòrán àti ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́: ó lè jẹ́ fífọsẹ̀, jíjẹ́ kí ohun kan mú ẹni ṣubú, tàbí yíyẹ̀ kúrò nínú ìfaramọ́. Lílo ọ̀rọ̀ kan náà ní ibi méjèèjì tún pa ìfararora orísun mọ́.'
- source_word: ἐν σοί
  choice: nítorí rẹ
  rationale: Nínú àkópọ̀ yìí, ἐν σοί tọ́ka sí Jésù gẹ́gẹ́ bí ohun tí ìkọsẹ̀ náà ní í ṣe pẹ̀lú; ‘nítorí rẹ’ jẹ́ Yorùbá àdánidá tí ó ṣe kedere.
- source_word: ἐγὼ οὐδέποτε
  choice: èmi kì yóò ... láéláé
  rationale: ‘Èmi’ mú ìtẹnumọ́ àti ìfiwéra Peteru pẹ̀lú ‘gbogbo wọn’ hàn; ‘láéláé’ sì gbé ìkọ̀ emphatic οὐδέποτε jáde.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλίζω ní àyíká ìkùnà ọmọ-ẹ̀yìn
  choice: kọsẹ̀
  alternative: yí padà kúrò lọ́dọ̀ rẹ / fi ọ́ sílẹ̀
  rationale: ‘Kọsẹ̀’ pa àwòrán orísun àti ìfẹ̀ ìtumọ̀ rẹ̀ mọ́ láìfi dandan pinnu bóyá ìkùnà fún ìgbà díẹ̀ ni tàbí ìyapa pátápátá. Àlàyé ìsàlẹ̀ jẹ́ kí agbára ìtumọ̀ yíyẹ̀ kúrò nínú ìfaramọ́ hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìtẹnumọ́ ‘èmi’ àti ìfararora ọ̀rọ̀ ‘kọsẹ̀’ ní ẹ̀ẹ̀mejì ni a pa mọ́.
