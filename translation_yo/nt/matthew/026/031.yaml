  source_fidelity: 'Ìtumọ̀ náà fi ọ̀pọ̀ nínú àwọn eroja Gíríìkì pàtàkì hàn dáadáa: ìtẹnumọ́ ‘gbogbo yín,’ ìdí ‘nítorí mi,’ àkókò ‘ní òru yìí,’ àti àwòrán olùṣọ́-àgùntàn/àgùntàn. Síbẹ̀, gbolohun àyọlò náà lè jẹ́ mímọ́ sí i nípa lílo ‘àwọn àgùntàn agbo náà,’ tí ó túmọ̀ τὰ πρόβατα τῆς ποίμνης lọ́nà kedere. A tún gbe àmì ìsàlẹ̀ ojú ewé àyọlò náà sí òpin àyọlò, níbi tí ó bá ìdí rẹ̀ mu.'
  naturalness: ‘Gbogbo yín yóò kọsẹ̀’ jẹ́ ìṣètò Yorùbá ìgbàlódé tó rọrùn ju ‘Gbogbo yín ni yóò kọsẹ̀’ lọ, bí ó tilẹ̀ jẹ́ pé àwọn méjèèjì lè ṣeé gbà. ‘A ti kọ ọ́ sílẹ̀ pé’ jẹ́ ọ̀nà tó dára fún ọ̀rọ̀ àfihàn Ìwé Mímọ́. Àlàyé ìsàlẹ̀ ojú ewé a ti tún kọ kí ó má bàa ní gbolohun àìdánidá ‘kí ó kọ̀ nǹkan.’
  terminology: ‘Jésù,’ ‘olùṣọ́-àgùntàn,’ ‘àgùntàn,’ àti ‘agbo’ yẹ, wọ́n sì pa àwòrán ẹsẹ̀ náà mọ́. ‘Kọsẹ̀’ jẹ́ ìtumọ̀ tó lè bójú mu fún σκανδαλισθήσεσθε nígbà tí ìsàlẹ̀ ojú ewé ń ṣàlàyé ìtumọ̀ ìkọ̀sílẹ̀ nínú àyíká yìí.
