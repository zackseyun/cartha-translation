id: MAT.26.31
reference: Matthew 26:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: yo
  text: Nígbà náà, Jésù sọ fún wọn pé, “Gbogbo yín yóò kọsẹ̀ nítorí mi ní òru yìí,[a] nítorí a ti kọ ọ́ sílẹ̀ pé, ‘Èmi yóò lu olùṣọ́-àgùntàn, àwọn àgùntàn agbo náà yóò sì tú ká.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo yín yóò ṣubú kúrò lọ́dọ̀ mi” tàbí “gbogbo yín yóò kọ̀ mí sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kí ènìyàn kọsẹ̀, kí a mú un kọsẹ̀, tàbí kí ohun kan di ìdènà sí i; níbí, àyíká ń tọ́ka sí bí àwọn ọmọ-ẹ̀yìn yóò ṣe fi Jésù sílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Àyọlò láti inú Sekaráyà 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn lọ́nà àdánidá nínú ìtàn Yorùbá.
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí gẹ́gẹ́ bí historical present, àkókò tí ó ti kọjá ni ó bá ìtàn Yorùbá àdánidá mu jù láìyí ìtumọ̀ padà.
- source_word: Πάντες ὑμεῖς
  choice: Gbogbo yín ni
  rationale: Ó pa ìtẹnumọ́ tó wà lórí gbogbo àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: σκανδαλισθήσεσθε
  choice: yóò kọsẹ̀
  rationale: ‘Kọsẹ̀’ pa àwòrán ọ̀rọ̀ Gíríìkì àti àìdánilójú rẹ̀ mọ́; nínú àyíká yìí ó ń tọ́ka sí pípa Jésù tì, kì í ṣe kọsẹ̀ lasán.
- source_word: ἐν ἐμοὶ
  choice: nítorí mi
  rationale: 'Ó sọ ìbáṣepọ̀ ìdí tó wà nínú ọ̀rọ̀ náà di mímọ́ ní Yorùbá: ohun tí yóò ṣẹlẹ̀ sí Jésù ni yóò mú kí wọ́n kọsẹ̀.'
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: ní òru yìí
  rationale: Ìtumọ̀ tààrà, tó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: γέγραπται γάρ
  choice: nítorí a ti kọ ọ́ pé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún gbólóhùn tí ń ṣáájú àyọlò Ìwé Mímọ́, ó sì pa perfect passive mọ́ ní ìtumọ̀.
- source_word: Πατάξω
  choice: Èmi yóò lu
  rationale: ‘Lu’ jẹ́ ìtumọ̀ tó rọrùn, tó sì yẹ, láìfi àbájáde ikú kún ọ̀rọ̀ orísun.
- source_word: τὸν ποιμένα
  choice: olùṣọ́-àgùntàn
  rationale: Ó pa àpẹẹrẹ olùṣọ́ àti agbo mọ́ lọ́nà tí òǹkàwé Yorùbá lè lóye kedere.
- source_word: διασκορπισθήσονται
  choice: yóò tú ká
  rationale: Ó fi ìtúká àwọn àgùntàn hàn lọ́nà àdánidá; bí ó tilẹ̀ jẹ́ pé Yorùbá kò fi passive hàn bí Gíríìkì, kò sọ ẹni tó tú wọn ká ní pàtó.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: àwọn àgùntàn inú agbo
  rationale: Ó pa àwọn eroja méjèèjì, ‘àgùntàn’ àti ‘agbo,’ mọ́ láìjẹ́ kí gbólóhùn náà dà bí èdè àjèjì.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλισθήσεσθε ní ìbáṣepọ̀ pẹ̀lú Jésù
  choice: ‘Kọsẹ̀’ ni a lò, pẹ̀lú àlàyé pé nínú àyíká yìí ó ní agbára ìtumọ̀ pípa Jésù tì.
  alternative: ‘Ẹ ó fi mí sílẹ̀’ tàbí ‘ẹ ó yí kúrò lọ́dọ̀ mi.’
  rationale: Èyí pa àwòrán àti ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àyíká àti àlàyé ìsàlẹ̀ ojú ewé ń ṣàlàyé ìkọ̀sílẹ̀ àwọn ọmọ-ẹ̀yìn láìsọ pé ó jẹ́ ìpẹ̀yìndà ayérayé.
- issue: Àkókò historical present λέγει
  choice: Àkókò tí ó ti kọjá, ‘sọ,’ ni a lò.
  alternative: Àkókò ìsinsìnyí, ‘ń sọ.’
  rationale: Yorùbá sábà máa ń ṣe ìtàn ìṣẹ̀lẹ̀ tó ti ṣẹlẹ̀ pẹ̀lú ‘sọ’; fífi ‘ń sọ’ síbí lè dà bí ìṣe tó ń lọ lọ́wọ́ dípò historical present. Ìtumọ̀ ìṣẹ̀lẹ̀ kò yí padà.
- issue: Ẹni tí ó sọ ‘Èmi yóò lu’ nínú àyọlò Sekaráyà 13:7
  choice: A pa ẹni àkọ́kọ́ ‘Èmi’ mọ́ láìfikún àlàyé sí ọ̀rọ̀ pàtàkì.
  alternative: Ṣíṣe àfihàn ẹni tó ń sọ̀rọ̀ gẹ́gẹ́ bí Ọlọ́run nínú ara ẹsẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘Èmi’ nìkan; fífi orúkọ ẹni tó ń sọ̀rọ̀ kún un yóò kọjá ohun tí Mátíù sọ níbí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Olùṣọ́-àgùntàn’ àti ‘àwọn àgùntàn inú agbo’ pa àwòrán Ìwé Mímọ́ mọ́, nígbà tí ìṣètò gbólóhùn náà jẹ́ àdánidá fún òǹkàwé Yorùbá.
