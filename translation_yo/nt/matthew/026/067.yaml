  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: yo
  text: Nígbà náà, wọ́n tutọ́ sí ojú rẹ̀, wọ́n sì fi ìkùùkù lù ú[a]; àwọn mìíràn sì fi àtẹ́lẹwọ́ lù ú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n lù ú.” Ọ̀rọ̀ Gíríìkì náà sábà ń tọ́ka sí lílu ní ìkùùkù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn mìíràn sì lù ú.” Ọ̀rọ̀ Gíríìkì náà sábà ń tọ́ka sí lílu pẹ̀lú ọwọ́ ṣíṣí tàbí àtẹ́lẹwọ́, ṣùgbọ́n kò sọ ibi tí ìlù náà kàn pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó ń tọ́ka sí ohun tó ṣẹlẹ̀ lẹ́yìn èyí tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀síwájú nínú ìtàn Yorùbá.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: wọ́n tutọ́ sí ojú rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí títutọ́ sí ojú ẹni ní tààràtà gẹ́gẹ́ bí ìṣe ẹ̀gàn; ‘sí ojú rẹ̀’ jẹ́ Yorùbá àdánidá, kò sì dín agbára ìṣe náà kù.
- source_word: ἐκολάφισαν αὐτόν
  choice: wọ́n sì fi ọwọ́ lù ú ní ìkùùkù
  rationale: κολαφίζω sábà ń tọ́ka sí lílu ní ìkùùkù. Gbólóhùn yìí sọ irú ìlù náà ní kedere láì lo ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ ọ̀nà.
- source_word: οἱ δὲ ἐράπισαν
  choice: àwọn mìíràn sì gbá a létí
  rationale: οἱ δέ ń yà àwọn mìíràn sọ́tọ̀, ῥαπίζω sì sábà túmọ̀ sí lílu pẹ̀lú àtẹ́lẹwọ́. ‘Gbá a létí’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi àtẹ́lẹwọ́ gbá ẹni, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì kò sọ apá ojú pàtó.
- source_word: δέ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àyípadà kékeré sí ìṣe ẹgbẹ́ mìíràn, kì í ṣe ìtakò líle; ‘sì’ bá ìṣàn ìtàn Yorùbá mu.
theological_decisions:
- issue: Àpèjúwe bí wọ́n ṣe tẹ́ńbẹ́lú Jésù tí wọ́n sì ṣe é ní ìkà
  choice: 'Ṣàpèjúwe àwọn ìṣe náà ní kedere: títutọ́ sí ojú, lílu ní ìkùùkù, àti fífi àtẹ́lẹwọ́ gbá a.'
  alternative: Lo ọ̀rọ̀ gbogbogbò bí ‘wọ́n ṣe é ní ibi’ tàbí ‘wọ́n lù ú.’
  rationale: Ọ̀rọ̀ ìpilẹ̀ sọ ẹ̀gàn àti ìpalára ara náà ní kíkún. Ìtumọ̀ tó ṣe pàtó pa agbára ìtàn mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A yan ‘ní ìkùùkù’ àti ‘gbá a létí’ láti fi ìyàtọ̀ àwọn ọ̀nà lílu méjèèjì hàn, pẹ̀lú àlàyé ìtumọ̀ mìíràn ní àlàyé ìsàlẹ̀.
