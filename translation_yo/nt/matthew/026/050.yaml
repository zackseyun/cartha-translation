  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún un pé, “Ọ̀rẹ́, ṣe ohun tí o wá ṣe.”[a] Nígbà náà ni wọ́n sún mọ́ ọn, wọ́n na ọwọ́ wọn mú Jésù, wọ́n sì di í mú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀rẹ́, kí ni o wá ṣe?” Gbólóhùn Gíríìkì náà kúrú, a sì lè lóye rẹ̀ gẹ́gẹ́ bí ìbéèrè.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Ọ̀rẹ́
  rationale: Ọ̀rọ̀ ìpè sí Júdásì ni; “Ọ̀rẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì pa ìṣọ́ra inú ọ̀rọ̀ náà mọ́ láì fi hàn pé wọ́n jẹ́ ọ̀rẹ́ tímọ́tímọ́.
- source_word: ἐφ’ ὃ πάρει
  choice: ṣe ohun tí o wá ṣe
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì lè jẹ́ ọ̀rọ̀ ìyọ̀ǹda tàbí ìbéèrè. Ìtumọ̀ yìí bá ọ̀rọ̀ inú àyíká mu, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ìbéèrè mọ́.
- source_word: προσελθόντες
  choice: wọ́n sún mọ́ ọn
  rationale: Ó fi ìṣípò àwọn tó fẹ́ mú Jésù tọ́ka sí lọ́nà Yorùbá àdánidá.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: wọ́n na ọwọ́ mú Jésù
  rationale: Ìsọ̀rọ̀ yìí fi hàn gbangba pé wọ́n fi ọwọ́ gbá Jésù mú, láì fi ìtumọ̀ òfin kún ọ̀rọ̀ orísun.
- source_word: ἐκράτησαν αὐτόν
  choice: wọ́n sì fà á mú
  rationale: “Fà á mú” sọ agbára àti ìdádúró ẹni náà jáde, ó sì yẹra fún fífi ọ̀rọ̀ òfin bí “mú un lẹ́wọ̀n” sínú ọ̀rọ̀ náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora láàárín ìṣe Júdásì àti ìdáhùn Jésù hàn.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Jésù sí Júdásì
  choice: “Ọ̀rẹ́, ṣe ohun tí o wá ṣe.”
  alternative: “Ọ̀rẹ́, kí ni o wá ṣe?”
  rationale: A kò mú kí ọ̀rọ̀ Jésù rọ̀ ju bó ṣe rí lọ tàbí kí ó le ju bẹ́ẹ̀ lọ. Gbólóhùn Gíríìkì náà kúrú, ó sì ní àìdánilójú gidi; nítorí náà, a fi ìtumọ̀ kejì sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó lọ́lá, tí àwọn òǹkàwé òde òní lè lóye. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá; a sì pa kíkuru àti ìṣòro ìtumọ̀ ọ̀rọ̀ Jésù mọ́.
