  to: Ṣùgbọ́n Jésù sọ fún un pé, “Ọ̀rẹ́, ṣe ohun tí o wá ṣe.”[a] Nígbà náà ni wọ́n sún mọ́ ọn, wọ́n na ọwọ́ wọn mú Jésù, wọ́n sì di í mú.
