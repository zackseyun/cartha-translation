id: MAT.26.47
reference: Matthew 26:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: yo
  text: Nígbà tí ó ṣì ń sọ̀rọ̀, wò ó, Júdásì, ọ̀kan lára àwọn méjìlá, dé, ogunlọ́gọ̀ ńlá sì wá pẹ̀lú rẹ̀, wọ́n mú idà àti kùmọ̀,[a] tí ó ti ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn wá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀pá.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí àwọn ègé igi, ṣùgbọ́n ó ṣeé ṣe kí wọ́n lò wọ́n bí kùmọ̀ níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn rán.” Ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé ogunlọ́gọ̀ náà wá “láti ọ̀dọ̀” wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Nígbà tí ó ṣì ń sọ̀rọ̀
  rationale: Ó fi hàn pé ìṣe méjèèjì ń ṣẹlẹ̀ ní àkókò kan náà, “ṣì” sì mú ìtumọ̀ ἔτι jáde ní Yorùbá àdánidá.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: A pa àmì àsọyé yìí mọ́ láti pe àfiyèsí sí ìṣẹ̀lẹ̀ òjijì tó tẹ̀ lé e, láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: Ἰούδας
  choice: Júdásì
  rationale: Ìkọ orúkọ ẹni yìí tí ó wọ́pọ̀ ní Yorùbá.
- source_word: εἷς τῶν δώδεκα
  choice: ọ̀kan lára àwọn méjìlá
  rationale: Ó fi ìbáṣepọ̀ apá-sí-àpapọ̀ inú ọ̀rọ̀ Gíríìkì hàn ní kedere.
- source_word: ἦλθεν
  choice: dé
  rationale: Ọ̀rọ̀ àpéjọ tó bá ìtàn náà mu, tí ó sì ṣàfihàn dídé Júdásì.
- source_word: ὄχλος πολὺς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ogunlọ́gọ̀ ńlá ni, láì fi ìwà jagidijagan kún ọ̀rọ̀ náà.
- source_word: μετὰ μαχαιρῶν
  choice: wọ́n mú idà
  rationale: “Idà” jẹ́ ọ̀rọ̀ Yorùbá tó gbooro tó sì yẹ fún μάχαιρα; àtúnṣe gbolohun sí “wọ́n mú” jẹ́ kí ìtumọ̀ ohun ìjà tí wọ́n ní lọ́wọ́ ṣe kedere.
- source_word: καὶ ξύλων
  choice: àti kùmọ̀
  rationale: Ní àyíká yìí ξύλα jẹ́ àwọn igi tí a lò gẹ́gẹ́ bí ohun ìjà; “kùmọ̀” sọ ìlò náà jáde, nígbà tí àlàyé ìsàlẹ̀ fi “ọ̀pá” hàn gẹ́gẹ́ bí òmíràn.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: Láti ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn ni wọ́n ti wá
  rationale: “Láti ọ̀dọ̀” pa ìtumọ̀ orísun inú ἀπό mọ́, kò sì sọ ní pàtó pé wọ́n rán wọn nígbà tí Gíríìkì kò lo ọ̀rọ̀-ìṣe “rán.”
theological_decisions:
- issue: Bóyá kí a sọ ní tààrà pé àwọn aṣáájú àwọn Júù ló rán ọ̀pọ̀ ènìyàn náà
  choice: Láti ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn ni wọ́n ti wá
  alternative: Àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn ni wọ́n rán wọn
  rationale: Àyíká lè túmọ̀ sí pé àwọn aṣáájú náà fún wọn ní àṣẹ, ṣùgbọ́n ἀπό sọ orísun nìkan ní tààrà. A pa àìdánilójú yẹn mọ́ nínú ọ̀rọ̀ pàtàkì, a sì fi ìtumọ̀ tó ṣeé ṣe sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Kíyèsí i” pa agbára àsọyé ἰδοὺ mọ́; “olórí àlùfáà” àti “àgbààgbà àwọn ènìyàn” jẹ́ àwọn ọ̀rọ̀ ìjọba-ẹ̀sìn tó mọ́gbọ́n dání láì gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọ inú ẹsẹ náà.
