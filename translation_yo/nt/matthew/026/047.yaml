- from: Nígbà tí ó ṣì ń sọ̀rọ̀, kíyèsí i, Júdásì, ọ̀kan lára àwọn méjìlá, dé; ọ̀pọ̀ ènìyàn sì bá a wá, wọ́n mú idà àti kùmọ̀.[a] Láti ọ̀dọ̀ àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn ni wọ́n ti wá.[b]
