source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γενομένου ἐν Βηθανίᾳ ἐν οἰκίᾳ Σίμωνος τοῦ λεπροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: yo
  text: Nígbà tí Jésù wà ní Bẹ́tánì[a], nínú ilé Símónì, adẹ́tẹ̀ náà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “nígbà tí Jésù wà ní Bẹ́tánì.” Gíríìkì lo gbólóhùn genitive absolute láti ṣètò àkókò àti ipò ìṣẹ̀lẹ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: “Adẹ́tẹ̀” ń ṣe àpèjúwe tí a fi ń dá Símónì mọ̀ nínú Gíríìkì; ọ̀rọ̀ náà nìkan kò sọ bóyá àìsàn náà ṣì wà lára rẹ̀ nígbà yẹn tàbí pé ó ti wà lára rẹ̀ rí.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Nígbà tí Jésù wà
  rationale: Gbólóhùn genitive absolute yìí ń fi àkókò àti ipò ìṣẹ̀lẹ̀ hàn. “Nígbà tí Jésù wà” jẹ́ Yorùbá àdánidá, ó sì lè ru ìtumọ̀ “nígbà tí” tàbí “níwọ̀n ìgbà tí/nígbà tí ó ṣì wà” gẹ́gẹ́ bí àyíká ṣe ń béèrè. A kò tú γίνομαι ní ọ̀rọ̀-lẹ́nu-ọ̀rọ̀ sí “di” nítorí pé ìlò rẹ̀ níbí jẹ́ ti ṣíṣètò ìṣẹ̀lẹ̀.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: δὲ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń yí ìṣẹ̀lẹ̀ padà, kì í ṣe àtakò líle. Nínú Yorùbá, ìbẹ̀rẹ̀ gbólóhùn àkókò náà ti mú ìyípadà ìtàn náà jáde láìfi “ṣùgbọ́n” tàbí “nísinsìnyí” tí kò bójú mu kún un.
- source_word: ἐν Βηθανίᾳ
  choice: ní Bẹ́tánì
  rationale: Ìtumọ̀ ibi tí ἐν pẹ̀lú orúkọ ìlú Βηθανία ń tọ́ka sí.
- source_word: ἐν οἰκίᾳ
  choice: ní ilé
  rationale: οἰκία ń tọ́ka sí ilé gẹ́gẹ́ bí ibi tí ìṣẹ̀lẹ̀ ti ṣẹlẹ̀; “ní ilé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere tó sì jẹ́ àdánidá.
- source_word: Σίμωνος
  choice: Símónì
  rationale: Genitive náà fi ẹni tí ilé jẹ́ tirẹ̀ hàn; ìṣètò Yorùbá “ilé Símónì” ti sọ ìní náà di mímọ̀ láìlò ọ̀rọ̀ míì.
- source_word: τοῦ λεπροῦ
  choice: adẹ́tẹ̀
  rationale: λεπρός jẹ́ àpèjúwe ìdánimọ̀ tí a so mọ́ Símónì. “Adẹ́tẹ̀” jẹ́ ọ̀rọ̀ Yorùbá ṣókí tí a mọ̀ dáadáa, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì kò sọ bóyá àìsàn náà ṣì wà lára rẹ̀ tàbí pé ó ti wà lára rẹ̀ rí.
theological_decisions:
- issue: Bóyá àpèjúwe “adẹ́tẹ̀” túmọ̀ sí pé àìsàn náà ṣì wà lára Símónì
  choice: Pa àpèjúwe ìdánimọ̀ “Símónì adẹ́tẹ̀” mọ́ láìsọ pé ó ṣì ní àìsàn náà tàbí pé a ti mú un láradá.
  alternative: Símónì, ẹni tí ó ti jẹ́ adẹ́tẹ̀ rí; tàbí Símónì, ọkùnrin tí ó ní àrùn awọ ara kan
  rationale: Gíríìkì kàn lo àpèjúwe náà láti dá Símónì mọ̀; kò sọ àkókò àìsàn náà tàbí irú àìsàn tí ìmọ̀ ìṣègùn òde òní yóò pè é. Nítorí náà, a kò fi àṣà ìtúmọ̀ tàbí ìròyìn ìwòsàn tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì pa ìṣòro ìtumọ̀ ti gbólóhùn àkókò àti ipò Símónì mọ́ láìyanju rẹ̀ ní ọ̀nà ẹ̀kọ́ ìsìn kan.
