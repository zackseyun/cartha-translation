id: MAT.26.55
reference: Matthew 26:55
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: yo
  text: Ní wákàtí náà, Jésù sọ fún ọ̀pọ̀ ènìyàn náà pé, “Ṣé ẹ jáde wá pẹ̀lú idà àti ọ̀pá ìjà láti mú mi bí ẹni pé ọlọ́ṣà ni mí?[a] Lójoojúmọ́ ni mo máa ń jókòó nínú àgbàlá tẹ́ńpìlì, tí mo sì ń kọ́ni, ẹ kò sì gbé ọwọ́ yín lé mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “adigunjalè” tàbí “ọlọ̀tẹ̀.” Ọ̀rọ̀ Gíríìkì náà, λῃστής, lè tọ́ka sí adigunjalè oníwà ipá tàbí ọlọ̀tẹ̀ ní àwọn àyíká kan; kì í ṣe olè kékeré nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Ní wákàtí náà
  rationale: Ó pa ìtẹnumọ́ àkókò Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: τοῖς ὄχλοις
  choice: fún àwọn èrò
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀; ‘àwọn èrò’ fi ọ̀pọ̀ náà hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: bí ẹni pé ọlọ́ṣà ni mí
  rationale: Ó sọ ìbéèrè àfiwé náà ní Yorùbá àdánidá láì fi dandan túmọ̀ λῃστής sí ọlọ̀tẹ̀ olóṣèlú.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: pẹ̀lú idà àti kùmọ̀
  rationale: ‘Idà’ àti ‘kùmọ̀’ ṣàfihàn àwọn ohun ìjà tí ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe igi lásán.
- source_word: συλλαβεῖν με
  choice: láti mú mi
  rationale: Nínú àyíká yìí, ‘mú’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún dídadúró ẹni tàbí fífi ẹni sábẹ́ àṣẹ.
- source_word: καθ’ ἡμέραν
  choice: Lójoojúmọ́
  rationale: Ó fi ìṣe tó ń ṣẹlẹ̀ ní gbogbo ọjọ́ hàn ní ṣókí àti ní kedere.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan; ‘àgbàlá tẹ́ńpìlì’ mú ìyàtọ̀ yìí hàn fún òǹkàwé.
- source_word: ἐκαθεζόμην διδάσκων
  choice: ni mo máa ń jókòó ... tí mo sì ń kọ́ni
  rationale: Ìtumọ̀ yìí pa ìṣe àṣà tó ń bá a lọ nínú imperfect àti iṣẹ́ ìkọ́ni tó ń ṣẹlẹ̀ lẹ́gbẹ̀ẹ́ rẹ̀ mọ́.
- source_word: οὐκ ἐκρατήσατέ με
  choice: ẹ kò mú mi
  rationale: ‘Mú’ ṣe àfihàn gbígba ẹni ní agbára; àyíká gbolohun náà mú kí ìtumọ̀ rẹ̀ ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ λῃστής nínú ìbéèrè Jésù
  choice: ọlọ́ṣà
  alternative: ọlọ́ṣà oníjà tàbí ọlọ̀tẹ̀
  rationale: λῃστής lè túmọ̀ sí ju olè kékeré lọ, tó fi mọ́ adigunjalè tàbí ọlọ̀tẹ̀ ní àwọn àyíká kan. Ẹsẹ yìí kò fipá mú ìtumọ̀ olóṣèlú kan pàtó, nítorí náà a lo ‘ọlọ́ṣà’ nínú ọ̀rọ̀ pàtàkì, a sì pa àwọn ìtumọ̀ tó gbòòrò mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ṣé ẹ’ bá ọ̀rọ̀ tí a sọ fún ọ̀pọ̀ ènìyàn mu; ‘kùmọ̀’ jẹ́ ohun ìjà igi, ‘àgbàlá tẹ́ńpìlì’ sì yà ἱερόν sọ́tọ̀ kúrò ní ibi mímọ́ inú ilé.
