language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: yo
  text: Ó sì wí pé, “Ẹ lọ sínú ìlú, sí ọ̀dọ̀ ọkùnrin kan[a], kí ẹ sì sọ fún un pé, ‘Olùkọ́ náà ní, “Àkókò mi ti sún mọ́. Ní ọ̀dọ̀ rẹ[c] ni èmi yóò ṣe Ìrékọjá[b] pẹ̀lú àwọn ọmọ-ẹ̀yìn mi.”’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ọ̀dọ̀ ẹni-báyìí.” Ọ̀rọ̀ Gíríìkì ń tọ́ka sí ẹni pàtó kan tí a mọ̀ọ́mọ̀ kò dárúkọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì jẹ́, “ṣe Ìrékọjá”; ó tún lè túmọ̀ sí “ṣe ayẹyẹ Ìrékọjá” tàbí “pa ayẹyẹ Ìrékọjá mọ́.”
    reason: lexical_alternative
  - marker: c
    text: Ní ti gidi, “pẹ̀lú rẹ” tàbí “sí ọ.” Nínú àyíká yìí, ó ń tọ́ka sí ibi tí ẹni náà yóò ti gbà wọ́n.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Ẹ lọ
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni; ‘Ẹ lọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, láìfi ìtumọ̀ míì kún un.
- source_word: πρὸς τὸν δεῖνα
  choice: sí ọ̀dọ̀ ọkùnrin kan
  rationale: Ó ń tọ́ka sí ọkùnrin pàtó kan tí a mọ̀ọ́mọ̀ kò dárúkọ; ‘ọkùnrin kan’ pa àìsọ orúkọ náà mọ́ ní èdè Yorùbá tó ṣe déédéé.
- source_word: Ὁ διδάσκαλος
  choice: Olùkọ́ náà
  rationale: ‘Olùkọ́’ túmọ̀ διδάσκαλος ní tààrà, ‘náà’ sì fi hàn pé akọ́lé ẹni tí wọ́n mọ̀ ni.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Àkókò mi ti sún mọ́lé
  rationale: Ó pa ìtumọ̀ àkókò pàtàkì tí ó sún mọ́lé mọ́, láìpinnu pé ikú, oúnjẹ Ìrékọjá, tàbí gbogbo ìparí iṣẹ́ Jesu nìkan ni.
- source_word: πρὸς σὲ
  choice: ní ọ̀dọ̀ rẹ
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì ju ‘ní ilé rẹ’ lọ, ó sì lè tọ́ka sí ibùdó tàbí àlejò ẹni náà láìfi ‘ilé’ tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: ποιῶ τὸ πάσχα
  choice: yóò ṣe Ìrékọjá
  rationale: ‘Ṣe Ìrékọjá’ jẹ́ àfihàn tó mọ́gbọ́n dání fún àsọyé Gíríìkì ‘ṣe’ Ìrékọjá, ó sì jẹ́ kí ìtumọ̀ ṣí sí ṣíṣe ayẹyẹ tàbí pípa àjọ náà mọ́.
- source_word: τὸ πάσχα
  choice: Ìrékọjá
  rationale: Èyí ni orúkọ Yorùbá tó wọ́pọ̀ fún àjọ Passover ti àwọn Júù.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: pẹ̀lú àwọn ọmọ-ẹ̀yìn mi
  rationale: ‘Àwọn ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tó fìdí múlẹ̀ fún μαθηταί, tó sì pa ìbáṣepọ̀ wọn pẹ̀lú Jesu mọ́.
theological_decisions:
- issue: Ìtumọ̀ καιρός gẹ́gẹ́ bí àkókò Jesu tó sún mọ́lé
  choice: Àkókò mi ti sún mọ́lé
  alternative: Àkókò tí a yàn fún mi ti sún mọ́lé; wákàtí mi ti sún mọ́lé
  rationale: Ẹsẹ̀ náà sọ pé àkókò náà sún mọ́lé, ṣùgbọ́n kò fi ara rẹ̀ sọ bóyá ó ń tọ́ka sí ikú Jesu nìkan, oúnjẹ Ìrékọjá, tàbí ìparí iṣẹ́ rẹ̀ lápapọ̀. Ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Bí a ṣe máa túmọ̀ πρὸς σὲ nínú ọ̀rọ̀ àlejò
  choice: ní ọ̀dọ̀ rẹ
  alternative: ní ilé rẹ; pẹ̀lú rẹ
  rationale: ‘Ní ọ̀dọ̀ rẹ’ kò fi ‘ilé’ tí kò hàn gbangba nínú Gíríìkì kún un, ó sì tún bá àyíká ibi tí a ó ti ṣe Ìrékọjá mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ ti ẹ̀dá èdè. Àyọkà náà pa àsọyé inú àsọyé àti àìdánilójú gidi ti καιρός àti πρὸς σὲ mọ́.
