  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbò: ẹni náà jẹ́ ẹni pàtó tí a kò dárúkọ, ‘Olùkọ́ náà’ yẹ fún ὁ διδάσκαλος, àti ‘Àkókò mi ti sún mọ́’ pa ìṣókùnfà καιρός mọ́. Ṣùgbọ́n ‘èmi yóò ti ṣe Ìrékọjá’ lè ka sí ọjọ́-ọ̀la tí ìṣe náà ti parí tẹlẹ̀ (future perfect), níbi tí ποιῶ ti ń sọ nípa ṣíṣe/ṣíṣe ayẹyẹ náà ní ìpele tí ó sún mọ́. A tún fi àlàyé ẹsẹ̀-sàlẹ̀ kún ‘ní ọ̀dọ̀ rẹ’ láti ṣàfihàn pé πρὸς σέ kò sọ ‘ilé’ ní kedere.'
  naturalness: ‘Àkókò mi ti sún mọ́’ jẹ́ èdè Yorùbá boṣewa tó rọrùn ju ‘ti sún mọ́lé’ lọ nínú àyíká yìí. ‘Ní ọ̀dọ̀ rẹ ni èmi yóò ṣe’ jẹ́ ìlànà Yorùbá tó dára, ó sì yàgò fún ìtumọ̀ ọjọ́-ọ̀la-tí-parí tí ‘yóò ti ṣe’ lè mú wá.
  terminology: ‘Ìrékọjá’ àti ‘àwọn ọmọ-ẹ̀yìn mi’ jẹ́ ọ̀rọ̀ tí ó fìdí múlẹ̀. ‘Olùkọ́ náà’ pa iṣẹ́ διδάσκαλος gẹ́gẹ́ bí akọ́lé tí a mọ̀ mọ́, láìrọ́pò rẹ̀ pẹ̀lú ọ̀rọ̀ míì tó lè yí ìtumọ̀ padà.
