    rationale: Àkójọpọ̀ ‘yóò ti ṣe’ lè túmọ̀ sí pé ìṣe náà yóò ti parí ní àkókò ọjọ́-ọ̀la kan. Kò dáa fún ποιῶ nínú ọ̀rọ̀ ìpèsè ayẹyẹ tí ó ń bọ̀. ‘Èmi yóò ṣe Ìrékọjá’ ṣàfihàn ìmọ̀ ọjọ́-ọ̀la/ìpinnu tí àyíká ń béèrè, láìfi apá ìparí kún un.
  - severity: low
