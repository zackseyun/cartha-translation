base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó jáde lọ sí ẹnu-ọ̀nà àgbàlá, obìnrin mìíràn rí i, ó sì ń sọ fún àwọn tí ó wà níbẹ̀ pé, “Ọkùnrin yìí wà pẹ̀lú Jésù ará Násárétì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: ẹnu ọ̀nà àgbàlá
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹnu ọ̀nà tàbí ibi àbáwọlé sí àgbàlá ilé, kì í ṣe ọ̀nà lasan.
- source_word: ἄλλη
  choice: obìnrin mìíràn
  rationale: Ìṣírí abo nínú ọ̀rọ̀ Gíríìkì àti àyíká ẹsẹ̀ ṣáájú fi hàn pé obìnrin mìíràn ni.
- source_word: λέγει
  choice: ó sì sọ
  rationale: Ìsinsìnyí ìtàn Gíríìkì ni; Yorùbá àdánidá máa ń sọ ìṣẹ̀lẹ̀ ìtàn bẹ́ẹ̀ ní ọ̀nà yìí láìfi ìyípadà àkókò tí kò ṣe pàtàkì hàn.
- source_word: τοῦ Ναζωραίου
  choice: ará Násárétì
  rationale: Ó túmọ̀ sí ẹni tí ó jẹ́ ti Násárétì tàbí tí ó wá láti ibẹ̀.
theological_decisions: []
