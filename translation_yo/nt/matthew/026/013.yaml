  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èdè Gíríìkì dáadáa ní gbogbogbòò: ìkéde ìhìn rere náà, ìwọ̀n ‘ní gbogbo ayé,’ iṣẹ́ obìnrin náà, àti ète ìrántí rẹ̀ wà níbẹ̀. Ṣùgbọ́n ‘tí a bá ti kéde’ lè fúnni ní ìmọ̀lára pé ìkéde náà ti ṣẹlẹ̀ tẹ́lẹ̀, níbi tí ὅπου ἐὰν κηρυχθῇ ti ń sọ ipò ọjọ́ iwájú tí kò dá lórí ibì kan. ‘tún’ sì ń mú καί (‘pẹ̀lú/ẹ̀wẹ̀, náà’) hàn kedere ju ‘sì’ lọ nínú àyíká yìí.'
