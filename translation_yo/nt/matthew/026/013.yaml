  to: “Lóòótọ́ ni mo sọ fún yín, níbikíbi tí a bá kéde ìhìn rere yìí[a] ní gbogbo ayé, a ó tún sọ ohun tí obìnrin yìí ṣe gẹ́gẹ́ bí ohun ìrántí rẹ̀.”[b]
