id: MAT.26.13
reference: Matthew 26:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: yo
  text: “Lóòótọ́ ni mo sọ fún yín, níbikíbi tí a bá kéde ìhìn rere yìí[a] ní gbogbo ayé, a ó tún sọ ohun tí obìnrin yìí ṣe gẹ́gẹ́ bí ohun ìrántí rẹ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìnrere yìí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó tún sọ ohun tí obìnrin yìí ṣe ní ìrántí rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Ó mú ìtẹnumọ́ ọ̀rọ̀ Jesu jáde ní Yorùbá àdánidá, dípò lílo ọ̀rọ̀ àyálò ‘Àmín’ ní ìbẹ̀rẹ̀ gbólóhùn.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ tí a fi ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀.
- source_word: ὅπου ἐὰν
  choice: níbikíbi tí ... bá ti
  rationale: Ó pa ìtumọ̀ ibi tí kò dá lórí ibì kan pàtó mọ́, ó sì bá ìlànà gbólóhùn Yorùbá mu.
- source_word: κηρυχθῇ
  choice: a bá ti kéde
  rationale: ‘Kéde’ dá ìṣe akéde ní gbangba tí κηρύσσω ní sílẹ̀, láì dín un kù sí ìwàásù inú ìjọ nìkan.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: ìhìn rere yìí
  rationale: ‘Ìhìn rere’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún εὐαγγέλιον; àṣàyàn ìbílẹ̀ ‘ìhìnrere’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: ní gbogbo ayé
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì mú ìwọ̀n gbogbo κόσμος jáde.
- source_word: λαληθήσεται
  choice: a ó sì sọ
  rationale: Fáwẹ́lì ọjọ́ iwájú aláìlórúkọ ṣe aṣojú future passive Gíríìkì ní ọ̀nà Yorùbá àdánidá; ohun tí a máa sọ ni iṣẹ́ obìnrin náà.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ohun tí obìnrin yìí ṣe
  rationale: Ó mú ohun tí arọ́pò-orúkọ Gíríìkì tọ́ka sí hàn gbangba láti inú àyíká ọ̀rọ̀.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: láti fi ṣe ìrántí rẹ̀
  rationale: Ó pa ète ìrántí tàbí ìrántí-ayẹyẹ mọ́, láì pinnu pé ẹni náà ń gba ọlá ẹ̀sìn kan.
theological_decisions:
- issue: Ìtumọ̀ εὐαγγέλιον
  choice: ìhìn rere
  alternative: ìhìnrere
  rationale: ‘Ìhìn rere’ ṣí ìtumọ̀ ọ̀rọ̀ náà sí òǹkàwé lónìí, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀rọ̀ ìbílẹ̀ tí ó ní ìforúkọsílẹ̀ ẹ̀sìn mọ́.
- issue: Ìbáṣepọ̀ εἰς μνημόσυνον αὐτῆς pẹ̀lú ohun tí a ó sọ
  choice: láti fi ṣe ìrántí rẹ̀
  alternative: a ó sọ ọ́ gẹ́gẹ́ bí ohun ìrántí fún un
  rationale: A pa àìdánilójú díẹ̀ mọ́ nípa bóyá sísọ iṣẹ́ náà fúnra rẹ̀ ni ìrántí náà tàbí bóyá a sọ iṣẹ́ náà ní ọ̀nà ìrántí; a kò fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè tí ó ṣeé lóye. A lo ‘obìnrin yìí’ láti mú itọ́kasí αὕτη ṣe kedere. Àmì [a] wà lẹ́yìn gbolohun ‘ìhìn rere yìí,’ àmì [b] sì wà lẹ́yìn gbogbo ẹsẹ̀ nítorí pé àṣàyàn náà kan bí a ṣe lè so apá ìkẹyìn pọ̀.
