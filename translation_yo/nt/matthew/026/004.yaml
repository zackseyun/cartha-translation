translation:
  language: yo
  text: Wọ́n sì jọ gbìmọ̀ láti fi ẹ̀tàn mú Jésù kí wọ́n sì pa á.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: dìmọ̀ pọ̀
  rationale: Ó túmọ̀ sí pé wọ́n jọ gbìmọ̀ tàbí dìtẹ̀; ‘dìmọ̀ pọ̀’ jẹ́ èdè Yorùbá àdánidá tó fi ìgbìmọ̀ wọn hàn ní àyíká ọ̀rọ̀ yìí.
- source_word: δόλῳ
  choice: fi ẹ̀tàn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọgbọ́n àrékérekè tàbí ẹ̀tàn, kì í ṣe ‘ní ìkọ̀kọ̀’ nìkan.
- source_word: κρατήσωσιν
  choice: mú
  rationale: Nínú àyíká yìí, ó túmọ̀ sí láti mú ẹni kan, kí wọ́n sì fi í sí àtìmọ́lé.
- source_word: ἀποκτείνωσιν
  choice: pa á
  rationale: 'Ó ṣàlàyé ète wọn ní tààràtà: láti pa Jésù.'
