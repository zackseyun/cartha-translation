  to: Nígbà náà ni olórí àlùfáà fa aṣọ rẹ̀ ya[a], ó sì wí pé, “Ó ti sọ̀rọ̀-òdì sí Ọlọ́run! Kí la tún nílò àwọn ẹlẹ́rìí fún? Ẹ wò ó, nísinsìnyí ẹ ti gbọ́ ọ̀rọ̀-òdì náà.”
  rationale: A ṣàtúnṣe ọ̀rọ̀ ìjẹ́pàtàkì kan ṣoṣo láti jẹ́ kí ẹ̀sùn ìsọ̀rọ̀-òdì (blasphémy) hàn ní kedere nínú Yorùbá. ‘Sí Ọlọ́run’ nínú ìtumọ̀ yìí ń ṣàlàyé ìtumọ̀ ìlò ọ̀rọ̀ náà nínú àyíká ẹjọ́ Júù; ó ṣì jẹ́ ọ̀rọ̀ tí olórí àlùfáà sọ, kì í ṣe ìfọwọ́sí ẹ̀sùn náà látọ̀dọ̀ akọ̀ròyìn.
