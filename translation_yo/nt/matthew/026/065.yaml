id: MAT.26.65
reference: Matthew 26:65
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: yo
  text: Nígbà náà ni olórí àlùfáà fa aṣọ rẹ̀ ya[a], ó sì wí pé, “Ó ti sọ̀rọ̀-òdì sí Ọlọ́run! Kí la tún nílò àwọn ẹlẹ́rìí fún? Ẹ wò ó, nísinsìnyí ẹ ti gbọ́ ọ̀rọ̀-òdì náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yíya aṣọ ẹni jẹ́ àmì tí gbogbo ènìyàn lè rí, tó ń fi ìpayà, ìbànújẹ́, tàbí ìbínú ńlá hàn.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ àkókò tó ń tẹ ìtàn náà síwájú lọ́nà àdánidá.
- source_word: ὁ ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni tó ga jù lọ nínú iṣẹ́ àlùfáà Júù.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: fa aṣọ rẹ̀ ya
  rationale: Ó mú ìṣe líle ti yíya aṣọ hàn ní Yorùbá àdánidá; ‘aṣọ’ lè dúró gẹ́gẹ́ bí orúkọ àkójọpọ̀ fún τὰ ἱμάτια.
- source_word: λέγων
  choice: ó sì wí pé
  rationale: Ìtumọ̀ yìí so ọ̀rọ̀ olórí àlùfáà mọ́ ìṣe rẹ̀ lọ́nà tó rọrùn, tó sì ní iyì.
- source_word: Ἐβλασφήμησεν
  choice: Ó ti sọ ọ̀rọ̀-òdì
  rationale: ‘Ọ̀rọ̀-òdì’ fi ẹ̀sùn ẹ̀sìn àti òfin tó wà nínú βλασφημέω hàn, láìfi kún un ní pàtó pé ta ni ọ̀rọ̀ náà dojú kọ, nítorí Gíríìkì kò sọ ọ́ níbí.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Kí la tún nílò àwọn ẹlẹ́rìí fún?
  rationale: Ó jẹ́ Yorùbá àdánidá fún ìbéèrè náà, ó sì pa ìtumọ̀ ἔτι (‘tún’) àti μαρτύρων (‘àwọn ẹlẹ́rìí’) mọ́.
- source_word: ἴδε
  choice: Ẹ wò ó
  rationale: Àṣẹ yìí fa àfiyèsí àwọn tó ń gbọ́ sí ohun tí wọ́n ṣẹ̀ṣẹ̀ gbọ́; fọ́ọ̀mù ọ̀pọ̀ bá ἠκούσατε mu nínú ọ̀rọ̀ Yorùbá.
- source_word: νῦν ἠκούσατε τὴν βλασφημίαν
  choice: nísinsìnyí ẹ ti gbọ́ ọ̀rọ̀-òdì náà
  rationale: ‘Nísinsìnyí’ pa ìtẹnumọ́ àkókò mọ́, ‘ẹ ti gbọ́’ sì mú ipa ẹ̀rí lẹ́sẹ̀kẹsẹ̀ náà hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ẹ̀sùn βλασφημέω / βλασφημία
  choice: sọ ọ̀rọ̀-òdì / ọ̀rọ̀-òdì náà
  alternative: sọ̀rọ̀ ẹ̀gàn sí Ọlọ́run / ọ̀rọ̀ ẹ̀gàn sí Ọlọ́run
  rationale: Àyọkà náà ń ròyìn ẹ̀sùn olórí àlùfáà, kì í ṣe pé akọ̀ròyìn náà fọwọ́ sí i. ‘Ọ̀rọ̀-òdì’ pa ìwọ̀n ẹ̀sùn ẹ̀sìn náà mọ́, ó sì yẹra fún fífi ‘sí Ọlọ́run’ kún Gíríìkì níbi tí ẹni tí ọ̀rọ̀ náà dojú kọ kò ti hàn gbangba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A yan ‘wí’ dípò ‘sọ’ nínú gbólóhùn ìtàn láti pa ìwọ̀n ọ̀rọ̀ mímọ́ tó ṣeé lóye mọ́.
