id: MAT.26.43
reference: Matthew 26:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: yo
  text: Ó sì tún wá, ó bá wọn tí wọ́n ń sùn, nítorí ojú wọn ti wúwo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: Ó sì tún wá
  rationale: Aorist participle plus πάλιν marks his repeated coming before the main action; this finite Yoruba clause preserves the sequence naturally.
- source_word: εὗρεν αὐτοὺς
  choice: ó bá wọn
  rationale: In this narrative setting, bá naturally expresses finding or coming upon people in a particular state.
- source_word: καθεύδοντας
  choice: tí wọ́n ń sùn
  rationale: The progressive construction represents the ongoing action of the Greek present participle.
- source_word: ἦσαν γὰρ
  choice: nítorí ... ti
  rationale: Nítorí conveys the explanatory force of γάρ, while ti with the predicate presents the resulting condition.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: ojú wọn
  rationale: This is the natural Yoruba possessive construction for 'their eyes.'
- source_word: βεβαρημένοι
  choice: ti wúwo
  rationale: The perfect passive participle denotes a settled state of heaviness; Yoruba naturally describes the eyes as having become heavy rather than forcing a passive expression.
theological_decisions: []
translation_notes:
  register: Standard Yorùbá in a natural, dignified narrative register. Full tone marks are used; the source metaphor of heavy eyes is retained, with its idiomatic sense clarified in the footnote.
