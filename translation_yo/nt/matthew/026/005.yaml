  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n ń sọ pé, “Kì í ṣe nígbà àjọ̀dún náà,[a] kí rúkèrúdò má bàa ṣẹlẹ̀ láàárín àwọn ènìyàn.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nígbà àsè àjọ̀dún náà.” Ọ̀rọ̀ Gíríìkì ἑορτή lè túmọ̀ sí àjọ̀dún tàbí àsè àjọ̀dún nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí ìdàrúdàpọ̀ má bàa ṣẹlẹ̀,” tàbí “kí rúkèrúdò má bàa bẹ̀rẹ̀ láàárín àwọn ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: wọ́n ń sọ pé
  rationale: Àkókò aláìpé náà fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé wọ́n ń tún un sọ nínú ìgbìmọ̀ wọn; ‘wọ́n ń sọ pé’ pa ìtumọ̀ yìí mọ́.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora hàn sí ohun tó ṣáájú, bí wọ́n ṣe ṣọ́ra nípa àkókò tí wọn yóò gbé ìgbésẹ̀.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Kì í ṣe ní àkókò àjọ̀dún náà
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì ń sọ ìpinnu pé kí ohun tí wọ́n ń gbèrò má ṣe ṣẹlẹ̀ nígbà àjọ̀dún; ìtumọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa àkókò mọ́.
- source_word: ἑορτή
  choice: àjọ̀dún
  rationale: Nínú àyíká Ìrékọjá yìí, ọ̀rọ̀ náà túmọ̀ sí àjọ̀dún ẹ̀sìn; ‘àjọ̀dún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì dín un kù sí àsè jíjẹ nìkan.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète ìdènà tàbí ohun tí ẹni fẹ́ yẹra fún.
- source_word: θόρυβος
  choice: rúkèrúdò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ariwo, ìdàrúdàpọ̀, tàbí ìrúkèrúdò ní gbangba; ‘rúkèrúdò’ pa ìwọ̀n àìdájú náà mọ́ láì sọ ọ́ di ìṣọ̀tẹ̀ tó le koko dandan.
- source_word: γένηται
  choice: ṣẹlẹ̀
  rationale: Pẹ̀lú θόρυβος gẹ́gẹ́ bí ohun tó lè wáyé, ‘ṣẹlẹ̀’ jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé fún ‘wá sí ìwàláàyè/ṣẹlẹ̀.’
- source_word: ἐν τῷ λαῷ
  choice: láàárín àwọn ènìyàn
  rationale: Ó tọ́ka sí àárín àwọn ènìyàn tí wọ́n péjọ; gbolóhùn yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ àwùjọ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti ìgbàlódé, ọ̀wọ̀, ó sì ṣeé lóye fún gbogbo ènìyàn. Àmì ẹsẹ̀ [a] wà lẹ́yìn ‘àjọ̀dún náà,’ àmì [b] sì wà lẹ́yìn gbogbo gbólóhùn tó ní ‘rúkèrúdò,’ kí ọkọọkan lè tọ́ka sí àṣàyàn ọ̀rọ̀ tó yẹ.
