  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: yo
  text: Nítorí nígbà tí obìnrin yìí da òróró olóòórùn yìí sí ara mi[b], ó ṣe bẹ́ẹ̀ láti pèsè mi sílẹ̀ fún ìsìnkú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìsìnkú mi.” A lè túmọ̀ ọ̀rọ̀ Gíríìkì náà ní kúkúrú báyìí, ṣùgbọ́n ọ̀rọ̀-ìṣe rẹ̀ ní èrò pípèsè ara sílẹ̀ fún ìsìnkú nínú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ní dída òróró olóòórùn yìí sí ara mi, ó ṣe èyí.”
    reason: previous_rendering
lexical_decisions:
- source_word: βαλοῦσα
  choice: nígbà tí ... da
  rationale: Aorist participle βάλλω ní àyíká yìí túmọ̀ sí dída ohun olóòórùn sí ara, kì í ṣe jíju un. Gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ń mú àlàyé Jésù nípa ìṣe obìnrin náà wọlé.
- source_word: αὕτη
  choice: obìnrin yìí
  rationale: Èyí pa agbára atọ́ka ‘ẹni yìí’ mọ́, ó sì ṣe kedere nínú Yorùbá.
- source_word: μύρον
  choice: òróró olóòórùn
  rationale: μύρον jẹ́ òróró tàbí ohun ìkunra olóòórùn tí a fi ń fòróró yan; ‘òróró olóòórùn’ ṣe kedere, ó sì bá àṣà ọ̀rọ̀ náà mu ju ọ̀rọ̀ tí ó lè túmọ̀ sí lọ́fíńdà lasan lọ.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: sí ara mi
  rationale: ἐπί pẹ̀lú genitive níbí ń tọ́ka sí fífi ohun náà kan ara; ‘da ... sí ara mi’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: láti pèsè mi sílẹ̀ fún ìsìnkú
  rationale: πρός pẹ̀lú infinitive oní-artíkù ń fi ète hàn, ἐνταφιάζω sì ní ìtumọ̀ pípèsè òkú sílẹ̀ fún ìsìnkú, kì í ṣe ìsìnkú nìkan.
- source_word: ἐποίησεν
  choice: ó ṣe bẹ́ẹ̀
  rationale: Èyí tọ́ka padà sí dída òróró náà sí ara láìṣe àtúnsọ tí kò dùn létí.
theological_decisions:
- issue: Ìtumọ̀ ἐνταφιάζω ní ìbáṣepọ̀ pẹ̀lú ikú Jésù
  choice: Ìṣe obìnrin náà jẹ́ pípèsè Jésù sílẹ̀ fún ìsìnkú.
  alternative: Ìṣe náà wulẹ̀ jẹ́ ‘fún ìsìnkú mi’ láìṣe àfihàn pípèsè sílẹ̀.
  rationale: Ìtumọ̀ ọ̀rọ̀ náà dá lórí pípèsè ara sílẹ̀ fún ìsìnkú. Ìtumọ̀ yìí pa ìtọ́kasí Jésù sí ohun tí ń bọ̀ mọ́ láìfi ẹ̀kọ́ míì kún un.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye. ‘Òróró olóòórùn’ ṣàlàyé μύρον lọ́nà tó bá àyíká ìfòróróyan àti ìsìnkú mu.
