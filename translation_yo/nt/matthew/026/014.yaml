id: MAT.26.14
reference: Matthew 26:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: yo
  text: Nígbà náà, ọ̀kan nínú àwọn méjìlá[a], ẹni tí a ń pè ní Júdásì Iskariotu, lọ sọ́dọ̀ àwọn olórí àlùfáà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀kan nínú Àwọn Méjìlá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tó so ìṣẹ̀lẹ̀ yìí mọ́ èyí tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: πορευθεὶς
  choice: lọ
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó ń fi ìṣípò lọ sí ọ̀dọ̀ àwọn olórí àlùfáà hàn; lílo ọ̀rọ̀-ìṣe gangan yìí jẹ́ àdánidá ní Yorùbá.
- source_word: εἷς τῶν δώδεκα
  choice: ọ̀kan nínú àwọn méjìlá
  rationale: Ó pa ìtumọ̀ partitive mọ́, kò sì fi akọlé ẹgbẹ́ kan lé ọ̀rọ̀ Gíríìkì lórí.
- source_word: ὁ λεγόμενος
  choice: ẹni tí a ń pè ní
  rationale: Ó fi ìdánimọ̀ Júdásì hàn ní kedere, ó sì tẹ̀ lé ìtumọ̀ participle náà ní Yorùbá àdánidá.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Júdásì Iskariotu
  rationale: A ṣe àkọsílẹ̀ orúkọ àti àpèjẹ náà ní ìbámu pẹ̀lú ìlò Yorùbá.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: sọ́dọ̀ àwọn olórí àlùfáà
  rationale: πρός pẹ̀lú accusative ń fi ìlọ sí ibi tàbí sọ́dọ̀ ènìyàn hàn; ‘àwọn olórí àlùfáà’ tọ́ka sí àwọn aláṣẹ àgbà nínú ẹgbẹ́ àwọn àlùfáà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ τῶν δώδεκα gẹ́gẹ́ bí orúkọ ẹgbẹ́
  choice: ọ̀kan nínú àwọn méjìlá
  alternative: ọ̀kan nínú Ẹgbẹ́ Méjìlá
  rationale: Ìtumọ̀ tí a yàn pa ọ̀rọ̀ Gíríìkì mọ́ láìfi capitalisation tàbí akọlé ẹgbẹ́ tí kò hàn nínú ìpilẹ̀ṣẹ̀ kún un; àlàyé ìsàlẹ̀ fi ọ̀nà kejì hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá bá ìlò àdánidá mu; èdè náà ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní.
