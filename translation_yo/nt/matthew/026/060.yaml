  text: καὶ οὐχ εὗρον ⸂πολλῶν προσελθόντων ψευδομαρτύρων. ὕστερον δὲ προσελθόντες δύο⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/060.yaml
  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: yo
  text: Wọ́n kò rí nǹkan kan[a], bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ẹlẹ́rìí èké wá síwájú. Ṣùgbọ́n nígbà tó yá, ẹni méjì wá síwájú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò rí ọ̀kan”; Gíríìkì kò sọ ohun tí wọ́n kò rí ní tààrà, ṣùgbọ́n ó ń tọ́ka sí ẹ̀rí tàbí ẹ̀sùn tí wọ́n ń wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: wọn kò rí èyíkéyìí
  rationale: Ọ̀rọ̀ tí εὗρον ń tọ́ka sí kò farahàn ní Gíríìkì; àyíká ẹsẹ ṣáájú fi hàn pé ìgbìmọ̀ ń wá ẹ̀rí tàbí ẹ̀sùn tí wọ́n lè lò sí Jésù. “Èyíkéyìí” jẹ́ ọ̀nà àdánidá láti pa ìtumọ̀ yẹn mọ́ láì pinnu bóyá ẹ̀rí ni tàbí ẹ̀sùn.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ẹlẹ́rìí èké wá síwájú
  rationale: 'Èyí mú ìtumọ̀ ìtakora tí genitive absolute ní nínú àyíká yìí jáde: wọn kò rí ohun tí wọ́n ń wá, bó tilẹ̀ jẹ́ pé ọ̀pọ̀ ẹlẹ́rìí èké yọ síwájú. “Ẹlẹ́rìí èké” bá ipò ìdájọ́ mu ju ọ̀rọ̀ tí ó kan túmọ̀ sí òpùrọ́ lọ.'
- source_word: ὕστερον δὲ
  choice: Ṣùgbọ́n lẹ́yìn náà
  rationale: “Lẹ́yìn náà” tọ́ka sí àkókò tó tẹ̀ lé e, “ṣùgbọ́n” sì pa ìyípadà díẹ̀ nínú ìtàn mọ́.
- source_word: προσελθόντες δύο
  choice: ẹni méjì wá síwájú
  rationale: Nínú ọ̀rọ̀ ilé-ẹjọ́, “wá síwájú” jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá fún fífi ara ẹni hàn láti jẹ́rìí; “ẹni méjì” pa iye wọn mọ́ láì fi ohun tí Gíríìkì kò sọ kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbàṣe tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “wá síwájú” gẹ́gẹ́ bí ọ̀rọ̀ tó bá àyíká ìgbẹ́jọ́ mu, a sì fi àmì ohùn sí ibi tí ó bá àdánidá mu.
