id: MAT.26.34
reference: Matthew 26:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: yo
  text: Jésù sọ fún un pé, “Lóòótọ́ ni mo sọ fún ọ, ní òru yìí gan-an,[a] kí àkùkọ tó kọ,[b] ìwọ yóò sẹ́ mi ní ìgbà mẹ́ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ní alẹ́ òní.” Gíríìkì ní “ní òru yìí,” ọ̀rọ̀ “yìí” sì ní ìtẹnumọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “kí àkùkọ náà tó kọ.” Gíríìkì kò fi dandan béèrè atọ́ka tó túmọ̀ sí “náà” níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sọ fún un pé
  rationale: Èyí jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń ṣe àgbékalẹ̀ ọ̀rọ̀ tààrà, ó sì pa ẹni tí ó ń sọ̀rọ̀ àti ẹni tí a ń bá sọ̀rọ̀ mọ́.
- source_word: Ἀμὴν λέγω σοι
  choice: Lóòótọ́ ni mo sọ fún ọ
  rationale: “Lóòótọ́” fi ìmúdájú ọlọ́lá inú Ἀμὴν hàn, “mo sọ fún ọ” sì pa ọ̀rọ̀ tí Jésù darí sí ẹni kan ṣoṣo mọ́ láìlo ọ̀rọ̀ àjọsìn tí a kò túmọ̀.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: ní òru yìí gan-an
  rationale: “Ní òru yìí” tẹ̀lé ìtumọ̀ gbólóhùn Gíríìkì, “gan-an” sì mú ìtẹnumọ́ inú ταύτῃ jáde ní Yorùbá àdánidá.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: kí àkùkọ tó kọ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìṣe tó máa ṣẹlẹ̀ ṣáájú òmíràn; àìsí atọ́ka nínú Gíríìkì kò fi dandan mú kí a túmọ̀ rẹ̀ sí àkùkọ kan pàtó.
- source_word: τρὶς
  choice: ní ẹ̀ẹ̀mẹ́ta
  rationale: Èyí ni ọ̀nà Yorùbá ti òde òní tí ó ṣe kedere fún “ìgbà mẹ́ta.”
- source_word: ἀπαρνήσῃ με
  choice: ìwọ yóò sẹ́ mi
  rationale: “Sẹ́ mi” jẹ́ ọ̀rọ̀ kedere, tó sì wọ́pọ̀ fún kí ẹni kan sọ pé òun kò mọ̀ tàbí kò ní ìbáṣepọ̀ pẹ̀lú ẹlòmíràn; “ìwọ” fi ìtẹnumọ́ ẹni kejì hàn ní àyíká àsọtẹ́lẹ̀ yìí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àgbékalẹ̀ ọ̀rọ̀ Ἀμὴν λέγω σοι tí Jésù máa ń lò
  choice: Lóòótọ́ ni mo sọ fún ọ
  alternative: Àmín, mo wí fún ọ; Mo fi dá ọ lójú
  rationale: Yíyan yìí pa ọlá àti ìmúdájú ọ̀rọ̀ Jésù mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un tàbí sọ ọ́ di gbólóhùn tí ó túmọ̀ ju orísun lọ.
- issue: Ìtumọ̀ ἀπαρνήσῃ gẹ́gẹ́ bí ìkọ̀sí Jésù
  choice: sẹ́ mi
  alternative: kọ̀ mí; sọ pé o kò mọ̀ mí
  rationale: “Sẹ́ mi” pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ orísun mọ́, kì í sì í ṣàlàyé ní pàtó ju Gíríìkì lọ bóyá ìṣe náà jẹ́ kí Pétérù sọ pé kò mọ Jésù tàbí kí ó kọ gbogbo ìbáṣepọ̀ rẹ̀ pẹ̀lú rẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo “òru” nínú ọ̀rọ̀ pàtàkì láti sún mọ́ νύξ, ṣùgbọ́n “alẹ́ òní” wà ní àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ọ̀nà àdánidá mìíràn.
