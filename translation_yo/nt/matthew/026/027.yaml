id: MAT.26.27
reference: Matthew 26:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: yo
  text: Ó mú ife kan[a], ó sì dúpẹ́[c], ó fi í fún wọn, ó ní, “Ẹ gbogbo yín, ẹ mu nínú rẹ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ife náà.” Gíríìkì kò lo àmì-ìdánimọ̀ fún “ife”; “ife kan” fi ìrísí náà hàn dáadáa, bí ó tilẹ̀ jẹ́ pé àyíká oúnjẹ náà lè tọ́ka sí ife pàtó kan.
    reason: lexical_alternative
  - marker: b
    text: “Ẹ gbogbo yín” túmọ̀ sí pé gbogbo àwọn tí ó ń bá sọ̀rọ̀ ni a pàṣẹ fún láti mu; kò túmọ̀ sí pé kí wọ́n mu gbogbo ohun tó wà nínú ife náà tán.
    reason: lexical_alternative
  - marker: c
    text: A tún lè ṣe é ní ìṣètò participle pé, “Lẹ́yìn tí ó ti mú ife kan, tí ó sì ti dúpẹ́, ó fi í fún wọn.” Ìtumọ̀ pàtàkì ni pé mímú ife àti ìdúpẹ́ ṣáájú fífi í fún wọn.
    reason: previous_rendering
lexical_decisions:
- source_word: λαβὼν
  choice: lẹ́yìn tí ó … mú
  rationale: Ọ̀rọ̀ náà jẹ́ aorist participle tí ìṣe rẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ìtumọ̀ yìí jẹ́ kí ìtẹ̀lé àwọn ìṣe náà ṣe kedere ní Yorùbá àdánidá.
- source_word: ποτήριον
  choice: ife kan
  rationale: Orúkọ náà kò ní article ní Gíríìkì; “ife kan” fi ìrísí yẹn hàn, bó tilẹ̀ jẹ́ pé àyíká oúnjẹ lè jẹ́ kí “ife náà” ṣeé lò.
- source_word: εὐχαριστήσας
  choice: tí ó sì dúpẹ́
  rationale: Ó túmọ̀ sí pé ó dúpẹ́, ìṣe náà sì ṣáájú fífi ife náà fún wọn; a kò fi èdè ìlànà ẹ̀sìn tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: ἔδωκεν
  choice: ó fi í fún wọn
  rationale: “Í” tọ́ka sí ife náà, gẹ́gẹ́ bí àyíká ṣe fi hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó tọ́ka sí àwọn ọmọ-ẹ̀yìn tí wọ́n wà níbẹ̀.
- source_word: λέγων
  choice: ó ní
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti ṣàgbékalẹ̀ ọ̀rọ̀ tí ẹni kan sọ ní tààrà.
- source_word: Πίετε
  choice: kí ẹ mu
  rationale: Àṣẹ ni ọ̀rọ̀ Gíríìkì náà, ó sì ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀.
- source_word: ἐξ αὐτοῦ
  choice: nínú rẹ̀
  rationale: Nínú àyíká mímu láti inú ife, èyí ni ọ̀nà Yorùbá àdánidá fún ìtumọ̀ orísun tí ἐξ ń fi hàn.
- source_word: πάντες
  choice: gbogbo yín
  rationale: Ó kan gbogbo àwọn tí a ń bá sọ̀rọ̀, kì í ṣe iye gbogbo ohun tí wọ́n gbọ́dọ̀ mu.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀sìn tí a lè fi kún εὐχαριστήσας
  choice: tí ó sì dúpẹ́
  alternative: tí ó sì súre sí i; tí ó sì sọ ọ̀rọ̀ ìdúpẹ́
  rationale: εὐχαριστέω túmọ̀ sí “dúpẹ́.” Ìtumọ̀ yìí kò fi ẹ̀kọ́ nípa sacramenti tí ọ̀rọ̀ náà kò sọ ní tààrà kún un, kò sì tako bí àwọn Kristẹni ti máa ń ka ìṣẹ̀lẹ̀ Oúnjẹ Alẹ́ Olúwa.
- issue: Ààlà πάντες nínú àṣẹ náà
  choice: Gbogbo yín ni kí ẹ mu
  alternative: Ẹ mu gbogbo rẹ̀
  rationale: Gíríìkì ń pàṣẹ fún gbogbo àwọn tí ó wà níbẹ̀ pé kí wọ́n mu; kò sọ pé kí wọ́n mu gbogbo ohun tó wà nínú ife náà tán.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo “ife” dípò ọ̀rọ̀ àkànṣe ẹ̀sìn, a sì pa ìtẹ̀lé àwọn ìṣe Gíríìkì mọ́ ní ọ̀nà tí ó bá èdè Yorùbá mu.
