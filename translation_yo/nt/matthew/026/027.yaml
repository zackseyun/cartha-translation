  to: Ó mú ife kan[a], ó sì dúpẹ́[c], ó fi í fún wọn, ó ní, “Ẹ gbogbo yín, ẹ mu nínú rẹ̀.”[b]
  rationale: Àtúnṣe náà yọ ìlò “sì” tí kò rọrùn nínú gbolohun abẹ́lẹ̀, ó sì lo ìtẹ̀lé ọ̀rọ̀-ìṣe Yorùbá tí ó mọ́gbọ́n dání. Ó pa ìtẹ̀lé ìṣe Gíríìkì mọ́, kò sì sọ ìtumọ̀ ẹ̀sìn tàbí ìtumọ̀ ìhà-ẹ̀kọ́ kankan tí orísun kò sọ. A tún ṣe gbogbo akọsilẹ̀ kí wọ́n bá ọ̀rọ̀ tí a tún ṣe mu, kí wọ́n sì wà ní Yorùbá.
