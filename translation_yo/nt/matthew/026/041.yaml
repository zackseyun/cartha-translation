review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the plural present imperatives, the purpose clause ('so that you may not enter'), the metaphor of entering into πειρασμός, and the contrast between human spirit and flesh. The referent of 'spirit' is appropriately left as human inner willingness, not identified as the Holy Spirit.
  naturalness: Most of the verse is clear Standard Yoruba. In the final contrast, 'Ẹ̀mí fẹ́ nítòótọ́' is intelligible but can sound incomplete or as though 'spirit loves [something].' 'Ẹ̀mí tilẹ̀ fẹ́' is a more idiomatic concessive formulation and naturally expresses the μέν...δέ contrast.
  terminology: '''Ìdẹwò'' appropriately represents temptation, while the footnote preserves testing/trial. ''Ẹran ara'' retains the biblical flesh metaphor without importing ''sinful nature.'''
  issues:
  - severity: low
    issue: The concessive force in the final clause is awkwardly placed.
    rationale: 'Greek τὸ μὲν...ἡ δὲ marks a concessive contrast: ''the spirit indeed/is willing, but the flesh [is] weak.'' Replacing postposed ''nítòótọ́'' with ''tilẹ̀'' yields more natural Yoruba while retaining the contrast.'
  revised_text: Ẹ máa ṣọ́nà, kí ẹ sì máa gbàdúrà,[a] kí ẹ má bàa wọ inú ìdẹwò. Ẹ̀mí tilẹ̀ fẹ́, ṣùgbọ́n ẹran ara jẹ́ aláìlera.
  revised_footnotes:
