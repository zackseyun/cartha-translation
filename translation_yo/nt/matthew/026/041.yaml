    text: Tàbí “àdánwò” tàbí “ìdánwò.” Ọ̀rọ̀ Gíríìkì náà (πειρασμόν) lè túmọ̀ sí fífi ènìyàn dan an wò sí ẹ̀ṣẹ̀ tàbí ipò ìṣòro tí ń dán an wò.
    reason: lexical_alternative
