id: MAT.26.41
reference: Matthew 26:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: yo
  text: Ẹ máa ṣọ́nà, kí ẹ sì máa gbàdúrà,[a] kí ẹ má bàa wọ inú ìdẹwò. Ẹ̀mí tilẹ̀ fẹ́, ṣùgbọ́n ẹran ara jẹ́ aláìlera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àdánwò” tàbí “ìdánwò.” Ọ̀rọ̀ Gíríìkì náà (πειρασμόν) lè túmọ̀ sí fífi ènìyàn dan an wò sí ẹ̀ṣẹ̀ tàbí ipò ìṣòro tí ń dán an wò.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Ẹ máa ṣọ́nà
  rationale: Ọ̀rọ̀ àṣẹ ọ̀pọ̀ yìí túmọ̀ sí jí tàbí ṣọ́nà. Ní Gẹtisémánì, ó kan mímá sùn ní ti ara, ó sì tún ní ìtumọ̀ ìṣọ́ra ní ti ẹ̀mí; “máa ṣọ́nà” gba méjèèjì.
- source_word: προσεύχεσθε
  choice: kí ẹ sì máa gbàdúrà
  rationale: Àṣẹ ìsinsìnyí ń tọ́ka sí iṣẹ́ tí ó yẹ kí ó máa bá a lọ; “máa gbàdúrà” sọ èyí ní Yorùbá àdánidá.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: kí ẹ má bàa wọ inú
  rationale: Ó pa àwòrán Gíríìkì ti ‘wọ inú’ mọ́, ó sì fi ète ìdènà hàn láì túmọ̀ rẹ̀ sí ‘ṣubú sínú.’
- source_word: πειρασμόν
  choice: ìdẹwò
  rationale: Nínú àyíká yìí, ó ṣe pàtàkì jù lọ gẹ́gẹ́ bí ìdẹwò sí ẹ̀ṣẹ̀ lábẹ́ ìpọ́njú; àlàyé ìsàlẹ̀ pa ìtumọ̀ míì ti ìdánwò tàbí àdánwò mọ́.
- source_word: τὸ μὲν πνεῦμα
  choice: Ẹ̀mí ... nítòótọ́
  rationale: “Ẹ̀mí” tọ́ka sí inú tàbí ìfẹ́ ènìyàn nínú ìyàtọ̀ rẹ̀ pẹ̀lú ẹran ara; “nítòótọ́” mú agbára μέν wá sínú gbolohun Yorùbá.
- source_word: πρόθυμον
  choice: fẹ́
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, “fẹ́” jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ pé inú ènìyàn múra tàbí ó ní ìfẹ́ láti ṣe ohun tó tọ́.
- source_word: ἡ δὲ σὰρξ
  choice: ṣùgbọ́n ẹran ara
  rationale: “Ẹran ara” pa àwòrán σάρξ mọ́, ó sì tọ́ka sí àìlera ènìyàn ní ti ara láì fi ẹ̀kọ́ ‘ìwà ẹlẹ́ṣẹ̀’ kún ọ̀rọ̀ náà.
- source_word: ἀσθενής
  choice: jẹ́ aláìlera
  rationale: Ó mú ìyàtọ̀ tó wà láàárín ìfẹ́ inú àti àìlera ènìyàn jáde ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: ẹ̀mí ènìyàn tàbí ìfẹ́ inú rẹ̀
  alternative: Ẹ̀mí Mímọ́
  rationale: Ìyàtọ̀ pẹ̀lú ‘ẹran ara’ àti bí àwọn ọmọ-ẹ̀yìn ṣe fẹ́ ṣe rere ṣùgbọ́n tí wọ́n kùnà ṣe atilẹyin pé ẹ̀mí ènìyàn ni; a kò fi Ẹ̀mí Mímọ́ sínú ọ̀rọ̀ tí kò sọ ọ́ ní pàtó.
- issue: Bí a ṣe túmọ̀ σάρξ
  choice: ẹran ara
  alternative: ara; ìwà ẹlẹ́ṣẹ̀
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń sọ nípa àìlera ènìyàn tó ní ara, kì í ṣe ẹ̀kọ́ tó ti gbooro nípa ‘ìwà ẹlẹ́ṣẹ̀.’ Ìtumọ̀ yìí pa àwòrán àti ìforígbárí ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìlò “ẹ” pa àṣẹ ọ̀pọ̀ ti Gíríìkì mọ́; àsọyé náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún olùkà òde òní.
