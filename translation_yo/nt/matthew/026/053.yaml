id: MAT.26.53
reference: Matthew 26:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: yo
  text: Àbí o rò pé èmi kò lè bẹ Baba mi[a], tí yóò sì pèsè ẹgbẹ́ ọmọ ogun áńgẹ́lì tó ju méjìlá lọ fún ìrànlọ́wọ́ mi lẹ́sẹ̀kẹsẹ̀[b][c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, ‘pè sí Baba mi fún ìrànlọ́wọ́,’ tàbí, ‘béèrè lọ́wọ́ Baba mi.’
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, ‘yóò fi wọ́n sí ẹ̀gbẹ́ mi’; ìyẹn ni pé, yóò mú wọn wà fún ìrànlọ́wọ́ mi.
    reason: lexical_alternative
  - marker: c
    text: Ẹgbẹ́ ọmọ ogun Róòmù kan, tí a ń pè ní ‘legion,’ jẹ́ ẹ̀ka ọmọ ogun ńlá; gbólóhùn yìí tẹnu mọ́ agbára ọmọ ogun ọ̀run tí ó pọ̀ lọ́pọ̀lọpọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ń mú ìbéèrè àtakò mìíràn wọlé ní ọ̀nà àdánidá ní Yorùbá.
- source_word: δοκεῖς
  choice: o rò pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti fi agbára ìbéèrè àròsọ inú Gíríìkì hàn.
- source_word: οὐ δύναμαι
  choice: èmi kò lè
  rationale: Ó tọ́ka sí agbára tàbí àǹfààní láti ṣe ohun kan, kì í ṣe àìfẹ́ láti ṣe é.
- source_word: παρακαλέσαι
  choice: ké pe
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pípe ẹni kan fún ìrànlọ́wọ́ tàbí bíbéèrè lọ́wọ́ rẹ̀; ‘ké pe’ mú ìjẹ́kánjú àti ẹ̀bẹ̀ náà jáde.
- source_word: τὸν πατέρα μου
  choice: Baba mi
  rationale: Ó pa ìbátan Ọmọ sí Baba mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: παραστήσει μοι
  choice: fi ... sílẹ̀ fún mi
  rationale: Ó sọ pé Baba yóò mú àwọn áńgẹ́lì náà wà ní ìmúrasílẹ̀ fún ìrànlọ́wọ́ Jesu, dípò kí a dín ọ̀rọ̀ náà kù sí ‘ránṣẹ́’ nìkan.
- source_word: ἄρτι
  choice: ní ìsinsìnyí
  rationale: Ó pa ìtumọ̀ ìsinsìnyí tàbí ìrànlọ́wọ́ tó ṣeé rí lẹ́sẹ̀kẹsẹ̀ mọ́.
- source_word: πλείω δώδεκα
  choice: tó ju méjìlá lọ
  rationale: Èyí tú ìfiwéra pẹ̀lú nọ́ńbà náà ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: λεγιῶνας
  choice: ẹgbẹ́ ọmọ ogun
  rationale: A lo ọ̀rọ̀ àlàyé Yorùbá tó ṣeé lóye fún ẹ̀ka ọmọ ogun Róòmù, nígbà tí àlàyé ìṣe-àṣà wà ní àlàyé ìsàlẹ̀.
- source_word: ἀγγέλων
  choice: áńgẹ́lì
  rationale: Àyíká náà fi hàn pé àwọn ẹ̀dá ọ̀run ni, kì í ṣe ońṣẹ́ ènìyàn.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Jesu ń sọ nípa àìlágbára, àìní àṣẹ, tàbí àìfẹ́ láti béèrè ìrànlọ́wọ́ Ọlọ́run
  choice: èmi kò lè ké pe Baba mi
  alternative: èmi kò ní fẹ́ ké pe Baba mi
  rationale: δύναμαι ń tọ́ka sí agbára. Ìtumọ̀ yìí pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ pé Jesu ní agbára láti béèrè fún ìrànlọ́wọ́ ọ̀run, ṣùgbọ́n a kò tú ìdí tí kò fi ṣe bẹ́ẹ̀ sí i nínú ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A lo ‘ẹgbẹ́ ọmọ ogun’ kí òǹkàwé lásán lè lóye àwòrán ogun náà, a sì ṣàlàyé ọ̀rọ̀ Róòmù ‘legion’ ní àlàyé ìsàlẹ̀. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
