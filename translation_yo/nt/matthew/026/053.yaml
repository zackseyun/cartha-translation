  source_fidelity: Ìtumọ̀ náà gba ìbéèrè àtakò náà, ìkìlọ̀ nípa agbára Jesu, iye ‘tó ju méjìlá lọ,’ àti àwòrán àwọn áńgẹ́lì ní ọ̀nà tó tọ́. Ṣùgbọ́n ‘ké pe Baba mi’ kì í ṣe ọ̀nà Yorùbá tí ó dára fún παρακαλέσαι nínú ọ̀rọ̀ yìí, ‘fi ... sílẹ̀ fún mi’ sì lè túmọ̀ sí fífi ohun kan sílẹ̀/dídá silẹ̀ dípò pípèsè é fún ìrànlọ́wọ́ ẹni.
  naturalness: ‘Bẹ Baba mi’ jẹ́ ìsọ̀rọ̀ Yorùbá boṣewa tó dára fún kíkàn sí ẹni kan nípasẹ̀ ẹ̀bẹ̀ tàbí ìbéèrè. ‘Pèsè ... fún ìrànlọ́wọ́ mi lẹ́sẹ̀kẹsẹ̀’ sì jẹ́ kedere, ó sì ń sọ ipa παραστήσει μοι àti ἄρτι ní ti ara.
