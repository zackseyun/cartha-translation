source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: yo
  text: Ó sì mú Pétérù àti àwọn ọmọ Sebede méjèèjì lọ pẹ̀lú rẹ̀; ó bẹ̀rẹ̀ sí í ní ìbànújẹ́ àti ìdààmú gidigidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó bẹ̀rẹ̀ sí í ní ìbànújẹ́ àti ìdààmú ọkàn.”
    reason: Àwọn ọ̀rọ̀ Gíríìkì λυπεῖσθαι àti ἀδημονεῖν lè tọ́ka sí ìbànújẹ́ àti ìdààmú ọkàn líle; àṣàyàn yìí pa ipa ἤρξατο mọ́ fún àwọn méjèèjì.
lexical_decisions:
- source_word: παραλαβὼν
  choice: mú ... lọ pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù yan àwọn mẹ́tẹ̀ẹ̀ta náà láti bá a lọ; gbólóhùn Yorùbá yìí sọ ìtumọ̀ ìbákẹ́gbẹ́ náà ní ọ̀nà àdánidá.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: àwọn ọmọkùnrin Sebedee méjèèjì
  rationale: Èyí pa ìdánimọ̀ gẹ́gẹ́ bí ó ṣe wà nínú Gíríìkì mọ́, láì fi orúkọ Jákọ́bù àti Jòhánù kún un.
- source_word: ἤρξατο
  choice: ó bẹ̀rẹ̀ sí í
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ìrírí náà mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: λυπεῖσθαι
  choice: banújẹ́
  rationale: Ó túmọ̀ ìrírí ìbànújẹ́ gidi ní èdè Yorùbá òde òní, pẹ̀lú ìwọ̀ntúnwọ̀nsì tó yẹ fún ìṣẹ̀lẹ̀ náà.
- source_word: ἀδημονεῖν
  choice: dààmú gidigidi
  rationale: Ó fi ìdààmú ọkàn líle hàn, ó sì yàtọ̀ sí banújẹ́ láì gbé ìtumọ̀ náà dé àìnírètí tàbí ìpayà tí ọ̀rọ̀ Gíríìkì kò fi dandan sọ.
- source_word: καὶ ... καὶ
  choice: àti ... ó sì
  rationale: Ìsopọ̀ Yorùbá yìí pa àkójọpọ̀ àwọn ẹni tí ó mú lọ àti àwọn ìmọ̀lára méjèèjì mọ́, ní ọ̀nà tí ó ṣàn dáadáa.
theological_decisions:
- issue: Bí a ṣe máa ṣàpèjúwe ìmọ̀lára Jésù ní ìbámu pẹ̀lú ẹ̀kọ́ nípa Kristi
  choice: Ṣàfihàn ìbànújẹ́ àti ìdààmú rẹ̀ gẹ́gẹ́ bí ìrírí ẹ̀dá ènìyàn gidi
  alternative: Dín agbára àwọn ọ̀rọ̀ náà kù, tàbí mú wọn ga dé ìpayà àti àìnírètí
  rationale: Àwọn ọ̀rọ̀ Gíríìkì méjèèjì jẹ́rìí sí ìjìyà ọkàn gidi àti líle. Ìtumọ̀ náà kò yẹ kí ó dín ẹ̀dá ènìyàn Jésù kù, bẹ́ẹ̀ ni kò yẹ kí ó fi àìnírètí tí kò sí nínú ọ̀rọ̀ orísun kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́, tó níyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìṣọ̀kan àti ìwọ̀n ìmọ̀lára ọ̀rọ̀ Gíríìkì mọ́.
