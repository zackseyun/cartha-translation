source:
  edition: SBLGNT
  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: yo
  text: Àwọn tí wọ́n ti mú Jésù sì mú un lọ sọ́dọ̀ Káyáfà, olórí àlùfáà, níbi tí àwọn akọ̀wé àti àwọn àgbààgbà ti péjọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ti kó wọn jọ.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí afẹ́yìntì; ní àyíká yìí, ó lè sọ pé wọ́n ti péjọ tàbí pé a ti kó wọn jọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν
  choice: Àwọn tí wọ́n ti mú Jésù
  rationale: A sọ àpilẹ̀kọ olùṣe náà di gbólóhùn orúkọ ní Yorùbá. “Ti mú” fi hàn pé mímú Jésù ṣẹlẹ̀ ṣáájú kíkó o lọ; kò sì fi ìtumọ̀ òfin tó ju ohun tí Gíríìkì sọ lọ kún un.
- source_word: ἀπήγαγον
  choice: sì kó o lọ
  rationale: Èyí sọ ìrìn-àjò tí wọ́n fi Jésù sí abẹ́ àṣẹ wọn mú kúrò níbẹ̀ lọ sí ọ̀dọ̀ Káyáfà. “Kó o lọ” jẹ́ èdè Yorùbá àdánidá, kò sì fi ipa fífà á lọ kún ọ̀rọ̀ náà.
- source_word: πρὸς Καϊάφαν τὸν ἀρχιερέα
  choice: sọ́dọ̀ Káyáfà, olórí àlùfáà
  rationale: “Sọ́dọ̀” tọ́ka sí lílọ sí ọ̀dọ̀ ẹni kan, gẹ́gẹ́ bí πρός ṣe rí níbí. “Olórí àlùfáà” ni orúkọ ipò àρχιερεύς, láìfi “ilé Káyáfà” kún ọ̀rọ̀ tí kò sí nínú Gíríìkì.
- source_word: οἱ γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí pa orúkọ ẹgbẹ́ àwọn amòfin àti olùkọ́ Ìwé Mímọ́ náà mọ́ ní ọ̀nà tó ṣe déédé ní ìtúmọ̀ Bíbélì Yorùbá.
- source_word: οἱ πρεσβύτεροι
  choice: àwọn àgbààgbà
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn olórí àgbà tí a mọ̀ sí ẹgbẹ́ kan láàárín àwọn Júù.
- source_word: συνήχθησαν
  choice: ti péjọ
  rationale: Perfect Yoruba “ti péjọ” fi hàn pé wọ́n ti wà níbẹ̀ nígbà tí wọ́n mú Jésù dé. Ó tún jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ pé wọ́n kóra wọn jọ.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A yà àpèjúwe ipò Káyáfà sọ́tọ̀ pẹ̀lú àmì kọ́má, a sì fi àmì àlàyé [a] sí ọ̀dọ̀ ọ̀rọ̀ “péjọ” tí àlàyé náà ń tọ́ka sí, kì í ṣe sí “olórí àlùfáà.”
