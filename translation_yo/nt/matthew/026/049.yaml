id: MAT.26.49
reference: Matthew 26:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: yo
  text: Lójúkan náà, ó sún mọ́ Jésù, ó sì wí pé, “Mo kí ọ, Rábì!” Ó sì fi ẹnu kò ó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà lè fi ìfẹnukò onítẹnumọ́ hàn, bíi pé ó fi ẹnu kò ó ní kíkankíkan tàbí léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Lójúkan náà
  rationale: Ó fi ìyára àti àìsí ìdádúró inú ìtàn hàn ní Yorùbá òde òní.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: ó tọ Jésù wá
  rationale: Ó ṣàfihàn bí ó ṣe sún mọ́ Jésù ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: Χαῖρε
  choice: Mo kí ọ
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà jẹ́ ìkíni tí ó wọ́pọ̀, kì í ṣe àṣẹ pé kí ẹni náà yọ̀.
- source_word: ῥαββί
  choice: Rábì
  rationale: A pa orúkọ oyè Semitic tí Gíríìkì náà tún kọ ní ìró rẹ̀ mọ́; ó túmọ̀ sí olùkọ́.
- source_word: κατεφίλησεν
  choice: fi ẹnu kò ó gidigidi
  rationale: Ọ̀rọ̀-ìṣe náà lágbára ju φιλέω lọ, ó sì lè tọ́ka sí fífi ẹnu kò ní kíkankíkan tàbí léraléra; ‘gidigidi’ pa agbára yìí mọ́ láì pinnu pé ó ṣẹlẹ̀ léraléra.
theological_decisions:
- issue: Ìtumọ̀ ìkíni Χαῖρε
  choice: Mo kí ọ
  alternative: Yọ̀; Àlàáfíà
  rationale: Níhìn-ín ó jẹ́ ìkíni ojoojúmọ́. Ìtumọ̀ yìí kò sọ ọ́ di ìkéde ẹ̀kọ́ ìgbàgbọ́, ó sì jẹ́ kí ẹ̀gàn inú ìṣe Júdásì farahàn láti inú ìtàn fúnra rẹ̀.
- issue: Agbára ọ̀rọ̀ κατεφίλησεν
  choice: fi ẹnu kò ó gidigidi
  alternative: fi ẹnu kò ó; fi ẹnu kò ó léraléra
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ fífi ẹnu kò ní kíkankíkan tàbí léraléra. Ọ̀rọ̀ àkọ́kọ́ pa ìtẹnumọ́ náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àìdánilójú pàtó náà hàn.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; ọ̀rọ̀ náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lásán láti lóye.
