id: MAT.26.66
reference: Matthew 26:66
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: yo
  text: “Kí ni ẹ̀yin rò?” Wọ́n dáhùn[a] pé, “Ó yẹ fún ikú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó jẹ̀bi ikú” tàbí “Ó wà lábẹ́ ẹ̀bi ikú.” Gbólóhùn Gíríìkì náà jẹ́ ọ̀rọ̀ ìdájọ́ lábẹ́ òfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Kí ni ẹ̀yin rò?
  rationale: Ọ̀rọ̀ Gíríìkì yìí béèrè èrò tàbí ìdájọ́ àwọn olùgbọ́. Èyí jẹ́ ọ̀nà àdánidá, tààrà, tí Yorùbá òde òní fi ń béèrè irú ìbéèrè bẹ́ẹ̀.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Wọ́n dáhùn pé
  rationale: Àkójọpọ̀ participle àti ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ ọ̀nà ìtàn tí ó wọ́pọ̀; “wọ́n dáhùn pé” mú un wá sí Yorùbá àdánidá láìfi ìtumọ̀ tuntun kún un. δέ jẹ́ àsopọ̀ fẹ́lẹ́fẹ́lẹ́, kò sì pọn dandan láti túmọ̀ rẹ̀ lọ́tọ̀ níbí.
- source_word: ἔνοχος
  choice: yẹ fún
  rationale: Nínú àyíká ìdájọ́, ἔνοχος túmọ̀ sí jíjẹ́ ẹni tí ìjìyà kan tọ́ sí tàbí ẹni tí ó wà lábẹ́ ẹ̀bi rẹ̀. “Ó yẹ fún ikú” sọ ìdájọ́ wọn ní Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
- source_word: θανάτου
  choice: ikú
  rationale: Genitive náà fi ohun tí wọ́n ní ó tọ́ sí i hàn, ìyẹn ikú. Ọ̀rọ̀ “ikú” pa ìṣọ̀kan àti agbára gbólóhùn Gíríìkì mọ́.
- source_word: ἐστίν
  choice: Ó
  rationale: Yorùbá kò nílò copula tí ó dúró lọ́tọ̀ nínú gbólóhùn “Ó yẹ fún ikú”; arọ́pò-orúkọ “Ó” fi ẹni tí wọ́n ń dá lẹ́jọ́ hàn ní kedere.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ìdájọ́ tí ìgbìmọ̀ náà sọ
  choice: Ó yẹ fún ikú
  alternative: Ó jẹ̀bi ikú; Ó wà lábẹ́ ẹ̀bi ikú
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìdájọ́ tí ìgbìmọ̀ sọ sí Jésù, láìsọ pé Ọlọ́run náà dá a lẹ́bi tàbí láìfi ẹ̀kọ́ nípa ètùtù kún ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ àdánidá, tààrà, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
