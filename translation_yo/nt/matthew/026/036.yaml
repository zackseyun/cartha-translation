revisions:
- from: Nígbà náà ni Jésù bá wọn dé ibi kan tí à ń pè ní Gẹtisémánì. Ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ jókòó síbí nígbà tí mo bá lọ sí ibẹ̀ láti gbàdúrà.”[a]
  to: Nígbà náà ni Jésù bá wọn dé ibi kan tí à ń pè ní Gẹtisémánì. Ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ jókòó síbí nígbà tí mo lọ sí ibẹ̀ láti gbàdúrà.”[a]
  rationale: A ṣe àtúnṣe kékeré kan ṣoṣo nínú ọ̀rọ̀ àkọ́kọ́ láti yẹra fún ìró ìpò-àdéhùn tí “mo bá lọ” lè ní. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ kí yíyan “títí tí” lè jẹ́ Yorùbá tó péye, kí ó sì ṣàlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú ἕως οὗ láì pinnu ìtumọ̀ tí a ń jiyàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:58Z'
