id: MAT.26.36
reference: Matthew 26:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: yo
  text: Nígbà náà ni Jésù bá wọn dé ibi kan tí à ń pè ní Gẹtisémánì. Ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Ẹ jókòó síbí nígbà tí mo lọ sí ibẹ̀ láti gbàdúrà.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ jókòó síbí títí tí mo fi lọ sí ibẹ̀ láti gbàdúrà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní ọ̀nà tó sún mọ́ “títí di ìgbà tí,” bí ó tilẹ̀ jẹ́ pé “nígbà tí” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àsopọ̀ àkókò tó ń tẹ ìtàn síwájú, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: ἔρχεται
  choice: bá wọn dé
  rationale: Ìṣe ìsinsìnyí inú ìtàn Gíríìkì ni; ìtumọ̀ yìí mú ìṣẹ̀lẹ̀ náà hàn ní ọ̀nà àdánidá ní Yorùbá, ó sì pa èrò dídé pẹ̀lú wọn mọ́.
- source_word: μετ’ αὐτῶν
  choice: bá wọn
  rationale: Ó sọ ìbákẹ́gbẹ́ Jésù pẹ̀lú àwọn tó wà lọ́dọ̀ rẹ̀ ní tààrà.
- source_word: χωρίον
  choice: ibi kan
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ibi tàbí ilẹ̀ kan; “ibi kan” kò fi ìtumọ̀ “ọgbà” tí Mátíù kò sọ kún un.
- source_word: λεγόμενον Γεθσημανί
  choice: tí à ń pè ní Gẹtisémánì
  rationale: Ọ̀nà Yorùbá tó ṣe déédé fún fífi orúkọ ibi kan hàn ni; a kọ orúkọ náà gẹ́gẹ́ bí ìró rẹ̀.
- source_word: λέγει τοῖς μαθηταῖς
  choice: Ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Ó mú ọ̀rọ̀ ìsinsìnyí inú ìtàn wá sí Yorùbá àdánidá, ó sì jẹ́ kó ṣe kedere pé àwọn ọmọ-ẹ̀yìn ni Jésù ń bá sọ̀rọ̀.
- source_word: Καθίσατε αὐτοῦ
  choice: Ẹ jókòó síbí
  rationale: Àṣẹ rírọrùn ni, “síbí” sì fi ibi tí àwọn ọmọ-ẹ̀yìn wà yàtọ̀ sí “ibẹ̀.”
- source_word: ἕως οὗ
  choice: nígbà tí
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí àkókò tí àwọn ọmọ-ẹ̀yìn yóò jókòó nígbà tí Jésù bá lọ gbàdúrà; èyí jẹ́ Yorùbá àdánidá. A fi ìtumọ̀ tó sún mọ́ “títí” sínú àlàyé ìsàlẹ̀.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: mo bá lọ sí ibẹ̀ láti gbàdúrà
  rationale: 'Ó sọ ìtẹ̀lé àwọn ìṣe náà ní kedere: Jésù yóò lọ sí ibẹ̀, ète lílọ náà sì ni láti gbàdúrà.'
theological_decisions:
- issue: Irú ibi tí Gẹtisémánì jẹ́
  choice: A túmọ̀ χωρίον sí “ibi kan.”
  alternative: ọgbà kan
  rationale: Mátíù kò pe ibi náà ní ọgbà; lílo “ọgbà” yóò mú ẹ̀kúnrẹ́rẹ́ láti inú Jòhánù 18:1 wọ inú ẹsẹ yìí.
- issue: Ìbáṣepọ̀ àkókò nínú ἕως οὗ
  choice: A lo “nígbà tí” nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: títí tí
  rationale: “Nígbà tí” sọ bí jíjókòó wọn ṣe bá àkókò lílọ Jésù àti àdúrà rẹ̀ papọ̀ ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan tó lè jẹ́ “títí” mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn ni a lò. A fi àmì ohùn síbi tó yẹ, a sì yà “síbí” àti “ibẹ̀” sọ́tọ̀ láti pa ìtọ́kasí ibi inú Gíríìkì mọ́.
