  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́, ó túmọ̀ χωρίον sí “ibi kan” láì fi “ọgbà” kún un, ó sì pa ìyàtọ̀ αὐτοῦ/ἐκεῖ (“síbí/ibẹ̀”) mọ́. Síbẹ̀, “mo bá lọ” lè ní ìró ìpò-àdéhùn ní Yorùbá, níbi tí ọ̀rọ̀ Gíríìkì ti jẹ́ ìkéde ìṣe tí Jésù fẹ́ ṣe.'
