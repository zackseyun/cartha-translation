id: MAT.26.46
reference: Matthew 26:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: yo
  text: Ẹ dìde, ẹ jẹ́ ká lọ. Wò ó, ẹni tó ń fi mí lé wọn lọ́wọ́[a] ti súnmọ́lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀dàlẹ̀ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Ẹ dìde
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn; ‘Ẹ dìde’ jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tó sì bá ọ̀rọ̀ mu.
- source_word: ἄγωμεν
  choice: ẹ jẹ́ ká lọ
  rationale: Fọ́ọ̀mù yìí jẹ́ ìṣírí ẹni àkọ́kọ́ púpọ̀; ‘ẹ jẹ́ ká lọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún un.
- source_word: ἰδού
  choice: Wò ó
  rationale: Ó pe àfiyèsí sí ohun pàjáwìrì tó ń ṣẹlẹ̀, láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ líle.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Perfect náà fi hàn pé ẹni náà ti dé àdúgbò nítòsí, ìyẹn sì ṣe pàtàkì ní àkókò ọ̀rọ̀ náà.
- source_word: ὁ παραδιδούς με
  choice: ẹni tó ń fi mí lé wọn lọ́wọ́
  rationale: Èyí pa ìṣe gidi inú παραδίδωμι mọ́—fífi Jésù lé àwọn mìíràn lọ́wọ́—dípò kí a fi ìtumọ̀ ìwà ọ̀dàlẹ̀ nìkan rọ́pò rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ παραδιδούς nínú àkọsílẹ̀ ìjìyà Jésù
  choice: ẹni tó ń fi mí lé wọn lọ́wọ́
  alternative: ọ̀dàlẹ̀ mi
  rationale: Participu náà sọ ní pàtó nípa ẹni tó ń fi Jésù lé àwọn mìíràn lọ́wọ́. Nínú àyíká yìí, ìṣe náà jẹ́ ìwà ọ̀dàlẹ̀, ṣùgbọ́n yíyan ọ̀rọ̀ gidi ní pàtàkì ń pa ìtumọ̀ orísun àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ tààrà, ọ̀wọ̀, ó sì bá ọ̀rọ̀ ẹnu pàjáwìrì mu. A lo ‘wọn’ gẹ́gẹ́ bí ẹni tí a ń fi Jésù lé lọ́wọ́, èyí tí àyíká ẹsẹ̀ ṣáájú àti lẹ́yìn mú kedere.
