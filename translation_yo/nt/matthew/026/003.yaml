translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa ìrísí aláìṣe ti συνήχθησαν mọ́, kò sì pinnu ju ẹ̀rí orísun lọ bóyá àgbàlá lásán ni tàbí àgbàlá ilé ńlá.
