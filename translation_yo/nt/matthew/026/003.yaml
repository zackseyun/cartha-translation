  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: yo
  text: Nígbà náà ni àwọn olórí àlùfáà àti àwọn àgbààgbà ènìyàn péjọ[a] sí àgbàlá[b] olórí àlùfáà, ẹni tí a ń pè ní Káyáfà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘a kó wọn jọ.’ Ọ̀rọ̀ ìṣe Gíríìkì náà wà ní ìrísí passive.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ‘àgbàlá’ sí ‘àgbàlá ilé ńlá,’ nítorí ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àgbàlá ibùgbé ńlá kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tí ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘lẹ́yìn náà’ tàbí ‘ní àkókò náà.’
- source_word: συνήχθησαν
  choice: a kó ... jọ
  rationale: Ìtumọ̀ yìí pa ìrísí aláìṣe ti ọ̀rọ̀ Gíríìkì mọ́, nígbà tí ó ṣì ṣe kedere ní Yorùbá pé ẹgbẹ́ náà péjọ sí ibi kan.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú nínú ẹgbẹ́ àwọn àlùfáà, kì í ṣe pé ọ̀pọ̀ ènìyàn ló ń di ipò olórí àlùfáà kan náà mú lẹ́ẹ̀kan náà.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: àwọn àgbààgbà àwọn ènìyàn
  rationale: Ó fi ìbáṣepọ̀ inú gbólóhùn Gíríìkì hàn ní tààrà, ó sì tọ́ka sí àwọn aṣáájú tí a mọ̀ láàárín àwọn ènìyàn.
- source_word: εἰς τὴν αὐλὴν
  choice: sí àgbàlá
  rationale: εἰς ní ìtumọ̀ ìlọ sí ibi kan, nígbà tí αὐλή ń tọ́ka sí àgbàlá inú ilé ńlá tàbí àgbàlá ibùgbé.
- source_word: τοῦ ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Ẹyọ ọ̀rọ̀ náà tọ́ka sí ẹni kan ṣoṣo tí ó wà ní ipò olórí àlùfáà nínú àyíká ọ̀rọ̀ yìí.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: ẹni tí a ń pè ní Káyáfà
  rationale: Ó tẹ̀lé ìrísí gbólóhùn Gíríìkì, ó sì dá orúkọ ẹni náà mọ̀ ní Yorùbá àdánidá.
