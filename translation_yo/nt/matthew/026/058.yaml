source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: yo
  text: Ṣùgbọ́n Pétérù ń tọ̀ ọ́ lẹ́yìn láti òkèèrè títí dé àgbàlá olórí àlùfáà. Lẹ́yìn tí ó wọ inú rẹ̀, ó jókòó pẹ̀lú àwọn ìránṣẹ́ náà[a] láti rí òpin náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn olùrànlọ́wọ́,” “àwọn òṣìṣẹ́,” tàbí “àwọn olùṣọ́.” Ọ̀rọ̀ Gíríìkì náà, ὑπηρέται, lè tọ́ka sí àwọn òṣìṣẹ́ tàbí àwọn olùrànlọ́wọ́ abẹ́ àṣẹ; àyíká ni ó pinnu ìtumọ̀ rẹ̀ gan-an.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láti rí àbájáde náà.” Ọ̀rọ̀ Gíríìkì náà, τὸ τέλος, lè túmọ̀ sí “òpin” ní tààrà, tàbí sí àbájáde ohun tí ń ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: ń tọ̀ ọ́ lẹ́yìn
  rationale: Àkókò imperfect fi hàn pé ìṣe náà ń lọ lọ́wọ́ gẹ́gẹ́ bí abẹ́lẹ̀ ìtàn.
- source_word: ἀπὸ μακρόθεν
  choice: láti ọ̀nà jíjìn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Peteru kò sún mọ́ ọn.
- source_word: ἕως τῆς αὐλῆς
  choice: títí dé àgbàlá
  rationale: “Títí dé” pa ìtumọ̀ ibi tí ìtẹ̀lé náà dé mọ́; àgbàlá sì bá αὐλή mu ní àyíká yìí.
- source_word: ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún oyè àlùfáà gíga jù lọ nínú àyíká Májẹ̀mú Tuntun.
- source_word: εἰσελθὼν ἔσω
  choice: nígbà tí ó sì wọ inú rẹ̀
  rationale: Ó fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn ní èdè Yorùbá àdánidá, ìyẹn pé ó kọ́kọ́ wọlé kí ó tó jókòó.
- source_word: ἐκάθητο
  choice: ó jókòó
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá; nínú àyíká, ó tún lè ní ìtumọ̀ pé ó wà ní jíjókòó.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: pẹ̀lú àwọn ìránṣẹ́ olórí
  rationale: ὑπηρέται lè tọ́ka sí àwọn òṣìṣẹ́ tàbí olùrànlọ́wọ́ abẹ́ àṣẹ; “ìránṣẹ́ olórí” kò fi dandan sọ pé ìránṣẹ́ ilé ni wọ́n tàbí pé olùṣọ́ ológun ni wọ́n.
- source_word: ἰδεῖν
  choice: láti rí
  rationale: Ó pa ìtumọ̀ ète infinitive náà mọ́ láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: τὸ τέλος
  choice: ohun tí yóò ṣẹlẹ̀ ní ìparí
  rationale: Ó jẹ́ ọ̀nà àdánidá láti sọ “òpin” tàbí “àbájáde,” nígbà tí ó ṣì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú τέλος mọ́.
theological_decisions:
- issue: Ìtumọ̀ τὸ τέλος
  choice: ohun tí yóò ṣẹlẹ̀ ní ìparí
  alternative: òpin náà; àbájáde náà
  rationale: Gbólóhùn yìí kò pinnu pé “òpin” jẹ́ kìkì àkókò ìparí tàbí àbájáde ìgbẹ́jọ́; ó pa ìfọ̀rọ̀wérọ̀ ìtumọ̀ náà mọ́.
translation_notes:
  register: Standard Yorùbá pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, àdánidá, ó sì yẹ fún òǹkàwé òde òní. A lo “ìránṣẹ́ olórí” láti yẹra fún pípa iṣẹ́ àwọn ὑπηρέται mọ́ sí ìránṣẹ́ ilé tàbí olùṣọ́ nìkan.
