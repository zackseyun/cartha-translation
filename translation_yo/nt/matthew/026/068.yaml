  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: yo
  text: 'wọ́n ń wí pé, “Sọ àsọtẹ́lẹ̀ fún wa, ìwọ Mèsáyà[a]: ta ni ó lù ọ́?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè níbí, kì í ṣe orúkọ lásán.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n ń wí pé
  rationale: Ọ̀rọ̀ náà jẹ́ present participle tó ń ṣáájú ọ̀rọ̀ àwọn ẹlẹ́gàn; “wọ́n ń wí pé” jẹ́ ọ̀nà Yorùbá àdánidá láti so ọ̀rọ̀ wọn mọ́ ohun tó ṣáájú.
- source_word: Προφήτευσον
  choice: Sọ àsọtẹ́lẹ̀
  rationale: Aorist imperative ni, tí wọ́n fi ń fi ẹ̀gàn pàṣẹ fún Jésù pé kí ó lo agbára wòlíì láti dá ẹni tó lù ú mọ̀; “sọ àsọtẹ́lẹ̀” pa ìtumọ̀ àti ẹ̀gàn náà mọ́.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dative náà tọ́ka sí àwọn tí àsọtẹ́lẹ̀ náà ń lọ sí; “fún wa” ni èdè Yorùbá àdánidá nínú gbólóhùn yìí.
- source_word: χριστέ
  choice: ìwọ Mèsáyà
  rationale: Vocative title ni; fífi “ìwọ” kún un mú ìpè tààrà náà hàn kedere, “Mèsáyà” sì pa ipò rẹ̀ gẹ́gẹ́ bí oyè ẹni àmì-òróró tí wọ́n ń fi ṣe ẹlẹ́yà mọ́.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: ta ni ó lù ọ́?
  rationale: Gbólóhùn Yorùbá yìí dá ẹni tó ṣe ìṣe náà mọ̀ gẹ́gẹ́ bí Gíríìkì, ó sì pa ìṣe lílù àti ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì mọ́ láìfi àlàyé tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ọ̀rọ̀ yìí χριστέ jẹ́ oyè nínú vocative, kì í ṣe apá orúkọ lásán. “Mèsáyà” mú agbára oyè ẹni tí a yàn nípasẹ̀ àmì-òróró àti ẹ̀gàn tí àwọn olùsọ̀rọ̀ ń ṣe hàn; àkọ́lé ìsàlẹ̀ ojú ìwé fi “Kristi” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó wọ́pọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. “Ta ni ó lù ọ́?” jẹ́ ìbéèrè àdánidá, ó sì pa ẹ̀gàn àti ìpèníjà inú ọ̀rọ̀ Gíríìkì mọ́.
