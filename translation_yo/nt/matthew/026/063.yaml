id: MAT.26.63
reference: Matthew 26:63
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: yo
  text: Ṣùgbọ́n Jésù ń dákẹ́. Àlùfáà Àgbà sì sọ fún un pé, “Mo fi Ọlọ́run alààyè mú ọ búra[a] pé kí o sọ fún wa bóyá ìwọ ni Mèsáyà[b], Ọmọ Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo bú ọ ní ìbúra ní orúkọ Ọlọ́run alààyè.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà àṣẹ ọlọ́wọ̀ tí ń mú ẹni dáhùn nípasẹ̀ ìbúra.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Christos; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, kì í ṣe orúkọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: ń bá a lọ láti dákẹ́
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà fi hàn pé ìdákẹ́ Jésù ń bá a lọ; yíyan ọ̀rọ̀ yìí mú apá ìtẹ̀síwájú náà jáde ní Yorùbá àdánidá.
- source_word: ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ipò àlùfáà tó ga jù lọ nínú ọ̀ràn ìdájọ́ yìí.
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Mo fi Ọlọ́run alààyè mú ọ búra
  rationale: Ó pa agbára ọ̀rọ̀ ìbúra onídàájọ́ mọ́, ó sì yẹra fún ìtumọ̀ tó ní í ṣe pẹ̀lú lílé ẹ̀mí èṣù, èyí tí kò bá àyíká ọ̀rọ̀ mu.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: sọ fún wa
  rationale: Àṣẹ tààrà yìí jẹ́ Yorùbá àdánidá, ó sì fi ohun tí olórí àlùfáà ń béèrè hàn kedere.
- source_word: ὁ χριστὸς
  choice: Mèsáyà
  rationale: Níbí, ọ̀rọ̀ náà jẹ́ oyè ẹni àmì òróró tí àwọn ènìyàn ń retí, kì í ṣe apá kan orúkọ; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó túmọ̀ oyè Kristi yìí ní tààrà láì dín agbára rẹ̀ kù tàbí fi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Ṣùgbọ́n Jésù
  rationale: “Ṣùgbọ́n” mú ìyàtọ̀ pẹ̀lẹ́ tó wà láàárín ẹ̀sùn tí wọ́n ń kàn án àti ìdákẹ́ rẹ̀ jáde.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìbéèrè nípa ẹni tí Jésù jẹ́
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ ὁ àti àyíká ìbéèrè fi hàn pé oyè ni, kì í ṣe orúkọ. A fi “Kristi” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó bófin mu.
- issue: Agbára ọ̀rọ̀ Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Ọ̀rọ̀ mímú ẹni búra ní ti òfin níwájú Ọlọ́run
  alternative: Àṣẹ lásán tí kò ní agbára ìbúra
  rationale: Ìpè sí Ọlọ́run alààyè àti àyíká ìdájọ́ fi hàn pé ọ̀rọ̀ ìbúra ọlọ́wọ̀ ni; ìtumọ̀ yìí pa ìwúwo rẹ̀ mọ́ láì fi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn “ń bá a lọ láti dákẹ́” pa ìtẹ̀síwájú inú ọ̀rọ̀-ìṣe Gíríìkì mọ́, “mú ọ búra” sì jẹ́ kó ye òǹkàwé òde òní pé ọ̀rọ̀ ìbúra ọlọ́wọ̀ ni. A tún gbe àwọn àmì àlàyé sí ibi tí ọ̀kọ̀ọ̀kan wọn tọ́ sí nínú ẹsẹ náà.
