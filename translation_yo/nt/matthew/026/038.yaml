id: MAT.26.38
reference: Matthew 26:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: yo
  text: Nígbà náà ni ó sọ fún wọn pé, “Ọkàn mi kún fún ìbànújẹ́ gidigidi,[a] àní títí dé ikú.[b] Ẹ dúró níhìn-ín, ẹ sì máa ṣọ́ pẹ̀lú mi.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ọkàn mi ní ìbànújẹ́ púpọ̀” tàbí “Ìbànújẹ́ ti bo ọkàn mi mọ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “tó dé ojú ikú.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ sì máa wà lójúfò pẹ̀lú mi.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí jíjí lójú oorun àti sí wíwà lójúfò pẹ̀lú ìṣọ́ra.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ àkókò tó ń tẹ ìtàn síwájú lọ́nà àdánidá.
- source_word: λέγει αὐτοῖς
  choice: ó sọ fún wọn pé
  rationale: Èdè Yorùbá kì í fi ìyàtọ̀ àkókò hàn lórí ọ̀rọ̀-ìṣe bí Gíríìkì; gbólóhùn yìí bá ìtàn mu, ó sì pa ìṣísẹ̀ ìṣẹ̀lẹ̀ mọ́.
- source_word: Περίλυπός ἐστιν ἡ ψυχή μου
  choice: Ọkàn mi kún fún ìbànújẹ́ gidigidi
  rationale: ‘Ọkàn mi’ pa ψυχή mọ́ gẹ́gẹ́ bí orúkọ dípò lílo ‘mo’; ‘kún fún ìbànújẹ́ gidigidi’ sọ bí ìbànújẹ́ náà ṣe jinlẹ̀ tó ní Yorùbá àdánidá.
- source_word: ἕως θανάτου
  choice: àní títí dé ikú
  rationale: Ó pa ààlà líle tí gbólóhùn Gíríìkì náà fi hàn mọ́, láì pinnu bóyá ó túmọ̀ sí ìbànújẹ́ tó lè fa ikú tàbí tó dé ibi pé ẹni náà fẹ́rẹ̀ẹ́ kú.
- source_word: μείνατε ὧδε
  choice: Ẹ dúró níhìn-ín
  rationale: Àṣẹ náà ní kí àwọn ọmọ-ẹ̀yìn má kúrò ní ibẹ̀; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ọ́.
- source_word: γρηγορεῖτε μετ’ ἐμοῦ
  choice: kí ẹ sì máa ṣọ́nà pẹ̀lú mi
  rationale: ‘Máa ṣọ́nà’ lè gba ìṣọ́ra àti wíwà lójúfò, ó sì bá ọ̀rọ̀ nípa wíwà pẹ̀lú Jésù mu.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ Jésù
  choice: Ọkàn mi
  alternative: Mo kún fún ìbànújẹ́ gidigidi
  rationale: Yíyan ‘ọkàn mi’ pa orúkọ tí Gíríìkì lò mọ́, ó sì jẹ́ kí ìrora inú Jésù hàn gbangba láì fi èrò ẹ̀kọ́ kan tí ẹsẹ̀ náà kò sọ kún un.
- issue: Agbára ìtumọ̀ γρηγορεῖτε
  choice: máa ṣọ́nà
  alternative: má ṣe sùn
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí jíjí lójú oorun àti sí ìṣọ́ra. Ọ̀rọ̀ inú ẹsẹ̀ pa ìtumọ̀ tó gbòòrò mọ́, àlàyé ìsàlẹ̀ sì fi ìtumọ̀ jíjí lójú oorun hàn.
- issue: Ìtumọ̀ ἕως θανάτου
  choice: àní títí dé ikú
  alternative: tó dé ojú ikú
  rationale: 'A pa àìdánilójú tó wà nínú ọ̀rọ̀ náà mọ́: ó lè ṣàpèjúwe bí ìbànújẹ́ ṣe pọ̀ tó tàbí bí ó ṣe mú ẹni náà sún mọ́ ikú.'
translation_notes:
  register: Yorùbá àtẹ̀jáde, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá ṣe àdánidá, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
