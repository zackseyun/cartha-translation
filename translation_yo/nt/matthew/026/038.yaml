  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní pàtàkì: τότε, λέγει αὐτοῖς, ἡ ψυχή μου, ἕως θανάτου, àti μείνατε ὧδε ni a ti fi hàn. Ṣùgbọ́n “máa ṣọ́nà pẹ̀lú mi” kò dáa gẹ́gẹ́ bí ìtumọ̀ àṣẹ γρηγορεῖτε μετ’ ἐμοῦ; ó lè dà bí ìkìlọ̀ pé kí wọ́n ṣọ́ra dípò àṣẹ láti máa ṣọ́/wà lójúfò pẹ̀lú un.'
