revisions:
- from: Obìnrin kan tọ̀ ọ́ wá, ó mú ìgò alábásítà kan tí ó kún fún òróró olóòórùn dídùn tí ó níye lórí gidigidi[a]; ó sì dà á sí orí rẹ̀ bí ó ti jókòó rọgbọ síbi oúnjẹ[b].
  to: Obìnrin kan tọ̀ ọ́ wá, ó mú ìgò alabásítà kan tí ó ní òróró olóòórùn dídùn tí iye rẹ̀ pọ̀ gidigidi[a]; ó sì dà òróró náà sí orí rẹ̀ bí ó ti dùbúlẹ̀ níbi tábìlì[b].
  rationale: Àtúnyẹ̀wò náà yọ ìfikún “tí ó kún fún” kúrò, nítorí ìpilẹ̀ Gíríìkì kò sọ pé ìgò náà kún. Ó tún yí àpèjúwe ipò jíjẹun padà sí “dùbúlẹ̀ níbi tábìlì” kí ó lè bá ἀνακειμένου mu ní pẹkipẹki, láì fi ìtumọ̀ àfikún kún un. Àwọn àlàyé ẹsẹ̀ náà jẹ́ kedere síi, wọ́n sì dúró lórí ìpinnu ìtumọ̀ ìpilẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:45Z'
