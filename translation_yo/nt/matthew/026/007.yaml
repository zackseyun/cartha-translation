id: MAT.26.7
reference: Matthew 26:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: yo
  text: Obìnrin kan tọ̀ ọ́ wá, ó mú ìgò alabásítà kan tí ó ní òróró olóòórùn dídùn tí iye rẹ̀ pọ̀ gidigidi[a]; ó sì dà òróró náà sí orí rẹ̀ bí ó ti dùbúlẹ̀ níbi tábìlì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgò alabásítà kan tí ó ní ohun ìkunra olóòórùn dídùn tí iye rẹ̀ pọ̀ gidigidi.” Ọ̀rọ̀ Gíríìkì μύρον lè tọ́ka sí òróró olóòórùn dídùn tàbí ohun ìkunra, kì í ṣe òórùn olómi ti òde òní nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, ó dùbúlẹ̀ ní ipò jíjẹun gẹ́gẹ́ bí àṣà ìgbà náà.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò sí ọ̀dọ̀ ẹni kan hàn ní Yorùbá àdánidá, ó sì bá προσέρχομαι mu.
- source_word: γυνή
  choice: Obìnrin kan
  rationale: Orúkọ náà kò ní àpèjúwe tàbí ìdánimọ̀ níbí; “kan” fi àìsọ pàtó rẹ̀ hàn.
- source_word: ἔχουσα
  choice: ó mú
  rationale: Nínú ọ̀rọ̀ yìí, ó túmọ̀ sí pé obìnrin náà mú ohun èlò náà dání wá; èyí jẹ́ Yorùbá àdánidá ju ìtumọ̀ gígán “ní” lọ.
- source_word: ἀλάβαστρον μύρου
  choice: ìgò alábásítà kan tí ó kún fún òróró olóòórùn dídùn
  rationale: ἀλάβαστρον jẹ́ ohun èlò alábásítà, μύρον sì lè jẹ́ òróró tàbí ohun ìkunra olóòórùn dídùn. Gbólóhùn yìí yà ohun èlò àti ohun tó wà nínú rẹ̀ sọ́tọ̀ ní kedere.
- source_word: βαρυτίμου
  choice: tí ó níye lórí gidigidi
  rationale: Ó pa ìtẹnumọ́ iye gíga ohun náà mọ́ láì dín in kù sí pé ó kan gbówó lórí.
- source_word: κατέχεεν
  choice: ó dà á
  rationale: Ó fi ìṣe dída ohun olómi sí orí ẹni hàn ní kedere, gẹ́gẹ́ bí καταχέω.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: sí orí rẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe “dà,” “sí orí rẹ̀” ni Yorùbá àdánidá fún ibi tí ohun náà dé.
- source_word: ἀνακειμένου
  choice: bí ó ti jókòó rọgbọ síbi oúnjẹ
  rationale: Ó ṣàlàyé ìdúró ara ìgbà àtijọ́ níbi jíjẹun, dípò kí “rọgbọ” dá nìkan kí ó sì dà bí ẹni pé ó ń sinmi.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “jókòó rọgbọ síbi oúnjẹ” láti jẹ́ kí àṣà jíjẹun tó wà lẹ́yìn ἀνάκειμαι yé òǹkàwé lónìí. Àwọn àmì àlàyé [a] àti [b] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
