source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: yo
  text: Nígbà tí Jésù parí gbogbo ọ̀rọ̀ wọ̀nyí,[a] ó sì sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tí ó tẹ̀lé ìrísí Gíríìkì pẹkipẹki: “Ó sì ṣẹlẹ̀ nígbà tí Jésù parí gbogbo ọ̀rọ̀ wọ̀nyí, ó sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé,”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Nígbà tí … sì
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà ìyípadà ìtàn tí ó fi àkókò hàn. Èdè Yorùbá àdánidá kò nílò láti sọ ọ́ ní líle gẹ́gẹ́ bí ‘Ó sì ṣẹlẹ̀ nígbà tí’; ‘Nígbà tí … sì’ pa ìbáṣepọ̀ àkókò àti ìtẹ̀síwájú ìtàn mọ́.
- source_word: ἐτέλεσεν
  choice: parí
  rationale: ‘Parí’ sọ pé Jésù mú ọ̀rọ̀ rẹ̀ dé òpin, ó sì bá èdè Yorùbá ode òní mu ju gbólóhùn líle bí ‘mú … ṣẹ’ lọ.
- source_word: πάντας τοὺς λόγους τούτους
  choice: gbogbo ọ̀rọ̀ wọ̀nyí
  rationale: Ìtumọ̀ yìí pa ‘gbogbo,’ ‘ọ̀rọ̀,’ àti atọ́ka ‘wọ̀nyí’ mọ́, ó sì bá ọ̀nà tí Mátíù fi ń pa apá ẹ̀kọ́ dé mu.
- source_word: εἶπεν
  choice: ó sọ … pé
  rationale: ‘Ó sọ fún … pé’ jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tààrà tí ẹsẹ tó tẹ̀ lé yóò gbé kalẹ̀.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: fún àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Àwọn ọmọ-ẹ̀yìn’ ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún μαθηταί, ‘rẹ̀’ sì pa ohun-ìní αὐτοῦ mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé ode òní; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Gbólóhùn náà mọ̀ọ́mọ̀ parí sí ‘pé,’ nítorí pé ọ̀rọ̀ Jésù ń bá a lọ ní ẹsẹ tó tẹ̀ lé.
