  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: yo
  text: Àwọn olórí àlùfáà àti gbogbo ìgbìmọ̀ náà[b] ń wá ẹ̀rí èké[a] lòdì sí Jésù, kí wọn lè pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹlẹ́rìí èké.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀rí èké tàbí ẹlẹ́rìí èké nínú ọ̀ràn ìdájọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo Sànhẹ́dírìn.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìgbìmọ̀ alákòóso àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: kò ṣe àfihàn rẹ̀ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: Ó jẹ́ àsopọ̀ ìtàn tí kò ní agbára ìtakò tó lágbára níbí; ìṣàn gbólóhùn Yorùbá kò béèrè fún ‘ṣùgbọ́n’ tàbí ‘nígbà náà.’
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú ẹgbẹ́ àwọn àlùfáà, kì í ṣe pé ọ̀kọ̀ọ̀kan wọn ni àlùfáà àgbà tó wà lórí ipò ní àkókò kan náà.
- source_word: συνέδριον ὅλον
  choice: gbogbo ìgbìmọ̀ náà
  rationale: ‘Ìgbìmọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹgbẹ́ alákòóso àti adájọ́ yìí; ‘gbogbo’ pa ìtẹnumọ́ ὅλον mọ́.
- source_word: ἐζήτουν
  choice: ń wá
  rationale: Ó fi ìṣe tí ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: ψευδομαρτυρίαν
  choice: ẹ̀rí èké
  rationale: Ó bá àyíká ìdájọ́ mu, ó sì lè tọ́ka sí ọ̀rọ̀ ẹ̀rí èké láì sọ pé ẹni tó jẹ́ ẹlẹ́rìí nìkan ni a ń tọ́ka sí.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: lòdì sí Jésù
  rationale: Ó sọ ìdojúkọ Jésù nínú ọ̀ràn ìdájọ́ ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ὅπως
  choice: kí wọn lè
  rationale: Ó pa ète tàbí ìdí tí wọ́n fi ń wá ẹ̀rí náà mọ́ ní èdè Yorùbá àdánidá.
- source_word: θανατώσωσιν
  choice: pa á
  rationale: Ó túmọ̀ ìmúni kú ní kedere láì fi ìlànà pàtó bí ‘dájọ́ ikú’ tàbí ‘jẹ́ kí a pa á’ kún ohun tí Gíríìkì kò sọ ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ ète àwọn aṣáájú nínú ọ̀ràn ìdájọ́
  choice: A fi hàn pé wọ́n ń bá a lọ láti wá ẹ̀rí èké pẹ̀lú ète láti pa Jésù.
  alternative: A lè sọ ní ṣókí pé wọ́n ‘wá ẹlẹ́rìí èké láti pa Jésù.’
  rationale: Àkókò imperfect ἐζήτουν àti gbólóhùn ète ὅπως…θανατώσωσιν fi ìsapá tó ń lọ lọ́wọ́ àti ète wọn hàn; a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. A yan ‘ìgbìmọ̀’ dípò yíyá ‘Sànhẹ́dírìn’ wọ inú ẹsẹ̀, a sì fi orúkọ náà sínú àlàyé ìsàlẹ̀.
