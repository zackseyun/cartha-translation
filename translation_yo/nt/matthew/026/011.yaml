source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: yo
  text: Nítorí nígbà gbogbo ni àwọn tálákà[a] wà pẹ̀lú yín, ṣùgbọ́n èmi kò wà pẹ̀lú yín nígbà gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn tálákà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ohun tí ó máa ń bá a lọ tàbí tí ó wà ní gbogbo ìgbà; “nígbà gbogbo” jẹ́ ọ̀nà Yorùbá àdánidá, ó sì pa àtúnwí ọ̀rọ̀ náà mọ́ nínú ẹsẹ yìí.
- source_word: γὰρ
  choice: nítorí
  rationale: γάρ ń fi ìdí ọ̀rọ̀ tí a sọ ṣáájú hàn. “Nítorí” so ẹsẹ yìí mọ́ àlàyé tó ṣáájú rẹ̀ lọ́nà tó ṣe kedere.
- source_word: τοὺς πτωχοὺς
  choice: àwọn tálákà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí wọ́n jẹ́ tálákà lápapọ̀. “Àwọn tálákà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tí kò sì fi àlàyé míì kún un.
- source_word: ἔχετε
  choice: máa ń wà pẹ̀lú yín / kò ní máa wà pẹ̀lú yín
  rationale: Nínú àyíká yìí, ἔχω ń sọ nípa wíwà ẹni kan lọ́dọ̀ wọn, kì í ṣe níní ẹni náà gẹ́gẹ́ bí ohun-ìní. Ìtumọ̀ pẹ̀lú “wà pẹ̀lú yín” jẹ́ Yorùbá àdánidá, ó sì mú ìtumọ̀ ìwàníhìn-ín náà jáde.
- source_word: μεθ’ ἑαυτῶν
  choice: pẹ̀lú yín
  rationale: Gbólóhùn náà ń fi hàn pé àwọn ènìyàn wọ̀nyí wà lọ́dọ̀ àwọn ọmọ-ẹ̀yìn. “Pẹ̀lú yín” sọ èyí ní Yorùbá tó rọrùn, tó sì péye.
- source_word: ἐμὲ
  choice: èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Jésù fúnra rẹ̀. A lo “èmi” gẹ́gẹ́ bí olùṣe nínú gbólóhùn Yorùbá àdánidá tí a fi “wà” ṣe.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: δέ ń fi ìyàtọ̀ hàn láàárín bí àwọn tálákà ṣe máa ń wà pẹ̀lú wọn nígbà gbogbo àti bí Jésù kò ṣe ní máa wà pẹ̀lú wọn nígbà gbogbo. “Ṣùgbọ́n” mú ìyàtọ̀ náà hàn kedere.
- source_word: οὐ πάντοτε
  choice: kò ní máa wà ... nígbà gbogbo
  rationale: Gbólóhùn yìí sẹ́ pé wíwà Jésù pẹ̀lú wọn yóò máa bá a lọ ní gbogbo ìgbà. Ìtumọ̀ yìí pa ìyàtọ̀ tó wà pẹ̀lú πάντοτε àkọ́kọ́ mọ́, ó sì bá Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ wíwà Jésù pẹ̀lú àwọn ọmọ-ẹ̀yìn
  choice: Ẹsẹ náà fi wíwà àwọn tálákà lọ́dọ̀ wọn nígbà gbogbo wé àkókò díẹ̀ tí Jésù ṣì máa wà pẹ̀lú wọn ní ti ara.
  alternative: A lè ka ẹsẹ náà bí ẹni pé ó ń dín ojúṣe láti tọ́jú àwọn tálákà kù.
  rationale: Ọ̀rọ̀ Gíríìkì ń fi ìyàtọ̀ àkókò hàn; kò sọ pé àwọn tálákà kò ṣe pàtàkì. Ìtumọ̀ náà pa ìtẹnumọ́ Jésù lórí àkókò pàtàkì tó ṣáájú ikú rẹ̀ mọ́ láìfi ẹ̀kọ́ tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Máa ń wà pẹ̀lú yín” yàgò fún èrò pé a ń sọ nípa fífi ènìyàn ṣe ohun-ìní, ó sì sọ ìtumọ̀ wíwà lọ́dọ̀ wọn ní kedere. A fi àmì ohùn sí ibi tí ó bá èdè Yorùbá àfẹnusọ mu.
