id: MAT.26.35
reference: Matthew 26:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: yo
  text: Pétérù sọ fún un pé, “Kódà bí mo bá ní láti kú pẹ̀lú rẹ, èmi kì yóò sẹ́ ọ rárá.[a]” Bákan náà, gbogbo àwọn ọmọ-ẹ̀yìn náà sọ ohun kan náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi kì yóò sẹ́ ọ láéláé.” Ọ̀rọ̀ Gíríìkì náà ní ìkọ̀ méjì tó lágbára (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí inú ìtàn, “sọ” jẹ́ ọ̀nà àdánidá láti ròyìn ọ̀rọ̀ tí Pétérù sọ ní Yorùbá.
- source_word: Κἂν
  choice: Kódà bí
  rationale: Ó fi ipò ìyọ̀ǹda tí a tẹnumọ́ hàn, ó sì bá “even if” mu ní Yorùbá òde òní.
- source_word: δέῃ με
  choice: mo bá ní láti
  rationale: Ó pa ìtumọ̀ ohun tí ó pọndandan mọ́, ní inú gbólóhùn oníṣ条件 tí κἄν bẹ̀rẹ̀.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: láti bá ọ kú
  rationale: “Bá ọ kú” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ikú pẹ̀lú ẹnì kan, láìfi ìtumọ̀ míì kún un.
- source_word: οὐ μή
  choice: kì yóò ... rárá
  rationale: Àpapọ̀ òdì Gíríìkì yìí lágbára gan-an; “kì yóò ... rárá” mú ìtẹnumọ́ náà jáde ní Yorùbá àdánidá.
- source_word: ἀπαρνήσομαι
  choice: sẹ́ ọ
  rationale: “Sẹ́” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún kí ènìyàn sọ pé òun kò mọ ẹni kan tàbí kí ó kọ́ ọ ní gbangba nínú àyíká yìí.
- source_word: ὁμοίως
  choice: Bákan náà
  rationale: Ó túmọ̀ sí pé àwọn ọmọ-ẹ̀yìn yòókù sọ irú ohun tí Pétérù sọ.
- source_word: πάντες οἱ μαθηταὶ
  choice: gbogbo àwọn ọmọ-ẹ̀yìn náà
  rationale: Ó pa “gbogbo” àti àwùjọ àwọn μαθηταί mọ́ láìfi ẹni tí wọ́n jẹ́ ọmọ-ẹ̀yìn rẹ̀ hàn ní kedere ju bí Gíríìkì ṣe sọ lọ.
- source_word: εἶπαν
  choice: sọ
  rationale: Ìtumọ̀ tó tààrà, tó sì yẹ fún ìròyìn ọ̀rọ̀ ni Yorùbá.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Pétérù pé òun kì yóò sẹ́ Jésù
  choice: “èmi kì yóò sẹ́ ọ rárá”
  alternative: “èmi kì yóò sẹ́ ọ láéláé”
  rationale: “Kì yóò ... rárá” pa agbára οὐ μή mọ́, ó sì jẹ́ kí ìgbẹ́kẹ̀lé tí Pétérù ní nínú ara rẹ̀ dúró láìṣàlàyé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kankan sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní ni a lò. “Kódà bí” àti “bá ọ kú” jẹ́ ti èdè àdánidá, nígbà tí “èmi ... rárá” pa ìtẹnumọ́ inú Gíríìkì mọ́. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tó yẹ.
