base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: yo
  text: Ìbànújẹ́ sì bá wọn gidigidi, wọ́n sì bẹ̀rẹ̀ sí í sọ fún un lọ́kọ̀ọ̀kan[a] pé, “Èmi kọ́ ni, Olúwa?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “olúkúlùkù” tàbí “ọ̀kan lẹ́yìn òmíràn.”
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀nà tí a gbà béèrè ìbéèrè náà ní Gíríìkì ń retí ìdáhùn òdì: “Èmi kọ́ ni, Olúwa?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι
  choice: Ìbànújẹ́ sì bá wọn
  rationale: Ó fi ipò ìmọ̀lára ìbànújẹ́ tí ó ń bá a lọ hàn ní Yorùbá àdánidá, láì sọ ọ́ di ìbẹ̀rù tàbí ìdààmú lásán.
- source_word: σφόδρα
  choice: gidigidi
  rationale: Ọ̀rọ̀ yìí mú ìbànújẹ́ náà lágbára, bí σφόδρα ṣe ń ṣe nínú Gíríìkì.
- source_word: ἤρξαντο λέγειν
  choice: wọ́n sì bẹ̀rẹ̀ sí í sọ
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ ìṣe inú gbólóhùn Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe déédéé.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó tú dátífù ẹni tí wọ́n ń bá sọ̀rọ̀ sí ní ṣókí, láì fi àlàyé kún un.
- source_word: εἷς ἕκαστος
  choice: lọ́kọ̀ọ̀kan
  rationale: Ó fi hàn pé olúkúlùkù wọn dáhùn fúnra rẹ̀, ọ̀kan lẹ́yìn òmíràn.
- source_word: Μήτι
  choice: èmi kọ́, àbí?
  rationale: Ìbéèrè Yorùbá yìí ń retí ìdáhùn òdì, gẹ́gẹ́ bí μήτι ṣe ń ṣe nínú Gíríìkì.
- source_word: ἐγώ εἰμι
  choice: èmi
  rationale: Fífi àmì ìtakò kọ́ mọ́ èmi mú ìbéèrè Yorùbá péye, ó sì pa ìtẹnumọ́ ẹni tó ń sọ̀rọ̀ mọ́.
- source_word: κύριε
  choice: Olúwa
  rationale: Ó pa ìwọ̀n oyè àti ìtumọ̀ ẹ̀sìn tí κύριε lè ní nígbà tí àwọn ọmọ-ẹ̀yìn ń bá Jésù sọ̀rọ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe tú κύριε nígbà tí wọ́n ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: ọ̀gá; olùkọ́
  rationale: “Olúwa” pa agbára oyè náà àti ìwọ̀n ìtumọ̀ ìtàn Mátíù mọ́, láì sọ ọ́ di ọ̀rọ̀ ọ̀wọ̀ lásán tàbí fi ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì yé àwọn òǹkàwé lápapọ̀. A lo “Ìbànújẹ́ bá wọn gidigidi” fún ìmọ̀lára tó jinlẹ̀, “lọ́kọ̀ọ̀kan” fún ìdáhùn ẹnì kọ̀ọ̀kan, àti ìbéèrè “èmi kọ́, àbí?” láti pa ìretí ìdáhùn òdì inú Gíríìkì mọ́.
