id: MAT.26.51
reference: Matthew 26:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: yo
  text: Sì kíyèsí i, ọ̀kan lára àwọn tí ó wà pẹ̀lú Jésù na ọwọ́ rẹ̀, ó fa idà rẹ̀ yọ, ó sì fi idà náà kọlu ẹrú olórí àlùfáà, ó sì gé etí rẹ̀ kúrò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa ìyára àti ìmúnilójú àmì ìtàn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: ọ̀kan lára àwọn tí ó wà pẹ̀lú Jésù
  rationale: Ó tẹ̀ lé àkópọ̀ apá-kan-nínú-ọ̀pọ̀ Gíríìkì láì sọ ẹni náà di mímọ̀ ju orísun lọ.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: na ọwọ́ rẹ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí ṣàfihàn ìṣe tó ṣáájú fífa idà yọ ní kedere.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: ó fa idà rẹ̀ yọ
  rationale: Ìtumọ̀ àdánidá fún yíyan ohun ìjà náà jáde; kò fi kún un pé ó wà nínú àkọ̀ idà.
- source_word: μάχαιραν
  choice: idà
  rationale: ‘Idà’ jẹ́ ọ̀rọ̀ gbogbogbò tó péye, láì fi ìwọ̀n tàbí irú ohun ìjà náà múlẹ̀ ju Gíríìkì lọ.
- source_word: πατάξας
  choice: ó fi idà náà kọlu
  rationale: Ó sọ ìlù líle náà ní kedere, ó sì mú kí ohun tí a fi kọlu hàn ní Yorùbá àdánidá láti inú àyíká ọ̀rọ̀.
- source_word: δοῦλον
  choice: ẹrú
  rationale: ‘Ẹrú’ pa ipò ìdè àti ìní ẹni tí δοῦλος sábà ń tọ́ka sí mọ́, dípò mímú un rọ̀ sí ‘ìránṣẹ́.’
- source_word: ἀρχιερέως
  choice: olórí àlùfáà
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún oyè àlùfáà gíga jù lọ ní àyíká Jùù.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: ó gé etí rẹ̀ kúrò
  rationale: Ó fi abajade ìlù idà náà hàn kedere, ó sì tẹ̀ lé ọ̀rọ̀-ìṣe aláàlà Gíríìkì.
- source_word: ὠτίον
  choice: etí
  rationale: Fọ́ọ̀mù kékeré náà kò béèrè ‘ìsàlẹ̀ etí’; ‘etí’ ni ìtumọ̀ àdánidá tí kò ṣe àlàyé ju.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú ìṣẹ̀lẹ̀ awujọ tó ṣe pàtó
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àyíká náà fi ọkùnrin náà hàn gẹ́gẹ́ bí ẹni tó wà lábẹ́ ìdè ilé tàbí àṣẹ olórí àlùfáà; ‘ẹrú’ pa òtítọ́ awujọ ọ̀rọ̀ Gíríìkì mọ́ láì rọ̀ ọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá, pẹ̀lú àmì ohùn níbi tó yẹ. A lo àwọn gbolohun ìṣe tó tẹ̀ lé ara wọn láti pa ìyára ìtàn Gíríìkì mọ́. Kò sí àmì àlàyé nínú ọ̀rọ̀ nítorí kò sí àlàyé tí a nílò.
