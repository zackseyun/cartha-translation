  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: yo
  text: Nígbà náà, báwo ni a ó ṣe mú àwọn Ìwé Mímọ́ ṣẹ, tí ó sọ pé ó gbọdọ̀ ṣẹlẹ̀ báyìí?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà náà, báwo ni a ó ṣe lè mú àwọn Ìwé Mímọ́ ṣẹ, tí ó sọ pé ó gbọdọ̀ ṣẹlẹ̀ báyìí?”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún agbára ìbéèrè àti ìṣe abẹ́lẹ̀ πληρωθῶσιν.
lexical_decisions:
- source_word: πῶς οὖν
  choice: Ǹjẹ́, báwo ni
  rationale: “Báwo ni” ń mú ìbéèrè àfihàn tí πῶς dá sílẹ̀ wá ní èdè Yorùbá àdánidá; “Ǹjẹ́” sì so ìbéèrè náà mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ, gẹ́gẹ́ bí οὖν ti ṣe.
- source_word: πληρωθῶσιν
  choice: yóò ṣe ṣẹ
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún pé ohun tí Ìwé Mímọ́ sọ dé ìmúṣẹ; ó tún pa ipa ìbéèrè aláìṣeéṣe nínú ọ̀rọ̀ yìí mọ́ láìfi àlàyé kún un.
- source_word: αἱ γραφαί
  choice: àwọn Ìwé Mímọ́
  rationale: Nínú ọ̀rọ̀ yìí, ó tọ́ka sí àkójọpọ̀ àwọn ìwé mímọ́ Ísírẹ́lì, kì í ṣe sí ìwé lásán.
- source_word: ὅτι
  choice: èyí pé
  rationale: Ó ṣàfihàn àkóónú ohun tí Ìwé Mímọ́ ní láti ṣẹ, ní ọ̀nà Yorùbá tó ṣeé lóye, láìyí i sí ‘nítorí pé.’
- source_word: οὕτως
  choice: báyìí
  rationale: Ó tọ́ka sí bí àwọn ìṣẹ̀lẹ̀ ìmú Jésù àti ìjìyà rẹ̀ ṣe ń lọ ní àkókò náà.
- source_word: δεῖ γενέσθαι
  choice: ó gbọdọ̀ ṣẹlẹ̀
  rationale: Ó pa ìtumọ̀ dandan àti ìṣẹ̀lẹ̀ mọ́, láìfi kún un pé ‘gẹ́gẹ́ bí ìfẹ́ Ọlọ́run,’ èyí tí Gíríìkì kò sọ ní tààràtà.
theological_decisions:
- issue: Irú dandan tí δεῖ ń fi hàn
  choice: ó gbọdọ̀ ṣẹlẹ̀
  alternative: ó gbọdọ̀ ṣẹlẹ̀ gẹ́gẹ́ bí ètò Ọlọ́run
  rationale: Ìmúṣẹ Ìwé Mímọ́ fi dandan tó ní í ṣe pẹ̀lú ète Ọlọ́run hàn, ṣùgbọ́n ẹsẹ̀ náà kò ṣàlàyé rẹ̀ síwájú. Ìtumọ̀ náà kò gbọ́dọ̀ dá ẹ̀kọ́ ìsìn tí ọ̀rọ̀ Gíríìkì kò sọ ní gbangba kun un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. Àmì ìdádúró gígùn ṣèrànwọ́ láti fi ὅτι hàn gẹ́gẹ́ bí olùṣàlàyé àkóónú, níwọ̀n bí ìtumọ̀ tààràtà pẹ̀lú “pé” nìkan ti lè dàbí èdè àjèjì ní Yorùbá.
