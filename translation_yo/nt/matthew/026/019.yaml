  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn náà sì ṣe gẹ́gẹ́ bí Jésù ti pàṣẹ fún wọn, wọ́n sì pèsè Ìrékọjá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oúnjẹ Ìrékọjá”; πάσχα lè tọ́ka sí ayẹyẹ Ìrékọjá lápapọ̀, títí kan oúnjẹ tí a pèsè fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: ṣe
  rationale: Ọ̀rọ̀-ìṣe tó wọ́pọ̀ fún ‘ṣe’; pẹ̀lú ὡς συνέταξεν, ó túmọ̀ sí pé wọ́n ṣe ohun tí a pàṣẹ fún wọn.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere láti pe àwọn tó ń kọ́ lẹ́sẹ̀ Jésù tí wọ́n sì ń tẹ̀ lé e.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi hàn pé ohun tí wọ́n ṣe bá ìtọ́ni Jésù mu.
- source_word: συνέταξεν
  choice: ti pàṣẹ fún
  rationale: συντάσσω lè túmọ̀ sí láti pàṣẹ tàbí láti fún ní ìtọ́ni. Nínú àyíká yìí, ‘pàṣẹ fún’ pa agbára ọ̀rọ̀ náà mọ́ láìjẹ́ kí ó le ju bí ó ti yẹ lọ; ‘ti’ sì fi hàn pé àṣẹ náà ti ṣáájú ìṣe wọn.
- source_word: ἡτοίμασαν
  choice: pèsè
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún mímú ohun gbogbo ṣetán.
- source_word: τὸ πάσχα
  choice: Ìrékọjá
  rationale: Ó pa ìtumọ̀ gbígbòòrò πάσχα mọ́, èyí tó lè tọ́ka sí ayẹyẹ náà tàbí oúnjẹ rẹ̀, láìfi ‘oúnjẹ’ tàbí ‘ọ̀dọ́-àgùntàn’ kún ọ̀rọ̀ Gíríìkì.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà Yorùbá tó jẹ́ àṣà.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ τὸ πάσχα
  choice: Ìrékọjá
  alternative: oúnjẹ Ìrékọjá; ọ̀dọ́-àgùntàn Ìrékọjá
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ayẹyẹ Ìrékọjá lápapọ̀, oúnjẹ ayẹyẹ náà, tàbí ohun ẹbọ tó ní í ṣe pẹ̀lú rẹ̀. Àyíká náà ní í ṣe pẹ̀lú pípèsè oúnjẹ, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò fi ìtumọ̀ kan ṣoṣo múlẹ̀; nítorí náà, a pa àìdánilójú tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpéwọ̀, oníyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu; ‘ọmọ-ẹ̀yìn’ àti ‘Ìrékọjá’ jẹ́ àwọn ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ dáadáa.
