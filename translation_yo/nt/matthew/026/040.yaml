  source_fidelity: 'Ìtumọ̀ náà gba èrò pàtàkì Gíríìkì náà: Jésù wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn, ó bá wọn nígbà tí wọ́n ń sùn, ó sì bá Pétérù sọ̀rọ̀ pẹ̀lú ọ̀rọ̀-ìṣe púpọ̀ (“ẹ”). Ìbéèrè náà sì ń tọ́ka sí wíwà lójúfò/ṣíṣọ́nà fún wákàtí kan pẹ̀lú Jésù. Síbẹ̀, “Ṣé báyìí ni ẹ kò fi lè” kì í jẹ́ ọ̀nà Yorùbá tó rọrùn láti gbé ìbáwí ìyàlẹ́nu ti Οὕτως kalẹ̀; ó lè yí ìbéèrè náà sí ìbéèrè nípa ọ̀nà tí wọ́n ṣe kùnà.'
  naturalness: “Ṣé ẹ kò lè bá mi ṣọ́nà fún wákàtí kan bí?” jẹ́ gbolóhùn Yorùbá ìgbàlódé tó dára, tó sì jẹ́ ìbéèrè ìbáwí aláìléwu. “Pétérù” tún jẹ́ ìkọ̀wé orúkọ Bíbélì Yorùbá tó wọ́pọ̀ pẹ̀lú àmì ohùn.
  terminology: “Àwọn ọmọ-ẹ̀yìn,” “ṣọ́nà,” àti “wákàtí kan” bá ìtumọ̀ àti ìforúkọsílẹ̀ ìwé mímọ́ mu. “Ṣọ́nà” ní àyíká yìí gbé ìtumọ̀ γρηγορῆσαι—wà lójúfò/ṣọ́—dára.
