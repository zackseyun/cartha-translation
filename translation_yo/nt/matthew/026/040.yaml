id: MAT.26.40
reference: Matthew 26:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: yo
  text: Ó sì wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn náà, ó sì bá wọn tí wọ́n ń sùn; ó sì sọ fún Pétérù pé, “Ṣé ẹ kò lè bá mi ṣọ́nà fún wákàtí kan bí?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: Ó sì wá
  rationale: A lo ìsinsìnyí ìtàn Yorùbá láti mú ìtàn náà yè kooro, gẹ́gẹ́ bí ìsinsìnyí ìtàn inú Gíríìkì.
- source_word: πρὸς τοὺς μαθητὰς
  choice: sọ́dọ̀ àwọn ọmọ-ẹ̀yìn náà
  rationale: “Sọ́dọ̀” jẹ́ ọ̀nà àdánidá láti sọ ìlọsíwájú sí ibi tí àwọn ọmọ-ẹ̀yìn wà.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: ó sì bá wọn tí wọ́n ń sùn
  rationale: “Bá wọn tí wọ́n ń sùn” fi ìṣe tí ó ń lọ hàn, ó sì bá àkópọ̀ ọ̀rọ̀ Gíríìkì mu ní Yorùbá àdánidá.
- source_word: λέγει τῷ Πέτρῳ
  choice: ó sì sọ fún Peteru
  rationale: A pa ìsinsìnyí ìtàn mọ́; “Peteru” ni ìrúkọ tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: Οὕτως
  choice: Ṣé báyìí ni
  rationale: Ọ̀rọ̀ yìí mú ìyàlẹ́nu pẹ̀lú ìbáwí pẹ̀lẹ́ inú οὕτως jáde ní èdè Yorùbá àdánidá.
- source_word: οὐκ ἰσχύσατε
  choice: ẹ kò fi lè
  rationale: Ó túmọ̀ agbára tàbí àǹfààní láti ṣe ohun kan; arọ́pò-orúkọ “ẹ” jẹ́ púpọ̀, ó sì pa nọ́ńbà ọ̀rọ̀-ìṣe Gíríìkì mọ́.
- source_word: μίαν ὥραν
  choice: fún wákàtí kan
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi àkókò tí ìṣe kan gùn tó hàn.
- source_word: γρηγορῆσαι
  choice: ṣọ́nà
  rationale: Nínú àyíká yìí, “ṣọ́nà” ní ìtumọ̀ jíjíròrò àti wíwà lójúfò, ó sì lè dúró ní ìdákẹ́jẹ fún méjèèjì “stay awake” àti “keep watch.”
- source_word: μετ’ ἐμοῦ
  choice: bá mi
  rationale: Ó fi ìbákẹ́gbẹ́ hàn ní ṣókí àti ní Yorùbá àdánidá.
theological_decisions:
- issue: Jésù sọ̀rọ̀ fún Peteru ní ẹyọ ṣùgbọ́n ọ̀rọ̀-ìṣe ἰσχύσατε jẹ́ púpọ̀.
  choice: A fi “sọ fún Peteru” sílẹ̀, a sì lo “ẹ kò fi lè” fún ọ̀pọ̀ ènìyàn.
  alternative: Kí a sọ ìbéèrè náà di ẹyọ fún Peteru nìkan, tàbí kí a ṣàlàyé pé Peteru dúró fún gbogbo ẹgbẹ́.
  rationale: Gíríìkì sọ Peteru ní pàtó ṣùgbọ́n ó bá ọ̀pọ̀ ènìyàn sọ̀rọ̀; ìtumọ̀ náà pa ìfarakanra yìí mọ́ láìṣàlàyé rẹ̀ kúrò.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Kò sí àkọsílẹ̀-ẹsẹ̀ nítorí “ṣọ́nà” lè gbé ìtumọ̀ jíjí àti ìṣọ́ra méjèèjì; àwọn àkọsílẹ̀-ẹsẹ̀ Gẹ̀ẹ́sì tí a pèsè tún dà bí ẹni pé àmì wọn ti yí ipò padà, nítorí náà a kò dá wọn ṣe lọ́nà tí yóò ṣìnà.
