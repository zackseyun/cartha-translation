  to: Ó sì wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn náà, ó sì bá wọn tí wọ́n ń sùn; ó sì sọ fún Pétérù pé, “Ṣé ẹ kò lè bá mi ṣọ́nà fún wákàtí kan bí?”
  rationale: A tún ìbéèrè náà ṣe sí ọ̀nà tí ó rọrùn nínú Yorùbá, tí ó pa ìbáwí ìyàlẹ́nu mọ́ láìfi ìtumọ̀ míràn kún un. A pa adirẹsi ẹyọ sí Pétérù mọ́, a sì pa arọ́pò-orúkọ púpọ̀ “ẹ” mọ́, gẹ́gẹ́ bí Gíríìkì. Kò sí àkọsílẹ̀-ẹsẹ̀ tó pọndandan nítorí “ṣọ́nà” lè gbé ìtumọ̀ wíwà lójúfò àti ṣíṣọ́ tó wà nínú γρηγορῆσαι.
