id: MAT.26.73
reference: Matthew 26:73
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: yo
  text: Lẹ́yìn ìgbà díẹ̀, àwọn tí wọ́n dúró níbẹ̀ sún mọ́ Pétérù, wọ́n sì sọ fún un pé, “Lóòótọ́, ìwọ náà jẹ́ ọ̀kan lára wọn, nítorí ọ̀nà tí o gbà ń sọ̀rọ̀ pàápàá ń fi ọ hàn gbangba.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohùn agbègbè rẹ fi ọ hàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ ẹni, ọ̀nà tí ẹni gbà ń sọ̀rọ̀, tàbí ohùn agbègbè ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Lẹ́yìn ìgbà díẹ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àkókò kúkúrú kan kọjá kí ìṣẹ̀lẹ̀ tó tẹ̀ lé ṣẹlẹ̀.
- source_word: δὲ
  choice: —
  rationale: Níhìn-ín, ó kàn ń tẹ ìtàn náà síwájú; ìṣètò gbólóhùn Yorùbá ti fi ìyípadà náà hàn láìsí ọ̀rọ̀ ọ̀tọ̀.
- source_word: προσελθόντες
  choice: sún mọ́
  rationale: Ó ṣàpèjúwe bí àwọn ènìyàn náà ṣe lọ sí ọ̀dọ̀ Pétérù, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ tí kò ní ìtumọ̀ àfikún.
- source_word: οἱ ἑστῶτες
  choice: àwọn tí ó dúró níbẹ̀
  rationale: Ó pa agbára participle Gíríìkì mọ́, ó sì tọ́ka sí àwọn tó wà ní àgbègbè náà láì pe wọ́n ní orúkọ àlàyé mìíràn.
- source_word: εἶπον τῷ Πέτρῳ
  choice: wọ́n sì sọ fún un
  rationale: Yorùbá àdánidá fún ‘wọ́n sọ fún Pétérù’; aṣojú-orúkọ náà yàgò fún àtúnsọ orúkọ Pétérù lẹ́sẹ̀kẹsẹ̀.
- source_word: Ἀληθῶς
  choice: Lóòótọ́
  rationale: Ó fi ìdánilójú líle tí àwọn olùsọ̀rọ̀ ní hàn ní ọ̀nà tó bójú mu fún ẹ̀sùn inú ìjíròrò.
- source_word: καὶ σὺ
  choice: ìwọ náà
  rationale: Ó tẹnu mọ́ pé Pétérù wà lára ẹgbẹ́ tí wọ́n ń tọ́ka sí.
- source_word: ἐξ αὐτῶν
  choice: ọ̀kan lára wọn
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere jù lọ láti sọ jíjẹ́ ara ẹgbẹ́ kan.
- source_word: καὶ γὰρ
  choice: nítorí … pàápàá
  rationale: ‘Nítorí’ mú ìdí tí γάρ ń fún wa jáde, ‘pàápàá’ sì pa agbára ìtẹnumọ́ καί mọ́.
- source_word: ἡ λαλιά σου
  choice: ọ̀nà tí o gbà ń sọ̀rọ̀
  rationale: λαλιά lè túmọ̀ sí ọ̀rọ̀, ìlànà sísọ̀rọ̀, tàbí ohùn agbègbè. Gbólóhùn yìí pa ààyè ìtumọ̀ náà mọ́ ju yíyan ‘ohùn agbègbè’ nìkan lọ.
- source_word: δῆλόν σε ποιεῖ
  choice: fi ọ hàn gbangba
  rationale: Ó pa ẹni tí a ń fi hàn gẹ́gẹ́ bí object mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí ó mú kí ìdánimọ̀ ẹni ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àgbà lítíréṣọ̀ tí ó ní àmì ohùn ní kíkún, ṣùgbọ́n tí ó ṣì rọrùn fún òǹkàwé òde òní. A lo “ọ̀nà tí o gbà ń sọ̀rọ̀” nínú ọ̀rọ̀ pàtàkì láti pa àìdánilójú λαλιά mọ́; àlàyé ìsàlẹ̀ ojú ewé sì mẹ́nu kan ‘ohùn agbègbè’ gẹ́gẹ́ bí ìtumọ̀ míì.
