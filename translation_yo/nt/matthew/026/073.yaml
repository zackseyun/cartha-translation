  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó ṣàfihàn àkókò kúkúrú, ìsúnmọ́ àwọn ènìyàn náà, ìdánilójú wọn pé Pétérù wà lára ẹgbẹ́ náà, àti ìdí tí ọ̀nà ìsọ̀rọ̀ rẹ̀ fi ń ṣí ìdánimọ̀ rẹ̀ payá. “Ọ̀nà tí o gbà ń sọ̀rọ̀” dára nítorí ó pa àìdánilójú λαλιά mọ́, níbi tí ‘ohùn agbègbè’ nìkan lè jẹ́ ìtumọ̀ tó hàn gbangba ju.'
