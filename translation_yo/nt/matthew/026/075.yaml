id: MAT.26.75
reference: Matthew 26:75
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: yo
  text: Pétérù sì rántí ọ̀rọ̀ tí Jésù ti sọ pé, “Kí àkùkọ tó kọ[a], ìwọ yóò sẹ́ mi ní ìgbà mẹ́ta.” Ó sì jáde lọ síta, ó sunkún kíkankíkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Kí àkùkọ náà tó kọ.” Ọ̀rọ̀ Gíríìkì kò ní àmì ìtọ́ka pàtó; ní Yorùbá, a lè sọ ọ́ láìsí “náà” tàbí pẹ̀lú “náà,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: rántí
  rationale: Ó túmọ̀ sí pé ọ̀rọ̀ náà padà wá sí ìrántí Pétérù; ‘rántí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu nínú ìtàn.
- source_word: ῥήματος
  choice: ọ̀rọ̀
  rationale: Níbí, ῥῆμα tọ́ka sí ohun tí a sọ; ‘ọ̀rọ̀’ jẹ́ àyànfẹ́ àdánidá, gbolohun tó tẹ̀ lé sì ṣàlàyé pé Jésù ló sọ ọ́.
- source_word: εἰρηκότος
  choice: tí Jésù ti sọ
  rationale: Àpólà náà tọ́ka sí ohun tí Jésù sọ ṣáájú tí ó sì ṣì ṣe pàtàkì; ‘ti sọ’ fi ìṣáájú yẹn hàn lọ́nà àdánidá.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Kí àkùkọ tó kọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣẹ̀lẹ̀ tí yóò ṣẹlẹ̀ ṣáájú òmíràn. ‘Àkùkọ’ láìsí olùtọ́ka pàtó bá àìsí article nínú Gíríìkì mu, kò sì fi dandan tọ́ka sí ẹyẹ kan pàtó.
- source_word: τρὶς
  choice: ní ìgbà mẹ́ta
  rationale: Ó sọ iye ìgbà náà ní kedere nínú Yorùbá òde òní.
- source_word: ἀπαρνήσῃ
  choice: ìwọ yóò sẹ́ mi
  rationale: ‘Sẹ́ mi’ túmọ̀ sí kí Pétérù kọ̀ pé òun mọ Jésù tàbí pé òun ní ìbáṣepọ̀ pẹ̀lú rẹ̀; ó pa ìwúwo ìṣe náà mọ́ láìfikún àlàyé.
- source_word: ἐξελθὼν ἔξω
  choice: jáde lọ síta
  rationale: Ọ̀rọ̀ yìí pa ìtẹnumọ́ Gíríìkì mọ́ pé ó kúrò níbi náà, ó sì jẹ́ gbolohun Yorùbá tó ṣeé lóye.
- source_word: ἔκλαυσεν πικρῶς
  choice: sunkún kíkorò
  rationale: Àkópọ̀ yìí fi ẹ̀dùn ọkàn jíjinlẹ̀ hàn láìṣe àfikún ohun tí Gíríìkì kò sọ.
theological_decisions:
- issue: Ṣíṣe àtọ́ka sí Jésù ní orúkọ nìkan
  choice: Jésù
  alternative: Olúwa Jésù
  rationale: Gíríìkì ní Ἰησοῦ nìkan; a kò fi oyè ẹ̀kọ́ ìgbàgbọ́ kún ibi tí orísun kò ti ní i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘Kí ... tó ...’ fún gbólóhùn àkókò, a sì pa ìtẹnumọ́ ìbànújẹ Pétérù mọ́.
