  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: yo
  text: Nígbà náà ni Júdásì, ẹni tí ó ń dà á, dáhùn, ó sì wí pé, “Dájúdájú, èmi kọ́ ni, Rábì?” Ó wí fún un pé, “Ìwọ ni ó sọ bẹ́ẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: ẹni tí ó ń fi í lé wọn lọ́wọ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí ó ń tọ́ka sí Júdásì gẹ́gẹ́ bí ẹni tí ó ń fà á lé àwọn ọ̀tá lọ́wọ́; gbolohun yìí pa ìṣe tí ó ń lọ lọwọ mọ́ láìfi ìtumọ̀ ẹ̀sìn míì kún un.
- source_word: Μήτι ἐγώ εἰμι
  choice: èmi kọ́, àbí?
  rationale: Μήτι sábà ń retí ìdáhùn òdì; ọ̀nà Yorùbá yìí mú ìbéèrè tí olùbéèrè ń retí pé ‘rárá’ jáde lọ́nà àdánidá.
- source_word: ῥαββί
  choice: Olùkọ́
  rationale: Rabbi jẹ́ ọ̀rọ̀ ìyìn fún olùkọ́ Júù; ‘Olùkọ́’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún òǹkàwé òde òní.
- source_word: Σὺ εἶπας
  choice: Ìwọ ni ó sọ bẹ́ẹ̀
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ̀lú ìtẹnumọ́ lórí ‘ìwọ’ ó sì pa ìdáhùn náà mọ́ ní àfojúsùn dípò ṣíṣe àlàyé rẹ̀ ju bí orísun ṣe ṣe lọ.
theological_decisions:
- issue: Bóyá ìdáhùn Jesu jẹ́ ìmúdájú tààrà tàbí ọ̀rọ̀ àfojúsùn
  choice: Ìwọ ni ó sọ bẹ́ẹ̀
  alternative: Bẹ́ẹ̀ ni, ìwọ ni
  rationale: Σὺ εἶπας lè ṣiṣẹ́ gẹ́gẹ́ bí ìmúdájú, ṣùgbọ́n ìtumọ̀ tààrà pa àfojúsùn àti ìfẹ̀hónúhàn ọ̀rọ̀ orísun mọ́ láìmú un di ìdáhùn gbangba ju Gíríìkì lọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá bá èdè mu.
