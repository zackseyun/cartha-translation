revisions:
- from: Nígbà náà ni Júdásì, ẹni tí ó ń fi í lé wọn lọ́wọ́, dáhùn pé, “Olùkọ́, èmi kọ́, àbí?” Ó sọ fún un pé, “Ìwọ ni ó sọ bẹ́ẹ̀.”
  to: Nígbà náà ni Júdásì, ẹni tí ó ń dà á, dáhùn, ó sì wí pé, “Dájúdájú, èmi kọ́ ni, Rábì?” Ó wí fún un pé, “Ìwọ ni ó sọ bẹ́ẹ̀.”
  rationale: The revision removes the unsupported plural recipient, preserves Judas’s ongoing betraying action, retains the source title “Rábì,” and expresses the negative-expected question naturally without turning Jesus’ concise response into a more explicit confirmation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves Judas as the subject, the ongoing characterization of his act, the negative-answer-expected force of μήτι, and the deliberately restrained wording of Jesus’ reply. However, “fi í lé wọn lọ́wọ́” supplies an unexpressed plural recipient (“them”), while the Greek only says that Judas is handing/betraying Jesus. A more direct Yoruba rendering avoids that added referent.
  naturalness: The proposed revision is idiomatic Standard Yoruba. “Èmi kọ́ ni, Rábì?” naturally expresses the self-excluding, negative-leaning question, while “Ìwọ ni ó sọ bẹ́ẹ̀” remains suitably concise and non-expansive.
  terminology: “Rábì” retains the Jewish honorific represented by ῥαββί, rather than flattening it to the generic “Olùkọ́.” “Ń dà á” is a natural rendering of Judas’s betraying/handing-over action in this context.
  issues:
  - severity: medium
    issue: The phrase “fi í lé wọn lọ́wọ́” introduces “wọn” (‘them’), though no recipient is stated in the Greek clause.
    rationale: Although the wider context identifies hostile authorities, this verse’s participle has only the explicit object ‘him.’ Rendering Judas as ‘the one betraying him’ retains the source wording without supplying a plural referent.
  - severity: low
    issue: “Olùkọ́” translates the sense of ῥαββί but omits its retained Jewish-title character.
    rationale: Using “Rábì” preserves both the source’s form of address and its historical-cultural register, while remaining understandable in Yoruba.
  revised_text: Nígbà náà ni Júdásì, ẹni tí ó ń dà á, dáhùn, ó sì wí pé, “Dájúdájú, èmi kọ́ ni, Rábì?” Ó wí fún un pé, “Ìwọ ni ó sọ bẹ́ẹ̀.”
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported plural recipient, preserves Judas’s ongoing betraying action, retains the source title “Rábì,” and expresses the negative-expected question naturally without turning Jesus’ concise response into a more explicit confirmation.
