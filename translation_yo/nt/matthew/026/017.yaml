  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ gbòòrò Gíríìkì mọ́: ọjọ́ àjọ náà, wíwá àwọn ọmọ-ẹ̀yìn sọ́dọ̀ Jesu, àti ìbéèrè wọn nípa pípesè Ìrékọjá fún un láti jẹ. Síbẹ̀, ‘tọ Jesu wá’ kì í túmọ̀ sí προσῆλθον níhìn-ín; ó lè túmọ̀ sí wíwá ẹni/títọpasẹ̀ ẹni. ‘Wọ́n wá sọ́dọ̀ Jesu’ ni ó sọ ìtòsí ‘came to Jesus’ di mímọ́.'
