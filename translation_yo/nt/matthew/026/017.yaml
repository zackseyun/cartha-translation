id: MAT.26.17
reference: Matthew 26:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: yo
  text: Ní ọjọ́ kìn-ín-ní ti Àjọ Àkàrà Aláìwú[b], àwọn ọmọ-ẹ̀yìn wá sọ́dọ̀ Jesu, wọ́n ní, “Níbo ni o fẹ́ kí a pèsè Ìrékọjá[a] sílẹ̀ fún ọ láti jẹ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní kíkún sí i, “oúnjẹ Ìrékọjá.”
    reason: lexical_alternative
  - marker: b
    text: “Ọjọ́ kìn-ín-ní ti Àjọ Àkàrà Aláìwú” tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà; a kò gbọ́dọ̀ fi ìtumọ̀ nìkan pinnu àwọn ìjíròrò nípa àkókò Ìrékọjá.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ
  choice: Ní ọjọ́ kìn-ín-ní
  rationale: Ìsọ̀rọ̀ dátífù ti àkókò Τῇ πρώτῃ túmọ̀ sí ‘ní ọjọ́ kìn-ín-ní.’ A kò fi δέ hàn pẹ̀lú ọ̀rọ̀ asopọ̀ lọ́tọ̀, nítorí agbára rẹ̀ rọrùn, ìbẹ̀rẹ̀ gbolohun Yorùbá sì ń ṣàn dáadáa láìsí i.
- source_word: τῶν ἀζύμων
  choice: ti Àjọ Àkàrà Àìwú
  rationale: Ọ̀rọ̀ ajẹtífù náà, tí a lò bí orúkọ ní ọ̀pọ̀, ń tọ́ka sí àsìkò àjọ àwọn Júù. Fífi ‘Àjọ’ kún un mú ìtọ́kasí àṣà náà yé òǹkàwé Yorùbá, ‘Àkàrà Àìwú’ sì ṣàfihàn pé kò ní ìwúkàrà.
- source_word: προσῆλθον
  choice: tọ ... wá
  rationale: προσέρχομαι túmọ̀ sí sísún mọ́ ẹni tàbí wíwá sọ́dọ̀ rẹ̀. ‘tọ Jesu wá’ jẹ́ ọ̀nà Yorùbá adayébá láti sọ ìyẹn.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ó ń tọ́ka sí ẹgbẹ́ àwọn ọmọ-ẹ̀yìn tí a ti mọ̀ tẹ́lẹ̀. A kò fi ‘rẹ̀’ kún un, nítorí kò sí nínú ọ̀rọ̀ Gíríìkì.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ participle, ‘wọ́n ní’ jẹ́ ìsọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìṣe sísọ mọ́ láìsọ ọ́ di ‘wọ́n béèrè’ lọ́nà ìtumọ̀ àfikún.
- source_word: Ποῦ θέλεις
  choice: Níbo ni o fẹ́
  rationale: θέλω ń sọ ìfẹ́ tàbí èrò ẹni. ‘fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìbéèrè tààrà mu.
- source_word: ἑτοιμάσωμέν σοι
  choice: kí a ti pèsè ... sílẹ̀ fún ọ
  rationale: Subjunctive ẹni àkọ́kọ́ ọ̀pọ̀ nínú ìbéèrè ìgbèrò ni a fi hàn pẹ̀lú ‘kí a.’ ‘Fún ọ’ pa σοι mọ́ gẹ́gẹ́ bí ẹni tí wọ́n ń ṣe ìpèsè náà fún.
- source_word: φαγεῖν
  choice: láti jẹ
  rationale: 'Infinitive náà sọ ète ìpèsè: kí Jesu lè jẹ. ‘Láti jẹ’ jẹ́ ìtumọ̀ tààrà tó sì bá Yorùbá mu.'
- source_word: τὸ πάσχα
  choice: Ìrékọjá
  rationale: πάσχα lè tọ́ka sí àjọ tàbí oúnjẹ àjọ náà. ‘Ìrékọjá’ pa ìfọ̀rọ̀wérọ̀ yìí mọ́; ọ̀rọ̀ ‘jẹ’ nínú àyíká náà mú kí oúnjẹ àjọ náà wà níwájú ọkàn.
theological_decisions:
- issue: Ìbámu àkókò ‘ọjọ́ kìn-ín-ní ti Àjọ Àkàrà Àìwú’ pẹ̀lú àsìkò oúnjẹ Ìrékọjá
  choice: Pa gbólóhùn àjọ inú Gíríìkì mọ́ láìṣe ìṣọ̀kan tàbí àlàyé ìtúmọ̀ nínú ẹsẹ̀ náà.
  alternative: Túmọ̀ ọ́ sí ‘ọjọ́ tí ó ṣáájú Àjọ Àkàrà Àìwú’ tàbí ‘ọjọ́ kìn-ín-ní ti Ìrékọjá.’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ‘ọjọ́ kìn-ín-ní ti àwọn àkàrà àìwú.’ Nítorí ìjíròrò nípa àkókò Ìrékọjá nínú àwọn Ìhìn Rere, ìtumọ̀ kò gbọ́dọ̀ pinnu ọ̀ràn náà nípasẹ̀ àtúnṣe tàbí ìṣọ̀kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ode òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A gbe àmì [a] lẹ́yìn ‘Ìrékọjá,’ níbi tí àṣàyàn ọ̀rọ̀ rẹ̀ ti kan, a sì gbe [b] lẹ́yìn gbólóhùn àkókò tí àlàyé rẹ̀ ń ṣàlàyé.
