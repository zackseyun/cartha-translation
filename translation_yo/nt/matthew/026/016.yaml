  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: yo
  text: Láti ìgbà náà lọ, ó sì ń wá àǹfààní láti fi í lé wọn lọ́wọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti dà á.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ ní pàtó sí “láti fi í lé wọn lọ́wọ́” tàbí “láti fà á lé wọn lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Láti ìgbà náà lọ
  rationale: Ó fi hàn pé ìṣe náà bẹ̀rẹ̀ ní àkókò yẹn, ó sì ń bá a lọ.
- source_word: ἐζήτει
  choice: ó ń wá
  rationale: Àmì àkókò imperfect nínú Gíríìkì fi ìṣe tí ó ń bá a lọ hàn; ‘ó ń wá’ sọ èyí ní Yorùbá àdánidá.
- source_word: εὐκαιρίαν
  choice: àǹfààní
  rationale: Ó túmọ̀ sí àkókò tàbí ipò tí ó bójú mu láti ṣe ohun kan; ‘àǹfààní’ ṣe kedere ní Yorùbá òde òní.
- source_word: ἵνα
  choice: láti
  rationale: Ó ń mú ète ìwá àǹfààní náà wọlé ní ọ̀nà ṣókí, àdánidá.
- source_word: αὐτὸν παραδῷ
  choice: láti fà á lé wọn lọ́wọ́
  rationale: Ó pa ìtumọ̀ àkọ́kọ́ παραδίδωμι mọ́ gẹ́gẹ́ bí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́. ‘Wọn’ ni a fi kún un nítorí pé ọ̀rọ̀ Yorùbá yìí sábà máa ń béèrè ẹni tí a fi í lé lọ́wọ́, ẹni náà sì ṣe kedere nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ παραδῷ nínú àyíká ìṣe Júdásì
  choice: fà á lé wọn lọ́wọ́
  alternative: dà á
  rationale: Bí ó tilẹ̀ jẹ́ pé ohun tí Júdásì ṣe jẹ́ ìdà, ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbòòrò sí i, ìyẹn fífi ẹnì kan lé ẹlòmíràn lọ́wọ́. A pa ìtumọ̀ yẹn mọ́ nínú ẹsẹ̀, a sì fi ‘dà á’ sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
