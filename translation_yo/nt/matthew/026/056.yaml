source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo èyí ti ṣẹlẹ̀ kí àwọn Ìwé Mímọ́ àwọn wòlíì lè ní ìmúṣẹ. Nígbà náà, gbogbo àwọn ọmọ-ẹ̀yìn fi í sílẹ̀[a], wọ́n sì sá lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí wọ́n ti kọ̀ ọ́ sílẹ̀”; nínú àyíká ọ̀rọ̀ yìí, ἀφέντες lè ní ìtumọ̀ líle sí i pé wọ́n pa á tì.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Ṣùgbọ́n gbogbo èyí
  rationale: Ó tọ́ka sí gbogbo ohun tó ṣẹlẹ̀ ṣáájú; “Ṣùgbọ́n” sì pa ìtumọ̀ asopọ̀ δέ mọ́ láì sọ ọ́ di àtakò líle.
- source_word: γέγονεν
  choice: ti ṣẹlẹ̀
  rationale: Ìṣe àkókò pípé náà fi hàn pé ohun náà ti wáyé, àbájáde rẹ̀ sì ṣì ṣe pàtàkì ní àkókò ìtàn náà.
- source_word: ἵνα πληρωθῶσιν
  choice: kí ... lè ṣẹ
  rationale: Ọ̀rọ̀ Yórùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìmọ̀ràn ète tàbí àbájáde inú ἵνα pẹ̀lú subjunctive mọ́ láì yan ọ̀kan ṣoṣo.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: àwọn Ìwé Mímọ́ ti àwọn wòlíì
  rationale: “Ìwé Mímọ́” fi hàn pé àwọn ìkọ̀wé mímọ́ ni γραφαί ń tọ́ka sí; “ti àwọn wòlíì” sì pa genitive náà mọ́ láì fi “tí wọ́n kọ” tàbí “tí wọ́n sọ” kún un.
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e nínú ìtàn hàn ní ọ̀nà Yórùbá tó ṣe déédé.
- source_word: οἱ μαθηταὶ πάντες
  choice: gbogbo àwọn ọmọ-ẹ̀yìn
  rationale: Ó pa ìtẹnumọ́ πάντες mọ́, kò sì fi “rẹ̀” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἀφέντες αὐτὸν
  choice: fi í sílẹ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá láti sọ pé wọ́n fi ẹni náà sílẹ̀; ó tún jẹ́ kí ọ̀rọ̀ tó tẹ̀ lé e, “wọ́n sì sá lọ,” fi bí ìkọ̀sílẹ̀ náà ti le tó hàn.
- source_word: ἔφυγον
  choice: wọ́n sì sá lọ
  rationale: Ó túmọ̀ ἔφυγον ní tààrà, ó sì pa ìyára àti ìbẹ̀rù inú ìṣe náà mọ́.
theological_decisions:
- issue: Ìmúṣẹ Ìwé Mímọ́ àwọn wòlíì
  choice: kí àwọn Ìwé Mímọ́ ti àwọn wòlíì lè ṣẹ
  alternative: kí ohun tí àwọn wòlíì kọ lè ṣẹ
  rationale: Àṣàyàn náà pa ọ̀rọ̀ ìmúṣẹ àti ìtọ́kasí sí Ìwé Mímọ́ mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́, láì túmọ̀ genitive náà ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ fi múlẹ̀ lọ.
translation_notes:
  register: Yórùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì gbé àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí ó ń ṣàlàyé.
