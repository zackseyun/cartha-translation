  source_fidelity: 'Ìtumọ̀ náà gbé gbogbo ẹ̀ka Gíríìkì pàtàkì kalẹ̀ dáadáa: δέ, ìṣe pípé γέγονεν, ìdí/àbájáde ἵνα, Ìwé Mímọ́ àwọn wòlíì, àti pé gbogbo àwọn ọmọ-ẹ̀yìn sá lọ. Síbẹ̀, ‘kí àwọn Ìwé Mímọ́ ... lè ṣẹ’ lè dà bí ẹni pé àwọn ìwé fúnra wọn ni ń ṣẹlẹ̀; ní Yorùbá, ìmúṣẹ àwọn ìwé ni a sábà máa ń sọ.'
