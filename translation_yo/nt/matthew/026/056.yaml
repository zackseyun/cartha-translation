  to: Ṣùgbọ́n gbogbo èyí ti ṣẹlẹ̀ kí àwọn Ìwé Mímọ́ àwọn wòlíì lè ní ìmúṣẹ. Nígbà náà, gbogbo àwọn ọmọ-ẹ̀yìn fi í sílẹ̀[a], wọ́n sì sá lọ.
