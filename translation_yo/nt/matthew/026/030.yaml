source:
  edition: SBLGNT
  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti kọ orin ìyìn[a], wọ́n jáde lọ sí Òkè Ólífì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n ti kọrin ìyìn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí kíkọ orin ìyìn ní ìtumọ̀ gbòòrò; kò sọ bóyá orin kan ni tàbí ọ̀pọ̀ orin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: Lẹ́yìn tí wọ́n kọ orin ìyìn
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó tọ́ka sí kíkọ orin ìyìn ṣáájú ìṣe pàtàkì náà. ‘Kọ orin ìyìn’ jẹ́ Yorùbá àdánidá, ó sì fi ìtumọ̀ orin ìyìn sí Ọlọ́run hàn láì sọ iye orin tí Gíríìkì kò sọ.
- source_word: ἐξῆλθον
  choice: wọ́n jáde lọ
  rationale: Ó túmọ̀ sí pé wọ́n jáde tàbí wọ́n kúrò níbẹ̀; ‘jáde lọ’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere tí ó sì bá ìrìn-àjò sí ibi mìíràn mu.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sí Òkè Ólífì
  rationale: Èyí ni orúkọ ibi tí a mọ̀ sí Mount of Olives. ‘Òkè Ólífì’ pa ìtumọ̀ ὄρος àti orúkọ igi elééfì mọ́ ní ọ̀nà ṣókí tí ó wọ́pọ̀ nínú Yorùbá Bíbélì.
- source_word: καὶ
  choice: Lẹ́yìn tí …,
  rationale: 'Ìbáṣepọ̀ καὶ pẹ̀lú participle tó tẹ̀ lé e ni a sọ ní Yorùbá gẹ́gẹ́ bí ìtẹ̀síwájú ìṣẹ̀lẹ̀: lẹ́yìn orin náà ni wọ́n jáde. Èyí kò fi ìtumọ̀ míì kún ọ̀rọ̀ Gíríìkì.'
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A kò fi ‘orin kan’ sínú ẹsẹ̀, nítorí Gíríìkì kò sọ iye orin náà ní pàtó.
