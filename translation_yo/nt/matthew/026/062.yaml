source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: yo
  text: Olórí àlùfáà sì dìde, ó sì sọ fún un pé, “Ṣé o kò dáhùn rárá?[a] Kí ni àwọn wọ̀nyí ń jẹ́rìí lòdì sí ọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà sí i: “Ṣé o kò dá ohunkóhun lóhùn?”'
    reason: Ó fi ìṣètò ọ̀rọ̀ Οὐδὲν ἀποκρίνῃ hàn ní ọ̀nà tí ó sún mọ́ Gíríìkì jù, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ àkọ́kọ́ dùn mọ́ Yorùbá àdánidá sí i.
lexical_decisions:
- source_word: ἀναστὰς
  choice: dìde
  rationale: Ọ̀rọ̀ yìí fi ìṣe ara tí olórí àlùfáà ṣe kí ó tó sọ̀rọ̀ hàn; “dìde” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: ὁ ἀρχιερεὺς
  choice: olórí àlùfáà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún oyè àlùfáà tí ó ga jù lọ ní àyíká Júù yìí.
- source_word: εἶπεν αὐτῷ
  choice: sọ fún un pé
  rationale: Ó pa arọ́pò-orúkọ inú Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti ṣáájú ọ̀rọ̀ tààrà.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Ṣé o kò dáhùn rárá?
  rationale: Ìtumọ̀ yìí mú ìbéèrè tí ń tẹ ẹni lẹ́nu láti fèsì jáde ní Yorùbá òde òní, láì yí i sí ọ̀rọ̀ ọjọ́ iwájú.
- source_word: τί
  choice: Kí ni ẹ̀rí tí
  rationale: Ìṣètò yìí mú kí ìbéèrè nípa ohun tí ẹ̀rí náà ní nínú ṣe kedere, nígbà tí ó ṣì ń tẹ̀ lé ìbéèrè τί.
- source_word: οὗτοί
  choice: àwọn wọ̀nyí
  rationale: Ó pa agbára arọ́pò-atọ́ka náà mọ́ láì fi orúkọ tàbí àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: σου καταμαρτυροῦσιν
  choice: ń jẹ́ lòdì sí ọ
  rationale: “Jẹ́ ẹ̀rí lòdì sí” pa ìtumọ̀ ilé-ẹjọ́ àti ìṣe tí ń lọ lọ́wọ́ mọ́, dípò lílo ọ̀rọ̀ tí yóò túmọ̀ rẹ̀ sí ẹ̀sùn lásán.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “àlùfáà” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀ fún ἱερεύς, a sì pa ìró ilé-ẹjọ́ inú ẹsẹ náà mọ́.
