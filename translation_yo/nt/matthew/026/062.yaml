  to: Olórí àlùfáà sì dìde, ó sì sọ fún un pé, “Ṣé o kò dáhùn rárá?[a] Kí ni àwọn wọ̀nyí ń jẹ́rìí lòdì sí ọ?”
  rationale: A ṣe àtúnṣe ìbéèrè kejì kí 'àwọn wọ̀nyí' jẹ́ kókó-ọrọ ìṣe 'ń jẹ́rìí lòdì sí,' gẹ́gẹ́ bí οὗτοί ... καταμαρτυροῦσιν. A tún fi 'sì' ṣojú καί dípò fífi àmì àkókò 'Nígbà náà ni' kún un. Àwọn ìpinnu mìíràn, pẹ̀lú olórí àlùfáà àti ìbéèrè àkọ́kọ́, yẹ sí ìtumọ̀ orísun àti lílò Yorùbá òde òní.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:46:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìbéèrè kejì nínú àkọsílẹ̀ náà kò gbé ìṣe καταμαρτυροῦσιν (''jẹ́rìí lòdì sí'') jáde ní kedere: ''Kí ni ẹ̀rí tí àwọn wọ̀nyí ń jẹ́ lòdì sí ọ?'' lè dà bí ìbéèrè nípa ẹ̀rí kan. Àtúnṣe náà mú ìbéèrè Gíríìkì τί οὗτοί σου καταμαρτυροῦσιν hàn taara. A tún yọ ''Nígbà náà ni,'' tí ó ṣàfikún ìsopọ̀ àkókò tí καί kò sọ ní pàtó, ká sì fi ìsopọ̀ ''sì'' tí ó bá a mu.'
  naturalness: '''Kí ni àwọn wọ̀nyí ń jẹ́rìí lòdì sí ọ?'' jẹ́ Yorùbá boṣewa, ó sì jẹ́ ọ̀nà àdánidá láti béèrè ohun tí àwọn ẹlẹ́rìí ń fi kọ ẹni náà. ''Ṣé o kò dáhùn rárá?'' dúró gẹ́gẹ́ bí ìbéèrè títẹ ẹni lẹ́nu tí ó rọrùn láti lóye.'
  terminology: '''Olórí àlùfáà'' jẹ́ ìtumọ̀ tó yẹ fún ὁ ἀρχιερεύς nínú àyíká ìdájọ́ Júù yìí. ''Jẹ́rìí lòdì sí'' pa ìtumọ̀ ilé-ẹjọ́ ti καταμαρτυρέω mọ́; kò dín un kù sí ''fi ẹ̀sùn kan.'''
  issues:
  - severity: medium
    issue: Ìbéèrè kejì kò ṣe ìtumọ̀ 'these are testifying against you' ní kedere.
    rationale: Ìṣètò 'Kí ni ẹ̀rí tí àwọn wọ̀nyí ń jẹ́ lòdì sí ọ?' kò ní ọ̀rọ̀ 'jẹ́rìí' gẹ́gẹ́ bí ìṣe àwọn 'wọ̀nyí,' ó sì lè yí ìbéèrè náà padà sí ìwádìí nípa irú ẹ̀rí kan.
  - severity: low
    issue: '''Nígbà náà ni'' ṣàfikún àmì àkókò.'
    rationale: καί so ìṣẹ̀lẹ̀ pọ̀ ('àti/sì') ṣugbọn kò nílò láti túmọ̀ sí 'nígbà náà' nínú ẹsẹ yìí.
