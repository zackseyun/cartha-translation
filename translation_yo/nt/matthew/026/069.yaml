source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: yo
  text: Pétérù sì ń jókòó ní òde, nínú àgbàlá, ọ̀dọ́bìnrin ìránṣẹ́ kan[a] sì wá sọ́dọ̀ rẹ̀, ó ní, “Ìwọ náà wà pẹ̀lú Jésù ará Gálílì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọbìnrin ìránṣẹ́” tàbí “ọmọbìnrin ẹrú.” Ọ̀rọ̀ Gíríìkì παιδίσκη lè túmọ̀ sí ọ̀dọ́bìnrin tí ń ṣiṣẹ́ ìránṣẹ́, tí ó sì lè jẹ́ ẹrú.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ ìtàn tó rọ̀, tí kò fi ìtakora líle hàn; ‘sì’ bá ìṣàn Yorùbá mu láìfi ọ̀rọ̀ àkókò kún un.
- source_word: ἐκάθητο ἔξω
  choice: jókòó ní ìta
  rationale: ‘Jókòó’ sọ ipò tó ń bá a lọ ní àkókò ìtàn, ‘ní ìta’ sì fi hàn pé ó wà lóde ibi tí ìgbẹ́jọ́ ti ń lọ.
- source_word: ἐν τῇ αὐλῇ
  choice: nínú àgbàlá
  rationale: αὐλή níbí tọ́ka sí àgbàlá ilé olórí àlùfáà; ‘àgbàlá’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: προσῆλθεν αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò sún mọ́ Pétérù hàn ní Yorùbá àdánidá.
- source_word: μία παιδίσκη
  choice: ọ̀kan lára àwọn ọ̀dọ́bìnrin ìránṣẹ́
  rationale: ‘Ọ̀kan lára’ dá μία mọ́, ‘ọ̀dọ́bìnrin ìránṣẹ́’ sì pa ọjọ́-orí àti iṣẹ́ παιδίσκη mọ́ láìdá ipò ẹrú rẹ̀ lójú.
- source_word: λέγουσα
  choice: ó ní
  rationale: Yíyí participle náà sí ọ̀rọ̀-ìṣe aláàlà jẹ́ ìṣàn Yorùbá tó mọ́gbọ́n dání, nígbà tó ṣì pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí ìṣáájú ọ̀rọ̀ taara mọ́.
- source_word: Καὶ σὺ
  choice: Ìwọ náà
  rationale: ‘Ìwọ’ mú ìtẹnumọ́ σὺ jáde, ‘náà’ sì túmọ̀ καί gẹ́gẹ́ bí fífi Pétérù mọ́ àwọn mìíràn.
- source_word: ἦσθα μετὰ
  choice: wà pẹ̀lú
  rationale: Ó pa ìtumọ̀ ìbáṣepọ̀ tó rọrùn mọ́ láìfikún pé ọmọ-ẹ̀yìn ni.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Jésù ará Gálílì
  rationale: ‘Ará Gálílì’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa àpèjúwe ìdánimọ̀ Γαλιλαίου mọ́.
