id: MAT.26.2
reference: Matthew 26:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: yo
  text: Ẹ̀yin mọ̀ pé lẹ́yìn ọjọ́ méjì ni Àjọ Ìrékọjá yóò dé, a ó sì fi Ọmọ Ènìyàn lé ọwọ́[a] láti kàn án mọ́ àgbélébùú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó dà á lẹ́yìn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdàlẹ́yìn, ṣùgbọ́n ní ìtumọ̀ tó gbòòrò ó túmọ̀ sí “fi lé ẹlòmíràn lọ́wọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Ẹ̀yin mọ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ẹni kejì ọ̀pọ̀, ó sì ní ìtumọ̀ ìsinsìnyí; fífi “Ẹ̀yin” hàn mú ọ̀pọ̀ yẹn ṣe kedere ní Yorùbá.
- source_word: μετὰ δύο ἡμέρας
  choice: lẹ́yìn ọjọ́ méjì
  rationale: Ó tẹ̀ lé ìtumọ̀ àkókò μετά pẹ̀lú accusative, ìyẹn “lẹ́yìn ọjọ́ méjì,” láì yí i sí “ní ọjọ́ méjì sí i.”
- source_word: τὸ πάσχα
  choice: Àjọ Ìrékọjá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àjọ Pasika àwọn Júù, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: γίνεται
  choice: yóò dé
  rationale: Nínú àyíká yìí, γίνομαι ń tọ́ka sí dídé tàbí wíwáyé Àjọ Ìrékọjá; “yóò dé” jẹ́ èdè Yorùbá àdánidá fún ohun tó sún mọ́lé.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè tí Jésù ń lò fún ara rẹ̀ mọ́, pẹ̀lú ìtumọ̀ rẹ̀ nínú Ìwé Mímọ́.
- source_word: παραδίδοται
  choice: a ó fi … lé wọn lọ́wọ́
  rationale: Ìṣe àìṣe náà ní ìtumọ̀ gbooro ju “dà” lọ; ó lè ní ìdàlẹ́yìn nínú, ṣùgbọ́n ó tún túmọ̀ sí fífi ẹnì kan lé àwọn mìíràn lọ́wọ́. Ọ̀nà yìí pa ìfọ̀rọ̀wérọ̀ ìtumọ̀ náà mọ́.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: láti kàn án mọ́ àgbélébùú
  rationale: Ẹ̀ka infinitive yìí fi ète tàbí àbájáde hàn; ìtumọ̀ náà ṣe kedere pé kíkàn án mọ́ àgbélébùú ni ohun tí fífi í lé wọn lọ́wọ́ ń yọrí sí.
theological_decisions:
- issue: Ìtumọ̀ παραδίδοται nínú àsọtẹ́lẹ̀ ìjìyà Jésù
  choice: a ó fi Ọmọ Ènìyàn lé wọn lọ́wọ́
  alternative: a ó da Ọmọ Ènìyàn
  rationale: Àyíká náà kan ìdàlẹ́yìn Júdásì, ṣùgbọ́n ọ̀rọ̀ Gíríìkì gbòòrò sí fífi ẹnì kan lé ẹlòmíràn lọ́wọ́. Ìtumọ̀ tí a yàn kò dín ìtumọ̀ náà kù sí ìdàlẹ́yìn nìkan, ó sì pa ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A lo “Àjọ Ìrékọjá” gẹ́gẹ́ bí orúkọ àjọ, a sì pa “Ọmọ Ènìyàn” mọ́ gẹ́gẹ́ bí orúkọ oyè.
