id: MAT.26.45
reference: Matthew 26:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: yo
  text: Nígbà náà ni ó wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn, ó sì wí fún wọn pé[a], “Ẹ máa sùn sí i, ẹ sì máa sinmi. Wò ó, wákàtí náà ti sún mọ́lé[b], a sì ń fi Ọmọ Ènìyàn lé àwọn ẹlẹ́ṣẹ̀ lọ́wọ́[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “Ṣé ẹ ṣì ń sùn, tí ẹ sì ń sinmi?” Ọ̀rọ̀ Gíríìkì lè jẹ́ ìbéèrè àsọyé; ọ̀rọ̀ inú ẹsẹ̀ pa àìdánilójú náà àti ìfẹ̀fẹ̀ẹ́ ẹ̀gàn tí ó ṣeé ṣe mọ́.
    reason: alternative_reading
  - marker: b
    text: Ó tún lè túmọ̀ sí, “wákàtí náà ti dé” tàbí “wákàtí náà ti sún mọ́.”
    reason: lexical_alternative
  - marker: c
    text: Ó tún lè túmọ̀ sí, “a ń hùwà ọ̀dàlẹ̀ sí Ọmọ Ènìyàn.” Ọ̀rọ̀ Gíríìkì ní ìtumọ̀ gbígbòòrò pé a ń fi í lé ẹlòmíràn lọ́wọ́ tàbí a ń fà á lé ọwọ́ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ àkókò tí ó ń tọ́ka sí ohun tí ó ṣẹlẹ̀ lẹ́yìn èyí tí ó ṣáájú.
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: ó wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn
  rationale: Yorùbá àdánidá ni èyí fún ìṣípò lọ sí ọ̀dọ̀ àwọn ọmọ-ẹ̀yìn; a lo ọ̀nà ìtàn Yorùbá dípò fífi present historical Gíríìkì mú ní líle.
- source_word: λέγει αὐτοῖς
  choice: ó sì wí fún wọn pé
  rationale: Ó jẹ́ ọ̀rọ̀ ọlá, tó ṣe kedere, tí ó sì ṣí ọ̀rọ̀ tààrà sílẹ̀ lọ́nà àdánidá.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Ẹ máa sùn nísinsin yìí, kí ẹ sì sinmi
  rationale: Ó pa ìrísí ọ̀rọ̀ àṣẹ tàbí ìyọ̀ǹda mọ́, ṣùgbọ́n kò pa àǹfààní pé ìbéèrè àsọyé ni mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ fi àyípadà náà hàn.
- source_word: ἰδοὺ
  choice: Wò ó
  rationale: Ọ̀nà Yorùbá òde òní tó ń pe olùgbọ́ láti fiyè sí ìkéde pàtàkì ni.
- source_word: ἤγγικεν ἡ ὥρα
  choice: wákàtí náà ti sún mọ́lé
  rationale: Ó pa ìtumọ̀ pé àkókò náà ti dé etílé mọ́, láì fi dandan túmọ̀ ọ́ sí pé ó ti dé pátápátá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè pàtàkì tí Jésù ń lò fún ara rẹ̀; a túmọ̀ ọ́ ní tààrà, a kò sọ ọ́ di àlàyé.
- source_word: παραδίδοται εἰς χεῖρας ἁμαρτωλῶν
  choice: a sì ń fi Ọmọ Ènìyàn lé àwọn ẹlẹ́ṣẹ̀ lọ́wọ́
  rationale: ‘Fi … lé … lọ́wọ́’ pa ìtumọ̀ fífi ẹni kan sábẹ́ agbára ẹlòmíràn mọ́, ó sì gbòòrò ju ‘dà’ lọ; ìṣe aláìlórúkọ tún pa passive Gíríìkì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Agbára Καθεύδετε … καὶ ἀναπαύεσθε
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìyọ̀ǹda tàbí àṣẹ tó lè ní ìtànná ẹ̀gàn: “Ẹ máa sùn nísinsin yìí, kí ẹ sì sinmi.”'
  alternative: “Ṣé ẹ ṣì ń sùn, tí ẹ sì ń sinmi?”
  rationale: Ìṣètò Gíríìkì lè jẹ́ àṣẹ tó ní ìtànná ẹ̀gàn tàbí ìbéèrè àsọyé. Ọ̀rọ̀ pàtàkì kò fi àmì ìbéèrè kún un, nítorí náà a pa ìfarapa ìtumọ̀ náà mọ́, a sì fi àyípadà sí àlàyé.
- issue: Ìtumọ̀ παραδίδοται nínú ìtàn ìjìyà Jésù
  choice: “a sì ń fi … lé … lọ́wọ́”
  alternative: “a sì ń dà …” tàbí “a sì ń fi … fún wọn”
  rationale: Yíyan yìí pa ìtumọ̀ gbígbòòrò ti fífi Jésù lé àwọn mìíràn lọ́wọ́ mọ́; kò dín un kù sí ìwà Júdásì nìkan, kò sì pinnu ẹni tí ó ń ṣe ìṣe náà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ, ní ìforúkọsílẹ̀ ọlá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. “Wò ó” àti “fi … lé … lọ́wọ́” jẹ́ ọ̀nà àdánidá tí kò di èdè àtijọ́, tí ó sì pa ìtẹnumọ́ àti àìdánilójú orísun mọ́.
