review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, approach to the disciples, address, Son of Man title, and passive handing-over sense are retained. The rendering of ἤγγικεν as “ti sún mọ́lé” appropriately conveys that the hour has drawn near, rather than requiring that it has fully arrived. The passive, indefinite-agent Yoruba construction accurately avoids identifying the one handing him over.
  naturalness: The draft is generally natural Standard Yoruba. A small revision makes the paired verbs for Καθεύδετε ... καὶ ἀναπαύεσθε more closely parallel and idiomatic. The alternative footnote “a ń dà Ọmọ Ènìyàn” is not a safe Yoruba expression for “is betrayed” and should be replaced.
  terminology: “Ọmọ Ènìyàn” and “fi ... lé ... lọ́wọ́” are appropriate, established renderings for the key expressions. “Àwọn ẹlẹ́ṣẹ̀” correctly renders ἁμαρτωλῶν.
  issues:
  - severity: medium
    issue: Footnote c uses “a ń dà Ọmọ Ènìyàn” for the alternative “is betrayed.”
    rationale: In contemporary Standard Yoruba, “dà ẹni” ordinarily suggests deceiving or wronging someone, not specifically betraying/handing someone over. “A ń hùwà ọ̀dàlẹ̀ sí Ọmọ Ènìyàn” clearly expresses the narrower betrayal alternative, while the note can retain the broader lexical explanation.
  - severity: low
    issue: 'The two verbs in the opening quotation are not fully parallel: “Ẹ máa sùn ... kí ẹ sì sinmi.”'
    rationale: The Greek coordinates two matching forms. “Ẹ máa sùn sí i, ẹ sì máa sinmi” is a more balanced Yoruba rendering and preserves the concessive/ironic imperative-like surface without resolving it into a question.
  revised_text: Nígbà náà ni ó wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn, ó sì wí fún wọn pé[a], “Ẹ máa sùn sí i, ẹ sì máa sinmi. Wò ó, wákàtí náà ti sún mọ́lé[b], a sì ń fi Ọmọ Ènìyàn lé àwọn ẹlẹ́ṣẹ̀ lọ́wọ́[c].”
