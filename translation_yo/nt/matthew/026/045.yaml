revisions:
- from: Nígbà náà ni ó wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn, ó sì wí fún wọn pé[a], “Ẹ máa sùn nísinsin yìí, kí ẹ sì sinmi. Wò ó, wákàtí náà ti sún mọ́lé[b], a sì ń fi Ọmọ Ènìyàn lé àwọn ẹlẹ́ṣẹ̀ lọ́wọ́[c].”
  to: Nígbà náà ni ó wá sọ́dọ̀ àwọn ọmọ-ẹ̀yìn, ó sì wí fún wọn pé[a], “Ẹ máa sùn sí i, ẹ sì máa sinmi. Wò ó, wákàtí náà ti sún mọ́lé[b], a sì ń fi Ọmọ Ènìyàn lé àwọn ẹlẹ́ṣẹ̀ lọ́wọ́[c].”
  rationale: The revision preserves the source’s ambiguity concerning the first two verbs and its broad passive sense of παραδίδοται. It improves Yoruba verbal parallelism and replaces an unsafe betrayal gloss in footnote c with clear, natural Yoruba. Footnote wording is also lightly tightened while retaining each intended alternative.
  reviewer_model: gpt-5.6-terra
