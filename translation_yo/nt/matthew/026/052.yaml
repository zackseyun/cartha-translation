source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: yo
  text: Nígbà náà ni Jésù sọ fún un pé, “Fi idà rẹ padà sí ibi rẹ̀, nítorí gbogbo ẹni tí ó bá mú idà[a] yóò ṣègbé nípa idà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbé idà”; ó ṣeé ṣe kí gbólóhùn náà túmọ̀ sí yíyan láti lo agbára fún ìjà, kì í ṣe kíkàn mú ohun ìjà kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìṣẹ̀lẹ̀ yìí tẹ̀ lé èyí tí ó ṣáájú lọ́nà àdánidá nínú ìtàn.
- source_word: λέγει αὐτῷ
  choice: sọ fún un
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí ìtàn, àsìkò tí ó ti kọjá ni ó bá ìtàn Yorùbá mu jù.
- source_word: Ἀπόστρεψον
  choice: Fi ... padà
  rationale: Àṣẹ náà ń béèrè pé kí ó dá ohun tí ó ṣe dúró lẹ́sẹ̀kẹsẹ̀, kí ó sì dá ohun ìjà náà padà sí ibi rẹ̀.
- source_word: τὴν μάχαιράν σου
  choice: idà rẹ
  rationale: μάχαιρα lè jẹ́ ọ̀bẹ tàbí idà kúkúrú, ṣùgbọ́n “idà” ṣe kedere, ó sì bá ọ̀rọ̀ òwe tí ó tẹ̀ lé e mu.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: sí àyè rẹ
  rationale: Ó tọ́ka sí dídá idà náà padà sí ibi tí ó yẹ kí ó wà.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: nítorí gbogbo àwọn tí ó bá gbé idà
  rationale: Ìṣẹ̀dá participle pẹ̀lú article níbí ń sọ òtítọ́ gbogbogbò; “gbé idà” lè túmọ̀ sí yíyan ìwà ipá gẹ́gẹ́ bí ọ̀nà ìgbésẹ̀, kì í ṣe mímú ohun ìjà lásán.
- source_word: ἐν μαχαίρῃ
  choice: nípa idà
  rationale: Ó pa ìtumọ̀ ohun èlò àti ìbáradọ́gba òwe náà mọ́.
- source_word: ἀπολοῦνται
  choice: yóò ṣègbé
  rationale: Ó mú ìtumọ̀ píparun tàbí ikú tó wà nínú ἀπόλλυμι jáde láì fi ọ̀nà ikú kan pàtó kún un.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn Jésù nípa idà
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí òtítọ́ gbogbogbò: “gbogbo àwọn tí ó bá gbé idà ...”'
  alternative: Kí a sọ ọ́ di ìfòfindè pátápátá lórí gbogbo lílo agbára, tàbí kí a fi mọ́ ipò ọmọ-ẹ̀yìn náà ní àkókò yẹn nìkan.
  rationale: Gíríìkì lo ọ̀nà gbólóhùn gbogbogbò. Ìtumọ̀ náà pa ìwọ̀n rẹ̀ mọ́ láì fi ẹ̀kọ́ ìjọ kan pàtó kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa pẹ̀lú àmì ohùn ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; a pa ìrísí òwe àti ìtumọ̀ gbogbogbò ti ọ̀rọ̀ Gíríìkì mọ́.
