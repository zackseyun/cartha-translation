    text: “Ago” jẹ́ àwòrán kan nínú Bíbélì fún ìpín tí a yàn fún ẹnì kan, pàápàá jù lọ ìjìyà; fi Mátíù 20:22 àti 26:42 wé e.
    reason: cross_reference
  revision_rationale: The revision explicitly translates the aorist verb ἔπεσεν while retaining the prostrate posture. It also replaces “ife” with the clearer literal term “ago,” and updates the associated footnote. No theological interpretation has been added to the main text.
