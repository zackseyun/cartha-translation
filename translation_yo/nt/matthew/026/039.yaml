revisions:
- from: Ó sì lọ síwájú díẹ̀, ó dojú bolẹ̀[a], ó ń gbàdúrà, ó sì wí pé, “Baba mi, bí ó bá ṣeé ṣe, jẹ́ kí ife yìí kọjá kúrò lọ́dọ̀ mi[b]; síbẹ̀, kì í ṣe bí èmi ṣe fẹ́, bí kò ṣe bí ìwọ ṣe fẹ́.”
  to: Ó sì lọ síwájú díẹ̀, ó sì ṣubú dojúbolẹ̀[a], ó ń gbàdúrà, ó sì ń wí pé, “Baba mi, bí ó bá ṣeé ṣe, jẹ́ kí ago yìí kọjá kúrò lọ́dọ̀ mi[b]; síbẹ̀, kì í ṣe gẹ́gẹ́ bí èmi ṣe fẹ́, ṣùgbọ́n gẹ́gẹ́ bí ìwọ ṣe fẹ́.”
