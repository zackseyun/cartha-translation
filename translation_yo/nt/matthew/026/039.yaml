id: MAT.26.39
reference: Matthew 26:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: yo
  text: Ó sì lọ síwájú díẹ̀, ó sì ṣubú dojúbolẹ̀[a], ó ń gbàdúrà, ó sì ń wí pé, “Baba mi, bí ó bá ṣeé ṣe, jẹ́ kí ago yìí kọjá kúrò lọ́dọ̀ mi[b]; síbẹ̀, kì í ṣe gẹ́gẹ́ bí èmi ṣe fẹ́, ṣùgbọ́n gẹ́gẹ́ bí ìwọ ṣe fẹ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dojúbolẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ago” jẹ́ àwòrán kan nínú Bíbélì fún ìpín tí a yàn fún ẹnì kan, pàápàá jù lọ ìjìyà; fi Mátíù 20:22 àti 26:42 wé e.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: lọ síwájú díẹ̀
  rationale: Ó fi hàn pé Jesu tẹ̀ síwájú ní ìjìnnà díẹ̀; ó pa ìtumọ̀ ìfiwéra inú προελθών mọ́ ní Yorùbá àdánidá.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: ó dojú bolẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún fífi ara balẹ̀ ní ìdíjú, tí ó sì pa ìrísí ìṣe náà àti ọ̀wọ̀ inú rẹ̀ mọ́.
- source_word: προσευχόμενος καὶ λέγων
  choice: ó ń gbàdúrà, ó sì wí pé
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ nínú ó ń gbàdúrà fi hàn pé àdúrà náà bá ìṣe pàtàkì náà lọ, nígbà tí ó sì wí pé mú ọ̀rọ̀ tí ó tẹ̀ lé wọlé lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: Πάτερ μου
  choice: Baba mi
  rationale: Ó túmọ̀ ìbátan tímọ́tímọ́ àti ọ̀wọ̀ tí ọ̀rọ̀ ìpè Πάτερ pẹ̀lú μου ní, láìfi ìmọ̀lára míì kún un.
- source_word: εἰ δυνατόν ἐστιν
  choice: bí ó bá ṣeé ṣe
  rationale: Ó ṣe àfihàn gbolohun Gíríìkì náà ní kíkún, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ó ṣeé ṣe.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: jẹ́ kí ... kọjá kúrò lọ́dọ̀ mi
  rationale: Fọ́ọ̀mù ìbéèrè jẹ́ kí pa agbára àṣẹ tí a lò gẹ́gẹ́ bí ẹ̀bẹ̀ mọ́; kọjá kúrò lọ́dọ̀ mi tún pa àwòrán ohun tí ń kọjá lọ mọ́.
- source_word: τὸ ποτήριον τοῦτο
  choice: ife yìí
  rationale: A pa àwòrán ife náà mọ́ dípò ṣíṣàlàyé rẹ̀ gẹ́gẹ́ bí ìjìyà nínú ọ̀rọ̀ pàtàkì, nítorí pé ó ní ìbáṣepọ̀ pẹ̀lú àwòrán Bíbélì nípa ìpín tí a yàn fún ẹnì kan.
- source_word: πλὴν
  choice: síbẹ̀
  rationale: Ó fi ìyàtọ̀ líle hàn láàárín ẹ̀bẹ̀ Jesu àti ìtẹríba rẹ̀, ní ọ̀nà kúkúrú tí ó sì bójú mu ní Yorùbá.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: kì í ṣe bí èmi ṣe fẹ́, bí kò ṣe bí ìwọ ṣe fẹ́
  rationale: Ṣe fẹ́ sọ ìfẹ́ inú tàbí ìpinnu ẹni ní Yorùbá láìsọ ọ́ di ohun tí ènìyàn kàn fẹ́ràn; fífi ṣe fẹ́ kún apá kejì mú àfiyèsí tí Gíríìkì fi sílẹ̀ ṣe kedere.
theological_decisions:
- issue: Àwòrán “ife” nínú àdúrà Jesu
  choice: A fi “ife yìí” sílẹ̀ nínú ọ̀rọ̀ pàtàkì.
  alternative: ìjìyà yìí; ìpín yìí
  rationale: ποτήριον jẹ́ ife ní tààrà, ṣùgbọ́n a lò ó gẹ́gẹ́ bí àwòrán Bíbélì fún ìpín tí a yàn, pàápàá ìjìyà. Pípa àwòrán náà mọ́ kò jẹ́ kí ìtumọ̀ rẹ̀ dín kù sí àlàyé kan ṣoṣo.
- issue: Ìfẹ́ Jesu ní ìbáṣepọ̀ pẹ̀lú ìfẹ́ Baba
  choice: A tú θέλω sí “ṣe fẹ́” ní apá méjèèjì.
  alternative: fẹ́ràn; pinnu
  rationale: Èyí pa òtítọ́ ìfẹ́ inú Jesu àti ìtẹríba rẹ̀ fún Baba mọ́, láìrọ ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà tàbí yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá; a pa “ife” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ àwòrán Bíbélì, a sì yẹra fún ṣíṣàlàyé ẹ̀kọ́ ìgbàgbọ́ ju ohun tí orísun Gíríìkì sọ lọ.
