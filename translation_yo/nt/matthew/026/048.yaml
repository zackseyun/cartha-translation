id: MAT.26.48
reference: Matthew 26:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: yo
  text: Ẹni tí ó ń fi í lé wọn lọ́wọ́ ti fún wọn ní àmì[a], ó ní, “Ẹni tí mo bá fi ẹnu kò, òun ni; ẹ mú un.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àmì ìdámọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: ẹni tí ó ń dà á sílẹ̀
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí ìwà Júdásì ti jíjẹ Jésù níyànjú, kì í ṣe fífi ẹni lé ẹlòmíràn lọ́wọ́ lásán. ‘Dà á sílẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìwà àìṣòdodo náà hàn.
- source_word: σημεῖον
  choice: àmì
  rationale: ‘Àmì’ pa ìtumọ̀ orísun mọ́, ó sì bá ohun tí a ti fohùn ṣọ̀kan pé yóò fi Jésù hàn mu.
- source_word: Ὃν ἂν φιλήσω
  choice: Ẹni tí mo bá fi ẹnu kò
  rationale: Ìlò ‘bá’ ṣe àfihàn gbólóhùn arọ́pò-orúkọ aláìdánilójú tí ἄν àti subjunctive ń sọ, ní Yorùbá àdánidá.
- source_word: φιλήσω
  choice: fi ẹnu kò
  rationale: Èyí ni ìtumọ̀ tààrà àti èdè Yorùbá àdánidá fún fífẹnu-koni, láìfikún pé ìkíni ni.
- source_word: αὐτός ἐστιν
  choice: òun ni
  rationale: ‘Òun ni’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá ṣókí láti dá ẹni náà mọ̀.
- source_word: κρατήσατε
  choice: ẹ mú un
  rationale: ‘Mú un’ lè túmọ̀ sí dídì í mú tàbí mímú un lọ ní agbára nínú àyíká ìmúni yìí; kò fi ọ̀rọ̀ òfin kan tí kò hàn gbangba sínú ẹsẹ̀ náà.
theological_decisions:
- issue: Agbára ìwà παραδιδοὺς nípa Júdásì
  choice: ẹni tí ó ń dà á sílẹ̀
  alternative: ẹni tí ó ń fi í lé wọn lọ́wọ́
  rationale: Àyíká ìtàn ìjìyà Jésù fi hàn pé ìwà ọ̀dàlẹ̀ ni a ń tọ́ka sí. Yíyan ‘dà á sílẹ̀’ mú agbára yẹn jáde láìfikún ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘fi ẹnu kò’ dípò ọ̀rọ̀ àjèjì, a sì pa àkókò ti-ṣáájú ‘ti fún wọn’ mọ́. Àmì àlàyé [a] wà lẹ́yìn ‘àmì’ nínú ọ̀rọ̀ pàtàkì.
