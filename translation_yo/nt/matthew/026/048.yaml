revisions:
- from: Ẹni tí ó ń dà á sílẹ̀ ti fún wọn ní àmì[a], ó ní, “Ẹni tí mo bá fi ẹnu kò, òun ni; ẹ mú un.”
  to: Ẹni tí ó ń fi í lé wọn lọ́wọ́ ti fún wọn ní àmì[a], ó ní, “Ẹni tí mo bá fi ẹnu kò, òun ni; ẹ mú un.”
  rationale: A túnṣe ìtumọ̀ παραδιδοὺς nìkan láti yọ ìdààmú tí ‘dà á sílẹ̀’ lè dá sílẹ̀. Ìtumọ̀ tuntun náà ń tẹ̀lé ìtumọ̀ pàtàkì παραδίδωμι—fífi ẹni lé ọwọ́ ẹlòmíràn—nígbà tí àyíká ẹsẹ̀ náà fúnra rẹ̀ ń fi ìwà ọ̀dàlẹ̀ Júdásì hàn. Àwọn ìpín yòókù àti àmì àlàyé ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:46:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Àsọyé ‘ń dà á sílẹ̀’ kò bá παραδιδοὺς mu dáadáa nínú àyíká yìí: ó sábà ń túmọ̀ sí fífi sílẹ̀ tàbí ìfàsílẹ̀, kì í ṣe fífi ẹni lé ẹgbẹ́ tí ń wá mú un lọ́wọ́. ‘Ń fi í lé wọn lọ́wọ́’ ń pa ìṣe παραδίδωμι mọ́, ó sì jẹ́ kedere nínú àyíká ìmú Jésù.'
  naturalness: Ìyókù gbolohun náà jẹ́ Yorùbá boṣewa tó dára, pẹ̀lú àmì ohùn tó yẹ. ‘Ẹni tí mo bá fi ẹnu kò, òun ni; ẹ mú un’ jẹ́ ìtumọ̀ adayeba, ṣókí, tí ó sì bá ìtọ́kasí ẹni náà àti àṣẹ ìkẹyìn mu.
  terminology: ‘Àmì’ yẹ fún σημεῖον; ‘fi ẹnu kò’ yẹ fún φιλήσω; ‘òun ni’ ń gbé ìdánimọ̀ αὐτός ἐστιν kalẹ̀; ‘ẹ mú un’ sì yẹ fún κρατήσατε láìfi ìlànà òfin tí kò hàn nínú ọ̀rọ̀ Gíríìkì kún un. ‘Fi í lé wọn lọ́wọ́’ ni a yàn fún παραδιδοὺς nítorí pé ó pegedẹ ìṣe ìfọwọ́sí ẹni náà fún àwọn tó fẹ́ mú un.
