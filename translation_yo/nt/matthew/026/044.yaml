id: MAT.26.44
reference: Matthew 26:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: yo
  text: Ó sì fi wọ́n sílẹ̀, ó tún lọ, ó sì gbàdúrà ní ìgbà kẹta, nígbà tí ó tún ń sọ ọ̀rọ̀ kan náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ohun kan náà.” Ní Gíríìkì: “ọ̀rọ̀ kan náà” tàbí “àsọjáde kan náà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: fi wọ́n sílẹ̀
  rationale: Àpólà yìí túmọ̀ sí pé ó fi àwọn ọmọ-ẹ̀yìn náà sílẹ̀; ó sì pa ìtẹ̀lé àwọn ìṣe inú ìtàn mọ́.
- source_word: πάλιν ἀπελθὼν
  choice: ó tún lọ
  rationale: “Tún” fi hàn pé ó tún kúrò lọ́dọ̀ wọn lẹ́ẹ̀kan sí i, nígbà tí “lọ” sọ ìṣípò kúrò níbẹ̀ ní èdè Yorùbá àdánidá.
- source_word: προσηύξατο
  choice: ó sì gbàdúrà
  rationale: “Gbàdúrà” ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mu.
- source_word: ἐκ τρίτου
  choice: ní ìgbà kẹta
  rationale: Èyí sọ ní tààrà pé èyí ni àkókò kẹta tí ó ṣe ìṣe náà.
- source_word: τὸν αὐτὸν λόγον
  choice: ọ̀rọ̀ kan náà
  rationale: “Ọ̀rọ̀ kan náà” pa ẹyọ ọ̀rọ̀ λόγον mọ́, ó sì lè tọ́ka sí ohun tí ó sọ tàbí àkóónú àdúrà rẹ̀ láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
- source_word: εἰπὼν πάλιν
  choice: ó tún sọ
  rationale: Ìtumọ̀ yìí pa πάλιν kejì mọ́, ó sì tẹnumọ́ pé Jésù tún sọ àdúrà kan náà.
theological_decisions:
- issue: Àtúnsọ àdúrà
  choice: 'A pa “tún” méjèèjì mọ́: ó tún lọ, ó sì tún sọ ọ̀rọ̀ kan náà.'
  alternative: A lè yọ “tún” ìkẹyìn kúrò fún ọ̀nà ọ̀rọ̀ tí ó rọrùn sí i.
  rationale: Ọ̀rọ̀ Gíríìkì ní πάλιν lẹ́ẹ̀mejì; pípa méjèèjì mọ́ ń fi ìtẹnumọ́ ìtàn náà hàn láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà.
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé lasán. A tún ṣe àtẹ̀jáde πάλιν méjèèjì, a sì fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó yẹ.
