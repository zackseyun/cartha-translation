  source_fidelity: 'Ìtumọ̀ náà ń ṣojú àwọn apá pàtàkì nínú Gíríìkì dáadáa: fífi àwọn ọmọ-ẹ̀yìn sílẹ̀, lílọ lẹ́ẹ̀kan sí i, àdúrà ìgbà kẹta, àti pípa πάλιν méjèèjì mọ́. Ṣùgbọ́n ipò εἰπὼν (''nígbà tí ó ń sọ'') lè hàn kedere sí i kí ó má dà bí pé ó sọ ọ̀rọ̀ náà lẹ́yìn àdúrà.'
