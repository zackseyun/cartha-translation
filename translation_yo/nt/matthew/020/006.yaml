translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ẹ̀dá, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé òde òní. A yí ‘wákàtí kọkànlá’ padà sí aago márùn-ún ìrọ̀lẹ́ nínú ọ̀rọ̀ pàtàkì láti yẹra fún kí òǹkàwé Yorùbá má ka á sí aago mọ́kànlá òwúrọ̀; àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìṣètò àkókò orísun mọ́.
