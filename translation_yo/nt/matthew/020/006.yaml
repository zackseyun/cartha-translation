    rationale: Ọ̀rọ̀ ipò ὧδε wà nínú ìbéèrè tó tẹ̀ lé e, kì í ṣe nínú ìpín ‘εὗρεν ἄλλους ἑστῶτας.’ Yíyọ ọ́ kúrò ń jẹ́ kí ìtumọ̀ sún mọ́ orísun.
