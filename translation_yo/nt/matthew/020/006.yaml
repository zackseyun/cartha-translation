  source_fidelity: Ìtumọ̀ náà mú ọ̀pọ̀ èrò Gíríìkì náà dáadáa, ṣùgbọ́n “tún” nínú “ó tún jáde” fi ‘again’ kún un, èyí tí kò sí nínú ẹsẹ̀ yìí. Bákan náà, “níbẹ̀” lẹ́yìn “wọ́n dúró” tún ṣàfikún ipò kan sí apá àkọ́kọ́, nígbà tí ὧδε (‘níhìn-ín’) wà nínú ìbéèrè tí ó tẹ̀ lé e. A tún dá ‘wákàtí kọkànlá’ sí ọ̀rọ̀ pàtàkì láti pa ọ̀nà ìṣírò àkókò orísun mọ́.
  naturalness: Yorùbá náà jẹ́ ti ẹ̀dá, ó sì rọrùn láti ka. “Kí nìdí tí ẹ fi dúró níhìn-ín ní gbogbo ọjọ́ láìṣiṣẹ́?” jẹ́ ìbéèrè Yorùbá boṣewa tó han gedegbe, ó sì gbé ìmọ̀ ‘ní gbogbo ọjọ́’ àti ‘aláìṣiṣẹ́/idle’ kalẹ̀ dáadáa.
  terminology: “Àwọn ẹlòmíràn,” “dúró,” “níhìn-ín,” àti “láìṣiṣẹ́” bá àwọn ọ̀rọ̀ Gíríìkì mu dáadáa. “Wákàtí kọkànlá” yẹ kí ó wà nínú ara ẹsẹ̀; àlàyé ìsàlẹ̀ lè ṣàlàyé pé ó sún mọ́ aago márùn-ún ìrọ̀lẹ́ ní ìṣírò ọjọ́ ìgbà náà.
