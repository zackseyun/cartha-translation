  to: Ní nǹkan bí wákàtí kọkànlá[a], ó jáde, ó sì rí àwọn ẹlòmíràn tí wọ́n dúró. Ó sì sọ fún wọn pé[b], “Kí nìdí tí ẹ fi dúró níhìn-ín ní gbogbo ọjọ́ láìṣiṣẹ́?”
  rationale: Àtúnṣe náà yọ àwọn àfikún ‘tún’ àti ‘níbẹ̀’ kúrò, ó sì pa “ní nǹkan bí wákàtí kọkànlá” mọ́ nínú ara ẹsẹ̀ gẹ́gẹ́ bí orísun ṣe sọ. Àlàyé aago márùn-ún ìrọ̀lẹ́ ni a fi sí ẹsẹ̀ ìsàlẹ̀ gẹ́gẹ́ bí ìrànlọ́wọ́ ìtàn, kì í ṣe ìrọ́pò ọ̀rọ̀ orísun. A tún ṣàtúnṣe àlàyé historical present kí ó má bàa fi continuous aspect Yorùbá di ìtumọ̀ pàtó.
