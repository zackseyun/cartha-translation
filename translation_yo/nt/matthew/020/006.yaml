source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: yo
  text: Ní nǹkan bí wákàtí kọkànlá[a], ó jáde, ó sì rí àwọn ẹlòmíràn tí wọ́n dúró. Ó sì sọ fún wọn pé[b], “Kí nìdí tí ẹ fi dúró níhìn-ín ní gbogbo ọjọ́ láìṣiṣẹ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì ní ti gidi, “ní nǹkan bí wákàtí kọkànlá.” Wọ́n máa ń ka àwọn wákàtí ọjọ́ láti ìlà-oòrùn; nítorí náà, èyí sún mọ́ aago márùn-ún ìrọ̀lẹ́.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì lo ọ̀rọ̀-ìṣe ìsinsìnyí nínú ìtàn níbí: “ó sì ń sọ fún wọn pé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Ní nǹkan bí aago márùn-ún ìrọ̀lẹ́
  rationale: περί pẹ̀lú ọ̀rọ̀-orúkọ ní accusative túmọ̀ sí ìsúnmọ́ (‘ní nǹkan bí’). ‘Wákàtí kọkànlá’ nínú ìṣírò àkókò àwọn Júù bẹ̀rẹ̀ láti ìlà-oòrùn, ó sì bá nǹkan bí aago márùn-ún ìrọ̀lẹ́ mu; fífi àkókò náà sọ ní ọ̀nà Yorùbá òde òní jẹ́ kí òye rẹ̀ ṣe kedere, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
- source_word: ἐξελθὼν
  choice: ó tún jáde
  rationale: Aorist participle náà ṣáájú εὗρεν ní ìtẹ̀síwájú ìṣẹ̀lẹ̀. Gbólóhùn aláìlẹ́gbẹ́ ‘ó tún jáde’ jẹ́ ti ẹ̀dá ní Yorùbá, ‘tún’ sì bá àyíká òwe náà mu, níbi tí ẹni náà ti jáde ní àwọn àkókò mìíràn tẹ́lẹ̀.
- source_word: εὗρεν
  choice: ó sì rí
  rationale: Èyí ni ìtumọ̀ tààrà àti ti ẹ̀dá fún εὑρίσκω nínú àyíká yìí.
- source_word: ἄλλους
  choice: àwọn ẹlòmíràn
  rationale: Adjective náà dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ. ‘Àwọn ẹlòmíràn’ kò fi akọ tàbí abo kún ohun tí Gíríìkì kò sọ ní kedere.
- source_word: ἑστῶτας
  choice: tí wọ́n dúró níbẹ̀
  rationale: Perfect participle ti ἵστημι ṣàpèjúwe ipò tí wọ́n wà nínú rẹ̀—wọ́n dúró. ‘Ní bẹ̀’ jẹ́ ti ẹ̀dá, ó sì bá ὧδε tó tẹ̀ lé e mu.
- source_word: καὶ λέγει αὐτοῖς
  choice: Ó sì sọ fún wọn pé
  rationale: Yorùbá kò ní ìyàtọ̀ tense tó bá historical present Gíríìkì mu ní ọ̀nà kan náà. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá nínú ìtàn, àlàyé ẹsẹ̀ ìsàlẹ̀ sì tọ́ka sí present tí Gíríìkì lò.
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú ìbéèrè yìí τί túmọ̀ sí ‘kí nìdí?’; ‘Èé ṣe’ ni ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ìtumọ̀ locative adverb náà ni ‘níhìn-ín’.
- source_word: ἑστήκατε
  choice: tí ẹ fi dúró
  rationale: Perfect náà fi ipò dídúró tó ti ń bá a lọ hàn. Àkójọpọ̀ ‘tí ẹ fi dúró ... ní gbogbo ọjọ́’ mú ìtẹ̀síwájú yẹn jáde ní Yorùbá.
- source_word: ὅλην τὴν ἡμέραν
  choice: ní gbogbo ọjọ́
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún accusative duration phrase náà.
- source_word: ἀργοί
  choice: láìṣiṣẹ́
  rationale: ἀργός túmọ̀ sí aláìṣiṣẹ́ tàbí ẹni tí kò ṣe iṣẹ́. ‘Láìṣiṣẹ́’ sọ iṣẹ́-àìṣe ní kedere láìfi èrò ọrọ̀-ajé òde òní bí ‘aláìníṣẹ́’ kún un.
