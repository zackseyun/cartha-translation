id: MAT.20.30
reference: Matthew 20:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: yo
  text: Sì kíyè sí i, àwọn ọkùnrin afọ́jú méjì jókòó lẹ́gbẹ̀ẹ́ ọ̀nà. Nígbà tí wọ́n gbọ́ pé Jésù ń kọjá lọ, wọ́n ké jáde pé, “Olúwa, ṣàánú wa, Ọmọ Dáfídì!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì kíyè sí i
  rationale: Ọ̀rọ̀ yìí fa àfiyèsí olùkà sí ìṣẹ̀lẹ̀ tuntun, ó sì pa ìgbésí-ayé ìtàn Mátíù mọ́ láì lo ọ̀rọ̀ tí kò wọ́pọ̀.
- source_word: δύο τυφλοὶ
  choice: àwọn ọkùnrin afọ́jú méjì
  rationale: Ó fi hàn pé ẹni méjì ni wọ́n, wọ́n sì jẹ́ ọkùnrin, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe tọ́ka sí.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: jókòó lẹ́gbẹ̀ẹ́ ọ̀nà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ipò wọn lẹ́gbẹ̀ẹ́ ọ̀nà mọ́.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: Nígbà tí wọ́n gbọ́ pé Jésù ń kọjá lọ
  rationale: A tú participle náà sí gbólóhùn àkókò, ní ìbámu pẹ̀lú bí ìṣe méjèèjì ṣe tẹ̀ lé ara wọn.
- source_word: ἔκραξαν λέγοντες
  choice: wọ́n ké jáde pé
  rationale: Ó mú agbára igbe náà jáde ní Yorùbá àdánidá, nígbà tí ‘pé’ ṣe iṣẹ́ λέγοντες láì ṣe àfikún tí kò pọndandan.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ọ̀wọ̀ àti agbára oyè tí wọ́n fi ń pe Jésù mọ́; ìsopọ̀ rẹ̀ pẹ̀lú ‘Ọmọ Dáfídì’ tún fún un ní ìtumọ̀ Mèsáyà.
- source_word: ἐλέησον ἡμᾶς
  choice: ṣàánú fún wa
  rationale: Èyí ni ìbéèrè Yorùbá tí ó ṣe kedere fún àánú àti ìrànlọ́wọ́.
- source_word: υἱὸς Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: A pa oyè Mèsáyà náà mọ́ ní tààràtà, dípò kí a dín un kù sí ìtumọ̀ ìran nìkan.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ tí wọ́n sọ tààrà sí Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ọ̀wọ̀ àti ìwọ̀n ìtumọ̀ ẹ̀sìn tó lè wà nínú ọ̀rọ̀ náà mọ́, pàápàá bí ó ṣe bá oyè ‘Ọmọ Dáfídì’ lọ; síbẹ̀, kò sọ ju ohun tí ọ̀rọ̀ Gíríìkì lè gbà lọ.
- issue: Agbára Mèsáyà nínú υἱὸς Δαυίδ
  choice: Ọmọ Dáfídì
  alternative: àtọmọdọ́mọ Dáfídì
  rationale: ‘Ọmọ Dáfídì’ pa oyè ìbílẹ̀ àti ìtumọ̀ ọba-Mèsáyà rẹ̀ mọ́, nígbà tí ‘àtọmọdọ́mọ’ lè sọ ọ́ di àlàyé ìran lásán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, àti àdánidá fún òǹkàwé òde òní. ‘Sì kíyè sí i’ jẹ́ díẹ̀ ní ìpele gíga ṣùgbọ́n ó yẹ fún ìtàn Ìwé Mímọ́, ó sì dá agbára ἰδοὺ dúró.
