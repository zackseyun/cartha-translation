id: MAT.20.1
reference: Matthew 20:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: yo
  text: Nítorí ìjọba ọ̀run dàbí ọkùnrin kan tí ó jẹ́ baálé ilé, ẹni tí ó jáde ní kùtùkùtù òwúrọ̀ láti gba àwọn òṣìṣẹ́ síṣẹ́ fún ọgbà àjàrà rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ‘the kingdom of heaven,’ ó sì pa àkójọpọ̀ ọ̀rọ̀ Mátíù mọ́ láì túmọ̀ rẹ̀ sí ẹ̀kọ́ ìjọ kan pàtó.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ọkùnrin kan, baálé ilé kan
  rationale: A pa ἀνθρώπῳ àti οἰκοδεσπότῃ méjèèjì mọ́, gẹ́gẹ́ bí orísun ṣe fi ‘ọkùnrin kan’ hàn, tí ó sì tún ṣàpèjúwe rẹ̀ gẹ́gẹ́ bí baálé ilé.
- source_word: ἅμα πρωῒ
  choice: ní kùtùkùtù òwúrọ̀
  rationale: Ó túmọ̀ sí ìgbà òwúrọ̀ gan-an, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún òǹkàwé òde òní.
- source_word: μισθώσασθαι ἐργάτας
  choice: láti bẹ̀rẹ̀ àwọn òṣìṣẹ́
  rationale: ‘Bẹ̀rẹ̀’ níbí túmọ̀ sí gbígba ènìyàn sí iṣẹ́ pẹ̀lú èrò ìsanwó, bí ọ̀rọ̀ Gíríìkì ṣe ń tọ́ka sí.
- source_word: ἀμπελῶνα
  choice: ọgbà àjàrà
  rationale: Ìtumọ̀ Yorùbá tààrà fún ọgbà tí a ti ń gbin àjàrà.
theological_decisions:
- issue: Ohun tí a fi ìjọba ọ̀run wé
  choice: A pa ‘ọkùnrin kan, baálé ilé kan’ mọ́.
  alternative: Kí a sọ pé ‘ìjọba ọ̀run dàbí baálé ilé kan’ nìkan.
  rationale: Ìtòlẹ́sẹẹsẹ Gíríìkì ní ἀνθρώπῳ οἰκοδεσπότῃ; pípa àwọn méjèèjì mọ́ yẹra fún yíyan ohun tí a fi àkàwé náà wé sí ohun tóóró ju orísun lọ.
translation_notes:
  register: Yorùbá àgbàdojú, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; a kò fi àlàyé ẹ̀kọ́ ìjọ kún ọ̀rọ̀ náà.
