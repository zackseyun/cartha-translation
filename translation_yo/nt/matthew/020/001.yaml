review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn ẹ̀yà pàtàkì Gíríìkì náà mọ́: ìjọba ọ̀run, ọkùnrin kan tí ó jẹ́ baálé ilé, jíjáde ní òwúrọ̀ kùtùkùtù, àwọn òṣìṣẹ́, àti ọgbà àjàrà tirẹ̀. Ṣùgbọ́n ‘bẹ̀rẹ̀ àwọn òṣìṣẹ́’ túmọ̀ sí ‘ask/request workers,’ kì í ṣe μισθώσασθαι (‘to hire’).'
  naturalness: ‘Baálé ilé’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣeé lóye fún οἰκοδεσπότῃ. Ìsopọ̀ ‘ọkùnrin kan, baálé ilé kan’ lè dúró, ṣùgbọ́n ‘ọkùnrin kan tí ó jẹ́ baálé ilé’ rọrùn, ó sì ṣàfihàn ìbáṣepọ̀ àpèjúwe náà dáadáa. ‘Gba àwọn òṣìṣẹ́ síṣẹ́’ jẹ́ ìlò àdánidá fún ìgbàṣiṣẹ́ ènìyàn.
  terminology: A pa ‘ìjọba ọ̀run’ mọ́ fún ἡ βασιλεία τῶν οὐρανῶν, àti ‘ọgbà àjàrà rẹ̀’ fún τὸν ἀμπελῶνα αὐτοῦ. ‘Gba ... síṣẹ́’ ń fi ìtumọ̀ ìsanwó/ìgbàṣiṣẹ́ tí μισθώσασθαι ní hàn láì fi àlàyé míì kún un.
  issues:
  - severity: medium
    issue: ‘láti bẹ̀rẹ̀ àwọn òṣìṣẹ́’
    rationale: ‘Bẹ̀rẹ̀’ nínú Yorùbá túmọ̀ sí béèrè tàbí rọ̀, kì í ṣe gbigba ènìyàn wọ iṣẹ́. Ó yí ìṣe μισθώσασθαι padà, nítorí náà a gbọdọ̀ rọ́pò rẹ̀ pẹ̀lú ọ̀rọ̀ tó túmọ̀ sí ‘hire.’
  revised_text: Nítorí ìjọba ọ̀run dàbí ọkùnrin kan tí ó jẹ́ baálé ilé, ẹni tí ó jáde ní kùtùkùtù òwúrọ̀ láti gba àwọn òṣìṣẹ́ síṣẹ́ fún ọgbà àjàrà rẹ̀.
