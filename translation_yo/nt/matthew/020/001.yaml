  to: Nítorí ìjọba ọ̀run dàbí ọkùnrin kan tí ó jẹ́ baálé ilé, ẹni tí ó jáde ní kùtùkùtù òwúrọ̀ láti gba àwọn òṣìṣẹ́ síṣẹ́ fún ọgbà àjàrà rẹ̀.
