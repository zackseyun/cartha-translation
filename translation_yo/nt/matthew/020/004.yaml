id: MAT.20.4
reference: Matthew 20:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ̀yin náà, ẹ lọ sínú ọgbà àjàrà náà, èmi yóò sì fún yín ní ohunkóhun tí ó bá tọ́.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohunkóhun tí ó bá jẹ́ òdodo” tàbí “ohunkóhun tí ó bá déédéé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: fún wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí àwọn òṣìṣẹ́ mìíràn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; “fún wọn” jẹ́ èdè Yorùbá àdánidá tí ó sì tó ní àyíká ọ̀rọ̀ náà.
- source_word: εἶπεν
  choice: Ó sì sọ
  rationale: Ìtumọ̀ ìtàn tí ó wọ́pọ̀ fún λέγω ni èyí, ó sì dá ọ̀rọ̀ tààrà sílẹ̀ láìfi agbára tí kò sí nínú Gíríìkì kún un.
- source_word: Ὑπάγετε
  choice: ẹ lọ
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; “ẹ lọ” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá àṣẹ láti lọ sí ọgbà àjàrà mu.
- source_word: καὶ ὑμεῖς
  choice: Ẹ̀yin náà
  rationale: 'Ó pa ìtẹnumọ́ àti ìfikún mọ́: àwọn wọ̀nyí pẹ̀lú ni a rán, gẹ́gẹ́ bí àwọn tí ó ṣáájú wọn.'
- source_word: ἀμπελῶνα
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ibi tí a ti ń gbin àjàrà.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ohunkóhun tí ó bá tọ́
  rationale: Ó pa ìtumọ̀ ìwà rere àti ohun tí ó bá ìdájọ́ òdodo mu mọ́, láìdín un kù sí òfin nìkan tàbí sí èrò ara ẹni nípa ìṣe déédéé.
- source_word: δώσω ὑμῖν
  choice: èmi yóò sì fún yín
  rationale: δίδωμι túmọ̀ sí “fún”; bí ó tilẹ̀ jẹ́ pé owó iṣẹ́ ni àyíká ọ̀rọ̀ náà, Gíríìkì kò lo ọ̀rọ̀ pàtó fún sísan owó níbí.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ δίκαιον ní àyíká ṣíṣe ìlérí owó iṣẹ́
  choice: tí ó bá tọ́
  alternative: tí ó bá jẹ́ òdodo; tí ó bá déédéé
  rationale: “Tí ó bá tọ́” pa ìtumọ̀ ohun tí ó bá òdodo àti ìlànà rere mu mọ́, láìfi ìtumọ̀ òfin tí ó lágbára jù kún un tàbí sọ ọ́ di ìmọ̀lára ara ẹni nípa déédéé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. “Ẹ̀yin náà” ń pa ìtẹnumọ́ orísun mọ́; “ọgbà àjàrà” sì jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye. A fi àmì ẹsẹ̀-lábẹ́-ọ̀rọ̀ [a] sí lẹ́yìn gbólóhùn tí ó kan δίκαιον.
