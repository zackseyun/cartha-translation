id: MAT.20.19
reference: Matthew 20:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: yo
  text: wọ́n yóò sì fi í lé àwọn Kèfèrí lọ́wọ́ láti ṣe é ní yẹ̀yẹ́, láti nà án ní pàṣán, àti láti kàn án mọ́ àgbélébùú; ní ọjọ́ kẹta, a ó sì jí i dìde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìrísí pasífù (“a ó jí i dìde”), ọ̀nà ìsọ̀rọ̀ tí ó wọ́pọ̀ nípa àjíǹde, tí ó sì lè túmọ̀ sí pé Ọlọ́run ni ó ṣe iṣẹ́ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: fi í lé ... lọ́wọ́
  rationale: Ó fi ìtumọ̀ fífi ẹni kan sábẹ́ agbára àwọn ẹlòmíràn hàn ní Yorùbá àdánidá, láì sọ ọ́ di ‘dà á’ ní pàtó.
- source_word: τοῖς ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Nínú àsọtẹ́lẹ̀ ìjìyà yìí, ọ̀rọ̀ náà tọ́ka sí àwọn tí kì í ṣe Júù, pàápàá àwọn aláṣẹ Róòmù, kì í ṣe gbogbo orílẹ̀-èdè lápapọ̀.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: láti fi ṣe ẹlẹ́yà
  rationale: Ìtumọ̀ àfojúsùn náà àti ẹ̀gàn tí ἐμπαίζω ní ni gbólóhùn Yorùbá yìí mú jáde lọ́nà tí ó ṣe kedere.
- source_word: μαστιγῶσαι
  choice: láti nà án
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún lílu ẹni gẹ́gẹ́ bí ìjìyà; àyíká náà mú lílu pẹ̀lú pàṣán wá sí ọkàn.
- source_word: σταυρῶσαι
  choice: láti kàn án mọ́ àgbélébùú
  rationale: Ó sọ ọ̀nà ikú náà ní tààràtà, ó sì tún mú ẹni tí àwọn ọ̀rọ̀-ìṣe mẹ́tẹ̀ẹ̀ta kan kedere.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: ní ọjọ́ kẹta
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn àkókò náà.
- source_word: ἐγερθήσεται
  choice: a ó jí i dìde
  rationale: Ó pa ìṣe àìsọ ẹni tó ṣe é (divine passive) mọ́, bí fọ́ọ̀mù pasifu Gíríìkì ṣe rí, láì dárúkọ Ọlọ́run níbi tí ẹsẹ náà kò ti dárúkọ rẹ̀.
theological_decisions:
- issue: Ohùn ọ̀rọ̀-ìṣe àjíǹde
  choice: a ó jí i dìde
  alternative: yóò jí dìde
  rationale: Gíríìkì jẹ́ fọ́ọ̀mù ọjọ́ iwájú pasifu. Ìtumọ̀ yìí pa àfihàn ìṣe Ọlọ́run mọ́ láì yọ àìdánilójú tàbí ìfẹ̀sẹ̀mulẹ̀ nípa ipa Kristi ní àwọn ibòmíràn kúrò.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A yan “Kèfèrí” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún àwọn tí kì í ṣe Júù; a yẹra fún ọ̀rọ̀ àtijọ́ tàbí ìtúmọ̀ ẹ̀kọ́ ìjọ kan pàtó.
