source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: yo
  text: Kì yóò rí bẹ́ẹ̀ láàárín yín[a]. Ṣùgbọ́n ẹnikẹ́ni tí ó bá fẹ́ di ẹni ńlá láàárín yín yóò jẹ́ ìránṣẹ́ yín,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kò rí bẹ́ẹ̀ láàárín yín.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí ọjọ́ iwájú (“yóò rí”), èyí tí ó lè sọ bí nǹkan kò ṣe gbọdọ̀ rí láàárín àwọn ọmọlẹ́yìn Jesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Kò gbọdọ̀ rí bẹ́ẹ̀ láàárín yín
  rationale: 'Ọ̀rọ̀ ọjọ́ iwájú ἔσται níbí ní agbára ìlànà: Jesu ń sọ bí nǹkan kò ṣe gbọdọ̀ rí nínú àwùjọ àwọn ọmọ-ẹ̀yìn rẹ̀. ‘Láàárín yín’ túmọ̀ ἐν ὑμῖν lọ́nà àdánidá.'
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Ṣùgbọ́n ẹnikẹ́ni tí ó bá fẹ́
  rationale: ἂν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive ń tọ́ka sí ẹnikẹ́ni láìsọ ẹni pàtó; ‘tí ó bá fẹ́’ sì pa ìtumọ̀ ìfẹ́-inú θέλῃ mọ́.
- source_word: μέγας γενέσθαι
  choice: di ẹni ńlá
  rationale: ‘Di’ pa ìtumọ̀ ìbẹ̀rẹ̀ tàbí ìyípadà inú γενέσθαι mọ́, dípò kí a sọ pé ẹni náà kàn ‘jẹ́ ẹni ńlá’.
- source_word: διάκονος
  choice: ìránṣẹ́
  rationale: Nínú àyíká yìí, διάκονος túmọ̀ sí ẹni tí ń ṣe iṣẹ́ ìránṣẹ́. ‘Ìránṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, kò sì fi ipò ìjọ ti ọjọ́ iwájú sínú ẹsẹ náà.
- source_word: ὑμῶν
  choice: yín
  rationale: ‘Ìránṣẹ́ yín’ fi ìbáṣepọ̀ tí genitive ὑμῶν ń sọ hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Ìwà ẹni ńlá nínú àwùjọ àwọn ọmọlẹ́yìn Jesu
  choice: Fi gbolóhùn náà hàn gẹ́gẹ́ bí ìlànà tí ó yí èrò ayé nípa ipò ńlá padà, nípa jíjẹ́ ìránṣẹ́ àwọn ẹlòmíràn.
  alternative: Túmọ̀ διάκονος sí ipò ‘díákónì’ nínú ìjọ, tàbí sọ ọ́ di ọ̀rọ̀ àìlẹ́gbẹ́ nípa ìrẹ̀lẹ̀ nìkan.
  rationale: Àyíká ẹsẹ náà fi ọ̀nà ìṣàkóso àwọn aláṣẹ orílẹ̀-èdè wé ọ̀nà tí Jesu fẹ́ kí ó wà láàárín àwọn ọmọ-ẹ̀yìn rẹ̀. Ìtumọ̀ yìí pa àwòrán iṣẹ́ ìránṣẹ́ mọ́ láìfi ètò ipò ìjọ ti ọjọ́ iwájú kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá; èdè náà ní iyì, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘kò gbọdọ̀ rí bẹ́ẹ̀’ láti sọ agbára ìlànà ọjọ́ iwájú Gíríìkì lọ́nà Yorùbá tó rọgbọ.
