source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti bá àwọn òṣìṣẹ́ náà ṣe àdéhùn lórí owó dínárì kan fún ọjọ́ kan[a], ó rán wọn lọ sínú ọgbà àjàrà rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dínárì kan jẹ́ owó iṣẹ́ tí wọ́n sábà máa ń san fún òṣìṣẹ́ kan fún iṣẹ́ ọjọ́ kan.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Lẹ́yìn tí ó bá ... ṣe àdéhùn
  rationale: Aorist participle náà tọ́ka sí ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé àwọn méjèèjì fara mọ́ iye owó náà.
- source_word: δὲ
  choice: —
  rationale: Níhìn-ín δέ jẹ́ àsopọ̀ ìtàn aláìlágbára; ìbẹ̀rẹ̀ ‘Lẹ́yìn tí’ ti so ìtàn náà pọ̀ dáadáa, nítorí náà kò nílò ọ̀rọ̀ Yorùbá míì.
- source_word: ἐργατῶν
  choice: àwọn òṣìṣẹ́
  rationale: Ọ̀rọ̀ yìí ṣe kedere, ó jẹ́ ti òde òní, ó sì bá àyíká àwọn tí a gbà sí iṣẹ́ nínú ọgbà àjàrà mu.
- source_word: ἐκ δηναρίου
  choice: owó dínárì kan
  rationale: Ó sọ iye owó iṣẹ́ tí wọ́n fohùn ṣọ̀kan lé lórí, ó sì pa orúkọ owó ayé àtijọ́ náà mọ́ láìfi iye owó òde òní rọ́pò rẹ̀.
- source_word: τὴν ἡμέραν
  choice: ti iṣẹ́ ọjọ́ náà
  rationale: Ó ṣàlàyé pé dínárì kan ni owó iṣẹ́ fún ọjọ́ náà, láìfi kún ohun tí Gíríìkì sọ.
- source_word: ἀπέστειλεν
  choice: ó rán wọn lọ
  rationale: Èyí ni ìtumọ̀ ìtàn tó ṣe déédéé, tó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀμπελῶνα
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi tí a ti ń gbin àjàrà.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò aṣàfihàn ohun-ìní náà tọ́ka sí ọgbà àjàrà ti baálé ilé.
theological_decisions: []
