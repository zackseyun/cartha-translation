  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì pàtàkì mọ́: ìfohùnṣọ̀kan pẹ̀lú àwọn òṣìṣẹ́, dínárì kan gẹ́gẹ́ bí owó ọjọ́ kan, rírán wọn lọ, àti ọgbà àjàrà rẹ̀. Síbẹ̀, ìlò “Lẹ́yìn tí ó bá” lè dà bí ìṣe ọjọ́ iwájú tàbí ìṣe àìtìlẹ́yìn ní Yorùbá òde òní, níbi tí aorist participle συμφωνήσας ń tọ́ka sí ìṣe tí ó ti ṣẹlẹ̀ ṣáájú rírán wọn lọ.'
