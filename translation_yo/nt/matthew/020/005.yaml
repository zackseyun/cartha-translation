  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: yo
  text: Wọ́n sì lọ. Ó tún jáde ní nǹkan bí wákàtí kẹfà àti kẹsàn-án[a], ó sì ṣe bákan náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ní nǹkan bí aago méjìlá ọ̀sán àti aago mẹ́ta ọ̀sán, gẹ́gẹ́ bí ìṣírò wákàtí àwọn Júù.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Nítorí náà, wọ́n lọ
  rationale: οἱ tọ́ka sí àwọn òṣìṣẹ́ tí a ṣẹ̀ṣẹ̀ bá sọ̀rọ̀; δέ jẹ́ àsopọ̀ pẹ̀lẹ́, ἀπῆλθον sì túmọ̀ sí pé wọ́n lọ. Gbólóhùn yìí jẹ́ ti ara Yorùbá, ó sì mú ìtàn tẹ̀ síwájú.
- source_word: πάλιν ἐξελθὼν
  choice: Nígbà tí ó tún jáde
  rationale: πάλιν fi hàn pé ìṣe náà tún ṣẹlẹ̀, ἐξελθὼν sì jẹ́ participle aorist tí ó bá ìṣe pàtàkì náà lọ ní ìtẹ̀lé. Èyí jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá láì fi ìtumọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: ní ìwọ̀n wákàtí kẹfà àti wákàtí kẹsàn-án
  rationale: περί túmọ̀ sí ‘ní ìwọ̀n’ tàbí ‘ní àyíká’; àwọn nọ́ńbà onípò pẹ̀lú ὥρα ń tọ́ka sí ìṣírò wákàtí Júù. A pa àṣà orísun náà mọ́ sínú ọ̀rọ̀, a sì ṣàlàyé àkókò òde òní ní àlàyé ìsàlẹ̀.
- source_word: ἐποίησεν ὡσαύτως
  choice: ó ṣe bákan náà
  rationale: ἐποίησεν jẹ́ ọ̀rọ̀ ìṣe tí àkóónú rẹ̀ wá láti inú ὡσαύτως. ‘Ó ṣe bákan náà’ jẹ́ kedere, ṣókí, ó sì pa agbára ìfiwéra mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti bá àṣà ìkọ̀wé Yorùbá mu; a pa ọ̀nà ìṣírò wákàtí ti àṣà orísun mọ́, pẹ̀lú àlàyé ìsàlẹ̀ fún òye.
