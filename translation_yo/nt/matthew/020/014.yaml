id: MAT.20.14
reference: Matthew 20:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: yo
  text: “Gba ohun tìrẹ, kí o sì lọ. Ṣùgbọ́n mo fẹ́ fún ọkùnrin tó gbẹ̀yìn yìí[a] ní ohun kan náà tí mo fún ọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tó gbẹ̀yìn yìí.”
    reason: Àwọn ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹni náà gẹ́gẹ́ bí “ẹni tó gbẹ̀yìn,” láìlo ọ̀rọ̀ Yorùbá “ọkùnrin” ní tààrà.
lexical_decisions:
- source_word: ἆρον
  choice: Gba
  rationale: Àṣẹ aorist αἴρω níbí túmọ̀ sí kí òṣìṣẹ́ náà gba ohun tó jẹ́ tirẹ̀. “Gba” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì bá ọ̀rọ̀ owó iṣẹ́ mu láìfi “owó iṣẹ́” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τὸ σὸν
  choice: ohun tìrẹ
  rationale: Gbólóhùn arọ́pò-orúkọ yìí túmọ̀ sí ohun tí ó jẹ́ ti ẹni náà. “Ohun tìrẹ” pa ìtumọ̀ náà mọ́ láìdín in kù sí owó iṣẹ́ nìkan.
- source_word: ὕπαγε
  choice: kí o sì máa lọ
  rationale: Ọ̀rọ̀ àṣẹ ὑπάγω jẹ́ ìyọ̀ǹda pé kí ẹni náà lọ. “Kí o sì máa lọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyọ̀ǹda yìí, láìfi ìbínú tí kò ṣe kedere sí i.
- source_word: θέλω δὲ
  choice: Ṣùgbọ́n mo fẹ́
  rationale: θέλω sọ ìfẹ́ tàbí ìpinnu ẹni tó ń sọ̀rọ̀; δέ sì fi ìyàtọ̀ pẹ̀lẹ́ hàn. “Ṣùgbọ́n mo fẹ́” mú àwọn méjèèjì jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: ọkùnrin tó gbẹ̀yìn yìí
  rationale: Àwọn ọ̀rọ̀ náà jẹ́ akọ ẹyọ kan, wọ́n sì tọ́ka sí òṣìṣẹ́ kan nínú àkàwé náà. “Ọkùnrin tó gbẹ̀yìn yìí” pa akọ àti ipò rẹ̀ mọ́.
- source_word: δοῦναι
  choice: fún
  rationale: Infinitive δίδωμι túmọ̀ sí “láti fún.” “Fún” pa ìtumọ̀ gbòòrò náà mọ́ dípò fífi “san owó” tí àyíká nìkan ń tọ́ka sí.
- source_word: ὡς καὶ σοί
  choice: ohun kan náà tí mo fún ọ
  rationale: Gbólóhùn afíwé náà tọ́ka sí fífún ẹni kejì ní iye kan náà. Èyí jẹ́ ìsọ̀rọ̀ Yorùbá tó ṣe kedere, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ “ohun” àti “mo fún” wà nínú ìtumọ̀ tí Gíríìkì fi sílẹ̀ láìtún sọ.
theological_decisions:
- issue: Ìtumọ̀ akọ ẹyọ kan fún ẹni tó jẹ́ òṣìṣẹ́ nínú àkàwé
  choice: ọkùnrin tó gbẹ̀yìn yìí
  alternative: ẹni tó gbẹ̀yìn yìí
  rationale: Gíríìkì lo irú akọ ẹyọ kan fún òṣìṣẹ́ náà. Fífi “ọkùnrin” sí i pa ìtọ́kasí akọ tó wà nínú orísun mọ́, nígbà tí “ẹni” jẹ́ ọ̀nà àìsọ akọ tí ó tún ṣeé ṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì pa àṣẹ olówó ọgbà àti ìyàtọ̀ inú δέ mọ́.
