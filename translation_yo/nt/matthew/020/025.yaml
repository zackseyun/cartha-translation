reference: Matthew 20:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù pè wọ́n sí ọ̀dọ̀ rẹ̀, ó sì wí pé, “Ẹ mọ̀ pé àwọn alákòóso àwọn Kèfèrí[a] ń fi agbára jẹ ọba lórí wọn, àwọn ẹni ńlá wọn[b] sì ń lo àṣẹ lórí wọn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn olórí ipò gíga wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pè wọ́n wá sọ́dọ̀ rẹ̀
  rationale: Ó fi ìṣe tí Jésù ṣe ṣáájú ọ̀rọ̀ rẹ̀ hàn, ó sì mú ìtumọ̀ pé ó pè wọ́n sún mọ́ ara rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: Οἴδατε
  choice: Ẹ mọ̀ pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí perfect, ìtumọ̀ rẹ̀ jẹ́ ti àsìkò ìsinsìnyí; “Ẹ mọ̀ pé” ni ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἄρχοντες
  choice: àwọn alákòóso
  rationale: Ó tọ́ka sí àwọn tó ń ṣàkóso tàbí tó ní ipò ìjọba; “àwọn alákòóso” bójú mu, ó sì ṣeé lóye ní Yorùbá òde òní.
- source_word: τῶν ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká ọ̀rọ̀ Júù yìí, ἔθνη ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Àlàyé ìsàlẹ̀ tún pa ìtumọ̀ “àwọn orílẹ̀-èdè” mọ́.
- source_word: κατακυριεύουσιν
  choice: máa ń fi agbára jẹ ọba lórí wọn
  rationale: Ọ̀rọ̀ náà ju “ṣàkóso” lásán lọ, ó ní ìtumọ̀ lílo ipò olúwa láti tẹ àwọn mìíràn ba; gbolohun Yorùbá yìí pa agbára òdì náà mọ́.
- source_word: οἱ μεγάλοι
  choice: àwọn ẹni ńlá
  rationale: Adjective tí a lò gẹ́gẹ́ bí orúkọ ni Gíríìkì, ó ń tọ́ka sí àwọn ọkùnrin olókìkí tàbí aláṣẹ. “Àwọn ẹni ńlá” pa ìrísí gbólóhùn náà mọ́ láìfi ohun tí kò sí sínú rẹ̀.
- source_word: κατεξουσιάζουσιν
  choice: máa ń lo ọlá àṣẹ lórí wọn
  rationale: Ó sọ lílo àṣẹ lórí àwọn ènìyàn; “lo ọlá àṣẹ lórí” jẹ́ èdè Yorùbá tó ṣe kedere, ìbáṣepọ̀ rẹ̀ pẹ̀lú gbólóhùn tó ṣáájú sì jẹ́ kí ìtẹnilórí tó wà nínú rẹ̀ hàn.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà padà tọ́ka sí àwọn Kèfèrí gẹ́gẹ́ bí àwọn tí a ń ṣàkóso; “wọn” ni ìtumọ̀ Yorùbá tó ṣe déédé láìsọ orúkọ náà léraléra.
theological_decisions:
- issue: Ìtumọ̀ ἐθνῶν nínú ọ̀rọ̀ Jésù tó wá láti àyíká Júù
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Àyíká náà fi ìṣàkóso àwọn tí kì í ṣe Júù wé ìwà tí Jésù fẹ́ kọ́ àwọn ọmọ-ẹ̀yìn rẹ̀. “Àwọn Kèfèrí” mú ìyàtọ̀ àyíká náà jáde, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbooro náà mọ́.
- issue: Bí a ṣe túmọ̀ οἱ μεγάλοι láìfi ipò pàtó kún un
  choice: àwọn ẹni ńlá
  alternative: àwọn olórí ipò gíga
  rationale: Gíríìkì kò sọ ipò ìjọba kan ní pàtó. Ìtumọ̀ àkọ́kọ́ pa àìdánilójú yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó ṣeé ṣe nínú àyíká ìṣèlú hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Máa ń” fi ìṣe àṣà tí present tense Gíríìkì ń sọ hàn; ìbáramu “fi agbára jẹ ọba” àti “lo ọlá àṣẹ” pa ìtẹnumọ́ àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́ láìsọ wọ́n di ohun kan náà.
