  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: yo
  text: Àwọn tí ó sì dé ní nǹkan bí wákàtí kọkànlá gba owó dínárì kan kọ̀ọ̀kan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dínárì jẹ́ ẹyọ owó fàdákà Róòmù kan; ní gbogbogbòò, a máa ń kà á sí iye owó iṣẹ́ tí òṣìṣẹ́ kan lè rí fún iṣẹ́ ọjọ́ kan.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú nínú ìtàn láìfi ìtumọ̀ àkókò míì kún un.
- source_word: ἐλθόντες
  choice: tí ó dé
  rationale: Ó tú participle aorist náà sí Yorùbá àdánidá gẹ́gẹ́ bí gbólóhùn ìbátan, ó sì tọ́ka sí àwọn òṣìṣẹ́ náà.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: Àwọn tí ó ... ní nǹkan bí wákàtí kọkànlá
  rationale: “Ní nǹkan bí” pa ìtumọ̀ àkókò tí περὶ ní mọ́; a kò fi “tí a yá” kún un, nítorí kò sí nínú gbólóhùn Gíríìkì yìí.
- source_word: ἔλαβον
  choice: gba
  rationale: Nínú ọ̀rọ̀ sísan owó iṣẹ́, “gba” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì fi hàn pé a fi owó náà fún wọn.
- source_word: ἀνὰ
  choice: kọ̀ọ̀kan
  rationale: Ó fi ìtumọ̀ pípín hàn pé ẹnì kọ̀ọ̀kan gba ẹyọ kan.
- source_word: δηνάριον
  choice: owó dínárì kan
  rationale: Ó pa orúkọ owó ìgbà Róòmù náà mọ́ dípò yíyí i padà sí iye owó iṣẹ́ ọjọ́ kan, èyí tí í ṣe àlàyé àṣà.
theological_decisions: []
translation_notes:
  register: Yorùbá Àfẹnukò tó bójú mu, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ní nǹkan bí” jẹ́ ọ̀nà àdánidá láti fi àkókò àfojúsùn hàn; “owó dínárì kan kọ̀ọ̀kan” sì pa ẹyọ owó ìtàn àti ìtumọ̀ pípín Gíríìkì mọ́.
