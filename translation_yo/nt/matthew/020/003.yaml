  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: yo
  text: Nígbà tí ó sì jáde ní nǹkan bí wákàtí kẹta[a], ó rí àwọn ẹlòmíràn tí wọ́n dúró láìṣiṣẹ́[b] ní ibi ọjà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní nǹkan bí aago mẹ́sàn-án òwúrọ̀.” “Wákàtí kẹta” tẹ̀ lé ìṣírò wákàtí ojúmọ́ àwọn Júù láti ìgbà tí oòrùn yọ.
    reason: cultural_note
  - marker: b
    text: Tàbí, “tí wọn kò ríṣẹ́.” Ọ̀rọ̀ Gíríìkì náà sọ pé wọn kò ṣiṣẹ́ ní àkókò náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: nígbà tí ó sì jáde
  rationale: Aorist participle náà ń fi ìṣe tó ṣáájú rírí wọn hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: περὶ τρίτην ὥραν
  choice: ní ìwọ̀n wákàtí kẹta
  rationale: Ó pa ọ̀nà ìṣírò àkókò inú orísun mọ́, nígbà tí “ní ìwọ̀n” fi ìtumọ̀ περὶ, ìyẹn àfojúsùn àkókò, hàn.
- source_word: εἶδεν
  choice: ó rí
  rationale: Ìtumọ̀ tààrà, tó sì bójú mu fún àkọsílẹ̀ ìtàn.
- source_word: ἄλλους
  choice: àwọn ẹlòmíràn
  rationale: Ó pa ọ̀rọ̀ náà mọ́ láìfi “ọkùnrin” kún un, nítorí Gíríìkì kò sọ ìyẹn ní kedere.
- source_word: ἑστῶτας
  choice: tí wọ́n dúró
  rationale: Ó mú ipò tí wọ́n wà—dídúró—jáde ní Yorùbá tó ṣe déédé.
- source_word: ἀγορᾷ
  choice: ibi ọjà
  rationale: Ó tọ́ka sí àgbègbè gbangba ti ọjà, níbi tí àwọn òṣìṣẹ́ lè péjọ sí.
- source_word: ἀργούς
  choice: láìṣiṣẹ́
  rationale: Ó túmọ̀ ipò àìní iṣẹ́ lọ́wọ́ nínú àyíká yìí láìfi èrò ètò ọrọ̀ ajé òde òní sí i.
