id: MAT.20.34
reference: Matthew 20:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: yo
  text: Jésù sì ṣàánú fún wọn, ó sì fọwọ́ kan ojú wọn. Lẹ́sẹ̀kẹsẹ̀ ni ojú wọn là, wọ́n sì tẹ̀ lé e.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: ṣàánú fún wọn
  rationale: Ọ̀rọ̀ náà ń sọ ìyọ́nú jíjinlẹ̀ tí ó ru Jésù. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì fi hàn pé ìyọ́nú rẹ̀ yọrí sí ìṣe.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ ìtàn náà síwájú; “sì” bá ìṣàn èdè Yorùbá mu láìfi ìtakora tí kò sí sínú rẹ̀.
- source_word: ἥψατο
  choice: fọwọ́ kan
  rationale: Nínú àyíká ìwòsàn yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ọwọ́ kan ohun kan ní ti ara. “Fọwọ́ kan” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: ojú wọn
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìlò ọ̀rọ̀ náà gẹ́gẹ́ bí ohun tí Jésù fọwọ́ kàn mu.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ọ̀rọ̀ náà tẹnu mọ́ pé àbájáde ìfọwọ́kàn Jésù ṣẹlẹ̀ láìjáfara. “Lẹ́sẹ̀kẹsẹ̀” pa agbára àsìkò yẹn mọ́.
- source_word: ἀνέβλεψαν
  choice: ojú wọn là
  rationale: Nínú àyíká ìwòsàn àwọn afọ́jú, gbólóhùn Yorùbá yìí sọ ní kedere àti ní àdánidá pé wọ́n ríran. Àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn “wọ́n tún ríran” àti ìtumọ̀ gangan “wọ́n gbójú sókè” mọ́.
- source_word: ἠκολούθησαν αὐτῷ
  choice: wọ́n sì tẹ̀ lé e
  rationale: “Tẹ̀ lé e” lè túmọ̀ sí pé wọ́n ń lọ lẹ́yìn Jésù, ó sì tún lè ní ìró ìtẹ̀lé gẹ́gẹ́ bí ọmọ-ẹ̀yìn, láìfipá sọ pé wọ́n di ọmọ-ẹ̀yìn pátápátá.
theological_decisions:
- issue: Irú àbájáde ìwòsàn tí ἀνέβλεψαν ń tọ́ka sí
  choice: Ojú wọn là lẹ́sẹ̀kẹsẹ̀ gan-an
  alternative: Wọ́n kàn bẹ̀rẹ̀ sí í ríran tàbí wọ́n gbójú sókè
  rationale: Àpapọ̀ εὐθέως àti ἀνέβλεψαν nínú àyíká iṣẹ́ ìyanu yìí tọ́ka sí ìmúpadàbọ̀sípò ìríran lẹ́sẹ̀kẹsẹ̀, láìsí àfikún ohun tí ẹsẹ náà kò sọ.
- issue: Agbára ìtumọ̀ ἠκολούθησαν αὐτῷ
  choice: Wọ́n tẹ̀ lé e
  alternative: Wọ́n di ọmọ-ẹ̀yìn rẹ̀
  rationale: Ẹsẹ náà sọ pé wọ́n tẹ̀ lé Jésù. Ó lè ní ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn nínú ìtàn náà, ṣùgbọ́n kò ṣàlàyé bí ìtẹ̀lé náà ṣe jinlẹ̀ tàbí bí ó ṣe pẹ́ tó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn “ojú wọn là” jẹ́ àṣà èdè Yorùbá tó ṣe kedere fún ríríran, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ń pa ìtumọ̀ mìíràn inú Gíríìkì mọ́.
