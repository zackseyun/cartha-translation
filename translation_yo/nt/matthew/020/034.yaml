  source_fidelity: Ìtumọ̀ náà fi σπλαγχνισθεὶς, ἥψατο, εὐθέως, ἀνέβλεψαν, àti ἠκολούθησαν hàn ní òtítọ́. “Ojú wọn là” jẹ́ ọ̀nà Yorùbá tí ó dára láti ṣàfihàn ìpadàbọ̀ ìríran lẹ́sẹ̀kẹsẹ̀, láìfi ìtumọ̀ ìkọjá ohun tí ẹsẹ náà sọ kún un.
