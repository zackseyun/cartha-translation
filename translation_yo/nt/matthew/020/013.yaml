  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: yo
  text: Ṣùgbọ́n ó dá ọ̀kan nínú wọn lóhùn pé, “Ọ̀rẹ́, èmi kò hùwà àìtọ́ sí ọ.[a] Ṣé ìwọ kò bá mi ṣe àdéhùn fún dẹ́náríù kan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi kò ṣe ohun tí kò tọ́ sí ọ.”
    reason: lexical_alternative
  - marker: b
    text: Dẹ́náríù jẹ́ owó fàdákà Róòmù kan; ní gbogbogbòò, iye rẹ̀ ni a kà sí owó iṣẹ́ tí òṣìṣẹ́ kan máa ń rí fún iṣẹ́ ọjọ́ kan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: ó … lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí mú ìtumọ̀ ‘ó dáhùn, ó sì sọ’ jáde ní Yorùbá àdánidá, láìfi àsopọ̀ Gíríìkì tí yóò le ní Yorùbá sílẹ̀.
- source_word: ἑνὶ αὐτῶν
  choice: ọ̀kan nínú wọn
  rationale: Ó fi hàn pé ẹni kan ṣoṣo ni a bá sọ̀rọ̀ láàárín gbogbo ẹgbẹ́ náà.
- source_word: Ἑταῖρε
  choice: Ọ̀rẹ́
  rationale: ‘Ọ̀rẹ́’ jẹ́ ọ̀rọ̀ ìpè tí ó wọ́pọ̀, tí ó sì lè ní ìtumọ̀ ìbáṣepọ̀ tí a fi ààlà sí nínú àyíká yìí, kì í ṣe dandan pé ó ń fi ìfẹ́ tímọ́tímọ́ hàn.
- source_word: οὐκ ἀδικῶ σε
  choice: èmi kò ṣe ọ́ ní àìṣòdodo
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe ἀδικέω mọ́ gẹ́gẹ́ bí ṣíṣe àìṣòdodo sí ẹnì kan, ó sì pa ẹni tí ìṣe náà kàn mọ́ ní kedere.
- source_word: οὐχὶ
  choice: Ṣé … kò
  rationale: Ìbéèrè Yorùbá yìí ń retí ìdáhùn pé bẹ́ẹ̀ ni, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà.
- source_word: δηναρίου
  choice: fún dẹ́náríù kan
  rationale: A pa orúkọ owó ìgbà Róòmù náà mọ́ dípò yíyí i padà sí owó tàbí owó iṣẹ́ ọjọ́ kan lásán.
- source_word: συνεφώνησάς μοι
  choice: ìwọ … bá mi ṣe àdéhùn
  rationale: Ọ̀rọ̀ yìí sọ ní kedere pé àwọn méjèèjì ti fohùn ṣọ̀kan lórí iye owó iṣẹ́ náà tẹ́lẹ̀.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọlá, tó sì ṣeé lóye. Gbólóhùn náà tẹ̀ lé ìṣàn ọ̀rọ̀ Yorùbá àdánidá, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ọ̀rẹ́’ kò fi dandan pinnu bóyá ìpè náà gbóná tàbí pé ó ní ìjìnnà díẹ̀; àyíká ló ń ṣàlàyé ìrísí ohùn rẹ̀.
