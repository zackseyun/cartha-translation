  to: Nígbà náà, ìyá àwọn ọmọ Sebedee wá sí ọ̀dọ̀ Jésù pẹ̀lú àwọn ọmọ rẹ̀, ó tẹríba fún un[a], ó sì ń béèrè ohun kan lọ́wọ́ rẹ̀.
