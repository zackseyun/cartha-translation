id: MAT.20.20
reference: Matthew 20:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: yo
  text: Nígbà náà, ìyá àwọn ọmọ Sebedee wá sí ọ̀dọ̀ Jésù pẹ̀lú àwọn ọmọ rẹ̀, ó tẹríba fún un[a], ó sì ń béèrè ohun kan lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jọ́sìn fún un.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí títẹríba pẹ̀lú ọ̀wọ̀, fífi ọlá fún ẹni kan, tàbí jíjọ́sìn, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àsopọ̀ àkókò tó ń fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: προσῆλθεν αὐτῷ
  choice: tọ Jésù wá
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí sísún mọ́ ẹnì kan tàbí wíwá sọ́dọ̀ rẹ̀; fífi ‘Jésù’ dípò arọ́pò-orúkọ mú ẹni tí a ń tọ̀ wá ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ìyá àwọn ọmọ Sebedee
  rationale: Èyí tẹ̀ lé ìhun gbólóhùn Gíríìkì, ó sì dá obìnrin náà mọ̀ nípasẹ̀ ìbátan rẹ̀ sí àwọn ọmọ Sebedee.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: pẹ̀lú àwọn ọmọ rẹ̀
  rationale: μετά pẹ̀lú ẹ̀yà genitive ń tọ́ka sí àjọrìn tàbí wíwà papọ̀; ọ̀rọ̀ yìí ṣe kedere, ó sì jẹ́ ti Yorùbá àdánidá.
- source_word: προσκυνοῦσα
  choice: ó tẹríba fún un
  rationale: προσκυνέω lè tọ́ka sí fífi ara balẹ̀ ní ọ̀wọ̀, fífi ọlá fúnni, tàbí jíjọ́sìn. ‘Tẹríba fún un’ pa ìṣe ara àti ọ̀wọ̀ mọ́ láìfi dandan pinnu pé ìjọsìn ni.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: ó sì fẹ́ béèrè ohun kan lọ́wọ́ rẹ̀
  rationale: αἰτέω túmọ̀ sí béèrè tàbí tọrọ, τι sì jẹ́ ‘ohun kan’; παρά pẹ̀lú genitive fi ẹni tí a ń béèrè lọ́wọ́ hàn. ‘Fẹ́ béèrè’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún participle tó ń sọ ète wíwá rẹ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ προσκυνοῦσα nípa ìṣe obìnrin náà sí Jésù
  choice: ó tẹríba fún un
  alternative: ó jọ́sìn fún un; ó kúnlẹ̀ níwájú rẹ̀; ó fi ọlá fún un
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìtẹríba tàbí fífi ọlá hàn, ó sì tún lè túmọ̀ sí ìjọsìn gẹ́gẹ́ bí àyíká ọ̀rọ̀. Àkọ́kọ́ ọrọ̀ pa ìtumọ̀ ti ara àti ti ọ̀wọ̀ mọ́, àlàyé ìsàlẹ̀ sì pa ‘jọ́sìn’ mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn, kí a má bàa yanjú ẹ̀dùn ẹ̀kọ́ ìgbàgbọ́ náà láìní ẹ̀rí tó pé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Sebedee’ gẹ́gẹ́ bí ìkọ̀wé orúkọ náà ní ìbámu pẹ̀lú ìró Yorùbá.
