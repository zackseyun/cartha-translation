id: MAT.20.31
reference: Matthew 20:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀pọ̀ ènìyàn náà bá wọn wí pé kí wọn dákẹ́. Síbẹ̀, wọ́n túbọ̀ kígbe[a] pé, “Olúwa, ṣàánú fún wa, Ọmọ Dáfídì[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kígbe sókè sí i.” Ọ̀rọ̀ afiwéra Gíríìkì lè tẹnu mọ́ bí igbe náà ṣe lágbára sí i lápapọ̀ tàbí bí ohùn wọn ṣe ga sí i ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: “Ọmọ Dáfídì” jẹ́ orúkọ oyè Mèsáyà; kì í ṣe ọ̀rọ̀ nípa ìran Dáfídì nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: ọ̀pọ̀ ènìyàn náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí ìjọ ènìyàn púpọ̀ nínú ìtàn náà.
- source_word: ἐπετίμησεν
  choice: bá wọn wí
  rationale: Ó fi ìbáwí líle hàn láìsọ ọ́ di àṣẹ tí ó le ju ohun tí Gíríìkì sọ lọ.
- source_word: ἵνα σιωπήσωσιν
  choice: pé kí wọn dákẹ́
  rationale: 'Ó pa ète ìbáwí náà mọ́: àwọn ènìyàn náà fẹ́ mú kí wọ́n dáwọ́ kígbe dúró.'
- source_word: μεῖζον
  choice: túbọ̀
  rationale: Ọ̀rọ̀ afiwéra náà lè túmọ̀ sí pé wọ́n pọ̀ sí i ní ìtara tàbí ní ohùn; ‘túbọ̀’ pa àìdánilójú yìí mọ́.
- source_word: ἔκραξαν
  choice: kígbe
  rationale: ‘Kígbe’ sọ igbe ohùn rara àti ìkánjú tí κράζω ní nínú àyíká yìí.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ọ̀wọ̀ inú àdúrà wọn àti ìtumọ̀ tó ṣeé ṣe nípa ẹni tí Jésù jẹ́ mọ́.
- source_word: ἐλέησον ἡμᾶς
  choice: ṣàánú fún wa
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún ẹ̀bẹ̀ pé kí ẹnì kan fi àánú hàn sí wọn.
- source_word: υἱὸς Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: Ìtumọ̀ tààrà yìí pa ipò rẹ̀ gẹ́gẹ́ bí orúkọ oyè Mèsáyà mọ́, dípò kí a sọ ọ́ di ọ̀rọ̀ ìran nìkan.
theological_decisions:
- issue: Orúkọ oyè Mèsáyà tí a fi pe Jésù
  choice: Ọmọ Dáfídì
  alternative: àtọmọdọ́mọ Dáfídì
  rationale: Gbólóhùn náà kì í ṣe àlàyé ìran lásán nínú Mátíù; ó ní ìtumọ̀ ọba àti ti Mèsáyà. Ìtumọ̀ tààrà pa agbára yẹn mọ́.
- issue: Ìtumọ̀ κύριος nígbà tí wọ́n ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ lè jẹ́ ọ̀rọ̀ ọ̀wọ̀, ó sì tún lè ní ìtumọ̀ nípa ẹni tí Jésù jẹ́; kò fi tipátipá yan ọ̀kan nínú méjèèjì.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó ṣeé lóye, tó sì ní iyì. ‘Síbẹ̀’ mú ìtakora kejì hàn lọ́nà àdánidá, ‘túbọ̀’ sì pa ìtumọ̀ μεῖζον tí kò dín mọ́ bí ohùn ṣe ga nìkan mọ́.
