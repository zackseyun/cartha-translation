  naturalness: Yorùbá náà jẹ́ boṣewa, ó sì rọrùn láti ka. “Bá wọn wí,” “kí wọn dákẹ́,” “wọ́n túbọ̀ kígbe,” àti “ṣàánú fún wa” bá ìtàn àti ẹ̀bẹ̀ tó wà nínú ẹsẹ̀ náà mu. Àmì ohùn àti ìkọ̀wé jẹ́ pípé ní ibi tí ó yẹ.
  terminology: “Olúwa” fi Κύριε hàn láìdín ìtumọ̀ ọ̀wọ̀ àti ìtumọ̀ ẹ̀sìn tó lè wà nínú rẹ̀ kù. “Ọmọ Dáfídì” jẹ́ ìtumọ̀ tààrà tó bójú mu fún υἱὸς Δαυίδ, ó sì pa ipò rẹ̀ gẹ́gẹ́ bí oyè Mèsáyà mọ́. Àwọn àfikún ìsàlẹ̀ a àti b wà ní ibi tó yẹ, wọ́n sì jẹ́ olóótọ́ sí àlàyé Gẹ̀ẹ́sì.
