source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: yo
  text: “Ṣé a kò gbà mí láyè láti ṣe ohun tí mo fẹ́ pẹ̀lú ohun tèmi? Tàbí ṣé ojú rẹ burú nítorí pé mo jẹ́ ẹni rere?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ṣé o ń ṣe ìlara nítorí pé mo jẹ́ ẹni rere?” Gbólóhùn náà, “ojú rẹ burú,” jẹ́ ọ̀rọ̀ àpèjúwe Gíríìkì fún ìlara tàbí ìbínú ìfẹ́kúfẹ̀ẹ́ nítorí oore tí ẹlòmíràn rí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: kò bófin mu fún mi
  rationale: Ó fi ìtumọ̀ ohun tí a yọ̀ǹda tàbí tí ó bófin mu hàn, ó sì bá ìbéèrè àsọyé olówó náà mu.
- source_word: ὃ θέλω ποιῆσαι
  choice: láti ... ṣe ohun tí mo fẹ́
  rationale: Ó sọ ìfẹ́ ẹni náà ní èdè Yorùbá òde òní tí ó ṣe kedere, láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἐν τοῖς ἐμοῖς
  choice: fi ohun tí ó jẹ́ tèmi
  rationale: Gbólóhùn yìí fi hàn pé ohun ìní tirẹ̀ ni ó ń lò; lílo “fi ... ṣe” jẹ́ ọ̀nà àdánidá láti sọ èrò náà ní Yorùbá.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: ojú rẹ ha burú
  rationale: Ó pa àwòrán ojú burúkú inú Gíríìkì mọ́, dípò yíyan ìtumọ̀ ìlara nìkan sínú ọ̀rọ̀ pàtàkì.
- source_word: ἀγαθός
  choice: ẹni rere
  rationale: “Ẹni rere” pa ìtumọ̀ gbòòrò ti ἀγαθός mọ́, bí ó tilẹ̀ jẹ́ pé inú ọ̀rọ̀ yìí ó tún lè tọ́ka sí ọ̀làwọ́.
theological_decisions:
- issue: Bóyá kí a tú ὁ ὀφθαλμός σου πονηρός sí ìlara nínú ọ̀rọ̀ pàtàkì
  choice: Pa àpẹẹrẹ náà mọ́ gẹ́gẹ́ bí “ojú rẹ ha burú”
  alternative: “Ṣé o ń ṣe ìlara nítorí pé mo jẹ́ ẹni rere?”
  rationale: Èyí pa ìtakora tó wà láàárín “ojú burúkú” òṣìṣẹ́ náà àti jíjẹ́ rere olówó náà mọ́, láìdín ìtumọ̀ ọ̀rọ̀ náà kù sí ìlara nìkan; àlàyé ìsàlẹ̀ ojú ìwé ń jẹ́ kí òǹkàwé lóye ọ̀rọ̀ àpèjúwe náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó bójú mu, tó ní àmì ohùn níbi tí ó yẹ, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ṣé” àti “ha” láti mú ìbéèrè àsọyé méjèèjì hàn, a sì pa àwòrán ojú burúkú inú orísun mọ́ pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé.
