  to: gẹ́gẹ́ bí Ọmọ Ènìyàn kò ṣe wá láti jẹ́ kí a ṣe ìránṣẹ́ fún un, ṣùgbọ́n láti ṣe ìránṣẹ́, àti láti fi ìyè rẹ̀ fúnni gẹ́gẹ́ bí owó ìràpadà fún ọ̀pọ̀ ènìyàn.[a]
