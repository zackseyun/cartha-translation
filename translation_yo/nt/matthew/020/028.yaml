id: MAT.20.28
reference: Matthew 20:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: yo
  text: gẹ́gẹ́ bí Ọmọ Ènìyàn kò ṣe wá láti jẹ́ kí a ṣe ìránṣẹ́ fún un, ṣùgbọ́n láti ṣe ìránṣẹ́, àti láti fi ìyè rẹ̀ fúnni gẹ́gẹ́ bí owó ìràpadà fún ọ̀pọ̀ ènìyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní kíkún sí i, “gẹ́gẹ́ bí owó ìràpadà ní ipò àwọn ènìyàn púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: gẹ́gẹ́ bí ... ti
  rationale: Ó mú ìfiwéra pẹ̀lú ẹ̀kọ́ tó ṣáájú hàn ní ọ̀nà Yorùbá àdánidá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa orúkọ oyè tí a mọ̀ sí ti Jesu mọ́, pẹ̀lú ìbáṣepọ̀ rẹ̀ sí Dáníẹ́lì.
- source_word: οὐκ ἦλθεν
  choice: kò ... wá
  rationale: Ó fi aorist náà hàn gẹ́gẹ́ bí ìṣe àtijọ́ láìfi ibi tàbí àkókò kún un.
- source_word: διακονηθῆναι
  choice: kí a lè máa ṣe ìránṣẹ́ fún un
  rationale: Ó fi ohùn àìṣe náà hàn ní Yorùbá tó ṣe kedere, láìsọ ọ́ di ọ̀rọ̀ ìjọ nìkan.
- source_word: ἀλλὰ διακονῆσαι
  choice: ṣùgbọ́n láti ṣe ìránṣẹ́
  rationale: Ó pa ìtakora ọ̀rọ̀-ìṣe mọ́ láàárín gbígba ìránṣẹ́ àti ṣíṣe ìránṣẹ́.
- source_word: καὶ δοῦναι
  choice: àti láti fi ... lélẹ̀
  rationale: ‘Fi lélẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ìyè ẹni fúnni nínú ọ̀rọ̀ ikú ìrúbọ, láìsọ ohun tí Gíríìkì kò sọ.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ẹ̀mí rẹ̀
  rationale: Nínú àyíká yìí ψυχή túmọ̀ sí ìyè ẹni tí a fi sílẹ̀ dé ikú; ‘ẹ̀mí rẹ̀’ jẹ́ gbólóhùn Yorùbá tí ó mọ́gbọ́n dání, bí ó tilẹ̀ jẹ́ pé ‘ìyè rẹ̀’ tún ṣeé ṣe.
- source_word: λύτρον
  choice: owó ìràpadà
  rationale: Ó sọ iye tí a san láti dá ẹnìkan sílẹ̀ ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó yé ni.
- source_word: ἀντὶ πολλῶν
  choice: fún ọ̀pọ̀ ènìyàn
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn láti kà; àlàyé ìsípò tó lágbára jù lọ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Agbára ìtumọ̀ ἀντί nínú ọ̀rọ̀ owó ìràpadà
  choice: fún ọ̀pọ̀ ènìyàn
  alternative: ní ipò ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ aṣojú tàbí ìsípò. Ẹsẹ̀ àkọ́kọ́ lo Yorùbá àdánidá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa agbára ìtumọ̀ ἀντί mọ́ láìfi ẹ̀kọ́ ẹ̀sìn kan lé e lórí.
translation_notes:
  register: Yorùbá àpéjọ, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìtunṣe ọ̀rọ̀ ìránṣẹ́ àti ìtumọ̀ ìsípò ἀντί mọ́.
