source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: yo
  text: Nígbà tí àwọn tí a kọ́kọ́ gbà síṣẹ́ dé[a], wọ́n rò pé àwọn yóò gba jù bẹ́ẹ̀ lọ; ṣùgbọ́n àwọn náà gba dínárì kan fún ẹnì kọ̀ọ̀kan wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “àwọn àkọ́kọ́”; gbólóhùn náà ń tọ́ka sí àwọn òṣìṣẹ́ tí a kọ́kọ́ gbà síṣẹ́ nínú àkàwé náà.
    reason: lexical_alternative
  - marker: b
    text: Dínárì kan jẹ́ owó-iṣẹ́ ọjọ́ kan tí òṣìṣẹ́ sábà máa ń gbà.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: nígbà tí ... dé
  rationale: Aorist participle náà ń tọ́ka sí àkókò; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: οἱ πρῶτοι
  choice: àwọn tí wọ́n kọ́kọ́
  rationale: Ó tọ́ka sí ẹgbẹ́ àwọn òṣìṣẹ́ tí a kọ́kọ́ gbà síṣẹ́, kì í ṣe ipò àkọ́kọ́ lásán.
- source_word: ἐνόμισαν
  choice: wọ́n rò
  rationale: Ó sọ èrò tàbí ìfojúsọ́nà wọn, láìfi hàn pé ó dá wọn lójú pátápátá.
- source_word: πλεῖον
  choice: jù bẹ́ẹ̀ lọ
  rationale: Ó túmọ̀ sí iye owó tó pọ̀ sí i; fífi ‘bẹ́ẹ̀’ kún un mú ìfiwéra náà ṣe kedere ní Yorùbá.
- source_word: λήμψονται
  choice: àwọn yóò gba
  rationale: Ọ̀rọ̀ ọjọ́ iwájú nínú èrò tí wọ́n ní nígbà náà ni; ‘yóò gba’ pa ìfojúsọ́nà yẹn mọ́.
- source_word: τὸ ἀνὰ δηνάριον
  choice: owó dínárì kan-kọ̀ọ̀kan
  rationale: ἀνά jẹ́ pínpín fún ẹnì kọ̀ọ̀kan; ‘kan-kọ̀ọ̀kan’ mú ìtumọ̀ náà hàn gbangba.
- source_word: καὶ αὐτοί
  choice: àwọn náà
  rationale: Ó tẹnumọ́ pé àwọn tí a kọ́kọ́ gbà síṣẹ́ náà rí iye kan náà gbà.
