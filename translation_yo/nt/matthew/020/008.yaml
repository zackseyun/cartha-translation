id: MAT.20.8
reference: Matthew 20:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: yo
  text: Nígbà tí ìrọ̀lẹ́ sì wọ̀, olúwa ọgbà àjàrà náà wí fún alábòójútó rẹ̀ pé, “Pe àwọn òṣìṣẹ́ náà, kí o sì san owó iṣẹ́ fún wọn, bẹ̀rẹ̀ láti ọ̀dọ̀ àwọn tí ó kẹ́yìn títí dé àwọn tí ó kọ́kọ́.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Nígbà tí ilẹ̀ sì ṣú
  rationale: Ó túmọ̀ ìṣẹ̀lẹ̀ tí ó wáyé ní ìrọ̀lẹ́ lọ́nà Yorùbá tí ó ṣe déédé, ó sì pa δέ mọ́ nípasẹ̀ “sì.”
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: olúwa ọgbà àjàrà náà
  rationale: “Olúwa” fi ipò ẹni tó ni àṣẹ hàn, “ọgbà àjàrà” sì jẹ́ ìtumọ̀ àdánidá fún ἀμπελών nínú àyíká yìí.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: fún aṣojú rẹ̀
  rationale: Ἐπίτροπος níbí ni ẹni tí olúwa fi àbójútó tàbí ìṣàkóso ohun-ìní lé lọ́wọ́; “aṣojú” jẹ́ ọ̀rọ̀ kúkúrú, tó yé àwọn òǹkàwé òde òní.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: kí o sì san owó iṣẹ́ wọn fún wọn
  rationale: Àṣàyàn yìí fi ìtumọ̀ sísan owó tí ó tọ́ sí àwọn òṣìṣẹ́ hàn ní Yorùbá àdánidá.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: láti ọ̀dọ̀ àwọn tí wọ́n dé kẹ́yìn títí dé àwọn tí wọ́n dé kọ́kọ́
  rationale: Àyíká òwe náà fi hàn pé “kẹ́yìn” àti “kọ́kọ́” tọ́ka sí bí wọ́n ṣe dé sí iṣẹ́, nítorí náà a sọ ọ́ di mímọ́ láì yí ìtẹ̀sí gbólóhùn náà padà.
theological_decisions:
- issue: Àkókò ọ̀rọ̀-ìṣe λέγει (present tense) nínú ìtàn
  choice: sọ
  alternative: ń sọ
  rationale: Lèγει jẹ́ present tense tí a sábà lò gẹ́gẹ́ bí historic present nínú ìtàn Gíríìkì. Yorùbá àdánidá máa ń fi ọ̀rọ̀-ìṣe tí kò ní àmì àsìkò hàn ní irú àyíká yìí; “sọ” kò fi ẹ̀kọ́ ìgbàgbọ́ kankan kún un, ó sì yẹ fún ìtàn.
- issue: Ìtumọ̀ “àwọn ìkẹyìn” àti “àwọn ìṣáájú”
  choice: àwọn tí wọ́n dé kẹ́yìn… àwọn tí wọ́n dé kọ́kọ́
  alternative: àwọn ìkẹyìn… àwọn ìṣáájú
  rationale: Ìtàn tó ṣáájú jẹ́ nípa àwọn òṣìṣẹ́ tí a pè ní onírúurú àkókò; ṣíṣe “dé” ní gbangba dènà àìyé láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì rọrùn fún òǹkàwé òde òní. A lo àmi ọ̀rọ̀ taara Yorùbá/àgbáyé, kò sì sí àlàyé ìsàlẹ̀ ojú ìwé nítorí ẹsẹ yìí kò nílò rẹ̀.
