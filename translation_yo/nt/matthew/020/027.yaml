source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: yo
  text: Àti ẹnikẹ́ni tí ó bá fẹ́ jẹ́ ẹni àkọ́kọ́ láàárín yín yóò jẹ́ ẹrú yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà ni doulos; ó lágbára ju ọ̀rọ̀ tí a lò fún “ìránṣẹ́” ní ẹsẹ tó ṣáájú lọ, ó sì sábà ń tọ́ka sí ẹrú tàbí ìránṣẹ́ tí a dè mọ́ olúwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: ẹnikẹ́ni tí ó bá fẹ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ arọ́pò-orúkọ, ἄν, àti ọ̀rọ̀-ìṣe abẹ́lẹ̀ ń fi ipò gbogbogbò tí kò tọ́ka sí ẹni kan pàtó hàn; ‘ẹnikẹ́ni tí ó bá fẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ yìí àti èrò ìfẹ́ inú mọ́.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Nínú ọ̀rọ̀ ipò àti ọlá láàárín àwùjọ yìí, gbólóhùn náà túmọ̀ sí ipò ẹni nínú ẹgbẹ́, kì í ṣe ibi tí ẹni wà lásán.
- source_word: εἶναι πρῶτος
  choice: jẹ́ ẹni àkọ́kọ́
  rationale: Èyí sọ ìfẹ́ láti ní ipò gíga jù lọ ní ọ̀nà Yorùbá tó ṣe kedere, tí ó sì bá ọ̀rọ̀ ojoojúmọ́ mu.
- source_word: ἔσται
  choice: yóò jẹ́
  rationale: A pa fọ́ọ̀mù ọjọ́ iwájú Gíríìkì mọ́ ní tààrà; ọ̀rọ̀ àyíká ló ń jẹ́ kí ó ní agbára ìlànà láìjẹ́ pé a yí i sí ‘gbọ́dọ̀ jẹ́.’
- source_word: ὑμῶν
  choice: yín
  rationale: Ọ̀rọ̀ náà fi ìbáṣepọ̀ hàn pé ẹni tó ń fẹ́ ipò àkọ́kọ́ yóò wà gẹ́gẹ́ bí ẹrú àwọn ẹlòmíràn nínú ẹgbẹ́ náà.
- source_word: δοῦλος
  choice: ẹrú
  rationale: δοῦλος lágbára ju διάκονος tí ẹsẹ tó ṣáájú lò lọ, ó sì sábà ń tọ́ka sí ẹni tí ó wà lábẹ́ ìní tàbí àṣẹ olúwa; ‘ẹrú’ pa ìgbésẹ̀ líle tí ọ̀rọ̀ Jésù gbé síwájú mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú ọ̀rọ̀ Jésù nípa jíjẹ́ ọmọ-ẹ̀yìn
  choice: ẹrú
  alternative: ìránṣẹ́; ìránṣẹ́ tí a dè mọ́ olúwa
  rationale: Ọ̀rọ̀ náà ń dojú ìjà kọ ìfẹ́ ipò gíga nípa pípe ọmọ-ẹ̀yìn sí ìrẹ̀lẹ̀ tó jinlẹ̀. Nítorí ẹsẹ tó ṣáájú ti lo ọ̀rọ̀ míì fún ‘ìránṣẹ́,’ ‘ẹrú’ dáàbò bo agbára àti ìmúlẹ̀ ọ̀rọ̀ Gíríìkì láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Láàárín yín’ àti ‘ẹnikẹ́ni tí ó bá fẹ́’ jẹ́ gbólóhùn àdánidá; ‘ẹrú’ mọ̀ọ́mọ̀ pa agbára ìyàtọ̀ δοῦλος mọ́.
