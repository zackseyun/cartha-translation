  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ náà fara mọ́ Gíríìkì dáadáa: ‘ẹnikẹ́ni tí ó bá fẹ́’ ń mú ὃς ἂν θέλῃ wá, ‘láàárín yín’ ń ṣàfihàn ἐν ὑμῖν, ‘jẹ́ ẹni àkọ́kọ́’ ń pa ìfẹ́ ipò àkọ́kọ́ mọ́, àti ‘yóò jẹ́’ ń gbé ọjọ́ iwájú ἔσται kalẹ̀. ‘Ẹrú yín’ jẹ́ ìtumọ̀ tó yẹ fún δοῦλος, ó sì pa ìmúgbòrò síi ju διάκονος nínú ẹsẹ tó ṣáájú mọ́.'
