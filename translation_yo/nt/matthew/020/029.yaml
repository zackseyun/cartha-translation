id: MAT.20.29
reference: Matthew 20:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: yo
  text: Bí wọ́n sì ti ń jáde kúrò ní Jẹ́ríkò[a], ọ̀pọ̀ ènìyàn tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘bí wọ́n ti ń kúrò ní Jẹ́ríkò.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: bí wọ́n ti ń jáde
  rationale: Ọ̀rọ̀ participle ìsinsìnyí náà ń ṣiṣẹ́ gẹ́gẹ́ bí àkókò, ó sì fi hàn pé jíjáde náà ń lọ lọ́wọ́ nígbà tí ìṣe kejì ṣẹlẹ̀. ‘Bí wọ́n ti ń jáde’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́.
- source_word: ἀπὸ Ἰεριχὼ
  choice: kúrò ní Jẹ́ríkò
  rationale: ἀπό ń tọ́ka sí ìṣípò kúrò ní ibi kan. ‘Kúrò ní Jẹ́ríkò’ sọ ìtumọ̀ orísun ibi àti jíjìnnà sí i ní Yorùbá tó ṣe kedere.
- source_word: ἠκολούθησεν
  choice: tẹ̀ lé
  rationale: Ọ̀rọ̀-ìṣe aorist náà túmọ̀ sí lílọ lẹ́yìn ẹnì kan; ‘tẹ̀ lé’ ni ọ̀rọ̀ Yorùbá àdánidá fún un nínú àyíká yìí.
- source_word: αὐτῷ
  choice: e
  rationale: Arọ́pò-orúkọ dative ẹyọ náà ń tọ́ka sí Jésù. ‘E’ pa ìyípadà láti ‘wọ́n’ nínú gbólóhùn àkọ́kọ́ sí ẹni kan ṣoṣo mọ́, láì yí i padà sí ‘wọn.’
- source_word: ὄχλος πολύς
  choice: ọ̀pọ̀ ènìyàn
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ń tọ́ka sí èrò púpọ̀. ‘Ọ̀pọ̀ ènìyàn’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì ṣe kedere láti sọ iye èrò náà.
theological_decisions:
- issue: Ẹni tí arọ́pò-orúkọ ẹyọ αὐτῷ ń tọ́ka sí lẹ́yìn gbólóhùn tí ó lo ọ̀pọ̀ ènìyàn
  choice: Èrò náà tẹ̀ lé Jésù (‘e’).
  alternative: Èrò náà tẹ̀ lé gbogbo ẹgbẹ́ náà (‘wọn’).
  rationale: Gíríìkì yí padà láti ọ̀pọ̀ ‘bí wọ́n ti ń jáde’ sí ẹyọ ‘tẹ̀ lé e.’ Àyíká náà fi Jésù hàn gẹ́gẹ́ bí ẹni pàtàkì tí arọ́pò-orúkọ náà ń tọ́ka sí; ìtumọ̀ Yorùbá pa ìyípadà yìí mọ́ dípò lílo ‘wọn’ láti mú un dọ́gba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó lọ́lá, ó sì ṣeé lóye fún gbogbo ènìyàn. ‘Jẹ́ríkò’ tẹ̀ lé ìpè Yorùbá tí ó wọ́pọ̀ fún orúkọ ibi náà.
