  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n gbà á, wọ́n sì bẹ̀rẹ̀ sí í kùn sí olúwa ilé náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Lẹ́yìn tí wọ́n … gbà á
  rationale: Ọ̀rọ̀ náà jẹ́ aorist participle, ó sì tọ́ka sí ohun tó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì náà. “Lẹ́yìn tí wọ́n gbà á” mú ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà hàn ní Yorùbá àdánidá; “á” dúró fún owó dínárì tí a mẹ́nu kàn ní àyíká ọ̀rọ̀.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tó ń tẹ ìtàn náà síwájú; “sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu láìfi ìtakò líle kún un.
- source_word: ἐγόγγυζον
  choice: wọ́n bẹ̀rẹ̀ sí í kùn
  rationale: Imperfect náà lè fi ìṣe tó ń lọ lọ́wọ́ tàbí ìbẹ̀rẹ̀ ìṣe hàn. “Bẹ̀rẹ̀ sí í kùn” bá bí ìkùn náà ṣe bẹ̀rẹ̀ lẹ́yìn tí wọ́n gba owó mu, “kùn” sì pa ìtumọ̀ àìní ìtẹ́lọ́rùn mọ́.
- source_word: κατὰ
  choice: sí
  rationale: Pẹ̀lú genitive, κατά ń fi ẹni tí ìtakò tàbí ẹ̀sùn náà dojú kọ hàn. Nínú Yorùbá, “kùn sí” jẹ́ ọ̀nà àdánidá láti sọ ìkùn tí a darí sí ẹnì kan.
- source_word: τοῦ οἰκοδεσπότου
  choice: olúwa ilé náà
  rationale: οἰκοδεσπότης túmọ̀ sí olórí tàbí olúwa ilé àti ohun ìní rẹ̀. “Olúwa ilé” pa ìtumọ̀ àkópọ̀ náà mọ́, ó sì bá ọ̀nà ọ̀rọ̀ ọlọ́lá, òde òní mu.
