    issue: Ipo “sì” nínú gbolohun akọkọ kò dára jù.
    rationale: “Lẹ́yìn tí wọ́n gbà á, wọ́n sì bẹ̀rẹ̀…” jẹ́ ìṣọ̀kan Yorùbá tó rọrùn àti tó ń pa ipa δέ mọ́.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ lọwọlọwọ fi “ọgbà àjàrà” kún ìtumọ̀ οἰκοδεσπότης.
    rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ìtàn náà jẹ́ ọgbà àjàrà, ọrọ̀ orísun nínú ẹsẹ yìí jẹ́ ‘olúwa ilé/ọba ilé’; àlàyé yíyan ọ̀rọ̀ yẹ kí ó má ṣe ṣàfikún ohun tí kò sí nínú ẹsẹ náà.
  revised_text: Lẹ́yìn tí wọ́n gbà á, wọ́n sì bẹ̀rẹ̀ sí í kùn sí olúwa ilé náà.
