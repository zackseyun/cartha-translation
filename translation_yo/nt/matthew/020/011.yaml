  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtòlẹ́sẹẹsẹ aorist participle náà dáadáa: gbígba owó náà ṣáájú ìkùn. “Bẹ̀rẹ̀ sí í kùn” jẹ́ ìtumọ̀ tí ó ṣeé gbà fún imperfect ἐγόγγυζον, “kùn sí” sì fi κατά pẹlu genitive hàn. “Olúwa ilé náà” tún fara mọ́ οἰκοδεσπότης ju ìtumọ̀ tó fi ọgbà àjàrà kún un lọ.'
  naturalness: Àgbékalẹ̀ “Lẹ́yìn tí wọ́n sì gbà á” kò rọrùn gan-an nínú Yorùbá òde òní, nítorí “sì” wà nínú gbolohun abẹ́lẹ̀. Gbigbé e sí ibẹrẹ gbolohun pàtàkì náà mú ìṣàn ọ̀rọ̀ dára síi.
  terminology: “Olúwa ilé náà” jẹ́ yíyan tó bójú mu fún οἰκοδεσπότης nínú ẹsẹ yìí. A kò gbọ́dọ̀ sọ ọ́ di “ẹni tó ni ọgbà àjàrà náà,” nítorí ọrọ̀ Gíríìkì nínú ẹsẹ yìí kò sọ ọgbà àjàrà ní tààrà.
  issues:
