id: MAT.20.23
reference: Matthew 20:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: yo
  text: Ó sọ fún wọn pé, “Ẹ ó mu ago mi nítòótọ́,[a] ṣùgbọ́n láti jókòó ní apá ọ̀tún mi àti ní apá òsì mi[b] kì í ṣe tèmi láti fi fúnni, bí kò ṣe fún àwọn tí Baba mi ti pèsè e sílẹ̀ fún.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ago” jẹ́ àfiwé fún ìjìyà tàbí ìpín tí a yàn fún Jesu, èyí tí àwọn ọmọ-ẹ̀yìn rẹ̀ yóò tún ní ìpín nínú rẹ̀.
    reason: cross_reference
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “láti jókòó ní ọ̀tún mi àti ní òsì mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ó sọ fún wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo àsìkò ìsinsìnyí nínú ìtàn, àsìkò àtijọ́ ni èdè Yorùbá àdánidá máa ń lò níbi yìí.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Ẹ ó mu ago mi nítòótọ́
  rationale: “Ago mi” pa àwòrán àfiwé inú ọ̀rọ̀ Jesu mọ́ láì túmọ̀ rẹ̀ sí ìjìyà ní pàtó nínú ẹsẹ̀ náà; “nítòótọ́” sì fi ìmúdájú àti ìyàtọ̀ tí μὲν mú wá hàn.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: láti jókòó ní ọwọ́ ọ̀tún mi àti ní ọwọ́ òsì mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún jíjókòó lẹ́gbẹ̀ẹ́ ẹni ní ipò ọlá, ó sì pa ìtọ́kasí sí ọ̀tún àti òsì mọ́.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: kì í ṣe tèmi láti fi fúnni
  rationale: Ìtumọ̀ yìí tẹ̀ lé gbólóhùn Gíríìkì ní tààrà, ó sì yẹra fún fífi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου
  choice: bí kò ṣe fún àwọn tí Baba mi ti pèsè rẹ̀ sílẹ̀ fún
  rationale: A mú àìpé gbólóhùn lẹ́yìn ἀλλά yé ní Yorùbá, a sì pa ìṣe tí Baba ṣe àti àbájáde tí ó dúró ṣinṣin nínú perfect passive mọ́.
theological_decisions:
- issue: Ìtumọ̀ nípa Kristi nínú ọ̀rọ̀ “kì í ṣe tèmi láti fi fúnni”
  choice: A túmọ̀ ọ̀rọ̀ náà ní tààrà láì fi àlàyé tó dín ìtumọ̀ rẹ̀ kù tàbí tó mú ìforígbárí inú rẹ̀ parẹ́.
  alternative: “Kì í ṣe tèmi láti fi fúnni láìsí Baba” tàbí àtúnsọ mìíràn tó ń ṣàlàyé àṣẹ Jesu.
  rationale: Orísun kò ní àwọn ọ̀rọ̀ àfikún wọ̀nyí; nítorí náà, ó yẹ kí ìtumọ̀ pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà ní mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ẹ ó” bá ọ̀pọ̀ ènìyàn mu, “Baba mi” sì pa ìbátan tí ọ̀rọ̀ Gíríìkì sọ mọ́. A gbe àmì àlàyé [a] sí “ago” àti [b] sí gbólóhùn nípa ọ̀tún àti òsì kí ọkọọkan lè bá àlàyé rẹ̀ mu.
