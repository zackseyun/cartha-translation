  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ àkọ́kọ́ Gíríìkì dáadáa: ìmúdájú ọjọ́ iwájú nínú ‘Ẹ ó mu ago mi nítòótọ́,’ ìdíwọ̀n nínú ‘kì í ṣe tèmi láti fi fúnni,’ àti ìṣe Baba nínú ohun tí a ti pèsè sílẹ̀ ni a pa mọ́. Síbẹ̀, ‘ní ọwọ́ ọ̀tún/òsì mi’ lè túmọ̀ sí nínú ọwọ́ ẹni ní Yorùbá, kì í ṣe ipò lẹ́gbẹ̀ẹ́ ẹni.'
