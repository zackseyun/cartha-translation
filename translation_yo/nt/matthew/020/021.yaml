id: MAT.20.21
reference: Matthew 20:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Kí ni o fẹ́?” Obìnrin náà sọ fún un pé, “Sọ pé kí àwọn ọmọkùnrin mi méjèèjì yìí jókòó, ọ̀kan ní ọ̀tún rẹ àti ọ̀kan ní òsì rẹ,[a] nínú ìjọba rẹ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀kan ní ẹ̀gbẹ́ ọ̀tún rẹ àti ọ̀kan ní ẹ̀gbẹ́ òsì rẹ.”
    reason: lexical_alternative
  - marker: b
    text: “Ìjọba” tún lè túmọ̀ sí “ìṣàkóso” tàbí “àṣẹ ọba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Kí ni o fẹ́?
  rationale: Ọ̀rọ̀ yìí béèrè ohun tí obìnrin náà ń fẹ́ kí Jésù ṣe; ìtumọ̀ yìí ṣe tààrà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: Εἰπὲ
  choice: Sọ pé
  rationale: A pa ìtumọ̀ ìṣe λέγω, ‘sọ,’ mọ́ dípò fífi ‘fúnni’ tàbí ‘gbà láàyè’ rọ́pò rẹ̀. Nínú àyíká ẹsẹ̀ náà, ọ̀rọ̀ náà tún lè ní agbára àṣẹ.
- source_word: ἵνα καθίσωσιν
  choice: kí ... jókòó
  rationale: Gbólóhùn ‘kí ... jókòó’ fi ohun tí obìnrin náà ń béèrè hàn lọ́nà Yorùbá tí ó ṣe kedere, láìfi kún un pé a yan wọn sí ipò náà tàbí pé a kàn gbà wọ́n láàyè.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: àwọn ọmọkùnrin mi méjèèjì yìí
  rationale: ‘Ọmọkùnrin’ mú υἱοί jáde ní pàtó, ‘méjèèjì’ àti ‘yìí’ sì pa iye méjì àti afihan οὗτοι mọ́.
- source_word: εἷς ἐκ δεξιῶν σου ... εἷς ἐξ εὐωνύμων σου
  choice: ọ̀kan ní ọ̀tún rẹ àti ọ̀kan ní òsì rẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá ṣókí láti sọ ipò ní ẹ̀gbẹ́ ọ̀tún àti ẹ̀gbẹ́ òsì, ó sì pa ìbáradọ́gba àwọn gbólóhùn méjèèjì mọ́.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: nínú ìjọba rẹ
  rationale: ‘Ìjọba’ lè tọ́ka sí ilẹ̀ ọba àti sí àṣẹ ìṣàkóso rẹ̀; ó bá àyíká àwọn ipò ọlá lẹ́gbẹ̀ẹ́ ọba mu láìdá irú ìjọba náà mọ́ ohun kan ṣoṣo.
theological_decisions:
- issue: Irú ìjókòó tí a béèrè ní ìbámu pẹ̀lú jíjẹ ọba Jésù
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ipò ní ọ̀tún àti òsì rẹ nínú ìjọba rẹ, láìsọ pé ìjọba ayé ni tàbí ìjọba ọ̀run ní òpin.
  alternative: Kí a sọ ọ́ ní pàtó gẹ́gẹ́ bí ìjọba Mèsáyà lórí ayé tàbí ìjọba ọ̀run nígbà ìparí.
  rationale: Gíríìkì sọ ibi ìjókòó àti ìjọba Jésù nìkan. Ìtumọ̀ náà pa àmì ipò ọlá àti àṣẹ ọba mọ́, ṣùgbọ́n kò yan ètò ẹ̀kọ́ nípa àwọn ohun ìkẹyìn kan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Sọ pé kí’ mọ́ ọ̀rọ̀ Gíríìkì λέγω mọ́, bí ó tilẹ̀ jẹ́ pé nínú àyíká ìbéèrè yìí ó lè ní agbára ‘pàṣẹ pé kí.’ A kò pinnu bóyá ìjọba náà jẹ́ ti ayé tàbí ti ọ̀run.
