  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ gbolohun Gíríìkì náà dáadáa: ìdáhùn àwọn òṣìṣẹ́ náà, àṣẹ olówó ọgbà náà, ìtẹnumọ́ ‘ẹ̀yin náà,’ àti ‘ọgbà àjàrà’ wà níbẹ̀. Ṣùgbọ́n ọ̀rọ̀-iṣẹ́ fún ἐμισθώσατο yẹ kí ó sọ ìfẹ́sẹ̀mulẹ̀ ‘fẹ́ iṣẹ́ sí ẹnì kan/gbà ẹnì kan ṣiṣẹ́’ ní tààrà.'
