  terminology: “Ọgbà àjàrà” jẹ́ ìtumọ̀ tó yẹ fún ἀμπελῶνα. “Ẹ̀yin náà” ń pa ìtẹnumọ́ καὶ ὑμεῖς mọ́ dáadáa. A kò nílò àlàyé ẹsẹ̀-ẹ̀rí ní Yorùbá fún historical present, nítorí ìgbà àtijọ́ nínú ìtàn jẹ́ ìlò adayeba.
