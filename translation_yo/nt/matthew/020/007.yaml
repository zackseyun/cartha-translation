  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: yo
  text: Wọ́n sọ fún un pé, “Nítorí kò sí ẹni tí ó gba wá ṣiṣẹ́.” Ó sọ fún wọn pé, “Ẹ̀yin náà, ẹ lọ sínú ọgbà àjàrà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: Wọ́n wí
  rationale: A lo ìgbà àtijọ́ nínú ìtàn Yorùbá kí ìṣàn ọ̀rọ̀ lè dùn mọ́ etí, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present.
- source_word: Ὅτι
  choice: Nítorí
  rationale: Ó bẹ̀rẹ̀ ìdáhùn tí ń ṣàlàyé ìdí tí wọ́n fi ṣì dúró láìṣiṣẹ́.
- source_word: οὐδεὶς ἡμᾶς ἐμισθώσατο
  choice: kò sí ẹni tí ó gbà wá sí iṣẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé kò sí ẹni tó yá wọn gẹ́gẹ́ bí òṣìṣẹ́; gbà sí iṣẹ́ jẹ́ ọ̀nà Yorùbá adayeba àti kedere láti sọ ọ́.
- source_word: λέγει αὐτοῖς
  choice: Ó wí fún wọn
  rationale: A tún lo ìgbà àtijọ́ fún ìṣọ̀kan àti ìṣàn ìtàn Yorùbá, láìyí ìtumọ̀ ọ̀rọ̀ Gíríìkì padà.
- source_word: Ὑπάγετε
  choice: ẹ lọ
  rationale: Àṣẹ tààrà láti lọ sí ibi iṣẹ́ ni ọ̀rọ̀ náà ń sọ.
- source_word: καὶ ὑμεῖς
  choice: Ẹ̀yin náà
  rationale: Ó tẹnu mọ́ pé ẹgbẹ́ yìí pẹ̀lú àwọn tí a ti rán ṣáájú ni kí wọ́n lọ.
- source_word: ἀμπελῶνα
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún vineyard, ọgbà tí a ti ń gbin àjàrà.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó sì yé gbogbo ènìyàn ni a lò. A lo ọ̀rọ̀-orúkọ ẹni ọ̀wọ̀ púpọ̀ “ẹ̀yin/ẹ” nítorí pé ọ̀pọ̀ ènìyàn ni olówó ọgbà náà ń bá sọ̀rọ̀. A mú historical present méjèèjì wá sí ìgbà àtijọ́, èyí tó jẹ́ adayeba nínú ìtàn Yorùbá.
