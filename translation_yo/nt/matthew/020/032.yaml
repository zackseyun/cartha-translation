id: MAT.20.32
reference: Matthew 20:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: yo
  text: Jésù dúró, ó sì pè wọ́n, ó ní, “Kí ni ẹ fẹ́ kí n ṣe fún yín?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: dúró
  rationale: Aorist participle náà fi hàn pé Jésù dá ìrìn rẹ̀ dúró kí ó tó pè wọ́n; ‘dúró’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtàn náà mu.
- source_word: ἐφώνησεν
  choice: pè
  rationale: Nínú àyíká yìí, φωνέω túmọ̀ sí pé ó pe àwọn ọkùnrin náà sí ara rẹ̀ tàbí ó ké sí wọn; ‘pè’ jẹ́ àṣàyàn àdánidá, ṣókí.
- source_word: αὐτοὺς
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn afọ́jú méjì tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
- source_word: Τί
  choice: Kí ni
  rationale: Ọ̀rọ̀ ìbéèrè náà ní ìtumọ̀ ‘kí ni’; kò nílò àfikún.
- source_word: θέλετε
  choice: ẹ fẹ́
  rationale: θέλω ń sọ ìfẹ́ tàbí ohun tí ènìyàn fẹ́; ‘ẹ fẹ́’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere, tí ó sì fi ọ̀wọ̀ hàn sí ọ̀pọ̀ ènìyàn.
- source_word: ποιήσω
  choice: kí n ṣe
  rationale: Subjunctive náà lẹ́yìn θέλετε sọ ohun tí wọ́n fẹ́ kí Jésù ṣe; ìṣètò ‘kí n ṣe’ jẹ́ ọ̀nà Yorùbá àdánidá láti gbé e jáde.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dative náà jẹ́ benefactive níbí, ó ń tọ́ka sí ohun tí Jésù yóò ṣe fún àǹfààní wọn.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A kọ orúkọ náà ní ìrísí Yorùbá tí a mọ̀ sí Jésù; article Gíríìkì kò nílò àfihàn lọ́tọ̀ ní Yorùbá.
theological_decisions:
- issue: Ohùn àti agbára ìbéèrè Jésù
  choice: 'Ìbéèrè tààrà tí ó pe wọ́n láti sọ ohun tí wọ́n fẹ́: “Kí ni ẹ fẹ́ kí n ṣe fún yín?”'
  alternative: 'Ìṣètò tí ó túbọ̀ jẹ́ ti ìlànà gírámà: “Kí ni ẹ ń fẹ́ pé kí èmi ṣe fún yín?”'
  rationale: Ọ̀rọ̀ Gíríìkì kò ní ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ariyanjiyan wà lórí rẹ̀. Àṣàyàn yìí pa ìbáṣepọ̀ Jésù pẹ̀lú wọn àti ìbéèrè tààrà mọ́ láìfi èdè líle tàbí àlàyé tí kò sí nínú orísun kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. ‘Ó sì’ ń so àwọn ìṣe tẹ̀ lé ara wọn gẹ́gẹ́ bí καὶ ṣe ń ṣiṣẹ́ nínú ìtàn náà. A lo ‘ẹ/yín’ nítorí ẹni méjì ni Jésù ń bá sọ̀rọ̀, ó sì tún bá ìforúkọsílẹ̀ ọlọ́wọ̀ mu. Kò sí àmì àlàyé ẹsẹ̀ nítorí àṣàyàn ọ̀rọ̀ náà kò nílò àlàyé míì ní Yorùbá.
