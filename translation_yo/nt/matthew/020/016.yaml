base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: yo
  text: Báyìí ni àwọn ìkẹyìn yóò jẹ́ àkọ́kọ́, àwọn àkọ́kọ́ sì jẹ́ ìkẹyìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà ni àwọn ìkẹyìn yóò jẹ́ àkọ́kọ́, àwọn àkọ́kọ́ sì jẹ́ ìkẹyìn.”
    reason: “Nítorí náà ni” jẹ́ àṣàyàn Yorùbá mìíràn fún οὕτως tí ń tẹnu mọ́ ìparí tàbí àbájáde àpẹẹrẹ náà.
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ ni
  rationale: Ó fi ìparí tàbí àbájáde òwe àpẹẹrẹ náà hàn ní Yorùbá àdánidá, ó sì pa agbára ìtumọ̀ ‘báyìí ni yóò rí’ mọ́.
- source_word: ἔσονται
  choice: yóò di
  rationale: Ọ̀rọ̀ ọjọ́ iwájú ti εἰμί ni; ‘yóò di’ mú ìyípadà ipò inú ọ̀rọ̀ náà ṣe kedere ní Yorùbá.
- source_word: οἱ ἔσχατοι
  choice: àwọn tí ó wà ní ìkẹyìn
  rationale: Àpólà yìí ń lo ajẹtífù gẹ́gẹ́ bí orúkọ. Ìtumọ̀ yìí pa èrò ipò tàbí ìtẹ̀lé mọ́ láì túmọ̀ rẹ̀ sí ‘àwọn tí kò já mọ́ nǹkan kan.’
- source_word: πρῶτοι
  choice: ẹni àkọ́kọ́
  rationale: Ó pa ìyàtọ̀ tó ṣe kedere láàárín ‘ìkẹyìn’ àti ‘àkọ́kọ́’ mọ́, ó sì bá ìlò Yorùbá mu lẹ́yìn ‘di.’
- source_word: καὶ
  choice: sì
  rationale: Ó so apá méjèèjì pọ̀ ní ọ̀nà àdánidá; kò fi agbára ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: οἱ πρῶτοι
  choice: àwọn tí ó wà ní àkọ́kọ́
  rationale: Ó tẹ̀ lé ìṣètò apá àkọ́kọ́, ó sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ ìyípadà náà mọ́.
- source_word: ἔσχατοι
  choice: ẹni ìkẹyìn
  rationale: Ó parí ìyípadà ipò náà pẹ̀lú ọ̀rọ̀ tó bá ‘ẹni àkọ́kọ́’ dọ́gba.
theological_decisions:
- issue: Irú ìyípadà tí ọ̀rọ̀ náà ń sọ
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí òwe ìyípadà ṣókí, láì sọ pàtó bóyá ‘ìkẹyìn/àkọ́kọ́’ ń tọ́ka sí àkókò, ipò láwùjọ, èrè, tàbí ìgbàlà.
  alternative: A lè túmọ̀ ọ́ ní pàtó sí ìyípadà ipò láwùjọ, ìyípadà èrè nínú ọmọ-ẹ̀yìn, tàbí ètò ìgbàlà.
  rationale: Gíríìkì fúnra rẹ̀ kò dín ìtumọ̀ ọ̀rọ̀ náà mọ́ ọ̀kan nínú àwọn ohun wọ̀nyí; fífi gbolóhùn náà sílẹ̀ ní ṣókí ń pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìṣedéédé pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yé òǹkàwé òde òní. A pa ìṣètò oníwọ̀ntúnwọ̀nsì àti ìyípadà ‘ìkẹyìn/àkọ́kọ́’ ti Gíríìkì mọ́.
