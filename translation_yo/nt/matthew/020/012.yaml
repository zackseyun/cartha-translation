id: MAT.20.12
reference: Matthew 20:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: yo
  text: wọ́n ní, “Àwọn tó kẹ́yìn wọ̀nyí ṣiṣẹ́ fún wákàtí kan, ìwọ sì mú wọn dọ́gba pẹ̀lú wa[a]—àwa tí a ru ẹrù iṣẹ́ ọjọ́ náà àti ooru gbígbóná.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwọ sì ṣe sí wọn bí ẹni pé wọ́n dọ́gba pẹ̀lú wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó tẹ̀ lé ìṣe inú ẹsẹ tó ṣáájú; ‘wọ́n ní’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti mú àsọyé wọn wọlé láìyí iṣẹ́ rẹ̀ padà.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Àwọn ẹni ìkẹyìn wọ̀nyí
  rationale: Ó pa ìyàtọ̀ ‘àwọn ìkẹyìn’ mọ́, láìfi ‘tí a gbà síṣẹ́’ kún un, bó tilẹ̀ jẹ́ pé àyíká òwe náà ló ń tọ́ka sí.
- source_word: μίαν ὥραν ἐποίησαν
  choice: ṣiṣẹ́ fún wákàtí kan
  rationale: ποιέω pẹ̀lú àkókò túmọ̀ sí lílo àkókò náà ní ṣíṣe iṣẹ́; èyí ni ọ̀nà Yorùbá tó ṣe kedere jù.
- source_word: ἴσους ... ἐποίησας
  choice: mú wọn dọ́gba pẹ̀lú wa
  rationale: Ó tẹ̀ lé àwòrán Gíríìkì pé ẹni kan mú àwọn mìíràn dọ́gba, ó sì pa agbára ẹ̀dùn àwọn òṣìṣẹ́ náà mọ́.
- source_word: τοῖς βαστάσασι
  choice: àwa tí a ru
  rationale: ‘Ru’ lè sọ nípa gbígbé ẹrù àti fífarada ìnira, gẹ́gẹ́ bí βαστάζω ṣe rí nínú àyíká iṣẹ́ yìí.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: ẹrù iṣẹ́ ọjọ́ náà
  rationale: ‘Ẹrù’ pa àwòrán βάρος mọ́; fífi ‘iṣẹ́’ hàn mú gbólóhùn náà ṣe kedere àti àdánidá ní Yorùbá láìyí ìtumọ̀ àyíká padà.
- source_word: τὸν καύσωνα
  choice: ooru gbígbóná
  rationale: καύσων ń tọ́ka sí ooru líle tí ń jóni; ‘ooru gbígbóná’ sọ bí ooru náà ti le tó ní èdè Yorùbá tó wọ́pọ̀.
theological_decisions:
- issue: Ẹ̀dùn inú òwe nípa ìdọ́gba àti ohun tí ó tọ́
  choice: A sọ ẹ̀dùn àwọn òṣìṣẹ́ náà ní tààràtà pé olówó mú àwọn tó dé kẹ́yìn dọ́gba pẹ̀lú wọn.
  alternative: Kí a túmọ̀ ọ́ ní ọ̀nà tó sọ gbangba pé olówó ṣe àìṣòdodo sí wọn.
  rationale: Ọ̀rọ̀ Gíríìkì ròyìn ẹ̀dùn wọn, ṣùgbọ́n kò fi ìdájọ́ onítúmọ̀ kún un nípa bóyá ohun tí olówó ṣe tọ́ tàbí kò tọ́; ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì rọrùn fún òǹkàwé òde òní. Àmì ohùn ni a lò níbi tó yẹ. Àmì gígùn náà ya àfikún ‘àwa tí a ru…’ sọ́tọ̀ kí ìtọ́kasí ‘wa’ ṣe kedere.
