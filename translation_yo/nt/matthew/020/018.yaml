id: MAT.20.18
reference: Matthew 20:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: yo
  text: “Wò ó, àwa ń gòkè lọ sí Jerúsálẹ́mù, a ó sì fi Ọmọ Ènìyàn[a] lé àwọn olórí àlùfáà àti àwọn akọ̀wé lọ́wọ́[b]; wọn yóò sì dá a lẹ́bi ikú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ Ènìyàn” ni oyè tí Jésù sábà máa ń fi tọ́ka sí ara rẹ̀; ó sì lè mú Dáníẹ́lì 7:13–14 wá sí ìrántí.
    reason: cross_reference
  - marker: b
    text: Tàbí, “a ó fà á lé wọn lọ́wọ́.” Ní àwọn àyíká kan, ọ̀rọ̀ náà lè túmọ̀ sí “a ó dà á.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ ìkìlọ̀ tàbí pípe àfiyèsí mọ́ ní Yorùbá òde òní, láì lo ọ̀rọ̀ àtijọ́ tí kò wọ́pọ̀.
- source_word: ἀναβαίνομεν
  choice: àwa ń gòkè lọ
  rationale: Ó fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì pa ìtumọ̀ gígun lọ sí Jerúsálẹ́mù mọ́.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ọ̀nà tí a mọ̀ sí orúkọ ìlú náà ní Yorùbá.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa oyè tí Jésù sábà máa ń fi tọ́ka sí ara rẹ̀ mọ́, pẹ̀lú àgbọ́yé tó ṣeé ṣe sí Dáníẹ́lì 7:13–14.
- source_word: παραδοθήσεται
  choice: a ó fi ... lé ... lọ́wọ́
  rationale: Ó fi ìgbé ẹni lé agbára àwọn ẹlòmíràn lọ́wọ́ hàn láì dín ìtumọ̀ náà kù sí ìwà ọ̀dàlẹ̀ nìkan.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: àwọn olórí àlùfáà
  rationale: Ó tọ́ka sí àwọn aṣáájú aláṣẹ láàárín àwọn àlùfáà, kì í ṣe àlùfáà àgbà kan ṣoṣo.
- source_word: γραμματεῦσιν
  choice: àwọn akọ̀wé
  rationale: Ìtumọ̀ tààrà ni, ó sì jẹ́ ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yorùbá mọ̀; ó pa ipa wọn gẹ́gẹ́ bí amòfin ẹ̀sìn sílẹ̀ fún àyíká ọ̀rọ̀.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: wọn yóò dá a lẹ́bi ikú
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìdájọ́ tí ó sọ ikú di ìjìyà ẹni.
theological_decisions:
- issue: Ìtumọ̀ oyè ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: Ó pa ìrísí oyè náà àti ìjùmọ̀sọ̀rọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́, láì sọ ọ́ di ọ̀rọ̀ nípa ènìyàn lásán.
- issue: Ààlà ìtumọ̀ παραδοθήσεται
  choice: a ó fi ... lé ... lọ́wọ́
  alternative: a ó dà ... / a ó fi ... hàn ní ọ̀dàlẹ̀
  rationale: Gíríìkì náà tẹnu mọ́ fífi Jésù sábẹ́ agbára àwọn ọ̀tá; kò sọ ní pàtó nínú ẹsẹ yìí pé ẹni wo ló ṣe ọ̀dàlẹ̀ sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo “Wò ó” gẹ́gẹ́ bí àmì pípe àfiyèsí; kò nílò àlàyé ìsàlẹ̀ nítorí ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
