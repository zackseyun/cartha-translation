id: MAT.20.22
reference: Matthew 20:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dáhùn, ó sì wí pé, “Ẹ kò mọ ohun tí ẹ ń béèrè. Ṣé ẹ lè mu ago[a] tí èmi fẹ́rẹ̀ẹ́ mu?” Wọ́n sọ fún un pé, “Àwa lè.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ṣíṣàlàyé sí i, “ago ìjìyà tí mo fẹ́rẹ̀ẹ́ mu.” Ọ̀rọ̀ Gíríìkì pa àpèjúwe “ago” mọ́; nínú Bíbélì, ó sábà máa ń dúró fún ìpín tí a yàn fún ènìyàn, pàápàá ìjìyà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ṣùgbọ́n Jésù dáhùn, ó sì wí pé
  rationale: Ó fi ìyípadà kékeré tí δέ mú wá hàn pẹ̀lú “Ṣùgbọ́n,” ó sì ṣojú méjèèjì ọ̀rọ̀ ìṣe náà—“dáhùn” àti “wí”—láì sọ ọ́ di àlàyé gígùn.
- source_word: Οὐκ οἴδατε
  choice: Ẹ kò mọ
  rationale: Ìtumọ̀ tààrà fún οἴδατε ni “mọ”; kò fi ìtumọ̀ àlàyé “lóye” rọ́pò rẹ̀.
- source_word: τί αἰτεῖσθε
  choice: ohun tí ẹ ń béèrè
  rationale: Àmì “ń” fi ìṣe tí ó ń lọ lọ́wọ́ hàn, “béèrè” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbéèrè ohun kan.
- source_word: δύνασθε
  choice: Ṣé ẹ lè
  rationale: “Lè” ṣàfihàn agbára tàbí ìkáńjú láti ṣe ohun náà; ìbéèrè “Ṣé” jẹ́ Yorùbá òde òní tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ ọlọ́wọ̀ mu.
- source_word: πιεῖν
  choice: mu
  rationale: Ìtumọ̀ tààrà àti àdánidá fún mímu ohun inú ago.
- source_word: τὸ ποτήριον
  choice: ago
  rationale: Ó pa àpèjúwe Gíríìkì mọ́ dípò kí a túmọ̀ ọ́ ní pàtó sí ìjìyà tàbí ikú.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: tí èmi fẹ́ mu
  rationale: Ní àyíká ọ̀rọ̀ yìí, “fẹ́” tọ́ka sí ohun tí ó ń bọ̀ tàbí tí a ti pinnu, “èmi” sì pa ìtẹnumọ́ ἐγώ mọ́. Ọ̀rọ̀ náà kò tú àpèjúwe ago ká.
- source_word: λέγουσιν αὐτῷ
  choice: Wọ́n sọ fún un pé
  rationale: A tú ìsinsìnyí ìtàn Gíríìkì sí ọ̀nà ìtàn Yorùbá àdánidá, nígbà tí “fún un” ṣojú αὐτῷ.
- source_word: Δυνάμεθα
  choice: Àwa lè mu ún
  rationale: Ó tún “lè” lò láti bá ìbéèrè ṣáájú mu, “Àwa” sì fi ìdáhùn wọn tẹnumọ́; a tún “mu ún” sọ kí ìdáhùn náà ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Agbára àpèjúwe “ago”
  choice: Fi “ago” sílẹ̀ nínú ẹsẹ̀ láì ṣàlàyé rẹ̀ níbẹ̀ gẹ́gẹ́ bí ìjìyà tàbí ikú.
  alternative: “ìjìyà tí mo fẹ́ fara dà” tàbí “ago ìjìyà tí mo fẹ́ mu”
  rationale: Àpèjúwe náà ní ìjẹ́pàtàkì nínú Bíbélì, ó sì ń tọ́ka sí ìpín tí a yàn fún ẹni, pàápàá ìjìyà Jésù tó ń bọ̀. Fífipamọ́ rẹ̀ kò jẹ́ kí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo bo gbogbo agbára ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ọ̀rọ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé lasán. “Ṣé ẹ lè” jẹ́ àdánidá ju ìṣètò ọ̀rọ̀ líle lọ, nígbà tí “dáhùn, ó sì wí pé” pa ìṣètò ìtàn Gíríìkì mọ́.
