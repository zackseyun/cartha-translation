  to: Ṣùgbọ́n Jésù dáhùn, ó sì wí pé, “Ẹ kò mọ ohun tí ẹ ń béèrè. Ṣé ẹ lè mu ago[a] tí èmi fẹ́rẹ̀ẹ́ mu?” Wọ́n sọ fún un pé, “Àwa lè.”
  rationale: A rọ́pò “fẹ́ mu” pẹ̀lú “fẹ́rẹ̀ẹ́ mu” nìkan, kí ìtumọ̀ lè fi iye μέλλω hàn gẹ́gẹ́ bí ìṣe tí ó ń bọ̀, kì í ṣe ìfẹ́ tàbí ète lásán. A tún jẹ́ kí ìdáhùn “Àwa lè” dúró ní kúkúrú bí Δυνάμεθα, láì fi ohun tí kò sí nínú Gíríìkì kún un.
