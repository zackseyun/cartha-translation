  source_fidelity: 'Ìtumọ̀ náà tọ́jú ìlànà ọ̀rọ̀ náà dáadáa: ìdáhùn Jésù, àìmọ̀ ohun tí wọ́n ń béèrè, àpèjúwe “ago,” ìbéèrè nípa agbára, àti ìdáhùn àwọn ọmọ-ẹ̀yìn náà. Síbẹ̀, “tí èmi fẹ́ mu” máa ń tú μέλλω sí ìfẹ́ tàbí ète (“that I want/intend to drink”), dípò ìṣe ọjọ́ iwájú tí ó súnmọ́ (“that I am about to drink”).'
