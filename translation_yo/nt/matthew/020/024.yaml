revisions:
- from: Nígbà tí àwọn mẹ́wàá yòókù gbọ́ ọ̀rọ̀ náà, inú bí wọn sí àwọn arákùnrin méjèèjì.
  to: Nígbà tí àwọn mẹ́wàá gbọ́ ọ̀rọ̀ náà, inú bí wọn nípa àwọn arákùnrin méjèèjì náà.
  rationale: The revision retains the natural Yoruba idiom for becoming indignant while rendering περὶ with ‘nípa’ (‘about/concerning’) rather than the more target-directed ‘sí.’ It also removes the unstated ‘yòókù.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:38Z'
review_pass:
  verdict: revise
  source_fidelity: The participial clause and the identification of the ten and the two brothers are conveyed accurately. However, Greek περὶ τῶν δύο ἀδελφῶν is most directly ‘about/concerning the two brothers’; the draft’s sí (‘at/against’) makes the brothers more explicitly the direct target of the anger than the source does. ‘Yòókù’ is inferable from the context but is not stated in this verse and need not be supplied.
  naturalness: The sentence is fluent Standard Yoruba. ‘Inú bí wọn nípa ...’ is natural and better preserves the source’s less-specific relational wording than ‘inú bí wọn sí ...’.
  terminology: ‘Àwọn mẹ́wàá,’ ‘gbọ́ ọ̀rọ̀ náà,’ and ‘àwọn arákùnrin méjèèjì’ are clear, idiomatic choices. No theological terminology or footnotes are involved.
  issues:
  - severity: medium
    issue: The preposition ‘sí’ is too directional for περὶ.
    rationale: The Greek says that the ten became indignant concerning/about the two brothers, rather than explicitly saying that they were angry at them. Rendering it with ‘nípa’ retains this distinction and accords with the English audit trail.
  - severity: low
    issue: ‘Yòókù’ is an unnecessary contextual addition.
    rationale: The wider narrative identifies these ten as the other disciples, but οἱ δέκα itself simply says ‘the ten.’ Omitting ‘yòókù’ is more source-close without reducing clarity.
  revised_text: Nígbà tí àwọn mẹ́wàá gbọ́ ọ̀rọ̀ náà, inú bí wọn nípa àwọn arákùnrin méjèèjì náà.
  revised_footnotes: []
