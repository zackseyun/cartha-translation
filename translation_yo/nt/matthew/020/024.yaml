  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: yo
  text: Nígbà tí àwọn mẹ́wàá gbọ́ ọ̀rọ̀ náà, inú bí wọn nípa àwọn arákùnrin méjèèjì náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: àwọn mẹ́wàá yòókù
  rationale: ‘Àwọn mẹ́wàá’ ni ìtumọ̀ tààrà; fífi ‘yòókù’ kún un mú kí ó ṣe kedere ní Yorùbá pé àwọn ọmọ-ẹ̀yìn mẹ́wàá tó kù ni a ń sọ̀rọ̀ nípa wọn, láì yí ìtumọ̀ padà.
- source_word: ἀκούσαντες
  choice: tí ... gbọ́ ọ̀rọ̀ náà
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ‘gbọ́’; ‘ọ̀rọ̀ náà’ tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ sọ nínú àyíká ẹsẹ náà.
- source_word: ἠγανάκτησαν
  choice: inú bí wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìbínú tàbí ìkọ̀sílẹ̀ líle tí ọ̀rọ̀ Gíríìkì náà ń fi hàn.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: sí àwọn arákùnrin méjèèjì
  rationale: περί pẹ̀lú ẹ̀yà ọ̀rọ̀ yìí tọ́ka sí ẹni tí ìbínú náà dá lé; ‘sí’ jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá, nígbà tí ‘méjèèjì’ fi hàn pé àwọn arákùnrin méjì náà lápapọ̀ ni.
