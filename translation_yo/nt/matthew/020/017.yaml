source:
  edition: SBLGNT
  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: yo
  text: Bí Jésù ṣe ń gòkè lọ sí Jerúsálẹ́mù, ó mú àwọn ọmọ-ẹ̀yìn méjìlá náà sọ́tọ̀. Ní ojú ọ̀nà, ó sì sọ fún wọn pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: ti ń gòkè lọ
  rationale: Ọ̀rọ̀ yìí jẹ́ participle àsìkò ìsinsìnyí, ó sì fi hàn pé gígòkè lọ náà ń ṣẹlẹ̀ nígbà tí Jésù mú àwọn ọmọ-ẹ̀yìn náà sọ́tọ̀. ‘Ń gòkè lọ’ pa ìtumọ̀ ìlọ sókè mọ́, nípa ilẹ̀ àti nípa ọ̀nà tí a sábà ń gbà sọ nípa lílọ sí Jerúsálẹ́mù.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerúsálẹ́mù
  rationale: ‘Sí’ ni ọ̀nà àdánidá láti fi ìdarí ìrìn-àjò lọ sí ìlú kan hàn ní Yorùbá.
- source_word: παρέλαβεν
  choice: ó mú ... sọ́tọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ẹnì kan lọ pẹ̀lú ẹni; ní ìṣọ̀kan pẹ̀lú κατ’ ἰδίαν, ‘mú ... sọ́tọ̀’ fi kedere hàn pé ó yà wọ́n kúrò lọ́dọ̀ àwọn mìíràn fún ọ̀rọ̀ àdáni.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn méjìlá náà
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá μαθητής mu nínú àyíká Ìhìn Rere. A pa nọ́ńbà méjìlá mọ́ nítorí μαθητάς wà nínú ẹ̀rí ọ̀rọ̀ Gíríìkì tí a fún wa.
- source_word: κατ’ ἰδίαν
  choice: sọ́tọ̀
  rationale: ‘Sọ́tọ̀’ mú ìtumọ̀ yíyà wọ́n kúrò lọ́dọ̀ àwọn mìíràn fún ìbánisọ̀rọ̀ àdáni jáde ní ṣókí àti ní èdè àdánidá.
- source_word: ἐν τῇ ὁδῷ
  choice: ní ọ̀nà
  rationale: Èyí pa ibi àti àkókò ìrìn-àjò náà mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn láti lóye.
- source_word: εἶπεν αὐτοῖς
  choice: ó sọ fún wọn
  rationale: ‘Ó sọ fún wọn’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún ọ̀rọ̀ sísọ sí ẹgbẹ́ ènìyàn, ó sì fi àyè sílẹ̀ fún ohun tí Jésù sọ nínú ẹsẹ tó tẹ̀ lé e.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Bí ... ti ń’ láti fi ìṣe tó ń lọ ní àkókò kan náà hàn, a sì parí pẹ̀lú àmì pé ohun tí a sọ ń tẹ̀ síwájú nínú ẹsẹ tó tẹ̀ lé e.
