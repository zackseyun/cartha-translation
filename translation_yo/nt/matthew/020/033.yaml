base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: yo
  text: Wọ́n sọ fún un pé, “Olúwa[a], jẹ́ kí ojú wa là.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Wọ́n sọ
  rationale: Ọ̀rọ̀-ìṣe ìsinsìnyí nínú ìtàn Gíríìkì ni; lílo àkókò tí ó ti kọjá jẹ́ àdánidá nínú ìtàn Yorùbá.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí jẹ́ ẹni tí wọ́n darí ọ̀rọ̀ sí; ‘fún un’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè κύριος lè túmọ̀ sí ‘Olúwa’ tàbí ọ̀rọ̀ ọ̀wọ̀ bí ‘Ọ̀gá’; ‘Olúwa’ pa ìbọ̀wọ̀ àti àǹfààní ìtumọ̀ tó jinlẹ̀ mọ́ láìfi agbára mú un.
- source_word: ἵνα
  choice: jẹ́ kí
  rationale: Nínú àyíká ẹ̀bẹ̀ yìí, ‘jẹ́ kí’ sọ àkóónú ohun tí wọ́n fẹ́ ní Yorùbá àdánidá.
- source_word: ἀνοιγῶσιν
  choice: là
  rationale: Aorist passive subjunctive ni; ‘jẹ́ kí ojú wa là’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ojú tí ó ti dí ṣí sílẹ̀, bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Yorùbá kò samisi passive náà gẹ́gẹ́ bí Gíríìkì.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: ojú wa
  rationale: Yorùbá máa ń lo ‘ojú’ ní ẹyọ ọ̀rọ̀ fún ojú méjèèjì, ‘wa’ sì tọ́ka sí àwọn olùsọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí ọ̀rọ̀ ìpè sí Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ bá ipa κύριος mu nínú Mátíù, ó sì pa ìbọ̀wọ̀ àti àìdánilójú nípa bí ìjẹ́wọ́ wọn ṣe jinlẹ̀ mọ́; àlàyé ìsàlẹ̀ sọ ìtumọ̀ ọ̀wọ̀ tí ó tún ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. ‘Jẹ́ kí ojú wa là’ ni a yàn dípò ìtumọ̀ líle tí yóò dà bí èdè àjèjì.
