id: MAT.28.13
reference: Matthew 28:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: yo
  text: wọ́n wí pé, “Ẹ sọ pé, ‘Àwọn ọmọ-ẹ̀yìn rẹ̀ wá ní òru[a], wọ́n sì jí i[b] gbé nígbà tí àwa ń sùn.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láàárín òru.” Gíríìkì νυκτός ń tọ́ka sí àkókò tí wọ́n wá.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “i,” kì í ṣe “òkú rẹ̀” tàbí “ara rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n wí pé
  rationale: Ọ̀rọ̀ àpèjúwe ìṣe yìí ń ṣí ohun tí wọ́n pàṣẹ sílẹ̀; ‘wọ́n wí pé’ jẹ́ ọ̀nà àdánidá nínú ìtàn Yorùbá láti so ọ̀rọ̀ náà mọ́ ohun tó ṣáájú.
- source_word: Εἴπατε
  choice: Ẹ sọ pé
  rationale: Ó jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn; ‘Ẹ sọ pé’ pa agbára àṣẹ náà mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: ὅτι
  choice: pé / àmì ọ̀rọ̀ tààrà
  rationale: Ó ń ṣí àkóónú ohun tí wọn yóò sọ; ‘pé’ àti àmì ọ̀rọ̀ tààrà mú iṣẹ́ rẹ̀ hàn ní Yorùbá àdánidá.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún gbólóhùn ohun-ìní náà, ó sì tọ́ka sí àwọn ọmọ-ẹ̀yìn Jésù láìfikún àlàyé.
- source_word: νυκτὸς
  choice: ní òru
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àkókò tí wọ́n dé; ‘ní òru’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: ἐλθόντες
  choice: wá
  rationale: 'Ọ̀rọ̀ àpèjúwe ìṣe aorist náà ṣáájú ìṣe jíjí; Yorùbá fi ìṣe méjèèjì lélẹ̀ ní ọ̀nà àdánidá: ‘wá … wọ́n sì jí.’'
- source_word: ἔκλεψαν
  choice: jí … gbé
  rationale: ‘Jí … gbé’ sọ ìṣe olè jíjẹ àti mímú ẹni náà kúrò níbẹ̀ ní Yorùbá àdánidá.
- source_word: αὐτὸν
  choice: i
  rationale: A pa arọ́pò-orúkọ ẹni náà mọ́ gẹ́gẹ́ bí Gíríìkì ṣe sọ, dípò fífi ‘òkú rẹ̀’ kún un.
- source_word: ἡμῶν κοιμωμένων
  choice: nígbà tí àwa ń sùn
  rationale: Èyí mú genitive absolute náà jáde kedere gẹ́gẹ́ bí ipò tó ń lọ ní àkókò ìṣe tí wọ́n fẹ̀sùn kàn.
theological_decisions:
- issue: Ohun tí αὐτόν ń tọ́ka sí nínú ìròyìn èké náà
  choice: Lo arọ́pò-orúkọ ẹni ‘i.’
  alternative: ‘òkú rẹ̀’ tàbí ‘ara rẹ̀’
  rationale: Gíríìkì lo arọ́pò-orúkọ ẹni, kò sọ ‘òkú’ tàbí ‘ara.’ Àyíká ìtàn ti mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere, nítorí náà a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó bójú mu, ó sì yẹ fún kíkà ní gbangba. A lo ‘àwa’ láti tẹ ìyàtọ̀ ẹni hàn nínú ‘nígbà tí àwa ń sùn,’ ní ìbámu pẹ̀lú ἡμῶν.
