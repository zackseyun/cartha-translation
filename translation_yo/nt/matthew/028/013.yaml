  terminology: ‘Àwọn ọmọ-ẹ̀yìn rẹ̀’ jẹ́ ìtumọ̀ tó bójú mu fún Οἱ μαθηταὶ αὐτοῦ. ‘Jí i gbé’ jẹ́ ọ̀nà kedere láti sọ ἔκλεψαν nínú àyíká yìí, nígbà tí ó pa arọ́pò-orúkọ ẹni ‘i’ mọ́. Àwọn akọsílẹ̀ a àti b bá àwọn ibi àmì wọn mu, wọ́n sì ṣàlàyé yíyan ọ̀rọ̀ láìyí ìtumọ̀ ẹsẹ̀ padà.
