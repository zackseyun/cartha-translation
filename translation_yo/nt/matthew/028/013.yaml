  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ‘wọ́n wí pé’ gbé λέγοντες jáde gẹ́gẹ́ bí ọ̀rọ̀ tó ń ṣí àṣẹ náà; ‘Ẹ sọ pé’ pa ipa àṣẹ ọ̀pọ̀ ẹni ti Εἴπατε mọ́; ‘wá ní òru’ àti ‘wọ́n sì jí i gbé’ ń ṣàfihàn ìtẹ̀lé ἐλθόντες ... ἔκλεψαν. ‘Nígbà tí àwa ń sùn’ tú ἡμῶν κοιμωμένων ní kedere. Arọ́pò-orúkọ ‘i’ dá αὐτόν dúró láìfi ‘òkú’ tàbí ‘ara’ kún un.'
