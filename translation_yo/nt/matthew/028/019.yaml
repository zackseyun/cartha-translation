  terminology: “Ọmọ-ẹ̀yìn,” “batisí,” “Baba,” “Ọmọ,” àti “Ẹ̀mí Mímọ́” jẹ́ ọ̀rọ̀ tó bófin mu, tó wọ́pọ̀, tí ó sì yẹ fún ìforúkọsílẹ̀ Bíbélì Yorùbá. A pa “orúkọ” mọ́ ní ẹyọ kan gẹ́gẹ́ bí Gíríìkì, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
