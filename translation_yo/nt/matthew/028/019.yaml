  to: Nítorí náà, ẹ lọ, ẹ sì sọ gbogbo àwọn orílẹ̀-èdè di ọmọ-ẹ̀yìn, nípa bíbatisí wọn sínú orúkọ Baba, Ọmọ, àti Ẹ̀mí Mímọ́,[a]
  rationale: 'Àtúnṣe náà jẹ́ ti ìṣọ̀rọ̀ Yorùbá àti ìfaramọ́ sí girama Gíríìkì: a rọ́pò ìṣọ̀rọ̀ tó lè ní ìtumọ̀ àṣà-tẹ̀síwájú pẹ̀lú gerund tí ń ṣàfihàn ọ̀nà iṣẹ́, a sì ṣe àkójọpọ̀ Baba, Ọmọ, àti Ẹ̀mí Mímọ́ ní ọ̀nà Yorùbá tó dáa. “Sínú orúkọ” àti àlàyé ìsàlẹ̀ wà láìyí ìtumọ̀ ẹsẹ̀ náà tàbí láìṣètìlẹ́yìn ẹ̀kọ́ ìjọ kan.'
