  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: οὖν jẹ́ “Nítorí náà,” πορευθέντες jẹ́ “ẹ lọ,” μαθητεύσατε jẹ́ “sọ ... di ọmọ-ẹ̀yìn,” àti πάντα τὰ ἔθνη jẹ́ “gbogbo àwọn orílẹ̀-èdè.” “Sínú orúkọ” ń pa εἰς mọ́, pẹ̀lú àlàyé ìsàlẹ̀ tó tọ́ka sí ìtumọ̀ míràn tí ó ṣeé ṣe. Síbẹ̀, “kí ẹ máa batisí” lè túmọ̀ sí iṣẹ́ àṣà-tẹ̀síwájú/àtúnlò, nígbà tí participle βαπτίζοντες ń ṣàfihàn ọ̀nà iṣẹ́ náà. A tún lè mú ìtọ́kasí àwọn genitive mẹ́tẹ̀ẹ̀ta dáa sí i láìjẹ́ kí “ti” dà bí ẹni pé ó ń pín orúkọ kan náà sí ọ̀pọ̀ orúkọ.'
