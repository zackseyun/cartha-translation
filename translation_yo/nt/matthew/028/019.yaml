id: MAT.28.19
reference: Matthew 28:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: yo
  text: Nítorí náà, ẹ lọ, ẹ sì sọ gbogbo àwọn orílẹ̀-èdè di ọmọ-ẹ̀yìn, nípa bíbatisí wọn sínú orúkọ Baba, Ọmọ, àti Ẹ̀mí Mímọ́,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ní orúkọ.” Èdè Gíríìkì ní “sínú orúkọ,” èyí tí ó lè tẹnu mọ́ wíwọlé sínú ìbáṣepọ̀ tàbí ìdánimọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: ẹ lọ
  rationale: Aorist participle yìí ṣáájú àṣẹ pàtàkì μαθητεύσατε, ó sì ní agbára iṣẹ́ tí ó bá àṣẹ náà rìn. “Ẹ lọ” jẹ́ Yorùbá àdánidá tí ó pa agbára iṣẹ́-ìránṣẹ́ náà mọ́ ju ìtumọ̀ líle bí “lẹ́yìn tí ẹ bá lọ” lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìpinnu tí ó jáde láti inú ọ̀rọ̀ Jésù ní ẹsẹ 18 hàn, níbi tí ó ti sọ pé gbogbo àṣẹ ni a ti fi fún un.
- source_word: μαθητεύσατε
  choice: kí ẹ sì sọ ... di ọmọ-ẹ̀yìn
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí láti mú kí ènìyàn di ọmọ-ẹ̀yìn. Ìṣọ̀rọ̀ yìí ṣe kedere ní Yorùbá òde òní, ó sì pa agbára ìmúni-di-ọmọ-ẹ̀yìn mọ́.
- source_word: πάντα τὰ ἔθνη
  choice: gbogbo àwọn orílẹ̀-èdè
  rationale: ἔθνη níbí ní ìwọ̀n gbogbo àwọn ènìyàn tàbí orílẹ̀-èdè, kì í ṣe àwọn aláìní-Júù nìkan. “Gbogbo àwọn orílẹ̀-èdè” pa ìwọ̀n àgbáyé náà mọ́.
- source_word: βαπτίζοντες
  choice: kí ẹ máa batisí wọn
  rationale: Participle yìí ṣàlàyé ọ̀nà tí iṣẹ́ sísọni di ọmọ-ẹ̀yìn gbà ń ṣẹlẹ̀. “Batisí” jẹ́ ọ̀rọ̀ Kristẹni tí a mọ̀ ní Yorùbá, kò sì dá irú ọ̀nà tí a fi ń ṣe e lákọ̀ọ́lẹ̀.
- source_word: εἰς τὸ ὄνομα
  choice: sínú orúkọ
  rationale: εἰς sábà máa ń fi ìlọsí inú nǹkan hàn. “Sínú orúkọ” pa àfihàn ìwọlé sínú ìbáṣepọ̀ tàbí ìdánimọ̀ mọ́, bí ó tilẹ̀ jẹ́ pé “ní orúkọ” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ jù.
- source_word: τοῦ πατρὸς
  choice: Baba
  rationale: Nínú àgbékalẹ̀ mẹ́tẹ̀ẹ̀ta yìí, ọ̀rọ̀ náà jẹ́ oyè ìtọ́ka sí Ọlọ́run, nítorí náà a fi lẹ́tà ńlá kọ ọ́.
- source_word: τοῦ υἱοῦ
  choice: Ọmọ
  rationale: Ìṣọ̀kan rẹ̀ pẹ̀lú Baba àti Ẹ̀mí Mímọ́ fi hàn pé oyè Ọlọ́run ni, kì í ṣe ọ̀rọ̀ gbogbogbò fún ọmọ.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá òde òní tí ó wọ́pọ̀ fún oyè ẹni Ọlọ́run yìí, ó sì pa ìtọ́ka ara-ẹni inú àgbékalẹ̀ mẹ́tẹ̀ẹ̀ta mọ́.
theological_decisions:
- issue: Ìtumọ̀ preposition εἰς nínú àgbékalẹ̀ batisí mẹ́tẹ̀ẹ̀ta
  choice: sínú orúkọ
  alternative: ní orúkọ
  rationale: “Sínú” tẹ̀lé ìtumọ̀ ìlọsí inú ti εἰς, ó sì lè fi ìwọlé sínú ìbáṣepọ̀ tàbí ìdánimọ̀ hàn láìfi ẹ̀kọ́ ìsìn pàtó kún un. A tọ́ka sí “ní orúkọ” nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ Yorùbá àdánidá tí ó ṣeé ṣe.
- issue: Orúkọ kan ṣoṣo pẹ̀lú Baba, Ọmọ àti Ẹ̀mí Mímọ́
  choice: Baba àti ti Ọmọ àti ti Ẹ̀mí Mímọ́
  alternative: Baba, Ọmọ àti Ẹ̀mí Mímọ́
  rationale: Àtúnṣe “ti” pa ìbáṣepọ̀ genitive Gíríìkì mọ́, nígbà tí “orúkọ” ṣì wà ní ẹyọ kan. Èyí fi àgbékalẹ̀ mẹ́tẹ̀ẹ̀ta inú ẹsẹ náà hàn láìṣàfikún ìtúmọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀, mímọ́gbọ́n-dání, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àṣẹ púpọ̀ “ẹ” bá ẹgbẹ́ àwọn ọmọ-ẹ̀yìn tí Jésù ń bá sọ̀rọ̀ mu. A yàgò fún ọ̀rọ̀ tí yóò pinnu ọ̀nà batisí tàbí ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
