revisions:
- from: Sì kíyèsí i, ìwarìrì ilẹ̀ ńlá kan ṣẹlẹ̀, nítorí áńgẹ́lì Olúwa kan sọ̀kalẹ̀ láti ọ̀run, ó wá síbẹ̀, ó yí òkúta náà kúrò, ó sì jókòó lé e lórí.
  to: Sì kíyèsí! Ìmìtìtì ilẹ̀ ńlá kan ṣẹlẹ̀, nítorí àńgẹ́lì Olúwa kan sọ̀kalẹ̀ láti ọ̀run, ó sún mọ́ òkúta náà, ó sì yí i kúrò, ó sì jókòó lé e lórí.
  rationale: The revision makes the angel’s approach explicit, improves the idiomatic rendering of the attention marker and earthquake term, and otherwise retains the draft’s faithful sequencing and theological restraint. The pronouns ‘i’ and ‘e’ both refer to òkúta náà, matching the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the earthquake, the angel’s descent from heaven, removal of the stone, and sitting on it. However, προσελθών means approaching/drawing near, not merely arriving ‘there’; the revision supplies that action explicitly. This follows the Greek rather than the English audit trail’s less precise ‘came up.’
  naturalness: ‘Sì kíyèsí i’ is not idiomatic here because the anticipatory object pronoun is awkward. ‘Sì kíyèsí!’ is a natural, dignified Yoruba attention formula. ‘Ìmìtìtì ilẹ̀ ńlá’ is also a more usual modern expression for a great earthquake.
  terminology: ‘Àńgẹ́lì Olúwa’ appropriately retains the source’s ‘angel of the Lord’ construction without resolving the referent of κύριος beyond the Greek. ‘Yí ... kúrò’ naturally conveys rolling the stone away.
  issues:
  - severity: medium
    issue: ‘ó wá síbẹ̀’ under-translates προσελθών.
    rationale: The participle denotes approaching or coming near. ‘Síbẹ̀’ introduces an unspecified location and does not express the relation to the stone.
  - severity: low
    issue: ‘Sì kíyèsí i’ is awkward Yoruba usage in this discourse function.
    rationale: ἰδού is an attention-getting particle; an unobjected imperative is more idiomatic.
  - severity: low
    issue: ‘ìwarìrì ilẹ̀’ is understandable but less standard than ‘ìmìtìtì ilẹ̀’ for an earthquake.
    rationale: The revised expression is natural modern Standard Yoruba while preserving the sense.
  revised_text: Sì kíyèsí! Ìmìtìtì ilẹ̀ ńlá kan ṣẹlẹ̀, nítorí àńgẹ́lì Olúwa kan sọ̀kalẹ̀ láti ọ̀run, ó sún mọ́ òkúta náà, ó sì yí i kúrò, ó sì jókòó lé e lórí.
  revised_footnotes: []
  revision_rationale: The revision makes the angel’s approach explicit, improves the idiomatic rendering of the attention marker and earthquake term, and otherwise retains the draft’s faithful sequencing and theological restraint. The pronouns ‘i’ and ‘e’ both refer to òkúta náà, matching the Greek.
