id: MAT.28.2
reference: Matthew 28:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: yo
  text: Sì kíyèsí! Ìmìtìtì ilẹ̀ ńlá kan ṣẹlẹ̀, nítorí àńgẹ́lì Olúwa kan sọ̀kalẹ̀ láti ọ̀run, ó sún mọ́ òkúta náà, ó sì yí i kúrò, ó sì jókòó lé e lórí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ọ̀rọ̀ yìí ń pe olùkà láti fiyè sí ohun àgbàyanu tí ó tẹ̀ lé; ‘kíyèsí i’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní iyì.
- source_word: σεισμὸς ... μέγας
  choice: ìwarìrì ilẹ̀ ńlá kan
  rationale: σεισμός ní àyíká yìí túmọ̀ sí ìwarìrì ilẹ̀; μέγας ń fi bí ó ti lágbára tó hàn.
- source_word: ἄγγελος κυρίου
  choice: áńgẹ́lì Olúwa kan
  rationale: A pa ìbáṣepọ̀ genitive náà mọ́ gẹ́gẹ́ bí ‘áńgẹ́lì Olúwa,’ a sì lo ‘kan’ nítorí pé ẹni náà ṣẹ̀ṣẹ̀ ń farahàn nínú ìtàn.
- source_word: προσελθὼν
  choice: ó wá síbẹ̀
  rationale: Ó sọ ìgbọ́sẹ̀ wá sí ibi ibojì/òkúta náà láìfi ohun tí kò sí nínú Giriki kún un.
- source_word: ἀπεκύλισε
  choice: ó yí ... kúrò
  rationale: Ó pa ìṣe yíyí òkúta kúrò ní ipò rẹ̀ mọ́, dípò ọ̀rọ̀ gbogbogbò bí ‘ó gbé e kúrò.’
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: ó sì jókòó lé e lórí
  rationale: Ìtumọ̀ taara àti àdánidá ni Yorùbá fún jíjókòó lórí òkúta náà.
theological_decisions:
- issue: Ta ni ‘Olúwa’ nínú ἄγγελος κυρίου?
  choice: Olúwa
  alternative: Ọlọ́run
  rationale: A kò yanju ẹni tí κύριος ń tọ́ka sí ju bí orísun Giriki ṣe ṣe lọ; ‘Olúwa’ pa àìdájú náà mọ́.
- issue: Ìbáṣepọ̀ ìwarìrì ilẹ̀ àti sísọ̀kalẹ̀ áńgẹ́lì
  choice: nítorí áńgẹ́lì Olúwa kan sọ̀kalẹ̀
  alternative: lẹ́yìn tí áńgẹ́lì Olúwa kan sọ̀kalẹ̀
  rationale: γάρ sọ ìdí tàbí àlàyé, nítorí náà ‘nítorí’ pa ìsopọ̀ ọ̀rọ̀ orísun mọ́ láìyí i sí ìtẹ̀lé àkókò nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì. A pa ‘Sì kíyèsí i’ mọ́ láti ṣàfihàn ìtẹnumọ́ ἰδοὺ, a sì yàgò fún fífi ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ̀ náà.
