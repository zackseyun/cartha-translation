id: MAT.28.9
reference: Matthew 28:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: yo
  text: Kíyèsí i! Jésù pàdé wọn, ó sì wí pé, “Mo kí yín!”[a] Wọ́n sì sún mọ́ ọn, wọ́n di ẹsẹ̀ rẹ̀ mú, wọ́n sì jọ́sìn fún un.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ẹ yọ̀!” Ọ̀rọ̀ Gíríìkì Χαίρετε jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn ní ìtumọ̀ tààràtà, ṣùgbọ́n ní ibi yìí ó ń ṣiṣẹ́ gẹ́gẹ́ bí ìkíni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “wọ́n foríbalẹ̀ fún un” tàbí “wọ́n fi ọlá jíjinlẹ̀ fún un.” Ọ̀rọ̀ Gíríìkì προσεκύνησαν lè túmọ̀ sí fíforíbalẹ̀ tàbí fífi ọlá hàn; nínú àyíká àjíǹde yìí, ó ṣeé ṣe kí ó ní ìtumọ̀ jíjọ́sìn tí ó lágbára sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ó pa ipa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ohun tí ń pe àfiyèsí olùkà, ó sì mú kí ìtàn náà yè kooro láì lo èdè àtijọ́ tí ó le.
- source_word: ὑπήντησεν
  choice: pàdé
  rationale: Ọ̀rọ̀ yìí sọ ní ṣókí, ní èdè Yorùbá àdánidá, pé Jésù bá wọn pàdé lójú ọ̀nà, láì fi ìtọ́sọ́nà míì kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: Χαίρετε
  choice: Mo kí yín!
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ọ̀rọ̀ náà ní tààràtà ni ‘Ẹ yọ̀,’ ní ibi yìí ó ń ṣiṣẹ́ gẹ́gẹ́ bí ìkíni sí ọ̀pọ̀ ènìyàn. ‘Mo kí yín!’ jẹ́ ìkíni Yorùbá tí ó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tààràtà rẹ̀ hàn.
- source_word: προσελθοῦσαι
  choice: sún mọ́ ọn
  rationale: Ó fi hàn pé àwọn obìnrin náà kọ́kọ́ lọ sí ọ̀dọ̀ Jésù kí wọ́n tó di ẹsẹ̀ rẹ̀ mú, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédéé.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: wọ́n di ẹsẹ̀ rẹ̀ mú
  rationale: Ó pa ìfarakanra àti dídì mú ṣinṣin tí κρατέω ní mọ́, láì mú kí ìṣe náà dà bí lílo ipá.
- source_word: προσεκύνησαν αὐτῷ
  choice: wọ́n jọ́sìn fún un
  rationale: Nínú ọ̀rọ̀ àjíǹde yìí, ‘jọ́sìn’ fi agbára ẹ̀sìn tí ó ṣeé ṣe kí προσκυνέω ní hàn; àlàyé ìsàlẹ̀ tún pa ìtumọ̀ fíforíbalẹ̀ tàbí fífi ọlá fún ẹni kan mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ προσκυνέω sí Jésù tí ó jíǹde
  choice: wọ́n jọ́sìn fún un
  alternative: wọ́n foríbalẹ̀ fún un / wọ́n fi ọlá jíjinlẹ̀ fún un
  rationale: Àyíká ìṣẹ̀lẹ̀ lẹ́yìn àjíǹde àti bí Mátíù ṣe gbé Jésù kalẹ̀ ń ṣètìlẹ́yìn fún ìtumọ̀ ‘jọ́sìn.’ Síbẹ̀, nítorí προσκυνέω tún lè tọ́ka sí fíforíbalẹ̀ tàbí fífi ọlá hàn, a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀ dípò kí a pa àìdánilójú ọ̀rọ̀ náà rẹ́.
translation_notes:
  register: 'A lo Yorùbá boṣewa, ìgbàlódé, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìtòlẹ́sẹẹsẹ àwọn ìṣe inú Gíríìkì ni a pa mọ́: Jésù pàdé wọn, ó kí wọn, wọ́n sún mọ́ ọn, wọ́n di ẹsẹ̀ rẹ̀ mú, wọ́n sì jọ́sìn fún un. A gbe àmì àlàyé [a] lẹ́gbẹ̀ẹ́ ìkíni àti [b] lẹ́gbẹ̀ẹ́ ‘jọ́sìn’ kí wọ́n bá ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé mu.'
