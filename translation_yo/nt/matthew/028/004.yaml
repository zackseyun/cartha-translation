id: MAT.28.4
reference: Matthew 28:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: yo
  text: Nítorí ẹ̀rù rẹ̀, àwọn olùṣọ́ wárìrì[a], wọ́n sì dà bí òkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbọ̀n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: Nítorí
  rationale: Pẹ̀lú ọ̀rọ̀ olùní ἐκ/ἀπό ní irú àyíká yìí, ἀπό ń tọ́ka sí ohun tó fa ìṣe náà. “Nítorí” sọ ìdí náà ní Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé a lè tú u ní ọ̀nà tó sún mọ́ ìṣètò Gíríìkì.
- source_word: δὲ
  choice: (a fi hàn nínú ìṣàn gbolohun)
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́. Ní Yorùbá, fífi “náà” àti “sì” ṣe ìṣàn ìtàn náà jẹ́ àdánidá ju fífi “ṣùgbọ́n” tí yóò mú ìtakora tí kò pọndandan wá.
- source_word: φόβου αὐτοῦ
  choice: ẹ̀rù rẹ̀
  rationale: “Ẹ̀rù” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún φόβος nínú àyíká ìbẹ̀rù líle yìí; “rẹ̀” pa ìtọ́kasí sí ẹni náà mọ́ láì tún “áńgẹ́lì” fi kún ọ̀rọ̀ orísun.
- source_word: ἐσείσθησαν
  choice: wárìrì
  rationale: Wọ́n lo σείω níhìn-ín fún ìgbọ̀n tàbí ìwárìrì ara nítorí ẹ̀rù. “Wárìrì” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tó sì ní agbára tó yẹ.
- source_word: οἱ τηροῦντες
  choice: àwọn olùṣọ́ náà
  rationale: Ìtumọ̀ gangan ni àwọn tí ń ṣọ́. “Àwọn olùṣọ́ náà” ṣe kedere pé àwọn ọkùnrin tí wọ́n ń ṣọ́ ibojì ni a ń sọ̀rọ̀ nípa wọn.
- source_word: ἐγενήθησαν
  choice: wọ́n sì dà
  rationale: γίνομαι tọ́ka sí yíyí ipò padà. “Wọ́n sì dà” ní Yorùbá fi hàn pé bí òkú ni ìrísí tàbí ipò wọn dé, kì í ṣe pé wọ́n kú ní ti gidi.
- source_word: ὡς νεκροί
  choice: bí òkú
  rationale: ὡς jẹ́ àfiwé, kì í ṣe ìdánimọ̀. “Bí òkú” pa àfiwé náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn; “òkú” lè tọ́ka sí ẹni kan tàbí ọ̀pọ̀ nínú irú gbolohun yìí.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (“rẹ̀”) ń tọ́ka sí
  choice: A pa ọ̀rọ̀ arọ́pò-orúkọ “rẹ̀” mọ́; nínú àyíká, ó ṣeé ṣe jù pé ó ń tọ́ka sí áńgẹ́lì náà.
  alternative: Ó lè jẹ́ ìtọ́kasí tó gbòòrò sí gbogbo ìṣẹ̀lẹ̀ ọ̀run náà.
  rationale: Ẹni tí a mẹ́nu kàn tó sún mọ́ ọn jù ni áńgẹ́lì tí ẹsẹ tó ṣáájú ṣàpèjúwe. Síbẹ̀, a kò fi “áńgẹ́lì” sínú ẹsẹ yìí, kí a má bàa tú àìsọ pàtó inú ọ̀rọ̀ arọ́pò-orúkọ náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tó ní iyì, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní.
