id: MAT.28.3
reference: Matthew 28:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: yo
  text: Ìrísí rẹ̀ dàbí mànàmáná[a], aṣọ rẹ̀ sì funfun bí yìnyín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìrísí òde” tàbí “bí ó ṣe rí” dípò “ìrísí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ onírẹ̀lẹ̀ ni δέ; “sì” ń so àpèjúwe kejì mọ́ àkọ́kọ́ lọ́nà àdánidá láì fi ìtakora líle kún un.
- source_word: εἰδέα
  choice: ìrísí
  rationale: εἰδέα tọ́ka sí bí ẹni ṣe hàn lójú tàbí àwòrán òde rẹ̀; “ìrísí” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá àyíká mu.
- source_word: ὡς ἀστραπή
  choice: dà bí mànàmáná
  rationale: ὡς fi ìfiwéra hàn; “dà bí mànàmáná” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa àfiwé náà mọ́.
- source_word: ἔνδυμα
  choice: aṣọ
  rationale: ἔνδυμα jẹ́ ọ̀rọ̀ gbogbogbò fún ohun ìwọ̀; “aṣọ” ṣe kedere láì sọ irú aṣọ kan tí Gíríìkì kò sọ.
- source_word: λευκόν
  choice: funfun
  rationale: Adájẹ náà túmọ̀ sí funfun ní tààrà; a kò fi ìmọ́lẹ̀ tàbí ìtànná tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: ὡς χιών
  choice: bí yìnyín
  rationale: Àfiwé kejì ni, tí ó fi bí aṣọ náà ṣe funfun wé yìnyín; “bí yìnyín” pa àwòrán orísun mọ́.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (“rẹ̀”) ń tọ́ka sí
  choice: A pa arọ́pò-orúkọ “rẹ̀” mọ́; nínú àyíká, ó ń tọ́ka sí áńgẹ́lì Olúwa tí ẹsẹ 2 ṣàpèjúwe.
  alternative: A lè tún “rẹ̀” lóye ní àṣìṣe gẹ́gẹ́ bí ẹni pé ó ń tọ́ka sí Jésù nítorí àyíká ìjíǹde.
  rationale: Ẹni tí a mẹ́nu kàn nítòsí jù ni áńgẹ́lì Olúwa. Síbẹ̀, a kò fi “áńgẹ́lì náà” rọ́pò arọ́pò-orúkọ, nítorí Gíríìkì fúnra rẹ̀ lo arọ́pò-orúkọ.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn kíkún níbi tí ó ti yẹ; èdè náà ní iyì, ó sì ṣe kedere fún òǹkàwé òde òní. A lo “mànàmáná” fún àwòrán ìmọ́lẹ̀ àrá, “yìnyín” sì pa àfiwé χιών mọ́.
