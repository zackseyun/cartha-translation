id: MAT.28.12
reference: Matthew 28:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: yo
  text: Nígbà tí wọ́n péjọ pẹ̀lú àwọn àgbààgbà, tí wọ́n sì ti gbìmọ̀, wọ́n fún àwọn ọmọ ogun náà ní ọ̀pọ̀lọpọ̀ owó fàdákà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iye owó fàdákà ńlá.” Ní tààrà, Gíríìkì sọ pé “fàdákà púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: Nígbà tí wọ́n péjọ
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist passive tí a lò ní ìtumọ̀ pé àwọn ènìyàn kóra wọn jọ. ‘Nígbà tí wọ́n péjọ’ jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: pẹ̀lú àwọn àgbààgbà
  rationale: μετά pẹ̀lú genitive ń tọ́ka sí ìbákẹ́gbẹ́; ‘àwọn àgbààgbà’ ni ọ̀rọ̀ Yorùbá tó yẹ fún àwọn aṣáájú yìí.
- source_word: συμβούλιόν τε λαβόντες
  choice: tí wọ́n sì ti gbìmọ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ συμβούλιον λαμβάνω túmọ̀ sí jíjọ ronú kí a sì gbé ète kalẹ̀. ‘Gbìmọ̀’ sọ ìtumọ̀ ìfọ̀rọ̀wérọ̀ àti ìpinnu pọ̀ ní Yorùbá láìṣe àfikún èrò.
- source_word: ἀργύρια ἱκανὰ
  choice: ọ̀pọ̀lọpọ̀ owó fàdákà
  rationale: ἀργύρια lè túmọ̀ sí owó tí a fi fàdákà ṣe, ἱκανὰ sì ń sọ pé iye rẹ̀ pọ̀ gan-an. Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtọ́kasí sí fàdákà mọ́.
- source_word: ἔδωκαν
  choice: wọ́n fún
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá ti δίδωμι nínú àyíká yìí.
- source_word: τοῖς στρατιώταις
  choice: àwọn ọmọ ogun náà
  rationale: στρατιώταις túmọ̀ ní pàtó sí ‘àwọn ọmọ ogun.’ Ọ̀rọ̀ atọ́ka ‘náà’ bá àyíká mu, nítorí àwọn ọmọ ogun wọ̀nyí ti fara hàn ṣáájú.
theological_decisions:
- issue: Ta ni ‘wọ́n’ ń tọ́ka sí?
  choice: ‘Wọ́n’ ń bá ìtọ́kasí sí àwọn olórí àlùfáà nínú ẹsẹ tó ṣáájú lọ.
  alternative: Kí a fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí sílẹ̀ láìdájú.
  rationale: Àwọn participle àti ọ̀rọ̀-ìṣe pàtàkì Gíríìkì jẹ́ masculine plural, ẹni tí wọ́n sì ń tọ́ka sí ń bá àwọn olórí àlùfáà nínú Mátíù 28:11 lọ. A kò tún orúkọ wọn fi kún ẹsẹ yìí, nítorí Gíríìkì náà kò tún un sọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó mọ́gbọ́n dání, tó ní ọlá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A gbe àmì àlàyé [a] lẹ́yìn gbólóhùn ‘owó fàdákà,’ ibi tí àlàyé náà kàn sí.
