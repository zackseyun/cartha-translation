id: MAT.28.5
reference: Matthew 28:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: yo
  text: Ṣùgbọ́n áńgẹ́lì náà dá àwọn obìnrin náà lóhùn pé, “Ẹ̀yin[a], ẹ má bẹ̀rù, nítorí mo mọ̀ pé Jésù, ẹni tí a ti kàn mọ́ àgbélébùú[b], ni ẹ̀ ń wá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì fi “ẹ̀yin” hàn gbangba fún ìtẹnumọ́; ìfọkànbalẹ̀ náà ni a darí sí àwọn obìnrin náà ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “Jésù, ẹni tí wọ́n ti kàn mọ́ àgbélébùú.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Ṣùgbọ́n ... dá ... lóhùn pé
  rationale: Ọ̀rọ̀ yìí pa ìyípadà kékeré tí δέ ń fi hàn mọ́, ó sì tú àṣà ọ̀rọ̀ Gíríìkì ‘dáhùn, ó sì wí’ sí Yorùbá àdánidá láì tún ọ̀rọ̀ kan náà sọ lẹ́ẹ̀mejì.
- source_word: ὁ ἄγγελος
  choice: áńgẹ́lì náà
  rationale: Nínú àyíká ìjíǹde yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀dá ọ̀run, kì í ṣe òjíṣẹ́ ènìyàn lásán.
- source_word: ταῖς γυναιξίν
  choice: àwọn obìnrin náà
  rationale: Ó túmọ̀ sí àwọn obìnrin tí a ti mẹ́nu kàn nínú ìtàn, kì í ṣe dandan àwọn aya.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Ẹ̀yin, ẹ má bẹ̀rù
  rationale: Fífi ‘Ẹ̀yin’ sí iwájú pa ìtẹnumọ́ arọ́pò-orúkọ ὑμεῖς mọ́ ní Yorùbá àdánidá, ó sì darí ìfọkànbalẹ̀ náà sí àwọn obìnrin pàápàá.
- source_word: οἶδα γὰρ ὅτι
  choice: nítorí mo mọ̀ pé
  rationale: ‘Nítorí’ fi ìdí tí áńgẹ́lì fi ní kí wọ́n má bẹ̀rù hàn, ‘pé’ sì bẹ̀rẹ̀ àkóónú ohun tí ó mọ̀.
- source_word: Ἰησοῦν ... ζητεῖτε
  choice: Jésù ... ni ẹ̀ ń wá
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá fún ìṣe tí ń lọ lọ́wọ́, ó sì fi Jésù ṣe ohun tí wọ́n ń wá ní kedere.
- source_word: τὸν ἐσταυρωμένον
  choice: ẹni tí a kàn mọ́ àgbélébùú
  rationale: 'Ó pa ipa àpèjúwe ọ̀rọ̀ alábápín pipe passive náà mọ́: Jésù ni ẹni tí a ti kàn mọ́ àgbélébùú, pẹ̀lú àbájáde ìṣẹ̀lẹ̀ náà tí ó ṣì ṣe pàtàkì.'
theological_decisions:
- issue: Ìtẹnumọ́ ὑμεῖς nínú ọ̀rọ̀ ìfọkànbalẹ̀ áńgẹ́lì
  choice: A fi ‘Ẹ̀yin’ hàn gbangba nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
  alternative: ‘Ẹ má bẹ̀rù’ láìsí arọ́pò-orúkọ tí a tẹnumọ́.
  rationale: Gíríìkì fi arọ́pò-orúkọ náà hàn gbangba fún ìtẹnumọ́. Ìtumọ̀ yìí pa ìdarí ọ̀rọ̀ náà sí àwọn obìnrin mọ́ láì pinnu ju ohun tí ẹsẹ̀ náà sọ lọ.
- issue: Ìtumọ̀ perfect passive participle ἐσταυρωμένον
  choice: ‘ẹni tí a kàn mọ́ àgbélébùú’
  alternative: ‘ẹni tí wọ́n ti kàn mọ́ àgbélébùú’ tàbí ‘ẹni tí a mọ̀ sí ẹni àgbélébùú’
  rationale: Yíyan yìí fi ìṣe tí ó ti ṣẹlẹ̀ hàn, ó sì yẹra fún fífi ẹni tó ṣe é kun ọ̀rọ̀ nígbà tí Gíríìkì kò dárúkọ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘áńgẹ́lì’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀, ‘àgbélébùú’ fún σταυρός, àti àkójọpọ̀ ‘Ẹ̀yin, ẹ ...’ láti pa ìtẹnumọ́ Gíríìkì mọ́ ní Yorùbá àdánidá.
