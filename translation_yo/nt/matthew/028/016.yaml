id: MAT.28.16
reference: Matthew 28:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn mọ́kànlá náà sì lọ sí Galili, sí òkè tí Jesu ti yàn fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “tí Jesu ti tọ́ka sí fún wọn” tàbí “tí Jesu ti pinnu fún wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí yíyan, pípinnu, tàbí fífúnni ní ìtọ́sọ́nà.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Àsopọ̀ onírẹ̀lẹ̀ ni δέ nínú ìtàn; “sì” ń so ẹsẹ yìí mọ́ ohun tó ṣáájú láì fi ìtakora líle kún un.
- source_word: ἕνδεκα μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn mọ́kànlá náà
  rationale: “Ọmọ-ẹ̀yìn” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής, “mọ́kànlá” sì pa iye ẹgbẹ́ náà mọ́ lẹ́yìn àìsí Judasi.
- source_word: ἐπορεύθησαν
  choice: lọ
  rationale: “Lọ” jẹ́ ìtumọ̀ adayébá, tààrà fún ìrìn sí ibì kan nínú àyíká yìí.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sí Galili
  rationale: εἰς fi ìlọ sí agbègbè kan hàn; “sí Galili” ni ọ̀nà Yorùbá adayébá láti sọ ọ́.
- source_word: εἰς τὸ ὄρος
  choice: sí òkè
  rationale: ὄρος lè túmọ̀ sí òkè tàbí ilẹ̀ olókè; àpilẹ̀kọ náà àti gbólóhùn tó tẹ̀ lé e tọ́ka sí òkè kan pàtó.
- source_word: οὗ
  choice: tí ... lọ sí
  rationale: Ọ̀rọ̀ ìbátan ibi οὗ ni a ṣe ní Yorùbá pẹ̀lú gbólóhùn “tí ... lọ sí,” èyí tó jẹ́ adayébá ju títúmọ̀ ọ́ ní ọ̀rọ̀ kan ṣoṣo lọ.
- source_word: ἐτάξατο αὐτοῖς
  choice: ti sọ fún wọn pé kí wọn lọ sí
  rationale: Nínú àyíká yìí, τάσσω tọ́ka sí ìtọ́sọ́nà tàbí yíyan ibi ìpàdé ṣáájú. Gbólóhùn yìí ṣe kedere pé Jesu ti darí wọn sí ibẹ̀, láì sọ ọ́ di ìyàn sí ipò kan.
- source_word: ὁ Ἰησοῦς
  choice: Jesu
  rationale: Èyí ni ìkọ̀wé orúkọ Ἰησοῦς tó ti fìdí múlẹ̀ nínú Yorùbá.
theological_decisions:
- issue: Bó ṣe yẹ kí a lóye ἐτάξατο nípa ibi ìpàdé náà
  choice: “ti sọ fún wọn pé kí wọn lọ sí” gẹ́gẹ́ bí ìtọ́sọ́nà sí ibi tí a ti pinnu ṣáájú
  alternative: “ti yàn fún wọn” tàbí “ti pàṣẹ fún wọn”
  rationale: Àyíká náà ń sọ nípa ibi tí Jesu ti sọ tẹ́lẹ̀, kì í ṣe yíyan àwọn ọmọ-ẹ̀yìn sí ipò ìjọ kan. Ìtumọ̀ yìí pa agbára ìtọ́sọ́nà ọ̀rọ̀ náà mọ́ láì fi ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá àgbà lítírésọ̀ tó bójú mu, tó ní àmì ohùn níbi tó yẹ, ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “sì” láti gbé àsopọ̀ ìtàn δέ jáde; a kò fi ọ̀rọ̀ àkókò bí “nígbà náà” kún un.
