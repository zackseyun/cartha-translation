  source_fidelity: Ìtumọ̀ náà ṣetán láti tọ́ka sí pé ọ̀rọ̀ náà dé ọ̀dọ̀/etí gómìnà, ó sì pa ìtumọ̀ ìlérí pé àwọn àlùfáà yóò mú kí àwọn ẹ̀ṣọ́ náà má ní àníyàn mọ́. Síbẹ̀, “yí i lọ́kàn padà” ń sọ ní pàtó pé gómìnà ti ní ìpinnu kan tí wọn yóò yí padà, níbi tí πείσομεν αὐτόν kan túmọ̀ sí “a ó rọ̀ ọ́/a ó yí i lérò” (persuade him). “A ó rọ̀ ọ́” jẹ́ ìbámu tó sún mọ́ ọ̀rọ̀ Gíríìkì náà.
