  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: yo
  text: Bí ọ̀rọ̀ yìí bá sì dé etí gómìnà,[a] àwa yóò rọ̀ ọ́, a ó sì mú kí ẹ má ṣe ní ìdààmú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí gómìnà bá gbọ́ ọ̀rọ̀ yìí.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “a ó sì mú kí ẹ wà láìní àníyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ … ἐπὶ τοῦ ἡγεμόνος
  choice: dé etí gómìnà
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí pé ìròyìn náà dé ibi tí gómìnà yóò ti gbọ́ ọ; ‘dé etí’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ ìgbọ́ náà mọ́ láì sọ gómìnà di ẹni tó ṣe iṣẹ́ nínú gbólóhùn náà.
- source_word: ἡγεμόνος
  choice: gómìnà
  rationale: Nínú àyíká ìjọba Róòmù yìí, ọ̀rọ̀ náà ń tọ́ka sí olùṣàkóso agbègbè, ìyẹn Pilatu; ‘gómìnà’ ni ọ̀rọ̀ Yorùbá tó péye jù.
- source_word: πείσομεν αὐτόν
  choice: yí i lọ́kàn padà
  rationale: πείθω túmọ̀ sí láti mú kí ẹnì kan gba ọ̀rọ̀ ẹni gbọ́ tàbí fara mọ́ ọn. ‘Yí i lọ́kàn padà’ jẹ́ àdánidá ní Yorùbá, kò sì fi ohun tí wọn yóò sọ fún un kún ẹsẹ náà.
- source_word: ἀμερίμνους ποιήσομεν
  choice: mú kí ẹ má ṣe ní ìdààmú
  rationale: Èyí tẹ̀lé ìtumọ̀ gidi ti ‘mú kí ẹ wà láìní àníyàn/ìdààmú,’ ó sì bá àyíká ewu ìjìyà àwọn ẹ̀ṣọ́ mu láì dín ọ̀rọ̀ náà kù sí ìmọ̀lára inú nìkan.
theological_decisions: []
translation_notes:
  register: Yorùbá àpéwọ̀n, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘dé etí’ gẹ́gẹ́ bí àpólà Yorùbá àdánidá, a sì lo ‘ẹ’ fún ọ̀pọ̀ àwọn ẹ̀ṣọ́; àmì ohùn kíkún wà níbi tí ó bá jẹ́ àdánidá.
