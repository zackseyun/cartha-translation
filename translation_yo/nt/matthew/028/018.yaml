source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: yo
  text: Jésù sì sún mọ́ wọn, ó sì sọ fún wọn pé, “Gbogbo àṣẹ ní ọ̀run àti lórí ilẹ̀ ayé ni a ti fi fún mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: sún mọ́ wọn
  rationale: Ó fi ìṣípò Jésù sí ọ̀dọ̀ àwọn ọmọ-ẹ̀yìn hàn ní Yorùbá àdánidá, láì sọ pé ó kàn ‘wá’ nìkan.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: ó bá wọn sọ̀rọ̀ pé
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti fi ìṣe sísọ sí wọn àti ìṣáájú ọ̀rọ̀ tààrà hàn, láì tún ‘sọ’ ṣe ní ọ̀nà líle.
- source_word: Ἐδόθη μοι
  choice: ni a ti fi fún mi
  rationale: Ètò aláìdárúkọ olùṣe náà pa ohùn àìṣe Greek mọ́; ‘ti fi fún’ sì fi ìṣe tí ó ti parí tí ipa rẹ̀ ṣì wà nísinsìnyí hàn.
- source_word: πᾶσα ἐξουσία
  choice: gbogbo àṣẹ
  rationale: ‘Gbogbo’ sọ àpapọ̀ pátápátá; ‘àṣẹ’ sì túmọ̀ sí ẹ̀tọ́ àti agbára láti ṣàkóso ju okun tàbí agbára ṣíṣe lásán lọ.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: ní ọ̀run àti lórí ilẹ̀ ayé
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún àwọn agbègbè méjèèjì, ọ̀run àti ilẹ̀ ayé.
theological_decisions:
- issue: Bí Jésù ṣe ní àṣẹ gbogbo ayé
  choice: “Gbogbo àṣẹ ... ni a ti fi fún mi”
  alternative: “Gbogbo agbára ... jẹ́ tèmi” tàbí “ni a fi fún mi”
  rationale: A pa fọ́ọ̀mù àìṣe Ἐδόθη àti èrò pé a fi àṣẹ náà fún Jésù mọ́, dípò yíyí rẹ̀ sí gbólóhùn nípa ohun tó jẹ́ tirẹ̀ lásán. ‘Àṣẹ’ tún pa ìtumọ̀ ẹ̀tọ́ ìṣàkóso mọ́ ju ‘agbára’ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá bá èdè mu; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A kò fi àlàyé ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
