id: MAT.28.10
reference: Matthew 28:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: yo
  text: Nígbà náà, Jésù sọ fún wọn pé, “Ẹ má bẹ̀rù. Ẹ lọ, ẹ sì sọ fún àwọn arákùnrin mi[a] pé kí wọ́n lọ sí Gálílì[b]; ní bẹ̀ ni wọn yóò ti rí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin mi” ń tọ́ka sí àwọn ọmọ-ẹ̀yìn Jésù níbí. Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ akọ ní ọ̀pọ̀.
    reason: lexical_alternative
  - marker: b
    text: '“Sọ fún” tún lè jẹ́ “ròyìn fún”: “Ẹ lọ, ẹ sì ròyìn fún àwọn arákùnrin mi pé kí wọ́n lọ sí Gálílì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn lọ́nà àdánidá nínú ìtàn Yorùbá.
- source_word: λέγει αὐταῖς
  choice: Jésù sọ fún wọn
  rationale: A tú ọ̀rọ̀ ìṣe ìsinsìnyí inú ìtàn Gíríìkì sí ọ̀nà ìtàn Yorùbá; “wọn” ń tọ́ka sí àwọn obìnrin tí a mẹ́nu kàn ṣáájú láìfi àlàyé kún ẹsẹ náà.
- source_word: Μὴ φοβεῖσθε
  choice: Ẹ má bẹ̀rù
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àṣẹ tí a fún ọ̀pọ̀ ènìyàn mu.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Ẹ lọ sọ fún
  rationale: Ó mú àṣẹ méjèèjì wá, ó sì sọ ìgbéjíṣẹ́ náà ní Yorùbá tó rọrùn, tó ṣe déédéé.
- source_word: τοῖς ἀδελφοῖς μου
  choice: àwọn arákùnrin mi
  rationale: Ó pa ọ̀rọ̀ ìbátan akọ ní ọ̀pọ̀ Gíríìkì mọ́, dípò fífi ọ̀rọ̀ ìtumọ̀ bí “àwọn ọmọ-ẹ̀yìn mi” rọ́pò rẹ̀.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: pé kí wọ́n lọ sí Gálílì
  rationale: “Pé kí” jẹ́ ọ̀nà àdánidá láti fi àṣẹ tí a ń jíṣẹ́ sọ ní Yorùbá.
- source_word: κἀκεῖ με ὄψονται
  choice: níbẹ̀ ni wọn yóò ti rí mi
  rationale: Ó pa ibi tí ìrí náà yóò ti ṣẹlẹ̀ mọ́, “rí” sì jẹ́ ìtumọ̀ tààrà ju “pàdé” lọ.
theological_decisions:
- issue: Ẹni tí “àwọn arákùnrin mi” ń tọ́ka sí
  choice: A pa “àwọn arákùnrin mi” mọ́ nínú ẹsẹ, pẹ̀lú àlàyé pé àwọn ọmọ-ẹ̀yìn Jésù ni ọ̀rọ̀ náà ń tọ́ka sí ní àyíká yìí.
  alternative: “Àwọn ọmọ-ẹ̀yìn mi,” tàbí ìtumọ̀ tó gbooro sí gbogbo àwọn ọmọlẹ́yìn.
  rationale: Àyíká ìwé Mátíù ń tọ́ka sí àwọn ọmọ-ẹ̀yìn, ṣùgbọ́n pípa ọ̀rọ̀ ìbátan náà mọ́ ń jẹ́ kí ìtumọ̀ àti ìfẹ́ inú ọ̀rọ̀ Gíríìkì dúró láìyanjú rẹ̀ jù.
- issue: Ìtumọ̀ ὄψονται
  choice: “wọn yóò rí mi”
  alternative: “wọn yóò pàdé mi”
  rationale: “Rí” ni ìtumọ̀ tó ṣe tààrà, ó sì yẹra fún fífi èrò ìpàdé tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àṣẹ ọ̀pọ̀ ènìyàn “Ẹ,” a sì pa ìtẹnumọ́ ibi mọ́ nínú “níbẹ̀ ni … ti.”
