id: MAT.28.11
reference: Matthew 28:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: yo
  text: Bí wọ́n sì ti ń lọ[a], kíyèsí i[b], àwọn kan lára àwọn ẹ̀ṣọ́ náà wọ inú ìlú, wọ́n sì ròyìn gbogbo ohun tí ó ṣẹlẹ̀ fún àwọn olórí àlùfáà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí wọ́n ń lọ.” Èdè Gíríìkì fi gbólóhùn yìí ṣe àkójọ àkókò fún ìṣẹ̀lẹ̀ tó tẹ̀ lé e.
    reason: lexical_alternative
  - marker: b
    text: “Kíyèsí i” túmọ̀ àmì ìpe-àfiyèsí Gíríìkì ἰδού, èyí tó fi ìṣẹ̀lẹ̀ tuntun, òjijì tàbí ohun tó yẹ ní àfiyèsí hàn nínú ìtàn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Bí wọ́n sì ti ń lọ
  rationale: Gbólóhùn yìí fi àkókò ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn, ó sì pa ìyípadà ìtàn tí δέ ń tọ́ka sí mọ́ láì fi ibi tí wọ́n ń lọ kún un.
- source_word: ἰδού
  choice: kíyèsí i
  rationale: Ó pa àmì tí ń pe àfiyèsí sí ìṣẹ̀lẹ̀ tuntun tàbí ohun àràmàǹdà mọ́, ó sì ṣeé lóye ní èdè Yorùbá òde òní.
- source_word: τινες τῆς κουστωδίας
  choice: àwọn kan lára àwọn ẹ̀ṣọ́ náà
  rationale: Ó tọ́ka sí díẹ̀ lára ẹgbẹ́ àwọn olùṣọ́ tí a fi sí ibojì, kì í ṣe gbogbo wọn.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: wọ inú ìlú
  rationale: Ìtumọ̀ yìí sọ ìṣe tó ṣáájú ìròyìn náà ní ọ̀nà Yorùbá tó ṣe déédé, láì di ọ̀rọ̀ mọ́ àkópọ̀ participle Gíríìkì.
- source_word: ἀπήγγειλαν
  choice: ròyìn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ìṣẹ̀lẹ̀ kan tó ṣẹlẹ̀ tó àwọn aláṣẹ létí gẹ́gẹ́ bí ìròyìn.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: fún àwọn olórí àlùfáà
  rationale: Èyí ni ọ̀nà Yorùbá tó mọ́gbọ́n dání fún àwọn aṣáájú àlùfáà Júù tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí.
- source_word: ἅπαντα τὰ γενόμενα
  choice: gbogbo ohun tí ó ṣẹlẹ̀
  rationale: Ó pa ìtumọ̀ gbogbo-gbòò tí ἅπαντα ní mọ́, ó sì sọ àwọn ìṣẹ̀lẹ̀ tó ti wáyé ní ọ̀nà àdánidá.
theological_decisions: []
translation_notes:
  register: A lo èdè Yorùbá tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì yàgò fún èdè ìjọ kan pàtó.
