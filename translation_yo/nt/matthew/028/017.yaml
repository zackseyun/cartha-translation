id: MAT.28.17
reference: Matthew 28:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: yo
  text: Nígbà tí wọ́n sì rí i, wọ́n foríbalẹ̀ fún un; ṣùgbọ́n àwọn kan ṣiyèméjì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ṣe méjìméjì” tàbí “lọ́ tìkọ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àìdánilójú dípò àìgbàgbọ́ tó fìdí múlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí wọ́n sì rí i
  rationale: A tú àpólà aláìlórúkọ aorist yìí sí gbólóhùn àkókò ní Yorùbá àdánidá, kí ìṣe rírí náà lè ṣáájú ìṣe pàtàkì tó tẹ̀ lé e.
- source_word: προσεκύνησαν
  choice: wọ́n foríbalẹ̀ fún un
  rationale: ‘Foríbalẹ̀ fún’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún ìṣe ìforíbalẹ̀ ọlọ́wọ̀ àti ìjọ́sìn; ó pa àwòrán ìṣe ara inú ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ọ̀wọ̀ tí wọ́n fi fún Jésù ẹni tí ó jíǹde mu.
- source_word: οἱ δὲ
  choice: ṣùgbọ́n àwọn kan
  rationale: Àpilẹ̀kọ náà pẹ̀lú δέ ń fi apá kan nínú ẹgbẹ́ tí a mẹ́nu kàn yà sọ́tọ̀ ní ìtakora; ‘àwọn kan’ sọ èyí di mímọ́ ní Yorùbá.
- source_word: ἐδίστασαν
  choice: ṣiyèméjì
  rationale: ‘Ṣiyèméjì’ jẹ́ ìtumọ̀ tààrà tó wọ́pọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ṣíṣiyèméjì, ṣíṣe méjìméjì, tàbí lílọ́ tìkọ̀ mọ́ láì sọ ọ́ di àìgbàgbọ́ pátápátá.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω sí Jésù ẹni tí ó jíǹde
  choice: wọ́n foríbalẹ̀ fún un
  alternative: wọ́n jọ́sìn fún un
  rationale: Àṣàyàn yìí pa ìṣe ìforíbalẹ̀ àti ọ̀wọ̀ jíjinlẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àyíká ìjíǹde náà jẹ́ kí ìtumọ̀ ìjọ́sìn hàn gbangba láì fi ìtumọ̀ ẹ̀kọ́ ìsìn tí ọ̀rọ̀ náà kò fi dandan mú wọlé.
- issue: Ìwọ̀n àìdánilójú nínú διστάζω
  choice: ṣiyèméjì
  alternative: ṣe méjìméjì; lọ́ tìkọ̀
  rationale: Ọ̀rọ̀ pàtàkì náà fi ìforígbárí inú ìtàn hàn, ṣùgbọ́n àlàyé [a] jẹ́ kí òǹkàwé mọ̀ pé ó lè túmọ̀ sí àìdánilójú tàbí ìlọ́ra dípò àìgbàgbọ́ tó fìdí múlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. ‘Foríbalẹ̀ fún un’ jẹ́ gbólóhùn àdánidá tó pa ìṣe ara àti ìtumọ̀ ọ̀wọ̀ jíjinlẹ̀ mọ́; àmì àlàyé náà wà lẹ́yìn ‘ṣiyèméjì,’ ibi tí ó tọ́ka sí.
