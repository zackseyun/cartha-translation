id: MAT.28.6
reference: Matthew 28:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: yo
  text: Kò sí níhìn-ín, nítorí a ti jí i dìde[a], gẹ́gẹ́ bí ó ti sọ. Ẹ wá, ẹ wo ibi tí ó dùbúlẹ̀ sí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ó ti jíǹde.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìrísí àìṣe-tààrà (“a ti jí i dìde”), bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ìtumọ̀ máa ń sọ ọ́ ní ìrísí olùṣe.
    reason: alternative_reading
  - marker: b
    text: A tún lè sọ pé, “ibi tí ó ti dùbúlẹ̀” tàbí “ibi tí a ti tẹ́ ẹ sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Kò sí níhìn-ín
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹni tí a ń tọ́ka sí kò sí ní ibi yìí; àyíká ọ̀rọ̀ ti fi ẹni náà hàn kedere.
- source_word: ἠγέρθη
  choice: a ti jí i dìde
  rationale: Ọ̀rọ̀ yìí pa ìrísí àìṣe-tààrà (passive) ti Gíríìkì mọ́, kò sì dárúkọ ẹni tó jí i dìde, gẹ́gẹ́ bí orísun náà kò ti dárúkọ rẹ̀.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó fi ìdí tí kò fi sí níhìn-ín hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: καθὼς εἶπεν
  choice: gẹ́gẹ́ bí ó ti sọ
  rationale: Ó pa ìbámu pẹ̀lú ohun tí Jésù ti sọ tẹ́lẹ̀ mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: δεῦτε
  choice: Ẹ wá
  rationale: Àṣẹ tàbí ìpè náà ń tọ́ka sí ọ̀pọ̀ ènìyàn, nítorí náà ‘Ẹ’ mú iye ọ̀pọ̀ inú Gíríìkì jáde.
- source_word: ἴδετε
  choice: ẹ wo
  rationale: Ó jẹ́ ìpè sí wọn láti fi ojú ara wọn yẹ ibi náà wò, ó sì jẹ́ Yorùbá òde òní tó ṣe déédé.
- source_word: τὸν τόπον
  choice: ibi
  rationale: ‘Ibi’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àyè pàtó inú ibojì náà.
- source_word: ὅπου ἔκειτο
  choice: ibi tí ó dùbúlẹ̀ sí
  rationale: Ó pa ìtumọ̀ ipò tí κεῖμαι ní—pé ara rẹ̀ dùbúlẹ̀ níbẹ̀—mọ́, láìsọ ní pàtó pé ẹlòmíràn ni ó tẹ́ ẹ síbẹ̀.
theological_decisions:
- issue: Ìrísí ọ̀rọ̀-ìṣe àti ẹni tó ṣe iṣẹ́ nínú gbólóhùn nípa àjíǹde
  choice: a ti jí i dìde
  alternative: ó ti jíǹde
  rationale: ἠγέρθη ní ìrísí àìṣe-tààrà. Ìtumọ̀ yìí pa ìrísí yẹn mọ́, ṣùgbọ́n kò dárúkọ Ọlọ́run tàbí ẹlòmíràn gẹ́gẹ́ bí olùṣe, nítorí Gíríìkì kò sọ olùṣe náà níhìn-ín. Àlàyé ìsàlẹ̀ ojú ewé fi ìtumọ̀ àṣà tí ó lo ìrísí olùṣe hàn láìyanjú ẹ̀kọ́ ìsìn náà ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn àṣẹ ‘Ẹ wá, ẹ wo’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ. A yàgò fún ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan pàtó.
