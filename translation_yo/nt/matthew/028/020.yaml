id: MAT.28.20
reference: Matthew 28:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: yo
  text: nípa kíkọ́ wọn láti máa pa gbogbo ohun tí mo pàṣẹ fún yín mọ́. Ẹ sì kíyèsí i, èmi wà pẹ̀lú yín ní gbogbo ọjọ́, títí dé ìparí sànmánì náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títí dé ìparí sànmánì náà.” Ní ìtumọ̀ àtijọ́ kan, “títí dé òpin ayé.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ìmúṣẹ́ sànmánì (αἰών), kì í ṣe ayé ti ara ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: διδάσκοντες
  choice: ní kíkọ́ wọn
  rationale: Ó pa ìṣe alábàápín tí ń tẹ̀ síwájú mọ́, ó sì fi hàn pé kíkọ́ wọn ni ọ̀nà tí iṣẹ́ yíyan ọmọ-ẹ̀yìn fi ń bá a lọ.
- source_word: τηρεῖν
  choice: láti máa pa … mọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí ní ìtumọ̀ pípa àṣẹ mọ́ pẹ̀lú ìgbọ́ràn àti ìṣọ́ra, láì dín un kù sí ṣíṣe ohun ìta lásán.
- source_word: πάντα ὅσα
  choice: gbogbo ohun tí
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ìtumọ̀ gbogbo ohun láìyọ ọ̀kan sílẹ̀ mọ́.
- source_word: ἐνετειλάμην
  choice: mo pa láṣẹ
  rationale: Ó fi agbára àṣẹ Jesu hàn ní èdè Yorùbá tó ṣe kedere, láì mú un le ju bí orísun ṣe sọ lọ.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó fa àfiyèsí olùgbọ́ sí ìlérí tó tẹ̀ lé e, ó sì ní ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ mímọ́ tí ó tún yé òǹkàwé òde òní.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: èmi wà pẹ̀lú yín
  rationale: Ó túmọ̀ wíwà Jesu pẹ̀lú àwọn ọmọ-ẹ̀yìn ní tààràtà; lílo “èmi” tún pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: πάσας τὰς ἡμέρας
  choice: ní gbogbo ọjọ́
  rationale: Ó pa àwòrán ọjọ́ kọ̀ọ̀kan nínú Gíríìkì mọ́, dípò kí a sọ ọ́ di “nígbà gbogbo” lásán.
- source_word: συντελείας
  choice: ìparí
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, “ìparí” jẹ́ èdè Yorùbá àdánidá fún bí sànmánì ṣe dé òpin rẹ̀, ó sì lè gba ìtumọ̀ ìmúṣẹ dé ẹ̀kúnrẹ́rẹ́ tí ọ̀rọ̀ Gíríìkì ní.
- source_word: αἰῶνος
  choice: sànmánì náà
  rationale: “Sànmánì” tọ́ka sí àkókò tàbí epoch, kì í ṣe ayé ti ara ní pàtó; ó yẹra fún ìtumọ̀ pé ilẹ̀ ayé ni a ó pa run.
theological_decisions:
- issue: Ọ̀rọ̀ àkókò ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: títí dé ìparí sànmánì náà
  alternative: títí dé òpin ayé
  rationale: Àṣàyàn náà pa ìtọ́kasí sí ìmúṣẹ àti òpin sànmánì mọ́, láì sọ αἰών di ayé ti ara. Ó tún fi ààyè sílẹ̀ fún ìwọ̀n ìtumọ̀ συντέλεια láàárín “ìparí” àti “ìmúṣẹ dé ẹ̀kúnrẹ́rẹ́.”
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àmì ohùn ni a lò ní kíkún níbi tó bá bá èdè mu; “Sì kíyèsí i” pa ìtẹnumọ́ ἰδού mọ́ láì lo ọ̀rọ̀ àtijọ́ tó ṣòro.
