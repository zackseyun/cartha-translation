id: MAT.28.7
reference: Matthew 28:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: yo
  text: Ẹ sì tètè lọ sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, ‘A ti jí i dìde kúrò láàárín àwọn òkú, ẹ sì kíyèsí, ó ń ṣáájú yín lọ sí Galili; níbẹ̀ ni ẹ ó ti rí i.’ Ẹ kíyèsí, mo ti sọ fún yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ
  choice: tètè
  rationale: Ó fi ìjẹ́kánjú àṣẹ náà hàn ní èdè Yorùbá àdánidá.
- source_word: Ἠγέρθη
  choice: A ti jí i dìde
  rationale: Fọ́ọ̀mù aláìṣe ti Gíríìkì ni a pa mọ́, láì sọ ẹni tó jí i dìde ní kedere.
- source_word: προάγει ὑμᾶς
  choice: ó ń ṣáájú yín lọ
  rationale: Ó mú ìtumọ̀ pé ó lọ níwájú wọn, kì í ṣe pé ó kàn ń darí wọn.
- source_word: ἰδοὺ
  choice: Kíyèsí i
  rationale: Ó jẹ́ ọ̀rọ̀ ìpe àfiyèsí tó níyì, ó sì ṣiṣẹ́ ní ibi méjèèjì bí ó ti rí nínú orísun.
- source_word: ὄψεσθε
  choice: ẹ ó ... rí i
  rationale: Ó tọ́ka sí ohun tí yóò ṣẹlẹ̀ ní ọjọ́ iwájú, ní ọ̀nà tí ó ṣe kedere sí olùkà Yorùbá.
theological_decisions:
- issue: Ẹni tó jí Jésù dìde
  choice: A ti jí i dìde
  alternative: Ó ti jíǹde
  rationale: Orísun lo fọ́ọ̀mù aláìṣe, nítorí náà a kò yí i sí ọ̀rọ̀ tó lè túmọ̀ sí pé Jésù jí ara rẹ̀ dìde tàbí sọ olùṣe náà ní kedere.
- issue: Ìtumọ̀ προάγει
  choice: ó ń ṣáájú yín lọ
  alternative: ó ń darí yín lọ
  rationale: Yíyan ‘ṣáájú’ pa ìrìn Jésù lọ sí Galili níwájú àwọn ọmọ-ẹ̀yìn mọ́, láì fi ìtumọ̀ olùdarí kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí àwọn obìnrin tí a ń bá sọ.
