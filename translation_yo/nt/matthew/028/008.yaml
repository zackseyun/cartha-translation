id: MAT.28.8
reference: Matthew 28:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: yo
  text: Wọ́n sì yára kúrò ní ibojì náà pẹ̀lú ẹ̀rù[a] àti ayọ̀ ńlá, wọ́n sì sáré láti sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ẹ̀rù ìfọ̀wọ̀gbọ̀ àti ayọ̀ ńlá.” Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ Gíríìkì fún “ẹ̀rù” tún lè ní ìtumọ̀ ìbẹ̀rù tí ó ní ìfọ̀wọ̀gbọ̀ jinlẹ̀.
    reason: 'Àṣàyàn ìtumọ̀ ọ̀rọ̀: φόβος lè túmọ̀ sí ẹ̀rù tàbí ẹ̀rù ìfọ̀wọ̀gbọ̀ nínú àyíká yìí.'
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ
  choice: wọ́n yára kúrò
  rationale: A ṣe àkópọ̀ participle ἀπελθοῦσαι àti adverb ταχύ ní ọ̀nà Yorùbá àdánidá; ó fi hàn pé àwọn obìnrin náà fi ibojì sílẹ̀ ní kánjúkánjú.
- source_word: ἀπὸ τοῦ μνημείου
  choice: ní ibojì náà
  rationale: Nínú àyíká ìjíǹde yìí, μνημεῖον ni ibi tí a sin òkú sí; ‘ibojì’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere, ‘náà’ sì tọ́ka sí ibojì tí a ti mẹ́nu kàn.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: pẹ̀lú ẹ̀rù àti ayọ̀ ńlá
  rationale: ‘Pẹ̀lú’ ṣàfihàn ipò tó bá ìṣe wọn rìn. ‘Ẹ̀rù’ pa ìtumọ̀ φόβος àti ìforígbárí tó wà láàárín ẹ̀rù àti ayọ̀ mọ́, láì sọ ọ́ di ọ̀wọ̀ nìkan tàbí ìbẹ̀rù búburú nìkan.
- source_word: ἔδραμον
  choice: wọ́n sáré
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí sísáré gan-an, kì í ṣe kíkànjú lásán; ìtumọ̀ náà pa àwòrán ìṣe tó lágbára mọ́.
- source_word: ἀπαγγεῖλαι
  choice: láti sọ fún
  rationale: Infinitive yìí fi ète sísáré wọn hàn. Gíríìkì kò sọ ohun tí wọ́n ròyìn gẹ́gẹ́ bí object ní tààràtà, nítorí náà a kò fi ‘ó’ tàbí àlàyé míì kún un.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: ‘Ọmọ-ẹ̀yìn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής nínú ìtàn Ìhìn Rere; ‘rẹ̀’ tọ́ka sí Jésù gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
theological_decisions:
- issue: Ìforígbárí ìmọ̀lára nínú ìdáhùn àwọn obìnrin náà
  choice: pẹ̀lú ẹ̀rù àti ayọ̀ ńlá
  alternative: pẹ̀lú ìbẹ̀rù ọlọ́wọ̀ àti ayọ̀ ńlá
  rationale: A pa ẹ̀rù àti ayọ̀ pọ̀ gẹ́gẹ́ bí Gíríìkì ṣe ṣe, láì yanjú φόβος sí ìbẹ̀rù odi nìkan tàbí sí ọ̀wọ̀ ẹlẹ́rù nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìtòlẹ́sẹẹsẹ gbolohun náà jẹ́ àdánidá ní Yorùbá, ó sì pa iyára, ẹ̀rù, ayọ̀, àti ète sísáré wọn mọ́.
