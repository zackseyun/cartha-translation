revisions:
- from: Nítorí náà, wọ́n gba fàdákà náà, wọ́n sì ṣe bí a ti kọ́ wọn. Ìròyìn yìí sì ti tàn ká láàárín àwọn Júù títí di òní yìí.[a]
  to: Wọ́n sì gba fàdákà náà, wọ́n sì ṣe gẹ́gẹ́ bí a ti kọ́ wọn. Ìròyìn yìí sì ti tàn káàkiri láàárín àwọn Júù títí di ọjọ́ òní.[a]
  rationale: Àtúnṣe náà yọ àsopò ìdí-ẹ̀rí tí kò hàn nínú δέ, ó sì mú gbólóhùn ìparí rọrùn, adayeba, àti ìbámu pẹ̀lú ìlò Yorùbá òde òní. Kò yí ìtumọ̀ ẹsẹ náà, ìtọ́ka sí àwọn Júù, tàbí àìdánilójú tí λόγος ní padà.
  reviewer_model: gpt-5.6-terra
