id: MAT.28.15
reference: Matthew 28:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: yo
  text: Wọ́n sì gba fàdákà náà, wọ́n sì ṣe gẹ́gẹ́ bí a ti kọ́ wọn. Ìròyìn yìí sì ti tàn káàkiri láàárín àwọn Júù títí di ọjọ́ òní.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ yìí” tàbí “àlàyé yìí.” Ọ̀rọ̀ Gíríìkì λόγος lè túmọ̀ sí ọ̀rọ̀, ìròyìn, àlàyé, tàbí ìtàn, gẹ́gẹ́ bí àyíká ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: wọ́n gba
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘gba’ tàbí ‘mú.’ Níwọ̀n bí àwọn olórí àlùfáà ti fi owó náà fún wọn ní ẹsẹ tó ṣáájú, ‘wọ́n gba’ fi ìṣe náà hàn lọ́nà àdánidá.
- source_word: τὰ ἀργύρια
  choice: fàdákà náà
  rationale: Ìtumọ̀ gidi rẹ̀ ni fàdákà tàbí owó fàdákà. ‘Fàdákà náà’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ láìfi ‘ẹyọ owó’ kún ohun tí kò sọ ní pàtó.
- source_word: ἐποίησαν
  choice: wọ́n sì ṣe
  rationale: Ó jẹ́ ọ̀rọ̀ ìṣe tó wọ́pọ̀ fún ‘ṣe,’ ó sì so mọ́ gbólóhùn ‘bí a ti kọ́ wọn’ lọ́nà tààrà.
- source_word: ὡς ἐδιδάχθησαν
  choice: bí a ti kọ́ wọn
  rationale: Fọ́ọ̀mù àfaragà ti διδάσκω túmọ̀ sí pé a kọ́ tàbí tọ́ wọn sọ́nà. Nínú àyíká yìí, ó ń tọ́ka sí ohun tí a sọ fún wọn pé kí wọ́n ṣe àti kí wọ́n sọ.
- source_word: διεφημίσθη
  choice: ti tàn ká
  rationale: Ọ̀rọ̀ náà ń sọ nípa ìròyìn tí ó tàn ká sí ọ̀pọ̀ ènìyàn. ‘Ti tàn ká’ tún fi hàn pé ó bẹ̀rẹ̀ nígbà àtijọ́, ipa rẹ̀ sì dé àkókò tí akọ̀wé ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ὁ λόγος οὗτος
  choice: ìròyìn yìí
  rationale: λόγος ní ìtumọ̀ gbòòrò bí ‘ọ̀rọ̀,’ ‘ìròyìn,’ tàbí ‘àkọsílẹ̀.’ Níhìn-ín, ó tọ́ka sí àlàyé tí àwọn olùṣọ́ ń tan ká; ‘ìròyìn’ bá àyíká náà mu, ó sì pa àìdánilójú ìtumọ̀ mọ́ ní àlàyé ìsàlẹ̀.
- source_word: παρὰ Ἰουδαίοις
  choice: láàárín àwọn Júù
  rationale: παρά pẹ̀lú dative níhìn-ín túmọ̀ sí ‘láàárín.’ Ó tọ́ka sí bí ìròyìn náà ṣe ń lọ káàkiri nínú àwùjọ àwọn Júù, kì í ṣe ìdájọ́ gbogbogbò lórí wọn.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: títí di òní yìí
  rationale: Èyí jẹ́ gbólóhùn àṣà tó túmọ̀ sí pé ohun náà ń bá a lọ títí dé àkókò tí akọ̀wé wà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ἰουδαίοις láìmú ìtumọ̀ ìkọlù àwọn Júù wọ inú ẹsẹ náà
  choice: láàárín àwọn Júù
  alternative: láàárín àwọn ará Jùdíà
  rationale: Àyíká náà ń sọ bí ìròyìn ṣe tàn nínú àwùjọ àwọn Júù. ‘Àwọn ará Jùdíà’ lè dín ìtumọ̀ náà kù sí agbègbè ilẹ̀ nìkan, ṣùgbọ́n ọ̀rọ̀ yìí dá lórí àwùjọ; a kò sì gbọ́dọ̀ mú ẹ̀sùn tó kọjá ìtàn Mátíù wọ inú rẹ̀.
translation_notes:
  register: Èdè Yorùbá àtẹ̀wọ́gbà, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘fàdákà’ láti pa ọ̀rọ̀ amúludun orísun mọ́, àti ‘ìròyìn’ fún ìtumọ̀ λόγος tó bá àyíká mu.
