id: MAT.28.1
reference: Matthew 28:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ ìsinmi[a], bí ilẹ̀ ti ń mọ́ sí ọjọ́ kìn-ín-ní ọ̀sẹ̀, Màríà ará Mágádálà àti Màríà mìíràn náà wá láti wo ibojì náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní apá ìkẹyìn ọjọ́ ìsinmi, bí ilẹ̀ ti ń mọ́ sí ọjọ́ kìn-ín-ní ọ̀sẹ̀.” A lè lóye gbólóhùn Gíríìkì tó bẹ̀rẹ̀ ẹsẹ náà sí “lẹ́yìn ọjọ́ ìsinmi” tàbí “ní apá ìkẹyìn ọjọ́ ìsinmi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Lẹ́yìn ọjọ́ ìsinmi
  rationale: ὀψέ pẹ̀lú ọ̀rọ̀ inú genitive lè túmọ̀ sí àkókò lẹ́yìn ohun kan; ní àyíká yìí, ó tọ́ka sí lẹ́yìn tí ọjọ́ ìsinmi parí. σαββάτων jẹ́ ọ̀pọ̀ ní ìrísí, ṣùgbọ́n ó sábà máa ń dúró fún ọjọ́ ìsinmi kan ṣoṣo nínú Gíríìkì àwọn Júù. A kò fi δέ hàn lọ́tọ̀, nítorí àsopọ̀ rẹ̀ rọrùn, Yorùbá sì ń ṣàn dáadáa láìsí ọ̀rọ̀ àfikún.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: bí ilẹ̀ ti ń mọ́
  rationale: Ẹ̀yà ọ̀rọ̀ láti inú ἐπιφώσκω tọ́ka sí ìmọ́lẹ̀ òwúrọ̀ tí ń bẹ̀rẹ̀; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtẹ̀síwájú ìmọ́lẹ̀ òwúrọ̀ mọ́.
- source_word: εἰς μίαν σαββάτων
  choice: sí ọjọ́ kìn-ín-ní ọ̀sẹ̀
  rationale: μίαν σαββάτων jẹ́ àṣà ọ̀rọ̀ Semitic/Gíríìkì fún ọjọ́ àkọ́kọ́ ọ̀sẹ̀. “sí” fi ipa εἰς hàn nínú ìsọ̀rọ̀ nípa ilẹ̀ tí ń mọ́ sí ọjọ́ náà.
- source_word: ἦλθεν
  choice: wá
  rationale: ἔρχομαι nínú ìtàn yìí túmọ̀ sí pé àwọn obìnrin náà wá sí ibi tí a mẹ́nu kàn.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Màríà ará Mágádálà
  rationale: Ọ̀rọ̀ náà ń dá Màríà mọ̀ nípasẹ̀ ibi tó ti wá; “ará Mágádálà” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìdámọ̀ ibi hàn.
- source_word: ἡ ἄλλη Μαρία
  choice: Màríà kejì
  rationale: ἄλλη túmọ̀ sí “òmíràn/ẹni kejì.” Níbi tí Màríà méjì ti wà, “Màríà kejì” jẹ́ ti ẹ̀dá, ó sì yà á sọ́tọ̀ láìfi ìtumọ̀ míì kún un.
- source_word: θεωρῆσαι
  choice: láti wo
  rationale: θεωρέω fi wíwo pẹ̀lú ète hàn. “láti wo” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tí kò sì sọ ìṣe náà di àyẹ̀wò onímọ̀ ju bí orísun ṣe sọ lọ.
- source_word: τὸν τάφον
  choice: ibojì náà
  rationale: τάφος ni ibi tí a sin ẹni sí; “ibojì” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ibi ìsìnkú náà.
theological_decisions:
- issue: Àkókò tí ìtàn àjíǹde bẹ̀rẹ̀
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ lẹ́yìn tí ọjọ́ ìsinmi parí, nígbà tí ilẹ̀ ń mọ́ sí ọjọ́ kìn-ín-ní ọ̀sẹ̀.
  alternative: A lè lóye ìbẹ̀rẹ̀ Gíríìkì náà gẹ́gẹ́ bí “ní ìrọ̀lẹ́ ọjọ́ ìsinmi” tàbí “ní apá ìkẹyìn ọjọ́ ìsinmi.”
  rationale: Ὀψὲ σαββάτων ní ìtumọ̀ méjì tí a ti ń jíròrò. Àpapọ̀ àwọn àmì àkókò inú ẹsẹ náà ṣe àtìlẹ́yìn fún “lẹ́yìn ọjọ́ ìsinmi,” ṣùgbọ́n akọsilẹ̀ ìsàlẹ̀ pa ìtumọ̀ kejì tó ṣeé ṣe mọ́ láìfi ìṣọ̀kan àwọn ìwé Ìhìn Rere lé orísun náà lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè mu. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti ẹ̀dá, ó sì yẹ fún òǹkàwé Yorùbá òde òní. “Ọjọ́ ìsinmi” ṣe kedere ju lílo ọ̀rọ̀ àyálò “Sábáàtì” lọ ní ẹsẹ yìí, nígbà tí “bí ilẹ̀ ti ń mọ́” jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún ìmọ́lẹ̀ òwúrọ̀.
