id: MAT.15.21
reference: Matthew 15:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: yo
  text: Jésù sì jáde kúrò níbẹ̀, ó fà sẹ́yìn lọ sí agbègbè Tírè àti Sídónì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kúrò lọ sí agbègbè Tírè àti Sídónì.” A lè tú ọ̀rọ̀ Gíríìkì náà lọ́nà tí kò fi yíyẹra hàn tó bẹ́ẹ̀, ṣùgbọ́n “fà sẹ́yìn lọ” bá bí Mátíù ṣe sábà máa ń lo ọ̀rọ̀ náà mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ yìí so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: ἐξελθὼν ἐκεῖθεν
  choice: jáde kúrò níbẹ̀
  rationale: Ó fi ìgbésẹ̀ tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn, ó sì pa ìtumọ̀ ibi tí Jésù ti kúrò mọ́.
- source_word: ἀνεχώρησεν
  choice: fà sẹ́yìn lọ
  rationale: Ó pa ìtumọ̀ yíyẹra tàbí fífà sẹ́yìn tí Mátíù sábà máa ń fi ọ̀rọ̀ náà hàn mọ́, láì sọ ìdí tí Jésù fi ṣe bẹ́ẹ̀.
- source_word: εἰς τὰ μέρη
  choice: sí agbègbè
  rationale: Ó tọ́ka sí àgbègbè tó yí àwọn ìlú náà ká, kì í ṣe dandan pé Jésù wọ inú àwọn ìlú náà gan-an.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Tírè àti Sídónì
  rationale: Àwọn orúkọ ibi náà ni a kọ ní ìbámu pẹ̀lú ìpè Yorùbá, wọ́n sì dúró gẹ́gẹ́ bí àfikún tó ń dá agbègbè náà mọ̀.
theological_decisions:
- issue: Ìtumọ̀ ìrìn Jésù lọ sí agbègbè tí àwọn Kèfèrí ní ìbáṣepọ̀ pẹ̀lú
  choice: A tú ἀνεχώρησεν sí “fà sẹ́yìn lọ,” ṣùgbọ́n a kò sọ ìdí kankan fún ìrìn náà.
  alternative: A lè tú u ní ọ̀nà tí kò ní àfikún ìmọ̀lára pé “kúrò lọ,” tàbí ní ọ̀nà tó lágbára jù pé “sá padà.”
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ yíyẹra ní àkọsílẹ̀ Mátíù, ṣùgbọ́n ẹsẹ̀ náà kò sọ ohun tó mú Jésù ṣe bẹ́ẹ̀. Ìtumọ̀ yìí pa ìrísí ìtàn náà mọ́ láì fi èrò ẹ̀kọ́ ìgbàgbọ́ tàbí ìdí inú ọkàn kún un.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó lọ́lá, tó ṣe kedere, tí àwọn òǹkàwé òde òní sì lè lóye. “Fà sẹ́yìn lọ” dá ìyàtọ̀ ọ̀rọ̀-ìṣe Gíríìkì náà pamọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fi ọ̀nà túmọ̀ tó túbọ̀ wà ní àárín hàn.
