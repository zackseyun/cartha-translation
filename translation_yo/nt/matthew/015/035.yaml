  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: yo
  text: Ó sì pàṣẹ fún ọ̀pọ̀ ènìyàn náà láti jókòó sílẹ̀ lórí ilẹ̀,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti gbé ara wọn kalẹ̀ lórí ilẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ipò ẹni fún jíjẹun, ní ọ̀pọ̀ ìgbà pẹ̀lú ìtumọ̀ fífi ara tì sẹ́yìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: Àsopọ̀ ìtàn ni καὶ jẹ́ níhìn-ín; “sì” so ìṣe yìí mọ́ ohun tó ṣáájú lọ́nà àdánidá ní Yorùbá, “Ó” sì mú olùṣe tí a lóye láti inú àyíká ọ̀rọ̀ hàn.
- source_word: παραγγείλας
  choice: pàṣẹ fún
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tó fi ìtọ́nisọ́nà aláṣẹ hàn. Yorùbá kò nílò láti sọ ọ́ ní fọ́ọ̀mù “lẹ́yìn tí”; títẹ̀lé e pẹ̀lú “sì” ṣì pa bí ìṣe náà ṣe ṣáájú ìṣe ẹsẹ tó tẹ̀ lé mọ́.
- source_word: τῷ ὄχλῳ
  choice: ọ̀pọ̀ ènìyàn náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ogunlọ́gọ̀ ènìyàn tí ìtàn ti ń tọ́ka sí.
- source_word: ἀναπεσεῖν
  choice: láti jókòó sílẹ̀
  rationale: Nínú àyíká oúnjẹ, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí gbígba ipò fún jíjẹun, èyí tó lè jẹ́ jíjókòó tàbí fífi ara tì sẹ́yìn. “Jókòó sílẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ tó péye jù mọ́.
- source_word: ἐπὶ τὴν γῆν
  choice: lórí ilẹ̀
  rationale: Ní àyíká yìí γῆ ń tọ́ka sí ilẹ̀ tí wọ́n máa gbé ara lé, kì í ṣe gbogbo ayé; “lórí ilẹ̀” ni ìtumọ̀ Yorùbá tó ṣe kedere.
theological_decisions: []
