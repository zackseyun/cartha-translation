  register: Yorùbá ìgbàlódé tó lọ́lá, tó ṣe kedere fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá bá èdè mu, a sì yàgò fún ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
