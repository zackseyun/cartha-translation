id: MAT.15.20
reference: Matthew 15:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí ni ó ń sọ ènìyàn[a][b] di aláìmọ́; ṣùgbọ́n jíjẹun láì fọ ọwọ́ kì í sọ ènìyàn di aláìmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú ènìyàn di aláìmọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí sísọ ènìyàn di aláìmọ́ ní ti ìlànà ìwẹ̀nùmọ́; níbí, “sọ ... di aláìmọ́” pa àyíká ìwẹ̀nùmọ́ àti ìtumọ̀ ìbàjẹ́ tí ó gbòòrò sí i mọ́.
    reason: lexical_alternative
  - marker: b
    text: “Ènìyàn” jẹ́ ẹyọ kan tí ó dúró fún ẹnikẹ́ni lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: sọ ... di aláìmọ́
  rationale: Nínú ọ̀rọ̀ nípa ìwẹ̀nùmọ́ yìí, gbólóhùn náà túmọ̀ sí mímú kí ènìyàn di aláìmọ́ ní ti ìlànà ẹ̀sìn, ó sì tún lè ní agbára ìtumọ̀ ìbàjẹ́ inú. Yíyan ọ̀rọ̀ kan náà ní ibi méjèèjì pa ìyàtọ̀ tí Jesu ṣe mọ́.
- source_word: ἄνθρωπον
  choice: ènìyàn
  rationale: “Ènìyàn” jẹ́ ọ̀rọ̀ ẹyọ kan tí ó ń dúró fún ẹnikẹ́ni lápapọ̀; ó bá agbára aṣojú ẹyọ kan nínú Gíríìkì mu láì sọ ọ́ di ọ̀pọ̀.
- source_word: ἀνίπτοις χερσὶν
  choice: láì fọ ọwọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ jíjẹun pẹ̀lú ọwọ́ tí a kò fọ, ó sì bá àríyànjiyàn nípa fífọ ọwọ́ gẹ́gẹ́ bí àṣà ẹ̀sìn mu.
- source_word: φαγεῖν
  choice: jíjẹun
  rationale: Orúkọ-ìṣe “jíjẹun” jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì bá infinitive Gíríìkì mu nínú gbólóhùn yìí.
- source_word: ταῦτά ἐστιν τὰ
  choice: Àwọn nǹkan wọ̀nyí ni ó ń
  rationale: Ìtumọ̀ yìí pa ìtẹnumọ́ demonstrative náà mọ́, ó sì jẹ́ Yorùbá òde òní tí ó ṣe kedere.
- source_word: δέ
  choice: ṣùgbọ́n
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ hàn láàárín ohun tí ó ń sọ ènìyàn di aláìmọ́ àti jíjẹun láì fọ ọwọ́.
theological_decisions:
- issue: Ìtumọ̀ κοινόω nínú àríyànjiyàn nípa ìwẹ̀nùmọ́
  choice: sọ ... di aláìmọ́
  alternative: bá ... jẹ́; sọ ... di ẹlẹ́gbin
  rationale: “Sọ ... di aláìmọ́” jẹ́ kí ìtumọ̀ àìmọ́ ní ti àṣà ìwẹ̀nùmọ́ dúró, ṣùgbọ́n kò fi dandan sé e mọ́ sí ìlànà ayẹyẹ nìkan; ní àyíká ẹ̀kọ́ Jesu, ó tún lè tọ́ka sí ìbàjẹ́ ní ti ìwà.
- issue: ἄνθρωπον gẹ́gẹ́ bí ẹyọ kan tí ó dúró fún gbogbo ènìyàn
  choice: ènìyàn
  alternative: ọkùnrin náà; àwọn ènìyàn
  rationale: “Ènìyàn” pa nọ́ńbà ẹyọ mọ́, ó sì sọ òtítọ́ gbogbogbò nípa ẹnikẹ́ni láì yí ọ̀rọ̀ orísun padà sí ọ̀pọ̀ tàbí fi ìtumọ̀ akọ kún un.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa ìtunlo ọ̀rọ̀ Gíríìkì κοινόω mọ́ ní ìdajì méjèèjì, ó sì lo “ènìyàn” gẹ́gẹ́ bí ẹyọ aṣojú àdánidá nínú Yorùbá.
