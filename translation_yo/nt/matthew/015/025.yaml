  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: yo
  text: Ṣùgbọ́n obìnrin náà wá, ó sì kúnlẹ̀ níwájú rẹ̀,[a] ó ń wí pé, “Olúwa, ràn mí lọ́wọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ó sì jọ́sìn fún un.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí títẹrí ba ní ìbọ̀wọ̀, fífi ọlá fún ẹnì kan, tàbí jíjọ́sìn, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: 'Ó fi ìyípadà onírẹ̀lẹ̀ tí ó ní ìtakora hàn: láìka ohun tí a ṣẹ̀ṣẹ̀ sọ sí i, obìnrin náà tẹ̀ síwájú nínú ẹ̀bẹ̀ rẹ̀.'
- source_word: ἐλθοῦσα
  choice: obìnrin náà wá
  rationale: Aorist participle náà di ọ̀rọ̀-ìṣe tí ó bójú mu ní Yorùbá, ó sì pa ìṣípò rẹ̀ tọ Jesu mọ́.
- source_word: προσεκύνει αὐτῷ
  choice: ó sì kúnlẹ̀ níwájú rẹ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífi ara balẹ̀ fún ọlá tàbí jíjọ́sìn. Yíyan ‘kúnlẹ̀ níwájú rẹ̀’ fi ìṣe ara àti ọ̀wọ̀ hàn láìfi dandan pinnu bí òye ẹ̀sìn obìnrin náà ṣe jin tó.
- source_word: λέγουσα
  choice: ó ń wí pé
  rationale: Ó ṣàgbékalẹ̀ ọ̀rọ̀ tààrà obìnrin náà ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ìpe ọ̀wọ̀ àti ìwọ̀n tí κύριος ní ní àyíká yìí mọ́, ó sì bá bí Mátíù ṣe ń lo ọ̀rọ̀ náà mu.
- source_word: βοήθει μοι
  choice: ràn mí lọ́wọ́
  rationale: Ó jẹ́ ẹ̀bẹ̀ kúkúrú, tààrà, àti kánjúkánjú gẹ́gẹ́ bí present imperative Gíríìkì náà.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω sí Jesu
  choice: kúnlẹ̀ níwájú rẹ̀
  alternative: jọ́sìn fún un
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí fífi ara balẹ̀ ní ọ̀wọ̀, fífi ọlá fún ẹnì kan, tàbí jíjọ́sìn. Ọ̀rọ̀ inú ẹsẹ fi ìṣe ara obìnrin náà hàn, ṣùgbọ́n kò yẹ kí ìtumọ̀ pinnu ju ẹ̀rí ọ̀rọ̀ náà lọ; nítorí náà, a fi ‘jọ́sìn fún un’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó ṣeé ṣe.
translation_notes:
  register: Yorùbá àkọ́ṣe tí ó bójú mu, tí ó ní àmì ohùn ní kíkún níbi tí ó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lápapọ̀; ‘ràn mí lọ́wọ́’ pa kúkúrú àti ìkanjú ẹ̀bẹ̀ náà mọ́.
