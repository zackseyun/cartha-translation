id: MAT.15.2
reference: Matthew 15:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: yo
  text: “Èé ṣe tí àwọn ọmọ ẹ̀yìn rẹ fi ń ṣẹ àṣà àwọn àgbà? Nítorí wọn kì í fọ ọwọ́ wọn nígbà tí wọ́n bá ń jẹ búrẹ́dì[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni fífọ ọwọ́ gẹ́gẹ́ bí àṣà àwọn àgbà ṣe béèrè, kì í ṣe ọ̀ràn ìmọ́tótó ojoojúmọ́ lásán.
    reason: cultural_note
  - marker: b
    text: Tàbí, “nígbà tí wọ́n bá ń jẹun”; ọ̀rọ̀ Gíríìkì fún “búrẹ́dì” lè dúró fún oúnjẹ ní gbogbogbòò tàbí fún oúnjẹ ìjẹun kan nígbà mìíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Èé ṣe tí ... fi
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè ìdí ohun kan.
- source_word: οἱ μαθηταί σου
  choice: àwọn ọmọ ẹ̀yìn rẹ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn tí ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tẹ̀ lé e.
- source_word: παραβαίνουσιν
  choice: ń rú
  rationale: ‘Rú’ sọ ìrékọjá tàbí àìgbọ́ràn sí ohun tí a gbà pé ó ní àṣẹ, láìlo èdè òfin tí ó le jù.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: àṣà àtọwọ́dọ́wọ́ àwọn àgbààgbà
  rationale: ‘Àṣà àtọwọ́dọ́wọ́’ fi hàn pé ohun tí a ń sọ ni ìlànà tí a jogún, tí a sì ń fi láti ìran dé ìran; ‘àwọn àgbààgbà’ tọ́ka sí àwọn aṣáájú tàbí aláṣẹ ìgbàanì, kì í ṣe ọjọ́-orí nìkan.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: wọn kì í fọ ọwọ́ wọn
  rationale: Ní Yorùbá, ‘fọ ọwọ́’ ni gbólóhùn àdánidá fún fífọ apá ara yìí; ìsọ̀rí ìṣe àṣà déédéé wà nínú ‘kì í.’
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Ìṣètò ‘nígbà tí ... bá’ mú ìtumọ̀ ìṣẹ̀lẹ̀ tí ó máa ń ṣẹlẹ̀ ní gbogbo ìgbà jáde lọ́nà Yorùbá àdánidá.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: A pa ìtumọ̀ gangan ‘bread’ mọ́; akọsilẹ̀ ẹsẹ̀ ṣàlàyé pé ó tún lè dúró fún oúnjẹ tàbí àsè.
- source_word: ἐσθίωσιν
  choice: ń jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún ìṣe tí ó máa ń ṣẹlẹ̀ lẹ́yìn gbólóhùn ‘nígbà tí ... bá.’
theological_decisions:
- issue: Irú fífọ ọwọ́ tí ẹsẹ̀ náà ń tọ́ka sí
  choice: A sọ pé wọ́n ‘kì í fọ ọwọ́ wọn’ gẹ́gẹ́ bí ara àṣà àtọwọ́dọ́wọ́ àwọn àgbààgbà, láìfi ọ̀rọ̀ ‘ìwẹ̀numọ́ àṣà ẹ̀sìn’ sínú ọ̀rọ̀ pàtàkì.
  alternative: Láti pè é ní fífọ ọwọ́ fún ìwẹ̀numọ́ àṣà ẹ̀sìn tàbí fún ìmọ́tótó lasán.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ so fífọ ọwọ́ pọ̀ mọ́ àṣà àtọwọ́dọ́wọ́ àwọn àgbààgbà, ṣùgbọ́n kò ṣàlàyé rẹ̀ síwájú. Ìtumọ̀ náà pa àìdánilójú yìí mọ́, akọsilẹ̀ sì pèsè àlàyé àṣà tó yẹ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘àṣà àtọwọ́dọ́wọ́’ láti fi agbára ohun tí a jogún hàn, a sì lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá.
