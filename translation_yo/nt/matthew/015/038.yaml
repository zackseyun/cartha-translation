source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: yo
  text: Àwọn tí wọ́n jẹun sì jẹ́ ẹgbẹ̀rún mẹ́rin ọkùnrin, láìka àwọn obìnrin àti àwọn ọmọ sí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yàtọ̀ sí àwọn obìnrin àti àwọn ọmọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Àwọn ọkùnrin tí wọ́n jẹun sì
  rationale: A ṣe àpilẹ̀kọ pẹ̀lú olùṣe ní ọ̀nà àdánidá Yorùbá. “Tí wọ́n jẹun” fi hàn pé jíjẹ náà ti parí nínú àyíká yìí; “sì” sì ń gbé ìsopọ̀ onírẹ̀lẹ̀ tí δέ ní láìsọ ọ́ di ìtakora líle.
- source_word: ἦσαν τετρακισχίλιοι
  choice: jẹ́ ẹgbẹ̀rún mẹ́rin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ iye ẹgbẹ̀rún mẹ́rin pẹ̀lú ọ̀rọ̀ àsopọ̀ ἦσαν.
- source_word: ἄνδρες
  choice: ọkùnrin
  rationale: ἄνδρες tọ́ka sí àwọn ọkùnrin ní pàtó, kì í ṣe gbogbo ènìyàn; fífi “ọkùnrin” sílẹ̀ pa ìyàtọ̀ tí orísun ṣe mọ́.
- source_word: χωρὶς
  choice: láìka ... sí
  rationale: Nínú àyíká ìṣírò yìí, χωρίς túmọ̀ sí pé a kò fi àwọn ẹgbẹ́ tí a mẹ́nu kàn kún iye ẹgbẹ̀rún mẹ́rin náà.
- source_word: γυναικῶν καὶ παιδίων
  choice: àwọn obìnrin àti àwọn ọmọ
  rationale: “Àwọn obìnrin” kò dín γυναικῶν kù sí àwọn aya nìkan, “àwọn ọmọ” sì jẹ́ ìtumọ̀ gbòòrò àti àdánidá fún παιδίων.
theological_decisions:
- issue: Ìlànà ìṣírò tó ya akọ sí ọ̀tọ̀
  choice: Pa “ọkùnrin” mọ́, kí a sì sọ pé a kò ka àwọn obìnrin àti àwọn ọmọ mọ́ iye náà.
  alternative: Lo “ènìyàn” fún gbogbo ẹgbẹ́.
  rationale: Gíríìkì lo ἄνδρες, ó sì mẹ́nu kan àwọn obìnrin àti àwọn ọmọ ní ọ̀tọ̀. “Ènìyàn” yóò pa ìyàtọ̀ gidi inú orísun rẹ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, àti kíkà-rọrùn ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtẹ̀sí gbolóhùn náà jẹ́ àdánidá fún Yorùbá, kò sì fi ìtakora tí δέ kò ní kún un.
