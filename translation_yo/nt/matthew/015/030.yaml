translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A yan àwọn gbólóhùn tó bọ̀wọ̀ fún àwọn tó ní àìlera ara, tí ó sì ṣì pa ìtumọ̀ àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
