id: MAT.15.30
reference: Matthew 15:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: yo
  text: Àwọn ogunlọ́gọ̀ ènìyàn sì tọ̀ ọ́ wá, wọ́n sì mú àwọn tí kò lè sọ̀rọ̀[a], àwọn afọ́jú, àwọn arọ, àwọn tí ọwọ́ tàbí ẹsẹ̀ wọn ní àbùkù[b], àti ọ̀pọ̀ àwọn mìíràn wá. Wọ́n sì gbé wọn kalẹ̀ lẹ́bàá ẹsẹ̀ rẹ̀, ó sì mú wọn láradá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn adití”; ọ̀rọ̀ Gíríìkì náà, κωφούς, lè tọ́ka sí àwọn tí kò gbọ́, àwọn tí kò lè sọ̀rọ̀, tàbí àwọn tí ó ní àwọn méjèèjì, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ọwọ́ tàbí ẹsẹ̀ wọn ti gé tàbí ti bàjẹ́”; ọ̀rọ̀ Gíríìkì náà, κυλλούς, ń tọ́ka ní gbogbogbòò sí àwọn tí ọwọ́ tàbí ẹsẹ̀ wọn ní àìpé, àbùkù, tàbí kò ṣiṣẹ́ dáadáa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ó túmọ̀ sí pé wọ́n sún mọ́ ọn tàbí wọ́n wá bá a; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún ìṣípò wọ́n tọ Jesu wá.
- source_word: ὄχλοι πολλοὶ
  choice: àwọn ogunlọ́gọ̀ ènìyàn
  rationale: Ó fi hàn pé ọ̀pọ̀ ènìyàn wà ní àwọn ìjọ ènìyàn ńlá, ó sì bójú mu ní èdè Yorùbá.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: wọ́n mú ... wá pẹ̀lú wọn
  rationale: Dípò ìtumọ̀ gangan pé ‘wọ́n ní wọn lọ́dọ̀ ara wọn,’ èyí sọ ipa participle náà ní kedere pé àwọn ogunlọ́gọ̀ náà mú àwọn aláìsàn tọ Jesu wá.
- source_word: κωφούς
  choice: àwọn tí kò lè sọ̀rọ̀
  rationale: κωφός lè tọ́ka sí ẹni tí kò gbọ́ràn, ẹni tí kò lè sọ̀rọ̀, tàbí ẹni tí ó ní àwọn méjèèjì; a yan àìlè-sọ̀rọ̀ nínú àkójọ yìí, a sì pa ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τυφλούς
  choice: àwọn afọ́jú
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún τυφλός.
- source_word: χωλούς
  choice: àwọn arọ
  rationale: Ọ̀rọ̀ Yorùbá ṣókí àti àdánidá fún àwọn tí kò lè rìn dáadáa.
- source_word: κυλλούς
  choice: àwọn tí ọwọ́ tàbí ẹsẹ̀ wọn ní àbùkù
  rationale: Ọ̀nà yìí sọ ìfarapa, àìpé, tàbí àìṣiṣẹ́ àwọn ẹ̀yà ara tí κυλλός lè túmọ̀ sí, láìlo ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ tí ó le jù.
- source_word: ἑτέρους πολλούς
  choice: ọ̀pọ̀ àwọn mìíràn
  rationale: Ó pa ìtọ́kasí sí ọ̀pọ̀ àwọn aláìsàn mìíràn tí a kò dárúkọ mọ́.
- source_word: ἔρριψαν
  choice: gbé wọn kalẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ῥίπτω lè túmọ̀ sí ‘jù,’ nínú àyíká yìí ó ń tọ́ka sí fífi àwọn aláìsàn sílẹ̀ níwájú Jesu; ‘gbé wọn kalẹ̀’ kò fi ìkà tí ọ̀rọ̀ Gíríìkì kò fi dandan hàn kún un.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: lẹ́gbẹ̀ẹ́ ẹsẹ̀ rẹ̀
  rationale: Ó tẹ̀ lé àwòrán gangan ti παρά pẹ̀lú accusative pé wọ́n gbé wọn sí ibi tí ó sún mọ́ ẹsẹ̀ Jesu.
- source_word: ἐθεράπευσεν αὐτούς
  choice: ó sì mú wọn láradá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tó sì bójú mu fún ìwòsàn nínú ìtàn Ìhìn Rere.
