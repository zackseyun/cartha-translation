revisions:
- from: 'Nítorí láti inú ọkàn ni àwọn èrò búburú ti ń jáde: ìpànìyàn, panṣágà, ìṣekúṣe ibálòpọ̀, olè jíjà, jíjẹ́rìí èké, àti ọ̀rọ̀ ẹ̀gàn.[a]'
  to: Nítorí láti inú ọkàn ni àwọn èrò búburú, ìpànìyàn, panṣágà, ìṣekúṣe ibálòpọ̀, ìjì, jíjẹ́rìí èké, àti ọ̀rọ̀ ẹ̀gàn ti ń jáde.[a]
  rationale: The revision restores the Greek coordination by making every vice-list item depend on “ti ń jáde,” and replaces the erroneous “olè jíjà” with “ìjì” for thefts. The rendering of βλασφημίαι remains deliberately broad, with its God-directed alternative retained in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory force of γάρ, the heart as the source, and nearly all items in the vice list. However, its colon makes the following nouns appear to explain only “evil thoughts,” whereas the Greek presents every listed item as a coordinated subject of “come out.” “Olè jíjà” is not a natural or accurate rendering of κλοπαί.
  naturalness: Most wording is clear Standard Yorùbá, but “olè jíjà” is unidiomatic. Recasting the whole vice list before “ti ń jáde” is both natural and structurally faithful.
  terminology: “Àwọn èrò búburú,” “ìpànìyàn,” “panṣágà,” “ìṣekúṣe ibálòpọ̀,” “jíjẹ́rìí èké,” and “ọ̀rọ̀ ẹ̀gàn” are suitable. “Ìjì” is the concise, established term for theft/stealing in this list. The footnote appropriately retains the possible God-directed sense of βλασφημίαι without forcing it into the main text.
  issues:
  - severity: medium
    issue: The vice list is syntactically separated from the verb by a colon after “àwọn èrò búburú.”
    rationale: In Greek, διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, and the remaining nouns are all coordinated subjects of ἐξέρχονται. The Yorùbá should place the full list before “ti ń jáde,” rather than treating the rest as an explanation of evil thoughts.
  - severity: high
    issue: “Olè jíjà” for κλοπαί is inaccurate and unnatural.
    rationale: “Jíjà” ordinarily denotes fighting/struggling, not theft. κλοπαί means thefts or acts of stealing; “ìjì” is appropriate Yorùbá.
  revised_text: Nítorí láti inú ọkàn ni àwọn èrò búburú, ìpànìyàn, panṣágà, ìṣekúṣe ibálòpọ̀, ìjì, jíjẹ́rìí èké, àti ọ̀rọ̀ ẹ̀gàn ti ń jáde.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀-òdì sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ ẹ̀gàn sí ènìyàn tàbí ọ̀rọ̀-òdì sí Ọlọ́run, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  revision_rationale: The revision restores the Greek coordination by making every vice-list item depend on “ti ń jáde,” and replaces the erroneous “olè jíjà” with “ìjì” for thefts. The rendering of βλασφημίαι remains deliberately broad, with its God-directed alternative retained in the footnote.
