id: MAT.15.19
reference: Matthew 15:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: yo
  text: Nítorí láti inú ọkàn ni àwọn èrò búburú, ìpànìyàn, panṣágà, ìṣekúṣe ibálòpọ̀, ìjì, jíjẹ́rìí èké, àti ọ̀rọ̀ ẹ̀gàn ti ń jáde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀-òdì sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ ẹ̀gàn sí ènìyàn tàbí ọ̀rọ̀-òdì sí Ọlọ́run, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Nítorí láti inú ọkàn
  rationale: “Nítorí” fi agbára àlàyé γάρ hàn; “láti inú” sì pa àwòrán orísun tí ἐκ ń sọ mọ́. “Ọkàn” jẹ́ ọ̀rọ̀ àdáyébá ní Yorùbá fún inú ènìyàn gẹ́gẹ́ bí orísun èrò àti ìṣe.
- source_word: ἐξέρχονται
  choice: ni ... ti ń jáde
  rationale: Èyí túmọ̀ sí pé àwọn ohun náà ń jáde láti inú orísun kan, ó sì bá ìlò Yorùbá mu.
- source_word: διαλογισμοὶ πονηροί
  choice: àwọn èrò búburú
  rationale: Ó pa ìtumọ̀ gbogbogbò ti èrò, ìrònú, tàbí ìgbèrò búburú mọ́ láì fi dandan sọ pé gbogbo wọn jẹ́ àrékérekè tí a ti pète.
- source_word: φόνοι
  choice: ìpànìyàn
  rationale: Ọ̀rọ̀ yìí sọ pípa ènìyàn lọ́nà ẹ̀ṣẹ̀, kì í ṣe gbogbo irú pípa láìsí ìyàtọ̀.
- source_word: μοιχεῖαι
  choice: panṣágà
  rationale: “Panṣágà” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìbálòpọ̀ tí ó rú ìdè ìgbéyàwó.
- source_word: πορνεῖαι
  choice: ìṣekúṣe ibálòpọ̀
  rationale: Yíyan ọ̀rọ̀ yìí mú kí ìtumọ̀ gbígbòòrò ti ìwà ibálòpọ̀ tí kò tọ́ hàn, dípò fífi í mọ́ irú kan ṣoṣo.
- source_word: κλοπαί
  choice: olè jíjà
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì rọrùn fún òǹkàwé òde òní láti lóye gẹ́gẹ́ bí jíjí ohun ẹlòmíràn.
- source_word: ψευδομαρτυρίαι
  choice: jíjẹ́rìí èké
  rationale: Ó pa ìṣe jíjẹ́rìí ohun tí kì í ṣe òótọ́ mọ́, pẹ̀lú ìfarahàn òfin tàbí ẹ̀rí tí ọ̀rọ̀ Gíríìkì lè ní.
- source_word: βλασφημίαι
  choice: ọ̀rọ̀ ẹ̀gàn
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí sísọ̀rọ̀ burúkú sí ènìyàn tàbí sí Ọlọ́run. “Ọ̀rọ̀ ẹ̀gàn” pa ìtumọ̀ gbogbogbò mọ́, a sì fi ìtumọ̀ tó dojú kọ Ọlọ́run sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ βλασφημίαι nínú àkójọ̀ àwọn ohun búburú
  choice: ọ̀rọ̀ ẹ̀gàn
  alternative: ọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ jẹ́ àkójọ̀ ìwà búburú lápapọ̀, kò sì sọ ẹni tí ọ̀rọ̀ náà dojú kọ ní pàtó. Nítorí náà, a pa àìdájú inú ọ̀rọ̀ Gíríìkì mọ́ nípa yíyan ọ̀rọ̀ gbogbogbò, a sì sọ ìtumọ̀ mìíràn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà níyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo àwọn ọ̀rọ̀ àìlórúkọ tó jẹ́ ti àkójọ̀, bí Gíríìkì ṣe ṣe é, bí ó tilẹ̀ jẹ́ pé Yorùbá kì í fi ọ̀pọ̀ hàn lórí gbogbo irú ọ̀rọ̀ bẹ́ẹ̀.
