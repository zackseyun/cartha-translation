  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: yo
  text: 'Ẹ̀yin agabagebe, Aísáyà sọ àsọtẹ́lẹ̀ nípa yín lọ́nà tó tọ́ pé:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ẹ̀yin alágàbàgebè
  rationale: Ọ̀rọ̀ náà jẹ́ àkọ́lé ìpè ní ọ̀pọ̀ ènìyàn, ó sì jẹ́ ìbáwí líle sí àwọn tí ìrísí òde wọn kò bá ohun inú wọn mu. “Ẹ̀yin” mú ìpè tààrà náà hàn ní Yorùbá.
- source_word: καλῶς
  choice: ní ẹ̀tọ́
  rationale: Ó túmọ̀ sí pé àsọtẹ́lẹ̀ Àìsáyà bá wọn mu, ó sì jẹ́ òtítọ́ nípa wọn; èyí jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐπροφήτευσεν
  choice: sọ àsọtẹ́lẹ̀
  rationale: Èyí pa ìtumọ̀ iṣẹ́ wòlíì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún pípa àsọtẹ́lẹ̀ sọ.
- source_word: περὶ ὑμῶν
  choice: nípa yín
  rationale: Ó pa ìtumọ̀ περί pẹ̀lú ọ̀rọ̀-orúkọ ní ipò genitive mọ́ gẹ́gẹ́ bí ‘nípa’ tàbí ‘ní ti’ àwọn tí Jésù ń bá sọ̀rọ̀.
- source_word: Ἠσαΐας
  choice: Àìsáyà
  rationale: Èyí ni ìkọ̀wé orúkọ wòlíì Isaiah tí ó wọ́pọ̀ ní Yorùbá.
- source_word: λέγων
  choice: 'pé:'
  rationale: Nínú Yorùbá, “pé” ń ṣí ọ̀rọ̀ tí a óò fa yọ lọ́nà àdánidá; àmì méjì náà fi hàn pé ọ̀rọ̀ àyọlò ń bọ̀.
theological_decisions:
- issue: Agbára ìbáwí tí Jésù fi pè àwọn olùgbọ́ rẹ̀
  choice: 'Ìpè tààrà àti ìdálẹ́bi líle: “Ẹ̀yin alágàbàgebè”'
  alternative: Ọ̀rọ̀ tí a rọ̀ bí “ẹ̀yin afẹnujẹ” tàbí “ẹ̀yin aláfarawé”
  rationale: ὑποκριταί jẹ́ ẹ̀sùn ìwà àti ẹ̀sìn tó lágbára nínú àyíká yìí. “Alágàbàgebè” pa ìlòdì láàárín ìrísí òde àti òtítọ́ inú mọ́ láìrọ ìbáwí náà.
- issue: Ìtumọ̀ καλῶς nínú ìbáṣepọ̀ àsọtẹ́lẹ̀ Àìsáyà sí àwọn olùgbọ́
  choice: “ní ẹ̀tọ́”
  alternative: “dáradára” tàbí “ní àṣepé”
  rationale: “Ní ẹ̀tọ́” fi hàn pé àsọtẹ́lẹ̀ náà jẹ́ òtítọ́, ó sì bá àwọn tí Jésù ń bá sọ̀rọ̀ mu, láìfi ìtumọ̀ míì tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá àjọṣe tí ó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa bí ìbáwí náà ṣe kúkurú tó sì lágbára mọ́.
