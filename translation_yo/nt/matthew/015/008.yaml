  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: yo
  text: 'Àwọn ènìyàn yìí fi ètè wọn bọ̀wọ̀ fún mi,

    ṣùgbọ́n ọkàn wọn[a] jìnnà sí mi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì ní “ọkàn” ní ẹyọ; ó ṣeé ṣe kó dúró fún ọkàn gbogbo àwọn ènìyàn náà ní àpapọ̀. A tún lè lóye rẹ̀ sí “ọkàn wọn kọ̀ọ̀kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Àwọn ènìyàn yìí
  rationale: Ó túmọ̀ sí ẹgbẹ́ ènìyàn kan ní àpapọ̀. Fífi “yìí” sí i pa agbára ọ̀rọ̀ atọ́ka οὗτος mọ́, “àwọn ènìyàn” sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τοῖς χείλεσίν
  choice: fi ètè wọn
  rationale: “Fi” fi iṣẹ́ dative ohun èlò hàn, “ètè” sì pa àwòrán ẹ̀yà ara tí Gíríìkì lò mọ́ dípò yíyí i sí “ọ̀rọ̀” tàbí “ẹnu.”
- source_word: τιμᾷ
  choice: bọ̀wọ̀ fún
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ọlá tàbí ọ̀wọ̀ fún ẹnì kan; “bọ̀wọ̀ fún” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àyíká yìí mu.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ṣùgbọ́n ọkàn wọn
  rationale: “Ṣùgbọ́n” mú ìtakora δέ jáde. “Ọkàn wọn” pa ẹyọ ọ̀rọ̀ Gíríìkì καρδία mọ́, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí ọkàn àpapọ̀ gbogbo àwọn ènìyàn náà ní Yorùbá.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: jìnnà sí mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé àti àdánidá láti fi hàn pé ọkàn wọn wà ní ọ̀nà jíjìn sí ẹni tó ń sọ̀rọ̀, ní ti ìbáṣepọ̀.
theological_decisions:
- issue: Ṣé a ó pa “ọkàn” tó jẹ́ ẹyọ mọ́, tàbí kí a sọ ọ́ di ọ̀pọ̀?
  choice: 'Pa ẹyọ mọ́: “ọkàn wọn.”'
  alternative: “àwọn ọkàn wọn” tàbí “ọkàn wọn kọ̀ọ̀kan.”
  rationale: Gíríìkì lo καρδία ní ẹyọ, ó ṣeé ṣe kó ń wo gbogbo àwọn ènìyàn náà gẹ́gẹ́ bí ẹgbẹ́ kan tó ní ìṣarasíhùwà inú kan. “Ọkàn wọn” pa ìtumọ̀ àpapọ̀ yìí mọ́ láì fi ipa yan ìtumọ̀ ẹni kọ̀ọ̀kan; ó tún jẹ́ gbólóhùn àdánidá ní Yorùbá.
translation_notes:
  register: Yorùbá àkànṣe òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà ní iyì, ó rọrùn fún òǹkàwé lásán, ó sì pa àwòrán “ètè” àti “ọkàn” inú orísun mọ́.
