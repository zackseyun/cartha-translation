id: MAT.15.27
reference: Matthew 15:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: yo
  text: Obìnrin náà sì wí pé, “Bẹ́ẹ̀ ni, Olúwa[b], nítorí àwọn ajá kéékèèké[a] pàápàá ń jẹ àwọn èérún tí ń jábọ́ láti orí tábìlì àwọn ọ̀gá wọn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ajá,” “àwọn ajá inú ilé,” tàbí “àwọn ọmọ ajá.” Ọ̀rọ̀ Gíríìkì náà wà ní ìrísí ìkẹ́rẹ́, ó sì lè tọ́ka sí àwọn ajá kéékèèké tí a ń tọ́ sínú ilé.
    reason: lexical_alternative
  - marker: b
    text: A tún lè lóye “Olúwa” gẹ́gẹ́ bí ìpè ọlọ́wọ̀, ìyẹn, “Ọ̀gá”; ṣùgbọ́n “Olúwa” pa ìtumọ̀ κύριος tí a sábà máa ń lò nínú àwọn Ìhìn Rere mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó jẹ́ ìdáhùn ìfọ̀wọ́sí tó ṣe déédé, ó sì fi hàn pé obìnrin náà gba ọ̀rọ̀ Jesu láti fi tẹ̀ síwájú nínú ìbéèrè rẹ̀.
- source_word: κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ àkọ́kọ́ κύριος mọ́, ó sì lè ní ìtumọ̀ ọ̀wọ̀ nínú ọ̀rọ̀ ìpè ní tààrà, láìpa ìtumọ̀ tó jinlẹ̀ sí i nípa ọlá-àṣẹ Jesu rẹ́.
- source_word: καὶ γὰρ
  choice: nítorí ... pàápàá
  rationale: Àkójọpọ̀ yìí ní agbára àlàyé (“nítorí”) àti ti ìfikún tó tẹnumọ́ ohun tí kò yẹ ká gbàgbé (“pàápàá”). Ó fi ìrònú obìnrin náà hàn pé àpẹẹrẹ náà fúnra rẹ̀ ń ṣètìlẹ́yìn fún ẹ̀bẹ̀ rẹ̀.
- source_word: κυνάρια
  choice: àwọn ajá kéékèèké
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ fọ́ọ̀mù afẹ́sẹ̀-kéré, tó lè tọ́ka sí àwọn ajá kéékèèké tàbí ajá inú ilé. Ìtumọ̀ yìí pa àbùdá náà mọ́ láìsọ ọ́ di “ọmọ ajá” nìkan.
- source_word: ἐσθίει
  choice: ń jẹ
  rationale: Ó sọ ìṣe tí ó máa ń ṣẹlẹ̀ ní gbogbogbòò. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní ẹyọ, kókó ọ̀rọ̀ rẹ̀ jẹ́ ọ̀pọ̀ nínú èdè Yorùbá.
- source_word: ψιχίων
  choice: àwọn èérún
  rationale: “Èérún” jẹ́ ọ̀rọ̀ àdánidá fún àwọn ẹ̀gẹ̀ oúnjẹ kéékèèké tó ń jábọ́ láti orí tábìlì.
- source_word: τῶν πιπτόντων
  choice: tí ń jábọ́
  rationale: Ó pa ìtumọ̀ participle ìsinsìnyí mọ́ gẹ́gẹ́ bí ìṣe tó ń ṣẹlẹ̀ tàbí àṣà gbogbogbòò.
- source_word: τραπέζης
  choice: tábìlì
  rationale: Èyí ni ìtumọ̀ ojoojúmọ́ tí ó bá àwòrán ilé àti àkókò jíjẹun mu.
- source_word: τῶν κυρίων αὐτῶν
  choice: àwọn ọ̀gá wọn
  rationale: Níhìn-ín κύριος ń tọ́ka sí àwọn tó ni tàbí tó ń ṣe àkóso ajá inú àpẹẹrẹ náà. “Àwọn ọ̀gá wọn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tó sì pa ìtumọ̀ ọlá-àṣẹ mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριε nígbà tí obìnrin náà ń bá Jesu sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ààyè sílẹ̀ fún ìpè ọlọ́wọ̀ àti fún ìmọ̀ nípa ọlá-àṣẹ Jesu; “Ọ̀gá” lè mú kí ìtumọ̀ náà jẹ́ ti ìwà ọmọlúwàbí nìkan.
- issue: Bí a ṣe máa fi agbára afẹ́sẹ̀-kéré κυνάρια hàn
  choice: àwọn ajá kéékèèké
  alternative: àwọn ajá; àwọn ajá inú ilé; àwọn ọmọ ajá
  rationale: Yíyan “àwọn ajá kéékèèké” pa ẹ̀yà ọ̀rọ̀ Gíríìkì náà mọ́, kò mú àpẹẹrẹ náà le ju bí ó ti rí lọ, bẹ́ẹ̀ ni kò sọ ọ́ di àlàyé ẹ̀kọ́ ìsìn.
translation_notes:
  register: A lo èdè Yorùbá àpéjọ tó bójú mu, tó níyì, tó sì rọrùn fún òǹkàwé òde òní. “Obìnrin náà sì wí pé” pa ìyípadà kókó ọ̀rọ̀ Gíríìkì mọ́; “ń jábọ́ láti orí tábìlì” sì jẹ́ àwòrán ilé tó ṣe kedere. Àmì àlàyé [a] wà lẹ́gbẹ̀ẹ́ “àwọn ajá kéékèèké,” ibi tí àlàyé náà kan ní tààrà.
