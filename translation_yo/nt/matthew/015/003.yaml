id: MAT.15.3
reference: Matthew 15:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn, ó ní, “Èé ṣe tí ẹ̀yin pẹ̀lú fi ń rú àṣẹ Ọlọ́run nítorí àṣà ìbílẹ̀ yín?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dá wọn lóhùn, ó ní
  rationale: Èyí mú apá méjèèjì—‘dáhùn’ àti ‘sọ’—wá sínú Yorùbá àdánidá, ó sì pa ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Διὰ τί
  choice: Èé ṣe
  rationale: Ọ̀nà Yorùbá àdánidá láti béèrè ìdí ni.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin pẹ̀lú
  rationale: Ó pa ìtumọ̀ ‘you also/you too’ mọ́, ní ìbámu pẹ̀lú ẹ̀sùn tí wọ́n ṣẹ̀ṣẹ̀ mú wá.
- source_word: παραβαίνετε
  choice: ń rú
  rationale: ‘Rú òfin’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún fífi òfin sílẹ̀ tàbí ṣíṣe lòdì sí i, ó sì bá ìtumọ̀ παραβαίνω mu.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: òfin Ọlọ́run
  rationale: ‘Òfin Ọlọ́run’ jẹ́ èdè Yorùbá tó mọ́gbọ́n dání fún àṣẹ tí Ọlọ́run pa, ó sì dá ìyàtọ̀ rẹ̀ sí àṣà ènìyàn dúró.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: nítorí àṣà àtọwọ́dọ́wọ́ yín
  rationale: διά pẹ̀lú accusative ń tọ́ka sí ìdí tàbí ohun tí ó fà á; ‘àṣà àtọwọ́dọ́wọ́’ sọ ohun tí a fi ń sọ̀kalẹ̀ láti ọ̀dọ̀ àwọn àgbà di mímọ̀ láìfi kún un pé gbogbo àṣà bẹ́ẹ̀ burú.
theological_decisions:
- issue: Ìyàtọ̀ láàárín àṣẹ Ọlọ́run àti àṣà ènìyàn
  choice: òfin Ọlọ́run … àṣà àtọwọ́dọ́wọ́ yín
  alternative: àṣẹ Ọlọ́run … ẹ̀kọ́ yín; òfin Ọlọ́run … àṣà yín
  rationale: 'Ìtumọ̀ yìí pa ìkọlù tààrà tí Jésù ṣe mọ́: àṣà kan pàtó tí wọ́n jogún ni wọ́n fi ń rú ohun tí Ọlọ́run pa láṣẹ. Kò sọ pé gbogbo àṣà àtọwọ́dọ́wọ́ ni ó burú.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. ‘Ó dá wọn lóhùn, ó ní’ jẹ́ àdánidá ju títú ‘answered and said’ ní ọ̀rọ̀-lẹ́-ọ̀rọ̀ lọ; ‘ń rú òfin’ sì jẹ́ gbolohun tí òǹkàwé Yorùbá òde òní yóò lóye ní kedere.
