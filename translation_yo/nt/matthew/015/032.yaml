id: MAT.15.32
reference: Matthew 15:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: yo
  text: Nígbà náà, Jésù pe àwọn ọmọ-ẹ̀yìn rẹ̀ sí ọ̀dọ̀ rẹ̀, ó sì wí pé, “Àánú ogunlọ́gọ̀ ènìyàn náà ṣe mí[a], nítorí pé ọjọ́ mẹ́ta ni wọ́n ti wà pẹ̀lú mi[b], wọn kò sì ní ohun tí wọn yóò jẹ. Èmi kò sì fẹ́ rán wọn lọ ní ebi[c], kí wọ́n má bàa dákú lójú ọ̀nà[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo ní àánú ogunlọ́gọ̀ ènìyàn náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ti dúró pẹ̀lú mi fún ọjọ́ mẹ́ta.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “láìjẹun” tàbí “ní ààwẹ̀”; níbí, ó ń sọ pé wọn kò rí oúnjẹ jẹ, kì í ṣe pé wọ́n ń ṣe ààwẹ̀ ẹ̀sìn.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “kí wọ́n má bàa rẹ̀wẹ̀sì lójú ọ̀nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: pe àwọn ọmọ-ẹ̀yìn rẹ̀ sọ́dọ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù pe àwọn ọmọ-ẹ̀yìn náà sí ọ̀dọ̀ ara rẹ̀; “sọ́dọ̀” pa ìtọ́sọ́nà ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: Σπλαγχνίζομαι
  choice: Àánú àwọn ènìyàn wọ̀nyí ṣe mí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyọ́nú jíjinlẹ̀ tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí.
- source_word: ὄχλον
  choice: àwọn ènìyàn wọ̀nyí
  rationale: Nínú ìtàn yìí, gbólóhùn náà túmọ̀ sí ọ̀pọ̀ ènìyàn tí ó péjọ; yíyan ọ̀rọ̀ yìí dára ju lílo ọ̀rọ̀ tí kò wọ́pọ̀ fún “ogunlọ́gọ̀” lọ nínú àsọyé Jésù.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: ọjọ́ mẹ́ta ni wọ́n ti wà pẹ̀lú mi
  rationale: Ó pa ìtumọ̀ pé wọ́n ń bá a dúró títí di ọjọ́ kẹta mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe déédéé.
- source_word: τί φάγωσιν
  choice: ohun tí wọn yóò jẹ
  rationale: Pẹ̀lú ọ̀rọ̀ òdì “wọn kò ní,” èyí sọ ní kedere pé wọn kò ní oúnjẹ.
- source_word: ἀπολῦσαι
  choice: rán wọn lọ
  rationale: Nínú àyíká yìí, ó túmọ̀ sí jíjẹ́ kí àwọn tí ó péjọ̀ tú ká kí wọ́n sì lọ.
- source_word: νήστεις
  choice: ní ebi
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí “láìjẹun” tàbí “ní ààwẹ̀,” àyíká yìí ń sọ nípa àìní oúnjẹ, kì í ṣe ààwẹ̀ ẹ̀sìn.
- source_word: μήποτε ἐκλυθῶσιν
  choice: kí wọn má bàa rẹ̀wẹ̀sì
  rationale: Gbólóhùn náà fi ohun tí Jésù bẹ̀rù pé ó lè ṣẹlẹ̀ hàn, ìyẹn pé agbára wọn lè tán tàbí kí wọ́n dákú lójú ọ̀nà.
- source_word: ἐν τῇ ὁδῷ
  choice: lójú ọ̀nà
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe àdánidá fún ìrìn-àjò wọn.
theological_decisions:
- issue: Bóyá νήστεις ń tọ́ka sí ààwẹ̀ ẹ̀sìn
  choice: ní ebi
  alternative: ní ààwẹ̀ / láìjẹun
  rationale: Àyíká ọ̀rọ̀ náà sọ pé wọn kò ní ohun tí wọn yóò jẹ, nítorí náà a kò gbọ́dọ̀ fi èrò ààwẹ̀ ẹ̀sìn sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán láti lóye. A lo “Àánú … ṣe mí” gẹ́gẹ́ bí àṣàyàn àdánidá fún ìyọ́nú jíjinlẹ̀, a sì ṣàlàyé àwọn ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
