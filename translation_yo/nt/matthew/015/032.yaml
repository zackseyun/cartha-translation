    rationale: ὄχλον jẹ́ orúkọ àpapọ̀ fún ẹgbẹ́ ènìyàn tí ó péjọ. Àṣàyàn tí a túnṣe ń dá ìtumọ̀ yìí dúró ní Yorùbá òde òní.
