    rationale: προσκαλεσάμενος fi hàn pé Jésù pè wọ́n sí ọ̀dọ̀ ara rẹ̀. Ní Yorùbá, “sí ọ̀dọ̀ rẹ̀” ni ọ̀nà tí ó pé, tí ó sì yé gágá.
  - severity: low
    issue: “rẹ̀wẹ̀sì” lè túmọ̀ sí àìlera tàbí ìrẹ̀wẹ̀sì lásán.
    rationale: ἐκλυθῶσιν nínú ọ̀rọ̀ yìí tọ́ka sí dídákú/fífọ̀rọ̀ rọ̀ nítorí ebi ní ọ̀nà. “Dákú” ń fi ewu tí Jésù ń fẹ́ yẹra fún hàn kedere.
  - severity: low
