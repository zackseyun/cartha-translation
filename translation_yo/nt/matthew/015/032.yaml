- from: Nígbà náà ni Jésù pe àwọn ọmọ-ẹ̀yìn rẹ̀ sọ́dọ̀, ó sì wí pé, “Àánú àwọn ènìyàn wọ̀nyí ṣe mí[a], nítorí pé ọjọ́ mẹ́ta ni wọ́n ti wà pẹ̀lú mi[b], wọn kò sì ní ohun tí wọn yóò jẹ. Èmi kò sì fẹ́ rán wọn lọ ní ebi[c], kí wọn má bàa rẹ̀wẹ̀sì lójú ọ̀nà[d].”
  to: Nígbà náà, Jésù pe àwọn ọmọ-ẹ̀yìn rẹ̀ sí ọ̀dọ̀ rẹ̀, ó sì wí pé, “Àánú ogunlọ́gọ̀ ènìyàn náà ṣe mí[a], nítorí pé ọjọ́ mẹ́ta ni wọ́n ti wà pẹ̀lú mi[b], wọn kò sì ní ohun tí wọn yóò jẹ. Èmi kò sì fẹ́ rán wọn lọ ní ebi[c], kí wọ́n má bàa dákú lójú ọ̀nà[d].”
  rationale: Àtúnṣe náà ṣàfikún “rẹ̀” lẹ́yìn “sí ọ̀dọ̀” láti pa ìtọ́sọ́nà sí Jésù mọ́. Ó tún lo “ogunlọ́gọ̀ ènìyàn náà” fún ὄχλον àti “dákú” fún ἐκλυθῶσιν, nígbà tí àwọn àṣàyàn tí ó bójú mu wà nínú àwọn àlàyé ìsàlẹ̀. Gbogbo àwọn àmì àlàyé ìsàlẹ̀ wà ní ipò tí ó tọ́, a kò sì yí ìtumọ̀ ẹsẹ̀ náà padà.
