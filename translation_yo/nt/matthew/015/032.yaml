  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbòò: ìyọ́nú Jésù, ọjọ́ mẹ́ta tí ogunlọ́gọ̀ ènìyàn náà ti wà pẹ̀lú rẹ̀, àìní oúnjẹ, àti ìbẹ̀rù pé wọ́n lè dákú lójú ọ̀nà. Ṣùgbọ́n “pe ... sọ́dọ̀” nílò “rẹ̀” láti sọ ibi tí wọ́n ti pé wọn sí ní kedere, àti “dákú” ṣàfihàn ἐκλυθῶσιν dájú ju “rẹ̀wẹ̀sì” lọ nínú ọ̀rọ̀ yìí.'
  naturalness: “Pe àwọn ọmọ-ẹ̀yìn rẹ̀ sí ọ̀dọ̀ rẹ̀” jẹ́ Yorùbá boṣewa tí ó pé. “Ogunlọ́gọ̀ ènìyàn náà” ń mú ìtumọ̀ àpapọ̀ ti ὄχλον hàn ní ti ẹ̀dá, láì yi ìtumọ̀ padà. “Dákú lójú ọ̀nà” jẹ́ ìfihàn adayeba fún dídákú tàbí fífọ̀rọ̀ rọ̀ ní ìrìnàjò.
  terminology: A pa “Jésù,” “àánú,” “ọmọ-ẹ̀yìn,” “oúnjẹ,” àti “ní ebi” mọ́. Àlàyé ìsàlẹ̀ fún νήστεις ń ṣọ́ ìtumọ̀ náà kúrò nínú ìmọ̀ ààwẹ̀ ẹ̀sìn, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ náà.
  issues:
