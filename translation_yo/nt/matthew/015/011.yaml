id: MAT.15.11
reference: Matthew 15:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: yo
  text: Kì í ṣe ohun tí ó wọ inú ẹnu ni ó ń sọ ènìyàn di aláìmọ́[a], ṣùgbọ́n ohun tí ó jáde láti ẹnu—èyí ni ó ń sọ ènìyàn di aláìmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń sọ ènìyàn di ẹni aláìmọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímú kí ènìyàn di aláìmọ́ ní ti ìwẹ̀mọ́ ẹ̀sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: sọ … di aláìmọ́
  rationale: Ọ̀rọ̀ yìí fi hàn pé ohun kan mú kí ènìyàn di aláìmọ́ ní ìtumọ̀ ìwẹ̀mọ́ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Ọlọ́run; ó ju ìdọ̀tí ara lásán lọ.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ohun tí ó wọ ẹnu
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ participle tí a lò gẹ́gẹ́ bí orúkọ, ó sì pa àwòrán ohun tí ń wọ inú ẹnu mọ́.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ohun tí ó ti ẹnu jáde
  rationale: Gbólóhùn yìí túmọ̀ ìṣípòpadà láti inú ẹnu sí òde ní èdè Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ἄνθρωπον
  choice: ènìyàn
  rationale: Ní Yorùbá, “ènìyàn” ni ọ̀rọ̀ àdánidá fún ẹ̀dá ènìyàn kan, kò sì fi ìyàtọ̀ akọ tàbí abo tí ọ̀rọ̀ Gíríìkì nínú àyíká yìí kò ń tẹnumọ́ sí i.
- source_word: τοῦτο
  choice: èyí
  rationale: 'A sọ ọ́ ní gbangba láti pa ìtẹnumọ́ Gíríìkì mọ́: ohun tí ó ti ẹnu jáde gan-an ni ó ń sọ ènìyàn di aláìmọ́.'
- source_word: οὐ … ἀλλὰ
  choice: Kì í ṣe … ṣùgbọ́n …
  rationale: Èyí ni ìṣètò ìtakora Yorùbá tó ṣe kedere, tí ó sì bá ìtakora inú Gíríìkì mu.
theological_decisions:
- issue: Èdè ìwẹ̀mọ́ inú κοινόω
  choice: sọ ènìyàn di aláìmọ́
  alternative: ba ènìyàn jẹ́
  rationale: “Di aláìmọ́” pa ìtumọ̀ àìmọ́ nípa ẹ̀sìn àti ìwà mọ́ láì dín ọ̀rọ̀ náà kù sí ìdọ̀tí ara tàbí sí àṣà ìwẹ̀mọ́ nìkan.
- issue: Ìtumọ̀ aṣojú ti ἄνθρωπον
  choice: ènìyàn
  alternative: ọkùnrin náà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ ọ̀rọ̀, ó ń dúró fún ẹ̀dá ènìyàn lápapọ̀ níbí. Yorùbá “ènìyàn” pa ẹyọ ọ̀rọ̀ àti agbára aṣojú náà mọ́ láì dá ìtumọ̀ akọ tí àyíká kò béèrè sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “kì í ṣe … ṣùgbọ́n …” fún ìtakora, a sì tún “sọ ènìyàn di aláìmọ́” ṣe ní ìparí láti pa àtúnṣe àti ìtẹnumọ́ Gíríìkì mọ́.
