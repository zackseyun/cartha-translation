  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: yo
  text: Ṣùgbọ́n ó dáhùn pé[a], “A rán mi sí àwọn àgùntàn ilé Ísírẹ́lì tí ó sọnù nìkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títúmọ̀ ọ̀rọ̀ náà ní tààrà sí i, “A kò rán mi bí kò ṣe sí àwọn àgùntàn ilé Ísírẹ́lì tí ó sọnù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ó dáhùn pé
  rationale: Ọ̀rọ̀ yìí tú àkópọ̀ participle àti ọ̀rọ̀-ìṣe inú Gíríìkì jáde ní Yorùbá àdánidá, ó sì fi hàn pé Jésù ń dáhùn.
- source_word: Οὐκ ἀπεστάλην
  choice: a rán mi
  rationale: Àpẹẹrẹ passive aorist náà ń sọ nípa iṣẹ́ tàbí àṣẹ tí a fi rán Jésù; ‘a rán mi’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ passive yìí.
- source_word: εἰ μὴ
  choice: nìkan
  rationale: Nínú àkópọ̀ Οὐκ … εἰ μὴ, ọ̀rọ̀ náà fi ààlà hàn. Gbólóhùn tí a yí padà sí ‘… nìkan ni a rán mi sí’ pa ìtumọ̀ ìyàsọ́tọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: πρόβατα
  choice: àwọn àgùntàn
  rationale: Ó pa àwòrán àgùntàn inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, dípò kí a tú u sí ‘àwọn ènìyàn.’
- source_word: ἀπολωλότα
  choice: tí ó sọnù
  rationale: Ó bá àwòrán àwọn àgùntàn tí ó ṣìnà mu, láì sọ ọ́ di ìparun tí kò ṣeé yí padà.
- source_word: οἴκου Ἰσραήλ
  choice: ilé Ísírẹ́lì
  rationale: Ó pa àṣà ọ̀rọ̀ Bíbélì àti ìtumọ̀ ẹ̀yà-orílẹ̀-èdè inú gbólóhùn náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà àti ìtakora díẹ̀ sí ohun tó ṣáájú hàn ní kedere.
theological_decisions:
- issue: Ààlà iṣẹ́ tí Jésù sọ pé a rán òun ṣe nínú ọ̀rọ̀ yìí
  choice: A tú ọ̀rọ̀ náà gẹ́gẹ́ bí ààlà tó ṣe kedere sí àwọn àgùntàn ilé Ísírẹ́lì tí ó sọnù.
  alternative: Kí a sọ ọ́ bí ẹni pé Ísírẹ́lì kàn ni ó ní ipò àkọ́kọ́, tàbí kí a fi iṣẹ́ ìránṣẹ́ sí àwọn orílẹ̀-èdè mìíràn tó wá lẹ́yìn náà kún un.
  rationale: Οὐκ … εἰ μὴ jẹ́ ọ̀rọ̀ ìdíwọ̀n tó lágbára. Ìtumọ̀ náà kò gbọ́dọ̀ dín ìfọkànsìn tàbí ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ìṣẹ̀lẹ̀ náà kù.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ ni a lò. Gbólóhùn náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lápapọ̀; a pa àwòrán ‘àgùntàn’ àti àṣà ọ̀rọ̀ ‘ilé Ísírẹ́lì’ mọ́.
