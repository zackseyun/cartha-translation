id: MAT.15.26
reference: Matthew 15:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: yo
  text: Ṣùgbọ́n ó dáhùn pé, “Kò tọ́ láti mú búrẹ́dì àwọn ọmọ, kí a sì jù ú fún àwọn ajá kéékèèké.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ajá ilé” tàbí “àwọn ọmọ ajá”; ọ̀rọ̀ Gíríìkì náà jẹ́ fọ́ọ̀mù ìdínkù, ó sì lè túmọ̀ sí ajá kéékèèké tàbí ajá ilé dípò ajá ìgboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dáhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí túmọ̀ sí ‘nígbà tí ó dáhùn, ó wí’; ‘ó dáhùn pé’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa agbára ìdáhùn mọ́.
- source_word: καλὸν
  choice: tọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó bójú mu tàbí tí ó yẹ, kì í ṣe ìwà rere nìkan.
- source_word: λαβεῖν
  choice: láti mú
  rationale: ‘Mú’ fi ìṣe gbígbé ohun náà kúrò níbi rẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἄρτον
  choice: àkàrà
  rationale: ‘Àkàrà’ ni ọ̀rọ̀ Yorùbá Bíbélì tí a mọ̀ fún búrẹ́dì, ó sì pa àwòrán oúnjẹ inú òwe náà mọ́; kò tú àwòrán náà sí ‘oúnjẹ’ lápapọ̀.
- source_word: τέκνων
  choice: àwọn ọmọ
  rationale: Ọ̀rọ̀ náà kó gbogbo akọ àti abo sínú, nítorí náà ‘àwọn ọmọ’ péye ju ‘àwọn ọmọkùnrin’ lọ.
- source_word: βαλεῖν
  choice: kí a sì jù ú
  rationale: ‘Jù’ pa àwòrán líle àti gbangba ti βάλλω mọ́, dípò fífi ọ̀rọ̀ rọ̀ sí ‘fún’.
- source_word: κυναρίοις
  choice: àwọn ajá kéékèèké
  rationale: Fọ́ọ̀mù ìdínkù Gíríìkì lè tọ́ka sí àwọn ajá kéékèèké tàbí ajá ilé; ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́ láì fi ìtumọ̀ àyíká kún un.
theological_decisions:
- issue: Bí a ṣe máa pa agbára àfiwé àwọn ọmọ àti ajá mọ́ láì ṣàlàyé àwọn tí wọ́n dúró fún nínú ẹsẹ̀ náà.
  choice: Pa ‘àkàrà àwọn ọmọ’ àti ‘àwọn ajá kéékèèké’ mọ́ gẹ́gẹ́ bí àfiwé tààrà.
  alternative: Ṣàlàyé àwọn ọmọ àti ajá gẹ́gẹ́ bí àwọn ẹgbẹ́ ènìyàn kan pàtó.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò sọ ní tààrà àwọn tí àwòrán kọ̀ọ̀kan dúró fún. Ìtumọ̀ náà pa ìṣòro àti agbára ọ̀rọ̀ Jesu mọ́, ó sì fi àlàyé rẹ̀ sílẹ̀ fún àyíká.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán; a pa àfiwé àti ìfọ̀rọ̀wérọ̀ inú orísun mọ́.
