  verdict: revise
  source_fidelity: The draft accurately preserves the responsive statement, propriety sense of καλόν, the children's possessive relation, and the unsoftened action of throwing. However, àkàrà denotes the Yoruba bean-cake food, not bread; it does not faithfully render ἄρτον in this metaphor.
  naturalness: The clause structure and register are clear, idiomatic Standard Yoruba. Replacing àkàrà with búrẹ́dì makes the image natural and prevents a culturally different food from being introduced.
  terminology: Use búrẹ́dì for ‘bread.’ The rendering àwọn ajá kéékèèké appropriately retains the diminutive nuance without resolving the metaphor. The footnote appropriately supplies ‘house dogs’ and ‘puppies’ as alternatives, while cautiously retaining the lexical observation.
  issues:
