translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Àmì àlàyé [b] wà lẹ́yìn gbogbo ìbéèrè nítorí pé ó ṣàlàyé “búrẹ́dì” nínú gbolohun náà.
