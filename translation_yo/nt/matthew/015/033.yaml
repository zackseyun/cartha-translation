  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn náà sì sọ fún un pé, “Níbo ni a ti lè rí búrẹ́dì[a] púpọ̀ tó ní ibi ahoro yìí[b], láti fi mú ọ̀pọ̀ ènìyàn tó bẹ́ẹ̀ yó[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ìṣù búrẹ́dì púpọ̀ tó”; “búrẹ́dì” dúró gẹ́gẹ́ bí orúkọ àkójọpọ̀ níbí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ní aginjù” tàbí “ní ibi tí ènìyàn kò gbé.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “láti mú ebi wọn dá”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífún ènìyàn ní oúnjẹ títí wọ́n yóò fi yó.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: sì sọ
  rationale: Ọ̀rọ̀ ìṣe yìí jẹ́ historical present nínú Gíríìkì; lílo àkókò tí ó ti kọjá bá ìtàn Yorùbá mu, nígbà tí “sì” ń pa ìtẹ̀síwájú ìtàn mọ́.
- source_word: οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Atọ́ka náà tọ́ka sí ẹgbẹ́ tí a ti mọ̀ tẹ́lẹ̀; “náà” mú ìtumọ̀ yẹn jáde láìfi “tirẹ̀” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: Πόθεν ἡμῖν
  choice: níbo ni a ó ti rí
  rationale: Πόθεν béèrè ibi tí ohun yóò ti wá; gbolohun yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ bí àwọn ọmọ-ẹ̀yìn ṣe ń béèrè ibi tí àwọn yóò ti rí oúnjẹ náà.
- source_word: ἐν ἐρημίᾳ
  choice: ní ibi ahoro yìí
  rationale: “Ibi ahoro” ń sọ agbègbè tí ènìyàn kò gbé tàbí ibi tí ó dá; “yìí” jẹ́ àfikún àdánidá tí ipò ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἄρτοι τοσοῦτοι
  choice: búrẹ́dì tó pọ̀ tó
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄρτοι jẹ́ ọ̀pọ̀ “ìṣù búrẹ́dì,” Yorùbá máa ń lo “búrẹ́dì” gẹ́gẹ́ bí orúkọ àkójọpọ̀; “tó pọ̀ tó” pa èrò iye púpọ̀ tí ó tó mọ́.
- source_word: ὥστε χορτάσαι
  choice: láti fi jẹ́ kí … yó
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífún ènìyàn ní oúnjẹ títí ebi yóò fi dá a; “jẹ́ kí … yó” pa ìtumọ̀ jíjẹ títí ó fi tó mọ́.
- source_word: ὄχλον τοσοῦτον
  choice: ọ̀pọ̀ èèyàn báyìí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ ogunlọ́gọ̀ ènìyàn tí ó tóbi tó bẹ́ẹ̀.
