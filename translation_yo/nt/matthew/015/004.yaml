  to: Nítorí Ọlọ́run sọ pé, “Bọ̀wọ̀ fún baba rẹ àti ìyá rẹ,” àti pé, “Ẹnikẹ́ni tí ó bá bú baba tàbí ìyá, ó gbọdọ̀ kú dájúdájú.”
  rationale: A tún ọ̀rọ̀ keji ṣe láti yọ arọ́pò «rẹ̀» tí ó lè dà bíi pé ó kan «ìyá» nìkan. Àkọsílẹ̀ ẹsẹ̀ ṣàfihàn ìtumọ̀ gbooro ti κακολογέω láìfi ìtumọ̀ kan ṣoṣo dì í.
