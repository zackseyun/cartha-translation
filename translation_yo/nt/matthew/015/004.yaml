  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: yo
  text: Nítorí Ọlọ́run sọ pé, “Bọ̀wọ̀ fún baba rẹ àti ìyá rẹ,” àti pé, “Ẹnikẹ́ni tí ó bá bú baba tàbí ìyá, ó gbọdọ̀ kú dájúdájú.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Nítorí Ọlọ́run
  rationale: γάρ ń fi ìdí ọ̀rọ̀ Jésù múlẹ̀; “Nítorí Ọlọ́run” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìdí náà mọ́ láìfi ìtẹnumọ́ àfikún sí i.
- source_word: εἶπεν
  choice: sọ pé
  rationale: λέγω níbí ń ṣe àgbékalẹ̀ ọ̀rọ̀ inú Ìwé Mímọ́; “sọ pé” ni ìtumọ̀ pẹ̀lẹ́ tí kò fi agbára “pa láṣẹ” kún ọ̀rọ̀ Gíríìkì.
- source_word: Τίμα
  choice: Bọ̀wọ̀ fún
  rationale: τιμάω túmọ̀ sí fífún ẹni ní ọlá tí ó tọ́ sí i; “bọ̀wọ̀ fún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì di ọlá ìwà rere inú àṣẹ náà mú.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: baba rẹ àti ìyá rẹ
  rationale: Ọ̀rọ̀ arọ́pò ẹni kejì wà nínú àyíká àṣẹ tí a ń tọ́ka sí; fífi “rẹ” hàn mú kí Yorùbá náà ṣe kedere, ó sì bá ìtumọ̀ àṣẹ náà mu.
- source_word: Ὁ κακολογῶν
  choice: Ẹnikẹ́ni tí ó bá bú
  rationale: κακολογέω lè túmọ̀ sí sísọ̀rọ̀ burúkú sí ẹni, ẹ̀gàn, tàbí èébú; nínú àyíká òfin yìí, “bú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣókí tí ó sì di agbára ọ̀rọ̀ náà mú.
- source_word: πατέρα ἢ μητέρα
  choice: baba tàbí ìyá rẹ̀
  rationale: “baba tàbí ìyá” pa ìtumọ̀ àṣàyàn ἢ mọ́; “rẹ̀” mú ẹni tí ìṣe náà kan ṣe kedere ní Yorùbá láìyí ìtumọ̀ òfin náà padà.
- source_word: θανάτῳ τελευτάτω
  choice: ó gbọdọ̀ kú dájúdájú
  rationale: Gbólóhùn náà jẹ́ ọ̀rọ̀ ìjìyà ikú tó lágbára; “ó gbọdọ̀ kú dájúdájú” pa ìtẹnumọ́ àti ìwúwo òfin mọ́, láìsọ ẹni tí yóò mú ikú náà ṣẹ ní pàtó.
theological_decisions:
- issue: Bí a ṣe túmọ̀ gbólóhùn ìjìyà òfin θανάτῳ τελευτάτω
  choice: ó gbọdọ̀ kú dájúdájú
  alternative: a gbọdọ̀ pa á
  rationale: Àṣàyàn náà pa líle ìdájọ́ ikú inú ọ̀rọ̀ Ìwé Mímọ́ mọ́, ṣùgbọ́n kò fi ẹni tó ń ṣe ìdájọ́ náà kún Gíríìkì, nítorí ọ̀rọ̀ náà kò sọ aṣojú ìpaniyan ní tààrà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbo. A lo “bọ̀wọ̀ fún” fún àṣẹ ìbọ̀wọ̀, “bú” fún κακολογέω nínú àyíká òfin, àti “kú dájúdájú” láti pa àìsọ aṣojú ìjìyà náà mọ́.
