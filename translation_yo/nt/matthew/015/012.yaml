id: MAT.15.12
reference: Matthew 15:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: yo
  text: Nígbà náà ni àwọn ọmọ ẹ̀yìn náà tọ̀ ọ́ wá, wọ́n sì sọ fún un pé, “Ṣé o mọ̀ pé inú bí àwọn Farisí[a] nígbà tí wọ́n gbọ́ ọ̀rọ̀ yìí[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ọ̀rọ̀ náà ṣẹ̀ wọ́n”; ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “ó mú wọ́n kọsẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀rọ̀ yìí” ń tọ́ka sí gbólóhùn Jésù tó ṣáájú.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí àkókò tó tẹ̀ lé e.
- source_word: προσελθόντες
  choice: tọ̀ ọ́ wá
  rationale: Ó fi hàn pé àwọn ọmọ ẹ̀yìn sún mọ́ Jésù láti bá a sọ̀rọ̀, ó sì bá ìlò Yorùbá mu.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ ẹ̀yìn náà
  rationale: Àpèjúwe pàtó náà tọ́ka sí àwọn ọmọ ẹ̀yìn Jésù tí a ti mọ̀ nínú ìtàn náà; Gíríìkì kò fi ọ̀rọ̀ tó túmọ̀ sí ‘tirẹ̀’ kún un.
- source_word: λέγουσιν αὐτῷ
  choice: wọ́n sì sọ fún un pé
  rationale: A tú ìṣe ìsinsìnyí inú ìtàn sí ìṣe tó ti kọjá ní Yorùbá, ní ọ̀nà tó rọrùn láti kà.
- source_word: Οἶδας
  choice: Ṣé o mọ̀
  rationale: Èyí jẹ́ ìbéèrè tààrà tó pa ìtumọ̀ οἶδα mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ náà tí ó wọ́pọ̀, tó sì ṣe kedere ní Yorùbá.
- source_word: ἀκούσαντες τὸν λόγον
  choice: nígbà tí wọ́n gbọ́ ọ̀rọ̀ yìí
  rationale: ‘Ọ̀rọ̀ yìí’ sun mọ́ λόγον, ó sì tọ́ka sí gbólóhùn Jésù tó ṣáájú.
- source_word: ἐσκανδαλίσθησαν
  choice: inú bí ...
  rationale: Nínú àyíká yìí, gbólóhùn náà túmọ̀ sí pé ọ̀rọ̀ Jésù ṣẹ̀ wọ́n tàbí mú wọn bínú; ‘inú bí wọn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìhùwàsí yẹn.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλίζω níbi tí àwọn Farisí ti fèsì sí ẹ̀kọ́ Jésù
  choice: inú bí àwọn Farisí
  alternative: ọ̀rọ̀ náà ṣẹ̀ wọ́n; ó mú wọn kọsẹ̀
  rationale: Àyíká náà dá lórí bí ọ̀rọ̀ Jésù ṣe bí wọn nínú, kì í ṣe ìkéde pàtó nípa ìṣubú kúrò nínú ìgbàgbọ́. Àlàyé ìsàlẹ̀ ojú ewé pa àwòrán gangan ti ‘kọsẹ̀’ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘Ṣé’ gẹ́gẹ́ bí ìbéèrè àdánidá, ‘tọ̀ ọ́ wá’ fún ìsúnmọ́, àti ‘inú bí’ fún ìfèsì àwọn Farisí.
