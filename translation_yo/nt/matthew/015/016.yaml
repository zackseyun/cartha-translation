  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: yo
  text: Ṣùgbọ́n ó wí pé, “Ẹ̀yin náà ha kò tíì lóye síbẹ̀?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ hàn láti inú ọ̀rọ̀ àwọn ọmọ-ẹ̀yìn sí ìdáhùn Jésù; ‘Ṣùgbọ́n’ jẹ́ ọ̀nà àdánidá láti fi ìyípadà yìí hàn ní Yorùbá.
- source_word: ὁ
  choice: ó
  rationale: Àrótọ́ náà dúró bí arọ́pò-orúkọ, ó sì ń tọ́ka sí Jésù; ‘ó’ jẹ́ arọ́pò-orúkọ tí Yorùbá ń béèrè níbí.
- source_word: εἶπεν
  choice: wí pé
  rationale: Ìtumọ̀ ìtàn àdánidá fún ọ̀rọ̀-ìṣe λέγω ní àkókò aorist; ‘wí pé’ tún ṣe ìfihàn ọ̀rọ̀ tààrà ní Yorùbá.
- source_word: Ἀκμὴν
  choice: kò tíì … síbẹ̀
  rationale: Àkópọ̀ yìí fi ìtumọ̀ ‘títí di báyìí/síbẹ̀’ hàn, ó sì mú kí ìbéèrè náà jẹ́ Yorùbá àdánidá láì tún àmì àkókò sọ lẹ́ẹ̀mejì.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi hàn pé àwọn ọmọ-ẹ̀yìn náà wà lára àwọn tí àìlóye kàn; ‘pẹ̀lú’ pa agbára ìfikún náà mọ́.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Arọ́pò-orúkọ náà jẹ́ kedere nínú Gíríìkì fún ìtẹnumọ́; ‘ẹ̀yin’ pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἀσύνετοί
  choice: lóye
  rationale: Nínú ìkọ̀lé òdì ‘kò tíì lóye,’ ó túmọ̀ sí àìní òye tàbí ìmòye, láì mú un le ju bíi ‘òmùgọ̀.’
- source_word: ἐστε
  choice: kò tíì lóye
  rationale: Ọ̀rọ̀-ìṣe ‘jẹ́/wà’ ti Gíríìkì ni Yorùbá sọ lọ́nà àdánidá pẹ̀lú ọ̀rọ̀-ìṣe ‘lóye’ nínú ìbéèrè òdì yìí; ìtẹ̀síwájú títí di báyìí wà nínú ‘kò tíì … síbẹ̀.’
theological_decisions:
- issue: Ohùn ìbáwí Jésù sí àwọn ọmọ-ẹ̀yìn
  choice: A ṣe e bí ìbéèrè tó mú nípa àìlóye wọn tó ṣì ń bá a lọ, láì sọ ọ́ di ìdálẹ́bi líle ju ti Gíríìkì lọ.
  alternative: “Ẹ̀yin pẹ̀lú ha ṣì jẹ́ aláìlóye?”
  rationale: ‘Ẹ̀yin pẹ̀lú ha kò tíì lóye síbẹ̀?’ pa ìbáwí àti ìyàlẹ́nu mọ́, ṣùgbọ́n kò yí ἀσύνετοι sí ẹ̀sùn ìwà òmùgọ̀ tó le jù.
translation_notes:
  register: Yorùbá boṣewa, ti ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Ha’ jẹ́ àmì ìbéèrè tó bójú mu fún ọ̀rọ̀ mímọ́ tí ó ṣì ṣeé lóye fún òǹkàwé òde òní.
