id: MAT.15.39
reference: Matthew 15:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: yo
  text: Lẹ́yìn tí ó rán àwọn ogunlọ́gọ̀ ènìyàn náà lọ, ó wọ inú ọkọ̀ ojú omi, ó sì dé agbègbè Magadani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “Magdala” dípò “Magadani.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Lẹ́yìn tí ó ... rán ... lọ
  rationale: Ọ̀rọ̀ ìṣe aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú àwọn ọ̀rọ̀ ìṣe pàtàkì; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì mú èrò ‘fí wọn sílẹ̀ láti lọ’ jáde láìfikún ìtumọ̀ míì.
- source_word: τοὺς ὄχλους
  choice: àwọn èrò náà
  rationale: ‘Àwọn èrò’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì pa fọ́ọ̀mù ọ̀pọ̀ Greek mọ́.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: ó wọ inú ọkọ̀ ojú omi
  rationale: Èyí ṣàfihàn ìṣe gígùn sínú ọkọ̀ ojú omi ní ọ̀nà tí ó ṣe kedere tí ó sì bá Yorùbá mu.
- source_word: ἦλθεν
  choice: ó dé
  rationale: Nínú àkọsílẹ̀ ìrìnàjò, ‘ó dé’ sọ àbájáde wíwá sí ibi náà ní Yorùbá àdánidá, láìyí ìtumọ̀ padà.
- source_word: τὰ ὅρια
  choice: agbègbè
  rationale: Fọ́ọ̀mù ọ̀pọ̀ náà lè túmọ̀ sí ààlà, ilẹ̀, tàbí agbègbè kan; ‘agbègbè’ mú ìtumọ̀ ibi ilẹ̀ náà jáde láìdá a mọ́ ìlà ààlà nìkan.
- source_word: Μαγαδάν
  choice: Magadani
  rationale: A tẹ̀lé orúkọ ibi tí SBLGNT gbé kalẹ̀, a sì kọ ọ́ ní ìrísí tí ó rọrùn fún olùka Yorùbá láti pè.
theological_decisions:
- issue: Ìrísí orúkọ ibi ní òpin ẹsẹ náà
  choice: Magadani
  alternative: Magidala
  rationale: Èyí jẹ́ ọ̀ràn ìyàtọ̀ inú àwọn àfọwọ́kọ, kì í ṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́. Ọ̀rọ̀ àkọ́kọ́ tẹ̀lé Μαγαδάν nínú SBLGNT, nígbà tí àlàyé ìsàlẹ̀ fi ìrísí mìíràn hàn fún ìṣípayá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘èrò’ fún ọ̀pọ̀ ènìyàn tí ó péjọ, àti ‘agbègbè’ fún ìtumọ̀ ilẹ̀ tí τὰ ὅρια ní nínú àyíká yìí.
