review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìṣọ̀kan ọ̀rọ̀ Giriki dáadáa: ìrán àwọn ogunlọ́gọ̀ ènìyàn lọ wá ṣáájú gígun ọkọ̀, ‘agbègbè’ yẹ fún τὰ ὅρια, àti Magadani ń tẹ̀lé Μαγαδάν nínú SBLGNT. Síbẹ̀, ‘sì’ nínú ‘Lẹ́yìn tí ó sì rán’ fi ìtumọ̀ àfikún tí kò ṣe pàtàkì sí participle náà, àti orúkọ àtúnkà inú àlàyé ìsàlẹ̀ kò tọ́ ọrọ̀ Gẹ̀ẹ́sì/aṣàfọwọ́kọ tí a tọ́ka sí.'
  naturalness: ‘Lẹ́yìn tí ó rán àwọn ogunlọ́gọ̀ ènìyàn náà lọ’ jẹ́ ọ̀nà Yorùbá boṣewa, ó sì ṣàfihàn ὄχλους ní pàtó ju ‘àwọn èrò’ lọ nínú àyíká ìjọ ènìyàn. Gbólóhùn tó kù jẹ́ ti ara, ó sì ní àmì ohùn tó yẹ.
  terminology: A pa ‘ọkọ̀ ojú omi,’ ‘agbègbè,’ àti ‘Magadani’ mọ́. Àlàyé ìsàlẹ̀ gbọdọ̀ lo ‘Magdala,’ kì í ṣe ‘Magidala,’ nítorí Μαγδαλά ni ìyàtọ̀ tí a mọ̀ nínú àwọn àfọwọ́kọ.
  issues:
