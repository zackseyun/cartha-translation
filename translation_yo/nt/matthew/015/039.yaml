revisions:
- from: Lẹ́yìn tí ó sì rán àwọn èrò náà lọ, ó wọ inú ọkọ̀ ojú omi, ó sì dé agbègbè Magadani.[a]
  to: Lẹ́yìn tí ó rán àwọn ogunlọ́gọ̀ ènìyàn náà lọ, ó wọ inú ọkọ̀ ojú omi, ó sì dé agbègbè Magadani.[a]
  rationale: Àtúnṣe náà mú àlàyé ìsàlẹ̀ bá variant Magdala mu, yọ ‘sì’ tí kò pọndandan kúrò nínú gbólóhùn participle, ó sì lo ọ̀rọ̀ tó pàtó fún ọ̀pọ̀ ènìyàn tí ó péjọ. Kò yí ìtumọ̀, ìpele ọ̀rọ̀, tàbí ìpinnu SBLGNT nípa Magadani padà.
  reviewer_model: gpt-5.6-terra
