    rationale: Àlàyé Gẹ̀ẹ́sì àti ìyàtọ̀ àfọwọ́kọ tí a tọ́ka sí ní ‘Magdala’; “Magidala” kì í ṣe ìtumọ̀-ìkọ̀wé tó bá variant náà mu.
  - severity: low
    issue: “sì” nínú “Lẹ́yìn tí ó sì rán ... lọ” kò pọndandan.
    rationale: καὶ ἀπολύσας jẹ́ ìbẹ̀rẹ̀ ìtàn pẹ̀lú participle; ‘sì’ ní ipò yìí lè dun bí ìṣe àfikún, níbi tí Yorùbá ti lè sọ ìṣe tó ṣáájú rẹ̀ ní tààrà.
  - severity: low
    issue: “àwọn èrò náà” kò ṣàfihàn ìtumọ̀ ‘crowds’ ní pàtó tó.
    rationale: ‘Àwọn ogunlọ́gọ̀ ènìyàn’ ń fi ọ̀pọ̀ ènìyàn tí ó péjọ hàn kedere, láìfi ìtumọ̀ tuntun kún un.
