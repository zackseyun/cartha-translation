reference: Matthew 15:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: yo
  text: Ó mú ìṣù búrẹ́dì méje náà àti àwọn ẹja náà, lẹ́yìn tí ó dúpẹ́, ó bù àwọn ìṣù búrẹ́dì náà, ó sì ń fi wọ́n fún àwọn ọmọ-ẹ̀yìn; àwọn ọmọ-ẹ̀yìn náà sì ń fi wọ́n fún àwọn ogunlọ́gọ̀ ènìyàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: Ó mú
  rationale: Nínú ìtàn yìí, λαμβάνω ń tọ́ka sí bí Jésù ṣe gbé oúnjẹ náà láti bẹ̀rẹ̀ ìṣe ìdúpẹ́, bíbù, àti pípín; “mú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé ní àyíká yìí.
- source_word: ἑπτὰ ἄρτους
  choice: ìṣù búrẹ́dì méje náà
  rationale: ἄρτος níbí túmọ̀ sí àwọn ìṣù búrẹ́dì tí a lè kà, kì í ṣe búrẹ́dì gẹ́gẹ́ bí oúnjẹ lápapọ̀; “ìṣù búrẹ́dì” mú ìtumọ̀ yẹn hàn gbangba.
- source_word: ἰχθύας
  choice: àwọn ẹja náà
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀; “àwọn ẹja” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá, a sì pa àfihàn ohun tí a ti mọ̀ mọ́ pẹ̀lú “náà.”
- source_word: εὐχαριστήσας
  choice: lẹ́yìn tí ó dúpẹ́
  rationale: Aorist participle náà ṣáájú ìṣe bíbù; gbólóhùn yìí fi ìtẹ̀lé àkókò hàn dáadáa láì fi ẹni tí ó dúpẹ́ lọ́wọ́ rẹ̀ kun ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἔκλασεν
  choice: ó bù wọ́n
  rationale: κλάω ń tọ́ka sí bíbù àwọn ìṣù búrẹ́dì fún pípín. Arọ́pò-orúkọ “wọ́n” jẹ́ ohun tí Yorùbá nílò ní ti àdánidá, àyíká sì fi ohun tí a bù hàn.
- source_word: ἐδίδου
  choice: ó sì ń fi wọ́n fún
  rationale: Àìpé (imperfect) náà fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; “ń fi wọ́n fún” pa agbára ìṣe tó ń tẹ̀ síwájú yẹn mọ́.
- source_word: μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Dative náà fi àwọn olùgbà hàn. A kò fi “rẹ̀” kún un nítorí pé kò sí ní gbangba nínú Gíríìkì.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: àwọn ọmọ-ẹ̀yìn náà sì ń fi wọ́n fún àwọn ogunlọ́gọ̀ ènìyàn
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ nínú gbólóhùn kejì, ṣùgbọ́n Yorùbá àdánidá nílò kí a tún un sọ. “Ogunlọ́gọ̀ ènìyàn” fi ọ̀pọ̀ ὄχλοι hàn ní ọ̀nà tó yé kedere.
theological_decisions:
- issue: Ìtumọ̀ ìsìn Oúnjẹ Alẹ́ Olúwa tí εὐχαριστήσας lè mú wá sí ọkàn
  choice: “lẹ́yìn tí ó dúpẹ́” gẹ́gẹ́ bí ìṣe ìdúpẹ́ lórí oúnjẹ nínú ìtàn náà
  alternative: Lílo èdè àkànṣe ìjọsìn tó lè tẹnu mọ́ ìtumọ̀ Oúnjẹ Alẹ́ Olúwa
  rationale: Àpẹẹrẹ ọ̀rọ̀ náà lè mú ìṣẹ̀lẹ̀ Oúnjẹ Alẹ́ Olúwa wá sí ọkàn, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ ń sọ pé Jésù dúpẹ́ lórí oúnjẹ nínú iṣẹ́ àmì pípà oúnjẹ. Ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ ìsìn tí Gíríìkì kò sọ ní gbangba kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó bójú mu fún kíkà ní gbangba, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá. Kò sí àlàyé ìsàlẹ̀ ojú-ìwé nítorí pé àlàyé [a] inú English POB kò bá àmì rẹ̀ mu, ó sì ń fúnni ní àṣàyàn Gẹ̀ẹ́sì tí kò ṣe pàtàkì fún Yorùbá.
