source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: yo
  text: Tó fi jẹ́ pé ẹnu ya ogunlọ́gọ̀ náà nígbà tí wọ́n rí àwọn tí kò lè sọ̀rọ̀ tí wọ́n ń sọ̀rọ̀[a], àwọn tí ẹ̀yà ara wọn ní àbùkù tí ara wọn sì dá[b], àwọn arọ tí wọ́n ń rìn, àti àwọn afọ́jú tí wọ́n ń rí; wọ́n sì yin Ọlọ́run Ísírẹ́lì lógo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn adití tí wọ́n ń sọ̀rọ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí adití tàbí ẹni tí kò lè sọ̀rọ̀; “àwọn tí kò lè sọ̀rọ̀” ló bá ìtẹnumọ́ lórí sísọ̀rọ̀ mu jù níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn alábùkù tí ara wọn sì dá” tàbí “àwọn tí ẹ̀yà ara wọn bàjẹ́ tí wọ́n sì padà pé.” Ọ̀rọ̀ Gíríìkì náà ṣàpèjúwe àwọn tí ẹ̀yà ara wọn ní àbùkù tàbí tí ó bàjẹ́, tí ara wọn sì dá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde àwọn ìwòsàn tó ṣáájú hàn lọ́nà àdánidá ní Yorùbá.
- source_word: τὸν ὄχλον
  choice: ogunlọ́gọ̀ náà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì bá ìtàn náà mu.
- source_word: θαυμάσαι
  choice: ẹnu ya
  rationale: Ó sọ ìyàlẹ́nu ńlá tí ogunlọ́gọ̀ náà ní jáde ní èdè Yorùbá tó wọ́pọ̀.
- source_word: βλέποντας
  choice: nígbà tí wọ́n rí
  rationale: Ó fi ohun tí ogunlọ́gọ̀ náà rí gẹ́gẹ́ bí ìdí ìyàlẹ́nu wọn hàn.
- source_word: κωφοὺς
  choice: àwọn odi
  rationale: Nínú àyíká κωφοὺς λαλοῦντας, àìlèsọ̀rọ̀ ni ìtumọ̀ tó ṣeé ṣe jù, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí adití.
- source_word: λαλοῦντας
  choice: tí wọ́n ń sọ̀rọ̀
  rationale: Ó túmọ̀ participle náà ní tààrà, ó sì mú ìyàtọ̀ sí ipò wọn tẹ́lẹ̀ hàn.
- source_word: κυλλοὺς
  choice: àwọn aláàbọ̀-ara
  rationale: Ó ń tọ́ka sí àwọn tí ẹ̀yà ara wọn bàjẹ́, gé kúrò, tàbí tí kò pé; yíyan yìí yà wọ́n sọ́tọ̀ kúrò lọ́dọ̀ àwọn arọ.
- source_word: ὑγιεῖς
  choice: tí ara wọn dá
  rationale: Ó fi ipò ìlera tí wọ́n dé sí hàn, láìfi ọ̀rọ̀ ìṣe aláìnílò kún adjective Gíríìkì náà.
- source_word: χωλοὺς
  choice: àwọn arọ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tí kò lè rìn dáadáa.
- source_word: περιπατοῦντας
  choice: tí wọ́n ń rìn
  rationale: Ìtumọ̀ gangan ti rírìn ni àyíká iṣẹ́ ìyanu yìí béèrè.
- source_word: τυφλοὺς βλέποντας
  choice: àwọn afọ́jú tí wọ́n ń ríran
  rationale: Ó pa ìtòlẹ́sẹẹsẹ àti ìyàtọ̀ inú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἐδόξασαν
  choice: wọ́n sì yin ... lógo
  rationale: Ó pa ìtumọ̀ fífi ògo fún Ọlọ́run mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó bójú mu.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Ọlọ́run Israẹli
  rationale: Ó tẹ̀ lé ìbáṣepọ̀ genitive Gíríìkì ní kedere, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ κωφοὺς nínú κωφοὺς λαλοῦντας
  choice: àwọn odi tí wọ́n ń sọ̀rọ̀
  alternative: àwọn adití tí wọ́n ń sọ̀rọ̀
  rationale: κωφός lè jẹ́ adití tàbí odi, ṣùgbọ́n λαλοῦντας mú ìmúpadàbọ̀sípò ọ̀rọ̀ sísọ ṣe pàtàkì jù; àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn kejì mọ́.
- issue: Bí a ṣe túmọ̀ δοξάζω nípa Ọlọ́run
  choice: wọ́n yin Ọlọ́run Israẹli lógo
  alternative: wọ́n yin Ọlọ́run Israẹli
  rationale: Yíyan náà pa èrò fífi ògo fún Ọlọ́run mọ́, dípò kíkó ìtumọ̀ náà kù sí ìyìn lásán.
translation_notes:
  register: Èdè Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tó yẹ. “Àwọn aláàbọ̀-ara” àti “àwọn arọ” ni a yà sọ́tọ̀ láti pa ìyàtọ̀ κυλλοί àti χωλοί mọ́.
