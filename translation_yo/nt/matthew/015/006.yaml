id: MAT.15.6
reference: Matthew 15:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: yo
  text: Ẹni náà kò nílò láti bọ̀wọ̀ fún baba rẹ̀ rárá.[b] Ẹ sì ti sọ ọ̀rọ̀ Ọlọ́run[a] di asán nítorí àṣà àtọwọ́dọ́wọ́ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “àṣẹ Ọlọ́run” dípò “ọ̀rọ̀ Ọlọ́run.”
    reason: textual_variant
  - marker: b
    text: “Bọ̀wọ̀ fún” níbí lè ní ìtumọ̀ ojúṣe láti pèsè fún òbí ẹni àti láti tọ́jú wọn, kì í ṣe fífi ọ̀wọ̀ hàn nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: kò nílò ... rárá
  rationale: Ọ̀rọ̀ yìí fi ìkọ̀ emphatic hàn, ṣùgbọ́n nínú àyíká yìí ó ń sọ pé àṣà wọn ti yọ ojúṣe náà kúrò; “kò nílò … rárá” mú ìtumọ̀ permissive yẹn àti agbára ìkọ̀ náà jáde.
- source_word: τιμήσει
  choice: láti bọ̀wọ̀ fún
  rationale: “Bọ̀wọ̀ fún” ni ọ̀nà Yorùbá àdánidá fún fífi ọlá fún ẹnì kan; ó tún pa ìsopọ̀ mọ́ àṣẹ nípa bíbọ̀wọ̀ fún òbí, láì dín ìtumọ̀ rẹ̀ kù sí ìrànlọ́wọ́ owó nìkan.
- source_word: πατέρα αὐτοῦ
  choice: baba rẹ̀
  rationale: Èdè Gíríìkì tí a tẹ̀ jáde sọ “baba rẹ̀” ní ẹyọ kan; a kò fi “ìyá” kún un láti inú àyíká.
- source_word: ἠκυρώσατε
  choice: ẹ ti sọ ... di asán
  rationale: 'Àṣàyàn yìí sọ agbára ἀκυρόω jáde ní Yorùbá òde òní: wọn ti mú ọ̀rọ̀ náà má ṣiṣẹ́ tàbí má ní ipa.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Èyí tẹ̀ lé λόγον nínú SBLGNT ní tààràtà; a tọ́ka sí ẹ̀dà mìíràn, “àṣẹ Ọlọ́run,” nínú àlàyé ìsàlẹ̀.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: nítorí àṣà àtọwọ́dọ́wọ́ yín
  rationale: διά pẹ̀lú accusative ń fi ìdí tàbí ohun tó fà á hàn níbí. “Àṣà àtọwọ́dọ́wọ́” jẹ́ ọ̀nà àdánidá láti sọ παράδοσις gẹ́gẹ́ bí ẹ̀kọ́ tàbí àṣà tí a jogún.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé “bọ̀wọ̀ fún” ní ìrànlọ́wọ́ ohun ìní sí òbí nínú
  choice: A pa “bọ̀wọ̀ fún” mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ipa ìtọ́jú òbí nínú àlàyé ìsàlẹ̀.
  alternative: “láti pèsè fún baba rẹ̀” tàbí “láti tọ́jú baba rẹ̀”
  rationale: τιμάω túmọ̀ sí fífi ọlá fún, bí ó tilẹ̀ jẹ́ pé àríyànjiyàn yìí kan ojúṣe ìtọ́jú òbí. Àṣàyàn náà pa ìtumọ̀ gbooro àti ìsopọ̀ mọ́ àṣẹ Ọlọ́run mọ́ láì fi ìtumọ̀ tóóró kan lé e lórí.
- issue: Bóyá kí a mú ọ̀rọ̀ náà bá ẹsẹ tó yí i ká tàbí ẹ̀dà mìíràn mu
  choice: A túmọ̀ “baba rẹ̀” àti “ọ̀rọ̀ Ọlọ́run” gẹ́gẹ́ bí SBLGNT ṣe tẹ̀ wọ́n.
  alternative: “baba tàbí ìyá rẹ̀” àti “àṣẹ Ọlọ́run”
  rationale: Ìjẹ́wọ́ sí ẹ̀rí èdè ìpilẹ̀ béèrè pé kí a má ṣe fi ọ̀rọ̀ àyíká tàbí ẹ̀dà mìíràn rọ́pò ohun tí ẹ̀dà tí a yàn tẹ̀; àṣàyàn pàtàkì mìíràn wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti èdè ọlọ́lá tó ṣeé lóye. “Àṣà àtọwọ́dọ́wọ́” yàtọ̀ sí àṣà lásán, ó sì fi hàn pé ohun tí a jogún tí a sì ń fi lé àwọn ẹlòmíràn lọ́wọ́ ni a ń sọ.
