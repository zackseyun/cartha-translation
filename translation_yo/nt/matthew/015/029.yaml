id: MAT.15.29
reference: Matthew 15:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: yo
  text: Lẹ́yìn tí Jésù kúrò níbẹ̀, ó wá lẹ́gbẹ̀ẹ́ Òkun Gálílì[a]; lẹ́yìn tí ó gun òkè náà, ó ń jókòó níbẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní etí Òkun Gálílì.” Ọ̀rọ̀ ìṣáájú Gíríìkì náà lè tọ́ka sí lílọ lẹ́gbẹ̀ẹ́ etí omi tàbí sí wíwà lẹ́gbẹ̀ẹ́ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní imperfect. A lè túmọ̀ ọ́ sí “ó jókòó níbẹ̀,” ṣùgbọ́n “ó ń jókòó” fi ipò tí ń bá a lọ hàn kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Nígbà tí ... kúrò níbẹ̀
  rationale: Aorist participle náà tọ́ka sí ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì; gbólóhùn àkókò yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtẹ̀lé àwọn ìṣe mọ́.
- source_word: ἦλθεν
  choice: ó dé
  rationale: Nínú ìtàn ìrìn-àjò yìí, “ó dé” sọ ìbọ̀wọ̀ sí ibi náà ní Yorùbá lọ́nà tó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: etí Òkun Gálílì
  rationale: παρά pẹ̀lú accusative lẹ́yìn ọ̀rọ̀-ìṣe ìṣípò lè túmọ̀ sí lílọ sí ẹ̀gbẹ́ etí omi tàbí lẹ́gbẹ̀ẹ́ rẹ̀. “Etí Òkun Gálílì” jẹ́ àdánidá, ó sì fi ìbáṣepọ̀ pẹ̀lú etí omi hàn láìpinnu bóyá ó ń rìn ní gbogbo etí rẹ̀.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: ó gun orí òkè lọ
  rationale: Ìṣọ̀kan ἀναβαίνω àti εἰς τὸ ὄρος sọ ìgòkè sí orí òkè; “gun orí òkè lọ” jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti àdánidá.
- source_word: ἐκάθητο ἐκεῖ
  choice: ó jókòó níbẹ̀
  rationale: ἐκάθητο jẹ́ imperfect tí ó lè ṣàpèjúwe ipò tó ń bá a lọ. Yorùbá “ó jókòó níbẹ̀” lè sọ ìwọ̀lé sí ipò jíjókòó tàbí ipò náà fúnra rẹ̀ láìdi apá ìṣe náà mú ju bí orísun ṣe ṣe lọ.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: A lo ìkọ̀wé orúkọ Jésù tí ó wọ́pọ̀ nínú Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá bá ìlò àdánidá mu; ìforúkọsílẹ̀ náà ní ọlá, ó ṣe kedere, ó sì yẹ fún olùkà òde òní. A kò fi àlàyé ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà.
