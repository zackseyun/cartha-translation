id: MAT.15.13
reference: Matthew 15:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: yo
  text: Ṣùgbọ́n ó dáhùn pé, “Gbogbo ohun tí a gbìn[a] tí Bàbá mi ti ọ̀run kò gbìn ni a ó fà tu kúrò ní gbòǹgbò.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo gbígbìn tí Bàbá mi ti ọ̀run kò gbìn ni a ó fà tu kúrò ní gbòǹgbò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ó dáhùn pé
  rationale: Àpapọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà ìtàn Gíríìkì tí ipa èdè Ṣémítì wà lára rẹ̀. ‘Ó dáhùn pé’ jẹ́ Yorùbá àdánidá, ó sì pa èrò ìdáhùn àti ìsọ̀rọ̀ mọ́ láìjẹ́ líle.
- source_word: Πᾶσα
  choice: Gbogbo
  rationale: Nínú ‘Gbogbo ohun tí a gbìn,’ ọ̀rọ̀ yìí ní ìtumọ̀ pínpín tí ó bá nọ́ńbà ẹyọ tí ó tẹ̀ lé e mu.
- source_word: φυτεία
  choice: ohun tí a gbìn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ohun tí a gbìn tàbí iṣẹ́ gbígbìn. ‘Ohun tí a gbìn’ jẹ́ kedere, ó jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ohun tí a lè fà tu kúrò ní gbòǹgbò mọ́.
- source_word: ἐφύτευσεν
  choice: kò gbìn
  rationale: A pa àkàwé iṣẹ́ àgbẹ̀ mọ́ ní tààrà, a sì lo gbòǹgbò ọ̀rọ̀ kan náà pẹ̀lú ‘ohun tí a gbìn.’
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Baba mi ọ̀run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó mọ́, tí ó sì pa ‘Baba mi’ àti àpèjúwe pé ó jẹ́ ti ọ̀run mọ́.
- source_word: ἐκριζωθήσεται
  choice: ni a ó fà tu kúrò ní gbòǹgbò
  rationale: Èyí fi ìṣe fífa ohun jáde pẹ̀lú gbòǹgbò rẹ̀ hàn kedere, ó sì pa àwòrán ìdájọ́ inú iṣẹ́ àgbẹ̀ mọ́.
theological_decisions:
- issue: Ohun tí àkàwé ‘gbogbo ohun tí a gbìn’ ń tọ́ka sí
  choice: A fi àkàwé náà sílẹ̀ láìsọ pé ó túmọ̀ sí ẹ̀kọ́, àṣà, tàbí ènìyàn.
  alternative: Gbogbo ẹ̀kọ́; gbogbo àṣà; gbogbo ẹni tí Baba kò gbìn.
  rationale: Gíríìkì kò pinnu ohun tí àkàwé náà ń tọ́ka sí ní pàtó. Fífi àwòrán náà sílẹ̀ pa àìdánilójú àti ìfúnpá ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; èdè náà níyì, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àkàwé iṣẹ́ àgbẹ̀ inú orísun mọ́.
