  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: yo
  text: Gbogbo wọn sì jẹ, wọ́n sì yó. Wọ́n sì kó àwọn àjẹkù tí ó ṣẹ́ kù jọ; ó kún agbọ̀n méje[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “agbọ̀n ńlá méje tí ó kún”; ọ̀rọ̀ Gíríìkì tí a lò níhìn-ín (spyridas) lè tọ́ka sí irú agbọ̀n kan tí ó tóbi ju èyí tí a mẹ́nu kàn nínú àwọn ìtàn míì nípa fífi oúnjẹ fún ọ̀pọ̀ ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: jẹ
  rationale: Aorist ἐσθίω means ‘ate’; Yorùbá ‘jẹ’ is direct and natural without supplying an expressed object.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Preserves the universal scope and makes the plural subject explicit in idiomatic Yorùbá.
- source_word: ἐχορτάσθησαν
  choice: wọ́n sì yó
  rationale: In this meal context, ‘yó’ naturally means that they ate until satisfied or full.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: àwọn àjẹkù tí ó ṣẹ́ kù
  rationale: Renders the substantival participle and genitive naturally as ‘the pieces/remnants that remained,’ without unnecessary technical wording.
- source_word: ἦραν
  choice: wọ́n sì kó ... jọ
  rationale: In the context of collecting remnants, ‘kó ... jọ’ clearly expresses gathering or picking them up.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: agbọ̀n méje sì kún
  rationale: States naturally that the collected remnants filled seven baskets while preserving the number and fullness.
- source_word: σπυρίδας
  choice: agbọ̀n
  rationale: ‘Agbọ̀n’ is the ordinary Yorùbá term for a basket; the possible larger size of this particular Greek basket is retained in a footnote.
theological_decisions: []
