id: MAT.15.22
reference: Matthew 15:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: yo
  text: Kíyèsí i, obìnrin ará Kénáánì kan láti àwọn agbègbè wọ̀nyẹn jáde wá, ó sì ń ké pé, “Olúwa, Ọmọ Dáfídì, ṣàánú fún mi! Ẹ̀mí èṣù ń dá ọmọbìnrin mi lóró gidigidi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọmọbìnrin mi wà lábẹ́ ìṣàkóso ẹ̀mí èṣù, ó sì ń jìyà gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa ipa ọ̀rọ̀ yìí mọ́ gẹ́gẹ́ bí àmì tó fa àfiyèsí sí ìṣẹ̀lẹ̀ tuntun, ní èdè Yorùbá tó ṣe kedere.
- source_word: Χαναναία
  choice: obìnrin ará Kénáánì
  rationale: Mátíù sọ ‘ará Kénáánì’ ní pàtó; èyí pa ìrántí ìtàn Ísírẹ́lì tí ọ̀rọ̀ náà ń mú wá mọ́, láì fi ‘ará Sírófòníṣíà’ ti ìtàn Mákù rọ́pò rẹ̀.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: láti agbègbè náà
  rationale: Nínú àyíká yìí, ὅρια ń tọ́ka sí ilẹ̀ tàbí agbègbè; gbolohun yìí jẹ́ Yorùbá àdánidá, ó sì bá ìtumọ̀ náà mu.
- source_word: ἐξελθοῦσα
  choice: jáde wá
  rationale: Ó sọ aorist participle náà di ìṣe tó tẹ̀ lé ara rẹ̀ lọ́nà àdánidá nínú Yorùbá, ó sì fi ojú-ìwòye ìtàn hàn.
- source_word: ἔκραζεν
  choice: ó sì ń ké pé
  rationale: Àmì ‘ń’ pa ìṣe tó ń lọ tàbí tó ń ṣẹlẹ̀ léraléra nínú imperfect náà mọ́.
- source_word: Ἐλέησόν με
  choice: ṣàánú fún mi
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì níyì fún ìbéèrè àánú tó ṣe kánjú.
- source_word: κύριε
  choice: Olúwa
  rationale: Pẹ̀lú àpèjúwe ‘Ọmọ Dáfídì,’ ‘Olúwa’ pa agbára ọ̀wọ̀ àti ìtumọ̀ Mèsáyà tó ṣeé ṣe mọ́ ju ‘ọ̀gá’ lọ.
- source_word: υἱὸς Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: Ìtumọ̀ tààrà yìí pa oyè Mèsáyà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ìlà ọba Dáfídì mọ́.
- source_word: κακῶς
  choice: gidigidi
  rationale: Ó mú bí ìpọ́njú ọmọ náà ṣe le tó hàn ní Yorùbá àdánidá.
- source_word: δαιμονίζεται
  choice: Ẹ̀mí èṣù ń dá ... lóró
  rationale: Ó fi hàn gbangba pé agbára ẹ̀mí èṣù ló fa ipò náà, ṣùgbọ́n kò fi ọ̀rọ̀ kan mú irú ìṣàkóso náà ṣe pàtó ju bí Gíríìkì ṣe sọ ọ́ lọ.
theological_decisions:
- issue: Ìtumọ̀ κύριε nínú ọ̀rọ̀ ìkíni Mèsáyà
  choice: Olúwa
  alternative: ọ̀gá
  rationale: Nítorí pé obìnrin náà tún pe Jésù ní ‘Ọmọ Dáfídì,’ ‘Olúwa’ pa ọ̀wọ̀ àti agbára Mèsáyà tó ṣeé ṣe mọ́ láì sọ pé obìnrin náà ti ṣe ìjẹ́wọ́ ẹ̀kọ́ ìgbàgbọ́ tó péye.
- issue: Ìtumọ̀ δαιμονίζεται
  choice: Ẹ̀mí èṣù ń dá ọmọbìnrin mi lóró gidigidi
  alternative: ẹ̀mí èṣù ti gba ọmọbìnrin mi
  rationale: Ọ̀rọ̀ Gíríìkì fi iṣẹ́ tàbí ìṣàkóso ẹ̀mí èṣù hàn, ṣùgbọ́n ó lè má sọ ìrísí rẹ̀ ní pàtó. Àṣàyàn yìí pa ìdí ẹ̀mí èṣù àti ìpọ́njú tó le mọ́, láì pinnu ‘ìgbà’ gẹ́gẹ́ bí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; ó jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Ọ̀rọ̀ ‘Sì kíyèsí i’ jẹ́ díẹ̀ ní àmì pàtó láti pa ìfà-àfiyèsí ἰδοὺ mọ́.
