  terminology: ‘Obìnrin ará Kénáánì,’ ‘Olúwa,’ àti ‘Ọmọ Dáfídì’ yẹ, wọ́n sì pa ọ̀rọ̀ Mátíù mọ́. ‘Ẹ̀mí èṣù ń dá ... lóró gidigidi’ jẹ́ ọ̀nà ìwòye tó ṣe kedere tí kò pinnu ìrísí ìṣàkóso ẹ̀mí èṣù ju ohun tí δαιμονίζεται sọ lọ. Àlàyé ìsàlẹ̀ ni a tún ṣe kí ó jẹ́ àṣàyàn tó wúlò, kí ó sì pa ìpò ìjìyà náà mọ́.
