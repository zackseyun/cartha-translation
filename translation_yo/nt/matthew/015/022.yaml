  source_fidelity: Ìtumọ̀ náà gba ìtàn akọkọ, ìkígbe tí imperfect ń fi hàn, ìpè ‘Olúwa, Ọmọ Dáfídì,’ àti bí ìpọ́njú ọmọbìnrin náà ṣe le. Síbẹ̀, ‘agbègbè náà’ kò pa ọ̀pọ̀ ‘àwọn agbègbè/ààlà wọ̀nyẹn’ mọ́ dáadáa, àti àlàyé ìsàlẹ̀ lọwọlọwọ yí ìpò ìṣẹ̀lẹ̀ tí ó ń lọ padà sí ‘ti gba’ láì sọ ìjìyà gidigidi náà.
