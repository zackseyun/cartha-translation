  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: yo
  text: Ṣùgbọ́n Peteru dáhùn, ó sì wí fún un pé, “Ṣàlàyé[a] òwe yìí fún wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Sọ òwe yìí fún wa,” tàbí “Jẹ́ kí òwe yìí yé wa.”
    reason: Ìfẹ̀hónúhàn ìtumọ̀ fún Φράσον.
lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: dáhùn
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist ti ἀποκρίνομαι tí ó ní ìtumọ̀ deponent; “dáhùn” fi ìṣe Peteru hàn ní èdè Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń fi ìyípadà kékeré tàbí ìtakora pẹ̀lẹ́ hàn; “Ṣùgbọ́n” bá ìlọsíwájú ọ̀rọ̀ náà mu.
- source_word: εἶπεν
  choice: ó sì wí
  rationale: “Wí” jẹ́ ọ̀nà ọ̀wọ̀ àti ti ìtàn láti túmọ̀ λέγω; pẹ̀lú “dáhùn,” ó pa ìṣètò Gíríìkì náà mọ́ láì di èdè àjèjì.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dative náà tọ́ka sí ẹni tí a bá sọ̀rọ̀; “fún un” jẹ́ àfihàn Yorùbá tó ṣe déédé.
- source_word: Φράσον
  choice: Ṣàlàyé
  rationale: Aorist imperative φράζω túmọ̀ sí láti sọ ohun kan di mímọ̀ tàbí kedere; “Ṣàlàyé” bá ìbéèrè fún òye mu jù.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dative náà wúlò gẹ́gẹ́ bí ẹni tí àlàyé náà jẹ́ fún; “fún wa” jẹ́ èdè Yorùbá àdánidá.
- source_word: παραβολὴν
  choice: òwe
  rationale: Nínú àyíká yìí παραβολή tọ́ka sí ọ̀rọ̀ àpẹẹrẹ tàbí ọ̀rọ̀ tí ó ní ìtumọ̀ jinlẹ̀; “òwe” jẹ́ ọ̀rọ̀ Yorùbá tí ó yé gbogbo ènìyàn, bí ó tilẹ̀ jẹ́ pé “àkàwé” tún ṣeé lò.
- source_word: ταύτην
  choice: yìí
  rationale: Ọ̀rọ̀ atọ́ka tó sún mọ́ni náà ń tọ́ka sí ọ̀rọ̀ tí Jesu ṣẹ̀ṣẹ̀ sọ; “yìí” ni àfiwé Yorùbá tó yẹ.
- source_word: ὁ Πέτρος
  choice: Peteru
  rationale: A ṣàkọsílẹ̀ orúkọ Πέτρος ní ìrísí Yorùbá tí a mọ̀ sí “Peteru.”
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A pa àkójọpọ̀ “dáhùn, ó sì wí” mọ́ láti tẹ̀lé ìṣètò orísun, ṣùgbọ́n a lo ọ̀rọ̀ àdánidá. Kò sí àlàyé ẹ̀kọ́ ìsìn tí a fi kún un.
