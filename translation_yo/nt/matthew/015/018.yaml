id: MAT.15.18
reference: Matthew 15:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ohun tí ń jáde láti ẹnu wá láti inú ọkàn; àwọn náà sì ni ń sọ ènìyàn di aláìmọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń sọ ènìyàn di ẹlẹ́gbin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: àwọn ohun tí ń jáde
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà àti àwòrán ohun tí ń jáde mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: στόματος
  choice: ẹnu
  rationale: Ìtumọ̀ tààrà yìí bá àyíká ọ̀rọ̀ sísọ mu, ó sì pa àwòrán ara tí Jésù lò mọ́.
- source_word: καρδίας
  choice: ọkàn
  rationale: ‘Ọkàn’ ní èdè Bíbélì ń tọ́ka sí inú ènìyàn, títí kan èrò àti ète ìwà rẹ̀; ó pa agbára ọ̀rọ̀ orísun mọ́.
- source_word: ἐξέρχεται
  choice: wá láti inú
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ẹyọ kan pẹ̀lú kókó ọ̀pọ̀ aláìlẹ́mìí, gbólóhùn yìí fi orísun àwọn ohun náà hàn ní Yorùbá àdánidá.
- source_word: κἀκεῖνα
  choice: àwọn ohun náà sì
  rationale: Ó tọ́ka padà ní kedere sí àwọn ohun tí ń jáde láti ẹnu, ó sì tún gbé ìtẹnumọ́ Gíríìkì náà jáde.
- source_word: κοινοῖ
  choice: ń sọ ... di aláìmọ́
  rationale: Nínú àyíká ìjíròrò nípa ìmọ́ àti àìmọ́, yíyan yìí pa èrò sísọ ènìyàn di aláìmọ́ mọ́, láìfi dandan mú un mọ́ àìmọ́ ẹ̀sìn nìkan tàbí ìbàjẹ́ ìwà nìkan.
- source_word: τὸν ἄνθρωπον
  choice: ènìyàn
  rationale: ‘Ènìyàn’ jẹ́ ẹyọ kan tó dúró fún gbogbo ènìyàn ní Yorùbá, ó sì gbé agbára aṣojú ti ọ̀rọ̀ Gíríìkì náà jáde láìsọ ọ́ di akọ nìkan.
theological_decisions:
- issue: Orísun àìmọ́ ìwà nínú ènìyàn
  choice: A fi hàn pé ohun tó ń sọ ènìyàn di aláìmọ́ ń jáde láti inú ọkàn, ó sì ń farahàn nínú ohun tí ẹnu ń sọ.
  alternative: Kí a ka ẹsẹ náà sí àìmọ́ nípa ìlànà ẹ̀sìn nìkan.
  rationale: Àyíká ẹsẹ náà fi ohun tó ń wọ ẹnu wé ohun tó ń jáde láti inú ènìyàn. ‘Ọkàn’ àti ‘di aláìmọ́’ pa ìforígbárí yìí mọ́ láìdín ìtumọ̀ náà kù sí ìlànà ayẹyẹ nìkan.
- issue: Ẹyọ aṣojú τὸν ἄνθρωπον
  choice: ènìyàn
  alternative: ọkùnrin náà
  rationale: Nínú Yorùbá, ‘ènìyàn’ jẹ́ ọ̀rọ̀ ẹyọ tó lè ṣojú gbogbo ènìyàn, gẹ́gẹ́ bí ἄνθρωπος ṣe ń ṣiṣẹ́ níbí; ‘ọkùnrin náà’ yóò dín ìtumọ̀ náà kù sí akọ láìní ẹ̀rí nínú àyíká.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. Àtúnṣe ‘àwọn ohun náà sì ni ó’ pa ìtẹnumọ́ κἀκεῖνα mọ́, nígbà tí ‘ènìyàn’ ń sọ ẹyọ aṣojú náà ní ọ̀nà àdánidá.
