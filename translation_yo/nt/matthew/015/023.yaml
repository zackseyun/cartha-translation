id: MAT.15.23
reference: Matthew 15:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: yo
  text: Ṣùgbọ́n kò dá a lóhùn rárá. Àwọn ọmọ-ẹ̀yìn rẹ̀ sì wá sọ́dọ̀ rẹ̀, wọ́n ń bẹ̀ ẹ́ léraléra pé, “Rán an lọ[a], nítorí ó ń kígbe ní ẹ̀yìn wa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lé e lọ.” Ọ̀rọ̀ àwọn ọmọ-ẹ̀yìn kò sọ ní kedere bóyá ohun tí wọ́n ní lọ́kàn ni, “Gba ìbéèrè rẹ̀, kí o sì rán an lọ,” tàbí pé, “Kàn lé e lọ kúrò lọ́dọ̀ wa.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ó ń tọ̀ wá lẹ́yìn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ibi tó wà (“ní ẹ̀yìn wa”) tàbí sí títọ ẹnì kan lẹ́yìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: kò dá a lóhùn kan
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtẹnumọ́ Gíríìkì hàn pé kò fún un ní ìdáhùn kankan.
- source_word: προσελθόντες
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò àwọn ọmọ-ẹ̀yìn sí ọ̀dọ̀ Jésù hàn ní èdè ìtàn Yorùbá tó ṣe kedere.
- source_word: ἠρώτουν
  choice: wọ́n ń bẹ̀ ẹ́ léraléra
  rationale: Àkókò imperfect náà ń tọ́ka sí ìbéèrè tó ń bá a lọ tàbí tó tún ń ṣẹlẹ̀; “léraléra” mú agbára yẹn jáde láìsọ ọ́ di ẹ̀bẹ̀ tó lágbára jù.
- source_word: Ἀπόλυσον αὐτήν
  choice: Rán an lọ
  rationale: 'Ó pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́: ó lè túmọ̀ sí kí Jésù yanjú ohun tó fẹ́ kí ó sì jẹ́ kó lọ, tàbí kí ó kàn lé e kúrò lọ́dọ̀ wọn.'
- source_word: κράζει
  choice: ó ń ké pè wá
  rationale: Ó fi ìpè ohùn rara tó ń bá a lọ hàn; “pè wá” jẹ́ àdánidá nínú àyíká yìí láìsọ pé àwọn ọmọ-ẹ̀yìn ni obìnrin náà ń bẹ̀bẹ̀ sí.
- source_word: ὄπισθεν ἡμῶν
  choice: láti ẹ̀yìn
  rationale: Ó pa ìtumọ̀ ipò ‘ní ẹ̀yìn wa’ mọ́, ṣùgbọ́n àyíká náà tún lè gbà ìtumọ̀ pé ó ń tọ̀ wọ́n lẹ́yìn.
theological_decisions:
- issue: Èrò àwọn ọmọ-ẹ̀yìn nínú Ἀπόλυσον αὐτήν
  choice: Rán an lọ
  alternative: Gba ohun tó ń béèrè, kí o sì jẹ́ kó lọ; tàbí lé e lọ kúrò lọ́dọ̀ wa
  rationale: Àṣẹ Gíríìkì náà kò sọ bóyá kí Jésù kọ́kọ́ dáhùn ìbéèrè obìnrin náà tàbí kí ó lé e lọ lásán. Ìtumọ̀ náà kò yan ọ̀kan lára àwọn méjèèjì, ó sì pa ìfọ̀rọ̀wérọ̀ inú ìtàn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti ìgbàlódé, ó sì yẹ fún ìkàwé gbangba. Àwọn ọ̀rọ̀ inú àmì àyọlò jẹ́ àdánidá, wọ́n sì pa àìdánilójú orísun mọ́.
