revisions:
- from: Ṣùgbọ́n kò dá a lóhùn kan. Àwọn ọmọ-ẹ̀yìn rẹ̀ sì tọ̀ ọ́ wá, wọ́n ń bẹ̀ ẹ́ léraléra pé, “Rán an lọ[a], nítorí ó ń ké pè wá láti ẹ̀yìn[b].”
  to: Ṣùgbọ́n kò dá a lóhùn rárá. Àwọn ọmọ-ẹ̀yìn rẹ̀ sì wá sọ́dọ̀ rẹ̀, wọ́n ń bẹ̀ ẹ́ léraléra pé, “Rán an lọ[a], nítorí ó ń kígbe ní ẹ̀yìn wa[b].”
  rationale: Àtúnṣe náà mú ọ̀rọ̀ “wa” tí ó wà nínú ἡμῶν padà sí ẹsẹ̀ náà, ó sì yí ọ̀nà ìwá-súnmọ́ àwọn ọmọ-ẹ̀yìn sí ọ̀rọ̀ Yorùbá tí ó kedere. Ó pa ìtumọ̀ aláìpinnu ti “Rán an lọ” mọ́, ó sì tún pa àwọn ìdákẹ́jẹ̀ ìtumọ̀ méjèèjì nínú àwọn àlàyé ẹsẹ̀ mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:15Z'
