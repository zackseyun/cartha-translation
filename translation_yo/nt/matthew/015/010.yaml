  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: yo
  text: Ó sì pe ọ̀pọ̀ ènìyàn náà wá sọ́dọ̀ rẹ̀, ó sì sọ fún wọn pé, “Ẹ gbọ́, ẹ sì lóye.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Ó sì
  rationale: Àsopọ̀ yìí ń tẹ ìtàn náà síwájú láìfi ìtumọ̀ míì kún un; ‘sì’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: προσκαλεσάμενος
  choice: pe ... wá sọ́dọ̀ rẹ̀
  rationale: Ó fi ìṣe pípè àwọn ènìyàn wá sí ọ̀dọ̀ ẹni hàn, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún participle aorist middle náà.
- source_word: τὸν ὄχλον
  choice: àwọn èrò náà
  rationale: ‘Àwọn èrò’ túmọ̀ sí ọ̀pọ̀ ènìyàn tí wọ́n péjọ, ó sì bá àyíká ìtàn náà mu.
- source_word: εἶπεν αὐτοῖς
  choice: ó sì sọ fún wọn pé
  rationale: Ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá, ó sì pa ìṣe sísọ àti ẹni tí a sọ fún mọ́.
- source_word: Ἀκούετε
  choice: Ẹ fetí sílẹ̀
  rationale: Imperative plural náà ń pe àwọn olùgbọ́ láti tẹ́tí sí ohun tí a ó sọ, kì í ṣe láti gbọ́ ohùn lásán.
- source_word: συνίετε
  choice: kí ẹ sì lóye
  rationale: Ó ń tọ́ka sí mímú ìtumọ̀ ohun tí wọ́n gbọ́, ‘lóye’ sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún un.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní; a lo ọ̀pọ̀ ẹni nínú àṣẹ ‘Ẹ fetí ... kí ẹ ...’ gẹ́gẹ́ bí Gíríìkì.
