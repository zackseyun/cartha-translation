revisions:
- from: Ó sì pe àwọn èrò náà wá sọ́dọ̀ rẹ̀, ó sì sọ fún wọn pé, “Ẹ fetí sílẹ̀, kí ẹ sì lóye.”
  to: Ó sì pe ọ̀pọ̀ ènìyàn náà wá sọ́dọ̀ rẹ̀, ó sì sọ fún wọn pé, “Ẹ gbọ́, ẹ sì lóye.”
  rationale: 'The revision preserves the antecedent summons, the crowd as a gathered group, and the two parallel plural commands. No Yoruba footnote is needed: “gbọ́” is a natural rendering of Ἀκούετε in this exhortative context, and the English lexical-alternative footnote does not represent a source-text ambiguity requiring reproduction.'
  reviewer_model: gpt-5.6-terra
