language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: yo
  text: Nígbà náà ni Jésù dá a lóhùn pé, “Obìnrin, ìgbàgbọ́ rẹ pọ̀ tóbi![a] Kí ó ṣẹlẹ̀ fún ọ gẹ́gẹ́ bí o ti fẹ́.” Ọmọbìnrin rẹ̀ sì di aláradá láti wákàtí náà lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbẹ́kẹ̀lé rẹ pọ̀ tóbi.” Ọ̀rọ̀ Gíríìkì πίστις tún lè ní ìtumọ̀ ìgbẹ́kẹ̀lé tàbí ìdúróṣinṣin, ṣùgbọ́n “ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti ìṣẹ́jú náà gan-an.” Ọ̀rọ̀ Gíríìkì náà ní tààrà, “láti wákàtí náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó so ìdáhùn Jésù mọ́ ìjíròrò tó ṣáájú rẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ àmì àkókò yìí ní Yorùbá.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: Jésù dá a lóhùn pé
  rationale: Àwọn ọ̀rọ̀ Gíríìkì méjèèjì parapọ̀ ṣe àgbékalẹ̀ ọ̀rọ̀ sísọ; gbolohun Yorùbá yìí mú ìtumọ̀ náà àti αὐτῇ (‘a’) wá láìṣe àtúnwí tí kò wọ́pọ̀.
- source_word: Ὦ γύναι
  choice: Ìwọ obìnrin
  rationale: Ìpè tààrà yìí pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́. Nínú àyíká yìí, kì í ṣe ọ̀rọ̀ ẹ̀gàn.
- source_word: μεγάλη σου ἡ πίστις
  choice: ìgbàgbọ́ rẹ tóbi
  rationale: Ó pa ìtẹnumọ́ titobi πίστις mọ́ ní Yorùbá àdánidá. ‘Ìgbàgbọ́’ ni ìtumọ̀ tó wọ́pọ̀ jù lọ ní àyíká ìgbẹ́kẹ̀lé obìnrin náà nínú Jésù.
- source_word: γενηθήτω σοι
  choice: kí ó rí fún ọ
  rationale: Ó fi agbára àṣẹ tàbí ìkéde ẹni-kẹta ti aorist passive imperative hàn, ní ọ̀nà tí ó mọ́gbọ́n dání ní Yorùbá.
- source_word: ὡς θέλεις
  choice: bí ìwọ ti fẹ́
  rationale: ‘Fẹ́’ mú ìfẹ́-inú tàbí ohun tí obìnrin náà ń fẹ́ ṣẹ hàn; fífi ‘ìwọ’ síbẹ̀ pa ìtẹnumọ́ arọ́pò-orúkọ mọ́.
- source_word: ἰάθη
  choice: a mú ... láradá
  rationale: Ìkọ́lé ‘a mú ... láradá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún passive ‘was healed,’ láìsọ ẹni tó ṣe ìwòsàn ní tààrà.
- source_word: θυγάτηρ
  choice: ọmọbìnrin
  rationale: Èyí ni ìbámu àdánidá àti tààrà fún ọmọ obìnrin.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: láti wákàtí náà
  rationale: Ó tẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí ‘láti ìṣẹ́jú náà gan-an’ nínú àyíká.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ìyìn Jésù
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àyíká náà ń tọ́ka sí ìgbẹ́kẹ̀lé obìnrin náà nínú agbára àti àánú Jésù. ‘Ìgbàgbọ́’ pa ìtumọ̀ ẹ̀sìn tó wọ́pọ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘ìgbẹ́kẹ̀lé’ hàn láìfi ‘ìṣòtítọ́’ tí kò ṣe pàtàkì jù nínú àyíká yìí lé e lórí.
- issue: Agbára γενηθήτω gẹ́gẹ́ bí ọ̀rọ̀ Jésù
  choice: kí ó rí fún ọ
  alternative: kí ó ṣẹlẹ̀ fún ọ; kí a ṣe é fún ọ
  rationale: Àṣàyàn náà pa ìrísí ìkéde/àṣẹ mọ́ láìṣàlàyé ẹni tó ń mú un ṣẹ tàbí láìsọ ẹ̀kọ́ ìsìn kan sí i.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ìwọ obìnrin’ jẹ́ ìpè tààrà tó ní ìtẹnumọ́, kì í ṣe ẹ̀gàn; ‘kí ó rí fún ọ’ sì pa ìwọ̀n ọ̀rọ̀ ìkéde Jésù mọ́.
