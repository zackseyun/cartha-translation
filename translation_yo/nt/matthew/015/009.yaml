id: MAT.15.9
reference: Matthew 15:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: yo
  text: “Ṣùgbọ́n wọ́n ń jọ́sìn mí lásán,[a] bí wọ́n ti ń kọ́ àwọn àṣẹ ènìyàn gẹ́gẹ́ bí ẹ̀kọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ ọ́ pé: “...nípa kíkọ́ àwọn àṣẹ ènìyàn gẹ́gẹ́ bí ẹ̀kọ́.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: lásán
  rationale: Ó túmọ̀ sí pé ìjọ́sìn náà kò ní èrè tàbí ète tó ní ìtumọ̀; “lásán” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá, ó sì pa ohùn ìbáwí náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn nínú àyíká ọ̀rọ̀ ìbáwí náà.
- source_word: σέβονταί με
  choice: wọ́n ń jọ́sìn mí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀wọ̀ àti ìjọ́sìn tí a ń darí sí Ọlọ́run; “jọ́sìn” ni ọ̀rọ̀ Yorùbá tó bá àyíká yìí mu jù.
- source_word: διδάσκοντες
  choice: bí wọ́n ti ń ... kọ́ni
  rationale: Ó pa ìbáṣepọ̀ participle náà mọ́, ó sì fi hàn pé èyí ni ọ̀nà tí ìjọ́sìn wọn fi di asán, láìfi ìtumọ̀ àkókò kan lé e lórí.
- source_word: διδασκαλίας
  choice: bí ẹ̀kọ́
  rationale: Ó ṣàlàyé ìbáṣepọ̀ tó há nínú Gíríìkì pé wọ́n gbé àwọn àṣẹ ènìyàn kalẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ tó ní ọlá àṣẹ.
- source_word: ἐντάλματα
  choice: àwọn àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn ìlànà tí a pàṣẹ, ó sì bá àyíká ẹ̀sìn mu.
- source_word: ἀνθρώπων
  choice: ènìyàn
  rationale: ἄνθρωπος jẹ́ ti gbogbo ènìyàn níbí, kì í ṣe ti akọ nìkan; “ènìyàn” pa ìyàtọ̀ láàárín ohun tó ti ọ̀dọ̀ ènìyàn wá àti ohun tó ti ọ̀dọ̀ Ọlọ́run wá mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: bí wọ́n ti ń fi àwọn àṣẹ ènìyàn kọ́ni bí ẹ̀kọ́
  alternative: bí wọ́n ti ń kọ́ni ní àwọn ẹ̀kọ́ tí í ṣe àṣẹ ènìyàn
  rationale: Gíríìkì náà há díẹ̀, ṣùgbọ́n ìtumọ̀ pàtàkì ni pé wọ́n ń kọ́ àwọn àṣẹ tó wá láti ọ̀dọ̀ ènìyàn pẹ̀lú ipò ẹ̀kọ́ aláṣẹ. Àṣàyàn yìí sọ ìbáṣepọ̀ náà di mímọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Agbára gbogbogbò ti ἀνθρώπων
  choice: ènìyàn
  alternative: àwọn ènìyàn
  rationale: Ọ̀rọ̀ orísun náà ń tọ́ka sí ọmọ aráyé lápapọ̀, kì í ṣe ọkùnrin nìkan. Ẹyọ “ènìyàn” jẹ́ àdánidá nínú àkójọpọ̀ “àṣẹ ènìyàn,” ó sì pa ìtakora ohun ti Ọlọ́run àti ohun ti ènìyàn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ènìyàn” gẹ́gẹ́ bí ọ̀rọ̀ gbogbogbò, nítorí náà kò nílò àlàyé akọ tàbí abo lọ́tọ̀.
