  terminology: “Jọ́sìn,” “àṣẹ,” àti “ènìyàn” bá ọ̀rọ̀ Gíríìkì mu dáadáa. “Ènìyàn” ń gbé agbára gbogbogbò ti ἀνθρώπων jáde, láìsọ pé akọ nìkan ni.
  issues:
