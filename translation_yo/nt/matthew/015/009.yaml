  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà: ìjọ́sìn wọn jẹ́ asán nítorí wọ́n ń gbé àṣẹ ènìyàn kalẹ̀ gẹ́gẹ́ bí ẹ̀kọ́. Síbẹ̀, ìkọ́ni náà nílò ìṣàtúnṣe kékeré kí ohun tí a ń kọ́ (àwọn àṣẹ ènìyàn) àti ipò tí a fi ń kọ́ ọ́ (gẹ́gẹ́ bí ẹ̀kọ́) lè hàn kedere.'
