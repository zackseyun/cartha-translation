  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: yo
  text: Jésù sì bi wọn pé, “Búrẹ́dì mélòó ni ẹ ní?” Wọ́n sì dáhùn pé, “Méje, àti ẹja kéékèèké díẹ̀[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹja” lásán; nínú èdè Gíríìkì, ọ̀rọ̀ náà wà ní ìrísí ìkékèèké, èyí tí ó lè tọ́ka sí ẹja kékeré.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: bi wọn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘ó sọ fún wọn,’ ohun tí Jésù sọ jẹ́ ìbéèrè; ‘bi wọn pé’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa iṣẹ́ ọ̀rọ̀ náà mọ́.
- source_word: Πόσους ἄρτους
  choice: Ìṣù búrẹ́dì mélòó
  rationale: ἄρτους jẹ́ ọ̀pọ̀ nǹkan tí a lè kà; ‘ìṣù búrẹ́dì’ fi hàn pé odidi búrẹ́dì ni a ń kà, kì í ṣe búrẹ́dì gẹ́gẹ́ bí oúnjẹ lásán.
- source_word: ἔχετε
  choice: ni ẹ ní
  rationale: Èyí jẹ́ ìbéèrè àsìkò ìsinsìnyí ní Yorùbá àdánidá, pẹ̀lú arọ́pò-orúkọ ọ̀pọ̀ fún àwọn ọmọ-ẹ̀yìn.
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì dáhùn pé
  rationale: δέ ń tẹ ìtàn náà síwájú láìfi ìtakò líle hàn; ‘sì’ bá iṣẹ́ yìí mu. ‘Dáhùn’ jẹ́ ti àdánidá nítorí pé wọ́n ń fèsì sí ìbéèrè.
- source_word: Ἑπτά
  choice: Méje
  rationale: Ìtumọ̀ tààrà ti nọ́ńbà náà.
- source_word: ὀλίγα
  choice: díẹ̀
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún iye kékeré tí a kò sọ pàtó.
- source_word: ἰχθύδια
  choice: ẹja kéékèèké
  rationale: Ọ̀nà ọ̀rọ̀ Gíríìkì jẹ́ àpèjúwe ohun kékeré, nítorí náà ‘kéékèèké’ pa ìtumọ̀ yẹn mọ́; àlàyé ìsàlẹ̀ fi àṣàyàn ‘ẹja’ lásán hàn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ‘ẹ’ fún ọ̀pọ̀ ẹni tí Jésù ń bá sọ̀rọ̀, a sì lo ‘búrẹ́dì’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀ tí òǹkàwé òde òní lè lóye.
