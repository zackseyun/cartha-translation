  source_fidelity: Ìtumọ̀ náà ń fi ìbéèrè Jésù, iye búrẹ́dì méje, àti iye kékeré ẹja kékeré hàn dáadáa. Lílo ‘bi wọn pé’ fún λέγει...Πόσους... jẹ́ ìmúrasílẹ̀ Yorùbá tó bójú mu fún ọ̀rọ̀ ìbéèrè náà, bí ó tilẹ̀ jẹ́ pé Gíríìkì náà ní ‘says.’
  naturalness: ‘Ìṣù búrẹ́dì’ kì í ṣe ọ̀nà Yorùbá àdánidá fún àwọn búrẹ́dì tí a lè kà, ó sì lè fa ìtumọ̀ ‘yam/bread roll’ tí kò dájú. ‘Búrẹ́dì mélòó’ jẹ́ kedere, ó sì jẹ́ àdánidá ní Yorùbá òde òní. Àwọn apá mìíràn jẹ́ ti ìforúkọsílẹ̀ tó dára.
