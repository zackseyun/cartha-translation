source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: yo
  text: Ẹ fi wọ́n sílẹ̀. Afọ́jú ni wọ́n; wọ́n jẹ́ amọ̀nà fún àwọn afọ́jú.[a] Ṣùgbọ́n bí afọ́jú kan bá ń ṣe amọ̀nà afọ́jú mìíràn,[b] àwọn méjèèjì yóò ṣubú sínú kòtò.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n jẹ́ amọ̀nà afọ́jú fún àwọn afọ́jú.”
    reason: lexical_alternative
  - marker: b
    text: Ẹyọ ọ̀rọ̀ inú òwe yìí dúró fún gbogbo irú ẹni bẹ́ẹ̀; kì í ṣe ọkùnrin nìkan ni ọ̀rọ̀ náà kàn.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ihò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Ẹ fi wọ́n sílẹ̀
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí kí wọ́n fi àwọn Farisí náà sílẹ̀ tàbí kí wọ́n má ṣe dá sí wọn; kò túmọ̀ sí ‘dárí jì wọ́n.’ Gbólóhùn Yorùbá yìí jẹ́ adayébá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: τυφλοί
  choice: Afọ́jú
  rationale: A pa àkàwé ìfọ́jú mọ́ láì fi àlàyé ‘nípa ẹ̀mí’ kún un, nítorí orísun náà kò ṣàlàyé rẹ̀ níhìn-ín.
- source_word: ὁδηγοὶ τυφλῶν
  choice: amọ̀nà àwọn afọ́jú
  rationale: ‘Amọ̀nà’ pa àwòrán ẹni tó ń tọ́ ẹlòmíràn sọ́nà mọ́; ó ṣe déédé pẹ̀lú ọ̀rọ̀-ìṣe ὁδηγῇ tó tẹ̀ lé e.
- source_word: τυφλὸς ... τυφλὸν
  choice: afọ́jú kan ... afọ́jú mìíràn
  rationale: Èyí pa ẹyọ ọ̀rọ̀ òwe Gíríìkì mọ́, ó sì ṣe kedere ní Yorùbá pé afọ́jú méjì ọ̀tọ̀ ni a ń sọ̀rọ̀ nípa wọn. ‘Afọ́jú’ kò fi akọ tàbí abo hàn ní Yorùbá.
- source_word: ἐὰν ὁδηγῇ
  choice: bí ... bá ń ṣe amọ̀nà
  rationale: Ìṣètò ‘bí ... bá’ jẹ́ ọ̀nà Yorùbá adayébá fún ipò gbogbogbò tí ἐάν pẹ̀lú subjunctive ń fi hàn; ‘ń ṣe amọ̀nà’ tún pa àwòrán ìtọ́sọ́nà mọ́.
- source_word: ἀμφότεροι
  choice: àwọn méjèèjì
  rationale: Ó fi hàn ní kedere pé ẹni tó ń ṣe amọ̀nà àti ẹni tí a ń tọ́ sọ́nà ni yóò jọ ṣubú.
- source_word: εἰς βόθυνον
  choice: sínú kòtò
  rationale: ‘Kòtò’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ihò tàbí ibi jíjìn tí ènìyàn lè ṣubú sí; ó pa àwòrán òwe náà mọ́.
- source_word: πεσοῦνται
  choice: yóò ṣubú
  rationale: Ó túmọ̀ ọjọ́ iwájú gẹ́gẹ́ bí àbájáde ìpèníjà náà ní ọ̀nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ àkàwé ‘afọ́jú’
  choice: A pa ‘afọ́jú’ mọ́ gẹ́gẹ́ bí àkàwé láì ṣàlàyé rẹ̀ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘afọ́jú nípa ẹ̀mí’ tàbí ‘amọ̀nà aláìlóye’
  rationale: Orísun náà lo àkàwé tó lágbára, kò sì túmọ̀ rẹ̀ sí ọ̀rọ̀ mìíràn. Fífi ‘nípa ẹ̀mí’ kún un yóò dín àìmọ̀ọ́mọ̀ tó wà nínú ọ̀rọ̀ náà kù, yóò sì fi ìtumọ̀ olùtumọ̀ sínú ẹsẹ náà.
- issue: Ọ̀rọ̀ akọ tàbí abo nínú òwe náà
  choice: ‘afọ́jú kan ... afọ́jú mìíràn,’ èyí tí kò fi akọ tàbí abo hàn ní Yorùbá
  alternative: ‘ọkùnrin afọ́jú kan ... ọkùnrin afọ́jú mìíràn’
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ ní gírámà, òwe náà ń sọ òtítọ́ gbogbogbò. Yorùbá kò fi akọ tàbí abo hàn nínú ‘afọ́jú’; fífi ‘ọkùnrin’ kún un yóò fi ohun tí kò ṣe pàtàkì sí ète orísun náà wọ ọ̀rọ̀.
translation_notes:
  register: A lo Yorùbá àkókò-òde tó bójú mu, tó ní iyì, tí àwọn òǹkàwé gbogbogbò lè lóye. A lo ‘Ẹ’ fún àṣẹ púpọ̀ tó wà nínú ἄφετε, a sì fi àmì ohùn sí ibi tí ó bá yẹ. Ìtòlẹ́sẹẹsẹ náà pa àwòrán afọ́jú, amọ̀nà, àti kòtò mọ́ láì ṣàlàyé ẹ̀kọ́ ìsìn kọjá ohun tí Gíríìkì sọ.
