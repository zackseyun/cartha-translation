review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast, the indefinite conditional force, the parental addressees, and δῶρον as “ẹ̀bùn.” However, “tí ìwọ ìbá fi jèrè láti ọ̀dọ̀ mi” introduces fi (“by means of/with”), which is not represented in the Greek and can obscure the passive sense, “be benefited from me.”
  naturalness: The sentence is generally clear and appropriately retains the open quotation, since Matthew 15:5 continues into the following verse. “Baba rẹ̀ tàbí ìyá rẹ̀” makes the possessive relation unambiguous in natural Standard Yoruba. “Tí ìwọ ìbá ti jèrè láti ọ̀dọ̀ mi” is a more idiomatic and source-faithful expression of the benefit that the parent might have received.
  terminology: “Ẹ̀bùn” is a sound rendering of δῶρον and properly avoids importing “Kọ́bánì” into Matthew’s main text. In the footnote, “ẹbọ” is a more accurate lexical alternative for “offering” than “ọrẹ,” which in modern Yoruba commonly means “friend” and is liable to mislead.
  issues:
  - severity: medium
    issue: The phrase “ìwọ ìbá fi jèrè láti ọ̀dọ̀ mi” uses fi.
    rationale: Fi adds an instrumental relation not present in ἐξ ἐμοῦ and does not clearly express that the parent would receive benefit from the speaker. Removing it better reflects the Greek passive ὠφεληθῇς.
  - severity: low
    issue: The footnote gives “ọrẹ” as the alternative for δῶρον.
    rationale: The audit trail’s alternative is “offering”; “ẹbọ” communicates that cultic alternative clearly in contemporary Standard Yoruba, whereas “ọrẹ” is ambiguous or misleading.
  - severity: low
    issue: The possessive pronoun follows only “ìyá” in “baba tàbí ìyá rẹ̀.”
    rationale: Although often understood distributively, placing rẹ̀ after both nouns makes explicit that both “father” and “mother” are the speaker’s parents.
  revised_text: Ṣùgbọ́n ẹ̀yin ń sọ pé, “Ẹnikẹ́ni tí ó bá sọ fún baba rẹ̀ tàbí ìyá rẹ̀ pé, ‘Ohun yòówù tí ìwọ ìbá ti jèrè láti ọ̀dọ̀ mi jẹ́ ẹ̀bùn[a],’”
  revised_footnotes:
  - marker: a
    text: Tàbí “ẹbọ.” Èrò ọ̀rọ̀ náà ni pé ohun tí a lè lò láti pèsè fún àwọn òbí ni a kéde pé a yà sí mímọ́ fún Ọlọ́run; fi wé Máàkù 7:11, níbi tí a ti lo ọ̀rọ̀ náà “Kọ́bánì.”
    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported instrumental marker, makes the possessive relation explicit for both parents, and replaces an ambiguous footnote alternative with the natural Yoruba equivalent of “offering.” It retains the deliberately unfinished quotation and does not add “Kọ́bánì” to Matthew’s text.
