revisions:
- from: Ṣùgbọ́n ẹ̀yin ń sọ pé, “Ẹnikẹ́ni tí ó bá sọ fún baba tàbí ìyá rẹ̀ pé, ‘Ohun yòówù tí ìwọ ìbá fi jèrè láti ọ̀dọ̀ mi jẹ́ ẹ̀bùn[a],’”
  to: Ṣùgbọ́n ẹ̀yin ń sọ pé, “Ẹnikẹ́ni tí ó bá sọ fún baba rẹ̀ tàbí ìyá rẹ̀ pé, ‘Ohun yòówù tí ìwọ ìbá ti jèrè láti ọ̀dọ̀ mi jẹ́ ẹ̀bùn[a],’”
  rationale: The revision removes an unsupported instrumental marker, makes the possessive relation explicit for both parents, and replaces an ambiguous footnote alternative with the natural Yoruba equivalent of “offering.” It retains the deliberately unfinished quotation and does not add “Kọ́bánì” to Matthew’s text.
  reviewer_model: gpt-5.6-terra
