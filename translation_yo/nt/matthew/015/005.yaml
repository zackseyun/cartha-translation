id: MAT.15.5
reference: Matthew 15:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin ń sọ pé, “Ẹnikẹ́ni tí ó bá sọ fún baba rẹ̀ tàbí ìyá rẹ̀ pé, ‘Ohun yòówù tí ìwọ ìbá ti jèrè láti ọ̀dọ̀ mi jẹ́ ẹ̀bùn[a],’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹbọ.” Èrò ọ̀rọ̀ náà ni pé ohun tí a lè lò láti pèsè fún àwọn òbí ni a kéde pé a yà sí mímọ́ fún Ọlọ́run; fi wé Máàkù 7:11, níbi tí a ti lo ọ̀rọ̀ náà “Kọ́bánì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ṣùgbọ́n ẹ̀yin ń sọ pé
  rationale: “Ṣùgbọ́n” pa agbára ìtakora δὲ mọ́; “ẹ̀yin” fi àfiyèsí orúkọ-arọ́pò-ọ̀rọ̀ tí a sọ gbangba hàn, “ń sọ” sì tú ìṣe ìsinsìnyí λέγετε ní ọ̀nà Yorùbá àdánidá.
- source_word: Ὃς ἂν εἴπῃ
  choice: Ẹnikẹ́ni tí ó bá sọ
  rationale: Àkójọpọ̀ ὅς, ἄν àti subjunctive ń tọ́ka sí ipò gbogbogbò tí kò dá lórí ẹni kan pàtó; ọ̀rọ̀ Yorùbá yìí pa ìtumọ̀ “whoever says” mọ́.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: fún baba tàbí ìyá rẹ̀
  rationale: “Fún” fi ẹni tí a bá sọ̀rọ̀ sí hàn; “rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé baba tàbí ìyá ẹni náà ni.
- source_word: Δῶρον
  choice: ẹ̀bùn
  rationale: “Ẹ̀bùn” ni ìtumọ̀ pẹ̀tẹ́lẹ̀ ti δῶρον, ó sì yẹra fún fífi ọ̀rọ̀ “Kọ́bánì” ti Máàkù 7:11 wọ inú ọ̀rọ̀ Mátíù.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Ohun yòówù tí ìwọ ìbá fi jèrè láti ọ̀dọ̀ mi
  rationale: “Ohun yòówù” pa àìsọ ohun kan pàtó mọ́; “ìbá fi jèrè” fi àǹfààní tí òbí ìbá rí hàn, “láti ọ̀dọ̀ mi” sì tẹ̀lé ìtọ́sọ́nà ἐξ ἐμοῦ.
theological_decisions:
- issue: Bóyá kí a fi ọ̀rọ̀ ìlérí pàtó “Kọ́bánì” sínú ọ̀rọ̀ Mátíù
  choice: A lo “ẹ̀bùn” gẹ́gẹ́ bí δῶρον ṣe wí.
  alternative: “ọrẹ tí a yà sí mímọ́ fún Ọlọ́run” tàbí “Kọ́bánì”
  rationale: Mátíù lo δῶρον, kì í ṣe κορβᾶν bí Máàkù 7:11. Ìtumọ̀ náà pa ọ̀rọ̀ Mátíù mọ́, ó sì ṣàlàyé ìtumọ̀ ẹbọ rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún òǹkàwé òde òní. Àwọn àmì ọ̀rọ̀ fi hàn pé ẹsẹ yìí ń bẹ láàárín gbólóhùn tí yóò tẹ̀ síwájú ní ẹsẹ tó tẹ̀ lé e.
