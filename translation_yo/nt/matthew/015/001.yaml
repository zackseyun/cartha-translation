base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: yo
  text: Nígbà náà ni àwọn Farisí àti àwọn akọ̀wé[b] láti Jerúsálẹ́mù wá sọ́dọ̀ Jésù[a], wọ́n sì wí pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wá sún mọ́ Jésù.”
    reason: lexical_alternative
  - marker: b
    text: Ní àyíká yìí, “àwọn akọ̀wé” tún lè túmọ̀ sí “àwọn amòye nínú Òfin” tàbí “àwọn olùkọ́ Òfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àmì àkókò tó ń ṣí ìṣẹ̀lẹ̀ tó tẹ̀ lé e sílẹ̀, ó sì bá ìṣàn ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: προσέρχονται
  choice: wá sọ́dọ̀
  rationale: Ó fi ìlọsíwájú sí ọ̀dọ̀ Jésù hàn; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì lè túmọ̀ sí ‘sún mọ́’ pẹ̀lú.
- source_word: τῷ Ἰησοῦ
  choice: sọ́dọ̀ Jésù
  rationale: Dative náà ń tọ́ka sí ẹni tí wọ́n tọ̀ wá bá; ‘sọ́dọ̀’ bá ọ̀rọ̀-ìṣe náà mu dáadáa.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: láti Jerúsálẹ́mù
  rationale: ἀπό ń fi ibi tí wọ́n ti wá hàn láìfi kún un pé a rán wọn níṣẹ́ láṣẹ.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ ẹ̀sìn àti ìtàn Júù ni; ìtumọ̀ àfọwọ́kọ tí ó ti wọ́pọ̀ ní Yorùbá ni a lò.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Ó pa ìrísí ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé ní àyíká yìí àwọn amòye tàbí olùkọ́ Òfin ni wọ́n.
- source_word: καὶ
  choice: àti
  rationale: Ó so ẹgbẹ́ méjèèjì pọ̀ lọ́nà tààrà.
- source_word: λέγοντες
  choice: wọ́n sì wí pé
  rationale: Ó ṣí ọ̀rọ̀ tààrà tó ń bọ̀ nínú ẹsẹ tó tẹ̀ lé e; gbólóhùn aláìparí yìí mọ̀ọ́mọ̀ tẹ̀ lé ìṣètò orísun.
theological_decisions:
- issue: Àkókò ìtàn lọ́wọ́lọ́wọ́ (historical present)
  choice: Lo ‘wá’ nínú ìtàn náà
  alternative: ‘wá’ tún lè jẹ́ àkókò tó kọjá ní ìtumọ̀ Yorùbá, tàbí kí a sọ ‘wọ́n tọ Jésù wá’
  rationale: Yorùbá kì í fi àkókò hàn lórí ọ̀rọ̀-ìṣe gẹ́gẹ́ bí Gíríìkì tàbí Gẹ̀ẹ́sì. ‘Nígbà náà ni ... wá’ pa ìyára àti ìsúnmọ́ ìṣẹ̀lẹ̀ mọ́ láìfipá mú ìyàtọ̀ àkókò tí kò bá èdè Yorùbá mu.
translation_notes:
  register: Yorùbá àtẹ̀jáde tó níyì, tó ṣe kedere, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a pa àwọn orúkọ ìtàn mọ́ ní ìrísí tí ó wọ́pọ̀ nínú Yorùbá.
