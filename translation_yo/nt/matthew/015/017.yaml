id: MAT.15.17
reference: Matthew 15:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: yo
  text: Ṣé ẹ kò lóye pé gbogbo ohun tí ń wọ inú ẹnu ń lọ sínú ikùn, a sì ń yọ ọ́ jáde sínú ilé ìgbọ̀nsẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohunkóhun tí ń wọ inú ẹnu ... a sì ń yọ ọ́ jáde sí ibi ìgbẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νοεῖτε
  choice: yé e
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí òye ọpọlọ nípa kókó ọ̀rọ̀ Jésù; ‘ṣé ẹ kò yé e’ jẹ́ ọ̀nà àdánidá láti fi ìbéèrè ìbáwí náà hàn ní Yorùbá òde òní.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: gbogbo ohun tí ó bá wọ
  rationale: Ó pa ìtumọ̀ gbogbogbò ti ẹ̀ka ọ̀rọ̀ Gíríìkì náà mọ́, ó sì bá ọ̀nà tí Yorùbá fi ń sọ ohun tí ó lè ṣẹlẹ̀ lápapọ̀ mu.
- source_word: εἰς τὸ στόμα
  choice: wọ ẹnu
  rationale: Ó fi ìṣípòpadà sínú ẹnu hàn ní ṣókí àti ní ọ̀nà àdánidá.
- source_word: κοιλίαν
  choice: ikùn
  rationale: Nínú àyíká yìí, κοιλία ń tọ́ka sí ẹ̀yà oúnjẹ; ‘ikùn’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ṣe kedere, tí kò sì ní ìtumọ̀ àjèjì.
- source_word: χωρεῖ
  choice: ń lọ sínú
  rationale: Ó ṣàfihàn bí ohun tí a jẹ ṣe ń kọjá lọ sínú ikùn, láìfi ìtumọ̀ míì kún un.
- source_word: ἀφεδρῶνα
  choice: ilé ìgbọ̀nsẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ibi ìyọ̀nda ìgbẹ́; ‘ilé ìgbọ̀nsẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó níyì, tí ó sì bá iṣẹ́ ibi náà mu.
- source_word: ἐκβάλλεται
  choice: a sì ń yọ ọ́ jáde
  rationale: Ó pa ìṣe aláìní olùṣe pàtó àti ìtumọ̀ ìtújáde ohun kúrò nínú ara mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ Jésù yìí pẹ̀lú àwọn òfin ìwẹ̀nùmọ́ àṣà ìsìn
  choice: Túmọ̀ àlàyé nípa bí oúnjẹ ṣe ń gba inú ara kọjá ní tààrà, láìfi gbólóhùn pé gbogbo oúnjẹ ti di mímọ́ kún ẹsẹ yìí.
  alternative: Fi àlàyé ìtumọ̀ kan kún un pé nípa bẹ́ẹ̀ Jésù kéde gbogbo oúnjẹ ní mímọ́.
  rationale: Ẹsẹ yìí fúnra rẹ̀ ṣàlàyé bí ohun tí ó wọ ẹnu ṣe ń kọjá nínú ara, gẹ́gẹ́ bí ara ìjiyàn Jésù nípa ohun tí ń sọ ènìyàn di aláìmọ́. Kò ní àlàyé tí Máàkù 7:19 fi kún un ní tààrà, nítorí náà a kò gbọ́dọ̀ mú ìtumọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú gbólóhùn náà wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìbéèrè náà ní ohùn ìbáwí ṣùgbọ́n ó ṣì níyì; àwọn ọ̀rọ̀ nípa iṣẹ́ ara jẹ́ kedere láìsọ ọ́ ní ọ̀nà rírùn tàbí ẹlẹ́gàn.
