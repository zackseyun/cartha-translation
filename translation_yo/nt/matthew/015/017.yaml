  to: Ṣé ẹ kò lóye pé gbogbo ohun tí ń wọ inú ẹnu ń lọ sínú ikùn, a sì ń yọ ọ́ jáde sínú ilé ìgbọ̀nsẹ̀?[a]
  rationale: A ṣe àtúnṣe gírámà àti ìlò ọ̀rọ̀ Yorùbá nìkan, láìyí ìtumọ̀ tàbí ìṣètò ìjiyàn Jésù padà. Ìtumọ̀ náà kò fi ìkéde kan nípa mímọ́ gbogbo oúnjẹ kún ẹsẹ náà.
