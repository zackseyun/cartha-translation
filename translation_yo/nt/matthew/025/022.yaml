id: MAT.25.22
reference: Matthew 25:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: yo
  text: Ẹni tí ó gba tálẹ́ǹtì méjì náà sì tún súnmọ́ ọn, ó ní, “Olúwa[a], o fi tálẹ́ǹtì méjì lé mi lọ́wọ́. Wò ó, mo jèrè tálẹ́ǹtì méjì sí i[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà ni kyrios, tí a sábà máa ń túmọ̀ sí “Olúwa”; nínú àkàwé yìí, ó tún lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí a fi ń pe ọ̀gá.
    reason: alternative_reading
  - marker: b
    text: Tálẹ́ǹtì jẹ́ ẹyọ ìwọ̀n owó tó pọ̀ nígbà náà; kì í ṣe ẹ̀bùn àbínibí tàbí òye àkànṣe.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: súnmọ́ ọn
  rationale: Ó ń sọ pé ìránṣẹ́ náà tọ olúwa rẹ̀ wá láti bá a sọ̀rọ̀; ‘súnmọ́ ọn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ ìtọ̀wọ́wá mọ́.
- source_word: δὲ καὶ
  choice: sì tún
  rationale: Ó fi ìtẹ̀síwájú ìtàn àti pé ẹni yìí náà ṣe bí ẹni tó ṣáájú hàn.
- source_word: ὁ τὰ δύο τάλαντα
  choice: Ẹni tí ó gba tálẹ́ńtì méjì náà
  rationale: Àyíká ìtàn fi hàn pé ẹni tí a fi iye yìí lé lọ́wọ́ ni; fífi ‘gba’ kún un mú ẹni tí a ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè κύριος lè túmọ̀ sí ‘Olúwa’ tàbí ọ̀rọ̀ ọ̀wọ̀ fún ọ̀gá; ‘Olúwa’ pa ìbámu pẹ̀lú ìtumọ̀ àkọ́kọ́ mọ́, a sì ṣàlàyé àṣàyàn kejì nínú àlàyé ìsàlẹ̀.
- source_word: παρέδωκας
  choice: o fi ... lé mi lọ́wọ́
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún fífi ohun-ìní lé ẹnì kan lọ́wọ́, ó sì pa agbára παραδίδωμι mọ́.
- source_word: ἴδε
  choice: Wò ó
  rationale: Ó fa àfiyèsí olùgbọ́ sí èsì náà ní ọ̀nà Yorùbá òde òní.
- source_word: ἄλλα δύο τάλαντα
  choice: tálẹ́ńtì méjì sí i
  rationale: ‘Sí i’ fi hàn pé iye tó dọ́gba ni a fi kún iye àkọ́kọ́.
- source_word: ἐκέρδησα
  choice: mo jèrè
  rationale: ‘Jèrè’ túmọ̀ κερδαίνω gẹ́gẹ́ bí rírí èrè tàbí àfikún, láì sọ ọ̀nà pàtó tí a gbà rí i.
- source_word: τάλαντα
  choice: tálẹ́ńtì
  rationale: A pa orúkọ ẹyọ ìwọ̀n owó ayé àtijọ́ mọ́, pẹ̀lú àlàyé pé kì í ṣe ẹ̀bùn àbínibí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ ìpè àkàwé yìí
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ κύριος àti ìbámu rẹ̀ pẹ̀lú lílò Májẹ̀mú Tuntun mọ́; síbẹ̀, nínú àyíká àkàwé yìí ó tún lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí ìránṣẹ́ fi ń pe ọ̀gá rẹ̀, èyí tí àlàyé ìsàlẹ̀ jẹ́ kedere.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní ibi tí ó bá yẹ. ‘Fi ... lé mi lọ́wọ́’ àti ‘mo jèrè’ jẹ́ ọ̀rọ̀ àdánidá, kedere fún òǹkàwé gbogbogbò, láì sọ àlàyé ẹ̀kọ́ ìgbàgbọ́ tí orísun kò sọ.
