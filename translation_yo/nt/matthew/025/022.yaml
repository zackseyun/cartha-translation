  rationale: 'Àtúnṣe náà jẹ́ ti ìlànà ìkọ̀wé nìkan: a yí ‘tálẹ́ńtì’ padà sí ‘tálẹ́ǹtì’ nínú ẹsẹ̀ àti nínú àlàyé ìsàlẹ̀. Ìtumọ̀, ìforúkọsílẹ̀ àwọn àmì àlàyé, àti ìdúró àìdánilójú tí κύριε lè ní nínú àyíká àkàwé náà ni a pa mọ́.'
