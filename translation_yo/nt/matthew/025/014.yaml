id: MAT.25.14
reference: Matthew 25:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: yo
  text: Nítorí ó dàbí ọkùnrin kan tí ó ń lọ sí ìrìn-àjò; ó pe àwọn ẹrú tirẹ̀[a], ó sì fi ohun-ìní rẹ̀ lé wọn lọ́wọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́ tirẹ̀.” Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí. Níhìn-ín, a yan “ẹrú” nítorí pé ipò ìní olúwa àti àṣẹ rẹ̀ ṣe pàtàkì nínú àkàwé náà.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Nítorí ó dà bí
  rationale: Ó fi àfiwé ìtúmọ̀ sí ohun tí a sọ ṣáájú hàn. Fífi “ó dà bí” kún un mú gbólóhùn Gíríìkì tí a fi ohun kan sílẹ̀ di Yorùbá àdánidá.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Ní àkàwé yìí, ọ̀rọ̀ náà ń tọ́ka sí ọkùnrin kan pàtó, kì í ṣe gbogbo ènìyàn lápapọ̀.
- source_word: ἀποδημῶν
  choice: tí ó ń lọ sí ìrìn-àjò
  rationale: Ó túmọ̀ sí pílọ kúrò ní ibìkan sí ibòmíràn fún ìrìn-àjò, láìfi dandan sọ pé ó lọ sí òkè òkun.
- source_word: ἐκάλεσεν
  choice: tí ó pe
  rationale: “Pe” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìṣe pípè àwọn tó wà lábẹ́ àṣẹ rẹ̀ mu.
- source_word: τοὺς ἰδίους δούλους
  choice: àwọn ẹrú tirẹ̀
  rationale: “Ẹrú” pa ipò ìdè àti àṣẹ olúwa mọ́, èyí tó ṣe pàtàkì nínú àkàwé yìí; “tirẹ̀” sì dúró fún ἰδίους.
- source_word: παρέδωκεν
  choice: fi ... lé wọn lọ́wọ́
  rationale: Àpólà Yorùbá yìí fi hàn pé ó gbé ohun náà fún wọn láti máa bójú tó, pẹ̀lú ojúṣe.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ohun-ìní rẹ̀
  rationale: Ó tọ́ka sí gbogbo ohun tàbí dúkìá tí ọkùnrin náà ní.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος ní àyíká ilé àti àkàwé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: A yan “ẹrú” nítorí pé ipò ìdè àti àṣẹ ẹni tó ni wọn hàn gbangba nínú àkàwé náà. Àkọsílẹ̀ ìsàlẹ̀ fi ọ̀nà míì tó ṣeé ṣe hàn láìbo òtítọ́ ìgbé-ayé àwùjọ ọ̀rọ̀ Gíríìkì náà mọ́lẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì pa ìṣàn àfiwé àti ojúṣe ìtọ́jú dúkìá mọ́.
