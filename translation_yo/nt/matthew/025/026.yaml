source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: yo
  text: Ṣùgbọ́n olúwa rẹ̀ dá a lóhùn pé, “Ìránṣẹ́ búburú àti ọ̀lẹ![a] Ṣé o mọ̀ pé mo ń ká níbi tí èmi kò gbìn, mo sì ń kó jọ láti ibi tí èmi kò fọ́n ká?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì fún “ìránṣẹ́” tún lè túmọ̀ sí “ẹrú.”
    reason: lexical_alternative
  - marker: b
    text: 'A tún lè ka apá yìí bí gbólóhùn ìjẹ́rìí pé: “O mọ̀ pé mo ń ká níbi tí èmi kò gbìn, mo sì ń kó jọ láti ibi tí èmi kò fọ́n ká.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ
  choice: Ṣùgbọ́n olúwa rẹ̀ dá a lóhùn pé
  rationale: Ọ̀rọ̀ yìí mú ìyípadà kékeré tí δέ ń fi hàn àti ìtumọ̀ àdáhùn ἀποκριθείς jáde ní Yorùbá àdánidá. “Olúwa rẹ̀” bá ipò ẹni tó ní àṣẹ lórí ìránṣẹ́ nínú àkàwé mu, láìfi dandan sọ ọ́ di orúkọ oyè Kristi.
- source_word: Πονηρὲ δοῦλε καὶ ὀκνηρέ
  choice: Ìránṣẹ́ búburú àti ọ̀lẹ
  rationale: “Búburú” pa ìdájọ́ ìwà inú πονηρός mọ́; “ọ̀lẹ” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ὀκνηρός. “Ìránṣẹ́” jẹ́ àdánidá nínú àkàwé yìí, bí ó tilẹ̀ jẹ́ pé δοῦλος tún lè túmọ̀ sí ẹrú.
- source_word: ᾔδεις ὅτι
  choice: O mọ̀ pé
  rationale: Ó fi ohun tí ìránṣẹ́ náà mọ̀ hàn ní tààrà, gẹ́gẹ́ bí ìtumọ̀ οἶδα nínú àyíká yìí.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: mo ń ká níbi tí èmi kò gbìn
  rationale: “Ká” àti “gbìn” pa àwòrán iṣẹ́ oko mọ́, wọ́n sì jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání.
- source_word: καὶ συνάγω ὅθεν οὐ διεσκόρπισα
  choice: mo sì ń kó jọ láti ibi tí èmi kò fọ́n ká
  rationale: “Kó jọ” túmọ̀ συνάγω, “láti ibi” sì tẹ̀lé ὅθεν. “Fọ́n ká” pa ìtumọ̀ gangan διασκορπίζω mọ́ láìfi ohun tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Agbára gbólóhùn ìkẹyìn àti àmì ìbéèrè
  choice: Túmọ̀ ọ́ bí ìbéèrè àsọyé pẹ̀lú “àbí?”
  alternative: 'Ka a bí gbólóhùn ìjẹ́rìí: “O mọ̀ pé mo ń ká níbi tí èmi kò gbìn, mo sì ń kó jọ láti ibi tí èmi kò fọ́n ká.”'
  rationale: Gíríìkì kò ní àmì ìbéèrè inú àkọsílẹ̀ ọ̀rọ̀ fúnra rẹ̀ ní ọ̀nà tó yanju ọ̀ràn náà; ó lè jẹ́ ìjẹ́rìí tàbí ìbéèrè àsọyé tí olúwa fi ń yí ọ̀rọ̀ ìránṣẹ́ náà padà sí i. A yan ìbéèrè àsọyé nínú àkọ́kọ́, ṣùgbọ́n a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ δοῦλος nínú ipò àwùjọ àkàwé náà
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: “Ìránṣẹ́” jẹ́ Yorùbá àdánidá fún ẹni tó ń ṣiṣẹ́ lábẹ́ olúwa nínú àkàwé, ṣùgbọ́n “ẹrú” tún ṣeé gbà gẹ́gẹ́ bí ìtumọ̀ tó tẹnu mọ́ ipò ẹni tí olúwa ní lórí.
translation_notes:
  register: Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá jẹ́ àdánidá. A pa àwòrán iṣẹ́ oko àti àìdánilójú bóyá gbólóhùn ìkẹyìn jẹ́ ìbéèrè àsọyé tàbí ìjẹ́rìí mọ́.
