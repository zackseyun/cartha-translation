  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ Gíríìkì mọ́ ní pàtàkì: olúwa náà dá ìránṣẹ́ rẹ̀ lóhùn, ó pè é ní ẹni búburú àti ọ̀lẹ, ó sì tọ́ka sí kíká níbi tí kò gbìn àti kíkó jọ láti ibi tí kò fọ́n ká. “Láti ibi” dara fún ὅθεν, nítorí ó ní ìrísí ‘láti ibi tí.’ Síbẹ̀, “àbí?” jẹ́ àmì ìbéèrè ìfẹ́múlẹ̀ tí ó lè dín agbára ìbéèrè àsọyé kù; “Ṣé ...?” jẹ́ ọ̀nà tó mọ́gbọ́n dání jù lọ láti fi ìbéèrè náà hàn. A kò fi ohun kan, bíi ‘irúgbìn,’ kún ‘fọ́n ká,’ nítorí Gíríìkì kò sọ ohun náà ní kedere.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa tó ṣe kedere. Àtúnṣe kékeré sí “Ṣé o mọ̀ pé ...?” mú ìbéèrè olúwa náà dà bí Yorùbá àdánidá díẹ̀ síi. Pípa àkọsílẹ̀ ìsàlẹ̀ méjì yà tún mú ibi tí àmì àlàyé kọ̀ọ̀kan tọ́ka sí hàn gbangba.
  terminology: “Olúwa rẹ̀” bá κύριος mu nínú àkàwé yìí; “ìránṣẹ́” jẹ́ ìtumọ̀ àdánidá fún δοῦλος, pẹ̀lú “ẹrú” gẹ́gẹ́ bí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀. “Búburú,” “ọ̀lẹ,” “ká,” “gbìn,” “kó jọ,” àti “fọ́n ká” pa ọ̀rọ̀ àti àwòrán iṣẹ́ oko nínú orísun mọ́.
