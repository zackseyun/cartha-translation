id: MAT.25.38
reference: Matthew 25:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: yo
  text: Nígbà wo sì ni a rí ọ bí àlejò[a], tí a sì gbà ọ́ sílé[b], tàbí tí a rí ọ ní ìhòòhò[c], tí a sì fi aṣọ wọ̀ ọ́?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “bí àjèjì.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹni tí a kò mọ̀, ẹni tí kì í ṣe ara àwùjọ ẹni, tàbí ọmọ ilẹ̀ òkèèrè; níhìn-ín, ó ń tọ́ka sí ẹni tí ó nílò ìgbàlejò.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “kó wọlé” tàbí “gbà wọlé”; níhìn-ín, ìtumọ̀ rẹ̀ ni láti gbà ẹnì kan sílé kí a sì ṣe àlejò sí i.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “tí aṣọ rẹ̀ kò tó.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí kò wọ aṣọ tàbí ẹni tí kò ní aṣọ tó péye.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: nígbà wo
  rationale: Ó jẹ́ ọ̀rọ̀ ìbéèrè nípa àkókò; “nígbà wo” ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: δέ
  choice: sì
  rationale: Níhìn-ín, δέ so ìbéèrè yìí mọ́ èyí tó ṣáájú lọ́nà pẹ̀lẹ́; “sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu láìfi ìtakò kún un.
- source_word: ξένον
  choice: bí àlejò
  rationale: ξένος ń tọ́ka sí ẹni tí kì í ṣe ojúlùmọ̀ tàbí ẹni tó wà lóde àwùjọ ẹni, tó sì nílò àlejò ṣíṣe; “bí àlejò” pa ìtumọ̀ yẹn mọ́ láìdín un kù sí ọmọ ilẹ̀ òkèèrè.
- source_word: συνηγάγομεν
  choice: gbà ọ́ sílé
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ lè jẹ́ “kó jọ” tàbí “gbà wọlé,” ní àyíká yìí ó túmọ̀ sí fífi àlejò ṣíṣe sí ẹni; “gbà ọ́ sílé” jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: γυμνὸν
  choice: ní ìhòòhò
  rationale: γυμνός lè túmọ̀ sí ẹni tí kò wọ aṣọ rárá tàbí ẹni tí aṣọ rẹ̀ kò tó; “ní ìhòòhò” pa ìtumọ̀ pàtàkì mọ́, a sì ṣàlàyé ìtumọ̀ kejì nínú àlàyé ìsàlẹ̀.
- source_word: περιεβάλομεν
  choice: fi aṣọ wọ̀ ọ́
  rationale: Nínú àyíká yìí, περιβάλλω túmọ̀ sí fífi aṣọ bo tàbí wọ ẹnì kan; gbólóhùn yìí jẹ́ ti àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ξένος nínú àkàwé ìdájọ́ tí ó dá lórí àánú àti àlejò ṣíṣe
  choice: àlejò
  alternative: àjèjì tàbí ọmọ ilẹ̀ òkèèrè
  rationale: “Àlejò” mú ipò ẹni tí a kò mọ̀ tí ó nílò ìgbàlejò jáde, láìfi dandan sọ pé ó jẹ́ ọmọ orílẹ̀-èdè mìíràn. Èyí pa ìtumọ̀ ìbáṣepọ̀ àti àánú inú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ìwọ̀n àìní aṣọ tí γυμνός ń tọ́ka sí
  choice: ní ìhòòhò, pẹ̀lú àlàyé pé ó tún lè túmọ̀ sí àìní aṣọ tó péye
  alternative: ní aṣọ tí kò tó
  rationale: Ọ̀rọ̀ Gíríìkì gba ìtumọ̀ méjèèjì; mímú “ní ìhòòhò” sínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé ìsàlẹ̀, pa àìdánilójú ìtumọ̀ orísun mọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó níyì, tó sì ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtò [a][b] wà lẹ́yìn “gbà ọ́ sílé,” nítorí [a] ṣàlàyé “àlejò,” [b] sì ṣàlàyé “gbà ... sílé”; [c] wà lẹ́yìn gbólóhùn tó ní “ìhòòhò” àti fífi aṣọ wọ̀.
