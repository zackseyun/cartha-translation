  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: yo
  text: Ó sì máa mú àwọn àgùntàn dúró ní ìhà ọ̀tún rẹ̀, ṣùgbọ́n àwọn ewúrẹ́ ní ìhà òsì rẹ̀.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ọmọ ewúrẹ́’; ọ̀rọ̀ Gíríìkì náà, ἐρίφια, lè tọ́ka sí àwọn ewúrẹ́ kéékèèké.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, Gíríìkì náà ní, ‘láti ọ̀tún rẹ̀ ... láti òsì’; èyí jẹ́ ọ̀nà ìsọ̀rọ̀ fún fífi wọn sí ẹ̀gbẹ́ ọ̀tún àti ẹ̀gbẹ́ òsì rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: máa fi ... sí
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú tó túmọ̀ sí mímú kí ohun kan dúró tàbí wà ní ipò kan. ‘Máa fi ... sí’ jẹ́ èdè Yorùbá àdánidá fún gbígbé àwọn ẹgbẹ́ méjèèjì sí ipò wọn.
- source_word: πρόβατα
  choice: àwọn àgùntàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún sheep; àfikún ‘àwọn’ fi hàn pé ẹgbẹ́ ẹranko ni.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: sí ọwọ́ ọ̀tún rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àṣà-ọrọ fún ipò ní ẹ̀gbẹ́ ọ̀tún ẹni. ‘Sí ọwọ́ ọ̀tún rẹ̀’ jẹ́ ọ̀nà Yorùbá tó bójú mu, tó sì pa ìtumọ̀ ipò mọ́.
- source_word: ἐρίφια
  choice: àwọn ewúrẹ́
  rationale: Ọ̀rọ̀ náà lè tọ́ka pàtó sí àwọn ọmọ ewúrẹ́, ṣùgbọ́n ‘àwọn ewúrẹ́’ mú ìyàtọ̀ pẹ̀lú àgùntàn hàn lọ́nà tó ṣe kedere, láìfi ìtumọ̀ ọjọ́-orí tí kò ṣe pàtàkì jù lọ sínú iwájú.
- source_word: ἐξ εὐωνύμων
  choice: sí ọwọ́ òsì rẹ̀
  rationale: Èyí túmọ̀ sí ipò ní ẹ̀gbẹ́ òsì. Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò tún αὐτοῦ sọ, fífi ‘rẹ̀’ kún un jẹ́ ohun àdánidá ní Yorùbá, ó sì mú ìfiwéra náà dọ́gba.
- source_word: μὲν ... δὲ
  choice: '... ṣùgbọ́n ...'
  rationale: Àwọn ọ̀rọ̀ méjèèjì ń fi ẹgbẹ́ kan wé èkejì ní ìtakora. ‘Ṣùgbọ́n’ sọ ìyàtọ̀ náà ní kedere láìjẹ́ kí gbólóhùn náà le.
theological_decisions:
- issue: Bóyá kí a fi ìtumọ̀ àpẹẹrẹ rere àti búburú ti ọ̀tún àti òsì sínú ìtumọ̀ náà
  choice: 'A túmọ̀ wọn gẹ́gẹ́ bí ipò nìkan: ‘sí ọwọ́ ọ̀tún rẹ̀ ... sí ọwọ́ òsì rẹ̀.’'
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí ‘ipò ojúrere’ àti ‘ipò àìní ojúrere.’
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ ń sọ ibi tí a gbé ẹgbẹ́ kọ̀ọ̀kan sí nínú ìdájọ́. Àyíká ni yóò jẹ́ kí agbára àpẹẹrẹ ọ̀tún àti òsì hàn; a kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Ọwọ́ ọ̀tún/ọwọ́ òsì’ bá ìforúkọsílẹ̀ ọ̀wọ̀ ti ìran ìdájọ́ mu, ó sì ṣe kedere fún òǹkàwé òde òní. A pa àmì ohùn mọ́ ní gbogbo ibi tó yẹ.
