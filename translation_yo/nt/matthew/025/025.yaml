reference: Matthew 25:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: yo
  text: Ẹ̀rù sì bà mí, mo lọ, mo sì fi tálẹ́ǹtì[a] rẹ pamọ́ sínú ilẹ̀. Wò ó, ohun tìrẹ nìyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tálẹ́ǹtì jẹ́ ìwọ̀n owó ìgbàanì tó níye púpọ̀; níhìn-ín, kò túmọ̀ sí ẹ̀bùn tàbí agbára àbínibí.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Ẹ̀rù sì bà mí
  rationale: Ó fi ìṣe alábápín tí ń sọ ìdí hàn ní Yorùbá àdánidá, láì yí ìbẹ̀rù náà sí ọ̀wọ̀ ẹ̀sìn.
- source_word: ἀπελθὼν
  choice: mo lọ
  rationale: 'Ó mú ìtẹ̀lé àwọn ìṣe inú Gíríìkì wá sí ọ̀rọ̀ Yorùbá tí ó ṣe kedere: ó lọ, lẹ́yìn náà ó fi owó náà pamọ́.'
- source_word: ἔκρυψα
  choice: mo sì fi ... pamọ́
  rationale: ‘Fi pamọ́’ ni ìtumọ̀ tààrà fún κρύπτω; gbólóhùn tó tẹ̀ lé ló sọ ibi tí ó fi í pamọ́.
- source_word: τὸ τάλαντόν σου
  choice: tálẹ́ńtì rẹ
  rationale: A pa orúkọ ìwọ̀n owó ìgbàanì náà mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀ kí a má bàa mú un gẹ́gẹ́ bí ẹ̀bùn àbínibí.
- source_word: ἐν τῇ γῇ
  choice: sínú ilẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan wà ní abẹ́ ilẹ̀ gẹ́gẹ́ bí ibi ìpamọ́.
- source_word: ἴδε
  choice: Wò ó
  rationale: Ó jẹ́ ọ̀rọ̀ ìpe àfiyèsí tó ṣe déédé pẹ̀lú ἴδε, tí kò sì jẹ́ ti àtijọ́ jù.
- source_word: ἔχεις τὸ σόν
  choice: ohun tìrẹ nìyí
  rationale: Ó pa ìtẹnumọ́ ohun-ìní náà mọ́, ó sì sọ ọ̀rọ̀ Gíríìkì tí a gé kúrú ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ τάλαντον nínú òwe yìí
  choice: A lo ‘tálẹ́ńtì’ gẹ́gẹ́ bí ìwọ̀n owó ìgbàanì, pẹ̀lú àlàyé ìsàlẹ̀.
  alternative: iye owó púpọ̀; àpò wúrà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìwọ̀n owó tàbí ìwọ̀n ẹrù tó níye púpọ̀, kì í ṣe agbára àbínibí. Pípa orúkọ ìtàn náà mọ́, pẹ̀lú àlàyé, ń dènà ìtumọ̀ ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún; ọ̀rọ̀ náà ṣe kedere, ó ní iyì, ó sì rọrùn fún òǹkàwé òde òní.
