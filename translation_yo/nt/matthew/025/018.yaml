id: MAT.25.18
reference: Matthew 25:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó gba tálẹ́ńtì kan lọ, ó wa ilẹ̀, ó sì fi owó[a] ọ̀gá rẹ̀ pamọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààrà sí i, “fàdákà ọ̀gá rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ṣùgbọ́n ẹni tí
  rationale: δέ fi ìyàtọ̀ hàn láàárín ìṣe ìránṣẹ́ yìí àti ti àwọn ìránṣẹ́ tó ṣáájú; “Ṣùgbọ́n” pa ìyàtọ̀ náà mọ́, “ẹni tí” sì mú àpilẹ̀kọ Gíríìkì tí a lò gẹ́gẹ́ bí orúkọ hàn ní Yorùbá.
- source_word: τὸ ἓν
  choice: tálẹ́ńtì kan náà
  rationale: “Ọ̀kan” ń tọ́ka sí tálẹ́ńtì tí a mẹ́nu kàn ní 25:15. Fífi “tálẹ́ńtì” kún un mú ọ̀rọ̀ náà ṣe kedere; “kan náà” fi hàn pé òun ni ẹni tí ó gba èyí kan ṣoṣo.
- source_word: λαβὼν
  choice: tí ó gba
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, ìránṣẹ́ náà ni a fi ohun-ìní ọ̀gá lé lọ́wọ́, nítorí náà “gba” jẹ́ ọ̀rọ̀ àdánidá tó sì bá ìtumọ̀ participle náà mu.
- source_word: ἀπελθὼν
  choice: lọ
  rationale: “Lọ” fi ìṣíkiri kúrò níbẹ̀ àti bí ìṣe náà ṣe ṣáájú fífi owó pamọ́ hàn ní Yorùbá àdánidá.
- source_word: ὤρυξεν γῆν
  choice: ó gbẹ́ ilẹ̀
  rationale: Èyí dúró sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere láìfi “ihò” tí a kò sọ ní tààrà kún un.
- source_word: ἔκρυψεν
  choice: ó sì fi … pamọ́
  rationale: “Fi … pamọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ohun kan pamọ́ tàbí bo ó mọ́lẹ̀.
- source_word: τὸ ἀργύριον
  choice: owó
  rationale: ἀργύριον lè túmọ̀ sí fàdákà tàbí owó; nínú àkòrí ohun-ìní tí ọ̀gá fi lé ìránṣẹ́ lọ́wọ́, “owó” ló ṣe kedere jù fún òǹkàwé òde òní. Àlàyé ìsàlẹ̀ fi ìtumọ̀ tààrà “fàdákà” pamọ́.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: ọ̀gá rẹ̀
  rationale: Nínú ayé ìtàn òwe náà, κύριος ni ọ̀gá ìránṣẹ́ náà. “Ọ̀gá rẹ̀” sọ ìbáṣepọ̀ àṣẹ náà ní kedere láìyí i sí oyè Ọlọ́run.
theological_decisions:
- issue: Ìtumọ̀ κύριος níbi tí ó ń tọ́ka sí ènìyàn nínú òwe
  choice: ọ̀gá
  alternative: Olúwa
  rationale: Ní ìpele ìtàn náà, ẹni tí a ń tọ́ka sí ni ọ̀gá ìránṣẹ́, kì í ṣe lílo κύριος ní tààrà gẹ́gẹ́ bí oyè Kristi. “Ọ̀gá” pa ìbáṣepọ̀ àṣẹ mọ́ láìfi ìtumọ̀ oyè Ọlọ́run wọ inú gbólóhùn náà.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo “tálẹ́ńtì” gẹ́gẹ́ bí ìwọ̀n owó ìgbàanì, a sì yẹra fún ṣíṣe àlàyé iye rẹ̀ sínú ẹsẹ náà.
