id: MAT.25.23
reference: Matthew 25:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: yo
  text: Olúwa rẹ̀ wí fún un pé, “O ṣe dáadáa, ìránṣẹ́ rere àti olóòótọ́![a] O ti jẹ́ olóòótọ́ lórí ohun díẹ̀; èmi yóò fi ọ́ ṣe olórí ohun púpọ̀. Wọ inú ayọ̀ olúwa rẹ̀ lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹrú rere àti olóòótọ́.” Ọ̀rọ̀ Gíríìkì náà, δοῦλος, lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: wí
  rationale: Ọ̀rọ̀ ìtàn tó bójú mu fún fífi ọ̀rọ̀ tààrà hàn; ó jẹ́ èdè Yorùbá tó ní iyì, tó sì ṣe kedere.
- source_word: κύριος
  choice: olúwa
  rationale: Nínú àkàwé yìí, ó tọ́ka sí ẹni tó jẹ́ olórí ìránṣẹ́ náà. “Olúwa” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbáṣepọ̀ yìí, láìfi dandan sọ ọ́ di orúkọ oyè Ọlọ́run.
- source_word: δοῦλε
  choice: ìránṣẹ́
  rationale: Ó bá àyíká iṣẹ́ ìríjú mu, ó sì ṣe kedere fún òǹkàwé òde òní; ìtumọ̀ tó lágbára jù, “ẹrú,” wà nínú àlàyé ìsàlẹ̀.
- source_word: Εὖ
  choice: Ó dára
  rationale: Ọ̀nà Yorùbá àdánidá láti fi ìtẹ́wọ́gbà àti ìyìn iṣẹ́ rere hàn.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: rere àti olóòótọ́
  rationale: Ó pa ìtumọ̀ àwọn àpèjúwe méjèèjì mọ́, “olóòótọ́” sì tún so mọ́ πιστός tó tẹ̀ lé e.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: O jẹ́ olóòótọ́ lórí ohun díẹ̀
  rationale: Ó pa èrò ojúṣe àti ìríjú mọ́, ó sì tún fi ìyàtọ̀ ohun díẹ̀ sí ohun púpọ̀ hàn.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: èmi yóò fi ọ́ ṣe olórí ohun púpọ̀
  rationale: καταστήσω níbí túmọ̀ sí yíyan ẹni sí ipò àṣẹ tàbí ojúṣe; gbólóhùn yìí jẹ́ Yorùbá tó ṣe kedere fún fífi ojúṣe tó pọ̀ sí i lé e lọ́wọ́.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Wọ inú ayọ̀ ... lọ
  rationale: Ó pa àwòrán ìwọlé sínú ayọ̀ mọ́ dípò yíyí i padà sí kíkópa nìkan.
- source_word: τοῦ κυρίου σου
  choice: olúwa rẹ
  rationale: Ó bá κύριος àkọ́kọ́ mu, ó sì pa ìbáṣepọ̀ ẹni tó ní àṣẹ àti ìránṣẹ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé nípa ẹni tó ní àṣẹ lórí ìránṣẹ́
  choice: olúwa
  alternative: Olúwa gẹ́gẹ́ bí orúkọ oyè Ọlọ́run; tàbí ọ̀gá
  rationale: Nínú ìtàn àkàwé náà, ẹni tí ọ̀rọ̀ yìí tọ́ka sí ni ẹni tó ní àṣẹ lórí ìránṣẹ́. Lílo “olúwa” pa ìtumọ̀ ìbáṣepọ̀ náà mọ́, ṣùgbọ́n a kò lò lẹ́tà ńlá láti fi túmọ̀ rẹ̀ ní tààrà sí orúkọ oyè Ọlọ́run.
- issue: Ìtumọ̀ δοῦλος nínú àyíká yìí
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: Ìtẹnumọ́ ẹsẹ̀ náà wà lórí ìṣòtítọ́ nínú iṣẹ́ ìríjú. “Ìránṣẹ́” jẹ́ èdè Yorùbá tó rọrùn, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ “ẹrú” tó ṣeé ṣe mọ́.
- issue: Ìtumọ̀ εἴσελθε εἰς τὴν χαρὰν
  choice: Wọ inú ayọ̀ olúwa rẹ lọ
  alternative: Wá kópa nínú ayọ̀ olúwa rẹ
  rationale: A pa àwòrán Gíríìkì ti wíwọlé sínú ayọ̀ mọ́, láìdín ìtumọ̀ rẹ̀ kù sí kíkópa nìkan.
translation_notes:
  register: Yorùbá àfẹnusọ tí ó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “olúwa” ní lẹ́tà kékeré nítorí ẹni tó ní àṣẹ nínú àkàwé ni ó jẹ́ ní ipele ìtàn; a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé ọ̀rọ̀ náà lórí.
