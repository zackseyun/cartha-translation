review_pass:
  verdict: revise
  source_fidelity: The draft retains the temporal sequence, emphatic ‘they too,’ direct address ‘Olúwa,’ the sixfold list of needs, and the final failure to render service. However, ‘ní ọgbà ẹ̀wọ̀n’ means ‘in a prison yard’ rather than ‘in prison’; ‘ní ilé ẹ̀wọ̀n’ is the accurate idiomatic equivalent of ἐν φυλακῇ.
  naturalness: The verse is generally clear and suitably dignified in Standard Yoruba. ‘Òùngbẹ ńgbẹ ọ’ is the conventional compact spelling for ‘you were thirsty,’ and ‘ṣe iṣẹ́ ìránṣẹ́ fún ọ’ is more idiomatic and explicit than ‘ṣe ìránṣẹ́ fún ọ’ in this context.
  terminology: ‘Olúwa’ appropriately renders Κύριε. ‘Àjèjì,’ ‘ní ìhòòhò,’ and ‘ṣàìsàn’ preserve the source categories well. ‘Ṣe iṣẹ́ ìránṣẹ́ fún ọ’ retains the broad practical-service sense of διακονέω without restricting it to church ministry.
  issues:
  - severity: medium
    issue: ‘ní ọgbà ẹ̀wọ̀n’ is overly specific and inaccurate for ἐν φυλακῇ.
    rationale: Ọgbà means a yard or compound. The Greek means being in prison/custody, for which ‘ní ilé ẹ̀wọ̀n’ is the natural Yoruba expression.
  - severity: low
    issue: The thirst expression and final service expression need minor idiomatic refinement.
    rationale: ‘Òùngbẹ ńgbẹ ọ’ is standard orthography, while ‘ṣe iṣẹ́ ìránṣẹ́ fún ọ’ more naturally conveys rendering service to someone than the potentially ambiguous ‘ṣe ìránṣẹ́ fún ọ’.
  revised_text: Nígbà náà, àwọn náà yóò dáhùn pé, ‘Olúwa, nígbà wo ni àwa rí ọ tí ebi ń pa ọ, tàbí tí òùngbẹ ńgbẹ ọ, tàbí tí o jẹ́ àjèjì, tàbí tí o wà ní ìhòòhò, tàbí tí o ṣàìsàn, tàbí tí o wà ní ilé ẹ̀wọ̀n, tí àwa kò sì ṣe iṣẹ́ ìránṣẹ́ fún ọ[a]?’
  revised_footnotes:
  - marker: a
    text: Tàbí, “tọ́jú ọ”; ọ̀rọ̀ Gíríìkì náà ni διακονέω.
    reason: lexical_alternative
  revision_rationale: The revision corrects the prison location, regularizes the conventional expression for thirst, and uses a more natural Yoruba wording for practical service. It preserves the list structure, emphasis, and semantic breadth of the Greek.
