id: MAT.25.44
reference: Matthew 25:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: yo
  text: Nígbà náà, àwọn náà yóò dáhùn pé, ‘Olúwa, nígbà wo ni àwa rí ọ tí ebi ń pa ọ, tàbí tí òùngbẹ ńgbẹ ọ, tàbí tí o jẹ́ àjèjì, tàbí tí o wà ní ìhòòhò, tàbí tí o ṣàìsàn, tàbí tí o wà ní ilé ẹ̀wọ̀n, tí àwa kò sì ṣe iṣẹ́ ìránṣẹ́ fún ọ[a]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tọ́jú ọ”; ọ̀rọ̀ Gíríìkì náà ni διακονέω.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú àsìkò nínú ìṣẹ̀lẹ̀ ìdájọ́ hàn ní Yorùbá àdánidá.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: àwọn náà yóò dáhùn pé
  rationale: ‘Àwọn náà’ mú ìtumọ̀ kaὶ αὐτοὶ jáde, ‘yóò dáhùn’ sì sọ ọ̀rọ̀-ìṣe ọjọ́ iwájú náà; ‘pé’ ni ọ̀nà Yorùbá àdánidá láti bẹ̀rẹ̀ ọ̀rọ̀ tààrà.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa oyè ìbọ̀wọ̀ àti ìtumọ̀ Kristi mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: πεινῶντα ἢ διψῶντα
  choice: tí ebi ń pa ọ, tàbí tí òùngbẹ ń gbẹ ọ
  rationale: Àwọn gbólóhùn Yorùbá wọ̀nyí jẹ́ ọ̀nà àdánidá láti sọ pé ẹnì kan ń jẹ ebi tàbí òùngbẹ.
- source_word: ξένον
  choice: tí o jẹ́ àjèjì
  rationale: ‘Àjèjì’ dáàbò bo ìtumọ̀ ẹni tí kì í ṣe ará ilé tàbí ará àwùjọ, ẹni tí ó nílò àlejò, láìdín un kù sí ọmọ ilẹ̀ òkèèrè nìkan.
- source_word: γυμνὸν
  choice: tí o wà ní ìhòòhò
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ ó tún lè túmọ̀ sí aláìní aṣọ tó tó.
- source_word: ἀσθενῆ
  choice: tí o ṣàìsàn
  rationale: Nínú àkójọ àìní ara àti ti àwùjọ yìí, ìtumọ̀ àdánidá jù ni ‘ṣàìsàn,’ dípò ‘jẹ́ aláìlera.’
- source_word: ἐν φυλακῇ
  choice: tí o wà ní ọgbà ẹ̀wọ̀n
  rationale: Ó sọ ipò ẹni tí a fi sẹ́wọ̀n ní Yorùbá tí ó ṣe kedere.
- source_word: οὐ διηκονήσαμέν σοι
  choice: tí àwa kò sì ṣe ìránṣẹ́ fún ọ
  rationale: ‘Ṣe ìránṣẹ́ fún’ pa ìtumọ̀ fífẹ̀ διακονέω mọ́, pẹ̀lú ìrànlọ́wọ́ gidi àti iṣẹ́ àánú, láìdín un kù sí iṣẹ́ ìjọ.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí oyè fún Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìbọ̀wọ̀ àti ìró Kristi tí oyè náà ní nínú Mátíù mọ́, láìsọ ohun tí ẹsẹ̀ náà kò sọ.
- issue: Agbára διακονέω nínú gbólóhùn ìkẹyìn
  choice: ṣe ìránṣẹ́ fún ọ
  alternative: tọ́jú ọ; ṣe iṣẹ́ ìránṣẹ́ fún ọ
  rationale: Àṣàyàn yìí pa ìbáṣepọ̀ láàárín ìrànlọ́wọ́ aláàánú àti iṣẹ́ tí a ṣe fún Ọba mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé fi àwọn ìtumọ̀ tó sún mọ́ ọn hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá ṣe àdánidá. Àtòjọ àwọn ipò àìní ni a pa mọ́, a sì lo ‘àwa’ láti mú ìtẹnumọ́ inú ìbéèrè náà hàn.
