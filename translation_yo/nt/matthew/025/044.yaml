revisions:
- from: Nígbà náà, àwọn náà yóò dáhùn pé, ‘Olúwa, nígbà wo ni àwa rí ọ tí ebi ń pa ọ, tàbí tí òùngbẹ ń gbẹ ọ, tàbí tí o jẹ́ àjèjì, tàbí tí o wà ní ìhòòhò, tàbí tí o ṣàìsàn, tàbí tí o wà ní ọgbà ẹ̀wọ̀n, tí àwa kò sì ṣe ìránṣẹ́ fún ọ[a]?’
  to: Nígbà náà, àwọn náà yóò dáhùn pé, ‘Olúwa, nígbà wo ni àwa rí ọ tí ebi ń pa ọ, tàbí tí òùngbẹ ńgbẹ ọ, tàbí tí o jẹ́ àjèjì, tàbí tí o wà ní ìhòòhò, tàbí tí o ṣàìsàn, tàbí tí o wà ní ilé ẹ̀wọ̀n, tí àwa kò sì ṣe iṣẹ́ ìránṣẹ́ fún ọ[a]?’
  rationale: The revision corrects the prison location, regularizes the conventional expression for thirst, and uses a more natural Yoruba wording for practical service. It preserves the list structure, emphasis, and semantic breadth of the Greek.
