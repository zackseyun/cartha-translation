id: MAT.25.2
reference: Matthew 25:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: yo
  text: Àwọn márùn-ún nínú wọn jẹ́ òmùgọ̀, àwọn márùn-ún sì jẹ́ ọlọ́gbọ́n.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: márùn-ún
  rationale: Nọ́ńbà kádínà náà túmọ̀ tààrà sí ‘márùn-ún’; a tún un sọ láti pa ìwọ̀ntúnwọ̀nsì àti ìyàtọ̀ inú Gíríìkì mọ́.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ tí kò fi ìtakò líle hàn; ‘sì’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti so àwọn apá méjèèjì pọ̀, ó sì mú ìyàtọ̀ wọn hàn láìṣe àfikún ìtakò tó lágbára.
- source_word: ἐξ αὐτῶν
  choice: nínú wọn
  rationale: Gbólóhùn partitive yìí fi hàn pé àwọn márùn-ún náà jẹ́ apá kan lára ẹgbẹ́ tí a ti mẹ́nu kàn; ‘nínú wọn’ jẹ́ Yorùbá àdánidá.
- source_word: ἦσαν
  choice: jẹ́
  rationale: Àìpé ọ̀rọ̀-ìṣe εἰμί ṣiṣẹ́ gẹ́gẹ́ bí copula nínú àpèjúwe yìí; ‘jẹ́’ ni Yorùbá àdánidá, tí àyíká ìtàn sì ń fi àkókò tó kọjá hàn.
- source_word: μωραὶ
  choice: òmùgọ̀
  rationale: μωρός túmọ̀ sí ẹni tí kò ní làákàyè tàbí ìfòyebánilò; ‘òmùgọ̀’ pa agbára ìyàtọ̀ rẹ̀ sí φρόνιμοι mọ́.
- source_word: καὶ πέντε φρόνιμοι
  choice: àwọn márùn-ún sì jẹ́ ọlọ́gbọ́n
  rationale: φρόνιμος lè túmọ̀ sí ọlọ́gbọ́n, olóye, tàbí ẹni tó ń fi ìṣọ́ra ronú. ‘Ọlọ́gbọ́n’ bá ìtakora pẹ̀lú ‘òmùgọ̀’ mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó yé kedere; a tún ‘jẹ́’ sọ fún ìṣàn gbólóhùn tó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àjọṣe tó ní àmì ohùn níbi tó yẹ, ní èdè ìsinsìnyí tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘àwọn’ pẹ̀lú nọ́ńbà láti tọ́ka sí àwọn obìnrin mẹ́wàá tí ẹsẹ tó ṣáájú mẹ́nu kàn, láìfi orúkọ náà kún ẹsẹ yìí.
