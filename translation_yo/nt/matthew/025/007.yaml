  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: yo
  text: Nígbà náà, gbogbo àwọn wúńdíá wọ̀nyẹn dìde, wọ́n sì mú àwọn fìtílà wọn ṣe tán[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ògùṣọ̀” dípò “fìtílà” (Gíríìkì: λαμπάδας); ọ̀rọ̀ náà lè tọ́ka sí ohun ìmọ́lẹ̀ tí a ń gbé lọ́wọ́, àyíká epo àti ìmúrasílẹ̀ sì lè gba ìtumọ̀ méjèèjì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó samisi ìṣẹ̀lẹ̀ tó tẹ̀ lé e nínú ìtàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘lẹ́yìn náà’ ní Yorùbá.
- source_word: ἠγέρθησαν
  choice: dìde
  rationale: Nínú àyíká jíjí kúrò lójú oorun tàbí ibi ìsinmi, ‘dìde’ sọ ìṣe náà ní tààrà, láìfi dandan túmọ̀ rẹ̀ sí pé ẹlòmíràn jí wọn.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: gbogbo àwọn wúńdíá wọ̀nyẹn
  rationale: ‘Wúńdíá’ pa ìtumọ̀ pàtó παρθένοι mọ́ nínú àyíká ayẹyẹ ìgbéyàwó; ‘wọ̀nyẹn’ tọ́ka sí ẹgbẹ́ tí a ti mẹ́nu kàn.
- source_word: ἐκόσμησαν
  choice: tún ... ṣe
  rationale: κοσμέω túmọ̀ sí ṣíṣe ohun létòlétò tàbí mímú un múra. Nípa fìtílà, ‘tún ... ṣe’ jẹ́ ọ̀rọ̀ àdánidá tó lè ní ṣíṣe òwú rẹ̀ àti mímú un múra láti jó, láìfikún kúlẹ̀kúlẹ̀ tí Gíríìkì kò sọ.
- source_word: λαμπάδας
  choice: fìtílà
  rationale: λαμπάς lè jẹ́ fìtílà tàbí ògùṣọ̀; epo àti ìmúrasílẹ̀ nínú àyíká náà jẹ́ kí ‘fìtílà’ bójú mu, ṣùgbọ́n a pa ‘ògùṣọ̀’ mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- source_word: ἑαυτῶν
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò olùṣe náà fi hàn pé fìtílà náà jẹ́ ti àwọn wúńdíá fúnra wọn; ‘wọn’ sọ ìní náà ní Yorùbá àdánidá láìfi ìtẹnumọ́ tí kò pọndandan kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún òǹkàwé láti lóye. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá, a sì pa àìdánilójú λαμπάς mọ́ nínú àlàyé ìsàlẹ̀.
