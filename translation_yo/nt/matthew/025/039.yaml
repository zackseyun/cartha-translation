source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: yo
  text: Nígbà wo sì ni a rí ọ tí ara rẹ kò dá, tàbí tí o wà nínú túbú, tí a sì wá sọ́dọ̀ rẹ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a sì bẹ̀ ọ́ wò.” Gíríìkì sọ ní tààrà sí i pé, “tí a sì wá sọ́dọ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: nígbà wo
  rationale: Ọ̀rọ̀ ìbéèrè yìí ń béèrè àkókò; “nígbà wo” ni ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: δέ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ láàárín àwọn ìbéèrè; “sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu láìfi ìtakora líle kún un.
- source_word: εἴδομεν
  choice: àwa rí ọ
  rationale: Aorist yìí tọ́ka sí rírí ní ìgbà tí ó kọjá. Fífi “àwa” hàn mú ìbéèrè náà ṣe kedere, ó sì tẹnumọ́ àwọn olùsọ̀rọ̀ bí Gíríìkì ṣe ṣe.
- source_word: ἀσθενοῦντα
  choice: tí ara rẹ kò dá
  rationale: Ní àyíká ẹsẹ yìí, participle náà ń sọ nípa àìsàn ara. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì yàgò fún ìtumọ̀ gbòòrò “aláìlera.”
- source_word: ἐν φυλακῇ
  choice: nínú ẹ̀wọ̀n
  rationale: φυλακή túmọ̀ sí ibi ìhámọ́; “nínú ẹ̀wọ̀n” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu.
- source_word: ἤλθομεν πρός σε
  choice: tí a sì tọ̀ ọ́ wá
  rationale: Èyí pa ìtumọ̀ ìṣípòpadà “wá sí ọ̀dọ̀ rẹ” mọ́ ní Yorùbá àdánidá, láìsọ ọ́ di ọ̀rọ̀ pàtó fún ìbẹ̀wò.
theological_decisions:
- issue: Bóyá kí ἤλθομεν πρός σε jẹ́ “tọ̀ ọ́ wá” tàbí “bẹ̀ ọ́ wò”
  choice: tí a sì tọ̀ ọ́ wá
  alternative: tí a sì bẹ̀ ọ́ wò
  rationale: Gíríìkì sọ ní tààrà pé wọ́n “wá sí ọ̀dọ̀” ẹni náà, kì í ṣe pé ó lo ọ̀rọ̀ pàtó fún ìbẹ̀wò. Ọ̀rọ̀ àkọ́kọ́ pa àìdájú ìṣe náà mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ àdánidá mìíràn hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó yẹ. Ìtòlẹ́sẹẹsẹ ìbéèrè náà pa àsopọ̀ àti ìṣàn ọ̀rọ̀ orísun mọ́.
