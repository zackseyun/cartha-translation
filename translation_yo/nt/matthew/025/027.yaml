id: MAT.25.27
reference: Matthew 25:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: yo
  text: Nítorí náà, ó yẹ kí ìwọ ti fi owó mi sí ọwọ́ àwọn oníṣòwò owó, nígbà tí mo sì dé, èmi ì bá ti gba ohun tí ó jẹ́ tèmi padà pẹ̀lú èlé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú èrè owó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: ó yẹ kí ìwọ ti
  rationale: Ó fi ohun tí ó yẹ kí ẹni náà ti ṣe ní àtẹ̀yìnwá hàn, ó sì pa agbára ìbáwí ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìpinnu yìí mọ́ ẹ̀sùn tí ó ṣáájú gẹ́gẹ́ bí àbájáde ọgbọ́n.
- source_word: βαλεῖν τὰ ἀργύριά μου
  choice: fi owó mi sí ọwọ́
  rationale: Ní àyíká ìṣòwò yìí, βάλλω túmọ̀ sí fífi owó sí ọwọ́ àwọn tí ń ṣiṣẹ́ pẹ̀lú owó; ‘owó’ sì mú ìtumọ̀ iṣẹ́ ἀργύρια jáde lọ́nà àdánidá.
- source_word: τραπεζίταις
  choice: àwọn oníṣòwò owó
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn aṣòwò tàbí olùpàṣípààrọ̀ owó tí wọ́n tún ń gba owó sí ìtọ́jú; yíyan yìí yẹra fún fífi ètò báńkì òde òní lé àwòrán ayé ìgbàanì.
- source_word: ἐλθὼν ἐγὼ
  choice: nígbà tí mo sì dé, èmi
  rationale: Ó tú participle náà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ àkókò, ó sì pa ìtẹnumọ́ ἐγώ mọ́ nípasẹ̀ ‘èmi.’
- source_word: ἐκομισάμην ἂν
  choice: ì bá gba ... padà
  rationale: Middle κομίζω pẹ̀lú ἄν ń sọ àbájáde ohun tí kò ṣẹlẹ̀; ‘gba padà’ tún fi hàn pé ohun tirẹ̀ ni olúwa ń gba.
- source_word: τὸ ἐμὸν
  choice: ohun tí ó jẹ́ tèmi
  rationale: Ó pa ìtẹnumọ́ ohun-ìní inú possessive tí a lò gẹ́gẹ́ bí nọ́ńbà mọ́.
- source_word: σὺν τόκῳ
  choice: pẹ̀lú èlé
  rationale: ‘Èlé’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún owó àfikún lórí owó tí a fi sílẹ̀ tàbí yá, láìfi ìdájọ́ ìwà kún un.
theological_decisions:
- issue: Èdè ìṣúná inú àkàwé àti bóyá kí ìtumọ̀ sọ ìdájọ́ nípa gbígba èlé
  choice: Túmọ̀ àwọn ọ̀rọ̀ ìṣúná náà ní tààrà gẹ́gẹ́ bí ara àwòrán àkàwé, láìsọ pé ẹsẹ̀ náà ń fọwọ́ sí tàbí ń dá gbogbo gbígba èlé lẹ́bi.
  alternative: Lo ọ̀rọ̀ tó ní ìtumọ̀ èlé àṣejù tàbí èlé búburú, èyí tí yóò mú àríyànjiyàn ẹ̀kọ́ ìgbà mìíràn wọ inú ẹsẹ̀ náà.
  rationale: Ọ̀rọ̀ Gíríìkì τόκος níbí jẹ́ èlé lórí owó; ẹsẹ̀ náà kò dá ìlànà ẹ̀kọ́ gbogbo-gbòò kan sílẹ̀ nípa yíya owó.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘oníṣòwò owó’ dípò ‘báńkà’ láti bá àyíká ayé ìgbàanì mu; àmì ohùn ni a fi sí gbogbo ibi tó yẹ.
