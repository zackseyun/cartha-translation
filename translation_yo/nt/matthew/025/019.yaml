  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí μετὰ ... πολὺν χρόνον, κύριος, δοῦλοι, àti dídé olúwa náà. Ṣùgbọ́n “bá wọn ṣírò owó” ń túmọ̀ sí ṣíṣe ìṣirò owó pẹ̀lú wọn, kì í fi ìtumọ̀ àkànṣe συναίρει λόγον—mímú ìṣirò/àkọọ́lẹ̀ wá sí ìpinnu láàárín olúwa àti àwọn ẹrú—hàn dáadáa.
