id: MAT.25.19
reference: Matthew 25:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: yo
  text: Lẹ́yìn ìgbà pípẹ́, olúwa àwọn ẹrú wọ̀nyẹn dé, ó sì bá wọn ṣe ìṣirò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀gá àwọn ìránṣẹ́ wọ̀nyẹn dé, ó sì bá wọn ṣe ìṣirò.” Ọ̀rọ̀ Gíríìkì κύριος lè túmọ̀ sí “olúwa” tàbí “ọ̀gá,” δοῦλοι sì lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Lẹ́yìn ìgbà pípẹ́
  rationale: Ọ̀rọ̀ náà fi hàn pé àkókò gígùn ti kọjá. δέ jẹ́ àsopọ̀ fífẹ́; ìtẹ̀síwájú ìtàn náà hàn gbangba láìfi ọ̀rọ̀ míì kún un.
- source_word: ἔρχεται
  choice: dé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní historical present, ‘dé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ dídé ẹni náà nínú ìtàn.
- source_word: ὁ κύριος
  choice: olúwa
  rationale: ‘Olúwa’ lè túmọ̀ sí ẹni tó ní àṣẹ lórí àwọn ẹrú, ó sì tún pa àìdánilójú κύριος mọ́ láàárín ‘lord’ àti ‘master,’ láìfi dandan sọ ọ́ di orúkọ oyè ti ẹ̀kọ́ nípa Kristi.
- source_word: τῶν δούλων ἐκείνων
  choice: àwọn ẹrú wọ̀nyẹn
  rationale: ‘Ẹrú’ fi ipò ìdè ẹni hàn kedere ju ‘ìránṣẹ́’ lọ nínú àyíká olúwa àti ẹrú yìí; ‘wọ̀nyẹn’ tọ́ka sí àwọn tí ìtàn ti mẹ́nu kàn.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: bá wọn ṣírò owó
  rationale: Gbólóhùn Gíríìkì jẹ́ àsọyé ìṣirò àti mímú àkọọ́lẹ̀ dọ́gba. ‘Bá wọn ṣírò owó’ jẹ́ Yorùbá òde òní tó ṣe kedere nínú àyíká ọrọ̀ ajé àkàwé náà.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé
  choice: olúwa
  alternative: ọ̀gá
  rationale: ‘Olúwa’ bá ìbáṣepọ̀ ẹni tó ní àṣẹ àti àwọn ẹrú mu, ó sì pa agbára ìtumọ̀ ‘lord/master’ mọ́. Àyíká ló ń fi hàn pé olúwa ilé inú àkàwé ni, kì í ṣe dandan orúkọ oyè Kristi ní tààràtà.
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nínú ètò ọrọ̀ ajé tí olúwa ní àṣẹ lórí wọn, ipò ìdè wọn ṣe pàtàkì; nítorí náà ‘ẹrú’ sún mọ́ ẹ̀rí orísun ju ọ̀rọ̀ fífẹ́ ‘ìránṣẹ́’ lọ.
translation_notes:
  register: Yorùbá àgbáyé, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá; gbolohun náà yàgò fún èdè ẹ̀ka ìjọ kan pàtó.
