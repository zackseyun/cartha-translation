revisions:
- from: Nígbà náà, ẹni tí ó ti gba tálẹ́ńtì kan náà sì wá, ó ní, “Olúwa, mo mọ̀ pé ènìyàn líle ni ọ́,[a] ẹni tí ń kórè níbi tí ìwọ kò gbìn sí, tí o sì ń kójọ láti ibi tí ìwọ kò fọ́n ká.”[b]
  to: Nígbà náà, ẹni tí ó ti gba tálẹ́ńtì kan wá pẹ̀lú, ó ní, “Olúwa, mo mọ̀ pé ènìyàn líle ni ọ́,[a] ẹni tí ń kórè níbi tí ìwọ kò gbìn sí, tí o sì ń kójọ láti ibi tí ìwọ kò fọ́n ká.”[b]
  rationale: The sole revision relocates the additive sense of Greek καί from the noun phrase “one talent” to the action “came,” preventing an unintended “same talent” meaning. No theological or interpretive change is made, and the source ambiguity concerning what was scattered is retained.
