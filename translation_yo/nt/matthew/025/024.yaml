id: MAT.25.24
reference: Matthew 25:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: yo
  text: Nígbà náà, ẹni tí ó ti gba tálẹ́ńtì kan wá pẹ̀lú, ó ní, “Olúwa, mo mọ̀ pé ènìyàn líle ni ọ́,[a] ẹni tí ń kórè níbi tí ìwọ kò gbìn sí, tí o sì ń kójọ láti ibi tí ìwọ kò fọ́n ká.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “ènìyàn líle” sí “ènìyàn oníwà líle” tàbí “ènìyàn tó le koko.” Ọ̀rọ̀ Gíríìkì náà, σκληρός, lè túmọ̀ sí líle, oníwà líle, tàbí le koko.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ń kójọ láti ibi tí ìwọ kò fọ́n ká.” Ọ̀rọ̀ Gíríìkì kò sọ ohun tí a fọ́n ká; àwòrán iṣẹ́ àgbẹ̀ náà lè jẹ́ kí a lóye rẹ̀ sí irúgbìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: wá
  rationale: Ọ̀rọ̀ náà ṣàfihàn pé ìránṣẹ́ náà wá sí ọ̀dọ̀ olúwa rẹ̀ kí ó tó sọ̀rọ̀. “Wá” jẹ́ ọ̀rọ̀ àdánidá nínú ìtàn Yorùbá.
- source_word: δὲ καὶ
  choice: Nígbà náà ... náà sì
  rationale: “Nígbà náà” ń tẹ ìtàn náà síwájú, “náà sì” sì fi hàn pé ìránṣẹ́ yìí náà wá lẹ́yìn àwọn yòókù.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: ẹni tí ó ti gba tálẹ́ńtì kan
  rationale: “Ẹni tí” pa ìṣètò gbólóhùn Gíríìkì mọ́ láìfi “ọkùnrin” kún un; “ó ti gba” ṣàfihàn iṣẹ́ tí ó ti ṣẹlẹ̀ tí ó sì tún ṣe pàtàkì ní àkókò yìí.
- source_word: τάλαντον
  choice: tálẹ́ńtì
  rationale: A pa orúkọ ìwọ̀n owó ayé àtijọ́ náà mọ́, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí iye owó kan tí kò sí ní pàtó nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí ìránṣẹ́ fi ń pe ẹni tó jẹ́ olúwa rẹ̀, ó sì bá ìtumọ̀ κύριος tí a sábà máa ń lò mu.
- source_word: ἔγνων σε ὅτι
  choice: mo mọ̀ pé
  rationale: Èyí sọ ìmọ̀ tí ìránṣẹ́ náà ní nípa ìwà olúwa rẹ̀ lọ́nà Yorùbá tó ṣe kedere, láìfi àlàyé míì kún un.
- source_word: σκληρὸς ἄνθρωπος
  choice: ènìyàn líle
  rationale: “Ènìyàn líle” pa ìtumọ̀ ìpilẹ̀ṣẹ̀ àti ẹ̀sùn tí ìránṣẹ́ náà ń ṣe mọ́, láìpinnu pé ó túmọ̀ sí oníwà búburú tàbí ẹni tó kan le koko nínú ìṣe.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: ẹni tí ń kórè níbi tí ìwọ kò gbìn sí
  rationale: “Kórè” àti “gbìn” pa àwòrán iṣẹ́ àgbẹ̀ àti ìbáramu àwọn ọ̀rọ̀ náà mọ́.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: tí o sì ń kójọ láti ibi tí ìwọ kò fọ́n ká
  rationale: Ìtumọ̀ yìí pa “láti ibi” àti àìsí ohun tí a sọ pé a fọ́n ká mọ́, bí ó ti rí nínú Gíríìkì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ọ̀rọ̀ tí ìránṣẹ́ sọ nínú àkàwé
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ sí olúwa ìránṣẹ́ nínú àkàwé, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú bí a ṣe sábà túmọ̀ κύριος, láìfi dandan sọ pé ìránṣẹ́ náà ń jẹ́wọ́ ìtumọ̀ ẹ̀sìn kan.
- issue: Ẹ̀sùn tí ìránṣẹ́ náà fi kan olúwa rẹ̀
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ohun tí ìránṣẹ́ náà sọ pé òun mọ̀, láìrẹ̀ ẹ́ sílẹ̀ tàbí fọwọ́ sí i.
  alternative: Lílo ọ̀rọ̀ tó túmọ̀ sí “oníwà líle” nìkan, èyí tí yóò túmọ̀ ẹ̀sùn náà sí ìwà ìkà ní pàtó.
  rationale: Ọ̀rọ̀ náà ń ròyìn ojú tí ìránṣẹ́ fi wo olúwa rẹ̀; ìtumọ̀ kò gbọ́dọ̀ pinnu láìsọ pé ojú ìwòye náà tọ́ tàbí pé kò tọ́.
translation_notes:
  register: A lo Yorùbá àtẹ̀jáde tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa àwòrán iṣẹ́ àgbẹ̀ àti ìṣòro ìtumọ̀ σκληρός mọ́.
