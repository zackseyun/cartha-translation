  to: Ṣùgbọ́n nígbà tí Ọmọ Ènìyàn bá dé nínú ògo rẹ̀, tí gbogbo àwọn áńgẹ́lì bá sì wà pẹ̀lú rẹ̀, nígbà náà ni yóò jókòó lórí ìtẹ́ rẹ̀ ológo.[a]
