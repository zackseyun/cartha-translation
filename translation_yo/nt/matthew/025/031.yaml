id: MAT.25.31
reference: Matthew 25:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Ọmọ Ènìyàn bá dé nínú ògo rẹ̀, tí gbogbo àwọn áńgẹ́lì bá sì wà pẹ̀lú rẹ̀, nígbà náà ni yóò jókòó lórí ìtẹ́ rẹ̀ ológo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtẹ́ ògo rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: “Nígbà tí” sọ ìṣẹ̀lẹ̀ ọjọ́ iwájú kan pàtó ní ọ̀nà àdánidá ní Yorùbá; “ṣùgbọ́n” sì pa ìyípadà díẹ̀ nínú àsọyé tí δέ ń fi hàn mọ́.
- source_word: ἔλθῃ
  choice: bá dé
  rationale: Aorist subjunctive lẹ́yìn ὅταν ń tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú. Ìhun “nígbà tí ... bá dé” ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bá irú gbólóhùn yìí mu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí pa orúkọ oyè Jesu àti ìró Danieli 7 mọ́, láì fi ìtumọ̀ àlàyé kan rọ́pò rẹ̀.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: nínú ògo rẹ̀
  rationale: “Ògo” lè gbé ìtumọ̀ ọlá ńlá, ọlá ọba, àti ìfarahàn títóbi tí δόξα ní níbí; ó tún pa ìró Bíbélì mọ́.
- source_word: πάντες οἱ ἄγγελοι
  choice: gbogbo àwọn áńgẹ́lì
  rationale: Ìtumọ̀ náà tẹ̀ lé èdè Gíríìkì, èyí tí ó sọ “gbogbo àwọn áńgẹ́lì” láì fi arọ́pò-orúkọ ohun-ìní “rẹ̀” kún un.
- source_word: μετ’ αὐτοῦ
  choice: wà pẹ̀lú rẹ̀
  rationale: Èyí sọ ìbáṣepọ̀ ìrìn-àjò tàbí wíwà papọ̀ ní kedere, láì fi àlàyé tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: τότε καθίσει
  choice: nígbà náà ni yóò jókòó
  rationale: “Nígbà náà” pa tẹ̀lé-tẹ̀lé ìṣẹ̀lẹ̀ mọ́, “yóò jókòó” sì tú ọ̀rọ̀ ọjọ́ iwájú náà ní tààràtà.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: lórí ìtẹ́ rẹ̀ ológo
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá fún gbolohun genitive náà, ó sì fi hàn pé ògo ń ṣe àpèjúwe ìtẹ́ náà. Ìtumọ̀ tó tẹ̀lé ìṣètò Gíríìkì pẹkipẹki wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Orúkọ oyè Kristi, ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: “Ọmọ Ènìyàn” jẹ́ orúkọ oyè Bíbélì tó ti fìdí múlẹ̀, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Danieli 7 àti ipa onídàájọ́ ọba nínú àyíká ọ̀rọ̀ yìí mọ́.
- issue: Ìtumọ̀ θρόνου δόξης αὐτοῦ
  choice: ìtẹ́ rẹ̀ ológo
  alternative: ìtẹ́ ògo rẹ̀
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá òde òní tó ṣe àdánidá, ṣùgbọ́n àṣàyàn kejì pa ìṣètò àti àìdánilójú díẹ̀ ti gbolohun Gíríìkì mọ́, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “bá dé” nínú gbólóhùn àkókò ọjọ́ iwájú, a sì yàgò fún fífi “rẹ̀” kún “àwọn áńgẹ́lì,” nítorí kò sí nínú ọ̀rọ̀ Gíríìkì.
