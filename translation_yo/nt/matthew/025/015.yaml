id: MAT.25.15
reference: Matthew 25:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: yo
  text: Ó fún ọ̀kan ní tálẹ́ǹtì márùn-ún[a], ó fún òmíràn ní méjì, ó sì fún òmíràn ní ọ̀kan, fún ẹnì kọ̀ọ̀kan gẹ́gẹ́ bí agbára tirẹ̀ ṣe tó; ó sì lọ sí ìrìnàjò. Lẹ́sẹ̀kẹsẹ̀…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tálẹ́ǹtì jẹ́ ẹ̀ka ìwọ̀n owó tó tóbi gan-an ní ayé ìgbà náà; níbí, kì í ṣe ẹ̀bùn tàbí ọgbọ́n àbínibí.
    reason: lexical_alternative
  - marker: b
    text: Nínú ọ̀rọ̀ Gíríìkì, “Lẹ́sẹ̀kẹsẹ̀” ṣí gbolóhùn tó tẹ̀ lé e ní ẹsẹ 16, nípa ìránṣẹ́ tó gba tálẹ́ǹtì márùn-ún.
    reason: source_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: tálẹ́ńtì
  rationale: Ọ̀rọ̀ yìí jẹ́ orúkọ ìwọ̀n owó tàbí ohun ìní tí iye rẹ̀ pọ̀ gan-an ní ayé ìgbà náà. Ìtumọ̀ yìí pa orúkọ ìtàn náà mọ́, kò sì mú un dà bí ẹ̀bùn àbínibí.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: ọ̀kan ... òmíràn ... òmíràn
  rationale: Èyí fi hàn pé olúwa náà pín ohun ìní náà fún àwọn ìránṣẹ́ ọ̀tọ̀ọ̀tọ̀ ní iye tí kò dọ́gba.
- source_word: ἕν
  choice: ọ̀kan
  rationale: Orúkọ tálẹ́ńtì wà ní ìtumọ̀ láti inú gbólóhùn tó ṣáájú, nítorí náà kò pọndandan láti tún un sọ.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: fún ẹnì kọ̀ọ̀kan gẹ́gẹ́ bí agbára tirẹ̀ ṣe tó
  rationale: Gbólóhùn yìí tọ́ka sí agbára tàbí ìkápá ohun tí olúkúlùkù lè ṣe; ‘tirẹ̀’ pa ìtumọ̀ ẹyọ kọ̀ọ̀kan inú Gíríìkì mọ́.
- source_word: ἀπεδήμησεν
  choice: ó lọ sí ìrìnàjò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílọ kúrò nílé, ní ọ̀pọ̀ ìgbà fún ìrìnàjò jíjìn; èdè Yorùbá yìí jẹ́ kedere, ó sì bá àyíká ìtàn mu.
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìbẹ̀rẹ̀ ìṣe tó tẹ̀ lé e ní ẹsẹ tó kàn, ní ìbámu pẹ̀lú àmì ìdádúró inú SBLGNT; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé ó tún ṣeé so mọ́ lílọ olúwa náà.
theological_decisions:
- issue: Ìtumọ̀ τάλαντα nínú àkàwé náà
  choice: Ẹ̀ka ìwọ̀n owó tàbí ohun ìní ńlá
  alternative: Ẹ̀bùn tàbí ọgbọ́n àbínibí
  rationale: Àyíká náà ń sọ nípa ohun ìní tí olúwa fi lé àwọn ìránṣẹ́ lọ́wọ́. Ìtumọ̀ òde òní ti ‘talent’ gẹ́gẹ́ bí ẹ̀bùn àbínibí kì í ṣe ohun tí ọ̀rọ̀ Gíríìkì túmọ̀ sí níbí.
- issue: Ohun tí εὐθέως ń ṣàlàyé
  choice: Ìṣe ìránṣẹ́ tó gba tálẹ́ńtì márùn-ún, èyí tó bẹ̀rẹ̀ ní ẹsẹ tó kàn
  alternative: Lílọ olúwa náà sí ìrìnàjò
  rationale: SBLGNT fi àmì òpin gbólóhùn síwájú εὐθέως, ohun tó ń tọ́ka sí pé adífáàbù náà bẹ̀rẹ̀ gbólóhùn tó tẹ̀ lé e. Síbẹ̀, ìtòsí rẹ̀ sí ἀπεδήμησεν jẹ́ kí ìsomọ́ kejì ṣeé ṣe, nítorí náà a kò fi pamọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tí ó ní àmì ohùn kíkún, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘tálẹ́ńtì’ gẹ́gẹ́ bí ọ̀rọ̀ ìtàn, pẹ̀lú àlàyé tó dí ìtumọ̀ ‘ẹ̀bùn àbínibí’ lọ́wọ́. Bí ẹsẹ náà ṣe parí sí ‘Lẹ́sẹ̀kẹsẹ̀,’ jẹ́ nítorí pé ọ̀rọ̀ náà ṣí gbólóhùn ẹsẹ tó kàn, bó tilẹ̀ jẹ́ pé ìpín ẹsẹ Bíbélì fi í sí ẹsẹ 15.
