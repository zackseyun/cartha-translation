id: MAT.25.10
reference: Matthew 25:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí wọ́n ń lọ rà, ọkọ ìyàwó dé; àwọn tí ó ti múra tán bá a wọ ibi àsè ìgbéyàwó[a], a sì ti ilẹ̀kùn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibi àjọyọ̀ ìgbéyàwó,” tàbí ní ṣókí, “ibi ìgbéyàwó.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀ ní ìrísí, ó sì lè tọ́ka sí gbogbo ayẹyẹ ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Ṣùgbọ́n nígbà tí wọ́n ń lọ rà
  rationale: Ìkọ̀ genitive absolute fi hàn pé ìlọ náà ń ṣẹlẹ̀ ní àkókò tí ọkọ ìyàwó dé. “Ń lọ rà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète ìlọ náà, ó sì pa ohun tí wọ́n fẹ́ rà mọ́ ní àìsọ gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: ὁ νυμφίος
  choice: ọkọ ìyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ọkùnrin tí ó ń ṣe ìgbéyàwó, ó sì pa àwòrán àkàwé náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: αἱ ἕτοιμοι
  choice: àwọn tí ó ti múra tán
  rationale: Àpèjúwe abo ọ̀pọ̀ náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ọmọbìnrin tí wọ́n ti múra sílẹ̀. “Àwọn tí ó ti múra tán” jẹ́ Yorùbá àdánidá, ó sì fi ìmúrasílẹ̀ wọn hàn.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: bá a wọ
  rationale: Gbólóhùn yìí sọ ní ṣókí àti ní Yorùbá àdánidá pé wọ́n wọlé pẹ̀lú rẹ̀, láìfi àlàyé míì kún ìṣe náà.
- source_word: εἰς τοὺς γάμους
  choice: wọ ibi àsè ìgbéyàwó
  rationale: Gámoi jẹ́ ọ̀pọ̀ ní ìrísí, ṣùgbọ́n nínú àyíká yìí ó tọ́ka sí ayẹyẹ tàbí àsè ìgbéyàwó. “Ibi àsè ìgbéyàwó” mú ibi tí wọ́n wọ ṣe kedere ní Yorùbá.
- source_word: ἐκλείσθη ἡ θύρα
  choice: a sì ti ilẹ̀kùn náà
  rationale: Ìsọ̀rọ̀ aláìlórúkọ olùṣe ní Yorùbá bá passive Gíríìkì mu, ó sì pa ìparí líle ti ìṣẹ̀lẹ̀ náà mọ́ láìdárúkọ ẹni tí ó ti ilẹ̀kùn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àwòrán ìgbéyàwó nínú àkàwé
  choice: Pa “ọkọ ìyàwó” àti “àsè ìgbéyàwó” mọ́ gẹ́gẹ́ bí àwòrán inú ìtàn náà.
  alternative: Ṣàlàyé ọkọ ìyàwó ní tààrà gẹ́gẹ́ bí Kristi, tàbí lo “ayẹyẹ ìgbéyàwó” dípò “àsè ìgbéyàwó.”
  rationale: Ẹsẹ náà kò sọ ẹni tí ọkọ ìyàwó dúró fún ní tààrà. Ìtumọ̀ náà jẹ́ kí ìjẹ́pàtàkì ẹ̀kọ́ ìgbàgbọ́ jáde láti inú àkàwé àti àyíká rẹ̀, dípò fífi àlàyé ìtumọ̀ sínú ọ̀rọ̀ ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo “bá a wọ” àti “a sì ti ilẹ̀kùn” gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá.
