reference: Matthew 25:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: yo
  text: Nígbà náà ni yóò dá wọn lóhùn pé, “Lóòótọ́ ni mo wí fún yín[a], níwọ̀n bí ẹ kò ti ṣe é fún ọ̀kan lára àwọn tí ó kéré jù lọ wọ̀nyí[b], ẹ kò ṣe é fún mi náà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ síi, “Àmín, mo wí fún yín.”
    reason: lexical_alternative
  - marker: b
    text: A lè lóye “àwọn tí ó kéré jù lọ wọ̀nyí” gẹ́gẹ́ bí àwọn ọmọ-ẹ̀yìn Jésù ní pàtó, tàbí ní ìtumọ̀ gbòòrò gẹ́gẹ́ bí àwọn ẹni rírẹ̀lẹ̀ àti aláìní; ìtumọ̀ yìí fi gbólóhùn náà sílẹ̀ bí ó ṣe wà nínú ọ̀rọ̀ ìpilẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn nínú àwòrán ìdájọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘nígbà náà’ ní Yorùbá.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: ni yóò dá wọn lóhùn pé
  rationale: Èyí sọ ìṣe ọjọ́ iwájú àti ọ̀rọ̀ tí ó tẹ̀ lé e ní Yorùbá àdánidá, láìsọ ìtumọ̀ ‘dá lóhùn’ nù.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Ó pa ìtẹnumọ́ àti ọlá ọ̀rọ̀ Jésù mọ́, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní; àṣàyàn ‘Àmín’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐφ’ ὅσον
  choice: níwọ̀n bí ... ti
  rationale: Ó pa èrò ìwọ̀n tàbí bí ohun ṣe rí tó mọ́, dípò yíyí rẹ̀ sí ‘nítorí’ lásán.
- source_word: οὐκ ἐποιήσατε
  choice: ẹ kò ti ṣe é
  rationale: ‘É’ dúró fún ìṣe tí àyíká ọ̀rọ̀ ti sọ tẹ́lẹ̀, ó sì mú gbólóhùn náà jẹ́ ti Yorùbá àdánidá.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: fún ọ̀kan lára àwọn tí ó kéré jù lọ wọ̀nyí
  rationale: Ó pa ẹyọ ‘ọ̀kan,’ ẹgbẹ́ ‘àwọn wọ̀nyí,’ àti ìtumọ̀ gíga jù lọ ti ἐλαχίστων mọ́ láìsọ ẹni tí gbolohun náà tọ́ka sí ní pàtó.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: ẹ kò ṣe é fún èmi náà
  rationale: Ó tún ọ̀rọ̀-ìṣe náà sọ gẹ́gẹ́ bí Gíríìkì, ó sì pa ìtẹnumọ́ pé àìṣe fún wọn jẹ́ àìṣe fún Jésù mọ́.
theological_decisions:
- issue: Ta ni ‘àwọn tí ó kéré jù lọ wọ̀nyí’ ń tọ́ka sí?
  choice: A fi gbólóhùn náà sílẹ̀ láìdá ẹni tí ó tọ́ka sí ní pàtó.
  alternative: Ó lè tọ́ka ní pàtó sí àwọn ọmọ-ẹ̀yìn tàbí ojiṣẹ́ Jésù; ó sì tún lè yé àwọn kan gẹ́gẹ́ bí àwọn ẹni rírẹ̀lẹ̀ àti aláìní ní gbogbogbòò.
  rationale: Ẹsẹ̀ náà fi ìṣe sí àwọn wọ̀nyí dọ́gba pẹ̀lú ìṣe sí Jésù, ṣùgbọ́n kò ṣàlàyé ẹgbẹ́ náà tó bẹ́ẹ̀ tí ìtumọ̀ yóò fi lè yan ọ̀kan nínú àwọn òye wọ̀nyí láìfi ẹ̀kọ́ ìtumọ̀ kan kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, àti ti Yorùbá òde òní. A lo ‘dá wọn lóhùn pé’ dípò pípa àpẹẹrẹ participle Gíríìkì mọ́ lọ́nà tí yóò le ní Yorùbá.
