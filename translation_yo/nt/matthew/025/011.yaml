  source_fidelity: Ìtumọ̀ náà pa ọ̀nà ìtàn ὕστερον δέ mọ́ nínú “Lẹ́yìn náà ... sì,” ó sì túmọ̀ ἔρχονται àti λέγουσαι ní ọ̀nà tó dáa fún Yorùbá ìtàn. “Àwọn wúńdíá yòókù náà” ń gbé αἱ λοιπαὶ παρθένοι àti agbára àfikún καί kalẹ̀ dáadáa. “Ṣí fún wa” fi ἄνοιξον ἡμῖν hàn láìfi ‘ilẹ̀kùn’ kún ọ̀rọ̀ àkọ́kọ́ Gíríìkì.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá òde òní tó ṣàn, ó sì lo àmì ohùn dáadáa. Ìtúnwí “Olúwa, Olúwa” jẹ́ ìpè tó bójú mu, “wọ́n ń wí pé” sì bá ìsinsìnyí inú ìtàn náà mu.
  terminology: “Wúńdíá” yẹ fún παρθένοι nínú àkàwé yìí, “yòókù” sì bó ìtumọ̀ ‘the remaining/other’ mu. “Olúwa” ń pa ìbòwọ̀ àti ìró ẹ̀kọ́-ìsìn tí Κύριε lè ní mọ́, láìfi ìtumọ̀ kan ṣoṣo lé e lórí. Àwọn àlàyé abẹ́lẹ̀ ń ṣàlàyé yíyàn ìtumọ̀ àti ohun tí a fi hàn nínú àyíká, kì í ṣe nínú Gíríìkì fúnra rẹ̀.
