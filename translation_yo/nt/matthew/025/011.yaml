id: MAT.25.11
reference: Matthew 25:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: yo
  text: Lẹ́yìn náà, àwọn wúńdíá yòókù[a] náà sì wá, wọ́n ń wí pé, “Olúwa, Olúwa,[b] ṣí fún wa.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn wúńdíá tó ṣẹ́ kù.”
    reason: lexical_alternative
  - marker: b
    text: 'A tún lè túmọ̀ rẹ̀ sí “Ọ̀gá, Ọ̀gá.” Ní Gíríìkì: Kyrios, kyrios.'
    reason: alternative_reading
  - marker: c
    text: Gíríìkì sọ ní ṣókí pé “ṣí fún wa”; àyíká ọ̀rọ̀ fi hàn pé ilẹ̀kùn ni wọ́n ń sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Lẹ́yìn náà
  rationale: Ó ń tọ́ka sí ohun tó ṣẹlẹ̀ nígbà tó tẹ̀ lé e; gbólóhùn yìí jẹ́ ọ̀nà àdánidá láti sọ ìtẹ̀síwájú ìtàn ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ pẹ̀lẹ́ ni δέ; “sì” so ìṣẹ̀lẹ̀ yìí mọ́ èyí tó ṣáájú láìfi ìtakora líle kún un.
- source_word: ἔρχονται
  choice: wá
  rationale: Àkókò ìsinsìnyí tí a lò gẹ́gẹ́ bí ìsinsìnyí inú ìtàn ni; “wá” pa ìrìnwọlé wọn mọ́ láìtúmọ̀ ọ́ ju bó ṣe yẹ lọ.
- source_word: καὶ
  choice: náà
  rationale: Nínú “yòókù náà,” ó fi hàn pé ẹgbẹ́ kejì náà tún dé sí ibi náà.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: àwọn wúńdíá yòókù
  rationale: “Wúńdíá” jẹ́ ìtumọ̀ tààrà fún παρθένοι, “yòókù” sì mú ìtumọ̀ λοιπαί, ìyẹn àwọn tó ṣẹ́ kù, jáde.
- source_word: λέγουσαι
  choice: wọ́n ń wí pé
  rationale: Ó ń ṣàgbékalẹ̀ ọ̀rọ̀ tààrà tí wọ́n sọ, ó sì pa ìṣe tó ń lọ ní àkókò náà mọ́.
- source_word: Κύριε κύριε
  choice: Olúwa, Olúwa
  rationale: “Olúwa” lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ fún ẹni tó ga, ó sì tún lè ní ìtumọ̀ ẹ̀kọ́ nípa Ọlọ́run nínú Mátíù; pípa àtúnwí náà mọ́ fi ìkánjú wọn hàn.
- source_word: ἄνοιξον ἡμῖν
  choice: ṣí fún wa
  rationale: Ó pa àṣẹ àti àǹfààní ẹni tí wọ́n fẹ́ kí a ṣí fún mọ́. Kò fi “ilẹ̀kùn” kún ọ̀rọ̀ pàtó Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ló túmọ̀ sí.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ ìpè tààrà
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: '“Olúwa” pa ìṣòro ìtumọ̀ méjèèjì mọ́: ó lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ nínú àkàwé náà, ó sì lè ní ìró ẹ̀kọ́ nípa Ọlọ́run nínú Ìhìn Rere Mátíù. “Ọ̀gá” nìkan yóò dín ìtumọ̀ kejì kù.'
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, àti òde òní pẹ̀lú àmì ohùn níbi tó yẹ. A pa àtúnwí ìkánjú “Olúwa, Olúwa” àti ohun tí Gíríìkì kò sọ ní kedere mọ́.
