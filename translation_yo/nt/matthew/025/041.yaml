id: MAT.25.41
reference: Matthew 25:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: yo
  text: Nígbà náà, yóò tún sọ fún àwọn tí ó wà ní apá òsì pé, “Ẹ kúrò lọ́dọ̀ mi, ẹ̀yin ẹni ègún, kí ẹ sì lọ sínú iná ayérayé tí a ti pèsè sílẹ̀ fún Èṣù àti àwọn áńgẹ́lì rẹ̀.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú àkókò nínú ìṣẹ̀lẹ̀ ìdájọ́ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐρεῖ
  choice: yóò ... sọ
  rationale: Ó pa ìṣe ọjọ́ iwájú ti λέγω mọ́ láìfi agbára míì kún un.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: fún àwọn tí ó wà ní apá òsì
  rationale: Ó tọ́ka sí ẹgbẹ́ tí ó dúró ní òsì ọba gẹ́gẹ́ bí àyíká ẹsẹ̀ náà ṣe fi hàn.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Ẹ kúrò lọ́dọ̀ mi
  rationale: Ó sọ àṣẹ láti fi iwájú ẹni tí ń sọ̀rọ̀ sílẹ̀ ní Yorùbá tí ó ṣe kedere.
- source_word: οἱ κατηραμένοι
  choice: ẹ̀yin tí a ti fi bú
  rationale: Ó pa ìtumọ̀ perfect passive participle mọ́, ṣùgbọ́n kò sọ ẹni tí ó bú wọn nígbà tí Gíríìkì náà kò sọ ọ́.
- source_word: εἰς τὸ πῦρ
  choice: ẹ lọ sínú iná
  rationale: ‘Sínú’ pa ìdarí ìṣípò sí ibi àfojúsùn tí εἰς ní mọ́; àtúnlò àṣẹ náà mú gbólóhùn náà ṣe kedere ní Yorùbá.
- source_word: τὸ αἰώνιον
  choice: ayérayé
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ jù lọ fún αἰώνιος ní àyíká ìdájọ́ yìí, láìdín agbára ọ̀rọ̀ náà kù.
- source_word: τὸ ἡτοιμασμένον
  choice: tí a ti pèsè sílẹ̀
  rationale: Ó fi ipò tí ó jẹ́ àbájáde ìmúrasílẹ̀ tẹ́lẹ̀ hàn, gẹ́gẹ́ bí perfect passive participle ṣe rí.
- source_word: τῷ διαβόλῳ
  choice: fún Èṣù
  rationale: Nínú àyíká ìdájọ́ òpin yìí, διάβολος jẹ́ orúkọ ìdámọ̀ fún Èṣù, kì í ṣe olùbanilórúkọjẹ́ lásán.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: àwọn áńgẹ́lì rẹ̀
  rationale: Àyíká náà ń tọ́ka sí àwọn ẹ̀dá ọ̀run tí wọ́n wà ní ìṣọ̀kan pẹ̀lú Èṣù, kì í ṣe àwọn ońṣẹ́ ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ αἰώνιον nínú àyíká ìdájọ́
  choice: ayérayé
  alternative: tí ó pẹ́ títí; ti sáà náà
  rationale: ‘Ayérayé’ bá lílò Koiné tí ó ṣeé retí jù lọ nínú àyíká yìí mu, ó sì pa ìwúwo ìdájọ́ òpin mọ́ láìfi ètò ẹ̀kọ́ ìsìn kan pàtó lé e lórí.
- issue: Àwọn tí διάβολος àti ἄγγελοι ń tọ́ka sí
  choice: Èṣù àti àwọn áńgẹ́lì rẹ̀
  alternative: olùbanilórúkọjẹ́ àti àwọn ońṣẹ́ rẹ̀
  rationale: Àyíká ìdájọ́ òpin àti lílò ọ̀rọ̀ yìí tọ́ka sí Èṣù àti àwọn ẹ̀dá ọ̀run tí ó tẹ̀ lé e; ìtumọ̀ gbogbogbò yóò dín ìtọ́kasí náà kù.
- issue: Ẹni tí ó ṣe ègún nínú οἱ κατηραμένοι
  choice: ẹ̀yin tí a ti fi bú
  alternative: ẹ̀yin ẹni ègún
  rationale: Fọ́ọ̀mù passive náà kò dárúkọ ẹni tí ó bú wọn. Ìtumọ̀ yìí pa àìsọ ẹni náà mọ́, kò sì pinnu ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ láìsọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ̀yin’ àti àmì ọ̀pọ̀ nínú àwọn ọ̀rọ̀ àṣẹ láti fi hàn pé gbogbo ẹgbẹ́ ni a ń bá sọ̀rọ̀. A kò gbe àlàyé ẹsẹ̀ ìsàlẹ̀ Gẹ̀ẹ́sì wọlé nítorí àmì rẹ̀ kò bá àlàyé rẹ̀ mu, kò sì dúró lórí àìdánilójú gidi kan nínú ẹsẹ Gíríìkì tí a fi fún wa.
