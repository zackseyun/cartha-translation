  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: ìṣe ọjọ́ iwájú, ‘àwọn olódodo,’ ìbéèrè àkókò, àti ìfararora ebi/òǹgbẹ pẹ̀lú fífún ní oúnjẹ àti ohun mímu ni a pa mọ́. Ṣùgbọ́n ‘omi’ lè sọ ohun kan pàtó ju ἐποτίσαμεν lọ, nítorí Gíríìkì kan sọ pé wọ́n fún un ní ohun mímu.'
