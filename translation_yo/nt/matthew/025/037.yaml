  to: Nígbà náà ni àwọn olódodo yóò dá a lóhùn pé, “Olúwa, ìgbà wo ni a rí ọ tí ebi ń pa ọ, tí a sì fún ọ ní oúnjẹ, tàbí tí òǹgbẹ ń gbẹ ọ, tí a sì fún ọ ní ohun mímu[a]?”
