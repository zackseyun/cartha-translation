id: MAT.25.37
reference: Matthew 25:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: yo
  text: Nígbà náà ni àwọn olódodo yóò dá a lóhùn pé, “Olúwa, ìgbà wo ni a rí ọ tí ebi ń pa ọ, tí a sì fún ọ ní oúnjẹ, tàbí tí òǹgbẹ ń gbẹ ọ, tí a sì fún ọ ní ohun mímu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààràtà jù: “a sì fún ọ ní ohun láti mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi hàn pé ohun tí a ń sọ yìí tẹ̀ lé ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú ìtàn náà; ìṣètò ‘ni’ jẹ́ àdánidá ní Yorùbá.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: yóò dá a lóhùn
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún ọ̀rọ̀ ìṣe ọjọ́ iwájú àti ẹni tí wọ́n ń dá lóhùn.
- source_word: οἱ δίκαιοι
  choice: àwọn olódodo
  rationale: ‘Àwọn olódodo’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn ẹni tí a kà sí olódodo, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kun un.
- source_word: λέγοντες
  choice: pé
  rationale: Ní Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti darapọ̀ ọ̀rọ̀ dídáhùn mọ́ ọ̀rọ̀ taara tó tẹ̀ lé e.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ìtumọ̀ ọ̀wọ̀ àti ìjẹ́pàtàkì orúkọ oyè κύριος mọ́ nínú ọ̀rọ̀ tí a ń bá Jesu sọ.
- source_word: πότε σε εἴδομεν
  choice: ìgbà wo ni a rí ọ
  rationale: Ìbéèrè àkókò náà ni a túmọ̀ ní ọ̀nà Yorùbá tó ṣe kedere, láìfikún ohunkóhun.
- source_word: πεινῶντα
  choice: tí ebi ń pa ọ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún jíjẹ́ ẹni tí ebi ń pa, ó sì pa ìṣe tó ń lọ mọ́.
- source_word: ἐθρέψαμεν
  choice: a sì fún ọ ní oúnjẹ
  rationale: Ó sọ ìṣe fífún ẹni ní oúnjẹ ní kedere; ó bá ìtumọ̀ τρέφω mu ní àyíká yìí.
- source_word: διψῶντα
  choice: tí òǹgbẹ ń gbẹ ọ
  rationale: Èyí ni gbólóhùn Yorùbá àdánidá tó ṣe déédé pẹ̀lú ‘tí ebi ń pa ọ.’
- source_word: ἐποτίσαμεν
  choice: a sì fún ọ ní omi mu
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì ṣe kedere fún fífún ẹni tí òǹgbẹ ń gbẹ ní ohun mímu; ‘omi’ jẹ́ ohun tí ọ̀rọ̀ àyíká ń tọ́ka sí láìṣòro.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ taara sí Jesu
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ ọ̀wọ̀ àti agbára orúkọ oyè náà mọ́, pẹ̀lú ìró Kristẹni tó wà nínú Mátíù, láìsọ ohun tí ẹsẹ̀ náà kò sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní ọlá tí àwọn òǹkàwé lásán lè lóye. A lo àpẹẹrẹ Yorùbá àdánidá ‘ebi ń pa’ àti ‘òǹgbẹ ń gbẹ,’ a sì pa ìbárapọ̀ àwọn gbólóhùn Gíríìkì mọ́.
