  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: yo
  text: Nítorí ebi pa mí, ẹ kò sì fún mi ní ohunkóhun láti jẹ[a]; òùngbẹ gbẹ mí, ẹ kò sì fún mi ní ohunkóhun láti mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ Gíríìkì: “ẹ kò fún mi ní ohun tí màá jẹ … ẹ kò fún mi ní ohun tí màá mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: ebi pa mí
  rationale: Ọ̀rọ̀ yìí sọ ipò ebi tí ẹni tó ń sọ̀rọ̀ wà tẹ́lẹ̀. “Ebi pa mí” ni ọ̀nà Yorùbá òde òní tó ṣe kedere, tó sì bójú mu láti sọ ọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń fi ìdí fún ìdájọ́ tí a sọ ní àyíká ẹsẹ yìí; “Nítorí” pa agbára àlàyé náà mọ́.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: ẹ kò sì fún mi ní ohunkóhun láti jẹ
  rationale: Gíríìkì náà túmọ̀ ní ọ̀nà tó sún mọ́lẹ̀ sí “ẹ kò fún mi láti jẹ.” Ìtumọ̀ tí a yàn jẹ́ Yorùbá àdánidá, ó sì pa “mi” àti ìṣe “jẹ” mọ́ ní kedere.
- source_word: μοι
  choice: mi
  rationale: A pa arọ́pò-orúkọ ẹni kìn-ín-ní mọ́ gẹ́gẹ́ bí ẹni tí a kò fún ní ohun tí yóò jẹ.
- source_word: φαγεῖν
  choice: láti jẹ
  rationale: A túmọ̀ infinitive náà gẹ́gẹ́ bí ìṣe, kì í ṣe gẹ́gẹ́ bí orúkọ “oúnjẹ,” kí ìṣètò àti ìtumọ̀ Gíríìkì lè dúró.
- source_word: ἐδίψησα
  choice: òùngbẹ gbẹ mí
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ipò òùngbẹ, ó sì bá “ebi pa mí” dọ́gba nínú ìlà kejì.
- source_word: ἐποτίσατέ με
  choice: ẹ kò sì fún mi ní ohunkóhun láti mu
  rationale: ποτίζω lè túmọ̀ sí fífún ẹni ní ohun mímu tàbí mímú ẹni mu. Nínú ọ̀rọ̀ nípa pípèsè fún ẹni aláìní yìí, gbolohun tí a yàn ló ṣe àfihàn ìtumọ̀ náà lọ́nà Yorùbá tó ṣe kedere.
- source_word: με
  choice: mi
  rationale: A pa ẹni tí ìkọ̀sílẹ̀ náà kan mọ́ ní tààràtà, bí ó ti rí nínú Gíríìkì.
theological_decisions:
- issue: Bí a ṣe máa sọ àwọn gbólóhùn ìpèsè tí a sẹ́
  choice: ẹ kò sì fún mi ní ohunkóhun láti jẹ ... ẹ kò sì fún mi ní ohunkóhun láti mu
  alternative: ẹ kò fún mi láti jẹ ... ẹ kò fún mi láti mu
  rationale: Kì í ṣe ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí àríyànjiyàn wà lórí rẹ̀, ṣùgbọ́n ó wà nínú ọ̀rọ̀ Jesu nípa ìdájọ́ àti àánú tí a ṣe tàbí tí a kò ṣe. Ìtumọ̀ tí a yàn pa ìkọ̀sílẹ̀ ẹni náà mọ́, ó sì jẹ́ Yorùbá òde òní tó yé kedere láìfi ohun míì kún ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà ní ọ̀wọ̀, ó ṣe kedere fún òǹkàwé lásán, ó sì pa ìfarajọ́ láàárín ebi àti òùngbẹ mọ́.
