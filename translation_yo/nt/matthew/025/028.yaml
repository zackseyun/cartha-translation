  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: yo
  text: Nítorí náà, ẹ gba tálẹ́ǹtì náà lọ́wọ́ rẹ̀,[a] ẹ sì fi fún ẹni tí ó ní tálẹ́ǹtì mẹ́wàá náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ mú tálẹ́ǹtì náà kúrò lọ́dọ̀ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gba” tàbí “mú kúrò.”
    reason: lexical_alternative
  - marker: b
    text: “Tálẹ́ǹtì” jẹ́ ìwọ̀n ńlá ní ayé àtijọ́, tí a sì tún ń lò láti fi díwọ̀n iye owó.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: ẹ gba ... lọ́wọ́ rẹ̀
  rationale: Àṣẹ aorist plural αἴρω níbí túmọ̀ sí kí wọ́n mú ohun náà kúrò lọ́dọ̀ ẹni náà. Èdè Yorùbá àdánidá ‘gba ... lọ́wọ́ rẹ̀’ fi ìyapa àti agbára àṣẹ hàn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí tàbí àbájáde ìdájọ́ tí ó ṣáájú hàn, ó sì pa ìsopọ̀ ọgbọ́n inú ọ̀rọ̀ náà mọ́.
- source_word: ἀπ’ αὐτοῦ
  choice: lọ́wọ́ rẹ̀
  rationale: Àkójọpọ̀ yìí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ láti sọ pé a gba ohun kan kúrò ní ọwọ́ ẹni kan.
- source_word: τὸ τάλαντον
  choice: tálẹ́ǹtì náà
  rationale: A pa orúkọ ìwọ̀n àti owó ìgbàanì náà mọ́, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀bùn àbínibí; ‘náà’ tún fi pàtó ohun tí a ti mẹ́nu kàn hàn.
- source_word: δότε
  choice: kí ẹ sì fi fún
  rationale: Ó mú àṣẹ plural náà jáde ní èdè Yorùbá àdánidá, ó sì so ìṣe kejì mọ́ ti àkọ́kọ́.
- source_word: τῷ ἔχοντι
  choice: ẹni tí ó ní
  rationale: Ó ṣe àfihàn articular participle náà láìfi akọ tàbí abo tí Gíríìkì kò tẹnumọ́ kún un.
- source_word: τὰ δέκα τάλαντα
  choice: tálẹ́ǹtì mẹ́wàá náà
  rationale: ‘Náà’ pa ìtọ́ka sí iye pàtó tí a ti sọ tẹ́lẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ τάλαντον nínú àkàwé
  choice: A lo ọ̀rọ̀ ìtàn ‘tálẹ́ǹtì’ fún ìwọ̀n tí a tún ń lò gẹ́gẹ́ bí iye owó.
  alternative: owó; iye owó ńlá
  rationale: Èyí pa àyíká ìtàn àti ìtumọ̀ ìgbàanì mọ́, kò sì sọ ọ́ di ‘ẹ̀bùn àbínibí,’ ìtumọ̀ tí a lè fi kún un láti òde àyíká ẹsẹ̀ náà.
- issue: Agbára àṣẹ plural nínú ἄρατε àti δότε
  choice: A lo ‘ẹ ...’ lẹ́ẹ̀mejì gẹ́gẹ́ bí àṣẹ sí ọ̀pọ̀ ènìyàn.
  alternative: Àṣẹ aláìsọ ẹni tàbí àṣẹ sí ẹnì kan ṣoṣo
  rationale: Àwọn ọ̀rọ̀ Gíríìkì méjèèjì jẹ́ imperative plural; ìtumọ̀ náà pa nọ́ńbà àti agbára àṣẹ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àwọn fọ́ọ̀mù ‘ẹ’ pa plural imperative Gíríìkì mọ́; ‘tálẹ́ǹtì’ jẹ́ àyálò tó nílò àlàyé ìsàlẹ̀ ojú ìwé láti dènà ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ẹ̀bùn àbínibí.
