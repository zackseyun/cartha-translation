  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ọkọ ìyàwó náà pẹ́, gbogbo wọn tòògbé, wọ́n sì sùn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo wọn tòògbé, wọ́n sì ń sùn.” Ọ̀rọ̀ Gíríìkì ya títòògbé sọ́tọ̀ kúrò nínú sísùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: bí ... ṣe pẹ́ tó
  rationale: Ọ̀rọ̀ yìí fi hàn pé ọkọ ìyàwó náà gba àkókò púpọ̀ ju bí a ti retí lọ. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún fífi hàn pé ẹnì kan ló dá a dúró, èyí tí Gíríìkì kò sọ ní pàtó.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora hàn láàárín ìretí wọn àti pípẹ́ tí ọkọ ìyàwó náà pẹ́.
- source_word: νυμφίου
  choice: ọkọ ìyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ọkùnrin tí ó ń ṣe ìgbéyàwó, ó sì pa àwòrán inú àkàwé náà mọ́.
- source_word: ἐνύσταξαν
  choice: bẹ̀rẹ̀ sí í tòògbé
  rationale: Ó pa ìtumọ̀ ìbẹ̀rẹ̀ oorun tàbí rírẹ̀ sí oorun mọ́, kí ó sì yàtọ̀ sí sísùn gan-an tí ọ̀rọ̀ tó tẹ̀ lé e sọ.
- source_word: πᾶσαι
  choice: gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo àwọn wúńdíá mẹ́wàá láìyọ ẹnikẹ́ni sílẹ̀.
- source_word: ἐκάθευδον
  choice: wọ́n sì sùn
  rationale: Ó sọ ìgbésẹ̀ láti inú títòògbé dé inú oorun ní Yorùbá àdánidá. Àmì ìsàlẹ̀ ojú ìwé ṣàlàyé pé ìṣe Gíríìkì náà tún lè tẹnumọ́ pé wọ́n wà nínú oorun.
theological_decisions:
- issue: Àwòrán ọkọ ìyàwó nínú àkàwé
  choice: Pa “ọkọ ìyàwó” mọ́ gẹ́gẹ́ bí àwòrán inú ìtàn náà, láìfi kún un pé ó dúró fún Kristi.
  alternative: Ṣàlàyé ẹni tí ọkọ ìyàwó náà dúró fún nínú ara ẹsẹ̀ náà.
  rationale: Àyíká Mátíù lè fún àwòrán náà ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ ń bá àkàwé náà lọ. Ìtumọ̀ náà kò gbọ́dọ̀ pinnu ohun tí ẹsẹ̀ náà kò sọ ní gbangba.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “tòògbé” láti fi ìpele ṣíṣú sí oorun hàn, lẹ́yìn náà “sùn” fún oorun gan-an. Àmì ohùn wà níbi tí ó bá yẹ.
