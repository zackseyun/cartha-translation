id: MAT.25.29
reference: Matthew 25:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: yo
  text: Nítorí ẹnikẹ́ni tí ó ní, a ó fún un sí i, yóò sì pọ̀ yanturu[a]; ṣùgbọ́n ẹni tí kò ní, àní ohun tí ó ní pàápàá ni a ó gbà kúrò lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò sì ní lọ́pọ̀ yanturu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Nítorí ẹnikẹ́ni tí ó ní
  rationale: “Nítorí” fi iṣẹ́ ìṣàlàyé γάρ hàn; “ẹnikẹ́ni tí ó ní” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àpẹẹrẹ olúkúlùkù tí gbolohun participle náà ń tọ́ka sí.
- source_word: δοθήσεται
  choice: a ó fún un sí i
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú ní fọ́ọ̀mù aláìsọ olùṣe. Ìlò “a ó” kò sọ ẹni tó ń ṣe iṣẹ́ náà, “fún un sí i” sì mú ìtumọ̀ ohun tí a ó fi kún ohun tó ti ní ṣe kedere gẹ́gẹ́ bí àyíká òwe náà ṣe béèrè.
- source_word: περισσευθήσεται
  choice: yóò sì ní lọ́pọ̀ yanturu
  rationale: Èyí sọ ipò ọ̀pọ̀ yanturu tí yóò jẹ́ àbájáde fífún un, ní èdè Yorùbá tó ṣe kedere. Àlàyé ìsàlẹ̀ pa ìtumọ̀ míì, “yóò sì pọ̀ sí i,” mọ́.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: ṣùgbọ́n ẹni tí kò ní
  rationale: Ó pa ìyàtọ̀ δέ àti àpẹẹrẹ ẹni kan ṣoṣo tí participle náà ní mọ́, láìjẹ́ kí Yorùbá rẹ̀ le.
- source_word: καὶ ὃ ἔχει
  choice: àní ohun tí ó ní pàápàá
  rationale: καί jẹ́ ti ìtẹnumọ́ níbí; àpapọ̀ “àní ... pàápàá” mú ìyàlẹ́nu òwe náà jáde ní Yorùbá.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ni a ó gbà kúrò lọ́wọ́ rẹ̀
  rationale: “A ó gbà kúrò lọ́wọ́ rẹ̀” pa ìtumọ̀ yíyọ ohun náà kúrò, ìtọ́kasí ìpínyà ἀπό, àti àìdárúkọ olùṣe mọ́.
theological_decisions:
- issue: Ìtọ́kasí ẹni kan ṣoṣo tí ó dúró fún gbogbo ènìyàn
  choice: Lo “ẹnikẹ́ni ... un” àti “ẹni ... rẹ̀”
  alternative: Yí gbogbo rẹ̀ sí ọ̀pọ̀ ènìyàn, bí “àwọn tí wọ́n ní”
  rationale: Gíríìkì lo participle akọ ẹyọ kan pẹ̀lú agbára àpapọ̀. Yorùbá kò nílò àmì akọ ní ọ̀rọ̀ arọ́pò-orúkọ, ṣùgbọ́n ó lè pa ètò ẹyọ kan àti agbára àpapọ̀ náà mọ́ lọ́nà àdánidá.
- issue: Olùṣe tí a kò dárúkọ nínú àwọn ọ̀rọ̀ aláìsọ olùṣe
  choice: Lo “a ó” láìdárúkọ ẹni tó ń fún tàbí tó ń gbà
  alternative: Dárúkọ Ọlọ́run gẹ́gẹ́ bí olùṣe
  rationale: Orísun kò dárúkọ olùṣe. Ìtumọ̀ náà kò fi Ọlọ́run tàbí olùṣe mìíràn kún ọ̀rọ̀ ní tààràtà, nítorí náà ó pa àìsọ olùṣe náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó bá yẹ. “Lọ́pọ̀ yanturu” jẹ́ gbólóhùn àdánidá fún ọ̀pọ̀ tó kọjá àìní, “a ó” sì jẹ́ kí olùṣe tí orísun kò dárúkọ má ṣe di ẹni tí a sọ ní pàtó.
