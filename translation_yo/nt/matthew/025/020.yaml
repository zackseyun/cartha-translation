id: MAT.25.20
reference: Matthew 25:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: yo
  text: Ẹni tí ó sì ti gba tálẹ́ǹtì márùn-ún[a] náà wá síwájú, ó sì mú tálẹ́ǹtì márùn-ún mìíràn wá, ó ní, “Olúwa[b], ìwọ fi tálẹ́ǹtì márùn-ún lé mi lọ́wọ́; wò ó, mo ti jèrè tálẹ́ǹtì márùn-ún mìíràn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tálẹ́ǹtì jẹ́ ìwọ̀n ńlá tí a fi ń wọn iye owó ní ayé ìgbàanì.
    reason: cultural_note
  - marker: b
    text: 'Tàbí “Ọ̀gá.” Ní èdè Gíríìkì: Kyrios.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: wá síwájú
  rationale: Ó fi hàn pé ìránṣẹ́ náà sún mọ́ olúwa rẹ̀ láti fi ohun tí ó mú wá hàn án; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá nínú irú ìṣẹ̀lẹ̀ yìí.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Ẹni tí ó sì ti gba tálẹ́ǹtì márùn-ún náà
  rationale: Àpólà aláìlórúkọ yìí dá ẹni náà mọ̀ nípa ohun tí ó ti gba ṣáájú; “ti gba” fi ìṣe tó ṣáájú ìṣe pàtàkì ẹsẹ náà hàn láìfi “ọkùnrin” kún orísun.
- source_word: τάλαντα
  choice: tálẹ́ǹtì
  rationale: A pa orúkọ ìwọ̀n owó ńlá ìgbàanì mọ́, nítorí fífi “àpò wúrà” rọ́pò rẹ̀ yóò dín ìtumọ̀ orísun kù; àlàyé kúkúrú wà ní àlàyé ìsàlẹ̀.
- source_word: προσήνεγκεν
  choice: mú ... wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ pé ó gbé àfikún owó náà wá síwájú olúwa rẹ̀, láìfi ìtumọ̀ ìrúbọ sínú ọ̀rọ̀ náà.
- source_word: ἄλλα πέντε τάλαντα
  choice: tálẹ́ǹtì márùn-ún mìíràn
  rationale: Ó pa àfikún iye kan náà àti àtúnṣe gbolohun Gíríìkì mọ́.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” lè tọ́ka sí ẹni tó ni ìránṣẹ́ nínú àkàwé, ó sì tún pa àwọ̀ ìtumọ̀ gbooro ti κύριος mọ́.
- source_word: παρέδωκας
  choice: fi ... lé mi lọ́wọ́
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìfifúnni sí àbójútó ẹni hàn, ó sì bá ìṣe fífi owó náà fún ìránṣẹ́ mu.
- source_word: ἴδε
  choice: wò ó
  rationale: Àṣẹ àfiyèsí àdánidá ní Yorùbá ni, tó bá agbára ọ̀rọ̀ Gíríìkì mu láìlo èdè àtijọ́.
- source_word: ἐκέρδησα
  choice: mo ti jèrè
  rationale: “Jèrè” sọ èrè tàbí àfikún tí a rí ní pàtó; àmì “ti” fi ìṣe tó parí tí àbájáde rẹ̀ wà níwájú hàn.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ àkàwé
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú ìtàn náà, ẹni tí a ń bá sọ̀rọ̀ ni olúwa ìránṣẹ́; “Olúwa” pa ìtumọ̀ ìbáṣepọ̀ yẹn àti ìró ẹ̀kọ́-ìsìn tó lè wà nínú Mátíù mọ́, láìfipá pinnu pé ẹsẹ yìí ń ṣe ìjẹ́wọ́ Kristi ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “wá síwájú,” “fi ... lé mi lọ́wọ́,” àti “wò ó” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá, a sì pa tálẹ́ǹtì gẹ́gẹ́ bí ọ̀rọ̀ àṣà orísun mọ́ pẹ̀lú àlàyé.
