id: MAT.25.40
reference: Matthew 25:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: yo
  text: Ọba náà yóò dá wọn lóhùn pé, “Lóòótọ́ ni mo sọ fún yín[a], níwọ̀n bí ẹ ti ṣe é fún ọ̀kan nínú àwọn arákùnrin mi wọ̀nyí tí wọ́n kéré jù lọ[b], ẹ ṣe é fún mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ ní ọ̀nà tí ó tẹ̀ lé Gíríìkì ní pẹkipẹki pé, “Àmín, mo sọ fún yín.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn arákùnrin” túmọ̀ ọ̀rọ̀ Gíríìkì akọ púpọ̀. “Àwọn arákùnrin mi wọ̀nyí” lè tọ́ka ní pàtó sí àwọn ọmọ-ẹ̀yìn Jesu, sí àwọn onígbàgbọ́ lápapọ̀, tàbí ní ọ̀nà tí ó gbòòrò sí àwọn tí ó jẹ́ aláìlera tàbí aláìní; ìtumọ̀ yìí pa ọ̀rọ̀ náà mọ́ láìyanju ìbéèrè náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: yóò dá wọn lóhùn pé
  rationale: Àpapọ̀ participle ἀποκριθείς àti ọ̀rọ̀-ìṣe ọjọ́ iwájú ἐρεῖ túmọ̀ sí pé Ọba yóò fèsì, yóò sì sọ̀rọ̀. “Dá wọn lóhùn pé” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìdáhùn àti ìṣáájú ọ̀rọ̀ taara mọ́.
- source_word: ὁ βασιλεὺς
  choice: Ọba náà
  rationale: “Ọba” pa oyè inú Gíríìkì mọ́; “náà” fi hàn pé ẹni tí àyíká ẹsẹ̀ ti tọ́ka sí ni, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Èyí fi agbára ọ̀rọ̀ ìmúdájú Ἀμήν hàn ní Yorùbá òde òní, ó sì pa ìlànà “mo sọ fún yín” mọ́.
- source_word: ἐφ’ ὅσον
  choice: níwọ̀n bí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìwọ̀n tàbí bí ohun kan ṣe rí tó. “Níwọ̀n bí” sun mọ́ ìtumọ̀ náà, ó sì yẹra fún yíyí gbolohun náà sí ọ̀rọ̀ àlàyé tí ó gbòòrò jù.
- source_word: ἐποιήσατε
  choice: ẹ ti ṣe é
  rationale: A lo “é” fún ohun tí a ṣe, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe fi iṣẹ́ náà sílẹ̀ láìsọ irú iṣẹ́ náà ní ẹsẹ̀ yìí. Àtúnlò rẹ̀ ní ìparí tún pa ìbáradọ́gba gbolohun mọ́.
- source_word: ἑνὶ τούτων
  choice: fún ọ̀kan nínú … wọ̀nyí
  rationale: “Ọ̀kan nínú … wọ̀nyí” pa agbára ἑνί, ẹni kọ̀ọ̀kan kan, àti itọ́kasí τούτων mọ́. “Fún” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ẹni tí iṣẹ́ náà kan hàn.
- source_word: τῶν ἀδελφῶν μου
  choice: àwọn arákùnrin mi
  rationale: “Àwọn arákùnrin” bá ọ̀rọ̀ Gíríìkì akọ púpọ̀ mu, “mi” sì pa ìní ẹni àkọ́kọ́ mọ́ láìyanju ẹni tí ẹgbẹ́ náà ń tọ́ka sí.
- source_word: τῶν ἐλαχίστων
  choice: tí ó kéré jù lọ
  rationale: Èyí pa ìtumọ̀ superlative náà mọ́, ó sì lè kan ipò, ọlá, tàbí bí a ṣe ka ẹni sí láìdín ìtumọ̀ rẹ̀ kù sí “aláìní” nìkan.
- source_word: ἐμοὶ ἐποιήσατε
  choice: ẹ ṣe é fún mi
  rationale: “Fún mi” fi dative ἐμοί hàn, ó sì pa ìdánimọ̀ tó lágbára mọ́ láàárín ohun tí a ṣe fún àwọn arákùnrin náà àti ohun tí a ṣe fún Ọba.
theological_decisions:
- issue: Ẹni tí “àwọn arákùnrin mi wọ̀nyí” ń tọ́ka sí
  choice: A pa gbolohun náà mọ́ láìsọ pàtó ẹni tí ó ń tọ́ka sí.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí àwọn ọmọ-ẹ̀yìn Jesu, gbogbo onígbàgbọ́, tàbí gbogbo aláìní àti aláìlera.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò parí àríyànjiyàn nípa ẹni tí gbolohun yìí ń tọ́ka sí. Mímú ọ̀rọ̀ orísun náà wá sí Yorùbá láìfikún ìtumọ̀ pàtó pa àìdánilójú àti ìfúnpọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- issue: Ìṣàmúlò akọ nínú ἀδελφῶν
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn ọmọ ìyá kan
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ púpọ̀. “Àwọn arákùnrin” pa àkójọpọ̀ akọ náà mọ́, kò sì fi ìtúmọ̀ àfikún sí ààlà ẹgbẹ́ tí ẹsẹ̀ náà ń sọ̀rọ̀ nípa rẹ̀.
- issue: Ìtumọ̀ “àwọn tí ó kéré jù lọ”
  choice: tí ó kéré jù lọ
  alternative: àwọn aláìní jù lọ; àwọn tí kò ṣe pàtàkì jù lọ; àwọn onírẹ̀lẹ̀ jù lọ
  rationale: ἐλαχίστων lè tọ́ka sí ìrẹ̀lẹ̀ ipò tàbí bí a ṣe ka ẹni sí. “Kéré jù lọ” pa ìmọ̀ ìtumọ̀ náà gbòòrò, kò sì sọ ọ́ di ìpín awujọ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Dá wọn lóhùn pé” àti “ẹ ṣe é fún mi” jẹ́ àdánidá fún olùkà Yorùbá, nígbà tí “níwọ̀n bí” àti “tí ó kéré jù lọ” ń pa ìrísí àti àìdánilójú pàtàkì ti orísun Gíríìkì mọ́.
