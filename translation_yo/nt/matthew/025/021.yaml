id: MAT.25.21
reference: Matthew 25:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: yo
  text: Ọ̀gá rẹ̀[b] sì wí fún un pé, “O ṣe dáadáa, ìwọ ìránṣẹ́ rere àti olóòtítọ́![a] O ti jẹ́ olóòtítọ́ lórí ohun díẹ̀; èmi yóò yàn ọ́ sí olórí ohun púpọ̀. Wọ inú ayọ̀ ọ̀gá rẹ lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ẹrú”: “ìwọ ẹrú rere àti olóòtítọ́!” Ọ̀rọ̀ Gíríìkì náà, δοῦλος (doulos), lè túmọ̀ sí “ìránṣẹ́” tàbí “ẹrú,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.'
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì κύριος (kyrios) tún lè jẹ́ “olúwa.” “Ọ̀gá” ni a lò níbí nítorí ìbáṣepọ̀ ọ̀gá àti ìránṣẹ́ nínú àkàwé náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: wí
  rationale: Ọ̀rọ̀ ìṣáájú sí ọ̀rọ̀ tààrà ni φημί níbí; “wí” jẹ́ ọ̀nà Yorùbá tó bójú mu, tó sì ní iyì.
- source_word: κύριος
  choice: olúwa
  rationale: “Olúwa” lè tọ́ka sí ẹni tó ní àṣẹ lórí ìránṣẹ́ nínú àkàwé yìí, láìfi dandan sọ ọ́ di orúkọ oyè Kristi ní ìpele ìtàn.
- source_word: δοῦλε
  choice: ìránṣẹ́
  rationale: “Ìránṣẹ́” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún ẹni tó ń ṣiṣẹ́ lábẹ́ olúwa; àlàyé ìsàlẹ̀ fi hàn pé “ẹrú” tún ṣeé lò fún δοῦλος.
- source_word: Εὖ
  choice: O ṣe dáadáa
  rationale: Èyí jẹ́ gbólóhùn ìyìn tó bá Yorùbá òde òní mu, ó sì mú ìtẹ́wọ́gbà tí εὖ ń sọ jáde.
- source_word: ἀγαθὲ
  choice: rere
  rationale: “Rere” ni ìtumọ̀ tààrà, tó sì bá πιστέ mu nínú ọ̀rọ̀ ìyìn náà.
- source_word: πιστέ / πιστός
  choice: olóòtítọ́
  rationale: Lílo ọ̀rọ̀ kan náà ní ibi méjèèjì pa àsopọ̀ àti àtúnwí Gíríìkì mọ́, ó sì sọ ìdúróṣinṣin ẹni tí a lè gbẹ́kẹ̀ lé.
- source_word: ἐπὶ ὀλίγα
  choice: lórí ohun díẹ̀
  rationale: Ó fi ojúṣe tàbí àṣẹ lórí ohun tí a fi lé ẹni lọ́wọ́ hàn, ó sì pa ìfiwéra pẹ̀lú “ohun púpọ̀” mọ́.
- source_word: καταστήσω ἐπὶ πολλῶν
  choice: èmi yóò fi ọ́ ṣe olórí ohun púpọ̀
  rationale: Ó sọ yíyan ẹni sí ipò ojúṣe lórí ohun púpọ̀ ní Yorùbá tó ṣe kedere, ó sì tẹnumọ́ “èmi” gẹ́gẹ́ bí σε ... καταστήσω ṣe rí.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Wọ inú ayọ̀ ... lọ
  rationale: Ó pa àwòrán gidi ti wíwọ inú ayọ̀ mọ́, dípò kí a tú u sí ìkópa lásán.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àkàwé tí olúwa inú ìtàn lè dúró fún Ọlọ́run tàbí Kristi
  choice: olúwa
  alternative: Olúwa gẹ́gẹ́ bí orúkọ oyè àtọ̀runwá
  rationale: Ní ìpele ìtàn, κύριος ni ẹni tó ní àṣẹ lórí ìránṣẹ́. Kí “olúwa” bẹ̀rẹ̀ pẹ̀lú lẹ́tà kékeré ń pa ìbáṣepọ̀ inú àkàwé mọ́, láìkọ́ ìtumọ̀ àpẹẹrẹ rẹ̀ sílẹ̀ fún òǹkàwé.
- issue: Ìtumọ̀ δοῦλος nínú àyíká yìí
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: “Ìránṣẹ́” jẹ́ àdánidá nínú ọ̀rọ̀ ìyìn Yorùbá, ṣùgbọ́n δοῦλος lè túmọ̀ sí “ẹrú”; a pa ìtumọ̀ yẹn mọ́ nínú àlàyé láti má ṣe bo ipò ìṣàkóso tó wà nínú ọ̀rọ̀ náà mọ́lẹ̀.
translation_notes:
  register: Yorùbá àtẹ̀jáde, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. Gbólóhùn “O ṣe dáadáa” jẹ́ ìyìn tó rọrùn láti lóye; “Wọ inú ayọ̀ ... lọ” sì pa àwòrán orísun Gíríìkì mọ́.
