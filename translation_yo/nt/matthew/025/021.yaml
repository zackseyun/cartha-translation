  to: Ọ̀gá rẹ̀[b] sì wí fún un pé, “O ṣe dáadáa, ìwọ ìránṣẹ́ rere àti olóòtítọ́![a] O ti jẹ́ olóòtítọ́ lórí ohun díẹ̀; èmi yóò yàn ọ́ sí olórí ohun púpọ̀. Wọ inú ayọ̀ ọ̀gá rẹ lọ.”
  rationale: Àtúnṣe náà mú àsìkò ἦς (“O ti jẹ́”) bá orísun mu, ó lo “yàn ọ́ sí olórí” fún καταστήσω, ó sì tún so àmì àlàyé κύριος mọ́ ọ̀rọ̀ tí ó ń ṣàlàyé. Ìtumọ̀ àkàwé, ìyìn náà, ìfiwéra ohun díẹ̀ àti ohun púpọ̀, àti àwòrán wíwọ inú ayọ̀ ni a pa mọ́.
