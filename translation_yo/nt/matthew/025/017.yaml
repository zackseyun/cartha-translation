lexical_decisions:
- source_word: ὡσαύτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ìṣe ìránṣẹ́ yìí mọ́ ti ìránṣẹ́ inú ẹsẹ 16, ó sì pa agbára ìfiwéra ọ̀rọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: ὁ τὰ δύο
  choice: ẹni tí ó ní méjì náà
  rationale: Gbólóhùn Gíríìkì náà yọ ọ̀rọ̀ tí a ti mọ̀ nínú àyíká sílẹ̀; ìtumọ̀ yìí pa ìṣókí náà mọ́, ó sì tọ́ka sí ìránṣẹ́ tí ó ní tálẹ́ńtì méjì.
- source_word: ἐκέρδησεν
  choice: jèrè
  rationale: Nínú àyíká owó yìí, “jèrè” túmọ̀ sí pé ó rí ohun ìní míì kún un láti inú iṣẹ́ rẹ̀, láìfi dandan hàn pé owó iṣẹ́ ni.
- source_word: ἄλλα δύο
  choice: méjì sí i
  rationale: Ó sọ ní Yorùbá òde òní pé méjì mìíràn irú ohun kan náà ni ó fi kún èyí tí ó ti ní.
