id: MAT.25.36
reference: Matthew 25:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: yo
  text: Mo wà ní ìhòòhò, ẹ sì fi aṣọ wọ̀ mí; mo ṣàìsàn, ẹ sì bẹ̀ mí wò[a]; mo wà ní ọgbà ẹ̀wọ̀n, ẹ sì wá sọ́dọ̀ mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ tọ́jú mi.” Ọ̀rọ̀ Giriki náà lè ní ìtumọ̀ lílọ bẹ ẹni wò pẹ̀lú àníyàn àti ìtọ́jú.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: ní ìhòòhò
  rationale: Ó túmọ̀ sí àìní aṣọ lára; ọ̀rọ̀ yìí bá ìṣe fífi aṣọ wọ ẹni mu, ó sì pa ìtumọ̀ gidi Giriki mọ́.
- source_word: περιεβάλετέ
  choice: fi aṣọ wọ̀ mí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n fi aṣọ bo ara ẹni tàbí wọ aṣọ fún un.
- source_word: ἠσθένησα
  choice: mo ṣàìsàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí àìlera lápapọ̀, àìsàn ni ìtumọ̀ tó ṣeé ṣe jù lọ nínú àyíká ìtọ́jú aláàánú yìí.
- source_word: ἐπεσκέψασθέ
  choice: ẹ sì bẹ̀ mí wò
  rationale: Ó pa ìṣe lílọ bẹ ẹni wò mọ́, nígbà tí àyíká náà ń fi àníyàn àti ìtọ́jú hàn; àlàyé kékeré wà nínú àlàyé ìsàlẹ̀.
- source_word: φυλακῇ
  choice: ọgbà ẹ̀wọ̀n
  rationale: Ọ̀rọ̀ Giriki náà tọ́ka sí ibi tí a ti fi ẹni sínú àhámọ́; ‘ọgbà ẹ̀wọ̀n’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
- source_word: ἤλθατε πρός με
  choice: ẹ sì wá sọ́dọ̀ mi
  rationale: Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Giriki ní tààrà, láìfi èrò míì kún un pé wọ́n wá bẹ̀ ẹ́ wò tàbí tọ́jú rẹ̀.
theological_decisions:
- issue: Bí a ṣe yẹ kí a tú àwọn ìṣe àánú náà sí ní ẹ̀kúnrẹ́rẹ́ tó
  choice: 'A pa àwọn ìṣe pàtó náà mọ́: fífi aṣọ wọ̀, bíbẹ̀ ẹni wò, àti wíwá sọ́dọ̀ rẹ̀.'
  alternative: Lílo ‘ẹ tọ́jú mi’ tàbí ‘ẹ wá bẹ̀ mí wò’ ní àwọn ibi tí Giriki kò ti sọ bẹ́ẹ̀ ní tààrà.
  rationale: Ọ̀rọ̀ Giriki rọrùn, ó sì tẹnumọ́ àwọn ìṣe àánú tó ṣeé fojú rí. Kí a má ṣe fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tàbí ti olùṣọ́-àgùntàn kún un, a pa ìyàtọ̀ tó wà láàárín ‘ẹ bẹ̀ mí wò’ àti ‘ẹ wá sọ́dọ̀ mi’ mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé lásán. ‘Ẹ’ pa ọ̀pọ̀ ènìyàn inú ẹyọ ọ̀rọ̀ Giriki mọ́.
