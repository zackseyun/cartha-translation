id: MAT.25.9
reference: Matthew 25:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọlọ́gbọ́n náà dáhùn pé, “Rárá, kí ó má bàa ṣe pé epo náà kò ní tó fún àwa àti ẹ̀yin. Ẹ kúkú lọ sọ́dọ̀ àwọn tí ń tà á, kí ẹ sì rà fún ara yín.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: dáhùn
  rationale: Ọ̀rọ̀ ìtàn tí ó wọ́pọ̀ fún fífèsì sí ohun tí a sọ; ó bá ìbánisọ̀rọ̀ náà mu lọ́nà àdánidá.
- source_word: αἱ φρόνιμοι
  choice: àwọn ọlọ́gbọ́n náà
  rationale: Ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ, ó sì tọ́ka sí àwọn ọ̀dọ́bìnrin ọlọ́gbọ́n tí a ti mẹ́nu kàn; “náà” ń mú ìtọ́kasí yẹn hàn láìfi orúkọ míì kún Gíríìkì.
- source_word: λέγουσαι
  choice: pé
  rationale: Lẹ́yìn “dáhùn,” àmì ọ̀rọ̀-àsọ “pé” jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ọ̀rọ̀ tààrà wọlé ju ṣíṣe àdàkọ “ní wí pé” lọ.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: Rárá, kí ó má bàa ṣe pé ... kò ní tó
  rationale: “Rárá” mú ìkọ̀sílẹ̀ tí ọ̀rọ̀ Gíríìkì fi hàn nínú àyíká yìí jáde; “kí ó má bàa ṣe pé ... kò ní tó” pa ìbẹ̀rù líle pé ohun náà lè ṣe aláìtó mọ́.
- source_word: ἀρκέσῃ
  choice: kò ní tó
  rationale: “Tó” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì yẹ fún ìpèsè epo tí ó lè má péye.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: fún àwa àti ẹ̀yin
  rationale: Ó pa ìtẹnumọ́ lórí ẹgbẹ́ méjèèjì mọ́, ó sì tú dátífù àǹfààní náà sí Yorùbá ní kedere.
- source_word: πορεύεσθε
  choice: Ẹ ... lọ
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; fífi “Ẹ” hàn ṣe kókó nínú Yorùbá.
- source_word: μᾶλλον
  choice: kúkú
  rationale: Nínú àyíká ìkọ̀sílẹ̀ àti àbá yìí, “kúkú” fi hàn pé kí wọ́n yan ìgbésẹ̀ yìí dípò ohun tí wọ́n béèrè.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: sọ́dọ̀ àwọn tí ń tà á
  rationale: Ó ṣe àfihàn participle onírúkọ náà ní Yorùbá àdánidá; arọ́pò-orúkọ “á” tọ́ka sí epo tí àyíká ti sọ di mímọ̀.
- source_word: ἀγοράσατε
  choice: kí ẹ sì rà
  rationale: “Rà” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún àṣẹ láti ra nǹkan; “kí ẹ” tẹ̀síwájú pẹ̀lú àṣẹ ọ̀pọ̀ ènìyàn.
- source_word: ἑαυταῖς
  choice: fún ara yín
  rationale: Ó pa dátífù afarahẹ́ mọ́, ó sì hàn pé kí wọ́n rà á fún ìlò tiwọn.
theological_decisions:
- issue: Bóyá a ó sọ ohun tí kò ní tó ní tààrà
  choice: Fi “epo náà” sínú gbólóhùn
  alternative: Fi olùṣe ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí Gíríìkì, kí a sọ pé “ó lè má tó”
  rationale: Àyíká ẹsẹ tó ṣáájú sọ epo ní kedere; fífi í hàn ń jẹ́ kí Yorùbá mọ́gbọ́n dání, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn tuntun kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àṣẹ ọ̀pọ̀ ènìyàn “Ẹ,” a sì yàgò fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
