id: MAT.25.6
reference: Matthew 25:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: yo
  text: Ṣùgbọ́n ní ọ̀gànjọ́ òru, igbe kan dún jáde[a] pé, “Wò ó,[b] ọkọ ìyàwó náà! Ẹ jáde lọ pàdé rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “igbe kan sì wáyé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kíyèsí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Ṣùgbọ́n ní ọ̀gànjọ́ òru
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Gíríìkì láti sọ àkókò, ó sì túmọ̀ sí ‘ní ọ̀gànjọ́ òru.’ ‘Ṣùgbọ́n’ fi ìyípadà ìtàn àti ìtakora díẹ̀ tí δέ lè ní hàn.
- source_word: κραυγὴ γέγονεν
  choice: igbe kan dún jáde
  rationale: Gbólóhùn náà ń sọ pé igbe kan ṣẹlẹ̀ lójijì. ‘Dún jáde’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi bí ìkéde náà ṣe dé lójijì hàn.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ἰδού jẹ́ ọ̀rọ̀ fífi pe àfiyèsí sí ohun kan. ‘Wò ó’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, tí kò sì ní ìró ọ̀rọ̀ àtijọ́.
- source_word: ὁ νυμφίος
  choice: ọkọ ìyàwó náà
  rationale: νυμφίος ń tọ́ka pàtó sí ọkùnrin tí ó ń fẹ́ ìyàwó nínú ayẹyẹ ìgbéyàwó; ‘ọkọ ìyàwó’ pa àwòrán ìgbéyàwó inú àkàwé náà mọ́.
- source_word: ἐξέρχεσθε
  choice: Ẹ jáde lọ
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì túmọ̀ sí kí wọ́n jáde. Fífi ‘lọ’ kún un bá ìlọ sí ibi ìpàdé mu ní Yorùbá.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: pàdé rẹ̀
  rationale: Gbólóhùn Gíríìkì yìí jẹ́ ọ̀nà àdánidá láti sọ pé kí ènìyàn lọ pàdé ẹlòmíràn; ‘pàdé rẹ̀’ mú ìtumọ̀ náà jáde ní ṣókí.
theological_decisions:
- issue: Ẹni tí νυμφίος dúró fún nínú àkàwé
  choice: ọkọ ìyàwó náà
  alternative: Ọkọ Ìyàwó náà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọkọ ìyàwó lè dúró fún Jésù nínú àyíká àkọsílẹ̀ Mátíù, ẹsẹ̀ yìí ń sọ̀rọ̀ ní ìpele àkàwé. A kò lo lẹ́tà ńlá gẹ́gẹ́ bí oyè, kí ìtumọ̀ má bàa fi àlàyé ẹ̀kọ́ ìgbàgbọ́ sínú ọ̀rọ̀ àkàwé fúnra rẹ̀.
translation_notes:
  register: Yorùbá àjùmọ̀lò tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ọ̀gànjọ́ òru,’ ‘igbe kan dún jáde,’ àti ‘ẹ jáde lọ pàdé rẹ̀’ jẹ́ gbólóhùn tí ó ṣe kedere fún òǹkàwé Yorùbá òde òní, tí ó sì pa ìrísí ìtàn àti àwòrán ìgbéyàwó mọ́.
