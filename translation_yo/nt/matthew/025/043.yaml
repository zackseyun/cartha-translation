id: MAT.25.43
reference: Matthew 25:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: yo
  text: Àlejò ni mí, ẹ kò sì gbà mí wọlé[a]; mo wà ní ìhòòhò, ẹ kò sì fi aṣọ wọ̀ mí; mo ṣàìsàn, mo sì wà nínú túbú, ẹ kò sì bẹ̀ mí wò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kò gbà mí sínú ilé yín” tàbí “ẹ kò ṣe àlejò sí mi.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní gangan sí “kó jọ,” ṣùgbọ́n níhìn-ín ó ń tọ́ka sí gbígba àlejò wọlé pẹ̀lú inú rere.
    reason: lexical_alternative
  - marker: b
    text: “Bẹ̀ mí wò” tún lè ní ìtumọ̀ “tọ́jú mi” tàbí “bojútó mi”; kì í ṣe lílọ kí ẹni lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: àlejò
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí kì í ṣe ara ilé tàbí àwùjọ ẹni, tí ó sì nílò àlejò ṣíṣe; “àlejò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi dandan túmọ̀ sí ọmọ orílẹ̀-èdè mìíràn.
- source_word: συνηγάγετέ
  choice: gbà mí sínú ilé yín
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ ni “kó jọ,” nínú àṣà gbígba àlejò ó túmọ̀ sí gbígba ẹni wọlé àti ṣíṣe àlejò sí i. Gbólóhùn yìí mú ìṣe náà ṣe kedere ní Yorùbá.
- source_word: γυμνός
  choice: ní ìhòòhò
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ìṣe fífi aṣọ wọ ẹni mu; ó tún lè ní ìtumọ̀ pé aṣọ ẹni kò tó.
- source_word: περιεβάλετέ
  choice: fi aṣọ wọ̀ mí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ fífi ohun yí ara ká, ìyẹn fífi aṣọ wọ ẹni, mu.
- source_word: ἀσθενής
  choice: ṣàìsàn
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè túmọ̀ sí aláìlera, àyíká àwọn iṣẹ́ àánú yìí ṣe atilẹyin fún àìsàn ara.
- source_word: ἐν φυλακῇ
  choice: nínú ẹ̀wọ̀n
  rationale: Níhìn-ín φυλακή ń tọ́ka sí ibi tí a fi ń há ènìyàn mọ́, kì í ṣe sí ibi ìṣọ́ nìkan.
- source_word: ἐπεσκέψασθέ
  choice: bẹ̀ mí wò
  rationale: “Bẹ̀ ẹni wò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún lílọ sí ọ̀dọ̀ ẹni, ṣùgbọ́n ọ̀rọ̀ Gíríìkì tún ní ìtumọ̀ àbójútó àti ìfẹ́ni; àlàyé ìsàlẹ̀ fi ìtumọ̀ yẹn hàn.
theological_decisions:
- issue: Ìtumọ̀ iṣẹ́ àánú nínú ἐπεσκέψασθέ με
  choice: bẹ̀ mí wò
  alternative: tọ́jú mi / bojútó mi
  rationale: “Bẹ̀ mí wò” pa ìṣe pàtó tí ọ̀rọ̀ Gíríìkì sọ mọ́ láì fi ìtumọ̀ ẹ̀kọ́ kan kún un; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé kì í ṣe ìbẹ̀wò lásán, ó ní àbójútó nínú.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú àwọn ọ̀rọ̀-ìṣe Gíríìkì tó jẹ́ ọ̀pọ̀. Àmì ohùn kún ibi tí ó bá yẹ.
