id: MAT.25.34
reference: Matthew 25:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: yo
  text: Nígbà náà, Ọba yóò sọ fún àwọn tí ó wà ní apá ọ̀tún rẹ̀ pé, “Ẹ wá, ẹ̀yin tí Baba mi ti bù kún[a]; ẹ jogún ìjọba tí a ti pèsè sílẹ̀ fún yín láti ìgbà ìpìlẹ̀ ayé.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, “ẹ̀yin tí a bù kún láti ọ̀dọ̀ Baba mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti ìgbà tí a ti fi ìpìlẹ̀ ayé lélẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn nínú àwòrán ìdájọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘nígbà náà’ ní Yorùbá.
- source_word: ὁ βασιλεὺς
  choice: Ọba
  rationale: Ọ̀rọ̀ náà tọ́ka sí Ọba pàtó nínú àyíká yìí; lílo lẹ́tà ńlá bá ipò rẹ̀ gẹ́gẹ́ bí akọ́lé mu.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: àwọn tí ó wà ní apá ọ̀tún rẹ̀
  rationale: Ó pa ìtumọ̀ ibi tí wọ́n dúró sí mọ́, ó sì yàgò fún fífi ‘ọwọ́’ kún ọ̀rọ̀ Gíríìkì níbi tí ‘apá ọ̀tún’ ti ṣe kedere.
- source_word: Δεῦτε
  choice: Ẹ wá
  rationale: Àṣẹ ìpè sí ọ̀pọ̀ ènìyàn ni; ‘Ẹ wá’ jẹ́ kúkúrú, ọ̀wọ̀, ó sì bá ọ̀rọ̀ ayẹyẹ náà mu.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: ẹ̀yin tí Baba mi ti bù kún
  rationale: Ó sọ participle perfect passive náà ní Yorùbá àdánidá, pẹ̀lú ‘ti’ láti fi hàn pé ìbùkún náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì dúró.
- source_word: κληρονομήσατε
  choice: ẹ jogún
  rationale: ‘Jogún’ pa èrò ogún ìdílé mọ́ ju ọ̀rọ̀ gbogbogbò bí ‘ẹ gbà’ lọ.
- source_word: τὴν ... βασιλείαν
  choice: ìjọba
  rationale: Nítorí pé a ń jogún rẹ̀, ‘ìjọba’ dára jù ‘ìṣàkóso’ lọ ní àyíká ìkẹyìn yìí, bí ó tilẹ̀ jẹ́ pé βασιλεία lè ní ìtumọ̀ méjèèjì.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: tí a ti pèsè sílẹ̀ fún yín
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìmúrasílẹ̀ náà ti parí, ohun tí a pèsè náà sì ṣì wà de àwọn tí a pèsè rẹ̀ fún.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: láti ìgbà ìpilẹ̀ṣẹ̀ ayé
  rationale: Ó pa àwòrán ìpilẹ̀ ayé mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìmúrasílẹ̀ náà bẹ̀rẹ̀ láti ìpilẹ̀ṣẹ̀ ayé.
theological_decisions:
- issue: Ẹni tí ìbùkún náà ti ọ̀dọ̀ rẹ̀ wá nínú τοῦ πατρός μου
  choice: 'A sọ ọ́ ní gbangba pé Baba ni ó bù kún wọn: ‘ẹ̀yin tí Baba mi ti bù kún.’'
  alternative: ‘ẹ̀yin olùbùkún ti Baba mi’ tàbí ‘ẹ̀yin ẹni ìbùkún Baba mi.’
  rationale: Genitive náà tọ́ka sí orísun tàbí olùṣe ìbùkún. Ọ̀nà tí a yàn ṣe kedere ní Yorùbá láìfi ẹ̀kọ́ mìíràn kún un.
- issue: Ìtumọ̀ βασιλεία níbi ogún ìgbà ìkẹyìn
  choice: ìjọba
  alternative: ìṣàkóso
  rationale: Ìsopọ̀ rẹ̀ pẹ̀lú ‘jogún’ àti ‘pèsè sílẹ̀ fún yín’ tọ́ka sí ilẹ̀ tàbí ipò ìjọba tí a lè jogún, ṣùgbọ́n kò sẹ́ gbogbo èrò ìṣàkóso Ọlọ́run kúrò.
- issue: Ohun tí ἀπὸ καταβολῆς κόσμου ń ṣàlàyé
  choice: A so ó mọ́ ‘tí a ti pèsè sílẹ̀ fún yín.’
  alternative: Kí a kà á sí àlàyé gbogbogbò fún gbogbo ìpè náà.
  rationale: Ìsopọ̀ rẹ̀ pẹ̀lú participle ἡτοιμασμένην ni ó sún mọ́ jù, ó sì jẹ́ ìtúmọ̀ gírámà tí ó rọrùn jù láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé ẹsẹ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ẹ’ àti ‘yín’ fi hàn pé ọ̀pọ̀ ènìyàn ni Ọba ń bá sọ̀rọ̀; ‘apá ọ̀tún’ jẹ́ ọ̀rọ̀ àdánidá fún ipò wọn.
