  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì náà dáadáa: ‘àwọn ọlọ́gbọ́n,’ ‘mú,’ ‘òróró,’ àti ‘pẹ̀lú àwọn fìtílà wọn’ bá φρόνιμοι, ἔλαβον, ἔλαιον, àti μετὰ τῶν λαμπάδων ἑαυτῶν mu. Ṣùgbọ́n ‘mú òróró sínú’ lè túmọ̀ sí pé wọ́n fi òróró sínú ohun èlò nígbà náà, níbi tí Gíríìkì ti sọ pé wọ́n mú òróró tí ó wà nínú àwọn ohun èlò wọn. ‘Àwọn ohun èlò’ náà tún fẹ̀rẹ̀ẹ́ gbòòrò ju ἀγγείοις lọ, tí ó ń tọ́ka sí àwọn ìkòkò tàbí ohun èlò ìkó nǹkan.'
