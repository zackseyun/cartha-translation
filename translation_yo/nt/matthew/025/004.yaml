base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọlọ́gbọ́n mú òróró nínú àwọn ìkòkò wọn, pẹ̀lú àwọn fìtílà wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ògùṣọ̀” dípò “fìtílà” (Gíríìkì: λαμπάδας); ọ̀rọ̀ náà lè túmọ̀ sí ògùṣọ̀ tàbí fìtílà, ó dá lórí àyíká ọ̀rọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: àwọn ọlọ́gbọ́n
  rationale: Ó tọ́ka sí àwọn tí ó ní ọgbọ́n ìṣe tàbí ìmòye; yíyan ‘àwọn ọlọ́gbọ́n’ dá ìyàtọ̀ rẹ̀ sí ‘àwọn òmùgọ̀’ nínú àyíká ẹsẹ náà dúró láì fi ìtumọ̀ ‘tí ó múra sílẹ̀’ kún un.
- source_word: ἔλαβον
  choice: mú
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ náà túmọ̀ sí pé wọ́n mú òróró náà dání tàbí lọ pẹ̀lú wọn, kì í ṣe pé wọ́n gbà á lọ́wọ́ ẹlòmíràn.
- source_word: ἔλαιον
  choice: òróró
  rationale: ‘Òróró’ jẹ́ ọ̀rọ̀ àpapọ̀ tí ó bá Gíríìkì mu; pípe e ní òróró ólífì yóò fi àlàyé tí ẹsẹ náà kò sọ kún un.
- source_word: ἀγγείοις
  choice: àwọn ohun èlò
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ orúkọ àpapọ̀ fún ohun tí a fi ń kó nǹkan; ‘àwọn ohun èlò’ kò fi ìrísí tàbí ohun tí a fi ṣe wọn kun ọrọ.
- source_word: λαμπάδων
  choice: àwọn fìtílà
  rationale: λαμπάς lè jẹ́ fìtílà tàbí ògùṣọ̀. ‘Fìtílà’ jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá, ó sì bá mímú òróró àfikún mu; àṣàyàn ‘ògùṣọ̀’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἑαυτῶν
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò olùṣe náà tẹnumọ́ pé tiwọn ni; Yorùbá ń sọ èyí lọ́nà àdánidá pẹ̀lú ‘wọn’ láì nílò àfikún.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: pẹ̀lú àwọn fìtílà wọn
  rationale: 'μετά pẹ̀lú genitive fi ìbákẹ́gbẹ́ hàn: wọ́n mú òróró náà gẹ́gẹ́ bí ohun tí ó wà pẹ̀lú àwọn fìtílà wọn.'
