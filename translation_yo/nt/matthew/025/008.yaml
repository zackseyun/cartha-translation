id: MAT.25.8
reference: Matthew 25:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: yo
  text: Ṣùgbọ́n àwọn òmùgọ̀ sọ fún àwọn ọlọ́gbọ́n pé, “Ẹ fún wa ní díẹ̀ lára òróró yín, nítorí àwọn fìtílà[a] wa ń kú lọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ògùṣọ̀” dípò “fìtílà” (Gíríìkì: λαμπάδες); ọ̀rọ̀ náà lè tọ́ka sí ohun ìmọ́lẹ̀ tí a ń gbé lọ́wọ́, àwọn atúmọ̀ sì lè yàn ọ̀kan tàbí èkejì gẹ́gẹ́ bí wọ́n ṣe lóye ìṣẹ̀lẹ̀ náà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: àwọn òmùgọ̀
  rationale: Ọ̀rọ̀ ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ fún ẹgbẹ́ àwọn wúńdíá tí kò ní ọgbọ́n ìmúrasílẹ̀; ó sì dá ìyàtọ̀ rẹ̀ sí φρονίμοις dúró.
- source_word: φρονίμοις
  choice: àwọn ọlọ́gbọ́n
  rationale: Ó tọ́ka sí àwọn tí wọ́n ní ọgbọ́n ìṣe àti ìmúrasílẹ̀; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìyàtọ̀ inú àkàwé mu.
- source_word: Δότε
  choice: Ẹ fún wa
  rationale: Àṣẹ tàbí ìbéèrè tààrà sí ọ̀pọ̀ ènìyàn ni; àmì ọ̀wọ̀ ‘Ẹ’ tún jẹ́ ọ̀nà àdánidá láti bá ẹgbẹ́ kan sọ̀rọ̀ ní Yorùbá.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: ní díẹ̀ lára òróró yín
  rationale: ἐκ pẹ̀lú ọ̀rọ̀ inú genitive ní ìtumọ̀ apá kan láti inú ohun tí wọ́n ní; ‘díẹ̀ lára’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: λαμπάδες
  choice: fìtílà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fìtílà tàbí ògùṣọ̀; ‘fìtílà’ bá àyíká òróró mu, ó sì yé òǹkàwé Yorùbá lójú ẹsẹ̀.
- source_word: σβέννυνται
  choice: ń kú lọ
  rationale: Fífi iná tí ń rọra kú hàn ni ọ̀rọ̀ ìsinsìnyí náà ń ṣe; ‘ń kú lọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iná tí ó ń lọ sí pípa.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí ìbéèrè náà hàn ní kedere, gẹ́gẹ́ bí asopọ̀ onídí.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lásán; a pa àṣẹ tààrà àti ìṣe tí ó ń lọ lọ́wọ́ mọ́.
