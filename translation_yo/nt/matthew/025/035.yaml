id: MAT.25.35
reference: Matthew 25:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: yo
  text: Nítorí ebi pa mí, ẹ sì fún mi ní oúnjẹ; òùngbẹ gbẹ mí, ẹ sì fún mi ní ohun mímu; mo jẹ́ àjèjì, ẹ sì gbà mí sílé[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ tẹ́wọ́ gbà mí.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtó sí “kó jọ” tàbí “mú wá sí àpapọ̀,” ṣùgbọ́n níbí ó ń tọ́ka sí fífi inú rere gba àjèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: ebi pa mí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan wà nínú ipò ebi, ó sì bá ìṣe àṣálẹ̀ Gíríìkì mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí a sọ ṣáájú.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: ẹ sì fún mi ní oúnjẹ
  rationale: Ó mú ìtumọ̀ pé wọ́n fún un ní ohun tí yóò jẹ jáde ní Yorùbá tó rọrùn, láìfi ohun mìíràn kún un.
- source_word: ἐδίψησα
  choice: òùngbẹ gbẹ mí
  rationale: Ọ̀rọ̀ Yorùbá àdánidá ni fún jíjẹ́ ẹni tí òùngbẹ ń gbẹ.
- source_word: ἐποτίσατέ με
  choice: ẹ sì fún mi ní ohun mímu
  rationale: Ó pa ìtumọ̀ pípèsè ohun tí yóò mu mọ́, láìdín un kù sí omi nìkan.
- source_word: ξένος
  choice: àjèjì
  rationale: Àjèjì ń tọ́ka sí ẹni tí kò mọ̀ọ́mọ̀ jẹ́ ara ilé tàbí àwùjọ náà; kò sì fi dandan túmọ̀ sí ọmọ orílẹ̀-èdè mìíràn.
- source_word: συνηγάγετέ με
  choice: ẹ sì gbà mí sílé
  rationale: Nínú àyíká ξένος, ọ̀rọ̀ náà ń sọ nípa fífi inú rere gba àjèjì, pàápàá nípa fífún un ní ààyè láti wọlé tàbí dúró; ọ̀rọ̀ Yorùbá yìí mú ìtumọ̀ àlejò-ṣíṣe náà jáde.
theological_decisions:
- issue: Ìtumọ̀ ìṣe àlejò-ṣíṣe nínú ξένος ... συνηγάγετέ με
  choice: mo jẹ́ àjèjì, ẹ sì gbà mí sílé
  alternative: mo jẹ́ àjèjì, ẹ sì tẹ́wọ́ gbà mí
  rationale: Yíyan “gbà mí sílé” pa àánú àti ìtẹ́wọ́gbà ẹni tí kò ní ibi ìfarabalẹ̀ mọ́, láìfi ẹ̀yà, ipò òfin, tàbí ẹ̀kọ́ ìjọ kan sínú ọ̀rọ̀ náà. Àmọ́, nítorí συνάγω kò sọ “ilé” ní tààràtà, àlàyé ìsàlẹ̀ fi àṣàyàn tó gbòòrò sí i hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí àwọn ọ̀rọ̀-ìṣe Gíríìkì ṣe wà ní ọ̀pọ̀. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba.
