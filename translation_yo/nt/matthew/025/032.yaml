id: MAT.25.32
reference: Matthew 25:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: yo
  text: A ó sì kó gbogbo àwọn orílẹ̀-èdè jọ síwájú rẹ̀[a], yóò sì ya wọn sọ́tọ̀ kúrò lára ara wọn, gẹ́gẹ́ bí olùṣọ́-àgùntàn ti ń ya àwọn àgùntàn sọ́tọ̀ kúrò lára àwọn ewúrẹ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn ẹ̀yà ènìyàn”; ní Gíríìkì, “gbogbo àwọn orílẹ̀-èdè” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἐρίφων lè túmọ̀ sí “àwọn ọmọ ewúrẹ́” ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: A ó sì kó ... jọ
  rationale: Ìṣẹ̀dá aláìlórúkọ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìtumọ̀ ọ̀rọ̀ ìṣe aláìṣeṣe Gíríìkì mọ́, láìfi ẹni tó ń kó wọn jọ kún ọ̀rọ̀ náà.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: síwájú rẹ̀
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá àwòrán ìdájọ́ níwájú rẹ̀ mu.
- source_word: πάντα τὰ ἔθνη
  choice: gbogbo àwọn orílẹ̀-èdè
  rationale: Èyí pa ìtumọ̀ gbooro ti ἔθνη gẹ́gẹ́ bí ‘àwọn orílẹ̀-èdè’ mọ́, láìdín in kù sí àwọn Kèfèrí nìkan.
- source_word: ἀφορίσει
  choice: yóò sì ya wọn sọ́tọ̀
  rationale: ‘Ya ... sọ́tọ̀’ sọ ìpín ẹgbẹ́ kan kúrò lára òmíràn ní kedere àti ní Yorùbá àdánidá.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: wọn ... kúrò lára ara wọn
  rationale: Gbólóhùn náà pa èrò ìyapa láàárín àwọn tí a kó jọ mọ́.
- source_word: ὥσπερ
  choice: gẹ́gẹ́ bí
  rationale: Ó ṣe àmì àfiwé náà ní kedere.
- source_word: ὁ ποιμὴν
  choice: olùṣọ́-àgùntàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún shepherd.
- source_word: τὰ πρόβατα
  choice: àwọn àgùntàn
  rationale: Ó pa àwòrán ẹranko pàtó náà mọ́ dípò lílo ọ̀rọ̀ àpapọ̀ fún agbo.
- source_word: τῶν ἐρίφων
  choice: àwọn ewúrẹ́
  rationale: ‘Àwọn ewúrẹ́’ jẹ́ ìyàtọ̀ tó ṣe kedere sí ‘àwọn àgùntàn’; àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì lè tọ́ka sí ọmọ ewúrẹ́ ní pàtó.
theological_decisions:
- issue: Ìwọ̀n àwọn tí πάντα τὰ ἔθνη kàn
  choice: gbogbo àwọn orílẹ̀-èdè
  alternative: gbogbo àwọn ẹ̀yà ènìyàn; gbogbo àwọn Kèfèrí
  rationale: A fi gbòòrò ọ̀rọ̀ Gíríìkì sílẹ̀ láìfi ìlànà ẹ̀kọ́ ìsìn kan lé e lórí tàbí dín àwọn tí ìdájọ́ náà kàn kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìṣẹ̀dá aláìṣeṣe àti àfiwé olùṣọ́-àgùntàn mọ́ láìfikún olùṣe tàbí ìtumọ̀ ẹ̀kọ́ ìsìn.
