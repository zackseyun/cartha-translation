  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: yo
  text: Nítorí náà, ẹ máa ṣọ́nà[a], nítorí ẹ kò mọ ọjọ́ náà tàbí wákàtí náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa wà lójúfò” tàbí “ẹ máa ṣọ́ra.” Ọ̀rọ̀ àṣẹ náà ní èdè Gíríìkì ń tọ́ka sí ìṣọ́nà tí ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ẹ máa ṣọ́nà
  rationale: Ọ̀rọ̀ àṣẹ ìsinsìnyí ní ọ̀pọ̀ ènìyàn ń béèrè ìṣọ́ra tí ó ń bá a lọ. “Ẹ máa ṣọ́nà” jẹ́ Yorùbá àdánidá, ó sì pa àwòrán jíjí àti ìmúrasílẹ̀ nínú òwe náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tàbí àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ hàn.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún àṣẹ náà ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: οὐκ οἴδατε
  choice: ẹ kò mọ
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣe tí a sẹ́ ní ẹni kejì ọ̀pọ̀ láìfikún ìtumọ̀ tí kò sí nínú Gíríìkì.
- source_word: τὴν ἡμέραν
  choice: ọjọ́ náà
  rationale: A pa atọ́ka pàtó inú Gíríìkì mọ́, láìṣàlàyé ọjọ́ náà ju bí ẹsẹ̀ náà ti sọ lọ.
- source_word: οὐδὲ τὴν ὥραν
  choice: tàbí wákàtí náà
  rationale: “Tàbí” bá ọ̀rọ̀ tí a sẹ́ ṣáájú mu ní Yorùbá àdánidá; a sì pa atọ́ka pàtó fún “wákàtí” mọ́.
theological_decisions:
- issue: Àwòrán ìṣọ́ra inú ọ̀rọ̀ àṣẹ
  choice: ẹ máa ṣọ́nà
  alternative: ẹ máa wà lójúfò; ẹ máa jí
  rationale: Yíyan yìí ń sọ ìmúrasílẹ̀ tí ó ń bá a lọ, ó sì pa àwòrán inú òwe mọ́ láìfi ètò ẹ̀kọ́ nípa ìgbà ìkẹyìn kan pàtó kún un.
- issue: Ohun tí “ọjọ́ náà tàbí wákàtí náà” ń tọ́ka sí
  choice: A fi gbólóhùn náà sílẹ̀ láìfikún àlàyé
  alternative: ọjọ́ tàbí wákàtí ìpadàbọ̀ Ọmọ Ènìyàn; àkókò tí a yàn
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìmúrasílẹ̀ fún dídé àti ìdájọ́, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò sọ ohun náà ní kedere; nítorí náà, a pa àìsọ pàtó yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ẹni kejì ọ̀pọ̀, ní ìbámu pẹ̀lú Gíríìkì.
