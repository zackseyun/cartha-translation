id: MAT.25.30
reference: Matthew 25:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: yo
  text: Ẹ sì sọ ẹrú[a] aláìwúlò náà sínú òkùnkùn òde; ní ibẹ̀ ni ẹkún àti ìpayínkeke eyín yóò wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà, doulos, lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́”; “ẹrú” ni a lò níbí nítorí ipò ẹni tí ó wà lábẹ́ ìdè ọ̀gá rẹ̀ ṣe pàtàkì nínú àkàwé náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: aláìwúlò
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni tí kò wúlò tàbí tí kò mú èrè wá ní ojú ọ̀gá rẹ̀. “Aláìwúlò” jẹ́ Yorùbá àdánidá, ó sì pa líle ìdájọ́ náà mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: δοῦλον
  choice: ẹrú
  rationale: Nínú àkàwé yìí, ìbáṣepọ̀ ọ̀gá àti ẹni tí ó jẹ́ ohun-ìní rẹ̀ hàn gbangba; nítorí náà, “ẹrú” fi ipò ìdè náà hàn ju “ìránṣẹ́” lọ. Àkọlé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ kejì hàn.
- source_word: ἐκβάλετε
  choice: Ẹ sì sọ ... sínú
  rationale: Àṣẹ náà le, ó sì ń sọ nípa yíyọ ẹni náà kúrò ní agbára. “Sọ ... sínú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìgbésẹ̀ líle náà mọ́.
- source_word: σκότος τὸ ἐξώτερον
  choice: òkùnkùn òde
  rationale: Gbólóhùn yìí ń tọ́ka sí òkùnkùn tí ó wà níta, níbi ìyàsọ́tọ̀ kúrò níbi ayọ̀ tàbí ìbùkún. “Òkùnkùn òde” jẹ́ kúkúrú, àdánidá, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐκεῖ
  choice: Ní ibẹ̀
  rationale: Ó ń tọ́ka padà ní kedere sí òkùnkùn òde tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: κλαυθμὸς
  choice: ẹkún
  rationale: “Ẹkún” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìsọkún tí ìbànújẹ́ ń fà, láìsọ pé ó pọ̀ ju bí orísun ṣe sọ lọ.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ìpayínkeke
  rationale: “Ìpayínkeke” jẹ́ ọ̀nà Yorùbá àdánidá fún yíyín pa pọ̀ tàbí fífọ́ wọn mọ́ra; ó pa àwòrán ìrora àti/tàbí ìbínú tí gbólóhùn Gíríìkì lè ní mọ́.
theological_decisions:
- issue: Irú ìdájọ́ tí àwòrán inú àkàwé náà ń tọ́ka sí
  choice: Pa àwòrán yíyọ ẹni náà sí òkùnkùn òde, ẹkún, àti ìpayínkeke mọ́ láìsọ ohun tí ó kọjá ọ̀rọ̀ náà.
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ọ̀run àpáàdì, tàbí gẹ́gẹ́ bí ìjìyà ìgbà díẹ̀ tàbí ìyàsọ́tọ̀ àpẹẹrẹ nìkan.
  rationale: Ẹsẹ̀ náà lo èdè ìdájọ́ tí ó wọ́pọ̀ nínú Mátíù, ṣùgbọ́n kò ṣàlàyé níbí bóyá gbogbo àwòrán náà ń tọ́ka ní tààrà sí ìdájọ́ ìkẹyìn, ọ̀run àpáàdì, tàbí ohun míì. Ìtumọ̀ náà kò yẹ kí ó pinnu ohun tí ọ̀rọ̀ fúnra rẹ̀ kò pinnu.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún ọ̀pọ̀ ènìyàn. Àmì ohùn kún ibi tí ó yẹ. Gbólóhùn náà pa agbára àṣẹ àti àwòrán ìdájọ́ orísun mọ́, láìlo èdè àtijọ́ tàbí àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ̀ náà.
