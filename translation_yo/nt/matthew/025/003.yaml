source:
  edition: SBLGNT
  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: yo
  text: Nítorí àwọn òmùgọ̀ náà, nígbà tí wọ́n mú àwọn fìtílà[a] wọn, kò mú òróró pẹ̀lú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ògùṣọ̀” dípò “fìtílà”; ọ̀rọ̀ Gíríìkì λαμπάδας lè tọ́ka sí èyíkéyìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ń fi àlàyé fún gbólóhùn tó ṣáájú hàn, ó sì pa ipa àsopọ̀ ọ̀rọ̀ Gíríìkì mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: μωραὶ
  choice: àwọn òmùgọ̀ náà
  rationale: Àjẹtífù abo ọ̀pọ̀ yìí ń tọ́ka padà sí àwọn wúńdíá inú àkàwé náà. Yorùbá kò fi akọ tàbí abo hàn nínú ọ̀rọ̀ yìí, “àwọn òmùgọ̀ náà” sì jẹ́ kedere láì tún “àwọn wúńdíá” sọ.
- source_word: λαβοῦσαι
  choice: nígbà tí … mú
  rationale: Aorist participle náà tọ́ka sí ohun tí wọ́n ṣe ní ìbẹ̀rẹ̀, ṣáájú tàbí ní ìbámu pẹ̀lú ìṣe pàtàkì; gbólóhùn àsìkò yìí jẹ́ ti Yorùbá àdánidá.
- source_word: λαμπάδας
  choice: àwọn fìtílà
  rationale: “Fìtílà” bá ọ̀rọ̀ òróró inú àyíká yìí mu, ó sì jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá mọ̀ dáadáa. “Ògùṣọ̀” tún ṣeé ṣe, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
- source_word: οὐκ ἔλαβον
  choice: wọn kò mú
  rationale: 'Èyí pa ìṣọ̀kan ọ̀rọ̀-ìṣe λαβοῦσαι/ἔλαβον mọ́: “mú … kò mú.”'
- source_word: μεθ’ ἑαυτῶν
  choice: dání
  rationale: “Mú … dání” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n mú ohun náà pẹ̀lú ara wọn.
- source_word: ἔλαιον
  choice: òróró
  rationale: Èyí ni ìtumọ̀ tààrà fún òróró tí a ń lò fún fìtílà nínú àyíká yìí.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àṣàdéédé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtúmọ̀ náà jẹ́ ọlọ́lá, ó rọrùn láti lóye, ó sì pa ìtẹ̀lé ọ̀rọ̀ “mú … kò mú” inú Gíríìkì mọ́.
