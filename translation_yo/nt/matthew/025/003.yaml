  source_fidelity: 'Ìtumọ̀ náà ń mú ìtumọ̀ gbólóhùn Gíríìkì náà dáadáa ní gbogbogbò: γὰρ jẹ́ àsopọ̀ àlàyé, μωραὶ ń tọ́ka sí ẹgbẹ́ àwọn wúńdíá tí a ti mẹ́nuba, ìṣe ‘mú’ sì pa ìfararora λαβοῦσαι/ἔλαβον mọ́. Ṣùgbọ́n ‘dání’ kò fi μεθ’ ἑαυτῶν (‘pẹ̀lú wọn’) hàn ní kedere tó; a nílò ọ̀rọ̀ tó sọ ìbáṣepọ̀ náà ní tààrà.'
  naturalness: ‘Nítorí nígbà tí’ jẹ́ ìbẹ̀rẹ̀ gbolohun tí ó ṣeé gbà, ṣùgbọ́n ‘Nígbà tí ...’ lẹ́yìn ‘Nítorí’ lè dun díẹ̀ ní pípa. Àtúnṣe náà ń jẹ́ kí àsopọ̀ náà rọrùn sí i, ó sì lo ‘pẹ̀lú wọn,’ èyí tí ó jẹ́ Yorùbá àṣàdéédé tó yege.
  terminology: ‘Àwọn òmùgọ̀ náà,’ ‘fìtílà,’ àti ‘òróró’ yẹ sí àyíká àkàwé náà. Àlàyé ìsàlẹ̀ nípa ‘ògùṣọ̀’ jẹ́ yíyan ọ̀rọ̀ tó yẹ, nítorí λαμπάς lè ní ìtumọ̀ yẹn.
  issues:
