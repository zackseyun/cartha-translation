id: MAT.25.16
reference: Matthew 25:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: yo
  text: Ẹni tí ó gba tálẹ́ǹtì márùn-ún náà lọ, ó fi wọ́n ṣiṣẹ́[b][a], ó sì jèrè márùn-ún mìíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó lọ kúrò, ó sì fi wọ́n ṣiṣẹ́”; Gíríìkì náà ṣàpèjúwe lílo owó náà ní ṣíṣe láti rí èrè.
    reason: lexical_alternative
  - marker: b
    text: Tálẹ́ǹtì jẹ́ ìwọ̀n owó ńlá ní ìgbàanì; níhìn-ín, kì í ṣe ẹ̀bùn tàbí agbára àbínibí.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: lọ
  rationale: Ọ̀rọ̀ àpapọ̀ yìí fi hàn pé ó lọ láti ṣe ohun tí a sọ lẹ́yìn náà. ‘Lọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtẹ̀síwájú ìṣe náà mọ́, láìfi ‘lẹ́sẹ̀kẹsẹ̀’ kún un, nítorí kò sí ọ̀rọ̀ bẹ́ẹ̀ ní Gíríìkì.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Ẹni tí ó gba tálẹ́ńtì márùn-ún náà
  rationale: 'Èyí pa ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ náà mọ́: a dá ìránṣẹ́ náà mọ̀ nípa ohun tí ó gbà, láìfi ‘ọkùnrin’ kún un láìjẹ́ dandan.'
- source_word: τάλαντα
  choice: tálẹ́ńtì
  rationale: A pa orúkọ ìwọ̀n owó ìgbàanì náà mọ́; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé owó púpọ̀ ni, kì í ṣe ẹ̀bùn tàbí agbára àbínibí.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: ó fi wọ́n ṣiṣẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ó lo owó náà ní ṣíṣe láti mú èrè wá. ‘Fi wọ́n ṣiṣẹ́’ jẹ́ Yorùbá àdánidá, ó sì yẹra fún fífi irú ọ̀nà òwò kan pàtó sínú ẹsẹ̀ náà.
- source_word: ἐκέρδησεν
  choice: ó jèrè
  rationale: '‘Jèrè’ sọ ìtumọ̀ κερδαίνω ní àyíká òwò yìí ní kedere: ó rí èrè tàbí àfikún.'
- source_word: ἄλλα πέντε
  choice: márùn-ún mìíràn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ iye márùn-ún àfikún.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, èdè ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ‘tálẹ́ńtì’ jẹ́ àkọsílẹ̀ ọ̀rọ̀ ìgbàanì tí àlàyé ṣètìlẹ́yìn fún.
