id: MAT.25.46
reference: Matthew 25:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: yo
  text: Àwọn wọ̀nyí yóò sì lọ sínú ìjìyà ayérayé[a], ṣùgbọ́n àwọn olódodo yóò lọ sínú ìyè ayérayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ìjìyà tí ó wà fún sáà kan’ … ‘ìyè tí ó wà fún sáà kan.’ Àwọn kan ń jiyàn lórí ìtumọ̀ àjẹtífù αἰώνιος ní àwọn àyíká kan; ṣùgbọ́n níhìn-ín, ọ̀rọ̀ kan náà ni ó ṣàpèjúwe ‘ìjìyà’ àti ‘ìyè,’ nítorí náà a lo ‘ayérayé’ ní àwọn gbólóhùn méjèèjì láti pa ìbáramu náà mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: yóò lọ
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú yìí túmọ̀ sí pé wọn yóò kúrò níbẹ̀ lọ; ‘yóò lọ’ jẹ́ èdè Yorùbá àdánidá, ó sì bá ‘sínú’ tí ó tẹ̀ lé e mu.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka sí ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa rẹ̀, ó sì pa ìyàtọ̀ wọn sí ‘àwọn olódodo’ mọ́.
- source_word: κόλασιν
  choice: ìjìyà
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, κόλασις ń tọ́ka sí ẹ̀san ìdájọ́ tàbí ìyà, kì í ṣe ìtọ́nisọ́nà àtúnṣe lásán.
- source_word: αἰώνιον
  choice: ayérayé
  rationale: Ọ̀rọ̀ kan náà ni ó ṣàpèjúwe ‘ìjìyà’ àti ‘ìyè’; ‘ayérayé’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìbáramu àwọn gbólóhùn méjèèjì mọ́.
- source_word: δίκαιοι
  choice: àwọn olódodo
  rationale: Àjẹtífù tí a lò bí orúkọ yìí ń tọ́ka sí àwọn tí ó jẹ́ olódodo tàbí tí a kà sí olódodo; ‘àwọn olódodo’ jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ζωὴν
  choice: ìyè
  rationale: ‘Ìyè’ ni ìtumọ̀ Yorùbá tó bá ζωή mu ní kíkún nínú àyíká ọ̀rọ̀ yìí.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àwọn ẹgbẹ́ méjèèjì àti ohun tí yóò ṣẹlẹ̀ sí wọn.
theological_decisions:
- issue: Ìtumọ̀ αἰώνιον nínú κόλασιν αἰώνιον àti ζωὴν αἰώνιον
  choice: Túmọ̀ αἰώνιον sí ‘ayérayé’ ní àwọn gbólóhùn méjèèjì.
  alternative: ‘tí ó wà fún sáà kan’ tàbí ‘tí ó jẹ́ ti ayé kan’
  rationale: Nítorí pé àjẹtífù Gíríìkì kan náà ni a lò fún ìjìyà àti ìyè, ìtumọ̀ náà gbọ́dọ̀ pa ìbáramu yẹn mọ́ láì fi iye àkókò tàbí irú wọn yàtọ̀ síra. Àlàyé ìsàlẹ̀ jẹ́wọ́ pé ìtumọ̀ ọ̀rọ̀ náà lè jẹ́ kókó àríyànjiyàn ní àwọn àyíká kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìṣọ̀kan àti ìyàtọ̀ inú gbólóhùn Gíríìkì mọ́.
