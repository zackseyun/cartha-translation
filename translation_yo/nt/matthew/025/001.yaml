id: MAT.25.1
reference: Matthew 25:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: yo
  text: Nígbà náà, ìjọba ọ̀run yóò dà bí àwọn wúńdíá mẹ́wàá[a], tí wọ́n mú àwọn fìtílà wọn[b], tí wọ́n sì jáde lọ pàdé ọkọ ìyàwó náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààràtà, a lè tú ọ̀rọ̀-ìṣe Gíríìkì náà sí: “a ó fi ìjọba ọ̀run wé àwọn wúńdíá mẹ́wàá,” tàbí “a ó mú ìjọba ọ̀run dà bí àwọn wúńdíá mẹ́wàá.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ògùṣọ̀ wọn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fìtílà tàbí ògùṣọ̀ tí a ń mú lọ́wọ́ nínú ìrìn-àjò ayẹyẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àsìkò tó so òwe yìí mọ́ ọ̀rọ̀ tó ṣáájú; gbólóhùn yìí sì jẹ́ Yorùbá àdánidá.
- source_word: ὁμοιωθήσεται
  choice: yóò dà bí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ìṣe àfarajìn ọjọ́ iwájú, ọ̀nà yìí ni Yorùbá àdánidá láti sọ àfiwé náà. Àlàyé ìsàlẹ̀ ojú ìwé pa ìrísí àfarajìn Gíríìkì mọ́.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni gbólóhùn Mátíù tó wọ́pọ̀, ó sì ṣe kedere ní Yorùbá láìsọ ọ̀run di ọ̀pọ̀.
- source_word: δέκα παρθένοις
  choice: àwọn wúńdíá mẹ́wàá
  rationale: “Wúńdíá” pa ìtumọ̀ παρθένος gẹ́gẹ́ bí obìnrin tí kò tíì ní ìbálòpọ̀ mọ́, ó sì bá àyíká ayẹyẹ ìgbéyàwó mu.
- source_word: λαβοῦσαι
  choice: tí wọ́n mú
  rationale: A tú participle aorist náà sí gbólóhùn alátẹ̀lé tó bá Yorùbá mu, láìsọ ìtẹ̀lé ìṣẹ̀lẹ̀ nù.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: àwọn fìtílà wọn
  rationale: “Fìtílà” jẹ́ ohun ìmọ́lẹ̀ tí a lè mú lọ́wọ́, ó sì bá àṣà ìtúmọ̀ òwe yìí mu; “ògùṣọ̀” jẹ́ àṣàyàn tó ṣeé ṣe, a sì fi sínú àlàyé.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: wọ́n sì jáde lọ pàdé
  rationale: Ó sọ ìjáde àti ète ìpàdé náà ní Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: τοῦ νυμφίου
  choice: ọkọ ìyàwó náà
  rationale: Èyí ń tọ́ka ní pàtó sí ọkùnrin tó ń ṣe ìgbéyàwó, ó sì pa àwòrán ayẹyẹ ìgbéyàwó mọ́.
theological_decisions:
- issue: Ìlànà àfiwé òwe náà
  choice: ìjọba ọ̀run yóò dà bí àwọn wúńdíá mẹ́wàá
  alternative: a ó fi ìjọba ọ̀run wé àwọn wúńdíá mẹ́wàá
  rationale: Àkọ́kọ́ jẹ́ Yorùbá tó rọrùn, ṣùgbọ́n a kò fi àlàyé ọ̀rọ̀-ìṣe àfarajìn Gíríìkì pamọ́; a tọ́ka sí i nínú àlàyé [a].
- issue: Ìtumọ̀ παρθένοις
  choice: àwọn wúńdíá
  alternative: àwọn ọmọbìnrin tí kò tíì lọ́kọ
  rationale: “Àwọn wúńdíá” pa agbára ìtumọ̀ ọ̀rọ̀ orísun mọ́, láìfẹ̀ ẹ́ sí ìpo ìgbéyàwó nìkan.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ìtòlẹ́sẹẹsẹ gbólóhùn àdánidá, nígbà tí àwọn àlàyé ń pa àwọn ìyàtọ̀ pàtàkì inú Gíríìkì mọ́.
