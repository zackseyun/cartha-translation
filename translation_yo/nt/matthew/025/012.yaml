id: MAT.25.12
reference: Matthew 25:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: yo
  text: Ṣùgbọ́n ó dá wọn lóhùn pé, “Lóòótọ́ ni mo sọ fún yín, èmi kò mọ̀ yín.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Èmi kò dá yín mọ̀.” Ní ti gidi, Gíríìkì náà ní, “Èmi kò mọ̀ yín,” èyí tó lè túmọ̀ sí pé kò jẹ́wọ́ ìbáṣepọ̀ wọn nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ṣùgbọ́n ó dá wọn lóhùn pé
  rationale: Ọ̀rọ̀ yìí tú àgbékalẹ̀ ìtàn Gíríìkì náà sí Yorùbá àdánidá láìṣe àtúnwí ‘ó dáhùn, ó sì wí’; ‘Ṣùgbọ́n’ fi ìtakora sí ẹ̀bẹ̀ tó ṣáájú hàn.
- source_word: Ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Nínú gbólóhùn pàtó tí Jésù máa ń lò, èyí sọ ìmúdájú ọ̀rọ̀ náà ní Yorùbá tí ó ṣe kedere, dípò fífi ‘Àmín’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àjèjì.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ọ̀rọ̀ tààrà àti ọ̀wọ̀ tó pọ̀ hàn; ‘yín’ tún pa ọ̀pọ̀ ènìyàn tí ὑμῖν ń tọ́ka sí mọ́.
- source_word: οὐκ οἶδα
  choice: èmi kò mọ̀
  rationale: ‘Mọ̀’ ni ìtumọ̀ taara οἶδα, ó sì pa ìṣiyèméjì tó wà láàárín àìmọ̀ àti àìjẹ́wọ́ ìbáṣepọ̀ mọ́. Fífi ‘èmi’ sí i mú ìtẹnumọ́ ọ̀rọ̀ ìdájọ́ náà hàn ní Yorùbá.
- source_word: ὑμᾶς
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ olùgbà ọ̀pọ̀ ni, ó ń tọ́ka sí gbogbo ẹgbẹ́ tí a ń bá sọ̀rọ̀ nínú òwe náà.
theological_decisions:
- issue: Agbára ìtumọ̀ ‘èmi kò mọ̀ yín’ nínú òwe náà
  choice: 'Pa ọ̀rọ̀ tó rọrùn ṣùgbọ́n tó ní ìwọ̀n ìbáṣepọ̀ mọ́: ‘èmi kò mọ̀ yín.’'
  alternative: ‘Èmi kò dá yín mọ̀’ tàbí ‘Èmi kò ní ìbáṣepọ̀ kankan pẹ̀lú yín.’
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìkọ̀sílẹ̀ àti àìjẹ́wọ́ wọn nínú àyíká yìí, ṣùgbọ́n ẹsẹ náà kò ṣàlàyé gbogbo àbájáde ẹ̀kọ́ ìgbàlà. Ìtumọ̀ taara yìí kò fi ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní ọlá, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé lasán, ó sì pa ìtẹnumọ́ àti ìṣiyèméjì ọ̀rọ̀ orísun mọ́.
