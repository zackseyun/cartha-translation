  source_fidelity: Ìtumọ̀ náà fi ὁ δὲ ἀποκριθεὶς εἶπεν hàn ní ọ̀nà Yorùbá àdánidá, ó sì pa ìtakora δέ mọ́. “Lóòótọ́ ni mo sọ fún yín” bá Ἀμὴν λέγω ὑμῖν mu dáadáa. “Èmi kò mọ̀ yín” jẹ́ ìtumọ̀ tààrà fún οὐκ οἶδα ὑμᾶς, tí kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un. “Wọn” nínú “ó dá wọn lóhùn” jẹ́ ìtọ́kasí tó hàn nínú àyíká, kò sì yí ìtumọ̀ ẹsẹ̀ náà padà.
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa, kedere, tí ó ní ọlá, ó sì ní àmì ohùn tó yẹ. “Dá wọn lóhùn pé” àti “Lóòótọ́ ni mo sọ fún yín” jẹ́ ìlò àdánidá fún ìtàn àti ọ̀rọ̀ pàtàkì.
  terminology: A ti lo “mọ̀” fún οἶδα ní ọ̀nà tó pa ìtumọ̀ àìjẹ́wọ́ ìbáṣepọ̀ tó lè wà nínú àyíká mọ́ láìfẹ̀sùn ìtumọ̀ kan ṣoṣo. Àlàyé ẹsẹ̀ ìsàlẹ̀ náà fún “dá yín mọ̀” gẹ́gẹ́ bí ìyípadà ìtumọ̀ jẹ́ ìtọ́nisọ́nà tó yẹ, ó sì tún sọ pé “kò mọ̀ yín” ni ọ̀rọ̀ Gíríìkì náà ní ní tààrà.
