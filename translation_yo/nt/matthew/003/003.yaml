id: MAT.3.3
reference: Matthew 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: yo
  text: 'Nítorí ẹni yìí ni a sọ nípa rẹ̀ nípasẹ̀ wòlíì Aísáyà pé:


    “‘Ohùn ẹni tí ń ké ní aginjù[a]:


    ‘Ẹ pèsè ọ̀nà Olúwa[b];


    ẹ mú àwọn ipa-ọ̀nà rẹ̀ tọ́.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ó tún lè jẹ́: “Ohùn ẹni tí ń ké pé: ‘Ní aginjù, ẹ pèsè ọ̀nà Olúwa …’” Àwọn ìwé Gíríìkì àtijọ́ kò ní àwọn àmì ìdádúró tó máa pinnu ibi tí “ní aginjù” ti sopọ̀ mọ́ gbolohun náà.'
    reason: syntactic_ambiguity
  - marker: b
    text: Àyọlò yìí ń dún bí Aísáyà 40:3, níbi tí ọ̀rọ̀ Hébérù ti ní orúkọ Ọlọ́run YHWH.
    reason: source_text_background
lexical_decisions:
- source_word: οὗτος
  choice: ẹni yìí
  rationale: Ó ń tọ́ka sí Jòhánù ní kedere, ó sì pa agbára ọ̀rọ̀ atọ́ka Gíríìkì mọ́.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó ṣàlàyé ìdí ọ̀rọ̀ inú ẹsẹ tó ṣáájú, gẹ́gẹ́ bí γάρ ṣe ń ṣiṣẹ́ níbí.
- source_word: ὁ ῥηθεὶς
  choice: ẹni tí a sọ nípa rẹ̀
  rationale: Ó ṣàfihàn participle àìṣe ti Gíríìkì ní Yorùbá àdánidá láì sọ ẹni tó sọ ọ́ sí kedere.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: nípasẹ̀ wòlíì Aísáyà
  rationale: “Nípasẹ̀” pa ìtumọ̀ Aísáyà gẹ́gẹ́ bí alárinà ọ̀rọ̀ àsọtẹ́lẹ̀ mọ́.
- source_word: Φωνὴ βοῶντος
  choice: Ẹ gbọ́ ohùn ẹni tí ń ké
  rationale: Àfikún “Ẹ gbọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti fi gbolohun aláìṣe “ohùn ẹni...” hàn gẹ́gẹ́ bí ìkéde; “ohùn ẹni tí ń ké” sì pa ìbáṣepọ̀ genitive náà mọ́.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: “Aginjù” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibi ahoro tí kò sí ìlú, ó sì bá àyíká iṣẹ́ Jòhánù àti àtọ́ka sí Aísáyà mu.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Ẹ pèsè ọ̀nà Olúwa
  rationale: “Ẹ pèsè” fi àṣẹ sí ọ̀pọ̀ ènìyàn hàn; “ọ̀nà Olúwa” sì pa àwòrán àsọtẹ́lẹ̀ náà mọ́.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: ẹ mú àwọn ipa ọ̀nà rẹ̀ tọ́
  rationale: Ó pa àṣẹ, ọ̀pọ̀ “àwọn ipa ọ̀nà,” arọ́pò-orúkọ “rẹ̀,” àti àwòrán mímú ọ̀nà tọ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ κυρίου nínú àyọlò Aísáyà 40:3, níbi tí Hébérù ti ní orúkọ Ọlọ́run YHWH
  choice: Olúwa
  alternative: YHWH
  rationale: Ọ̀rọ̀ Gíríìkì Mátíù ni κυρίου, èyí tí “Olúwa” túmọ̀ ní tààrà; àlàyé ìsàlẹ̀ ojú-ewé sọ pé YHWH ni ọ̀rọ̀ Hébérù tó wà lẹ́yìn àyọlò náà, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé ọ̀rọ̀ náà lórí.
- issue: Ohun tí ἐν τῇ ἐρήμῳ bá ní ìbáṣepọ̀ pẹ̀lú nínú gbolohun àsọtẹ́lẹ̀
  choice: 'ó bá “ẹni tí ń ké” lọ: “ẹni tí ń ké ní aginjù”'
  alternative: 'ó bẹ̀rẹ̀ àṣẹ náà: “Ní aginjù, ẹ pèsè ọ̀nà Olúwa”'
  rationale: Àmì ìdádúró inú ẹ̀dà SBLGNT àti àyíká Mátíù ṣe àtìlẹ́yìn fún kíké ní aginjù, ṣùgbọ́n àwọn ìwé àtijọ́ kò ní àmì ìdádúró bẹ́ẹ̀, àkójọpọ̀ ọ̀rọ̀ náà sì lè gba ìsopọ̀ kejì; a pa àṣàyàn yẹn mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti ìgbà òde ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtò ẹsẹ ewì ni a lò fún àyọlò àsọtẹ́lẹ̀. “Ẹ gbọ́” mú ìbẹ̀rẹ̀ àyọlò náà rọrùn ní Yorùbá, láì yí ẹni tó ń ké tàbí ohun tó ń ké padà.
