id: MAT.3.13
reference: Matthew 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: yo
  text: Nígbà náà ni Jésù wá[a] láti Galili sí odò Jọ́dánì, sọ́dọ̀ Jòhánù, láti gba ìrìbọmi lọ́wọ́ rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dé.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìgbà lọwọlọwọ nínú ìtàn láti mú ìtàn náà wà láàyè.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti lè gba ìrìbọmi lọ́wọ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tí ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tí ó ṣáájú rẹ̀, ó sì bá ìṣàn ìtàn Yorùbá mu.
- source_word: παραγίνεται
  choice: wá
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ present tense tí a lò nínú ìtàn láti mú un yè kooro. “Wá” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá, ó sì lè pa ìmúnibáni ìtàn náà mọ́ láìfi past tense tí kò ṣe pàtàkì kún un.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: láti Galili
  rationale: ἀπό tọ́ka sí ibi tí ìrìn-àjò ti bẹ̀rẹ̀; “láti” sọ orísun náà ní kedere.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: sí odò Jọ́dánì
  rationale: ἐπί pẹ̀lú accusative tọ́ka sí ìlọ sí ibi kan. Fífi “odò” kún un mú kí orúkọ ibi náà yé òǹkàwé Yorùbá kedere láìyí ìtumọ̀ padà.
- source_word: πρὸς τὸν Ἰωάννην
  choice: sọ́dọ̀ Jòhánù
  rationale: πρός níbí túmọ̀ sí lílọ sí ọ̀dọ̀ ènìyàn kan. “Sọ́dọ̀ Jòhánù” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtọ́sọ́nà yìí.
- source_word: τοῦ βαπτισθῆναι
  choice: láti gba ìrìbọmi
  rationale: Articular infinitive náà ń fi ète ìrìn-àjò hàn. “Láti gba ìrìbọmi” jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere, tí ó sì pa passive sense mọ́.
- source_word: ὑπ’ αὐτοῦ
  choice: lọ́wọ́ rẹ̀
  rationale: ὑπό pẹ̀lú genitive ń fi ẹni tó ṣe iṣẹ́ náà hàn. “Lọ́wọ́ rẹ̀” fi hàn pé Jòhánù ni yóò ṣe ìrìbọmi náà, láìtún orúkọ rẹ̀ sọ.
theological_decisions:
- issue: Present tense ìtàn nínú παραγίνεται
  choice: Lílo “wá” nínú ìṣètò “Nígbà náà ni…”
  alternative: “wá dé” tàbí gbólóhùn past tense tí ó túbọ̀ fìdí àkókò àtijọ́ múlẹ̀
  rationale: Yorùbá kì í fi tense hàn ní ọ̀nà kan náà bí Gíríìkì. Ìṣètò yìí jẹ́ kí ìtàn náà yè kooro, láìsọ present tense Gíríìkì di ẹ̀kọ́ ìgbàgbọ́ tàbí láìṣàlàyé rẹ̀ jù.
- issue: Bóyá kí a fi oyè Jòhánù kún un
  choice: “Jòhánù” nìkan
  alternative: “Jòhánù Onírìbọmi”
  rationale: Ẹsẹ yìí sọ Ἰωάννην nìkan. A kò fi oyè tí kò sí nínú ẹsẹ náà kún ọ̀rọ̀.
- issue: Ìbáṣepọ̀ tó wà láàárín Jòhánù àti ìrìbọmi Jésù
  choice: “láti gba ìrìbọmi lọ́wọ́ rẹ̀”
  alternative: “kí Jòhánù lè ṣe ìrìbọmi fún un”
  rationale: Àṣàyàn náà pa ìtumọ̀ passive àti aṣojú ὑπ’ αὐτοῦ mọ́, ṣùgbọ́n kò rọ́pò arọ́pò-orúkọ Gíríìkì pẹ̀lú orúkọ Jòhánù ní ọ̀nà àlàyé.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ohùn rẹ̀ ní iyì, ó sì rọrùn fún òǹkàwé òde òní. A lo “odò Jọ́dánì” fún ìmọ̀ kedere, àti “sọ́dọ̀ Jòhánù” láti yà ibi náà sílẹ̀ kúrò lọ́dọ̀ ẹni tí Jésù ń lọ bá.
