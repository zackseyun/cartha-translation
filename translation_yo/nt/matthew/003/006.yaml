id: MAT.3.6
reference: Matthew 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: yo
  text: Wọ́n sì ń gba ìrìbọmi lọ́wọ́ rẹ̀ nínú odò Jọ́dánì[a], wọ́n ń jẹ́wọ́ àwọn ẹ̀ṣẹ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “wọ́n gba ìrìbọmi”; ìṣe aláìpé ní Gíríìkì lè tẹnu mọ́ ìṣe tí ó ń bá a lọ tàbí tí ó ń ṣẹlẹ̀ léraléra: “wọ́n ń gba ìrìbọmi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: ń gba ìrìbọmi
  rationale: Ìṣe aláìpé tí ó sì jẹ́ passive ní Gíríìkì fi hàn pé ìrìbọmi náà ń bá a lọ tàbí pé ó ń ṣẹlẹ̀ léraléra. “Ń gba ìrìbọmi” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ yìí mọ́, láì sọ ọ̀nà tí a gbà ṣe ìrìbọmi náà di pàtó.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: nínú odò Jọ́dánì
  rationale: ἐν pẹ̀lú dative tọ́ka sí ibi tí ìṣe náà ti ṣẹlẹ̀, ποταμῷ sì sọ ní kedere pé Jọ́dánì jẹ́ odò. “Nínú odò Jọ́dánì” jẹ́ èdè Yorùbá tí ó ṣe kedere, tí ó sì pa gbogbo ìsọfúnni inú Gíríìkì mọ́.
- source_word: ὑπ’ αὐτοῦ
  choice: lọ́wọ́ rẹ̀
  rationale: ὑπό pẹ̀lú genitive fi ẹni tí ó ṣe ìṣe hàn. “Lọ́wọ́ rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tí wọ́n gba ìrìbọmi lọ́dọ̀ rẹ̀, ó sì pa arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi orúkọ Jòhánù kún ẹsẹ yìí.
- source_word: ἐξομολογούμενοι
  choice: wọ́n ń jẹ́wọ́
  rationale: Participle yìí jẹ́ ìṣe tí ó ń ṣẹlẹ̀ ní àkókò kan náà pẹ̀lú gbígba ìrìbọmi. “Ń jẹ́wọ́” túmọ̀ sí pé wọ́n ń sọ àwọn ìwà àìtọ́ wọn jáde, ó sì bá àyíká ìrònúpìwàdà mu.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: àwọn ẹ̀ṣẹ̀ wọn
  rationale: Èyí pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́, ó sì fi hàn pé àwọn ẹ̀ṣẹ̀ tiwọn ni wọ́n ń jẹ́wọ́.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ẹsẹ yìí mọ́ ìtàn tó ṣáájú rẹ̀ lọ́nà Yorùbá àdánidá láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ìrìbọmi àti ọ̀nà tí a gbà ṣe é
  choice: Lo “gba ìrìbọmi” láì sọ pé wọ́n rì wọ́n sínú omi tàbí pé wọ́n wẹ̀ wọ́n.
  alternative: “wọ́n ń rì wọ́n sínú omi” tàbí “wọ́n ń wẹ̀ wọ́n”
  rationale: Ẹsẹ náà sọ pé Jòhánù ṣe ìrìbọmi fún wọn nínú odò Jọ́dánì, ṣùgbọ́n kò ṣe àlàyé ọ̀nà ìṣe náà ní kedere. “Gba ìrìbọmi” pa èdè ìsìn inú ẹsẹ náà mọ́, kò sì fi ìpinnu ẹ̀kọ́ ìjọ kan tí Gíríìkì kò fi dandan mú wọlé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Àmì ohùn wà níbi tí ó bá yẹ. “Lọ́wọ́ rẹ̀” pa arọ́pò-orúkọ orísun mọ́, “ń gba ìrìbọmi” sì jẹ́ àdánidá ju gbólóhùn passive tí yóò le ní Yorùbá lọ.
