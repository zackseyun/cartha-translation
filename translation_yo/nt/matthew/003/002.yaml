  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: yo
  text: ó sì ń wí pé, “Ẹ ronúpìwàdà[a], nítorí ìjọba ọ̀run ti sún mọ́lé[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ yí ìrònú àti ọ̀nà yín padà.” Ọ̀rọ̀ Gíríìkì náà ń pè ènìyàn sí ìyípadà pàtàkì nínú ìrònú àti ìtọ́sọ́nà ìgbésí ayé, kì í ṣe sí níní ẹ̀bi ọkàn nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gígùn ọ̀rọ̀ Gíríìkì, “ìjọba àwọn ọ̀run ti sún mọ́lé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: ó sì ń wí pé
  rationale: Ọ̀rọ̀ yìí tẹ̀ síwájú láti inú ìtàn ẹsẹ̀ tó ṣáájú. ‘Ó sì ń wí pé’ jẹ́ ọ̀nà àdánidá láti fi ìṣe alábàáṣiṣẹ́ lọwọlọwọ λέγων hàn, láì fi ìtumọ̀ pàtó bí ‘kéde’ kún un.
- source_word: Μετανοεῖτε
  choice: Ẹ ronú pìwà dà
  rationale: Àṣẹ náà jẹ́ fún ọ̀pọ̀ ènìyàn. Gbólóhùn Yorùbá yìí jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó sì ní ọlá, fún ìpè sí ìrònúpìwàdà—ìyípadà inú àti ìtọ́sọ́nà ìgbésí ayé—láì dín un kù sí ìbànújẹ́ tàbí ẹ̀bi ọkàn nìkan.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Àkókò perfect Gíríìkì tọ́ka sí ohun tí ó ti súnmọ́, tí ó sì wà nítòsí báyìí. ‘Ti sún mọ́lé’ mú ìṣísẹ̀ àti ipò tó yọrí sí hàn.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún àṣẹ ìrònúpìwàdà; ‘nítorí’ jẹ́ ìsopọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ ìkéde mu.
- source_word: ἡ βασιλεία
  choice: ìjọba
  rationale: ‘Ìjọba’ lè tọ́ka sí ìṣàkóso ọba àti agbègbè ìjọba, nítorí náà ó pa ìwọ̀n ìtumọ̀ βασιλεία mọ́ dáadáa ju àlàyé tí yóò fi ọ̀kan ṣoṣo nínú wọn mú lọ.
- source_word: τῶν οὐρανῶν
  choice: ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni οὐρανῶν ní Gíríìkì, ‘ọ̀run’ ni ọ̀nà àdánidá ní Yorùbá nínú gbólóhùn Mátíù yìí; fífi sí ọ̀pọ̀ yóò máa dun bí ìtumọ̀ líle tí kò ṣe àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘ìjọba ọ̀run’
  choice: Pa ọ̀rọ̀ Mátíù mọ́ gẹ́gẹ́ bí ‘ìjọba ọ̀run’.
  alternative: ‘Ìṣàkóso Ọlọ́run’ tàbí ‘ìjọba Ọlọ́run’
  rationale: ‘Ìjọba ọ̀run’ pa ìlò ọ̀rọ̀ pàtàkì Mátíù àti àìdánilójú tó wà nínú βασιλεία mọ́, láì sọ ọ́ di àlàyé ẹ̀kọ́ ìsìn kan ṣoṣo.
- issue: Ìwọ̀n ìtumọ̀ Μετανοεῖτε
  choice: Lo ‘Ẹ ronú pìwà dà’ gẹ́gẹ́ bí ìpè sí ìyípadà inú àti ọ̀nà ìgbésí ayé.
  alternative: ‘Ẹ yí èrò yín padà’
  rationale: Yíyí èrò padà nìkan lè dín ìtumọ̀ ọ̀rọ̀ náà kù sí ìṣe ọpọlọ lasán; ‘ronú pìwà dà’ jẹ́ àdánidá ní Yorùbá, ó sì gbé ìpè Jòhánù tó jinlẹ̀ ju ìmọ̀lára ẹ̀bi lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìṣedéédé òde òní, pẹ̀lú àmì ohùn ní kíkún, ó sì ní ìró ìkéde tó ní ọlá. Fọ́ọ̀mù ọ̀pọ̀ ‘Ẹ’ bá àṣẹ ẹni-kejì ọ̀pọ̀ Μετανοεῖτε mu.
