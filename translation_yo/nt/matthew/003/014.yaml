  to: Ṣùgbọ́n Jòhánù ń gbìyànjú léraléra láti dá a dúró,[a] ó ní, “Èmi ni mo nílò kí ìwọ bamítísì mi, ìwọ sì ń bọ̀ sọ́dọ̀ mi?”
  rationale: Àtúnṣe náà ṣàfikún “mi” láti fi hàn láìṣiyèméjì pé Jòhánù ni olùgbà ìṣe bíbamítísì, gẹ́gẹ́ bí infinitive passive βαπτισθῆναι àti ὑπὸ σοῦ ṣe béèrè. “ń bọ̀ sọ́dọ̀ mi” tún ṣe afihan ἔρχῃ πρός με ní tààrà, nígbà tí “ń gbìyànjú léraléra” àti àlàyé ẹsẹ̀-ẹ̀gbẹ́ ń pa ipa aláìpé ti διεκώλυεν mọ́.
