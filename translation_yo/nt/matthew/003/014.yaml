id: MAT.3.14
reference: Matthew 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: yo
  text: Ṣùgbọ́n Jòhánù ń gbìyànjú léraléra láti dá a dúró,[a] ó ní, “Èmi ni mo nílò kí ìwọ bamítísì mi, ìwọ sì ń bọ̀ sọ́dọ̀ mi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jòhánù gbìyànjú láti dá a dúró.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tọ́ka sí ìṣe tí ó ń bá a lọ tàbí tí a ṣe léraléra.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: ń gbìyànjú léraléra láti dá a dúró
  rationale: Ọ̀rọ̀-ìṣe aláìpé yìí lè tọ́ka sí ìgbìyànjú tí ó ń bá a lọ tàbí tí a ṣe léraléra; gbolohun yìí mú ìtumọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: λέγων
  choice: ó ní
  rationale: Ní Yorùbá ìsinsìnyí, “ó ní” so ọ̀rọ̀ Jòhánù mọ́ ìgbìyànjú rẹ̀ láti dá Jésù dúró lọ́nà àdánidá.
- source_word: χρείαν ἔχω
  choice: Èmi ni ó yẹ kí
  rationale: Èyí sọ pé Jòhánù fúnra rẹ̀ ló nílò kí Jésù bamítísì rẹ̀, ní Yorùbá tí ó ṣe kedere tí kò sì le.
- source_word: ὑπὸ σοῦ
  choice: kí ìwọ bamítísì
  rationale: Àkópọ̀ ὑπό pẹ̀lú ọ̀rọ̀-ìṣe àìṣe fúnra ẹni fi Jésù hàn gẹ́gẹ́ bí ẹni tí yóò ṣe ìṣe náà; ìṣètò Yorùbá aláṣe mú èyí ṣe kedere.
- source_word: βαπτισθῆναι
  choice: bamítísì
  rationale: “Bamítísì” jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ dáadáa, ó sì yẹra fún fífi ọ̀nà ìṣe náà hàn ju bí Gíríìkì ṣe sọ lọ.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: ṣùgbọ́n ìwọ ha ń tọ̀ mí wá?
  rationale: Ìbéèrè àsọyé yìí pa ìyàtọ̀ tó wà nínú Gíríìkì mọ́; “ha” fún un ní ìwọ̀ntúnwọ̀nsì àti ọlá láìfi àlàyé míì kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora onírẹ̀lẹ̀ hàn láàárín bíbọ̀ Jésù sọ́dọ̀ Jòhánù àti ìdènà Jòhánù.
theological_decisions:
- issue: Àtakò Jòhánù sí bíbamítísì Jésù
  choice: A sọ ọ̀rọ̀ Jòhánù ní tààrà gẹ́gẹ́ bí ìjẹ́wọ́ pé òun gan-an ló yẹ kí Jésù bamítísì.
  alternative: Láti ṣàlàyé rẹ̀ ní kedere gẹ́gẹ́ bí ọ̀rọ̀ nípa àìlẹ́ṣẹ̀ Jésù tàbí ipò àṣẹ rẹ̀.
  rationale: Ẹsẹ̀ náà fi ìjẹ́wọ́ Jòhánù àti gíga Jésù ju ú lọ hàn, ṣùgbọ́n kò sọ ìdí ẹ̀kọ́ ìgbàgbọ́ náà ní kíkún; ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí ẹsẹ̀ náà fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn kíkún, tí ó ní ọlá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “bamítísì” gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀ nínú èdè Bíbélì, láìsọ ọ̀nà ìrìbọmi pàtó.
