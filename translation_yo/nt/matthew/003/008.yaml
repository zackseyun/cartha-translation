  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: yo
  text: Nítorí náà, ẹ so èso tí ó bá ìrònúpìwàdà mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ so èso tí ó yẹ fún ìrònúpìwàdà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: ẹ so
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn. Bí ó tilẹ̀ jẹ́ pé ποιέω lè túmọ̀ sí ‘ṣe,’ ‘so èso’ ni ọ̀nà àdánidá tí Yorùbá fi ń sọ pípa èso jáde, ó sì pa agbára àṣẹ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ yìí so mọ́ ìkìlọ̀ àti ìpè tí ó ṣáájú, ó sì fi hàn pé ohun tí a ń sọ jẹ́ àbájáde ọ̀rọ̀ náà.
- source_word: καρπὸν
  choice: èso
  rationale: ‘Èso’ ni ìtumọ̀ tààrà fún καρπός; níbí ó jẹ́ àpẹẹrẹ fún ìwà tàbí àbájáde tí a lè rí. A pa ẹyọ ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀.
- source_word: ἄξιον
  choice: tí ó yẹ fún
  rationale: Àṣàyàn yìí pa ìtumọ̀ ìbámu tàbí yíyẹ mọ́ láì sọ pé èso náà ń ra tàbí ń fa ìrònúpìwàdà.
- source_word: μετανοίας
  choice: ìrònúpìwàdà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ìyípadà inú àti yíyípadà kúrò ní ọ̀nà búburú ní ìdáhùn sí ìpè Johanu.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn καρπὸν ἄξιον τῆς μετανοίας
  choice: Àṣẹ láti hùwà ní ọ̀nà tí ó bá ìrònúpìwàdà tòótọ́ mu
  alternative: Èso tí ń jèrè ìrònúpìwàdà tàbí tí iye rẹ̀ dọ́gba pẹ̀lú rẹ̀
  rationale: Àkójọpọ̀ ἄξιος pẹ̀lú ọ̀rọ̀ ní fọ́ọ̀mù jẹnítífù ń tọ́ka sí ìbámu tàbí yíyẹ, kì í ṣe iṣẹ́ tí ń ra ìrònúpìwàdà. Ìtumọ̀ náà pa ìbéèrè ìwà rere inú ẹsẹ náà mọ́ láì fi ẹ̀kọ́ pé iṣẹ́ ènìyàn ló ń jèrè rẹ̀ kún un.
translation_notes:
  register: Yorùbá àjọṣe tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. ‘Ẹ so èso’ jẹ́ ọ̀rọ̀ àdánidá, ọ̀wọ̀, tí ó sì dá àṣẹ sí ọ̀pọ̀ ènìyàn dúró; ‘ìrònúpìwàdà’ jẹ́ ọ̀rọ̀ ẹ̀sìn tí ó wọ́pọ̀, tí àwọn òǹkàwé òde òní sì lè lóye.
