review_pass:
  verdict: revise
  source_fidelity: The imperative ποιήσατε is accurately represented by “ẹ so,” and “èso” preserves the collective-singular metaphor of καρπὸν. Nítorí náà faithfully conveys οὖν. However, “tí ó yẹ fún ìrònúpìwàdà” can naturally suggest fruit that is suitable for, or directed toward, repentance, rather than fruit that corresponds to repentance. “Tí ó bá ìrònúpìwàdà mu” clearly conveys the source construction ἄξιον τῆς μετανοίας as fitting or consistent with repentance.
  naturalness: “Ẹ so èso” and “ìrònúpìwàdà” are natural, established Standard Yoruba biblical usage. The revised relative phrase is more idiomatic and makes the intended relationship unambiguous without explanatory paraphrase.
  terminology: 'Retain “ìrònúpìwàdà,” the standard Yoruba theological term for μετάνοια/repentance. No doctrinal expansion is introduced: the wording requires conduct corresponding to repentance, not conduct that earns it.'
  issues:
  - severity: medium
    issue: The main phrase “tí ó yẹ fún ìrònúpìwàdà” is semantically less precise in Yoruba.
    rationale: With “yẹ fún,” the phrase may be read as ‘appropriate for repentance’ rather than ‘befitting/corresponding to repentance.’ The source genitive after ἄξιον expresses correspondence. The draft footnote already supplies the more natural and source-precise Yoruba expression.
  revised_text: Nítorí náà, ẹ so èso tí ó bá ìrònúpìwàdà mu.[a]
