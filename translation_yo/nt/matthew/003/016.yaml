reference: Matthew 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: yo
  text: Nígbà tí a sì ti batisí Jésù, lẹ́sẹ̀kẹsẹ̀ ni ó gòkè láti omi náà. Kíyèsi i, àwọn ọ̀run ṣí sílẹ̀, ó sì rí Ẹ̀mí Ọlọ́run tí ó ń sọ̀kalẹ̀ bí àdàbà, tí ó sì ń bọ̀ wá sórí rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èdè Gíríìkì sọ ní tààrà pé Ẹ̀mí náà “ń bọ̀ wá sórí rẹ̀”; a kò sọ ní pàtó pé ó “bà lé e.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Nígbà tí a sì ti batisí Jésù
  rationale: Aorist passive participle náà fi ìṣe batisí hàn gẹ́gẹ́ bí ohun tí ó ṣáájú ìṣe pàtàkì; ọ̀rọ̀ yìí pa ìtumọ̀ àkókò àti ohùn àìṣe mọ́ ní Yorùbá.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi bí ìṣẹ̀lẹ̀ kejì ṣe tẹ̀ lé èkíní kíákíá hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: ó gòkè láti inú omi
  rationale: ‘Gòkè’ túmọ̀ ìṣípò sókè; ‘láti inú omi’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún kíkúrò níbi omi, láìfi ẹ̀kọ́ nípa ọ̀nà batisí kún un.
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa agbára ọ̀rọ̀ ìkìlọ̀ tí ń pe àfiyèsí olùkà mọ́, ní èdè ọlọ́lá tí a tún lè lóye lónìí.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: àwọn ọ̀run ṣí sílẹ̀
  rationale: A pa nọ́ńbà púpọ̀ οἱ οὐρανοί mọ́, ṣùgbọ́n a lo ìṣètò Yorùbá àdánidá; ìtumọ̀ ṣiṣí náà kò sọ ẹni tí ó ṣe é.
- source_word: πνεῦμα θεοῦ
  choice: Ẹ̀mí Ọlọ́run
  rationale: Ó tẹ̀ lé àkójọpọ̀ orúkọ Gíríìkì, ó sì yàgò fún fífi akọ́lé ‘Ẹ̀mí Mímọ́’ rọ́pò ọ̀rọ̀ tí ẹsẹ náà lò.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: tí ó ń sọ̀kalẹ̀ bí àdàbà
  rationale: ‘Bí’ pa ìfiwéra ὡσεὶ mọ́, kò sì sọ pé Ẹ̀mí náà jẹ́ àdàbà ní ti gidi.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: tí ó sì ń bọ̀ wá sórí rẹ̀
  rationale: Ó pa ìtumọ̀ ìṣípò ‘bọ̀ wá’ àti ìdarí ‘sórí rẹ̀’ mọ́, dípò lílo ọ̀rọ̀ tí yóò túmọ̀ sí pé ó bà lé e ní pàtó.
theological_decisions:
- issue: Bóyá πνεῦμα θεοῦ yẹ kí a túmọ̀ sí Ẹ̀mí Mímọ́ tàbí kí a pa gbólóhùn náà mọ́
  choice: Ẹ̀mí Ọlọ́run
  alternative: Ẹ̀mí Mímọ́
  rationale: Àyíká ìtàn náà tọ́ka sí Ẹ̀mí Mímọ́, ṣùgbọ́n ‘Ẹ̀mí Ọlọ́run’ pa ọ̀rọ̀ Gíríìkì gan-an mọ́ láìṣe àfikún.
- issue: Bóyá Ẹ̀mí náà jẹ́ àdàbà ní ti gidi tàbí pé ọ̀nà ìsọ̀kalẹ̀ rẹ̀ dà bí ti àdàbà
  choice: tí ó ń sọ̀kalẹ̀ bí àdàbà
  alternative: tí ó ń sọ̀kalẹ̀ gẹ́gẹ́ bí àdàbà
  rationale: ὡσεὶ jẹ́ àmì ìfiwéra; ‘bí àdàbà’ pa ìfarawe náà mọ́, kò sì fipá mú ìdánimọ̀ gidi.
- issue: Ẹni tí ó rí Ẹ̀mí Ọlọ́run
  choice: ó sì rí
  alternative: Jésù sì rí
  rationale: Kókó-ọ̀rọ̀ tó sún mọ́ jù ni Jésù, gẹ́gẹ́ bí gírámà Gíríìkì ṣe fi hàn; a kò fi orúkọ kún un nítorí orísun náà lo arọ́pò-orúkọ nínú ìṣe-ọrọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere ni a lò. A yan ‘batisí’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, ‘lẹ́sẹ̀kẹsẹ̀’ fún ìtẹ̀lé kíákíá, àti ‘àwọn ọ̀run’ láti pa nọ́ńbà púpọ̀ orísun mọ́. Àmì àlàyé [a] wà nínú ọ̀rọ̀ pàtàkì.
