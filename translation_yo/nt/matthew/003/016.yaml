revisions:
- from: Nígbà tí a sì ti batisí Jésù, lẹ́sẹ̀kẹsẹ̀ ni ó gòkè láti inú omi. Sì wò ó, àwọn ọ̀run ṣí sílẹ̀, ó sì rí Ẹ̀mí Ọlọ́run tí ó ń sọ̀kalẹ̀ bí àdàbà, tí ó sì ń bọ̀ wá sórí rẹ̀.[a]
  to: Nígbà tí a sì ti batisí Jésù, lẹ́sẹ̀kẹsẹ̀ ni ó gòkè láti omi náà. Kíyèsi i, àwọn ọ̀run ṣí sílẹ̀, ó sì rí Ẹ̀mí Ọlọ́run tí ó ń sọ̀kalẹ̀ bí àdàbà, tí ó sì ń bọ̀ wá sórí rẹ̀.[a]
  rationale: Àtúnṣe náà yọ ìtumọ̀ ‘inú/out of’ tí ó le ju nínú ‘láti inú omi,’ kí ó lè bá ἀπό mu dáadáa, ó sì rọ́pò àmì ìfẹ́sẹ̀mulẹ̀ tí kò rọrùn díẹ̀ pẹ̀lú ‘Kíyèsi i.’ Kò sí ìyípadà sí ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ tàbí sí ẹni tí ó rí ìran náà. Àmì àlàyé [a] ṣì so mọ́ ibi tí ó yẹ, a sì tún ọ̀rọ̀ rẹ̀ ṣe díẹ̀ fún ìmúlò Yorùbá tó dára.
