  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé Gíríìkì dáadáa ní gbogbogbòò: ó pa ohùn àìṣe nínú βαπτισθείς mọ́, ó túmọ̀ εὐθύς sí ìtẹ̀lé kíákíá, ó pa ‘àwọn ọ̀run’ mọ́, ó sì jẹ́ kí ‘bí àdàbà’ wà gẹ́gẹ́ bí ìfiwéra. Síbẹ̀, ‘láti inú omi’ lè túmọ̀ ἀπό ní okun ju bó ṣe wà nínú orísun lọ, nítorí ó tẹnumọ́ ‘out of’ ju ‘from’ lọ.'
