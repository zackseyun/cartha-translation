    issue: ‘olùfẹ́’ is used for ὁ ἀγαπητός.
    rationale: In ordinary Yoruba usage, olùfẹ́ is chiefly ‘one who loves; lover.’ The Greek adjective here means ‘beloved’—the one loved. Àfẹ́fẹ́ conveys that meaning without reversing the relationship.
