id: MAT.3.17
reference: Matthew 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: yo
  text: Sì kíyèsí i, ohùn kan láti àwọn ọ̀run[a] wá sọ pé, “Èyí ni Ọmọ mi àfẹ́fẹ́, ẹni tí inú mi dùn sí gidigidi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láti ọ̀run wá.” Èdè Gíríìkì lo ọ̀pọ̀ nọ́ńbà pé “láti àwọn ọ̀run wá.”
    reason: lexical_alternative
  - marker: b
    text: 'Gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe rí gan-an: “nínú ẹni tí inú mi dùn sí gidigidi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ọ̀rọ̀ yìí fa àfiyèsí sí ìṣẹ̀lẹ̀ pàtàkì tí ó tẹ̀ lé e, ó sì pa ìwọ̀ntúnwọ̀nsì àti ọlá ìkéde náà mọ́.
- source_word: φωνὴ
  choice: ohùn kan
  rationale: Nítorí pé ọ̀rọ̀ tí a sọ tẹ̀ lé e, φωνή túmọ̀ sí ohùn tí ń sọ̀rọ̀, kì í ṣe ariwo lásán.
- source_word: ἐκ τῶν οὐρανῶν
  choice: láti àwọn ọ̀run wá
  rationale: Èyí pa ọ̀pọ̀ nọ́ńbà tí ó wà nínú èdè Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ‘láti ọ̀run wá’ tún jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀.
- source_word: λέγουσα
  choice: sọ pé
  rationale: A lo ọ̀rọ̀-ìṣe tí ó pé láti fi ìsọ̀rọ̀ náà hàn lọ́nà Yorùbá àdánidá, dípò títúmọ̀ participle náà ní líle koko.
- source_word: Οὗτός ἐστιν
  choice: Èyí ni
  rationale: Ó pa agbára ìdánimọ̀ tààràtà ti demonstrative àti copula náà mọ́ ní Yorùbá àdánidá.
- source_word: ὁ υἱός μου
  choice: Ọmọ mi
  rationale: ‘Ọmọ mi’ ni ọ̀nà Yorùbá àdánidá fún ìbátan ọmọkùnrin ní àyíká yìí; lílo lẹ́tà ńlá fún ‘Ọmọ’ fi iṣẹ́ rẹ̀ gẹ́gẹ́ bí orúkọ oyè Kristi hàn láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ὁ ἀγαπητός
  choice: olùfẹ́
  rationale: ‘Olùfẹ́’ sọ ẹni tí a fẹ́ràn gidigidi, ó sì yẹ fún ohùn ìkéde ọlọ́lá yìí láìyí ìtumọ̀ rẹ̀ sí ‘àyànfẹ́.’
- source_word: ἐν ᾧ
  choice: ẹni tí ... sí
  rationale: Ètò ‘ẹni tí inú mi dùn sí’ ni Yorùbá àdánidá fún ìbáṣepọ̀ tí ἐν ᾧ ń fi hàn níbí; àlàyé ìsàlẹ̀ fi ìtumọ̀ gẹ́gẹ́ bí ọ̀rọ̀ ṣe rí pamọ́.
- source_word: εὐδόκησα
  choice: inú mi dùn sí gidigidi
  rationale: Èyí sọ ìtẹ́wọ́gbà àti inú dídùn Ọlọ́run ní Yorùbá tí ó ṣe kedere, láìfipá mú aorist Gíríìkì wọ inú àkókò ọ̀rọ̀-ìṣe tí kò bá Yorùbá mu.
theological_decisions:
- issue: Ìkéde pé Jésù ni Ọmọ Ọlọ́run
  choice: Ọmọ mi olùfẹ́
  alternative: Ọmọ mi tí mo fẹ́ràn gidigidi
  rationale: Èyí pa ìbátan Ọmọ àti ìfẹ́ tí ọ̀rọ̀ Gíríìkì sọ mọ́, láìsọ ọ́ di ipò iṣẹ́ lásán tàbí fífi èrò pé a ṣẹ̀ṣẹ̀ gba Jésù ṣe ọmọ kún ọ̀rọ̀ náà.
- issue: Ọ̀pọ̀ nọ́ńbà οὐρανῶν
  choice: àwọn ọ̀run
  alternative: ọ̀run
  rationale: Ọ̀pọ̀ nọ́ńbà náà tẹ̀ lé ẹ̀rí orísun Gíríìkì; àlàyé ìsàlẹ̀ tún jẹ́ kí òǹkàwé mọ ọ̀nà ẹyọ nọ́ńbà tí ó wọ́pọ̀ ní Yorùbá.
- issue: Ìtumọ̀ ἐν ᾧ εὐδόκησα
  choice: ẹni tí inú mi dùn sí gidigidi
  alternative: nínú ẹni tí inú mi dùn sí gidigidi
  rationale: A yan ọ̀nà Yorùbá àdánidá, ṣùgbọ́n a fi ìṣètò ọ̀rọ̀ tí ó sún mọ́ Gíríìkì sí àlàyé ìsàlẹ̀, kí a má bà a pa àìdánilójú kékeré ti preposition náà run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. ‘Sì kíyèsí i’ pa àmì àfiyèsí orísun mọ́; ‘inú mi dùn sí gidigidi’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìtẹ́wọ́gbà tó jinlẹ̀.
