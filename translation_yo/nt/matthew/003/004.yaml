id: MAT.3.4
reference: Matthew 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: yo
  text: Jòhánù fúnra rẹ̀ sì wọ aṣọ tí a fi irun ràkúnmí ṣe àti àmùrè awọ ní ìbàdí rẹ̀[c][b][a]; oúnjẹ rẹ̀ sì ni eṣú àti oyin igbó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aṣọ Jòhánù mú ìrísí wòlíì Èlíjà ní 2 Àwọn Ọba 1:8 wá sí ìrántí; èyí ṣe pàtàkì sí bí Mátíù ṣe gbé Jòhánù kalẹ̀.
    reason: cross_reference
  - marker: b
    text: Tàbí, “aṣọ rẹ̀ jẹ́ ti irun ràkúnmí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó ní aṣọ tí a fi irun ràkúnmí ṣe.”
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Jòhánù fúnra rẹ̀ sì
  rationale: “Fúnra rẹ̀” mú ìtẹnumọ́ αὐτός jáde, “sì” sì ń gbé ìsopọ̀ pẹ̀lẹ́ ti δέ láì fi ọ̀rọ̀ àkókò kún un.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: wọ aṣọ
  rationale: Bí ó tilẹ̀ jẹ́ pé εἶχεν túmọ̀ sí ‘ní,’ ní àyíká yìí ó ń ṣàpèjúwe ohun tí Jòhánù máa ń wọ; “wọ aṣọ” jẹ́ Yorùbá àdánidá tí kò ní túmọ̀ sí pé ó pàṣẹ pé kí a rán aṣọ náà.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: tí a fi irun ràkúnmí ṣe
  rationale: ἀπό níbí ń tọ́ka sí ohun èlò tí a fi ṣe aṣọ; gbolohun yìí sọ ìtumọ̀ náà ní kedere.
- source_word: ζώνην δερματίνην
  choice: àmùrè awọ
  rationale: “Àmùrè” jẹ́ ohun tí a fi ń di ara ní ìbàdí, “awọ” sì sọ ohun èlò aláwọ-ẹranko tí δερματίνην ń tọ́ka sí.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: ní ìbàdí rẹ̀
  rationale: Ìbàdí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ὀσφύς, ó sì yẹra fún ọ̀rọ̀ àtijọ́ tàbí èyí tí kò ṣe kedere.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: oúnjẹ rẹ̀ sì ni
  rationale: Ìtumọ̀ tààrà ti τροφή ni oúnjẹ; ìṣètò yìí sì jẹ́ àdánidá ní Yorùbá fún àlàyé ohun tí ó ń jẹ.
- source_word: ἀκρίδες
  choice: eṣú
  rationale: Ìtumọ̀ léksíkàlì àkọ́kọ́ ni kòkòrò eṣú; kò sí ohun nínú àyíká tí ó fi yẹ kí a yí i sí ohun ọ̀gbìn.
- source_word: μέλι ἄγριον
  choice: oyin igbó
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí oyin tí a rí nínú igbó, kì í ṣe oyin tí a ń tọ́jú ní ilé.
theological_decisions:
- issue: Àwòrán ìgbésí ayé wòlíì àti ìfarajọ́ Èlíjà
  choice: A túmọ̀ àpèjúwe aṣọ àti oúnjẹ Jòhánù ní tààrà, a sì fi ìfarajọ́ Èlíjà sínú àlàyé ìsàlẹ̀.
  alternative: Kí a fi ọ̀rọ̀ tí yóò sọ ní gbangba pé Jòhánù dà bí Èlíjà sínú ẹsẹ̀ náà.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kàn ṣàpèjúwe aṣọ àti oúnjẹ Jòhánù. Ó ṣeé ṣe kó rántí Èlíjà ní 2 Àwọn Ọba 1:8, ṣùgbọ́n fífi ìtumọ̀ yẹn sínú ọ̀rọ̀ ẹsẹ̀ yóò kọjá ohun tí Gíríìkì sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Ràkúnmí,” “àmùrè,” “ìbàdí,” àti “oyin igbó” jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lásán lè lóye. Àwọn àmì àlàyé [c][b][a] wà lẹ́yìn àpèjúwe aṣọ gẹ́gẹ́ bí wọ́n ṣe wà nínú ẹ̀dà ìtọ́kasí.
