id: MAT.3.12
reference: Matthew 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: yo
  text: Ṣọ́bù fífẹ́ ọkà rẹ̀ wà ní ọwọ́ rẹ̀[a], yóò sì sọ ilẹ̀ ìpakà rẹ̀ di mímọ́ pátápátá, yóò kó àlìkámà rẹ̀ jọ sínú ilé ìpamọ́ ọkà[b]; ṣùgbọ́n yóò fi iná tí a kò lè pa jó ìyàngbò náà run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ọ̀pá fífẹ́ ọkà.’ Àwọn ìtumọ̀ Gẹ̀ẹ́sì àtijọ́ kan ní ‘fẹ́ẹ̀nù.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘àká ọkà’ tàbí ‘abà ọkà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: ọ̀pá ìfẹ́ ọkà
  rationale: Ó ń tọ́ka sí ohun èlò iṣẹ́ àgbẹ̀ tí a fi ń fẹ́ ọkà láti ya irúgbìn kúrò lára ìyàngbò; gbólóhùn yìí ṣe kedere ní Yorùbá láìfi ìtumọ̀ ‘fẹ́ẹ̀nù’ òde òní sínú rẹ̀.
- source_word: διακαθαριεῖ
  choice: yóò gbá ... mọ́ tónítóní
  rationale: Ìṣọ̀kan ọ̀rọ̀ yìí mú ìṣe mímọ́ kúrò patapata lágbára; ‘mọ́ tónítóní’ fi ìtumọ̀ ìparí iṣẹ́ náà hàn ní èdè àdánidá.
- source_word: ἅλωνα
  choice: pápá ìpakà
  rationale: Èyí ni ibi tí a ti ń pa ọkà, tí a sì ti ń fẹ́ ẹ; ó pa àwòrán iṣẹ́ àgbẹ̀ inú orísun mọ́.
- source_word: σῖτον
  choice: àlìkámà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ọkà lápapọ̀, àlìkámà bá ìyàtọ̀ rẹ̀ sí ìyàngbò mu nínú àwòrán yìí.
- source_word: ἀποθήκην
  choice: ilé ìkó-ọkà-sí
  rationale: Ó ṣàlàyé ibi ìtọ́jú ọkà láìfi irú ilé àgbẹ̀ kan pàtó tí orísun kò sọ kún un.
- source_word: ἄχυρον
  choice: ìyàngbò
  rationale: Ọ̀rọ̀ Yorùbá yìí dúró fún apá ọkà tí kò wúlò tí a yà kúrò lára irúgbìn nígbà ìfẹ́ ọkà.
- source_word: κατακαύσει
  choice: yóò ... jó ... run
  rationale: ‘Jó ... run’ pa agbára ọ̀rọ̀ Gíríìkì mọ́ pé iná náà yóò jó ohun náà tán, kì í ṣe pé yóò kàn sun ún díẹ̀.
- source_word: πυρὶ ἀσβέστῳ
  choice: fi iná tí kò ṣeé pa
  rationale: Ó fi iná hàn gẹ́gẹ́ bí ohun èlò ìṣe náà, ó sì sọ ànímọ́ rẹ̀ ní kedere pé a kò lè pa á.
- source_word: οὗ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò orúkọ oníhun náà ń tọ́ka padà sí ẹni tí ń bọ̀ nínú ẹsẹ tó ṣáájú; lílo ‘rẹ̀’ jẹ́ ọ̀nà àdánidá láti pa ìsopọ̀ náà mọ́ ní Yorùbá.
theological_decisions:
- issue: Àwòrán ìdájọ́ tí ó ya àlìkámà kúrò lára ìyàngbò
  choice: A pa àwòrán iṣẹ́ àgbẹ̀ àti ọ̀rọ̀ ìdájọ́ ọjọ́ iwájú mọ́ láìrọ̀ ọ́.
  alternative: Kí a túmọ̀ àlìkámà àti ìyàngbò ní tààràtà sí àwọn olódodo àti àwọn ènìyàn búburú nínú ọ̀rọ̀ ẹsẹ náà.
  rationale: Ẹsẹ náà fúnra rẹ̀ lo àkàwé, kò sì sọ àwọn tí àlìkámà àti ìyàngbò dúró fún ní tààràtà. Ìtumọ̀ náà gbọ́dọ̀ pa líle àti àìsọ pàtó yìí mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ó ní ọlá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àlàyé ohun èlò iṣẹ́ àgbẹ̀ ní ibi tí ọ̀rọ̀ kan ṣoṣo lè ṣókùnkùn, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
