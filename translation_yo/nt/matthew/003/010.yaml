id: MAT.3.10
reference: Matthew 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: yo
  text: Báyìí, a ti gbé àáké síbi gbòǹgbò àwọn igi[a]. Nítorí náà, gbogbo igi tí kò so èso rere ni a gé lulẹ̀, a sì jù ú sínú iná.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àáké dùbúlẹ̀ síbi gbòǹgbò àwọn igi.”
    reason: Àfihàn mìíràn fún κεῖται, tó lè túmọ̀ sí pé ohun kan ‘dùbúlẹ̀’ tàbí ‘wà ní ipò kan.’
lexical_decisions:
- source_word: ἤδη δὲ
  choice: Àti pé ... báyìí
  rationale: Ó so ọ̀rọ̀ náà mọ́ ìkìlọ̀ tó ṣáájú, ó sì fi hàn pé ìdájọ́ náà ti sún mọ́lé gan-an.
- source_word: ἡ ἀξίνη
  choice: àáké
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún irinṣẹ́ tí a fi ń gé igi ni èyí, ó sì pa àwòrán ìdájọ́ mọ́.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: ti wà níbi gbòǹgbò àwọn igi
  rationale: Ó ṣe àfihàn pé a ti gbé àáké náà sí ibi tó ti ṣe tán láti gé, láìfi ìtumọ̀ tí ó ju ti Gíríìkì lọ kún un.
- source_word: πᾶν οὖν δένδρον
  choice: Nítorí náà, gbogbo igi
  rationale: ‘Nítorí náà’ fi ìyọrísí ọgbọ́n inú àwòrán àáké náà hàn ní kedere.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: tí kò bá so èso rere
  rationale: ‘So èso’ ni ọ̀nà àdánidá ní Yorùbá fún ohun tí igi ń ṣe; ‘rere’ sì dá καλόν padà láìfikún ìtumọ̀ ẹ̀sìn mìíràn.
- source_word: ἐκκόπτεται
  choice: ni a gé lulẹ̀
  rationale: Ìsọ̀rọ̀ yìí bá àwòrán gígé igi mu, ó sì fi ìṣe náà hàn ní ohùn àìṣe gẹ́gẹ́ bí orísun.
- source_word: εἰς πῦρ βάλλεται
  choice: tí a sì jù sínú iná
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, ó sì pa agbára àwòrán βάλλεται mọ́.
theological_decisions:
- issue: Irú iná tí àwòrán náà ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘iná’ láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ sí i.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí ìdájọ́ ọjọ́ ìkẹyìn, ìdájọ́ ayé yìí, tàbí iná ọ̀run àpáàdì.
  rationale: Ẹsẹ̀ náà lo àwòrán ìdájọ́, ṣùgbọ́n kò sọ irú ìdájọ́ náà ní pàtó; nítorí náà, a pa àìdánilójú àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní èdè òde òní tó ní iyì. A lo ‘so èso’ nítorí ó jẹ́ àṣà ọ̀rọ̀ Yorùbá tó wọ́pọ̀, a sì yàgò fún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì.
