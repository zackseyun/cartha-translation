id: MAT.3.11
reference: Matthew 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: yo
  text: Èmi ń fi omi batisí yín[a] fún ìrònúpìwàdà[b]; ṣùgbọ́n ẹni tí ń bọ̀ lẹ́yìn mi lágbára ju mi lọ. Èmi kò tilẹ̀ yẹ láti gbé bàtà rẹ̀. Òun fúnra rẹ̀ yóò fi Ẹ̀mí Mímọ́ àti iná[c] batisí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἐν lè jẹ́ ‘fi omi’ tàbí ‘nínú omi’; bákan náà, ó lè jẹ́ ‘fi Ẹ̀mí Mímọ́ àti iná’ tàbí ‘nínú Ẹ̀mí Mímọ́ àti iná’ ní apá ìkẹyìn ẹsẹ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí ‘sí ìrònúpìwàdà.’ Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ìdarí sí ohun kan, ṣùgbọ́n kò sọ ní pàtó níbí bóyá ìrònúpìwàdà ṣáájú ìbatisí tàbí pé ìbatisí ń fi í hàn.
    reason: lexical_alternative
  - marker: c
    text: ‘Iná’ lè jẹ́ àwòrán ìwẹ̀nùmọ́ tàbí ìdájọ́; ọ̀rọ̀ Gíríìkì kò yan ọ̀kan nínú wọn níbí, nítorí náà àyíká ọ̀rọ̀ ni ó yẹ kí ó darí òye òǹkàwé.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: batisí / yóò ... batisí
  rationale: A lo ọ̀rọ̀ tí àwọn Kristẹni Yorùbá mọ̀ dáadáa, láì fi ‘rì sínú’ sọ ọ̀nà pàtó tí ìṣe náà gbà, nítorí ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìbatisí tàbí ìwẹ̀nùmọ́ àṣà ní gbogbogbòò.
- source_word: ἐν ὕδατι
  choice: fi omi
  rationale: ‘Fi omi’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tí a fi ṣe ìbatisí; àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn ‘nínú omi’ mọ́, nítorí ἐν lè ní ìtumọ̀ ibi tàbí ohun èlò.
- source_word: εἰς μετάνοιαν
  choice: fún ìrònúpìwàdà
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa ìdarí tàbí ète εἰς mọ́ láì pinnu ní pàtó bóyá ìrònúpìwàdà ṣáájú ìbatisí tàbí ìbatisí ń fi í hàn.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: ṣùgbọ́n ẹni tí ń bọ̀ lẹ́yìn mi
  rationale: Ó túmọ̀ àpólà aláàbọ̀ náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ tẹ̀lé-lẹ́yìn mọ́.
- source_word: ἰσχυρότερός μού ἐστιν
  choice: lágbára ju mi lọ
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó taara, tó sì yẹ fún ìfiwéra agbára.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Èmi kò tilẹ̀ yẹ
  rationale: Nínú ọ̀rọ̀ ìrẹ̀lẹ̀ yìí, ‘kò yẹ’ mú ìtumọ̀ pé ẹni kò tó ipò tàbí kò yẹ fún iṣẹ́ náà jáde dáadáa ju ìtumọ̀ agbára ara lásán lọ.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: láti gbé bàtà rẹ̀
  rationale: βαστάσαι túmọ̀ sí ‘gbé’ tàbí ‘rú,’ kì í ṣe ‘bọ́.’ ‘Bàtà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tí ó sì bá ohun tí a wọ̀ lẹ́sẹ̀ mu.
- source_word: αὐτός
  choice: Òun fúnra rẹ̀
  rationale: Àpólà yìí pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, ó sì fi iṣẹ́ ẹni tí ń bọ̀ yàtọ̀ sí ti Jòhánù.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: fi Ẹ̀mí Mímọ́
  rationale: ‘Ẹ̀mí Mímọ́’ tọ́ka sí ẹni náà ní ọ̀nà tí Yorùbá òde òní mọ̀; ‘fi’ jẹ́ ìsọ̀rọ̀ àdánidá, nígbà tí àlàyé fi hàn pé ἐν tún lè túmọ̀ sí ‘nínú.’
- source_word: καὶ πυρί
  choice: àti iná
  rationale: Ìtumọ̀ gígún tààrà yìí kò sọ bóyá iná náà jẹ́ ti ìwẹ̀nùmọ́ tàbí ti ìdájọ́, ó sì tipa bẹ́ẹ̀ pa àìdánilójú àwòrán Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘Ẹ̀mí Mímọ́ àti iná’
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ‘Ẹ̀mí Mímọ́ àti iná,’ láì fi àlàyé ìtumọ̀ kún un nínú ẹsẹ̀.
  alternative: ‘Ẹ̀mí Mímọ́ àti iná ìwẹ̀nùmọ́’ tàbí ‘Ẹ̀mí Mímọ́ àti iná ìdájọ́.’
  rationale: Àyíká ọ̀rọ̀ lè mú kí òǹkàwé ronú nípa ìwẹ̀nùmọ́ tàbí ìdájọ́. Ìtumọ̀ náà kò yẹ kó yanju ìjàngbọ̀n ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò yanju fúnra rẹ̀.
- issue: Ẹni tí πνεύματι ἁγίῳ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́ tàbí agbára ẹ̀mí mímọ́
  rationale: Nínú àyíká Mátíù, gbólóhùn náà tọ́ka sí Ẹ̀mí Mímọ́, kì í ṣe agbára aláìlẹ́ni kan; síbẹ̀, a kò fi ẹ̀kọ́ ìgbàgbọ́ míì tí kò sí nínú ẹsẹ̀ kún un.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìsọ̀rọ̀ náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lasán. A lo ‘batisí’ gẹ́gẹ́ bí ọ̀rọ̀ ìjọ tó ti wọ́pọ̀, a sì yẹra fún ọ̀rọ̀ ẹ̀ka ìjọ kan tàbí ìtumọ̀ tó lè pinnu ọ̀nà ìbatisí.
