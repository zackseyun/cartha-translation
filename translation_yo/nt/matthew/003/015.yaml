id: MAT.3.15
reference: Matthew 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dá a lóhùn pé, “Jẹ́ kí ó rí bẹ́ẹ̀ fún ìsinsìnyí, nítorí ní ọ̀nà yìí ni ó yẹ fún wa láti mú gbogbo òdodo ṣẹ[a].” Nígbà náà ni Jòhánù gbà á láàyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí òdodo tàbí ìdájọ́ òdodo; “òdodo” bá ìtẹnumọ́ Mátíù lórí ṣíṣe ohun tí ó bá ìfẹ́ Ọlọ́run mu mu dáadáa níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Ṣùgbọ́n Jésù dá a lóhùn pé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé Jésù dá Jòhánù lóhùn; “Ṣùgbọ́n” fi ìyàtọ̀ sí àtakò Jòhánù nínú ẹsẹ tó ṣáájú hàn.
- source_word: Ἄφες ἄρτι
  choice: Jẹ́ kí ó rí bẹ́ẹ̀ nísinsìnyí
  rationale: Nínú àyíká yìí, ἀφίημι túmọ̀ sí fífàyè gba ohun tí a fẹ́ ṣe, kì í ṣe dídáríjì; ἄρτι tọ́ka sí àkókò yìí gan-an.
- source_word: οὕτως γὰρ
  choice: nítorí báyìí ni
  rationale: Ó tọ́ka sí ọ̀nà tí a ṣẹ̀ṣẹ̀ sọ, ìyẹn pé kí Jòhánù bamitiisi Jésù.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: ó yẹ fún wa
  rationale: Èyí sọ ohun tó bá ipò náà àti ìfẹ́ Ọlọ́run mu ní Yorùbá àdánidá.
- source_word: πληρῶσαι
  choice: láti mú ... ṣẹ
  rationale: Ìtumọ̀ yìí pa ìró pàtàkì πληρόω mọ́ nínú Mátíù, níbi tí ó ti sábà máa ń tọ́ka sí mímú ète Ọlọ́run ṣẹ.
- source_word: πᾶσαν δικαιοσύνην
  choice: gbogbo òdodo
  rationale: “Òdodo” pa ìtúmọ̀ gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́, láì dín in kù sí pípa gbogbo òfin mọ́ nìkan tàbí fi ẹ̀kọ́ kan tí ẹsẹ náà kò sọ kún un.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Nígbà náà ni Jòhánù gbà á láàyè
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ìsinsìnyí ìtàn ní Gíríìkì, ṣùgbọ́n Yorùbá yìí sọ ìṣẹ̀lẹ̀ náà lọ́nà àdánidá. A lo orúkọ Jòhánù láti mú ẹni tí “ó” ń tọ́ka sí ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ “gbogbo òdodo”
  choice: Ohun gbogbo tó bá ìfẹ́ àti ète òdodo Ọlọ́run mu nínú ìṣẹ̀lẹ̀ yìí, pàápàá bí Jésù ṣe gba ìbatisí lọ́wọ́ Jòhánù.
  alternative: Gbogbo ohun tí òfin béèrè; tàbí gbogbo ìdájọ́ òdodo.
  rationale: Àyíká ọ̀rọ̀ àti lílo δικαιοσύνη nínú Mátíù ṣe àtìlẹ́yìn fún ìtumọ̀ gbígbòòrò ti ṣíṣe ohun tó bá ìfẹ́ Ọlọ́run mu. A kò sọ ọ́ di pípa òfin mọ́ nìkan, bẹ́ẹ̀ ni a kò fi ètò ẹ̀kọ́ ìgbàgbọ́ tí kò fara hàn nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. “Jẹ́ kí ó rí bẹ́ẹ̀” àti “gbà á láàyè” jẹ́ ọ̀rọ̀ àdánidá, nígbà tí “mú gbogbo òdodo ṣẹ” pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ àti ìró Mátíù mọ́.
