revisions:
- from: Nígbà náà ni àwọn ará Jerúsálẹ́mù, gbogbo Jùdíà, àti gbogbo agbègbè tí ó yí Jọ́dánì ká ń jáde lọ bá a.[a][b]
  to: Nígbà náà, àwọn ènìyàn láti Jerúsálẹ́mù, láti gbogbo Jùdíà, àti láti gbogbo agbègbè tí ó yí Jọ́dánì ká ń jáde lọ bá a.[a][b]
  rationale: Àtúnṣe náà mú kókó-ọrọ̀ náà bá ìlò Yorùbá mu nípa fífi hàn pé àwọn ènìyàn, kì í ṣe àwọn agbègbè fúnra wọn, ni wọ́n ń jáde lọ. Ó pa àtòjọ Jerúsálẹ́mù, gbogbo Jùdíà, àti gbogbo agbègbè tó yí Jọ́dánì ká mọ́, ó sì pa ìṣe imperfect náà mọ́ nínú ‘ń jáde lọ.’ Àwọn àkọsílẹ̀ ìsàlẹ̀ náà tún ṣe kedere síi láìfi ìtumọ̀ ìjọsìn tàbí ìdájọ́ àfikún kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:31Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ìṣísẹ̀ tí ń bá a lọ nínú ἐξεπορεύετο, sí ìrìn sí ọ̀dọ̀ Jòhánù, àti sí ìtòlẹ́sẹẹsẹ àwọn agbègbè mẹ́tẹ̀ẹ̀ta. Síbẹ̀, ‘àwọn ará Jerúsálẹ́mù, gbogbo Jùdíà’ dá ènìyàn pọ̀ mọ́ agbègbè gẹ́gẹ́ bí àwọn kókó-ọrọ̀ tí ń rìn, ó sì lè jẹ́ kí ‘gbogbo Jùdíà’ dà bí pé ilẹ̀ náà fúnra rẹ̀ ni ń jáde. Fífi ‘àwọn ènìyàn láti’ hàn lẹ́ẹ̀kan ṣáájú àtòjọ àwọn ibi náà ń mú metonymy tí ó wà nínú Gíríìkì hàn ní Yorùbá láìyí ìwọ̀n ọ̀rọ̀ náà padà.
  naturalness: ‘Àwọn ènìyàn láti Jerúsálẹ́mù, láti gbogbo Jùdíà, àti láti gbogbo agbègbè tí ó yí Jọ́dánì ká’ jẹ́ Yorùbá òde òní tó rọrùn síi, ó sì jẹ́ kedere pé ènìyàn ni wọ́n ń jáde. A tún ṣe àtúnṣe kékeré sí àkọsílẹ̀ ìsàlẹ̀ kí ìsọ̀rọ̀ rẹ̀ lè rọrùn, kí ó sì má ṣe sọ pé ìtumọ̀ ìṣe tí ń ṣẹlẹ̀ léraléra jẹ́ ìtumọ̀ mìíràn tí ó yà sí ti ìṣe aláìparí.
  terminology: Àwọn orúkọ ibi náà—Jerúsálẹ́mù, Jùdíà, àti Jọ́dánì—wà ní ìlò Yorùbá tó bójú mu. ‘Àwọn ènìyàn láti’ jẹ́ ìmújáde metonymy tó yẹ; kò dín ‘gbogbo’ méjèèjì kù, bẹ́ẹ̀ ni kò sọ pé gbogbo olúkúlùkù ni ó lọ.
