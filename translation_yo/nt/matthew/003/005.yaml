  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: yo
  text: Nígbà náà, àwọn ènìyàn láti Jerúsálẹ́mù, láti gbogbo Jùdíà, àti láti gbogbo agbègbè tí ó yí Jọ́dánì ká ń jáde lọ bá a.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; a lè túmọ̀ ọ́ sí pé wọ́n máa ń jáde lọ bá a léraléra.
    reason: lexical_alternative
  - marker: b
    text: ‘Gbogbo Jùdíà’ àti ‘gbogbo agbègbè tí ó yí Jọ́dánì ká’ jẹ́ àpèjúwe agbègbè tó gbòòrò, tí ó fi hàn pé ọ̀pọ̀ ènìyàn láti àwọn agbègbè náà dáhùn sí iṣẹ́ Jòhánù; kò túmọ̀ sí pé olúkúlùkù ènìyàn ni ó dáhùn.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tó so ìṣẹ̀lẹ̀ yìí mọ́ iṣẹ́ ìránṣẹ́ Jòhánù tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ rẹ̀.
- source_word: ἐξεπορεύετο
  choice: ń jáde lọ
  rationale: Ìṣe aláìparí nínú Gíríìkì fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; ọ̀rọ̀ Yorùbá yìí pa ìtumọ̀ náà mọ́.
- source_word: πρὸς αὐτὸν
  choice: lọ bá a
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ìrìn, gbólóhùn náà túmọ̀ sí lílọ sí ọ̀dọ̀ ẹni kan; ‘lọ bá a’ jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: Ἱεροσόλυμα
  choice: àwọn ará Jerúsálẹ́mù
  rationale: Orúkọ ìlú ni ọ̀rọ̀ Gíríìkì, ṣùgbọ́n ìlú kò lè rìn jáde; bí ó ti wọ́pọ̀ nínú irú ọ̀rọ̀ yìí, ó dúró fún àwọn olùgbé rẹ̀.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: gbogbo Jùdíà
  rationale: Ó pa àpèjúwe gbogbo agbègbè náà mọ́ láìfi àlàyé àfikún sínú ẹsẹ̀.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: gbogbo agbègbè tí ó yí Jọ́dánì ká
  rationale: Ó tú περίχωρος sí Yorùbá àdánidá gẹ́gẹ́ bí agbègbè tó wà ní àyíká odò Jọ́dánì.
- source_word: καὶ ... καὶ
  choice: '..., àti ...'
  rationale: Ó pa ìṣọ̀kan àwọn ibi mẹ́tẹ̀ẹ̀ta mọ́ ní ìtòlẹ́sẹẹsẹ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n àwọn ènìyàn tí àwọn gbólóhùn ilẹ̀-ayé ‘gbogbo’ ń tọ́ka sí
  choice: Pa ‘gbogbo’ mọ́ gẹ́gẹ́ bí àpèjúwe ìdáhùn tó tàn káàkiri
  alternative: Ṣàlàyé rẹ̀ nínú ẹsẹ̀ gẹ́gẹ́ bí ‘ọ̀pọ̀ ènìyàn láti’ àwọn agbègbè náà
  rationale: πᾶσα fara hàn lẹ́ẹ̀mejì, nítorí náà ìtumọ̀ náà yẹ kí ó pa agbára ọ̀rọ̀ orísun mọ́; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé kò pọn dandan kó túmọ̀ sí olúkúlùkù ènìyàn.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn ará Jerúsálẹ́mù’ láti mú metonymy orúkọ ìlú náà ṣe kedere ní Yorùbá, a sì lo ‘ń jáde lọ’ láti pa ìṣe aláìparí orísun mọ́.
