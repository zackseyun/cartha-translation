  to: Ṣùgbọ́n nígbà tí ó rí ọ̀pọ̀ lára àwọn Farisí àti Sadusí tí wọ́n ń bọ̀ wá sí ìbatisí rẹ̀, ó sọ fún wọn pé, “Ẹ̀yin ọmọ ejò paramọ́lẹ̀[a], ta ni ó kìlọ̀ fún yín pé kí ẹ sá kúrò lọ́wọ́ ìbínú tí ń bọ̀[b]?”
