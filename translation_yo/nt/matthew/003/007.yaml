id: MAT.3.7
reference: Matthew 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó rí ọ̀pọ̀ lára àwọn Farisí àti Sadusí tí wọ́n ń bọ̀ wá sí ìbatisí rẹ̀, ó sọ fún wọn pé, “Ẹ̀yin ọmọ ejò paramọ́lẹ̀[a], ta ni ó kìlọ̀ fún yín pé kí ẹ sá kúrò lọ́wọ́ ìbínú tí ń bọ̀[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “Ẹ̀yin irú-ọmọ ejò paramọ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú u sí “ìbínú tí yóò dé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Ṣùgbọ́n nígbà tí ó rí
  rationale: A tú ọ̀rọ̀-àbọ̀ aorist náà sí gbólóhùn àsìkò tí ó bá Yorùbá mu, nígbà tí “Ṣùgbọ́n” ń pa ìyípadà kékeré tí δέ mú wá mọ́.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ọ̀pọ̀ lára àwọn Farisí àti Sadusí
  rationale: '“Lára” fi ìtumọ̀ partitive hàn: ọ̀pọ̀ nínú wọn ni Jòhánù rí, kì í ṣe dandan gbogbo ẹgbẹ́ méjèèjì.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: tí wọ́n ń bọ̀ wá sí ibi ìbatisí rẹ̀
  rationale: Èyí pa ìṣípò síbi iṣẹ́ ìbatisí Jòhánù mọ́ láì fi kún un pé ó dájú pé wọ́n wá kí òun batisí wọn.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Ẹ̀yin ọmọ paramọ́lẹ̀
  rationale: “Ọmọ” ṣàfihàn ohun tí a bí tàbí irú-ọmọ, “paramọ́lẹ̀” sì pa àwòrán ejò olóró inú ἐχιδνῶν mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ta ni ó kìlọ̀ fún yín
  rationale: Nínú ọ̀rọ̀ nípa sísá fún ìbínú, ὑποδείκνυμι ní agbára ìkìlọ̀, kì í ṣe fífi ohun kan hàn lásán.
- source_word: φυγεῖν ἀπὸ
  choice: kí ẹ sá kúrò lọ́wọ́
  rationale: “Sá kúrò lọ́wọ́” pa àwòrán ìsá àsálà àti jíjìnnà sí ewu mọ́ ní Yorùbá àdánidá.
- source_word: τῆς μελλούσης ὀργῆς
  choice: ìbínú tí ń bọ̀
  rationale: “Ìbínú” pa agbára ὀργή mọ́, “tí ń bọ̀” sì ṣàfihàn ohun tó ń dé tàbí tó wà níwájú láì sọ àkókò rẹ̀ di pàtó ju orísun lọ.
theological_decisions:
- issue: Àwọn tí Jòhánù ń bá wí
  choice: Ọ̀pọ̀ lára àwọn Farisí àti Sadusí tí ó wà níbẹ̀ ni ọ̀rọ̀ náà tọ́ka sí.
  alternative: Gbogbo Farisí àti Sadusí lápapọ̀ ni ọ̀rọ̀ náà dá lẹ́bi.
  rationale: Ìkọ̀lé partitive πολλοὺς τῶν… tọ́ka sí apá kan lára àwọn ẹgbẹ́ náà; ìtumọ̀ kò gbọ́dọ̀ gbòòrò ju èdè Gíríìkì lọ.
- issue: Agbára ọ̀rọ̀ ὀργή nípa ohun tó ń bọ̀
  choice: ìbínú
  alternative: ìdájọ́ tàbí ìjìyà
  rationale: “Ìbínú” pa ìwúwo ọ̀rọ̀ náà àti agbára rẹ̀ nípa ìṣe Ọlọ́run mọ́, láì sọ ọ́ di ìdájọ́ tàbí ìjìyà nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “ìbatisí” gẹ́gẹ́ bí ọ̀rọ̀ tó mọ́gbọ́n dání láì fi àlàyé ẹ̀kọ́ ìjọ kan sí i. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé; èyí tún àìbáramu ibi tí àwọn àmì náà wà nínú àkójọ ìmọ̀ràn Gẹ̀ẹ́sì ṣe.
