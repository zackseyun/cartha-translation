id: MAT.3.9
reference: Matthew 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: yo
  text: Ẹ má sì ṣe rò nínú ara yín[a] pé, ‘Ábúráhámù ni baba wa,’ nítorí mo sọ fún yín pé Ọlọ́run lè gbé àwọn ọmọ dìde fún Ábúráhámù láti inú àwọn òkúta wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘láàárín ara yín.’ Gbólóhùn Gíríìkì náà lè tọ́ka sí ohun tí olúkúlùkù ń sọ nínú ọkàn rẹ̀ tàbí ohun tí wọ́n ń sọ láàárín ara wọn gẹ́gẹ́ bí ẹgbẹ́ kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: Ẹ má sì ṣe rò
  rationale: Àṣẹ ìkìlọ̀ yìí kò túmọ̀ sí ìrònú lásán; ó kìlọ̀ fún wọn pé kí wọ́n má ṣe gba èrò àṣìṣe tí wọ́n fi ń dá ara wọn lójú. ‘Ẹ má sì ṣe rò’ jẹ́ èdè Yorùbá àdánidá, ó sì lè ru ìtumọ̀ ìgbẹ́kẹ̀lé aláìlẹ́tọ̀ọ́ ní àyíká ọ̀rọ̀ náà.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: láti sọ láàárín ara yín
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ inú ọkàn tàbí ohun tí ẹgbẹ́ náà ń sọ láàárín ara wọn. A pa ìtumọ̀ méjèèjì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Àbúrámù ni baba wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtẹnumọ́ wọn mọ́ pé ìran Àbúrámù ni wọ́n, láìfi ẹ̀kọ́ ìsìn míì kún un.
- source_word: λέγω γὰρ ὑμῖν
  choice: nítorí mo sọ fún yín pé
  rationale: Ó pa ipa ìṣàlàyé γάρ àti ọ̀nà ọ̀rọ̀ taara náà mọ́ ní Yorùbá tó ṣe kedere.
- source_word: δύναται ὁ θεὸς
  choice: Ọlọ́run lè
  rationale: ‘Lè’ sọ agbára tàbí ohun tí ó ṣeé ṣe fún Ọlọ́run ní ṣókí àti ní àdánidá.
- source_word: ἐκ τῶν λίθων τούτων
  choice: láti inú àwọn òkúta wọ̀nyí
  rationale: Ó pa àwòrán orísun tí ἐκ ń fi hàn mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó mọ́gbọ́n dání.
- source_word: ἐγεῖραι
  choice: gbé ... dìde
  rationale: 'Yíyan yìí pa agbára ọ̀rọ̀ Gíríìkì mọ́: Ọlọ́run lè mú àwọn ọmọ wá tàbí gbé wọn kalẹ̀ fún Àbúrámù. Kò sọ ọ́ di àjíǹde nínú ẹsẹ yìí.'
- source_word: τέκνα τῷ Ἀβραάμ
  choice: àwọn ọmọ ... fún Àbúrámù
  rationale: ‘Àwọn ọmọ’ kò dá akọ tàbí abo sí, ‘fún Àbúrámù’ sì fi ìbáṣepọ̀ wọn gẹ́gẹ́ bí ọmọ tàbí ìran rẹ̀ hàn.
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ ìran Àbúrámù nínú ìkìlọ̀ Jòhánù
  choice: Ẹsẹ náà kọ ìgbẹ́kẹ̀lé pé jíjẹ́ ọmọ ìran Àbúrámù nìkan tó láti mú ènìyàn dúró ní rere níwájú Ọlọ́run.
  alternative: Kí a ka ọ̀rọ̀ náà sí àsọdùn lásán, tàbí kí a sọ pé ó sẹ́ Israẹli gẹ́gẹ́ bí ìran Àbúrámù.
  rationale: Ọ̀rọ̀ náà bá ìgbẹ́kẹ̀lé wọn nínú ìran wọn wí, ṣùgbọ́n kò sẹ́ ìbáṣepọ̀ Àbúrámù pẹ̀lú Israẹli, bẹ́ẹ̀ ni kò sọ ẹ̀kọ́ nípa rirọ́pò Israẹli.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo ọ̀pọ̀ ènìyàn ‘ẹ/yín’ gẹ́gẹ́ bí orísun ṣe ń bá ẹgbẹ́ kan sọ̀rọ̀. A kọ Àbúrámù ní fọ́ọ̀mù Yorùbá tí ó wọ́pọ̀, a sì fi àmì ohùn sí ibi tí ó yẹ.
