id: MAT.3.1
reference: Matthew 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: yo
  text: Ní àwọn ọjọ́ wọ̀nyẹn, Johanu ẹni tí ń ṣe ìrìbọmi dé, ó sì ń wàásù ní aginjù Jùdíà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: Ní àwọn ọjọ́ wọnnì
  rationale: Ó túmọ̀ gbólóhùn àkókò náà ní tààrà; a kò fi δέ hàn lọ́tọ̀ nítorí pé ó jẹ́ àsopọ̀ ìtàn tó rọ̀, tí ìṣàn ọ̀rọ̀ Yorùbá sì ti mú jáde ní ti ẹ̀dá.
- source_word: παραγίνεται
  choice: dé
  rationale: Ọ̀rọ̀ náà jẹ́ historical present nínú Gíríìkì, ṣùgbọ́n ‘dé’ jẹ́ ọ̀nà àdánidá láti sọ ìwọlé ẹni tuntun sínú ìtàn ní Yorùbá, láìmọ̀ọ́mọ̀ fi ìfarahàn àrà ọ̀tọ̀ kún un.
- source_word: Ἰωάννης
  choice: Johanu
  rationale: A lo ìrísí orúkọ Bíbélì tó ti wọ́pọ̀, tó sì ṣeé mọ̀ ní Yorùbá.
- source_word: ὁ βαπτιστὴς
  choice: Onítẹ̀bọmi
  rationale: Ó jẹ́ àkọlé tó ń dá Johanu mọ̀ gẹ́gẹ́ bí ẹni tó ń ṣe ìtẹ̀bọmi; ó yàgò fún mímú orúkọ ẹ̀sìn ìgbà òde wọ inú ọ̀rọ̀ náà.
- source_word: κηρύσσων
  choice: ó sì ń wàásù
  rationale: Ó fi hàn pé iṣẹ́ ìkéde náà ń lọ nígbà tí Johanu dé; ‘wàásù’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ìkéde ní gbangba.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: ní aginjù Judea
  rationale: ‘Aginjù’ ń tọ́ka sí ilẹ̀ ahoro tàbí ibi tí ènìyàn kò pọ̀ sí, láìfi dandan túmọ̀ sí aṣálẹ̀ oníyanrìn; Judea ni agbègbè ilẹ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ àkọlé βαπτιστής
  choice: Onítẹ̀bọmi
  alternative: Ẹni tó ń tẹni bọmi
  rationale: ‘Onítẹ̀bọmi’ jẹ́ àkọlé Yorùbá tó ṣókí, tó sì ṣe kedere pé iṣẹ́ Johanu ni baptisi àwọn ènìyàn; kì í ṣe orúkọ ẹ̀ka ìjọ kan nínú àyíká yìí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èdè tó ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tó yẹ. Ìtumọ̀ náà pa ìṣàn ìtàn mọ́, kò sì fi ẹ̀kọ́ ẹ̀sìn tí kò sí nínú orísun kún un.
