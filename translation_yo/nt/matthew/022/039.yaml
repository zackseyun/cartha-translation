  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: yo
  text: 'Èkejì sì dàbí èyí: “Ìwọ yóò fẹ́ràn aládùúgbò rẹ gẹ́gẹ́ bí ara rẹ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àṣẹ kejì sì dàbí èyí.”
    reason: “Èkejì” dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ; “àṣẹ” jẹ́ ohun tí àyíká ọ̀rọ̀ mú ká lóye, ṣùgbọ́n kò fara hàn nínú Gíríìkì.
lexical_decisions:
- source_word: Δευτέρα
  choice: Èkejì
  rationale: Ọ̀rọ̀ àpèjúwe onípò yìí dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ, ó sì ń tọ́ka sí àṣẹ kejì. “Èkejì” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì lè pa ìtumọ̀ náà mọ́ láìfi àfikún tí kò sí nínú Gíríìkì kún un.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tó ń tẹ ọ̀rọ̀ náà síwájú, kì í ṣe àmì ìtakò líle. “Sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: ὁμοία αὐτῇ
  choice: dàbí rẹ̀
  rationale: ὁμοία pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ inú ipò dative túmọ̀ sí ohun tó dàbí èyí tí a ṣẹ̀ṣẹ̀ sọ, ìyẹn àṣẹ àkọ́kọ́.
- source_word: Ἀγαπήσεις
  choice: Ìwọ yóò fẹ́
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú yìí ní agbára àṣẹ nínú àyọlò Ìwé Mímọ́. “Ìwọ yóò fẹ́” pa ìrísí ọjọ́ iwájú àti ohùn àṣẹ inú àyọlò náà mọ́.
- source_word: τὸν πλησίον σου
  choice: aládùúgbò rẹ
  rationale: Gbólóhùn Gíríìkì yìí túmọ̀ sí ẹni kejì rẹ tàbí aládùúgbò rẹ, kì í ṣe kìkì ẹni tó wà nítòsí nípa ibi. “Aládùúgbò” ni ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún ìtumọ̀ náà.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó ń fi òṣùwọ̀n ìfiwéra hàn; “gẹ́gẹ́ bí” jẹ́ ọ̀nà Yorùbá tó péye àti tó ṣe déédéé.
- source_word: σεαυτόν
  choice: ara rẹ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ afẹ̀yìntì yìí ń tọ́ka padà sí ẹni tí a ń bá sọ̀rọ̀. “Ara rẹ” ni ìtumọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ àṣẹ kejì pẹ̀lú àṣẹ àkọ́kọ́
  choice: Èkejì sì dàbí rẹ̀
  alternative: Àṣẹ kejì sì dàbí rẹ̀; Èkejì sì jọ ọ́
  rationale: Ìtumọ̀ yìí pa ìfiwéra Gíríìkì mọ́ pé àṣẹ kejì dàbí àkọ́kọ́, láìsọ pé àwọn méjèèjì di àṣẹ kan náà tàbí láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye lójoojúmọ́. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ohùn àṣẹ tí ó dà bí ọjọ́ iwájú mọ́.
