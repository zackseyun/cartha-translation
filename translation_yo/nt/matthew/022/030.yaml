id: MAT.22.30
reference: Matthew 22:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: yo
  text: Nítorí ní àjíǹde, wọn kì í gbéyàwó, bẹ́ẹ̀ ni a kì í fún wọn ní ìgbéyàwó; ṣùgbọ́n wọn dàbí àwọn áńgẹ́lì Ọlọ́run ní ọ̀run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: ní àjíǹde
  rationale: Ó lè tọ́ka sí àkókò tàbí ipò ìyè lẹ́yìn àjíǹde. Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa àìdánilójú yẹn mọ́ láìfi ìtumọ̀ kan ṣoṣo múlẹ̀.
- source_word: γαμοῦσιν
  choice: wọn kì í gbéyàwó
  rationale: ‘Gbéyàwó’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún wíwọ inú ìgbéyàwó; nínú gbólóhùn yìí, ‘wọn’ jẹ́ kí ó kan gbogbo àwọn tí a jí dìde láìfi akọ nìkan hàn.
- source_word: γαμίζονται
  choice: a kì í fi wọn fúnni ní ìgbéyàwó
  rationale: Ìtumọ̀ yìí pa ìṣe aláìṣe-tààrà inú ọ̀rọ̀ Gíríìkì mọ́, ó sì yà á sọ́tọ̀ kúrò nínú ‘gbọ́yàwó,’ bí orísun ṣe ṣe.
- source_word: ὡς
  choice: dàbí
  rationale: ‘Dàbí’ fi ìfiwéra hàn, kì í sì í sọ pé àwọn ènìyàn tí a jí dìde di áńgẹ́lì.
- source_word: ἄγγελοι θεοῦ
  choice: àwọn áńgẹ́lì Ọlọ́run
  rationale: Ó ṣàfihàn θεοῦ ní kíkún, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe déédéé àti tó níyì.
- source_word: ἐν τῷ οὐρανῷ
  choice: ní ọ̀run
  rationale: Ní àyíká yìí, οὐρανός túmọ̀ sí ibùgbé ọ̀run, kì í ṣe ojú sánmà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Irú ìfiwéra pẹ̀lú àwọn áńgẹ́lì
  choice: Àwọn tí a jí dìde dàbí àwọn áńgẹ́lì ní ti pé wọn kì í ṣe ìgbéyàwó.
  alternative: A lè na ìfiwéra náà sí i láti túmọ̀ sí pé wọ́n ní gbogbo irú ìwàláàyè áńgẹ́lì tàbí pé wọ́n di áńgẹ́lì.
  rationale: ὡς jẹ́ àmì ìfiwéra, àyíká tó sún mọ́ ọn sì ń sọ nípa àìsí ìgbéyàwó. ‘Dàbí’ pa ìfiwéra mọ́ láìsọ ìṣọ̀kan irú-ẹ̀dá.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó níyì, tó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. A kò fi àlàyé ìsìn ẹ̀ya kan kún ọ̀rọ̀ náà.
