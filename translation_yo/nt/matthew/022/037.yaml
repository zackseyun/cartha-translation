reference: Matthew 22:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: yo
  text: Ó sì wí fún un pé, “Ìwọ yóò nífẹ̀ẹ́ Olúwa Ọlọ́run rẹ pẹ̀lú gbogbo ọkàn rẹ, àti pẹ̀lú gbogbo ẹ̀mí rẹ[a], àti pẹ̀lú gbogbo èrò inú rẹ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ψυχή tún lè túmọ̀ sí “ìyè” tàbí “ara ẹni” ní àwọn àyíká míì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “gbogbo òye rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Àsopọ̀ fífẹ́ ni δέ níbí, ó ń tẹ ìjíròrò náà síwájú láìfi ìtakora líle hàn.
- source_word: ἔφη αὐτῷ
  choice: wí fún un
  rationale: Ó túmọ̀ gbolohun ìṣáájú ọ̀rọ̀ tààrà lọ́nà kedere, láìfi ìtumọ̀ ‘dáhùn’ kún un.
- source_word: Ἀγαπήσεις
  choice: Ìwọ yóò nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ nínú àyọlò láti inú Diutarónómì; ìtumọ̀ yìí pa ìrísí àyọlò àti agbára àṣẹ rẹ̀ mọ́.
- source_word: κύριον τὸν θεόν σου
  choice: Olúwa Ọlọ́run rẹ
  rationale: ‘Olúwa’ ni ìtumọ̀ boṣewa fún κύριος, gbolohun náà sì pa ìró májẹ̀mú àyọlò náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: pẹ̀lú gbogbo ọkàn rẹ
  rationale: ‘Pẹ̀lú’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ἐν hàn nínú àṣẹ yìí, ‘ọkàn’ sì dúró fún inú ènìyàn, ìfẹ́ àti ìpinnu rẹ̀.
- source_word: ψυχῇ
  choice: ọkàn
  rationale: ψυχή lè túmọ̀ sí ẹ̀mí, ìyè, tàbí gbogbo ara ẹni. ‘Ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá ní àyíká yìí, bí ó tilẹ̀ jẹ́ pé ó bá καρδία pàdé ní ọ̀rọ̀ kan náà; àlàyé ìsàlẹ̀ ṣí ìyàtọ̀ orísun náà sílẹ̀.
- source_word: διανοίᾳ
  choice: èrò inú
  rationale: Ó fi agbára ìrònú àti òye hàn ní Yorùbá tí ó ṣe kedere, láìdín un kù sí ìmọ̀ nìkan.
theological_decisions:
- issue: Àyọlò àṣẹ ńlá láti inú Diutarónómì
  choice: 'Pa ìtẹ̀lé mẹ́ta náà mọ́: ọkàn, ψυχή, àti èrò inú'
  alternative: Kó gbogbo wọn jọ sínú àkótán bí ‘pẹ̀lú gbogbo ìwàláàyè rẹ’
  rationale: Ìtẹ̀lé mẹ́ta inú Gíríìkì yẹ kí ó dúró, kí ìwọ̀n gbooro ti ìfẹ́ sí Ọlọ́run àti ìfarahàn ọ̀kọ̀ọ̀kan àwọn ọ̀rọ̀ náà má bàa sọnù.
- issue: Ìṣòro pé καρδία àti ψυχή lè jẹ́ ‘ọkàn’ ní Yorùbá
  choice: Lo ‘ọkàn’ fún méjèèjì, kí àlàyé ìsàlẹ̀ fi ìyàtọ̀ Gíríìkì hàn
  alternative: Lo ‘ẹ̀mí’ fún ψυχή
  rationale: ‘Ẹ̀mí’ lè mú kí òǹkàwé rántí πνεῦμα tàbí apá kan tí a yà sọ́tọ̀ kúrò lára ènìyàn. ‘Ọkàn’ jẹ́ àdánidá, àlàyé sì pa àìdájú àti ìyàtọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè tí ó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán àṣẹ ọjọ́ iwájú mọ́, a sì yàgò fún lílo ‘ẹ̀mí’ fún ψυχή nítorí ìdàrúdàpọ̀ tó lè dá sílẹ̀ pẹ̀lú πνεῦμα.
