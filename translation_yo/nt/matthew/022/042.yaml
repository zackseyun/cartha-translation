  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: «ó ní pé» ń gbé λέγων wọlé lọ́nà ìtàn tí ó yẹ; «Kí ni èrò yín» ń mú Τί ὑμῖν δοκεῖ; «nípa Mèsáyà» ń ṣe περὶ τοῦ χριστοῦ; «Ọmọ ta ni?» ń pa ìbéèrè ìran τίνος υἱός ἐστιν mọ́; «Wọ́n dá a lóhùn pé» sì ń ṣàfihàn λέγουσιν αὐτῷ. «Ọmọ Dáfídì ni» jẹ́ àfikún Yorùbá tó pọndandan láti mú èsì ellipitiki Τοῦ Δαυίδ hàn gbangba, láì yí ìtumọ̀ padà.'
