  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: yo
  text: ó ní pé, “Kí ni èrò yín nípa Mèsáyà[a]? Ọmọ ta ni?” Wọ́n dá a lóhùn pé, “Ọmọ Dáfídì ni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Χριστός (Christos), tí a lò níbí gẹ́gẹ́ bí oyè Mèsáyà.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ó ní pé
  rationale: Ọ̀rọ̀ yìí jẹ́ participle tí ó ń ṣí ọ̀rọ̀ Jésù sílẹ̀; ‘ó ní pé’ jẹ́ ọ̀nà àdánidá nínú Yorùbá láti tẹ̀ síwájú nínú ìtàn.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Kí ni èrò yín
  rationale: Ó béèrè fún ìdájọ́ tàbí èrò àwọn olùgbọ́; gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: περὶ τοῦ χριστοῦ
  choice: nípa Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run fi òróró yàn ní àyíká ìjíròrò yìí, kì í ṣe orúkọ àdáni.
- source_word: τίνος υἱός ἐστιν
  choice: Ọmọ ta ni?
  rationale: Ìbéèrè kúkúrú yìí pa ìtumọ̀ ìran tàbí ìdílé mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: λέγουσιν αὐτῷ
  choice: Wọ́n dá a lóhùn pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present, Yorùbá ìtàn máa ń lo ìṣe tí ó ti ṣẹlẹ̀; ‘dá a lóhùn’ tún fi hàn pé èsì sí ìbéèrè ni.
- source_word: Τοῦ Δαυίδ
  choice: Ọmọ Dáfídì ni
  rationale: Gíríìkì fi ọ̀rọ̀ ‘ọmọ’ sílẹ̀ nítorí pé a ti sọ ọ́ nínú ìbéèrè; Yorùbá nílò àtúnkún rẹ̀ fún èsì tí ó mọ́gbọ́n dání.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, ọ̀rọ̀ náà jẹ́ oyè Mèsáyà nínú àríyànjiyàn Júù nípa ẹni tí a retí, kì í ṣe lílò rẹ̀ bí orúkọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn láti lóye.
