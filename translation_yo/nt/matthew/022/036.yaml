    issue: The main rendering “ó tóbi” does not naturally convey the ranking sense of the question in Yoruba.
    rationale: The immediate context concerns identifying the commandment of primary importance. “Ó tóbi jù lọ” avoids an unintended physical-size reading and accords with the English audit trail’s contextual rendering “greatest.”
  - severity: low
