review_pass:
  verdict: revise
  source_fidelity: Διδάσκαλε is accurately rendered “Olùkọ́”; ἐντολή and ἐν τῷ νόμῳ are well represented by “àṣẹ” and “nínú Òfin.” Although μεγάλη is formally positive, in this interrogative setting it asks for the commandment of highest rank. Rendering it with the Yoruba superlative communicates the contextual force without introducing a doctrinal claim; the literal/formal-positive nuance can be retained in a note.
  naturalness: “Àṣẹ wo ni ó tóbi?” is grammatically understandable, but it is less idiomatic for asking which commandment is preeminent and can suggest physical size. “Àṣẹ wo ló tóbi jù lọ” is natural, clear Standard Yoruba.
  terminology: “Olùkọ́,” “àṣẹ,” and capitalized “Òfin” are appropriate, respectful, and consistent with the Jewish-scriptural referent. Tone marks and the focus form “ló” are correctly supplied in the revision.
  issues:
