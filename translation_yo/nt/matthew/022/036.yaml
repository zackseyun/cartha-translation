  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: yo
  text: “Olùkọ́, àṣẹ wo ló tóbi jù lọ nínú Òfin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ọ̀rọ̀ ìpè ní tààrà sí Jésù ni; “Olùkọ́” ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ẹni tó ń kọ́ni.
- source_word: ποία
  choice: wo ni
  rationale: Ó ń béèrè pé kí a dá ọ̀kan mọ̀ lára àwọn àṣẹ inú Òfin; “wo ni” jẹ́ ọ̀nà àdánidá láti béèrè èyí ní Yorùbá.
- source_word: ἐντολὴ
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a pàṣẹ, ó sì bá àyíká Òfin Mósè mu.
- source_word: μεγάλη
  choice: ó tóbi
  rationale: Adájẹ náà wà ní ìpele rere, kì í ṣe ní ìpele gíga jù lọ ní ìrísí Gíríìkì. “Ó tóbi” pa ìrísí yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìfiwéra tó ṣeé ṣe hàn.
- source_word: ἐν τῷ νόμῳ
  choice: nínú Òfin
  rationale: Níhìn-ín, νόμος ń tọ́ka sí Òfin/Tórà àwọn Júù; lílo lẹ́tà ńlá fún “Òfin” mú ìtọ́kasí pàtó yìí hàn.
theological_decisions:
- issue: Bóyá a ó tú μεγάλη sí ìpele gíga jù lọ
  choice: ó tóbi
  alternative: ó tóbi jù lọ
  rationale: Gíríìkì lo adájẹ ìpele rere μεγάλη, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ lè mú un túmọ̀ sí ipò àkọ́kọ́ lára àwọn àṣẹ. Ọ̀rọ̀ àkọ́kọ́ pa ìfarahàn orísun mọ́; àlàyé ìsàlẹ̀ sì pa ìtumọ̀ kejì mọ́ láìfi tipátipá yanju àìdájú náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tó sì ṣeé lóye ni a lò. A fi àmì ohùn síbi tó yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
