id: MAT.22.13
reference: Matthew 22:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: yo
  text: Nígbà náà ni ọba sọ fún àwọn ìránṣẹ́ náà pé, “Ẹ di ẹsẹ̀ rẹ̀ àti ọwọ́ rẹ̀, kí ẹ sì jù ú sínú òkùnkùn tí ó wà ní ìta. Ibẹ̀ ni ẹkún àti ìpayínkeke eyín yóò wà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn ní ọ̀nà àdánidá nínú ìtàn Yorùbá.
- source_word: ὁ βασιλεὺς
  choice: ọba
  rationale: Ó pa àwòrán ipò ọba nínú òwe náà mọ́ ní tààràtà.
- source_word: τοῖς διακόνοις
  choice: fún àwọn olùrànṣẹ́ náà
  rationale: Nínú àyíká àsè ọba, ọ̀rọ̀ yìí tọ́ka sí àwọn tó ń ṣe iṣẹ́ fún ọba; ‘olùrànṣẹ́’ yẹra fún ìtumọ̀ ipò ìjọ kan pàtó.
- source_word: Δήσαντες
  choice: Ẹ di
  rationale: A túmọ̀ participle aorist náà gẹ́gẹ́ bí àṣẹ tó ṣáájú àṣẹ pàtàkì, ní èdè Yorùbá tó ṣe kedere.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: ẹsẹ̀ àti ọwọ́ rẹ̀
  rationale: Ó pa bí ọ̀rọ̀ Gíríìkì ṣe tò ó—ẹsẹ̀ ṣáájú ọwọ́—mọ́.
- source_word: ἐκβάλετε αὐτὸν
  choice: kí ẹ sì jù ú sí
  rationale: Ó fi agbára ìléjáde náà hàn ní èdè Yorùbá òde òní, láì sọ ọ́ di àlàyé ẹ̀kọ́ ìgbàgbọ́.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: sí òkùnkùn ìta
  rationale: Ó pa gbólóhùn àkànṣe Mátíù àti àwòrán òkùnkùn tó wà lóde mọ́.
- source_word: ἐκεῖ
  choice: Ibẹ̀
  rationale: Ó fi ibi náà hàn ní kedere, ó sì jẹ́ ọ̀nà àdánidá láti sọ locative náà ní Yorùbá.
- source_word: ὁ κλαυθμὸς
  choice: ẹkún
  rationale: ‘Ẹkún’ jẹ́ ìtumọ̀ kedere, tí ó sì bá àyíká ìbànújẹ́ àti ìdájọ́ mu.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ìpayínkeke
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún fífi eyín kán ara wọn nínú ìrora, ìbínú, tàbí ìdààmú; kò pinnu èwo nínú wọn nìkan.
theological_decisions:
- issue: Irú ìyọkúrò tí àwòrán inú òwe náà ń tọ́ka sí
  choice: Pa àwòrán gidi náà mọ́ pé a jù ú sí ‘òkùnkùn ìta,’ láì fi orúkọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
  alternative: Túmọ̀ ọ́ ní tààràtà sí ọ̀run àpáàdì tàbí dín in kù sí yíyọ ẹni náà kúrò níbi àsè nìkan.
  rationale: Ẹsẹ̀ náà lo àwòrán ìdájọ́ tó lágbára nínú òwe, ṣùgbọ́n kò sọ ní pàtó pé ‘ọ̀run àpáàdì’; ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, àti òde òní. A lo ọ̀pọ̀ àṣẹ ‘Ẹ’ nítorí ọba ń bá àwọn olùrànṣẹ́ púpọ̀ sọ̀rọ̀.
