revisions:
- from: Nígbà náà ni ọba sọ fún àwọn olùrànṣẹ́ náà pé, “Ẹ di ẹsẹ̀ àti ọwọ́ rẹ̀, kí ẹ sì jù ú sí òkùnkùn ìta. Ibẹ̀ ni ẹkún àti ìpayínkeke yóò wà.”
  to: Nígbà náà ni ọba sọ fún àwọn ìránṣẹ́ náà pé, “Ẹ di ẹsẹ̀ rẹ̀ àti ọwọ́ rẹ̀, kí ẹ sì jù ú sínú òkùnkùn tí ó wà ní ìta. Ibẹ̀ ni ẹkún àti ìpayínkeke eyín yóò wà.”
  rationale: The revision replaces a messenger-oriented term with the contextually appropriate term for the king’s servants, explicitly translates “of teeth,” and clarifies the spatial force of “outer darkness.” It retains the source order “feet and hands,” the plural commands, and the deliberately uninterpreted exclusion-and-judgment imagery. Footnote a preserves the attendants/servants lexical range without introducing ecclesial terminology.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the temporal sequence, royal speaker, plural addressees, imperative force, Greek order “feet and hands,” expulsion, and future statement. However, “olùrànṣẹ́” normally denotes one who is sent—a messenger or envoy—rather than the king’s serving staff in this banquet context. The rendering of βρυγμὸς τῶν ὀδόντων also needs an explicit reference to teeth; “ìpayínkeke” by itself does not fully represent the Greek expression.
  naturalness: The revised wording is natural, formal-modern Standard Yoruba, and retains the parable’s vivid but uninterpreted judgment imagery. “Òkùnkùn tí ó wà ní ìta” makes the spatial sense of “outer darkness” clearer than the potentially compressed “òkùnkùn ìta.”
  terminology: “Àwọn ìránṣẹ́” is the appropriate unmarked term for servants/attendants here and avoids the messenger sense of “olùrànṣẹ́.” “Ìpayínkeke eyín” preserves the established expression “gnashing of teeth” without deciding whether its emotional nuance is grief, rage, or both.
  issues:
  - severity: medium
    issue: “Olùrànṣẹ́” is not the best contextual equivalent for τοῖς διακόνοις.
    rationale: In Standard Yoruba it commonly means a messenger, emissary, or person sent on an errand. The Greek refers in this parable setting to those who serve the king; “àwọn ìránṣẹ́” is more accurate.
  - severity: medium
    issue: “Ìpayínkeke” omits “eyín” (teeth).
    rationale: The Greek explicitly has βρυγμὸς τῶν ὀδόντων, “gnashing of teeth.” Adding “eyín” preserves the full idiom and source detail.
  - severity: low
    issue: “Òkùnkùn ìta” can sound compressed or adjectivally ambiguous.
    rationale: “Òkùnkùn tí ó wà ní ìta” clearly conveys darkness outside/outer darkness while preserving the Matthean image.
  revised_text: Nígbà náà ni ọba sọ fún àwọn ìránṣẹ́ náà pé, “Ẹ di ẹsẹ̀ rẹ̀ àti ọwọ́ rẹ̀, kí ẹ sì jù ú sínú òkùnkùn tí ó wà ní ìta. Ibẹ̀ ni ẹkún àti ìpayínkeke eyín yóò wà.”
  revised_footnotes:
  - marker: a
    text: Tàbí, “àwọn olùrànlọ́wọ́.”
    reason: lexical_alternative
  revision_rationale: The revision replaces a messenger-oriented term with the contextually appropriate term for the king’s servants, explicitly translates “of teeth,” and clarifies the spatial force of “outer darkness.” It retains the source order “feet and hands,” the plural commands, and the deliberately uninterpreted exclusion-and-judgment imagery. Footnote a preserves the attendants/servants lexical range without introducing ecclesial terminology.
