  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì pàtàkì náà ní pàtàkì: Dáfídì ni kókó-ọrọ̀, ‘nínú Ẹ̀mí’ ń ṣàlàyé bí ó ṣe ń pè é, ‘Olúwa’ sì bójú mu fún κύριον. Ṣùgbọ́n ‘Èé ṣe nígbà náà tí ... fi pe’ kò fi ìbéèrè Πῶς οὖν hàn ní ọ̀nà Yorùbá tó rọrùn jù, ó sì lè dà bí ìbéèrè ìdí (‘why’) dípò ìbéèrè ọ̀nà (‘how’).'
