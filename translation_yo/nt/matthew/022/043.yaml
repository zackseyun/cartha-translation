  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: yo
  text: Ó sọ fún wọn pé, “Ní báyìí, báwo ni Dáfídì ṣe ń pè é ní Olúwa nínú Ẹ̀mí[a], nígbà tí ó ń wí pé,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Ẹ̀mí.” Gbólóhùn Gíríìkì náà lè fi ààyè tàbí ọ̀nà tí a fi ṣe nǹkan hàn; “nínú Ẹ̀mí” tẹ̀ lé ọ̀rọ̀ rẹ̀ pẹ́kípẹ́kí jù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀gá.” Ọ̀rọ̀ Gíríìkì náà ni κύριος, tí a sábà máa ń túmọ̀ sí “Olúwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ó sọ fún wọn pé
  rationale: Ọ̀rọ̀ ìṣe ìsinsìnyí Gíríìkì jẹ́ ìsinsìnyí ìtàn; lílo àkókò tí ó ti kọjá bá ìtàn Yorùbá mu lọ́nà àdánidá.
- source_word: Πῶς οὖν
  choice: Èé ṣe nígbà náà
  rationale: Ó pa agbára ìbéèrè πῶς àti ìtumọ̀ ìtẹ̀síwájú tàbí àbájáde inú οὖν mọ́.
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: ἐν πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì, ó sì lè tọ́ka sí ààyè tàbí ipa tí Ẹ̀mí fi mú Dáfídì sọ̀rọ̀.
- source_word: καλεῖ αὐτὸν κύριον
  choice: fi pe e ní Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ κύριος gẹ́gẹ́ bí oyè mọ́, ó sì dáàbò bo ìsopọ̀ ọ̀rọ̀ náà pẹ̀lú Sáàmù 110.
- source_word: λέγων
  choice: pé
  rationale: Ní Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ àyọlò tí ó tẹ̀ lé, láìfi àlàyé kún un.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí’ nínú ἐν πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí Dáfídì fúnra rẹ̀ tàbí ipò tẹ̀mí rẹ̀
  rationale: Nínú ọ̀rọ̀ yìí, Jésù ń tọ́ka sí ọ̀rọ̀ Ìwé Mímọ́ tí a mí sí; ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú gírámà mọ́.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: ọ̀gá
  rationale: Nínú àríyànjiyàn nípa Mèsáyà àti àyọlò Sáàmù 110, ‘Olúwa’ pa ìjẹ́pàtàkì oyè náà àti ìsopọ̀ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu.
