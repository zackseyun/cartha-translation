id: MAT.22.25
reference: Matthew 22:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: yo
  text: Àwọn arákùnrin méje sì wà láàárín wa. Ẹni àkọ́kọ́ gbéyàwó, ó sì kú; láìní ọmọ[a], ó fi aya rẹ̀ sílẹ̀ fún arákùnrin rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “kò ní irúgbìn.” Níhìn-ín, “irúgbìn” túmọ̀ sí ọmọ tàbí ìran.
    reason: lexical_alternative
  - marker: b
    text: 'Èyí ń tọ́ka sí àṣà ìgbéyàwó opó pẹ̀lú arákùnrin ọkọ: a retí pé arákùnrin ẹni tí ó kú yóò fẹ́ opó náà, kí a lè mú ìran ẹni tó kú tẹ̀síwájú. Wo Diutarónómì 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: láàárín wa
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn arákùnrin náà wà nínú ẹgbẹ́ tàbí àwùjọ tí àwọn olùsọ̀rọ̀ ń tọ́ka sí; “láàárín wa” jẹ́ Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: ἑπτὰ ἀδελφοί
  choice: àwọn arákùnrin méje
  rationale: Nínú ọ̀rọ̀ nípa ìgbéyàwó opó sí arákùnrin ọkọ rẹ̀, ἀδελφοί túmọ̀ sí àwọn arákùnrin ọkùnrin kan náà, kì í ṣe ìbátan lápapọ̀.
- source_word: ὁ πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: πρῶτος ń tọ́ka sí ipò rẹ̀ nínú tẹ̀léńtẹ̀lé àwọn arákùnrin náà, kò sì fi dandan hàn pé òun ni àgbà jù.
- source_word: γήμας
  choice: gbéyàwó
  rationale: Aorist participle náà fi hàn pé ó kọ́kọ́ wọ inú ìgbéyàwó kí ó tó kú; “gbéyàwó” sọ èyí ní Yorùbá àdánidá.
- source_word: ἐτελεύτησεν
  choice: ó kú
  rationale: Ìtumọ̀ tààrà ti ọ̀rọ̀ náà ni pé ó dé òpin ayé rẹ̀; “ó kú” ṣe kedere, kò sì lo ọ̀rọ̀ ìrọ̀rùn tí yóò dín agbára gbólóhùn náà kù.
- source_word: μὴ ἔχων σπέρμα
  choice: níwọ̀n bí kò ti ní ọmọ
  rationale: σπέρμα túmọ̀ ní tààrà sí “irúgbìn,” ṣùgbọ́n ní àyíká ìdílé àti òfin yìí ó túmọ̀ sí ọmọ tàbí ìran. “Kò ní ọmọ” jẹ́ kedere sí òǹkàwé Yorùbá, àlàyé ìtumọ̀ gangan sì wà ní àlàyé ìsàlẹ̀.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: ó fi aya rẹ̀ sílẹ̀
  rationale: Níhìn-ín ἀφίημι túmọ̀ sí pé ikú rẹ̀ mú kí aya rẹ̀ ṣẹ́ kù, kì í ṣe pé ó kọ̀ ọ́ sílẹ̀ ní ìkọ̀sílẹ̀.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: fún arákùnrin rẹ̀
  rationale: Dative náà tọ́ka sí arákùnrin tó ṣẹ́ kù gẹ́gẹ́ bí ẹni tí a fi opó náà sílẹ̀ fún, ní ìbámu pẹ̀lú àṣà ìgbéyàwó opó yìí.
theological_decisions:
- issue: Bóyá kí a sọ ìgbéyàwó opó pẹ̀lú arákùnrin ọkọ rẹ̀ ní kedere nínú ẹsẹ náà
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí Giriki ṣe sọ ọ́, láìfi “láti fẹ́ ẹ” kún un.
  alternative: “Ó fi aya rẹ̀ sílẹ̀ fún arákùnrin rẹ̀ láti fẹ́.”
  rationale: Àṣà tí Diutarónómì 25:5 sọ ni ọ̀rọ̀ náà gbára lé, ṣùgbọ́n Giriki kò sọ “láti fẹ́” ní kedere. Àlàyé ìsàlẹ̀ lè ṣàlàyé àṣà náà láìṣe àfikún sí ọ̀rọ̀ ẹsẹ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ó fi aya rẹ̀ sílẹ̀ fún arákùnrin rẹ̀” pa àṣírí kékeré inú Giriki mọ́, kò sì sọ ní pàtó pé arákùnrin náà fẹ́ opó náà, bí ó tilẹ̀ jẹ́ pé àṣà òfin náà ló wà lẹ́yìn ọ̀rọ̀.
