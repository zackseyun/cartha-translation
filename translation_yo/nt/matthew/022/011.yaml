id: MAT.22.11
reference: Matthew 22:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ọba wọlé láti wo àwọn àlejò tí wọ́n jókòó síbi àsè[a], ó rí ọkùnrin kan níbẹ̀ tí kò wọ aṣọ ìgbéyàwó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ Gíríìkì, “àwọn tí wọ́n dùbúlẹ̀” ni; èyí ń fi àṣà àwọn àlejò láti dùbúlẹ̀ níbi tábìlì ní àsè ọ̀wọ̀ ìgbàanì hàn.
    reason: cultural_note
  - marker: b
    text: Tàbí, “aṣọ ayẹyẹ ìgbéyàwó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: wọlé
  rationale: Ọ̀rọ̀ yìí fi hàn pé ọba wọ inú ibi àsè náà kí ó tó rí ọkùnrin náà; “wọlé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣípò yìí.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń mú ìtàn tẹ̀ síwájú pẹ̀lú ìyípadà kékeré tí ó dá ìdààmú tuntun sílẹ̀ nínú àkàwé náà; “Ṣùgbọ́n” mú ìyípadà yẹn hàn.
- source_word: ὁ βασιλεὺς
  choice: ọba
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún βασιλεύς nínú àkàwé nípa ọba kan.
- source_word: θεάσασθαι
  choice: láti wo
  rationale: Infinitive náà ń sọ ète tí ọba fi wọlé. “Láti wo” jẹ́ ti ẹ̀dá, kò sì fi dandan sọ pé àyẹ̀wò ìjọba olófin kan ni.
- source_word: τοὺς ἀνακειμένους
  choice: àwọn àlejò tí wọ́n jókòó síbi àsè
  rationale: Ní àṣà àsè ìgbà náà, ἀνάκειμαι túmọ̀ sí rírọ̀gbọ̀ síbi oúnjẹ. Yorùbá òde òní máa ń sọ pé àwọn àlejò “jókòó síbi àsè”; àlàyé ẹsẹ̀ ìsàlẹ̀ pa àwòrán ìpilẹ̀ ti rírọ̀gbọ̀ mọ́.
- source_word: εἶδεν
  choice: ó rí
  rationale: Ìtumọ̀ ìtàn tó ṣe tààrà fún aorist ὁράω ni “ó rí.”
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Èyí pa ìtọ́ka ibi tí adverb Gíríìkì náà sọ mọ́ ní Yorùbá àdánidá.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Orúkọ náà jẹ́ ẹyọ akọ, ó sì tọ́ka sí ọkùnrin kan pàtó nínú àkàwé náà.
- source_word: οὐκ ἐνδεδυμένον
  choice: tí kò wọ
  rationale: Perfect participle náà ṣàpèjúwe bí ọkùnrin náà ṣe wà ní àkókò tí ọba rí i; “tí kò wọ” jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἔνδυμα γάμου
  choice: aṣọ ìgbéyàwó
  rationale: Ọ̀rọ̀ ẹyọ náà lè tọ́ka sí aṣọ tó yẹ fún àsè ìgbéyàwó. “Aṣọ ìgbéyàwó” jẹ́ kíkún, àdánidá, ó sì pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Àwòrán ìdùbúlẹ̀ tàbí rírọ̀gbọ̀ síbi àsè
  choice: Lo “àwọn àlejò tí wọ́n jókòó síbi àsè,” kí àlàyé ẹsẹ̀ ìsàlẹ̀ sì sọ pé Gíríìkì ní “àwọn tí wọ́n rọgbọ̀.”
  alternative: “Àwọn tí wọ́n rọgbọ̀” tàbí “àwọn àlejò” nìkan.
  rationale: Èyí jẹ́ kí ìṣẹ̀lẹ̀ náà yé àwọn òǹkàwé Yorùbá lónìí, nígbà tí àlàyé sì ń pa àṣà ìjẹun ayẹyẹ ìgbàanì mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Ìtọ́ka akọ nínú ἄνθρωπον
  choice: ọkùnrin kan
  alternative: ẹnì kan
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ Gíríìkì jẹ́ ẹyọ akọ fún ẹni pàtó, kì í ṣe ọ̀rọ̀ àpapọ̀ fún gbogbo ènìyàn; nítorí náà a pa akọ náà mọ́.
- issue: Ìtumọ̀ ἔνδυμα γάμου
  choice: aṣọ ìgbéyàwó
  alternative: aṣọ tí ó yẹ fún àsè ìgbéyàwó
  rationale: A kò ṣàlàyé nínú ẹsẹ̀ yìí bóyá aṣọ pàtó kan ni tàbí aṣọ ayẹyẹ tó yẹ. “Aṣọ ìgbéyàwó” pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Jókòó síbi àsè” jẹ́ ọ̀rọ̀ tó ṣe àdánidá fún òǹkàwé òde òní; àlàyé [a] ló ń ṣàfihàn ìdúró ara àwọn àlejò ní ayé Gíríìkì-Róòmù. Gbólóhùn náà ṣókí, ó sì tẹ̀lé ìṣísẹ̀ ìtàn orísun.
