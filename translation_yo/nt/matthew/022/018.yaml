source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù mọ ìwà búburú wọn[a], ó sì wí pé, “Èé ṣe tí ẹ fi ń dán mi wò[b], ẹ̀yin alágàbàgebè?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ète búburú wọn” tàbí “ìkà wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Èé ṣe tí ẹ fi ń gbìyànjú mi?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “dán wò,” “gbìyànjú,” tàbí “dán ẹni wò sí ẹ̀ṣẹ̀,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: mọ
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù ti mọ ohun tó wà lọ́kàn wọn kí ó tó dá wọn lóhùn; “mọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń fi ìyàtọ̀ díẹ̀ hàn níbí láàárín ọ̀rọ̀ ẹ̀tàn wọn àti ìdáhùn Jésù.
- source_word: πονηρίαν
  choice: èrò búburú
  rationale: Nínú àyíká yìí, πονηρία ń tọ́ka sí ìwà búburú tó wà nínú ète ìbéèrè wọn, kì í ṣe ibi gẹ́gẹ́ bí èrò àfojúrí nìkan.
- source_word: εἶπεν
  choice: ó sì wí pé
  rationale: Èyí jẹ́ ọ̀nà àbínibí, ọlọ́lá láti sọ ìṣe ọ̀rọ̀ nínú ìtàn Bíbélì Yorùbá.
- source_word: Τί
  choice: Èé ṣe
  rationale: Nínú gbólóhùn yìí, τί túmọ̀ sí ìbéèrè nípa ìdí; “Èé ṣe” jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: πειράζετε
  choice: ẹ fi ń dán mi wò
  rationale: “Dán ... wò” pa ìtumọ̀ gbígbìyànjú tàbí fífi ẹnì kan sí àdánwò mọ́, láìfi dandan sọ pé ìdẹwò sí ẹ̀ṣẹ̀ nìkan ni.
- source_word: ὑποκριταί
  choice: ẹ̀yin alágàbàgebè
  rationale: “Alágàbàgebè” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn tó ń díbọ́n sí ohun tí wọn kì í ṣe, ó sì bá àyíká ẹ̀tàn wọn mu.
theological_decisions:
- issue: Bí a ṣe sọ ìmọ̀ Jésù nípa ohun tó wà lọ́kàn àwọn alatakò rẹ̀
  choice: Jésù mọ èrò búburú wọn.
  alternative: Jésù mọ ìwà búburú wọn / Jésù mọ ète burúkú wọn.
  rationale: Ẹsẹ náà sọ pé Jésù mọ ibi tó wà nínú ọ̀nà tí wọn gbà tọ̀ ọ́ wá. Ìtumọ̀ yìí pa ẹ̀rí ọ̀rọ̀ náà mọ́ láìsọ ọ́ di gbólóhùn ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìbéèrè líle Jésù àti àìdájú ìtumọ̀ πειράζω mọ́.
