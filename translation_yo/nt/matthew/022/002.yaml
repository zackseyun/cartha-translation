id: MAT.22.2
reference: Matthew 22:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: yo
  text: A fi ìjọba ọ̀run wé ọba kan tí ó ṣe àsè ìgbéyàwó fún ọmọ rẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A lè fi ìjọba ọ̀run wé.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ ní tààrà sí “a fi … wé” tàbí “a sọ … di bí,” bí ó tilẹ̀ jẹ́ pé a sábà máa ń sọ àkàwé báyìí pé “a lè fi … wé.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn ìgbéyàwó” ni ó wà ní ọ̀pọ̀; èyí jẹ́ àṣà ọ̀rọ̀ fún àwọn ayẹyẹ ìgbéyàwó tàbí àsè ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: A fi … wé
  rationale: Ó pa ìṣe àìṣe-taara aorist mọ́ ní ọ̀nà Yorùbá tó ṣe déédé, láì fi ìtumọ̀ àfàyèmọ́ ‘a lè fi … wé’ kún un.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ìjọba ọ̀run
  rationale: Èyí ni gbólóhùn Mátíù, ó sì pa ‘ọ̀run’ mọ́ dípò yíyí i sí ‘Ọlọ́run’; ‘ìjọba’ lè tọ́ka sí ìṣàkóso àti agbègbè ìjọba.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ọba kan
  rationale: Ní àkójọpọ̀ yìí, ἄνθρωπος àti βασιλεύς ń tọ́ka sí ẹni kan; ‘ọba kan’ jẹ́ Yorùbá àdánidá, ó sì yẹra fún ‘ọkùnrin kan, ọba kan’ tí kò ṣàn dáadáa.
- source_word: ὅστις
  choice: tí ó
  rationale: Ọ̀nà Yorùbá tó wọ́pọ̀ láti ṣàgbékalẹ̀ ìṣe ọba náà láì tẹ ìtumọ̀ arọ́pò-orúkọ Gíríìkì náà ju.
- source_word: ἐποίησεν
  choice: ṣe
  rationale: Pẹ̀lú γάμους, ‘ṣe àsè’ túmọ̀ sí pé ó pèsè tàbí gbé ayẹyẹ náà kalẹ̀; ó jẹ́ àdánidá, ó sì sún mọ́ ọ̀rọ̀ ìpilẹ̀.
- source_word: γάμους
  choice: àsè ìgbéyàwó
  rationale: Ọ̀pọ̀ γάμους jẹ́ àṣà ọ̀rọ̀ fún ayẹyẹ tàbí àsè ìgbéyàwó; ẹyọ kan ní Yorùbá ń sọ ìṣẹ̀lẹ̀ náà ní kedere.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: fún ọmọ rẹ̀
  rationale: Ó pa dative ti ẹni tí a ṣe ohun náà fún mọ́; ìtumọ̀ ìgbéyàwó ti wà nínú ‘àsè ìgbéyàwó.’
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ‘ìjọba ọ̀run’
  choice: ìjọba ọ̀run
  alternative: ìjọba Ọlọ́run; ìṣàkóso ọ̀run
  rationale: A pa ọ̀rọ̀ pàtó tí Mátíù lò mọ́, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ rọ́pò rẹ̀, kí ìfarapamọ́ tó wà láàárín agbègbè ìjọba àti ìṣàkóso lè dúró.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ọba kan’ gẹ́gẹ́ bí ìtumọ̀ àdánidá ti ἀνθρώπῳ βασιλεῖ.
