id: MAT.22.4
reference: Matthew 22:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: yo
  text: Ó tún rán àwọn ẹrú mìíràn[a], ó ní, ‘Ẹ sọ fún àwọn tí a ti pè pé, “Ẹ wò ó, mo ti pèsè àsè mi[b]; a ti pa àwọn akọ màlúù mi àti àwọn ẹran ọ̀sìn tí a ti sanra, ohun gbogbo sì ti ṣetán. Ẹ wá sí ayẹyẹ ìgbéyàwó[c].”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ìránṣẹ́ mìíràn.” Ọ̀rọ̀ Gíríìkì doulous lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “oúnjẹ mi.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí oúnjẹ tí a ti pèsè, ní ọ̀pọ̀ ìgbà oúnjẹ ọ̀sán tàbí àsè.
    reason: lexical_alternative
  - marker: c
    text: Tàbí ní ṣókí, “sí ìgbéyàwó.” Ọ̀rọ̀ Gíríìkì tó wà ní ọ̀pọ̀ nọ́ńbà lè tọ́ka sí gbogbo ayẹyẹ ìgbéyàwó náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: Ó tún rán
  rationale: Ó sọ ìṣe tí a tún ṣe ní ọ̀nà àdánidá nínú ìtàn Yorùbá.
- source_word: ἄλλους δούλους
  choice: àwọn ẹrú mìíràn
  rationale: Nínú àyíká ilé ọba òwe yìí, ‘ẹrú’ fi ipò àwọn tí ó wà lábẹ́ àṣẹ ẹni ilé hàn kedere ju ‘ìránṣẹ́’ lọ, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ méjèèjì.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Ẹ sọ fún àwọn tí a ti pè
  rationale: '‘A ti pè’ pa ìtumọ̀ perfect passive mọ́: ìpè náà ti ṣẹlẹ̀, ó sì ṣì kan àwọn ẹni náà.'
- source_word: Ἰδοὺ
  choice: Ẹ wò ó
  rationale: Ọ̀rọ̀ àfiyèsí tó bá èdè Yorùbá òde òní mu, tí kò sì jẹ́ ti àtijọ́ jù.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: mo ti pèsè àsè mi
  rationale: ἄριστον jẹ́ oúnjẹ tí a ti pèsè, ní ọ̀rọ̀ yìí fún ayẹyẹ; ‘àsè’ jẹ́ adayeba ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àṣàyàn ‘oúnjẹ’ hàn.
- source_word: οἱ ταῦροί μου
  choice: àwọn akọ màlúù mi
  rationale: ταῦροι tọ́ka sí akọ ẹran ọ̀sìn bovine; ‘akọ màlúù’ jẹ́ kedere, kò sì gbẹ́kẹ̀ lé ìtumọ̀ ẹran iṣẹ́ tí ‘oxen’ lè ní.
- source_word: τὰ σιτιστὰ
  choice: àwọn ẹran ọ̀sìn tí a ti sanra
  rationale: Ìtumọ̀ náà ni àwọn ẹran tí a bọ́ lọ́nà pàtàkì kí wọ́n sanra; a kò fi ‘ọmọ màlúù’ kún un nítorí Gíríìkì kò sọ irú ẹran náà ní pàtó.
- source_word: τεθυμένα
  choice: a ti pa
  rationale: Nínú àyíká àsè, θύω túmọ̀ sí pípa ẹran fún oúnjẹ, kì í ṣe dandan ẹbọ ìsìn.
- source_word: καὶ πάντα ἕτοιμα
  choice: ohun gbogbo sì ti ṣetán
  rationale: Ó pa ìtẹnumọ́ gbogbo-gbòò πάντα mọ́ ní Yorùbá tó rọrùn.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Ẹ wá sí ibi ayẹyẹ ìgbéyàwó
  rationale: Ọ̀pọ̀ nọ́ńbà γάμους lè tọ́ka sí gbogbo ayẹyẹ ìgbéyàwó; ‘ibi ayẹyẹ’ jẹ́ ìtumọ̀ adayeba nínú àyíká ìpè.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú ilé ọba ti òwe
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: ‘Ẹrú’ pa òtítọ́ ipò ẹni tí ó wà lábẹ́ àṣẹ olúwa mọ́ nínú àyíká yìí, láìfi ẹ̀kọ́ ẹ̀sìn míì kún un; àlàyé ìsàlẹ̀ jẹ́ kí àṣàyàn ‘ìránṣẹ́’ hàn.
- issue: Bóyá θύω ní ìtumọ̀ ẹbọ ìsìn
  choice: a ti pa
  alternative: a ti fi rú ẹbọ
  rationale: Àyíká jẹ́ pípa ẹran fún àsè, nítorí náà a yẹra fún fífi ìtumọ̀ ẹbọ ìsìn tí ẹsẹ̀ náà kò béèrè kún un.
- issue: Ìwọ̀n ìtumọ̀ τοὺς γάμους
  choice: ibi ayẹyẹ ìgbéyàwó
  alternative: ìgbéyàwó
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ayẹyẹ ìgbéyàwó lápapọ̀ tàbí ìgbéyàwó fúnra rẹ̀; a yan èyí tó bá àyíká àsè mu, a sì pa àṣàyàn kejì mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; a lo ‘Ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn. Gbólóhùn inú gbólóhùn ni a fi àmì ìsọ̀rọ̀ hàn láti pa ìpele ọ̀rọ̀ mọ́.
