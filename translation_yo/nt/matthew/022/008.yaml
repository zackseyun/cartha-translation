id: MAT.22.8
reference: Matthew 22:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: yo
  text: 'Nígbà náà, ó sọ fún àwọn ìránṣẹ́ rẹ̀ pé: “Àsè ìgbéyàwó ti ṣetán, ṣùgbọ́n àwọn tí a ti pè sí i[a] kò yẹ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a pè.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà ni “àwọn tí a pè”; ṣùgbọ́n nínú àyíká àsè yìí, ó ń tọ́ka sí àwọn tí a pè sí àsè ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: λέγει
  choice: ni ó sọ
  rationale: Ìkọ̀wé Gíríìkì lo ìsinsìnyí ìtàn; ìṣàkóso ‘ni ó sọ’ jẹ́ àdánidá nínú ìtàn Yorùbá, ó sì tún jẹ́ kí ìgbésẹ̀ tuntun yìí hàn gbangba.
- source_word: δούλοις
  choice: àwọn ìránṣẹ́
  rationale: Nínú àyíká àkàwé yìí, ọ̀rọ̀ náà tọ́ka sí àwọn tó ń ṣiṣẹ́ fún ọba; ‘ìránṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu láìfi ohun tí ẹsẹ̀ náà kò tẹnumọ́ kún un.
- source_word: Ὁ μὲν γάμος
  choice: Àsè ìgbéyàwó
  rationale: γάμος nínú àyíká yìí ni ayẹyẹ tàbí àsè ìgbéyàwó, kì í ṣe ìgbéyàwó gẹ́gẹ́ bí ìdè nìkan; ìyàtọ̀ μὲν…δέ fara hàn nínú ‘ṣùgbọ́n.’
- source_word: ἕτοιμός ἐστιν
  choice: ti ṣetán
  rationale: Ó túmọ̀ ìwà pípèsè-sílẹ̀ náà ní Yorùbá àdánidá.
- source_word: οἱ δὲ κεκλημένοι
  choice: àwọn tí a pè sí i
  rationale: Perfect passive participle κεκλημένοι tọ́ka sí àwọn tí a ti pè sí àsè; ‘pè sí i’ pa èrò ìpè mọ́, ó sì ṣe kedere pé ìkésíni àsè ni a ń sọ.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: kò yẹ
  rationale: Ó pa agbára ìdájọ́ ἄξιοι mọ́ láìṣàlàyé ìdí àìyẹ wọn ju ohun tí orísun sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí κεκλημένοι (‘àwọn tí a pè’) lè ní
  choice: àwọn tí a pè sí i
  alternative: àwọn tí a ké sí àsè náà
  rationale: ‘Pè sí i’ jẹ́ kí àyíká ìkésíni sí àsè ṣe kedere, ṣùgbọ́n ó tún pa ìtumọ̀ gidi ti ‘pè’ mọ́, láìfi èrò pàtó nípa ìpè tàbí àyànfẹ́ sínú ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Àsè ìgbéyàwó’ mú àyíká àsè náà jáde, ‘àwọn ìránṣẹ́’ sì jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó ṣeé lóye.
