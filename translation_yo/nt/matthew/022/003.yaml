id: MAT.22.3
reference: Matthew 22:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: yo
  text: Ó sì rán àwọn ìránṣẹ́ rẹ̀[a] láti pe àwọn tí a ti pè[b] sí àsè ìgbéyàwó[c], wọ́n kò sì fẹ́ wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹrú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú; “ìránṣẹ́” ni a yàn níbí nítorí ipa wọn gẹ́gẹ́ bí aṣojú ọba ni àkàwé náà tẹnumọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí a pè.” Ọ̀rọ̀ Gíríìkì náà tún gbòǹgbò ọ̀rọ̀ kan náà ṣe pẹ̀lú “láti pe,” ṣùgbọ́n níbí ó ń tọ́ka sí àwọn tí a ti pè tẹ́lẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “sí ayẹyẹ ìgbéyàwó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ó rán wọn lọ láti ṣe iṣẹ́ kan; “rán” jẹ́ ọ̀nà àdánidá àti tó péye ní Yorùbá.
- source_word: δούλους
  choice: àwọn ìránṣẹ́
  rationale: δοῦλος lè túmọ̀ sí ẹrú tàbí ìránṣẹ́. Nínú àkàwé yìí, iṣẹ́ wọn gẹ́gẹ́ bí aṣojú ọba ni a tẹnumọ́, nítorí náà “àwọn ìránṣẹ́” bá ọ̀rọ̀ mu; àlàyé ìsàlẹ̀ fi ọ̀nà mìíràn hàn.
- source_word: καλέσαι
  choice: láti lọ pe
  rationale: Ọ̀rọ̀ náà fi ète tí ó fi rán wọn hàn. “Pe” tún pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú κεκλημένους.
- source_word: κεκλημένους
  choice: àwọn tí a ti pè
  rationale: Àpólà aláìlórúkọ perfect passive náà tọ́ka sí àwọn tí ìpè ti dé bá tẹ́lẹ̀; “a ti pè” pa àtúnṣe gbòǹgbò ọ̀rọ̀ καλέω mọ́.
- source_word: εἰς τοὺς γάμους
  choice: sí àsè ìgbéyàwó
  rationale: Nínú àyíká yìí, γάμοι tọ́ka sí ayẹyẹ tàbí àsè ìgbéyàwó, kì í ṣe ìgbéyàwó gẹ́gẹ́ bí ìṣe nìkan.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: wọn kò fẹ́ wá
  rationale: Ìtumọ̀ yìí fi àìfẹ́ inú wọn hàn láìfi agbára “wọn kọ̀ láti wá” kún ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àkàwé
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: Ìtàn náà dojú kọ ipa àwọn tí ọba rán gẹ́gẹ́ bí aṣojú rẹ̀, kì í ṣe ipò wọn lábẹ́ ìdè ẹrú. Síbẹ̀, “ẹrú” jẹ́ ìtumọ̀ gidi tí àlàyé ìsàlẹ̀ tọ́ka sí.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe “pe…tí a ti pè” mọ ìṣọ̀kan gbòǹgbò ọ̀rọ̀ Gíríìkì, bí ó tilẹ̀ jẹ́ pé ó ní ìtẹnumọ́ díẹ̀ ní Yorùbá.
