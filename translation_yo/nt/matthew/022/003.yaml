  - severity: medium
    issue: Àwọn àmì àlàyé ìsàlẹ̀ kò so mọ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé, ó sì ṣòfò àlàyé yíyàn fún κεκλημένους.
