  source_fidelity: 'Ìtumọ̀ náà mú àwọn apá pàtàkì Gíríìkì náà dáadáa: rán, àwọn ìránṣẹ́, ìpè tí a ti ṣe tẹ́lẹ̀, àsè ìgbéyàwó, àti àìfẹ́ wọn láti wá. Síbẹ̀, “láti lọ pe” fi ìṣe ‘lọ’ kún un tí kò sí nínú ọ̀rọ̀ ìpilẹ̀; a yọ ọ́ kúrò. “Ṣùgbọ́n” tú ìsopò καί sí ìyàtọ̀ tó lágbára díẹ̀, nítorí náà “wọ́n kò sì fẹ́ wá” sún mọ́ ìsopò ìpilẹ̀ ju.'
  naturalness: “Ó sì rán àwọn ìránṣẹ́ rẹ̀ láti pe àwọn tí a ti pè sí àsè ìgbéyàwó, wọ́n kò sì fẹ́ wá” jẹ́ Yorùbá ìwọ̀ntúnwọ̀nsì, ó sì pa àtúnlò ‘pe/pè’ mọ́ láìjẹ́ àìmọ̀. Àmì ohùn àti ìkọ̀wé rẹ̀ bójú mu.
  terminology: “Ìránṣẹ́” bójú mu fún δούλους nínú àkàwé yìí, pẹ̀lú “ẹrú” gẹ́gẹ́ bí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀. “Àsè ìgbéyàwó” yẹ fún τοὺς γάμους nínú àyíká àsè. A tún fi yíyàn “àwọn tí a pè” hàn nínú àlàyé ìsàlẹ̀ kí ìbátan rẹ̀ pẹ̀lú “pe” hàn.
