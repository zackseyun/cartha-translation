  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: kò sí ẹni tí ó lè dá Jesu lóhùn, lẹ́yìn náà kò sì sí ẹni tí ó tún dáwọ́ láti béèrè lọ́wọ́ rẹ̀. Ṣùgbọ́n ‘bi í ní ìbéèrè’ kò rọrùn tó, ó sì tún ìtumọ̀ ‘ìbéèrè’ ṣe láìnídìí. ‘Béèrè lọ́wọ́ rẹ̀ mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ἐπερωτῆσαι αὐτὸν àti οὐκέτι mọ́.'
