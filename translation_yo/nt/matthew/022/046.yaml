id: MAT.22.46
reference: Matthew 22:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: yo
  text: Kò sì sí ẹni tí ó lè fi ọ̀rọ̀ kan dá a lóhùn[a], bẹ́ẹ̀ ni kò sí ẹni tí ó gbójúgbóyà láti ọjọ́ náà lọ láti béèrè lọ́wọ́ rẹ̀ mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ọ̀rọ̀ kan ṣoṣo dá a lóhùn.” Gbólóhùn Gíríìkì náà túmọ̀ ní tààràtà sí “dá a lóhùn ní ọ̀rọ̀ kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: kò sí ẹni
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé kò sí ẹnikẹ́ni rárá.
- source_word: ἐδύνατο
  choice: tí ó lè
  rationale: Ó fi àìlágbára ẹni láti ṣe ohun kan hàn ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: fi ọ̀rọ̀ kan dá a lóhùn
  rationale: Ó pa λόγον (‘ọ̀rọ̀’) mọ́, ó sì lo ọ̀rọ̀-ìṣe Yorùbá àdánidá ‘dá ... lóhùn’; ‘ọ̀rọ̀ kan’ tún lè túmọ̀ sí ọ̀rọ̀ kan ṣoṣo gẹ́gẹ́ bí ìtẹnumọ́.
- source_word: οὐδὲ
  choice: kò sì
  rationale: Ó so gbólóhùn òdì kejì mọ́ ti àkọ́kọ́ ní ọ̀nà tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: ἐτόλμησέν τις
  choice: kò sí ẹni tí ó tún gbójúgbóyà
  rationale: ‘Gbójúgbóyà’ mú ìtumọ̀ dídáwọ́lé tàbí níní ìgboyà láti ṣe ohun náà jáde, láìfi agbára ju ti Gíríìkì lọ.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: láti ọjọ́ náà lọ
  rationale: Ó fi ọjọ́ náà hàn gẹ́gẹ́ bí ìbẹ̀rẹ̀ ipò tí ó ń bá a lọ.
- source_word: ἐπερωτῆσαι
  choice: láti bi í ní ìbéèrè
  rationale: Ó tọ́ka sí fífi ìbéèrè sí Jesu, ó sì bá àyíká ìjiyàn mu ju ọ̀rọ̀ tí yóò túmọ̀ sí wíwá ìsọfúnni lásán lọ.
- source_word: οὐκέτι
  choice: tún
  rationale: Nínú gbólóhùn òdì ‘kò sí ẹni tí ó tún ...,’ ó fi hàn pé ìṣe náà kò ṣẹlẹ̀ mọ́ láti àkókò yẹn lọ.
theological_decisions:
- issue: Agbára ìtàn nínú dídákẹ́ àwọn alátakò lẹ́yìn ìdáhùn Jesu
  choice: A sọ ìṣẹ̀lẹ̀ náà gẹ́gẹ́ bí àìlágbára wọn láti dá a lóhùn àti àìní ìgboyà wọn láti tún bi í ní ìbéèrè.
  alternative: Kí a fi ọ̀rọ̀ kun un tí yóò tẹnumọ́ ọgbọ́n tàbí àṣẹ Jesu ju bí ẹsẹ̀ náà ṣe sọ lọ.
  rationale: Àyíká náà fi ìṣẹ́gun Jesu nínú ìjiyàn hàn, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ sọ ohun tí àwọn ènìyàn náà kò lè ṣe àti ohun tí wọn kò tún gbójúgbóyà láti ṣe; ìtumọ̀ náà kò fi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. A pa ìtẹnumọ́ λόγον mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì ṣàlàyé àṣàyàn ‘kan ṣoṣo’ ní àlàyé ìsàlẹ̀.
