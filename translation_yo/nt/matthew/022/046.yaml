  to: Kò sì sí ẹni tí ó lè fi ọ̀rọ̀ kan dá a lóhùn[a], bẹ́ẹ̀ ni kò sí ẹni tí ó gbójúgbóyà láti ọjọ́ náà lọ láti béèrè lọ́wọ́ rẹ̀ mọ́.
