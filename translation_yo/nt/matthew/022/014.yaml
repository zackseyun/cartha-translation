id: MAT.22.14
reference: Matthew 22:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ènìyàn ni a pè[a], ṣùgbọ́n díẹ̀ ni a yàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a pè síbi àsè”; nínú àyíká yìí, ọ̀rọ̀ náà lè ní ìtumọ̀ pípe ènìyàn síbi àsè.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn àyànfẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà dúró gẹ́gẹ́ bí orúkọ ní Gíríìkì, ó sì túmọ̀ sí “ọ̀pọ̀.” Fífi “ènìyàn” kún un mú kí gbolohun Yorùbá ṣe kedere, ó sì pa ìyàtọ̀ rẹ̀ mọ́ pẹ̀lú ὀλίγοι.
- source_word: γάρ
  choice: nítorí
  rationale: γάρ ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ tó ṣáájú; “nítorí” jẹ́ àsopọ̀ àdánidá ní Yorùbá láìfi ìtumọ̀ míì kún un.
- source_word: εἰσιν
  choice: ni
  rationale: Àkójọpọ̀ “ni a pè” àti “ni a yàn” sọ ipò tí àwọn ènìyàn náà wà ní ọ̀nà àdánidá ní Yorùbá, ó sì ṣe iṣẹ́ ọ̀rọ̀-ìṣe εἰμί nínú gbolohun náà.
- source_word: κλητοὶ
  choice: a pè
  rationale: “A pè” pa ìtumọ̀ gbòòrò ti κλητοί mọ́. Nínú àyíká àsè ìgbéyàwó, ó tún lè túmọ̀ sí “a pè síbi àsè”; a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀.
- source_word: ὀλίγοι
  choice: díẹ̀
  rationale: “Díẹ̀” jẹ́ òdìkejì àdánidá fún “ọ̀pọ̀” ní Yorùbá, ó sì pa bí ọ̀rọ̀ náà ṣe kúkúrú tó mọ́.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: δὲ fi ìyàtọ̀ hàn láàárín àwọn tí a pè àti àwọn tí a yàn; “ṣùgbọ́n” fi ìtakora náà hàn kedere.
- source_word: ἐκλεκτοί
  choice: a yàn
  rationale: “A yàn” sọ ìtumọ̀ ìpìlẹ̀ ti ἐκλεκτοί ní èdè Yorùbá òde òní, láìfi èrò ẹ̀kọ́ ìsìn kan pàtó lé e lórí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἐκλεκτοί nínú ẹsẹ tí a sábà máa ń lò nínú àríyànjiyàn nípa yíyan àti pípè
  choice: a yàn
  alternative: àwọn àyànfẹ́
  rationale: “A yàn” pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ ní kedere, ṣùgbọ́n kò fi ọ̀rọ̀ amọ̀-ẹ̀kọ́ ìsìn kan sí iwájú. Àlàyé ìsàlẹ̀ fi “àwọn àyànfẹ́” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn tó ṣeé ṣe.
- issue: Bí a ṣe túmọ̀ κλητοί ní àyíká òwe àsè ìgbéyàwó
  choice: a pè
  alternative: a pè síbi àsè
  rationale: “A pè” pa ìtumọ̀ gbòòrò àti ìbáṣepọ̀ rẹ̀ pẹ̀lú “a yàn” mọ́; “a pè síbi àsè” sì mú àyíká òwe náà jáde ní pàtó. A pa méjèèjì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, ó kúkúrú, ó ní ọlá, ó sì rọrùn fún òǹkàwé òde òní. A fi “ènìyàn” kún ọ̀pọ̀ nítorí ìmúlò Yorùbá, bí ó tilẹ̀ jẹ́ pé a kò kọ ọ́ lọ́tọ̀ nínú Gíríìkì.
