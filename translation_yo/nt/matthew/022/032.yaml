  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: yo
  text: “Èmi ni Ọlọ́run Ábúráhámù, àti Ọlọ́run Ísáákì, àti Ọlọ́run Jákọ́bù. Ọlọ́run kì í ṣe Ọlọ́run àwọn òkú, bí kò ṣe ti àwọn alààyè.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Ó jẹ́ ìdánimọ̀ ara ẹni ní tààràtà, ó sì pa ìgbà ìsinsìnyí tí ọ̀rọ̀ Gíríìkì lò mọ́, èyí tí ó ṣe pàtàkì nínú ìjiyàn Jésù.
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: Ọlọ́run Ábúráhámù, àti Ọlọ́run Ísáákì, àti Ọlọ́run Jákọ́bù
  rationale: A tún “Ọlọ́run” sọ ní ẹ̀ẹ̀kọ̀ọ̀kan bí ọ̀rọ̀ Gíríìkì ṣe ṣe, láti pa ìtẹnumọ́ àti ìwọ̀n ọ̀rọ̀ náà mọ́.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Kì í ṣe Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn ìṣàpèjúwe náà, ó sì pa “Ọlọ́run” tí Gíríìkì tún mẹ́nu kàn mọ́ láìfi arọ́pò-orúkọ rọ́pò rẹ̀.
- source_word: νεκρῶν
  choice: àwọn òkú
  rationale: Ọ̀rọ̀ ajẹtífù ọ̀pọ̀ yìí dúró gẹ́gẹ́ bí orúkọ; “àwọn òkú” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere tó sì bá àtakò inú ẹsẹ náà mu.
- source_word: ζώντων
  choice: àwọn alààyè
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí ó wà láàyè, ó sì pa àtakò kúkúrú pẹ̀lú “àwọn òkú” mọ́.
theological_decisions:
- issue: Ìtumọ̀ tí ìwàláàyè àwọn baba ńlá níwájú Ọlọ́run ní fún ìjiyàn Jésù nípa àjíǹde
  choice: A túmọ̀ gbólóhùn náà ní tààràtà láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ sí i.
  alternative: Ọlọ́run kì í ṣe Ọlọ́run àwọn ènìyàn tí wọ́n ti kú, bí kò ṣe ti àwọn tí wọ́n ṣì wà láàyè fún un.
  rationale: Ọ̀rọ̀ náà ń ṣe àtìlẹ́yìn fún ìjiyàn Jésù, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ pinnu ní kedere ohun tí ẹsẹ náà kò sọ nípa àjíǹde tàbí ipò àwọn òkú ṣáájú àjíǹde.
translation_notes:
  register: Yorùbá àkànṣe tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “Kì í ṣe ... bí kò ṣe ...” fún àtakò οὐκ ... ἀλλά, a sì fi àmì ohùn sí ibi tí ó bá ti yẹ.
