  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: Τότε jẹ́ “Nígbà náà”; πορευθέντες + συμβούλιον ἔλαβον ni a gbé kalẹ̀ gẹ́gẹ́ bí “àwọn Farisí lọ, wọ́n sì gbìmọ̀”; ὅπως fi ète náà hàn ní “bí wọn yóò ṣe”; àti παγιδεύσωσιν ἐν λόγῳ ni “dẹkùn mú un nínú ọ̀rọ̀ rẹ̀.” Arọ́pò-oníhun “rẹ̀” jẹ́ ìṣàlàyé tí àyíká ọ̀rọ̀—Jésù—fúnni ní ìdí, kò sì yi ìtumọ̀ orísun padà.'
