id: MAT.22.15
reference: Matthew 22:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: yo
  text: Nígbà náà ni àwọn Farisí lọ, wọ́n sì gbìmọ̀ bí wọn yóò ṣe dẹkùn mú un nínú ọ̀rọ̀ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n pète bí wọn yóò ṣe dẹkùn mú un nípa ohun tí ó bá sọ.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún συμβούλιον ἔλαβον àti ἐν λόγῳ, èyí tí ó mú ìtumọ̀ ète búburú àti ọ̀rọ̀ tí Jésù yóò sọ jáde ní kedere sí i.
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìtàn hàn ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: πορευθέντες
  choice: lọ
  rationale: Aorist participle náà ń tọ́ka sí ìgbésẹ̀ tí ó ṣáájú ìṣe pàtàkì; ‘lọ’ mú un jáde ní Yorùbá tí ó rọrùn láì fi gírámà Gíríìkì lé e lórí.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ náà tí ó wọ́pọ̀, tí ó sì ṣe kedere nínú Yorùbá.
- source_word: συμβούλιον ἔλαβον
  choice: wọ́n sì gbìmọ̀
  rationale: Ọ̀rọ̀ àsọyé náà túmọ̀ sí jíjọ ṣe ìmọ̀ràn tàbí ètò; ‘gbìmọ̀’ pa ìtumọ̀ ìfọ̀rọ̀wérọ̀ àti ṣíṣe ètò mọ́ láì fi ìkórìíra kún un níbi yìí fúnra rẹ̀.
- source_word: ὅπως
  choice: bí wọn yóò ṣe
  rationale: Ó bá àkóónú àti ète ìgbìmọ̀ wọn mu, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: αὐτὸν
  choice: un
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí wọ́n fẹ́ mú.
- source_word: παγιδεύσωσιν
  choice: dẹkùn mú
  rationale: Ó pa àwòrán ìdẹkùn inú ọ̀rọ̀ Gíríìkì mọ́, ó sì sọ ète búburú wọn ní kedere.
- source_word: ἐν λόγῳ
  choice: nínú ọ̀rọ̀ rẹ̀
  rationale: Ó pa ìtumọ̀ pé wọ́n fẹ́ mú un lára ohun tí yóò sọ mọ́. ‘Rẹ̀’ jẹ́ ohun tí àyíká ọ̀rọ̀ ń béèrè ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì kò fi arọ́pò-oníhun hàn ní tààrà.
theological_decisions:
- issue: Bí a ṣe yẹ kí a fi ìkórìíra inú συμβούλιον ἔλαβον hàn tó
  choice: Lo ‘gbìmọ̀’ ní ọ̀nà tí kò fi ìkórìíra kún gbólóhùn náà fúnra rẹ̀, kí abala ète náà—‘dẹkùn mú un’—fi ète búburú wọn hàn.
  alternative: ‘Wọ́n dìtẹ̀’ tàbí ‘wọ́n pète búburú.’
  rationale: Ọ̀rọ̀ náà fi hàn gbangba pé ète wọn burú, ṣùgbọ́n παγιδεύσωσιν ni ó sọ èyí ní tààrà. Yíyan ‘gbìmọ̀’ kò jẹ́ kí a fi ohun tí ó pọ̀ ju ti orísun lọ sínú idiom náà.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àwòrán ‘ìdẹkùn’ inú orísun mọ́.
