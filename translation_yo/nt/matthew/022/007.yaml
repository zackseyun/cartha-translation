id: MAT.22.7
reference: Matthew 22:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: yo
  text: Ṣùgbọ́n ọba náà bínú, ó sì rán àwọn ọmọ ogun rẹ̀ lọ; ó pa àwọn apànìyàn wọ̀nyẹn run, ó sì fi iná sun ìlú wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: inú bí …
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ‘ó bínú,’ tí ó sì fi ìbínú ọba hàn kedere.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: àwọn ọmọ ogun rẹ̀
  rationale: Ó túmọ̀ sí àwọn ẹgbẹ́ ọmọ ogun tí ó jẹ́ ti ọba, kì í ṣe àwọn ìránṣẹ́ lásán.
- source_word: ἀπώλεσεν
  choice: pa … run
  rationale: Nínú àyíká ogun yìí, ó túmọ̀ sí pípa àwọn apànìyàn náà run, kì í ṣe pé wọ́n ṣègbé lásán.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: àwọn apànìyàn wọ̀nyẹn
  rationale: Ó pa ìtẹnumọ́ ἐκείνους mọ́, ó sì pe wọ́n ní àwọn tí wọ́n mọ̀ọ́mọ̀ pa ènìyàn.
- source_word: ἐνέπρησεν
  choice: fi iná sun
  rationale: Ìtumọ̀ Yorùbá tó ṣe kedere fún fífi iná jó ohun kan run.
theological_decisions:
- issue: Bóyá kí a sọ pé ọba fúnra rẹ̀ ṣe àwọn ìṣe náà tàbí pé àwọn ọmọ ogun rẹ̀ ṣe wọ́n ní àṣẹ rẹ̀
  choice: 'A pa ọba mọ́ gẹ́gẹ́ bí olùṣe gbogbo àwọn ọ̀rọ̀-ìṣe náà: ‘ó rán … ó pa … ó sì … sun.’'
  alternative: Kí a sọ pé àwọn ọmọ ogun ni wọ́n pa àwọn apànìyàn, tí wọ́n sì sun ìlú náà.
  rationale: Gíríìkì fi ọba hàn gẹ́gẹ́ bí kókó ọ̀rọ̀ fún ἀπώλεσεν àti ἐνέπρησεν; èyí lè jẹ́ ọ̀nà àsọyé tí olórí fi ń ṣe ohun kan nípasẹ̀ àwọn ọmọ ogun rẹ̀, ṣùgbọ́n a kò yí kókó ọ̀rọ̀ náà padà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àmì àbọ̀ olóṣùwọ̀n lẹ́yìn ‘lọ’ ń jẹ́ kí ìtẹ̀síwájú àwọn ìṣe ọba ṣe kedere.
