  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: yo
  text: Lórí àwọn òfin méjèèjì wọ̀nyí ni gbogbo Òfin àti àwọn Wòlíì gbé kọ́.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, a tún lè túmọ̀ apá àkọ́kọ́ náà sí “Nínú àwọn òfin méjèèjì wọ̀nyí.” Ṣùgbọ́n “Lórí ... ni ... gbé kọ́” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
    reason: lexical_alternative
  - marker: b
    text: “Òfin àti àwọn Wòlíì” jẹ́ gbólóhùn tí a fi ń tọ́ka sí ẹ̀rí Ìwé Mímọ́ lápapọ̀; ẹsẹ yìí sọ pé gbogbo rẹ̀ gbé kọ́ lórí àwọn òfin méjèèjì wọ̀nyí.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: mọ́ àwọn òfin méjèèjì yìí
  rationale: Ní ìbámu pẹ̀lú àwòrán ọ̀rọ̀ κρέμαται, “rọ̀ mọ́” jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé gbogbo Òfin àti àwọn Wòlíì dúró lé àwọn òfin méjèèjì náà; ó sì gbé ipa ἐν jáde láìfi “nínú” tí kò bá àwòrán ọ̀rọ̀ mu sí i.
- source_word: ὅλος ὁ νόμος
  choice: Gbogbo Òfin
  rationale: “Gbogbo” pa agbára ὅλος mọ́, “Òfin” sì tọ́ka sí Tórà tàbí apá Ìwé Mímọ́ tí a mọ̀ sí Òfin, kì í ṣe òfin lásán.
- source_word: κρέμαται
  choice: rọ̀ mọ́
  rationale: Ọ̀rọ̀ náà pa àwòrán ohun tí ó rọ̀ mọ́ ohun mìíràn mọ́, ó sì tún sọ ìgbẹ́kẹ̀lé tàbí ìsinmi lórí àwọn òfin méjèèjì ní Yorùbá àdánidá.
- source_word: καὶ οἱ προφῆται
  choice: àti àwọn Wòlíì
  rationale: Èyí pa gbólóhùn Júù tí a fi ń tọ́ka sí ẹ̀rí Ìwé Mímọ́—“Òfin àti àwọn Wòlíì”—mọ́, dípò kí a túmọ̀ rẹ̀ sí àwọn ènìyàn alásọtẹ́lẹ̀ nìkan.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn “Òfin àti àwọn Wòlíì”
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ìtọ́ka sí ẹ̀rí Ìwé Mímọ́ lápapọ̀, èyí tí àwọn òfin ìfẹ́ méjèèjì ṣàkópọ̀ rẹ̀, tí ó sì rọ̀ mọ́ wọn.
  alternative: Kí a ka a sí ẹ̀kọ́ ìwà rere inú òfin àti ti àwọn wòlíì nìkan.
  rationale: Nínú Mátíù, “Òfin àti àwọn Wòlíì” jẹ́ gbólóhùn tí a mọ̀ fún àwọn Ìwé Mímọ́ aláṣẹ tàbí àkópọ̀ ẹ̀kọ́ wọn. Ìtumọ̀ náà kò rọ́pò rẹ̀ pẹ̀lú “gbogbo Ìwé Mímọ́,” nítorí náà ó pa ìró ìtọ́ka ìwé mímọ́ náà mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. A yan “rọ̀ mọ́” láti pa àwòrán ọ̀rọ̀ ìpilẹ̀ mọ́ láìjẹ́ kí gbólóhùn náà dà bí èdè àjèjì; a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
