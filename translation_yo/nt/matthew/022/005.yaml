id: MAT.22.5
reference: Matthew 22:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: yo
  text: 'Ṣùgbọ́n wọ́n kò kọbi ara sí i[a], wọ́n sì lọ: ọ̀kan sí oko tirẹ̀, èkejì sí òwò rẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò fiyè sí i,” tàbí “wọn pa á tì”; èyí ń tọ́ka sí ìpè ọba nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: wọn kò fi ọ̀rọ̀ náà sí
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọn kò kọbi ara sí ìpè ọba. Gbólóhùn Yorùbá yìí jẹ́ èdè àdánidá, ó sì pa ohun tí a kò sọ ní tààràtà nínú Gíríìkì mọ́ nípasẹ̀ ‘ọ̀rọ̀ náà,’ tí àyíká rẹ̀ ń tọ́ka sí ìpè náà.
- source_word: ἀπῆλθον
  choice: wọ́n sì lọ
  rationale: Èyí sọ ìlọkúrò wọn ní kedere àti ní èdè Yorùbá tó rọrùn, láìfi ìtumọ̀ míì kún un.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ọ̀kan ... èkejì sì
  rationale: Ìtumọ̀ yìí pa ìpín àti ìyàtọ̀ tó wà nínú ìkọ̀ Gíríìkì mọ́ ní ọ̀nà tí ó bá Yorùbá mu.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: sí oko tirẹ̀
  rationale: ‘Oko’ lè túmọ̀ sí ilẹ̀ iṣẹ́ àgbẹ̀ tàbí oko àgbẹ̀, ó sì bá ἀγρός mu; ‘tirẹ̀’ pa ìtẹnumọ́ ἴδιον mọ́.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: sí òwò rẹ̀
  rationale: ‘Òwò’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iṣẹ́ ìṣòwò tàbí business, ó sì yàtọ̀ sí iṣẹ́ oko ẹni àkọ́kọ́.
theological_decisions:
- issue: Ohun tí ἀμελήσαντες ń tọ́ka sí láìdárúkọ rẹ̀
  choice: ‘ọ̀rọ̀ náà’ ni a lò, tí ó ń tọ́ka sí ìpè ọba nínú àyíká ẹsẹ náà.
  alternative: ‘wọn kò kọbi ara sí i’ tàbí ‘wọn pa ìpè náà tì’
  rationale: Gíríìkì kò sọ ohun tí wọn kò fiyè sí ní tààràtà, ṣùgbọ́n àyíká fi hàn pé ìpè ọba ni. ‘Ọ̀rọ̀ náà’ mú èdè Yorùbá dùn, kò sì fi ẹ̀kọ́ ìsìn kún àkọsílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀sìn ẹ̀gbẹ́ kan pàtó.
