  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ẹsẹ̀ Gíríìkì náà dáadáa: àwọn ogunlọ́gọ̀ gbọ́ ohun tí Jésù sọ, ẹ̀kọ́ rẹ̀ sì yà wọ́n lẹ́nu. Ṣùgbọ́n “gidigidi” ń fi ìmúgbòòrò kún ọ̀rọ̀ náà tí kò hàn ní kedere nínú ọ̀rọ̀ ìpilẹ̀, ó sì yẹ kí a tún ìṣètò gbolohun náà ṣe kí ó rọrùn sí i ní Yorùbá.'
