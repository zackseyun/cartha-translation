translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní ọlá, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; a yàgò fún ‘doctrine’ tó lè dun bí ọ̀rọ̀ ẹ̀kọ́ ìsìn onímọ̀-jinlẹ̀.
