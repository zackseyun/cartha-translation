  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: yo
  text: Nígbà tí àwọn ogunlọ́gọ̀ náà gbọ́ èyí[a], ẹ̀kọ́ rẹ̀ sì yà wọ́n lẹ́nu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n gbọ́ èyí”; ní ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ Gíríìkì, “nígbà tí wọ́n ti gbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́ èyí
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tó ń ṣàlàyé ìgbà tí ìhùwàsí àwọn ogunlọ́gọ̀ ṣẹlẹ̀. Gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá; ‘èyí’ tọ́ka sí ìdáhùn Jésù tó ṣáájú.
- source_word: οἱ ὄχλοι
  choice: àwọn ogunlọ́gọ̀ náà
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ inú Gíríìkì mọ́, ‘náà’ sì dúró fún article tó ń tọ́ka sí àwọn ènìyàn tí a ti mẹ́nu kàn.
- source_word: ἐξεπλήσσοντο
  choice: yà wọ́n lẹ́nu gidigidi
  rationale: Àpólà Yorùbá yìí sọ ìyàlẹ́nu lílágbára tí ọ̀rọ̀-ìṣe Gíríìkì náà ní, ó sì bá ìtàn Yorùbá òde òní mu.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ẹ̀kọ́ rẹ̀
  rationale: A fi ‘ẹ̀kọ́ rẹ̀’ ṣe kókó-ọrọ̀ nínú àpólà Yorùbá ‘yà wọ́n lẹ́nu,’ èyí tó fi hàn pé ẹ̀kọ́ Jésù ni ìdí tàbí ohun tí ìyàlẹ́nu náà dá lé.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ jẹ́ àsopọ̀ ìtàn Yorùbá tó bá καί mu, tó sì so ìhùwàsí yìí mọ́ ìṣẹ̀lẹ̀ tó ṣáájú.
