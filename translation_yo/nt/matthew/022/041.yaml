  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συνηγμένων δὲ τῶν Φαρισαίων ἐπηρώτησεν αὐτοὺς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: yo
  text: Nígbà tí àwọn Farisí péjọ, Jésù béèrè lọ́wọ́ wọn pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: Nígbà tí … péjọ
  rationale: Aorist passive participle in a genitive absolute supplies the circumstantial setting. This Yoruba clause naturally conveys “while/when they were gathered,” with péjọ expressing the collective force of συνάγω.
- source_word: δὲ
  choice: (kò ṣe é túmọ̀ ní ọ̀rọ̀ ọ̀tọ̀)
  rationale: Here δέ is a mild discourse transition, not a strong contrast. The temporal opening and verse context carry the transition naturally in Yoruba, so adding ṣùgbọ́n or ní báyìí would overstate it.
- source_word: τῶν Φαρισαίων
  choice: àwọn Farisí
  rationale: Standard, intelligible Yoruba form of the group name Φαρισαῖοι; àwọn marks the plural group.
- source_word: ἐπηρώτησεν
  choice: béèrè lọ́wọ́
  rationale: Natural Yoruba expression for asking a person a question; it preserves the ordinary sense without adding an adversarial nuance.
- source_word: αὐτοὺς
  choice: wọn
  rationale: The plural pronoun refers directly to the Pharisees; within lọ́wọ́ wọn it marks those whom Jesus asked.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Standard Yoruba form of the proper name; the Greek article is not separately represented before a personal name.
theological_decisions: []
translation_notes:
  register: Standard contemporary Yoruba with full tone marks where natural. The wording is dignified but readily understandable. The final pé prepares for the direct question in the following verse and appropriately preserves the source verse’s incomplete continuation.
