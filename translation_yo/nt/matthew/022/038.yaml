id: MAT.22.38
reference: Matthew 22:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὕτη ἐστὶν ⸂ἡ μεγάλη καὶ πρώτη⸃ ἐντολή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: yo
  text: Èyí ni òfin ńlá àti àkọ́kọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Èyí ni òfin tó ṣe pàtàkì jù lọ.” Ní ti gidi, èdè Gíríìkì ní ọ̀rọ̀ àpèjúwe méjì: “òfin ńlá àti àkọ́kọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Èyí
  rationale: Ọ̀rọ̀ arọ́pò afihan yìí ń tọ́ka sí òfin tí Jésù ṣẹ̀ṣẹ̀ sọ ní ẹsẹ 37; “Èyí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti pa ìtọ́kasí náà mọ́.
- source_word: ἐστὶν
  choice: ni
  rationale: “Ni” ni àsopọ̀ ọ̀rọ̀ tó bá èdè Yorùbá mu nínú gbólóhùn ìdánimọ̀ yìí, ó sì fi ìtumọ̀ ọ̀rọ̀ ìṣe àsopọ̀ Gíríìkì hàn ní tààrà.
- source_word: μεγάλη
  choice: ńlá
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń sọ nípa bí òfin náà ti ṣe pàtàkì tó, kì í ṣe nípa ìwọ̀n ara. “Ńlá” pa ìrísí ajẹtífù onípò rere mọ́ láì sọ ọ́ di “tó tóbi jù lọ.”
- source_word: πρώτη
  choice: àkọ́kọ́
  rationale: “Àkọ́kọ́” lè túmọ̀ sí èyí tó kọ́kọ́ ní ipò tàbí ní ọlá; ó bá ọ̀rọ̀ Gíríìkì mu, ó sì pa ìyàtọ̀ rẹ̀ sí “ńlá” mọ́.
- source_word: ἐντολή
  choice: òfin
  rationale: “Òfin” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání nínú àyíká Ìwé Mímọ́ fún àṣẹ Ọlọ́run, ó sì bá ìjíròrò nípa Òfin mu. “Àṣẹ” tún ṣeé ṣe, ṣùgbọ́n “òfin” dá ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú àyíká rẹ̀ mọ́ dáadáa.
theological_decisions:
- issue: Ìbáṣepọ̀ μεγάλη àti πρώτη nínú àpèjúwe òfin náà
  choice: A tú ajẹtífù méjèèjì lọ́tọ̀ gẹ́gẹ́ bí “òfin ńlá àti àkọ́kọ́.”
  alternative: “Òfin tó ṣe pàtàkì jù lọ” tàbí “òfin tó tóbi jù lọ àti àkọ́kọ́.”
  rationale: Èdè Gíríìkì ní ajẹtífù onípò rere méjì tí a so pọ̀, μεγάλη àti πρώτη. Ṣíṣàfihàn méjèèjì pa ìtẹnumọ́ àti ìfarakanra ọ̀rọ̀ náà mọ́, láì sọ μεγάλη di onípò gíga jù tàbí da àwọn àpèjúwe méjèèjì pọ̀ di ọ̀kan.
translation_notes:
  register: A lo èdè Yorùbá ìgbàlódé tó ní iyì, tó rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tó yẹ, a sì pa ìṣọ̀kan ajẹtífù méjì inú orísun Gíríìkì mọ́.
