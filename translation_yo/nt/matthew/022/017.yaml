id: MAT.22.17
reference: Matthew 22:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: yo
  text: Nítorí náà, ẹ sọ fún wa, kí ni ìwọ rò? Ṣé ó bófin mu láti fún Késárì ní owó orí, tàbí bẹ́ẹ̀ kọ́?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: kí ni ẹ rò?
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè èrò ẹni, ó sì pa ìtumọ̀ ‘kí ni ó dà bí lójú rẹ?’ mọ́.
- source_word: ἔξεστιν
  choice: Ṣé ó bófin mu
  rationale: Ọ̀rọ̀ náà ń béèrè bóyá ohun náà jẹ́ ohun tí òfin yọ̀ǹda, kì í ṣe bóyá ó kàn yẹ nípa ìwà rere.
- source_word: δοῦναι
  choice: láti fún ... ní
  rationale: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘láti fún,’ ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì, dípò ṣíṣe é ní ‘láti san’ nìkan.
- source_word: κῆνσον
  choice: owó orí
  rationale: Ó tọ́ka sí owó orí tí ìjọba Róòmù ń gba; ‘owó orí’ ṣe kedere fún òǹkàwé Yorùbá òde òní láìfi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- source_word: Καίσαρι
  choice: Késárì
  rationale: A lò orúkọ oyè olú ọba Róòmù ní ìkọ̀wé Yorùbá tí ó bá ìpè rẹ̀ mu.
theological_decisions:
- issue: Ìbéèrè nípa bóyá fífún Késárì ní owó orí bófin mu
  choice: Pa á mọ́ gẹ́gẹ́ bí ìbéèrè tí kò tíì ní ìdáhùn nínú ẹsẹ yìí
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìbéèrè nípa ojúṣe ẹ̀sìn tàbí ìfọwọ́sí ìjọba Róòmù
  rationale: Ẹsẹ náà fúnra rẹ̀ kò yanju ìṣòro náà, nítorí náà ìtumọ̀ kò gbọ́dọ̀ fi ìdáhùn tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ sí i.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lò ‘ẹ’ fún ọ̀pọ̀ ènìyàn tí wọ́n ń bá Jésù sọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé Gíríìkì yí padà sí ẹnìkan nínú ‘τί σοι δοκεῖ’; ìlànà Yorùbá jẹ́ kí ‘ẹ’ ṣiṣẹ́ lọ́nà àdánidá ní gbogbo gbólóhùn.
