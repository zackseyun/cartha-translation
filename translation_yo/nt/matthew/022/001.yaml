  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: yo
  text: 'Jésù sì dáhùn, ó sì tún bá wọn sọ̀rọ̀ nípasẹ̀ àwọn àkàwé[a], pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù sì fèsì, ó sì tún bá wọn sọ̀rọ̀ nípasẹ̀ àwọn àkàwé, pé.” Ọ̀rọ̀ Gíríìkì lo àṣà ìtàn tí ó wọ́pọ̀, ‘dáhùn,’ bí ó tilẹ̀ jẹ́ pé kò sí ìbéèrè tààrà tí a sọ lẹ́sẹ̀kẹsẹ̀ ṣáájú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tí ó wọ́pọ̀ ní Yorùbá; ó ń tẹ ìṣàn ọ̀rọ̀ síwájú láìfi ìtumọ̀ àkókò kún un.
- source_word: ἀποκριθεὶς
  choice: dáhùn
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó lè jẹ́ àṣà ìsọ̀rọ̀ inú ìtàn níbi tí ìbéèrè tààrà kò ti ṣáájú.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Ọ̀nà Yorùbá tí a mọ̀ sí orúkọ náà.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Jésù tún ṣe iṣẹ́ sísọ̀rọ̀ náà lẹ́ẹ̀kan sí i.
- source_word: εἶπεν
  choice: bá wọn sọ̀rọ̀
  rationale: Ó jẹ́ ọ̀nà àdánidá láti túmọ̀ iṣẹ́ sísọ, ó sì yàgò fún àtúnsọ ‘sọ pé’ ṣáájú λέγων.
- source_word: ἐν παραβολαῖς
  choice: nípasẹ̀ àwọn àkàwé
  rationale: ἐν pẹ̀lú ọ̀rọ̀ dative níbí ń tọ́ka sí ọ̀nà tàbí ohun èlò tí a fi sọ̀rọ̀; gbolohun yìí ṣe kedere ní Yorùbá.
- source_word: αὐτοῖς
  choice: wọn
  rationale: Aṣojú ọ̀rọ̀ fún àwọn tí Jésù ń bá sọ̀rọ̀.
- source_word: λέγων
  choice: pé
  rationale: Ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tí ó tẹ̀ lé e sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ àṣà ọ̀rọ̀ ‘dáhùn’ níbi tí ìbéèrè tààrà kò ti ṣáájú
  choice: Pa ‘dáhùn’ mọ́
  alternative: ‘fèsì’ tàbí kí a bẹ̀rẹ̀ pẹ̀lú ‘tún bá wọn sọ̀rọ̀’ nìkan
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ kí a má ṣe tú àìṣedéédé inú àṣà ìtàn náà kúrò tàbí fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
