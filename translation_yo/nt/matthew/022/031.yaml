id: MAT.22.31
reference: Matthew 22:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: yo
  text: Ní ti àjíǹde àwọn òkú sì, ẹ kò ha kà ohun tí Ọlọ́run sọ fún yín pé,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kò ha kà ohun tí a sọ fún yín láti ọ̀dọ̀ Ọlọ́run pé,”
    reason: Ọ̀nà mìíràn tó tú ìṣètò passive Gíríìkì náà ní tààrà sí i, bí ó tilẹ̀ jẹ́ pé kò ṣe àdánidá tó bẹ́ẹ̀ ní Yorùbá.
lexical_decisions:
- source_word: περὶ δὲ
  choice: Ní ti … sì
  rationale: “Ní ti” fi kókó ọ̀rọ̀ hàn, “sì” sì pa ìyípadà inú ìjíròrò mọ́ láì sọ ọ́ di ìtakora líle.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Èyí túmọ̀ sí jíjí àwọn tí ó ti kú dìde, ó sì pa ìtumọ̀ genitive náà mọ́ gẹ́gẹ́ bí ‘àjíǹde àwọn òkú,’ kì í ṣe dandan ‘àjíǹde kúrò láàárín àwọn òkú.’
- source_word: οὐκ ἀνέγνωτε
  choice: ẹ kò ha kà
  rationale: Ìbéèrè pẹ̀lú “ha” jẹ́ ọ̀nà Yorùbá tó bójú mu fún ìbéèrè àtakò tí Jésù fi ń tọ́ka sí ohun tí ó yẹ kí wọ́n ti mọ̀ nínú Ìwé Mímọ́.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: ohun tí Ọlọ́run sọ fún yín
  rationale: Ọ̀rọ̀ yìí sọ divine agency àti àwọn tí ọ̀rọ̀ náà ń bá lẹ́nu-kedere; active construction yìí sì jẹ́ èdè Yorùbá àdánidá ju passive aláìrọ̀rùn lọ.
- source_word: λέγοντος
  choice: pé
  rationale: “Pé” ni ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tààrà tí ẹsẹ̀ tó tẹ̀ lé yóò gbé kalẹ̀.
theological_decisions:
- issue: Ọlọ́run gẹ́gẹ́ bí olùsọ̀rọ̀ àti Ìwé Mímọ́ gẹ́gẹ́ bí ọ̀rọ̀ tó ń bá àwọn olùgbọ́ sọ̀rọ̀
  choice: ohun tí Ọlọ́run sọ fún yín
  alternative: ohun tí a sọ fún yín láti ọ̀dọ̀ Ọlọ́run
  rationale: Ìtumọ̀ àkọ́kọ́ pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùsọ̀rọ̀, ó sì pa “fún yín” mọ́ gẹ́gẹ́ bí àdírẹ́sì sí àwọn olùgbọ́, láì fi ẹ̀kọ́ ìmísí kan tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye. “Ẹ kò ha kà” ní ìwọ̀n ọ̀wọ̀ àti agbára ìbéèrè àtakò; “àjíǹde” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún resurrection. A lo àmì ohùn níbi tí ó yẹ.
