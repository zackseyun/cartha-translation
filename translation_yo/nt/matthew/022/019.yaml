  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: yo
  text: “Ẹ fi ẹyọ owó tí a fi ń san owó orí[a] hàn mí.” Wọ́n sì mú owó dínárì kan wá fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “owó orí tí a ń gba lórí olúkúlùkù” tàbí “owó orí ìkànìyàn”; κῆνσος jẹ́ owó orí ìjọba Róòmù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Ẹ fi … hàn mí
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì pa ìtumọ̀ fífi ohun kan hàn fún àyẹ̀wò mọ́ ju ‘ẹ mú … wá’ lọ.
- source_word: νόμισμα
  choice: owó ẹyọ
  rationale: Ó tọ́ka sí ẹyọ owó tí ó wà ní lílò; ‘owó ẹyọ’ jẹ́ Yorùbá àdánidá, ó sì bá dínárì tí a dárúkọ lẹ́yìn náà mu.
- source_word: τοῦ κήνσου
  choice: tí a fi ń san owó orí
  rationale: Ẹ̀ka ọ̀rọ̀ náà sọ ìbáṣepọ̀ ẹyọ owó náà pẹ̀lú owó orí Róòmù; yíyí i sí gbólóhùn ìṣe jẹ́ kó ṣe kedere, ó sì jẹ́ Yorùbá àdánidá láì sọ pàtó ju orísun lọ.
- source_word: προσήνεγκαν
  choice: mú … wá fún un
  rationale: Ìtumọ̀ náà bá ìṣe mímú ohun kan tọ ẹni kan wá mu, ó sì jẹ́ ọ̀nà ọ̀rọ̀ Yorùbá tí ó ṣe déédé.
- source_word: δηνάριον
  choice: owó dínárì kan
  rationale: A pa orúkọ ẹyọ owó Róòmù náà mọ́ ní àfọwọ́kọ Yorùbá nítorí pé kò sí ẹyọ owó òde òní tí ó bá a dọ́gba pẹ̀lú ìtàn rẹ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé lásán. Fọ́ọ̀mù ọ̀wọ̀/ọ̀pọ̀ ‘Ẹ’ pa nọ́ńbà ọ̀pọ̀ ti àṣẹ Gíríìkì mọ́.
