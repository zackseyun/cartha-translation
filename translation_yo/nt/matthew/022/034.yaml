id: MAT.22.34
reference: Matthew 22:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn Farisí gbọ́ pé ó ti mú àwọn Sadusí dákẹ́[a], wọ́n péjọ papọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “ó ti fi ìwọ̀ sí ẹnu àwọn Sadusí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí fífi ìwọ̀ sí ẹnu ẹranko; níhìn-ín, àfiwé ni fún mímú wọn dákẹ́ nínú ìjiyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tí ó ní ìtakora hàn láàárín ìṣẹ̀lẹ̀ yìí àti ìjíròrò tó ṣáájú.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ Júù yìí ni a kọ ní ìbámu pẹ̀lú bí a ṣe ń pè é ní Yorùbá.
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́
  rationale: Ọ̀rọ̀ aláìlópìn aorist yìí ní ìtumọ̀ àkókò níhìn-ín; ọ̀nà yìí sì bójú mu ní Yorùbá.
- source_word: ἐφίμωσεν
  choice: ó ti mú ... dákẹ́
  rationale: Ní ti gidi, ọ̀rọ̀ náà lè túmọ̀ sí dídì ẹnu ẹranko, ṣùgbọ́n níhìn-ín ó ń tọ́ka sí bí Jésù ṣe dá ìjiyàn àwọn Sadusí dúró débi pé wọn kò lè dáhùn mọ́; àlàyé ìṣàpẹẹrẹ náà wà nínú àlàyé ìsàlẹ̀.
- source_word: Σαδδουκαίους
  choice: àwọn Sadusí
  rationale: Orúkọ ẹgbẹ́ Júù yìí ni a kọ ní ìbámu pẹ̀lú bí a ṣe ń pè é ní Yorùbá.
- source_word: συνήχθησαν
  choice: wọ́n péjọ
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ìrísí passive, ó ní ìtumọ̀ pé ẹgbẹ́ náà kóra jọ; “wọ́n péjọ” jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐπὶ τὸ αὐτό
  choice: sí ibì kan náà
  rationale: Gbólóhùn náà lè túmọ̀ sí “papọ̀” tàbí “ní ibi kan náà.” Yíyan “sí ibì kan náà” pa ìtumọ̀ ibi mọ́ láìfi ète tí ẹsẹ̀ náà kò sọ kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ṣe kedere, tó ní iyì, tí a sì fi àmì ohùn sí ní ibi tó yẹ. A lo àwọn orúkọ ẹgbẹ́ “Farisí” àti “Sadusí” gẹ́gẹ́ bí ìkọ̀wé Yorùbá tó rọrùn fún òǹkàwé òde òní.
