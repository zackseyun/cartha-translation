  text: Likewise also the second and the third[a], up to the seven.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ó rí fún ẹni kejì àti ẹni kẹta, títí dé gbogbo wọn méje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ọ̀nà kan náà ni ó rí fún ẹni kejì àti ẹni kẹta, títí dé gbogbo wọn méje.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Bẹ́ẹ̀ náà ni ó rí
  rationale: Ó fi hàn pé ohun tí ó ṣẹlẹ̀ sí ẹni àkọ́kọ́ tún ṣẹlẹ̀ sí àwọn tí ó tẹ̀ lé e; ọ̀rọ̀ yìí jẹ́ àdánidá, ó sì so ẹsẹ yìí mọ́ ohun tí a sọ ṣáájú.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: fún ẹni kejì àti ẹni kẹta
  rationale: Àwọn nọ́ńbà ipò náà dúró gẹ́gẹ́ bí orúkọ nínú Gíríìkì. A lo “ẹni” láì fi “arákùnrin” kún un, kí a lè pa àkótán ọ̀rọ̀ orísun mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἕως τῶν ἑπτά
  choice: títí dé gbogbo àwọn méje
  rationale: Gbólóhùn náà túmọ̀ sí pé ohun kan náà ń bá a lọ dé ọ̀dọ̀ gbogbo àwọn méje. “Gbogbo” jẹ́ kí ìtumọ̀ ẹgbẹ́ méje náà ṣe kedere ní Yorùbá láì yí èrò orísun padà.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A pa ìtọ́ka sí àwọn arákùnrin mọ́ nípasẹ̀ “ẹni kejì” àti “ẹni kẹta” dípò fífi “arákùnrin” tí kò sí nínú ẹsẹ náà kún un.
