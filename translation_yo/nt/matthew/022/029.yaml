id: MAT.22.29
reference: Matthew 22:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Ẹ ń ṣìnà[a], nítorí ẹ kò mọ àwọn Ìwé Mímọ́, ẹ kò sì mọ agbára Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ wà nínú àṣìṣe,” tàbí, “A ń tàn yín jẹ.”
    reason: Πλανᾶσθε lè ṣàpèjúwe wíwà nínú àṣìṣe, ṣíṣìnà, tàbí jíjẹ́ ẹni tí a tàn jẹ; ọ̀rọ̀ Gíríìkì náà kò fi gbogbo ìyàtọ̀ wọ̀nyí múlẹ̀ ní kíkún.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ṣùgbọ́n Jésù dá wọn lóhùn pé
  rationale: Ọ̀rọ̀ yìí jẹ́ àgbékalẹ̀ ìdáhùn tí ó wọ́pọ̀ ní Gíríìkì. “Dá wọn lóhùn pé” sọ ọ́ ní Yorùbá àdánidá láìtúmọ̀ àtúnṣe ọ̀rọ̀ náà lọ́nà líle, “Ṣùgbọ́n” sì fi ìyípadà díẹ̀ nínú ìjíròrò hàn.
- source_word: Πλανᾶσθε
  choice: Ẹ ń ṣìnà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pé wọ́n wà nínú àṣìṣe tàbí pé a ti mú wọn ṣìnà. “Ẹ ń ṣìnà” mú ìtumọ̀ pé wọ́n wà ní ọ̀nà àṣìṣe jáde, ó sì yẹra fún fífi gbogbo ẹ̀bi lé ẹni tí ó tàn wọ́n jẹ.
- source_word: μὴ εἰδότες
  choice: nítorí ẹ kò mọ
  rationale: Àpólà aláìlópin náà ṣàlàyé ohun tí ó fa ìṣìnà wọn; “nítorí” mú ìbáṣepọ̀ ìdí yìí hàn ní Yorùbá kedere.
- source_word: τὰς γραφὰς
  choice: àwọn Ìwé Mímọ́
  rationale: Ọ̀rọ̀ ọ̀pọ̀ yìí tọ́ka sí àwọn ìwé mímọ́ tí àwọn Júù gbà. “Àwọn Ìwé Mímọ́” pa ìtumọ̀ ọ̀pọ̀ náà mọ́, ó sì jẹ́ ọ̀rọ̀ tí ó ṣe kedere fún òǹkàwé Yorùbá.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ẹ kò sì mọ agbára Ọlọ́run
  rationale: Àtúnṣe gbolohun-ìṣe náà jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣọ̀kan μὴ ... μηδέ (“bẹ́ẹ̀ kọ́ ... bẹ́ẹ̀ sì kọ́”) hàn, nígbà tí “agbára Ọlọ́run” túmọ̀ δύναμιν τοῦ θεοῦ ní tààrà.
theological_decisions:
- issue: Ohun tí ó fa àṣìṣe àwọn Sadusí
  choice: Jésù sọ pé wọ́n ń ṣìnà nítorí wọn kò mọ àwọn Ìwé Mímọ́, wọn kò sì mọ agbára Ọlọ́run.
  alternative: Kí a ka ọ̀rọ̀ náà sí ẹ̀sùn pé wọ́n ṣìnà lásán, láìfi àìmọ̀ wọn hàn gẹ́gẹ́ bí ìdí.
  rationale: μὴ εἰδότες pẹ̀lú àwọn ohun méjèèjì tí ó tẹ̀ lé e ń ṣàlàyé ìdí ìṣìnà wọn. Ìtumọ̀ Yorùbá fi ìbáṣepọ̀ ìdí náà hàn láìfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A lo àmì ohùn ní kíkún, a sì yan gbolohun tí ó rọrùn fún àwọn òǹkàwé gbogbogbò láìsọ agbára tàbí líle ọ̀rọ̀ Jésù di fífẹ́.
