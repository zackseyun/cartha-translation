source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: yo
  text: Nígbà tí wọ́n gbọ́ èyí,[a] ẹnu yà wọ́n; wọ́n sì fi í sílẹ̀, wọ́n sì lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn tí wọ́n gbọ́ èyí, ẹnu yà wọ́n; wọ́n sì fi í sílẹ̀, wọ́n sì lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: nígbà tí wọ́n gbọ́ èyí
  rationale: Ọ̀rọ̀ ìṣe aláìlópìn aorist participle náà ń fi ìṣe tí ó ṣáájú ìṣe pàtàkì hàn. Gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá; “èyí” sì ń tọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ sọ, bí ó tilẹ̀ jẹ́ pé ohun tí wọ́n gbọ́ kò fara hàn ní kedere nínú Gíríìkì.
- source_word: ἐθαύμασαν
  choice: ẹnu yà wọ́n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere láti sọ pé ohun kan ya àwọn ènìyàn lẹ́nu tàbí mú kí wọ́n ṣe kàyéfì.
- source_word: ἀφέντες αὐτὸν
  choice: wọ́n fi í sílẹ̀
  rationale: Ó túmọ̀ sí pé wọ́n fi Jésù sílẹ̀, wọ́n sì kúrò lọ́dọ̀ rẹ̀. A kò fi “ní òun nìkan” kún un, nítorí ìtumọ̀ yẹn kò fara hàn gbangba nínú Gíríìkì.
- source_word: ἀπῆλθαν
  choice: wọ́n lọ
  rationale: Nínú àyíká yìí, “wọ́n lọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún kíkúrò lọ́dọ̀ ẹni, láìlo èdè àtijọ́ tàbí èdè líle.
- source_word: καὶ ... καὶ
  choice: sì ... sì
  rationale: Àtúnlò “sì” ń pa ìsopọ̀ àti ìtẹ̀síwájú àwọn ìṣe mọ́, bí καί ṣe rí nínú Gíríìkì, ní èdè Yorùbá tó rọ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa bí àwọn ìṣe ṣe tẹ̀ lé ara wọn mọ́, kò sì fi ìtumọ̀ tí kò sí nínú orísun kún un.
