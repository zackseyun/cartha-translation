id: MAT.22.12
reference: Matthew 22:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: yo
  text: Ó sì wí fún un pé, “Ọ̀rẹ́, báwo ni o ṣe wọlé síbí láìní aṣọ ìgbéyàwó?” Ṣùgbọ́n ẹnu rẹ̀ dí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a pa á lẹ́nu mọ́.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “a fi ìjánu dí ẹnu rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Ọ̀rẹ́
  rationale: Ọ̀rọ̀ ìpè yìí jẹ́ ọ̀nà ìbánisọ̀rọ̀ ọlọ́wọ̀, ṣùgbọ́n ó tún ní ìjìnnà àti ìbáwí nínú àyíká yìí. “Ọ̀rẹ́” jẹ́ èdè Yorùbá àdánidá tí kò fi ìkórìíra tàbí ìfẹ́ tímọ́tímọ́ kún ohun tí Gíríìkì sọ.
- source_word: πῶς
  choice: báwo ni
  rationale: Ó béèrè ọ̀nà tàbí bí ìwọlé náà ṣe ṣẹlẹ̀, kì í ṣe ìdí ọkàn ẹni náà; “báwo ni” pa ìtumọ̀ yẹn mọ́.
- source_word: εἰσῆλθες ὧδε
  choice: o ṣe wọlé síbí
  rationale: Ó tọ́ka sí ìṣe ìwọlé tí ó ti ṣẹlẹ̀, “wọlé síbí” sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá òde òní.
- source_word: μὴ ἔχων
  choice: láìní
  rationale: Ó fi hàn pé aṣọ tí a ń béèrè nípa rẹ̀ kò sí lọ́wọ́ ọkùnrin náà; “láìní” mú ìtumọ̀ àfikún participle náà jáde ní ṣókí.
- source_word: ἔνδυμα γάμου
  choice: aṣọ ìgbéyàwó
  rationale: Ẹyọ aṣọ kan tí ó bá ayẹyẹ ìgbéyàwó mu ni gbolohun Gíríìkì náà ń tọ́ka sí. Ìtumọ̀ yìí kò pinnu irú aṣọ náà ju ohun tí orísun sọ lọ.
- source_word: ἐφιμώθη
  choice: ẹnu rẹ̀ dí
  rationale: Ọ̀rọ̀ náà túmọ̀ ní ti gidi sí dídi ẹnu mọ́ tàbí fífi ìjánu sí ẹnu, ó sì lè túmọ̀ sí pé ẹni náà kò lè dáhùn. “Ẹnu rẹ̀ dí” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa àwòrán ẹnu dídí àti àìlèdáhùn mọ́.
theological_decisions:
- issue: Ìró ohùn olùgbàlejò nígbà tí ó pe àlejò tí kò wọ aṣọ tó yẹ
  choice: 'Ọ̀rọ̀ ọlọ́wọ̀ ṣùgbọ́n tí ó ní ìbáwí nínú: “Ọ̀rẹ́”'
  alternative: “Ẹlẹgbẹ́” tàbí ọ̀rọ̀ tó le sí i
  rationale: “Ọ̀rẹ́” pa ìforígbárí inú ìtàn mọ́ láìfi ìfẹ́ tímọ́tímọ́ tàbí ẹ̀gàn tí kò sí nínú Gíríìkì kún un.
- issue: Ìtumọ̀ ἐφιμώθη
  choice: 'Àkànlò-èdè tí ó pa àwòrán orísun mọ́: “ẹnu rẹ̀ dí”'
  alternative: “kò lè dáhùn” tàbí “a pa á lẹ́nu mọ́”
  rationale: Yíyan yìí ṣàfihàn pé kò lè fèsì, ó sì tún pa ìdí-ẹnu-mọ́ inú ọ̀rọ̀ Gíríìkì mọ́ láìdáhùn ìbéèrè bóyá agbára òde ló mú un dákẹ́ tàbí bóyá kò rí ohun sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “wọlé síbí” dípò ọ̀nà líle bí “wọ inú ibí yìí,” a sì lo “ẹnu rẹ̀ dí” láti jẹ́ kí ìtumọ̀ àti àwòrán Gíríìkì dúró papọ̀.
