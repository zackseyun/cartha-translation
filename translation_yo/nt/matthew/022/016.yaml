id: MAT.22.16
reference: Matthew 22:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: yo
  text: Wọ́n sì rán àwọn ọmọ-ẹ̀yìn wọn sí i pẹ̀lú àwọn Hẹ́rọ́díà[a], wọ́n ní, “Olùkọ́, a mọ̀ pé olóòótọ́ ni ọ́, o sì ń fi òtítọ́ kọ́ni nípa ọ̀nà Ọlọ́run. Ìwọ kì í jẹ́ kí ẹnikẹ́ni ní ipa lórí rẹ, nítorí ìwọ kì í wo ojú ènìyàn[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn Hẹ́rọ́díà jẹ́ ẹgbẹ́ kan tí ó ní ìsopọ̀ pẹ̀lú Hẹ́rọ́dù.
    reason: historical_term
  - marker: b
    text: Ìtumọ̀ ọ̀rọ̀ yìí ni pé, “ìwọ kì í ṣe ojúsàájú sí àwọn ènìyàn,” tàbí “ìwọ kì í dáni lẹ́jọ́ nípa ohun tí ojú rí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: Wọ́n sì rán
  rationale: Yorùbá narrative naturally uses the unmarked serial form here; it presents the event clearly without forcing an unnatural historical-present construction.
- source_word: μαθητὰς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: This is the established, natural Yoruba term for disciples or committed followers in the Gospel context.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: pẹ̀lú àwọn ọmọ ẹgbẹ́ Hẹ́rọ́dù
  rationale: This communicates association with Herod’s party more transparently than a bare transliteration, while retaining the group’s historical identity.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: A direct and dignified Yoruba address meaning teacher.
- source_word: ἀληθὴς
  choice: olóòótọ́
  rationale: In this personal predication, olóòótọ́ naturally conveys being truthful and genuine.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ọ̀nà Ọlọ́run
  rationale: Preserves the source metaphor of God’s way rather than reducing it to isolated teaching.
- source_word: ἐν ἀληθείᾳ
  choice: fi òtítọ́
  rationale: Natural Yoruba expression conveying that the teaching is done truthfully and in accordance with truth.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Ìwọ kì í jẹ́ kí ẹnikẹ́ni nípa lórí rẹ
  rationale: Avoids suggesting moral indifference and expresses the contextual force that no person’s standing or opinion sways him.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: nítorí ìwọ kì í wo ojú ènìyàn
  rationale: Retains the face-looking idiom in a concise Yoruba form, with its impartiality sense clarified in a footnote.
theological_decisions:
- issue: Idiomatic expression of impartiality
  choice: The main text says that no one influences him and that he does not look at a person’s face.
  alternative: ìwọ kì í ṣe ojúsàájú sí àwọn ènìyàn (you do not show partiality to people)
  rationale: The wording preserves the source’s vivid face idiom while the preceding clause prevents it from sounding like lack of compassion; the footnote makes the impartiality sense explicit.
translation_notes:
  register: Standard modern Yoruba with full tone marks, dignified but accessible. The dialogue remains formal enough for public Scripture reading while avoiding archaic or denominational wording.
