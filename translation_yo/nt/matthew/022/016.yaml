revisions:
- from: Wọ́n sì rán àwọn ọmọ-ẹ̀yìn wọn sí i pẹ̀lú àwọn ọmọ ẹgbẹ́ Hẹ́rọ́dù[a], wọ́n ní, “Olùkọ́, a mọ̀ pé olóòótọ́ ni ọ́, o sì ń fi òtítọ́ kọ́ni nípa ọ̀nà Ọlọ́run. Ìwọ kì í jẹ́ kí ẹnikẹ́ni nípa lórí rẹ, nítorí ìwọ kì í wo ojú ènìyàn[b].”
  to: Wọ́n sì rán àwọn ọmọ-ẹ̀yìn wọn sí i pẹ̀lú àwọn Hẹ́rọ́díà[a], wọ́n ní, “Olùkọ́, a mọ̀ pé olóòótọ́ ni ọ́, o sì ń fi òtítọ́ kọ́ni nípa ọ̀nà Ọlọ́run. Ìwọ kì í jẹ́ kí ẹnikẹ́ni ní ipa lórí rẹ, nítorí ìwọ kì í wo ojú ènìyàn[b].”
  rationale: The revision retains the draft’s natural rendering of the two related idioms concerning freedom from human influence and impartiality. It corrects the Yoruba idiom for influence and preserves the historically uncertain group name by transliteration, with a deliberately restrained explanatory footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s sequence and central claims well. However, “àwọn ọmọ ẹgbẹ́ Hẹ́rọ́dù” does not safely identify the historical designation Ἡρῳδιανοί, and its footnote overstates a disputed historical characterization. The expression “nípa lórí rẹ” is also malformed; “ní ipa lórí rẹ” is the natural Yoruba expression for influence.
  naturalness: The Yoruba is generally clear and appropriately dignified. Revising the Herodians designation to a transliterated group name and correcting “nípa” to “ní ipa” produces more natural and precise Standard Yoruba.
  terminology: “Àwọn ọmọ-ẹ̀yìn,” “Olùkọ́,” “olóòótọ́,” “ọ̀nà Ọlọ́run,” and “ojú ènìyàn” are suitable. “Àwọn Hẹ́rọ́díà” preserves the proper historical group name without treating it as a defined membership in Herod himself.
  issues:
  - severity: medium
    issue: The rendering “àwọn ọmọ ẹgbẹ́ Hẹ́rọ́dù” inaccurately recasts the Herodians as members of Herod.
    rationale: Ἡρῳδιανοί is a historical group designation, not a phrase meaning Herod’s personal members. A transliteration preserves the source designation and avoids unwarranted historical specificity.
  - severity: medium
    issue: Footnote a says the Herodians were people who supported Herod’s kingdom.
    rationale: Their precise identity and political alignment are not fully settled. The note should identify them conservatively as a group associated with Herod, without asserting a specific program.
  - severity: low
    issue: “jẹ́ kí ẹnikẹ́ni nípa lórí rẹ” uses “nípa” where “ní ipa” is required.
    rationale: “Ní ipa lórí” is the standard Yoruba expression for having influence over someone.
  revised_text: Wọ́n sì rán àwọn ọmọ-ẹ̀yìn wọn sí i pẹ̀lú àwọn Hẹ́rọ́díà[a], wọ́n ní, “Olùkọ́, a mọ̀ pé olóòótọ́ ni ọ́, o sì ń fi òtítọ́ kọ́ni nípa ọ̀nà Ọlọ́run. Ìwọ kì í jẹ́ kí ẹnikẹ́ni ní ipa lórí rẹ, nítorí ìwọ kì í wo ojú ènìyàn[b].”
  revised_footnotes:
  - marker: a
    text: Àwọn Hẹ́rọ́díà jẹ́ ẹgbẹ́ kan tí ó ní ìsopọ̀ pẹ̀lú Hẹ́rọ́dù.
    reason: historical_term
  - marker: b
    text: Ìtumọ̀ ọ̀rọ̀ yìí ni pé, “ìwọ kì í ṣe ojúsàájú sí àwọn ènìyàn,” tàbí “ìwọ kì í dáni lẹ́jọ́ nípa ohun tí ojú rí.”
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s natural rendering of the two related idioms concerning freedom from human influence and impartiality. It corrects the Yoruba idiom for influence and preserves the historically uncertain group name by transliteration, with a deliberately restrained explanatory footnote.
