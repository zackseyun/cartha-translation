  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: yo
  text: Ní àjíǹde náà, aya ẹni wo nínú àwọn méje náà ni yóò jẹ́? Nítorí gbogbo wọn ló fẹ́ ẹ́ ní aya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà jù bẹ́ẹ̀ lọ, ‘Nítorí gbogbo wọn ní í.’ Nínú àyíká yìí, èyí túmọ̀ sí pé gbogbo àwọn méje náà fẹ́ ẹ́ ní aya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: nígbà àjíǹde
  rationale: Ọ̀rọ̀ náà tọ́ka sí àjíǹde àwọn òkú ní ọjọ́ iwájú; ‘nígbà’ mú ipa ἐν pẹ̀lú dátífù hàn lọ́nà Yorùbá àdánidá.
- source_word: οὖν
  choice: nígbà náà
  rationale: Ó so ìbéèrè náà mọ́ àbájáde ìtàn tí wọ́n ṣẹ̀ṣẹ̀ sọ, ó sì bá ọ̀nà ìbéèrè Yorùbá mu.
- source_word: τίνος τῶν ἑπτὰ
  choice: aya ta nínú àwọn méje náà
  rationale: Ó pa ìbéèrè nípa ẹni wo lára àwọn arákùnrin méje náà tí obìnrin náà yóò jẹ́ aya rẹ̀ mọ́.
- source_word: γυνή
  choice: aya
  rationale: Bí ó tilẹ̀ jẹ́ pé γυνή lè túmọ̀ sí ‘obìnrin,’ ọ̀rọ̀ nípa ìgbéyàwó nínú àyíká yìí béèrè ‘aya.’
- source_word: ἔσται
  choice: ni yóò jẹ́
  rationale: Ó fi ọ̀rọ̀ ọjọ́ iwájú hàn ní kedere àti lọ́nà Yorùbá tó ṣe déédéé.
- source_word: πάντες γὰρ
  choice: nítorí gbogbo wọn ló
  rationale: ‘Nítorí’ pa ipa àlàyé γάρ mọ́, ‘gbogbo wọn’ sì tọ́ka sí gbogbo arákùnrin méje náà.
- source_word: ἔσχον αὐτήν
  choice: fẹ́ ẹ́ ní aya
  rationale: Ní àyíká yìí, gbolohun Gíríìkì náà jẹ́ ọ̀nà ṣókí láti sọ pé gbogbo wọn ní ìbáṣepọ̀ ìgbéyàwó pẹ̀lú rẹ̀. Èyí jẹ́ Yorùbá àdánidá; àlàyé ìtumọ̀ gangan wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἀνάστασις nínú ìpèníjà àwọn Sadusí
  choice: Àjíǹde àwọn òkú ní ọjọ́ iwájú
  alternative: Ìwàláàyè lẹ́yìn ikú ní ìtumọ̀ gbogbogbò
  rationale: Àyíká ọ̀rọ̀ fi hàn pé àwọn Sadusí ń jiyàn nípa àjíǹde pàtó, Jésù sì dáhùn lórí kókó yẹn; ìtumọ̀ náà kò gbọ̀òrò ju ẹ̀rí inú ẹsẹ̀ lọ.
translation_notes:
  register: Yorùbá àkọ́sọ, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘nígbà àjíǹde’ dípò ọ̀rọ̀ àlùmọ́ọ́nì, a sì gbé àmì àlàyé [a] sí ibi tí ó bá ἔσχον αὐτήν mu.
