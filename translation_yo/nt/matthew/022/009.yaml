source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: yo
  text: Nítorí náà, ẹ lọ sí àwọn ibi ìpàdé ọ̀nà[a], kí ẹ sì pe gbogbo àwọn tí ẹ bá rí sí àsè ìgbéyàwó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sí àwọn oríta ọ̀nà” tàbí “sí àwọn ibi àbájáde ọ̀nà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibi tí àwọn ọ̀nà ti pàdé, ti pínyà, tàbí ti jáde.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “sí àwọn ìgbéyàwó”; èyí jẹ́ àṣà ọ̀rọ̀ tó túmọ̀ sí ayẹyẹ tàbí àsè ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: ẹ lọ
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. “Ẹ lọ” jẹ́ ọ̀nà Yorùbá àdánidá, tó sì pa agbára àṣẹ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìyọrísí ọ̀rọ̀ tó ṣáájú hàn ní kedere.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: sí àwọn ibi tí àwọn ọ̀nà ti pàdé tàbí ti pínyà
  rationale: διέξοδοι lè tọ́ka sí ibi tí àwọn ọ̀nà ti pàdé, ti pínyà, tàbí sí àwọn ọ̀nà àbájáde. Gbólóhùn yìí sọ ìtumọ̀ náà ní Yorùbá àdánidá láì fi ẹ̀ka kan ṣoṣo múlẹ̀.
- source_word: ὅσους ἐὰν εὕρητε
  choice: gbogbo àwọn tí ẹ bá rí
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ àìní ààlà—iye àwọn tí wọn yóò rí. “Gbogbo àwọn tí ẹ bá rí” mú ìfẹ̀ gbígbòòrò yìí jáde dáadáa.
- source_word: καλέσατε
  choice: ẹ sì pe
  rationale: Nínú àyíká àsè, καλέω túmọ̀ sí pípe tàbí fífúnni ní ìkésíni. “Pe ... sí àsè” jẹ́ àsọyé Yorùbá tó wọ́pọ̀ fún ìkésíni.
- source_word: εἰς τοὺς γάμους
  choice: sí àsè ìgbéyàwó
  rationale: Bí ó tilẹ̀ jẹ́ pé γάμους jẹ́ ọ̀pọ̀ nínú Gíríìkì, níbí ó jẹ́ àṣà ọ̀rọ̀ fún ayẹyẹ tàbí àsè ìgbéyàwó, kì í ṣe ọ̀pọ̀ ìgbéyàwó.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀rọ̀ àṣẹ ọlọ́wọ̀ “ẹ” fún ọ̀pọ̀ ènìyàn. Ìforúkọsílẹ̀ náà jẹ́ ti ìgbàlódé, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
