id: MAT.22.6
reference: Matthew 22:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn yòókù gbá àwọn ẹrú rẹ̀[a] mú, wọ́n hùwà ìkà sí wọn, wọ́n sì pa wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Ṣùgbọ́n àwọn yòókù
  rationale: “Àwọn yòókù” tọ́ka sí àwọn tí ó ṣẹ́ kù lára àwọn tí a pè; “ṣùgbọ́n” sì mú ìyàtọ̀ kékeré tí δέ fi hàn láàárín wọn àti àwọn tí ẹsẹ tó ṣáájú sọ pé wọn kò kọbi ara sí ìpè náà.
- source_word: κρατήσαντες
  choice: gbá … mú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú ẹnì kan ṣinṣin tàbí fífi agbára mú un. Ìtòlẹ́sẹẹsẹ àwọn gbólóhùn Yorùbá fi hàn pé wọ́n kọ́kọ́ mú wọn, lẹ́yìn náà ni wọ́n hùwà ìkà sí wọn tí wọ́n sì pa wọ́n.
- source_word: τοὺς δούλους αὐτοῦ
  choice: àwọn ẹrú rẹ̀
  rationale: δοῦλος lè túmọ̀ sí ẹrú tàbí ìránṣẹ́. Nínú àkàwé yìí, àwọn tí ọba ní tí ó sì rán lọ ni wọ́n; “ẹrú” fi ipò wọn hàn ní kedere, nígbà tí àlàyé ìsàlẹ̀ pa “ìránṣẹ́” mọ́ gẹ́gẹ́ bí ìtumọ̀ míì tó ṣeé gbà.
- source_word: ὕβρισαν
  choice: wọ́n hùwà ìkà sí wọn
  rationale: ὑβρίζω ní ìtumọ̀ fífi ìtìjú àti ìwà ipá bá ẹnì kan lò, kì í ṣe ọ̀rọ̀ ẹ̀gàn nìkan. Gbólóhùn Yorùbá yìí jẹ́ ti àdánidá, ó sì gba ìtumọ̀ ìlòkulò tó gbòòrò náà.
- source_word: ἀπέκτειναν
  choice: wọ́n sì pa wọ́n
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì bójú mu fún pípa ènìyàn; kò fi ìtumọ̀ òfin mìíràn kún ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àkàwé ọba yìí
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: “Ẹrú” pa òtítọ́ ipò àwùjọ tí δοῦλος lè tọ́ka sí mọ́ láìfi ẹ̀kọ́ ìsìn mìíràn kún un. Síbẹ̀, “ìránṣẹ́” náà bá iṣẹ́ tí wọ́n ń ṣe gẹ́gẹ́ bí aṣojú ọba mu, nítorí náà a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ṣeé yé fún òǹkàwé òde òní ni a lò. “Gbá … mú” mú agbára inú κρατέω jáde, “hùwà ìkà sí wọn” sì jẹ́ ọ̀nà àdánidá láti sọ ìlòkulò àti ìtìjú tí ὑβρίζω ní nínú.
