base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: yo
  text: Ní ọjọ́ náà, àwọn Sadusí, tí wọ́n ń sọ pé àjíǹde kò sí, wá sọ́dọ̀ rẹ̀[a], wọ́n sì béèrè lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ṣókí kedere sí i: “Àwọn Sadusí, tí wọ́n ń sọ pé àjíǹde kò sí, wá sọ́dọ̀ rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ní ọjọ́ náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi àkókò tí ọ̀rọ̀ Gíríìkì tọ́ka sí hàn, láì fi ọ̀rọ̀ kún un pé ọjọ́ kan náà ni.
- source_word: προσῆλθον αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Gbólóhùn yìí túmọ̀ sí pé wọ́n sún mọ́ ọn tàbí wọ́n wá bá a; “tọ̀ ọ́ wá” bá ìṣàn ìtàn Yorùbá mu, ó sì pa ìtumọ̀ náà mọ́.
- source_word: Σαδδουκαῖοι
  choice: àwọn Sadusí
  rationale: “Sadusí” ni àkọsílẹ̀ orúkọ ẹgbẹ́ Júù yìí tí ó ti wọ́pọ̀ nínú Yorùbá; “àwọn” fi hàn pé ọ̀pọ̀ ènìyàn ni.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: wọ́n ń sọ pé àjíǹde kò sí
  rationale: Èyí pa ìrísí participle Gíríìkì àti ohun tí wọ́n gbà gbọ́ mọ́, láì sọ ọ́ di ẹ̀kọ́ tí akọ̀wé ń fọwọ́ sí.
- source_word: ἀνάστασιν
  choice: àjíǹde
  rationale: “Àjíǹde” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún jíjí dìde kúrò nínú òkú, ó sì yẹ fún àyíká ẹ̀kọ́ ìgbàgbọ́ yìí.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: wọ́n sì béèrè lọ́wọ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún bíbéèrè ohun kan lọ́wọ́ ẹni; ó tún lè gba ìtumọ̀ ìbéèrè àdánwò tàbí ìbéèrè líle nínú àyíká náà láì fi ìtumọ̀ yẹn lé e lórí.
theological_decisions:
- issue: Bí a ṣe máa sọ ìkọ̀ ẹ̀kọ́ àwọn Sadusí nípa àjíǹde
  choice: wọ́n ń sọ pé àjíǹde kò sí
  alternative: àwọn Sadusí, tí wọ́n sọ pé àjíǹde kò sí
  rationale: Àyànfẹ́ náà tẹ̀ lé participle λέγοντες ní pẹkipẹki, ó sì jẹ́ kí àìdájú kékeré wà bóyá èyí jẹ́ ohun tí wọ́n ń sọ nígbà náà tàbí ìgbàgbọ́ tí a fi mọ̀ wọ́n. Àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ọ̀nà tí ó tú u sí gbangba sí i.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, tí ó ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “Sadusí” gẹ́gẹ́ bí orúkọ ẹgbẹ́ tí ó wọ́pọ̀ nínú ìtumọ̀ Bíbélì Yorùbá.
