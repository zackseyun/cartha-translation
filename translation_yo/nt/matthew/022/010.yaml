id: MAT.22.10
reference: Matthew 22:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: yo
  text: Àwọn ẹrú náà sì jáde lọ sí àwọn ojú ọ̀nà, wọ́n sì kó gbogbo àwọn tí wọ́n rí jọ, ẹni búburú àti ẹni rere[a]. Ibi àsè ìgbéyàwó[b] sì kún fún àwọn àlejò tí wọ́n rọ̀gbọ̀kú láti jẹun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹni tí kò dára àti ẹni rere.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ìgbéyàwó” ni; níhìn-ín ó ṣeé ṣe kí ọ̀rọ̀ náà túmọ̀ sí àsè ìgbéyàwó tàbí ibi tí àsè náà ti ń lọ, nítorí a sọ pé ó kún fún àwọn tó ń jẹun.
    reason: lexical_alternative
  - marker: c
    text: Ní àṣà àsè ìgbà náà, àwọn ènìyàn máa ń rọ̀gbọ̀kú nígbà tí wọ́n bá ń jẹun.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: àwọn ẹrú
  rationale: “Ẹrú” pa ipò ìdè àti àṣẹ ọba tó wà nínú àkàwé náà mọ́, láì sọ ọ́ di “ìránṣẹ́” lásán.
- source_word: ὁδοὺς
  choice: àwọn ojú ọ̀nà
  rationale: Ó túmọ̀ sí àwọn ọ̀nà gbogbogbò níbi tí a ti lè rí àwọn ènìyàn; “ojú ọ̀nà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀pọ̀ nọ́ńbà mu.
- source_word: συνήγαγον
  choice: kó ... jọ
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n kó àwọn ènìyàn pọ̀ sí ibi kan.
- source_word: πάντας οὓς εὗρον
  choice: gbogbo àwọn tí wọ́n rí
  rationale: Ó pa ìtumọ̀ àpapọ̀ πάντας àti gbólóhùn ìbátan οὓς εὗρον mọ́.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: ẹni búburú àti ẹni rere
  rationale: Ó pa ìyàtọ̀ ìwà rere àti ìwà búburú inú Gíríìkì mọ́, ó sì fi hàn pé wọ́n kó gbogbo irú ènìyàn jọ.
- source_word: γάμος
  choice: ibi àsè ìgbéyàwó
  rationale: Níwọ̀n bí a ti sọ pé ó kún fún àwọn tó ń jẹun, ibi ayẹyẹ tàbí gbọ̀ngàn àsè ni ọ̀rọ̀ náà ń tọ́ka sí ní àyíká yìí.
- source_word: ἐπλήσθη
  choice: kún fún
  rationale: Ó sọ ní tààrà pé ibi náà di kíkún fún àwọn ènìyàn.
- source_word: ἀνακειμένων
  choice: àwọn àlejò tí wọ́n rọ̀gbọ̀kú láti jẹun
  rationale: Ó pa ìṣe ìrọ̀gbọ̀kú nígbà àsè mọ́, ó sì ṣàlàyé pé àwọn tó wà níbẹ̀ jẹ́ àlejò àsè.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe ìwà àwọn tí a kó jọ
  choice: ẹni búburú àti ẹni rere
  alternative: ẹni tí kò dára àti ẹni rere
  rationale: “Búburú” pa agbára ìdájọ́ ìwà inú πονηρός mọ́. Ẹsẹ̀ náà tẹnumọ́ bí ìkésíni ṣe dé ọ̀dọ̀ onírúurú ènìyàn, láì pinnu níbí ohun tí àkàwé náà yóò sọ lẹ́yìn náà nípa àwọn tó wá síbi àsè.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “ẹrú” láti má ṣe rọ ìtumọ̀ ipò δοῦλοι.
