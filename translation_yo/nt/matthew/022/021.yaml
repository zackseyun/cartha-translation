id: MAT.22.21
reference: Matthew 22:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: yo
  text: Wọ́n dá a lóhùn pé, “Ti Késárì ni.” Nígbà náà ni ó sọ fún wọn pé, “Nítorí náà, ẹ dá[a] ohun tí ó jẹ́ ti Késárì padà fún Késárì, kí ẹ sì dá ohun tí ó jẹ́ ti Ọlọ́run padà fún Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ẹ san,” “ẹ fi fún,” tàbí “ẹ fi ohun tí ó tọ́ sí ẹni fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Wọ́n dá a lóhùn pé
  rationale: Ọ̀rọ̀ náà jẹ́ ìdáhùn sí ìbéèrè tí Jésù ṣẹ̀ṣẹ̀ béèrè; ‘dá a lóhùn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ yìí. A tú present historical náà sí ìṣe tó ti ṣẹlẹ̀ nínú ìtàn.
- source_word: Καίσαρος
  choice: Ti Késárì ni
  rationale: Genitive náà dáhùn ìbéèrè ẹni tí àwòrán àti àkọlé owó náà jẹ́ tirẹ̀. ‘Ti Késárì ni’ jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: τότε λέγει αὐτοῖς
  choice: Nígbà náà ni ó sọ fún wọn pé
  rationale: ‘Nígbà náà’ fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ hàn, ‘ó sọ fún wọn’ sì tú historical present náà ní ọ̀nà àdánidá.
- source_word: Ἀπόδοτε
  choice: ẹ dá … padà fún
  rationale: ἀποδίδωμι lè túmọ̀ sí fífi ohun padà tàbí sísan ohun tí ó tọ́ sí ẹni. ‘Dá … padà fún’ pa ìrònú ohun tí ó jẹ́ ti ẹnì kan mọ́, ó sì ṣiṣẹ́ nínú apá Késárì àti apá Ọlọ́run.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ Jésù jẹ́ ìpinnu tó jáde láti inú ìdáhùn wọn nípa ẹni tí owó náà jẹ́ tirẹ̀.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: ohun tí ó jẹ́ ti Késárì … fún Késárì
  rationale: Èyí pa ìtumọ̀ neuter plural àti ìbáṣepọ̀ ohun-ìní mọ́, láì fi ọ̀rọ̀ náà mọ́ owó-orí nìkan.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: ohun tí ó jẹ́ ti Ọlọ́run … fún Ọlọ́run
  rationale: Ìtumọ̀ náà pa ìṣọ̀kan àti ìwọ̀ntúnwọ̀nsì gbolohun méjèèjì mọ́, ó sì lo ‘Ọlọ́run’ fún θεός nínú àyíká yìí.
theological_decisions:
- issue: Ìwọ̀n àṣẹ Jésù nípa ojúṣe sí ìjọba àti sí Ọlọ́run
  choice: 'A pa àṣẹ méjèèjì mọ́ ní ìṣọ̀kan: ohun tí ó jẹ́ ti Késárì fún Késárì, àti ohun tí ó jẹ́ ti Ọlọ́run fún Ọlọ́run.'
  alternative: Kí a fi ọ̀rọ̀ náà mọ́ sísan owó-orí nìkan, tàbí kí a tú u bí ìfọwọ́sí àṣẹ ìjọba láìní ààlà.
  rationale: Gíríìkì kò ṣàlàyé ẹ̀kọ́ ìṣèlú kan ní kíkún, bẹ́ẹ̀ ni kò sọ pé ọ̀rọ̀ náà kan owó-orí nìkan. Ìtumọ̀ náà jẹ́ kí ìyàtọ̀ àti ìfọ̀kànsìn tó wà láàárín ojúṣe sí Késárì àti ohun tí Ọlọ́run ní ẹ̀tọ́ sí dúró.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye ni a lò. A lo ‘ẹ’ gẹ́gẹ́ bí àṣẹ sí ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn síbi tí ó bá jẹ́ àdánidá. ‘Késárì’ ni àkọsílẹ̀ Yorùbá fún Καῖσαρ.
