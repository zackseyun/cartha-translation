id: MAT.22.45
reference: Matthew 22:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: yo
  text: Ǹjẹ́ bí Dáfídì bá ń pè é ní ‘Olúwa,’ báwo ni ó ṣe jẹ́ ọmọ rẹ̀? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ṣíṣàlàyé ohun tí àyíká ọ̀rọ̀ náà ń tọ́ka sí dáadáa sí i: “Ǹjẹ́ bí Dáfídì bá ń pe Mèsáyà ní ‘Olúwa,’ báwo ni ó ṣe jẹ́ ọmọ rẹ̀?”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: Ǹjẹ́ bí … bá
  rationale: Ó pa agbára àídájú àti ìtẹ̀síwájú àríyànjiyàn εἰ οὖν mọ́ ní Yorùbá àdánidá; ‘Ǹjẹ́’ so ìbéèrè náà mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ, ‘bí … bá’ sì fi ipò àídájú hàn.
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Àkọtọ̀ orúkọ tí ó wọ́pọ̀ nínú Yorùbá, pẹ̀lú àmì ohùn.
- source_word: καλεῖ αὐτὸν κύριον
  choice: ń pè é ní ‘Olúwa’
  rationale: ‘Pè … ní’ túmọ̀ ìtumọ̀ fífi orúkọ tàbí oyè kan ẹni lórí; ‘Olúwa’ pa ìwọ̀n ọlá àti ìró orin Dáfídì 110:1 mọ́.
- source_word: πῶς
  choice: báwo
  rationale: Ó gbé ìbéèrè nípa bí àwọn ọ̀rọ̀ méjèèjì ṣe lè bá ara wọn mu kalẹ̀ ní ọ̀nà tààrà.
- source_word: υἱὸς αὐτοῦ ἐστιν
  choice: ni ó ṣe jẹ́ ọmọ rẹ̀
  rationale: ‘Ọmọ rẹ̀’ pa èdè ìbátan àti ìlérí ìran ọba mọ́, láì tú ú sí ‘àtọmọdọ́mọ’ tàbí yanjú ìforígbárí inú ọ̀rọ̀ náà.
theological_decisions:
- issue: Agbára Mèsáyà àti ti Kristi nínú bí Dáfídì ṣe pe ẹni náà ní ‘Olúwa’ síbẹ̀ tí ó jẹ́ ọmọ rẹ̀
  choice: A fi ‘Olúwa’ àti ‘ọmọ rẹ̀’ sílẹ̀ láì fi ‘Mèsáyà’ kún ẹsẹ pàtàkì.
  alternative: Bí Dáfídì bá ń pe Mèsáyà ní ‘Olúwa,’ báwo ni Mèsáyà ṣe jẹ́ ọmọ rẹ̀?
  rationale: Ọ̀rọ̀ Gíríìkì ní arọ́pò-orúkọ ‘ẹni náà,’ kì í ṣe ọ̀rọ̀ ‘Mèsáyà’ nínú ẹsẹ yìí. Ìtumọ̀ yìí pa ìfarapamọ́ ìtọ́kasí láti inú àyíká àti ìforígbárí láàárín jíjẹ́ ọmọ Dáfídì àti jíjẹ́ Olúwa rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlá tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ǹjẹ́ bí … bá’ fún àríyànjiyàn àídájú, a sì yà oyè ‘Olúwa’ sọ́tọ̀ pẹ̀lú àmì àyọlò. Àmì àlàyé [a] wà nínú ọ̀rọ̀ pàtàkì.
