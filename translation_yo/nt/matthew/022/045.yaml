  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ó pa ìbáṣepọ̀ àròjinlẹ̀ εἰ οὖν, ìṣe καλεῖ, oyè κύριον, àti ìbéèrè ìforígbárí πῶς ... υἱὸς αὐτοῦ ἐστιν mọ́. ‘Ọmọ rẹ̀’ dá ìbátan Dáfídì–Mèsáyà sílẹ̀ láì fẹ̀ ẹ́ sí ‘àtọmọdọ́mọ’ tàbí láti yanjú ìforígbárí náà.'
