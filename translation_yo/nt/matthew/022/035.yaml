id: MAT.22.35
reference: Matthew 22:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: yo
  text: Ọ̀kan nínú wọn, amòfin[a], béèrè lọ́wọ́ rẹ̀ láti dán an wò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “amọ̀wé nínú Òfin.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tó mọ òfin àwọn Júù nípa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀)
  rationale: Ní Yorùbá, bẹ̀rẹ̀ gbólóhùn yìí pẹ̀lú “Àti” kò bá ìṣàn àkọsílẹ̀ mu dáadáa; ìtẹ̀síwájú ìtàn náà ṣì hàn láìfi àsopọ̀ náà sílẹ̀ ní gbangba.
- source_word: ἐπηρώτησεν
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Ó túmọ̀ sí bíbéèrè tàbí fífi ìbéèrè kan sí ẹnì kan; gbolohun yìí jẹ́ Yorùbá àdánidá, kò sì fi ìtumọ̀ ìfọ̀rọ̀wánilẹ́nuwò líle kún un.
- source_word: εἷς ἐξ αὐτῶν
  choice: Ọ̀kan nínú wọn
  rationale: Ó pa ìtumọ̀ apá-nínú-àpapọ̀ mọ́ pé ẹni náà wà lára ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: νομικὸς
  choice: amòfin
  rationale: Nínú àyíká Júù yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tó mọ Òfin Mósè nípa; àlàyé ẹsẹ̀ ìsàlẹ̀ yọ ewu kí onkáwé má bà á mọ agbẹjọ́rò òde òní kúrò.
- source_word: πειράζων
  choice: láti dán an wò
  rationale: Ó fi ète ìbéèrè náà hàn gẹ́gẹ́ bí ìdánwò tàbí ìwádìí ọ̀tá, láìdín ìtumọ̀ rẹ̀ kù sí fífi ìdẹ̀wò ẹ̀ṣẹ̀ síwájú ẹni.
- source_word: αὐτόν
  choice: rẹ̀ / an
  rationale: Àwọn arọ́pò-orúkọ méjèèjì tọ́ka sí Jésù, gẹ́gẹ́ bí ẹni tí wọ́n béèrè lọ́wọ́ tí wọ́n sì ń dán wò.
theological_decisions:
- issue: Ìtumọ̀ πειράζων nípa Jésù
  choice: láti dán an wò
  alternative: láti dẹ̀ ẹ́ wò / láti fi í sínú ìdẹ̀wò
  rationale: Gíríìkì lè túmọ̀ sí dídánwò, ṣíṣe àyẹ̀wò, tàbí fífi sínú ìdẹ̀wò. Nínú àyíká yìí, “láti dán an wò” pa ète ìwádìí ọ̀tá mọ́, kò sì pinnu pé ẹni náà ń tan Jésù sínú ẹ̀ṣẹ̀.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó sì rọrùn fún onkáwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ; “amòfin” jẹ́ kúkúrú, ẹsẹ̀ ìsàlẹ̀ sì ṣàlàyé ìtumọ̀ rẹ̀ nínú àyíká Júù.
