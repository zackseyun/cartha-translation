source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/020.yaml
  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Àwòrán ta ni èyí, àti àkọlé ta ni?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó túbọ̀ tẹ̀ lé ìṣètò Gíríìkì: “Ti ta ni àwòrán yìí àti àkọlé náà?” Ọ̀rọ̀ ìbéèrè Gíríìkì náà wà ní ìrísí genitive; ó lè tọ́ka sí ẹni tí nǹkan náà jẹ́ tirẹ̀ tàbí ẹni tí nǹkan náà ní í ṣe pẹ̀lú.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì bi ... pé
  rationale: Ọ̀rọ̀ ìsinsìnyí Gíríìkì jẹ́ historical present; Yorùbá ìtàn lè lo “ó sì bi ... pé” lọ́nà àdánidá, níwọ̀n bí gbólóhùn náà ti jẹ́ ìbéèrè.
- source_word: αὐτοῖς
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ nínú ipò dative ń tọ́ka sí àwọn tí ó ń bá sọ̀rọ̀; “bi wọ́n pé” jẹ́ ọ̀nà Yorùbá àdánidá fún ‘said/asked them.’
- source_word: Τίνος
  choice: ta ni ... ta sì ni
  rationale: Genitive interrogative náà ń béèrè ẹni tí àwòrán àti àkọlé náà jẹ́ tirẹ̀ tàbí ẹni tí wọ́n ń tọ́ka sí; “ta ni” ṣe èyí ní Yorùbá láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: εἰκών
  choice: àwòrán
  rationale: “Àwòrán” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún likeness tàbí portrait tí ó wà lórí owó náà.
- source_word: αὕτη
  choice: èyí
  rationale: “Èyí” jẹ́ afihàn ohun tó sún mọ́ni, ó sì bá αὕτη mu.
- source_word: ἐπιγραφή
  choice: orúkọ ... a kọ sí i
  rationale: Nínú àyíká owó, ἐπιγραφή ni ohun tí a kọ tàbí fín sí i; ìtumọ̀ yìí sọ ọ́ di mímọ̀ fún òǹkàwé Yorùbá, nígbà tí “orúkọ” bá ìdáhùn ẹsẹ tó tẹ̀ lé mu.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so àwọn ìbéèrè méjèèjì pọ̀ lọ́nà Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A yan “Ó sì bi wọ́n pé” dípò títú historical present náà sí ìsinsìnyí, nítorí pé ó dùn bí ìtàn Yorùbá. “Orúkọ ... a kọ sí i” rọrùn fún òǹkàwé ju “àkọlé” lọ nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ tó fẹ́rẹ̀ẹ́ tẹ̀ lé fọ́ọ̀mù Gíríìkì hàn.
