- from: Ó sì bi wọ́n pé, “Àwòrán ta ni èyí, orúkọ ta sì ni a kọ sí i?”[a]
  to: Ó sì wí fún wọn pé, “Àwòrán ta ni èyí, àti àkọlé ta ni?”[a]
  rationale: Àtúnṣe náà mú ọ̀rọ̀ ìṣe λέγει padà sí ‘wí,’ ó sì rọ́pò ‘orúkọ ... a kọ sí i’ pẹ̀lú ‘àkọlé’ kí ἐπιγραφή lè dúró gẹ́gẹ́ bí ìkọ̀wé/àkọlé lórí owó. Ìbéèrè méjèèjì àti àìdájú tó wà nínú Τίνος ni a pa mọ́.
