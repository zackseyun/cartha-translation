id: MAT.22.44
reference: Matthew 22:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: yo
  text: Olúwa sọ fún Olúwa mi pé, ‘Jókòó ní ọwọ́ ọ̀tún mi títí èmi yóò fi àwọn ọ̀tá rẹ sí abẹ́ ẹsẹ̀ rẹ[a].’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀nà ìsọ̀rọ̀ Hébérù nínú Sáàmù 110:1, “sọ àwọn ọ̀tá rẹ di àpótí ìtìsẹ̀ fún ẹsẹ̀ rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ọ̀rọ̀ Yorùbá tó yẹ fún κύριος níhìn-ín. A lò ó fún ìṣẹ̀lẹ̀ méjèèjì bí Gíríìkì ṣe lo ọ̀rọ̀ kan náà, nígbà tí “Olúwa mi” ń pa ìbáṣepọ̀ tí gbolóhùn náà sọ mọ́.
- source_word: Εἶπεν
  choice: sọ
  rationale: Ọ̀rọ̀ ìṣe aorist λέγω túmọ̀ sí pé ó “sọ”; èyí rọrùn, ó sì bá ọ̀rọ̀ àyọlò mu láìfi agbára míì kún un.
- source_word: τῷ κυρίῳ μου
  choice: fún Olúwa mi
  rationale: Dative náà fi ẹni tí a bá sọ̀rọ̀ hàn. “Fún Olúwa mi” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí ọ̀rọ̀ náà tọ́ sí, ó sì pa κύριος mọ́ gẹ́gẹ́ bí “Olúwa.”
- source_word: Κάθου
  choice: Jókòó
  rationale: Àṣẹ yìí tọ́ka sí jíjókòó ní ipò ọlá àti ìṣàkóso. “Jókòó” ṣe kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐκ δεξιῶν μου
  choice: ní apá ọ̀tún mi
  rationale: Gbólóhùn yìí ń tọ́ka sí ipò ọlá ní ẹ̀gbẹ́ ọ̀tún. “Ní apá ọ̀tún mi” ṣe kedere ju “ní ọwọ́ ọ̀tún mi” lọ ní Yorùbá òde òní, láìsọ ìtumọ̀ ọlá náà nù.
- source_word: ἕως ἂν θῶ
  choice: títí èmi yóò fi fi … sí
  rationale: ἕως ἂν pẹ̀lú subjunctive ń tọ́ka sí ohun tí yóò ṣẹlẹ̀ lọ́jọ́ iwájú. Ìtẹnumọ́ “èmi” bá ẹni tí ó ń ṣe ìṣe náà mu, “fi … sí” sì túmọ̀ θῶ lọ́nà àdánidá.
- source_word: τοὺς ἐχθρούς σου
  choice: àwọn ọ̀tá rẹ
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún “your enemies.”
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: sí abẹ́ ẹsẹ̀ rẹ
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì ní tààrà, “under your feet,” láìfi àwòrán àpótí ìtìsẹ̀ tí kò sí ní gbólóhùn Gíríìkì kún ẹsẹ náà.
theological_decisions:
- issue: Ìtumọ̀ κύριος méjèèjì nínú àyọlò Sáàmù 110:1
  choice: Olúwa sọ fún Olúwa mi
  alternative: OLÚWA sọ fún olúwa mi; tàbí, Olúwa sọ fún ọ̀gá mi
  rationale: Gíríìkì lo κύριος kan náà fún àwọn méjèèjì. Lílo “Olúwa” ní ibòmíràn méjèèjì pa ìfararora ọ̀rọ̀ Gíríìkì àti ìforígbárí ẹ̀kọ́ nínú ìbéèrè Jésù mọ́. “OLÚWA” yóò mú orúkọ Ọlọ́run nínú Hébérù wá síwájú nígbà tí Gíríìkì kò fi ìyàtọ̀ yẹn hàn, “ọ̀gá mi” sì lè dín ìtumọ̀ oyè náà kù.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A yan “ní apá ọ̀tún mi” láti jẹ́ kí ipò ní ẹ̀gbẹ́ ọ̀tún ṣe kedere fún òǹkàwé lónìí. Àmì ìbéèrè ní òpin ń pa ẹsẹ yìí mọ́ gẹ́gẹ́ bí ara ìbéèrè Jésù tó bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú.
