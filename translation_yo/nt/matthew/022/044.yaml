  source_fidelity: 'Ìtumọ̀ náà pa ètò gbolóhùn Gíríìkì mọ́ dáadáa: κύριος méjèèjì ni “Olúwa,” àṣẹ “Jókòó” wà, ipò ọwọ́ ọ̀tún wà, a sì túmọ̀ ὑποκάτω τῶν ποδῶν σου ní tààrà gẹ́gẹ́ bí “sí abẹ́ ẹsẹ̀ rẹ.” Àmì ìbéèrè ní òpin tún bá àyíká ọ̀rọ̀ Jésù mu. Síbẹ̀, “yóò fi fi” ní ọ̀rọ̀ àkọ́kọ́ jẹ́ ìlò “fi” lẹ́ẹ̀mejì tí kò bá ìkọ́ Yorùbá mu.'
  naturalness: 'A nílò àtúnṣe kékeré fún ìṣàn ọrọ̀: “títí èmi yóò fi àwọn ọ̀tá rẹ sí ...” jẹ́ ìlò Yorùbá tó dára. “Ní ọwọ́ ọ̀tún mi” jẹ́ àpẹẹrẹ ìjọba-ọba tó ti fìdí múlẹ̀, ó sì jẹ́ ìtumọ̀ adayeba fún gbolóhùn Gíríìkì náà. Nínú àlàyé ìsàlẹ̀, “sọ ... di àpótí ìtìsẹ̀” dára ju “ṣe ... ní àpótí” lọ.'
