  to: Olúwa sọ fún Olúwa mi pé, ‘Jókòó ní ọwọ́ ọ̀tún mi títí èmi yóò fi àwọn ọ̀tá rẹ sí abẹ́ ẹsẹ̀ rẹ[a].’?”
