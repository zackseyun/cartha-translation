id: MAT.22.24
reference: Matthew 22:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: yo
  text: wọ́n ń wí pé, “Olùkọ́, Mósè sọ pé, ‘Bí ọkùnrin kan bá kú láìní ọmọ, arákùnrin rẹ̀ yóò fẹ́ opó náà[a], kí ó sì mú irú-ọmọ dìde fún arákùnrin tí ó kú náà.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tó bá ìrísí ọ̀rọ̀ Gíríìkì mu jù: “arákùnrin rẹ̀ yóò ṣe ojúṣe arákùnrin ọkọ fún opó náà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka pàtó sí àṣà fífẹ́ opó arákùnrin ẹni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè tààrà sí Jésù gẹ́gẹ́ bí ẹni tó ń kọ́ni; ‘Olùkọ́’ ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Bí ọkùnrin kan bá kú
  rationale: Ìlànà tí wọ́n ń tọ́ka sí dá lórí ọkùnrin tó kú àti ojúṣe arákùnrin rẹ̀; nítorí náà, a pa ìtumọ̀ akọ inú ọ̀rọ̀ ìpilẹ̀ mọ́.
- source_word: μὴ ἔχων τέκνα
  choice: láìní ọmọ
  rationale: ‘Ọmọ’ lè jẹ́ ẹyọ tàbí àpapọ̀ ní Yorùbá, ó sì bo ọmọkùnrin àti ọmọbìnrin bí τέκνα ṣe rí.
- source_word: ἐπιγαμβρεύσει
  choice: gbọdọ̀ fẹ́ opó rẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka pàtó sí fífẹ́ opó arákùnrin ẹni gẹ́gẹ́ bí òfin ìgbéyàwó arákùnrin ọkọ; ìtumọ̀ yìí ṣe kedere ní Yorùbá, a sì ṣàlàyé agbára òfin inú ọ̀rọ̀ náà nínú àlàyé ìsàlẹ̀.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: opó rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gírámà tààrà ni ‘aya rẹ̀,’ obìnrin náà ti di opó ní àyíká ọ̀rọ̀ yìí; ‘opó rẹ̀’ jẹ́ èdè Yorùbá tó ṣe kedere láìyí ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí padà.
- source_word: ἀναστήσει σπέρμα
  choice: bí ọmọ
  rationale: Gbólóhùn Gíríìkì jẹ́ ọ̀nà àkànlò-èdè tó túmọ̀ sí mímú kí irú-ọmọ wà fún ẹni tó kú. ‘Bí ọmọ’ sọ ète ìbímọ náà ní Yorùbá àdánidá, nígbà tí ‘fún arákùnrin rẹ̀’ pa ìtumọ̀ ìdílé àti òfin rẹ̀ mọ́.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: fún arákùnrin rẹ̀
  rationale: Dátífù náà fi ẹni tí ọmọ náà yóò jẹ́ fún hàn; ‘fún arákùnrin rẹ̀’ jẹ́ ìtumọ̀ ṣókí, tó sì péye.
theological_decisions:
- issue: Ṣíṣe àpẹẹrẹ òfin náà ní ọ̀nà tó fi akọ hàn
  choice: Lo ‘ọkùnrin kan’ àti ‘arákùnrin rẹ̀’
  alternative: Lo ọ̀rọ̀ tí kò fi akọ tàbí abo hàn, bí ‘ẹnikan’
  rationale: Òfin Mósè tí ẹsẹ yìí ń tọ́ka sí sọ ní pàtó nípa ọkùnrin tó kú àti arákùnrin rẹ̀. Ìtumọ̀ náà pa ipa akọ inú orísun mọ́ láìsọ ọ́ di ọ̀rọ̀ gbogbogbò.
- issue: Bí a ṣe máa tú ἀναστήσει σπέρμα
  choice: ‘kí ó sì bí ọmọ fún arákùnrin rẹ̀’
  alternative: ‘kí ó sì gbé irú-ọmọ dìde fún arákùnrin rẹ̀’
  rationale: 'Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá àdánidá, ó sì pa ète òfin náà mọ́: a ó ka ọmọ náà sí irú-ọmọ arákùnrin tó kú. A kò fi ọ̀rọ̀ kún un láti pinnu gbogbo kúlẹ̀kúlẹ̀ nípa bí a ṣe ń ka ìran náà.'
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì rọrùn fún òǹkàwé òde òní. ‘Opó rẹ̀’ mú àyíká ọ̀rọ̀ hàn ní kedere, àlàyé [a] sì pa ìtumọ̀ pàtó ti ἐπιγαμβρεύσει mọ́.
