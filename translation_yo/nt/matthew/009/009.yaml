id: MAT.9.9
reference: Matthew 9:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: yo
  text: Bí Jésù sì ti ń kọjá láti ibẹ̀, ó rí ọkùnrin kan tí a ń pè ní Mátíù[a], tí ó jókòó ní ibi tí a ti ń gba owó orí. Ó sì wí fún un[b] pé, “Tọ̀ mí lẹ́yìn.” Ó sì dìde[c], ó tọ̀ ọ́ lẹ́yìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí orúkọ rẹ̀ ń jẹ́ Mátíù.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ó sì ń wí fún un”; Gíríìkì lo ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí nínú ìtàn láti mú ìṣẹ̀lẹ̀ náà wà láàyè sí i.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó gbé ara rẹ̀ dìde, ó sì tọ̀ ọ́ lẹ́yìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: bí Jésù sì ti ń kọjá láti ibẹ̀
  rationale: Ọ̀rọ̀-orúkọ oníṣe ti àsìkò ìsinsìnyí náà fi ìṣe tí ó ń lọ hàn, nígbà tí ἐκεῖθεν túmọ̀ sí pé ó ń kúrò ní ibi tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí akọ kan pàtó, Mátíù.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: tí ó jókòó ní ibi tí a ti ń gba owó orí
  rationale: Àlàyé yìí jẹ́ kó ṣe kedere pé Mátíù wà ní ibi iṣẹ́ ìkójọ owó orí, láì fi irú ilé tàbí àgọ́ pàtó kún ohun tí Gíríìkì sọ.
- source_word: Μαθθαῖον λεγόμενον
  choice: tí orúkọ rẹ̀ ń jẹ́ Mátíù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ tí a fi ń pe ẹnì kan.
- source_word: λέγει αὐτῷ
  choice: ó sì wí fún un
  rationale: Èdè Yorùbá kò fi àmì àsìkò sí ọ̀rọ̀-ìṣe bí Gíríìkì; gbólóhùn yìí bá ìtàn àtẹ̀lé mu, nígbà tí àlàyé ìsàlẹ̀ ṣàfihàn historical present inú Gíríìkì.
- source_word: Ἀκολούθει μοι
  choice: Máa tọ̀ mí lẹ́yìn
  rationale: “Máa” bá àṣẹ àsìkò ìsinsìnyí mu, ó sì pa ìtumọ̀ títọ̀ lẹ́yìn Jésù mọ́ láì ṣàlàyé rẹ̀ ju orísun lọ.
- source_word: ἀναστὰς
  choice: ó sì dìde
  rationale: Ó fi ìṣe tó ṣáájú títọ̀ lẹ́yìn hàn ní ṣókí àti ní èdè ìtàn àdánidá.
- source_word: ἠκολούθησεν αὐτῷ
  choice: ó tọ̀ ọ́ lẹ́yìn
  rationale: Ó pa ìṣe gidi àti ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn mọ́, láì yí i sí àlàyé ẹ̀kọ́ ìgbàgbọ́.
theological_decisions:
- issue: Irú ìpè tí Jésù ṣe sí Mátíù
  choice: “Máa tọ̀ mí lẹ́yìn”
  alternative: “Wá di ọmọ-ẹ̀yìn mi” tàbí “Darapọ̀ mọ́ mi”
  rationale: Àṣẹ Gíríìkì fúnra rẹ̀ ní ìtumọ̀ ìpè sí jíjẹ́ ọmọ-ẹ̀yìn, ṣùgbọ́n a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ orísun kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún. “Ibi tí a ti ń gba owó orí” ṣe kedere fún òǹkàwé lónìí, “Máa tọ̀ mí lẹ́yìn” sì pa ìwúwo ìpè náà mọ́ ní ọ̀nà àdánidá.
