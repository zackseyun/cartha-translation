  to: Bí Jésù sì ti ń kọjá láti ibẹ̀, ó rí ọkùnrin kan tí a ń pè ní Mátíù[a], tí ó jókòó ní ibi tí a ti ń gba owó orí. Ó sì wí fún un[b] pé, “Tọ̀ mí lẹ́yìn.” Ó sì dìde[c], ó tọ̀ ọ́ lẹ́yìn.
