  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní ìwòye gbogbogbò: ìkọjá láti ibẹ̀, rírí ọkùnrin kan níbi ìkójọ owó-orí, ìpè náà, àti ìdáhùn rẹ̀ wà níbẹ̀. Ṣùgbọ́n “Máa tọ̀ mí lẹ́yìn” le túmọ̀ sí ìṣe tí a máa ń ṣe déédéé (“keep following me”) ju àṣẹ ìpè Ἀκολούθει μοι lọ; “Tọ̀ mí lẹ́yìn” dáa sí i. Àmì àlàyé a ní ọ̀rọ̀ “orúkọ rẹ̀ ń jẹ́ Mátíù,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì ‘called Matthew’ wà lórí ọkùnrin náà, kì í ṣe orúkọ rẹ̀.'
