id: MAT.9.33
reference: Matthew 9:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: yo
  text: Nígbà tí a sì lé ẹ̀mí èṣù náà jáde, ọkùnrin òdì náà[a] sọ̀rọ̀. Ẹnu àwọn ogunlọ́gọ̀ náà sì yà, wọ́n ní, “A kò tíì rí irú èyí rí ní Ísírẹ́lì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin adití náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “adití” tàbí “òdì”; níbí, àyíká ọ̀rọ̀ fẹ́ “òdì,” nítorí ohun tí a tẹnumọ́ ni pé ó sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: nígbà tí a ... lé ... jáde
  rationale: Ọ̀rọ̀ participle aorist passive yìí fi hàn pé lílé ẹ̀mí èṣù náà jáde ṣẹlẹ̀ ṣáájú kí ọkùnrin náà tó sọ̀rọ̀; ọ̀nà yìí sì jẹ́ Yorùbá àdánidá.
- source_word: δαιμονίου
  choice: ẹ̀mí èṣù
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún δαιμόνιον nínú àyíká ìlépa ẹ̀mí èṣù jáde.
- source_word: ἐλάλησεν
  choice: sọ̀rọ̀
  rationale: Aorist rírọrùn náà sọ ìṣẹ̀lẹ̀ pé ó sọ̀rọ̀, láìfi ìtumọ̀ míì kún un bí ‘ó bẹ̀rẹ̀ sí í sọ̀rọ̀.’
- source_word: ὁ κωφός
  choice: ọkùnrin odi náà
  rationale: Nínú Yorùbá, ‘odi’ lè tọ́ka sí ẹni tí kò lè sọ̀rọ̀; ọ̀rọ̀ tó tẹ̀ lé e pé ó sọ̀rọ̀ mú kí ìtumọ̀ yìí ṣeé fẹ́ sí ‘adití,’ bí ó tilẹ̀ jẹ́ pé Gíríìkì lè túmọ̀ sí méjèèjì.
- source_word: ἐθαύμασαν
  choice: ẹnu ya
  rationale: Ọ̀rọ̀ àdánidá Yorùbá yìí fi ìyàlẹ́nu ńlá tí àwọn ènìyàn ní hàn dáadáa.
- source_word: οἱ ὄχλοι
  choice: àwọn ogunlọ́gọ̀
  rationale: Ó pa nọ́ńbà púpọ̀ ti Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó bá àkójọpọ̀ ènìyàn mu.
- source_word: Οὐδέποτε
  choice: a kò tíì ... rí
  rationale: Ìkọ̀lé yìí sọ pé irú ìṣẹ̀lẹ̀ bẹ́ẹ̀ kò tíì ṣẹlẹ̀ tàbí fara hàn rí títí di àkókò náà.
- source_word: ἐφάνη οὕτως
  choice: rí irú èyí
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐφάνη lè jẹ́ ‘fara hàn,’ ìtumọ̀ passive ‘rí’ jẹ́ àdánidá nínú gbolohun Yorùbá yìí, ‘irú èyí’ sì mú οὕτως jáde.
- source_word: ἐν τῷ Ἰσραήλ
  choice: ní Ísírẹ́lì
  rationale: Ó jẹ́ ìtumọ̀ ṣókí àti àdánidá, ó sì lè tọ́ka sí ilẹ̀ tàbí àwọn ènìyàn Ísírẹ́lì gẹ́gẹ́ bí Gíríìkì ṣe lè ṣe.
theological_decisions:
- issue: Ìtumọ̀ κωφός nínú àyíká ìwòsàn àti lílé ẹ̀mí èṣù jáde
  choice: ọkùnrin odi
  alternative: ọkùnrin adití
  rationale: κωφός lè túmọ̀ sí ẹni adití tàbí ẹni odi, ṣùgbọ́n abajade tí ẹsẹ náà tẹnumọ́—pé ọkùnrin náà sọ̀rọ̀—ṣe àtìlẹ́yìn fún ‘odi.’ Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ kejì mọ́ láìfi ipò míì kún ọkùnrin náà.
- issue: Ìtumọ̀ ἐφάνη nínú ọ̀rọ̀ ìyàlẹ́nu àwọn ènìyàn
  choice: a kò tíì rí irú èyí rí
  alternative: irú èyí kò tíì fara hàn rí
  rationale: Fọ́ọ̀mù passive ti φαίνω lè jẹ́ ‘fara hàn’ tàbí ‘jẹ́ ohun tí a rí.’ ‘A kò tíì rí irú èyí rí’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ pé ìṣẹ̀lẹ̀ náà kò lẹ́gbẹ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹnu ya’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá fún ìyàlẹ́nu, àti ‘ogunlọ́gọ̀’ fún ọ̀pọ̀ ènìyàn.
