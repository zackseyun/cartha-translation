id: MAT.9.4
reference: Matthew 9:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: yo
  text: Jésù sì mọ èrò inú wọn[a], ó ní, “Èé ṣe tí ẹ fi ń rò ohun búburú nínú ọkàn yín?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù sì kíyè sí èrò inú wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: mọ
  rationale: Ọ̀rọ̀ náà fi hàn pé Jésù mọ ohun tí wọ́n ń rò nínú; ‘mọ’ jẹ́ ọ̀nà Yorùbá tó ṣe déédé, tó sì mọ́gbọ́n dání láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ἐνθυμήσεις
  choice: èrò inú
  rationale: Ó tọ́ka sí ìrònú tàbí ìgbèrò inú. ‘Èrò inú’ jẹ́ èdè Yorùbá àdánidá, ó sì fi hàn pé wọn kò sọ ọ́ jáde.
- source_word: Ἱνατί
  choice: Èé ṣe
  rationale: Èyí ni ìbéèrè Yorùbá tó ṣe déédé fún ìdí tàbí ohun tó fa ìṣe kan.
- source_word: ἐνθυμεῖσθε
  choice: ẹ fi ń rò
  rationale: Ìlò ‘ń’ pa ìtumọ̀ ìṣe tó ń lọ lọ́wọ́ mọ́, ó sì jẹ́ èdè Yorùbá tó rọrùn.
- source_word: πονηρὰ
  choice: ohun búburú
  rationale: Ọ̀rọ̀ ajẹtífù ọ̀pọ̀ yìí dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ; ‘ohun búburú’ mú ìtumọ̀ rẹ̀ jáde láìsọ irú ibi náà pàtó ju orísun lọ.
- source_word: καρδίαις
  choice: ọkàn
  rationale: ‘Ọkàn’ pa àwòrán inú orísun mọ́, ó sì lè túmọ̀ sí ibi ìrònú àti ète nínú èdè Bíbélì àti Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa sọ pé Jésù mọ èrò tí wọn kò sọ jáde
  choice: Jésù sì mọ èrò inú wọn
  alternative: Jésù sì kíyè sí èrò inú wọn
  rationale: Àṣàyàn yìí pa ìjẹ́rìí ẹsẹ̀ náà mọ́ pé Jésù mọ ìrònú inú wọn, láìṣàlàyé ọ̀nà tí ó gbà mọ̀ ọ́ tàbí fi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘èrò inú’ láti mú ìtumọ̀ ìrònú tí a kò sọ jáde hàn, a sì pa àwòrán ‘ọkàn’ ti orísun mọ́.
