id: MAT.9.18
reference: Matthew 9:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: yo
  text: Nígbà tí ó ń sọ nǹkan wọ̀nyí fún wọn, wò ó, olórí kan wá, ó sì wólẹ̀ fún un, ó ní, “Ọmọbìnrin mi ṣẹ̀ṣẹ̀ kú. Ṣùgbọ́n wá, kí o sì gbé ọwọ́ rẹ lé e, òun yóò sì yè.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ó pa ìkìlọ̀ àfiyèsí inú ọ̀rọ̀ Gíríìkì mọ́ ní ọ̀nà tí ó ṣe déédéé ní Yorùbá.
- source_word: ἄρχων εἷς
  choice: ọ̀kan lára àwọn olórí
  rationale: ἄρχων túmọ̀ sí olórí tàbí alákòóso; ọ̀rọ̀ náà kò sọ ipò pàtó rẹ̀ nínú ẹsẹ yìí, nítorí náà a kò fi àlàyé ẹ̀sìn kún un.
- source_word: προσεκύνει αὐτῷ
  choice: ó tẹrí ba fún un
  rationale: Yíyan yìí ṣàfihàn ìwà ìbọ̀wọ̀ jinlẹ̀ tí ọ̀rọ̀ náà ní láìfi dandan pinnu pé ó jẹ́ ìjọsìn gẹ́gẹ́ bí Ọlọ́run.
- source_word: ἄρτι ἐτελεύτησεν
  choice: ṣẹ̀ṣẹ̀ kú
  rationale: Ó mú ìtumọ̀ àkókò ἄρτι àti ìtumọ̀ ἐτελεύτησεν jáde ní Yorùbá àdánidá.
- source_word: ζήσεται
  choice: yóò yè
  rationale: Ó pa àsọtẹ́lẹ̀ ìyè mọ́, ó sì yẹ fún ọ̀rọ̀ ọmọ tí ó ti kú tí yóò tún wà láàyè.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω sí Jésù
  choice: tẹrí ba fún un
  alternative: jọ́sìn rẹ̀
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìbọ̀wọ̀ tàbí ìjọsìn. Yíyan ‘tẹrí ba’ pa àìdánilójú náà mọ́ dípò fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- issue: Ìdánilójú ọkùnrin náà pé ọmọ rẹ̀ yóò yè
  choice: òun yóò sì yè
  alternative: òun yóò sì tún wà láàyè
  rationale: A pa agbára àti ìdánilójú gbólóhùn Gíríìkì mọ́, láìfi àlàyé míì kún ọ̀rọ̀ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘kí o sì gbé ọwọ́ rẹ lé e’ láti mú àṣẹ Gíríìkì jáde ní ọ̀nà Yorùbá tó rọrùn.
