  to: Nígbà tí ó ń sọ nǹkan wọ̀nyí fún wọn, wò ó, olórí kan wá, ó sì wólẹ̀ fún un, ó ní, “Ọmọbìnrin mi ṣẹ̀ṣẹ̀ kú. Ṣùgbọ́n wá, kí o sì gbé ọwọ́ rẹ lé e, òun yóò sì yè.”
  rationale: Àtúnṣe náà mú ‘a ruler’ wá sí ‘olórí kan’ láìdámọ̀ràn ẹgbẹ́ kan, ó sì rọ́pò ìṣe ìbọ̀wọ̀ náà pẹ̀lú ‘wólẹ̀ fún un,’ tí ó jẹ́ kedere, adayeba, tí ó sì pa àìdánilójú ìtumọ̀ προσκυνέω mọ́. Kò sí ẹsẹ̀ ìsàlẹ̀ tí orísun béèrè fún.
