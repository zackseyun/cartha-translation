  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí wọ́n jáde, wọ́n tan ìròyìn nípa rẹ̀ káàkiri gbogbo agbègbè náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní gbogbo ilẹ̀ náà.” Ọ̀rọ̀ Gíríìkì γῆ lè túmọ̀ sí “ilẹ̀,” “agbègbè,” tàbí “àgbègbè kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré hàn sí àṣẹ Jésù nínú ẹsẹ tó ṣáájú pé kí wọ́n má ṣe sọ ọ́; ‘Ṣùgbọ́n’ mú ìtakora ìtàn náà jáde ní ti ẹ̀dá.
- source_word: ἐξελθόντες
  choice: lẹ́yìn tí wọ́n jáde
  rationale: Ọ̀rọ̀-àìṣe aorist yìí ṣáájú ìṣe pàtàkì; gbólóhùn yìí pa ìtẹ̀lé àkókò mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: διεφήμισαν
  choice: wọ́n tan ìròyìn ... ká
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípolongo tàbí títan ìròyìn ká ní gbangba. ‘Tan ìròyìn ... ká’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé wọ́n mú kí ọ̀pọ̀ ènìyàn mọ̀ nípa rẹ̀.
- source_word: αὐτὸν
  choice: nípa rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ àfọ̀mọ́ tààrà, ‘nípa rẹ̀’ bá ọ̀rọ̀-ìṣe ‘tan ìròyìn ká’ mu ní Yorùbá, láìyí ìtumọ̀ padà.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: ká gbogbo agbègbè náà
  rationale: Nínú àyíká ìtàn yìí, γῆ ń tọ́ka sí agbègbè àdúgbò kan. ‘Ká gbogbo agbègbè náà’ fi ipa pípín ἐν àti ìkúnrẹ́rẹ́ ὅλῃ hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìwọ̀n àgbègbè tí γῆ ń tọ́ka sí
  choice: agbègbè
  alternative: ilẹ̀
  rationale: Àyíká ẹsẹ náà sọ nípa bí ìròyìn Jésù ṣe tàn ní àdúgbò yẹn, kì í ṣe nípa gbogbo orílẹ̀-èdè tàbí gbogbo ayé. ‘Agbègbè’ pa ìwọ̀n ìtumọ̀ náà mọ́ láìsọ ọ́ di gbígbòòrò ju ẹ̀rí ọ̀rọ̀ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ ti ẹ̀dá. Kò sí àmì àlàyé nínú ọ̀rọ̀ nítorí àlàyé Gẹ̀ẹ́sì tí a pèsè dà bí ẹni pé àmì [a] wà lẹ́yìn ‘went out,’ ṣùgbọ́n ohun tí àlàyé náà ń ṣàlàyé gan-an ni γῆ ní òpin ẹsẹ; ìtumọ̀ ‘agbègbè’ tó wà nínú ọ̀rọ̀ pàtàkì ti péye, kò sì pọndandan láti fi àṣàyàn ‘ilẹ̀’ sí àlàyé fún ẹsẹ kúkúrú yìí.
