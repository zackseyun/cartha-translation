id: MAT.9.15
reference: Matthew 9:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: yo
  text: Jésù sì sọ fún wọn pé, “Àwọn ọ̀rẹ́ ọkọ ìyàwó[a] kò lè ṣọ̀fọ̀ níwọ̀n ìgbà tí ọkọ ìyàwó wà pẹ̀lú wọn, ṣé wọ́n lè ṣe bẹ́ẹ̀? Ṣùgbọ́n àwọn ọjọ́ yóò dé nígbà tí a ó gba ọkọ ìyàwó kúrò lọ́dọ̀ wọn[b]; nígbà náà ni wọn yóò gbààwẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ọmọ gbọ̀ngàn ìgbéyàwó,” àṣà-ọrọ̀ kan fún àwọn ọ̀rẹ́ tàbí alábàákẹ́gbẹ́ ọkọ ìyàwó nínú ayẹyẹ ìgbéyàwó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí a ó mú ọkọ ìyàwó kúrò lọ́dọ̀ wọn.” Ìkọ́ iṣẹ́ aláìṣeṣe náà fi hàn pé a yọ ọ́ kúrò lọ́dọ̀ wọn, kì í ṣe pé ó kàn lọ fúnra rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: àwọn ọ̀rẹ́ ọkọ ìyàwó
  rationale: Gbólóhùn náà jẹ́ àṣà-ọrọ̀ fún àwọn alábàáṣiṣẹ́ tàbí ọ̀rẹ́ ọkọ ìyàwó nínú ayẹyẹ ìgbéyàwó. Èyí sọ ipa wọn ní Yorùbá tí ó ṣe kedere láì túmọ̀ àwòrán Semitic náà ní ọ̀rọ̀-kọ̀ọ̀kan.
- source_word: πενθεῖν
  choice: ṣọ̀fọ̀
  rationale: Ó túmọ̀ sí ṣíṣe ọ̀fọ̀ tàbí ìbànújẹ́ jíjinlẹ̀, ó sì bá ìyàtọ̀ rẹ̀ sí ayẹyẹ ìgbéyàwó àti ààwẹ̀ mu.
- source_word: ἐφ’ ὅσον
  choice: níwọ̀n ìgbà tí
  rationale: Ó fi gbogbo àkókò tí ọkọ ìyàwó wà pẹ̀lú wọn hàn lọ́nà àdánidá.
- source_word: νυμφίος
  choice: ọkọ ìyàwó
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún bridegroom, ó sì pa àwòrán ìgbéyàwó mọ́.
- source_word: ἀπαρθῇ
  choice: a ó gba ... kúrò lọ́dọ̀ wọn
  rationale: Fọ́ọ̀mù aláìṣeṣe náà ń tọ́ka sí pé ẹlòmíràn ni yóò mú un kúrò, kì í ṣe pé ó kàn lọ fúnra rẹ̀; ìtumọ̀ yìí pa ìmọ̀lára ìyọkúrò onípá mọ́ láì ṣàlàyé rẹ̀ jù.
- source_word: νηστεύσουσιν
  choice: wọn yóò ... gbààwẹ̀
  rationale: Ìtumọ̀ ọjọ́ iwájú náà ṣe kedere, ‘gbààwẹ̀’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún fasting.
- source_word: Μὴ δύνανται ... ;
  choice: kò lè ... àbí wọ́n lè ṣe bẹ́ẹ̀?
  rationale: Ìbéèrè pẹ̀lú μή ń retí ìdáhùn òdì; ìbéèrè àfikún Yorùbá náà pa agbára àsọyé yẹn mọ́.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Ṣùgbọ́n ọjọ́ ń bọ̀
  rationale: Ọ̀nà Yorùbá àdánidá ni fún ìṣẹ̀lẹ̀ ọjọ́ iwájú, ‘Ṣùgbọ́n’ sì fi ìyàtọ̀ δέ hàn.
theological_decisions:
- issue: Ìtumọ̀ nípa Kristi nínú àwòrán ọkọ ìyàwó
  choice: Pa ‘ọkọ ìyàwó’ mọ́ gẹ́gẹ́ bí àwòrán láì fi kún un pé Jésù ni ọkọ ìyàwó Mèsáyà.
  alternative: Ṣàlàyé nínú ẹsẹ̀ náà pé Jésù ni ọkọ ìyàwó Mèsáyà.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ jẹ́ kí àwòrán náà dúró, ó sì yẹ kí òǹkàwé rí ìtumọ̀ rẹ̀ láì jẹ́ pé ìtumọ̀ Bíbélì fi ẹ̀kọ́ àfikún sínú ọ̀rọ̀ náà.
- issue: Ìmọ̀lára tó wà nínú ἀπαρθῇ
  choice: Lo ọ̀rọ̀ aláìṣeṣe ‘a ó gba ... kúrò’ láì sọ ẹni tí yóò ṣe é tàbí darúkọ ikú Jésù.
  alternative: Túmọ̀ ọ́ bí ‘ó bá lọ’ tàbí ṣàlàyé ní tààrà pé ó tọ́ka sí ikú Jésù.
  rationale: Èdè Gíríìkì tọ́ka sí ìyọkúrò ju ìlọ lásán lọ, ṣùgbọ́n kò darúkọ aṣojú tàbí ṣàlàyé ìṣẹ̀lẹ̀ náà ní ẹsẹ̀ yìí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ọkọ ìyàwó’ dípò ọ̀rọ̀ àtijọ́ tàbí èyí tí kò mọ́gbọ́n dání, a sì pa ìbéèrè àsọyé àti ìmọ̀lára ìyọkúrò nínú orísun Gíríìkì mọ́.
