  source_fidelity: Àwọn àṣìṣe pàtàkì wà nínú ìtumọ̀ ἀγνάφου àti ἱμάτιον. “Aṣọ tí kò tíì wọ́” túmọ̀ sí aṣọ tí ẹnikẹ́ni kò tíì wọ̀, kì í ṣe aṣọ tí a kò tíì fọ́ tàbí kúnlẹ̀ (unfulled/pre-shrunk). Bákan náà, “aṣọ àwọ̀tẹ́lẹ̀” ń tọ́ka sí aṣọ abẹ́, nígbà tí ἱμάτιον níbí jẹ́ aṣọ òde. Àtúnṣe náà pa ìbáṣepọ̀ ìdí-àbájáde àti ìfiwéra ‘yíya tí ó burú jù’ mọ́.
