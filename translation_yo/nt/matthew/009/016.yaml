id: MAT.9.16
reference: Matthew 9:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: yo
  text: Ṣùgbọ́n kò sí ẹni tí ó fi àbà láti inú aṣọ tí a kò tíì fọ́[a] sí aṣọ òde àtijọ́; nítorí àbà náà yóò fa apá kan nínú aṣọ náà ya kúrò, yíya náà yóò sì burú sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ tí a kò tíì kúnlẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń ṣàpèjúwe aṣọ tí a kò tíì ṣiṣẹ́ tán nípa fífọ́ tàbí kíkúnlẹ̀, nítorí náà ó lè rọ̀ tàbí dín kù, kí ó sì fa aṣọ àtijọ́ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Ṣùgbọ́n kò sí ẹni tí
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ tí δὲ ń ṣe hàn, ó sì pa ìtumọ̀ àpapọ̀ οὐδεὶς mọ́ láìfi akọ tàbí abo kún un.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: fi àbà ... sí
  rationale: ‘Fi ... sí’ tẹ̀ lé ìtumọ̀ gbígbé ohun kan lé òmíràn, nígbà tí ‘àbà’ jẹ́ ọ̀rọ̀ Yorùbá fún ẹ̀yà aṣọ tí a fi ń dí ibi tí ó ya.
- source_word: ῥάκους ἀγνάφου
  choice: láti inú aṣọ tí kò tíì wọ́
  rationale: ἄγναφος ṣàpèjúwe aṣọ tí a kò tíì ṣiṣẹ́ tán nípa fífọ̀ tàbí mímú un wọ́; yíyan yìí mú ìdí tí yóò fi fà mọ́ aṣọ àtijọ́ yé òǹkàwé.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: sí aṣọ àwọ̀tẹ́lẹ̀ àtijọ́
  rationale: ἱμάτιον lè tọ́ka sí aṣọ tí a wọ̀, pàápàá aṣọ òde; ‘aṣọ àwọ̀tẹ́lẹ̀’ jẹ́ èdè Yorùbá tí ó ṣe kedere láìdín un kù sí irú aṣọ pàtó kan.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: yóò fà ya kúrò lára aṣọ àwọ̀tẹ́lẹ̀ náà
  rationale: Nínú àyíká yìí αἴρει fi agbára yíya kúrò hàn; ‘fà ya kúrò’ pa àwòrán ìfà tí ń mú ìyapa pọ̀ sí i mọ́.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: àbà náà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní ìtumọ̀ gangan ‘ohun tí ó kún un,’ nínú àpẹẹrẹ aṣọ ó ń tọ́ka sí àbà tí a fi dí ibi yíya.
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: yíya náà yóò sì burú sí i
  rationale: 'Ó sọ àbájáde afiwéra χεῖρον ní Yorùbá àdánidá: ibi tí ó ya yóò di èyí tí ó burú jù tẹ́lẹ̀ lọ.'
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó bá yẹ; gbolohun náà pa àwòrán iṣẹ́ àbà aṣọ àti ìbáṣepọ̀ ìdí-àbájáde inú Gíríìkì mọ́.
