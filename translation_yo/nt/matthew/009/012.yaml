id: MAT.9.12
reference: Matthew 9:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó gbọ́ èyí, ó sọ pé, “Àwọn tí ara wọn dá[a] kò nílò oníṣègùn, ṣùgbọ́n àwọn aláìsàn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn alágbára.”
    reason: ἰσχύοντες lè túmọ̀ ní tààrà sí àwọn alágbára, bí ó tilẹ̀ jẹ́ pé àyíká ìṣègùn tọ́ka sí àwọn tí ara wọn dá.
lexical_decisions:
- source_word: ἀκούσας
  choice: nígbà tí ó gbọ́ èyí
  rationale: Aorist participle náà ní agbára àkókò níbí. Ohun tí ó gbọ́ wà nínú àyíká ẹsẹ̀ tó ṣáájú, nítorí náà “èyí” mú ọ̀rọ̀ náà jẹ́ Yorùbá àdánidá láìfi ìtumọ̀ tuntun kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń fi ìyípadà kékeré tó ní ìtakora hàn; “Ṣùgbọ́n” bá ìdáhùn Jésù sí ọ̀rọ̀ àwọn Farisí mu.
- source_word: εἶπεν
  choice: ó sọ pé
  rationale: Èyí túmọ̀ λέγω gẹ́gẹ́ bí ọ̀rọ̀ sísọ lasán, láìyí i sí “ó dáhùn,” èyí tí Gíríìkì kò sọ ní tààrà.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: kò nílò
  rationale: “Kò nílò” ni ọ̀nà Yorùbá tó ṣe déédéé jù láti sọ pé ẹnì kan kò ní àìní ohun kan.
- source_word: οἱ ἰσχύοντες
  choice: àwọn tí ara wọn dá ṣáṣá
  rationale: Bí ó tilẹ̀ jẹ́ pé ἰσχύω lè túmọ̀ sí jíjẹ́ alágbára, ìtakora rẹ̀ pẹ̀lú àwọn aláìsàn àti mẹ́nuba oníṣègùn fi ìlera hàn ní àyíká yìí. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa àwòrán ìṣègùn mọ́.
- source_word: ἰατροῦ
  choice: oníṣègùn
  rationale: “Oníṣègùn” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún dókítà tàbí ẹni tó ń ṣe ìtọ́jú àìsàn, ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ ọlọ́lá mu.
- source_word: οἱ κακῶς ἔχοντες
  choice: àwọn aláìsàn
  rationale: κακῶς ἔχειν jẹ́ àpólà tí ó túmọ̀ sí pé ara kò dá tàbí pé ẹni náà ṣàìsàn; “àwọn aláìsàn” sọ èyí ní kedere àti ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí òwe náà sọ nípa àìsàn ara nìkan tàbí kí ó ṣàlàyé ìtumọ̀ ẹ̀mí rẹ̀ ní tààrà
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí àwòrán ìṣègùn tó wà nínú Gíríìkì.
  alternative: Kí a fi “àwọn ẹlẹ́ṣẹ̀” tàbí àìní wọn nípa ẹ̀mí sínú ẹsẹ̀ náà.
  rationale: Àyíká ló ń fi bí Jésù ṣe lo òwe náà fún àwọn ẹlẹ́ṣẹ̀ hàn. Ẹsẹ̀ yìí fúnra rẹ̀ lo èdè ìṣègùn, nítorí náà fífi àwòrán náà sílẹ̀ ń pa ìtumọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì pa ìṣọ̀kan òwe àti àwòrán ìṣègùn Gíríìkì mọ́.
