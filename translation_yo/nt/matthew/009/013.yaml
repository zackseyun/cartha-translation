id: MAT.9.13
reference: Matthew 9:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: yo
  text: Ṣùgbọ́n ẹ lọ, kí ẹ sì kọ́ ohun tí èyí túmọ̀ sí:[a] “Àánú ni mo fẹ́, kì í ṣe ẹbọ.”[b] Nítorí èmi kò wá láti pe àwọn olódodo,[c] bí kò ṣe àwọn ẹlẹ́ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gangan sí i, “Ẹ lọ, kí ẹ sì kọ́ ohun tí èyí jẹ́.”
    reason: lexical_alternative
  - marker: b
    text: A fa ọ̀rọ̀ yìí yọ láti Hóséà 6:6.
    reason: cross_reference
  - marker: c
    text: Ó tún ṣeé ṣe kí “àwọn olódodo” túmọ̀ sí “àwọn tí wọ́n rò pé àwọn jẹ́ olódodo”; Gíríìkì kàn sọ pé “àwọn olódodo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: ẹ lọ
  rationale: Aorist participle yìí ń ṣiṣẹ́ pọ̀ mọ́ àṣẹ μάθετε; “ẹ lọ” mú ìtumọ̀ àṣẹ náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: μάθετε
  choice: kí ẹ sì kọ́
  rationale: Ó paṣẹ fún wọn láti gba ẹ̀kọ́, kí wọ́n sì lóye ìtumọ̀ ọ̀rọ̀ náà; “kọ́” pa ohùn ìbáwí àti ìtọ́ni mọ́.
- source_word: τί ἐστιν
  choice: ohun tí èyí túmọ̀ sí
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti béèrè ìtumọ̀ àti pàtàkì ọ̀rọ̀ tí a tọ́ka sí, nígbà tí àlàyé ẹsẹ̀ ń pa ìtumọ̀ gangan mọ́.
- source_word: Ἔλεος
  choice: Àánú
  rationale: “Àánú” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìṣe àánú Ọlọ́run àti ìyọ́nú sí ẹlòmíràn, ó sì bá agbára ọ̀rọ̀ Hóséà mu.
- source_word: θέλω
  choice: ni mo fẹ́
  rationale: “Fẹ́” sọ ìfẹ́-inú tàbí ohun tí ẹni ń fẹ́ kedere; ìṣètò “Àánú ni mo fẹ́” tún pa ìtẹnumọ́ tí ó wà lórí ἔλεος mọ́.
- source_word: θυσίαν
  choice: ẹbọ
  rationale: “Ẹbọ” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ohun tí a fi rúbọ; ó pa ẹyọ ọ̀rọ̀ orísun mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἦλθον
  choice: èmi kò wá
  rationale: Ó tọ́ka sí ète iṣẹ́ tí Jésù wá ṣe; fífi “èmi” hàn mú ẹni tí ń sọ̀rọ̀ àti ìtẹnumọ́ rẹ̀ ṣe kedere.
- source_word: καλέσαι
  choice: láti pe
  rationale: “Pe” lè túmọ̀ sí pípe ènìyàn wá tàbí pípe rẹ̀ sí ìdáhùn, ó sì pa ìfẹ̀ ìtumọ̀ Gíríìkì mọ́ láì dín un sí ìkésíni lásán.
- source_word: δικαίους
  choice: àwọn olódodo
  rationale: Ó túmọ̀ ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ sí ẹ̀ka àwọn ènìyàn, láì sọ pé wọ́n jẹ́ olódodo nítòótọ́ tàbí pé wọ́n kàn ka ara wọn sí olódodo.
- source_word: ἁμαρτωλούς
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé, ó sì pa ìyàtọ̀ tó lágbára láàárín àwọn olódodo àti àwọn ẹlẹ́ṣẹ̀ mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ tí a fa yọ láti Hóséà 6:6 àti agbára rẹ̀ nínú ìbáwí Jésù
  choice: “Àánú ni mo fẹ́, kì í ṣe ẹbọ” ni a túmọ̀ ní tààrà, kí ìtẹnumọ́ àsọtẹ́lẹ̀ lórí àánú ju ẹbọ lọ lè dúró.
  alternative: Láti sọ ọ́ di pé Ọlọ́run kọ gbogbo ẹbọ pátápátá, tàbí láti sọ ọ́ di ìfẹ́ kékeré kan fún àkókò yìí nìkan.
  rationale: Gíríìkì pa ìtakora àsọtẹ́lẹ̀ náà mọ́, Jésù sì lò ó láti bá àwọn Farisí wí nípa ohun tí wọ́n fi sí ipò àkọ́kọ́. A kò fi ètò ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ kún un.
- issue: Ta ni “àwọn olódodo” ń tọ́ka sí?
  choice: A fi “àwọn olódodo” sílẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́.
  alternative: “Àwọn tí wọ́n rò pé àwọn jẹ́ olódodo” tàbí “àwọn agberaga olódodo.”
  rationale: Àyíká lè jẹ́ kí òǹkàwé rí ìfọ̀rọ̀yí tàbí ìtẹ́gùn nínú ọ̀rọ̀ náà, ṣùgbọ́n Gíríìkì kò sọ ìtumọ̀ yẹn ní gbangba. Nítorí náà, a pa àìdánilójú náà mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ẹsẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí àwọn òǹkàwé lásán lè lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ọ̀rọ̀ àṣẹ “ẹ lọ, kí ẹ sì kọ́” pa ìbáwí Jésù mọ́, nígbà tí “Àánú ni mo fẹ́” ń pa ìtẹnumọ́ ọ̀rọ̀ àsọtẹ́lẹ̀ náà mọ́.
