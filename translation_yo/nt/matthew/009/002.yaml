id: MAT.9.2
reference: Matthew 9:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: yo
  text: Wò ó, wọ́n ń gbé arọ kan tí ó dùbúlẹ̀ lórí ibùsùn wá sọ́dọ̀ rẹ̀. Nígbà tí Jésù sì rí ìgbàgbọ́ wọn[a], ó sọ fún arọ náà pé, “Ọmọ, mú ọkàn le[b]; a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ náà ní Gíríìkì jẹ́ “ìgbàgbọ́ wọn.” “Wọn” lè tọ́ka sí àwọn tó gbé arọ náà wá nìkan, tàbí sí àwọn tó gbé e wá pẹ̀lú arọ náà.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Gba ìgboyà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ó pa agbára ọ̀rọ̀ ìtọ́ka tí ń pe àfiyèsí olùgbọ́ mọ́, ó sì bá ìtàn Yorùbá àkókò yìí mu láì jẹ́ ọ̀rọ̀ àtijọ́ tí kò ṣeé lóye.
- source_word: προσέφερον
  choice: wọ́n gbé ... wá sọ́dọ̀ rẹ̀
  rationale: Ó sọ ìṣe mímú ẹni náà wá sí ọ̀dọ̀ Jésù ní èdè Yorùbá àdánidá; ‘gbé’ tún bá ipò ẹni tí ó dùbúlẹ̀ lórí ibùsùn mu, láì fi kún un pé ọ̀nà kan pàtó ni wọ́n fi rù ú.
- source_word: παραλυτικὸν
  choice: arọ kan
  rationale: ‘Arọ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ara rẹ̀ rọ tàbí tí kò lè lo ẹ̀yà ara bí ó ti yẹ; ‘kan’ fi àìlópò orúkọ náà hàn.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: tí ó dùbúlẹ̀ lórí ibùsùn
  rationale: Ó ṣàpèjúwe ipò ẹni náà ní ọ̀nà tí ó ṣe kedere, ó sì fi κλίνη hàn gẹ́gẹ́ bí ibùsùn láì sọ ọ́ di ‘àkéte’ láìní ẹ̀rí tó.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún πίστις, ó sì lè ní ìtumọ̀ ìgbẹ́kẹ̀lé tí wọ́n fi ìṣe hàn nínú àyíká yìí.
- source_word: Θάρσει
  choice: mú ọkàn le
  rationale: Ó jẹ́ àṣẹ ìtùnú tó dára ní Yorùbá, tí ó ń pè ẹni náà sí ìgboyà, kì í ṣe sí àìbẹ̀rù nìkan.
- source_word: τέκνον
  choice: Ọmọ
  rationale: Ó pa ìfẹ́ inú ọ̀rọ̀ ìpè náà mọ́, kò sì fi akọ tàbí abo kún ohun tí τέκνον fúnra rẹ̀ kò sọ ní pàtó.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: Ìlò ‘a’ aláìdárúkọ fi olùṣe sílẹ̀ láìsọ, bí passive Gíríìkì náà ti ṣe, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti kéde ìdáríjì.
- source_word: ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Ó pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, ó sì lo ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn ìrékọjá sí Ọlọ́run.
theological_decisions:
- issue: Ìtumọ̀ τὴν πίστιν αὐτῶν
  choice: A pa ọ̀pọ̀ inú ‘ìgbàgbọ́ wọn’ mọ́, láìyan ẹni pàtó tí ‘wọn’ tọ́ka sí.
  alternative: Ó lè tọ́ka sí àwọn tó gbé arọ náà wá nìkan, tàbí sí wọn pẹ̀lú arọ náà.
  rationale: αὐτῶν jẹ́ ọ̀pọ̀, ṣùgbọ́n ẹsẹ̀ náà kò sọ ní pàtó bóyá arọ náà wà lára ẹgbẹ́ náà; nítorí náà a kò yanjú ohun tí orísun fi sílẹ̀ ní àìdánilójú.
- issue: Agbára ọ̀rọ̀ ìkéde ìdáríjì Jésù
  choice: ‘a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́’ jẹ́ ìkéde ìdáríjì, olùṣe sì kò ní orúkọ nínú gbólóhùn.
  alternative: A lè túmọ̀ rẹ̀ pé ‘a ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́,’ tí yóò tẹnu mọ́ abajade tí ó ti dé.
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ present passive, ó sì fi ẹni tó dárí jì sílẹ̀ láìsọ. Ìtumọ̀ àkọ́kọ́ pa ìkéde náà àti àìsọ olùṣe mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Sì wò ó’ pa ìrìn ìtàn Mátíù mọ́; ‘Ọmọ’ sì mú ìfẹ́ inú ọ̀rọ̀ Jésù jáde láìsọ akọ tàbí abo ju orísun lọ.
