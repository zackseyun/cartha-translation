  to: Wò ó, wọ́n ń gbé arọ kan tí ó dùbúlẹ̀ lórí ibùsùn wá sọ́dọ̀ rẹ̀. Nígbà tí Jésù sì rí ìgbàgbọ́ wọn[a], ó sọ fún arọ náà pé, “Ọmọ, mú ọkàn le[b]; a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́[c].”
