  terminology: ‘Arọ,’ ‘ìgbàgbọ́,’ ‘ọmọ,’ ‘mú ọkàn le,’ àti ‘a dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́’ bá ìforúkọsílẹ̀ Bíbélì Yorùbá boṣewa mu. Ìkéde ìdáríjì náà pa olùṣe rẹ̀ mọ́ nínú àìsọ, gẹ́gẹ́ bí passive Gíríìkì.
