  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtẹ̀lé àti àwọn èrò pàtàkì Gíríìkì náà mọ́: Jésù dé ilé olórí náà, ó rí àwọn tí ń fẹ́ fèrè, àti ogunlọ́gọ̀ tí ó wà nínú ariwo. ‘Olórí’ dára nítorí ó pa ìtumọ̀ gbòòrò ἄρχων mọ́, láì mú un di ‘olórí sínágọ́gù.’'
  naturalness: ‘Àwọn afèrè’ kò ṣe kedere gẹ́gẹ́ bí orúkọ fún àwọn olùfẹ́ fèrè nínú Yorùbá òde òní; ‘àwọn afùfè’ tàbí ‘àwọn tí ń fẹ́ fèrè’ dára jù. Pẹ̀lú èyí, ‘tí wọ́n ń pariwo rudurudu’ dùn bí ìṣọ̀kan ọ̀rọ̀ tí kò rọrùn. ‘tí ń ṣe ariwo’ jẹ́ èdè àdánidá, ó sì bá θορυβούμενον mu.
  terminology: A tún ṣe àtúnṣe àlàyé àṣà láti lo ‘àwọn olùṣọ̀fọ̀ aláṣẹ́mọṣẹ́,’ èyí tí ó túmọ̀ ‘professional mourners’ ní kedere. ‘Àwọn afùfè’ ní ọ̀rọ̀ pàtàkì àti nínú àlàyé jẹ́ ìtumọ̀ tó péye fún αὐλητάς ní àyíká ẹsẹ̀ yìí.
  issues:
