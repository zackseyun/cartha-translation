source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: yo
  text: Nígbà tí Jésù dé ilé olórí náà, tí ó sì rí àwọn afùfè àti ogunlọ́gọ̀ tí ń ṣe ariwo[c][b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òṣìṣẹ́ aláṣẹ”; tàbí, ní fífiwé àwọn ìtàn tó jọ ọ́, “olórí sínágọ́gù.” Ọ̀rọ̀ Mátíù níbí kàn jẹ́ “olórí.”
    reason: alternative_reading
  - marker: b
    text: Ìyẹn ni pé, àwọn olùṣọ̀fọ̀ aláṣẹ́mọṣẹ́ ti wà níbẹ̀, títí kan àwọn afùfè, gẹ́gẹ́ bí àṣà ìsìnkú ìgbà náà.
    reason: cultural_note
  - marker: c
    text: Tàbí, “tí ó wà nínú ìdàrúdàpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Nígbà tí Jésù dé
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist náà tọ́ka sí ìtẹ̀lé àkókò; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘nígbà tí/ lẹ́yìn tí ó dé’ mọ́.
- source_word: οἰκίαν
  choice: ilé
  rationale: ‘Ilé’ ni ìtumọ̀ tààrà tí ó sì bá ibi ìṣẹ̀lẹ̀ náà mu láìfi àlàyé míì kún un.
- source_word: ἄρχοντος
  choice: olórí
  rationale: Ἄρχων jẹ́ ọ̀rọ̀ gbòòrò fún ẹni tó ní ipò àṣẹ tàbí aṣáájú; ‘olórí’ pa ìtumọ̀ gbòòrò náà mọ́ láìsọ pé olórí sínágọ́gù ni.
- source_word: ἰδὼν
  choice: rí
  rationale: ‘Rí’ jẹ́ ọ̀rọ̀ ìtàn tó rọrùn, tó sì bá ìtumọ̀ orísun mu.
- source_word: αὐλητὰς
  choice: àwọn afèrè
  rationale: ‘Àwọn afèrè’ túmọ̀ sí àwọn tó ń fun fèrè; ó ṣe kedere ní Yorùbá, ó sì yẹ fún àṣà ọ̀fọ̀ tí àyíká ẹsẹ náà tọ́ka sí.
- source_word: ὄχλον
  choice: ogunlọ́gọ̀
  rationale: ‘Ogunlọ́gọ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọ̀pọ̀ ènìyàn tí ó péjọ.
- source_word: θορυβούμενον
  choice: tí wọ́n ń pariwo rudurudu
  rationale: Ó ṣàfihàn ariwo àti ìdàrúdàpọ̀ tí participle náà ní, láìsọ irú ìmọ̀lára wọn ní pàtó.
theological_decisions:
- issue: Ìdánimọ̀ ẹni tó ni ilé
  choice: olórí
  alternative: òṣìṣẹ́ aláṣẹ; olórí sínágọ́gù
  rationale: Mátíù lo ἄρχων nìkan níbí. A kò fi àlàyé pàtó láti inú àwọn ìtàn tó jọ ọ́ sínú ọ̀rọ̀ pàtàkì, kí a lè pa gbígbòòrò àti àìsọ pàtó inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. A pa ìtẹ̀lé participle méjèèjì mọ́ ní ọ̀nà Yorùbá àdánidá, a kò sì ṣe ἄρχων ní pàtó ju bí orísun ṣe sọ lọ.
