  - severity: low
    issue: ‘tí wọ́n ń pariwo rudurudu’
    rationale: Ó tún ariwo àti rudurudu sọ pọ̀ ní ọ̀nà tí kò rọrùn. ‘tí ń ṣe ariwo’ jẹ́ ìsọ̀rọ̀ Yorùbá tó dára, tí ó sì fi ariwo/ìdàrúdàpọ̀ orísun hàn.
  - severity: low
