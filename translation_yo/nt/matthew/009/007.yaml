  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγερθεὶς ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/007.yaml
  text: And he got up and went away to his house[a].
translation:
  language: yo
  text: Ó sì dìde, ó sì lọ sí ilé rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kúrò lọ sí ilé rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ yìí pa ìṣàn ìtàn tó rọrùn mọ́, láìfi ìtumọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ἐγερθεὶς
  choice: Ó dìde
  rationale: Bó tilẹ̀ jẹ́ pé ó jẹ́ participle aorist passive ní ìrísí, a lò ó ní ìtumọ̀ aláìní ohun gbígbà níbí; ‘Ó dìde’ jẹ́ Yorùbá àdánidá tó sì sọ ìṣe náà kedere.
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkúrò ní ibi kan. ‘Ó lọ’ bá ọ̀nà tí Yorùbá máa ń gbà sọ ìlọkúrò mu; àlàyé ìsàlẹ̀ fi yíyan ‘ó kúrò lọ’ hàn láti tẹnu mọ́ ìlọkúrò.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: sí ilé rẹ̀
  rationale: εἰς fi ìrìn sí ibi kan hàn, οἶκος sì jẹ́ ilé tàbí ibùgbé. ‘Sí ilé rẹ̀’ jẹ́ ìtumọ̀ tààrà, tó ṣe kedere ní Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀nà ìsọ̀rọ̀ ìtàn tó rọrùn, tó bójú mu, tí àwọn òǹkàwé òde òní lè lóye.
