id: MAT.9.22
reference: Matthew 9:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: yo
  text: Ṣùgbọ́n Jésù yíjú, ó sì rí i, ó ní, “Mú ọkàn le, ọmọbìnrin; ìgbàgbọ́ rẹ ti gbà ọ́ là.” Obìnrin náà sì rí ìwòsàn láti ìgbà náà lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì kan náà ni a túmọ̀ sí “ti gbà ọ́ là” àti “rí ìwòsàn” nínú ẹsẹ yìí; ó lè túmọ̀ sí gbà là, mú ẹni lára dá, tàbí wo sàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: yíjú
  rationale: Ó fi ìṣe yíyí sí obìnrin náà hàn láìfi ọ̀nà tí ó yí sí kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἰδὼν αὐτήν
  choice: ó sì rí i
  rationale: Gbólóhùn aláìlẹ́gbẹ̀ ní Yorùbá jẹ́ ọ̀nà àdánidá láti fi ipa participle Gíríìkì hàn nínú ìtẹ̀síwájú ìtàn.
- source_word: Θάρσει
  choice: Má bẹ̀rù
  rationale: Ọ̀rọ̀ ìtùnú Yorùbá tí ó wọ́pọ̀, tí ó ń pe ẹni náà sí ìgboyà; ‘Mú ọkàn le’ tún ṣeé lò.
- source_word: θύγατερ
  choice: ọmọbìnrin
  rationale: Ó pa ọ̀rọ̀ ìpè ìbátan onífẹ̀ẹ́ náà mọ́ láìfi ‘ọ̀wọ́n’ tàbí ìtumọ̀ míì kún un.
- source_word: ἡ πίστις σου
  choice: ìgbàgbọ́ rẹ
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tó bójú mu fún πίστις níbí, ó sì lè ní ìtumọ̀ fífi ara ẹni lé Jésù.
- source_word: σέσωκέν σε
  choice: ti gbà ọ́ là
  rationale: Ó pa ìbú ìtumọ̀ σῴζω mọ́—ìgbàlà, ìdáǹdè, àti ìmúláradá—dípò kí a fi ìwòsàn nìkan rọ́pò rẹ̀ nínú ọ̀rọ̀ Jésù.
- source_word: ἐσώθη ἡ γυνή
  choice: obìnrin náà sì ti rí ìwòsàn
  rationale: Ní ìparí ìtàn, àyíká fi hàn pé àbájáde ti ara ni ìmúláradá; ọ̀rọ̀ yìí sọ èyí ní Yorùbá àdánidá.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: Láti ìgbà náà gan-an
  rationale: Ó pa àmì àkókò mọ́, ‘gan-an’ sì mú ìtumọ̀ pé ìwòsàn bẹ̀rẹ̀ ní àkókò náà yéni.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: Àyíká ń tọ́ka sí ìgbẹ́kẹ̀lé obìnrin náà nínú Jésù, ṣùgbọ́n ‘ìgbàgbọ́’ pa ìbú ọ̀rọ̀ Gíríìkì àti ìlò Bíbélì mọ́.
- issue: Ìtumọ̀ σῴζω ní ọ̀rọ̀ Jésù àti ní ìparí ìtàn
  choice: ‘ti gbà ọ́ là’ nínú ọ̀rọ̀ Jésù; ‘rí ìwòsàn’ nínú ìparí ìtàn
  alternative: ‘ti mú ọ lára dá’ tàbí ‘ti wo ọ́ sàn’ ní àwọn ibi méjèèjì
  rationale: Ọ̀rọ̀ kan náà ní Gíríìkì lè túmọ̀ sí gbígbà là tàbí wíwòsàn. Yíyan ọ̀rọ̀ gbooro nínú àsọjáde Jésù àti ọ̀rọ̀ ìwòsàn ní ìparí pa ìdàpọ̀ ìtumọ̀ náà mọ́ láìyanjú rẹ̀ lọ́nà ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘Má bẹ̀rù’ gẹ́gẹ́ bí ọ̀rọ̀ ìtùnú àdánidá; ‘Mú ọkàn le’ jẹ́ àṣàyàn tó sun mọ́ ìtumọ̀ gangan. A fi àmì ohùn sí ibi tí ó yẹ.
