  to: Ṣùgbọ́n Jésù yíjú, ó sì rí i, ó ní, “Mú ọkàn le, ọmọbìnrin; ìgbàgbọ́ rẹ ti gbà ọ́ là.” Obìnrin náà sì rí ìwòsàn láti ìgbà náà lọ.[a]
