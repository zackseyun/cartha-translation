id: MAT.9.35
reference: Matthew 9:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: yo
  text: Jésù sì ń ká gbogbo ìlú àti abúlé kiri, ó ń kọ́ni nínú àwọn sínágọ́gù wọn, ó ń kéde ìròyìn ayọ̀ ti ìjọba náà[a], ó sì ń wo gbogbo àrùn àti gbogbo àìlera sàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìnrere ti ìjọba náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo àrùn àti gbogbo àìsàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: ń ká … kiri
  rationale: Ọ̀rọ̀-ìṣe aláìparí náà fi hàn pé Jésù ń bá ìrìn-àjò yìí lọ ní gbogbo agbègbè; ‘ń ká … kiri’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí ń tẹ̀ síwájú yìí.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: gbogbo ìlú àti abúlé
  rationale: Èyí pa ìyàtọ̀ mọ́ láàárín àwọn ibi ńlá tí ènìyàn ń gbé àti àwọn ìletò kéékèèké, ó sì tún pa ìtumọ̀ πάσας, ‘gbogbo,’ mọ́.
- source_word: διδάσκων
  choice: ń kọ́ àwọn ènìyàn
  rationale: Yorùbá sábà máa ń fẹ́ kí ẹni tí a ń kọ́ hàn nínú gbólóhùn; ‘àwọn ènìyàn’ jẹ́ ohun tí àyíká ọ̀rọ̀ túmọ̀ sí, kì í ṣe àfikún ẹ̀kọ́ ìgbàgbọ́.
- source_word: συναγωγαῖς αὐτῶν
  choice: àwọn sínágọ́gù wọn
  rationale: A pa ọ̀rọ̀ ìtàn àti ẹ̀sìn náà mọ́ ní fọ́ọ̀mù tí a yá wọ Yorùbá, a sì tú αὐτῶν sí ‘wọn.’
- source_word: κηρύσσων
  choice: ń kéde
  rationale: ‘Ń kéde’ mú èrò pípa ìhìn kan jáde ní gbangba tí κηρύσσω ní, láì fi ìtumọ̀ iṣẹ́ ìjọ òde òní kún un.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ìròyìn ayọ̀ nípa ìjọba náà
  rationale: ‘Ìròyìn ayọ̀’ sọ ìtumọ̀ εὐαγγέλιον ní èdè Yorùbá òde òní; ‘nípa ìjọba náà’ jẹ́ ọ̀nà àdánidá láti fi hàn pé ìjọba náà ni kókó ìhìn náà, láì fi ‘Ọlọ́run’ kún ọ̀rọ̀ Gíríìkì.
- source_word: θεραπεύων
  choice: ń wo … sàn
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì bá àyíká iṣẹ́ ìwòsàn mu.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: gbogbo àrùn àti gbogbo àìlera
  rationale: A tún ‘gbogbo’ ṣe gẹ́gẹ́ bí πᾶσαν ṣe fara hàn lẹ́ẹ̀mejì, a sì pa ìyàtọ̀ tó wà láàárín àrùn àti àìlera mọ́.
theological_decisions:
- issue: Bí a ṣe tú εὐαγγέλιον
  choice: ìròyìn ayọ̀
  alternative: ìhìnrere
  rationale: Àṣàyàn àkọ́kọ́ jẹ́ kedere fún òǹkàwé Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀rọ̀ ìbílẹ̀ Bíbélì mọ́ gẹ́gẹ́ bí àṣàyàn; kò sí ẹ̀kọ́ ìjọ kan pàtó tí a fi kún un.
- issue: Ìbáṣepọ̀ genitive nínú τῆς βασιλείας
  choice: nípa ìjọba náà
  alternative: ti ìjọba náà
  rationale: ‘Nípa’ ka ìjọba náà sí kókó ìròyìn náà, èyí tó bá àyíká mu. Àmọ́, ọ̀rọ̀ Gíríìkì lè gbà ìbáṣepọ̀ tó gbòòrò ju èyí lọ, nítorí náà àlàyé ìsàlẹ̀ pa ‘ti’ mọ́ gẹ́gẹ́ bí àṣàyàn tó túmọ̀ ní tààràtà sí i.
- issue: Ìwọ̀n iṣẹ́ ìwòsàn nínú πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: gbogbo àrùn àti gbogbo àìlera
  alternative: gbogbo àrùn àti gbogbo àìsàn
  rationale: A pa πᾶσαν méjèèjì mọ́ láti fi ìwọ̀n tó péye tí gbólóhùn náà sọ hàn, láì dín in kù tàbí fi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó ní iyì ṣùgbọ́n tó ṣeé lóye ní òde òní. A lo àmì ohùn ní kíkún níbi tí ó yẹ, a sì pín gbólóhùn gígùn Gíríìkì sí méjì kí kíkà rẹ̀ lè rọrùn láì yí ìbáṣepọ̀ àwọn ìṣe náà padà.
