revisions:
- from: Jésù sì ń ká gbogbo ìlú àti abúlé kiri. Ó ń kọ́ àwọn ènìyàn nínú àwọn sínágọ́gù wọn, ó ń kéde ìròyìn ayọ̀ nípa ìjọba náà[a], ó sì ń wo gbogbo àrùn àti gbogbo àìlera sàn[b].
  to: Jésù sì ń ká gbogbo ìlú àti abúlé kiri, ó ń kọ́ni nínú àwọn sínágọ́gù wọn, ó ń kéde ìròyìn ayọ̀ ti ìjọba náà[a], ó sì ń wo gbogbo àrùn àti gbogbo àìlera sàn[b].
  rationale: A yọ ohun tí a fi kún ìṣe “ń kọ́” kúrò kí ìtumọ̀ má bàa sọ ohun tí ọ̀rọ̀ Gíríìkì kò sọ ní kedere. A tún lo “ti ìjọba náà” láti pa genitive náà mọ́ ní tààràtà àti láti má ṣe fi ìtumọ̀ kan ṣoṣo dì í. Àwọn àmì àlàyé ìsàlẹ̀ wà níbi tí ó tọ́, wọ́n sì ń tọ́ka sí àwọn ọ̀rọ̀ tí wọ́n ṣàlàyé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:39Z'
