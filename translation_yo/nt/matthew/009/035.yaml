  verdict: revise
  source_fidelity: Àfikún “àwọn ènìyàn” gẹ́gẹ́ bí ohun tí Jésù ń kọ́ kò fara hàn nínú ọ̀rọ̀ Gíríìkì; bí ó tilẹ̀ jẹ́ pé a lè lóye rẹ̀ láti inú àyíká, ó yẹ kí a má fi kún ìtumọ̀ tí ó ń tẹ̀lé ọ̀rọ̀ ìpilẹ̀ pẹkipẹki. Ìbáṣepọ̀ τῆς βασιλείας sì dára jù láti tú ní tààràtà gẹ́gẹ́ bí “ti ìjọba náà,” dípò “nípa ìjọba náà,” nítorí pé “nípa” dín ìbáṣepọ̀ genitive náà kù sí kókó ọ̀rọ̀ nìkan.
