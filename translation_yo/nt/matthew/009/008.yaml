id: MAT.9.8
reference: Matthew 9:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ènìyàn rí i, ẹ̀rù bà wọ́n[a], wọ́n sì yin Ọlọ́run lógo, ẹni tí ó ti fi irú àṣẹ bẹ́ẹ̀ fún àwọn ènìyàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kún fún ìbẹ̀rù pẹ̀lú ọ̀wọ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí “ẹ̀rù bà wọ́n” ní tààrà, ṣùgbọ́n ìbẹ̀rù náà lè ní ìyanu àti ọ̀wọ̀ nínú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún aráyé” tàbí “fún ẹ̀dá ènìyàn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ènìyàn lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: nígbà tí àwọn èrò rí èyí
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó bá Yorùbá mu. “Èyí” ń tọ́ka sí ohun tí wọ́n ṣẹ̀ṣẹ̀ rí nínú àyíká ọ̀rọ̀, láì ṣàlàyé rẹ̀ ju bí orísun ṣe ṣe lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìyàtọ̀ nínú ìtàn hàn, láti inú ohun tí Jésù ṣe sí ìhùwàsí àwọn èrò.
- source_word: οἱ ὄχλοι
  choice: àwọn èrò
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ nínú Gíríìkì; “àwọn èrò” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún àwọn àwùjọ ènìyàn.
- source_word: ἐφοβήθησαν
  choice: ẹ̀rù bà wọ́n
  rationale: Èyí pa ìtumọ̀ pàtàkì ti φοβέομαι mọ́ gẹ́gẹ́ bí ìbẹ̀rù, kò sì sọ ọ́ di ìyanu ọ̀wọ̀ nìkan.
- source_word: ἐδόξασαν
  choice: yin … lógo
  rationale: Gbólóhùn Yorùbá yìí pa ìtumọ̀ “fi ògo fún/glorify” mọ́, ó sì dun bí èdè Yorùbá àdánidá.
- source_word: τὸν θεὸν
  choice: Ọlọ́run
  rationale: Èyí ni ohun tí ọ̀rọ̀-ìṣe ἐδόξασαν ń tọ́ka sí, ó sì jẹ́ ìtumọ̀ Yorùbá tó bófin mu.
- source_word: τὸν δόντα
  choice: ẹni tí ó ti fi
  rationale: A tú participle atúmọ̀-orúkọ náà sí gbólóhùn ìbátan; “ti” fi hàn pé fífi àṣẹ náà ṣáájú ìyìn àwọn èrò.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: “Àṣẹ” mú èrò ẹ̀tọ́ tàbí agbára tí a ní láti ṣe ohun kan jáde dáadáa ju “agbára” lásán lọ.
- source_word: τοιαύτην
  choice: irú … bẹ́ẹ̀
  rationale: Èyí jẹ́ ìṣọ̀kan Yorùbá àdánidá fún τοιαύτην, ó sì pa ìtọ́ka sí irú àṣẹ tí wọ́n rí mọ́.
- source_word: τοῖς ἀνθρώποις
  choice: fún àwọn ènìyàn
  rationale: ἄνθρωποι lè tọ́ka sí ẹ̀dá ènìyàn lápapọ̀. “Àwọn ènìyàn” ni Yorùbá tó péye, láì fi akọ nìkan kún ohun tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ní àyíká yìí.
theological_decisions:
- issue: Bóyá kí a rọ ìhùwàsí àwọn èrò láti “ìbẹ̀rù” sí “ìyanu ọlọ́wọ̀”
  choice: ẹ̀rù bà wọ́n
  alternative: ẹnu yà wọ́n pẹ̀lú ọ̀wọ̀
  rationale: Ọ̀rọ̀ Gíríìkì ní ìtumọ̀ ìbẹ̀rù ní tààrà; bí ó tilẹ̀ jẹ́ pé ìbẹ̀rù náà lè ní ìyanu àti ọ̀wọ̀ nínú, ìtumọ̀ kò yẹ kó yanjú àdàlù ìmọ̀lára náà láìsí dandan.
- issue: Ìtumọ̀ τοῖς ἀνθρώποις
  choice: fún àwọn ènìyàn
  alternative: fún aráyé; tàbí fún àwọn ọkùnrin
  rationale: Ọ̀pọ̀ akọ ni fọ́ọ̀mù Gíríìkì, ṣùgbọ́n ἄνθρωποι lè dúró fún ẹ̀dá ènìyàn lápapọ̀. Yorùbá “ènìyàn” pa agbára ìtumọ̀ gbogbogbò náà mọ́, àkọsílẹ̀ ìsàlẹ̀ sì jẹ́ kí òǹkàwé mọ fọ́ọ̀mù orísun.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Àwọn èrò” jẹ́ ọ̀nà àdánidá láti pa ọ̀pọ̀ οἱ ὄχλοι mọ́; “yin Ọlọ́run lógo” sì pa ìwọ̀n ẹ̀kọ́-ìgbàgbọ́ δοξάζω mọ́ láì di èdè àtijọ́.
