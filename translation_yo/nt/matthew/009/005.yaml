  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: yo
  text: 'Nítorí èwo ni ó rọrùn jù: láti sọ pé, ‘A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́,’[a] tàbí láti sọ pé, ‘Dìde, kí o sì rìn’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́.” Present passive Gíríìkì náà lè túmọ̀ sí ipò tó jẹ́ àbájáde ohun tí ó ti ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Nítorí èwo ló rọrùn jù
  rationale: Èwo ló rọrùn jù fi ìbéèrè àṣàyàn láàárín ọ̀nà méjì hàn ní Yorùbá àdánidá; Nítorí sì pa ìsopọ̀ àlàyé γάρ mọ́ pẹ̀lú ẹsẹ tó ṣáájú.
- source_word: εἰπεῖν
  choice: láti sọ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí sísọ̀rọ̀ lásán níbí; lílo ọ̀rọ̀ kan náà ní abala méjèèjì pa ìfarajọ wọn mọ́.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ̀rọ̀ ìdáríjì ní ohùn àìṣe-lórúkọ, ó sì lè fi ipò ìdáríjì tó wà nísinsìnyí hàn láì sọ pé ìṣe náà ń lọ lọ́wọ́.
- source_word: ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe déédé fún ọ̀pọ̀ ἁμαρτίαι, láì fi àpèjúwe gbèsè kún un.
- source_word: Ἔγειρε
  choice: Dìde
  rationale: Àṣẹ yìí jẹ́ ọ̀nà kúkúrú, àdánidá, tí ó sì bójú mu fún ẹni tí a mú lára dá.
- source_word: καὶ περιπάτει
  choice: kí o sì máa rìn
  rationale: Máa rìn fi ìṣe tó ń tẹ̀ síwájú tí àṣẹ present περιπάτει ní hàn lọ́nà Yorùbá àdánidá.
- source_word: σου
  choice: rẹ … ọ́
  rationale: Àwọn àmì ẹni kejì ẹyọ kan yìí pa àdírẹ́sì sí ẹni kan ṣoṣo mọ́, gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìkéde Jésù nípa ìdáríjì ẹ̀ṣẹ̀
  choice: A dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  alternative: A ti dárí àwọn ẹ̀ṣẹ̀ rẹ jì ọ́
  rationale: Gíríìkì jẹ́ present passive, ó sì lè tọ́ka sí ipò tí ó jẹ́ àbájáde ìṣe kan. Ọ̀nà àkọ́kọ́ pa ọ̀rọ̀ náà mọ́ ní ṣókí, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbà ìdáríjì kan lé e lórí; àlàyé ìsàlẹ̀ fi ọ̀nà kejì hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àmì ìbéèrè ni a fi sí òpin ẹsẹ náà, pẹ̀lú àmì ìfọ̀rọ̀wérọ̀ ìparí nítorí ẹsẹ náà wà nínú ọ̀rọ̀ Jésù tó bẹ̀rẹ̀ ṣáájú.
