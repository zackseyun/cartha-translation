source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: yo
  text: Nígbà náà, ó wí fún àwọn ọmọ ẹ̀yìn rẹ̀[a] pé, “Ìkórè pọ̀, ṣùgbọ́n àwọn òṣìṣẹ́ díẹ̀ ni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, ọ̀rọ̀-ìṣe náà wà ní àsìkò ìsinsìnyí nínú ìtàn (“ó ń wí” ní ìtumọ̀ tààrà); ní Yorùbá, a túmọ̀ ọ́ ní ìrísí ìtàn àtijọ́, “ó wí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú ìtàn hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: λέγει
  choice: ó sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí gẹ́gẹ́ bí historical present, àsìkò àtijọ́ ni ó bá ìtàn Yorùbá mu jù; àlàyé ìsàlẹ̀ ṣàkọsílẹ̀ ìrísí Gíríìkì náà.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: fún àwọn ọmọ ẹ̀yìn rẹ̀
  rationale: “Àwọn ọmọ ẹ̀yìn” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún μαθηταί, “rẹ̀” sì pa αὐτοῦ mọ́.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: … ṣùgbọ́n …
  rationale: Àsopọ̀ yìí mú ìyàtọ̀ láàárín ọ̀pọ̀ ìkórè àti díẹ̀ àwọn òṣìṣẹ́ jáde ní Yorùbá àdánidá.
- source_word: θερισμός
  choice: ìkórè
  rationale: Ó pa àwòrán iṣẹ́ oko inú ọ̀rọ̀ orísun mọ́ láìṣe àlàyé ohun tí àpèjúwe náà dúró fún.
- source_word: πολύς
  choice: pọ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ ìtumọ̀ tààrà, tí ó sì bá “ìkórè” mu ní Yorùbá òde òní.
- source_word: ἐργάται
  choice: àwọn òṣìṣẹ́
  rationale: Ó túmọ̀ àwọn tí ń ṣiṣẹ́ ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí gbogbo ènìyàn lè lóye.
- source_word: ὀλίγοι
  choice: kò pọ̀
  rationale: Ìsọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ “díẹ̀” mọ́ láìfi “kò tó” kún orísun.
theological_decisions:
- issue: Agbára àpèjúwe ìkórè
  choice: Pa àpèjúwe iṣẹ́ oko mọ́ láìṣàlàyé ohun tí ó ń tọ́ka sí nínú ẹsẹ náà.
  alternative: Ṣàlàyé ìkórè gẹ́gẹ́ bí àwọn ènìyàn tí wọ́n ti múra tán láti gba iṣẹ́ ìránṣẹ́ Jesu.
  rationale: Ọ̀rọ̀ orísun fúnra rẹ̀ kò ṣàlàyé àpèjúwe náà ní ẹsẹ yìí; fífi àlàyé sí i yóò pinnu ohun tí ọrọ̀ náà mọ̀ọ́mọ̀ fi sílẹ̀ ní àwòrán.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àsìkò àtijọ́ fún ìtàn Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa historical present Gíríìkì mọ́.
