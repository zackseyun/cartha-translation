  to: Ṣùgbọ́n àwọn Farisí ń sọ pé, “Agbára olórí[a] àwọn ẹ̀mí èṣù ni ó fi ń lé àwọn ẹ̀mí èṣù jáde.”
  rationale: A rọ́pò ‘Nípasẹ̀ ... ni ó fi ń’ pẹ̀lú ‘Agbára ... ni ó fi ń’ láti mú ohun-èlo ἐν + dative hàn ní Yorùbá tó wúlò, láìtun samí rẹ̀ lẹ́ẹ̀mejì. A pa imperfect ‘ń sọ’ àti ‘ń lé ... jáde’ mọ́, pẹ̀lú ẹ̀sùn àwọn Farisí gẹ́gẹ́ bí ọ̀rọ̀ tí wọ́n ń sọ, kì í ṣe òtítọ́ tí atúmọ̀ ń fìdí rẹ̀ múlẹ̀.
