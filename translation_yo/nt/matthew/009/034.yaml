id: MAT.9.34
reference: Matthew 9:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn Farisí ń sọ pé, “Agbára olórí[a] àwọn ẹ̀mí èṣù ni ó fi ń lé àwọn ẹ̀mí èṣù jáde.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “alákòóso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ yìí fi ìyàtọ̀ hàn láàárín ìyanu àwọn ènìyàn nínú ẹsẹ tó ṣáájú àti ẹ̀sùn àwọn Farisí.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Èyí ni orúkọ ẹgbẹ́ Júù náà tí ó wọ́pọ̀, tí ó sì pa àtẹ̀jáde ọ̀pọ̀ nínú Gíríìkì mọ́.
- source_word: ἔλεγον
  choice: ń sọ
  rationale: Àkókò imperfect nínú Gíríìkì lè tọ́ka sí ọ̀rọ̀ tí wọ́n ń sọ lọ́wọ́ tàbí tí wọ́n máa ń sọ; ‘ń sọ’ pa ìtẹ̀síwájú yẹn mọ́.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Nípasẹ̀ olórí
  rationale: ἐν pẹ̀lú dative níbí ń tọ́ka sí ohun èlò tàbí agbára tí a fi ṣe ohun kan; ‘nípasẹ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ẹ̀sùn náà.
- source_word: ἄρχοντι
  choice: olórí
  rationale: ‘Olórí’ túmọ̀ sí ẹni tó ní àṣẹ lórí àwọn mìíràn, ó sì bá ἄρχων mu láìfi èrò ipò ọmọ-aládé kún un.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: àwọn ẹ̀mí èṣù
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn ẹ̀dá ẹ̀mí tí ó jẹ́ ti èṣù, ó sì yẹ fún ọ̀rọ̀ ìléjáde wọn.
- source_word: ἐκβάλλει
  choice: ń lé ... jáde
  rationale: ‘Lé ... jáde’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún ἐκβάλλω, ó sì pa ìtumọ̀ ìléjáde ẹ̀mí èṣù mọ́.
theological_decisions:
- issue: Ìtumọ̀ δαιμόνια ní àyíká ìléjáde
  choice: àwọn ẹ̀mí èṣù
  alternative: àwọn ẹ̀mí búburú
  rationale: ‘Àwọn ẹ̀mí èṣù’ tọ́ka sí àwọn ẹ̀dá ẹ̀mí aburu ní pàtó, ó sì yẹra fún fífi ìtumọ̀ gbogbogbò ‘ẹ̀mí búburú’ rọ́pò ọ̀rọ̀ Gíríìkì.
- issue: Orísun agbára tí àwọn Farisí fi kan Jésù
  choice: Nípasẹ̀ olórí àwọn ẹ̀mí èṣù
  alternative: Nínú olórí àwọn ẹ̀mí èṣù
  rationale: Àyíká gbólóhùn náà fi ἐν hàn gẹ́gẹ́ bí ohun èlò tàbí agbára tí a fi ń ṣe iṣẹ́, kì í ṣe ibi tí ẹni kan wà; ìtumọ̀ náà pa ẹ̀sùn àwọn Farisí mọ́ láìjẹ́rìí sí i gẹ́gẹ́ bí òtítọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn. Àmì ohùn kún un níbi tí ó yẹ; ìkọ̀lé ‘ni ó fi ń’ mú ìtumọ̀ ohun èlò tàbí agbára hàn ní ọ̀nà Yorùbá àdánidá.
