  to: Bí wọ́n sì ti ń jáde, wò ó, wọ́n mú ọkùnrin kan tí kò lè sọ̀rọ̀[a], tí ẹ̀mí èṣù sì ń ṣe é[b], wá sọ́dọ̀ rẹ̀.
  rationale: Àtúnṣe náà yọ kókó-ọrọ̀ tí a fi kún un (“àwọn kan”) kúrò kí ìtumọ̀ náà lè pa àìdánimọ̀ orísun mọ́. Ó tún lo ọ̀nà Yorùbá tó rọrùn, “tí ẹ̀mí èṣù ń ṣe é,” láti ṣàfihàn δαιμονιζόμενον láìpinnu ju ohun tí Gíríìkì sọ lọ. A pa “wò ó” mọ́ fún ἰδού, a sì pa àṣàyàn ìtumọ̀ κωφός mọ́ nínú ẹsẹ̀-sàlẹ̀.
