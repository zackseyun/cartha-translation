  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: yo
  text: Bí wọ́n sì ti ń jáde, wò ó, wọ́n mú ọkùnrin kan tí kò lè sọ̀rọ̀[a], tí ẹ̀mí èṣù sì ń ṣe é[b], wá sọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò lè gbọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí kò lè sọ̀rọ̀ tàbí ẹni tí kò lè gbọ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀. Níbí, ẹsẹ̀ tó tẹ̀ lé e, tí ó sọ pé ọkùnrin náà sọ̀rọ̀, ṣe àtìlẹ́yìn fún “tí kò lè sọ̀rọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ó ní ẹ̀mí èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Bí wọ́n sì ti ń jáde lọ
  rationale: Èyí fi ìṣe tí ó ń lọ lọ́wọ́ hàn, ó sì jẹ́ kí δέ ṣiṣẹ́ gẹ́gẹ́ bí àmì ìyípadà nínú ìtàn láìfi ìtumọ̀ kún un.
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ọ̀rọ̀ yìí fa àfiyèsí olùkà sí ohun tuntun tí ó ṣẹlẹ̀, bí ἰδού ti ṣe nínú ìtàn.
- source_word: προσήνεγκαν αὐτῷ
  choice: àwọn kan mú ... wá sọ́dọ̀ rẹ̀
  rationale: Ó sọ kedere pé àwọn ènìyàn tí a kò dárúkọ ni wọ́n mú ọkùnrin náà tọ Jesu wá; ‘sọ́dọ̀ rẹ̀’ fi αὐτῷ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἄνθρωπον
  choice: ọkùnrin kan
  rationale: Nínú àyíká ìtàn yìí, ἄνθρωπος ń tọ́ka sí ọkùnrin kan.
- source_word: κωφὸν
  choice: tí kò lè sọ̀rọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé κωφός lè túmọ̀ sí adití tàbí odi, ẹsẹ tó tẹ̀ lé e sọ pé ọkùnrin náà bẹ̀rẹ̀ sí í sọ̀rọ̀; nítorí náà, àìlè sọ̀rọ̀ ni àyíká yìí ń tẹnumọ́.
- source_word: δαιμονιζόμενον
  choice: tí ó sì ní ẹ̀mí èṣù
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ẹ̀mí èṣù ń ṣe é, láìṣàlàyé ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìpọ́njú láti ọwọ́ ẹ̀mí èṣù
  choice: tí ó sì ní ẹ̀mí èṣù
  alternative: tí ẹ̀mí èṣù ń ṣe ní jìnnìjìnnì
  rationale: Ìtumọ̀ yìí gba bí ìtàn ṣe sọ ní tààrà pé ìṣòro náà ní í ṣe pẹ̀lú ẹ̀mí èṣù, ṣùgbọ́n kò fi ẹ̀kọ́ àfikún sí i nípa bí ẹ̀mí náà ṣe ń ṣiṣẹ́ nínú ọkùnrin náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó bójú mu, tí ó sì ní iyì. ‘Wò ó’ pa agbára ìfa-àfiyèsí ἰδού mọ́; ‘àwọn kan’ jẹ́ kí kókó-ọrọ̀ ọ̀rọ̀-ìṣe ọ̀pọ̀ ẹni hàn láìdárúkọ àwọn tí orísun kò dárúkọ.
