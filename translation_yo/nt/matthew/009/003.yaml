reference: Matthew 9:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: yo
  text: Sì kíyèsí i, àwọn kan lára àwọn akọ̀wé sọ láàárín ara wọn[a] pé, “Ọkùnrin yìí ń sọ̀rọ̀-òdì sí Ọlọ́run.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “sọ fún ara wọn.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ àṣírí láàárín wọn tàbí sí ohun tí olúkúlùkù ń rò lọ́kàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Sì
  rationale: Ó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú rẹ̀ ní ọ̀nà àlàyé tó bá Yorùbá mu.
- source_word: ἰδού
  choice: kíyèsí i
  rationale: Ó pa agbára àmì ọ̀rọ̀ tó ń pe àfiyèsí mọ́, ó sì jẹ́ èdè Yorùbá tó ṣeé lóye.
- source_word: τινες τῶν γραμματέων
  choice: àwọn kan lára àwọn akọ̀wé
  rationale: Ó fi hàn pé apá kan ṣoṣo nínú ẹgbẹ́ àwọn akọ̀wé ni a ń tọ́ka sí, láì sọ iye wọn.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: sọ láàárín ara wọn
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ ènìyàn àti àìdánilójú bóyá ọ̀rọ̀ àṣírí ni tàbí ìrònú inú mọ́; àlàyé míì wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: Οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó jẹ́ ìtọ́kasí àdánidá sí ọkùnrin kan, ó sì lè gbé ìró àfojúdi inú ọ̀rọ̀ náà láì fi ọ̀rọ̀ ẹ̀gàn kun un.
- source_word: βλασφημεῖ
  choice: ń sọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Nínú àyíká yìí, ẹ̀sùn náà ni pé Jésù ń sọ ohun tó ń tàbùkù sí Ọlọ́run; gbolohun yìí ṣe kedere sí òǹkàwé Yorùbá òde òní.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ẹ̀sùn àwọn akọ̀wé sí Jésù
  choice: Ọkùnrin yìí ń sọ̀rọ̀-òdì sí Ọlọ́run
  alternative: Ọkùnrin yìí ń sọ ọ̀rọ̀-àyẹpẹ̀ sí Ọlọ́run
  rationale: A pa ẹ̀sùn náà mọ́ gẹ́gẹ́ bí àwọn akọ̀wé ṣe gbé e kalẹ̀, láì ṣàlàyé tàbí dáhùn ẹ̀sùn náà níbi yìí, kí ìforígbárí ẹ̀kọ́-ìgbàgbọ́ inú ìtàn náà lè dúró.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. “Àwọn akọ̀wé” pa orúkọ iṣẹ́ γραμματεῖς mọ́, “kíyèsí i” sì jẹ́ àmì àfiyèsí tó ní ìwúwo láì di èdè àtijọ́ jù.
