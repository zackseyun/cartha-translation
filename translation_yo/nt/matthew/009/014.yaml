review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal transition, John’s disciples, the contrast with the Pharisees, and the customary/frequent sense of the present-tense fasting verbs plus πολλά. However, “tọ̀ ọ́ wá” is not a natural Standard Yoruba rendering of προσέρχονται αὐτῷ (‘came/approached him’); it can suggest seeking or pursuing him rather than coming to him.
  naturalness: The question is otherwise clear and appropriately modern. “Wá sọ́dọ̀ rẹ̀” is the ordinary, unambiguous Yoruba expression for coming to someone, and the revised coordination reads more smoothly.
  terminology: “Àwọn ọmọ-ẹ̀yìn,” “gbààwẹ̀,” “Jòhánù,” and “Farisí” suitably preserve the passage’s religious and personal terminology. No doctrinal interpretation has been added. The frequent-practice force of πολλά is adequately expressed by “lọ́pọ̀ ìgbà,” so no footnote is necessary in Yoruba.
  issues:
  - severity: medium
    issue: “tọ̀ ọ́ wá” for προσέρχονται αὐτῷ
    rationale: This wording is not idiomatic for approaching or coming to a person in this context and may imply that the disciples came looking for Jesus. “Wá sọ́dọ̀ rẹ̀” directly and naturally expresses the source sense.
  revised_text: Nígbà náà ni àwọn ọmọ-ẹ̀yìn Jòhánù wá sọ́dọ̀ rẹ̀, wọ́n sì ní, “Èé ṣe tí àwa àti àwọn Farisí fi máa ń gbààwẹ̀ lọ́pọ̀ ìgbà, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ kì í gbààwẹ̀?”
  revised_footnotes: []
  revision_rationale: The sole substantive revision replaces an unnatural motion expression with idiomatic Standard Yoruba while retaining the source’s reference to coming to Jesus. The wording continues to present fasting as a recurring practice and retains the contrast without strengthening it into an accusation.
