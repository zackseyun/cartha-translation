revisions:
- from: Nígbà náà ni àwọn ọmọ-ẹ̀yìn Jòhánù tọ̀ ọ́ wá, wọ́n ní, “Èé ṣe tí àwa àti àwọn Farisí fi máa ń gbààwẹ̀ lọ́pọ̀ ìgbà, ṣùgbọ́n tí àwọn ọmọ-ẹ̀yìn rẹ kì í gbààwẹ̀?”
  to: Nígbà náà ni àwọn ọmọ-ẹ̀yìn Jòhánù wá sọ́dọ̀ rẹ̀, wọ́n sì ní, “Èé ṣe tí àwa àti àwọn Farisí fi máa ń gbààwẹ̀ lọ́pọ̀ ìgbà, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ kì í gbààwẹ̀?”
  rationale: The sole substantive revision replaces an unnatural motion expression with idiomatic Standard Yoruba while retaining the source’s reference to coming to Jesus. The wording continues to present fasting as a recurring practice and retains the contrast without strengthening it into an accusation.
  reviewer_model: gpt-5.6-terra
