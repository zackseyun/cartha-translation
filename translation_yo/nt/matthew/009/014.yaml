id: MAT.9.14
reference: Matthew 9:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: yo
  text: Nígbà náà ni àwọn ọmọ-ẹ̀yìn Jòhánù wá sọ́dọ̀ rẹ̀, wọ́n sì ní, “Èé ṣe tí àwa àti àwọn Farisí fi máa ń gbààwẹ̀ lọ́pọ̀ ìgbà, ṣùgbọ́n àwọn ọmọ-ẹ̀yìn rẹ kì í gbààwẹ̀?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà
  rationale: Ó jẹ́ àmì àkókò tó so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: προσέρχονται αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣíkiri wọn sí ọ̀dọ̀ Jésù hàn lọ́nà Yorùbá tó ṣe kedere, láìfi èrò míì kún un.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: àwọn ọmọ-ẹ̀yìn Jòhánù
  rationale: Èyí ni ìtumọ̀ àdánidá fún àjọṣe genitive náà, pẹ̀lú orúkọ Jòhánù gẹ́gẹ́ bí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Ó sọ participle náà di ọ̀rọ̀ Yorùbá tó ń ṣàn dáadáa, ó sì fi hàn pé ọ̀rọ̀ wọn bá wíwá wọn lọ.
- source_word: Διὰ τί
  choice: Èé ṣe tí
  rationale: Ọ̀nà Yorùbá tó wọ́pọ̀ àti tó ṣe kedere láti béèrè ìdí.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: àwa àti àwọn Farisí
  rationale: Ó pa ìtẹnumọ́ tó wà lórí ‘àwa’ àti ìfiwéra pẹ̀lú àwọn Farisí mọ́.
- source_word: νηστεύομεν
  choice: máa ń gbààwẹ̀
  rationale: ‘Gbààwẹ̀’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún fífi oúnjẹ sílẹ̀ nítorí ìṣe ẹ̀sìn; ‘máa ń’ fi ìṣe àṣà tàbí ìṣe tó ń ṣẹlẹ̀ léraléra hàn.
- source_word: πολλά
  choice: lọ́pọ̀ ìgbà
  rationale: Ní ìbámu pẹ̀lú νηστεύομεν, πολλά ń tọ́ka sí bí ìṣe náà ṣe máa ń ṣẹlẹ̀ léraléra; ‘lọ́pọ̀ ìgbà’ mú èyí jáde ní Yorùbá àdánidá.
- source_word: οἱ δὲ μαθηταί σου
  choice: ṣùgbọ́n tí àwọn ọmọ-ẹ̀yìn rẹ
  rationale: ‘Ṣùgbọ́n’ mú ìtakora δέ jáde, tí ìṣètò gbolohun Yorùbá náà sì pa ìfiwéra mọ́.
- source_word: οὐ νηστεύουσιν
  choice: kì í gbààwẹ̀
  rationale: Fọ́ọ̀mù yìí ń tọ́ka sí àṣà tí wọn kò máa ń ṣe, kì í ṣe dandan pé ọjọ́ kan ṣoṣo ni wọn kò gbààwẹ̀.
theological_decisions:
- issue: Irú ẹ̀sùn tàbí ìbéèrè nípa ààwẹ̀
  choice: Ṣe e gẹ́gẹ́ bí ìfiwéra àwọn àṣà ìsìn tí wọ́n máa ń ṣe
  alternative: Kí a túmọ̀ ọ́ bí ẹ̀sùn pé àwọn ọmọ-ẹ̀yìn Jésù ń ṣàìgbọràn sí àṣẹ kan, tàbí pé ààwẹ̀ ọjọ́ kan pàtó ni ọ̀rọ̀ náà dá lé
  rationale: Àwọn ọ̀rọ̀ ìṣe present àti πολλά tọ́ka sí ìṣe tó máa ń ṣẹlẹ̀ léraléra. Ìtumọ̀ náà pa ìbéèrè àti ìfọ̀rọ̀wérọ̀ ẹ̀sìn mọ́ láìdájọ́ ohun tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì rọrùn fún gbogbo ènìyàn. A kò fi àmì àlàyé [a] sí ọ̀rọ̀ náà nítorí ‘lọ́pọ̀ ìgbà’ ti sọ iṣẹ́ adverbial πολλά kedere, kò sì sí àlàyé ìsàlẹ̀ tó ṣe pàtàkì fún àìdánilójú gidi.
