source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí a lé ogunlọ́gọ̀ náà jáde, ó wọlé, ó di ọwọ́ ọmọbìnrin náà mú, ọmọbìnrin náà sì dìde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “a sì jí ọmọbìnrin náà dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: ὅτε fi àkókò hàn, δέ sì jẹ́ àsopọ̀ pẹ̀lẹ́. ‘Ṣùgbọ́n nígbà tí’ pa ìyípadà ìtàn náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: a lé àwọn ènìyàn náà jáde
  rationale: Aorist passive ἐξεβλήθη ni a túmọ̀ pẹ̀lú àpólà aláìlórúkọ ‘a lé ... jáde,’ èyí tó pa ìtumọ̀ yíyọ àwọn ènìyàn kúrò mọ́ láìjẹ́ kí ó dà bí ìlé ẹ̀mí èṣù jáde.
- source_word: εἰσελθὼν
  choice: ó wọlé
  rationale: Aorist participle náà tọ́ka sí ìṣe tó ṣáájú ìṣe pàtàkì; ‘ó wọlé’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: ó di ọmọbìnrin náà lọ́wọ́
  rationale: κρατέω pẹ̀lú genitive túmọ̀ sí dídì mú; ‘di ... lọ́wọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún mímú ọwọ́ ẹni.
- source_word: τὸ κοράσιον
  choice: ọmọbìnrin náà
  rationale: κοράσιον túmọ̀ sí ọmọdébìnrin tàbí ọmọbìnrin; ‘ọmọbìnrin náà’ bá èdè Yorùbá òde òní mu, ó sì tọ́ka sí ẹni tí a ti mẹ́nu kàn.
- source_word: ἠγέρθη
  choice: dìde
  rationale: Aorist passive ἠγέρθη lè ní ìtumọ̀ intransitive pé ẹni náà dìde, tàbí passive pé a jí i dìde. ‘Dìde’ jẹ́ àdánidá, ó sì yẹra fún fífi ẹni tó ṣe ìṣe náà kun ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ ἠγέρθη nínú àyíká pípadà sí ìyè
  choice: ọmọbìnrin náà sì dìde
  alternative: a sì jí ọmọbìnrin náà dìde
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ passive, ṣùgbọ́n ó lè ṣiṣẹ́ bí ọ̀rọ̀ intransitive nínú irú àyíká yìí. Àkọ́kọ́ pa ìtumọ̀ àbájáde mọ́ láìfipá pinnu bí a ṣe gbọdọ̀ sọ agency; àlàyé ìsàlẹ̀ ojú-ewé pa àṣàyàn passive mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ; gbolohun náà tẹ̀lé ìṣàn ìtàn Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa àìdánilójú ἠγέρθη mọ́.
