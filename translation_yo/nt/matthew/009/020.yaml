id: MAT.9.20
reference: Matthew 9:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: yo
  text: Sì wò ó! Obìnrin kan tí ẹ̀jẹ̀ ti ń ṣàn lára rẹ̀ fún ọdún méjìlá wá láti ẹ̀yìn rẹ̀, ó sì fọwọ́ kan etí aṣọ rẹ̀.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘ìkángun aṣọ,’ ‘okùn etí aṣọ,’ tàbí ‘ìṣọ̀ṣọ́ etí aṣọ.’ Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí etí aṣọ tàbí sí okùn ìṣọ̀ṣọ́ tí ó wà ní etí aṣọ àwọn Júù.
    reason: lexical_alternative
  - marker: b
    text: Wo Númérì 15:38 àti Diutarónómì 22:12 fún ìpìlẹ̀ àṣà àwọn okùn tàbí ìṣọ̀ṣọ́ etí aṣọ nínú Òfin Ísírẹ́lì.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa àmì ìsọ̀rọ̀ àti agbára ìpe àfiyèsí ἰδού mọ́, ní ọ̀nà tí ó bójú mu ní Yorùbá òde òní.
- source_word: γυνὴ αἱμορροοῦσα
  choice: obìnrin kan tí ó ti ń ṣàn ẹ̀jẹ̀
  rationale: Ó fi hàn pé ìṣàn ẹ̀jẹ̀ náà jẹ́ ipò tí ó ń bá a lọ, láìlo ọ̀rọ̀ ìṣègùn tí ó lè túmọ̀ sí ìṣẹ̀lẹ̀ líle ojijì.
- source_word: δώδεκα ἔτη
  choice: fún ọdún méjìlá
  rationale: Ìlò ‘fún’ jẹ́ ọ̀nà àdánidá láti sọ àkókò tí ipò náà fi pé ní Yorùbá.
- source_word: προσελθοῦσα ὄπισθεν
  choice: wá láti ẹ̀yìn rẹ̀
  rationale: Ó sọ ìtòsí rẹ̀ sí Jesu láti ẹ̀yìn ní kedere, ó sì tẹ̀ lé ìṣe tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì.
- source_word: ἥψατο
  choice: fọwọ́ kan
  rationale: Ó túmọ̀ ìfọwọ́kàn díẹ̀ láìfi ìtumọ̀ líle bíi dídì mú un kún ọ̀rọ̀ náà.
- source_word: τοῦ κρασπέδου
  choice: etí
  rationale: ‘Etí aṣọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìkángun tàbí ìṣọ̀ṣọ́ etí aṣọ, ó sì jẹ́ kí àìdánilójú bóyá ó jẹ́ etí, ìṣọ̀ṣọ́, tàbí okùn etí aṣọ dúró.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: aṣọ rẹ̀
  rationale: ἱμάτιον tọ́ka sí aṣọ ìta ní gbogbogbòò; ‘aṣọ’ kò fi irú aṣọ kan pàtó lé ọ̀rọ̀ Gíríìkì náà lórí.
theological_decisions:
- issue: Ìtumọ̀ Júù tí κράσπεδον lè ní gẹ́gẹ́ bí okùn tàbí ìṣọ̀ṣọ́ etí aṣọ
  choice: Lo ‘etí aṣọ’ nínú ẹsẹ̀ náà
  alternative: Lo ‘okùn etí aṣọ’ tàbí ‘ìṣọ̀ṣọ́ etí aṣọ’ láti tẹnumọ́ àṣà aṣọ àwọn Júù
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí etí aṣọ tàbí okùn/ìṣọ̀ṣọ́ rẹ̀, ṣùgbọ́n ẹsẹ̀ yìí kò ṣàlàyé ìtumọ̀ àṣà náà ní tààrà. Ìtumọ̀ gbogbogbòò pa àìdánilójú náà mọ́, àlàyé ìsàlẹ̀ ojú-ewé sì tọ́ka sí àṣà tó ṣeé ṣe.
translation_notes:
  register: Yorùbá àมาตรฐาน tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. ‘Sì kíyèsí i’ dá agbára ìpe àfiyèsí inú ìtàn náà dúró; ‘etí aṣọ’ jẹ́ àdánidá, kò sì fi ìtumọ̀ àṣà kan ṣoṣo múlẹ̀.
