id: MAT.9.1
reference: Matthew 9:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: yo
  text: Ó sì wọ ọkọ̀ ojú omi kan, ó sì sọdá, ó sì dé ìlú tirẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlú ìbílẹ̀ rẹ̀.” Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé “ìlú tirẹ̀”; ó lè tọ́ka sí ìlú tí ó ní ìbáṣepọ̀ pẹ̀lú rẹ̀ ní apá ìtàn yìí, ó sì ṣeé ṣe kí ó jẹ́ Kápánáúmù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: wọ
  rationale: Aorist participle yìí ṣáájú àwọn ọ̀rọ̀-ìṣe pàtàkì. Èdè Yorùbá àdánidá lè fi ìtẹ̀síwájú ìtàn hàn pẹ̀lú ‘ó sì wọ’ láìsọ ọ́ di gbólóhùn líle.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi kan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ọkọ̀ tí a fi ń rìn lórí omi ní gbogbogbòò; ‘ọkọ̀ ojú omi’ bá àyíká Òkun Gálílì mu ju ọ̀rọ̀ tó lè túmọ̀ sí ọkọ̀ ńlá lọ. ‘Kan’ fi àìní àríkálì hàn lọ́nà àdánidá.
- source_word: διεπέρασεν
  choice: ó rékọjá
  rationale: διαπεράω ń tọ́ka sí lílọ láti apá kan sí apá kejì, pàápàá lórí omi. ‘Rékọjá’ pa ìtumọ̀ ìdarí náà mọ́.
- source_word: ἦλθεν
  choice: ó sì dé
  rationale: Ní àyíká yìí, ‘dé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó bá ìtàn mu láti sọ pé ó wá sí ibi náà.
- source_word: τὴν ἰδίαν πόλιν
  choice: ìlú tirẹ̀
  rationale: Ìtumọ̀ yìí pa èrò ohun tó jẹ́ tirẹ̀ tàbí tó ní ìbáṣepọ̀ pẹ̀lú rẹ̀ mọ́, láìfi kún un pé ibẹ̀ ni wọ́n ti bí i tàbí pé ìlú kan pàtó ni.
- source_word: Καὶ ... καὶ
  choice: Ó sì ... ó sì
  rationale: Àtúnṣe ‘sì’ pa ìsopọ̀ àti ìtẹ̀síwájú àwọn ìṣe inú ìtàn mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìlú wo ni ‘ìlú tirẹ̀’ ń tọ́ka sí?
  choice: A túmọ̀ ọ́ láìdárúkọ ìlú náà nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí Kápánáúmù, tàbí ní gbogbogbòò gẹ́gẹ́ bí ibùgbé rẹ̀ ní Gálílì.
  rationale: Ọ̀rọ̀ Gíríìkì kò dárúkọ ìlú náà. Bí ó tilẹ̀ jẹ́ pé àyíká ìtàn ṣeé ṣe kí ó tọ́ka sí Kápánáúmù, ìtumọ̀ gbọ́dọ̀ pa àìsọ pàtó inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ara èdè jẹ́ àdánidá, ọlọ́wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo ‘rékọjá’ láti mú ìṣe líla omi hàn ní ṣókí, a sì pa ‘ìlú tirẹ̀’ mọ́ láìyanju ìdánimọ̀ ìlú náà nínú ọ̀rọ̀ pàtàkì.
