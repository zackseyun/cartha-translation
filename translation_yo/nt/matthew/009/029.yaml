source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: yo
  text: Nígbà náà, ó kan ojú wọn, ó ní, “Gẹ́gẹ́ bí ìgbàgbọ́ yín[a], kí ó ṣẹlẹ̀ fún yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Gẹ́gẹ́ bí ìgbẹ́kẹ̀lé yín, kí ó ṣẹlẹ̀ fún yín.” Ọ̀rọ̀ Gíríìkì pistis tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé,” tàbí, ní àwọn àyíká kan, “ìwà òtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìṣẹ̀lẹ̀ yìí hàn gẹ́gẹ́ bí ohun tó tẹ̀ lé ohun tí ó ṣáájú nínú ìtàn.
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: ó fi ọwọ́ kan ojú wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ara kan nǹkan; fífi ‘ọwọ́’ kún un jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan fọwọ́ kan ojú, láìṣe àfikún ìtumọ̀ ẹ̀kọ́ ìsìn.
- source_word: λέγων
  choice: ó ní
  rationale: Bí ó tilẹ̀ jẹ́ pé participle ni Gíríìkì, ‘ó ní’ so ọ̀rọ̀ tí Jésù sọ mọ́ ìṣe náà ní Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: gẹ́gẹ́ bí ìgbàgbọ́ yín
  rationale: ‘Gẹ́gẹ́ bí’ pa èrò ìbámu tàbí òṣùwọ̀n κατά mọ́, láìsọ ọ́ di ohun tó dá lórí ìdí tàbí ẹ̀tọ́; ‘ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún πίστις ní àyíká yìí.
- source_word: γενηθήτω ὑμῖν
  choice: Kí ó rí bẹ́ẹ̀ fún yín
  rationale: Ìtumọ̀ yìí pa agbára àṣẹ ẹni-kẹta ti γενηθήτω mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìkéde pé kí ohun náà ṣẹlẹ̀ sí àǹfààní wọn.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ọ̀rọ̀ ìwòsàn
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: Ní àyíká náà, àwọn afọ́jú náà gbẹ́kẹ̀ lé agbára Jésù láti mú wọn láradá. ‘Ìgbàgbọ́’ dá àṣà ọ̀rọ̀ Bíbélì Yorùbá mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé fi ‘ìgbẹ́kẹ̀lé’ hàn gẹ́gẹ́ bí ìtumọ̀ tó ṣeé ṣe.
- issue: Ìbáṣepọ̀ κατά pẹ̀lú ìgbàgbọ́ wọn
  choice: gẹ́gẹ́ bí ìgbàgbọ́ yín
  alternative: ní ìbámu pẹ̀lú ìgbàgbọ́ yín
  rationale: A kò túmọ̀ κατά sí ‘nítorí’ tàbí ‘lórí ìpìlẹ̀’ kí a má bàa sọ ìgbàgbọ́ wọn di ohun tó fa ìwòsàn ní ọ̀nà tí Gíríìkì kò fi dandan sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, pẹ̀lú àmì ohùn ní kíkún. ‘Ó fi ọwọ́ kan ojú wọn’ àti ‘Kí ó rí bẹ́ẹ̀ fún yín’ jẹ́ àdánidá fún olùkà Yorùbá, wọ́n sì pa ìtumọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
