id: MAT.9.28
reference: Matthew 9:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: yo
  text: Nígbà tí ó sì wọ inú ilé[a], àwọn ọkùnrin afọ́jú náà tọ̀ ọ́ wá. Jésù sì bi wọ́n pé, “Ṣé ẹ gbàgbọ́ pé mo lè ṣe èyí?” Wọ́n dá a lóhùn pé, “Bẹ́ẹ̀ ni, Olúwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí ó dé inú ilé, àwọn ọkùnrin afọ́jú náà wá sọ́dọ̀ rẹ̀.”
    reason: previous_rendering
  - marker: b
    text: Tàbí, “Ọ̀gá.” Ọ̀rọ̀ Gíríìkì κύριε lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ fún ẹni, ṣùgbọ́n a túmọ̀ rẹ̀ sí “Olúwa” níbí láti pa ìṣeeṣe náà mọ́ pé ọ̀rọ̀ náà lè tún fi ọlá àṣẹ Jésù hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Nígbà tí ó sì wọ inú ilé
  rationale: Ọ̀rọ̀ yìí fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn nípa àkókò. ‘Wọ inú ilé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìlọ sí inú ilé, ‘sì’ sì ń gbé δέ jáde láìjẹ́ kí gbolohun le.
- source_word: προσῆλθον αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: προσέρχομαι túmọ̀ sí sísún mọ́ ẹni tàbí wíwá sọ́dọ̀ rẹ̀. ‘Tọ̀ ọ́ wá’ jẹ́ èdè Yorùbá àdánidá tó fi ìtọ̀sí sí Jésù hàn.
- source_word: οἱ τυφλοί
  choice: àwọn ọkùnrin afọ́jú náà
  rationale: Àpèjúwe náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ọkùnrin méjì inú àyíká ẹsẹ̀ yìí; fífi ‘ọkùnrin’ kún un mú ẹni tí a ń tọ́ka sí ṣe kedere.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jésù sì bi wọ́n pé
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní ‘sọ fún wọn,’ ohun tí ó tẹ̀ lé e jẹ́ ìbéèrè. ‘Bi wọ́n pé’ jẹ́ ọ̀nà Yorùbá tó bójú mu, tí kò yí iṣẹ́ ọ̀rọ̀ náà padà.
- source_word: Πιστεύετε
  choice: Ṣé ẹ gbàgbọ́
  rationale: πιστεύω níbí ń béèrè bóyá wọ́n ní ìgbọ́kànlé pé Jésù lágbára láti ṣe ohun tí wọ́n ń fẹ́. ‘Gbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìtumọ̀ yìí.
- source_word: ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: pé mo lè ṣe èyí
  rationale: ‘Mo lè’ fi agbára tàbí àṣeṣe δύναμαι hàn ní èdè Yorùbá tó rọrùn, ‘ṣe èyí’ sì tọ́ka sí ìwòsàn tí wọ́n ń wá láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: Wọ́n dá a lóhùn pé, ‘Bẹ́ẹ̀ ni’
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní tààrà ‘wọ́n sọ fún un,’ ‘dá a lóhùn’ jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá nítorí pé wọ́n ń fèsì sí ìbéèrè. ‘Bẹ́ẹ̀ ni’ jẹ́ ìdáhùn ìfọwọ́sí tó bá Ναί mu.
- source_word: κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ àṣẹ àti ọlá mọ́, ó sì tún jẹ́ kí ó ṣeé ṣe pé àwọn ọkùnrin náà mọ ọlá àṣẹ Jésù. Àmọ́ ọ̀rọ̀ Gíríìkì náà tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ lásán.
theological_decisions:
- issue: Ìtumọ̀ κύριε nígbà tí a ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa àǹfààní ìtumọ̀ tó jinlẹ̀ nípa ọlá àṣẹ Jésù mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé κύριε tún lè jẹ́ ọ̀rọ̀ ìbọ̀wọ̀ bí ‘Ọ̀gá’; nítorí náà a kò fi dandan sọ pé ó jẹ́ ìjẹ́wọ́ Kristolóǹjì tó pé.
- issue: Àwọn ọ̀rọ̀ ìṣe ìsinsìnyí inú ìtàn, λέγει àti λέγουσιν
  choice: 'A fi wọ́n hàn pẹ̀lú ìtẹ̀síwájú ìtàn Yorùbá: ‘Jésù sì bi wọ́n’ àti ‘Wọ́n dá a lóhùn’'
  alternative: Jésù ń bi wọ́n / Wọ́n ń sọ fún un
  rationale: Yorùbá kò nílò láti fara wé historical present Gíríìkì pẹ̀lú àmì ‘ń,’ èyí tí yóò lè túmọ̀ sí ìṣe tó ń lọ lọ́wọ́. Àwọn fọ́ọ̀mù tí a yàn pa ìtẹ̀síwájú àti ìtumọ̀ ìtàn mọ́ láìdá àsìkò tuntun sílẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘Ṣé ẹ gbàgbọ́’ fún ìbéèrè àdánidá, ‘tọ̀ ọ́ wá’ fún sísún mọ́ ẹni, àti ‘dá a lóhùn’ fún ìfèsì. Gbogbo àmì ohùn ni a fi síbi tó yẹ.
