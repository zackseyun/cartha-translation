id: MAT.9.21
reference: Matthew 9:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: yo
  text: Nítorí ó ń sọ nínú ara rẹ̀ pé, “Bí mo bá kàn fọwọ́ kan aṣọ rẹ̀, a ó gbà mí là.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “a ó mú mi láradá,” tàbí, “ara mi yóò yá.” Gíríìkì sọ pé, “a ó gbà mí là,” ní lílo ọ̀rọ̀-ìṣe kan tí ó tún lè tọ́ka sí ìwòsàn nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ó ń sọ
  rationale: Àkókò imperfect fi ìṣe tí ń lọ lọ́wọ́ tàbí tí a ń ṣe léraléra hàn; “ó ń sọ” pa apá yìí mọ́ ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìtàn tó yí i ká gẹ́gẹ́ bí àlàyé ìdí.
- source_word: ἐν ἑαυτῇ
  choice: nínú ara rẹ̀
  rationale: Ó túmọ̀ sí ọ̀rọ̀ inú tàbí èrò tí obìnrin náà ń sọ fún ara rẹ̀, láìsọ ọ́ sókè.
- source_word: Ἐὰν μόνον
  choice: Bí mo bá kàn lè
  rationale: Ó pa ipò àídájú àti ìtẹnumọ́ pé fífi ọwọ́ kàn án nìkan tó mọ́.
- source_word: ἅψωμαι
  choice: fọwọ́ kan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ọwọ́ kan ní àyíká ọ̀rọ̀ yìí, kì í ṣe dandan mímú ohun náà dì.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: aṣọ rẹ̀
  rationale: ἱμάτιον lè jẹ́ aṣọ àwọ̀lékè tàbí aṣọ ìbora; “aṣọ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi irú aṣọ kan pàtó kún un.
- source_word: σωθήσομαι
  choice: a ó gbà mí là
  rationale: Ó pa ìtumọ̀ gbígbòòrò σῴζω mọ́—ìgbàlà tàbí ìmúláradá—nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìwòsàn nínú àyíká ọ̀rọ̀ hàn.
theological_decisions:
- issue: Ìtumọ̀ σωθήσομαι nínú àyíká ìwòsàn
  choice: a ó gbà mí là
  alternative: ara mi yóò dá; a ó mú mi láradá
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìwòsàn ara, ṣùgbọ́n Gíríìkì lo ọ̀rọ̀ gbígbòòrò σῴζω. Ìtumọ̀ àkọ́kọ́ pa ìfẹ̀ rẹ̀ mọ́ láìdín in kù sí ìwòsàn nìkan, àlàyé ìsàlẹ̀ sì ṣàlàyé ìtumọ̀ tó bá àyíká mu.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Nínú ara rẹ̀” jẹ́ àfihàn ọ̀rọ̀ inú tó sún mọ́ orísun, “Bí mo bá kàn lè” sì jẹ́ àdánidá fún ìtẹnumọ́ Ἐὰν μόνον.
