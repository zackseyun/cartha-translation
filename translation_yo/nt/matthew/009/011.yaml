id: MAT.9.11
reference: Matthew 9:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: yo
  text: Nígbà tí àwọn Farisí rí èyí[a], wọ́n sì ń sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé, “Èé ṣe tí olùkọ́ yín fi ń bá àwọn agbowó òde àti àwọn ẹlẹ́ṣẹ̀ jẹun?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìṣètò tó sún mọ́ Gíríìkì: “Nígbà tí àwọn Farisí rí èyí, wọ́n ń sọ fún àwọn ọmọ-ẹ̀yìn rẹ̀ pé ...” Participle Gíríìkì náà kò sọ ohun tí wọ́n rí ní kedere; ó ń tọ́ka sí ìṣẹ̀lẹ̀ jíjẹun nínú àyíká ọ̀rọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nígbà tí ... rí èyí
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó bá Yorùbá mu. “Èyí” ń tọ́ka sí ìṣẹ̀lẹ̀ jíjẹun tí ó wà nínú àyíká ọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ohun tí wọ́n rí ní tààrà.
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àmì imperfect náà lè fi ìṣe tó ń lọ lọ́wọ́ hàn; “wọ́n ń sọ” pa ìwòye yìí mọ́ ju “wọ́n sọ” lọ.
- source_word: μαθηταῖς
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μαθητής, ó sì pa ìbáṣepọ̀ olùkọ́ àti akẹ́kọ̀ọ́ tó ń tẹ̀ lé e mọ́.
- source_word: Διὰ τί
  choice: Èé ṣe
  rationale: Ìbéèrè Yorùbá àdánidá fún ìdí ohun kan ni.
- source_word: τελωνῶν
  choice: àwọn agbowó òde
  rationale: Ọ̀rọ̀ yìí jẹ́ ìtumọ̀ Yorùbá tó mọ́gbọ́n dání fún àwọn tí ń gba owó orí tàbí owó ìjọba, ó sì yà wọ́n sọ́tọ̀ kúrò lọ́dọ̀ àwọn agbowó lásán.
- source_word: ἁμαρτωλῶν
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Ìtumọ̀ tààrà, tó sì pa ìtumọ̀ ẹgbẹ́ àwọn tí a kà sí ẹlẹ́ṣẹ̀ nínú àwùjọ àti nípa ìwà mọ́.
- source_word: ἐσθίει
  choice: ń ... jẹun
  rationale: Fọ́ọ̀mù ìsinsìnyí nínú ìbéèrè náà ni a fi “ń” hàn; “jẹun” jẹ́ ọ̀rọ̀ àdánidá, tí kò fi àṣà àkànṣe kún un.
- source_word: διδάσκαλος
  choice: olùkọ́
  rationale: Ìtumọ̀ kedere àti tààrà ni, láì yí i padà sí akọ́lé míì bí “rábì.”
theological_decisions:
- issue: Bóyá kí a sọ ohun tí àwọn Farisí rí ní kedere
  choice: A fi “èyí” kún un nínú ọ̀rọ̀ pàtàkì
  alternative: “Nígbà tí àwọn Farisí sì rí i” tàbí “Àwọn Farisí sì rí, wọ́n ń sọ...”
  rationale: Gíríìkì fi ohun tí wọ́n rí sílẹ̀ láì sọ ọ́, ṣùgbọ́n Yorùbá àdánidá nílò àfihàn ohun náà. “Èyí” tọ́ka sí ìṣẹ̀lẹ̀ jíjẹun nínú àyíká ọ̀rọ̀ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Àwọn agbowó òde” àti “àwọn ọmọ-ẹ̀yìn” jẹ́ àwọn ọ̀rọ̀ Bíbélì Yorùbá tí ó ye àwọn òǹkàwé òde òní, nígbà tí ìṣètò gbólóhùn náà ṣì jẹ́ ti ẹ̀dá Yorùbá.
