id: MAT.9.27
reference: Matthew 9:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: yo
  text: Bí Jésù sì ti ń kọjá lọ láti ibẹ̀, àwọn ọkùnrin afọ́jú méjì tẹ̀ lé e, wọ́n ń ké pé, “Ṣàánú wa, Ọmọ Dáfídì![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ Dáfídì” jẹ́ orúkọ oyè ọba-Mèsáyà, tí ó ń fi Jésù hàn gẹ́gẹ́ bí ajogún tí a ti ṣèlérí nínú ìran Dáfídì.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: ti ń kọjá lọ láti ibẹ̀
  rationale: Ọ̀rọ̀ ìṣe alábápín ní àkókò ìsinsìnyí fi hàn pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ bí Jésù ti ń tẹ̀ síwájú kúrò níbẹ̀; ‘ń kọjá lọ láti ibẹ̀’ pa ìṣàn ìtàn náà mọ́ láì fi kún un pé ó kàn ń kọjá lẹ́gbẹ̀ẹ́ àwọn ọkùnrin náà.
- source_word: ἠκολούθησαν αὐτῷ
  choice: tẹ̀ lé e
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún títẹ̀ lé ẹnì kan ní ti ara nínú ìtàn.
- source_word: δύο τυφλοὶ
  choice: àwọn ọkùnrin afọ́jú méjì
  rationale: Àpèjúwe Gíríìkì jẹ́ akọ ní ọ̀pọ̀; fífi ‘ọkùnrin’ kún un mú ohun tí a mọ̀ sí inú ọ̀rọ̀ náà hàn ní Yorùbá.
- source_word: κράζοντες καὶ λέγοντες
  choice: wọ́n ń ké pé
  rationale: ‘Ń ké’ mú ohùn gíga àti ìrawọ́ ẹ̀bẹ̀ náà jáde; ‘pé’ ni ọ̀nà Yorùbá àdánidá láti darí ọ̀rọ̀ tí wọ́n sọ, láì ṣe àtúnṣe ọ̀rọ̀ tí kò rọrùn.
- source_word: Ἐλέησον ἡμᾶς
  choice: Ṣàánú fún wa
  rationale: Ó jẹ́ ẹ̀bẹ̀ tààrà fún ìṣe àánú, a sì lo gbólóhùn Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu.
- source_word: υἱὲ Δαυίδ
  choice: Ọmọ Dáfídì
  rationale: A pa orúkọ oyè ìlérí ọba náà mọ́ dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ‘àtọmọdọ́mọ Dáfídì.’
theological_decisions:
- issue: Ìtumọ̀ Mèsáyà nínú ‘Ọmọ Dáfídì’
  choice: Lo orúkọ oyè náà gan-an, ‘Ọmọ Dáfídì,’ nínú ẹsẹ̀.
  alternative: ‘Àtọmọdọ́mọ Dáfídì’ tàbí ‘Ọmọ Dáfídì tó jẹ́ Mèsáyà.’
  rationale: Gíríìkì fi orúkọ oyè ìbílẹ̀ náà sílẹ̀ láì ṣe àlàyé rẹ̀. Ìtumọ̀ yìí pa ìtumọ̀ ọba àti Mèsáyà rẹ̀ mọ́, kò sì fi àlàyé tí kò sí nínú ẹsẹ̀ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo ‘wọ́n ń ké pé’ láti mú àwọn ọ̀rọ̀ alábápín Gíríìkì méjèèjì jáde lọ́nà Yorùbá àdánidá.
