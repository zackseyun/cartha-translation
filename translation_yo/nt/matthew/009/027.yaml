  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ìṣe Jésù tí ń lọ kúrò níbẹ̀, àwọn ọkùnrin afọ́jú méjì tí wọ́n tẹ̀ lé e, ìkígbe ẹ̀bẹ̀ wọn, àti oyè náà ni a ti pa mọ́. ‘Ọmọ Dáfídì’ yẹ, ó sì dá oyè υἱὲ Δαυίδ padà láì túmọ̀ rẹ̀ ní àfikún nínú ẹsẹ̀.'
