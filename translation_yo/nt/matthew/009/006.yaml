id: MAT.9.6
reference: Matthew 9:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: yo
  text: Ṣùgbọ́n kí ẹ lè mọ̀ pé Ọmọ Ènìyàn[a] ní àṣẹ lórí ilẹ̀ ayé láti dárí ẹ̀ṣẹ̀ jì”—nígbà náà ni ó sọ fún ọkùnrin arọ náà pé, “Dìde, gbé ibùsùn rẹ[b], kí o sì lọ sí ilé rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ẹni tí ó jẹ́ ènìyàn.” A pa “Ọmọ Ènìyàn” mọ́ nítorí pé ó jẹ́ orúkọ oyè Jésù, ó sì ṣeé ṣe kó ń tọ́ka sí Dáníẹ́lì 7.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “àkéte.” Ọ̀rọ̀ Gíríìkì κλίνη lè tọ́ka sí ibùsùn, àga ìgbọ̀nsẹ̀, tàbí àkéte tí a fi ń sùn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Ṣùgbọ́n kí ẹ lè mọ̀
  rationale: Ó pa ìyípadà onírẹ̀lẹ̀ tí δέ mú wá àti ète tí ἵνα ń fi hàn mọ́, ní Yorùbá àdánidá.
- source_word: ἐξουσίαν ἔχει
  choice: ní àṣẹ
  rationale: ἐξουσία níbí túmọ̀ sí àṣẹ tàbí ẹ̀tọ́ tó bófin mu, kì í ṣe agbára láti ṣe ohun kan lásán.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni orúkọ oyè tí Jésù máa ń fi pe ara rẹ̀; ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó fi ibi tí àṣẹ náà ti ń ṣiṣẹ́ hàn ní kedere, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: ἀφιέναι ἁμαρτίας
  choice: láti dárí ẹ̀ṣẹ̀ jì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ẹ̀ṣẹ̀ jì tàbí yíyọ ẹ̀bi rẹ̀ kúrò; èyí ni ọ̀nà Yorùbá tó ṣe kedere jù.
- source_word: τότε λέγει
  choice: nígbà náà ni ó sọ
  rationale: Yorùbá sábà máa ń lo àsìkò tí ó ti kọjá nínú ìtàn; ọ̀rọ̀ yìí tún pa ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà mọ́.
- source_word: τῷ παραλυτικῷ
  choice: fún ọkùnrin arọ náà
  rationale: Adjective náà dúró gẹ́gẹ́ bí nọ́ọ̀nù; àfikún ‘ọkùnrin’ mú un ṣe kedere àti àdánidá ní Yorùbá láìfi èrò míì kún un.
- source_word: Ἐγερθεὶς
  choice: Dìde
  rationale: Bí ó tilẹ̀ jẹ́ participle ní ìrísí Gíríìkì, ó ń ṣiṣẹ́ bí àṣẹ nínú ọ̀wọ̀ àwọn àṣẹ yìí.
- source_word: ἆρόν
  choice: gbé
  rationale: Ó túmọ̀ sí gbé ohun náà sókè kí ó sì mú un lọ; ‘gbé’ bójú mu ní àyíká yìí.
- source_word: κλίνην
  choice: ibùsùn
  rationale: κλίνη lè jẹ́ ibùsùn, àkéte, tàbí ohun tí a dùbúlẹ̀ sí; ‘ibùsùn’ ni ọ̀rọ̀ Yorùbá tó gbòòrò jù.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: lọ sí ilé rẹ
  rationale: Ó jẹ́ àṣẹ tààrà láti lọ sí ilé tirẹ̀; gbolohun náà ṣe kedere ó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Orúkọ oyè Kristi ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni tí ó jẹ́ ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa orúkọ oyè Jésù àti ìṣọ̀kan rẹ̀ pẹ̀lú Dáníẹ́lì 7 mọ́, láìsọ ìtumọ̀ rẹ̀ di èrò ìtumọ̀ kan ṣoṣo.
- issue: Ìwà ἐξουσία nínú dídárí ẹ̀ṣẹ̀ jì
  choice: àṣẹ
  alternative: agbára tàbí ẹ̀tọ́
  rationale: Ẹsẹ náà tẹnu mọ́ àṣẹ tó bófin mu láti dárí ẹ̀ṣẹ̀ jì, kì í ṣe agbára iṣẹ́ ìyanu nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ’ nínú ‘kí ẹ lè mọ̀’ tọ́ka sí ọ̀pọ̀ ènìyàn; ‘o’ nínú àṣẹ náà tọ́ka sí ọkùnrin arọ náà. Ìdádúró gígùn àti àmì àyọlò pa ìdáwọ́dúró ọ̀rọ̀ Jésù mọ́ bí ó ṣe wà nínú orísun.
