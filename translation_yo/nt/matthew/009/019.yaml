  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì: “dìde” ń sọ ἐγερθεὶς, “tẹ̀ lé e” ń sọ ἠκολούθει αὐτῷ, ẹni náà sì tọ́ka sí olórí tí a mẹ́nuba nínú ẹsẹ̀ tó ṣáájú. Àfikún àwọn ọmọ-ẹ̀yìn Jésù pẹ̀lú ìṣe títẹ̀lé náà tún fi ìṣọ̀kan καὶ οἱ μαθηταὶ αὐτοῦ hàn ní kedere. Bí ó tilẹ̀ jẹ́ pé imperfect lè ní ìrẹ̀lẹ̀ ìṣe tí ń lọ lọ́wọ́, ìtumọ̀ ìtàn ní ìṣẹ̀lẹ̀ ti kọjá jẹ́ yíyan tó bójú mu ní Yorùbá.'
  naturalness: Gbolohun náà jẹ́ Yorùbá boṣewa tó dára, tó sì yẹ fún ìtàn Ìhìn Rere. “Jésù sì dìde” àti “ó tẹ̀ lé e” ń ṣàn dáadáa. “Pẹ̀lú” ní ìparí gbolohun fún ìtumọ̀ ‘also/too’ jẹ́ èdè tí ó gbà wọ́pọ̀, ó sì jẹ́ kedere nínú àyíká yìí.
  terminology: “Àwọn ọmọ-ẹ̀yìn” jẹ́ ọ̀rọ̀ ìtẹ́wọ́gbà àti tó péye fún μαθηταί nínú àwọn Ìhìn Rere. Orúkọ “Jésù” àti ìlò “tẹ̀ lé e” jẹ́ ìlò tí ó bára mu pẹ̀lú ìforúkọsílẹ̀ Bíbélì Yorùbá àti Yorùbá òde òní.
