id: MAT.9.19
reference: Matthew 9:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: yo
  text: Jésù sì dìde, ó tẹ̀ lé e, àwọn ọmọ-ẹ̀yìn rẹ̀ sì tẹ̀ lé e pẹ̀lú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: dìde
  rationale: Ọ̀rọ̀ yìí jẹ́ aorist passive participle tí a lò ní ìtumọ̀ aláìrékọjá níbí; “dìde” jẹ́ ọ̀nà àdánidá, ṣókí láti fi ìgbésẹ̀ tí ó ṣáájú títẹ̀lé hàn.
- source_word: ἠκολούθει
  choice: tẹ̀ lé e
  rationale: Imperfect náà lè fi ìṣe tí ń lọ lọ́wọ́ hàn, ṣùgbọ́n nínú ìtàn Yorùbá “tẹ̀ lé e” sọ ìṣẹ̀lẹ̀ náà lọ́nà àdánidá, ó sì pa ìtumọ̀ lílọ lẹ́yìn ẹni mọ́.
- source_word: αὐτῷ
  choice: e
  rationale: Arọ́pò-orúkọ dative náà jẹ mọ́ ἀκολουθέω, ẹni tí ó ń tọ́ka sí sì ni olórí inú ẹsẹ tó ṣáájú; nítorí náà “tẹ̀ lé e” ni èdè Yorùbá àdánidá.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: “Àwọn ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn tí ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tẹ̀ lé e; ó péye ju “àwọn akẹ́kọ̀ọ́” lọ ní àyíká Ìhìn Rere.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀ sì tẹ̀ lé e pẹ̀lú
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò tún ọ̀rọ̀-ìṣe náà sọ, títún “tẹ̀ lé e” sọ ní Yorùbá mú kí ẹni tí wọ́n tẹ̀ lé ṣe kedere, “pẹ̀lú” sì pa ìtumọ̀ καὶ mọ́.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye ní kíkà ìtàn. A lo “Jésù sì dìde” dípò àkópọ̀ participle líle, a sì tún ọ̀rọ̀-ìṣe náà sọ fún ìṣàn gbolohun tó ṣe kedere.
