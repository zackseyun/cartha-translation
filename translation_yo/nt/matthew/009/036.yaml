id: MAT.9.36
reference: Matthew 9:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: yo
  text: Nígbà tí ó sì rí àwọn èrò náà, àánú wọn ṣe é, nítorí pé a ti pọ́n wọn lójú, a sì ti sọ wọ́n lulẹ̀[a], bí àgùntàn tí kò ní olùṣọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń jìyà, wọn kò sì lè ran ara wọn lọ́wọ́.” Àwọn ọ̀rọ̀ Gíríìkì wọ̀nyí tún lè ṣe àpèjúwe àwọn èrò tí ìpọ́njú ti rẹ̀, tí wọn kò sì lè tọ́jú ara wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Nígbà tí ó sì rí
  rationale: A tú participle aorist náà sí gbólóhùn àkókò tó bá Yorùbá mu, nígbà tí “sì” ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ onírẹ̀lẹ̀ fún δέ.
- source_word: τοὺς ὄχλους
  choice: àwọn èrò náà
  rationale: “Àwọn èrò” jẹ́ ọ̀nà Yorùbá adayébá láti sọ̀rọ̀ nípa ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì pa ìtumọ̀ ọ̀pọ̀ nínú ὄχλους mọ́.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: àánú wọn ṣe é
  rationale: Àpólà yìí jẹ́ ọ̀rọ̀ Yorùbá adayébá fún ìmọ̀lára àánú jíjinlẹ̀; kò sọ agbára ìmọ̀lára ọ̀rọ̀ Gíríìkì náà di aláìlágbára.
- source_word: ὅτι ἦσαν
  choice: nítorí pé wọ́n wà
  rationale: Ó fi ìdí tí àánú fi ṣe Jesu hàn ní kedere, ó sì ṣàfihàn ipò tí àwọn èrò náà wà nínú rẹ̀.
- source_word: ἐσκυλμένοι
  choice: ní ìdààmú
  rationale: Ó ṣàfihàn pé a ti pọ́n wọn lójú tàbí pé ìpọ́njú ti rẹ̀ wọ́n, láìfi ìtumọ̀ gangan tí ó lè dà bí fífọ awọ ara kún un.
- source_word: καὶ ἐρριμμένοι
  choice: wọ́n sì ti wó lulẹ̀
  rationale: Ó pa àwòrán ῥίπτω mọ́ pé a ti sọ wọ́n kalẹ̀ tàbí pé wọ́n ti wó lulẹ̀, dípò yíyan ìtumọ̀ ìtúmọ̀-jinlẹ̀ “aláìlólùrànlọ́wọ́” nìkan.
- source_word: ὡσεὶ πρόβατα
  choice: bí àwọn àgùntàn
  rationale: Ó gbé àfiwé Gíríìkì náà jáde ní Yorùbá adayébá.
- source_word: μὴ ἔχοντα ποιμένα
  choice: tí kò ní olùṣọ́
  rationale: Ó pa àwòrán àwọn àgùntàn tí kò ní ẹni tó ń tọ́jú tàbí darí wọn mọ́ ní ṣókí.
theological_decisions:
- issue: Ọ̀rọ̀ àánú Jesu
  choice: àánú wọn ṣe é
  alternative: ọkàn rẹ̀ fà sí wọn nínú àánú
  rationale: Yíyan yìí fi àánú jíjinlẹ̀ Jesu hàn ní èdè Yorùbá tó wọ́pọ̀, láìfi àlàyé ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀ náà.
- issue: Ipò àwọn èrò
  choice: wọ́n wà ní ìdààmú, wọ́n sì ti wó lulẹ̀
  alternative: wọ́n ń jìyà, wọn kò sì lè ran ara wọn lọ́wọ́
  rationale: Ọ̀rọ̀ àkọ́kọ́ fi ìpọ́njú wọn hàn, èkejì sì pa àwòrán pé a ti sọ wọ́n lulẹ̀ mọ́. A kò fi ìtumọ̀ “aláìlólùrànlọ́wọ́” rọ́pò àwòrán Gíríìkì náà ní pàtó, ṣùgbọ́n a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ adayébá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. “Àwọn èrò” yẹra fún ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí ó wuwo ju, “àánú wọn ṣe é” sì jẹ́ àpólà Yorùbá tí ó lágbára tó sì wọ́pọ̀.
