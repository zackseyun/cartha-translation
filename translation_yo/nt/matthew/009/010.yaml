id: MAT.9.10
reference: Matthew 9:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, bí ó ti dùbúlẹ̀ láti jẹun nínú ilé náà[a], kíyèsí i, ọ̀pọ̀ àwọn agbowó-orí àti àwọn ẹlẹ́ṣẹ̀ wá, wọ́n sì bá Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ dùbúlẹ̀ láti jẹun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ náà sọ ‘nínú ilé náà’ nìkan; kò sọ ní tààrà nínú ẹsẹ yìí pé ta ni ilé náà jẹ́.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ἐγένετο
  choice: Ó sì ṣẹlẹ̀ pé, bí ...
  rationale: Ọ̀rọ̀ yìí ṣe iṣẹ́ àsopọ̀ ìtàn, ó sì tún mú ìbáṣepọ̀ àkókò tó wà nínú gbólóhùn Gíríìkì jáde láì jẹ́ kí Yorùbá le koko.
- source_word: ἀνακειμένου / συνανέκειντο
  choice: jókòó síbi oúnjẹ / bá ... jókòó síbi oúnjẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ibi jíjẹun àti jíjẹun papọ̀ hàn. Àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ ìdúbalẹ̀ níbi oúnjẹ tó wà nínú Gíríìkì mọ́.
- source_word: ἐν τῇ οἰκίᾳ
  choice: nínú ilé náà
  rationale: Ó tẹ̀ lé ìdánimọ̀ ilé náà nínú Gíríìkì, ṣùgbọ́n kò fi kun ẹni tí ilé náà jẹ́.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: Ó pa iṣẹ́ ọ̀rọ̀ náà gẹ́gẹ́ bí àmì tó ń pe àfiyèsí olùkà sí ohun tó tẹ̀ lé mọ́.
- source_word: τελῶναι
  choice: àwọn agbowó-orí
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tó ń gba owó-orí, ó sì bá ipò wọn nínú àyíká ìtàn mu.
- source_word: ἁμαρτωλοὶ
  choice: àwọn ẹlẹ́ṣẹ̀
  rationale: Àjẹtífù náà dúró gẹ́gẹ́ bí orúkọ ẹgbẹ́ ènìyàn níbí; ‘àwọn ẹlẹ́ṣẹ̀’ pa ìsọ̀rí ẹ̀sìn àti àwùjọ inú ẹsẹ náà mọ́.
- source_word: ἐλθόντες
  choice: wá
  rationale: Fífi ọ̀rọ̀-ìṣe aláṣẹ Yorùbá lò jẹ́ ọ̀nà àdánidá láti tú participle aorist náà, ó sì pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ
  choice: Jesu àti àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Àwọn wọ̀nyí ni ọ̀nà Yorùbá tó gbajúmọ̀, tó sì péye fún orúkọ Jesu àti ìbáṣepọ̀ olùkọ́ pẹ̀lú àwọn akẹ́kọ̀ọ́-alágbàásí rẹ̀.
theological_decisions:
- issue: Ìrísí jíjẹun papọ̀ àti ìdúbalẹ̀ níbi oúnjẹ
  choice: Lo ‘jókòó síbi oúnjẹ’ nínú ẹsẹ, kí àlàyé sì sọ ní pàtó pé Gíríìkì túmọ̀ sí dídùbúlẹ̀ níbi oúnjẹ.
  alternative: dùbúlẹ̀ níbi tábìlì / ń jẹun
  rationale: ‘Jókòó síbi oúnjẹ’ jẹ́ Yorùbá àdánidá, ó sì pa àwòrán ìdàpọ̀ níbi oúnjẹ mọ́; àlàyé náà kò jẹ́ kí àṣà ìdúbalẹ̀ tí ọ̀rọ̀ Gíríìkì tọ́ka sí sọnù.
- issue: Ta ni ilé náà jẹ́
  choice: Má ṣe sọ ẹni tó ni ilé náà nínú ẹsẹ.
  alternative: ilé Mátíù / ilé rẹ̀
  rationale: Gíríìkì sọ ‘nínú ilé náà’ nìkan. Bó tilẹ̀ jẹ́ pé àyíká ìtàn lè mú kí a ronú pé ilé Mátíù ni, ẹsẹ yìí fúnra rẹ̀ kò sọ bẹ́ẹ̀ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní; ‘kíyèsí i’ pa ìpè sí àfiyèsí ti ἰδοὺ mọ́.
