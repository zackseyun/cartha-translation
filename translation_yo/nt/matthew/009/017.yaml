id: MAT.9.17
reference: Matthew 9:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: yo
  text: Wọn kì í da wáìnì tuntun sínú àwọn àpò awọ àtijọ́ fún wáìnì náà. Bí bẹ́ẹ̀ kọ́, àwọn àpò awọ náà á ya, wáìnì náà á dà nù, àwọn àpò awọ náà á sì bàjẹ́. Kàkà bẹ́ẹ̀, wọ́n ń da wáìnì tuntun sínú àwọn àpò awọ tuntun fún wáìnì[a], a sì pa àwọn méjèèjì mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì lo ọ̀rọ̀ méjì tó yàtọ̀: νέος fún wáìnì tuntun, àti καινός fún àwọn àpò awọ tuntun; ọ̀rọ̀ kejì lè tẹnu mọ́ tuntun tàbí ìpò rere wọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Bẹ́ẹ̀ ni … kì í
  rationale: Ó so àpẹẹrẹ yìí mọ́ ọ̀rọ̀ òwe tí ó ṣáájú, ó sì sọ ìṣe tí àwọn ènìyàn kì í ṣe ní Yorùbá àdánidá.
- source_word: βάλλουσιν
  choice: da … sínú
  rationale: Nígbà tí ohun tí a ń fi sínú àpò jẹ́ wáìnì, ‘da … sínú’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu ju ìtumọ̀ gangan bí ‘ju’ lọ.
- source_word: οἶνον νέον
  choice: wáìnì tuntun
  rationale: Ó tọ́ka sí wáìnì tí a ṣẹ̀ṣẹ̀ ṣe, ó sì pa ìfarahàn adjective àti noun mọ́.
- source_word: ἀσκούς
  choice: àwọn àpò awọ wáìnì
  rationale: Ó ṣàlàyé kedere pé àpò tí a fi awọ ẹranko ṣe, tí a sì ń fi wáìnì pamọ́ sí, ni a ń sọ.
- source_word: παλαιούς
  choice: àtijọ́
  rationale: Ó fi ọjọ́-orí àti ipò àpò náà hàn, ó sì dúró ní ìtakora pẹ̀lú καινούς.
- source_word: εἰ δὲ μή γε
  choice: Bí bẹ́ẹ̀ kọ́
  rationale: Ọ̀nà Yorùbá àdánidá ni láti fi ìkìlọ̀ pé àbájáde kan yóò tẹ̀ lé bí a kò bá ṣe ohun tó yẹ.
- source_word: ῥήγνυνται
  choice: yóò bẹ́
  rationale: ‘Bẹ́’ sọ ní kedere pé àpò awọ yóò ya sílẹ̀ nítorí agbára inú rẹ̀.
- source_word: ἐκχεῖται
  choice: yóò dà nù
  rationale: Ó mú ìtumọ̀ pé wáìnì náà tú jáde, ó sì ṣòfò, hàn ní Yorùbá àdánidá.
- source_word: ἀπόλλυνται
  choice: yóò bàjẹ́
  rationale: Ní àyíká yìí, ó túmọ̀ sí pé àwọn àpò náà kò ní ṣeé lò mọ́; ‘bàjẹ́’ sọ èyí di mímọ̀ láì sọ ọ́ di ìparun pátápátá.
- source_word: ἀλλὰ
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi àtúnṣe tó yàtọ̀ sí ìṣe tí kò tọ́ hàn ní kedere.
- source_word: καινούς
  choice: tí ó ṣì tuntun
  rationale: Gbólóhùn yìí tẹnu mọ́ ipò tuntun tàbí rere àwọn àpò, bí ó tilẹ̀ jẹ́ pé Yorùbá sábà máa ń lo ‘tuntun’ fún νέος àti καινός méjèèjì.
- source_word: ἀμφότεροι συντηροῦνται
  choice: àwọn méjèèjì yóò sì wà ní àìbàjẹ́
  rationale: Ó tọ́ka sí wáìnì àti àwọn àpò awọ papọ̀, ó sì pa ìtumọ̀ pípa àwọn méjèèjì mọ́ mọ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín νέος àti καινός nínú ẹsẹ kan náà
  choice: Túmọ̀ νέος sí ‘tuntun,’ kí a sì túmọ̀ καινός sí ‘tí ó ṣì tuntun,’ pẹ̀lú àlàyé ìsàlẹ̀ ìwé.
  alternative: Lo ‘tuntun’ lásán fún méjèèjì.
  rationale: Gíríìkì lo ọ̀rọ̀ méjì tó yàtọ̀. Ìtumọ̀ yìí kò fi ẹ̀kọ́ ìsìn kún un, ṣùgbọ́n ó jẹ́ kí a rí ìyàtọ̀ tó wà láàárín wáìnì tuntun nípa àkókò àti àpò tuntun nípa ipò rẹ̀.
translation_notes:
  register: A lo Yorùbá àdánidá, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Wáìnì’ jẹ́ ọ̀rọ̀ tó wọ́pọ̀; ‘àpò awọ wáìnì’ ṣàlàyé ohun èlò ayé àtijọ́ láì fi àlàyé tó pọ̀ sínú ara ẹsẹ.
