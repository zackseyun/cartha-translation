id: MAT.9.26
reference: Matthew 9:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: yo
  text: Ìròyìn yìí sì tàn dé gbogbo agbègbè náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ká gbogbo ilẹ̀ náà” tàbí “dé gbogbo àgbègbè náà.” Ọ̀rọ̀ Gíríìkì γῆ lè túmọ̀ sí ilẹ̀, ìpínlẹ̀, tàbí agbègbè; níhìn-ín, ó ṣeé ṣe jù pé ó ń tọ́ka sí agbègbè àyíká, kì í ṣe gbogbo ayé.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ ìtàn tí ó bá καί mu ní ti ẹ̀dá, ó sì ń tẹ̀síwájú láti inú ohun tí ó ṣáájú láìfi ìtumọ̀ míì kún un.
- source_word: ἐξῆλθεν
  choice: tàn dé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘jáde,’ nípa ìròyìn, ‘tàn dé’ jẹ́ Yorùbá àdánidá tí ó pa àwòrán ìròyìn tí ń lọ láti ibi kan dé àwọn ibòmíràn mọ́.
- source_word: ἡ φήμη αὕτη
  choice: ìròyìn yìí
  rationale: “Ìròyìn” lè túmọ̀ sí ìròyìn tàbí ohun tí a ń rò ká, láìdájọ́ pé irọ́ ni; “yìí” sì tọ́ka sí ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: dé gbogbo agbègbè náà
  rationale: Nínú ọ̀rọ̀ yìí, γῆ tọ́ka sí ilẹ̀ tàbí agbègbè àyíká, kì í ṣe gbogbo ayé. “Gbogbo agbègbè náà” fi ìwọ̀n ὅλην hàn ní Yorùbá tí ó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì rọrùn fún òǹkàwé òde òní. “Tàn dé” ni a lò dípò ìtumọ̀ líle bí “jáde” nítorí pé ó bá bí a ṣe ń sọ nípa ìròyìn ní Yorùbá mu.
