revisions:
- from: Ó sì ń sọ pé, “Ẹ kúrò níhìn-ín, nítorí ọmọbìnrin náà kò kú, ṣùgbọ́n ó ń sùn.” Wọ́n sì ń rẹ́rìn-ín ẹlẹ́yà sí i.[a]
  to: Ó ń sọ pé, “Ẹ kúrò, nítorí ọmọbìnrin náà kò kú, ṣùgbọ́n ó ń sùn.” Wọ́n sì ń rẹ́rìn-ín sí i.[a]
  rationale: The revision removes small additions not signaled by the Greek and replaces an awkward expression with idiomatic Standard Yoruba. It continues to represent the imperfect actions with ‘ń,’ preserves the plural command, and leaves ‘sùn’ unexplained so that the narrative tension remains intact.
