review_pass:
  verdict: revise
  source_fidelity: The draft preserves the imperfect force of ἔλεγεν and κατεγέλων, the plural imperative, the causal relation, and the unexpanded contrast between death and sleep. However, the initial náà/‘sì’ connective is not represented in the Greek, and ‘níhìn-ín’ adds a deictic element not stated by Ἀναχωρεῖτε.
  naturalness: ‘Wọ́n sì ń rẹ́rìn-ín ẹlẹ́yà sí i’ is understandable but less idiomatic than ‘Wọ́n sì ń rẹ́rìn-ín sí i’; the latter naturally conveys laughing at someone, while the footnote can make the mocking sense explicit.
  terminology: ‘ọmọbìnrin náà’ is a suitable contemporary Standard Yoruba rendering of τὸ κοράσιον in this context. ‘ó ń sùn’ appropriately retains the source’s deliberately unelaborated wording.
  issues:
  - severity: low
    issue: The opening ‘Ó sì ń sọ pé’ supplies a connective absent from the Greek.
    rationale: SBLGNT begins ἔλεγεν without δέ or καί. Yoruba does not require ‘sì’ here, so removing it more closely follows the source.
  - severity: low
    issue: ‘níhìn-ín’ adds ‘from here.’
    rationale: Ἀναχωρεῖτε commands the people to withdraw/depart but does not explicitly specify ‘here.’ ‘Ẹ kúrò’ preserves the command without the added deictic detail.
  - severity: medium
    issue: ‘ń rẹ́rìn-ín ẹlẹ́yà sí i’ is stylistically awkward and partly over-specifies the ridicule in the main text.
    rationale: κατεγέλων does carry mockery, but ‘Wọ́n sì ń rẹ́rìn-ín sí i’ is more natural Yoruba and retains the literal laughing image. The lexical alternative footnote can explicitly express the derisive sense.
  revised_text: Ó ń sọ pé, “Ẹ kúrò, nítorí ọmọbìnrin náà kò kú, ṣùgbọ́n ó ń sùn.” Wọ́n sì ń rẹ́rìn-ín sí i.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “Wọ́n sì ń fi í ṣe ẹlẹ́yà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí rírẹ́rìn-ín sí ẹnì kan láti fi ṣe ẹlẹ́yà rẹ̀.
    reason: lexical_alternative
