id: MAT.9.24
reference: Matthew 9:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: yo
  text: Ó ń sọ pé, “Ẹ kúrò, nítorí ọmọbìnrin náà kò kú, ṣùgbọ́n ó ń sùn.” Wọ́n sì ń rẹ́rìn-ín sí i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n sì ń fi í ṣe ẹlẹ́yà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí rírẹ́rìn-ín sí ẹnì kan láti fi ṣe ẹlẹ́yà rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ó sì ń sọ pé
  rationale: Àkókò imperfect nínú Gíríìkì fi hàn pé ọ̀rọ̀ náà ń lọ lọ́wọ́ tàbí pé ó ń tún un sọ; “ń sọ” pa ìrísí yẹn mọ́ ní Yorùbá.
- source_word: Ἀναχωρεῖτε
  choice: Ẹ kúrò níhìn-ín
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, “Ẹ” sì fi ọ̀pọ̀ hàn; gbólóhùn náà jẹ́ ti òde òní, ó sì ní agbára àṣẹ láì di ọ̀rọ̀ àtijọ́.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: nítorí ... kò kú
  rationale: “Nítorí” fi ìdí àṣẹ náà hàn gẹ́gẹ́ bí γάρ ṣe ń ṣe, “kò kú” sì tọ́ka sí ikú gẹ́gẹ́ bí ìṣẹ̀lẹ̀, láì fi “síbẹ̀” tàbí “tíì” kún orísun.
- source_word: τὸ κοράσιον
  choice: ọmọbìnrin náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ọmọ obìnrin tàbí ọ̀dọ́bìnrin; “ọmọbìnrin náà” jẹ́ adayeba, ó sì yẹ fún àyíká yìí.
- source_word: ἀλλὰ καθεύδει
  choice: ṣùgbọ́n ó ń sùn
  rationale: “Ṣùgbọ́n” pa ìtakora ἀλλά mọ́, “ó ń sùn” sì jẹ́ ọ̀nà Yorùbá adayeba láti sọ ìṣe tí ó ń lọ lọ́wọ́, láì tú àkàwé náà sílẹ̀.
- source_word: κατεγέλων αὐτοῦ
  choice: Wọ́n sì ń rẹ́rìn-ín ẹlẹ́yà sí i
  rationale: Gbólóhùn yìí pa àwòrán rírẹ́rìn-ín mọ́, “ẹlẹ́yà” sì mú kí ó ṣe kedere pé ẹ̀gàn ni, kì í ṣe ẹ̀rín inú-dídùn; “ń” tún fi imperfect hàn.
theological_decisions:
- issue: Ọ̀rọ̀ Jésù pé ọmọbìnrin náà “kò kú, ṣùgbọ́n ó ń sùn”
  choice: A pa “ó ń sùn” mọ́ gẹ́gẹ́ bí ó ṣe rí, láì fi àlàyé ìtumọ̀ kún un.
  alternative: Kí a sọ pé “ikú rẹ̀ dà bí oorun” tàbí “ó kàn ń sùn,” èyí tí yóò tú ọ̀rọ̀ náà sí ìtumọ̀ kan pàtó.
  rationale: Orísun náà fi ọ̀rọ̀ Jésù sílẹ̀ pẹ̀lú ìfòyemọ̀ àti ìtakora inú ìtàn rẹ̀. Ìtumọ̀ yìí kò pinnu bóyá “sùn” jẹ́ àkàwé ikú, ọ̀rọ̀ ìfojúsọ́nà, tàbí ohun mìíràn.
translation_notes:
  register: Yorùbá boṣewa ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Ẹ kúrò níhìn-ín” jẹ́ ọ̀rọ̀ àṣẹ tó ṣe kedere fún àwùjọ, nígbà tí “ń rẹ́rìn-ín ẹlẹ́yà sí i” jẹ́ ọ̀rọ̀ tó lóye fún òǹkàwé lónìí, tó sì pa àwòrán àti ẹ̀gàn inú Gíríìkì mọ́.
