  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: yo
  text: Ojú wọn sì là. Jésù sì kìlọ̀ fún wọn gidigidi[a] pé, “Ẹ rí i dájú pé ẹnikẹ́ni kò mọ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “pa áṣẹ líle fún wọn” tàbí “kìlọ̀ fún wọn pẹ̀lú ọ̀rọ̀ líle.” Ọ̀rọ̀ Gíríìkì náà fi ìmọ̀lára líle àti agbára ìkìlọ̀ hàn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “Ẹ rí i dájú pé ẹnikẹ́ni kò mọ̀.” Ohun tí wọn kò gbọdọ̀ jẹ́ kí ẹnikẹ́ni mọ̀ kò fara hàn nínú Gíríìkì, ṣùgbọ́n àyíká ọ̀rọ̀ tọ́ka sí ìwòsàn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: là
  rationale: Ọ̀rọ̀ yìí jẹ́ aorist passive ti ἀνοίγω. Gbólóhùn Yorùbá “ojú wọn là” jẹ́ ọ̀nà àdánidá láti sọ pé ojú wọn ṣí, tí wọ́n sì ríran, láì fi ẹni tó ṣe é kún ọ̀rọ̀ náà.
- source_word: οἱ ὀφθαλμοί
  choice: Ojú wọn
  rationale: Èyí túmọ̀ gírámà Gíríìkì náà ní kedere, ó sì jẹ́ ọ̀nà tí Yorùbá fi ń sọ ohun-ìní ní ti ẹ̀dá.
- source_word: ἐνεβριμήθη
  choice: kìlọ̀ fún wọn gidigidi
  rationale: Ọ̀rọ̀ náà ń fi ìmọ̀lára líle àti àṣẹ alágbára hàn. “Kìlọ̀ fún wọn gidigidi” mú agbára ìkìlọ̀ náà jáde láì sọ pé Jésù bá wọn wí tàbí láì ṣàlàyé ìdí rẹ̀.
- source_word: λέγων
  choice: pé
  rationale: Nínú Yorùbá, “pé” ni ọ̀nà àdánidá láti so ìkìlọ̀ náà pọ̀ mọ́ ohun tí Jésù sọ, dípò títẹ̀lé ìṣètò Gíríìkì pẹ̀lú “ní wí pé.”
- source_word: Ὁρᾶτε
  choice: Ẹ rí i dájú pé
  rationale: Àṣẹ yìí ń pe àwọn méjèèjì sí ìṣọ́ra kí wọ́n sì rí sí i pé àṣẹ náà ṣẹ. “Ẹ rí i dájú pé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára ìṣọ́ra náà mọ́.
- source_word: μηδεὶς γινωσκέτω
  choice: ẹnikẹ́ni kò mọ̀ nípa rẹ̀
  rationale: Àṣẹ ẹni-kẹta pẹ̀lú μηδείς jẹ́ ìdènà pé kí ẹnikẹ́ni má mọ̀. Fífún “nípa rẹ̀” kún un jẹ́ kí Yorùbá ṣe déédéé, nígbà tí ohun tí àrọ́pò-orúkọ náà ń tọ́ka sí—ìwòsàn náà—ṣì wà nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Agbára àṣẹ Jésù lẹ́yìn ìwòsàn náà
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìkìlọ̀ líle pé kí wọ́n má ṣe jẹ́ kí ẹnikẹ́ni mọ̀ nípa ohun tó ṣẹlẹ̀.
  alternative: A lè túmọ̀ ἐνεβριμήθη sí “bá wọn wí” tàbí “pa á láṣẹ fún wọn gidigidi.”
  rationale: Ẹsẹ̀ náà fi hàn pé àṣẹ Jésù lágbára, ṣùgbọ́n kò sọ ìdí tí ó fi fẹ́ kí ọ̀rọ̀ náà wà ní ìkọ̀kọ̀. Ìtumọ̀ yìí pa agbára àṣẹ náà mọ́ láì fi ìdí ẹ̀kọ́ ìgbàgbọ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Ojú wọn là” jẹ́ àṣà Yorùbá tó mọ́gbọ́n dání fún ìpadàbọ̀ ìríran; “kìlọ̀ fún wọn gidigidi” sì pa líle ọ̀rọ̀ Gíríìkì mọ́ láì di ọ̀rọ̀ náà mọ́ ẹ̀kọ́ ìsìn kan.
