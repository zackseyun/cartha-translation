id: MAT.9.38
reference: Matthew 9:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: yo
  text: Nítorí náà, ẹ fi taratara bẹ̀ Olúwa ìkórè pé kí ó rán àwọn òṣìṣẹ́ jáde sínú ìkórè rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó lé àwọn òṣìṣẹ́ jáde.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní agbára ju “rán ... jáde” lásán lọ, bí ó tilẹ̀ jẹ́ pé níbí ó ń tọ́ka sí rírán àwọn òṣìṣẹ́ lọ sínú ìkórè.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: ẹ fi taratara bẹ
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ láti bẹ̀bẹ̀ pẹ̀lú ìtara. Gbólóhùn yìí mú ìtumọ̀ àdúrà àti ìjẹ́kánjú náà jáde ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde ohun tí a sọ ṣáájú nípa ọ̀pọ̀ ìkórè àti díẹ̀ òṣìṣẹ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó pa èrò ẹni tí ó ní àṣẹ lórí ìkórè mọ́, ó sì jẹ́ ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀ fún κύριος.
- source_word: θερισμοῦ
  choice: ìkórè
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì pa àpẹẹrẹ ìkórè mọ́ láìṣàlàyé rẹ̀ sí ọ̀nà kan ṣoṣo.
- source_word: ὅπως
  choice: pé kí
  rationale: Ní Yorùbá, ‘bẹ ... pé kí’ jẹ́ ọ̀nà àdánidá láti sọ ohun tí àdúrà náà ń béèrè.
- source_word: ἐκβάλῃ
  choice: rán ... jáde
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi àwọn òṣìṣẹ́ lọ síbi iṣẹ́; ‘rán ... jáde’ jẹ́ kedere, nígbà tí àlàyé ìsàlẹ̀ pa agbára ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: ἐργάτας
  choice: àwọn òṣìṣẹ́
  rationale: Ó tọ́ka sí àwọn tí ń ṣiṣẹ́ nínú ìkórè, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: sínú ìkórè rẹ̀
  rationale: ‘Sínú’ pa ìṣípò lọ sínú iṣẹ́ tàbí agbègbè ìkórè mọ́; ‘rẹ̀’ sì pa ọ̀rọ̀ arọ́pò oníhun αὐτοῦ mọ́ láìfi ‘oko’ kún un.
theological_decisions:
- issue: Ta ni ‘Olúwa ìkórè’ ń tọ́ka sí?
  choice: Fi sílẹ̀ gẹ́gẹ́ bí ‘Olúwa ìkórè’ láìsọ pé Baba, Jésù, tàbí Ọlọ́run ní pàtó ni.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí Baba ní pàtó tàbí Jésù ní pàtó.
  rationale: Ẹsẹ̀ náà kò dá ẹni tí orúkọ oyè yìí ń tọ́ka sí mọ́ ní pàtó; fífi ọ̀rọ̀ náà sílẹ̀ báyìí pa àìdánilójú àti ìfọ̀kànsìn ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ẹ’ gẹ́gẹ́ bí àṣẹ sí ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí δεήθητε.
