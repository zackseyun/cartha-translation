    text: Tàbí, “lẹ́yìn tí ó ti nà Jesu ní pàṣán.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìjìyà àwọn ará Romu ti lílu ènìyàn ní pàṣán.
