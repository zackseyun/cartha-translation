id: MAT.27.26
reference: Matthew 27:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: yo
  text: Nígbà náà ni ó dá Bárábà sílẹ̀ fún wọn; ṣùgbọ́n lẹ́yìn tí ó ti nà Jesu pẹ̀lú pàṣán, ó fi Jesu lé ọwọ́ àwọn tí yóò kàn án mọ́ àgbélébùú, kí wọ́n lè kàn án mọ́ àgbélébùú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí ó ti nà Jesu ní pàṣán.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìjìyà àwọn ará Romu ti lílu ènìyàn ní pàṣán.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú àti àtẹ̀lé ìṣẹ̀lẹ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀπέλυσεν
  choice: ó dá ... sílẹ̀
  rationale: Nínú ọ̀rọ̀ ìdájọ́ yìí, ó túmọ̀ sí dídá ẹlẹ́wọ̀n sílẹ̀.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dátífù náà lè tọ́ka sí àwọn ènìyàn gẹ́gẹ́ bí ẹni tí a ṣe ìdásílẹ̀ náà fún; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: Βαραββᾶν
  choice: Bárábà
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀lé bí a ṣe sábà máa ń pè é ní Yorùbá.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ láàárín dídá Bárábà sílẹ̀ àti ohun tí a ṣe sí Jesu hàn.
- source_word: Ἰησοῦν
  choice: Jesu
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀lé ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: φραγελλώσας
  choice: lẹ́yìn tí ó ti nà ... ní pàṣán
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ọ̀rọ̀-ìṣe pàtàkì; ‘nà ní pàṣán’ ṣàlàyé ìjìyà Romu náà ní èdè òde òní.
- source_word: παρέδωκεν
  choice: ó fi í lé wọn lọ́wọ́
  rationale: Ó pa ìtumọ̀ fífi Jesu lé ọwọ́ àwọn tí yóò mú ìdájọ́ náà ṣẹ mọ́, láìfi àlàyé míì kún un.
- source_word: ἵνα σταυρωθῇ
  choice: kí a lè kàn án mọ́ àgbélébùú
  rationale: Ó fi ète tàbí àbájáde fífi Jesu lé wọn lọ́wọ́ hàn, ó sì pa ohùn àìṣe ti Gíríìkì mọ́ nípa lílo ‘a’.
theological_decisions:
- issue: Àtẹ̀lé ìṣẹ̀lẹ̀ àti ẹni tó ṣe iṣẹ́ nínú ìdájọ́ Jesu
  choice: Pílátù dá Bárábà sílẹ̀, ó nà Jesu ní pàṣán, lẹ́yìn náà ó fi Jesu lé wọn lọ́wọ́ kí a lè kàn án mọ́ àgbélébùú.
  alternative: Pílátù fi Jesu lé wọn lọ́wọ́, lẹ́yìn náà ni wọ́n nà á.
  rationale: φραγελλώσας jẹ́ aorist participle tí ó sábà ń tọ́ka sí iṣẹ́ tí ó ṣáájú παρέδωκεν. Ìtumọ̀ náà pa àtẹ̀lé ọ̀rọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ tàbí àlàyé nípa ìlànà Romu kún un.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye ni a lò. A fi àmì ohùn síbi tí ó yẹ; a sì lo ‘nà ní pàṣán’ dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀sìn tí kò rọrùn láti lóye.
