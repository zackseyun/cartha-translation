revisions:
- from: Nígbà náà ni ó dá Bárábà sílẹ̀ fún wọn; ṣùgbọ́n lẹ́yìn tí ó ti nà Jesu ní pàṣán[a], ó fi í lé wọn lọ́wọ́ kí a lè kàn án mọ́ àgbélébùú.
  to: Nígbà náà ni ó dá Bárábà sílẹ̀ fún wọn; ṣùgbọ́n lẹ́yìn tí ó ti nà Jesu pẹ̀lú pàṣán, ó fi Jesu lé ọwọ́ àwọn tí yóò kàn án mọ́ àgbélébùú, kí wọ́n lè kàn án mọ́ àgbélébùú.[a]
  rationale: 'A ṣàtúnṣe olùgbà ‘fi ... lé ọwọ́’ kí ó má bàa dà bí pé àwọn ènìyàn tí a dá Bárábà sílẹ̀ fún ni Pílátù fi Jesu lé lọ́wọ́. A tún ọ̀rọ̀ ìsàlẹ̀ ṣe kí àṣàyàn ìtumọ̀ àti àlàyé ìtàn má bàa dàpọ̀. Àmọ́, this revised text redundantly says crucifixion twice: must correct!'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtẹ̀lé Gíríìkì náà dáadáa: Pílátù dá Bárábà sílẹ̀, ó sì jẹ́ kí a nà Jesu ní pàṣán kí ó tó fi í lé àwọn tí yóò ṣe ìpànìyàn náà lọ́wọ́. Síbẹ̀, ‘wọn’ nínú ‘ó fi í lé wọn lọ́wọ́’ lè dà bí àwọn ènìyàn kan náà tí Bárábà ti dá sílẹ̀ fún, nígbà tí Gíríìkì kò sọ ẹni tí a fi Jesu lé lọ́wọ́ ní gbangba. Àtúnṣe náà mú olùgbà tí ìṣe ìkànmọ́ mọ́ àgbélébùú ń tọ́ka sí hàn láìyí ìtumọ̀ padà.'
  naturalness: ‘Nà Jesu ní pàṣán’ jẹ́ Yorùbá òde òní tí ó ṣe kedere. ‘Lẹ́yìn tí ó ti nà’ dáadáa, ṣùgbọ́n ‘lẹ́yìn tí ó ti nà Jesu ní pàṣán’ lè yọrí sí àìdánilójú díẹ̀ nípa irinṣẹ́ náà; ‘lẹ́yìn tí ó ti nà Jesu pẹ̀lú pàṣán’ rọrùn síi. A tún lo ‘á kàn án mọ́ àgbélébùú’ fún èdè ìtàn tí ó bójú mu.
  terminology: ‘Bárábà,’ ‘Jesu,’ ‘pàṣán,’ àti ‘àgbélébùú’ bá ìlò Yorùbá tí ó wọ́pọ̀ mu. A pa ohùn àìṣe inú ἵνα σταυρωθῇ mọ́ nípa ‘kí wọ́n lè kàn án.’
  issues:
  - severity: medium
    issue: ‘ó fi í lé wọn lọ́wọ́’ ní olùgbà tí kò ṣe kedere
    rationale: Gíríìkì παρέδωκεν kò ní olùgbà tí a sọ ní gbangba. Ní Yorùbá, ‘wọn’ lè tọ́ka padà sí àwọn ènìyàn tí αὐτοῖς tọ́ka sí nínú gbolohun àkọ́kọ́, tí ó sì lè sọ pé Pílátù fi Jesu lé ogunlọ́gọ̀ náà lọ́wọ́. ‘Àwọn tí yóò kàn án mọ́ àgbélébùú’ jẹ́ ìmú-kedere tí èrò ìpinnu gbolohun náà fúnra rẹ̀ ń béèrè, láìsọ orúkọ ẹ̀ka kan tí orísun kò sọ.
  - severity: low
    issue: Àwọn ọ̀rọ̀ àlàyé ìsàlẹ̀ pe ‘pàṣán Romu’ ní àṣàyàn ìtumọ̀
    rationale: ‘Romu’ jẹ́ àlàyé ìtàn nípa irú ìjìyà náà, kì í ṣe àṣàyàn lexical tó wà nínú ọ̀rọ̀ Gíríìkì. A tún ọ̀rọ̀ ìsàlẹ̀ náà ṣe kí ó ya àṣàyàn ‘ìnà ní pàṣán’ sọ́tọ̀ kúrò nínú àlàyé ìtàn.
