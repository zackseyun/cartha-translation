id: MAT.27.64
reference: Matthew 27:64
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: yo
  text: Nítorí náà, pàṣẹ pé kí wọ́n dá ibojì náà lójú títí di ọjọ́ kẹta, kí àwọn ọmọ-ẹ̀yìn rẹ̀ má bàa wá[a] jí i, kí wọ́n sì sọ fún àwọn ènìyàn pé, ‘A ti jí i dìde[b] kúrò láàárín àwọn òkú.’ Nígbà náà, ẹ̀tàn ìkẹyìn yóò burú ju ti àkọ́kọ́ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan fi ‘ní òru’ kún ọ̀rọ̀ lẹ́yìn ‘wá’: ‘kí àwọn ọmọ-ẹ̀yìn rẹ̀ má bàa wá ní òru, kí wọ́n sì jí i.’ A tẹ̀ lé ọ̀rọ̀ kúkúrú níbí.'
    reason: textual_variant
  - marker: b
    text: Tàbí, ‘A jí i dìde kúrò láàárín àwọn òkú.’ Ọ̀rọ̀ Gíríìkì náà wà ní ohùn àìṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: pàṣẹ
  rationale: Ó jẹ́ ọ̀rọ̀ àṣẹ tó ń béèrè ìgbésẹ̀ pàtó lọ́wọ́ Pílátù; ‘pàṣẹ’ bá agbára ìjọba inú ọ̀rọ̀ náà mu.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìbéèrè yìí jẹ́ àbájáde ohun tí wọ́n ṣẹ̀ṣẹ̀ sọ ní ẹsẹ tó ṣáájú.
- source_word: ἀσφαλισθῆναι
  choice: kí wọ́n dá ibojì náà lójú
  rationale: Ó pa ìtumọ̀ jíjẹ́ kí ibojì náà ní ààbò mọ́, láì dín ọ̀nà náà kù sí ṣíṣọ́ ọ nìkan.
- source_word: τὸν τάφον
  choice: ibojì náà
  rationale: ‘Ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ibi tí a sin òkú sí, ó sì yẹ fún ibojì inú àpáta yìí.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: títí di ọjọ́ kẹta
  rationale: Ìtumọ̀ àkókò tó ṣe déédéé, tó sì pa ìsopọ̀ rẹ̀ mọ́ àsọtẹ́lẹ̀ nípa ọjọ́ kẹta.
- source_word: μήποτε
  choice: kí ó má bàa jẹ́ pé
  rationale: Ó fi ohun tí wọ́n ń bẹ̀rù pé ó lè ṣẹlẹ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐλθόντες
  choice: yóò wá
  rationale: A tú participle náà sí gbólóhùn tó rọrùn ní Yorùbá; a kò fi ‘ní òru’ kún un nítorí kò sí nínú ẹ̀dà Gíríìkì tí a tẹ̀ lé.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún akẹ́kọ̀ọ́ tàbí ọmọlẹ́yìn tí ó jẹ́ tirẹ̀.
- source_word: κλέψωσιν αὐτόν
  choice: jí i
  rationale: Ó pa arọ́pò-orúkọ ẹni náà mọ́ dípò yíyí i padà sí ‘òkú rẹ̀,’ gẹ́gẹ́ bí Gíríìkì ṣe sọ.
- source_word: εἴπωσιν τῷ λαῷ
  choice: sọ fún àwọn ènìyàn
  rationale: λαός tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe ogunlọ́gọ̀ tó péjọ níbi kan nìkan.
- source_word: Ἠγέρθη
  choice: A ti jí i dìde
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe (passive) Gíríìkì mọ́, láì sọ ẹni tó jí i dìde ní pàtó.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó pa ọ̀pọ̀ nínú Gíríìkì mọ́, ó sì sọ pé a jí i dìde kúrò láàárín àwọn tí ó kú.
- source_word: ἡ ἐσχάτη πλάνη
  choice: ẹ̀tàn ìkẹyìn yìí
  rationale: ‘Ẹ̀tàn’ bá ẹ̀sùn wọn mu; ‘yìí’ mú ìtọ́kasí náà ṣe kedere ní Yorùbá láì yí ìtumọ̀ padà.
theological_decisions:
- issue: Bí a ṣe tú ọ̀rọ̀ àjíǹde inú àsọyé tí wọ́n rò pé àwọn ọmọ-ẹ̀yìn yóò sọ
  choice: A ti jí i dìde kúrò láàárín àwọn òkú
  alternative: Ó ti jí dìde kúrò láàárín àwọn òkú
  rationale: Gíríìkì lo passive Ἠγέρθη. ‘A ti jí i dìde’ pa passive náà mọ́, ó sì fi ẹni tó ṣe iṣẹ́ náà sílẹ̀ láì dárúkọ rẹ̀, gẹ́gẹ́ bí orísun ṣe ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘dá ... lójú’ fún ààbò ibojì láì fi ọ̀nà pàtó kan lé ọrọ̀ náà lórí.
