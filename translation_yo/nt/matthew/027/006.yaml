id: MAT.27.6
reference: Matthew 27:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: yo
  text: Àwọn olórí àlùfáà sì mú àwọn owó fàdákà náà, wọ́n ní, “Kò bófin mu láti fi wọ́n sínú ìṣúra tẹ́ńpìlì[a], nítorí owó ẹ̀jẹ̀ ni wọ́n[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, κορβανᾶν (Kọ́bánì), èyí tó ń tọ́ka sí ìṣúra tẹ́ńpìlì tàbí àwọn owó mímọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “iye owó ẹ̀jẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti tọ́ka sí àwọn aláṣẹ àgbà lára àwọn àlùfáà, ó sì bá ìlò ọ̀rọ̀ inú àwọn Ìhìn Rere mu.
- source_word: λαβόντες
  choice: mú
  rationale: Aorist participle náà ni a tú sí ọ̀rọ̀-ìṣe tí ó rọrùn, tí ó sì fi hàn pé wọ́n kọ́kọ́ mú owó náà kí wọ́n tó sọ̀rọ̀.
- source_word: τὰ ἀργύρια
  choice: àwọn owó fàdákà náà
  rationale: Èyí pa ìtumọ̀ owó fàdákà gidi mọ́, ó tọ́ka sí owó tí a ṣẹ̀ṣẹ̀ mẹ́nuba, láì sọ irú owó kan pàtó tí Gíríìkì kò dárúkọ.
- source_word: Οὐκ ἔξεστιν
  choice: Kò bófin mu
  rationale: Gbólóhùn yìí fi ìdènà tó dá lórí òfin tàbí ìlànà ẹ̀sìn hàn ní Yorùbá àdánidá.
- source_word: βαλεῖν
  choice: láti kó wọn sínú
  rationale: Nínú ọ̀rọ̀ nípa ìṣúra, ‘kó ... sínú’ jẹ́ àdánidá ju ‘sọ ... sínú’ lọ, kò sì fi ìṣe jù sí i ju ohun tí àyíká ọ̀rọ̀ ń béèrè lọ.
- source_word: κορβανᾶν
  choice: ìṣúra tẹ́ńpìlì
  rationale: A tú ọ̀rọ̀ náà sí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ibi tàbí owó mímọ́ ti tẹ́ńpìlì, kí ó lè yé òǹkàwé lónìí; àlàyé ìsàlẹ̀ ojú ìwé pa orúkọ Gíríìkì náà mọ́.
- source_word: ἐπεὶ
  choice: nítorí pé
  rationale: Ó ṣe àfihàn ìdí tí àwọn olórí àlùfáà fi sọ pé kò bófin mu.
- source_word: τιμὴ αἵματός
  choice: iye tí a san fún ẹ̀jẹ̀
  rationale: Èyí dúró nítòsí ìtumọ̀ ‘iye owó ẹ̀jẹ̀’ ní Gíríìkì, ó sì yẹra fún fífi ìtumọ̀ àkànṣe sí irú ẹ̀jẹ̀ tí a ń tọ́ka sí.
theological_decisions:
- issue: Bí a ṣe máa tú κορβανᾶν láì sọ ìtumọ̀ rẹ̀ nù
  choice: ìṣúra tẹ́ńpìlì
  alternative: Kọ́bánì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìṣúra tàbí owó mímọ́ tẹ́ńpìlì. Títú ìtumọ̀ rẹ̀ sí Yorùbá jẹ́ kó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń pa fọ́ọ̀mù ìbílẹ̀ náà mọ́.
- issue: Bí a ṣe máa pa ìsopọ̀ τιμὴ αἵματός mọ́
  choice: iye tí a san fún ẹ̀jẹ̀
  alternative: owó ẹ̀jẹ̀
  rationale: Àṣàyàn pàtàkì náà pa àwòrán ‘iye tí a san’ mọ́, láì fi kún un pé ẹ̀jẹ̀ náà túmọ̀ sí ikú, ìpànìyàn, tàbí ohun mìíràn. Ọ̀nà kúkúrú tí ó jẹ́ àdánidá wà nínú àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé gbogbogbò, ó sì pa ìbáṣepọ̀ láàárín òfin ẹ̀sìn, ìṣúra tẹ́ńpìlì, àti iye owó ẹ̀jẹ̀ mọ́ láì ṣàlàyé ìforígbárí inú ọ̀rọ̀ náà kúrò.
