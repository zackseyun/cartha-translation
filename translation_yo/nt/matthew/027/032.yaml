id: MAT.27.32
reference: Matthew 27:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: yo
  text: Bí wọ́n sì ti ń jáde lọ, wọ́n rí ọkùnrin ará Kírénè kan tí orúkọ rẹ̀ ń jẹ́ Símónì. Wọ́n fipá mú un[a] láti ru àgbélébùú rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n fi àṣẹ mú un wọ iṣẹ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí fífi aláṣẹ mú ẹnì kan ṣe iṣẹ́.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, àgbélébùú Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: Bí wọ́n sì ti ń jáde lọ
  rationale: Ọ̀rọ̀ àbọ̀ onísinsin yìí ní agbára àkókò, ó sì fi hàn pé jíjáde wọn ń lọ lọ́wọ́ nígbà tí wọ́n rí ọkùnrin náà; “sì” ń tẹ ìtàn náà síwájú láìfi ìtakora líle hàn.
- source_word: εὗρον
  choice: wọ́n rí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bójú mu fún rí-rí ẹni kan ní ọ̀nà.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: ọkùnrin ará Kírénè kan
  rationale: “Ará Kírénè” fi ibi tí ọkùnrin náà ti wá hàn ní èdè Yorùbá àdánidá.
- source_word: ὀνόματι Σίμωνα
  choice: tí orúkọ rẹ̀ ń jẹ́ Símónì
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá àṣà èdè mu fún sísọ orúkọ ẹni.
- source_word: τοῦτον ἠγγάρευσαν
  choice: Wọ́n fi tipátipá mú un ṣiṣẹ́
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí fífi àṣẹ mú ẹnì kan wọ iṣẹ́; “fi tipátipá mú un ṣiṣẹ́” pa agbára ìfipámú náà mọ́.
- source_word: ἵνα ἄρῃ
  choice: láti gbé
  rationale: ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́sọ fi ète hàn; “láti” jẹ́ ọ̀nà Yorùbá àdánidá, “gbé” sì lè túmọ̀ sí gbígbé ohun náà sókè tàbí rírù ú lọ ní àyíká yìí.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: àgbélébùú rẹ̀
  rationale: “Àgbélébùú” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún σταυρός, “rẹ̀” sì pa arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi “Jésù” kún ọ̀rọ̀ pàtó.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (“rẹ̀”) ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí “àgbélébùú rẹ̀,” pẹ̀lú àlàyé pé Jésù ni ó ń tọ́ka sí.
  alternative: “Àgbélébùú Jésù,” èyí tí yóò sọ ẹni tí ó ń tọ́ka sí di mímọ́ nínú ẹsẹ̀ náà fúnra rẹ̀.
  rationale: Àyíká ìtàn fi hàn pé àgbélébùú Jésù ni Símónì gbé. Síbẹ̀, pípa arọ́pò-orúkọ náà mọ́ tẹ̀ lé ìrísí orísun, àlàyé ìsàlẹ̀ ojú ìwé sì dènà àìlóye.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá, a sì pa ìṣàn ìtàn àti agbára ìfipámú ọ̀rọ̀ Gíríìkì mọ́.
