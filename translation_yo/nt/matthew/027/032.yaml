  to: Bí wọ́n sì ti ń jáde lọ, wọ́n rí ọkùnrin ará Kírénè kan tí orúkọ rẹ̀ ń jẹ́ Símónì. Wọ́n fipá mú un[a] láti ru àgbélébùú rẹ̀[b].
