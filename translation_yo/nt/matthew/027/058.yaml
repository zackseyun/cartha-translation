source:
  edition: SBLGNT
  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: yo
  text: Ó lọ bá Pílátù, ó sì béèrè fún òkú Jésù. Nígbà náà ni Pílátù pàṣẹ pé kí a fi í fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a fi í lé e lọ́wọ́.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè túmọ̀ sí “fún” tàbí “fi lé ẹni kan lọ́wọ́” ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Jósẹ́fù ará Arimatíà nínú ẹsẹ tó ṣáájú; “Ó” jẹ́ ọ̀nà àdánidá nínú ìtàn Yorùbá.
- source_word: προσελθὼν
  choice: lọ bá
  rationale: Ó fi ìlọsíwájú sí ọ̀dọ̀ Pílátù hàn ní èdè Yorùbá tó ṣe kedere, ó sì ṣáájú ìbéèrè gẹ́gẹ́ bí participle Gíríìkì náà.
- source_word: ᾐτήσατο
  choice: béèrè fún
  rationale: Ó túmọ̀ sí bíbéèrè ohun kan tàbí fífi ìbéèrè sílẹ̀; “béèrè fún” bá ohun tí a béèrè, ìyẹn òkú Jésù, mu dáadáa.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: òkú Jésù
  rationale: Ní àyíká yìí σῶμα ń tọ́ka sí ara Jésù lẹ́yìn ikú rẹ̀. “Òkú Jésù” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tó ní iyì, tí kò sì ní ìró ti ìṣègùn.
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó samì sí ìṣẹ̀lẹ̀ tó tẹ̀ lé e, ó sì jẹ́ àsopọ̀ ìtàn Yorùbá tó wọ́pọ̀.
- source_word: ἐκέλευσεν
  choice: pàṣẹ
  rationale: Ó mú agbára àṣẹ Pílátù jáde ní ṣókí, ó sì bá àyíká ìṣàkóso mu.
- source_word: ἀποδοθῆναι
  choice: kí a fi í fún un
  rationale: Ìṣe aláìlórúkọ ní fọ́ọ̀mù àfarawà yìí ni a tú sí àṣẹ “kí a fi í fún un”; ó fi fífi òkú náà lé Jósẹ́fù lọ́wọ́ hàn láìsọ ẹni tó ṣe iṣẹ́ náà pàtó.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, àdánidá, tó ní iyì. A lo “òkú Jésù” dípò ìtumọ̀ lílẹ̀ “ara Jésù” nítorí ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ara ẹni tó ti kú. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó ní ọ̀rọ̀ tí àlàyé náà kan.
