  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: yo
  text: Nígbà náà ni Pilatu wí fún un pé, “Ṣé o kò gbọ́ bí àwọn ohun tí wọ́n ń jẹ́rìí lòdì sí ọ[a] ṣe pọ̀ tó?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “tí wọ́n ń ṣe ẹ̀rí lòdì sí ọ.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ jíjẹ́rìí ní ilé-ẹjọ́.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó ń tọ́ka sí ìṣẹ̀lẹ̀ tó tẹ̀ lé e nínú ìtàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘lẹ́yìn náà’ ní Yorùbá.
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: ni Pilatu wí fún un
  rationale: A pa arọ́pò-orúkọ αὐτῷ mọ́ gẹ́gẹ́ bí ‘fún un.’ ‘Wí’ bá ọ̀rọ̀ taara tó tẹ̀ lé e mu, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lo àsìkò ìsinsìnyí láti mú kí ìtàn yè kooro.
- source_word: Οὐκ ἀκούεις
  choice: Ṣé o kò gbọ́
  rationale: Ó pa agbára ìbéèrè alátakò náà àti ìtumọ̀ pàtàkì ἀκούω, ‘gbọ́,’ mọ́ ní èdè Yorùbá òde òní.
- source_word: πόσα
  choice: bí ohun ... ṣe pọ̀ tó
  rationale: Èyí fi hàn pé ọ̀pọ̀lọpọ̀ ọ̀ràn ni wọ́n ń sọ, láì túmọ̀ ‘ohun’ náà ní pàtó sí ‘ẹ̀sùn,’ èyí tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà.
- source_word: σου καταμαρτυροῦσιν
  choice: tí wọ́n ń jẹ́rìí lòdì sí ọ
  rationale: ‘Jẹ́rìí lòdì sí’ ń pa ìtumọ̀ ọ̀rọ̀ ilé-ẹjọ́ ti καταμαρτυρέω mọ́, ó sì ṣe kedere pé ẹ̀rí náà ń tako ẹni tí wọ́n ń bá sọ̀rọ̀.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘Ṣé’ dípò ọ̀nà àtijọ́ bí ‘kò ha,’ a sì fi àmì ohùn sí ibi tó yẹ.
