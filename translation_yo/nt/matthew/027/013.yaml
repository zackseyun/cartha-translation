  terminology: ‘Jẹ́rìí lòdì sí’ yẹ fún καταμαρτυρέω nítorí ó pa ìtumọ̀ jíjẹ́rìí nínú ọ̀ràn ilé-ẹjọ́ mọ́, láì dín un kù sí ‘fi ẹ̀sùn kàn.’ Àfikún ìsàlẹ̀ náà fún ‘ṣe ẹ̀rí lòdì sí’ jẹ́ àṣàyàn tó bófin mu.
