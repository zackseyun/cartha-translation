  source_fidelity: Ìtumọ̀ náà mú ọ̀nà ìtàn ‘Nígbà náà,’ arọ́pò-orúkọ ‘fún un,’ ìbéèrè alátakò náà, àti ìmọ̀ ìdájọ́ ti καταμαρτυροῦσιν (‘jẹ́rìí lòdì sí’) wá dáadáa. Síbẹ̀, ‘ohun’ ní ọ̀rọ̀ àkọ́kọ́ jẹ́ ẹyọ kan, níbi tí πόσα ti ń béèrè nípa ọ̀pọ̀ ohun; fífi ‘àwọn’ kún un ń dá ìpọ̀n-ọpọ̀ orísun náà bójú mu.
