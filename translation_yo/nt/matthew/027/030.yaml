id: MAT.27.30
reference: Matthew 27:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n tutọ́ sí i, wọ́n mú ọ̀pá esùsú náà[a], wọ́n sì ń fi í lù ú ní orí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘esùsú’ tàbí, ní ìtumọ̀ fífẹ̀, ọ̀pá tí a fi esùsú ṣe tàbí ọ̀pá tó dà bí esùsú.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà lè tẹnu mọ́ ìṣe tó ń bá a lọ tàbí ìlù tí wọ́n ń lù ú léraléra. A tún lè túmọ̀ rẹ̀ pé, ‘wọ́n ń lù ú ní orí.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: Lẹ́yìn tí wọ́n tutọ́ sí i
  rationale: Ọ̀rọ̀ àṣáájú aorist yìí tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú àwọn ìṣe pàtàkì tó tẹ̀ lé e; ‘Lẹ́yìn tí’ fi ìtẹ̀lé àwọn ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: ἔλαβον
  choice: wọ́n mú
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì bá ipò náà mu láìfi agbára tàbí ìjagúdù sí ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: κάλαμον
  choice: ọ̀pá esùsú náà
  rationale: ‘Ọ̀pá esùsú’ pa ìtumọ̀ esùsú mọ́, ó sì jẹ́ kí òǹkàwé mọ̀ pé ohun tí wọ́n fi ṣe ọ̀pá ni; ‘náà’ so ó mọ́ ohun tí a ti mẹ́nu kàn ṣáájú.
- source_word: ἔτυπτον
  choice: wọ́n sì ń fi í lù ú
  rationale: Àmì àsìkò imperfect nínú Gíríìkì lè fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn. Ìlò ‘ń’ ní Yorùbá pa agbára yìí mọ́ lọ́nà àdánidá.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: ní orí
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘lù’, ‘ní orí’ sọ ibi tí ìlù náà dé ní Yorùbá tó mọ́gbọ́n dání; arọ́pò-orúkọ inú ‘lù ú’ ti fi hàn pé orí Jésù ni.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe ìtìjú àti ìwà ipá tí àwọn ọmọ-ogun ṣe sí Jésù
  choice: A sọ àwọn ìṣe náà ní tààrà, a sì lo ‘ń lù’ láti pa ìṣe tó ń bá a lọ tàbí tó tún ara rẹ̀ ṣe mọ́.
  alternative: A lè sọ ọ́ ní ọ̀nà ọ̀rọ̀-ẹnu tó túbọ̀ fẹsẹ̀ múlẹ̀ pé, ‘wọ́n sì lù ú ní orí léraléra.’
  rationale: Ẹsẹ̀ náà jẹ́ ìtàn ohun tó ṣẹlẹ̀, kì í ṣe àlàyé ẹ̀kọ́ ìgbàgbọ́. Ìtumọ̀ náà kò dín ìtìjú àti ìwà ipá náà kù, bẹ́ẹ̀ ni kò fi àlàyé tí kò sí nínú orísun kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ìtàn tó ṣe kedere, tó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. ‘Fi í lù ú’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ọ̀pá esùsú náà ni wọ́n lò.
