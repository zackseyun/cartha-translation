id: MAT.27.56
reference: Matthew 27:56
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: yo
  text: Lára àwọn obìnrin náà ni Màríà ará Mágídálà, Màríà ìyá Jákọ́bù àti Jósẹ́fù,[a] àti ìyá àwọn ọmọ Sebedéè wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ mìíràn ka “Jósè” dípò “Jósẹ́fù.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: Lára àwọn obìnrin náà
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àwùjọ àwọn obìnrin tí ẹsẹ tó ṣáájú mẹ́nu kàn. ‘Lára’ fi hàn pé àwọn tí a dárúkọ jẹ́ apá kan nínú àwùjọ náà, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: ἦν
  choice: ni ... wà
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, ó ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ìwàláàyè tí àkójọ àwọn obìnrin tẹ̀ lé e. Ìṣètò ‘ni ... wà’ jẹ́ àdánidá ní Yorùbá.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Màríà ará Mágídálà
  rationale: ‘Ará Mágídálà’ sọ ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí obìnrin láti Mágídálà ní ọ̀nà tí ó ṣe kedere, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Màríà ìyá Jákọ́bù àti Jósẹ́fù
  rationale: Àwọn ọ̀rọ̀ onígbàgbọ́-orúkọ náà ń dá Màríà yìí mọ̀ nípasẹ̀ àwọn ọmọ rẹ̀. Ìtumọ̀ náà pa ìbáṣepọ̀ ìyá àti ọmọ mọ́ ní ṣókí, ní kedere.
- source_word: Ἰάκωβος
  choice: Jákọ́bù
  rationale: ‘Jákọ́bù’ ni àkọsílẹ̀ Yorùbá tó bá fọ́ọ̀mù orúkọ Gíríìkì Ἰάκωβος mu, ó sì yàgò fún fífi àṣà ìtumọ̀ orúkọ Gẹ̀ẹ́sì lé orísun náà lórí.
- source_word: Ἰωσὴφ
  choice: Jósẹ́fù
  rationale: SBLGNT ka Ἰωσὴφ níbí; ‘Jósẹ́fù’ ni ìkọ̀wé Yorùbá tó ṣe kedere fún orúkọ náà. Ìyàtọ̀ àfọwọ́kọ ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ìyá àwọn ọmọ Sebedéè
  rationale: Èyí tú ìbáṣepọ̀ onígbàgbọ́-orúkọ náà ní tààràtà, ó sì pa ọ̀nà tí Gíríìkì gbà dá obìnrin náà mọ̀ mọ́.
- source_word: Ζεβεδαίου
  choice: Sebedéè
  rationale: ‘Sebedéè’ jẹ́ àkọsílẹ̀ orúkọ Ζεβεδαῖος ní ìrísí Yorùbá tó rọrùn láti kà àti láti pè.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ìṣètò gbólóhùn náà jẹ́ àdánidá ní Yorùbá, ó sì pa ìsopọ̀ ẹsẹ yìí mọ́ pẹ̀lú àwọn obìnrin tí ẹsẹ tó ṣáájú mẹ́nu kàn.
