id: MAT.27.12
reference: Matthew 27:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: yo
  text: Nígbà tí àwọn olórí àlùfáà àti àwọn àgbààgbà ń fi ẹ̀sùn kan án, kò dá ohunkóhun lóhùn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò fún wọn ní ìdáhùn kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: Nígbà tí ... ń fi ẹ̀sùn kan án
  rationale: Ìkọ̀ yìí fi hàn pé fífi ẹ̀sùn kàn án ń lọ lọ́wọ́ ní àkókò náà; ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ àkókò àti ìṣe tí ẹni mìíràn ń ṣe sí i mọ́.
- source_word: κατηγορεῖσθαι
  choice: ń fi ẹ̀sùn kan án
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ pé àwọn kan ń fẹ̀sùn kan ẹni ní àyíká ìdájọ́.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: àwọn olórí àlùfáà àti àwọn àgbààgbà
  rationale: “Àwọn olórí àlùfáà” tọ́ka sí àwọn aṣáájú ẹgbẹ́ àwọn àlùfáà, “àwọn àgbààgbà” sì jẹ́ ìtumọ̀ tààrà fún àwọn aṣáájú àgbà ní àwùjọ náà.
- source_word: οὐδὲν
  choice: ohunkóhun
  rationale: Pẹ̀lú ọ̀rọ̀ ìkà “kò,” “ohunkóhun” pa ìtumọ̀ tààrà náà mọ́ pé kò dá nǹkan kan lóhùn.
- source_word: ἀπεκρίνατο
  choice: dá ... lóhùn
  rationale: “Dá ... lóhùn” jẹ́ gbólóhùn Yorùbá àdánidá fún fífèsì tàbí fífi ìdáhùn fún ẹ̀sùn.
- source_word: καὶ
  choice: Nígbà tí
  rationale: Nínú ìṣàn àlàyé Yorùbá, ìbẹ̀rẹ̀ gbólóhùn pẹ̀lú “Nígbà tí” mú ìbáṣepọ̀ àkókò inú ἐν τῷ jáde kedere láìfi ìtakora kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìdákẹ́jẹ Jésù níwájú àwọn olùfisùn rẹ̀
  choice: Ṣàlàyé ìṣẹ̀lẹ̀ náà lásán pé kò dá ohunkóhun lóhùn.
  alternative: Lo ọ̀rọ̀ tó túmọ̀ sí àsọtẹ́lẹ̀ Aísáyà 53 tàbí fi hàn ní tààrà pé àsọtẹ́lẹ̀ kan ṣẹ.
  rationale: Ẹsẹ yìí sọ ohun tí Jésù ṣe nígbà tí wọ́n fi ẹ̀sùn kàn án, ṣùgbọ́n kò sọ ní tààrà pé ìmúṣẹ àsọtẹ́lẹ̀ ni; nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A yan “àwọn olórí àlùfáà” dípò gbólóhùn tó lè túmọ̀ sí pé ọ̀pọ̀ olórí àlùfáà gíga ló wà ní ipò kan náà.
