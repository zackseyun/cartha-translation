  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa tó ṣàn dáadáa. “Ń fi ẹ̀sùn kan án” àti “dá ohunkóhun lóhùn” jẹ́ ọ̀nà àdánidá àti òde òní láti sọ ọ̀rọ̀ náà. Àmì ohùn àti àmì ìsàlẹ̀ ni a lò lọ́nà tó yẹ.
