id: MAT.27.43
reference: Matthew 27:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: yo
  text: Ó ti gbẹ́kẹ̀ lé Ọlọ́run; kí Ọlọ́run gbà á là nísinsin yìí, bí ó bá fẹ́ ẹ[a], nítorí ó sọ[b] pé, “Ọmọ Ọlọ́run ni mí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí inú rẹ̀ bá dùn sí i.” Ọ̀rọ̀ yìí fara jọ Sáàmù 22:8, níbi tí ojú rere Ọlọ́run sí ẹni náà ti ṣe pàtàkì.
    reason: alternative_reading
  - marker: b
    text: Ẹ̀gàn yìí fara jọ ọ̀rọ̀ inú Sáàmù 22:8 gan-an; ó so bí wọ́n ṣe ń fi Jésù ṣẹ̀sín pọ̀ mọ́ ẹni olódodo tí ń jìyà nínú sáàmù náà.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: Ó ti gbẹ́kẹ̀ lé Ọlọ́run
  rationale: “Gbẹ́kẹ̀ lé” ni ọ̀nà Yorùbá àdánidá fún gbígbẹ́kẹ̀lé ẹnì kan. “Ti” ń fi ipò tí ìṣe àtijọ́ mú wá, ó sì bá agbára perfect πέποιθεν mu láìsọ ọ́ di àsọyé ẹ̀kọ́ ìgbàgbọ́.
- source_word: ῥυσάσθω
  choice: kí Ọlọ́run gbà á sílẹ̀
  rationale: “Gbà á sílẹ̀” sọ ìgbàlà kúrò nínú ewu ní èdè Yorùbá òde òní. A tún “Ọlọ́run” sọ gẹ́gẹ́ bí olùṣe tí ọ̀rọ̀ Gíríìkì fi hàn láti inú àyíká, kí àwọn arọ́pò-orúkọ má bà a dàrú.
- source_word: νῦν
  choice: nísinsin yìí
  rationale: Ó pa ìtẹnumọ́ ìkánjú inú ẹ̀gàn náà mọ́ ju “ní báyìí” lọ.
- source_word: εἰ θέλει αὐτόν
  choice: bí ó bá fẹ́ ẹ
  rationale: Èyí tẹ̀ lé ìtumọ̀ wọ́pọ̀ θέλω, “fẹ́,” ó sì pa àìdánilójú náà mọ́; ìtumọ̀ “bí inú rẹ̀ bá dùn sí i” wà nínú àlàyé ìsàlẹ̀ nítorí ìfarajọ Sáàmù 22:8.
- source_word: εἶπεν γὰρ ὅτι
  choice: nítorí ó sọ pé
  rationale: Aorist εἶπεν jẹ́ ọ̀rọ̀ ìṣe àtijọ́; “sọ pé” jẹ́ ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ tí a fa yọ wọlé.
- source_word: Θεοῦ εἰμι υἱός
  choice: Ọmọ Ọlọ́run ni mí
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún gbólóhùn ìdánimọ̀, ó sì pa agbára orúkọ oyè náà mọ́. Àìsí article nínú Gíríìkì kò béèrè fún ìtumọ̀ aláìdánimọ̀ nínú àyíká Mátíù.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Θεοῦ εἰμι υἱός
  choice: Ọmọ Ọlọ́run ni mí
  alternative: Ọ̀kan lára àwọn ọmọ Ọlọ́run ni mí
  rationale: Nínú ìtàn Mátíù, gbólóhùn náà tọ́ka sí orúkọ oyè Kristi, kì í ṣe ìbátan pẹ̀lú Ọlọ́run lásán. Yorùbá kò lo article bí Gẹ̀ẹ́sì, ṣùgbọ́n lílo lẹ́tà ńlá àti àyíká gbólóhùn náà pa agbára oyè náà mọ́.
- issue: Bóyá kí θέλει αὐτόν túmọ̀ sí ìfẹ́ tàbí inú dídùn sí ẹnì kan
  choice: bí ó bá fẹ́ ẹ
  alternative: bí inú rẹ̀ bá dùn sí i
  rationale: Ìtumọ̀ àkọ́kọ́ θέλω ni “fẹ́”; síbẹ̀, ìfarajọ Sáàmù 22:8 lè mú ìtumọ̀ ojú rere tàbí inú dídùn wá. A fi èyí sínú àlàyé ìsàlẹ̀, kí a má bà a yanjú ẹ̀dọ̀fu inú ọ̀rọ̀ náà láìnídí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣeé lóye ní kedere. A lo “gbẹ́kẹ̀ lé,” “gbà á sílẹ̀,” àti “nísinsin yìí” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ, àwọn àmì àlàyé [a] àti [b] sì hàn nínú ọ̀rọ̀ pàtàkì.
