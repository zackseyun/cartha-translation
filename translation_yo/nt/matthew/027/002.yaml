  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: yo
  text: Wọ́n sì dè é tán[a], wọ́n mú un lọ, wọ́n sì fi í lé ọwọ́ Pílátù, gómìnà náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn tí wọ́n dè é.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n fi í fún Pílátù gómìnà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: wọ́n dè é tán
  rationale: Ọ̀rọ̀ ìṣe aláìlẹ́gbẹ́ aorist participle yìí fi hàn pé dídi Jésù ṣẹlẹ̀ ṣáájú àwọn ìṣe pàtàkì tó tẹ̀ lé e. “Dè é tán” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ dídi mọ́, ó sì fi ìtẹ̀síwájú àkókò hàn.
- source_word: ἀπήγαγον
  choice: wọ́n mú un lọ
  rationale: ἀπάγω túmọ̀ sí mímú tàbí ṣíṣá ẹnì kan lọ. “Mú un lọ” bá ọ̀rọ̀ Yorùbá òde òní mu, ó sì bójú mu àyíká tí wọ́n ti ń kó ẹlẹ́wọ̀n lọ.
- source_word: παρέδωκαν
  choice: wọ́n fi í lé ... lọ́wọ́
  rationale: Àṣàyàn yìí fi ìtumọ̀ fífi ẹnì kan sábẹ́ àṣẹ tàbí sí ìkáwọ́ ẹlòmíràn hàn, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: Πιλάτῳ
  choice: Pílátù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú ìpè Yorùbá tó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: ἡγεμόνι
  choice: gómìnà náà
  rationale: ἡγεμών jẹ́ olórí ìjọba. “Gómìnà” ṣe kedere fún òǹkàwé Yorùbá òde òní, kò sì sọ ipò Pílátù di pàtó ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: καὶ ... καὶ
  choice: Wọ́n sì ... wọ́n sì
  rationale: “Sì” pa ìṣàn ìtàn àti ìṣọ̀kan àwọn ìṣe mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ παραδίδωμι nínú ìtàn ìjìyà Jésù
  choice: fi í lé Pílátù ... lọ́wọ́
  alternative: fi í fún Pílátù / fà á lé Pílátù lọ́wọ́
  rationale: Ó tẹnu mọ́ ìtumọ̀ òfin àti ìkáwọ́ ní àyíká ẹsẹ yìí, ṣùgbọ́n kò pa ìró ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà lè ní nínú ìtàn ìjìyà run.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní ọlá, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “mú un lọ” àti “fi í lé ... lọ́wọ́” fún ìtumọ̀ tó ṣe kedere sí ará ìlú láìsọ ohun tí Gíríìkì kò sọ.
