id: MAT.27.54
reference: Matthew 27:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: yo
  text: Nígbà tí olórí ọgọ́rùn-ún ọmọ ogun náà àti àwọn tí wọ́n wà pẹ̀lú rẹ̀, tí wọ́n ń ṣọ́ Jesu, rí ìmìtìtì ilẹ̀ náà àti àwọn ohun tí ó ṣẹlẹ̀, ẹ̀rù bà wọ́n gidigidi, wọ́n sì wí pé, “Lóòótọ́, Ọmọ Ọlọ́run ni ẹni yìí.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ọmọ ọlọ́run kan.” Ìpè Gíríìkì náà kò ní àmì-ẹ̀yà; ṣùgbọ́n nínú àyíká ìwé Mátíù, a gba ọ̀rọ̀ náà gẹ́gẹ́ bí oyè fún Jesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: balógun ọ̀rún
  rationale: Ó túmọ̀ ipò olórí ọmọ ogun Róòmù tó ń darí nǹkan bí ọgọ́rùn-ún ọmọ ogun, ó sì ṣeé lóye ní Yorùbá láìlo ọ̀rọ̀ àyálò tí kò wọ́pọ̀.
- source_word: τηροῦντες
  choice: tí wọ́n ń ṣọ́
  rationale: Nínú àyíká ibi ìkànmọ́ àgbélébùú, ọ̀rọ̀ náà túmọ̀ sí ṣíṣọ́ Jesu, kì í ṣe wíwo lásán.
- source_word: ἰδόντες
  choice: rí
  rationale: A tú participle aorist náà sí gbólóhùn àkókò Yorùbá, ‘Nígbà tí ... rí,’ láti jẹ́ kó ṣe é kà lọ́nà àdánidá.
- source_word: σεισμόν
  choice: ìmìtìtì ilẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún earthquake nínú àyíká yìí.
- source_word: τὰ γενόμενα
  choice: àwọn ohun tí ó ṣẹlẹ̀
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ ohun inú èdè Gíríìkì mọ́, kò sì fi gbogbo rẹ̀ mọ́ ìmìtìtì ilẹ̀ nìkan.
- source_word: ἐφοβήθησαν σφόδρα
  choice: ẹ̀rù bà wọ́n gidigidi
  rationale: Gbólóhùn Yorùbá àdánidá yìí pa agbára σφόδρα mọ́.
- source_word: Ἀληθῶς
  choice: Lóòótọ́
  rationale: Ó mú ìdánilójú àti ìjẹ́wọ́ ọ̀rọ̀ náà jáde láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: θεοῦ υἱὸς
  choice: Ọmọ Ọlọ́run
  rationale: Nínú ìtàn Mátíù, gbólóhùn náà ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè fún Jesu; Yorùbá kò nílò article bí ti Gẹ̀ẹ́sì, nítorí náà àìní article nínú Gíríìkì kò lè hàn ní ọ̀nà kan náà.
- source_word: οὗτος
  choice: ẹni yìí
  rationale: Ó pa agbára demonstrative náà mọ́, ó sì dun bí Yorùbá àdánidá nínú ọ̀rọ̀ tààrà.
theological_decisions:
- issue: Ìtumọ̀ θεοῦ υἱὸς nínú ìjẹ́wọ́ balógun ọ̀rún
  choice: Ọmọ Ọlọ́run
  alternative: ọmọ ọlọ́run kan
  rationale: Àyíká Kristi ní Mátíù ń ṣe àtìlẹ́yìn fún oyè ‘Ọmọ Ọlọ́run.’ Síbẹ̀, nítorí gbólóhùn Gíríìkì kò ní article, a fi ìtumọ̀ aláìdájú sí àlàyé ìsàlẹ̀ láti pa àríyànjiyàn gírámà àti ìtumọ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘balógun ọ̀rún’ láti ṣàlàyé ipò ọmọ ogun Róòmù ní kúkúrú. A yà ‘tí wọ́n ń ṣọ́ Jesu’ sọ́tọ̀ pẹ̀lú àmì kọ́mà kí ó lè tọ́ka sí ẹgbẹ́ àwọn tó wà pẹ̀lú balógun náà láìjẹ́ kí gbólóhùn náà le.
