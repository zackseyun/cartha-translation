  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n bọ́ aṣọ rẹ̀ kúrò lára rẹ̀, wọ́n fi aṣọ òde àwọ̀ pupa rírẹ̀dòdò wọ̀ ọ́,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Wọ́n sì
  rationale: A lo “sì” gẹ́gẹ́ bí àsopọ̀ ìtàn tó bá καί mu, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐκδύσαντες αὐτὸν
  choice: bọ́ aṣọ rẹ̀ kúrò lára rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n tú aṣọ tí ó wọ̀ kúrò lára rẹ̀; ìṣe náà ṣáájú fífi ẹ̀wù mìíràn wọ̀ ọ́.
- source_word: χλαμύδα
  choice: ẹ̀wù
  rationale: χλαμύς jẹ́ aṣọ òde tàbí aṣọ àwọ̀lékè, nígbà míì ó jẹ́ ẹ̀wù kúkúrú tí àwọn ọmọ ogun tàbí aláṣẹ máa ń wọ̀. “Ẹ̀wù” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láì fi ìtumọ̀ ọba kún un.
- source_word: κοκκίνην
  choice: àwọ̀ rírẹ̀dòdò
  rationale: κόκκινος túmọ̀ sí àwọ̀ pupa dídán tí a lè pè ní scarlet; “àwọ̀ rírẹ̀dòdò” pa ìmúná àwọ̀ náà mọ́ ju “pupa” lásán lọ.
- source_word: περιέθηκαν αὐτῷ
  choice: fi ... wọ̀ ọ́
  rationale: Nínú àyíká yìí, περιτίθημι pẹ̀lú ẹni tí wọ́n ṣe sí túmọ̀ sí fífi aṣọ náà lé e tàbí wọ̀ ọ́; gbolohun yìí jẹ́ ti Yorùbá àdánidá.
theological_decisions:
- issue: Irú aṣọ tí wọ́n fi wọ Jesu nínú ẹ̀gàn náà
  choice: ẹ̀wù àwọ̀ rírẹ̀dòdò
  alternative: aṣọ òde àwọ̀ rírẹ̀dòdò
  rationale: Yíyan “ẹ̀wù” pa ìtumọ̀ χλαμύς gẹ́gẹ́ bí aṣọ òde mọ́, láì fi àlàyé ọba tàbí ẹ̀kọ́ ìsìn tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbòò.
