id: MAT.27.16
reference: Matthew 27:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: yo
  text: Ní àkókò náà, wọ́n ní ẹlẹ́wọ̀n kan tí ó lókìkí fún ìwà búburú, tí a ń pè ní Jésù Bárábásì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé-àfọwọ́kọ kan ka “Bárábásì” nìkan, wọn kò ní “Jésù.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: wọ́n ní
  rationale: Ọ̀rọ̀-ìṣe aláìpé yìí ní olùṣe ọ̀pọ̀ tí a kò dárúkọ; “wọ́n ní” pa èrò pé àwọn aláṣẹ ń fi ẹni náà sínú àhámọ́ mọ́.
- source_word: δέ
  choice: kò ṣe àfihàn rẹ̀ lọ́tọ̀
  rationale: δέ jẹ́ àsopọ̀ ìtàn tó rọrùn; ìṣàn gbólóhùn Yorùbá àti “ní àkókò náà” ti mú iṣẹ́ rẹ̀ ṣẹ láìfi ọ̀rọ̀ àfikún tí yóò wuwo sí i.
- source_word: τότε
  choice: ní àkókò náà
  rationale: Ó fi àkókò pàtó inú ìtàn hàn ní ọ̀nà tó ṣe kedere, tó sì jẹ́ ti Yorùbá àdánidá.
- source_word: δέσμιον
  choice: ẹlẹ́wọ̀n
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni tí a fi sínú àhámọ́ ní ipò ìdájọ́.
- source_word: ἐπίσημον
  choice: tí ó lókìkí fún ìwà búburú
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἐπίσημος túmọ̀ sí ẹni tí a mọ̀ káàkiri ní ọ̀nà búburú; yíyan yìí mú ìtumọ̀ odi náà hàn ní Yorùbá tó ṣe kedere.
- source_word: λεγόμενον
  choice: tí a ń pè ní
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi orúkọ tàbí àpèlé ẹni hàn.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Jésù Bárábásì
  rationale: SBLGNT ní orúkọ méjèèjì, nítorí náà a fi méjèèjì sínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ẹ̀rí ìwé-àfọwọ́kọ míì ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìrísí orúkọ Bárábásì nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀
  choice: 'Fi “Jésù” sínú ọ̀rọ̀ pàtàkì: “Jésù Bárábásì.”'
  alternative: Ka “Bárábásì” nìkan, kí a má fi “Jésù” sí i.
  rationale: SBLGNT tí a pèsè ka Ἰησοῦν Βαραββᾶν. A tẹ̀ lé ẹ̀rí orísun náà ní ọ̀rọ̀ pàtàkì, ṣùgbọ́n a pa ìyàtọ̀ pàtàkì inú àwọn ìwé-àfọwọ́kọ mọ́ sínú àlàyé ìsàlẹ̀ láìyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé lásán. A fi àmì ohùn sí ibi tí ó bá àṣà Yorùbá mu, a sì lo àtúmọ̀ tó ṣe àlàfo láàárín dídúró mọ́ ọ̀rọ̀ Gíríìkì àti ìṣàn Yorùbá àdánidá.
