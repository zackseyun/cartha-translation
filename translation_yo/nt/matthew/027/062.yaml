id: MAT.27.62
reference: Matthew 27:62
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: yo
  text: Ní ọjọ́ kejì[a], èyí tí ó jẹ́ lẹ́yìn Ọjọ́ Ìmúrasílẹ̀, àwọn olórí àlùfáà àti àwọn Farisí péjọ níwájú Pilatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí ó jẹ́ lẹ́yìn Ìmúrasílẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọjọ́ ìmúrasílẹ̀ ṣáájú Sábáàtì; títúmọ̀ rẹ̀ sí “Ọjọ́ Ẹtì” yóò fi ìtumọ̀ kún un ju ohun tí ọ̀rọ̀ orísun béèrè lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Ní ọjọ́ kejì
  rationale: Ó fi ìtẹ̀síwájú àkókò hàn ní Yorùbá àdánidá; a kò fi ọ̀rọ̀ mìíràn kún un láti túmọ̀ δέ ju bó ṣe yẹ lọ.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: èyí tí ó jẹ́ lẹ́yìn Ọjọ́ Ìmúrasílẹ̀
  rationale: Gbólóhùn àsopọ̀ náà ń ṣàlàyé ọjọ́ kejì, ó sì pa ìtumọ̀ àkókò inú èdè Gíríìkì mọ́.
- source_word: παρασκευήν
  choice: Ọjọ́ Ìmúrasílẹ̀
  rationale: Ó tọ́ka sí ọjọ́ ìmúrasílẹ̀ ṣáájú Sábáàtì nínú àyíká Júù; yíyàn ‘Ọjọ́ Ẹtì’ yóò túmọ̀ ọ̀rọ̀ náà ní pàtó ju orísun lọ.
- source_word: συνήχθησαν
  choice: péjọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe àdánidá fún wí pé wọ́n kóra jọ.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ó ń tọ́ka sí àwọn aṣáájú alufaa, kì í ṣe ọ̀pọ̀ ẹni tó di olórí àlùfáà gíga kan náà mú.
- source_word: οἱ Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ Júù náà ni wọ́n sábà máa ń pè ní Farisí ní Yorùbá.
- source_word: πρὸς Πιλᾶτον
  choice: níwájú Pilatu
  rationale: Ní àyíká ìjọba àti ẹjọ́ yìí, ó fi hàn pé wọ́n wá sí iwájú Pilatu, bó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ ìlọ sí ọ̀dọ̀ rẹ̀.
- source_word: Πιλᾶτον
  choice: Pilatu
  rationale: Àkọsílẹ̀ orúkọ Πιλᾶτος tó wọ́pọ̀ ní Yorùbá ni Pilatu.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘Ọjọ́ Ìmúrasílẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ kàlẹ́ńdà Júù láì sọ ọ́ di ‘Ọjọ́ Ẹtì.’
