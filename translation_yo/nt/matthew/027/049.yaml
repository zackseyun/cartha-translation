id: MAT.27.49
reference: Matthew 27:49
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: yo
  text: Ṣùgbọ́n àwọn yòókù sọ pé,[a] “Fi í sílẹ̀.[b] Ẹ jẹ́ kí a wò ó bóyá Èlíjà ń bọ̀ láti gbà á là.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn mìíràn sọ pé.”
    reason: lexical_alternative
  - marker: b
    text: Àṣẹ Gíríìkì náà lè túmọ̀ sí “Má ṣe dá sí i.” Gbólóhùn tó tẹ̀ lé e tún lè jẹ́, “Ká wo bóyá Èlíjà yóò wá láti gbà á là”; ṣùgbọ́n ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ present tense, “ń bọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Ṣùgbọ́n àwọn yòókù
  rationale: “Àwọn yòókù” tọ́ka sí àwọn tó kù ní ìyàtọ̀ sí ẹni tàbí àwọn ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; “ṣùgbọ́n” sì mú ìyàtọ̀ tí δέ fi hàn jáde lọ́nà àdánidá.
- source_word: ἔλεγον
  choice: sọ pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà wà ní imperfect, nínú ìtàn Yorùbá “sọ pé” jẹ́ ọ̀nà àdánidá láti gbé ọ̀rọ̀ wọn wọlé láìfi dandan sọ pé wọ́n ń tún un sọ.
- source_word: Ἄφες
  choice: Fi í sílẹ̀
  rationale: Àṣẹ olódù kan ni; nínú àyíká yìí ó túmọ̀ sí pé kí ẹni tí ń dá sí ọ̀ràn Jésù jáwọ́, kí wọ́n lè wo ohun tí yóò ṣẹlẹ̀. Arọ́pò-orúkọ “í” mú ẹni tí a ń tọ́ka sí hàn ní Yorùbá.
- source_word: ἴδωμεν
  choice: Ẹ jẹ́ kí a wò ó
  rationale: Aorist subjunctive ẹni àkọ́kọ́ púpọ̀ ni a lò gẹ́gẹ́ bí ìṣírí fún gbogbo ẹgbẹ́; gbolóhùn Yorùbá yìí jẹ́ ọ̀nà àdánidá fún “ẹ jẹ́ ká wo.”
- source_word: εἰ ἔρχεται
  choice: bóyá ... ń bọ̀
  rationale: “Bóyá” dáhùn sí εἰ gẹ́gẹ́ bí ìbéèrè aláìtààrà, “ń bọ̀” sì pa ìrísí present tense àti ìmọ̀lára ohun tó ń ṣẹlẹ̀ lójú ẹsẹ̀ mọ́.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: Èyí ni ìkọ̀wé orúkọ wòlíì náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: σώσων αὐτόν
  choice: láti gbà á là
  rationale: Future participle náà fi ète dídé Èlíjà hàn. “Gbà á là” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìdáǹdè kúrò nínú ikú, ó sì pa ìsopọ̀ pẹ̀lú ìtumọ̀ σῴζω mọ́.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàlà tí σῴζω lè ní nínú àyíká àgbélébùú
  choice: “láti gbà á là” ní ìtumọ̀ ìdáǹdè Jésù kúrò lórí àgbélébùú
  alternative: “láti dá a nídè”
  rationale: Àwọn olùsọ̀rọ̀ ń retí ìdáǹdè tí ojú lè rí, wọn kò sì ń ṣe àlàyé ẹ̀kọ́ nípa ìgbàlà ayérayé. “Gbà á là” pa ìtumọ̀ lasán àti ìfọ̀rọ̀yà inú ìtàn ìjìyà náà mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo “Fi í sílẹ̀” àti “Ẹ jẹ́ kí a wò ó” kí ọ̀rọ̀ náà lè yé òǹkàwé lasán, láìsọ ìtumọ̀ tó ṣì ní ààyè méjì di ọ̀kan ṣoṣo.
