  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: yo
  text: Wọ́n sì lọ, wọ́n mú ibojì náà dájú nípa fífi èdìdì di òkúta náà pẹ̀lú ẹgbẹ́ ẹ̀ṣọ́ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ẹgbẹ́ ẹ̀ṣọ́ náà”; ó sì ṣeé ṣe kí ìtumọ̀ rẹ̀ jẹ́, “wọ́n fi èdìdì di òkúta náà, wọ́n sì yan ẹgbẹ́ ẹ̀ṣọ́ síbẹ̀.” Gbólóhùn Gíríìkì náà kúrú, ó sì lè túmọ̀ sí pé ẹgbẹ́ ẹ̀ṣọ́ náà bá iṣẹ́ fífi èdìdì di òkúta lọ, kì í ṣe dandan pé yíyan wọn síbẹ̀ jẹ́ ìgbésẹ̀ ọ̀tọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Wọ́n sì lọ
  rationale: A tú ọ̀rọ̀ àpọnlé náà sí ọ̀rọ̀-ìṣe aláṣẹ gẹ́gẹ́ bí ó ṣe máa ń rí nínú Yorùbá àdánidá; “sì” ń tẹ ìtàn náà síwájú láìfi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: ἠσφαλίσαντο
  choice: wọ́n mú … dájú
  rationale: Gbólóhùn yìí sọ pé wọ́n ṣe ohun tí yóò mú kí ibojì náà dúró láìsí ìfọwọ́kan tàbí ìdàrúdàpọ̀; ó bá ìtumọ̀ ἀσφαλίζω mu láìṣàfikún bí wọ́n ṣe ṣe é ju ohun tí ẹsẹ náà sọ lọ.
- source_word: τὸν τάφον
  choice: ibojì náà
  rationale: “Ibojì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ibi ìsìnkú Jésù nínú àyíká yìí.
- source_word: σφραγίσαντες
  choice: nípa fífi èdìdì di
  rationale: '“Nípa” fi ipa ọ̀nà tàbí ohun èlò tí àpọnlé aorist náà lè ní hàn: fífi èdìdì di òkúta náà ni ọ̀nà tí wọ́n fi mú ibojì náà dájú.'
- source_word: τὸν λίθον
  choice: òkúta náà
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, láìṣàfikún “òkúta ẹnu-ọ̀nà,” bí ó tilẹ̀ jẹ́ pé àyíká fi èyí hàn.
- source_word: μετὰ τῆς κουστωδίας
  choice: pẹ̀lú ẹgbẹ́ àwọn ẹ̀ṣọ́
  rationale: κουστωδία ń tọ́ka sí ikọ̀ tàbí ẹgbẹ́ ẹ̀ṣọ́. “Pẹ̀lú” pa ìtumọ̀ ìbákẹ́gbẹ́ μετὰ mọ́, láìpinnu bóyá wọ́n ṣẹ̀ṣẹ̀ yan àwọn ẹ̀ṣọ́ síbẹ̀ tàbí pé àwọn ẹ̀ṣọ́ wà níbẹ̀ nígbà tí wọ́n fi èdìdì di òkúta.
theological_decisions:
- issue: Ìbáṣepọ̀ μετὰ τῆς κουστωδίας pẹ̀lú fífi ibojì náà múlẹ̀
  choice: Ẹgbẹ́ àwọn ẹ̀ṣọ́ bá fífi èdìdì di òkúta náà lọ tàbí wọ́n kópa nínú rẹ̀.
  alternative: Wọ́n fi èdìdì di òkúta náà, wọ́n sì yan ẹgbẹ́ ẹ̀ṣọ́ sí ibojì náà gẹ́gẹ́ bí ìgbésẹ̀ kejì.
  rationale: Gbólóhùn Gíríìkì kúrú, ó sì lè tọ́ka sí ìbákẹ́gbẹ́ dípò ìgbésẹ̀ aláṣẹ mìíràn. Ìtumọ̀ náà kò sọ ohun tó ju orísun lọ, ó sì pa àìdájú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ẹgbẹ́ àwọn ẹ̀ṣọ́” fún orúkọ àkójọpọ̀ κουστωδία, a sì pa ìṣókí àti àìdájú gírámà ọ̀rọ̀ ìparí mọ́.
