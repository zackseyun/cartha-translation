review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the judicial setting, the wife's warning, δίκαιος as ‘righteous,’ and her suffering in a dream because of him. However, ‘aya rẹ̀ ránṣẹ́ sí i’ normally says that his wife sent a servant/messenger to him, rather than that she sent him a message; this changes the communicative action expressed by ἀπέστειλεν πρὸς αὐτόν ... λέγουσα.
  naturalness: Most of the verse is clear Standard Yoruba, but ‘fi ọ̀rọ̀ ránṣẹ́ sí i’ is the natural way to express sending word/message. ‘àga ìdájọ́’ is also more idiomatic than ‘ìjókòó ìdájọ́’ for an official judgment seat.
  terminology: ‘Ọkùnrin olódodo yẹn’ appropriately preserves the broader moral and legal force of δίκαιος. The supplied footnote responsibly gives ‘ọkùnrin aláìlẹ́bi yẹn’ as a contextual legal alternative without making it the sole meaning.
  issues:
  - severity: medium
    issue: ‘Aya rẹ̀ ránṣẹ́ sí i’ is semantically ambiguous and ordinarily means ‘his wife sent a servant/messenger to him.’
    rationale: The Greek says that his wife sent a communication to him, with the following participle introducing its content. Adding ‘fi ọ̀rọ̀’ makes the intended message explicit without specifying a delivery method.
  - severity: low
    issue: ‘Ìjókòó ìdájọ́’ is less idiomatic than ‘àga ìdájọ́.’
    rationale: βῆμα is the official judicial seat; ‘àga ìdájọ́’ is a natural modern Yoruba expression for that function.
  revised_text: Nígbà tí ó wà lórí àga ìdájọ́, aya rẹ̀ fi ọ̀rọ̀ ránṣẹ́ sí i pé, “Má ṣe ní ohunkóhun ṣe pẹ̀lú ọkùnrin olódodo yẹn,[a] nítorí mo jìyà púpọ̀ lónìí nínú àlá nítorí rẹ̀.”
  revised_footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin aláìlẹ́bi yẹn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí ó jẹ́ olódodo tàbí ẹni tí kò lẹ́bi, pàápàá nínú àyíká ẹjọ́.
    reason: lexical_alternative
  revision_rationale: The revision corrects the message-sending construction so it does not imply that Pilate’s wife dispatched a person. It also uses the more idiomatic judicial term ‘àga ìdájọ́.’ The source’s temporal circumstance, warning idiom, ambiguity of δίκαιος, and causal reference to the dream remain intact.
