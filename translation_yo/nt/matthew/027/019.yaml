revisions:
- from: Bí ó ti jókòó lórí ìjókòó ìdájọ́, aya rẹ̀ ránṣẹ́ sí i pé, “Má ṣe ní ohunkóhun ṣe pẹ̀lú ọkùnrin olódodo yẹn,[a] nítorí mo jìyà púpọ̀ lónìí nínú àlá nítorí rẹ̀.”
  to: Nígbà tí ó wà lórí àga ìdájọ́, aya rẹ̀ fi ọ̀rọ̀ ránṣẹ́ sí i pé, “Má ṣe ní ohunkóhun ṣe pẹ̀lú ọkùnrin olódodo yẹn,[a] nítorí mo jìyà púpọ̀ lónìí nínú àlá nítorí rẹ̀.”
  rationale: The revision corrects the message-sending construction so it does not imply that Pilate’s wife dispatched a person. It also uses the more idiomatic judicial term ‘àga ìdájọ́.’ The source’s temporal circumstance, warning idiom, ambiguity of δίκαιος, and causal reference to the dream remain intact.
