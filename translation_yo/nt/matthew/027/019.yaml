id: MAT.27.19
reference: Matthew 27:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: yo
  text: Nígbà tí ó wà lórí àga ìdájọ́, aya rẹ̀ fi ọ̀rọ̀ ránṣẹ́ sí i pé, “Má ṣe ní ohunkóhun ṣe pẹ̀lú ọkùnrin olódodo yẹn,[a] nítorí mo jìyà púpọ̀ lónìí nínú àlá nítorí rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin aláìlẹ́bi yẹn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí ó jẹ́ olódodo tàbí ẹni tí kò lẹ́bi, pàápàá nínú àyíká ẹjọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Bí ó ti jókòó
  rationale: Ọ̀rọ̀ yìí fi hàn pé jíjókòó rẹ̀ ń lọ lọ́wọ́ nígbà tí aya rẹ̀ fi ránṣẹ́; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìbáṣepọ̀ àkókò náà mọ́.
- source_word: ἐπὶ τοῦ βήματος
  choice: lórí ìjókòó ìdájọ́
  rationale: Nínú àyíká ẹjọ́ yìí, βῆμα ń tọ́ka sí ìjókòó òṣìṣẹ́ ìjọba tí ó ti ń ṣe ìdájọ́, kì í ṣe pèpéle lásán.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: aya rẹ̀ ránṣẹ́ sí i pé
  rationale: Èyí sọ ní kedere pé aya rẹ̀ fi iṣẹ́ ránṣẹ́ dé ọ̀dọ̀ rẹ̀, láì fi ọ̀nà tí a gbà gbé iṣẹ́ náà dé kún ohun tí Gíríìkì sọ.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Má ṣe ní ohunkóhun ṣe pẹ̀lú ọkùnrin olódodo yẹn
  rationale: Àpólà Gíríìkì náà jẹ́ ọ̀nà kúkúrú láti kìlọ̀ pé kí ẹni náà má ṣe dá sí ọ̀ràn ọkùnrin náà. ‘Olódodo’ pa agbára ìwà rere àti ti ìdájọ́ inú δίκαιος mọ́.
- source_word: πολλὰ ... ἔπαθον
  choice: mo jìyà púpọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìjìyà líle tàbí púpọ̀ tí ọ̀rọ̀ Gíríìkì náà sọ.
- source_word: σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: lónìí nínú àlá nítorí rẹ̀
  rationale: Ìtumọ̀ yìí pa àkókò, ibi ìrírí àlá, àti ìdí tí obìnrin náà sọ pé ó fi jìyà mọ́, láì túmọ̀ ju ohun tí orísun sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ δίκαιος nípa Jésù
  choice: ọkùnrin olódodo
  alternative: ọkùnrin aláìlẹ́bi
  rationale: ‘Olódodo’ pa ìtumọ̀ ìwà rere àti òdodo ọ̀rọ̀ Gíríìkì mọ́. Síbẹ̀, nítorí pé ọ̀rọ̀ náà wà nínú àyíká ẹjọ́, ‘aláìlẹ́bi’ tún ṣeé ṣe, a sì fi í sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tí ó bójú mu, tí ó ní àmì ohùn níbi tí ó yẹ, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo ‘aya’ fún ìbáṣepọ̀ ìgbéyàwó, ‘ìjókòó ìdájọ́’ fún ipo aṣàṣẹ adájọ́, a sì yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
