    text: Tàbí, “aṣọ ìbòjú ibi mímọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí aṣọ inú tẹ́ńpìlì tí ó ya ibi mímọ́ sọ́tọ̀.
    reason: lexical_alternative
  revision_rationale: The revision improves the idiomatic narrative force of the opening attention marker and places the directional phrase directly with the tearing event. It otherwise preserves the draft’s faithful, noninterpretive rendering and its lexical footnote.
