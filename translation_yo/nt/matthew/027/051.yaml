revisions:
- from: Sì wò ó, aṣọ ìkélé tẹ́ńpìlì[a] ya sí méjì láti òkè dé ìsàlẹ̀; ilẹ̀ ayé sì mì, àwọn àpáta sì là.
  to: Sì kíyèsí i, aṣọ ìkélé tẹ́ńpìlì[a] ya láti òkè dé ìsàlẹ̀ sí méjì; ilẹ̀ ayé sì mì, àwọn àpáta sì là.
  rationale: The revision improves the idiomatic narrative force of the opening attention marker and places the directional phrase directly with the tearing event. It otherwise preserves the draft’s faithful, noninterpretive rendering and its lexical footnote.
