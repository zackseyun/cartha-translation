id: MAT.27.51
reference: Matthew 27:51
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: yo
  text: Sì kíyèsí i, aṣọ ìkélé tẹ́ńpìlì[a] ya láti òkè dé ìsàlẹ̀ sí méjì; ilẹ̀ ayé sì mì, àwọn àpáta sì là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ ìbòjú ibi mímọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí aṣọ inú tẹ́ńpìlì tí ó ya ibi mímọ́ sọ́tọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ọ̀rọ̀ yìí ń pe àfiyèsí sí ohun àgbàyanu tí ó ṣẹ̀ lójijì. “Wò ó” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtàn ọlọ́wọ̀ mu.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: aṣọ ìkélé tẹ́ńpìlì
  rationale: “Aṣọ ìkélé” jẹ́ ọ̀rọ̀ òde òní tó yéni fún aṣọ tí a fi dá ààyè inú tẹ́ńpìlì. Ọ̀rọ̀ ναός lè tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì, ṣùgbọ́n a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐσχίσθη ... εἰς δύο
  choice: ya sí méjì
  rationale: Ó bá ìṣe aṣọ mu, ó pa ìṣe àṣeyọrí aláìlórúkọ mọ́, kò sì sọ ẹni tó fa á.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: láti òkè dé ìsàlẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ìtọ́sọ́nà yíya náà hàn ní kíkún.
- source_word: ἡ γῆ ἐσείσθη
  choice: ilẹ̀ ayé sì mì
  rationale: “Ilẹ̀ ayé” pa ìtẹnumọ́ àmì ńlá náà mọ́, “mì” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣẹ̀lẹ̀ yìí.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: àwọn àpáta sì là
  rationale: “Àpáta” tọ́ka sí òkúta ńlá; “là” sì jẹ́ ọ̀rọ̀ àdánidá fún bí àpáta ṣe ya sí méjì tàbí ṣí sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ àmì aṣọ ìkélé tẹ́ńpìlì tí ó ya
  choice: A ṣàkọsílẹ̀ ìṣẹ̀lẹ̀ náà gẹ́gẹ́ bí ẹsẹ náà ṣe sọ ọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí àmì ọ̀nà tuntun sí Ọlọ́run tàbí gẹ́gẹ́ bí ìdájọ́ lórí ètò tẹ́ńpìlì.
  rationale: Ẹsẹ náà kò ṣàlàyé ohun tí àmì náà túmọ̀ sí; nítorí náà, ìtumọ̀ náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. Àwọn àsopọ̀ “sì” pa ìṣàn gbolohun Gíríìkì àti ìtẹ̀síwájú àwọn àmì náà mọ́.
