id: MAT.27.48
reference: Matthew 27:48
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ọ̀kan nínú wọn sáré, ó mú kànrìnkàn kan, ó fi wáìnì kíkan kún un[a], ó sì so ó mọ́ ọ̀pá esùsú kan, ó sì ń fún un mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọtí kikan.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí wáìnì kíkan tàbí ọtí kikan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì ń fún un ní ohun mímu.” Ọ̀rọ̀-ìṣe Gíríìkì náà fi ìṣe tí ń lọ hàn.
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ìṣe náà ṣẹlẹ̀ láìjáfara, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tó bá ìṣàn ìtàn mu.
- source_word: δραμὼν
  choice: sáré
  rationale: A tú participle aorist náà sí ọ̀rọ̀-ìṣe aláṣẹ nínú àtòjọ ìṣe, èyí tó jẹ́ àdánidá ní Yorùbá tí ó sì pa ìkánjú náà mọ́.
- source_word: εἷς ἐξ αὐτῶν
  choice: ọ̀kan nínú wọn
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ẹnì kan ṣoṣo láti inú ẹgbẹ́ náà ló ṣe ìṣe náà.
- source_word: λαβὼν σπόγγον
  choice: ó mú kànìnkànìn kan
  rationale: “Kànìnkànìn” túmọ̀ sí sponge, “ó mú” sì fi ìṣe gbígbé ohun náà hàn ní èdè àdánidá.
- source_word: πλήσας τε ὄξους
  choice: ó fi wáìnì kíkan kún un
  rationale: ὄξος lè jẹ́ wáìnì tó ti kan tàbí ọtí-wáìnì kíkan; “wáìnì kíkan” sọ irú ohun mímu náà ní kedere láìdín ìtumọ̀ rẹ̀ kù sí ọ̀kan lára àwọn àṣàyàn náà.
- source_word: περιθεὶς καλάμῳ
  choice: ó gbé e lé orí esùsú kan
  rationale: “Esùsú” jẹ́ ìbámu taara pẹ̀lú κάλαμος, gbólóhùn náà sì fi hàn pé wọ́n gbé kànìnkànìn náà sórí rẹ̀.
- source_word: ἐπότιζεν αὐτόν
  choice: ó sì ń fún un mu
  rationale: Àmì “ń” pa aspect imperfect mọ́, ó ń fi ìṣe tó ń lọ tàbí ìgbìyànjú láti fún Jésù mu hàn, dípò kí a fi hàn bí ìṣẹ̀lẹ̀ kánkán tó parí.
theological_decisions:
- issue: Irú ohun mímu tí wọ́n fi fún Jésù
  choice: wáìnì kíkan
  alternative: ọtí-wáìnì kíkan (vinegar)
  rationale: ὄξος ní ìtúmọ̀ tó lè yí ká wáìnì tó kan àti wine vinegar. “Wáìnì kíkan” sun mọ́ ohun mímu tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Aspect tàbí ìgbìyànjú nínú ἐπότιζεν
  choice: ó sì ń fún un mu
  alternative: ó sì gbìyànjú láti fún un mu; tàbí ó sì fún un mu
  rationale: Imperfect náà lè ṣàpèjúwe ìṣe tó ń lọ tàbí ìṣe tí a ń gbìyànjú láti ṣe. Àkọ́kọ́ pa aspect náà mọ́; àlàyé ìsàlẹ̀ jẹ́ kí ambiguity náà hàn.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A ṣètò àwọn participle Gíríìkì gẹ́gẹ́ bí àtòjọ ọ̀rọ̀-ìṣe Yorùbá, a sì lo “ń” láti tọ́ka sí imperfect ἐπότιζεν. Gbogbo àmì ohùn ni a fi síbi tó yẹ.
