source:
  edition: SBLGNT
  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: yo
  text: Láti wákàtí kẹfà, òkùnkùn sì bo gbogbo ilẹ̀ náà títí di wákàtí kẹsàn-án.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wákàtí kẹfà jẹ́ nǹkan bí aago méjìlá ọ̀sán, wákàtí kẹsàn-án sì jẹ́ nǹkan bí aago mẹ́ta ìrọ̀lẹ́.
    reason: cultural_note
  - marker: b
    text: Tàbí, “gbogbo ayé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ilẹ̀” tàbí “ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Láti … sì
  rationale: “Láti” fi ìbẹ̀rẹ̀ àkókò hàn, “sì” sì ń gbé ipa ìsopọ̀ onírẹ̀lẹ̀ ti δέ láì sọ ọ́ di ìtakora líle.
- source_word: ἕκτης ὥρας
  choice: wákàtí kẹfà
  rationale: Ìtumọ̀ yìí pa ọ̀nà ìṣírò àkókò inú orísun mọ́; àlàyé pé ó tó ọ̀sán wà ní àlàyé ìsàlẹ̀.
- source_word: σκότος
  choice: òkùnkùn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún darkness, ó sì pa ìwúwo ìṣẹ̀lẹ̀ náà mọ́.
- source_word: ἐγένετο
  choice: bo
  rationale: Nínú gbólóhùn “òkùnkùn bo …,” “bo” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ipò òkùnkùn dé, ó sì tàn ká agbègbè náà.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: gbogbo ilẹ̀ náà
  rationale: γῆ lè túmọ̀ sí ilẹ̀ agbègbè tàbí gbogbo ayé. “Gbogbo ilẹ̀ náà” bá àyíká ìtàn mu láì pinnu pé gbogbo ayé ni dandan; àṣàyàn kejì wà ní àlàyé ìsàlẹ̀.
- source_word: ἕως ὥρας ἐνάτης
  choice: títí di wákàtí kẹsàn-án
  rationale: Ó pa ìṣírò àkókò inú orísun mọ́; àlàyé ìsàlẹ̀ sọ àkókò ìgbàlódé tó sún mọ́ ọn.
theological_decisions:
- issue: Ìwọ̀n ibi tí γῆ tọ́ka sí nínú ọ̀rọ̀ nípa òkùnkùn
  choice: gbogbo ilẹ̀ náà
  alternative: gbogbo ayé
  rationale: Ọ̀rọ̀ Gíríìkì γῆ ní ìtumọ̀ tó gbòòrò. Àṣàyàn “ilẹ̀ náà” pa àyíká ìtàn mọ́, kò sì fi àlàyé pé ìṣẹ̀lẹ̀ náà dé gbogbo àgbáyé kún orísun. A pa “gbogbo ayé” mọ́ gẹ́gẹ́ bí àṣàyàn tó ṣeé ṣe nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti ìgbàlódé, ó níyì, ó sì rọrùn fún òǹkàwé lásán. A pa ìṣírò wákàtí ti orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé rẹ̀ ní ìsàlẹ̀.
