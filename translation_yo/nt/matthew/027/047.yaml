  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ‘àwọn kan lára àwọn tó dúró níbẹ̀’ ń ṣàfihàn τινὲς ... τῶν ἐκεῖ ἑστηκότων; ‘nígbà tí ... gbọ́ ọ’ ń mú ἀκούσαντες hàn; ‘wọ́n ń sọ’ ń pa ìrísí imperfect ti ἔλεγον mọ́; ‘Ọkùnrin yìí ń pe Èlíjà’ sì ròyìn ohun tí wọ́n sọ láìjẹ́rìí sí ìtumọ̀ wọn.'
