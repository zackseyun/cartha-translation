id: MAT.27.47
reference: Matthew 27:47
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn kan lára àwọn tó dúró níbẹ̀ gbọ́ ọ, wọ́n ń sọ pé, “Ọkùnrin yìí[a] ń pe Èlíjà.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, “Ẹni yìí.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí àwọn tó dúró níbẹ̀ lóye igbe Jésù nínú ẹsẹ tó ṣáájú lọ́nà tí kò tọ́, bí ẹni pé ó ń pe Èlíjà.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: àwọn kan
  rationale: Ó tọ́ka sí apá kan tí a kò sọ iye wọn nínú àwọn tó wà níbẹ̀; ‘àwọn kan’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìtakora díẹ̀ hàn sí ohun tí ó ṣẹ̀ṣẹ̀ ṣẹlẹ̀ nínú ẹsẹ tó ṣáájú.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: lára àwọn tó dúró níbẹ̀
  rationale: Ó pa àwòrán àwọn ènìyàn tí wọ́n dúró ní ibi ìṣẹ̀lẹ̀ náà mọ́, dípò kí a túmọ̀ rẹ̀ sí ‘àwọn olùwòran’ lásán.
- source_word: ἀκούσαντες
  choice: nígbà tí ... gbọ́ ọ
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbígbọ́ tó ṣẹlẹ̀ ṣáájú sísọ wọn; ‘ọ’ dúró fún igbe Jésù nínú àyíká ọ̀rọ̀.
- source_word: ἔλεγον
  choice: wọ́n ń sọ
  rationale: Àkókò imperfect Gíríìkì fi ìṣe tó ń lọ lọ́wọ́ tàbí tó ń tún ṣẹlẹ̀ hàn; ‘ń sọ’ pa ìrísí yẹn mọ́ láìfi dandan sọ pé wọ́n ń ṣe é léraléra.
- source_word: ὅτι
  choice: pé, “...”
  rationale: Ó ṣí ọ̀rọ̀ tí wọ́n ròyìn sílẹ̀; lílo àsọyé tààrà pẹ̀lú àmì ọ̀rọ̀ jẹ́ ti ẹ̀dá Yorùbá.
- source_word: Ἠλίαν
  choice: Èlíjà
  rationale: Èyí ni orúkọ wòlíì náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: φωνεῖ
  choice: ń pe
  rationale: Ó túmọ̀ sí pé ẹni náà ń ké pe Èlíjà tàbí ń pè é; ‘ń pe’ ṣe àfihàn present náà láìṣe àfikún ìtumọ̀ tí kò pọn dandan.
- source_word: οὗτος
  choice: Ọkùnrin yìí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka ‘yìí’ mọ́, ó sì jẹ́ èdè Yorùbá àdánidá ju ‘ẹni yìí’ lọ nínú àyíká yìí.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ àwọn tó dúró níbẹ̀ yẹ kí ó fi hàn pé Jésù pe Èlíjà ní tòótọ́, tàbí pé ohun tí àwọn náà rò pé wọ́n gbọ́ ni.
  choice: 'A gbé e kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ìròyìn wọn: “Ọkùnrin yìí ń pe Èlíjà.”'
  alternative: Ó ń ké pe Èlíjà fún ìrànlọ́wọ́.
  rationale: Gíríìkì ròyìn ohun tí àwọn tó wà níbẹ̀ sọ, kò sì fìdí rẹ̀ múlẹ̀ pé ìtumọ̀ wọn tọ̀nà. Ìtumọ̀ yìí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ inú ìtàn náà mọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì yé òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu, a sì pa ìrísí ìṣe tó ń lọ lọ́wọ́ mọ́ nípasẹ̀ ‘ń sọ’ àti ‘ń pe’.
