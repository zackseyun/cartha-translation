  terminology: ‘Èlíjà’ jẹ́ orúkọ wòlíì tí a mọ̀ nínú Yorùbá. ‘Ọkùnrin yìí’ ṣètọ́ka sí οὗτος ní ọ̀nà adayeba, àti akọsílẹ̀ a ń fúnni ní yíyan ‘Ẹni yìí.’ Àwọn àmì akọsílẹ̀ méjèèjì wà ní ibi tó yẹ, wọ́n sì bá ìdí wọn mu.
