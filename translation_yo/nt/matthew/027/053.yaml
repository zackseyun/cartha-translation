  to: Lẹ́yìn tí wọ́n jáde kúrò nínú àwọn ibojì lẹ́yìn àjíǹde rẹ̀[a], wọ́n wọ ìlú mímọ́ náà[b], wọ́n sì fara hàn fún ọ̀pọ̀ ènìyàn.
