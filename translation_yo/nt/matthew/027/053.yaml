id: MAT.27.53
reference: Matthew 27:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n jáde kúrò nínú àwọn ibojì lẹ́yìn àjíǹde rẹ̀[a], wọ́n wọ ìlú mímọ́ náà[b], wọ́n sì fara hàn fún ọ̀pọ̀ ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè sọ ọ́ lọ́nà tó dán mọ́rán pé: “Lẹ́yìn àjíǹde rẹ̀, wọ́n jáde kúrò nínú àwọn ibojì, wọ́n wọ ìlú mímọ́ náà, wọ́n sì fara hàn fún ọ̀pọ̀ ènìyàn.” Nínú èdè Gíríìkì, “lẹ́yìn àjíǹde rẹ̀” wà láàárín “kúrò nínú àwọn ibojì” àti “wọ́n wọ.”'
    reason: alternative_reading
  - marker: b
    text: “Ìlú mímọ́ náà” ń tọ́ka sí Jerúsálẹ́mù.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: nígbà tí wọ́n ... jáde
  rationale: Ọ̀rọ̀ aorist participle náà ní agbára àsìkò níbí; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì.
- source_word: μνημείων
  choice: àwọn ibojì
  rationale: μνημεῖον túmọ̀ sí ibi ìsìnkú tàbí ibojì; ‘àwọn ibojì’ bá àwọn ibi ìsìnkú tí a ṣí nínú ẹsẹ tó ṣáájú mu.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: lẹ́yìn àjíǹde rẹ̀
  rationale: μετά pẹ̀lú accusative ń tọ́ka sí àsìkò lẹ́yìn ohun kan; ἔγερσις níbí ni àjíǹde Jésù, ẹni tí ‘rẹ̀’ ń tọ́ka sí gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: εἰσῆλθον
  choice: wọ́n wọ
  rationale: Ìtumọ̀ ìtàn aorist tó rọrùn, tó sì jẹ́ Yorùbá àdánidá fún wíwọ inú ìlú.
- source_word: τὴν ἁγίαν πόλιν
  choice: ìlú mímọ́ náà
  rationale: Ó pa àpèjúwe Bíbélì mọ́ láì fi ‘Jerúsálẹ́mù’ kún ọ̀rọ̀ pàtàkì, bó tilẹ̀ jẹ́ pé ìlú náà ni a ń tọ́ka sí.
- source_word: ἐνεφανίσθησαν
  choice: wọ́n fara hàn
  rationale: Fọ́ọ̀mù náà ń sọ pé wọ́n di ẹni tí àwọn ẹlòmíràn lè rí; ‘fara hàn’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé jù lọ.
- source_word: πολλοῖς
  choice: fún ọ̀pọ̀ ènìyàn
  rationale: Dative plural náà kò sọ àwọn wo ní pàtó; fífi ‘ènìyàn’ kún un jẹ́ dandan fún ìtumọ̀ Yorùbá tó ṣe kedere, láì yí ìtumọ̀ padà.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘jáde kúrò nínú àwọn ibojì’ pẹ̀lú gbólóhùn àsìkò ‘lẹ́yìn àjíǹde rẹ̀’
  choice: A fi ‘lẹ́yìn àjíǹde rẹ̀’ mọ́ gbólóhùn participle tó sọ nípa jíjáde wọn, kí ọ̀rọ̀ náà lè fi hàn pé jíjáde wọn àti wíwọ ìlú ṣẹlẹ̀ lẹ́yìn àjíǹde Jésù.
  alternative: 'A lè tún ọ̀rọ̀ náà ṣe lọ́nà dídán bíi: ‘Lẹ́yìn àjíǹde rẹ̀, wọ́n jáde kúrò nínú àwọn ibojì, wọ́n wọ ìlú mímọ́ náà...’; àwọn kan sì lè ka participle náà ní ìbáṣepọ̀ tó rọ̀ pẹ̀lú ẹsẹ tó ṣáájú.'
  rationale: Èdè Gíríìkì gbé μετὰ τὴν ἔγερσιν αὐτοῦ lẹ́yìn ἐκ τῶν μνημείων nínú gbólóhùn participle, ṣáájú ọ̀rọ̀-ìṣe pàtàkì. Ìtumọ̀ náà pa ètò yìí àti ìṣòro ìtumọ̀ rẹ̀ mọ́ láì fi ìṣọ̀kan ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Ìṣètò gbólóhùn pa ìtẹ̀lé orísun Gíríìkì mọ́ láì mú Yorùbá di líle tàbí àjèjì.
