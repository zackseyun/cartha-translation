id: MAT.27.20
reference: Matthew 27:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn olórí àlùfáà àti àwọn àgbààgbà yí àwọn ọ̀pọ̀ ènìyàn lọ́kàn láti béèrè fún Bárábà, ṣùgbọ́n kí wọ́n pa Jésù run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n pa Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ náà fi ìyàtọ̀ sí ohun tó ń ṣẹlẹ̀ tẹ́lẹ̀ hàn, nítorí náà “Ṣùgbọ́n” bá ipò yìí mu ní Yorùbá.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí tọ́ka sí àwọn aṣáájú ẹgbẹ́ àwọn àlùfáà ní Jerúsálẹ́mù, kì í ṣe àlùfáà àgbà kan ṣoṣo.
- source_word: πρεσβύτεροι
  choice: àwọn àgbààgbà
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn olórí Júù tí a mọ̀ sí àgbààgbà.
- source_word: ἔπεισαν
  choice: yí ... lọ́kàn
  rationale: Gbólóhùn Yorùbá yìí sọ ìṣe títan àwọn ènìyàn lọ́kàn láti ṣe ohun kan ní ọ̀nà àdánidá.
- source_word: τοὺς ὄχλους
  choice: àwọn ọ̀pọ̀ ènìyàn
  rationale: Èyí fi ìtumọ̀ àwọn àwùjọ ènìyàn púpọ̀ tí wọ́n péjọ hàn ní Yorùbá tó ṣe kedere.
- source_word: ἵνα
  choice: láti ... kí wọ́n sì
  rationale: Lẹ́yìn “yí ... lọ́kàn,” ètò yìí sọ ohun tí wọ́n mú kí àwọn ènìyàn fẹ́ ṣe, ó sì so àwọn ìṣe méjèèjì pọ̀ lọ́nà àdánidá.
- source_word: αἰτήσωνται
  choice: béèrè fún
  rationale: Èyí sọ ìbéèrè fún ẹni tí wọ́n fẹ́ kí a dá sílẹ̀ ní kedere.
- source_word: Βαραββᾶν
  choice: Bárábà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìpè Yorùbá tó wọ́pọ̀.
- source_word: ἀπολέσωσιν
  choice: pa ... run
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú kí ẹnì kan ṣègbé tàbí kú; “pa ... run” pa agbára ọ̀rọ̀ Gíríìkì náà mọ́, láì sọ ọ́ di ọ̀rọ̀ ìdájọ́ pàtó.
- source_word: τὸν δὲ Ἰησοῦν
  choice: kí wọ́n sì pa Jésù run
  rationale: “sì” so ìṣe kejì pọ̀ mọ́ ti àkọ́kọ́, nígbà tí ìyàtọ̀ tó wà láàárín Bárábà tí wọ́n béèrè fún àti Jésù tí wọ́n fẹ́ pa run ṣì hàn gbangba.
theological_decisions:
- issue: Ìtumọ̀ ἀπολέσωσιν ní àyíká ìdájọ́ ikú
  choice: pa Jésù run
  alternative: pa Jésù
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ọ̀rọ̀ ìdájọ́ ikú pàtó lọ, ó sì lè túmọ̀ sí mímú ẹnì kan ṣègbé. A fi “pa ... run” sínú ọ̀rọ̀ àkọ́kọ́ láti pa agbára yẹn mọ́, a sì fi ìtumọ̀ tó ṣe kedere sí i ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. A fi àmì ohùn síbi tí ó bá yẹ, a sì lo “àwọn olórí àlùfáà” àti “àwọn àgbààgbà” fún àwọn ipò aṣáájú ìtàn náà.
