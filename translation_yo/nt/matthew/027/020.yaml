  to: Ṣùgbọ́n àwọn olórí àlùfáà àti àwọn àgbààgbà yí àwọn ọ̀pọ̀ ènìyàn lọ́kàn láti béèrè fún Bárábà, ṣùgbọ́n kí wọ́n pa Jésù run.[a]
