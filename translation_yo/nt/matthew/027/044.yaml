id: MAT.27.44
reference: Matthew 27:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: yo
  text: Bákan náà, àwọn ọlọ́ṣà tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀ pàápàá ń gàn án.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń sọ̀rọ̀ àbùkù sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Bẹ́ẹ̀ gẹ́gẹ́
  rationale: Ọ̀rọ̀ Gíríìkì yìí ń ṣiṣẹ́ bí ọ̀rọ̀-àpèjúwe níbí, ó sì ń tọ́ka sí irú ẹ̀gàn kan náà tí a ṣẹ̀ṣẹ̀ sọ; “Bẹ́ẹ̀ gẹ́gẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtumọ̀ náà hàn.
- source_word: καὶ
  choice: pàápàá
  rationale: 'Ní àyíká ọ̀rọ̀ yìí, καί ní agbára ìtẹnumọ́: àwọn ọlọ́ṣà náà pàápàá darapọ̀ mọ́ àwọn tó ń gàn Jésù.'
- source_word: λῃσταὶ
  choice: àwọn ọlọ́ṣà
  rationale: λῃστής sábà máa ń túmọ̀ sí olè ọlọ́ṣà tàbí afipámúni; “àwọn ọlọ́ṣà” ṣe kedere, kò sì fi ìtumọ̀ òṣèlú tí ọ̀rọ̀ Gíríìkì kò fi dandan hàn kún un.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe àti ìṣe tí a ṣe sí àwọn ọlọ́ṣà náà mọ́, ó sì fi hàn pé wọ́n wà lórí àgbélébùú lẹ́gbẹ̀ẹ́ Jésù.
- source_word: ὠνείδιζον
  choice: ń gàn
  rationale: Àkókò imperfect Gíríìkì fi ìṣe tó ń bá a lọ hàn. “Ń gàn” jẹ́ Yorùbá òde òní tó ṣe kedere fún ẹ̀gàn tàbí ọ̀rọ̀ àbùkù tí wọ́n ń sọ sí i.
- source_word: αὐτόν
  choice: án
  rationale: Arọ́pò-orúkọ olùgbà-ìṣe náà ń tọ́ka sí Jésù; “án” bá àkópọ̀ ohùn Yorùbá mu lẹ́yìn “gàn.”
theological_decisions:
- issue: Bóyá kí a mú ọ̀rọ̀ Mátíù bá ìtàn Lúùkù mu nípa ọ̀kan lára àwọn ọ̀daràn náà
  choice: A túmọ̀ ọ̀rọ̀ Mátíù gẹ́gẹ́ bí ó ṣe lo ọ̀pọ̀—“àwọn ọlọ́ṣà”—láìdín un kù.
  alternative: Kí a rọ ọ̀pọ̀ náà sílẹ̀ tàbí kí a fi ọ̀rọ̀ kún un láti yọ ìforígbárí tó dà bí ẹni pé ó wà pẹ̀lú ìtàn Lúùkù.
  rationale: Gíríìkì lo orúkọ ọ̀pọ̀ àti ọ̀rọ̀-ìṣe ọ̀pọ̀. Ìtumọ̀ gbọ́dọ̀ pa ẹ̀rí Mátíù àti ìfọ̀rọ̀wérọ̀ láàárín àwọn ìtàn Ìhìn Rere mọ́, kì í ṣe láti yanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ títọ́, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “àgbélébùú” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tó ti wọ́pọ̀.
