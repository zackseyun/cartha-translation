review_pass:
  verdict: revise
  source_fidelity: The draft preserves the plural subject, the passive identification of the robbers as crucified with Jesus, the emphatic force of καί, and the ongoing sense of ὠνείδιζον. It does not harmonize Matthew’s plural with Luke.
  naturalness: “Bẹ́ẹ̀ gẹ́gẹ́” is understandable but is not the most idiomatic Standard Yoruba equivalent of the Greek adverbial idiom here. “Bákan náà” is natural and clearly refers back to the preceding mockery. The remainder is clear, modern, and suitably respectful.
  terminology: “Àwọn ọlọ́ṣà,” “a kàn mọ́ àgbélébùú,” and “ń gàn án” are suitable renderings for robbers, crucified, and were reviling/insulting. The footnote offers a legitimate lexical alternative.
  issues:
  - severity: low
    issue: The opening expression “Bẹ́ẹ̀ gẹ́gẹ́” is somewhat awkward in this context.
    rationale: For τὸ δ’ αὐτὸ, functioning idiomatically as “likewise/in the same way,” Standard Yoruba normally uses “Bákan náà.” This is a stylistic-naturalness correction, not a change in meaning.
  revised_text: Bákan náà, àwọn ọlọ́ṣà tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀ pàápàá ń gàn án.[a]
  revised_footnotes:
