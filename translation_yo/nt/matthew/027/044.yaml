revisions:
- from: Bẹ́ẹ̀ gẹ́gẹ́, àwọn ọlọ́ṣà tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀ pàápàá ń gàn án.[a]
  to: Bákan náà, àwọn ọlọ́ṣà tí a kàn mọ́ àgbélébùú pẹ̀lú rẹ̀ pàápàá ń gàn án.[a]
  rationale: Replaced the less idiomatic opening phrase with “Bákan náà,” which naturally conveys that the robbers were treating Jesus in the same manner as those previously mentioned. All other wording and the existing footnote are retained because they faithfully represent the Greek and read naturally in Standard Yoruba.
  reviewer_model: gpt-5.6-terra
