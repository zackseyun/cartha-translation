id: MAT.27.24
reference: Matthew 27:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: yo
  text: Nígbà tí Pílátù rí i pé òun kò ṣàṣeyọrí ohunkóhun, ṣùgbọ́n pé ìdàrúdàpọ̀ ń ru sókè[a], ó mú omi, ó sì wẹ ọwọ́ rẹ̀ níwájú ogunlọ́gọ̀ náà, ó ní, “Èmi kò jẹ̀bi ẹ̀jẹ̀ yìí[b]; ẹ̀yin fúnra yín ni ẹ óò bójú tó o[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n pé ariwo ń ru sókè,” tàbí “pé ìdàrúdàpọ̀ ń ṣẹlẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “Èmi jẹ́ aláìlẹ́bi kúrò nínú ẹ̀jẹ̀ yìí.” Ọ̀rọ̀ náà túmọ̀ sí pé ẹni náà ní òun kò ní ojúṣe fún ikú ẹnì kan.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ẹ bójú tó o fúnra yín”; ní tààràtà, “ẹ̀yin ni ẹ óò rí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Nígbà tí Pílátù rí i pé
  rationale: Aorist participle náà ń mú ìgbésẹ̀ tó tẹ̀ lé e wọ inú ìtàn; ‘Nígbà tí ... rí i pé’ jẹ́ Yorùbá àdánidá láìfi ìtakora tí δέ kò fi dandan hàn kún un.
- source_word: οὐδὲν ὠφελεῖ
  choice: òun kò ṣàṣeyọrí ohunkóhun
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ ní pàtàkì sí pé ìgbìyànjú Pílátù kò ṣe èrè tàbí àǹfààní kankan; ìtumọ̀ yìí mú ẹni tí a ń sọ̀rọ̀ rẹ̀ àti àìṣeyọrí rẹ̀ ṣe kedere.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: ṣùgbọ́n pé rúkèrúdò ń bẹ̀rẹ̀ sí í ṣẹlẹ̀
  rationale: θόρυβος lè jẹ́ ariwo, ìdàrúdàpọ̀, tàbí rúkèrúdò. ‘Rúkèrúdò’ bá àyíká ìjọ ènìyàn tí ó ń ru sókè mu, ‘ń bẹ̀rẹ̀ sí í ṣẹlẹ̀’ sì pa ìlọsíwájú γίνεται mọ́.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: ó mú omi, ó sì wẹ ọwọ́ rẹ̀
  rationale: A ṣe àwọn participle àti main verb náà bí ọ̀wọ̀ ìṣe tó bá Yorùbá mu; ‘wẹ ọwọ́ rẹ̀’ pa ìṣe àmì náà mọ́.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: níwájú ogunlọ́gọ̀ náà
  rationale: Ó fi hàn pé Pílátù ṣe ìṣe náà ní gbangba ní ojú àwọn ènìyàn.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Èmi kò jẹ̀bi ẹ̀jẹ̀ yìí
  rationale: ‘Kò jẹ̀bi’ fi àìní ẹ̀bi tàbí ojúṣe hàn nínú ọ̀rọ̀ òfin; ‘ẹ̀jẹ̀ yìí’ sì tẹ̀ lé Gíríìkì láìfi ‘ọkùnrin yìí’ kún un.
- source_word: ὑμεῖς ὄψεσθε
  choice: ẹ̀yin fúnra yín ni ẹ óò rí sí i
  rationale: Future middle náà jẹ́ ọ̀rọ̀ àṣà tó túmọ̀ sí gbígbé ojúṣe náà; ‘ẹ̀yin fúnra yín’ pa ìtẹnumọ́ pronoun ὑμεῖς mọ́.
theological_decisions:
- issue: Ìkéde Pílátù pé òun kò jẹ̀bi
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ tí Pílátù fúnra rẹ̀ sọ láti sẹ́ ojúṣe, láìjẹ́rìí pé òótọ́ ni.
  alternative: 'Ìtumọ̀ líle koko lè jẹ́: ‘Èmi jẹ́ aláìlẹ́bi kúrò nínú ẹ̀jẹ̀ yìí.’'
  rationale: Èyí pa ìforígbárí ìwà àti ẹ̀kọ́ inú ìtàn mọ́; ìtumọ̀ náà kò dá Pílátù láre, bẹ́ẹ̀ ni kò dá a lẹ́bi ní àfikún sí ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; ‘ogunlọ́gọ̀’ àti ‘rúkèrúdò’ mú àyíká ìjọ ènìyàn àti ewu ìdàrúdàpọ̀ hàn.
