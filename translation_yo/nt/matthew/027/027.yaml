  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: yo
  text: Nígbà náà ni àwọn ọmọ ogun gómìnà mú Jésù lọ sínú prétóríọ̀mù[a], wọ́n sì kó gbogbo ẹgbẹ́ ọmọ ogun náà jọ yí i ká[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilé ìṣàkóso gómìnà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ibùgbé iṣẹ́ tàbí ibùdó ológun ti gómìnà Róòmù.
    reason: lexical_alternative
  - marker: b
    text: “Ẹgbẹ́ ọmọ ogun” túmọ̀ ọ̀rọ̀ ológun Róòmù kan; ó lè tọ́ka sí ẹ̀ka ọmọ ogun kan, láìfi dandan hàn pé gbogbo ọmọ ogun tí ó kún iye ẹ̀ka náà wà níbẹ̀ ní ti gidi.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìṣẹ̀lẹ̀ yìí hàn gẹ́gẹ́ bí ohun tó tẹ̀ lé èyí tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: àwọn ọmọ ogun ti gómìnà
  rationale: Èyí fi ìbáṣepọ̀ àwọn ọmọ ogun náà pẹ̀lú alákóso Róòmù hàn láìjẹ́ kí ó dà bí ẹni pé ohun ìní tirẹ̀ ni wọ́n.
- source_word: ἡγεμόνος
  choice: gómìnà
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí alákóso agbègbè lábẹ́ Róòmù; “gómìnà” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: παραλαβόντες
  choice: mú Jésù wọ
  rationale: Ó sọ pé wọ́n gba Jésù lọ pẹ̀lú wọn wọ ibi náà; ìtumọ̀ yìí jẹ́ àdánidá, ó sì bá ìṣe àbọ̀wọ̀n náà mu.
- source_word: εἰς τὸ πραιτώριον
  choice: wọ inú pẹ̀rẹ́tóríọ̀mù
  rationale: A pa orúkọ ibi ìṣàkóso Róòmù náà mọ́ ní fọ́ọ̀mù tí a yí sí ìkọ̀wé Yorùbá, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀.
- source_word: συνήγαγον
  choice: wọ́n sì kó ... jọ
  rationale: “Kó ... jọ” túmọ̀ sí pé wọ́n pe tàbí mú gbogbo ẹgbẹ́ náà péjọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
- source_word: ἐπ’ αὐτὸν
  choice: yí i ká
  rationale: Ní àkópọ̀ pẹ̀lú ọ̀rọ̀-ìṣe “kó jọ,” gbólóhùn náà ṣe àpèjúwe bí àwọn ọmọ ogun ṣe péjọ sí Jésù tí wọ́n sì yí i ká.
- source_word: ὅλην τὴν σπεῖραν
  choice: gbogbo ẹgbẹ́ ọmọ ogun náà
  rationale: Èyí pa ὅλην (“gbogbo”) mọ́, ó sì tú ọ̀rọ̀ ológun Róòmù náà sí èdè tí òǹkàwé Yorùbá òde òní lè lóye, láìsọ pé gbogbo ọmọ ẹgbẹ́ tí iye wọn pé dandan ló wà níbẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo “pẹ̀rẹ́tóríọ̀mù” láti pa àkànṣe ibi Róòmù mọ́, ṣùgbọ́n a ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀; “ẹgbẹ́ ọmọ ogun” sì rọrùn fún òǹkàwé ju yíya ọ̀rọ̀ Latin “cohort” wọlé lọ.
