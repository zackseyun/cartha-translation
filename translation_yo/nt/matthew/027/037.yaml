id: MAT.27.37
reference: Matthew 27:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: yo
  text: Wọ́n sì fi ẹ̀sùn tí wọ́n fi kàn án[a] sí òkè orí rẹ̀, tí a kọ pé, “Èyí ni Jésù[b], Ọba àwọn Júù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀sùn sí i.” Ọ̀rọ̀ Gíríìkì αἰτία ní ìtumọ̀ òfin níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ọba àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì Ἰουδαίων lè túmọ̀ sí “àwọn Júù” tàbí “àwọn ará Jùdíà,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: wọ́n sì gbé ... sí
  rationale: Ọ̀rọ̀ yìí sọ ìṣe fífi ohun kan sí ibi kan ní ti ara; ‘gbé ... sí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n fi àkọlé náà sí òkè orí Jésù.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: sí òkè orí rẹ̀
  rationale: ἐπάνω pẹ̀lú ọ̀rọ̀ oníjíbítì tọ́ka sí ipò lókè; ‘sí òkè orí rẹ̀’ ṣe kedere pé àkọlé náà wà lókè orí rẹ̀, kì í ṣe pé wọ́n gbé e lé orí rẹ̀.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: ẹ̀sùn tí wọ́n fi kàn án
  rationale: Nínú àyíká ìdájọ́, αἰτία túmọ̀ sí ẹ̀sùn tàbí ọ̀ràn tí a fi kan ẹni; yíyan yìí mú agbára òfin inú ọ̀rọ̀ náà hàn ní Yorùbá òde òní.
- source_word: γεγραμμένην
  choice: tí a kọ pé
  rationale: Ó fi hàn pé ọ̀rọ̀ ẹ̀sùn náà wà ní àkọsílẹ̀; ‘tí a kọ pé’ jẹ́ kedere, ó sì mú ọ̀rọ̀ inú àkọlé náà wọlé lọ́nà àdánidá.
- source_word: Οὗτός ἐστιν
  choice: Èyí ni
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ atọ́ka àti ọ̀rọ̀ ìṣọ̀kan náà.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: A lo àkọtọ̀ orúkọ tí ó ti fìdí múlẹ̀ ní Yorùbá.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: ‘Ọba’ pa oyè ọba mọ́, ‘àwọn Júù’ sì jẹ́ ìtumọ̀ tí ó wọ́pọ̀ jù lọ fún gbolohun ẹ̀sùn ìṣèlú yìí.
- source_word: Ἰουδαίων
  choice: àwọn Júù
  rationale: Nínú àkọlé ìkànmọ́ àgbélébùú yìí, ọ̀rọ̀ náà tọ́ka sí àwọn Júù gẹ́gẹ́ bí ènìyàn kan lábẹ́ ojú ìṣàkóso Róòmù; síbẹ̀, ìtumọ̀ ‘àwọn ará Jùdíà’ ṣeé ṣe ní ti ọ̀rọ̀.
theological_decisions:
- issue: Ọ̀rọ̀ òfin inú àkọlé ìkànmọ́ àgbélébùú
  choice: ẹ̀sùn tí wọ́n fi kàn án
  alternative: ẹ̀sùn sí i
  rationale: Yíyan náà pa ìtumọ̀ ìdájọ́ αἰτία mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ìtumọ̀ Ἰουδαίων nínú oyè ọba
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: ‘Àwọn Júù’ bá àyíká oyè ọba àti ẹ̀sùn ìṣèlú náà mu dáadáa; àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ agbègbè tí ọ̀rọ̀ Gíríìkì náà tún lè ní mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba; a pa ìtẹ̀sí òfin inú ẹ̀sùn náà àti àṣàyàn ìtumọ̀ Ἰουδαίων mọ́ nípasẹ̀ àwọn àkọsílẹ̀ ìsàlẹ̀.
