  source_fidelity: 'Ìtumọ̀ náà ń pa gbogbo àwọn ẹyọ Gíríìkì pàtàkì mọ́: ìṣe fífi ohun kan sí ipò lókè, ẹ̀sùn ní ìtumọ̀ òfin, ìkọ̀wé àkọlé náà, àti ọ̀rọ̀ àkọlé náà fúnra rẹ̀. Síbẹ̀, ‘gbé ẹ̀sùn ... sí òkè orí rẹ̀’ lè dún bí gbígbé ẹ̀sùn sókè, dípò fífi àkọlé ẹ̀sùn sí ipò kan; ‘fi ... sí’ túbọ̀ ṣàfihàn ἐπέθηκαν dáadáa nínú àyíká yìí.'
