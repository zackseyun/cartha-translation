id: MAT.27.57
reference: Matthew 27:57
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: yo
  text: Nígbà tí ó di alẹ́, ọkùnrin ọlọ́rọ̀ kan láti Arimatea wá, ẹni tí a ń pè ní Josẹfu; òun fúnra rẹ̀ pẹ̀lú ti di ọmọ-ẹ̀yìn Jesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti sọ ọ́ di ọmọ-ẹ̀yìn Jesu”; tàbí, “òun pẹ̀lú jẹ́ ọmọ-ẹ̀yìn Jesu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Nígbà tí ó di alẹ́
  rationale: Gbólóhùn olóhun-ìní yìí ń fi àkókò tuntun hàn nínú ìtàn. ‘Nígbà tí ó di alẹ́’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ pé alẹ́ ti dé mọ́ láìfi ọ̀rọ̀ àfikún sí i.
- source_word: ἦλθεν
  choice: wá
  rationale: Ọ̀rọ̀-ìṣe aorist yìí túmọ̀ sí pé ọkùnrin náà wá sí ibi tí ìtàn ń ṣẹlẹ̀; ‘wá’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì ṣe déédéé.
- source_word: ἄνθρωπος πλούσιος
  choice: ọkùnrin ọlọ́rọ̀ kan
  rationale: ‘Ọkùnrin ọlọ́rọ̀ kan’ sọ irú ẹni tí a ń mú wọ inú ìtàn ní kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: láti Arimatia
  rationale: ἀπό ń tọ́ka sí ibi tí ẹni náà ti wá; ‘láti Arimatia’ fi ìpilẹ̀ṣẹ̀ rẹ̀ hàn ní tààrà.
- source_word: τοὔνομα Ἰωσήφ
  choice: orúkọ rẹ̀ ń jẹ́ Josẹfu
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti dá ẹni kan mọ̀ nípa orúkọ rẹ̀.
- source_word: ὃς καὶ αὐτὸς
  choice: Òun fúnra rẹ̀ pẹ̀lú
  rationale: ‘Òun fúnra rẹ̀’ pa ìtẹnumọ́ αὐτός mọ́, ‘pẹ̀lú’ sì fi καί hàn pé Josẹfu náà wà lára àwọn ọmọ-ẹ̀yìn.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: ti di ọmọ-ẹ̀yìn Jesu
  rationale: Fífún μαθητεύω ní ìtumọ̀ pé ‘di ọmọ-ẹ̀yìn’ jẹ́ kó ṣe kedere pé Josẹfu ti wọ ipò ọmọ-ẹ̀yìn Jesu, láìfipá sọ ọ̀nà pàtó tí ó gbà di ọmọ-ẹ̀yìn.
theological_decisions:
- issue: Ìtumọ̀ ἐμαθητεύθη ní ìbáṣepọ̀ pẹ̀lú Jesu
  choice: ti di ọmọ-ẹ̀yìn Jesu
  alternative: a ti sọ ọ́ di ọmọ-ẹ̀yìn Jesu; tàbí, òun pẹ̀lú jẹ́ ọmọ-ẹ̀yìn Jesu
  rationale: Fọ́ọ̀mù passive náà lè tọ́ka sí dídá ẹni kan ṣe ọmọ-ẹ̀yìn tàbí sí wíwọ ẹni náà sínú ipò ọmọ-ẹ̀yìn. Àyànfẹ́ yìí pa ipò Josẹfu gẹ́gẹ́ bí ọmọ-ẹ̀yìn Jesu mọ́, láìyanjú àríyànjiyàn nípa ẹni tàbí ọ̀nà tí ó fi di ọmọ-ẹ̀yìn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé gbogbo. A ya ìdánimọ̀ Josẹfu àti gbólóhùn nípa jíjẹ́ ọmọ-ẹ̀yìn sí ọ̀rọ̀ méjì kí ìtumọ̀ má bà a rú, a sì fi àmì ohùn síbi tí ó bá yẹ.
