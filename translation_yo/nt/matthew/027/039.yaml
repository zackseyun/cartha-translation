  source_fidelity: Ìtumọ̀ náà pa ìṣe tí ń lọ lọ́wọ́ nínú àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́, ó sì tọ́ka sí àwọn ènìyàn tí ń kọjá. Síbẹ̀, “ń sọ̀rọ̀-òdì sí i” kò jẹ́ ọ̀nà Yorùbá tó rọrùn tàbí tó péye jù lọ fún ἐβλασφήμουν nínú àyíká yìí. “Ń bú u” jẹ́ ìtumọ̀ àdánidá, líle, tí ó sì lè ní ìtumọ̀ ìsọ̀rọ̀ àbùkù sí ènìyàn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà.
  naturalness: “Sọ̀rọ̀-òdì” ní àmì àsopọ̀ kò wọ́pọ̀ nínú Yorùbá ìgbàlódé, ó sì lè dà bí ìtumọ̀ tààrà. “Ń bú u” jẹ́ kedere àti àdánidá. Ṣíṣe “nígbà tí wọ́n ń mi orí wọn” tún so ìṣe kejì mọ́ ìṣe àkọ́kọ́ gẹ́gẹ́ bí participle ìbámu.
  terminology: “Bú” níbí ni a lò fún ọ̀rọ̀ àbùkù/reviling; kò yẹ kí a ní kó túmọ̀ sí ìsọ̀rọ̀ sí Ọlọ́run nìkan. Àlàyé ìsàlẹ̀ ń dá ìtumọ̀ míì, “ń sọ ọ̀rọ̀ àbùkù sí i,” sílẹ̀ láti ṣàlàyé ibú ìtumọ̀ ọ̀rọ̀ náà.
