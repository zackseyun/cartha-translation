  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: yo
  text: Àwọn tí ń kọjá sì ń bú u[a], nígbà tí wọ́n ń mi orí wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń sọ ọ̀rọ̀ àbùkù sí i.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbú tàbí sísọ ọ̀rọ̀ àbùkù sí ẹnì kan; kì í ṣe ọ̀rọ̀-òdì sí Ọlọ́run nìkan.
    reason: lexical_alternative
  - marker: b
    text: Èyí jẹ́ àmì ẹ̀gàn tàbí ìṣẹ̀sín; wo Sáàmù 22:7.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: Àwọn … sì
  rationale: Àpilẹ̀kọ pẹ̀lú participle náà ń tọ́ka sí ẹgbẹ́ àwọn ènìyàn, δέ sì jẹ́ àsopọ̀ onírẹ̀lẹ̀; “sì” bá ìṣàn ìtàn Yorùbá mu láì fi ìtakora líle kún un.
- source_word: παραπορευόμενοι
  choice: tí ń kọjá
  rationale: Ó fi àwọn ènìyàn tí wọ́n ń kọjá níbi náà hàn, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ἐβλασφήμουν
  choice: ń sọ̀rọ̀-òdì sí i
  rationale: Imperfect náà fi ìṣe tí ń bá a lọ hàn. “Sọ̀rọ̀-òdì sí” pa agbára ọ̀rọ̀ Gíríìkì mọ́ ju “ṣẹ̀sín” lọ, ṣùgbọ́n kò fi dandan túmọ̀ rẹ̀ sí ọ̀rọ̀ lòdì sí Ọlọ́run nìkan.
- source_word: αὐτὸν
  choice: sí i
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí ọ̀rọ̀-òdì náà dojú kọ.
- source_word: κινοῦντες
  choice: wọ́n sì ń mi
  rationale: Ìtumọ̀ yìí fi hàn pé àmì ẹ̀gàn náà ń ṣẹlẹ̀ ní àkókò kan náà pẹ̀lú ọ̀rọ̀-òdì wọn.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: orí wọn
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà mọ́ lọ́nà àdánidá ní Yorùbá, ó sì ṣàpèjúwe àmì ẹ̀gàn náà ní kedere.
theological_decisions:
- issue: Agbára ìtumọ̀ βλασφημέω nígbà tí ọ̀rọ̀ náà dojú kọ Jésù
  choice: ń sọ̀rọ̀-òdì sí i
  alternative: ń bú u
  rationale: Yíyan “sọ̀rọ̀-òdì sí” pa ọ̀rọ̀ líle ti Mátíù lò mọ́, láì pinnu fún òǹkàwé pé ọ̀rọ̀ náà gbọ́dọ̀ túmọ̀ sí ìsọ̀rọ̀ lòdì sí Ọlọ́run nìkan. Àlàyé ìsàlẹ̀ fi ìtumọ̀ míì tí ó ṣeé ṣe hàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó níyì, pẹ̀lú àmì ohùn ní kíkún. Ìtòlẹ́sẹẹsẹ gbolohun náà jẹ́ ti àdánidá ní Yorùbá, ó sì pa ìṣe méjèèjì tí ń lọ ní àkókò kan náà mọ́.
