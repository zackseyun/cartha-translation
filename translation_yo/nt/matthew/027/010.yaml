source:
  edition: SBLGNT
  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: yo
  text: wọ́n sì fi wọ́n ra pápá amọ̀kòkò[a], gẹ́gẹ́ bí Olúwa ti pàṣẹ fún mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì lò ọ̀rọ̀ náà ní ìtumọ̀ ‘fún ... fún’; ní àyíká yìí, ó túmọ̀ sí pé wọ́n fi àwọn owó náà ra pápá náà.
    reason: lexical_alternative
  - marker: b
    text: Mátíù pa ọ̀rọ̀ ẹni-kìíní “mi” mọ́ nínú àyọlò àsọtẹ́lẹ̀ yìí, dípò kí ó yí i padà láti bá àyíká ìtàn mu.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν
  choice: wọ́n sì fi wọ́n ra pápá
  rationale: Ní àyíká ọ̀rọ̀ yìí, fífi àwọn owó náà fún pápá túmọ̀ sí lílò wọ́n láti ra pápá náà. Èyí jẹ́ Yorùbá àdánidá, ó sì pa ìtọ́ka ọ̀pọ̀ inú αὐτά mọ́ nípasẹ̀ “wọ́n.”
- source_word: τοῦ κεραμέως
  choice: amọ̀kòkò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ń fi amọ̀ ṣe ìkòkò; “pápá amọ̀kòkò” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé pápá ẹni náà ni.
- source_word: καθὰ
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu pẹ̀lú ohun tí ó tẹ̀ lé e hàn, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: συνέταξέν
  choice: pàṣẹ fún
  rationale: συντάσσω lè túmọ̀ sí láti pàṣẹ, darí, tàbí kọ́ni ní ohun tí a ó ṣe. “Pàṣẹ fún” ṣàfihàn àṣẹ tó wà nínú ọ̀rọ̀ náà ní Yorùbá àdánidá.
- source_word: μοι
  choice: mi
  rationale: A pa ẹni-kìíní “mi” inú orísun Gíríìkì mọ́, láì mú un bá àyíká ìtàn mu nípasẹ̀ àtúnṣe.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος nínú àyíká yìí.
theological_decisions:
- issue: Ẹni tí ó ń sọ̀rọ̀ nínú àyọlò àsọtẹ́lẹ̀ náà
  choice: Pa “mi” ẹni-kìíní mọ́ gẹ́gẹ́ bí Gíríìkì ṣe ní i.
  alternative: Yí ọ̀rọ̀ náà padà kí ó bá àwọn olórí àlùfáà tàbí àyíká ìtàn mu.
  rationale: Orísun náà ní μοι (“fún mi”); pípa a mọ́ ń ṣọ́ ìṣòro àti ìfẹ̀sẹ̀mulẹ̀ inú àyọlò Mátíù láì yanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “amọ̀kòkò” fún oníṣẹ́ amọ̀ tó ń ṣe ìkòkò, àti “fi wọ́n ra” láti sọ ìlò àwọn owó náà ní Yorùbá àdánidá.
