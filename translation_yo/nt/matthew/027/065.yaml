id: MAT.27.65
reference: Matthew 27:65
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: yo
  text: Pílátù sọ fún wọn pé, “Ẹ ní ẹgbẹ́ ẹ̀ṣọ́ kan.[a] Ẹ lọ,[b] ẹ mú un dájú gẹ́gẹ́ bí ẹ ti mọ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ẹ mú ẹgbẹ́ ẹ̀ṣọ́ kan,” tàbí, bóyá, “Ẹ ní ẹgbẹ́ ẹ̀ṣọ́ tiyín.” Gíríìkì lè túmọ̀ sí pé Pílátù ń fún wọn ní ẹ̀ṣọ́, tàbí pé ó ń tọ́ka sí ẹ̀ṣọ́ tí wọ́n ti ní lárọwọ́tó.
    reason: alternative_reading
  - marker: b
    text: Tàbí “Ẹ lọ, ẹ mú un ní ààbò bí ẹ ti mọ̀.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη
  choice: sọ
  rationale: Ọ̀rọ̀ ìtàn tí ó wọ́pọ̀ fún fífi ohun tí ẹnì kan sọ hàn; ó bá φημί mu ní àyíká yìí.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó fi àwọn tí Pílátù ń bá sọ̀rọ̀ hàn gẹ́gẹ́ bí ẹni tí ọ̀rọ̀ náà tọ́ sí.
- source_word: Ἔχετε
  choice: Ẹ ní
  rationale: Ó tẹ̀ lé ìtumọ̀ ìpilẹ̀ ti ọ̀rọ̀ ìṣe ìsinsìnyí, ó sì pa àìdájú mọ́ nípa bóyá Pílátù ń fún wọn ní ẹ̀ṣọ́ tàbí ó ń tọ́ka sí èyí tí wọ́n ti ní.
- source_word: κουστωδίαν
  choice: ẹgbẹ́ ẹ̀ṣọ́ kan
  rationale: Ọ̀rọ̀ àyálò láti Latin custodia ń tọ́ka sí ẹ̀ṣọ́ tàbí ẹgbẹ́ àwọn olùṣọ́; ‘ẹgbẹ́ ẹ̀ṣọ́ kan’ ṣe kedere ní Yorùbá pé kì í ṣe olùṣọ́ ẹnì kan ṣoṣo dandan.
- source_word: ὑπάγετε
  choice: Ẹ lọ
  rationale: Àṣẹ láti kúrò lọ ṣe ohun tí a sọ; èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì ṣókí.
- source_word: ἀσφαλίσασθε
  choice: ẹ mú un ní ààbò
  rationale: Ó sọ ìṣe mímú ohun náà dúró láìléwu tàbí ní ìdábòbò; arọ́pò-orúkọ ‘un’ pa ohun tí a ń tọ́ka sí mọ́ gẹ́gẹ́ bí ó ti wà nínú Gíríìkì.
- source_word: ὡς οἴδατε
  choice: bí ẹ ti mọ̀
  rationale: Ó pa ìtumọ̀ gígùn náà mọ́—gẹ́gẹ́ bí ìmọ̀ tàbí ọgbọ́n tí wọ́n ní—láìfi ‘débi gbogbo agbára yín’ kún un.
theological_decisions:
- issue: Bóyá Ἔχετε κουστωδίαν túmọ̀ sí pé Pílátù fún wọn ní ẹ̀ṣọ́ Róòmù tàbí pé ó ń tọ́ka sí ẹ̀ṣọ́ tí wọ́n ti ní
  choice: “Ẹ ní ẹgbẹ́ ẹ̀ṣọ́ kan” nínú ọ̀rọ̀ pàtàkì
  alternative: “Ẹ mú ẹgbẹ́ ẹ̀ṣọ́ kan,” tàbí “Ẹ ní ẹgbẹ́ ẹ̀ṣọ́ tiyín.”
  rationale: Gíríìkì lè jẹ́ àṣẹ tàbí gbólóhùn ìròyìn. Ìtumọ̀ pàtàkì tẹ̀ lé ìtumọ̀ ọ̀rọ̀ náà ní tààrà, akọsilẹ̀ sì fi àwọn òye mìíràn hàn, kí a má bàa pinnu ọ̀ràn ìtàn tí ọ̀rọ̀ náà kò mú dájú.
translation_notes:
  register: Standard Yorùbá with natural honorific/plural imperatives and full tone marks. The diction is current and dignified. ‘Ẹgbẹ́ ẹ̀ṣọ́’ avoids implying that κουστωδία necessarily means one individual guard, while the footnote preserves the debated force of Ἔχετε.
