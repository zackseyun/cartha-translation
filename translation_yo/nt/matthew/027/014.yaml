id: MAT.27.14
reference: Matthew 27:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: yo
  text: Kò dá a lóhùn ní ọ̀rọ̀ kan pàápàá[a], débi pé ẹnu ya gómìnà náà gidigidi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò dá a lóhùn pẹ̀lú ọ̀rọ̀ kan ṣoṣo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gómìnà náà yà lẹ́nu gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: dá ... lóhùn
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ‘dáhùn’ ni èyí, ó sì pa agbára ọ̀rọ̀ Gíríìkì náà mọ́ láìfi àlàyé kún un.
- source_word: αὐτῷ
  choice: a
  rationale: Arọ́pò-orúkọ ẹni kẹta tó jẹ́ olùgbà ìṣe; nínú àyíká ọ̀rọ̀, ó tọ́ka sí Pílátù.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: àní ní ọ̀rọ̀ kan pàápàá
  rationale: Èyí mú ìtẹnumọ́ nínú οὐδὲ ἓν jáde, ó sì túmọ̀ ῥῆμα ní ìtumọ̀ rẹ̀ tó wọ́pọ̀, ‘ọ̀rọ̀,’ láìyí i sí ‘ẹ̀sùn’ tàbí ‘ọ̀ràn.’
- source_word: ὥστε
  choice: débi pé
  rationale: Ó fi àbájáde ìdákẹ́jẹ náà hàn ní Yorùbá àdánidá.
- source_word: θαυμάζειν
  choice: ẹnu ya ...
  rationale: ‘Ẹnu yà’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ àti tó ṣe kedere láti sọ pé ohun kan yà ẹnì kan lẹ́nu gidigidi.
- source_word: ἡγεμόνα
  choice: baálẹ̀
  rationale: Nínú àyíká ìṣàkóso Róòmù, ọ̀rọ̀ náà túmọ̀ sí gómìnà; ‘baálẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá Bíbélì tó ní iyì fún aláṣẹ agbègbè, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ‘gómìnà’ hàn láti mú ipò náà ṣe kedere.
- source_word: λίαν
  choice: gidigidi
  rationale: Ó pa ìtẹnumọ́ ìwọ̀n gíga nínú ọ̀rọ̀ Gíríìkì náà mọ́ ní Yorùbá tó rọrùn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. A fi àmì ohùn sí ibi tó yẹ. ‘Àní ... pàápàá’ ń gbé ìtẹnumọ́ àìdáhùn rárá jáde; ‘débi pé’ sì ń fi àbájáde hàn. Gbogbo àmì àlàyé ìsàlẹ̀ fara hàn nínú ọ̀rọ̀ àkọ́kọ́.
