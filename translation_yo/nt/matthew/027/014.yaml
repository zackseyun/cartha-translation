  to: Kò dá a lóhùn ní ọ̀rọ̀ kan pàápàá[a], débi pé ẹnu ya gómìnà náà gidigidi.[b]
  rationale: A yọ “Ṣùgbọ́n” kúrò láti má ṣe ṣàfikún ìyàtọ̀ tí Gíríìkì kò sọ. A lo “gómìnà” fún ἡγεμών láti fi ipò Róòmù Pílátù hàn dáadáa. Ìtúmọ̀ “ní ọ̀rọ̀ kan pàápàá” pa οὐδὲ ἓν ῥῆμα mọ́, “débi pé” sì ṣàfihàn àbájáde ὥστε.
