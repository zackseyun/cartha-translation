id: MAT.27.35
reference: Matthew 27:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n kàn án mọ́ àgbélébùú[a], wọ́n pín àwọn aṣọ rẹ̀ nípa ṣíṣe ìwọ̀n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, lọ́nà tó tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Nígbà tí wọ́n sì ti kàn án mọ́ àgbélébùú, wọ́n pín àwọn aṣọ rẹ̀, wọ́n sì ṣẹ́ ìwọ̀n.”'
    reason: Àṣàyàn ìtumọ̀ tó faramọ́ fọ́ọ̀mù orísun jù lọ fún σταυρώσαντες àti βάλλοντες κλῆρον; “ṣẹ́ ìwọ̀n” ni ṣíṣe ìwọ̀n láti pín ohun.
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Lẹ́yìn tí wọ́n kàn án mọ́ àgbélébùú
  rationale: Aorist participle náà tọ́ka sí ohun tí ó ṣẹlẹ̀ ṣáájú ìṣe pàtàkì náà. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹ̀síwájú àkókò mọ́.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: δὲ jẹ́ asopọ̀ aláìlágbára tó ń tẹ ìtàn náà síwájú; ìṣètò gbólóhùn Yorùbá ti ṣe iṣẹ́ rẹ̀ láìfi ọ̀rọ̀ àfikún tí kò pọndandan sí i.
- source_word: διεμερίσαντο
  choice: wọ́n pín ... láàárín ara wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pínpín tàbí fífún ẹnì kọ̀ọ̀kan ní ìpín; ‘láàárín ara wọn’ tún fi middle voice náà hàn lọ́nà àdánidá.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: aṣọ rẹ̀
  rationale: ἱμάτια ń tọ́ka sí aṣọ ní gbogbogbòò. ‘Aṣọ rẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́, tó ní iyì, tí kò sì fi ìtumọ̀ ‘aṣọ òde’ kún orísun.
- source_word: βάλλοντες κλῆρον
  choice: nípa dídìbò
  rationale: Participle náà ṣàlàyé ọ̀nà tí wọ́n gbà pín aṣọ náà. ‘Nípa dídìbò’ sọ ìbáṣepọ̀ yìí kedere, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ yíyan ìpín nípasẹ̀ lot.
theological_decisions:
- issue: Ìbáṣepọ̀ βάλλοντες κλῆρον pẹ̀lú διεμερίσαντο
  choice: 'A túmọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀nà tí wọ́n fi pín aṣọ náà: ‘wọ́n pín aṣọ rẹ̀ láàárín ara wọn nípa dídìbò.’'
  alternative: ‘wọ́n pín aṣọ rẹ̀ láàárín ara wọn, wọ́n ń dìbò’
  rationale: Participle Gíríìkì náà lè dúró gẹ́gẹ́ bí àlàyé tó bá ìṣe pàtàkì náà lọ, ṣùgbọ́n nínú àyíká yìí ó ṣàlàyé ọ̀nà pípín náà lọ́nà tó ṣeé ṣe jù. ‘Nípa’ mú ìbáṣepọ̀ yẹn hàn kedere láìfi ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. ‘Kàn án mọ́ àgbélébùú’ ni gbólóhùn Yorùbá tó ṣàlàyé σταυρόω kedere, ‘dídìbò’ sì ń sọ ìṣe lot ní ṣókí láìṣe àfikún àṣà tàbí ẹ̀kọ́ ìsìn.
