id: MAT.27.38
reference: Matthew 27:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: yo
  text: Nígbà náà ni wọ́n kan àwọn ọlọ́ṣà méjì mọ́ àgbélébùú pẹ̀lú rẹ̀[a], ọ̀kan ní ọwọ́ ọ̀tún rẹ̀, àti ọ̀kan ní ọwọ́ òsì rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ajínigbé ojú ọ̀nà”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ọlọ́ṣà oníjà, ní àwọn àyíká kan ó sì lè ní ìbáṣepọ̀ pẹ̀lú ìṣe àwọn ọlọ̀tẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó tọ́ka sí ìṣẹ̀lẹ̀ tó tẹ̀ lé e nínú ìtàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘lẹ́yìn náà’ ní Yorùbá.
- source_word: σταυροῦνται
  choice: wọ́n kan ... mọ́ àgbélébùú
  rationale: Ìṣe àìṣe sí olùṣe ni ọ̀rọ̀ Gíríìkì náà; gbólóhùn Yorùbá yìí sọ ìkànmọ́ àgbélébùú ní kedere, láìfi ohun tí ẹsẹ̀ náà kò sọ kún un.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Ó fi hàn pé wọ́n kan àwọn méjèèjì mọ́ àgbélébùú ní ìṣẹ̀lẹ̀ kan náà pẹ̀lú Jésù.
- source_word: δύο λῃσταί
  choice: àwọn ọlọ́ṣà méjì
  rationale: λῃστής lè túmọ̀ sí ọlọ́ṣà oníjà tàbí ajínigbé ojú ọ̀nà; ‘ọlọ́ṣà’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù, láìsọ pé wọ́n jẹ́ ọlọ̀tẹ̀ ní pàtó.
- source_word: εἷς ἐκ δεξιῶν
  choice: ọ̀kan ní ọwọ́ ọ̀tún rẹ̀
  rationale: Ìtumọ̀ rẹ̀ jẹ́ ipò ẹni kan ní ẹ̀gbẹ́ ọ̀tún Jésù; fífi ‘rẹ̀’ kún un mú ìtọ́kasí náà ṣe kedere ní Yorùbá.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: àti ọ̀kan ní ọwọ́ òsì rẹ̀
  rationale: Ó fi ẹni kejì sí ẹ̀gbẹ́ òsì, ní ìyàtọ̀ sí ẹni tó wà ní ọ̀tún.
theological_decisions:
- issue: Ìdánimọ̀ àwọn λῃσταί
  choice: àwọn ọlọ́ṣà
  alternative: àwọn ajínigbé ojú ọ̀nà; àwọn ọlọ̀tẹ̀
  rationale: Ọ̀rọ̀ náà sábà máa ń tọ́ka sí àwọn ọlọ́ṣà oníjà tàbí àwọn ajínigbé ojú ọ̀nà, ó sì lè ní ìbáṣepọ̀ pẹ̀lú ìṣọ̀tẹ̀ ní àwọn àyíká kan. Síbẹ̀, ẹsẹ̀ yìí fúnra rẹ̀ kò sọ pé ọlọ̀tẹ̀ ni wọ́n, nítorí náà a kò mú ìtumọ̀ òṣèlú tóóró wọ inú rẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ọ̀nà tó bójú mu, tó níyì, tí òǹkàwé òde òní sì lè lóye. A lo ‘kan ... mọ́ àgbélébùú’ gẹ́gẹ́ bí ọ̀nà àdánidá fún ìṣe ìkànmọ́ àgbélébùú.
