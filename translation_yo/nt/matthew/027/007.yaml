source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: yo
  text: Nítorí náà, lẹ́yìn tí wọ́n gbìmọ̀ pọ̀, wọ́n fi àwọn owó náà[a] ra Pápá Amọ̀kòkò gẹ́gẹ́ bí ibi ìsìnkú fún àwọn àjèjì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀-tààrà, ‘láti inú wọn’; èyí ń tọ́ka sí àwọn owó fàdákà tí a mẹ́nu kàn ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘àwọn àlejò’ tàbí ‘àwọn tí kì í ṣe ọmọ ìbílẹ̀ ibẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: lẹ́yìn tí wọ́n gbìmọ̀ pọ̀
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀ náà, ‘nígbà tí wọ́n ti gbìmọ̀,’ jáde ní Yorùbá àdánidá, ó sì pa èrò ìfọ̀rọ̀wérọ̀ àti ìpinnu papọ̀ mọ́.
- source_word: δὲ
  choice: Nítorí náà
  rationale: Níhìn-ín δέ ń tẹ ìtàn náà síwájú, ó sì so ìgbésẹ̀ yìí mọ́ ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀; kì í ṣe àmì àtakò líle.
- source_word: ἠγόρασαν
  choice: wọ́n ... ra
  rationale: Ìtumọ̀ tààrà àti àdánidá fún aorist active indicative ti ἀγοράζω ni ‘wọ́n ra.’
- source_word: ἐξ αὐτῶν
  choice: fi àwọn owó náà
  rationale: Gíríìkì sọ ní tààrà pé ‘láti inú wọn’; ọ̀rọ̀ arọ́pò náà tọ́ka sí àwọn owó fàdákà inú àyíká ọ̀rọ̀ tó ṣáájú. ‘Fi àwọn owó náà’ jẹ́ Yorùbá tó ṣe kedere, tó sì bá lílo ohun gẹ́gẹ́ bí owó ìrà mu.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Pápá Amọ̀kòkò
  rationale: Ó túmọ̀ gbólóhùn genitive náà ní ṣókí, bí orúkọ ibi tí ìtàn náà dá mọ̀.
- source_word: εἰς ταφὴν
  choice: láti máa sin ... sí
  rationale: Ó fi ète tí wọ́n fi ra pápá náà hàn ní Yorùbá àdánidá, ìyẹn ibi ìsìnkú.
- source_word: τοῖς ξένοις
  choice: àwọn àjèjì
  rationale: Ó pa ìtumọ̀ àwọn tí kì í ṣe ọmọ ìbílẹ̀ tàbí olùgbé ibẹ̀ mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
theological_decisions:
- issue: Ohun tí αὐτῶν ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí ‘àwọn owó náà,’ ìyẹn àwọn owó fàdákà tí a mẹ́nu kàn ní àyíká ọ̀rọ̀ tó ṣáájú.
  alternative: A lè túmọ̀ ọ́ ní ọ̀rọ̀-tààrà sí ‘láti inú wọn,’ ṣùgbọ́n ìyẹn kò ṣe kedere tó ní Yorùbá.
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ fi hàn pé ọ̀rọ̀ arọ́pò náà ń tọ́ka sí owó fàdákà. Ìtumọ̀ yìí mú un ṣe kedere láì yí èrò orísun padà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. ‘Pápá Amọ̀kòkò’ ni a lò gẹ́gẹ́ bí orúkọ ibi, ‘gbìmọ̀ pọ̀’ sì mú ìfọ̀rọ̀wérọ̀ wọn hàn.
