  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: yo
  text: Àwọn ibojì sì ṣí sílẹ̀, a sì jí ọ̀pọ̀ ara àwọn ẹni mímọ́ tí wọ́n ti sùn[a] dìde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sùn” níbí jẹ́ àkànlò èdè tí a sábà máa ń lò fún “kú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tí ó wọ́pọ̀ ní Yorùbá; ó pa ìṣọ̀kan àwọn gbólóhùn mọ́ láì fi ìtumọ̀ àkókò kún un.
- source_word: τὰ μνημεῖα
  choice: àwọn ibojì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ibi ìsìnkú; “àwọn ibojì” jẹ́ èdè Yorùbá àdánidá, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἀνεῴχθησαν
  choice: ṣí sílẹ̀
  rationale: Ó fi ìṣe aláìlórúkọ hàn ní ọ̀nà àdánidá ní Yorùbá, láì sọ ohun tàbí ẹni tí ó ṣí wọn.
- source_word: πολλὰ σώματα
  choice: ọ̀pọ̀ ara
  rationale: “Ara” pa ìtumọ̀ σῶμα mọ́ láì lo ọ̀rọ̀ líle bí “òkú,” èyí tí yóò jẹ́ àlàyé àfikún.
- source_word: τῶν κεκοιμημένων
  choice: tí wọ́n ti sùn
  rationale: Ó pa àkànlò-èdè oorun fún ikú mọ́, gẹ́gẹ́ bí Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń mú ìtumọ̀ rẹ̀ ṣe kedere.
- source_word: ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún àwọn ènìyàn tí a yà sí mímọ́ fún Ọlọ́run, láì fi ìdánimọ̀ míì kún ọ̀rọ̀ náà.
- source_word: ἠγέρθησαν
  choice: a jí ... dìde
  rationale: Ìtumọ̀ aláìlórúkọ yìí pa èrò jíjí dìde kúrò nínú ikú mọ́, ṣùgbọ́n kò fi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó le ju Gíríìkì lọ kún un.
theological_decisions:
- issue: Irú jíjí dìde tí ἠγέρθησαν ń tọ́ka sí
  choice: a jí ... dìde
  alternative: wọ́n jíǹde kúrò nínú òkú / a sọ wọ́n jíǹde
  rationale: “A jí ... dìde” dúró nítòsí ọ̀rọ̀ Gíríìkì, ó sì yàgò fún pípa ìbéèrè náà mọ́ bóyá jíjí dìde yìí jẹ́ àjíǹde ayérayé tàbí ìpadà sí ìyè fún ìgbà díẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A pa àkànlò-èdè “sùn” mọ́, a sì lo ìṣe aláìlórúkọ “a jí ... dìde” láti fara mọ́ ìṣe aláìlórúkọ inú Gíríìkì. Àmì ohùn ni a fi sí ibi tí ó yẹ.
