id: MAT.27.17
reference: Matthew 27:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: yo
  text: 'Nítorí náà, nígbà tí wọ́n ti péjọ, Pílátù bi wọ́n pé, “Èwo ni ẹ fẹ́ kí n dá sílẹ̀ fún yín: Jésù Bárábà[a], tàbí Jésù tí à ń pè ní Mèsáyà[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “Bárábà” nìkan dípò “Jésù Bárábà.”
    reason: textual_variant
  - marker: b
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Christos; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: nígbà tí wọ́n péjọ
  rationale: Ó fi ìṣẹ̀lẹ̀ àkókò hàn pé àwọn ènìyàn náà ti péjọ kí Pílátù tó béèrè; ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa agbára àsopọ̀ àti ìtẹ̀síwájú ìtàn mọ́.
- source_word: Τίνα
  choice: Èwo
  rationale: Ó bá yíyan láàárín ẹni méjì mu, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: θέλετε
  choice: ẹ fẹ́
  rationale: Ó sọ ìfẹ́ tàbí ààyò àwọn olùgbọ́ ní èdè Yorùbá òde òní.
- source_word: ἀπολύσω
  choice: kí n dá sílẹ̀ fún yín
  rationale: Nínú ọ̀rọ̀ ìdájọ́, ó túmọ̀ sí fífi ẹlẹ́wọ̀n sílẹ̀, kì í ṣe dídárí ẹ̀ṣẹ̀ jì.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Jésù Bárábà
  rationale: A tẹ̀ lé ẹ̀rí inú SBLGNT tí ó ní Ἰησοῦν, kí ìfiwéra àwọn ọkùnrin méjì tí orúkọ wọn ń jẹ́ Jésù lè dúró.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Jésù tí à ń pè ní Mèsáyà
  rationale: λεγόμενον ni ‘tí à ń pè ní,’ χριστός sì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà ‘Mèsáyà’ ni a lò.
theological_decisions:
- issue: Ìtumọ̀ χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: χριστός jẹ́ oyè nínú gbólóhùn ‘tí à ń pè ní,’ kì í ṣe apá orúkọ lasan; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́.
- issue: Ṣíṣàfikún ‘Jésù’ ṣáájú Bárábà
  choice: A fi ‘Jésù Bárábà’ sínú àkọọ́lẹ̀ pàtàkì
  alternative: Bárábà nìkan
  rationale: SBLGNT tí a pèsè ní Ἰησοῦν ṣáájú Βαραββᾶν; a fi ẹ̀dà mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ó jẹ́ èdè òde òní, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí αὐτοῖς àti θέλετε ṣe fi hàn.
