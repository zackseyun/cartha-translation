id: MAT.27.31
reference: Matthew 27:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: yo
  text: Nígbà tí wọ́n sì ti fi í ṣe ẹlẹ́yà, wọ́n bọ́ aṣọ òde náà[a] kúrò lára rẹ̀, wọ́n sì tún wọ aṣọ tirẹ̀ fún un. Wọ́n sì mú un lọ láti kàn án mọ́ àgbélébùú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀wù.” Ọ̀rọ̀ Gíríìkì χλαμύς ń tọ́ka sí aṣọ òde; níhìn-ín, ó jẹ́ aṣọ tí wọ́n wọ Jésù láti fi ṣe yẹ̀yẹ́ pé ó jẹ́ ọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: fi í ṣe ẹlẹ́yà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ẹnì kan ṣe yẹ̀yẹ́ tàbí ẹlẹ́yà lọ́nà ìkà. ‘Fi í ṣe ẹlẹ́yà’ jẹ́ èdè Yorùbá àdánidá tó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: χλαμύδα
  choice: ẹ̀wù àwọ̀lékè
  rationale: χλαμύς jẹ́ aṣọ òde tí a máa ń wọ lókè aṣọ mìíràn, nígbà mìíràn aṣọ ọmọ ogun tàbí aṣọ ọlọ́lá. ‘Ẹ̀wù àwọ̀lékè’ kò sọ ju ohun tí ọ̀rọ̀ náà túmọ̀ sí lọ, ó sì bá ọ̀rọ̀ aṣọ ọba èké nínú àyíká ẹsẹ náà mu.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: wọ́n bọ́ ẹ̀wù àwọ̀lékè náà kúrò lára rẹ̀
  rationale: ἐκδύω ní agbára ìtumọ̀ bí bíbọ aṣọ kúrò lára ẹni. Ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: wọ́n sì tún wọ aṣọ tirẹ̀ fún un
  rationale: Ìtumọ̀ náà pa ìyàtọ̀ tó wà láàárín ẹ̀wù àwọ̀lékè tí wọ́n fi ṣe yẹ̀yẹ́ àti aṣọ Jesu fúnra rẹ̀ mọ́. ‘Tún’ fi hàn pé wọ́n dá aṣọ rẹ̀ padà sí i láìfi ohun tuntun kún ọ̀rọ̀ náà.
- source_word: ἀπήγαγον
  choice: wọ́n mú un lọ
  rationale: ἀπάγω túmọ̀ sí mímú tàbí ṣíṣe amọ̀nà ẹnì kan kúrò níbì kan. Nínú àyíká ẹlẹ́wọ̀n, ‘mú un lọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tó sì bójú mu.
- source_word: εἰς τὸ σταυρῶσαι
  choice: láti kàn án mọ́ àgbélébùú
  rationale: Ẹ̀ka ọ̀rọ̀ εἰς tó tẹ̀ lé infinitive fi ète hàn. ‘Láti kàn án mọ́ àgbélébùú’ sọ ète náà ní tààràtà, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún ìkànmọ́ àgbélébùú.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tó ti yẹ. A yà gbólóhùn ìkẹyìn sọ́tọ̀ díẹ̀ fún ìṣàn ọ̀rọ̀ àdánidá, láìyí ìtẹ̀síwájú ìṣẹ̀lẹ̀ inú Gíríìkì padà.
