id: MAT.27.11
reference: Matthew 27:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: yo
  text: Jésù dúró níwájú gómìnà náà, gómìnà náà sì béèrè lọ́wọ́ rẹ̀ pé, “Ṣé ìwọ ni Ọba àwọn Júù?”[b] Jésù sì wí pé, “Ìwọ ló sọ bẹ́ẹ̀.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ èsì Jésù sí, “Ìwọ ni o sọ ọ́,” tàbí, “Ó rí gẹ́gẹ́ bí o ti sọ.” Èsì náà kúkúrú, kò sì pé ní Gíríìkì.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ “àwọn Júù” sí “àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn Júù lápapọ̀ tàbí, ní àwọn àyíká kan, sí àwọn ará Jùdíà ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστάθη
  choice: dúró
  rationale: Ọ̀rọ̀ yìí sọ pé Jésù dúró níwájú alákòóso; ‘dúró’ jẹ́ èdè Yorùbá àdánidá, kò sì fi kún un pé ẹnì kan mú un dúró.
- source_word: ἔμπροσθεν
  choice: níwájú
  rationale: Ó ṣàfihàn ipò Jésù níwájú ẹni tó ń ṣe ìdájọ́ lọ́nà ṣókí àti àdánidá.
- source_word: ἡγεμών
  choice: baálẹ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí alákòóso Róòmù. ‘Baálẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye fún ẹni tó ń ṣàkóso agbègbè, bí ó tilẹ̀ jẹ́ pé ‘gómìnà’ tún ṣeé lò.
- source_word: ἐπηρώτησεν
  choice: béèrè lọ́wọ́ rẹ̀
  rationale: Ó mú ìbéèrè alákòóso náà jáde ní Yorùbá tó rọrùn, láìfi agbára ìfọ̀rọ̀wánilẹ́nuwò tí ọ̀rọ̀ Gíríìkì kò fi dandan hàn kún un.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: Èyí ni ọ̀nà àdánidá àti èyí tí a mọ̀ jù lọ láti sọ oyè ìṣèlú-ẹ̀yà náà; ‘àwọn ará Jùdíà’ ṣì jẹ́ àṣàyàn ìtumọ̀ ọ̀rọ̀ náà.
- source_word: ἔφη
  choice: wí pé
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣáájú èsì Jésù ní tààrà, láìfi ìtumọ̀ míì kún un.
- source_word: Σὺ λέγεις
  choice: Ìwọ ni ó sọ bẹ́ẹ̀
  rationale: Gbólóhùn yìí pa kúkúrú àti àìsọ̀rọ̀-pípé Gíríìkì mọ́; kò sọ ọ́ di ìjẹ́wọ́ tààrà tàbí ìkọ̀sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ èsì Jésù, Σὺ λέγεις
  choice: “Ìwọ ni ó sọ bẹ́ẹ̀.”
  alternative: “Ó rí gẹ́gẹ́ bí o ti sọ,” tàbí “Ìwọ ló sọ ọ́.”
  rationale: 'Gíríìkì jẹ́ èsì kúkúrú tó ní ìdíwọ̀n: Jésù kò sẹ́ oyè náà ní tààrà, ṣùgbọ́n kò tún gba gbogbo bí alákòóso ṣe gbé e kalẹ̀ ní ọ̀nà ìṣèlú láìsí àlàyé. Ìtumọ̀ náà pa ìfẹ̀sẹ̀mulẹ̀ tí kò péye yìí mọ́.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘baálẹ̀’ fún alákòóso Róòmù nítorí ó jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, bó tilẹ̀ jẹ́ pé ‘gómìnà’ lè jẹ́ kedere sí àwọn òǹkàwé kan.
