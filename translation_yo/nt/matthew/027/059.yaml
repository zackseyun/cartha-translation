translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A yan “òkú náà” dípò “ara náà” nítorí pé ó jẹ́ àdánidá jù lọ ní àyíká ìsìnkú, ṣùgbọ́n a kò fi “òkú Jésù” tàbí “ara rẹ̀” kún un, kí a má bàa ṣe àlàyé ju ọ̀rọ̀ Gíríìkì lọ. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
