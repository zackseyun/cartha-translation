source:
  edition: SBLGNT
  text: καὶ λαβὼν τὸ σῶμα ὁ Ἰωσὴφ ἐνετύλιξεν ⸀αὐτὸ σινδόνι καθαρᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: yo
  text: Jósẹ́fù sì gbé òkú náà, ó sì fi aṣọ ọ̀gbọ̀ mímọ́[a] dì í[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ ọ̀gbọ̀ ìsìnkú mímọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí aṣọ ọ̀gbọ̀ tí a fi ń dì òkú.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gírámà Gíríìkì, arọ́pò-orúkọ náà ń tọ́ka sí “òkú náà.” Ní Yorùbá, “í” kò fi ìyàtọ̀ hàn láàárín “òun” ẹni náà àti “ara” rẹ̀.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: λαβὼν
  choice: gbé
  rationale: Aorist participle náà tọ́ka sí ohun tí Jósẹ́fù ṣe ṣáájú ìṣe pàtàkì náà. “Gbé” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún gbígbé òkú náà, ó sì yẹra fún ìtumọ̀ líle ti “mú.”
- source_word: σῶμα
  choice: òkú náà
  rationale: Ní àyíká ìsìnkú yìí, “òkú” ni Yorùbá àdánidá fún ara ẹni tí ó ti kú. Atọ́ka “náà” pa ìtumọ̀ article Gíríìkì mọ́, láìfi ohun-ìní tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: ἐνετύλιξεν
  choice: fi ... dì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti fi aṣọ yí ohun kan ká tàbí dì í. “Fi aṣọ ... dì” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá àyíká ìsìnkú mu.
- source_word: αὐτὸ
  choice: í
  rationale: Arọ́pò-orúkọ Gíríìkì jẹ́ neuter, ó sì ń tọ́ka padà sí σῶμα. Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ yìí; “í” lè tọ́ka sí òkú náà tàbí ẹni náà láìfi ìyàtọ̀ tí Gíríìkì kò tẹnumọ́ kún un.
- source_word: σινδόνι
  choice: aṣọ ọ̀gbọ̀
  rationale: σινδών jẹ́ aṣọ tí a fi ọ̀gbọ̀ ṣe, tí a sì lè lò gẹ́gẹ́ bí aṣọ ìsìnkú. “Aṣọ ọ̀gbọ̀” jẹ́ kedere, ó sì yẹra fún fífi ìtumọ̀ pàtó “aṣọ ìsìnkú” sínú ọ̀rọ̀ pàtàkì.
- source_word: καθαρᾷ
  choice: mímọ́
  rationale: Nínú àyíká yìí, καθαρός ń ṣàpèjúwe aṣọ náà gẹ́gẹ́ bí èyí tí kò ní ẹ̀gbin. “Mímọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ ìwà tàbí ẹ̀sìn ní àwọn àyíká mìíràn.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: Jósẹ́fù sì
  rationale: Fífi “sì” sí ẹ̀yìn olùṣe jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìṣàn ìtàn καί mọ́ láìjẹ́ kí gbólóhùn náà dà bí àdàkọ èdè Gẹ̀ẹ́sì.
