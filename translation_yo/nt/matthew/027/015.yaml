  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: yo
  text: Ní àjọ̀dún náà[a], ó jẹ́ àṣà fún gómìnà láti dá ẹlẹ́wọ̀n kan sílẹ̀ fún ọ̀pọ̀ ènìyàn, ẹni tí wọ́n bá fẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àsè náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Ní àkókò àjọ̀dún náà
  rationale: Ọ̀rọ̀ náà tọ́ka sí àkókò àjọ̀dún pàtó kan; “ní àkókò” fi ìtumọ̀ temporal κατά hàn, “náà” sì bá article inú Gíríìkì àti àyíká Ìrékọjá mu. A kò fi δέ ṣe “ní báyìí,” nítorí pé ó kan so ìtàn náà pọ̀ ní ọ̀nà fẹ́ẹ́rẹ́.
- source_word: εἰώθει
  choice: máa ń
  rationale: Àkójọpọ̀ “máa ń” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe tí ó jẹ́ àṣà tàbí tí a sábà máa ń ṣe ní àkókò àtijọ́.
- source_word: ὁ ἡγεμὼν
  choice: gómìnà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí alákòóso ìgbèríko Róòmù; “gómìnà” ṣe kedere fún òǹkàwé òde òní.
- source_word: ἀπολύειν
  choice: dá ... sílẹ̀
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún yíyọ ẹnì kan kúrò ní ìdè tàbí àtìmọ́lé.
- source_word: ἕνα ... δέσμιον
  choice: ẹlẹ́wọ̀n kan
  rationale: Ó pa iye ẹni kan mọ́, ó sì ṣe kedere pé ẹni tí ó wà ní àhámọ́ ni.
- source_word: τῷ ὄχλῳ
  choice: fún ọ̀pọ̀ ènìyàn ... fún wọn
  rationale: “Ọ̀pọ̀ ènìyàn” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìjọ ènìyàn náà; “fún wọn” fi hàn pé ìdásílẹ̀ náà jẹ́ gẹ́gẹ́ bí àṣàyàn wọn.
- source_word: ὃν ἤθελον
  choice: tí ọ̀pọ̀ ènìyàn bá fẹ́
  rationale: Ìtumọ̀ náà ni pé àwọn ènìyàn ló yan ẹni tí a ó dá sílẹ̀; “bá fẹ́” jẹ́ àdánidá nínú gbólóhùn tí ó túmọ̀ sí ẹni yòówù tí wọ́n bá yàn.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “máa ń” láti fi ìṣe àṣà hàn, láìfi ọ̀rọ̀ àsopọ̀ tí kò lágbára sí i ní ìbẹ̀rẹ̀ ẹsẹ.
