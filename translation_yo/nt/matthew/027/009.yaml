id: MAT.27.9
reference: Matthew 27:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: yo
  text: Nígbà náà ni ohun tí a sọ nípasẹ̀ Jeremáyà wòlíì náà mú ṣẹ[a], pé, “Wọ́n sì mú ọgbọ̀n owó fàdákà náà, iye owó ẹni tí a ti díyelé[b], ẹni tí àwọn kan nínú àwọn ọmọ Ísírẹ́lì díyelé.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mátíù sọ ọ̀rọ̀ àsọtẹ́lẹ̀ yìí sí Jeremáyà. Ṣùgbọ́n ọ̀rọ̀ náà jọ Sekaráyà 11:12–13 jù lọ. Àwọn olùtumọ̀ ṣàlàyé èyí ní ọ̀nà ọ̀tọ̀ọ̀tọ̀: àwọn kan ka a sí àkójọpọ̀ àwọn ọ̀rọ̀ àsọtẹ́lẹ̀; àwọn mìíràn ka a sí ìtọ́kasí sí àkójọpọ̀ ìwé àwọn wòlíì tí Jeremáyà dúró fún; àwọn mìíràn sì ka a sí ìṣòro kan nínú ìtan ìtankálẹ̀ àwọn àfọwọ́kọ.'
    reason: textual_variant
  - marker: b
    text: Tàbí, “láti ọ̀dọ̀ àwọn ọmọ Ísírẹ́lì.” Gbólóhùn Gíríìkì náà ṣòro láti túmọ̀; “àwọn kan nínú àwọn ọmọ Ísírẹ́lì” ń tẹ̀lé ìtumọ̀ partitive tí ó ṣeé ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó fi ìtẹ̀síwájú àkókò nínú ìtàn hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἐπληρώθη τὸ ῥηθὲν
  choice: ohun tí a sọ ... ṣẹ
  rationale: Ó pa àpẹẹrẹ ọ̀rọ̀ ìmúṣẹ Mátíù mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: nípasẹ̀ Jeremáyà wòlíì
  rationale: “Nípasẹ̀” fi iṣẹ́ Jeremáyà gẹ́gẹ́ bí alárinà ọ̀rọ̀ àsọtẹ́lẹ̀ hàn, bí διά pẹ̀lú genitive ṣe túmọ̀ sí níhìn-ín.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ọgbọ̀n owó fàdákà náà
  rationale: Ó tọ́ka sí àwọn ẹyọ owó tí a fi fàdákà ṣe, kì í ṣe fàdákà lásán.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: iye owó ẹni tí a ti díyelé
  rationale: “Iye owó” bá ọ̀rọ̀ ìṣòwò mu, “díyelé” sì pa ìtumọ̀ perfect passive ti τετιμημένου mọ́.
- source_word: ὃν ἐτιμήσαντο
  choice: ẹni tí wọ́n díyelé
  rationale: Àtúnsọ gbòǹgbò τιμάω nínú Gíríìkì ni a tún fi “díyelé” hàn fún ìṣọ̀kan ọ̀rọ̀.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: lára àwọn ọmọ Ísírẹ́lì
  rationale: Ó fi ìtumọ̀ partitive tó ṣeé ṣe hàn láìfi ohun tí kò sí nínú ọ̀rọ̀ kún un; àlàyé ìtumọ̀ míì wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Mátíù pe Jeremáyà ní orísun ọ̀rọ̀ àsọtẹ́lẹ̀, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà jọ Sekaráyà 11:12–13 jù lọ.
  choice: Pa “Jeremáyà wòlíì” mọ́ nínú ọ̀rọ̀ pàtàkì láìṣe ìbámu rẹ̀ pẹ̀lú Sekaráyà.
  alternative: Rọ́pò Jeremáyà pẹ̀lú Sekaráyà, tàbí sọ pé ó jẹ́ àkójọpọ̀ ọ̀rọ̀ àwọn wòlíì.
  rationale: Ọ̀rọ̀ Gíríìkì tí a ní sọ Jeremáyà ní kedere; ìtumọ̀ kò gbọ́dọ̀ yanjú ìṣòro ìtàn tàbí ti àkọsílẹ̀ nípa yíyí orúkọ náà padà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Wòlíì,” “owó fàdákà,” àti “díyelé” jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé lasán, tí wọ́n sì pa ìṣọ̀kan àti ìdíyelé oníṣòwò inú Gíríìkì mọ́.
