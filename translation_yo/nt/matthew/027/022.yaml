id: MAT.27.22
reference: Matthew 27:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: yo
  text: Pílátù sọ fún wọn pé, “Ǹjẹ́ kí ni kí n ṣe sí Jésù, ẹni tí a ń pè ní Mèsáyà[a]?” Gbogbo wọn sọ pé, “Kí a kàn án mọ́ àgbélébùú!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí a ń pè ní Kristi.”
    reason: Ìtumọ̀ mìíràn fún Χριστός tí ó pa ìrísí ìbílẹ̀ ‘Kristi’ mọ́.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Ǹjẹ́ kí ni kí n ṣe
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè ìgbìmọ̀ ní Gíríìkì; ‘kí ni kí n ṣe’ mú ìtumọ̀ ohun tí Pílátù yẹ kí ó ṣe jáde lọ́nà àdánidá ní Yorùbá, ‘ǹjẹ́’ sì ń fi οὖν hàn gẹ́gẹ́ bí àsopọ̀ ìyọrísí.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: A lo ìrísí orúkọ ẹni tí ó ti fìdí múlẹ̀ ní Yorùbá.
- source_word: τὸν λεγόμενον χριστόν
  choice: ẹni tí a ń pè ní Mèsáyà
  rationale: λεγόμενον jẹ́ àpèjúwe aláìṣe tí ó túmọ̀ sí ẹni tí a ń pè ní orúkọ oyè yìí; ‘Mèsáyà’ pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró mọ́, dípò lílò ó bí orúkọ lásán.
- source_word: λέγουσιν πάντες
  choice: Gbogbo wọn sọ pé
  rationale: A tú ìṣe àsìkò ìsinsìnyí inú ìtàn náà sí àsìkò àtijọ́ ní Yorùbá fún ìṣàn ìtàn àdánidá, a sì pa agbára πάντες mọ́ pẹ̀lú ‘gbogbo wọn.’
- source_word: Σταυρωθήτω
  choice: Kí wọ́n kàn án mọ́ àgbélébùú
  rationale: Èdè Yorùbá kò ní ìrísí aláìṣe tó bá ti Gíríìkì mu ní tààràtà; gbólóhùn ‘kí wọ́n...’ ń sọ àṣẹ ẹni kẹta náà ní kedere láìdárúkọ àwọn olùṣe.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός dúró gẹ́gẹ́ bí oyè, kì í ṣe apá kan orúkọ Jésù. ‘Mèsáyà’ jẹ́ kí ìtumọ̀ oyè àti ìretí Júù hàn; àkọsílẹ̀ ìsàlẹ̀ sì pa ‘Kristi,’ ìrísí ìbílẹ̀ tí a mọ̀ dáadáa, mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó ní iyì, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti bá ìlò Yorùbá àkànṣe mu; ọ̀rọ̀ àṣẹ ìkẹyìn jẹ́ kíkankíkan bí ti ọ̀pọ̀ ènìyàn nínú ìṣẹ̀lẹ̀ náà.
