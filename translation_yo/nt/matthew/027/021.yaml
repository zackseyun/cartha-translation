id: MAT.27.21
reference: Matthew 27:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: yo
  text: Ṣùgbọ́n gómìnà náà dá wọn lóhùn pé, “Èwo nínú àwọn méjèèjì ni ẹ fẹ́ kí n dá sílẹ̀ fún yín?” Wọ́n sì wí pé, “Bárábà.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: Ṣùgbọ́n gómìnà náà dá wọn lóhùn pé
  rationale: A ṣàkópọ̀ ọ̀rọ̀ àkànlò ἀποκριθεὶς ... εἶπεν gẹ́gẹ́ bí ìdáhùn àdánidá ní Yorùbá, láìtún ‘dáhùn, ó sì sọ’ ṣe. Ṣùgbọ́n fi ìyípadà díẹ̀ tí δέ mú wá hàn, gómìnà sì jẹ́ ọ̀rọ̀ tó péye fún ἡγεμών ní ipò Pílátù.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Èwo nínú àwọn méjèèjì
  rationale: Ìbéèrè náà ń béèrè fún yíyan ẹnì kan lára àwọn ènìyàn méjì tí a ti dárúkọ; gbólóhùn yìí ṣe àfihàn ìtumọ̀ apá-ẹgbẹ́ náà ní Yorùbá àdánidá.
- source_word: θέλετε
  choice: ni ẹ fẹ́
  rationale: θέλω ń sọ ìfẹ́ tàbí ohun tí wọ́n yàn; ‘ẹ fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe tààrà, tí ó sì bá ọ̀pọ̀ ènìyàn tí a ń bá sọ mu.
- source_word: ἀπολύσω ὑμῖν
  choice: kí n dá sílẹ̀ fún yín
  rationale: Nínú ọ̀ràn ìdájọ́, ἀπολύω túmọ̀ sí dídá ẹlẹ́wọ̀n sílẹ̀. ‘Fún yín’ pa ipa ὑμῖν mọ́ gẹ́gẹ́ bí ìtúsílẹ̀ tí a ṣe ní ìbámu pẹ̀lú ohun tí wọ́n fẹ́.
- source_word: οἱ δὲ εἶπαν
  choice: Wọ́n sì wí pé
  rationale: δὲ níbí ń tẹ ìtàn náà síwájú, nítorí náà ‘sì’ dára ju fífi ìtakò líle kún un lọ.
- source_word: Τὸν Βαραββᾶν
  choice: Bárábà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìrísí tó wọ́pọ̀, tó sì rọrùn fún olùkà Yorùbá láti pè.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, òde òní, àti ọ̀wọ̀ ni a lò. A yan ‘gómìnà’ dípò ‘baálẹ̀’ kí ipò ìṣàkóso Róòmù hàn kedere; a sì lo àpẹẹrẹ ọ̀pọ̀ ènìyàn ‘ẹ/yín’ nítorí pé Pílátù ń bá àwùjọ sọ̀rọ̀.
