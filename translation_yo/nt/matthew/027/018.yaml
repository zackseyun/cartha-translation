  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: yo
  text: Nítorí ó mọ̀ pé nítorí ìlara ni wọ́n fi í lé e lọ́wọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti inú ìlara” tàbí “nítorí owú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ó mọ̀
  rationale: Ọ̀rọ̀ yìí sọ pé ó ní ìmọ̀ tàbí òye nípa ohun tó sún wọn ṣe bẹ́ẹ̀; “ó mọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tó sì mọ́gbọ́n dání.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ìdí fún gbólóhùn tó ṣáájú; “Nítorí” pa ìsopọ̀ àlàyé náà mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín ὅτι ń ṣàfihàn ohun tí ó mọ̀, kì í ṣe gbólóhùn ìdí kejì.
- source_word: διὰ φθόνον
  choice: nítorí ìlara
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń fi ìdí tàbí ohun tó fa ìṣe hàn; φθόνος túmọ̀ sí ìlara tàbí inú búburú sí ipò rere ẹlòmíràn.
- source_word: παρέδωκαν
  choice: wọ́n fi í lé e lọ́wọ́
  rationale: παραδίδωμι ní àyíká yìí túmọ̀ sí fífi ẹnì kan lé aláṣẹ lọ́wọ́. Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí dá ìtumọ̀ náà dúró láì dín un sí “dà á.”
- source_word: αὐτόν
  choice: í
  rationale: Arọ́pò-orúkọ yìí ń tọ́ka sí Jesu; lílo “í” pa ìtọ́kasí arọ́pò-orúkọ inú Gíríìkì mọ́.
theological_decisions:
- issue: Ohun tó sún àwọn olùfisùn Jesu ṣe
  choice: Ó mọ̀ pé ìlara ló mú wọn fi Jesu lé e lọ́wọ́.
  alternative: Ó mọ̀ pé owú ló mú wọn ṣe bẹ́ẹ̀.
  rationale: φθόνος fi ìlara hàn gẹ́gẹ́ bí ohun tó sún wọn ṣe bẹ́ẹ̀. “Ìlara” pa agbára ìwà àti èrò inú ọ̀rọ̀ náà mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: A lo Yorùbá àtijọ́-kò-jù, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. Gbólóhùn “fi í lé e lọ́wọ́” jẹ́ àdánidá ní Yorùbá, ó sì pa àwọn arọ́pò-orúkọ orísun mọ́; àyíká ẹsẹ ni yóò mú kí ó ṣe kedere pé Jesu ni “í,” Pilatu sì ni “e.”
