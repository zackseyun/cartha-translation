source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: yo
  text: Ó sì ju àwọn owó fàdákà náà sínú tẹ́ńpìlì[a], ó kúrò[b], ó sì lọ pokùn pa ara rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sínú ibi mímọ́ inú tẹ́ńpìlì.” Ọ̀rọ̀ Gíríìkì náà, naos, sábà máa ń tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì dípò gbogbo àgbègbè tẹ́ńpìlì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó kúrò, ó sì lọ, ó sì pokùn pa ara rẹ̀.”
    reason: previous_rendering
lexical_decisions:
- source_word: ῥίψας
  choice: ó sì ju
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist tó ṣáájú ìṣe pàtàkì; fífi ‘ó sì ju’ ṣe é hàn gẹ́gẹ́ bí ìṣe tó kọ́kọ́ ṣẹlẹ̀, ó sì bá ìtàn Yorùbá mu láì fi àlàyé kún un.
- source_word: τὰ ἀργύρια
  choice: àwọn owó fàdákà náà
  rationale: Ní ti gígùn, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘fàdákà’; ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí owó fàdákà tí Júdásì gba, nítorí náà ‘àwọn owó fàdákà náà’ ṣe kedere ní Yorùbá.
- source_word: εἰς τὸν ναὸν
  choice: sínú tẹ́ńpìlì
  rationale: ‘Tẹ́ńpìlì’ rọrùn fún òǹkàwé, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ pàtó ti ναός—ibi mímọ́ inú tẹ́ńpìlì—mọ́.
- source_word: ἀνεχώρησεν
  choice: ó kúrò níbẹ̀
  rationale: Èyí sọ ìtumọ̀ kíkúrò tàbí yíyọ kúrò ní ibi kan ní Yorùbá àdánidá, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí participle tó tẹ̀ lé e.
- source_word: ἀπελθὼν
  choice: ó sì lọ
  rationale: Ìtumọ̀ náà pa ìgbésẹ̀ kejì mọ́, ṣùgbọ́n ó yẹra fún àsọtúnsọ tí kò dùn mọ́ etí ní Yorùbá.
- source_word: ἀπήγξατο
  choice: pokùn so ara rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ẹni náà fi òkùn so ara rẹ̀ fúnra rẹ̀; ó bá middle voice àti ìtumọ̀ ìpara-ẹni nípa fífi ara kọ́ mọ́ òkùn mu.
theological_decisions:
- issue: Ìtumọ̀ pàtó ti ναός ní ìfiwéra pẹ̀lú ọ̀rọ̀ tó túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì
  choice: Lo ‘tẹ́ńpìlì’ nínú ẹsẹ̀, kí àlàyé ìsàlẹ̀ ojú ìwé sì sọ pé ó lè jẹ́ ‘ibi mímọ́ inú tẹ́ńpìlì’.
  alternative: ibi mímọ́ inú tẹ́ńpìlì
  rationale: Kì í ṣe ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ tí a ń jiyàn lé lórí, ṣùgbọ́n ìyàtọ̀ ilé náà ṣe pàtàkì. Ẹsẹ̀ náà dúró ní kíkà-rọrùn, àlàyé sì pa ìtumọ̀ Gíríìkì tó ṣe pàtó mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tó bá ìgbà mu, tó ní iyì, tó sì ṣe kedere fún òǹkàwé lásán. A fi àmì ohùn sí ibi tí ó bá yẹ. Ọ̀rọ̀ náà pa àwọn ìṣe kíkúrò méjèèjì mọ́ láì jẹ́ kí gbólóhùn náà nira tàbí kún fún àsọtúnsọ.
