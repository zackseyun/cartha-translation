id: MAT.27.42
reference: Matthew 27:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: yo
  text: Ó gba àwọn ẹlòmíràn là; kò lè gba ara rẹ̀ là. Ọba Ísírẹ́lì ni ó jẹ́; kí ó sọ̀kalẹ̀ nísinsìnyí láti orí àgbélébùú[a], àwa yóò sì gbà á gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ó bá jẹ́ Ọba Ísírẹ́lì, kí ó sọ̀kalẹ̀ nísinsìnyí láti orí àgbélébùú, àwa yóò sì gbà á gbọ́.” Àwọn ìtumọ̀ Gẹ̀ẹ́sì kan mú ẹ̀gàn náà hàn gbangba nípa fífi ọ̀rọ̀ ‘bí’ kún un, ṣùgbọ́n Gíríìkì níbí sọ oyè náà tààrà.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: àwọn ẹlòmíràn
  rationale: Ọ̀rọ̀ yìí dúró gẹ́gẹ́ bí orúkọ fún ‘àwọn mìíràn’ ó sì pa ìyàtọ̀ ẹlẹ́gàn mọ́ láàárín àwọn tí ó gbà là àti ara rẹ̀.
- source_word: ἔσωσεν / σῶσαι
  choice: gba ... là
  rationale: ‘Gba là’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún σῴζω, ó sì lè ní ìtumọ̀ ìdáǹdè tàbí ìgbàlà láì dín ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì kù.
- source_word: ἑαυτὸν
  choice: ara rẹ̀
  rationale: Ó mú ìtọ́kasí padà sí ẹni náà hàn kedere, ó sì pa ìtakora inú ẹ̀gàn náà mọ́.
- source_word: οὐ δύναται σῶσαι
  choice: kò lè gba ... là
  rationale: Ó túmọ̀ agbára tàbí àìlágbára tí δύναμαι + infinitive sọ, ní èdè Yorùbá àdánidá.
- source_word: βασιλεὺς Ἰσραήλ
  choice: Ọba Ísírẹ́lì
  rationale: Ó pa oyè ọba náà mọ́ gẹ́gẹ́ bí àsọyé tààrà, bó tilẹ̀ jẹ́ pé àwọn olùsọ ń lò ó fún ẹ̀gàn.
- source_word: καταβάτω
  choice: kí ó sọ̀kalẹ̀
  rationale: Àṣẹ ẹni kẹta ni, tí ó bá ìpèníjà ẹlẹ́gàn inú ọ̀rọ̀ náà mu.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó fi ìkánjú ìpèníjà náà hàn ní kedere.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: láti orí àgbélébùú
  rationale: ‘Àgbélébùú’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún σταυρός; ‘láti orí’ bá àwòrán sísọ̀kalẹ̀ kúrò lórí rẹ̀ mu.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: àwa yóò sì gbà á gbọ́
  rationale: ‘Gba ẹni gbọ́’ jẹ́ gbólóhùn Yorùbá àdánidá fún ìgbàgbọ́ tí a darí sí ẹni kan; fífi ‘àwa’ hàn ń tẹnumọ́ olùṣe inú fọ́ọ̀mù ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àsọyé ẹlẹ́gàn nípa oyè ọba Jésù
  choice: Ọba Ísírẹ́lì ni ó jẹ́
  alternative: Bí ó bá jẹ́ Ọba Ísírẹ́lì
  rationale: Gíríìkì sọ oyè náà tààrà gẹ́gẹ́ bí gbólóhùn aláìṣe, kò sì ní àmì pogán ‘bí’. Ìtumọ̀ yìí pa ọ̀rọ̀ ẹlẹ́gàn náà àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́ láì fi àídájú kún ọ̀rọ̀ orísun.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa ìrísí ọ̀rọ̀ ẹlẹ́gàn náà mọ́, a kò sì fi pogán tí kò sí nínú Gíríìkì sínú ọ̀rọ̀ pàtàkì.
