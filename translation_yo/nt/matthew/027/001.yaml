id: MAT.27.1
reference: Matthew 27:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: yo
  text: Nígbà tí ilẹ̀ mọ́[a], gbogbo àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn jọ gbìmọ̀[b] lòdì sí Jésù, kí wọ́n lè pa á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà tí òwúrọ̀ dé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “jọ ṣe ìfọ̀rọ̀wérọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Nígbà tí ilẹ̀ mọ́
  rationale: Gbólóhùn yìí fi àkókò ìyípadà hàn lọ́nà Yorùbá àdánidá; ó túmọ̀ sí pé òwúrọ̀ ti dé tàbí pé ilẹ̀ ti mọ́. A kò ya δέ sọ́tọ̀ nítorí ìtẹ̀síwájú ìtàn náà ti fi agbára rẹ̀ hàn.
- source_word: συμβούλιον ἔλαβον
  choice: jọ gbìmọ̀
  rationale: Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ṣíṣe ìmọ̀ràn tàbí ìjíròrò papọ̀ nípa ohun tí wọ́n fẹ́ ṣe; ọ̀rọ̀ tó tẹ̀ lé e, ‘lòdì sí Jésù,’ ló mú ìṣọ̀tá inú àyíká náà hàn.
- source_word: πάντες
  choice: gbogbo
  rationale: A pa ìtẹnumọ́ pé gbogbo àwọn aṣáájú tí a dárúkọ ló kópa mọ́ ní kedere.
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí jẹ́ orúkọ oyè tó ṣe kedere fún ẹgbẹ́ àwọn aṣáájú àlùfáà ní Jerúsálẹ́mù, láìdábàá pé ọ̀pọ̀ àlùfáà àgbà kan ṣoṣo wà.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: àwọn àgbààgbà àwọn ènìyàn
  rationale: A pa ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó yé ni fún àwọn aṣáájú àgbà láàárín àwọn ènìyàn.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: lòdì sí Jésù
  rationale: Nínú àyíká ìdájọ́ àti ìṣọ̀tá yìí, κατά pẹ̀lú ẹ̀yà genitive túmọ̀ sí ìtakò, kì í ṣe pé wọ́n kàn ń sọ̀rọ̀ nípa Jésù.
- source_word: ὥστε
  choice: kí wọ́n lè
  rationale: Ó fi ète tàbí àbájáde tí wọ́n pinnu hàn, láìfipá yan láàárín ìtumọ̀ ète àti àbájáde.
- source_word: θανατῶσαι αὐτόν
  choice: pa á
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó wọ́pọ̀, fún mímú kí ẹnì kan kú; a kò lò ọ̀rọ̀ tó túmọ̀ sí pípa nípasẹ̀ ìdájọ́ òfin nítorí Gíríìkì kò sọ ìlànà náà ní pàtó.
theological_decisions:
- issue: Irú ohun tí àwọn aṣáájú ṣe sí Jésù
  choice: 'A sọ ọ́ gẹ́gẹ́ bí ìgbìmọ̀ ọ̀tá tí ète rẹ̀ jẹ́ láti pa Jésù: ‘jọ gbìmọ̀ lòdì sí Jésù, kí wọ́n lè pa á.’'
  alternative: Kí a sọ ọ́ níwọ̀nba díẹ̀ gẹ́gẹ́ bí ‘wọ́n jíròrò nípa Jésù,’ tàbí kí a mú un le sí i gẹ́gẹ́ bí ‘wọ́n dìtẹ̀ mọ́ Jésù.’
  rationale: κατά fi ìtakò hàn, θανατῶσαι sì fi ète ikú hàn. ‘Jọ gbìmọ̀ lòdì sí’ pa gbogbo méjèèjì mọ́ láìfi ìtumọ̀ ìdìtẹ̀ tó lágbára ju ọ̀rọ̀ orísun lọ kún un.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè tó ṣeé lóye. ‘Ilẹ̀ mọ́’ àti ‘jọ gbìmọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá, nígbà tí ‘olórí àlùfáà’ àti ‘àgbààgbà àwọn ènìyàn’ pa ìforúkọsílẹ̀ ìtàn àti ìdájọ́ mọ́.
