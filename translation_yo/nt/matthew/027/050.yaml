  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: yo
  text: Ṣùgbọ́n Jésù tún ké jáde pẹ̀lú ohùn ńlá, ó sì fi ẹ̀mí rẹ̀ sílẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó mí ìmí ìkẹyìn.” Ní Gíríìkì, ọ̀rọ̀ náà ní tààrà pé, “ó fi ẹ̀mí náà sílẹ̀”; ó jẹ́ ọ̀nà ọ̀rọ̀ fún ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń tẹ ìtàn náà síwájú pẹ̀lú ìyàtọ̀ díẹ̀; “Ṣùgbọ́n” bá ìyípadà ìṣẹ̀lẹ̀ yìí mu ní Yorùbá.
- source_word: πάλιν
  choice: tún
  rationale: πάλιν túmọ̀ sí pé ìṣe náà ṣẹlẹ̀ lẹ́ẹ̀kan sí i; “tún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: κράξας
  choice: ké jáde
  rationale: Ọ̀rọ̀-ìṣe κράζω ń tọ́ka sí igbe líle; “ké jáde” pa agbára ohùn náà mọ́, ó sì so ìṣe yìí mọ́ ọ̀rọ̀-ìṣe pàtàkì tó tẹ̀ lé e.
- source_word: φωνῇ μεγάλῃ
  choice: ní ohùn rara
  rationale: Gbólóhùn yìí ṣàlàyé bí ó ṣe ké; “ní ohùn rara” jẹ́ Yorùbá àdánidá tó fi líle ohùn hàn.
- source_word: ἀφῆκεν
  choice: jọ̀wọ́ … lé lọ́wọ́
  rationale: ἀφίημι lè túmọ̀ sí fífi sílẹ̀ tàbí jíjọ̀wọ́ ohun kan; nínú àkójọpọ̀ ọ̀rọ̀ yìí, “jọ̀wọ́ … lé lọ́wọ́” pa ìtumọ̀ fífi ẹ̀mí sílẹ̀ mọ́ láì sọ ó di àlàyé lásán pé ó kú.
- source_word: τὸ πνεῦμα
  choice: ẹ̀mí rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní “ẹ̀mí náà,” lílo arọ́pò-orúkọ oníni jẹ́ àdánidá ní Yorùbá nínú ọ̀rọ̀ yìí. “Ẹ̀mí” tún pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú πνεῦμα ju “èmí” ní ìtumọ̀ èémí lọ.
theological_decisions:
- issue: Ìtumọ̀ àkójọpọ̀ ọ̀rọ̀ ikú ἀφῆκεν τὸ πνεῦμα
  choice: ó sì jọ̀wọ́ ẹ̀mí rẹ̀ lé lọ́wọ́
  alternative: ó sì mí èémí ìkẹyìn
  rationale: Àṣàyàn yìí pa àwòrán gangan ti fífi tàbí jíjọ̀wọ́ ẹ̀mí sílẹ̀ mọ́, ó sì yẹra fún dídín πνεῦμα kù sí èémí nìkan. Àṣàyàn kejì túmọ̀ òwe ikú náà ní kedere sí i, ṣùgbọ́n ó mú díẹ̀ lára ìwọ̀n ìtumọ̀ “ẹ̀mí” kúrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. “Ní ohùn rara” ṣe kedere fún òǹkàwé òde òní, nígbà tí “jọ̀wọ́ ẹ̀mí rẹ̀ lé lọ́wọ́” pa ìwòye àti ìwọ̀n ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
