id: MAT.27.29
reference: Matthew 27:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n hun adé ẹ̀gún, wọ́n gbé e lé orí rẹ̀, wọ́n sì fi ọ̀pá esùsú sí ọwọ́ ọ̀tún rẹ̀. Wọ́n kúnlẹ̀ níwájú rẹ̀, wọ́n sì fi í ṣe ẹlẹ́yà, wọ́n ní, “Kábíyèsí, Ọba àwọn Júù![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọba àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn ará Jùdíà tàbí àwọn Júù; níhìn-ín, ó wà nínú oyè ọba tí wọ́n fi ń ṣe Jésù ní ẹlẹ́yà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: hun
  rationale: Ó ṣàfihàn híhun tàbí yíyí àwọn ẹ̀gún papọ̀ láti ṣe adé, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: adé ẹ̀gún
  rationale: “Adé” pa àwòrán ìjọba ẹlẹ́yà mọ́, “ẹ̀gún” sì sọ ohun tí wọ́n fi ṣe é ní ṣókí.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: wọ́n gbé e lé orí rẹ̀
  rationale: Gbólóhùn Yorùbá àdánidá fún fífi ohun kan sórí ẹni; ó pa ìṣe náà mọ́ láìfikún ìtumọ̀.
- source_word: κάλαμον
  choice: ọ̀pá esùsú
  rationale: “Esùsú” ni ohun náà ní ti gidi; fífi “ọ̀pá” kún un mú kí ipa rẹ̀ gẹ́gẹ́ bí ọ̀pá ìjọba ẹlẹ́yà yé kedere láìsọ pé ọ̀pá àṣẹ ni.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: sí ọwọ́ ọ̀tún rẹ̀
  rationale: Ó sọ ibi tí wọ́n fi esùsú náà sí ní Yorùbá tó ṣe kedere, bó tilẹ̀ jẹ́ pé Gíríìkì lo gbólóhùn onípò.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: wọ́n kúnlẹ̀ níwájú rẹ̀
  rationale: Ó mú ìdúró ìbọ̀wọ̀ ẹlẹ́yà náà jáde ní èdè Yorùbá tó rọrùn.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: wọ́n fi í ṣe ẹlẹ́yà
  rationale: Ó ṣàfihàn pé wọ́n ń fi ẹ̀gàn àti àbùkù ṣe é, kì í ṣe eré lásán.
- source_word: Χαῖρε
  choice: Kábíyèsí
  rationale: Nínú ọ̀rọ̀ ìkíni ọba ẹlẹ́yà yìí, “Kábíyèsí” jẹ́ ìkíni ọba Yorùbá tó mú àṣà ìbọ̀wọ̀ àti ìfiniṣe yẹ̀yẹ́ náà hàn; kì í ṣe ìtumọ̀ gangan ti ìkíni ojoojúmọ́.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Ọba àwọn Júù
  rationale: Ó pa orúkọ oyè ìjọba àti ìtumọ̀ ẹ̀yà-ẹ̀sìn tí ọ̀rọ̀ náà sábà ní nínú ìtàn ìjìyà Jesu mọ́.
theological_decisions:
- issue: Bí a ṣe lè pa ẹ̀gàn inú ìkíni ọba mọ́ láìdín oyè ọba kù
  choice: “Kábíyèsí, Ọba àwọn Júù!”
  alternative: “Ẹ kú àbọ̀, Ọba àwọn Júù!”
  rationale: “Kábíyèsí” mú ohùn ìkíni ọba àti ìbọ̀wọ̀ àfaraṣe hàn dáadáa, nígbà tí àyíká ọ̀rọ̀ fi hàn pé ẹ̀gàn ni wọ́n ń ṣe.
- issue: Ìtumọ̀ Ἰουδαίων
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn ará Jùdíà tàbí àwọn Júù. Nínú oyè ẹ̀sùn àti ẹ̀gàn ìjọba yìí, “àwọn Júù” ni ìtumọ̀ tó gbòòrò, tó sì bá àyíká ìtàn mu; àṣàyàn mìíràn wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Kábíyèsí” ń ṣiṣẹ́ gẹ́gẹ́ bí ìkíni ọba nínú àṣà èdè àfojúsùn, nígbà tí “ọ̀pá esùsú” pa ohun gidi àti àmì ọ̀pá ìjọba ẹlẹ́yà mọ́.
