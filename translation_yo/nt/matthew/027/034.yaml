  terminology: A ti rọ́pò “oró” pẹ̀lú “òjíá,” ọ̀rọ̀ Yorùbá tí ó yẹ fún gall nínú àyíká Bíbélì. Àlàyé ìsàlẹ̀ ojú ìwé ń dá ìtumọ̀ gangan (gall/bile) àti ìlò fífẹ̀ (ohun kíkorò) sílẹ̀, láì sọ ju ohun tí Gíríìkì dájú lọ. “Múr” ni a lò fún σμύρνα nínú Mákù 15:23.
