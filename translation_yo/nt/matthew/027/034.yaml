  source_fidelity: 'Àkọ́kọ́ gbólóhùn náà ń fi ἔδωκαν αὐτῷ πιεῖν, οἶνον, àti ìfẹ́kúfẹ̀ẹ́ tí ó wà nínú οὐκ ἠθέλησεν πιεῖν hàn dáadáa ní pàtàkì. Síbẹ̀, “oró” túmọ̀ sí májèlé ní Yorùbá lónìí, kì í sì í ṣe ìtumọ̀ tó yẹ fún χολή nínú ọ̀rọ̀ yìí. Ó lè yí ìtumọ̀ ọrọ̀ náà padà sí pé a fún un ní májèlé. Àlàyé ìsàlẹ̀ ojú ìwé náà tún ṣàṣìṣe nípa Mákù 15:23: Mákù mẹ́nu kan múr (myrrh), kì í ṣe òjíá.'
