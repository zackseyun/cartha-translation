  - severity: high
    issue: Àlàyé ìsàlẹ̀ ojú ìwé sọ pé Mákù 15:23 mẹ́nu kan òjíá
    rationale: Ọ̀rọ̀ Gíríìkì Mákù 15:23 ni σμυρνισμένον, ìyẹn wáìnì tí a pò mọ́ múr (myrrh). Òjíá/gall wà nínú Mátíù 27:34, kì í ṣe nínú Mákù 15:23.
