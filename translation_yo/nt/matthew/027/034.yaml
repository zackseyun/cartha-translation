  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: yo
  text: Wọ́n fún un ní wáìnì tí a da òjíá pọ̀ mọ́ kí ó mu[a]; ṣùgbọ́n lẹ́yìn tí ó tọ́ ọ wò, kò fẹ́ mu ún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì χολή lè túmọ̀ sí òjíá (gall/bile) tàbí, ní ìlò fífẹ̀, ohun kíkorò. A lo “òjíá” láti pa ọ̀rọ̀ Mátíù mọ́; fi wé Mákù 15:23, níbi tí a ti mẹ́nu kan múr.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Wọ́n fún un ... kí ó mu
  rationale: Ó túmọ̀ sí pé wọ́n fún un ní ohun mímu; ìtumọ̀ yìí pa ìṣe ‘fún’ àti ète ‘kí ó mu’ mọ́ ní Yorùbá àdánidá.
- source_word: οἶνον
  choice: wáìnì
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí wáìnì ní pàtó, kì í ṣe ohun mímu lásán.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: tí a pò mọ́ oró
  rationale: ‘Pò mọ́’ fi μεμιγμένον hàn ní èdè Yorùbá àdánidá. χολή lè jẹ́ omi kíkorò inú ẹ̀dọ̀ tàbí, ní ìtumọ̀ fífẹ̀, ohun kíkorò; ‘oró’ pa àwọ̀n ìtumọ̀ kíkorò àti àìdùn náà mọ́ láì sọ irú èròjà náà dájú jù.
- source_word: καὶ γευσάμενος
  choice: ṣùgbọ́n nígbà tí ó tọ́ ọ wò
  rationale: Partisípọ̀ náà túmọ̀ sí ‘lẹ́yìn tí ó tọ́ ọ wò’; ‘ṣùgbọ́n’ mú ìyàtọ̀ tó tẹ̀ lé e jáde lọ́nà àdánidá.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: kò fẹ́ mu ún
  rationale: Èyí pa ìtumọ̀ ìfẹ́ tàbí ìmúratán inú θέλω mọ́, láì mú un lágbára sí ‘ó kọ̀’.
theological_decisions:
- issue: Ìtumọ̀ χολή àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àkọsílẹ̀ ìjìyà àti ìró inú Sáàmù
  choice: oró
  alternative: omi kíkorò inú ẹ̀dọ̀; ohun kíkorò
  rationale: χόλη lè túmọ̀ sí gall/bile ní tààrà tàbí ohun kíkorò ní gbogbogbòò. ‘Oró’ jẹ́ ọ̀rọ̀ Yorùbá tó ní iyì, tó sì lè gbé àìdánilójú yìí; àlàyé ìsàlẹ̀ ojú ìwé sọ ìwọ̀n ìtumọ̀ náà kedere, láì fi Mákù 15:23 lé Mátíù lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ní ọ̀nà tó ṣe kedere, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. Gbólóhùn náà tẹ̀ lé ìṣísẹ̀ ọ̀rọ̀ Gíríìkì ṣùgbọ́n ó lo ìṣọ̀kan Yorùbá àdánidá.
