base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/036.yaml
  text: And sitting there[a], they kept watch over him.
translation:
  language: yo
  text: Wọ́n sì jókòó níbẹ̀, wọ́n ń ṣọ́ ọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn tí wọ́n jókòó níbẹ̀, wọ́n ń ṣọ́ ọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Àsopọ̀ ìtàn tó rọrùn ni; ó pa ìṣàn ìtàn mọ́ láìfi ìtumọ̀ àkókò kún un.
- source_word: καθήμενοι
  choice: jókòó
  rationale: Ọ̀rọ̀ àbọ̀ náà fi hàn pé wọ́n wà ní ipò ìjókòó bí wọ́n ṣe ń ṣe iṣẹ́ ọ̀rọ̀-ìṣe pàtàkì náà.
- source_word: ἐτήρουν
  choice: ń ṣọ́
  rationale: Àkókò imperfect fi ìṣe tó ń bá a lọ hàn; ‘ń ṣọ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé wọ́n ń ṣọ́ ọ láti má bàa sá tàbí kí ẹnikẹ́ni dá ohun tó ń ṣẹlẹ̀ dúró.
- source_word: αὐτὸν
  choice: ọ
  rationale: Arọ́pò-orúkọ olùgbà tí ó tọ́ka sí Jésù ni.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ọ̀rọ̀ ibi ni, ó sì ń tọ́ka sí ibi tí wọ́n jókòó tí wọ́n sì ń ṣọ́ ọ.
