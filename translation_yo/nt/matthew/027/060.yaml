  to: Ó sì fi í sínú ibojì tuntun tirẹ̀, èyí tí ó gbẹ́ jáde nínú àpáta. Lẹ́yìn tí ó yí òkúta ńlá kan sí ẹnu-ọ̀nà ibojì náà, ó lọ.
