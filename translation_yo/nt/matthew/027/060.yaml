id: MAT.27.60
reference: Matthew 27:60
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: yo
  text: Ó sì fi í sínú ibojì tuntun tirẹ̀, èyí tí ó gbẹ́ jáde nínú àpáta. Lẹ́yìn tí ó yí òkúta ńlá kan sí ẹnu-ọ̀nà ibojì náà, ó lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν
  choice: tẹ́ ẹ sínú
  rationale: Ní àyíká ìsìnkú yìí, ọ̀rọ̀ náà túmọ̀ sí pé ó tẹ́ òkú Jesu sínú ibojì; ‘tẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì ní iyì.
- source_word: καινῷ αὐτοῦ μνημείῳ
  choice: ibojì tuntun tirẹ̀
  rationale: ‘Ibojì’ bá ibi ìsìnkú tí a gbẹ́ sínú àpáta mu; ‘tuntun’ pa ìtumọ̀ καινῷ mọ́ láì fi ‘tí a kò tíì lò’ kún un, ‘tirẹ̀’ sì fi hàn pé ti Josefu fúnra rẹ̀ ni.
- source_word: ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: tí ó ti gbẹ́ sínú àpáta
  rationale: λατομέω ń tọ́ka sí gígẹ́ tàbí gbígbẹ́ ohun jáde nínú àpáta. ‘Gbẹ́ sínú àpáta’ jẹ́ àfihàn adayeba ní Yorùbá, ‘ti’ sì fi hàn pé iṣẹ́ náà ti ṣẹlẹ̀ ṣáájú.
- source_word: προσκυλίσας
  choice: Lẹ́yìn tí ó yí ... sí
  rationale: Aorist participle náà fi hàn pé yíyí òkúta ṣẹlẹ̀ ṣáájú lílọ rẹ̀; ‘Lẹ́yìn tí’ mú ìtẹ̀lé ìṣẹ̀lẹ̀ náà ṣe kedere.
- source_word: λίθον μέγαν
  choice: òkúta ńlá kan
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, adayeba fún λίθον μέγαν.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: sí ẹnu-ọ̀nà ibojì náà
  rationale: θύρα lè jẹ́ ‘ilẹ̀kùn’ tàbí ‘ẹnu-ọ̀nà.’ Ní ti ibojì inú àpáta, ‘ẹnu-ọ̀nà’ ṣàlàyé ihò àbáwọlé dáadáa láì mú kí òǹkàwé rò pé ilẹ̀kùn oníkọ̀ ni.
- source_word: ἀπῆλθεν
  choice: ó lọ
  rationale: Ọ̀rọ̀ náà sọ lílọ kúrò níbẹ̀ ní ṣókí; ‘ó lọ’ jẹ́ Yorùbá adayeba tí ìtàn náà sì ti mú ibi tí ó fi sílẹ̀ yé wa.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A kò fi àlàyé pé ibojì náà kò tíì lò kún ‘tuntun,’ nítorí Gíríìkì kò sọ ọ́ ní tààrà.
