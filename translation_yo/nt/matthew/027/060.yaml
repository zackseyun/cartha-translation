  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti àwọn kókó Gíríìkì dáadáa: Josefu fi ara náà sínú ibojì tuntun tirẹ̀, ibojì náà jẹ́ èyí tí ó gbẹ́ nínú àpáta, ó sì yí òkúta ńlá kan sí ẹnu-ọ̀nà ibojì náà kí ó tó lọ. Ṣùgbọ́n «tẹ́ ẹ sínú» kò dára gẹ́gẹ́ bí ìtumọ̀ τίθημι níbí, nítorí ó lè túmọ̀ sí títẹ́ ohun mọ́lẹ̀ tàbí títì í wọlé ju fífi ara sílẹ̀ sínú ibojì lọ.'
  naturalness: «Ó sì fi í sínú» jẹ́ Yorùbá òde òní, tó ní ìwọ̀ntúnwọ̀nsì àti ìyì, fún ‘placed it in.’ «Tí ó gbẹ́ jáde nínú àpáta» sọ pé ibojì náà ni a ṣe láti inú àpáta ní kedere ju «tí ó ti gbẹ́ sínú àpáta» lọ, èyí tí ohun tí a gbẹ́ rẹ̀ lè má hàn kedere.
  terminology: «Ibojì», «àpáta», «òkúta ńlá», àti «ẹnu-ọ̀nà ibojì» yẹ sí àyíká ibojì tí a gbẹ́ sínú àpáta. «Tirẹ̀» pa ìtọ́kasí ohun-ìní αὐτοῦ mọ́. Kò sí ìdí tó yẹ kí a fi àlàyé ìsàlẹ̀ kún un.
