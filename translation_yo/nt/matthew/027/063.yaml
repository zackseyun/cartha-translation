source:
  edition: SBLGNT
  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: yo
  text: wọ́n wí pé, “Olúwa, a rántí pé ẹlẹ́tàn yẹn sọ nígbà tí ó ṣì wà láàyè[b] pé, ‘Lẹ́yìn ọjọ́ mẹ́ta, a ó jí mi dìde[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Lẹ́yìn ọjọ́ mẹ́ta, èmi yóò jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí present, ó sì lè jẹ́ middle tàbí passive; níbí, gbolóhùn àkókò náà fi ìtumọ̀ ọjọ́ iwájú hàn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nígbà tí ẹlẹ́tàn yẹn ṣì wà láàyè, ó sọ pé.”
    reason: previous_rendering
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n wí pé
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí ó so ohun tí àwọn olùsọ̀rọ̀ náà sọ mọ́ ẹsẹ tó ṣáájú; ‘wọ́n wí pé’ jẹ́ ọ̀nà àdánidá láti mú ìsopọ̀ yẹn jáde ní Yorùbá.
- source_word: Κύριε
  choice: Olúwa
  rationale: Vocative κύριος ni, tí a lò níbí gẹ́gẹ́ bí ọ̀rọ̀ ọlá sí Pílátù; ‘Olúwa’ pa ìtumọ̀ orísun mọ́ láìfi dandan túmọ̀ sí pé wọ́n ń pe e ní Ọlọ́run.
- source_word: ἐμνήσθημεν
  choice: a rántí
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ aorist, ‘a rántí’ sọ ìrántí tí ó wúlò ní àsìkò tí wọ́n ń sọ̀rọ̀ ní ọ̀nà tí ó ṣe àdánidá ní Yorùbá.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: ẹlẹ́tàn yẹn
  rationale: ‘Ẹlẹ́tàn’ túmọ̀ πλάνος gẹ́gẹ́ bí ẹni tí ń tan ènìyàn jẹ tàbí ṣìnà wọn; ‘yẹn’ pa agbára ìtọ́ka jíjìnnà àti ẹ̀gàn inú ἐκεῖνος mọ́.
- source_word: ἔτι ζῶν
  choice: nígbà tí ó ṣì wà láàyè
  rationale: Gbólóhùn yìí fi àkókò tí ó sọ ọ̀rọ̀ náà hàn ní ìbámu pẹ̀lú ikú rẹ̀, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Lẹ́yìn ọjọ́ mẹ́ta
  rationale: μετά pẹ̀lú accusative túmọ̀ sí ‘lẹ́yìn’; a kò yí i sí ‘ní ọjọ́ kẹta,’ kí a má bàa mú un bá àwọn àsọtẹ́lẹ̀ míì mu.
- source_word: ἐγείρομαι
  choice: mo jí dìde
  rationale: Fọ́ọ̀mù present middle/passive náà lè ní ìtumọ̀ pé ẹni náà dìde tàbí pé a jí i dìde. ‘Mo jí dìde’ jẹ́ Yorùbá àdánidá, kò sì fi àmì ọjọ́ iwájú kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àsọtẹ́lẹ̀ tí Jésù sọ nípa àjíǹde rẹ̀
  choice: Lẹ́yìn ọjọ́ mẹ́ta, mo jí dìde
  alternative: Lẹ́yìn ọjọ́ mẹ́ta, a ó jí mi dìde
  rationale: Fọ́ọ̀mù ἐγείρομαι lè jẹ́ middle tàbí passive, present sì ni ní ìrísí. Ọ̀rọ̀ àkọ́kọ́ lo ìtumọ̀ intransitive tí ó ṣe àdánidá ní Yorùbá, àkọsílẹ̀ ìsàlẹ̀ sì pa ìtumọ̀ passive àti ọjọ́ iwájú tí ó ṣeé ṣe mọ́, láìyanjú ìṣòro náà ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ ti àdánidá. ‘Olúwa’ jẹ́ ọ̀rọ̀ ọlá sí Pílátù nínú àyíká yìí, kì í ṣe ìjẹ́wọ́ pé òun jẹ́ Ọlọ́run.
