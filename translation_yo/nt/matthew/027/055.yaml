  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: yo
  text: Àwọn obìnrin púpọ̀ wà níbẹ̀, wọ́n ń wò láti ìjìnnà[a]. Àwọn wọ̀nyí ni wọ́n ti tẹ̀lé Jesu láti Galili, wọ́n sì ń ṣe iṣẹ́ ìránṣẹ́ fún un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń kíyè sí i ní ìjìnnà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń pèsè ìrànlọ́wọ́ fún un.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí iṣẹ́ gbígbéṣẹ́ tàbí ìrànlọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: sì wà níbẹ̀
  rationale: “Wà níbẹ̀” ṣàfihàn ìwàníbẹ̀ àti ibi tí wọ́n wà; “sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí kò fi ìtakora líle kún δέ.
- source_word: γυναῖκες πολλαὶ
  choice: àwọn obìnrin púpọ̀
  rationale: Ó pa ọ̀pọ̀ ènìyàn àti akọ tàbí abo tí ọ̀rọ̀ Gíríìkì sọ mọ́.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: wọ́n ń wò láti òkèrè
  rationale: Ìṣe aláìparí “ń wò” fi hàn pé wọ́n ń kíyè sí ohun tó ń ṣẹlẹ̀, “láti òkèrè” sì pa ìjìnnà mọ́.
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: Àwọn obìnrin náà ti tẹ̀lé Jesu
  rationale: Gbólóhùn yìí dá àwọn obìnrin náà mọ̀ gẹ́gẹ́ bí àwọn tó tẹ̀lé Jesu tẹ́lẹ̀; “ti tẹ̀lé” fi ìṣáájú ìṣe náà síta lọ́nà àdánidá ní Yorùbá.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: láti Galili
  rationale: Ó pa Galili mọ́ gẹ́gẹ́ bí ibi tí wọ́n ti bẹ̀rẹ̀ sí í bá Jesu rìn.
- source_word: διακονοῦσαι αὐτῷ
  choice: wọ́n sì ń ṣe ìránṣẹ́ fún un
  rationale: Ọ̀rọ̀ yìí lè tọ́ka sí iṣẹ́, ìtọ́jú, tàbí ìrànlọ́wọ́ gbígbéṣẹ́; “ṣe ìránṣẹ́ fún un” kò sọ ọ́ di ipò iṣẹ́ ìjọ kan pàtó.
theological_decisions:
- issue: Ìtumọ̀ διακονοῦσαι nípa ipa àwọn obìnrin náà
  choice: wọ́n ń ṣe ìránṣẹ́ fún un
  alternative: wọ́n ń pèsè ohun tí ó nílò fún un
  rationale: Àṣàyàn náà pa ìtumọ̀ gbígbòòrò ti iṣẹ́ àti ìrànlọ́wọ́ mọ́, láìdín ipa wọn kù sí iṣẹ́ ilé nìkan tàbí láìsọ ọ́ di ipò iṣẹ́ ìjọ.
- issue: Ìbáṣepọ̀ àkókò tí wọ́n tẹ̀lé Jesu pẹ̀lú ìṣẹ̀lẹ̀ àgbélébùú
  choice: ti tẹ̀lé Jesu
  alternative: tẹ̀lé Jesu
  rationale: “Ti tẹ̀lé” fi hàn pé títẹ̀lé náà ti bẹ̀rẹ̀ ṣáájú àkókò tí wọ́n dúró ń wò, láìfi ohun tuntun kún ìṣẹ̀lẹ̀ náà.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní ni a lò. A pín gbólóhùn Gíríìkì náà sí gbólóhùn méjì fún ìṣàn Yorùbá tó ṣe déédéé, ṣùgbọ́n a pa àsopọ̀ ìtumọ̀ rẹ̀ mọ́. Àmì ohùn ni a lò níbi tí ó bá yẹ.
