  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: yo
  text: Nítorí náà ni a fi ń pe oko náà ní “Oko Ẹ̀jẹ̀” títí di òní.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi àbájáde ohun tí a ṣàlàyé ṣáájú hàn, ó sì jẹ́ àsopọ̀ tó ṣe kedere, tó sì bá èdè Yorùbá mu.
- source_word: ἐκλήθη
  choice: a ti ń pe
  rationale: Ìṣe àìmọ́ ẹni tó ṣe é (passive) ni a fi ‘a’ aláìnítọ̀hún túmọ̀; ‘ti ń pe’ fi hàn pé orúkọ náà bẹ̀rẹ̀ ní ìgbà àtijọ́, ó sì ṣì wà ní lílò dé àkókò tí akọ̀wé ń sọ̀rọ̀.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: oko náà
  rationale: ‘Oko’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ἀγρός ní àyíká yìí, ‘náà’ sì tọ́ka sí ibi tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: Ἀγρὸς Αἵματος
  choice: Oko Ẹ̀jẹ̀
  rationale: A pa àtúnlò ἀγρός mọ́ nínú orúkọ ibẹ̀, a sì tú ìbáṣepọ̀ genitive náà sí Yorùbá lọ́nà tó ṣe kedere.
- source_word: αἵματος
  choice: Ẹ̀jẹ̀
  rationale: Ẹ̀jẹ̀ ni ìtumọ̀ tààrà αἷμα; níhìn-ín ó jẹ́ apá kan orúkọ ibẹ̀.
- source_word: ἕως τῆς σήμερον
  choice: títí di òní
  rationale: Ó jẹ́ gbólóhùn àkókò Yorùbá tó ṣe àdánidá, tó ń fi hàn pé orúkọ náà ṣì wà ní lílò dé ọjọ́ tí akọ̀wé ń kọ̀wé.
