translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ tó bójú mu, tó ní ọlá, tí ó sì yé òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì fi àmì àyọlò yà orúkọ ibẹ̀ sọ́tọ̀.
