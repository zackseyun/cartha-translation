id: MAT.27.3
reference: Matthew 27:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: yo
  text: Nígbà náà ni Júdásì, ẹni tí ó fi í lé wọn lọ́wọ́, rí i pé a ti dá Jésù lẹ́bi. Ó kábàámọ̀ ohun tí ó ṣe, ó sì dá ọgbọ̀n owó fàdákà náà padà fún àwọn olórí àlùfáà àti àwọn alàgbà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó jẹ́ àmì àkókò tó ń tẹ ìṣẹ̀lẹ̀ tó kàn mọ́ èyí tó ṣáájú, ó sì bójú mu ní Yorùbá.
- source_word: ἰδὼν
  choice: rí i pé
  rationale: A tú participle aorist náà sí gbólóhùn ìṣe tó ṣe kedere ní Yorùbá, láì pàdánù ìtumọ̀ àkókò rẹ̀.
- source_word: Ἰούδας
  choice: Júdásì
  rationale: Èyí ni àkọsílẹ̀ orúkọ náà tó wọ́pọ̀ nínú Yorùbá.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: ẹni tí ó fi í lé wọn lọ́wọ́
  rationale: Ó pa ìtumọ̀ gidi ti παραδίδωμι mọ́ pé Júdásì fi Jésù lé àwọn aláṣẹ lọ́wọ́; ó tún yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn tó ju ọ̀rọ̀ náà lọ kún un.
- source_word: ὅτι κατεκρίθη
  choice: pé a ti dá a lẹ́bi
  rationale: Fọ́ọ̀mù passive aorist náà túmọ̀ sí pé a ti dá Jésù lẹ́bi; ìṣe aláìlórúkọ ‘a’ jẹ́ ọ̀nà àdánidá láti sọ passive ní Yorùbá.
- source_word: μεταμεληθεὶς
  choice: Ó kábàámọ̀ ohun tí ó ṣe
  rationale: ‘Kábàámọ̀’ fi ìbànújẹ́ àti ìrònúpìwàdà ọkàn hàn láì sọ ọ́ di ‘ronúpìwàdà’ ní ìtumọ̀ ẹ̀kọ́ ìsìn tó lágbára ju μεταμέλομαι lọ.
- source_word: ἔστρεψεν
  choice: ó sì dá ... padà
  rationale: Ní ọ̀rọ̀ nípa owó, ‘dá ... padà’ ni ìtumọ̀ àdánidá àti pípé.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ọgbọ̀n owó fàdákà náà
  rationale: ἀργύρια tọ́ka sí owó fàdákà; ‘owó fàdákà’ ṣe kedere fún òǹkàwé Yorùbá òde òní láì dájú jù nípa irú owó náà.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: fún àwọn olórí àlùfáà àti àwọn alàgbà
  rationale: ‘Àwọn olórí àlùfáà’ àti ‘àwọn alàgbà’ jẹ́ àwọn ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹgbẹ́ aṣáájú Júù wọ̀nyí.
theological_decisions:
- issue: Ìtumọ̀ μεταμεληθεὶς nípa ìhùwàsí Júdásì
  choice: Ó kábàámọ̀ ohun tí ó ṣe
  alternative: Ó ronúpìwàdà
  rationale: μεταμέλομαι ń tọ́ka sí kíkábàámọ̀ tàbí ìbànújẹ́ ọkàn, kì í ṣe dandan ìrònúpìwàdà ní ìtumọ̀ ẹ̀kọ́ ìsìn. Ìtumọ̀ yìí kò pinnu ipò ẹ̀mí Júdásì ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A pín àkójọpọ̀ participle Gíríìkì sí gbólóhùn méjì kí ó lè ṣàn dáadáa ní Yorùbá.
