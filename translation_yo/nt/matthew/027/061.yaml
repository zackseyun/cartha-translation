source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: yo
  text: Màríà Magidalénì àti Màríà mìíràn náà wà níbẹ̀, wọ́n jókòó ní òdìkejì ibojì náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: wà níbẹ̀
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ ẹyọ, ó ń sọ nípa wíwà àwọn obìnrin méjì tí a dárúkọ lẹ́yìn rẹ̀; ‘wà níbẹ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá, kò sì fi ìyàtọ̀ ẹyọ-ọ̀pọ̀ sí ọ̀rọ̀-ìṣe.
- source_word: δὲ
  choice: (a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀)
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ ìtàn pẹ̀lẹ́, kì í ṣe ìtakora líle. Ìṣàn gbólóhùn Yorùbá kò béèrè fún ‘ṣùgbọ́n’ tàbí ‘nígbà náà,’ nítorí náà a kò fi ọ̀rọ̀ àfikún sí i.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Màríà Magidalénì
  rationale: A lo ìrísí orúkọ tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá fún Màríà ará Magidala.
- source_word: ἡ ἄλλη Μαρία
  choice: Màríà kejì
  rationale: ‘Màríà kejì’ fi hàn ní ṣókí pé Màríà yìí yàtọ̀ sí Màríà Magidalénì tí a ṣẹ̀ṣẹ̀ dárúkọ.
- source_word: καθήμεναι
  choice: wọ́n jókòó
  rationale: Ó ṣàpèjúwe bí àwọn obìnrin méjèèjì ṣe wà níbẹ̀; fífi ‘wọ́n’ hàn mú kí olùṣe ọ̀rọ̀ ṣe kedere ní Yorùbá.
- source_word: ἀπέναντι
  choice: ní òdìkejì
  rationale: Ó pa ìtumọ̀ ipò tí ó dojú kọ tàbí tí ó wà kọjá sí ohun kan mọ́, ní èdè Yorùbá àdánidá.
- source_word: τοῦ τάφου
  choice: ibojì náà
  rationale: ‘Ibojì’ jẹ́ ọ̀rọ̀ Yorùbá tí ó yẹ fún ibi ìsìnkú yìí, ‘náà’ sì tọ́ka sí ibojì tí àyíká ọ̀rọ̀ ti sọ̀rọ̀ nípa rẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá àṣà kíkọ Yorùbá mu, a sì pa ìṣàn ìtàn pẹ̀lẹ́ mọ́ láìfi àsopọ̀ tí orísun kò béèrè fún kún un.
