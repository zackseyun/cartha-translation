id: MAT.27.33
reference: Matthew 27:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: yo
  text: Nígbà tí wọ́n dé ibi kan tí a ń pè ní Gọ́lgọ́tà (èyí tí ó túmọ̀ sí Ibi Agbárí),[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìfarahàn gangan síi, “èyí tí a ń pè ní Ibi Agbárí.” Gíríìkì náà ń ṣàlàyé orúkọ Gọ́lgọ́tà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Nígbà tí wọ́n dé
  rationale: Aorist participle náà ní ìtumọ̀ àkókò nínú ìtàn yìí; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìṣàn ìtàn mọ́.
- source_word: τόπον
  choice: ibi kan
  rationale: τόπος túmọ̀ sí ‘ibi’; ‘ibi kan’ fi hàn pé ọ̀rọ̀ náà kò ní article nínú Gíríìkì, ó sì bá Yorùbá mu.
- source_word: λεγόμενον
  choice: tí a ń pè ní
  rationale: Nínú àṣà lílò yìí, participle λέγω túmọ̀ sí pé a ń pe ibi náà ní orúkọ kan.
- source_word: Γολγοθᾶ
  choice: Gọ́lgọ́tà
  rationale: A ṣe àfọwọkọ orúkọ ibi náà sínú ìkọ̀wé àti ìró Yorùbá, dípò títúmọ̀ rẹ̀ ní apá àkọ́kọ́.
- source_word: ὅ ἐστιν
  choice: èyí tí ó túmọ̀ sí
  rationale: Gbólóhùn náà ń ṣàlàyé ìtumọ̀ orúkọ Gọ́lgọ́tà fún òǹkàwé; ‘túmọ̀ sí’ mú iṣẹ́ àlàyé náà hàn kedere.
- source_word: Κρανίου Τόπος
  choice: Ibi Agbárí
  rationale: κρανίον ni ‘agbárí,’ τόπος sì ni ‘ibi.’ Àkójọpọ̀ ‘Ibi Agbárí’ jẹ́ kúkúrú, àdánidá, ó sì yẹ gẹ́gẹ́ bí orúkọ ibi láìfi ìdánilójú tí Gíríìkì kò sọ kún un.
- source_word: λεγόμενος
  choice: (ó wà nínú ìtumọ̀ àlàyé náà)
  rationale: Àtúnlò ‘called’ nínú Gíríìkì ni a jẹ́ kí àlàyé ‘èyí tí ó túmọ̀ sí’ gbé, kí Yorùbá má bàa nira tàbí tún ara rẹ̀ sọ lọ́nà àjèjì.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘wọ́n’ láìfi ẹni tí ó ń tọ́ka sí kún ohun tí ẹsẹ yìí fúnra rẹ̀ sọ.
