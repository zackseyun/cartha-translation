id: MAT.27.41
reference: Matthew 27:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: yo
  text: Bákan náà[a], àwọn olórí àlùfáà náà, pẹ̀lú àwọn akọ̀wé àti àwọn àgbààgbà, ń fi í ṣe ẹlẹ́yà, wọ́n sì ń sọ pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ọ̀nà kan náà, àwọn olórí àlùfáà náà ń fi í ṣe ẹlẹ́yà pẹ̀lú àwọn akọ̀wé àti àwọn àgbààgbà, wọ́n sì ń sọ pé,”
    reason: Àṣàyàn míì fún ὁμοίως àti ìṣètò participle náà, tí ó pa ìtumọ̀ orísun mọ́.
lexical_decisions:
- source_word: ὁμοίως
  choice: Bákan náà
  rationale: Ó so ìṣe yìí pọ̀ mọ́ fífi Jésù ṣe ẹlẹ́yà tí a ṣẹ̀ṣẹ̀ sọ ṣáájú, ó sì pa agbára ìfiwéra ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Nínú ìtúmọ̀ Yorùbá yìí, ìtumọ̀ àfikún náà hàn nínú pé àwọn olórí àlùfáà náà darapọ̀ mọ́ àwọn tó ń fi Jésù ṣe ẹlẹ́yà; ‘pẹ̀lú’ tún so àwọn ẹgbẹ́ mẹ́tẹ̀ẹ̀ta pọ̀ lọ́nà àdánidá.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí tọ́ka sí àwọn aṣáájú àlùfáà, kì í ṣe pé ọ̀pọ̀ ènìyàn ló ń di ipò àlùfáà àgbà kan náà mú.
- source_word: ἐμπαίζοντες
  choice: ń fi í ṣe ẹlẹ́yà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ẹni ṣe yẹ̀yẹ́ tàbí ẹlẹ́yà; ‘í’ ní Jésù gẹ́gẹ́ bí ẹni tí wọ́n ń ṣe bẹ́ẹ̀ sí, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: μετὰ
  choice: pẹ̀lú
  rationale: Ó fi ìbáṣepọ̀ àwọn akọ̀wé àti àwọn àgbààgbà nínú ìṣe náà hàn, kì í ṣe wíwà ní tòsí lásán.
- source_word: γραμματέων
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tààrà tí a sábà máa ń lò fún àwọn amòye òfin àti Ìwé Mímọ́ nínú ìtàn Ìhìn Rere.
- source_word: πρεσβυτέρων
  choice: àwọn àgbààgbà
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí àwọn aṣáájú tí a dá mọ̀ láwùjọ, kì í ṣe àwọn àgbàlagbà lásán.
- source_word: ἔλεγον
  choice: wọ́n sì ń sọ pé
  rationale: Àmì àkókò imperfect fi ìṣe tí ó ń lọ lọ́wọ́ hàn; ‘ń sọ’ pa apá yẹn mọ́ láìfi dandan túmọ̀ sí pé wọ́n ń tún ọ̀rọ̀ kan náà sọ léraléra.
theological_decisions:
- issue: Àwọn tí wọ́n kópa nínú fífi Jésù ṣe ẹlẹ́yà
  choice: Àwọn olórí àlùfáà, àwọn akọ̀wé àti àwọn àgbààgbà ni wọ́n jọ ń fi Jésù ṣe ẹlẹ́yà.
  alternative: A lè ka gbólóhùn náà bí ẹni pé àwọn olórí àlùfáà nìkan ló ń fi í ṣe ẹlẹ́yà níwájú àwọn akọ̀wé àti àwọn àgbààgbà.
  rationale: μετὰ pẹ̀lú genitive sábà ń fi ìbáṣepọ̀ tàbí ìkópa papọ̀ hàn níbí, kì í ṣe wíwà ní ibi kan náà lásán.
translation_notes:
  register: Yorùbá àfọwọ́ṣe tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘àwọn olórí àlùfáà,’ ‘àwọn akọ̀wé,’ àti ‘àwọn àgbààgbà’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ ìtàn àti àjọṣepọ̀, láìfi ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún un.
