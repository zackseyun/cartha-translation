  to: Ní nǹkan bí aago mẹ́ta ọ̀sán, Jésù ké jáde ní ohùn gíga[a] pé, “Elí, Elí, lema sabaktani?” Ìyẹn ni, “Ọlọ́run mi, Ọlọ́run mi, Èéṣe tí o fi kọ̀ mí sílẹ̀?”[b]
  rationale: Àtúnṣe náà mú ọ̀nà ìsọ̀rọ̀ Yorùbá di mímọ́ síi, pàápàá ‘ní ohùn gíga’ àti ‘Èéṣe tí,’ nígbà tó ń pa ìtumọ̀ Gíríìkì àti ìfarahàn igbe Semitic Mátíù mọ́. A tún ṣe àkọsílẹ̀ [b] kí ó lè jẹ́ àṣàyàn gidi, kì í ṣe àtúnsọ ìbéèrè kan náà.
