    issue: ‘ohùn rara’ kò dára tó gẹ́gẹ́ bí ọ̀nà Yorùbá boṣewa fún ‘loud voice.’
    rationale: ‘Ohùn gíga’ jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó ní ìforígbárí, tí ó sì pa ìtẹnumọ́ φωνῇ μεγάλῃ mọ́.
  - severity: medium
    issue: Àkọsílẹ̀ [b] kò fúnni ní àṣàyàn ìtumọ̀ gidi.
    rationale: ‘kí ló dé tí o fi kọ̀ mí sílẹ̀?’ kan tún sọ ìbéèrè ‘why’ náà ní ọ̀nà míì; kò ṣàfihàn àṣàyàn aorist ‘did you forsake me?’ A tún un ṣe sí ‘Èéṣe tí o kọ̀ mí sílẹ̀?’ láìsí ‘fi,’ gẹ́gẹ́ bí ìyàtọ̀ ọ̀rọ̀-ìṣe tí Yorùbá lè gbà.
  - severity: low
    issue: ‘èé ṣe’ yẹ kí a kọ ọ́ ní ‘Èéṣe’ nínú àyọkà yìí.
