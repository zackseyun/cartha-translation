  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa àkókò ìwọ̀n-àníwọ̀n náà, igbe kíkankíkan Jésù, ìtúnsọ igbe Semitic náà, àti ìbéèrè ìkọ̀sílẹ̀ náà mọ́. ‘Aago mẹ́ta ọ̀sán’ jẹ́ ìyípadà tó yéye fún wákàtí kẹ́sàn-án nínú ìṣírò ọjọ́ Júù. Síbẹ̀, a ti tún ‘ohùn rara’ ṣe sí ‘ohùn gíga,’ èyí tó wọ́pọ̀, tó sì dára jù nínú Yorùbá boṣewa.
  naturalness: ‘Ní nǹkan bí aago mẹ́ta ọ̀sán’ àti ‘ké jáde’ jẹ́ àdánidá. ‘Ní ohùn gíga’ dára ju ‘ní ohùn rara’ lọ fún ‘φωνῇ μεγάλῃ.’ ‘Èéṣe tí’ ni ìkọ̀wé ọ̀rọ̀ ìbéèrè náà tó mọ́gbọ́n dání nínú ọ̀rọ̀ òde òní.
  terminology: ‘Ọlọ́run mi’ àti ‘kọ̀ mí sílẹ̀’ pa ìforíjìn/ìkọ̀sílẹ̀ inú orísun mọ́ láìdáhùn ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ kan. A pa ‘Elí, Elí, lema sabaktani?’ mọ́ gẹ́gẹ́ bí Mátíù ṣe ṣe; a kò fi àmì ohùn Yorùbá tí kò bá a mu lé e lórí.
  issues:
