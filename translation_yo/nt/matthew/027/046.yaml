id: MAT.27.46
reference: Matthew 27:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: yo
  text: Ní nǹkan bí aago mẹ́ta ọ̀sán, Jésù ké jáde ní ohùn gíga[a] pé, “Elí, Elí, lema sabaktani?” Ìyẹn ni, “Ọlọ́run mi, Ọlọ́run mi, Èéṣe tí o fi kọ̀ mí sílẹ̀?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ náà jọ ti Sáàmù 22:1.
    reason: cross_reference
  - marker: b
    text: A tún lè túmọ̀ ọ́ pé, “Èéṣe tí o kọ̀ mí sílẹ̀?” Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ aorist, ó sì gbé ìṣe náà kalẹ̀ gẹ́gẹ́ bí odindi; Yorùbá yìí pa agbára igbe náà àti ìró Sáàmù mọ́ láìfi àlàyé míì kún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Ní nǹkan bí aago mẹ́ta ọ̀sán
  rationale: περί pẹ̀lú àkúsatífù fi hàn pé àkókò náà jẹ́ ìwọ̀n-àníwọ̀n. ‘Wákàtí kẹ́sàn-án’ nínú ìṣírò Júù ìgbàanì bá aago mẹ́ta ọ̀sán mu; lílo àkókò tí òǹkàwé Yorùbá òde òní mọ̀ dáadáa mú ìtumọ̀ náà yé wọn láìjẹ́ kí wọn rò pé aago mẹ́sàn-án ni.
- source_word: ἀνεβόησεν … φωνῇ μεγάλῃ
  choice: ké jáde ní ohùn rara
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí kíké tàbí pípe jáde, gbolóhùn dátífù náà sì tẹnu mọ́ bí ohùn náà ṣe lágbára. ‘Ké jáde ní ohùn rara’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtẹnumọ́ méjèèjì mọ́.
- source_word: λέγων
  choice: pé
  rationale: Participle náà ṣí ọ̀rọ̀ tí Jésù ké jáde sílẹ̀. Nínú Yorùbá, ‘pé’ ni ọ̀nà àdánidá láti so ọ̀rọ̀ taara mọ́ ọ̀rọ̀-ìṣe náà.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Elí, Elí, lema sabaktani?
  rationale: Mátíù pa igbe èdè Semitic náà mọ́ kí ó tó túmọ̀ rẹ̀. Àyọkà Yorùbá náà ṣe bẹ́ẹ̀, ó sì lo ìkọ̀wé tó ṣeé kà ní Yorùbá láìparẹ́ àkànṣe ìró ọ̀rọ̀ orísun náà.
- source_word: τοῦτ’ ἔστιν
  choice: Ìyẹn ni
  rationale: Àgbékalẹ̀ yìí ń ṣàlàyé tàbí túmọ̀ ọ̀rọ̀ tó ṣáájú; ‘Ìyẹn ni’ jẹ́ kúkúrú, ó sì bójú mu ní Yorùbá.
- source_word: Θεέ μου θεέ μου
  choice: Ọlọ́run mi, Ọlọ́run mi
  rationale: A pa àtúnwí vocative taara náà mọ́, pẹ̀lú ìró àti ìtọ́ka rẹ̀ sí Sáàmù 22:1.
- source_word: ἱνατί
  choice: èé ṣe
  rationale: ‘Èé ṣe’ ni ìbéèrè Yorùbá àdánidá fún ‘nítorí kí ni’ tàbí ‘kí ló dé’ nínú ọ̀rọ̀ ọlọ́wọ̀.
- source_word: ἐγκατέλιπες
  choice: tí o fi kọ̀ mí sílẹ̀
  rationale: ‘Kọ̀ mí sílẹ̀’ fi ìtumọ̀ ìkọ̀sílẹ̀ tàbí fífi ẹnì kan sílẹ̀ hàn ní ọ̀nà tó lágbára, tó sì níyì. Àgbékalẹ̀ Yorùbá náà kò fi tipátipá pinnu gbogbo ìyàtọ̀ tó lè wà láàárín simple past àti present perfect Gẹ̀ẹ́sì.
theological_decisions:
- issue: Ìbáṣepọ̀ igbe Jésù pẹ̀lú Sáàmù 22:1
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí igbe ìkọ̀sílẹ̀ gidi, a sì pa ọ̀rọ̀ Sáàmù náà mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Ká ṣe é ní pàtàkì gẹ́gẹ́ bí àmì ìtọ́kasí Sáàmù nìkan, tàbí ká rọ ìtumọ̀ ìkọ̀sílẹ̀ náà.
  rationale: Gíríìkì fi igbe Jésù àti ìtumọ̀ rẹ̀ hàn láìṣàlàyé bí a ṣe gbọ́dọ̀ yanjú ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀. Àyọkà náà nítorí náà pa ìrírí igbe náà àti ìtọ́kasí Sáàmù mọ́, kò sì dáhùn ìbéèrè ẹ̀kọ́ ìgbàgbọ́ tí orísun kò dáhùn.
- issue: Pípa igbe èdè Semitic mọ́ nínú àyọkà pàtàkì
  choice: A pa ọ̀rọ̀ Semitic tí a kọ ní ìbámu pẹ̀lú ìró rẹ̀ mọ́, lẹ́yìn náà a fi ìtumọ̀ Yorùbá rẹ̀ hàn.
  alternative: Ká fi ìtumọ̀ Yorùbá nìkan sí àyọkà.
  rationale: Mátíù fúnra rẹ̀ pa ọ̀rọ̀ ìpilẹ̀ náà mọ́, ó sì túmọ̀ rẹ̀. Pípa àwọn méjèèjì mọ́ bọ̀wọ̀ fún ìṣètò orísun, ó sì jẹ́ kí ìdí tí àwọn tó dúró níbẹ̀ fi lè gbọ́ ‘Elí’ bí ìpè sí Èlíjà nínú àyíká ẹsẹ náà má bàjẹ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó níyì ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá níbi tí ó ti jẹ́ àdánidá; a kò fi àmì ohùn Yorùbá lé gbogbo ọ̀rọ̀ Semitic lórí. ‘Aago mẹ́ta ọ̀sán’ ń sọ ìtumọ̀ wákàtí kẹ́sàn-án Júù fún òǹkàwé òde òní, ‘ní nǹkan bí’ sì pa ìwọ̀n-àníwọ̀n περί mọ́.
