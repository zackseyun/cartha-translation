  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: yo
  text: ó ń wí pé, “Mo ti ṣẹ̀ nípa fífi ẹ̀jẹ̀ aláìlẹ́bi lé wọn lọ́wọ́[a].” Ṣùgbọ́n wọ́n ní, “Kí ni ìyẹn kan wa? Ìwọ ni yóò rí sí i[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀ gangan: “mo ti fi ẹ̀jẹ̀ aláìlẹ́bi lé wọn lọ́wọ́.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ó tún lè túmọ̀ sí: “Ìwọ fúnra rẹ rí sí i,” ìyẹn, “Ojúṣe rẹ ni.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Mo ti ṣẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ àìlórúkọ aorist indicative, ṣùgbọ́n “Mo ti ṣẹ̀” jẹ́ ìjẹ́wọ́ ẹ̀ṣẹ̀ tó bójú mu ní Yorùbá, ó sì fi hàn pé ẹ̀bi iṣẹ́ náà ṣì wà lórí ẹni tó ń sọ̀rọ̀.
- source_word: παραδοὺς
  choice: nípa fífi ... lé wọn lọ́wọ́
  rationale: Participle náà ṣàlàyé ohun tí ẹ̀ṣẹ̀ náà jẹ́. “Fífi ... lé wọn lọ́wọ́” pa ìtumọ̀ ìpìlẹ̀ παραδίδωμι mọ́, ó sì ní agbára ìtumọ̀ ìwà ọ̀dàlẹ̀ nínú àyíká ìtàn náà.
- source_word: αἷμα ἀθῷον
  choice: ẹ̀jẹ̀ aláìlẹ́bi
  rationale: Èyí pa àkànlò èdè Gíríìkì àti ìró rẹ̀ nínú Ìwé Mímọ́ mọ́, láìfi “Jésù” tàbí “ọkùnrin kan” kún ohun tí orísun kò sọ ní tààrà.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Kí ni ìyẹn jẹ́ sí wa?
  rationale: Àkànlò Yorùbá yìí sún mọ́ ìṣètò Gíríìkì, ó sì fi ìkọ̀sílẹ̀ ojúṣe àti àìbìkítà wọn hàn.
- source_word: σὺ ὄψῃ
  choice: Ìwọ ni yóò rí sí i
  rationale: Ó pa irú ọ̀rọ̀ ọjọ́ iwájú mọ́, nígbà tó tún mú ìtumọ̀ àkànlò náà jáde pé Júdásì fúnra rẹ̀ ni kó bójú tó ọ̀ràn náà.
theological_decisions:
- issue: Bóyá kí a sọ ní gbangba pé Jésù ni “ẹ̀jẹ̀ aláìlẹ́bi” ń tọ́ka sí
  choice: A fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí sílẹ̀ láìdárúkọ, gẹ́gẹ́ bí Gíríìkì.
  alternative: “ẹ̀jẹ̀ ọkùnrin aláìlẹ́bi” tàbí fífi “Jésù” kún un
  rationale: Orísun sọ “ẹ̀jẹ̀ aláìlẹ́bi” nìkan. Kíkọ Jésù tàbí ọkùnrin kan sí i yóò tú ìtumọ̀ náà ju bí orísun ṣe ṣe lọ.
- issue: Agbára ọ̀rọ̀ σὺ ὄψῃ
  choice: A lò ọjọ́ iwájú, “Ìwọ ni yóò rí sí i,” pẹ̀lú àlàyé pé ó jẹ́ ìkọ̀sílẹ̀ ojúṣe.
  alternative: “Ìwọ fúnra rẹ rí sí i”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ future middle ní ìrísí, ṣùgbọ́n ó lè ṣiṣẹ́ bí àṣẹ líle. Ìtumọ̀ pàtàkì pa ìrísí ọjọ́ iwájú mọ́, àkọsílẹ̀ sì jẹ́ kí àṣàyàn àṣẹ náà hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún bí ó ṣe yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa àkànlò “ẹ̀jẹ̀ aláìlẹ́bi” mọ́, a kò sì mú ohun tí orísun fi sí àìsọ́ pàtó di ohun tí a pinnu rẹ̀.
