  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìjẹ́wọ́ Júdásì, àkànlò “ẹ̀jẹ̀ aláìlẹ́bi,” àti ìdáhùn ìkọ̀sílẹ̀ àwọn olórí mọ́ dáadáa. “Ìwọ ni yóò rí sí i” tún dá ìtẹnumọ́ σὺ àti ìrísí ọjọ́ iwájú ὄψῃ sílẹ̀. Síbẹ̀, “Kí ni ìyẹn jẹ́ sí wa?” kì í ṣe àkànlò Yorùbá tó dára fún Τί πρὸς ἡμᾶς;.
  naturalness: A tún un ṣe sí “Kí ni ìyẹn kan wa?”—ìbéèrè Yorùbá àdánidá tó fi hàn pé wọn kọ ojúṣe náà sílẹ̀. A tún ṣàtúnṣe àlàyé ẹsẹ̀-ìsàlẹ̀ akọkọ kí ó má ṣe sọ participle náà di “nígbà tí,” èyí tí yóò le fi ìtumọ̀ àkókò kan tí Gíríìkì kò fi dandan sílẹ̀.
  terminology: “ṣẹ̀,” “ẹ̀jẹ̀ aláìlẹ́bi,” àti “rí sí i” yẹ, wọ́n sì bá ìforúkọsílẹ̀ ọ̀rọ̀ ìwé mímọ́ Yorùbá ti òde òní mu. A kò dárúkọ Jésù níbi tí Gíríìkì ti fi ẹni náà sílẹ̀ láìdárúkọ.
  issues:
