source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: yo
  text: Ṣùgbọ́n ó ní[a], “Kí ni ibi tí ó ṣe?” Ṣùgbọ́n wọ́n túbọ̀ ń ké pé[b], “Kí a kàn án mọ́ àgbélébùú!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ ní ọ̀nà àdánidá sí i pé, “Kí ló dé? Kí ni ibi tí ó ṣe?”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ àṣẹ náà pé, “Ẹ kàn án mọ́ àgbélébùú.” Ṣùgbọ́n Gíríìkì lò àṣẹ passive ẹni-kẹta; “Kí a kàn án mọ́ àgbélébùú” ń fi ìrísí náà hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: ó ní
  rationale: Ọ̀nà àdánidá tí Yorùbá fi ń ṣàgbékalẹ̀ ọ̀rọ̀ ẹni nínú ìtàn ni “ó ní”; aorist náà jẹ́ ìṣe ìtàn lasán níbí.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Ibi wo ni ó ṣe?
  rationale: Èyí pa κακόν mọ́ gẹ́gẹ́ bí “ibi,” ó sì mú ìbéèrè tí ń tako ẹ̀sùn náà jáde ní Yorùbá àdánidá. Agbára γάρ wà nínú bí ìbéèrè náà ṣe dáhùn ìbéèrè Pilatu tó ṣáájú.
- source_word: περισσῶς ἔκραζον
  choice: wọ́n túbọ̀ ń ké
  rationale: “Túbọ̀” fi ìlọsíwájú περισσῶς hàn, “ń ké” sì pa ìṣe tí ó ń lọ lọ́wọ́ nínú imperfect ἔκραζον mọ́.
- source_word: λέγοντες
  choice: pé
  rationale: Lẹ́yìn ọ̀rọ̀ ìké, “pé” ni ọ̀nà Yorùbá àdánidá láti ṣàgbékalẹ̀ ohun tí wọ́n ń sọ.
- source_word: Σταυρωθήτω
  choice: Kí a kàn án mọ́ àgbélébùú
  rationale: Ìlànà “kí a…” jẹ́ ọ̀nà Yorùbá àdánidá fún àṣẹ ẹni-kẹta; ó jẹ́ kí ẹni tí yóò ṣe ìṣe náà má ṣe pàtó, gẹ́gẹ́ bí passive imperative Gíríìkì.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: Ṣùgbọ́n ó ... Ṣùgbọ́n wọ́n ...
  rationale: Àtúnlò “Ṣùgbọ́n” pa ìtakora tó wà láàárín ọ̀rọ̀ Pilatu àti ìdáhùn àwọn ènìyàn mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àṣẹ àwọn ènìyàn nípa kíkàn án mọ́ àgbélébùú
  choice: Kí a kàn án mọ́ àgbélébùú
  alternative: Ẹ kàn án mọ́ àgbélébùú
  rationale: Gíríìkì lo àṣẹ ẹni-kẹta ní passive. “Kí a kàn án…” pa àṣẹ ẹni-kẹta àti àìsọ olùṣe pàtó mọ́ ju àṣẹ tààrà “Ẹ kàn án…” lọ, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. “Àgbélébùú” jẹ́ ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, “wọ́n túbọ̀ ń ké” sì jẹ́ àdánidá láìsọ pé ariwo wọn ga ju ohun tí orísun sọ lọ.
