id: MAT.27.25
reference: Matthew 27:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: yo
  text: Gbogbo àwọn ènìyàn náà sì dáhùn pé,[a] “Kí ẹ̀jẹ̀ rẹ̀ wà lórí wa àti lórí àwọn ọmọ wa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, àwọn ènìyàn tí ó péjọ tí wọ́n ń sọ̀rọ̀ nínú ìṣẹ̀lẹ̀ yìí; kò yẹ kí a ka ọ̀rọ̀ yìí sí fífi ẹ̀bi ayérayé kan gbogbo àwọn Júù ní gbogbo ìran.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: dáhùn pé
  rationale: Ọ̀rọ̀ náà jẹ́ apá-ìṣe aorist tí ó ní ìrísí passive, ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà Gíríìkì láti fi mú èsì wọlé; “dáhùn pé” jẹ́ Yorùbá àdánidá fún ἀποκριθεὶς ... εἶπεν.
- source_word: πᾶς ὁ λαὸς
  choice: Gbogbo àwọn ènìyàn náà
  rationale: Ó pa agbára àkójọpọ̀ πᾶς ὁ λαὸς mọ́, ó sì tọ́ka sí àwọn ènìyàn tí ó péjọ síbi ìṣẹ̀lẹ̀ náà láì sọ ọ́ di ẹ̀sùn sí gbogbo Júù ní gbogbo ìran.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: ẹ̀jẹ̀ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún gbólóhùn náà. Nínú ọ̀rọ̀ ìdájọ́ yìí, ẹ̀jẹ̀ túmọ̀ sí ojúṣe fún ikú rẹ̀, ṣùgbọ́n a kò tú ìtumọ̀ yẹn síta nínú ọ̀rọ̀ àkọ́kọ́.
- source_word: ἐφ’ ἡμᾶς
  choice: Kí ... wà lórí wa
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe níhìn-ín; “Kí ... wà lórí wa” pèsè ọ̀rọ̀-ìṣe tí Yorùbá nílò, ó sì pa agbára gbólóhùn ìfẹ́ tàbí gbígba ojúṣe náà mọ́.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: àti lórí àwọn ọmọ wa
  rationale: “Àwọn ọmọ wa” ni ìtumọ̀ àdánidá τέκνα ἡμῶν. Àtúnsọ “lórí” pa ìfarakanra àti ìtẹnumọ́ Gíríìkì mọ́.
theological_decisions:
- issue: Ó ṣeé ṣe kí a túmọ̀ πᾶς ὁ λαὸς lọ́nà tó tako àwọn Júù
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ àwọn ènìyàn tí ó péjọ sínú ìṣẹ̀lẹ̀ náà.
  alternative: Gbogbo ogunlọ́gọ̀ náà
  rationale: Ẹsẹ náà ń ròyìn èsì àwọn tó péjọ níbẹ̀; kò gbé ẹ̀bi ayérayé lé gbogbo Júù ní gbogbo ìran. Àlàyé ìsàlẹ̀ ojú ìwé ń dí ìtúmọ̀ tó kọjá ààlà yìí lọ́wọ́ láì dín agbára ọ̀rọ̀ Gíríìkì kù.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá ṣe àdánidá, a sì pa ìṣọ̀kan àti ìfarakanra gbólóhùn Gíríìkì mọ́.
