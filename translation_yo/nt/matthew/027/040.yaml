id: MAT.27.40
reference: Matthew 27:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: yo
  text: tí wọ́n sì ń wí pé, “Ìwọ tí ó máa wó tẹ́ńpìlì, tí ó sì máa kọ́ ọ[a] ní ọjọ́ mẹ́ta, gba ara rẹ là! Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run, sọ̀kalẹ̀ kúrò lórí àgbélébùú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tún un kọ́.” Ọ̀rọ̀ ìṣe Gíríìkì náà túmọ̀ sí “kọ́” lásán, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ẹ̀gàn náà lè túmọ̀ sí kí a tún un kọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: tí wọ́n sì ń wí pé
  rationale: Ọ̀rọ̀ àbọ̀ ìsinsìnyí yìí ń tẹ̀ síwájú láti inú ìtàn ẹsẹ tó ṣáájú; ìtumọ̀ yìí fi ìṣe tí ń lọ lọ́wọ́ àti ìsopọ̀ rẹ̀ mọ́ àyíká hàn láìfi kún ẹni tí ọ̀rọ̀ náà kò sọ níbí.
- source_word: Ὁ καταλύων
  choice: Ìwọ tí yóò wó
  rationale: Àpilẹ̀kọ pẹ̀lú ọ̀rọ̀ àbọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí ìpè tààrà sí ẹni tí wọ́n ń bá sọ̀rọ̀. ‘Yóò wó’ dá ìfiṣẹ̀sín tí ń tọ́ka sí ẹ̀sùn tàbí ọ̀rọ̀ tí wọ́n fi kàn án hàn.
- source_word: ναός
  choice: tẹ́ńpìlì
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè tọ́ka ní pàtó sí ibi mímọ́ inú tẹ́ńpìlì, ‘tẹ́ńpìlì’ ni ọ̀rọ̀ tí ó ṣe kedere, tí ó sì bá àyíká ìfiṣẹ̀sín yìí mu fún òǹkàwé Yorùbá.
- source_word: ἐν τρισὶν ἡμέραις
  choice: ní ọjọ́ mẹ́ta
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkókò tí iṣẹ́ náà yóò gbà, ó sì pa ìṣòro ìtumọ̀ gbólóhùn orísun mọ́.
- source_word: οἰκοδομῶν
  choice: tí yóò sì kọ́ ọ[a]
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘kọ́’; arọ́pò-orúkọ ‘ọ’ ń tọ́ka padà sí tẹ́ńpìlì. ‘Tún un kọ́’ bá àyíká mu ṣùgbọ́n ó fi ‘tún’ kún ohun tí ọ̀rọ̀ orísun kò sọ ní tààrà, nítorí náà a fi sí àlàyé ìsàlẹ̀.
- source_word: σῶσον σεαυτόν
  choice: gba ara rẹ là
  rationale: Èyí jẹ́ àṣẹ tààrà pẹ̀lú arọ́pò-orúkọ àfarawé; ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere àti àdánidá fún ìpèníjà ẹlẹ́gàn náà.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Bí ìwọ bá jẹ́ Ọmọ Ọlọ́run
  rationale: Ó pa gbólóhùn oníṣ شرط àti oyè Kristi náà mọ́ láìdín agbára rẹ̀ kù tàbí láìṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀.
- source_word: κατάβηθι ἀπὸ τοῦ σταυροῦ
  choice: sọ̀kalẹ̀ kúrò lórí àgbélébùú
  rationale: ‘Sọ̀kalẹ̀’ jẹ́ àṣẹ ìṣípò sí ìsàlẹ̀, ‘kúrò lórí’ sì sọ àgbélébùú gẹ́gẹ́ bí ibi tí ó ti ń sọ̀kalẹ̀ ní Yorùbá àdánidá.
- source_word: σταυρός
  choice: àgbélébùú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ jù lọ, tí ó sì yẹ fún ohun èlò ìkànmọ́ agbelebu nínú ìtàn ìjìyà Jesu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ oyè Kristi υἱὸς τοῦ θεοῦ nínú ọ̀rọ̀ ẹ̀gàn
  choice: Ọmọ Ọlọ́run
  alternative: Ọmọ ti Ọlọ́run
  rationale: ‘Ọmọ Ọlọ́run’ ni oyè Yorùbá tí ó ṣe kedere tí ó sì wọ́pọ̀. Ó pa ìpèníjà àwọn olùṣẹ̀sín mọ́, kò sì sọ bóyá wọ́n gbà oyè náà gbọ́ tàbí kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. A pa ìró ọ̀rọ̀ ẹ̀gàn àti àṣẹ líle náà mọ́; a kò sì fi ẹ̀kọ́ ìjọ kan pàtó sínú oyè “Ọmọ Ọlọ́run.”
