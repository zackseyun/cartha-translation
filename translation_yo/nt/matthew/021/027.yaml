id: MAT.21.27
reference: Matthew 21:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: yo
  text: Wọ́n sì dá Jésù lóhùn pé, “Àwa kò mọ̀.” Òun náà sì sọ fún wọn pé, “Èmi náà kò ní sọ fún yín àṣẹ wo ni mo fi ń ṣe àwọn nǹkan wọ̀nyí.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: dá … lóhùn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé wọ́n fèsì sí ìbéèrè Jésù, ó sì pa ipa participle Gíríìkì mọ́ láìjẹ́ kí gbolohun náà le.
- source_word: Οὐκ οἴδαμεν
  choice: Àwa kò mọ̀
  rationale: Ó túmọ̀ gbólóhùn ìkọ̀sẹ̀ ní tààrà, ìtẹnumọ́ ‘Àwa’ sì bá pronoun inú ọ̀rọ̀-ìṣe Gíríìkì mu nínú ìjíròrò náà.
- source_word: ἔφη
  choice: sọ fún wọn
  rationale: ‘Sọ’ jẹ́ ọ̀rọ̀ ìjíròrò tí kò fi ìtumọ̀ àfikún kún ọ̀rọ̀ Gíríìkì; ‘fún wọn’ mú ẹni tí a ń bá sọ̀rọ̀ hàn kedere.
- source_word: καὶ αὐτός
  choice: Òun náà sì
  rationale: 'Ó pa ìfèsì alábàápín mọ́: bí wọ́n ṣe kọ̀ láti dáhùn, bẹ́ẹ̀ ni Jésù náà fèsì sí wọn.'
- source_word: Οὐδὲ ἐγὼ
  choice: Èmi náà kò ní
  rationale: Ó fi ìtẹnumọ́ Jésù àti ìfèsì rẹ̀ sí tiwọn hàn, nígbà tí ‘kò ní’ sọ ìkọ̀ láti sọ ohun náà ní Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: sọ fún yín
  rationale: Nínú àyíká yìí, λέγω túmọ̀ sí fífi ìsọfúnni hàn; ‘sọ fún yín’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere jù.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: àṣẹ wo ni mo fi
  rationale: Ilana ‘àṣẹ wo ni mo fi’ jẹ́ Yorùbá àdánidá fún ohun tàbí orísun àṣẹ tí ẹni kan fi ń ṣe iṣẹ́.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ iye demonstrative Gíríìkì mọ́, ó sì tọ́ka sí àwọn iṣẹ́ Jésù tí wọ́n ń bi í léèrè nípa wọn.
- source_word: ποιῶ
  choice: ń ṣe
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń lọ tàbí ìṣe tí Jésù máa ń ṣe nínú àyíká náà hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσία nínú ìdáhùn Jésù
  choice: àṣẹ
  alternative: ẹ̀tọ́; agbára
  rationale: Nínú àríyànjiyàn yìí, àwọn olórí ń béèrè nípa ìlànà tàbí orísun ẹ̀tọ́ Jésù láti ṣe àwọn iṣẹ́ rẹ̀. ‘Àṣẹ’ pa ipa òfin àti ti ẹ̀sìn mọ́ láìdín ọ̀rọ̀ náà kù sí agbára láti ṣe ohun kan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún gbogbo ènìyàn, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. Ìṣètò gbolohun jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n ó pa ìfèsì ara wọn, ìtẹnumọ́ àwọn arọ́pò-orúkọ, àti ọ̀pọ̀ iye ‘àwọn nǹkan wọ̀nyí’ mọ́.
