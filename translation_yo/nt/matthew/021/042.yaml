  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ìbéèrè àtakò náà, àyọlò Sáàmù, ìkọ̀sílẹ̀ òkúta, àti pé ohun náà ti ọ̀dọ̀ Olúwa wá, gbogbo rẹ̀ wà níbẹ̀. Síbẹ̀, ìpèníjà kan wà nínú àlàyé ìsàlẹ̀ a: “òkúta orí ilé” kò ṣe kedere gẹ́gẹ́ bí àṣàyàn “capstone,” ó sì fi “ilé” sí ibi tí ìtumọ̀ gangan jẹ́ “orí igun.”'
