  terminology: “Àwọn akọ́lé,” “kọ̀ sílẹ̀,” “Olúwa,” àti “ohun ìyanu” yẹ fún àyíká náà. “Olórí igun ilé” pa àwòrán “head of the corner” mọ́, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ ní àìdánilójú tí a gbọ́dọ̀ fi hàn nínú àlàyé ìsàlẹ̀.
