id: MAT.21.42
reference: Matthew 21:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: yo
  text: 'Jésù sọ fún wọn pé, “Ṣé ẹ kò tíì kà nínú Ìwé Mímọ́ rí pé,


    ‘Òkúta tí àwọn akọ́lé kọ̀ sílẹ̀,

    òun náà ni ó di olórí igun ilé[a].

    Láti ọ̀dọ̀ Olúwa ni èyí ti wá[b],

    ó sì jẹ́ ohun ìyanu lójú wa’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “orí igun.” Ọ̀rọ̀ náà lè túmọ̀ sí òkúta igun ilé tàbí òkúta orí.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “láti ọ̀dọ̀ Olúwa”; orísun Hébérù tí a fa ọ̀rọ̀ yìí yọ ní “láti ọ̀dọ̀ OLÚWA” (YHWH).'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: sọ
  rationale: Ìsinsìnyí ìtàn Gíríìkì lè jẹ́ àkókò tí ó ti kọjá ní Yorùbá láìsọ ìtumọ̀ nù; “sọ” bá ìtàn náà mu lọ́nà àdánidá.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Ṣé ẹ̀yin kò tíì kà á rí
  rationale: Ọ̀rọ̀ yìí mú ìbéèrè àtakò náà jáde ní Yorùbá àdánidá, pẹ̀lú ìtumọ̀ “ẹ kò kà á nígbà kan rí bí?”
- source_word: γραφαῖς
  choice: Ìwé Mímọ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àkójọpọ̀ àwọn ìwé mímọ́ Ísírẹ́lì.
- source_word: Λίθον
  choice: Òkúta
  rationale: Bí ó tilẹ̀ jẹ́ pé kò ní àfihàn pàtó nínú Gíríìkì, òkúta kan pàtó nínú Sáàmù ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἀπεδοκίμασαν
  choice: kọ̀ sílẹ̀
  rationale: Ó sọ pé àwọn akọ́lé yẹ òkúta náà wò, wọ́n sì kọ̀ ọ́ gẹ́gẹ́ bí ohun tí kò yẹ.
- source_word: οἱ οἰκοδομοῦντες
  choice: àwọn akọ́lé
  rationale: “Àwọn akọ́lé” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tí ń kọ́ ilé, ó sì pa àpèjúwe náà mọ́.
- source_word: οὗτος
  choice: òun náà
  rationale: 'Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́: òkúta tí wọ́n kọ̀ náà gan-an ni ó gba ipò pàtàkì yìí.'
- source_word: ἐγενήθη εἰς
  choice: ni ó di
  rationale: Ó fi ìyípadà sí ipò tuntun hàn ní Yorùbá tó rọrùn.
- source_word: κεφαλὴν γωνίας
  choice: olórí igun ilé
  rationale: Ó sun mọ́ àwòrán gangan “orí igun,” ó sì jẹ́ kó ṣe kedere pé òkúta pàtàkì ilé ni; àìdánilójú bóyá òkúta igun ìpìlẹ̀ tàbí òkúta orí ni a pa mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: παρὰ κυρίου
  choice: Láti ọ̀dọ̀ Olúwa
  rationale: παρά pẹ̀lú genitive tọ́ka sí orísun; gbolohun Yorùbá yìí mú ìtumọ̀ náà jáde kedere.
- source_word: θαυμαστὴ
  choice: ohun ìyanu
  rationale: Ó pa ìgbọ́kànlé àti ìgbéga ọ̀rọ̀ inú àyọlò náà mọ́ ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú àyọlò Sáàmù
  choice: Olúwa
  alternative: OLÚWA
  rationale: Ọ̀rọ̀ Gíríìkì ni κυρίου, nítorí náà “Olúwa” ni a lò nínú ọ̀rọ̀ pàtàkì; àmọ́ orísun Hébérù ní orúkọ Ọlọ́run YHWH, a sì fi èyí hàn ní àlàyé ìsàlẹ̀.
- issue: Ìlò àpèjúwe òkúta fún Mèsáyà
  choice: Pa àpèjúwe òkúta mọ́ láìfi ìtumọ̀ kún un
  alternative: Darúkọ òkúta náà ní tààrà gẹ́gẹ́ bí Mèsáyà
  rationale: Àyíká fi hàn pé Jésù ń lo Sáàmù náà sí ara rẹ̀, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ jẹ́ àyọlò láìní àlàyé tààrà; ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. “Ṣé” àti “ẹ̀yin” mú ìbéèrè Jésù dun bí ọ̀rọ̀ àdánidá, nígbà tí ìlà àyọlò náà pa ìrísí ewì àti ìgbéga Sáàmù mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
