revisions:
- from: Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Lóòótọ́ ni mo wí fún yín, bí ẹ bá ní ìgbàgbọ́, tí ẹ kò sì ṣiyèméjì[a], kì í ṣe ohun tí a ṣe sí igi ọ̀pọ̀tọ́ nìkan ni ẹ ó ṣe; ṣùgbọ́n bí ẹ tilẹ̀ sọ fún òkè yìí pé, ‘Kí a gbé ọ sókè, kí a sì jù ọ́ sínú òkun,’ yóò ṣẹlẹ̀.”
  to: Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Lóòótọ́ ni mo wí fún yín, bí ẹ bá ní ìgbàgbọ́, tí ẹ kò sì ṣiyèméjì[a], kì í ṣe ohun tí a ṣe sí igi ọ̀pọ̀tọ́ nìkan ni ẹ ó ṣe; ṣùgbọ́n bí ẹ tilẹ̀ sọ fún òkè yìí pé, ‘Kí a gbé ọ sókè, kí a sì jù ọ́ sínú òkun,’ yóò ṣẹlẹ̀.”
  rationale: Only the lexical-alternative footnote requires correction. The revised note gives an idiomatic Yoruba expression for the nuance ‘be divided in mind,’ while the main text rightly retains “ṣiyèméjì” (‘doubt’). No change to the verse itself is needed.
  reviewer_model: gpt-5.6-terra
