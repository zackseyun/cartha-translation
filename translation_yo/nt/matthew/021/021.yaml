id: MAT.21.21
reference: Matthew 21:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Lóòótọ́ ni mo wí fún yín, bí ẹ bá ní ìgbàgbọ́, tí ẹ kò sì ṣiyèméjì[a], kì í ṣe ohun tí a ṣe sí igi ọ̀pọ̀tọ́ nìkan ni ẹ ó ṣe; ṣùgbọ́n bí ẹ tilẹ̀ sọ fún òkè yìí pé, ‘Kí a gbé ọ sókè, kí a sì jù ọ́ sínú òkun,’ yóò ṣẹlẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ẹ kò sì lọ́kàn méjì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ṣùgbọ́n Jésù dá wọn lóhùn pé
  rationale: “Dá … lóhùn” jẹ́ ọ̀nà Yorùbá àdánidá fún ìdáhùn, “ṣùgbọ́n” sì fi ìyípadà kékeré nínú ìtàn hàn.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo wí fún yín
  rationale: Ó pa ìtẹnumọ́ àti ọlá ọ̀rọ̀ àṣẹ Jésù mọ́ ní èdè Yorùbá òde òní.
- source_word: ἐὰν ἔχητε πίστιν
  choice: bí ẹ bá ní ìgbàgbọ́
  rationale: Ní àyíká yìí, πίστις ń tọ́ka sí ìgbẹ́kẹ̀lé Ọlọ́run, kì í ṣe ìwà òtítọ́ ẹni.
- source_word: μὴ διακριθῆτε
  choice: tí ẹ kò sì ṣiyèméjì
  rationale: “Ṣiyèméjì” sọ ìṣiyèméjì inú ọkàn ní kedere; àlàyé ìsàlẹ̀ pa ìtumọ̀ yíyẹ̀sẹ̀ tàbí ọkàn pípín mọ́.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: kì í ṣe ohun tí a ṣe sí igi ọ̀pọ̀tọ́ nìkan ni ẹ ó ṣe
  rationale: Gbólóhùn Gíríìkì náà ní ohun tí a kò sọ jáde ní kíkún; ìtumọ̀ yìí mú un ṣe kedere láì fi àlàyé míì kún un.
- source_word: κἂν
  choice: ṣùgbọ́n bí ẹ tilẹ̀
  rationale: Ó fi ìgbésẹ̀ àfiwé tó lágbára jù ti igi ọ̀pọ̀tọ́ lọ hàn.
- source_word: τῷ ὄρει τούτῳ
  choice: òkè yìí
  rationale: Ó pa àmì ìtọ́kasí òkè kan pàtó tí ó ṣeé ṣe kí ó wà níwájú wọn mọ́.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Kí a gbé ọ sókè, kí a sì jù ọ́ sínú òkun
  rationale: Ìṣètò aláìdárúkọ ẹni tó ṣe iṣẹ́ náà jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìṣe tí olùgbà ń gbà mọ́, ó sì dá àwòrán gbígbé àti jíju sínú òkun dúró.
- source_word: γενήσεται
  choice: yóò ṣẹlẹ̀
  rationale: Ó túmọ̀ ìṣẹ̀lẹ̀ ọjọ́ iwájú náà ní Yorùbá tó rọrùn, tó sì wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ọ̀rọ̀ nípa iṣẹ́ ìyanu
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: “Ìgbàgbọ́” ni ọ̀rọ̀ tó bá àyíká ìgbẹ́kẹ̀lé Ọlọ́run mu jù; “ìṣòtítọ́” yóò darí ọ̀rọ̀ náà sí ìwà ẹni ju ohun tí àyíká ń sọ lọ.
- issue: Bí a ṣe máa lóye ọ̀rọ̀ nípa gbígbé òkè
  choice: Pa àwòrán alágbára náà mọ́ láì pinnu bóyá ó jẹ́ ìlérí iṣẹ́ ìyanu ní tààràtà tàbí àkàwé nìkan
  alternative: Kà á sí ìṣípo òkè gidi nìkan; tàbí kà á sí àkàwé fún bíborí ìṣòro nìkan
  rationale: Ọ̀rọ̀ orísun náà kò yanjú ìfọ̀rọ̀wérọ̀ yìí; ìtumọ̀ náà gbọ́dọ̀ pa agbára àti ìṣòro ìtumọ̀ rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “mo wí fún yín” láti pa ìwọ̀ntúnwọ̀nsì àti ọlá gbolohun Jésù mọ́; a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
