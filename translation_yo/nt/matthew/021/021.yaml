review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Jesus’ response, the solemn affirmation, faith without doubt, the comparison with the fig tree, and the climactic command to the mountain. The impersonal Yoruba construction “Kí a gbé ọ sókè, kí a sì jù ọ́ sínú òkun” is an acceptable natural way to convey the Greek passive imperatives without specifying an agent.
  naturalness: 'The verse is fluent Standard Yoruba and maintains a suitably dignified contemporary biblical register. The main needed correction is in the footnote: “yẹ̀sẹ̀” means ‘stumble’ and is not an appropriate lexical alternative for διακριθῆτε in this context.'
  terminology: “Ìgbàgbọ́” appropriately renders πίστις, “ṣiyèméjì” naturally renders the primary sense of διακριθῆτε, and “igi ọ̀pọ̀tọ́” and “òkè” are suitable. The alternative ‘be divided in mind’ is more naturally expressed with “lọ́kàn méjì” than the current wording.
  issues:
  - severity: medium
    issue: The footnote’s alternative “tí ẹ kò sì yẹ̀sẹ̀” is semantically inaccurate.
    rationale: Yẹ̀sẹ̀ ordinarily means ‘stumble,’ whereas διακριθῆτε here denotes doubting, wavering, or being divided in mind. Replacing it with “tí ẹ kò sì lọ́kàn méjì” preserves a legitimate lexical nuance.
  revised_text: Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Lóòótọ́ ni mo wí fún yín, bí ẹ bá ní ìgbàgbọ́, tí ẹ kò sì ṣiyèméjì[a], kì í ṣe ohun tí a ṣe sí igi ọ̀pọ̀tọ́ nìkan ni ẹ ó ṣe; ṣùgbọ́n bí ẹ tilẹ̀ sọ fún òkè yìí pé, ‘Kí a gbé ọ sókè, kí a sì jù ọ́ sínú òkun,’ yóò ṣẹlẹ̀.”
  revised_footnotes:
  - marker: a
    text: Tàbí, “tí ẹ kò sì lọ́kàn méjì.”
    reason: lexical_alternative
  revision_rationale: Only the lexical-alternative footnote requires correction. The revised note gives an idiomatic Yoruba expression for the nuance ‘be divided in mind,’ while the main text rightly retains “ṣiyèméjì” (‘doubt’). No change to the verse itself is needed.
