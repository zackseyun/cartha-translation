  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: yo
  text: 'Ohunkóhun tí ẹ bá béèrè nínú àdúrà[a], ní ìgbàgbọ́[b], ẹ ó gbà.


    [a] Tàbí, “gbogbo ohun tí ẹ bá béèrè” tàbí “ohun gbogbo tí ẹ bá béèrè.”


    [b] Tàbí, “pẹ̀lú ìgbẹ́kẹ̀lé”; ọ̀rọ̀-ìṣe àfikún Gíríìkì náà fi hàn pé ìgbàgbọ́ ń bá ìbẹ̀bẹ̀ náà lọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ohun tí ẹ bá béèrè” tàbí “ohun gbogbo tí ẹ bá béèrè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pẹ̀lú ìgbẹ́kẹ̀lé”; ọ̀rọ̀-ìṣe àfikún Gíríìkì náà fi hàn pé ìgbàgbọ́ ń bá ìbẹ̀bẹ̀ náà lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Ohunkóhun tí
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ní èdè Gíríìkì ní ìtumọ̀ tó gbòòrò pé ‘ohunkóhun’ tàbí ‘gbogbo ohun tí’; ‘ohunkóhun tí’ jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìwọ̀n gbígbòòrò náà mọ́.
- source_word: ἂν αἰτήσητε
  choice: ẹ bá béèrè
  rationale: ἄν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive fi ohun tí a kò dá mọ́ pàtó hàn. Ìlò ‘bá’ nínú ‘ohunkóhun tí ẹ bá béèrè’ mú èyí jáde lọ́nà Yorùbá àdánidá láì sọ ọ́ di gbólóhùn àídájú tó lágbára ju ti Gíríìkì lọ.
- source_word: ἐν τῇ προσευχῇ
  choice: nínú àdúrà
  rationale: Èyí túmọ̀ ọ̀rọ̀-orúkọ Gíríìkì náà ní tààràtà, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu fún ohun tí a béèrè nígbà àdúrà.
- source_word: πιστεύοντες
  choice: nígbà tí ẹ ń gbàgbọ́
  rationale: Present participle náà ń tọ́ka sí ìgbàgbọ́ tó ń lọ papọ̀ pẹ̀lú bíbéèrè. Gbólóhùn yìí pa ìbáṣepọ̀ àkókò náà mọ́ láì yí i padà sí àídájú gbangba bí ‘bí ẹ bá gbàgbọ́.’
- source_word: λήμψεσθε
  choice: ẹ ó rí gbà
  rationale: Future indicative ti λαμβάνω ni; ‘ẹ ó rí gbà’ jẹ́ ọ̀nà Yorùbá tó bójú mu, tó ní iyì, fún ìlérí pé wọn yóò gba ohun náà.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ pẹ̀lú ìdáhùn sí àdúrà
  choice: nígbà tí ẹ ń gbàgbọ́
  alternative: bí ẹ bá gbàgbọ́
  rationale: Gíríìkì lo participle, kì í ṣe gbólóhùn àídájú gbangba. Ìtumọ̀ yìí so àdúrà àti ìgbàgbọ́ pọ̀ ṣùgbọ́n kò pinnu awuyewuye ẹ̀kọ́ ìgbàgbọ́ nípa ọ̀nà tàbí ààlà ìdáhùn sí àdúrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ni a lò. Gbólóhùn náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú àwọn ọ̀rọ̀-ìṣe ẹni kejì ọ̀pọ̀ nínú Gíríìkì.
