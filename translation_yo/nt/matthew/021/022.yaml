  terminology: A pa “àdúrà,” “ìgbàgbọ́,” àti “gbà” mọ́ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Yorùbá tó wọ́pọ̀ nínú ìforígbárí Bíbélì. A yọ “Ọlọ́run” kúrò nínú ìsàlẹ̀ b nítorí pé kò sí nínú gbolohun Gíríìkì náà, a sì tún “wọ́n” ṣe sí ìtọ́kasí ẹni kejì ọ̀pọ̀.
