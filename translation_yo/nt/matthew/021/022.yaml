  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbòò: “ohunkóhun tí ẹ bá béèrè” ń ṣàfihàn πάντα ὅσα ἂν αἰτήσητε, “nínú àdúrà” sì bá ἐν τῇ προσευχῇ mu. Ṣùgbọ́n “ẹ ó rí gbà” kì í ṣe ọ̀nà Yorùbá tó dára fún λήμψεσθε nínú ẹsẹ̀ yìí; “ẹ ó gbà” ni ìtumọ̀ tààràtà, adayeba. Àlàyé ìsàlẹ̀ b ti fi “Ọlọ́run” kún un, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà kò mẹ́nuba ẹni tí a gbàgbọ́ nínú Gíríìkì.'
