id: MAT.21.43
reference: Matthew 21:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: yo
  text: Nítorí náà, mo sọ fún yín pé, a ó gba ìjọba Ọlọ́run kúrò lọ́wọ́ yín, a ó sì fi í fún orílẹ̀-èdè kan[a] tí ń mú àwọn èso rẹ̀ jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹgbẹ́ ènìyàn kan.” Ọ̀rọ̀ Gíríìkì ἔθνος lè túmọ̀ sí orílẹ̀-èdè tàbí ẹgbẹ́ ènìyàn; níbí, èso tí ẹgbẹ́ náà ń mú jáde ni a fi dá a mọ̀, láì sọ ní pàtó sí i pé ta ni wọ́n.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ yìí hàn láti inú òwe àti ẹsẹ Ìwé Mímọ́ tó ṣáájú; ó sì jẹ́ ọ̀nà àdánidá láti sọ inference ní Yorùbá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín pé
  rationale: Ó pa ọ̀rọ̀ tí ẹni náà ń sọ tààrà àti àdírẹ́sì ọ̀pọ̀ ènìyàn mọ́ ní Yorùbá àdánidá.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: a ó gba ... kúrò lọ́wọ́ yín
  rationale: Ìṣe aláìdárúkọ ọjọ́ iwájú náà fi hàn pé a ó mú ohun tí wọ́n ní kúrò lọ́dọ̀ wọn; ‘kúrò lọ́wọ́ yín’ ṣe àfihàn ìyapa náà ní kedere.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Ó pa ìtumọ̀ gbígbòòrò βασιλεία mọ́—ìṣàkóso àti agbègbè ìjọba—láì dín in kù sí ọ̀kan ṣoṣo.
- source_word: δοθήσεται
  choice: a ó sì fi í fún
  rationale: Ọ̀rọ̀ yìí tún jẹ́ ìṣe aláìdárúkọ ọjọ́ iwájú; ‘a ó fi í fún’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì tọ́ka sí ìjọba náà pẹ̀lú arọ́pò-orúkọ.
- source_word: ἔθνει
  choice: orílẹ̀-èdè kan
  rationale: ἔθνος lè túmọ̀ sí orílẹ̀-èdè tàbí ẹgbẹ́ ènìyàn. ‘Orílẹ̀-èdè kan’ ni ìbámu ọ̀rọ̀ tó tààrà jù, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí àṣàyàn ‘ẹgbẹ́ ènìyàn kan’ hàn.
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: tí ń mú àwọn èso rẹ̀ jáde
  rationale: Ó pa participle ìṣe tó ń bá a lọ àti ọ̀pọ̀ ‘èso’ mọ́. ‘rẹ̀’ tọ́ka sí ìjọba Ọlọ́run, gẹ́gẹ́ bí ìbámu gírámà tó ṣeé ṣe jù.
theological_decisions:
- issue: Ẹni tí ἔθνει (‘orílẹ̀-èdè kan’) ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní gbogbogbò gẹ́gẹ́ bí ‘orílẹ̀-èdè kan,’ a kò sì sọ pé ìjọ, àwọn Kèfèrí, tàbí ìyókù Ísírẹ́lì ni pàtó.
  alternative: ‘ẹgbẹ́ ènìyàn kan,’ tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó sọ pé ìjọ tàbí àwọn Kèfèrí ni
  rationale: Gíríìkì náà sọ nípa ẹgbẹ́ kan tí èso rẹ̀ fi dá a mọ̀, ṣùgbọ́n kò fi dandan mọ ẹni tí ẹgbẹ́ náà jẹ́ ní pàtó; fífi ọ̀rọ̀ náà sílẹ̀ ní fífẹ̀ pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
- issue: Ìtumọ̀ ‘ìjọba Ọlọ́run’ nínú ọ̀rọ̀ ìdájọ́ yìí
  choice: A pa ‘ìjọba Ọlọ́run’ mọ́ láì ṣe àlàyé rẹ̀ gẹ́gẹ́ bí àǹfààní jíjẹ́ ti àwọn ènìyàn Ọlọ́run tàbí ìṣàkóso Ọlọ́run nìkan.
  alternative: ‘ìṣàkóso Ọlọ́run’ tàbí ‘àwọn àǹfààní ìjọba’
  rationale: Basileia ní ìwọ̀n ìtumọ̀ tó gbòòrò; àtúnsọ tó dín in kù yóò yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- issue: Ẹni tí αὐτῆς (‘rẹ̀’) ń tọ́ka sí
  choice: A jẹ́ kí ‘rẹ̀’ tọ́ka sí ìjọba Ọlọ́run, bí ìbámu abo ẹyọ gírámà Gíríìkì ṣe fi hàn.
  alternative: Kí a lóye èso náà gẹ́gẹ́ bí èso orílẹ̀-èdè náà
  rationale: αὐτῆς bá βασιλεία mu ní akọ-abo àti nọ́ńbà, kì í bá ἔθνει tó jẹ́ neuter mu; nítorí náà, ‘àwọn èso ìjọba náà’ ni ìtọ́kasí gírámà tó lágbára jù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ mímọ́lẹ̀, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. ‘A ó’ pa ìṣe aláìdárúkọ mọ́ láì sọ ẹni tó ṣe é ní pàtó, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà túmọ̀ sí ìṣe Ọlọ́run nínú àyíká.
