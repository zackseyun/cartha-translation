id: MAT.21.3
reference: Matthew 21:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá sì sọ ohunkóhun fún yín, ẹ ó sọ pé, ‘Olúwa nílò wọn,’ òun yóò sì rán wọn lọ lẹ́sẹ̀kẹsẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì kò sọ ẹni tí ó jẹ́ kókó-ọrọ̀ “yóò rán” ní gbangba. Ó ṣeé ṣe jù lọ pé ẹni tí ó bá yín sọ̀rọ̀ ni yóò rán àwọn ẹranko náà lọ lẹ́sẹ̀kẹsẹ̀; a tún lè lóye rẹ̀ pé, “Olúwa yóò sì rán wọn lọ lẹ́sẹ̀kẹsẹ̀.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐάν τις ... εἴπῃ τι
  choice: Bí ẹnikẹ́ni bá ... sọ ohunkóhun
  rationale: 'Ó pa ìtumọ̀ àídájú àti àìlópìn mọ́: ẹnikẹ́ni lè sọ ohunkóhun gẹ́gẹ́ bí ìbéèrè tàbí àtakò.'
- source_word: ὑμῖν
  choice: fún yín
  rationale: ‘Yín’ fi hàn ní kedere pé ọ̀pọ̀ ọmọ-ẹ̀yìn ni a ń bá sọ̀rọ̀.
- source_word: ἐρεῖτε
  choice: ẹ ó sọ
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí ní agbára ìtọ́ni; ‘ẹ ó sọ’ dúró sún mọ́ fọ́ọ̀mù Gíríìkì, ó sì bá èdè Yorùbá ọlọ́lá mu.
- source_word: Ὁ κύριος
  choice: Olúwa
  rationale: Ó pa oyè àti agbára κύριος mọ́ láì sọ ọ́ di ‘ọ̀gá’ tàbí ‘olówó’ nìkan.
- source_word: αὐτῶν χρείαν ἔχει
  choice: nílò wọn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ‘ní àìní wọn,’ àwọn ẹranko méjèèjì sì ni ‘wọn’ ń tọ́ka sí.
- source_word: εὐθὺς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìṣe tí kò ní ìdádúró hàn ní èdè Yorùbá òde òní.
- source_word: ἀποστελεῖ αὐτούς
  choice: òun yóò ... rán wọn lọ
  rationale: ‘Rán wọn lọ’ kò fi èrò ‘rán wọn padà’ tí kò sí nínú Gíríìkì kún un; ‘òun’ jẹ́ kí ẹni tí yóò ṣe ìṣe náà dúró gẹ́gẹ́ bí ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, bí ó tilẹ̀ jẹ́ pé Gíríìkì fúnra rẹ̀ kò sọ kókó-ọrọ̀ náà ní gbangba.
theological_decisions:
- issue: Ìtọ́kasí àti agbára Ὁ κύριος
  choice: Olúwa
  alternative: ọ̀gá; olówó wọn
  rationale: ‘Olúwa’ pa agbára oyè tí Jésù lò fún ara rẹ̀ mọ́, ó sì tún lè ṣiṣẹ́ nínú ọ̀rọ̀ ìṣẹ̀lẹ̀ náà láì sọ ní pàtó pé olówó àwọn ẹranko ni.
- issue: Ẹni tí ó jẹ́ kókó-ọrọ̀ ἀποστελεῖ
  choice: Ẹni tí ó bá wọn sọ̀rọ̀ ni ó ṣeé ṣe jù lọ pé yóò rán àwọn ẹranko lọ
  alternative: Olúwa ni yóò rán wọn lọ
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì kò ní arọ́pò-orúkọ kókó-ọrọ̀ ní gbangba. Nínú ìṣàn gbólóhùn, ẹni tí ó bá àwọn ọmọ-ẹ̀yìn sọ̀rọ̀ ni ìtọ́kasí tó ṣeé ṣe jù lọ, ṣùgbọ́n a kò gbọ́dọ̀ pa àìdájú gírámà náà mọ́lẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ àti ‘yín’ fún ọ̀pọ̀ ènìyàn; a fi àmì ohùn sí ibi tí ó yẹ. ‘Lẹ́sẹ̀kẹsẹ̀’ jẹ́ àdánidá ju àtúmọ̀ gígùn lọ, ‘rán wọn lọ’ sì pa ìtumọ̀ ἀποστέλλω mọ́ láì fi ‘padà’ kún un.
