reference: Matthew 21:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: yo
  text: Ẹni tí ó bá ṣubú sórí òkúta yìí yóò fọ́ sí wẹ́wẹ́; ṣùgbọ́n ẹni tí òkúta náà bá ṣubú lé lórí, yóò lọ ọ́ lulú.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn ìwé-àfọwọ́kọ Mátíù kan, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ tí ó jọ ọ́ wà ní Lúùkù 20:18.
    reason: textual_variant
  - marker: b
    text: Tàbí, “yóò lọ ọ́ di erùpẹ̀” tàbí “yóò tú u ká bí ìyàngbò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: Ẹni tí ó bá ṣubú
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí ó ní àpilẹ̀kọ yìí ń tọ́ka sí ẹnikẹ́ni ní ọ̀nà àkàwé; “Ẹni tí ó bá ṣubú” jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ẹyọ àti ti gbogbo ènìyàn mọ́.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: lu òkúta yìí
  rationale: “Lu” sọ ìṣubú tí ó dé ara òkúta ní Yorùbá àdánidá, “òkúta” sì pa àwòrán λίθος àti ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àyíká ọ̀rọ̀.
- source_word: συνθλασθήσεται
  choice: ni a ó fọ́ túútúú
  rationale: Ìsọ̀rí ọ̀rọ̀ náà jẹ́ ọjọ́ iwájú aláìṣe, ó sì túmọ̀ sí pé ẹni náà yóò fọ́ sí wẹ́wẹ́. Èyí pa ìyàtọ̀ rẹ̀ mọ́ sí λικμήσει.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ṣùgbọ́n ẹni tí òkúta náà bá ṣubú lé lórí
  rationale: 'Gbólóhùn yìí yí ipa ìṣubú padà: òkúta ni ó ń ṣubú. “Ẹni tí ... bá” fi ìtumọ̀ àìsọ-ẹni-kan-pàtó tí ἄν ní hàn ní Yorùbá àdánidá.'
- source_word: λικμήσει
  choice: yóò lọ̀ ọ́ lúúlúú
  rationale: Ọ̀rọ̀-ìṣe náà lè ṣàpèjúwe lílọ ohun kan di kíkúnrẹ́rẹ́ bí erùpẹ̀ tàbí pípín rẹ̀ ká bí ìyàngbò; “lọ̀ ... lúúlúú” jẹ́ alágbára, ó sì yàtọ̀ sí “fọ́ túútúú.”
- source_word: αὐτόν
  choice: ọ́
  rationale: Arọ́pò-orúkọ ẹyọ yìí ń padà tọ́ka sí ẹni tí a mẹ́nu kàn; Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni kẹta, nítorí náà “ọ́” jẹ́ ìbámu gírámà tó péye.
theological_decisions:
- issue: Àwòrán òkúta àti àkàwé ìdájọ́
  choice: A fi “òkúta” àti ìṣe méjèèjì—fífẹ́ túútúú àti lílọ lúúlúú—sílẹ̀ gẹ́gẹ́ bí orísun ṣe sọ.
  alternative: Kí a ṣàlàyé nínú ọ̀rọ̀ pàtàkì pé òkúta náà ni Mèsáyà/Jésù, tàbí kí a sọ ìṣe méjèèjì di ọ̀rọ̀ ìparun kan náà.
  rationale: Àyíká ọ̀rọ̀ ló ń ṣàlàyé ẹni tí òkúta náà dúró fún; ẹsẹ yìí fúnra rẹ̀ jẹ́ àkàwé. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìtumọ̀ kún ọ̀rọ̀, kò sì dín líle ìdájọ́ kù.
- issue: Ìtọ́ka ẹyọ sí ẹni kan
  choice: Lo arọ́pò-orúkọ ẹyọ “ọ́.”
  alternative: Lo ọ̀rọ̀ púpọ̀ tàbí tún “ẹni náà” sọ.
  rationale: αὐτόν jẹ́ ẹyọ. Bí ó tilẹ̀ jẹ́ pé Yorùbá kò samisi akọ nínú arọ́pò-orúkọ yìí, “ọ́” pa iye ẹyọ àti ìtọ́ka rẹ̀ mọ́ láìfi akọ tàbí abo tí èdè kò béèrè kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Fọ́ túútúú” àti “lọ̀ ... lúúlúú” jẹ́ ọ̀rọ̀ tí aráàlú lè lóye, wọ́n sì pa ìyàtọ̀ láàárín àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì mọ́. Àwọn àmì àlàyé ni a so mọ́ gbólóhùn tí ọ̀kọ̀ọ̀kan ṣàlàyé.
