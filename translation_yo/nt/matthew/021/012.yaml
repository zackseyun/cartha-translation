review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi ἱερόν hàn gẹ́gẹ́ bí àgbègbè/àgbàlá tẹ́ńpìlì, ó sì pa ‘gbogbo’ àwọn olùtà àti olùrà mọ́. Ṣùgbọ́n ‘do ... dé’ kò ṣe kedere tó fún κατέστρεψεν (‘yí sílẹ̀/da ṣubú’), àti ‘ìjókòó’ lè túmọ̀ sí ìṣe jíjókòó ju ohun èlò ìjókòó lọ.
  naturalness: ‘Àwọn apàṣípààrọ̀ owó’ jẹ́ ọ̀nà tó rọrùn àti tó dáa jù ‘àwọn onípàṣípààrọ̀ owó’ lọ. ‘Àga’ sì jẹ́ ọ̀rọ̀ àdánidá fún καθέδρας nínú àyíká yìí. Àtúnṣe náà tún so gbolohun kejì pọ̀ mọ́ ìṣe Jésù ní kedere.
  terminology: ‘Àgbàlá tẹ́ńpìlì’ yẹ fún ἱερόν nínú ẹsẹ̀ yìí; ‘tẹ́ńpìlì’ ni a pa mọ́ nínú àlàyé ìsàlẹ̀. ‘Àdàbà’ dáa fún περιστεράς.
  issues:
  - severity: medium
    issue: ‘Ó do tábìlì ... dé’
    rationale: Gbólóhùn náà kò jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání láti sọ pé ó yí àwọn tábìlì àti àga sílẹ̀; ó lè dà bí ẹni pé ó tẹ̀ wọ́n mọ́lẹ̀.
  - severity: medium
    issue: ‘ìjókòó’ fún καθέδρας
    rationale: ‘Ìjókòó’ sábà máa ń tọ́ka sí jíjókòó tàbí ibi ìjókòó ní gbòòrò; ‘àga’ ń sọ ohun èlò tí a yí padà nínú ìtàn náà ní kedere.
  - severity: low
    issue: ‘onípàṣípààrọ̀ owó’
    rationale: Ó ṣeé lóye, ṣùgbọ́n ‘apàṣípààrọ̀ owó’ jẹ́ àkójọpọ̀ ọ̀rọ̀ tí ó rọrùn sí i fún ẹni tí ń ṣe ìpàṣípààrọ̀ owó.
