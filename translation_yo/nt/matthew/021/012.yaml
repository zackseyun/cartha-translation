revisions:
- from: Jésù sì wọ inú àgbàlá tẹ́ńpìlì, ó sì lé gbogbo àwọn tí ń tà àti àwọn tí ń rà ní àgbàlá tẹ́ńpìlì náà jáde[a]. Ó do tábìlì àwọn onípàṣípààrọ̀ owó dé, àti ìjókòó àwọn tí ń ta àdàbà.
  to: Jésù sì wọ inú àgbàlá tẹ́ńpìlì, ó sì lé gbogbo àwọn tí ń tà àti tí ń rà nínú àgbàlá tẹ́ńpìlì jáde[a]. Ó sì yí àwọn tábìlì àwọn apàṣípààrọ̀ owó àti àwọn àga àwọn tí ń ta àdàbà sílẹ̀.
  rationale: A tún ọ̀rọ̀ ìṣe tí ó túmọ̀ sí ‘overturned’ ṣe sí ‘yí ... sílẹ̀,’ a sì rọ́pò ‘ìjókòó’ pẹ̀lú ‘àga’ láti fi ohun èlò ìjókòó hàn dáadáa. Àtúnṣe náà kò yí ìwọ̀n ìṣe náà, ibi tí ἱερόν ń tọ́ka sí, tàbí ìtumọ̀ ẹsẹ̀ náà padà.
  reviewer_model: gpt-5.6-terra
