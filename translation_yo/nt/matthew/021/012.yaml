id: MAT.21.12
reference: Matthew 21:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: yo
  text: Jésù sì wọ inú àgbàlá tẹ́ńpìlì, ó sì lé gbogbo àwọn tí ń tà àti tí ń rà nínú àgbàlá tẹ́ńpìlì jáde[a]. Ó sì yí àwọn tábìlì àwọn apàṣípààrọ̀ owó àti àwọn àga àwọn tí ń ta àdàbà sílẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tẹ́ńpìlì” tàbí “àgbègbè tẹ́ńpìlì”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: àgbàlá tẹ́ńpìlì
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan; “àgbàlá tẹ́ńpìlì” sì jẹ́ kí ibi tí òwò náà ti ń lọ ṣe kedere.
- source_word: ἐξέβαλεν
  choice: lé ... jáde
  rationale: Èyí fi hàn pé ó fi agbára lé wọn kúrò níbẹ̀, ní èdè Yorùbá tó ṣe déédé.
- source_word: πάντας
  choice: gbogbo
  rationale: A pa ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́, pé gbogbo àwọn tó ń ṣe òwò níbẹ̀ ni ọ̀rọ̀ náà kàn.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: àwọn tí ń tà àti àwọn tí ń rà
  rationale: Èyí tẹ̀ lé àwọn participle Gíríìkì méjèèjì, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: τράπεζας
  choice: tábìlì
  rationale: Ọ̀rọ̀ náà túmọ̀ sí tábìlì; àyíká ẹsẹ̀ náà ṣàlàyé pé àwọn pàṣípààrọ̀ owó ló ń lò wọ́n.
- source_word: κολλυβιστῶν
  choice: àwọn onípàṣípààrọ̀ owó
  rationale: Èyí ń ṣàpèjúwe àwọn tó ń pàṣípààrọ̀ owó tàbí ẹyọ owó ní kedere.
- source_word: κατέστρεψεν
  choice: do ... dé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí yí ohun èlò padà dé, kì í ṣe dandan pé ó pa á run.
- source_word: καθέδρας
  choice: ìjókòó
  rationale: Èyí ni ìtumọ̀ gbòòrò àti àdánidá fún ohun tí àwọn olùtajà jókòó lé.
- source_word: περιστεράς
  choice: àdàbà
  rationale: “Àdàbà” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún ẹyẹ tí a ń lò fún ẹbọ ní àyíká yìí.
theological_decisions:
- issue: Ìwọ̀n ibi tí ἱερόν ń tọ́ka sí nínú iṣẹ́ Jésù
  choice: Jésù wọ àgbàlá tàbí àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ gan-an.
  alternative: Jésù wọ tẹ́ńpìlì, láì sọ ibi pàtó nínú àgbègbè náà.
  rationale: Ìyàtọ̀ ibi yìí ṣe pàtàkì fún ìtàn àti ìṣètò tẹ́ńpìlì. “Àgbàlá tẹ́ńpìlì” yẹra fún fífi hàn pé Jésù wọ ibi mímọ́ inú ilé náà.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn níbi tí ó bá yẹ, pẹ̀lú ìṣàfihàn ọ̀wọ̀ àti ìtumọ̀ tó rọrùn fún òǹkàwé òde òní. A lo “tẹ́ńpìlì” nítorí pé ó jẹ́ ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, a sì fi “àgbàlá” ṣàlàyé ìwọ̀n ἱερόν.
