id: MAT.21.46
reference: Matthew 21:46
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé wọ́n ń wá láti mú un, wọ́n bẹ̀rù àwọn ènìyàn, nítorí àwọn ènìyàn náà kà á sí wòlíì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn náà gbà pé wòlíì ni,” tàbí “wọ́n ní í gẹ́gẹ́ bí wòlíì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: Bí ó tilẹ̀ jẹ́ pé wọ́n ń wá ọ̀nà
  rationale: 'Ọ̀rọ̀ alábápín àkókò ìsinsìnyí yìí fi ìfẹ́ tàbí ìgbìyànjú tí ń bá a lọ hàn; ìtumọ̀ yìí sì mú ìtakora ọ̀rọ̀ inú àyíká náà jáde: wọ́n fẹ́ mú un, ṣùgbọ́n ẹ̀rù dá wọn dúró.'
- source_word: κρατῆσαι
  choice: láti mú un
  rationale: Nínú àyíká ọ̀tá yìí, ó túmọ̀ sí lílé ẹni mú tàbí sí fífi agbára mú un, kì í ṣe fífi ọwọ́ kàn án lásán. ‘Mú un’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún lílé ẹni mú ní irú àyíká yìí.
- source_word: ἐφοβήθησαν
  choice: ẹ̀rù àwọn èrò sì ń bà wọ́n
  rationale: Ó sọ ìbẹ̀rù wọn fún àwọn èrò ní ọ̀nà Yorùbá tí ó ṣe déédé, láìfi dandan sọ pé ẹ̀rù náà ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ nígbà yẹn.
- source_word: τοὺς ὄχλους
  choice: àwọn èrò
  rationale: Ọ̀pọ̀ nọ́ńbà náà tọ́ka sí ọ̀pọ̀ àwọn ènìyàn tí ó péjọ; ‘àwọn èrò’ jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἐπεὶ εἰς
  choice: nítorí
  rationale: Ó mú ìdí tí wọ́n fi bẹ̀rù àwọn èrò wọlé ní kedere.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: àwọn èrò ka a sí wòlíì
  rationale: Àpólà yìí jẹ́ àṣà ọ̀rọ̀ tó túmọ̀ sí pé àwọn èrò gbà pé ó jẹ́ wòlíì. ‘Ka a sí’ pa ojú ìwòye àwọn èrò mọ́ láìsọ ohunkóhun tó kọjá ohun tí ẹsẹ náà sọ.
- source_word: προφήτην
  choice: wòlíì
  rationale: ‘Wòlíì’ jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ẹni tí ń sọ ọ̀rọ̀ Ọlọ́run; nínú àgbékalẹ̀ ‘ka a sí,’ kò nílò àfihàn àìlẹ́gbẹ́ míì.
theological_decisions:
- issue: Bí a ṣe máa tú ìwòye àwọn èrò nípa Jésù gẹ́gẹ́ bí προφήτην láìfi ẹ̀kọ́ nípa ẹni tí Kristi jẹ́ kún un tàbí yọ ọ́ kúrò
  choice: àwọn èrò ka a sí wòlíì
  alternative: àwọn èrò gbà pé wòlíì ni
  rationale: Ẹsẹ náà ń ròyìn ohun tí àwọn èrò rò nípa Jésù, kì í ṣe àlàyé pípé nípa ẹni tí ó jẹ́. Ìtumọ̀ náà pa ojú ìwòye ìtàn mọ́, kò sì túmọ̀ sí pé wòlíì nìkan ni Jésù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. A lo ‘àwọn èrò’ fún ọ̀pọ̀ ènìyàn tí ó péjọ, ‘mú un’ fún lílé ẹni mú nínú àyíká ọ̀tá, àti ‘ka a sí wòlíì’ láti pa àṣà ọ̀rọ̀ Gíríìkì àti ojú ìwòye àwọn èrò mọ́.
