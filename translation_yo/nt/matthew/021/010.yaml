id: MAT.21.10
reference: Matthew 21:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: yo
  text: Nígbà tí ó wọ Jerúsálẹ́mù, gbogbo ìlú náà dàrú[a], wọ́n ń wí pé, “Ta ni èyí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlú náà mì.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìmìtìtì ní ti ara tàbí, gẹ́gẹ́ bí ó ti rí níbí, ìdàrúdàpọ̀ láàárín àwọn ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Nígbà tí ó wọ
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò tó bá Yorùbá mu, láì sọ pé ó ṣẹlẹ̀ ṣáájú tàbí lẹ́yìn ìwọlé náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ìkọ̀wé orúkọ ìlú Jerusalem tí ó wọ́pọ̀ nínú Yorùbá, pẹ̀lú àmì ohùn.
- source_word: ἐσείσθη
  choice: rú sókè
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mímì ní ti ara, ṣùgbọ́n níbí ó ṣàpèjúwe bí gbogbo ìlú ṣe dàrú tàbí ṣe ru nítorí ìwọlé Jesu. ‘Rú sókè’ jẹ́ àdánidá ní Yorùbá, ó sì ṣì pa àwòrán ìdàrúdàpọ̀ mọ́.
- source_word: πᾶσα ἡ πόλις
  choice: gbogbo ìlú náà
  rationale: Èyí fi ìtumọ̀ pé gbogbo àwọn ará ìlú ni ìṣẹ̀lẹ̀ náà kàn hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: λέγουσα
  choice: wọ́n ń wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ‘ìlú’ ni ó jẹ́ kókó ọ̀rọ̀ ní Gíríìkì, Yorùbá máa ń lo ọ̀pọ̀ ènìyàn ‘wọ́n’ láti tọ́ka sí àwọn ará ìlú; ‘ń wí pé’ pa iṣẹ́ participle náà mọ́ láì túmọ̀ ọ́ sí ‘béèrè’.
- source_word: Τίς ἐστιν οὗτος;
  choice: Ta ni èyí?
  rationale: Ìtumọ̀ tààrà àti àdánidá ni; a kò fi ‘ọkùnrin’ kún un nítorí kò sí nínú Gíríìkì.
theological_decisions:
- issue: Bóyá ìhùwàsí ìlú náà jẹ́ mímì ní ti ara tàbí ìdàrúdàpọ̀ àwùjọ
  choice: A lo ‘rú sókè’ gẹ́gẹ́ bí àpèjúwe ìdàrúdàpọ̀ gbogbo ìlú.
  alternative: ‘mì tìtì’ tàbí ‘gbọn’ ní ti ara
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìhùwàsí àwọn ará ìlú sí ìwọlé Jesu, kì í ṣe nípa ìsẹ̀lẹ̀ ilẹ̀ mímì; síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ gangan ti ọ̀rọ̀ Gíríìkì hàn.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà rọrùn fún òǹkàwé lásán, ó sì yẹra fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
