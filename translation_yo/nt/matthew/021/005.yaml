id: MAT.21.5
reference: Matthew 21:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: yo
  text: Ẹ sọ fún ọmọbìnrin Síónì pé, “Wò ó, ọba rẹ ń bọ̀ wá sọ́dọ̀ rẹ; ó jẹ́ onírẹ̀lẹ̀[a], ó sì gùn lórí kẹ́tẹ́kẹ́tẹ́, àti lórí ọmọ ẹranko kan[b], ọmọ ẹranko tí a fi ń ru ẹrù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹni pẹ̀lẹ́” tàbí “ọlọ́kàn tútù.” Ọ̀rọ̀ Gíríìkì πραΰς lè túmọ̀ sí ẹni pẹ̀lẹ́, onírẹ̀lẹ̀, tàbí ọlọ́kàn tútù; ó sì ń tọ́ka sí Sekaráyà 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Mátíù pa ọ̀rọ̀ àsọtẹ́lẹ̀ náà mọ́ pẹ̀lú àwọn gbólóhùn ẹranko méjì tí a so pọ̀: “lórí kẹ́tẹ́kẹ́tẹ́, àti lórí ọmọ ẹranko kan, ọmọ ẹranko tí a fi ń ru ẹrù.”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Ẹ sọ fún
  rationale: Ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn ni; ‘Ẹ sọ fún’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára àṣẹ náà mọ́.
- source_word: τῇ θυγατρὶ Σιών
  choice: ọmọbìnrin Síónì
  rationale: Ó pa àkàwé àsọtẹ́lẹ̀ tí ó fi Síónì hàn bí obìnrin mọ́, dípò yíyí i padà sí ‘àwọn ènìyàn Síónì.’
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pe olùgbọ́ láti kíyè sí ohun tí ó tẹ̀ lé, ní èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: ὁ βασιλεύς σου
  choice: ọba rẹ
  rationale: Ó ṣe àfihàn ìbátan ọba náà sí Síónì ní tààràtà, ó sì pa ìtumọ̀ ọba/Mèsáyà mọ́.
- source_word: ἔρχεταί σοι
  choice: ń bọ̀ wá sọ́dọ̀ rẹ
  rationale: Àmì ‘ń’ mú ìṣe tí ń ṣẹlẹ̀ tàbí tí ó sún mọ́lé hàn, ‘sọ́dọ̀ rẹ’ sì túmọ̀ sí pé ó ń tọ̀ ọ́ wá.
- source_word: πραῢς
  choice: ọlọ́kàn tútù
  rationale: Ó sọ ìwà pẹ̀lẹ́, àìlèèrú àti àìfipáni hàn ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ fi ‘onírẹ̀lẹ̀’ sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tó ṣeé ṣe.
- source_word: ἐπιβεβηκὼς
  choice: ó sì gun
  rationale: ‘Gun’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún jíjókòó tàbí rírìn lórí ẹranko; ó bá àkójọpọ̀ gbólóhùn náà mu dáadáa.
- source_word: ἐπὶ ὄνον
  choice: kẹ́tẹ́kẹ́tẹ́
  rationale: Èyí ni orúkọ Yorùbá tó ṣe kedere fún ὄνος.
- source_word: πῶλον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́ kan
  rationale: Nínú àyíká yìí πῶλος túmọ̀ sí ọmọ ẹranko, gbólóhùn tó tẹ̀ lé sì mú irú ẹranko náà ṣe kedere.
- source_word: υἱὸν ὑποζυγίου
  choice: ọmọ ẹranko tí a fi ń ru ẹrù
  rationale: Ó tú àkànlò èdè Sémítì náà sí Yorùbá àdánidá, ó sì pa àwòrán ẹranko iṣẹ́ tí ń ru ẹrù mọ́.
theological_decisions:
- issue: Àyọlò àsọtẹ́lẹ̀ Mèsáyà láti Sekaráyà 9:9 àti bóyá kí a mú ọ̀rọ̀ Mátíù bá ẹ̀dà Majẹmu Láéláé mu
  choice: 'A tẹ̀ lé ọ̀rọ̀ Gíríìkì Mátíù, pẹ̀lú àwọn ọ̀rọ̀ ẹranko méjì tí a so pọ̀: ‘kẹ́tẹ́kẹ́tẹ́, àti ọmọ kẹ́tẹ́kẹ́tẹ́ kan.’'
  alternative: Kí a lo ‘onírẹ̀lẹ̀’ láti bá àwọn ìtumọ̀ Sekaráyà 9:9 kan mu, tàbí kí a da àwọn ọ̀rọ̀ ẹranko méjèèjì pọ̀ bí ẹni pé ẹranko kan ṣoṣo ni.
  rationale: Ìtumọ̀ náà kò gbọ́dọ̀ fi ipa mú ọ̀rọ̀ Mátíù bá ẹ̀dà àsọtẹ́lẹ̀ mìíràn mu. Ó pa ìṣòro àti ìṣe pàtàkì ọ̀rọ̀ ẹranko méjèèjì nínú ìròyìn Mátíù mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. ‘Ọmọbìnrin Síónì’ pa ìsọ-ẹni-di-nǹkan àsọtẹ́lẹ̀ mọ́; ‘Wò ó’ sì jẹ́ ìpè àdánidá láti kíyè sí ohun tó ń bọ̀.
