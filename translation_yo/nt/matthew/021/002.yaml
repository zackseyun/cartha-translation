  source_fidelity: Ìtumọ̀ náà ṣàfihàn ìlànà Gíríìkì, àṣẹ púpọ̀, ìyára εὐθέως, kẹ́tẹ́kẹ́tẹ́ tí a dè, àti ìlànà ‘tú ... mú wá’ dáadáa. Ṣùgbọ́n ‘ọmọ rẹ̀’ sọ ìbátan ìbí di ìdánilójú, nígbà tí πῶλον μετ’ αὐτῆς kan sọ ọmọ-ẹranko kan tó wà pẹ̀lú abo kẹ́tẹ́kẹ́tẹ́ náà. A tún nílò láti ṣàtúnṣe àlàyé footnote c kí ó má ṣe yí participle náà sí gbolohun ipò ‘tí ẹ bá’.
  naturalness: Yorùbá náà jẹ́ kedere, ó sì ba ìforúkọsílẹ̀ ìtàn ọlọ́wọ̀ mu. ‘Ọmọ kẹ́tẹ́kẹ́tẹ́ kan pẹ̀lú rẹ̀’ jẹ́ àdánidá, ó sì yàgò fún àtúnlò ‘ọmọ rẹ̀ pẹ̀lú rẹ̀’.
  terminology: ‘Abúlé,’ ‘abo kẹ́tẹ́kẹ́tẹ́,’ ‘kẹ́tẹ́kẹ́tẹ́,’ ‘dè,’ àti ‘mú ... wá fún mi’ yẹ fún ìtumọ̀ yìí. ‘Ọmọ kẹ́tẹ́kẹ́tẹ́’ ṣàlàyé πῶλον dáadáa láì fi ìbátan ìbí tí a kò sọ ní kedere kún un.
