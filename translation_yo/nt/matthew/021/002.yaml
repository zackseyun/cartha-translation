id: MAT.21.2
reference: Matthew 21:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: yo
  text: ó wí fún wọn pé, “Ẹ lọ sí abúlé tí ó wà ní òdìkejì yín,[a] lẹ́sẹ̀kẹsẹ̀ ẹ ó sì rí abo kẹ́tẹ́kẹ́tẹ́ kan tí a dè, àti ọmọ kẹ́tẹ́kẹ́tẹ́ kan pẹ̀lú rẹ̀.[b] Ẹ tú wọn, kí ẹ sì mú wọn wá fún mi.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí ó wà ní iwájú yín” tàbí “tí ó wà ní ìhà kejì sí yín.”
    reason: lexical_alternative
  - marker: b
    text: Níhìn-ín, “ọmọ kẹ́tẹ́kẹ́tẹ́” túmọ̀ sí kẹ́tẹ́kẹ́tẹ́ kékeré, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, ọ̀rọ̀ náà ní participle kan, “nígbà tí ẹ ti tú wọn,” lẹ́yìn rẹ̀ ni àṣẹ náà, “ẹ mú wọn wá fún mi”; Yorùbá àdánidá lè sọ ọ́ gẹ́gẹ́ bí àṣẹ méjì tí ó tẹ̀ lé ara wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: ó wí fún wọn pé
  rationale: Ó ṣe àfihàn ọ̀rọ̀ alábápín tí ó ṣí ọ̀rọ̀ Jésù sílẹ̀ ní Yorùbá àdánidá.
- source_word: Πορεύεσθε
  choice: Ẹ lọ
  rationale: Àṣẹ púpọ̀ ni; “Ẹ lọ” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ìtàn mu.
- source_word: κώμην
  choice: abúlé
  rationale: κώμη ń tọ́ka sí abúlé dípò ìlú ńlá; “abúlé” ni ìbámu Yorùbá tó wọ́pọ̀.
- source_word: κατέναντι ὑμῶν
  choice: tí ó wà ní òdìkejì yín
  rationale: Ó pa ìtumọ̀ ibi tí ó dojú kọ tàbí tí ó wà kọjá sí wọn mọ́ láì pinnu ju ẹ̀rí Gíríìkì lọ.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó mú agbára àkókò ti εὐθέως jáde gẹ́gẹ́ bí “ní kánkán/lójú ẹsẹ̀.”
- source_word: ὄνον δεδεμένην
  choice: abo kẹ́tẹ́kẹ́tẹ́ kan tí a dè
  rationale: Ìbálòpọ̀ abo tí fọ́ọ̀mù Gíríìkì àti αὐτῆς fi hàn ni a sọ gbangba, èyí sì mú ìbáṣepọ̀ rẹ̀ pẹ̀lú ọmọ náà yéni.
- source_word: πῶλον μετ’ αὐτῆς
  choice: ọmọ rẹ̀ pẹ̀lú rẹ̀
  rationale: Nínú àyíká yìí πῶλος jẹ́ ọmọ kẹ́tẹ́kẹ́tẹ́; “ọmọ rẹ̀” jẹ́ adayeba, ó sì pa ìbáṣepọ̀ àwọn ẹranko méjèèjì mọ́.
- source_word: λύσαντες ἀγάγετέ μοι
  choice: Ẹ tú wọn, kí ẹ sì mú wọn wá fún mi
  rationale: A tú participle tí ó ṣáájú àṣẹ sí ìtẹ̀lé àṣẹ méjì ní Yorùbá, láì pàdánù ìtumọ̀ pé kí wọ́n kọ́kọ́ tú wọn, lẹ́yìn náà kí wọ́n mú wọn wá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, àti àdánidá fún òǹkàwé òde òní. A lo “abo kẹ́tẹ́kẹ́tẹ́” láti jẹ́ kí αὐτῆς àti ìbáṣepọ̀ ẹranko náà pẹ̀lú ọmọ rẹ̀ ṣe kedere.
