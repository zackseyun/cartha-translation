id: MAT.21.41
reference: Matthew 21:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: yo
  text: Wọ́n wí fún un pé, “Yóò pa àwọn ènìyàn búburú wọ̀nyẹn run lọ́nà búburú, yóò sì yá ọgbà àjàrà náà fún àwọn àgbẹ̀ mìíràn[a], àwọn tí yóò fi èso[b] fún un ní àwọn àkókò tí ó yẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò yá ọgbà àjàrà náà fún àwọn ayálégbé mìíràn láti máa ṣiṣẹ́ ilẹ̀ náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àbájáde ọgbà náà”; ìyẹn ni èso tí ó yẹ kí wọ́n fi fún un ní àkókò tí ó yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Wọ́n sì wí fún un pé
  rationale: A tú present historical náà sí ìṣe àtijọ́, gẹ́gẹ́ bí ìtàn Yorùbá ṣe máa ń ṣàn lọ́nà àdánidá.
- source_word: Κακοὺς κακῶς
  choice: Àwọn ènìyàn búburú wọ̀nyẹn ni ... fi ìparun búburú run
  rationale: Àtúnlò gbòǹgbò ‘búburú’ ń gbìyànjú láti pa eré-ọ̀rọ̀ àti ìmúná ìdájọ́ inú Gíríìkì mọ́ láìjẹ́ kí Yorùbá le koko ju.
- source_word: ἀπολέσει
  choice: yóò ... run
  rationale: ‘Run’ fi ìdájọ́ líle hàn, ṣùgbọ́n kò pinnu ọ̀nà pàtó tí ìparun náà yóò gbà wá.
- source_word: τὸν ἀμπελῶνα
  choice: ọgbà àjàrà náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún vineyard, ó sì pa àwòrán iṣẹ́ ọgbà àjàrà mọ́.
- source_word: ἐκδώσεται
  choice: yóò ... ya
  rationale: Nínú àyíká ohun-ìní oko, ‘fi ... ya’ túmọ̀ sí fífi ọgbà fún àwọn ayálégbé lábẹ́ àdéhùn, kì í ṣe fífi í fún wọn ní ọ̀fẹ́.
- source_word: ἄλλοις γεωργοῖς
  choice: àwọn àgbẹ̀ mìíràn
  rationale: ‘Àgbẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn olùṣọ́ tàbí olùroko ilẹ̀; ìṣe ‘ya’ ló ń sọ ipò ayálégbé wọn di mímọ̀.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: wọn yóò máa fi ... fún un
  rationale: Ìtumọ̀ náà ń fi hàn pé wọn yóò san ohun tó tọ́ sí olúwa ọgbà, láìfi ọ̀rọ̀ ìṣúná kan tí Gíríìkì kò sọ kún un.
- source_word: τοὺς καρποὺς
  choice: èso rẹ̀
  rationale: ‘Èso’ pa àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ àpẹẹrẹ rẹ̀ mọ́; arọ́pò-orúkọ náà mú un ṣe kedere pé èso ọgbà àjàrà ni.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: ní àwọn àkókò tí ó yẹ
  rationale: Èyí pa èrò àwọn àkókò tí a yàn tàbí tí ó bójú mu mọ́, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Bí ìdájọ́ àwọn ayálégbé ṣe le àti irú rẹ̀
  choice: yóò fi ìparun búburú run àwọn ènìyàn búburú wọ̀nyẹn
  alternative: yóò pa àwọn ènìyàn búburú wọ̀nyẹn run pátápátá
  rationale: Ìtumọ̀ yìí pa eré-ọ̀rọ̀ κακοὺς κακῶς àti líle ìdájọ́ mọ́, ṣùgbọ́n kò fi ẹ̀kọ́ ìgbàgbọ́ kan nípa ọ̀nà tàbí àbájáde ìjìyà tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn kíkún; ọ̀nà ọ̀rọ̀ jẹ́ ọlọ́lá, ó ṣe kedere fún òǹkàwé òde òní. A pa ìtẹnumọ́ àti eré-ọ̀rọ̀ Gíríìkì mọ́ níwọ̀n tí Yorùbá àdánidá gbà.
