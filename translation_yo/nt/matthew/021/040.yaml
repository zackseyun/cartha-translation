source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: yo
  text: Nítorí náà, nígbà tí ẹni tó ni[a] ọgbà àjàrà bá dé, kí ni yóò ṣe sí àwọn àgbẹ̀ wọ̀nyẹn[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘olúwa ọgbà àjàrà.’ Ọ̀rọ̀ Gíríìkì náà ni kyrios, tí a sábà máa ń túmọ̀ sí ‘Olúwa’; ṣùgbọ́n níbí, ó ń tọ́ka sí ẹni tó ni ọgbà náà nínú àkàwé.
    reason: lexical_alternative
  - marker: b
    text: Àyíká àkàwé náà fi hàn pé àwọn àgbẹ̀ wọ̀nyí jẹ́ àwọn tó yá ọgbà náà. Síbẹ̀, ọ̀rọ̀ Gíríìkì fúnra rẹ̀ túmọ̀ sí ‘àgbẹ̀’ tàbí ‘olùgbìn’ ní gbogbogbòò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: 'Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ àkókò ìṣẹ̀lẹ̀ tí a ń retí: ‘nígbà tí ... bá dé.’'
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìtumọ̀ ìyọrísí tàbí ìbéèrè tó jáde láti inú ohun tí a ṣẹ̀ṣẹ̀ sọ mọ́.
- source_word: ἔλθῃ
  choice: bá dé
  rationale: ‘Dé’ bá àyíká ọ̀rọ̀ mu dáadáa, ó sì fi hàn pé ẹni náà yóò dé sí ọgbà náà ní àkókò tí a ń retí.
- source_word: κύριος
  choice: ẹni tó ni
  rationale: Ní inú àkàwé yìí, κύριος ń tọ́ka sí ẹni tó ni ọgbà, kì í ṣe orúkọ oyè ‘Olúwa.’ Ọ̀rọ̀ yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀμπελῶνος
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún ọgbà tí a ti ń gbin àjàrà.
- source_word: τί ποιήσει
  choice: kí ni yóò ṣe sí
  rationale: Ìbéèrè náà ń béèrè ìgbésẹ̀ tí ẹni tó ni ọgbà yóò gbé sí àwọn àgbẹ̀; ‘ṣe sí’ fi ipa dátífù Gíríìkì hàn lọ́nà àdánidá.
- source_word: γεωργοῖς
  choice: àwọn àgbẹ̀
  rationale: γεωργός túmọ̀ sí àgbẹ̀ tàbí olùgbìn ní gbogbogbòò. Àyíká àkàwé ló fi hàn pé wọ́n gba ọgbà náà lórí àdéhùn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ìyẹn ní tààrà.
- source_word: ἐκείνοις
  choice: wọ̀nyẹn
  rationale: 'Ó pa ìtọ́kasí pàtó àti ìjìnnà díẹ̀ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́: ‘àwọn àgbẹ̀ wọ̀nyẹn.’'
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú àkàwé yìí
  choice: ẹni tó ni ọgbà àjàrà
  alternative: olúwa ọgbà àjàrà
  rationale: Nínú ìtàn àkàwé náà, ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ni ọgbà gẹ́gẹ́ bí ohun ìní. Yíyan ‘ẹni tó ni’ kò fi oyè Ọlọ́run tàbí ti Kristi kún ẹsẹ náà láìnídìí, bó tilẹ̀ jẹ́ pé àkàwé náà lè ní ìtumọ̀ ẹ̀kọ́ ní àyíká rẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Nígbà tí ... bá dé’ àti ‘kí ni yóò ṣe sí’ jẹ́ ìṣètò ọ̀rọ̀ àdánidá fún olùkà Yorùbá òde òní.
