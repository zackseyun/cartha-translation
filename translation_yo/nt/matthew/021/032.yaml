id: MAT.21.32
reference: Matthew 21:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: yo
  text: Nítorí Jòhánù wá sọ́dọ̀ yín ní ọ̀nà òdodo[a], ẹ̀yin kò sì gbà á gbọ́[b]; ṣùgbọ́n àwọn agbowó orí àti àwọn aṣèwó gbà á gbọ́. Ṣùgbọ́n ẹ̀yin, lẹ́yìn tí ẹ rí èyí, ẹ kò tilẹ̀ yí ọkàn yín padà lẹ́yìn náà kí ẹ lè gbà á gbọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “ní ọ̀nà tí ó tọ́” tàbí “ní ipa ọ̀nà òdodo.” Gbólóhùn Gíríìkì náà lè ṣàpèjúwe bí Jòhánù ṣe gbé ayé rẹ̀ àti bí ó ṣe ṣe iṣẹ́ òjíṣẹ́ rẹ̀, tàbí ọ̀nà òdodo tí ó kéde.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “gbẹ́kẹ̀ lé e.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ẹni gbọ́ tàbí fífi ìgbẹ́kẹ̀lé sínú rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “ẹ kò ronúpìwàdà lẹ́yìn náà kí ẹ lè gbà á gbọ́.” Ọ̀rọ̀ Gíríìkì tí a lò níhìn-ín kì í ṣe μετανοέω, èyí tí a sábà máa ń túmọ̀ sí “ronúpìwàdà,” bí kò ṣe μεταμέλομαι, tí ó lè túmọ̀ sí yí èrò ẹni padà tàbí kábàámọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ Ἰωάννης πρὸς ὑμᾶς
  choice: Nítorí Johanu tọ̀ yín wá
  rationale: “Nítorí” fi ìsopọ̀ àlàyé γάρ hàn; “tọ̀ yín wá” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣípò πρὸς ὑμᾶς.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: ní ọ̀nà òdodo
  rationale: Ó pa àpẹẹrẹ ọ̀nà (ὁδός) mọ́, ó sì jẹ́ kí àìdánilójú náà dúró bóyá ó ń tọ́ka sí ìgbésí ayé àti iṣẹ́ Johanu tàbí ọ̀nà òdodo tí ó kéde.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: ẹ kò gba ọ̀rọ̀ rẹ̀ gbọ́ / gba ọ̀rọ̀ rẹ̀ gbọ́
  rationale: πιστεύω pẹ̀lú dátífù túmọ̀ sí gbígba ẹni tàbí ohun tí ẹni náà sọ gbọ́. Fífi “ọ̀rọ̀” kún un jẹ́ ọ̀nà Yorùbá tó ṣe kedere láìyí ìtumọ̀ rẹ̀ sí “gbọ́ nínú rẹ̀.”
- source_word: τελῶναι
  choice: àwọn agbowó òde
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn tí ń gba owó orí tàbí owó ìjọba ní àkókò náà.
- source_word: πόρναι
  choice: àwọn aṣẹ́wó
  rationale: Ìtumọ̀ tààrà, tí ó ṣe kedere, fún àwọn obìnrin tí ń ta ara wọn fún ìbálòpọ̀.
- source_word: ἰδόντες
  choice: bí ẹ tilẹ̀ rí èyí
  rationale: Ó mú ipa concessive participle náà jáde ní àdánidá, “bí ó tilẹ̀ jẹ́ pé ẹ rí èyí,” níbi tí “èyí” ti tọ́ka sí bí agbowó òde àti aṣẹ́wó ṣe gba Johanu gbọ́.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: ẹ kò yí ọkàn yín padà lẹ́yìn náà
  rationale: Ó ya μεταμέλομαι sọ́tọ̀ kúrò lọ́dọ̀ μετανοέω, ó sì sọ ìyípadà inú tàbí èrò hàn láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn kan tí ó lè lágbára ju orísun lọ sí i.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìṣe tó tọ́; ìdájọ́ òdodo
  rationale: “Òdodo” pa ìtumọ̀ ìwà rere àti ìbámu pẹ̀lú ìfẹ́ Ọlọ́run mọ́, ó sì bá àpẹẹrẹ “ọ̀nà” mu.
- issue: Ìtumọ̀ πιστεύω pẹ̀lú αὐτῷ
  choice: gba ọ̀rọ̀ rẹ̀ gbọ́
  alternative: gbẹ́kẹ̀ lé e; gbà á gbọ́
  rationale: Ó tọ́ka sí ìdáhùn sí iṣẹ́ àti ìkéde Johanu, láìsọ ọ́ di gbígbàgbọ́ “nínú” Johanu ní ọ̀nà ẹ̀kọ́ ìsìn.
- issue: Ìtumọ̀ μετεμελήθητε
  choice: yí ọkàn yín padà
  alternative: ronú pìwà dà; kábàámọ̀
  rationale: Ó pa ìyàtọ̀ tó wà láàárín μεταμέλομαι àti μετανοέω mọ́. Ó lè ní ìtumọ̀ ìyípadà èrò tàbí ìbànújẹ̀, tí àyíká yìí so mọ́ gbígba Johanu gbọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin/ẹ” fún ọ̀pọ̀ ènìyàn tí Jesu ń bá sọ̀rọ̀, a sì pa ìtẹnumọ́ ὑμεῖς mọ́ nípa “Ṣùgbọ́n ẹ̀yin.” A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó ti yẹ.
