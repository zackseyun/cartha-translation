  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: yo
  text: Ọ̀pọ̀ jù lọ nínú ogunlọ́gọ̀ ènìyàn náà tẹ́ aṣọ wọn[b] sí ojú ọ̀nà[a], àwọn mìíràn sì ń gé àwọn ẹ̀ka lára àwọn igi, wọ́n sì ń tẹ́ wọn sí ojú ọ̀nà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “apá tí ó pọ̀ jù nínú ogunlọ́gọ̀ ènìyàn náà.”
    reason: lexical_alternative
  - marker: b
    text: “Aṣọ” tún lè túmọ̀ sí “aṣọ àwọ̀lékè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Ọ̀pọ̀ jù lọ nínú èrò náà
  rationale: πλεῖστος pẹ̀lú ọ̀rọ̀ àpapọ̀ ὄχλος túmọ̀ sí ọ̀pọ̀ jù lọ tàbí apá tí ó pọ̀ jù nínú èrò; gbolohun yìí jẹ́ Yorùbá àdánidá.
- source_word: ἔστρωσαν
  choice: tẹ́
  rationale: Nínú àyíká yìí, στρώννυμι túmọ̀ sí títẹ́ tàbí títan ohun sílẹ̀; “tẹ́ ... sí ojú ọ̀nà” ṣàpèjúwe ìṣe náà ní Yorùbá àdánidá.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: aṣọ wọn
  rationale: ἱμάτια jẹ́ aṣọ, ní pàtàkì aṣọ àwọ̀lékè; “wọn” fi hàn pé aṣọ tiwọn ni, láìjẹ́ kí gbolohun le ju bó ṣe yẹ lọ.
- source_word: ἐν τῇ ὁδῷ
  choice: sí ojú ọ̀nà
  rationale: Níbi tí a ti ń tẹ́ ohun sílẹ̀, “sí ojú ọ̀nà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n gbé e ka orí ojú ọ̀nà.
- source_word: ἄλλοι δὲ
  choice: àwọn mìíràn sì
  rationale: Ó fi ẹgbẹ́ kejì kún àkọsílẹ̀ ìṣẹ̀lẹ̀ náà; “sì” gbé agbára àsopọ̀ δέ jáde láìfi ìtakora líle kún un.
- source_word: ἔκοπτον
  choice: ń gé
  rationale: Àìpé (imperfect) Gíríìkì fi ìṣe tí ń lọ lọ́wọ́ hàn; àmì “ń” pa ìtumọ̀ yẹn mọ́.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: ẹ̀ka lára àwọn igi
  rationale: “Ẹ̀ka” jẹ́ ìtumọ̀ tààrà fún κλάδους, “lára àwọn igi” sì fi ibi tí wọ́n ti gé wọn hàn ní Yorùbá tó wọ́pọ̀.
- source_word: καὶ ἐστρώννυον
  choice: wọ́n sì ń tẹ́ wọn
  rationale: Ó pa ìṣe tó ń lọ lọ́wọ́ mọ́, ó sì tún ọ̀rọ̀ ìṣe àkọ́kọ́ ṣe gẹ́gẹ́ bí orísun náà ti ṣe.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní pẹ̀lú àmì ohùn kíkún níbi tí ó bá bá àṣà ìkọ̀wé mu. A pa àtúnṣe ìṣe tí ń lọ lọ́wọ́ mọ́ nínú “ń gé” àti “ń tẹ́,” a sì yẹra fún fífi ẹ̀kọ́ ìjọ kan sínú ẹsẹ náà.
