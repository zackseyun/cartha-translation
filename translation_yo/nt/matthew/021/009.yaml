id: MAT.21.9
reference: Matthew 21:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn tí ń lọ níwájú rẹ̀ àti àwọn tí ń tẹ̀ lé e ń ké jáde pé, “Hòsánà[a] fún Ọmọ Dáfídì![b] A bùkún ẹni tí ń bọ̀ ní orúkọ Olúwa![c] Hòsánà ní ibi gíga jù lọ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hòsánà” jẹ́ ìkéde tí ó wá láti inú èdè Hébérù, tí ìtumọ̀ rẹ̀ fẹ́rẹ̀ẹ́ jẹ́ “gbà là, jọ̀wọ́” tàbí “gbà là nísinsìnyí”; ṣùgbọ́n níbí ó ń ṣiṣẹ́ gẹ́gẹ́ bí ìkéde ìyìn.
    reason: lexical_alternative
  - marker: b
    text: “Ọmọ Dáfídì” jẹ́ oyè ọba tí a fi ń tọ́ka sí Mèsáyà.
    reason: cultural_note
  - marker: c
    text: Gbólóhùn yìí ń mú Sáàmù 118:26 wá sí ìrántí; níbẹ̀, “Olúwa” dúró fún orúkọ Ọlọ́run YHWH nínú ọ̀rọ̀ Hébérù.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: àwọn ogunlọ́gọ̀ ènìyàn
  rationale: Ó fi hàn pé ọ̀pọ̀ ènìyàn ni ó péjọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere ju lílo ọ̀rọ̀ àtijọ́ lọ.
- source_word: προάγοντες αὐτόν
  choice: tí ń lọ níwájú rẹ̀
  rationale: Ó tọ́ka sí àwọn tí ń rìn níwájú Jésù nínú ìrìn-àjò náà, láìfi èrò kún un pé àwọn ni olórí rẹ̀.
- source_word: ἀκολουθοῦντες
  choice: àwọn tí ń tẹ̀ lé e
  rationale: Ó bá ìṣe tí ń lọ lọ́wọ́ mu, ó sì bá ‘tí ń lọ níwájú rẹ̀’ dọ́gba lọ́nà àdánidá.
- source_word: ἔκραζον λέγοντες
  choice: ń ké jáde pé
  rationale: Àmì ‘ń’ pa ìtumọ̀ ìṣe tí ń bá a lọ mọ́; ‘pé’ sì sọ λέγοντες jáde lọ́nà Yorùbá tí kò le koko.
- source_word: Ὡσαννά
  choice: Hòsánà
  rationale: A pa igbe ìjọsìn tí ó wá láti inú èdè Hébérù mọ́ ní ìkọ̀wé-afohùn, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìpilẹ̀ rẹ̀ hàn.
- source_word: τῷ υἱῷ Δαυίδ
  choice: fún Ọmọ Dáfídì
  rationale: ‘Fún’ ń sọ dative inú igbe náà jáde lọ́nà Yorùbá àdánidá, ‘Ọmọ Dáfídì’ sì pa oyè ọba ti Mèsáyà mọ́.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Alábùkún ni ẹni tí ń bọ̀
  rationale: Ó jẹ́ gbólóhùn Yorùbá tí ó bójú mu, tí ó sì pa ẹni kan ṣoṣo àti participle tí a sọ di orúkọ mọ́.
- source_word: ἐν ὀνόματι κυρίου
  choice: ní orúkọ Olúwa
  rationale: Ó pa àwòrán ‘orúkọ’ àti ìtọ́kasí sí Sáàmù 118 mọ́, láìyí i sí àlàyé nípa àṣẹ nínú ọ̀rọ̀ pàtàkì.
- source_word: ἐν τοῖς ὑψίστοις
  choice: ní ibi gíga jù lọ
  rationale: Ó pa ọlá àti àìdánilójú díẹ̀ ti gbólóhùn Gíríìkì mọ́, láìsọ ọ́ di ‘ọ̀run gíga jù lọ’ ní pàtó.
theological_decisions:
- issue: Oyè Mèsáyà ti τῷ υἱῷ Δαυίδ
  choice: Pa ‘Ọmọ Dáfídì’ mọ́ gẹ́gẹ́ bí oyè.
  alternative: Túmọ̀ ọ́ ní tààrà sí ‘Mèsáyà.’
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo oyè ìran Dáfídì; pípa á mọ́ ń dá àwọ̀ ìtàn àti ìmọ̀ Ọlọ́run inú ẹsẹ náà sí.
- issue: Ìtumọ̀ Ὡσαννά
  choice: Lo ‘Hòsánà’ nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sọ ìtumọ̀ ìpilẹ̀ rẹ̀.
  alternative: ‘Gbà wá, jọ̀wọ́’ tàbí ‘Gbà wá nísinsìnyí.’
  rationale: Ní ibi yìí ó ń ṣiṣẹ́ gẹ́gẹ́ bí igbe ìyìn àti ìjọsìn, bí ó tilẹ̀ jẹ́ pé ẹ̀bẹ̀ fún ìgbàlà ni ìtumọ̀ ìpilẹ̀ rẹ̀.
- issue: Ta ni κυρίου ń tọ́ka sí nínú ọ̀rọ̀ Sáàmù
  choice: Túmọ̀ ọ́ sí ‘Olúwa,’ kí àlàyé ìsàlẹ̀ tọ́ka sí orúkọ Ọlọ́run YHWH nínú Hébérù.
  alternative: Lo ‘OLÚWA’ láti fi YHWH hàn ní tààrà.
  rationale: Ẹ̀rí Gíríìkì ní κυρίου; ‘Olúwa’ pa ọ̀rọ̀ Majẹmu Tuntun mọ́, àlàyé sì jẹ́ kí ìpìlẹ̀ Hébérù rẹ̀ má bàa sọnù.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo ‘ń’ láti pa ìṣe tí ń bá a lọ mọ́, a sì yan ‘ogunlọ́gọ̀ ènìyàn’ fún àwòrán ọ̀pọ̀ èrò. Ìkọ̀wé ‘Hòsánà’ pa ìró àti iṣẹ́ rẹ̀ gẹ́gẹ́ bí igbe ìjọsìn mọ́.
