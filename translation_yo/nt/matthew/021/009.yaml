  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìlànà Gíríìkì dáadáa: ó pa ìyàtọ̀ àwọn ènìyàn tí ń lọ níwájú àti àwọn tí ń tẹ̀ lé e mọ́, ó fi ìṣe tí ń tẹ̀síwájú nínú ἔκραζον hàn, ó sì dá àwọn ìkéde mẹ́tẹ̀ẹ̀ta náà sílẹ̀ láìfi ìtumọ̀ ẹ̀sìn kún un. Síbẹ̀, “Àwọn ogunlọ́gọ̀ ènìyàn” lè tọ́ka sí iye kan pàtó (ẹgbẹẹgbẹ̀rún) ju ὄχλοι, ‘ogunlọ́gọ̀’ sì kéré sí àdánidá nínú àyíká yìí. “Ọ̀pọ̀ ènìyàn” jẹ́ ìbámu tó péye sí i.'
  naturalness: “A bùkún ẹni tí ń bọ̀” jẹ́ ọ̀nà Yorùbá boṣewa, tí ó ṣe kedere sí i láti sọ prediketi passive Εὐλογημένος. “Alábùkún” lè túmọ̀ sí ẹni tí ń bùkún àwọn ẹlòmíràn, nítorí náà ó lè yí ipa Gíríìkì náà padà. Àwọn apá mìíràn jẹ́ Yorùbá òde òní, tó ní iyì, pẹ̀lú àmì ohùn tó yẹ.
  terminology: “Hòsánà,” “Ọmọ Dáfídì,” àti “Olúwa” jẹ́ àwọn ọ̀rọ̀ tó yẹ, wọ́n sì pa ìró, oyè Dáfídì/Mèsáyà, àti ìtọ́kasí Sáàmù náà mọ́. Àlàyé ìsàlẹ̀ a gbọ́dọ̀ má fi ẹni-púpọ̀ ‘wá’ sínú ìtumọ̀ ìpilẹ̀ Hòsánà, nítorí ọ̀rọ̀ náà fúnra rẹ̀ kò sọ ohun-ìní náà ní pàtó.
  issues:
