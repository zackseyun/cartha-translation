revisions:
- from: Àwọn ogunlọ́gọ̀ ènìyàn tí ń lọ níwájú rẹ̀ àti àwọn tí ń tẹ̀ lé e ń ké jáde pé, “Hòsánà[a] fún Ọmọ Dáfídì![b] Alábùkún ni ẹni tí ń bọ̀ ní orúkọ Olúwa![c] Hòsánà ní ibi gíga jù lọ!”
  to: Ọ̀pọ̀ ènìyàn tí ń lọ níwájú rẹ̀ àti àwọn tí ń tẹ̀ lé e ń ké jáde pé, “Hòsánà[a] fún Ọmọ Dáfídì![b] A bùkún ẹni tí ń bọ̀ ní orúkọ Olúwa![c] Hòsánà ní ibi gíga jù lọ!”
  rationale: Àtúnṣe náà mú ìtumọ̀ ὄχλοι wá sí Yorùbá tó wọ́pọ̀ sí i, ó sì ṣe Εὐλογημένος gẹ́gẹ́ bí passive láìjẹ́ kí ‘Alábùkún’ dà bí ẹni tí ń bùkún. A tún ṣàtúnṣe àlàyé Hòsánà kí ó má ṣe fi ohun-ìní kan tí kò ṣí ní pàtó sínú ìtumọ̀ ìpilẹ̀ rẹ̀. Àwọn ìkéde, àwọn oyè, ìtọ́kasí Sáàmù, àti àìdánilójú ‘ní ibi gíga jù lọ’ ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:59Z'
