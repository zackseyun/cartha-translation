  - severity: medium
    issue: “Alábùkún ni ẹni tí ń bọ̀” fún Εὐλογημένος ὁ ἐρχόμενος
    rationale: ‘Alábùkún’ lè ní ìtumọ̀ ẹni tí ń bùkún. Gíríìkì náà jẹ́ participle passive, ‘ẹni tí a bùkún,’ nítorí náà ‘A bùkún ẹni tí ń bọ̀’ yọ ìdààmú náà kúrò.
  - severity: low
    issue: Àlàyé Hòsánà sọ “gbà wá”
    rationale: Ìtumọ̀ ìpilẹ̀ tí a fún ní Gẹ̀ẹ́sì jẹ́ ‘save, please’/‘save now’; fífi ‘wá’ kún un sọ ohun-ìní tí kò hàn nínú ọ̀rọ̀ náà ní pàtó. ‘Gbà là, jọ̀wọ́’ tàbí ‘Gbà là nísinsìnyí’ dá ìbéèrè náà sílẹ̀ láìsọ ẹni tí a ń bẹ̀bẹ̀ fún.
