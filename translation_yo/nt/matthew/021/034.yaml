language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àsìkò èso ti sún mọ́, ó rán àwọn ìránṣẹ́ rẹ̀[a] sí àwọn àgbẹ̀ ayálégbà[b] láti gba èso tirẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹrú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, doulous, lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú; níhìn-ín, ipa wọn gẹ́gẹ́ bí aṣojú ẹni tó ni ọgbà ni a tẹnumọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn àgbẹ̀,” “àwọn ayálégbà,” tàbí “àwọn olùgbẹ́ ọgbà àjàrà.” Ọ̀rọ̀ Gíríìkì náà, geōrgous, ń tọ́ka sí àwọn tó ń gbin ilẹ̀; nínú òwe yìí, wọ́n ń ṣiṣẹ́ ọgbà àjàrà tí kì í ṣe tiwọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: ὅτε ṣe àgbékalẹ̀ gbólóhùn àkókò, δέ sì jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó lè fi ìyípadà tàbí ìtakora díẹ̀ hàn; ‘Ṣùgbọ́n nígbà tí’ bá ìtàn náà mu.
- source_word: ἤγγισεν
  choice: sún mọ́lé
  rationale: Ó túmọ̀ sí pé àkókò náà ti ń sún dé; ọ̀rọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì pa ìbáṣepọ̀ àkókò mọ́.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: àkókò èso
  rationale: καιρός níhìn-ín tọ́ka sí àsìkò tí ó yẹ fún èso tàbí ìkórè; ‘àkókò èso’ ṣe kedere láìfi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: τοὺς δούλους αὐτοῦ
  choice: àwọn ìránṣẹ́ rẹ̀
  rationale: δοῦλος lè jẹ́ ẹrú tàbí ìránṣẹ́. Ní àkópọ̀ òwe yìí, ipa wọn gẹ́gẹ́ bí aṣojú ẹni tó ni ọgbà ló hàn gbangba jù, nítorí náà ‘ìránṣẹ́’ ni a lò, pẹ̀lú àlàyé ẹsẹ̀ ìsàlẹ̀.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: sí àwọn àgbẹ̀ ayálégbà
  rationale: γεωργός túmọ̀ sí olùkọ́lé tàbí àgbẹ̀; nínú àyíká òwe náà, wọ́n ń ṣiṣẹ́ ọgbà àjàrà ẹlòmíràn gẹ́gẹ́ bí ayálégbà. Gbólóhùn yìí mú ipa wọn hàn ní kedere.
- source_word: λαβεῖν
  choice: láti gba
  rationale: λαμβάνω ní ìtumọ̀ gbígbà tàbí mímú; ‘gba’ pa ìtumọ̀ gbooro rẹ̀ mọ́, kò sì pinnu bóyá èso náà jẹ́ gbogbo ìkórè tàbí ìpín tí ó tọ́ sí olúwa.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: èso tirẹ̀
  rationale: ‘Èso’ jẹ́ ọ̀rọ̀ àkójọpọ̀ ní Yorùbá, ó sì túmọ̀ καρπούς lọ́nà àdánidá; ‘tirẹ̀’ pa ìtẹnumọ́ ohun-ìní αὐτοῦ mọ́.
theological_decisions:
- issue: Bóyá ‘èso tirẹ̀’ túmọ̀ sí gbogbo èso tàbí ìpín tí ó jẹ́ ti olúwa
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘èso tirẹ̀.’
  alternative: ‘ìpín èso tí ó tọ́ sí i’
  rationale: Gíríìkì sọ τοὺς καρποὺς αὐτοῦ ní ṣókí, kò sì sọ ‘ìpín’ ní tààràtà. Ìtumọ̀ náà nítorí náà kò gbọ́dọ̀ tú àìdánilójú yìí sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá àpapọ̀ tó lọ́lá, tó ṣe kedere, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Àgbẹ̀ ayálégbà’ ṣàlàyé ipò àwọn γεωργοί láìsọ pé wọ́n ni ilẹ̀ náà.
