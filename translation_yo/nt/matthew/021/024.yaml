  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìfèsì Jésù, ìbéèrè kan, ìlànà ‘bí ẹ bá dá mi lóhùn,’ àti ọ̀pọ̀ ‘àwọn nǹkan wọ̀nyí’ hàn dáadáa. Ṣùgbọ́n gbolohun ‘irú ọlá-àṣẹ tí mo fi’ kò ní ọ̀rọ̀ ìbéèrè tó bá ποίᾳ (‘wo ni’) mu, ó sì lè dà bí ẹni pé Jésù yóò kan sọ irú ọlá-àṣẹ kan fún wọn, dípò béèrè ‘nípasẹ̀ ọlá-àṣẹ wo.’
  naturalness: ‘Dá wọn lóhùn’ àti ‘dá mi lóhùn’ jẹ́ Yorùbá boṣewa, ó sì dára fún àyíká ìbéèrè yìí. Àtúnṣe kékeré náà, ‘irú ọlá-àṣẹ wo ni,’ jẹ́ ọ̀nà tó mọ́gbọ́n dání láti fi ìbéèrè aláìmọ̀ hàn.
  terminology: ‘Ọlá-àṣẹ’ jẹ́ ìtúmọ̀ tó yẹ fún ἐξουσία nínú àyíká ẹ̀tọ́/àṣẹ láti ṣe nǹkan. Àlàyé ìsàlẹ̀ náà pa àwọn ìtumọ̀ mìíràn ti λόγον ἕνα mọ́ láì fi ìtumọ̀ kan ṣoṣo dí ọrọ̀ náà.
  issues:
  - severity: medium
    issue: Ọ̀rọ̀ ìbéèrè ‘wo ni’ kò sí nínú ‘irú ọlá-àṣẹ tí mo fi.’
