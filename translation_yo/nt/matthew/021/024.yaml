- from: 'Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Èmi náà yóò bi yín ní ìbéèrè kan[a]. Bí ẹ bá dá mi lóhùn, èmi náà yóò sọ fún yín irú ọlá-àṣẹ tí mo fi ń ṣe àwọn nǹkan wọ̀nyí.”


