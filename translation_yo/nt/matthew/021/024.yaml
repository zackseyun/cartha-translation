  to: 'Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Èmi náà yóò bi yín ní ìbéèrè kan[a]. Bí ẹ bá dá mi lóhùn, èmi náà yóò sọ fún yín irú ọlá-àṣẹ wo ni mo fi ń ṣe àwọn nǹkan wọ̀nyí.”


    [a] Tàbí “ọ̀ràn kan”; ní ìtumọ̀ gangan, “ọ̀rọ̀ kan.”'
  rationale: A ṣàfikún ‘wo ni’ lẹ́yìn ‘irú ọlá-àṣẹ’ nìkan, kí ìbéèrè ποίᾳ ἐξουσίᾳ hàn ní kedere. Gbogbo ìyókù ìtumọ̀ àti àlàyé ìsàlẹ̀ wà ní ìbámu pẹ̀lú orísun Giriki.
