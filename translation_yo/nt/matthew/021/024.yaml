id: MAT.21.24
reference: Matthew 21:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: yo
  text: 'Ṣùgbọ́n Jésù dá wọn lóhùn pé, “Èmi náà yóò bi yín ní ìbéèrè kan[a]. Bí ẹ bá dá mi lóhùn, èmi náà yóò sọ fún yín irú ọlá-àṣẹ wo ni mo fi ń ṣe àwọn nǹkan wọ̀nyí.”


    [a] Tàbí “ọ̀ràn kan”; ní ìtumọ̀ gangan, “ọ̀rọ̀ kan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀ràn kan”; ní ìtumọ̀ gangan, “ọ̀rọ̀ kan.”
    reason: Ó pa ààyè ìtumọ̀ λόγον ἕνα mọ́, nítorí pé ó lè túmọ̀ sí ìbéèrè, ọ̀ràn tí a ń jíròrò, tàbí ní gangan ‘ọ̀rọ̀ kan.’
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ṣùgbọ́n Jésù dá wọn lóhùn pé
  rationale: A so participle ἀποκριθείς àti ọ̀rọ̀-ìṣe εἶπεν pọ̀ ní ọ̀nà Yorùbá tó ṣe déédéé, láì tún ‘sọ’ àti ‘dáhùn’ ṣe lásán; Ṣùgbọ́n sì fi ìyàtọ̀ kékeré tí δέ mú wá hàn.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Èmi náà yóò bi yín
  rationale: '‘Èmi náà’ pa ìtẹnumọ́ ìfèsì κἀγώ mọ́: bí wọ́n ti béèrè lọ́wọ́ rẹ̀, òun náà yóò béèrè lọ́wọ́ wọn.'
- source_word: λόγον ἕνα
  choice: ìbéèrè kan
  rationale: Nínú ọ̀rọ̀ yìí, λόγος ń tọ́ka sí ohun tí a fẹ́ kí wọ́n dá lóhùn; ‘ìbéèrè kan’ ló mú ìtumọ̀ náà ṣe kedere jù lọ ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ ‘ọ̀ràn’ àti ‘ọ̀rọ̀’ mọ́.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Bí ẹ bá dá mi lóhùn
  rationale: Bí ó tilẹ̀ jẹ́ pé λέγω túmọ̀ sí ‘sọ,’ nínú àyíká ìbéèrè yìí ó ń tọ́ka sí fífi èsì fún Jésù; gbolohun Yorùbá yìí ṣe àdéhùn náà ní kedere.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: èmi náà yóò sọ fún yín
  rationale: Ó pa ìbáramu àti ìfèsì κἀγώ kejì mọ́ ní èdè Yorùbá àdánidá.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: irú ọlá-àṣẹ tí mo fi
  rationale: ‘Ọlá-àṣẹ’ fi ìtumọ̀ ẹ̀tọ́ tàbí agbára tí a fọwọ́ sí hàn dáadáa, ‘tí mo fi’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìpìlẹ̀ tàbí agbára tí a fi ń ṣe ohun kan.
- source_word: ταῦτα ποιῶ
  choice: mo fi ń ṣe àwọn nǹkan wọ̀nyí
  rationale: ‘Àwọn nǹkan wọ̀nyí’ pa ọ̀pọ̀ nǹkan tí ταῦτα ń tọ́ka sí mọ́, àmì ‘ń’ sì bá ìṣe tí ó ń lọ tàbí tí ó sábà ń ṣẹlẹ̀ mu.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtẹnumọ́ ìfèsì ‘Èmi náà … èmi náà’ àti ọ̀pọ̀ nǹkan inú ταῦτα mọ́.
