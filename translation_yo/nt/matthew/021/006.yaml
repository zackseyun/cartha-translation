id: MAT.21.6
reference: Matthew 21:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn náà sì lọ, wọ́n sì ṣe gẹ́gẹ́ bí Jésù ti pàṣẹ fún wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí Jésù ti fún wọn ní ìtọ́ni.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífúnni ní àṣẹ tàbí ní ìtọ́ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: lọ
  rationale: Ọ̀rọ̀ náà jẹ́ aorist participle tó ṣáájú ìṣe pàtàkì; ‘lọ’ jẹ́ ọ̀nà àdánidá láti sọ ìtẹ̀síwájú ìtàn náà ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: δέ ń tẹ̀síwájú nínú ìtàn; ‘sì’ bá ìṣàn gbolóhùn Yorùbá mu láìfi ìtumọ̀ àfikún sí i.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn tó ń tẹ̀lé tí wọ́n sì ń kọ́ lábẹ́ Jésù.
- source_word: ποιήσαντες
  choice: wọ́n sì ṣe
  rationale: Aorist participle kejì náà ń sọ ìṣe tí wọ́n ṣe lẹ́yìn lílọ; ìtúmọ̀ yìí jẹ́ kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi hàn pé ìṣe àwọn ọmọ-ẹ̀yìn bá ohun tí Jésù sọ mu.
- source_word: συνέταξεν
  choice: ti pàṣẹ fún
  rationale: συντάσσω lè túmọ̀ sí fífúnni ní ìtọ́ni tàbí àṣẹ. Nínú Yorùbá, ‘pàṣẹ fún’ mú agbára ọ̀rọ̀ náà jáde dáadáa, nígbà tí àlàyé ìsàlẹ̀ pa àṣàyàn ‘fún ní ìtọ́ni’ mọ́.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ọ̀nà àdánidá ni èyí láti sọ ẹni tí àṣẹ náà tọ́ sí ní Yorùbá.
- source_word: ὁ Ἰησοῦς
  choice: Jésù
  rationale: Orúkọ ẹni náà ni a túmọ̀ ní ọ̀nà Yorùbá tó wọ́pọ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnṣe náà pa ìtẹ̀síwájú ìtàn àti ìbámu pẹ̀lú ohun tí Jésù sọ mọ́.
