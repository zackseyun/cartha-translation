id: MAT.21.19
reference: Matthew 21:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: yo
  text: Nígbà tí ó sì rí igi ọ̀pọ̀tọ́ kan lẹ́gbẹ̀ẹ́ ọ̀nà, ó lọ sí ọ̀dọ̀ rẹ̀, ṣùgbọ́n kò rí ohunkóhun lára rẹ̀ bí kò ṣe ewé nìkan. Ó sì wí fún un pé, “Kí èso má ṣe jáde lára rẹ mọ́ láéláé.” Igi ọ̀pọ̀tọ́ náà sì gbẹ lójú ẹsẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: igi ọ̀pọ̀tọ́ kan
  rationale: ‘Kan’ ń fi μίαν hàn lọ́nà àdánidá nínú Yorùbá, láìfi ìtẹnumọ́ ‘ọ̀kan ṣoṣo’ kún un.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: lẹ́gbẹ̀ẹ́ ọ̀nà
  rationale: Èyí jẹ́ ọ̀rọ̀ ibi tó bá Yorùbá mu, ó sì dára ju gbígbé igi náà sí ‘orí ọ̀nà’ lọ.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: ó lọ sí ọ̀dọ̀ rẹ̀
  rationale: Ó sọ ìṣípò lọ sí ibi tí igi náà wà ní Yorùbá àdánidá.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: kò rí ohunkóhun lára rẹ̀ bí kò ṣe ewé nìkan
  rationale: ‘Lára rẹ̀’ ni Yorùbá àdánidá fún ohun tó wà lórí igi; ‘bí kò ṣe ewé nìkan’ pa ìtẹnumọ́ mọ́ pé ewé nìkan ni ó rí.
- source_word: λέγει αὐτῇ
  choice: ó sì wí fún un
  rationale: A mú historical present náà wá sí àkókò àtẹ̀yìnwá fún ìṣàn ìtàn Yorùbá, ṣùgbọ́n ‘wí’ pa ìwọ̀n ọ̀rọ̀ mímọ́ náà mọ́.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Kí èso má ṣe jáde lára rẹ mọ́ láéláé
  rationale: Ìṣètò ‘Kí…má ṣe’ fi subjunctive ìkéde/ègún hàn; ‘mọ́ láéláé’ pa Μηκέτι àti εἰς τὸν αἰῶνα méjèèjì mọ́, ‘jáde lára rẹ’ sì tẹ̀lé àwòrán ἐκ σοῦ.
- source_word: ἐξηράνθη παραχρῆμα
  choice: Lójú ẹsẹ̀ … rọ
  rationale: ‘Lójú ẹsẹ̀’ fi ìṣẹ̀lẹ̀ kíákíá hàn, ‘rọ’ sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún igi tàbí ohun ọ̀gbìn tí ó gbẹ tí agbára rẹ̀ sì tán.
theological_decisions:
- issue: Agbára ọ̀rọ̀ Jésù sí igi ọ̀pọ̀tọ́
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìkéde àṣẹ/ègún: “Kí èso má ṣe jáde lára rẹ mọ́ láéláé.”'
  alternative: “Èso kì yóò jáde lára rẹ mọ́ láéláé,” gẹ́gẹ́ bí àsọtẹ́lẹ̀ tààrà.
  rationale: Μηκέτι pẹ̀lú γένηται tó jẹ́ subjunctive ń gbé agbára ìkéde ìdènà jáde; ìtumọ̀ yìí kò pinnu ọ̀nà tí ìṣẹ̀lẹ̀ náà fi ṣẹlẹ̀, bẹ́ẹ̀ ni kò fi ìtumọ̀ àmì nípa igi náà kún ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìtẹnumọ́ ‘ewé nìkan’ àti ìwúwo ìkéde náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
