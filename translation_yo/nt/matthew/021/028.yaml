id: MAT.21.28
reference: Matthew 21:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: yo
  text: Ṣùgbọ́n kí ni ẹ̀yin rò? Ọkùnrin kan ní ọmọ méjì[a]. Ó lọ sí ọ̀dọ̀ ọmọ àkọ́kọ́, ó sì sọ pé, “Ọmọ, lọ ṣiṣẹ́ ní ọgbà àjàrà lónìí.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọkùnrin méjì.” Ọ̀pọ̀ ìtumọ̀ máa ń lo “ọmọkùnrin,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì níbí (τέκνα) túmọ̀ sí “ọmọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Ṣùgbọ́n kí ni ẹ̀yin rò?
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè fún ìdájọ́ àwọn olùgbọ́, ó sì pa agbára àsopọ̀ díẹ̀ tí δὲ ní mọ́ nípasẹ̀ “Ṣùgbọ́n.”
- source_word: ἄνθρωπος
  choice: Ọkùnrin kan
  rationale: Nínú àyíká ìtàn yìí, ọ̀rọ̀ náà ń tọ́ka sí ọkùnrin kan tó jẹ́ olórí ilé tàbí baba; “ọkùnrin kan” sì ṣe kedere, ó sì jẹ́ ti Yorùbá àdánidá.
- source_word: τέκνα δύο
  choice: ọmọ méjì
  rationale: Ọmọ jẹ́ ọ̀rọ̀ Yorùbá tí kò fi akọ tàbí abo hàn, ó sì bá ìtumọ̀ gbòòrò τέκνα mu láì dín un kù sí “ọmọkùnrin.”
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Ó tọ ẹni àkọ́kọ́ lọ
  rationale: Ìtumọ̀ yìí mú ìṣe sísún mọ́ ẹni àkọ́kọ́ jáde ní Yorùbá tó rọrùn, ó sì so participle náà mọ́ ọ̀rọ̀-ìṣe pàtàkì lọ́nà àdánidá.
- source_word: Τέκνον
  choice: Ọmọ
  rationale: Ọ̀rọ̀ ìpè yìí pa ìtumọ̀ gbòòrò τέκνον mọ́, láì sọ ọ́ di “ọmọkùnrin” tàbí fi “mi” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: lọ ṣiṣẹ́ … lónìí
  rationale: “Lọ ṣiṣẹ́” jẹ́ àṣẹ tó ṣe kedere, “lónìí” sì fi àkókò iṣẹ́ náà hàn lọ́nà Yorùbá àdánidá.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: ní ọgbà àjàrà
  rationale: “Ọgbà àjàrà” jẹ́ ìtumọ̀ tó ṣe kedere fún ibi tí wọ́n ti ń gbin àjàrà, “ní” sì bá ἐν mu nínú àyíká yìí.
theological_decisions:
- issue: Bóyá kí a túmọ̀ τέκνα/τέκνον sí “ọmọkùnrin méjì/Ọmọkùnrin” gẹ́gẹ́ bí àṣà àwọn ìtumọ̀ kan
  choice: ọmọ méjì / Ọmọ
  alternative: ọmọkùnrin méjì / Ọmọkùnrin
  rationale: Gíríìkì ẹsẹ yìí lo ọ̀rọ̀ gbòòrò τέκνα àti τέκνον, kì í ṣe υἱοί àti υἱέ. “Ọmọ” ní Yorùbá pa ìtumọ̀ tí kò pààlà sí akọ mọ́, kò sì fi ìtumọ̀ tóóró tí kò sí nínú ọ̀rọ̀ orísun kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé yé fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì lo “ẹ̀yin” láti fi hàn pé ọ̀pọ̀ ènìyàn ni Jesu ń bá sọ̀rọ̀.
