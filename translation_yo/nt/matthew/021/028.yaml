  to: Ṣùgbọ́n kí ni ẹ̀yin rò? Ọkùnrin kan ní ọmọ méjì[a]. Ó lọ sí ọ̀dọ̀ ọmọ àkọ́kọ́, ó sì sọ pé, “Ọmọ, lọ ṣiṣẹ́ ní ọgbà àjàrà lónìí.”
  rationale: A tún gbolohun tó ń túmọ̀ προσελθὼν τῷ πρώτῳ ṣe nìkan, kí ó lè jẹ́ Yorùbá adayeba tó fi ìtumọ̀ “lọ sí ọ̀dọ̀/súnmọ́” hàn kedere. A pa gbogbo ìpinnu ìtumọ̀ pàtàkì míì mọ́, pàápàá ìyàtọ̀ tó wà láàárín “ọmọ” àti “ọmọkùnrin.”
