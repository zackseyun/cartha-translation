  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ èrò Gíríìkì mọ́ dáadáa: àwọn olórí àlùfáà, àwọn akọ̀wé, àwọn ohun ìyanu, àwọn ọmọ, Hósánà, Ọmọ Dáfídì, àti ìbínú wọn. Ṣùgbọ́n ó tún fi ọ̀rọ̀ ‘rí’ kejì kún un (‘tí wọ́n sì rí àwọn ọmọ’), níbi tí Gíríìkì ti ṣe ‘àwọn ọmọ tí ń ké jáde tí wọ́n sì ń wí’ jẹ́ ohun kejì tí wọ́n rí. A yọ ìfikún náà kúrò, a sì fi ìṣọ̀kan àwọn participle méjèèjì hàn.'
  naturalness: Àtúnṣe náà jẹ́ Yorùbá boṣewa tó rọrùn fún kíkà ní gbangba. ‘Àwọn ọmọ tí ń ké jáde ... tí wọ́n ń wí pé’ sọ ìṣe méjèèjì àwọn ọmọ náà ní kedere, láìjẹ́ kí ‘pé’ nìkan dà bí ìsopọ̀ tí kò tíì pé.
  terminology: ‘Àwọn olórí àlùfáà,’ ‘àwọn akọ̀wé,’ ‘agbègbè tẹ́ńpìlì,’ ‘Hósánà,’ àti ‘Ọmọ Dáfídì’ yẹ, wọ́n sì pa ìtumọ̀ àti oyè inú ọ̀rọ̀ ìpilẹ̀ mọ́. Àlàyé ìsàlẹ̀ méjèèjì tún bá ìtumọ̀ náà mu.
  issues:
  - severity: medium
    issue: ‘tí wọ́n sì rí àwọn ọmọ’ fi ìṣe ‘rí’ kejì kún gbolohun náà.
    rationale: ἰδόντες ní Gíríìkì jẹ́ participle kan ṣoṣo; ohun tí àwọn aṣáájú náà rí ni ‘àwọn ohun ìyanu’ àti ‘àwọn ọmọ tí ń ké jáde tí wọ́n sì ń wí.’ Ìtumọ̀ náà kò yẹ kó sọ pé wọ́n rí àwọn ọmọ lẹ́ẹ̀kejì.
  - severity: low
    issue: Ìṣe ‘wí/sọ pé’ kò hàn kedere lẹ́yìn ‘tí ń ké jáde.’
    rationale: λέγοντας jẹ́ participle kejì tó ń tọ́ka sí àwọn ọmọ náà. Fífi ‘tí wọ́n ń wí pé’ kún un dá ìbáṣepọ̀ gírámà náà dúró kedere.
