revisions:
- from: Ṣùgbọ́n nígbà tí àwọn olórí àlùfáà àti àwọn akọ̀wé rí àwọn ohun ìyanu tí ó ṣe, tí wọ́n sì rí àwọn ọmọ tí ń ké jáde ní agbègbè tẹ́ńpìlì[a] pé, “Hósánà fún Ọmọ Dáfídì!”[b] inú bí wọn.
  to: Ṣùgbọ́n nígbà tí àwọn olórí àlùfáà àti àwọn akọ̀wé rí àwọn ohun ìyanu tí ó ṣe, àti àwọn ọmọ tí ń ké jáde ní agbègbè tẹ́ńpìlì[a], tí wọ́n ń wí pé, “Hósánà fún Ọmọ Dáfídì!”[b] inú bí wọn.
  rationale: A ṣe àtúnṣe kékeré kan ṣoṣo láti yọ ‘rí’ kejì tí kò sí nínú Gíríìkì kúrò, àti láti sọ pé àwọn ọmọ náà ni wọ́n ń ké jáde, tí wọ́n sì ń wí ìkéde náà. A kò yí ìtumọ̀, ìforígbárí Hósánà, oyè ‘Ọmọ Dáfídì,’ tàbí àwọn àlàyé ìsàlẹ̀ padà.
