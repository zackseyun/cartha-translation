id: MAT.21.15
reference: Matthew 21:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn olórí àlùfáà àti àwọn akọ̀wé rí àwọn ohun ìyanu tí ó ṣe, àti àwọn ọmọ tí ń ké jáde ní agbègbè tẹ́ńpìlì[a], tí wọ́n ń wí pé, “Hósánà fún Ọmọ Dáfídì!”[b] inú bí wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἱερόν tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan.
    reason: cultural_note
  - marker: b
    text: “Hósánà” jẹ́ ìkéde tí ó wá láti inú èdè Hébérù, tó túmọ̀ sí ohun bí “Jọ̀wọ́, gbà wá là” tàbí “Gbà wá là nísinsìnyí”; ní àkókò yìí, ó tún ti di ìkéde ìyìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: nígbà tí ... rí
  rationale: Ọ̀rọ̀ ìṣe aláìpé àkókò yìí ṣàlàyé ipò tó ṣáájú ọ̀rọ̀ ìṣe pàtàkì; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára àkókò rẹ̀ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ díẹ̀ hàn láàárín ìṣẹ̀lẹ̀ yìí àti ohun tó ṣẹ̀ṣẹ̀ ṣẹlẹ̀.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn aṣáájú aláṣẹ láàárín àwọn àlùfáà, kì í ṣe àlùfáà àgbà kan ṣoṣo.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: Èyí ni ìtumọ̀ tààrà fún àwọn amòfin àti olùkọ́ Ìwé Mímọ́ ní àkókò náà, láìfi àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: τὰ θαυμάσια
  choice: àwọn ohun ìyanu
  rationale: Ó tọ́ka ní gbogbogbòò sí àwọn iṣẹ́ àgbàyanu; kò fi dandan sọ pé iṣẹ́ ìyanu nìkan ni.
- source_word: ἐποίησεν
  choice: tí ó ṣe
  rationale: Ìtumọ̀ rírọrùn fún ọ̀rọ̀ ìṣe aorist, tó bá ohun gbooro náà, ‘àwọn ohun ìyanu,’ mu.
- source_word: παῖδας
  choice: àwọn ọmọ
  rationale: Ní àyíká ọ̀rọ̀ yìí, ‘àwọn ọmọ’ ni ìtumọ̀ tó ṣeé ṣe jù; ‘ìránṣẹ́’ kò bá àyíká náà mu, ‘àwọn ọmọkùnrin’ sì dín ìtumọ̀ rẹ̀ kù.
- source_word: κράζοντας
  choice: tí ń ké jáde
  rationale: Ó fi ohùn rara ti ìkéde gbangba hàn láìsọ ọ́ di ariwo ìkọlù.
- source_word: ἐν τῷ ἱερῷ
  choice: ní agbègbè tẹ́ńpìlì
  rationale: ἱερόν tọ́ka sí gbogbo àgbègbè ilé tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan.
- source_word: λέγοντας
  choice: pé
  rationale: Nínú Yorùbá àdánidá, ‘pé’ ṣàgbékalẹ̀ ọ̀rọ̀ tí àwọn ọmọ ń ké, ó sì mú àwọn participle méjèèjì pọ̀ lọ́nà tó ṣe kedere.
- source_word: Ὡσαννὰ
  choice: Hósánà
  rationale: A pa ìkéde ìjọsìn tí Gíríìkì náà yá láti inú èdè Hébérù mọ́; àlàyé ìtumọ̀ rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: τῷ υἱῷ Δαυίδ
  choice: fún Ọmọ Dáfídì
  rationale: Dative tó tẹ̀ lé ìkéde náà lè jẹ́ ‘fún’ ní Yorùbá àdánidá; ‘Ọmọ Dáfídì’ sì pa oyè Mèsáyà náà mọ́.
- source_word: ἠγανάκτησαν
  choice: inú bí wọn
  rationale: Gbólóhùn Yorùbá àdánidá yìí sọ ìbínú àti àìtẹ́lọ́rùn tó wà nínú ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ Mèsáyà nínú ‘Ọmọ Dáfídì’
  choice: A pa oyè náà mọ́ gẹ́gẹ́ bí ‘Ọmọ Dáfídì.’
  alternative: ajogún Dáfídì
  rationale: Gbólóhùn náà jẹ́ oyè Mèsáyà tí a mọ̀ nínú Mátíù; ìtumọ̀ àlàyé bí ‘ajogún Dáfídì’ yóò dín ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀ ìpilẹ̀ kù.
- issue: Bí a ṣe túmọ̀ Ὡσαννά
  choice: A kọ ọ́ ní ìró Yorùbá gẹ́gẹ́ bí ‘Hósánà.’
  alternative: Jọ̀wọ́, gbà wá là / Gbà wá là nísinsìnyí
  rationale: Ọ̀rọ̀ náà ní gbòǹgbò ẹ̀bẹ̀ fún ìgbàlà, ṣùgbọ́n níbí ó tún ń ṣiṣẹ́ gẹ́gẹ́ bí ìkéde ìyìn. Kíkọ ọ́ ní ìró Yorùbá pa ìforígbárí ìtumọ̀ àti agbára ìjọsìn méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘agbègbè tẹ́ńpìlì’ láti yà ἱερόν sí mímọ́ kúrò lọ́dọ̀ ibi mímọ́ inú ilé náà.
