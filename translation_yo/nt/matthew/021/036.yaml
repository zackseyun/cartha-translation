id: MAT.21.36
reference: Matthew 21:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: yo
  text: Ó tún rán àwọn ìránṣẹ́ mìíràn[a], tí wọ́n pọ̀ ju àwọn àkọ́kọ́ lọ; àwọn ayálégbé náà sì hù sí wọn bákan náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹrú mìíràn.” Ọ̀rọ̀ Gíríìkì náà, doulous, lè túmọ̀ sí “àwọn ìránṣẹ́” tàbí “àwọn ẹrú,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Ó tún
  rationale: Ó fi hàn pé ẹni náà tún ṣe ohun kan lẹ́ẹ̀kan sí i; ọ̀rọ̀ yìí ṣe déédé pẹ̀lú ìtẹ̀síwájú ìtàn Yorùbá.
- source_word: ἀπέστειλεν
  choice: rán
  rationale: Aorist active indicative ti ἀποστέλλω ni; ‘rán’ ni ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye fún fífi àwọn aṣojú lọ.
- source_word: ἄλλους δούλους
  choice: àwọn ìránṣẹ́ mìíràn
  rationale: δοῦλος lè túmọ̀ sí ìránṣẹ́ tàbí ẹrú. Nínú àkàwé yìí, ipa wọn gẹ́gẹ́ bí àwọn tí olówó rán ni ó wà níwájú, nítorí náà ‘ìránṣẹ́’ dára jù fún ọ̀rọ̀ Yorùbá àdánidá; àṣàyàn ‘ẹrú’ wà nínú àlàyé ìsàlẹ̀.
- source_word: πλείονας τῶν πρώτων
  choice: tí iye wọn pọ̀ ju ti àwọn àkọ́kọ́ lọ
  rationale: Ìsọ̀rọ̀ afiwéra náà túmọ̀ sí pé ẹgbẹ́ kejì pọ̀ ní iye ju ẹgbẹ́ àkọ́kọ́ lọ; gbolohun yìí mú ìtumọ̀ iye náà ṣe kedere.
- source_word: ἐποίησαν αὐτοῖς
  choice: ṣe ... sí wọn
  rationale: ποιέω pẹ̀lú dative níbí ń sọ ohun tí wọ́n ṣe sí àwọn ẹni náà; ìtumọ̀ yìí pa ìsopọ̀ pẹ̀lú ìwà búburú inú ẹsẹ tó ṣáájú mọ́.
- source_word: ὡσαύτως
  choice: bákan náà
  rationale: Ó tọ́ka padà sí bí wọ́n ṣe hù sí àwọn ìránṣẹ́ àkọ́kọ́; ‘bákan náà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa agbára ìtọ́kasí náà mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú àkàwé náà
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: Nínú àyíká yìí, ìtàn náà tẹnu mọ́ iṣẹ́ wọn gẹ́gẹ́ bí àwọn tí a rán àti ìwà búburú tí àwọn ayálégbé hù sí wọn, kì í ṣe ipò òfin wọn gẹ́gẹ́ bí ẹrú. ‘Ìránṣẹ́’ bá èdè Yorùbá òde òní mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi ‘àwọn ayálégbé náà’ kún un gẹ́gẹ́ bí olùṣe tí ó ṣe kedere láti inú àyíká ẹsẹ tó ṣáájú, nítorí Yorùbá sábà máa ń nílò ìtọ́kasí tó ṣe kedere ju ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì lọ.
