id: MAT.21.39
reference: Matthew 21:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: yo
  text: Wọ́n sì mú un, wọ́n sì jù ú síta kúrò nínú ọgbà àjàrà, wọ́n sì pa á.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: wọ́n mú un
  rationale: Ó fi ìṣe mímú ẹni náà hàn láìfi agbára tàbí ìwà ipá kún ọ̀rọ̀ Gíríìkì; ó sì bá ìtẹ̀síwájú àwọn ìṣe inú ẹsẹ náà mu lọ́nà àdánidá ní Yorùbá.
- source_word: ἐξέβαλον
  choice: wọ́n jù ú sí ẹ̀yìn
  rationale: Nínú àyíká yìí, ἐκβάλλω túmọ̀ sí yíyọ ẹni kan jáde pẹ̀lú agbára. “Jù ú sí ẹ̀yìn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa àwòrán ìṣe náà mọ́.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: sí ẹ̀yìn ọgbà àjàrà
  rationale: Ó tọ́ka sí ìṣípò láti inú ọgbà àjàrà sí òde rẹ̀, ó sì so mọ́ ọ̀rọ̀ ìṣe “jù” lọ́nà tó rọrùn ní Yorùbá.
- source_word: ἀμπελῶνος (ἀμπελών)
  choice: ọgbà àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún ọgbà tí a ti ń gbin àjàrà.
- source_word: ἀπέκτειναν (ἀποκτείνω)
  choice: wọ́n pa á
  rationale: Ó túmọ̀ “wọ́n pa á” tààrà, láìfi ìtumọ̀ àfikún bí “wọ́n pà á ní ìpànìyàn” sínú ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtẹ̀lé àwọn ìṣẹ̀lẹ̀—jíju ọmọ náà sí ẹ̀yìn ọgbà àjàrà kí wọ́n tó pa á—ní ìbámu pẹ̀lú àwọn ìtàn tó jọ ọ́ nínú Máàkù àti Lúùkù
  choice: 'A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí Mátíù ṣe tò ó: wọ́n kọ́kọ́ jù ú sí ẹ̀yìn ọgbà àjàrà, lẹ́yìn náà wọ́n pa á.'
  alternative: Ṣí ìtẹ̀lé náà padà tàbí sọ ọ́ lọ́nà tí yóò mú un bá ìtẹ̀lé inú Máàkù àti Lúùkù mu.
  rationale: 'Ìtẹ̀lé Gíríìkì nínú Mátíù ṣe kedere: λαβόντες ... ἐξέβαλον ... καὶ ἀπέκτειναν. Ìtumọ̀ náà pa ẹ̀rí Mátíù mọ́ láìfipá mú un bá àwọn ìtàn tó jọ ọ́ mu.'
translation_notes:
  register: Yorùbá àgbéléwọ̀n tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tó ti yẹ. A lo “sí ẹ̀yìn ọgbà àjàrà” fún ìṣípò sí òde ọgbà náà; kò sí àlàyé ìsàlẹ̀ tó pọndandan nítorí kò sí ìyàtọ̀ ìtumọ̀ gidi tí ó nílò àkọsílẹ̀.
