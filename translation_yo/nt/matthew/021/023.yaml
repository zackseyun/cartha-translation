  to: Nígbà tí ó wọ inú tẹ́ńpìlì[a], nígbà tí ó ń kọ́ni, àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn tọ̀ ọ́ wá. Wọ́n ní, “Àṣẹ wo ni o fi ń ṣe àwọn nǹkan wọ̀nyí? Ta sì ni ó fún ọ ní àṣẹ yìí?”
