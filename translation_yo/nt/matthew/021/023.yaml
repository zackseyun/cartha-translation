id: MAT.21.23
reference: Matthew 21:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: yo
  text: Nígbà tí ó wọ inú tẹ́ńpìlì[a], nígbà tí ó ń kọ́ni, àwọn olórí àlùfáà àti àwọn àgbààgbà àwọn ènìyàn tọ̀ ọ́ wá. Wọ́n ní, “Àṣẹ wo ni o fi ń ṣe àwọn nǹkan wọ̀nyí? Ta sì ni ó fún ọ ní àṣẹ yìí?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí gbogbo àgbègbè tẹ́ńpìlì tàbí àwọn àgbàlá rẹ̀, kì í ṣe ibi mímọ́ inú tẹ́ńpìlì náà nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Nígbà tí ó wọ inú
  rationale: Gbólóhùn yìí fi ìgbà tí ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ hàn ní èdè Yorùbá àdánidá, láì fi ìyára tàbí àkókò tí Gíríìkì kò sọ kún un.
- source_word: ἱερὸν
  choice: tẹ́ńpìlì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí gbogbo àgbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú rẹ̀ nìkan. “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ tí ó ṣe kedere fún òǹkàwé, a sì ṣàlàyé ìtumọ̀ tó gbòòrò nínú àlàyé ìsàlẹ̀.
- source_word: προσῆλθον αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n sún mọ́ ọn, wọ́n sì wá bá a.
- source_word: διδάσκοντι
  choice: bí ó ti ń kọ́ni
  rationale: 'Èyí pa ìtumọ̀ ìṣe tí ó ń lọ lọ́wọ́ mọ́: wọ́n tọ̀ ọ́ wá ní àkókò tí ó ń kọ́ àwọn ènìyàn.'
- source_word: οἱ ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn aláṣẹ pàtàkì láàárín àwọn àlùfáà, kì í ṣe ọ̀pọ̀ àlùfáà àgbà tí olúkúlùkù ń di ipò kan náà mú.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: àwọn àgbààgbà àwọn ènìyàn
  rationale: Èyí tọ́ka sí àwọn aṣáájú tí a mọ̀ sí àgbààgbà láàárín àwọn ènìyàn Júù, ó sì tẹ̀ lé ìbáṣepọ̀ àwọn ọ̀rọ̀ Gíríìkì.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Àṣẹ wo ni o fi
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún ìbéèrè nípa ẹ̀tọ́ tàbí àṣẹ tí ènìyàn fi ń ṣe ohun kan.
- source_word: ταῦτα ποιεῖς
  choice: ń ṣe àwọn nǹkan wọ̀nyí
  rationale: Fọ́ọ̀mù “ń ṣe” fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì pa ọ̀pọ̀ nǹkan tí “ταῦτα” tọ́ka sí mọ́ láì dín wọn sí ohun kan.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: Ta sì ni ó fún ọ ní àṣẹ yìí?
  rationale: Èyí jẹ́ ìbéèrè Yorùbá tó ṣe kedere nípa ẹni tí ó fún Jésù ní àṣẹ náà, ó sì pa ìṣe fífúnni tí ó ti ṣẹlẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσία nínú ìpèníjà àwọn aṣáájú
  choice: àṣẹ
  alternative: ẹ̀tọ́; agbára
  rationale: Àyíká ọ̀rọ̀ náà dá lórí ẹni tí ó fún Jésù láṣẹ láti ṣe ohun tí ó ń ṣe àti láti kọ́ni nínú tẹ́ńpìlì, kì í ṣe agbára lásán. “Àṣẹ” pa ipa ti ilé-iṣẹ́ àti ipa ti ẹ̀sìn mọ́ láì fi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa, ìforígbárí ọ̀wọ̀, àti àmì ohùn níbi tí ó bá yẹ. Ọ̀rọ̀ náà jẹ́ ti ìtàn tó lọ́nà títọ́, tí ó lógo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Ìbéèrè “Àṣẹ wo ni o fi…” jẹ́ ọ̀nà Yorùbá àdánidá tí ó tún pa ìpèníjà inú ọ̀rọ̀ Gíríìkì mọ́.
