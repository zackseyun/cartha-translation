id: MAT.21.31
reference: Matthew 21:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: yo
  text: “Èwo nínú àwọn méjèèjì ló ṣe ìfẹ́ baba náà?” Wọ́n dáhùn pé, “Ẹni àkọ́kọ́.” Jésù sọ fún wọn pé, “Lóòótọ́ ni mo sọ fún yín, àwọn agbowó orí àti àwọn panṣágà ń lọ ṣáájú yín sínú ìjọba Ọlọ́run.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ń wọ ìjọba Ọlọ́run ṣáájú yín.” Ọ̀rọ̀ Gíríìkì náà ní “ń lọ ṣáájú yín,” ó ń tẹnumọ́ pé wọ́n ń lọ níwájú yín, ṣùgbọ́n kò túmọ̀ sí dandan pé ẹ̀yin kò ní wọlé rárá.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Èwo nínú àwọn méjèèjì
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè ẹni kan lára méjì, ó sì pa ìtumọ̀ partitive ἐκ mọ́.
- source_word: ἐποίησεν
  choice: ló ṣe
  rationale: “Ṣe ìfẹ́” jẹ́ gbólóhùn Yorùbá tó ṣe déédéé, tó sì pa agbára ποιέω mọ́.
- source_word: τὸ θέλημα τοῦ πατρός
  choice: ìfẹ́ baba náà
  rationale: Ó tọ́ka sí baba inú àkàwé náà, láì sọ ọ́ di “ìfẹ́ Baba” tí ó lè mú kí a fi Ọlọ́run ṣe olùtọ́ka ní tààràtà.
- source_word: Ὁ πρῶτος
  choice: Ẹni àkọ́kọ́
  rationale: Ìdáhùn kúkúrú, àdánidá ni Yorùbá, tó sì bá ọ̀rọ̀ Gíríìkì tí a gé kúrú mu.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Ó fi ìmúdájú àti ọlá inú ọ̀rọ̀ ìṣáájú Jésù hàn ní Yorùbá òde òní.
- source_word: τελῶναι
  choice: àwọn agbowó orí
  rationale: Ọ̀rọ̀ yìí ṣe kedere fún àwọn aṣojú tó ń gba owó orí, tí àwọn ènìyàn sì sábà ń kẹ́gàn ní àyíká Ìhìn Rere.
- source_word: πόρναι
  choice: àwọn panṣágà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó mọ́, tó sì ṣe pàtó sí àwọn obìnrin tó ń ta ara wọn, bí ọ̀rọ̀ Gíríìkì ṣe túmọ̀ sí níbí.
- source_word: προάγουσιν ὑμᾶς
  choice: ń ṣáájú yín
  rationale: Ó pa àwòrán lílọ síwájú ẹlòmíràn àti àsìkò ìsinsìnyí mọ́, láì fi kún un pé àwọn olùgbọ́ kò ní wọlé rárá.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: wọ ìjọba Ọlọ́run
  rationale: “Wọ” fi ìdarí εἰς hàn ní Yorùbá àdánidá, “ìjọba Ọlọ́run” sì jẹ́ ìtumọ̀ tó péye fún gbólóhùn ẹ̀kọ́ ìgbàgbọ́ náà.
theological_decisions:
- issue: Agbára προάγουσιν ὑμᾶς nípa wíwọ ìjọba Ọlọ́run
  choice: ń ṣáájú yín wọ ìjọba Ọlọ́run
  alternative: ń wọ ìjọba Ọlọ́run ṣáájú yín
  rationale: Yíyan “ń ṣáájú yín wọ” pa àwòrán pé wọ́n ń lọ níwájú wọn mọ́. Kò pinnu láìsí ẹ̀rí pé àwọn olórí náà kò ní wọlé rárá, nítorí náà ó pa ìkìlọ̀ àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo “ló” nínú ìbéèrè fún ìṣàn ọ̀rọ̀ àdánidá, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
