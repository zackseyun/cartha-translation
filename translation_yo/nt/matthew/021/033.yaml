source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: yo
  text: “Ẹ gbọ́ àkàwé mìíràn. Ọkùnrin kan tó ni ilẹ̀ gbin ọgbà àjàrà, ó sì fi ohun ìdènà yí i ká[b], ó gbẹ́ ibi ìfúnwáìnì sínú rẹ̀, ó sì kọ́ ilé gogoro kan[a]. Ó fi ọgbà àjàrà náà yá àwọn àgbẹ̀ tí wọ́n yá a[c], ó sì lọ kúrò.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwòrán gbígbin ọgbà àjàrà, fífi ohun ìdènà yí i ká, gbígbẹ́ ibi ìfúnwáìnì, àti kíkọ́ ilé gogoro ń rántí Aísáyà 5:1–2.
    reason: cross_reference
  - marker: b
    text: Tàbí, “ó fi odi yí i ká.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun ìdènà tó yí ibi kan ká, bí ọgbà ewé tàbí odi.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ó yá a fún àwọn àgbẹ̀.” Èyí túmọ̀ sí pé ó fi ọgbà àjàrà náà yá àwọn àgbẹ̀ láti máa ṣiṣẹ́ lórí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Ẹ gbọ́ àkàwé mìíràn
  rationale: Ọ̀rọ̀ àṣẹ ọ̀pọ̀ ènìyàn ἀκούσατε ni a túmọ̀ ní tààrà gẹ́gẹ́ bí “Ẹ gbọ́”; “àkàwé” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá παραβολή mu nínú ẹ̀kọ́ Jésù.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Ọkùnrin kan jẹ́ onílé kan
  rationale: οἰκοδεσπότης túmọ̀ sí ẹni tó ni ilé tàbí dúkìá, tó sì ń ṣàkóso rẹ̀. “Onílé” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá, ó sì yẹ sí àyíká ọgbà àjàrà yìí.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ó gbin ọgbà àjàrà
  rationale: 'A pa àwòrán iṣẹ́ àgbẹ̀ náà mọ́ ní kíkún: φυτεύω ni “gbìn,” ἀμπελών sì ni “ọgbà àjàrà.”'
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: ó ṣe ọgbà yí i ká
  rationale: φραγμός lè jẹ́ ọgbà ewé, odi, tàbí ohun ìdènà míì tó yí ilẹ̀ ká. “Ṣe ọgbà yí i ká” jẹ́ àdánidá, ó sì pa àìdánilójú ohun èlò tí wọ́n lò mọ́.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: ó gbẹ́ ibi ìfúnwáìnì sínú rẹ̀
  rationale: ὀρύσσω ni “gbẹ́,” ληνός sì jẹ́ ibi tí a ti ń fún èso àjàrà láti ṣe wáìnì. Ọ̀rọ̀ yìí ṣàlàyé iṣẹ́ ibi náà ní Yorùbá tó ṣe kedere.
- source_word: ᾠκοδόμησεν πύργον
  choice: ó kọ́ ilé gogoro kan
  rationale: πύργος ni ilé gogoro. A kò fi “ilé ìṣọ́” sí i nítorí pé bí ó tilẹ̀ jẹ́ pé ilé gogoro ọgbà àjàrà lè jẹ́ ti ìṣọ́, Gíríìkì kò sọ iṣẹ́ rẹ̀ ní kedere.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: Ó fi ọgbà àjàrà náà yá àwọn àgbẹ̀ olùgbé
  rationale: ἐκδίδωμι níhìn-ín ni fífi dúkìá yá; γεωργοί jẹ́ àwọn tó ń ro ilẹ̀ náà. “Àwọn àgbẹ̀ olùgbé” fi hàn pé wọ́n gba ilẹ̀ náà yá láti máa ṣiṣẹ́ lórí rẹ̀, kì í ṣe òṣìṣẹ́ lásán.
- source_word: ἀπεδήμησεν
  choice: ó rìnrìn àjò lọ
  rationale: ἀποδημέω tọ́ka sí lílọ kúrò ní ilé tàbí agbègbè ẹni fún ìrìn àjò. “Ó rìnrìn àjò lọ” jẹ́ àdánidá láìfi ibi tó lọ kún ohun tí Mátíù sọ.
theological_decisions:
- issue: Àwòrán ọgbà àjàrà tó ń tọ́ka sí Aísáyà 5:1–2
  choice: A pa gbogbo àwòrán iṣẹ́ àgbẹ̀ mọ́ nínú ọ̀rọ̀ pàtàkì, a sì fi ìtọ́kasí Aísáyà sínú àlàyé ìsàlẹ̀.
  alternative: Lílo àwọn ọ̀rọ̀ àtijọ́ tàbí ṣíṣe ìtọ́kasí náà ní gbangba nínú ọ̀rọ̀ pàtàkì.
  rationale: Àyọkà náà ní ìbáṣepọ̀ tó lágbára pẹ̀lú Aísáyà 5, ṣùgbọ́n Mátíù kò sọ ìtọ́kasí náà ní gbangba níhìn-ín. Ìtumọ̀ gbọ́dọ̀ pa àwòrán náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A lo “wáìnì” nínú àkópọ̀ “ibi ìfúnwáìnì” nítorí pé ó jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tí ó sì yẹra fún gbolohun gígùn.
