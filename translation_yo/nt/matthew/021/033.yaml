  source_fidelity: Ìtumọ̀ náà pa ọ̀pọ̀ nínú ìṣe àti àwòrán Gíríìkì mọ́, ṣùgbọ́n “ó ṣe ọgbà yí i ká” kò túmọ̀ φραγμός (ohun ìdènà tí a fi yí ọgbà ká); ó dà bí ẹni pé ó tún ṣe ọgbà mìíràn. “Ó rìnrìn àjò lọ” sì lè fi ìrìn-àjò pẹ̀lú ìlọ̀pò ìgbésẹ̀ hàn ju ἀπεδήμησεν lọ. Àtúnṣe náà mú ìdènà náà hàn láìsọ ohun èlò rẹ̀ pàtó, ó sì túmọ̀ lílọ kúrò níbẹ̀ ní kedere.
  naturalness: “Ọkùnrin kan jẹ́ onílé kan” kì í rọrùn gan-an ní Yorùbá òde òní, ó sì tún “kan” ṣe lẹ́ẹ̀mejì. “Ọkùnrin kan tó ni ilẹ̀” jẹ́ èdè adayeba nínú àyíká ọgbà àjàrà. “Àwọn àgbẹ̀ olùgbé” kò wọ́pọ̀, ó sì lè dà bí àgbẹ̀ tí ń gbé ibẹ̀, kì í ṣe àwọn tó gba ọgbà náà yá. “Àwọn àgbẹ̀ tí wọ́n yá a” ṣàlàyé ìbáṣepọ̀ yíyá náà ní kedere.
  terminology: “Àkàwé,” “ọgbà àjàrà,” “ibi ìfúnwáìnì,” àti “ilé gogoro” yẹ, wọ́n sì tọ́ka sí ọ̀rọ̀ Gíríìkì dáadáa. A lo “ohun ìdènà” fún φραγμός kí a má bàa di ọgbà ewé, odi, tàbí fẹ́ńsì mọ́; àlàyé ìsàlẹ̀ pa yíyàn “odi” mọ́ gẹ́gẹ́ bí yíyàn mìíràn.
