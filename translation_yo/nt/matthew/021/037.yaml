id: MAT.21.37
reference: Matthew 21:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn náà, ó rán ọmọ rẹ̀ sí wọn, ó ní, “Wọn yóò bọ̀wọ̀ fún ọmọ mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: lẹ́yìn náà
  rationale: Ó fi ìtẹ̀síwájú àkókò hàn ní ọ̀nà àdánidá, láìfi ìtumọ̀ ‘ní ìkẹyìn pátápátá’ kún ọ̀rọ̀ náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyípadà kékeré àti ìgbésẹ̀ pàtàkì tuntun hàn lẹ́yìn ríran àwọn ìránṣẹ́.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: ó rán ... sí wọn
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere fún ríran ẹnì kan lọ sọ́dọ̀ àwọn ènìyàn.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ọmọ rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ àdánidá tí kò fi ‘àrólé,’ ‘àyànfẹ́,’ tàbí ìtẹnumọ́ míì tí kò sí nínú Gíríìkì kún un.
- source_word: λέγων
  choice: ó ní
  rationale: Nínú àkọsílẹ̀ ìtàn Yorùbá, ‘ó ní’ ni ọ̀nà àdánidá láti ṣí ọ̀rọ̀ tí ẹni náà sọ.
- source_word: Ἐντραπήσονται
  choice: Wọn yóò bọ̀wọ̀ fún
  rationale: Pẹ̀lú ‘ọmọ mi’ gẹ́gẹ́ bí àṣe taara, ọ̀rọ̀ náà túmọ̀ sí fífi ọ̀wọ̀ tàbí ìyẹ̀ hàn; ‘bọ̀wọ̀ fún’ jẹ́ kedere, ó sì yẹ fún èdè Yorùbá òde òní.
- source_word: τὸν υἱόν μου
  choice: ọmọ mi
  rationale: Ó pa agbára ìbáṣepọ̀ ti ọ̀rọ̀ olùsọ mọ́ ní ọ̀nà Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ‘ọmọ’ nínú òwe náà láìfi ìtumọ̀ nípa Kristi kún un ju ohun tí ẹsẹ náà sọ lọ
  choice: ọmọ rẹ̀ / ọmọ mi
  alternative: Ọmọ rẹ̀ / Ọmọ mi; ọmọ rẹ̀ olùfẹ́
  rationale: υἱός jẹ́ ọ̀rọ̀ lasan fún ‘ọmọkùnrin/ọmọ’ níbí, kò sì ní ἀγαπητός (‘olùfẹ́’). Ìtumọ̀ yìí jẹ́ kí ìtọ́ka sí Jesu jáde láti inú àyíká òwe náà, kì í ṣe láti inú àfikún atúmọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Bọ̀wọ̀ fún’ ń sọ ìtumọ̀ ìfihàn ọ̀wọ̀/deference ní kedere; kò jẹ́ kí ó dà bí ìjọsìn, bẹ́ẹ̀ ni kò mú ìtumọ̀ ‘tìjú’ wọlé nínú gbolohun yìí.
