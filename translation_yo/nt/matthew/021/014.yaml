  terminology: “Àgbàlá tẹ́ńpìlì” yẹ fún ἱερόν, nítorí ó tọ́ka sí agbègbè/àgbàlá tẹ́ńpìlì ju ibi mímọ́ inú ilé lọ. A ti pa àlàyé àpèjúwe yìí mọ́ pẹ̀lú àmì ìsàlẹ̀ ojúewé.
