  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì inú Gíríìkì náà wá: àwọn afọ́jú àti àwọn arọ, bí wọ́n ṣe wá sí Jesu, ibi náà nínú agbègbè tẹ́ńpìlì, àti ìwòsàn wọn. Ṣùgbọ́n “tọ̀ ọ́ wá” lè ní ìtumọ̀ wíwá ẹni kan tàbí títẹ̀lé ẹni kan; “wá sọ́dọ̀ rẹ̀” jẹ́ ìbámu taara sí προσῆλθον αὐτῷ.'
