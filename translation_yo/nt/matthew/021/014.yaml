source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: yo
  text: Àwọn afọ́jú àti àwọn arọ wá sọ́dọ̀ rẹ̀ nínú àgbàlá tẹ́ńpìlì[a], ó sì mú wọn láradá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà, ἱερόν, ń tọ́ka sí gbogbo agbègbè tàbí àgbàlá tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ọ̀rọ̀ yìí fi ìṣípò sọdọ Jesu hàn. “Tọ̀ ọ́ wá” jẹ́ èdè Yorùbá àdánidá tí ó túmọ̀ sí pé wọ́n wá bá a tàbí wọ́n sún mọ́ ọn.
- source_word: τυφλοὶ
  choice: àwọn afọ́jú
  rationale: Adíjẹ́ẹ̀tì náà dúró gẹ́gẹ́ bí orúkọ ọ̀pọ̀, ó ń tọ́ka sí àwọn ènìyàn tí kò ríran. “Àwọn afọ́jú” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: χωλοὶ
  choice: àwọn arọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kò lè rìn déédéé. “Àwọn arọ” jẹ́ ìtumọ̀ Yorùbá tí ó péye, tí ó sì bá “àwọn afọ́jú” mu.
- source_word: ἐν τῷ ἱερῷ
  choice: nínú àgbàlá tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí gbogbo agbègbè tẹ́ńpìlì, kì í ṣe ibi mímọ́ inú ilé náà nìkan. “Àgbàlá tẹ́ńpìlì” mú ìyàtọ̀ yìí hàn lọ́nà àdánidá.
- source_word: ἐθεράπευσεν αὐτούς
  choice: ó mú wọn láradá
  rationale: θεραπεύω nínú àyíká iṣẹ́ ìyanu Ìhìn Rere túmọ̀ sí mímú aláìsàn tàbí ẹni abirùn láradá. Gbólóhùn Yorùbá yìí ṣe kedere, ó sì yẹ fún àkọsílẹ̀ náà.
theological_decisions:
- issue: Ibi tí ìwòsàn náà ti ṣẹlẹ̀ ní ìbámu pẹ̀lú ἱερόν
  choice: nínú àgbàlá tẹ́ńpìlì
  alternative: nínú tẹ́ńpìlì
  rationale: ἱερόν sábà máa ń tọ́ka sí agbègbè tàbí àgbàlá tẹ́ńpìlì lápapọ̀, kì í ṣe ibi mímọ́ inú rẹ̀ (ναός). Yíyan “àgbàlá tẹ́ńpìlì” dènà àgbọ́yé pé wọ́n wọ inú ibi mímọ́ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ó rọrùn, ó níyì, ó sì yẹ fún òǹkàwé òde òní. A lo “àwọn afọ́jú” àti “àwọn arọ” gẹ́gẹ́ bí ọ̀rọ̀ àpèjúwe ènìyàn, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
