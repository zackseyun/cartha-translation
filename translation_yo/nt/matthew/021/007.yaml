  terminology: ‘Kẹ́tẹ́kẹ́tẹ́’ àti ‘ọmọ kẹ́tẹ́kẹ́tẹ́’ jẹ́ yíyan tó péye fún ὄνος àti πῶλος nínú àyíká yìí. ‘Aṣọ’ ń ṣàfihàn ἱμάτια dáadáa; kò pọndandan láti ṣàfikún ‘àwọ̀lékè,’ èyí tí ó lè dà bí ọ̀rọ̀ tí a kò sábà lò.
