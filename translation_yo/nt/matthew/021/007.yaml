id: MAT.21.7
reference: Matthew 21:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: yo
  text: Wọ́n mú kẹ́tẹ́kẹ́tẹ́ náà àti ọmọ kẹ́tẹ́kẹ́tẹ́ náà wá, wọ́n sì fi aṣọ wọn lé wọn lórí, ó sì jókòó sórí wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jókòó sórí àwọn aṣọ tí wọ́n fi lé àwọn ẹranko náà lórí.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: Wọ́n mú ... wá
  rationale: Ọ̀rọ̀-ìṣe ἄγω lè túmọ̀ sí ‘mú wá’ tàbí ‘darí wá.’ Nínú ìtàn yìí, ‘mú ... wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ọmọ-ẹ̀yìn mú àwọn ẹranko náà dé ọ̀dọ̀ Jésù.
- source_word: τὴν ὄνον
  choice: kẹ́tẹ́kẹ́tẹ́ náà
  rationale: ὄνος túmọ̀ sí kẹ́tẹ́kẹ́tẹ́. Bí ó tilẹ̀ jẹ́ pé akọ́lé abo nínú Gíríìkì fi hàn pé abo ni ẹranko náà, ọ̀rọ̀ Yorùbá ‘kẹ́tẹ́kẹ́tẹ́’ dá ìtumọ̀ náà dúró láìfi gbolohun líle kún un.
- source_word: τὸν πῶλον
  choice: ọmọ kẹ́tẹ́kẹ́tẹ́ náà
  rationale: πῶλος ń tọ́ka sí ọmọ ẹranko; nínú àyíká yìí ọmọ kẹ́tẹ́kẹ́tẹ́ ni. Yíyan ọ̀rọ̀ yìí ṣe kedere ju lílo ‘ọmọ’ nìkan lọ.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: wọ́n sì fi àwọn aṣọ àwọ̀lékè wọn lé àwọn méjèèjì lórí
  rationale: ἱμάτια jẹ́ àwọn aṣọ òde tàbí aṣọ àwọ̀lékè. ‘Àwọn méjèèjì’ ń fi ọ̀pọ̀ αὐτῶν hàn ní Yorùbá kedere, ó sì tọ́ka sí àwọn ẹranko méjì tí a ṣẹ̀ṣẹ̀ dárúkọ. ‘Wọn’ pẹ̀lú aṣọ jẹ́ ohun tí àyíká sọ di mímọ̀ pé ó jẹ́ ti àwọn ọmọ-ẹ̀yìn.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: ó sì jókòó sórí wọn
  rationale: Gíríìkì ní arọ́pò-orúkọ ọ̀pọ̀ ‘wọn.’ Ìtumọ̀ Yorùbá yìí pa ọ̀pọ̀ náà àti àìdánilójú ohun tí arọ́pò-orúkọ náà ń tọ́ka sí mọ́, dípò kí ó sọ pé ẹranko tàbí aṣọ ni dandan.
theological_decisions:
- issue: Ohun tí αὐτῶν ìkẹyìn nínú καὶ ἐπεκάθισεν ἐπάνω αὐτῶν ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘ó sì jókòó sórí wọn,’ láìpinnu bóyá ‘wọn’ ni àwọn ẹranko tàbí àwọn aṣọ.
  alternative: ‘Ó jókòó sórí àwọn aṣọ’ tàbí ‘ó jókòó sórí ọ̀kan nínú àwọn ẹranko náà.’
  rationale: Àìdánilójú èdè àti ìtàn ni èyí, kì í ṣe ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ pàtàkì. Mímú arọ́pò-orúkọ ọ̀pọ̀ náà dúró ń pa ìṣòro gidi inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì fi ìtumọ̀ tí ó ṣeé ṣe hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbolohun ìkẹyìn mọ̀ọ́mọ̀ pa àìdánilójú arọ́pò-orúkọ ọ̀pọ̀ inú Gíríìkì mọ́.
