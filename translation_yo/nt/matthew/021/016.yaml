id: MAT.21.16
reference: Matthew 21:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: yo
  text: 'Wọ́n sì wí fún un pé, “Ṣé o gbọ́ ohun tí àwọn wọ̀nyí ń sọ?” Jésù sì wí fún wọn pé, “Bẹ́ẹ̀ ni. Ṣé ẹ kò ka rí pé,


    ‘Láti ẹnu àwọn ọmọ kéékèèké

    àti àwọn ọmọ ọwọ́ tí ń mu ọmú

    ni ìwọ ti pèsè ìyìn’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jésù ń fa ọ̀rọ̀ yọ láti Sáàmù 8:2 gẹ́gẹ́ bí àṣà Ìwé Mímọ́ Gíríìkì. Ọ̀rọ̀ Hébérù ni a sábà máa ń túmọ̀ sí, “Láti ẹnu àwọn ọmọ kéékèèké àti àwọn ọmọ ọwọ́ tí ń mu ọmú ni ìwọ ti fi agbára múlẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Ṣé o gbọ́
  rationale: Ó jẹ́ ìbéèrè tààrà ní àsìkò ìsinsìnyí; ‘gbọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ìpèníjà tí wọ́n gbé ka Jésù mọ́.
- source_word: τί οὗτοι λέγουσιν
  choice: ohun tí àwọn wọ̀nyí ń sọ
  rationale: ‘Ń sọ’ fi ìṣe tó ń lọ lọ́wọ́ hàn, ‘àwọn wọ̀nyí’ sì pa agbára itọ́ka οὗτοι mọ́ láìfi orúkọ mìíràn kún un.
- source_word: λέγει
  choice: Jésù wí
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àsìkò ìsinsìnyí gẹ́gẹ́ bí ìtàn alárinrin, ‘wí’ bá ìlànà ìtàn Yorùbá mu, ó sì jẹ́ ọ̀rọ̀ ọ̀wọ̀ tó bójú mu fún ẹsẹ Bíbélì.
- source_word: Ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ìdáhùn ìjẹ́rìí tó rọrùn, tó ṣe kedere, tó sì jẹ́ àdánidá ní Yorùbá.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Ṣé ẹ̀yin kò tíì kà á rí
  rationale: Ìtumọ̀ yìí jẹ́ ìbéèrè àtakò àdánidá ní Yorùbá, ó sì pa ohùn ìbáwí nípa àìmọ Ìwé Mímọ́ mọ́.
- source_word: Ἐκ στόματος
  choice: Láti ẹnu
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì ní kíkún, ó sì dun bí Yorùbá àdánidá.
- source_word: νηπίων
  choice: àwọn ọmọ kéékèèké
  rationale: Νήπιος tọ́ka sí àwọn ọmọ tó kéré gan-an; yíyan ‘ọmọ kéékèèké’ yà wọ́n sọ́tọ̀ kúrò lọ́dọ̀ àwọn ọmọ ọwọ́ tí ń mu ọmú.
- source_word: θηλαζόντων
  choice: àwọn ọmọ ọwọ́ tí ń mu ọmú
  rationale: Ó sọ àwòrán àwọn ọmọ tí wọ́n ṣì ń mu ọmú ní kedere àti ní èdè Yorùbá òde òní.
- source_word: κατηρτίσω
  choice: ìwọ ti pèsè
  rationale: ‘Pèsè’ ṣàfihàn mímú ohun kan wá sí ipò tó yẹ tàbí ṣíṣe é sílẹ̀, ó sì tẹ̀ lé ọ̀rọ̀ àyọlò Gíríìkì ti Mátíù láìṣàtúnṣe rẹ̀ sí Hébérù Sáàmù.
- source_word: αἶνον
  choice: ìyìn
  rationale: ‘Ìyìn’ ni ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ orúkọ Gíríìkì yìí.
theological_decisions:
- issue: Ọ̀nà tí a gbà túmọ̀ àyọlò Sáàmù nínú àríyànjiyàn Jésù
  choice: Lo ọ̀rọ̀ Gíríìkì ti Mátíù, ‘ìwọ ti pèsè ìyìn,’ nínú ẹsẹ pàtàkì.
  alternative: Ọ̀rọ̀ Sáàmù 8:2 tó dá lórí Hébérù, ‘ìwọ ti fi agbára múlẹ̀.’
  rationale: Mátíù gbé àyọlò rẹ̀ kalẹ̀ ní ìbámu pẹ̀lú àṣà Ìwé Mímọ́ Gíríìkì. Nítorí náà, a túmọ̀ ọ̀rọ̀ bí Mátíù ṣe gbé e kalẹ̀, dípò kí a mú un bá Hébérù mu; a sì pa ìyàtọ̀ Hébérù mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ ti òde òní, ó ṣe kedere, ó sì ní ọlá. A lo ‘Ṣé’ fún ìbéèrè ọ̀rọ̀ ẹnu àdánidá, nígbà tí ìtòlẹ́sẹẹsẹ àyọlò ewì pa ìrísí àyọlò Ìwé Mímọ́ mọ́.
