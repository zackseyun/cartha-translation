revisions:
- from: 'Wọ́n sì wí fún un pé, “Ṣé o gbọ́ ohun tí àwọn wọ̀nyí ń sọ?” Ṣùgbọ́n Jésù wí fún wọn pé, “Bẹ́ẹ̀ ni. Ṣé ẹ̀yin kò tíì kà á rí pé,


    ‘Láti ẹnu àwọn ọmọ kéékèèké

    àti àwọn ọmọ ọwọ́ tí ń mu ọmú

