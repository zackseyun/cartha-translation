  to: 'Wọ́n sì wí fún un pé, “Ṣé o gbọ́ ohun tí àwọn wọ̀nyí ń sọ?” Jésù sì wí fún wọn pé, “Bẹ́ẹ̀ ni. Ṣé ẹ kò ka rí pé,


    ‘Láti ẹnu àwọn ọmọ kéékèèké

    àti àwọn ọmọ ọwọ́ tí ń mu ọmú

    ni ìwọ ti pèsè ìyìn’?”[a]'
  rationale: The revision keeps the translation’s faithful rendering of Matthew’s Greek citation and its Hebrew-based alternative in the footnote. It adjusts only the connective and rhetorical question so that the Yoruba more precisely reflects δέ and οὐδέποτε while remaining natural in a formal biblical register.
