  terminology: “Bẹ́tánì” jẹ́ ìkọ̀wé orúkọ ibi tó bá ìró Yorùbá mu. “Lo òru” jẹ́ yíyan ọ̀rọ̀ tó bojú mu fún αὐλίζομαι, láì fi dandan sísùn tàbí irú ibùsọ̀ pàtó kún un. Àmì akọsílẹ̀ náà wà níbi tó tọ́, ó sì ń ṣàlàyé àṣàyàn ìtumọ̀ ẹ̀rọ-ọrọ náà.
