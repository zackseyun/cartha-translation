id: MAT.21.17
reference: Matthew 21:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: yo
  text: Ó sì fi wọ́n sílẹ̀, ó jáde kúrò ní ìlú lọ sí Bẹ́tánì, ó sì lo òru níbẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì dúró níbẹ̀ ní òru.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ηὐλίσθη, èyí tó lè túmọ̀ sí dídúró tàbí gbígbé níbì kan fún òru.
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: fi wọ́n sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé ó kọ́kọ́ fi àwọn tí a mẹ́nu kàn ṣáájú sílẹ̀, lẹ́yìn náà ni ó jáde; gbólóhùn Yorùbá yìí sì ṣe é ní ọ̀nà àdánidá.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: jáde kúrò ní ìlú
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ lílọ sí ẹ̀yìn odi ìlú; “jáde kúrò ní ìlú” mú ìtumọ̀ yẹn jáde ní Yorùbá tó ṣe kedere.
- source_word: εἰς Βηθανίαν
  choice: lọ sí Bẹ́tánì
  rationale: εἰς níbí ń tọ́ka sí ibi tí ó ń lọ; “lọ sí” ni ọ̀nà Yorùbá àdánidá fún ìtọ́sọ́nà yìí.
- source_word: ηὐλίσθη ἐκεῖ
  choice: lo òru níbẹ̀
  rationale: αὐλίζομαι túmọ̀ sí wíwà tàbí gbígbé ní ibì kan fún òru; “lo òru níbẹ̀” jẹ́ Yorùbá òde òní tó ṣe kedere láì fi kún un pé ó sùn gan-an.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tó bójú mu, tó sì ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ, a sì kọ orúkọ Bẹ́tánì ní ìbámu pẹ̀lú ìró Yorùbá.
