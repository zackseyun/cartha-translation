  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: “fi wọ́n sílẹ̀” ń ṣàfihàn καταλιπὼν αὐτούς; “jáde kúrò ní ìlú” ń mú ìtẹnumọ́ ἐξῆλθεν ἔξω τῆς πόλεως wá; “lọ sí Bẹ́tánì” jẹ́ ìtọ́sọ́nà εἰς Βηθανίαν; “lo òru níbẹ̀” sì ń tú ηὐλίσθη ἐκεῖ ní ọ̀nà tó pé.'
