  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: yo
  text: Ní kùtùkùtù òwúrọ̀, bí ó ti ń padà lọ sí ìlú náà, ebi pa á.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Ní kùtùkùtù òwúrọ̀
  rationale: Ó tọ́ka sí apá ìbẹ̀rẹ̀ ọjọ́. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá tí ó sì pa ìtẹnumọ́ pé ó jẹ́ ní òwúrọ̀ kùtùkùtù mọ́.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ fún ìtẹ̀síwájú ìtàn, kì í ṣe ìyàtọ̀ líle. Ìṣàn gbólóhùn Yorùbá ti fi ìsopọ̀ náà hàn láìfi ọ̀rọ̀ àfikún sí i.
- source_word: ἐπανάγων
  choice: bí ó ti ń padà lọ
  rationale: Ọ̀rọ̀ aláìparí yìí ṣàpèjúwe ìpadà rẹ̀ tí ó ń lọ lọ́wọ́ ní àkókò tí ebi pa á. “Bí ó ti ń padà lọ” mú ìbáṣepọ̀ àkókò náà jáde ní Yorùbá àdánidá.
- source_word: εἰς τὴν πόλιν
  choice: sí ìlú náà
  rationale: Ó fi ìṣípòpadà sí ọ̀dọ̀ tàbí sínú ìlú hàn. “Sí ìlú náà” bójú mu ní Yorùbá láìfipá sọ pé ó ti wọ inú ìlú náà tán.
- source_word: ἐπείνασεν
  choice: ebi pa á
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ní ìrírí ebi. Nínú ìtẹ̀lé ìṣẹ̀lẹ̀ yìí, ó lè fi ìbẹ̀rẹ̀ ebi náà hàn láìlo gbólóhùn tí kò rọrùn bí “ó di ẹni tí ebi ń pa.”
theological_decisions:
- issue: Ìtumọ̀ ti ẹ̀kọ́ nípa ebi Jésù
  choice: A sọ ní tààrà pé ebi pa á gẹ́gẹ́ bí ìrírí gidi.
  alternative: Ṣàlàyé ebi náà ní ọ̀nà àpẹẹrẹ tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  rationale: Ẹsẹ̀ náà sọ ìrírí ebi Jésù gẹ́gẹ́ bí apá ìtàn. Ìtumọ̀ tààrà pa ẹ̀rí sí ìwà ènìyàn rẹ̀ mọ́, láìfi àlàyé ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
translation_notes:
  register: Yorùbá àpéjọ, ti òde òní, tó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì yẹra fún ọ̀rọ̀ àtijọ́ tàbí ìṣàlàyé ẹ̀kọ́ ìgbàgbọ́ tí a fi kún ọ̀rọ̀.
