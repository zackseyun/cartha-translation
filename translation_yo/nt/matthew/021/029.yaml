  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ fara mọ́ Gíríìkì náà dáadáa: ìdáhùn ọmọ náà, ìkọ̀sílẹ̀ rẹ̀, ìyípadà tó ṣẹ̀yìn, àti lílọ rẹ̀ ni a fi hàn. ‘Ó yí ọkàn rẹ̀ padà’ jẹ́ ìtumọ̀ tó dáa fún μεταμεληθείς nínú àyíká yìí, láìfi ìtumọ̀ ìrònúpìwàdà ẹ̀kọ́-ìjọsìn tó lágbára ju sí i.'
