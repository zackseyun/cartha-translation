source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: yo
  text: Ṣùgbọ́n ó dáhùn pé, “Èmi kò fẹ́.” Ṣùgbọ́n lẹ́yìn náà, ó yí ọkàn rẹ̀ padà[a], ó sì lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó kábàámọ̀,” tàbí “ó yí ìpinnu rẹ̀ padà.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ àbámọ̀ tó mú kí ènìyàn yí ìpinnu tàbí ọ̀nà rẹ̀ padà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ó dáhùn pé
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣà ìtàn Gíríìkì fún fífi ìdáhùn hàn; ‘ó dáhùn pé’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ìtumọ̀ mọ́.
- source_word: Οὐ θέλω
  choice: Èmi kò fẹ́
  rationale: θέλω lè túmọ̀ sí fífẹ́, ìfẹ́-ọkàn, tàbí ìmúratán. Níbí, ọmọ náà kọ̀ láti ṣe ohun tí wọ́n ní kó ṣe; ‘Èmi kò fẹ́’ jẹ́ ìkọ̀sílẹ̀ ara ẹni tó ṣe kedere láìsọ ọ́ di ohun tó le ju ti Gíríìkì lọ.
- source_word: ὕστερον
  choice: lẹ́yìn náà
  rationale: Ó ń tọ́ka sí ohun tó ṣẹlẹ̀ nígbà tó tẹ̀ lé e; ‘lẹ́yìn náà’ jẹ́ èdè Yorùbá àdánidá tó péye.
- source_word: μεταμεληθεὶς
  choice: ó yí ọkàn rẹ̀ padà
  rationale: Ọ̀rọ̀ náà lè ní ìmọ̀lára ìbànújẹ́ tàbí àbámọ̀ tó mú kí ènìyàn yí ìpinnu rẹ̀ padà. Ní àyíká yìí, yíyípadà kúrò nínú ìkọ̀sílẹ̀ sí ṣíṣe ohun tí a ní kó ṣe ló ṣe pàtàkì jù.
- source_word: ἀπῆλθεν
  choice: ó sì lọ
  rationale: Nínú àyíká òwe náà, ó túmọ̀ sí pé ọmọ náà lọ ṣe ohun tí bàbá rẹ̀ ní kó ṣe, kì í ṣe pé ó kàn kúrò níbẹ̀. ‘Ó sì lọ’ jẹ́ ọ̀rọ̀ ṣókí, àdánidá, tó sì bá àyíká mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ μεταμεληθεὶς nínú òwe yìí
  choice: ó yí ọkàn rẹ̀ padà
  alternative: ó kábàámọ̀ rẹ̀; ó ronú pìwà dà
  rationale: Ẹsẹ̀ náà ṣàpèjúwe bí ọmọ náà ṣe yí padà kúrò nínú ìkọ̀sílẹ̀ sí ìgbọràn. ‘Ó ronú pìwà dà’ lè fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lágbára sí i ju ohun tí μεταμέλομαι fúnra rẹ̀ béèrè lọ; ‘ó yí ọkàn rẹ̀ padà’ pa ìyípadà ìpinnu àti ìṣe mọ́, nígbà tó ṣì fi àyè sílẹ̀ fún ìmọ̀lára àbámọ̀ tó lè wà nínú ọ̀rọ̀ Gíríìkì náà.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìsọ̀rọ̀ náà rọrùn fún òǹkàwé lasán, kò sì fi èdè ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún orísun.
