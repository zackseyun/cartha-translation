id: MAT.21.1
reference: Matthew 21:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: yo
  text: Nígbà tí wọ́n sì sún mọ́ Jerúsálẹ́mù, tí wọ́n sì dé Bẹtifágè[a] ní Òkè Ólífì, nígbà náà ni Jésù rán ọmọ-ẹ̀yìn méjì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ apá yìí sí: “tí wọ́n sì wá sí Bẹtifágè, sí Òkè Ólífì.”'
    reason: Ìtòlẹ́sẹẹsẹ Gíríìkì tún ọ̀rọ̀ εἰς (‘sí’) ṣe, ó sì lè jẹ́ pé ‘sí Òkè Ólífì’ dúró gẹ́gẹ́ bí àfikún tó ń ṣàlàyé ibi Bẹtifágè.
lexical_decisions:
- source_word: ἤγγισαν
  choice: wọ́n sún mọ́
  rationale: Ọ̀rọ̀ yìí fi ìṣípò sí ibi kan hàn; ‘sún mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n dé etí Jerúsálẹ́mù láìsọ pé wọ́n ti wọ inú ìlú náà.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ìkọ̀wé orúkọ ìlú náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Nínú ọ̀rọ̀ ìrìn-àjò yìí, ‘dé’ sọ ní kedere pé wọ́n dé Bẹtifágè, ó sì yàtọ̀ lọ́nà àdánidá sí ‘sún mọ́’ tí ó ṣáájú.
- source_word: Βηθφαγὴ
  choice: Bẹtifágè
  rationale: A kọ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìró Yorùbá.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ní Òkè Ólífì
  rationale: Nínú àkójọpọ̀ gbólóhùn yìí, ọ̀rọ̀ náà ń tọ́ka sí ibi tí Bẹtifágè wà ní ìbáṣepọ̀ pẹ̀lú Òkè Ólífì; ‘ní’ jẹ́ Yorùbá àdánidá, kò sì mú kí ó dà bí ẹni pé wọ́n wọ inú òkè kan.
- source_word: τότε
  choice: nígbà náà ni
  rationale: Ó ṣàmì sí ìgbésẹ̀ tó tẹ̀ lé e nínú ìtàn, ó sì bá ìṣètò gbólóhùn Yorùbá mu.
- source_word: ἀπέστειλεν
  choice: rán
  rationale: ‘Rán’ ni ọ̀rọ̀ Yorùbá tààrà fún fífi àwọn ènìyàn lọ ṣe iṣẹ́ kan.
- source_word: δύο μαθητὰς
  choice: ọmọ-ẹ̀yìn méjì
  rationale: ‘Ọmọ-ẹ̀yìn’ ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún μαθητής nínú ìtàn Ìhìn Rere.
theological_decisions:
- issue: Ẹni tí àwọn ọ̀rọ̀-ìṣe púpọ̀ ṣáájú orúkọ Jésù ń tọ́ka sí
  choice: A lo ‘wọ́n’ fún àwọn ìgbésẹ̀ àkọ́kọ́, a sì dárúkọ Jésù níbi tí Gíríìkì ti kọ́kọ́ dárúkọ rẹ̀.
  alternative: Kí a sọ ní gbangba pé ‘Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ sún mọ́ Jerúsálẹ́mù.’
  rationale: Gíríìkì fi ẹgbẹ́ náà hàn nípasẹ̀ ọ̀rọ̀-ìṣe púpọ̀, ṣùgbọ́n kò sọ ‘Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀’ ní ẹsẹ yìí. Ìtumọ̀ náà pa ìkékúrú àti ìtẹ̀síwájú ìtàn orísun mọ́ láìfi ẹni tí a kò dárúkọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtẹ̀síwájú ọ̀rọ̀ Gíríìkì mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
