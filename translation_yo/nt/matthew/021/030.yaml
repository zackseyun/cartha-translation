id: MAT.21.30
reference: Matthew 21:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: yo
  text: Lẹ́yìn náà, ó lọ sí ọ̀dọ̀ ọmọ kejì, ó sì sọ ohun kan náà fún un. Ó dáhùn pé, “Èmi yóò lọ, sáà,”[a] ṣùgbọ́n kò lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó sọ ní ṣókí pé, “Èmi, sáà.” Ìdáhùn náà túmọ̀ sí, “Èmi yóò lọ.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ìpè ọ̀wọ̀ sí baba rẹ̀; a tún lè túmọ̀ rẹ̀ sí “ọ̀gá” tàbí “olúwa,” ṣùgbọ́n “sáà” yẹ ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Lẹ́yìn náà, ó tọ ... lọ
  rationale: Ó fi ìtẹ̀síwájú ìtàn àti lílọ baba náà sí ọ̀dọ̀ ọmọ kejì hàn ní Yorùbá àdánidá.
- source_word: τῷ δευτέρῳ
  choice: ọmọ kejì
  rationale: Bí ó tilẹ̀ jẹ́ pé ‘ọmọ’ kò tún fara hàn nínú Gíríìkì, àyíká ọ̀rọ̀ fi hàn pé ọmọ kejì ni; fífi ‘ọmọ’ kún un mú kí Yorùbá ṣe kedere láì yí ìtumọ̀ padà.
- source_word: ὡσαύτως
  choice: ohun kan náà
  rationale: Ó tọ́ka sí àṣẹ kan náà tí baba náà ti sọ tẹ́lẹ̀, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn.
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ó dáhùn pé
  rationale: Èyí tú àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà sí Yorùbá àdánidá láì tún ‘sọ’ ṣe láìnídí.
- source_word: Ἐγώ
  choice: Èmi yóò lọ
  rationale: Ἐγώ nìkan ni Gíríìkì ní, ṣùgbọ́n ó jẹ́ ìdáhùn kúkúrú tó túmọ̀ sí pé ẹni náà yóò lọ; Yorùbá nílò fífi ìṣe tí a lóye náà hàn fún ìtumọ̀ kedere.
- source_word: κύριε
  choice: olúwa
  rationale: Nínú Yorùbá, ‘olúwa’ lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ sí ẹni tó ga tàbí aláṣẹ, kì í sì í jẹ́ orúkọ oyè Ọlọ́run nìkan; lẹ́tà kékeré àti àyíká ọ̀rọ̀ fi hàn pé baba ènìyàn ni a ń bá sọ̀rọ̀.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: ṣùgbọ́n kò lọ
  rationale: ‘Ṣùgbọ́n’ mú ìtakora láàárín ìlérí rẹ̀ àti ohun tí ó ṣe hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ κύριε nígbà tí ọmọ ń bá baba rẹ̀ sọ̀rọ̀
  choice: olúwa
  alternative: bàbá / ọ̀gá
  rationale: Àyíká ọ̀rọ̀ kò fi κύριε hàn gẹ́gẹ́ bí oyè Mèsáyà tàbí Ọlọ́run, bí kò ṣe ọ̀rọ̀ ọ̀wọ̀ sí baba. ‘Olúwa’ pa ìbáṣepọ̀ pẹ̀lú κύριος mọ́, nígbà tí lẹ́tà kékeré àti àlàyé ìsàlẹ̀ ṣe ìdènà fún kíkà á gẹ́gẹ́ bí oyè àtọ̀runwá.
translation_notes:
  register: Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘tọ ... lọ’ fún ìṣíkiri baba náà, a sì mú ìdáhùn kúkúrú Gíríìkì yé ni Yorùbá. Àmì ìsàlẹ̀ [a] wà lẹ́yìn ọ̀rọ̀ tí ó ń ṣàlàyé.
