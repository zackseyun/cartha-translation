id: MAT.21.35
reference: Matthew 21:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: yo
  text: Àwọn àgbẹ̀ ayálégbè náà sì mú àwọn ẹrú rẹ̀[a]; wọ́n lu ọ̀kan, wọ́n pa òmíràn, wọ́n sì sọ òkúta lù òmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìránṣẹ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, douloi, lè túmọ̀ sí “ẹrú” tàbí “ìránṣẹ́,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: àwọn àgbẹ̀ ayálégbè
  rationale: Nínú àkàwé yìí, àwọn γεωργοί jẹ́ àgbẹ̀ tí ó gba ilẹ̀ tàbí ọgbà àjàrà olówó lélégbè; ọ̀rọ̀ yìí fi iṣẹ́ àgbẹ̀ àti ipò ayálégbè hàn.
- source_word: λαβόντες
  choice: mú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n mú wọn sí ìkáwọ́ kí wọ́n tó ṣe ohun tí ó tẹ̀ lé; ‘mú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi agbára tí kò sí nínú Gíríìkì kún un.
- source_word: δούλους
  choice: ẹrú
  rationale: ‘Ẹrú’ ni ó fi ipò àwọn ènìyàn tí wọ́n wà lábẹ́ àṣẹ olúwa wọn hàn ní kíkún ju ‘ìránṣẹ́’ lọ, bí ó tilẹ̀ jẹ́ pé ‘ìránṣẹ́’ lè bá ọ̀rọ̀ náà mu ní àwọn àyíká mìíràn.
- source_word: ἔδειραν
  choice: lu
  rationale: ‘Lu’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún lílu tàbí fífi ìyà jẹ, láìsọ ọ̀nà pàtó tí a gbà ṣe é.
- source_word: ἀπέκτειναν
  choice: pa
  rationale: ‘Pa’ sọ ìṣe pípa ní tààrà, láìfi ìtumọ̀ òfin tàbí ìdájọ́ kún ọ̀rọ̀ náà.
- source_word: ἐλιθοβόλησαν
  choice: sọ òkúta lu
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí fífi òkúta kọlu ẹnì kan; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì yàgò fún fífi ikú kún un níbi tí ọ̀rọ̀-ìṣe náà fúnra rẹ̀ kò ti sọ pé ẹni náà kú.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: ọ̀kan ... òmíràn ... òmíràn
  rationale: Àtòjọ yìí fi hàn pé ọ̀tọ̀ọ̀tọ̀ àwọn ẹrú ni wọ́n ṣe àwọn nǹkan mẹ́tẹ̀ẹ̀ta sí.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àkàwé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Nínú àyíká yìí, àwọn tí olówó rán jẹ́ ẹni tí ó wà lábẹ́ àṣẹ rẹ̀. ‘Ẹrú’ pa ìtumọ̀ ipò ìdè náà mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí òǹkàwé mọ̀ pé ‘ìránṣẹ́’ tún lè jẹ́ ìtumọ̀ rẹ̀ gẹ́gẹ́ bí àyíká ṣe rí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìṣètò gbólóhùn náà pa ìtẹ̀lé ìṣe àti ìpín ‘ọ̀kan ... òmíràn ... òmíràn’ mọ́.
