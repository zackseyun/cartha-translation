id: MAT.21.38
reference: Matthew 21:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn àgbẹ̀ ayálégbé náà rí ọmọ náà, wọ́n sọ láàárín ara wọn pé, “Èyí ni ajogún. Ẹ wá, ẹ jẹ́ ká pa á, ká sì gba ogún rẹ̀[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ká sì ní ogún rẹ̀”; nínú àyíká yìí, èrò náà ni láti gba ogún náà fún ara wọn lẹ́yìn tí wọ́n bá ti pa ajogún.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: àwọn àgbẹ̀ ayálégbé
  rationale: Nínú àkàwé yìí, àwọn γεωργοί kì í ṣe òṣìṣẹ́ oko lásán; wọ́n gba ọgbà àjàrà náà lọ́wọ́ olówó rẹ̀ láti máa ṣiṣẹ́ níbẹ̀. “Àwọn àgbẹ̀ ayálégbé” mú ipò wọn hàn ní ṣókí.
- source_word: ἰδόντες
  choice: nígbà tí ... rí
  rationale: Gbólóhùn àsìkò yìí tú participle aorist náà sí Yorùbá àdánidá, ó sì pa bí ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: τὸν υἱόν
  choice: ọmọ náà
  rationale: Gíríìkì ní article pẹ̀lú “ọmọ” láìfi ọ̀rọ̀ ohun-ìní kún un. “Ọmọ náà” jẹ́ ìtumọ̀ tààrà, tí àyíká sì ti mú ẹni tí ó jẹ́ bàbá rẹ̀ yé.
- source_word: ἐν ἑαυτοῖς
  choice: láàárín ara wọn
  rationale: Èyí fi hàn pé àwọn ará ẹgbẹ́ náà ń bá ara wọn sọ̀rọ̀, kì í ṣe pé olúkúlùkù ń ronú nínú ara rẹ̀ nìkan.
- source_word: κληρονόμος
  choice: ajogún
  rationale: “Ajogún” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni tí yóò jogún ohun-ìní, ó sì pa ìtumọ̀ òfin àti ogún mọ́.
- source_word: δεῦτε
  choice: Ẹ wá
  rationale: Níhìn-ín δεῦτε jẹ́ ìpè ìṣírí sí ìgbésẹ̀ tí wọ́n fẹ́ gbé. “Ẹ wá” jẹ́ ọ̀nà Yorùbá àdánidá láti bẹ̀rẹ̀ irú ìpè bẹ́ẹ̀.
- source_word: ἀποκτείνωμεν
  choice: ẹ jẹ́ ká pa á
  rationale: Èyí mú subjunctive ìṣírí náà jáde gẹ́gẹ́ bí àbá tí gbogbo wọn yóò kópa nínú rẹ̀, láìfi ìtumọ̀ ìdájọ́ tàbí ọ̀rọ̀ òfin kún un.
- source_word: σχῶμεν
  choice: ká sì gba
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ìpilẹ̀ṣẹ̀ ọ̀rọ̀ náà ni “ní,” nínú àyíká pípá ajogún, ó túmọ̀ sí gbígba ohun-ìní náà fún ara wọn. “Gba” bá Yorùbá mu, ó sì lè gbé agbára ọ̀tá inú àyíká náà.
- source_word: κληρονομίαν αὐτοῦ
  choice: ogún rẹ̀
  rationale: “Ogún” bá κληρονομία mu, “rẹ̀” sì tú αὐτοῦ ní kedere, tí ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú “ajogún” mọ́.
theological_decisions:
- issue: Ìtọ́kasí àkàwé sí ọmọ náà
  choice: Tú υἱός sí “ọmọ náà” láìsọ nínú ẹsẹ̀ náà pé ó ń ṣàpẹẹrẹ Jésù.
  alternative: Ṣe ìtumọ̀ alálàyé tí yóò sọ ìdánimọ̀ Kristi di mímọ̀ sí i.
  rationale: Nínú ìtàn Mátíù, àkàwé náà tọ́ka sí Jésù, ṣùgbọ́n ẹsẹ̀ yìí ṣì ń sọ̀rọ̀ ní ìpele ìtàn àkàwé. Ìtumọ̀ náà pa ọ̀rọ̀ àkàwé mọ́, kò sì yanjú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. “Àgbẹ̀ ayálégbé” sọ ipò àwọn olùṣe ọgbà náà di mímọ̀ láìsọ àlàyé gígùn, “ẹ jẹ́ ká” sì jẹ́ ọ̀nà ọ̀rọ̀ ìṣírí tó wọ́pọ̀, tó sì ṣe kedere fún àwọn òǹkàwé òde òní.
