revisions:
- from: “Ìbatisí Jòhánù—níbo ni ó ti wá? Láti ọ̀run ni, tàbí láti ọ̀dọ̀ ènìyàn?” Wọ́n sì ń gbèrò láàárín ara wọn, wọ́n ní, “Bí a bá ní, ‘Láti ọ̀run,’ yóò sọ fún wa pé, ‘Èé ṣe nígbà náà tí ẹ kò fi gba ọ̀rọ̀ rẹ̀ gbọ́?’”
  to: “Ìbatisí Jòhánù—láti ibo ni ó ti wá? Láti ọ̀run ni, tàbí láti ọ̀dọ̀ ènìyàn?” Wọ́n sì ń gbèrò láàárín ara wọn, wọ́n ní, “Bí a bá ní, ‘Láti ọ̀run,’ yóò sọ fún wa pé, ‘Kí nìdí tí ẹ kò fi gba á gbọ́?’”
  rationale: The revision retains the Greek question about origin more explicitly and renders πιστεύω with its direct personal object (“believe him”) without adding “his word.” No footnotes are required because the Yoruba text remains clear and does not need a lexical alternative to preserve meaning.
