id: MAT.21.25
reference: Matthew 21:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: yo
  text: “Ìbatisí Jòhánù—láti ibo ni ó ti wá? Láti ọ̀run ni, tàbí láti ọ̀dọ̀ ènìyàn?” Wọ́n sì ń gbèrò láàárín ara wọn, wọ́n ní, “Bí a bá ní, ‘Láti ọ̀run,’ yóò sọ fún wa pé, ‘Kí nìdí tí ẹ kò fi gba á gbọ́?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάπτισμα
  choice: Ìbatisí
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìṣe àti iṣẹ́ ìbatisí Jòhánù lápapọ̀; “ìbatisí” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ète yìí.
- source_word: τὸ Ἰωάννου
  choice: Jòhánù
  rationale: Ìṣọ̀kan “Ìbatisí Jòhánù” fi hàn pé ìbatisí náà ni èyí tí Jòhánù ń ṣe, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: πόθεν
  choice: níbo ni ó ti wá
  rationale: Ó béèrè nípa orísun tàbí àṣẹ ìbatisí náà, kì í ṣe ibi lásán.
- source_word: ἐξ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó pa àwòrán gangan ti Gíríìkì mọ́, ó sì lè jẹ́ ọ̀nà ọ̀wọ̀ láti tọ́ka sí orísun ọ̀dọ̀ Ọlọ́run.
- source_word: ἐξ ἀνθρώπων
  choice: láti ọ̀dọ̀ ènìyàn
  rationale: “Ènìyàn” níbí jẹ́ ti gbogbo ènìyàn lápapọ̀, ó sì tako orísun ti ọ̀run láìtọ́ka sí akọ nìkan.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: wọ́n ń gbèrò láàárín ara wọn
  rationale: Ó mú ìgbèrò tí ń lọ lọ́wọ́ àti ìjíròrò àárín wọn jáde ní Yorùbá àdánidá.
- source_word: Ἐὰν εἴπωμεν
  choice: Bí a bá ní
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn oníṣèlérí yìí.
- source_word: ἐρεῖ ἡμῖν
  choice: yóò sọ fún wa
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ tààrà àti ẹni tí a ń bá sọ mọ́.
- source_word: Διὰ τί οὖν
  choice: Èé ṣe nígbà náà
  rationale: Ó fi ipa ìbéèrè tó ń tẹ̀ lé ìdáhùn àròsọ wọn hàn.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: ẹ kò fi gba ọ̀rọ̀ rẹ̀ gbọ́
  rationale: Ní àyíká yìí, gbígba Jòhánù gbọ́ túmọ̀ sí gbígba ọ̀rọ̀ àti àṣẹ rẹ̀; àfikún “ọ̀rọ̀” jẹ́ Yorùbá àdánidá, kì í sì í yanjú ju ohun tí àyíká sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ “láti ọ̀run”
  choice: Pa “láti ọ̀run” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: láti ọ̀dọ̀ Ọlọ́run
  rationale: Gíríìkì sọ “ọ̀run” ní tààrà, èyí sì lè jẹ́ ọ̀nà ọ̀wọ̀ fún sísọ pé orísun náà jẹ́ ti Ọlọ́run. Pípa rẹ̀ mọ́ kò fi ìtumọ̀ àlàyé rọ́pò ọ̀rọ̀ orísun.
- issue: Ìtumọ̀ ἀνθρώπων nínú ìtakora pẹ̀lú ọ̀run
  choice: láti ọ̀dọ̀ ènìyàn
  alternative: láti ọ̀dọ̀ àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí orísun ẹ̀dá ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; ẹyọ-orúkọ àkójọpọ̀ “ènìyàn” jẹ́ àdánidá ní Yorùbá.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n kedere fún òǹkàwé òde òní. A lo “ìbatisí,” ọ̀rọ̀ tí ó wọ́pọ̀ nínú èdè ìjọ àti ìtumọ̀ Bíbélì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Kò sí àmì àlàyé nínú ọ̀rọ̀ nítorí pé kò sí àlàyé ẹsẹ̀ tí ó ṣe pàtàkì fún yíyanjú àìdánilójú; ìyàtọ̀ “ọ̀run/Ọlọ́run” àti ìtumọ̀ àkójọpọ̀ “ènìyàn” wà nínú àwọn ìpinnu.
