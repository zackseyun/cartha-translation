  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: yo
  text: 'Èyí sì ṣẹlẹ̀ kí ohun tí a ti sọ nípasẹ̀ wòlíì náà lè ṣẹ[a], pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láti ọwọ́ wòlíì náà.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “nípasẹ̀ wòlíì náà” ní tààràtà, ó sì tẹnu mọ́ ipa wòlíì gẹ́gẹ́ bí alárinà ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: Èyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí tó ń tọ́ka sí gbogbo ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: δὲ
  choice: sì
  rationale: “Sì” fi ìbáṣepọ̀ ọ̀rọ̀ hàn láìsọ ọ́ di àtakò líle tàbí fi ọ̀rọ̀ àkókò kan kun un.
- source_word: γέγονεν
  choice: ṣẹlẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ pé ìṣẹ̀lẹ̀ náà wáyé; ó bá bí perfect γίνομαι ṣe ń ṣiṣẹ́ nínú gbólóhùn ìmúṣẹ mu.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí sọ ète tàbí àbájáde tí ἵνα lè ní, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: πληρωθῇ
  choice: ṣẹ
  rationale: “Kí ... lè ṣẹ” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ìmúṣẹ ohun tí a ti sọ tẹ́lẹ̀, ó sì pa ìtumọ̀ passive subjunctive mọ́ nínú ọ̀nà àdánidá.
- source_word: τὸ ῥηθὲν
  choice: ohun tí a ti sọ
  rationale: Ó pa ìtumọ̀ participle aláìdárúkọ àti ohùn àìṣe mọ́; “ti” tún fi hàn pé ọ̀rọ̀ náà ti wáyé ṣáájú.
- source_word: διὰ τοῦ προφήτου
  choice: nípasẹ̀ wòlíì náà
  rationale: “Nípasẹ̀” pa ìtumọ̀ alárinà tí διά pẹ̀lú genitive ní mọ́, níbi tí wòlíì ti jẹ́ ẹni tí ọ̀rọ̀ náà gbà láti dé.
- source_word: λέγοντος
  choice: 'pé:'
  rationale: Nínú Yorùbá, “pé” pẹ̀lú àmì ìdáwọ́dúró jẹ́ ọ̀nà àdánidá láti ṣí ọ̀rọ̀ àyọlò tó tẹ̀ lé e, láìfi ẹni tuntun tàbí àlàyé kun ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀ àti ipa wòlíì gẹ́gẹ́ bí alárinà
  choice: “ohun tí a ti sọ nípasẹ̀ wòlíì náà lè ṣẹ”
  alternative: “ohun tí wòlíì náà sọ lè ṣẹ” tàbí “ohun tí a ti sọ láti ọwọ́ wòlíì náà lè ṣẹ”
  rationale: Ìtumọ̀ tí a yàn pa àfiyèsí ọ̀rọ̀ Gíríìkì mọ́ pé ọ̀rọ̀ náà dé nípasẹ̀ wòlíì; kò dín un kù sí ọ̀rọ̀ tàbí àsọtẹ́lẹ̀ tirẹ̀ nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Wòlíì” jẹ́ ọ̀rọ̀ Bíbélì tó wọ́pọ̀, “kí ... lè ṣẹ” sì jẹ́ gbólóhùn àdánidá fún ìmúṣẹ ọ̀rọ̀ àsọtẹ́lẹ̀.
