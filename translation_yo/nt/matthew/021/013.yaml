id: MAT.21.13
reference: Matthew 21:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “A ti kọ ọ́ pé,[a] ‘Ilé mi ni a ó máa pè ní ilé àdúrà,’ ṣùgbọ́n ẹ̀yin ń sọ ọ́ di ihò àwọn ọlọ́ṣà.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jésù so Aísáyà 56:7 pọ̀ mọ́ Jeremáyà 7:11.
    reason: cross_reference
  - marker: b
    text: Tàbí “àwọn adigunjalè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn ọlọ́ṣà tàbí àwọn adigunjalè oníwà ipá.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ó sì wí
  rationale: Ọ̀rọ̀ yìí tẹ̀ lé ìṣe tó ṣáájú, ó sì pa bí Gíríìkì ṣe lo ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nínú ìtàn mọ́ láìfi àkókò tí èdè Yorùbá kò nílò kún un.
- source_word: Γέγραπται
  choice: A ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún ọ̀rọ̀ àkọsílẹ̀ Mímọ́, ó sì fi hàn pé ohun tí a kọ ṣì dúró gẹ́gẹ́ bí àṣẹ.
- source_word: οἶκός μου
  choice: Ilé mi
  rationale: A pa ‘ilé’ mọ́ dípò ṣíṣe àlàyé rẹ̀ sí ‘tẹ́ńpìlì,’ nítorí ọ̀rọ̀ Gíríìkì àti àyọlò Aísáyà lo àwòrán ilé Ọlọ́run.
- source_word: οἶκος προσευχῆς
  choice: ilé àdúrà
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa ìbáṣepọ̀ àwọn ọ̀rọ̀ inú Gíríìkì mọ́.
- source_word: κληθήσεται
  choice: ni a ó máa pè ní
  rationale: Ọ̀nà yìí fi ìṣe ọjọ́ iwájú àti ìtumọ̀ àìṣe-taara hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ποιεῖτε
  choice: ẹ̀yin ń sọ ọ́ di
  rationale: ‘Ń sọ ... di’ fi ìṣe tí wọ́n ń bá a lọ hàn, ‘ẹ̀yin’ sì pa ìtẹnumọ́ ὑμεῖς mọ́.
- source_word: σπήλαιον
  choice: ihò
  rationale: ‘Ihò’ pa àwòrán ihò tàbí ibùgbé ìfarapamọ́ mọ́, bí ọ̀rọ̀ Gíríìkì ṣe sọ.
- source_word: λῃστῶν
  choice: àwọn ọlọ́ṣà
  rationale: ‘Àwọn ọlọ́ṣà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn olè tó ń jíni lólè; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ‘àwọn adigunjalè’ mọ́ gẹ́gẹ́ bí ohun tó tún ṣeé ṣe.
theological_decisions:
- issue: Àyọlò àti ìtọ́kasí Májẹ̀mú Láéláé
  choice: A pa ‘Ilé mi ... ilé àdúrà’ àti ‘ihò àwọn ọlọ́ṣà’ mọ́ kí ìsopọ̀ pẹ̀lú Aísáyà 56:7 àti Jeremáyà 7:11 lè hàn.
  alternative: Lílo ọ̀rọ̀ òde òní tó túmọ̀ wọn lọ́nà fàlàlà, èyí tó lè bo ìsopọ̀ àwọn ẹsẹ Bíbélì náà mọ́lẹ̀.
  rationale: Ọ̀rọ̀ Jésù so àyọlò Aísáyà pọ̀ mọ́ ìtọ́kasí Jeremáyà; ìtumọ̀ kò gbọ́dọ̀ yanju tàbí pa ìdíwọ̀n àsọtẹ́lẹ̀ yìí run.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìrísí àsọtẹ́lẹ̀ inú Ìwé Mímọ́ mọ́.
