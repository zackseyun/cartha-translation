id: MAT.21.45
reference: Matthew 21:45
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: yo
  text: Nígbà tí àwọn olórí àlùfáà àti àwọn Farisí gbọ́ àwọn àkàwé rẹ̀, wọ́n mọ̀ pé ó ń sọ̀rọ̀ nípa àwọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ti àwọn.” Ohun tí ó túmọ̀ sí ni pé wọ́n mọ̀ pé àwọn àkàwé náà ń tọ́ka sí àwọn. Àwọn ìtumọ̀ kan túmọ̀ ọ́ ní ọ̀nà àlàyé sí i pé, “lòdì sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí ... gbọ́
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe pàtàkì, ó sì ń fi àkókò hàn; gbólóhùn ‘Nígbà tí ... gbọ́’ jẹ́ Yorùbá àdánidá tí ó pa ìtẹ̀lé ìṣẹ̀lẹ̀ mọ́.
- source_word: ἀρχιερεῖς
  choice: àwọn olórí àlùfáà
  rationale: Èyí ń tọ́ka sí àwọn aṣáájú gíga nínú ẹgbẹ́ àlùfáà, kì í ṣe pé gbogbo wọn ló di olórí àlùfáà àgbà kan náà.
- source_word: Φαρισαῖοι
  choice: àwọn Farisí
  rationale: Orúkọ ẹgbẹ́ Júù náà ni a ṣe àkọsílẹ̀ rẹ̀ ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: παραβολὰς
  choice: àwọn àkàwé
  rationale: ‘Àkàwé’ jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún àwọn ìtàn tàbí ọ̀rọ̀ àfiwé Jésù, ó sì pa irú lítíréṣọ̀ náà mọ́.
- source_word: ἔγνωσαν
  choice: wọ́n mọ̀
  rationale: Aorist γινώσκω níbí túmọ̀ sí pé wọ́n dá ohun tí ọ̀rọ̀ náà ń tọ́ka sí mọ̀; ‘wọ́n mọ̀’ jẹ́ ìtumọ̀ tààrà tí àyíká rẹ̀ mú kí ó ṣe kedere.
- source_word: περὶ αὐτῶν
  choice: nípa àwọn
  rationale: περί pẹ̀lú genitive túmọ̀ sí ‘nípa’ tàbí ‘ní ti’; a kò fi ìtumọ̀ líle sí i bí ‘lòdì sí wọn,’ bó tilẹ̀ jẹ́ pé àyíká fi àríwísí hàn.
- source_word: λέγει
  choice: ó ń sọ̀rọ̀
  rationale: Present tense náà lè farahàn ní Yorùbá gẹ́gẹ́ bí ìṣe tí ń lọ ní àkókò tí wọ́n mọ̀ ọ́n; ‘ó ń sọ̀rọ̀’ jẹ́ àdánidá nínú ọ̀rọ̀ àròsọ.
theological_decisions:
- issue: Bóyá kí ìtumọ̀ náà sọ ní gbangba pé àwọn àkàwé Jésù tako àwọn aṣáájú náà
  choice: ó ń sọ̀rọ̀ nípa àwọn
  alternative: ó ń sọ̀rọ̀ lòdì sí wọn
  rationale: Gíríìkì περὶ αὐτῶν sọ pé ọ̀rọ̀ náà jẹ́ nípa wọn. Àyíká lè fi hàn pé ó ń ṣe àríwísí wọn, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ fi agbára ‘lòdì sí’ kún ọ̀rọ̀ tí preposition náà kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘àwọn’ gẹ́gẹ́ bí arọ́pò-orúkọ ẹni kẹta ọ̀pọ̀ lẹ́yìn ‘nípa’ láti yà á sọ́tọ̀ kúrò ní ‘wọn’ nínú ọ̀rọ̀-ìṣe.
