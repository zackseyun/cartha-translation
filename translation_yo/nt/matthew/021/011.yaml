id: MAT.21.11
reference: Matthew 21:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn náà sì ń sọ pé, “Èyí ni wòlíì náà, Jésù, ẹni tí ó wá láti Násárẹ́tì ní Gálílì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Àwọn èrò náà sì
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ nínú Gíríìkì, ó sì ń tọ́ka sí àwọn àwùjọ ènìyàn tí ó péjọ. “Àwọn èrò” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ crowd; “sì” mú ìsopọ̀ δέ pẹ̀lú ìtàn tí ó ṣáájú wá.
- source_word: ἔλεγον
  choice: ń sọ pé
  rationale: Ìṣe aláìpé nínú Gíríìkì fi ọ̀rọ̀ tí ń lọ lọ́wọ́ tàbí tí a ń sọ léraléra hàn; “ń sọ pé” pa ìtumọ̀ yìí mọ́ láìfi agbára tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: Οὗτός ἐστιν
  choice: Èyí ni
  rationale: Èyí jẹ́ gbólóhùn ìdánimọ̀ tààrà, “Èyí ni” sì jẹ́ Yorùbá àdánidá fún un.
- source_word: ὁ προφήτης
  choice: wòlíì náà
  rationale: Àrokò pàtó wà nínú Gíríìkì. “Wòlíì náà” pa ìtumọ̀ pàtó mọ́, ó sì jẹ́ kí ó ṣeé ṣe pé àwọn èrò ń tọ́ka sí ẹni tí wọ́n mọ̀ sí wòlíì náà, láìsọ ìtumọ̀ yẹn di dandan.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: A kọ orúkọ náà ní ìrísí Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: láti Násárẹ́tì ní Gálílì
  rationale: Gbólóhùn yìí ń dá Jésù mọ̀ nípasẹ̀ ibi tí ó ti wá. “Láti Násárẹ́tì ní Gálílì” jẹ́ Yorùbá tí ó ṣe kedere, ó sì fi Násárẹ́tì hàn gẹ́gẹ́ bí ibi kan ní Gálílì.
theological_decisions:
- issue: Bóyá kí ὁ προφήτης jẹ́ pàtó tàbí aláìpàtó
  choice: wòlíì náà
  alternative: wòlíì kan
  rationale: Àrokò pàtó ὁ wà nínú Gíríìkì, ó sì lè rán ẹni létí wòlíì pàtó tí a ń retí tàbí ẹni tí àwọn ènìyàn mọ̀ sí wòlíì. A pa ìṣòro ìtumọ̀ yìí mọ́ nípa lílo “wòlíì náà,” ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ aláìpàtó tí ó ṣeé ṣe hàn.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó bá jẹ́ àdánidá, a sì yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
