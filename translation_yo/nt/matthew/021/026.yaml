id: MAT.21.26
reference: Matthew 21:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá sọ pé, ‘Láti ọ̀dọ̀ àwọn ènìyàn[a] ni,’ a ń bẹ̀rù ogunlọ́gọ̀ náà, nítorí gbogbo wọn ka Jòhánù sí wòlíì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Orísun rẹ̀ jẹ́ ti ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Ṣùgbọ́n bí a bá sọ pé
  rationale: “Bí a bá” fi ipò àròsọ tí ἐὰν pẹ̀lú subjunctive ń mú jáde hàn ní Yorùbá àdánidá, “ṣùgbọ́n” sì pa ìyípadà èrò mọ́.
- source_word: Ἐξ ἀνθρώπων
  choice: Láti ọ̀dọ̀ àwọn ènìyàn ni
  rationale: Ó pa ìtakora tó wà láàárín orísun láti ọ̀run àti orísun lọ́dọ̀ ènìyàn mọ́; “àwọn ènìyàn” níbí túmọ̀ sí ẹ̀dá ènìyàn lápapọ̀, kì í ṣe ọkùnrin nìkan.
- source_word: φοβούμεθα
  choice: à ń bẹ̀rù
  rationale: Ìṣe àsìkò ìsinsìnyí náà jẹ́ taara, ó sì fi ìbẹ̀rù wọn hàn láìfi àlàyé míì kún un.
- source_word: τὸν ὄχλον
  choice: ogunlọ́gọ̀ náà
  rationale: “Ogunlọ́gọ̀” tọ́ka sí ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì yàtọ̀ sí ἀνθρώπων, ìyẹn ẹ̀dá ènìyàn gẹ́gẹ́ bí orísun.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó mú ìtumọ̀ plural náà hàn kedere, ó sì tọ́ka sí gbogbo ogunlọ́gọ̀ náà.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: ka Jòhánù sí wòlíì
  rationale: “Ka ... sí” jẹ́ ọ̀nà Yorùbá àdánidá fún gbígba tàbí yíyan ẹnì kan sí ipò kan, ó sì pa agbára ìdájọ́ inú gbolohun Gíríìkì mọ́.
- source_word: προφήτην
  choice: wòlíì
  rationale: Ọ̀rọ̀ náà ń sọ pé àwọn ènìyàn wo Jòhánù gẹ́gẹ́ bí ẹni tí Ọlọ́run rán láti sọ̀rọ̀.
- source_word: Ἰωάννην
  choice: Jòhánù
  rationale: Èyí ni ìkọ orúkọ John tí ó wọ́pọ̀ nínú Yorùbá Bíbélì, pẹ̀lú àmì ohùn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀνθρώπων nínú ìtakora láàárín ọ̀run àti orísun ẹ̀dá ènìyàn
  choice: Láti ọ̀dọ̀ àwọn ènìyàn ni
  alternative: Orísun rẹ̀ jẹ́ ti ènìyàn
  rationale: Ìtumọ̀ àkọ́kọ́ pa àwòrán orísun àti ìtakora gígùn-kúkúrú inú ọ̀rọ̀ Gíríìkì mọ́, láìjẹ́ kí “ènìyàn” túmọ̀ sí akọ nìkan.
- issue: Agbára ojú tí ogunlọ́gọ̀ fi wo Jòhánù
  choice: gbogbo wọn ka Jòhánù sí wòlíì
  alternative: gbogbo wọn gbà pé wòlíì ni Jòhánù
  rationale: Ó ròyìn ìgbàgbọ́ ogunlọ́gọ̀ náà gẹ́gẹ́ bí ìtàn ṣe sọ ọ́, láìfi ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ míì kún un tàbí yọ ọ́ kúrò.
translation_notes:
  register: Yorùbá boṣewa, èdè òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ogunlọ́gọ̀” pa ìtumọ̀ ẹgbẹ́ ènìyàn tó péjọ mọ́, nígbà tí “àwọn ènìyàn” dúró fún orísun ẹ̀dá ènìyàn.
