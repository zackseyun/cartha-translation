  to: Nígbà tí àwọn ọmọ-ẹ̀yìn rí i, ẹnu yà wọ́n, wọ́n sì ní, “Báwo ni igi ọ̀pọ̀tọ́ náà ṣe gbẹ lẹ́sẹ̀kẹsẹ̀?”
  rationale: A yọ “báyìí” kúrò nítorí “lẹ́sẹ̀kẹsẹ̀” ti mú παραχρῆμα jáde ní kíkún. Ìyókù ọ̀rọ̀ náà ni a pa mọ́, nítorí ó jẹ́ olóòtọ́ sí ìtumọ̀ orísun náà, ó sì jẹ́ Yorùbá tó rọrùn àti tó ní iyì.
