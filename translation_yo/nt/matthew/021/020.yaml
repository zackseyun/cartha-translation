id: MAT.21.20
reference: Matthew 21:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: yo
  text: Nígbà tí àwọn ọmọ-ẹ̀yìn rí i, ẹnu yà wọ́n, wọ́n sì ní, “Báwo ni igi ọ̀pọ̀tọ́ náà ṣe gbẹ lẹ́sẹ̀kẹsẹ̀?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: nígbà tí ... rí i
  rationale: Aorist participle náà ni a túmọ̀ gẹ́gẹ́ bí gbólóhùn àkókò ní Yorùbá. Ọ̀rọ̀ arọ́pò-orúkọ “i” tọ́ka sí ohun tí wọ́n rí nínú àyíká ọ̀rọ̀, ìyẹn igi ọ̀pọ̀tọ́ tí ó ti gbẹ.
- source_word: οἱ μαθηταί
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún àwọn ọmọ tí ń tẹ̀lé olùkọ́ wọn.
- source_word: ἐθαύμασαν
  choice: ẹnu yà wọ́n
  rationale: Gbólóhùn àdáyébá Yorùbá yìí fi ìyàlẹ́nu àti ìṣẹ̀lẹ̀ tí ó yani lẹ́nu hàn, gẹ́gẹ́ bí θαυμάζω ṣe túmọ̀ sí níbí.
- source_word: λέγοντες
  choice: wọ́n sì ní
  rationale: Yíyí participle ọ̀rọ̀ sísọ padà sí gbólóhùn alájọṣe jẹ́ ọ̀nà àdáyébá láti gbé ìṣàn ọ̀rọ̀ Gíríìkì jáde ní Yorùbá.
- source_word: Πῶς
  choice: Báwo ni ... ṣe
  rationale: Àgbékalẹ̀ ìbéèrè Yorùbá yìí béèrè nípa bí ìṣẹ̀lẹ̀ náà ṣe ṣẹlẹ̀, ó sì bá agbára Πῶς mu.
- source_word: παραχρῆμα
  choice: lẹ́sẹ̀kẹsẹ̀ báyìí
  rationale: “Lẹ́sẹ̀kẹsẹ̀” fi ìtumọ̀ ‘ní kíákíá, láìjáfara’ hàn ní tààrà; “báyìí” sì jẹ́ kí ìyàlẹ́nu inú ìbéèrè náà dun bí Yorùbá àdáyébá láìyí ìtumọ̀ àkókò padà.
- source_word: ἐξηράνθη
  choice: ṣe gbẹ
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ passive, “ṣe gbẹ” ni ọ̀nà Yorùbá tó rọrùn, tó sì tọ́ láti sọ pé igi náà di gbígbẹ tàbí rọ.
- source_word: ἡ συκῆ
  choice: igi ọ̀pọ̀tọ́ náà
  rationale: “Igi ọ̀pọ̀tọ́” ni orúkọ Yorùbá fún fig tree; “náà” tọ́ka sí igi pàtó tí àyíká ọ̀rọ̀ ti mẹ́nu kàn.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó rọrùn fún gbogbo ènìyàn láti lóye, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A pa ìbéèrè ìyàlẹ́nu àwọn ọmọ-ẹ̀yìn mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
