  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní gbogbogbòò: àwọn ọmọ-ẹ̀yìn rí i, ẹnu yà wọ́n, wọ́n sì béèrè nípa bí igi ọ̀pọ̀tọ́ ṣe gbẹ ní kíákíá. Síbẹ̀, “báyìí” ń túmọ̀ sí “nísinsìnyí/now,” kì í sì ṣe apá kan παραχρῆμα; ó lè yí ìbéèrè náà sí ìbéèrè nípa àkókò ìsinsìnyí dípò ìyàlẹ́nu nípa ìsẹ̀lẹ̀ tó ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀.'
  naturalness: “Ẹnu yà wọ́n” àti “Báwo ni ... ṣe ...?” jẹ́ Yorùbá ìgbàlódé tó dáa, tó sì bá ìforúkọsílẹ̀ ìtàn ìwé mímọ́ mu. “Lẹ́sẹ̀kẹsẹ̀” nìkan ti pé fún ‘immediately’; fífi “báyìí” kún un kò ṣe àdáyébá níhìn-ín.
  terminology: “Àwọn ọmọ-ẹ̀yìn” yẹ fún οἱ μαθηταί, “ẹnu yà wọ́n” gbé ἐθαύμασαν jáde dáadáa, àti “igi ọ̀pọ̀tọ́” jẹ́ ọ̀rọ̀ tó yẹ fún ἡ συκῆ. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìjọsìn tí a yí tàbí tí ó nílò àfikún.
  issues:
