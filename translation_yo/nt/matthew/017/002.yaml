  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: yo
  text: A sì yí ìrísí rẹ̀ padà níwájú wọn[a]; ojú rẹ̀ sì tàn bí oòrùn, aṣọ rẹ̀ sì di funfun bí ìmọ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó sì yí padà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: ó yí padà
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀-ìṣe àṣeyọrí aláìṣe taara, ó sì tọ́ka sí ìyípadà tí ó hàn sí ojú ní ìwà ògo. ‘Ó yí padà’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ gbogbogbò ti ọ̀rọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ἔμπροσθεν αὐτῶν
  choice: níwájú wọn
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ ní ojú wọn àti níwájú wọn.
- source_word: ἔλαμψεν
  choice: ń tàn
  rationale: ‘Tàn’ ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé fún jíjáde ìmọ́lẹ̀; àkópọ̀ ‘ń tàn’ mú àwòrán ipò ojú rẹ̀ tí wọ́n rí nígbà náà jáde lọ́nà àdánidá.
- source_word: πρόσωπον
  choice: ojú
  rationale: Ní àyíká yìí, πρόσωπον túmọ̀ sí ojú Jesu; ‘ojú’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
- source_word: ὡς ὁ ἥλιος
  choice: bí oòrùn
  rationale: ‘Bí’ pa àfiwé tí ὡς ṣe mọ́, ‘oòrùn’ sì jẹ́ ìtumọ̀ taara ti ἥλιος.
- source_word: ἱμάτια
  choice: aṣọ
  rationale: ‘Aṣọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún aṣọ tí ènìyàn wọ̀, ó sì lè dúró fún ọ̀pọ̀ aṣọ gẹ́gẹ́ bí àkójọpọ̀.
- source_word: ἐγένετο λευκὰ
  choice: sì funfun
  rationale: Gíríìkì fi ìyípadà sí ipò funfun hàn. Ní Yorùbá, ‘aṣọ rẹ̀ sì funfun’ sọ èsì ìyípadà náà lọ́nà kedere àti àdánidá láìfi ìtẹnumọ́ tí kò sí nínú orísun kún un.
- source_word: ὡς τὸ φῶς
  choice: bí ìmọ́lẹ̀
  rationale: Ó pa àfiwé mọ́, ó sì túmọ̀ φῶς ní taara gẹ́gẹ́ bí ‘ìmọ́lẹ̀’.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìyípadà tí ó ṣẹlẹ̀ sí Jesu
  choice: ó yí padà
  alternative: a yí ìrísí rẹ̀ padà
  rationale: ‘Ó yí padà’ pa ìtumọ̀ aláìṣe taara ti Gíríìkì mọ́ ní Yorùbá àdánidá, ó sì jẹ́ kí àyíká—ojú rẹ̀ tí ń tàn àti aṣọ rẹ̀ tí ó funfun—ṣàlàyé pé ìyípadà ológo tí ó hàn sí ojú ni, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ìjọ kan pàtó.
