id: MAT.17.16
reference: Matthew 17:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: yo
  text: Mo sì mú un wá sí ọ̀dọ̀ àwọn ọmọ-ẹ̀yìn rẹ, wọ́n kò sì lè mú un láradá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò sì lágbára láti mú un láradá.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún οὐκ ἠδυνήθησαν, èyí tó tẹnu mọ́ àìní agbára láti ṣe é.
lexical_decisions:
- source_word: προσήνεγκα
  choice: mú un tọ … wá
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú ẹnì kan tọ ẹlòmíràn wá; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtọ́sọ́nà sí àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: μαθηταῖς σου
  choice: àwọn ọmọ-ẹ̀yìn rẹ
  rationale: “Ọmọ-ẹ̀yìn” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún akẹ́kọ̀ọ́ tó ń tẹ̀ lé olùkọ́, pàápàá nínú àwọn Ìwé Ìhìn Rere.
- source_word: οὐκ ἠδυνήθησαν
  choice: wọn kò sì lè
  rationale: Èyí sọ àìní agbára tàbí àìlèṣe ní ṣókí, láì fi ìdí tí wọ́n fi kùnà kún ọ̀rọ̀ náà.
- source_word: θεραπεῦσαι
  choice: mú un lára dá
  rationale: Gbólóhùn Yorùbá yìí sọ ìwòsàn ẹni tó ń ṣàìsàn tàbí tó ní ìpọ́njú ní ọ̀nà àdánidá.
- source_word: καὶ … καὶ
  choice: sì … sì
  rationale: Àtúnlò “sì” pa ìṣọ̀kan àwọn gbólóhùn méjèèjì mọ́ láì fi ìtakora tí kò sí nínú Gíríìkì kún un.
- source_word: αὐτόν
  choice: un
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ọmọkùnrin náà, ó sì jẹ́ ọ̀nà Yorùbá àdánidá lẹ́yìn ọ̀rọ̀-ìṣe.
theological_decisions:
- issue: Irú ìkùnà àwọn ọmọ-ẹ̀yìn náà
  choice: A sọ nìkan pé wọn kò lè mú un lára dá.
  alternative: Kí a ṣàlàyé pé wọn kò lè lé ẹ̀mí èṣù jáde tàbí pé àìgbàgbọ́ wọn ló fà á.
  rationale: Ẹsẹ yìí fúnra rẹ̀ sọ àìlè mú ọmọ náà lára dá nìkan; kò sọ ìdí ìkùnà náà, nítorí náà a kò mú àlàyé inú àwọn ẹsẹ tó yí i ká wọ inú rẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé yé ni a lò. Àmì ohùn kún níbi tó bá bá ìlò àdánidá mu; “mú un tọ … wá” àti “mú un lára dá” jẹ́ àwọn gbólóhùn àdánidá fún ìgbéwá àti ìwòsàn.
