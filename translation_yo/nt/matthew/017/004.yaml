id: MAT.17.4
reference: Matthew 17:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: yo
  text: 'Nígbà náà ni Pétérù dáhùn, ó sì sọ fún Jesu pé, “Olúwa, ó dára kí àwa wà níhìn-ín. Bí o bá fẹ́, èmi yóò kọ́ àgọ́ mẹ́ta síhìn-ín[a]: ọ̀kan fún ọ, ọ̀kan fún Mósè, àti ọ̀kan fún Èlíjà.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibùgbé onígbà díẹ̀,” “àgọ́ ìjọsìn,” tàbí “ilé kékeré tí a fi ewé tàbí ẹ̀ka igi ṣe” fún ọ̀rọ̀ Gíríìkì skēnas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Nígbà náà ni ... dáhùn, ó sì sọ
  rationale: Ó pa ìlànà ọ̀rọ̀ ìtàn Gíríìkì ‘dáhùn ... sọ’ mọ́, nígbà tí ‘Nígbà náà’ fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ tí δέ ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún κύριος nígbà tí a bá ń pe Jesu; ó ní ìbọ̀wọ̀, ó sì pa agbára ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láì fi dandan túmọ̀ rẹ̀ sí ọ̀nà kan ṣoṣo.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ó dára kí àwa wà níhìn-ín
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì tẹ̀lé ìtumọ̀ gbólóhùn aláìlẹ́ni Gíríìkì náà. Lílo ‘àwa’ jẹ́ kí ìtẹnumọ́ orúkọ arọ́pò ẹnìkan ọ̀pọ̀ ἡμᾶς hàn.
- source_word: εἰ θέλεις
  choice: Bí o bá fẹ́
  rationale: Ó lè túmọ̀ sí ìfẹ́ tàbí ìmúratán; ‘Bí o bá fẹ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní ìbọ̀wọ̀.
- source_word: ποιήσω
  choice: èmi yóò kọ́
  rationale: Nínú ọ̀rọ̀ nípa fífi ilé ìgbà díẹ̀ sílẹ̀, ‘kọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ‘ṣe’ lọ; ‘èmi’ sì ń fi ìtẹnumọ́ ẹni tó ń ṣe ìlérí náà hàn.
- source_word: σκηνάς
  choice: àgọ́
  rationale: ‘Àgọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ibùgbé tàbí ibi ààbò tí kì í ṣe ilé pípẹ́. Ó tún lè gba ìtumọ̀ àgọ́ ìjọsìn tàbí àgọ́ àjọ̀dún láàyè, láì fipá yan ìtumọ̀ yẹn.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: ọ̀kan fún ọ, ọ̀kan fún Mose, àti ọ̀kan fún Elijah
  rationale: Àtúnsọ ‘ọ̀kan’ fún olúkúlùkù pa ìtẹnumọ́ pínpín ti μίαν tí a tún sọ ní Gíríìkì mọ́.
- source_word: ὧδε
  choice: níhìn-ín / síhìn-ín
  rationale: 'Àwọn fọ́ọ̀mù méjèèjì jẹ́ àdánidá gẹ́gẹ́ bí ìṣe ọ̀rọ̀ Yorùbá: ‘wà níhìn-ín’ fún ipò àti ‘kọ́ ... síhìn-ín’ fún ibi tí a ó gbé ohun kalẹ̀; wọ́n pa àtúnsọ ‘níbí’ inú Gíríìkì mọ́.'
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí Peteru ń pe Jesu
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìbọ̀wọ̀ àti agbára ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ orúkọ oyè náà mọ́; ‘Ọ̀gá’ lè sọ ọ́ di ọ̀rọ̀ ìbọ̀wọ̀ lásán.
- issue: Ìtumọ̀ σκηνάς nínú ìṣẹ̀lẹ̀ ìyípadà ògo
  choice: àgọ́
  alternative: ibùgbé onígbà díẹ̀; àgọ́ ìjọsìn
  rationale: Ẹsẹ̀ náà kò sọ ní tààrà pé Àjọ̀dún Àgọ́ ni Peteru ń tọ́ka sí. ‘Àgọ́’ dúró ní àárín, ó sì jẹ́ kí ìbáṣepọ̀ pẹ̀lú àgọ́ ìjọsìn tàbí àjọ̀dún ṣeé ṣe láì fipá mú un wọ inú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa àtúnsọ àti ìtẹnumọ́ inú Gíríìkì mọ́ níbi tí Yorùbá ti gbà á láàyè.
