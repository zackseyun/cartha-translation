id: MAT.17.25
reference: Matthew 17:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: yo
  text: Ó ní, “Bẹ́ẹ̀ ni.” Nígbà tí ó sì wọ inú ilé, Jésù kọ́kọ́ bá a sọ̀rọ̀ pé, “Kí ni o rò, Símónì? Ọ̀dọ̀ ta ni àwọn ọba ayé ti ń gba owó ìbòdè tàbí owó orí[a]—ọ̀dọ̀ àwọn ọmọkùnrin wọn fúnra wọn ni, tàbí ọ̀dọ̀ àwọn àjèjì[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “owó kọ́ọ̀sítọ̀mù tàbí owó ọba.” Ọ̀rọ̀ Gíríìkì méjì ọ̀tọ̀ ni a lò: τέλη jẹ́ owó ìbòdè tàbí owó kọ́ọ̀sítọ̀mù, κῆνσος sì jẹ́ owó orí ẹni kọ̀ọ̀kan tàbí owó ọba.'
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn tí kì í ṣe ti ìdílé wọn.” Ọ̀rọ̀ Gíríìkì ἀλλοτρίων ń tọ́ka sí àwọn tí kì í ṣe ọmọ tàbí ara ìdílé ẹni, ìyẹn àwọn ẹni òde.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Èyí jẹ́ ìdáhùn ìfọ̀rọ̀sí tó rọrùn, tó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Nígbà tí ó sì wọ inú ilé
  rationale: A sọ participle náà di gbólóhùn àsìkò; ẹni tí ó wọ ilé ni Símónì, gẹ́gẹ́ bí ìṣọ̀kan gírámà Gíríìkì ṣe fi hàn.
- source_word: προέφθασεν αὐτὸν
  choice: Jésù kọ́kọ́ bá a sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pé Jésù mú ìṣáájú, ó sì sọ̀rọ̀ kí Símónì tó sọ ohun tí ó fẹ́ sọ.
- source_word: Τί σοι δοκεῖ
  choice: Kí ni o rò
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè fún èrò tàbí ìdájọ́ ẹni.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: àwọn ọba ayé
  rationale: Ó pa ìtumọ̀ gbòòrò γῆ mọ́, láì dín un kù sí ilẹ̀ kan pàtó.
- source_word: τέλη
  choice: owó ìbòdè
  rationale: Ó ń tọ́ka sí owó tí a ń gba lórí ọjà, ọ̀nà, tàbí ní ààlà; ó sì yàtọ̀ sí owó orí ẹni kọ̀ọ̀kan.
- source_word: κῆνσον
  choice: owó orí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí owó tí a ń gba lọ́wọ́ ẹni kọ̀ọ̀kan gẹ́gẹ́ bí owó ìṣàkóso tàbí owó ọba.
- source_word: υἱῶν αὐτῶν
  choice: àwọn ọmọkùnrin wọn fúnra wọn
  rationale: A pa ìtumọ̀ pàtó ‘ọmọkùnrin’ àti ìtẹnumọ́ pé ọmọ tiwọn mọ́, kí àfiwé ìdílé inú ọ̀rọ̀ Jésù má bàa sọnù.
- source_word: ἀλλοτρίων
  choice: àwọn àjèjì
  rationale: Ó fi àwọn tí kì í ṣe ara ìdílé ọba wé àwọn ọmọkùnrin rẹ̀, ó sì pa ìtumọ̀ ẹni òde mọ́.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ‘àwọn ọmọkùnrin wọn’ lè ní nínú àfiwé Jésù
  choice: A pa èdè ìdílé náà mọ́ gẹ́gẹ́ bí ‘àwọn ọmọkùnrin wọn fúnra wọn,’ láì ṣàlàyé ìtumọ̀ rẹ̀ nípa Kristi sínú ẹsẹ yìí.
  alternative: àwọn ọmọ wọn; àwọn ọmọ abẹ́ wọn
  rationale: Kókó àfiwé náà ni pé àwọn ọmọ ọba kì í ṣe àwọn tí ọba ń gba owó lọ́wọ́. Èdè ‘ọmọkùnrin’ tún ń mú ìsopọ̀ pẹ̀lú ẹsẹ tó tẹ̀ lé e dúró láì fi ìtumọ̀ kan lé e lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “owó ìbòdè” àti “owó orí” láti pa ìyàtọ̀ tó wà láàárín irú owó méjèèjì nínú Gíríìkì mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí àlàyé wọn kan, dípò ibi tí wọ́n wà nínú consultation layer Gẹ̀ẹ́sì, nítorí ibẹ̀ kò bá àkóónú àlàyé náà mu.
