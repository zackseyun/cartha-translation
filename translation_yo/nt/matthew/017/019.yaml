id: MAT.17.19
reference: Matthew 17:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: yo
  text: Nígbà náà, àwọn ọmọ-ẹ̀yìn náà wá sọ́dọ̀ Jésù ní ìkọ̀kọ̀, wọ́n sì wí pé, “Èé ṣe tí àwa kò fi lè lé e[a] jáde?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí “e” tọ́ka sí ẹ̀mí èṣù náà; ó tún lè tọ́ka sí ọmọkùnrin náà.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Nígbà náà ni
  rationale: Ó ṣe àmì ìtẹ̀síwájú ìṣẹ̀lẹ̀ nínú ìtàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘lẹ́yìn náà’ ní Yorùbá.
- source_word: προσελθόντες
  choice: tọ ... wá
  rationale: Ó túmọ̀ sí pé wọ́n sún mọ́ Jésù tàbí wọ́n wá bá a; ọ̀rọ̀ yìí dùn bí Yorùbá àdánidá.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún àwọn tí ń tẹ̀ lé olùkọ́, pàápàá àwọn ọmọ-ẹ̀yìn Jésù.
- source_word: τῷ Ἰησοῦ
  choice: Jésù
  rationale: A lo àkọtọ orúkọ tí ó wọ́pọ̀ ní Yorùbá, gẹ́gẹ́ bí ẹni tí wọ́n tọ̀ wá.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Ó sọ pé ìjíròrò náà kò ṣẹlẹ̀ ní gbangba, bí kò ṣe ní àdáni.
- source_word: εἶπον
  choice: wọ́n sì wí pé
  rationale: Ó tẹ̀ lé ìtumọ̀ gidi ti λέγω, ‘wí/sọ,’ bí ó tilẹ̀ jẹ́ pé ìbéèrè ni ọ̀rọ̀ tí ó tẹ̀ lé.
- source_word: Διὰ τί
  choice: Èé ṣe
  rationale: Ọ̀nà Yorùbá àdánidá àti tí ó ṣe kedere láti béèrè ìdí.
- source_word: ἡμεῖς
  choice: àwa
  rationale: Àrọ́pò-orúkọ náà farahàn gbangba nínú Gíríìkì, ó sì ní ìtẹnumọ́ díẹ̀; ‘àwa’ pa ìtẹnumọ́ yẹn mọ́.
- source_word: οὐκ ἠδυνήθημεν
  choice: kò fi lè
  rationale: Ó fi àìlera tàbí àìní agbára láti ṣe ohun náà hàn ní Yorùbá àdánidá.
- source_word: ἐκβαλεῖν
  choice: lé ... jáde
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún mímú ẹ̀mí èṣù kúrò lára ẹni, ó sì pa agbára ìṣe ‘lé jáde’ mọ́.
- source_word: αὐτό
  choice: e
  rationale: Àrọ́pò-orúkọ Yorùbá ‘e’ kò fi akọ tàbí abo hàn, ó sì lè tọ́ka sí ẹ̀mí èṣù tàbí ọmọkùnrin náà; a fi àlàyé sí àkọsílẹ̀ ìsàlẹ̀ láti pa àìdánilójú Gíríìkì mọ́.
theological_decisions:
- issue: Ohun tí αὐτό ń tọ́ka sí nínú ọ̀rọ̀ lílé jáde
  choice: A lo ‘e,’ àrọ́pò-orúkọ tí kò sọ ní pàtó bóyá ẹ̀mí èṣù ni tàbí ọmọkùnrin náà.
  alternative: A lè sọ ní kedere pé ‘ẹ̀mí èṣù náà’ tàbí ‘ọmọkùnrin náà.’
  rationale: Gíríìkì lo àrọ́pò-orúkọ aláìdánilójú ní àyíká yìí. Bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe jù pé ẹ̀mí èṣù ni ó ń tọ́ka sí, Yorùbá ‘e’ jẹ́ kí àìdánilójú inú orísun dúró láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ní ìkọ̀kọ̀’ àti ‘lé e jáde’ pa ìtumọ̀ orísun mọ́ láìjẹ́ kíkankíkan.
