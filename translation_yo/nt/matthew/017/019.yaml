  terminology: «Àwọn ọmọ-ẹ̀yìn», «ní ìkọ̀kọ̀», àti «lé e jáde» bá ọ̀rọ̀ inú ìhìn rere mu. A pa ‘e’ mọ́ kí a má ṣe pinnu láìdájú bóyá ẹ̀mí èṣù tàbí ọmọkùnrin ni αὐτό tọ́ka sí.
