  rationale: A tún ìṣe ‘wá sí ọdọ Jésù’ ṣe sí «wá sọ́dọ̀ Jésù» nítorí pé ó ṣàlàyé ìtumọ̀ προσελθόντες τῷ Ἰησοῦ dáadáa nínú Yorùbá. A kò yí ìtumọ̀ ìbéèrè náà, ìtẹnumọ́ «àwa», tàbí àìdánilójú αὐτό padà.
  reviewer_model: gpt-5.6-terra
