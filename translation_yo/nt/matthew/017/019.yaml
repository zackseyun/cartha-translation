revisions:
- from: Nígbà náà ni àwọn ọmọ-ẹ̀yìn tọ Jésù wá ní ìkọ̀kọ̀, wọ́n sì wí pé, “Èé ṣe tí àwa kò fi lè lé e[a] jáde?”
