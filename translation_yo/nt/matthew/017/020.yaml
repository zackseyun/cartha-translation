  terminology: “Ìgbàgbọ́,” “Lóòótọ́ ni,” àti “irúgbìn músítádì” jẹ́ àwọn ọ̀rọ̀ tó bójú mu. Wọ́n ṣetọju ìtumọ̀ πίστις láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un. Àwọn akọsilẹ̀ ẹsẹ̀ méjèèjì bá àwọn ibi àmì wọn mu, wọ́n sì ṣàlàyé yíyan ọ̀rọ̀ ní ọ̀nà tó tọ́.
