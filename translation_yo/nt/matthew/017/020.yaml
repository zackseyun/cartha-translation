  source_fidelity: 'Ìtumọ̀ náà fara mọ́ SBLGNT dáadáa: δέ ni a ṣàfihàn pẹ̀lú “Ṣùgbọ́n”; λέγει ni “ó sọ” (àkókò ìtàn Yorùbá tí ó ṣeé gbà); ὀλιγοπιστία ni ìgbàgbọ́ kékeré/kò péye, kì í ṣe àìgbàgbọ́ pátápátá; àṣẹ sí òkè náà, ìṣípo òkè náà fúnra rẹ̀, àti ìpèníjà ìkẹyìn ni a pa mọ́.'
