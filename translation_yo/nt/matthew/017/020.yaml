id: MAT.17.20
reference: Matthew 17:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: yo
  text: Ṣùgbọ́n ó sọ fún wọn pé, “Nítorí ìgbàgbọ́ yín kéré ni.[a] Lóòótọ́ ni mo wí fún yín, bí ẹ bá ní ìgbàgbọ́ bí irúgbìn músítádì kékeré,[b] ẹ ó sọ fún òkè yìí pé, ‘Kúrò níhìn-ín lọ sí ibẹ̀,’ yóò sì kúrò; kò sì sí ohun kan tí kì yóò ṣeé ṣe fún yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Nítorí àìní ìgbàgbọ́ yín”; ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí ìgbàgbọ́ tí ó kéré tàbí tí kò péye ju àìgbàgbọ́ pátápátá lọ.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “bí irúgbìn músítádì”; àfiwé náà ń tọ́ka sí ohun tí ó kéré gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ó sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo àkókò ìsinsìnyí ìtàn, àkókò àtijọ́ ni ó bá ìtàn Yorùbá òde òní mu jù, láìyí ìtumọ̀ ọ̀rọ̀ náà padà.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Nítorí ìgbàgbọ́ yín kéré ni
  rationale: ὀλιγοπιστία ń tọ́ka sí ìgbàgbọ́ tí ó kéré tàbí tí kò péye, kì í ṣe àìní ìgbàgbọ́ pátápátá.
- source_word: ἀμὴν
  choice: Lóòótọ́ ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti fi ìmúdájú pàtàkì tí ἀμὴν ní hàn.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìgbẹ́kẹ̀lé agbára Ọlọ́run; ‘ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí kò sì fi ẹ̀kọ́ ẹgbẹ́ ìjọ kan kún un.
- source_word: ὡς κόκκον σινάπεως
  choice: bí irúgbìn músítádì kékeré
  rationale: Ó pa àfiwé mọ́, ó sì mú kedere pé ohun tí a ń fi wé e jẹ́ ohun kékeré.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Kúrò níhìn-ín lọ sí ibẹ̀
  rationale: Èyí jẹ́ àṣẹ Yorùbá àdánidá tí ó sọ ìṣípò láti ibi kan sí òmíràn.
- source_word: μεταβήσεται
  choice: yóò sì kúrò
  rationale: 'Ọ̀rọ̀-ìṣe náà jẹ́ aláìní olùṣe míràn níbí: òkè náà fúnra rẹ̀ yóò ṣí kúrò.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: kò sì sí ohun kan tí kì yóò ṣeé ṣe fún yín
  rationale: Èyí sọ àṣàyàn Gíríìkì náà ní Yorùbá tí ó ṣe kedere, láìsọ pé àwọn ọmọ-ẹ̀yìn ní agbára láti ara wọn.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní àyíká iṣẹ́ ìyanu
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: Àyíká náà ń sọ̀rọ̀ nípa ìgbẹ́kẹ̀lé Ọlọ́run tí kò péye, kì í ṣe nípa ìgbàgbọ́ ìgbàlà tàbí ìṣòtítọ́; ‘ìgbàgbọ́’ pa àyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- issue: Bóyá ὀλιγοπιστία túmọ̀ sí àìní ìgbàgbọ́ pátápátá
  choice: ìgbàgbọ́ yín kéré
  alternative: àìní ìgbàgbọ́ yín
  rationale: Ọ̀rọ̀ náà sábà ń tọ́ka sí ìgbàgbọ́ tí ó kù díẹ̀ tàbí tí kò péye, nítorí náà a kò túmọ̀ rẹ̀ sí àìgbàgbọ́ pátápátá.
translation_notes:
  register: Yorùbá àtẹ̀jáde, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A lo ‘ẹ/yín’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí Gíríìkì ṣe fi hàn. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
