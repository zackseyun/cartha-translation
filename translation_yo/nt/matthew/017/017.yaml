  source_fidelity: Ìtumọ̀ náà ń pa ìtumọ̀ gbogbogbò ἀποκριθεὶς δὲ, ἄπιστος, γενεά, àti àwọn ìbéèrè méjèèjì mọ́. Síbẹ̀, “oníwà wíwọ́” kì í jẹ́ àpèjúwe Yorùbá boṣewa tó ṣe kedere fún διεστραμμένη, àti ọ̀nà “Yóò ti pẹ́ tó tí...” kò rọrùn gẹ́gẹ́ bí ìbéèrè ἕως πότε. Àṣẹ ìkẹyìn tún yẹ kí ó fi ìtọ́ka “sí ọ̀dọ̀ mi” hàn dípò “fún mi,” èyí tí ó lè yí dative náà sí ‘for me.’
