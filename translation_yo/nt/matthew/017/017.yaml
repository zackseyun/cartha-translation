id: MAT.17.17
reference: Matthew 17:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù dáhùn pé, “Ìran aláìgbàgbọ́[a] àti ọlọ̀tẹ̀[b]! Èmi yóò wà pẹ̀lú yín títí di ìgbà wo? Èmi yóò máa fara dà á fún yín títí di ìgbà wo? Ẹ mú un wá síhìn-ín, sí ọ̀dọ̀ mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “aláìṣòtítọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni tí kò gbàgbọ́ tàbí ẹni tí kò ní ìṣòtítọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìran tí ó ti yapa kúrò ní ọ̀nà tó tọ́” tàbí “ìran oníbàjẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ṣùgbọ́n Jésù dáhùn pé
  rationale: Ọ̀rọ̀ náà jẹ́ àṣà Gíríìkì tí ó túmọ̀ sí pé ó dáhùn, nígbà tí δέ sì ń fi ìyípadà sí ọ̀rọ̀ ìbáwí hàn; “Ṣùgbọ́n” bá ìṣàn ọ̀rọ̀ náà mu.
- source_word: Ὦ γενεὰ
  choice: Ìran ... yìí!
  rationale: “Ìran” pa ìtumọ̀ γενεά gẹ́gẹ́ bí ẹgbẹ́ àwọn ènìyàn ìgbà kan mọ́; àmì ìyanu àti “yìí” mú agbára ìpè àti ẹ̀dùn Ὦ jáde lọ́nà Yorùbá àdánidá.
- source_word: ἄπιστος
  choice: aláìgbàgbọ́
  rationale: Ó tọ́ka sí àìní ìgbàgbọ́ ní àyíká ìṣẹ̀lẹ̀ yìí, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí aláìṣòótọ́; àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́.
- source_word: διεστραμμένη
  choice: oníwà wíwọ́
  rationale: Perfect passive participle náà ṣàpèjúwe ìran tí ìwà rẹ̀ ti yí kúrò ní ọ̀nà tó tọ́; “oníwà wíwọ́” jẹ́ ọ̀rọ̀ ọ̀wọ̀ tó ní agbára ìbáwí láìdín un kù sí ìtumọ̀ ìbálòpọ̀.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Yóò ti pẹ́ tó tí èmi yóò fi wà pẹ̀lú yín?
  rationale: Ìbéèrè àròsọ náà ni a túmọ̀ ní ọ̀nà Yorùbá tó ṣe kedere, ní pípa ọjọ́ iwájú àti “pẹ̀lú yín” mọ́.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Yóò ti pẹ́ tó tí èmi yóò fi máa fara dà á fún yín?
  rationale: “Fara dà á fún yín” sọ ìfaradà ẹni tí àwọn mìíràn ń dán wò, ó sì pa ìbínú inú ìbéèrè náà mọ́.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Ẹ mú un wá síbí fún mi
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni φέρετε; “mú un wá síbí fún mi” jẹ́ ìtumọ̀ Yorùbá àdánidá tí ó pa ẹni, ibi, àti olùgbà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἄπιστος nínú ìbáwí Jésù
  choice: aláìgbàgbọ́
  alternative: aláìṣòótọ́
  rationale: Àyíká ẹsẹ náà dá lórí àìní ìgbàgbọ́, ṣùgbọ́n akọsilẹ̀ [a] jẹ́ kí ìtumọ̀ kejì tí ó ṣeé ṣe wà ní gbangba láìfi ẹ̀kọ́ ìsìn kan lé ọrọ̀ náà lórí.
- issue: Ẹni tí Jésù ń bá wí ní γενεὰ
  choice: ìran
  alternative: àwọn ènìyàn
  rationale: “Ìran” pa ìwọ̀n àti ìró àsọtẹ́lẹ̀ ti γενεά mọ́, láìpinnu bóyá àwọn ọmọ-ẹ̀yìn nìkan tàbí gbogbo àwọn tó wà níbẹ̀ ni ọ̀rọ̀ náà kàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì ní agbára ìbáwí. A lo “ẹ/yín” nítorí pé ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ ènìyàn, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ sí ẹnì kan.
