id: MAT.17.18
reference: Matthew 17:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: yo
  text: Jésù sì bá a wí, ẹ̀mí èṣù náà sì jáde lára rẹ̀; ọmọkùnrin náà sì rí ìwòsàn láti ìgbà náà lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọkùnrin náà sì rí ìwòsàn láti wákàtí yẹn lọ.”
    reason: 'Àyàn ìtumọ̀ ọ̀rọ̀: èyí tẹ̀ lé ἀπὸ τῆς ὥρας ἐκείνης ní ọ̀nà tó sún mọ́ ọ̀rọ̀ Gíríìkì jù.'
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: bá a wí
  rationale: Ọ̀rọ̀ yìí fi ìbáwí líle tí ó ní àṣẹ hàn; ‘bá a wí’ jẹ́ èdè Yorùbá àdánidá tí kò sọ ọ́ di àṣẹ lásán.
- source_word: αὐτῷ
  choice: a
  rationale: Arọ́pò-orúkọ Yorùbá ‘a’ lè tọ́ka sí ẹni tàbí ẹ̀mí èṣù tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀ náà, nítorí náà ó pa ìṣòro ìtọ́kasí inú Gíríìkì mọ́ láìfi tipátipá yàn ọ̀kan.
- source_word: δαιμόνιον
  choice: ẹ̀mí èṣù
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ẹ̀dá ẹ̀mí búburú tí δαιμόνιον ń tọ́ka sí; kò fi ọ̀rọ̀ ‘aláìmọ́’ tí kò sí nínú ẹsẹ yìí kún un.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: jáde lára rẹ̀
  rationale: Gbólóhùn yìí ṣàfihàn ìjáde ẹ̀mí èṣù kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐθεραπεύθη
  choice: rí ìwòsàn
  rationale: ‘Rí ìwòsàn’ túmọ̀ sí pé a mú un láradá, láìdín ìtumọ̀ náà kù sí ìtọ́jú ìṣègùn nìkan.
- source_word: ὁ παῖς
  choice: ọmọkùnrin náà
  rationale: Àyíká ìtàn náà fi hàn pé ọmọ ọkùnrin baba náà ni; èyí yẹra fún ìtumọ̀ ‘ìránṣẹ́’ tí kò bá àyíká mu.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: láti ìgbà náà lọ
  rationale: Èyí sọ àbájáde tí ó bẹ̀rẹ̀ ní àkókò náà tí ó sì dúró ṣinṣin ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ fi ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ‘wákàtí’ hàn.
theological_decisions:
- issue: Ẹni tí αὐτῷ tọ́ka sí nínú ìbáwí Jésù
  choice: A lo ‘a’ láìsọ ní tààrà pé ọmọkùnrin tàbí ẹ̀mí èṣù ni.
  alternative: Kí a sọ pé Jésù bá ẹ̀mí èṣù náà wí.
  rationale: Gbólóhùn tó tẹ̀ lé e mú kí ẹ̀mí èṣù jẹ́ ìtọ́kasí tó ṣeé ṣe jù, ṣùgbọ́n Gíríìkì fúnra rẹ̀ lo arọ́pò-orúkọ tí ó lè ní ìtọ́kasí méjì. Yorùbá ‘a’ pa àìdánilójú gidi yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìtòlẹ́sẹẹsẹ àwọn gbólóhùn pa ìṣàn ìṣe inú Gíríìkì mọ́, ṣùgbọ́n a yàn ‘láti ìgbà náà lọ’ dípò gbólóhùn wákàtí tí kò fi bẹ́ẹ̀ jẹ́ àdánidá ní Yorùbá òde òní.
