id: MAT.17.3
reference: Matthew 17:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: yo
  text: Sì kíyèsí i, Mósè àti Èlíjà farahàn sí wọn, wọ́n sì ń bá a sọ̀rọ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa ìtumọ̀ àmì àsọyé tí ń fa àfiyèsí mọ́, ó sì mú ìṣẹ̀lẹ̀ náà hàn bí ohun tí ó ṣẹlẹ̀ lójijì, ní èdè Yorùbá àdánidá.
- source_word: ὤφθη αὐτοῖς
  choice: farahàn wọ́n
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà jẹ́ aláìṣe ní ìrísí, ṣùgbọ́n ó sábà túmọ̀ sí ‘farahàn’; àfikún ‘wọ́n’ fi àwọn tí wọ́n rí ìfarahàn náà hàn láìfi àlàyé kún un.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Èyí ni ọ̀nà tí orúkọ Mósè gbà wọ́pọ̀ nínú Yorùbá.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: A lo ìrísí orúkọ tí ó wọ́pọ̀, pẹ̀lú àmì ohùn Yorùbá níbi tí ó bá yẹ.
- source_word: συλλαλοῦντες
  choice: ń bá a sọ̀rọ̀
  rationale: Ó fi ìbánisọ̀rọ̀ papọ̀ hàn ní èdè Yorùbá tó ṣe déédéé, dípò ọ̀rọ̀ tí yóò dun bí èdè àkọ́kọ́ tàbí èdè líle.
- source_word: μετ’ αὐτοῦ
  choice: bá a
  rationale: Ó pa arọ́pò-orúkọ náà mọ́ gẹ́gẹ́ bí Gíríìkì; àyíká ìtàn ló fi hàn pé Jésù ni ‘a’ ń tọ́ka sí.
theological_decisions:
- issue: Ẹni tí αὐτοῦ (‘òun’) ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí arọ́pò-orúkọ nínú ‘bá a sọ̀rọ̀’; Jésù ni àyíká fi hàn.
  alternative: Kí a sọ ‘wọ́n ń bá Jésù sọ̀rọ̀.’
  rationale: Pípa arọ́pò-orúkọ mọ́ tẹ̀ lé Gíríìkì, ó sì yẹra fún fífi orúkọ tí kò sí nínú ẹsẹ náà sí i, bí ó tilẹ̀ jẹ́ pé ẹni tí a ń tọ́ka sí ṣe kedere nínú àyíká.
- issue: Ìṣẹ̀lẹ̀ ìfarahàn Mose àti Èlíjà
  choice: ‘farahàn wọ́n’
  alternative: ‘wọ́n rí Mose àti Èlíjà’
  rationale: Èyí sọ pé wọ́n di ohun tí àwọn ọmọ-ẹ̀yìn lè rí, láìpinnu ọ̀nà tàbí irú ìwàláàyè tí ìfarahàn wọn ní.
translation_notes:
  register: Èdè Yorùbá boṣewa, àdánidá, tí ó ní iyì ni a lò. ‘Sì wò ó’ jẹ́ àmì ìfa-àfiyèsí; ‘ń bá a sọ̀rọ̀’ sì jẹ́ ọ̀nà òde òní tí ó ṣe kedere fún ìbánisọ̀rọ̀.
