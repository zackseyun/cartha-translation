  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: yo
  text: Ó dáhùn pé, “Dájúdájú, Èlíjà ń bọ̀[a], yóò sì mú ohun gbogbo padà bọ̀ sípò.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí ìsinsìnyí, ṣùgbọ́n níbí ó ń tọ́ka sí ohun tí yóò ṣẹlẹ̀ ní ọjọ́ iwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ó dáhùn pé
  rationale: Ọ̀rọ̀ náà jẹ́ àkójọpọ̀ participle àti finite verb tí ó wọ́pọ̀ nínú Gíríìkì tí ipa èdè Semitic ní; ‘Ó dáhùn pé’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ ìdáhùn mọ́ láìṣe àtúnwí tí kò pọndandan.
- source_word: Ἠλίας
  choice: Èlíjà
  rationale: A lo ìrísí orúkọ tí ó ti fìdí múlẹ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá.
- source_word: μέν
  choice: Dájúdájú
  rationale: Ó fi ìtẹnumọ́ hàn, ó sì ń pèsè ọ̀nà fún ìyàtọ̀ tí ẹsẹ tó tẹ̀ lé e yóò sọ; ‘Dájúdájú’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ipa yìí mọ́.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà wà ní present tense ní Gíríìkì, ó tọ́ka sí ọjọ́ iwájú nínú àyíká yìí; ‘ń bọ̀’ pa ìgbésẹ̀ tó ń sún mọ́lé mọ́.
- source_word: ἀποκαταστήσει
  choice: yóò mú ... padà bọ̀ sípò
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà túmọ̀ sí mímú ohun padà sí ipò rẹ̀; ìtumọ̀ yìí ṣe kedere ní Yorùbá, kò sì ṣàlàyé irú ìmúpadàbọ̀ náà rékọjá ohun tí Gíríìkì sọ.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Neuter plural náà ní ìwọ̀n gbooro; ‘ohun gbogbo’ pa ìkúnrẹ́rẹ́ rẹ̀ mọ́ láìfi ohun tí a kò dárúkọ kún un.
theological_decisions:
- issue: Irú àti ìwọ̀n iṣẹ́ ìmúpadàbọ̀ Èlíjà
  choice: yóò mú ohun gbogbo padà bọ̀ sípò
  alternative: yóò tún ohun gbogbo ṣe déédéé; yóò mú gbogbo ènìyàn àti ohun gbogbo padà sí ipò tó yẹ
  rationale: Ẹsẹ náà sọ ìmúpadàbọ̀ náà ní ọ̀nà gbooro, kò sì ṣàlàyé bóyá ìmúdọ̀tun ẹ̀mí, àtúnṣe àwùjọ, tàbí ìmúṣẹ ní òpin ayé ni. A pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó sì ṣeé lóye fún òǹkàwé òde òní; a fi àmì ohùn sí ibi tí ó bá yẹ. Ìtumọ̀ náà pa ìtẹnumọ́ μέν àti ìwọ̀n gbooro πάντα mọ́.
