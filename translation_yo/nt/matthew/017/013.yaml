id: MAT.17.13
reference: Matthew 17:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: yo
  text: Nígbà náà ni àwọn ọmọ-ẹ̀yìn náà lóye pé nípa Jòhánù Onítẹ̀bọmi[a] ni ó sọ̀rọ̀ fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Jòhánù Olùtẹ̀bọmi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nígbà náà ni
  rationale: Ó fi àkókò tí òye dé bá àwọn ọmọ-ẹ̀yìn hàn, ó sì jẹ́ àsopọ̀ ìtàn tí ó bá Yorùbá mu.
- source_word: συνῆκαν
  choice: lóye
  rationale: Ó túmọ̀ sí pé wọ́n wá mọ ìtumọ̀ ọ̀rọ̀ náà; ‘lóye’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì sọ ohun tí orísun kò sọ.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Èyí ni ìtumọ̀ tí a mọ̀ dáadáa fún àwọn tí ń tẹ̀lé Jesu gẹ́gẹ́ bí akẹ́kọ̀ọ́ rẹ̀.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí àwọn ọmọ-ẹ̀yìn lóye sílẹ̀, kì í ṣe gbólóhùn ìdí.
- source_word: περὶ
  choice: nípa
  rationale: Pẹ̀lú ọ̀rọ̀ orúkọ nínú genitive níbí, ó tọ́ka sí ẹni tí ọ̀rọ̀ náà dá lé lórí.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jòhánù Onítẹ̀bọmi
  rationale: ‘Onítẹ̀bọmi’ jẹ́ àkọlé Yorùbá tí ó wọ́pọ̀ fún Jòhánù, ó sì ṣàfihàn ẹni tí ń ṣe ìtẹ̀bọmi.
- source_word: εἶπεν αὐτοῖς
  choice: ni ó sọ̀rọ̀ fún wọn
  rationale: Ó pa ìṣe sísọ mọ́ láìfi àlàyé míì kún un; ìṣètò gbólóhùn náà tún jẹ́ kí ó hàn pé ọ̀rọ̀ náà ti ṣẹlẹ̀ ṣáájú òye wọn.
theological_decisions:
- issue: Ìdánimọ̀ ẹni tí Jesu ń tọ́ka sí gẹ́gẹ́ bí Èlíjà nínú àyíká ọ̀rọ̀ yìí
  choice: Ẹsẹ̀ náà sọ ní tààrà pé àwọn ọmọ-ẹ̀yìn lóye pé Jòhánù Onítẹ̀bọmi ni Jesu ń sọ̀rọ̀ nípa rẹ̀.
  alternative: Kí a ṣàlàyé síwájú sí i bí Jòhánù ṣe jẹ́ Èlíjà.
  rationale: Ìdánimọ̀ ẹni náà wà nínú ìtàn fúnra rẹ̀, ṣùgbọ́n ẹsẹ̀ yìí kò ṣàlàyé irú ìbáṣepọ̀ tí ó wà láàárín Jòhánù àti Èlíjà; nítorí náà a kò gbọ́dọ̀ fi ẹ̀kọ́ ìtumọ̀ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A yan ‘Onítẹ̀bọmi’ gẹ́gẹ́ bí àkọlé tí ó wọ́pọ̀, a sì fi ‘Olùtẹ̀bọmi’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tí ó tẹnumọ́ iṣẹ́ ẹni náà.
