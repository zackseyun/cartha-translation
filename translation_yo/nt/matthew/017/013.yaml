  source_fidelity: 'Ìtumọ̀ náà ṣètọ́ sí Gíríìkì: ‘Nígbà náà’ ń ṣàfihàn τότε, ‘lóye pé’ ń gbé συνῆκαν ὅτι kalẹ̀ dáadáa, ‘nípa Jòhánù Onítẹ̀bọmi’ ń bá περὶ Ἰωάννου τοῦ βαπτιστοῦ mu, àti ‘ó sọ̀rọ̀ fún wọn’ ń fi εἶπεν αὐτοῖς hàn láìfikún àlàyé tí kò sí nínú ẹsẹ̀ náà. Ìṣètò ìfojúsọ́nà ‘nípa ... ni ó sọ̀rọ̀’ jẹ́ ìlò Yorùbá tí ó dára.'
