id: MAT.17.10
reference: Matthew 17:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn náà sì bi í pé, “Èé ṣe nígbà náà tí àwọn akọ̀wé fi ń sọ pé Èlíjà gbọ́dọ̀ kọ́kọ́ dé?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: bi í pé
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí bíbéèrè ìbéèrè tààrà; ‘bi í pé’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti mú ìbéèrè náà wọlé.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Atọ́ka ọ̀rọ̀ Gíríìkì fi hàn pé ẹgbẹ́ kan tí a ti mọ̀ ni; ‘náà’ mú ìdánimọ̀ yẹn jáde láìfi ‘tirẹ̀’ kún un.
- source_word: λέγοντες
  choice: pé
  rationale: Nínú Yorùbá àdánidá, ‘bi í pé’ mú iṣẹ́ participle náà àti ọ̀rọ̀ ìbéèrè tó tẹ̀ lé e pọ̀; títúmọ̀ rẹ̀ lọ́tọ̀ sí ‘wọ́n ń wí pé’ yóò wuwo.
- source_word: Τί οὖν
  choice: Èé ṣe nígbà náà
  rationale: Ní àyíká yìí τί ń béèrè ìdí, οὖν sì so ìbéèrè náà mọ́ ohun tó ṣáájú; ‘Èé ṣe nígbà náà’ pa méjèèjì mọ́.
- source_word: γραμματεῖς
  choice: àwọn akọ̀wé
  rationale: ‘Àwọn akọ̀wé’ ni ìtumọ̀ tààrà àti ọ̀rọ̀ Bíbélì tí a mọ̀ fún àwọn amòfin ẹ̀sìn Júù; kò fi àlàyé tí kò sí nínú orísun kún un.
- source_word: λέγουσιν ὅτι
  choice: fi ń sọ pé
  rationale: Ìṣètò ‘Èé ṣe ... fi ń sọ pé’ jẹ́ àdánidá ní Yorùbá, ó sì mú ọ̀rọ̀ ìbéèrè ìdí àti gbólóhùn àkóónú náà hàn.
- source_word: Ἠλίαν
  choice: Èlíjà
  rationale: A lo ọ̀nà ìkọ orúkọ náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: δεῖ ἐλθεῖν
  choice: gbọ́dọ̀ dé
  rationale: ‘Gbọdọ̀’ pa agbára ìjẹ́dandan δεῖ mọ́, ‘dé’ sì jẹ́ àdánidá fún wíwá ẹni tí a ń retí.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: ‘Kọ́kọ́’ ń fi ipò àkọ́kọ́ nínú ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn ní kedere.
theological_decisions:
- issue: Agbára ìtumọ̀ ìbéèrè àwọn ọmọ-ẹ̀yìn nípa dídé Èlíjà
  choice: A fi ìbéèrè náà sílẹ̀ gẹ́gẹ́ bí ìbéèrè ìdí, láìsọ pé àwọn ọmọ-ẹ̀yìn ń tako tàbí ń fìdí ẹ̀kọ́ àwọn akọ̀wé múlẹ̀.
  alternative: A lè túmọ̀ ọ́ lọ́nà tó fi hàn pé wọ́n ń ṣiyèméjì sí àwọn akọ̀wé, tàbí kí a fi àsọyé Málákì kún ẹsẹ yìí.
  rationale: Ọ̀rọ̀ Gíríìkì kò tíì yanju bí ẹ̀kọ́ àwọn akọ̀wé ṣe péye; èsì tó tẹ̀ lé e ní Mátíù 17:11–13 ló ń ṣàlàyé ọ̀ràn náà. Nítorí náà, a pa ìfọ̀kànbalẹ̀ ẹ̀kọ́-ìgbàgbọ́ inú ìbéèrè náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé gbogbogbò. A yan ‘Àwọn ọmọ-ẹ̀yìn náà’ dípò fífi ‘rẹ̀’ kún un, nítorí αὐτοῦ kò sí nínú orísun.
