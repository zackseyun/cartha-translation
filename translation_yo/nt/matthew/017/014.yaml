  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: yo
  text: Nígbà tí wọ́n sì dé ọ̀dọ̀ ọ̀pọ̀ ènìyàn náà, ọkùnrin kan wá sọ́dọ̀ rẹ̀[a], ó sì kúnlẹ̀ níwájú rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sún mọ́ ọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó tẹ eékún níwájú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Ọ̀rọ̀ àsopọ̀ yìí so ìṣẹ̀lẹ̀ náà mọ́ ohun tó ṣáájú rẹ̀ láìfi ìtumọ̀ tuntun kún un.
- source_word: ἐλθόντων
  choice: Nígbà tí wọ́n ... dé
  rationale: Aorist participle inú genitive absolute ni; ọ̀nà yìí fi ìbáṣepọ̀ àkókò hàn ní Yorùbá àdánidá, ó sì pa ẹni púpọ̀ tí a kò dárúkọ mọ́.
- source_word: πρὸς τὸν ὄχλον
  choice: ọ̀dọ̀ ọ̀pọ̀ ènìyàn náà
  rationale: ὄχλος túmọ̀ sí àwùjọ tàbí ọ̀pọ̀ ènìyàn; gbólóhùn yìí ṣe kedere, ó sì bójú mu ní Yorùbá òde òní.
- source_word: προσῆλθεν αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ó fi hàn pé ọkùnrin náà sún mọ́ Jesu tàbí wá sọ́dọ̀ rẹ̀; ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá.
- source_word: ἄνθρωπος
  choice: ọkùnrin kan
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ẹnì kọ̀ọ̀kan tí ó jẹ́ ọkùnrin, kì í ṣe sí aráyé lápapọ̀.
- source_word: γονυπετῶν αὐτόν
  choice: ó sì kúnlẹ̀ níwájú rẹ̀
  rationale: Ó ṣàpèjúwe ìdúró tàbí ìṣe ọkùnrin náà nígbà tó tọ̀ Jesu wá; ‘kúnlẹ̀ níwájú rẹ̀’ jẹ́ kedere, ó sì fi ìbòwọ̀ ara hàn láìsọ ìdí rẹ̀ di pàtó.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἄνθρωπος nígbà tó ń tọ́ka sí ẹnì kan nínú ìtàn
  choice: ọkùnrin kan
  alternative: ènìyàn kan
  rationale: Fọ́ọ̀mù Gíríìkì àti àyíká ìtàn tọ́ka sí akọ kan pàtó. ‘Ọkùnrin kan’ pa ìtọ́kasí yẹn mọ́ láìfi ẹ̀kọ́ nípa akọ tàbí abo kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò; a pa ìṣàn ìtàn àti ìṣe kíkúnlẹ̀ inú participle mọ́ ní ọ̀nà àdánidá.
