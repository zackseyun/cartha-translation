source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: yo
  text: Jésù sì sún mọ́ wọn[a], ó kàn wọ́n, ó sì wí pé, “Ẹ dìde[b], ẹ má sì bẹ̀rù.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wá sọ́dọ̀ wọn”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “wá sọ́dọ̀” tàbí “sún mọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Ẹ gbéra”; àṣẹ náà ń tọ́ka sí dídìde kúrò ní ipò tí wọ́n wà nílẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ẹ má ṣe bẹ̀rù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  choice: sún mọ́ wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwá sọ́dọ̀ tàbí sísún mọ́ ẹnì kan. “Sún mọ́ wọn” jẹ́ èdè Yorùbá àdánidá tí ó pa ìṣípò Jésù sí ọ̀dọ̀ àwọn ọmọ-ẹ̀yìn mọ́.
- source_word: ἁψάμενος αὐτῶν
  choice: ó fọwọ́ kàn wọ́n
  rationale: Apólà náà túmọ̀ sí fífi ara kan wọ́n. Ní Yorùbá, “fọwọ́ kàn wọ́n” ni ọ̀nà àdánidá láti sọ pé ó touched them; kò fi ìtumọ̀ àfikún bíi pé ó gbé ọwọ́ lé wọn.
- source_word: εἶπεν
  choice: ó sì wí pé
  rationale: “Wí pé” jẹ́ ìtumọ̀ tààrà fún ọ̀rọ̀ ìsọ̀rọ̀ yìí, ó sì bá ìforúkọsílẹ̀ Bíbélì tó ní iyì mu.
- source_word: Ἐγέρθητε
  choice: Ẹ dìde
  rationale: Àṣẹ náà ń sọ fún àwọn ọmọ-ẹ̀yìn tí wọ́n wólẹ̀ pé kí wọ́n dìde. “Ẹ dìde” ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá láì fi ipò ìkẹyìn ara wọn kún ohun tí Gíríìkì sọ.
- source_word: μὴ φοβεῖσθε
  choice: ẹ má sì bẹ̀rù
  rationale: Èyí pa àṣẹ ìtùnú náà mọ́ ní ọ̀nà tó ṣe kedere. Kò fi dandan túmọ̀ fọ́ọ̀mù ìsinsìnyí sí “ẹ dá ìbẹ̀rù dúró,” nítorí ìtumọ̀ yẹn kò lágbára tó nínú àyíká ọ̀rọ̀.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so àwọn ìṣe inú ìtàn náà pọ̀ lọ́nà tó rọrùn, láì fi ìtumọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àṣẹ ìtùnú Jésù láì fi ìtumọ̀ olùṣọ́-àgùntàn tàbí ẹ̀kọ́ ìsìn kún un
  choice: “Ẹ dìde, ẹ má sì bẹ̀rù.”
  alternative: “Ẹ dìde dúró, ẹ sì dá ìbẹ̀rù dúró.”
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìṣe Jésù—sísún mọ́ wọn, fífi ọwọ́ kàn wọ́n, àti fífún wọn ní àṣẹ ìtùnú—mọ́ gẹ́gẹ́ bí orísun ṣe sọ ọ́, láì sọ ipò ara wọn tàbí bí ìbẹ̀rù náà ṣe ń lọ lọ́wọ́ ju ohun tí Gíríìkì fi hàn lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní àmì ohùn níbi tí ó yẹ, tó sì ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Fọwọ́ kàn” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ara kan ẹnì kan, kì í ṣe àfikún ẹ̀kọ́ pé Jésù ṣe àṣà gbígbé ọwọ́ lé wọn.
