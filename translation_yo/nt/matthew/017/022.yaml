id: MAT.17.22
reference: Matthew 17:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: yo
  text: Nígbà tí wọ́n ń péjọ ní Galili[a], Jésù sọ fún wọn pé, “Ó kù díẹ̀ kí a fi Ọmọ Ènìyàn lé àwọn ènìyàn lọ́wọ́[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí wọ́n ti ń kóra jọ ní Galili.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a máa fi Ọmọ Ènìyàn lé àwọn ènìyàn lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: wọ́n ń péjọ
  rationale: Ó mú ìtumọ̀ ẹgbẹ́ tí ń kóra jọ tàbí tí ó wà papọ̀ jáde, láì fi ìrìn tàbí ìdúró kan pàtó kún ọ̀rọ̀ Gíríìkì.
- source_word: δὲ
  choice: Nígbà tí
  rationale: Pẹ̀lú àpólà genitive absolute, ó so ipò tí wọ́n wà ní Galili mọ́ ohun tí Jésù sọ ní Yorùbá àdánidá.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ní Galili
  rationale: Ìtumọ̀ ibi tí ó ṣe tààrà, tí kò sì túmọ̀ rẹ̀ sí gbogbo agbègbè Galili.
- source_word: εἶπεν αὐτοῖς
  choice: Jésù sọ fún wọn pé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ λέγω pẹ̀lú ẹni tí a bá sọ̀rọ̀ fún.
- source_word: Μέλλει
  choice: Ó kù díẹ̀ kí
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà sún mọ́lé, láì sọ ọ́ di àyànmọ́ tí kò ṣeé yí padà.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Ó pa àkọlé Jésù àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ẹsẹ Ìwé Mímọ́ mìíràn mọ́.
- source_word: παραδίδοσθαι
  choice: a fi … lé … lọ́wọ́
  rationale: Ìkọ́lé aláṣeyọrí àìsọ ní Yorùbá pa ohùn àìṣe Gíríìkì àti àìdánimọ̀ ẹni tó ṣe é mọ́; kò sì dín ìtumọ̀ rẹ̀ kù sí ìwà ọ̀dàlẹ̀ nìkan.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: lé àwọn ènìyàn lọ́wọ́
  rationale: Ó lo àpèjúwe ọwọ́ tí ó bá èdè Yorùbá mu, ó sì túmọ̀ sí fífi ẹni sí abẹ́ agbára àwọn ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: “Ọmọ Ènìyàn” pa ìtumọ̀ gangan, àṣà ìtumọ̀ Bíbélì Yorùbá, àti ìró ẹ̀kọ́-ìgbàgbọ́ inú àkọlé náà mọ́; “Ẹni Ènìyàn” jẹ́ àlàyé ju ìtumọ̀ lọ.
- issue: Ìtumọ̀ παραδίδοσθαι nínú àsọtẹ́lẹ̀ ìjìyà
  choice: a fi … lé … lọ́wọ́
  alternative: a ta …
  rationale: Yíyan yìí pa ìtumọ̀ fífi Jésù lé agbára ẹlòmíràn lọ́wọ́ mọ́, láì dá ọ̀rọ̀ náà lórí ọ̀dàlẹ̀ Júdásì nìkan tàbí lórí ìgbésẹ̀ òfin nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìkọ́lé “Ó kù díẹ̀ kí” mú ìsúnmọ́lé μέλλει jáde lọ́nà àdánidá, “a fi … lé … lọ́wọ́” sì pa àìdánimọ̀ olùṣe àti àpèjúwe ọwọ́ mọ́.
