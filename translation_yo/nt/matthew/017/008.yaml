id: MAT.17.8
reference: Matthew 17:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: yo
  text: Nígbà tí wọ́n sì gbé ojú wọn sókè, wọ́n kò rí ẹnikẹ́ni bí kò ṣe Jésù fúnra rẹ̀ nìkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, ọ̀rọ̀ náà ní “bí kò ṣe òun, Jésù nìkan”; ìṣọ̀kan arọ́pò-orúkọ náà pẹ̀lú “nìkan” ń fi ìyàsọ́tọ̀ náà hàn gidigidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: nígbà tí wọ́n … gbé … sókè
  rationale: Aorist participle yìí ṣáájú ìṣe pàtàkì; gbólóhùn ‘nígbà tí wọ́n …’ fi ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà hàn ní Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ aláìlágbára ni δέ níbí; ‘sì’ ń tẹ ìtàn náà síwájú láìfi ìtakora líle kún un.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: ojú wọn
  rationale: Èyí pa àwòrán ara tí Gíríìkì lò mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀.
- source_word: οὐδένα
  choice: ẹnikẹ́ni
  rationale: Lẹ́yìn ọ̀rọ̀ ìkọ̀ ‘kò rí,’ ‘ẹnikẹ́ni’ ni ọ̀nà Yorùbá àdánidá láti sọ pé kò sí ẹni tí wọ́n rí.
- source_word: εἶδον
  choice: wọn kò rí
  rationale: Ìtumọ̀ tààrà ti ὁράω ni ‘rí’; ìkọ̀ wá láti οὐδένα nínú ìṣètò gbólóhùn Gíríìkì.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Lẹ́yìn ìkọ̀, gbólóhùn yìí túmọ̀ sí ‘àyàfi’ tàbí ‘bí kò ṣe’; èyí kejì bá ìṣàn gbólóhùn mu dáadáa.
- source_word: αὐτὸν
  choice: fúnra rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a tẹnumọ́ yìí ń mú kí Jésù jẹ́ ẹni pàtó tí wọ́n rí; ‘fúnra rẹ̀’ pa ìtẹnumọ́ náà mọ́.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: Orúkọ ẹni náà ni a kọ ní ìrísí Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: μόνον
  choice: nìkan
  rationale: ‘Nìkan’ pa ìtumọ̀ pé Jésù nikan ṣoṣo ni ó kù ní ojú wọn mọ́, ó sì tẹnumọ́ ìyàsọ́tọ̀ náà.
theological_decisions:
- issue: Ìtẹnumọ́ pé Jésù nikan ni wọ́n rí lẹ́yìn ìran náà
  choice: bí kò ṣe Jésù fúnra rẹ̀ nìkan
  alternative: bí kò ṣe Jésù nìkan
  rationale: Gíríìkì kó εἰ μὴ, αὐτόν àti μόνον jọ láti fi ìyàsọ́tọ̀ hàn gidigidi. Ìtumọ̀ yìí pa ìtẹnumọ́ méjèèjì mọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ míì kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye. Àtúnṣe ‘fúnra rẹ̀ nìkan’ jẹ́ ìtẹnumọ́ tí a mọ̀ọ́mọ̀ pa mọ́ láti inú Gíríìkì.
