id: MAT.17.6
reference: Matthew 17:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: yo
  text: Nígbà tí àwọn ọmọ-ẹ̀yìn náà gbọ́ ohùn náà,[a] wọ́n dojúbolẹ̀,[b] ẹ̀rù sì bà wọ́n gidigidi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lẹ́yìn tí wọ́n gbọ́”; Gíríìkì lo ọ̀rọ̀ ìṣe alábápín aorist, èyí tí a lè túmọ̀ sí “nígbà tí wọ́n gbọ́” tàbí “lẹ́yìn tí wọ́n gbọ́.” Ohùn láti ọ̀run tó wà ní ẹsẹ tó ṣáájú ni “ohùn náà” ń tọ́ka sí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “wọ́n ṣubú lé ojú wọn”; “wọ́n dojúbolẹ̀” ni ọ̀nà Yorùbá àdánidá láti sọ ìdúbalẹ̀ yìí.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, ẹ̀rù bà wọ́n gan-an; “gidigidi” túmọ̀ adverb Gíríìkì σφόδρα.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nígbà tí ... gbọ́ ohùn náà
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist náà lè túmọ̀ sí ‘nígbà tí wọ́n gbọ́’ tàbí ‘lẹ́yìn tí wọ́n gbọ́.’ ‘Ohùn náà’ mú ohun tí wọ́n gbọ́ láti ẹsẹ tó ṣáájú wá sí gbangba láì fi ìtumọ̀ míì kún un.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá àyíká Ìhìn Rere mu fún àwọn tí ń tẹ̀lé Jesu tí wọ́n sì ń kọ́ ẹ̀kọ́ lọ́dọ̀ rẹ̀.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: wọ́n dojúbolẹ̀
  rationale: Ọ̀rọ̀ Yorùbá àdánidá yìí fi hàn pé wọ́n ṣubú tàbí tẹ ara wọn sílẹ̀, tí ojú wọn sì kọ sí ilẹ̀; kò pinnu bóyá ìbẹ̀rù tàbí ìjọsìn ló ṣe pàtàkì jù.
- source_word: ἐφοβήθησαν
  choice: ẹ̀rù bà wọ́n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n bẹ̀rù, láì fi irú ẹ̀rù náà hàn ju ohun tí Gíríìkì sọ lọ.
- source_word: σφόδρα
  choice: gidigidi
  rationale: Ó sọ bí ẹ̀rù náà ṣe lágbára tó, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún òǹkàwé òde òní.
theological_decisions:
- issue: Irú ìdáhùn àwọn ọmọ-ẹ̀yìn sí ohùn àtọ̀runwá
  choice: A fi ìdúbalẹ̀ wọn àti ẹ̀rù líle wọn hàn láì sọ pé ìjọsìn, ìpayà, tàbí ọ̀wọ̀ ọlọ́wọ̀ ni ìtumọ̀ pàtàkì rẹ̀.
  alternative: A lè ṣàlàyé ìhùwàsí náà ní pàtàkì gẹ́gẹ́ bí ìjọsìn ọlọ́wọ̀, tàbí gẹ́gẹ́ bí ìpayà níwájú ìfarahàn Ọlọ́run.
  rationale: Gíríìkì sọ ìdúbalẹ̀ àti ẹ̀rù wọn, ṣùgbọ́n kò sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó fún un; ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “dojúbolẹ̀” dípò gbólóhùn líle tààràtà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìrísí Gíríìkì mọ́.
