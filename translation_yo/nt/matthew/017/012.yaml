source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé, Èlíjà ti wá tẹ́lẹ̀[a], wọn kò sì dá a mọ̀; ṣùgbọ́n wọ́n ṣe ohunkóhun tí wọ́n fẹ́ sí i[b]. Bákan náà ni Ọmọ Ènìyàn yóò jìyà lọ́wọ́ wọn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò mọ ẹni tí ó jẹ́” tàbí “wọn kò jẹ́wọ́ ọ́.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí pé wọn kùnà láti dá a mọ̀ dáadáa gẹ́gẹ́ bí ẹni tí ó jẹ́ tàbí láti mọ ipa rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n hùwà sí i bí wọ́n ṣe fẹ́” tàbí “wọ́n ṣe lòdì sí i gẹ́gẹ́ bí wọ́n ṣe fẹ́.” Ọ̀rọ̀ náà jẹ́ àpèjúwe tí ó fi hàn pé wọ́n ṣe ohun tí wọ́n fẹ́ sí i láìní ìdènà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ọmọ Ènìyàn ń bọ̀ láti jìyà lọ́wọ́ wọn.” Ọ̀rọ̀ Gíríìkì fi ìjìyà ọjọ́ iwájú hàn gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tí ó ń bọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ṣùgbọ́n mo sọ fún yín pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ìfihàn tààrà tí ó sì yàtọ̀ sí ohun tí a retí ṣáájú; “ṣùgbọ́n” mú agbára δέ jáde ní èdè Yorùbá àdánidá.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Èlíjà ti dé ná
  rationale: “Ti dé ná” fi hàn pé dídé náà ti ṣẹlẹ̀, ó sì ṣe pàtàkì sí ipò ọ̀rọ̀ lọ́wọ́lọ́wọ́.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: wọn kò sì dá a mọ̀
  rationale: “Dá a mọ̀” sọ ìkùnà láti mọ ẹni tí ó jẹ́ tàbí ipa rẹ̀, kì í ṣe pé wọn kò mọ̀ ọ́n rí rárá.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: wọ́n ṣe sí i ohunkóhun tí wọ́n fẹ́
  rationale: Èyí tú ọ̀rọ̀ àṣà Gíríìkì náà sí Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣe aláìní-ààlà àti ìwà ọ̀tá mọ́.
- source_word: οὕτως καὶ
  choice: Bákan náà ni ... sì
  rationale: Ìṣètò yìí so ohun tí ó ṣẹlẹ̀ sí Èlíjà pọ̀ mọ́ ohun tí yóò ṣẹlẹ̀ sí Ọmọ Ènìyàn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: Èyí ni ìtumọ̀ àkọ́lé náà tí ó pa àwòrán àti ìdúnú rẹ̀ mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: μέλλει πάσχειν ὑπ’ αὐτῶν
  choice: yóò jìyà lọ́wọ́ wọn
  rationale: “Yóò jìyà” fi ìṣẹ̀lẹ̀ tó ń bọ̀ hàn; “lọ́wọ́ wọn” mú ipa wọn gẹ́gẹ́ bí olùṣe ìpalára náà ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ Èlíjà tí ó ti dé
  choice: A pa orúkọ Èlíjà mọ́ láìfi orúkọ Jòhánù Onítẹ̀bọmi sínú ẹsẹ yìí.
  alternative: A lè ṣàlàyé Èlíjà ní tààrà gẹ́gẹ́ bí Jòhánù Onítẹ̀bọmi.
  rationale: Àyíká ọ̀rọ̀ lẹ́yìn ẹsẹ yìí ló mú ìdánimọ̀ náà ṣe kedere; fífi í sínú ẹsẹ yìí yóò kọjá ohun tí Gíríìkì sọ.
- issue: Agbára μέλλει nípa ìjìyà Ọmọ Ènìyàn
  choice: “yóò jìyà,” pẹ̀lú àlàyé ìsúnmọ́ ìṣẹ̀lẹ̀ nínú àlàyé ìsàlẹ̀.
  alternative: “ó fẹ́rẹ̀ẹ́ jìyà” tàbí “a ti yàn án láti jìyà.”
  rationale: Ọ̀rọ̀ Gíríìkì tọ́ka sí ìjìyà tó ń bọ̀ tàbí tó sún mọ́lé, ṣùgbọ́n kò sọ ní kedere nínú gbólóhùn yìí pé àyànmọ́ ni; Yorùbá àkọ́kọ́ jẹ́ àdánidá, àlàyé sì pa àfikún ìsúnmọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé lasán. A lo “ná” fún ìtẹnumọ́ ἤδη, “dá a mọ̀” fún ìdánimọ̀, àti “lọ́wọ́ wọn” fún aṣojú ìpalára.
