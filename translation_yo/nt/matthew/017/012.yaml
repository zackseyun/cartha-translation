  - severity: low
    issue: “dípò bẹ́ẹ̀” fún ἀλλά
    rationale: 'Ó lè ṣiṣẹ́ ní àyíká kan, ṣùgbọ́n ἀλλά jẹ́ ìyàtọ̀ tààrà: wọn kò dá a mọ̀, ṣùgbọ́n wọ́n hùwà sí i bí wọ́n ṣe fẹ́. “Ṣùgbọ́n” sún mọ́ ìbáṣepọ̀ Gíríìkì.'
