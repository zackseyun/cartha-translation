  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa ní ọ̀pọ̀lọpọ̀: ó pa Èlíjà mọ́, ó tú ἐπέγνωσαν sí ìdánimọ̀, ó sì fi àwọn ènìyàn náà hàn gẹ́gẹ́ bí àwọn olùṣe ìjìyà náà. Síbẹ̀, “ti dé ná” kì í ṣe ọ̀nà tó dára jù lọ láti sọ ἤδη ní Yorùbá boṣewa; “ti wá tẹ́lẹ̀” sọ ‘has already come’ kedere. Àtúnṣe náà tún mú ìyàtọ̀ ἀλλά (‘ṣùgbọ́n’) hàn ní tààrà ju “dípò bẹ́ẹ̀” lọ.'
  naturalness: “Èlíjà ti wá tẹ́lẹ̀” àti “wọ́n ṣe ohunkóhun tí wọ́n fẹ́ sí i” jẹ́ Yorùbá òde òní tí ó rọrùn, tí ó sì bá ìforúkọsílẹ̀ ẹsẹ náà mu. “Bákan náà ni” pa ìfiwéra οὕτως καὶ mọ́. “Yóò jìyà” jẹ́ ìtumọ̀ àdánidá fún ọjọ́ iwájú; àlàyé ìsàlẹ̀ ń tọ́ka sí agbára ìṣẹ̀lẹ̀ tó ń bọ̀ ti μέλλει láìsọ pé ó ti fẹ́rẹ̀ẹ́ ṣẹlẹ̀ ní ìtumọ̀ ‘almost’.
  terminology: A dá “Èlíjà” àti “Ọmọ Ènìyàn” sílẹ̀. A kò fi ìdánimọ̀ Jòhánù Onítẹ̀bọmi tàbí èrò ẹ̀kọ́ ìsìn míì kún ẹsẹ náà. Àwọn àmì ìsàlẹ̀ ni a ṣàtúnṣe kí wọ́n má bàa sọ ìtumọ̀ tí kò péye, bí “wọn kò gbà á mọ́,” tí ó lè túmọ̀ sí pé wọ́n dáwọ́ mímọ̀ ọ́ dúró.
  issues:
