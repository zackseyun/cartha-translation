source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: yo
  text: Ṣùgbọ́n[a] irú yìí kì í jáde bí kò ṣe nípasẹ̀ àdúrà àti ààwẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì àtijọ́ jù lọ (tó fi mọ́ Sinaiticus àti Vaticanus ti ọ̀rúndún kẹrin), bẹ́ẹ̀ ni kò sí nínú àwọn ìtumọ̀ Síríákì àti Kọ́pítì ìjímìjí. Ṣùgbọ́n ó wà nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ ti àṣà Bísáńtáìnì, nínú àṣà Látìn, àti nínú ọ̀pọ̀ jù lọ àwọn ẹ̀rí Síríákì. Ó ṣeé ṣe kí àwọn akọ̀wé ìgbà tó tẹ̀ lé e fi kún un kí ó lè bá Máàkù 9:29 mu.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: irú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ẹ̀ka tàbí irú ẹ̀mí èṣù kan; “irú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ náà mu.
- source_word: ἐκπορεύεται
  choice: jáde
  rationale: Ó ń sọ nípa ẹ̀mí èṣù tí ń jáde kúrò lára ẹni tí ó ń pọ́n lójú; “jáde” sọ ìṣípò yìí ní ọ̀nà àdánidá ní Yorùbá.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń fi ọ̀nà kan ṣoṣo hàn; “bí kò ṣe” jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé.
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: nípasẹ̀ àdúrà àti ààwẹ̀
  rationale: Nínú àyíká yìí, ἐν ń tọ́ka sí ohun èlò tàbí ọ̀nà tí ìjáde náà fi ń ṣẹlẹ̀; “nípasẹ̀” mú ìtumọ̀ yẹn jáde lọ́nà tó mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó rọrùn fún òǹkàwé gbogbo, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Kì í jáde” ń sọ ìṣe gbogbogbò tàbí ohun tí ó máa ń ṣẹlẹ̀, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà ṣe rí.
