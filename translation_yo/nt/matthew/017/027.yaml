  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé ìlànà àti ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbò: lílọ sí òkun, fífi ìwọ̀ sínú omi, ẹja àkọ́kọ́, statẹri, àti fífi owó náà fún àwọn agbowó. Ṣùgbọ́n ‘dípò èmi àti ìwọ’ kò ṣàfihàn ἀντὶ ἐμοῦ καὶ σοῦ ní ọ̀nà Yorùbá tó pé; ó lè túmọ̀ sí ìrọ́pò ẹni dípò sísan fún ẹni méjèèjì. ‘Fún mi àti fún ara rẹ’ mú ìtumọ̀ ìsanwó-fún-ẹni méjèèjì hàn kedere.'
  naturalness: ‘Kí a má bàa mú wọn ṣẹ̀’ jẹ́ ọ̀nà Yorùbá ìgbàlódé tó rọrùn àti tó bá ipò ‘give offense’ mu ju ‘mú wọn kọsẹ̀’ lọ. ‘Ju ìwọ̀ sínú òkun’ sì jẹ́ ìsọ̀rọ̀ àdánidá ju ‘sọ ìwọ̀ sínú omi’ lọ, ó tún pa ‘sea’ mọ́. ‘Ṣí ẹnu rẹ̀’ ni ọ̀rọ̀ tó yẹ fún ṣíṣí ẹnu ẹja.
  terminology: A pa ‘òkun,’ ‘ìwọ̀,’ àti ‘owó statẹri’ mọ́. Àlàyé statẹri jẹ́ ìwúlò, ó sì ní iye owó náà àti ìdí tí ó fi tó fún ènìyàn méjì. Àmì a tẹ̀ lé σκανδαλίσωμεν; àmì b tẹ̀ lé στατῆρα, nítorí náà àwọn àmì ìsàlẹ̀ ojú ìwé tọ́.
