id: MAT.17.27
reference: Matthew 17:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: yo
  text: Ṣùgbọ́n, kí a má bàa mú wọn ṣẹ̀[a], lọ sí òkun, ju ìwọ̀ sínú un, kí o sì mú ẹja àkọ́kọ́ tí yóò gòkè wá. Nígbà tí o bá ṣí ẹnu rẹ̀, ìwọ yóò rí owó statẹri kan[b]. Mú un, kí o sì fi fún wọn fún mi àti fún ara rẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a má bàa mú wọn bínú” tàbí “kí a má bàa jẹ́ ohun ìkọ̀sẹ̀ fún wọn.”
    reason: lexical_alternative
  - marker: b
    text: Statẹri jẹ́ owó kan tí iye rẹ̀ fẹ́rẹ̀ẹ́ tó dírámà mẹ́rin, ó sì tó láti san owó tẹ́ńpìlì fún ènìyàn méjì.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: mú wọn kọsẹ̀
  rationale: Ọ̀rọ̀ yìí pa àwòrán ‘mímú ẹni kọsẹ̀’ mọ́, ó sì lè túmọ̀ sí ṣíṣe ohun tí yóò mú wọn bínú tàbí kọsẹ̀ nínú ọ̀ràn yìí. Àlàyé ìsàlẹ̀ ojú ìwé ń jẹ́ kí ìtumọ̀ tó bá àyíká mu ṣe kedere láìpa àìdánilójú ọ̀rọ̀ Gíríìkì rẹ́.
- source_word: θάλασσαν
  choice: òkun
  rationale: ‘Òkun’ tẹ̀ lé ọ̀rọ̀ Gíríìkì, bí ó tilẹ̀ jẹ́ pé ibi tí a ń tọ́ka sí ni Òkun Gálílì, tí ó jẹ́ adágún ńlá nípa ìmọ̀ ilẹ̀.
- source_word: ἄγκιστρον
  choice: ìwọ̀
  rationale: ‘Ìwọ̀’ ni ọ̀rọ̀ Yorùbá fún ìkọ́ tí a fi ń pẹja, ó sì ṣe kedere nínú àyíká yìí.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: ẹja àkọ́kọ́ tí yóò gòkè wá
  rationale: Ó fi ìṣe ẹja àkọ́kọ́ tí a fà sókè láti inú omi hàn ní èdè Yorùbá tó ṣe déédé.
- source_word: ἆρον
  choice: mú
  rationale: Nínú ọ̀wọ́ àwọn àṣẹ yìí, ‘mú’ sọ pé kí Pétérù gba ẹja tí ó kọ́kọ́ dé sí ìwọ̀ náà.
- source_word: στατῆρα
  choice: owó statẹri kan
  rationale: A pa orúkọ owó pàtó inú Gíríìkì mọ́ ní ìkọ̀wé Yorùbá, a sì ṣàlàyé iye rẹ̀ ní àlàyé ìsàlẹ̀ ojú ìwé.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: dípò èmi àti ìwọ
  rationale: ‘Dípò’ fi hàn pé owó náà ni a ó fi san ohun tí ó jẹ mọ́ Jésù àti Pétérù; kò fi ẹ̀kọ́ mìíràn kún gbólóhùn náà.
- source_word: πορευθεὶς
  choice: lọ
  rationale: Ọ̀rọ̀ àṣẹ ‘lọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tó ṣáájú àwọn àṣẹ tó tẹ̀ lé e.
- source_word: δὸς αὐτοῖς
  choice: fi fún wọn
  rationale: Ó tọ́ka sí fífi owó tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn fún àwọn agbowó náà, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ.
theological_decisions:
- issue: Ìtumọ̀ σκανδαλίζω nípa sísan owó tẹ́ńpìlì
  choice: Jésù pàṣẹ pé kí wọ́n san owó náà kí wọ́n má bàa mú àwọn agbowó náà kọsẹ̀ tàbí mú wọn bínú lásán.
  alternative: Pé Jésù ń jẹ́wọ́ pé dandan ni fún un láti san owó náà, tàbí pé kìkì láti fi iṣẹ́ ìyanu hàn ni ó fi san án.
  rationale: Àyíká ẹsẹ 24–26 ti sọ pé àwọn ọmọ bọ́ lọ́wọ́ owó náà, nígbà tí ẹsẹ yìí sọ ìdí ìṣe náà pé kí wọ́n má bàa mú àwọn yòókù kọsẹ̀. Ìtumọ̀ náà pa ìforígbárí yìí mọ́ láìyanjú rẹ̀ sí ẹ̀kọ́ ìsìn kan pàtó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó lọ́lá, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tó bá ti yẹ; a sì kọ ‘statẹri’ ní ìbámu pẹ̀lú ìró Yorùbá, pẹ̀lú àlàyé iye rẹ̀ ní ìsàlẹ̀ ojú ìwé.
