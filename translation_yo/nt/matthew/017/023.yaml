id: MAT.17.23
reference: Matthew 17:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: yo
  text: Wọ́n yóò sì pa á; ní ọjọ́ kẹta, a ó sì jí i dìde[a]. Inú wọn sì bàjẹ́ gidigidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “yóò jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ohùn passive: “a ó jí i dìde.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: wọn yóò pa á
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ‘wọn yóò pa á’; ó jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tí kò sì fi ìtumọ̀ ‘ìpànìyàn àìṣòdodo’ kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: ní ọjọ́ kẹta
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún dative of time, ó sì pa ìṣètò àkókò inú Gíríìkì mọ́ láìfikún ọ̀rọ̀ míì.
- source_word: ἐγερθήσεται
  choice: a ó jí i dìde
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ future passive. Ìtumọ̀ yìí pa ìṣe tí a ṣe sí Jesu mọ́, ó sì jẹ́ Yorùbá tó mọ́gbọ́n dání ju àkójọpọ̀ passive aláìdánidá lọ.
- source_word: ἐλυπήθησαν σφόδρα
  choice: Inú wọn bàjẹ́ gidigidi
  rationale: ‘Inú wọn bàjẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbànújẹ́, ‘gidigidi’ sì mú agbára σφόδρα jáde.
- source_word: καὶ ... καὶ ... καὶ
  choice: sì ... sì ... sì
  rationale: Lílo ‘sì’ ń pa ìṣàn paratactic ti Gíríìkì mọ́ ní ọ̀nà tí ó bá Yorùbá mu.
theological_decisions:
- issue: Bóyá kí àsọtẹ́lẹ̀ àjíǹde jẹ́ passive tàbí active ní Yorùbá
  choice: a ó jí i dìde
  alternative: yóò jí dìde
  rationale: Future passive inú Gíríìkì ni a pa mọ́, kí ọ̀rọ̀ náà lè fi hàn pé ẹni kan ni ó jí Jesu dìde, láìdárúkọ olùṣe tí Gíríìkì kò dárúkọ. Àṣàyàn kejì jẹ́ àdánidá, ṣùgbọ́n ó yí passive padà sí active.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àtúnwí ‘sì’ àti passive àjíǹde mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
