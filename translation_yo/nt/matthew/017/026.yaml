id: MAT.17.26
reference: Matthew 17:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: yo
  text: Nígbà tí ó sì sọ pé, “Láti ọ̀dọ̀ àwọn àjèjì,” Jésù wí fún un pé, “Nígbà náà, àwọn ọmọkùnrin jẹ́ òmìnira.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ọmọkùnrin jẹ́ òmìnira”; nínú àyíká ọ̀rọ̀ yìí, ìyẹn fi hàn pé wọn kò ní láti san owó náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Nígbà tí ó sì dáhùn pé
  rationale: Ẹ̀ka gírámà yìí tọ́ka sí ohun tí ó ṣẹlẹ̀ nígbà tí Pétérù sọ ìdáhùn rẹ̀; “dáhùn” jẹ́ ohun àdánidá ní Yorùbá nítorí ọ̀rọ̀ náà jẹ́ ìdáhùn sí ìbéèrè ẹsẹ tó ṣáájú.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Láti ọ̀dọ̀ àwọn àjèjì
  rationale: “Àwọn àjèjì” fi ìyàtọ̀ hàn láàárín àwọn tí kì í ṣe ará ilé ọba àti àwọn ọmọkùnrin ọba, láìfi dandan túmọ̀ sí àjèjì orílẹ̀-èdè.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésù wí fún un pé
  rationale: Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ orísun, tó sì bá ìforúkọsílẹ̀ ìtàn mímọ́ tó ní iyì mu.
- source_word: Ἄρα γε
  choice: Ǹjẹ́ nígbà náà
  rationale: Ó mú ìparí èrò tí Jésù fà jáde láti inú ìdáhùn Pétérù hàn, ó sì pa ìrísí ọ̀rọ̀ ìjíròrò mọ́.
- source_word: ἐλεύθεροί
  choice: bọ́ lọ́wọ́ owó náà
  rationale: Ní àyíká ọ̀rọ̀ yìí, jíjẹ́ “òmìnira” túmọ̀ sí pé wọn kò ní ojúṣe láti san owó náà. Àfikún “owó náà” jẹ́ kó ṣe kedere ní Yorùbá láìsọ ohun tó ju àyíká ọ̀rọ̀ lọ.
- source_word: οἱ υἱοί
  choice: àwọn ọmọkùnrin
  rationale: Ó pa akọ akọ-ìbálòpọ̀ ọ̀rọ̀ Gíríìkì mọ́, ó sì bá àkàwé àwọn ọmọkùnrin ọba mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ οἱ υἱοί nínú àkàwé àwọn tó jẹ́ ti ilé ọba
  choice: àwọn ọmọkùnrin
  alternative: àwọn ọmọ
  rationale: Orísun náà sọ “àwọn ọmọkùnrin” ní pàtó, àkàwé náà sì dá lórí ipò àwọn ọmọkùnrin ọba nípa owó orí. Ìtumọ̀ yìí tún pa ìtumọ̀ jíjẹ́ ọmọkùnrin mọ́ láìfẹ̀ sí i.
- issue: Ìtumọ̀ ἐλεύθεροί nípa ojúṣe owó orí
  choice: bọ́ lọ́wọ́ owó náà
  alternative: jẹ́ òmìnira
  rationale: “Jẹ́ òmìnira” lè gbòòrò tàbí dà bí ọ̀rọ̀ àjèjì ní Yorùbá nínú àyíká yìí. “Bọ́ lọ́wọ́ owó náà” fi àbájáde ọ̀rọ̀ hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí “òmìnira.”
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ náà ní iyì, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A lo “wí” fún ìtàn Bíbélì tó níyì, ṣùgbọ́n a yẹra fún ọ̀rọ̀ àtijọ́ tó le.
