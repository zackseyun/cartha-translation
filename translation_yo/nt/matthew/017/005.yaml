  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbò: ó pa ìṣe tí ń lọ lọwọ̀, ìkùukùu dídán, ìgbésẹ̀ ìkùukùu náà sí àwọn ènìyàn tó wà níbẹ̀, ohùn láti inú ìkùukùu, ìkéde nípa Ọmọ, àti àṣẹ láti fetí sí i mọ́. Síbẹ̀, ‘kíyèsí i’ kò ṣiṣẹ́ dáadáa gẹ́gẹ́ bí àmì ìdarí àfiyèsí ἰδού nínú àyíká yìí; ‘Wò ó’ dá ìfarahàn ìyàlẹ́nu náà hàn dáadáa ju.'
  naturalness: ‘Wò ó’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ìtàn ìwé mímọ́ mu fún ἰδού. ‘Bò wọ́n’ jẹ́ ìsọ̀rọ̀ tó mọ́ ju ‘bò wọ́n mọ́lẹ̀’ lọ níbí; kò yí ìtumọ̀ ìbòrí/ìboji ἐπεσκίασεν padà.
  terminology: ‘Ọmọ mi olùfẹ́’ àti ‘ẹ tẹ́tí sí i’ jẹ́ àwọn ọ̀rọ̀ tó péye, tó ní iyì, tí wọ́n sì pa ìtumọ̀ ẹsẹ̀ mọ́. A tún ṣe àtúnṣe àlàyé ẹsẹ̀ ìsàlẹ̀ kí ‘heeding’ má bàa di ‘fífi ọ̀rọ̀ náà sílò,’ èyí tí kò dá ìtumọ̀ náà hàn kedere.
