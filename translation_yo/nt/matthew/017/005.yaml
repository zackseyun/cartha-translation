id: MAT.17.5
reference: Matthew 17:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: yo
  text: Nígbà tí ó ṣì ń sọ̀rọ̀, wò ó, ìkùukùu dídán kan bò wọ́n,[c] wò ó, ohùn kan sì ti inú ìkùukùu náà wá, ó ní, “Èyí ni Ọmọ mi olùfẹ́, ẹni tí inú mi dùn sí; ẹ tẹ́tí sí i.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ gbọ́ ọ̀rọ̀ rẹ̀.” Àṣẹ Gíríìkì náà lè túmọ̀ sí gbígbọ́ pẹ̀lú fífiyèsí sí ọ̀rọ̀ rẹ̀ àti mímú un ṣẹ.
    reason: lexical_alternative
  - marker: b
    text: “Wò ó” farahàn lẹ́ẹ̀mejì nínú Gíríìkì; ó ń pe àfiyèsí sí ìṣẹ̀lẹ̀ náà, ó sì ń mú agbára ìtàn náà pọ̀ sí i.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ tí a túmọ̀ sí “bò wọ́n” lè rán ènìyàn létí èdè àwọn ìfarahàn Ọlọ́run nínú Ìwé Mímọ́, níbi tí ìwàníhìn-ín Ọlọ́run ti hàn.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Nígbà tí ó ṣì ń sọ̀rọ̀
  rationale: Ó fi hàn pé ọ̀rọ̀ tí ó ń sọ kò tíì parí nígbà tí ìṣẹ̀lẹ̀ tuntun dá a dúró; gbólóhùn náà sì jẹ́ Yorùbá àdánidá.
- source_word: ἰδοὺ
  choice: kíyèsí i
  rationale: A pa àmì ìdarí àfiyèsí yìí mọ́ ní ibi méjèèjì láti mú ìyàlẹ́nu àti ìgbésẹ̀ ìtàn Gíríìkì jáde.
- source_word: νεφέλη φωτεινὴ
  choice: ìkùukùu dídán kan
  rationale: Ó túmọ̀ àwòrán ìkùukùu tí ó mọ́lẹ̀ tàbí tí ó ń dán láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐπεσκίασεν
  choice: bò wọ́n mọ́lẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìkùukùu náà bo àwọn tí ó wà níbẹ̀, ó sì tún fi àwòrán orísun náà sílẹ̀ láìṣàlàyé rẹ̀ jù.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: ohùn kan sì ti inú ìkùukùu náà wá, ó ní
  rationale: A lo gbólóhùn aláìlákọ̀ọ́kọ́ tí ó bá Yorùbá mu, nígbà tí a pa orísun ohùn náà mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Ọmọ mi olùfẹ́
  rationale: Ó pa ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí Ọmọ àti ìfẹ́ tí Baba ní sí i mọ́, láìfi ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: ἐν ᾧ εὐδόκησα
  choice: ẹni tí inú mi dùn sí
  rationale: Ọ̀nà Yorùbá tó ṣe kedere ni fún ìtẹ́wọ́gbà àti inú dídùn Ọlọ́run sí ẹni náà; kò fi tipátipá yanju ìrísí àsìkò ọ̀rọ̀ Gíríìkì ní ọ̀nà àjèjì sí Yorùbá.
- source_word: ἀκούετε αὐτοῦ
  choice: ẹ tẹ́tí sí i
  rationale: Àṣẹ náà ju gbígbọ́ ìró lásán lọ; ó ń pè wọ́n láti fetí sí ọ̀rọ̀ rẹ̀ kí wọ́n sì ka a sí, láìfẹ̀ẹ́ túmọ̀ rẹ̀ gbòòrò sí ‘ẹ ṣègbọ́ràn sí i.’
theological_decisions:
- issue: Ọ̀rọ̀ Baba nípa ìdánimọ̀ Jésù
  choice: Èyí ni Ọmọ mi olùfẹ́, ẹni tí inú mi dùn sí
  alternative: Èyí ni Ọmọ mi, Àyànfẹ́ náà, ẹni tí inú mi ti dùn sí
  rationale: A pa ìjẹ́ Ọmọ, ìfẹ́, àti ìtẹ́wọ́gbà tí ọ̀rọ̀ Gíríìkì sọ mọ́, ṣùgbọ́n a yẹra fún ‘Àyànfẹ́,’ èyí tí ó lè tẹ ìtumọ̀ náà sí yíyan ju ìfẹ́ lọ.
- issue: Agbára àṣẹ ἀκούετε αὐτοῦ
  choice: ẹ tẹ́tí sí i
  alternative: ẹ gbọ́ ọ̀rọ̀ rẹ̀
  rationale: ‘Ẹ tẹ́tí sí i’ ní agbára ìfiyèsí àti títẹ̀lé ọ̀rọ̀ ẹni, ṣùgbọ́n kò fi ‘ẹ ṣègbọ́ràn’ sí i gẹ́gẹ́ bí àlàyé tí ó lágbára ju ọ̀rọ̀ orísun lọ.
translation_notes:
  register: Yorùbá ìṣàkóso tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó bá yẹ, a sì pa ìtúnwí “kíyèsí i” mọ́ láti tẹ̀lé ìgbésẹ̀ ìtàn orísun.
