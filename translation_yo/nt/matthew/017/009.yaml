id: MAT.17.9
reference: Matthew 17:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: yo
  text: Bí wọ́n sì ṣe ń sọ̀kalẹ̀ láti orí òkè náà, Jésù pàṣẹ fún wọn pé, “Ẹ má ṣe sọ ìran náà[a] fún ẹnikẹ́ni títí di ìgbà tí a ó fi jí Ọmọ Ènìyàn dìde kúrò láàárín àwọn òkú[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ẹ rí.” Ọ̀rọ̀ Giriki náà ní “ìran náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kúrò nínú àwọn òkú.” Ní ọ̀rọ̀ gangan, “kúrò láàárín àwọn òkú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Bí wọ́n sì ti ń sọ̀ kalẹ̀ láti orí òkè náà
  rationale: Ọ̀rọ̀ yìí fi hàn pé bí wọ́n ṣe ń sọ̀ kalẹ̀ lọ́wọ́ ni ìṣẹ̀lẹ̀ tó tẹ̀ lé e ṣẹlẹ̀; “òkè náà” sì tọ́ka sí òkè tí a ti mẹ́nu kàn tẹ́lẹ̀.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Jésù pàṣẹ fún wọn pé
  rationale: “Pàṣẹ” mú agbára ἐνετείλατο jáde, “pé” sì jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tí ó tẹ̀ lé e, láìfi λέγων sílẹ̀ ní ìtumọ̀.
- source_word: Μηδενὶ εἴπητε
  choice: Ẹ má ṣe sọ ... fún ẹnikẹ́ni
  rationale: Èyí jẹ́ àṣẹ ìdènà tó ṣe kedere, ó sì pa ìtẹnumọ́ pé wọn kò gbọ́dọ̀ sọ fún ẹnikẹ́ni mọ́.
- source_word: τὸ ὅραμα
  choice: ìran náà
  rationale: “Ìran” jẹ́ ìtumọ̀ tààrà tó dá ìhùwàsí ìfihàn ti ὅραμα mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ fi ọ̀nà àdánidá “ohun tí ẹ rí” hàn.
- source_word: ἕως οὗ
  choice: títí ... yóò fi
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ààlà àkókò hàn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A tú orúkọ ìdánimọ̀ tí Jésù lò fún ara rẹ̀ ní tààrà, kí ìtumọ̀ àti ìró ẹ̀kọ́ ìgbàgbọ́ rẹ̀ má bàa sọnù.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Èyí mú ìtumọ̀ ἐκ, pé ó jáde láti àárín àwọn tí ó ti kú, hàn kedere; àlàyé ẹsẹ̀ ìsàlẹ̀ fúnni ní ọ̀nà Yorùbá tó wọ́pọ̀ jù.
- source_word: ἐγερθῇ
  choice: yóò fi jí dìde
  rationale: “Jí dìde” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àjíǹde. Bí ó tilẹ̀ jẹ́ pé Giriki lo ìṣe aláìṣe, fífi gbolohun aláìṣe ṣe ní tààrà nínú Yorùbá yóò le gan-an; ọ̀rọ̀ yìí kò sì sọ ẹni tó mú àjíǹde náà ṣẹ ní gbangba.
theological_decisions:
- issue: Ọ̀nà tí a fi sọ àjíǹde àti ohùn ìṣe
  choice: Ọmọ Ènìyàn yóò fi jí dìde
  alternative: a ó fi jí Ọmọ Ènìyàn dìde
  rationale: Giriki ní ìṣe aláìṣe, ṣùgbọ́n àfidípò aláìṣe pẹ̀lú “a” lè dà bí ẹni pé àwọn ènìyàn kan ni yóò jí i dìde. Ọ̀nà tí a yàn jẹ́ Yorùbá àdánidá, kò sì fi ẹni tó ṣe ìgbésẹ̀ náà kún ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Pàṣẹ,” “ìran,” àti “Ọmọ Ènìyàn” pa agbára àti ìró ẹ̀kọ́ ìgbàgbọ́ ti orísun mọ́, nígbà tí ìṣètò gbolohun dúró gẹ́gẹ́ bí Yorùbá àdánidá.
