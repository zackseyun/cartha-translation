  to: Bí wọ́n sì ṣe ń sọ̀kalẹ̀ láti orí òkè náà, Jésù pàṣẹ fún wọn pé, “Ẹ má ṣe sọ ìran náà[a] fún ẹnikẹ́ni títí di ìgbà tí a ó fi jí Ọmọ Ènìyàn dìde kúrò láàárín àwọn òkú[b].”
  rationale: Àtúnṣe náà ń pa ohùn ìṣe aláìṣe ti ἐγερθῇ mọ́ nípasẹ̀ ọ̀nà Yorùbá àìṣe-ẹni pàtó, “a ó fi jí ... dìde,” láìfi aṣojú tàbí ẹ̀kọ́ ìsìn kún ẹsẹ̀ náà. A tún ṣàtúnṣe ìkọ̀wé “sọ̀kalẹ̀.” Àwọn àlàyé ẹsẹ̀ ìsàlẹ̀ dúró síbi tí ọ̀rọ̀ tí wọ́n ṣàlàyé wà, wọ́n sì fi ìyàtọ̀ láàárín ìtumọ̀ gangan àti ọ̀nà míràn hàn.
