id: MAT.17.24
reference: Matthew 17:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: yo
  text: Nígbà tí wọ́n dé Kápánáúm, àwọn tí ń gba owó orí dírákímà méjì[b] wá sọ́dọ̀ Pétérù, wọ́n sì bi í pé, “Ṣé olùkọ́ yín kì í san owó orí dírákímà méjì[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘dírákímà méjì’; èyí ni owó orí dírákímà méjì tí a ń san fún tẹ́ńpìlì.
    reason: cultural_note
  - marker: b
    text: Tàbí, ‘àwọn agbowó orí dírákímà méjì.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Nígbà tí wọ́n dé
  rationale: Ìṣọ̀kan ọ̀rọ̀ genitive absolute náà fi àkókò hàn. ‘Nígbà tí wọ́n dé’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àkókò mọ́; a kò fi δέ hàn lọ́tọ̀ nítorí pé ìyípadà gbólóhùn ti mú ipa rẹ̀ ṣẹ.
- source_word: Καφαρναοὺμ
  choice: Kápánáúm
  rationale: A kọ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìró rẹ̀, ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: προσῆλθον
  choice: tọ Pétérù wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n sún mọ́ ọn tàbí wọ́n wá bá a; ‘tọ Pétérù wá’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìṣípò sí ọ̀dọ̀ rẹ̀.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: àwọn tí ń gba owó orí dírákímà méjì
  rationale: Àpólà participle náà ń dá ẹgbẹ́ náà mọ̀ nípasẹ̀ iṣẹ́ wọn. ‘Àwọn tí ń gba’ pa ìṣètò Gíríìkì mọ́, nígbà tí ‘owó orí’ mú iṣẹ́ ìsanwó náà yé òǹkàwé.
- source_word: δίδραχμα
  choice: owó orí dírákímà méjì
  rationale: δίδραχμα jẹ́ ìsanwó tó dọ́gba pẹ̀lú dírákímà méjì. Ìtumọ̀ yìí pa iye owó àti ìṣe owó orí mọ́, nígbà tí àlàyé ìsìn rẹ̀ wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: τῷ Πέτρῳ
  choice: Pétérù
  rationale: Orúkọ náà ni a ṣe ní ìbámu pẹ̀lú ìlànà ìkọ̀wé Yorùbá.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: olùkọ́ yín
  rationale: διδάσκαλος túmọ̀ sí olùkọ́ ní kíkún nínú àyíká yìí; ‘olùkọ́’ kedere, ó sì jẹ́ èdè Yorùbá òde òní.
- source_word: οὐ τελεῖ
  choice: Ṣé ... kì í san
  rationale: Nínú àyíká owó orí, τελέω túmọ̀ sí sísan ohun tí ó yẹ. Ìbéèrè odi ‘Ṣé ... kì í san’ pa ìrísí àti ìfojúsọ́nà ìdáhùn rere inú Gíríìkì mọ́ láì fi ìdáhùn náà lé òǹkàwé lórí.
theological_decisions:
- issue: Bóyá kí δίδραχμα túmọ̀ sí owó orí tàbí kìkì owó ẹyọ
  choice: owó orí dírákímà méjì
  alternative: owó ẹyọ dírákímà méjì; dírákímà méjì
  rationale: Ọ̀rọ̀ tó yí i ká ń béèrè bóyá Jésù ń san ìsanwó tí a ń gba, kì í ṣe bóyá ó ń lo owó ẹyọ. ‘Owó orí’ mú ìtumọ̀ àyíká náà ṣe kedere láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Agbára ìbéèrè odi οὐ τελεῖ
  choice: 'Pa á mọ́ gẹ́gẹ́ bí ìbéèrè odi: ‘Ṣé ... kì í san ...?’'
  alternative: Ṣé olùkọ́ yín ń san ...?
  rationale: Ìbéèrè Gíríìkì náà ṣeé ṣe kó ń retí ìdáhùn rere, ṣùgbọ́n ìtumọ̀ kò yẹ kó yanjú ìfojúsọ́nà náà dípò òǹkàwé. Ìbéèrè odi Yorùbá pa ìfarakanra ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tí ó ti yẹ, ó sì ní ọ̀wọ̀ àti ìrọ̀rùn fún òǹkàwé òde òní. A lo ‘Ṣé’ fún ìbéèrè àdánidá, ‘tọ ... wá’ fún ìsúnmọ́ ẹni, àti ‘owó orí’ láti mú àyíká ìsanwó yé ni kedere.
