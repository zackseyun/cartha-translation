id: MAT.17.1
reference: Matthew 17:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: yo
  text: Lẹ́yìn ọjọ́ mẹ́fà, Jésù mú Pétérù, Jákọ́bù, àti Jòhánù, arákùnrin rẹ̀, lọ pẹ̀lú rẹ̀; ó sì mú wọn gòkè sí òkè gíga kan ní ìkọ̀kọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ́tọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Lẹ́yìn ọjọ́ mẹ́fà
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ nígbà tí ọjọ́ mẹ́fà ti kọjá; ìtumọ̀ yìí bá ọ̀rọ̀ Gíríìkì mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: παραλαμβάνει
  choice: mú ... lọ pẹ̀lú rẹ̀
  rationale: παραλαμβάνω níhìn-ín túmọ̀ sí mímú àwọn ènìyàn kan bá ara ẹni lọ; gbolohun yìí sọ ìtumọ̀ náà ní kedere ní Yorùbá.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pétérù, Jákọ́bù àti Jòhánù
  rationale: Àwọn wọ̀nyí ni ìkọ̀wé orúkọ wọ̀nyí tí ó wọ́pọ̀ nínú Yorùbá Bíbélì, pẹ̀lú àmì ohùn.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Ìtumọ̀ yìí pa àrọ́pò-orúkọ Gíríìkì mọ́; nínú àkópọ̀ ọ̀rọ̀ náà, ó ṣeé ṣe jù pé Jòhánù ni arákùnrin Jákọ́bù.
- source_word: ἀναφέρει
  choice: mú wọn gun
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí mímú wọn lọ sókè; ‘mú wọn gun òkè’ jẹ́ ọ̀nà àdánidá láti sọ ìrìn sí ibi gíga ní Yorùbá.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: òkè gíga kan
  rationale: Ó sọ ibi tí wọ́n ń lọ àti gíga òkè náà ní Yorùbá tí ó rọrùn.
- source_word: κατ’ ἰδίαν
  choice: níbi tí àwọn nìkan wà
  rationale: Ó fi hàn pé Jésù àti àwọn ọmọ-ẹ̀yìn mẹ́tẹ̀ẹ̀ta yà sọ́tọ̀ kúrò lọ́dọ̀ àwọn mìíràn, láìfi dandan sọ pé ọkọọkan wọn wà ní òun nìkan.
theological_decisions:
- issue: Àwọn ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí nínú ìtàn Ìhìn Rere
  choice: Lo àsìkò tí ó ti kọjá ní Yorùbá nípasẹ̀ àkópọ̀ ‘Lẹ́yìn...’ àti àwọn ọ̀rọ̀-ìṣe ‘mú’
  alternative: 'Pa àkókò ìsinsìnyí Gíríìkì mọ́ ní tààrà: ‘Jésù ń mú ... ó sì ń mú...’'
  rationale: παραλαμβάνει àti ἀναφέρει jẹ́ historical present tí ń fún ìtàn Gíríìkì ní ìyè. Ní Yorùbá, lílo ‘ń’ lè dà bí ìṣe tí ń lọ lọ́wọ́ dípò ọ̀nà ìtàn; nítorí náà, ìtumọ̀ náà lo ọ̀nà ìtàn Yorùbá àdánidá láìyí ìtẹ̀síwájú ìṣẹ̀lẹ̀ náà padà.
- issue: Ẹni tí ‘arákùnrin rẹ̀’ ń tọ́ka sí
  choice: Pa ‘arákùnrin rẹ̀’ mọ́ lẹ́yìn Jòhánù
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘Jòhánù, arákùnrin Jákọ́bù’
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí Jákọ́bù gẹ́gẹ́ bí ẹni tí Jòhánù jẹ́ arákùnrin rẹ̀, ṣùgbọ́n ìtumọ̀ náà kò fi àlàyé tí Gíríìkì kò sọ ní tààrà kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ni a lò. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A yan ìtàn àsìkò tí ó ti kọjá gẹ́gẹ́ bí ọ̀nà àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo historical present.
