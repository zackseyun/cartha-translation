  to: Lẹ́yìn ọjọ́ mẹ́fà, Jésù mú Pétérù, Jákọ́bù, àti Jòhánù, arákùnrin rẹ̀, lọ pẹ̀lú rẹ̀; ó sì mú wọn gòkè sí òkè gíga kan ní ìkọ̀kọ̀.[a]
