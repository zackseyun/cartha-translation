  to: Ó sì wí pé, “Olúwa, ṣàánú ọmọkùnrin mi, nítorí ó máa ń ní ìkọlù warapa[a], ó sì ń jìyà gidigidi; nítorí ó sábà máa ń ṣubú sínú iná, ó sì sábà máa ń ṣubú sínú omi.”
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí kò ṣe kedere (“ìkọlù gírí”) pẹ̀lú “ìkọlù warapa,” tí ó ṣàpèjúwe ohun tí a rí láìsọ okùnfà tàbí fi ìmọ̀ ìṣègùn òde òní múlẹ̀. Ó tún mú ìtàn náà rọrùn ní Yorùbá, ó sì ṣe àtúnṣe àlàyé ẹsẹ̀-ìsàlẹ̀ láti fi ìtumọ̀ Gíríìkì hàn pẹ̀lú ìṣọ́ra.
