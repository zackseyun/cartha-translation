id: MAT.17.15
reference: Matthew 17:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: yo
  text: Ó sì wí pé, “Olúwa, ṣàánú ọmọkùnrin mi, nítorí ó máa ń ní ìkọlù warapa[a], ó sì ń jìyà gidigidi; nítorí ó sábà máa ń ṣubú sínú iná, ó sì sábà máa ń ṣubú sínú omi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ọ̀rọ̀ náà ní ìbáṣepọ̀ pẹ̀lú “òṣùpá.” Ní lílò ayé àtijọ́, wọ́n máa ń lò ó fún ipò tó jọ ìkọlù warapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: ó sì ń wí pé
  rationale: Ó pa ìsopọ̀ pẹ̀lú ìtàn tó ṣáájú mọ́, ó sì fi hàn pé ọ̀rọ̀ náà ń tẹ̀ síwájú gẹ́gẹ́ bí participle ní Gíríìkì.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè fún κύριος ni; “Olúwa” jẹ́ ọ̀rọ̀ ọ̀wọ̀ tó yẹ fún bí ọkùnrin náà ṣe ń pe Jésù.
- source_word: ἐλέησόν
  choice: ṣàánú
  rationale: Ó jẹ́ ẹ̀bẹ̀ fún àánú àti ìrànlọ́wọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó ní ìwọ̀ntúnwọ̀nsì.
- source_word: μου τὸν υἱόν
  choice: ọmọkùnrin mi
  rationale: υἱός túmọ̀ sí ọmọ ọkùnrin ní pàtó, possessive μου sì fara hàn ní “mi.”
- source_word: σεληνιάζεται
  choice: ó máa ń ní ìkọlù gírí
  rationale: Ìtumọ̀ yìí ṣàpèjúwe ohun tí ara ọmọ náà ń ṣe láìfi ìdánimọ̀ ìṣègùn òde òní tàbí ìgbàgbọ́ pé òṣùpá ló ń fà á kún ọ̀rọ̀ náà.
- source_word: κακῶς πάσχει
  choice: ó sì ń jìyà gidigidi
  rationale: “Jìyà gidigidi” fi agbára adverb κακῶς àti ìrora inú πάσχει hàn ní Yorùbá àdánidá.
- source_word: πολλάκις
  choice: ó sábà máa ń
  rationale: Ó sọ ìṣẹ̀lẹ̀ tó ń ṣẹlẹ̀ léraléra ní ọ̀nà Yorùbá tó mọ́gbọ́n dání.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: ṣubú sínú iná
  rationale: Ìtumọ̀ tààrà tó pa ìdarí εἰς mọ́.
- source_word: εἰς τὸ ὕδωρ
  choice: sínú omi
  rationale: Ó tẹ̀ lé ìṣọ̀kan gbolohun tó ṣáájú, ó sì túmọ̀ εἰς + accusative lọ́nà àdánidá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ σεληνιάζεται ní àyíká ìwòsàn àti ìlépa ẹ̀mí búburú
  choice: ó máa ń ní ìkọlù gírí
  alternative: ó ní àrùn gírí; òṣùpá ń kọlù ú
  rationale: Ẹsẹ yìí ń ròyìn bí bàbá náà ṣe ṣàpèjúwe ipò ọmọ rẹ̀, kì í ṣe àyẹ̀wò ìṣègùn òde òní. Ìtumọ̀ yìí dá lórí ohun tí a lè rí, kò sì pinnu pé òṣùpá tàbí ẹ̀mí búburú ni okùnfà nínú ẹsẹ yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní ọlá; a yẹra fún ọ̀rọ̀ ìṣègùn tó lè sọ ohun tí orísun kò sọ ní pàtó.
