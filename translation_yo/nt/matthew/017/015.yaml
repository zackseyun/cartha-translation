  source_fidelity: Ìtumọ̀ náà pa ìbẹ̀bẹ̀ sí Olúwa, ọmọkùnrin náà, ìjìyà rẹ̀, àti ìṣubú rẹ̀ sínú iná àti omi mọ́ dáadáa. Ṣùgbọ́n “ìkọlù gírí” kì í ṣe ọ̀rọ̀ Yorùbá boṣewa tó ṣe kedere fún σεληνιάζεται; “ìkọlù warapa” ṣàfihàn ìrírí ìkọlù náà ní kedere, láìjẹ́ pé ó ń pinnu okùnfà rẹ̀.
  naturalness: “Ó sì ń wí pé” dà bí ìṣe tí ń lọ lọ́wọ́ nínú Yorùbá, ó sì kò rọrùn nínú ìtàn. “Ó sì wí pé” jẹ́ ìtàn Yorùbá àdánidá, ó sì lè gbé participle Gíríìkì náà ní àyíká rẹ̀. “Ìkọlù warapa” jẹ́ ọ̀rọ̀ tó mọ̀ síi, tó sì ṣe kedere ju “ìkọlù gírí” lọ.
  terminology: “Olúwa,” “ṣàánú,” àti “ọmọkùnrin mi” yẹ. A tún ṣe àtúnṣe àlàyé ẹsẹ̀-ìsàlẹ̀ kí ó má sọ pé òṣùpá ‘ń kọlù’ ẹni náà, èyí tí kì í ṣe ìtumọ̀ tààrà tí ó dára; ó yẹ kí ó ṣàlàyé ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú òṣùpá àti lílò rẹ̀ ní ayé àtijọ́.
