id: MAT.8.7
reference: Matthew 8:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: yo
  text: Ó sì sọ fún un pé, “Èmi yóò wá wò ó sàn.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé èmi yóò wá wò ó sàn?” Àwọn atúmọ̀ kan ka ọ̀rọ̀ Jésù náà sí ìbéèrè ní ìbámu pẹ̀lú àyíká, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní ìfẹ̀sẹ̀mulẹ̀ ni a máa ń kà á sí.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó pa ìsopọ̀ ìtàn tó rọrùn mọ́ láìfi ìtumọ̀ àkókò tàbí àbájáde kún un.
- source_word: λέγει
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àsìkò ìsinsìnyí gẹ́gẹ́ bí historical present, Yorùbá ìtàn àdánidá máa ń lo ọ̀rọ̀-ìṣe tí kò fi àsìkò hàn ní pàtó; “sọ” pa ìgbésẹ̀ ìtàn náà mọ́.
- source_word: αὐτῷ
  choice: fún un
  rationale: Èyí ni ìtumọ̀ àdánidá fún ẹni tí a bá sọ̀rọ̀ sí lẹ́yìn λέγει.
- source_word: Ἐγὼ
  choice: Èmi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní gbangba ní Gíríìkì ní ìtẹnumọ́ díẹ̀; “Èmi” pa ìtẹnumọ́ náà mọ́ ní Yorùbá.
- source_word: ἐλθὼν
  choice: yóò wá
  rationale: Aorist participle náà ṣáájú ọ̀rọ̀-ìṣe ọjọ́ iwájú, ó sì fi ìgbésẹ̀ tó ń bá a lọ hàn; “yóò wá …” jẹ́ Yorùbá àdánidá.
- source_word: θεραπεύσω
  choice: wo … sàn
  rationale: Nínú àyíká ìwòsàn yìí, “wo … sàn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá θεραπεύω mu.
- source_word: αὐτόν
  choice: òun
  rationale: Ó tọ́ka sí ìránṣẹ́ aláìsàn náà; “òun” yà á kedere sí ẹni tí Jésù ń bá sọ̀rọ̀.
theological_decisions:
- issue: Bóyá kí a tú gbólóhùn náà sí àsọyé tàbí ìbéèrè
  choice: 'Àsọyé: “Èmi yóò wá wo òun sàn.”'
  alternative: 'Ìbéèrè: “Ṣé kí èmi wá wo òun sàn?”'
  rationale: Gíríìkì kò ní àmì ọ̀rọ̀ ìbéèrè, a sì máa ń ka ọ̀rọ̀ náà ní ti ẹ̀dá gẹ́gẹ́ bí àsọyé. Síbẹ̀, àyíká mú kí àwọn kan ka a sí ìbéèrè; àlàyé ìsàlẹ̀ ojú-ewé pa ọ̀nà yẹn mọ́ láìyí kíkà tó ṣeé ṣe jù lọ padà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó ṣeé yé fún gbogbo ènìyàn; a lo “wo … sàn” gẹ́gẹ́ bí gbólóhùn ìwòsàn àdánidá, a sì lo “òun” láti mú ẹni tí ọ̀rọ̀ náà tọ́ka sí ṣe kedere.
