base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: yo
  text: Nígbà tí ó wọ[a] Kápánáúmù, balógun ọgọ́rùn-ún kan wá bá a, ó sì ń bẹ̀ ẹ́[b] pé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ó ti ń wọ Kápánáúmù”; tàbí, “Lẹ́yìn tí ó wọ Kápánáúmù.”
    reason: Genitive absolute pẹ̀lú aorist participle lè tọ́ka sí ìṣe tó ń ṣẹlẹ̀ ní àkókò kan náà tàbí sí ìṣe tó ṣáájú díẹ̀; ọ̀rọ̀ inú ẹsẹ̀ kò pọn dandan yan ọ̀kan ṣoṣo.
  - marker: b
    text: Tàbí, “ó sì ń rọ̀ ọ́.”
    reason: παρακαλέω níbí lè sọ ìbẹ̀bẹ̀ tọkàntọkàn; àṣàyàn yìí ń fi ìyàtọ̀ ọ̀rọ̀ náà hàn.
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Nígbà tí ó wọ
  rationale: A tú ẹ̀ka ọ̀rọ̀ genitive absolute pẹ̀lú aorist participle sí gbólóhùn àkókò Yorùbá tó ṣe déédéé. “Nígbà tí” pa ìbáṣepọ̀ àkókò mọ́ láì fi tipátipá sọ pé ìwọlé náà ti parí pátápátá ṣáájú ohun tó tẹ̀ lé.
- source_word: εἰς Καφαρναοὺμ
  choice: wọ Kápánáúmù
  rationale: Ọ̀rọ̀ ìṣáájú εἰς wà nínú ìtumọ̀ adayeba ti ọ̀rọ̀-ìṣe Yorùbá “wọ”; a ṣe àkọsílẹ̀ orúkọ ìlú náà gẹ́gẹ́ bí “Kápánáúmù.”
- source_word: προσῆλθεν αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá adayeba láti sọ pé ẹni kan sún mọ́ ẹlòmíràn tàbí wá bá a, ó sì bá ìṣípò ìtàn mu.
- source_word: ἑκατόνταρχος
  choice: balógun ọgọ́rùn-ún
  rationale: Ìtumọ̀ náà pa ipò olórí ọmọ ogun tó wà lábẹ́ àṣẹ rẹ̀ mọ́, dípò kí a fi ọ̀rọ̀ gbogbogbò bí “ọ̀gá ọmọ ogun” rọ́pò rẹ̀.
- source_word: παρακαλῶν αὐτὸν
  choice: ó sì ń bẹ̀ ẹ́
  rationale: “Bẹ̀” fi hàn pé ó fi tọkàntọkàn béèrè ìrànlọ́wọ́, ó sì jẹ́ kí participle náà ṣiṣẹ́ gẹ́gẹ́ bí ìṣe tó ń bá ìtọ̀-wá náà lọ. A kò fi ọ̀rọ̀ míì kún un tó lè mú ìkanra náà le ju ohun tí Gíríìkì sọ lọ.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Balógun ọgọ́rùn-ún” ṣàlàyé ipò ἑκατόνταρχος ní ọ̀nà tí òǹkàwé lasán lè lóye, láì sọ ní pàtó pé ará Róòmù ni, nítorí Gíríìkì ẹsẹ̀ yìí kò mẹ́nu kan Róòmù. A fi “pé,” sí òpin nítorí ẹsẹ̀ náà ń ṣí ọ̀rọ̀ tí balógun náà máa sọ nínú ẹsẹ̀ tó tẹ̀ lé.
