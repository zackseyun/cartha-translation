  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: yo
  text: Agbo ẹlẹ́dẹ̀ ńlá kan ń jẹun ní ibi tí ó jìnnà sí wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìjìnnà sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: kan ń
  rationale: A kò fi ọ̀rọ̀ àsopọ̀ kan sí iwájú gbólóhùn, nítorí δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí àyíká ìtàn lè gbé jáde láìfi ‘nígbà náà’ kún un. Ìtumọ̀ ἦν fara hàn nínú ìṣètò gbólóhùn Yorùbá náà.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: ní ibi tí ó jìnnà díẹ̀ sí wọn
  rationale: Èyí sọ pé agbo náà wà ní àyè kan tí kò sún mọ́ wọn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá. Àlàyé ìsàlẹ̀ fi ìtumọ̀ líle sí i, ‘ní ibi jíjìnnà sí wọn,’ hàn.
- source_word: ἀγέλη
  choice: agbo
  rationale: ‘Agbo’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àkójọpọ̀ ẹranko irú èyí.
- source_word: χοίρων
  choice: ẹlẹ́dẹ̀
  rationale: ‘Ẹlẹ́dẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún pigs/swine.
- source_word: πολλῶν
  choice: ńlá
  rationale: Ní ìbámu pẹ̀lú orúkọ àkójọpọ̀ ‘agbo,’ ‘agbo ńlá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ẹlẹ́dẹ̀ inú rẹ̀ pọ̀.
- source_word: βοσκομένη
  choice: ń jẹun
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ohun tí agbo náà ń ṣe nígbà náà—wọ́n ń jẹun—láìfi olùṣọ́ tàbí ẹni tó ń bọ́ wọn kún ohun tí Gíríìkì sọ.
theological_decisions: []
