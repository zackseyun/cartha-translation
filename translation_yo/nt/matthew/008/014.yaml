id: MAT.8.14
reference: Matthew 8:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: yo
  text: Nígbà tí Jésù dé ilé Pétérù, ó rí ìyá aya Pétérù tí ó dùbúlẹ̀[a], tí ibà sì ń ṣe é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó dùbúlẹ̀ ní àìsàn.” Gíríìkì sọ ní tààrà pé ó “dùbúlẹ̀” àti pé ibà ń ṣe é; ó ṣeé ṣe kí ó wà lórí ibùsùn, ṣùgbọ́n a kò mẹ́nu kan ibùsùn ní kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Nígbà tí Jésù dé
  rationale: Aorist participle náà ń fi àkókò àti ìtẹ̀lé ìṣẹ̀lẹ̀ hàn; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá tí ó pa agbára ‘nígbà tí ó dé’ mọ́.
- source_word: οἰκίαν Πέτρου
  choice: ilé Pétérù
  rationale: Ó túmọ̀ ìní tí genitive náà ń fi hàn ní ṣókí, ó sì bá οἰκία (‘ilé’) mu.
- source_word: πενθερὰν αὐτοῦ
  choice: ìyá aya Pétérù
  rationale: πενθερά túmọ̀ sí ìyá ọkọ tàbí ìyá aya; nínú ọ̀rọ̀ yìí obìnrin náà ni ìyá aya Pétérù. Lílo orúkọ Pétérù dípò ọ̀rọ̀ arọ́pò-orúkọ mú ẹni tí αὐτοῦ ń tọ́ka sí ṣe kedere láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: βεβλημένην
  choice: tí ó dùbúlẹ̀
  rationale: Perfect passive participle náà ṣàpèjúwe ipò tí obìnrin náà wà—ó ti dùbúlẹ̀. A kò fi ‘lórí ibùsùn’ sínú ẹsẹ̀ náà nítorí kò sí ní tààràtà nínú Gíríìkì.
- source_word: πυρέσσουσαν
  choice: tí ibà sì ń ṣe é
  rationale: Ìsọ̀rọ̀ Yorùbá àdánidá yìí fi ipò ibà tí ń bá a lọ hàn, gẹ́gẹ́ bí present participle náà, láìfikún àwòrán bí ‘ibà ń jó o’.
theological_decisions:
- issue: Ẹni tí αὐτοῦ nínú ‘ìyá aya rẹ̀’ ń tọ́ka sí
  choice: Pétérù ni ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí; obìnrin náà jẹ́ ìyá aya Pétérù.
  alternative: Ọ̀rọ̀ arọ́pò-orúkọ Yorùbá ‘rẹ̀’ lè dà bí ẹni pé Jésù ni ó ń tọ́ka sí bí a kò bá ṣọ́ ọ̀rọ̀ náà.
  rationale: Ìṣètò gírámà àti àyíká ọ̀rọ̀ fi Pétérù hàn gẹ́gẹ́ bí ẹni tí ilé àti ìbátan náà jẹ́ tirẹ̀. Títún orúkọ Pétérù sọ ń mú èyí ṣe kedere láìfa ìparí ẹ̀kọ́ ìgbàgbọ́ mìíràn jáde.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. A tún ‘Pétérù’ sọ láti yọ àìdánilójú ẹni tí ‘rẹ̀’ lè tọ́ka sí kúrò; ìṣètò ‘tí ó dùbúlẹ̀, tí ibà sì ń ṣe é’ pa ìbáṣepọ̀ àwọn participle méjèèjì mọ́ ní ọ̀nà àdánidá.
