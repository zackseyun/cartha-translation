id: MAT.8.10
reference: Matthew 8:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: yo
  text: Nígbà tí Jésù gbọ́ èyí, ó yà á lẹ́nu, ó sì sọ fún àwọn tí ń tọ̀ ọ́ lẹ́yìn pé, “Lóòótọ́ ni mo sọ fún yín, èmi kò rí irú ìgbàgbọ́ ńlá báyìí lọ́dọ̀ ẹnikẹ́ni ní Ísírẹ́lì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Nígbà tí Jésù gbọ́ èyí
  rationale: Aorist participle náà fi ipò tó ṣáájú ìṣe pàtàkì hàn. Gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá; “èyí” tọ́ka sí ọ̀rọ̀ balógun ọ̀rún tó ṣáájú.
- source_word: ἐθαύμασεν
  choice: ó yà á lẹ́nu
  rationale: Èyí sọ ìyàlẹ́nu Jésù jáde ní Yorùbá àdánidá láìfi àìmọ̀ tàbí àṣìṣe kàn án.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: àwọn tí ń tọ̀ ọ́ lẹ́yìn
  rationale: Present participle náà ń tọ́ka sí àwọn tó ń bá Jésù rìn ní àkókò yẹn, kì í ṣe dandan pé ó jẹ́ orúkọ ẹgbẹ́ àwọn ọmọ-ẹ̀yìn.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Lóòótọ́ ni mo sọ fún yín
  rationale: Ó pa ìtẹnumọ́ àti ọ̀wọ̀ inú ọ̀rọ̀ ìdánilójú Jésù mọ́, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: παρ’ οὐδενὶ
  choice: lọ́dọ̀ ẹnikẹ́ni
  rationale: παρά pẹ̀lú dative níbí túmọ̀ sí ohun tí a rí nínú tàbí lọ́dọ̀ ẹnì kan; “lọ́dọ̀ ẹnikẹ́ni” jẹ́ ìtumọ̀ Yorùbá tó bójú mu ní abala odi.
- source_word: τοσαύτην πίστιν
  choice: irú ìgbàgbọ́ ńlá báyìí
  rationale: τοσαύτην tẹnumọ́ ìwọ̀n tàbí títóbi ìgbàgbọ́ náà. Ìtumọ̀ yìí mú “such/so great faith” jáde ní kedere àti ní èdè àdánidá.
- source_word: ἐν τῷ Ἰσραήλ
  choice: ní Ísírẹ́lì
  rationale: Ó pa ìtumọ̀ ibi àti ti àwùjọ mọ́, ní títọ́ka sí Ísírẹ́lì gẹ́gẹ́ bí ilẹ̀ àti àwọn ènìyàn.
- source_word: εὗρον
  choice: èmi kò rí
  rationale: Aorist náà jẹ́ ìṣe tí Jésù sọ pé kò ṣẹlẹ̀ nínú ìrírí rẹ̀ títí di àsìkò yẹn. Past-form Yorùbá náà jẹ́ tààrà, ìtẹnumọ́ “èmi” sì bá ìṣètò ọ̀rọ̀ Gíríìkì mu.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ìgbẹ́kẹ̀lé balógun ọ̀rún nínú àṣẹ Jésù. “Ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ, tó sì pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìgbẹ́kẹ̀lé ara ẹni mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, olóhùn, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “tọ̀ ọ́ lẹ́yìn” dípò orúkọ ẹgbẹ́ kan, kí participle Gíríìkì má bà a di ìdánimọ̀ àjọṣe tí ó lágbára ju ohun tí ọ̀rọ̀ sọ lọ. Kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí ìtumọ̀ pàtàkì náà lè gba agbára τοσαύτην àti ìṣètò παρ’ οὐδενὶ sínú ọ̀rọ̀ láìsọ ìtumọ̀ míì nù.
