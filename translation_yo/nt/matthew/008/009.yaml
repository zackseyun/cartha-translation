review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ ìpìlẹ̀ Gíríìkì mọ́: balógun náà wà lábẹ́ àṣẹ, ó sì ní àwọn ọmọ ogun lábẹ́ ara rẹ̀; ìlànà àṣẹ àti ìgbọràn náà sì hàn kedere. Síbẹ̀, lílo ‘máa ń’ nínú apá àkọ́kọ́ àti fífi ‘mo sọ’ sí apá tó kàn kò bára wọn mu dáadáa fún àpẹẹrẹ ìṣe-àṣà tí àwọn present Gíríìkì náà ń ṣàfihàn.'
  naturalness: ‘Èmi náà jẹ́ ọkùnrin tí ó wà lábẹ́ àṣẹ’ jẹ́ èdè Yorùbá tó rọrùn, tó sì mú ἄνθρωπος hàn nípasẹ̀ ọ̀rọ̀ tó bá olùsọ̀rọ̀ ọkùnrin náà mu. ‘Mo ń sọ ... ó sì ń lọ’ tún jẹ́ ọ̀nà àdánidá láti fi àpẹẹrẹ àṣẹ tí a máa ń tẹ̀ lé hàn.
  terminology: A pa ‘àṣẹ,’ ‘ọmọ ogun,’ àti ‘ìránṣẹ́’ mọ́. ‘Ìránṣẹ́’ jẹ́ ìtumọ̀ tó yẹ fún ìka kíkà, nígbà tí àlàyé ìsàlẹ̀ ń fi ‘ẹrú’ hàn gẹ́gẹ́ bí àṣàyàn fún δοῦλος. A ti so àmì àlàyé mọ́ ‘ìránṣẹ́,’ kì í ṣe ní òpin ẹsẹ̀, kí ó lè tọ́ka sí ọ̀rọ̀ tí àlàyé náà kan ní kedere.
