revisions:
- from: Nítorí èmi pẹ̀lú jẹ́ ẹni tí ó wà lábẹ́ àṣẹ, mo sì ní àwọn ọmọ ogun lábẹ́ mi. Mo máa ń sọ fún eléyìí pé, ‘Lọ,’ ó sì máa ń lọ; mo sọ fún òmíràn pé, ‘Wá,’ ó sì máa ń wá; mo sì sọ fún ìránṣẹ́ mi pé, ‘Ṣe èyí,’ ó sì máa ń ṣe é.[a]
  to: Nítorí èmi náà jẹ́ ọkùnrin tí ó wà lábẹ́ àṣẹ, mo sì ní àwọn ọmọ ogun lábẹ́ mi. Mo sì ń sọ fún eléyìí pé, ‘Lọ,’ ó sì ń lọ; mo sì ń sọ fún òmíràn pé, ‘Wá,’ ó sì ń wá; mo sì ń sọ fún ìránṣẹ́ mi[a] pé, ‘Ṣe èyí,’ ó sì ń ṣe é.
  rationale: Àtúnṣe náà mú ọ̀rọ̀ ‘ọkùnrin’ wá fún ἄνθρωπος ní ọ̀rọ̀ balógun ọkùnrin kan, ó sì jẹ́ kí ìtumọ̀ ‘I too’ hàn nípasẹ̀ ‘èmi náà.’ A tún ṣe ìlànà ìṣe náà ní ìṣọ̀kan pẹ̀lú ‘ń’ nínú gbogbo àpẹẹrẹ mẹ́tẹ̀ẹ̀ta, láì fi ìtumọ̀ àṣà tí ó lágbára ju sí i. Ní ìkẹyìn, a gbe àmì àlàyé sí ibi tí ó tọ́ka sí ìránṣẹ́ gan-an.
