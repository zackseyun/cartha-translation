id: MAT.8.9
reference: Matthew 8:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: yo
  text: Nítorí èmi náà jẹ́ ọkùnrin tí ó wà lábẹ́ àṣẹ, mo sì ní àwọn ọmọ ogun lábẹ́ mi. Mo sì ń sọ fún eléyìí pé, ‘Lọ,’ ó sì ń lọ; mo sì ń sọ fún òmíràn pé, ‘Wá,’ ó sì ń wá; mo sì ń sọ fún ìránṣẹ́ mi[a] pé, ‘Ṣe èyí,’ ó sì ń ṣe é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ẹrú,” dípò “ìránṣẹ́” (Gíríìkì: δοῦλος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí
  rationale: Ó mú agbára ìṣàlàyé γάρ jáde ní Yorùbá àdánidá; καί níbí ń fi hàn pé òun náà wà nínú ètò àṣẹ, èyí tí “pẹ̀lú” tó tẹ̀ lé mú jáde.
- source_word: ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: èmi pẹ̀lú jẹ́ ẹni tí ó wà lábẹ́ àṣẹ
  rationale: “Èmi pẹ̀lú” pa ìtẹnumọ́ ἐγώ àti agbára καί mọ́; “ẹni” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ἄνθρωπος níbí, “lábẹ́ àṣẹ” sì pa àwòrán ìpele àṣẹ ológun mọ́.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: mo sì ní àwọn ọmọ ogun lábẹ́ mi
  rationale: Ó fi hàn pé ọkùnrin náà fúnra rẹ̀ wà lábẹ́ àṣẹ, síbẹ̀ àwọn ọmọ ogun tún wà lábẹ́ rẹ̀.
- source_word: λέγω τούτῳ· Πορεύθητι ... καὶ ἄλλῳ· Ἔρχου
  choice: Mo máa ń sọ fún eléyìí pé, ‘Lọ,’ ... mo sọ fún òmíràn pé, ‘Wá,’
  rationale: “Eléyìí” àti “òmíràn” pa ìyàtọ̀ distributive ti τούτῳ àti ἄλλῳ mọ́; àwọn ọ̀rọ̀ àṣẹ kúkúrú náà bá Πορεύθητι àti Ἔρχου mu.
- source_word: πορεύεται ... ἔρχεται ... ποιεῖ
  choice: ó sì máa ń lọ ... ó sì máa ń wá ... ó sì máa ń ṣe é
  rationale: Àmì “máa ń” fi ìṣe àṣà tàbí ohun tí ó máa ń ṣẹlẹ̀ lẹ́sẹ̀kẹsẹ̀ lẹ́yìn àṣẹ hàn, bí present Greek nínú àpẹẹrẹ yìí.
- source_word: τῷ δούλῳ μου
  choice: ìránṣẹ́ mi
  rationale: “Ìránṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣeé lóye, tí ó sì bá kókó ọ̀rọ̀ nípa ìgbọràn sí àṣẹ mu; àṣàyàn “ẹrú” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àpẹẹrẹ balógun ọ̀rún
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: Kókó ẹsẹ̀ náà ni ìpele àṣẹ àti ìgbọràn, kì í ṣe ṣíṣe àlàyé ipò òfin ẹni náà. “Ìránṣẹ́” jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n “ẹrú” ni a tọ́ka sí nínú àlàyé láti pa agbára ìtumọ̀ δοῦλος mọ́.
translation_notes:
  register: Yorùbá àpapọ̀, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìtẹ̀síwájú àṣẹ àti ìgbọràn ni a pa mọ́ pẹ̀lú àwọn gbólóhùn tó jọ ara wọn.
