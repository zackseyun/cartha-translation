    rationale: Àlàyé náà jẹ́ nípa ìtumọ̀ τῷ δούλῳ μου; fífi àmì náà lẹ́gbẹ̀ẹ́ ‘ìránṣẹ́’ ń jẹ́ kí ìtọ́kasí rẹ̀ péye.
