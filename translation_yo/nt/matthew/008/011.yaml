id: MAT.8.11
reference: Matthew 8:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ fún yín pé ọ̀pọ̀ ènìyàn yóò wá láti ìhà ìlà-oòrùn àti ìhà ìwọ̀-oòrùn, wọn yóò sì bá Ábúráhámù, Ísáákì àti Jákọ́bù jókòó jẹun ní ìjọba ọ̀run[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan sí i, “wọn yóò dùbúlẹ̀.” Ní ayé ìgbà náà, àwọn ènìyàn máa ń dùbúlẹ̀ lẹ́gbẹ̀ẹ́ tábìlì nígbà àsè.
    reason: cultural_note
  - marker: b
    text: “Láti ìhà ìlà-oòrùn àti ìhà ìwọ̀-oòrùn” ṣeé ṣe kí ó túmọ̀ sí àwọn ènìyàn tí ń bọ̀ láti àwọn agbègbè jíjìnnà, títí kan àwọn tí kì í ṣe ọmọ Ísírẹ́lì.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ṣùgbọ́n mo sọ fún yín
  rationale: “Mo sọ fún yín” túmọ̀ λέγω ὑμῖν ní ọ̀nà àdánidá; “Ṣùgbọ́n” sì fi ìyípadà onírẹ̀lẹ̀ tí δέ mú wá nínú ọ̀rọ̀ hàn.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù tí ó dúró gẹ́gẹ́ bí orúkọ; fífi “ènìyàn” kún un mú kí Yorùbá ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: láti ìhà ìlà-oòrùn àti ìhà ìwọ̀-oòrùn
  rationale: Àwọn ọ̀rọ̀ orísun tó wà ní ọ̀pọ̀ ń tọ́ka sí àwọn agbègbè tàbí ìhà jíjìnnà; “ìhà” pa ìtumọ̀ àgbègbè náà mọ́ láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: ἥξουσιν
  choice: yóò wá
  rationale: ἥκω túmọ̀ sí wíwá tàbí dídé; “yóò wá” rọrùn, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἀνακλιθήσονται
  choice: yóò ... jókòó jẹun
  rationale: Ọ̀rọ̀ Gíríìkì tọ́ka sí fífara balẹ̀ lẹ́gbẹ̀ẹ́ tábìlì ní àsè. “Jókòó jẹun” jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere láti pa àwòrán ìjẹun papọ̀ mọ́; àlàyé ìṣe ìgbàanì wà ní àlàyé ìsàlẹ̀.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: bá Ábúráhámù, Ísáákì àti Jákọ́bù
  rationale: μετά pẹ̀lú genitive fi ìbákẹ́gbẹ́ hàn; ìṣètò “bá ... jókòó jẹun” sọ ìdàpọ̀ wọn níbi àsè jáde ní Yorùbá àdánidá.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: ní ìjọba ọ̀run
  rationale: Èyí ni gbólóhùn tí Mátíù sábà máa ń lò. “Ìjọba ọ̀run” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì pa ẹyọ kan “ìjọba” mọ́.
theological_decisions:
- issue: Àwòrán àsè àti ìdàpọ̀ ní ọjọ́ iwájú
  choice: Pa ìjẹun papọ̀ mọ́ pẹ̀lú “bá ... jókòó jẹun.”
  alternative: “yóò bá Ábúráhámù, Ísáákì àti Jákọ́bù wà”
  rationale: Ẹsẹ náà ń sọ̀rọ̀ ní àwòrán àsè, kì í ṣe wíwà ní ibìkan lásán. Ìtumọ̀ yìí pa àwòrán náà mọ́ láìfi ẹ̀kọ́ ìsìn míì kún un.
- issue: Àwọn tí “ọ̀pọ̀ ènìyàn” láti ìlà-oòrùn àti ìwọ̀-oòrùn ń tọ́ka sí
  choice: Fi ìtọ́kasí ibi sílẹ̀ bí ó ti rí, láìpe wọn ní Kèfèrí nínú ẹsẹ náà.
  alternative: “ọ̀pọ̀ àwọn Kèfèrí yóò wá”
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí àwọn tí kì í ṣe ọmọ Ísírẹ́lì, ṣùgbọ́n Gíríìkì sọ “ọ̀pọ̀” nìkan. Ìtumọ̀ náà pa ìtumọ̀ tó ṣeé fà jáde mọ́ láìsọ ọ́ di ohun tí ẹsẹ náà sọ ní tààrà.
translation_notes:
  register: A lo Yorùbá tó ṣe kedere, tó níyì, tí ó sì bójú mu fún òǹkàwé òde òní. A fi àmì ohùn síbi tó yẹ. “Jókòó jẹun” jẹ́ àdánidá ju fífi ìṣe rírọgbọ̀ ìgbàanì sínú ọ̀rọ̀ pàtàkì lọ, nígbà tí àlàyé [a] pa àṣà àti àwòrán àsè orísun mọ́.
