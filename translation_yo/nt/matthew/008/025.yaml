id: MAT.8.25
reference: Matthew 8:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: yo
  text: Wọ́n sún mọ́ ọn, wọ́n sì jí i, wọ́n ní, “Olúwa, gbà wá là[a]! À ń ṣègbé!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbà wá kúrò nínú ewu.” Ọ̀rọ̀ àṣẹ Gíríìkì σῶσον lè túmọ̀ sí gbígbà ẹni kúrò nínú ewu lẹ́sẹ̀kẹsẹ̀, ó sì tún lè ní ìtumọ̀ gbígbàlà tó gbòòrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: tọ̀ ọ́ wá
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n lọ sí ọ̀dọ̀ Jésù kí wọ́n tó jí i; ‘tọ̀ ọ́ wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣípò sún mọ́ ẹni kan.
- source_word: ἤγειραν
  choice: jí i
  rationale: Nínú àyíká yìí, ἐγείρω túmọ̀ sí jí ẹni tí ó ń sùn, kì í ṣe gbé ẹni dìde tàbí jíǹde kúrò nínú òkú.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá, tààrà láti mú ọ̀rọ̀ tí wọ́n sọ wọlé, láìfi àníyàn tàbí igbe kún ohun tí ọ̀rọ̀ Gíríìkì sọ ní pàtó.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ pa ìtumọ̀ oyè κύριος mọ́, ó sì jẹ́ kí ìwọ̀n ìtumọ̀ rẹ̀—láti ọ̀wọ̀ fún ẹni sí ìjẹ́wọ́ tó jinlẹ̀ nípa Jésù—wà ní ṣíṣí.
- source_word: σῶσον
  choice: gbà wá là
  rationale: Àṣẹ náà jẹ́ ẹ̀bẹ̀ fún ìgbàlà kíákíá nínú ewu. ‘Gbà wá là’ bójú mu ní Yorùbá, ó sì pa ìsopọ̀ pẹ̀lú ìtumọ̀ gbígbàlà tó gbòòrò mọ́.
- source_word: ἀπολλύμεθα
  choice: À ń ṣègbé
  rationale: Ọ̀rọ̀ ìṣe tó ń lọ lọ́wọ́ yìí fi ewu ìparun tàbí ikú tó sún mọ́lé hàn. ‘À ń ṣègbé’ sọ ìkánjú àti ewu náà ní kedere láìdín un kù sí ‘à ń kú’ nìkan.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ κύριος gẹ́gẹ́ bí oyè tí wọ́n fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ kò dín oyè náà kù sí ipò ọ̀gá lásán; ó tún jẹ́ kí bóyá ó jẹ́ ọ̀rọ̀ ọ̀wọ̀ tàbí pé ó ní ìtumọ̀ nípa ẹni tí Jésù jẹ́ máa wà ní ṣíṣí.
- issue: Bí a ṣe máa fi ẹni tí wọ́n ń bẹ̀bẹ̀ fún hàn nínú σῶσον
  choice: gbà wá là
  alternative: gbà là [láìsọ ẹni tí a ó gbà]
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà kò ní arọ́pò-orúkọ ‘wa’ lọ́tọ̀, ἀπολλύμεθα (‘à ń ṣègbé’) àti àyíká ọ̀rọ̀ fi hàn kedere pé àwọn ọmọ-ẹ̀yìn ń bẹ̀bẹ̀ fún ara wọn. Yorùbá àdánidá sì fẹ́ kí ẹni tí a ó gbà hàn níbí.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, tó sì yé àwọn òǹkàwé lónìí. ‘Wọ́n ní’ àti ‘À ń ṣègbé’ jẹ́ àdánidá, nígbà tí ‘Olúwa’ àti ‘gbà wá là’ pa ìró àti ìwọ̀n ìtumọ̀ ọ̀rọ̀ Bíbélì mọ́. A fi àmì ohùn síbi tí ó yẹ.
