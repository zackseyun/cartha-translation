id: MAT.8.31
reference: Matthew 8:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: yo
  text: Àwọn ẹ̀mí èṣù náà sì ń bẹ̀ ẹ́ léraléra[a], wọ́n ní, “Bí o bá lé wa jáde, rán wa sínú agbo ẹlẹ́dẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ń bẹ̀ ẹ́”; ọ̀rọ̀-ìṣe Gíríìkì náà lè fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: àwọn ẹ̀mí èṣù
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí àwọn ẹ̀mí búburú tí wọ́n ń bá Jésù sọ̀rọ̀, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: παρεκάλουν
  choice: ń bẹ̀ ẹ́ léraléra
  rationale: Àkókò imperfect nínú Gíríìkì ń fi ìṣe tó ń bá a lọ tàbí tó ń ṣẹlẹ̀ léraléra hàn; ọ̀rọ̀ yìí mú ìtumọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tààrà sílẹ̀, bí participle Gíríìkì ṣe ń ṣe níbí.
- source_word: Εἰ
  choice: Bí
  rationale: Ó pa ìjẹ́ ọ̀rọ̀ oní条件 mọ́, láìyí i sí ìdánilójú pé ‘níwọ̀n bí’.
- source_word: ἐκβάλλεις
  choice: lé wa jáde
  rationale: Ó túmọ̀ sí yíyọ àwọn ẹ̀mí náà kúrò níbi tí wọ́n wà, ó sì bá ọ̀rọ̀ Yorùbá tí a máa ń lò fún lílé ẹ̀mí búburú jáde mu.
- source_word: ἀπόστειλον
  choice: rán wa
  rationale: Àṣẹ tààrà fún ìgbésẹ̀ lẹ́sẹ̀kẹsẹ̀ ni; ‘rán wa’ jẹ́ kedere, ó sì jẹ́ àdánidá.
- source_word: ἀγέλην
  choice: agbo
  rationale: ‘Agbo’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àkójọpọ̀ ẹranko irú èyí.
- source_word: χοίρων
  choice: ẹlẹ́dẹ̀
  rationale: Ọ̀rọ̀ Yorùbá ìgbàlódé, tó ṣe kedere fún pigs/swine ni.
- source_word: οἱ δὲ
  choice: Àwọn ... náà sì
  rationale: ‘Sì’ ń tẹ ìtàn náà síwájú, ó sì lè fi ìyàtọ̀ kékeré hàn láìgbọ́dọ̀ mú un le ju orísun lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àwọn ẹ̀mí búburú
  choice: àwọn ẹ̀mí èṣù
  alternative: àwọn ẹ̀mí búburú
  rationale: Yíyan ‘ẹ̀mí èṣù’ pa àfihàn orísun mọ́ pé àwọn ẹ̀dá ẹ̀mí búburú olóye ni wọ́n, láìrẹ̀wẹ̀sì ohun tí ẹsẹ náà sọ tàbí fi ẹ̀kọ́ ìjọ kan kún un.
- issue: Ìtumọ̀ Εἰ nínú ọ̀rọ̀ àwọn ẹ̀mí náà
  choice: Bí o bá
  alternative: Níwọ̀n bí o ti
  rationale: ‘Bí o bá’ pa àìṣedéédé ọ̀rọ̀ oní条件 Gíríìkì mọ́, dípò kí a pinnu pé ó túmọ̀ sí ‘níwọ̀n bí’.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti ìgbàlódé, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. A lo ‘wọ́n ní’ dípò ìtumọ̀ líle ti participle kí ọ̀rọ̀ tààrà lè ṣàn dáadáa ní Yorùbá.
