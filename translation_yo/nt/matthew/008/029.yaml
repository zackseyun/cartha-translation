id: MAT.8.29
reference: Matthew 8:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: yo
  text: Wò ó, wọ́n kígbe pé, “Kí ló wà láàárín àwa àti ìwọ,[a] Ọmọ Ọlọ́run? Ṣé o wá síbí láti dá wa lóró ṣáájú àkókò tí a yàn bí?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ni o fẹ́ lọ́wọ́ wa?” Àṣà ọ̀rọ̀ náà ń fi ìyapa tàbí ìtakò hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ṣáájú àkókò náà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àkókò pàtó tí Ọlọ́run ti yàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Sì kíyèsí i
  rationale: Ó pa àmì ọ̀rọ̀ tó ń pe àfiyèsí mọ́, ó sì mú ìṣẹ̀lẹ̀ náà hàn bí ohun tó ṣẹlẹ̀ lójijì.
- source_word: ἔκραξαν λέγοντες
  choice: wọ́n kígbe pé
  rationale: ‘Kígbe’ fi ohùn líle κράζω hàn; ‘pé’ sì jẹ́ ọ̀nà Yorùbá àdánidá láti mú ọ̀rọ̀ tí wọ́n sọ wọlé láìfi àkójọpọ̀ Gíríìkì ṣe àjèjì.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Kí ló wà láàárín àwa àti ìwọ
  rationale: Ó tẹ̀lé àwòrán ọ̀rọ̀ Gíríìkì/Sẹ́mítì, ó sì pa ìtumọ̀ ìyapa tàbí ìtakò mọ́ láìdín àìpé ìtumọ̀ rẹ̀ kù.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ìtumọ̀ tààrà fún oyè tí wọ́n fi pe Jésù.
- source_word: ἦλθες ὧδε
  choice: Ṣé o wá síbí
  rationale: Ó jẹ́ Yorùbá àdánidá fún ìbéèrè tó dojú kọ́ dídé rẹ̀ sí ibẹ̀ àti ète rẹ̀.
- source_word: πρὸ καιροῦ
  choice: ṣáájú àkókò tí a yàn
  rationale: Ó fi hàn pé καιρός lè jẹ́ àkókò pàtó tí a ti pinnu, kì í ṣe àkókò lásán.
- source_word: βασανίσαι
  choice: láti dá wa lóró
  rationale: ‘Dá … lóró’ sọ ìjìyà líle tí ọ̀rọ̀ náà túmọ̀ sí ní Yorùbá òde òní láìfi kun irú ìrora ara kan pàtó.
- source_word: ἡμᾶς
  choice: wa
  rationale: Arọ́pò-orúkọ ohun tí ìṣe kàn, tó ń tọ́ka sí àwọn ẹ̀mí èṣù tó ń sọ̀rọ̀.
theological_decisions:
- issue: Bí àwọn ẹ̀mí èṣù ṣe mọ ẹni tí Jésù jẹ́
  choice: Ọmọ Ọlọ́run
  alternative: ọmọ Ọlọ́run
  rationale: Ọ̀rọ̀ náà jẹ́ oyè kírísítọ́lójì tí wọ́n fi pe Jésù ní tààrà; a kò rẹ̀ ẹ́ sílẹ̀, a kò sì túbọ̀ ṣàlàyé rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ìtumọ̀ ọjọ́ ìdájọ́ inú καιρός
  choice: àkókò tí a yàn
  alternative: àkókò náà
  rationale: Ó pa èrò pé àkókò pàtó kan wà fún ìjìyà mọ́, ṣùgbọ́n kò sọ ẹni tó yàn án tàbí ètò ẹ̀kọ́ ìgbà ìkẹyìn kan ní kíkún.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa ìbéèrè ìtakò àti ìfojúsọ́nà àkókò ìdájọ́ inú orísun mọ́.
