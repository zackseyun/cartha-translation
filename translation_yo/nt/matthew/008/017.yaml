id: MAT.8.17
reference: Matthew 8:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: yo
  text: 'kí ohun tí a ti sọ nípasẹ̀ wòlíì Aísáyà lè ṣẹ, pé:


    “Òun fúnra rẹ̀ ni ó gba àwọn àìlera wa,


    ó sì ru àwọn àrùn wa.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àìlera” tún lè túmọ̀ sí “àìlágbára” tàbí “àìsàn.” “Ó ru” túmọ̀ sí pé ó gbé wọn bí ẹni tó ru ẹrù; a tún lè sọ pé “ó gbé àwọn àrùn wa.”
    reason: Ó ṣàlàyé ìbú ìtumọ̀ ἀσθενείας àti àwòrán gbígbé ẹrù nínú ἐβάστασεν, láìyanju ìtumọ̀ ẹ̀kọ́ Ọlọ́run sí ọ̀nà kan ṣoṣo.
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: kí … lè ṣẹ
  rationale: Ó fi ète àti àbájáde hàn nínú ọ̀nà àgbékalẹ̀ Mátíù nípa ìmúṣẹ àsọtẹ́lẹ̀; ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὸ ῥηθὲν
  choice: ohun tí a ti sọ
  rationale: Ó túmọ̀ articular participle náà ní ọ̀nà tó ṣe kedere, láìfi ẹni tó sọ ọ́ kún ohun tí Gíríìkì sọ ní tààrà.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: nípasẹ̀ wòlíì Aísáyà
  rationale: “Nípasẹ̀” pa ìtumọ̀ διά pẹ̀lú genitive mọ́, pé Aísáyà ni ọ̀nà tí ọ̀rọ̀ náà gbà dé.
- source_word: λέγοντος
  choice: pé
  rationale: Ọ̀nà Yorùbá tó rọrùn láti ṣàgbéwọlé sínú ọ̀rọ̀ àyọlò ni “pé,” dípò fífi participle náà túmọ̀ ní líle.
- source_word: Αὐτὸς
  choice: Òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ἀσθενείας
  choice: àwọn àìlera
  rationale: “Àìlera” lè tọ́ka sí ailagbara tàbí àìsàn, ó sì pa ìbú lexical náà mọ́ nínú àyíká ìwòsàn.
- source_word: ἔλαβεν
  choice: gba
  rationale: “Gba” jẹ́ ìtumọ̀ tààrà fún λαμβάνω, láìfikún “mú kúrò” tàbí túmọ̀ ọ́ gẹ́gẹ́ bí “rú.”
- source_word: νόσους
  choice: àwọn àrùn
  rationale: “Àrùn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe pàtó, tó sì wọ́pọ̀ fún àìsàn tàbí disease.
- source_word: ἐβάστασεν
  choice: ru
  rationale: “Ru” túmọ̀ ìgbé ẹrù tàbí gbígbé ohun lé ara, ó sì pa agbára àwòrán βαστάζω àti ìsopọ̀ rẹ̀ mọ́ Aísáyà 53:4.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àyọlò Aísáyà 53:4 nínú àyíká iṣẹ́ ìwòsàn Jésù
  choice: “àwọn àìlera” àti “àwọn àrùn”
  alternative: “àwọn ailagbara” àti “àwọn àìsàn”; tàbí ọ̀rọ̀ tó lè tẹnumọ́ ìjìyà aṣojú sí i
  rationale: Àyíká Mátíù ń sọ nípa ìwòsàn ara, ṣùgbọ́n “àìlera” àti “ru” kò dín ìtumọ̀ àyọlò Aísáyà kù sí ẹ̀kọ́ kan ṣoṣo; wọ́n pa ìfọ̀kànbalẹ̀ àti ìfarakanra ẹ̀kọ́ Ọlọ́run inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìlà ewì ni a fi ṣètò àyọlò náà. “Wòlíì” jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá mọ̀ dáadáa fún προφήτης.
