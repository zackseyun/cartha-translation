  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ δέ mọ́, ó tún pa àsìkò ìtàn lọwọlọwọ ti λέγει mọ́ ní ọ̀nà tí Yorùbá gbà, ó sì tún ṣe eré-ọ̀rọ̀ νεκρούς ... νεκρούς láìfi ìtumọ̀ tẹ̀mí sínú ọ̀rọ̀ pàtàkì. Síbẹ̀, “Máa tọ̀ mí lẹ́yìn” lè fún ἀκολούθει ní ìtumọ̀ ìṣe tí ń bá a lọ ju bí àṣẹ taara náà ṣe nílò lọ; “Tẹ̀lé mi” jẹ́ ìbámu taara, àdánidá, àti ọ̀rọ̀ ìjẹ́ ọmọ-ẹ̀yìn tó wọ́pọ̀.
