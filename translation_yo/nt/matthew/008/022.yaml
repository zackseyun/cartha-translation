id: MAT.8.22
reference: Matthew 8:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù wí fún un pé, “Tẹ̀lé mi, kí o sì fi àwọn òkú sílẹ̀ láti sin àwọn òkú tiwọn.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọ̀pọ̀ ènìyàn máa ń lóye “àwọn òkú” àkọ́kọ́ ní ọ̀nà àfiwé: àwọn tí kò dáhùn sí Ọlọ́run nípa tẹ̀mí lè sin àwọn tí ó ti kú nípa ara.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ oníwọ̀nba hàn sí ohun tí ọkùnrin náà ṣẹ̀ṣẹ̀ béèrè, láìsọ ìyàtọ̀ náà di líle ju ti Gíríìkì lọ.
- source_word: λέγει
  choice: wí
  rationale: Ìṣe ọ̀rọ̀ ìtàn yìí jẹ́ present tense ní Gíríìkì; ‘wí’ jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún ìtàn Bíbélì ní Yorùbá, ó sì lè gbé ìmúrasílẹ̀ ìṣẹ̀lẹ̀ náà jáde láìfi àmì àsìkò tí kò pọndandan kún un.
- source_word: Ἀκολούθει μοι
  choice: Máa tọ̀ mí lẹ́yìn
  rationale: Àṣẹ onítẹ̀síwájú yìí sọ ìtẹ̀lé Jesu ní ti ìrìn àti ní ti jíjẹ́ ọmọ-ẹ̀yìn; ‘máa tọ̀ mí lẹ́yìn’ jẹ́ Yorùbá àdánidá tó pa àwọn méjèèjì mọ́.
- source_word: ἄφες
  choice: fi ... sílẹ̀
  rationale: Ó túmọ̀ sí kí ẹni náà jáwọ́ nínú ṣíṣe ojúṣe náà fúnra rẹ̀ tàbí kí ó fi í sí ọwọ́ àwọn ẹlòmíràn; ọ̀rọ̀ yìí lágbára ju ‘jẹ́ kí’ tí ó lè dà bí fífúnni láṣẹ lọ.
- source_word: νεκρούς ... νεκρούς
  choice: àwọn òkú ... àwọn òkú
  rationale: A pa ọ̀rọ̀ kan náà mọ́ ní ìgbà méjèèjì bí ó ti rí ní Gíríìkì, kí eré-ọ̀rọ̀ àti ìforígbárí ìtumọ̀ rẹ̀ má bàa sọnù.
- source_word: θάψαι
  choice: láti sin
  rationale: ‘Sin òkú’ ni gbólóhùn Yorùbá àdánidá fún fífi òkú sí ibojì; ‘láti’ tún fi ìbáṣepọ̀ infinitive náà hàn kedere.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: àwọn òkú tiwọn fúnra wọn
  rationale: ‘Tiwọn fúnra wọn’ pa ìtẹnumọ́ reflexive ἑαυτῶν mọ́ ju ‘àwọn òkú wọn’ nìkan lọ.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn òkú’ nínú ọ̀rọ̀ Jesu
  choice: Ọ̀rọ̀ àkọ́kọ́ pa ‘àwọn òkú ... àwọn òkú tiwọn fúnra wọn’ mọ́ láìfi ‘nípa tẹ̀mí’ kún un.
  alternative: A lè lóye ‘àwọn òkú’ àkọ́kọ́ gẹ́gẹ́ bí àwọn tí kò dáhùn sí Jesu nípa tẹ̀mí, èkejì sì gẹ́gẹ́ bí àwọn tí ara wọn ti kú.
  rationale: Gíríìkì lo νεκρούς kan náà ní ibi méjèèjì. Ṣíṣe àlàyé àfiwé náà nínú ọ̀rọ̀ pàtàkì yóò yanjú ìforígbárí tí Jesu mọ̀ọ́mọ̀ fi sílẹ̀; àlàyé ìsàlẹ̀ ojú ìwé ló yẹ fún ìtumọ̀ tí ó ṣeé ṣe yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa àṣẹ líle àti eré-ọ̀rọ̀ Jesu mọ́.
