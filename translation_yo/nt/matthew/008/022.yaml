  terminology: “Sin òkú” jẹ́ ọ̀rọ̀ Yorùbá tó dára fún θάψαι. A fi “àwọn òkú” kan náà sí ibi méjèèjì, èyí tó yẹ kí ìforígbárí ọ̀rọ̀ náà wà. Àlàyé ìsàlẹ̀ ojú ìwé yẹ, ṣùgbọ́n a ti mú un sun mọ́ ìtumọ̀ Gíríìkì nípa ṣíṣàlàyé pé ìtumọ̀ àfiwé jẹ́ ìfẹ̀sẹ̀mulẹ̀ kan, kì í ṣe ìtumọ̀ tí a fi dandan mú.
