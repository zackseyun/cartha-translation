id: MAT.8.8
reference: Matthew 8:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: yo
  text: Ọ̀gágun tó ń darí ọgọ́rùn-ún ọmọ ogun náà sì dáhùn pé, “Olúwa, èmi kò yẹ kí o wọ abẹ́ òrùlé mi. Ṣùgbọ́n sọ ọ̀rọ̀ kan ṣoṣo[a], a ó sì wo ìránṣẹ́ mi[b] sàn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sọ ọ̀rọ̀ náà.” Ní tààràtà, Gíríìkì náà ní “sọ ọ̀rọ̀ kan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ọmọkùnrin mi” tàbí “ọmọ mi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọmọ, ọ̀dọ́mọkùnrin, tàbí ìránṣẹ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: dáhùn pé
  rationale: Àpapọ̀ ọ̀rọ̀ méjèèjì jẹ́ ọ̀nà ìtàn Gíríìkì fún fífi èsì ọ̀rọ̀ hàn; “dáhùn pé” jẹ́ Yorùbá àdánidá tí kò tún ìtumọ̀ kan náà sọ lẹ́ẹ̀mejì.
- source_word: ἑκατόνταρχος
  choice: ọ̀gágun ọgọ́rùn-ún ọmọ ogun
  rationale: Ó ṣàlàyé ipò olórí ọmọ ogun tí ó ń darí nǹkan bí ọgọ́rùn-ún ènìyàn, ní èdè tí òǹkàwé Yorùbá òde òní lè lóye láìsí dandan pé kí ó mọ ọ̀rọ̀ àkọ́lé Róòmù.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ ọ̀wọ̀ àti agbára κύριος mọ́, ó sì fi àyè sílẹ̀ fún ìjẹ́pàtàkì rẹ̀ nípa ẹni tí Jésù jẹ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἱκανὸς
  choice: yẹ
  rationale: Nínú gbólóhùn yìí, ọ̀rọ̀ náà ń tọ́ka sí yíyẹ tàbí jíjẹ́ ẹni tí ó tó fún irú ọlá bẹ́ẹ̀, kì í ṣe agbára láti ṣe ohun kan.
- source_word: ὑπὸ τὴν στέγην
  choice: abẹ́ òrùlé mi
  rationale: Èyí pa àwòrán gidi inú Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere fún wíwọ ilé ẹni.
- source_word: εἰπὲ λόγῳ
  choice: sọ ọ̀rọ̀ kan ṣoṣo
  rationale: Ó fi hàn pé ọ̀rọ̀ tí Jésù sọ nìkan ni a nílò; àlàyé ìsàlẹ̀ ojú ìwé pa ọ̀nà míì tí a lè gbà túmọ̀ rẹ̀ mọ́.
- source_word: ἰαθήσεται
  choice: a ó … wò … sàn
  rationale: Ìkọ̀ Yorùbá aláṣèyọrí tí a kò dárúkọ olùṣe rẹ̀ mú ìṣe ìwòsàn tó wà nínú ọ̀rọ̀ Gíríìkì jáde láìfi ẹni tí ó ṣe é kún ẹsẹ náà.
- source_word: παῖς
  choice: ìránṣẹ́
  rationale: Ipò ọ̀gágun náà àti ìtàn tó yí ẹsẹ náà ká ṣe àtìlẹ́yìn fún “ìránṣẹ́,” ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ “ọmọkùnrin” tàbí “ọmọ” mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí a fi ń pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa mejeeji ọ̀wọ̀ tí ọ̀gágun ń fi hàn àti ìtumọ̀ tó lè jinlẹ̀ sí i nípa Jésù mọ́; “Ọ̀gá” lè dín ìtumọ̀ náà kù sí ọ̀wọ̀ láwùjọ nìkan.
- issue: Ìtumọ̀ παῖς
  choice: ìránṣẹ́
  alternative: ọmọkùnrin tàbí ọmọ
  rationale: “Ìránṣẹ́” bá ipò àwùjọ àti àyíká ìtàn mu jù, ṣùgbọ́n ọ̀rọ̀ Gíríìkì ní ìtumọ̀ tó gbòòrò; nítorí náà a kò pa àwọn ìtumọ̀ mìíràn rẹ́, a fi wọ́n sínú àlàyé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ọ̀wọ̀, àdánidá, àti òde òní. A lo “ọ̀gágun ọgọ́rùn-ún ọmọ ogun” dípò àkọ́lé àjèjì kí ipò ẹni náà lè yé òǹkàwé lẹ́sẹ̀kẹsẹ̀; “abẹ́ òrùlé mi” sì pa àwòrán orísun mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
