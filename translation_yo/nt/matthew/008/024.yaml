id: MAT.8.24
reference: Matthew 8:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: yo
  text: Sì wò ó, ìjì líle kan[a] dìde lórí òkun, débi tí àwọn ìgbì fi ń bò ọkọ̀ náà mọ́lẹ̀[b]; ṣùgbọ́n òun ń sùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì σεισμός sábà máa ń túmọ̀ sí ‘ìmìtìtì ilẹ̀’ tàbí ‘ìmìtìtì’; níbí, àyíká ọ̀rọ̀ fi hàn pé ó ń tọ́ka sí ìjì líle lórí òkun.
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: ‘àwọn ìgbì ń bo ọkọ̀ náà.’'
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ó pa agbára ọ̀rọ̀ ìtọ́ka tí ń pe olùgbọ́ láti fiyè sí ìṣẹ̀lẹ̀ òjijì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye.
- source_word: σεισμὸς μέγας
  choice: ìjì líle kan
  rationale: Bí ó tilẹ̀ jẹ́ pé σεισμός sábà máa ń túmọ̀ sí ìmìtìtì ilẹ̀ tàbí ìmìtìtì, àyíká ọ̀rọ̀ nípa òkun, ọkọ̀ àti ìgbì fi hàn pé ìjì líle lórí omi ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ἐγένετο
  choice: dìde
  rationale: ‘Dìde’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìjì bẹ̀rẹ̀ tàbí ṣẹlẹ̀.
- source_word: ἐν τῇ θαλάσσῃ
  choice: lórí òkun
  rationale: Ó pa ọ̀rọ̀ orísun fún ‘òkun’ mọ́, ó sì fi ibi tí ìṣẹ̀lẹ̀ náà ti wáyé hàn lọ́nà àdánidá.
- source_word: ὥστε
  choice: débi tí ... fi
  rationale: Ìṣètò yìí fi àbájáde agbára ìjì náà hàn kedere ní Yorùbá.
- source_word: τὸ πλοῖον
  choice: ọkọ̀ náà
  rationale: ‘Ọkọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ọkọ̀ ojú omi inú ìtàn yìí láìsọ pé ọkọ̀ ńlá ni.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: àwọn ìgbì ... ń bò ọkọ̀ náà mọ́lẹ̀
  rationale: A yí gbólóhùn àìṣe Gíríìkì padà sí gbólóhùn olùṣe tí ó bá èdè Yorùbá mu, nígbà tí a ṣì pa ìṣe tó ń lọ lọ́wọ́ àti ìtumọ̀ ‘bo mọ́lẹ̀’ mọ́.
- source_word: αὐτὸς δὲ
  choice: ṣùgbọ́n òun
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ tó wà láàárín ewu ìjì àti ohun tí Jesu ń ṣe jáde, ‘òun’ sì pa ìtẹnumọ́ arọ́pò-orúkọ náà mọ́.
- source_word: ἐκάθευδεν
  choice: ń sùn
  rationale: Àmì ìṣe tó ń lọ lọ́wọ́ yìí bá àkókò imperfect Gíríìkì mu.
theological_decisions:
- issue: Irú ìṣẹ̀lẹ̀ tí σεισμός ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ‘ìjì líle’ ní ìbámu pẹ̀lú àyíká ọ̀rọ̀.
  alternative: ‘Ìmìtìtì ilẹ̀ ńlá’ tàbí ‘ìmìtìtì ńlá.’
  rationale: Ìpinnu ọ̀rọ̀ àti àyíká ni èyí, kì í ṣe ìpinnu ẹ̀kọ́ ìgbàgbọ́. Àwọn àwòrán òkun, ọkọ̀ àti ìgbì fi hàn pé ìrúkèrúdò líle lórí omi ni ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Sì wò ó’ pa ìkìlọ̀ alárinrin ἰδοὺ mọ́; ‘débi tí ... fi’ àti gbólóhùn olùṣe jẹ́ àdánidá sí etí olùkà Yorùbá.
