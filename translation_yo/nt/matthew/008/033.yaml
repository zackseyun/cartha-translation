  naturalness: The Yorùbá is generally clear and dignified. A coordinated narrative sequence is more natural here than the arrival-focused temporal clause, and using “àti” better reflects the Greek coordination.
  terminology: “Àwọn olùṣọ́ ẹlẹ́dẹ̀” is natural for the tenders of the pigs. “Àwọn ọkùnrin tí àwọn ẹ̀mí èṣù ń ṣàkóso” communicates the Gospel context without imposing a technical doctrinal distinction. The supplied “ọkùnrin” is supported by the immediate context.
  issues:
  - severity: medium
    issue: “Nígbà tí wọ́n dé inú ìlú” renders arrival rather than the act of going into the city.
    rationale: ἀπελθόντες εἰς τὴν πόλιν denotes going away/to the city; arrival is a plausible consequence but is not the action stated.
  - severity: low
    issue: “títí kan” weakens the explicit additive force of καὶ.
    rationale: The Greek says that they reported all things and also the matters concerning the demon-possessed men. “Àti” preserves this coordination more directly while allowing the contextual paraphrase in the main text.
