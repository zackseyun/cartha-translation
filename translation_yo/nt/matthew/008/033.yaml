id: MAT.8.33
reference: Matthew 8:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: yo
  text: Àwọn olùṣọ́ ẹlẹ́dẹ̀ náà sì sá lọ, wọ́n lọ sí ìlú, wọ́n sì ròyìn ohun gbogbo àti ohun tó ṣẹlẹ̀ sí àwọn ọkùnrin tí àwọn ẹ̀mí èṣù ń ṣàkóso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gangan, “àti àwọn ọ̀ràn nípa àwọn ọkùnrin tí àwọn ẹ̀mí èṣù ń ṣàkóso.”
    reason: 'Gíríìkì náà ní ọ̀rọ̀ kúkúrú kan: “àti àwọn ohun nípa àwọn tí àwọn ẹ̀mí èṣù ń ṣàkóso”; kò sọ ní tààrà pé ohun tó ṣẹlẹ̀ sí wọn.'
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Àwọn olùṣọ́ ẹlẹ́dẹ̀ náà sì
  rationale: Participle βόσκοντες refers to those tending the pigs in the immediate context. “Àwọn olùṣọ́ ẹlẹ́dẹ̀” is concise and natural Yoruba; “sì” carries the narrative connective δέ.
- source_word: ἔφυγον
  choice: sá lọ
  rationale: This directly and vividly expresses fleeing rather than merely departing.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: Nígbà tí wọ́n dé inú ìlú
  rationale: The aorist participle is naturally expressed as a temporal clause in Yoruba. “Inú ìlú” reflects movement into the town, while “dé” presents their arrival before the report without adding a new event of substance.
- source_word: ἀπήγγειλαν πάντα
  choice: wọ́n ròyìn ohun gbogbo
  rationale: “Ròyìn” naturally conveys reporting news, and “ohun gbogbo” preserves the comprehensive force of πάντα.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: títí kan ohun tó ṣẹlẹ̀ sí àwọn ọkùnrin tí àwọn ẹ̀mí èṣù ń ṣàkóso
  rationale: The elliptical Greek phrase means the matters concerning the demon-afflicted people. The main text conveys its contextual sense naturally, while the footnote preserves the more formally corresponding alternative. “Àwọn ọkùnrin” is supplied from Matthew’s immediate context, where two men are in view.
- source_word: δαιμονιζομένων
  choice: tí àwọn ẹ̀mí èṣù ń ṣàkóso
  rationale: This communicates that the men were under demonic power without imposing a technical Yoruba label or speculative distinctions absent from the Greek.
theological_decisions:
- issue: How to render δαιμονιζομένων without importing a later technical doctrine of possession
  choice: àwọn ọkùnrin tí àwọn ẹ̀mí èṣù ń ṣàkóso
  alternative: àwọn ọkùnrin tí àwọn ẹ̀mí èṣù ń dá lóró
  rationale: “Ń ṣàkóso” preserves the strong sense of demonic control in the narrative, while avoiding claims about the precise mechanism or degree of indwelling. The alternative may sound like general harassment and thus understate the context.
- issue: Interpretation of the elliptical phrase καὶ τὰ τῶν δαιμονιζομένων
  choice: títí kan ohun tó ṣẹlẹ̀ sí àwọn ọkùnrin…
  alternative: àti àwọn ọ̀ràn nípa àwọn ọkùnrin…
  rationale: The main reading gives the likely contextual meaning but does not erase the source phrase’s broader ambiguity, since the literal alternative is retained in a footnote.
translation_notes:
  register: Standard, current, dignified Yorùbá with full tone marks. The verse uses familiar narrative vocabulary and avoids both archaic phrasing and specialized theological terminology.
