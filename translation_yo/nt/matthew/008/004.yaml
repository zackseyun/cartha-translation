id: MAT.8.4
reference: Matthew 8:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: yo
  text: Jésù sì wí fún un pé, “Ṣọ́ra, má sọ fún ẹnikẹ́ni; ṣùgbọ́n lọ, fi ara rẹ hàn àlùfáà, kí o sì rú ọrẹ tí Mósè pàṣẹ[a], gẹ́gẹ́ bí ẹ̀rí fún wọn.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àṣẹ yìí tẹ̀ lé ìlànà Mósè fún ẹni tí a ti wẹ̀ mọ́ kúrò nínú àrùn ẹ̀tẹ̀; wo Léfítíkù 14.
    reason: cross_reference
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “fún ẹ̀rí fún wọn.” Ó ṣeé ṣe kí ó tọ́ka sí ẹ̀rí tí a gbé kalẹ̀ fún àwọn àlùfáà; àwọn kan sì lóye rẹ̀ gẹ́gẹ́ bí ẹ̀rí lòdì sí àwọn tí kò gbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Kíyèsí i
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ ìkìlọ̀ tàbí ìtọ́ni pàtàkì ní àyíká yìí; “Kíyèsí i” mú agbára rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: μηδενὶ εἴπῃς
  choice: má sọ fún ẹnikẹ́ni
  rationale: Ó pa ìfòfindè náà àti ẹni tí a kò gbọdọ̀ sọ fún mọ́ ní ṣókí, Yorùbá tí ó ṣe kedere.
- source_word: ὕπαγε
  choice: lọ
  rationale: Èyí ni ìtumọ̀ àṣẹ ìrìn tí ó rọrùn, tí ó sì bá Yorùbá òde òní mu.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: fi ara rẹ hàn àlùfáà
  rationale: Ó pa ìtumọ̀ reflexive náà mọ́, ó sì tọ́ka sí àyẹ̀wò àlùfáà láìfi àlàyé kún ọ̀rọ̀.
- source_word: ἱερεῖ
  choice: àlùfáà
  rationale: Nínú àyíká òfin Mósè, ó ń tọ́ka sí àlùfáà tó yẹ fún iṣẹ́ náà; Yorùbá kò nílò àmì ìdánimọ̀ bí article Gíríìkì.
- source_word: προσένεγκον τὸ δῶρον
  choice: rú ọrẹ
  rationale: “Rú” fi àyíká ìjọsìn hàn, “ọrẹ” sì pa ìtumọ̀ δῶρον gẹ́gẹ́ bí ohun tí a mú wá fún Ọlọ́run mọ́.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: tí Mósè pàṣẹ
  rationale: Ó sọ àṣẹ Mósè ní tààrà, láìyí agbára ọ̀rọ̀ προστάσσω padà.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: láti jẹ́ ẹ̀rí fún wọn
  rationale: “Láti jẹ́” fi ète tàbí àbájáde hàn, “ẹ̀rí” sì pa ìtumọ̀ μαρτύριον mọ́ láìsọ pé ó jẹ́ ẹ̀rí rere tàbí ẹ̀rí lòdì sí wọn.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésù sì wí fún un
  rationale: A tú historical present náà sí ọ̀nà ìtàn Yorùbá; “sì” so ọ̀rọ̀ yìí mọ́ ohun tó ṣáájú.
theological_decisions:
- issue: Ẹni tí “wọn” ń tọ́ka sí àti irú ẹ̀rí tí a ní lọ́kàn
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “láti jẹ́ ẹ̀rí fún wọn,” láìdárúkọ ẹni tí “wọn” jẹ́ tàbí sọ pé ẹ̀rí náà lòdì sí wọn.
  alternative: “gẹ́gẹ́ bí ẹ̀rí fún àwọn àlùfáà” tàbí “gẹ́gẹ́ bí ẹ̀rí lòdì sí wọn”
  rationale: αὐτοῖς kò sọ ẹni tí ó ń tọ́ka sí ní kedere, μαρτύριον sì lè túmọ̀ sí ẹ̀rí ní ọ̀nà gbòòrò. Ìtumọ̀ yìí pa àìdánilójú tó wà nínú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwọ̀n ọ̀rọ̀ ìjọsìn bí “àlùfáà” àti “rú ọrẹ” mọ́.
