revisions:
- from: Jésù sì wí fún un pé, “Kíyèsí i, má sọ fún ẹnikẹ́ni; ṣùgbọ́n lọ, fi ara rẹ hàn àlùfáà, kí o sì rú ọrẹ tí Mósè pàṣẹ[a], láti jẹ́ ẹ̀rí fún wọn.[b]”
  to: Jésù sì wí fún un pé, “Ṣọ́ra, má sọ fún ẹnikẹ́ni; ṣùgbọ́n lọ, fi ara rẹ hàn àlùfáà, kí o sì rú ọrẹ tí Mósè pàṣẹ[a], gẹ́gẹ́ bí ẹ̀rí fún wọn.[b]”
  rationale: The revision replaces an awkward warning expression with idiomatic Yoruba and makes the testimonial phrase more direct. It retains the source text’s commands, cultic setting, and ambiguity concerning whom “wọn” denotes and whether the testimony is favorable or adverse. Footnote anchors remain attached to the Mosaic offering and the testimony phrase respectively.
