id: MAT.8.27
reference: Matthew 8:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: yo
  text: Àwọn ọkùnrin náà sì yà á lẹ́nu, wọ́n ní, “Irú ẹni wo ni èyí[a], tí àwọn ẹ̀fúùfù àti òkun pàápàá ń ṣègbọràn sí i?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Irú ọkùnrin wo ni èyí?” Ọ̀rọ̀ Gíríìkì náà béèrè nípa irú tàbí ànímọ́ ẹni tí ó jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: àwọn ọkùnrin náà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí àwọn ọkùnrin tó wà nínú ọkọ̀ ojú omi. ‘Àwọn ọkùnrin náà’ jẹ́ pàtó, ó sì bójú mu ju ọ̀rọ̀ gbogbogbò bí ‘àwọn ènìyàn’ lọ.
- source_word: ἐθαύμασαν
  choice: ẹnu yà … wọ́n
  rationale: Gbólóhùn Yorùbá yìí sọ ìyàlẹ́nu àti ìṣẹ̀lẹ̀ tí ó mú wọn ṣe kàyéfì ní ọ̀nà àdánidá, ó sì bá ìṣe aláìpẹ́jú tí aorist náà ń sọ mu.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Èyí ni ọ̀nà ìtàn Yorùbá tó rọrùn, tó sì ṣàfihàn pé ọ̀rọ̀ wọn tẹ̀ lé ìyàlẹ́nu wọn lẹ́sẹ̀kẹsẹ̀.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Irú ẹni wo ni èyí
  rationale: Ποταπός béèrè nípa irú tàbí ànímọ́ ẹni náà. ‘Irú ẹni wo ni èyí’ pa ìbéèrè oníyàlẹ́nu náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: àwọn ẹ̀fúùfù àti òkun pàápàá
  rationale: '‘Pàápàá’ mú ìtẹnumọ́ καί jáde ní Yorùbá àdánidá: kì í ṣe ohun míì nìkan, ṣùgbọ́n àwọn agbára ìṣẹ̀dá wọ̀nyí pàápàá.'
- source_word: αὐτῷ ὑπακούουσιν
  choice: ń gbọ́ tirẹ̀
  rationale: ‘Gbọ́ tirẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń ṣègbọràn sí i, ó sì pa àṣẹ ara ẹni tí ὑπακούω ní mọ́.
theological_decisions:
- issue: Agbára ìbéèrè náà nípa ẹni tí Jésù jẹ́
  choice: A fi ìbéèrè náà sílẹ̀ gẹ́gẹ́ bí ìbéèrè oníyàlẹ́nu, nígbà tí a tún pa ìtumọ̀ pé Jésù ní àṣẹ lórí ìṣẹ̀dá mọ́.
  alternative: Láti mú ìtumọ̀ náà ṣe kedere sí i pẹ̀lú ọ̀rọ̀ bí ‘Irú ọkùnrin wo ló lè jẹ́?’ tàbí láti sọ ọ́ di ìyàlẹ́nu lásán nípa iṣẹ́ ìyanu kan.
  rationale: Ẹsẹ náà ń tọ́ka sí ọlá àti àṣẹ Jésù, ṣùgbọ́n kò sọ ìpinnu ẹ̀kọ́ ìgbàgbọ́ náà ní gbangba. Ìtumọ̀ yìí pa ìfọkànsìn Kristológì àti àìdánilójú ìtàn náà mọ́ láìyanjú rẹ̀ fún òǹkàwé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún òǹkàwé lásán. ‘Ẹnu yà wọ́n’ àti ‘gbọ́ tirẹ̀’ jẹ́ àwọn gbólóhùn àdánidá; àmì ohùn sì wà níbi tí wọ́n ti yẹ.
