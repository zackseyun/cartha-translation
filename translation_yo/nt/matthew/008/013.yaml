id: MAT.8.13
reference: Matthew 8:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: yo
  text: Jésù sì sọ fún balógun ọgọ́rùn-ún náà pé, “Lọ; gẹ́gẹ́ bí o ti gbàgbọ́, kí ó rí bẹ́ẹ̀ fún ọ.” Ìránṣẹ́[a] náà sì sàn ní wákàtí náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọkùnrin” tàbí “ọmọ.” Ọ̀rọ̀ Gíríìkì παῖς lè tọ́ka sí ìránṣẹ́ tàbí sí ọ̀dọ́ ènìyàn. Nínú àyíká ọ̀rọ̀ yìí, “ìránṣẹ́” bá ẹni tí ó wà lábẹ́ àṣẹ balógun náà mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: balógun ọ̀rún
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún ọ̀gágun Róòmù kan tí ó máa ń ṣàkóso nǹkan bí ọmọ ogun ọgọ́rùn-ún.
- source_word: Ὕπαγε
  choice: Lọ
  rationale: Àṣẹ ṣókí àti tààrà ni ọ̀rọ̀ Gíríìkì náà; “Lọ” sì mú un jáde ní Yorùbá àdánidá láìfi àlàyé kún un.
- source_word: ὡς ἐπίστευσας
  choice: gẹ́gẹ́ bí o ti gbàgbọ́
  rationale: Ó pa ìṣe ẹni náà fúnra rẹ̀ mọ́, ó sì fi ìbátan tí ὡς dá sílẹ̀ hàn láìyí i sí ọ̀rọ̀-orúkọ “ìgbàgbọ́.”
- source_word: γενηθήτω σοι
  choice: kí ó rí fún ọ
  rationale: Èyí fi agbára àṣẹ tàbí ìfẹ́ inú ọ̀rọ̀-ìṣe Gíríìkì náà hàn ní Yorùbá tí ó ṣe déédé, láìsọ ohun tí yóò ṣẹlẹ̀ ní pàtó sí i.
- source_word: παῖς
  choice: ìránṣẹ́
  rationale: Àyíká ọ̀rọ̀ fi ẹni tí ó wà lábẹ́ àṣẹ balógun hàn, nítorí náà “ìránṣẹ́” bá a mu jù; ṣùgbọ́n a pa ìtumọ̀ “ọmọkùnrin” tàbí “ọmọ” mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἰάθη
  choice: sàn
  rationale: “Sàn” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ara ẹni tí ó ń ṣàìsàn padà bọ̀ sípò; ó bá ìṣe àìṣe-aláṣẹ Gíríìkì náà mu ní ìtumọ̀.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: ní wákàtí náà
  rationale: Ó tẹ̀ lé gbólóhùn àkókò Gíríìkì náà pẹ́kípẹ́kí, kò sì fi “ní ìṣẹ́jú náà gan-an” kún un, èyí tí yóò túmọ̀ rẹ̀ ju ohun tí ọ̀rọ̀ náà sọ lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ èdè πιστεύω/πίστις
  choice: gbàgbọ́
  alternative: gbẹ́kẹ̀ lé; ní ìgbàgbọ́
  rationale: “Gbàgbọ́” jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀, ó sì pa bí ọ̀rọ̀ Gíríìkì ṣe jẹ́ ọ̀rọ̀-ìṣe mọ́. Kò yí i sí gbólóhùn ọ̀rọ̀-orúkọ tí ó lè fi ìtumọ̀ ẹ̀kọ́ kan lé e lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé lásán. Gbólóhùn náà jẹ́ ṣókí bí ti orísun Gíríìkì, a sì fi àmì ohùn sí ibi tí ó yẹ. A so àmì àlàyé [a] mọ́ “ìránṣẹ́,” nítorí παῖς ni àlàyé náà ń ṣàlàyé.
