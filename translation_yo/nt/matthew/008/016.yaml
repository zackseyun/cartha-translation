id: MAT.8.16
reference: Matthew 8:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: yo
  text: Nígbà tí ìrọ̀lẹ́ dé, wọ́n mú ọ̀pọ̀ àwọn tí ẹ̀mí èṣù ń ṣe wá sọ́dọ̀ rẹ̀. Ó sì lé àwọn ẹ̀mí náà jáde pẹ̀lú ọ̀rọ̀ kan, ó sì wo gbogbo àwọn aláìsàn sàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Nígbà tí ó di alẹ́
  rationale: Èyí tú ìtumọ̀ gbólóhùn genitive absolute tó ń tọ́ka sí àkókò jáde ní Yorùbá àdánidá.
- source_word: προσήνεγκαν αὐτῷ
  choice: wọ́n mú ... wá sọ́dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n mú àwọn ènìyàn náà wá sí ọ̀dọ̀ Jésù; ìṣètò ọ̀rọ̀ Yorùbá yìí ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: δαιμονιζομένους πολλούς
  choice: ọ̀pọ̀ àwọn tí ẹ̀mí èṣù ń ṣe
  rationale: Ọ̀nà ìsọ̀rọ̀ Yorùbá yìí ṣàpèjúwe àwọn ènìyàn tí ó wà lábẹ́ agbára tàbí ìdarí ẹ̀mí èṣù, láìsọ ìtumọ̀ Gíríìkì di ẹ̀kọ́ pàtó ju bí ó ti rí lọ.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: ó ... lé àwọn ẹ̀mí náà jáde
  rationale: ‘Lé ... jáde’ bá agbára ìṣe ἐκβάλλω mu, ‘àwọn ẹ̀mí’ sì tẹ̀ lé ohun tí ọ̀rọ̀ Gíríìkì sọ ní tààrà.
- source_word: λόγῳ
  choice: fi ọ̀rọ̀ kan
  rationale: Èyí pa dative ohun èlò mọ́, ó sì tẹnu mọ́ pé ọ̀rọ̀ kan ṣoṣo ni Jésù fi lé wọn jáde, láìfi ‘tirẹ̀’ kún ohun tí Gíríìkì kò sọ ní gbangba.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: gbogbo àwọn aláìsàn
  rationale: Gbólóhùn Gíríìkì jẹ́ àkànlò èdè fún àwọn tí ara wọn kò yá; ‘àwọn aláìsàn’ ṣe kedere, ó sì bá àyíká ìwòsàn mu.
- source_word: ἐθεράπευσεν
  choice: wo ... sàn
  rationale: ‘Wo ... sàn’ ni ọ̀nà Yorùbá àdánidá fún θεραπεύω nínú ìtàn ìwòsàn.
theological_decisions:
- issue: Ìtumọ̀ δαιμονιζομένους àti τὰ πνεύματα
  choice: Pa ìyàtọ̀ tó wà láàárín àwọn tí ẹ̀mí èṣù ń ṣe àti àwọn aláìsàn mọ́.
  alternative: Kí a tú gbogbo wọn sí àwọn tó ní àìsàn ọpọlọ tàbí àwọn tó ń ṣàìsàn.
  rationale: Ẹsẹ náà fúnra rẹ̀ ya lílé àwọn ẹ̀mí jáde sọ́tọ̀ sí wíwo àwọn aláìsàn sàn. Ìtumọ̀ náà kò gbọdọ̀ sọ ẹ̀ka méjèèjì di ohun kan tàbí fi àlàyé ìṣègùn òde òní rọ́pò èrò inú ọ̀rọ̀ náà.
- issue: Agbára λόγῳ gẹ́gẹ́ bí ohun èlò
  choice: fi ọ̀rọ̀ kan
  alternative: nípa sísọ̀rọ̀; fi ọ̀rọ̀ tirẹ̀
  rationale: Èyí fi ọlá-àṣẹ àṣẹ Jésù hàn láìfi èrò ẹ̀kọ́ míì kún ọ̀rọ̀ orísun.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi àmì ohùn sí ibi tí ó yẹ. ‘Ẹ̀mí èṣù ń ṣe’ jẹ́ àkànlò èdè Yorùbá tó ṣókí; àlàyé ìsàlẹ̀ ojú ewé sì pa ìwọ̀n ìtumọ̀ participle Gíríìkì mọ́.
