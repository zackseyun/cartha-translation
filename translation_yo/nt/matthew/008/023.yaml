source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: yo
  text: Nígbà tí ó wọ inú ọkọ̀ ojú omi kan[a], àwọn ọmọ-ẹ̀yìn rẹ̀ sì tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkọ̀ ojú omi náà.” Gíríìkì sọ “ọkọ̀ ojú omi” láìsí àmì-ìtọ́ka; nítorí náà, ó lè túmọ̀ sí ọkọ̀ kan tàbí ọkọ̀ tí àyíká ìtàn ń tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: Nígbà tí ó ... wọ inú
  rationale: Aorist participle náà ń fi ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn. Gbólóhùn àkókò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ àwọn ìṣe méjèèjì mọ́ láìfi dandan pinnu pé ìtẹ̀lé náà bẹ̀rẹ̀ lẹ́yìn tí ó ti wọ ọkọ̀ tán pátápátá.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi náà
  rationale: Nínú àyíká Òkun Galili, “ọkọ̀ ojú omi” ṣe kedere ju “ọkọ̀” nìkan lọ. Bí ó tilẹ̀ jẹ́ pé kò sí article ní Gíríìkì, àyíká ìtàn lè tọ́ka sí ọkọ̀ kan pàtó; àlàyé ìsàlẹ̀ fi “ọkọ̀ ojú omi kan” sílẹ̀ gẹ́gẹ́ bí òmíràn.
- source_word: ἠκολούθησαν
  choice: tẹ̀ lé
  rationale: “Tẹ̀ lé” sọ ìrìn lílépa Jésù nínú ìṣẹ̀lẹ̀ náà, ó sì tún pa ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn tí ἀκολουθέω lè ní nínú Mátíù mọ́ láìṣàlàyé rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àwọn tí wọ́n ń kọ́ lábẹ́ olùkọ́ tí wọ́n sì ń tẹ̀ lé e, ó sì bá ìlò ọ̀rọ̀ náà nínú àwọn Ìhìn Rere mu.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: ó ... e ... rẹ̀
  rationale: Àwọn arọ́pò-orúkọ náà tọ́ka sí Jésù ní àyíká yìí. Yorùbá ń lo “ó” gẹ́gẹ́ bí olùṣe nínú gbólóhùn àkókò, “e” lẹ́yìn “lé,” àti “rẹ̀” fún ìní.
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn tó lè wà nínú ἀκολουθέω
  choice: tẹ̀ lé e
  alternative: bá a lọ / di ọmọlẹ́yìn rẹ̀
  rationale: Ẹsẹ náà ń ṣàpèjúwe ìrìn gidi, ṣùgbọ́n “tẹ̀ lé” tún lè mú ìtumọ̀ jíjẹ́ ọmọ-ẹ̀yìn dání. A kò yí i sí “di ọmọlẹ́yìn” nítorí ìyẹn yóò sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà di pàtó ju Gíríìkì lọ.
translation_notes:
  register: Yorùbá boṣewa, títẹ ohùn kíkún, pẹ̀lú èdè ìtàn tó mọ́, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. “Nígbà tí ...” mú participle Gíríìkì wá sí Yorùbá àdánidá; “ọkọ̀ ojú omi” yà vessel omi sọ́tọ̀ kedere.
