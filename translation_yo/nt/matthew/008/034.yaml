id: MAT.8.34
reference: Matthew 8:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: yo
  text: Wò ó! Gbogbo ìlú náà jáde lọ pàdé Jésù; nígbà tí wọ́n rí i, wọ́n bẹ̀ ẹ́ pé kí ó kúrò ní agbègbè wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilẹ̀ wọn”; ní ti gangan, “àwọn ààlà wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: wò ó
  rationale: Ó pa ipa ọ̀rọ̀ ìkìlọ̀ tí ń pe àfiyèsí mọ́, ó sì jẹ́ ọ̀nà àdánidá láti mú ìtàn náà yè kooro ní Yorùbá.
- source_word: πᾶσα ἡ πόλις
  choice: gbogbo ìlú náà
  rationale: Ó tẹ̀ lé àpèjúwe Gíríìkì nípa àwọn olùgbé ìlú náà gẹ́gẹ́ bí odindi ẹgbẹ́ kan, láìfi dandan túmọ̀ sí pé olúkúlùkù ènìyàn ló jáde.
- source_word: ἐξῆλθεν
  choice: jáde lọ
  rationale: Ó fi ìṣípò kúrò nínú ìlú hàn ní kedere, ó sì bá ìlò Yorùbá mu.
- source_word: εἰς ὑπάντησιν
  choice: lọ pàdé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé fún jíjáde pẹ̀lú ète láti pàdé ẹnì kan.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A lo ìkọ̀wé orúkọ náà tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: ἰδόντες αὐτὸν
  choice: nígbà tí wọ́n sì rí i
  rationale: Ó tú participle aorist náà sí ìbáṣepọ̀ àkókò lọ́nà tó rọrùn, ó sì pa ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ mọ́.
- source_word: παρεκάλεσαν
  choice: wọ́n bẹ̀ ẹ́
  rationale: Ọ̀rọ̀ náà fi ìrawọ́ ẹ̀bẹ̀ tó lágbára hàn ju ìbéèrè lásán lọ.
- source_word: ὅπως μεταβῇ
  choice: pé kí ó kúrò
  rationale: 'Ó sọ ohun tí wọ́n ń bẹ̀bẹ̀ fún ní Yorùbá àdánidá: pé kí Jésù fi ibẹ̀ sílẹ̀.'
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ní agbègbè wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ὅρια lè túmọ̀ sí àwọn ààlà ní ti gangan, níhìn-ín ó ń tọ́ka sí ilẹ̀ tàbí agbègbè tí ó jẹ́ tiwọn.
theological_decisions:
- issue: Ìdí tí àwọn ará ìlú fi bẹ Jésù pé kí ó lọ
  choice: A kò sọ ìdí náà nínú ìtumọ̀; wọ́n kàn bẹ̀ ẹ́ pé kí ó kúrò ní agbègbè wọn.
  alternative: Wọ́n lè bẹ̀ ẹ́ nítorí ìbẹ̀rù agbára rẹ̀, ìbínú nítorí pípa àwọn ẹlẹ́dẹ̀ run, tàbí ìpayà gbogbogbò nítorí ohun tó ṣẹlẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ohun tó mú kí wọ́n bẹ̀ ẹ́. Nítorí náà, ìtumọ̀ náà kò fi ìdí tí akọ̀wé kò sọ kún un, ó sì pa àìdánilójú inú ìtàn mọ́.
translation_notes:
  register: A lo Yorùbá òde òní tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. “Sì wò ó” pa ìpè sí àfiyèsí mọ́; “wọ́n bẹ̀ ẹ́” sì fi agbára ẹ̀bẹ̀ náà hàn láìṣàfikún ìdí tí ọrọ̀ orísun kò sọ.
