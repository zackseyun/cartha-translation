id: MAT.8.2
reference: Matthew 8:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: yo
  text: Kíyèsí i, ọkùnrin kan tí ó ní àrùn ẹ̀tẹ̀ sún mọ́ ọn, ó sì tẹríba fún un[a], ó ní, “Olúwa, bí o bá fẹ́, o lè sọ mí di mímọ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó jọ́sìn fún un”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí títẹríba pẹ̀lú ìbòwọ̀, fífi ọlá fún ẹni, tàbí jíjọ́sìn, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sì wò ó
  rationale: Ó pa agbára ọ̀rọ̀ tí ń pe àfiyèsí mọ́, ó sì mú kí ìtàn náà yè kooro láì di ọ̀rọ̀ àtijọ́ tí kò ṣeé lóye.
- source_word: λεπρὸς
  choice: ọkùnrin kan tí ó ní àrùn ẹ̀tẹ̀
  rationale: Ó fi ẹni náà síwájú àìsàn rẹ̀, nígbà tí ó ṣì túmọ̀ àrùn awọ ara tí a sábà ń pè ní ẹ̀tẹ̀.
- source_word: προσελθὼν
  choice: wá
  rationale: Nínú ìṣàn ìtàn Yórùbá, “wá” sọ ní ṣókí pé ó tọ Jesu wá.
- source_word: προσεκύνει
  choice: tẹríba fún un
  rationale: Ó ṣàfihàn ìṣe ara àti ọ̀wọ̀ jíjinlẹ̀ tí ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí, láì pinnu ní dandan pé ìjọsìn ni.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ó pa ìtumọ̀ ọlá àti àṣẹ mọ́, ó sì tún jẹ́ kí ìwọ̀n ìtumọ̀ nípa ẹni tí Jesu jẹ́ dúró.
- source_word: ἐὰν θέλῃς
  choice: bí ìwọ bá fẹ́
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yórùbá láti sọ ìbéèrè tí ó sinmi lórí ìfẹ́ ẹni náà.
- source_word: δύνασαί
  choice: ìwọ lè
  rationale: Ó sọ agbára tàbí àǹfààní láti ṣe ohun náà ní kedere àti ní Yórùbá àdánidá.
- source_word: καθαρίσαι
  choice: sọ mí di mímọ́
  rationale: Ó pa ìtumọ̀ ìwẹ̀nùmọ́ ti ara àti ti ìlànà ẹ̀sìn mọ́ ju “mú mi láradá” lọ.
theological_decisions:
- issue: Ìtumọ̀ προσκυνέω nígbà tí a lò ó sí Jesu
  choice: tẹríba fún un
  alternative: jọ́sìn fún un
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífi ara balẹ̀, fífi ọlá fún ẹni, tàbí jíjọ́sìn. Àyíká náà fi ìbòwọ̀ hàn kedere, ṣùgbọ́n “tẹríba fún un” kò fi tipátipá yanjú bóyá ìjọsìn ní ìtumọ̀ kíkún ni.
translation_notes:
  register: Yórùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
