  source_fidelity: 'Ìtumọ̀ náà mú ìṣe pàtàkì ẹsẹ̀ náà wá: Jésù rí ọ̀pọ̀ ènìyàn ní àyíká rẹ̀, ó sì fúnni ní àṣẹ láti lọ sí ìhà kejì. Ṣùgbọ́n ‘ọ̀pọ̀lọpọ̀ èrò’ lè ka sí ‘ọ̀pọ̀ ènìyàn’ ju ‘ọ̀pọ̀ ogunlọ́gọ̀’ lọ, nígbà tí ὄχλους jẹ́ púpọ̀. ‘Apá kejì’ sì ṣe kedere ju ‘òdìkejì’ tí ó dúró nìkan lọ fún τὸ πέραν.'
