id: MAT.8.18
reference: Matthew 8:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: yo
  text: Nígbà tí Jésù rí ọ̀pọ̀ ogunlọ́gọ̀ ènìyàn yí i ká, ó pàṣẹ pé kí wọ́n lọ sí apá kejì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, a kò sọ ẹni tí Jésù pàṣẹ fún láti lọ ní tààrà.
    reason: Arọ́pò-orúkọ ‘wọ́n’ ń jẹ́ kí gbólóhùn Yorùbá péye, ṣùgbọ́n orísun kò sọ ẹni tí àṣẹ náà kan ní gbangba.
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: ọ̀pọ̀lọpọ̀ èrò
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ ogunlọ́gọ̀ ènìyàn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju títúmọ̀ ọ̀pọ̀ orúkọ náà lẹ́yọ-ọ̀kan lọ.
- source_word: περὶ αὐτόν
  choice: yí i ká
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún àwòrán àwọn ènìyàn tí ó wà ní àyíká rẹ̀.
- source_word: ἐκέλευσεν
  choice: ó pàṣẹ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífúnni ní àṣẹ, kì í ṣe àbá tàbí ìbéèrè lásán.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: kí wọ́n lọ sí òdìkejì
  rationale: Ó mú ìtumọ̀ lílọ kúrò níbẹ̀ sí apá kejì jáde láì fi ‘adágún’ kún ohun tí ẹsẹ̀ náà kò sọ ní tààrà.
theological_decisions:
- issue: Ẹni tí Jésù pàṣẹ fún
  choice: kí wọ́n lọ
  alternative: kí ó lọ / láti lọ
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ẹni tí àṣẹ náà kan ní tààrà. Yorùbá nílò ẹni ìṣe nínú gbólóhùn yìí, nítorí náà ‘wọ́n’ ni a lò gẹ́gẹ́ bí ẹni tí àṣẹ kan, ṣùgbọ́n a fi àlàyé sí ìsàlẹ̀ láti pa àìdánilójú inú orísun mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní àmì ohùn ní kíkún, tí ó ṣe kedere, tí ó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. A kò fi àmì àsọyé bí ‘Wàyí o’ kún δέ, nítorí pé níbí ó ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìtàn.
