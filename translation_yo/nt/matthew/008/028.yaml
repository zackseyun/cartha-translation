- from: Nígbà tí ó dé òdìkejì, ní agbègbè àwọn ará Gádárà[a], àwọn ọkùnrin méjì tí àwọn ẹ̀mí èṣù ń ṣe jáde láti inú àwọn ibojì wá pàdé rẹ̀. Wọ́n léwu gidigidi[b], tó bẹ́ẹ̀ tí ẹnikẹ́ni kò fi lè gba ọ̀nà náà kọjá.
  to: Nígbà tí ó dé òdìkejì, ní agbègbè àwọn ará Gádárà[a], àwọn ọkùnrin méjì tí àwọn ẹ̀mí èṣù ń ṣe, tí wọ́n ń jáde láti inú àwọn ibojì, wá pàdé rẹ̀. Wọ́n léwu gidigidi[b], tó bẹ́ẹ̀ tí ẹnikẹ́ni kò lè gba ọ̀nà náà kọjá.
