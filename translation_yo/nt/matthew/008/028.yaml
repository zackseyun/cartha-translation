id: MAT.8.28
reference: Matthew 8:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: yo
  text: Nígbà tí ó dé òdìkejì, ní agbègbè àwọn ará Gádárà[a], àwọn ọkùnrin méjì tí àwọn ẹ̀mí èṣù ń ṣe, tí wọ́n ń jáde láti inú àwọn ibojì, wá pàdé rẹ̀. Wọ́n léwu gidigidi[b], tó bẹ́ẹ̀ tí ẹnikẹ́ni kò lè gba ọ̀nà náà kọjá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní “àwọn ará Gérgésà” tàbí “àwọn ará Gérásà” dípò “àwọn ará Gádárà.”
    reason: textual_variant
  - marker: b
    text: Tàbí, “Wọ́n burú gan-an.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Nígbà tí ó dé
  rationale: A tú genitive absolute náà sí gbólóhùn àkókò tó bá èdè Yorùbá mu, láì yí ìtẹ̀lé ìṣẹ̀lẹ̀ padà.
- source_word: τὸ πέραν
  choice: òdìkejì
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí apá kejì adágún; ‘òdìkejì’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: agbègbè àwọn ará Gádárà
  rationale: χώρα túmọ̀ sí agbègbè tàbí ìpínlẹ̀ ilẹ̀; a sì tẹ̀lé orúkọ Γαδαρηνῶν tó wà nínú SBLGNT.
- source_word: δύο δαιμονιζόμενοι
  choice: àwọn ọkùnrin méjì tí àwọn ẹ̀mí èṣù ń ṣe
  rationale: Ọ̀rọ̀ yìí sọ pé àwọn ẹ̀mí èṣù ní agbára lórí wọn. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, ó sì yẹra fún ọ̀rọ̀ imọ̀-ẹ̀kọ́ tí kò wọ́pọ̀.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: jáde láti inú àwọn ibojì
  rationale: μνημεῖα níbí jẹ́ ibi ìsìnkú tàbí ibojì; gbolohun náà ṣàpèjúwe ibi tí àwọn ọkùnrin náà ti jáde.
- source_word: χαλεποὶ λίαν
  choice: Wọ́n léwu gidigidi
  rationale: χαλεπός lè túmọ̀ sí líle, jíjẹ́ oníjà, tàbí jíjẹ́ eléwu. Àbájáde tó tẹ̀ lé e—pé kò sí ẹni tó lè gba ọ̀nà náà—mú kí ‘léwu gidigidi’ jẹ́ ìtumọ̀ àdánidá láì fi dandan sọ pé wọ́n ń lu ènìyàn.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: tó bẹ́ẹ̀ tí ẹnikẹ́ni kò fi lè gba ọ̀nà náà kọjá
  rationale: ὥστε fi àbájáde hàn, ἰσχύειν sì ń sọ agbára tàbí àǹfààní láti ṣe ohun kan níbí; ‘gba ọ̀nà náà kọjá’ fi διὰ τῆς ὁδοῦ hàn gẹ́gẹ́ bí ipa ọ̀nà ìrìn.
theological_decisions:
- issue: Ọ̀nà láti tú èdè nípa ìṣàkóso àwọn ẹ̀mí èṣù
  choice: tí àwọn ẹ̀mí èṣù ń ṣe
  alternative: tí àwọn ẹ̀mí èṣù gbà
  rationale: Aṣàyàn náà jẹ́ èdè Yorùbá tó ṣe kedere fún ẹni tí ó wà lábẹ́ agbára àwọn ẹ̀mí èṣù, láì ṣàfikún àlàyé nípa bí ìṣàkóso náà ṣe ń ṣiṣẹ́.
- issue: Ìyàtọ̀ orúkọ ibi nínú àwọn ìwé àfọwọ́kọ
  choice: Gádárà
  alternative: Gérgésà tàbí Gérásà
  rationale: SBLGNT ka Γαδαρηνῶν, nítorí náà a fi Gádárà sínú ọ̀rọ̀ pàtàkì; a pa àwọn ẹ̀dà mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá àpéjọ, tó níyì, tó sì ṣe kedere ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yàn ìṣètò gbólóhùn àdánidá dípò títẹ̀lé ìṣètò Gíríìkì ní ọ̀rọ̀-lẹ́-ọ̀rọ̀.
