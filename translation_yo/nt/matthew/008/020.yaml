id: MAT.8.20
reference: Matthew 8:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: yo
  text: Jésù sì wí fún un pé, “Àwọn kọ̀lọ̀kọ̀lọ̀ ní ihò, àwọn ẹyẹ ojú ọ̀run sì ní ìtẹ́; ṣùgbọ́n Ọmọ Ènìyàn kò ní ibi tí yóò fi orí rẹ̀ lé.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: wí
  rationale: Ọ̀rọ̀ ìtàn Yorùbá sábà máa ń lo ‘wí’ láìfi ìyàtọ̀ àkókò hàn bí Gíríìkì ṣe ń ṣe; ó bá ìṣísẹ̀ ọ̀rọ̀ náà mu, ó sì jẹ́ èdè ọlọ́lá tó ṣe kedere.
- source_word: ἀλώπεκες
  choice: àwọn kọ̀lọ̀kọ̀lọ̀
  rationale: Èyí ni orúkọ Yorùbá tó wọ́pọ̀ fún foxes, pẹ̀lú àmì ọ̀pọ̀.
- source_word: φωλεούς
  choice: ihò
  rationale: ‘Ihò’ túmọ̀ sí ibi tí ẹranko ń gbé, ó sì tẹ̀lé àwòrán Gíríìkì ní kíkún ju ọ̀rọ̀ àlàyé gígùn lọ.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: àwọn ẹyẹ ojú ọ̀run
  rationale: Gbólóhùn yìí jẹ́ ti Yorùbá àdánidá fún àwọn ẹyẹ tí ń fò, ó sì pa àwòrán οὐρανός mọ́.
- source_word: κατασκηνώσεις
  choice: ìtẹ́
  rationale: Nínú ọ̀rọ̀ nípa ẹyẹ, ‘ìtẹ́’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ fún ibi tí wọ́n ń gbé tàbí sinmi.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  rationale: A túmọ̀ àkọ́lé náà ní ọ̀nà àṣà tí ó pa ìtumọ̀ rẹ̀ àti ìró ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, láìṣe àlàyé rẹ̀ sínú ọ̀rọ̀.
- source_word: οὐκ ἔχει ποῦ
  choice: kò ní ibi tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò sí ibìkan fún un, ó sì fara mọ́ ìṣètò ìtumọ̀ Gíríìkì.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: yóò fi orí rẹ̀ lé
  rationale: ‘Fi orí lé’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa àwòrán ara ẹni ti Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ orúkọ tí Jésù fi ń pe ara rẹ̀, ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ọmọ Ènìyàn
  alternative: Ẹni Ènìyàn
  rationale: ‘Ọmọ Ènìyàn’ pa ìṣètò ọ̀rọ̀ Gíríìkì àti ìfarahàn rẹ̀ gẹ́gẹ́ bí àkọ́lé mọ́, pẹ̀lú ìtumọ̀ tó lè ní nípa Dáníẹ́lì 7. ‘Ẹni Ènìyàn’ yóò túmọ̀ ọ́ ju bó ṣe yẹ lọ, yóò sì dín ìṣòro ìtumọ̀ inú orísun kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A yan ‘sì wí’ fún ìṣísẹ̀ ìtàn, ‘ojú ọ̀run’ fún àwòrán ibi tí ẹyẹ ń fò, àti ‘fi orí rẹ̀ lé’ gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìsinmi tàbí ibùgbé. Kò sí àlàyé ẹ̀sìn ẹlẹ́gbẹ́ kan tí a fi kún un.
