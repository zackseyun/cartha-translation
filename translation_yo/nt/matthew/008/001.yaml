  text: ⸂Καταβάντος δὲ αὐτοῦ⸃ ἀπὸ τοῦ ὄρους ἠκολούθησαν αὐτῷ ὄχλοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: yo
  text: Nígbà tí ó sì sọ̀kalẹ̀ kúrò ní òkè náà, ọ̀pọ̀lọpọ̀ ènìyàn[a] tẹ̀ lé e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀pọ̀ èrò tẹ̀ lé e.” Gíríìkì náà ní ọ̀pọ̀ ogun ènìyàn, tàbí ọ̀pọ̀ èrò; “ọ̀pọ̀lọpọ̀ ènìyàn” jẹ́ ọ̀nà àdánidá ní Yorùbá òde òní.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Nígbà tí ó sì sọ̀kalẹ̀
  rationale: A tú genitive absolute pẹ̀lú aorist participle sí gbólóhùn àkókò tó bá Yorùbá mu. “Nígbà tí” ń fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn láì fi àkókò míì kún un; “sì” sì ń gbé ìsopọ̀ kékeré δέ jáde.
- source_word: ἀπὸ τοῦ ὄρους
  choice: láti orí òkè
  rationale: ὄρος lè túmọ̀ sí òkè ńlá tàbí òkè; “orí òkè” jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí ibi tí ó ti sọ̀kalẹ̀, ó sì bá àyíká ìtàn tó ṣáájú mu.
- source_word: ἠκολούθησαν αὐτῷ
  choice: tẹ̀ lé e
  rationale: ἀκολουθέω pẹ̀lú ẹni tí a ń tẹ̀ lé túmọ̀ sí títẹ̀lé ẹnì kan ní ti ìrìn nínú àyíká yìí. “tẹ̀ lé e” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tí kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: ὄχλοι πολλοί
  choice: ọ̀pọ̀lọpọ̀ ènìyàn
  rationale: Gíríìkì náà sọ ní tààràtà pé “ọ̀pọ̀ èrò.” “Ọ̀pọ̀lọpọ̀ ènìyàn” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì jẹ́ àdánidá láti sọ pé ènìyàn pọ̀ gan-an, bí ó tilẹ̀ jẹ́ pé kò fi ọ̀pọ̀ ẹgbẹ́ èrò hàn ní kíkún.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ, a sì yẹra fún èdè àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn tí orísun kò béèrè.
