id: MAT.8.6
reference: Matthew 8:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: yo
  text: Ó sì wí pé, “Olúwa, ọmọ ọ̀dọ̀ mi[a] dùbúlẹ̀ nílé, ó ní ààrùn ẹ̀gbà, ó sì ń jìyà gidigidi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọkùnrin mi” tàbí “ọmọ mi”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìránṣẹ́ tàbí ọmọ, bí ó tilẹ̀ jẹ́ pé “ọmọ ọ̀dọ̀” bá ọ̀rọ̀ balógun ọgọ́rùn-ún yìí mu jù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ń dá a lóró gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: ó sì wí pé
  rationale: Bí ó tilẹ̀ jẹ́ pé λέγων jẹ́ participle ní Gíríìkì, ‘ó sì wí pé’ jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń so ọ̀rọ̀ yìí mọ́ ìtàn tó ṣáájú, láìyí ìtumọ̀ rẹ̀ padà.
- source_word: Κύριε
  choice: Olúwa
  rationale: ‘Olúwa’ lè jẹ́ ọ̀rọ̀ ọ̀wọ̀ sí ẹni tó ga, ó sì tún lè ní ìtumọ̀ ẹ̀sìn tó jinlẹ̀; nítorí náà, ó pa àìdánilójú tó wà nínú κύριε mọ́.
- source_word: ὁ παῖς μου
  choice: ọmọ ọ̀dọ̀ mi
  rationale: παῖς lè túmọ̀ sí ọmọ, ọmọkùnrin, tàbí ìránṣẹ́. Nínú ọ̀rọ̀ balógun ọgọ́rùn-ún yìí, ‘ọmọ ọ̀dọ̀ mi’ bá ipò ìránṣẹ́ mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ní iyì ju ‘ẹrú’ lọ. Àwọn ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: dùbúlẹ̀ nílé
  rationale: Perfect passive βέβληται ń tọ́ka sí ipò tí ẹni náà wà lẹ́yìn tí àìsàn ti mú un ṣubú sílẹ̀; ‘dùbúlẹ̀ nílé’ sọ ipò yẹn ní Yorùbá àdánidá láìfi èrò míì kún un.
- source_word: παραλυτικός
  choice: ó rọ
  rationale: ‘Ó rọ’ jẹ́ ọ̀nà kedere, àdánidá, tí Yorùbá òde òní fi ń ṣàpèjúwe ẹni tí paralysis mú, láìsọ ẹni náà di orúkọ àìsàn rẹ̀.
- source_word: δεινῶς βασανιζόμενος
  choice: ó sì ń jìyà gidigidi
  rationale: Gbólóhùn yìí sọ ìpọ́njú tó le gan-an. ‘Ó ń jìyà gidigidi’ ṣe àfihàn ìrora ńlá ní èdè tó ṣeé lóye, nígbà tí ìtumọ̀ tó lágbára jù, ‘a ń dá a lóró gidigidi,’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Agbára ìtumọ̀ κύριε nígbà tí balógun náà ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Ọ̀rọ̀ náà lè jẹ́ ìkíni ọ̀wọ̀ lásán tàbí akọ́lé tó fi ìmọ̀ ẹni tí Jésù jẹ́ hàn jinlẹ̀ sí i. ‘Olúwa’ kò fi tipátipá yan ọ̀kan nínú méjèèjì, ó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: A lo Yorùbá tí ó wọ́pọ̀, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ọmọ ọ̀dọ̀’ yẹra fún ìrísí líle tàbí àbùkù tí ‘ẹrú’ lè ní, ‘ó rọ’ sì jẹ́ ọ̀rọ̀ kedere fún paralysis. Ìtòlẹ́sẹẹsẹ gbólóhùn náà tẹ̀ lé ìṣàn Yorùbá àdánidá.
