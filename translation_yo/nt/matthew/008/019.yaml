source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: yo
  text: Akọ̀wé kan sì sún mọ́ ọn, ó sì wí fún un pé, “Olùkọ́, èmi yóò tọ̀ ọ́ lẹ́yìn níbikíbi tí o bá lọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níbikíbi tí o bá lọ kúrò.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ lílọ kúrò tàbí fífi ibì kan sílẹ̀ ní pàtó, bí ó tilẹ̀ jẹ́ pé “lọ” bá àyíká ọ̀rọ̀ náà mu lọ́nà àdánidá níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: tọ̀ ọ́ wá
  rationale: Ó fi ìṣípò sún mọ́ Jesu hàn ní Yorùbá àdánidá, kí ó tó bá a sọ̀rọ̀.
- source_word: εἷς γραμματεὺς
  choice: ẹnì kan nínú àwọn akọ̀wé
  rationale: Èyí pa ìtumọ̀ nọ́ńbà εἷς mọ́, ó sì fi hàn pé akọ̀wé kan pàtó ló wá, láì sọ pé ó jẹ́ ẹni tí a ti mọ̀ tẹ́lẹ̀.
- source_word: γραμματεὺς
  choice: akọ̀wé
  rationale: “Akọ̀wé” ni ọ̀rọ̀ Yorùbá ìbílẹ̀ tí a sábà máa ń lò fún γραμματεύς nínú àyíká Ìhìn Rere; “amọ̀wé òfin” yóò túmọ̀ sí i ju ohun tí Gíríìkì sọ lọ.
- source_word: Διδάσκαλε
  choice: Olùkọ́
  rationale: Ó túmọ̀ akọ́lé náà ní tààrà, ó sì yẹra fún fífi agbára ìtumọ̀ “Ọ̀gá” tàbí akọ́lé “Rábì” kún un.
- source_word: ἀκολουθήσω
  choice: èmi yóò máa tọ̀ ọ́ lẹ́yìn
  rationale: Ó pa ìkéde ọjọ́ iwájú mọ́, ó sì gba ìtumọ̀ rírìn tẹ̀ lé àti jíjẹ́ ọmọ-ẹ̀yìn láàyè láì yan ọ̀kan ṣoṣo.
- source_word: ὅπου ἐὰν
  choice: níbikíbi tí
  rationale: Ọ̀rọ̀ yìí fi àyè tí kò ní ààlà tàbí ibi tí a kò tíì sọ pàtó hàn lọ́nà Yorùbá àdánidá.
- source_word: ἀπέρχῃ
  choice: o bá lọ
  rationale: “Lọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá ní àyíká yìí; síbẹ̀, àlàyé ìsàlẹ̀ fi ìtumọ̀ pàtó sí i, “kúrò/lọ kúrò,” pamọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ διδάσκαλος gẹ́gẹ́ bí akọ́lé Jesu
  choice: Olùkọ́
  alternative: Ọ̀gá; Rábì
  rationale: “Olùkọ́” bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu, ó sì pa ìbọ̀wọ̀ ọkùnrin náà mọ́ láì gbé akọ́lé Kristọ́lójì tí ẹsẹ̀ náà kò sọ ní gbangba wọlé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tí ó ti bá àṣà mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
