id: MAT.8.15
reference: Matthew 8:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: yo
  text: Ó sì fọwọ́ kan ọwọ́ obìnrin náà, ibà náà sì fi í sílẹ̀; ó sì dìde, ó ń ṣe ìránṣẹ́ fún un.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó bẹ̀rẹ̀ sí í ṣe ìránṣẹ́ fún un.” Àìpé ọ̀rọ̀-ìṣe Gíríìkì lè ṣàpèjúwe ìṣe tí ń bá a lọ lásán, ṣùgbọ́n ó tún lè fi hàn pé ó bẹ̀rẹ̀ sí í ṣe ìránṣẹ́ fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: fi ọwọ́ kan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ara kan ara; ‘fi ọwọ́ kan’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó bá ipò ìwòsàn yìí mu láì sọ pé ó dì í mú.
- source_word: τῆς χειρὸς αὐτῆς
  choice: ọwọ́ obìnrin náà
  rationale: χείρ túmọ̀ sí ‘ọwọ́’; a sọ ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ní kedere nítorí Yorùbá kò fi akọ tàbí abo hàn nínú ‘ó/un.’
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: ibà náà sì fi í sílẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún pé ibà náà kúrò lára rẹ̀, ó sì pa àwòrán orísun mọ́ pé ibà ni olùṣe gírámà.
- source_word: πυρετός
  choice: ibà
  rationale: ‘Ibà’ ni ọ̀rọ̀ Yorùbá tààrà fún fever; kò sí ìdí láti fẹ̀ sí i sí àìsàn míì.
- source_word: ἠγέρθη
  choice: ó sì dìde
  rationale: Nínú ìtàn yìí, ọ̀rọ̀ náà sọ pé obìnrin náà dìde lẹ́yìn ìwòsàn; kò pọndandan láti túmọ̀ rẹ̀ gẹ́gẹ́ bí ẹni tí a jí dìde.
- source_word: διηκόνει αὐτῷ
  choice: ó ń ṣe ìránṣẹ́ fún un
  rationale: Àìpé (imperfect) Gíríìkì lè ṣàpèjúwe iṣẹ́ tí ó ń lọ lọ́wọ́; ‘ó ń ṣe ìránṣẹ́ fún un’ jẹ́ adayeba, ó sì yẹra fún fífi ìbẹ̀rẹ̀ iṣẹ́ náà múlẹ̀ ju bí orísun ṣe béèrè lọ.
theological_decisions:
- issue: Ó ṣeé ṣe kí a ka ἠγέρθη gẹ́gẹ́ bí ọ̀rọ̀ nípa àjíǹde.
  choice: ó dìde
  alternative: a jí i dìde
  rationale: Àyíká ọ̀rọ̀ ń sọ ní tààrà pé ó dìde lẹ́yìn tí ibà fi í sílẹ̀; yíyan passive tó lágbára lè kó ìtumọ̀ ẹ̀kọ́ nípa àjíǹde wọ inú ẹsẹ yìí láìṣe dandan.
- issue: Bóyá àìpé διηκόνει ń tẹnu mọ́ ìbẹ̀rẹ̀ iṣẹ́ náà.
  choice: ó ń ṣe ìránṣẹ́ fún un
  alternative: ó bẹ̀rẹ̀ sí í ṣe ìránṣẹ́ fún un
  rationale: Àìpé náà lè tọ́ka sí ìṣe tí ń bá a lọ tàbí ìṣe tí ó bẹ̀rẹ̀; a pa àìdánilójú náà mọ́ nínú àkọ́kọ́, a sì fi àṣàyàn ìbẹ̀rẹ̀ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìtàn tó mọ́gbọ́n dání, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lò àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì tún ‘obìnrin náà’ sọ láti yà á sọ́tọ̀ kúrò lọ́dọ̀ Jésù nítorí àìsí àmì akọ/abo nínú arọ́pò-orúkọ Yorùbá.
