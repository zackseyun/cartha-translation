id: MAT.8.32
reference: Matthew 8:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: yo
  text: Ó sì sọ fún wọn pé, “Ẹ lọ.” Wọ́n sì jáde, wọ́n sì lọ sínú àwọn ẹlẹ́dẹ̀ náà. Kíyè sí i, gbogbo agbo náà sáré gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀ sínú òkun, wọ́n sì kú nínú omi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n rì nínú omi.” Ní tààrà, Gíríìkì sọ pé, “wọ́n kú nínú omi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Ẹ lọ
  rationale: Àṣẹ kúkúrú yìí ṣe àfihàn ọ̀rọ̀ Jesu ní tààràtà, láìfi ìtumọ̀ míì kún un.
- source_word: ἐξελθόντες
  choice: Nígbà tí wọ́n sì jáde
  rationale: Ó sọ pé wọ́n jáde kúrò nínú àwọn ọkùnrin tí ẹ̀mí èṣù ń yọ lẹ́nu; gbólóhùn yìí sì bá ìtàn Yorùbá mu láìsọ ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà dúró fún ní gbangba ju Gíríìkì lọ.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: wọ́n wọ inú àwọn ẹlẹ́dẹ̀
  rationale: Èyí sọ ìṣípò àwọn ẹ̀mí náà sínú ẹlẹ́dẹ̀ ní èdè Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ ti òde òní.
- source_word: ἰδοὺ
  choice: Sì kíyè sí i
  rationale: Ó pa agbára àmì-ọ̀rọ̀ tí ń pe olùgbọ́ láti fiyè sí ìṣẹ̀lẹ̀ tó tẹ̀ lé mọ́, dípò yíyí i padà sí ‘lójijì.’
- source_word: πᾶσα ἡ ἀγέλη
  choice: gbogbo agbo náà
  rationale: Ó fi hàn pé gbogbo ẹlẹ́dẹ̀ inú agbo náà ni ọ̀rọ̀ kàn.
- source_word: ὥρμησεν
  choice: rọ́ gìrì
  rationale: Ọ̀rọ̀ yìí mú ìṣípò líle, kíákíá, àti àìdádúró tí ọ̀rọ̀ Gíríìkì ní jáde lọ́nà àdánidá ní Yorùbá.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀
  rationale: Èyí lè tọ́ka sí ibi tí ó ṣán gẹ̀rẹ́ tàbí bèbè gíga, láìfi dandan sọ pé àpáta gíga tí ó dúró ṣánṣán ni.
- source_word: τὴν θάλασσαν
  choice: òkun
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí ‘òkun’; yíyan ‘òkun’ pa ọ̀rọ̀ orísun mọ́ láìyí i sí ‘adágún’ nítorí ìmọ̀ ilẹ̀.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: wọ́n sì kú nínú omi
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì pé wọ́n ‘kú nínú omi,’ láìfi ìtumọ̀ tí ó ṣeé ṣe—pé omi rì wọ́n—sínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Bí a ṣe máa ṣàlàyé ikú agbo ẹlẹ́dẹ̀ náà ní pàtó
  choice: wọ́n sì kú nínú omi
  alternative: omi sì rì wọ́n
  rationale: Àyíká ìtàn náà fi hàn pé ó ṣeé ṣe kí omi rì wọ́n, ṣùgbọ́n ọ̀rọ̀ Gíríìkì sọ ní tààrà pé wọ́n kú. Ìtumọ̀ pàtàkì náà pa àìsọ pàtó yìí mọ́.
translation_notes:
  register: A lo Yorùbá Àfẹnusọ tó ní àmì ohùn ní kíkún, ní ìlànà ìtàn tó lọ́nà àdánidá, tó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. ‘Sì kíyè sí i’ pa agbára ìtàn ἰδοὺ mọ́; ‘rọ́ gìrì’ sì jẹ́ ọ̀rọ̀ alágbára ṣùgbọ́n tí ó wọ́pọ̀. A kò sọ ‘àwọn ẹ̀mí èṣù’ sínú ọ̀rọ̀ pàtàkì níbi tí Gíríìkì ti lo ọ̀rọ̀ arọ́pò-orúkọ nìkan.
