revisions:
- from: Ó sì sọ fún wọn pé, “Ẹ lọ.” Nígbà tí wọ́n sì jáde, wọ́n wọ inú àwọn ẹlẹ́dẹ̀. Sì kíyè sí i, gbogbo agbo náà rọ́ gìrì gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà[a] sọ̀ sínú òkun, wọ́n sì kú nínú omi[b].
  to: Ó sì sọ fún wọn pé, “Ẹ lọ.” Wọ́n sì jáde, wọ́n sì lọ sínú àwọn ẹlẹ́dẹ̀ náà. Kíyè sí i, gbogbo agbo náà sáré gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀ sínú òkun, wọ́n sì kú nínú omi.[a]
  rationale: The revision replaces unclear movement wording with an idiomatic expression for the herd’s rush down the steep descent, streamlines the attention marker, and marks the referenced pigs as definite. It retains the source’s restrained statement that the animals died in the waters. The terrain alternative is retained as a footnote, now anchored to the terrain expression rather than the death clause.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:32:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal sequence and content of the Greek: the command, the exit and entry into the pigs, the attention marker, the whole herd’s descent, and their death in the waters. However, the rendering of ὥρμησεν together with the terrain phrase is not fully idiomatic or clear in the present wording.'
  naturalness: “Sì kíyè sí i” and especially “rọ́ gìrì gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀” are awkward in contemporary Standard Yorùbá. A more direct narrative form retains the vividness while reading naturally.
  terminology: “ẹlẹ́dẹ̀,” “agbo,” “òkun,” and “kú nínú omi” are appropriate. The main text should retain “kú nínú omi,” rather than state that the animals drowned. The footnote can give that interpretive alternative.
  issues:
  - severity: medium
    issue: The phrase “rọ́ gìrì gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀” is unclear and unidiomatic.
    rationale: It does not naturally express a herd’s sudden, forceful rush down a steep descent. “sáré gba ... sọ̀” is clear Yorùbá narrative language and conveys the movement without asserting more than the Greek.
  - severity: low
    issue: “Sì kíyè sí i” is a stiff rendering of ἰδοὺ in this sentence.
    rationale: “Kíyè sí i” works more naturally as a discourse-level call to attention while preserving the rhetorical force of ἰδοὺ.
  - severity: low
    issue: The definite force of τοὺς χοίρους is not reflected.
    rationale: Adding “náà” to “àwọn ẹlẹ́dẹ̀” naturally marks the referenced pigs without adding interpretive content.
  revised_text: Ó sì sọ fún wọn pé, “Ẹ lọ.” Wọ́n sì jáde, wọ́n sì lọ sínú àwọn ẹlẹ́dẹ̀ náà. Kíyè sí i, gbogbo agbo náà sáré gba ibi gẹ̀rẹ́gẹ̀rẹ́ náà sọ̀ sínú òkun, wọ́n sì kú nínú omi.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “wọ́n rì nínú omi.” Ní tààrà, Gíríìkì sọ pé, “wọ́n kú nínú omi.”
    reason: alternative_reading
  - marker: b
    text: “Ibi gẹ̀rẹ́gẹ̀rẹ́” lè túmọ̀ sí ibi tí ó gẹ̀gẹ̀, bèbè gíga, tàbí ibi tí ó ṣán gan-an.
    reason: lexical_alternative
  revision_rationale: The revision replaces unclear movement wording with an idiomatic expression for the herd’s rush down the steep descent, streamlines the attention marker, and marks the referenced pigs as definite. It retains the source’s restrained statement that the animals died in the waters. The terrain alternative is retained as a footnote, now anchored to the terrain expression rather than the death clause.
