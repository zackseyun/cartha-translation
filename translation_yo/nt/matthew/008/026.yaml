id: MAT.8.26
reference: Matthew 8:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: yo
  text: Ó sì wí fún wọn pé, “Èé ṣe tí ẹ fi jẹ́ ẹni ìbẹ̀rù, ẹ̀yin tí ìgbàgbọ́ yín kéré?” Nígbà náà, ó dìde, ó sì bá àwọn ẹ̀fúùfù àti òkun wí; ìdákẹ́jẹ́ ńlá sì dé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: ń bẹ̀rù
  rationale: Ó fi ìbẹ̀rù àti àìní ìgboyà àwọn ọmọ-ẹ̀yìn hàn ní èdè Yorùbá àdánidá, láìfi ìtumọ̀ ẹ̀gàn kún un.
- source_word: ὀλιγόπιστοι
  choice: onígbàgbọ́ kékeré
  rationale: Ó pa àwòrán Gíríìkì ti ‘ìgbàgbọ́ kékeré’ mọ́, ó sì bá ọ̀rọ̀ tí Jésù sábà máa ń lò ní Mátíù mu.
- source_word: ἐπετίμησεν
  choice: bá … wí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ó fi ọ̀rọ̀ líle pàṣẹ tàbí dá wọn lẹ́bi; ó tún pa ìṣe Jésù sí àwọn ẹ̀fúùfù àti òkun mọ́.
- source_word: γαλήνη μεγάλη
  choice: ìparọ́rọ́ ńlá
  rationale: ‘Ìparọ́rọ́’ túmọ̀ sí ìdákẹ́jẹ́ omi àti afẹ́fẹ́ lẹ́yìn ìjì; ‘ńlá’ sì pa ìtẹnumọ́ μεγάλη mọ́.
theological_decisions:
- issue: Ìtumọ̀ ὀλιγόπιστοι
  choice: onígbàgbọ́ kékeré
  alternative: ẹ̀yin tí ìgbàgbọ́ yín kéré
  rationale: A pa ọ̀rọ̀ àpèjúwe tí Jésù lò mọ́, láìsọ pé wọn kò ní ìgbàgbọ́ rárá.
- issue: Jésù bá àwọn agbára àdánidá wí
  choice: ó bá àwọn ẹ̀fúùfù àti òkun wí
  alternative: ó pàṣẹ fún àwọn ẹ̀fúùfù àti òkun
  rationale: Yíyan yìí tẹ̀ lé ἐπετίμησεν ní pẹkipẹki, ó sì yẹra fún ṣíṣe àlàyé ìtumọ̀ iṣẹ́ náà ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: 'Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún. Àtẹ̀lé ìṣẹ̀lẹ̀ Gíríìkì ni a pa mọ́: Jésù kọ́kọ́ bá àwọn ọmọ-ẹ̀yìn sọ̀rọ̀, lẹ́yìn náà ó dìde, ó bá ìjì wí, ìparọ́rọ́ ńlá sì dé.'
