id: MAT.8.3
reference: Matthew 8:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: yo
  text: Ó sì na ọwọ́ rẹ̀, ó fọwọ́ kàn án, ó ní, “Mo fẹ́; di mímọ́.” Lẹ́sẹ̀kẹsẹ̀ ni ẹ̀tẹ̀ rẹ̀[a] sì di mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì λέπρα, tí a túmọ̀ sí “ẹ̀tẹ̀,” lè tọ́ka sí onírúurú àìsàn awọ ara tó le koko, kì í ṣe àrùn Hansen tí a ń pè ní ẹ̀tẹ̀ lónìí nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: na ọwọ́ rẹ̀
  rationale: Ó sọ ìṣe gidi tí ó ṣáájú fífi ọwọ́ kan ẹni náà ní Yorùbá àdánidá, láìfi àlàyé kún un.
- source_word: ἥψατο αὐτοῦ
  choice: ó fọwọ́ kàn án
  rationale: ἅπτομαι pẹ̀lú ohun tí ó wà ní genitive túmọ̀ sí fífi ọwọ́ kan ní àyíká yìí; gbólóhùn Yorùbá náà ṣe kedere pé Jesu fi ọwọ́ kan ẹni náà.
- source_word: Θέλω
  choice: Mo fẹ́
  rationale: Ó dáhùn sí ọ̀rọ̀ ẹni náà nípa bóyá Jesu fẹ́ láti sọ ọ́ di mímọ́. Àṣàyàn yìí pa ìtumọ̀ ìfẹ́-inú mọ́, kò sì sọ ọ́ di ọ̀rọ̀ ọjọ́ iwájú.
- source_word: καθαρίσθητι
  choice: di mímọ́
  rationale: Àṣẹ yìí pa èdè ìwẹ̀nùmọ́ mọ́, èyí tí ó lè ní ìtumọ̀ nípa ara àti nípa ìwà-mímọ́, dípò lílo ‘wòsàn’ nìkan.
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé àbájáde náà ṣẹlẹ̀ ní kíákíá, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe tẹnumọ́.
- source_word: ἐκαθαρίσθη
  choice: di mímọ́
  rationale: Lílo ọ̀rọ̀ kan náà pẹ̀lú àṣẹ ṣáájú rẹ̀ pa ìbámu καθαρίζω mọ́, ó sì yẹra fún dídín ìtumọ̀ rẹ̀ kù sí ìwòsàn lásán.
- source_word: ἡ λέπρα
  choice: ẹ̀tẹ̀ rẹ̀
  rationale: ‘Ẹ̀tẹ̀’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún àṣà ìtumọ̀ Bíbélì, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé λέπρα lè gbòòrò ju àrùn Hansen òde òní lọ. ‘Rẹ̀’ dúró fún αὐτοῦ.
theological_decisions:
- issue: Èdè ìwẹ̀nùmọ́ àti ìwòsàn nínú καθαρίζω
  choice: Lo ‘di mímọ́’ nínú àṣẹ àti àbájáde
  alternative: Lo ‘wòsàn’
  rationale: Ọ̀rọ̀ Gíríìkì tẹnumọ́ ìwẹ̀nùmọ́, tí ó ní ipa nípa ara àti nípa ipò ìwà-mímọ́. ‘Wòsàn’ nìkan yóò mú apá kejì náà sọnù.
- issue: Ìtumọ̀ Θέλω nínú ìdáhùn Jesu
  choice: Mo fẹ́
  alternative: Èmi yóò ṣe é
  rationale: Ẹni tó ní àrùn náà ti béèrè nípa ìfẹ́-inú Jesu; ‘Mo fẹ́’ pa ìdáhùn tààrà sí ìbéèrè yẹn mọ́ láìfi ìtumọ̀ ọjọ́ iwájú tí kò pọndandan kún un.
- issue: Kókó-ọrọ̀ nínú gbólóhùn ìkẹyìn
  choice: ẹ̀tẹ̀ rẹ̀ ... di mímọ́
  alternative: ó di mímọ́ kúrò nínú ẹ̀tẹ̀ rẹ̀
  rationale: Ìtumọ̀ yìí pa ẹ̀tẹ̀ gẹ́gẹ́ bí kókó-ọrọ̀ girama mọ́, bí ó ti rí nínú Gíríìkì, ó sì pa ìfọ̀rọ̀wérọ̀ àṣẹ àti àbájáde mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní ọlá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìtòlẹ́sẹẹsẹ ìṣe náà tẹ̀lé orísun, ṣùgbọ́n ó jẹ́ ti Yorùbá àdánidá.
