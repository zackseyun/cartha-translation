id: MAT.8.21
reference: Matthew 8:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: yo
  text: Nígbà náà, ọ̀kan mìíràn nínú àwọn ọmọ-ẹ̀yìn sọ fún un pé, “Olúwa, gbà mí láàyè[a] kí n kọ́kọ́ lọ sin baba mi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “fún mi ní àṣẹ” tàbí “jẹ́ kí n.”
    reason: lexical_alternative
  - marker: b
    text: Ìbéèrè yìí lè túmọ̀ sí pé ó fẹ́ lọ sin baba rẹ̀ lẹ́sẹ̀kẹsẹ̀, tàbí, ní ìtumọ̀ gbígbòòrò, pé ó fẹ́ máa ṣe ojúṣe ọmọ sí baba rẹ̀ títí baba náà yóò fi kú; ọ̀rọ̀ Gíríìkì kò sọ èyí tí ó tọ́.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: Nígbà náà, ọ̀kan mìíràn nínú àwọn ọmọ-ẹ̀yìn
  rationale: “Ọ̀kan mìíràn” fi hàn pé ẹni yìí jẹ́ ẹlòmíràn tí ó yàtọ̀ sí ẹni tó ṣẹ̀ṣẹ̀ sọ̀rọ̀, “nínú àwọn ọmọ-ẹ̀yìn” sì fi ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹgbẹ́ náà hàn. “Nígbà náà” jẹ́ àsopọ̀ ìtàn tó bá iṣẹ́ δέ mu láìfi ìtakora líle kún un.
- source_word: Κύριε
  choice: Olúwa
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún ìpè ọ̀wọ̀ sí Jesu, ó sì pa agbára ìtumọ̀ ẹ̀sìn tí κύριος lè ní mọ́.
- source_word: ἐπίτρεψόν μοι
  choice: gbà mí láàyè
  rationale: Gbólóhùn yìí jẹ́ ìbéèrè ìyọ̀ǹda tó bójú mu ní Yorùbá, ó sì dá ìtumọ̀ ἐπιτρέπω dúró láìjẹ́ kí ọ̀rọ̀ náà le ju bó ṣe yẹ lọ.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: “Kọ́kọ́” fi ipò àkọ́kọ́ nínú ìtẹ̀lé iṣẹ́ hàn ní kedere.
- source_word: ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου
  choice: lọ sin baba mi
  rationale: “Lọ” pa èrò kíkúrò níbi tí ó wà mọ́, “sin baba mi” sì jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ìsìnkú ẹni.
theological_decisions:
- issue: Àkókò àti ìtúmọ̀ ìbéèrè láti sin baba rẹ̀
  choice: A túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí ìbéèrè láti lọ sin baba rẹ̀, láìsọ bóyá baba náà ṣẹ̀ṣẹ̀ kú tàbí ó ṣì wà láàyè.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìsìnkú pajawiri lẹ́yìn ikú baba náà, tàbí gẹ́gẹ́ bí ojúṣe ọmọ láti dúró títí baba rẹ̀ yóò fi kú.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ àkókò ikú baba náà. Nítorí náà, ìtumọ̀ yìí pa àìdánilójú inú ẹsẹ náà mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ kan lé e lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní àmì ohùn, ó ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. “Gbà mí láàyè” jẹ́ ìbéèrè ọ̀wọ̀, “lọ sin baba mi” sì jẹ́ gbólóhùn Yorùbá àdánidá.
