id: MAT.8.12
reference: Matthew 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ọmọ ìjọba[a] ni a ó lé jáde sínú òkùnkùn òde. Ibẹ̀ ni ẹkún àti ìpayínkeke eyín yóò wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ọmọkùnrin ìjọba”; idiomu Gíríìkì fún àwọn tí a kà sí ajogún tàbí ọmọ ẹgbẹ́ ìjọba náà ní ẹ̀tọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Ṣùgbọ́n àwọn ọmọ ìjọba
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ọ̀rọ̀ ẹsẹ tó ṣáájú hàn. “Àwọn ọmọ ìjọba” jẹ́ ọ̀nà Yorùbá tó bá àṣà ọ̀rọ̀ Gíríìkì mu, ó sì tọ́ka sí àwọn tí a kà sí ẹni tí ó yẹ kí wọ́n jogún tàbí wà nínú ìjọba náà.
- source_word: ἐκβληθήσονται
  choice: ni a ó lé jáde
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú ní ohùn àfaragbà, ó sì ní agbára ìtumọ̀ ìmúni jáde tàbí ìléni jáde. “Ni a ó lé jáde” jẹ́ èdè Yorùbá àdánidá tó pa ìtẹnumọ́ ìyọkúrò náà mọ́.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: sínú òkùnkùn òde
  rationale: Ó pa àwòrán ibi òkùnkùn tí ó wà níta mọ́ láì túmọ̀ rẹ̀ sí ẹ̀kọ́ ìjìyà kan pàtó.
- source_word: ἐκεῖ
  choice: Ibẹ̀
  rationale: Fífi “Ibẹ̀” sí ìbẹ̀rẹ̀ gbólóhùn kejì pa ìtẹnumọ́ ibi tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: ẹkún àti ìpayínkeke
  rationale: “Ẹkún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìsọ̀fọ̀; “ìpayínkeke” jẹ́ gbólóhùn Yorùbá tí a mọ̀ fún pípa eyín pọ̀ nítorí ìrora, ìbínú, tàbí ìdààmú, láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
theological_decisions:
- issue: Àwòrán ìyọkúrò àti ìdájọ́
  choice: Pa “òkùnkùn òde,” “ẹkún,” àti “ìpayínkeke” mọ́ gẹ́gẹ́ bí àwòrán inú ẹsẹ náà.
  alternative: Túmọ̀ àwòrán náà ní tààrà sí “ọ̀run àpáàdì” tàbí “ìjìyà ayérayé.”
  rationale: Ẹsẹ náà fi ìyọkúrò àti ìdààmú líle hàn, ṣùgbọ́n kò lo ọ̀rọ̀ Gíríìkì fún “ọ̀run àpáàdì” níbí; pípa àwòrán rẹ̀ mọ́ kò jẹ́ kí ìtumọ̀ fi ètò ẹ̀kọ́ kan kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ υἱοὶ ní àṣà ọ̀rọ̀
  choice: Lo “àwọn ọmọ ìjọba” nínú ẹsẹ, kí àlàyé ìsàlẹ̀ sọ pé Gíríìkì túmọ̀ ní tààrà sí “àwọn ọmọkùnrin ìjọba.”
  alternative: Lo “àwọn ajogún ìjọba” nínú ẹsẹ.
  rationale: “Àwọn ọmọ ìjọba” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, ó sì pa àṣà ọ̀rọ̀ orísun mọ́; “ajogún” nìkan lè tú ìtumọ̀ tó ní àyè sílẹ̀ ju bó ṣe yẹ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò. A yan “ni a ó lé jáde” láti pa ohùn àfaragbà àti agbára ọ̀rọ̀ Gíríìkì mọ́; a sì fi “Ibẹ̀” sí iwájú gbólóhùn kejì fún ìtẹnumọ́ ibi.
