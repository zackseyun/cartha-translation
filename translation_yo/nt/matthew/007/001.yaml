id: MAT.7.1
reference: Matthew 7:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: yo
  text: “Ẹ má ṣe dájọ́[a], kí a má bàa dájọ́ yín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe dá ẹnikẹ́ni lẹ́bi, kí a má bàa dá yín lẹ́bi.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “dálẹ́bi” nínú àwọn àyíká kan, ṣùgbọ́n “dájọ́” gbòòrò sí i, ó sì pa àtúnlò ọ̀rọ̀ náà nínú ẹsẹ yìí mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Ẹ má ṣe
  rationale: Pẹ̀lú ọ̀rọ̀ àṣẹ κρίνετε, Μὴ fi ìfòfindè hàn. “Ẹ má ṣe” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ òdì, ó sì bá ọ̀rọ̀ tí Jésù ń sọ fún ọ̀pọ̀ ènìyàn mu.
- source_word: κρίνετε
  choice: dájọ́
  rationale: “Dájọ́” ní ìtumọ̀ gbòòrò tó lè ní ṣíṣe ìdájọ́ tàbí dídálẹ́bi nínú àyíká kan. Ó tún jẹ́ kí àtúnlò gbòǹgbò ọ̀rọ̀ κρίνω nínú ẹsẹ náà hàn gbangba.
- source_word: ἵνα
  choice: kí ... má bàa
  rationale: Ìṣètò “kí ... má bàa” jẹ́ Yorùbá àdánidá fún ète tàbí àbájáde tí a fẹ́ yẹra fún, ó sì pa ìsopọ̀ láàárín àwọn gbólóhùn méjèèjì mọ́.
- source_word: μὴ
  choice: má bàa
  rationale: Ó sẹ́ ìṣe inú gbólóhùn kejì, ó sì bá ìṣètò Yorùbá “kí ... má bàa” mu.
- source_word: κριθῆτε
  choice: a ... dájọ́ yín
  rationale: Fọ́ọ̀mù yìí sọ ẹni tí a ṣe ìṣe sí láì sọ ẹni tó ṣe é. Ìlò “a” aláìlẹ́ni-pàtó nínú Yorùbá mú ìṣe aláìsọ aṣojú yìí jáde, nígbà tí “dájọ́” tún pa ìwọ̀ntúnwọ̀nsì àti àtúnlò ọ̀rọ̀ inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ κρίνω nínú ìfòfindè Jésù
  choice: A lo “dájọ́,” ọ̀rọ̀ tó gbòòrò, dípò kí a dín ìtumọ̀ náà kù sí “dálẹ́bi.”
  alternative: “Ẹ má ṣe dá ẹnikẹ́ni lẹ́bi, kí a má bàa dá yín lẹ́bi.”
  rationale: Ẹsẹ yìí nìkan kò ṣàlàyé gbogbo ààlà ìdájọ́ tàbí àyẹ̀wò ìwà; àyíká Mátíù 7:2–5 ló ń túbọ̀ ṣàlàyé rẹ̀. “Dájọ́” pa àìdánilójú àti ìforígbárí ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ tóóró kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo “Ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn nítorí κρίνετε àti κριθῆτε jẹ́ ọ̀pọ̀. Èdè náà jẹ́ kúkúrú, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní.
