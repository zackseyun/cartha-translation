id: MAT.7.5
reference: Matthew 7:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: yo
  text: Ìwọ alágàbàgebè, kọ́kọ́ yọ ìtì igi[a] náà kúrò ní ojú rẹ; nígbà náà ni ìwọ yóò ríran kedere láti yọ èérún[b] náà kúrò ní ojú arákùnrin rẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “igi ńlá” tàbí “pákó ńlá” fún δοκός.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ̀rún kékeré,” “èérún igi,” tàbí “ẹ̀ka koríko gbígbẹ” fún κάρφος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Ìwọ alágàbàgebè
  rationale: Ọ̀rọ̀ náà jẹ́ àpèjúwe ẹnì kan ní tààràtà pẹ̀lú ìbáwí líle. “Alágàbàgebè” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa agbára ìbáwí náà mọ́.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: yọ … kúrò / láti yọ … kúrò
  rationale: Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá fún mímú ohun tó dí ojú kúrò, ó sì pa ìbáramu ọ̀rọ̀ ìṣe méjèèjì mọ́.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó fi hàn pé ìṣe yìí gbọ́dọ̀ ṣáájú èkejì.
- source_word: δοκόν
  choice: ìtì igi
  rationale: δοκός túmọ̀ sí igi ńlá tí a lè lò gẹ́gẹ́ bí ìtì ilé. “Ìtì igi” pa àwòrán ohun ńlá tí a fi ṣe àsọdùn mọ́, ní ìyàtọ̀ sí κάρφος.
- source_word: διαβλέψεις
  choice: ìwọ yóò ríran kedere
  rationale: διαβλέπω ní ìtumọ̀ rírí dáadáa tàbí kedere; gbolohun yìí pa ìtumọ̀ àfikún yẹn mọ́.
- source_word: κάρφος
  choice: èérún
  rationale: κάρφος lè jẹ́ ẹ̀rún kékeré, èérún igi, tàbí ẹ̀ka koríko gbígbẹ. “Èérún” jẹ́ ohun kékeré tó lè wọ ojú, ó sì mú ìyàtọ̀ rẹ̀ sí ìtì igi hàn gbangba.
- source_word: ἀδελφοῦ
  choice: arákùnrin rẹ
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ẹyọ kan, ó sì túmọ̀ ní tààrà sí arákùnrin, bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó lè tọ́ka sí ẹnì kejì nínú àwùjọ ìgbàgbọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ìbátan akọ ἀδελφοῦ
  choice: arákùnrin rẹ
  alternative: ẹgbẹ́ rẹ tàbí ẹnì kejì
  rationale: A pa irú akọ ẹyọ kan tó wà nínú Gíríìkì mọ́ láì sọ ọ́ di ọ̀rọ̀ àpapọ̀. Èyí tún bá àyíká ìbáwí nípa bí ènìyàn ṣe ń dá ẹni tó sún mọ́ ọn lẹ́jọ́ mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. A fi “ìwọ” sínú àpèjúwe láti jẹ́ kí ìbáwí tààràtà náà ṣe kedere. A lo àmì ohùn níbi tó bá yẹ, a sì gbé àwọn àmì àlàyé ẹsẹ̀ sí ọ̀rọ̀ tí wọ́n ń ṣàlàyé gan-an.
