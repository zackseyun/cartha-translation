id: MAT.7.27
reference: Matthew 7:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: yo
  text: Òjò sì rọ̀[a], àwọn odò sì dé, àwọn afẹ́fẹ́ sì fẹ́, wọ́n sì kọlu ilé náà; ó sì wó lulẹ̀, ìwólulẹ̀ rẹ̀ sì tóbi gan-an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Òjò sì sọ̀kalẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì túmọ̀ ní tààrà sí “sọ̀kalẹ̀,” ṣùgbọ́n “òjò rọ̀” ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Òjò sì rọ̀
  rationale: Èyí ni ọ̀nà àdánidá jù lọ láti sọ ní Yorùbá pé òjò sọ̀kalẹ̀; ó mú ìtumọ̀ ìṣubú òjò wá láì jẹ́ kí gbólóhùn náà le.
- source_word: ἦλθον οἱ ποταμοί
  choice: àwọn odò sì dé
  rationale: ποταμοί túmọ̀ ní pàtàkì sí ‘àwọn odò.’ A pa àwòrán yẹn mọ́, bí ó tilẹ̀ jẹ́ pé ní àyíká yìí ó lè tọ́ka sí omi ìkún omi.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: àwọn afẹ́fẹ́ sì fẹ́
  rationale: Ìtumọ̀ tààrà, tó sì jẹ́ Yorùbá àdánidá fún fífẹ́ àwọn afẹ́fẹ́.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: wọ́n sì kọlu ilé náà
  rationale: ‘Kọlu’ fi agbára ìkọlù tí προσκόπτω ní nínú àyíká ìjì hàn, ó sì yẹ fún àwọn odò àti afẹ́fẹ́ gẹ́gẹ́ bí olùṣe pọ̀.
- source_word: ἔπεσεν
  choice: ó sì wó lulẹ̀
  rationale: Ní ti ilé, ‘wó lulẹ̀’ ni Yorùbá àdánidá fún píπτω, ó sì pa ìrọ̀rùn àti agbára gbólóhùn Gíríìkì mọ́.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: ìwólulẹ̀ rẹ̀ sì pọ̀ gidigidi
  rationale: ‘Ìwólulẹ̀’ bá ‘wó lulẹ̀’ mu, ó sì pa ìbátan ọ̀rọ̀ tó wà láàárín ἔπεσεν àti πτῶσις mọ́. ‘Pọ̀ gidigidi’ sọ titobi ìparun náà ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe lè fi líle àwòrán ìdájọ́ ní òpin àkàwé náà hàn
  choice: ìwólulẹ̀ rẹ̀ sì pọ̀ gidigidi
  alternative: ìparun rẹ̀ sì burú jáì
  rationale: A kò fi ọ̀rọ̀ ìdájọ́ ọjọ́ ìkẹyìn kún un. Ìtumọ̀ náà dúró lórí ohun tí Gíríìkì sọ—pé ìṣubú ilé náà tóbi—ó sì jẹ́ kí agbára ìkìlọ̀ àkàwé náà dúró láì túmọ̀ rẹ̀ ju ohun tó wà nínú ẹsẹ̀ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbo ènìyàn. Àtúnṣe ‘àwọn odò sì dé’ pa ìtumọ̀ gangan ti ποταμοί mọ́, nígbà tí àyíká ìjì ń jẹ́ kí àwòrán omi ìkún omi yé ẹni tó ń kà.
