id: MAT.7.6
reference: Matthew 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: yo
  text: Ẹ má ṣe fi ohun mímọ́ fún àwọn ajá,[a] ẹ má sì ju àwọn péálì yín síwájú àwọn ẹlẹ́dẹ̀, kí wọ́n má bàa tẹ àwọn péálì náà mọ́lẹ̀ lábẹ́ ẹsẹ̀ wọn, kí wọ́n sì yí padà fà yín ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a yà sí mímọ́.” Ọ̀rọ̀ Gíríìkì náà gbòòrò, kò sì sọ irú ohun mímọ́ náà ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ohun mímọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àpèjúwe aláìdánimọ̀ tí a lò gẹ́gẹ́ bí orúkọ; “ohun mímọ́” pa ìtumọ̀ rẹ̀ mọ́ ní ọ̀nà gbígbòòrò láìfi kún un pé ẹ̀kọ́, ohun ẹbọ, tàbí ohun mìíràn pàtó ni.
- source_word: κυσίν
  choice: àwọn ajá
  rationale: Èyí ni ìtumọ̀ tààrà, ó sì pa agbára àti ìbínú àpẹẹrẹ náà mọ́ láìrọ̀ ọ́.
- source_word: βάλητε
  choice: ju
  rationale: “Ju” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígbé ohun sọ sí ibì kan, ó sì bá βάλλω mu ní àyíká yìí.
- source_word: μαργαρίτας
  choice: àwọn péálì
  rationale: “Péálì” ni orúkọ tí ó wọ́pọ̀, tí ó ṣe kedere fún òkúta iyebíye yìí; ọ̀pọ̀ rẹ̀ ni a pa mọ́.
- source_word: χοίρων
  choice: àwọn ẹlẹ́dẹ̀
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún pigs ni “ẹlẹ́dẹ̀,” ó sì pa àpẹẹrẹ náà mọ́.
- source_word: μήποτε
  choice: kí wọ́n má bàa
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ìkìlọ̀ nípa ohun tí ó lè ṣẹlẹ̀ hàn lọ́nà Yorùbá àdánidá.
- source_word: καταπατήσουσιν ... ἐν τοῖς ποσὶν αὐτῶν
  choice: tẹ àwọn péálì náà mọ́lẹ̀ lábẹ́ ẹsẹ̀ wọn
  rationale: Ìtumọ̀ yìí mú ìṣe títẹ̀ mọ́lẹ̀ àti gbólóhùn nípa ẹsẹ̀ jáde kedere. A tún orúkọ “àwọn péálì” sọ dípò arọ́pò-orúkọ nítorí “wọ́n” lè ṣòro láti tọ́ka sí ohun aláìlẹ́mìí ní Yorùbá.
- source_word: στραφέντες
  choice: yípadà
  rationale: Ó fi ìṣe tí ó tẹ̀ lé títẹ péálì mọ́lẹ̀ hàn lọ́nà ṣókí àti àdánidá.
- source_word: ῥήξωσιν ὑμᾶς
  choice: fà yín ya
  rationale: Gbólóhùn náà pa àwòrán ìwà ipá ti rírọ tàbí fífà ènìyàn ya mọ́, láìsọ ọ́ di ìkọlù lásán.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ “ohun mímọ́,” “ajá,” “péálì,” àti “ẹlẹ́dẹ̀”
  choice: A pa gbogbo àpẹẹrẹ náà mọ́ láìṣàlàyé ẹni tàbí ohun tí ọkọọkan dúró fún.
  alternative: Kí a sọ “ohun mímọ́” di ẹ̀kọ́ mímọ́ tàbí ìhìn rere, kí a sì pe ajá àti ẹlẹ́dẹ̀ ní àwọn ènìyàn búburú tàbí ọ̀tá ìhìn rere.
  rationale: Ẹsẹ náà kò túmọ̀ àwọn àpẹẹrẹ rẹ̀ ní pàtó. Pípa wọn mọ́ bẹ́ẹ̀ ń dáàbò bo ìtumọ̀ gbígbòòrò àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó wà nínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. “Ẹ má ṣe … ẹ má sì …” fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ. Àwọn àmì ohùn ni a fi síbi tí ó yẹ, a sì pa ìrísí líle ti àwọn àpẹẹrẹ inú orísun mọ́.
