revisions:
- from: Nígbà náà ni èmi yóò sọ fún wọn ní gbangba pé, “Èmi kò mọ̀ yín rí[a]; ẹ kúrò lọ́dọ̀ mi, ẹ̀yin tí ẹ ń ṣe ohun tí kò bófin mu[b].”
  to: Nígbà náà ni èmi yóò sọ fún wọn ní gbangba pé, “Èmi kò mọ̀ yín rí[a]; ẹ kúrò lọ́dọ̀ mi, ẹ̀yin tí ẹ ń ṣe ìwà àìlófin[b].”
  rationale: 'The revision makes one targeted lexical improvement: ‘ìwà àìlófin’ more directly represents ἀνομία as lawlessness while retaining the participle’s sense of characteristic conduct through ‘ẹ ń ṣe.’ It retains the draft’s strong, natural renderings of the judicial declaration, absolute negation, relational ‘know,’ and command to depart. Footnote markers remain correctly attached to the clauses they explain.'
  reviewer_model: gpt-5.6-terra
