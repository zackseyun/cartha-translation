id: MAT.7.23
reference: Matthew 7:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: yo
  text: Nígbà náà ni èmi yóò sọ fún wọn ní gbangba pé, “Èmi kò mọ̀ yín rí[a]; ẹ kúrò lọ́dọ̀ mi, ẹ̀yin tí ẹ ń ṣe ìwà àìlófin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi kò dá yín mọ̀ rí.” Ọ̀rọ̀ Gíríìkì fún “mọ̀” lè túmọ̀ sí dídá ẹnì kan mọ̀ nínú ìbáṣepọ̀, kì í ṣe ìmọ̀ nípa ẹni lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀yin tí ẹ ń ṣe àìṣòdodo” tàbí “ẹ̀yin tí ẹ ń ṣe ìwà búburú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Nígbà náà ni
  rationale: Ó fi ìtẹ̀síwájú àkókò hàn ní ọ̀nà àdánidá nínú Yorùbá, ó sì so ọ̀rọ̀ yìí mọ́ ohun tí ó ṣáájú.
- source_word: ὁμολογήσω
  choice: èmi yóò sọ fún wọn ní gbangba
  rationale: Nínú àyíká ìdájọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí sísọ ohun kan ní gbangba àti láìfipamọ́, kì í ṣe jíjẹ́wọ́ ẹ̀ṣẹ̀.
- source_word: Οὐδέποτε
  choice: kò ... rí
  rationale: Ìṣètò Yorùbá yìí sọ ìkọ̀sílẹ̀ pátápátá pé kò ṣẹlẹ̀ nígbà kankan.
- source_word: ἔγνων
  choice: mọ̀ yín
  rationale: Ó pa àwòrán ìmọ̀ ẹni mọ́, tó lè ní ìtumọ̀ ìbáṣepọ̀ tàbí ìdánimọ̀, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- source_word: ἀποχωρεῖτε
  choice: ẹ kúrò lọ́dọ̀ mi
  rationale: Àṣẹ ìléni-kúrò ni ọ̀rọ̀ Gíríìkì náà; gbólóhùn Yorùbá yìí ṣe kedere, ó sì bá ohùn ọ̀rọ̀ tó lágbára mu.
- source_word: ἐργαζόμενοι
  choice: ẹ̀yin tí ẹ ń ṣe
  rationale: Àmì ‘ń’ fi ìṣe tó ń bá a lọ tàbí ìwà tí ó máa ń hù hàn.
- source_word: ἀνομίαν
  choice: ohun tí kò bófin mu
  rationale: Ó pa agbára ìtumọ̀ òfin inú ἀνομία mọ́ ní èdè Yorùbá tí òǹkàwé òde òní lè lóye, dípò lílo ọ̀rọ̀ ìwà búburú tó gbòòrò jù.
theological_decisions:
- issue: Ìtumọ̀ ‘Èmi kò mọ̀ yín rí’
  choice: A pa ọ̀rọ̀ ìbáṣepọ̀ náà mọ́ gẹ́gẹ́ bí ‘Èmi kò mọ̀ yín rí.’
  alternative: ‘Èmi kò dá yín mọ̀ rí’ tàbí ‘Èmi kò tẹ́wọ́ gbà yín rí.’
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà nípa mímọ ẹni, ṣùgbọ́n ó lè ní agbára ìdánimọ̀ nínú ìbáṣepọ̀. Yíyí i padà sí ‘tẹ́wọ́ gbà’ yóò tú ìṣòro ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò tú ní kedere.
- issue: Agbára ìtumọ̀ ἀνομία
  choice: A túmọ̀ ọ́ sí ‘ohun tí kò bófin mu.’
  alternative: ‘ìwà búburú’ tàbí ‘àìṣòdodo.’
  rationale: Èyí pa ìtumọ̀ ìkọ̀sílẹ̀ tàbí rírú òfin mọ́, láìdín un kù sí ẹ̀kọ́ ẹ̀sìn ẹ̀ka kan pàtó.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún gbogbo ènìyàn. ‘Ẹ kúrò lọ́dọ̀ mi’ ní ohùn àṣẹ tó lágbára láìdi ọ̀rọ̀ àtijọ́, ‘ohun tí kò bófin mu’ sì pa àwọ̀ òfin inú ọ̀rọ̀ Gíríìkì mọ́.
