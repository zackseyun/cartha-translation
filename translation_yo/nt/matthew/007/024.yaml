id: MAT.7.24
reference: Matthew 7:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: yo
  text: Nítorí náà, olúkúlùkù ẹni tí ó bá gbọ́ àwọn ọ̀rọ̀ mi wọ̀nyí, tí ó sì ṣe wọ́n, a ó fi wé ọkùnrin ọlọ́gbọ́n kan[a][b], ẹni tí ó kọ́ ilé rẹ̀ sórí àpáta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “yóò dàbí.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “ọkùnrin ọlọ́gbọ́n kan”; gírámà ìfiwéra náà jẹ́ ti akọ nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Nítorí náà, olúkúlùkù ẹni tí ó bá
  rationale: “Nítorí náà” fi ìtumọ̀ ìparí-àròyé οὖν hàn, “olúkúlùkù ẹni tí ó bá” sì mú agbára pínpín àti gbogbogbò Πᾶς ... ὅστις jáde ní Yorùbá àdánidá.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: gbọ́ àwọn ọ̀rọ̀ mi wọ̀nyí
  rationale: “Àwọn ọ̀rọ̀ mi wọ̀nyí” jẹ́ ìtumọ̀ tààrà fún τοὺς λόγους τούτους pẹ̀lú μου, “gbọ́” sì pa àwòrán gbígbọ́ mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: καὶ ποιεῖ αὐτούς
  choice: tí ó sì ṣe wọ́n
  rationale: Èyí pa ìbáramu tààrà láàárín gbígbọ́ àwọn ọ̀rọ̀ náà àti ṣíṣe wọn mọ́; kò tú u sí “fi sílò” lọ́nà tí yóò ṣàlàyé ju orísun lọ.
- source_word: ὁμοιωθήσεται
  choice: a ó fi wé
  rationale: Ọ̀rọ̀ yìí fi ìṣe-ọ̀rọ̀ àìṣe-oníṣe ọjọ́ iwájú Gíríìkì hàn ní Yorùbá tó ṣe déédé, ó sì pa èrò ìfiwéra mọ́.
- source_word: ἀνδρὶ φρονίμῳ
  choice: ọkùnrin ọlọ́gbọ́n kan
  rationale: “Ọkùnrin” pa ìtọ́kasí akọ pàtó ti ἀνήρ mọ́, “ọlọ́gbọ́n” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ó ní ọgbọ́n àti ìwà ìṣọ́ra.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: kọ́ ilé rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ kedere àti àdánidá fún kíkọ́ ilé tí í ṣe tirẹ̀, ó sì pa àkàwé ilé mọ́.
- source_word: ἐπὶ τὴν πέτραν
  choice: sórí àpáta
  rationale: “Àpáta” jẹ́ ìbámu tààrà fún πέτρα, kò sì sọ irú àpáta tàbí ìpìlẹ̀ pàtó kan tí orísun kò sọ.
theological_decisions:
- issue: Èdè akọ nínú ẹni tí a fi ṣe àpẹẹrẹ
  choice: ọkùnrin ọlọ́gbọ́n kan
  alternative: ẹni ọlọ́gbọ́n kan
  rationale: Gíríìkì lo ἀνήρ, ìyẹn ọkùnrin ní pàtó. A pa akọ mọ́ nínú àpẹẹrẹ, nígbà tí “olúkúlùkù ẹni tí ó bá” ti fi hàn pé gbólóhùn àkọ́kọ́ kan gbogbo ènìyàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìtòlẹ́sẹẹsẹ náà dá ìbáṣepọ̀ gbígbọ́ àti ṣíṣe dúró, ó sì mú ìfiwéra ilé lórí àpáta yé ẹni navọ̀n láìṣàlàyé àkàwé náà ju orísun lọ.
