  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa. Ó pa ìfararọ κρίματι/κρίνετε/κριθήσεσθε mọ́ pẹ̀lú “ìdájọ́/dájọ́/dá ... lẹ́jọ́,” ó sì tún pa μέτρῳ/μετρεῖτε/μετρηθήσεται mọ́ pẹ̀lú “òṣùwọ̀n/wọ̀n/a ó fi wọ̀n.” Àkànlò “a ó” ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà Yorùbá láti sọ fáàbù aláìṣe láì dárúkọ ẹni tó ń ṣe ìṣe náà; nítorí náà, kò fi Ọlọ́run tàbí ènìyàn kan hàn gẹ́gẹ́ bí aṣojú ìdájọ́ náà. “Fún yín” fara mọ́ dátífù ὑμῖν, láì fi “padà” sínú ọ̀rọ̀ pàtàkì.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìgbàlódé tí ó ní ìgbọ́gbọ́n, ó sì yẹ fún ìforígbárí ìwé mímọ́. Àmì ohùn àti ìlò ẹ/yín wà ní ìbámu. Ìtẹ̀lé “... ni a ó fi ...” jẹ́ àdánidá, ó sì mú ìtumọ̀ ọ̀nà tàbí ìlànà tí ἐν ᾧ ń sọ hàn.
  terminology: “Ìdájọ́” àti “dájọ́” jẹ́ yíyan tó tọ́, nítorí wọn kò dín κρίνω kù sí “dálẹ́bi” nìkan. “Òṣùwọ̀n” àti “wọ̀n” pa àkàwé àti àtúnlò ọ̀rọ̀ orísun mọ́. Àlàyé ìsàlẹ̀ [a] sọ ní kedere pé “padà” kì í ṣe ọ̀rọ̀ tí Gíríìkì sọ ní tààrà, bí ó tilẹ̀ jẹ́ pé ìbáṣepọ̀ ìsanpadà wà nínú gbólóhùn náà.
