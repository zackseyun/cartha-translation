id: MAT.7.2
reference: Matthew 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: yo
  text: Nítorí ìdájọ́ tí ẹ fi ń dájọ́ ni a ó fi dá yín lẹ́jọ́, òṣùwọ̀n tí ẹ sì fi ń wọ̀n ni a ó fi wọ̀n fún yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá ìkẹyìn pé, “a ó fi wọ̀n padà fún yín.” Gíríìkì kò sọ “padà” ní tààrà, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ìdápadà wà nínú ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: ìdájọ́ / dájọ́ / dá ... lẹ́jọ́
  rationale: Àwọn ọ̀rọ̀ Yorùbá wọ̀nyí pa ìbátan ọ̀rọ̀ inú Gíríìkì mọ́, wọ́n sì ṣì ní ìtumọ̀ gbòòrò ti ṣíṣe ìdájọ́ láì dín un kù sí fífi ẹ̀bi kan ni.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: òṣùwọ̀n / wọ̀n / a ó fi wọ̀n
  rationale: Àṣàyàn yìí pa àtúnlò ọ̀rọ̀ àti àkàwé òṣùwọ̀n inú orísun mọ́ ní Yorùbá àdánidá.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: tí ẹ fi ... / tí ẹ fi ...
  rationale: ‘Fi’ sọ ohun èlò tàbí ìlànà tí a lò, ó sì mú kí ìfararọ àwọn gbólóhùn méjèèjì hàn kedere.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìkìlọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí rẹ̀.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó mú dátífù orísun jáde láì fi ọ̀rọ̀ ‘padà’ kún un nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ẹni tó ń ṣe ìdájọ́ ìdápadà náà
  choice: 'A lo àkànlò aláìdárúkọ ẹni: ‘a ó ...’'
  alternative: Ọlọ́run yóò dá yín lẹ́jọ́ / àwọn ẹlòmíràn yóò dá yín lẹ́jọ́
  rationale: Àwọn fáàbù Gíríìkì jẹ́ aláìṣe, wọn kò sì dárúkọ ẹni tó ń ṣe ìṣe náà. Yorùbá náà pa àìdánilójú yìí mọ́ láì pinnu bóyá Ọlọ́run tàbí ènìyàn ni.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ọ̀rọ̀-orúkọ ọlọ́pọ̀ ‘ẹ/yín’ tẹ̀ lé ẹni-kejì ọlọ́pọ̀ inú Gíríìkì, ìfararọ àwọn apá méjèèjì sì wà ní pípa mọ́.
