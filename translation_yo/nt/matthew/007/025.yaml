  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: yo
  text: Òjò sì rọ̀, àwọn odò sì dé[a], ẹ̀fúùfù sì fẹ́, wọ́n sì kọlu[b] ilé náà. Ilé náà kò sì wó, nítorí a ti gbé ìpìlẹ̀ rẹ̀ kalẹ̀ lórí àpáta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “àwọn ìkún omi sì dé”; ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “àwọn odò” ní pàtàkì.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì: “wọ́n sì ṣubú lu ilé náà” tàbí “wọ́n sì lù ú mọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Òjò sì rọ̀
  rationale: Èyí ni ọ̀nà àdánidá tí Yorùbá fi ń sọ pé òjò sọ̀kalẹ̀; ó pa ìtumọ̀ ìṣẹ̀lẹ̀ náà mọ́ láì lo ọ̀rọ̀ tí kò wọ́pọ̀.
- source_word: οἱ ποταμοί
  choice: àwọn odò
  rationale: Ó tẹ̀ lé ìtumọ̀ pàtàkì ti ποταμοί, èyí tí ó túmọ̀ sí ‘àwọn odò,’ dípò kí a pinnu rẹ̀ sí ‘ìkún omi’ nìkan.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: ẹ̀fúùfù sì fẹ́
  rationale: Yorùbá sábà máa ń lo ‘ẹ̀fúùfù’ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀; gbólóhùn yìí jẹ́ ti àdánidá, ó sì bá ìṣe ‘fẹ́’ mu.
- source_word: προσέπεσαν
  choice: ó sì kọlu
  rationale: ‘Kọlu’ sọ agbára tí ẹ̀fúùfù fi dojú kọ ilé náà ní ọ̀nà Yorùbá tí ó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gangan ‘ṣubú lé/lu mọ́’ mọ́.
- source_word: οὐκ ἔπεσεν
  choice: Ilé náà kò sì wó
  rationale: Ní ti ilé, ‘wó’ ni ọ̀nà Yorùbá àdánidá láti sọ pé ilé ṣubú tàbí bàjẹ́ lulẹ̀, láì fi ìtumọ̀ míì kún un.
- source_word: τεθεμελίωτο ἐπὶ τὴν πέτραν
  choice: a ti fi ìpìlẹ̀ rẹ̀ sọlẹ̀ lórí àpáta
  rationale: Ìtumọ̀ yìí pa àwòrán ìpìlẹ̀, ipò àṣeparí tó ti wà ṣáájú, àti ìṣe aláìlórúkọ ti ọ̀rọ̀ Gíríìkì náà mọ́.
theological_decisions:
- issue: Àwòrán àkàwé ti ìpìlẹ̀
  choice: lórí àpáta
  alternative: lórí àpáta abẹ́ ilẹ̀
  rationale: Ẹsẹ yìí kò fi ẹni tàbí ohun tí àpáta náà dúró fún hàn ní tààrà. ‘Lórí àpáta’ pa àwòrán àkàwé náà mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ sí i.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A lo ‘ẹ̀fúùfù’ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀, nítorí náà arọ́pò-orúkọ ẹyọ ‘ó’ tẹ̀ lé e ní ti gírámà Yorùbá.
