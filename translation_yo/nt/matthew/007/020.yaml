id: MAT.7.20
reference: Matthew 7:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: yo
  text: Nítorí náà[a], ẹ ó fi èso wọn mọ̀ wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà ní tòótọ́, láti inú èso wọn ni ẹ ó ti mọ̀ wọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα γε
  choice: Nítorí náà
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń fa ìparí kan jáde pẹ̀lú ìtẹnumọ́ díẹ̀; “Nítorí náà” jẹ́ ọ̀nà àdánidá, ọlọ́lá láti sọ èyí ní Yorùbá.
- source_word: ἀπὸ
  choice: fi
  rationale: Nínú àkópọ̀ “fi èso wọn mọ̀ wọ́n,” “fi” fi hàn pé èso náà ni ẹ̀rí tàbí ọ̀nà tí a fi dá wọn mọ̀, ó sì bá ìtumọ̀ ἀπὸ nínú àyíká yìí mu.
- source_word: καρπῶν
  choice: èso
  rationale: “Èso” pa àkàwé Gíríìkì mọ́, ó sì lè tọ́ka sí ohun tí ìwà tàbí iṣẹ́ ènìyàn mú jáde. Yorùbá kì í fi àmì ọ̀pọ̀ sí orúkọ yìí nígbà tí “wọn” ti fi ẹni tó ni ín hàn.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí àwọn ènìyàn tí a ń sọ̀rọ̀ nípa wọn, “wọn” sì jẹ́ ìtumọ̀ àdánidá fún ohun tí wọ́n ní.
- source_word: ἐπιγνώσεσθε
  choice: ẹ ó ... mọ̀
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú, ẹni kejì ọ̀pọ̀, ń sọ nípa dídá àwọn ènìyàn náà mọ̀ nípasẹ̀ ẹ̀rí tí a lè rí. “Ẹ ó ... mọ̀” jẹ́ àdánidá ní Yorùbá, ó sì pa agbára ọjọ́ iwájú mọ́.
- source_word: αὐτούς
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka padà sí àwọn ènìyàn náà, “wọ́n” sì bá a mu ní Yorùbá.
theological_decisions:
- issue: Lílo “èso” gẹ́gẹ́ bí àkàwé fún dídá ènìyàn mọ̀
  choice: Pa àkàwé “èso” mọ́ láì túmọ̀ rẹ̀ sí ìṣe tàbí àbájáde nínú ọ̀rọ̀ pàtàkì.
  alternative: ìṣe wọn; àbájáde wọn
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àkàwé èso. Pípa á mọ́ ń so ẹsẹ̀ yìí mọ́ àyíká rẹ̀, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tóóró kan kún un.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ẹ” fún ẹni kejì ọ̀pọ̀ gẹ́gẹ́ bí Gíríìkì ṣe rí.
