  source_fidelity: Ìtumọ̀ náà ṣètọ́ka sí ìpinnu tí ἄρα γε ń mú wá pẹ̀lú “Nítorí náà,” ó sì túmọ̀ ἀπὸ τῶν καρπῶν αὐτῶν ní ti ọ̀nà/ìpìlẹ̀ ìdánimọ̀ pẹ̀lú “fi èso wọn.” “Ẹ ó ... mọ̀ wọ́n” pa ọjọ́ iwájú ẹni-kejì ọ̀pọ̀ ti ἐπιγνώσεσθε mọ́, ó sì tọ́ka “wọ́n” dáadáa sí àwọn ènìyàn tí a ń jíròrò wọn.
  naturalness: “Nítorí náà, ẹ ó fi èso wọn mọ̀ wọ́n” jẹ́ Yorùbá òde-òní tó mọ́gbọ́n dání. Ìlò “fi ... mọ̀” jẹ́ ọ̀nà àdánidá láti sọ pé èso wọn ni ẹ̀rí tàbí ọ̀nà ìdánimọ̀. Àmì ohùn wà ní àwọn ibi tí ó yẹ.
  terminology: “Èso” dá àkàwé καρποί dúró láì sọ ọ́ di “ìṣe” tàbí “àbájáde,” èyí tó bá ọ̀rọ̀ ìpilẹ̀ mu, tí ó sì pa ìsopọ̀ rẹ̀ mọ́ àyíká ẹsẹ̀ náà. Ìkọ̀wé “èso wọn” lè ṣàfihàn ọ̀pọ̀ ní Yorùbá láì fi ìtumọ̀ Gíríìkì sílẹ̀.
