id: MAT.7.12
reference: Matthew 7:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: yo
  text: Nítorí náà, nínú gbogbo ohun tí ẹ bá fẹ́ kí àwọn ènìyàn[a] ṣe fún yín, ẹ̀yin náà, ẹ máa ṣe bẹ́ẹ̀ fún wọn; nítorí èyí ni Òfin àti Àwọn Wòlíì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ènìyàn ní gbogbogbòò, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα … ὅσα
  choice: ohun gbogbo tí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ní Gíríìkì ní ìtumọ̀ tó gba gbogbo ohun tí ó bá wà lábẹ́ ohun tí a ń sọ; ‘ohun gbogbo tí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìwọ̀n gbogbo rẹ̀ mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde tàbí ìparí èrò láti inú ẹ̀kọ́ tó ṣáájú.
- source_word: ὅσα ἐὰν θέλητε
  choice: tí ẹ bá fẹ́
  rationale: ‘Bá’ fi ìtumọ̀ àìdá ohun kan pàtó múlẹ̀, ó sì bá ìṣọ̀kan ἐὰν àti ọ̀rọ̀ ìṣe náà mu.
- source_word: οἱ ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ènìyàn ní gbogbogbòò, kì í ṣe akọ nìkan.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: ẹ̀yin náà ni kí ẹ máa ṣe fún wọn
  rationale: ‘Ẹ̀yin náà’ pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, ‘máa ṣe’ sì fi àṣà ìṣe tó ń bá a lọ hàn gẹ́gẹ́ bí àṣẹ ìsinsìnyí.
- source_word: οὗτος γάρ ἐστιν
  choice: nítorí èyí ni
  rationale: Ó pa ìdí tí γάρ ń fi hàn àti gbólóhùn ìdánimọ̀ ἐστιν mọ́ láì fi àlàyé mìíràn kún un.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Òfin àti Àwọn Wòlíì
  rationale: A pa àkójọpọ̀ ọ̀rọ̀ Mátíù àti ti Júù yìí mọ́ gẹ́gẹ́ bí ìtọ́ka sí àwọn ẹ̀ka Ìwé Mímọ́, dípò kí a sọ ọ́ di àlàyé ẹ̀kọ́ kan.
theological_decisions:
- issue: Ìtumọ̀ gbogbogbòò ti ἄνθρωποι
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Àṣẹ náà kan ìbáṣepọ̀ pẹ̀lú gbogbo ènìyàn; kò sí ohun nínú ọ̀rọ̀ tàbí àyíká tó fi ìtumọ̀ rẹ̀ mọ́ akọ nìkan.
- issue: Ìwọ̀n ìtumọ̀ ‘Òfin àti Àwọn Wòlíì’
  choice: A pa á mọ́ gẹ́gẹ́ bí àkójọpọ̀ ìtọ́ka sí Ìwé Mímọ́
  alternative: gbogbo ẹ̀kọ́ ìwà rere inú Ìwé Mímọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà lo àkójọpọ̀ gbajúmọ̀ yìí ní tààrà; fífi í sílẹ̀ bẹ́ẹ̀ pa ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ibi mìíràn nínú Mátíù àti ìtumọ̀ ẹ̀sìn rẹ̀ mọ́ láì túmọ̀ rẹ̀ rékọjá ohun tí a kọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ̀yin … ẹ’ fi hàn pé arọ́pò-orúkọ ẹni kejì jẹ́ ọ̀pọ̀ nínú Gíríìkì; ‘kí ẹ máa ṣe’ jẹ́ àṣẹ àṣà ìgbésí ayé, kì í ṣe ìṣe ẹ̀ẹ̀kan ṣoṣo.
