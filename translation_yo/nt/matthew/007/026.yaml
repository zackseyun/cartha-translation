id: MAT.7.26
reference: Matthew 7:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: yo
  text: Gbogbo ẹni tí ó bá gbọ́ àwọn ọ̀rọ̀ mi wọ̀nyí, tí kò sì ṣe wọ́n, yóò dà bí ọkùnrin aṣiwèrè kan,[a] tí ó kọ́ ilé rẹ̀ lórí iyanrìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni aṣiwèrè kan.” Gíríìkì ní “ọkùnrin aṣiwèrè,” ó sì lo ọ̀rọ̀ akọ gẹ́gẹ́ bí aṣojú nínú àfiwé náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: Gbogbo ẹni tí ó bá gbọ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni láìsí àfiwé; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìṣe gbígbọ́ tí ó wà nínú Gíríìkì mọ́.
- source_word: μου τοὺς λόγους τούτους
  choice: àwọn ọ̀rọ̀ tèmi wọ̀nyí
  rationale: Èyí pa ìtẹnumọ́ ọ̀rọ̀-atọ́ka náà àti ìbátan ohun-ìní mọ́; “ọ̀rọ̀” ni ìtumọ̀ pẹ̀lẹ́bẹ̀ λόγοι níbí.
- source_word: μὴ ποιῶν αὐτούς
  choice: tí kò sì ṣe wọ́n
  rationale: “Ṣe wọ́n” tẹ̀lé ποιέω ní tààrà, ó sì túmọ̀ sí mímú ohun tí a gbọ́ ṣẹ nínú ìṣe láìfi àlàyé àfikún sínú ẹsẹ̀ náà.
- source_word: ὁμοιωθήσεται
  choice: yóò dà bí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfiwé tí ọ̀rọ̀ Gíríìkì ọjọ́ iwájú náà ń ṣe.
- source_word: ἀνδρὶ μωρῷ
  choice: ọkùnrin òmùgọ̀ kan
  rationale: ἀνήρ tọ́ka sí ọkùnrin, μωρός sì túmọ̀ sí ẹni tí kò ní ọgbọ́n; “òmùgọ̀” jẹ́ yíyan tó ṣe kedere, tó sì bá ọ̀rọ̀ àfiwé náà mu.
- source_word: ὅστις
  choice: ẹni tí
  rationale: Ó ṣàlàyé ọkùnrin tí a fi ṣe àfiwé; “ẹni tí” jẹ́ àsopọ̀ Yorùbá tó ṣe déédé.
- source_word: ᾠκοδόμησεν
  choice: ó kọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkọ́ ilé; “kọ́” ni ọ̀rọ̀ Yorùbá tó rọrùn, tó sì péye.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: ilé rẹ̀
  rationale: οἰκία jẹ́ ilé gẹ́gẹ́ bí ohun tí a kọ́ nínú àkàwé náà, αὐτοῦ sì fi hàn pé ilé tirẹ̀ ni.
- source_word: ἐπὶ τὴν ἄμμον
  choice: sórí iyanrìn
  rationale: Èyí pa àwòrán pípìlẹ̀ ilé lórí iyanrìn mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Èdè akọ tí a lò gẹ́gẹ́ bí aṣojú nínú àfiwé
  choice: ọkùnrin òmùgọ̀ kan
  alternative: ẹni òmùgọ̀ kan
  rationale: Gíríìkì lo ἀνδρί, orúkọ akọ kan ṣoṣo, bí ó tilẹ̀ jẹ́ pé ìkìlọ̀ náà kan gbogbo ẹni tí ó gbọ́ tí kò sì ṣe. A pa akọ mọ́ nínú àfiwé, a sì fi àlàyé kúkúrú sí àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtòlẹ́sẹẹsẹ gbolohun jẹ́ àdánidá, ṣùgbọ́n ó pa ìfiwé, àkókò ọjọ́ iwájú, àti ọ̀rọ̀ akọ inú orísun Gíríìkì mọ́.
