- from: Ẹ ó fi èso wọn mọ̀ wọ́n.[a] Ǹjẹ́ a máa ń ká èso àjàrà lára ẹ̀gún, tàbí èso ọ̀pọ̀tọ́ lára èpò ẹlẹ́gùn-ún?[b]
  to: Ẹ ó dá wọn mọ̀ nípa èso wọn.[a] Ǹjẹ́ a máa ń ká èso àjàrà lára àwọn igi ẹ̀gún, tàbí èso ọ̀pọ̀tọ́ lára àwọn èpò tó ní ẹ̀gún?[b]
  rationale: Àtúnṣe náà mú ìtumọ̀ ἐπιγνώσεσθε hàn ní Yorùbá tó dára (‘dá wọn mọ̀’), ó sì rọ́pò ọ̀rọ̀ tí kò kedere fún τρίβολοι pẹ̀lú àpèjúwe tí ó wọ́pọ̀. Ó pa àwòrán iṣẹ́ àgbẹ̀, ìyàtọ̀ láàárín ẹ̀gún àti èpò ẹlẹ́gùn, àti agbára ìbéèrè àsọyé Gíríìkì mọ́.
