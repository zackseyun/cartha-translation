  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ Gíríìkì mọ́: ọjọ́ iwájú fún ìdánimọ̀ ènìyàn nípasẹ̀ ‘èso’ wọn, àti ìbéèrè àsọyé tí ń retí ìdáhùn òdì. Síbẹ̀, ‘èpò ẹlẹ́gùn-ún’ kò ṣe kedere tàbí dán mọ́rán nínú Yorùbá òde òní, ó sì yẹ kí a tún gbolóhùn àkọ́kọ́ ṣe kí ìtumọ̀ ‘recognize’ hàn gbangba.'
  naturalness: ‘Ẹ ó dá wọn mọ̀ nípa èso wọn’ jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tó sì dájú fún ‘you will recognize them by their fruits.’ ‘Àwọn èpò tó ní ẹ̀gún’ jẹ́ àpèjúwe àdánidá, kedere fún ohun ọ̀gbìn ẹlẹ́gùn, láì sọ irú ọ̀gbìn pàtó kan di dandan.
