id: MAT.7.16
reference: Matthew 7:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: yo
  text: Ẹ ó dá wọn mọ̀ nípa èso wọn.[a] Ǹjẹ́ a máa ń ká èso àjàrà lára àwọn igi ẹ̀gún, tàbí èso ọ̀pọ̀tọ́ lára àwọn èpò tó ní ẹ̀gún?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ ó mọ̀ wọ́n nípa èso wọn.”
    reason: lexical_alternative
  - marker: b
    text: 'Ìbéèrè yìí ń retí ìdáhùn òdì: a kì í ká èso àjàrà lára àwọn igi ẹ̀gún, bẹ́ẹ̀ ni a kì í ká èso ọ̀pọ̀tọ́ lára àwọn èpò tó ní ẹ̀gún.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: èso
  rationale: Ọ̀rọ̀ yìí lè jẹ́ ọ̀pọ̀ nínú Gíríìkì, ṣùgbọ́n ‘èso’ jẹ́ ọ̀rọ̀ àkójọpọ̀ tó bá èdè Yorùbá mu, ó sì pa àwòrán ohun tí igi ń mú jáde mọ́.
- source_word: ἐπιγνώσεσθε
  choice: Ẹ ó fi ... mọ̀
  rationale: Ó túmọ̀ sí pé àwọn olùgbọ́ yóò dá irú ẹni tí wọ́n jẹ́ mọ̀ nípasẹ̀ ohun tí wọ́n ń mú jáde; ọ̀rọ̀ yìí kò fi ‘mọ̀ pátápátá’ kún un.
- source_word: μήτι
  choice: Ǹjẹ́ a máa ń ...?
  rationale: Ìbéèrè àsọyé yìí ń retí ìdáhùn òdì; ìlò ‘Ǹjẹ́ a máa ń’ jẹ́ ti ẹ̀dá Yorùbá, kò sì sọ ìdáhùn náà jáde sínú ẹsẹ̀.
- source_word: συλλέγουσιν
  choice: ká
  rationale: ‘Ká’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún kíkó tàbí pípọ́n èso jọ.
- source_word: ἀκανθῶν
  choice: ẹ̀gún
  rationale: Ó pa ìtumọ̀ ohun ọ̀gbìn ẹlẹ́gùn mọ́ ní ọ̀nà kúkúrú, tí ó sì bá ìfiwéra náà mu.
- source_word: σταφυλάς
  choice: èso àjàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún grapes.
- source_word: τριβόλων
  choice: èpò ẹlẹ́gùn-ún
  rationale: Ọ̀rọ̀ Gíríìkì ń tọ́ka sí irú èpò tàbí ohun ọ̀gbìn tó ní ẹ̀gún; yíyan ọ̀rọ̀ àpèjúwe yìí yẹra fún fífi dájú pé irú ọ̀gbìn pàtó kan ni.
- source_word: σῦκα
  choice: èso ọ̀pọ̀tọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá fún figs, ó sì mú àwòrán iṣẹ́ àgbẹ̀ náà dúró.
- source_word: αὐτῶν / αὐτούς
  choice: wọn / wọ́n
  rationale: Àwọn arọ́pò-orúkọ náà ń tọ́ka sí àwọn ènìyàn tí a ń sọ̀rọ̀ nípa wọn, kì í ṣe sí àwọn ohun ọ̀gbìn.
theological_decisions:
- issue: Ìtumọ̀ àpẹẹrẹ ‘èso’ gẹ́gẹ́ bí ohun ìdánimọ̀ ènìyàn
  choice: Pa àpẹẹrẹ ‘èso’ mọ́ láì túmọ̀ rẹ̀ sí ‘ìṣe’ tàbí ‘àbájáde.’
  alternative: ‘Ẹ ó fi ìṣe wọn mọ̀ wọ́n’ tàbí ‘Ẹ ó fi àbájáde ohun tí wọ́n ń ṣe mọ̀ wọ́n.’
  rationale: Ọ̀rọ̀ orísun lo àwòrán iṣẹ́ àgbẹ̀, ó sì yẹ kí ìtumọ̀ náà jẹ́ kí àwòrán àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn rẹ̀ dúró láì dín un sí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ ó’ bá ọ̀pọ̀ ènìyàn tí ọ̀rọ̀ náà ń bá sọ̀rọ̀ mu; ‘a máa ń’ mú ìbéèrè àsọyé náà dun bí òwe tàbí òtítọ́ gbogbogbò ní Yorùbá.
