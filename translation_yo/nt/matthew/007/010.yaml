id: MAT.7.10
reference: Matthew 7:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: yo
  text: Tàbí bí ọmọ rẹ̀ bá béèrè fún ẹja lọ́wọ́ rẹ̀—ṣé yóò fún un ní ejò?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ pé, “kò ní fún un ní ejò, àbí?”
    reason: previous_rendering
lexical_decisions:
- source_word: ἢ καὶ
  choice: Tàbí bí
  rationale: Ó ń mú àpẹẹrẹ kejì wọlé nínú ọ̀wọ́ ìbéèrè méjì; ‘Tàbí bí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láì fi ìtumọ̀ àfikún sí καί.
- source_word: ἰχθὺν
  choice: ẹja
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹja gẹ́gẹ́ bí oúnjẹ nínú àyíká ilé yìí.
- source_word: αἰτήσει
  choice: bá béèrè ... lọ́wọ́ rẹ̀
  rationale: Ìṣe ọjọ́ iwájú Gíríìkì ń ṣiṣẹ́ bí àpẹẹrẹ gbogbogbò; àtòjọ ‘bí ... bá’ ni Yorùbá ń lò lọ́nà àdánidá fún irú ipò bẹ́ẹ̀.
- source_word: μὴ
  choice: kò ní ... àbí?
  rationale: μή fi hàn pé ìbéèrè náà ń retí ìdáhùn òdì; ìparí ‘àbí?’ pa agbára ìbéèrè àsọ̀rọ̀ náà mọ́.
- source_word: ὄφιν
  choice: ejò
  rationale: ‘Ejò’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ὄφις nínú àyíká yìí.
- source_word: ἐπιδώσει
  choice: fún un ní
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífúnni; ‘fún un ní’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: αὐτῷ
  choice: un
  rationale: Arọ́pò-orúkọ ẹni kẹta ni, ó sì ń tọ́ka sí ọmọ náà gẹ́gẹ́ bí ẹni tí a ó fún ní ohun náà.
theological_decisions:
- issue: Agbára ìbéèrè àsọ̀rọ̀
  choice: Kò ní fún un ní ejò, àbí?
  alternative: Dájúdájú, kò ní fún un ní ejò.
  rationale: μή nínú ìbéèrè tààrà ń retí ìdáhùn òdì. Fífi ‘àbí?’ parí rẹ̀ ń pa ìrísí àti agbára ìbéèrè Jesu mọ́ láì sọ ọ́ di gbólóhùn lasan.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ọmọ rẹ̀’ mú ẹni tí àpẹẹrẹ náà ń tọ́ka sí ṣe kedere láti inú ẹsẹ tó ṣáájú, nígbà tí fáàgùn gígùn náà pa ìyípadà àsọ̀rọ̀ Gíríìkì mọ́.
