source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni gbogbo igi rere ń so èso rere, ṣùgbọ́n igi tí ó bàjẹ́ ń so èso búburú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà
  rationale: Ó fi ìparí tàbí àfiwé tí ó tẹ̀ lé àpẹẹrẹ inú ẹsẹ̀ ṣáájú hàn ní Yorùbá àdánidá.
- source_word: πᾶν δένδρον
  choice: gbogbo igi
  rationale: Ó pa ìtumọ̀ pínpín ti πᾶν pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ mọ́, ó sì bá ọ̀nà Yorùbá mu.
- source_word: ἀγαθὸν
  choice: rere
  rationale: “Rere” fi ìwà tàbí ipò igi tí ó dára hàn, ó sì bá “èso rere” ṣe àfiwé ní kedere.
- source_word: καρποὺς καλοὺς
  choice: èso rere
  rationale: Ní àwòrán igi àti èso yìí, “èso rere” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó túmọ̀ sí èso tí ó dára, láìsọ ìtumọ̀ ìwà rere di pàtó jù.
- source_word: ποιεῖ
  choice: ń so
  rationale: Bí ó tilẹ̀ jẹ́ pé ποιέω túmọ̀ ní pàtàkì sí “ṣe,” ọ̀rọ̀ tí Yorùbá máa ń lò fún igi tí ń mú èso jáde ni “so èso.”
- source_word: τὸ δὲ
  choice: ṣùgbọ́n
  rationale: δέ ń fi ìyàtọ̀ láàárín igi méjèèjì hàn; “ṣùgbọ́n” mú ìtakora náà jáde kedere.
- source_word: σαπρὸν
  choice: jíjẹrà
  rationale: “Jíjẹrà” pa àwòrán ohun tí ó ti bàjẹ́ tàbí rà mọ́, ó sì ṣe pàtó ju “búburú” lọ fún igi.
- source_word: καρποὺς πονηροὺς
  choice: èso búburú
  rationale: “Èso búburú” bá àwòrán iṣẹ́ àgbẹ̀ mu ní ti ẹ̀dá, nígbà tí àyíká ọ̀rọ̀ ṣì lè fi ìtumọ̀ ìwà búburú rẹ̀ hàn.
theological_decisions:
- issue: Agbára àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ ìwà rere tàbí búburú
  choice: A pa àwòrán igi àti èso mọ́ láìṣàlàyé ìlò rẹ̀ nípa ìwà nínú ẹsẹ̀ náà.
  alternative: Lílo ọ̀rọ̀ ìtumọ̀ sí i bí “igi oníwà rere” tàbí “èso ìwà búburú.”
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ àkàwé náà, kò sì túmọ̀ rẹ̀ ní tààrà. Àyíká ìkìlọ̀ nípa àwọn wòlíì èké ni yóò jẹ́ kí agbára ìtumọ̀ ìwà rẹ̀ hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ àdánidá àti ọ̀wọ̀; a lo “ń so èso” gẹ́gẹ́ bí ìsọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún igi tí ń mú èso jáde. Àmì ohùn kún ibi tí ó yẹ.
