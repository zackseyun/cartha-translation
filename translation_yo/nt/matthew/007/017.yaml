  to: Bẹ́ẹ̀ ni gbogbo igi rere ń so èso rere, ṣùgbọ́n igi tí ó bàjẹ́ ń so èso búburú.
  rationale: 'A ṣe ìtúnṣe kékeré fún ìbámu pẹ̀lú ìlò Yorùbá boṣewa: a yí ọ̀rọ̀ ìbẹ̀rẹ̀ sí ‘Bẹ́ẹ̀ ni,’ a sì rọ́pò àpèjúwe tí kò wọ́pọ̀ ‘igi jíjẹrà’ pẹ̀lú ‘igi tí ó bàjẹ́.’ Kò sí ìtumọ̀ ẹ̀kọ́ ìsìn tí a fi kún un, a sì pa àìdájú ìlò àwòrán Gíríìkì mọ́. Kò nílò akọsílẹ̀ ìsàlẹ̀ fún ìtumọ̀ Yorùbá yìí.'
  reviewer_model: gpt-5.6-terra
