  terminology: A pa ‘igi rere / èso rere’ mọ́ fún ἀγαθός àti καλός, láìfipá sọ ìtumọ̀ ìwà di pàtó. ‘Igi tí ó bàjẹ́’ yẹ fún σαπρός, ‘èso búburú’ sì jẹ́ ìbámu àdánidá fún καρποὺς πονηρούς nínú àwòrán iṣẹ́ àgbẹ̀.
