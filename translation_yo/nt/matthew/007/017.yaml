review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tọ́ka sí gbogbo àwọn apá Gíríìkì pàtàkì: ìfẹ̀sípò/àbájáde (οὕτως), ìpínpín ‘gbogbo igi,’ ìyàtọ̀ ‘ṣùgbọ́n,’ àti àwòrán igi–èso náà. Ṣùgbọ́n ‘igi jíjẹrà’ kì í ṣe ọ̀nà tí ó rọrùn jù lọ nínú Yorùbá òde òní fún σαπρόν; ‘igi tí ó bàjẹ́’ jẹ́ kedere, ó sì pa ìtumọ̀ ‘spoiled/rotten’ mọ́.'
