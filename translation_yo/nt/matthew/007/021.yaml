id: MAT.7.21
reference: Matthew 7:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: yo
  text: Kì í ṣe gbogbo ẹni tí ń wí fún mi pé, “Olúwa, Olúwa,” ni yóò wọ ìjọba ọ̀run[a], ṣùgbọ́n ẹni tí ń ṣe ìfẹ́ Baba mi tí ó wà ní ọ̀run[b] ni yóò wọ̀ ọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ìjọba àwọn ọ̀run.” Mátíù sábà máa ń lo gbólóhùn yìí níbi tí àwọn àyíká míì ti máa ń sọ “ìjọba Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn ọ̀run” (ọ̀pọ̀ nọ́ńbà), gẹ́gẹ́ bí ó ti rí nínú gbólóhùn “ìjọba àwọn ọ̀run” ní ìbẹ̀rẹ̀ ẹsẹ̀ náà; a túmọ̀ ọ́ sí “ọ̀run” gẹ́gẹ́ bí Yorùbá àdánidá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Kì í ṣe gbogbo ẹni tí ń sọ fún mi pé
  rationale: 'Ìtumọ̀ yìí pa ìsẹ́-òdì apá kan mọ́: ‘kì í ṣe gbogbo ẹni,’ kì í ṣe ‘kò sí ẹni.’ Ọ̀rọ̀ ‘tí ń sọ’ tún fi ìṣe gbogbogbò tàbí tí ń lọ lọ́wọ́ hàn lọ́nà Yorùbá àdánidá.'
- source_word: Κύριε κύριε
  choice: Olúwa, Olúwa
  rationale: ‘Olúwa’ ni ìbámu tó wọ́pọ̀ fún κύριος ní àyíká yìí. A pa àtúnwí ọ̀rọ̀ ìpè náà mọ́ nítorí ìtẹnumọ́ rẹ̀.
- source_word: εἰσελεύσεται
  choice: ni yóò wọ
  rationale: Ó tú ọjọ́-ọ̀la ọ̀rọ̀ Gíríìkì náà sí Yorùbá tó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: wọ ìjọba ọ̀run
  rationale: ‘Ìjọba ọ̀run’ jẹ́ ọ̀nà Yorùbá àdánidá àti èyí tí a mọ̀ dáadáa fún gbólóhùn Mátíù yìí; àlàyé ìsàlẹ̀ ojú ewé tọ́ka sí ọ̀pọ̀ nọ́ńbà ‘àwọn ọ̀run’ nínú Gíríìkì.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: ṣùgbọ́n ẹni tí ń ṣe
  rationale: Ó pa ìyàtọ̀ láàárín sísọ àti ṣíṣe mọ́, ó sì tú ẹ̀ka ọ̀rọ̀ Gíríìkì tí ó dúró bí orúkọ sí Yorùbá àdánidá.
- source_word: τὸ θέλημα
  choice: ìfẹ́
  rationale: Nínú àyíká ìwà rere àti ẹ̀kọ́ nípa Ọlọ́run yìí, ‘ìfẹ́’ tú ète tàbí ohun tí Baba fẹ́ kí a ṣe, láìdín un kù sí ìmọ̀lára ìfẹ́kúfẹ̀ẹ́.
- source_word: τοῦ πατρός μου
  choice: Baba mi
  rationale: Ó pa ìbáṣepọ̀ ọmọ àti Baba tí Jésù sọ mọ́ ní tààràtà, láìfi ọ̀rọ̀ ‘ti ọ̀run’ kún orúkọ náà.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: tí ó wà ní ọ̀run
  rationale: Ó jẹ́ Yorùbá àdánidá fún gbólóhùn àpèjúwe tí ó ń tọ́ka sí Baba; àlàyé ìsàlẹ̀ ojú ewé pa nọ́ńbà ọ̀pọ̀ Gíríìkì mọ́ fún òǹkàwé.
theological_decisions:
- issue: Wíwọ ìjọba ní ìbámu pẹ̀lú jíjẹ́wọ́ ẹnu àti ìgbọràn
  choice: Ẹsẹ̀ náà fi pípe Jésù ní ‘Olúwa’ lásán yàtọ̀ sí ṣíṣe ìfẹ́ Baba, láìfi gbogbo ètò ẹ̀kọ́ ìgbàlà kan sínú ẹsẹ̀ yìí.
  alternative: Kí a túmọ̀ ọ́ gẹ́gẹ́ bí ìgbàlà nípa iṣẹ́ nìkan, tàbí pé jíjẹ́wọ́ ẹnu nìkan tó fún ìgbàlà.
  rationale: Gíríìkì fi sísọ àti ṣíṣe wé ara wọn ní kedere, ṣùgbọ́n ẹsẹ̀ náà nìkan kò ṣàlàyé gbogbo ẹ̀kọ́ nípa ìdáláre. Ìtumọ̀ náà pa ìkìlọ̀ àti ìforígbárí ẹ̀kọ́ Ọlọ́run yìí mọ́ láìyanju rẹ̀ ní ti ẹ̀ya ìsìn kan.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. A tún ọ̀rọ̀-ìṣe ‘ni yóò wọ̀ ọ́’ sọ ní ẹ̀ka kejì fún ìtumọ̀ Yorùbá tó péye, bó tilẹ̀ jẹ́ pé Gíríìkì fi í sílẹ̀ láti inú ìtumọ̀ ẹ̀ka àkọ́kọ́.
