id: MAT.7.22
reference: Matthew 7:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn ni yóò sọ fún mi ní ọjọ́ náà pé, ‘Olúwa, Olúwa, ṣé kì í ṣe ní orúkọ rẹ ni a ti sọ àsọtẹ́lẹ̀, tí a sì ti lé àwọn ẹ̀mí èṣù jáde ní orúkọ rẹ, tí a sì ti ṣe ọ̀pọ̀ iṣẹ́ agbára ní orúkọ rẹ?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ṣe ọ̀pọ̀ iṣẹ́ ìyanu” tàbí “ṣe ọ̀pọ̀ iṣẹ́ tí ó fi agbára hàn.” Ní tààràtà, gbólóhùn Gíríìkì náà ń sọ nípa ọ̀pọ̀ “agbára”; nínú àwọn Ìhìn Rere, ọ̀rọ̀ yìí sábà máa ń tọ́ka sí àwọn iṣẹ́ ìyanu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù ọ̀pọ̀ tí a lò bí orúkọ; fífi “ènìyàn” kún un jẹ́ ọ̀nà Yorùbá àdánidá láti sọ “many” nípa àwọn ènìyàn.
- source_word: ἐροῦσίν μοι
  choice: ni yóò sọ fún mi
  rationale: Ó pa ìṣe ọjọ́ iwájú àti ẹni tí a ń bá sọ mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ní ọjọ́ náà
  rationale: Èyí ni gbólóhùn àkókò Yorùbá tó bá ọ̀rọ̀ Gíríìkì mu, láì túmọ̀ ọ́ sí “ọjọ́ ìdájọ́” nínú ẹsẹ̀.
- source_word: Κύριε κύριε
  choice: Olúwa, Olúwa
  rationale: Ó pa àtúnlò ìpè náà àti ìtẹnumọ́ rẹ̀ mọ́, ó sì jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún κύριος níbi yìí.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: ṣe kì í ṣe ... ni àwa ti sọ àsọtẹ́lẹ̀
  rationale: Ìbéèrè Gíríìkì náà ń retí ìdáhùn bẹ́ẹ̀ ni; ìṣètò “ṣe kì í ṣe ... ni” fi ìtumọ̀ yẹn hàn ní Yorùbá.
- source_word: τῷ σῷ ὀνόματι
  choice: ní orúkọ rẹ / fi orúkọ rẹ
  rationale: Àwọn ọ̀nà méjèèjì jẹ́ àdánidá ní Yorùbá, wọ́n sì tọ́ka sí ṣíṣe nǹkan lábẹ́ àṣẹ tàbí nípa pípe orúkọ ẹni náà; àtúnlò mẹ́ta náà ni a pa mọ́.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: lé àwọn ẹ̀mí èṣù jáde
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún lílé àwọn ẹ̀mí búburú jáde, ó sì bá ìtumọ̀ ἐκβάλλω mu.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: ṣe ọ̀pọ̀ iṣẹ́ agbára
  rationale: Ó pa ìbáṣepọ̀ δύναμις pẹ̀lú agbára mọ́, láì fi dandan sọ pé gbogbo wọn jẹ́ “iṣẹ́ ìyanu”; àlàyé ìtumọ̀ mìíràn wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ κύριος nígbà tí wọ́n ń bá Jésù sọ̀rọ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìtumọ̀ oyè náà àti ìwúwo rẹ̀ nípa ẹni tí Jésù jẹ́ mọ́, láì fi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ọjọ́ ìkẹyìn nínú “ọjọ́ náà”
  choice: ní ọjọ́ náà
  alternative: ní ọjọ́ ìdájọ́
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ìdájọ́ ìkẹyìn, ṣùgbọ́n Gíríìkì sọ “ọjọ́ náà” nìkan; a pa ìfihàn tí kò sọ gbogbo rẹ̀ ní gbangba mọ́.
- issue: Ìtumọ̀ δυνάμεις gẹ́gẹ́ bí iṣẹ́ agbára tàbí iṣẹ́ ìyanu
  choice: ọ̀pọ̀ iṣẹ́ agbára
  alternative: ọ̀pọ̀ iṣẹ́ ìyanu
  rationale: “Iṣẹ́ agbára” sun mọ́ ìtumọ̀ ọ̀rọ̀ Gíríìkì, ó sì yàgò fún pípinnu pé “iṣẹ́ ìyanu” nìkan ni ó túmọ̀ sí, bí ó tilẹ̀ jẹ́ pé ìlò rẹ̀ nínú àwọn Ìhìn Rere sábà máa ń tọ́ka sí iṣẹ́ ìyanu.
translation_notes:
  register: Yorùbá ìpele àárín, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa àtúnlò “orúkọ rẹ” àti “Olúwa, Olúwa” mọ́ fún agbára ọ̀rọ̀.
