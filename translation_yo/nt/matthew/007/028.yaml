  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà: ìparí ọ̀rọ̀ Jésù àti ìyàlẹ́nu àwọn ènìyàn sí ẹ̀kọ́ rẹ̀. Síbẹ̀, “àwọn èrò” kì í ṣe ọ̀nà tó dájú láti túmọ̀ οἱ ὄχλοι; ó lè túmọ̀ sí àwọn ìrònú, èrò inú, tàbí àwọn ènìyàn nínú ìlò kan, nítorí náà ó jẹ́ aláìmọ́gbọ́n sí ibi yìí. “Àwọn ènìyàn náà” jẹ́ kedere síi, bí ó tilẹ̀ jẹ́ pé ó ṣàpẹẹrẹ ẹgbẹ́ ènìyàn náà ní gbogbogbò.'
