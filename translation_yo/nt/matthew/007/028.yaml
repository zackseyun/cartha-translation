source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: yo
  text: Ó sì ṣẹlẹ̀ pé, nígbà tí Jésù ti parí àwọn ọ̀rọ̀ wọ̀nyí[a], àwọn ènìyàn náà yà lẹ́nu nípa ẹ̀kọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn àsọyé wọ̀nyí.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Ó sì ṣẹlẹ̀ pé nígbà tí
  rationale: Èyí pa ìlànà ọ̀rọ̀ ìtàn Gíríìkì mọ́ ní Yorùbá àdánidá, ó sì fi ìtẹ̀síwájú àti àkókò hàn.
- source_word: ἐτέλεσεν
  choice: parí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé Jésù mú àsọyé rẹ̀ dé òpin; ‘parí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: τοὺς λόγους τούτους
  choice: àwọn ọ̀rọ̀ wọ̀nyí
  rationale: ‘Àwọn ọ̀rọ̀ wọ̀nyí’ pa nọ́ńbà púpọ̀ àti agbára atọ́ka τούτους mọ́, láì fi àkọlé ìtumọ̀ bí ‘ìwàásù’ kún un.
- source_word: ἐξεπλήσσοντο
  choice: ya ... lẹ́nu
  rationale: Àpólà Yorùbá yìí sọ ìyàlẹ́nu líle tí ọ̀rọ̀ Gíríìkì náà ní; ó sì lè dúró fún ìhùwàsí àwùjọ tí imperfect náà ń ṣàpèjúwe.
- source_word: οἱ ὄχλοι
  choice: àwọn èrò náà
  rationale: ‘Àwọn èrò’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ̀pọ̀ àwọn ènìyàn tí wọ́n pé jọ, ó sì pa nọ́ńbà púpọ̀ mọ́.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ẹ̀kọ́ rẹ̀
  rationale: Nínú àpólà ‘ẹ̀kọ́ rẹ̀ ya wọn lẹ́nu,’ ẹ̀kọ́ náà ni ìdí tàbí ohun tó fa ìyàlẹ́nu, gẹ́gẹ́ bí ἐπί pẹ̀lú dative ṣe túmọ̀ sí níbí.
theological_decisions:
- issue: Ohun tí ‘àwọn ọ̀rọ̀ wọ̀nyí’ ń tọ́ka sí
  choice: A fi í ṣe atọ́ka sí ohun tí Jésù ṣẹ̀ṣẹ̀ kọ́ni, láì pe é ní ‘ìwàásù.’
  alternative: ‘àwọn ọ̀rọ̀ àsọyé wọ̀nyí’ tàbí ‘ìwàásù yìí’
  rationale: Gíríìkì sọ λόγους, kì í ṣe ọ̀rọ̀ pàtó fún ‘ìwàásù’; ìtumọ̀ náà yẹ kí ó yẹra fún fífi àkọlé ẹ̀kọ́ ìsìn tí orísun kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A yan ‘Ó sì ṣẹlẹ̀ pé nígbà tí’ láti pa àgbékalẹ̀ ìtàn orísun mọ́ láì lo àkànlò èdè àtijọ́.
