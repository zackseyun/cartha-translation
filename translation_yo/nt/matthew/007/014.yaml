id: MAT.7.14
reference: Matthew 7:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: yo
  text: Nítorí ẹnu-ọ̀nà náà tóóró, ọ̀nà tí ó sì lọ sí ìyè le; àwọn tí ń rí i kò sì pọ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: tóóró
  rationale: Ó túmọ̀ sí ohun tí kò fẹ̀, ó sì bá àpèjúwe ẹnu-ọ̀nà mu ní Yorùbá àdánidá.
- source_word: τεθλιμμένη
  choice: le
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ohun tí a ti há tàbí tí ìpọ́njú mú le. ‘Le’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìṣòro ọ̀nà náà mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: tí ó lọ sí ìyè
  rationale: Ó fi ìdarí ọ̀nà náà sí ibi àfojúsùn rẹ̀ hàn ní ṣókí, ó sì pa ‘ìyè’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì inú ẹsẹ náà.
- source_word: ὀλίγοι ... οἱ εὑρίσκοντες αὐτήν
  choice: àwọn tí ń rí i kò sì pọ̀
  rationale: Ìtúmọ̀ Yorùbá àdánidá fún pé àwọn olùṣàwárí/olùrí ọ̀nà náà kéré ní iye; ‘ń rí i’ pa ìṣe tí ó ń lọ lọ́wọ́ inú Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ τεθλιμμένη
  choice: le
  alternative: há / kún fún ìpọ́njú
  rationale: ‘Le’ pa àìrọ̀rùn àti ìṣòro ọ̀nà náà mọ́, bí ẹ̀rí orísun àti àtúnyẹ̀wò Gẹ̀ẹ́sì ṣe tọ́ka sí, láìdín ìtumọ̀ náà kù sí fífẹ̀ ọ̀nà nìkan tàbí láìsọ irú ìpọ́njú kan pàtó.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ adayeba, kedere, ṣókí, ó sì ní ìyì tó yẹ fún ọ̀rọ̀ Ìwé Mímọ́. A lo ‘ẹnu-ọ̀nà’ fún πύλη àti ‘ìyè’ fún ζωή.
