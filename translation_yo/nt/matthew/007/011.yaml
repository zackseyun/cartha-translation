  to: Nítorí náà, bí ẹ̀yin ènìyàn búburú bá mọ bí ẹ ṣe ń fún àwọn ọmọ yín ní àwọn ẹ̀bùn rere, ẹ̀wẹ̀ mélòó ni Baba yín tí ń bẹ ní àwọn ọ̀run[a] yóò túbọ̀ máa fún àwọn tí ń béèrè lọ́wọ́ rẹ̀ ní àwọn ohun rere[b]!
