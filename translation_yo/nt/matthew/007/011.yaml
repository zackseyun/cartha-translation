id: MAT.7.11
reference: Matthew 7:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: yo
  text: Nítorí náà, bí ẹ̀yin ènìyàn búburú bá mọ bí ẹ ṣe ń fún àwọn ọmọ yín ní àwọn ẹ̀bùn rere, ẹ̀wẹ̀ mélòó ni Baba yín tí ń bẹ ní àwọn ọ̀run[a] yóò túbọ̀ máa fún àwọn tí ń béèrè lọ́wọ́ rẹ̀ ní àwọn ohun rere[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, gẹ́gẹ́ bí a ti sábà máa ń sọ ọ́, “ní ọ̀run.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀: “ní àwọn ọ̀run.”'
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan ní “àwọn ẹ̀bùn rere” ní abala kejì, ṣùgbọ́n Gíríìkì sọ “àwọn ohun rere” lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: tí ẹ jẹ́ ẹni búburú
  rationale: Ó pa àpèjúwe Gíríìkì náà mọ́ ní tààrà, láì sọ ọ́ di ẹ̀kọ́ ìsìn tí ó gbòòrò ju ohun tí ẹsẹ náà sọ lọ; ó sì jẹ́ Yorùbá àdánidá.
- source_word: οἴδατε … διδόναι
  choice: mọ bí ẹ ṣe ń fún
  rationale: Ọ̀rọ̀ yìí sọ ìmọ̀ ọ̀nà tàbí agbára láti ṣe ohun kan, kì í ṣe ìmọ̀ lásán.
- source_word: δόματα ἀγαθὰ
  choice: ẹ̀bùn rere
  rationale: “Ẹ̀bùn” ni ìtumọ̀ àdánidá fún δόματα, “rere” sì ṣe iṣẹ́ àpèjúwe ἀγαθὰ níhìn-ín.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: àwọn ọmọ yín
  rationale: τέκνα ní àwọn ọmọ láì fi akọ tàbí abo sí i; gbolohun Yorùbá yìí sì ṣe bẹ́ẹ̀.
- source_word: πόσῳ μᾶλλον
  choice: mélòómélòó ni
  rationale: Ó mú ìfiwéra láti ohun kékeré sí ohun tí ó tóbi jù wá ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Baba yín tí ń bẹ ní àwọn ọ̀run
  rationale: Ó pa ọ̀rọ̀ “Baba yín” àti gbólóhùn ibi tí ó tẹ̀ lé e mọ́ lọ́tọ̀, ó sì ṣàfihàn nọ́mbà ọ̀pọ̀ τοῖς οὐρανοῖς.
- source_word: δώσει ἀγαθὰ
  choice: yóò fi àwọn ohun rere fún
  rationale: Nítorí δόματα kò tún fara hàn ní abala kejì, “àwọn ohun rere” túmọ̀ àjẹtífù tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ láì fi “ẹ̀bùn” kún un.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: àwọn tí ń béèrè lọ́wọ́ rẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ nípa gbogbo àwọn tí wọ́n ń béèrè ohun kan lọ́wọ́ rẹ̀.
theological_decisions:
- issue: Agbára ọ̀rọ̀ “ẹni búburú” nípa ìwà ènìyàn
  choice: 'A pa àpèjúwe tààrà náà mọ́: “tí ẹ jẹ́ ẹni búburú.”'
  alternative: “bí ẹ tilẹ̀ jẹ́ ẹlẹ́ṣẹ̀” tàbí “bí ẹ tilẹ̀ ní àìpé”
  rationale: Èyí pa ìforígbárí tí Jésù fi hàn láàárín ìwà ènìyàn àti oore Baba mọ́, láì rọ ọ̀rọ̀ náà tàbí sọ ọ́ di ìlànà ẹ̀kọ́ ìsìn tí ó ju ọrọ orísun lọ.
- issue: Ìtumọ̀ ὁ ἐν τοῖς οὐρανοῖς
  choice: “tí ń bẹ ní àwọn ọ̀run”
  alternative: “Baba yín ọ̀run” tàbí “Baba yín tí ń bẹ ní ọ̀run”
  rationale: Èyí tẹ̀ lé nọ́mbà ọ̀pọ̀ inú Gíríìkì, ó sì pa gbólóhùn ibi náà mọ́ dípò yíyí i padà sí orúkọ àpèjúwe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tí ó ṣe kedere fún òǹkàwé òde òní. A lo “mélòómélòó ni” láti mú àríyànjiyàn láti ohun kékeré sí ohun tí ó tóbi jù jáde ní ọ̀nà Yorùbá àdánidá.
