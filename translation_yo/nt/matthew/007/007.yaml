id: MAT.7.7
reference: Matthew 7:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: yo
  text: Ẹ béèrè[a], a ó sì fi fún yín; ẹ wá, ẹ ó sì rí; ẹ kan ilẹ̀kùn, a ó sì ṣí i fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ọ̀rọ̀ àṣẹ Gíríìkì wọ̀nyí, tí wọ́n wà ní àsìkò ìsinsìnyí, tún lè ní ìtumọ̀ ìṣe tí ń bá a lọ pé: “Ẹ máa béèrè … ẹ máa wá … ẹ máa kan ilẹ̀kùn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Ẹ béèrè
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n béèrè tàbí kí wọ́n tọrọ ohun kan, láìfi ìtumọ̀ ìtẹ̀síwájú kún un nínú ẹsẹ̀ pàtàkì.
- source_word: δοθήσεται ὑμῖν
  choice: a ó sì fi fún yín
  rationale: Ìtumọ̀ aláṣe tí a kò dárúkọ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìṣe àìṣe-taara Gíríìkì mọ́, kí ẹni tí yóò fún wọn má bàa jẹ́ dídárúkọ ní kedere.
- source_word: ζητεῖτε
  choice: ẹ wá
  rationale: Ó pa agbára àṣẹ àti ìtumọ̀ wíwá ohun kan mọ́ ní èdè Yorùbá tó rọrùn, tó sì ní iyì.
- source_word: εὑρήσετε
  choice: ẹ ó sì rí
  rationale: Ó tẹ̀lé ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ní kedere, ó sì fi ohun tí a ó rí sílẹ̀ láìdárúkọ, gẹ́gẹ́ bí orísun ṣe ṣe.
- source_word: κρούετε
  choice: ẹ kan ilẹ̀kùn
  rationale: Nítorí pé ‘kan’ nìkan lè ní ìtumọ̀ púpọ̀ ní Yorùbá, fífi ‘ilẹ̀kùn’ kún un mú àwòrán kíkàn ilẹ̀kùn hàn ní ti ẹ̀dá èdè láìyí ìtumọ̀ padà.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: a ó sì ṣí i sílẹ̀ fún yín
  rationale: Ìtumọ̀ yìí mú ìṣe ṣíṣí ilẹ̀kùn àti àǹfààní rẹ̀ fún àwọn olùgbọ́ hàn, ṣùgbọ́n kò dárúkọ ẹni tó ṣí i, bí Gíríìkì náà ṣe fi aṣẹ̀ṣe náà pamọ́.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ ni àsopọ̀ Yorùbá àdánidá nínú àtẹ̀lé ọ̀rọ̀ yìí; ó pa ìbáramu àti ìró àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta mọ́ láìfi ìtumọ̀ ‘nígbà náà’ kún un.
theological_decisions:
- issue: Ìrísí ìṣe àwọn ọ̀rọ̀ àṣẹ mẹ́tẹ̀ẹ̀ta ní àsìkò ìsinsìnyí
  choice: 'A lo àṣẹ Yorùbá lasan: ‘Ẹ béèrè … ẹ wá … ẹ kan ilẹ̀kùn.’'
  alternative: ‘Ẹ máa béèrè … ẹ máa wá … ẹ máa kan ilẹ̀kùn,’ èyí tó sọ ìtẹ̀síwájú tàbí àtúnṣe ìṣe náà ní kedere.
  rationale: Ìrísí ìṣe Gíríìkì lè tọ́ka sí ìṣe tó ń bá a lọ, ṣùgbọ́n kò fi dandan mú wa túmọ̀ rẹ̀ sí ‘ẹ máa …’ nínú ẹsẹ̀ pàtàkì. Àṣẹ lasan jẹ́ ti ẹ̀dá Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ń pa àṣàyàn ìtumọ̀ ìtẹ̀síwájú náà mọ́.
- issue: Ẹni tó ń fúnni àti ẹni tó ń ṣí ilẹ̀kùn
  choice: 'A kò dárúkọ aṣẹ̀ṣe náà: ‘a ó …’'
  alternative: Dárúkọ Ọlọ́run gẹ́gẹ́ bí ẹni tó ń fúnni àti tó ń ṣí ilẹ̀kùn.
  rationale: Àwọn ọ̀rọ̀ ìṣe Gíríìkì jẹ́ àìṣe-taara, wọn kò sì dárúkọ Ọlọ́run ní ẹsẹ̀ yìí. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí orísun fi sílẹ̀ láìsọ ní kedere.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó bójú mu, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ láti fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀. Àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta pa ìbáramu àti ìró orísun mọ́.
