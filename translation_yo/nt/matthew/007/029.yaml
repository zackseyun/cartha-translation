source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: yo
  text: Nítorí ó ń kọ́ wọn bí ẹni tí ó ní àṣẹ[a], kì í sì í ṣe bí àwọn akọ̀wé wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó rọrùn sí i, “pẹ̀lú àṣẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: nítorí ó ń kọ́
  rationale: Àkópọ̀ ọ̀rọ̀-ìṣe aláìpé (ἦν + participle) fi ìṣe tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn. “Nítorí” pa iṣẹ́ ìṣàlàyé γάρ mọ́, ó sì so ẹsẹ yìí mọ́ ìyàlẹ́nu àwọn ènìyàn ní ẹsẹ tó ṣáájú.
- source_word: αὐτούς
  choice: wọn
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ tí ó jẹ́ àfojúsùn ọ̀rọ̀-ìṣe, tí ó ń tọ́ka sí àwọn ènìyàn tí Jesu ń kọ́.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: bí ẹni tí ó ní àṣẹ
  rationale: Èyí tẹ̀lé ìṣètò Gíríìkì ní pẹkipẹki, ó sì fi hàn pé àṣẹ jẹ́ ohun tí ẹni tó ń kọ́ wọn ní, kì í ṣe ìgboyà ọ̀rọ̀ lásán. Àlàyé ìsàlẹ̀ fún àyípadà Yorùbá tó rọrùn sí i.
- source_word: καὶ οὐχ ὡς
  choice: kì í sì í ṣe bí
  rationale: Ó pa ìfiwéra àti ìyàtọ̀ tó ṣe kedere nínú Gíríìkì mọ́ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: àwọn akọ̀wé wọn
  rationale: “Àwọn akọ̀wé” jẹ́ ìtumọ̀ tààrà fún γραμματεῖς, àwọn amòye nípa Òfin; “wọn” sì pa αὐτῶν mọ́, tí ó ṣeé ṣe kí ó tọ́ka sí àwọn aláṣẹ ẹ̀sìn tí àwọn ènìyàn mọ̀ sí tiwọn.
theological_decisions:
- issue: Irú àṣẹ tí Jesu ní nínú kíkọ́ni
  choice: 'A sọ ọ́ gẹ́gẹ́ bí ìfiwéra nípa ọ̀nà tí Jesu fi ń kọ́ni: “bí ẹni tí ó ní àṣẹ.”'
  alternative: Kí a túmọ̀ rẹ̀ ní gbangba sí àṣẹ Ọlọ́run, tàbí kí a dín un kù sí ìgboyà àti agbára ọ̀rọ̀ lásán.
  rationale: Ẹsẹ náà fi àṣẹ Jesu hàn gẹ́gẹ́ bí ohun gidi, ó sì yà á sọ́tọ̀ sí àwọn akọ̀wé, ṣùgbọ́n kò sọ níbí gan-an nípa gbogbo ìpìlẹ̀ ẹ̀kọ́ ìgbàgbọ́ fún àṣẹ náà. Ìtumọ̀ náà pa ìfọ̀kànsìn àti àìsọ-kedere tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣeé yé fún òǹkàwé lásán. “Àwọn akọ̀wé” ni a lò dípò àlàyé gígùn bí “àwọn olùkọ́ Òfin” láti pa ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì mọ́.
