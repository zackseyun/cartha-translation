id: MAT.7.13
reference: Matthew 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: yo
  text: Ẹ wọlé gba ẹnu-ọ̀nà tóóró. Nítorí ẹnu-ọ̀nà náà gbòòrò, ọ̀nà tí ó ń lọ sí ìparun[b] sì fẹ̀[a], ọ̀pọ̀ ènìyàn ló sì ń wọlé gba ẹnu-ọ̀nà náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀nà náà sì ní àyè púpọ̀.” Ọ̀rọ̀ Gíríìkì εὐρύχωρος lè túmọ̀ sí “fẹ̀,” “gbòòrò,” tàbí “ní àyè púpọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìbàjẹ́” tàbí “òfo.” Ọ̀rọ̀ Gíríìkì ἀπώλεια lè tọ́ka sí ìparun, ìbàjẹ́, tàbí òpin tí ohun kan fi ṣòfò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Ẹ ... wọlé
  rationale: Ọ̀rọ̀ ìṣe àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn. “Ẹ ... wọlé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ pé kí wọ́n wọ ibì kan.
- source_word: διὰ τῆς στενῆς πύλης
  choice: gba ẹnu-ọ̀nà tóóró wọlé
  rationale: “Gba ... wọlé” fi ìṣípò la àárín ohun kan hàn, gẹ́gẹ́ bí διά pẹ̀lú ẹ̀yà ọ̀rọ̀ genitive; “ẹnu-ọ̀nà tóóró” sì pa àwòrán ẹnu-ọ̀nà tí kò fẹ̀ mọ́.
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó bẹ̀rẹ̀ àlàyé ìdí tí àṣẹ tó ṣáájú fi ṣe pàtàkì.
- source_word: πλατεῖα ἡ πύλη
  choice: ẹnu-ọ̀nà náà gbòòrò
  rationale: “Gbòòrò” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí ó wide, ó sì dá ìyàtọ̀ rẹ̀ sí “tóóró” dúró.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: ọ̀nà ... sì fẹ̀
  rationale: “Fẹ̀” túmọ̀ sí pé ọ̀nà náà gbòòrò tàbí pé àyè rẹ̀ pọ̀; ó jẹ́ àdánidá nínú Yorùbá, ó sì yàtọ̀ díẹ̀ sí “gbòòrò” tí a lò fún ẹnu-ọ̀nà.
- source_word: ἡ ἀπάγουσα
  choice: tí ó ń lọ sí
  rationale: Gbólóhùn yìí fi ọ̀nà náà hàn gẹ́gẹ́ bí èyí tí ó ń darí ẹni lọ sí òpin kan, láìfi ìtumọ̀ míì kún un.
- source_word: εἰς τὴν ἀπώλειαν
  choice: sí ìparun
  rationale: “Ìparun” gbé ìtumọ̀ destruction tàbí ruin jáde, ó sì pa ìkìlọ̀ náà mọ́ láìsọ irú ìparun náà pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: àwọn tí ń gba ibẹ̀ wọlé sì pọ̀
  rationale: Ó pa ìtẹnumọ́ Gíríìkì lórí ọ̀pọ̀ ènìyàn mọ́. “Ibẹ̀” tọ́ka sí ibi tí a ṣẹ̀ṣẹ̀ sọ, láì tún “ẹnu-ọ̀nà” ṣe kedere sí i ju arọ́pò-orúkọ Gíríìkì lọ.
theological_decisions:
- issue: Ìtumọ̀ ἀπώλεια nínú ìkìlọ̀ Jésù
  choice: ìparun
  alternative: ìbàjẹ́ tàbí òfo
  rationale: Ẹsẹ̀ náà ń kìlọ̀ nípa òpin búburú, ṣùgbọ́n kò ṣàlàyé gbogbo ẹ̀kọ́ ìgbàgbọ́ nípa irú òpin náà. “Ìparun” pa bí ìkìlọ̀ náà ti le tó mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó lé e lórí.
- issue: Ohun tí αὐτῆς ń tọ́ka sí
  choice: ibẹ̀
  alternative: ẹnu-ọ̀nà náà
  rationale: Nítorí αὐτῆς jẹ́ abo ní Gíríìkì, ó bá πύλη (“ẹnu-ọ̀nà”) mu, ìṣe “wọlé gba inú” sì tún tọ́ka sí ẹnu-ọ̀nà. Síbẹ̀, lílo “ibẹ̀” pa ìtọ́kasí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́ láì tún orúkọ náà ṣe níbi tí Gíríìkì ti lo arọ́pò-orúkọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àṣẹ “Ẹ ... wọlé” jẹ́ kedere, ìfiwéra tóóró/gbòòrò/fẹ̀ sì pa àwòrán ọ̀nà àti ẹnu-ọ̀nà inú ẹsẹ̀ náà mọ́.
