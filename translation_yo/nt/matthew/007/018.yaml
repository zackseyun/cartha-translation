id: MAT.7.18
reference: Matthew 7:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: yo
  text: Igi rere[a] kò lè so èso búburú[b], bẹ́ẹ̀ ni igi jíjẹrà[c] kò lè so èso rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “igi tí ó ní ìlera.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èso ibi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “igi tí ó ti díbàjẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: igi rere
  rationale: “Rere” pa àwòrán igi mọ́, ó sì fi ìwúlò àti ìwà rere tí ἀγαθός lè túmọ̀ sí hàn láì fi “tí ara rẹ̀ dá” ṣe àlàyé àfikún.
- source_word: δύναται ... ποιεῖν
  choice: kò lè so
  rationale: Nínú ọ̀rọ̀ nípa igi àti èso, “so èso” ni ọ̀nà Yorùbá àdánidá fún ṣíṣe tàbí mímú èso jáde; “kò lè” sì pa ìtumọ̀ àìlèṣe inú δύναται mọ́.
- source_word: καρποὺς πονηρούς
  choice: èso búburú
  rationale: “Búburú” lè sọ ànímọ́ èso tí kò dára àti agbára ìdájọ́ ìwà inú πονηρός; kò dín àwòrán náà kù sí ìtumọ̀ ẹ̀sìn kan ṣoṣo.
- source_word: οὐδέ
  choice: bẹ́ẹ̀ ni ... kò lè
  rationale: Ìṣètò yìí so gbólóhùn kejì mọ́ ti àkọ́kọ́ gẹ́gẹ́ bí ìkọ̀ méjì tó dọ́gba, ó sì jẹ́ Yorùbá tí ó rọrùn.
- source_word: δένδρον σαπρόν
  choice: igi jíjẹrà
  rationale: “Jíjẹrà” jẹ́ ọ̀rọ̀ Yorùbá tó lágbára fún ohun tí ó ti rà tàbí bàjẹ́, ó sì pa àwòrán gidi ti σαπρός mọ́.
- source_word: καρποὺς καλούς
  choice: èso rere
  rationale: “Èso rere” jẹ́ ìtumọ̀ àdánidá fún èso tó dára, ó sì mú ìyàtọ̀ tó wà láàárín καλός àti πονηρός hàn kedere.
theological_decisions:
- issue: Irú àìlèṣe tí àkàwé náà ń sọ
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí àìlèṣe pátápátá: “kò lè.”'
  alternative: “Kì í sábà so” tàbí “kò yẹ kí ó so.”
  rationale: δύναται pẹ̀lú οὐ sọ àìlèṣe, kì í ṣe ohun tí kò fi bẹ́ẹ̀ ṣẹlẹ̀ tàbí ohun tí kò yẹ kí ó ṣẹlẹ̀. Èdè yìí pa agbára àkàwé Jésù mọ́ láì fi ìlànà ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ kúkúrú, ọlọ́lá, ó sì lo “so èso,” èdè àdánidá tí àwọn òǹkàwé òde òní lóye.
