  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìkìlọ̀ Gíríìkì náà dáadáa ní gbogbogbòò: àṣẹ ìṣọ́ra tí ó ń tẹ̀síwájú, àwọn wòlíì èké, ìrísí aṣọ àgùntàn, àti ìyàtọ̀ láàárín òde àti inú. Síbẹ̀, “afiniṣèjẹ” ń dá ìtumọ̀ λύκοι ἅρπαγες sí ìfẹ́ sí ìtàjẹ̀sílẹ̀ tàbí pípa ènìyàn; ἅρπαγες ń tẹnu mọ́ ìwà ìjẹni-lọ́wọ́, ìkógun, àti ìparun. Àtúnṣe náà lo “apanirun” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó dáa tí kò fi ìtàjẹ̀sílẹ̀ kún àwòrán náà.'
