id: MAT.7.15
reference: Matthew 7:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: yo
  text: “Ẹ máa ṣọ́ra fún àwọn wòlíì èké,[a] tí wọ́n ń tọ̀ yín wá ní aṣọ àgùntàn,[b] ṣùgbọ́n ní inú, ìkookò apanirun ni wọ́n.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa wà lójúfò sí àwọn wòlíì èké.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ní àwọn aṣọ àgùntàn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ṣùgbọ́n ní inú, ìkookò ajínigbé ni wọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Ẹ máa ṣọ́ra fún
  rationale: Ọ̀rọ̀ àṣẹ onítẹ̀síwájú náà ń pe ọ̀pọ̀ ènìyàn sí ìṣọ́ra tí kò dáwọ́ dúró; ‘ṣọ́ra fún’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n wà lójúfò sí ewu.
- source_word: ψευδοπροφητῶν
  choice: àwọn wòlíì èké
  rationale: Ó tọ́ka sí àwọn tí wọ́n ń fi ara wọn hàn bí wòlíì tàbí tí àsọtẹ́lẹ̀ wọn jẹ́ èké, láìfi ẹ̀ka ìjọ tàbí ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún un.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: tí wọ́n ń tọ̀ yín wá
  rationale: Ó mú ìṣe tí ó ń ṣẹlẹ̀ léraléra àti ìtọ́sọ́nà wọn sí àwọn olùgbọ́ jáde ní Yorùbá àdánidá.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: ní aṣọ àgùntàn
  rationale: Ó pa àwòrán ìrísí àgùntàn mọ́, ó sì jẹ́ gbólóhùn tí ó ṣe kedere ní Yorùbá.
- source_word: ἔσωθεν δέ
  choice: ṣùgbọ́n ní inú
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ìrísí òde àti irú ẹni tí wọ́n jẹ́ ní ti gidi.
- source_word: λύκοι ἅρπαγες
  choice: ìkookò afiniṣèjẹ
  rationale: ‘Afiniṣèjẹ’ mú ìwà apanijẹ, ìkógun, àti ìparun inú ἅρπαγες jáde, nígbà tí ó ń pa àfiwé ìkookò mọ́.
theological_decisions:
- issue: Irú ìkìlọ̀ tí a ń ṣe nípa àwọn aṣáájú ẹ̀sìn ẹlẹ́tàn
  choice: A túmọ̀ àwòrán náà gẹ́gẹ́ bí ìkìlọ̀ nípa àwọn wòlíì èké tí ìrísí òde wọn yàtọ̀ sí ohun tí wọ́n jẹ́ ní inú.
  alternative: Kí a dín ìtumọ̀ náà kù sí àwọn olùkọ́ ẹ̀kọ́ ìgbàgbọ́ kan pàtó tàbí sí ẹ̀ka ìjọ kan.
  rationale: Ọ̀rọ̀ Gíríìkì náà kò dárúkọ ètò ìjọ tàbí ẹ̀kọ́ ìgbà tó tẹ̀ lé e; nítorí náà, a pa ìkìlọ̀ ìwà-ẹ̀mí náà mọ́ láìkó ẹ̀kọ́ ẹ̀ka ìjọ kan wọ̀ ọ́.
translation_notes:
  register: Yorùbá boṣewa, olóhùn níbi tí ó bá yẹ, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti òde òní. Fọ́ọ̀mù ‘Ẹ’ àti ‘yín’ pa ọ̀pọ̀ ènìyàn tí Gíríìkì ń bá sọ̀rọ̀ mọ́. Àwọn àmì àlàyé [a]–[c] wà nínú ọ̀rọ̀ pàtàkì, lẹ́gbẹ̀ẹ́ ibi tí wọ́n ń ṣàlàyé.
