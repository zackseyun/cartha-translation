id: MAT.7.4
reference: Matthew 7:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: yo
  text: Àbí báwo ni ìwọ yóò ṣe sọ fún arákùnrin rẹ[c] pé, ‘Jẹ́ kí n yọ èérún[a] náà kúrò ní ojú rẹ,’ sì kíyèsí i, ìtí igi[b] náà wà ní ojú tìrẹ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rún igi kékeré.” Gíríìkì κάρφος ń tọ́ka sí ohun gbígbẹ kékeré.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “igi àtẹ́gùn” tàbí “igi ìkọ́lé ńlá.” Gíríìkì δοκός ń tọ́ka sí igi ńlá tí a fi ń kọ́lé tàbí gbé ilé ró.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì ní “arákùnrin rẹ”; akọ ẹyọ náà lè jẹ́ lílò aṣojú fún ènìyàn kan.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ṣe àfihàn ọ̀nà mìíràn nínú ìbéèrè àsọrétoríìkì Jésù, ó sì jẹ́ ọ̀nà àdánidá láti so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: πῶς ἐρεῖς
  choice: báwo ni ìwọ yóò ṣe sọ
  rationale: ‘Báwo ni’ pa agbára ìbéèrè πῶς mọ́, ‘yóò sì sọ’ tẹ̀ lé ọ̀rọ̀-ìṣe ọjọ́ iwájú ἐρεῖς.
- source_word: τῷ ἀδελφῷ σου
  choice: fún arákùnrin rẹ
  rationale: ‘Arákùnrin’ bá akọ ẹyọ ἀδελφός mu, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń jẹ́ kí a mọ̀ pé ó lè dúró fún ọmọ-ẹ̀yìn ẹlẹgbẹ́ ẹni.
- source_word: Ἄφες ἐκβάλω
  choice: Jẹ́ kí n yọ
  rationale: Ἄφες níhìn-ín jẹ́ ìbéèrè fún àṣẹ, ‘yọ ... kúrò’ sì jẹ́ èdè Yorùbá àdánidá fún mímú ohun kan jáde kúrò ní ojú.
- source_word: τὸ κάρφος
  choice: èérún náà
  rationale: ‘Èérún’ túmọ̀ sí ẹ̀yà ohun gbígbẹ kékeré, ó sì pa ìyàtọ̀ ńlá tó wà láàárín κάρφος àti δοκός mọ́.
- source_word: καὶ ἰδοὺ
  choice: sì wò ó
  rationale: ‘Wò ó’ jẹ́ ìkìlọ̀ àfiyèsí tó ṣe àfihàn ἰδού ní èdè Yorùbá òde òní láì lo ọ̀rọ̀ àtijọ́ tó le.
- source_word: ἡ δοκὸς
  choice: òpó igi náà
  rationale: ‘Òpó igi’ ń tọ́ka sí igi ńlá tí a fi ń gbé ilé ró, ó sì bá ìtumọ̀ δοκός gẹ́gẹ́ bí igi ìkọ́lé ńlá mu.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: ń bẹ ní ojú tìrẹ
  rationale: ‘Ní ojú tìrẹ’ pa ibi tí igi náà wà mọ́, ó sì mú ìtakora pẹ̀lú ‘ojú rẹ’ ti ẹni kejì hàn kedere ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ akọ ẹyọ ἀδελφῷ
  choice: arákùnrin rẹ
  alternative: ọmọ-ẹ̀yìn ẹlẹgbẹ́ rẹ; arákùnrin tàbí arábìnrin rẹ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ, nítorí náà a pa irú rẹ̀ mọ́ nínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ ojú ewé sọ pé lílò yìí lè jẹ́ aṣojú fún ọmọ-ẹ̀yìn ẹlẹgbẹ́ ẹni.
- issue: Àwòrán àsọdùn κάρφος / δοκός
  choice: èérún / òpó igi
  alternative: ẹ̀rún igi / igi ńlá
  rationale: Àṣàyàn yìí pa ìyàtọ̀ àsọdùn tó lágbára mọ́ láàárín ohun kékeré àti igi ìkọ́lé ńlá, láì dín ìṣòro ọ̀rọ̀ Jésù kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò. A lo ‘sì wò ó’ fún àmì àsọyé ἰδού, ‘ojú tìrẹ’ sì tẹnumọ́ ìtakora tó wà nínú àyíká ọ̀rọ̀ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
