id: MAT.7.3
reference: Matthew 7:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: yo
  text: Ṣùgbọ́n, èé ṣe tí ìwọ fi ń rí èérún igi tí ó wà ní ojú arákùnrin rẹ, tí o kò sì kíyè sí ìtí igi tí ó wà ní ojú ara rẹ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: èé ṣe
  rationale: Nínú ìbéèrè yìí, τί ní agbára ìtumọ̀ ‘kí ló dé?’ tàbí ‘èé ṣe?’ dípò ‘kí ni?’; ‘èé ṣe’ mú ìbéèrè àtakò náà jáde lọ́nà àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyípadà pẹ̀lú àtakò kékeré hàn sí ẹ̀kọ́ tó ṣáájú; ‘Ṣùgbọ́n’ bá ipa yẹn mu.
- source_word: βλέπεις
  choice: ń rí
  rationale: ‘Rí’ pa àwòrán ojú mọ́, ó sì yàtọ̀ sí κατανοεῖς, tí a túmọ̀ sí ‘kíyè sí.’
- source_word: κάρφος
  choice: èérún igi
  rationale: κάρφος lè jẹ́ èérún, ẹ̀ka koríko gbígbẹ, tàbí ohun kékeré tó ya; ‘èérún igi’ jẹ́ ohun tí òǹkà Yorùbá lè fojú inú rí, ó sì ṣe àtakò kedere sí ìtì igi.
- source_word: ἀδελφοῦ
  choice: arákùnrin rẹ
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ kan; ‘arákùnrin rẹ’ pa ìbátan àti akọ ẹyọ náà mọ́ láì sọ ọ́ di ọ̀rọ̀ àpapọ̀.
- source_word: σῷ
  choice: ìwọ fúnra rẹ
  rationale: σῷ ní ìtẹnumọ́ ní ìfiwéra pẹ̀lú ojú arákùnrin; ‘ìwọ fúnra rẹ’ mú ìtẹnumọ́ náà hàn ní Yorùbá.
- source_word: δοκόν
  choice: ìtì igi
  rationale: δοκός jẹ́ igi ńlá tí a fi ń gbé ilé ró; ‘ìtì igi’ pa ìtumọ̀ iṣẹ́ ilé àti àsọdùn àwòrán náà mọ́.
- source_word: οὐ κατανοεῖς
  choice: o kò kíyè sí
  rationale: κατανοέω túmọ̀ sí ṣíṣe àkíyèsí tàbí fífi ọkàn sí ohun; ‘kíyè sí’ dá ìyàtọ̀ tó wà láàárín rírí lasán àti ṣíṣe àkíyèsí dúró.
- source_word: ὀφθαλμῷ
  choice: ojú
  rationale: ‘Ojú’ ni ìbámu Yorùbá tó ṣe déédé fún ὀφθαλμός nínú àwòrán yìí.
theological_decisions:
- issue: Ọ̀rọ̀ ìbátan akọ ἀδελφοῦ
  choice: arákùnrin rẹ
  alternative: ẹgbẹ́ rẹ tàbí arákùnrin tàbí arábìnrin rẹ
  rationale: A pa akọ ẹyọ tó wà nínú orísun mọ́. Bí ó tilẹ̀ jẹ́ pé ẹ̀kọ́ náà kan gbogbo ènìyàn, kò yẹ kí a yí ọ̀rọ̀ orísun padà sí ọ̀rọ̀ àpapọ̀ láìní àmì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkà gbogbogbò. A pa ìbéèrè àsọyé, àtakò laarin ohun kékeré àti igi ńlá, àti ìyàtọ̀ laarin ‘rí’ àti ‘kíyè sí’ mọ́.
