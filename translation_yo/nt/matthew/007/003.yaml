  to: Ṣùgbọ́n, èé ṣe tí ìwọ fi ń rí èérún igi tí ó wà ní ojú arákùnrin rẹ, tí o kò sì kíyè sí ìtí igi tí ó wà ní ojú ara rẹ?
  rationale: 'The revision corrects the Yoruba reflexive possessive construction while retaining the source-text contrasts, imagery, masculine singular kinship reference, and rhetorical question. No footnote is necessary: the lexical choices are sufficiently clear in Yoruba and no unresolved textual ambiguity is involved.'
