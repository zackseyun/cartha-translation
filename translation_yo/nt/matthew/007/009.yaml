id: MAT.7.9
reference: Matthew 7:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: yo
  text: Tàbí, èyí wo ni ó wà láàárín yín tí ọmọkùnrin rẹ̀ bá béèrè búrẹ́dì lọ́wọ́ rẹ̀, tí kì yóò fún un ní òkúta?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Tàbí
  rationale: Ó so àpẹẹrẹ ìbéèrè àsọyé yìí mọ́ ohun tí ó ṣáájú rẹ̀ lọ́nà àdánidá.
- source_word: τίς ... ἄνθρωπος
  choice: ọkùnrin wo ni ó wà
  rationale: Ó pa àwòrán ọkùnrin kan mọ́ gẹ́gẹ́ bí Gíríìkì ṣe lò ἄνθρωπος ní ìṣọ̀kan akọ nínú àpẹẹrẹ yìí, ó sì bójú mu nínú èdè Yorùbá.
- source_word: ἐξ ὑμῶν
  choice: láàárín yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan lára àwọn tí a ń bá sọ̀rọ̀.
- source_word: αἰτήσει
  choice: bí ... bá béèrè ... lọ́wọ́ rẹ̀
  rationale: Ìlò ‘bí ... bá’ fi ìṣẹ̀lẹ̀ àpẹẹrẹ tí ìbéèrè àsọyé náà gbé kalẹ̀ hàn; ‘béèrè ... lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ohun kan béèrè lọ́wọ́ ẹnìkan.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: ọmọ rẹ̀
  rationale: Nínú Yorùbá, ‘ọmọ’ kì í fi akọ tàbí abo hàn, ṣùgbọ́n ó túmọ̀ sí ọmọ ẹni náà ní kedere láìfi ohun tí ọ̀rọ̀ Gíríìkì kò tẹnumọ́ kún un.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti èyí tí òǹkàwé Yorùbá òde òní lóye fún oúnjẹ tí a mẹ́nu kàn.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: yóò fún un ní òkúta?
  rationale: Ìbéèrè àsọyé náà ń retí ìdáhùn òdì; ìrísí ìbéèrè ní Yorùbá ń mú ìretí yẹn hàn láìfi ‘kò’ kún gbólóhùn náà.
theological_decisions:
- issue: Èdè akọ tí a lò ní ipò aṣojú
  choice: ọkùnrin
  alternative: ènìyàn
  rationale: Gíríìkì lò ἄνθρωπος ní ìṣọ̀kan akọ nínú àpẹẹrẹ ẹni tí ọmọ rẹ̀ ń béèrè oúnjẹ lọ́wọ́ rẹ̀. ‘Ọkùnrin’ pa àwòrán akọ náà mọ́; àlàyé ìsàlẹ̀ fi aṣàyàn gbooro tí ọ̀rọ̀ náà tún lè gbà hàn.
- issue: Agbára ìbéèrè tí μή ń tọ́ka sí
  choice: Ìbéèrè àsọyé tí ó ń retí ‘rárá’
  alternative: Ṣé kì yóò fún un ní òkúta?
  rationale: Fífi òdì sínú ìbéèrè Yorùbá lè mú kí ìtumọ̀ rẹ̀ dàrú. Ìbéèrè gígùn bí ó ṣe wà ń sọ ìdáhùn òdì tí a retí di mímọ́ láti inú àyíká ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ìṣètò ‘bí ... bá’ láti mú ìṣẹ̀lẹ̀ àpẹẹrẹ náà ṣàn lọ́nà àdánidá, nígbà tí ìbéèrè àsọyé àti ìyàtọ̀ láàárín búrẹ́dì àti òkúta ṣì dúró ṣinṣin.
