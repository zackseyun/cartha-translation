  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: yo
  text: Gbogbo igi tí kò so èso rere ni a gé lulẹ̀, a sì jù ú sínú iná.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò mú èso rere jáde.”
    reason: lexical_alternative
  - marker: b
    text: “Iná” jẹ́ àwòrán ìdájọ́; ẹsẹ yìí fúnra rẹ̀ kò sọ ní pàtó bóyá ìdájọ́ nínú ayé yìí, ìdájọ́ ọjọ́ ìkẹyìn, tàbí àwọn méjèèjì ni a tẹnumọ́.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Gbogbo igi
  rationale: πᾶν pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ kan ní ìtumọ̀ alápínkiri, ó ń tọ́ka sí igi kọ̀ọ̀kan; “gbogbo igi” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa agbára ọ̀rọ̀ òwe náà mọ́.
- source_word: μὴ ποιοῦν
  choice: tí kò bá so
  rationale: Bí ó tilẹ̀ jẹ́ pé ποιέω túmọ̀ ní tààrà sí “ṣe/mú jáde,” “so èso” ni ọ̀rọ̀ Yorùbá àdánidá fún ohun tí igi ń ṣe. Ìlò “bá” nínú gbólóhùn ìbátan yìí ń sọ ànímọ́ igi bẹ́ẹ̀, kò sì sọ pé ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo ni.
- source_word: καρπὸν καλὸν
  choice: èso rere
  rationale: καλός níbí ń tọ́ka sí ohun tó dára, tó péye, tàbí tó yẹ; “èso rere” jẹ́ gbólóhùn Yorùbá tó ṣe déédéé, ó sì pa ìdájọ́ ìwà rere inú àyíká ọ̀rọ̀ náà mọ́.
- source_word: ἐκκόπτεται
  choice: ni a gé lulẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ aláìṣe ní Gíríìkì, ó sì sọ ohun tí a máa ń ṣe sí irú igi bẹ́ẹ̀. “Gé lulẹ̀” jẹ́ ọ̀nà àdánidá láti sọ gígé gbogbo igi lulẹ̀.
- source_word: εἰς πῦρ βάλλεται
  choice: tí a sì jù sínú iná
  rationale: βάλλεται jẹ́ aláìṣe, εἰς sì fi ìlọsí inú ohun kan hàn. “Jù sínú iná” pa àwòrán ìdájọ́ náà mọ́ láìfi ẹ̀kọ́ mìíràn kún ohun tí ẹsẹ náà sọ.
theological_decisions:
- issue: Àwòrán iná gẹ́gẹ́ bí ìdájọ́
  choice: A pa àkàwé gígé igi lulẹ̀ àti jíjù ú sínú iná mọ́, láìsọ pàtó ohun tí iná náà dúró fún.
  alternative: Kí a túmọ̀ iná náà ní pàtó sí ìdájọ́ ayé yìí, ìdájọ́ ọjọ́ ìkẹyìn, tàbí ọ̀run àpáàdì.
  rationale: Ẹsẹ náà fi ìkìlọ̀ nípa ìdájọ́ hàn kedere nípasẹ̀ àwòrán iṣẹ́ àgbẹ̀, ṣùgbọ́n kò ṣàlàyé àkókò tàbí ìwọ̀n ìdájọ́ náà. Ìtumọ̀ yìí pa àìdánilójú tó wà nínú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún òǹkàwé lásán. “So èso” jẹ́ àṣàyàn àdánidá jù lọ fún igi, nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn tó sún mọ́ ποιέω mọ́.
