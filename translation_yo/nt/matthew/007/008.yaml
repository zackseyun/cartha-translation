id: MAT.7.8
reference: Matthew 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: yo
  text: Nítorí gbogbo ẹni tí ń béèrè ń gbà, ẹni tí ń wá ń rí, a ó sì ṣí sílẹ̀ fún ẹni tí ń kan ilẹ̀kùn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “a ó ṣí sílẹ̀ fún ẹni tí ń kan.” Gíríìkì kò darúkọ ohun tí a ó ṣí; ilẹ̀kùn ni àwòrán kíkàn náà ń jẹ́ ká lóye.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: olúkúlùkù ẹni
  rationale: Ó fi ìwọ̀n gbogbo ènìyàn tí Gíríìkì sọ hàn ní Yorùbá àdánidá, láì sọ ọ́ di ‘gbogbo’ tí ó lè nílò orúkọ míì lẹ́yìn rẹ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa àlàyé tí ẹsẹ yìí ní sí ìṣírí inú ẹsẹ tó ṣáájú mọ́.
- source_word: ὁ αἰτῶν
  choice: ẹni tí ó bá béèrè
  rationale: Ìtumọ̀ àpapọ̀ ni fún ẹni tó ń béèrè; ‘bá’ mú gbólóhùn òwe àpapọ̀ náà dun bí Yorùbá àdánidá láì dín ìlérí rẹ̀ kù.
- source_word: λαμβάνει
  choice: ń gbà
  rationale: ‘Gbà’ ni ìtumọ̀ tó ṣe déédé fún rírí ohun tí a fi fúnni, ó sì bá ìlànà ọ̀rọ̀ mẹ́ta náà mu.
- source_word: ὁ ζητῶν
  choice: ẹni tí ó bá wá
  rationale: Ó pa àwòrán wíwá ohun kan àti ìṣọ̀kan pẹ̀lú àwọn ọ̀rọ̀ alábápín yòókù mọ́.
- source_word: εὑρίσκει
  choice: ń rí
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá ìtumọ̀ εὑρίσκει nínú ọ̀rọ̀ yìí mu.
- source_word: τῷ κρούοντι
  choice: ẹni tí ó sì bá kan ilẹ̀kùn
  rationale: ‘Kan ilẹ̀kùn’ ni ọ̀nà Yorùbá àdánidá láti sọ ìṣe kíkàn; ilẹ̀kùn jẹ́ ohun tí àwòrán náà ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé Gíríìkì kò darúkọ rẹ̀ ní tààrà.
- source_word: ἀνοιγήσεται
  choice: a ó ṣí i sílẹ̀ fún un
  rationale: Ìṣe aláìdarúkọ olùṣe ní Yorùbá (‘a ó’) pa ipa ọ̀rọ̀ àfarawà ọjọ́ iwájú mọ́, ‘fún un’ sì dúró fún ẹni tí Gíríìkì fi sínú ọ̀rọ̀ dative.
theological_decisions:
- issue: Ìwọ̀n àti agbára ìlérí náà
  choice: A fi ìdánilójú àpapọ̀ náà hàn ní ọ̀rọ̀ tó kan gbogbo ẹni tó béèrè, wá, tàbí kan ilẹ̀kùn, láì fi ààlà ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Kí a túmọ̀ rẹ̀ bí ìlérí pé gbogbo ohun pàtó tí ènìyàn bá béèrè ni yóò rí gan-an, tàbí kí a fi ọ̀rọ̀ kún un pé àwọn ohun tẹ̀mí kan ṣoṣo ni ó kàn.
  rationale: Gíríìkì lo èdè tó gbòòrò. Ìtumọ̀ náà gbọ́dọ̀ pa ìfọkànsìn yẹn àti ìforígbárí ìtumọ̀ rẹ̀ mọ́, kó má ṣe yanju rẹ̀ nípasẹ̀ àfikún.
translation_notes:
  register: Yorùbá àfẹnusọ ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnṣe mẹ́ta—béèrè/gbà, wá/rí, kan/ṣí—ni a pa mọ́ fún ìró àti ìrántí ọ̀rọ̀ náà.
