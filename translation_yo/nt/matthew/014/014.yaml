  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì dáadáa nípa rírí ogunlọ́gọ̀ ènìyàn, ìyọ́nú, àti ìmúláradá. Ṣùgbọ́n “jáde kúrò nínú ọkọ̀” nínú ọ̀rọ̀ pàtàkì fi “ọkọ̀” kún ἐξελθών; àyíká lè jẹ́ kó ṣeé ṣe, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò sọ ọ́ ní tààrà.
