  terminology: A pa “aláìsàn” àti “wo ... sàn” mọ́ fún ἀρρώστους àti ἐθεράπευσεν. “Ṣàánú” sọ ἐσπλαγχνίσθη ní ìbámu pẹ̀lú ìtumọ̀ ìyọ́nú jíjinlẹ̀, láì fi ìtumọ̀ ẹ̀kọ́ àfikún kún un.
