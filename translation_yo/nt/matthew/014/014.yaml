  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: yo
  text: Nígbà tí ó sì jáde[a], ó rí ogunlọ́gọ̀ ènìyàn; ó sì ṣàánú wọn[b], ó sì wo àwọn aláìsàn wọn sàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààrà, “lẹ́yìn tí ó jáde” tàbí “nígbà tí ó jáde wá.” Nínú àyíká ìtàn yìí, ó ṣeé ṣe kí ó túmọ̀ sí pé ó jáde kúrò nínú ọkọ̀ sí etí omi.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àánú wọn ṣe é.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: nígbà tí ó jáde kúrò nínú ọkọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtàkì sí ‘nígbà tí ó jáde,’ ṣùgbọ́n àyíká ìtàn fi hàn pé Jésù jáde kúrò nínú ọkọ̀. Ìtumọ̀ yìí jẹ́ ti èdè Yorùbá àdánidá, ó sì jẹ́ kí ohun tí ó ṣẹlẹ̀ yé kedere láì sọ ohun tí àyíká kò fi hàn.
- source_word: εἶδεν
  choice: ó rí
  rationale: Èyí ni ìtumọ̀ Yorùbá tààrà, tó sì bá ọ̀rọ̀ Gíríìkì mu.
- source_word: πολὺν ὄχλον
  choice: ogunlọ́gọ̀ ènìyàn
  rationale: ‘Ogunlọ́gọ̀ ènìyàn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ènìyàn pọ̀ ní ibi kan, ó sì pa agbára πολύν mọ́.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: àánú wọn ṣe é
  rationale: Gbólóhùn Yorùbá yìí sọ ìmọ̀lára àánú jíjinlẹ̀ ní ọ̀nà tó ṣe déédé, láì fi àlàyé àfikún kún un.
- source_word: ἐθεράπευσεν
  choice: ó wo ... sàn
  rationale: ‘Wo ... sàn’ ni gbólóhùn Yorùbá tó wọ́pọ̀ fún ìmúláradá kúrò nínú àìsàn.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: àwọn aláìsàn wọn
  rationale: Èyí pa ìṣókí ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí àwọn tí àìsàn ń ṣe láàárín ogunlọ́gọ̀ náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìdáhùn ìmọ̀lára Jésù
  choice: àánú wọn ṣe é
  alternative: ọkàn rẹ̀ fà sí wọn nítorí àánú
  rationale: Àṣàyàn náà tẹnu mọ́ àánú Jésù gẹ́gẹ́ bí ìdí tí ó fi wo àwọn aláìsàn sàn, ṣùgbọ́n kò gbé ìmọ̀lára náà ga ju ohun tí ọ̀rọ̀ orísun sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ogunlọ́gọ̀ ènìyàn’ fún ọ̀pọ̀ ènìyàn àti ‘àánú wọn ṣe é’ fún ìmọ̀lára jíjinlẹ̀, nígbà tí a pa ìṣókí àti ìtẹ̀lé ìṣe inú ọ̀rọ̀ Gíríìkì mọ́.
