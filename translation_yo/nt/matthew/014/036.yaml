  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: yo
  text: Wọ́n sì ń bẹ̀ ẹ́ pé kí wọ́n lè fọwọ́ kan etí aṣọ rẹ̀ nìkan[a]; gbogbo àwọn tí ó fọwọ́ kàn án sì ni a mú lára dá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìpà aṣọ” tàbí “ààlà aṣọ”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí etí tàbí ìpà aṣọ, ó sì lè ní í ṣe pẹ̀lú okùn ìṣẹ́tí aṣọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “wọ́n di ara dídá.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “a gbà wọ́n là” tàbí “a dá wọ́n nídè,” ṣùgbọ́n nínú àyíká yìí, ìmúláradá ara ni ó ń tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: ń bẹ̀ ẹ́
  rationale: Ọ̀rọ̀-ìṣe aláìpé náà ń tọ́ka sí ẹ̀bẹ̀ tí wọ́n ń bá a lọ láti bẹ; ‘ń bẹ̀ ẹ́’ jẹ́ èdè Yorùbá àdánidá tó sì fi ìtara hàn.
- source_word: ἵνα μόνον ἅψωνται
  choice: pé kí ó jẹ́ kí àwọn kan fọwọ́ kan ... nìkan
  rationale: Ìtumọ̀ yìí fi àkóónú ẹ̀bẹ̀ wọn àti ìtẹnumọ́ μόνον (‘nìkan’) hàn ní Yorùbá àdánidá.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: etí aṣọ rẹ̀
  rationale: κράσπεδον lè túmọ̀ sí etí, ìṣẹ́tí, tàbí ìrísí aṣọ; ‘etí aṣọ’ kò sọ ohun tó ju ọ̀rọ̀ Gíríìkì lọ, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: ὅσοι
  choice: gbogbo àwọn tí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti fi ìtumọ̀ pínpín àti àpapọ̀ ὅσοι hàn.
- source_word: ἥψαντο
  choice: fọwọ́ kàn án
  rationale: Ó túmọ̀ sí ‘fọwọ́ kàn’; arọ́pò-orúkọ ‘án’ ń tọ́ka sí etí aṣọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: διεσώθησαν
  choice: a mú lára dá
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń sọ nípa ìmúláradá ara. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì ṣì jẹ́ kí àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì ní ìtumọ̀ tó gbòòrò sí i.
theological_decisions:
- issue: Ìtumọ̀ διεσώθησαν nínú àyíká iṣẹ́ ìwòsàn
  choice: a mú lára dá
  alternative: a gbà wọ́n là / wọ́n di ara dídá
  rationale: Àyíká ẹsẹ náà dá lórí àìsàn ara àti ìmúláradá, nítorí náà ‘a mú lára dá’ bá ohun tó ń ṣẹlẹ̀ mu. Àlàyé ìsàlẹ̀ pa ìtumọ̀ tó gbòòrò jù—ìgbàlà tàbí ìdáǹdè—mọ́ láìfi ẹ̀kọ́ ìgbàlà kan pàtó wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘etí aṣọ’ dípò ọ̀rọ̀ tó lè sọ ‘tassel’ ní pàtó ju ẹ̀rí Gíríìkì lọ.
