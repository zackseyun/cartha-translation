  to: Wọ́n sì ń bẹ̀ ẹ́ pé kí wọ́n lè fọwọ́ kan etí aṣọ rẹ̀ nìkan[a]; gbogbo àwọn tí ó fọwọ́ kàn án sì ni a mú lára dá[b].
