  to: Lẹ́sẹ̀kẹsẹ̀ ni Jésù na ọwọ́ rẹ̀, ó dì í mú, ó sì wí fún un pé, “Ìwọ tí ìgbàgbọ́ rẹ̀ kéré, èéṣe tí o fi ṣe iyèméjì?”[a]
