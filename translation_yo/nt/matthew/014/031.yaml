id: MAT.14.31
reference: Matthew 14:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀ ni Jésù na ọwọ́ rẹ̀, ó dì í mú, ó sì wí fún un pé, “Ìwọ tí ìgbàgbọ́ rẹ̀ kéré, èéṣe tí o fi ṣe iyèméjì?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èéṣe tí o fi fọkàn méjì?” Ọ̀rọ̀ ìṣe Gíríìkì náà lè tọ́ka sí ṣíṣiyèméjì tàbí yíyẹsẹ̀/àìdúró ṣinṣin.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn pé ìgbésẹ̀ Jésù ṣẹlẹ̀ láìjáfara, ó sì pa ìkánjú inú ìtàn náà mọ́.
- source_word: δὲ
  choice: —
  rationale: A kò túmọ̀ rẹ̀ lọ́tọ̀; ìṣàn gbólóhùn Yorùbá àti àmì “ó sì” ní apá tó tẹ̀ lé e ti mú ìbáṣepọ̀ ìtàn náà hàn láìjẹ́ kí ọ̀rọ̀ le.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: na ọwọ́ rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa àwòrán ìgbésẹ̀ náà àti bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn mọ́.
- source_word: ἐπελάβετο αὐτοῦ
  choice: dì í mú
  rationale: Ó sọ kedere pé Jésù fi ọwọ́ mú un ṣinṣin, láìfi èrò míì kún bí ó ṣe mú un.
- source_word: λέγει αὐτῷ
  choice: ó sì wí fún un pé
  rationale: A lo ọ̀nà ìtàn Yorùbá tó jẹ́ àdánidá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nínú ìtàn láti mú un yè.
- source_word: Ὀλιγόπιστε
  choice: Ìwọ tí ìgbàgbọ́ rẹ kéré
  rationale: Ó tọ́ka sí ìgbàgbọ́ tí kò tó, kì í ṣe àìní ìgbàgbọ́ pátápátá; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ju “onígbàgbọ́ kékeré” lọ.
- source_word: εἰς τί
  choice: èé ṣe
  rationale: Èyí ni ìbéèrè Yorùbá àdánidá fún ìdí ohun kan nínú àyíká yìí.
- source_word: ἐδίστασας
  choice: tí o fi ṣe iyèméjì
  rationale: Ó mú ìtumọ̀ ṣíṣiyèméjì jáde ní kedere, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ yíyẹsẹ̀ tàbí àìdúró ṣinṣin mọ́.
theological_decisions:
- issue: Ìtumọ̀ Ὀλιγόπιστε ní ìbáṣepọ̀ pẹ̀lú πίστις
  choice: Ìwọ tí ìgbàgbọ́ rẹ kéré
  alternative: Ìwọ onígbàgbọ́ kékeré
  rationale: Ọ̀rọ̀ náà bá Peteru wí nítorí àìpé ìgbàgbọ́ rẹ̀, kì í ṣe pé kò ní ìgbàgbọ́ rárá. Ìtumọ̀ yìí pa ìyàtọ̀ pàtàkì yẹn mọ́ láìfi ìkọ́ni ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yan gbólóhùn tó rọrùn fún òǹkàwé lásán láìsọ ìtumọ̀ orísun di híhá ju bó ṣe rí lọ.
