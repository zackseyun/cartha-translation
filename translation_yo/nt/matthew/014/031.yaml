  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: εὐθέως jẹ́ ‘Lẹ́sẹ̀kẹsẹ̀’; ἐκτείνας τὴν χεῖρα àti ἐπελάβετο αὐτοῦ ni a ti túmọ̀ sí ‘na ọwọ́ rẹ̀’ àti ‘dì í mú’; ìbéèrè ìbáwí náà sì pa ìtumọ̀ Ὀλιγόπιστε àti ἐδίστασας mọ́. Àlàyé ìsàlẹ̀ ojú ewé yẹ kí ó fi ìtumọ̀ míì ti διστάζω hàn ní ọ̀nà tó mọ́ kedere.'
