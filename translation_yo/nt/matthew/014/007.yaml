  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: yo
  text: Nítorí náà, ó fi ìbúra ṣèlérí pé yóò fún un ní ohunkóhun tí ó bá béèrè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohunkóhun tí ó lè béèrè.” Gbólóhùn Gíríìkì náà (ὃ ἐὰν αἰτήσηται) jẹ́ ọ̀rọ̀ ìbáṣepọ̀ tí ó fi ohun tí ó ṣí sílẹ̀ nínú ìbéèrè ọjọ́ iwájú hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ohun tí ó ṣẹlẹ̀ ṣáájú hàn, ó sì bá agbára ìtumọ̀ ìdí tàbí àbájáde inú ọ̀rọ̀ Gíríìkì mu.
- source_word: μετὰ ὅρκου
  choice: ó fi ìbúra
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìbúra bá ìlérí náà rìn; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìjẹ́wọ́ tó lágbára mọ́.
- source_word: ὡμολόγησεν
  choice: ṣèlérí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ṣíṣe àdéhùn tàbí ìlérí tó dájú, kì í ṣe ‘jẹ́wọ́.’
- source_word: αὐτῇ
  choice: fún un
  rationale: Ó jẹ́ ẹni tí ìlérí náà tọ́ sí; ‘fún un’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi olùgbà ìlérí hàn.
- source_word: δοῦναι
  choice: pé òun yóò fún un
  rationale: A tú infinitive tó sọ àkóónú ìlérí náà sí gbólóhùn Yorùbá tó bá èdè mu, láì yí ìtumọ̀ ‘láti fún’ padà.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: ohunkóhun tí ó bá béèrè
  rationale: Àkópọ̀ relative pronoun, ἐάν àti subjunctive ń tọ́ka sí ohun tí kò tíì dá lójú nínú ìbéèrè ọjọ́ iwájú; ‘tí ó bá béèrè’ pa ìṣí sílẹ̀ yìí mọ́ lọ́nà àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Àrọ́pò-orúkọ “òun” mú kó ṣe kedere pé Hẹ́rọ́dù ni yóò fún ọmọbìnrin náà ní ohun tí yóò béèrè.
