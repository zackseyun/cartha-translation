    rationale: Gbolohun ‘ìbéèrè ọjọ́ iwájú tí ohun tí a ó béèrè kò tíì dá lójú’ lè túmọ̀ sí pé akóónú ìbéèrè nìkan ni kò dájú. A tún un kọ́ láti fi hàn pé ìbéèrè náà jẹ́ èyí tí ó ṣí sílẹ̀, tí kò sì tíì dájú.
