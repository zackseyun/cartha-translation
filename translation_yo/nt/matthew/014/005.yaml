id: MAT.14.5
reference: Matthew 14:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé ó fẹ́ pa á[a], ó bẹ̀rù ogunlọ́gọ̀ náà, nítorí wọ́n kà á sí wòlíì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ìrísí ọ̀rọ̀ náà pẹkipẹki, “Ní fífẹ́ láti pa á, ó bẹ̀rù ogunlọ́gọ̀ náà.” Nínú àyíká yìí, a lè gbà á ní ọ̀nà ìtakora pé, “bí ó tilẹ̀ jẹ́ pé ó fẹ́ pa á.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n gbà pé wòlíì ni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: Bí ó tilẹ̀ jẹ́ pé ó fẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó túmọ̀ sí ‘ní fífẹ́’; nínú àyíká yìí, ìtumọ̀ ìyọ̀ǹda (‘bí ó tilẹ̀ jẹ́ pé’) fi ìbáṣepọ̀ rẹ̀ pẹ̀lú ‘ó bẹ̀rù’ hàn ní Yorùbá àdánidá láìyí èrò orísun padà.
- source_word: ἀποκτεῖναι
  choice: pa
  rationale: ‘Pa’ ni ọ̀rọ̀ Yorùbá tó ṣe tààrà jù fún pípa ènìyàn; kò fi ìdájọ́ ìwà bí ‘pànìyàn’ kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: ἐφοβήθη
  choice: ó bẹ̀rù
  rationale: Èyí ṣe àfihàn ìṣe aorist ti φοβέομαι ní ọ̀nà tó ṣe kedere, tó sì jẹ́ Yorùbá àdánidá.
- source_word: τὸν ὄχλον
  choice: ogunlọ́gọ̀ náà
  rationale: ‘Ogunlọ́gọ̀’ tọ́ka sí àwùjọ ènìyàn púpọ̀ ní ibi kan, ó sì bá ὄχλος mu ju ọ̀rọ̀ gbogbogbò bí ‘àwọn ènìyàn’ lọ.
- source_word: ὅτι
  choice: nítorí
  rationale: Níbí, ὅτι ń ṣàlàyé ìdí tí ó fi bẹ̀rù; ‘nítorí’ sọ ìbáṣepọ̀ ìdí náà kedere.
- source_word: ὡς προφήτην
  choice: sí wòlíì
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘kà,’ ‘sí wòlíì’ sọ bí ogunlọ́gọ̀ ṣe wo ẹni náà, láìfi iyèméjì tàbí ìfiwéra tí kò sí nínú orísun kún un.
- source_word: αὐτὸν εἶχον
  choice: wọ́n kà á sí
  rationale: ἔχω pẹ̀lú predicate accusative níbí túmọ̀ sí kí a ka tàbí wo ẹnìkan gẹ́gẹ́ bí ohun kan; ‘kà á sí’ jẹ́ ọ̀nà Yorùbá tó bójú mu.
theological_decisions:
- issue: Orúkọ ẹni tó ń ṣe ìṣe àti ẹni tí ìṣe náà kàn kò fara hàn nínú ẹsẹ Gíríìkì yìí.
  choice: A pa àwọn arọ́pò-orúkọ ‘ó’ àti ‘á’ mọ́ láìfi orúkọ Hẹ́rọ́dù tàbí Jòhánù sínú ẹsẹ náà.
  alternative: Bí ó tilẹ̀ jẹ́ pé Hẹ́rọ́dù fẹ́ pa Jòhánù, ó bẹ̀rù ogunlọ́gọ̀ náà, nítorí wọ́n kà Jòhánù sí wòlíì.
  rationale: Àyíká ẹsẹ tó ṣáájú fi àwọn ẹni náà hàn, ṣùgbọ́n Gíríìkì ẹsẹ yìí lo arọ́pò-orúkọ. Pípa irú àkọsílẹ̀ yẹn mọ́ yẹra fún fífi ohun tí kò fara hàn gbangba nínú ẹsẹ náà kún un.
- issue: Ìbáṣepọ̀ participle θέλων pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì ἐφοβήθη.
  choice: 'A túmọ̀ ọ́ ní ọ̀nà ìyọ̀ǹda: ‘Bí ó tilẹ̀ jẹ́ pé ó fẹ́ …, ó bẹ̀rù …’'
  alternative: Ní fífẹ́ láti pa á, ó bẹ̀rù ogunlọ́gọ̀ náà.
  rationale: Participial construction náà lè dúró ní ṣókí gẹ́gẹ́ bí ‘ní fífẹ́,’ ṣùgbọ́n àyíká fi ìtakora hàn láàárín ìfẹ́ láti pa á àti ìbẹ̀rù ogunlọ́gọ̀. Ìtumọ̀ ìyọ̀ǹda mú èyí ṣe kedere ní Yorùbá láìyanju rẹ̀ kọjá ohun tí àyíká ń tọ́ka sí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ogunlọ́gọ̀’ jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì ṣe àfihàn àwùjọ ènìyàn púpọ̀; ‘kà á sí wòlíì’ jẹ́ gbólóhùn àdánidá fún ìdájọ́ tí àwọn ènìyàn ṣe nípa ẹni náà.
