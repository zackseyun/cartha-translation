  to: Bí ó tilẹ̀ jẹ́ pé ó fẹ́ pa á[a], ó bẹ̀rù ogunlọ́gọ̀ náà, nítorí wọ́n kà á sí wòlíì[b].
  rationale: A pa ẹsẹ ìtumọ̀ náà mọ́ nítorí ó jẹ́ olóòtítọ́ sí orísun, ó sì jẹ́ Yorùbá àdánidá. A tún àlàyé ìsàlẹ̀ a ṣe nìkan, láti yọ ìlò “ìyọ̀ǹda” tí kò péye kúrò, kí àlàyé participle náà lè ṣàfihàn ìtakora tó wà nínú àyíká ní kedere.
