  source_fidelity: 'Ìtumọ̀ ẹsẹ náà fara mọ́ Gíríìkì dáadáa: ó pa àwọn arọ́pò-orúkọ tí orísun náà lò mọ́, ó túmọ̀ ἀποκτεῖναι sí “pa,” ἐφοβήθη sí “bẹ̀rù,” àti idiom αὐτὸν εἶχον ὡς προφήτην sí “wọ́n kà á sí wòlíì.” Ìtumọ̀ ìtakora nínú “Bí ó tilẹ̀ jẹ́ pé” jẹ́ èyí tí àyíká gbà fún participle θέλων, bí ó tilẹ̀ jẹ́ pé kì í ṣe ìtumọ̀ kan ṣoṣo tí gírámà náà lè ní.'
