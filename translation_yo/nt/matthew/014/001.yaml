  text: Ἐν ἐκείνῳ τῷ καιρῷ ἤκουσεν Ἡρῴδης ὁ τετραάρχης τὴν ἀκοὴν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: yo
  text: Ní àkókò náà, Hẹ́rọdù tẹ́tíràákì gbọ́ ìròyìn nípa Jésù,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a ń sọ nípa Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Ní àkókò náà
  rationale: Ó jẹ́ gbólóhùn àkókò tó ṣe déédé ní Yorùbá, ó sì pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì jẹ́ líle.
- source_word: ἤκουσεν
  choice: gbọ́
  rationale: Èyí ni ìtumọ̀ tààrà ti ọ̀rọ̀ náà, kò sì fi àlàyé tí kò sí nínú orísun kún un.
- source_word: Ἡρῴδης
  choice: Hẹ́rọ́dù
  rationale: Àkọtọ̀ Yorùbá tó wọ́pọ̀ fún orúkọ ẹni náà ni.
- source_word: ὁ τετραάρχης
  choice: tetraki
  rationale: A lo orúkọ oyè ìṣèlú pàtó náà dípò àlàyé gbooro, kí ìpéye ìtàn má bàa sọnù.
- source_word: τὴν ἀκοὴν
  choice: ìròyìn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ohun tí a gbọ́, ìyẹn ìròyìn tàbí àhesọ, kì í ṣe agbára láti gbọ́.
- source_word: Ἰησοῦ
  choice: nípa Jésù
  rationale: Ọ̀nà àdánidá ni èyí láti fi hàn pé Jésù ni kókó inú ìròyìn náà.
theological_decisions: []
