  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti òde òní ni a lò. A pa oyè ìṣèlú ‘tetraki’ mọ́ fún ìpéye, bí ó tilẹ̀ jẹ́ pé ó lè nílò àlàyé nínú àkójọ ọ̀rọ̀.
