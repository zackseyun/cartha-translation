  to: Nígbà tí Jésù gbọ́ èyí, ó fi ọkọ̀ ojú omi kúrò níbẹ̀ lọ sí ibi àdádó[a] ní ìkọ̀kọ̀. Ṣùgbọ́n nígbà tí àwọn ogunlọ́gọ̀ gbọ́, wọ́n fi ẹsẹ̀ tẹ̀ lé e láti àwọn ìlú[b].
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí kò dára ní Yorùbá fún κατ’ ἰδίαν pẹ̀lú “ní ìkọ̀kọ̀,” láìpinnu bóyá Jésù kúrò nítorí ààbò, ìbànújẹ́, tàbí ìdí mìíràn. Ó tún mú ọ̀rọ̀ fún οἱ ὄχλοι rọrùn, ó sì ṣàtúnṣe akọsílẹ̀ a kí ó má bàa sọ ibi náà di ibi àwókù ilé.
