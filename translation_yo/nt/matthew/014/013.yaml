    rationale: “Ibi ahoro” lè túmọ̀ sí ibi tí ó ti bàjẹ́ tàbí àwókù ibùgbé. Àlàyé “ibi tí ènìyàn kò gbé” ń dá ìtumọ̀ ἔρημος dúró dáadáa síi.
