  source_fidelity: 'Ìtumọ̀ náà ń pa ìṣísẹ̀ ìtàn Gíríìkì mọ́ dáadáa: ìgbọ́ Jésù, ìkúrò rẹ̀ láti ibẹ̀ nínú ọkọ̀ ojú omi sí ibi àdádó, àti bí ogunlọ́gọ̀ náà ṣe tẹ̀ lé e ní ẹsẹ̀ láti àwọn ìlú. Síbẹ̀, “ní òun nìkan” kò jẹ́ ọ̀nà Yorùbá tó dára láti gbé κατ’ ἰδίαν; ó lè dà bí ẹni pé a ń tẹnumọ́ ẹni Jésù nìkan, dípò ìṣe ní ìpamọ́/tabi ní àdáni.'
  naturalness: Àmì ohùn àti ìṣètò gbogbogbò jẹ́ rere. “Ní ìkọ̀kọ̀” jẹ́ àdánidá, ìforúkọsílẹ̀ ìtàn tí ó bójú mu fún “κατ’ ἰδίαν.” “Àwọn ogunlọ́gọ̀” tún rọrùn ju “àwọn ogunlọ́gọ̀ ènìyàn” lọ níhìn-ín.
  terminology: “Ọkọ̀ ojú omi,” “ibi àdádó,” “ogunlọ́gọ̀,” “tẹ̀ lé,” àti “ní ẹsẹ̀” jẹ́ àwọn ọ̀rọ̀ tó yẹ. Àlàyé akọsílẹ̀ a yẹ kí ó ṣàlàyé ibi tí ènìyàn kò gbé láìfi ìtumọ̀ “ahoro” tí ó lè mú ìrònú ibi ahoro tàbí àwókù ilé wá sí iwájú ju bó ṣe yẹ lọ.
