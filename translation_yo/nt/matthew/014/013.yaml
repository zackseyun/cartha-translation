id: MAT.14.13
reference: Matthew 14:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: yo
  text: Nígbà tí Jésù gbọ́ èyí, ó fi ọkọ̀ ojú omi kúrò níbẹ̀ lọ sí ibi àdádó[a] ní ìkọ̀kọ̀. Ṣùgbọ́n nígbà tí àwọn ogunlọ́gọ̀ gbọ́, wọ́n fi ẹsẹ̀ tẹ̀ lé e láti àwọn ìlú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “ibi tí ènìyàn kò gbé” tàbí “ibi tí ó ya sọ́tọ̀.” Ọ̀rọ̀ Gíríìkì náà ń ṣàpèjúwe ibi tí ènìyàn kò gbé tàbí tí ó jìnnà sí àwọn ènìyàn; kì í ṣe dandan pé ó jẹ́ aṣálẹ̀ oníyanrìn.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn ìlú kéékèèké tàbí àwọn ìlú ńlá, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Nígbà tí ... gbọ́
  rationale: A tú participle aorist náà ní ọ̀nà àkókò; δέ sì ń tẹ ìtàn náà síwájú láìfi ìtakora líle kún un.
- source_word: ἀνεχώρησεν
  choice: kúrò ... lọ
  rationale: Ọ̀rọ̀ yìí fi hàn pé Jésù yọ kúrò níbẹ̀ sí ibòmíràn. Gbólóhùn Yorùbá yìí dáàbò bo ìtumọ̀ náà láìsọ ìdí tí ó fi kúrò.
- source_word: ἐν πλοίῳ
  choice: fi ọkọ̀ ojú omi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun èlò tàbí ọ̀nà ìrìn-àjò.
- source_word: εἰς ἔρημον τόπον
  choice: sí ibi àdádó
  rationale: ἔρημος níhìn-ín túmọ̀ sí ibi tí ó ya sọ́tọ̀ tàbí tí ènìyàn kò pọ̀ sí, kì í ṣe dandan pé ó jẹ́ aṣálẹ̀ oníyanrìn.
- source_word: κατ’ ἰδίαν
  choice: ní òun nìkan
  rationale: Ó pa èrò pé Jésù fẹ́ wà ní àdáni mọ́, ó sì yà á sọ́tọ̀ kedere sí àpèjúwe ibi náà.
- source_word: οἱ ὄχλοι
  choice: àwọn ogunlọ́gọ̀ ènìyàn
  rationale: Èyí pa ọ̀pọ̀ nínú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: πεζῇ
  choice: fi ẹsẹ̀
  rationale: Ó sọ ní tààrà pé wọ́n rin ìrìn-àjò náà lórí ilẹ̀, kì í ṣe nínú ọkọ̀ ojú omi.
- source_word: ἀπὸ τῶν πόλεων
  choice: láti àwọn ìlú
  rationale: “Ìlú” lè tọ́ka sí town tàbí city ní Yorùbá, nítorí náà kò fi ìwọ̀n àwọn ibùgbé náà múlẹ̀ ju orísun lọ.
theological_decisions:
- issue: Ìdí tí Jésù fi kúrò níbẹ̀
  choice: A sọ ìṣe náà níwọ̀ntúnwọ̀nsì gẹ́gẹ́ bí “ó ... kúrò níbẹ̀ lọ,” láìsọ ìdí rẹ̀.
  alternative: Láti sọ pé ó sá fún ààbò, pé ó lọ ṣọ̀fọ̀, tàbí pé ó lọ gbàdúrà.
  rationale: Ẹsẹ náà sọ pé Jésù kúrò lẹ́yìn tí ó gbọ́ ìròyìn, ṣùgbọ́n kò sọ ìdí rẹ̀ ní tààrà; ìtumọ̀ kò gbọ́dọ̀ parí ohun tí ẹsẹ náà fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, pẹ̀lú ìṣísẹ̀ ọ̀rọ̀ tí ó mọ́gbọ́n dání, tí ó lọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A gbé àmì àlàyé [a] àti [b] sí ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
