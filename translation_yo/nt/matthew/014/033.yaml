id: MAT.14.33
reference: Matthew 14:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: yo
  text: Nígbà náà, àwọn tó wà nínú ọkọ̀ náà jọ́sìn fún un[a], wọ́n sì ní, “Lóòótọ́, Ọmọ Ọlọ́run ni ìwọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “foríbalẹ̀ fún un” tàbí “wọlẹ̀ fún un.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìfihàn ọ̀wọ̀ nípa kíkúnlẹ̀ tàbí wíwólẹ̀; ṣùgbọ́n nínú àyíká yìí, ìtumọ̀ “jọ́sìn” dára.
    reason: lexical_alternative
  - marker: b
    text: Nínú Gíríìkì, ọ̀rọ̀ náà kò ní article níwájú “Ọlọ́run,” ṣùgbọ́n nínú àyíká yìí ó jẹ́ oyè, kì í ṣe “ọmọ ọlọ́run kan.” Yorùbá kò fi ìyàtọ̀ article yìí hàn ní ọ̀nà kan náà.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nígbà náà, àwọn
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀; “Nígbà náà” ń fi ìtẹ̀síwájú ìtàn hàn láìfi ìtakora tí kò sí sínú ọ̀rọ̀ náà.
- source_word: ἐν τῷ πλοίῳ
  choice: tí ó wà nínú ọkọ̀ náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí àwọn ènìyàn inú ọkọ̀ ojú omi tí a ti mẹ́nu kàn.
- source_word: προσεκύνησαν αὐτῷ
  choice: foríbalẹ̀ fún un
  rationale: προσκυνέω lè túmọ̀ sí fíforíbalẹ̀ tàbí jíjọ́sìn. “Foríbalẹ̀ fún un” pa ìṣe ara àti ọ̀wọ̀ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé ó ní agbára ìjọsìn.
- source_word: λέγοντες
  choice: wọ́n ní
  rationale: Bí ó tilẹ̀ jẹ́ pé ó jẹ́ participle ní Gíríìkì, gbólóhùn aláṣẹ̀sẹ̀ yìí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì pa ìtumọ̀ “wọ́n ń sọ pé” mọ́.
- source_word: Ἀληθῶς
  choice: Lóòótọ́
  rationale: “Lóòótọ́” jẹ́ ìjẹ́rìí tó lágbára, tó bójú mu ìwọ̀n ọ̀rọ̀ ìjẹ́wọ́ náà.
- source_word: θεοῦ υἱὸς
  choice: Ọmọ Ọlọ́run
  rationale: Ìṣètò Gíríìkì náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè nínú àyíká yìí; Yorùbá kò nílò article kan láti fi hàn pé kì í ṣe “ọmọ ọlọ́run kan.”
- source_word: εἶ
  choice: ni ìwọ
  rationale: Ìṣètò “Ọmọ Ọlọ́run ni ìwọ” jẹ́ Yorùbá àdánidá, ó sì tẹnumọ́ ẹni tí Jésù jẹ́.
theological_decisions:
- issue: Agbára ìtumọ̀ προσκυνέω sí Jésù
  choice: foríbalẹ̀ fún un, pẹ̀lú àlàyé pé ó tún lè jẹ́ “jọ́sìn fún un”
  alternative: jọ́sìn fún un
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìforíbalẹ̀ gẹ́gẹ́ bí àmì ọ̀wọ̀ tàbí sí ìjọsìn. Àyíká—agbára Jésù lórí òkun àti ìjẹ́wọ́ tó tẹ̀ lé e—ṣe atilẹyin agbára ìjọsìn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ààyè ìtumọ̀ ọ̀rọ̀ náà mọ́.
- issue: Bóyá θεοῦ υἱὸς jẹ́ pàtó tàbí àìpàtó
  choice: Ọmọ Ọlọ́run
  alternative: ọmọ ọlọ́run kan
  rationale: Àìsí article níwájú θεοῦ kò sọ gbólóhùn náà di àìpàtó dandan. Nínú àyíká Mátíù, ó jẹ́ orúkọ oyè ìjẹ́wọ́; “ọmọ ọlọ́run kan” yóò dín agbára rẹ̀ kù.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé lásán. “Ọkọ̀” ni a lò fún ọkọ̀ ojú omi nítorí àyíká ìtàn, “foríbalẹ̀” sì pa àìdánilójú gidi inú προσκυνέω mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
