  rationale: The revision replaces an idiom that can mean “followed them” with the direct and natural “wá sọ́dọ̀ wọn,” accurately rendering ἦλθεν πρὸς αὐτούς. It also makes footnote a clearer by treating “on the water of the sea” as the contextual sense rather than as a merely redundant alternative wording. No theological interpretation has been added.
