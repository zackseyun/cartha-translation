id: MAT.14.25
reference: Matthew 14:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: yo
  text: Ní ìṣọ́ kẹrin òru, ó sì wá sọ́dọ̀ wọn, ó ń rìn lórí òkun.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà túmọ̀ sí pé ó ń rìn lórí omi òkun. Àwọn kan ti ka a sí “ó ń rìn lẹ́gbẹ̀ẹ́ òkun,” ṣùgbọ́n àyíká ìtàn náà fi agbára ṣe àtìlẹ́yìn fún rírìn lórí omi fúnra rẹ̀.
    reason: alternative_reading
  - marker: b
    text: “Ìṣọ́ kẹrin òru” ni ìṣọ́ tó gbẹ̀yìn nínú òru, ó fẹ́rẹ̀ẹ́ jẹ́ láàárín aago mẹ́ta òwúrọ̀ sí aago mẹ́fà òwúrọ̀ nínú ètò àwọn ará Róòmù.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: ní ìṣọ́ kẹrin òru
  rationale: Gbólóhùn dátífù náà ń tọ́ka sí àkókò ìṣẹ̀lẹ̀. “Ìṣọ́ kẹrin òru” pa ètò ìpín òru sí àkókò ìṣọ́ mọ́ dípò yíyí i padà sí wákàtí òde òní.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ fẹ́lẹ́fẹ́lẹ́ tó ń tẹ ìtàn náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti fi hàn ní Yorùbá.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: ó tọ̀ wọ́n wá
  rationale: Ọ̀rọ̀ náà fi ìṣípò sí ọ̀dọ̀ àwọn ọmọ-ẹ̀yìn hàn. “Tọ̀ wọ́n wá” mú ìdarí ìṣípò yẹn jáde ní Yorùbá àdánidá.
- source_word: περιπατῶν
  choice: ó ń rìn
  rationale: Partísípù àsìkò ìsinsìnyí fi ìṣe tó ń lọ lẹ́ẹ̀kan náà pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì hàn; “ó ń rìn” sọ ìbáṣepọ̀ àsìkò yẹn ní kedere.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: lórí òkun
  rationale: Pẹ̀lú περιπατῶν àti àyíká ìtàn náà, gbólóhùn náà tọ́ka sí rírìn lórí omi. “Òkun” tún pa ìtumọ̀ θάλασσα mọ́ láìrọ́pò rẹ̀ pẹ̀lú ìdánimọ̀ ilẹ̀-ayé pé adágún ni.
theological_decisions:
- issue: Àpèjúwe iṣẹ́ ìyanu tí Jésù fi ń rìn lórí omi
  choice: ó ń rìn lórí òkun
  alternative: ó ń rìn lẹ́gbẹ̀ẹ́ òkun
  rationale: Ìlò περιπατῶν ἐπὶ τὴν θάλασσαν nínú àyíká yìí ń tọ́ka gidigidi sí ìṣípò lórí omi, kì í ṣe rírìn létíkun. Ìtumọ̀ náà pa agbára iṣẹ́ ìyanu tí ọ̀rọ̀ Gíríìkì sọ mọ́ láìfikún ohun tí kò sí nínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ọ̀rọ̀ ìtàn-akọọ́lẹ̀ “ìṣọ́ kẹrin òru” mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
