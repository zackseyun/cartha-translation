  verdict: revise
  source_fidelity: The temporal phrase and the description of walking on the sea are represented faithfully. However, “ó tọ̀ wọ́n wá” normally suggests following/pursuing them and does not reliably render ἦλθεν πρὸς αὐτούς, “he came to them.”
  naturalness: “Ó wá sọ́dọ̀ wọn” is the natural, unambiguous Standard Yorùbá expression for coming to them. The remaining wording is clear and appropriately formal.
  terminology: “Ìṣọ́ kẹrin òru” appropriately retains the ancient night-watch terminology, and “lórí òkun” preserves θάλασσαν without unnecessarily substituting “adágún.”
  issues:
  - severity: high
    issue: The main verb phrase “ó tọ̀ wọ́n wá” is inaccurate.
    rationale: In normal Yorùbá usage, tọ ẹni wá means to follow or pursue someone, whereas the Greek ἦλθεν πρὸς αὐτούς means that he came to them. “Ó wá sọ́dọ̀ wọn” preserves the intended direction and event.
  - severity: low
    issue: Footnote a’s opening alternative is not meaningfully distinct from the main rendering.
    rationale: “Lórí omi òkun” is an explanatory expansion of “lórí òkun,” rather than a genuine alternative translation. The note can state the contextual sense directly while retaining the reported interpretive alternative “lẹ́gbẹ̀ẹ́ òkun.”
