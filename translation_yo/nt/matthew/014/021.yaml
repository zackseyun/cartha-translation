  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: yo
  text: Àwọn ọkùnrin tí wọ́n jẹun sì tó bí ẹgbẹ̀rún márùn-ún[a], yàtọ̀ sí àwọn obìnrin àti àwọn ọmọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìka àwọn obìnrin àti àwọn ọmọ sí.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún χωρίς tí ó tẹnu mọ́ pé a kò ka àwọn obìnrin àti ọmọ mọ́ iye náà.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Àwọn ọkùnrin tí ó jẹun sì
  rationale: A ṣètò gbólóhùn náà ní ọ̀nà àdánidá Yorùbá, ní fífi “ọkùnrin” mọ́ àwọn tí wọ́n jẹun; “sì” ń fi agbára ìsopọ̀ δέ hàn láìfi ọ̀rọ̀ àkókò kan kún un.
- source_word: ἦσαν
  choice: tó
  rationale: Nínú gbólóhùn iye ní Yorùbá, “tó” jẹ́ ọ̀nà àdánidá láti sọ iye tí ẹgbẹ́ kan dé, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí ìbámu pẹ̀lú copula ἦσαν nínú àyíká yìí.
- source_word: ἄνδρες
  choice: ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn akọ, kì í ṣe gbogbo ènìyàn lápapọ̀; “ọkùnrin” pa ìyàtọ̀ yìí mọ́, ní pàtàkì bí a ti mẹ́nu kan àwọn obìnrin àti ọmọ lọ́tọ̀.
- source_word: ὡσεὶ
  choice: bí
  rationale: “Bí” níwájú iye ń sọ ìṣírò tí kò pé gédégbé ní Yorùbá, gẹ́gẹ́ bí ὡσεὶ.
- source_word: πεντακισχίλιοι
  choice: ẹgbẹ̀rún márùn-ún
  rationale: Èyí ni ìtumọ̀ iye náà ní Yorùbá.
- source_word: χωρὶς
  choice: yàtọ̀ sí
  rationale: “Yàtọ̀ sí” sọ pé àwọn obìnrin àti ọmọ kò sí nínú iye ẹgbẹ̀rún márùn-ún náà, ó sì pa àwòrán ìyàsọ́tọ̀ inú χωρίς mọ́.
- source_word: γυναικῶν
  choice: àwọn obìnrin
  rationale: Kò sí ìbáṣepọ̀ ìgbéyàwó tí àyíká yìí ń tọ́ka sí; nítorí náà “àwọn obìnrin” ni ìtumọ̀ tó yẹ.
- source_word: παιδίων
  choice: àwọn ọmọ
  rationale: “Àwọn ọmọ” jẹ́ ọ̀nà àdánidá àti gbòòrò fún παιδίων láìfi ọjọ́-orí tí orísun kò sọ kún un.
theological_decisions:
- issue: Ọ̀rọ̀ ìkà tí ó dá lórí akọ nínú ọ̀pọ̀ ènìyàn tí akọ, abo àti ọmọ wà
  choice: A túmọ̀ ἄνδρες sí “ọkùnrin,” a sì fi hàn pé àwọn obìnrin àti ọmọ kò sí nínú iye náà.
  alternative: Lílo “ènìyàn” fún gbogbo àwọn tó wà níbẹ̀.
  rationale: Gíríìkì ka àwọn akọ ní pàtó, ó sì mẹ́nu kan àwọn obìnrin àti ọmọ lọ́tọ̀. “Ènìyàn” yóò pa ìyàtọ̀ ọ̀rọ̀ orísun náà rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbo.
