id: MAT.14.30
reference: Matthew 14:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó rí afẹ́fẹ́ líle náà[a], ẹ̀rù bà á; bí ó sì ti bẹ̀rẹ̀ sí í rì, ó ké pé, “Olúwa, gbà mí là[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “afẹ́fẹ́ líle gan-an.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbà mí.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbígbà ènìyàn kúrò nínú ewu tó wà lẹ́sẹ̀kẹsẹ̀, ó sì tún lè tọ́ka sí ìgbàlà ní ìtumọ̀ tó gbooro.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: nígbà tí ó rí
  rationale: Ó fi ìṣe tí ó ń ṣẹlẹ̀ ní àkókò kan náà hàn ní Yorùbá àdánidá, láì sọ ọ́ di ìṣe tí ó yà sọ́tọ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: 'Ó mú ìyípadà àti ìtakora nínú ìtàn hàn: Pétérù ti ń rìn lórí omi, ṣùgbọ́n ìrí afẹ́fẹ́ mú ẹ̀rù bà á.'
- source_word: ἄνεμον ἰσχυρόν
  choice: afẹ́fẹ́ líle náà
  rationale: “Afẹ́fẹ́ líle” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹ̀fúùfù alágbára, ó sì pa ìtumọ̀ ἰσχυρός mọ́ láì sọ ọ́ di ohun tó ju orísun lọ.
- source_word: ἐφοβήθη
  choice: ẹ̀rù bà á
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ìbẹ̀rù bẹ̀rẹ̀ sí í mú un ní àkókò náà.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: bí ó sì ti bẹ̀rẹ̀ sí í rì
  rationale: Ó pa ìbẹ̀rẹ̀ ìrìsílẹ̀ sínú omi mọ́; kò sọ pé ó ti rì tán tàbí pé ó ti kú sínú omi.
- source_word: ἔκραξεν λέγων
  choice: ó ké pé
  rationale: Ó jẹ́ Yorùbá tó ṣàn déédéé fún igbe ẹ̀bẹ̀ kánjúkánjú, ó sì darapọ̀ ìké àti ọ̀rọ̀ tí ó tẹ̀ lé e gẹ́gẹ́ bí èdè Yorùbá ṣe máa ń ṣe.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó yẹ fún κύριος nígbà tí a ń bá Jésù sọ̀rọ̀, ó sì pa ìwọ̀n ọlá àti ìwúwo ọ̀rọ̀ náà mọ́.
- source_word: σῶσόν με
  choice: gbà mí là
  rationale: Ó bá ẹ̀bẹ̀ fún ìgbàlà kúrò nínú ewu omi mu, ó sì tún pa ààyè ìtumọ̀ gbooro ti σῴζω mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí ọ̀rọ̀ tí Pétérù fi pe Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìwúwo ọ̀rọ̀ κύριος àti ìtumọ̀ rẹ̀ nínú Mátíù mọ́, láì fi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ σῴζω níbi ewu ojú-ẹsẹ̀
  choice: gbà mí là
  alternative: gbà mí
  rationale: “Gbà mí là” bójú mu ìgbàlà kúrò nínú ewu tó wà lẹ́sẹ̀kẹsẹ̀, ó sì lè ru ìtumọ̀ ìgbàlà tó gbooro tí ọ̀rọ̀ Gíríìkì náà ní.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àkópọ̀ “ó ké pé” dípò títẹ̀lé participle Gíríìkì ní ọ̀rọ̀-lọ́rọ̀, nítorí pé èyí ni ìṣàn Yorùbá àdánidá. Gbogbo àmì ohùn àti àmì ẹsẹ̀ ni a fi síbi tí ó yẹ.
