source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: yo
  text: Nítorí Jòhánù ti ń sọ fún un pé, “Kò bófin mu fún ọ láti ní i.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: ti ń sọ
  rationale: Àìpé ọ̀rọ̀-ìṣe Gíríìkì náà ń fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn; “ti ń sọ” mú agbára yìí jáde lọ́nà àdánidá nínú Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ tí ó ṣáájú.
- source_word: αὐτῷ
  choice: fún un
  rationale: Dátífù pẹ̀lú λέγω tọ́ka sí ẹni tí Johanu ń bá sọ̀rọ̀.
- source_word: ὁ Ἰωάννης
  choice: Johanu
  rationale: Orísun náà pe ẹni tí ń sọ̀rọ̀ ní Johanu lásán; àyíká ti dá ẹni náà mọ̀.
- source_word: Οὐκ ἔξεστίν
  choice: Kò bófin mu
  rationale: Gbólóhùn yìí sọ ohun tí kò ní àṣẹ tàbí tí kò tọ́ lábẹ́ òfin; “kò bófin mu” pa agbára òfin àti ìwà rere rẹ̀ mọ́.
- source_word: σοι
  choice: fún ọ
  rationale: Pẹ̀lú gbólóhùn aláìlẹ́ni ἔξεστιν, èyí ni ọ̀nà Yorùbá àdánidá láti fi ẹni tí àṣẹ náà kàn hàn.
- source_word: ἔχειν
  choice: láti ní
  rationale: Ó pa ọ̀rọ̀ Gíríìkì mọ́ ní tààrà, nígbà tí àyíká ń fi hàn pé ó jẹ́ níní obìnrin gẹ́gẹ́ bí aya tàbí alábàágbé.
- source_word: αὐτήν
  choice: obìnrin náà
  rationale: Yorùbá sábà máa ń tún orúkọ ìsọ̀rí ṣe dípò arọ́pò-orúkọ abo; yíyan yìí tọ́ka sí Herodia ní kedere láì fi “gẹ́gẹ́ bí aya” kún orísun.
theological_decisions:
- issue: Irú ìbáwí Johanu
  choice: “Kò bófin mu fún ọ láti ní obìnrin náà.”
  alternative: “A kò gbà ọ́ láàyè láti ní obìnrin náà.”
  rationale: ἔξεστιν ní agbára ìyọ̀ǹda tàbí ìbámu pẹ̀lú òfin. “Kò bófin mu” pa ìbáwí òfin àti ti ìwà rere mọ́ láì sọ òfin pàtó tí ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye. “Ti ń sọ” pa ìṣe tí ó ń bá a lọ mọ́, “obìnrin náà” sì jẹ́ ọ̀nà Yorùbá àdánidá fún arọ́pò-orúkọ abo nínú àyíká yìí.
