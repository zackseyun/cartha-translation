  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: yo
  text: Lẹ́yìn tí wọ́n ti rékọjá[a], wọ́n dé sí ilẹ̀ Gẹnẹsarẹti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n dé sí ilẹ̀ náà ní Gẹnẹsarẹti.” Gíríìkì so “sí ilẹ̀” pọ̀ mọ́ “sí Gẹnẹsarẹti,” ó sì ń fi ìdídé sí ilẹ̀ tàbí sí agbègbè Gẹnẹsarẹti hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: nígbà tí wọ́n ti rékọjá
  rationale: Aorist participle náà fi ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì hàn. ‘Nígbà tí wọ́n ti rékọjá’ jẹ́ Yorùbá àdánidá, ó sì pa èrò ìrékọjá lórí omi mọ́ láì sọ ohun èlò ìrìn-àjò ní pàtó.
- source_word: ἦλθον
  choice: wọ́n dé
  rationale: Nínú àyíká tí a ti sọ ibi tí wọ́n ń lọ, ‘wọ́n dé’ mú ìtumọ̀ dídé ti ἔρχομαι jáde lọ́nà àdánidá ju ‘wọ́n wá’ lọ.
- source_word: ἐπὶ τὴν γῆν
  choice: sí ilẹ̀
  rationale: Ó tẹ̀lé ìtumọ̀ gangan ‘sí orí ilẹ̀’ ṣùgbọ́n ó yàgò fún ọ̀rọ̀ tí kò rọrùn ní Yorùbá. Nínú àyíká ọkọ̀ ojú omi, ó lè túmọ̀ sí dídé sí ilẹ̀ tàbí etíkun.
- source_word: εἰς Γεννησαρέτ
  choice: Gẹnẹsarẹti
  rationale: A so orúkọ agbègbè náà mọ́ ‘ilẹ̀’ gẹ́gẹ́ bí ibi tí wọ́n dé; èyí jẹ́ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀ ìdarí méjì, ἐπί àti εἰς, papọ̀.
- source_word: Γεννησαρέτ
  choice: Gẹnẹsarẹti
  rationale: A ṣe àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìró rẹ̀, a sì fi àmì ohùn sí i níbi tí ó bá yẹ fún kíkà Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. A yan ‘ilẹ̀ Gẹnẹsarẹti’ láti pa ìṣọ̀kan ἐπὶ τὴν γῆν εἰς Γεννησαρέτ mọ́, láì fi ‘etíkun’ kún un gẹ́gẹ́ bí ìtumọ̀ tí ó ju orísun lọ.
