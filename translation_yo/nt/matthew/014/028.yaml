id: MAT.14.28
reference: Matthew 14:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: yo
  text: Peteru sì dá a lóhùn pé, “Olúwa, bí ìwọ ni, pàṣẹ fún mi láti wá bá ọ lórí omi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Peteru sì dá a lóhùn pé
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà ìtàn tí ó wọ́pọ̀. “Sì dá a lóhùn pé” jẹ́ Yorùbá àdánidá, ó sì pa ìsopọ̀ ọ̀rọ̀ δέ àti ẹni tí Peteru ń dá lóhùn mọ́.
- source_word: ὁ Πέτρος
  choice: Peteru
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: Κύριε
  choice: Olúwa
  rationale: “Olúwa” fi ọ̀wọ̀ àti ìwúwo tí κύριος lè ní nípa ẹni tí Jesu jẹ́ hàn, láì dín un kù sí ọ̀rọ̀ ìkíni lásán.
- source_word: εἰ σὺ εἶ
  choice: bí ìwọ ni
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ìdánimọ̀ ẹni náà; “bí ìwọ ni” jẹ́ Yorùbá àdánidá tí ó sì pa ìtẹnumọ́ σὺ mọ́.
- source_word: κέλευσόν με
  choice: pàṣẹ fún mi
  rationale: κελεύω ní agbára àṣẹ nínú àyíká yìí; “pàṣẹ fún mi” sọ agbára yẹn ní kedere.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: láti wá bá ọ
  rationale: Níwọ̀n bí ìṣípò náà ti ń lọ sí ọ̀dọ̀ Jesu, “wá bá ọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún wíwá dé ọ̀dọ̀ ẹni.
- source_word: ἐπὶ τὰ ὕδατα
  choice: lórí omi
  rationale: Bí ó tilẹ̀ jẹ́ pé ὕδατα jẹ́ ọ̀pọ̀ nínú Gíríìkì, “omi” jẹ́ orúkọ àìníye ní Yorùbá, “lórí omi” sì ni ọ̀nà àdánidá tí ó bójú mu láti sọ ìtumọ̀ náà.
theological_decisions:
- issue: Agbára ọ̀rọ̀ κύριε tí Peteru fi pe Jesu
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ọ̀wọ̀ àti ìtumọ̀ nípa ẹni tí Jesu jẹ́ mọ́, láì fi dandan pinnu bí ìjíròrò ẹ̀kọ́ ìgbàgbọ́ náà ṣe jin tó ní ẹsẹ̀ yìí.
- issue: Ìtumọ̀ εἰ σὺ εἶ
  choice: bí ìwọ ni
  alternative: bí ìwọ bá jẹ́ ẹni náà
  rationale: “Bí ìwọ ni” pa ìbéèrè ìdánimọ̀ àti ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, láì fi àfikún ìtumọ̀ sí i.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Kò sí àlàyé ìsàlẹ̀ tí ó pọn dandan, nítorí ọ̀pọ̀ ὕδατα nínú Gíríìkì kò ní ìyàtọ̀ àdánidá nínú Yorùbá, níbi tí “omi” ti jẹ́ orúkọ àìníye.
