id: MAT.14.18
reference: Matthew 14:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: yo
  text: Ṣùgbọ́n ó ní[a], “Ẹ mú wọn wá síbí fún mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, àwọn búrẹ́dì àti ẹja tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ jẹ́ àsopọ̀ onírẹ̀lẹ̀; “Ṣùgbọ́n” bá ìyàtọ̀ tó wà láàárín ọ̀rọ̀ àwọn ọmọ-ẹ̀yìn ní ẹsẹ tó ṣáájú àti ìdáhùn Jésù mu.
- source_word: εἶπεν
  choice: ó ní
  rationale: Aoristi λέγω túmọ̀ sí pé ó sọ̀rọ̀; “ó ní” jẹ́ ọ̀nà àdánidá ní Yorùbá, kò sì fi agbára àṣẹ kún ọ̀rọ̀ náà láìnídìí.
- source_word: Φέρετέ
  choice: Ẹ mú … wá
  rationale: Ìṣe àṣẹ ẹni kejì ọ̀pọ̀ yìí ń sọ fún àwọn ọmọ-ẹ̀yìn pé kí wọ́n mú àwọn nǹkan náà wá; “Ẹ mú … wá” jẹ́ àṣẹ tó ṣe kedere, tó sì bá Yorùbá mu.
- source_word: μοι
  choice: fún mi
  rationale: Dátífù náà fi ẹni tí a ó mú àwọn nǹkan náà tọ̀ wá hàn; “fún mi” sọ ìtọ́sọ́nà sí Jésù ní Yorùbá àdánidá.
- source_word: ὧδε
  choice: síbí
  rationale: ὧδε jẹ́ ọ̀rọ̀ ibi tó túmọ̀ sí “níbí” tàbí “síbí”; lẹ́yìn “wá,” “síbí” ni ìṣọ̀kan Yorùbá tó yẹ.
- source_word: αὐτούς
  choice: wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ ọ̀pọ̀ akọ ni Gíríìkì, ó ń tọ́ka ní àyíká ọ̀rọ̀ sí àwọn búrẹ́dì àti ẹja tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; “wọn” pa ìtọ́kasí náà mọ́ láìfi àlàyé sí inú ẹsẹ.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé láti lóye. A lo “Ẹ” láti fi hàn pé àṣẹ náà jẹ́ sí ẹni kejì ọ̀pọ̀.
