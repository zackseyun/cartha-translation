  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: yo
  text: Nígbà tí àwọn ọkùnrin ibi náà dá a mọ̀, wọ́n rán sí gbogbo àgbègbè tó yí ibi náà ká,[a] wọ́n sì mú gbogbo àwọn aláìsàn wá sọ́dọ̀ rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ti gígùn ọ̀rọ̀: “wọ́n rán sí gbogbo àgbègbè tó yí ibi náà ká.” Èdè Gíríìkì kò sọ ohun tí wọ́n rán ní pàtó; ó lè jẹ́ ìròyìn tàbí àwọn aṣojú.'
    reason: lexical_alternative
  - marker: b
    text: 'Ní ti gígùn ọ̀rọ̀: “gbogbo àwọn tí ara wọn kò dá.” Èyí jẹ́ gbólóhùn àṣà tí ó túmọ̀ sí àwọn aláìsàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: dá a mọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n mọ ẹni tí ó jẹ́ nígbà tí wọ́n rí i; “dá a mọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ bẹ́ẹ̀.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: àwọn ọkùnrin ibẹ̀
  rationale: “Ọkùnrin” pa ìtumọ̀ akọ ti ἄνδρες mọ́, “ibẹ̀” sì sọ τοῦ τόπου ἐκείνου ní ọ̀nà ṣókí, àdánidá.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: wọ́n ránṣẹ́ sí gbogbo agbègbè àyíká ibẹ̀ náà
  rationale: “Ránṣẹ́” mú ìṣe fífi ìròyìn tàbí aṣojú ránṣẹ́ jáde hàn láì pinnu èyí tí Gíríìkì kò sọ ní pàtó; “gbogbo agbègbè àyíká” dúró fún gbogbo ilẹ̀ tí ó yí ibẹ̀ ká.
- source_word: προσήνεγκαν αὐτῷ
  choice: wọ́n mú ... wá sọ́dọ̀ rẹ̀
  rationale: Nínú àyíká ìtàn yìí, προσφέρω túmọ̀ sí mímú àwọn ènìyàn tọ Jésù wá, kì í ṣe fífi ẹbọ rú.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: gbogbo àwọn aláìsàn
  rationale: κακῶς ἔχειν jẹ́ gbólóhùn àṣà fún jíjẹ́ aláìsàn; “àwọn aláìsàn” jẹ́ kedere, ṣókí, ó sì bá Yorùbá òde òní mu.
