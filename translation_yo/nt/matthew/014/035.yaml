translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àmì ohùn kún níbi tí ó bá yẹ. Àmì ìdádúró tó parí ẹsẹ ni a lo dípò àmì kọ́mà ìtẹ̀síwájú ti ìtẹ̀jáde Gíríìkì.
