id: MAT.14.26
reference: Matthew 14:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àwọn ọmọ-ẹ̀yìn rí i tí ó ń rìn lórí òkun, ẹ̀rù bà wọ́n gidigidi, wọ́n sì ní, “Iwin[a] ni!” Nítorí ẹ̀rù, wọ́n ké jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfarahàn” tàbí “ohun àrà bí ẹ̀mí.”
    reason: Àṣàyàn ìtumọ̀ fún φάντασμα; ọ̀rọ̀ náà ń ṣàpèjúwe ohun tí àwọn ọmọ-ẹ̀yìn rò nínú ìbẹ̀rù wọn.
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré nínú ìtàn hàn, ó sì mú ìdáhùn ẹ̀rù àwọn ọmọ-ẹ̀yìn yàtọ̀ sí ohun tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹgbẹ́ àwọn ọmọ-ẹ̀yìn tí a ti mọ̀ tẹ́lẹ̀; èyí ni ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἰδόντες αὐτὸν
  choice: nígbà tí àwọn ọmọ-ẹ̀yìn rí i
  rationale: A tú participle aorist náà sí gbólóhùn àkókò láti fi tẹ̀lé ìṣísẹ̀ ìtàn náà ní Yorùbá àdánidá.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: tí ó ń rìn lórí òkun
  rationale: ‘Lórí òkun’ pa ìtumọ̀ ìrìn lórí ojú òkun mọ́, ó sì sun mọ́ ọ̀rọ̀ Gíríìkì.
- source_word: ἐταράχθησαν
  choice: ẹ̀rù bà wọ́n gidigidi
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà fi ìdàrúdàpọ̀ àti ìbẹ̀rù líle hàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá tó mú okun rẹ̀ jáde.
- source_word: λέγοντες
  choice: Wọ́n ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó rọrùn láti ṣàgbékalẹ̀ ọ̀rọ̀ tí wọ́n ké sọ ní àkókò kan náà.
- source_word: Φάντασμά ἐστιν
  choice: Iwin ni!
  rationale: ‘Iwin’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye fún ohun àrà tí wọ́n rò pé wọ́n rí; ó ròyìn ìmọ̀lára wọn láìfìdí ẹ̀kọ́ nípa irú ẹ̀mí náà múlẹ̀.
- source_word: ἀπὸ τοῦ φόβου
  choice: nítorí ẹ̀rù
  rationale: Ó sọ ìdí tí wọ́n fi ké jáde ní Yorùbá tó ṣe kedere.
- source_word: ἔκραξαν
  choice: wọ́n ké jáde
  rationale: Ó pa agbára igbe κράζω mọ́ láìfi ohun tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Irú ohun tí φάντασμα túmọ̀ sí nínú igbe àwọn ọmọ-ẹ̀yìn
  choice: Iwin
  alternative: àwòrán ẹ̀mí; ohun àrà bí ẹ̀mí
  rationale: Ẹsẹ̀ náà ń ròyìn ohun tí àwọn ọmọ-ẹ̀yìn rò nítorí ẹ̀rù, kì í ṣe pé ó ń fi ẹ̀kọ́ kan múlẹ̀ nípa bí àwọn ẹ̀mí ṣe rí. ‘Iwin’ jẹ́ kedere fún òǹkàwé Yorùbá, ó sì pa ìṣòro náà mọ́ láìdájọ́ lórí ìwàláàyè irú ohun bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn. A pín gbólóhùn náà sí méjì láti jẹ́ kí ìtàn àti ìró igbe náà ṣe kedere.
