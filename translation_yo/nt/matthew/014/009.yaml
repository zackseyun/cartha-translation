id: MAT.14.9
reference: Matthew 14:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: yo
  text: Bó tilẹ̀ jẹ́ pé inú ọba náà bàjẹ́, nítorí àwọn ìbúra rẹ̀ àti àwọn tí wọ́n jọ ń jẹun pẹ̀lú rẹ̀[a], ó pàṣẹ pé kí a fi í fún un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “àwọn tí wọ́n nà síbi tábìlì pẹ̀lú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà fi àṣà ìgbà yẹn hàn, nígbà tí àwọn ènìyàn máa ń nà síbi tábìlì láti jẹun.
    reason: cultural_note
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì kò sọ ohun tí a ó fi fún un ní pàtó; ohun tí ọmọbìnrin náà béèrè nínú ẹsẹ tó ṣáájú ni àyíká ọ̀rọ̀ ń tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: Bó tilẹ̀ jẹ́ pé inú ọba náà bàjẹ́
  rationale: Àpólà aláìlórúkọ náà fi hàn pé ọba banújẹ́; ìtumọ̀ oníyọ̀ǹda yìí tún mú ìtakora tó wà láàárín ìbànújẹ́ rẹ̀ àti àṣẹ tó pa jáde hàn ní Yorùbá àdánidá.
- source_word: ὁ βασιλεὺς
  choice: ọba náà
  rationale: βασιλεύς túmọ̀ tààrà sí ‘ọba’; àmì ìdánimọ̀ náà bá ẹni tí a ti mẹ́nu kàn nínú àyíká ọ̀rọ̀ mu.
- source_word: διὰ τοὺς ὅρκους
  choice: nítorí àwọn ìbúra rẹ̀
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ìdí; ‘rẹ̀’ ṣe kedere pé àwọn ìbúra ọba fúnra rẹ̀ ni láìyí ìtumọ̀ padà.
- source_word: τοὺς συνανακειμένους
  choice: àwọn tí wọ́n jọ ń jẹun pẹ̀lú rẹ̀
  rationale: Ó ń tọ́ka sí àwọn tí wọ́n jókòó tàbí nà síbi tábìlì pẹ̀lú rẹ̀. Ìtumọ̀ yìí dára fún Yorùbá òde òní, ó sì pa ìṣẹ̀lẹ̀ àjọjẹ mọ́.
- source_word: ἐκέλευσεν
  choice: ó pàṣẹ
  rationale: κελεύω túmọ̀ sí pípa àṣẹ; ‘ó pàṣẹ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní ọlá.
- source_word: δοθῆναι
  choice: kí a fi í fún un
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ passive infinitive, ‘kí a fi fún’; arọ́pò-orúkọ ‘í’ tọ́ka sí ohun tí a béèrè ní àyíká ọ̀rọ̀ ṣáájú láìsọ ohun náà ní pàtó.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ìtàn tó bójú mu, tó sì yé òǹkàwé òde òní. A fi ìtumọ̀ concessive hàn ní ‘Bó tilẹ̀ jẹ́ pé,’ ṣùgbọ́n a kò ṣàfikún ìdájọ́ ẹ̀kọ́ ìsìn kankan.
