  source_fidelity: 'Ìtumọ̀ náà tọ́jú ìlànà ìṣẹ̀lẹ̀ Gíríìkì náà dáadáa: Hẹ́rọ́dù ti mú Jòhánù, ó dè é, ó sì fi í sí ibi ìtìmọ́lẹ̀. ‘Nítorí’ ń ṣàfihàn ipa àlàyé γάρ, ‘ti mú’ bá κρατήσας mu ní àyíká ìmú ẹni lábẹ́ àṣẹ, ‘dè’ bá ἔδησεν mu, àti ‘nítorí Hẹrodíà’ tọ́ka sí okùnfà διά pẹ̀lú accusative. Àtúnṣe kékeré ni a nílò kí ìbátan ‘arakùnrin rẹ̀’ má bàa ní ìtọ́kasí tí ó lè dà bí ti Jòhánù, dípò ti Hẹ́rọ́dù, àti kí ibi ìtìmọ́lẹ̀ hàn ní kedere.'
  naturalness: ‘Fi í sínú ẹ̀wọ̀n’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti sọ fífi ènìyàn sínú ibi ìtìmọ́lẹ̀. Fífi ‘Hẹ́rọ́dù’ hàn lẹ́ẹ̀kan sí i nínú ẹgbẹ́-ọrọ̀ ìbátan náà ń jẹ́ kí gbolohun náà rọrùn láti ka, ó sì mú ohun tí Gíríìkì sọ kedere.
  terminology: ‘Aya’ jẹ́ ìtumọ̀ tó yẹ fún γυναῖκα nínú àyíká yìí. A kò gbọdọ̀ fi ‘tẹ́lẹ̀ rí’ tàbí ọ̀rọ̀ ìdájọ́ nípa ìgbéyàwó Hẹrodíà kún un, nítorí ẹsẹ náà kò sọ bẹ́ẹ̀. ‘Ẹ̀wọ̀n’ ní àyíká ‘sínú ẹ̀wọ̀n’ ń ṣiṣẹ́ gẹ́gẹ́ bí ibi ìtìmọ́lẹ̀, láìsọ irú ìdè kan pàtó.
