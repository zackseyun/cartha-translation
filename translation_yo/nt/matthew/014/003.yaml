id: MAT.14.3
reference: Matthew 14:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: yo
  text: Nítorí pé Hẹ́rọ́dù ti mú Jòhánù[a], ó dè é, ó sì fi í sínú ẹ̀wọ̀n nítorí Hẹrodíà, aya Fílípì arákùnrin Hẹ́rọ́dù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó gbá Jòhánù mú … ó fi í sínú ẹ̀wọ̀n.”
    reason: κρατήσας lè jẹ́ ‘gbá mú’ ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì, nígbà tí ‘mú’ bá àyíká ìdámú àti ẹ̀wọ̀n mu dáadáa.
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó pa ipa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àlàyé ohun tí a sọ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti so gbólóhùn náà mọ́ àyíká rẹ̀ ní Yorùbá.
- source_word: κρατήσας
  choice: ti mú
  rationale: Nínú àyíká yìí, ‘mú’ lè túmọ̀ sí dídá ènìyàn mú lábẹ́ àṣẹ, ó sì tún pa ìtumọ̀ gbooro ti ‘gbá mú’ mọ́ láìfi ọ̀nà ìmú náà kún ọ̀rọ̀.
- source_word: ἔδησεν
  choice: ó dè é
  rationale: Èyí sọ ìṣe dídè náà ní tààrà láìsọ pé ẹ̀wọ̀n irin tàbí ohun èlò pàtó ni a lò.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: ó sì fi í sí ẹ̀wọ̀n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ fífi ènìyàn sínú ọgbà ẹ̀wọ̀n mu.
- source_word: διὰ Ἡρῳδιάδα
  choice: nítorí Hẹrodíà
  rationale: διά pẹ̀lú accusative ń fi okùnfà tàbí ìdí hàn níbí; ‘nítorí’ sọ ìbáṣepọ̀ yẹn ní kedere.
- source_word: γυναῖκα
  choice: aya
  rationale: Nínú ìbáṣepọ̀ tí ẹsẹ yìí sọ, γυνή túmọ̀ sí aya, kì í ṣe obìnrin lásán.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: aya Fílípì arákùnrin rẹ̀
  rationale: Ètò yìí jẹ́ ti Yorùbá àdánidá, ó sì mú kedere pé Fílípì ni arákùnrin Hẹ́rọ́dù.
theological_decisions:
- issue: Bí a ṣe máa sọ ìbáṣepọ̀ Hẹrodíà àti Fílípì láìṣáájú ìdájọ́ ẹsẹ tó tẹ̀ lé e
  choice: Hẹrodíà, aya Fílípì arákùnrin rẹ̀
  alternative: Hẹrodíà, ẹni tí ó ti jẹ́ aya Fílípì arákùnrin rẹ̀
  rationale: Ẹsẹ yìí pè é ní aya Fílípì, kò sì tíì sọ ní tààrà pé ìbáṣepọ̀ náà lòdì sí òfin. Fífi ‘ti jẹ́’ kún un lè pinnu àkókò tàbí ipò ìgbéyàwó tí Gíríìkì kò pinnu ní kedere.
translation_notes:
  register: 'A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn orúkọ ni a kọ sí ìrísí Yorùbá tó wọ́pọ̀: Hẹ́rọ́dù, Jòhánù, Hẹrodíà, àti Fílípì. Gbólóhùn náà tẹ̀ lé ìṣètò ìṣẹ̀lẹ̀ Gíríìkì—mímú, dídè, àti fífi sí ẹ̀wọ̀n—láìsọ ohun èlò tí a fi dè é.'
