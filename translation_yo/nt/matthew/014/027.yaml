  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́sẹ̀kẹsẹ̀ Jésù sọ fún wọn pé, “Ẹ ní ìgboyà; èmi ni.[a] Ẹ má bẹ̀rù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn Gíríìkì náà, “ἐγώ εἰμι,” lè jẹ́ ìdánimọ̀ ara ẹni lásán níbí (“Èmi ni”); síbẹ̀, àwọn kan gbọ́ ìró tó ṣeé ṣe ti ọ̀rọ̀ ìdánimọ̀ Ọlọ́run nínú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi hàn ní èdè Yorùbá òde òní pé ohun náà ṣẹlẹ̀ ní kíákíá, láìjáfara.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyípadà kékeré láti inú ìbẹ̀rù àwọn ọmọ-ẹ̀yìn nínú ẹsẹ tó ṣáájú wá sí ọ̀rọ̀ ìtùnú Jésù.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: bá wọn sọ̀rọ̀ pé
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì pa ìṣe sísọ̀rọ̀ sí wọn àti ìbẹ̀rẹ̀ ọ̀rọ̀ tààrà mọ́.
- source_word: Θαρσεῖτε
  choice: Ẹ mú ọkàn le
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni; ó ń ké sí wọn láti ní ìgboyà, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: ἐγώ εἰμι
  choice: èmi ni
  rationale: Ó jẹ́ ọ̀nà àdánidá láti dá ara ẹni mọ̀ ní àyíká ọ̀rọ̀ yìí, nígbà tí ó tún pa ìṣòro àti àfojúsùn tó ṣeé ṣe nínú gbólóhùn Gíríìkì náà mọ́.
- source_word: μὴ φοβεῖσθε
  choice: Ẹ má bẹ̀rù
  rationale: Ó jẹ́ àṣẹ ọ̀pọ̀ ènìyàn tó ṣe kedere, tó sì jẹ́ ti ẹ̀dá ní Yorùbá.
theological_decisions:
- issue: Bóyá ἐγώ εἰμι jẹ́ ìdánimọ̀ ara ẹni lásán tàbí ó tún lè mú ìrántí ọ̀rọ̀ ìdánimọ̀ Ọlọ́run wá
  choice: A lo “èmi ni” nínú ọ̀rọ̀ pàtàkì, nítorí ó bá ìdánimọ̀ ara ẹni mu, ó sì pa àfojúsùn Gíríìkì mọ́.
  alternative: A lè túmọ̀ ọ́ ní ọ̀nà tó túmọ̀ sí “Jésù ni mí,” ṣùgbọ́n ìyẹn yóò ṣàlàyé ohun tí Gíríìkì kò sọ ní kedere, yóò sì dín àìdánilójú rẹ̀ kù.
  rationale: Ní àyíká ìtàn náà, Jésù ń fi dá àwọn ọmọ-ẹ̀yìn tó bẹ̀rù lójú nípa dídá ara rẹ̀ mọ̀. Síbẹ̀, gbólóhùn Gíríìkì náà lè ní ìró ẹ̀kọ́ ìsìn tó jinlẹ̀ síi; ìtumọ̀ àti àlàyé ìsàlẹ̀ ojú ewé pa méjèèjì mọ́ láìfipá yan ọ̀kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. “Bá wọn sọ̀rọ̀ pé” yàgò fún àtúnsọ aláìdánidá, nígbà tí “Ẹ mú ọkàn le” ń sọ ìpè sí ìgboyà ní kedere.
