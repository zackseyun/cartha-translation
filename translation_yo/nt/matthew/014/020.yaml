  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: yo
  text: Gbogbo wọn sì jẹun, wọ́n sì yó; wọ́n sì kó àwọn ajẹkù[a] jọ sínú àwọn agbọ̀n méjìlá tí ó kún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀yà tí a ṣẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ẹ̀yà tí a ṣẹ́ tí ó ṣẹ́ kù lẹ́yìn oúnjẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: jẹun
  rationale: Ọ̀rọ̀ náà jẹ́ aorist indicative ti ἐσθίω; “jẹun” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe jíjẹ ní ìtàn.
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Ó pa ìtumọ̀ pé gbogbo àwọn ènìyàn inú ọ̀pọ̀ náà ni ó jẹun mọ́, ó sì mú olùṣe tí Gíríìkì fi hàn nínú ọ̀rọ̀-ìṣe ṣe kedere.
- source_word: ἐχορτάσθησαν
  choice: wọ́n sì yó
  rationale: χορτάζω níbí túmọ̀ sí pé wọ́n jẹun débi pé ebi kò pa wọ́n mọ́; “yó” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìtẹ́lọ́rùn lẹ́yìn oúnjẹ.
- source_word: ἦραν
  choice: wọ́n sì kó
  rationale: αἴρω lè túmọ̀ sí gbé tàbí mú; ní àyíká yìí ó tọ́ka sí kíkó ajẹkù jọ.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: ajẹkù
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí àwọn ẹ̀yà tí a ṣẹ́ kúrò tí ó ṣẹ́ kù. “Ajẹkù” sọ ìtumọ̀ àpapọ̀ náà ní Yorùbá tó rọrùn, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ “àwọn ẹ̀yà tí a ṣẹ́” hàn.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: agbọ̀n méjìlá tí ó kún
  rationale: Ó pa iye méjìlá àti bí agbọ̀n kọ̀ọ̀kan ṣe kún mọ́, pẹ̀lú ètò ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Ìkúnrẹ́rẹ́ oúnjẹ nínú iṣẹ́ ìyanu náà
  choice: wọ́n sì yó
  alternative: wọ́n sì jẹun títí wọ́n fi kún
  rationale: “Wọ́n sì yó” fi ìtumọ̀ pé gbogbo wọn rí oúnjẹ tó tó jẹ hàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ohun tí Gíríìkì sọ.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
