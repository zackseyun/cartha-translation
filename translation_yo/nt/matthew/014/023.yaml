source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: yo
  text: Lẹ́yìn tí ó ti rán àwọn ogunlọ́gọ̀ ènìyàn náà lọ, ó gun òkè lọ láti gbàdúrà ní ìkọ̀kọ̀.[a] Nígbà tí ìrọ̀lẹ́ dé, òun nìkan ni ó wà níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní òun nìkan,” fún κατ’ ἰδίαν.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Lẹ́yìn tí ó sì tú … ká
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó ṣáájú ìṣe pàtàkì; gbólóhùn àkókò yìí fi hàn pé ó kọ́kọ́ rán àwọn ènìyàn náà lọ kí ó tó gun òkè.
- source_word: τοὺς ὄχλους
  choice: àwọn èrò náà
  rationale: “Èrò” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì pa ìtumọ̀ plural mọ́ pẹ̀lú “àwọn.”
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ó gun orí òkè lọ
  rationale: Èyí fi ìrìn sókè àti ibi tí ó lọ sí hàn ní Yorùbá àdánidá, láì lo ọ̀rọ̀ àtijọ́ tàbí èdè líle.
- source_word: κατ’ ἰδίαν
  choice: ní òun nìkan
  rationale: Ó lè túmọ̀ sí “ní ìkọ̀kọ̀” tàbí “ní òun nìkan”; ní àyíká yìí, ó tẹnumọ́ pé kò sí ẹlòmíràn pẹ̀lú rẹ̀.
- source_word: προσεύξασθαι
  choice: láti gbàdúrà
  rationale: Infinitive náà sọ ète tí ó fi gun òkè; “láti gbàdúrà” jẹ́ ìtumọ̀ Yorùbá tààrà.
- source_word: ὀψίας δὲ γενομένης
  choice: Nígbà tí ilẹ̀ ṣú
  rationale: Genitive absolute náà jẹ́ àmì àkókò; ọ̀nà yìí jẹ́ Yorùbá àdánidá fún dídé ìrọ̀lẹ́.
- source_word: μόνος ἦν ἐκεῖ
  choice: òun nìkan ni ó wà níbẹ̀
  rationale: Ìṣètò yìí tẹnumọ́ “μόνος,” ìyẹn pé òun nìkan ló wà níbẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. A fi àmì ohùn sí ibi tí ó yẹ, a sì yà “ní òun nìkan” sí “òun nìkan ni ó wà níbẹ̀” láti pa àtúnṣe tẹnumọ́ inú Gíríìkì mọ́.
