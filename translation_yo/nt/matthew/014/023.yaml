  to: Lẹ́yìn tí ó ti rán àwọn ogunlọ́gọ̀ ènìyàn náà lọ, ó gun òkè lọ láti gbàdúrà ní ìkọ̀kọ̀.[a] Nígbà tí ìrọ̀lẹ́ dé, òun nìkan ni ó wà níbẹ̀.
