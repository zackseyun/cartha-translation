  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ìyá rẹ̀ ti rọ̀ ọ́, ó ní, “Fún mi ní orí Jòhánù Onítẹ̀bọmi[a] lórí àwo ńlá níhìn-ín.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí a ṣe máa ń pè é ní àṣà ìtumọ̀ Bíbélì, “Jòhánù Batisiti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: nígbà tí ìyá rẹ̀ ti rọ̀ ọ́
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìyá ọmọbìnrin náà ti ní ipa lórí ohun tí yóò béèrè. “Rọ̀ ọ́” jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìṣe ẹni mìíràn mọ́ láì sọ pé ó fún un ní ìtọ́ni pípé.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: ìyá rẹ̀
  rationale: A fi ìyá rẹ̀ hàn gẹ́gẹ́ bí ẹni tó mú un ṣe bẹ́ẹ̀, bí ὑπό pẹ̀lú ẹ̀yà ọrọ̀ genitive ṣe tọ́ka sí.
- source_word: Δός μοι
  choice: Fún mi ní
  rationale: Àṣẹ tààrà ni; “Fún mi ní” ni ìtumọ̀ Yorùbá tó ṣe déédéé fún bíbéèrè ohun kan ní tààrà.
- source_word: φησίν
  choice: ó ní
  rationale: “Ó ní” jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọ̀rọ̀ ẹni hàn, ó sì lè pa ìmúrasílẹ̀ àkọsílẹ̀ ìṣẹ̀lẹ̀ tí present tense Gíríìkì ní mọ́.
- source_word: ὧδε
  choice: níhìn-ín
  rationale: Ó pa ìtọ́ka sí ibi tí wọ́n wà mọ́, ó sì tún lè mú ìbéèrè náà dà bí ohun tí a fẹ́ ní kíákíá.
- source_word: ἐπὶ πίνακι
  choice: lórí àwo ńlá
  rationale: πίναξ ní àyíká àsè túmọ̀ sí àwo gbígbé oúnjẹ; “àwo ńlá” yà á sọ́tọ̀ kúrò nínú àwo kékeré tàbí àwo jíjẹ lasán.
- source_word: τὴν κεφαλὴν
  choice: orí
  rationale: Ìtumọ̀ tààrà ni, ó sì pa bí ìbéèrè náà ṣe bani lẹ́rù mọ́.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jòhánù Onítẹ̀bọmi
  rationale: “Onítẹ̀bọmi” pa agbára orúkọ aṣojú βαπτιστής mọ́, ó ń ṣàpèjúwe iṣẹ́ Jòhánù gẹ́gẹ́ bí ẹni tó ń tẹ àwọn ènìyàn bọmi.
theological_decisions:
- issue: Bí a ṣe túmọ̀ oyè βαπτιστής ti Jòhánù
  choice: Jòhánù Onítẹ̀bọmi
  alternative: Jòhánù Batisiti
  rationale: A yan oyè tó ṣàlàyé iṣẹ́ rẹ̀ dípò yíyá ọ̀rọ̀ náà lásán. Èyí kò fi ẹ̀kọ́ ìjọ kan kún un; ó pa ìtumọ̀ orúkọ aṣojú Gíríìkì mọ́, nígbà tí àṣàyàn ìbílẹ̀ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣe kedere ni a lò. A pa àṣẹ líle ọmọbìnrin náà àti àwòrán tó bani lẹ́rù mọ́; “nígbà tí” mú participle Gíríìkì wọ èdè Yorùbá àdánidá, “ó ní” sì jẹ́ ọ̀nà ìtàn tó wọ́pọ̀.
