  verdict: revise
  source_fidelity: The draft conveys the mother's prior influence, the direct demand, the deictic ‘here,’ the platter, and the specific request for John's head. Its rendering of προβιβασθεῖσα as ‘ìyá rẹ̀ ti rọ̀ ọ́’ is a reasonable non-over-specified expression of prior prompting. ‘Onítẹ̀bọmi’ preserves the descriptive force of βαπτιστής, with the traditional form retained in a note.
  naturalness: The phrase ‘Fún mi níhìn-ín, lórí àwo ńlá, ní orí ...’ contains an unnecessary second ní before ‘orí’ and has an awkward object order. Reordering it makes the imperative idiomatic Yoruba while retaining every source element.
  terminology: ‘Jòhánù Onítẹ̀bọmi’ is transparent and suitable for a title describing John's activity. The footnote appropriately supplies the familiar traditional alternative. ‘Àwo ńlá’ is an apt banquet-context rendering of πίναξ.
  issues:
  - severity: medium
    issue: Awkward and redundant imperative construction
    rationale: In ‘Fún mi níhìn-ín, lórí àwo ńlá, ní orí Jòhánù,’ the second ní before ‘orí’ is not needed, and the placement makes the requested object less natural in Standard Yoruba. ‘Fún mi ní orí ... lórí àwo ńlá níhìn-ín’ clearly expresses ‘Give me the head ... on a platter here.’
