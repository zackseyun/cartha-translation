  source_fidelity: 'The clause structure, mild contrast, addressee, locative ‘níbí,’ exception construction, and quantities are faithfully represented. However, ‘ìṣù àkàrà’ is not an accurate or natural designation for Greek ἄρτους: àkàrà ordinarily denotes fried bean cakes, while ìṣù ordinarily denotes yam. The source refers to bread loaves.'
  naturalness: The sentence is otherwise clear and idiomatic in modern Standard Yoruba. ‘Ìṣù búrẹ́dì’ is established biblical Yoruba wording for discrete loaves of bread and avoids the misleading food reference in the draft.
  terminology: Replace ‘ìṣù àkàrà’ with ‘ìṣù búrẹ́dì.’ ‘Ẹja méjì’ is appropriate. No theological terminology is at issue.
  issues:
