    issue: ‘ìṣù àkàrà’ for πέντε ἄρτους
    rationale: This phrase can signify yam/bean-cake items rather than loaves of bread, materially altering the food named in the source. ‘Ìṣù búrẹ́dì’ preserves both bread and the countable-loaf sense.
