  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: yo
  text: Ṣùgbọ́n wọ́n sọ fún un pé, “A kò ní nǹkan kan níbí bí kò ṣe ìṣù búrẹ́dì márùn-ún àti ẹja méjì.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ṣùgbọ́n wọ́n
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ náà ń tọ́ka sí àwọn ọmọ-ẹ̀yìn tí a mẹ́nu kàn ṣáájú; “ṣùgbọ́n” sì fi ìyàtọ̀ kékeré hàn láàárín èsì wọn àti àṣẹ Jésù.
- source_word: λέγουσιν αὐτῷ
  choice: sọ fún un pé
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní àkókò ìsinsìnyí ìtàn, ọ̀nà yìí jẹ́ àdánidá nínú ìtàn Yorùbá, ó sì mú ẹni tí wọ́n ń bá sọ̀rọ̀ àti ọ̀rọ̀ tí wọ́n sọ hàn kedere.
- source_word: Οὐκ ἔχομεν ὧδε
  choice: A kò ní nǹkan kan níbí
  rationale: Èyí tú gbólóhùn ìní tí a sẹ́ àti ọ̀rọ̀ ibi “níbí” jáde ní Yorùbá tó ṣe kedere, láìfi ohunkóhun kún ìtumọ̀ rẹ̀.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Lẹ́yìn gbólóhùn ìsẹ́, ọ̀rọ̀ yìí túmọ̀ sí ohun kan ṣoṣo tí ó yà sọ́tọ̀, ìyẹn “bí kò ṣe,” kì í ṣe gbólóhùn àídájú.
- source_word: πέντε ἄρτους
  choice: ìṣù àkàrà márùn-ún
  rationale: ἄρτος ń tọ́ka sí ìṣù oúnjẹ tí a fi ìyẹ̀fun ṣe; “ìṣù àkàrà” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti fi hàn pé ìṣù márùn-ún ni, kì í ṣe ẹyọ kéékèèké márùn-ún.
- source_word: δύο ἰχθύας
  choice: ẹja méjì
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì jẹ́ ọ̀nà àdánidá láti ka ẹja ní Yorùbá.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà pa ìtakora kékeré ti δέ mọ́, ó sì jẹ́ kedere fún òǹkàwé lásán.
