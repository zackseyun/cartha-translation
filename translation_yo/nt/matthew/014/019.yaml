revisions:
- from: Ó sì pàṣẹ fún àwọn èrò náà láti jókòó sórí koríko. Ó mú ìṣù búrẹ́dì márùn-ún àti ẹja méjì náà, ó gbé ojú sókè ọ̀run, ó súre[a]; lẹ́yìn tí ó sì bù àwọn ìṣù búrẹ́dì náà, ó fi wọ́n fún àwọn ọmọ-ẹ̀yìn, àwọn ọmọ-ẹ̀yìn náà sì fi wọ́n fún àwọn èrò náà.
  to: Ó sì pàṣẹ fún àwọn èrò náà láti jókòó sílẹ̀ sórí koríko[a]. Ó mú búrẹ́dì márùn-ún àti ẹja méjì náà, ó gbé ojú sókè sí ọ̀run, ó bùkún; lẹ́yìn tí ó sì bù búrẹ́dì náà, ó fi wọ́n fún àwọn ọmọ-ẹ̀yìn, àwọn ọmọ-ẹ̀yìn náà sì fi wọ́n fún àwọn èrò náà.
  rationale: Àtúnṣe náà rọ́pò ‘ó súre’ pẹ̀lú ‘ó bùkún’ láti ba εὐλόγησεν mu, láìfi ohun tàbí ẹni tí a bù kún hàn. Ó tún rọ́pò ‘ìṣù búrẹ́dì’ pẹ̀lú ‘búrẹ́dì’ fún ìmòye tí ó ṣe kedere, ó sì tún ìtọ́kasí ‘sí ọ̀run’ ṣe. Àlàyé ìsàlẹ̀ ojú-ewé ṣì ń pa àìdájú ohun tí ìbùkún náà kàn mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:36:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìlànà ìṣẹ̀lẹ̀ Gíríìkì dáadáa: àṣẹ sí ogunlọ́gọ̀, jíjẹ búrẹ́dì márùn-ún àti ẹja méjì, wíwo sókè ọ̀run, ìbùkún tí ohun tí ó kàn kò hàn gbangba, bíbù búrẹ́dì, àti fífún àwọn ọmọ-ẹ̀yìn láti pín fún ogunlọ́gọ̀. Síbẹ̀, ‘ó súre’ yí εὐλόγησεν padà sí ìṣe àdúrà dípò ‘bùkún,’ àti ‘ìṣù búrẹ́dì’ lè dá lórí ‘ìṣù’ (yam) ní ìlò Yorùbá òde òní.'
  naturalness: ‘Ó gbé ojú sókè ọ̀run’ nílò ‘sí’; ‘ó gbé ojú sókè sí ọ̀run’ jẹ́ èdè àdánidá. ‘Búrẹ́dì márùn-ún’ jẹ́ kedere, ó sì yẹ fún àwọn búrẹ́dì márùn-ún nínú àyíká yìí. ‘Láti jókòó sílẹ̀’ jẹ́ ìtúmọ̀ Yorùbá tí ó rọrùn fún ìtọ́ni kí wọ́n máa jẹun, bí ó tilẹ̀ jẹ́ pé Gíríìkì ní àwọ̀n ìtumọ̀ jíjẹun ní ìrọ̀lẹ́.
  terminology: A yẹ kí εὐλόγησεν jẹ́ ‘ó bùkún’ kí ìtumọ̀ má bà a dọ́gba mọ́ ‘gbàdúrà.’ A fi ohun tí a bù kún sílẹ̀ láìsọ nínú ọ̀rọ̀ pàtàkì, gẹ́gẹ́ bí Gíríìkì, a sì pa àwọn ìṣàfilọ́lẹ̀ tó ṣeé ṣe mọ́ nínú àlàyé ìsàlẹ̀.
  issues:
  - severity: medium
    issue: ‘ó súre’ fún εὐλόγησεν
    rationale: ‘Súre’ sábà máa ń túmọ̀ sí gbàdúrà ní Yorùbá, nígbà tí εὐλόγησεν níbí jẹ́ ‘bùkún’/sọ ìbùkún. Ìtumọ̀ yìí ní láti má ṣe sọ ohun tí a bù kún ní kedere.
  - severity: medium
    issue: ‘ìṣù búrẹ́dì’ fún ἄρτους
    rationale: ‘Ìṣù’ túmọ̀ sí yam ní ìlò Yorùbá tó wọ́pọ̀, nítorí náà àpapọ̀ náà lè fa ìmọ̀ ‘yam bread.’ ‘Búrẹ́dì márùn-ún’ jẹ́ kedere, ó sì ń ka àwọn odidi búrẹ́dì.
  - severity: low
    issue: Àìsí ‘sí’ nínú ‘gbé ojú sókè ọ̀run’
    rationale: ‘Gbẹ ojú sókè sí ọ̀run’ ni ìkọ́lé Yorùbá tó péye fún ἀναβλέψας εἰς τὸν οὐρανόν.
