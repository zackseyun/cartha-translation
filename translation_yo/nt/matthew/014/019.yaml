id: MAT.14.19
reference: Matthew 14:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: yo
  text: Ó sì pàṣẹ fún àwọn èrò náà láti jókòó sílẹ̀ sórí koríko[a]. Ó mú búrẹ́dì márùn-ún àti ẹja méjì náà, ó gbé ojú sókè sí ọ̀run, ó bùkún; lẹ́yìn tí ó sì bù búrẹ́dì náà, ó fi wọ́n fún àwọn ọmọ-ẹ̀yìn, àwọn ọmọ-ẹ̀yìn náà sì fi wọ́n fún àwọn èrò náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó bùkún fún Ọlọ́run” tàbí “ó sọ ìbùkún.” Ọ̀rọ̀ Gíríìkì kan sọ pé “ó bùkún,” kò sì sọ ẹni tàbí ohun tí ìṣe náà kàn ní tààrà.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: ó pàṣẹ fún
  rationale: Ó fi agbára ìtọ́ni inú ọ̀rọ̀ Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: τοὺς ὄχλους
  choice: àwọn èrò náà
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá òde òní fún ọ̀pọ̀ ènìyàn tí ó péjọ, ó sì pa ìṣúpọ̀ mọ́.
- source_word: ἀνακλιθῆναι
  choice: láti jókòó
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì lè túmọ̀ sí títẹ̀ sílẹ̀ fún oúnjẹ, ‘jókòó’ ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ipò jíjẹun lórí koríko mu.
- source_word: ἐπὶ τοῦ χόρτου
  choice: sórí koríko
  rationale: Ó túmọ̀ ibi tí wọ́n jókòó ní tààrà, láìfi àfikún ‘tútù’ tàbí ‘aláwọ̀ ewé’ kún un.
- source_word: τοὺς πέντε ἄρτους
  choice: ìṣù búrẹ́dì márùn-ún
  rationale: ‘Ìṣù búrẹ́dì’ fi hàn pé odidi búrẹ́dì kéékèèké ni, kì í ṣe búrẹ́dì gẹ́gẹ́ bí ohun jíjẹ lásán.
- source_word: τοὺς δύο ἰχθύας
  choice: ẹja méjì
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún nọ́ńbà méjì nínú àyíká yìí.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: ó gbé ojú sókè ọ̀run
  rationale: Ó pa ìṣe wíwo sókè sí ọ̀run mọ́ ní èdè Yorùbá tó wọ́pọ̀, tó sì ní iyì.
- source_word: εὐλόγησεν
  choice: ó súre
  rationale: Ọ̀rọ̀ náà kò fi ẹni tàbí ohun tí ó súre fún hàn. ‘Ó súre’ jẹ́ kí àìsọ ohun tí ìṣe náà kàn dúró dípò fífi ‘wọn’ tàbí ‘Ọlọ́run’ kún ọ̀rọ̀.
- source_word: κλάσας
  choice: lẹ́yìn tí ó sì bù àwọn ìṣù búrẹ́dì náà
  rationale: ‘Bù’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pípa búrẹ́dì sí wẹ́wẹ́; gbólóhùn náà tún fi hàn pé ìṣe yìí ṣáájú fífún wọn.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: ó fi wọ́n fún àwọn ọmọ-ẹ̀yìn
  rationale: Arọ́pò-orúkọ ‘wọ́n’ tọ́ka sí àwọn ìṣù búrẹ́dì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ kí Yorùbá ṣàn dáadáa.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: àwọn ọmọ-ẹ̀yìn náà sì fi wọ́n fún àwọn èrò náà
  rationale: A tún ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ nítorí pé èdè Yorùbá nílò rẹ̀ fún ìtumọ̀ tó ṣe kedere.
theological_decisions:
- issue: Ohun tàbí ẹni tí εὐλόγησεν (‘ó súre’) kàn
  choice: 'A fi ọ̀rọ̀ náà sílẹ̀ láìsọ ohun tàbí ẹni tí ó kàn: ‘ó súre.’'
  alternative: ‘Ó súre fún Ọlọ́run’ tàbí ‘ó sọ ọ̀rọ̀ ìbùkún.’
  rationale: Gíríìkì kò sọ ohun tàbí ẹni tí ìṣe náà kàn ní tààrà. Yíyan ọ̀kan nínú àwọn ìtumọ̀ náà nínú àkọ́kọ́ yóò yanju ohun tí orísun náà fi ṣí sílẹ̀; àlàyé ìsàlẹ̀ ojú-ewé pa àwọn ọ̀nà ìtumọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìtàn mímọ́ tó ní iyì, ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé lásán láti lóye. A lo ‘búrẹ́dì,’ ọ̀rọ̀ tí ó ti wọ́pọ̀ ní Yorùbá, àti ‘ọmọ-ẹ̀yìn’ fún μαθητής.
