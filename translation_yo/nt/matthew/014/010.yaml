  text: καὶ πέμψας ἀπεκεφάλισεν ⸀τὸν Ἰωάννην ἐν τῇ φυλακῇ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: yo
  text: Ó sì ránṣẹ́, ó sì gé orí Jòhánù ní ilé ẹ̀wọ̀n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó tẹ̀ lé ìṣètò Gíríìkì pẹ́kípẹ́kí: “Lẹ́yìn tí ó ránṣẹ́, ó gé orí Jòhánù ní ilé ẹ̀wọ̀n.” Gíríìkì lo ọ̀rọ̀-ìṣe alábápín aorist ṣáájú ọ̀rọ̀-ìṣe pàtàkì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ó sì
  rationale: Asopọ̀ ìtàn ni καὶ; “sì” ń bá ìtẹ̀síwájú ìtàn Yorùbá mu láì fi ìtumọ̀ àkókò míì kún un.
- source_word: πέμψας
  choice: ránṣẹ́
  rationale: Aorist participle πέμψας fi hàn pé ó kọ́kọ́ rán ẹnì kan tàbí àwọn aṣojú; “ránṣẹ́” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìtumọ̀ yìí mọ́, láì sọ pé Hẹ́rọ́dù fúnra rẹ̀ ló ṣe iṣẹ́ náà.
- source_word: ἀπεκεφάλισεν
  choice: gé orí
  rationale: Ọ̀rọ̀ náà túmọ̀ pàtó sí pípa ènìyàn nípa gígé orí rẹ̀; “gé orí” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì tẹ̀ lé bí Gíríìkì ṣe fi iṣẹ́ náà lé ẹni tí ó ránṣẹ́ lọ́wọ́.
- source_word: τὸν Ἰωάννην
  choice: Jòhánù
  rationale: Orúkọ ẹni nìkan ni ẹsẹ yìí lò; àyíká ọ̀rọ̀ ti fi ẹni tí a ń sọ̀rọ̀ rẹ̀ hàn, nítorí náà a kò fi “Onítẹ̀bọmi” kún un.
- source_word: ἐν τῇ φυλακῇ
  choice: ní inú ọgbà ẹ̀wọ̀n
  rationale: φυλακή níbí ni ibi tí wọ́n ti fi Jòhánù mọ́; “ní inú ọgbà ẹ̀wọ̀n” pa ìtumọ̀ ibi pàtó náà mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa fi ẹni tó ṣe iṣẹ́ náà hàn
  choice: “Ó sì ránṣẹ́, ó sì gé orí Jòhánù”
  alternative: “Ó pàṣẹ pé kí wọ́n gé orí Jòhánù”
  rationale: Gíríìkì tọ́ka sí fífi aṣojú ránṣẹ́, ṣùgbọ́n ọ̀rọ̀-ìṣe pàtàkì ṣì fi gígé orí náà lé ẹni tí ó jẹ́ olùdarí iṣẹ́ náà lọ́wọ́. A kò yí èyí padà sí “ó pàṣẹ” nìkan, nítorí ìyẹn máa túmọ̀ ọ̀rọ̀ náà ju ohun tí gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì pa ìtẹ̀síwájú ìtàn àti ìṣètò ìṣe inú Gíríìkì mọ́.
