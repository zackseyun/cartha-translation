id: MAT.14.32
reference: Matthew 14:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: yo
  text: Nígbà tí wọ́n sì wọ inú ọkọ̀ náà[a], afẹ́fẹ́ náà dáwọ́ dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó túbọ̀ tẹ̀ lé ọ̀rọ̀ náà gan-an, “lẹ́yìn tí wọ́n gòkè sínú ọkọ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβάντων αὐτῶν
  choice: nígbà tí wọ́n wọ inú
  rationale: A sọ genitive absolute náà di gbólóhùn àkókò ní Yorùbá. Bí ó tilẹ̀ jẹ́ pé ἀναβαίνω túmọ̀ ní pàtó sí ‘gòkè,’ ‘wọ inú ọkọ̀’ ni ọ̀nà àdánidá láti sọ ìṣe náà ní àyíká yìí.
- source_word: πλοῖον
  choice: ọkọ̀
  rationale: Nínú àyíká Ìhìn Rere yìí, ọ̀rọ̀ náà ń tọ́ka sí ọkọ̀ ojú omi àwọn ọmọ-ẹ̀yìn lórí Òkun Gálílì; ‘ọkọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún un láìfi ìwọ̀n ọkọ̀ kún ọ̀rọ̀ orísun.
- source_word: ἐκόπασεν
  choice: dáwọ́ dúró
  rationale: κοπάζω túmọ̀ sí pé ohun kan dá tàbí rọlẹ̀. ‘Dáwọ́ dúró’ sọ ní tààrà pé afẹ́fẹ́ náà dá, láìfi èrò ìlọsíwájú díẹ̀díẹ̀ kún aorist náà.
- source_word: ὁ ἄνεμος
  choice: afẹ́fẹ́ náà
  rationale: Èyí jẹ́ ìtumọ̀ tààrà fún kókó-ọ̀rọ̀ náà, ó sì pa article náà mọ́ nípasẹ̀ ‘náà.’
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so ìṣẹ̀lẹ̀ yìí mọ́ ohun tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá fún ìtẹ̀síwájú ìtàn.
theological_decisions:
- issue: Ìtumọ̀ ìtàn náà nípa àṣẹ Jésù lórí ẹ̀dá
  choice: Sọ ìṣẹ̀lẹ̀ náà ní tààrà pé afẹ́fẹ́ dáwọ́ dúró nígbà tí wọ́n wọ inú ọkọ̀.
  alternative: Láti fi ọ̀rọ̀ àlàyé kún un tó máa tẹnumọ́ pé iṣẹ́ ìyanu tàbí àṣẹ Jésù ló mú kí afẹ́fẹ́ dá.
  rationale: Àyíká náà ń fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ hàn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò fi àlàyé bẹ́ẹ̀ kún ìṣẹ̀lẹ̀ náà; nítorí náà, a kò gbọ́dọ̀ yanju tàbí mú ìtumọ̀ náà gbòòrò ju Gíríìkì lọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Wọ inú ọkọ̀’ jẹ́ àdánidá ju ‘gòkè sínú ọkọ̀’ lọ nínú gbólóhùn pàtàkì, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
