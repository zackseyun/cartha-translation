  to: Ṣùgbọ́n ọkọ̀ náà ti wà ní ọ̀pọ̀lọpọ̀ sítádíọ̀nù sí ilẹ̀[a][b], àwọn ìgbì ń na ọkọ̀ náà líle[c], nítorí afẹ́fẹ́ ń fẹ́ lòdì sí i.
