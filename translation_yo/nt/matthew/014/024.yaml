  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: yo
  text: Ṣùgbọ́n ọkọ̀ náà ti wà ní ọ̀pọ̀lọpọ̀ sítádíọ̀nù sí ilẹ̀[a][b], àwọn ìgbì ń na ọkọ̀ náà líle[c], nítorí afẹ́fẹ́ ń fẹ́ lòdì sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “etí omi” tàbí “etí adágún.” Èdè Gíríìkì ní “ilẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Sítádíọ̀nù jẹ́ ìwọ̀n ìjìnnà ní ayé àtijọ́, tó fẹ́rẹ̀ẹ́ jẹ́ mítà 185.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ ọ́ sí “àwọn ìgbì ń gbá ọkọ̀ náà líle.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: ọkọ̀
  rationale: Nínú àyíká ìrìn lórí Òkun Gálílì, “ọkọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ọkọ̀ ojú omi tí kò tóbi bí ọkọ̀ ojú omi ńlá.
- source_word: ἤδη
  choice: ti jìnnà
  rationale: Àmì àsìkò náà fara hàn nínú ìlò “ti,” tó fi hàn pé ọkọ̀ náà ti dé ipò yìí ní àkókò ìtàn náà.
- source_word: σταδίους πολλούς
  choice: ní ọ̀pọ̀ sítádíọ̀nù
  rationale: A pa ìwọ̀n àtijọ́ inú èdè Gíríìkì mọ́ dípò yíyí i padà sí ìwọ̀n òde òní tàbí sísọ ọ́ di “ọ̀nà jíjìn” lásán.
- source_word: ἀπὸ τῆς γῆς
  choice: sí ilẹ̀
  rationale: “Ilẹ̀” tẹ̀ lé ìtumọ̀ γῆ, ó sì ṣe kedere nínú àyíká yìí pé ilẹ̀ tí omi kò bò ni a ń tọ́ka sí.
- source_word: ἀπεῖχεν
  choice: jìnnà sí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé láti sọ pé ohun kan wà ní òkèèrè sí ohun mìíràn.
- source_word: βασανιζόμενον ὑπὸ τῶν κυμάτων
  choice: ìgbì sì ń gbá a líle
  rationale: Gbólóhùn yìí fi agbára àti ìpọ́njú tí ìgbì ń mú bá ọkọ̀ hàn ní èdè Yorùbá àdánidá, láìfi ìtumọ̀ ìdálóró ọkàn kún un.
- source_word: ἐναντίος
  choice: ń fẹ́ lòdì sí i
  rationale: Èyí sọ ní kedere pé ìdarí afẹ́fẹ́ dojú kọ ọkọ̀ náà, bó tilẹ̀ jẹ́ pé èdè Gíríìkì fi ohun tí afẹ́fẹ́ dojú kọ sílẹ̀ fún àyíká láti ṣàlàyé.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyípadà àti ìyàtọ̀ kékeré láti ọ̀dọ̀ Jésù tó wà lórí ilẹ̀ sí ipò líle tí ọkọ̀ wà nínú rẹ̀ hàn.
- source_word: γάρ
  choice: nítorí
  rationale: 'Ó pa ìbáṣepọ̀ ìdí mọ́: afẹ́fẹ́ tó ń fẹ́ lòdì ni ìdí tí ìgbì fi ń gbá ọkọ̀ náà.'
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó sì rọrùn fún gbogbo ènìyàn láti lóye. “Sítádíọ̀nù” pa ìwọ̀n àtijọ́ mọ́, àlàyé ìsàlẹ̀ ojú ìwé sì mú un ṣe kedere. Ìṣètò “ìgbì sì ń gbá a líle” yí passive Gíríìkì padà sí ọ̀nà Yorùbá àdánidá láìdín agbára ìṣẹ̀lẹ̀ náà kù.
