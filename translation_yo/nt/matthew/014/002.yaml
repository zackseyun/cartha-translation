id: MAT.14.2
reference: Matthew 14:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: yo
  text: Ó sì sọ fún àwọn ìránṣẹ́ rẹ̀ pé, “Èyí ni Jòhánù Onítẹ̀bọmi. A ti jí i dìde kúrò láàárín àwọn òkú, ìdí nìyẹn tí àwọn agbára wọ̀nyí fi ń ṣiṣẹ́ nínú rẹ̀.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn agbára ìyanu wọ̀nyí”; tàbí, ní ìtumọ̀ àlàyé sí i, “àwọn iṣẹ́ ìyanu wọ̀nyí.” Gíríìkì ní “àwọn agbára” (αἱ δυνάμεις), tó ń tọ́ka sí agbára àrà tí ó ń farahàn nínú àwọn iṣẹ́ alágbára.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: àwọn ìránṣẹ́ rẹ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, παῖς tọ́ka sí àwọn tó ń ṣiṣẹ́ fún Hẹ́rọ́dù nínú ilé tàbí ààfin rẹ̀. “Ìránṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láì sọ ipò wọn pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: ὁ βαπτιστής
  choice: Onítẹ̀bọmi
  rationale: Àkọlé yìí túmọ̀ ipa Jòhánù gẹ́gẹ́ bí ẹni tó ń ṣe ìtẹ̀bọmi, ó sì jẹ́ èdè Yorùbá tó ti wọ́pọ̀.
- source_word: ἠγέρθη
  choice: A ti jí i dìde
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ àbájáde aláìṣe-taara (passive). Ìtumọ̀ yìí pa èrò pé ẹlòmíràn ló jí i dìde mọ́, láì sọ ẹni tó ṣe é.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Èyí fi hàn ní kedere pé a jí Jòhánù dìde kúrò láàárín àwọn tó ti kú, ó sì bá àlàyé Gíríìkì mu.
- source_word: διὰ τοῦτο
  choice: ìdí nìyẹn tí ... fi
  rationale: Ìṣètò Yorùbá yìí jẹ́ àdánidá, ó sì pa ìbáṣepọ̀ ìdí àti àbájáde inú Gíríìkì mọ́.
- source_word: αἱ δυνάμεις
  choice: àwọn agbára wọ̀nyí
  rationale: “Agbára” pa orúkọ Gíríìkì δύναμις mọ́, dípò kí a yí i padà sí “iṣẹ́ ìyanu” nìkan. “Wọ̀nyí” tọ́ka sí àwọn iṣẹ́ agbára tí ìròyìn wọn dé ọ̀dọ̀ Hẹ́rọ́dù.
- source_word: ἐνεργοῦσιν
  choice: ń ṣiṣẹ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún agbára tó ń ṣiṣẹ́ tàbí tó ń fi ipa rẹ̀ hàn.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: “Nínú rẹ̀” tẹ̀ lé ἐν ní tààràtà, ó sì yẹra fún ìtumọ̀ àlàyé jù lọ bí “nípasẹ̀ rẹ̀.”
theological_decisions:
- issue: Bí Jòhánù ṣe padà láti inú ikú
  choice: A ti jí i dìde kúrò láàárín àwọn òkú
  alternative: Ó ti jí dìde kúrò láàárín àwọn òkú
  rationale: Àṣàyàn náà pa ìrísí àbájáde aláìṣe-taara ti ἠγέρθη mọ́, láì fi hàn pé Jòhánù fúnra rẹ̀ ló jí ara rẹ̀ dìde tàbí láì dárúkọ ẹni tó jí i dìde.
- issue: Ìtumọ̀ δυνάμεις ní àyíká ọ̀rọ̀
  choice: àwọn agbára wọ̀nyí ń ṣiṣẹ́ nínú rẹ̀
  alternative: àwọn agbára iṣẹ́ ìyanu wọ̀nyí ń ṣiṣẹ́ nínú rẹ̀; àwọn iṣẹ́ ìyanu wọ̀nyí ń ṣẹlẹ̀ nípasẹ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí agbára àrà ọ̀tọ̀ bí ó ṣe ń farahàn nínú iṣẹ́ alágbára. A pa “agbára” mọ́ nínú ẹsẹ̀, kí a má bàa dín ìtumọ̀ rẹ̀ kù sí àwọn iṣẹ́ tí agbára náà ń mú jáde.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. A lo “ìránṣẹ́,” “jí i dìde,” àti “ń ṣiṣẹ́ nínú rẹ̀” láti jẹ́ kí ẹsẹ̀ rọrùn fún òǹkàwé lasán, nígbà tí a ń pa ìrísí àti àìdánilójú tó wà nínú Gíríìkì mọ́.
