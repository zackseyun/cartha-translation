  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: εὐθέως jẹ́ “Lẹ́sẹ̀kẹsẹ̀”; ἠνάγκασεν ni agbára ìtẹnumọ́ nínú “ó fi dandan mú”; ἐμβῆναι εἰς πλοῖον, προάγειν αὐτόν, εἰς τὸ πέραν, àti ἕως οὗ ἀπολύσῃ ni a ti túmọ̀ ní ìbámu pẹ̀lú ọ̀nà ìsọ̀rọ̀ Yorùbá. “Tú ... ká” bá ἀπολύω mu nínú àyíká rírán ogunlọ́gọ̀ lọ, láìsọ ju ohun tí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ sọ.'
  naturalness: Yorùbá náà jẹ́ èdè boṣewa, ó sì rọrùn láti ka. “Wọ inú ọkọ̀ ojú omi,” “ṣáájú rẹ̀ lọ,” àti “títí tí òun yóò fi tú ... ká” jẹ́ ọ̀nà ìsọ̀rọ̀ tí ó dára fún ìtàn ọlọ́lá òde òní. Àmì ohùn ni a lò lọ́nà tó péye ní gbogbogbò.
  terminology: “Àwọn ọmọ-ẹ̀yìn náà,” “ọkọ̀ ojú omi,” àti “àwọn ogunlọ́gọ̀ náà” yẹ fún ìforúkọsílẹ̀ Bíbélì Yorùbá òde òní. Àlàyé [a] tọ́ka sí ἀπολύσῃ gan-an, ó sì fúnni ní ìyàtò ọrọ̀ tí ó bójú mu.
