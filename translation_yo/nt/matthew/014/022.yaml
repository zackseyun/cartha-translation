id: MAT.14.22
reference: Matthew 14:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: yo
  text: Lẹ́sẹ̀kẹsẹ̀, ó fi dandan mú àwọn ọmọ-ẹ̀yìn náà wọ inú ọkọ̀ ojú omi, kí wọ́n sì ṣáájú rẹ̀ lọ sí òdìkejì, títí tí òun yóò fi tú àwọn ogunlọ́gọ̀ náà ká.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “rán àwọn ogunlọ́gọ̀ náà lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Lẹ́sẹ̀kẹsẹ̀
  rationale: Ó fi ìyára àti ìyípadà ojú-ẹsẹ̀ nínú ìtàn hàn ní Yorùbá àdánidá.
- source_word: ἠνάγκασεν
  choice: ó fi dandan mú
  rationale: Ó pa agbára ìtẹnumọ́ tàbí ìfipá ọ̀rọ̀ inú ἀναγκάζω mọ́ láìfi ìwà ipá ara kún ohun tí ẹsẹ náà sọ.
- source_word: τοὺς μαθητάς
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Ọ̀rọ̀ atọ́ka Gíríìkì tọ́ka sí ẹgbẹ́ ọmọ-ẹ̀yìn tí a ti mọ̀; “náà” mú ìtumọ̀ yẹn jáde láìfi “tirẹ̀” tí kò hàn gbangba sínú rẹ̀.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: wọ inú ọkọ̀ ojú omi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún gígun sínú ọkọ̀ ojú omi.
- source_word: πλοῖον
  choice: ọkọ̀ ojú omi
  rationale: Ó ṣe kedere, ó sì jẹ́ èdè òde òní fún irú ọkọ̀ tí àyíká ìtàn ń tọ́ka sí.
- source_word: προάγειν αὐτόν
  choice: ṣáájú rẹ̀ lọ
  rationale: Ó pa ìtumọ̀ pé kí àwọn ọmọ-ẹ̀yìn lọ ṣáájú Jésù mọ́ ní ọ̀rọ̀ Yorùbá àdánidá.
- source_word: εἰς τὸ πέραν
  choice: sí òdìkejì
  rationale: Èyí ni gbólóhùn Yorùbá tí ó ṣe déédéé fún etíkejì omi náà.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: títí tí òun yóò fi tú ... ká
  rationale: “Títí tí ... yóò fi” pa ìfojúsọ́nà sí ìṣẹ̀lẹ̀ ọjọ́ iwájú mọ́, “òun” sì mú kí ó ṣe kedere pé Jésù ni yóò ṣe é.
- source_word: τοὺς ὄχλους
  choice: àwọn ogunlọ́gọ̀ náà
  rationale: Ó pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, ó sì tọ́ka sí àwọn àwùjọ ènìyàn púpọ̀ tí a mẹ́nu kàn nínú àyíká ìtàn.
