translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A gbé àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí àlàyé náà ń ṣàlàyé.
