id: MAT.14.29
reference: Matthew 14:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: yo
  text: Ó sì wí pé, “Wá.” Pétérù sì sọ̀kalẹ̀ láti inú ọkọ̀ ojú omi, ó rìn lórí omi, ó sì lọ síhà Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ó sì dé ọ̀dọ̀ Jésù.” Èdè Gíríìkì sọ pé ó lọ síhà Jésù, ó sì tẹnu mọ́ ìrìn rẹ̀ ní ìtọ́sọ́nà Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Wá
  rationale: Ọ̀rọ̀ àṣẹ aorist yìí jẹ́ ìpè tààrà; “Wá” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ṣókí láìfi ọ̀rọ̀ kún un.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: sọ̀kalẹ̀ láti inú ọkọ̀ ojú omi
  rationale: Ó pa ìtẹ̀síwájú ìṣe mọ́ pé Peteru kọ́kọ́ sọ̀kalẹ̀ kúrò nínú ọkọ̀, kí ó tó rìn; “ọkọ̀ ojú omi” sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún πλοῖον ní àyíká yìí.
- source_word: περιεπάτησεν
  choice: ó rìn
  rationale: Ní àyíká yìí, περιπατέω túmọ̀ sí rírìn ní tààrà; kò pọndandan láti fi ìtumọ̀ bí “bẹ̀rẹ̀ sí í rìn” kún un.
- source_word: ἐπὶ τὰ ὕδατα
  choice: lórí omi
  rationale: “Lórí omi” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrìn lórí ojú omi, ó sì yẹra fún ọ̀rọ̀ àjèjì tàbí ìtúmọ̀ tó le.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: ó sì lọ síhà Jesu
  rationale: “Síhà Jesu” pa ìtọ́sọ́nà πρός mọ́, láìjẹ́rìí dájú pé Peteru ti dé ọ̀dọ̀ Jesu; “lọ” bá ojú ìwòye ìtàn Yorùbá mu lẹ́yìn tí Peteru kúrò nínú ọkọ̀.
- source_word: δὲ
  choice: Ó sì
  rationale: δέ jẹ́ àsopọ̀ ìtàn onírẹ̀lẹ̀ níbí; “sì” ń jẹ́ kí ìtàn máa lọ láìfi ìtakora tí kò sí sínú rẹ̀.
theological_decisions:
- issue: Bóyá Peteru dé ọ̀dọ̀ Jesu tàbí pé ó kàn ń lọ síhà rẹ̀
  choice: ó sì lọ síhà Jesu
  alternative: ó sì dé ọ̀dọ̀ Jesu
  rationale: πρός ń tọ́ka sí ìlọ síhà Jesu, kò sì fi dandan múlẹ̀ pé ó dé. Ìtumọ̀ yìí pa ìdàrúdàpọ̀ gidi àti ìtẹ̀síwájú ìtàn mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn, tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Gbólóhùn náà tẹ̀ lé ìṣètò ìṣe inú orísun, ó sì yẹra fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
