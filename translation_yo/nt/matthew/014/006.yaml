source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ayẹyẹ ọjọ́ ìbí Hẹ́rọ́dù dé[a], ọmọbìnrin Hẹ́rọ́díà jó ní àárín[b], ó sì mú inú Hẹ́rọ́dù dùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ọjọ́ ìbí Hẹ́rọ́dù dé,” tàbí “níbi àsè ọjọ́ ìbí Hẹ́rọ́dù.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àsìkò tí wọ́n ń ṣe ayẹyẹ ọjọ́ ìbí Hẹ́rọ́dù.
    reason: lexical_alternative
  - marker: b
    text: Ní gígán, “ní àárín.” Ó ṣeé ṣe kí èyí túmọ̀ sí pé ó jó ní àárín àwọn tó péjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: nígbà tí ayẹyẹ ọjọ́ ìbí Hẹ́rọ́dù dé
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìṣẹ̀lẹ̀ ayẹyẹ ọjọ́ ìbí Hẹ́rọ́dù, kì í ṣe ọjọ́ inú kàlẹ́ńdà lásán; ‘dé’ sì fi ìtumọ̀ γενομένοις hàn lọ́nà àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó ń tẹ ìtàn síwájú pẹ̀lú ìyípadà kékeré tó tún ní ìfarahàn ìtakora díẹ̀.
- source_word: ὠρχήσατο
  choice: jó
  rationale: Ìtumọ̀ tààrà ọ̀rọ̀ náà ni pé ó jó; kò yẹ kí a fi irú ijó tàbí ète rẹ̀ kún un.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ọmọbìnrin Hẹrodíà
  rationale: Èyí fi ìbátan náà hàn ní ṣókí, láì darúkọ ọmọbìnrin náà ní orúkọ tí Gíríìkì kò sọ.
- source_word: ἐν τῷ μέσῳ
  choice: ní àárín àwọn àlejò
  rationale: ‘Ní àárín’ ni ìtumọ̀ gangan; ‘àwọn àlejò’ mú ibi tí ìjó náà ti wáyé yé kedere ní Yorùbá, ṣùgbọ́n a pa ọ̀nà ìtumọ̀ gangan mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: ó mú inú Hẹ́rọ́dù dùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tí ó ṣe tẹ́ Hẹ́rọ́dù lọ́rùn.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Hẹ́rọ́dù
  rationale: Àkọtọ̀ Yorùbá tó bójú mu fún orúkọ ẹni náà ni a lò déédéé.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà ṣàn lọ́nà àdánidá, ó sì pa ìtumọ̀ àti àìdájú inú Gíríìkì mọ́ nípasẹ̀ àwọn àlàyé ìsàlẹ̀.
