  source_fidelity: 'Ìdámọ̀ ọrọ̀ ìpilẹ̀ jẹ́ dáadáa ní gbogbogbòò: Ṣùgbọ́n ń ṣàfihàn ìyàtọ̀ δέ, ó sì pa ìtọ́kasí sí àwọn ọmọ-ẹ̀yìn àti ìtẹnumọ́ ὑμεῖς mọ́. Síbẹ̀, ìlò “ni kí ẹ fún” lẹ́yìn “ẹ̀yin fúnra yín” kì í jẹ́ ọ̀nà tó mọ́ jù lọ láti gbé àṣẹ δότε kalẹ̀; a lè fi ìtẹnumọ́ náà hàn pẹ̀lú ìpínrọ̀ tó rọrùn.'
