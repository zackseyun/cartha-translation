reference: Matthew 14:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: yo
  text: Ṣùgbọ́n Jésù sọ fún wọn pé, “Wọ́n kò nílò láti lọ; ẹ̀yin fúnra yín, ẹ fún wọn ní oúnjẹ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn sí àbá àwọn ọmọ-ẹ̀yìn pé kí àwọn ènìyàn náà lọ.
- source_word: εἶπεν αὐτοῖς
  choice: sọ fún wọn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìṣáájú sí àsọjáde tààrà.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Kò sí ìdí fún wọn
  rationale: Ó túmọ̀ òwe Gíríìkì tó ní ìtumọ̀ ‘wọn kò nílò’ sí Yorùbá tó rọrùn, láìfi ohunkóhun kún un.
- source_word: ἀπελθεῖν
  choice: láti lọ
  rationale: Nínú àyíká yìí, ‘lọ’ túmọ̀ sí kí wọ́n kúrò ní ibi náà.
- source_word: δότε αὐτοῖς
  choice: kí ẹ fún wọn
  rationale: Ó pa àṣẹ ẹni-kejì ọ̀pọ̀ mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: ὑμεῖς
  choice: ẹ̀yin fúnra yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì ní ìtẹnumọ́; ‘ẹ̀yin fúnra yín’ pa ìtẹnumọ́ náà mọ́.
- source_word: φαγεῖν
  choice: ní ohun tí wọn ó jẹ
  rationale: Lẹ́yìn ‘fún,’ ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ohun jíjẹ,’ bí ó tilẹ̀ jẹ́ pé ohun náà kò farahàn gẹ́gẹ́ bí ọ̀rọ̀-orúkọ nínú Gíríìkì.
theological_decisions:
- issue: Ìtẹnumọ́ ipa àwọn ọmọ-ẹ̀yìn nínú àṣẹ Jésù
  choice: ẹ̀yin fúnra yín
  alternative: ẹ fún wọn ní ohun tí wọn ó jẹ
  rationale: Ó pa ìtẹnumọ́ ὑμεῖς mọ́, ṣùgbọ́n kò ṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kankan sí àṣẹ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘ẹ̀yin’ àti ‘ẹ’ fún ẹni-kejì ọ̀pọ̀, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
