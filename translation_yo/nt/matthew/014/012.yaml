id: MAT.14.12
reference: Matthew 14:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: yo
  text: Àwọn ọmọ-ẹ̀yìn rẹ̀ sì wá, wọ́n gbé òkú náà[a], wọ́n sì sin ín; lẹ́yìn náà, wọ́n lọ sọ fún Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ara ẹni tí ó ti kú.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: wá
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọ́n sún mọ́ ibi náà tàbí wọ́n dé ibẹ̀. “Wá” jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìṣe wọn nínú ìtàn yìí láìfi ìtumọ̀ míì kún un.
- source_word: μαθηταὶ αὐτοῦ
  choice: àwọn ọmọ-ẹ̀yìn rẹ̀
  rationale: “Ọmọ-ẹ̀yìn” pa ìtumọ̀ ẹni tí ń kọ́ lábẹ́ olùkọ́ kan mọ́. Nínú àyíká ẹsẹ̀ náà, “rẹ̀” ń tọ́ka sí Jòhánù Onítẹ̀bọmi.
- source_word: ἦραν
  choice: wọ́n gbé
  rationale: αἴρω ní ìtumọ̀ gbígbé ohun sókè tàbí gbígbé e kúrò; “wọ́n gbé” bá iṣẹ́ gbígbé òkú lọ sí ìsìnkú mu, láìsọ kúlẹ̀kúlẹ̀ tí Gíríìkì kò sọ.
- source_word: πτῶμα
  choice: òkú
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí ara ẹni tí ó ti kú. “Òkú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó wọ́pọ̀, tí ó sì yẹ fún ìtàn ọlọ́lá.
- source_word: ἔθαψαν αὐτόν
  choice: wọ́n sì sin ín
  rationale: Ìtumọ̀ tààrà θάπτω ni láti sin; gbolohun yìí tún pa ìtọ́kasí sí ẹni náà mọ́, láìfi ibojì tàbí sàréè tí ẹsẹ̀ náà kò mẹ́nu kàn kún un.
- source_word: ἐλθόντες
  choice: lẹ́yìn náà, wọ́n lọ
  rationale: Ẹ̀yà-ìṣe aorist yìí ń fi ìṣe tó tẹ̀ lé e hàn. “Lẹ́yìn náà, wọ́n lọ” jẹ́ Yorùbá àdánidá tó fi ìtẹ̀lé ìṣẹ̀lẹ̀ àti ìrìn wọn hàn.
- source_word: ἀπήγγειλαν
  choice: sọ fún
  rationale: ἀπαγγέλλω túmọ̀ sí láti ròyìn tàbí sọ ìròyìn. “Sọ fún” dára nínú ìtàn Yorùbá, ohun tí wọ́n sọ sì ṣe kedere láti inú àyíká.
- source_word: τῷ Ἰησοῦ
  choice: fún Jésù
  rationale: “Jésù” ni ọ̀nà ìkọ orúkọ Ἰησοῦς tí ó ti fìdí múlẹ̀ nínú Yorùbá.
theological_decisions:
- issue: Ta ni “àwọn ọmọ-ẹ̀yìn rẹ̀” ń tọ́ka sí?
  choice: Àwọn ọmọ-ẹ̀yìn Jòhánù Onítẹ̀bọmi
  alternative: Àwọn ọmọ-ẹ̀yìn Jésù
  rationale: Àyíká tó sún mọ́ ẹsẹ̀ yìí ń sọ nípa ikú Jòhánù, nítorí náà αὐτοῦ ń tọ́ka sí Jòhánù lọ́nà àdánidá. Bí ó tilẹ̀ rí bẹ́ẹ̀, a pa ọ̀rọ̀ Gíríìkì náà mọ́ gẹ́gẹ́ bí “rẹ̀,” kí àyíká ni ó ṣàlàyé ẹni tí a ń tọ́ka sí.
translation_notes:
  register: A lo Yorùbá àtijọ́-kò-jù, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tí wọ́n ti yẹ. Ìtẹ̀lé “wọ́n wá … wọ́n gbé … wọ́n sin … wọ́n lọ sọ” mú kí ìtàn ṣàn lọ́nà àdánidá.
