id: MAT.14.15
reference: Matthew 14:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: yo
  text: Nígbà tí ó di ìrọ̀lẹ́, àwọn ọmọ-ẹ̀yìn náà wá sọ́dọ̀ rẹ̀, wọ́n sì ní, “Ibi náà jẹ́ ibi ahoro[a], ó sì ti pẹ́[b]. Rán àwọn ogunlọ́gọ̀ náà lọ, kí wọ́n lè lọ sí àwọn abúlé láti ra oúnjẹ fún ara wọn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ibi náà dá síta.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “wákàtí náà ti kọjá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Nígbà tí ó di ìrọ̀lẹ́
  rationale: Gbólóhùn olùní-àkókò yìí ń fi ìyípadà ìṣẹ̀lẹ̀ hàn. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ pé ìrọ̀lẹ́ dé mọ́ láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: προσῆλθον αὐτῷ
  choice: tọ̀ ọ́ wá
  rationale: Ó túmọ̀ sí pé wọ́n sún mọ́ ọn tàbí wọ́n wá bá a; “tọ̀ ọ́ wá” bá ìtàn Yorùbá mu, ó sì ṣe kedere.
- source_word: οἱ μαθηταὶ
  choice: àwọn ọmọ-ẹ̀yìn náà
  rationale: Àmì ìdánimọ̀ inú Gíríìkì tọ́ka sí ẹgbẹ́ tí a ti mọ̀; “náà” ń gbé ìtumọ̀ yẹn jáde láìfi pé wọ́n jẹ́ tirẹ̀ kún ọ̀rọ̀ náà.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Ibi náà dá
  rationale: ἔρημος níbí ń ṣàpèjúwe ibi tí ènìyàn tàbí ìlú kò sí nítòsí. “Ibi náà dá” jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ pé ibi náà jìnnà sí àgbègbè tí ènìyàn ń gbé.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: àkókò sì ti lọ jìnnà
  rationale: Ní tààrà, ọ̀rọ̀ náà sọ pé “wákàtí náà ti kọjá,” ṣùgbọ́n ó jẹ́ àpèjúwe pé ọjọ́ ti pé. “Àkókò ti lọ jìnnà” pa àpèjúwe ìlọsíwájú àkókò mọ́, ó sì jẹ́ Yorùbá tó ṣeé lóye.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Jẹ́ kí àwọn ogunlọ́gọ̀ náà lọ
  rationale: ἀπολύω ní àyíká yìí túmọ̀ sí láti tú wọn ká tàbí rán wọn lọ. Ìtumọ̀ yìí jẹ́ àdánidá, kò sì mú ìtumọ̀ “dá sílẹ̀” tí kò bá àyíká mu wọlé.
- source_word: ἵνα ἀπελθόντες
  choice: kí wọ́n lè lọ
  rationale: Ó sọ ète ìrán wọn lọ. Yorùbá yìí parapọ̀ participle àti gbólóhùn ète náà lọ́nà tó rọrùn láìsọ ìtumọ̀ nù.
- source_word: εἰς τὰς κώμας
  choice: sí àwọn abúlé
  rationale: κώμη túmọ̀ sí abúlé. “Sí àwọn abúlé” jẹ́ ọ̀nà Yorùbá àdánidá; a kò fi “tó wà nítòsí” kún un nítorí kò fara hàn gbangba nínú Gíríìkì.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: ra oúnjẹ fún ara wọn
  rationale: βρώματα jẹ́ oúnjẹ, ἑαυτοῖς sì fi hàn pé àwọn fúnra wọn ni wọ́n máa rà á fún. Ìtumọ̀ náà ṣe kedere, ó sì tẹ̀ lé ìtumọ̀ orísun.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “àwọn ogunlọ́gọ̀” láti pa ọ̀pọ̀ ènìyàn inú ọ̀rọ̀ orísun mọ́, a sì so àwọn àmì àlàyé mọ́ ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé, nítorí ìṣètò wọn nínú ẹ̀dà ìmọ̀ràn Gẹ̀ẹ́sì kò bá àwọn àlàyé náà mu.
