source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: yo
  text: A sì mú orí rẹ̀ wá lórí àwo ńlá[a], a sì fi fún ọmọbìnrin náà; ọmọbìnrin náà sì mú un lọ sí ọ̀dọ̀ ìyá rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lórí àtẹ̀” tàbí “lórí àwo.” Ọ̀rọ̀ Gíríìkì πίναξ ń tọ́ka sí àwo ńlá tàbí àtẹ̀ tí a fi ń gbé oúnjẹ kalẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: A sì gbé ... wá
  rationale: Ọ̀nà àìsọ ẹni tó ṣe iṣẹ́ pẹ̀lú “a” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìtumọ̀ ọ̀rọ̀-ìṣe aláìṣe Gíríìkì mọ́, nígbà tí “gbé ... wá” bá ìtẹ̀síwájú ìtàn mu.
- source_word: κεφαλὴ αὐτοῦ
  choice: orí rẹ̀
  rationale: Ìtumọ̀ tààrà ni; kò sí ìdí nínú Gíríìkì láti lo ọ̀rọ̀ ìrọ̀rùn tàbí ìbòjú fún “orí.”
- source_word: ἐπὶ πίνακι
  choice: lórí àwo ńlá pẹlẹbẹ
  rationale: πίναξ túmọ̀ sí àwo tàbí àtẹ tí a fi ń gbé oúnjẹ kalẹ̀; “àwo ńlá pẹlẹbẹ” ṣe kedere ní Yorùbá òde òní, ó sì yẹ fún ohun tí àyíká ọ̀rọ̀ ń ṣàpèjúwe.
- source_word: ἐδόθη
  choice: a sì fi fún
  rationale: Èyí pa ìtumọ̀ aláìṣe náà mọ́ ní ọ̀nà Yorùbá tó ṣe déédé, láìdárúkọ ẹni tó fi í fún un.
- source_word: τῷ κορασίῳ
  choice: ọmọbìnrin náà
  rationale: κοράσιον ń tọ́ka sí ọmọbìnrin kan; “ọmọbìnrin náà” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tí kò sì ní àwọ̀ èdè àtijọ́.
- source_word: ἤνεγκεν
  choice: gbé e lọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “e” mú ohun tí ó gbé ṣe kedere, “gbé ... lọ” sì jẹ́ ọ̀nà àdánidá láti sọ pé ó mú un tọ ẹni mìíràn lọ.
- source_word: τῇ μητρὶ αὐτῆς
  choice: fún ìyá rẹ̀
  rationale: Ìtumọ̀ tààrà ni, “rẹ̀” sì ń tọ́ka sí ìyá ọmọbìnrin náà gẹ́gẹ́ bí Gíríìkì ṣe fi hàn.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ìsẹ̀lẹ̀ [a] sí lẹ́yìn gbólóhùn tí ó túmọ̀ πίναξ, kì í ṣe lẹ́yìn “ọmọbìnrin náà,” nítorí àlàyé ìsàlẹ̀ jẹ́ ti irú àwo náà.
