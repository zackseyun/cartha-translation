id: 1TH.3.3
reference: 1 Thessalonians 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: yo
  text: kí ọkàn ẹnikẹ́ni má dàrú nínú ìpọ́njú wọ̀nyí.[a][b] Nítorí ẹ̀yin fúnra yín mọ̀ pé a yàn wá fún èyí.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹnikẹ́ni má mì” tàbí “kí ọkàn ẹnikẹ́ni má balẹ̀.” Ọ̀rọ̀-ìṣe náà ṣọ̀wọ́n; ní àwọn àyíká mìíràn, ó lè túmọ̀ sí “kí a tàn ẹnikẹ́ni jẹ” tàbí “kí a fi ọ̀rọ̀ dídùn yí ẹnikẹ́ni lọ́kàn padà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ àwọn ìpọ́njú wọ̀nyí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a ti pín èyí sí wa” tàbí “a gbé wa kalẹ̀ fún èyí.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: kí ìpọ́njú wọ̀nyí má bà á jẹ́ fún ẹnikẹ́ni láti dúró ṣinṣin
  rationale: Ọ̀rọ̀-ìṣe σαίνεσθαι ṣọ̀wọ́n, ó sì túmọ̀ sí jíjẹ́ kí ọkàn ẹni dàrú tàbí kí ẹni má dúró ṣinṣin nínú àyíká yìí. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa àníyàn olùṣọ́-àgùntàn inú ọ̀rọ̀ náà mọ́.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: ìpọ́njú wọ̀nyí
  rationale: θλῖψις ń tọ́ka sí ìnira, wàhálà, tàbí ìpọ́njú. Ìtumọ̀ yìí fi ìwúwo ọ̀rọ̀ náà hàn ní èdè Yorùbá òde òní; a mú un gẹ́gẹ́ bí ohun tó lè fa àìdúróṣinṣin.
- source_word: αὐτοὶ
  choice: ẹ̀yin fúnra yín
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì náà mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ṣàlàyé ìdí fún gbólóhùn tó ṣáájú.
- source_word: οἴδατε
  choice: mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù ọ̀rọ̀ náà jẹ́ pípé ní Gíríìkì, ìtumọ̀ rẹ̀ níbí jẹ́ ti ìsinsìnyí.
- source_word: εἰς τοῦτο
  choice: sí irú èyí
  rationale: Ó tọ́ka sí ìpọ́njú tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, láì fi ìtumọ̀ ‘fún ète yìí’ lé ọ̀rọ̀ náà lórí.
- source_word: κείμεθα
  choice: a yàn wá
  rationale: Ní àkójọpọ̀ ọ̀rọ̀ yìí, κεῖμαι kọjá ìtumọ̀ gidi ‘dùbúlẹ̀’ tàbí ‘wà ní ibi kan’; ó ń sọ nípa fífi tàbí yíyan ẹnì kan sí ipò kan. ‘A yàn wá’ pa ìtumọ̀ ìṣètò mọ́ láì sọ ẹ̀kọ́ àyànmọ́ kan pàtó.
theological_decisions:
- issue: Ìbáṣepọ̀ àwọn onígbàgbọ́ pẹ̀lú ìpọ́njú nínú εἰς τοῦτο κείμεθα
  choice: a yàn wá sí irú èyí
  alternative: a ti yàn án gẹ́gẹ́ bí àyànmọ́ wa fún irú èyí; a gbé wa kalẹ̀ fún èyí
  rationale: Ọ̀rọ̀ náà fi hàn pé ìpọ́njú jẹ́ apá kan nínú ìrírí àwọn ọmọlẹ́yìn Kristi tí a ti retí, ṣùgbọ́n kò ṣàlàyé ẹ̀kọ́ àyànmọ́ ní kíkún. Ìtumọ̀ yìí pa ìwúwo ìṣètò Ọlọ́run mọ́ láì gbé ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kan wọ inú rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. Gbólóhùn àkọ́kọ́ ń bá ète/àbájáde ẹsẹ tó ṣáájú lọ, gẹ́gẹ́ bí τὸ pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni ṣe fi hàn.
