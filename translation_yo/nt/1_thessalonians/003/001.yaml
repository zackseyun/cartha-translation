    rationale: “Mú un mọ́ra” kì í ṣe ‘farada’ nínú Yorùbá; ó lè yí ìtumọ̀ sí díímú ẹni tàbí ohun mọ́ra. A rọ́pò rẹ̀ pẹ̀lú “faradà á mọ́,” èyí tó jẹ́ àṣàyàn tó péye.
