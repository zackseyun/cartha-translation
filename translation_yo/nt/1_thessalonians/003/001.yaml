lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ohun tí a sọ ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti so ọ̀rọ̀ pọ̀ ní Yorùbá.
- source_word: μηκέτι στέγοντες
  choice: nígbà tí a kò lè fara dà á mọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí pé agbára láti fara da ìdààmú ọkàn ti dé òpin; gbolohun yìí ṣe kedere, ó sì bójú mu àyíká ọ̀rọ̀.
- source_word: εὐδοκήσαμεν
  choice: ó dùn mọ́ wa
  rationale: Ó pa ìtumọ̀ ìfẹ́ tàbí ìtẹ́wọ́gbà inú εὐδοκέω mọ́, láì sọ ọ́ di ìpinnu ọgbọ́n lásán.
- source_word: καταλειφθῆναι
  choice: láti dá wà
  rationale: Ó sọ àbájáde ìṣe aláìṣe—kí àwọn olùsọ̀rọ̀ wà láìsí àwọn alábàákẹ́gbẹ́—ní Yorùbá àdánidá; àlàyé ẹsẹ̀ ìsàlẹ̀ tọ́ka sí ìtumọ̀ gígùn tó pa ìṣe aláìṣe mọ́ ní kíkún.
- source_word: ἐν Ἀθήναις
  choice: ní Átẹ́ńsì
  rationale: Ìtumọ̀ ibi tí ó péye, pẹ̀lú ìkọ̀wé orúkọ ìlú náà ní ọ̀nà Yorùbá.
- source_word: μόνοι
  choice: dá wà
  rationale: Ó túmọ̀ sí ‘nìkan’ tàbí ‘láìsí àwọn ẹlòmíràn,’ ó sì múra ọ̀nà sílẹ̀ fún fífi Timotiu ránṣẹ́ ní ẹsẹ̀ tó tẹ̀ lé e.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ arọ́pò-orúkọ ẹni àkọ́kọ́ ọ̀pọ̀ ń tọ́ka sí, àti ìforígbárí tó ṣeé ṣe pẹ̀lú àyíká ọ̀rọ̀ tó gbòòrò
  choice: A pa ‘a/wa’ àti ìtumọ̀ ọ̀pọ̀ inú èdè Gíríìkì mọ́.
  alternative: Kí a túmọ̀ ọ̀pọ̀ náà sí Pọ́ọ̀lù nìkan, bí ‘mo pinnu láti dá wà.’
  rationale: εὐδοκήσαμεν àti μόνοι jẹ́ ọ̀pọ̀. Ìtumọ̀ kò gbọ́dọ̀ pinnu àríyànjiyàn ìtàn nípa bóyá Pọ́ọ̀lù ń lo ọ̀pọ̀ lẹ́tà tàbí ó ń sọ fún ẹgbẹ́ àwọn òjíṣẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì ṣàfikún èrò ẹ̀kọ́ ìjọ kankan.
