  source_fidelity: Ìtumọ̀ ìbẹ̀rẹ̀ náà mú ìjápọ̀ ìyọrísí Διὸ àti ìfaradà tí μηκέτι στέγοντες ń sọ hàn dáadáa. Síbẹ̀, “láti dá wà” nínú ọ̀rọ̀ àkọ́kọ́ kò fi ìrísí aláìṣe καταλειφθῆναι (“kí a fi ... sílẹ̀”) hàn. Ìtúnṣe náà pa ìrísí aláìṣe yẹn mọ́, ó sì pa μόνοι mọ́ gẹ́gẹ́ bí “àwa nìkan.”
  naturalness: “Ó wù wá láti jẹ́ kí a fi wá sílẹ̀” jẹ́ Yorùbá boṣewa tó hàn gbangba, tí ó sì mú ìfẹ́/ìfẹ́-inú εὐδοκήσαμεν jáde láì dín un sí ìpinnu ọgbọ́n lásán. “Fara dà á” jẹ́ ìlò àdánidá fún ìfaradà ìdààmú.
  terminology: “Nítorí náà,” “fara dà,” “fi wá sílẹ̀,” àti “àwa nìkan” bójú mu ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì nípasẹ̀ àyíká wọn. Átẹ́ńsì jẹ́ ìkọ̀wé orúkọ ibi tí ó yẹ. Àlàyé ẹsẹ̀ ìsàlẹ̀ a nínú àkọsílẹ̀ àkọ́kọ́ kò tọ́, nítorí “mú un mọ́ra” túmọ̀ sí díímú tàbí fífamọ́ra, kì í ṣe faradà.
  issues:
