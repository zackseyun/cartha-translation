id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: yo
  text: Nítorí èyí, nígbà tí èmi náà kò lè fara dà á mọ́, mo ránṣẹ́ láti mọ bí ìgbàgbọ́ yín[a] ti rí, kí ó má bàa ṣe pé olùdánwò ti dán yín wò, kí làálàá wa sì di asán[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé yín” tàbí “ìṣòtítọ́ yín.” Ọ̀rọ̀ Gíríìkì náà lè ní àwọn ìtumọ̀ wọ̀nyí tí wọ́n jọra, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: alternative_reading
  - marker: b
    text: Tàbí “jẹ́ lásán” tàbí “má ní èso kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó fi ìdí ohun tí Pọ́ọ̀lù sọ tẹ́lẹ̀ múlẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìdí ní Yorùbá.
- source_word: κἀγὼ
  choice: èmi náà
  rationale: Ó mú àfikún καί hàn láì fi ìtẹnumọ́ tí ó pọ̀ jù kún ọ̀rọ̀ náà.
- source_word: μηκέτι στέγων
  choice: nígbà tí èmi náà kò lè fara dà á mọ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífaradà tí ó dé òpin.
- source_word: ἔπεμψα
  choice: mo ránṣẹ́
  rationale: A kò sọ ẹni tí a rán nínú ẹsẹ yìí, nítorí náà a kò fi Tímótì kún ọ̀rọ̀ náà bí ó tilẹ̀ jẹ́ pé àyíká ló tọ́ka sí i.
- source_word: εἰς τὸ γνῶναι
  choice: láti mọ bí ... ti rí
  rationale: Ó sọ ète ìránṣẹ́ náà ní Yorùbá tí ó ṣe kedere, ó sì pa ìtumọ̀ wíwádìí láti mọ ipò wọn mọ́.
- source_word: τὴν πίστιν ὑμῶν
  choice: ìgbàgbọ́ yín
  rationale: Ìgbàgbọ́ ni ìtumọ̀ àkọ́kọ́ tí ó bá àyíká yìí mu; àkọsílẹ̀ ìsàlẹ̀ pa àwọn ìtumọ̀ tó ṣeé ṣe mìíràn mọ́.
- source_word: μή πως
  choice: kí ó má bàa ṣe pé
  rationale: Ó fi ìbẹ̀rù Pọ́ọ̀lù nípa ohun tí ó ṣeé ṣe hàn láì sọ ọ́ di ohun tí ó dájú.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: olùdánwò ti dán yín wò
  rationale: Ó pa àtúnlò gbòǹgbò ọ̀rọ̀ inú Gíríìkì mọ́, ó sì fi ìdánwò tí ń fà ènìyàn kúrò ní ìgbàgbọ́ hàn.
- source_word: εἰς κενὸν γένηται
  choice: di asán
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iṣẹ́ tí kò ní èso tàbí àǹfààní.
- source_word: ὁ κόπος ἡμῶν
  choice: làálàá wa
  rationale: Làálàá mú ìtumọ̀ iṣẹ́ líle àti ìsapá inú κόπος jáde ju ọ̀rọ̀ gbogbogbò bí iṣẹ́ lọ.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àyíká Pọ́ọ̀lù yìí
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: Àyíká náà sábà tọ́ka sí bí àwọn ará Tẹsalóníkà ṣe ń bá a lọ ní gbígbàgbọ́ ìhìn rere, ṣùgbọ́n ọ̀rọ̀ Gíríìkì lè ní àwọn ìtumọ̀ tó yí ká ìgbẹ́kẹ̀lé àti ìṣòtítọ́; a pa wọ́n mọ́ nínú àkọsílẹ̀ ìsàlẹ̀.
- issue: Bí a ṣe máa sọ ὁ πειράζων
  choice: olùdánwò
  alternative: ẹni tí ń dánni wò; Sátánì
  rationale: Ọ̀rọ̀ Gíríìkì lo àpèjúwe ẹni tí ń dánni wò, kì í ṣe orúkọ Sátánì ní tààràtà; ìtumọ̀ náà kò fi orúkọ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “mo ránṣẹ́” láì sọ ẹni tí a rán, nítorí ẹni náà kò fara hàn nínú ẹsẹ yìí.
