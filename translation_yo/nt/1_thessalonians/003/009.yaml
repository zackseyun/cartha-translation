id: 1TH.3.9
reference: 1 Thessalonians 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: yo
  text: Nítorí ìrú ọpẹ́ wo ni àwa lè fi san padà fún Ọlọ́run nípa yín[a], fún gbogbo ayọ̀ tí a fi ń yọ̀ nítorí yín níwájú Ọlọ́run wa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà àdánidá sí i, “Báwo ni a ṣe lè dúpẹ́ lọwọ́ Ọlọ́run ní kíkún nítorí yín...?” Gíríìkì náà sọ ní ọ̀nà tó fẹ́rẹ̀ẹ́ jẹ́ ní tààrà pé, “Ìrú ọpẹ́ wo ni a lè fi san padà fún Ọlọ́run nípa yín...?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: irú ọpẹ́ wo
  rationale: Ó pa ìbéèrè àsọ àsọdùn Gíríìkì mọ́, ó sì fi hàn pé ọpẹ́ tí wọ́n lè dúpẹ́ kò tó ìwọ̀n ayọ̀ wọn.
- source_word: δυνάμεθα
  choice: ni àwa lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ agbára tàbí àǹfààní nínú ìbéèrè àsọ àsọdùn.
- source_word: ἀνταποδοῦναι
  choice: san padà
  rationale: Ó pa àwòrán fífi ohun kan padà nítorí ohun tí a ti rí gbà mọ́, láìsọ ọ́ di gbèsè gidi tí Ọlọ́run ń béèrè.
- source_word: περὶ ὑμῶν
  choice: nítorí yín
  rationale: Ní àyíká ọ̀rọ̀ yìí, èyí jẹ́ Yorùbá tó ṣe kedere fún ọpẹ́ nípa tàbí lórí ọ̀ràn àwọn onígbàgbọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan hàn.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: fún gbogbo ayọ̀
  rationale: Ó sọ ìpìlẹ̀ tàbí ohun tó fa ọpẹ́ náà ní èdè Yorùbá tó rọrùn.
- source_word: ᾗ χαίρομεν
  choice: tí a fi ń yọ̀
  rationale: Ó pa ìbátan ọ̀rọ̀ tó wà láàárín χαρά àti χαίρω mọ́ nípa ‘ayọ̀’ àti ‘yọ̀,’ ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ohun tó fa ayọ̀; ‘nítorí yín’ sọ ìdí náà kedere.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: níwájú Ọlọ́run wa
  rationale: Ó pa àwòrán Gíríìkì ti wíwà níwájú Ọlọ́run mọ́, ó sì jẹ́ ọ̀rọ̀ tí àwọn olùka Yorùbá lóye dáadáa.
theological_decisions:
- issue: Àwòrán sísan ọpẹ́ padà fún Ọlọ́run
  choice: Pa ‘san padà’ mọ́ gẹ́gẹ́ bí àwòrán ọ̀rọ̀ inú ìbéèrè àsọ àsọdùn.
  alternative: ‘Báwo ni a ṣe lè dúpẹ́ lọ́wọ́ Ọlọ́run tó fún yín?’
  rationale: Ọ̀rọ̀ ἀνταποδοῦναι ní ìtumọ̀ fífi ohun kan padà. Ìbéèrè àsọ àsọdùn fi hàn pé Pọ́ọ̀lù ń tẹnumọ́ pé ọpẹ́ wọn kò lè tó, kì í ṣe pé ènìyàn lè san gbèsè gidi fún Ọlọ́run.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A pa ìbéèrè àsọ àsọdùn àti àtúnwí ‘ayọ̀/yọ̀’ inú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé a lo ‘nítorí yín’ lẹ́ẹ̀mejì nítorí ìṣàn Yorùbá tó ṣe kedere.
