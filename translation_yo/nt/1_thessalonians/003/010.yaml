  yaml_path: translation/nt/1_thessalonians/003/010.yaml
  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: yo
  text: Ní òru àti ní ọ̀sán, à ń bẹ̀bẹ̀ gidigidi láti rí yín ní ojúkojú, kí a sì pèsè àwọn ohun tí ìgbàgbọ́ yín ṣì nílò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, ‘kí a sì pèsè ohun tí ó ṣaláìsí nínú ìgbàgbọ́ yín.’ Gíríìkì náà tún lè ní ìtumọ̀ gbòòrò pé kí a mú ohun gbogbo tí ìgbàgbọ́ wọn ṣì nílò okun tàbí ìmúparí wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Ní òru àti ní ọ̀sán
  rationale: Àwọn ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí àpèjúwe ìgbà, wọ́n sì fi ìtẹ̀síwájú tàbí àtúnṣe ìṣe hàn. Ìtumọ̀ yìí pa bí Gíríìkì ṣe to àwọn apá ọjọ́ náà mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ὑπερεκπερισσοῦ
  choice: tọkàntọkàn gidigidi
  rationale: Ọ̀rọ̀ àfikún alágbára yìí ń tẹnu mọ́ bí ẹ̀bẹ̀ wọn ṣe jinlẹ̀ tó. Àpapọ̀ ọ̀rọ̀ yìí sọ agbára rẹ̀ jáde ní Yorùbá tí ó ṣe kedere láìjẹ́ líle.
- source_word: δεόμενοι
  choice: à ń gbàdúrà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ṣíṣe ẹ̀bẹ̀ pẹ̀lú ìtara. ‘Gbàdúrà’ bá àyíká ọ̀rọ̀ mu, nígbà tí ‘tọkàntọkàn gidigidi’ ń gbé agbára ẹ̀bẹ̀ náà jáde.
- source_word: εἰς τὸ ἰδεῖν
  choice: pé kí a lè rí
  rationale: Àtòjọ preposition àti infinitive náà ń fi ète hàn. Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète náà.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: rí ojú yín
  rationale: Èyí pa àwòrán gangan ti ‘ojú yín’ mọ́, ó sì lè túmọ̀ sí pípa dàpọ̀ ní ojúkojú, gẹ́gẹ́ bí àṣà ọ̀rọ̀ Gíríìkì náà.
- source_word: καταρτίσαι
  choice: mú ... pé
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí títúnṣe, pípèsè, tàbí mímú ohun kan dé ipò pípé. Nínú àyíká ohun tí ó ṣì kù, ‘mú ... pé’ jẹ́ Yorùbá àdánidá, ó sì pa èrò ìparí tàbí ìmúgbòòrò mọ́.
- source_word: τὰ ὑστερήματα
  choice: ohun tí ó ṣì kù
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni Gíríìkì lò, gbólóhùn àkójọpọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì lè tọ́ka sí gbogbo ohun tí ó ṣaláìsí tàbí tí ó nílò ìmúgbòòrò.
- source_word: τῆς πίστεως ὑμῶν
  choice: nínú ìgbàgbọ́ yín
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ fún πίστις níbí. ‘Nínú’ fi hàn pé àwọn apá kan nínú ìgbàgbọ́ wọn ló ṣì nílò ìmúgbòòrò, kì í ṣe pé wọn kò ní ìgbàgbọ́ rárá.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé àwọn ará Tẹsalóníkà tí ó ṣì lè dàgbà. ‘Ìgbàgbọ́’ pa ìtumọ̀ ẹ̀kọ́ ìsìn tí ó wọ́pọ̀ mọ́ láìfi ìṣòtítọ́ nínú ìwà ṣe ìtumọ̀ pàtàkì rẹ̀.
- issue: Bí a ṣe lóye καταρτίσαι pẹ̀lú τὰ ὑστερήματα
  choice: mú ohun tí ó ṣì kù ... pé
  alternative: pèsè ohun tí ó ṣaláìsí; fún ohun tí ó nílò okun ní agbára
  rationale: Gíríìkì gba èrò pípèsè ohun tí ó kù, títúnṣe, àti mímú dé ipò pípé láyè. Ọ̀rọ̀ inú ẹsẹ̀ yan èrò ìmúparí, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìgbòòrò ìtumọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. Àmì ọ̀pọ̀ ‘yín’ pa ọ̀rọ̀ tí a ń bá gbogbo ìjọ sọ mọ́; ‘a’ sì fi olùsọ ọ̀pọ̀ tí participle Gíríìkì ń tọ́ka sí hàn.
