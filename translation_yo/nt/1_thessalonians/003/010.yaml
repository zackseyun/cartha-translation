  to: Ní òru àti ní ọ̀sán, à ń bẹ̀bẹ̀ gidigidi láti rí yín ní ojúkojú, kí a sì pèsè àwọn ohun tí ìgbàgbọ́ yín ṣì nílò.[a]
  rationale: 'A rọ́pò ọ̀rọ̀ tí kò dáa lórí καταρτίσαι τὰ ὑστερήματα pẹ̀lú ìtumọ̀ Yorùbá tó ṣe kedere: pípèsè àwọn ohun tí ìgbàgbọ́ wọn ṣì nílò. A tún lo ‘ń bẹ̀bẹ̀ gidigidi’ láti ṣàfihàn ìbẹ̀bẹ̀ kíkankíkan nínú Gíríìkì, a sì sọ ‘ojú yín’ di ‘rí yín ní ojúkojú’ fún lílò Yorùbá àdánidá. Ìtumọ̀ míì nínú àlàyé ìsàlẹ̀ pa ààyè ìtumọ̀ ‘ohun tí ó ṣaláìsí’ àti ìmúgbòòrò/ìmúparí mọ́.'
