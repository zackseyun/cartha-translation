  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìfẹ́-àdúrà Gíríìkì náà dáadáa: Olúwa ni olùṣe, ìfẹ́ ni ohun tí ó ń pọ̀ sí i, ó sì dojúkọ ara wọn àti gbogbo ènìyàn. Ṣùgbọ́n “kún àkúnwọ́sílẹ̀” kì í ṣe ọ̀nà Yorùbá tí ó dára tàbí tí ó rọrùn láti lóye fún περισσεύσαι.'
  naturalness: “Kún àkúnwọ́sílẹ̀” dà bí ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀, kò sì jẹ́ ìlò Yorùbá òde-òní tí ó rọrùn. Ṣíṣe ìfẹ́ náà ní kókó-ọrọ nínú “kí ìfẹ́ yín ... pọ̀ sí i, kí ó sì túbọ̀ pọ̀” jẹ́ èdè àdánidá, ó sì pa ìtẹnumọ́ ọ̀rọ̀-ìṣe méjèèjì mọ́.
  terminology: '“Olúwa,” “ìfẹ́,” “ara yín,” àti “gbogbo ènìyàn” yẹ. “Gbogbo ènìyàn” ń ṣàlàyé πάντας díẹ̀ sí ‘all people,’ ṣùgbọ́n ó jẹ́ ìlò Yorùbá àdánidá tí kò fi í mọ́ àwọn onígbàgbọ́ nìkan. Àtúnṣe sí àlàyé ẹsẹ̀-ẹ̀gbẹ́ b ń yọ ìdíje kan kúrò: Gíríìkì fi ìmọ̀ ‘pọ̀ sí i àti túbọ̀ pọ̀ nínú ìfẹ́’ sílẹ̀, kì í ṣe ‘ní ìfẹ́’ nìkan.'
