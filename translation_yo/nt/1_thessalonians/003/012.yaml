id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: yo
  text: Kí Olúwa sì mú kí ìfẹ́ yín sí ara yín àti sí gbogbo ènìyàn[a] pọ̀ sí i, kí ó sì túbọ̀ pọ̀, gẹ́gẹ́ bí ìfẹ́ àwa náà sí yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí ara yín àti sí gbogbo wọn.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn ìkẹyìn kò ní ọ̀rọ̀-ìṣe ní Gíríìkì; bí a bá tú u ní tààrà, ó jẹ́, “gẹ́gẹ́ bí àwa náà sí yín.” A mú èrò “ìfẹ́ ... pọ̀ sí i, kí ó sì túbọ̀ pọ̀” wá láti inú gbólóhùn tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Ó pa oyè κύριος mọ́ láì fi àlàyé kún un nípa ẹni tí ó ń tọ́ka sí; ‘Olúwa’ ni ìtumọ̀ Yorùbá tí ó yẹ ní àdúrà-ìfẹ́ yìí.
- source_word: πλεονάσαι
  choice: mú kí ẹ pọ̀ sí i
  rationale: Ọ̀rọ̀-ìṣe náà wà nínú gbólóhùn ìfẹ́-àdúrà, Olúwa sì ni olùṣe; ‘mú kí’ fi ìtumọ̀ pé ó fa ìlọsíwájú náà hàn.
- source_word: περισσεύσαι
  choice: kí ẹ sì kún àkúnwọ́sílẹ̀
  rationale: Ó yà ọ̀rọ̀ yìí sọ́tọ̀ kúrò lọ́dọ̀ πλεονάσαι, ó sì mú ìtumọ̀ ọ̀pọ̀lọpọ̀ tí ó ré kọjá òṣùwọ̀n jáde.
- source_word: τῇ ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Dative náà ń tọ́ka sí ibi tàbí ọ̀nà tí ìpọ̀sí àti àkúnwọ́sílẹ̀ ti ń ṣẹlẹ̀; ‘nínú ìfẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: εἰς ἀλλήλους
  choice: sí ara yín
  rationale: ‘Sí’ pa ìdarí εἰς mọ́, ‘ara yín’ sì jẹ́ ọ̀nà àdánidá láti sọ ìfẹ́ tí àwọn ọmọ ìjọ ní sí ẹnì kejì wọn.
- source_word: καὶ εἰς πάντας
  choice: àti sí gbogbo ènìyàn
  rationale: ‘Gbogbo ènìyàn’ jẹ́ kíkún adayeba ti πάντας ní Yorùbá, ṣùgbọ́n kò dín ààlà rẹ̀ kù sí àwọn onígbàgbọ́ nìkan.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: gẹ́gẹ́ bí àwa náà ti ní ìfẹ́ sí yín
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ fún olùkà láti mú láti inú gbólóhùn tó ṣáájú; a mú ‘ní ìfẹ́’ padà wá ní Yorùbá láti jẹ́ kí gbólóhùn náà pé, láì sọ pé ó pọ̀ tàbí kún ju ohun tí gíríìkì sọ lọ.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín δέ ń so ìfẹ́-àdúrà yìí mọ́ ohun tó ṣáájú, kì í ṣe ìtakora líle; ‘sì’ bá ìṣàn Yorùbá mu.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘Olúwa’ láì sọ orúkọ ẹni náà.
  alternative: Kí a sọ pé ó ń tọ́ka pàtó sí Kristi, tàbí sí Ọlọ́run ní ọ̀nà gbogbogbò.
  rationale: κύριος nìkan ni ẹsẹ yìí lò; títúmọ̀ oyè náà láì fikún un ń pa àìdánilójú inú ọ̀rọ̀ náà mọ́.
- issue: Ààlà πάντας
  choice: ‘gbogbo ènìyàn’ ni a lò, láì dín wọn kù sí ẹgbẹ́ kan.
  alternative: Gbogbo àwọn onígbàgbọ́, tàbí gbogbo ènìyàn láìsí àfikún ‘ènìyàn.’
  rationale: Ọ̀rọ̀ náà gbòòrò, ó sì ṣeé ṣe kí ó kọjá àwọn ọmọ ìjọ; ìtumọ̀ yìí kò sọ ẹgbẹ́ tí a gbọ́dọ̀ fi sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọ ‘ẹ/yín’ jẹ́ ọ̀pọ̀ ènìyàn. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba.
