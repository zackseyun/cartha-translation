revisions:
- from: Kí Olúwa sì mú kí ẹ pọ̀ sí i, kí ẹ sì kún àkúnwọ́sílẹ̀ nínú ìfẹ́ sí ara yín àti sí gbogbo ènìyàn[a], gẹ́gẹ́ bí àwa náà ti ní ìfẹ́ sí yín[b].
  to: Kí Olúwa sì mú kí ìfẹ́ yín sí ara yín àti sí gbogbo ènìyàn[a] pọ̀ sí i, kí ó sì túbọ̀ pọ̀, gẹ́gẹ́ bí ìfẹ́ àwa náà sí yín[b].
  rationale: Àtúnṣe náà rọ́pò ìlò tí kò wọ́pọ̀ “kún àkúnwọ́sílẹ̀” pẹ̀lú “túbọ̀ pọ̀,” èyí tí ó jẹ́ Yorùbá àdánidá fún ìfẹ́ tí ó pọ̀ ré kọjá ìwọ̀n. Ó tún mú kí ìfẹ́, tí dative τῇ ἀγάπῃ ń ṣàpèjúwe, hàn ní kedere gẹ́gẹ́ bí ohun tí ń pọ̀ sí i. Ìfẹ́-àdúrà, ìfarakanra sí ara wọn àti sí gbogbo ènìyàn, àti ellipsis inú gbolohun ìkẹyìn ni a pa mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:21:29Z'
