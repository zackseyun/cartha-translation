  source_fidelity: Ìtumọ̀ náà gba ìṣọ̀kan ète εἰς τὸ στηρίξαι, ‘ọkàn,’ ìwà mímọ́, àti àìdánilójú ‘àwọn ẹni mímọ́ rẹ̀’ dáadáa. Ṣùgbọ́n ‘láìlẹ́gàn’ túmọ̀ sí àìfi ẹnì kan ṣẹ̀sín/tabi àìkẹ́gàn, kì í ṣe ἀμέμπτους (‘láìní ẹ̀sùn,’ ‘aláìlábùkù’).
