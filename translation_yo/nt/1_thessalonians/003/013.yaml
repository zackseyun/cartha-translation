id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: yo
  text: kí ó lè mú ọkàn yín dúró ṣinṣin, láìní ẹ̀sùn nínú ìwà mímọ́ níwájú Ọlọ́run àti Baba wa, nígbà tí Olúwa wa Jésù bá dé pẹ̀lú gbogbo àwọn ẹni mímọ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú gbogbo àwọn mímọ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ènìyàn mímọ́, àwọn áńgẹ́lì, tàbí àwọn méjèèjì nínú àyíká ọ̀rọ̀ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: kí ó lè mú ... dúró ṣinṣin
  rationale: Àkópọ̀ ọ̀rọ̀ yìí ń fi ète tàbí àbájáde ohun tí ó wà ní ẹsẹ ṣáájú hàn; gbólóhùn aláìlẹ́gbẹ́ ‘kí ó lè’ jẹ́ àdánidá ní Yorùbá.
- source_word: τὰς καρδίας
  choice: ọkàn yín
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún inú ènìyàn lápapọ̀, kì í ṣe ìmọ̀lára nìkan.
- source_word: ἀμέμπτους
  choice: láìlẹ́gàn
  rationale: Ó pa ìtumọ̀ jíjẹ́ ẹni tí ẹ̀sùn tó lẹ́sẹ̀ nílẹ̀ kò lè kàn mọ́, ní èdè tí ó rọrùn láti lóye.
- source_word: ἐν ἁγιωσύνῃ
  choice: nínú ìwà mímọ́
  rationale: Ó sọ ànímọ́ tàbí ipò mímọ́ jáde ní Yorùbá àdánidá.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: níwájú Ọlọ́run àti Baba wa
  rationale: Ó pa ìtumọ̀ dídúró ní ojú Ọlọ́run àti ìṣọ̀kan akọ́lé ‘Ọlọ́run àti Baba wa’ mọ́.
- source_word: ἐν τῇ παρουσίᾳ
  choice: nígbà wíwá
  rationale: Nínú àyíká ọ̀rọ̀ ọjọ́ ìkẹyìn, παρουσία ń tọ́ka sí wíwá tàbí dé Olúwa; ‘nígbà wíwá’ ṣe kedere láìsọ ohun tí orísun kò sọ.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Olúwa wa Jésù
  rationale: Ó tẹ̀lé akọ́lé Kristi ‘Olúwa’ àti ìkọ̀wé orúkọ Jésù tí ó wọ́pọ̀ ní Yorùbá.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: pẹ̀lú gbogbo àwọn ẹni mímọ́ rẹ̀
  rationale: ‘Àwọn ẹni mímọ́’ pa ààyè ìtumọ̀ Gíríìkì mọ́, bóyá ènìyàn mímọ́, áńgẹ́lì, tàbí àwọn méjèèjì ni.
theological_decisions:
- issue: Àwọn tí ‘gbogbo àwọn ẹni mímọ́ rẹ̀’ ń tọ́ka sí
  choice: A kò fi hàn pé ènìyàn tàbí áńgẹ́lì nìkan ni; a lò ‘àwọn ẹni mímọ́.’
  alternative: gbogbo àwọn ènìyàn mímọ́ rẹ̀; gbogbo àwọn áńgẹ́lì rẹ̀
  rationale: ἁγίων lè tọ́ka sí àwọn ènìyàn mímọ́, àwọn áńgẹ́lì, tàbí àwọn méjèèjì nínú àyíká ọ̀rọ̀ yìí. Ìtumọ̀ náà kò gbọ́dọ̀ yanju ohun tí ẹsẹ náà fi sílẹ̀ ní àìdánilójú.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. ‘Dúró ṣinṣin’ mú àwòrán ìdúróṣinṣin inú ẹni jáde, ‘láìlẹ́gàn’ sì jẹ́ ọ̀rọ̀ ìwà rere tí ó mọ́gbọ́n dání.
