id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: yo
  text: Nítorí èyí, ẹ̀yin ará[b], nípa yín, nínú gbogbo wàhálà àti ìpọ́njú wa, a rí ìtùnú gbà nípasẹ̀ ìgbàgbọ́ yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdúróṣinṣin yín nínú ìgbàgbọ́.” Ọ̀rọ̀ Gíríìkì pistis lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìdúróṣinṣin; níbí ó ṣeé ṣe kí ó tún tọ́ka sí bí àwọn ará Tẹsalóníkà ṣe ń bá a lọ nínú ìgbàgbọ́ láìyẹsẹ̀.
    reason: alternative_reading
  - marker: b
    text: “Ẹ̀yin ará” ni ọ̀nà tí Pọ́ọ̀lù sábà máa ń fi pe àwọn ìjọ; ó lè kàn sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó so ẹsẹ yìí mọ́ ìròyìn tí a ṣẹ̀ṣẹ̀ sọ ṣáájú, ó sì pa ìtumọ̀ ìdí rẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: παρεκλήθημεν
  choice: a rí ìtùnú gbà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí ìtùnú àti ìfọkànbalẹ̀ tí ìròyìn Tímótì mú wá, kì í ṣe ìgbani-níyànjú tàbí ìkìlọ̀.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ará’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó ní iyì, fún pípè àwọn ọmọ ìjọ, ó sì lè yé gbogbo àwùjọ àwọn onígbàgbọ́.
- source_word: ἐφ’ ὑμῖν
  choice: nípa tiyín
  rationale: Ó fi hàn pé àwọn ará Tẹsalóníkà ni ohun tí ìtùnú náà dá lé lórí, láìjẹ́ kí ó dà bí ẹni pé àwọn ni ó fa wàhálà náà.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: nínú gbogbo wàhálà àti ìpọ́njú wa
  rationale: Ó pa àwọn ọ̀rọ̀ orúkọ méjèèjì mọ́, ó sì fi ipò ìnira tí àwọn aposteli wà nínú rẹ̀ hàn ní Yorùbá tó ṣe kedere.
- source_word: ἀνάγκῃ
  choice: wàhálà
  rationale: Nínú àyíká ìjìyà yìí, ó túmọ̀ sí ipò líle tàbí ìnira, kì í ṣe ‘àìní’ lásán.
- source_word: θλίψει
  choice: ìpọ́njú
  rationale: Ó sọ ìnira tàbí ìnilára tó le koko jáde, ó sì ní ìwọ̀n ọ̀rọ̀ tó bá àyíká mu.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: nípasẹ̀ ìgbàgbọ́ yín
  rationale: ‘Nípasẹ̀’ pa ipa διά pẹ̀lú ẹ̀yà ọ̀rọ̀ genitive mọ́ gẹ́gẹ́ bí ohun èlò tàbí ọ̀nà tí ìtùnú fi dé; ‘ìgbàgbọ́’ sì jẹ́ ìtumọ̀ àkọ́kọ́ fún πίστις níbí.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Ó pa ìtumọ̀ pàtàkì ti πίστις mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń tọ́ka sí ìtumọ̀ ‘ìdúróṣinṣin’ tó tún ṣeé ṣe nínú àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ πίστις níbi tí ìdúróṣinṣin lè wà nínú ohun tí ọ̀rọ̀ náà ń tọ́ka sí
  choice: ìgbàgbọ́
  alternative: ìdúróṣinṣin nínú ìgbàgbọ́
  rationale: Ọ̀rọ̀ náà ní pàtàkì ń tọ́ka sí ìgbàgbọ́ àwọn ará Tẹsalóníkà, ṣùgbọ́n àyíká fi hàn pé ìgbàgbọ́ tí wọ́n ń bá a lọ láìyẹsẹ̀ tún wà nínú rẹ̀. A pa ‘ìgbàgbọ́’ mọ́ nínú ẹsẹ, a sì fi ìtumọ̀ mìíràn sínú àlàyé.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀yin ará’ gẹ́gẹ́ bí ìpè àwùjọ ìjọ; a tún pa ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì mọ́ dé ibi tó bá ìṣàn Yorùbá mu. Àmì ohùn ni a fi sí gbogbo ibi tó yẹ.
