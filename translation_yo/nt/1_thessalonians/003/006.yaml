id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: yo
  text: 'Ṣùgbọ́n nísinsìnyí, Tímótì ti dé sọ́dọ̀ wa láti ọ̀dọ̀ yín, ó sì ti mú ìròyìn rere nípa ìgbàgbọ́ àti ìfẹ́ yín[a] wá fún wa: pé ẹ ní ìrántí rere nípa wa nígbà gbogbo, ẹ sì ń fẹ́ gidigidi láti rí wa, gẹ́gẹ́ bí àwa náà ṣe ń fẹ́ láti rí yín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣòtítọ́ yín.” Ọ̀rọ̀ Gíríìkì náà, pistis, lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìṣòtítọ́; àkọọ́lẹ̀ pàtàkì lo “ìgbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Ṣùgbọ́n nísinsìnyí
  rationale: Ó fi ìyípadà onírẹ̀lẹ̀ hàn láti inú àníyàn Pọ́ọ̀lù sí ìtura tí ìròyìn Tímótì mú wá; “nísinsìnyí” tún tọ́ka sí dídé rẹ̀ láìpẹ́.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Tímótì ti dé sọ́dọ̀ wa láti ọ̀dọ̀ yín
  rationale: A tú ọ̀rọ̀ genitive absolute náà sí gbólóhùn Yorùbá àdánidá, nígbà tí “ti dé” pa ìtumọ̀ dídé láìpẹ́ mọ́.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: ó sì ti mú ìròyìn ayọ̀ ... wá fún wa
  rationale: Níhìn-ín, ọ̀rọ̀-ìṣe náà ń tọ́ka sí ìròyìn rere tí Tímótì mú, kì í ṣe ìwàásù ìhìnrere ní ìtumọ̀ àkànṣe.
- source_word: τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν
  choice: nípa ìgbàgbọ́ àti ìfẹ́ yín
  rationale: “Ìgbàgbọ́” ni àṣàyàn àkọ́kọ́ fún πίστις, “ìfẹ́” sì jẹ́ ìtumọ̀ àdánidá fún ἀγάπη; àṣàyàn “ìṣòtítọ́” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: ẹ máa ń rántí wa fún rere nígbà gbogbo
  rationale: Ó ṣàfihàn pé ìrántí tàbí èrò wọn nípa àwọn aposteli dára, ní Yorùbá tí ó ṣe kedere tí kò sì túmọ̀ jù.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: ẹ sì ń hára gàgà láti rí wa
  rationale: “Ń hára gàgà” mú ìfẹ́-ọkàn líle àti ìfẹ́ni inú ἐπιποθέω jáde ní èdè Yorùbá àdánidá.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: gẹ́gẹ́ bí àwa náà ṣe ń hára gàgà láti rí yín
  rationale: A tún ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ nítorí àfihàn padà, kí ìfiwéra alábàápín náà lè ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ πίστις níbi tí “ìgbàgbọ́” àti “ìṣòtítọ́” ti lè ṣeé ṣe
  choice: ìgbàgbọ́ yín
  alternative: ìṣòtítọ́ yín
  rationale: Ní àyíká yìí, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí ìgbẹ́kẹ̀lé wọn nínú Ọlọ́run àti ìhìnrere tí ó ń bá a lọ. Síbẹ̀, πίστις tún lè ní ìtumọ̀ dídúró ṣinṣin tàbí ìṣòtítọ́, nítorí náà a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀ dípò kí a yanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo ènìyàn. A pín gbólóhùn Gíríìkì gígùn náà sí gbólóhùn méjì fún ìṣàn Yorùbá tó ṣe kedere, láìsọ ìbáṣepọ̀ àwọn èrò inú rẹ̀ nù.
