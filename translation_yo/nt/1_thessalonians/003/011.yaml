id: 1TH.3.11
reference: 1 Thessalonians 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: yo
  text: Kí Ọlọ́run àti Baba wa tìkára rẹ̀[a], àti Olúwa wa Jésù[b], darí ọ̀nà wa sí ọ̀dọ̀ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nínú Gíríìkì, ọ̀rọ̀-ìṣe “darí” jẹ́ ọ̀rọ̀-ìṣe ẹyọ kan, bí ó tilẹ̀ jẹ́ pé “Ọlọ́run àti Baba wa” àti “Olúwa wa Jésù” ni a so pọ̀ gẹ́gẹ́ bí olùṣe rẹ̀.
    reason: cross_reference
  - marker: b
    text: Tàbí, “mú kí ọ̀nà wa tọ̀ sí ọ̀dọ̀ yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: fúnra rẹ̀
  rationale: Ó fi ìtẹnumọ́ sí Ọlọ́run gẹ́gẹ́ bí ẹni tí yóò fúnra rẹ̀ ṣe ohun tí àdúrà náà ń béèrè.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Níhìn-ín δέ ń samisi ìyípadà sí àdúrà-ìfẹ́, kì í ṣe ìtakora líle. Bí a ṣe bẹ̀rẹ̀ pẹ̀lú ‘Kí’ jẹ́ kí ìyípadà náà mọ́ ní Yorùbá láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: Ọlọ́run àti Baba wa
  rationale: Ìtumọ̀ yìí pa àwọn orúkọ méjèèjì mọ́ fún ẹni kan náà, ó sì tẹ̀ lé ìṣètò Gíríìkì ní ọ̀nà àdánidá.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: Olúwa wa Jésù
  rationale: Ó pa oyè κύριος, arọ́pò-orúkọ ìní ‘wa,’ àti orúkọ Jésù mọ́ láìfi ‘Kristi’ tí kò sí nínú ẹsẹ yìí kún un.
- source_word: κατευθύναι
  choice: mú kí ... tọ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí mímú ọ̀nà tọ̀ tàbí dídarí ẹni lọ. Ìlànà ‘Kí ... mú kí’ fi ìfẹ́ tàbí àdúrà tí optative Gíríìkì ń sọ hàn.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: ọ̀nà wa
  rationale: ‘Ọ̀nà wa’ lè tọ́ka sí ojú ọ̀nà gan-an tàbí sí ìrìn àjò wọn, nítorí náà ó pa ààyè ìtumọ̀ Gíríìkì mọ́.
- source_word: πρὸς ὑμᾶς
  choice: sí ọ̀dọ̀ yín
  rationale: Ó sọ ìtọ́sọ́nà ìrìn àjò sí ibi tí àwọn onígbàgbọ́ Tẹsalóníkà wà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ọ̀rọ̀-ìṣe ẹyọ kan pẹ̀lú àwọn olùṣe méjì tí a so pọ̀ (‘Ọlọ́run àti Baba wa’ àti ‘Olúwa wa Jésù’)
  choice: 'A sọ àwọn olùṣe méjèèjì ní kedere, a sì fi wọn jọ sábẹ́ àdúrà kan náà: ‘Kí ... mú kí....’'
  alternative: Kí a tún gbólóhùn náà ṣe lọ́nà tí yóò ya iṣẹ́ Ọlọ́run kúrò lọ́dọ̀ ti Jésù, tàbí kí a ka ọ̀rọ̀-ìṣe náà sí Ọlọ́run nìkan.
  rationale: Gíríìkì fi Baba àti Olúwa Jésù jọ gẹ́gẹ́ bí olùṣe ọ̀rọ̀-ìṣe ẹyọ kan. Yorùbá kì í fi ìyàtọ̀ ẹyọ-ọ̀pọ̀ hàn lórí ọ̀rọ̀-ìṣe yìí, ṣùgbọ́n ìṣètò náà ṣì pa àwọn méjèèjì mọ́ gẹ́gẹ́ bí olùṣe àdúrà kan náà, láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti àdúrà ọlọ́wọ̀ àti ọ̀wọ̀, ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. ‘Sí ọ̀dọ̀ yín’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìlọ sí ibi tí àwọn olùgbà wà.
