  source_fidelity: Ìtumọ̀ náà mú ìfẹ́-àdúrà optative náà, àwọn olùṣe méjèèjì, àti ìtọ́sọ́nà sí àwọn olùgbà mọ́. Síbẹ̀, “mú kí ọ̀nà wa tọ̀” kì í ṣe ọ̀nà Yorùbá tó rọrùn jù lọ láti sọ κατευθύναι τὴν ὁδὸν ἡμῶν; ó lè dà bí ṣíṣe ọ̀nà náà ‘dáradára’ dípò dídarí ọ̀nà ìrìn wọn. “Darí ọ̀nà wa sí ọ̀dọ̀ yín” jẹ́ ìtumọ̀ tó péye àti tó dára síi.
  naturalness: Àdúrà náà ní ìforúkọsílẹ̀ tó yẹ, ṣùgbọ́n a tún un ṣe díẹ̀ kí ìsọ̀rọ̀ náà lè jẹ́ Yorùbá òde òní tó mọ́. “Tìkára rẹ̀” jẹ́ ìfihàn ìtẹnumọ́ tí ó wúlò fún αὐτός ní àyíká yìí.
