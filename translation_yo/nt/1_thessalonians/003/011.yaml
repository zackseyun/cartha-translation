revisions:
- from: Kí Ọlọ́run àti Baba wa fúnra rẹ̀[a], àti Olúwa wa Jésù[b], mú kí ọ̀nà wa tọ̀ sí ọ̀dọ̀ yín.
  to: Kí Ọlọ́run àti Baba wa tìkára rẹ̀[a], àti Olúwa wa Jésù[b], darí ọ̀nà wa sí ọ̀dọ̀ yín.
  rationale: Àtúnṣe náà rọ́pò ìsọ̀rọ̀ tí kò rọrùn gan-an ní Yorùbá pẹ̀lú “darí ọ̀nà wa sí ọ̀dọ̀ yín,” èyí tí ó fara mọ́ κατευθύναι τὴν ὁδὸν ἡμῶν nínú àyíká ìrìn-àjò. Ó tún mú ẹsẹ̀-ìsàlẹ̀ a bá ìtumọ̀ tuntun mu, ó sì pa àṣàyàn ‘mú kí ọ̀nà ... tọ̀’ mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn. Ìṣètò àwọn olùṣe méjèèjì kò yí, nítorí náà ìfarahàn Gíríìkì ti àdúrà kan pẹ̀lú Ọlọ́run Baba àti Olúwa Jésù ṣì wà láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:21:28Z'
