id: 1TH.3.2
reference: 1 Thessalonians 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: yo
  text: A sì rán Tímótì[a], arákùnrin wa àti alábáṣiṣẹ́ Ọlọ́run nínú ìhìn rere Mèsáyà[b], láti fún yín lókun àti láti gba yín níyànjú nípa ìgbàgbọ́ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ẹni tí ń bá Ọlọ́run ṣiṣẹ́.” Àwọn àfọwọ́kọ kan àti àwọn ìtumọ̀ kan ní ọ̀rọ̀ tó yàtọ̀ níbí, bí “ìránṣẹ́ Ọlọ́run.”
    reason: alternative_reading
  - marker: b
    text: Gíríìkì ní “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí pé ìtumọ̀ oyè náà hàn gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: a rán
  rationale: Ọ̀rọ̀ náà jẹ́ aorist indicative, ó sì tọ́ka sí ìṣe tí ó ṣẹlẹ̀ nígbà àtijọ́; ‘a rán’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: Τιμόθεον
  choice: Tímótì
  rationale: A ṣe àfọwọ́kọ orúkọ náà ní ìbámu pẹ̀lú ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: ἀδελφὸν ἡμῶν
  choice: arákùnrin wa
  rationale: Èyí pa àwòrán ìdílé inú Gíríìkì mọ́, ó sì ṣe kedere pé ìbátan nínú àwùjọ àwọn onígbàgbọ́ ni.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: alábáṣiṣẹ́ Ọlọ́run
  rationale: Èyí dúró sún mọ́ ìtumọ̀ Gíríìkì, ó sì pa agbára àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ tí gbólóhùn náà lè ní mọ́ láìsọ ọ́ di ‘ìránṣẹ́ Ọlọ́run.’
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: nínú ìhìn rere Mèsáyà
  rationale: ‘Nínú’ fi ibi tàbí pápá iṣẹ́ hàn; àkójọpọ̀ ọ̀rọ̀ náà sì pa àìṣedéédé tó wà nínú genitive mọ́—ìhìn rere tí ó jẹ́ ti Mèsáyà tàbí tí ó jẹ́ nípa rẹ̀.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ní agbára oyè níbí; ‘Mèsáyà’ fi ìtumọ̀ oyè ẹni àmì-òróró hàn ju lílo ‘Kristi’ bí ẹni pé ó jẹ́ orúkọ lọ.
- source_word: εἰς τὸ στηρίξαι
  choice: láti fún yín lókun
  rationale: Articular infinitive náà sọ ète hàn; gbólóhùn Yorùbá yìí jẹ́ kedere, àdánidá, ó sì bá àyíká ìṣírí mu.
- source_word: παρακαλέσαι
  choice: láti gba yín níyànjú
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífúnni ní ìṣírí àti ìgboyà; yíyan yìí kò dín un kù sí ìtùnú nìkan tàbí àṣẹ líle.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: nípa ìgbàgbọ́ yín
  rationale: ὑπέρ pẹ̀lú genitive lè túmọ̀ sí ‘nípa’ tàbí ‘nítorí’; ‘nípa’ bá ìṣírí tó kan ìgbàgbọ́ wọn mu, láìti ọ̀rọ̀ náà sí ọ̀nà kan ṣoṣo.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú ẹsẹ yìí, ó kọ́kọ́ ń tọ́ka sí ìgbẹ́kẹ̀lé àti ìdúróṣinṣin wọn gẹ́gẹ́ bí onígbàgbọ́; ‘ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún πίστις.
theological_decisions:
- issue: Ìtumọ̀ συνεργὸν τοῦ θεοῦ
  choice: alábáṣiṣẹ́ Ọlọ́run
  alternative: ẹni tí ń bá Ọlọ́run ṣiṣẹ́; ìránṣẹ́ Ọlọ́run
  rationale: SBLGNT ní συνεργὸν τοῦ θεοῦ. A kò rọ̀ ọ́ sí ‘ìránṣẹ́ Ọlọ́run’ láti yẹra fún agbára ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ náà; àkọsílẹ̀ ìsàlẹ̀ sì jẹ́ kí onkáwe mọ àwọn ọ̀nà ìtumọ̀ àti ìyàtọ̀ àfọwọ́kọ.
- issue: Ìtumọ̀ Χριστοῦ nínú εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà ‘Mèsáyà’ fi ìtumọ̀ rẹ̀ hàn ní kedere; ‘Kristi’ wà nínú àkọsílẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀ mìíràn.
translation_notes:
  register: Yorùbá boṣewa oníyì pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà rọrùn fún onkáwe òde òní. ‘Alábáṣiṣẹ́ Ọlọ́run’ mọ ìtumọ̀ orísun àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ rẹ̀, ‘Mèsáyà’ sì mú agbára oyè Χριστός jáde.
