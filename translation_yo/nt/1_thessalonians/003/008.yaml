  text: ὅτι νῦν ζῶμεν ἐὰν ὑμεῖς στήκετε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/008.yaml
  text: For now we live[b][a], if you stand firm in the Lord.
translation:
  language: yo
  text: Nítorí[a] nísinsìnyí ni a wà láàyè[b], bí ẹ̀yin bá dúró ṣinṣin nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Nítorí pé nísinsìnyí ni a wà láàyè, bí ẹ̀yin bá dúró ṣinṣin nínú Olúwa.” Ọ̀rọ̀ ìbẹ̀rẹ̀ náà lè jẹ́ “nítorí,” “nítorí pé,” tàbí kí a má sọ ọ́ ní tààrà.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “a wà láàyè” jẹ́ ọ̀nà àsọyé láti fi ìtùnú tàbí agbára tuntun hàn, kì í ṣe wíwà láàyè nípa ti ara nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó mú ìtumọ̀ ìdí tàbí àlàyé ọ̀rọ̀ tó ṣáájú jáde lọ́nà àdánidá, láìfi dandan sọ ọ́ di ‘nítorí pé’.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó pa ìtọ́kasí sí àkókò ìsinsìnyí mọ́, bí ọ̀rọ̀ Gíríìkì ṣe tẹnu mọ́ ọn.
- source_word: ζῶμεν
  choice: a wà láàyè
  rationale: Ó pa àwòrán gangan náà mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ yìí ó lè túmọ̀ sí pé ìgboyà àti okun wọn tún sọ jí.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ipò àídájú hàn, láìyanjú rẹ̀ sí ìtumọ̀ míì.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: A pa arọ́pò-orúkọ tó hàn gbangba nínú Gíríìkì mọ́, ó sì mú kí àwọn ará Tẹsalóníkà wà ní àárín gbùngbùn gbólóhùn náà.
- source_word: στήκετε
  choice: dúró ṣinṣin
  rationale: Ó sọ ìfaradà àti ìdúróṣinṣin tó ń bá a lọ, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbólóhùn pàtàkì ti Paulu mọ́, tí ó ń tọ́ka sí ipò àti ìbáṣepọ̀ wọn pẹ̀lú Olúwa.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ‘a wà láàyè’
  choice: A pa ọ̀rọ̀ gangan náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìwúrí àti okun tuntun tó wá látinú ìdúróṣinṣin àwọn onígbàgbọ́.
  alternative: Kí a túmọ̀ rẹ̀ ní kíkún sí ‘a tún ní okun’ tàbí kí a ka a sí ìwàláàyè ara nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ‘a ń gbé/a wà láàyè,’ ṣùgbọ́n àyíká rẹ̀ ní agbára àsọyé. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ yìí mọ́ láìyanjú rẹ̀ jù.
- issue: Ìtumọ̀ ‘nínú Olúwa’
  choice: Ìdúróṣinṣin láàárín ìbáṣepọ̀ pẹ̀lú Olúwa, láìdín ọ̀rọ̀ náà kù sí ẹ̀kọ́ ìjọ kan pàtó.
  alternative: ní ìrẹ́pọ̀ pẹ̀lú Olúwa; jíjẹ́ olóòótọ́ sí Olúwa
  rationale: Gbólóhùn náà ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó jinlẹ̀, ṣùgbọ́n ó gbòòrò; ‘nínú Olúwa’ pa ìtẹnumọ́ àti àìṣedéédé rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. Àmì ohùn kún ibùdó tí ó yẹ; ‘ẹ̀yin’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ‘dúró ṣinṣin’ sì jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye nírọ̀rùn.
