  source_fidelity: Ìbẹ̀rẹ̀ ìtumọ̀ náà (“Nítorí nígbà tí àwa pàápàá…”) ń fi ìtẹnumọ́ kan sí “àwa” tí kò hàn ní kedere nínú καὶ γάρ. Pẹ̀lú èyí, “gẹ́gẹ́ bí a ti sọ” ṣàfikún ohun tí ọ̀rọ̀ Gíríìkì kò sọ ní ibẹ̀; καθὼς καὶ ἐγένετο ń tọ́ka tààrà sí bí ó ti ṣẹlẹ̀. Àtúnṣe náà pa imperfect προελέγομεν, ìfojúsọ́nà μέλλομεν, àti ìmọ̀ àwọn olùgbọ́ mọ́.
  naturalness: Àtúnṣe náà jẹ́ Yorùbá boṣewa tó rọrùn, ó sì yẹ fún ìforúkọsílẹ̀ Pọ́ọ̀lù. “A máa ń sọ tẹ́lẹ̀ fún yín” mú ìṣe àtúnlò imperfect hàn ní ti ẹ̀dá; “gẹ́gẹ́ bí ó ti ṣẹlẹ̀, gẹ́gẹ́ bí ẹ ti mọ̀” tú ìparí ẹsẹ̀ náà ní kedere láì fi “ẹ̀yin náà” sí ibi tí ó lè yí ìtumọ̀ ka.
  terminology: “Ìpọ́njú” dáa fún θλίβεσθαι ní ìtumọ̀ gbòòrò. A tún ṣe àtúnṣe àlàyé ẹsẹ̀ abẹ́lẹ̀ kí ó má ṣe lo “ìbànújẹ́,” èyí tí ó sábà ń tọ́ka sí ìmọ̀lára ìbànújẹ́ ju ìdààmú tàbí ìnira tí ọ̀rọ̀-ìṣe Gíríìkì náà sọ lọ.
