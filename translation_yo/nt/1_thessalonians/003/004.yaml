id: 1TH.3.4
reference: 1 Thessalonians 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: yo
  text: Nítorí, nígbà tí a wà pẹ̀lú yín, a máa ń sọ tẹ́lẹ̀ fún yín pé a yóò jìyà ìpọ́njú[a], gẹ́gẹ́ bí ó ti ṣẹlẹ̀, gẹ́gẹ́ bí ẹ ti mọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a yóò wà lábẹ́ ìpọ́njú” tàbí “a yóò jìyà wàhálà.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí rírí ìnira, ìdààmú, tàbí inúnibíni.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí ... pàápàá
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde, “pàápàá” sì pa ìtẹnumọ́ καί mọ́ ní Yorùbá àdánidá.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: nígbà tí àwa ... wà pẹ̀lú yín
  rationale: Ó túmọ̀ sí wíwà ní ọ̀dọ̀ wọn tàbí pẹ̀lú wọn; “wà pẹ̀lú yín” ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: προελέγομεν
  choice: a máa ń sọ fún yín ṣáájú
  rationale: “Máa ń” fi ìṣe tí wọ́n ń ṣe léraléra hàn gẹ́gẹ́ bí imperfect náà, “ṣáájú” sì pa ìtumọ̀ sísọ ohun tó ń bọ̀ mọ́ láì sọ ọ́ di ìkìlọ̀ ní pàtó.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: pé a ó jìyà ìpọ́njú
  rationale: “A ó” sọ ìfojúsọ́nà ohun tó ń bọ̀; “jìyà ìpọ́njú” gbé ìrírí ìnira, wàhálà, tàbí inúnibíni kalẹ̀ láì dín ọ̀rọ̀ náà sí ọ̀kan ṣoṣo.
- source_word: καθὼς καὶ ἐγένετο
  choice: Ó sì ṣẹlẹ̀ gan-an gẹ́gẹ́ bí a ti sọ
  rationale: “Gẹ́gẹ́ bí” fi ìbámu àsọtẹ́lẹ̀ àti ohun tó ṣẹlẹ̀ hàn; “gan-an” mú ìtẹnumọ́ καί jáde ní ọ̀nà tó rọrùn ní Yorùbá.
- source_word: καὶ οἴδατε
  choice: ẹ̀yin náà sì mọ̀ bẹ́ẹ̀
  rationale: “Bẹ́ẹ̀” tọ́ka sí ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, “náà” sì pa ìṣọ̀kan καί mọ́.
theological_decisions:
- issue: Irú ìjìyà tí θλίβεσθαι ń tọ́ka sí
  choice: ìpọ́njú ní ìtumọ̀ gbòòrò, tí ó lè ní inúnibíni nínú
  alternative: inúnibíni ní pàtó, tàbí ìpọ́njú gẹ́gẹ́ bí ọ̀rọ̀ ìkẹ́kọ̀ọ́ nípa òpin ayé
  rationale: Àyíká ọ̀rọ̀ náà ní àtakò àti ìnira nínú, ṣùgbọ́n θλίβεσθαι fúnra rẹ̀ kò fi dandan mú kí a dín ìtumọ̀ rẹ̀ sí inúnibíni nìkan tàbí sí ìpọ́njú òpin ayé.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún òǹkàwé òde òní. A lo “a máa ń” láti fi ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè dín ìtumọ̀ θλίβεσθαι kù.
