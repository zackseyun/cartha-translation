revisions:
- from: Nítorí nígbà tí àwa pàápàá wà pẹ̀lú yín, a máa ń sọ fún yín ṣáájú pé a ó jìyà ìpọ́njú[a]. Ó sì ṣẹlẹ̀ gan-an gẹ́gẹ́ bí a ti sọ, ẹ̀yin náà sì mọ̀ bẹ́ẹ̀.
  to: Nítorí, nígbà tí a wà pẹ̀lú yín, a máa ń sọ tẹ́lẹ̀ fún yín pé a yóò jìyà ìpọ́njú[a], gẹ́gẹ́ bí ó ti ṣẹlẹ̀, gẹ́gẹ́ bí ẹ ti mọ̀.
  rationale: A yọ ìtẹnumọ́ kókó-ọrọ tí kò dájú kúrò, a sì tú καθὼς καὶ ἐγένετο àti καὶ οἴδατε ní ọ̀nà tó sún mọ́ Gíríìkì náà, tó sì jẹ́ Yorùbá àdánidá. Ẹsẹ̀ abẹ́lẹ̀ náà tún ti jẹ́ kó ṣe kedere pé θλίβεσθαι kì í ṣe ìbànújẹ́ nìkan.
