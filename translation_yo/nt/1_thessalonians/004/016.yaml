id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: yo
  text: Nítorí Olúwa fúnra rẹ̀ yóò sọ̀kalẹ̀ láti ọ̀run pẹ̀lú àṣẹ[a], pẹ̀lú ohùn olórí áńgẹ́lì, àti pẹ̀lú kàkàkí Ọlọ́run; àwọn òkú nínú Mèsáyà yóò sì kọ́kọ́ dìde[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú igbe ìpàṣẹ.” Ọ̀rọ̀ Gíríìkì κέλευσμα lè tọ́ka sí ìpè tàbí igbe tí a fi ń pàṣẹ.
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ ìbílẹ̀: “àwọn òkú nínú Kristi yóò kọ́kọ́ dìde.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ àsopọ̀ náà ń ṣàlàyé ìdí fún ìtùnú tí ẹsẹ tó ṣáájú sọ; “Nítorí” mú ipa ìṣàlàyé yẹn jáde lọ́nà àdánidá.
- source_word: αὐτὸς ὁ κύριος
  choice: Olúwa fúnra rẹ̀
  rationale: “Fúnra rẹ̀” pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ αὐτός mọ́, nígbà tí “Olúwa” jẹ́ ìtumọ̀ àdánidá fún κύριος nínú àyíká yìí.
- source_word: ἐν κελεύσματι
  choice: pẹ̀lú àṣẹ
  rationale: κέλευσμα lè túmọ̀ sí àṣẹ tàbí igbe ìpàṣẹ. “Pẹ̀lú àṣẹ” ṣe kúkúrú, ó sì jẹ́ olóòtítọ́ sí orísun; a fi ìtumọ̀ tó túbọ̀ ṣe kedere sí àlàyé ìsàlẹ̀.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: pẹ̀lú ohùn olórí áńgẹ́lì
  rationale: “Ohùn” túmọ̀ φωνή, “olórí áńgẹ́lì” sì sọ iṣẹ́ ἀρχάγγελος ní Yorùbá tó ṣe kedere láìfi ọ̀rọ̀ atúmọ̀ ju ti orísun lọ.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: pẹ̀lú ìpè Ọlọ́run
  rationale: “Ìpè” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ohun èlò ìfọn σάλπιγξ; ìsopọ̀ pẹ̀lú “Ọlọ́run” pa genitive θεοῦ mọ́.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: yóò sọ̀kalẹ̀ láti ọ̀run
  rationale: Ìtumọ̀ yìí pa ìṣípò láti òkè wá sí ìsàlẹ̀ àti ibi tí ó ti bẹ̀rẹ̀ mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: οἱ νεκροὶ
  choice: àwọn òkú
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tí wọ́n ti kú; “àwọn òkú” ni ìsọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; “Mèsáyà” mú ìtumọ̀ oyè náà hàn, nígbà tí a pa “nínú Kristi” mọ́ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: ἀναστήσονται
  choice: yóò dìde
  rationale: Ọ̀rọ̀-ìṣe náà tọ́ka sí àjíǹde sweetsọ́dọ̀ àwọn òkú; “dìde” jẹ́ ìtumọ̀ tààrà, àdánidá, tí kò fi ìtumọ̀ passive kún fọ́ọ̀mù Gíríìkì.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: “Kọ́kọ́” fi ìtẹ̀lé ìṣẹ̀lẹ̀ hàn ní ìbámu pẹ̀lú àwọn onígbàgbọ́ alààyè tí ẹsẹ tó tẹ̀ lé mẹ́nu kàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστῷ nínú ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nínú Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè níbí, kì í ṣe orúkọ lásán; “Mèsáyà” mú ìtumọ̀ ẹni àmì òróró hàn. Nítorí “nínú Kristi” ti wọ́pọ̀ gan-an nínú èdè Kristẹni Yorùbá, a fi í sí àlàyé ìsàlẹ̀ láìjẹ́ kí ó rọ́pò ìtumọ̀ oyè nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìtẹnumọ́ “fúnra rẹ̀,” ìlànà mẹ́ta tí “pẹ̀lú” dá pọ̀, àti ìtẹ̀lé ìṣẹ̀lẹ̀ nínú “kọ́kọ́” ni a pa mọ́.
