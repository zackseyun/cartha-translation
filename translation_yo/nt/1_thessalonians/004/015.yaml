  to: 'Nítorí èyí ni a fi ń sọ fún yín nípasẹ̀ ọ̀rọ̀ kan láti ọ̀dọ̀ Olúwa[a] pé: àwa tí a wà láàyè, tí a sì ṣẹ́kù títí di dídé Olúwa[b], a kò ní ṣáájú àwọn tí wọ́n ti sùn[c] rárá.'
