id: 1TH.4.15
reference: 1 Thessalonians 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: yo
  text: 'Nítorí èyí ni a fi ń sọ fún yín nípasẹ̀ ọ̀rọ̀ kan láti ọ̀dọ̀ Olúwa[a] pé: àwa tí a wà láàyè, tí a sì ṣẹ́kù títí di dídé Olúwa[b], a kò ní ṣáájú àwọn tí wọ́n ti sùn[c] rárá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ọ̀rọ̀ Olúwa.” Gíríìkì lè tọ́ka sí ọ̀rọ̀ kan láti ọ̀dọ̀ Olúwa Jésù, tàbí sí ìṣípayá tí a fún nípasẹ̀ àṣẹ Olúwa.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “wíwà” tàbí “dídé” Olúwa; ọ̀rọ̀ Gíríìkì náà ni παρουσία.
    reason: lexical_alternative
  - marker: c
    text: “Àwọn tí wọ́n ti sùn” jẹ́ àkàwé fún àwọn onígbàgbọ́ tí wọ́n ti kú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: fi ọ̀rọ̀ Olúwa sọ
  rationale: Èyí fi ọ̀rọ̀ Olúwa hàn gẹ́gẹ́ bí ìpìlẹ̀ tàbí àṣẹ fún ohun tí Pọ́ọ̀lù sọ, láì pinnu bóyá ọ̀rọ̀ tí Jésù sọ nígbà ayé rẹ̀ ni tàbí ìṣípayá tí a fi àṣẹ Olúwa fún un.
- source_word: παρουσίαν
  choice: ìpadàbọ̀
  rationale: Nínú àyíká ọ̀rọ̀ ọjọ́ ìkẹyìn yìí, παρουσία ń tọ́ka sí dídé Olúwa ní ọjọ́ iwájú. “Ìpadàbọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún dídé ẹni tí a ń retí, bí ó tilẹ̀ jẹ́ pé “wíwàníhìn-ín” tàbí “dídé” lè fi apá mìíràn ti ìtumọ̀ Gíríìkì hàn.
- source_word: οἱ ζῶντες
  choice: àwa tí ó wà láàyè
  rationale: Ó túmọ̀ participle àsìkò ìsinsìnyí ní ọ̀nà Yorùbá tí ó ṣe kedere, tí kò sì fi ìtumọ̀ míì kún un.
- source_word: οἱ περιλειπόμενοι
  choice: tí a sì ṣẹ́ kù
  rationale: Ó tọ́ka sí àwọn tí wọ́n ṣì wà títí di àkókò tí a dárúkọ, láì sọ pé wọ́n la ewu kan já.
- source_word: οὐ μὴ φθάσωμεν
  choice: kì yóò ṣáájú ... rárá
  rationale: Àkójọpọ̀ οὐ μή ń fi ìkọ̀ tí ó lágbára hàn, φθάνω sì túmọ̀ sí ṣíṣe ohun kan ṣáájú ẹlòmíràn nínú àyíká yìí.
- source_word: τοὺς κοιμηθέντας
  choice: àwọn tí ó ti sùn
  rationale: Ó pa àkàwé oorun mọ́ fún àwọn onígbàgbọ́ tí wọ́n ti kú, dípò kí a sọ àkàwé náà di “àwọn òkú” lásán.
- source_word: κύριος / κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó yẹ fún κύριος; nínú ẹsẹ yìí ó ń tọ́ka sí Jésù.
theological_decisions:
- issue: Irú ọ̀nà tí “ọ̀rọ̀ Olúwa” gbà dé ọ̀dọ̀ Pọ́ọ̀lù
  choice: A ṣe ìtumọ̀ rẹ̀ láti fi àṣẹ ọ̀rọ̀ náà hàn, ṣùgbọ́n a kò pinnu bóyá ọ̀rọ̀ Jésù tí a ti mọ̀ tẹ́lẹ̀ ni tàbí ìṣípayá tí Pọ́ọ̀lù rí.
  alternative: Kí a sọ ọ́ ní pàtó gẹ́gẹ́ bí ọ̀rọ̀ tí Jésù sọ nígbà ayé rẹ̀, tàbí gẹ́gẹ́ bí àsọtẹ́lẹ̀ tuntun fún Pọ́ọ̀lù.
  rationale: ἐν λόγῳ κυρίου fi àṣẹ Olúwa múlẹ̀, ṣùgbọ́n kò ṣàlàyé ọ̀nà pàtó tí ọ̀rọ̀ náà fi dé.
- issue: Ìtumọ̀ κοιμηθέντας
  choice: A pa àkàwé “sùn” mọ́ fún àwọn onígbàgbọ́ tí wọ́n ti kú.
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà sí “àwọn tí wọ́n ti kú.”
  rationale: Àkàwé náà jẹ́ ara ọ̀rọ̀ Pọ́ọ̀lù, ó sì gbé ìrètí àjíǹde dání láì sẹ́ pé ikú ti ara ṣẹlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìtẹ̀sí gbolóhùn náà tẹ̀ lé èrò Gíríìkì ṣùgbọ́n ó jẹ́ àdánidá ní Yorùbá. Àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
