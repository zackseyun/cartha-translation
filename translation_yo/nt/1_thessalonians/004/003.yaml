  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: yo
  text: 'Nítorí èyí ni ìfẹ́ Ọlọ́run: ìsọdimímọ́ yín[a]—pé kí ẹ yàgò fún ìwà ìbálòpọ̀ tí kò bófin mu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwà mímọ́ yín.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì porneia; ọ̀rọ̀ tó gbòòrò fún ìwà ìbálòpọ̀ tí kò bófin mu. Ní ìtumọ̀ àtijọ́, “àgbèrè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: ìfẹ́
  rationale: “Ìfẹ́ Ọlọ́run” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ohun tí Ọlọ́run fẹ́ àti tí ó pa láṣẹ; kò sọ ọ́ di ìfẹ́-ọkàn aláìlágbára tàbí ète tí kò lè yí padà.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: ìsọdimímọ́ yín
  rationale: Ó mú ìtumọ̀ yíya ẹni sọ́tọ̀ fún Ọlọ́run àti gbígbé ìgbésí ayé mímọ́ pọ̀; kò fi ọ̀rọ̀ náà mọ́ ipò nìkan tàbí ìlànà ìdàgbàsókè nìkan.
- source_word: ἀπέχεσθαι
  choice: pé kí ẹ yàgò fún
  rationale: Gbólóhùn yìí ṣàlàyé ohun tí ìsọdimímọ́ náà ní nínú, ó sì jẹ́ Yorùbá tí ó ṣe kedere, tó bá agbára ọ̀rọ̀ àìlópin Gíríìkì mu.
- source_word: πορνείας
  choice: ìṣekúṣe nípa ìbálòpọ̀
  rationale: Yíyan yìí jẹ́ kí ọ̀rọ̀ náà gbòòrò dé gbogbo ìwà ìbálòpọ̀ tí kò bófin mu, dípò kí a dín in kù sí panṣágà tàbí ìbálòpọ̀ àwọn tí kò tíì ṣègbéyàwó nìkan.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ ìdí mọ́ láàárín ẹsẹ̀ yìí àti ìgbaninímọ̀ràn tó ṣáájú.
theological_decisions:
- issue: Ìtumọ̀ ἁγιασμός nínú ìgbaninímọ̀ràn nípa ìwà
  choice: “Ìsọdimímọ́” pẹ̀lú àlàyé ìwà rẹ̀ nínú gbólóhùn tó tẹ̀ lé e.
  alternative: “Ìwà mímọ́” láti tẹnumọ́ ipò tàbí àbájáde.
  rationale: Ọ̀rọ̀ náà kan ìyàsímímọ́ fún Ọlọ́run àti ìgbésí ayé tó bá a mu. Ìtumọ̀ yìí kò fi ipa mú un láti túmọ̀ sí ipò nìkan tàbí ìlànà nìkan.
- issue: Ìwọ̀n ìtumọ̀ πορνεία
  choice: “Ìṣekúṣe nípa ìbálòpọ̀,” gẹ́gẹ́ bí ọ̀rọ̀ tó gbòòrò.
  alternative: “Àgbèrè” tàbí “panṣágà.”
  rationale: πορνεία gbòòrò ju ẹ̀ka ìwà ìbálòpọ̀ kan ṣoṣo lọ; yíyan náà kò fi ìtumọ̀ ẹ̀kọ́ ìsìn tàbí àṣà tó dín kù wọ ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá ìṣàkóso tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtẹ̀sí ìṣàlàyé inú ọ̀rọ̀ Gíríìkì mọ́ pẹ̀lú àmì gígùn.
