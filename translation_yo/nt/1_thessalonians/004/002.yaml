  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: yo
  text: Nítorí ẹ mọ àwọn ìtọ́ni wo ni àwa fi fún yín nípasẹ̀ Olúwa Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa àṣẹ Olúwa Jésù.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδατε
  choice: ẹ mọ
  rationale: Ọ̀rọ̀ οἶδα ní ìtumọ̀ ìsinsìnyí nínú Gíríìkì Koiné; “ẹ mọ” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá, ó sì fi hàn pé ẹni púpọ̀ ni a ń bá sọ̀rọ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé rẹ̀.
- source_word: τίνας παραγγελίας
  choice: irú àwọn ìtọ́ni tí
  rationale: τίνας jẹ́ ọ̀rọ̀ ọ̀pọ̀ tó bá παραγγελίας mu; “irú àwọn ìtọ́ni tí” jẹ́ Yorùbá àdánidá tó ń tọ́ka sí àwọn ìtọ́ni pàtó tí àwọn olùgbọ́ ti mọ̀.
- source_word: παραγγελίας
  choice: àwọn ìtọ́ni
  rationale: παραγγελία lè túmọ̀ sí ìtọ́ni tàbí àṣẹ aláṣẹ. “Àwọn ìtọ́ni” ṣe kedere fún òǹkàwé òde òní láìsọ agbára ọ̀rọ̀ náà nù patapata.
- source_word: ἐδώκαμεν ὑμῖν
  choice: tí àwa fún yín
  rationale: “Fún yín” tú δίδωμι àti ohun tí ὑμῖν ń ṣe jáde ní Yorùbá àdánidá; “àwa” mú ẹni tí ó ṣe iṣẹ́ náà hàn kedere.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: nípasẹ̀ Olúwa Jésù
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive sábà ń tọ́ka sí ọ̀nà tàbí aṣojú. “Nípasẹ̀” pa àìdánilójú tó wà láàárín ìlàjà àti ọlá-àṣẹ mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος nínú àkọlé Kristẹni yìí.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A lo ìkọ̀wé orúkọ Jésù tí ó wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: Agbára ìtumọ̀ διὰ τοῦ κυρίου Ἰησοῦ
  choice: nípasẹ̀ Olúwa Jésù
  alternative: nípa àṣẹ Olúwa Jésù
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí Jésù gẹ́gẹ́ bí ọ̀nà tàbí aṣojú tí a fi fún wọn ní ìtọ́ni, ó sì tún lè ní èrò ọlá-àṣẹ rẹ̀. Ọ̀rọ̀ inú ẹsẹ pa ìtumọ̀ gbòòrò náà mọ́; àlàyé ìsàlẹ̀ fi ọ̀nà kejì hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní èdè òde òní tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ẹ/yín” fún ẹni púpọ̀, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ fún ẹnì kan ṣoṣo.
