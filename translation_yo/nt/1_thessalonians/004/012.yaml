id: 1TH.4.12
reference: 1 Thessalonians 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: yo
  text: kí ẹ lè máa hùwà ní ọ̀nà tí ó yẹ níwájú àwọn tí ó wà ní òde, kí ẹ má sì ṣe aláìní ohunkóhun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ má sì nílò ẹnikẹ́ni.” Ó ṣeé ṣe kí gbólóhùn náà tẹnu mọ́ pé kí wọn má ṣe gbára lé àwọn ẹlòmíràn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: Ó fi ète tàbí àbájáde ìṣírí tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: περιπατῆτε
  choice: máa hùwà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘rìn’ ní tààrà, ṣùgbọ́n níbí ó jẹ́ àkàwé fún bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀. ‘Máa hùwà’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: εὐσχημόνως
  choice: lọ́nà tí ó yẹ
  rationale: Ó túmọ̀ sí hùwà lọ́nà yíyẹ, tó bójú mu, tí àwọn ẹlòmíràn sì lè bọ̀wọ̀ fún; yíyan yìí kò fi ìtumọ̀ ìwà rere tí ó lágbára ju ti Gíríìkì lọ kún un.
- source_word: πρὸς τοὺς ἔξω
  choice: níwájú àwọn tí ó wà níta
  rationale: Ó pa apá ìhùwàsí ní gbangba mọ́, ó sì ń tọ́ka sí ìbáṣepọ̀ pẹ̀lú àwọn tí kò sí nínú àwùjọ àwọn onígbàgbọ́ láìfi orúkọ ẹ̀kọ́ ìsìn míràn lé wọn lórí.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: kí ẹ má sì ṣe aláìní ohunkóhun
  rationale: Fúnra rẹ̀, gbólóhùn Gíríìkì náà túmọ̀ sí pé kí wọn má ṣe ṣe aláìní ohunkóhun. Ó tún lè tẹnu mọ́ àìgbẹ́kẹ̀lé àwọn ẹlòmíràn fún ohun èlò ìgbésí ayé; àṣàyàn yẹn wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ìparí μηδενὸς χρείαν ἔχητε
  choice: 'àìní ohun kankan: “kí ẹ má sì ṣe aláìní ohunkóhun”'
  alternative: 'àìgbẹ́kẹ̀lé ẹnikẹ́ni: “kí ẹ má sì nílò ẹnikẹ́ni”'
  rationale: Ní ìbámu pẹ̀lú ọ̀rọ̀ tó ṣáájú nípa ṣíṣe iṣẹ́ pẹ̀lú ọwọ́, àyíká ọ̀rọ̀ náà lè tẹnu mọ́ kí wọn má ṣe gbára lé àwọn ẹlòmíràn láìnídìí. Síbẹ̀, gírámà Gíríìkì náà rọrùn sí ‘ohunkóhun’ ju ‘ẹnikẹ́ni’ lọ, nítorí náà a fi àṣàyàn kejì sínú àlàyé ìsàlẹ̀ láti pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo ‘máa hùwà’ dípò títẹ̀lé àkàwé ‘rìn’ ní tààrà, nítorí pé ó mú ìtumọ̀ Páùlù yé òǹkàwé Yorùbá kedere. ‘Àwọn tí ó wà níta’ pa ọ̀nà ìsọ̀rọ̀ àkọ́kọ́ mọ́ láìtumọ̀ rẹ̀ sí àmì ẹ̀kọ́ ìsìn tó lágbára jù.
