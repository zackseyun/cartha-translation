id: 1TH.4.13
reference: 1 Thessalonians 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: yo
  text: Ṣùgbọ́n, ará[b], a kò fẹ́ kí ẹ má mọ̀ nípa àwọn tí wọ́n ti sùn[a], kí ẹ má bàa ṣọ̀fọ̀ bí àwọn yòókù tí wọ́n kò ní ìrètí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Níhìn-ín, ‘àwọn tí wọ́n ti sùn’ jẹ́ àkàwé tí Páùlù lò fún àwọn tí ó ti kú. A tún lè túmọ̀ ọ́ sí ‘àwọn tí wọ́n ń sùn.’
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí ‘ará’ jẹ́ akọ ní ìlànà gírámà, ṣùgbọ́n ó ṣeé ṣe kó ń bá gbogbo ìjọ—àwọn ọkùnrin àti obìnrin—sọ̀rọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν
  choice: Ṣùgbọ́n, ... a kò fẹ́ kí ẹ má mọ̀
  rationale: ‘Ṣùgbọ́n’ fi ìyípadà ọ̀rọ̀ tí δέ ń ṣe hàn láìmú ìtakora le ju bó ṣe yẹ lọ. ‘A kò fẹ́ kí ẹ má mọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá fún àìní ìmọ̀ tí ἀγνοεῖν túmọ̀ sí, láìní ìtumọ̀ ẹ̀gàn.
- source_word: ἀδελφοί
  choice: ará
  rationale: Nínú Yorùbá, ‘ará’ jẹ́ ọ̀rọ̀ ìpè àdánidá fún àwọn ọmọ ìjọ, ó sì lè kan ọkùnrin àti obìnrin gẹ́gẹ́ bí ἀδελφοί ṣe rí nínú lílo Páùlù.
- source_word: περὶ τῶν κοιμωμένων
  choice: nípa àwọn tí wọ́n ti sùn lọ
  rationale: Èyí pa àkàwé ‘sùn’ mọ́ fún àwọn tí wọ́n ti kú; ‘lọ’ mú kí ọ̀rọ̀ náà yé ẹni Yorùbá gẹ́gẹ́ bí ọ̀rọ̀ ìrẹ̀lẹ̀ nípa ikú.
- source_word: ἵνα μὴ λυπῆσθε
  choice: kí ẹ má bàa máa ṣọ̀fọ̀
  rationale: ‘Kí ẹ má bàa’ fi ète ἵνα hàn, ‘máa ṣọ̀fọ̀’ sì tọ́ka sí ìbànújẹ́ ikú láìsọ pé gbogbo ìbànújẹ́ jẹ́ èèwọ̀.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: bí àwọn yòókù
  rationale: Ó fi ìfiwéra náà hàn ní ṣókí, ó sì tọ́ka sí àwọn tí wọ́n wà lẹ́yìn àwùjọ àwọn onígbàgbọ́ nínú àyíká ọ̀rọ̀.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: tí wọn kò ní ìrètí
  rationale: Ìtumọ̀ tààrà, àdánidá, tó sì pa ìtakora nípa ìrètí ọjọ́ iwájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ κοιμωμένων nínú ọ̀rọ̀ nípa àjíǹde
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘àwọn tí wọ́n ti sùn lọ.’
  alternative: àwọn tí wọ́n ti kú
  rationale: Páùlù mọ̀ọ́mọ̀ lo àkàwé oorun nípa àwọn onígbàgbọ́ tó ti kú, ní àyíká ìrètí àjíǹde. Pípamọ́ àkàwé náà kò jẹ́ ká túmọ̀ rẹ̀ rékọjá.
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: Lo ‘ará’ gẹ́gẹ́ bí ọ̀rọ̀ ìpè fún gbogbo ìjọ.
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ìlànà gírámà, nínú àyíká yìí ó ṣeé ṣe kó ń bá gbogbo ìjọ sọ̀rọ̀. ‘Ará’ jẹ́ ọ̀rọ̀ Yorùbá ọlọ́lá tí kò fi ìtumọ̀ àwùjọ náà rú.
- issue: Ohun tí ‘kí ẹ má bàa máa ṣọ̀fọ̀’ túmọ̀ sí
  choice: Ìkìlọ̀ náà dojú kọ irú ọ̀fọ̀ àwọn tí kò ní ìrètí, kì í ṣe gbogbo ìbànújẹ́.
  alternative: Àṣẹ pé kí onígbàgbọ́ má ṣọ̀fọ̀ rárá
  rationale: Gbólóhùn ìfiwéra ‘bí àwọn yòókù’ ló sọ irú ọ̀fọ̀ tí Páùlù ń yà sọ́tọ̀; kò yẹ ká sọ ọ́ di ìfòfindè gbogbo ìbànújẹ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, kì í ṣe gẹ́gẹ́ bí àmì ọ̀wọ̀ fún ẹnì kan. Àmì ohùn kún ibi tí ó jẹ́ àdánidá; àkàwé oorun àti ìfarakanra ọ̀rọ̀ pásítọ́rà ni a pa mọ́.
