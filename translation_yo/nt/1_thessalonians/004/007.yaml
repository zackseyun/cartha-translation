id: 1TH.4.7
reference: 1 Thessalonians 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: yo
  text: Nítorí Ọlọ́run kò pè wá fún ìwà àìmọ́[a], ṣùgbọ́n nínú ìwà mímọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà èérí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí èérí nípa ìwà, pàápàá jù lọ èérí nípa ìbálòpọ̀ nínú àyíká ẹsẹ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìsọdimímọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ipò jíjẹ́ mímọ́ tàbí sí ìlànà tí a fi ń sọ ẹni di mímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ọ̀rọ̀ yìí fi ẹsẹ̀ náà hàn gẹ́gẹ́ bí ìdí fún ìkìlọ̀ tó ṣáájú rẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn ní Yorùbá.
- source_word: ἐκάλεσεν
  choice: pè
  rationale: Àkókò aorist náà tọ́ka sí ìṣe Ọlọ́run gẹ́gẹ́ bí ohun tó ṣẹlẹ̀; “pè” pa ìtumọ̀ ìpè Ọlọ́run mọ́ láìfi ẹ̀kọ́ ìsìn kan pàtó kún un.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: láti máa gbé nínú ìwà àìmọ́
  rationale: Gbólóhùn Yorùbá yìí sọ ète tàbí irú ìgbésí ayé tí ìpè náà ń darí sí ní ọ̀nà tó ṣe kedere. Ó pa ìtumọ̀ ìwà búburú tàbí èérí ọkàn mọ́, pàápàá nípa ìbálòpọ̀ nínú àyíká ẹsẹ̀ náà.
- source_word: ἐν ἁγιασμῷ
  choice: láti máa gbé nínú ìwà mímọ́
  rationale: Èyí mú ìyàtọ̀ tó wà láàárín ἀκαθαρσία àti ἁγιασμός jáde, ó sì ṣàfihàn ìwà mímọ́ gẹ́gẹ́ bí ipò àti ọ̀nà ìgbésí ayé, láìkọ ìtumọ̀ ìsọdimímọ́ gẹ́gẹ́ bí ìlànà sílẹ̀ pátápátá.
theological_decisions:
- issue: Ìtumọ̀ ìpè Ọlọ́run
  choice: Ìpè Ọlọ́run tó jẹ́ ìpìlẹ̀ fún ìgbésí ayé mímọ́ àwọn onígbàgbọ́, láìsọ bí ìpè náà ṣe ń ṣiṣẹ́ ní ọ̀nà ẹ̀kọ́ ìsìn kan pàtó
  alternative: Ìkésíni gbogbogbòò tàbí “ìpè tó múná dóko” ní ìtumọ̀ ìmọ̀-ẹ̀kọ́ ìsìn tó muna
  rationale: Ẹsẹ̀ náà so ìpè Ọlọ́run mọ́ ìwà mímọ́, ṣùgbọ́n kò ṣàlàyé bí ìpè náà ṣe ń ṣiṣẹ́. Nítorí náà, a pa ọ̀rọ̀ “pè” mọ́ láìfi èrò ẹ̀ka ìsìn kan kún un.
- issue: Ìtumọ̀ ἁγιασμός
  choice: ìwà mímọ́, pẹ̀lú àlàyé pé ó tún lè túmọ̀ sí ìsọdimímọ́
  alternative: ìsọdimímọ́ nìkan gẹ́gẹ́ bí ìlànà jíjẹ́ mímọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ipò jíjẹ́ mímọ́ tàbí sí ìlànà jíjẹ́ ẹni mímọ́. Ìtakora rẹ̀ pẹ̀lú ìwà àìmọ́ níbí mú “ìwà mímọ́” bá ọ̀rọ̀ mu jù, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: A lo Yorùbá àjùmọ̀lò tó ní ọlá, tó sì ṣe kedere fún òǹkàwé òde òní. Gbólóhùn “láti máa gbé nínú” jẹ́ kí ète àti ọ̀nà ìgbésí ayé tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí ṣe kedere, nígbà tí “ìwà àìmọ́” àti “ìwà mímọ́” pa ìtakora pàtàkì inú ẹsẹ̀ náà mọ́.
