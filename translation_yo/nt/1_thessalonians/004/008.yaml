id: 1TH.4.8
reference: 1 Thessalonians 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: yo
  text: Nítorí náà, ẹni tí ó kọ̀ ọ́ sílẹ̀[a] kì í kọ ènìyàn sílẹ̀, bí kò ṣe Ọlọ́run, ẹni tí ó sì ń fi Ẹ̀mí Mímọ́ tirẹ̀ fún yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ẹni tí ó ṣàìka sí i.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “kọ̀,” “ṣàìka sí,” tàbí “fi sí ẹ̀gbẹ́ kan.”
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀ gangan, “ẹni tí ó sì ń fi Ẹ̀mí Mímọ́ tirẹ̀ sínú yín.” Ọ̀rọ̀ Gíríìkì εἰς sábà máa ń túmọ̀ sí “sínú,” ṣùgbọ́n “fún yín” jẹ́ ọ̀nà Yorùbá àdánidá pẹ̀lú ọ̀rọ̀-ìṣe “fúnni” níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí ó jáde láti inú ìṣílétí tó ṣáájú hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: ẹni tí ó bá kọ èyí sílẹ̀ ... kọ̀
  rationale: Àpólà olùṣe pẹ̀lú akọ́tọ́ náà ní ìtumọ̀ gbogbogbò; ‘ẹni tí ó bá’ kò fi ọ̀rọ̀ náà mọ́ ọkùnrin nìkan. ‘Kọ sílẹ̀’ àti ‘kọ̀’ mú ìtumọ̀ kíkọ àṣẹ tàbí ìtọ́ni tí ó ní agbára láti darí ènìyàn hàn.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: kì í ṣe ènìyàn ni ó kọ̀, bí kò ṣe Ọlọ́run
  rationale: ‘Ènìyàn’ jẹ́ gbogbogbò níbí, ó sì pa ìyàtọ̀ tó lágbára láàárín ènìyàn àti Ọlọ́run mọ́.
- source_word: τὸν καὶ διδόντα
  choice: ẹni tí ó sì ń fi ... fún yín
  rationale: Àpólà olùṣe ìsinsìnyí ni a tú sí gbólóhùn àlàyé Yorùbá; ‘ń’ mú ìṣe tí ń lọ lọ́wọ́ hàn, ‘sì’ sì ṣojú καί.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: Ẹ̀mí Mímọ́ tirẹ̀
  rationale: Gbólóhùn náà tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run; ‘tirẹ̀’ mú αὐτοῦ hàn ní Yorùbá àdánidá.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘fúnni,’ èyí ni ọ̀nà Yorùbá tó ṣe déédéé jù láti sọ pé Ọlọ́run ń fi Ẹ̀mí rẹ̀ fún àwọn onígbàgbọ́. Ìtumọ̀ gangan ‘sínú yín’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí ‘Ẹ̀mí Mímọ́ tirẹ̀’ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ tí Ọlọ́run ń fi fún àwọn onígbàgbọ́
  alternative: ẹ̀mí mímọ́ gẹ́gẹ́ bí ẹ̀bùn tàbí ìwà kan tí kì í ṣe ẹni
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì àti bí Pọ́ọ̀lù ṣe máa ń lò ó tọ́ka sí Ẹ̀mí Mímọ́ Ọlọ́run, láìfi ẹ̀kọ́ ìsìn mìíràn kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ gbogbogbò ti ὁ ἀθετῶν
  choice: ẹni tí ó bá kọ èyí sílẹ̀
  alternative: ọkùnrin tí ó kọ èyí sílẹ̀
  rationale: Ìrísí akọ nínú Gíríìkì jẹ́ aṣojú gbogbo ènìyàn níbí; Yorùbá kò ní láti sọ ọ́ di ti ọkùnrin nìkan.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàgò fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
