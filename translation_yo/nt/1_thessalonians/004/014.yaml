id: 1TH.4.14
reference: 1 Thessalonians 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: yo
  text: Nítorí bí a bá gbàgbọ́ pé Jésù kú, ó sì jí dìde, bẹ́ẹ̀ náà ni Ọlọ́run yóò mú àwọn tí wọ́n ti sùn[a] nípasẹ̀ Jésù[b] wá pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí wọ́n ti kú.” Nínú àyíká ọ̀rọ̀ yìí, Pọ́ọ̀lù lo “sùn” gẹ́gẹ́ bí àkàwé fún ikú àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí wọ́n ti sùn nínú Jésù.” A lè lóye gbólóhùn “nípasẹ̀ Jésù” (διὰ τοῦ Ἰησοῦ) ní onírúurú ọ̀nà, títí kan ipa rẹ̀ (“nípasẹ̀ Jésù”) tàbí ìbáṣepọ̀ tímọ́tímọ́ (“nínú Jésù”).
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: Ó pa ìtumọ̀ γάρ tó ń fi ìdí ọ̀rọ̀ ṣáájú múlẹ̀ mọ́, ó sì tún fi ìpèníjà εἰ hàn lọ́nà Yorùbá tó ṣe déédéé.
- source_word: πιστεύομεν
  choice: a bá gbàgbọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ìgbàgbọ́ tí gbogbo àwọn onígbàgbọ́ jọ jẹ́wọ́ nípa ikú àti àjíǹde Jésù.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: kú, ó sì jí dìde
  rationale: Ó fi àwọn ìṣẹ̀lẹ̀ méjèèjì hàn ní ṣókí, ó sì pa ìtumọ̀ ọ̀rọ̀-ìṣe aláìṣeṣe ἀνέστη mọ́ láìyí i sí ọ̀rọ̀-ìṣe amúṣe.
- source_word: οὕτως καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó so ohun tí Ọlọ́run yóò ṣe pọ̀ mọ́ ikú àti àjíǹde Jésù láìṣàlàyé bí ìbáṣepọ̀ náà ṣe rí ju ohun tí Gíríìkì sọ lọ.
- source_word: τοὺς κοιμηθέντας
  choice: àwọn tí wọ́n ti sùn
  rationale: Ó pa àkàwé Pọ́ọ̀lù fún ikú mọ́, nígbà tí ‘ti sùn’ fi ipò tí ó tẹ̀ lé ìṣẹ̀lẹ̀ náà hàn lọ́nà àdánidá.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: nípasẹ̀ Jésù
  rationale: ‘Nípasẹ̀’ jẹ́ ìtumọ̀ àkọ́kọ́ tó bá διά pẹ̀lú ọ̀rọ̀-orúkọ oníbáramu mu, ó sì jẹ́ kí kókó pàtó nípa ipa tàbí ìbáṣepọ̀ Jésù ṣì ṣí sílẹ̀.
- source_word: ἄξει
  choice: yóò mú ... wá
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ọjọ́ iwájú àti ìṣe mímú àwọn ènìyàn dé hàn kedere.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Ó pa arọ́pò-orúkọ Gíríìkì àti ìtumọ̀ ìbákẹ́gbẹ́ mọ́; Jésù ni ẹni tí ‘rẹ̀’ ń tọ́ka sí gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
theological_decisions:
- issue: Ìtumọ̀ àkàwé κοιμηθέντας fún ikú
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘àwọn tí wọ́n ti sùn.’
  alternative: àwọn tí wọ́n ti kú
  rationale: Àkàwé oorun ṣe pàtàkì nínú ìtùnú Pọ́ọ̀lù nípa àwọn onígbàgbọ́ tó kú àti ìrètí àjíǹde; fífi í sílẹ̀ kò sọ pé ikú kì í ṣe ikú gidi.
- issue: Ìtumọ̀ διὰ τοῦ Ἰησοῦ
  choice: Lo ‘nípasẹ̀ Jésù’ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: nínú Jésù; nítorí Jésù
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí ipa Jésù, ohun tó fà á, tàbí ìbáṣepọ̀ tímọ́tímọ́ pẹ̀lú rẹ̀. Ìtumọ̀ àkọ́kọ́ tẹ̀ lé lílo διά pẹ̀lú oníbáramu, nígbà tí àlàyé ìsàlẹ̀ pa àwọn òye mìíràn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. Àtòjọ ọ̀rọ̀ pa ìṣàn ọ̀rọ̀ Yorùbá mọ́, nígbà tó tún dáàbò bo àkàwé àti àìdájú gidi inú Gíríìkì.
