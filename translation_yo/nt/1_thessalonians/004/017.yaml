id: 1TH.4.17
reference: 1 Thessalonians 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: yo
  text: Lẹ́yìn náà, àwa tí a wà láàyè, tí a sì ṣì kù, a óò gbé wa sókè[a] papọ̀ pẹ̀lú wọn ní àwọn ìkùukùu láti pàdé Olúwa ní ojú afẹ́fẹ́[b]; nípa bẹ́ẹ̀, a óò wà pẹ̀lú Olúwa nígbà gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a óò já gbà wa sókè.” Ọ̀rọ̀-ìṣe Gíríìkì náà tẹnu mọ́ ìṣe òjijì tí a fi agbára ṣe.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti lọ sí ìpàdé pẹ̀lú Olúwa.” Gbólóhùn náà lè túmọ̀ sí lílọ jáde láti pàdé ẹnì kan, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ìtòlẹ́sẹẹsẹ tó gbòòrò ju ìpàdé náà lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Lẹ́yìn náà
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ yìí tẹ̀ lé àjíǹde àwọn òkú nínú Kristi tí ẹsẹ tó ṣáájú sọ.
- source_word: οἱ ζῶντες
  choice: àwa tí a wà láàyè
  rationale: Ó dá àwọn onígbàgbọ́ tí wọn yóò ṣì wà láàyè nígbà náà mọ̀ ní ọ̀nà tí ó ṣe kedere, tí ó sì bá èdè Yorùbá mu.
- source_word: οἱ περιλειπόμενοι
  choice: tí a sì ṣì kù
  rationale: Ó túmọ̀ sí àwọn tí wọn kò tíì kú nígbà náà; ‘ṣì kù’ kò fi dandan túmọ̀ sí pé wọn la ewu kan já.
- source_word: ἅμα σὺν αὐτοῖς
  choice: papọ̀ pẹ̀lú wọn
  rationale: Ó pa èrò pé gbogbo wọn yóò wà papọ̀ àti pé ìṣẹ̀lẹ̀ náà kan wọn ní àkókò kan náà mọ́.
- source_word: ἁρπαγησόμεθα
  choice: ni a óò gbà sókè
  rationale: Ìkọ̀ Yorùbá yìí fi ìṣe tí a ṣe sí wọn hàn, ó sì sọ ìgbé-sókè náà ní tààrà láìfi ètò ẹ̀kọ́ ìsìn kan kún un.
- source_word: ἐν νεφέλαις
  choice: sínú àwọn ìkùukùu
  rationale: Ó pa àwòrán gidi ti ọ̀pọ̀ ìkùukùu mọ́, ó sì bá ìṣípò sókè tí ọ̀rọ̀-ìṣe náà sọ mu.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: láti pàdé Olúwa
  rationale: Ó sọ ète ìṣípò náà ní èdè Yorùbá àdánidá láìsọ ohun tí yóò ṣẹlẹ̀ lẹ́yìn ìpàdé náà.
- source_word: εἰς ἀέρα
  choice: ní àárín afẹ́fẹ́
  rationale: Ó yà ἀήρ, afẹ́fẹ́ tàbí ojú afẹ́fẹ́, sọ́tọ̀ kúrò ní ‘ọ̀run’ tó lè túmọ̀ sí ibùgbé Ọlọ́run.
- source_word: καὶ οὕτως
  choice: nípa bẹ́ẹ̀
  rationale: Ó lè tọ́ka sí ọ̀nà tàbí àbájáde ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ, láìyan ọ̀kan ṣoṣo láàárín wọn.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Èyí ni ìtumọ̀ tààrà fún adverb náà, ó sì pa ìdánilójú ìbákẹ́gbẹ́ tí kò ní dópin mọ́.
- source_word: σὺν κυρίῳ ἐσόμεθα
  choice: a ó sì máa wà pẹ̀lú Olúwa
  rationale: Ó pa ìlérí ọjọ́ iwájú àti ìtẹnumọ́ lórí ìbákẹ́gbẹ́ pẹ̀lú Olúwa mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἁρπαγησόμεθα nínú ẹsẹ tí a sábà ń lò nínú àríyànjiyàn nípa gbígbé àwọn onígbàgbọ́ sókè
  choice: ni a óò gbà sókè
  alternative: ni a óò já gbà sókè
  rationale: A túmọ̀ ọ̀rọ̀-ìṣe náà ní tààrà, ṣùgbọ́n a kò fi èrò ẹ̀sìn kan sí i nípa àkókò tàbí bí ìṣẹ̀lẹ̀ náà yóò ṣe wáyé. Àlàyé ìsàlẹ̀ sọ agbára àti òjijì tó wà nínú ọ̀rọ̀ Gíríìkì.
- issue: Ìtumọ̀ εἰς ἀπάντησιν τοῦ κυρίου
  choice: láti pàdé Olúwa
  alternative: láti lọ sí ìpàdé pẹ̀lú Olúwa
  rationale: Èyí sọ ìpàdé náà ní kedere, ṣùgbọ́n kò pinnu ibi tí wọn yóò lọ lẹ́yìn náà tàbí gbogbo bí àwọn ìṣẹ̀lẹ̀ òpin ayé ṣe tẹ̀ lé ara wọn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. ‘Ní àárín afẹ́fẹ́’ yẹra fún lílo ‘ọ̀run,’ èyí tí ó lè fi ìtumọ̀ ibi ìgbé Ọlọ́run kún ἀήρ. Ìkọ̀ ‘àwa … ni a óò gbà sókè’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ohùn àìṣe ti Gíríìkì mọ́ láìdárúkọ olùṣe.
