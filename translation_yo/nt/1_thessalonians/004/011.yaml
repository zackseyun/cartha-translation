id: 1TH.4.11
reference: 1 Thessalonians 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: yo
  text: kí ẹ sì fi ṣe ìfojúsùn yín láti máa gbé ní ìdákẹ́jẹ́[a], kí ẹ máa bójú tó ọ̀ràn ara yín[b], kí ẹ sì máa fi ọwọ́ ara yín ṣiṣẹ́, gẹ́gẹ́ bí a ti pàṣẹ fún yín,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ fi dídákẹ́ jẹ́ ìfojúsùn yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ẹ máa ṣe ohun tí ó jẹ́ tiyín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: fi ṣe ìfojúsùn yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ohun kan ṣe ọlá tàbí ìfojúsùn tí ẹni ń fi taratara lépa. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ìtumọ̀ náà mọ́.
- source_word: ἡσυχάζειν
  choice: láti máa gbé ní ìdákẹ́jẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, kì í ṣe dídákẹ́ láìsọ̀rọ̀ nìkan, bí kò ṣe gbígbé ìgbésí ayé pẹ̀lẹ́, tí kò ní ìdàrúdàpọ̀ tàbí fífi ara sí ọ̀ràn àwọn ẹlòmíràn.
- source_word: πράσσειν τὰ ἴδια
  choice: kí ẹ máa bójú tó ọ̀ràn ara yín
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà tọ́ka sí ṣíṣe ojúṣe ẹni àti ṣíṣe àbójútó àwọn ọ̀ràn tirẹ̀. Èyí jẹ́ kedere, ó sì yẹra fún ohùn líle tí àṣẹ pé kí ẹni má ṣe dá sí ọ̀ràn ẹlòmíràn lè ní.
- source_word: ἐργάζεσθαι
  choice: máa ṣiṣẹ́
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún iṣẹ́ tàbí làálàá ní gbogbogbòò.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: fi ọwọ́ ara yín
  rationale: A lò ó gẹ́gẹ́ bí ohun èlò iṣẹ́, possessive ὑμῶν sì mú ìtẹnumọ́ lórí ọwọ́ tiwọn fúnra wọn wá.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ohun tí a sọ yìí wé ìtọ́ni tí àwọn aposteli ti fún wọn tẹ́lẹ̀.
- source_word: παρηγγείλαμεν
  choice: a ti pàṣẹ
  rationale: Ọ̀rọ̀ náà ní agbára ìtọ́ni aláṣẹ; “pàṣẹ” pa ìwọ̀n agbára yẹn mọ́ ní Yorùbá.
theological_decisions:
- issue: Agbára ìtọ́ni àwọn aposteli
  choice: a ti pàṣẹ
  alternative: a ti kọ́ yín; a ti fún yín ní ìtọ́ni
  rationale: παραγγέλλω ní agbára àṣẹ nínú àyíká yìí. “Pàṣẹ” fi hàn pé ìṣílétí ìwà yìí ní ọlá-àṣẹ, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Ọ̀nà gbólóhùn náà pa ìtẹ̀lé àwọn ọ̀rọ̀ àìparí Gíríìkì mọ́ ní irú àṣẹ “kí ẹ…” mẹ́ta.
