source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: yo
  text: kí olúkúlùkù yín mọ bí ó ṣe lè gba ohun èlò tirẹ̀ ní mímọ́ àti ọlá,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘gba ohun èlò tirẹ̀’ tún lè túmọ̀ sí ‘ní ohun èlò tirẹ̀.’ A pa ọ̀rọ̀ náà mọ́ ní ìtumọ̀ gbòòrò rẹ̀; ó ṣeé ṣe kí ‘ohun èlò’ tọ́ka sí ara ẹni tàbí aya ẹni.
    reason: Láti pa àìdánilójú gidi tó wà nínú σκεῦος àti κτᾶσθαι mọ́, kí a má sì fi ìtumọ̀ ẹ̀kọ́ kan ṣoṣo lé ẹsẹ̀ náà lórí.
lexical_decisions:
- source_word: εἰδέναι
  choice: mọ bí yóò ṣe
  rationale: Ó fi ìtumọ̀ ‘mọ bí a ṣe ń ṣe ohun kan’ hàn ní Yorùbá àdánidá, ó sì bá ọ̀rọ̀ àìṣe tó tẹ̀ lé e mu.
- source_word: σκεῦος
  choice: ohun èlò
  rationale: Èyí ni ìtumọ̀ gidi ti ‘vessel/implement’ ó sì pa àfiwé àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́, dípò yíyan ‘ara’ tàbí ‘aya’ láìsí ìdánilójú.
- source_word: κτᾶσθαι
  choice: gba
  rationale: Aorist middle infinitive náà lè túmọ̀ sí ‘ní/gba fún ara ẹni’; ‘gba’ pa ìmọ̀lára ìmúní tàbí ìrírí ohun kan mọ́, gẹ́gẹ́ bí àtúnṣe POB ‘acquire.’
- source_word: ἁγιασμῷ καὶ τιμῇ
  choice: ní mímọ́ àti ọlá
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì ní iyì fún ‘in holiness/sanctification and honor,’ láìfi ẹ̀kọ́ ẹ̀sìn míràn kún un.
theological_decisions:
- issue: Ohun tí ‘ohun èlò tirẹ̀’ (τὸ ἑαυτοῦ σκεῦος) ń tọ́ka sí
  choice: Pa àfiwé náà mọ́ gẹ́gẹ́ bí ‘ohun èlò tirẹ̀,’ kí àlàyé ẹsẹ̀ ìsàlẹ̀ sọ àwọn ìtumọ̀ pàtàkì.
  alternative: Túmọ̀ ọ́ ní tààrà sí ‘ara tirẹ̀’ tàbí ‘aya tirẹ̀.’
  rationale: Àwọn ìtumọ̀ ‘ara’ àti ‘aya’ ni a ti fi fún ọ̀rọ̀ náà, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò yan ọ̀kan ní kedere; yíyan ọ̀kan nínú ẹsẹ̀ yóò tú ìdààmú ìtumọ̀ náà láìní ẹ̀rí tó tó.
- issue: Ìtumọ̀ κτᾶσθαι
  choice: Lo ‘gba,’ tó tẹ̀ lé ìtumọ̀ ‘acquire.’
  alternative: Lo ‘ní,’ ‘tọ́jú,’ tàbí ‘darí.’
  rationale: Fọ́ọ̀mù ọ̀rọ̀ náà lè ni ìtumọ̀ ìmúní tàbí jíjẹ́ olúwa ohun kan. ‘Gba’ tẹ̀ lé ẹ̀rí fọ́ọ̀mù aorist náà àti ìpinnu POB tuntun, láìsọ ọ́ di ‘ṣàkóso ara.’
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìsọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì jẹ́ apá gbólóhùn tó ń bá 4:3 lọ; nítorí náà ó bẹ̀rẹ̀ pẹ̀lú ‘kí.’
