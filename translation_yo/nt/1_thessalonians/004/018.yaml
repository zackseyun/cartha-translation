  text: Therefore encourage one another with these words[a].
translation:
  language: yo
  text: Nítorí náà, ẹ máa fi ọ̀rọ̀ wọ̀nyí gba ara yín níyànjú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa fi ọ̀rọ̀ wọ̀nyí tù ara yín nínú.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ fífúnni ní ìṣírí, títù ẹni nínú, tàbí yíyànjú ẹni; níbí, àyíká ọ̀rọ̀ náà tẹnu mọ́ ìfọ̀kànbalẹ̀ àti ìtùnú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi ìparí tí Pọ́ọ̀lù mú jáde láti inú ẹ̀kọ́ tó ṣáájú hàn ní kedere.
- source_word: παρακαλεῖτε
  choice: ẹ máa ... fún ... ní ìṣírí
  rationale: Ọ̀rọ̀-ìṣe náà lè túmọ̀ sí fífúnni ní ìṣírí, ìtùnú, tàbí ìyànjú. Nínú àyíká yìí, ìṣírí jẹ́ àṣàyàn tó gbòòrò tó sì bá ète ìtùnú fún àwọn onígbàgbọ́ mu.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Ó ṣàfihàn pé kí wọ́n máa ṣe èyí fún ara wọn, gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ ìfèsì náà ṣe túmọ̀ sí.
- source_word: ἐν
  choice: fi
  rationale: Nínú Yorùbá àdánidá, ‘fi ... fún ... ní ìṣírí’ ṣàfihàn ọ̀nà tàbí ohun èlò tí a fi ń ṣe ìṣírí náà.
- source_word: τοῖς λόγοις τούτοις
  choice: ọ̀rọ̀ wọ̀nyí
  rationale: Ó tọ́ka padà sí àwọn gbólóhùn pàtó tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa dídé Olúwa àti àjíǹde àwọn onígbàgbọ́.
