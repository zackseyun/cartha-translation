  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún òǹkàwé lasán. A lo ‘ẹ máa’ láti fi àṣẹ tí ó ń bá a lọ hàn, a sì pa àṣàyàn ìtumọ̀ láàárín ìṣírí àti ìtùnú mọ́ nínú àlàyé ìsàlẹ̀.
