id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: yo
  text: kí ẹnikẹ́ni má kọjá ààlà, kí ó sì má ṣe jàǹfààní lórí arákùnrin rẹ̀[b] nínú ọ̀ràn yìí,[a] nítorí Olúwa ni olùgbẹ̀san ní ti gbogbo nǹkan wọ̀nyí, gẹ́gẹ́ bí a ti sọ fún yín tẹ́lẹ̀, tí a sì kìlọ̀ fún yín gidigidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó má ṣe ṣe jìbìtì sí arákùnrin rẹ̀ nínú ọ̀ràn náà.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ṣíṣe àǹfààní lára ẹnì kan; àwọn kan sì lóye rẹ̀ ní pàtó sí jìbìtì. Nínú àyíká ọ̀rọ̀, ó ṣeé ṣe jù pé ìkìlọ̀ náà ní í ṣe pẹ̀lú ìwà àìtọ́ nípa ìbálòpọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin rẹ̀” túmọ̀ gbólóhùn Gíríìkì akọ-ẹyọ kan. Ó ṣeé ṣe kí ọ̀rọ̀ náà dojú kọ onígbàgbọ́ ẹlẹgbẹ́ rẹ̀, bó tilẹ̀ jẹ́ pé ìkìlọ̀ ìwà rere náà lè kan àwọn mìíràn nínú àwùjọ náà pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: kí ẹnikẹ́ni má ṣe ré ààlà kọjá
  rationale: Ọ̀rọ̀ náà ń bá ìṣírí ẹsẹ tó ṣáájú lọ, ó sì ní àwòrán fífi ààlà ìwà rere kọjá. Gbólóhùn yìí pa àwòrán náà mọ́ ní Yorùbá àdánidá.
- source_word: πλεονεκτεῖν
  choice: rẹ ... jẹ
  rationale: Níhìn-ín, ọ̀rọ̀ náà túmọ̀ sí lílo ẹlòmíràn fún èrè ara ẹni tàbí ṣíṣe àǹfààní lára rẹ̀. ‘Rẹ ... jẹ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìfiṣèjẹ láì fi ìtumọ̀ náà mọ́ ọ̀ràn owó nìkan.
- source_word: ἐν τῷ πράγματι
  choice: nínú ọ̀ràn yìí
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì tó mọ̀ọ́mọ̀ gbòòrò mọ́, ó sì tọ́ka sí ọ̀ràn ìwà mímọ́ nípa ìbálòpọ̀ nínú àyíká ọ̀rọ̀.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Èyí tẹ̀ lé akọ ẹyọ kan nínú Gíríìkì. Ó ṣeé ṣe kí ó tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́ rẹ̀, bó tilẹ̀ jẹ́ pé ìkìlọ̀ náà lè kan gbogbo àwùjọ.
- source_word: ἔκδικος κύριος
  choice: Olúwa ni olùgbẹ̀san
  rationale: ‘Olùgbẹ̀san’ pa agbára ìdájọ́ ọ̀rọ̀ ἔκδικος mọ́; ‘Olúwa’ sì jẹ́ ìtumọ̀ àdánidá àti ìbílẹ̀ fún κύριος ní àyíká yìí.
- source_word: περὶ πάντων τούτων
  choice: lórí gbogbo nǹkan wọ̀nyí
  rationale: Ìtumọ̀ yìí pa ìwọ̀n gbòòrò ọ̀rọ̀ náà mọ́, tó ń tọ́ka sí gbogbo ẹ̀ṣẹ̀ àti ìwà àìtọ́ tí a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: προείπαμεν
  choice: a ti sọ fún yín tẹ́lẹ̀
  rationale: Ó fi hàn pé àwọn aposteli ti sọ ọ̀rọ̀ náà fún wọn ṣáájú.
- source_word: διεμαρτυράμεθα
  choice: a sì kìlọ̀ fún yín gidigidi
  rationale: Èyí fi ìtẹnumọ́ àti ìjẹ́jẹ̀ẹ́ pàtàkì inú ọ̀rọ̀ Gíríìkì hàn ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ohun tí ‘ọ̀ràn yìí’ ń tọ́ka sí àti irú ìwà àìtọ́ náà
  choice: Ẹsẹ náà ń bá ẹ̀kọ́ nípa ìwà mímọ́ nínú ìbálòpọ̀ láti ẹsẹ 3–5 lọ, ó sì ń kìlọ̀ lòdì sí ré ààlà kọjá àti ríri onígbàgbọ́ ẹlẹgbẹ́ ẹni jẹ nínú ọ̀ràn yìí.
  alternative: Ó lè tọ́ka ní gbogbogbòò sí jíjẹ ẹnì kan níyàn tàbí jìbìtì nínú ọ̀ràn òwò àti ìbáṣepọ̀.
  rationale: Àyíká ọ̀rọ̀ tó sún mọ́ ọn jù lọ dá lórí ìsọdimímọ́, àgbèrè àti bí ènìyàn ṣe máa ṣàkóso ara rẹ̀ ní ìwà mímọ́. Síbẹ̀, a pa ọ̀rọ̀ inú ẹsẹ náà mọ́ ní ọ̀nà tó gbòòrò díẹ̀, a sì ṣàlàyé àṣàyàn míì nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἀδελφός
  choice: arákùnrin rẹ̀
  alternative: arákùnrin tàbí arábìnrin rẹ̀; onígbàgbọ́ ẹlẹgbẹ́ rẹ̀
  rationale: Gíríìkì jẹ́ akọ ẹyọ kan. Ìtumọ̀ pàtàkì náà tẹ̀ lé ìrísí yẹn, nígbà tí àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe kí ó dojú kọ onígbàgbọ́ ẹlẹgbẹ́, ìlànà ìwà rere náà sì lè kan gbogbo àwùjọ.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Ní àyíká yìí, κύριος ń tọ́ka sí Olúwa tó ń ṣe ìdájọ́; ‘Olúwa’ pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìbámu ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn níbi tó yẹ, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ré ààlà kọjá’ láti pa àwòrán Gíríìkì mọ́, ‘rẹ ... jẹ’ fún ìfiṣèjẹ, àti ‘olùgbẹ̀san’ láti pa agbára ìdájọ́ náà mọ́.
