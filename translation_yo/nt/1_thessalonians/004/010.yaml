id: 1TH.4.10
reference: 1 Thessalonians 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: yo
  text: Nítorí lóòótọ́, ẹ̀ ń ṣe èyí sí gbogbo àwọn arákùnrin[a] jákèjádò gbogbo Makedóníà. Ṣùgbọ́n àwa ń rọ̀ yín, ẹ̀yin arákùnrin, kí ẹ túbọ̀ máa pọ̀ sí i,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin” níbí ń tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn, ó sì ṣeé ṣe kí ó gba àwọn ọkùnrin àti obìnrin inú àwọn ìjọ náà pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí lóòótọ́
  rationale: Ó fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀, ó sì tẹnu mọ́ ọn lọ́nà Yorùbá àdánidá.
- source_word: ποιεῖτε αὐτὸ
  choice: ẹ̀ ń ṣe èyí
  rationale: Àkókò ìsinsìnyí fi hàn pé ìṣe náà ń bá a lọ; “èyí” tọ́ka padà sí ìfẹ́ ará nínú ẹsẹ tó ṣáájú.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: sí gbogbo àwọn arákùnrin
  rationale: “Sí” pa ìdarí ìṣe náà mọ́, “àwọn arákùnrin” sì tẹ̀lé ọ̀rọ̀ akọ púpọ̀ Gíríìkì, pẹ̀lú àlàyé ní àkọsílẹ̀ pé ó lè gba obìnrin pẹ̀lú.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: jákèjádò gbogbo Makedóníà
  rationale: Ó sọ bí àwọn onígbàgbọ́ náà ṣe wà ká gbogbo agbègbè Makedóníà ní Yorùbá tó ṣe kedere.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Ṣùgbọ́n àwa ń rọ̀ yín
  rationale: “Ń rọ̀” mú ìtumọ̀ ìkìlọ̀ tàbí ìpè onítara jáde; “ṣùgbọ́n” jẹ́ ìyípadà kékeré láti ìyìn sí ìṣírí síwájú.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Ó pa àpèjúwe akọ púpọ̀ ti orísun mọ́, láì sọ pé àwọn obìnrin onígbàgbọ́ kò sí nínú àwùjọ náà.
- source_word: περισσεύειν μᾶλλον
  choice: kí ẹ máa ṣe bẹ́ẹ̀ sí i
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí kí wọ́n túbọ̀ pọ̀ sí i nínú ìfẹ́ ará; gbolohun yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ipa afiwéra μᾶλλον mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί/ἀδελφούς níbi tí àwùjọ ìjọ lè ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin / ẹ̀yin arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Ọ̀rọ̀ inú àkọ́kọ́ jẹ́ akọ púpọ̀, ṣùgbọ́n ní ìlò Páùlù ó sábà máa ń dúró fún gbogbo ìdílé ìgbàgbọ́. A pa ìrísí orísun mọ́ nínú ẹsẹ, a sì ṣàlàyé ìwọ̀n rẹ̀ ní àkọsílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá jẹ́ ti ẹ̀dá; èdè náà ní iyì, ó sì rọrùn fún òǹkàwé òde òní. A lo “ẹ̀” gẹ́gẹ́ bí arọ́pò-orúkọ ẹni kejì púpọ̀.
