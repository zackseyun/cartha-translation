id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: yo
  text: Nítorí náà, ní ìparí, ẹ̀yin ará[a], a ń bẹ̀ yín, a sì ń gbà yín níyànjú nínú Olúwa Jésù pé, gẹ́gẹ́ bí ẹ ti gba lọ́wọ́ wa nípa bí ó ti yẹ kí ẹ máa rìn kí ẹ sì máa ṣe ohun tí ó wu Ọlọ́run, gẹ́gẹ́ bí ẹ ti ń rìn náà, kí ẹ máa túbọ̀ ṣe bẹ́ẹ̀ sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ náà ní èdè Gíríìkì jẹ́ “arákùnrin” ní ìrísí ọ̀pọ̀, ṣùgbọ́n a sábà máa ń lò ó fún gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Ní ìparí, nítorí náà
  rationale: Ó fi ìyípadà sí apá ìṣílétí ìkẹyìn hàn, ó sì pa agbára ìtẹ̀síwájú οὖν mọ́.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ọmọ ìjọ, kò sì fi akọ tàbí abo sílẹ̀, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ìrísí akọ púpọ̀.
- source_word: ἐρωτῶμεν ... καὶ παρακαλοῦμεν
  choice: a ń bẹ̀ yín, a sì ń gbà yín níyànjú
  rationale: Àwọn ọ̀rọ̀ méjèèjì pa ìbẹ̀bẹ̀ àti ìṣílétí alágbára mọ́.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: nínú Olúwa Jésù
  rationale: Ó pa ọ̀rọ̀ àsopọ̀ ἐν mọ́, ó sì fi “Olúwa” hàn gẹ́gẹ́ bí oyè Jésù.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: gẹ́gẹ́ bí ẹ ti gba lọ́wọ́ wa
  rationale: Ó pa àwòrán gbígba ẹ̀kọ́ tàbí àṣà ìkọ́ni lọ́wọ́ àwọn aposteli mọ́.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: nípa bí ó ti yẹ kí ẹ máa rìn
  rationale: “Máa rìn” pa àkàwé Paulu fún ìwà àti ìgbé ayé mọ́; “ó yẹ” sì fi dandan ìwà rere δεῖ hàn láìṣe é le jù.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: kí ẹ sì máa ṣe ohun tí ó wu Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ìgbé ayé wọn mú inú Ọlọ́run dùn.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: gẹ́gẹ́ bí ẹ ti ń rìn báyìí
  rationale: Ó jẹ́wọ́ pé wọ́n ti ń gbé irú ìgbé ayé náà, ó sì tún pa àkàwé “rìn” mọ́.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: ẹ máa túbọ̀ ṣe bẹ́ẹ̀ sí i
  rationale: Ó sọ ìlọsíwájú ju ipò wọn lọ ní Yorùbá tí ó ṣe kedere, láìfi kún ohun tí wọn gbọdọ̀ pọ̀ sí i.
theological_decisions:
- issue: Ìkíni tí ἀδελφοί ń tọ́ka sí fún gbogbo ìjọ
  choice: ẹ̀yin ará, pẹ̀lú àlàyé ìsàlẹ̀ ìwé
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ìrísí ọ̀rọ̀ Gíríìkì jẹ́ akọ púpọ̀, ṣùgbọ́n ó ṣeé ṣe kí ó ń pe gbogbo àwùjọ onígbàgbọ́. “Ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún gbogbo wọn, àlàyé sì pa ìrísí Gíríìkì mọ́.
- issue: κύριος gẹ́gẹ́ bí oyè Jésù
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Nínú àyíká yìí, κύριος jẹ́ oyè Kristi, “Olúwa” sì pa ìtumọ̀ ẹ̀sìn àti agbára rẹ̀ mọ́.
translation_notes:
  register: Yorùbá àtẹ́wọ́gbà, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa àkàwé “rìn” mọ́, ṣùgbọ́n a sọ ìparí ẹsẹ náà ní ọ̀nà Yorùbá àdánidá.
