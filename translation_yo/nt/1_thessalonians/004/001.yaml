  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ọ̀pọ̀ ìtumọ̀ Gíríìkì dáadáa: ìbẹ̀bẹ̀ àti ìṣílétí náà, oyè “Olúwa Jésù,” ìkọ́ni tí wọ́n gbà, ìwà tí a fi àkàwé rírìn hàn, àti ìlọsíwájú sí i. Ṣùgbọ́n ìparí gbólóhùn náà yẹ kí ó ní “kí” láti fi ἵνα hàn ní Yorùbá, àti καί nínú καθὼς καὶ περιπατεῖτε yẹ kí ó hàn gẹ́gẹ́ bí “náà.”'
  naturalness: Ìlò “ẹ̀yin ará” jẹ́ àdánidá nínú Yorùbá ìjọ. Àtúnṣe àmì-ìkọ̀wé àti “kí ẹ máa túbọ̀...” mú ìṣàn gbólóhùn náà rọrùn, ó sì so ìbẹ̀bẹ̀ àwọn aposteli pọ̀ mọ́ ohun tí wọ́n fẹ́ kí àwọn olùgbọ́ ṣe.
  terminology: “Olúwa Jésù,” “ẹ̀yin ará,” àti “ṣe ohun tí ó wu Ọlọ́run” bá ìforúkọsílẹ̀ ìjọ Yorùbá mu, wọ́n sì jẹ́ olóòtọ́ sí ìtumọ̀. Àlàyé ìsàlẹ̀ yẹ kí ó sọ ní kedere pé ἀδελφοί jẹ́ ọ̀rọ̀ ọ̀pọ̀ fún “arákùnrin,” kì í ṣe pé ó túmọ̀ sí ọrọ̀ ẹyọ kan ní tààrà.
