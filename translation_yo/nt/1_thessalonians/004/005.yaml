  text: kì í ṣe nínú ìfẹ́kúfẹ̀ẹ́ gbígbóná[a], gẹ́gẹ́ bí àwọn ènìyàn orílẹ̀-èdè tí kò mọ Ọlọ́run náà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìfẹ́kúfẹ̀ẹ́ onífẹ̀ẹ́” tàbí “nínú ìfẹ́kúfẹ̀ẹ́ tí ó lágbára.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn orílẹ̀-èdè”; ní àyíká yìí ó lè túmọ̀ sí àwọn tí kì í ṣe Júù, tàbí, ní ìtumọ̀ àlàyé sí i, àwọn abọ̀rìṣà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐν
  choice: kì í ṣe nínú
  rationale: Ó ń tẹ̀ síwájú láti inú ìṣírí ẹsẹ tó ṣáájú, ó sì kọ ọ̀nà tàbí ipò tí ìwà náà yóò gbà ṣẹlẹ̀.
- source_word: πάθει ἐπιθυμίας
  choice: ìgbóná ìfẹ́kúfẹ̀ẹ́
  rationale: “Ìgbóná” fi agbára πάθος hàn, “ìfẹ́kúfẹ̀ẹ́” sì mú ìtumọ̀ ìfẹ́ ibálòpọ̀ tí kò bójú mu jáde nínú àyíká ọ̀rọ̀ yìí, láì sọ ọ̀rọ̀ náà di pàtó ju orísun lọ.
- source_word: καθάπερ καὶ
  choice: gẹ́gẹ́ bí … pẹ̀lú
  rationale: Ìṣètò yìí jẹ́ èdè Yorùbá àdánidá tí ó pa ìfiwéra àti agbára καὶ mọ́.
- source_word: τὰ ἔθνη
  choice: àwọn ènìyàn orílẹ̀-èdè mìíràn
  rationale: Nínú lílo Páùlù, ọ̀rọ̀ náà sábà ń tọ́ka sí àwọn tí kì í ṣe Júù. Ìtumọ̀ yìí yẹra fún ìró ẹ̀gàn tí “Kèfèrí” lè ní lónìí, ó sì tún pa àwòrán “àwọn orílẹ̀-èdè” mọ́.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: tí kò mọ Ọlọ́run
  rationale: Ó tú participle náà sí gbólóhùn àpèjúwe Yorùbá tó ṣe kedere, ó sì fi ipò àìmọ̀ Ọlọ́run tí ń bá a lọ hàn.
theological_decisions:
- issue: Ìtumọ̀ τὰ ἔθνη nínú ìṣírí nípa ìwà mímọ́
  choice: àwọn ènìyàn orílẹ̀-èdè mìíràn
  alternative: àwọn Kèfèrí; àwọn orílẹ̀-èdè
  rationale: Yíyan èyí pa ìyàtọ̀ Júù àti àwọn tí kì í ṣe Júù mọ́, láì fi ẹ̀gàn tàbí ìtumọ̀ ẹ̀sìn kan tí ó le ju ti Gíríìkì lọ kún un.
- issue: Agbára πάθει ἐπιθυμίας
  choice: ìgbóná ìfẹ́kúfẹ̀ẹ́
  alternative: ìfẹ́kúfẹ̀ẹ́ gbígbóná; ìfẹ́ onígbóná
  rationale: Ó pa ìsopọ̀ àwọn ọ̀rọ̀ méjèèjì mọ́, ó sì jẹ́ kí àyíká ibálòpọ̀ pinnu irú ìfẹ́ tí a ń sọ̀rọ̀ rẹ̀, láì mú ìtumọ̀ tó dára wọ inú rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Gbólóhùn náà jẹ́ àjákù tí ó ń bá 1 Tẹsalóníkà 4:4 lọ, nítorí náà a pa ìbẹ̀rẹ̀ “kì í ṣe” àti àmì kọ́má ìparí mọ́. A yẹra fún “Kèfèrí” nínú ọ̀rọ̀ pàtàkì nítorí ìró ẹ̀gàn tí ó lè ní fún àwọn òǹkàwé òde òní.
