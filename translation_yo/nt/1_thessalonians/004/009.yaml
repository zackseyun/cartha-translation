id: 1TH.4.9
reference: 1 Thessalonians 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: yo
  text: Ní ti ìfẹ́ ará[a], ẹ kò nílò kí ẹnikẹ́ni kọ̀wé sí yín[b], nítorí ẹ̀yin fúnra yín ni Ọlọ́run ti kọ́ láti fẹ́ràn ara yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i, “ìfẹ́ sí àwọn onígbàgbọ́ ẹlẹgbẹ́ yín”; ọ̀rọ̀ Gíríìkì náà lo àwòrán ìfẹ́ láàárín àwọn ọmọ ìdílé fún àjọ àwọn Kristẹni.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ẹ kò nílò láti kọ̀wé sí yín”; Gíríìkì kò sọ ẹni tí yóò kọ̀wé náà ní gbangba, nítorí náà a fi “ẹnikẹ́ni” kún un nínú Yorùbá kí gbólóhùn náà lè ṣe kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ní ti
  rationale: Ó ṣí kókó tuntun sílẹ̀ pẹ̀lú ìtẹ̀síwájú díẹ̀ láti inú ọ̀rọ̀ tó ṣáájú; “Ní ti” jẹ́ ọ̀nà Yorùbá àdánidá láti fi kókó náà hàn láìfi ọ̀rọ̀ àsìkò tí kò sí nínú Gíríìkì kún un.
- source_word: φιλαδελφίας
  choice: ìfẹ́ ará
  rationale: Ó pa àwòrán ìdílé inú ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí ìfẹ́ láàárín àwọn onígbàgbọ́, láìsọ ọ́ di ọ̀rọ̀ gígùn nínú ẹsẹ̀ náà.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: ẹ kò nílò kí ẹnikẹ́ni kọ̀wé sí yín
  rationale: Kókó-ọrọ fún ọ̀rọ̀-ìṣe aláìlẹ́ni Gíríìkì náà kò farahàn ní tààrà; “ẹnikẹ́ni” mú gbólóhùn náà jẹ́ Yorùbá àdánidá láìfi “àwa” tí orísun kò sọ ní gbangba kún un.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: nítorí ẹ̀yin fúnra yín
  rationale: Ó pa ìtẹnumọ́ inú àpapọ̀ arọ́pò-orúkọ Gíríìkì náà mọ́.
- source_word: θεοδίδακτοί
  choice: ni Ọlọ́run ti kọ́
  rationale: Ó sọ ìtumọ̀ ọ̀rọ̀ ajẹtífù tó ṣọ̀wọ́n náà ní Yorùbá tó ṣe kedere, ó sì pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tó ń kọ́ wọn.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: láti nífẹ̀ẹ́ ara yín
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ète tàbí àbájáde tí ìṣọ̀kan Gíríìkì náà lè fi hàn, ó sì túmọ̀ ἀγαπᾶν pẹ̀lú ọ̀rọ̀ ìṣe “nífẹ̀ẹ́.”
theological_decisions:
- issue: Ìyàtọ̀ láàárín φιλαδελφία àti ἀγαπᾶν nínú ẹsẹ̀ kan náà
  choice: A túmọ̀ φιλαδελφία sí “ìfẹ́ ará,” a sì túmọ̀ ἀγαπᾶν sí “nífẹ̀ẹ́.”
  alternative: Lílo ọ̀rọ̀ kan náà fún àwọn méjèèjì láìpa àwòrán ìdílé mọ́.
  rationale: 'Èyí pa ìyàtọ̀ ọ̀rọ̀ tí Pọ́ọ̀lù lò mọ́: ìfẹ́ bí ti àwọn ọmọ ìdílé láàárín àwọn onígbàgbọ́, àti ìṣe fífẹ́ ara wọn.'
- issue: Kókó-ọrọ tí a kò sọ fún γράφειν
  choice: “kí ẹnikẹ́ni kọ̀wé sí yín”
  alternative: “kí àwa kọ̀wé sí yín”
  rationale: Bí ó tilẹ̀ jẹ́ pé Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ lè jẹ́ àwọn tí ọ̀rọ̀ náà ń tọ́ka sí nínú àyíká, Gíríìkì kò sọ “àwa” ní gbangba; ìtumọ̀ yìí pa àìsọ pàtó náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tó bá jẹ́ àdánidá, pẹ̀lú ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ/ẹ̀yin” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, kì í ṣe àmì ọ̀wọ̀ fún ẹnì kan ṣoṣo.
