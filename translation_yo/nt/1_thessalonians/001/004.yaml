id: 1TH.1.4
reference: 1 Thessalonians 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδότες, ἀδελφοὶ ἠγαπημένοι ὑπὸ ⸀θεοῦ, τὴν ἐκλογὴν ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/004.yaml
  text: For we know[a], brothers loved by God, your election[b],
translation:
  language: yo
  text: Nítorí a mọ̀, ẹ̀yin arákùnrin tí Ọlọ́run fẹ́ràn[a], ìyàn yín[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin tí Ọlọ́run fẹ́ràn.” Gíríìkì sọ pé “arákùnrin,” ṣùgbọ́n nínú àwọn lẹ́tà Paulu, ọ̀rọ̀ yìí sábà máa ń bá gbogbo àwọn onígbàgbọ́ nínú ìjọ sọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí a ṣe yàn yín.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀-orúkọ fún “ìyàn” tàbí “yíyan”; kò yẹ kí a fi ìtumọ̀ rẹ̀ mọ́ ẹ̀kọ́ ìsìn kan pàtó ju ohun tí àyọkà fúnra rẹ̀ sọ lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: Nítorí a mọ̀
  rationale: Ọ̀rọ̀ náà jẹ́ participle ní Gíríìkì (‘ní mímọ̀’), ó sì ń tẹ̀ síwájú láti inú ẹsẹ̀ 3. Fífi í ṣe gbólóhùn pẹ̀lú ‘Nítorí a mọ̀’ jẹ́ Yorùbá àdánidá, ó sì pa ìṣàn àlàyé Paulu mọ́.
- source_word: ἀδελφοὶ
  choice: ẹ̀yin arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, nítorí náà ‘ẹ̀yin arákùnrin’ pa ìrísí rẹ̀ mọ́. Nínú àwọn lẹ́tà Paulu, ó sábà máa ń tọ́ka sí gbogbo ìjọ, àwọn ọkùnrin àti obìnrin; àlàyé ìsàlẹ̀ ni a fi ṣàlàyé èyí.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: tí Ọlọ́run fẹ́ràn
  rationale: Perfect passive participle náà ń fi ipò tí ó dúró látàrí ìfẹ́ Ọlọ́run hàn. ‘Tí Ọlọ́run fẹ́ràn’ ṣe kedere, ó jẹ́ Yorùbá òde òní, ó sì pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùṣe.
- source_word: ἐκλογὴν
  choice: ìyàn
  rationale: ‘Ìyàn’ jẹ́ ọ̀rọ̀-orúkọ tí ó túmọ̀ sí yíyan tàbí election, ó sì pa ìwúwo ọ̀rọ̀ Gíríìkì náà mọ́ láì sọ ọ́ di ẹ̀kọ́ ìsìn kan pàtó.
- source_word: ὑμῶν
  choice: yín
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún possessive genitive ọ̀pọ̀ tí ó ń ṣàlàyé ‘ìyàn’.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἐκλογή nínú ọ̀rọ̀ tí àwọn èrò ẹ̀kọ́ ìsìn yà síra lórí rẹ̀
  choice: ìyàn yín
  alternative: bí a ṣe yàn yín; yíyan tí Ọlọ́run yan yín
  rationale: ‘Ìyàn yín’ pa ọ̀rọ̀-orúkọ àti àìṣe-kedere tó wà nínú Gíríìkì mọ́. Kò fi èrò Calvinist tàbí Arminian kún ohun tí ẹsẹ̀ náà sọ.
- issue: Bóyá kí ἀδελφοί jẹ́ ọ̀rọ̀ tí ó sọ ọkùnrin àti obìnrin ní pàtó nínú àyọkà pàtàkì
  choice: ẹ̀yin arákùnrin
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: A pa irú akọ ọ̀pọ̀ ti Gíríìkì mọ́ nínú àyọkà, ṣùgbọ́n a ṣàlàyé nínú àlàyé ìsàlẹ̀ pé nínú lílò Paulu ó sábà kan gbogbo àwọn onígbàgbọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọ ‘ẹ̀yin’ mú àdírẹ́sì náà ṣe kedere, ‘tí Ọlọ́run fẹ́ràn’ sì jẹ́ ọ̀rọ̀ òde òní tí ó ní iyì. A fi kọ́mà sí òpin nítorí pé ẹsẹ̀ náà ń bá gbólóhùn tó gùn jù lọ lọ.
