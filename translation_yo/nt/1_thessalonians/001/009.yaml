id: 1TH.1.9
reference: 1 Thessalonians 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: yo
  text: Nítorí àwọn fúnra wọn ń ròyìn nípa wa irú ìwọlé tí a ní sí ọ̀dọ̀ yín, àti bí ẹ ṣe yí sí Ọlọ́run kúrò nínú àwọn òrìṣà láti máa sin Ọlọ́run alààyè àti tòótọ́[a][b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “irú bí wọ́n ṣe gba wa nígbà tí a dé sí ọ̀dọ̀ yín.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “irú ìwọlé tí a ní sí ọ̀dọ̀ yín,” ó sì lè tọ́ka sí bí dídé Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ ṣe rí àti ipa tí ó ní.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí ẹ ṣe yípadà sí Ọlọ́run kúrò nínú àwọn òrìṣà.”
    reason: alternative_reading
  - marker: c
    text: “Ọlọ́run alààyè àti tòótọ́” ṣe ìyàtọ̀ láàárín Ọlọ́run àti àwọn òrìṣà tí kò ní ìyè; wo Jeremáyà 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: àwọn fúnra wọn
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, pé àwọn ẹlòmíràn fúnra wọn ni wọ́n ń ròyìn náà.
- source_word: ἀπαγγέλλουσιν
  choice: ń ròyìn
  rationale: Ó fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì bá ìtumọ̀ jíjíṣẹ́ tàbí títan ìròyìn ká mu.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: irú bí wíwọlé wa sí ọ̀dọ̀ yín ti rí
  rationale: Ó dúró sún mọ́ àwòrán ‘ìwọlé/wíwọlé’ inú Gíríìkì, nígbà tí ó tún jẹ́ Yorùbá àdánidá fún bí dídé wọn sí ọ̀dọ̀ àwọn ará Tẹsalóníkà ṣe rí àti ipa rẹ̀.
- source_word: πῶς ἐπεστρέψατε
  choice: bí ẹ ti yípadà
  rationale: ‘Yípadà’ pa àwòrán ìyípadà ọ̀nà mọ́, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn tó ti di ọ̀rọ̀ amọ̀ṣẹ́ kan lé e lórí.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: kúrò lọ́dọ̀ àwọn òrìṣà sí Ọlọ́run
  rationale: Ìṣètò yìí sọ ibi tí wọ́n ti yí kúrò àti ẹni tí wọ́n yí sí ní kedere; bí ó tilẹ̀ jẹ́ pé Gíríìkì kọ́kọ́ mẹ́nuba Ọlọ́run, Yorùbá yìí ń ṣàn lọ́nà àdánidá.
- source_word: εἰδώλων
  choice: àwọn òrìṣà
  rationale: Nínú àyíká Yorùbá, ‘òrìṣà’ jẹ́ ọ̀rọ̀ tí ó ṣe kedere fún àwọn ohun tàbí ọlọ́run tí ènìyàn ń bọ̀ ní àtakò sí Ọlọ́run alààyè; ọ̀pọ̀ ‘àwọn’ bá εἰδώλων mu.
- source_word: δουλεύειν
  choice: láti máa sin
  rationale: Ó sọ iṣẹ́ ìfọkànsìn tí ó tẹ̀ síwájú hàn, ó sì pa ìtumọ̀ iṣẹ́ ìránṣẹ́ mọ́ láìmú ‘ẹrú’ wọlé ju bí àyíká ṣe béèrè lọ.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: Ọlọ́run alààyè àti òtítọ́
  rationale: Ó jẹ́ gbolohun Yorùbá tó bójú mu, tí ó sì mú ìyàtọ̀ láàárín Ọlọ́run àti àwọn òrìṣà tí kò ní ìyè, tí kì í sì í ṣe òtítọ́, hàn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé tí ẹsẹ yìí ní pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìyípadà nínú ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: bí ẹ ti yípadà kúrò lọ́dọ̀ àwọn òrìṣà sí Ọlọ́run
  alternative: bí a ṣe yí yín padà kúrò lọ́dọ̀ àwọn òrìṣà sí Ọlọ́run
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ active, ó sì ṣàpèjúwe ìyípadà àwọn olùgbọ́ fúnra wọn. A pa àwòrán yíyípadà mọ́ láìyanju ìbéèrè ẹ̀kọ́ ìsìn nípa ìṣe Ọlọ́run àti ìdáhùn ènìyàn.
- issue: Agbára δουλεύειν nípa iṣẹ́ sí Ọlọ́run
  choice: láti máa sin
  alternative: láti máa ṣe ẹrú fún Ọlọ́run
  rationale: Ọ̀rọ̀ náà wá láti inú pápá ìtumọ̀ ẹrú àti iṣẹ́ ìránṣẹ́, ṣùgbọ́n ní àyíká ìfọkànsìn yìí ‘sin’ ni ó ṣe àdánidá jù, tí kò sì mú àwòrán líle wọlé ju ẹsẹ náà lọ.
- issue: Ìyàtọ̀ tí ‘Ọlọ́run alààyè àti òtítọ́’ ń ṣe
  choice: Pa gbolohun náà mọ́ gẹ́gẹ́ bí àpèjúwe Ọlọ́run
  alternative: Ọlọ́run, ẹni tí ó wà láàyè tí ó sì jẹ́ Ọlọ́run tòótọ́
  rationale: Ẹ̀dà kúkúrú pa ìwọ̀n àti ìdánimọ̀ Gíríìkì mọ́, ó sì jẹ́ kí ìtakora rẹ̀ sí àwọn òrìṣà tí kò ní ìyè dúró kedere.
translation_notes:
  register: Yorùbá ìṣàkóso tó ní iyì, tó ṣe àdánidá fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, ‘àwọn òrìṣà’ fún εἴδωλα, àti ‘sin’ fún δουλεύειν. Gbolohun ‘wíwọlé wa sí ọ̀dọ̀ yín’ pa àwòrán orísun mọ́; àlàyé ẹsẹ̀-isàlẹ̀ fúnni ní ẹ̀dà tó dojú kọ́ ìtẹ́wọ́gbà.
