  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: yo
  text: Tó bẹ́ẹ̀ tí ẹ fi di àpẹẹrẹ fún gbogbo àwọn onígbàgbọ́ ní Makedóníà àti ní Akaíà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwòṣe” tàbí “ìlànà tí a lè tẹ̀ lé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde ohun tí ẹsẹ tó ṣáájú sọ hàn; gbolohun yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì pa agbára ìtẹ̀síwájú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: γενέσθαι
  choice: ẹ di
  rationale: Ọ̀rọ̀ àìnípẹ̀kun aorist lẹ́yìn ὥστε ń sọ àbájáde; ‘ẹ di’ túmọ̀ ọ́ ní Yorùbá tó ṣe kedere.
- source_word: ὑμᾶς
  choice: ẹ
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni; ‘ẹ’ jẹ́ ọ̀nà àdánidá láti tọ́ka sí gbogbo ìjọ Tẹsalóníkà.
- source_word: τύπον
  choice: àpẹẹrẹ
  rationale: Níhìn-ín, τύπος túmọ̀ sí àwòrán ìwà tí àwọn ẹlòmíràn lè tẹ̀ lé; ‘àpẹẹrẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: fún gbogbo àwọn onígbàgbọ́
  rationale: Participle náà dúró bí orúkọ fún àwọn tí wọ́n gbàgbọ́; ‘fún’ fi ẹgbẹ́ tí àpẹẹrẹ náà wà fún hàn.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: ní Makedóníà
  rationale: Ó jẹ́ gbólóhùn ibi tí ó dárúkọ agbègbè Makedóníà.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: àti ní Akaíà
  rationale: Ó so agbègbè kejì pọ̀ mọ́ ti àkọ́kọ́, ó sì tún ‘ní’ ṣe gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
