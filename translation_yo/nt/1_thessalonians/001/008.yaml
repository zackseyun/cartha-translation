  to: Nítorí láti ọ̀dọ̀ yín ni ọ̀rọ̀ Olúwa ti dún jáde, kì í ṣe ní Makedóníà àti Akaíà nìkan, ṣùgbọ́n ní gbogbo ibi ni ìgbàgbọ́ yín sí Ọlọ́run ti tàn ká, tó fi jẹ́ pé àwa kò nílò láti sọ ohunkóhun.[a]
