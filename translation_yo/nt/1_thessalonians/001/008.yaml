id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: yo
  text: Nítorí láti ọ̀dọ̀ yín ni ọ̀rọ̀ Olúwa ti dún jáde, kì í ṣe ní Makedóníà àti Akaíà nìkan, ṣùgbọ́n ní gbogbo ibi ni ìgbàgbọ́ yín sí Ọlọ́run ti tàn ká, tó fi jẹ́ pé àwa kò nílò láti sọ ohunkóhun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀, Gíríìkì ní, “ìgbàgbọ́ yín sí Ọlọ́run”; ó tún lè túmọ̀ sí “ìgbàgbọ́ yín nínú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: ti dún jáde
  rationale: Ó pa àwòrán ohun tí ń dún kálẹ̀ mọ́, ó sì fi àbájáde tí perfect Greek ní hàn.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ọ̀rọ̀ Olúwa
  rationale: Ó pa gbólóhùn Pọ́ọ̀lù mọ́, ó sì jẹ́ kí genitive náà lè túmọ̀ sí ọ̀rọ̀ tí ó ti ọ̀dọ̀ Olúwa wá tàbí ọ̀rọ̀ nípa Olúwa.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Makedóníà àti Akaíà
  rationale: Àkọsílẹ̀ orúkọ agbègbè náà ní ìbámu pẹ̀lú ìró rẹ̀.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: ṣùgbọ́n ní gbogbo ibi
  rationale: Ó pa ìtumọ̀ distributive παντί àti ọ̀rọ̀ ibi τόπῳ mọ́ ní Yorùbá àdánidá.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: ìgbàgbọ́ yín sí Ọlọ́run
  rationale: “Sí Ọlọ́run” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtọ́sọ́nà πρὸς mọ́, láì sọ ọ́ di “nínú Ọlọ́run” ní dandan.
- source_word: ἐξελήλυθεν
  choice: ti tàn ká
  rationale: Ìtumọ̀ àdánidá ni fún bí ìròyìn ìgbàgbọ́ wọn ṣe jáde dé ibi gbogbo; ó pa èrò ìtànkálẹ̀ mọ́ bí ó tilẹ̀ jẹ́ pé kò tẹ̀ lé àwòrán ìṣípò Greek ní ọ̀rọ̀ sí ọ̀rọ̀.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: tó bẹ́ẹ̀ tí kò fi sí ohun kan tí àwa nílò
  rationale: Ó fi abajade ὥστε hàn ní Yorùbá tó ṣe kedere.
- source_word: λαλεῖν τι
  choice: láti sọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ‘láti sọ ohunkóhun,’ nígbà tí àyíká gbólóhùn ti sọ àìní náà di mímọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ìdáhùn àwọn ará Tẹsalóníkà sí Ọlọ́run; “ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù, tí kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún un.
- issue: Ìbáṣepọ̀ πρὸς τὸν θεόν
  choice: sí Ọlọ́run
  alternative: nínú Ọlọ́run
  rationale: “Sí” pa ìtọ́sọ́nà gangan ti πρὸς mọ́, ó sì yẹra fún pípa àìdájú kékeré yẹn rẹ́; àlàyé ẹsẹ̀ ìsàlẹ̀ tọ́ka sí ìtumọ̀ àdánidá mìíràn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan “ti dún jáde” láti pa àwòrán ìró mọ́, ṣùgbọ́n “ti tàn ká” fún ìgbàgbọ́ jẹ́ àdánidá ju títúmọ̀ ìṣípò Greek ní líle lọ.
