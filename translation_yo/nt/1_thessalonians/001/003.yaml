id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: yo
  text: nígbà tí a ń rántí iṣẹ́ ìgbàgbọ́ yín[a], làálàá ìfẹ́ yín, àti ìfaradà ìrètí yín nínú Olúwa wa Jésù Mèsáyà[b], níwájú Ọlọ́run àti Baba wa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú “ìgbàgbọ́” sí “ìdúróṣinṣin” tàbí “ìgbẹ́kẹ̀lé.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ni Χριστός, tí a sábà máa ń pè ní “Kristi”; níbí a túmọ̀ rẹ̀ sí “Mèsáyà” nítorí pé ó jẹ́ oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: nígbà tí a ń rántí
  rationale: Ó pa ìṣe tí ń bá a lọ mọ́, ó sì so gbólóhùn náà mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí participle Gíríìkì náà ti ṣe.
- source_word: ἔργου τῆς πίστεως
  choice: iṣẹ́ ìgbàgbọ́ yín
  rationale: Ó pa àwòrán ‘iṣẹ́’ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ìgbàgbọ́ mọ́ láì fi tipátipá pinnu bóyá genitive náà túmọ̀ sí orísun, àbùdá, tàbí ohun tí ń mú iṣẹ́ náà jáde.
- source_word: κόπου τῆς ἀγάπης
  choice: làálàá ìfẹ́ yín
  rationale: ‘Làálàá’ mú ìtumọ̀ iṣẹ́ líle inú κόπος jáde, nígbà tí àkójọpọ̀ ọ̀rọ̀ náà pa ìṣọ̀kan ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: ìfaradà ìrètí yín
  rationale: ‘Ìfaradà’ sọ agbára láti dúró ṣinṣin lábẹ́ ìṣòro; a kò fi ọ̀rọ̀ míì kún un láti yanjú ìbáṣepọ̀ genitive náà ju bó ṣe wà lọ.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nínú Olúwa wa Jésù Mèsáyà
  rationale: ‘Nínú’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìrètí tí a gbé lé ẹnì kan hàn. ‘Mèsáyà’ pa Χριστός mọ́ gẹ́gẹ́ bí oyè, kì í ṣe bí orúkọ lásán.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: níwájú Ọlọ́run wa àti Baba wa
  rationale: ‘Níwájú’ jẹ́ ìtumọ̀ tó ṣe kedere fún ἔμπροσθεν; ṣíṣe ‘wa’ lẹ́ẹ̀mejì mú kó ṣe kedere ní Yorùbá pé Ọlọ́run náà ni Baba wa.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tó bójú mu ní àyíká yìí, ṣùgbọ́n πίστις lè ní ìfarahàn ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé; a pa àwọn wọ̀nyí mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ fi ìtumọ̀ oyè náà hàn, nígbà tí ‘Kristi,’ ìtumọ̀ tí ó wọ́pọ̀ nínú Bíbélì Yorùbá, wà nínú àlàyé ìsàlẹ̀.
- issue: 'Ìbáṣepọ̀ àwọn genitive: πίστεως, ἀγάπης, ἐλπίδος'
  choice: àkójọpọ̀ orúkọ tí kò yanjú ìbáṣepọ̀ náà pátápátá
  alternative: iṣẹ́ tí ìgbàgbọ́ mú jáde; làálàá tí ìfẹ́ mú jáde; ìfaradà tí ìrètí mú jáde
  rationale: Ó ṣeé ṣe kí àwọn genitive náà tọ́ka sí orísun tàbí àbùdá, ṣùgbọ́n ìtumọ̀ Yorùbá náà pa àyè ìtumọ̀ yẹn sílẹ̀ dípò fífi ìtumọ̀ kan ṣoṣo múlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu fún ìtẹ̀jáde Bíbélì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A pa ìlànà mẹ́ta Pọ́ọ̀lù mọ́—iṣẹ́, làálàá, àti ìfaradà—àti pé ẹsẹ yìí ń tẹ̀ síwájú láti inú ẹsẹ tó ṣáájú.
