id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: yo
  text: Ẹ̀yin pẹ̀lú sì di aláfarawé wa àti ti Olúwa, nígbà tí ẹ gba ọ̀rọ̀ náà láàrín ìpọ́njú púpọ̀ pẹ̀lú ayọ̀ láti ọ̀dọ̀ Ẹ̀mí Mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ayọ̀ Ẹ̀mí Mímọ́,” ìyẹn ni, ayọ̀ tí Ẹ̀mí Mímọ́ mú wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ
  choice: aláfarawé
  rationale: Ó túmọ̀ sí àwọn tí ń fara wé àpẹẹrẹ ẹlòmíràn; ‘aláfarawé’ pa èdè ìfarawé Paulu mọ́ ju ọ̀rọ̀ gbogbogbò bí ‘ọmọlẹ́yìn’ lọ.
- source_word: ἐγενήθητε
  choice: di
  rationale: 'Ó fi ìyípadà ipò hàn: àwọn ará Tẹsalóníkà di aláfarawé.'
- source_word: τοῦ κυρίου
  choice: ti Olúwa
  rationale: ‘Olúwa’ jẹ́ àkọ́lé fún Jésù níbí, ó sì bá ìlò Kristẹni Yorùbá tí ó fìdí múlẹ̀ mu.
- source_word: δεξάμενοι
  choice: nígbà tí ẹ gba
  rationale: Gbólóhùn yìí sọ ipò tàbí ọ̀nà tí wọ́n fi di aláfarawé; ó jẹ́ Yorùbá àdánidá fún participle aorist náà.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó pa àṣà ọ̀rọ̀ Paulu mọ́, nígbà tí àyíká fi hàn pé ó ń tọ́ka sí iṣẹ́ ìwàásù ìhìn rere.
- source_word: ἐν θλίψει πολλῇ
  choice: láàrín ìpọ́njú púpọ̀
  rationale: ‘Ìpọ́njú’ mú ìtumọ̀ ìṣòro, ìnilára, àti ìyà tí θλῖψις ní jáde láìfi ìtumọ̀ ọjọ́ ìkẹyìn kún un.
- source_word: μετὰ χαρᾶς
  choice: pẹ̀lú ayọ̀
  rationale: Ìtumọ̀ tààrà àti àdánidá ni fún Yorùbá.
- source_word: πνεύματος ἁγίου
  choice: láti ọ̀dọ̀ Ẹ̀mí Mímọ́
  rationale: Genitive náà lè tọ́ka sí orísun ayọ̀; yíyan yìí sọ ní Yorùbá àdánidá pé Ẹ̀mí Mímọ́ ni orísun ayọ̀ náà, nígbà tí àlàyé ìsàlẹ̀ pa àìdánilójú gírámà mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ genitive nínú χαρᾶς πνεύματος ἁγίου
  choice: ayọ̀ láti ọ̀dọ̀ Ẹ̀mí Mímọ́
  alternative: ayọ̀ Ẹ̀mí Mímọ́; ìyẹn ni, ayọ̀ tí Ẹ̀mí Mímọ́ mú wá
  rationale: Àyíká fi ayọ̀ yìí dojú kọ ìpọ́njú púpọ̀, nítorí náà ìtumọ̀ orísun ṣeé ṣe gan-an; ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ìbáṣepọ̀ genitive náà má bàa di ohun tí a pinnu kọjá ohun tí Gíríìkì sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti kíkà-rọrùn ni a lò. Àwọn àmì ohùn ni a fi sí ibi tí ó jẹ́ àdánidá. ‘Aláfarawé’ pa àwòrán ìfarawé inú Gíríìkì mọ́; ‘láàrín ìpọ́njú púpọ̀’ sì dun bí Yorùbá ju ìtumọ̀ ọ̀rọ̀-ní-ọ̀rọ̀ lọ.
