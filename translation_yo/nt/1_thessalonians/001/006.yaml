  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ‘Ẹ̀yin pẹ̀lú sì di’ ń fi καὶ ὑμεῖς ἐγενήθητε hàn; ‘aláfarawé wa àti ti Olúwa’ ń pa ìfarawé àwọn aposteli àti Olúwa mọ́; ‘nígbà tí ẹ gba ọ̀rọ̀ náà’ ń ṣàfihàn participle δεξάμενοι láìsọ ìbáṣepọ̀ rẹ̀ di ohun tó ju ohun tí ọ̀rọ̀ Gíríìkì béèrè lọ. ‘Láàrín ìpọ́njú púpọ̀’ yẹ fún ἐν θλίψει πολλῇ. ‘Ayọ̀ láti ọ̀dọ̀ Ẹ̀mí Mímọ́’ jẹ́ ìtumọ̀ orísun tí ó ṣeé gbà fún genitive náà, tí àlàyé ìsàlẹ̀ sì ń pa ìtumọ̀ míràn mọ́.'
  naturalness: Yorùbá náà jẹ́ èyí tí ó rọrùn, ó sì wà nínú ìforúkọsílẹ̀ Bíbélì ìgbàlódé tó bójú mu. Àmì ohùn àti ìkọ̀wé gẹ́gẹ́ bí ‘Ẹ̀yin,’ ‘ìpọ́njú,’ ‘ayọ̀,’ àti ‘Ẹ̀mí Mímọ́’ wà ní ìlò tó yẹ. ‘Aláfarawé’ jẹ́ ọ̀rọ̀ tó dára àti tó ṣe kedere nínú àyíká yìí.
  terminology: ‘Olúwa’ àti ‘Ẹ̀mí Mímọ́’ bá ọ̀rọ̀ ìsìn Kristẹni Yorùbá tí a ti fìdí múlẹ̀ mu. ‘Ọ̀rọ̀ náà’ dá ìròyìn ìwàásù/ìhìn rere ti λόγος hàn láìfi ìtumọ̀ àlàyé kún un. Àlàyé ìsàlẹ̀ náà wà níbi tí ó tọ́—lẹ́yìn gbólóhùn nípa Ẹ̀mí Mímọ́—ó sì ṣàlàyé ìyàtọ̀ genitive náà láìpa ìbùdó ìtumọ̀ kan mọ́.
