id: 1TH.1.10
reference: 1 Thessalonians 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: yo
  text: àti láti máa dúró de Ọmọ rẹ̀ láti ọ̀run[a], ẹni tí Ọlọ́run jí dìde kúrò láàárín àwọn òkú—Jésù, ẹni tí ń gbà wá là kúrò lọ́wọ́ ìbínú tí ń bọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù, ẹni tí ń yọ wá kúrò lọ́wọ́ ìbínú tí ń bọ̀.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ῥυόμενον; ‘yọ ... kúrò lọ́wọ́’ lè rọ́pò ‘gbà ... là’ láìfi tense ọjọ́ iwájú kún participle náà.
lexical_decisions:
- source_word: ἀναμένειν
  choice: láti máa dúró de
  rationale: Ọ̀rọ̀ yìí fi ìdúró pẹ̀lú ìrètí hàn, ó sì ń bá àkóónú ẹsẹ 9 lọ. ‘Máa dúró de’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìretí ohun tí ń bọ̀.
- source_word: υἱὸν αὐτοῦ
  choice: Ọmọ rẹ̀
  rationale: Ìtumọ̀ tààrà yìí pa oyè Kristi gẹ́gẹ́ bí Ọmọ Ọlọ́run mọ́ láìfikún àlàyé tí kò sí nínú Gíríìkì.
- source_word: ἐκ τῶν οὐρανῶν
  choice: láti ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀, ‘láti ọ̀run’ ni ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́ ní àyíká yìí.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: ẹni tí Ọlọ́run jí dìde kúrò láàárín àwọn òkú
  rationale: A tún orúkọ ‘Ọlọ́run’ sọ dípò arọ́pò-orúkọ kí ó lè ṣe kedere ní Yorùbá pé Ọlọ́run ló jí Jésù dìde. ‘Kúrò láàárín àwọn òkú’ pa agbára ἐκ τῶν νεκρῶν mọ́.
- source_word: Ἰησοῦν
  choice: Jésù
  rationale: A lo ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: τὸν ῥυόμενον
  choice: ẹni tí ń gbà wá là
  rationale: Gbólóhùn ìbátan yìí jẹ́ àdánidá ní Yorùbá, ó sì fi Jésù hàn gẹ́gẹ́ bí ẹni tí ń gba ènìyàn là, láìyí participle náà sí ọ̀rọ̀ ọjọ́ iwájú nìkan.
- source_word: ἐκ τῆς ὀργῆς
  choice: kúrò lọ́wọ́ ìbínú
  rationale: ‘Ìbínú’ pa ìtumọ̀ ὀργή mọ́ dáadáa ju ọ̀rọ̀ gbòòrò bí ‘ìdájọ́’ lọ; ‘kúrò lọ́wọ́’ sì jẹ́ àsọyé Yorùbá àdánidá fún ìgbàlà kúrò nínú ewu tàbí agbára ohun kan.
- source_word: τῆς ἐρχομένης
  choice: tí ń bọ̀
  rationale: Ó fi hàn pé ìbínú náà ń bọ̀, láìsọ ohun tí ẹsẹ náà kò sọ nípa àkókò tàbí ìrísí rẹ̀.
theological_decisions:
- issue: Irú ‘ìbínú tí ń bọ̀’
  choice: A pa ‘ìbínú tí ń bọ̀’ mọ́ láìsọ pé ó jẹ́ ìdájọ́ ìkẹyìn, ìpọ́njú ìgbà ìkẹyìn, tàbí irú ìbínú Ọlọ́run mìíràn kan pàtó.
  alternative: ‘Ìdájọ́ tí ń bọ̀,’ tàbí fífi ọ̀rọ̀ náà mọ́ ètò ìṣẹ̀lẹ̀ ìgbà ìkẹyìn kan pàtó.
  rationale: Ẹsẹ náà ní agbára ẹ̀kọ́ ìgbà ìkẹyìn, ṣùgbọ́n kò fúnra rẹ̀ sọ irú ìṣẹ̀lẹ̀ náà ní pàtó. Ìtumọ̀ yìí pa àìdánilójú tó wà nínú orísun mọ́.
- issue: Agbára present participle ῥυόμενον
  choice: ‘ẹni tí ń gbà wá là’
  alternative: ‘ẹni tí yóò gbà wá là’
  rationale: Ọ̀rọ̀ Gíríìkì lè ṣàpèjúwe Jésù gẹ́gẹ́ bí Olùgbàlà láìdì í mọ́ ọjọ́ iwájú nìkan. Bí ó tilẹ̀ jẹ́ pé ‘ìbínú tí ń bọ̀’ ń tọ́ka sí ọjọ́ iwájú, a kò fi tense ọjọ́ iwájú kún ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa ìṣàn infinitive láti ẹsẹ 9 mọ́ nípasẹ̀ ‘àti láti,’ a sì lo ‘máa dúró de’ fún ìdúró onírètí.
