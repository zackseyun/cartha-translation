source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: yo
  text: Àwa máa ń dúpẹ́ lọ́wọ́ Ọlọ́run ní gbogbo ìgbà nítorí gbogbo yín, nígbà tí a ń mẹ́nu kàn sí yín nínú àwọn àdúrà wa láìdáwọ́dúró,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwa máa ń dúpẹ́ lọ́wọ́ Ọlọ́run láìdáwọ́dúró ní gbogbo ìgbà nítorí gbogbo yín.” “Láìdáwọ́dúró” lè ṣàlàyé mímẹ́nu kàn sí yín nínú àdúrà ní pàtó, tàbí gbogbo gbólóhùn ìdúpẹ́ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: àwa ń dúpẹ́ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí, ẹni àkọ́kọ́ ọ̀pọ̀; “dúpẹ́ lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a fi ọpẹ́ fún ẹni kan.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Dátífù náà tọ́ka sí ẹni tí ọpẹ́ ń lọ sí; àkópọ̀ “dúpẹ́ lọ́wọ́ Ọlọ́run” mú ìbáṣepọ̀ yìí hàn ní Yorùbá àdánidá.
- source_word: πάντοτε
  choice: Nígbà gbogbo
  rationale: Ó pa ìtumọ̀ àkókò náà mọ́ ní èdè Yorùbá tí ó ṣe kedere, ó sì bá ìṣe tí ń tẹ̀ síwájú mu.
- source_word: περὶ πάντων ὑμῶν
  choice: nítorí gbogbo yín
  rationale: περί pẹ̀lú jenítífù ń fi ohun tí ọpẹ́ náà dá lé hàn; “nítorí” jẹ́ àdánidá nínú ọ̀rọ̀ fífi ọpẹ́, “gbogbo yín” sì pa ìkó gbogbo wọn mọ́.
- source_word: μνείαν ποιούμενοι
  choice: tí a sì ń dárúkọ yín
  rationale: Ó pa àpèjúwe Gíríìkì ti ‘ṣíṣe ìrántí/ìdárúkọ’ mọ́, ó sì ṣe kedere pé àwọn onígbàgbọ́ náà ni a ń mẹ́nu kàn nínú àdúrà.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: nínú àdúrà wa
  rationale: “Nínú àdúrà wa” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìtumọ̀ pé nígbà tàbí nínú ṣíṣe àdúrà.
- source_word: ἀδιαλείπτως
  choice: láìdáwọ́ dúró
  rationale: Ó fi ìtẹ̀síwájú tàbí ìfaradà tí ọ̀rọ̀ Gíríìkì ní hàn ní ọ̀nà tí àwọn òǹkàwé Yorùbá òde òní lóye ní rọrùn.
theological_decisions:
- issue: Ohun tí ἀδιαλείπτως ń ṣàlàyé
  choice: A fi sí ìparí gbolohun lẹ́yìn ọ̀rọ̀ nípa àdúrà, níbi tí ó lè sún mọ́ ‘ń dárúkọ yín’ jù.
  alternative: Ó lè ṣàlàyé fífi ọpẹ́ fún Ọlọ́run lápapọ̀.
  rationale: Ipò ọ̀rọ̀ Gíríìkì jẹ́ kí ó ṣeé ṣe kí adverb náà bá mímẹ́nu kàn nínú àdúrà tàbí gbogbo gbólóhùn fífi ọpẹ́ tan; àkọsílẹ̀ ìsàlẹ̀ pa àìdánilójú gidi yìí mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé lásán; “àwa” ni a fi hàn láti tẹnumọ́ ẹni àkọ́kọ́ ọ̀pọ̀, bí Gíríìkì ṣe ń tọ́ka sí i.
