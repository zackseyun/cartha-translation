id: 1TH.1.1
reference: 1 Thessalonians 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: yo
  text: 'Pọ́ọ̀lù àti Sílífánù àti Tímótì, sí ìjọ[a] àwọn ará Tẹsalóníkà, tí ó wà nínú Ọlọ́run Baba àti Olúwa Jésù Mèsáyà[b]: Oore-ọ̀fẹ́ fún yín àti àlàáfíà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àpéjọ.” Ọ̀rọ̀ Gíríìkì ἐκκλησία ń tọ́ka sí àwùjọ tí a pè jọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Jésù Kristi.” A túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” níbí láti pa ìtumọ̀ oyè náà mọ́; ọ̀pọ̀ ìtumọ̀ ń kọ ọ́ sí “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Ìkọ̀wé orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe Paul ní Yorùbá òde òní.
- source_word: Σιλουανὸς
  choice: Sílífánù
  rationale: A tẹ̀ lé orúkọ Gíríìkì Σιλουανός ní tààrà dípò lílo Sílà, èyí tí ó dúró fún ìrísí orúkọ Gíríìkì mìíràn.
- source_word: Τιμόθεος
  choice: Tímótì
  rationale: Èyí ni ìrísí Yorùbá tí ó wọ́pọ̀, tí ó sì ṣeé lóye fún orúkọ Timoti.
- source_word: ἐκκλησίᾳ
  choice: ìjọ
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwùjọ àwọn onígbàgbọ́ tí a pè jọ; “àpéjọ” tún ṣeé ṣe, ṣùgbọ́n kò wọ́pọ̀ tó nínú àyíká lẹ́tà yìí.
- source_word: Θεσσαλονικέων
  choice: àwọn ará Tẹsalóníkà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn ìlú Tẹsalóníkà, kì í ṣe ìlú náà nìkan.
- source_word: ἐν
  choice: nínú
  rationale: “Nínú” pa èrò ìbáṣepọ̀ tàbí ààyè ìwà tí ἐν ní mọ́ láì túmọ̀ rẹ̀ sí “tí ó jẹ́ ti” lọ́nà ìtumọ̀ àfikún.
- source_word: θεῷ πατρὶ
  choice: Ọlọ́run Baba
  rationale: A kò fi “wa” kún un, nítorí kò sí ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní bẹ́ẹ̀ nínú Gíríìkì.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá àdánidá àti ọ̀wọ̀ fún κύριος ní àyíká yìí.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jésù Mèsáyà
  rationale: “Mèsáyà” fi ìtumọ̀ oyè Χριστός hàn dípò kí a kàn kọ ọ́ gẹ́gẹ́ bí orúkọ “Kristi.”
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó yẹ fún χάρις, ó sì pa ìró ìkíni Páùlù mọ́.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” gbé ìtumọ̀ ìbàlẹ̀ ọkàn àti àlàáfíà inú ìkíni náà jáde.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Oore-ọ̀fẹ́ fún yín àti àlàáfíà
  rationale: Ìtòlẹ́sẹẹsẹ yìí pa ipò ὑμῖν lẹ́yìn χάρις mọ́, ó sì ṣì jẹ́ Yorùbá tó ṣeé lóye.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ìkíni náà
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ṣì lè ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi “Kristi” hàn gẹ́gẹ́ bí ìrísí tí ó tún wọ́pọ̀.
- issue: Ìbáṣepọ̀ tí ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ ń sọ
  choice: ìjọ náà wà “nínú” Ọlọ́run Baba àti Olúwa Jésù Mèsáyà
  alternative: ìjọ náà jẹ́ ti Ọlọ́run Baba àti Olúwa Jésù Mèsáyà
  rationale: A pa “nínú” mọ́ kí a má bàa sọ ìbáṣepọ̀ náà di ohun-ìní nìkan tàbí yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan níbi tí Gíríìkì ti ṣì ní ìfẹ̀hónúhàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti bá èdè mu. A fi “tí ó wà” kún gẹ́gẹ́ bí ohun èlò gírámà Yorùbá láti so ìjọ pọ̀ mọ́ gbólóhùn “nínú Ọlọ́run…,” láì yí ìbáṣepọ̀ ἐν padà. A pa ìtẹ̀lé “àti… àti…” ti orísun mọ́ nínú àkọsílẹ̀ àwọn olùránṣẹ́.
