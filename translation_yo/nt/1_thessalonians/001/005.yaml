id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: yo
  text: nítorí ìhìn rere wa kò dé ọ̀dọ̀ yín ní ọ̀rọ̀ nìkan, ṣùgbọ́n ó tún dé pẹ̀lú agbára, pẹ̀lú Ẹ̀mí Mímọ́, àti pẹ̀lú ìdánilójú púpọ̀[a]; gẹ́gẹ́ bí ẹ ti mọ irú ènìyàn tí àwa di láàárín yín nítorí yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pẹ̀lú ìdánilójú pípé” tàbí “pẹ̀lú ìdánilójú ńlá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “irú àwọn ènìyàn tí a fi ara wa hàn pé a jẹ́ láàárín yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: “Ìhìn rere” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ti fìdí múlẹ̀ fún ìkéde ìgbàlà; ó tún pa ìtumọ̀ gangan ti εὐαγγέλιον mọ́.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: kò dé ọ̀dọ̀ yín
  rationale: Gbólóhùn yìí sọ nípa bí ìhìn rere ṣe dé bá àwọn ará Tẹsalóníkà; “dé ọ̀dọ̀ yín” jẹ́ Yorùbá àdánidá ju títúmọ̀ γίνομαι ní ọ̀rọ̀ sí ọ̀rọ̀ lọ.
- source_word: ἐν λόγῳ μόνον
  choice: ní ọ̀rọ̀ nìkan
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ọ̀rọ̀ ìkéde lásán àti iṣẹ́ agbára Ọlọ́run mọ́.
- source_word: ἐν δυνάμει
  choice: pẹ̀lú agbára
  rationale: “Pẹ̀lú agbára” jẹ́ gbólóhùn Yorùbá tó rọrùn, ó sì fi ipa ìkéde náà hàn láìsọ irú agbára náà ní pàtó ju Gíríìkì lọ.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: pẹ̀lú Ẹ̀mí Mímọ́
  rationale: Ní àyíká ọ̀rọ̀ Pọ́ọ̀lù, gbólóhùn náà ń tọ́ka sí Ẹ̀mí Mímọ́; lílo àwọn lẹ́tà ńlá sì bá ìlò Yorùbá fún orúkọ ẹni mímọ́ yìí mu.
- source_word: πληροφορίᾳ πολλῇ
  choice: pẹ̀lú ìdánilójú ńlá
  rationale: “Ìdánilójú ńlá” gbé èrò ìdánilójú tó kún fún un jáde, ṣùgbọ́n kò pinnu bóyá ìdánilójú náà jẹ́ ti àwọn oníwàásù, ti àwọn olùgbọ́, tàbí ti gbogbo bí ìhìn rere náà ṣe dé.
- source_word: καθὼς οἴδατε
  choice: gẹ́gẹ́ bí ẹ̀yin fúnra yín ti mọ
  rationale: Ó mú agbára ìfẹsẹ̀múlẹ̀ καθώς hàn, ó sì tẹnumọ́ pé àwọn olùgbọ́ mọ ohun tí Pọ́ọ̀lù ń sọ láti inú ìrírí wọn.
- source_word: οἷοι ἐγενήθημεν
  choice: irú ẹni tí àwa jẹ́
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú “ẹni.” Gbólóhùn yìí sọ nípa irú ìwà àti ẹni tí Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ fi ara wọn hàn pé wọ́n jẹ́, láìlo “di,” èyí tó lè túmọ̀ sí ìyípadà ipò.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó tọ́ka sí ìgbé ayé àti ìwà àwọn oníwàásù ní àárín àwọn ará Tẹsalóníkà.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: “Nítorí yín” pa àyè ìtumọ̀ mọ́ fún “nítorí ọ̀ràn yín” tàbí “fún àǹfààní yín,” láìfi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
theological_decisions:
- issue: Ẹni tí πνεύματι ἁγίῳ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́, ẹni àtọ̀runwá
  alternative: ẹ̀mí mímọ́ kan tàbí agbára ẹ̀mí lásán
  rationale: Ìlò Pọ́ọ̀lù àti ìyàtọ̀ tó wà láàárín ọ̀rọ̀ lásán àti ìkéde tó ní agbára ti Ẹ̀mí lẹ́yìn rẹ̀ ń ṣètìlẹ́yìn fún ìtọ́kasí sí Ẹ̀mí Mímọ́.
- issue: Ẹni tó ní πληροφορίᾳ πολλῇ
  choice: A kò sọ ẹni tó ní ìdánilójú náà ní pàtó
  alternative: ìdánilójú àwọn oníwàásù nìkan tàbí ti àwọn olùgbọ́ nìkan
  rationale: Gíríìkì kò sọ kókó ẹni tó ní ìdánilójú náà ní gbangba; “pẹ̀lú ìdánilójú ńlá” pa àìsọ pàtó yìí mọ́.
- issue: Ìtumọ̀ οἷοι ἐγενήθημεν
  choice: irú ẹni tí àwa jẹ́
  alternative: irú àwọn ọkùnrin tí a fi ara wa hàn pé a jẹ́; bí a ṣe hùwà
  rationale: Yorùbá kò nílò àmì akọ nínú ọ̀rọ̀ “ẹni.” Ìtumọ̀ yìí pa ìtọ́kasí sí ìwà àti ànímọ́ ẹgbẹ́ àwọn ajíhìnrere mọ́, kò sì dín ọ̀rọ̀ náà kù sí ìwà ìta nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìtòlẹ́sẹẹsẹ “pẹ̀lú … pẹ̀lú … àti pẹ̀lú …” pa ìlù àti ìtẹnumọ́ àwọn gbólóhùn ἐν mẹ́ta mọ́ ní ọ̀nà àdánidá. Ọ̀rọ̀ náà jẹ́ gbólóhùn kan gẹ́gẹ́ bí orísun Gíríìkì.
