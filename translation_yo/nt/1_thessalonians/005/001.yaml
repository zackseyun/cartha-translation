id: 1TH.5.1
reference: 1 Thessalonians 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: yo
  text: Ní ti àwọn àkókò àti àwọn àsìkò[a], ẹ̀yin ará[b], ẹ kò nílò kí a kọ ohunkóhun sí yín,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn àkókò àti àwọn àsìkò” jẹ́ àkójọpọ̀ ọ̀rọ̀ fún àwọn ìgbà tó ń kọjá àti àwọn àsìkò pàtó tí a yàn, pàápàá nínú ọ̀rọ̀ nípa ohun ọjọ́ iwájú.
    reason: cultural_note
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààrà sí “ẹ̀yin arákùnrin,” ṣùgbọ́n ó ṣeé ṣe kí ó ń pe gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ní ti
  rationale: Περὶ ṣe àgbékalẹ̀ kókó tuntun, δέ sì ń samisi ìyípadà nínú ọ̀rọ̀. “Ní ti” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti gbé kókó náà kalẹ̀ láìfi ìtumọ̀ àkókò bí “nísinsin yìí” kún un.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: àwọn àkókò àti àwọn àsìkò
  rationale: χρόνος lè tọ́ka sí bí àkókò ṣe gùn tàbí àkókò ní gbogbogbòò, nígbà tí καιρός sábà máa ń tọ́ka sí àsìkò pàtó tàbí àsìkò tí a yàn. Àkójọpọ̀ ọ̀rọ̀ yìí pa ìyàtọ̀ díẹ̀ láàárín àwọn méjèèjì mọ́, ó sì bá àyíká ọ̀rọ̀ nípa ohun ọjọ́ iwájú mu.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ἀδελφοί jẹ́ ọ̀rọ̀ akọ ní ìrísí Gíríìkì, ṣùgbọ́n ó sábà ń pe gbogbo ìjọ, ọkùnrin àti obìnrin. “Ẹ̀yin ará” ni ìkíni àdúgbò ìgbàgbọ́ tó bá èdè Yorùbá mu, tí kò sì fi abo tàbí akọ hàn; àlàyé ìrísí Gíríìkì wà nínú àlàyé ìsàlẹ̀.
- source_word: οὐ χρείαν ἔχετε
  choice: ẹ kò nílò
  rationale: Èyí túmọ̀ sí pé kò pọn dandan fún wọn. “Ẹ kò nílò” jẹ́ ọ̀rọ̀ Yorùbá adayébá tó sọ ìtumọ̀ náà ní tààrà.
- source_word: ὑμῖν γράφεσθαι
  choice: kí a kọ ohunkóhun sí yín
  rationale: Ìṣe náà wà ní àbùdá aláìlẹ́ni-tó-ṣe é nínú Gíríìkì; “kí a kọ … sí yín” jẹ́ adayébá ní Yorùbá, ó sì yàgò fún fífi ẹni pàtó bí Pọ́ọ̀lù sí i. “Ohunkóhun” mú àbájáde gbolohun náà ṣe kedere láìyí ìtumọ̀ rẹ̀ padà.
theological_decisions:
- issue: Ìkíni akọ tí a lò sí gbogbo ìjọ
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé ἀδελφοί jẹ́ ọ̀rọ̀ akọ ní ìrísí rẹ̀, lílò rẹ̀ níbí ṣeé ṣe kí ó gba gbogbo àwọn onígbàgbọ́, ọkùnrin àti obìnrin, sínú. “Ẹ̀yin ará” jẹ́ ìtumọ̀ Yorùbá adayébá tó pa iṣẹ́ ìkíni sí gbogbo àwùjọ mọ́; àlàyé ìsàlẹ̀ sì jẹ́ kí òǹkàwé mọ ìrísí ọ̀rọ̀ orísun náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. “Ní ti” samisi ìyípadà kókó láìfi “nísinsin yìí” kún orísun; “ẹ kò nílò kí a kọ…” sì pa aláìlẹ́ni-tó-ṣe ìṣe náà mọ́ ní ọ̀nà Yorùbá adayébá.
