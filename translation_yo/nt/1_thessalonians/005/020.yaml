  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: yo
  text: Ẹ má ṣe kẹ́gàn àwọn àsọtẹ́lẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọ̀rọ̀ àsọtẹ́lẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: àwọn àsọtẹ́lẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ nínú èdè Gíríìkì, ó sì ń tọ́ka sí àwọn ìṣẹ̀lẹ̀ tàbí ọ̀rọ̀ àsọtẹ́lẹ̀. “Àwọn àsọtẹ́lẹ̀” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ọ̀pọ̀ náà mọ́ láì sọ ọ́ di ẹ̀kọ́ ìjọ kan pàtó.
- source_word: μὴ
  choice: Ẹ má ṣe
  rationale: Èyí fi ìkìlọ̀ tàbí àṣẹ òdì hàn ní ọ̀nà àdánidá, ó sì bá ẹni kejì ọ̀pọ̀ mu.
- source_word: ἐξουθενεῖτε
  choice: tẹ́ńbẹ́lú
  rationale: “Tẹ́ńbẹ́lú” túmọ̀ sí kí a ka ohun sí aláìníyelórí tàbí kí a fi ẹ̀gàn hàn sí i; ó lágbára ju “kọ̀” lọ, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
theological_decisions:
- issue: Ìtumọ̀ “àwọn àsọtẹ́lẹ̀” nínú àwùjọ àwọn Kristẹni ìgbà àkọ́kọ́
  choice: A pa ọ̀rọ̀ gbòòrò náà, “àwọn àsọtẹ́lẹ̀,” mọ́.
  alternative: àwọn ọ̀rọ̀ àsọtẹ́lẹ̀; àwọn iṣẹ́ tí a sọ pé ó ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ọ̀rọ̀ Gíríìkì kò pinnu níbí bó ṣe yẹ kí a ṣàlàyé bí àsọtẹ́lẹ̀ ṣe ń ṣiṣẹ́, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ìjọ kan pàtó múlẹ̀. Ìtumọ̀ yìí pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “Ẹ” nítorí àṣẹ náà ń lọ sí gbogbo àwùjọ, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
