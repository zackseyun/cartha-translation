base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: yo
  text: Nítorí náà, ẹ máa fún ara yín ní ìṣírí[a], kí ẹ sì máa gbé ara yín ró, gẹ́gẹ́ bí ẹ ti ń ṣe náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa fi ọ̀rọ̀ rọ ara yín.” Ọ̀rọ̀ Gíríìkì παρακαλεῖτε lè ní ipa ìṣírí tàbí ìrànilẹ́kùn nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti so ìlànà yìí mọ́ àríyànjiyàn tó ṣáájú.
- source_word: παρακαλεῖτε
  choice: ẹ máa fún ara yín ní ìṣírí
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífún ní ìṣírí, fífi ọ̀rọ̀ rọ̀, tàbí ìtùnú. Nínú àyíká yìí, ‘fún ... ní ìṣírí’ mú ìtumọ̀ gbòòrò rẹ̀ jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìṣe tí àwọn ọmọ ẹgbẹ́ ń ṣe sí ara wọn lẹ́gbẹ̀ẹ́ ara wọn.
- source_word: οἰκοδομεῖτε
  choice: ẹ máa gbé ara yín ró
  rationale: ‘Gbé ... ró’ jẹ́ àkàwé Yorùbá tó ṣeé lóye fún mímú ẹnì kejì lágbára àti fún ìdàgbàsókè rẹ̀, ó sì pa èrò ìkọ́lé inú ọ̀rọ̀ Gíríìkì mọ́ dé ìwọ̀n kan.
- source_word: εἷς τὸν ἕνα
  choice: ara yín
  rationale: Gbólóhùn Gíríìkì náà tẹnu mọ́ pé kí olúkúlùkù máa ṣe èyí fún ẹnì kejì; àtúnlò ‘ara yín’ pa ìfọkànsìn sí ìbáṣepọ̀ náà mọ́ ní Yorùbá.
- source_word: καθὼς καὶ ποιεῖτε
  choice: gẹ́gẹ́ bí ẹ ti ń ṣe náà
  rationale: Ó pa ìfiwéra, ìtẹnumọ́ καί, àti ìṣe tí wọ́n ń bá a lọ ní àkókò náà mọ́, ó sì jẹ́ ọ̀rọ̀ ìyìn fún ohun tí wọ́n ti ń ṣe.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. Fífi ‘ẹ máa ...’ hàn ṣe àṣẹ tí ó ń tọ́ka sí ìṣe tí ó yẹ kí wọ́n máa bá a lọ; àmì ohùn ni a lò níbi tí ó bá yẹ.
