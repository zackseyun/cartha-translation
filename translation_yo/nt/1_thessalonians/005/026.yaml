  yaml_path: translation/nt/1_thessalonians/005/026.yaml
  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: yo
  text: Ẹ kí gbogbo àwọn arákùnrin pẹ̀lú ìfẹnukonu mímọ́[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn arákùnrin àti arábìnrin,” nítorí “àwọn arákùnrin” lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: “Ìfẹnukonu mímọ́” jẹ́ àmì ìbáṣepọ̀ àti ìfẹ́ Kristẹni tí àṣà ìgbà náà mọ̀ sí.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn. “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ìtumọ̀ ìkíni láwùjọ mu láìfi àlàyé kún un.
- source_word: ἀδελφοὺς
  choice: àwọn arákùnrin
  rationale: Èdè Gíríìkì lo ọ̀rọ̀ akọ ní ọ̀pọ̀; “àwọn arákùnrin” pa ìrísí yẹn mọ́. Síbẹ̀, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin, nítorí náà a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀.
- source_word: πάντας
  choice: gbogbo
  rationale: Ó tẹnumọ́ pé kò sí ẹnikẹ́ni nínú ẹgbẹ́ náà tí a yọ sílẹ̀; “gbogbo” ni ìtumọ̀ Yorùbá tó ṣe kedere jù.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: pẹ̀lú ìfẹnukonu mímọ́
  rationale: ἐν ń fi ọ̀nà tàbí ohun tó bá ìkíni náà rìn hàn, nítorí náà “pẹ̀lú” jẹ́ ti ẹ̀dá Yorùbá. “Ìfẹnukonu” túmọ̀ φίλημα ní tààrà, “mímọ́” sì pa agbára ἁγίῳ mọ́.
theological_decisions:
- issue: Ìtọ́kasí akọ nínú ἀδελφοί ní àyíká ìjọ
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin
  rationale: A pa akọ ọ̀pọ̀ inú Gíríìkì mọ́ nínú ọ̀rọ̀ pàtàkì, láìdín àìdánilójú nípa àwọn tí ọ̀rọ̀ náà kàn kù. Àlàyé ìsàlẹ̀ sọ pé ó lè ní gbogbo ìjọ, lọ́kùnrin àti lóbìnrin, nínú.
translation_notes:
  register: Èdè Yorùbá ìpele àárín tí ó mọ́gbọ́n dání, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá.
