source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: yo
  text: Nítorí ẹ̀yin gbogbo ni ọmọ ìmọ́lẹ̀ àti ọmọ ọ̀sán[a]. Àwa kì í ṣe ti òru tàbí ti òkùnkùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Gíríìkì ní “àwọn ọmọkùnrin ìmọ́lẹ̀ àti àwọn ọmọkùnrin ọ̀sán.” Ó jẹ́ àkànlò èdè fún àwọn tí ìmọ́lẹ̀ àti ọ̀sán jẹ́ àpèjúwe wọn, tàbí tí wọ́n jẹ́ ti ìmọ́lẹ̀ àti ọ̀sán.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: Nítorí gbogbo yín
  rationale: Ó pa ìsopọ̀ àlàyé γάρ mọ́, ó sì fi ìtẹnumọ́ πάντες hàn ní Yorùbá àdánidá.
- source_word: υἱοὶ φωτός
  choice: ọmọ ìmọ́lẹ̀
  rationale: “Ọmọ” lè dúró fún akọ àti abo ní Yorùbá, ó sì pa àkànlò èdè ìbátan àti jíjẹ́ ẹni tí ìmọ́lẹ̀ ń dá mọ̀ mọ́.
- source_word: υἱοὶ ἡμέρας
  choice: ọmọ ọ̀sán
  rationale: “Ọ̀sán” fi ìtumọ̀ ọjọ́ gẹ́gẹ́ bí àkókò ìmọ́lẹ̀ hàn kedere, ó sì tako “òru” ní ti ẹ̀dá.
- source_word: οὐκ ἐσμὲν
  choice: Àwa kì í ṣe
  rationale: Ó pa ìyípadà láti ẹni-kejì ọ̀pọ̀ sí ẹni-kìíní ọ̀pọ̀ mọ́, láì mú un bá gbolohun àkọ́kọ́ dọ́gba.
- source_word: νυκτὸς οὐδὲ σκότους
  choice: ti òru tàbí ti òkùnkùn
  rationale: “Ti” sọ ìbáṣepọ̀ tàbí jíjẹ́ ti ohun kan jáde, ó sì pa ìfìwé òru/òkùnkùn mọ́.
theological_decisions:
- issue: Àkànlò ìdílé nínú υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: ọmọ ìmọ́lẹ̀ àti ọmọ ọ̀sán
  alternative: àwọn ọmọkùnrin ìmọ́lẹ̀ àti àwọn ọmọkùnrin ọ̀sán
  rationale: Bí ó tilẹ̀ jẹ́ pé υἱοί jẹ́ akọ ní Gíríìkì, àkànlò náà kan gbogbo àwọn onígbàgbọ́. “Ọmọ” jẹ́ ọ̀nà Yorùbá tó péye láti pa àwòrán ìdílé àti ìtumọ̀ aṣojú mọ́ láì fi abo sí i tí Yorùbá kò fi sí ọ̀rọ̀ náà.
- issue: Ìyípadà ẹni láti ὑμεῖς sí ἐσμέν
  choice: gbogbo yín ... Àwa kì í ṣe
  alternative: gbogbo yín ... Ẹ̀yin kì í ṣe
  rationale: A pa ìyípadà gírámà Gíríìkì mọ́, nítorí ó lè fi Pọ́ọ̀lù àti àwọn alábáṣiṣẹ́ rẹ̀ kún àwọn ará Tẹsalóníkà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. “Ọ̀sán” ni a yàn dípò “ọjọ́” nítorí ìtakora rẹ̀ pẹ̀lú “òru” dá àwòrán inú ẹsẹ náà dúró kedere; “ọmọ” sì jẹ́ aláìṣàkóso-abo ní Yorùbá.
