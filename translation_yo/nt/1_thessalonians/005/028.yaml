  yaml_path: translation/nt/1_thessalonians/005/028.yaml
  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ Olúwa wa Jésù Kristi wà pẹ̀lú yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Nínú àwọn ìbùkún ìparí lẹ́tà Paulu, χάρις ń tọ́ka sí ojú rere àti oore tí Ọlọ́run ń fi fúnni; “oore-ọ̀fẹ́” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ ní àyíká ẹ̀kọ́ ìgbàgbọ́ yìí.
- source_word: κυρίου
  choice: Olúwa
  rationale: Κύριος jẹ́ orúkọ oyè fún Jesu níhìn-ín; “Olúwa” pa ìtumọ̀ àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- source_word: Ἰησοῦ
  choice: Jesu
  rationale: A lo ìkọ̀wé orúkọ tí ó ti fìdí múlẹ̀ ní Yorùbá.
- source_word: Χριστοῦ
  choice: Kristi
  rationale: Nínú àkójọpọ̀ orúkọ-oyè “Jesu Kristi,” “Kristi” jẹ́ ìtumọ̀ tí ó ti fìdí múlẹ̀, ó sì ń tọ́ka sí ẹni tí a fòróró yàn, ìyẹn Mèsáyà.
- source_word: μεθ’ ὑμῶν
  choice: wà pẹ̀lú yín
  rationale: Gíríìkì túmọ̀ ní tààrà sí “pẹ̀lú yín”; fífi “wà” kún un mú kí àdúrà ìbùkún tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì jẹ́ èdè Yorùbá àdánidá. “Yín” tún pa iye ọ̀pọ̀ ὑμῶν mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú ọ̀rọ̀ ìbùkún ìparí
  choice: Kristi
  alternative: Mèsáyà
  rationale: Χριστός ní ìtumọ̀ oyè “Mèsáyà/Ẹni Àmì Òróró,” ṣùgbọ́n nínú àkójọpọ̀ “Jesu Kristi” ní ọ̀rọ̀ ìparí yìí, ó tún ń ṣiṣẹ́ bí apá kan nínú orúkọ-oyè tí ó ti fìdí múlẹ̀. “Kristi” pa ìfarahàn Gíríìkì mọ́ láì sẹ́ ìtumọ̀ oyè rẹ̀.
- issue: Bí a ṣe ń sọ ìbùkún tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì
  choice: Kí ... wà pẹ̀lú yín
  alternative: Oore-ọ̀fẹ́ ... pẹ̀lú yín
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ gbólóhùn ìbùkún tí ọ̀rọ̀-ìṣe rẹ̀ farasin. “Kí ... wà” sọ agbára ìfẹ́-ọkàn/àdúrà náà ní Yorùbá láì sọ ọ́ di ìlérí tàbí gbólóhùn àlàyé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn níbi tí ó bá yẹ. “Yín” jẹ́ ọ̀pọ̀, gẹ́gẹ́ bí ὑμῶν.
