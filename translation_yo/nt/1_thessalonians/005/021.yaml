  text: But test everything[a]; hold fast to what is good.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa dán ohun gbogbo wò[a]; ẹ di ohun tí ó dára mú ṣinṣin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo nǹkan.” Nínú àyíká ọ̀rọ̀ yìí, èyí ní í ṣe ní pàtàkì pẹ̀lú ṣíṣe àyẹ̀wò àwọn ọ̀rọ̀ àsọtẹ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ọ̀pọ̀ yìí ní ìtumọ̀ tó gbòòrò. “Ohun gbogbo” jẹ́ Yorùbá àdánidá, ó sì pa ìgbòòrò ọ̀rọ̀ Gíríìkì mọ́ láì fi kún un pé àwọn àsọtẹ́lẹ̀ nìkan ni.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré tàbí ìyípadà èrò hàn lẹ́yìn àwọn ìtọ́ni tó ṣáájú. “Ṣùgbọ́n” bá ọ̀rọ̀ àyíká mu, bí ó tilẹ̀ jẹ́ pé ìtakora náà kò lágbára.
- source_word: δοκιμάζετε
  choice: ẹ máa dán ... wò
  rationale: Àṣẹ ìsinsìnyí tọ́ka sí iṣẹ́ àyẹ̀wò tó ń bá a lọ láti mọ ohun tó jẹ́ ojúlówó tàbí tó yẹ. “Dán ... wò” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìdánwò oníyẹ̀wò.
- source_word: τὸ καλὸν
  choice: ohun tí ó dára
  rationale: Àpólà ajẹtífù aláìlẹ́mìí yìí ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ. “Ohun tí ó dára” jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún gbólóhùn aláìṣe kedere.
- source_word: κατέχετε
  choice: ẹ di ... mú ṣinṣin
  rationale: Ọ̀rọ̀ náà ń sọ nípa dídúró ṣinṣin lórí ohun kan tàbí pípa á mọ́ lẹ́yìn àyẹ̀wò. “Di ... mú ṣinṣin” fi ìfaradà àti ìfaramọ́ tó ń bá a lọ hàn.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ πάντα nínú àyíká àsọtẹ́lẹ̀ àti ìfòye mọ̀
  choice: A túmọ̀ rẹ̀ ní gbòòrò sí “ohun gbogbo,” nígbà tí àyíká ẹsẹ tó ṣáájú ń tọ́ka pàápàá sí ṣíṣe àyẹ̀wò àwọn ọ̀rọ̀ àsọtẹ́lẹ̀.
  alternative: “Gbogbo àsọtẹ́lẹ̀” tàbí “gbogbo ohun tí a sọ.”
  rationale: Bí ó tilẹ̀ jẹ́ pé ẹsẹ 20 mẹ́nu kan àsọtẹ́lẹ̀, Gíríìkì lo πάντα láìsí orúkọ tó dín ìtumọ̀ rẹ̀ kù. Nítorí náà, a pa ìtumọ̀ gbòòrò náà mọ́, a kò sì fi ìtumọ̀ onítúmọ̀ dín àṣẹ náà sí àsọtẹ́lẹ̀ nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. “Ẹ máa dán ... wò” mú àṣẹ tó ń bá a lọ jáde, “ẹ di ... mú ṣinṣin” sì pa agbára κατέχετε mọ́. Àmì ohùn ni a lò níbi tó bá ṣe àdánidá.
