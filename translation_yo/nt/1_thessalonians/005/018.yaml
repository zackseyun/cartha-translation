id: 1TH.5.18
reference: 1 Thessalonians 5:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: yo
  text: Ẹ máa dúpẹ́ nínú ohun gbogbo[a], nítorí èyí ni ohun tí Ọlọ́run fẹ́ fún yín nínú Mèsáyà Jésù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ní gbogbo ipò.” Gíríìkì sọ pé “nínú ohun gbogbo”; ó ń tọ́ka sí ipò tí àwọn onígbàgbọ́ wà nínú rẹ̀ nígbà tí wọ́n ń dúpẹ́, kì í ṣe dandan pé kí wọ́n dúpẹ́ fún ibi fúnra rẹ̀.'
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ àṣà: “nínú Kristi Jésù.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: nínú ohun gbogbo
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ipò tàbí àyíká tí a wà nínú rẹ̀ nígbà tí a ń dúpẹ́. Ó tẹ̀ lé ìtumọ̀ gíríìkì “nínú ohun gbogbo,” láì sọ pé kí a dúpẹ́ nítorí ibi fúnra rẹ̀.
- source_word: εὐχαριστεῖτε
  choice: Ẹ máa dúpẹ́
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni, tí ìrísí ọ̀rọ̀ ìṣe rẹ̀ sì fi hàn pé ó yẹ kí ó jẹ́ àṣà tí ń bá a lọ. “Ẹ máa dúpẹ́” jẹ́ Yorùbá àdánidá fún èyí.
- source_word: τοῦτο
  choice: èyí
  rationale: Ó tọ́ka sẹ́yìn sí àṣẹ láti máa dúpẹ́, ó sì pa kúkúrú àti àìfikún ìtumọ̀ ti gíríìkì mọ́.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó mú ìdí tàbí ìpìlẹ̀ àṣẹ náà wọlé lọ́nà tí ó ṣe kedere ní Yorùbá.
- source_word: θέλημα θεοῦ
  choice: ohun tí Ọlọ́run fẹ́
  rationale: Èyí sọ “ìfẹ́ Ọlọ́run” ní Yorùbá òde òní lọ́nà tí kò ní dàpọ̀ mọ́ ìfẹ́ gẹ́gẹ́ bí fífẹ́ràn.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: A tú Χριστός gẹ́gẹ́ bí oyè “Mèsáyà,” a sì pa “nínú” mọ́ kí èdè Pọ́ọ̀lù nípa ìṣọ̀kan pẹ̀lú Mèsáyà má bàa pòórá.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Nínú gbólóhùn yìí, ó túmọ̀ sí pé ohun tí Ọlọ́run fẹ́ kan àwọn onígbàgbọ́ náà tàbí pé ó darí sí wọn.
theological_decisions:
- issue: Bóyá a ó tú Χριστῷ gẹ́gẹ́ bí oyè tàbí kí a lo ìkọ̀wé àṣà ìjọ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè tí ó ní ìtumọ̀ níbí. “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà àṣà “Kristi Jésù” hàn.
- issue: Ohun tí τοῦτο (“èyí”) tọ́ka sí
  choice: A pa “èyí” mọ́ láì ṣàlàyé rẹ̀ sí i nínú ọ̀rọ̀ àkọ́kọ́
  alternative: èyí, ìyẹn, mímáa dúpẹ́
  rationale: Ó ṣeé ṣe jù lọ pé ó tọ́ka sí àṣẹ tó ṣẹ̀ṣẹ̀ wá láti máa dúpẹ́, ṣùgbọ́n lílo “èyí” pa ìsopọ̀ kúkúrú àti àyè ìtumọ̀ gíríìkì mọ́.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, àti ti òde òní pẹ̀lú àmì ohùn ní kíkún. “Ẹ máa dúpẹ́” mú àṣẹ tí ó ń bá a lọ jáde; “ohun tí Ọlọ́run fẹ́” sì yà θέλημα kúrò nínú ìtumọ̀ “ìfẹ́” gẹ́gẹ́ bí fífẹ́ràn. A pa gbólóhùn Pọ́ọ̀lù “nínú Mèsáyà Jésù” mọ́ láì ṣàlàyé ẹ̀kọ́ ìsopọ̀ náà ju ohun tí orísun sọ lọ.
