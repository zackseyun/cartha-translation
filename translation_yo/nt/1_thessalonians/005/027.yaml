source:
  edition: SBLGNT
  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: yo
  text: Mo fi Olúwa mú yín búra pé kí a ka lẹ́tà yìí fún gbogbo àwọn arákùnrin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin” níbí lè tọ́ka sí gbogbo ìjọ, títí kan àwọn obìnrin; ἀδελφοῖς ní Gíríìkì jẹ́ ọ̀rọ̀ orúkọ akọ ní ọ̀pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: Mo fi yín sábẹ́ ìbúra
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ẹnì kan sábẹ́ ìbúra tàbí dídè é mọ́lẹ̀ pẹ̀lú àṣẹ mímọ́. Gbólóhùn Yorùbá yìí pa agbára ìbúra náà mọ́, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: τὸν κύριον
  choice: níwájú Olúwa
  rationale: Pẹ̀lú ἐνορκίζω, accusative yìí lè tọ́ka sí Olúwa gẹ́gẹ́ bí ẹni tí a pè ní ẹlẹ́rìí tàbí aláṣẹ ìbúra. “Níwájú Olúwa” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ àṣẹ àti ẹ̀rí mímọ́ mọ́; a fi “nípa Olúwa” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí òmíràn tó ṣeé ṣe.
- source_word: ἀναγνωσθῆναι
  choice: kí a ka
  rationale: Infinitive passive náà túmọ̀ sí pé kí lẹ́tà náà jẹ́ ohun tí a ó ka. Ìlò “kí a ka” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ passive aláìdárúkọ ẹni tó ṣe iṣẹ́ náà, láìfi “ní ohùn rara” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τὴν ἐπιστολήν
  choice: lẹ́tà yìí
  rationale: Ó tọ́ka sí ìwé tí Pọ́ọ̀lù ń kọ yìí gan-an. “Lẹ́tà yìí” jẹ́ èdè Yorùbá òde òní tó ṣe kedere ju ọ̀rọ̀ ìjọsìn àtijọ́ lọ.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: fún gbogbo àwọn arákùnrin
  rationale: ἀδελφοῖς jẹ́ ọ̀rọ̀ akọ ní ọ̀pọ̀, nítorí náà “àwọn arákùnrin” pa ìrísí ọ̀rọ̀ orísun mọ́. Nínú àwọn lẹ́tà Pọ́ọ̀lù, ó sábà máa ń gba gbogbo ìjọ, títí kan àwọn obìnrin, sínú; àlàyé ìsàlẹ̀ mú èyí hàn láìyí ọ̀rọ̀ pàtó inú ẹsẹ̀ padà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφοῖς níbi tí ó ṣeé ṣe kí ìjọ náà ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; gbogbo àwọn onígbàgbọ́
  rationale: Gíríìkì lo masculine plural, ṣùgbọ́n nínú lílo Pọ́ọ̀lù ó lè dúró fún gbogbo àwùjọ Kristẹni. A pa akọ tó wà nínú ọ̀rọ̀ orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé agbára ìtumọ̀ tó gba àwọn obìnrin sínú ní ìsàlẹ̀.
- issue: Ipa τὸν κύριον pẹ̀lú ἐνορκίζω
  choice: níwájú Olúwa
  alternative: nípa Olúwa; mo fi Olúwa mú yín búra
  rationale: Ìbáṣepọ̀ girama lè fi Olúwa hàn gẹ́gẹ́ bí ẹlẹ́rìí/aláṣẹ níwájú ẹni tí ìbúra ti wáyé tàbí gẹ́gẹ́ bí ẹni tí a fi búra. A yan ọ̀nà Yorùbá tó dára “níwájú Olúwa,” a sì pa òmíràn mọ́ nínú àlàyé.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Mo fi yín sábẹ́ ìbúra” ní agbára mímọ́ tó yẹ láìlo ọ̀rọ̀ àtijọ́ tàbí èdè ẹ̀kọ́ ìsìn tó ṣòro; “kí a ka” sì jẹ́ passive àdánidá ní Yorùbá.
