revisions:
- from: Nítorí àwọn tí ń sùn, ní òru ni wọ́n ń sùn; àwọn tí ń mutí yó sì, ní òru ni wọ́n ń mutí yó.
  to: Nítorí àwọn tí ń sùn ń sùn ní òru, àwọn tí ń mu ọtí yó sì ń mu ọtí yó ní òru.
  rationale: A rọ́pò ‘mutí yó’ pẹ̀lú ‘mu ọtí yó’ láti mú ìtumọ̀ ìmutípara hàn ní kedere ní Yorùbá boṣewa. A tún ṣètò gbolóhùn náà ní ọ̀nà àdánidá, pẹ̀lú ‘sì’ fún καί, nígbà tí àtúnsọ àwọn ọ̀rọ̀-ìṣe àti ìtọ́kasí ‘ní òru’ lẹ́ẹ̀mejì ṣì ń fi ìbáradọ́gba Gíríìkì hàn.
