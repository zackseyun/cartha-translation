source:
  edition: SBLGNT
  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: yo
  text: Nítorí àwọn tí ń sùn ń sùn ní òru, àwọn tí ń mu ọtí yó sì ń mu ọtí yó ní òru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí àlàyé fún ìṣírí inú ẹsẹ tó ṣáájú múlẹ̀, ó sì bá agbára àsopọ̀ Gíríìkì mu ní Yorùbá àdánidá.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: àwọn tí ń sùn ... wọ́n ń sùn
  rationale: A tú participle tí ó ní article sí ọ̀rọ̀ gbogbogbò, a sì tún ọ̀rọ̀ ‘sùn’ ṣe gẹ́gẹ́ bí Gíríìkì láti pa ìbáradọ́gba ọ̀rọ̀ mọ́.
- source_word: νυκτός
  choice: ní òru
  rationale: Genitive náà ń ṣiṣẹ́ bí adverb tó ń tọ́ka sí àkókò; ‘ní òru’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì mọ́gbọ́n dání.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: àwọn tí ń mutí yó ... wọ́n ń mutí yó
  rationale: ‘Mutí yó’ sọ ìṣe tàbí ipò mímu ọtí dé ojú àmujù, ó sì jẹ́ kí àtúnṣe ọ̀rọ̀ àti ìbáradọ́gba tó wà nínú Gíríìkì dúró.
- source_word: καί
  choice: sì
  rationale: ‘Sì’ so àwọn gbólóhùn méjèèjì pọ̀ lọ́nà àdánidá, ó sì mú ìfiwéra wọn hàn.
theological_decisions:
- issue: Bóyá kí a tú oorun àti ìmutíyó ní ti gidi tàbí gẹ́gẹ́ bí àpẹẹrẹ ẹ̀mí
  choice: 'A pa àwòrán gidi náà mọ́: ‘sùn’ àti ‘mutí yó.’'
  alternative: Kí a tú wọn ní tààrà gẹ́gẹ́ bí àìṣọ́ra nípa ẹ̀mí àti ìwà àìníjàánu.
  rationale: Nínú àyíká ọ̀rọ̀ yìí, Pọ́ọ̀lù ń lo àwọn ìṣe tí ó sábà máa ń ṣẹlẹ̀ ní òru láti ṣàlàyé ìṣírí rẹ̀ nípa jíjágàra. Pípa ọ̀rọ̀ gidi mọ́ kò jẹ́ kí ìtumọ̀ olùtúmọ̀ rọ́pò àpẹẹrẹ tí ọrọ̀ náà fúnra rẹ̀ gbé kalẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ń’ láti fi ìṣe àṣà tàbí ohun tí ó máa ń ṣẹlẹ̀ hàn, ní ìbámu pẹ̀lú present tense Gíríìkì.
