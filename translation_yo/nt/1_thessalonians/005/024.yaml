  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: yo
  text: Ẹni tí ó ń pè yín jẹ́ olóòtítọ́[a]; òun náà yóò ṣe é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni tí ó ń pè yín ṣeé gbẹ́kẹ̀ lé; òun náà yóò mú un ṣẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: olóòtítọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àpèjúwe ẹni tí a lè gbẹ́kẹ̀ lé, ẹni tí kì í yẹ̀ kúrò nínú ohun tí ó sọ tàbí ṣe. “Olóòtítọ́” jẹ́ ọ̀rọ̀ Yorùbá tó bá àyíká ẹ̀kọ́ ìgbàgbọ́ mu, ó sì tún lè túmọ̀ sí ẹni tí ó ṣeé gbẹ́kẹ̀ lé.
- source_word: ὁ καλῶν
  choice: Ẹni tí ó ń pè
  rationale: Àpólà alábápín ọ̀rọ̀-ìṣe onítẹ̀síwájú yìí dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tí ó ń pè wọ́n. “Ẹni tí ó ń pè” jẹ́ èdè Yorùbá àdánidá tó pa agbára ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni; “yín” fi hàn gbangba pé gbogbo ìjọ ni a ń bá sọ̀rọ̀.
- source_word: ὃς
  choice: òun
  rationale: A tún gbólóhùn náà ṣe ní ọ̀nà Yorùbá àdánidá pẹ̀lú “òun,” ṣùgbọ́n a pa ìtọ́kasí rẹ̀ sí ẹni kan náà tó ń pè wọ́n mọ́.
- source_word: καὶ
  choice: náà
  rationale: “Náà” tẹnumọ́ pé ẹni kan náà tí ó pè wọ́n ni yóò tún ṣe ohun tí a sọ, ó sì bá ìṣàn Yorùbá mu dáadáa.
- source_word: ποιήσει
  choice: yóò ṣe é
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú yìí gbòòrò, ó lè túmọ̀ sí “ṣe” tàbí “mú ṣẹ.” “Yóò ṣe é” pa kúkúrú àti agbára Gíríìkì mọ́, nígbà tí “é” tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ gbàdúrà rẹ̀ ní ẹsẹ 23 láì ṣe àlàyé rẹ̀ jù.
theological_decisions:
- issue: Ohun tí ποιήσει ń tọ́ka sí láì dárúkọ rẹ̀
  choice: “yóò ṣe é,” ní títọ́ka sí iṣẹ́ ìsọdimímọ́ àti ìpamọ́ tí a gbàdúrà fún ní ẹsẹ 23
  alternative: “yóò mú un ṣẹ” tàbí “yóò mú èyí ṣẹ”
  rationale: Gíríìkì kò sọ ohun tí Ọlọ́run yóò ṣe ní tààrà, ṣùgbọ́n àyíká ẹsẹ 23 ló ń ṣàlàyé rẹ̀. “Yóò ṣe é” jẹ́ àdánidá ní Yorùbá, ó sì yẹra fún ṣíṣe àlàyé ohun tí orísun fi sílẹ̀ ní ṣókí.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn ọ̀wọ̀ àti àdánidá ni a lò. “Yín” pa ọ̀pọ̀ ẹni inú orísun mọ́; “ń pè” sì fi ìṣe onítẹ̀síwájú hàn. Ẹsẹ náà mọ̀ọ́mọ̀ ṣókí gẹ́gẹ́ bí Gíríìkì.
