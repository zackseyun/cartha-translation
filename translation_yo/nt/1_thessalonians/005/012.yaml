id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: yo
  text: A sì ń bẹ̀ yín, ẹ̀yin ará[a], pé kí ẹ mọyì[b] àwọn tí ń ṣiṣẹ́ kára láàárín yín, tí wọ́n ń ṣe aṣáájú yín nínú Olúwa[c], tí wọ́n sì ń kìlọ̀ fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘arákùnrin’; níbí ó jẹ́ ọ̀nà tí a fi ń pe gbogbo ìjọ, àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘dá ... mọ̀’ tàbí ‘bọ̀wọ̀ fún’ àwọn tí ń ṣiṣẹ́ kára láàárín yín.
    reason: lexical_alternative
  - marker: c
    text: Tàbí ‘tí wọ́n wà lórí yín nínú Olúwa’ tàbí ‘tí wọ́n ń ṣe àbójútó yín nínú Olúwa.’
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: A sì ń bẹ̀ yín
  rationale: Ọ̀rọ̀ náà jẹ́ ìbéèrè onínúure tàbí ẹ̀bẹ̀ olùṣọ́-àgùntàn, kì í ṣe àṣẹ líle. ‘Ń bẹ̀ yín’ mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àmì ìyípadà ọ̀rọ̀ pẹ̀lẹ́; ‘sì’ bá a mu láì sọ ọ́ di àtakò líle tàbí fi ‘nísinsin yìí’ kún un.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ará’ jẹ́ ọ̀nà àdánidá tí ìjọ Yorùbá fi ń pe ara wọn, ó sì lè yí gbogbo àwọn ọmọ ìjọ ká láì pàdánù ìtumọ̀ ìbátan inú ọ̀rọ̀ Gíríìkì.
- source_word: εἰδέναι
  choice: kí ẹ mọyì
  rationale: Nínú àyíká yìí, εἰδέναι kọjá mímọ ẹni lásán; ó ní ìtumọ̀ dídá iṣẹ́ wọn mọ̀ àti fífi iyì tó yẹ fún wọn. ‘Mọyì’ sọ èyí ní ṣókí láì fi ìgbọràn tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: κοπιῶντας
  choice: àwọn tí ń ṣiṣẹ́ kára
  rationale: κοπιάω tọ́ka sí iṣẹ́ aláápọn tí ó ń gba okun; ‘ṣiṣẹ́ kára’ ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Gbólóhùn náà tọ́ka sí iṣẹ́ tí wọ́n ń ṣe nínú àwùjọ ìjọ; ‘láàárín yín’ jẹ́ ìtumọ̀ tààrà àti àdánidá.
- source_word: προϊσταμένους ὑμῶν
  choice: tí wọ́n ń ṣe aṣáájú yín
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ṣíṣe aṣáájú, ṣíṣe àbójútó, tàbí wíwà ní ipò àkóso. ‘Ṣe aṣáájú yín’ pa ìtumọ̀ ojúṣe àti àṣẹ mọ́ láì gbé ètò ìjọ ẹ̀ya kan wọ inú ẹsẹ náà.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ iṣẹ́ aṣáájú wọn pẹ̀lú Olúwa mọ́, ó sì jẹ́ gbólóhùn ẹ̀sìn tí ó ṣe kedere ní Yorùbá.
- source_word: νουθετοῦντας
  choice: tí wọ́n sì ń kìlọ̀ fún yín
  rationale: νουθετέω ní ìtumọ̀ ìtọ́ni tí ń ṣe àtúnṣe tàbí ìkìlọ̀. ‘Kìlọ̀ fún’ pa apá àtúnṣe náà mọ́, kì í sì í túmọ̀ sí ìkọ́ni lásán.
theological_decisions:
- issue: Àdírẹ́sì ìjọ ἀδελφοί
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ ní ọ̀pọ̀, ṣùgbọ́n nínú àyíká ó ń bá gbogbo ìjọ sọ̀rọ̀. ‘Ẹ̀yin ará’ jẹ́ àdírẹ́sì Yorùbá tó bá gbogbo ìjọ mu; àlàyé ìsàlẹ̀ pa fọ́ọ̀mù orísun mọ́.
- issue: Ìtumọ̀ εἰδέναι nípa àwọn aṣáájú ìjọ
  choice: kí ẹ mọyì
  alternative: kí ẹ mọ̀; kí ẹ dá wọn mọ̀; kí ẹ bọ̀wọ̀ fún
  rationale: Ẹsẹ náà ń béèrè kí ìjọ dá àwọn òṣìṣẹ́ yìí mọ̀ kí wọ́n sì ka iṣẹ́ wọn sí pàtàkì, ṣùgbọ́n kò pàṣẹ fún ìgbọràn tàbí ọlá àṣejù.
- issue: Agbára προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: tí wọ́n ń ṣe aṣáájú yín nínú Olúwa
  alternative: tí wọ́n wà lórí yín nínú Olúwa; tí wọ́n ń ṣe àbójútó yín nínú Olúwa
  rationale: 'Participle náà lè ní ìtumọ̀ aṣáájú, àkóso, tàbí àbójútó. ‘Ṣe aṣáájú’ jẹ́ ìwọ̀ntúnwọ̀nsì: ó pa ojúṣe àti àṣẹ mọ́, ṣùgbọ́n kò fi ètò ipò ìjọ kan pàtó lé ọ̀rọ̀ náà lórí.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọ ‘ẹ̀yin ará’ àti ‘ń bẹ̀ yín’ jẹ́ ti ọ̀wọ̀, ó sì ṣeé lóye fún àwọn òǹkàwé òde òní; a yẹra fún ọ̀rọ̀ àtijọ́ tàbí èdè ẹ̀kọ́ ìsìn ẹ̀ya kan.
