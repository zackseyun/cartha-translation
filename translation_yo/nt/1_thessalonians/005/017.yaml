  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀδιαλείπτως προσεύχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/017.yaml
  text: Pray without ceasing[a].
translation:
  language: yo
  text: Ẹ máa gbàdúrà láìdáwọ́ dúró.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa gbàdúrà nígbà gbogbo,” tàbí, “Ẹ má ṣe jáwọ́ nínú àdúrà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: láìdáwọ́ dúró
  rationale: Ọ̀rọ̀ adverb Gíríìkì náà ń tọ́ka sí ìṣe tí a ń ṣe nígbà gbogbo tàbí pẹ̀lú ìforítì láìjáwọ́. ‘Láìdáwọ́ dúró’ pa agbára ọ̀rọ̀ náà mọ́ láìfi dandan mú un túmọ̀ sí pé kí ẹnì kan máa sọ àdúrà ní gbogbo ìṣẹ́jú àáyá.
- source_word: προσεύχεσθε
  choice: Ẹ máa gbàdúrà
  rationale: Ìṣe àṣẹ ní persọ́nù kejì púpọ̀ ni, tí ó sì ní ìrísí ìṣe tí ń bá a lọ. ‘Ẹ máa gbàdúrà’ fi hàn pé gbogbo àwọn tí a ń bá sọ̀rọ̀ ni àṣẹ náà kàn, ó sì gbé ìtumọ̀ ìṣe àṣà tí ń tẹ̀ síwájú jáde lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Agbára àṣẹ náà nínú ìgbésí ayé
  choice: Ìṣírí gbogbogbò láti máa forí tì í nínú àdúrà, kì í ṣe dandan pé kí ọ̀rọ̀ àdúrà máa jáde lẹ́nu láìsinmi ní gbogbo ìṣẹ́jú àáyá.
  alternative: Kí a ka á ní ti gidi gan-an gẹ́gẹ́ bí àṣẹ pé àdúrà gbọ́dọ̀ máa lọ láìdáwọ́ ní gbogbo ìgbà.
  rationale: Àpapọ̀ ìṣe àṣẹ tí ń tọ́ka sí ìṣe tí ń bá a lọ àti ἀδιαλείπτως ń rọni sí ìfọkànsìn àti ìforítì déédéé nínú àdúrà. Ìtumọ̀ náà pa agbára àti ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ Gíríìkì mọ́, láìfi ẹ̀kọ́ ìsìn tóóró kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. ‘Ẹ’ ṣàfihàn ẹni kejì púpọ̀ inú Gíríìkì; ‘máa’ sì fi ìṣe tí ń tẹ̀ síwájú hàn lọ́nà àdánidá.
