lexical_decisions:
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó ń ṣẹlẹ̀ ní gbogbo ìgbà tàbí láìdáwọ́ dúró. ‘Nígbà gbogbo’ jẹ́ ọ̀nà àdánidá, kedere, tí ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá.
- source_word: χαίρετε
  choice: Ẹ máa yọ̀
  rationale: Èyí jẹ́ ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn. ‘Ẹ’ fi hàn pé ọ̀pọ̀ ni a ń bá sọ̀rọ̀, ‘máa’ sì mú ìṣe tí ń bá a lọ jáde, nígbà tí ‘yọ̀’ pa ìtumọ̀ ayọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
