id: 1TH.5.2
reference: 1 Thessalonians 5:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: yo
  text: Nítorí ẹ̀yin fúnra yín mọ̀ dáadáa pé ọjọ́ Olúwa ń bọ̀ bí olè ní òru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: ẹ̀yin fúnra yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tẹnumọ́ ẹni kejì púpọ̀ tí ó ti wà nínú οἴδατε; ‘ẹ̀yin fúnra yín’ pa ìtẹnumọ́ náà mọ́ ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé tàbí ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀; ‘Nítorí’ mú ipa ìsopọ̀ àti àlàyé náà hàn.
- source_word: ἀκριβῶς
  choice: dáadáa
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘mọ̀,’ ‘mọ̀ dáadáa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìmọ̀ náà péye tàbí dájú, láì lo gbólóhùn líle tí kò wọ́pọ̀.
- source_word: οἴδατε
  choice: mọ̀
  rationale: ‘Mọ̀’ ni ìtumọ̀ tààrà, tí ó sì bá èdè Yorùbá òde òní mu.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ ń ṣí àkóónú ohun tí wọ́n mọ̀ sílẹ̀, gẹ́gẹ́ bí ὅτι ṣe rí.
- source_word: ἡμέρα κυρίου
  choice: ọjọ́ Olúwa
  rationale: Èyí jẹ́ gbólóhùn àsọtẹ́lẹ̀ nípa ọjọ́ ìdáwọ́lé Ọlọ́run ní ọjọ́ iwájú, kì í ṣe ọjọ́ ìjọsìn ọ̀sọ̀ọ̀sẹ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Bíbélì Yorùbá tí ó ti fìdí múlẹ̀ fún κύριος, ó sì yẹ fún àyíká ẹ̀kọ́ nípa ọjọ́ ìkẹyìn yìí.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: bí olè ní òru
  rationale: Àfiwé yìí pa àwòrán ìbòjijì àti àìròtẹ́lẹ̀ mọ́ ní Yorùbá kedere, láì fi ẹ̀kọ́ míì kún un.
- source_word: οὕτως
  choice: bí …
  rationale: Ìtumọ̀ ‘ní ọ̀nà báyìí’ ni a fi sínú àfiwé ‘bí olè ní òru’; kò pọn dandan láti tún un sọ lọ́tọ̀ ní Yorùbá.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: ‘Ń bọ̀’ pa ìsinsìnyí aláàyè tí ó tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú mọ́, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Gbólóhùn nípa ọjọ́ ìkẹyìn ἡμέρα κυρίου
  choice: ọjọ́ Olúwa
  alternative: ọjọ́ ti Olúwa / ọjọ́ ìjọsìn Olúwa
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ọjọ́ ìdáwọ́lé àti ìdájọ́ Olúwa tí ń bọ̀, kì í ṣe ọjọ́ ìjọsìn ọ̀sọ̀ọ̀sẹ̀. ‘Ọjọ́ Olúwa’ tún pa ìbáṣepọ̀ rẹ̀ pẹ̀lú gbólóhùn àwọn wòlíì mọ́.
- issue: Ipa àfiwé ‘bí olè ní òru’
  choice: A pa àfiwé ìbòjijì àti àìròtẹ́lẹ̀ mọ́ láì ṣàfikún ẹ̀kúnrẹ́rẹ́ ẹ̀kọ́ ọjọ́ ìkẹyìn
  alternative: Ṣí àfiwé náà sí ìbọ̀kọ̀kọ̀ tàbí ètò àkókò pàtó
  rationale: Ẹsẹ̀ náà tẹnumọ́ bí ọjọ́ náà yóò ṣe dé láìròtẹ́lẹ̀; kò sọ ètò àkókò tàbí ìlànà ẹ̀kọ́ ẹ̀sìn kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, kedere, ó sì rọrùn fún òǹkàwé òde òní. A lo ‘ẹ̀yin fúnra yín’ fún ìtẹnumọ́, àti ‘ń bọ̀’ láti pa ìsinsìnyí aláàyè Gíríìkì mọ́.
