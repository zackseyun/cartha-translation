id: 1TH.5.13
reference: 1 Thessalonians 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: yo
  text: kí ẹ sì máa fi ìfẹ́ kà wọ́n sí gidigidi nítorí iṣẹ́ wọn.[a] Ẹ máa wà ní àlàáfíà láàárín ara yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ máa fi ìfẹ́ mọyì wọn dé ìwọ̀n tí ó ga jù lọ.” Ọ̀rọ̀ Gíríìkì tí a lò fún ìtẹnumọ́ yìí lágbára lọ́pọ̀lọpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: kà wọ́n sí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí bí àwọn onígbàgbọ́ ṣe gbọ́dọ̀ mọyì àwọn tí ń ṣiṣẹ́ láàárín wọn, kì í ṣe sí ṣíṣàkóso.
- source_word: ὑπερεκπερισσοῦ
  choice: gidigidi
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ìtẹnumọ́ tó lágbára gan-an; “gidigidi” jẹ́ èdè Yorùbá àdánidá tó fi ìtẹnumọ́ yẹn hàn, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ ojú ìwé tún ṣàlàyé agbára rẹ̀ sí i.
- source_word: ἐν ἀγάπῃ
  choice: fi ìfẹ́
  rationale: “Fi ìfẹ́” sọ ọ̀nà tí wọ́n fi gbọ́dọ̀ kà wọ́n sí, ó sì pa èrò ἀγάπη mọ́ ní èdè Yorùbá àdánidá.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: nítorí iṣẹ́ wọn
  rationale: διά pẹ̀lú accusative ń fi ìdí tàbí okùnfà hàn; “nítorí iṣẹ́ wọn” pa orúkọ ἔργον mọ́ láì sọ ọ́ di àlàyé gígùn.
- source_word: εἰρηνεύετε
  choice: Ẹ máa wà ní àlàáfíà
  rationale: Àṣẹ present náà ń tọ́ka sí ìwà tàbí ìṣe tó ń bá a lọ; “Ẹ máa wà ní àlàáfíà” fi ìtumọ̀ yẹn hàn ní kedere.
- source_word: ἐν ἑαυτοῖς
  choice: láàárín ara yín
  rationale: Reflexive plural náà ń tọ́ka sí àlàáfíà nínú àwùjọ àwọn onígbàgbọ́ fúnra wọn.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ìkìlọ̀ yìí mọ́ ohun tó ṣáájú rẹ̀ ní ọ̀nà Yorùbá tó ṣàn dáadáa.
- source_word: αὐτούς
  choice: wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí àwọn tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “kà wọ́n sí” fún ìgbéyẹ̀wò tàbí mímọyì, “fi ìfẹ́” gẹ́gẹ́ bí ọ̀nà ìṣe, àti “Ẹ máa” láti fi àṣẹ tó ń bá a lọ hàn. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
