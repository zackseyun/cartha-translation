  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ nínú δέ, ìtẹnumọ́ ὑμεῖς, àwòrán ‘òkùnkùn,’ àti àfiwé olè mọ́. Síbẹ̀, ‘kò sí nínú òkùnkùn’ kì í tọ́ka sí ‘ẹ̀yin ... kò wà nínú òkùnkùn’; ó jẹ́ ìkọ̀lé àìsí/wíwà tí kò ní kókó-ọrọ ẹni kejì púpọ̀ náà. ‘Ẹ kò wà’ ni ó bá ἐστὲ ... ἐν σκότει mu.
  naturalness: Àtúnṣe ‘ẹ kò wà nínú òkùnkùn’ jẹ́ Yorùbá boṣewa, adayeba, ó sì dá kókó-ọrọ náà hàn gbangba. A tún gbe àmì àlàyé (a) sún mọ́ ‘ará,’ èyí tí àlàyé náà ń ṣàlàyé, àti (b) sún mọ́ ‘ọjọ́ náà,’ èyí tí ó jẹ́ ohun tí àlàyé àyíká ń tọ́ka sí.
  terminology: ‘Ará’ yẹgẹgẹ́ bí ìpè sí ìjọ, kò sì fi akọ tàbí abo kún ọ̀rọ̀ Gíríìkì. ‘Ọjọ́ náà’ pa ọ̀rọ̀ ṣókí Gíríìkì mọ́, nígbà tí àkọsílẹ̀ ń fi ìtọ́kasí àyíká sí Ọjọ́ Olúwa hàn. ‘Dé bá’ jẹ́ ìtumọ̀ tó bójú mu fún καταλάβῃ nínú àyíká ìjìnlẹ̀ ìṣẹ̀lẹ̀.
