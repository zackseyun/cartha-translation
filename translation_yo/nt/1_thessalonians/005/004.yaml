id: 1TH.5.4
reference: 1 Thessalonians 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin, ará[a], ẹ kò wà nínú òkùnkùn, kí ọjọ́ náà[b] má bàa dé bá yín bí olè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ará” níhìn-ín ń tọ́ka sí àwọn arákùnrin àti arábìnrin nínú ìjọ.
    reason: lexical_alternative
  - marker: b
    text: “Ọjọ́ náà” ni ọjọ́ Olúwa tí àwọn ẹsẹ tó yí i ká ń sọ̀rọ̀ nípa rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ṣùgbọ́n ẹ̀yin
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ohun tí a sọ níṣáájú hàn, “ẹ̀yin” sì pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ἀδελφοί
  choice: ará
  rationale: Nínú Yorùbá, “ará” jẹ́ ọ̀rọ̀ àdírẹ́sì àdánidá tí ó lè tọ́ka sí àwọn ọkùnrin àti obìnrin, ó sì bá ìtumọ̀ ìbátan àwọn onígbàgbọ́ mu láìfi akọ tàbí abo kún ọ̀rọ̀ Gíríìkì lọ́nà tí kò yẹ.
- source_word: ἐν σκότει
  choice: nínú òkùnkùn
  rationale: Èyí pa àwòrán òkùnkùn àti ìtumọ̀ rẹ̀ nípa ipò ẹ̀mí tàbí àìmọ̀kan mọ́.
- source_word: ἵνα
  choice: kí ... má bàa
  rationale: Ìkọ̀lé Yorùbá yìí fi àbájáde tàbí ipò tí kò ní ṣẹlẹ̀ hàn ní ti ẹ̀dá, láìfipá pinnu pé ἵνα túmọ̀ sí ète nìkan.
- source_word: ἡ ἡμέρα
  choice: ọjọ́ náà
  rationale: “Náà” fi hàn pé ọjọ́ pàtó kan tí ọ̀rọ̀ ti ń tọ́ka sí ni, ṣùgbọ́n kò fi “ọjọ́ Olúwa” kún ọ̀rọ̀ àkọ́kọ́.
- source_word: ὡς κλέπτης
  choice: bí olè
  rationale: Èyí jẹ́ àfiwé Yorùbá tó ṣe kedere, ó sì pa àwòrán olè mọ́.
- source_word: καταλάβῃ
  choice: dé bá
  rationale: Nínú àyíká yìí, “dé bá” sọ bí ọjọ́ náà ṣe lè bá ènìyàn lójijì; ó jẹ́ ti ẹ̀dá ní Yorùbá, láìṣàlàyé rẹ̀ ju bí “mú yín lójijì” ṣe lè ṣe lọ.
theological_decisions:
- issue: Ìpè ἀδελφοί sí ìjọ tí ó ní ọkùnrin àti obìnrin
  choice: ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tí kò dá akọ tàbí abo mọ́, tí ó sì lè gba gbogbo ìjọ; àkọsílẹ̀ ìsàlẹ̀ jẹ́ kí ìtumọ̀ yìí ṣe kedere.
- issue: Ohun tí ἡ ἡμέρα ń tọ́ka sí nípa ọjọ́ ìkẹyìn
  choice: ọjọ́ náà
  alternative: ọjọ́ Olúwa
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ fi hàn pé ọjọ́ Olúwa ni, ṣùgbọ́n Gíríìkì ní ẹsẹ yìí sọ “ọjọ́ náà” nìkan; a pa ìyàtọ̀ yẹn mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé rẹ̀ ní àkọsílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò; a pa àwòrán òkùnkùn àti olè mọ́.
