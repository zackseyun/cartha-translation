  yaml_path: translation/nt/1_thessalonians/005/025.yaml
  text: Brothers[a], pray for us.
translation:
  language: yo
  text: Ẹ̀yin arákùnrin[a], ẹ máa gbàdúrà fún wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin arákùnrin àti arábìnrin,” nítorí ó ṣeé ṣe kí ìpè náà kan gbogbo ìjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ẹ̀yin arákùnrin
  rationale: Ọ̀rọ̀ yìí jẹ́ àpèjúwe ọ̀pọ̀ ènìyàn ní ipò ìpè tààrà. A pa ìrísí akọ inú Gíríìkì mọ́ nínú ọ̀rọ̀ àkọ́kọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí ó tọ́ka sí gbogbo ìjọ, àwọn ọkùnrin àti obìnrin.
- source_word: προσεύχεσθε
  choice: ẹ máa gbàdúrà
  rationale: Àṣẹ ẹni kejì ọ̀pọ̀ ni, ní àkókò presenti. ‘Ẹ máa gbàdúrà’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àṣẹ náà, ó sì lè fi ìṣe tí ń bá a lọ hàn láìfi ìtumọ̀ àfikún tí kò pọn dandan kún un.
- source_word: περὶ
  choice: fún
  rationale: Pẹ̀lú ἡμῶν, ọ̀rọ̀ náà ń sọ ẹni tí àdúrà jẹ́ nítorí rẹ̀; ‘fún wa’ ni ọ̀nà Yorùbá tó ṣe déédé jù.
- source_word: ἡμῶν
  choice: wa
  rationale: Arọ́pò-orúkọ ẹni kìíní ọ̀pọ̀ ni; ó tọ́ka sí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ láìjẹ́ pé a túmọ̀ ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Àpèjúwe akọ Ἀδελφοί fún ìjọ tí ó ṣeé ṣe kí ọkùnrin àti obìnrin wà nínú rẹ̀
  choice: Ẹ̀yin arákùnrin
  alternative: Ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa ìrísí akọ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ sì pa ìtumọ̀ àpapọ̀ tó ṣeé ṣe mọ́, nítorí àpèjúwe náà lè kan gbogbo ìjọ.
translation_notes:
  register: Yorùbá ìpele àárín, ọ̀wọ̀, àti èdè òde òní ni a lò. ‘Ẹ̀yin’ àti ‘ẹ’ mú kí àpèjúwe àti àṣẹ ọ̀pọ̀ ènìyàn ṣe kedere; àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
