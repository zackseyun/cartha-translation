id: 1TH.5.9
reference: 1 Thessalonians 5:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: yo
  text: Nítorí Ọlọ́run kò yàn wá fún ìbínú, bí kò ṣe fún gbígba ìgbàlà[a] nípasẹ̀ Olúwa wa Jésù Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “fún níní ìgbàlà,” “fún jíjẹ́ kí ìgbàlà di tiwa,” tàbí, bóyá, “fún pípa wa mọ́ dé inú ìgbàlà.” Ọ̀rọ̀ Gíríìkì περιποίησις ní ìwọ̀n ìtumọ̀ tó gbòòrò ju “gbígba” nìkan lọ.
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ ìbílẹ̀ ni “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí “Mèsáyà,” ẹni tí a fi òróró yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ọ̀rọ̀ yìí ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀; “Nítorí” jẹ́ ọ̀nà àdánidá láti fi ìtumọ̀ ìdí hàn ní Yorùbá.
- source_word: οὐκ ἔθετο ἡμᾶς ὁ θεός
  choice: Ọlọ́run kò yàn wá
  rationale: Nínú àkópọ̀ yìí, τίθημι ń tọ́ka sí yíyàn tàbí fífi sí ipò fún àbájáde kan. “Yàn” pa ète Ọlọ́run mọ́ láìfi èrò ẹ̀kọ́ nípa àyànmọ́ tí ó lágbára ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: εἰς ὀργήν
  choice: fún ìbínú
  rationale: ὀργή ní àyíká ọ̀rọ̀ Pọ́ọ̀lù yìí ń tọ́ka sí ìbínú Ọlọ́run ní ìdájọ́ ọjọ́ ìkẹyìn. “Ìbínú” ni ìtumọ̀ Yorùbá tó tààrà jù; “ìdájọ́” yóò túmọ̀ ọ̀rọ̀ náà ju bó ṣe wà lọ.
- source_word: εἰς περιποίησιν σωτηρίας
  choice: fún gbígba ìgbàlà
  rationale: “Gbígba ìgbàlà” jẹ́ Yorùbá àdánidá fún àbájáde tí a ń rí gbà, ó sì bá ìtakora pẹ̀lú “fún ìbínú” mu. Àlàyé ìsàlẹ̀ ojú ìwé pa ìwọ̀n ìtumọ̀ περιποίησις tó gbòòrò mọ́.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Olúwa wa Jésù Mèsáyà
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ inú genitive ń fi ẹni tàbí ọ̀nà tí ohun fi ṣẹlẹ̀ hàn, nítorí náà “nípasẹ̀” yẹ. Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà, kì í ṣe orúkọ ìdílé.
theological_decisions:
- issue: Bóyá ἔθετο yẹ kí a túmọ̀ rẹ̀ ní ọ̀nà tó fi ẹ̀kọ́ àyànmọ́ líle hàn
  choice: Ọlọ́run kò yàn wá fún ìbínú
  alternative: Ọlọ́run kò pinnu wá sí ìbínú
  rationale: Ẹsẹ náà ń sọ ète tàbí ìyàn Ọlọ́run nípa àbájáde àwọn onígbàgbọ́, ṣùgbọ́n kò béèrè pé kí a fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tó lágbára ju ọ̀rọ̀ rẹ̀ lọ sí i.
- issue: Bóyá Χριστοῦ jẹ́ oyè tàbí apá orúkọ tí kò nílò títúmọ̀
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός tẹ̀ lé Jésù gẹ́gẹ́ bí oyè tó ní ìtumọ̀; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìlò ìbílẹ̀ “Kristi” mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìṣètò “fún … bí kò ṣe fún …” pa ìtakora Gíríìkì mọ́, “nípasẹ̀” sì fi ipa Jésù Mèsáyà gẹ́gẹ́ bí ọ̀nà tàbí aṣojú ìgbàlà hàn.
