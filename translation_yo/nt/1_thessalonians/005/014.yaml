  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ pàtàkì ọ̀rọ̀ Gíríìkì dáadáa: ìkìlọ̀ fún àwọn ἀτάκτους, ìṣírí fún àwọn ὀλιγοψύχους, àtìlẹ́yìn fún àwọn ἀσθενῶν, àti sùúrù sí gbogbo ènìyàn. Síbẹ̀, “Àti pé” kò ṣe àfihàn δέ ní Yorùbá àdánidá ní ìbẹ̀rẹ̀ gbolóhùn; “A sì ń rọ̀ yín” dára jù, ó sì pa ìmọ̀ ìtẹ̀síwájú náà mọ́.'
  naturalness: Èdè náà pọ̀jùlọ jẹ́ Yorùbá boṣewa tí ó ṣe kedere. Àtúnṣe kékeré sí ìbẹ̀rẹ̀ gbolóhùn náà ń mú un rọrùn àti adayeba sí i. “Àwọn tí kò tẹ̀lé ìlànà” jẹ́ ìtumọ̀ tí ó ṣeé lóye, ṣùgbọ́n “àwọn aláìtòlẹ́sẹẹsẹ” ń pa àìdájú àti àgbègbè ìtumọ̀ ἀτάκτους mọ́ dáradára.
  terminology: “Ẹ̀yin ará,” “kìlọ̀ fún,” “fún … ní ìṣírí,” “ṣe àtìlẹ́yìn fún,” “àwọn aláìlera,” àti “ní sùúrù pẹ̀lú gbogbo ènìyàn” bá ọ̀rọ̀ ìjọ àti Yorùbá òde òní mu. A fi “aláìtòlẹ́sẹẹsẹ” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́ fún ἀτάκτους, láì dín un kù sí ọ̀lẹ tàbí àìgbọ́ràn nìkan.
