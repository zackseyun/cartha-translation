source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: yo
  text: 'A sì ń rọ̀ yín, ẹ̀yin ará[a]: ẹ máa kìlọ̀ fún àwọn aláìtòlẹ́sẹẹsẹ[b], ẹ máa fún àwọn tí ọkàn wọn rẹ̀ ní ìṣírí[c], ẹ máa ṣe àtìlẹ́yìn fún àwọn aláìlera[d], kí ẹ sì máa ní sùúrù pẹ̀lú gbogbo ènìyàn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, ẹ̀yin arákùnrin àti arábìnrin; gbogbo ìjọ ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
    reason: alternative_reading
  - marker: b
    text: Ó sì lè jẹ́ “àwọn ọ̀lẹ” tàbí “àwọn aláìgbọ́ràn.”
    reason: lexical_alternative
  - marker: c
    text: Ó sì lè jẹ́ “ẹ máa tu àwọn tí ìrẹ̀wẹ̀sì mú nínú.”
    reason: lexical_alternative
  - marker: d
    text: Ó sì lè jẹ́ “ẹ máa ràn àwọn aláìlera lọ́wọ́” tàbí “ẹ máa dúró tì wọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: a ń rọ̀ yín
  rationale: Ó fi ìtẹnumọ́ ẹ̀bẹ̀ àti ìṣílétí aposteli hàn ní Yorùbá àdánidá, láì sọ ọ́ di àṣẹ líle.
- source_word: δέ
  choice: Àti pé
  rationale: Níhìn-ín, δέ ń tẹ̀síwájú sí ìṣílétí mìíràn, kì í ṣe ìtakora líle.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà àdánidá tí ìjọ Yorùbá fi ń pe àwọn onígbàgbọ́, ó sì lè gba gbogbo ìjọ láì pa ìtumọ̀ ìbátan ẹ̀mí run.
- source_word: νουθετεῖτε
  choice: ẹ máa kìlọ̀ fún
  rationale: Ó mú ìtọ́ni àtúnṣe tó ní ìkìlọ̀ nínú jáde, kì í sì í túmọ̀ sí fífi ẹ̀sùn kàn án lásán.
- source_word: ἀτάκτους
  choice: àwọn tí kò tẹ̀ lé ìlànà
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti jíjẹ́ aláìtòlẹ́sẹẹsẹ tàbí aláìgbọ́ràn mọ́, láì fi ọ̀rọ̀ náà mọ́ ọ̀lẹ nìkan.
- source_word: παραμυθεῖσθε
  choice: ẹ máa ... fún ... ní ìṣírí
  rationale: Ó sọ ìṣe sísọ̀rọ̀ pẹ̀lẹ́ láti tù ènìyàn nínú àti láti fún un ní ìgboyà ní Yorùbá tó wọ́pọ̀.
- source_word: ὀλιγοψύχους
  choice: àwọn tí ọkàn wọn rẹ̀
  rationale: Ó jẹ́ àpèjúwe Yorùbá àdánidá fún àwọn tí ìrẹ̀wẹ̀sì mú tàbí tí ìgboyà wọn dín kù.
- source_word: ἀντέχεσθε
  choice: ẹ máa ṣe àtìlẹ́yìn fún
  rationale: Pẹ̀lú ohun tí a fi genitive ṣe, ọ̀rọ̀ náà túmọ̀ sí dídúró ti ẹni kan, ríràn án lọ́wọ́, tàbí ṣíṣe àtìlẹ́yìn fún un.
- source_word: τῶν ἀσθενῶν
  choice: àwọn aláìlera
  rationale: Ó pa àyè sílẹ̀ fún àìlera ti ara, ti ẹ̀mí, ti ìwà, tàbí ti ipò láì pinnu èyí kan ṣoṣo.
- source_word: μακροθυμεῖτε
  choice: kí ẹ sì máa ní sùúrù
  rationale: Ó fi ìfaradà pípẹ́ sí àwọn ènìyàn hàn ní èdè Yorùbá òde òní.
- source_word: πρὸς πάντας
  choice: pẹ̀lú gbogbo ènìyàn
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún ìhùwàsí sí gbogbo ènìyàn láì yọ ẹnikẹ́ni sílẹ̀.
theological_decisions:
- issue: Ìtẹnumọ́ tí ἀδελφοί ní sí gbogbo ìjọ
  choice: Lo “ẹ̀yin ará” nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ fi hàn pé gbogbo ìjọ ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
  alternative: “Ẹ̀yin arákùnrin àti arábìnrin”
  rationale: Orúkọ “ará” jẹ́ ọ̀nà ìpè ìjọ tó wọ́pọ̀ ní Yorùbá, ó sì pa ìtumọ̀ ìbátan mọ́; àlàyé náà ṣàfihàn gbangba pé àwọn obìnrin náà wà lára àwọn tí a ń bá sọ̀rọ̀.
- issue: Irú àìlera tí τῶν ἀσθενῶν ń tọ́ka sí
  choice: Pa á mọ́ gẹ́gẹ́ bí “àwọn aláìlera,” láì sọ irú àìlera kan pàtó.
  alternative: “Àwọn tí ara wọn kò le” tàbí “àwọn tí igbagbọ́ wọn kò lágbára”
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ti ara, ti ìwà, ti ẹ̀mí, tàbí ti ipò; àyíká ẹsẹ yìí kò mú kí èyí kan ṣoṣo dájú.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Àwọn àṣẹ púpọ̀ ni a ṣe pẹ̀lú “ẹ máa” láti fi ìṣe tí ó yẹ kí ó máa bá a lọ hàn. Àwọn ọ̀rọ̀ bí “ẹ̀yin ará,” “ọkàn wọn rẹ̀,” àti “ṣe àtìlẹ́yìn” jẹ́ èdè tí òǹkàwé Yorùbá lónìí lè lóye ní rọrùn.
