id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: yo
  text: Ṣùgbọ́n níwọ̀n bí àwa ti jẹ́ ti ọ̀sán, ẹ jẹ́ kí a wà ní ìmójú-mọ̀, kí a wọ ìhámọ́ra àyà ìgbàgbọ́[a] àti ìfẹ́, kí a sì fi ìrètí ìgbàlà ṣe àṣíborí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣòtítọ́.” Ọ̀rọ̀ Gíríìkì náà, pistis, lè túmọ̀ sí “ìgbàgbọ́,” “ìgbẹ́kẹ̀lé,” tàbí “ìṣòtítọ́”; a lo “ìgbàgbọ́” nínú ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a sì wọ ìrètí ìgbàlà bí àṣíborí.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ṣùgbọ́n níwọ̀n bí àwa
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí àwọn ẹni tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa wọn; “níwọ̀n bí” sì so ọ̀rọ̀ náà mọ́ gbolohun alábápín tó tẹ̀ lé e ní èdè Yorùbá àdánidá.
- source_word: ἡμέρας ὄντες
  choice: ti jẹ́ ti ọ̀sán
  rationale: Èyí pa àwòrán ìyàtọ̀ láàárín òru àti ọ̀sán mọ́, ó sì fi hàn pé jíjẹ́ ti ọ̀sán ni a ń sọ, kì í ṣe kìkì pé ohun kan ṣẹlẹ̀ ní ọ̀sán.
- source_word: νήφωμεν
  choice: ẹ jẹ́ kí a máa wà lójúfò
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àìmutíyó àti sí jíjí ní èrò, ìṣọ́ra, àti ìkóra-ẹni-níjàánu. “Wà lójúfò” jẹ́ èdè Yorùbá tó ṣe kedere nínú àyíká òru, ọ̀sán, àti ìṣọ́ra, láìfi ìtumọ̀ ọ̀rọ̀ náà mọ́ ọtí nìkan.
- source_word: ἐνδυσάμενοι
  choice: kí a wọ
  rationale: Ìrọ̀rùn Yorùbá fẹ́ kí ìṣe yìí bá ọ̀rọ̀ ìyànjú àkọ́kọ́ lọ. Ó pa àwòrán wíwọ ohun ìjà mọ́, ó sì ṣàfihàn bí àwọn onígbàgbọ́ ṣe máa wà lójúfò.
- source_word: θώρακα
  choice: ìgbàyà
  rationale: “Ìgbàyà” ni ohun ìjà tó ń dáàbò bo apá iwájú ara, ó sì pa àwòrán ológun inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú àkójọpọ̀ ìgbàgbọ́, ìfẹ́, àti ìrètí yìí, “ìgbàgbọ́” ni ìtumọ̀ tó ṣeé ṣe jù. A pa “ìṣòtítọ́” mọ́ gẹ́gẹ́ bí ìtumọ̀ míì nínú àlàyé ìsàlẹ̀.
- source_word: ἀγάπης
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó tọ́, tó sì wọ́pọ̀ fún ἀγάπη nínú àyíká ìwà rere yìí.
- source_word: περικεφαλαίαν
  choice: àṣíborí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ohun ìjà tí a fi ń dáàbò bo orí; “àṣíborí” jẹ́ ọ̀rọ̀ Yorùbá tó bá àwòrán ológun mu.
- source_word: ἐλπίδα σωτηρίας
  choice: ìrètí ìgbàlà
  rationale: Èyí pa ìbáṣepọ̀ tí Gíríìkì fi sílẹ̀ láàárín ìrètí àti ìgbàlà mọ́, láìpinnu ju bóyá ìgbàlà ni ohun tí a ń retí tàbí ohun tó ń ṣe àpèjúwe ìrètí náà.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àwòrán ohun ìjà
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: Ìsopọ̀ rẹ̀ pẹ̀lú ìfẹ́ àti ìrètí ń ṣe àtìlẹ́yìn fún “ìgbàgbọ́,” ṣùgbọ́n πίστις tún lè túmọ̀ sí ìṣòtítọ́; nítorí náà, a kò pa ìtumọ̀ kejì náà rẹ́, a fi sí àlàyé ìsàlẹ̀.
- issue: Agbára ọ̀rọ̀ ἡμέρας ὄντες
  choice: jẹ́ ti ọ̀sán
  alternative: jẹ́ ti ìmọ́lẹ̀ ọ̀sán
  rationale: Àṣàyàn àkọ́kọ́ pa àkànlò Gíríìkì mọ́, kò sì ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò sọ ní tààrà.
- issue: Ìbáṣepọ̀ ìrètí ìgbàlà pẹ̀lú àṣíborí
  choice: fi ìrètí ìgbàlà ṣe àṣíborí
  alternative: wọ ìrètí ìgbàlà bí àṣíborí
  rationale: Àwọn méjèèjì lè ṣàfihàn apposition inú Gíríìkì. Àṣàyàn àkọ́kọ́ jẹ́ Yorùbá àdánidá, ó sì pa ìrètí ìgbàlà mọ́ gẹ́gẹ́ bí ohun tí àṣíborí náà dúró fún.
translation_notes:
  register: A lo Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Wà lójúfò” jẹ́ ọ̀rọ̀ àdánidá fún ìṣọ́ra àti ìkóra-ẹni-níjàánu nínú àyíká yìí; “ìgbàyà” àti “àṣíborí” sì pa àwòrán ohun ìjà ológun mọ́. A fi àmì ohùn sí ibi tí ó yẹ.
