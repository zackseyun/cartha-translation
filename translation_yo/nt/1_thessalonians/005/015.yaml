id: 1TH.5.15
reference: 1 Thessalonians 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: yo
  text: Ẹ ṣọ́ra kí ẹnikẹ́ni má ṣe fi ibi san ibi fún ẹnikẹ́ni[a]; ṣùgbọ́n ẹ máa lépa ohun rere nígbà gbogbo fún ara yín àti fún gbogbo ènìyàn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ rí i dájú pé ẹnikẹ́ni kò fi ibi san ibi fún ẹnikẹ́ni.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe pé ọ̀rọ̀ náà ń gbòòrò láti ‘ara yín,’ ìyẹn àwọn tí a ń bá sọ̀rọ̀ nínú àwùjọ náà, sí gbogbo ènìyàn.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Ẹ rí i dájú
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí kí gbogbo ìjọ ṣọ́ra kí wọ́n sì rí sí i pé ohun tí a sọ kò ṣẹlẹ̀; kì í ṣe wíwo lásán.
- source_word: μή τις ... ἀποδῷ
  choice: pé ẹnikẹ́ni kò ... san
  rationale: Ìṣètò yìí sọ ohun tí wọ́n gbọ́dọ̀ ṣọ́ra láti má ṣe; ọ̀nà yìí ṣe kedere, ó sì bójú mu ní Yorùbá òde òní.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: fi ibi san ibi
  rationale: Ó pa àtúnṣe ọ̀rọ̀ orísun mọ́, ó sì fi ìhùwàsí ìgbẹ̀san hàn láì dín ibi kù sí ìpalára ara nìkan.
- source_word: τινι
  choice: fún ẹnikẹ́ni
  rationale: Ó fi ẹni tí ìgbẹ̀san náà lè dé bá hàn, ó sì pa ìtẹnumọ́ gbogbogbò mọ́.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Èyí ni ìtumọ̀ àdábọ̀ tí ó ṣe kedere fún ìṣe tí kò gbọdọ̀ dáwọ́ dúró.
- source_word: τὸ ἀγαθὸν
  choice: ohun rere
  rationale: Ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ; ‘ohun rere’ jẹ́ ọ̀nà àdánidá láti sọ ẹ̀ka ìwà rere náà ní Yorùbá.
- source_word: διώκετε
  choice: ẹ máa lépa
  rationale: '‘Lépa’ pa agbára àṣẹ náà mọ́: kí wọ́n fi taratara wá ohun rere, kì í ṣe pé kí wọ́n kàn fẹ́ràn rẹ̀.'
- source_word: εἰς ἀλλήλους
  choice: fún ara yín
  rationale: Ó fi ìtọ́sọ́nà ìṣe rere sí àwọn ọmọ ẹgbẹ́ sí ara wọn hàn ní Yorùbá àdánidá.
- source_word: καὶ εἰς πάντας
  choice: àti fún gbogbo ènìyàn
  rationale: Ó pa ìtẹ̀síwájú láti inú àwùjọ sí gbogbo ènìyàn mọ́, láì fi ohun tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìwọ̀n ojúṣe ìwà rere Kristẹni
  choice: ‘Ara yín’ tọ́ka sí ìbáṣepọ̀ inú àwùjọ, ‘gbogbo ènìyàn’ sì mú ìwọ̀n náà gbòòrò sí i.
  alternative: ‘Gbogbo ènìyàn’ lè jẹ́ gbogbo àwọn onígbàgbọ́ nìkan.
  rationale: Àpapọ̀ εἰς ἀλλήλους καὶ εἰς πάντας sábà ń lọ láti ẹgbẹ́ inú sí ẹgbẹ́ tí ó gbòòrò; ìtumọ̀ náà pa ọ̀nà yìí mọ́, àkọsílẹ̀ ìsàlẹ̀ sì sọ pé ó ṣeé ṣe gan-an dípò kí ó sọ ọ́ di ohun tí kò lè yà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, èdè náà sì jẹ́ ti òde òní, ọlọ́lá, tí ó rọrùn fún òǹkàwé gbogbo.
