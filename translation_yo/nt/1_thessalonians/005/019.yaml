  yaml_path: translation/nt/1_thessalonians/005/019.yaml
  text: Do not quench the Spirit,[a]
translation:
  language: yo
  text: Ẹ má ṣe pa iná Ẹ̀mí náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀mí ní gbogbogbòò, ṣùgbọ́n ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni ó ń tọ́ka sí níhìn-ín, pàápàá nítorí ìsọtẹ́lẹ̀ tí a mẹ́nu kàn lẹ́yìn èyí.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí náà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀mí ní gbogbogbòò, ṣùgbọ́n àpilẹ̀kọ náà àti ọ̀rọ̀ nípa àsọtẹ́lẹ̀ nínú ẹsẹ tó tẹ̀ lé e fi hàn pé ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí. Lílò lẹ́tà ńlá fún ‘Ẹ̀mí’ ń fi ìtumọ̀ yìí hàn láìfi ‘Mímọ́’ kún ọ̀rọ̀ ìpilẹ̀ṣẹ̀.
- source_word: μὴ
  choice: Ẹ má ṣe
  rationale: μή pẹ̀lú ọ̀rọ̀ àṣẹ ìsinsìnyí jẹ́ ìkìlọ̀ pé kí a má ṣe ohun kan; ‘Ẹ má ṣe’ ni ọ̀nà Yorùbá tó ṣe déédéé fún ìfòfindè yìí.
- source_word: σβέννυτε
  choice: pa ... kú
  rationale: σβέννυμι túmọ̀ ní pàtàkì sí pípa iná tàbí ohun tó ń jó kú. Gbólóhùn ‘pa ... kú’ jẹ́ adayébá ní Yorùbá, ó sì pa àwòrán iná inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ìtara/ẹ̀bùn ti ẹ̀mí
  rationale: Àyíká ọ̀rọ̀, pàápàá ìkìlọ̀ nípa ṣíṣe àfojúdi sí àsọtẹ́lẹ̀, ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ohun tí ọ̀rọ̀ náà ń tọ́ka sí. Síbẹ̀, ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ tó gbòòrò, nítorí náà àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì náà pamọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé lasán. ‘Pa ... kú’ pa àwòrán pípa iná kú mọ́; àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ.
