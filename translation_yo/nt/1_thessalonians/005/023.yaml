id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: yo
  text: Kí Ọlọ́run àlàáfíà fúnra rẹ̀ sọ yín di mímọ́ pátápátá, kí ó sì pa ẹ̀mí yín, ọkàn yín àti ara yín gbogbo mọ́ láìní àbùkù nígbà wíwá Olúwa wa Jésù Mèsáyà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “nígbà wíwá Olúwa wa Jésù Kristi.”
    reason: alternative_reading
  - marker: b
    text: Pọ́ọ̀lù dárúkọ “ẹ̀mí àti ọkàn àti ara.” Àwọn onítumọ̀ yàtọ̀ síra lórí bóyá èyí ń kọ́ni pé ènìyàn ní apá mẹ́ta, tàbí pé ó kàn ń tẹnumọ́ gbogbo ẹni pátápátá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ pé Ọlọ́run fúnra rẹ̀ ni ẹni tí yóò ṣe iṣẹ́ náà mọ́ ní Yorùbá àdánidá.
- source_word: δὲ
  choice: a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: Níhìn-ín ó jẹ́ àmì ìyípadà sínú àdúrà ìbùkún; fífi “Ǹjẹ́” tàbí “Ṣùgbọ́n” kún un lè mú ìtumọ̀ àkókò tàbí ìtakora tí kò lágbára nínú Gíríìkì wọlé.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Ọlọ́run àlàáfíà
  rationale: Ó pa orúkọ ìdánimọ̀ Pọ́ọ̀lù mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἁγιάσαι
  choice: kí ... sọ yín di mímọ́
  rationale: Aorist optative jẹ́ ìfẹ́-àdúrà; ìṣètò “kí ...” fi èyí hàn dáadáa, “sọ ... di mímọ́” sì mú ìtumọ̀ ìsọdimímọ́ yé àwọn òǹkàwé òde òní.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀, tó ń tọ́ka sí gbogbo àwọn onígbàgbọ́ ní Tẹsalóníkà.
- source_word: ὁλοτελεῖς
  choice: pátápátá
  rationale: Ó sọ ìpéye àti kíkún iṣẹ́ ìsọdimímọ́ náà ní Yorùbá àdánidá.
- source_word: ὁλόκληρον
  choice: gbogbo
  rationale: Ó fi ìpéye tàbí àìpín ẹni náà hàn, ó sì so mọ́ àkójọ ẹ̀mí, ọkàn àti ara lọ́nà tó rọrùn.
- source_word: τὸ πνεῦμα
  choice: ẹ̀mí
  rationale: Ìtumọ̀ Yorùbá tó wọ́pọ̀ fún πνεῦμα nígbà tó ń tọ́ka sí apá ènìyàn.
- source_word: ἡ ψυχὴ
  choice: ọkàn
  rationale: Nínú àkójọ mẹ́ta yìí, “ọkàn” pa ìyàtọ̀ rẹ̀ sí ẹ̀mí àti ara mọ́ láìfi ètò ẹ̀kọ́ kan pàtó lé e lórí.
- source_word: τὸ σῶμα
  choice: ara
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédéé fún σῶμα.
- source_word: ἀμέμπτως
  choice: láìlẹ́gàn
  rationale: Ó ṣàpèjúwe ipò tí a ó pa wọn mọ́ sí—láìsí ẹ̀sùn tó lẹ́sẹ̀ nílẹ̀—ní ọ̀nà Yorùbá tó ṣàn.
- source_word: τηρηθείη
  choice: kí ó sì pa ... mọ́
  rationale: Optative passive kejì ń bá ìfẹ́-àdúrà àkọ́kọ́ mu; Yorùbá máa ń lo ọ̀nà olùṣe tí Ọlọ́run ni a lóye gẹ́gẹ́ bí olùṣe.
- source_word: ἐν τῇ παρουσίᾳ
  choice: nígbà wíwá
  rationale: Nínú ọ̀rọ̀ ọjọ́ ìkẹyìn ti Pọ́ọ̀lù, παρουσία tọ́ka sí wíwá tàbí dídé Olúwa.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níhìn-ín; “Mèsáyà” túmọ̀ oyè náà dípò títẹ̀lé ìkọ̀wé “Kristi” nìkan.
theological_decisions:
- issue: Àkójọ ẹ̀mí, ọkàn àti ara
  choice: Pa gbogbo ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta mọ́ bí Gíríìkì ṣe ní wọn.
  alternative: Ka àkójọ náà gẹ́gẹ́ bí ọ̀nà àsọyé fún gbogbo ènìyàn, láìsọ pé ènìyàn ní apá mẹ́ta ní pàtó.
  rationale: Ẹsẹ náà dárúkọ ẹ̀mí, ọkàn àti ara ní kedere, ṣùgbọ́n kò pinnu bóyá èyí jẹ́ ẹ̀kọ́ ìpín ènìyàn sí apá mẹ́ta tàbí ìtẹnumọ́ gbogbo ẹni; ìtumọ̀ náà pa àìdánilójú yìí mọ́.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ oyè “ẹni àmì òróró”; “Mèsáyà” fi oyè náà hàn, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fún “Kristi” gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. Ìṣètò “kí ...” ni a lò láti mú ìfẹ́-àdúrà àwọn optative méjèèjì jáde. A kò fi àmì ìyípadà δὲ hàn ní ọ̀rọ̀ ọ̀tọ̀, nítorí àyíká gbólóhùn náà ti fi ìyípadà sí àdúrà hàn.
