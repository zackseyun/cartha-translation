  source_fidelity: Ìfẹ́-àdúrà àwọn optative méjèèjì, ìtẹnumọ́ «fúnra rẹ̀», ìsọdimímọ́ pátápátá, àti àkójọ ẹ̀mí, ọkàn, ara ni a ti gbé jáde dáadáa. Ṣùgbọ́n «láìlẹ́gàn» túmọ̀ sí láìní ìtìjú tàbí ẹ̀gàn, kì í ṣe ἀμέμπτως, ẹni tí ó ní ìtumọ̀ ‘láìní àbùkù/láìsí ẹ̀sùn.’
  naturalness: Gbólóhùn náà ṣàn dáadáa ní Yorùbá boṣewa. Ṣíṣe ìní ẹni kejì hàn lórí ọ̀kọ̀ọ̀kan nínú àkójọ náà («ẹ̀mí yín, ọkàn yín àti ara yín») mú un kedere síi, ó sì ṣàdánidá ju fífi «yín» sí orúkọ ìkẹyìn nìkan lọ.
  terminology: «Ọlọ́run àlàáfíà», «sọ ... di mímọ́», «ẹ̀mí», «ọkàn», «ara», àti «Mèsáyà» bá ọ̀rọ̀ Gíríìkì mu. «Láìní àbùkù» ni ọ̀rọ̀ Yorùbá tó péye fún ipò àìní-ẹ̀sùn/àìní-àbùkù nínú ẹsẹ yìí.
