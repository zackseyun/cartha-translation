id: 1TH.5.10
reference: 1 Thessalonians 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: yo
  text: ẹni tí ó kú fún wa, kí, yálà a jí tàbí a sùn, a lè wà láàyè papọ̀ pẹ̀lú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yálà a wà lójúfò tàbí a sùn.” Gbólóhùn náà lè jẹ́ ìṣàmì sí ìkìlọ̀ láti máa wà lójúfò nínú àwọn ẹsẹ̀ tó yí i ká, bí ó tilẹ̀ jẹ́ pé níhìn-ín ó ṣeé ṣe jù pé ó ń tọ́ka sí bóyá àwọn onígbàgbọ́ wà láàyè tàbí wọ́n ti kú.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: ẹni tí ó kú
  rationale: Aorist participle náà ń ṣe àlàyé ẹni tí ẹsẹ tó ṣáájú pè ní Olúwa wa Jesu Kristi. Gbólóhùn alásopọ̀ “ẹni tí ó kú” jẹ́ Yorùbá àdánidá ju ṣíṣe àdàkọ participle náà lọ.
- source_word: περὶ ἡμῶν
  choice: fún wa
  rationale: Nínú àyíká ọ̀rọ̀ ìgbàlà yìí, περί pẹ̀lú genitive túmọ̀ sí pé ó ṣe é nítorí wa tàbí ní ipò wa. “Fún wa” jẹ́ kedere láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ ní pàtó kún un.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète tàbí àbájáde tí a fẹ́ hàn; “kí a lè” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára telic náà mọ́.
- source_word: γρηγορῶμεν
  choice: a jí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí jí ní ti ara tàbí wà lójúfò ní ti ìwà. “A jí” pa àwòrán jí/sùn mọ́, ó sì jẹ́ kí àìdánilójú inú ọ̀rọ̀ Gíríìkì dúró.
- source_word: καθεύδωμεν
  choice: a sùn
  rationale: Ó ṣe àtakò àdánidá sí “a jí.” Nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí ikú onígbàgbọ́, ṣùgbọ́n a kò tú àpẹẹrẹ náà sí “a kú” nínú ọ̀rọ̀ pàtàkì.
- source_word: ἅμα
  choice: jọ
  rationale: Níbí, ἅμα pẹ̀lú σύν ń fi ìgbé ayé àjọṣe hàn. “Jọ” mú ìtumọ̀ “papọ̀” jáde ní ṣókí.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: σύν fi ìbáṣepọ̀ tàbí ìṣọ̀kan hàn. Níwọ̀n bí “jọ” ti tú ἅμα, “pẹ̀lú rẹ̀” yẹra fún àtúnwí tí kò pọndandan.
- source_word: ζήσωμεν
  choice: a lè máa gbé
  rationale: Subjunctive aorist lábẹ́ ἵνα ń sọ ète tàbí àbájáde. “Máa gbé” níhìn-ín túmọ̀ sí wà láàyè, ó sì bá gbólóhùn “jọ máa gbé pẹ̀lú rẹ̀” mu ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ “a jí tàbí a sùn” nínú àyíká ọ̀rọ̀
  choice: Ní pàtàkì, ó ń tọ́ka sí bóyá àwọn onígbàgbọ́ ṣì wà láàyè tàbí wọ́n ti kú.
  alternative: Ó lè tọ́ka sí wíwà lójúfò ní ti ẹ̀mí ní ìyàtọ̀ sí àìbìkítà, gẹ́gẹ́ bí 5:6–7.
  rationale: Bí ó tilẹ̀ jẹ́ pé àwọn ọ̀rọ̀ Gíríìkì náà ní àwọ̀ ìtumọ̀ ìwà rere nínú àwọn ẹsẹ tó sún mọ́ ọn, ọ̀rọ̀ yìí dára pọ̀ mọ́ 4:13–15, níbi tí “sùn” ti jẹ́ àpẹẹrẹ fún àwọn onígbàgbọ́ tí wọ́n ti kú. Síbẹ̀, a pa àpẹẹrẹ àti àìdánilójú náà mọ́ nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọ̀wọ̀ àti àmì ohùn kíkún. Ètò gbólóhùn náà ń tẹ̀ lé ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí relative clause, ó sì pa àwòrán “jí/sùn” mọ́ láìyanju àìdánilójú ẹ̀kọ́ ìsìn ní ìkọ̀kọ̀.
