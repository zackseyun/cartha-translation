  text: Abstain from every kind of evil[a].
translation:
  language: yo
  text: Ẹ yẹra fún gbogbo irú ibi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ìrísí ibi”; ní ìtumọ̀ ìbílẹ̀, “gbogbo ohun tó dà bí ibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Ẹ yẹra
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn, ó sì ń pe wọ́n sí yíyẹra nígbà gbogbo. “Ẹ yẹra” jẹ́ Yorùbá àdánidá tó pa agbára àṣẹ àti ìtumọ̀ jíjìnnà sí ohun kan mọ́.
- source_word: ἀπὸ
  choice: fún
  rationale: Nínú gbólóhùn Yorùbá “yẹra fún,” “fún” ni ọ̀rọ̀ àsopọ̀ àdánidá tó fi ohun tí a gbọ́dọ̀ yẹra fún hàn; ó ṣe iṣẹ́ ìtumọ̀ ìpínyà tí ἀπό ní pẹ̀lú ἀπέχω.
- source_word: παντὸς
  choice: gbogbo
  rationale: Ó ń ṣàlàyé εἴδους ní ẹyọ, ó sì túmọ̀ sí pé kò sí irú ibi kankan tí a yọ sílẹ̀.
- source_word: εἴδους
  choice: irú
  rationale: Nínú àyíká yìí, “irú” túmọ̀ sí ẹ̀yà tàbí oríṣìíríṣìí, ó sì yẹ ju ìtumọ̀ tí yóò fi ọ̀rọ̀ náà hàn bí ohun tó kàn dà bí ibi lójú lọ.
- source_word: πονηροῦ
  choice: ibi
  rationale: “Ibi” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà fún ohun búburú tàbí ìwà búburú nínú gbólóhùn yìí.
theological_decisions:
- issue: Ìtumọ̀ εἴδους nínú ἀπὸ παντὸς εἴδους πονηροῦ
  choice: gbogbo irú ibi
  alternative: gbogbo àwòrán ibi; gbogbo ohun tó dà bí ibi
  rationale: Nínú àyíká yìí, εἶδος ṣeé ṣe kó túmọ̀ sí “irú” tàbí “ìrísí/àwòrán.” Àkọ́kọ́ dá lórí ìtumọ̀ tó ṣeé ṣe jù lọ, láì sọ àṣẹ náà di pé kí ènìyàn yẹra fún ohun gbogbo tí ó kàn dà bí ibi. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn.
translation_notes:
  register: Yorùbá àpéjọ tó mọ́gbọ́n dání, tó lérò, tí ó sì yé òǹkàwé òde òní. A lo “Ẹ” láti fi hàn pé àṣẹ náà ń lọ sí ọ̀pọ̀ ènìyàn, a sì lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá.
