id: 1TH.5.6
reference: 1 Thessalonians 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: yo
  text: Nítorí náà, kí a má ṣe sùn gẹ́gẹ́ bí àwọn yòókù ti ń sùn, ṣùgbọ́n kí a wà lójúfò, kí a sì máa wà ní ìwọ̀ntúnwọ̀nsì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a máa ṣọ́nà, kí a sì máa jẹ́ aláìmutí.” Ọ̀rọ̀ Gíríìkì àkọ́kọ́ lè tẹnumọ́ jíjí tàbí ìṣọ́nà; èkejì sì ní ìtumọ̀ aláìmutí, ó tún lè tọ́ka sí ọpọlọ mímọ́ tónítóní àti ìkóra-ẹni-níjàánu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Àwọn ọ̀rọ̀ méjèèjì fi ìparí èrò tí ó jáde láti inú ọ̀rọ̀ tó ṣáájú hàn. “Nítorí náà” jẹ́ ọ̀nà àdánidá, tí ó sì bójú mu ní Yorùbá.
- source_word: μὴ καθεύδωμεν
  choice: kí a má ṣe sùn
  rationale: Èyí pa ìṣírí ẹni-àkọ́kọ́ ọ̀pọ̀ mọ́, ó sì dá àwòrán oorun tí Pọ́ọ̀lù lò sílẹ̀ dípò kí a túmọ̀ rẹ̀ sí àìbìkítà ní tààrà.
- source_word: ὡς οἱ λοιποί
  choice: bí àwọn yòókù ti ń ṣe
  rationale: “Àwọn yòókù” ń tọ́ka sí àwọn ènìyàn mìíràn ní ìyàtọ̀ sí àwọn onígbàgbọ́; “ti ń ṣe” mú gbólóhùn Yorùbá náà pé àti kí ó dùn létí.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìtakora tó ṣe kedere hàn láàárín sísùn àti jíjí.
- source_word: γρηγορῶμεν
  choice: kí a máa jí
  rationale: Ó pa ìtakora sísùn àti jíjí mọ́. Ọ̀rọ̀ Gíríìkì tún lè tẹnumọ́ ṣíṣọ́nà, nítorí náà a fi àlàyé sí àlàyé-ẹsẹ̀.
- source_word: νήφωμεν
  choice: kí a sì máa wà ní àìmutípara
  rationale: Ìtumọ̀ ìpilẹ̀ rẹ̀ ni àìmutípara, ṣùgbọ́n ó tún lè ní ìtumọ̀ ọpọlọ mímọ́ àti ìkóra-ẹni-níjàánu. Àṣàyàn yìí pa àwòrán ìpilẹ̀ àti agbára ìwà rere rẹ̀ mọ́.
theological_decisions:
- issue: Agbára àkàwé oorun àti jíjí
  choice: A pa àwòrán sísùn àti jíjí mọ́ gẹ́gẹ́ bí ìṣírí nípa ìwà àti ẹ̀mí.
  alternative: Láti túmọ̀ ọ́ ní tààrà sí àìbìkítà nípa ẹ̀mí àti ṣíṣọ́nà.
  rationale: Àyíká ọ̀rọ̀ náà ń fi àwọn ọmọ ìmọ́lẹ̀ wé àwọn tí wọ́n jẹ́ ti òru. Pípa àwòrán náà mọ́ kò jẹ́ kí ìtumọ̀ fi agbára mú ohun tí Pọ́ọ̀lù mọ̀ọ́mọ̀ sọ ní àkàwé.
- issue: Ìtumọ̀ νήφω
  choice: wà ní àìmutípara
  alternative: ní ìkóra-ẹni-níjàánu; jẹ́ ẹni tí ọpọlọ rẹ̀ mọ́ tónítóní
  rationale: Ọ̀rọ̀ náà lè ní í ṣe pẹ̀lú àìmutípara ní ti ara àti pẹ̀lú ìṣọ́ra ọpọlọ àti ìkóra-ẹni-níjàánu. A pa ìfọ̀rọ̀wérọ̀ yìí mọ́ nínú ọ̀rọ̀ pàtàkì, a sì sọ àwọn ìtumọ̀ míì nínú àlàyé-ẹsẹ̀.
translation_notes:
  register: A lo Yorùbá àṣàdegbè tó bójú mu, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. “Kí a…” jẹ́ ọ̀nà àdánidá láti fi ìṣírí ẹni-àkọ́kọ́ ọ̀pọ̀ hàn; a sì pa àwòrán sísùn, jíjí àti àìmutípara ti orísun Gíríìkì mọ́.
