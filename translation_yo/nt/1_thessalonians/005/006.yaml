revisions:
- from: Nítorí náà, kí a má ṣe sùn bí àwọn yòókù ti ń ṣe, ṣùgbọ́n kí a máa jí[a], kí a sì máa wà ní àìmutípara[b].
  to: Nítorí náà, kí a má ṣe sùn gẹ́gẹ́ bí àwọn yòókù ti ń sùn, ṣùgbọ́n kí a wà lójúfò, kí a sì máa wà ní ìwọ̀ntúnwọ̀nsì.[a]
  rationale: 'Àtúnṣe náà ń pa ìtẹ̀lé ìtumọ̀ Gíríìkì mọ́: “Nítorí náà” fún ἄρα οὖν; “kí a má ṣe sùn” fún μὴ καθεύδωμεν; “gẹ́gẹ́ bí àwọn yòókù ti ń sùn” fún ὡς οἱ λοιποί; àti ìtakora “ṣùgbọ́n.” Ó rọ́pò àwọn ìsọ̀rọ̀ tí kò wọ́pọ̀ tàbí tí ó lè yí ìtumọ̀ padà pẹ̀lú Yorùbá òde òní tó mọ́gbọ́n dání, nígbà tí àlàyé-ẹsẹ̀ ń pa àìdájú/ìfẹ̀mìsí ọ̀rọ̀ γρηγορέω àti νήφω mọ́.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:21:48Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìpè àbájáde (ἄρα οὖν), ìṣírí ẹni-àkọ́kọ́ ọ̀pọ̀, àti àwòrán sísùn/jíjí mọ́. Síbẹ̀, “kí a máa wà ní àìmutípara” kò jẹ́ ọ̀nà Yorùbá tí ó dájú, tí ó sì lè dà bí ìkọ̀sílẹ̀ ọ̀rọ̀ tuntun. A tún ṣe ìyàtọ̀ kedere láàárín ìpè láti má sùn àti ìpè láti wà lójúfò.
  naturalness: “Kí a wà lójúfò” jẹ́ ọ̀nà àdánidá láti sọ γρηγορῶμεν nínú àyíká àkàwé yìí. “Kí a máa wà ní ìwọ̀ntúnwọ̀nsì” jẹ́ ọ̀nà Yorùbá tó yege fún ìfẹ̀tọ́nú/ìmú ara ẹni ní ìwọ̀ntúnwọ̀nsì, ó sì lè gbé ìtumọ̀ ìpìlẹ̀ νήφω (“jẹ́ aláìmutí”) pẹ̀lú ìtanràn ọpọlọ rẹ̀.
  terminology: A yí “àìmutípara” padà sí “ìwọ̀ntúnwọ̀nsì,” nítorí ó jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó sì bójú mu fún ìhùwàsí ìfẹ̀tọ́nú. Àlàyé-ẹsẹ̀ náà ṣì ń fúnni ní “aláìmutí,” “ní ìkóra-ẹni-níjàánu,” àti “ọpọlọ … mọ́ tónítóní,” láì fi ìtumọ̀ kan ṣoṣo di dandan.
  issues:
