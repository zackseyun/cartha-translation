    rationale: Ó lè má ṣe yé òǹkàwé òde òní, ó sì lè dà bí ọ̀rọ̀ tí a dá pọ̀. “Ìwọ̀ntúnwọ̀nsì” jẹ́ ìsọ̀rọ̀ tó dájú síi fún ìfẹ̀tọ́nú àti ìkóra-ẹni-níjàánu.
  - severity: low
