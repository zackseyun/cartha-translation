id: 1TH.5.3
reference: 1 Thessalonians 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: yo
  text: Nígbà tí wọ́n bá sọ pé, “Àlàáfíà àti ààbò,” nígbà náà ni ìparun òjijì yóò dé bá wọn, gẹ́gẹ́ bí ìrora ìbímọ́ ṣe dé bá obìnrin aboyún; wọn kò sì ní sá àsálà rárá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Nígbà tí wọ́n bá ń sọ pé
  rationale: “Nígbà tí ... bá” fi ìṣe ọjọ́ iwájú tí àkókò rẹ̀ kò tíì dájú hàn; “ń sọ” mú ìṣe tí ó ń lọ lọ́wọ́ inú ọ̀rọ̀ Gíríìkì jáde lọ́nà àdánidá ní Yorùbá.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Àlàáfíà àti ààbò
  rationale: “Àlàáfíà” àti “ààbò” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ ìfọ̀kànbalẹ̀ àti àìsí ewu mọ́.
- source_word: τότε
  choice: nígbà náà ni
  rationale: Ìkọ̀lé yìí tẹnu mọ́ àbájáde tí yóò tẹ̀ lé àsọjáde wọn.
- source_word: αἰφνίδιος ... ἐφίσταται ὄλεθρος
  choice: ìparun òjijì yóò dé bá wọn
  rationale: Ó pa bí ìparun náà ṣe máa dé lójijì mọ́, ó sì tú ἐφίσταται sí Yorùbá àdánidá gẹ́gẹ́ bí “dé bá.”
- source_word: ὥσπερ ἡ ὠδὶν
  choice: bí ìrora ìrọbí
  rationale: “Ìrora ìrọbí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí ìrora ìbímọ, ó sì pa àfiwé náà mọ́.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: obìnrin aboyún
  rationale: Èyí ni ìtumọ̀ àdánidá fún ẹni tí ó ní ọmọ nínú ilé-ọmọ.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: wọn kò sì ní sá àsálà rárá
  rationale: “Rárá” mú ìkọ̀sílẹ̀ alágbára οὐ μή jáde, “sá àsálà” sì sọ ἐκφεύγω ní Yorùbá tó yéni.
theological_decisions:
- issue: Ìtumọ̀ ὄλεθρος nínú ìkìlọ̀ nípa ìdájọ́ ọjọ́ ìkẹyìn
  choice: ìparun
  alternative: ìbàjẹ́ pátápátá; ìdálẹ́bi
  rationale: “Ìparun” pa bí ìdájọ́ náà ṣe le tó mọ́ láì pinnu bóyá ọ̀rọ̀ náà túmọ̀ sí pípa ẹni run kúrò pátápátá tàbí irú ìjìyà kan pàtó.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Kò sí àlàyé ẹsẹ̀ tí ó pọndandan, nítorí náà kò sí àmì àlàyé nínú ọ̀rọ̀ náà.
