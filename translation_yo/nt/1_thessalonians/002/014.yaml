id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: yo
  text: Nítorí ẹ̀yin, ará, ti di aláfarawé àwọn ìjọ Ọlọ́run tí ó wà ní Jùdíà nínú Mèsáyà Jésù[a], nítorí pé ẹ̀yin náà ti jìyà ohun kan náà lọ́wọ́ àwọn ará ìbílẹ̀ yín gan-an[c], gẹ́gẹ́ bí àwọn ìjọ náà ti jìyà lọ́wọ́ àwọn Júù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí ó túmọ̀ sí “Ẹni Àmì Òróró,” ìyẹn Mèsáyà.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn ará Jùdíà.” Ọ̀rọ̀ Gíríìkì Ἰουδαίων lè túmọ̀ sí àwọn Júù tàbí àwọn ará Jùdíà, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn ènìyàn ìbílẹ̀ yín gan-an.”
    reason: previous_rendering
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: di aláfarawé
  rationale: “Di” fi ìtumọ̀ ἐγενήθητε (“ẹ di”) hàn, “aláfarawé” sì pa èrò ìfarawe inú μιμηταί mọ́ láì sọ ọ́ di títẹ̀lé lásán.
- source_word: ἀδελφοί
  choice: ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ ìpè àdánidá ní Yorùbá fún àwọn ọmọ ìjọ lápapọ̀, ó sì lè gba gbogbo àwùjọ láì fi akọ tàbí abo kún ohun tí Gíríìkì kò sọ ní pàtó ní àyíká yìí.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: àwọn ìjọ Ọlọ́run
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá àyíká lẹ́tà Paulu mu fún ἐκκλησία.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: tí ó wà ní Jùdíà
  rationale: Gbólóhùn yìí fi ibi tí àwọn ìjọ náà wà hàn ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Mèsáyà” pa ìtumọ̀ oyè Χριστός mọ́, “nínú” sì fi ìbáṣepọ̀ tí ἐν ń tọ́ka sí hàn láì tú u ju bí orísun ṣe sọ lọ.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: jìyà ohun kan náà
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ ìfiwéra tààrà “ohun kan náà” mọ́, ó sì sọ πάσχω ní ti ìjìyà.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: àwọn ará ilẹ̀ yín fúnra yín
  rationale: “Àwọn ará ilẹ̀ yín” ṣàfihàn àwọn ẹni tí ó jẹ́ ti orílẹ̀-èdè tàbí ẹgbẹ́ ènìyàn kan náà; “fúnra yín” sì pa ìtẹnumọ́ ἰδίων mọ́.
- source_word: τῶν Ἰουδαίων
  choice: àwọn Júù
  rationale: Èyí ni ìtumọ̀ ẹ̀sìn-ẹ̀yà tí ó wọ́pọ̀ fún Ἰουδαῖοι ní àyíká yìí, ṣùgbọ́n àṣàyàn “àwọn ará Jùdíà” wà nínú àlàyé ìsàlẹ̀ nítorí àìdánilójú ọ̀rọ̀ náà.
theological_decisions:
- issue: Bí a ṣe tú Χριστῷ gẹ́gẹ́ bí oyè tàbí gẹ́gẹ́ bí apá orúkọ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ní ìtumọ̀ oyè ẹni àmì òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, nígbà tí àṣàyàn tí ó wọ́pọ̀ jù lọ ní Yorùbá wà nínú àlàyé.
- issue: Ààlà àwọn tí “àwọn Júù” ń tọ́ka sí
  choice: àwọn Júù
  alternative: àwọn ará Jùdíà
  rationale: A kò fi “gbogbo” kún ọ̀rọ̀ náà, nítorí ẹsẹ yìí ń tọ́ka sí àwọn olùṣe ìpọ́njú tí a mẹ́nu kàn nínú àyíká, kì í ṣe gbogbo Júù láìsí ìyàtọ̀. Àìdánilójú láàárín ìtumọ̀ ẹ̀yà-ẹ̀sìn àti ti agbègbè ni a pa mọ́ nínú àlàyé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà tẹ̀lé ìṣísẹ̀ ìrònú Gíríìkì, ṣùgbọ́n a ṣètò rẹ̀ kí ó lè dùn bí Yorùbá àdánidá. “Ará” jẹ́ ọ̀rọ̀ ìpè àwùjọ tí ó wọ́pọ̀, “lọ́wọ́” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí ìjìyà ti ọ̀dọ̀ rẹ̀ wá.
