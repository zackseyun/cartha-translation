  naturalness: 'Àtúnṣe náà mú gbolóhùn náà rọrùn síi: “ẹ ti di” jẹ́ Yorùbá àdánidá fún ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀, “àwọn ará ìbílẹ̀ yín gan-an” sì gbé ìtumọ̀ συμφυλετῶν àti ìtẹnumọ́ ἰδίων jáde lọ́nà tí ó dára ju “fúnra yín” lọ. Fífi “àwọn ìjọ náà” sí ibi aṣojú-ọrọ̀ ìkẹyìn tún mú ìtọ́kasí náà yege.'
