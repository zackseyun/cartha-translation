  source_fidelity: 'Ìtumọ̀ náà ń pa ọ̀pọ̀ nínú ìbáṣepọ̀ Gíríìkì mọ́: ìjìyà ṣáájú, ìwà ìkà tí wọ́n hù sí wọn, Fílípì, ìgboyà nínú Ọlọ́run, ìhìn rere Ọlọ́run, àti ἀγών. Síbẹ̀, “ìjàkadì ńlá” yí πολλῷ (“púpọ̀”) padà sí “ńlá,” àti “a ní ìgboyà” lè ka bí ipò lásán dípò ìgbésẹ̀ ìgboyà tí aorist náà ń sọ. Àtúnṣe náà mú àwọn ìpele wọ̀nyí sún mọ́ orísun.'
