id: 1TH.2.2
reference: 1 Thessalonians 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: yo
  text: Ṣùgbọ́n lẹ́yìn tí a ti jìyà tẹ́lẹ̀, tí wọ́n sì ti hùwà ìkà sí wa, tí wọ́n sì fi wa sí ìtìjú ní Fílípì, gẹ́gẹ́ bí ẹ ti mọ̀[a], a fi ìgboyà sọ̀rọ̀ nínú Ọlọ́run wa[b] láti sọ ìhìn rere Ọlọ́run fún yín láàrín ìjàkadì púpọ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí wọ́n ti gàn wá,” “tí wọ́n hùwà àfojúdi sí wa,” tàbí “tí wọ́n ti ṣe wá ní ibi.” Ọ̀rọ̀ Gíríìkì náà ní èrò pé a hùwà sí ènìyàn pẹ̀lú àfojúdi tàbí a fi í sí ìtìjú ní gbangba.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “a ní ìgboyà nínú Ọlọ́run wa.” Ọ̀rọ̀ ìṣe Gíríìkì náà fúnra rẹ̀ lè ní èrò sísọ̀rọ̀ pẹ̀lú ìgboyà; ìtumọ̀ yìí fi ìṣe ìgboyà náà hàn, nígbà tí “láti sọ” ṣì ń tọ́ka sí àkóónú tí wọ́n sọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “nínú ìforígbárí púpọ̀” tàbí “pẹ̀lú àtakò líle.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ohun tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìyàtọ̀ bẹ́ẹ̀ ní Yorùbá.
- source_word: προπαθόντες
  choice: lẹ́yìn tí a ti jìyà tẹ́lẹ̀
  rationale: Ó fi hàn pé ìjìyà náà ti ṣẹlẹ̀ ṣáájú ìgbésẹ̀ pàtàkì inú gbólóhùn náà; “tẹ́lẹ̀” tún mú agbára προ- jáde.
- source_word: ὑβρισθέντες
  choice: tí wọ́n sì ti ṣe wa ní ìkà àti ẹ̀gàn
  rationale: Ọ̀rọ̀ náà ju èébú ẹnu lásán lọ; ó ní ìtumọ̀ ìwà ìkà, ìfojú-kéré, àti ìtìjú tí a fi kan ènìyàn.
- source_word: καθὼς οἴδατε
  choice: bí ẹ ti mọ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu fún ìtọ́ka sí ohun tí àwọn olùgbọ́ ti mọ̀.
- source_word: ἐν Φιλίπποις
  choice: ní Fílípì
  rationale: A lo àkọsílẹ̀ orúkọ ìlú náà ní ìbámu pẹ̀lú ìpè Yorùbá.
- source_word: ἐπαρρησιασάμεθα
  choice: a ní ìgboyà
  rationale: Ó ṣàfihàn ìgboyà àti òmìnira láti sọ̀rọ̀. A kò túmọ̀ rẹ̀ sí “a sọ̀rọ̀ pẹ̀lú ìgboyà” nínú àkọ́kọ́, kí λαλῆσαι lè dúró gẹ́gẹ́ bí “láti sọ.”
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: nínú Ọlọ́run wa
  rationale: Èyí pa àyè ìtumọ̀ ti ipò tàbí ìpìlẹ̀ ìgboyà wọn mọ́, láì sọ ọ́ di pé Ọlọ́run nìkan ni ohun èlò tó mú un ṣẹlẹ̀.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: láti sọ ... fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ ohun kan fún àwọn olùgbọ́.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ìhìn rere Ọlọ́run
  rationale: Ó pa ìtumọ̀ ìhìn ayọ̀ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Ọlọ́run mọ́, láì pinnu bóyá genitive náà túmọ̀ sí orísun tàbí ohun tí ìhìn náà dá lé.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: nínú ìjàkadì ńlá
  rationale: ἀγών lè túmọ̀ sí ìjàkadì, ìdíje, tàbí ìforígbárí. “Ìjàkadì ńlá” pa ìtumọ̀ gbòòrò yẹn mọ́ ju kí a dín in kù sí àtakò láti ọ̀dọ̀ àwọn ènìyàn nìkan.
theological_decisions:
- issue: Agbára ἐν τῷ θεῷ ἡμῶν
  choice: nínú Ọlọ́run wa
  alternative: nípasẹ̀ Ọlọ́run wa; pẹ̀lú ìgbẹ́kẹ̀lé nínú Ọlọ́run wa
  rationale: “Nínú” pa ìbáṣepọ̀, ipò, àti ìpìlẹ̀ ìgboyà àwọn aposteli mọ́. “Nípasẹ̀” lè dín ọ̀rọ̀ náà kù sí ohun tí Ọlọ́run mú ṣẹlẹ̀, “pẹ̀lú ìgbẹ́kẹ̀lé” sì lè ṣàlàyé ohun tí Gíríìkì kò sọ ní tààrà.
- issue: Ìtumọ̀ τοῦ θεοῦ nínú τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ìhìn rere Ọlọ́run
  alternative: ìhìn rere láti ọ̀dọ̀ Ọlọ́run; ìhìn rere nípa Ọlọ́run
  rationale: Ìkọ̀lé Yorùbá náà pa àìdánilójú tó wà nínú genitive Gíríìkì mọ́, láì yan orísun tàbí àkóónú nìkan.
translation_notes:
  register: A lo Yorùbá àkókò-òde tó ní iyì, tó sì ṣe kedere fún òǹkàwé lásán. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. “Ẹ” àti “yín” fi hàn pé ọ̀pọ̀ ènìyàn ni Pọ́ọ̀lù ń bá sọ̀rọ̀, “a/wa” sì pa ohùn ẹgbẹ́ àwọn olùránṣẹ́ mọ́.
