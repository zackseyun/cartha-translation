id: 1TH.2.9
reference: 1 Thessalonians 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: yo
  text: Nítorí ẹ rántí, ẹ̀yin ará[a], làálàá àti ìnira wa; bí a ti ń ṣiṣẹ́ ní òru àti ní ọ̀sán kí a má bàa di ẹrù fún ẹnikẹ́ni nínú yín, a kéde ìhìn rere Ọlọ́run fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ tààrà, “ẹ̀yin arákùnrin”; ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, ṣùgbọ́n ó lè jẹ́ ìpè fún gbogbo ìjọ, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: ẹ rántí
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ọ̀rọ̀ ìṣísẹ̀ àkókò ìsinsìnyí fún ọ̀pọ̀ ènìyàn, kì í ṣe àṣẹ; ó tọ́ka sí ohun tí àwọn ará Tẹsalóníkà mọ̀ tí wọ́n sì rántí.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà àdánidá ní Yorùbá láti pe àwọn ọmọ ìjọ, kò sì fi ìyàtọ̀ akọ àti abo tí èdè Gíríìkì lè fi hàn pamọ́; àlàyé ìsàlẹ̀ sọ pé fọ́ọ̀mù Gíríìkì jẹ́ akọ ní ọ̀pọ̀.
- source_word: κόπον καὶ τὸν μόχθον
  choice: làálàá àti ìnira
  rationale: “Làálàá” mú iṣẹ́ takuntakun jáde, “ìnira” sì pa ìtumọ̀ wàhálà tàbí ìjìyà tí ó bá iṣẹ́ náà rìn mọ́, nígbà tí ó ń pa ìyàtọ̀ àwọn ọ̀rọ̀ méjèèjì mọ́.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ní òru àti ní ọ̀sán
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún iṣẹ́ tí a ń ṣe tọ̀sán-tòru, ó sì tẹ̀lé ìtòlẹ́sẹẹsẹ orísun.
- source_word: ἐργαζόμενοι
  choice: bí a ti ń ṣiṣẹ́
  rationale: Ọ̀rọ̀ náà ṣàlàyé ipò tàbí ọ̀nà tí wọ́n gbà kéde ìhìn rere; “ń ṣiṣẹ́” jẹ́ èdè àdánidá, kò sì tún “làálàá” sọ lọ́nà tí kò pọn dandan.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: kí a má bàa di ẹrù fún ẹnikẹ́ni nínú yín
  rationale: Ìkọ̀lé náà fi ète hàn. “Di ẹrù fún” lè gba ẹrù owó tàbí ìtọ́jú láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐκηρύξαμεν
  choice: a kéde
  rationale: “Kéde” pa agbára ìpolongo ní gbangba tí κηρύσσω ní mọ́, ó sì yàgò fún ọ̀rọ̀ ìjọ kan tí ó lè dín ìtumọ̀ rẹ̀ kù.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Nínú Yorùbá, “kéde ... fún yín” jẹ́ ọ̀nà àdánidá láti fi ìtọ́sọ́nà ìkéde náà hàn; kò ṣe ìpinnu pé ó túmọ̀ sí “láàárín yín.”
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ìhìn rere Ọlọ́run
  rationale: “Ìhìn rere” jẹ́ ìtumọ̀ kedere àti èyí tí a mọ̀ sí εὐαγγέλιον; ìsopọ̀ “Ọlọ́run” pa àìdánilójú gẹ̀nítífù mọ́ bóyá Ọlọ́run ni orísun, olóhun, tàbí kókó ìhìn náà.
theological_decisions:
- issue: Ìtumọ̀ tó lè gba gbogbo ènìyàn nínú ἀδελφοί
  choice: Lo “ẹ̀yin ará” nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sì sọ fọ́ọ̀mù orísun
  alternative: “ẹ̀yin arákùnrin” tàbí “ẹ̀yin arákùnrin àti arábìnrin”
  rationale: “Ará” jẹ́ ìpè àdánidá fún gbogbo ìjọ ní Yorùbá, ṣùgbọ́n àlàyé náà pa òtítọ́ fọ́ọ̀mù akọ ní Gíríìkì mọ́, láì fi “àti arábìnrin” kún ọ̀rọ̀ orísun ní tààrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A lo “làálàá” àti “ìnira” láti pa ìbejì ọ̀rọ̀ Gíríìkì mọ́; a sì lo “ìhìn rere” dípò àyálò-ọ̀rọ̀ ẹ̀sìn kí ìtumọ̀ lè ṣe kedere fún òǹkàwé òde òní.
