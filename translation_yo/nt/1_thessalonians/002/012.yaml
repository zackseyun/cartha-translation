id: 1TH.2.12
reference: 1 Thessalonians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: yo
  text: à ń gba yín níyànjú[a], à ń tù yín nínú, a sì ń fi taratara rọ̀ yín pé kí ẹ máa rìn gẹ́gẹ́ bí ó ti yẹ fún Ọlọ́run, ẹni tí ń pè yín sínú ìjọba àti ògo tirẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘à ń gbà yín níyànjú ... a sì ń fi ìdánilójú sọ fún yín.’ Àwọn ọ̀rọ̀ ìṣe mẹ́tẹ̀ẹ̀ta náà ń ṣàpèjúwe iṣẹ́ Pọ́ọ̀lù bí ti baba, ìtumọ̀ wọn sì bára wọn dé ní ti ìṣírí, ìtùnú àti ẹ̀bẹ̀ ọlọ́wọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: à ń gba yín níyànjú
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe iṣẹ́ ìtọ́nisọ́nà tí ó ń bá a lọ. ‘Gba ... níyànjú’ bá ohùn onífẹ̀ẹ́ bí ti baba mu, ó sì lè ní ìtumọ̀ ìṣírí àti ìkìlọ̀ pẹ̀lẹ́ láì mú un le ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
- source_word: παραμυθούμενοι
  choice: à ń tù yín nínú
  rationale: Ó fi ọ̀rọ̀ ìtùnú àti ìṣírí onífẹ̀ẹ́ hàn, ó sì yà díẹ̀ sí ‘gba níyànjú’ nínú ọ̀wọ́ ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta náà.
- source_word: μαρτυρόμενοι
  choice: a sì ń fi taratara rọ̀ yín
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹ̀bẹ̀ tàbí ìrọ̀ tó lágbára tí a fi ìdánilójú ṣe. ‘Fi taratara rọ̀’ mú agbára ọ̀rọ̀ náà jáde láì túmọ̀ ọ́ sí jíjẹ́rìí níbi tí ìtumọ̀ yẹn kò ti ní ṣe kedere.
- source_word: εἰς τὸ περιπατεῖν
  choice: pé kí ẹ máa rìn ní ọ̀nà
  rationale: Ìkọ̀lé yìí ń fi ète tàbí àbájáde hàn. ‘Rìn ní ọ̀nà’ pa àkàwé Bíbélì mọ́ ní Yorùbá tó ṣe kedere, tí ó ń tọ́ka sí bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀.
- source_word: ἀξίως τοῦ θεοῦ
  choice: tí ó yẹ fún Ọlọ́run
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ìwà tàbí ìgbé-ayé tí ó bá Ọlọ́run mu, tí ó sì pa ìbáṣepọ̀ gírámà ti ἀξίως àti τοῦ θεοῦ mọ́.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: ẹni tí ń pè yín
  rationale: Ọ̀rọ̀ ìṣe alárinrin àsìkò ìsinsìnyí ni Gíríìkì lò; ‘tí ń pè yín’ pa ìṣe tí ń lọ lọ́wọ́ mọ́ láì fi ẹ̀kọ́ ìsìn kan kún àkókò tàbí ọ̀nà ìpè náà.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: sínú ìjọba àti ògo tirẹ̀
  rationale: ‘Sínú’ bá εἰς mu, ‘tirẹ̀’ sì pa ìtẹnumọ́ ἑαυτοῦ mọ́. A fi ìjọba àti ògo sílẹ̀ gẹ́gẹ́ bí ohun méjì tí ọ̀rọ̀-àmúyẹ kan náà ń darí, láì ṣàlàyé ìbáṣepọ̀ wọn ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Bóyá kí a pa àkàwé περιπατεῖν mọ́ tàbí kí a túmọ̀ rẹ̀ ní tààrà sí gbígbé ìgbésí ayé
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘rìn ní ọ̀nà’
  alternative: ‘gbé ìgbésí ayé’ tàbí ‘máa hùwà’
  rationale: ‘Rìn ní ọ̀nà’ jẹ́ àkàwé Bíbélì tí ó ṣeé lóye ní Yorùbá, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àwọn ẹsẹ mìíràn tó ń lo àwòrán ìrìn gẹ́gẹ́ bí ọ̀nà ìgbésí ayé.
- issue: Agbára àti àkókò ìpè Ọlọ́run nínú τοῦ καλοῦντος ὑμᾶς
  choice: ‘ẹni tí ń pè yín’ ní àsìkò ìsinsìnyí
  alternative: ‘ẹni tí ó pè yín’
  rationale: Yíyan àsìkò ìsinsìnyí tẹ̀ lé participle Gíríìkì, ó sì yẹra fún fífi ìpinnu ẹ̀kọ́ ìsìn kan kún bí ìpè Ọlọ́run ṣe ń ṣiṣẹ́ tàbí ìgbà tí ó ṣẹlẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí ó yẹ. Ọ̀wọ́ ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta náà ní ìlù ọ̀rọ̀ onífẹ̀ẹ́ ṣùgbọ́n tó lágbára, ní ìbámu pẹ̀lú àwòrán iṣẹ́ baba nínú àyíká ẹsẹ náà.
