id: 1TH.2.16
reference: 1 Thessalonians 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: yo
  text: tí wọ́n ń dí wa lọ́wọ́ láti bá àwọn tí kì í ṣe Júù sọ̀rọ̀ kí wọ́n lè rí ìgbàlà, nípa bẹ́ẹ̀ wọ́n sì ń mú òṣùwọ̀n ẹ̀ṣẹ̀ wọn kún nígbà gbogbo. Ṣùgbọ́n ìbínú[b] ti dé sórí wọn níkẹyìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “pátápátá,” “títí dé òpin,” tàbí “dé ẹ̀kúnrẹ́rẹ́” dípò “níkẹyìn” (Gíríìkì: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “ìbínú” tọ́ka sí ìdájọ́ Ọlọ́run; ṣùgbọ́n Pọ́ọ̀lù kò sọ níbí bóyá ìdájọ́ kan nínú ìtàn, ìdájọ́ ìkẹyìn, tàbí àwọn méjèèjì ni ó ní lọ́kàn.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: tí wọ́n ń dí wa lọ́wọ́
  rationale: Ó fi ìṣe ìdènà tí ó ń bá a lọ hàn, ó sì bá àkójọpọ̀ ọ̀rọ̀ tí ó ṣáájú mu láì sọ ọ́ di ìfòfindè lábẹ́ òfin.
- source_word: τοῖς ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Ní ibi yìí, ó ń tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìjọba.
- source_word: λαλῆσαι
  choice: láti sọ̀rọ̀ fún
  rationale: Ó túmọ̀ infinitive náà ní tààràtà; àyíká ọ̀rọ̀ ló ń fi hàn pé ìkéde ìhìn rere ni ọ̀rọ̀ náà.
- source_word: ἵνα σωθῶσιν
  choice: kí wọ́n lè rí ìgbàlà
  rationale: Ó pa ète gbólóhùn náà àti ìtumọ̀ passive mọ́, láì fi ẹni tí ń gbà wọ́n là kún ohun tí a sọ ní pàtó.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: Nípa bẹ́ẹ̀, wọ́n ń mú ... kún
  rationale: Ó mú àbájáde ìdènà náà jáde ní Yorùbá àdánidá, láì sọ pé ète tí wọ́n mọ̀ọ́mọ̀ ní ni láti mú ẹ̀ṣẹ̀ wọn kún.
- source_word: ἀναπληρῶσαι
  choice: mú òṣùwọ̀n ... kún
  rationale: Fífi ‘òṣùwọ̀n’ sí i mú àwòrán ọ̀rọ̀ ti ẹ̀ṣẹ̀ tí ó dé ẹ̀kúnrẹ́rẹ́ yé kedere ní Yorùbá.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó fi ìwà tàbí ìṣe tí ó ń tẹ̀ síwájú ní gbogbo ìgbà hàn.
- source_word: ἔφθασεν
  choice: ti dé bá
  rationale: Ó fi ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ sì wà nísinsin yìí hàn, ó sì bá ἐπ’ αὐτούς mu lọ́nà àdánidá.
- source_word: ὀργή
  choice: ìbínú
  rationale: Ó pa agbára ọ̀rọ̀ náà mọ́ láì rọ́pò rẹ̀ pẹ̀lú ‘ìdájọ́,’ èyí tí yóò jẹ́ àlàyé ju ìtumọ̀ ọ̀rọ̀ lọ.
- source_word: εἰς τέλος
  choice: níkẹyìn
  rationale: Ó fi ìdé òpin tàbí ìparí hàn lọ́nà Yorùbá àdánidá; àwọn ìtumọ̀ ‘pátápátá’ àti ‘títí dé òpin’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí ‘ìbínú’ ń tọ́ka sí àti irú ìdájọ́ tí ó jẹ́
  choice: A fi ‘ìbínú’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ tó ṣeé lò fún ìbínú tàbí ìdájọ́ Ọlọ́run, láì sọ àkókò rẹ̀ ní pàtó.
  alternative: Ìdájọ́ kan pàtó nínú ìtàn; ìdájọ́ ìkẹyìn; tàbí méjèèjì.
  rationale: Ẹsẹ̀ náà kò sọ bóyá ìṣẹ̀lẹ̀ ìtàn kan, ìdájọ́ ọjọ́ iwájú, tàbí méjèèjì ni Pọ́ọ̀lù ní lọ́kàn.
- issue: Ipá εἰς τὸ ἀναπληρῶσαι
  choice: Àbájáde ni a tẹnumọ̀.
  alternative: 'Ète: ‘láti mú ẹ̀ṣẹ̀ wọn kún.’'
  rationale: Yíyan àbájáde kò fi kún ọ̀rọ̀ pé àwọn alátakò náà mọ̀ọ́mọ̀ pinnu láti mú ẹ̀ṣẹ̀ wọn dé ẹ̀kúnrẹ́rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. ‘Kèfèrí’ ni a lò fún àwọn tí kì í ṣe Júù; ‘rí ìgbàlà’ pa ìtumọ̀ passive mọ́; a kò fi ‘Ọlọ́run’ kún ‘ìbínú’ nínú ọ̀rọ̀ pàtàkì, kí àìdánilójú inú orísun lè dúró.
