  to: tí wọ́n ń dí wa lọ́wọ́ láti bá àwọn tí kì í ṣe Júù sọ̀rọ̀ kí wọ́n lè rí ìgbàlà, nípa bẹ́ẹ̀ wọ́n sì ń mú òṣùwọ̀n ẹ̀ṣẹ̀ wọn kún nígbà gbogbo. Ṣùgbọ́n ìbínú[b] ti dé sórí wọn níkẹyìn.[a]
  rationale: Àtúnṣe náà ṣàtúnṣe ìtọ́kasí àwọn olùgbọ́ ìhìn náà sí “àwọn tí kì í ṣe Júù,” kí ìtumọ̀ τοῖς ἔθνεσιν péye, kí ó sì yẹra fún ìró ẹ̀gàn. A tún yí “sọ̀rọ̀ fún” sí “bá ... sọ̀rọ̀” àti “dé bá wọn” sí “dé sórí wọn” fún ìbámu pẹ̀lú Gíríìkì àti ìlò Yorùbá. A pa ìtumọ̀ àbájáde εἰς τὸ ἀναπληρῶσαι mọ́, a kò sì pinnu irú ìbínú tàbí ìdájọ́ tí Pọ́ọ̀lù ní lọ́kàn.
