id: 1TH.2.19
reference: 1 Thessalonians 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: yo
  text: Nítorí kí ni ìrètí wa, tàbí ayọ̀ wa, tàbí adé ìṣògo wa—ṣé kì í ṣe ẹ̀yin náà?—níwájú Olúwa wa Jésù ní ìgbà ìwíwá rẹ̀[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní ìgbà dídé rẹ̀” tàbí “ní ìgbà ìwàníhìn-ín rẹ̀.” Ọ̀rọ̀ Gíríìkì παρουσία lè túmọ̀ sí ìwàníhìn-ín tàbí dídé; nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ìwíwá Olúwa Jésù lọ́jọ́ iwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: kí ni
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ‘ta ni’ tàbí ‘kí ni,’ àwọn ọ̀rọ̀-orúkọ tí ó tẹ̀ lé e—ìrètí, ayọ̀ àti adé—jẹ́ ohun àìlẹ́mìí; nítorí náà, ‘kí ni’ bá ìṣètò ìbéèrè Gíríìkì mu, ó sì jẹ́ kí ìdáhùn ‘ẹ̀yin’ dúró bí ìṣípayá alágbára.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé tí ẹsẹ yìí ní pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́, dípò kí a mú un kúrò fún ìrọ̀rùn.
- source_word: ἐλπίς
  choice: ìrètí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún ìfojúsọ́nà onígbẹ̀kẹ̀lé tí Pọ́ọ̀lù ń sọ nípa rẹ̀.
- source_word: χαρά
  choice: ayọ̀
  rationale: ‘Ayọ̀’ sọ ìmọ̀lára rere inú ọ̀rọ̀ náà jáde ní ṣókí àti ní èdè àdánidá.
- source_word: στέφανος καυχήσεως
  choice: adé ìṣògo
  rationale: στέφανος jẹ́ adé tàbí òdòdó adé tí a fi ń bu ọlá fún ẹni tó ṣẹ́gun; ‘ìṣògo’ mú èrò καύχησις—ohun tí ènìyàn fi ń ṣògo tàbí yangàn lọ́nà rere—jáde láì sọ ọ́ di ìyangàn ẹ̀ṣẹ̀.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: ṣé kì í ha ṣe ẹ̀yin náà?
  rationale: Ìbéèrè yìí ń retí ìdáhùn pé bẹ́ẹ̀ ni. ‘Kì í ha ṣe’ mú agbára οὐχί jáde, ‘náà’ sì dúró fún καί láì ba èdè Yorùbá àdánidá jẹ́.
- source_word: ἔμπροσθεν
  choice: níwájú
  rationale: Ó sọ ìdúró ní iwájú tàbí ní ojú ẹni kan jáde ní ṣókí.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún κύριος gẹ́gẹ́ bí orúkọ ipò Jésù.
- source_word: παρουσίᾳ
  choice: nígbà wíwá rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ nípa ohun ọjọ́ iwájú, παρουσία ń tọ́ka sí wíwá tàbí dídé Olúwa Jésù. ‘Wíwá’ ṣe kedere ní Yorùbá, a sì pa àwọn ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ παρουσίᾳ nínú àyíká ọ̀rọ̀ nípa ìpadàbọ̀ Jésù
  choice: nígbà wíwá rẹ̀
  alternative: nígbà dídé rẹ̀; nígbà tí yóò wà níbẹ̀
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń tọ́ka sí wíwá Olúwa Jésù lọ́jọ́ iwájú. Síbẹ̀, παρουσία lè túmọ̀ sí ‘wíwà níbẹ̀’ tàbí ‘dídé,’ nítorí náà a kò pa fífẹ̀ ìtumọ̀ náà rẹ́, bí kò ṣe pé a fi sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Ìbéèrè alágbára ‘ṣé kì í ha ṣe’ pa ìrísí ìbéèrè àsọyé inú Gíríìkì mọ́; àwọn àmì gígùn sì ya ìdáhùn ‘ẹ̀yin náà’ sọ́tọ̀ bí ó ti rí nínú orísun.
