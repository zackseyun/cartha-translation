  to: Nítorí kí ni ìrètí wa, tàbí ayọ̀ wa, tàbí adé ìṣògo wa—ṣé kì í ṣe ẹ̀yin náà?—níwájú Olúwa wa Jésù ní ìgbà ìwíwá rẹ̀[a]?
