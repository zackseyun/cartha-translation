  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: yo
  text: Nítorí a kò wá sí ọ̀dọ̀ yín rí pẹ̀lú ọ̀rọ̀ ìpọ́nni[a], gẹ́gẹ́ bí ẹ ti mọ̀, tàbí pẹ̀lú àwáwí láti bo ojúkòkòrò[b]—Ọlọ́run ni ẹlẹ́rìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìpọ́nni”; ní tààràtà, “nínú ọ̀rọ̀ ìpọ́nni.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pẹ̀lú àwáwí tí a fi ń bo ojúkòkòrò” tàbí “pẹ̀lú ẹ̀tàn nítorí ìwọra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Nítorí a kò ... rí
  rationale: “Nítorí” so ẹsẹ̀ yìí mọ́ àlàyé tó ṣáájú; “a kò ... rí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé kò ṣẹlẹ̀ nígbà kankan.
- source_word: ἐν λόγῳ κολακείας
  choice: pẹ̀lú ọ̀rọ̀ ìpọ́nni
  rationale: “Ọ̀rọ̀” dúró fún ọ̀rọ̀ ẹnu tàbí àsọyé, “ìpọ́nni” sì tọ́ka sí ọ̀rọ̀ adùn tí a fi ń wá ojú rere ẹni, kì í ṣe ìyìn tòótọ́.
- source_word: ἐγενήθημεν
  choice: a ... wá sí ọ̀dọ̀ yín
  rationale: Nínú àyíká ìbẹ̀wò àwọn ajíhìnrere sí Tẹsalóníkà, gbólóhùn yìí sọ bí wọ́n ṣe dé sí ọ̀dọ̀ wọn; àfikún “sí ọ̀dọ̀ yín” mú un ṣe kedere láì yí ìtumọ̀ padà.
- source_word: καθὼς οἴδατε
  choice: gẹ́gẹ́ bí ẹ ti mọ̀
  rationale: Ó pa ẹ̀rí tí Pọ́ọ̀lù pè àwọn olùgbọ́ rẹ̀ sí mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐν προφάσει πλεονεξίας
  choice: pẹ̀lú àwáwí láti fi bo ojúkòkòrò
  rationale: “Àwáwí” mú èrò πρόφασις gẹ́gẹ́ bí ohun tí a fi ń bo ète gidi jáde; “ojúkòkòrò” jẹ́ ìfẹ́ àṣejù láti jèrè tàbí ní ohun sí i.
- source_word: θεὸς μάρτυς
  choice: Ọlọ́run ni ẹlẹ́rìí
  rationale: Ó pa ìpè mímọ́ sí Ọlọ́run gẹ́gẹ́ bí ẹlẹ́rìí mọ́, láì fi ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Irú ohun tí Pọ́ọ̀lù ń sẹ́ nípa ọ̀nà àti ète iṣẹ́ rẹ̀
  choice: Ẹsẹ̀ náà sẹ́ ọ̀rọ̀ ìpọ́nni àti lílo àwáwí láti bo ojúkòkòrò.
  alternative: Kí a ka a sí ìkọ̀sílẹ̀ gbogbo ọgbọ́n àsọyé, tàbí kí a mú un dín kù sí ìfipámúni lórí owó nìkan.
  rationale: Gíríìkì darúkọ κολακεία àti πλεονεξία ní pàtó. Ìtumọ̀ náà kò gbòòrò sí ìdálẹ́bi gbogbo àsọyé olóye, bẹ́ẹ̀ ni kò fi ojúkòkòrò mọ́ owó nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. “Ẹ” àti “yín” fi ọ̀pọ̀ ènìyàn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ hàn. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
