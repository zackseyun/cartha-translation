id: 1TH.2.13
reference: 1 Thessalonians 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: yo
  text: Nítorí èyí, àwa náà ń dúpẹ́ lọwọ́ Ọlọ́run láìdáwọ́ dúró, pé nígbà tí ẹ gba ọ̀rọ̀ Ọlọ́run tí ẹ gbọ́ láti ọ̀dọ̀ wa[a], ẹ kò gbà á gẹ́gẹ́ bí ọ̀rọ̀ ènìyàn, ṣùgbọ́n—gẹ́gẹ́ bí ó ti jẹ́ nítòótọ́—gẹ́gẹ́ bí ọ̀rọ̀ Ọlọ́run[b], èyí tí ó sì ń ṣiṣẹ́ nínú yín tí ẹ ń gbàgbọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn Ọlọ́run tí ẹ gbọ́ láti ọ̀dọ̀ wa.” Gbólóhùn Gíríìkì náà kójọpọ̀, a sì lè tú u sí ọ̀nà àdánidá ju ọ̀kan lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ kò gbà á gẹ́gẹ́ bí ọ̀rọ̀ ènìyàn, ṣùgbọ́n—gẹ́gẹ́ bí ó ti jẹ́ nítòótọ́—gẹ́gẹ́ bí ọ̀rọ̀ Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: 'Ọ̀rọ̀ arọ́pò náà tún lè tọ́ka sí Ọlọ́run: “ẹni tí ó sì ń ṣiṣẹ́ nínú yín tí ẹ ń gbàgbọ́.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó pa agbára ìdí tí gbólóhùn Gíríìkì ní mọ́, ó sì so ìdúpẹ́ yìí mọ́ ohun tí ó ṣáájú.
- source_word: εὐχαριστοῦμεν ... ἀδιαλείπτως
  choice: àwa pẹ̀lú ń dúpẹ́ lọ́wọ́ Ọlọ́run láìdáwọ́ dúró
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì fi ìṣe tí ń bá a lọ àti agbára ἀδιαλείπτως hàn.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run tí ẹ gbọ́ láti ọ̀dọ̀ wa
  rationale: Ó tú àkójọpọ̀ gbólóhùn Gíríìkì náà sí Yorùbá tí ó ṣe kedere, nígbà tí ó pa ìtumọ̀ pé ọ̀rọ̀ Ọlọ́run ni wọ́n gbọ́ nípasẹ̀ àwọn aposteli mọ́.
- source_word: ἐδέξασθε
  choice: ẹ kò gbà á ... ṣùgbọ́n ...
  rationale: ‘Gbà’ lè sọ ìtẹ́wọ́gbà, kì í ṣe gbígbọ́ lásán; àyíká gbólóhùn náà mú ìtumọ̀ yìí ṣe kedere.
- source_word: οὐ λόγον ἀνθρώπων
  choice: ẹ kò gbà á bí ọ̀rọ̀ ènìyàn
  rationale: ‘Ènìyàn’ ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀ tí kò dá lórí akọ tàbí abo, ó sì pa ìyàtọ̀ pẹ̀lú ‘ọ̀rọ̀ Ọlọ́run’ mọ́.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν
  choice: ṣùgbọ́n bí ó ti jẹ́ nítòótọ́
  rationale: Ó pa ìjẹ́wọ́ àárín gbólóhùn náà àti ìtẹnumọ́ ἀληθῶς mọ́ ní Yorùbá àdánidá.
- source_word: λόγον θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa àtúnlò λόγος àti ìyàtọ̀ ọ̀rọ̀ ènìyàn/ọ̀rọ̀ Ọlọ́run mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ὃς
  choice: èyí tí
  rationale: Ó tọ́ka ní ti àdánidá sí ‘ọ̀rọ̀ Ọlọ́run,’ antecedent tí ó sún mọ́ ọn jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ọ̀nà míì mọ́.
- source_word: ἐνεργεῖται
  choice: ń ṣiṣẹ́
  rationale: Ó fi ìṣe tí ń bá a lọ àti agbára ọ̀rọ̀ náà hàn láìpinnu ju bó ṣe yẹ lọ pé fọ́ọ̀mù náà jẹ́ middle tàbí passive.
- source_word: τοῖς πιστεύουσιν
  choice: nínú ẹ̀yin tí ẹ gbàgbọ́
  rationale: Ó tú participle present náà sí gbólóhùn Yorùbá tí ó yege, tí ó sì fi ìgbàgbọ́ gẹ́gẹ́ bí ànímọ́ àwọn olùgbọ́ hàn.
theological_decisions:
- issue: Ohun tí ọ̀rọ̀ arọ́pò ὃς ń tọ́ka sí
  choice: 'A mú un tọ́ka sí ‘ọ̀rọ̀ Ọlọ́run’: ‘èyí tí ó sì ń ṣiṣẹ́ nínú ẹ̀yin tí ẹ gbàgbọ́.’'
  alternative: 'A lè mú un tọ́ka sí Ọlọ́run: ‘ẹni tí ó sì ń ṣiṣẹ́ nínú ẹ̀yin tí ẹ gbàgbọ́.’'
  rationale: ὃς bá λόγος mu ní akọ àti nọ́mbà, ‘ọ̀rọ̀’ sì ni ohun tí ó sún mọ́ ọn jù; síbẹ̀, θεός náà lè jẹ́ antecedent ní gírámà àti ní ìtumọ̀, nítorí náà a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Agbára ‘ọ̀rọ̀ Ọlọ́run’ nínú ìwàásù aposteli
  choice: A tú un ní tààrà gẹ́gẹ́ bí ‘ọ̀rọ̀ Ọlọ́run.’
  alternative: ‘ìhìn Ọlọ́run’
  rationale: Àkọsílẹ̀ náà fúnra rẹ̀ fi ọ̀rọ̀ ènìyàn àti ọ̀rọ̀ Ọlọ́run wéra. ‘Ọ̀rọ̀’ pa àtúnlò àti ìtẹnumọ́ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìgbòòrò ohun tí ẹsẹ̀ náà sọ.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn kíkún; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀yin/ẹ’ láti fi plural hàn, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
