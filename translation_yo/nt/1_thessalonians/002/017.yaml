id: 1TH.2.17
reference: 1 Thessalonians 2:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: yo
  text: Ṣùgbọ́n àwa, ẹ̀yin ará[b], lẹ́yìn tí a yà wá kúrò lọ́dọ̀ yín[a] fún ìgbà díẹ̀—ní ti ara, kì í ṣe ní ti ọkàn—a túbọ̀ sapá gidigidi, pẹ̀lú ìfẹ́ ọkàn púpọ̀, láti rí ojú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ ọ̀rọ̀-sí-ọ̀rọ̀, “lẹ́yìn tí a sọ wá di aláìní òbí kúrò lọ́dọ̀ yín.” Ọ̀rọ̀ Gíríìkì náà lo àwòrán ìpàdánù ẹni tí ó sún mọ́ni láti fi ìrora ìyapa náà hàn.
    reason: lexical_alternative
  - marker: b
    text: “Ará” ni ọ̀nà tí Pọ́ọ̀lù fi ń pe àwọn onígbàgbọ́; níbí ó ṣeé ṣe kí ó kan gbogbo ìjọ, títí kan àwọn obìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Ṣùgbọ́n àwa
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tàbí ìyípadà kékeré tí δέ ń tọ́ka sí hàn, “àwa” sì pa ìtẹnumọ́ inú Ἡμεῖς mọ́.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà àdánidá ní Yorùbá láti bá àwọn ọmọ ìjọ sọ̀rọ̀, ó sì lè kan gbogbo àwùjọ àwọn onígbàgbọ́ láìfi akọ tàbí abo kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: lẹ́yìn tí a fi ipá yà wá kúrò lọ́dọ̀ yín
  rationale: Ọ̀rọ̀ Gíríìkì ní àwòrán ẹni tí a sọ di aláìní olólùfẹ́; “fi ipá yà wá” mú ìrora àti àìfẹ́kúfẹ̀ẹ́ ìyapa náà jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwòrán ìpilẹ̀ṣẹ̀ mọ́.
- source_word: πρὸς καιρὸν ὥρας
  choice: fún ìgbà díẹ̀
  rationale: Gbólóhùn náà túmọ̀ sí àkókò kúkúrú, kì í ṣe wákàtí kan ní pàtó.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: ní ojú ara, kì í ṣe ní ọkàn
  rationale: Èyí pa ìtakora tó wà láàárín àìsí wọn ní ti ara àti ìfẹ́ tí kò yí padà nínú ọkàn mọ́, ó sì tún pa àwòrán “ojú” mọ́.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: a túbọ̀ sapá gidigidi
  rationale: “Túbọ̀” mú ìtumọ̀ afiwéra περισσοτέρως jáde, “sapá gidigidi” sì gba mejeeji ìtara àti ìsapá inú σπουδάζω.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: láti rí ojú yín
  rationale: Ìtumọ̀ yìí pa àwòrán ojú àti ìfẹ́ fún ìpàdé ojúkojú mọ́ dípò fífi í rọ̀ sí “láti rí yín” nìkan.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: pẹ̀lú ìfẹ́-ọkàn ńlá
  rationale: Ní àyíká yìí ἐπιθυμία jẹ́ ìfẹ́ líle tàbí ìyánhànhàn, kì í ṣe ìfẹ́kúfẹ̀ẹ́ búburú.
theological_decisions:
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ ìpè akọ ní ìlànà gírámà, ṣùgbọ́n nínú lílo Pọ́ọ̀lù ó sábà máa ń tọ́ka sí gbogbo ìjọ. “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìbáṣepọ̀ ìdílé ìgbàgbọ́, àlàyé sì mú ààlà ìtọ́kasí rẹ̀ ṣe kedere láìfi ọ̀rọ̀ méjì kun ẹsẹ̀ náà.
translation_notes:
  register: A lo Yorùbá à标准 tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Àwọn àwòrán “ojú,” “ọkàn,” àti ìyapa onírora ni a pa mọ́, láìjẹ́ kí gbolohun náà di líle tàbí àjèjì.
