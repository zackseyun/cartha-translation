revisions:
- from: Nítorí a fẹ́ wá sọ́dọ̀ yín—èmi Pọ́ọ̀lù pàápàá, ní ẹ̀ẹ̀kan àti ní ẹ̀ẹ̀kejì[a]—ṣùgbọ́n Satani dí wa lọ́wọ́.
  to: Nítorí a fẹ́ wá sọ́dọ̀ yín—èmi Pọ́ọ̀lù, lẹ́ẹ̀kan àti lẹ́ẹ̀mejì[a]—ṣùgbọ́n Satani dí wa lọ́wọ́.
  rationale: Àtúnṣe náà yọ ‘pàápàá’ kúrò kí a má fi ìtumọ̀ ‘especially’ tí kò sí nínú ọ̀rọ̀ Giriki kún un. A sì rọ́pò gbólóhùn ìgbà náà pẹ̀lú ‘lẹ́ẹ̀kan àti lẹ́ẹ̀mejì,’ èyí tó jẹ́ Yorùbá adayeba, tó sì pa àìdájú/ìdíòmù orísun mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
