  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: yo
  text: Nítorí a fẹ́ wá sọ́dọ̀ yín—èmi Pọ́ọ̀lù, lẹ́ẹ̀kan àti lẹ́ẹ̀mejì[a]—ṣùgbọ́n Satani dí wa lọ́wọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “lẹ́ẹ̀kan àti lẹ́ẹ̀mejì”; ìdíòmù kan tó túmọ̀ sí ju ẹ̀ẹ̀kan lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Nítorí
  rationale: Ó mú ìdí tàbí àlàyé ọ̀rọ̀ tó ṣáájú wọlé láìfi ìtumọ̀ míì kún un.
- source_word: ἠθελήσαμεν
  choice: a fẹ́
  rationale: Ó sọ ìfẹ́ àti ìpinnu wọn ní èdè Yorùbá tó ṣe déédé, ó sì pa fọ́ọ̀mù ọ̀pọ̀ mọ́.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: wá sọ́dọ̀ yín
  rationale: Ó pa ìrìn sí ọ̀dọ̀ àwọn ará Tẹsalóníkà mọ́, láìfi ‘padà’ tàbí ‘bẹ̀ wò’ tí kò hàn gbangba sínú rẹ̀.
- source_word: ἐγὼ μὲν Παῦλος
  choice: èmi Pọ́ọ̀lù pàápàá
  rationale: Ó ya Pọ́ọ̀lù sọ́tọ̀ lára ‘àwa’ gẹ́gẹ́ bí Giriki ṣe tẹnumọ́, ní ọ̀nà tó jẹ́ adayeba ní Yorùbá.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: ní ẹ̀ẹ̀kan àti ní ẹ̀ẹ̀kejì
  rationale: Ó pa àwòrán ọ̀rọ̀ Giriki ‘lẹ́ẹ̀kan àti lẹ́ẹ̀mejì’ mọ́, tó túmọ̀ sí pé Pọ́ọ̀lù gbìyànjú ju ẹ̀ẹ̀kan lọ; àlàyé wà ní àlàyé ìsàlẹ̀.
- source_word: ἐνέκοψεν
  choice: dí wa lọ́wọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí sọ ìdènà tó dá ìṣe dúró, láìsọ pé kò lè ṣẹlẹ̀ láélá.
- source_word: ὁ Σατανᾶς
  choice: Satani
  rationale: Orúkọ tí a mọ̀ sí ẹni náà ni a lò, ní ìbámu pẹ̀lú ìtọ́kasí ara ẹni nínú orísun.
theological_decisions:
- issue: Ìṣe Satani nínú dídènà ìrìn Pọ́ọ̀lù
  choice: ṣùgbọ́n Satani dí wa lọ́wọ́
  alternative: ṣùgbọ́n Ọ̀tá náà dá wa dúró
  rationale: Ẹsẹ̀ náà fi ìdènà náà lé Satani lọ́wọ́ ní tààràtà. Ìtumọ̀ yìí pa ìṣe ara ẹni náà mọ́, láìsọ ọ́ di àyíká aláìlẹ́ni tàbí mú agbára ìdènà náà ga ju ohun tí ọ̀rọ̀ Giriki sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘yín’ àti ‘wa’ láti pa ọ̀pọ̀ ènìyàn inú ọ̀rọ̀ Giriki mọ́; ‘èmi Pọ́ọ̀lù pàápàá’ sì mú ìtẹnumọ́ Pọ́ọ̀lù hàn.
