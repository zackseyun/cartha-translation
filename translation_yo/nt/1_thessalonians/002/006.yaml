source:
  edition: SBLGNT
  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: yo
  text: A kò sì wá ògo lọ́dọ̀ ènìyàn[a], kì í ṣe lọ́dọ̀ yín tàbí lọ́dọ̀ àwọn ẹlòmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “iyì” tàbí “ìyìn” dípò “ògo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: a kò wá
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí ó ń tẹ̀ lé olùṣe tí a ti ń sọ̀rọ̀ rẹ̀ nínú gbólóhùn tó yí i ká; ‘wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe títẹ̀síwájú hàn láìfi ète míì kún un.
- source_word: ἐξ ἀνθρώπων
  choice: lọ́dọ̀ àwọn ènìyàn
  rationale: ἄνθρωποι ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan; ‘lọ́dọ̀’ sì sọ orísun ìyìn tàbí iyì náà ní Yorùbá àdánidá.
- source_word: δόξαν
  choice: ògo
  rationale: ‘Ògo’ pa ìsopọ̀ mọ́ ọ̀rọ̀ pàtàkì δόξα nínú Májẹ̀mú Tuntun mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó túmọ̀ sí iyì tàbí ìyìn láti ọ̀dọ̀ ènìyàn.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: bẹ́ẹ̀ ni ... kò ... yálà ... tàbí
  rationale: ‘Bẹ́ẹ̀ ni ... kò’ so ẹsẹ̀ yìí mọ́ ohun tí ó ṣáájú, ‘yálà ... tàbí’ sì ṣàfihàn pé kò wá ògo lọ́dọ̀ ẹgbẹ́ méjèèjì; àìgbọ́dọ̀ náà kan àwọn méjèèjì.
- source_word: ἀφ’ ὑμῶν
  choice: lọ́dọ̀ yín
  rationale: Ó tọ́ka tààrà sí àwọn onígbàgbọ́ Tẹsalóníkà ní ọ̀pọ̀ ènìyàn.
- source_word: ἀπ’ ἄλλων
  choice: lọ́dọ̀ àwọn ẹlòmíràn
  rationale: Ó tọ́ka sí àwọn ènìyàn mìíràn yàtọ̀ sí àwọn ará Tẹsalóníkà, ní ọ̀nà ṣókí tí ó sì ṣe kedere.
theological_decisions:
- issue: Irú δόξα tí a kò wá
  choice: ògo tàbí ìyìn láti ọ̀dọ̀ ènìyàn, kì í ṣe ògo Ọlọ́run
  alternative: iyì láti ọ̀dọ̀ ènìyàn; ìyìn láti ọ̀dọ̀ ènìyàn
  rationale: ἐξ ἀνθρώπων fi hàn gbangba pé ìtẹ́wọ́gbà ènìyàn ni a ń sọ, kì í ṣe ògo tí ó wá láti ọ̀dọ̀ Ọlọ́run.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún òǹkàwé lasán. ‘Bẹ́ẹ̀ ni’ jẹ́ kí ìbáṣepọ̀ pẹ̀lú àyíká gbólóhùn tí ó ṣáájú dúró, níwọ̀n bí οὔτε ti ń bá àwọn àìgbọ́dọ̀ ṣáájú lọ.
