source:
  edition: SBLGNT
  text: ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας ⸀οὐδὲ ἐν δόλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: yo
  text: Nítorí ìpè[a] wa kò ti inú ìṣìnà[b] wá, bẹ́ẹ̀ ni kò ti inú àìmímọ́ wá, bẹ́ẹ̀ sì ni kì í ṣe ní ẹ̀tàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀ ìyànjú wa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìpè, ọ̀rọ̀ ìyànjú, tàbí ìṣírí, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìtànjẹ” dípò “ìṣìnà”; ṣùgbọ́n “ní ẹ̀tàn” ní apá ìkẹyìn ń tọ́ka sí ẹ̀tàn àmọ̀ọ́mọ̀ṣe ní tààrà sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: ìpè
  rationale: Nínú ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ìpè tàbí ọ̀rọ̀ ìyànjú tí Pọ́ọ̀lù fi tọ àwọn olùgbọ́ rẹ̀ wá; “ìpè” jẹ́ ọ̀rọ̀ àdánidá tí kò fi ìtumọ̀ náà mọ́ ìtùnú nìkan.
- source_word: πλάνης
  choice: ìṣìnà
  rationale: Ó fi hàn pé ìpè náà kò pilẹ̀ láti inú èrò tàbí ẹ̀kọ́ tí ó ṣìnà. Yíyan “ìṣìnà” tún jẹ́ kí ó yà sí δόλος, èyí tí ó túmọ̀ sí ẹ̀tàn àmọ̀ọ́mọ̀ṣe.
- source_word: ἀκαθαρσίας
  choice: àìmọ́
  rationale: “Àìmọ́” ní ìtumọ̀ ìwà aláìmọ́ níbí, ó sì pa ìtumọ̀ náà mọ́ ní gbòòrò láìfi dandan sọ pé ìwà pálapàla nípa ìbálòpọ̀ nìkan ni.
- source_word: δόλῳ
  choice: fi ẹ̀tàn ṣe é
  rationale: Gbólóhùn yìí fi ọ̀nà tí a gbà ṣe ìpè náà hàn, ó sì mú ìtumọ̀ ọgbọ́n àrékérekè tàbí ète láti tan ni jẹ́ jáde ní Yorùbá àdánidá.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: ti inú ... wá; fi ... ṣe é
  rationale: “Ti inú ... wá” dúró fún orísun tí ἐκ/ἐξ ń fi hàn, nígbà tí “fi ... ṣe é” dúró fún ọ̀nà ìṣe tí ἐν ń tọ́ka sí.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀκαθαρσία nínú ohun tí Pọ́ọ̀lù sẹ́
  choice: Àìmọ́ ní ìtumọ̀ ìwà aláìmọ́ ní gbòòrò
  alternative: Ìwà pálapàla nípa ìbálòpọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ἀκαθαρσία lè ní ìtumọ̀ ìwà pálapàla nípa ìbálòpọ̀, ẹsẹ náà kò dín un mọ́ ìyẹn; nítorí náà, a pa ìtumọ̀ gbòòrò rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A ṣe ìyàtọ̀ láàárín orísun ìpè náà (ἐκ/ἐξ) àti ọ̀nà tí a gbà ṣe é (ἐν), bí ó tilẹ̀ jẹ́ pé Yorùbá nílò àtúnṣe gírámà díẹ̀ láti dun ní àdánidá.
