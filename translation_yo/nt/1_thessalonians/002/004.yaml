id: 1TH.2.4
reference: 1 Thessalonians 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: yo
  text: Ṣùgbọ́n gẹ́gẹ́ bí Ọlọ́run ti dán wa wò, tí ó sì fọwọ́ sí wa pé a yẹ láti fi ìhìn rere lé wa lọ́wọ́, bẹ́ẹ̀ ni a ṣe ń sọ̀rọ̀—kì í ṣe gẹ́gẹ́ bí àwọn tí ń tẹ́ ènìyàn lọ́rùn, ṣùgbọ́n gẹ́gẹ́ bí àwọn tí ń tẹ́ Ọlọ́run lọ́rùn, ẹni tí ń dán ọkàn wa wò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: ti dán wa wò, tí ó sì rí i pé a yẹ
  rationale: Ó fi ìdánwò àti àbájáde ìtẹ́wọ́gbà hàn, ó sì pa agbára perfect passive mọ́ gẹ́gẹ́ bí ìgbéyẹ̀wò tí àbájáde rẹ̀ ṣì dúró.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: láti fi ìhìn rere lé wa lọ́wọ́
  rationale: Ìṣe náà túmọ̀ sí pé Ọlọ́run fi ìhìn rere sí ìtọ́jú wọn, kì í ṣe pé wọ́n gba a gbọ́ nínú gbólóhùn yìí.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì gbajúmọ̀ fún ìkéde ìgbàlà Ọlọ́run.
- source_word: οὕτως λαλοῦμεν
  choice: bẹ́ẹ̀ ni àwa ṣe ń sọ̀rọ̀
  rationale: Ó pa ìsopọ̀ mọ́ ọ̀nà tí Ọlọ́run gbà dán wọn wò tí ó sì fi iṣẹ́ náà lé wọn lọ́wọ́.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: kì í ṣe bí ẹni pé a ń tẹ́ ènìyàn lọ́rùn
  rationale: Ó tẹ̀lé participle Gíríìkì ní ọ̀nà àdánidá ní Yorùbá, láì sọ ọ́ di gbólóhùn ète pátápátá.
- source_word: ἀλλὰ θεῷ
  choice: bí kò ṣe Ọlọ́run
  rationale: Ó pa ìfihàn kúkúrú tí Gíríìkì ní mọ́; ìṣe ‘tẹ́ lọ́rùn’ wà ní àgbọ́yé ṣùgbọ́n a kò tún un sọ nínú ọ̀rọ̀ pàtàkì.
- source_word: τῷ δοκιμάζοντι
  choice: ẹni tí ń dán ... wò
  rationale: Àmì àsìkò tí ń lọ lọ́wọ́ nínú present participle hàn, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ δεδοκιμάσμεθα.
- source_word: τὰς καρδίας ἡμῶν
  choice: ọkàn wa
  rationale: ‘Ọkàn’ pa àwòrán àti ìtumọ̀ ìmọ̀-ènìyàn inú Bíbélì mọ́ láì dín un kù sí èrò tàbí ìmọ̀lára nìkan.
theological_decisions:
- issue: Bí a ṣe máa tú ìyàtọ̀ láàárín títẹ́ ènìyàn lọ́rùn àti títẹ́ Ọlọ́run lọ́rùn láì mú gbólóhùn Pọ́ọ̀lù dan jù
  choice: 'A pa ìfihàn tí a kò parí rẹ̀ ní kíkún mọ́: “kì í ṣe bí ẹni pé a ń tẹ́ ènìyàn lọ́rùn, bí kò ṣe Ọlọ́run.”'
  alternative: “kì í ṣe láti tẹ́ ènìyàn lọ́rùn, bí kò ṣe láti tẹ́ Ọlọ́run lọ́rùn.”
  rationale: Gíríìkì sọ ‘títẹ́ lọ́rùn’ ní apá àkọ́kọ́ nìkan, ó sì jẹ́ kí a lóye rẹ̀ nínú apá kejì. Ìtumọ̀ pàtàkì pa ìfihàn kúkúrú yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ọ̀nà tí ó túbọ̀ ṣí sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. A lo “àwa” lẹ́ẹ̀kan láti fi tẹnumọ́ subject tí ó wà nínú Gíríìkì; “ènìyàn” jẹ́ orúkọ àkójọpọ̀ fún àwọn ènìyàn lápapọ̀. Àmì ohùn ni a fi sí ibi tí ó yẹ.
