  to: Ṣùgbọ́n gẹ́gẹ́ bí Ọlọ́run ti dán wa wò, tí ó sì fọwọ́ sí wa pé a yẹ láti fi ìhìn rere lé wa lọ́wọ́, bẹ́ẹ̀ ni a ṣe ń sọ̀rọ̀—kì í ṣe gẹ́gẹ́ bí àwọn tí ń tẹ́ ènìyàn lọ́rùn, ṣùgbọ́n gẹ́gẹ́ bí àwọn tí ń tẹ́ Ọlọ́run lọ́rùn, ẹni tí ń dán ọkàn wa wò.
