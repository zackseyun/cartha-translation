  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: yo
  text: Ẹ̀yin ni ẹlẹ́rìí, Ọlọ́run náà sì ni ẹlẹ́rìí, bí a ti hùwà pẹ̀lú ìfọkànsìn sí Ọlọ́run[a], ní òdodo, àti láìní àbùkù sí yín, ẹ̀yin onígbàgbọ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní mímọ́.” Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ ìwà ìfọkànsìn níwájú Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láàárín yín, ẹ̀yin onígbàgbọ́,” dípò “sí yín, ẹ̀yin onígbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Ẹ̀yin ni ẹlẹ́rìí, Ọlọ́run náà sì ni ẹlẹ́rìí
  rationale: Èyí pa ìtẹnumọ́ orísun Gíríìkì mọ́ nípa fífi àwọn ará Tẹsalóníkà sí iwájú, lẹ́yìn náà ni ó darúkọ Ọlọ́run gẹ́gẹ́ bí ẹlẹ́rìí pẹ̀lú.
- source_word: ὡς
  choice: sí bí
  rationale: Nínú ìpe sí àwọn ẹlẹ́rìí yìí, ọ̀rọ̀ náà ń tọ́ka sí ọ̀nà tí àwọn ajíhìnrere gbà hùwà.
- source_word: ὁσίως
  choice: pẹ̀lú ìfọkànsìn sí Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì náà ń ṣàpèjúwe ìwà mímọ́ àti ìfọkànsìn níwájú Ọlọ́run; gbólóhùn Yorùbá yìí mú apá tó dojú kọ Ọlọ́run hàn ní kedere.
- source_word: δικαίως
  choice: ní òdodo
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàpèjúwe ìwà tó tọ́ nípa ìwà rere.
- source_word: ἀμέμπτως
  choice: láìní àbùkù
  rationale: Ó túmọ̀ sí pé ìwà wọn kò fúnni ní ìdí tó lẹ́sẹ̀ nílẹ̀ láti fi bá wọn wí; kò fi dandan sọ pé wọn kò ní ẹ̀ṣẹ̀ rárá.
- source_word: ὑμῖν
  choice: sí yín
  rationale: Dátífù náà lè tọ́ka sí àwọn ẹni tí ìwà náà dojú kọ. ‘Sí yín’ mú ìbáṣepọ̀ yìí hàn, bí ó tilẹ̀ jẹ́ pé ‘láàárín yín’ tún ṣeé ṣe.
- source_word: τοῖς πιστεύουσιν
  choice: tí ẹ gbàgbọ́
  rationale: Èyí pa agbára ọ̀rọ̀-ìṣe ti pàtísípù ìsinsìnyí mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: ἐγενήθημεν
  choice: a ti hùwà
  rationale: Bó tilẹ̀ jẹ́ pé γίνομαι sábà máa ń túmọ̀ sí ‘di’ tàbí ‘jẹ́,’ àwọn ọ̀rọ̀-àpèjúwe mẹ́ta tó bá a rìn níbí fi hàn pé ó ń sọ bí ìwà àwọn ajíhìnrere ṣe rí.
theological_decisions:
- issue: Àwọn ọ̀rọ̀ mẹ́ta tó ṣàpèjúwe ìwà àwọn aposteli
  choice: Wọ́n ṣàpèjúwe ìwà gidi àwọn ajíhìnrere níwájú Ọlọ́run àti àwọn tó gbàgbọ́, láìsọ pé wọn pé pátápátá tí wọn kò sì ní ẹ̀ṣẹ̀.
  alternative: Kí a ka ọ̀rọ̀ náà sí ọgbọ́n àríyànjiyàn lásán, tàbí kí a ka ‘láìní àbùkù’ sí àìní ẹ̀ṣẹ̀ pátápátá.
  rationale: Ẹsẹ náà jẹ́ ẹ̀bẹ̀ pàtàkì sí ẹlẹ́rìí ènìyàn àti ti Ọlọ́run nípa ìṣòtítọ́ ìwà wọn. ‘Láìní àbùkù’ ń sọ ìwà tí kò sí ẹ̀sùn tó lẹ́sẹ̀ nílẹ̀ sí, ṣùgbọ́n a kò gbọ́dọ̀ fi ìtumọ̀ àìní ẹ̀ṣẹ̀ pátápátá kún un.
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘A ti hùwà’ jẹ́ àdánidá ju ìtumọ̀ gígùn bí ‘a ṣe ara wa’ lọ, ó sì bá ọ̀rọ̀ Gíríìkì mu nínú àyíká yìí. A fi kọ́má sí òpin láti fi hàn pé gbólóhùn náà ń bá a lọ sínú ẹsẹ tó tẹ̀ lé e.
