id: 1TH.2.15
reference: 1 Thessalonians 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: yo
  text: àwọn tí wọ́n sì pa Olúwa Jésù àti àwọn wòlíì[a], tí wọ́n sì lé wa jáde[b], tí wọ́n kò sì mú inú Ọlọ́run dùn, tí wọ́n sì ń ṣòta sí gbogbo ènìyàn[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n fi Olúwa Jésù àti àwọn wòlíì ikú pa.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, wọ́n “lé wa jáde”; ọ̀rọ̀-ìṣe náà ní ìtumọ̀ pàtó ju ọ̀rọ̀ gbogbogbò fún inúnibíni lọ.
    reason: lexical_alternative
  - marker: c
    text: Ní ti gírámà, àpèjúwe yìí ń bá ẹgbẹ́ tí a dá mọ́ nínú ẹsẹ tó ṣáájú lọ; a kò gbọdọ̀ kà á sí ọ̀rọ̀ tí ó kan gbogbo àwọn Júù ní gbogbo àkókò àti ibi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: pa
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pípa tàbí fífi ikú pa; “pa” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tí kò sì fi èrò ìwà ọ̀daràn kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: κύριον Ἰησοῦν
  choice: Jésù Olúwa
  rationale: “Olúwa” pa κύριος mọ́ gẹ́gẹ́ bí orúkọ oyè Kristi, nígbà tí “Jésù” jẹ́ ìkọ̀wé orúkọ náà ní Yorùbá.
- source_word: τοὺς προφήτας
  choice: àwọn wòlíì
  rationale: “Àwọn wòlíì” jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún ọ̀pọ̀ προφήτης, ó sì tọ́ka sí ìlà àwọn wòlíì tí a mọ̀.
- source_word: ἐκδιωξάντων
  choice: lé àwa náà jáde
  rationale: Ọ̀rọ̀-ìṣe náà ní ìtumọ̀ pàtó ti lílé ẹni jáde; èyí dá agbára ọ̀rọ̀ náà mọ́ ju gbígbé e kalẹ̀ gẹ́gẹ́ bí inúnibíni lápapọ̀ lọ.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: wọn kò sì ṣe ohun tí ó wu Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọn kò mú inú Ọlọ́run dùn tàbí pé wọn kò ṣe ohun tí ó tẹ́ ẹ lọ́rùn, ó sì pa ìṣe tí ń bá a lọ mọ́.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: wọ́n sì ń ṣòta sí gbogbo ènìyàn
  rationale: “Ń ṣòta sí” fi ìtakò àti ìkórìíra tó wà nínú ἐναντίος hàn ní Yorùbá òde òní, láì dín un sí ìyàtọ̀ èrò lásán.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: àwọn tí ... tí ... tí ... tí ...
  rationale: Àtẹ̀lé gbólóhùn ìbátan yìí pa àjọṣe gírámà pẹ̀lú ẹgbẹ́ tí ẹsẹ tó ṣáájú mẹ́nuba mọ́, ó sì jẹ́ kí Yorùbá ṣàn dáadáa.
- source_word: καὶ
  choice: sì / àti / náà
  rationale: Àwọn ọ̀nà wọ̀nyí fi agbára àfikún àti ìtẹ̀síwájú ẹ̀sùn tí καί ní hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ẹgbẹ́ tí àpèjúwe àwọn participle ń tọ́ka sí
  choice: Àwọn gbólóhùn náà ń bá àpèjúwe ẹgbẹ́ tí a mẹ́nuba ní 1 Tẹsalóníkà 2:14 lọ.
  alternative: Kí a ka a sí ìdálẹ́bi gbogbo Júù ní gbogbo àkókò àti ibi.
  rationale: Àtòjọ Gíríìkì so àwọn participle náà mọ́ antecedent inú ẹsẹ tó ṣáájú. Ìtumọ̀ náà pa ìsopọ̀ yìí mọ́ nípasẹ̀ “àwọn tí,” kò sì fi ọ̀rọ̀ kún un láti sọ ọ́ di ẹ̀sùn àìlópin sí gbogbo Júù.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì pa ìtẹ̀síwájú àkójọpọ̀ ẹ̀sùn inú Gíríìkì mọ́. Kọ́mà ìparí fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ 16.
