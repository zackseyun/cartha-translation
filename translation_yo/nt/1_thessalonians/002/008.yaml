id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà, bí a ṣe ń yánhànhàn yín, inú wa dùn láti pín ìhìn rere Ọlọ́run pẹ̀lú yín, kì í ṣe ìhìn rere náà nìkan, ṣùgbọ́n ìyè wa fúnra wa pẹ̀lú, nítorí ẹ ti di ẹni ọ̀wọ́n fún wa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως ὁμειρόμενοι ὑμῶν
  choice: Bẹ́ẹ̀ ni, nítorí bí a ti ṣe àfẹ́rí yín tó
  rationale: “Bẹ́ẹ̀ ni” so ọ̀rọ̀ yìí mọ́ àpẹẹrẹ ìtọ́jú onífẹ̀ẹ́ bí ti ìyá nínú ẹsẹ tó ṣáájú. “Ṣe àfẹ́rí yín” mú ìfẹ́ àti ìyánhànhàn líle inú ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n náà jáde; lílo “nítorí” sì fi ipa ìdí tí participle náà lè ní hàn láì sọ ọ́ di ìtumọ̀ kan ṣoṣo nínú àlàyé ìsàlẹ̀.
- source_word: εὐδοκοῦμεν
  choice: inú wa dùn
  rationale: Ó fi ayọ̀ àti ìfẹ́ inú hàn, kì í ṣe gbígbà láàyè lásán; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: μεταδοῦναι
  choice: láti pín ... pẹ̀lú yín
  rationale: Ó bá fífún ẹlòmíràn ní ìpín nínú ohun tí ẹni ní mu, ó sì lè gba “ìhìn rere” àti “ìgbésí ayé” gẹ́gẹ́ bí ohun méjèèjì tí a pín.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ìhìn rere Ọlọ́run
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí ìhìn rere tó ti ọ̀dọ̀ Ọlọ́run wá tàbí tó jẹ́ ti Ọlọ́run, nígbà tí ó tún pa ìbátan genitive Gíríìkì mọ́.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: ìgbésí ayé àwa fúnra wa
  rationale: Nínú àyíká yìí ψυχή ń tọ́ka sí ìyè tàbí gbogbo ara ẹni tí a fi fún iṣẹ́, kì í ṣe dandan sí “ọkàn” gẹ́gẹ́ bí apá kan tó yà sọ́tọ̀ kúrò lára. “Àwa fúnra wa” pa tẹnumọ́ ἑαυτῶν mọ́.
- source_word: διότι
  choice: nítorí
  rationale: Ó fi ìdí tí wọ́n fi fi ara wọn fún àwọn ará Tẹsalóníkà hàn ní kedere.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: ẹ ti di ẹni ọ̀wọ́n fún wa
  rationale: Ó pa ìyípadà sí ipò tuntun nínú ἐγενήθητε mọ́, ó sì sọ ìfẹ́ tímọ́tímọ́ náà ní Yorùbá tó wọ́pọ̀ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ ψυχάς nínú àpèjúwe fífi ara àwọn aposteli fúnni
  choice: ìgbésí ayé àwa fúnra wa
  alternative: ẹ̀mí wa tàbí ara wa pàápàá
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa fífi gbogbo ara ẹni rúbọ nínú iṣẹ́ ìtọ́jú, kì í ṣe àlàyé nípa bí ara àti ẹ̀mí ṣe yà. Ìtumọ̀ yìí pa agbára fífi ara ẹni fúnni mọ́, àlàyé ìsàlẹ̀ sì jẹ́ kí ìtumọ̀ gangan àti àṣàyàn mìíràn hàn.
- issue: Ipa ἀγαπητοὶ
  choice: ẹni ọ̀wọ́n fún wa
  alternative: olùfẹ́ wa tàbí ẹni tí a fẹ́ràn
  rationale: “Ẹni ọ̀wọ́n” sọ ìfẹ́ ìbátan náà ní èdè ọlọ́lá tó ṣe àdánidá, láì sọ ọ̀rọ̀ náà di àkọlé ẹ̀kọ́ ìgbàgbọ́ pàtàkì.
- issue: Ìbátan ὁμειρόμενοι sí ọ̀rọ̀-ìṣe pàtàkì
  choice: A fi ipa ìdí hàn pẹ̀lú “nítorí,” ṣùgbọ́n a tọ́ka sí ìtumọ̀ participle tó lè dúró gẹ́gẹ́ bí “bí a ti ń ṣe àfẹ́rí” nínú àlàyé ìsàlẹ̀.
  alternative: bí a ti ń ṣe àfẹ́rí yín tó
  rationale: Participle Gíríìkì lè ṣàpèjúwe ipò ọkàn wọn tàbí kí ó fi ìdí ìṣe wọn hàn. Ọ̀rọ̀ inú ẹsẹ yan ìtumọ̀ ìdí tó ṣe àdánidá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa àìdánilójú gírámà náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó ṣe kedere fún òǹkàwé òde òní ni a lò. “Inú wa dùn,” “ṣe àfẹ́rí,” àti “ẹni ọ̀wọ́n” pa ìgbóná ìbátan inú ẹsẹ náà mọ́; gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
