    rationale: Participle náà lè ṣàpèjúwe ipò/inú wọn (“nígbà tí a ń yánhànhàn yín” / “bí a ṣe ń yánhànhàn yín”) ju kí ó jẹ́ ìdí tí a sọ ní kedere. Ìtumọ̀ àkọ́kọ́ yẹ kí ó má ṣe mú ìtumọ̀ kan ṣoṣo fipá ṣẹ.
  - severity: medium
    issue: “ṣe àfẹ́rí yín” kò ṣe àdánidá, ó sì lè ṣókùnkùn ní Yorùbá òde òní.
    rationale: “Yánhànhàn yín” tàbí “ní ìfẹ́ ọkàn sí yín” ń sọ ìfẹ́ tímọ́tímọ́ àti ìfẹ́-ọkàn ὁμειρόμενοι ní kedere ju ọrọ̀ náà lọ.
  - severity: low
