  to: Bí ó tilẹ̀ jẹ́ pé a ì bá ti lè jẹ́ ẹrù fún yín gẹ́gẹ́ bí àwọn aposteli Mèsáyà[a], síbẹ̀ a di ẹni pẹ̀lẹ́ láàárín yín, bí ìyá tí ń fún ọmọ lọ́mú ṣe ń tọ́jú àwọn ọmọ tirẹ̀ pẹ̀lẹ́pẹ̀lẹ́.[b]
  rationale: Àtúnṣe náà yọ ìtumọ̀ pàtó tí a fi kún ἐν βάρει εἶναι kúrò, ó sì mú ìtumọ̀ ‘jẹ́ ẹrù’ tí ó bá ìtumọ̀ Gíríìkì àti ìtumọ̀ Gẹ̀ẹ́sì àyẹ̀wò mu. Àlàyé ìsàlẹ̀ ń dáàbò bo ìtumọ̀ mìíràn, èyíiní lílo àṣẹ aposteli. A tún rọ́pò ‘onírẹ̀lẹ̀’ pẹ̀lú ‘ẹni pẹ̀lẹ́’ kí ἤπιοι, àti ìṣe ‘di’ nínú ἐγενήθημεν, lè hàn kedere. Àlàyé b ni a ṣàtúnṣe díẹ̀ fún ìkọ̀wé Giriki tó pé.
