id: 1TH.2.7
reference: 1 Thessalonians 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé a ì bá ti lè jẹ́ ẹrù fún yín gẹ́gẹ́ bí àwọn aposteli Mèsáyà[a], síbẹ̀ a di ẹni pẹ̀lẹ́ láàárín yín, bí ìyá tí ń fún ọmọ lọ́mú ṣe ń tọ́jú àwọn ọmọ tirẹ̀ pẹ̀lẹ́pẹ̀lẹ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Giriki náà ní, ‘a ì bá lè wà ní ìwúwo.’ Ó lè túmọ̀ sí pé a ì bá lè lo ọlá-àṣẹ wa, tàbí pé a ì bá lè di ẹrù fún yín. ‘Àwọn aposteli Mèsáyà’ tún lè jẹ́ ‘àwọn aposteli Kristi.’
    reason: lexical_alternative
  - marker: b
    text: τροφόs tún lè túmọ̀ sí obìnrin olùtọ́jú ọmọ tàbí obìnrin tí ń fún ọmọ ẹlòmíràn lọ́mú; àwòrán náà jẹ́ ti ìtọ́jú pẹ̀lẹ́pẹ̀lẹ́ bí ti ìyá.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι
  choice: Bí ó tilẹ̀ jẹ́ pé àwa ì bá ti lè
  rationale: A tú participle náà ní ọ̀nà concessive nítorí ìyàtọ̀ tí ἀλλά mú wá; èyí sì jẹ́ Yorùbá àdánidá.
- source_word: ἐν βάρει εἶναι
  choice: lo ipò wa láti béèrè ohun púpọ̀ lọ́wọ́ yín
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí wíwà ‘nínú ìwúwo,’ ṣùgbọ́n ní àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí lílo ipò tàbí ẹ̀tọ́ aposteli láti ṣe àwọn ohun tí ó wuwo fún wọn. Àlàyé ìsàlẹ̀ pa àwòrán àti àwọn ìtumọ̀ mìíràn mọ́.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: gẹ́gẹ́ bí àwọn aposteli Mèsáyà
  rationale: Χριστοῦ ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, genitive náà sì di gbólóhùn Yorùbá àdánidá.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: síbẹ̀ a jẹ́
  rationale: ‘Síbẹ̀’ fi ìyàtọ̀ hàn kedere. Bí γίνομαι tilẹ̀ lè jẹ́ ‘a di,’ ‘a jẹ́’ dùn mọ́ Yorùbá nínú àlàyé ìwà wọn láàárín àwọn olùgbọ́.
- source_word: ἤπιοι
  choice: onírẹ̀lẹ̀
  rationale: Ó sọ ìwà pẹ̀lẹ́, tútù àti aláàánú; ‘onírẹ̀lẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, bí ó tilẹ̀ jẹ́ pé ‘ẹlẹ́jẹ̀’ tàbí ‘oníwà pẹ̀lẹ́’ tún ṣeé lò.
- source_word: ἐν μέσῳ ὑμῶν
  choice: láàárín yín
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún ‘ní àárín yín.’
- source_word: ὡς ἐὰν τροφὸς
  choice: bí ìyá tí ń fún ọmọ lọ́mú
  rationale: τροφός lè jẹ́ obìnrin tó ń fún ọmọ lọ́mú tàbí olùtọ́jú; àyíká ti ‘àwọn ọmọ tirẹ̀’ ṣe àwòrán ìyá tó ń tọ́jú ọmọ rẹ̀ lágbára.
- source_word: θάλπῃ
  choice: ṣe ń fi ìfẹ́ tọ́jú
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ìpilẹ̀ ti mímú kí ó móoru, ó sì ń tọ́ka sí ìtọ́jú onífẹ̀ẹ́; gbólóhùn yìí mú ìmọ̀lára náà jáde ní Yorùbá.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: àwọn ọmọ tirẹ̀
  rationale: ‘Tirẹ̀’ pa ìtẹnumọ́ ἑαυτῆς mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. Àlàyé ìsàlẹ̀ fi ìtumọ̀ ìbílẹ̀ ‘Kristi’ pamọ́.
- issue: Àwọn tí a pè ní ἀπόστολοι
  choice: àwọn aposteli Mèsáyà
  alternative: àwọn aṣojú Mèsáyà
  rationale: ‘Aposteli’ jẹ́ ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yorùbá mọ̀, kò sì pinnu bóyá Pọ́ọ̀lù nìkan tàbí gbogbo ẹgbẹ́ tí ‘àwa’ ń tọ́ka sí ní ọ̀nà tó ju Giriki lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlá tí ó ṣeé lóye. A lo ‘aposteli’ àti ‘Mèsáyà’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí ó ti wọ́pọ̀. Àkọsílẹ̀ ìsàlẹ̀ pa àìdánilójú ἐν βάρει εἶναι àti τροφός mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
