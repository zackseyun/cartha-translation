id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: yo
  text: Nítorí ẹ̀yin fúnra yín mọ̀, ẹ̀yin ará[a], pé wíwá wa sí ọ̀dọ̀ yín kò jẹ́ asán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà ni “arákùnrin”; ọ̀pọ̀ ìgbà ni a máa ń lò ó láti bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀, àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: ẹ̀yin fúnra yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́, ó sì fi hàn pé àwọn ará Tẹsalóníkà fúnra wọn mọ ohun tí ó ṣẹlẹ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ èrò tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé àfikún.
- source_word: οἴδατε
  choice: mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí perfect, ìtumọ̀ rẹ̀ níbí jẹ́ ìmọ̀ tí wọ́n ní ní àkókò yìí.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará[a]
  rationale: ‘Ará’ jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún pípe gbogbo ìjọ ní Yorùbá; àlàyé ìsàlẹ̀ ṣàfihàn pé ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: wíwá wa sí ọ̀dọ̀ yín
  rationale: Gbólóhùn yìí tọ́ka sí bí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ ṣe dé bá wọn; ‘wíwá wa sí ọ̀dọ̀ yín’ jẹ́ Yorùbá àdánidá tí ó pa ìtọ́sọ́nà πρὸς mọ́.
- source_word: οὐ κενὴ γέγονεν
  choice: kò jẹ́ asán
  rationale: Ìtumọ̀ náà lè kan ohun tí kò ṣófo, tí kò sì jẹ́ aláìléso tàbí aláìní ète; ‘kò jẹ́ asán’ pa agbára àti ìwọ̀n àìdánilójú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί nígbà tí a ń bá gbogbo ìjọ sọ̀rọ̀
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: ‘Ará’ bá ọ̀nà ìbánisọ̀rọ̀ Yorùbá mu, ó sì lè yí gbogbo àwùjọ àwọn onígbàgbọ́ ká láìfi ìtumọ̀ kankan tí ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí. Àlàyé ìsàlẹ̀ sọ ìrísí akọ inú Gíríìkì ní kedere.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá; ìtẹnumọ́ ‘ẹ̀yin fúnra yín’ àti àsopọ̀ ‘Nítorí’ pa ìṣàn àríyànjiyàn orísun mọ́.
