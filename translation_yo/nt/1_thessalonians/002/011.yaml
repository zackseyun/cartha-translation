  text: καθάπερ οἴδατε ὡς ἕνα ἕκαστον ὑμῶν ὡς πατὴρ τέκνα ἑαυτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/011.yaml
  text: just as you know[a], we dealt with each one of you as a father with his own children
translation:
  language: yo
  text: gẹ́gẹ́ bí ẹ ti mọ̀, a bá ẹnì kọ̀ọ̀kan yín lò bí baba ṣe ń bá àwọn ọmọ tirẹ̀ lò[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ìrísí Gíríìkì náà pẹ́kípẹ́kí: “gẹ́gẹ́ bí ẹ ti mọ̀ bí [a ṣe bá] ẹnì kọ̀ọ̀kan yín lò, bí baba [ṣe ń bá] àwọn ọmọ tirẹ̀ lò.” Gbólóhùn Gíríìkì náà fi ọ̀rọ̀ ìṣe sílẹ̀, ó sì gbára lé àyíká gbolohun tó yí i ká fún ìtumọ̀ rẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: gẹ́gẹ́ bí
  rationale: Ó mú ìfiwéra tó dá lórí ohun tí àwọn ará Tẹsalóníkà mọ̀ wá, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: οἴδατε
  choice: ẹ ti mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí pípé, ìtumọ̀ rẹ̀ níbí ni ìmọ̀ tí wọ́n ní; ‘ẹ ti mọ̀’ bá ọ̀rọ̀ ìrántí ìwà Pọ́ọ̀lù mu.
- source_word: ὡς
  choice: pé
  rationale: ὡς àkọ́kọ́ ṣí àkóónú ohun tí wọ́n mọ̀ sílẹ̀; ‘pé’ sọ ìbáṣepọ̀ yẹn ní kedere ní Yorùbá.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: ẹnì kọ̀ọ̀kan yín
  rationale: Ó pa agbára ìpínkiri ọ̀rọ̀ Gíríìkì mọ́, tó ń tẹnumọ́ bí wọ́n ṣe fiyè sí olúkúlùkù.
- source_word: ὡς
  choice: bí
  rationale: ὡς kejì jẹ́ àmì ìfiwéra; ‘bí’ jẹ́ èdè Yorùbá tó rọrùn, tó sì péye.
- source_word: πατὴρ
  choice: baba
  rationale: Orúkọ náà kò ní árítíkù, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí àpẹẹrẹ ìwà baba; Yorùbá kò nílò ọ̀rọ̀ kan tó dọ́gba pẹ̀lú ‘a’.
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: Ó jẹ́ ọ̀rọ̀ ìbátan tó gba gbogbo ọmọ láì fi akọ tàbí abo kún un.
- source_word: ἑαυτοῦ
  choice: tirẹ̀
  rationale: 'Ó pa ìtẹnumọ́ arọ́pò-orúkọ àfara-ẹni mọ́: àwọn ọmọ tí í ṣe ọmọ baba náà fúnra rẹ̀.'
- source_word: '[elliptical verbal idea from context]'
  choice: a ṣe sí
  rationale: Gbólóhùn Gíríìkì náà fi ìṣe sílẹ̀ fún àyíká ọ̀rọ̀ láti pèsè. ‘A ṣe sí’ jẹ́ gbòòrò tó, kò sì dín ìṣe olùṣọ́-agutan náà kù sí ọ̀kan ṣoṣo nínú àwọn ìṣe tí ẹsẹ tó tẹ̀ lé sọ.
theological_decisions:
- issue: Pípèsè ìṣe tí a kò sọ ní tààrà nínú gbólóhùn Gíríìkì aláìpé
  choice: 'Lo ọ̀rọ̀ ìṣe gbòòrò: ‘a ṣe sí ẹnì kọ̀ọ̀kan yín’'
  alternative: Fi gbólóhùn náà sílẹ̀ ní ìrísí aláìpé, tàbí pèsè ìṣe pàtó bí ‘a gbà yín níyànjú.’
  rationale: Àyíká gbólóhùn ló ń pèsè ìṣe náà, ó sì ní ọ̀pọ̀ ìṣe olùtọ́jú. Ọ̀rọ̀ gbòòrò yìí mú kí Yorùbá péye láì yan ìṣe pàtó kan tí Gíríìkì ẹsẹ yìí kò dá sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. ‘A ṣe sí’ jẹ́ àdánidá ṣùgbọ́n ó mọ̀ọ́mọ̀ gbòòrò láti pa àìsọpé gírámà Gíríìkì àti ìgbẹ́kẹ̀lé rẹ̀ lé àyíká ọ̀rọ̀ mọ́. A fi àmì ohùn sí ibi tí ó bá èdè àtẹ̀jáde mu.
