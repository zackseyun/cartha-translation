  text: For you are our glory and joy[a].
translation:
  language: yo
  text: Nítorí ẹ̀yin ni ògo wa àti ayọ̀ wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a fi ń yangàn” tàbí “iyì” fún “ògo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni; lílo rẹ̀ ní kedere nínú Gíríìkì tẹnumọ́ àwọn ará Tẹsalóníkà gẹ́gẹ́ bí ògo àti ayọ̀ àwọn aposteli.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ èrò tó ṣáájú, ó sì fi ìdí ọ̀rọ̀ náà hàn.
- source_word: ἐστε
  choice: ni
  rationale: Ọ̀nà àdánidá Yorùbá láti sọ ìdánimọ̀ pẹ̀lú àfikún orúkọ ni ‘ni’; kò pọndandan láti túmọ̀ ọ́ pẹ̀lú ‘jẹ́’.
- source_word: ἡ δόξα ἡμῶν
  choice: ògo wa
  rationale: ‘Ògo’ pa ìtumọ̀ pàtàkì δόξα mọ́, títí kan iyì àti ohun tí ènìyàn fi ń yangàn, láì dín ọ̀rọ̀ náà kù sí ìgbéraga.
- source_word: καὶ ἡ χαρά
  choice: àti ayọ̀ wa
  rationale: χαρά túmọ̀ sí ayọ̀ tàbí inú dídùn; ‘ayọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì bá orúkọ àìṣe mu.
theological_decisions:
- issue: Ìtumọ̀ δόξα nínú ọ̀rọ̀ Pọ́ọ̀lù nípa ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn onígbàgbọ́
  choice: ògo
  alternative: ohun ìyangàn; iyì
  rationale: ‘Ògo’ pa fífẹ̀ ìtumọ̀ Gíríìkì àti agbára ọ̀rọ̀ náà mọ́. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì hàn láì sọ pé ọ̀rọ̀ náà jẹ́ ìgbéraga tàbí ẹ̀kọ́ ìsìn pàtó kan.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tó yẹ, a sì pa ìtẹnumọ́ ‘ẹ̀yin’ àti ìbáṣepọ̀ ọ̀rọ̀ náà mọ́.
