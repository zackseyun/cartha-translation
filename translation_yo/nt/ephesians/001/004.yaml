  source_fidelity: Ìtumọ̀ náà pa ìbáṣepọ̀ καθὼς, yíyan “nínú rẹ̀,” àti àkókò “ṣáájú ìpilẹ̀ ayé” mọ́ dáadáa. Ṣùgbọ́n “aláìlẹ́gàn” túmọ̀ sí ẹni tí a kò lẹ́gàn, kì í sì ṣe ἀμώμους (“aláìní àbàwọ́n/aláìlábàwọ́n”). Bákan náà, “kí a lè jẹ́” fi èrò agbára tàbí ìmúlò (“may be able to”) kún ìtumọ̀ infinitive náà díẹ̀; “láti jẹ́” jẹ́ ọ̀nà tó sún mọ́ orísun, tó sì jẹ́ Yorùbá àdánidá.
