source:
  edition: SBLGNT
  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: yo
  text: gẹ́gẹ́ bí ó ti yàn wá nínú rẹ̀ ṣáájú ìpilẹ̀ ayé, láti jẹ́[c] mímọ́ àti aláìlábàwọ́n[b] níwájú rẹ̀ nínú ìfẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, a lè so “nínú ìfẹ́” mọ́ ẹsẹ tó tẹ̀ lé e pé: “Nínú ìfẹ́, ó ti pinnu wa tẹ́lẹ̀ ...”'
    reason: alternative_reading
  - marker: b
    text: Tàbí, “láìní àbàwọ́n.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí a jẹ́.”
    reason: previous_rendering
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó pa ipa ọ̀rọ̀ àsopọ̀ mọ́, ó sì so yíyan náà pọ̀ mọ́ ìbùkún tí a mẹ́nu kàn ṣáájú.
- source_word: ἐξελέξατο
  choice: ó ti yàn
  rationale: “Yàn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìṣe yíyan, láìfi èrò ẹ̀kọ́ ìsìn kan tí ó kọjá ohun tí Gíríìkì sọ kún un.
- source_word: ἡμᾶς
  choice: wá / a
  rationale: “Wá” ni àṣepé ìṣe yíyan, “a” sì ni ẹni tí gbólóhùn àfojúsùn tó tẹ̀ lé ń tọ́ka sí.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù tó ṣókí nípa wíwà nínú Kristi mọ́, láìtúmọ̀ rẹ̀ sí àlàyé gígùn tàbí yanjú gbogbo ìtumọ̀ rẹ̀.
- source_word: πρὸ καταβολῆς κόσμου
  choice: ṣáájú ìpilẹ̀ ayé
  rationale: Ó fi ìtumọ̀ àkókò hàn, ó sì tẹ̀ lé àwòrán Gíríìkì nípa fífi ìpìlẹ̀ ayé lélẹ̀.
- source_word: εἶναι ἡμᾶς
  choice: kí a lè jẹ́
  rationale: Ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì lè fi àfojúsùn tàbí àbájáde yíyan náà hàn. Àṣàyàn tó sún mọ́ fọ́ọ̀mù àìlópin wà nínú àlàyé ìsàlẹ̀.
- source_word: ἁγίους
  choice: mímọ́
  rationale: Ó pa ìtumọ̀ ìwà mímọ́ àti jíjẹ́ ẹni tí a yà sọ́tọ̀ fún Ọlọ́run mọ́.
- source_word: ἀμώμους
  choice: aláìlẹ́gàn
  rationale: Ó sọ àìní ẹ̀sùn tàbí ohun tí a lè fi bá ẹni wí ní Yorùbá àdánidá; “láìní àbàwọ́n” ni àṣàyàn tó pa àwòrán ìrúbọ mọ́ jù.
- source_word: κατενώπιον αὐτοῦ
  choice: níwájú rẹ̀
  rationale: Ó fi ìwàláàyè àti jíjẹ́ ẹni tó dúró ní ojú Ọlọ́run hàn ní ṣókí.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: A fi gbólóhùn náà sí ipò tó wà ní Gíríìkì, kí àìdánilójú bóyá ó so mọ́ ohun tó ṣáájú tàbí ohun tó tẹ̀ lé e má bàa sọnù.
theological_decisions:
- issue: Ṣíṣe àlàyé ẹ̀kọ́ ìsìn tó pọ̀ jù sí ἐξελέξατο
  choice: ó ti yàn wá
  alternative: ó ti dìbò yàn wá
  rationale: “Yàn” sọ ohun tí ẹsẹ náà sọ ní kedere, ṣùgbọ́n kò fi ètò ẹ̀kọ́ ìsìn ẹ̀gbẹ́ kan kún ọ̀rọ̀ náà.
- issue: Ibi tí ἐν ἀγάπῃ so mọ́
  choice: fi “nínú ìfẹ́” sí òpin ẹsẹ 4, kí àlàyé ìsàlẹ̀ sì tọ́ka sí àṣàyàn kejì
  alternative: 'so ó mọ́ ẹsẹ 5: “Nínú ìfẹ́, ó ti pinnu wa tẹ́lẹ̀...”'
  rationale: Ìkọ̀wé Gíríìkì lè jẹ́ kí gbólóhùn náà so mọ́ jíjẹ́ mímọ́ àti aláìlẹ́gàn, tàbí mọ́ ìpinnu tẹ́lẹ̀ nínú ẹsẹ tó tẹ̀ lé. A kò gbọdọ̀ yanjú àìdánilójú gidi yìí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣì rọrùn fún òǹkàwé òde òní. A pa ìtẹ̀síwájú gbólóhùn láti ẹsẹ tó ṣáájú mọ́ nípa bẹ̀rẹ̀ pẹ̀lú “gẹ́gẹ́ bí,” bí ó tilẹ̀ jẹ́ pé àjákù gbólóhùn ni ẹsẹ yìí bí a bá kà á nìkan.
