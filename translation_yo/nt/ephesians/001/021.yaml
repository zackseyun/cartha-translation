id: EPH.1.21
reference: Ephesians 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: yo
  text: Ó ga jù gbogbo ìṣàkóso àti àṣẹ àti agbára àti ìjọba lọ, àti gbogbo orúkọ tí a ń pè[a], kì í ṣe ní sáà yìí nìkan, ṣùgbọ́n ní sáà tí ń bọ̀ pẹ̀lú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ipò-ọba àti àṣẹ àti agbára àti ipò olúwa.” Àwọn ọ̀rọ̀ Gíríìkì lè tọ́ka sí onírúurú ipò tàbí agbègbè àṣẹ, títí kan àwọn agbára àgbáyé tàbí ti ẹ̀mí.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ní ṣókí, “kì í ṣe ní sáà yìí nìkan, ṣùgbọ́n ní èyí tí ń bọ̀ pẹ̀lú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: ga rékọjá
  rationale: Ó fi ìgbéga àti jíjẹ́ gíga ju ohun gbogbo lọ hàn ní Yorùbá àdánidá, láì sọ ọ̀rọ̀ náà di àsọdùn.
- source_word: πάσης ἀρχῆς
  choice: gbogbo ìṣàkóso
  rationale: Ìṣàkóso pa ìtumọ̀ ẹ̀ka tàbí agbègbè àṣẹ mọ́, kò sì sọ ní pàtó pé ènìyàn tàbí ẹ̀mí ni a ń tọ́ka sí.
- source_word: ἐξουσίας
  choice: àṣẹ
  rationale: Àṣẹ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹ̀tọ́ tàbí agbára láti pàṣẹ, ó sì yàtọ̀ sí agbára gẹ́gẹ́ bí δύναμις.
- source_word: δυνάμεως
  choice: agbára
  rationale: Ó jẹ́ ìtumọ̀ tó ṣe kedere fún ipá tàbí agbára, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí àṣẹ.
- source_word: κυριότητος
  choice: ìṣe olórí
  rationale: Ó sọ ipò tàbí agbègbè jíjẹ́ olórí hàn láì da a pọ̀ mọ́ àkọ́lé Ọlọ́run, ‘Olúwa.’
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: gbogbo orúkọ tí a ń dárúkọ
  rationale: Ó pa àtúnsọ àsọyé Gíríìkì mọ́, ó sì gbòòrò tó láti ní orúkọ, oyè, tàbí ipò nínú.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: kì í ṣe ... nìkan, ṣùgbọ́n ... pẹ̀lú
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti pa ìfiwéra àti ìtẹnumọ́ àsopọ̀ Gíríìkì mọ́.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: ní ìgbà ayé yìí
  rationale: ‘Ìgbà ayé’ mú ìtumọ̀ sáà àkókò jáde, dípò kí ‘ayé’ nìkan dà bí ibi tàbí gbogbo ẹ̀dá.
- source_word: ἐν τῷ μέλλοντι
  choice: ní ìgbà ayé tí ń bọ̀
  rationale: Ó mú αἰών tí a lóye láti gbólóhùn tó ṣáájú wọ inú Yorùbá fún ìtumọ̀ tó ṣe kedere, ó sì pa ìfojúsọ́nà ọjọ́ iwájú mọ́.
theological_decisions:
- issue: Irú àwọn agbára tí ἀρχή, ἐξουσία, δύναμις àti κυριότης ń tọ́ka sí
  choice: A túmọ̀ wọn sí ẹ̀ka ìṣàkóso àti àṣẹ ní gbogbogbò, láì sọ pé ènìyàn tàbí àwọn ẹ̀dá ẹ̀mí nìkan ni.
  alternative: Kí a pè wọ́n ní àwọn agbára ẹ̀mí tàbí àwọn ipò áńgẹ́lì ní pàtó.
  rationale: Ó ṣeé ṣe kí àwọn agbára àgbáyé tàbí ti ẹ̀mí wà nínú ìtọ́kasí náà, ṣùgbọ́n Gíríìkì kò sọ irú ẹni tàbí ẹ̀dá wọn ní pàtó. Ìtumọ̀ náà pa fífẹ̀ ọ̀rọ̀ náà àti ìdánilójú tí kò pé mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. Ìtòlẹ́sẹẹsẹ ọ̀rọ̀ náà tẹ̀ lé àkójọ Gíríìkì, ṣùgbọ́n a lo àsopọ̀ àti àfihàn ìfiwéra tí ó bá Yorùbá mu. Gbólóhùn náà bẹ̀rẹ̀ pẹ̀lú lẹ́tà kékeré nítorí ó ń bá èrò àti gbólóhùn ẹsẹ tó ṣáájú lọ.
