source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: yo
  text: Ó sì fi ohun gbogbo sí abẹ́ ẹsẹ̀ rẹ̀[a], ó sì fi í fún ìjọ gẹ́gẹ́ bí orí lórí ohun gbogbo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìsọ̀rọ̀ yìí ń ṣàtúnlò àwòrán inú Sáàmù 8:6, níbi tí a ti fi ohun gbogbo sí abẹ́ ẹsẹ̀ ẹni tí ó ń ṣàkóso.
    reason: cross_reference
  - marker: b
    text: 'A tún lè túmọ̀ rẹ̀ sí: ‘ó sì fi í gẹ́gẹ́ bí orí lórí ohun gbogbo fún àǹfààní ìjọ’; dátífù τῇ ἐκκλησίᾳ lè tọ́ka sí ẹni tí ó jẹ̀ǹfààní àti ẹni tí ó gba ohun náà.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ aláìlẹ́mìí, ó sì ń tọ́ka sí gbogbo ohun lápapọ̀, kì í ṣe àwọn ènìyàn nìkan; yíyan ‘ohun gbogbo’ pa ìwọ̀n àgbáyé ọ̀rọ̀ náà mọ́.
- source_word: ὑπέταξεν
  choice: fi … sí abẹ́
  rationale: Gbólóhùn yìí fi ìtẹríba àti wíwà lábẹ́ àṣẹ hàn, ó sì bá àwòrán ‘abẹ́ ẹsẹ̀’ mu ní Yorùbá láìsọ àwòrán Gíríìkì náà nù.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sí abẹ́ ẹsẹ̀ rẹ̀
  rationale: A pa àwòrán ìṣàkóso àti ìṣẹ́gun náà mọ́ nítorí ó ń dún mọ́ Sáàmù 8:6, tí a sì lè lóye rẹ̀ dáadáa ní Yorùbá.
- source_word: αὐτὸν ἔδωκεν
  choice: fi í fún
  rationale: Èyí pa ìtumọ̀ gidi ti δίδωμι, ‘fún’ tàbí ‘fi fún,’ mọ́; kò yí i padà sí ‘yàn’ tàbí ‘sọ di,’ ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ìjọ dúró ṣí sí ìtumọ̀ olùgbà tàbí ẹni tí ó jẹ̀ǹfààní.
- source_word: κεφαλὴν
  choice: gẹ́gẹ́ bí orí
  rationale: ‘Orí’ pa àkàwé Gíríìkì mọ́, ‘gẹ́gẹ́ bí’ sì mú kí ó ṣiṣẹ́ ní ti ẹ̀dà gẹ́gẹ́ bí àfikún ipò lẹ́yìn ‘fi í fún.’
- source_word: ὑπὲρ πάντα
  choice: lórí ohun gbogbo
  rationale: ‘Lórí’ sọ ipò gíga àti àṣẹ Kristi hàn; pípa ‘ohun gbogbo’ mọ́ tún fi ààlà àgbáyé ìṣàkóso náà hàn kedere.
- source_word: τῇ ἐκκλησίᾳ
  choice: fún ìjọ
  rationale: Dátífù náà lè tọ́ka sí ẹni tí a fi Kristi fún tàbí ẹni tí fífi náà ṣe fún ní àǹfààní. ‘Fún ìjọ’ jẹ́ Yorùbá àdánidá tí ó lè gba àwọ̀ ìtumọ̀ méjèèjì; ‘ìjọ’ sì ni ọ̀rọ̀ tí ó wọ́pọ̀, tí ó sì yẹ ní àyíká Páùlù.
theological_decisions:
- issue: Ìbáṣepọ̀ ipò Kristi gẹ́gẹ́ bí orí pẹ̀lú ohun gbogbo àti ìjọ
  choice: Ọlọ́run fi Kristi fún ìjọ gẹ́gẹ́ bí ẹni tí ó jẹ́ orí lórí ohun gbogbo.
  alternative: Ọlọ́run fi Kristi ṣe orí lórí ohun gbogbo fún àǹfààní ìjọ.
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì so ‘orí’ mọ́ ‘lórí ohun gbogbo’ ní ti ẹ̀dá jù, ṣùgbọ́n dátífù ‘fún ìjọ’ lè jẹ́ ti olùgbà tàbí ti àǹfààní. Ìtumọ̀ náà àti àlàyé ìsàlẹ̀ pa ìṣàkóso Kristi lórí gbogbo ohun àti àǹfààní pàtàkì ìjọ mọ́ láìfi agbára yan ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘fi … sí abẹ́ ẹsẹ̀’ láti pa àwòrán Ìwé Mímọ́ mọ́, a sì lo ‘fún ìjọ’ láti má ṣe pa àìdánilójú dátífù Gíríìkì rẹ́.
