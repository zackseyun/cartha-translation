  yaml_path: translation/nt/ephesians/001/016.yaml
  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: yo
  text: Èmi kò dẹ́kun ìdúpẹ́ fún yín, mo sì ń rántí yín nínú àwọn àdúrà mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo sì ń dárúkọ yín nínú àwọn àdúrà mi.” Ìsọ̀rọ̀ Gíríìkì náà ní ti gidi ni “dídárúkọ [yín] nínú àwọn àdúrà mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παύομαι
  choice: Èmi kò dáwọ́
  rationale: Ó fi ìṣe tí kò dáwọ́ dúró hàn, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu ní Yorùbá àdánidá.
- source_word: εὐχαριστῶν
  choice: dúpẹ́
  rationale: Ọ̀rọ̀ ìṣe alábàápín yìí ń ṣẹlẹ̀ papọ̀ pẹ̀lú οὐ παύομαι; ‘dúpẹ́’ sọ ìdúpẹ́ náà ní kedere àti ní èdè Yorùbá àdánidá.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: Ní àyíká ìdúpẹ́ yìí, gbólóhùn náà tọ́ka sí àwọn tí Pọ́ọ̀lù ń dúpẹ́ lọ́wọ́ Ọlọ́run nítorí wọn.
- source_word: μνείαν ποιούμενος
  choice: mo sì ń rántí yín
  rationale: Àṣàọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gidi sí ‘ṣíṣe ìrántí/ìdarúkọ’; ‘ń rántí yín’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tó sì pa ìtumọ̀ mọ́.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: nínú àdúrà mi
  rationale: Ó sọ ibi tàbí àkókò ìrántí náà, ‘nínú àdúrà mi’ sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. A yan ‘ń rántí yín’ gẹ́gẹ́ bí àṣàọ̀rọ̀ Yorùbá àdánidá, a sì fi ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì sí àlàyé ìsàlẹ̀.
