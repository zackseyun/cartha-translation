  source_fidelity: Ìtumọ̀ náà tọ́ka ìjọ sí ‘ara’ Kristi, ó sì pa πλήρωμα mọ́ gẹ́gẹ́ bí ‘ẹ̀kúnrẹ́rẹ́.’ Síbẹ̀, ‘ń fi ohun gbogbo kún inú ohun gbogbo’ túmọ̀ sí fífi ohun gbogbo kún un sínú ohun gbogbo, kì í ṣe pé ẹni náà ń kún ohun gbogbo. Àtúnṣe náà mú ìṣe alágbára participle náà hàn dáadáa, ó sì pa àìdánilójú ‘ἐν πᾶσιν’ mọ́ pẹ̀lú ‘ní ohun gbogbo.’
  naturalness: ‘Ẹni tí ó ń kún ohun gbogbo ní ohun gbogbo’ jẹ́ Yorùbá tí ó mọ́gbọ́n dání ju ìkọ́lé ‘fi ... kún inú ...’ lọ ní àyíká yìí. ‘Ẹ̀kúnrẹ́rẹ́’ yẹ fún ìpele ọ̀wọ̀ àti ọ̀rọ̀ ẹ̀sìn, bí ó tilẹ̀ jẹ́ pé ó fi ìjìnlẹ̀ gíríìkì náà sílẹ̀ fún olùkà.
  terminology: A dá ‘ara,’ ‘ẹ̀kúnrẹ́rẹ́,’ àti ‘ohun gbogbo’ dúró. ‘Kristi’ kò nílò kí a tún fi sí gbolohun yìí, nítorí ‘rẹ̀’ ń tọ́ka sí i láti ẹsẹ̀ tó ṣáájú. Àlàyé ìsàlẹ̀ b ni a tún ṣe kí ó má ṣe sọ pé ‘ohun gbogbo’ ni a fi ń kún ẹni náà nípasẹ̀ ‘ohun gbogbo,’ èyí tí kò tẹ̀lé ìrísí gírámà Gíríìkì náà dáadáa.
