translation:
  language: yo
  text: èyí tí í ṣe ara rẹ̀[a], ẹ̀kúnrẹ́rẹ́ ẹni tí ó ń kún ohun gbogbo ní ohun gbogbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìjọ ni ‘ara rẹ̀’ tí ọ̀rọ̀ náà ń tọ́ka sí.
    reason: referent_clarification
  - marker: b
    text: 'A tún lè lóye participle náà gẹ́gẹ́ bí, ‘ẹni tí a ń kún ní ohun gbogbo’; ṣùgbọ́n ọ̀pọ̀ àwọn olùtumọ̀ ló gbà á ní ìtumọ̀ alágbára: ‘ẹni tí ó ń kún ohun gbogbo ní ohun gbogbo.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: èyí tí í ṣe
  rationale: Ó tọ́ka padà sí ìjọ ní ẹsẹ 22, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti so àpèjúwe náà pọ̀ mọ́ ohun tí a mẹ́nu kàn ṣáájú.
- source_word: σῶμα
  choice: ara
  rationale: Èyí ni ìtumọ̀ tààrà àti àkàwé Páùlù tó wọ́pọ̀ fún ìbáṣepọ̀ ìjọ pẹ̀lú Kristi.
- source_word: πλήρωμα
  choice: ẹ̀kúnrẹ́rẹ́
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ‘fullness’ mọ́ láì pinnu bóyá ìjọ ni ohun tí Kristi ń kún tàbí ohun tí ó jẹ́ ìmúṣẹ̀ àkàwé ara náà.
- source_word: τοῦ ... πληρουμένου
  choice: ẹni tí ń fi ... kún
  rationale: Bí ó tilẹ̀ jẹ́ pé participle náà ní ìrísí middle/passive, ìtumọ̀ alágbára ‘ẹni tí ń kún’ bá àyíká ọ̀rọ̀ mu jù; a fi ìtumọ̀ passive sí àlàyé ìsàlẹ̀.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìwọ̀n àgbáyé àti ìkó gbogbo nǹkan sínú ọ̀rọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐν πᾶσιν
  choice: inú ohun gbogbo
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì ‘nínú gbogbo’ ó sì pa àìdánilójú rẹ̀ mọ́ dípò yíyan ‘ní gbogbo ọ̀nà’ tàbí ‘nínú gbogbo ènìyàn.’
theological_decisions:
- issue: Ìtumọ̀ πλήρωμα ní ìbáṣepọ̀ ìjọ àti Kristi
  choice: A pè ìjọ ní ‘ẹ̀kúnrẹ́rẹ́’ ẹni náà, a kò sì ṣàlàyé rẹ̀ kọjá ohun tí Gíríìkì sọ.
  alternative: Ìjọ gẹ́gẹ́ bí ohun tí Kristi kún; tàbí gẹ́gẹ́ bí ohun tí ó mú àkàwé ara Kristi pé.
  rationale: ‘Ẹ̀kúnrẹ́rẹ́’ pa ìjìnlẹ̀ àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ inú πλήρωμα mọ́.
- issue: Ohùn àti ìtumọ̀ πληρουμένου
  choice: ẹni tí ń fi ohun gbogbo kún inú ohun gbogbo
  alternative: ẹni tí a ń fi ohun gbogbo kún inú rẹ̀ nípasẹ̀ ohun gbogbo
  rationale: Àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ìtumọ̀ alágbára, ṣùgbọ́n ìrísí gírámà middle/passive mú kí ìtumọ̀ kejì yẹ fún àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, àdánidá, àti òde òní ni a lò. ‘Ẹ̀kúnrẹ́rẹ́’ pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́; ‘inú ohun gbogbo’ sì mọ̀ọ́mọ̀ pa ἐν πᾶσιν mọ́ ní ọ̀nà tí kò fi àìdánilójú rẹ̀ parẹ́.
