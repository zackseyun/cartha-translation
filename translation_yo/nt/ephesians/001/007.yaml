revisions:
- from: Nínú rẹ̀ ni àwa ti ní ìràpadà nípasẹ̀ ẹ̀jẹ̀ rẹ̀, ìdáríjì àwọn ìrékọjá wa, gẹ́gẹ́ bí ọ̀pọ̀lọpọ̀ oore-ọ̀fẹ́ rẹ̀.
  to: Nínú rẹ̀ ni a ní ìràpadà nípasẹ̀ ẹ̀jẹ̀ rẹ̀, ìdáríjì àwọn ìrékọjá, gẹ́gẹ́ bí ìpọ̀lọpọ̀ oore-ọ̀fẹ́ rẹ̀.
  rationale: The revision preserves the Greek word order and theological concreteness while removing an unsupported possessive, rendering the present-tense verb directly, and expressing the riches/abundance of grace more naturally in Yorùbá. No footnote is necessary, since the English lexical alternatives do not require a corresponding Yorùbá note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:32:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the central Greek elements: union with the referent (''Nínú rẹ̀''), redemption, the instrumental phrase ''nípasẹ̀ ẹ̀jẹ̀ rẹ̀,'' and the appositional relation of redemption to forgiveness. However, ''ti ní'' can suggest a completed/perfect acquisition rather than the present indicative ἔχομεν, and adding ''wa'' to ''àwọn ìrékọjá'' supplies an explicit possessive absent from the Greek.'
  naturalness: The wording is generally clear Standard Yorùbá. Replacing 'àwa ti ní' with 'a ní' is more natural and directly expresses the unmarked present. 'Ìpọ̀lọpọ̀ oore-ọ̀fẹ́ rẹ̀' naturally conveys the abundance/riches intended by τὸ πλοῦτος.
  terminology: Ìràpadà, ìdáríjì, ìrékọjá, ẹ̀jẹ̀, and oore-ọ̀fẹ́ are suitable established terms. The concrete blood language and the appositional syntax should remain unchanged.
  issues:
  - severity: medium
    issue: The phrase 'àwa ti ní' does not directly reflect the present indicative ἔχομεν.
    rationale: The Greek states a present reality, 'we have.' Although 'ti ní' may be understood contextually, it more readily carries a completed/perfect sense. 'A ní' preserves the present assertion without unnecessary emphasis.
  - severity: medium
    issue: The possessive 'wa' in 'àwọn ìrékọjá wa' is not expressed in the Greek.
    rationale: The genitive παραπτωμάτων means 'of trespasses/transgressions' and does not contain 'our.' The surrounding first-person plural may make the implication understandable, but adding it narrows the source wording unnecessarily.
  - severity: low
    issue: '''Ọ̀pọ̀lọpọ̀'' is less precise for the singular noun πλοῦτος (''riches/abundance'').'
    rationale: Ìpọ̀lọpọ̀ more idiomatically represents abundance as the measure of grace while retaining the sense of κατά ('according to').
  revised_text: Nínú rẹ̀ ni a ní ìràpadà nípasẹ̀ ẹ̀jẹ̀ rẹ̀, ìdáríjì àwọn ìrékọjá, gẹ́gẹ́ bí ìpọ̀lọpọ̀ oore-ọ̀fẹ́ rẹ̀.
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek word order and theological concreteness while removing an unsupported possessive, rendering the present-tense verb directly, and expressing the riches/abundance of grace more naturally in Yorùbá. No footnote is necessary, since the English lexical alternatives do not require a corresponding Yorùbá note.
