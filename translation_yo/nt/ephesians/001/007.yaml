id: EPH.1.7
reference: Ephesians 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: yo
  text: Nínú rẹ̀ ni a ní ìràpadà nípasẹ̀ ẹ̀jẹ̀ rẹ̀, ìdáríjì àwọn ìrékọjá, gẹ́gẹ́ bí ìpọ̀lọpọ̀ oore-ọ̀fẹ́ rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Ẹni Àyànfẹ́ ní ẹsẹ tó ṣáájú; ‘nínú rẹ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ìṣọ̀kan pẹ̀lú Kristi mọ́.
- source_word: ἔχομεν
  choice: àwa ti ní
  rationale: Ó sọ ohun tí àwọn onígbàgbọ́ ní ní ìsinsìnyí; lílo ‘ti ní’ fi hàn pé ìràpadà náà ti di ohun ìní wọn báyìí.
- source_word: ἀπολύτρωσιν
  choice: ìràpadà
  rationale: ‘Ìràpadà’ pa èrò ìdásílẹ̀ nípasẹ̀ iye tí a san mọ́, ó sì yẹ fún lílo ọ̀rọ̀ náà nínú lẹ́tà Paulu.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: nípasẹ̀ ẹ̀jẹ̀ rẹ̀
  rationale: διά pẹ̀lú genitive ń tọ́ka sí ohun èlò tàbí ọ̀nà; gbolohun yìí pa àwòrán ẹbọ àti ikú inú orísun mọ́ láìṣe àlàyé rẹ̀ sí ‘ikú’.
- source_word: ἄφεσιν
  choice: ìdáríjì
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí yíyọ ẹ̀bi kúrò tàbí fífi ẹ̀ṣẹ̀ jì; ‘ìdáríjì’ ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: παραπτωμάτων
  choice: àwọn ìrékọjá wa
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ìṣe àìtọ́ tàbí ẹ̀ṣẹ̀; ‘ìrékọjá’ pa àwòrán fífi ẹsẹ̀ kọjá ààlà mọ́. ‘Wa’ mú genitive tó wà láìsọ ẹni ní Gíríìkì ṣe kedere gẹ́gẹ́ bí ohun tí a dárí jì fún ‘àwa,’ láìyí ìtọ́kasí padà.
- source_word: κατὰ τὸ πλοῦτος
  choice: gẹ́gẹ́ bí ọ̀pọ̀lọpọ̀
  rationale: κατά pẹ̀lú accusative tọ́ka sí ìwọ̀n tàbí ìlànà; ‘gẹ́gẹ́ bí’ pa ìbáwọ̀n náà mọ́, ‘ọ̀pọ̀lọpọ̀’ sì sọ ọ̀rọ̀ ìṣúra di àdánidá ní Yorùbá.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún χάρις, ó sì pa ìtumọ̀ inú rere Ọlọ́run tí a kò tọ́ sí mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ‘ìràpadà’ àti ‘ìdáríjì àwọn ìrékọjá’
  choice: 'A fi àwọn gbolohun méjèèjì sí ìṣọ̀kan apposition gẹ́gẹ́ bí Gíríìkì: ‘ìràpadà ..., ìdáríjì ...’'
  alternative: ‘ìràpadà, èyíinì ni ìdáríjì àwọn ìrékọjá wa’
  rationale: Gbolohun kejì lè ṣàlàyé àkóónú tàbí àbájáde ìràpadà, ṣùgbọ́n orísun kò fi ọ̀rọ̀ ‘èyíinì ni’ kún un; ìtumọ̀ náà pa ìṣòro ìbáṣepọ̀ yìí mọ́ láìyanju rẹ̀ ju orísun lọ.
- issue: Èdè ètùtù nínú ‘nípasẹ̀ ẹ̀jẹ̀ rẹ̀’
  choice: A pa ọ̀rọ̀ gidi náà, ‘nípasẹ̀ ẹ̀jẹ̀ rẹ̀,’ mọ́.
  alternative: ‘nípasẹ̀ ikú rẹ̀’ tàbí ‘nípasẹ̀ ikú rẹ̀ gẹ́gẹ́ bí ẹbọ’
  rationale: Orísun sọ ‘ẹ̀jẹ̀’ ní pàtó, èyí tó ní àwòrán ẹbọ àti májẹ̀mú; yíyí i sí ‘ikú’ nìkan yóò jẹ́ àlàyé dípò ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tó ṣeé lóye. A yàgò fún àsọyé ẹ̀kọ́ ìjọ kan pàtó. Ko sí àlàyé ìsàlẹ̀ ojú ìwé nítorí àwọn àṣàyàn Gíríìkì tí a fún nínú POB Gẹ̀ẹ́sì kò nílò àṣàyàn míì tó dára ju nínú Yorùbá.
