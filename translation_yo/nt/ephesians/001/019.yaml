id: EPH.1.19
reference: Ephesians 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: yo
  text: àti bí ìtóbi agbára rẹ̀ tí ó tayọ sí àwa tí a ń gbàgbọ́[a] ṣe pọ̀ tó, gẹ́gẹ́ bí ìṣiṣẹ́ ipá okun rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú àwa tí a ń gbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé “sí wa,” ṣùgbọ́n àwọn ìtumọ̀ kan túmọ̀ ọ́ ní ọ̀nà ìṣàlàyé sí i gẹ́gẹ́ bí agbára Ọlọ́run tí ń ṣiṣẹ́ nínú àwọn onígbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: tí ó tayọ
  rationale: Ó pa ìtumọ̀ ohun tí ó ré kọjá tàbí tí ó ga ju ohun mìíràn lọ mọ́, láìfi ìtumọ̀ líle bí ‘tí kò ṣeé díwọ̀n’ kún un.
- source_word: μέγεθος
  choice: títóbi
  rationale: Ọ̀rọ̀ Yorùbá àdánidá ni fún ‘greatness,’ ó sì bá àkójọpọ̀ ọ̀rọ̀ náà mu.
- source_word: δύναμις
  choice: agbára
  rationale: ‘Agbára’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún agbára tó lè ṣiṣẹ́, ó sì jẹ́ kí a lè yà á sọ́tọ̀ kúrò lára κράτος àti ἰσχύς.
- source_word: εἰς ἡμᾶς
  choice: sí wa
  rationale: Ó pa ìtọ́kasí agbára Ọlọ́run sí àwọn onígbàgbọ́ mọ́, láìdá a lójú pé ‘nínú wa’ nìkan ni ìṣiṣẹ́ náà wà.
- source_word: τοὺς πιστεύοντας
  choice: tí a gbàgbọ́
  rationale: Ó tú participle náà sí ọ̀nà ọ̀rọ̀-ìṣe tó jẹ́ ti Yorùbá àdánidá, dípò yíyí i padà sí orúkọ ẹgbẹ́ kan.
- source_word: κατά
  choice: ní ìbámu pẹ̀lú
  rationale: Ó fi hàn pé agbára tí ó tọ̀ sí wa bá ìṣiṣẹ́ agbára Ọlọ́run mu, kì í ṣe pé ọ̀rọ̀ náà ń sọ ohun èlò nìkan.
- source_word: ἐνέργεια
  choice: ìṣiṣẹ́
  rationale: Ó túmọ̀ sí iṣẹ́ tàbí ìṣe tó ń ṣiṣẹ́ lọ́nà gbígbéṣẹ́, láìmú ìtumọ̀ òde òní ti ‘energy’ wọlé.
- source_word: κράτος
  choice: ipá
  rationale: ‘Ipá’ ń sọ agbára tí a fi hàn nínú ìṣe, ó sì jẹ́ ọ̀rọ̀ tó yàtọ̀ sí ‘agbára’ àti ‘okun’ nínú àkójọpọ̀ náà.
- source_word: ἰσχύς
  choice: okun
  rationale: ‘Okun’ ń tọ́ka sí okun tàbí agbára inú, ó sì pa ìyàtọ̀ kékeré tó wà láàárín àwọn ọ̀rọ̀ agbára inú Gíríìkì mọ́.
- source_word: καὶ τί
  choice: àti bí ... ṣe rí
  rationale: Gbólóhùn náà ń tẹ̀ síwájú láti ẹsẹ ṣáájú; ìṣètò ‘bí ... ṣe rí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ohun tí Gíríìkì fi τί béèrè tàbí ṣàpèjúwe.
theological_decisions:
- issue: Àkójọpọ̀ δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: Pa àkójọpọ̀ náà mọ́ pẹ̀lú ‘agbára ... ìṣiṣẹ́ ... ipá ... okun.’
  alternative: Kó gbogbo àwọn ọ̀rọ̀ náà jọ sí ‘agbára ńlá rẹ̀’ tàbí ‘agbára rẹ̀ tó ń ṣiṣẹ́.’
  rationale: Pọ́ọ̀lù kó àwọn ọ̀rọ̀ tó sún mọ́ra jọ láti tẹnu mọ́ bí agbára Ọlọ́run ti tóbi tó àti bí ó ti ń ṣiṣẹ́. Yíyan ọ̀rọ̀ Yorùbá ọ̀tọ̀ fún ọ̀kọ̀ọ̀kan pa ìtẹnumọ́ náà mọ́ láìsọ wọ́n di ẹ̀kọ́ ìmọ̀ Ọlọ́run ẹlẹ́ka.
- issue: Ìtọ́sọ́nà agbára Ọlọ́run nínú εἰς ἡμᾶς
  choice: ‘sí wa tí a gbàgbọ́’
  alternative: ‘nínú wa tí a gbàgbọ́’ tàbí ‘fún wa tí a gbàgbọ́’
  rationale: εἰς ń tọ́ka sí ìdarí tàbí ìfọwọ́sowọ́pọ̀ agbára náà sí wa. ‘Sí wa’ pa ààyè sílẹ̀ fún bí agbára náà ṣe ń ṣiṣẹ́ fún wa tàbí nínú wa, láìyan ọ̀kan gẹ́gẹ́ bí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò. Ìṣètò ‘bí ... ṣe rí’ mú àkóónú gírámà tí ó ń bá àdúrà ẹsẹ ṣáájú lọ ṣe kedere. A pa àwọn ọ̀rọ̀ agbára mẹ́rin náà yàtọ̀, bí ó tilẹ̀ jẹ́ pé ‘ìṣiṣẹ́ ipá okun rẹ̀’ ní ìwọ̀n ìdíwọ̀n ìtẹ̀lé-orísun díẹ̀, kí ìtẹnumọ́ àti àkójọpọ̀ Gíríìkì má bàa sọnù.
