  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: yo
  text: kí àwa tí a ti ní ìrètí nínú Mèsáyà tẹ́lẹ̀ lè jẹ́ ìyìn fún ògo rẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwa tí a kọ́kọ́ ní ìrètí nínú Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kí àwa, tí a ti ní ìrètí nínú Mèsáyà tẹ́lẹ̀, lè jẹ́ ìyìn fún ògo rẹ̀.”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: kí ... lè jẹ́
  rationale: Ìṣọ̀kan εἰς pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni tó ń ṣe é fi ète tàbí àbájáde hàn; ‘kí ... lè jẹ́’ sọ agbára yìí ní Yorùbá adayébá láì sọ ọ́ di àlàyé gígùn.
- source_word: ἡμᾶς
  choice: àwa
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ arọ́pò-orúkọ náà wà ní accusative gẹ́gẹ́ bí olùṣe infinitive ní Gíríìkì, ‘àwa’ ni ó bójú mu nínú àtúnṣe gbólóhùn Yorùbá yìí.
- source_word: εἰς ἔπαινον
  choice: fún ìyìn
  rationale: ‘Fún ìyìn’ pa ìtumọ̀ ète tàbí àbájáde mọ́, ó sì bá àṣà ọ̀rọ̀ Yorùbá mu.
- source_word: δόξης αὐτοῦ
  choice: ògo rẹ̀
  rationale: A pa ìbáṣepọ̀ genitive náà mọ́ ní ṣókí. ‘Ògo’ tún pa ìwọ̀n àti ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ δόξα mọ́.
- source_word: τοὺς προηλπικότας
  choice: tí a ti ní ìrètí ... tẹ́lẹ̀
  rationale: Perfect participle pẹ̀lú àfikún προ- fi ìrètí tó ti bẹ̀rẹ̀ ṣáájú, tí ó sì ṣì ní ipa, hàn. Ìtumọ̀ yìí kò fi dandan sọ pé àwọn wọ̀nyí ni ẹgbẹ́ àkọ́kọ́ tó ní ìrètí.
- source_word: ἐν τῷ Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, ‘nínú’ sì pa ọ̀nà ọ̀rọ̀ Páùlù nípa ìrètí tó dúró nínú ẹni náà mọ́.
theological_decisions:
- issue: Bóyá προηλπικότας túmọ̀ sí ẹgbẹ́ àkọ́kọ́ tó ní ìrètí (tí ọ̀pọ̀ ń kà sí àwọn onígbàgbọ́ Júù) tàbí àwọn tó ti ní ìrètí ṣáájú lásán
  choice: tí a ti ní ìrètí ... tẹ́lẹ̀
  alternative: àwa tí a kọ́kọ́ ní ìrètí nínú Mèsáyà
  rationale: Àfikún προ- fi ohun tó ṣáájú hàn, ṣùgbọ́n kò dájú bóyá ó ń fi ẹgbẹ́ àkọ́kọ́ kan hàn. Ọ̀rọ̀ inú ẹsẹ̀ pa ìṣiyèméjì náà mọ́; àlàyé ìsàlẹ̀ sì fi ìtumọ̀ tó lágbára jù hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ adayébá, ọ̀wọ̀, ó sì pa ìtẹ̀sí ète/àbájáde àti ìṣiyèméjì προηλπικότας mọ́.
