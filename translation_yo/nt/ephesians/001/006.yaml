id: EPH.1.6
reference: Ephesians 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: yo
  text: fún ìyìn ògo oore-ọ̀fẹ́ rẹ̀[a], èyí tí ó fi ṣe ojúrere sí wa nínú Olùfẹ́ náà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “èyí tí ó fi oore-ọ̀fẹ́ ṣe wa” tàbí “èyí tí ó fi ṣe ojúrere sí wa.” Ọ̀rọ̀-ìṣe Gíríìkì náà jọ ọ̀rọ̀ tí a tú sí “oore-ọ̀fẹ́,” ó sì tẹnu mọ́ pé Ọlọ́run fi oore ṣe sí wa.
    reason: lexical_alternative
  - marker: b
    text: “Olùfẹ́ náà” ń tọ́ka sí Ọmọ náà, ìyẹn Mèsáyà.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: fún ìyìn
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ète tàbí àbájáde; “fún ìyìn” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ìtumọ̀ Gíríìkì mu.
- source_word: δόξης
  choice: ògo
  rationale: “Ògo” ni ọ̀rọ̀ Yorùbá tó yẹ fún δόξα nínú ọ̀rọ̀ ìyìn sí Ọlọ́run.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: Ó ń sọ nípa ojúrere tí Ọlọ́run fi fúnni lọ́fẹ̀ẹ́ nínú iṣẹ́ ìgbàlà; “oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání, tó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: èyí tí ó fi ṣe ojúrere sí wa
  rationale: Àrọ́pò-orúkọ náà ń tọ́ka padà sí oore-ọ̀fẹ́, ìṣe χαριτόω sì túmọ̀ sí pé Ọlọ́run fi ojúrere hàn sí wa. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé kò lè pa ìbátan fọ́ọ̀mù ọ̀rọ̀ χάρις/χαριτόω mọ́ ní kíkún.
- source_word: ἐν
  choice: nínú
  rationale: “Nínú” pa ìtumọ̀ ìpìlẹ̀ preposition náà mọ́, ó sì jẹ́ kí ìtumọ̀ nípa ìṣọ̀kan, àyíká, tàbí ọ̀nà iṣẹ́ Ọlọ́run dúró láìfi ipa mú ọ̀kan ṣoṣo.
- source_word: τῷ ἠγαπημένῳ
  choice: Olùfẹ́ náà
  rationale: Participle náà dúró gẹ́gẹ́ bí orúkọ oyè fún ẹni tí Ọlọ́run fẹ́ràn. “Olùfẹ́ náà” pa irú oyè yẹn mọ́ láìfi “Ọmọ” kún ohun tí ẹsẹ yìí kò sọ ní tààrà.
theological_decisions:
- issue: Ìbátan χάρις àti χαριτόω
  choice: oore-ọ̀fẹ́ rẹ̀ … èyí tí ó fi ṣe ojúrere sí wa
  alternative: oore-ọ̀fẹ́ rẹ̀ … èyí tí ó fi fi oore-ọ̀fẹ́ fún wa
  rationale: Àṣàyàn náà mú ìtumọ̀ iṣẹ́ ojúrere Ọlọ́run jáde ní Yorùbá tó rọrùn. Àlàyé ìsàlẹ̀ ojú ewé sọ ìbátan ọ̀rọ̀ méjèèjì nínú Gíríìkì, èyí tí kò rọrùn láti ṣe ní Yorùbá láìsọ ọ̀rọ̀ di líle tàbí àjèjì.
- issue: Agbára oyè Kristi nínú τῷ ἠγαπημένῳ
  choice: Olùfẹ́ náà
  alternative: Ọmọ rẹ̀ olùfẹ́
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Kristi ni oyè náà ń tọ́ka sí, ṣùgbọ́n Gíríìkì kò lo “Ọmọ” ní ẹsẹ yìí. Nítorí náà, a pa oyè náà mọ́, a sì ṣàlàyé ẹni tí ó ń tọ́ka sí nínú àlàyé ìsàlẹ̀ ojú ewé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ apá kan nínú gbólóhùn gígùn ti Efesu 1:3–14, nítorí náà a fi àmì kọ́mà sí òpin. “Olùfẹ́ náà” jẹ́ oyè tó mọ́gbọ́n dání, bí ó tilẹ̀ jẹ́ pé ó nílò àlàyé ìsàlẹ̀ ojú ewé fún àwọn òǹkàwé kan.
