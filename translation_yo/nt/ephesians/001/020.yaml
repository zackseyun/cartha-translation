  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: yo
  text: èyí tí ó fi agbára náà ṣiṣẹ́ nínú Mèsáyà[a] nígbà tí ó jí i dìde kúrò láàárín àwọn òkú, tí ó sì mú un jókòó ní ọwọ́ ọ̀tún rẹ̀ ní àwọn ibi ọ̀run[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ní àwọn agbègbè ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò ìbátan yìí tọ́ka sẹ́yìn sí agbára tàbí iṣẹ́ agbára tí ẹsẹ tó ṣáájú mẹ́nu kàn; ‘èyí tí’ pa ìsopọ̀ gbólóhùn náà mọ́.
- source_word: ἐνήργηκεν
  choice: ó mú ṣiṣẹ́
  rationale: Ó sọ nípa mímú agbára ṣiṣẹ́ lọ́nà tó ní èso, kì í ṣe iṣẹ́ tàbí ìsapá lásán.
- source_word: ἐν τῷ Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ní àyíká ọ̀rọ̀ yìí; ‘Mèsáyà’ mú ìtumọ̀ ẹni tí a fòróró yàn hàn, ‘nínú’ sì pa ἐν mọ́.
- source_word: ἐγείρας αὐτὸν
  choice: nígbà tí ó jí i dìde
  rationale: Èyí sọ participle aorist náà di èdè Yorùbá àdánidá, ó sì fi ìbáṣepọ̀ àkókò hàn láìfi dandan pinnu pé àkókò nìkan ni participle náà túmọ̀ sí.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó pa àwùjọ-orúkọ púpọ̀ νεκρῶν àti èrò jíjí ẹni náà jáde láàárín àwọn òkú mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: καθίσας
  choice: tí ó sì mú un jókòó
  rationale: Ìtumọ̀ causative yìí bá ìṣe Ọlọ́run mu, ó sì so ìgbéga náà pọ̀ mọ́ jíjí dìde.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: ní apá ọ̀tún rẹ̀
  rationale: ‘Ní apá ọ̀tún’ ni àdánidá Yorùbá fún ipò lẹ́gbẹ̀ẹ́ ọwọ́ ọ̀tún; ó yẹra fún ìtumọ̀ pé ó jókòó nínú ọwọ́ gan-an.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ní àwọn agbègbè ọ̀run
  rationale: Àpólà náà ń tọ́ka sí ayé tàbí agbègbè ti ọ̀run. ‘Àwọn agbègbè ọ̀run’ jẹ́ kíkà tó mọ́gbọ́n dání, ó sì ṣàfihàn ẹ̀yà púpọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ gẹ́gẹ́ bí oyè tàbí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbi yìí, ọ̀rọ̀ náà lè ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn. A fi àṣàyàn ìbílẹ̀ ‘Kristi’ sínú àlàyé ìsàlẹ̀ kí ìtumọ̀ méjèèjì lè hàn.
- issue: Ìtumọ̀ ἐν τοῖς ἐπουρανίοις
  choice: ní àwọn agbègbè ọ̀run
  alternative: ní àwọn ibi ọ̀run
  rationale: ‘Àwọn agbègbè ọ̀run’ fi sphere ọ̀run hàn lọ́nà àdánidá; ‘àwọn ibi ọ̀run’ pa ìtumọ̀ locative tó tààrà sí i mọ́ gẹ́gẹ́ bí àṣàyàn.
- issue: Iṣẹ́ participle ἐγείρας
  choice: nígbà tí ó jí i dìde
  alternative: nípa jíjí i dìde
  rationale: Participle náà lè fi àkókò, ọ̀nà, tàbí ìṣe tó bá ọ̀rọ̀-ìṣe pàtàkì rìn hàn. Àṣàyàn àkókò jẹ́ àdánidá, ṣùgbọ́n a kò gbìmọ̀ sọ pé ìtumọ̀ ohun èlò kò ṣeé ṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo ‘mú un jókòó’ àti ‘ní apá ọ̀tún’ fún ìṣàn Yorùbá àdánidá, a sì fi àmì ohùn síbi tí ó yẹ. Kọ́mà ìparí fi hàn pé ẹsẹ yìí jẹ́ apá kan nínú gbólóhùn gígùn tó ń bá a lọ.
