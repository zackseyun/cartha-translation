  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: yo
  text: Ó sọ àṣírí ìfẹ́-inú rẹ̀ di mímọ̀ fún wa, gẹ́gẹ́ bí ìfẹ́-inú rere rẹ̀, èyí tí ó pinnu nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi”; àwọn kan lóye “nínú rẹ̀” gẹ́gẹ́ bí “nínú ara rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: γνωρίσας
  choice: Ó sọ ... di mímọ̀
  rationale: Ọ̀rọ̀ náà jẹ́ participle aorist tí ó ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùṣe. Èdè Yorùbá àdánidá lè fi gbolohun-ìṣe hàn kedere níbí láìsọ ìtumọ̀ rẹ̀ di ‘ṣípayá’ nìkan.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dative náà jẹ́ ẹni tí a sọ ohun náà di mímọ̀ fún; ‘fún wa’ ni ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: μυστήριον
  choice: àṣírí
  rationale: ‘Àṣírí’ túmọ̀ sí ohun tí a fi pamọ́ ṣùgbọ́n tí a lè sọ di mímọ̀; èyí bá ìlò Páùlù mu, kì í ṣe ohun tí kò ṣeé mọ̀ láéláé.
- source_word: θελήματος
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ níbí ni ìfẹ́-inú tàbí ohun tí Ọlọ́run fẹ́, kì í ṣe ìfẹ́ni. Ó yàtọ̀ sí ‘pinnu’ tí a lò fún προέθετο.
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: gẹ́gẹ́ bí inú dídùn rẹ̀
  rationale: Gbólóhùn yìí pa ìtumọ̀ ìdùnnú àti ìfẹ́-inú rere mọ́, ó sì fi κατά hàn gẹ́gẹ́ bí ohun tí ìṣe náà bá mu.
- source_word: προέθετο
  choice: pinnu
  rationale: ‘Pinnu’ sọ èrò tàbí ìdí tí ẹni náà fi lélẹ̀ nínú ara rẹ̀, láìfi èrò ìfihàn ní gbangba kún un.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́ láìyan Kristi tàbí Ọlọ́run fún òǹkàwé; àlàyé ìsàlẹ̀ ṣàkọsílẹ̀ àwọn ọ̀nà méjèèjì.
theological_decisions:
- issue: Ẹni tí ἐν αὐτῷ ń tọ́ka sí
  choice: nínú rẹ̀
  alternative: nínú Kristi; tàbí nínú ara rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà lo arọ́pò-orúkọ tí ó lè tọ́ka sí Kristi nínú àyíká ọ̀rọ̀, ṣùgbọ́n àwọn kan lóye rẹ̀ ní ìtumọ̀ reflexive pé Ọlọ́run pinnu rẹ̀ ‘nínú ara rẹ̀.’ A kò yanjú àìdánilójú náà nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní, àti àmì ohùn ní gbogbo ibi tí ó yẹ. ‘Inú dídùn’ jẹ́ ọ̀rọ̀ ọlọ́lá tí ó pa ìtumọ̀ εὐδοκία mọ́; ‘àṣírí’ sì yẹra fún èrò pé ohun náà kò ṣeé mọ̀.
