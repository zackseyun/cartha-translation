  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìbáṣepọ̀ pàtàkì gbolohun Gíríìkì náà mọ́: Ọlọ́run sọ àṣírí kan di mímọ̀ fún wa, ó sì ṣe bẹ́ẹ̀ ní ìbámu pẹ̀lú εὐδοκία rẹ̀. Síbẹ̀, “ìfẹ́” láìsí “inú” lè túmọ̀ sí ìfẹ́ni/love ní Yorùbá, níbi tí θέλημα ti túmọ̀ sí ìfẹ́-inú tàbí ìfẹ́ ẹni. Bákan náà, “inú dídùn” kì í ṣe ìbámu tó pé pẹ̀lú εὐδοκία nínú àyíká ète Ọlọ́run; ó lè jẹ́ ìmọ̀lára ayọ̀ dípò ìfẹ́-inú rere tàbí ìpinnu rere.'
  naturalness: “Ó sọ ... di mímọ̀ fún wa” jẹ́ Yorùbá adayeba, ó sì ṣàlàyé participle γνωρίσας ní ọ̀nà tí gbolohun Yorùbá lè gbà. “Gẹ́gẹ́ bí ìfẹ́-inú rere rẹ̀” jẹ́ ìfarahàn Yorùbá tó mọ́gbọ́n dání ju “gẹ́gẹ́ bí inú dídùn rẹ̀” lọ nínú ìforúkọsílẹ̀ ìjọsìn/ìwé mímọ́.
  terminology: A tún un ṣe sí “àṣírí ìfẹ́-inú rẹ̀” fún τὸ μυστήριον τοῦ θελήματος αὐτοῦ, kí ó má bàa dà bí “àṣírí ìfẹ́ni rẹ̀.” “Ìfẹ́-inú rere” fún εὐδοκία pa ìtumọ̀ ìfẹ́ rere àti ìpinnu aláánú mọ́. “Nínú rẹ̀” ni a pa mọ́ fún ἐν αὐτῷ, nítorí ọrọ̀ orísun fi arọ́pò-orúkọ sílẹ̀ láìsọ ẹni tí ó ń tọ́ka sí ní tààrà.
