id: EPH.1.13
reference: Ephesians 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: yo
  text: Nínú rẹ̀[a] ni ẹ̀yin pẹ̀lú, lẹ́yìn tí ẹ gbọ́ ọ̀rọ̀ òtítọ́, ìhìn rere ìgbàlà yín[b]; nínú rẹ̀ ni[d], lẹ́yìn tí ẹ sì gbàgbọ́, a fi Ẹ̀mí Mímọ́ ìlérí[c] dì yín lédìdì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nínú ẹni náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìhìn rere nípa ìgbàlà yín.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ẹ̀mí Mímọ́ tí Ọlọ́run ṣèlérí.”
    reason: alternative_reading
  - marker: d
    text: Tàbí, “lẹ́yìn tí ẹ sì gbà á gbọ́.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka sí Kristi nínú ọ̀rọ̀ tó ṣáájú. “Nínú rẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa èrò Pọ́ọ̀lù nípa wíwà nínú Kristi mọ́.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin pẹ̀lú
  rationale: Èyí pa ìtẹnumọ́ pé àwọn olùgbọ́ náà tún wà lára àwọn tí Ọlọ́run ṣe oore fún mọ́.
- source_word: ἀκούσαντες
  choice: lẹ́yìn tí ẹ gbọ́
  rationale: Ó fi hàn pé gbígbọ́ ọ̀rọ̀ náà ṣáájú èdìdì, láì sọ ìlànà ẹ̀kọ́ ìgbàlà kan ní pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: ọ̀rọ̀ òtítọ́
  rationale: Ó sún mọ́ ìtumọ̀ λόγος, ó sì jẹ́ gbólóhùn tí Yorùbá òde òní lè lóye.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: ìhìn rere ìgbàlà yín
  rationale: “Ìhìn rere” tú εὐαγγέλιον ní kedere, nígbà tí “ìgbàlà yín” pa ìbáṣepọ̀ genitive inú orísun mọ́.
- source_word: πιστεύσαντες
  choice: lẹ́yìn tí ẹ sì gbàgbọ́
  rationale: Ìtumọ̀ yìí pa ìtẹ̀lé àwọn ìṣe mọ́, ṣùgbọ́n kò fi dandan sọ pé àkókò tó yà wọ́n síra pọ̀ tó.
- source_word: ἐσφραγίσθητε
  choice: a ... ṣe èdìdì sí yín
  rationale: Ìṣètò aláìlórúkọ yìí mú passive Gíríìkì jáde, ó sì pa àwòrán èdìdì gẹ́gẹ́ bí àmì ìní, ìfọwọ́sí tàbí ààbò mọ́.
- source_word: τῷ πνεύματι ... τῷ ἁγίῳ
  choice: a fi Ẹ̀mí Mímọ́ ... ṣe èdìdì sí yín
  rationale: “A fi ...” mú dative ohun èlò jáde lọ́nà Yorùbá tó ṣe déédéé, láì sẹ́ àǹfààní àwọn ìtumọ̀ míì.
- source_word: τῆς ἐπαγγελίας
  choice: ìlérí
  rationale: “Ẹ̀mí Mímọ́ ìlérí” pa ìṣọ̀kan genitive tó há nínú Gíríìkì mọ́; àlàyé tó ṣe kedere sí i wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ gbígbọ́, gbígbàgbọ́ àti fífi èdìdì síni
  choice: A tú àwọn participle náà sí “lẹ́yìn tí” láti fi ìtẹ̀lé hàn.
  alternative: “Nígbà tí ẹ gbọ́ ... nígbà tí ẹ gbàgbọ́” lè fi àwọn ìṣe náà hàn gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ papọ̀ pẹ́kípẹ́kí.
  rationale: Àwọn aorist participle tó ṣáájú ọ̀rọ̀-ìṣe pàtàkì sábà máa ń tọ́ka sí ohun tó ṣáájú rẹ̀, ṣùgbọ́n ẹsẹ náà kò sọ bí àkókò tó yà wọn síra ṣe gùn tó.
- issue: Ìtumọ̀ “Ẹ̀mí ìlérí”
  choice: A pa ìṣọ̀kan genitive mọ́ gẹ́gẹ́ bí “Ẹ̀mí Mímọ́ ìlérí.”
  alternative: “Ẹ̀mí Mímọ́ tí Ọlọ́run ṣèlérí” tàbí “Ẹ̀mí Mímọ́ tí í ṣe àmúdájú ìlérí.”
  rationale: Gíríìkì jẹ́ kúkúrú, ó sì lè tọ́ka sí Ẹ̀mí tí a ṣèlérí tàbí Ẹ̀mí tó ní ìbáṣepọ̀ pẹ̀lú ìlérí. Àkọ́kọ́ wà nínú àlàyé ìsàlẹ̀ láì pa ìhámọ́ orísun rẹ́.
- issue: Ìtumọ̀ ἐν ᾧ kejì
  choice: A tún un ṣe gẹ́gẹ́ bí “nínú rẹ̀” láti pa èrò wíwà nínú Kristi mọ́.
  alternative: A lè so ọ́ mọ́ gbígbàgbọ́ gẹ́gẹ́ bí “lẹ́yìn tí ẹ gbà á gbọ́.”
  rationale: Ìṣètò Gíríìkì lè jẹ́ kí olùkà rí ἐν ᾧ gẹ́gẹ́ bí ibi/ipò nínú Kristi tàbí gẹ́gẹ́ bí ohun tí wọ́n gbàgbọ́ nínú rẹ̀. Àkọ́kọ́ pa àtúnṣe ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa àtúnṣe “nínú rẹ̀” àti àwòrán èdìdì mọ́, nígbà tí àwọn àlàyé ìsàlẹ̀ ń tọ́ka sí àwọn ìtumọ̀ míì tó ṣeé ṣe.
