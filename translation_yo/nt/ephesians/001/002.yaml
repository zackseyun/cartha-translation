  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà[a] wà pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè jẹ́ oyè (“Mèsáyà”), tàbí, nínú àwọn àyíká kan, ó lè ṣiṣẹ́ bí orúkọ (“Kristi”).'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ó pa ìtumọ̀ oore tí Ọlọ́run ń fi fúnni mọ́, ó sì yẹ fún ìkíni àti ìbùkún Pọ́ọ̀lù.
- source_word: ὑμῖν
  choice: pẹ̀lú yín
  rationale: Nínú ìkíni Yorùbá, gbólóhùn ‘wà pẹ̀lú yín’ ni ọ̀nà àdánidá láti sọ ìbùkún tí a ń fẹ́ fún àwọn olùgbọ́ púpọ̀.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún ìrẹ́pọ̀ àti ìfọ̀kànbalẹ̀, ó sì lè ru ìtumọ̀ ṣálómù Júù.
- source_word: ἀπὸ
  choice: láti ọ̀dọ̀
  rationale: Ó fi orísun oore-ọ̀fẹ́ àti àlàáfíà hàn ní kedere.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: 'A ka àkójọpọ̀ náà gẹ́gẹ́ bí àfikún ìdánimọ̀: Ọlọ́run, ẹni tí í ṣe Baba wa; a kò fi àsopọ̀ tí kò sí nínú Gíríìkì kún un.'
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún oyè κύριος, ó sì pa agbára oyè Kristi mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: A tú Χριστός sí oyè ‘Mèsáyà’ dípò kí a fi sílẹ̀ gẹ́gẹ́ bí orúkọ; èdè Yorùbá kò nílò atúmọ̀ ọ̀rọ̀ pàtó bí ‘the’ ti Gẹ̀ẹ́sì níbi yìí.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Χριστός lè ṣiṣẹ́ bí oyè ‘Mèsáyà’ tàbí bí ọ̀nà orúkọ ‘Kristi.’ Ọ̀rọ̀ àkọ́kọ́ pa ìtumọ̀ oyè Mèsáyà mọ́; àlàyé ìsàlẹ̀ ojú ewé sì jẹ́ kí àṣàyàn kejì hàn.
- issue: Ìbáṣepọ̀ θεοῦ πατρὸς ἡμῶν
  choice: Ọlọ́run Baba wa
  alternative: Ọlọ́run wa àti Baba wa
  rationale: Àkọsílẹ̀ Gíríìkì kò ní ‘àti’ láàárín Ọlọ́run àti Baba; ìtumọ̀ àfikún ìdánimọ̀ ni ó ṣeé ṣe jù.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A yí ìkíni orúkọ-ìṣe Gíríìkì sí àdúrà ìbùkún Yorùbá ‘Kí ... wà pẹ̀lú yín’ láti jẹ́ àdánidá láì yí ìtumọ̀ orísun padà. Àmì [a] àti [b] wà lẹ́yìn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
