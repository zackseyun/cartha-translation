id: EPH.1.3
reference: Ephesians 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: yo
  text: Ìyìn ni fún Ọlọ́run àti Baba Olúwa wa Jésù Mèsáyà[c], ẹni tí ó ti fi gbogbo ìbùkún tẹ̀mí[a] bù kún wa ní àwọn agbègbè ọ̀run[b] nínú Mèsáyà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “gbogbo ìbùkún ti Ẹ̀mí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “tẹ̀mí” ní gbogbogbò tàbí ohun tó jẹ mọ́ Ẹ̀mí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ní àwọn ibi ọ̀run.”
    reason: lexical_alternative
  - marker: c
    text: Ìtumọ̀ àṣà ni “Jésù Kristi” àti “nínú Kristi.” Níhìn-ín, a túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” kí ìtumọ̀ oyè náà lè hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Olùbùkún ni
  rationale: Ó mú ọ̀rọ̀ ìyìn àti ìbùkún tí a ń fi fún Ọlọ́run jáde ní ọ̀nà Yorùbá tó bójú mu, ó sì pa ìbátan rẹ̀ mọ́ pẹ̀lú ọ̀rọ̀ εὐλογήσας tó tẹ̀ lé e.
- source_word: θεὸς καὶ πατὴρ
  choice: Ọlọ́run àti Baba
  rationale: Ó pa àwọn orúkọ méjèèjì mọ́ gẹ́gẹ́ bí èdè Gíríìkì ṣe so wọ́n pọ̀, láì sọ ìtumọ̀ ìbátan náà di ohun mìíràn.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ọ̀rọ̀ Yorùbá tó yẹ fún κύριος gẹ́gẹ́ bí oyè Kristi níhìn-ín.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Jésù” jẹ́ àkọsílẹ̀ orúkọ náà ní Yorùbá; “Mèsáyà” sì túmọ̀ oyè Χριστός dípò kí a kàn ṣe àkọsílẹ̀ ohùn rẹ̀.
- source_word: ὁ εὐλογήσας
  choice: ẹni tí ó ti ... bù kún
  rationale: Ó fi iṣẹ́ tí Ọlọ́run ti ṣe, tí èso rẹ̀ sì wà fún wa, hàn ní èdè Yorùbá àdánidá.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: fi gbogbo ìbùkún tẹ̀mí ... bù kún
  rationale: “Fi ... bù kún” jẹ́ ìṣètò ọ̀rọ̀ Yorùbá àdánidá; “gbogbo” pa ìkúnrẹ́rẹ́ πάσῃ mọ́, “tẹ̀mí” sì fi ààyè sílẹ̀ fún ìtumọ̀ gbogbogbò àti ìtọ́ka sí Ẹ̀mí.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ní àwọn agbègbè ọ̀run
  rationale: Ó sọ ibi tàbí àyíká ọ̀run tí ọ̀rọ̀ Gíríìkì olókìkí nínú Éfésù ń tọ́ka sí ní ọ̀nà tí òǹkàwé òde òní lè lóye.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́ ní ṣókí, láì tú ìṣọ̀kan tàbí ìbáṣepọ̀ tí “nínú” lè túmọ̀ sí sí ọ̀nà kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú àwọn gbólóhùn Pọ́ọ̀lù
  choice: Mèsáyà nínú “Jésù Mèsáyà” àti “nínú Mèsáyà”
  alternative: Kristi nínú “Jésù Kristi” àti “nínú Kristi”
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró, ìyẹn Mèsáyà. Ìtumọ̀ oyè náà ni a mú wá sí ojú ọ̀rọ̀, nígbà tí àṣà ìtumọ̀ “Kristi” wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ πνευματικῇ
  choice: tẹ̀mí
  alternative: ti Ẹ̀mí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ohun tó jẹ́ ti ẹ̀mí ní gbogbogbò tàbí ohun tó jẹ mọ́ Ẹ̀mí Mímọ́. Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú yìí mọ́; àlàyé ìsàlẹ̀ sì fi ìtumọ̀ pàtó kejì hàn.
- issue: Agbára ìtumọ̀ ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nípasẹ̀ Mèsáyà
  rationale: “Nínú” pa ìtumọ̀ gbígbòòrò àti ìfẹ̀sẹ̀mulẹ̀ ọ̀rọ̀ Gíríìkì mọ́, dípò kí a dín un kù sí ohun èlò tàbí ọ̀nà nìkan.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti ti ìjọsìn, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “Olùbùkún ni” gẹ́gẹ́ bí ọ̀rọ̀ ìyìn, a sì lo ìṣètò àdánidá “fi ... bù kún” fún iṣẹ́ Ọlọ́run. Gbólóhùn náà pa ìtẹ̀síwájú àti ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ Gíríìkì mọ́ láì jẹ́ kó ṣòro fún òǹkàwé òde òní.
