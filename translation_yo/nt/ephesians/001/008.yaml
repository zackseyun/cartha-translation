translation:
  language: yo
  text: èyí tí ó ṣe lọ́pọ̀lọpọ̀ fún wa nínú gbogbo ọgbọ́n àti òye.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí ó mú kí ó pọ̀ yọ̀ sí ọ̀dọ̀ wa.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “nínú gbogbo ọgbọ́n àti òye,” lè ṣàpèjúwe yálà ọ̀nà tí Ọlọ́run gbà ṣe oore-ọ̀fẹ́ rẹ̀ lọ́pọ̀lọpọ̀ fún wa, tàbí ọgbọ́n àti òye tó ní í ṣe pẹ̀lú ohun tí ó fi fún àwọn onígbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí oore-ọ̀fẹ́ tí ẹsẹ ṣáájú mẹ́nu kàn; “èyí tí” so gbólóhùn náà mọ́ ọn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐπερίσσευσεν
  choice: ó mú kí ó pọ̀ sí i
  rationale: 'Ìṣe náà ní ìtumọ̀ ìmú-nǹkan-pọ̀: Ọlọ́run mú kí oore-ọ̀fẹ́ rẹ̀ pọ̀ lọ́pọ̀lọpọ̀. Àṣàyàn yìí pa àwòrán ọ̀pọ̀ yanturu mọ́ láìfi ohun tí kò sí nínú Gíríìkì kún un.'
- source_word: εἰς ἡμᾶς
  choice: fún wa
  rationale: Ó fi hàn pé ọ̀pọ̀ oore-ọ̀fẹ́ náà darí sí wa gẹ́gẹ́ bí olùgbà; “fún wa” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: nínú gbogbo ọgbọ́n àti òye
  rationale: “Nínú” tẹ̀lé ìrísí Gíríìkì, ó sì jẹ́ kí ìbáṣepọ̀ gbólóhùn náà wà ní ṣíṣí. “Ọgbọ́n” àti “òye” ṣe ìyàtọ̀ tó ṣeé lóye láàárín σοφία àti φρόνησις.
theological_decisions:
- issue: Ohun tí “nínú gbogbo ọgbọ́n àti òye” ń ṣàpèjúwe
  choice: A fi gbólóhùn náà sílẹ̀ láìsọ pàtó bóyá ó ṣàpèjúwe ọ̀nà tí Ọlọ́run gbà mú oore-ọ̀fẹ́ pọ̀ fún wa tàbí ọgbọ́n àti òye tí àwọn onígbàgbọ́ rí gbà.
  alternative: A lè so ó mọ́ ọgbọ́n àti òye Ọlọ́run nínú fífúnni ní oore-ọ̀fẹ́, tàbí mọ́ ọgbọ́n àti òye tí a fi fún àwọn onígbàgbọ́.
  rationale: Ìṣètò Gíríìkì gba ìtumọ̀ méjèèjì láàyè; ìtumọ̀ náà kò gbọ́dọ̀ yanjú àìdánilójú tòótọ́ yìí láìní ẹ̀rí tó tó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti èdè ọlọ́lá tó ṣeé lóye. A lo “ó mú kí ó pọ̀ sí i” dípò àsọyé aláwòrán tó lè ṣókùnkùn, kí ìtumọ̀ causative ἐπερίσσευσεν lè hàn gbangba.
