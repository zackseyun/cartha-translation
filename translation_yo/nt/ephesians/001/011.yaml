id: EPH.1.11
reference: Ephesians 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: yo
  text: Nínú rẹ̀ náà ni a ti sọ wá di ogún[a], níwọ̀n bí a ti yàn wá tẹ́lẹ̀ ní ìbámu pẹ̀lú ète ẹni tí ń mú ohun gbogbo ṣẹ gẹ́gẹ́ bí ìpinnu ìfẹ́ rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú rẹ̀ náà ni a ti gba ogún.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí pé a gba ogún tàbí pé a sọ wá di ogún, ìyẹn, ohun ìní tí a pín fún Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka sí Mèsáyà nínú àyíká ọ̀rọ̀ tó ṣáájú; gbólóhùn yìí sì pa ìtumọ̀ ìrẹ́pọ̀ pẹ̀lú rẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: ἐκληρώθημεν
  choice: a ti fi wá ṣe ogún
  rationale: Ìṣe aláìṣe ti κληρόω lè túmọ̀ sí pé a sọ àwọn onígbàgbọ́ di ogún tàbí ohun ìní tí a pín fún Ọlọ́run. Àṣàyàn yìí bá ìrísí aláìṣe àti àwòrán àwọn ènìyàn Ọlọ́run gẹ́gẹ́ bí ogún rẹ̀ mu; a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: προορισθέντες
  choice: a ti yàn wá tẹ́lẹ̀
  rationale: Èyí sọ ìpinnu ṣáájú di Yorùbá tó ṣe kedere láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ náà.
- source_word: κατὰ πρόθεσιν
  choice: ní ìbámu pẹ̀lú ète
  rationale: Ète fi ìrònú àti èrò tí a pinnu láti mú ṣẹ hàn, ó sì bá πρόθεσις mu ní àyíká yìí.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: ẹni tí ń mú ohun gbogbo ṣẹ
  rationale: Gbólóhùn yìí fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tó ń gbé ìṣe náà ṣe, ó sì sọ agbára ἐνεργέω ní Yorùbá àdánidá.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Èyí pa ìwọ̀n gbígbòòrò ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: κατὰ τὴν βουλὴν
  choice: gẹ́gẹ́ bí ìpinnu
  rationale: Ìpinnu fi ìrònú tí ó yọrí sí ìdájọ́ tàbí èrò tí a pinnu mú ṣẹ hàn, láìsọ βουλή di ìmọ̀ràn tí ẹlòmíràn fún Ọlọ́run.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: ìfẹ́ rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe tààrà fún θέλημα, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú βουλή mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐκληρώθημεν
  choice: A sọ àwọn onígbàgbọ́ di ogún tàbí ènìyàn tí a pín sí Ọlọ́run.
  alternative: Àwọn onígbàgbọ́ gba ogún kan.
  rationale: Ìṣe Gíríìkì náà lè gba ìtumọ̀ méjèèjì. Ìrísí aláìṣe rẹ̀ àti àwòrán Májẹ̀mú Láéláé nípa àwọn ènìyàn Ọlọ́run gẹ́gẹ́ bí ogún rẹ̀ ṣe àtìlẹ́yìn fún àṣàyàn inú ẹsẹ̀; ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Fi wá ṣe ogún” pa àwòrán ogún mọ́ ní ọ̀nà tí olùkà Yorùbá lè lóye, “ní ìbámu pẹ̀lú” sì jẹ́ àdánidá fún κατὰ láìsọ ìtumọ̀ rẹ̀ di líle jù.
