  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ètò gírámà àti ìtumọ̀ Gíríìkì náà dáadáa: ìṣọ̀kan nínú Kristi, ìpinnu ṣáájú, ète Ọlọ́run, àti iṣẹ́ rẹ̀ lórí ohun gbogbo wà níbẹ̀. Bí ó ti wù kí ó rí, “a ti fi wá ṣe ogún” kì í wọ́pọ̀ tó, ó sì lè dà bí ẹni pé ‘wá’ jẹ́ irinṣẹ́. “A ti sọ wá di ogún” sọ ìtumọ̀ passive ti ἐκληρώθημεν ní kedere, láìpa ìtumọ̀ mìíràn rẹ̀ mọ́.'
