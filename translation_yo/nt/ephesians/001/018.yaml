id: EPH.1.18
reference: Ephesians 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: yo
  text: kí ojú ọkàn yín lè ti ní ìmọ́lẹ̀, kí ẹ lè mọ ohun tí ìrètí ìpè rẹ̀ jẹ́, àti bí ọ̀rọ̀ ògo ogún rẹ̀ láàárín àwọn ẹni mímọ́ ti pọ̀ tó,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ọ̀rọ̀ ògo ogún rẹ̀ nínú àwọn ẹni mímọ́ ti pọ̀ tó.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: lè ti ní ìmọ́lẹ̀
  rationale: 'Ó pa ohùn àìṣe àti ìtumọ̀ perfect mọ́: ìmọ́lẹ̀ ti dé, àbájáde rẹ̀ sì ń bá a lọ. A lo ‘lè’ nítorí participle náà wà lábẹ́ àdúrà tí ó bẹ̀rẹ̀ ní ẹsẹ̀ 17.'
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: ojú ọkàn yín
  rationale: Ó pa àwòrán ‘ojú ọkàn’ mọ́ dípò yíyí i sí ‘òye’ tàbí ‘èrò,’ ó sì jẹ́ gbólóhùn Yorùbá tó ṣeé lóye.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: kí ẹ lè mọ
  rationale: Ó fi ète infinitive náà hàn ní Yorùbá àdánidá.
- source_word: ἐλπὶς
  choice: ìrètí
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìfojúsọ́nà pẹ̀lú ìgbẹ́kẹ̀lé.
- source_word: κλήσεως αὐτοῦ
  choice: ìpè rẹ̀
  rationale: Ó pa genitive náà mọ́ láì ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: πλοῦτος τῆς δόξης
  choice: bí ògo ... ti pọ̀ tó
  rationale: Gbólóhùn Yorùbá àdánidá fún ọ̀pọ̀lọpọ̀ tàbí ọ̀rọ̀ ògo, nígbà tí ó ṣì pa ìtumọ̀ abundance mọ́.
- source_word: κληρονομίας αὐτοῦ
  choice: ogún rẹ̀
  rationale: 'Ó pa àìdánilójú genitive mọ́: ó lè jẹ́ ogún tí ó jẹ́ tirẹ̀ tàbí èyí tí ó ń fúnni.'
- source_word: ἐν τοῖς ἁγίοις
  choice: láàárín àwọn ẹni mímọ́
  rationale: ‘Láàárín’ jẹ́ àdánidá fún ìtumọ̀ ẹgbẹ́ ènìyàn; ‘àwọn ẹni mímọ́’ pa èrò οἱ ἅγιοι mọ́.
theological_decisions:
- issue: Bóyá ‘ogún rẹ̀ láàárín/nínú àwọn ẹni mímọ́’ túmọ̀ sí pé àwọn ènìyàn Ọlọ́run ni ogún tirẹ̀, tàbí pé òun ni ó fún wọn ní ogún
  choice: ogún rẹ̀ láàárín àwọn ẹni mímọ́
  alternative: ogún rẹ̀ nínú àwọn ẹni mímọ́; ogún tí ó fún àwọn ẹni mímọ́
  rationale: Gíríìkì kò yanjú ipa genitive àti ἐν pátápátá. Ọ̀rọ̀ àkọ́kọ́ pa ìṣòro ìtumọ̀ náà mọ́ láì fi ẹ̀kọ́ ìjọ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì pa àwòrán ‘ojú ọkàn’ àti àìdánilójú ẹ̀kọ́ inú ọ̀rọ̀ Gíríìkì mọ́. A ka ẹsẹ̀ náà gẹ́gẹ́ bí ìtẹ̀síwájú àdúrà inú ẹsẹ̀ 17, nítorí náà a lo ‘kí ... lè.’
