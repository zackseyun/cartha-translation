  source_fidelity: Ìtumọ̀ náà pa àwòrán ‘ojú ọkàn,’ ète ‘kí ẹ lè mọ̀,’ ìrètí ìpè rẹ̀, àti ìtumọ̀ tí kò fipá yan ẹgbẹ́ kan nínú ‘ogún rẹ̀ ... àwọn ẹni mímọ́’ mọ́. Ṣùgbọ́n ọ̀rọ̀ àkọ́kọ́ ‘bí ògo ... ti pọ̀ tó’ fi πλοῦτος (‘ọ̀rọ̀/ìní púpọ̀, ọrọ̀’) sílẹ̀; ‘ògo’ nìkan kò túmọ̀ πλοῦτος τῆς δόξης.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti ka. ‘Ọ̀rọ̀ ògo’ jẹ́ ọ̀nà tó bójú mu nínú ìforúkọsílẹ̀ Bíbélì fún ‘ìní/ọrọ̀ ògo’; ó dára ju yíyí èrò náà sí ògo nìkan lọ.
  terminology: ‘Ojú ọkàn,’ ‘ìrètí,’ ‘ìpè,’ ‘ogún,’ àti ‘àwọn ẹni mímọ́’ yẹ fún ìforúkọsílẹ̀ náà. A fi ‘láàárín’ sí ọ̀rọ̀ àkọ́kọ́, a sì pa aṣàyàn ‘nínú’ mọ́ nínú àlàyé-ẹsẹ̀, láì yan ìtumọ̀ ẹ̀kọ́ kan fún genitive náà.
  issues:
  - severity: medium
    issue: πλοῦτος kò hàn nínú ọ̀rọ̀ àkọ́kọ́.
    rationale: ‘Bí ògo ogún rẹ̀ ... ti pọ̀ tó’ ń sọ ìpọ̀ ògo, ṣùgbọ́n Gíríìkì náà sọ ‘ọ̀rọ̀/ìní púpọ̀ ti ògo.’ Fífi ‘ọ̀rọ̀ ògo’ sí i mú ìtumọ̀ náà péye.
  - severity: low
    issue: Àlàyé-ẹsẹ̀ àkọ́kọ́ ń pèsè ìtumọ̀ πλοῦτος tí ó yẹ kí ó wà nínú ọ̀rọ̀ àkọ́kọ́.
    rationale: Níwọ̀n bí πλοῦτος jẹ́ apá ìpilẹ̀ṣẹ̀ ọ̀rọ̀ náà, kò yẹ kí a dín in kù sí àṣàyàn ìtúmọ̀ nínú àlàyé-ẹsẹ̀.
