id: EPH.1.14
reference: Ephesians 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: yo
  text: ẹni tí í ṣe ìdógò ogún wa, sí ìràpadà ohun ìní, fún ìyìn ògo rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí Ẹ̀mí Mímọ́ nínú ẹsẹ tó ṣáájú; lílo ‘ẹni tí’ bá jíjẹ́ ẹni mu, ó sì tẹ̀ lé akọ-abo gírámà Gíríìkì láì sọ ohun tí ọ̀rọ̀ náà kò sọ.
- source_word: ἀρραβών
  choice: ẹ̀rí ìdánilójú
  rationale: Ó túmọ̀ sí ohun tí a fi ń mú ìlérí tàbí ìsanwó ọjọ́ iwájú dájú. ‘Ẹ̀rí ìdánilójú’ jẹ́ èdè Yorùbá àdánidá, ó sì mú iṣẹ́ ọ̀rọ̀ náà hàn ju ìtumọ̀ líle ti ‘owó ìdógò’ lọ ní àyíká ogún.
- source_word: κληρονομίας
  choice: ogún
  rationale: ‘Ogún’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ohun tí ẹni yóò jogún, ó sì dá èrò ìní tí Ọlọ́run ṣèlérí dúró.
- source_word: εἰς ἀπολύτρωσιν
  choice: títí di ìràpadà
  rationale: εἰς níbí lè tọ́ka sí ìfojúsùn tàbí àkókò tí ìdánilójú náà ń dúró de. ‘Títí di’ jẹ́ ti àdánidá, ó sì bá ipa ìdìdì Ẹ̀mí nínú ẹsẹ 13 mu.
- source_word: τῆς περιποιήσεως
  choice: ohun ìní náà
  rationale: περιποίησις lè túmọ̀ sí ohun tí a ní tàbí ohun tí a ti jèrè. ‘Ohun ìní náà’ pa àìdánilójú mọ́ nípa ẹni tí ó ni í, dípò fífi ‘àwọn ènìyàn Ọlọ́run’ kún un.
- source_word: εἰς ἔπαινον τῆς δόξης αὐτοῦ
  choice: fún ìyìn ògo rẹ̀
  rationale: Ìtumọ̀ yìí fi ète hàn ní Yorùbá tó rọrùn, ó sì pa ìsọ̀rọ̀ Gíríìkì ‘ìyìn ògo rẹ̀’ mọ́.
theological_decisions:
- issue: Ta ni ὅ ń tọ́ka sí?
  choice: ‘ẹni tí’ ń tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni
  alternative: ‘èyí tí’ tàbí ‘ohun tí’
  rationale: Ohun tó sún mọ́ ọn jù lọ nínú 1:13 ni ‘Ẹ̀mí Mímọ́ ti ìlérí’; ìtọ́ka ẹni bá ọ̀rọ̀ inú ẹsẹ náà mu láì gbé ẹ̀kọ́ àdámọ̀ mìíràn wọlé.
- issue: Ìtumọ̀ τῆς περιποιήσεως
  choice: ohun ìní náà
  alternative: àwọn ènìyàn tí Ọlọ́run ní / ohun tí a ti jèrè
  rationale: Àpólà Gíríìkì náà kò sọ ẹni tí ó ni ohun ìní náà ní tààrà. Ìtumọ̀ yìí pa ìfojú méjì náà mọ́, kò sì yan ìtumọ̀ ẹ̀kọ́ kan ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A yàgò fún ọ̀rọ̀ ajé tí ‘down payment’ túmọ̀ ní líle nítorí ‘ẹ̀rí ìdánilójú’ túbọ̀ ṣàlàyé iṣẹ́ ἀρραβών ní Yorùbá òde òní.
