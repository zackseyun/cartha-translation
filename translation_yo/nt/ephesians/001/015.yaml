  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: yo
  text: Nítorí èyí, èmi náà, lẹ́yìn tí mo gbọ́ nípa ìgbàgbọ́ yín[a] nínú Olúwa Jésù àti ìfẹ́ yín sí[b] gbogbo àwọn ẹni mímọ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìgbàgbọ́” tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé”; ní àwọn àyíká kan, πίστις tún lè ní ìtumọ̀ “ìdúróṣinṣin.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “ìfẹ́ tí ẹ ní sí gbogbo àwọn ẹni mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó tọ́ka sẹ́yìn sí ìbùkún tí a ṣẹ̀ṣẹ̀ sọ, ó sì fi ìdí ìdáhùn Paulu múlẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: κἀγώ
  choice: èmi pẹ̀lú
  rationale: Ó pa ìtumọ̀ àfikún καί + ἐγώ mọ́, láìfi ìtẹnumọ́ tí ó pọ̀ jù kún un.
- source_word: ἀκούσας
  choice: nígbà tí mo gbọ́ nípa
  rationale: Gbólóhùn àkókò yìí mú ipa participle aorist náà jáde ní Yorùbá àdánidá, ó sì bá ohun tí a gbọ́ nípa rẹ̀ mu.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: ìgbàgbọ́ yín
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìgbàgbọ́ tí ó jẹ́ ti àwọn olùkàwé; èyí ni ọ̀nà Yorùbá tí ó ṣe kedere jù.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, πίστις ń tọ́ka ní pàtàkì sí gbígbẹ́kẹ̀lé tàbí gbígbàgbọ́ nínú Jesu, bí ó tilẹ̀ jẹ́ pé ó lè ní ìtumọ̀ ìṣòtítọ́ ní àwọn àyíká mìíràn.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: nínú Olúwa Jesu
  rationale: “Nínú” pa preposition ἐν àti àṣà ọ̀rọ̀ Paulu mọ́; “Olúwa” sì pa oyè Kristi náà mọ́.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá àti taara fún ἀγάπη.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: sí gbogbo àwọn ẹni mímọ́
  rationale: “Sí” pa ìtọ́sọ́nà εἰς mọ́, “àwọn ẹni mímọ́” sì jẹ́ kó ṣe kedere pé gbogbo àwọn onígbàgbọ́ tí a yà sọ́tọ̀ ni a ń sọ, kì í ṣe àwọn tí a fún ní ipò mímọ́ lẹ́yìn ikú nìkan.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ìbáṣepọ̀ àwọn olùkàwé pẹ̀lú Jesu
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Ohun tí ó hàn gbangba jù nínú gbólóhùn yìí ni ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé wọn nínú Olúwa Jesu. “Ìṣòtítọ́” ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ πίστις ní àwọn àyíká kan, ṣùgbọ́n kì í ṣe àṣàyàn àkọ́kọ́ níbí.
- issue: Ìtumọ̀ κύριος gẹ́gẹ́ bí oyè Jesu
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìwọ̀n ẹ̀kọ́ nípa Kristi àti lílo κύριος gẹ́gẹ́ bí oyè mọ́; “Ọ̀gá” yóò dín ìtumọ̀ náà kù.
- issue: Ìdánimọ̀ οἱ ἅγιοι
  choice: àwọn ẹni mímọ́
  alternative: àwọn ènìyàn Ọlọ́run tí ó jẹ́ mímọ́
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ tí Paulu ń lò fún àwọn onígbàgbọ́ lápapọ̀. “Àwọn ẹni mímọ́” pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú gbòǹgbò ìtumọ̀ “mímọ́,” láìgbé èrò ìyàsọ́tọ̀ àwọn ènìyàn díẹ̀ wọlé.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìjọsìn tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “Jesu” gẹ́gẹ́ bí ìkọ̀wé Yorùbá tí ó wọ́pọ̀. Àmì ìdákẹ́jẹ ní òpin fi hàn pé ẹsẹ yìí ń bá gbólóhùn tí ó ń tẹ̀ síwájú lọ.
