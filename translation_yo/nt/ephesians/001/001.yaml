id: EPH.1.1
reference: Ephesians 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: yo
  text: 'Pọ́ọ̀lù, àpọ́sítélì ti Mèsáyà Jésù[c] nípa ìfẹ́ Ọlọ́run, sí àwọn ènìyàn mímọ́ tí wọ́n wà [ní Éfésù][a], tí wọ́n sì jẹ́ olóòótọ́ nínú Mèsáyà Jésù[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ ìjímìjí kan kò ní “ní Éfésù.” Èyí ti mú kí àwọn kan lóye pé a pinnu lẹ́tà yìí fún yíyí ká láàárín ọ̀pọ̀ ìjọ, kì í ṣe fún ìjọ Éfésù nìkan.
    reason: textual_variant
  - marker: b
    text: Tàbí “àwọn onígbàgbọ́ nínú Mèsáyà Jésù.”
    reason: lexical_alternative
  - marker: c
    text: Ní èdè Gíríìkì, “Kristi Jésù” (Christos Iēsous); a túmọ̀ Χριστός sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún orúkọ Páùlù, pẹ̀lú àmì ohùn ní kíkún.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ yìí jẹ́ oyè iṣẹ́ pàtàkì nínú ìjọ àkọ́kọ́; “àpọ́sítélì” pa ìtumọ̀ ìfiṣẹ́-ránṣẹ́ àti àṣẹ Pọ́ọ̀lù mọ́ ju ọ̀rọ̀ gbogbogbò bí “oníṣẹ́” tàbí “ońṣẹ́” lọ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ti Mèsáyà Jésù
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” mú ìtumọ̀ ẹni tí a fòróró yàn hàn, “ti” sì ṣàfihàn ìbáṣepọ̀ genitive náà lọ́nà Yorùbá àdánidá.
- source_word: διὰ θελήματος θεοῦ
  choice: nípa ìfẹ́ Ọlọ́run
  rationale: Ní àkópọ̀ ọ̀rọ̀ ìfiṣẹ́ yìí, “nípa” fi hàn pé ìfẹ́ Ọlọ́run ni ìpìlẹ̀ àti ọ̀nà ìyàn Pọ́ọ̀lù, láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἁγίοις
  choice: àwọn ènìyàn mímọ́
  rationale: Gbólóhùn yìí ṣe àpèjúwe àwọn ènìyàn tí a yà sọ́tọ̀ fún Ọlọ́run, ó sì ṣe kedere sí òǹkàwé Yorùbá òde òní láìdá a sí oyè ẹlẹ́sìn kan ṣoṣo.
- source_word: τοῖς οὖσιν
  choice: tí ó wà
  rationale: Èyí tẹ̀lé iṣẹ́ participle εἰμί ní ṣókí, ó sì so àwọn olùgbà lẹ́tà mọ́ ibi tí a mẹ́nu kàn.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[ní Éfésù]'
  rationale: A pa àkámọ́ onígun mọ́ nítorí àìdánilójú ẹ̀rí àfọwọ́kọ nípa àwọn ọ̀rọ̀ wọ̀nyí.
- source_word: πιστοῖς
  choice: olóòótọ́
  rationale: “Olóòótọ́” pa ìtumọ̀ ìdúróṣinṣin àti ìgbẹ́kẹ̀lé mọ́; nítorí πιστός tún lè túmọ̀ sí “àwọn onígbàgbọ́,” a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa àwòrán ìṣọ̀kan àti ìbáṣepọ̀ tí ἐν ń sọ mọ́, “Mèsáyà” sì pa agbára oyè Χριστός mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ìkíni Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹsẹ yìí, Χριστός ṣì ní agbára oyè ẹni tí Ọlọ́run fòróró yàn; “Mèsáyà” mú èyí hàn kedere ju lílo ọ̀rọ̀ náà bí apá orúkọ lọ.
- issue: Ipò ọ̀rọ̀ ἐν Ἐφέσῳ nínú ẹ̀rí àfọwọ́kọ
  choice: A fi “ní Éfésù” sí àkámọ́ onígun nínú ẹsẹ
  alternative: Kí a má fi “ní Éfésù” sí ẹsẹ
  rationale: Àwọn àfọwọ́kọ ìjímìjí kan kò ní gbólóhùn náà. Àkámọ́ onígun àti àlàyé ìsàlẹ̀ jẹ́ kí àìdánilójú yìí hàn dípò píyanju rẹ̀ ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ πιστοῖς
  choice: olóòótọ́
  alternative: àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìṣòtítọ́ tàbí sí jíjẹ́ onígbàgbọ́. A yan “olóòótọ́” nínú ẹsẹ, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “àwọn ènìyàn mímọ́” dípò ọ̀rọ̀ tí ó lè dà bí oyè ẹgbẹ́ ẹ̀sìn kan, a sì pa àkámọ́ onígun mọ́ láti fi ìyàtọ̀ àfọwọ́kọ hàn.
