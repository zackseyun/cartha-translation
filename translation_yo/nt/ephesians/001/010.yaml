id: EPH.1.10
reference: Ephesians 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: yo
  text: fún ìṣètò ti ìjẹ́kúnrẹ́rẹ́ àwọn àkókò, láti kó ohun gbogbo jọ nínú Mèsáyà[a]—àwọn ohun tí ó wà ní àwọn ọ̀run àti àwọn ohun tí ó wà lórí ilẹ̀ ayé—nínú rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti kó ohun gbogbo jọ sábẹ́ orí kan nínú Mèsáyà”; ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ṣíṣe àkójọpọ̀ tàbí kíkó ohun gbogbo jọ sábẹ́ orí kan.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: ìṣètò rẹ̀
  rationale: “Ìṣètò” sọ èrò ìṣàkóso tàbí ètò tí a fi ń mú ète kan ṣẹ ní Yorùbá àdánidá. “Rẹ̀” tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tó ni ìṣètò náà nínú àyíká gbólóhùn, láì sọ ọ́ di “ètò” lásán.
- source_word: τοῦ πληρώματος τῶν καιρῶν
  choice: nígbà tí àwọn àkókò bá dé ẹ̀kúnrẹ́rẹ́ wọn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa èrò “ẹ̀kúnrẹ́rẹ́ àwọn àkókò” mọ́, ìyẹn pé àwọn àkókò tí a yàn ti dé ìwọ̀n kíkún wọn, láì dín un kù sí òpin lásán.
- source_word: ἀνακεφαλαιώσασθαι
  choice: láti kó ... jọ
  rationale: Ọ̀rọ̀ yìí mú èrò àkójọpọ̀ gbogbo nǹkan jáde ní èdè Yorùbá tó ṣe kedere. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ míì tó ní í ṣe pẹ̀lú kíkó wọn sábẹ́ orí kan mọ́.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: “Ohun gbogbo” jẹ́ ọ̀rọ̀ àpapọ̀ tó bá ìwọ̀n gbogbo ayé inú ọ̀rọ̀ Gíríìkì mu.
- source_word: ἐν τῷ Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” pa ìtumọ̀ ẹni tí a fi òróró yàn mọ́.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: àwọn ohun tí ń bẹ ní àwọn ọ̀run
  rationale: Ìtumọ̀ yìí pa ọ̀pọ̀ “ọ̀run” inú Gíríìkì àti ìtọ́kasí sí ibi tí àwọn ohun náà wà mọ́.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: àwọn ohun tí ń bẹ lórí ilẹ̀ ayé
  rationale: Ó fi kedere hàn pé àwọn ohun tó wà lórí ilẹ̀ ayé ni, ó sì dúró ní ìyàtọ̀ sí àwọn ohun ní àwọn ọ̀run.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa àtúnsọ Gíríìkì mọ́, ó sì tọ́ka padà sí Mèsáyà láì fi ìtumọ̀ àfikún kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àyíká yìí, nítorí náà “Mèsáyà” mú ìtumọ̀ oyè náà jáde dípò lílò ó bí orúkọ.
- issue: Ìtumọ̀ ἀνακεφαλαιώσασθαι
  choice: láti kó ohun gbogbo jọ
  alternative: láti kó ohun gbogbo jọ sábẹ́ orí kan
  rationale: Gíríìkì lè ní èrò ṣíṣe àkójọpọ̀ tàbí kíkó ohun gbogbo sábẹ́ orí kan. Ọ̀rọ̀ inú ẹsẹ̀ jẹ́ àdánidá, àlàyé sì pa ìtumọ̀ orí tó ṣeé ṣe mọ́ láì yanju ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo gbólóhùn ìṣe “nígbà tí ... bá dé ẹ̀kúnrẹ́rẹ́ wọn” dípò àkójọpọ̀ ọ̀rọ̀-orúkọ tó le láti mú kí ẹsẹ̀ náà ṣe kedere fún òǹkàwé lásán, nígbà tí a ṣì pa ìtumọ̀ àti ìtẹ̀lé ọ̀rọ̀ Gíríìkì mọ́.
