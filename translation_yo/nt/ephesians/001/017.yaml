    text: Ó tún lè jẹ́, “Ẹ̀mí ọgbọ́n àti ìṣípayá.” Ọ̀rọ̀ Gíríìkì πνεῦμα lè túmọ̀ sí ẹ̀mí tàbí ìtẹ̀sí inú tí Ọlọ́run fúnni, ó sì tún lè tọ́ka sí Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: b
    text: Ìtumọ̀ àṣà ni “Jésù Kristi.” Oyè Gíríìkì Χριστός túmọ̀ sí “Mèsáyà,” ẹni tí a fòróró yàn.
    reason: lexical_alternative
  - marker: c
