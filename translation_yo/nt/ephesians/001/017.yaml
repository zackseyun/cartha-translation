id: EPH.1.17
reference: Ephesians 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: yo
  text: kí Ọlọ́run ti Olúwa wa Jésù Mèsáyà[b], Baba ògo[c], lè fún yín ní ẹ̀mí[a] ọgbọ́n àti ìṣípayá nínú ìmọ̀ nípa rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Ẹ̀mí ọgbọ́n àti ìṣípayá.” Ọ̀rọ̀ Gíríìkì πνεῦμα lè túmọ̀ sí ẹ̀mí tàbí ìtẹ̀sí inú tí Ọlọ́run fúnni, ó sì tún lè tọ́ka sí Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: b
    text: Ìtumọ̀ àṣà ni “Jésù Kristi.” Oyè Gíríìkì Χριστός túmọ̀ sí “Mèsáyà,” ẹni tí a fòróró yàn.
    reason: lexical_alternative
  - marker: c
    text: Ó tún lè jẹ́, “Baba ológo.” Ní tààràtà, gbolohun Gíríìkì náà ni “Baba ògo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Àkójọpọ̀ yìí fi hàn pé gbólóhùn náà ń sọ ohun tí Paulu ń gbàdúrà fún tàbí ète àdúrà rẹ̀, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: Ọlọ́run Olúwa wa
  rationale: 'Èyí pa ìbáṣepọ̀ oníhun inú Gíríìkì mọ́: Ọlọ́run ẹni tí a ń pè ní Olúwa wa.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni tí a fòróró yàn, ìyẹn Mèsáyà; a kò fi àpilẹ̀kọ kún un nítorí pé ‘Jesu Mèsáyà’ jẹ́ ọ̀nà àdánidá láti so orúkọ àti oyè pọ̀ ní Yorùbá.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: Baba ògo
  rationale: Ìtumọ̀ yìí sún mọ́ gbolohun oníhun Gíríìkì, ó sì yàgò fún yíyàn láìjẹ́ dandan pé ó túmọ̀ sí ‘Baba ológo’ nìkan.
- source_word: δώῃ ὑμῖν
  choice: lè fún yín ní
  rationale: ‘Lè’ nínú gbólóhùn tí ‘kí’ bẹ̀rẹ̀ fi ìfẹ́ tàbí ìbéèrè àdúrà hàn ní Yorùbá àdánidá.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: ẹ̀mí ọgbọ́n àti ìṣípayá
  rationale: ‘Ẹ̀mí’ pa àìdánilójú Gíríìkì mọ́ bóyá ìtẹ̀sí inú tí Ọlọ́run fún ni tàbí Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; ‘ìṣípayá’ ṣàfihàn ìṣe Ọlọ́run láti tú ohun tí ó farapamọ́ síta.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: nínú ìmọ̀ rẹ̀
  rationale: Èyí sún mọ́ ìtumọ̀ àti ìṣètò Gíríìkì, ó sì pa ìtumọ̀ gbooro ti ìmọ̀ tó pé tàbí mímọ ẹni náà mọ́ láìfi àlàyé míì kún un.
theological_decisions:
- issue: Bóyá πνεῦμα ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí/ìtẹ̀sí inú tí Ọlọ́run ń fúnni
  choice: ẹ̀mí ọgbọ́n àti ìṣípayá
  alternative: Ẹ̀mí ọgbọ́n àti ìṣípayá
  rationale: Àìsí àpilẹ̀kọ níwájú πνεῦμα kò dá ìbéèrè náà parí. Lílò lẹ́tà kékeré nínú àkọ́kọ́ àti àlàyé ìsàlẹ̀ pa ìyàtọ̀ ìtumọ̀ méjèèjì mọ́ láìfi ẹ̀kọ́ ìjọ kan lé ẹsẹ̀ náà lórí.
- issue: Bí a ṣe máa túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní ibi yìí ó ṣiṣẹ́ gẹ́gẹ́ bí oyè Jesu; ‘Mèsáyà’ sọ ìtumọ̀ oyè náà jáde dípò kí ó jẹ́ orúkọ tí a jogún lásán.
- issue: Ìtumọ̀ ὁ πατὴρ τῆς δόξης
  choice: Baba ògo
  alternative: Baba ológo
  rationale: ‘Baba ògo’ pa irú gbolohun Gíríìkì mọ́, nígbà tí ‘Baba ológo’ tú un sí àpèjúwe kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kikún níbi tí ó bá yẹ. Gbólóhùn náà dúró gẹ́gẹ́ bí abala tí ó tẹ̀ lé àdúrà inú ẹsẹ̀ tó ṣáájú, bí ἵνα ṣe ń béèrè.
