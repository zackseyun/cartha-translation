id: EPH.1.5
reference: Ephesians 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: yo
  text: ó sì ti pinnu tẹ́lẹ̀ láti gba wa ṣọmọ nípasẹ̀ Jésù ẹni tí í ṣe Mèsáyà, fún ara rẹ̀[c], gẹ́gẹ́ bí ìfẹ́ rere inú ìfẹ́ rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Tàbí, “sí ara rẹ̀.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìdarí sí ọ̀dọ̀ rẹ̀ tàbí sí ète fún ara rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: nígbà tí ó ti pinnu tẹ́lẹ̀
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ pé Ọlọ́run ti pinnu ohun náà ṣáájú mọ́, kò sì fi èrò ẹ̀kọ́ ìsìn kan kún ohun tí Gíríìkì sọ. ‘Nígbà tí’ jẹ́ kí àkópọ̀ participle pẹ̀lú gbólóhùn ìbùkún tó bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú hàn.
- source_word: εἰς υἱοθεσίαν
  choice: láti gba wa ṣọmọ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbígba ẹni tí kì í ṣe ọmọ ní ipò ọmọ. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ipò ọmọkùnrin àti ẹ̀tọ́ ajogún inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jésù Mèsáyà
  rationale: ‘Nípasẹ̀’ fi διά pẹ̀lú genitive hàn gẹ́gẹ́ bí ọ̀nà tàbí aṣojú; ‘Mèsáyà’ túmọ̀ oyè Χριστός dípò lílo rẹ̀ bí orúkọ lásán.
- source_word: εἰς αὐτόν
  choice: fún ara rẹ̀
  rationale: Ní Yorùbá, èyí jẹ́ ọ̀nà àdánidá láti sọ pé Ọlọ́run ni ète gbígba náà. Àlàyé fi ìtumọ̀ kejì, ‘sí ara rẹ̀,’ sílẹ̀ nítorí εἰς lè tọ́ka sí ìdarí tàbí ète.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: gẹ́gẹ́ bí inú rere
  rationale: ‘Gẹ́gẹ́ bí’ fi ìbámu tí κατά ń sọ hàn; ‘inú rere’ sọ ìfẹ́ inú tó dára tàbí ìdùnnú rere tí εὐδοκία túmọ̀ sí.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: ìfẹ́ rẹ̀
  rationale: ‘Ìfẹ́’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún θέλημα níbí, ìyẹn ohun tí ẹni fẹ́ tàbí pinnu, láìfẹ̀ẹ́ mú un di ‘ètò’ nìkan.
theological_decisions:
- issue: Ìtumọ̀ προορίσας ní ibi tí àwọn ẹ̀kọ́ ìsìn ti ń jiyàn lé lórí
  choice: nígbà tí ó ti pinnu tẹ́lẹ̀
  alternative: nígbà tí ó ti yàn wá tẹ́lẹ̀
  rationale: Àṣàyàn náà pa agbára ‘pinnu ṣáájú’ mọ́, ṣùgbọ́n kò ṣàlàyé bí ìpinnu náà ṣe ní í ṣe pẹ̀lú òmìnira ènìyàn tàbí gbogbo ètò ìgbàlà.
- issue: Ìtumọ̀ ọkùnrin àti ipò òfin inú υἱοθεσία
  choice: gba wa ṣọmọ, pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé
  alternative: fi wa sí ipò ọmọkùnrin
  rationale: Gbólóhùn àkọ́kọ́ jẹ́ Yorùbá òde òní tó ṣe kedere, nígbà tí àlàyé ń pa ìtọ́kasí Gíríìkì sí ipò ọmọkùnrin àti ẹ̀tọ́ ajogún mọ́; ó sì kan gbogbo àwọn onígbàgbọ́.
- issue: Oyè Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè níbí; ‘Mèsáyà’ ń sọ ìtumọ̀ oyè náà dípò kíkà á sí apá kan orúkọ Jésù.
- issue: Ìtumọ̀ εἰς αὐτόν
  choice: fún ara rẹ̀
  alternative: sí ara rẹ̀
  rationale: ‘Fún ara rẹ̀’ dára jù lọ gẹ́gẹ́ bí ète ìgbàṣọmọ ní Yorùbá, ṣùgbọ́n a pa ìdarí ‘sí ara rẹ̀’ mọ́ nínú àlàyé nítorí Gíríìkì gba méjèèjì láyè.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn náà bẹ̀rẹ̀ gẹ́gẹ́ bí èyí tó ń tẹ̀ síwájú láti inú ẹsẹ tó ṣáájú, kí ìṣọ̀kan gígùn Efesu 1:3–14 lè hàn.
