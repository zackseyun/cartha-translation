  rationale: A rọ́pò àmì àsìkò “nígbà tí” pẹ̀lú ìṣe-ọrọ̀ tó ń tẹ̀síwájú, kí ìtumọ̀ má bàa sọ ìbáṣepọ̀ tí Gíríìkì kò sọ ní pàtó. A tún ṣàtúnṣe gbolohun εὐδοκία/θέλημα sí “ìfẹ́ rere inú ìfẹ́ rẹ̀” fún ìmúlò Yorùbá tó ṣe kedere, a sì fi “Jésù ẹni tí í ṣe Mèsáyà” hàn kí oyè náà lè hàn gbangba. Àmì [c] wà ní ibi tí “fún ara rẹ̀” wà; àwọn àlàyé [a] àti [b] ni a pa mọ́ gẹ́gẹ́ bí àlàyé ìtọ́kasí wọn, bí ó tilẹ̀ jẹ́ pé wọn kò nílò àmì nínú gbolohun àtúnṣe.
