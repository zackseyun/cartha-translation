  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìṣètò àti ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: οὖν jẹ́ ìyọrísí, μαρτύρομαι jẹ́ ìjẹ́rìí tó lágbára, ἐν κυρίῳ wà ní ìpamọ́, àti àtúnlò περιπατεῖν/περιπατεῖ ni a pa mọ́. Ṣùgbọ́n a lè mú ìṣe ἐν ματαιότητι τοῦ νοὸς αὐτῶν hàn kedere síi gẹ́gẹ́ bí ‘asán ìrònú wọn,’ kì í ṣe ‘ìrònú asán wọn,’ tí ó lè túmọ̀ sí ìrònú tí ó jẹ́ asán nìkan.'
  naturalness: ‘Pé:’ lẹ́yìn ‘nínú Olúwa’ kò rọrùn nínú Yorùbá ìgbàlódé; ‘pé’ láìsí àmì olùkólóònù rọrùn síi. ‘Ẹ kò gbọdọ̀ máa rìn mọ́’ jẹ́ gírámà, ṣùgbọ́n ‘ẹ kò gbọdọ̀ rìn mọ́’ jẹ́ kíkúrú, ó sì mú ‘no longer’ hàn láìsí ìdènà nínú ìṣọ̀kan ‘kò gbọdọ̀ ... máa.’
