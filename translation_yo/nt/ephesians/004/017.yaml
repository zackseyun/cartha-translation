  to: Nítorí náà, èyí ni mo sọ, mo sì ń jẹ́rìí nínú Olúwa pé ẹ kò gbọdọ̀ rìn mọ́ bí àwọn Kèfèrí ti ń rìn[a], nínú asán ìrònú wọn.
  rationale: A tún ìṣètò gbólóhùn ṣe díẹ̀ fún Yorùbá àdánidá, a sì yí ‘ìrònú asán wọn’ padà sí ‘asán ìrònú wọn’ kí ìtumọ̀ τοῦ νοὸς αὐτῶν gẹ́gẹ́ bí ohun tí ματαιότης ń ṣàpèjúwe lè hàn kedere. A pa àkàwé ‘rìn,’ ọ̀rọ̀ ‘nínú Olúwa,’ àti ìfarahàn ἔθνη pẹ̀lú àmì àlàyé rẹ̀ mọ́.
