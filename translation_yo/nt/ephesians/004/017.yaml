source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: yo
  text: Nítorí náà, èyí ni mo sọ, mo sì ń jẹ́rìí nínú Olúwa pé ẹ kò gbọdọ̀ rìn mọ́ bí àwọn Kèfèrí ti ń rìn[a], nínú asán ìrònú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn orílẹ̀-èdè”; àwọn ìtumọ̀ kan tú ἔθνη níhìn-ín sí “àwọn abọ̀rìṣà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: Nítorí náà, èyí ni mo sọ
  rationale: “Nítorí náà” fi ìtumọ̀ ìyọrísí οὖν hàn, “èyí ni mo sọ” sì gbé Τοῦτο gẹ́gẹ́ bí ohun tí λέγω ń tọ́ka sí.
- source_word: μαρτύρομαι
  choice: mo sì ń jẹ́rìí
  rationale: Èyí pa agbára ọ̀rọ̀ ẹlẹ́rìí àti ìmúdájú ọlọ́wọ̀-ọwọ́ ọ̀rọ̀ náà mọ́, láì sọ ọ́ di “mo pàṣẹ” tàbí “mo tẹnumọ́” nìkan.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ìtumọ̀ yìí pa àìmọ́ pàtó bóyá gbólóhùn náà ń tọ́ka sí ipò, ìṣọ̀kan, tàbí àṣẹ tí Pọ́ọ̀lù fi ń sọ̀rọ̀ mọ́.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: ẹ kò gbọdọ̀ máa rìn mọ́
  rationale: “Mọ́” fi ìdáwọ́ dúró ohun tí wọ́n ti ń ṣe tẹ́lẹ̀ hàn; “kò gbọdọ̀” sì mú agbára ìkìlọ̀ inú infinitive náà jáde ní Yorùbá àdánidá, nígbà tí “rìn” pa àkàwé ìwàláàyè mọ́.
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: bí àwọn Kèfèrí
  rationale: “Àwọn Kèfèrí” ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún àwọn tí kì í ṣe Júù nínú ọ̀rọ̀ Páùlù; kò fi dandan túmọ̀ wọn sí abọ̀rìṣà.
- source_word: περιπατεῖ
  choice: ti ń rìn
  rationale: Àtúnlò “rìn” pa àtúnṣe ọ̀rọ̀ Gíríìkì àti àkàwé ìhùwàsí rẹ̀ mọ́.
- source_word: ἐν ματαιότητι τοῦ νοὸς αὐτῶν
  choice: nínú ìrònú asán wọn
  rationale: “Ìrònú asán” jẹ́ Yorùbá àdánidá fún èrò tí kò ní èso tàbí ète tó yẹ, ó sì pa ìtọ́kasí sí νοῦς, agbára inú fún ríronú, mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη nínú ìyàtọ̀ ìhùwàsí tí a ń sọ fún ìjọ kan tí ọ̀pọ̀ wọn jẹ́ Kèfèrí tẹ́lẹ̀
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè; àwọn abọ̀rìṣà
  rationale: “Àwọn Kèfèrí” pa ìsọ̀rí àwọn tí kì í ṣe Júù mọ́ gẹ́gẹ́ bí Páùlù ti ń lò ó, láì fi ìdájọ́ ẹ̀sìn tó lágbára jù, èyí tí “àwọn abọ̀rìṣà” lè mú wọ inú ọ̀rọ̀ náà. Ìyàtọ̀ náà kan ọ̀nà ìgbé ayé wọn tẹ́lẹ̀, kì í ṣe ìdájọ́ gbogbo ẹni tí kì í ṣe Júù ní gbogbo ọ̀nà.
- issue: Agbára περιπατεῖν lẹ́yìn λέγω καὶ μαρτύρομαι
  choice: ẹ kò gbọdọ̀ máa rìn mọ́
  alternative: pé kí ẹ má ṣe máa rìn mọ́
  rationale: “Kò gbọdọ̀” mú ìkìlọ̀ ìwà rere tó lágbára inú ìṣètò gbólóhùn náà hàn, láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. “Máa rìn” pa àkàwé ìhùwàsí ti ọ̀rọ̀ Gíríìkì mọ́; àmì àlàyé sì ṣàlàyé pé “Kèfèrí” lè tún túmọ̀ sí “àwọn orílẹ̀-èdè,” kí a má bà a fi ìtumọ̀ ẹlẹ́gàn kan ṣoṣo mọ́ ọn.
