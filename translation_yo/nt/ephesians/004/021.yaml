  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: yo
  text: Bí ó bá jẹ́ pé ẹ̀yin ti gbọ́ ọ, tí a sì ti kọ́ yín nínú rẹ̀[a], gẹ́gẹ́ bí òtítọ́ ṣe wà nínú Jésù[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “ẹ̀yin ti gbọ́ nípa rẹ̀.” Gíríìkì sọ ní tààrà pé, “ẹ̀yin ti gbọ́ ọ,” ó sì ṣeé ṣe kó túmọ̀ sí pé nígbà tí wọ́n ń kéde Kristi fún wọn, Kristi fúnra rẹ̀ ni wọ́n ń gbọ́ ní ti gidi.
    reason: alternative_reading
  - marker: b
    text: “Nínú rẹ̀” àti “nínú Jésù” lè tọ́ka sí àyíká, ìṣọ̀kan, tàbí ìbáṣepọ̀ tímọ́tímọ́; Gíríìkì ní ìtumọ̀ tó gbòòrò ju “láti ọ̀dọ̀ rẹ̀” lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: bí ó bá ṣe pé
  rationale: Ó pa ìrísí ọ̀rọ̀ oníwọ̀n ‘if indeed’ mọ́, pẹ̀lú ìtẹnumọ́ díẹ̀, láì yí i padà sí ‘nítorí pé’.
- source_word: αὐτὸν ἠκούσατε
  choice: ẹ̀yin ti gbọ́ tirẹ̀
  rationale: Èyí pa ẹni tí a gbọ́ gẹ́gẹ́ bí àfojúsùn tààrà mọ́. Nínú Yorùbá, ‘gbọ́ tirẹ̀’ lè túmọ̀ sí gbígbọ́ ọ̀rọ̀ ẹni náà tàbí gbígbọ́ nípa rẹ̀, ó sì pa àìdánilójú Gíríìkì mọ́.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa àwòrán ‘nínú rẹ̀’ mọ́, èyí tó lè tọ́ka sí àyíká, ìṣọ̀kan, tàbí ìbáṣepọ̀ tímọ́tímọ́, dípò kí a sọ ọ́ di ‘láti ọ̀dọ̀ rẹ̀’.
- source_word: ἐδιδάχθητε
  choice: a ti kọ́ yín
  rationale: Ìkọ̀lé aláìlórúkọ yìí ṣàfihàn ọ̀rọ̀-ìṣe àgbàbọ̀ Gíríìkì ní Yorùbá àdánidá.
- source_word: καθώς
  choice: gẹ́gẹ́ bí
  rationale: Ó pa ìfiwéra Gíríìkì mọ́ láàárín ohun tí a kọ́ wọn àti òtítọ́ tó wà nínú Jésù.
- source_word: ἀλήθεια
  choice: òtítọ́
  rationale: Ọ̀rọ̀ náà kò ní article ní Gíríìkì; ‘òtítọ́’ jẹ́ àdàkọ tó rọrùn, tó sì yẹ.
- source_word: ἐν τῷ Ἰησοῦ
  choice: nínú Jésù
  rationale: Ó pa orúkọ ‘Jésù’ àti àwòrán ibi tàbí ìṣọ̀kan ti ἐν mọ́, láì dín un kù sí ohun èlò tàbí aṣojú.
theological_decisions:
- issue: Bóyá αὐτὸν ἠκούσατε túmọ̀ sí gbígbọ́ Kristi fúnra rẹ̀ tàbí gbígbọ́ nípa rẹ̀.
  choice: ẹ̀yin ti gbọ́ tirẹ̀
  alternative: ẹ̀yin ti gbọ́ nípa rẹ̀
  rationale: Gíríìkì fi ‘òun’ ṣe àfojúsùn tààrà. ‘Gbọ́ tirẹ̀’ jẹ́ Yorùbá àdánidá tó pa ìsúnmọ́ yẹn mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ mìíràn.
- issue: Bí a ṣe máa ṣàfihàn ἐν αὐτῷ àti ἐν τῷ Ἰησοῦ.
  choice: nínú rẹ̀ / nínú Jésù
  alternative: láti ọ̀dọ̀ rẹ̀ / ní ìṣọ̀kan pẹ̀lú Jésù
  rationale: Àṣàyàn yìí pa àìdánilójú nípa àyíká, ìṣọ̀kan, àti ìbáṣepọ̀ tímọ́tímọ́ mọ́, láì sọ ọ́ di aṣojú lásán.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti fi ọ̀pọ̀ ènìyàn hàn, a sì pa àmì ohùn mọ́ níbi tó bá jẹ́ àdánidá. Àwọn àmì ìsàlẹ̀ [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
