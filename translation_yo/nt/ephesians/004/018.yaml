source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: yo
  text: òye wọn ti ṣókùnkùn[a], a sì ti sọ wọ́n di àjèjì sí ìyè Ọlọ́run[b][c] nítorí àìmọ̀ tí ó wà nínú wọn, nítorí líle ọkàn wọn[d][e],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èrò inú wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a sì ti yà wọ́n kúrò nínú ìyè Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: “Ìyè Ọlọ́run” lè túmọ̀ sí ìyè tí ó jẹ́ ti Ọlọ́run tàbí ìyè tí ó ti ọ̀dọ̀ Ọlọ́run wá.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “àìní ìmọ̀lára ọkàn wọn.”
    reason: lexical_alternative
  - marker: e
    text: Ọ̀rọ̀ Gíríìkì fún “ọkàn” wà ní ẹyọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: òye wọn ṣókùnkùn
  rationale: Ó fi ipò tí òye wọn wà nínú rẹ̀ hàn, ó sì mú àwòrán òkùnkùn inú ọ̀rọ̀ Gíríìkì dúró ní Yorùbá àdánidá.
- source_word: ἀπηλλοτριωμένοι
  choice: a sì ti sọ wọ́n di àjèjì sí
  rationale: Perfect passive náà tọ́ka sí ipò ìyapa tí a ti mú wọn dé; ‘sọ ... di àjèjì sí’ pa ohùn àìṣe fúnra ẹni àti ìtumọ̀ ìyapa mọ́.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: ìyè Ọlọ́run
  rationale: Ìtumọ̀ yìí pa àìdánilójú genitive náà mọ́ láàárín ìyè tí ó jẹ́ ti Ọlọ́run àti ìyè tí ó ti ọ̀dọ̀ Ọlọ́run wá.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: nítorí àìmọ̀ tí ó wà nínú wọn
  rationale: ‘Nítorí’ fi ìdí-okùnfà tí διά pẹ̀lú accusative ń sọ hàn, gbolohun ìbátan náà sì ṣe àìmọ̀ náà ní ohun inú wọn.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: nítorí líle ọkàn wọn
  rationale: ‘Líle ọkàn’ pa àkàwé πώρωσις mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àìní ìmọ̀lára tàbí àìgbọ́ràn inú.
theological_decisions:
- issue: Ìtumọ̀ ‘ìyè Ọlọ́run’
  choice: Fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ‘ìyè Ọlọ́run.’
  alternative: ìyè tí ó ti ọ̀dọ̀ Ọlọ́run wá; ìyè ti Ọlọ́run fúnra rẹ̀
  rationale: Ìsopọ̀ genitive Gíríìkì lè tọ́ka sí ìyè tí ó jẹ́ ti Ọlọ́run tàbí èyí tí ó ti ọ̀dọ̀ rẹ̀ wá; ìtumọ̀ náà kò yẹ kí ó yan ọ̀kan ní ìkọ̀kọ̀.
- issue: Ẹyọ ‘ọkàn’ pẹ̀lú olùní púpọ̀
  choice: ọkàn wọn
  alternative: àwọn ọkàn wọn
  rationale: Gíríìkì lo καρδίας ní ẹyọ pẹ̀lú αὐτῶν tí ó jẹ́ púpọ̀. ‘Ọkàn wọn’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìrísí ẹyọ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn kíkún. Gbólóhùn náà jẹ́ àjákù participial tí ó ń bá ẹsẹ tó ṣáájú lọ; nítorí náà, a parí rẹ̀ pẹ̀lú àmì kọ́mà. Àwọn ọ̀rọ̀ bí ‘òye,’ ‘àjèjì sí,’ àti ‘líle ọkàn’ jẹ́ ti òde òní, ó ṣe kedere, tí ó sì pa àwòrán àti àìdánilójú orísun mọ́.
