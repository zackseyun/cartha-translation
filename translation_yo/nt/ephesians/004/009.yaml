  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìbéèrè ìtumọ̀ tí τί ἐστιν εἰ μὴ ὅτι ń ṣẹ̀dá mọ́, ó sì túmọ̀ Ἀνέβη, καὶ κατέβη, àti εἰς ní ìbámu pẹ̀lú orísun. Síbẹ̀, “ọ̀rọ̀ náà” kì í ṣe ọ̀nà tó dára jù lọ láti ṣe àfihàn gbolohun àyọlò náà; kí gbolohun náà dúró taara gẹ́gẹ́ bí ohun tí a ń béèrè ìtumọ̀ rẹ̀ dáa síi. “Àwọn apá ìsàlẹ̀ ilẹ̀ ayé” tún lè dà bí apá ara tàbí apá ohun kan ní Yorùbá, dípò ibi/agbègbè.
  naturalness: Àtúnṣe náà lò Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn tó yẹ. “Àwọn ibi ìsàlẹ̀ ilẹ̀ ayé” jẹ́ ọ̀nà tí ó rọrùn àti adayeba láti gbé μέρη kalẹ̀ láì pinnu ìtumọ̀ ẹ̀kọ́ ẹ̀sìn kan.
  terminology: “Gòkè lọ” àti “sọ̀kalẹ̀” pa àfọwọ́kọ sókè/sísàlẹ̀ mọ́. “Ilẹ̀ ayé” yẹ fún γῆ nínú àyíká ìtakora ọ̀run àti ayé. Àlàyé ìsàlẹ̀ ń ṣetọju ìtumọ̀ míràn pé “àwọn ibi ìsàlẹ̀” lè túmọ̀ sí ilẹ̀ ayé fúnra rẹ̀, àti ìṣeéṣe ibùgbé àwọn òkú, láì yan ọ̀kan.
