source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: yo
  text: Kí ni “Ó gòkè lọ” túmọ̀ sí bí kò ṣe pé ó tún sọ̀kalẹ̀ sínú àwọn ibi ìsàlẹ̀ ilẹ̀ ayé?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sínú àwọn ibi ìsàlẹ̀, èyí ni ilẹ̀ ayé.” Gbólóhùn yìí lè tọ́ka kìkì sí sísọ̀kalẹ̀ wá sí ayé, tàbí, ní pàtó, sí ibùgbé àwọn òkú.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνέβη
  choice: Ó gòkè lọ
  rationale: Ó pa àwòrán ìṣípò sókè mọ́, ó sì bá ọ̀rọ̀ ìdàkejì náà, “sọ̀kalẹ̀,” mu lọ́nà àdánidá ní Yorùbá.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: Kí ni ... túmọ̀ sí bí kò ṣe pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere fún ìbéèrè tí ń fa ìtumọ̀ tàbí ìyọrísí kan jáde láti inú ọ̀rọ̀ tí a tọ́ka sí.
- source_word: καὶ κατέβη
  choice: ó tún sọ̀kalẹ̀ lọ
  rationale: “Tún” mú agbára àfikún καί jáde, “sọ̀kalẹ̀” sì pa ìtakora ìṣípò sókè àti ìṣípò sísàlẹ̀ mọ́.
- source_word: εἰς
  choice: sínú
  rationale: “Sínú” pa ìtọ́sọ́nà àti ìwọlé tí εἰς lè fi hàn mọ́, dípò lílo “sí” nìkan.
- source_word: τὰ κατώτερα μέρη
  choice: àwọn apá ìsàlẹ̀
  rationale: “Àwọn apá” dúró fún μέρη, “ìsàlẹ̀” sì pa ìtumọ̀ afiwéra κατώτερα mọ́ láì sọ ọ́ di ibùgbé àwọn òkú ní pàtó.
- source_word: τῆς γῆς
  choice: ilẹ̀ ayé
  rationale: “Ilẹ̀ ayé” bá ìtakora àgbáyé láàárín òkè àti ìsàlẹ̀ mu, ó sì jẹ́ kí ìbáṣepọ̀ gírámà inú gbólóhùn náà ṣì ní ààyè fún ju ìtumọ̀ kan lọ.
theological_decisions:
- issue: Ìtumọ̀ εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: sínú àwọn apá ìsàlẹ̀ ilẹ̀ ayé
  alternative: sínú àwọn agbègbè ìsàlẹ̀, èyíinì ni ilẹ̀ ayé; tàbí sínú ibùgbé àwọn òkú
  rationale: Èdè Gíríìkì lè tọ́ka sí wíwá sí ilẹ̀ ayé ní ìtakora sí ọ̀run, tàbí sí ibi tí ó jinlẹ̀ ní ilẹ̀ ayé oziroma ibùgbé àwọn òkú. Ọ̀rọ̀ inú ẹsẹ náà kò yan ọ̀kan ní pàtó, nítorí náà a pa àìdánilójú náà mọ́, a sì ṣàlàyé àwọn ìtumọ̀ pàtàkì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. “Ọ̀rọ̀ náà” mú kí títọ́ka sí gbolohun àyọlò náà ṣe kedere, láì fi ọ̀rọ̀ àkókò kan tí kò sí nínú orísun kún un.
