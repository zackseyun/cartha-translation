revisions:
- from: Kí ni ọ̀rọ̀ náà, “Ó gòkè lọ,” túmọ̀ sí bí kò ṣe pé ó tún sọ̀kalẹ̀ lọ sínú àwọn apá ìsàlẹ̀ ilẹ̀ ayé?[a]
  to: Kí ni “Ó gòkè lọ” túmọ̀ sí bí kò ṣe pé ó tún sọ̀kalẹ̀ sínú àwọn ibi ìsàlẹ̀ ilẹ̀ ayé?[a]
  rationale: A yọ “ọ̀rọ̀ náà” kúrò kí ìbéèrè náà lè tọ́ka taara sí ọ̀rọ̀ àyọlò náà, a sì rọ́pò “àwọn apá ìsàlẹ̀” pẹ̀lú “àwọn ibi ìsàlẹ̀” fún Yorùbá adayeba. Àtúnṣe náà kò yanjú àìdánilójú gírámà tàbí ẹ̀kọ́ ẹ̀sìn nínú τὰ κατώτερα μέρη τῆς γῆς; àlàyé ìsàlẹ̀ ṣì mú àwọn ìtumọ̀ pàtàkì méjèèjì wà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:00Z'
