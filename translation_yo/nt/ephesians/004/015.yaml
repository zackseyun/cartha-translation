translation:
  language: yo
  text: Ṣùgbọ́n, ẹ jẹ́ kí a máa sọ òtítọ́ nínú ìfẹ́[a], kí a sì dàgbà ní gbogbo ọ̀nà[b] sínú Mèsáyà[c], ẹni tí í ṣe orí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́ olóòótọ́” tàbí “ṣe òtítọ́”; ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ sísọ òtítọ́ àti híhùwà ní òtítọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ohun gbogbo” tàbí, ní ìtumọ̀ gidi, “ohun gbogbo.”
    reason: lexical_alternative
  - marker: c
    text: 'Gíríìkì: “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: bí a ti ń sọ òtítọ́
  rationale: Ọ̀rọ̀-ìṣe náà lè kan sísọ òtítọ́ àti híhùwà ní òtítọ́. Àyíká ẹsẹ̀ yìí, tí ó ń tako ẹ̀kọ́ èké àti ẹ̀tàn, mú kí ‘sísọ òtítọ́’ jẹ́ yíyàn àkọ́kọ́ tí ó bá Yorùbá mu; àlàyé ìsàlẹ̀ ojú-ìwé pa ìtumọ̀ rẹ̀ tó gbòòrò mọ́.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn sí àìdúróṣinṣin àti ẹ̀tàn tí a ṣàpèjúwe ṣáájú.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Ó pa àwòrán ibi tàbí àyíká tí ìṣe náà ti ń ṣẹlẹ̀ mọ́, ó sì lè ní ìtumọ̀ ọ̀nà tí a fi ń ṣe é.
- source_word: αὐξήσωμεν
  choice: ẹ jẹ́ kí a dàgbà
  rationale: Subjunctive ẹni àkọ́kọ́ ọ̀pọ̀ ní agbára ìṣírí; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá.
- source_word: εἰς αὐτὸν
  choice: sínú ẹni
  rationale: ‘Sínú’ pa ìdarí εἰς àti àwòrán ìdàgbàsókè sí ìṣọ̀kan pẹ̀lú Mèsáyà mọ́.
- source_word: τὰ πάντα
  choice: ní gbogbo ọ̀nà
  rationale: Nínú gbólóhùn ìdàgbàsókè yìí, ó túmọ̀ sí ìdàgbàsókè ní gbogbo apá tàbí ní gbogbo ọ̀nà, dípò kí ‘ohun gbogbo’ jẹ́ ohun tí ń dàgbà.
- source_word: κεφαλή
  choice: orí
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì pa àkàwé ara mọ́ láìfi ‘orisun’ tàbí ‘aláṣẹ’ kún un.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níbi yìí ó dúró gẹ́gẹ́ bí oyè ní ìfaramọ́ pẹ̀lú ‘orí’; ‘Mèsáyà’ fi iṣẹ́ oyè náà hàn ní kedere.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἀληθεύοντες
  choice: ‘bí a ti ń sọ òtítọ́’ nínú ọ̀rọ̀ pàtàkì
  alternative: ‘bí a ti ń jẹ́ olóòótọ́’ tàbí ‘bí a ti ń ṣe òtítọ́’
  rationale: Àyíká náà tọ́ka sí ọ̀rọ̀ ẹ̀kọ́ èké àti ẹ̀tàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì lè gbòòrò dé ìwà òtítọ́; àlàyé pa àìdánilójú yẹn mọ́.
- issue: Agbára àkàwé κεφαλή
  choice: ‘orí’
  alternative: ‘orisun’ tàbí ‘ẹni tó ní àṣẹ lórí’
  rationale: A kò yan ọ̀kan lára àwọn ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí a ti ń jiyàn lé lórí; a pa àkàwé Pọ́ọ̀lù mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ jẹ́ kí a’ fún ìṣírí ẹgbẹ́, a sì pa àkàwé ‘orí’ àti ìdarí ‘sínú’ mọ́.
