  to: Kí ọ̀rọ̀ tí ó jẹrà kankan má ṣe jáde láti ẹnu yín,[a] ṣùgbọ́n kí èyí tí ó bá dára fún gbígbé àwọn ènìyàn ró gẹ́gẹ́ bí àìní ṣe béèrè nìkan jáde,[b] kí ó lè fi oore-ọ̀fẹ́ fún àwọn tí ń gbọ́.[c]
  rationale: Àtúnṣe náà ṣe ìmúdájú gírámà àti àdánidá Yorùbá, ní pàtàkì nípa àpèjúwe σαπρός àti ipò gbolóhùn ìdènà. Ó pa ìtumọ̀, àwòrán, ìwọ̀n àìdánilójú, àti àwọn àmì àkọsílẹ̀ ti ìpilẹ̀ Gíríìkì mọ́.
