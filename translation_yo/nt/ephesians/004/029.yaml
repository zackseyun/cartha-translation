review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìṣètò àti ìtumọ̀ Gíríìkì náà dáadáa: ìdènà lórí ọ̀rọ̀ σαπρός, ìyàtọ̀ sí ọ̀rọ̀ rere fún ìgbé-ró gẹ́gẹ́ bí àìní, àti ète pé kí ó fún àwọn olùgbọ́ ní χάρις. Àtúnṣe kékeré kan ń mú kí ìtumọ̀ ‘jẹrà’ jẹ́ Yorùbá tí ó péye sí i, ó sì mú ìṣètò ìdènà náà rọrùn.'
  naturalness: ‘Ọ̀rọ̀ jíjẹrà’ kò wọ́pọ̀ gẹ́gẹ́ bí àpèjúwe ọ̀rọ̀ nínú Yorùbá òde òní; ‘ọ̀rọ̀ tí ó jẹrà’ jẹ́ èdè àdánidá sí i, ó sì pa àwòrán ‘rotten’ mọ́. Bákan náà, ‘má ṣe jáde láti ẹnu yín’ jẹ́ ìṣètò tí ó rọrùn ju ‘má ṣe ti ẹnu yín jáde’ lọ. Fífi ‘àwọn ènìyàn’ kún ‘gbígbé ... ró’ mú un kedere ní Yorùbá láìyí ìtumọ̀ àpẹẹrẹ Gíríìkì náà padà.
  terminology: ‘Oore-ọ̀fẹ́’ jẹ́ ìfẹ̀hónúhàn tó bójú mu fún χάρις níbí; àkọsílẹ̀ náà tọ́ka ní ìwọ̀ntúnwọ̀nsì sí ìtumọ̀ ‘àǹfààní rere.’ ‘Ọ̀rọ̀ tí ó jẹrà’ dá àwòrán σαπρός dúró ju ọ̀rọ̀ gbogbogbò bí ‘ọ̀rọ̀ búburú’ lọ.
  issues:
  - severity: medium
    issue: ‘Ọ̀rọ̀ jíjẹrà’ jẹ́ àkópọ̀ ọ̀rọ̀ tí kò rọrùn nínú Yorùbá.
    rationale: ‘Jíjẹrà’ lè dà bí orúkọ ìṣe tàbí ohun mìíràn, dípò àpèjúwe tí ó ṣe kedere fún λόγος σαπρός. ‘Ọ̀rọ̀ tí ó jẹrà’ jẹ́ ìtumọ̀ taara, àdánidá, tí ó sì pa àwòrán ìbàjẹ́ mọ́.
  - severity: low
    issue: ‘Má ṣe ti ẹnu yín jáde’ ní ìṣètò ọ̀rọ̀ tí ó le díẹ̀.
    rationale: ‘Má ṣe jáde láti ẹnu yín’ jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ sí i láti sọ pé kí ọ̀rọ̀ má yọ láti ẹnu ẹni.
  - severity: low
    issue: ‘Fún gbígbé ró’ kò sọ ẹni tí a ń gbé ró ní kedere.
    rationale: Fífi ‘àwọn ènìyàn’ kún un jẹ́ ìmúṣiṣẹ́ gírámà Yorùbá; àwọn tí a ń gbé ró wà nínú ìtumọ̀ οἰκοδομή àti àyíká àwọn olùgbọ́, kò sì ṣàfikún ẹ̀kọ́ tuntun.
