id: EPH.4.29
reference: Ephesians 4:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: yo
  text: Kí ọ̀rọ̀ tí ó jẹrà kankan má ṣe jáde láti ẹnu yín,[a] ṣùgbọ́n kí èyí tí ó bá dára fún gbígbé àwọn ènìyàn ró gẹ́gẹ́ bí àìní ṣe béèrè nìkan jáde,[b] kí ó lè fi oore-ọ̀fẹ́ fún àwọn tí ń gbọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààràtà: “ọ̀rọ̀ tí ó jẹrà.” Ó tún lè túmọ̀ sí ọ̀rọ̀ oníbàjẹ́ tàbí ọ̀rọ̀ tí kò ní ìlera.'
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé túmọ̀ sí “fún gbígbé ró níbi tí àìní bá wà” tàbí “bí ó ṣe yẹ fún ipò náà.”
    reason: source_ambiguity
  - marker: c
    text: “Fi oore-ọ̀fẹ́ fún” tún lè túmọ̀ sí “ṣe àwọn tí ń gbọ́ ní àǹfààní rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: ọ̀rọ̀ jíjẹrà kankan
  rationale: Àkópọ̀ πᾶς pẹ̀lú ọ̀rọ̀ ìdènà ní ìtumọ̀ pé ‘kò sí ... kankan.’ ‘Jíjẹrà’ pa àwòrán ohun tí ó ti rà mọ́, bí σαπρός ṣe rí, nígbà tí ‘ọ̀rọ̀’ níbí túmọ̀ sí ohun tí a sọ.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: má ṣe ti ẹnu yín jáde
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìdènà pé kí irú ọ̀rọ̀ bẹ́ẹ̀ má ṣe jáde láti ẹnu àwọn olùgbọ́; ó sì pa àwòrán ẹnu mọ́.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: bí kò ṣe èyí tí ó dára
  rationale: Gbólóhùn Gíríìkì náà fi apá kan sílẹ̀ láìtún λόγος sọ. Ìtumọ̀ yìí mú un péye ní Yorùbá láìfi èrò míì kún un.
- source_word: πρὸς οἰκοδομὴν
  choice: fún gbígbé ró
  rationale: ‘Gbígbé ró’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún àwòrán kíkọ́ ènìyàn ró tàbí fífún un ní okun, dípò lílo ọ̀rọ̀ ẹ̀sìn tí kò wọ́pọ̀.
- source_word: τῆς χρείας
  choice: gẹ́gẹ́ bí àìní ṣe béèrè
  rationale: χρεία tọ́ka sí àìní tàbí ohun tí ipò náà béèrè. Ìtumọ̀ yìí pa ìsopọ̀ Gíríìkì tí ó kúkúrú mọ́ láìsọ pé àìní ta ni ní pàtó.
- source_word: ἵνα δῷ χάριν
  choice: kí ó lè fi oore-ọ̀fẹ́ fún
  rationale: ‘Oore-ọ̀fẹ́’ pa ìwọ̀n ìtumọ̀ χάρις mọ́—oore, ojúrere, tàbí àǹfààní rere—láìdín in kù sí ìwúlò nìkan.
- source_word: τοῖς ἀκούουσιν
  choice: àwọn tí ń gbọ́
  rationale: Èyí fi ipa present participle hàn ní èdè Yorùbá àdánidá, ó sì lè tọ́ka sí àwọn tí ń fetí sílẹ̀ nígbà náà tàbí àwọn olùgbọ́ lápapọ̀.
theological_decisions:
- issue: Ìtumọ̀ χάριν nínú ìkìlọ̀ nípa ìwà àti ọ̀rọ̀ ẹnu
  choice: oore-ọ̀fẹ́
  alternative: àǹfààní rere; ojúrere
  rationale: ‘Oore-ọ̀fẹ́’ pa èdè Páùlù àti ìtumọ̀ ìbáṣepọ̀ rẹ̀ mọ́, ṣùgbọ́n àkọsílẹ̀ ẹsẹ̀ ṣàlàyé pé ó tún lè túmọ̀ sí àǹfààní rere; báyìí a kò fi ẹ̀kọ́ ẹ̀sìn tí ó ju ohun tí ọ̀rọ̀ náà sọ lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a pa àwòrán ‘jíjẹrà,’ ‘ẹnu,’ àti ‘gbígbé ró’ mọ́ níbi tí Yorùbá ti lè gbà wọ́n lọ́nà àdánidá.
