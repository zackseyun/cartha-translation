id: EPH.4.1
reference: Ephesians 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: yo
  text: Nítorí náà, èmi, ẹlẹ́wọ̀n nínú Olúwa[a], ń rọ̀ yín pé kí ẹ máa rìn ní ọ̀nà tí ó yẹ fún ìpè tí a fi pè yín[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí “ẹlẹ́wọ̀n Olúwa” tàbí “ẹlẹ́wọ̀n nítorí Olúwa.”
    reason: alternative_reading
  - marker: b
    text: Ó tún lè jẹ́ “kí ẹ máa gbé ìgbé-ayé tí ó yẹ fún ìpè tí a fi pè yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ń rọ̀ yín
  rationale: Ó fi agbára ìṣírí àti ẹ̀bẹ̀ olùṣọ́-àgùntàn hàn, láì sọ ọ́ di àṣẹ líle.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ọgbọ́n mọ́ pẹ̀lú ohun tí Pọ́ọ̀lù ti sọ ṣáájú.
- source_word: δέσμιος
  choice: ẹlẹ́wọ̀n
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ ‘prisoner’ mu.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa àpólà Gíríìkì náà mọ́, kò sì fi tipátipá sọ pé ohun-ìní tàbí ìdí ni ó túmọ̀ sí.
- source_word: ἀξίως
  choice: ní ọ̀nà tí ó yẹ fún
  rationale: Àpólà yìí jẹ́ Yorùbá àdánidá fún ìwà tàbí ìgbé-ayé tó bá ipò ẹni mu.
- source_word: περιπατῆσαι
  choice: kí ẹ máa rìn
  rationale: Ó pa àkàwé Pọ́ọ̀lù nípa rírìn gẹ́gẹ́ bí ọ̀nà ìgbé-ayé mọ́, ó sì ṣeé lóye ní Yorùbá.
- source_word: κλήσεως
  choice: ìpè
  rationale: ‘Ìpè’ bá èrò ìkésíni tàbí pípe Ọlọ́run mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἧς ἐκλήθητε
  choice: tí a fi pè yín
  rationale: Ó ṣàfihàn ìbáṣepọ̀ láàárín ìpè náà àti pípe wọn, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ àpèjúwe Pọ́ọ̀lù, ὁ δέσμιος ἐν κυρίῳ
  choice: ẹlẹ́wọ̀n nínú Olúwa
  alternative: ẹlẹ́wọ̀n Olúwa; ẹlẹ́wọ̀n nítorí Olúwa
  rationale: A pa ‘nínú Olúwa’ mọ́ kí ìtumọ̀ rẹ̀ lè ní fífẹ̀ tó ní nínú Gíríìkì, dípò lílọ pinnu pé ó ń sọ ohun-ìní tàbí ìdí ìwọ̀n náà nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Máa rìn’ pa àkàwé inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì fúnni ní ọ̀nà tí ó tú àkàwé náà sí ‘gbé ìgbé-ayé.’
