id: EPH.4.31
reference: Ephesians 4:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: yo
  text: Kí gbogbo ìkorò, ìrunú, ìbínú, ariwo, àti ọ̀rọ̀ ìbanilórúkọjẹ́[a] kúrò lọ́dọ̀ yín, pẹ̀lú gbogbo ìwà ìkà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ èébú”; ní ìtumọ̀ ìbílẹ̀, “ọ̀rọ̀-òdì sí Ọlọ́run.” Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kó tọ́ka sí ọ̀rọ̀ tó ń pa ẹlòmíràn lára.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: gbogbo ìkorò
  rationale: “Ìkorò” jẹ́ ọ̀nà àdánidá láti ṣàpèjúwe ìbínú tàbí ìkórìíra tí ó ti fìdí múlẹ̀ nínú ọkàn; “gbogbo” sì mú agbára àpapọ̀ πᾶσα jáde.
- source_word: θυμός
  choice: ìrunú
  rationale: “Ìrunú” tọ́ka sí ìbínú gbígbóná tí ó lè bẹ́ sílẹ̀ lójijì, ó sì yàtọ̀ níwọ̀nba díẹ̀ sí ὀργή.
- source_word: ὀργή
  choice: ìbínú
  rationale: “Ìbínú” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún anger, ó sì jẹ́ kí ìyàtọ̀ pẹ̀lú θυμός hàn.
- source_word: κραυγή
  choice: ariwo
  rationale: Nínú àkójọ ìwà búburú yìí, “ariwo” túmọ̀ sí igbe tàbí ọ̀rọ̀ líle tí a ń pa sí ara ẹni, kì í ṣe igbe tí kò ní ète búburú.
- source_word: βλασφημία
  choice: ọ̀rọ̀ ìbanilórúkọjẹ́
  rationale: Àyíká ọ̀rọ̀ náà dá lórí ìbáṣepọ̀ láàárín ènìyàn; nítorí náà, ọ̀rọ̀ tó ń ba orúkọ ẹlòmíràn jẹ́ ni ó bá a mu jù, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè gbòòrò sí ọ̀rọ̀ èébú.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: Kí a mú ... kúrò lọ́dọ̀ yín
  rationale: Ìṣètò aláìdárúkọ “kí a mú” ń pa agbára àṣẹ àti ìtumọ̀ àfiyèsíṣe ti ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: σὺν πάσῃ κακίᾳ
  choice: pẹ̀lú gbogbo ìwà arankàn
  rationale: “Ìwà arankàn” sọ ìfẹ́ láti ṣe ẹlòmíràn ní ibi jáde dáadáa nínú àyíká yìí; “pẹ̀lú” sì pa agbára σύν mọ́.
theological_decisions:
- issue: Ìtumọ̀ βλασφημία nínú àkójọ ìwà búburú yìí
  choice: ọ̀rọ̀ ìbanilórúkọjẹ́ sí ẹlòmíràn
  alternative: ọ̀rọ̀ èébú; ọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Àwọn ọ̀rọ̀ tó yí i ká ń sọ nípa ìwà àti ọ̀rọ̀ tó ń ba àjọṣe ènìyàn jẹ́. Síbẹ̀, àlàyé ìsàlẹ̀ fi ìtumọ̀ tó gbòòrò àti ìtumọ̀ àṣà sílẹ̀ láìpa wọ́n rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A pa ìyàtọ̀ tó wà láàárín θυμός àti ὀργή mọ́ nípasẹ̀ “ìrunú” àti “ìbínú.”
