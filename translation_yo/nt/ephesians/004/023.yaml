  text: kí ẹ sì máa di tuntun nínú ẹ̀mí inú yín,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè ka ‘ẹ̀mí’ níhìn-ín sí Ẹ̀mí Mímọ́; ṣùgbọ́n ó ṣeé ṣe jù pé gbólóhùn náà ń tọ́ka sí ìṣarasíhùwà tàbí ìdarí inú èrò inú yín, kì í ṣe sí Ẹ̀mí Mímọ́ ní tààràtà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: kí a máa sọ yín di tuntun
  rationale: Ọ̀rọ̀ náà jẹ́ infinitive aláìṣe ní ìrísí lọwọlọwọ; ‘kí a máa sọ yín di tuntun’ pa ìtumọ̀ pé ohun kan ń ṣẹlẹ̀ sí wọn mọ́, ó sì lè fi ìtẹ̀síwájú iṣẹ́ náà hàn lọ́nà Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ nínú ọ̀wọ́ àwọn infinitive, kì í ṣe àmì ìtakora líle; ‘sì’ bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: τῷ πνεύματι
  choice: nínú ẹ̀mí
  rationale: Dative náà lè tọ́ka sí ibi tàbí apá tí ìsọdituntun ti ń ṣẹlẹ̀. ‘Nínú ẹ̀mí’ pa àìdánilójú πνεῦμα mọ́ láìsọ ọ́ di ìtọ́kasí kedere sí Ẹ̀mí Mímọ́.
- source_word: τοῦ νοὸς
  choice: inú
  rationale: Nínú gbólóhùn Yorùbá ‘ẹ̀mí inú yín,’ ‘inú’ ń tọ́ka sí èrò, ìmòye, àti ìṣarasíhùwà inú ènìyàn; ó jẹ́ ọ̀nà àdánidá láti gbé ìbáṣepọ̀ ‘ẹ̀mí ti èrò inú’ jáde láìjẹ́ kí ọ̀rọ̀ náà le.
- source_word: ὑμῶν
  choice: yín
  rationale: ‘Yín’ fi hàn pé ẹni kejì ọ̀pọ̀ ni ọ̀rọ̀ náà ń bá, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí ohun-ìní nínú ‘inú yín.’
theological_decisions:
- issue: Bóyá πνεύματι ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí/ìṣarasíhùwà inú ènìyàn
  choice: ẹ̀mí inú yín
  alternative: nípasẹ̀ Ẹ̀mí tí ń sọ èrò inú yín di tuntun
  rationale: τοῦ νοὸς ὑμῶν ṣe àlàyé πνεύματι lọ́nà tí ó ṣeé ṣe jù pé ó ń tọ́ka sí ìṣarasíhùwà tàbí agbára inú tí ń darí èrò. A kò fi ọ̀rọ̀ àfikún mú un dájú pé Ẹ̀mí Mímọ́ ni, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn yẹn mọ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó ṣeé lóye fún òǹkàwé òde òní. ‘Ẹ̀mí inú yín’ yàgò fún àkójọpọ̀ ọ̀rọ̀ líle bí ‘ẹ̀mí ti èrò inú yín,’ ó sì pa ìtumọ̀ inú ènìyàn àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ mọ́.
