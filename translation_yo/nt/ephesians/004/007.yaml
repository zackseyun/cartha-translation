id: EPH.4.7
reference: Ephesians 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: yo
  text: Ṣùgbọ́n a fi oore-ọ̀fẹ́ fún ẹnì kọ̀ọ̀kan wa gẹ́gẹ́ bí ìwọ̀n ẹ̀bùn Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀bùn Kristi.” Oyè Gíríìkì náà, Χριστοῦ, lè jẹ́ “Kristi” níbi tí ó ti ń ṣiṣẹ́ bí orúkọ, ṣùgbọ́n “Mèsáyà” níhìn-ín pa ìtumọ̀ oyè náà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: ẹnì kọ̀ọ̀kan wa
  rationale: 'Ọ̀rọ̀ yìí pa ìtumọ̀ pínpín àti ìtẹnumọ́ Gíríìkì mọ́: gbogbo wa ni a ń sọ̀rọ̀ nípa rẹ̀, ṣùgbọ́n olúkúlùkù gba ìpín tirẹ̀.'
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré hàn láti inú ìṣọ̀kan tí àwọn ẹsẹ tó ṣáájú tẹnumọ́ sí oríṣiríṣi oore-ọ̀fẹ́ tí a pín fún àwọn ènìyàn.
- source_word: ἐδόθη
  choice: a fi ... fún
  rationale: Ìsọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣe àṣeparí àti ìtumọ̀ passive ti Gíríìkì mọ́ láìsọ ẹni tó fúnni ní tààràtà.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún χάρις; ó pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù mọ́, kò sì dín un kù sí ojú rere lásán tàbí sọ ọ́ di ẹ̀bùn nìkan.
- source_word: κατὰ τὸ μέτρον
  choice: gẹ́gẹ́ bí ìwọ̀n
  rationale: Ó fi hàn pé bí a ṣe pín oore-ọ̀fẹ́ náà bá ìwọ̀n tàbí ìpín ẹ̀bùn náà mu.
- source_word: τῆς δωρεᾶς
  choice: ẹ̀bùn
  rationale: “Ẹ̀bùn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a fi fúnni lọ́fẹ̀ẹ́, láìfi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ṣì ní agbára gẹ́gẹ́ bí oyè; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ ju lílo ìkọ̀wé-orúkọ “Kristi” nìkan lọ.
theological_decisions:
- issue: Ìtumọ̀ oore-ọ̀fẹ́ nínú àyíká ọ̀rọ̀
  choice: A fi “oore-ọ̀fẹ́” sílẹ̀ ní ọ̀nà tó lè tọ́ka sí oore Ọlọ́run tí a pín fún iṣẹ́ ìránṣẹ́.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí “agbára fún iṣẹ́ ìránṣẹ́” tàbí “ẹ̀bùn oore-ọ̀fẹ́.”
  rationale: Àyíká ẹsẹ 7–11 ń lọ sí orí ẹ̀bùn àti iṣẹ́ ìránṣẹ́, ṣùgbọ́n χάρις fúnra rẹ̀ ní ìwọ̀n ìtumọ̀ tó gbooro. Títọ́jú “oore-ọ̀fẹ́” kò jẹ́ kí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà di kékeré ju ti orísun lọ.
- issue: Bó ṣe yẹ kí a túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” mú ìtumọ̀ oyè Χριστός jáde ní kedere; àlàyé ìsàlẹ̀ ojú-ìwé jẹ́wọ́ ìtumọ̀ àṣà “Kristi” láìyí ọ̀rọ̀ inú ẹsẹ padà.
- issue: Ìbáṣepọ̀ genitive nínú “τῆς δωρεᾶς τοῦ Χριστοῦ”
  choice: ẹ̀bùn Mèsáyà
  alternative: ẹ̀bùn tí Mèsáyà fúnni
  rationale: 'Ìtumọ̀ gígún náà pa àìdánilójú genitive mọ́: ó lè jẹ́ ẹ̀bùn tó jẹ́ ti Mèsáyà tàbí èyí tí ó fi fúnni. A kò fi ọ̀rọ̀ “tí ... fúnni” kún un láti yan ọ̀kan ní ìkọ̀kọ̀.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán; “ẹnì kọ̀ọ̀kan wa” tẹnumọ́ pípín fún olúkúlùkù, “gẹ́gẹ́ bí ìwọ̀n” sì pa àwòrán ìwọ̀n orísun mọ́.
