  revision_rationale: The revision replaces the non-past/habitual-sounding “kì í ṣe … ṣe kọ́” with the direct past negation “kò kọ́,” matching ἐμάθετε, and renders οὐχ οὕτως as “ní ọ̀nà yìí.” It retains the explicit “ẹ̀yin,” the adversative “Ṣùgbọ́n,” the direct-object construction “kọ́ Mèsáyà,” and the existing alternative-rendering footnote.
