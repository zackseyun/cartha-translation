  text: ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin kò kọ́ Mèsáyà ní ọ̀nà yìí,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n ẹ̀yin kò kọ́ Kristi ní ọ̀nà yìí.”
    reason: Àṣàyàn míì fún títúmọ̀ Χριστόν níbi yìí gẹ́gẹ́ bí “Kristi” dípò “Mèsáyà.”
lexical_decisions:
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, ó sì hàn gbangba nínú Gíríìkì láti tẹnu mọ́ ìyàtọ̀ láàárín àwọn olùgbọ́ àti àwọn ènìyàn tí a ṣàpèjúwe ṣáájú.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora hàn sí ìwà àwọn Kèfèrí tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe; “Ṣùgbọ́n” jẹ́ ọ̀nà àdánidá láti gbé ìtakora náà jáde ní Yorùbá.
- source_word: οὐχ οὕτως
  choice: kì í ṣe bẹ́ẹ̀
  rationale: Àkópọ̀ ìkọ̀ àti ọ̀rọ̀ tó ń tọ́ka sí ọ̀nà tàbí ìṣe kan ni; ó tọ́ka padà sí ọ̀nà ìgbésí ayé tí ẹsẹ tó ṣáájú ṣàpèjúwe.
- source_word: ἐμάθετε
  choice: ẹ̀yin ṣe kọ́
  rationale: Ìṣe náà túmọ̀ sí “kọ́” tàbí “kẹ́kọ̀ọ́.” A kò lò “a kọ́ yín” nítorí pé ìṣe olùṣe ni Gíríìkì lò níbí, kì í ṣe ìṣe aláìṣe.
- source_word: τὸν Χριστόν
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́. A tún pa gbólóhùn aláìlẹ́gbẹ́ náà, “kọ́ Mèsáyà,” mọ́ dípò fífi “nípa” kún un.
theological_decisions:
- issue: Ṣíṣe Χριστόν gẹ́gẹ́ bí oyè tàbí bí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” mú ìtumọ̀ oyè ẹni àmì òróró náà hàn ní kedere, láìfi “Jésù” kún ohun tí Gíríìkì kò sọ. “Kristi” jẹ́ àṣàyàn tó wọ́pọ̀, a sì fi í sínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ gbólóhùn ἐμάθετε τὸν Χριστόν
  choice: kọ́ Mèsáyà
  alternative: kọ́ nípa Mèsáyà
  rationale: Gíríìkì fi Mèsáyà ṣe ohun tí wọ́n kọ́ ní tààrà; fífi “nípa” kún un yóò tú ìforígbárí àti ìjìnlẹ̀ ọ̀rọ̀ Pọ́ọ̀lù ju bó ṣe yẹ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìṣètò “kì í ṣe bẹ́ẹ̀ ni…” jẹ́ àdánidá ní Yorùbá, ó sì pa ìtakora àti ìtẹnumọ́ inú ọ̀rọ̀ Gíríìkì mọ́. A mọ̀ọ́mọ̀ pa ọ̀rọ̀ “kọ́ Mèsáyà” mọ́ bí ó tilẹ̀ jẹ́ pé kò wọ́pọ̀, nítorí pé bẹ́ẹ̀ ni ìṣètò orísun ṣe rí.
