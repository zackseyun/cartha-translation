review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the explicit plural addressee, the contrast, the manner contrast in οὐχ οὕτως, the active sense of ἐμάθετε, and Χριστόν as “Mèsáyà.” However, “kì í ṣe” normally carries a gnomic, customary, or non-past sense in Yoruba and does not appropriately convey the Greek aorist (“you did not learn”).
  naturalness: “Ṣùgbọ́n kì í ṣe bẹ́ẹ̀ ni ẹ̀yin ṣe kọ́ Mèsáyà” is understandable, but its tense-aspect is less natural for this retrospective assertion. “Ṣùgbọ́n ẹ̀yin kò kọ́ Mèsáyà ní ọ̀nà yìí” is clear, idiomatic Standard Yoruba, and preserves the deliberately unusual direct object “Mèsáyà.”
  terminology: “Mèsáyà” appropriately preserves Χριστός as a title in keeping with the supplied translation policy. The alternative “Kristi” is appropriately retained in the footnote. No added name or doctrinal interpretation is introduced.
  issues:
  - severity: medium
    issue: The negative construction “kì í ṣe” does not reflect the aorist past reference of ἐμάθετε.
    rationale: In Standard Yoruba, kì í commonly expresses a habitual/general negation. The Greek says that the readers did not learn the Messiah in that manner; “kò kọ́” directly expresses this completed/past negation.
  revised_text: Ṣùgbọ́n ẹ̀yin kò kọ́ Mèsáyà ní ọ̀nà yìí,[a]
  revised_footnotes:
