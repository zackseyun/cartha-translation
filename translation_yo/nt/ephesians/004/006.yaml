  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: yo
  text: Ọlọ́run kan ni, Baba gbogbo[a], ẹni tí ó wà lórí gbogbo, tí ó wà nípasẹ̀ gbogbo, tí ó sì wà nínú gbogbo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “Baba gbogbo ènìyàn” tàbí “Baba ohun gbogbo.” Ọ̀rọ̀ “gbogbo” tí a tún lò léraléra nínú ẹsẹ yìí gbòòrò, Gíríìkì kò sì sọ orúkọ tí ó ń tọ́ka sí ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí “nínú gbogbo ènìyàn.” Àwọn ìwé àfọwọ́kọ kan ní “nínú gbogbo yín.”
    reason: textual_variant
lexical_decisions:
- source_word: εἷς θεὸς
  choice: Ọlọ́run kan
  rationale: '“Kan” pa ìtẹnumọ́ nọ́ńbà náà mọ́, ó sì bá àtòjọ ìṣọ̀kan tó ṣáájú mu: ara kan, Ẹ̀mí kan, Olúwa kan.'
- source_word: πατὴρ πάντων
  choice: Baba gbogbo
  rationale: “Baba” pa orúkọ ìbáṣepọ̀ ti Ọlọ́run mọ́; lílo “gbogbo” láìfi orúkọ kan kún un kò fi tipá mú un túmọ̀ sí gbogbo ènìyàn tàbí ohun gbogbo nìkan.
- source_word: ὁ ἐπὶ πάντων
  choice: ẹni tí ó wà lórí gbogbo
  rationale: Èyí fi ipò gíga àti àṣẹ hàn láìfi akọ́lé míì tí kò sí nínú Gíríìkì kún ọ̀rọ̀ náà.
- source_word: διὰ πάντων
  choice: tí ó ń ṣiṣẹ́ nípasẹ̀ gbogbo
  rationale: Ọ̀rọ̀-ìṣe “ń ṣiṣẹ́” ni a fi kún un fún èdè Yorùbá àdánidá; “nípasẹ̀ gbogbo” pa ìtumọ̀ ọ̀nà tàbí aṣojú tí διά pẹ̀lú ẹ̀yà ajẹmọ́-orúkọ ń gbé jáde mọ́.
- source_word: ἐν πᾶσιν
  choice: tí ó sì wà nínú gbogbo
  rationale: Ìtumọ̀ tààrà yìí pa ìṣọ̀kan àtúnṣe “gbogbo” mọ́, kò sì sọ pàtó ohun tí “gbogbo” dúró fún.
theological_decisions:
- issue: Ìwọ̀n ohun tí πάντων / πᾶσιν kàn
  choice: A túmọ̀ gbogbo wọn sí “gbogbo” láìsọ pé “gbogbo ènìyàn,” “gbogbo onígbàgbọ́,” tàbí “ohun gbogbo.”
  alternative: “gbogbo ènìyàn,” “gbogbo onígbàgbọ́,” tàbí “ohun gbogbo”
  rationale: Àyíká ń sọ̀rọ̀ nípa ìṣọ̀kan ìjọ, ṣùgbọ́n Gíríìkì kò fi orúkọ tí àwọn fọ́ọ̀mù πᾶς náà ń ṣàpèjúwe hàn. Ìtumọ̀ gbooro náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ inú ẹsẹ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa àtúnṣe “gbogbo” mọ́ gẹ́gẹ́ bí ohun ìlù-ọ̀rọ̀ inú Gíríìkì. “Ni ó sì ń bẹ” so gbolohun náà mọ́ àtòjọ ẹsẹ 4–6 lọ́nà àdánidá; “ń ṣiṣẹ́” jẹ́ àfikún gírámà fún ìṣàn èdè Yorùbá, kì í ṣe ìdín ìwọ̀n “gbogbo” kù.
