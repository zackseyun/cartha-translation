  source_fidelity: Àtúnṣe kékeré ni a nílò. ‘Ó wí pé’ ń fi olùsọ̀rọ̀ ọkùnrin kan hàn, nígbà tí λέγει kò ní olùṣe tí a sọ nínú Gíríìkì. ‘A wí pé’ ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà àìṣiṣẹ́ni/àìpèníjà nínú Yorùbá, ó sì pa àìdánilójú olùsọ̀rọ̀ náà mọ́. ‘Ó mú ìgbèkùn ní ìgbèkùn’ pa àkànlò cognate náà mọ́ dáadáa ju ‘ó kó ìgbèkùn ní ìgbèkùn’ lọ, nítorí ‘mú ... ní ìgbèkùn’ túmọ̀ sí mímú ní ìgbèkùn.
  naturalness: Èdè àyọlò náà jẹ́ Yorùbá boṣewa, ṣùgbọ́n ‘a wí pé’ dára sí i ní ibi tí kò sí ẹni tí a ti dárúkọ gẹ́gẹ́ bí olùsọ̀rọ̀. Àwọn ìlà ewì àti ‘ó sì fi àwọn ẹ̀bùn fún àwọn ènìyàn’ wà ní ìṣàn Yorùbá adayeba.
  terminology: ‘Ìgbèkùn’ dára fún αἰχμαλωσίαν nínú àkànlò tó ń ṣe ìrántí Sáàmù 68:18. ‘Àwọn ẹ̀bùn’ ń fi ọ̀pọ̀ δόματα hàn kedere. ‘Àwọn ènìyàn’ jẹ́ ìtumọ̀ gbogbogbò tó yẹ fún τοῖς ἀνθρώποις, kì í sì í fi akọ-nìkan hàn.
