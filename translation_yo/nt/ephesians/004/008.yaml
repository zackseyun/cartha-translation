language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: yo
  text: 'Nítorí náà, a wí pé[a],


    “Nígbà tí ó gòkè lọ sí ibi gíga,

    ó mú ìgbèkùn ní ìgbèkùn[b],

    ó sì fi àwọn ẹ̀bùn fún àwọn ènìyàn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwé Mímọ́ wí pé.” Ọ̀rọ̀ Gíríìkì kò sọ ẹni tó ń wí ní pàtó.
    reason: source_ambiguity
  - marker: b
    text: Tàbí, “ó kó àwọn ìgbèkùn lọ,” tàbí “ó mú ọ̀pọ̀lọpọ̀ ẹlẹ́wọ̀n ní ìgbèkùn.” Gíríìkì lo ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ tí wọ́n jọ ara wọn nínú àkànlò-èdè alágbára kan tó ń ṣe ìrántí Sáàmù 68:18.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó pa agbára ìfèròsọ̀kan mọ́, ó sì so ọ̀rọ̀ àyọlò náà mọ́ ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa oore-ọ̀fẹ́ tí a fi fún olúkúlùkù.
- source_word: λέγει
  choice: ó wí pé
  rationale: Ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí, kò sì ní olùṣe tí a dárúkọ. Èdè yìí pa ìṣòro yẹn mọ́ láì fi ‘Ọlọ́run’ tàbí ‘Ìwé Mímọ́’ kún ọ̀rọ̀ Gíríìkì.
- source_word: Ἀναβὰς
  choice: Nígbà tí ó gòkè lọ
  rationale: Ó sọ ìṣe participle aorist náà ní Yorùbá àdánidá, ó sì fi hàn pé gígun lọ sókè náà ní í ṣe pẹ̀lú àwọn ìṣe pàtàkì tó tẹ̀ lé e.
- source_word: εἰς ὕψος
  choice: sí ibi gíga
  rationale: Ó mú àwòrán ibi gíga inú Sáàmù mọ́ láì yára sọ ibi náà di ‘ọ̀run,’ ohun tí gbólóhùn Gíríìkì fúnra rẹ̀ kò sọ ní tààràtà.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: ó kó ìgbèkùn ní ìgbèkùn
  rationale: Ìtumọ̀ yìí mọ̀ọ́mọ̀ pa àkànlò-èdè alágbára tí ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ Gíríìkì tí ó jọ ara wọn dá sílẹ̀ mọ́, pẹ̀lú ìró àyọlò Sáàmù 68:18.
- source_word: ἔδωκεν δόματα
  choice: ó sì fi ẹ̀bùn fún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá fún fífi ẹ̀bùn fún ẹnì kan.
- source_word: τοῖς ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: ἄνθρωποι níbí ń tọ́ka sí ènìyàn lápapọ̀; ‘àwọn ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá tó péye, tó sì ní ìtumọ̀ gbogbogbò yẹn.
theological_decisions:
- issue: Olùṣe ọ̀rọ̀-ìṣe λέγει kò hàn gbangba
  choice: ó wí pé
  alternative: Ìwé Mímọ́ wí pé
  rationale: A kò sọ olùṣe kan pàtó nínú Gíríìkì. Fífi ọ̀rọ̀ náà sílẹ̀ báyìí kò dá a lórí pé Ọlọ́run tàbí Ìwé Mímọ́ ni Pọ́ọ̀lù ń pè ní olùsọ̀rọ̀, bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé ó ń fa Ìwé Mímọ́ yọ.
- issue: Àkànlò-èdè ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: ó kó ìgbèkùn ní ìgbèkùn
  alternative: ó kó àwọn ìgbèkùn lọ; ó mú ọ̀pọ̀lọpọ̀ ẹlẹ́wọ̀n ní ìgbèkùn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àkànlò-èdè cognate tó mọ̀ọ́mọ̀ lágbára, ó sì ń dún bí Sáàmù 68:18. Ìtumọ̀ pàtàkì náà pa ìṣòro àti àwòrán ọ̀rọ̀ náà mọ́; àlàyé ìsàlẹ̀ ojú ìwé fúnni ní àwọn ọ̀nà Yorùbá tó rọrùn sí i láì pinnu irú àwọn ìgbèkùn náà.
- issue: Ìtumọ̀ τοῖς ἀνθρώποις nípa akọ àti abo
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì jẹ́ ti gbogbo ènìyàn, kì í ṣe ti ọkùnrin nìkan. ‘Àwọn ènìyàn’ pa ìtumọ̀ gbogbogbò náà mọ́ láì fi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò. A lo ‘wí’ nítorí pé ó bá ìforúkọsílẹ̀ àyọlò Ìwé Mímọ́ mu; a sì yà àyọlò náà sí ìlà mẹ́ta láti jẹ́ kí ìṣàn ọ̀rọ̀ ewì àti àwọn ìṣe rẹ̀ hàn kedere.
