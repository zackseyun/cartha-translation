  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: yo
  text: fún ìmúrasílẹ̀ àwọn ẹni mímọ́, fún iṣẹ́ ìránṣẹ́[a], àti fún ìkọ́lé ara Mèsáyà[c][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún iṣẹ́ sísìn.” Ọ̀rọ̀ Giriki διακονία lè túmọ̀ sí “ìránṣẹ́” tàbí “sísìn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ara Kristi.” A túmọ̀ oyè Giriki Χριστός sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè mọ́.
    reason: alternative_reading
  - marker: c
    text: 'A tún lè lóye Giriki náà gẹ́gẹ́ bí ìtẹ̀síwájú pé: “láti mú àwọn ẹni mímọ́ mura fún iṣẹ́ ìránṣẹ́, fún ìkọ́lé ara Mèsáyà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: fún mímú … gbára dì
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí mímú àwọn ènìyàn múra, jíjàrì wọn, àti mímú wọn yẹ fún iṣẹ́. ‘Mú … gbára dì’ jẹ́ Yorùbá àdánidá tí ó fi ìmúrasílẹ̀ àti ìmúni-lágbára hàn.
- source_word: τῶν ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Èyí pa ọ̀rọ̀ Pọ́ọ̀lù fún àwọn ènìyàn tí a yà sọ́tọ̀ fún Ọlọ́run mọ́, láìjẹ́ kí ó túmọ̀ sí kìkì àwọn ẹni tí ilé-ìjọsìn kan ti kéde ní ẹni mímọ́.
- source_word: εἰς ἔργον διακονίας
  choice: fún iṣẹ́ ìránṣẹ́
  rationale: διακονία lè túmọ̀ sí ìránṣẹ́ tàbí sísìn. ‘Iṣẹ́ ìránṣẹ́’ bá àyíká ìjọ mu, kò sì fi iṣẹ́ náà mọ́ àwọn olórí ìjọ nìkan.
- source_word: εἰς οἰκοδομὴν
  choice: fún gbígbé … ró
  rationale: οἰκοδομή lo àwòrán kíkọ́ ilé fún fífún àwùjọ ní okun. ‘Gbígbé … ró’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa àwòrán náà mọ́.
- source_word: τοῦ σώματος
  choice: ara
  rationale: σῶμα túmọ̀ sí ‘ara’; níbí ó jẹ́ àpèjúwe fún gbogbo àwọn ènìyàn Mèsáyà gẹ́gẹ́ bí àwùjọ kan.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, nígbà tí ‘Kristi’ wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ọ̀nà míì.
theological_decisions:
- issue: Ìbáṣepọ̀ gírámà láàárín àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta tí πρὸς àti εἰς bẹ̀rẹ̀
  choice: 'A gbé wọn kalẹ̀ gẹ́gẹ́ bí ète mẹ́ta tó wà ní ìpele kan: mímú àwọn ẹni mímọ́ gbára dì, iṣẹ́ ìránṣẹ́, àti gbígbé ara Mèsáyà ró.'
  alternative: 'A lè lóye wọn gẹ́gẹ́ bí ìtẹ̀síwájú: kí a mú àwọn ẹni mímọ́ gbára dì fún iṣẹ́ ìránṣẹ́, kí iṣẹ́ náà sì gbé ara Mèsáyà ró.'
  rationale: Ìtẹ̀lé Giriki πρὸς … εἰς … εἰς gba ìtumọ̀ méjèèjì láyè. Àkọ́kọ́ ọrọ̀ pa ìṣọ̀kan àwọn ète náà mọ́, àlàyé [c] sì fi òye ìtẹ̀síwájú hàn, láìdá àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa ẹni tí iṣẹ́ ìránṣẹ́ jẹ́ ti sílẹ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Mú … gbára dì’ yẹra fún ọ̀rọ̀ ìjọ àtijọ́ tó lè ṣókùnkùn, ó sì sọ ìmúrasílẹ̀ di ohun tí òǹkàwé òde òní lè lóye. A pa àwòrán ‘ara’ àti ‘gbígbé ró’ mọ́.
