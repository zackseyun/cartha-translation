  terminology: A lo “ènìyàn àtijọ́” fún τὸν παλαιὸν ἄνθρωπον. Ó ń pa ìtọ́kasí sí ènìyàn mọ́ láì mú kí ọ̀rọ̀ náà dà bí ó ń sọ nípa akọ nìkan, nítorí Yorùbá kò ní akọ-gírámà tó bá ti Gíríìkì mu. Àlàyé ìsàlẹ̀ ṣàlàyé ipa àpẹẹrẹ gbolohun náà.
