  source_fidelity: Ìtumọ̀ náà dá ìṣọ̀kan gbolohun infinitive, ìtọ́kasí sí ìgbé ayé àtẹ́lẹ̀, àti ìfẹ́kúfẹ̀ẹ́/ẹ̀tàn mọ́. Ṣùgbọ́n “ọkùnrin àtijọ́” lè túmọ̀ sí ọkùnrin arúgbó kan ní Yorùbá, ó sì fi ìdí akọ-nìkan múlẹ̀ ju ἄνθρωπος, tí ó jẹ́ ‘ènìyàn,’ lọ. Bákan náà, “ń dí ìbàjẹ́” kì í sọ ìtumọ̀ passive-progressive ti φθειρόμενον dáadáa.
