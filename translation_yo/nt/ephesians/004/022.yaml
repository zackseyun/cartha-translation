id: EPH.4.22
reference: Ephesians 4:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: yo
  text: láti bọ́ ènìyàn àtijọ́[a] sílẹ̀, ní ti ìgbé ayé yín tẹ́lẹ̀, ẹni tí ó ń bàjẹ́ ní ìbámu pẹ̀lú àwọn ìfẹ́kúfẹ̀ẹ́ ẹ̀tàn[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ara àtijọ́.” Ní tààrà, Gíríìkì ní “ènìyàn àtijọ́”; gbolohun náà ń tọ́ka sí ipò ènìyàn tàbí ọ̀nà ìgbé ayé àtẹ́lẹ̀, kì í ṣe àwọn ọkùnrin nìkan.
    reason: alternative_reading
  - marker: b
    text: Ní tààrà, “àwọn ìfẹ́kúfẹ̀ẹ́ ti ẹ̀tàn”; ìyẹn ni àwọn ìfẹ́kúfẹ̀ẹ́ tí ẹ̀tàn ń darí tàbí tí ó kún fún ẹ̀tàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: láti bọ́ ... sílẹ̀
  rationale: Ó pa àwòrán bí ẹni ń bọ aṣọ mọ́, ó sì bá ọ̀rọ̀ ‘wọ̀’ ní ẹsẹ 24 mu; ọ̀nà yìí tún pa ìrísí infinitive Gíríìkì mọ́.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: ní ti ìgbé ayé yín tẹ́lẹ̀
  rationale: Níhìn-ín κατά ń tọ́ka sí ohun tí ọ̀rọ̀ náà kàn, ἀναστροφή sì túmọ̀ sí ìwà tàbí ọ̀nà ìgbé ayé.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: ọkùnrin àtijọ́
  rationale: Èyí tẹ̀lé gbolohun akọ tó wà ní Gíríìkì, ó sì pa agbára àpẹẹrẹ ènìyàn àtijọ́ mọ́; àlàyé ìsàlẹ̀ fi hàn pé kì í ṣe àwọn ọkùnrin nìkan ni ó ń tọ́ka sí.
- source_word: φθειρόμενον
  choice: ẹni tí ó ń dí ìbàjẹ́
  rationale: Ó fi ipa tí a ń ṣe sí ẹni náà àti ìtẹ̀síwájú ìbàjẹ́ hàn, gẹ́gẹ́ bí participle present passive.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: ní ìbámu pẹ̀lú àwọn ìfẹ́kúfẹ̀ẹ́ ẹ̀tàn
  rationale: ‘Ní ìbámu pẹ̀lú’ fi ipa ìdarí κατά hàn; ‘ìfẹ́kúfẹ̀ẹ́’ jẹ́ ìfẹ́ líle tí kò dára, ‘ẹ̀tàn’ sì pa ìbáṣepọ̀ genitive mọ́ láì fi dandan pinnu bóyá ẹ̀tàn ló bí wọn tàbí ó ń ṣàpèjúwe wọn.
theological_decisions:
- issue: Ìtumọ̀ τὸν παλαιὸν ἄνθρωπον
  choice: ọkùnrin àtijọ́
  alternative: ẹni àtijọ́ / ara àtijọ́
  rationale: A pa ọ̀rọ̀ akọ tó jẹ́ àpẹẹrẹ ní Gíríìkì mọ́, ṣùgbọ́n àlàyé fi hàn pé ó dúró fún ipò tàbí ọ̀nà ìgbé ayé ènìyàn tẹ́lẹ̀, kì í ṣe akọ nìkan.
- issue: Agbára infinitive ἀποθέσθαι
  choice: láti bọ́ ... sílẹ̀
  alternative: kí ẹ bọ́ ... sílẹ̀ / pé ẹ ti bọ́ ... sílẹ̀
  rationale: Infinitive náà ni a pa mọ́ kí a má bàa pinnu láìjẹ́ dandan pé àṣẹ tàbí iṣẹlẹ̀ ìyípadà tó ti parí nìkan ni Pọ́ọ̀lù ń tẹnumọ́.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn kíkún. A lo ‘bọ́ ... sílẹ̀’ láti pa àwòrán aṣọ mọ́, a sì lo ‘ìgbé ayé’ dípò ọ̀rọ̀ líle fún conduct. Gbolohun náà mọ̀ọ́mọ̀ jẹ́ àjẹkù tó ń bá ẹsẹ tó ṣáájú lọ, gẹ́gẹ́ bí orísun Gíríìkì.
