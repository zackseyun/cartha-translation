  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: yo
  text: Ẹ máa ṣe gbogbo ìsapá láti pa ìṣọ̀kan ti Ẹ̀mí mọ́ nínú ìdè àlàáfíà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ fi ìtara pa ... mọ́,” tàbí “Ẹ tiraka láti dáàbò bo ...”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe jù lọ pé “Ẹ̀mí” ń tọ́ka sí Ẹ̀mí Mímọ́ níbí, bí ó tilẹ̀ jẹ́ pé àwọn kan gbà pé ó ń tọ́ka ní ọ̀nà gbogbogbò sí ẹ̀mí kan náà tí àwọn onígbàgbọ́ jọ ní.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: Ẹ máa sa gbogbo ipá
  rationale: Ọ̀rọ̀ yìí jẹ́ participle tí ó ń tẹ̀ lé ìṣírí inú ẹsẹ 1–2; ó fi ìtara àti ìsapá tọkàntọkàn hàn, kì í ṣe ìfẹ́ inú lásán.
- source_word: τηρεῖν
  choice: láti pa ... mọ́
  rationale: ‘Pa ... mọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí wọ́n ṣọ́ ohun tí ó ti wà, kí wọ́n má sì jẹ́ kí ó bàjẹ́; kò túmọ̀ sí pé kí wọ́n ṣẹ̀dá rẹ̀.
- source_word: ἑνότητα
  choice: ìṣọ̀kan
  rationale: ‘Ìṣọ̀kan’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún jíjẹ́ ọ̀kan nínú àwùjọ.
- source_word: τοῦ πνεύματος
  choice: ti Ẹ̀mí
  rationale: Nínú àyíká lẹ́tà Éfésù, ó ṣeé ṣe jù lọ pé πνεῦμα ń tọ́ka sí Ẹ̀mí Mímọ́; lílo lẹ́tà ńlá fi ìtumọ̀ yìí hàn láìpa àlàyé mìíràn rẹ́.
- source_word: ἐν
  choice: nínú
  rationale: ‘Nínú’ pa àwòrán ibi tàbí ọ̀nà tí a ti ń pa ìṣọ̀kan mọ́ mọ́.
- source_word: συνδέσμῳ
  choice: ìdè
  rationale: ‘Ìdè’ pa àkàwé ohun tí ó so àwọn ènìyàn pọ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá ṣókí tí ó yéni.
- source_word: τῆς εἰρήνης
  choice: àlàáfíà
  rationale: Gbólóhùn ‘ìdè àlàáfíà’ tẹ̀ lé ìbáṣepọ̀ genitive orísun náà, ó sì jẹ́ kí àlàáfíà farahàn gẹ́gẹ́ bí ohun tí ó so àwọn onígbàgbọ́ pọ̀.
theological_decisions:
- issue: Ohun tí πνεύματος ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ẹ̀mí ìṣọ̀kan tí àwọn onígbàgbọ́ jọ ní
  rationale: Àwọn ibi tí ó sún mọ́ ọn nínú Éfésù, pàápàá 4:4 àti 4:30, ń tọ́ka sí Ẹ̀mí Ọlọ́run. Síbẹ̀, àkọ́silẹ̀ ìsàlẹ̀ pa ìtumọ̀ gbogbogbò mìíràn mọ́.
- issue: Irú ìṣọ̀kan tí a mẹ́nu kàn
  choice: ìṣọ̀kan tí ó ti wà, tí a ní láti pa mọ́
  alternative: ìṣọ̀kan tí àwọn onígbàgbọ́ ní láti dá sílẹ̀
  rationale: τηρεῖν túmọ̀ sí pípa tàbí ṣíṣọ́ ohun tí ó ti wà mọ́, kì í ṣe dídá ohun tuntun sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. ‘Ẹ máa sa gbogbo ipá’ jẹ́ ìṣírí tí ó ń bá a lọ, ‘pa ... mọ́’ sì fi hàn pé ìṣọ̀kan náà ti wà tẹ́lẹ̀. Gbólóhùn ‘ìdè àlàáfíà’ pa àkàwé Gíríìkì mọ́ láìdi èdè àjèjì.
