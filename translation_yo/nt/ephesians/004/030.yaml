id: EPH.4.30
reference: Ephesians 4:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: yo
  text: Ẹ má sì ṣe mú Ẹ̀mí Mímọ́ Ọlọ́run ní ìbànújẹ́, nínú ẹni tí a fi èdìdì dì yín mọ́ fún ọjọ́ ìràpadà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “nínú ẹni tí a fi èdìdì dì yín mọ́ títí di ọjọ́ ìràpadà.” Ní èdè Gíríìkì, ó ní “fún ọjọ́ ìràpadà” (εἰς ἡμέραν ἀπολυτρώσεως), èyí tí a lè lóye gẹ́gẹ́ bí ìtọ́kasí sí ọjọ́ iwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: mú … bínú
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú ẹni ní ìbànújẹ́ tàbí ìrora ọkàn. Nínú Yorùbá àdánidá, “mú … bínú” lè sọ ìbáṣepọ̀ ti ara ẹni tí ọ̀rọ̀ Gíríìkì ní, láì sọ ọ́ di ẹ̀ṣẹ̀ lásán tàbí àìgbọ́ràn.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: Ẹ̀mí Mímọ́ Ọlọ́run
  rationale: Ó pa gbogbo gbólóhùn Gíríìkì mọ́, pẹ̀lú “Ọlọ́run,” ó sì jẹ́ orúkọ tí ó mọ́gbọ́n dání, tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ἐν ᾧ
  choice: ẹni tí a fi
  rationale: “Ẹni tí” tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni, nígbà tí “a fi” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ἐν hàn ní ìtumọ̀ ohun èlò tàbí aṣojú, láì sọ Ẹ̀mí di ohun aláìlẹ́mìí.
- source_word: ἐσφραγίσθητε
  choice: ṣe èdìdì sí yín
  rationale: Ó pa àwòrán èdìdì ti ọ̀rọ̀ Gíríìkì mọ́, ó sì fi ìṣe àìṣe-tara ẹni ti aorist passive hàn ní Yorùbá.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: fún ọjọ́ ìràpadà
  rationale: “Fún” pa ìdarí sí ibi-afẹ́de tàbí àbájáde tí εἰς ní mọ́; “ọjọ́ ìràpadà” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ ìmúṣẹ ọjọ́ iwájú náà.
theological_decisions:
- issue: Ìtọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni nínú gbólóhùn alátọ́ka
  choice: ẹni tí a fi
  alternative: èyí tí a fi
  rationale: Bí ó tilẹ̀ jẹ́ pé ᾧ jẹ́ akọ-orúkọ arọ́pò neuter nítorí ìbámu gírámà pẹ̀lú πνεῦμα, “ẹni tí” jẹ́ kí ìtọ́ka ti ara ẹni tí àyíká ọ̀rọ̀ fi hàn dúró, níwọ̀n bí a ti lè mú Ẹ̀mí Mímọ́ bínú.
- issue: Ìbáṣepọ̀ èdìdì pẹ̀lú ọjọ́ ìràpadà
  choice: fún ọjọ́ ìràpadà
  alternative: títí di ọjọ́ ìràpadà
  rationale: “Fún” pa agbára ibi-afẹ́de ti εἰς mọ́, láì fi dandan sọ ọ́ di àkókò tí èdìdì náà máa parí tàbí láì gbé ètò ẹ̀kọ́ ìgbàgbọ́ kan wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “Ẹ má …” fún àṣẹ sí ọ̀pọ̀ ènìyàn, a sì pa àwòrán “èdìdì” àti àìdánilójú kékeré inú εἰς mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ojú ìwé.
