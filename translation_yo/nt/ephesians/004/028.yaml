- from: Ẹni tí ó ń jalè kò gbọdọ̀ jalè mọ́. Kàkà bẹ́ẹ̀, kí ó ṣiṣẹ́ kára, kí ó máa fi ọwọ́ ara rẹ̀ ṣe iṣẹ́ rere,[a] kí ó lè ní ohun tí yóò máa pín pẹ̀lú ẹni tí ó wà nínú àìní.[b]
  to: Ẹni tí ó ń jalè kò gbọdọ̀ jalè mọ́. Kàkà bẹ́ẹ̀, kí ó ṣiṣẹ́ kára, kí ó máa fi ọwọ́ ara rẹ̀ ṣe iṣẹ́ rere,[a] kí ó lè ní ohun láti pín fún ẹni tí ó ní àìní.[b]
  rationale: A tún “pín pẹ̀lú” ṣe sí “pín fún” láti fi dátífù olùgbà nínú Gíríìkì hàn láì sọ ìtumọ̀ náà di dídín. A tún àlàyé ìsàlẹ̀ b ṣe kí ó má ba a ní ohun-ìní “rẹ̀” tí orísun kò sọ, kí ó sì jẹ́ àṣàyàn gidi fún ‘ẹni tí ó ní àìní.’ Àwọn ìyókù ni a pa mọ́.
