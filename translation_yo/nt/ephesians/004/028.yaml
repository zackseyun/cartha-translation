  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ìtumọ̀ Gíríìkì ní gbogbogbòò: ó dá ìwà jíjà dúró, ó pàṣẹ iṣẹ́ takuntakun nípa ohun rere, ó sì fi ète àjọpín fún ẹni aláìní hàn. Síbẹ̀, “pín pẹ̀lú ẹni” lè túmọ̀ sí àjọpín papọ̀ dípò fífún olùgbà, níbi tí dátífù τῷ χρείαν ἔχοντι ti tọ́ka sí ẹni tí a máa fún. Àlàyé ìsàlẹ̀ b náà ní “ẹni tí ó nílò rẹ̀,” èyí tí ó ní ìtumọ̀ ‘ẹni tí ó nílò rẹ̀/ohun náà’ dípò ‘ẹni tí ó ní àìní.’'
