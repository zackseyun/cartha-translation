id: EPH.4.28
reference: Ephesians 4:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: yo
  text: Ẹni tí ó ń jalè kò gbọdọ̀ jalè mọ́. Kàkà bẹ́ẹ̀, kí ó ṣiṣẹ́ kára, kí ó máa fi ọwọ́ ara rẹ̀ ṣe iṣẹ́ rere,[a] kí ó lè ní ohun láti pín fún ẹni tí ó ní àìní.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó máa fi ọwọ́ ara rẹ̀ ṣe ohun tí ó dára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún ẹni tí ó wà nínú àìní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: Ẹni tí ó ń jalè
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláṣẹ̀ṣe yìí ń tọ́ka sí ẹni tí ìṣe jíjà jẹ́ àṣà rẹ̀; “ẹni tí ó ń jalè” pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ mọ́ láì fi àmì-orúkọ líle bí “olè” lé ẹni náà lórí.
- source_word: μηκέτι κλεπτέτω
  choice: kò gbọdọ̀ jalè mọ́
  rationale: Ó sọ àṣẹ pé kí ìṣe tí ó ti wà tẹ́lẹ̀ dáwọ́ dúró. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: μᾶλλον δὲ
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín jíjà àti ìwà tuntun tí a pàṣẹ.
- source_word: κοπιάτω
  choice: kí ó ṣiṣẹ́ kára
  rationale: κοπιάω túmọ̀ sí ṣíṣe iṣẹ́ pẹ̀lú ìsapá, kì í ṣe iṣẹ́ lásán; “ṣiṣẹ́ kára” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ èyí.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: kí ó máa fi ọwọ́ ara rẹ̀ ṣe iṣẹ́ rere
  rationale: Gbólóhùn náà tẹnumọ́ iṣẹ́ olóòtítọ́ tí ẹni náà fúnra rẹ̀ ń ṣe. “Iṣẹ́ rere” sọ τὸ ἀγαθόν ní ọ̀nà àdánidá, bí ó tilẹ̀ jẹ́ pé “ohun tí ó dára” tún ṣeé ṣe.
- source_word: ἵνα ἔχῃ
  choice: kí ó lè ní ohun
  rationale: Ó pa ète tí ἵνα àti ọ̀rọ̀-ìṣe abẹ́ṣọ̀rọ̀ rẹ̀ fi hàn mọ́. A fi “ohun” kún un ní Yorùbá nítorí ohun tí yóò pín ni ọ̀rọ̀-ìṣe tó tẹ̀ lé ń tọ́ka sí.
- source_word: μεταδιδόναι
  choice: tí yóò máa pín pẹ̀lú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ohun tirẹ̀ ṣe àjọpín; “pín pẹ̀lú” pa ìtumọ̀ ìwà ọ̀làwọ́ àti àjọṣe mọ́.
- source_word: τῷ χρείαν ἔχοντι
  choice: ẹni tí ó wà nínú àìní
  rationale: Èyí tọ́ka sí olùgbà tí ó ní àìní. Ọ̀rọ̀ Yorùbá yìí ṣe kedere, ó sì yẹ fún ìforúkọsílẹ̀ ọlọ́lá.
theological_decisions:
- issue: Ète iṣẹ́ olóòtítọ́
  choice: Ẹsẹ̀ náà gbé iṣẹ́ olóòtítọ́ kalẹ̀ gẹ́gẹ́ bí ohun tí yóò rọ́pò jíjà àti ọ̀nà láti fi ṣe àjọpín pẹ̀lú ẹni tí ó wà nínú àìní.
  alternative: Kí a ka àfojúsùn rẹ̀ sí pípa ara ẹni mọ́ nìkan, tàbí sí sísan ohun tí a ti jí padà ní pàtàkì.
  rationale: Gbólóhùn ète náà, “kí ó lè ní ohun tí yóò máa pín,” fi ìwà ọ̀làwọ́ sí ẹni aláìní sí iwájú. Pípa ara ẹni mọ́ lè wà nínú rẹ̀, ṣùgbọ́n a kò fi ẹ̀kọ́ mìíràn tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ṣiṣẹ́ kára” mú agbára κοπιάω jáde, “fi ọwọ́ ara rẹ̀” sì pa àwòrán iṣẹ́ ẹni fúnra rẹ̀ mọ́. A yà àwọn àṣàyàn ìtumọ̀ tó ṣeé ṣe sí àlàyé ìsàlẹ̀ láì dá ìtumọ̀ tó ní ààyè méjì pinnu ju bí orísun ṣe ṣe lọ.
