id: EPH.4.10
reference: Ephesians 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: yo
  text: Ẹni tí ó sọ̀kalẹ̀ náà gan-an ni ẹni tí ó tún gòkè lọ lókè gbogbo àwọn ọ̀run,[a] kí ó lè kún ohun gbogbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ga ju gbogbo àwọn ọ̀run lọ.” Gbólóhùn náà lè tẹnu mọ́ pé ipò rẹ̀ ga ju gbogbo agbègbè ọ̀run lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mú ohun gbogbo ṣẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “mú ṣẹ” ní àwọn àyíká kan, ṣùgbọ́n “kún” bá àyíká ọ̀rọ̀ yìí mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Ẹni tí ó sọ̀kalẹ̀
  rationale: Ọ̀rọ̀ alábápín aorist tí ó ní arítíkù dúró gẹ́gẹ́ bí orúkọ; gbólóhùn ìbátan yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtọ́kasí ẹni náà mọ́.
- source_word: αὐτός ἐστιν καὶ
  choice: náà gan-an ni ẹni tí ó tún
  rationale: “Gan-an” tẹnu mọ́ pé ẹni kan náà ni ó sọ̀kalẹ̀, tí ó sì gòkè; “tún” fi ìbáramu καὶ hàn láìṣe àfikún ìtumọ̀.
- source_word: ὁ ἀναβὰς
  choice: ẹni tí ó tún gòkè lọ
  rationale: A tú ọ̀rọ̀ alábápín tí ó dúró gẹ́gẹ́ bí orúkọ sí gbólóhùn ìbátan, ní ìbámu pẹ̀lú ὁ καταβὰς.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: sí ibi tí ó ga ju gbogbo àwọn ọ̀run lọ
  rationale: Ìtumọ̀ yìí mú ìrìn sí òkè àti ipò tí ó ga rékọjá gbogbo àwọn ọ̀run jáde, ó sì pa ọ̀pọ̀ nọ́ńbà οὐρανῶν mọ́.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète tàbí àfojúsùn hàn ní Yorùbá àdánidá.
- source_word: πληρώσῃ
  choice: kún
  rationale: “Kún” ni ìtumọ̀ tó bá àyíká ọ̀rọ̀ mu jù fún πληρόω, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí “mú ... ṣẹ” ní àwọn àyíká mìíràn.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtẹ̀sí gbogbo-gbòò ọ̀rọ̀ Gíríìkì mọ́ láìdín in kù sí àwọn ènìyàn tàbí ṣàlàyé rẹ̀ sí gbogbo àgbáyé.
theological_decisions:
- issue: Ẹni tí ó sọ̀kalẹ̀ àti ẹni tí ó gòkè jẹ́ ẹni kan náà
  choice: A lo “náà gan-an” láti tẹnu mọ́ ìdánimọ̀ ẹni kan náà.
  alternative: Láti sọ ìsọ̀kalẹ̀ àti ìgòkè nìkan láìtẹnu mọ́ pé ẹni kan náà ni.
  rationale: αὐτός àti àtúnlò àwọn ọ̀rọ̀ alábápín olórúkọ fi ìdánimọ̀ ẹni kan náà hàn kedere; ìtumọ̀ náà pa ìtẹnumọ́ yìí mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- issue: Ààlà ìtumọ̀ τὰ πάντα
  choice: ohun gbogbo
  alternative: gbogbo ènìyàn; gbogbo àgbáyé
  rationale: Ọ̀rọ̀ náà gbòòrò, kò sì sọ ibi tí ààlà rẹ̀ dé ní pàtó. “Ohun gbogbo” pa àìdánilójú àti ìtẹ̀sí ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa ọ̀pọ̀ nọ́ńbà “àwọn ọ̀run” àti ìtẹnumọ́ ìdánimọ̀ ẹni kan náà mọ́.
