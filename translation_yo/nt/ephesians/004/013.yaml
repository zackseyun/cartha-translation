id: EPH.4.13
reference: Ephesians 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: yo
  text: títí gbogbo wa yóò fi dé ìṣọ̀kan nínú ìgbàgbọ́ àti nínú ìmọ̀ nípa Ọmọ Ọlọ́run, dé ọkùnrin tí ó dàgbà dénú, dé òṣùwọ̀n ìdàgbàsókè ti ẹ̀kúnrẹ́rẹ́ Mèsáyà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέχρι
  choice: títí ... yóò fi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi òpin tàbí àfojúsùn iṣẹ́ tí a mẹ́nu kàn ṣáájú hàn.
- source_word: καταντήσωμεν οἱ πάντες
  choice: gbogbo wa yóò fi dé
  rationale: “Dé” pa àwòrán dídé ibi àfojúsùn mọ́, “gbogbo wa” sì fi hàn pé gbogbo àwùjọ àwọn onígbàgbọ́ ni ọ̀rọ̀ náà kàn.
- source_word: εἰς τὴν ἑνότητα
  choice: dé ìṣọ̀kan
  rationale: “Ìṣọ̀kan” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún unity; àtúnlò “dé” tún pa ìtẹ̀lé εἰς mẹ́ta nínú Gíríìkì mọ́ dé ìwọ̀n tí Yorùbá fi gbà.
- source_word: τῆς πίστεως
  choice: ìgbàgbọ́
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìgbàgbọ́ tí àwùjọ Kristẹni jọ dì mú tàbí sí gbígbẹ́kẹ̀lé Ọlọ́run; ìtumọ̀ yìí kò dá àìdánilójú náà pa.
- source_word: ἐπιγνώσεως
  choice: ìmọ̀
  rationale: “Ìmọ̀” jẹ́ àdánidá, ó sì yẹra fún fífi ìtumọ̀ “ìmọ̀ jíjinlẹ̀” tàbí “ìmọ̀ kíkún” mú Gíríìkì ju bó ṣe pọndandan lọ.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó túmọ̀ àkọlé Kristi náà ní tààrà, Ọlọ́run sì jẹ́ ẹni tí Ọmọ náà jẹ́ tirẹ̀ àti ẹni tí a mọ̀.
- source_word: εἰς ἄνδρα τέλειον
  choice: dé ọkùnrin tí ó dàgbà dénú
  rationale: “Ọkùnrin” pa àwòrán akọ ẹyọ kan nínú Gíríìkì mọ́ fún ìdàgbà àpapọ̀ ìjọ; “dàgbà dénú” sọ τέλειος ní ìtumọ̀ ìdàgbà kíkún dípò àìlábùkù.
- source_word: μέτρον
  choice: òṣùwọ̀n
  rationale: “Òṣùwọ̀n” pa èrò ìwọ̀n tàbí àmì ìpele tí a ń dé mọ́.
- source_word: ἡλικίας
  choice: ìdàgbàsókè
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ìpele ìdàgbà tàbí ìga ẹni tí ó ti dàgbà; “ìdàgbàsókè” jẹ́ kedere ní Yorùbá, bí ó tilẹ̀ jẹ́ pé “ìga” tún ṣeé ṣe.
- source_word: τοῦ πληρώματος
  choice: ẹ̀kúnrẹ́rẹ́
  rationale: “Ẹ̀kúnrẹ́rẹ́” pa èrò πλήρωμα, ìyẹn kíkún tàbí gbogbo ohun tó pé, mọ́ láì sọ ọ́ di àlàyé ẹ̀kọ́ ìsìn kan pàtó.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí àkọlé Ẹni Àmì-Òróró níbí; “Mèsáyà” mú agbára àkọlé náà jáde.
theological_decisions:
- issue: Ìtumọ̀ τῆς πίστεως
  choice: ìgbàgbọ́, pẹ̀lú àfojúsùn sí ìgbàgbọ́ tí àwùjọ jọ dì mú
  alternative: ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé olúkúlùkù onígbàgbọ́
  rationale: Àyíká ìṣọ̀kan gbogbo ara àti lílo akọ́tọ̀ Gíríìkì ṣe àtìlẹ́yìn fún ìtumọ̀ àwùjọ, ṣùgbọ́n ọ̀rọ̀ àkọ́kọ́ kò fi ìtumọ̀ kejì sílẹ̀ pátápátá; àlàyé ìsàlẹ̀ pa méjèèjì mọ́.
- issue: Àwòrán εἰς ἄνδρα τέλειον
  choice: ọkùnrin tí ó dàgbà dénú
  alternative: ìpele ìdàgbà kíkún tàbí ipò àgbà
  rationale: Gíríìkì lo akọ ẹyọ kan gẹ́gẹ́ bí àwòrán fún gbogbo ìjọ. A pa àwòrán yẹn mọ́, a sì ṣàlàyé agbára àpapọ̀ rẹ̀ ní àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká ẹ̀kọ́ nípa ìjọ tí ń dàgbà sínú ẹ̀kúnrẹ́rẹ́ ẹni tí Ọlọ́run fi àmì òróró yàn, agbára àkọlé náà hàn gbangba; “Kristi” ṣì jẹ́ àṣàyàn ìtumọ̀ tí ó wọ́pọ̀.
- issue: Ìbáṣepọ̀ ἡλικίας àti πληρώματος
  choice: ìdàgbàsókè ẹ̀kúnrẹ́rẹ́ Mèsáyà
  alternative: ìga tàbí ìpele ìdàgbà tí ẹ̀kúnrẹ́rẹ́ Mèsáyà ń fi hàn
  rationale: Àwọn ọ̀rọ̀ Gíríìkì tí a tò jọ lè fa ìtumọ̀ sí ìga, ọjọ́-orí, tàbí ìdàgbà kíkún. A pa ìsopọ̀ wọn mọ́ ní ṣókí láì pinnu àlàyé ẹ̀kọ́ ìsìn kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Àtúnlò “dé” ń tẹ̀lé ìgbésẹ̀ mẹ́ta ti εἰς nínú Gíríìkì. A mọ̀ọ́mọ̀ pa àwòrán “ọkùnrin” àti èdè “ẹ̀kúnrẹ́rẹ́” mọ́, bí ó tilẹ̀ jẹ́ pé wọ́n ní ìwọ̀n àjèjì díẹ̀ ní Yorùbá, nítorí wọ́n ṣe pàtàkì sí àwòrán ìdàgbà àpapọ̀ nínú ẹsẹ náà.
