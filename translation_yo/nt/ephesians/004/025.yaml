id: EPH.4.25
reference: Ephesians 4:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: yo
  text: Nítorí náà, ẹ fi irọ́ silẹ[a]; kí olúkúlùkù máa sọ òtítọ́ pẹ̀lú aládùúgbò rẹ̀, nítorí pé a jẹ́ ẹ̀yà ara ti ara wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “irọ́ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí a fà jáde láti inú ìṣírí tó ṣáájú hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἀποθέμενοι
  choice: ẹ ti mú ... kúrò
  rationale: Ọ̀rọ̀ ìṣe àdápọ̀ aorist yìí dúró gẹ́gẹ́ bí ohun tí ó bá àṣẹ pàtàkì náà rìn tàbí ohun tí ó yẹ kí ó ti ṣẹlẹ̀; ìtumọ̀ yìí fi ìkọ̀sílẹ̀ irọ́ hàn kedere.
- source_word: τὸ ψεῦδος
  choice: irọ́
  rationale: Ní àyíká ìkìlọ̀ ìwà rere yìí, ó ń tọ́ka sí irọ́ àti ẹ̀tàn gẹ́gẹ́ bí ìwà kan lápapọ̀. Àmì ìdámọ̀ inú Gíríìkì tún jẹ́ kí ‘irọ́ náà’ ṣeé ṣe, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: λαλεῖτε ἀλήθειαν ἕκαστος
  choice: kí olúkúlùkù sọ òtítọ́
  rationale: Ó pa ipa àṣẹ ọ̀rọ̀ ìṣe náà àti agbára pínpín ἕκαστος mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: fún aládùúgbò rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé μετά pẹ̀lú genitive túmọ̀ sí ìbáṣepọ̀ ‘pẹ̀lú,’ Yorùbá máa ń sọ ‘sọ òtítọ́ fún ẹnìkan’; ‘aládùúgbò’ pa ìtumọ̀ ìwà rere àti àjọṣe πλησίον mọ́.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó mú ìdí tí a fi pa àṣẹ náà jáde ní kedere.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: ẹ̀yà ara ara wa ni wá
  rationale: Ó pa àwòrán ara kan tí μέλη gbé kalẹ̀ mọ́, ó sì fi hàn pé àwọn onígbàgbọ́ so mọ́ ara wọn, tí ọ̀kọ̀ọ̀kan sì jẹ́ ẹ̀yà ara tí ó jẹ́ ti àwọn yòókù.
theological_decisions:
- issue: Ìtànkálẹ̀ àṣẹ sí olúkúlùkù nínú ìjọ
  choice: kí olúkúlùkù ... fún aládùúgbò rẹ̀
  alternative: kí ẹnì kọ̀ọ̀kan ... fún ẹni tí ó wà lẹ́gbẹ̀ẹ́ rẹ̀
  rationale: ‘Olúkúlùkù’ àti ‘rẹ̀’ pa ọ̀nà aṣojú ẹyọ kan ti Gíríìkì mọ́ láì fi ìtumọ̀ náà mọ́ ọkùnrin nìkan; àṣẹ náà kan gbogbo ìjọ.
- issue: Ìwọ̀n ìtumọ̀ ψεῦδος
  choice: irọ́
  alternative: irọ́ náà
  rationale: Àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa ìwà ẹ̀tàn lápapọ̀, ṣùgbọ́n àpilẹ̀kọ Gíríìkì jẹ́ kí ìtumọ̀ pàtó ‘irọ́ náà’ ṣeé ṣe; a fi aṣàyàn náà sínú àlàyé ìsàlẹ̀.
- issue: Àwòrán ara nínú ἀλλήλων μέλη
  choice: ẹ̀yà ara ara wa ni wá
  alternative: a jẹ́ ẹ̀yà ara kan náà, a sì jẹ́ ti ara wa
  rationale: Ìtumọ̀ tí a yàn pa ọ̀rọ̀ ìfọwọ́sowọ́pọ̀ ‘ti ara wa’ àti àwòrán ara mọ́, láì tú ìdè ẹ̀kọ́ ìsìn inú ọ̀rọ̀ náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn ‘ẹ’ bá àwọn olùgbọ́ ọ̀pọ̀ nínú Gíríìkì mu, nígbà tí ‘olúkúlùkù ... rẹ̀’ pa ipa pínpín ẹyọ kan mọ́. A yan ‘fún aládùúgbò rẹ̀’ dípò ìtumọ̀ gígùn ‘pẹ̀lú aládùúgbò rẹ̀’ nítorí pé bẹ́ẹ̀ ni ọ̀rọ̀ ‘sọ òtítọ́’ ṣe rí ní Yorùbá àdánidá.
