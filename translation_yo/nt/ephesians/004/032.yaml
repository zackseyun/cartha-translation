id: EPH.4.32
reference: Ephesians 4:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: yo
  text: Ẹ máa jẹ́ onínú rere sí ara yín, kí ẹ sì máa ní ọkàn àánú, kí ẹ máa dárí jì ara yín, gẹ́gẹ́ bí Ọlọ́run ti dárí jì yín nínú Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi.”
    reason: Ìtumọ̀ ìbílẹ̀ fún oyè Χριστός.
lexical_decisions:
- source_word: γίνεσθε
  choice: Ẹ máa ṣe
  rationale: Àṣẹ ìsinsìnyí náà ń pe wọn sí ìwà tí yóò máa bá a lọ; ọ̀rọ̀ yìí sì bá Yorùbá àdánidá mu nínú gbólóhùn ‘ṣe inú rere’.
- source_word: εἰς ἀλλήλους
  choice: sí ara yín
  rationale: 'Ó fi ìtọ́sọ́nà ìbáṣepọ̀ àti ìṣe alábàápín hàn: olúkúlùkù sí ẹnì kejì.'
- source_word: χρηστοί
  choice: ṣe inú rere
  rationale: Ó túmọ̀ sí jíjẹ́ onínú rere tàbí aláàánú nínú ìbáṣepọ̀; ‘ṣe inú rere’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: εὔσπλαγχνοι
  choice: ní ọkàn àánú
  rationale: Ó ń tọ́ka sí àánú jíjinlẹ̀ tí ó ti inú ọkàn wá, láì da ìtumọ̀ rẹ̀ pọ̀ mọ́ ‘inú rere’.
- source_word: χαριζόμενοι
  choice: máa dárí ji
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi ẹ̀ṣẹ̀ tàbí àṣìṣe sílẹ̀; àfiwé pẹ̀lú ìṣe Ọlọ́run mú ìtumọ̀ ìdáríjì dájú.
- source_word: ἑαυτοῖς
  choice: ara yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà jẹ́ arọ́pò-orúkọ afara-ẹni ní ìrísí rẹ̀, ní ọ̀pọ̀ ènìyàn ó ní agbára alábàápín, ìyẹn ‘ẹnì kọ̀ọ̀kan sí ẹnì kejì’.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí
  rationale: Ó pa àfiwé tó lágbára mọ́ láì mú kí Yorùbá di wúwo tàbí àtúnsọ.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni olùṣe ìṣe nínú gbólóhùn náà, ó sì jẹ́ ìtumọ̀ tààrà.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: ‘Nínú’ pa ἐν mọ́ láì pinnu bóyá ó túmọ̀ sí ààyè ìrẹ́pọ̀ tàbí ọ̀nà ìṣe; ‘Mèsáyà’ sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè.
- source_word: ἐχαρίσατο
  choice: ti dárí jì
  rationale: Aorist náà ń tọ́ka sí ìṣe ìdáríjì Ọlọ́run tí a gbé kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ.
- source_word: ὑμῖν
  choice: yín
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ ènìyàn kejì ni, ó sì jẹ́ ẹni tí Ọlọ́run dárí jì.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; ‘Mèsáyà’ sọ ìtumọ̀ oyè náà jáde. A fi ‘Kristi’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀.
- issue: Agbára ἐν nínú ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nípasẹ̀ Mèsáyà
  rationale: ‘Nínú’ pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́, dípò yíyan ìtumọ̀ ohun-èlò ‘nípasẹ̀’ nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àtúnṣe ‘ẹ máa…’ fi hàn pé àṣẹ náà jẹ́ ìwà tí ó yẹ kí ó máa bá a lọ; ìtòlẹ́sẹẹsẹ náà sì pa ìyàtọ̀ láàárín inú rere, ọkàn àánú, àti ìdáríjì mọ́.
