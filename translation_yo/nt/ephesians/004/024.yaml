id: EPH.4.24
reference: Ephesians 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: yo
  text: kí ẹ sì gbé ènìyàn tuntun[a] wọ̀, ẹni tí a dá ní ìbámu pẹ̀lú Ọlọ́run[b], nínú òdodo[c] àti ìjẹ́mímọ́ ti òtítọ́[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ara tuntun” tàbí “ẹni tuntun.” Ní Gíríìkì, “ènìyàn tuntun” ni, èyí tó bá “ènìyàn àtijọ́” mu nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “gẹ́gẹ́ bí Ọlọ́run” tàbí “ní àwòrán Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: “Òdodo” tún lè túmọ̀ sí “ìdájọ́ òdodo” níhìn-ín.
    reason: alternative_reading
  - marker: d
    text: A tún lè túmọ̀ rẹ̀ sí “òdodo àti ìjẹ́mímọ́ tòótọ́,” tàbí “òdodo àti ìjẹ́mímọ́ tí ó wá láti inú òtítọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: gbé … wọ̀
  rationale: Ó pa àkàwé aṣọ mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ènìyàn fi ohun kan wọ̀.
- source_word: καινὸν ἄνθρωπον
  choice: ènìyàn tuntun
  rationale: “Ènìyàn” bá ἄνθρωπος mu ní èdè Yorùbá, ó sì pa ìsopọ̀ mọ́ “ènìyàn àtijọ́” nínú àyíká ọ̀rọ̀ láì sọ ọ́ di ọkùnrin nìkan.
- source_word: κατὰ θεὸν
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  rationale: Ó fi ìtumọ̀ ìbámu tàbí títẹ̀lé àpẹẹrẹ Ọlọ́run hàn, láì fi “ní àwòrán Ọlọ́run” kún ọ̀rọ̀ Gíríìkì.
- source_word: κτισθέντα
  choice: ẹni tí a dá
  rationale: Ó mú ohùn àìṣe ti participle náà àti èrò ìṣẹ̀dá dúró, ó sì ń tọ́ka sí “ènìyàn tuntun.”
- source_word: δικαιοσύνῃ
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún ìwà títọ́ níwájú Ọlọ́run, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ ìdájọ́ òdodo.
- source_word: ὁσιότητι
  choice: ìjẹ́mímọ́
  rationale: Ó sọ ìwà mímọ́ àti ìfọkànsìn sí ohun tí ó jẹ́ ti Ọlọ́run ní èdè Yorùbá tó ṣe kedere.
- source_word: τῆς ἀληθείας
  choice: ti òtítọ́
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ genitive Gíríìkì mọ́, kò sì fi dandan pinnu bóyá òtítọ́ ń ṣàpèjúwe àwọn ànímọ́ náà tàbí pé láti inú òtítọ́ ni wọ́n ti wá.
theological_decisions:
- issue: Ìtumọ̀ “ènìyàn tuntun”
  choice: ènìyàn tuntun
  alternative: ara tuntun; ẹni tuntun
  rationale: Ó pa àwòrán ènìyàn aṣojú àti ìtakora rẹ̀ sí “ènìyàn àtijọ́” mọ́. Ní Yorùbá, “ènìyàn” kò dá lórí akọ tàbí abo, nítorí náà kò yẹ kí a fi “ọkùnrin” dín ìtumọ̀ rẹ̀ kù.
- issue: Ìbáṣepọ̀ κατὰ θεὸν
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  alternative: gẹ́gẹ́ bí Ọlọ́run; ní àwòrán Ọlọ́run
  rationale: Àṣàyàn náà pa èrò ìbámu mọ́ láì pinnu pé ọ̀rọ̀ náà túmọ̀ sí àwòrán tàbí ìrí Ọlọ́run ní pàtó.
- issue: Ìṣe τῆς ἀληθείας lórí àwọn ọ̀rọ̀ méjèèjì
  choice: òdodo àti ìjẹ́mímọ́ ti òtítọ́
  alternative: òdodo àti ìjẹ́mímọ́ tòótọ́; òdodo àti ìjẹ́mímọ́ tí ó wá láti inú òtítọ́
  rationale: Genitive náà lè ṣàpèjúwe òdodo àti ìjẹ́mímọ́ papọ̀, tàbí tọ́ka sí orísun wọn. A pa ìṣòro ìtumọ̀ yìí mọ́ nínú àkọ́kọ́, a sì ṣàlàyé àwọn ọ̀nà mìíràn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye lójoojúmọ́. “Gbé … wọ̀” pa àkàwé aṣọ mọ́; “ènìyàn tuntun” sì yẹra fún fífi akọ tàbí abo tí kò sí nínú agbára ἄνθρωπος lórí ọ̀rọ̀ náà. A mọ̀ọ́mọ̀ pa ìṣọ̀kan ọ̀rọ̀ ìkẹyìn mọ́ díẹ̀, nítorí Gíríìkì kò fi hàn ní kedere bóyá “òótọ́” jẹ́ àpèjúwe tàbí orísun.
