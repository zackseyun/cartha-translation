id: EPH.4.14
reference: Ephesians 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: yo
  text: kí a má bàa jẹ́ ọmọdé mọ́, tí ìgbì ń gbá wa síwá-sẹ́yìn, tí gbogbo afẹ́fẹ́ ẹ̀kọ́[a] sì ń gbé wa káàkiri, nípasẹ̀ ètàn àwọn ènìyàn[b] àti nípasẹ̀ àrékérekè tí ń darí sí ète ìṣìnà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘gbogbo afẹ́fẹ́ ẹ̀kọ́ ìgbàgbọ́.’
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ gangan, ‘nínú eré díèsì àwọn ènìyàn’; àwòrán yìí ń tọ́ka sí jíjẹ tàbí ètàn.
    reason: cultural_note
  - marker: c
    text: A tún lè túmọ̀ gbólóhùn náà sí ‘nínú ète ètàn’ tàbí ‘sí ìgbèrò láti pa ènìyàn ṣìnà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: kí a má bàa jẹ́ … mọ́
  rationale: Ìṣọ̀kan ‘kí … má bàa’ fi ète tàbí àbájáde tí ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́ṣẹ̀ ń tọ́ka sí hàn, ‘mọ́’ sì dá μηκέτι padà.
- source_word: νήπιοι
  choice: ọmọdé
  rationale: Ó jẹ́ àpèjúwe àìdàgbà nípa èrò àti ìgbàgbọ́; ‘ọmọdé’ jẹ́ èdè Yorùbá tó ṣe kedere láì fi dandan túmọ̀ sí ọmọ ọwọ́.
- source_word: κλυδωνιζόμενοι
  choice: tí ìgbì ń gbá kiri
  rationale: Ó pa àwòrán ẹni tí ìgbì omi ń gbá síwá-sẹ́yìn mọ́ nínú èdè àdánidá.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: tí gbogbo afẹ́fẹ́ ẹ̀kọ́ sì ń gbé káàkiri
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe (passive) àti àwòrán afẹ́fẹ́ tí ń gbé ènìyàn ká kiri mọ́; ‘ẹ̀kọ́’ ni ìtumọ̀ gbòòrò, àdánidá fún διδασκαλία.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: nípasẹ̀ ẹ̀tàn àwọn ènìyàn
  rationale: κυβεία bẹ̀rẹ̀ gẹ́gẹ́ bí eré ṣẹ́kẹ́ṣẹkẹ̀, ṣùgbọ́n níbí ó ń tọ́ka sí jíjẹ́jẹ̀ẹ́ àti ẹ̀tàn; àlàyé ìpilẹ̀ àwòrán náà wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν πανουργίᾳ
  choice: àrékérekè wọn
  rationale: ‘Àrékérekè’ fi ọgbọ́n búburú àti ète àìṣòótọ́ tí πανουργία ní hàn; ‘wọn’ tọ́ka sí àwọn ènìyàn inú gbólóhùn tó ṣáájú.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: sí ète ìṣìnà
  rationale: ‘sí’ pa ìdarí tàbí ète inú πρός mọ́; ‘ète’ mú ìgbèrò tí μεθοδεία ní jáde, ‘ìṣìnà’ sì pa ààyè ìtumọ̀ πλάνη mọ́ láàárín àṣìṣe, pípa-ni-ṣìnà, àti ẹ̀tàn.
theological_decisions:
- issue: Ìtumọ̀ διδασκαλία
  choice: ẹ̀kọ́
  alternative: ẹ̀kọ́ ìgbàgbọ́
  rationale: ‘Ẹ̀kọ́’ kì í fi ọ̀rọ̀ náà mọ́ ẹ̀kọ́ ìsìn tí a ti tò lélẹ̀ nìkan; ó bá ìtumọ̀ Gíríìkì tó gbòòrò mu.
- issue: Ìtumọ̀ πλάνη
  choice: ìṣìnà
  alternative: ẹ̀tàn tàbí àṣìṣe
  rationale: ‘Ìṣìnà’ lè túmọ̀ sí ipò àṣìṣe àti pípa ẹlòmíràn ṣìnà, nítorí náà kò yanju àìdánilójú inú ọ̀rọ̀ Gíríìkì láìnídí.
- issue: Ìbáṣepọ̀ πρός pẹ̀lú μεθοδεία
  choice: sí ète ìṣìnà
  alternative: nínú ète ìṣìnà
  rationale: Yíyan ‘sí’ jẹ́ kí ipa ìdarí tàbí ète ti πρός dúró, bí ó tilẹ̀ jẹ́ pé a tún lè lóye gbólóhùn náà gẹ́gẹ́ bí ọ̀nà tí àrékérekè ń gbà ṣiṣẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa àwòrán ìgbì àti afẹ́fẹ́ mọ́, a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè dín ìtumọ̀ Gíríìkì kù.
