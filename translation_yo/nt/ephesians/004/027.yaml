  text: μηδὲ δίδοτε τόπον τῷ διαβόλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/027.yaml
  text: and do not give place to the devil[a].
translation:
  language: yo
  text: Ẹ má sì ṣe fi ààyè fún Èṣù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àǹfààní.” Ọ̀rọ̀ Gíríìkì náà sọ ní tààrà pé, “Ẹ má ṣe fi ààyè fún Èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Ẹ má sì ṣe
  rationale: Ọ̀rọ̀ yìí ń tẹ ìkìlọ̀ tó ṣáájú lọ, ó sì fi ìfòfindè hàn lọ́nà àdánidá ní Yorùbá.
- source_word: δίδοτε
  choice: fi … fún
  rationale: Ìlò ‘fi ohun kan fún ẹnìkan’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ‘fún,’ ó sì bá τόπον mu nínú gbólóhùn yìí.
- source_word: τόπον
  choice: ààyè
  rationale: Ìtumọ̀ rẹ̀ ní tààrà ni ‘ibi’ tàbí ‘ààyè’; nínú àyíká yìí ó tún lè túmọ̀ sí àǹfààní láti ṣiṣẹ́. ‘Ààyè’ pa àwòrán àti àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τῷ διαβόλῳ
  choice: Èṣù
  rationale: Nínú àyíká ìkìlọ̀ Pọ́ọ̀lù, ọ̀rọ̀ náà ń tọ́ka sí ẹni búburú náà, kì í ṣe af̀ọ̀rọ̀-èké ènìyàn lásán; ‘Èṣù’ ni orúkọ Bíbélì tí àwọn òǹkàwé Yorùbá mọ̀.
theological_decisions:
- issue: Bóyá διάβολος jẹ́ orúkọ ẹni búburú náà tàbí orúkọ àpapọ̀ fún af̀ọ̀rọ̀-èké
  choice: Èṣù
  alternative: af̀ọ̀rọ̀-èké náà
  rationale: Àyíká ìkìlọ̀ Pọ́ọ̀lù fi hàn pé ẹni búburú náà ni a ń tọ́ka sí; ìtumọ̀ yìí kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ọ̀rọ̀ ‘ààyè’ jẹ́ kó ṣeé ka τόπον gẹ́gẹ́ bí ibi tàbí àǹfààní, láì fi àwòrán ológun bí ‘ibi ìdúró’ kún un.
