  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: yo
  text: Ẹ bínú[a], ẹ má sì dẹ́ṣẹ̀. Kí oòrùn má ṣe wọ̀ lórí ìbínú yín[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ẹ bá bínú, ẹ má ṣe dẹ́ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà jẹ́ àṣẹ ní ìrísí rẹ̀ (“Ẹ bínú”), ṣùgbọ́n àwọn kan lóye rẹ̀ gẹ́gẹ́ bí àṣẹ tí ó gba ipò náà láàyè nínú àyíká ọ̀rọ̀ yìí.
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí Pọ́ọ̀lù ń tọ́ka sí Sáàmù 4:4 (4:5 nínú LXX), níbi tí a ti so ìbínú pọ̀ mọ́ àṣẹ pé kí ènìyàn má ṣe dẹ́ṣẹ̀.
    reason: cross_reference
  - marker: c
    text: Tàbí, “lórí ohun tó ru yín bínú” tàbí “nígbà tí ẹ ṣì ní ìkorò nínú ọkàn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìbínú tàbí ipò tó ru ìbínú sókè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Ẹ máa bínú
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àṣẹ, nítorí náà a pa agbára àṣẹ rẹ̀ mọ́, bẹ́ẹ̀ sì ni ó ń mú ìfarahàn Sáàmù 4:4 nínú LXX wá. Àlàyé pé ‘Bí ẹ bá bínú’ ṣeé ṣe, ṣùgbọ́n ó túmọ̀ ọ̀rọ̀ náà ju bí fọ́ọ̀mù rẹ̀ ṣe sọ lọ.
- source_word: μὴ ἁμαρτάνετε
  choice: ẹ má sì dẹ́ṣẹ̀
  rationale: Èyí jẹ́ ìfòfin-dè tààrà tí ó bá àṣẹ Gíríìkì mu; ‘sì’ so àwọn gbólóhùn méjèèjì pọ̀ láì fi ìtumọ̀ míì kún un.
- source_word: ὁ ἥλιος
  choice: oòrùn
  rationale: Ìtumọ̀ tààrà àti ti ẹ̀dá Yorùbá tí kò nílò ìfẹ̀ sí i.
- source_word: μὴ ἐπιδυέτω
  choice: Kí ... má ṣe wọ̀
  rationale: Ọ̀nà àdánidá ni èdè Yorùbá láti fi àṣẹ ẹni-kẹta tí ó jẹ́ ìfòfin-dè hàn; ‘oòrùn wọ̀’ jẹ́ gbólóhùn Yorùbá tí ó wọ́pọ̀.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: lórí ìbínú yín
  rationale: παροργισμός lè túmọ̀ sí ìbínú, ohun tí ó ru ìbínú sókè, tàbí ìkorò ọkàn. ‘Ìbínú yín’ ló ṣe kedere jù, ó sì bá ὀργίζεσθε tí ó ṣáájú mu, nígbà tí àlàyé ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bóyá kí a túmọ̀ gbólóhùn ìbẹ̀rẹ̀ gẹ́gẹ́ bí àṣẹ láti bínú tàbí gẹ́gẹ́ bí gbólóhùn ààyè pé bí ìbínú bá ṣẹlẹ̀
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ: “Ẹ máa bínú, ẹ má sì dẹ́ṣẹ̀.”'
  alternative: “Bí ẹ bá bínú, ẹ má ṣe dẹ́ṣẹ̀.”
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ àṣẹ. Pípa èyí mọ́ kò túmọ̀ sí pé gbogbo ìbínú dára, nítorí ìfòfin-dè ẹ̀ṣẹ̀ àti ààlà àkókò tó tẹ̀ lé e ń dí ìbínú náà lọ́wọ́. Èyí pa ìdíjú inú ọ̀rọ̀ náà mọ́ láì yanjú rẹ̀ sí ẹ̀kọ́ ẹ̀sìn kan.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì ni a lò. Ọ̀pọ̀ ènìyàn ni a ń bá sọ, nítorí náà a lo ‘ẹ’ àti ‘yín’. Gbólóhùn ‘oòrùn wọ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá fún ìwọ̀-oòrùn. Àmì àlàyé gbogbo wà nínú ọ̀rọ̀ pàtàkì.
