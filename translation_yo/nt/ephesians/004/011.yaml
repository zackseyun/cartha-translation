id: EPH.4.11
reference: Ephesians 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: yo
  text: Òun fúnra rẹ̀ sì ni ó fún àwọn kan gẹ́gẹ́ bí àpọ́sítélì, àwọn kan gẹ́gẹ́ bí wòlíì, àwọn kan gẹ́gẹ́ bí ajíhìnrere, àti àwọn kan gẹ́gẹ́ bí olùṣọ́-àgùntàn[a] àti olùkọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “pásítọ̀.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “olùṣọ́-àgùntàn.”
    reason: lexical_alternative
  - marker: b
    text: Àpilẹ̀kọ kan ṣoṣo ni ó wà níwájú “olùṣọ́-àgùntàn àti olùkọ́” nínú Gíríìkì. Èyí lè fi hàn pé ipa méjèèjì sún mọ́ra gan-an, ṣùgbọ́n kò pọn dandan pé kí a kà wọ́n sí ipò kan ṣoṣo.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: Òun fúnra rẹ̀ sì ni
  rationale: “Sì” so ẹsẹ̀ náà pọ̀ mọ́ ọ̀rọ̀ tó ṣáájú, “òun fúnra rẹ̀” sì pa ìtẹnumọ́ orúkọ-arọ́pò náà mọ́.
- source_word: ἔδωκεν
  choice: ó fi àwọn kan fúnni
  rationale: Èyí pa ìtumọ̀ pàtàkì ‘fúnni’ mọ́, láì dín un kù sí ‘yàn sí ipò’; àyíká ọ̀rọ̀ fi hàn pé àwọn ènìyàn wọ̀nyí ni a fi fún ìjọ.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: àwọn kan ... àwọn kan
  rationale: Àtúnṣe yìí fi bí Gíríìkì ṣe pín àwọn ènìyàn náà sí oríṣiríṣi iṣẹ́ hàn ní Yorùbá àdánidá.
- source_word: ἀποστόλους
  choice: aposteli
  rationale: Ọ̀rọ̀ tí a ti mọ̀ dáadáa fún ipa iṣẹ́ yìí ni Yorùbá Kristẹni, kò sì fi ìtumọ̀ míì kún un.
- source_word: προφήτας
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá προφήτης mu.
- source_word: εὐαγγελιστάς
  choice: ajíhìnrere
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí ń kéde ìhìn rere, ó sì yẹ fún àkójọ ipa iṣẹ́ inú ẹsẹ̀ náà.
- source_word: ποιμένας
  choice: olùṣọ́-àgùntàn
  rationale: Èyí pa àwòrán olùṣọ́ agbo inú ọ̀rọ̀ Gíríìkì mọ́ dípò lílo orúkọ ipò ìjọ tó ṣẹ̀yìn.
- source_word: διδασκάλους
  choice: olùkọ́
  rationale: Ìtumọ̀ Yorùbá tààrà, tó sì dára fún ipa ẹni tí ń kọ́ni.
theological_decisions:
- issue: Bóyá ποιμένας yẹ kí ó jẹ́ ‘olùṣọ́-àgùntàn’ tàbí ‘pásítọ̀’
  choice: olùṣọ́-àgùntàn
  alternative: pásítọ̀
  rationale: ‘Olùṣọ́-àgùntàn’ pa àkàwé Gíríìkì mọ́; ‘pásítọ̀’ jẹ́ ìtumọ̀ ìbílẹ̀ ṣọ́ọ̀ṣì tó ṣeé gbà, a sì fi í sínú àlàyé ìsàlẹ̀.
- issue: Bóyá ‘àwọn olùṣọ́-àgùntàn àti olùkọ́’ jẹ́ ẹgbẹ́ kan ṣoṣo tàbí ipa méjì tó sún mọ́ra
  choice: A túmọ̀ àwọn orúkọ méjèèjì ní ìṣọ̀kan láì pinnu àríyànjiyàn náà
  alternative: àwọn olùṣọ́-àgùntàn tí wọ́n tún jẹ́ olùkọ́
  rationale: Àpilẹ̀kọ kan ṣoṣo níwájú àwọn orúkọ méjèèjì nínú Gíríìkì lè fi ìbáṣepọ̀ tímọ́tímọ́ hàn, ṣùgbọ́n kò fipá mú wa láti sọ pé ipò kan ṣoṣo ni.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn ọ̀rọ̀ ‘aposteli’ àti ‘wòlíì’ jẹ́ èyí tí òǹkàwé Yorùbá mọ̀; ‘olùṣọ́-àgùntàn’ pa àkàwé orísun mọ́.
