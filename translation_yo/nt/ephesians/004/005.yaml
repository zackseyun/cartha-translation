  text: one Lord[a], one faith, one baptism;
translation:
  language: yo
  text: Olúwa kan, ìgbàgbọ́ kan[a], ìbatisí kan;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdúróṣinṣin” tàbí “ìgbẹ́kẹ̀lé” fún πίστις; síbẹ̀, “ìgbàgbọ́” bá ìṣọ̀kan tí a ń tẹnumọ́ níbí mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: kan ṣoṣo
  rationale: Àwọn ìrísí mẹ́tẹ̀ẹ̀ta ti nọ́ńbà náà ni a túmọ̀ bákan náà láti pa ìtẹnumọ́ lórí ìṣọ̀kan àti ìṣọ̀kan àgbékalẹ̀ ọ̀rọ̀ náà mọ́.
- source_word: κύριος
  choice: Olúwa
  rationale: Ó jẹ́ oyè tó wọ́pọ̀ fún κύριος, ó sì yẹ fún ìtọ́ka sí Kristi nínú àyíká ọ̀rọ̀ Efesu 4:4–6.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, ó dára jù láti tọ́ka sí ìgbàgbọ́ tí àwọn onígbàgbọ́ ní papọ̀, láìfi ipa mú un pé ó túmọ̀ sí ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé nìkan.
- source_word: βάπτισμα
  choice: ìbatisí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ sí ìṣe ìbatisí; a kò ṣàlàyé irú ọ̀nà, ipa, tàbí ẹ̀kọ́ ìsìn kan pàtó sínú rẹ̀.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A pa oyè “Olúwa” mọ́; nínú ìṣàn Efesu 4:4–6, ó ṣeé ṣe jù pé ó ń tọ́ka sí Jésù Kristi.
  alternative: Kí ó jẹ́ ìtọ́ka gbogbogbò sí Ọlọ́run.
  rationale: Àyíká ọ̀rọ̀ mẹ́talọ́kan—Ẹ̀mí kan, Olúwa kan, Ọlọ́run àti Baba kan—ń ṣètìlẹ́yìn fún ìtọ́ka sí Ọmọ, ṣùgbọ́n a kò fi orúkọ tí ẹsẹ náà kò sọ kún ọ̀rọ̀ pàtàkì.
- issue: Ìtumọ̀ “ìbatisí kan ṣoṣo”
  choice: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí “ìbatisí kan ṣoṣo,” láìsọ ọ̀nà rẹ̀, ipa rẹ̀, tàbí ẹ̀kọ́ ìsìn kan pàtó.
  alternative: Ìtumọ̀ sakramenti kan pàtó tàbí ìtumọ̀ ìbatisí nípa tẹ̀mí nìkan.
  rationale: Ẹsẹ náà ń tẹnumọ́ ìṣọ̀kan, ṣùgbọ́n kò dá àwọn àríyànjiyàn ẹ̀kọ́ ìsìn nípa ìbatisí lẹ́jọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì ṣe kedere ni a lò. Àtúnsọ “kan ṣoṣo” pa ìró àti ìtẹnumọ́ mẹ́ta inú Gíríìkì mọ́. A lo “ìbatisí,” ọ̀rọ̀ tí ó wọ́pọ̀ nínú Yorùbá Kristẹni, láìfi ẹ̀kọ́ ìjọ kan pàtó kún un.
