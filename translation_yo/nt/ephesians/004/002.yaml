  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: yo
  text: pẹ̀lú gbogbo ìrẹ̀lẹ̀ àti ìwà tútù, pẹ̀lú sùúrù, kí ẹ máa fi ìfẹ́ faradà ara yín,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: pẹ̀lú gbogbo
  rationale: μετά pẹ̀lú ọ̀rọ̀-orúkọ inú genitive ń fi ohun tí ó bá ìṣe tàbí ìwà kan rìn hàn; πάσης sì mú ìtumọ̀ náà kún, nítorí náà “pẹ̀lú gbogbo” pa agbára gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ταπεινοφροσύνης
  choice: ìrẹ̀lẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìrònú àti ìwà ẹni tí kò gbé ara rẹ̀ ga; “ìrẹ̀lẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ ìwà rere yìí mu.
- source_word: πραΰτητος
  choice: ìwà tútù
  rationale: πραΰτης ń tọ́ka sí ìwà pẹ̀lẹ́ tí ó ní agbára tí a kó níjàánu; “ìwà tútù” jẹ́ àdánidá, ó sì yẹra fún ìtumọ̀ àìlera.
- source_word: μακροθυμίας
  choice: sùúrù
  rationale: Ọ̀rọ̀ náà ń sọ nípa fífaradà pẹ́ àti jíjẹ́ kí ó pẹ́ kí ẹni tó bínú; “sùúrù” ni ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere jù lọ ní àyíká yìí.
- source_word: ἀνεχόμενοι
  choice: kí ẹ máa ... fara da
  rationale: Participle present yìí ní ìtumọ̀ ìṣe tí ń bá a lọ. Ìṣètò “kí ẹ máa ... fara da” sọ ìtẹ̀síwájú àti ìpè sí ìṣe náà jáde lọ́nà Yorùbá àdánidá.
- source_word: ἀλλήλων
  choice: ara yín
  rationale: Ọ̀rọ̀ arọ́pò onípààrọ̀ náà túmọ̀ sí pé àwọn onígbàgbọ́ ń ṣe èyí sí ara wọn; “ara yín” ni ìṣàfihàn Yorùbá tó bá àyíká ẹni púpọ̀ mu.
- source_word: ἐν ἀγάπῃ
  choice: fi ìfẹ́
  rationale: ἐν lè sọ ọ̀nà tàbí àyíká ìṣe náà. “fi ìfẹ́” jẹ́ Yorùbá àdánidá tí ó fi hàn pé ìfẹ́ ni ọ̀nà àti ẹ̀mí tí wọ́n fi ń fara da ara wọn.
theological_decisions:
- issue: Ìtumọ̀ ἀγάπη
  choice: ìfẹ́
  alternative: ìfẹ́ àìmọtara-ẹni-nìkan
  rationale: “Ìfẹ́” ni ìtumọ̀ gbooro, àdánidá, tí kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ orísun. Àyíká náà fúnra rẹ̀ ń fi irú ìfẹ́ tí a ń sọ hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmi ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà pa ìṣàn ẹsẹ tó ṣáájú mọ́, ó sì parí pẹ̀lú àmì kọ́mà gẹ́gẹ́ bí apá kan ti gbólóhùn gígùn.
