source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: yo
  text: Láti ọ̀dọ̀ ẹni náà ni gbogbo ara, tí a ń so pọ̀, tí a sì ń dì mú ṣọ̀kan nípasẹ̀ gbogbo ìsopọ̀ tí ń pèsè ìrànlọ́wọ́,[a] gẹ́gẹ́ bí ìṣiṣẹ́ ẹ̀yà kọ̀ọ̀kan ní ìwọ̀n tirẹ̀, ń mú kí ara náà dàgbà fún kíkọ́ ara rẹ̀ sókè nínú ìfẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà tún lè túmọ̀ sí “nípasẹ̀ gbogbo ìsopọ̀ tó ń pèsè ohun tí ara nílò” tàbí “nípasẹ̀ gbogbo okùn ara tó ń ṣètìlẹ́yìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: Láti ọ̀dọ̀ ẹni náà
  rationale: Ọ̀rọ̀ arọ́pò akọ náà tọ́ka sí Kristi ní ẹsẹ 15; yíyan ọ̀rọ̀ ẹni pa ìtumọ̀ pé Kristi ni orísun mọ́.
- source_word: πᾶν τὸ σῶμα
  choice: gbogbo ara
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ara náà lápapọ̀, tí kò fi ẹ̀yà kan sílẹ̀.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: tí a ń so pọ̀, tí a sì ń dì mú ṣọ̀kan
  rationale: Ó pa ìṣe aláìlórúkọ àti àwòrán pípa àwọn ẹ̀yà ara pọ̀, kí wọ́n sì dúró ṣọ̀kan mọ́.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: nípasẹ̀ gbogbo oríkèé tí ń pèsè ìrànlọ́wọ́
  rationale: “Oríkèé” pa àwòrán ara mọ́, “tí ń pèsè ìrànlọ́wọ́” sì fi èrò ìpèsè tàbí ìtìlẹ́yìn inú ἐπιχορηγία hàn láìfi ìtumọ̀ ìṣègùn kan ṣoṣo lé e lórí.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: gẹ́gẹ́ bí iṣẹ́ tí ẹ̀yà kọ̀ọ̀kan ń ṣe ní ìwọ̀n tirẹ̀
  rationale: Ó sọ ọ̀rọ̀ Gíríìkì náà ní Yorùbá àdánidá, ó sì pa èrò iṣẹ́ ẹ̀yà kọ̀ọ̀kan tó bá ìwọ̀n tirẹ̀ mu mọ́, láìfi “tó yẹ” kún un.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: ń mú kí ara náà dàgbà
  rationale: Èyí jẹ́ Yorùbá tó ṣe déédéé fún mímú ìdàgbàsókè ara wá, ó sì jẹ́ kí ara lápapọ̀ dúró gẹ́gẹ́ bí olùṣe nínú gbólóhùn náà.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: kí ara náà lè máa gbé ara rẹ̀ ró
  rationale: Ó pa àkàwé kíkọ́ ró àti ipa arọ́pò ara-ẹni mọ́ ní èdè Yorùbá tó yé kedere.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Ìtumọ̀ tààrà, tó sì bá ìtẹnumọ́ Pọ́ọ̀lù lórí ìfẹ́ nínú àyíká ọ̀rọ̀ náà mu.
theological_decisions:
- issue: Orísun àti olùṣe ìdàgbàsókè ara
  choice: Kristi ni orísun (“láti ọ̀dọ̀ ẹni náà”), ṣùgbọ́n ara náà ń dàgbà nípasẹ̀ iṣẹ́ tí ẹ̀yà kọ̀ọ̀kan ń ṣe.
  alternative: Kí “οὗ” tọ́ka sí ohun kan láìjẹ́ ẹni, tàbí kí gbogbo ìtẹnumọ́ wà lórí àwọn oríkèé nìkan.
  rationale: Àyíká ẹsẹ 15 tọ́ka sí Kristi gẹ́gẹ́ bí ẹni náà; ìṣètò gbólóhùn náà tún jẹ́ kí gbogbo ara jẹ́ olùṣe ìdàgbàsókè rẹ̀ nípasẹ̀ ìfọwọ́sowọ́pọ̀ àwọn ẹ̀yà.
- issue: Ìtumọ̀ àwòrán ἁφῆς τῆς ἐπιχορηγίας
  choice: A pa àwòrán ara mọ́ pẹ̀lú “oríkèé tí ń pèsè ìrànlọ́wọ́.”
  alternative: Okùn ara tó ń ṣètìlẹ́yìn, tàbí ìsopọ̀ tó ń pèsè ohun tí a nílò.
  rationale: Ọ̀rọ̀ Gíríìkì lè ní èrò ibi ìfọwọ́kan, oríkèé, tàbí ìsopọ̀ pẹ̀lú ìpèsè. Àṣàyàn yìí pa àwòrán náà mọ́, àkọ́silẹ̀ ìsàlẹ̀ sì jẹ́ kí àìdánilójú ọ̀rọ̀ náà hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó yé àwọn òǹkàwé òde òní. A lo “ń” láti fi ìṣe tó ń bá a lọ hàn, a sì yàgò fún ọ̀rọ̀ ìjọ kan pàtó. Àwọn àmì ohùn ni a fi sí ibi tó yẹ.
