  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìtumọ̀ náà tọ́ka sí Kristi gẹ́gẹ́ bí orísun, ó sì pa ìfọwọ́sowọ́pọ̀ gbogbo ara àti ìṣiṣẹ́ ẹ̀yà kọ̀ọ̀kan mọ́. Ṣùgbọ́n “oríkèé” kì í ṣe ọ̀rọ̀ tó pé fún ἁφή nínú àwòrán gbogbo ara yìí; ó lè tọ́ka sí apá ara kan pàtó, dípò ìsopọ̀/oríkèé ara lápapọ̀. Ìṣètò gbolohun náà tún lè sọ ìbáṣepọ̀ ‘gẹ́gẹ́ bí iṣẹ́…’ di ohun tí ó ń ṣàlàyé ìdàgbàsókè nìkan, níbi tí ó ti ń ṣàlàyé bí ara ṣe ń ṣiṣẹ́ pọ̀.
