id: EPH.4.4
reference: Ephesians 4:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: yo
  text: Ara kan àti Ẹ̀mí kan,[a] gẹ́gẹ́ bí a ti pè yín náà ní ìrètí kan ti ìpè yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ẹ̀mí kan.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ẹ̀mí’ tàbí ‘Ẹ̀mí.’ Ní àyíká ọ̀rọ̀ ìṣọ̀kan nínú ẹsẹ yìí, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni ó ń tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: kan
  rationale: A tún ọ̀rọ̀ yìí ṣe láti tẹnu mọ́ ìṣọ̀kan; ‘kan’ ni a lò ní ìbámu pẹ̀lú èdè Yorùbá àdánidá.
- source_word: σῶμα
  choice: ara
  rationale: ‘Ara’ pa àkàwé Gíríìkì mọ́, láì fi ìtumọ̀ àlàyé ‘àwùjọ àwọn onígbàgbọ́’ sínú ẹsẹ náà.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká ọ̀rọ̀ ìṣọ̀kan méje ní Efesu 4:4–6 fi hàn pé ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; lílo lẹ́tà ńlá fi ìtumọ̀ yìí hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí ... pẹ̀lú
  rationale: Ó pa agbára ìfiwéra καθὼς àti ìfikún καί mọ́ ní ọ̀nà tí ó bá Yorùbá mu.
- source_word: ἐκλήθητε
  choice: a ti pè yín
  rationale: Ìṣe aláìlẹ́ni-tó-ṣe-é yìí pa àṣírí ẹni tó pè wọ́n mọ́, kò sì fi ‘Ọlọ́run’ kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: sí ìrètí kan ṣoṣo
  rationale: Nínú àkópọ̀ pẹ̀lú ‘pè,’ ‘sí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrètí tí ìpè náà darí wọn sí; ‘kan ṣoṣo’ tẹnu mọ́ ìṣọ̀kan.
- source_word: τῆς κλήσεως ὑμῶν
  choice: tí ó jẹ́ ti ìpè yín
  rationale: Ìtumọ̀ ìbáṣepọ̀ genitive náà ni a pa mọ́, bákan náà ni ìbáṣepọ̀ ọ̀rọ̀ láàárín ‘pè’ àti ‘ìpè’.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí kan, ìyẹn ìwà tàbí ipò ẹ̀mí kan náà tí àwọn onígbàgbọ́ ní papọ̀
  rationale: Àtòjọ ‘ara kan ... Ẹ̀mí kan ... Olúwa kan ... Ọlọ́run àti Baba kan’ ní Efesu 4:4–6 mú kí Ẹ̀mí Mímọ́ jẹ́ ìtumọ̀ tó ṣeé ṣe jù. Síbẹ̀, Gíríìkì ìpilẹ̀ṣẹ̀ kò fi lẹ́tà ńlá àti kékeré ṣe ìyàtọ̀ yìí, nítorí náà a ṣàkọsílẹ̀ ìtumọ̀ mìíràn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní ọlá, ó sì yẹ fún kíkà ní gbangba. A lo ‘Ara kan ni ó wà’ dípò gbolohun àìpé láti jẹ́ kí ẹsẹ náà dúró gẹ́gẹ́ bí gbólóhùn Yorùbá àdánidá.
