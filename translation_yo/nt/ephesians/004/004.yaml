revisions:
- from: Ara kan ni ó wà, Ẹ̀mí kan sì ni ó wà,[a] gẹ́gẹ́ bí a ti pè yín pẹ̀lú sí ìrètí kan ṣoṣo tí ó jẹ́ ti ìpè yín.
  to: Ara kan àti Ẹ̀mí kan,[a] gẹ́gẹ́ bí a ti pè yín náà ní ìrètí kan ti ìpè yín.
  rationale: A yọ ‘ni ó wà’ kúrò kí àtòjọ ìṣọ̀kan náà lè sún mọ́ ọ̀nà tí Gíríìkì ṣe gbé e kalẹ̀. A tún ‘pẹ̀lú’ ṣe sí ‘náà’ láti fi καί tó addressee hàn. A ṣe ἐν μιᾷ ἐλπίδι ní ‘ní ìrètí kan,’ a sì pa ìbáṣepọ̀ τῆς κλήσεως ὑμῶν mọ́ ní ‘ti ìpè yín.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:54Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ‘ara’ àti ‘Ẹ̀mí’ wá dáadáa, ó sì ń pa ìtumọ̀ tí a lè jiyàn nípa πνεῦμα mọ́ nínú àlàyé ìsàlẹ̀. Ṣùgbọ́n ‘sí ìrètí kan ṣoṣo’ yí ἐν (‘ní/in’) padà sí ‘sí/to,’ ó sì fi ìtẹnumọ́ ‘ṣoṣo’ kún un ju ohun tí ἓν béèrè lọ. ‘Pẹ̀lú’ kò tún so καί mọ́ addressee ní kedere.
  naturalness: ‘Ara kan ni ó wà, Ẹ̀mí kan sì ni ó wà’ jẹ́ gbolohun Yorùbá tó ṣeé gbọ́, ṣùgbọ́n ó fi ‘wà’ kún àtòjọ kúkúrú Gíríìkì láìní ìdí. Àtúnṣe náà jẹ́ kúkúrú, ó sì ṣàn dáadáa fún kíkà ní gbangba.
  terminology: ‘Ara,’ ‘Ẹ̀mí,’ ‘ìrètí,’ àti ‘ìpè’ bá ọ̀rọ̀ ìsìn Yorùbá boṣewa mu. Lẹ́tà ńlá nínú ‘Ẹ̀mí’ jẹ́ ìpinnu ìtumọ̀ tó bójú mu, níwọ̀n bí àlàyé ìsàlẹ̀ ti jẹ́ kí ìtumọ̀ ‘ẹ̀mí’ ṣì wà.
