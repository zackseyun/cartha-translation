review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse''s sequence and principal semantic components: moral insensibility, voluntary self-surrender to ἀσέλγεια, comprehensive impurity, and πλεονεξία as the accompanying disposition. However, “Àwọn ẹni wọ̀nyí” adds a deictic force (“these persons”) not expressed by οἵτινες, and “fi ara wọn lé” can suggest entrusting oneself rather than yielding oneself over.'
  naturalness: “Tí ọkàn wọn ti yigbì” is not the clearest natural Standard Yoruba expression for the settled moral insensibility of ἀπηλγηκότες. “Tí wọ́n ti di aláìní ìmọ̀lára” is clear, idiomatic, and does not add “conscience,” which is absent from the Greek. “Fi ara wọn fún” is a more natural expression of voluntary surrender in this context.
  terminology: “Ìwà àìnítìjú tí kò ní ìjánu,” “ìwà àìmọ́,” and “ojúkòkòrò” suitably convey ἀσέλγεια, ἀκαθαρσία, and πλεονεξία. The alternatives in the footnotes are retained, with wording adjusted to correspond accurately to the revised main rendering.
  issues:
  - severity: medium
    issue: “Àwọn ẹni wọ̀nyí” is more demonstrative than the Greek relative pronoun οἵτινες.
    rationale: The phrase means approximately “these persons,” whereas οἵτινες continues the reference to the Gentiles just mentioned. “Àwọn náà” maintains that connection without introducing a demonstrative emphasis.
  - severity: medium
    issue: “Tí ọkàn wọn ti yigbì” is unclear or unnatural for moral callousness in contemporary Standard Yoruba.
    rationale: ἀπηλγηκότες denotes having become insensitive/callous. “Tí wọ́n ti di aláìní ìmọ̀lára” communicates the resultant state plainly while retaining the broad sense of lost sensitivity.
  - severity: low
    issue: “Fi ara wọn lé” is potentially ambiguous.
    rationale: It may be heard as entrusting oneself to something. “Fi ara wọn fún” more directly conveys the reflexive voluntary yielding expressed by ἑαυτοὺς παρέδωκαν.
  revised_text: Àwọn náà, tí wọ́n ti di aláìní ìmọ̀lára[a], ti fi ara wọn fún ìwà àìnítìjú tí kò ní ìjánu[b], láti máa ṣe gbogbo irú ìwà àìmọ́ pẹ̀lú ojúkòkòrò[c].
  revised_footnotes:
