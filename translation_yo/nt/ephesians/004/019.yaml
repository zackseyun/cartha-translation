  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: yo
  text: Àwọn náà, tí wọ́n ti di aláìní ìmọ̀lára[a], ti fi ara wọn fún ìwà àìnítìjú tí kò ní ìjánu[b], láti máa ṣe gbogbo irú ìwà àìmọ́ pẹ̀lú ojúkòkòrò[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí gbogbo ìmọ̀lára wọn ti kú,” tàbí “tí wọ́n ti kọjá ìmọ̀lára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwà wọ̀bìà,” tàbí “ìwà ìfẹ́kúfẹ̀ẹ́ tí kò ní ìjánu.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nínú ojúkòkòrò,” tàbí “pẹ̀lú ìfẹ́ láti ní púpọ̀ sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Àwọn ẹni wọ̀nyí
  rationale: Ó ń tọ́ka sí àwọn Kèfèrí tí ẹsẹ tó ṣáájú ṣẹ̀ṣẹ̀ mẹ́nu kàn. Ọ̀rọ̀ yìí pa ìsopọ̀ náà mọ́ láìfi ìtumọ̀ tuntun kún un.
- source_word: ἀπηλγηκότες
  choice: tí ọkàn wọn ti yigbì
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí ènìyàn ṣe dé ipò àìní ìmọ̀lára nípa ohun tó tọ́ àti ohun tí kò tọ́. ‘Ti yigbì’ fi ipò tó ti wáyé, tó sì ń bá a lọ, hàn gẹ́gẹ́ bí perfect participle Gíríìkì ṣe ń ṣe.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: fi ara wọn lé
  rationale: Ó fi hàn pé àwọn fúnra wọn mọ̀ọ́mọ̀ jọ̀wọ́ ara wọn fún ìwà náà; ó pa agbára reflexive object mọ́ ní Yorùbá àdánidá.
- source_word: τῇ ἀσελγείᾳ
  choice: ìwà àìnítìjú tí kò ní ìjánu
  rationale: ἀσέλγεια lè ní ìwà ìbálòpọ̀ tí kò bójú mu nínú, ṣùgbọ́n kò mọ sí ìyẹn nìkan; ó tún túmọ̀ sí ìwà ìfẹ́kúfẹ̀ẹ́ tí kò ní ìjánu, tí kò sì tijú. Ìtumọ̀ yìí pa fífẹ̀ ọ̀rọ̀ náà mọ́.
- source_word: εἰς ἐργασίαν
  choice: láti máa ṣe
  rationale: Níbí, ἐργασία túmọ̀ sí ṣíṣe tàbí lílépa ohun kan, kì í ṣe iṣẹ́ ọwọ́ lasán. ‘Láti máa ṣe’ sọ ète tàbí àbájáde náà ní Yorùbá tó ṣe déédé.
- source_word: ἀκαθαρσίας πάσης
  choice: onírúurú ìwà àìmọ́
  rationale: Ó sọ gbogbo irú ìwà àìmọ́ di mímọ̀, ó sì jẹ́ ọ̀nà àdánidá láti fi ìtẹnumọ́ πάσης hàn.
- source_word: ἐν πλεονεξίᾳ
  choice: pẹ̀lú ojúkòkòrò
  rationale: πλεονεξία jẹ́ ìfẹ́ tí kò ní ìtẹ́lọ́rùn láti ní tàbí ṣe púpọ̀ sí i. ‘Pẹ̀lú’ jẹ́ kí ó ṣe àpèjúwe ọ̀nà tí wọ́n gbà ń ṣe ìwà àìmọ́, láìpa àṣàyàn ‘nínú ojúkòkòrò’ rẹ́.
theological_decisions:
- issue: Agbára ìwà àti ọkàn inú ἀπηλγηκότες
  choice: A túmọ̀ rẹ̀ sí líle tàbí yíyigbì ọkàn nípa ohun tó tọ́, kì í ṣe àìní ìmọ̀lára lásán.
  alternative: tí gbogbo ìmọ̀lára wọn ti kú; tí wọn kò lè mọ ohun tó tọ́ mọ́
  rationale: Ọ̀rọ̀ àyíká ń sọ nípa jíjìnnà sí ìyè Ọlọ́run àti fífi ara ẹni lé ìwà àìmọ́. Síbẹ̀, a kò fi ọ̀rọ̀ ‘ẹ̀rí-ọkàn’ sínú ẹsẹ̀ gẹ́gẹ́ bí ẹni pé ó wà ní Gíríìkì.
- issue: Fífẹ̀ ìtumọ̀ ἀσέλγεια
  choice: ìwà àìnítìjú tí kò ní ìjánu
  alternative: ìwà wọ̀bìà; ìwà ìfẹ́kúfẹ̀ẹ́
  rationale: Ọ̀rọ̀ Gíríìkì sábà máa ń kan ẹ̀ṣẹ̀ ìbálòpọ̀, ṣùgbọ́n ó lè gba gbogbo ìwà ìgbádùn ara ẹni tí kò ní ìjánu. A kò dín un kù sí ẹ̀ṣẹ̀ ìbálòpọ̀ nìkan.
- issue: Ìbáṣepọ̀ ἐν πλεονεξίᾳ pẹ̀lú gbolohun náà
  choice: 'A so ó mọ́ ọ̀nà tí wọ́n gbà ń ṣe gbogbo ìwà àìmọ́: ‘pẹ̀lú ojúkòkòrò.’'
  alternative: nínú ojúkòkòrò; láìní ìtẹ́lọ́rùn
  rationale: Gíríìkì lè fi ipò tàbí ọ̀nà hàn. Ìtumọ̀ àkọ́kọ́ pa ìbáṣepọ̀ yìí mọ́ láìsọ pé ojúkòkòrò ọrọ̀ tàbí ohun-ìní nìkan ni.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ọkàn wọn ti yigbì’ jẹ́ àwòrán Yorùbá tó ṣàfihàn líle ọkàn ní ti ìwà; ‘ìwà àìnítìjú tí kò ní ìjánu’ sì ṣe kedere sí òǹkàwé òde òní ju ọ̀rọ̀ àtijọ́ kan ṣoṣo lọ. Gbolohun náà pa ìtẹ̀sí láti orí ipò ọkàn dé ìfijọ̀wọ́ ara ẹni àti ṣíṣe ìwà àìmọ́ mọ́.
