revisions:
- from: Àwọn ẹni wọ̀nyí, tí ọkàn wọn ti yigbì[a], fi ara wọn lé ìwà àìnítìjú tí kò ní ìjánu[b], láti máa ṣe onírúurú ìwà àìmọ́ pẹ̀lú ojúkòkòrò[c].
  to: Àwọn náà, tí wọ́n ti di aláìní ìmọ̀lára[a], ti fi ara wọn fún ìwà àìnítìjú tí kò ní ìjánu[b], láti máa ṣe gbogbo irú ìwà àìmọ́ pẹ̀lú ojúkòkòrò[c].
  rationale: The revision removes unsupported demonstrative emphasis, replaces an unclear idiom with natural Standard Yoruba for the perfect participle’s resultant moral insensitivity, and clarifies the voluntary self-surrender. It otherwise retains the draft’s broad, non-reductive rendering of ἀσέλγεια and its treatment of greed as the manner or disposition accompanying the practice of impurity. Footnote markers remain correctly anchored to their respective terms.
