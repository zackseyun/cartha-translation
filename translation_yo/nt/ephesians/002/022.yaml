  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: yo
  text: Nínú ẹni náà[a] ni a tún ń kọ́ ẹ̀yin papọ̀, kí ẹ lè di ibùgbé fún Ọlọ́run nínú Ẹ̀mí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nínú èyí,” bí ọ̀rọ̀ arọ́pò-orúkọ náà bá ń tọ́ka sí gbogbo ilé náà dípò kí ó tọ́ka tààrà sí Kristi.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nínú ẹ̀mí” tàbí “nípasẹ̀ Ẹ̀mí.” Gbólóhùn náà lè tọ́ka sí ààyè tí Ọlọ́run ń gbé, tàbí sí iṣẹ́ tí Ẹ̀mí Mímọ́ ń ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú ẹni náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí Kristi gẹ́gẹ́ bí ẹni tí a mẹ́nu kàn ní àyíká ọ̀rọ̀; “ẹni” ṣe kedere pé ẹni ni, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ọ̀nà míì sílẹ̀.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin ... pẹ̀lú àwọn yòókù
  rationale: “Ẹ̀yin” pa ìtẹnumọ́ arọ́pò-orúkọ ọ̀pọ̀ mọ́, “pẹ̀lú àwọn yòókù” sì sọ agbára àfikún καί àti ìtumọ̀ σύν nínú ọ̀rọ̀-ìṣe di èdè Yorùbá àdánidá.
- source_word: συνοικοδομεῖσθε
  choice: a ń bá a lọ láti kọ́ ẹ̀yin pẹ̀lú àwọn yòókù
  rationale: Ìrísí ìsinsìnyí aláìṣe fi iṣẹ́ tí ń tẹ̀ síwájú hàn; “a ... kọ́ ẹ̀yin” pa ohùn aláìṣe mọ́ láìdárúkọ ẹni tó ń kọ́, “pẹ̀lú àwọn yòókù” sì fi σύν hàn.
- source_word: εἰς κατοικητήριον
  choice: kí ẹ̀yin lè di ibùgbé
  rationale: εἰς tọ́ka sí ète tàbí àbájáde; “kí ... lè di” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti fi ìyípadà sí ipò àbájáde hàn. “Ibùgbé” jẹ́ ọ̀rọ̀ òde òní fún ibi tí ẹni ń gbé.
- source_word: τοῦ θεοῦ
  choice: fún Ọlọ́run
  rationale: Ní ìbáṣepọ̀ pẹ̀lú κατοικητήριον, ìtumọ̀ náà ni ibùgbé tí Ọlọ́run yóò máa gbé; “fún Ọlọ́run” jẹ́ Yorùbá àdánidá ju “ti Ọlọ́run” lọ níbí.
- source_word: ἐν πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Àyíká tẹ́ńpìlì àti ìgbé-inú tọ́ka jù lọ sí Ẹ̀mí Mímọ́. “Nínú” pa ἐν mọ́, kò sì sọ ọ́ di irinṣẹ́ nìkan.
theological_decisions:
- issue: Ohun tí ἐν ᾧ ń tọ́ka sí
  choice: 'Kristi: “Nínú ẹni náà”'
  alternative: 'Gbogbo ilé náà: “Nínú èyí náà”'
  rationale: Àyíká ẹsẹ 20–21 gbé Kristi kalẹ̀ gẹ́gẹ́ bí òkúta igun àti ẹni tí gbogbo ilé ti so pọ̀ nínú rẹ̀. Síbẹ̀, girama lè jẹ́ kí ọ̀rọ̀ náà tọ́ka sí ilé náà, nítorí náà a pa ọ̀nà yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἐν πνεύματι
  choice: 'Ẹ̀mí Mímọ́: “nínú Ẹ̀mí”'
  alternative: “nínú ẹ̀mí” tàbí “nípasẹ̀ Ẹ̀mí”
  rationale: Lílo ọ̀rọ̀ ní inú lẹ́tà Éfésù àti àwòrán ibùgbé Ọlọ́run ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tí a ń tọ́ka sí. A pa “nínú” mọ́ kí a má bà a dín sí ti ọ̀nà tàbí irinṣẹ́ nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. A yan “a ń bá a lọ láti kọ́” láti mú ìṣe tí ń tẹ̀ síwájú hàn, bí ó tilẹ̀ jẹ́ pé ó gùn díẹ̀. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ, a sì pa àwòrán ilé àti ibùgbé mọ́.
