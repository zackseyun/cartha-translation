id: EPH.2.16
reference: Ephesians 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: yo
  text: kí ó sì tún mú àwọn méjèèjì bá Ọlọ́run làjà nínú ara kan nípasẹ̀ àgbélébùú, nípa pípa ìṣọ̀tá náà run nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “nínú rẹ̀” lè tọ́ka sí àgbélébùú náà; ó tún ṣeé ṣe kí ó tọ́ka sí ara kan náà.
    reason: Láti pa àìdájú ìtọ́kasí ἐν αὐτῷ mọ́ láìfẹ́sẹ̀múlẹ̀ ìtumọ̀ kan nínú ọ̀rọ̀ àkọ́kọ́.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: tún mú ... bá Ọlọ́run làjà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ìbáṣepọ̀ padà sí àlàáfíà; “tún mú ... làjà” jẹ́ Yorùbá àdánidá tó sì pa agbára ọ̀rọ̀ ìpilẹ̀ mọ́.
- source_word: τοὺς ἀμφοτέρους
  choice: àwọn méjèèjì
  rationale: Ó tọ́ka sí àwọn ẹgbẹ́ méjì tí a mẹ́nu kàn ṣáájú—Júù àti Kèfèrí—láìfi ìtumọ̀ àfikún sínú ẹsẹ yìí.
- source_word: ἐν ἑνὶ σώματι
  choice: nínú ara kan
  rationale: Ìtumọ̀ taara ni, ó sì pa àwòrán ti ara kan mọ́ láìṣe àlàyé rẹ̀ gẹ́gẹ́ bí ohun kan pàtó.
- source_word: διὰ τοῦ σταυροῦ
  choice: nípasẹ̀ àgbélébùú
  rationale: Ó sọ ohun èlò tàbí ọ̀nà tí ìlàjà fi wá; “nípasẹ̀” bá διὰ pẹ̀lú ẹ̀sùn oníbáṣepọ̀ mu.
- source_word: ἀποκτείνας
  choice: fi ... pa ... run
  rationale: Ó pa àwòrán líle ti pípa mọ́; “pa run” ṣe kedere pé ìṣọ̀tá ni a mú kúrò.
- source_word: τὴν ἔχθραν
  choice: ìṣọ̀tá náà
  rationale: “Ìṣọ̀tá” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún hostility/enmity, tí ó lè kan ìwà ọ̀tá àti ìyapa tó wà láàárín wọn.
- source_word: ἐν αὐτῷ
  choice: fi í
  rationale: Asojú-ọ̀rọ̀ Gíríìkì lè tọ́ka sí àgbélébùú tàbí sí ara; ìtumọ̀ “fi í” pa ìtọ́kasí náà mọ́ ní ṣókí, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé àìdájú rẹ̀.
theological_decisions:
- issue: Ohun tí “ara kan” ń tọ́ka sí
  choice: Pa á mọ́ gẹ́gẹ́ bí “ara kan.”
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ara Kristi tàbí ìjọ.
  rationale: Gíríìkì kò ṣe àlàyé náà ní ẹsẹ yìí; fífi àwòrán náà sílẹ̀ ń yẹra fún pípa ìtumọ̀ mọ́ ẹ̀kọ́ ìsìn kan ṣoṣo.
- issue: Ohun tí ἐν αὐτῷ (“nínú/nípasẹ̀ rẹ̀”) ń tọ́ka sí
  choice: Lò “fi í,” pẹ̀lú àkọsílẹ̀ pé ó ṣeé tọ́ka sí àgbélébùú tàbí ara kan.
  alternative: Yan “nípasẹ̀ àgbélébùú” nìkan tàbí “nínú ara náà” nìkan.
  rationale: Ìtọ́kasí asojú-ọ̀rọ̀ náà ní àìdájú gidi; kò yẹ kí ìtumọ̀ pa ìṣòro náà run láìjẹ́ kí òǹkàwé mọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì bá ìṣàn gbolohun tó bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú mu. “Kí ó sì” pa ìṣe ìfẹ́sẹ̀mulẹ̀ (subjunctive) àti ìsopọ̀ καί mọ́.
