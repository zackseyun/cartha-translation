id: EPH.2.3
reference: Ephesians 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: yo
  text: Láàárín wọn ni gbogbo wa náà ti gbé ayé nígbà kan rí nínú ìfẹ́kúfẹ̀ẹ́ ara wa[b], tí a ń ṣe àwọn ohun tí ara àti àwọn èrò inú wa fẹ́[c]. Nípa ẹ̀dá, a sì jẹ́ àwọn ọmọ ìbínú[d], gẹ́gẹ́ bí àwọn yòókù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Ara” lè tún jẹ́ “ẹ̀dá ẹlẹ́ṣẹ̀” níbí; àkọ́kọ́ pa ọ̀rọ̀ Paulu mọ́, kò sì pinnu gbogbo ìtumọ̀ rẹ̀ tẹ́lẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Ní ti gidi, “tí a ń ṣe àwọn ìfẹ́ ara àti ti àwọn èrò.”
    reason: literal_rendering
  - marker: d
    text: Tàbí, “àwọn ẹni tí ìbínú ń dúró de.” “Àwọn ọmọ ìbínú” jẹ́ pípa àkànlò Gíríìkì mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Láàárín àwọn náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà lè tọ́ka sí àwọn ènìyàn tí ẹsẹ tó ṣáájú pè ní ‘àwọn ọmọ àìgbọ́ràn’; ‘láàárín àwọn náà’ mú ìtọ́kasí sí ènìyàn yìí jáde lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἀνεστράφημέν
  choice: ti gbé ayé
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀ tàbí hùwà. ‘Gbé ayé’ jẹ́ èdè Yorùbá àdánidá tó ṣì fi ìwà ìgbésí ayé hàn.
- source_word: ποτε
  choice: nígbà kan rí
  rationale: Ó ń tọ́ka sí ipò wọn tẹ́lẹ̀; gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìtumọ̀ náà.
- source_word: ἐπιθυμίαις
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: Yíyan yìí fi àwọn ìfẹ́ tó ń fà ènìyàn sí ohun tí kò tọ́ hàn láìdín ìtumọ̀ náà kù sí ìfẹ́ ìbálòpọ̀ nìkan.
- source_word: σάρξ
  choice: ara
  rationale: ‘Ara’ pa àwòrán ọ̀rọ̀ Paulu mọ́, kò sì túmọ̀ rẹ̀ ní pàtó sí ‘ẹ̀dá ẹlẹ́ṣẹ̀,’ èyí tó lè yanjú ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ ní gbangba.
- source_word: ποιοῦντες
  choice: tí a ń ṣe
  rationale: Ó fi ìṣe tó ń bá a lọ àti bí wọn ṣe ń mú ìfẹ́ wọ̀nyẹn ṣẹ nínú ìgbésí ayé hàn ní èdè Yorùbá tó rọrùn.
- source_word: θελήματα
  choice: àwọn ohun tí … fẹ́
  rationale: Èyí yà á sọ́tọ̀ díẹ̀ sí ἐπιθυμίαις, ó sì sọ àwọn ohun tí ìfẹ́-inú ń lépa tàbí pinnu láti ṣe di Yorùbá àdánidá.
- source_word: διανοιῶν
  choice: àwọn èrò inú wa
  rationale: Ọ̀pọ̀-orúkọ Gíríìkì náà lè tọ́ka sí àwọn èrò, ìrònú, tàbí ìtẹ̀sí ọkàn. ‘Àwọn èrò inú wa’ ṣe kedere, ó sì bá ọ̀pọ̀-orúkọ náà mu.
- source_word: τέκνα ὀργῆς
  choice: ọmọ ìbínú
  rationale: Yíyan náà pa àkànlò èdè orísun mọ́, láìpinnu bóyá àfiyèsí pàtàkì wà lórí ìwà, ipò, tàbí jíjẹ́ ẹni tí ìdájọ́ ìbínú ń dúró de.
- source_word: φύσει
  choice: nípa ẹ̀dá
  rationale: Ó pa agbára ‘nípa ìwà ẹ̀dá’ mọ́ láìdín un kù sí ìbí tàbí ẹ̀jẹ̀ ara nìkan.
- source_word: οἱ λοιποί
  choice: àwọn yòókù
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún ìfiwéra pẹ̀lú gbogbo àwọn ènìyàn mìíràn tí a ń sọ̀rọ̀ nípa wọn.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú àyíká ìwà búburú
  choice: ara
  alternative: ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní agbára ti ìwà àti ẹ̀mí níbí, ‘ẹ̀dá ẹlẹ́ṣẹ̀’ máa túmọ̀ ẹ̀kọ́ ní ọ̀nà tó dín ju Gíríìkì lọ. ‘Ara’ pa ọ̀rọ̀ Paulu àti ìṣòro ìtumọ̀ rẹ̀ mọ́.
- issue: Agbára τέκνα φύσει ὀργῆς
  choice: Nípa ẹ̀dá, àwa sì jẹ́ ọmọ ìbínú
  alternative: Nípa ẹ̀dá, a jẹ́ àwọn ẹni tí ìbínú ń dúró de
  rationale: Ìtumọ̀ àkọ́kọ́ pa àkànlò Gíríìkì àti àìdánilójú bóyá ó tẹnu mọ́ ipò, ìwà, tàbí jíjẹ́ ẹni tó yẹ fún ìdájọ́ mọ́, láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- issue: Ohun tí ἐν οἷς ń tọ́ka sí
  choice: Láàárín àwọn náà
  alternative: Nínú àwọn nǹkan wọ̀nyẹn
  rationale: Àyíká tó sún mọ́ ọn jù lọ tọ́ka sí àwọn ‘ọmọ àìgbọ́ràn,’ ṣùgbọ́n ìbámu ọ̀rọ̀ tún lè jẹ́ kí a gbọ́ ọ gẹ́gẹ́ bí ìtọ́ka sí agbègbè ẹ̀ṣẹ̀ àti àìgbọ́ràn. Àkọ́kọ́ ni ó bá Yorùbá àti àyíká ènìyàn mu jù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá èdè àdánidá mu. A pa àwọn ọ̀rọ̀ pàtàkì bí ‘ara,’ ‘nípa ẹ̀dá,’ àti ‘ọmọ ìbínú’ mọ́ kí a má bàa yanjú àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí orísun fúnra rẹ̀ kò yanjú.
