  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ gbogbo ìpín ẹsẹ̀ náà mọ́ dáadáa: δι’ αὐτοῦ jẹ́ “nípasẹ̀ rẹ̀,” προσαγωγή jẹ́ àǹfààní/ìwọ̀lé sí ọ̀dọ̀ Baba, àti ἐν πνεύματι ni a túmọ̀ sí “nínú Ẹ̀mí.” Síbẹ̀, “Ẹ̀mí kan náà” túmọ̀ sí “the same Spirit,” nígbà tí ἐν ἑνὶ πνεύματι sọ “in one Spirit.” A gbọdọ̀ yọ “náà” kúrò kí ìdíye ἑνί má bàa yí padà.'
