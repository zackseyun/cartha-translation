source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: yo
  text: Nítorí nípasẹ̀ rẹ̀ ni àwa méjèèjì ní àyè láti dé ọ̀dọ̀ Baba nínú Ẹ̀mí kan.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ìbẹ̀rẹ̀ náà sí, “Nítorí pé nípasẹ̀ rẹ̀ ni …”
    reason: lexical_alternative
  - marker: b
    text: “Àyè láti dé ọ̀dọ̀” tún lè jẹ́ “ìwọ̀lé” tàbí “ọ̀nà láti sún mọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “nípasẹ̀ Ẹ̀mí kan.” “Nínú Ẹ̀mí kan” pa ọ̀rọ̀ Gíríìkì mọ́, ó sì lè sọ ọ̀nà tí a fi ń wọlé tàbí ipò ìṣọ̀kan nínú Ẹ̀mí hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ọ̀rọ̀ yìí ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ àlàáfíà àti ìràntípadà tó ṣáájú. “Nítorí” bá ìṣe ὅτι mu, ó sì lè dúró fún “for” tàbí “because” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń béèrè.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: διά pẹ̀lú ọ̀rọ̀ inú genitive ń tọ́ka sí ọ̀nà tàbí aṣojú. “Nípasẹ̀ rẹ̀” pa ipa Kristi gẹ́gẹ́ bí ẹni tí a fi ń dé ọ̀dọ̀ Baba mọ́.
- source_word: ἔχομεν
  choice: àwa … ní
  rationale: Èyí pa ìṣe present indicative mọ́, ó sì sọ pé ìwọ̀lé yìí jẹ́ ohun tí àwọn méjèèjì ní nísinsìnyí.
- source_word: τὴν προσαγωγὴν
  choice: ní àyè láti dé ọ̀dọ̀
  rationale: προσαγωγή lè túmọ̀ sí ìwọ̀lé, ìṣàfihàn ẹni sí iwájú ẹni ńlá, tàbí sísúnmọ́. Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún àṣẹ tàbí àǹfààní láti wọ iwájú ẹni, láì fi dandan sọ pé ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo ni.
- source_word: οἱ ἀμφότεροι
  choice: àwa méjèèjì
  rationale: Ó pa ohùn ẹni-àkọ́kọ́ àti ìṣọ̀kan àwọn méjì tí àyíká ọ̀rọ̀ ń tọ́ka sí—Júù àti Kèfèrí—mọ́, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν ἑνὶ πνεύματι
  choice: nínú Ẹ̀mí kan náà
  rationale: “Nínú” pa preposition ἐν mọ́, nígbà tí “kan náà” ń sọ ìpínpọ̀ Ẹ̀mí kan ṣoṣo di Yorùbá àdánidá. Lẹ́tà ńlá nínú “Ẹ̀mí” fi ìtumọ̀ tó ṣeé ṣe jù hàn pé Ẹ̀mí Mímọ́ ni, gẹ́gẹ́ bí àyíká ọ̀rọ̀ Mẹ́talọ́kan ṣe fi hàn.
- source_word: πρὸς τὸν πατέρα
  choice: láti dé ọ̀dọ̀ Baba
  rationale: πρός pẹ̀lú accusative ń tọ́ka sí ìlọ tàbí ìdarí sí iwájú ẹni. “Dé ọ̀dọ̀ Baba” jẹ́ Yorùbá tó mọ́, tó sì pa ìtumọ̀ ìsúnmọ́ sí wíwà Baba mọ́.
theological_decisions:
- issue: Ẹni tí “Ẹ̀mí kan náà” ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí tàbí ìfẹ́ inú kan tí àwọn ènìyàn pín pọ̀
  rationale: Àyíká Efesu 2:18 ń darúkọ Ọmọ (“nípasẹ̀ rẹ̀”), Ẹ̀mí, àti Baba lẹ́gbẹ̀ẹ́ ara wọn. Nítorí náà, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni πνεῦμα ń tọ́ka sí; síbẹ̀, a kò fi ọ̀rọ̀ “Mímọ́” tí kò sí nínú ẹsẹ náà kún àkọ́kọ́.
- issue: Agbára ìtumọ̀ προσαγωγή
  choice: àyè láti dé ọ̀dọ̀ Baba tí àwọn méjèèjì ní
  alternative: ìṣàfihàn wọn ní ìlànà àṣẹ sí iwájú Baba
  rationale: Ọ̀rọ̀ Gíríìkì lè ní àwòrán ààfin tàbí ìjọsìn, ṣùgbọ́n “àyè láti dé ọ̀dọ̀” ń sọ àǹfààní ìwọ̀lé tó ń bá a lọ hàn láì mú àwòrán kan ṣoṣo di dandan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó ṣeé lóye fún gbogbo ènìyàn. Àtòjọ “nípasẹ̀ rẹ̀ … nínú Ẹ̀mí … ọ̀dọ̀ Baba” pa ìṣètò Mẹ́talọ́kan inú Gíríìkì mọ́, nígbà tí “ní àyè láti dé ọ̀dọ̀” mú προσαγωγή dun bí Yorùbá àdánidá.
