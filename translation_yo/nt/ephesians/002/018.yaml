  rationale: 'Àtúnṣe kan ṣoṣo ni a nílò: a yí “Ẹ̀mí kan náà” padà sí “Ẹ̀mí kan” nínú ọ̀rọ̀ àkọ́kọ́ àti àlàyé ẹsẹ̀ abẹ́lẹ̀ c. Èyí pa ìtumọ̀ “one Spirit” ti ἑνὶ πνεύματι mọ́, dípò “the same Spirit,” láì yí ìtumọ̀ tàbí ìforúkọsílẹ̀ ẹsẹ̀ náà padà.'
