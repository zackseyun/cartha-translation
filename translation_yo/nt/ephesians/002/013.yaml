  source_fidelity: 'Ìtumọ̀ náà dára ní gbogbogbòò: ó pa ìyàtọ̀ νυνὶ δὲ, ìṣọ̀kan inú Mèsáyà Jésù, àti ipa ọ̀nà nínú ἐν τῷ αἵματι mọ́. Ṣùgbọ́n “ti wá sún mọ́lé” ní “ilé” tí kò sí nínú Gíríìkì, ó sì lè yí ìtumọ̀ padà sí wíwá sílé. Ἐγενήθητε jẹ́ aoristi passive; “a ti mú yín sún mọ́” jẹ́ ọ̀nà Yorùbá tó ṣàfihàn ìyípadà tí a ṣe sí wọn dáadáa.'
