  terminology: “Mèsáyà” jẹ́ ìtumọ̀ tó yẹ fún Χριστός gẹ́gẹ́ bí oyè, ó sì yẹ kí a lò ó ní ìbámu ní ibi méjèèjì. A tún àlàyé àkọsílẹ̀ (a) ṣe kí ó má bàa dà bí ẹni pé Mèsáyà ni ìtumọ̀ gbogbo ọrọ̀ Gíríìkì, ṣùgbọ́n kí ó ṣàlàyé pé Χριστός ni a túmọ̀ sí “Mèsáyà.”
