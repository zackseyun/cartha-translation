revisions:
- from: Ṣùgbọ́n nísinsìnyí, nínú Mèsáyà Jésù[a], ẹ̀yin tí ẹ ti jìnnà tẹ́lẹ̀[b] ti wá sún mọ́lé[c] nípasẹ̀ ẹ̀jẹ̀ Mèsáyà[d].
  to: Ṣùgbọ́n nísinsìnyí, nínú Mèsáyà Jésù[a], ẹ̀yin tí ẹ jìnnà rí[b], a ti mú yín sún mọ́[c] nípasẹ̀ ẹ̀jẹ̀ Mèsáyà[d].
  rationale: Àtúnṣe náà yọ “ilé” kúrò nínú ìtumọ̀, nítorí kò sí nínú ọ̀rọ̀ ìpilẹ̀. Ó tún lo ìlànà passive Yorùbá “a ti mú yín sún mọ́” láti bá ἐγενήθητε mu, nígbà tí “nípasẹ̀ ẹ̀jẹ̀ Mèsáyà” ń pa ipa instrumental ἐν mọ́. Àwọn àkọsílẹ̀ ni a ṣàtúnṣe kí àwọn àṣàyàn gidi, tí kò fi ìtumọ̀ ààyè tàbí ẹ̀kọ́ míì kún ọ̀rọ̀, lè wà fún olùkàá.
