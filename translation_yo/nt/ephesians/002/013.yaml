  - severity: low
    issue: Àkọsílẹ̀ (b) “ní òkèèrè” dín ìtumọ̀ μακράν kù sí jíjìnnà ní ààyè.
    rationale: μακράν lè jẹ́ jíjìnnà ní ààyè tàbí ní ìbátan; “ní òkèèrè” sábà túmọ̀ sí ilẹ̀ òkèèrè. Àṣàyàn “ní jíjìnnà” pa ìfẹ̀ẹ́ ìtumọ̀ ọrọ̀ náà mọ́.
