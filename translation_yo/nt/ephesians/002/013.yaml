source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsìnyí, nínú Mèsáyà Jésù[a], ẹ̀yin tí ẹ jìnnà rí[b], a ti mú yín sún mọ́[c] nípasẹ̀ ẹ̀jẹ̀ Mèsáyà[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mèsáyà” ni ìtumọ̀ ọrọ̀ Gíríìkì Χριστός; a tún lè sọ pé “Kristi Jésù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ̀yin tí ẹ wà ní jíjìnnà rí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ẹ ti di ẹni tí ó sún mọ́.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “nínú ẹ̀jẹ̀ Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n nísinsìnyí
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ipò wọn tẹ́lẹ̀ àti ipò wọn nísinsìnyí mọ́, ó sì fi ìtẹnumọ́ àsìkò νυνί hàn.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa èdè Pọ́ọ̀lù nípa ìṣọ̀kan àti ìdásípọ̀ mọ́; “Mèsáyà” sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè, kì í ṣe orúkọ lásán.
- source_word: ὑμεῖς οἵ ποτε ὄντες μακρὰν
  choice: ẹ̀yin tí ẹ ti jìnnà tẹ́lẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ipò tí wọn wà nígbà kan rí, ó sì pa àwòrán jíjìnnà mọ́ láì fi ìtumọ̀ májẹ̀mú kún un ní tààràtà.
- source_word: ἐγενήθητε ἐγγὺς
  choice: ti wá sún mọ́lé
  rationale: “Wá sún mọ́lé” fi ìyípadà láti jíjìnnà sí sísúnmọ́ hàn, ó sì tẹ̀lé ìtumọ̀ γίνομαι láì sọ ẹni tó mú ìyípadà náà ṣẹlẹ̀ ní pàtó.
- source_word: ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: nípasẹ̀ ẹ̀jẹ̀ Mèsáyà
  rationale: “Nípasẹ̀” fi ipa ἐν gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò hàn ní Yorùbá àdánidá, láì tú ẹ̀kọ́ nípa ètùtù síwájú ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà jáde dípò kí ó kan ṣe àfọwọ́kọ ọ̀rọ̀ Gíríìkì.
- issue: Ipa ἐν nínú ἐν τῷ αἵματι
  choice: nípasẹ̀ ẹ̀jẹ̀ Mèsáyà
  alternative: nínú ẹ̀jẹ̀ Mèsáyà
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ọ̀nà tí àwọn tó ti jìnnà fi sún mọ́lé. “Nípasẹ̀” sọ ọ̀nà náà ní kedere, ṣùgbọ́n àṣàyàn “nínú” ṣì ṣeé ṣe tí a bá ka ἐν gẹ́gẹ́ bí ààyè tàbí ipò.
- issue: Agbára ohùn ἐγενήθητε
  choice: ti wá sún mọ́lé
  alternative: a ti mú yín sún mọ́lé
  rationale: Àṣàyàn yìí pa ìyípadà ipò tí γίνομαι sọ mọ́, láì sọ agbára òde tàbí olùṣe kan ní pàtó; ìtumọ̀ pẹ̀lú “a ti mú” lè fi agbára ìṣe tí a kò sọ gbangba sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Sún mọ́lé” jẹ́ ọ̀rọ̀ àdánidá tí ó pa àwòrán jíjìnnà àti sísúnmọ́ inú Gíríìkì mọ́; “nínú Mèsáyà Jésù” sì pa àkànṣe èdè Pọ́ọ̀lù mọ́.
