language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: yo
  text: Ó sì wá, ó sì kéde àlàáfíà fún ẹ̀yin tí ó jìnnà[b][a], àti àlàáfíà fún àwọn tí ó súnmọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni pé, a kéde àlàáfíà fún àwọn tí wọ́n ti jìnnà tẹ́lẹ̀ àti fún àwọn tí wọ́n súnmọ́—nínú àyíká ọ̀rọ̀, àwọn Kèfèrí àti àwọn Júù lẹ́sẹẹsẹ (wo Efesu 2:11–13).
    reason: cross_reference
  - marker: b
    text: Tàbí, “ó wàásù ìròyìn ayọ̀ ti àlàáfíà.” Ọ̀rọ̀-ìṣe Gíríìkì náà sábà máa ń túmọ̀ sí “kéde ìròyìn ayọ̀,” ṣùgbọ́n ohun-ìṣe rẹ̀ níbí ni “àlàáfíà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ó sì wá
  rationale: Aorist participle náà jẹ́ ìṣe ìmúrasílẹ̀ tàbí ìṣe tí ó bá ọ̀rọ̀-ìṣe pàtàkì lọ; gbólóhùn aláìlèsọ “ó sì wá” jẹ́ Yorùbá àdánidá, ó sì pa àwòrán wíwá mọ́.
- source_word: εὐηγγελίσατο
  choice: ó sì kéde
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pípolongo ìròyìn ayọ̀. Nítorí pé ohun tí a kéde níbí ni “àlàáfíà,” “kéde” bá èdè Yorùbá mu láìfi ọ̀rọ̀ tí kò sí nínú orísun kún un; àlàyé ẹsẹ̀ fi ìtumọ̀ míì hàn.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún εἰρήνη, ó sì lè gba ìtumọ̀ ìpadà-ré àti ìwàpẹ̀lẹ́-kíkún tí àyíká ọ̀rọ̀ ní.
- source_word: ὑμῖν
  choice: fún ẹ̀yin
  rationale: Dative indirect object náà jẹ́ àdánidá ní Yorùbá gẹ́gẹ́ bí “fún ẹ̀yin,” ó sì pa ìtọ́ka tààrà sí àwọn olùgbọ́ mọ́.
- source_word: τοῖς μακρὰν
  choice: ẹ̀yin tí ẹ wà ní ọ̀nà jíjìn
  rationale: Ìtumọ̀ yìí pa àwòrán jíjìn mọ́, kì í sì í fi ìdánimọ̀ àwọn Kèfèrí sínú ọ̀rọ̀ pàtàkì.
- source_word: τοῖς ἐγγύς
  choice: àwọn tí ó wà nítòsí
  rationale: Ó pa ìfìwéra pẹ̀lú àwọn tí ó wà ní ọ̀nà jíjìn mọ́ ní Yorùbá tó ṣe kedere.
- source_word: καὶ ... καὶ
  choice: sì ... àti
  rationale: Àwọn àsopọ̀ yìí ṣọ̀kan àwọn ẹgbẹ́ méjèèjì tí wọ́n gba ìkéde kan náà, wọ́n sì mú kí gbólóhùn náà ṣàn ní Yorùbá.
theological_decisions:
- issue: Ìdánimọ̀ “àwọn tí ó wà ní ọ̀nà jíjìn” àti “àwọn tí ó wà nítòsí”
  choice: A pa àwòrán jíjìn àti sísúnmọ́ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: “ẹ̀yin Kèfèrí” àti “àwọn Júù”
  rationale: Àyíká Efesu 2:11–13 fi hàn pé àwọn Kèfèrí àti àwọn Júù ni Pọ́ọ̀lù ní lọ́kàn, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ lo àwọn ọ̀rọ̀ àwòrán. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú àwòrán náà ní ìdákẹ́jẹ sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin tí ẹ” fún àwọn olùgbọ́ tí a ń bá sọ̀rọ̀ tààrà, àti “àwọn tí ó” fún ẹgbẹ́ kejì.
