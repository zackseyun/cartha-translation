  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: yo
  text: Nítorí òun fúnra rẹ̀ ni àlàáfíà wa, ẹni tí ó sọ àwọn méjèèjì[a] di ọ̀kan, tí ó sì wó ògiri àárín tí ó jẹ́ ìdènà[b] lulẹ̀—ìyẹn, ìṣọ̀tá—nínú ara rẹ̀[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Àwọn méjèèjì’ ń tọ́ka sí àwọn Júù àti àwọn Kèfèrí nínú àyíká ọ̀rọ̀ yìí.
    reason: referent_clarification
  - marker: b
    text: 'Ní tààràtà: ‘ògiri àárín ti ọgbà ìdènà’; tàbí ‘ògiri àárín tí ó pín wọn sọ́tọ̀.’'
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì ní ‘nínú ẹran ara rẹ̀.’ Èyí ń tọ́ka sí ohun tí Kristi ṣe nípasẹ̀ ara rẹ̀ àti ikú rẹ̀ nínú ara, kì í ṣe sí yíyọ jíjẹ́ ènìyàn rẹ̀ kúrò.
    reason: lexical_clarification
  - marker: d
    text: A tún lè pín ọ̀rọ̀ Gíríìkì náà bí ‘ìṣọ̀tá nínú ara rẹ̀,’ tàbí kí ‘ìṣọ̀tá’ bẹ̀rẹ̀ èrò tí ó ń bá a lọ ní ẹsẹ̀ tó tẹ̀ lé.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: 'Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́: Kristi fúnra rẹ̀ ni àlàáfíà wa.'
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé rẹ̀.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: àlàáfíà wa
  rationale: ‘Àlàáfíà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìbágbépọ̀ àti ìpadàrẹ́ tí Kristi mú wá.
- source_word: τὰ ἀμφότερα
  choice: àwọn méjèèjì
  rationale: Ó dúró sítòsí ìtumọ̀ Gíríìkì láì fi orúkọ àwọn ẹgbẹ́ náà sínú ọ̀rọ̀ pàtàkì; àyíká ni ó fi hàn pé àwọn Júù àti àwọn Kèfèrí ni.
- source_word: ἓν
  choice: ọ̀kan
  rationale: Ó pa àbájáde ìṣọ̀kan tí ọ̀rọ̀ Gíríìkì sọ mọ́.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: ògiri àárín tí ń ṣe ìdènà
  rationale: Ó mú àwòrán ògiri tí ó pín àwọn ènìyàn sọ́tọ̀ àti iṣẹ́ rẹ̀ gẹ́gẹ́ bí ìdènà jáde ní Yorùbá àdánidá.
- source_word: λύσας
  choice: wó ... lulẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pípa ògiri run tàbí yíyọ ìdènà kúrò.
- source_word: τὴν ἔχθραν
  choice: ìṣọ̀tá
  rationale: Ó túmọ̀ ìtakora àti ìbáṣepọ̀ ọ̀tá ní ọ̀nà tí òǹkàwé òde òní lè lóye.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: nínú ara rẹ̀
  rationale: ‘Ara’ jẹ́ ọ̀nà Yorùbá tó bọ̀wọ̀ fún ìtumọ̀ ti ara ti σάρξ níbí, láì mú un dà bí ‘ìwà ẹlẹ́ṣẹ̀’; ‘nínú’ tún pa ìṣọ̀kan pẹ̀lú ἐν mọ́.
theological_decisions:
- issue: Ohun tí ‘àwọn méjèèjì’ ń tọ́ka sí
  choice: A fi ‘àwọn méjèèjì’ sí ọ̀rọ̀ pàtàkì, a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé àwọn Júù àti àwọn Kèfèrí ni.
  alternative: Láti sọ ‘àwọn ẹgbẹ́ méjèèjì’ tàbí láti darúkọ àwọn Júù àti àwọn Kèfèrí nínú ọ̀rọ̀ pàtàkì.
  rationale: Èyí pa ìfọ̀rọ̀wérọ̀ Gíríìkì mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ń mú ohun tí àyíká túmọ̀ sí ṣe kedere.
- issue: Ìtumọ̀ σάρξ nípa Kristi
  choice: nínú ara rẹ̀
  alternative: nípasẹ̀ ikú ara rẹ̀; nínú ẹran ara rẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́ ènìyàn àti ikú Kristi nínú ara, kì í ṣe sí ‘ìwà ẹlẹ́ṣẹ̀.’ ‘Ara’ dára, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ‘ẹran ara’ lọ ní àyíká yìí.
- issue: Ìbáṣepọ̀ ‘ìṣọ̀tá’ pẹ̀lú ògiri àti ‘nínú ara rẹ̀’
  choice: A fi ‘ìyẹn, ìṣọ̀tá’ sáàárín àmì gígùn méjì gẹ́gẹ́ bí àlàyé ògiri ìdènà, kí ‘nínú ara rẹ̀’ lè bá iṣẹ́ wíwó lulẹ̀ lọ.
  alternative: A lè ka ‘ìṣọ̀tá nínú ara rẹ̀’ papọ̀, tàbí so ‘ìṣọ̀tá’ mọ́ gbólóhùn tó tẹ̀ lé ní ẹsẹ̀ 15.
  rationale: Ìṣètò Gíríìkì lè mú ìbáṣepọ̀ àwọn ọ̀rọ̀ yìí ní ìṣòro. Àmì gígùn náà dín ewu èrò pé ìṣọ̀tá wà nínú Kristi kù, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé a lè pín gbólóhùn náà lọ́nà mìíràn.
translation_notes:
  register: Yorùbá tí ó ṣe déédéé, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A pa àmì kọ́ńmá sí òpin nítorí pé èrò Gíríìkì ń bá a lọ sínú ẹsẹ̀ 15. A yan ‘àlàáfíà’ dípò ọ̀rọ̀ àdàkọ míì nítorí ìlò rẹ̀ tí ó wọ́pọ̀ àti ìtumọ̀ ìpadàrẹ́ rẹ̀.
