id: EPH.2.21
reference: Ephesians 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: yo
  text: Nínú ẹni tí gbogbo ilé náà[a], tí a ń mú bá ara wọn mu, ń dàgbà sí tẹ́ńpìlì mímọ́ nínú Olúwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilé kọ̀ọ̀kan.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ilé náà gẹ́gẹ́ bí odindi kan tàbí sí ilé kọ̀ọ̀kan; àkọ́kọ́ tẹ̀lé àwòrán tẹ́ńpìlì kan ṣoṣo nínú àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka sí Kristi, ẹni tí a ṣẹ̀ṣẹ̀ pè ní òkúta igun ilé ní ẹsẹ tó ṣáájú; yíyan ‘ẹni’ pa ìtọ́kasí sí ẹni gidi mọ́.
- source_word: πᾶσα οἰκοδομὴ
  choice: gbogbo ilé náà
  rationale: Ó lè túmọ̀ sí ‘gbogbo ilé náà’ gẹ́gẹ́ bí odindi kan tàbí ‘ilé kọ̀ọ̀kan.’ Àwòrán tẹ́ńpìlì kan ṣoṣo nínú àyíká ọ̀rọ̀ mú kí ìtumọ̀ odindi yẹ sí àkọ́kọ́.
- source_word: συναρμολογουμένη
  choice: tí a ń so pọ̀ dáradára
  rationale: Ẹ̀yà ọ̀rọ̀ ìṣe tí ó wà ní pàṣípààrọ̀ àti àsìkò ìtẹ̀síwájú fi hàn pé a ń bá a lọ láti so àwọn apá ilé náà pọ̀ kí wọ́n bá ara wọn mu.
- source_word: αὔξει
  choice: ń dàgbà
  rationale: Ó pa ìṣe tí ń tẹ̀ síwájú àti àkàwé ìdàgbàsókè mọ́, bí ó tilẹ̀ jẹ́ pé ohun tí a ń sọ̀rọ̀ rẹ̀ jẹ́ ilé.
- source_word: εἰς
  choice: sí
  rationale: ‘Sí’ fi ibi tí ìdàgbàsókè náà ń lọ àti ohun tí ilé náà ń di hàn láìṣe àlàyé ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: ναὸν ἅγιον
  choice: tẹ́ńpìlì mímọ́
  rationale: ναός ń tọ́ka sí ibi mímọ́ inú tẹ́ńpìlì; ‘tẹ́ńpìlì mímọ́’ jẹ́ èdè Yorùbá tí ó ṣe kedere, tí ó sì pa àwòrán ẹ̀sìn náà mọ́.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ìsọ̀rọ̀ Pọ́ọ̀lù tí ó lè tọ́ka sí ìṣọ̀kan, àgbègbè ìgbésí ayé, tàbí ìbáṣepọ̀ pẹ̀lú Olúwa mọ́ láìdín ìtumọ̀ rẹ̀ kù.
theological_decisions:
- issue: Bóyá ᾧ tọ́ka sí Kristi gẹ́gẹ́ bí ẹni tàbí sí ilé/òkúta igun ilé gẹ́gẹ́ bí ohun kan
  choice: 'Ìtọ́kasí sí Kristi gẹ́gẹ́ bí ẹni: ‘Nínú ẹni tí’'
  alternative: 'Ìtọ́kasí sí ohun kan: ‘Nínú èyí tí’'
  rationale: Kristi Jésù fúnra rẹ̀ ni ẹni tí a dárúkọ ní ẹsẹ 20, èdè ‘nínú rẹ̀’ tí Pọ́ọ̀lù sì ń lò ní àyíká yìí ṣe àtìlẹ́yìn fún ìtọ́kasí sí Kristi.
- issue: Bóyá πᾶσα οἰκοδομὴ túmọ̀ sí ilé náà gẹ́gẹ́ bí odindi tàbí ilé kọ̀ọ̀kan
  choice: 'Ìtumọ̀ odindi: ‘gbogbo ilé náà’'
  alternative: 'Ìtumọ̀ pínpín: ‘ilé kọ̀ọ̀kan’'
  rationale: Àyíká ọ̀rọ̀ tẹnu mọ́ ìṣọ̀kan àwọn Júù àti àwọn Kèfèrí gẹ́gẹ́ bí ènìyàn tuntun kan àti tẹ́ńpìlì kan; síbẹ̀, ìtumọ̀ pínpín ṣì ṣeé ṣe nípa gírámà, nítorí náà a fi sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. ‘Tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀, ‘tí a ń so pọ̀ dáradára’ sì mú àwòrán iṣẹ́ ìkọ́lé àti ìṣe tí ń tẹ̀ síwájú jáde. A pa àmì ìdákẹ́jẹ ní òpin mọ́ nítorí ẹsẹ náà ń tẹ̀ sí ẹsẹ tó tẹ̀ lé e.
