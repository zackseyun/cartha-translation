id: EPH.2.15
reference: Ephesians 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: yo
  text: nípa pípa òfin àwọn àṣẹ tí a fi hàn nínú àwọn ìlànà run,[a] kí ó lè dá àwọn méjèèjì di ènìyàn tuntun kan nínú rẹ̀ fúnra rẹ̀,[b] nípa mímú àlàáfíà wá,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òfin àwọn àṣẹ nínú àwọn ìlànà,” “òfin àwọn àṣẹ tí ó wà nínú àwọn ìlànà,” tàbí ní ọ̀nà ìbílẹ̀, “òfin àwọn àṣẹ nínú àwọn òfin ìlànà.”
    reason: lexical_alternative
  - marker: b
    text: “Ènìyàn tuntun kan” jẹ́ àwòrán ẹyọ kan fún ẹgbẹ́ ènìyàn lápapọ̀; a tún lè túmọ̀ ọ́ sí “ẹ̀dá ènìyàn tuntun kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: òfin
  rationale: “Òfin” túmọ̀ νόμος ní ọ̀nà tó bójú mu; àfikún “àwọn àṣẹ” fi hàn pé òfin Mósè ní ìrísí àwọn àṣẹ ni a ń sọ̀rọ̀ rẹ̀.
- source_word: ἐντολῶν
  choice: àwọn àṣẹ
  rationale: Ó pa ìtumọ̀ àṣẹ májẹ̀mú mọ́, ó sì bá ìsopọ̀ rẹ̀ pẹ̀lú “òfin” mu.
- source_word: ἐν δόγμασιν
  choice: tí a fi hàn nínú àwọn ìlànà rẹ́
  rationale: δόγμα lè túmọ̀ sí ìlànà tàbí àṣẹ tí a gbé kalẹ̀. Gbólóhùn yìí sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú “àwọn àṣẹ” di mímọ̀ láì dín un kù sí àwọn àṣà ìsìn nìkan.
- source_word: καταργήσας
  choice: nípa pípa … rẹ́
  rationale: Ó fi agbára ọ̀rọ̀ Gíríìkì hàn gẹ́gẹ́ bí ìṣe ìpinnu tí ó mú ohun tí a mẹ́nu kàn kúrò, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó ṣe àfihàn ète tí ἵνα ń mú wọlé.
- source_word: τοὺς δύο
  choice: àwọn méjèèjì
  rationale: Ó tọ́ka sí àwọn ẹgbẹ́ méjì tí àyíká ẹsẹ̀ náà ń sọ̀rọ̀ nípa wọn, ìyẹn Júù àti Kèfèrí.
- source_word: κτίσῃ
  choice: dá
  rationale: “Dá” pa ìtumọ̀ ìṣẹ̀dá tuntun tí κτίζω ní mọ́.
- source_word: ἐν αὑτῷ
  choice: nínú ara rẹ̀
  rationale: Ó pa agbára arọ́pò-orúkọ afẹ́yinti αὑτῷ mọ́, ó sì fi hàn pé ìṣọ̀kan náà wà nínú Kristi fúnra rẹ̀.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: sí ọkùnrin tuntun kan ṣoṣo
  rationale: Ó pa àwòrán ẹnìkọ̀ọ̀kan akọ tí ἄνθρωπον lò mọ́, nígbà tí àyíká fi hàn pé àwòrán àpapọ̀ ni.
- source_word: ποιῶν εἰρήνην
  choice: nípa bẹ́ẹ̀, ó ń mú àlàáfíà wá
  rationale: Ó sọ participle náà ní Yorùbá àdánidá, ó sì so àlàáfíà mọ́ àbájáde ìdá àwọn méjèèjì sí ọ̀kan.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπον nínú àwòrán ìgbàlà àpapọ̀
  choice: ọkùnrin tuntun kan ṣoṣo
  alternative: ẹ̀dá ènìyàn tuntun kan ṣoṣo
  rationale: “Ọkùnrin” pa àwòrán akọ ẹyọ kan tí Gíríìkì lò mọ́; àlàyé ẹsẹ̀ fi hàn pé Júù àti Kèfèrí lápapọ̀ ni àwòrán náà dúró fún. Àṣàyàn kejì ṣe ìtumọ̀ àpapọ̀ náà kedere sí i, ṣùgbọ́n ó túmọ̀ àwòrán náà ju ti ọ̀rọ̀ ìpilẹ̀ṣẹ̀ lọ.
- issue: Agbára καταργήσας nípa òfin
  choice: nípa pípa òfin … rẹ́
  alternative: nípa mímú òfin … di aláìlágbára
  rationale: “Pípa … rẹ́” pa ọ̀rọ̀ Pọ́ọ̀lù tó lágbára mọ́. Ohun tí participle náà ń ṣe sí ni a ṣàlàyé pàtó gẹ́gẹ́ bí “òfin àwọn àṣẹ tí a fi hàn nínú àwọn ìlànà rẹ̀,” nítorí náà a kò fi ẹ̀kọ́ tó gbòòrò sí i kún ẹsẹ̀ náà.
- issue: Ibi tí ἐν αὑτῷ so mọ́ nínú gbólóhùn
  choice: kí ó lè dá àwọn méjèèjì nínú ara rẹ̀ sí ọkùnrin tuntun kan ṣoṣo
  alternative: kí ó lè dá àwọn méjèèjì sí ọkùnrin tuntun kan ṣoṣo nínú ara rẹ̀
  rationale: Ìṣètò àkọ́kọ́ tẹ̀lé ìtẹ̀sí Gíríìkì, ó sì jẹ́ kí “nínú ara rẹ̀” so mọ́ ìṣe dídá; àṣàyàn kejì ṣeé ṣe, ṣùgbọ́n ó lè dà bí ẹni pé “nínú ara rẹ̀” ń ṣàlàyé “ọkùnrin tuntun” nìkan.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ apá kan ti gbólóhùn gígùn, nítorí náà a pa àmì kọ́mà ìparí mọ́. “Nínú ara rẹ̀” tẹ̀lé ìtẹ̀sí Gíríìkì, “nípa bẹ́ẹ̀” sì mú ìbáṣepọ̀ participle ìkẹyìn hàn ní Yorùbá àdánidá.
