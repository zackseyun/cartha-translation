id: EPH.2.19
reference: Ephesians 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin kì í ṣe àjèjì tàbí àlejò tí ń gbé níbẹ̀ mọ́[a]. Kàkà bẹ́ẹ̀, ẹ jẹ́ ọmọ ìlú kan náà pẹ̀lú àwọn ẹni mímọ́[b][c], ẹ sì jẹ́ ara ilé Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú “àlejò tí ń gbé níbẹ̀” sí “àlejò alágbèé.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí ń gbé ní ibì kan láìní gbogbo ẹ̀tọ́ ọmọ ìlú.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gírámà, a tún lè sọ pé “ẹ jẹ́ ọmọ ìlú àwọn ẹni mímọ́.” Èrò pàtàkì ni pé àwọn onígbàgbọ́ ti di alábàápín ipò ọmọ ìlú pẹ̀lú àwọn ènìyàn mímọ́ ti Ọlọ́run.
    reason: lexical_alternative
  - marker: c
    text: “Àwọn ẹni mímọ́” níbí túmọ̀ sí àwọn ènìyàn tí Ọlọ́run yà sọ́tọ̀ gẹ́gẹ́ bí tirẹ̀, kì í ṣe ẹgbẹ́ àrà ọ̀tọ̀ kan tí a ti kéde ní pàtó lẹ́yìn ikú wọn.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Àpapọ̀ àwọn ọ̀rọ̀ ìsopọ̀ yìí ń fi ìparí tí ó jáde láti inú àlàyé ṣáájú hàn. “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìtumọ̀ náà mọ́.
- source_word: οὐκέτι
  choice: kì í ṣe … mọ́
  rationale: Ó fi hàn pé ipò wọn ti yí padà; ìṣètò “kì í ṣe … mọ́” ló bá èdè Yorùbá òde òní mu jù.
- source_word: ξένοι
  choice: àjèjì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe ọmọ ibẹ̀ tàbí tí kò jẹ́ ara ẹgbẹ́ náà. “Àjèjì” dá ìyàtọ̀ rẹ̀ sí “àlejò alágbèé” dúró.
- source_word: πάροικοι
  choice: àlejò alágbèé
  rationale: Ó ń tọ́ka sí ẹni tí ń gbé ní ibì kan láìní ẹ̀tọ́ ọmọ ìlú ní kíkún. “Àlejò alágbèé” mú apá ìgbé ibẹ̀ àti àìní ipò ọmọ ìlú jáde.
- source_word: συμπολῖται
  choice: ọmọ ìlú kan náà pẹ̀lú
  rationale: Ìtumọ̀ ọ̀rọ̀ àkópọ̀ náà ni jíjẹ́ alábàápín ipò ọmọ ìlú. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa èrò ìjọṣepọ̀ ọmọ ìlú mọ́.
- source_word: τῶν ἁγίων
  choice: pẹ̀lú àwọn ẹni mímọ́
  rationale: Ìbáṣepọ̀ náà ni a mú jáde bí jíjẹ́ ọmọ ìlú kan náà pẹ̀lú àwọn ènìyàn tí a yà sọ́tọ̀ fún Ọlọ́run, láìfi ìtumọ̀ náà mọ́ ẹgbẹ́ kékeré kan pàtó.
- source_word: οἰκεῖοι
  choice: ara ilé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn tí ó jẹ́ ti agbo ilé kan. “Ara ilé” pa àwòrán agbo ilé mọ́, ó sì ṣe kedere pé wọn kì í ṣe àlejò mọ́.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Nínú “ilé Ọlọ́run,” ìbáṣepọ̀ ohun-ìní tí ọ̀rọ̀ Gíríìkì ń fi hàn jẹ́ kedere, ó sì jẹ́ ìṣètò Yorùbá tí ó rọrùn.
theological_decisions:
- issue: Ẹni tí τῶν ἁγίων (“àwọn ẹni mímọ́”) ń tọ́ka sí
  choice: A pa ọ̀rọ̀ gbòòrò náà mọ́ gẹ́gẹ́ bí àwọn ènìyàn mímọ́ ti Ọlọ́run.
  alternative: Àwọn áńgẹ́lì nìkan; àwọn onígbàgbọ́ Júù nìkan; tàbí gbogbo àwọn onígbàgbọ́ ní pàtó.
  rationale: Àyíká ọ̀rọ̀ sọ nípa fífi àwọn Kèfèrí mọ́ àwọn ènìyàn Ọlọ́run, ṣùgbọ́n kò yẹ kí ìtumọ̀ náà dá ẹni tí ọ̀rọ̀ yìí ń tọ́ka sí lójú ju bí Gíríìkì ṣe ṣe lọ. Nítorí náà, a kò dín un kù sí ẹgbẹ́ kan nínú ẹsẹ pàtàkì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tí ó ní ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin/ẹ” fún ẹni púpọ̀, a sì pa ìyípadà àwòrán láti ipò ọmọ ìlú sí agbo ilé Ọlọ́run mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
