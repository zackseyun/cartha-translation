id: EPH.2.8
reference: Ephesians 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: yo
  text: Nítorí oore-ọ̀fẹ́ ni a fi gbà yín là nípasẹ̀ ìgbàgbọ́[b]; èyí[a] kò sì ti ọ̀dọ̀ yín wá; ẹ̀bùn Ọlọ́run ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó gbòòrò sí i: “gbogbo òtítọ́ ìgbàlà yìí nípa oore-ọ̀fẹ́ nípasẹ̀ ìgbàgbọ́ kò ti ọ̀dọ̀ yín wá.” Ó ṣeé ṣe jù pé ọ̀rọ̀ afihan Gíríìkì náà, “èyí,” ń tọ́ka sí gbogbo gbólóhùn tó ṣáájú, kì í ṣe sí “ìgbàgbọ́” nìkan.'
    reason: alternative_reading
  - marker: b
    text: A tún lè lóye “ìgbàgbọ́” gẹ́gẹ́ bí “ìgbẹ́kẹ̀lé”; ní àwọn àyíká kan, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìṣòtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτί
  choice: oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún inú rere àti ojúrere Ọlọ́run tí kò sinmi lórí ohun tí ènìyàn tọ́ sí.
- source_word: ἐστε σεσῳσμένοι
  choice: a ti gbà yín là
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe ti Gíríìkì mọ́, ó sì fi hàn pé iṣẹ́ ìgbàlà ti ṣẹlẹ̀, àbájáde rẹ̀ sì dúró títí di ìsinsìnyí.
- source_word: διὰ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: “Nípasẹ̀” fi διά pẹ̀lú ọ̀rọ̀-orúkọ oníbùkún hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò; “ìgbàgbọ́” jẹ́ ìtumọ̀ àkọ́kọ́ tó yẹ fún πίστις ní àyíká yìí.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò afihan yìí jẹ́ kí ìtọ́kasí Gíríìkì dúró ní ṣókí, ó sì lè tọ́ka sí gbogbo ohun tí a ṣẹ̀ṣẹ̀ sọ nípa gbígbàlà nípa oore-ọ̀fẹ́ nípasẹ̀ ìgbàgbọ́.
- source_word: οὐκ ἐξ ὑμῶν
  choice: kò sì ti ọ̀dọ̀ yín wá
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún pípa orísun tàbí ìpilẹ̀ṣẹ̀ kan mọ́, ó sì sọ pé ohun tí a mẹ́nu kàn kò pilẹ̀ láti ọ̀dọ̀ àwọn olùgbọ́.
- source_word: θεοῦ τὸ δῶρον
  choice: ẹ̀bùn Ọlọ́run ni
  rationale: Èyí pa ìbáṣepọ̀ ọ̀rọ̀-orúkọ náà mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ohun tí “èyí” (τοῦτο) ń tọ́ka sí ní ìbáṣepọ̀ pẹ̀lú oore-ọ̀fẹ́, ìgbàgbọ́ àti ìgbàlà
  choice: “Èyí” tọ́ka sí gbogbo òtítọ́ tí a ṣẹ̀ṣẹ̀ sọ nípa ìgbàlà nípa oore-ọ̀fẹ́ nípasẹ̀ ìgbàgbọ́, kì í ṣe sí “ìgbàgbọ́” nìkan.
  alternative: A lè ka “èyí” sí ohun tó ń tọ́ka pàtó sí ìgbàgbọ́ gẹ́gẹ́ bí ẹ̀bùn Ọlọ́run, tàbí sí oore-ọ̀fẹ́ pàtó.
  rationale: τοῦτο jẹ́ akọ-abo àárín, nígbà tí χάρις àti πίστις jẹ́ abo; nítorí náà, ó ṣeé ṣe jù pé ó ń tọ́ka sí gbogbo èrò inú gbólóhùn tó ṣáájú. Ìtumọ̀ náà kò fi ìpinnu ẹ̀kọ́ ìsìn kan lé ohun tí Gíríìkì kò sọ ní kedere lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “A ti gbà yín là” jẹ́ ọ̀nà àdánidá láti fi ohùn àìṣe àti ìṣe tí ó ti ṣẹlẹ̀ pẹ̀lú àbájáde tó ń bá a lọ hàn. A gbé àmì [a] mọ́ “èyí” àti [b] mọ́ “ìgbàgbọ́” kí ọ̀kọ̀ọ̀kan lè bá àlàyé ìsàlẹ̀ rẹ̀ mu.
