id: EPH.2.12
reference: Ephesians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: yo
  text: pé ní àkókò yẹn, ẹ wà láìní Mèsáyà[a], a ti yà yín sọ́tọ̀ kúrò nínú àwùjọ Ísírẹ́lì, ẹ sì jẹ́ àjèjì sí àwọn májẹ̀mú tí ó ní í ṣe pẹ̀lú ìlérí náà[b]; ẹ kò ní ìrètí, ẹ sì wà láìní Ọlọ́run nínú ayé.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì-òróró; “Mèsáyà” fi ìtumọ̀ oyè náà hàn nínú àyíká Júù àti májẹ̀mú yìí.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn májẹ̀mú ìlérí.”
    reason: lexical_alternative
  - marker: c
    text: “Láìní Ọlọ́run” lè túmọ̀ sí pé wọn kò ní àjọṣe pẹ̀lú Ọlọ́run tòótọ́, kì í ṣe dandan pé wọn ń sọ pé Ọlọ́run kò sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: láìní Mèsáyà
  rationale: Χριστοῦ jẹ́ oyè ní àyíká ọ̀rọ̀ Júù àti májẹ̀mú yìí; “Mèsáyà” fi ìtumọ̀ ẹni àmì-òróró náà hàn, nígbà tí “láìní” ṣe àfihàn ipò àìní tàbí jíjìnnà sí i.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ
  choice: a yà yín kúrò nínú àwùjọ Ísírẹ́lì
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ipò tí a ti gé wọn kúrò tàbí yà wọ́n sílẹ̀; πολιτεία níbí tọ́ka sí ètò àti ìdánimọ̀ àwùjọ Ísírẹ́lì, kì í ṣe ẹ̀tọ́ ọmọ ìlú nìkan.
- source_word: ξένοι
  choice: àjèjì sí
  rationale: Ó tọ́ka sí àwọn tí kò ní àjọṣe tàbí ààyè nínú agbègbè májẹ̀mú náà; “àjèjì sí” jẹ́ Yorùbá àdánidá tó sì pa ìfiwéra pẹ̀lú gbolohun tó ṣáájú mọ́.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: àwọn májẹ̀mú tí ó ní í ṣe pẹ̀lú ìlérí
  rationale: A pa ọ̀pọ̀ διαθηκῶν àti ẹyọ ἐπαγγελίας mọ́. Gbolohun náà tún pa àjọṣe genitive náà mọ́ láìfipá yan bóyá ìlérí kan pàtó ni tàbí ìlérí gẹ́gẹ́ bí àkóónú àwọn májẹ̀mú.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: ẹ kò ní ìrètí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti àdánidá láti ṣàpèjúwe ipò wọn tẹ́lẹ̀.
- source_word: ἄθεοι
  choice: ẹ sì wà láìní Ọlọ́run
  rationale: “Láìní Ọlọ́run” pa èrò àìní àjọṣe pẹ̀lú Ọlọ́run tòótọ́ mọ́, láìfi èrò ìgbàlódé nípa àìgbàgbọ́ pé Ọlọ́run wà kún ọ̀rọ̀ náà.
- source_word: ἐν τῷ κόσμῳ
  choice: nínú ayé
  rationale: Ìtumọ̀ yìí rọrùn, ó sì bá κόσμος gẹ́gẹ́ bí ibi ìgbé ayé ènìyàn mu.
- source_word: ὅτι ἦτε τῷ καιρῷ ἐκείνῳ
  choice: pé ní àkókò yẹn, ẹ wà
  rationale: “Pé” pa ìgbẹ́kẹ̀lé gbolohun náà mọ́ lórí àṣẹ láti rántí nínú ẹsẹ tó ṣáájú; “ní àkókò yẹn” sọ ipò àtijọ́ náà di mímọ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú àyíká Páùlù yìí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká Ísírẹ́lì, májẹ̀mú àti ìlérí, oyè ẹni àmì-òróró ni ó hàn gbangba; “Mèsáyà” pa ìtumọ̀ Júù yẹn mọ́. Àṣàyàn “Kristi” wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἄθεοι
  choice: láìní Ọlọ́run
  alternative: aláìní Ọlọ́run / aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: Èyí kò sọ wọ́n di àwọn tó ń tako wíwà Ọlọ́run ní ìtumọ̀ ọgbọ́n-òrò ìgbàlódé; ó pa ìṣòro ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àìní Ọlọ́run àti àjọṣe pẹ̀lú rẹ̀.
- issue: Àjọṣe διαθηκῶν àti ἐπαγγελίας
  choice: àwọn májẹ̀mú tí ó ní í ṣe pẹ̀lú ìlérí
  alternative: àwọn májẹ̀mú ìlérí
  rationale: Àṣàyàn àkọ́kọ́ pa ọ̀pọ̀ “májẹ̀mú” àti ẹyọ “ìlérí” mọ́, kò sì dájú ju Gíríìkì lọ nípa irú àjọṣe wọn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, “àwùjọ Ísírẹ́lì” fún ìtumọ̀ àpapọ̀ πολιτεία, a sì yà àlàyé àwọn àṣàyàn pàtàkì sí ìsàlẹ̀ kí ọ̀rọ̀ àkọ́kọ́ lè ṣàn dáadáa.
