  yaml_path: translation/nt/ephesians/002/009.yaml
  text: not from works[a], so that no one may boast.
translation:
  language: yo
  text: kì í ṣe láti inú àwọn iṣẹ́[a], kí ẹnikẹ́ni má bàa ṣògo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà túmọ̀ sí pé ohun náà kò wá láti inú àwọn iṣẹ́; ọ̀rọ̀ Gíríìkì náà tọ́ka sí orísun. Àwọn kan lóye rẹ̀ ní ìtumọ̀ ohun èlò, ìyẹn, ‘kì í ṣe nípasẹ̀ àwọn iṣẹ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: kì í ṣe láti inú àwọn iṣẹ́
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ orísun tí ἐξ ní mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun kan kò wá láti inú ohun mìíràn. A kò fi ‘àwọn iṣẹ́ òfin’ tàbí ‘àwọn iṣẹ́ rere’ kún un, nítorí ἔργων nìkan ni Gíríìkì sọ.
- source_word: ἵνα μή τις
  choice: kí ẹnikẹ́ni má bàa
  rationale: Ìtumọ̀ yìí fi ète tàbí àbájáde odi tí ἵνα μή ń mú wá hàn ní Yorùbá òde òní, ó sì tú τις sí ‘ẹnikẹ́ni’ láì fi akọ tàbí abo sí i.
- source_word: καυχήσηται
  choice: ṣògo
  rationale: ‘Ṣògo’ sọ ìgbéraga tàbí fífi ara ẹni yangàn nítorí ohun tí ẹni náà rò pé òun ṣe; ó bá lílo καυχάομαι ní àyíká ọ̀rọ̀ yìí mu.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn iṣẹ́’ nínú gbólóhùn Pọ́ọ̀lù
  choice: Pa gbólóhùn gbooro náà mọ́ gẹ́gẹ́ bí ‘àwọn iṣẹ́.’
  alternative: ‘Àwọn iṣẹ́ òfin,’ ‘ìsapá ènìyàn,’ tàbí ‘àwọn iṣẹ́ rere.’
  rationale: Gíríìkì sọ ἔργων nìkan. Fífún un ní àlàyé tó dín in kù sí iṣẹ́ òfin tàbí tó túmọ̀ rẹ̀ sí gbogbo ìsapá ènìyàn yóò jẹ́ ìtumọ̀ àlàyé dípò títúmọ̀ ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní èdè òde òní tí ó ní iyì. ‘Láti inú’ mú ìtumọ̀ orísun ἐξ jáde, ‘kí ... má bàa’ sì jẹ́ ọ̀nà àdánidá láti fi ète odi hàn.
