id: EPH.2.6
reference: Ephesians 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: yo
  text: ó sì jí wa dìde pẹ̀lú rẹ̀, ó sì mú wa jókòó pẹ̀lú rẹ̀ ní àwọn ibi ọ̀run, nínú Mèsáyà Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi Jésù.”
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγειρεν
  choice: jí wa dìde pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ pé Ọlọ́run jí àwọn onígbàgbọ́ dìde ní ìṣọ̀kan pẹ̀lú Kristi; “pẹ̀lú rẹ̀” mú agbára àfikún συν- hàn ní Yorùbá àdánidá.
- source_word: συνεκάθισεν
  choice: mú wa jókòó pẹ̀lú rẹ̀
  rationale: Èyí fi ìṣe mímú ẹnì kan jókòó papọ̀ pẹ̀lú ẹlòmíràn hàn, láì fi ìtumọ̀ ìjọba tàbí ìgorí-ìtẹ́ kún un.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ní àwọn ibi ọ̀run
  rationale: Àyọkà yìí tọ́ka sí agbègbè tàbí ìpele ti ọ̀run; “àwọn ibi ọ̀run” jẹ́ kedere, ó sì pa ìrísí ọ̀pọ̀ àti ìtumọ̀ ibi mọ́.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: Χριστός ní agbára oyè “Mèsáyà” níbí, “nínú” sì pa èdè ìṣọ̀kan pẹ̀lú Mèsáyà mọ́.
- source_word: καὶ
  choice: ó sì … ó sì
  rationale: Àtúnlò καὶ so àwọn ìṣe Ọlọ́run méjèèjì pọ̀; àtúnlò “ó sì” jẹ́ ọ̀nà Yorùbá tí ó bá a mu.
theological_decisions:
- issue: Èdè ìṣọ̀kan pẹ̀lú Kristi nínú àwọn ọ̀rọ̀-ìṣe aláfikún συν-
  choice: Fi “pẹ̀lú rẹ̀” hàn gbangba nínú àwọn ìṣe méjèèjì.
  alternative: “jí wa dìde, ó sì mú wa jókòó,” láì sọ “pẹ̀lú rẹ̀.”
  rationale: Àfikún συν- nínú àwọn ọ̀rọ̀-ìṣe méjèèjì tẹnumọ́ pé àwọn onígbàgbọ́ ní ìpín pẹ̀lú Kristi; fífi “pẹ̀lú rẹ̀” hàn kò fi ohun tuntun kún ọ̀rọ̀ náà.
- issue: Ṣíṣe Χριστῷ bí oyè tàbí bí orúkọ tí ó ti di mímú pọ̀
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: “Mèsáyà” mú ìtumọ̀ oyè Χριστός jáde ní kedere, nígbà tí “Kristi Jésù” jẹ́ àṣàyàn ìtumọ̀ tí ó wọ́pọ̀ nínú èdè ìjọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. A yan “àwọn ibi ọ̀run” láti pa ìtumọ̀ ibi/agbègbè mọ́; kò nílò àlàyé ẹsẹ̀ mìíràn nítorí pé àṣàyàn náà ti hàn tààrà nínú ọ̀rọ̀.
