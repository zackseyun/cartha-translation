id: EPH.2.5
reference: Ephesians 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: yo
  text: àní nígbà tí àwa ti kú nínú àwọn ìrékọjá wa, ó sọ wá di alààyè papọ̀ pẹ̀lú Mèsáyà[a]—nípa oore-ọ̀fẹ́ ni a ti gbà yín là—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” A túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” níhìn-ín láti pa ìtumọ̀ rẹ̀ mọ́; ìtumọ̀ Yorùbá ìbílẹ̀ sábà máa ń lò “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: nígbà tí àwa ti kú
  rationale: Ó fi ipò ikú tí ọ̀rọ̀ náà ṣàpèjúwe hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti so gbólóhùn aláìlópìn yìí mọ́ ọ̀rọ̀-ìṣe pàtàkì.
- source_word: τοῖς παραπτώμασιν
  choice: nínú àwọn ìrékọjá wa
  rationale: “Nínú” pa ìtumọ̀ agbègbè tàbí ipò mọ́ láìfi dandan pinnu pé àwọn ìrékọjá náà ni okùnfà; “wa” hàn gbangba nínú àyíká ẹni àkọ́kọ́ ọ̀pọ̀.
- source_word: συνεζωοποίησεν
  choice: ó sọ wá di alààyè papọ̀
  rationale: 'Ó pa ìtumọ̀ méjèèjì mọ́: fífúnni ní ìyè àti jíjẹ́ papọ̀.'
- source_word: τῷ Χριστῷ
  choice: pẹ̀lú Mèsáyà
  rationale: Dátífù náà ń tọ́ka sí ìṣọ̀kan tàbí ìbáṣepọ̀ pẹ̀lú ẹni náà; “Mèsáyà” sì pa ìtumọ̀ oyè Χριστός mọ́.
- source_word: χάριτί
  choice: nípa oore-ọ̀fẹ́
  rationale: Ó fi oore-ọ̀fẹ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ ìgbàlà, ní èdè Yorùbá tí ó wọ́pọ̀ nínú ọ̀rọ̀ ẹ̀sìn.
- source_word: ἐστε σεσῳσμένοι
  choice: a ti gbà yín là
  rationale: Àkójọpọ̀ “a ti ... yín” pa ohùn àìṣe àti abajade ìṣe tí ó ti ṣẹlẹ̀ mọ́; “yín” jẹ́ ẹni kejì ọ̀pọ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fi ìtumọ̀ àṣà “Kristi” hàn.
- issue: Agbára ọ̀rọ̀ àfikún χάριτί ἐστε σεσῳσμένοι
  choice: fi í sí àárín àwọn àmì ìdásílẹ̀ gígùn
  alternative: darapọ̀ mọ́ gbólóhùn náà láìsí àmì ìtẹnumọ́
  rationale: Ìdásílẹ̀ ojijì náà jẹ́ apá pàtàkì nínú ọ̀nà tí Pọ́ọ̀lù fi tẹnumọ́ oore-ọ̀fẹ́, ó sì yẹ kí a pa á mọ́ láìṣe àlàyé kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye, ni a lò. A pa ìtẹnumọ́ “àní” àti ìdásílẹ̀ méjì tó yí gbólóhùn oore-ọ̀fẹ́ ká mọ́. Àmì ìsàlẹ̀ [a] wà lẹ́yìn “Mèsáyà,” ibi tí àlàyé rẹ̀ kan ní tààrà.
