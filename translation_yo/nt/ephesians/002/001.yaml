id: EPH.2.1
reference: Ephesians 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: yo
  text: Àti ẹ̀yin, tí ẹ ti kú nínú àwọn ìrékọjá àti àwọn ẹ̀ṣẹ̀ yín,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: tí ẹ ti kú
  rationale: Ó fi àwòrán Gíríìkì ti jíjẹ́ ‘òkú’ pamọ́, ó sì bá ìṣọ̀kan gírámà ti ὑμᾶς … ὄντας mu gẹ́gẹ́ bí gbólóhùn àfikún tó ń dúró de ọ̀rọ̀-ìṣe pàtàkì ní ẹsẹ tó tẹ̀ lé.
- source_word: παραπτώμασιν
  choice: àwọn ìrékọjá
  rationale: ‘Ìrékọjá’ ń sọ ìgbésẹ̀ tí ó yà kúrò ní ọ̀nà tó tọ́ tàbí tó kọjá ààlà; fífi ọ̀pọ̀ hàn bá nọ́ńbà Gíríìkì mu.
- source_word: ἁμαρτίαις
  choice: àwọn ẹ̀ṣẹ̀
  rationale: ‘Ẹ̀ṣẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἁμαρτία, a sì pa ọ̀pọ̀ Gíríìkì mọ́.
- source_word: τοῖς … καὶ ταῖς
  choice: nínú àwọn … àti àwọn
  rationale: ‘Nínú’ pa ààyè ìtumọ̀ dátífù náà mọ́ gẹ́gẹ́ bí ipò tàbí àgbègbè ìwàláàyè, láì fi dandan pinnu rẹ̀ sí ìdí-okùnfà nìkan.
theological_decisions:
- issue: Bóyá ‘òkú’ túmọ̀ sí ikú gangan tàbí ipò ẹ̀mí
  choice: A fi àwòrán náà sílẹ̀ ní tààràtà gẹ́gẹ́ bí ‘tí ẹ ti kú’.
  alternative: ‘tí ẹ kò ní ìyè nípa tẹ̀mí’
  rationale: Ọ̀rọ̀ Gíríìkì lo ‘òkú’ láì ṣàlàyé àwòrán náà níbí; ṣíṣàlàyé rẹ̀ sí ‘nípa tẹ̀mí’ yóò dín ìtumọ̀ rẹ̀ kù, yóò sì fi ìtumọ̀ ẹ̀kọ́ kan kún un.
- issue: Ìbáṣepọ̀ dátífù τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις
  choice: ‘nínú àwọn ìrékọjá àti àwọn ẹ̀ṣẹ̀ yín’
  alternative: ‘nítorí àwọn ìrékọjá àti àwọn ẹ̀ṣẹ̀ yín’
  rationale: ‘Nínú’ ń jẹ́ kí ìtumọ̀ ipò tàbí agbègbè ẹ̀ṣẹ̀ dúró, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ okùnfà tún lè wà; a kò fẹ́ yanju àìdájú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àgbàṣe, tó ní iyì ṣùgbọ́n tó ṣeé lóye. A pa ìbẹ̀rẹ̀ ‘Àti’ àti ìṣọ̀kan gbólóhùn tí kò tíì parí mọ́, nítorí ẹsẹ yìí jẹ́ apá kan ti gbolohun Gíríìkì tó ń tẹ̀ síwájú.
