id: EPH.2.10
reference: Ephesians 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: yo
  text: Nítorí pé àwa ni iṣẹ́ ọwọ́ Ọlọ́run; a dá wa nínú Mèsáyà Jésù[a] fún àwọn iṣẹ́ rere tí Ọlọ́run ti pèsè sílẹ̀ ṣáájú, kí a lè rìn[b] nínú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi Jésù.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ẹni tí a fi òróró yàn mọ́.
    reason: alternative_reading
  - marker: b
    text: Ní ọ̀rọ̀ Paulu, “rìn” sábà máa ń tọ́ka sí bí ènìyàn ṣe ń gbé ìgbé ayé rẹ̀ tàbí sí ìwà rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: iṣẹ́ ọwọ́
  rationale: Ó fi hàn pé àwa jẹ́ ohun tí Ọlọ́run dá tàbí ṣe; ‘iṣẹ́ ọwọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò mú kí ìtumọ̀ náà dà bí iṣẹ́ ẹ̀rọ.
- source_word: κτισθέντες
  choice: tí a dá
  rationale: Ó dúró fún participle passive aorist náà ní ọ̀nà Yorùbá tó ṣe kedere, ó sì so ìdá wa pọ̀ mọ́ jíjẹ́ iṣẹ́ ọwọ́ Ọlọ́run.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: ‘Mèsáyà’ túmọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró, nígbà tí ‘nínú’ pa èrò ìṣọ̀kan tàbí ìdásílẹ̀ nínú rẹ̀ mọ́.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: fún àwọn iṣẹ́ rere
  rationale: ‘Fún’ fi ète tàbí àbájáde tí ἐπί pẹ̀lú dative ní níbí hàn láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: προητοίμασεν
  choice: ti pèsè sílẹ̀ ṣáájú
  rationale: Ó pa ìtumọ̀ προ- mọ́ ní kedere, pé Ọlọ́run ti ṣe ìmúrasílẹ̀ náà tẹ́lẹ̀.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète gbólóhùn náà hàn ní Yorùbá àdánidá, láì sọ àbájáde náà di ohun tí kò lè yà.
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: kí a lè máa rìn nínú wọn
  rationale: ‘Rìn’ pa àwòrán ọ̀rọ̀ Paulu mọ́, ‘máa’ sì tọ́ka sí ìgbé-ayé tàbí ìwà tó ń bá a lọ; ‘nínú wọn’ ń tọ́ka padà sí àwọn iṣẹ́ rere.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé pẹ̀lú ohun tí ó ṣáájú mọ́.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ ohun-ìní Yorùbá àdánidá ni, ó sì ń tọ́ka sí Ọlọ́run nínú ọ̀rọ̀ tó ṣáájú.
theological_decisions:
- issue: 'Bí a ṣe máa tú Χριστῷ: gẹ́gẹ́ bí oyè tàbí bí apá orúkọ'
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ní agbára oyè níbí; ‘Mèsáyà’ pa ìtumọ̀ ‘ẹni àmì òróró’ mọ́ dípò kí a kan ṣe àkọsílẹ̀ ohùn ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ ìpèsè Ọlọ́run ṣáájú àti ìwà ènìyàn
  choice: àwọn iṣẹ́ rere tí Ọlọ́run ti pèsè sílẹ̀ ṣáájú, kí a lè máa rìn nínú wọn
  alternative: àwọn iṣẹ́ rere tí Ọlọ́run ti pèsè sílẹ̀ ṣáájú pé kí a ṣe wọ́n
  rationale: Ìtumọ̀ náà pa ìdásílẹ̀ Ọlọ́run àti ète pé àwọn onígbàgbọ́ máa gbé nínú iṣẹ́ rere pọ̀, láìyanjú àríyànjiyàn ẹ̀kọ́ nípa ìpinnu tẹ́lẹ̀ tàbí ipa ìfẹ́ ènìyàn ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán ‘rìn’ àti ìtumọ̀ oyè ‘Mèsáyà’ mọ́, nígbà tí ìṣètò gbólóhùn jẹ́ àdánidá fún olùkà Yorùbá.
