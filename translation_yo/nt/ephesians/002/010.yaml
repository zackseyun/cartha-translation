    issue: Relative clause ‘tí a dá’ lè so mọ́ ‘iṣẹ́ ọwọ́’ ní gírámà Yorùbá.
    rationale: Nínú Gíríìkì, κτισθέντες ń ṣàlàyé ‘àwa.’ Ṣíṣe ‘a dá wa’ jẹ́ kí ẹni tí a dá hàn gbangba, ó sì dá ìbáṣepọ̀ participle náà sípò.
  - severity: low
    issue: ‘Máa’ nínú ‘kí a lè máa rìn’ ń fi ìtumọ̀ aspect ìtẹ̀síwájú kún un.
    rationale: Aorist subjunctive περιπατήσωμεν kò béèrè fún ìtẹnumọ́ ìṣe tí ń tẹ̀síwájú. ‘Kí a lè rìn’ pa ète náà àti àwòrán náà mọ́ ní ọ̀nà tó kéré sí ìtúmọ̀-àfikún.
  - severity: low
    issue: ‘Ẹni àmì òróró’ nínú àlàyé Mèsáyà kò jẹ́ ọ̀nà Yorùbá tó péye láti ṣàlàyé ẹni tí a fi òróró yàn.
    rationale: ‘Ẹni tí a fi òróró yàn’ jẹ́ ìsọ̀rọ̀ tó hàn gbangba, tó sì ṣàfihàn ìtumọ̀ oyè Χριστός dáadáa.
