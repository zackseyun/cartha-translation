  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: ποίημα jẹ́ ‘iṣẹ́ ọwọ́,’ κτισθέντες jẹ́ ìdá nípasẹ̀ ìṣe Ọlọ́run, ἐν Χριστῷ Ἰησοῦ jẹ́ ‘nínú Mèsáyà Jésù,’ àti ète àwọn iṣẹ́ rere tí Ọlọ́run pèsè ṣáájú ni a pa mọ́. Ṣùgbọ́n ìṣètò ‘àwa ni iṣẹ́ ọwọ́ rẹ̀, tí a dá’ lè jẹ́ kí relative clause náà hàn bí ẹni pé ó ń ṣàlàyé ‘iṣẹ́ ọwọ́’ dípò ‘àwa.’ Àtúnṣe náà jẹ́ kí passive participle náà so mọ́ ‘àwa’ ní kedere.'
  naturalness: ‘Nítorí pé àwa ni iṣẹ́ ọwọ́ Ọlọ́run; a dá wa…’ jẹ́ Yorùbá boṣewa, ó sì yọ ìdààmú gírámà kúrò. ‘Kí a lè rìn nínú wọn’ pa àwòrán Paulu mọ́ láìfi aspect ìtẹ̀síwájú ‘máa’ tí kò ṣe dandan kún un.
  terminology: ‘Iṣẹ́ ọwọ́,’ ‘Mèsáyà Jésù,’ ‘iṣẹ́ rere,’ àti ‘pèsè sílẹ̀ ṣáájú’ yẹ, wọ́n sì bá ìpinnu pé kí Χριστός hàn gẹ́gẹ́ bí oyè mu. A tún ṣe àtúnṣe àlàyé ẹsẹ̀-àlàfọ̀ọ̀tì láti sọ ‘ẹni tí a fi òróró yàn,’ èyí tó jẹ́ ìtumọ̀ Yorùbá tó péye àti tó rọrùn fún ‘anointed one.’
  issues:
