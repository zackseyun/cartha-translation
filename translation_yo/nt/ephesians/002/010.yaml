  to: Nítorí pé àwa ni iṣẹ́ ọwọ́ Ọlọ́run; a dá wa nínú Mèsáyà Jésù[a] fún àwọn iṣẹ́ rere tí Ọlọ́run ti pèsè sílẹ̀ ṣáájú, kí a lè rìn[b] nínú wọn.
  rationale: A tún ìṣètò gbolóhùn náà ṣe kí ‘a dá wa’ tọ́ka sí ‘àwa’ ní kedere, gẹ́gẹ́ bí participle passive Gíríìkì ṣe ń ṣe. A yọ ‘máa’ kúrò kí a má fi aspect míì kún aorist subjunctive, ṣùgbọ́n a pa àwòrán ‘rìn nínú wọn’ mọ́. A sì mú àlàyé oyè Mèsáyà dájú ní Yorùbá.
