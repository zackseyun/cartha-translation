  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: yo
  text: kí ó lè fi ọrọ̀ oore-ọ̀fẹ́ rẹ̀ tí ó rékọjá lọ[b] hàn ní àwọn àkókò tí ń bọ̀[a], nínú ìwà rere rẹ̀ sí wa nínú Mèsáyà Jésù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn ìgbà ayé tí ń bọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọrọ̀ oore-ọ̀fẹ́ rẹ̀ tí kò ṣeé díwọ̀n.”
    reason: lexical_alternative
  - marker: c
    text: 'Ní Gíríìkì: “nínú Kristi Jésù”; a tú Χριστός sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó ń fi ète tàbí àbájáde ohun tí a sọ ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἐνδείξηται
  choice: fi … hàn
  rationale: Ó mú ìtumọ̀ fífi ohun kan hàn ní gbangba tàbí ṣíṣe àfihàn rẹ̀ jáde dáadáa.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: ní àwọn àkókò tí ń bọ̀
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà àti ìtọ́ka sí àwọn sáà ọjọ́ iwájú mọ́, ní èdè tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: ọrọ̀ … tí ó pọ̀ rékọjá
  rationale: ‘Ọrọ̀’ dúró fún ọ̀pọ̀lọpọ̀ ohun iyebíye, ‘tí ó pọ̀ rékọjá’ sì pa agbára ὑπερβάλλον mọ́ láì sọ pé a lè wọn dé òpin.
- source_word: τῆς χάριτος αὐτοῦ
  choice: oore-ọ̀fẹ́ rẹ̀
  rationale: ‘Oore-ọ̀fẹ́’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún χάρις Ọlọ́run nínú ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: ἐν χρηστότητι
  choice: nínú rere rẹ̀
  rationale: Ó sọ inú rere, ìṣoore àti ìwà pẹ̀lẹ́ onínúure; ìtumọ̀ yìí tún pa ìbáṣepọ̀ preposition ἐν mọ́.
- source_word: ἐφ’ ἡμᾶς
  choice: sí wa
  rationale: Ó fi ìdarí inú rere Ọlọ́run sí wa hàn ní Yorùbá àdánidá.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: Ó pa èrò ìṣọ̀kan tàbí ipò ‘nínú’ rẹ̀ mọ́, ó sì tú Χριστός gẹ́gẹ́ bí oyè Mèsáyà dípò orúkọ ìdílé.
theological_decisions:
- issue: 'Bí a ṣe máa tú Χριστῷ: gẹ́gẹ́ bí oyè tàbí ọ̀nà orúkọ tí ó ti fẹsẹ̀ múlẹ̀'
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ṣì ní agbára oyè ẹni tí a fòróró yàn níbí; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde, nígbà tí ó tún pa ọ̀rọ̀ Pọ́ọ̀lù nípa wíwà ‘nínú’ rẹ̀ mọ́.
- issue: Ìbáṣepọ̀ ἵνα pẹ̀lú ọ̀rọ̀ ṣáájú
  choice: kí ó lè
  alternative: nítorí kí ó lè
  rationale: ‘Kí ó lè’ lè jẹ́ ète tàbí àbájáde, nítorí náà kò fi tipátipá yanjú ìfararora méjèèjì tí ἵνα lè ní nínú àyíká ọ̀rọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Gbólóhùn náà pa ọ̀pọ̀ nọ́ńbà ‘àwọn àkókò,’ àwòrán ‘ọrọ̀’ oore-ọ̀fẹ́, àti ọ̀rọ̀ ìṣọ̀kan ‘nínú Mèsáyà Jésù’ mọ́.
