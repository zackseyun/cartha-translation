id: EPH.2.2
reference: Ephesians 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: yo
  text: Nínú àwọn nǹkan wọ̀nyí ni ẹ ti rìn nígbà kan rí, ní ìbámu pẹ̀lú sáà ayé yìí, ní ìbámu pẹ̀lú olórí àṣẹ afẹ́fẹ́, ẹ̀mí tí ń ṣiṣẹ́ nísinsin yìí nínú àwọn ọmọ àìgbọ́ràn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἷς
  choice: nínú èyí tí
  rationale: Ó tọ́ka padà sí àwọn ìrékọjá àti ẹ̀ṣẹ̀ ní ẹsẹ ṣáájú. Èdè Yorùbá kò fi nọ́ńbà hàn nínú arọ́pò-orúkọ ìbátan bí Gíríìkì, ṣùgbọ́n ‘nínú’ pa ìtumọ̀ ibi tàbí ipò mọ́.
- source_word: ποτε
  choice: nígbà kan rí
  rationale: Gbólóhùn Yorùbá àdánidá yìí fi hàn pé ìwàláàyè náà jẹ́ ti àtijọ́.
- source_word: περιεπατήσατε
  choice: ẹ ti rìn
  rationale: ‘Rìn’ pa àkàwé Pọ́ọ̀lù mọ́ fún ọ̀nà ìgbésí ayé; àlàyé ìsàlẹ̀ ojú ewé mú ìtumọ̀ àkàwé náà ṣe kedere.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: ní ìbámu pẹ̀lú sáà ayé yìí
  rationale: ‘Sáà’ dúró fún αἰών gẹ́gẹ́ bí àkókò tàbí ìlànà ìgbà, ‘ayé’ sì dúró fún κόσμος; èyí pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́.
- source_word: ἄρχοντα
  choice: olórí
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tó ń ṣàkóso, láìlo ọ̀rọ̀ àtijọ́ tàbí oyè ìjọba kan pàtó.
- source_word: τῆς ἐξουσίας
  choice: àṣẹ
  rationale: ‘Àṣẹ’ sọ agbára ìṣàkóso tàbí ẹ̀tọ́ láti ṣàkóso tí ἐξουσία sábà ń túmọ̀ sí.
- source_word: τοῦ ἀέρος
  choice: afẹ́fẹ́
  rationale: Ìtumọ̀ tààrà ni; a kò sọ ọ́ di ẹ̀kọ́ nípa bí àgbáyé ṣe rí, àlàyé ìsàlẹ̀ ojú ewé sì ṣàlàyé àyíká èdè ìgbàanì náà.
- source_word: τοῦ πνεύματος
  choice: ẹ̀mí
  rationale: Àmì-ohùn kékeré àti àyíká ọ̀rọ̀ fi hàn pé kì í ṣe Ẹ̀mí Mímọ́. Kọ́mà pa ìbáṣepọ̀ àfikún-àlàyé mọ́ láìpinnu bóyá ẹni kan náà gan-an ni tàbí agbára ẹ̀mí tó wà lábẹ́ rẹ̀.
- source_word: τοῦ νῦν ἐνεργοῦντος
  choice: tí ń ṣiṣẹ́ nísinsin yìí
  rationale: Ó jẹ́ Yorùbá àdánidá tó pa iṣẹ́ tó ń bá a lọ ní àkókò ìsinsin yìí mọ́.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: nínú àwọn ọmọ àìgbọ́ràn
  rationale: ‘Ọmọ àìgbọ́ràn’ pa àṣà-ọ̀rọ̀ Gíríìkì/Sẹ́mítì mọ́. ‘Ọmọ’ ní Yorùbá kò fi akọ tàbí abo hàn, nítorí náà a kò lè fi akọ inú υἱοῖς hàn láìjẹ́ kí ó dà bí ẹni pé àwọn ọkùnrin nìkan ni a ń sọ.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘ẹ̀mí tí ń ṣiṣẹ́’ pẹ̀lú ‘olórí àṣẹ afẹ́fẹ́’
  choice: A fi ‘ẹ̀mí’ sí lẹ́yìn kọ́mà gẹ́gẹ́ bí àfikún àlàyé sí ọ̀rọ̀ tó ṣáájú.
  alternative: Kí a sọ ní gbangba pé ẹ̀mí náà ni olórí náà gan-an, tàbí pé agbára ẹ̀mí míràn ni tó wà lábẹ́ olórí náà.
  rationale: Ètò àwọn ọ̀rọ̀ Gíríìkì gba ìbáṣepọ̀ àfikún-àlàyé láàyè, ṣùgbọ́n kò yẹ kí ìtumọ̀ pinnu irú ẹni tàbí agbára tí ẹ̀mí náà jẹ́ ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ìtumọ̀ υἱοῖς τῆς ἀπειθείας
  choice: àwọn ọmọ àìgbọ́ràn
  alternative: àwọn ọmọkùnrin àìgbọ́ràn; àwọn aláìgbọ́ràn
  rationale: ‘Ọmọ’ ni ọ̀nà Yorùbá tó bójú mu fún àṣà-ọ̀rọ̀ náà, ó sì yàgò fún fífi akọ kún un níbi tí ‘ọmọkùnrin’ yóò ti mú kí òǹkàwé rò pé ọkùnrin nìkan ni. Àlàyé fi hàn pé ó túmọ̀ sí àwọn ènìyàn tí àìgbọ́ràn ń ṣe àpèjúwe wọn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì-ohùn ní kíkún. A pa àkàwé ‘rìn,’ ìyàtọ̀ láàárín ‘sáà’ àti ‘ayé,’ àti ẹ̀wọ̀n ọ̀rọ̀ nípa olórí, àṣẹ, afẹ́fẹ́ àti ẹ̀mí mọ́ bó ti ṣeé ṣe, ṣùgbọ́n a lo àlàyé ìsàlẹ̀ ojú ewé níbi tí ìtumọ̀ tààrà lè dàrú.
