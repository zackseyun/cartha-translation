id: EPH.2.20
reference: Ephesians 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: yo
  text: tí a ti kọ́ yín sórí ìpìlẹ̀ àwọn àpọ́sítélì àti àwọn wòlíì[a], Mèsáyà Jesu[b] fúnra rẹ̀ sì ni òkúta igun ilé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn “ìpìlẹ̀ àwọn àpọ́sítélì àti àwọn wòlíì” lè túmọ̀ sí ìpìlẹ̀ tó ní í ṣe pẹ̀lú ẹ̀rí wọn, ìpìlẹ̀ tí wọ́n fi lélẹ̀, tàbí ìpìlẹ̀ tí àwọn fúnra wọn jẹ́; ọ̀rọ̀ Gíríìkì kò yan ọ̀kan pàtó.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “Kristi Jesu.” Níhìn-ín, “Mèsáyà” ń pa ìtumọ̀ oyè Gíríìkì Χριστός mọ́.
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: tí a ti kọ́ yín sórí
  rationale: Ó pa ohùn àìṣe àti ìṣe tí ó ti ṣẹlẹ̀ mọ́, ó sì so gbolohun náà mọ́ ọ̀rọ̀ tó ṣáájú bí participle Gíríìkì ṣe ń ṣe. Fífi “yín” hàn mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere ní Yorùbá láì yí àwòrán ilé padà.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: sórí ìpìlẹ̀
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé a kọ́ ilé lé ohun tí ń gbé e dúró.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: àwọn àpọ́sítélì àti àwọn wòlíì
  rationale: A fi ìbátan náà sílẹ̀ láì sọ pàtó pé àwọn ni ìpìlẹ̀ tàbí pé àwọn ni wọ́n fi ìpìlẹ̀ náà lélẹ̀; àlàyé ìsàlẹ̀ ṣàfihàn àìdánilójú inú genitive Gíríìkì.
- source_word: ὄντος
  choice: sì ni
  rationale: Ìṣètò yìí jẹ́ ti Yorùbá àdánidá fún genitive absolute náà, ó sì fi ipò Mèsáyà Jesu nínú àwòrán ilé hàn láì fi ìtumọ̀ míì kún un.
- source_word: ἀκρογωνιαίου
  choice: òkúta igun ilé
  rationale: Ọ̀rọ̀ yìí dá àwòrán òkúta pàtàkì ní igun ìpìlẹ̀ ilé dúró, ó sì yé òǹkà Yorùbá òde òní.
- source_word: αὐτοῦ
  choice: fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ó sì tọ́ka sí Mèsáyà Jesu gẹ́gẹ́ bí ẹni, kì í ṣe sí ìpìlẹ̀ gẹ́gẹ́ bí ohun aláìlẹ́mìí.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jesu
  rationale: “Mèsáyà” ń pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè Ẹni Àmì-òróró mọ́; àlàyé ìsàlẹ̀ fúnni ní “Kristi Jesu” gẹ́gẹ́ bí ọ̀nà ìtumọ̀ tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ “ìpìlẹ̀ àwọn àpọ́sítélì àti àwọn wòlíì”
  choice: A pa ìbátan gbòòrò inú genitive náà mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: “ìpìlẹ̀ tí àwọn àpọ́sítélì àti àwọn wòlíì fi lélẹ̀” tàbí ìpìlẹ̀ tí àwọn fúnra wọn jẹ́
  rationale: Gíríìkì kò sọ pàtó bóyá ẹ̀rí/ẹ̀kọ́ wọn, iṣẹ́ wọn, tàbí àwọn fúnra wọn ni a ń wo gẹ́gẹ́ bí ìpìlẹ̀. Kí a yan ọ̀kan ṣoṣo yóò tú ìforígbárí ìtumọ̀ tí orísun náà fi sílẹ̀.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: Níhìn-ín Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà hàn gbangba, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀nà ìtumọ̀ ìbílẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Èdè náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkà òde òní. A pa ìrísí gbolohun tí ó ń bá ẹsẹ tó ṣáájú lọ mọ́ nípa bẹ̀rẹ̀ pẹ̀lú “tí,” a sì pa àwòrán iṣẹ́ ìkọ́lé mọ́ jálẹ̀.
