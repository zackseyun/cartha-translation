id: EPH.2.4
reference: Ephesians 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run, ẹni tí ó lọ́rọ̀ nínú àánú, nítorí ìfẹ́ ńlá rẹ̀ tí ó fi fẹ́ wa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn sí àpèjúwe ipò ènìyàn tí ó ṣáájú; “Ṣùgbọ́n” jẹ́ ọ̀nà àdánidá láti pa agbára ìtakora náà mọ́ ní Yorùbá.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: ẹni tí ó ní àánú lọ́pọ̀lọpọ̀
  rationale: Gíríìkì sọ ní tààrà pé Ọlọ́run “jẹ́ ọlọ́rọ̀ nínú àánú.” Ọ̀rọ̀ Yorùbá yìí sọ ọ̀pọ̀lọpọ̀ àánú rẹ̀ ní kedere, láìjẹ́ kí àkànlò èdè orísun dà bí èdè àjèjì.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: nítorí ìfẹ́ ńlá rẹ̀
  rationale: διά pẹ̀lú accusative ń tọ́ka sí ìdí; “nítorí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere. “Ìfẹ́ ńlá” sì dúró fún ọ̀pọ̀ àti agbára ìfẹ́ náà.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: tí ó fi fẹ́ wa
  rationale: Ó pa gbólóhùn ìbátan náà àti àtúnṣe gbòǹgbò ọ̀rọ̀ ἀγάπη/ἀγαπάω mọ́ nípasẹ̀ “ìfẹ́ … fẹ́,” bí ó tilẹ̀ jẹ́ pé Yorùbá máa ń lo “fi” ní àkànlò yìí.
theological_decisions:
- issue: Pípa àtúnṣe ọ̀rọ̀ “ìfẹ́ … fẹ́” mọ́
  choice: ìfẹ́ ńlá rẹ̀ tí ó fi fẹ́ wa
  alternative: ìfẹ́ ńlá rẹ̀ sí wa
  rationale: Orísun Gíríìkì mọ̀ọ́mọ̀ tún gbòǹgbò ọ̀rọ̀ ìfẹ́ ṣe fún ìtẹnumọ́. Àṣàyàn yìí pa ìtẹnumọ́ náà mọ́ dípò títún un ṣe sí gbólóhùn tó rọrùn ṣùgbọ́n tí kò ní àtúnṣe náà.
- issue: Ìbáṣepọ̀ àánú àti ìfẹ́
  choice: 'Pa wọ́n mọ́ gẹ́gẹ́ bí èrò méjì tó yàtọ̀ ṣùgbọ́n tó ní ìbáṣepọ̀: “ní àánú lọ́pọ̀lọpọ̀, nítorí ìfẹ́ ńlá rẹ̀”'
  alternative: Darapọ̀ wọn sí èrò kan, bí “nítorí ìfẹ́ aláàánú rẹ̀”
  rationale: Gíríìkì fi àánú àti ìfẹ́ hàn lọ́tọ̀, kò sì yẹ kí ìtumọ̀ sọ wọ́n di ọ̀rọ̀ kan tàbí yanjú ìbáṣepọ̀ wọn ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà parí pẹ̀lú àmì kọ́má nítorí pé ó ń bá ìṣe pàtàkì inú ẹsẹ 5 lọ.
