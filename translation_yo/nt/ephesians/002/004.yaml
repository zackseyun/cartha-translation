  to: Ṣùgbọ́n Ọlọ́run, ẹni tí ó lọ́rọ̀ nínú àánú, nítorí ìfẹ́ ńlá rẹ̀ tí ó fi fẹ́ wa,
  rationale: The revision restores the Greek image and participial description in πλούσιος ὢν ἐν ἐλέει while preserving the draft’s accurate causal relation, distinction between mercy and love, cognate repetition ‘ìfẹ́ … fẹ́,’ and verse-continuing comma.
