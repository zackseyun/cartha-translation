id: EPH.2.11
reference: Ephesians 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: yo
  text: Nítorí náà, ẹ rántí pé nígbà kan rí, ẹ̀yin[a], àwọn aláìṣe-Júù nípa ti ara[b], tí àwọn tí a ń pè ní “Ìkọlà,” ìkọlà tí a fi ọwọ́ ènìyàn ṣe ní ara[d], ń pè ní “Àìkọlà”[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin nígbà kan rí.” Gíríìkì tẹnumọ́ “ẹ̀yin.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ó tún ṣeé túmọ̀ sí “ẹ̀yin, àwọn orílẹ̀-èdè nípa ti ara.” Níhìn-ín, “àwọn orílẹ̀-èdè” túmọ̀ sí àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: c
    text: “Ìkọlà” àti “Àìkọlà” jẹ́ orúkọ ìdánimọ̀ ẹ̀yà àti ti májẹ̀mú níhìn-ín; wọn kì í ṣe àpèjúwe ẹ̀yà ara lásán.
    reason: cultural_note
  - marker: d
    text: Tàbí, “láti ọ̀dọ̀ ohun tí a ń pè ní ‘Ìkọlà,’ tí a fi ọwọ́ ènìyàn ṣe ní ara.” Ọ̀rọ̀ Pọ́ọ̀lù lè ní ìbáwí díẹ̀ sí ìkọlà òde ara lásán.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti so ìṣírí tuntun mọ́ àríyànjiyàn Pọ́ọ̀lù.
- source_word: μνημονεύετε
  choice: ẹ rántí
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ‘ẹ rántí’ ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: ποτὲ ὑμεῖς
  choice: nígbà kan rí, ẹ̀yin
  rationale: Ó pa ìtọ́kasí sí ipò wọn tẹ́lẹ̀ mọ́, ó sì tẹnumọ́ ‘ẹ̀yin’ gẹ́gẹ́ bí Gíríìkì ṣe rí.
- source_word: τὰ ἔθνη
  choice: àwọn aláìṣe-Júù
  rationale: Nínú ìyàtọ̀ tó wà láàárín Júù àti àwọn orílẹ̀-èdè, ọ̀rọ̀ náà túmọ̀ sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè lásán.
- source_word: ἐν σαρκί
  choice: nípa ti ara
  rationale: Níhìn-ín, σάρξ ń tọ́ka sí ipò ti ara àti ìdánimọ̀ ẹ̀yà, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀; ‘nípa ti ara’ mú ìtumọ̀ yẹn jáde lọ́nà àdánidá.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: ni ... ń pè ní “Àìkọlà”
  rationale: Ó pa ìṣe tí àwọn mìíràn fi orúkọ ìdánimọ̀ yìí pè wọ́n mọ́, àwọn àmì àyọlò sì fi hàn pé àmì-ẹ̀yà àti ti májẹ̀mú ni.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: àwọn tí a ń pè ní “Ìkọlà”
  rationale: Lílo ‘tí a ń pè ní’ pa àtúnṣe λεγομένης mọ́, kò sì mú ìbáwí Pọ́ọ̀lù le ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: ìkọlà ... tí ọwọ́ ènìyàn ṣe sí ara
  rationale: Ó fi hàn pé ìkọlà ti ara ni, tí ènìyàn fi ọwọ́ ṣe, ó sì mú ìbáṣepọ̀ χειροποιήτου pẹ̀lú περιτομῆς ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ σάρξ ní àyíká tí kì í ṣe ti ìwà búburú
  choice: nípa ti ara / sí ara
  alternative: nínú ẹran ara
  rationale: Àyíká náà ń sọ̀rọ̀ nípa àmì ti ara àti ìdánimọ̀ ẹ̀yà/májẹ̀mú, kì í ṣe ìwà ẹlẹ́ṣẹ̀. Ìtumọ̀ yìí pa ìtumọ̀ gidi mọ́ láì dá èrò ẹ̀kọ́ mìíràn sí i.
- issue: Agbára λεγομένης pẹ̀lú περιτομή
  choice: àwọn tí a ń pè ní “Ìkọlà”
  alternative: àwọn “Ìkọlà” tí a ń pè bẹ́ẹ̀
  rationale: Ó pa ìjìnnà ọ̀rọ̀ tí Pọ́ọ̀lù dá sí orúkọ ẹgbẹ́ náà mọ́, ṣùgbọ́n kò sọ ọ́ di ẹ̀gàn tàbí ọ̀rọ̀ tó lòdì sí àwọn Júù.
- issue: Ìkọlà àti àìkọlà gẹ́gẹ́ bí orúkọ ẹgbẹ́
  choice: Lo “Ìkọlà” àti “Àìkọlà” nínú àmì àyọlò
  alternative: àwọn onílà àti àwọn aláìkọlà
  rationale: Àwọn ọ̀rọ̀ Gíríìkì jẹ́ àwọn orúkọ àfojúrí tí a lò fún ẹgbẹ́ ènìyàn. Ìtumọ̀ yìí pa ìfararọ̀ wọn mọ́, àmì àyọlò sì fi hàn pé orúkọ ìdánimọ̀ ni wọ́n níhìn-ín.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A yan “àwọn aláìṣe-Júù” dípò “Kèfèrí” láti yẹra fún ìtumọ̀ ẹ̀gàn tí ọ̀rọ̀ náà lè ní lónìí. Gbólóhùn náà parí pẹ̀lú àmì gígùn nítorí ẹsẹ yìí ń bá a lọ sínú ẹsẹ 12.
