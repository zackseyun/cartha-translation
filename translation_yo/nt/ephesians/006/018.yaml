id: EPH.6.18
reference: Ephesians 6:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: yo
  text: Pẹ̀lú gbogbo àdúrà àti ẹ̀bẹ̀, ẹ máa gbàdúrà ní gbogbo ìgbà nínú Ẹ̀mí[a]; fún ète yìí gan-an, ẹ máa wà lójúfò pẹ̀lú gbogbo ìforítì àti ẹ̀bẹ̀ fún gbogbo àwọn ẹni mímọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ẹ̀mí.” A lè ka ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbogbogbò yìí, ṣùgbọ́n ó ṣeé ṣe jù ní àyíká ọ̀rọ̀ náà pé Ẹ̀mí Mímọ́ ni ó ń tọ́ka sí.
    reason: alternative_reading
  - marker: b
    text: “Àwọn ẹni mímọ́” níbí túmọ̀ sí gbogbo àwọn ènìyàn mímọ́ Ọlọ́run, ìyẹn gbogbo àwọn onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: Pẹ̀lú gbogbo àdúrà àti ẹ̀bẹ̀
  rationale: “Pẹ̀lú” fi ipa διά gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò hàn lọ́nà àdánidá; “àdúrà” jẹ́ ọ̀rọ̀ gbogbogbò, “ẹ̀bẹ̀” sì tọ́ka sí ìbéèrè pàtó.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: ẹ máa gbàdúrà ní gbogbo ìgbà
  rationale: Ìlànà “ẹ máa…” mú ìṣe tí ń bá a lọ nínú participle náà jáde, “ní gbogbo ìgbà” sì bo gbogbo àkókò tàbí àǹfààní.
- source_word: ἐν πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; àkọlé “Ẹ̀mí” mú èyí hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn mọ́.
- source_word: εἰς αὐτὸ
  choice: fún ète yìí gan-an
  rationale: Ó mú ìtumọ̀ ète àti ìtẹnumọ́ αὐτό jáde ní Yorùbá àdánidá.
- source_word: ἀγρυπνοῦντες
  choice: ẹ máa ṣọ́ra
  rationale: Ó túmọ̀ sí wíwà lójúfò àti ṣíṣọ́nà pẹ̀lú ìfiyèsí.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: pẹ̀lú gbogbo ìforítì, kí ẹ sì máa bẹ̀bẹ̀
  rationale: “Ìforítì” mú ìfaradà tí kò jáwọ́ hàn; gbólóhùn kejì jẹ́ kí καὶ δεήσει hàn gbangba, láìjẹ́ kí Yorùbá di líle tàbí àjèjì.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: fún gbogbo àwọn ẹni mímọ́
  rationale: “Àwọn ẹni mímọ́” jẹ́ àwọn ènìyàn Ọlọ́run tí a yà sí mímọ́, ìyẹn gbogbo àwọn onígbàgbọ́, kì í ṣe ẹgbẹ́ pàtàkì kan ṣoṣo.
theological_decisions:
- issue: Ohun tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ (“nínú Ẹ̀mí”)
  alternative: ẹ̀mí ènìyàn tàbí ìwà ẹ̀mí (“nínú ẹ̀mí”)
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀, pàápàá “idà Ẹ̀mí” ní ẹsẹ 17, àti ìlò Pọ́ọ̀lù ní gbogbogbò, ń ṣètìlẹ́yìn fún Ẹ̀mí Mímọ́; ṣùgbọ́n Gíríìkì kò ní article, nítorí náà àlàyé ìsàlẹ̀ pa àǹfààní ìtumọ̀ kejì mọ́.
- issue: Ìtumọ̀ ἅγιοι
  choice: gbogbo àwọn onígbàgbọ́ gẹ́gẹ́ bí “àwọn ẹni mímọ́”
  alternative: àwọn ẹni tí ilé ìjọsìn kan dá mọ̀ sí mímọ́ ní ìtumọ̀ tó wá lẹ́yìn
  rationale: Nínú ìlò Pọ́ọ̀lù, ọ̀rọ̀ náà ń tọ́ka sí gbogbo ìjọ ènìyàn Ọlọ́run tí a yà sí mímọ́, kì í ṣe kíláàsì kékeré kan.
- issue: Ìbáṣepọ̀ προσκαρτερήσει καὶ δεήσει
  choice: ṣọ́ra pẹ̀lú ìforítì, kí wọ́n sì máa bẹ̀bẹ̀
  alternative: pẹ̀lú gbogbo ìforítì nínú ẹ̀bẹ̀
  rationale: Àṣàyàn yìí fi καί àti àwọn èrò méjèèjì hàn ní kedere, bí ó tilẹ̀ jẹ́ pé a tún lè ka gbólóhùn náà gẹ́gẹ́ bí ìforítì nínú ẹ̀bẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. Àṣẹ ọ̀pọ̀ ènìyàn “ẹ máa…” ń bá ọ̀rọ̀ ìṣírí inú àyíká ẹsẹ náà mu; a fi àmì ohùn kún un níbi tí ó bá jẹ́ àdánidá.
