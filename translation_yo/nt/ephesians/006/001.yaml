  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: yo
  text: Ẹ̀yin ọmọ, ẹ máa ṣègbọràn sí àwọn òbí yín nínú Olúwa,[a] nítorí èyí ni ó tọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àwọn tí í ṣe ti Olúwa” / “ní ìṣọ̀kan pẹ̀lú Olúwa.” Gbólóhùn náà, “nínú Olúwa,” lè ṣàpèjúwe ààyè tàbí ọ̀nà ìgbọràn náà, ó sì lè tún fi hàn pé ìfaramọ́ sí Olúwa lè fi ààlà sí irú ìgbọràn bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Ẹ̀yin ọmọ
  rationale: Ọ̀rọ̀ yìí ń bá àwọn ọmọ inú agbo ilé sọ ní tààràtà. “Ẹ̀yin ọmọ” jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé àṣẹ náà ń tọ́ka sí wọn.
- source_word: ὑπακούετε
  choice: ẹ máa ṣègbọràn sí
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí gbígbọ́ tí ó yọrí sí ṣíṣe ohun tí a sọ. “Ẹ máa ṣègbọràn sí” tún mú ìṣe tí ń bá a lọ, tí àṣẹ ìsinsìnyí Gíríìkì lè ní, jáde.
- source_word: γονεῦσιν
  choice: àwọn òbí yín
  rationale: Ó ń tọ́ka sí baba àti ìyá lápapọ̀; “àwọn òbí yín” ni ọ̀rọ̀ Yorùbá tí ó péye, tí ó sì wọ́pọ̀.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ìtumọ̀ kúkúrú yìí pa àṣà ọ̀rọ̀ Paulu mọ́, ó sì jẹ́ kí àìdánilójú gidi wà nípa bóyá ó ń sọ nípa ìṣọ̀kan pẹ̀lú Olúwa, ipò tàbí ọ̀nà ìgbọràn, tàbí ààlà tí ìfaramọ́ Olúwa fi lé e.
- source_word: δίκαιον
  choice: ó tọ́
  rationale: Nínú àyíká ìwà rere yìí, “ó tọ́” sọ ohun tí ó yẹ ní ti ìwà, ní èdè Yorùbá òde òní tí ó ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n àti ìtumọ̀ gbólóhùn ἐν κυρίῳ
  choice: 'A so “nínú Olúwa” mọ́ àṣẹ náà: “ẹ máa ṣègbọràn sí àwọn òbí yín nínú Olúwa,” láì fi ìtumọ̀ kan ṣoṣo mú un.'
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí “ẹ̀yin ọmọ tí ẹ wà nínú Olúwa,” tàbí “ẹ ṣègbọràn bí ó ti yẹ nínú Olúwa.”
  rationale: Ìtò ọ̀rọ̀ Gíríìkì sábà máa ń so gbólóhùn náà mọ́ ọ̀rọ̀ àṣẹ, ṣùgbọ́n pàtó ìtumọ̀ rẹ̀ kò ṣe kedere pátápátá. Títọ́jú “nínú Olúwa” pa ìṣọ̀kan pẹ̀lú Olúwa, ọ̀nà tàbí ààyè ìgbọràn, àti ààlà tí ìfaramọ́ Olúwa lè fi lé ìgbọràn mọ́ gẹ́gẹ́ bí àwọn ohun tí ọ̀rọ̀ náà lè túmọ̀ sí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti kedere ni a lò. Àṣẹ “ẹ máa ṣègbọràn” jẹ́ àdánidá fún ọ̀pọ̀ ẹni, “Olúwa” sì pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ κύριος mọ́ láì ṣàlàyé rẹ̀ kọjá ohun tí Gíríìkì sọ.
