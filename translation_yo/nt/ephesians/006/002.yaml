  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: yo
  text: “Bọ̀wọ̀ fún bàbá rẹ àti ìyá rẹ”—èyí ni àṣẹ kìíní tí ó ní ìlérí—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “àṣẹ kìíní nínú ìlérí”; ìtumọ̀ rẹ̀ ni pé èyí ni àṣẹ kìíní tí a so ìlérí mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: Bọ̀wọ̀ fún
  rationale: Ọ̀rọ̀ àṣẹ yìí ń béèrè fífi ọlá hàn ní ìṣe, kì í ṣe ìmọ̀lára ọ̀wọ̀ nínú ọkàn nìkan. ‘Bọ̀wọ̀ fún’ jẹ́ ọ̀nà Yorùbá àdánidá fún pípa àṣẹ yìí mọ́.
- source_word: πατέρα σου καὶ τὴν μητέρα
  choice: baba rẹ àti ìyá rẹ
  rationale: Èyí túmọ̀ àwọn ọ̀rọ̀ ìbátan náà ní tààràtà, ó sì pa ìtẹ̀sí ìtọ́ka ẹni kejì ẹyọ (‘rẹ’) mọ́.
- source_word: ἥτις
  choice: èyí ni
  rationale: Ó tọ́ka padà sí àṣẹ tí a ṣẹ̀ṣẹ̀ sọ, ó sì mú àlàyé Pọ́ọ̀lù wọlé lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἐντολὴ
  choice: àṣẹ
  rationale: ‘Àṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún àṣẹ inú Òfin Mẹ́wàá láìfi ìtumọ̀ mìíràn kún un.
- source_word: πρώτη
  choice: kìíní
  rationale: Ọ̀rọ̀ náà jẹ́ nọ́ńbà ipò, nítorí náà ‘kìíní’ pa ìtumọ̀ ‘first’ mọ́ dípò yíyí i sí ‘èyí tó ṣe pàtàkì jù.’
- source_word: ἐν ἐπαγγελίᾳ
  choice: tí ó ní ìlérí pẹ̀lú rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé èdè Gíríìkì sọ ní tààràtà pé ‘nínú ìlérí,’ ọ̀rọ̀ Yorùbá yìí fi ìtumọ̀ àdánidá hàn pé ìlérí kan bá àṣẹ náà rìn, láìpa àṣàyàn gangan náà mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘àṣẹ kìíní’ pẹ̀lú bí a ṣe tò Òfin Mẹ́wàá àti ohun tí Pọ́ọ̀lù ń tẹnumọ́
  choice: àṣẹ kìíní tí ó ní ìlérí pẹ̀lú rẹ̀
  alternative: àṣẹ kìíní nínú ìlérí
  rationale: Ìtumọ̀ àkọ́kọ́ ń jẹ́ kí òǹkàwé lóye pé ìlérí tí a sọ jáde bá àṣẹ yìí rìn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìrísí gangan àti àìdánilójú díẹ̀ nínú èdè Gíríìkì mọ́. A kò fi ètò ìka Òfin Mẹ́wàá ti ẹ̀sìn kan tàbí ìtumọ̀ ‘èyí tó ga jù’ wọ ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Bọ̀wọ̀ fún’ gẹ́gẹ́ bí àṣẹ tó ń tọ́ka sí ìṣe, a sì lo àmì gígùn láti fi àlàyé àárín gbólóhùn hàn.
