id: EPH.6.21
reference: Ephesians 6:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: yo
  text: Kí ẹ̀yin náà sì lè mọ àwọn ohun tí ó kàn mí àti ohun tí mo ń ṣe, Tíkíkù, arákùnrin olùfẹ́ àti ìránṣẹ́ olóòótọ́ nínú Olúwa, yóò jẹ́ kí ẹ mọ ohun gbogbo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ipò mi”; ọ̀rọ̀ Gíríìkì náà ní tààrà, “àwọn ohun tí ó kàn mí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òjíṣẹ́ olóòótọ́”; ọ̀rọ̀ Gíríìkì διάκονος tún lè túmọ̀ sí “ìránṣẹ́” tàbí, ní àwọn àyíká kan, “díákónì.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Ṣùgbọ́n kí
  rationale: ἵνα fi ète hàn, δέ sì ní agbára àsopọ̀ pẹ̀lẹ́; ‘Ṣùgbọ́n kí’ pa méjèèjì mọ́ láì mú ìyàtọ̀ náà le ju bó ṣe yẹ lọ.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: ẹ̀yin náà lè mọ
  rationale: ‘ẹ̀yin náà’ fi ìtẹnumọ́ καὶ ὑμεῖς hàn, ‘lè mọ’ sì sọ ète gbolohun náà ní Yorùbá àdánidá.
- source_word: τὰ κατ’ ἐμέ
  choice: àwọn ohun tí ó jẹ mọ́ mi
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì pa ìtumọ̀ tó lè tọ́ka sí ipò tàbí àwọn ọ̀ràn Pọ́ọ̀lù mọ́.
- source_word: τί πράσσω
  choice: ohun tí mo ń ṣe
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti àdánidá fún πράσσω nínú àyíká yìí.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: yóò sọ ohun gbogbo di mí̀mọ̀ fún yín
  rationale: Ó pa èrò ‘mú kí ẹ mọ̀’ mọ́, ó sì dára ní Yorùbá.
- source_word: Τυχικὸς
  choice: Tíkíkù
  rationale: Orúkọ náà ni a ṣe àkọsílẹ̀ rẹ̀ ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: ἀγαπητὸς ἀδελφὸς
  choice: arákùnrin olùfẹ́
  rationale: Ó pa èdè ìdílé Kristẹni àti ìfẹ́ inú ἀγαπητός mọ́; ẹni tí a ń sọ̀rọ̀ rẹ̀ jẹ́ ọkùnrin.
- source_word: πιστὸς διάκονος
  choice: ìránṣẹ́ olóòótọ́
  rationale: ‘Ìránṣẹ́’ jẹ́ ààyè tó gbooro fún διάκονος, kò sì fi ipò ìjọ kan pàtó lé ọ̀rọ̀ náà lórí.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa àṣà ọ̀rọ̀ Pọ́ọ̀lù àti oyè κύριος mọ́, ó sì lè tọ́ka sí ìbáṣepọ̀ tàbí ààyè iṣẹ́ rẹ̀ nínú Olúwa.
theological_decisions:
- issue: Ìtumọ̀ διάκονος nípa Tíkíkù
  choice: ìránṣẹ́
  alternative: òjíṣẹ́; díákónì
  rationale: Àyíká náà ń ṣàpèjúwe alábàáṣiṣẹ́ olóòótọ́, kò sì fi hàn kedere pé ó ń dárúkọ ipò díákónì nínú ìjọ. ‘Ìránṣẹ́’ pa ìtumọ̀ iṣẹ́ mọ́ láì gbe ètò ìjọ kan wọlé.
- issue: Ìtumọ̀ ἀδελφός
  choice: arákùnrin
  alternative: ọmọ ìyá
  rationale: Tíkíkù jẹ́ ọkùnrin kan ṣoṣo, nítorí náà ‘arákùnrin’ péye, ó sì bójú mu àpèjúwe ìdílé àwọn onígbàgbọ́.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ ni oyè tó bójú mu fún Jésù nínú gbólóhùn Pọ́ọ̀lù yìí, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A yan ‘àwọn ohun tí ó jẹ mọ́ mi’ láti pa àìdánilójú ojúlówó τὰ κατ’ ἐμέ mọ́.
