id: EPH.6.11
reference: Ephesians 6:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: yo
  text: Ẹ wọ gbogbo ìhámọ́ra[a] Ọlọ́run, kí ẹ lè dúró lòdì sí àwọn ète àrékérekè[b] Èṣù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “odindi ìhámọ́ra Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo ohun èlò ogun tí ọmọ ogun kan nílò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ọgbọ́n ẹ̀tàn” tàbí “àwọn ọ̀nà àrékérekè Èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Ẹ wọ
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn láti gbé ohun ìjà wọ̀. “Ẹ wọ” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa agbára àṣẹ náà mọ́.
- source_word: πανοπλίαν
  choice: gbogbo ìhámọ́ra
  rationale: Ó ń tọ́ka sí gbogbo ohun èlò ogun tí ọmọ ogun tó di ìhámọ́ra múra sílẹ̀, kì í ṣe apá kan ṣoṣo. “Gbogbo ìhámọ́ra” fi ìpéye ohun èlò náà hàn ní èdè tó yé ni.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Gbólóhùn “ìhámọ́ra Ọlọ́run” pa ìbáṣepọ̀ tí ẹ̀yà ọlọ́rọ̀ Gíríìkì náà fi sílẹ̀ mọ́, láì fi dandan sọ bóyá ohun tí Ọlọ́run ní ni tàbí ohun tí ó pèsè.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: kí ẹ lè dúró
  rationale: 'Èyí sọ ète àṣẹ náà ní Yorùbá àdánidá: kí àwọn olùgbọ́ lè dúró ní ojú ìkọlù.'
- source_word: στῆναι
  choice: dúró
  rationale: “Dúró” tẹ̀ lé ìtumọ̀ pàtàkì ọ̀rọ̀ náà, nígbà tí àwòrán ogun àti “lòdì sí” ti mú ìtumọ̀ dídúró ṣinṣin wá láìsí àfikún.
- source_word: μεθοδείας
  choice: àwọn ète àrékérekè
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ète tàbí ọ̀nà tí a fi ọgbọ́n ẹ̀tàn gbé kalẹ̀. “Àwọn ète àrékérekè” jẹ́ kedere, ó sì pa ìtumọ̀ ọgbọ́n búburú àti ẹ̀tàn mọ́.
- source_word: τοῦ διαβόλου
  choice: Èṣù
  rationale: Ní àyíká ogun ẹ̀mí yìí, διάβολος jẹ́ orúkọ ìdánimọ̀ fún ọ̀tá búburú náà. “Èṣù” ni orúkọ Yorùbá tí ó wọ́pọ̀ nínú ìtumọ̀ Bíbélì fún ẹni yìí, kì í ṣe ẹni tó ń sọ̀rọ̀ ẹ̀gàn lásán.
theological_decisions:
- issue: Ẹni tí διάβολος ń tọ́ka sí àti bí a ṣe túmọ̀ ọ́
  choice: Èṣù gẹ́gẹ́ bí ọ̀tá búburú tó jẹ́ ẹni kan
  alternative: afìbínúni tàbí asọ̀rọ̀-èké
  rationale: Àyíká ogun ẹ̀mí ní Éfésù 6 fi hàn pé ọ̀tá aláìrí tó jẹ́ ẹni kan ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe ẹlẹ́gàn ènìyàn kan lásán. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìsìn mìíràn kún ohun tí ẹsẹ yìí sọ.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, pẹ̀lú ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Gbólóhùn náà pa àwòrán ogun, agbára àṣẹ, àti ìfọ̀rọ̀wérọ̀ inú “ìhámọ́ra Ọlọ́run” mọ́.
