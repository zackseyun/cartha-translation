id: EPH.6.17
reference: Ephesians 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: yo
  text: Ẹ sì gba àṣíborí ìgbàlà[a], àti idà ti Ẹ̀mí, èyí tí í ṣe ọ̀rọ̀ Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ mú àṣíborí ìgbàlà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀rọ̀ tí Ọlọ́run sọ”; ọ̀rọ̀ Gíríìkì rhēma lè tẹnu mọ́ ọ̀rọ̀ tí a sọ tàbí ìhìn tí a kéde.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: ẹ gba
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn, ó sì lè túmọ̀ sí ‘gba’ tàbí ‘mú.’ ‘Ẹ gba’ fi hàn pé wọ́n ń gba ohun tí a pèsè fún wọn, ó sì bá àwòrán ìhámọ́ra mu.
- source_word: περικεφαλαίαν
  choice: àṣíborí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun ìdábòbò tí jagunjagun fi ń bo orí.
- source_word: τοῦ σωτηρίου
  choice: ìgbàlà
  rationale: ‘Ìgbàlà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè gbé ìtumọ̀ ìdáǹdè àti ìgbàlà nínú ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: μάχαιραν
  choice: idà
  rationale: ‘Idà’ jẹ́ ìtumọ̀ adayeba fún ohun ìjà olójú mímú yìí láì fi irú tàbí gígùn rẹ̀ kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: τοῦ πνεύματος
  choice: ti Ẹ̀mí
  rationale: Nínú àyíká yìí, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; lílo lẹ́tà ńlá fún ‘Ẹ̀mí’ mú ìtọ́kasí náà ṣe kedere láì ṣàlàyé ìbáṣepọ̀ genitive náà ju bí ọ̀rọ̀ ṣe sọ lọ.
- source_word: ὅ ἐστιν
  choice: èyí tí í ṣe
  rationale: Gbólóhùn yìí dá àlàyé tó tẹ̀ lé mọ́ ‘idà’ gẹ́gẹ́ bí Gíríìkì ṣe ṣe, ó sì jẹ́ Yorùbá adayeba.
- source_word: ῥῆμα θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: ‘Ọ̀rọ̀ Ọlọ́run’ jẹ́ ìtumọ̀ tó ṣe kedere tí ó sì mọ́gbọ́n dání; àlàyé ìsàlẹ̀ ojú ewé pa àǹfààní ìtumọ̀ ‘ọ̀rọ̀ tí Ọlọ́run sọ’ mọ́.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí’ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí agbára ẹ̀mí lápapọ̀
  rationale: Àyíká ìhámọ́ra Ọlọ́run àti ìdánimọ̀ idà náà pẹ̀lú ọ̀rọ̀ Ọlọ́run mú kí ìtọ́kasí sí Ẹ̀mí Mímọ́ lágbára jù, ṣùgbọ́n a kò fi ‘Mímọ́’ kún ọ̀rọ̀ pàtàkì nítorí kò sí nínú Gíríìkì.
- issue: Ìbáṣepọ̀ nínú ‘idà ti Ẹ̀mí’
  choice: pa ọ̀nà ìtumọ̀ sílẹ̀ gẹ́gẹ́ bí ‘ti Ẹ̀mí’
  alternative: ‘idà tí Ẹ̀mí ń fúnni’ tàbí ‘idà tí ó jẹ́ ti Ẹ̀mí’
  rationale: Genitive Gíríìkì lè tọ́ka sí ohun tí Ẹ̀mí ń pèsè tàbí ohun tí í ṣe ti Ẹ̀mí. Ìtumọ̀ náà kò pinnu èyí ní ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí àṣẹ sí ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó yẹ.
