id: EPH.6.23
reference: Ephesians 6:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: yo
  text: Àlàáfíà fún àwọn arákùnrin[a], àti ìfẹ́ pẹ̀lú ìgbàgbọ́[b], láti ọ̀dọ̀ Ọlọ́run Bàbá àti Olúwa Jésù Mèsáyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin.” Gíríìkì sọ pé “àwọn arákùnrin,” ìrísí akọ púpọ̀ tí ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìfẹ́ pẹ̀lú ìṣòtítọ́” tàbí “ìfẹ́ pẹ̀lú ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì náà lè ní àwọn ìtumọ̀ wọ̀nyí, bí ó tilẹ̀ jẹ́ pé “ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ níbí.
    reason: lexical_alternative
  - marker: c
    text: 'Gíríìkì: “Jésù Kristi.” Níhìn-ín, “Mèsáyà” túmọ̀ oyè Χριστός, ìyẹn “Ẹni tí a fòróró yàn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Àlàáfíà
  rationale: Ó pa àdúrà ìbùkún inú ọ̀rọ̀-orúkọ Gíríìkì mọ́ láìfi ọ̀rọ̀-ìṣe tí kò sí nínú orísun kún un.
- source_word: τοῖς ἀδελφοῖς
  choice: fún àwọn arákùnrin
  rationale: “Àwọn arákùnrin” bá ìrísí akọ púpọ̀ Gíríìkì mu; àlàyé ìsàlẹ̀ fi hàn pé ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún ἀγάπη, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú bí Pọ́ọ̀lù ṣe máa ń lo ọ̀rọ̀ náà.
- source_word: μετὰ πίστεως
  choice: pẹ̀lú ìgbàgbọ́
  rationale: “Pẹ̀lú” ṣàfihàn ìbákẹ́gbẹ́ tí μετά pẹ̀lú ọ̀rọ̀ inú genitive ń sọ; “ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ fún πίστις níbí, bí ó tilẹ̀ jẹ́ pé àwọn ìtumọ̀ míì ṣeé ṣe.
- source_word: ἀπὸ
  choice: láti ọ̀dọ̀
  rationale: Ó ṣàfihàn orísun ìbùkún náà lọ́nà àdánidá ní Yorùbá.
- source_word: θεοῦ πατρὸς
  choice: Ọlọ́run Bàbá
  rationale: Ó tẹ̀lé Gíríìkì láìfi “wa” kún un, nítorí ἡμῶν kò sí nínú orísun.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún κύριος gẹ́gẹ́ bí oyè ní àyíká yìí.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Jésù” ni orúkọ, “Mèsáyà” sì mú agbára oyè Χριστός hàn dípò kí a ka á sí apá orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú ìbùkún ìparí
  choice: Mèsáyà
  alternative: Kristi; Ẹni tí a fòróró yàn
  rationale: Χριστός ní agbára oyè Mèsáyà níbí. “Mèsáyà” jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá mọ̀, ó sì pa ìtumọ̀ oyè náà mọ́; àlàyé ìsàlẹ̀ ṣàlàyé rẹ̀.
- issue: Ìtọ́kasí akọ nínú ἀδελφοῖς
  choice: àwọn arákùnrin
  alternative: àwọn ará; àwọn arákùnrin àti arábìnrin
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìrísí akọ púpọ̀ orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí ìtọ́kasí sí gbogbo ìjọ hàn kedere.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ déédé jù lọ ní àyíká yìí, ṣùgbọ́n a kò pa àwọn ìtumọ̀ míì tí ọ̀rọ̀ Gíríìkì lè ní rẹ́.
translation_notes:
  register: Yorùbá àpéjọ tí ó níyì, tó ṣe kedere, tí ó sì bá ọ̀nà ìbùkún ìparí lẹ́tà mu. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa gbolohun náà mọ́ ní ṣókí bí orísun Gíríìkì.
