    rationale: Nínú ìbáṣepọ̀ pẹ̀lú παιδεία, ‘ìtọ́nisọ́nà’ ń fi ìtumọ̀ ìtọ́ni/admonition hàn ní gbangba, láìsọ ọ́ di ìhalẹ̀ tàbí ìkìlọ̀ nìkan.
