id: EPH.6.4
reference: Ephesians 6:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: yo
  text: Ẹ̀yin baba náà, ẹ má ṣe mú àwọn ọmọ yín bínú,[a] ṣùgbọ́n ẹ tọ́ wọn dàgbà nínú ìkọ́nilẹ́kọ̀ọ́ àti ìtọ́nisọ́nà Olúwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe mú àwọn ọmọ yín bínú gidigidi.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí rírú ìbínú tàbí mímú kí ẹnì kan kún fún ìbínú.
    reason: lexical_alternative
  - marker: b
    text: “Olúwa” lè túmọ̀ sí pé ìkọ́nilẹ́kọ̀ọ́ àti ìtọ́nisọ́nà náà ti ọ̀dọ̀ Olúwa wá, jẹ́ ti Olúwa, jẹ́ nípa Olúwa, tàbí pé Olúwa ni ó ń darí wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: àwọn baba
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, ó sì ń bá àwọn baba sọ̀rọ̀ ní pàtó; a kò fẹ̀ ọ́ sí ‘àwọn òbí.’
- source_word: παροργίζετε
  choice: mú ... bínú
  rationale: 'Èyí fi ipa ìṣokùnfà ọ̀rọ̀-ìṣe náà hàn ní Yorùbá àdánidá: láti ru ìbínú tàbí mú kí ẹnì kan bínú.'
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ní gbogbo ọmọ inú ìdílé nínú láìka akọ tàbí abo.
- source_word: ἐκτρέφετε
  choice: tọ́ wọn dàgbà
  rationale: Nínú ọ̀rọ̀ yìí, ọ̀rọ̀-ìṣe náà túmọ̀ sí títọ́ ọmọ dàgbà, kì í ṣe fífún wọn ní oúnjẹ nìkan.
- source_word: παιδείᾳ
  choice: ìkọ́nilẹ́kọ̀ọ́
  rationale: Ọ̀rọ̀ yìí ní ìdánilẹ́kọ̀ọ́ tó ń mọ ènìyàn, ìtọ́nisọ́nà, àti àtúnṣe nínú; ‘ìkọ́nilẹ́kọ̀ọ́’ mú ipa ìmú-dàgbà náà hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: νουθεσίᾳ
  choice: ìkìlọ̀
  rationale: Ó ń tọ́ka sí ọ̀rọ̀ ìtọ́nisọ́nà tàbí àtúnṣe tí a fi ń ké sí ọkàn; ‘ìkìlọ̀’ yà á sọ́tọ̀ kúrò nínú παιδεία láìsọ ọ́ di ìhalẹ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: Àpólà náà ni a pa mọ́ ní ọ̀nà tó ṣókí, kí ìbáṣepọ̀ Olúwa pẹ̀lú ìkọ́nilẹ́kọ̀ọ́ àti ìkìlọ̀ má bàa di ìtumọ̀ kan ṣoṣo.
theological_decisions:
- issue: Ìwọ̀n ẹni tí πατέρες ń bá sọ̀rọ̀
  choice: A túmọ̀ rẹ̀ sí ‘àwọn baba,’ kì í ṣe ‘àwọn òbí.’
  alternative: àwọn òbí
  rationale: Gíríìkì náà darúkọ àwọn baba ní pàtó. Bó tilẹ̀ jẹ́ pé ìlànà náà lè kan àwọn òbí lápapọ̀, ìtumọ̀ kò gbọ́dọ̀ fẹ̀ ọrọ̀ orísun sí i.
- issue: Agbára κυρίου nínú ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: A lo ‘ìkọ́nilẹ́kọ̀ọ́ àti ìkìlọ̀ Olúwa,’ tó pa ìtumọ̀ ìbátan náà sílẹ̀ ní gbòòrò.
  alternative: ìkọ́nilẹ́kọ̀ọ́ àti ìkìlọ̀ tí ó ti ọ̀dọ̀ Olúwa wá / tí ó jẹ́ nípa Olúwa / gẹ́gẹ́ bí Olúwa ti fẹ́
  rationale: Ọ̀rọ̀ oníjẹ́nítífù náà lè tọ́ka sí orísun, ohun-ìní, ìwà, tàbí ìdarí. A kò yan ọ̀kan lára wọn ní pàtó, kí a má bàa yanjú àìdánilójú tí Gíríìkì fi sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Ìforúkọ ‘Ẹ̀yin baba’ àti àwọn ọ̀rọ̀-ìṣe ‘ẹ’ fi àṣẹ ọ̀pọ̀ hàn ní ọ̀nà ọlọ́wọ̀. ‘Pẹ̀lú’ so ẹsẹ̀ náà mọ́ àṣẹ tó ṣáájú, gẹ́gẹ́ bí Καί ṣe ń ṣiṣẹ́ ní àyíká ọ̀rọ̀ náà.
