  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: yo
  text: kí ó lè dára fún ọ, kí o sì lè wà láàyè fún ìgbà pípẹ́ lórí ilẹ̀ ayé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ilẹ̀ náà,” gẹ́gẹ́ bí ìróhìn ọ̀rọ̀ àṣẹ karùn-ún ní Ẹ́kísódù 20:12 àti Diutarónómì 5:16.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó ṣe àfihàn ète tàbí àbájáde, ó sì bá ìlérí tí a so mọ́ àṣẹ inú ẹsẹ tó ṣáájú mu.
- source_word: εὖ σοι γένηται
  choice: kí ó lè dára fún ọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí nǹkan rí dáadáa fún ẹni náà, láì sọ ìtumọ̀ ọ̀rọ̀ náà ju bí Gíríìkì ti sọ ọ́ lọ.
- source_word: καὶ
  choice: kí o sì
  rationale: Ó so àwọn àbájáde méjèèjì pọ̀, nígbà tí àtúnṣe 'kí' jẹ́ kí gbólóhùn Yorùbá ṣe kedere.
- source_word: ἔσῃ μακροχρόνιος
  choice: kí o sì lè pé ní ayé
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí jíjẹ́ ẹni tí ó ní ẹ̀mí gígùn; 'pé ní ayé' jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí kò sì fi àfikún ẹ̀kọ́ kankan sí i.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì gẹ́gẹ́ bí a ti kọ ọ́, ó sì jẹ́ kí ìtumọ̀ gbòòrò rẹ̀ hàn, dípò fífi 'ilẹ̀ náà' sínú rẹ̀ láti inú àyíká Májẹ̀mú Láéláé.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἐπὶ τῆς γῆς ní ìbámu pẹ̀lú ìlérí inú òfin karùn-ún
  choice: lórí ilẹ̀ ayé
  alternative: ní ilẹ̀ náà
  rationale: Ọ̀rọ̀ Gíríìkì nínú Éfésù kò ní àfikún tó sọ ní pàtó pé ilẹ̀ májẹ̀mú ni. Nítorí náà, a pa gbólóhùn rẹ̀ mọ́ ní ìtumọ̀ gbòòrò, ṣùgbọ́n a fi ìtumọ̀ mìíràn tó ń ṣe ìrántí Ẹ́kísódù 20:12 àti Diutarónómì 5:16 sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́gbọ́n dání, tó ní iyì, tí àwọn òǹkàwé gbogbo lè lóye; a lo àmì ohùn ní kíkún níbi tó yẹ.
