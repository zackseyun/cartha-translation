  verdict: revise
  source_fidelity: Ìpín àkọ́kọ́, “kí ó lè dára fún ọ,” ń gbé εὖ σοι γένηται kalẹ̀ dáadáa. Ṣùgbọ́n “pé ní ayé lórí ilẹ̀ ayé” tún “ayé” sọ lẹ́ẹ̀mejì ní ọ̀nà tí kò rọrùn, tí ó sì lè mú kí gbolohun náà dà bí ẹni pé ó ń sọ ibi méjì. “Wà láàyè fún ìgbà pípẹ́ lórí ilẹ̀ ayé” ń ṣàfihàn ἔσῃ μακροχρόνιος ἐπὶ τῆς γῆς ní kedere, láì fi ìtumọ̀ ilẹ̀ májẹ̀mú kún un.
  naturalness: Àtúnṣe náà jẹ́ Yorùbá ìgbàlódé tó rọrùn, tó ní ìwọ̀ntúnwọ̀nsì, tó sì yẹ fún ìforígbárí Bíbélì. Ó yẹra fún ìtúnlò “ayé” nínú gbolohun kan náà.
  terminology: “Ilẹ̀ ayé” bá ἐπὶ τῆς γῆς mu. Nínú àlàyé ìsàlẹ̀, “àṣẹ karùn-ún” dájú ju “òfin karùn-ún” lọ fún “fifth commandment.” Àlàyé náà pa ìṣeeṣe “ní ilẹ̀ náà” mọ́ gẹ́gẹ́ bí ìróhìn àṣẹ karùn-ún, láì sọ pé èyí ni ìtumọ̀ pàtó gbolohun Gíríìkì.
