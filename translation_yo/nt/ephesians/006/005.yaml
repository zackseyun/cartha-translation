id: EPH.6.5
reference: Ephesians 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: yo
  text: Ẹ̀yin ẹrú, ẹ máa ṣègbọ́ràn sí àwọn olúwa yín nípa ti ara[a], pẹ̀lú ìbẹ̀rù àti ìwárìrì, pẹ̀lú ìwà òtítọ́ nínú ọkàn yín, gẹ́gẹ́ bí ẹ ṣe ń ṣègbọràn sí Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, àwọn olúwa ní ti ayé tàbí ní ti ènìyàn nìkan.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “Kristi”; “Mèsáyà” ni a lò níbí nítorí ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: ẹrú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí ó wà lábẹ́ ìní àti àṣẹ olúwa ní ètò ẹrú; “ẹrú” kò fi òtítọ́ ipò àwùjọ náà pamọ́ bí “ìránṣẹ́” ṣe lè ṣe.
- source_word: ὑπακούετε
  choice: ẹ máa ṣègbọ́ràn sí
  rationale: Àṣẹ ìsinsìnyí náà ń béèrè ìgbọ́ràn tí ń bá a lọ; “ẹ máa ṣègbọ́ràn sí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: Ó dá àṣẹ àwọn olúwa ènìyàn, ti ayé yìí, yà sílẹ̀ kúrò nínú ìbáṣepọ̀ pẹ̀lú Mèsáyà, láì tú “ara” sí ìwà ẹ̀ṣẹ̀.
- source_word: κυρίοις
  choice: àwọn olúwa yín
  rationale: Nínú ètò ilé tí ẹsẹ̀ yìí ń sọ̀rọ̀ nípa rẹ̀, ọ̀rọ̀ náà túmọ̀ sí àwọn tí wọ́n ní àṣẹ lórí àwọn ẹrú; “olúwa” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ ní àyíká yìí.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: pẹ̀lú ìbẹ̀rù àti ìwárìrì
  rationale: Ìtumọ̀ yìí pa àkójọpọ̀ ọ̀rọ̀ Pọ́ọ̀lù àti agbára ìsọfúnni rẹ̀ mọ́ láì dín “φόβος” kù sí ọ̀wọ̀ nìkan.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: pẹ̀lú òtítọ́ inú ọkàn yín
  rationale: ἁπλότης níbí ń fi òtítọ́ inú àti ọkàn tí kò pín sí méjì hàn; gbólóhùn Yorùbá yìí ṣe kedere sí òǹkàwé òde òní.
- source_word: ὡς τῷ Χριστῷ
  choice: bí ẹ ti ń ṣe sí Mèsáyà
  rationale: Ó pa agbára ìfiwéra ὡς mọ́, láì sọ pé àwọn olúwa ènìyàn àti Mèsáyà jẹ́ ọ̀kan; “Mèsáyà” sì tú Χριστός gẹ́gẹ́ bí oyè.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” mú ìtumọ̀ oyè náà jáde dípò kí a kàn gba àṣà ìtúmọ̀ àtijọ́.
- issue: Ìtumọ̀ δοῦλοι nínú àyíká ẹrú
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àyíká náà ń sọ ní tààrà sí àwọn tó wà lábẹ́ àwọn olúwa nínú ètò ìní; “ẹrú” dá òtítọ́ ìdè àti àṣẹ tó wà nínú ọ̀rọ̀ Gíríìkì dúró.
- issue: Ìbáṣepọ̀ “bí … sí Mèsáyà”
  choice: ìfiwéra ìgbọ́ràn
  alternative: kíka olúwa ènìyàn sí Mèsáyà fúnra rẹ̀
  rationale: ὡς ń ṣe ìfiwéra bí wọ́n ṣe gbọ́dọ̀ ṣe ìgbọ́ràn, kò sì sọ pé olúwa ti ara jẹ́ Mèsáyà tàbí pé àṣẹ wọn kò ní ààlà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. Àṣẹ púpọ̀ “ẹ máa ṣègbọ́ràn” fi ìṣe tí ń bá a lọ hàn. A pa “nípa ti ara” mọ́ nítorí ìyàtọ̀ tó ṣe pàtàkì nínú orísun, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
