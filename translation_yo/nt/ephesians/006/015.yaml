  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: yo
  text: Ẹ sì ti fi bàtà ìmúrasílẹ̀ ìhìn rere àlàáfíà wọ ẹsẹ̀ yín,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìmúrasílẹ̀.” Ó ṣeé ṣe kó túmọ̀ sí “ìmúrasílẹ̀ láti kéde ìhìn rere àlàáfíà,” tàbí “ìdúró ṣinṣin tí ìhìn rere àlàáfíà ń fúnni.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: fi … wọ ẹsẹ̀ yín bí bàtà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ohun ìrìn ẹsẹ̀ wọ̀ tàbí dídè é sábẹ́ ẹsẹ̀. Àṣàyàn yìí pa àwòrán bàtà inú ìhámọ́ra mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τοὺς πόδας
  choice: ẹsẹ̀ yín
  rationale: Ohun tí ọ̀rọ̀ Gíríìkì tọ́ka sí ní tààrà ni ẹsẹ̀, kì í ṣe bàtà; a pa àwòrán ara mọ́.
- source_word: ἐν
  choice: pẹ̀lú / fi … wọ
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, ἐν ń fi ohun èlò tàbí ohun tí a fi múra ẹni hàn. Ìṣètò ‘fi … wọ’ mú ìtumọ̀ yẹn jáde ní Yorùbá tó rọrùn.
- source_word: ἑτοιμασίᾳ
  choice: ìmúrasílẹ̀
  rationale: Ìmúrasílẹ̀ ni ìtumọ̀ tó ṣe tààrà jù lọ, láìfi kún un pé ó jẹ́ ìmúrasílẹ̀ láti kéde tàbí ìdúró ṣinṣin.
- source_word: εὐαγγελίου
  choice: ìhìn rere
  rationale: ‘Ìhìn rere’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún εὐαγγέλιον, ó sì yẹ fún àwọn òǹkàwé òde òní.
- source_word: εἰρήνης
  choice: àlàáfíà
  rationale: ‘Àlàáfíà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún εἰρήνη; ó ń ṣàpèjúwe ìhìn rere náà gẹ́gẹ́ bí èyí tó ní í ṣe pẹ̀lú àlàáfíà.
theological_decisions:
- issue: Ìtumọ̀ ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: ìmúrasílẹ̀ tí ìhìn rere àlàáfíà ń fúnni
  alternative: ìmúrasílẹ̀ láti kéde ìhìn rere àlàáfíà; tàbí ìdúró ṣinṣin tí ìhìn rere àlàáfíà ń fúnni
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì lè gba àwọn ìtumọ̀ wọ̀nyí. Ọ̀rọ̀ inú ẹsẹ àti àlàyé ìsàlẹ̀ pa àìdánilójú tó wà nínú orísun mọ́, láìfi ìkéde tàbí ìdúró ṣinṣin kan án gẹ́gẹ́ bí ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. Fífí ‘bí bàtà’ kún un mú àwòrán ohun ìrìn ẹsẹ̀ inú ọ̀rọ̀-ìṣe Gíríìkì hàn gbangba.
