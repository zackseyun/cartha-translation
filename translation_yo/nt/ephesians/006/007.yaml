  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: yo
  text: Ẹ máa fi inú rere ṣe iṣẹ́ ìránṣẹ́, ní ti pé fún Olúwa ni ẹ ń ṣe é, kì í ṣe fún àwọn ènìyàn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “àwọn ènìyàn”; ìyàtọ̀ náà wà láàárín ẹ̀dá ènìyàn àti Olúwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: pẹ̀lú inú rere / fi inú rere
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí a ṣe ń ṣe iṣẹ́ náà àti irú èrò inú tí ó bá a rìn. “Fi inú rere” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà ń ṣiṣẹ́ pẹ̀lú ìfẹ́ rere àti ọkàn tí ó múra tán.
- source_word: δουλεύοντες
  choice: ṣe iṣẹ́ ìránṣẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ṣíṣe iṣẹ́ gẹ́gẹ́ bí ẹrú tàbí ìránṣẹ́. Àyíká ẹsẹ̀ ṣáájú ti sọ ipò àwọn tí a ń bá sọ, nítorí náà “ṣe iṣẹ́ ìránṣẹ́” pa èrò iṣẹ́ àti ipò ìránṣẹ́ mọ́ láì mú gbolohun di líle.
- source_word: ὡς
  choice: bí ẹni pé
  rationale: 'Ó fi irú ojú tí wọn gbọdọ̀ fi wo iṣẹ́ wọn hàn: kí wọn ṣe é gẹ́gẹ́ bí iṣẹ́ tí wọ́n ń ṣe fún Olúwa.'
- source_word: τῷ κυρίῳ
  choice: fún Olúwa
  rationale: “Olúwa” pa orúkọ oyè Kristi mọ́, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ àwọn ọ̀gá ayé inú àyíká ọ̀rọ̀ náà.
- source_word: ἀνθρώποις
  choice: fún àwọn ènìyàn
  rationale: “Àwọn ènìyàn” jẹ́ ìtumọ̀ Yorùbá tó pé fún ọ̀pọ̀ ἄνθρωποι, ó sì pa ìyàtọ̀ láàárín ẹ̀dá ènìyàn àti Olúwa mọ́ láì fi akọ tàbí abo tí ọ̀rọ̀ náà kò tẹnumọ́ sí i.
theological_decisions:
- issue: Ìtumọ̀ κύριος ní ìyàtọ̀ sí àwọn ọ̀gá ènìyàn
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa oyè tó tọ́ka sí Kristi mọ́, kò sì da a pọ̀ mọ́ àwọn ọ̀gá ayé tí àyíká ọ̀rọ̀ náà ń sọ̀rọ̀ nípa wọn.
- issue: Bí a ṣe gbọdọ̀ fi agbára ìtumọ̀ ẹrú inú δουλεύοντες hàn
  choice: ṣe iṣẹ́ ìránṣẹ́
  alternative: sìn bí ẹrú
  rationale: Àyíká ti sọ ní kedere pé àwọn ẹrú ni a ń bá sọ. Yíyan “ṣe iṣẹ́ ìránṣẹ́” jẹ́ èdè Yorùbá tó ṣeé kà, ó sì ṣì pa ìtumọ̀ iṣẹ́ abẹ́ àṣẹ mọ́ láì fi ọ̀rọ̀ àfikún tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn. “Ẹ máa” mú ìtọ́nisọ́nà inú àyíká gbólóhùn náà hàn; “fi inú rere” sì jẹ́ àdánidá ju àdàkọ ọ̀rọ̀-sí-ọ̀rọ̀ lọ.
