id: EPH.6.12
reference: Ephesians 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: yo
  text: Nítorí pé ìjàkadì wa kì í ṣe sí ẹran ara àti ẹ̀jẹ̀[a], ṣùgbọ́n sí àwọn alákòóso, sí àwọn aláṣẹ, sí àwọn olùṣàkóso ayé ti òkùnkùn yìí[b], àti sí àwọn agbára ẹ̀mí ibi ní àwọn agbègbè ọ̀run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí pé gídígbò wa kì í ṣe sí ẹran ara àti ẹ̀jẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sí àwọn olùṣàkóso ayé ti òkùnkùn ìsinsìnyí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní àwọn ibi ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: ìjàkadì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí gídígbò tàbí ìjà tí àwọn méjì ń bá ara wọn jà ní tòsí. “Ìjàkadì” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ ìsapá ìjà mọ́ láì fi dandan sọ pé gídígbò gangan ni.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: sí ẹ̀jẹ̀ àti ẹran ara
  rationale: A pa ìtòlẹ́sẹẹsẹ Gíríìkì “ẹ̀jẹ̀ àti ẹran ara” mọ́; gbólóhùn náà ń tọ́ka sí ènìyàn aláìlera, kì í ṣe sí ẹran ara gẹ́gẹ́ bí ìwà ẹ̀ṣẹ̀.
- source_word: ἀρχάς
  choice: àwọn alákòóso
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn agbára tí ń ṣàkóso; “àwọn alákòóso” ṣe kedere ní Yorùbá òde òní.
- source_word: ἐξουσίας
  choice: àwọn aláṣẹ
  rationale: Ó ń tọ́ka sí àwọn tí ó ní àṣẹ tàbí agbára àṣẹ; “àwọn aláṣẹ” yàtọ̀ sí “àwọn alákòóso” ṣùgbọ́n ó bá a rìn.
- source_word: κοσμοκράτορας
  choice: àwọn olùṣàkóso ayé
  rationale: Ọ̀rọ̀ àkójọpọ̀ náà ní ìtumọ̀ gangan àwọn tí ń ṣàkóso ayé; yíyan yìí pa agbára ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́ láì túmọ̀ ọ́ sí ètò ìṣèlú ènìyàn nìkan.
- source_word: τοῦ σκότους τούτου
  choice: òkùnkùn yìí
  rationale: A so ó mọ́ “àwọn olùṣàkóso ayé” gẹ́gẹ́ bí ẹ̀ka ìní tàbí àpèjúwe. A kò fi “ìsinsìnyí” kún un nítorí kò sí ní tààrà nínú Gíríìkì.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: àwọn agbára ẹ̀mí ibi
  rationale: Àpèjúwe ọ̀pọ̀ nínú Gíríìkì dúró gẹ́gẹ́ bí orúkọ fún àwọn ẹ̀dá tàbí agbára ti ẹ̀mí. “Àwọn agbára ẹ̀mí ibi” jẹ́ kó ṣeé lóye láì dá wọn mọ̀ sí ẹgbẹ́ ọmọ ogun kan pàtó.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ní àwọn agbègbè ọ̀run
  rationale: Ó ń tọ́ka sí ìpele tàbí àgbègbè ti ọ̀run, bí a ṣe ń lò ó jákèjádò Éfésù; “àwọn agbègbè ọ̀run” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì gbòòrò tó.
theological_decisions:
- issue: Irú àwọn ọ̀tá tí ẹsẹ yìí ń sọ
  choice: Àwọn agbára ẹ̀mí tí ó ju ènìyàn lọ ni àkọ́kọ́ tí ọ̀rọ̀ náà ń tọ́ka sí.
  alternative: Àwọn alákòóso àti ètò ìjọba ènìyàn nìkan, tàbí àwọn agbára ẹ̀mí pẹ̀lú bí wọ́n ṣe ń farahàn nínú àwọn ètò ayé.
  rationale: Àkójọpọ̀ àwọn ọ̀rọ̀ náà, pàápàá κοσμοκράτορας àti τὰ πνευματικὰ τῆς πονηρίας, tọ́ka kedere sí àwọn ọ̀tá ẹ̀mí. Síbẹ̀, ìtumọ̀ náà kò sẹ́ pé ipa wọn lè farahàn nínú ayé ènìyàn.
- issue: Ìtumọ̀ σάρξ nínú gbólóhùn yìí
  choice: “Ẹran ara” nínú àsọyé “ẹ̀jẹ̀ àti ẹran ara,” tó ń tọ́ka sí ènìyàn.
  alternative: “Ìwà ẹ̀ṣẹ̀.”
  rationale: Níbí, σάρξ wà nínú àsọyé tó ń tọ́ka sí ènìyàn aláyé; kò jẹ́ lílò Pọ́ọ̀lù fún ìtẹ̀sí ẹ̀ṣẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A lo “ìjàkadì” dípò ọ̀rọ̀ ìmọ̀ ẹ̀sìn àtijọ́, a sì pa ìyàtọ̀ “alákòóso/aláṣẹ” mọ́.
