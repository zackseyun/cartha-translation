id: EPH.6.19
reference: Ephesians 6:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: yo
  text: àti fún mi náà, kí a fún mi ní ọ̀rọ̀[a] nígbà tí mo bá ṣí ẹnu mi[b], láti fi ìgboyà[c] sọ ohun ìjìnlẹ̀ ìhìn rere[d] di mímọ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a fún mi ní ohun tí màá sọ” tàbí “kí a fún mi ní ìsọ̀rọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ní ṣíṣí ẹnu mi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní gbangba” tàbí “láìbẹ̀rù.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ìhìn ayọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: fún èmi náà
  rationale: Nínú ọ̀rọ̀ àdúrà tí ó bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú, ὑπέρ pẹ̀lú ọ̀rọ̀-orúkọ ní genitive túmọ̀ sí gbígbàdúrà fún ẹnì kan tàbí ní ipò rẹ̀. “Fún èmi náà” jẹ́ èdè Yorùbá àdánidá, ó sì mú καί tó ní ìtumọ̀ “náà” hàn.
- source_word: ἵνα μοι δοθῇ λόγος
  choice: kí a lè fi ọ̀rọ̀ fún mi
  rationale: Ìṣẹ̀dá aláìlórúkọ “a lè fi” pa ohùn passive δοθῇ mọ́ láìsọ ẹni tí ń fúnni. “Ọ̀rọ̀” lè túmọ̀ sí ohun tí Pọ́ọ̀lù yóò sọ tàbí ọ̀rọ̀ tí a fi fún un láti sọ, ó sì yẹra fún fífi ẹ̀kọ́ mìíràn kún ẹsẹ náà.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: nígbà tí mo bá la ẹnu mi
  rationale: Èyí pa àwòrán ṣíṣí ẹnu mọ́, ṣùgbọ́n ó sọ ọ́ ní Yorùbá àdánidá gẹ́gẹ́ bí ìgbà tí ẹni náà bẹ̀rẹ̀ sí í sọ̀rọ̀.
- source_word: ἐν παρρησίᾳ
  choice: pẹ̀lú ìgboyà
  rationale: παρρησία níbí ní ìtumọ̀ sísọ̀rọ̀ ní gbangba, láìbẹ̀rù, pẹ̀lú ìgboyà. “Pẹ̀lú ìgboyà” pa ìrísí ọ̀rọ̀-orúkọ àti ìtẹnumọ́ Gíríìkì mọ́.
- source_word: γνωρίσαι
  choice: láti ... sọ ... di mímọ̀
  rationale: Ìtumọ̀ tààrà ni “láti sọ di mímọ̀”; ó so ète ọ̀rọ̀ tí a fi fún Pọ́ọ̀lù mọ́ iṣẹ́ ìkéde rẹ̀ láìfi “wàásù” tàbí ìtumọ̀ tí ó ju ọ̀rọ̀ orísun lọ kún un.
- source_word: τὸ μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: Nínú lílo Pọ́ọ̀lù, μυστήριον jẹ́ ète Ọlọ́run tí ó ti farapamọ́ ṣùgbọ́n tí a ń sọ di mímọ̀, kì í ṣe àlọ́ tí kò ní ìdáhùn. “Ohun ìjìnlẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún èrò yìí.
- source_word: τοῦ εὐαγγελίου
  choice: ìhìn rere
  rationale: “Ìhìn rere” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere àti tó wọ́pọ̀ fún εὐαγγέλιον, ó sì pa ìtumọ̀ ìròyìn rere náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ λόγος nínú ohun tí Pọ́ọ̀lù béèrè nínú àdúrà
  choice: ọ̀rọ̀
  alternative: iṣẹ́ tàbí ọ̀rọ̀ ìkéde
  rationale: “Ọ̀rọ̀” pa àìdánilójú Gíríìkì mọ́ láàárín àwọn ọ̀rọ̀ tí yóò sọ àti ọ̀rọ̀ tàbí iṣẹ́ tí a fi fún un láti sọ; a kò sọ ọ́ di ẹ̀kọ́ pàtó nípa ìmísí.
- issue: Agbára ìtumọ̀ παρρησία
  choice: pẹ̀lú ìgboyà
  alternative: ní gbangba tàbí láìbẹ̀rù
  rationale: Yíyan “ìgboyà” mú ìgboyà àti òmìnira láti sọ̀rọ̀ jọ, láìdín ọ̀rọ̀ náà kù sí ìgbẹ́kẹ̀lé inú ọkàn nìkan.
- issue: Ìbáṣepọ̀ μυστήριον àti εὐαγγέλιον
  choice: ohun ìjìnlẹ̀ ìhìn rere
  alternative: àṣírí ìhìn rere
  rationale: Genitive náà lè ṣàpèjúwe ohun ìjìnlẹ̀ tí ó jẹ mọ́ ìhìn rere tàbí ohun ìjìnlẹ̀ tí ìhìn rere ní nínú rẹ̀. Ìtumọ̀ yìí pa ìbáṣepọ̀ náà mọ́ láìyan ọ̀kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Ẹsẹ náà bẹ̀rẹ̀ pẹ̀lú lẹ́tà kékeré, ó sì parí pẹ̀lú àmì kọ́má nítorí ó jẹ́ ara gbólóhùn àdúrà tó ń bá ọ̀rọ̀ ẹsẹ tó ṣáájú àti tó tẹ̀ lé e lọ.
