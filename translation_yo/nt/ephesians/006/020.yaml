base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: yo
  text: fún èyí ni mo jẹ́ aṣojú ní ẹ̀wọ̀n[a], kí n lè sọ̀rọ̀ nípa rẹ̀ pẹ̀lú ìgboyà[b], gẹ́gẹ́ bí ó ti yẹ kí n sọ̀rọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “nínú ẹ̀wọ̀n kan”; èyí jẹ́ àwòrán ìdè àti ìhámọ́ Pọ́ọ̀lù.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ arọ́pò orúkọ níbí jẹ́ aláìlẹ́mìí ní Gíríìkì, ó sì ṣeé ṣe jù pé ó ń tọ́ka sí ìhìn rere tàbí àṣírí rẹ̀, kì í ṣe sí ẹni kan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: nítorí èyí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ náà jẹ́ akọ̀kan aláìlẹ́mìí ní Gíríìkì, ó sì ṣeé ṣe jù pé ó ń tọ́ka sí “àṣírí ìhìn rere” ní ẹsẹ tó ṣáájú. “Nítorí èyí” sọ ìdí tàbí ohun tí Pọ́ọ̀lù dúró fún ní èdè Yorùbá àdánidá.
- source_word: πρεσβεύω
  choice: mo ń ṣe iṣẹ́ ikọ̀
  rationale: Ó pa ìtumọ̀ iṣẹ́ aṣojú tí a rán lọ mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere ju gbígbé àwòrán aṣojú òṣèlú òde òní wọ inú ọ̀rọ̀ lọ.
- source_word: ἐν ἁλύσει
  choice: ní ẹ̀wọ̀n
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì ní “nínú ẹ̀wọ̀n kan” ní akọ̀kan, “ní ẹ̀wọ̀n” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìdè àti ìhámọ́.
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó fi ète hàn ní Yorùbá tó wọ́pọ̀, ó sì so àdúrà ẹsẹ tó ṣáájú mọ́ àbájáde tí Pọ́ọ̀lù fẹ́.
- source_word: ἐν αὐτῷ
  choice: nípa rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò orúkọ Gíríìkì jẹ́ aláìlẹ́mìí, ó ṣeé ṣe kí ó tọ́ka sí ìhìn rere tàbí àṣírí rẹ̀. “Nípa rẹ̀” jẹ́ Yorùbá àdánidá fún sísọ̀rọ̀ ní ìbámu pẹ̀lú ohun náà láìsọ ọ́ di ẹni.
- source_word: παρρησιάσωμαι
  choice: sọ̀rọ̀ ... pẹ̀lú ìgboyà
  rationale: Ó kó ìtumọ̀ sísọ ní gbangba, láìbẹ̀rù, àti pẹ̀lú òmìnira ọkàn jọ.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: gẹ́gẹ́ bí ó ti yẹ kí n sọ̀rọ̀
  rationale: Ó pa ìmọ̀lára ojúṣe tàbí dandan δεῖ mọ́ ní ọ̀nà Yorùbá tó rọrùn, tó sì ní iyì.
theological_decisions:
- issue: Ohun tí οὗ àti αὐτῷ ń tọ́ka sí
  choice: A mú àwọn méjèèjì gẹ́gẹ́ bí ìtọ́ka sí ìhìn rere tàbí “àṣírí ìhìn rere” ní ẹsẹ 19.
  alternative: Àwọn kan lè túmọ̀ ọ̀kan nínú wọn ní ti ẹni, bí “nítorí ẹni tí” tàbí “nínú rẹ̀,” ṣùgbọ́n ìbámu gírámà pẹ̀lú irú akọ̀ aláìlẹ́mìí mú èyí ṣeé ṣe kéré sí i.
  rationale: Àwọn fọ́ọ̀mù Gíríìkì οὗ àti αὐτῷ níbí jẹ́ akọ̀kan aláìlẹ́mìí, nítorí náà ìtọ́ka sí àṣírí/ìhìn rere ni ó bá ẹ̀rí ọ̀rọ̀ mu jù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò. “Iṣẹ́ ikọ̀” pa àwòrán aṣojú tí a rán lọ mọ́; “ní ẹ̀wọ̀n” sì jẹ́ àsọyé Yorùbá àdánidá fún ìhámọ́. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ.
