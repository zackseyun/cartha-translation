id: EPH.6.9
reference: Ephesians 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: yo
  text: Àti ẹ̀yin ọ̀gá[a], ẹ ṣe bákan náà sí wọn, ẹ sì dẹ́kun lílo ìhalẹ̀[b], ní mímọ̀ pé Olúwa tiwọn àti tiyín wà ní ọ̀run[c], àti pé kò sí ojúsàájú lọ́dọ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ẹ ṣe ohun kan náà sí wọn” tàbí “ẹ hùwà sí wọn lọ́nà kan náà.” Gíríìkì tún ìlànà tó ṣáájú sọ, ó sì tẹnumọ́ ìhùwàsí tí ó yẹ láti ọ̀dọ̀ àwọn méjèèjì.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí “ẹ dáwọ́ híhalẹ̀ dúró.” Ọ̀rọ̀ Gíríìkì ἀνιέντες lè túmọ̀ sí dídáwọ́ tàbí fífi àṣà híhalẹ̀ sílẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “ní àwọn ọ̀run”; “ní ọ̀run” ni a lò gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún gbólóhùn náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: ọ̀gá
  rationale: Nínú àyíká ìlànà agbo ilé yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹni tí ó jẹ́ ọ̀gá àwọn ẹrú tàbí ìránṣẹ́. “Ọ̀gá” jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere láì sọ àyíká náà di ti àjọṣe agbanisíṣẹ́ òde òní.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: ẹ ṣe bákan náà sí wọn
  rationale: Èyí pa ìsopọ̀ mọ́ ìlànà ẹsẹ̀ tó ṣáájú, ó sì tẹnumọ́ pé àwọn ọ̀gá náà gbọ́dọ̀ hùwà tó yẹ sí àwọn tó wà lábẹ́ wọn.
- source_word: ἀνιέντες
  choice: ẹ sì jáwọ́ nínú
  rationale: “Jáwọ́ nínú” fi ìtumọ̀ dídáwọ́ tàbí fífi àṣà kan sílẹ̀ hàn ní Yorùbá àdánidá.
- source_word: τὴν ἀπειλήν
  choice: híhalẹ̀ mọ́ wọn
  rationale: Gbólóhùn yìí túmọ̀ sí ìṣe títa àwọn ènìyàn lẹ́rù nípa ìhalẹ̀, kì í ṣe ìhalẹ̀ kan ṣoṣo.
- source_word: εἰδότες
  choice: ní mímọ̀ pé
  rationale: Èyí pa ìrísí alábàápín Gíríìkì mọ́, ó sì fi ìmọ̀ yìí hàn gẹ́gẹ́ bí ìdí fún àṣẹ náà.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: Olúwa tiwọn àti tiyín
  rationale: '“Olúwa” yẹ fún κύριος nígbà tí ó ń tọ́ka sí Olúwa ọ̀run, nígbà tí “ọ̀gá” yẹ fún àwọn ọ̀gá ènìyàn. Ìyàtọ̀ yìí mú ìtakora ọ̀rọ̀ náà hàn: àwọn ọ̀gá ayé fúnra wọn wà lábẹ́ Olúwa kan náà.'
- source_word: ἐν οὐρανοῖς
  choice: ní ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀, “ní ọ̀run” ni ọ̀nà Yorùbá àdánidá fún gbólóhùn yìí.
- source_word: προσωπολημψία
  choice: ojúsàájú
  rationale: “Ojúsàájú” sọ àìṣèdájọ́ òdodo nítorí ẹni tí ènìyàn jẹ́ ní kedere, ó sì bá Yorùbá òde òní mu.
- source_word: παρ’ αὐτῷ
  choice: lọ́dọ̀ rẹ̀
  rationale: “Lọ́dọ̀ rẹ̀” jẹ́ ìtumọ̀ Yorùbá àdánidá tó fi hàn pé irú ojúsàájú bẹ́ẹ̀ kò sí pẹ̀lú Ọlọ́run tàbí nínú ìṣe rẹ̀.
theological_decisions:
- issue: Lílo κύριος fún ọ̀gá ènìyàn àti fún Olúwa ọ̀run nínú ẹsẹ̀ kan náà
  choice: Túmọ̀ κύριοι ti ènìyàn sí “ọ̀gá,” kí a sì túmọ̀ κύριος ti ọ̀run sí “Olúwa.”
  alternative: Lílo “ọ̀gá” fún àwọn méjèèjì tàbí lílo “olúwa” fún àwọn méjèèjì.
  rationale: Gíríìkì lo gbòǹgbò ọ̀rọ̀ kan náà, ṣùgbọ́n ìyàtọ̀ Yorùbá yìí yà ipò àwùjọ ènìyàn sọ́tọ̀ kúrò lára orúkọ oyè Ọlọ́run, ó sì pa kókó ọ̀rọ̀ mọ́ pé àwọn ọ̀gá ayé ní Olúwa kan náà ní ọ̀run.
- issue: Ọ̀rọ̀ ipò àwùjọ nínú ìlànà agbo ilé ìgbàanì
  choice: Lo “ọ̀gá” ní ìbámu pẹ̀lú àyíká àwọn ẹrú tàbí ìránṣẹ́.
  alternative: “Agbanisíṣẹ́” tàbí “onílé.”
  rationale: “Agbanisíṣẹ́” lè sọ àjọṣe ìgbàanì di iṣẹ́ owó òde òní, “onílé” sì dín ìtumọ̀ ipò náà kù. “Ọ̀gá” pa agbára àti ojúṣe àjọṣe náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi gbogbo tí ó yẹ. Àṣẹ ọ̀pọ̀ ènìyàn “ẹ” bá ìtọ́kasí sí àwọn ọ̀gá mu. Gbólóhùn náà pa ìrísí àti ìtakora Gíríìkì mọ́ níwọ̀n tó ṣeé ṣe, ṣùgbọ́n ó yà “ọ̀gá” ènìyàn sí “Olúwa” ọ̀run fún ìtumọ̀ kedere.
