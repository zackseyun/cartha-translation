source:
  edition: SBLGNT
  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: yo
  text: Nítorí náà, ẹ dúró, lẹ́yìn tí ẹ ti fi òtítọ́ di ìbàdí yín mú, tí ẹ sì ti wọ ìhámọ́ra àyà òdodo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhámọ́ra àyà ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì δικαιοσύνη lè túmọ̀ sí òdodo tàbí ìdájọ́ òdodo nínú àwọn lẹ́tà Paulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: ẹ dúró
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ‘ẹ dúró’ pa ìtumọ̀ pàtó mọ́ láì fi ‘ṣinṣin’ kún un, nítorí kò sí ọ̀rọ̀ adverb bẹ́ẹ̀ nínú gbolohun náà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀ ìṣírí tó ṣáájú.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: lẹ́yìn tí ẹ ti fi ... di ẹ̀gbẹ́ yín
  rationale: Ìṣe àṣepé participle ni; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa àwòrán dídì nǹkan mọ́ ẹ̀gbẹ́ mọ́ láì fi ọ̀rọ̀ ‘ìgbànú’ tí kò sí ní pàtó nínú Gíríìkì kún un.
- source_word: ἐν ἀληθείᾳ
  choice: fi òtítọ́
  rationale: ‘Fi’ lè tọ́ka sí ohun èlò tàbí ọ̀nà ìṣe, ó sì jẹ́ kí ‘òtítọ́’ lè ní ìtumọ̀ òtítọ́ gẹ́gẹ́ bí ohun tí a gbàgbọ́ àti ìwà olóòtítọ́ láì yan ọ̀kan ṣoṣo.
- source_word: ἐνδυσάμενοι
  choice: tí ẹ sì ti wọ
  rationale: Èyí ni ọ̀nà Yorùbá tó bójú mu fún wíwọ aṣọ tàbí ohun ìjà ààbò, ó sì bá ìṣe àṣepé participle mu.
- source_word: θώρακα
  choice: ìgbàyà
  rationale: ‘Ìgbàyà’ jẹ́ ọ̀rọ̀ Yorùbá fún ohun ìjà ààbò tí a wọ bo àyà, ó sì pa àwòrán ọmọ-ogun mọ́.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tó lè gba ìtumọ̀ ìwà títọ́ àti ìdájọ́ òdodo; nítorí náà ó dáàbò bo ìwọ̀n ìtumọ̀ δικαιοσύνη nínú àyíká Paulu.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àpẹẹrẹ ohun ìjà Paulu
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ jẹ́ yíyan àkọ́kọ́ tó wọ́pọ̀, ó sì lè tọ́ka sí ipò títọ́ àti ìwà títọ́. Àfikún ìsàlẹ̀ pa ìtumọ̀ justice mọ́ láì fi ẹ̀kọ́ ẹ̀sìn kan pàtó lé ẹsẹ̀ náà lórí.
translation_notes:
  register: Yorùbá àgbàṣe tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Fọ́ọ̀mù ọ̀pọ̀ ènìyàn oníyì ‘ẹ’ ni a fi ṣàfihàn àwọn ọ̀rọ̀ ẹni kejì plural. A pa àkójọpọ̀ gbolohun náà mọ́ pẹ̀lú àmì kọ́mà nítorí ẹsẹ̀ náà ń bá ọ̀rọ̀ ohun ìjà náà lọ ní ẹsẹ̀ tó tẹ̀ lé e.
