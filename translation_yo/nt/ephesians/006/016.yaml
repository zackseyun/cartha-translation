id: EPH.6.16
reference: Ephesians 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: yo
  text: Ní gbogbo ipò, ẹ gbé apata ìgbàgbọ́ mú, èyí tí ẹ ó fi lè pa gbogbo ọfà[a] ẹni ibi náà oníná[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbogbo irú ohun ìjà tí a ń tafà, kì í ṣe ọfà nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, ‘tí a ti fi iná sí’; a tún lè túmọ̀ rẹ̀ sí ‘ọfà tí ń jó.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘ti ibi’; ọ̀rọ̀ Gíríìkì lè tọ́ka sí ẹni ibi náà tàbí sí ibi gẹ́gẹ́ bí ohun àìlódodo, bí ó tilẹ̀ jẹ́ pé àyíká ogun yìí ṣe àtìlẹ́yìn fún ìtumọ̀ ti ẹni kan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: Ní gbogbo ipò
  rationale: Ó mú ọ̀rọ̀ Gíríìkì náà gẹ́gẹ́ bí gbólóhùn adverbial, ‘ní gbogbo ipò,’ èyí tó bá àkójọ ohun ìjà mu, láì sọ ọ́ di ‘nínú ohun gbogbo’ lọ́nà líle.
- source_word: ἀναλαβόντες
  choice: ẹ gbé ... mú
  rationale: Ó sọ iṣẹ́ tí participle náà ń fi kún ìṣírí àṣẹ inú àyíká ọ̀rọ̀ náà ní Yorùbá àdánidá.
- source_word: θυρεὸν
  choice: apata
  rationale: ‘Apata’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún shield, ó sì pa àwòrán ohun ìjà ológun mọ́.
- source_word: τῆς πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, πίστις ń tọ́ka sí ìgbẹ́kẹ̀lé onígbàgbọ́ nínú Ọlọ́run; ‘ìgbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tó sì yẹ.
- source_word: ἐν ᾧ
  choice: pẹ̀lú rẹ̀
  rationale: Ó fi ìtumọ̀ irinṣẹ́ hàn, ó sì tọ́ka padà sí apata lọ́nà Yorùbá tó ṣe déédé.
- source_word: δυνήσεσθε
  choice: ẹ ó lè
  rationale: Ó pa ìtumọ̀ agbára àti ọjọ́ iwájú inú ọ̀rọ̀-ìṣe Gíríìkì náà mọ́.
- source_word: βέλη
  choice: ọfà
  rationale: βέλη lè túmọ̀ sí ohun ìjà tí a ń tafà; ‘ọfà’ rọrùn fún òǹkàwé Yorùbá, ṣùgbọ́n a fi ìtumọ̀ tó gbòòrò sí i sínú àlàyé ìsàlẹ̀.
- source_word: τοῦ πονηροῦ
  choice: ẹni ibi náà
  rationale: Àyíká ogun ẹ̀mí ṣe àtìlẹ́yìn fún kíkà á gẹ́gẹ́ bí ẹni kan, láì fi orúkọ kan tí Gíríìkì kò sọ kún un.
- source_word: πεπυρωμένα
  choice: tí ń jó
  rationale: Ó pa àwòrán àwọn ohun ìjà tí iná ń jó mọ́ ní èdè Yorùbá àdánidá.
- source_word: σβέσαι
  choice: fi pa
  rationale: Nínú àyíká iná, ‘pa’ túmọ̀ sí pípa iná, ó sì bá lílo apata gẹ́gẹ́ bí ohun èlò mu.
theological_decisions:
- issue: Ìtumọ̀ τοῦ πονηροῦ
  choice: ẹni ibi náà
  alternative: ibi
  rationale: Ọ̀rọ̀ náà lè jẹ́ ti ẹni ibi kan tàbí ti ibi gẹ́gẹ́ bí ohun àìlódodo; àyíká ìkọlù ogun ẹ̀mí mú kí ìtumọ̀ ti ẹni kan ṣeé ṣe jù, ṣùgbọ́n a pa ìtumọ̀ kejì mọ́ nínú àlàyé.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú àpèjúwe apata yìí, ìgbẹ́kẹ̀lé Ọlọ́run ni ó hàn gbangba jù; ‘ìgbàgbọ́’ sì jẹ́ ọ̀rọ̀ àkọ́kọ́ tó lè gbé ìtumọ̀ yẹn.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ọ̀rọ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo àṣẹ púpọ̀ ‘ẹ’ láti bá àwùjọ tí Pọ́ọ̀lù ń bá sọ mu.
