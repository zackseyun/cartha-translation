id: EPH.6.13
reference: Ephesians 6:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: yo
  text: Nítorí náà, ẹ gbé gbogbo ìhámọ́ra Ọlọ́run mú[a], kí ẹ lè kọjú ìjà sí[b] ní ọjọ́ búburú náà[c], àti nígbà tí ẹ bá ti ṣe ohun gbogbo[d], kí ẹ lè dúró ṣinṣin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘gbogbo ohun èlò ogun Ọlọ́run.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo ohun èlò tí ọmọ ogun tí ó dìhámọ́ra ní ní kíkún.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘dúró lòdì’ tàbí ‘dúró dojú kọ.’
    reason: lexical_alternative
  - marker: c
    text: ‘Ọjọ́ búburú náà’ lè túmọ̀ sí àkókò ibi tàbí àdánwò líle ní gbogbogbòò; kò pọn dandan pé ọjọ́ ìkẹyìn kan pàtó nìkan ni.
    reason: alternative_reading
  - marker: d
    text: A tún lè túmọ̀ rẹ̀ sí ‘tí ẹ bá ti mú ohun gbogbo ṣẹ’ tàbí ‘tí ẹ bá ti ṣe gbogbo rẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìyọrísí ohun tí a ṣẹ̀ṣẹ̀ sọ hàn.
- source_word: ἀναλάβετε
  choice: ẹ gbé ... mú
  rationale: Ó pa ìtumọ̀ gbígbé ohun èlò ogun mú mọ́, dípò fífi ìtumọ̀ ‘wọ̀’ kún ọ̀rọ̀ náà.
- source_word: πανοπλίαν
  choice: gbogbo ìhámọ́ra
  rationale: πανοπλία ń tọ́ka sí gbogbo ohun èlò ààbò ọmọ ogun pátápátá; ‘gbogbo ìhámọ́ra’ ṣe àfihàn ìpéye yẹn ní Yorùbá.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Àkójọpọ̀ ‘ìhámọ́ra Ọlọ́run’ jẹ́ kí ìbáṣepọ̀ genitive náà wà ní ṣíṣí—ó lè jẹ́ ti Ọlọ́run tàbí èyí tí Ọlọ́run pèsè—láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἵνα δυνηθῆτε
  choice: kí ẹ lè
  rationale: Ó fi ète àti agbára láti ṣe ohun náà hàn ní ọ̀nà Yorùbá tó rọrùn.
- source_word: ἀντιστῆναι
  choice: dúró lòdì
  rationale: Ó pa àwòrán ẹni tó dúró dojú kọ ìkọlù mọ́, ó sì yàtọ̀ sí στῆναι tó tẹ̀ lé e.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: ní ọjọ́ búburú náà
  rationale: Ìtumọ̀ yìí sun mọ́ Gíríìkì, ó sì kò fi dandan sọ pé ọjọ́ ìkẹyìn kan pàtó ni.
- source_word: ἅπαντα κατεργασάμενοι
  choice: lẹ́yìn tí ẹ bá sì ti ṣe ohun gbogbo
  rationale: Ó pa ìtumọ̀ gbooro ti ṣíṣe tàbí mímú gbogbo ohun tí ó yẹ ṣẹ mọ́ láìsọ pé wọ́n ti ṣẹ́gun pátápátá.
- source_word: στῆναι
  choice: kí ẹ dúró ṣinṣin
  rationale: ‘Dúró ṣinṣin’ mú agbára ọ̀rọ̀ náà nínú àwòrán ogun jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘ọjọ́ búburú náà’
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí àkókò ibi tàbí ìjà ẹ̀mí ní gbogbogbòò.
  alternative: Ọjọ́ ìkẹyìn kan pàtó, tàbí ọjọ́ àdánwò ẹni kọ̀ọ̀kan.
  rationale: Gbólóhùn Gíríìkì náà kò fi dandan yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí; ìtumọ̀ Yorùbá náà pa àyè yẹn mọ́.
- issue: Agbára genitive nínú ‘ìhámọ́ra Ọlọ́run’
  choice: A kò sọ bóyá ìhámọ́ra náà jẹ́ ohun tí Ọlọ́run ní tàbí ohun tí ó pèsè.
  alternative: ‘ìhámọ́ra tí Ọlọ́run pèsè’ tàbí ‘ìhámọ́ra tí ó jẹ́ ti Ọlọ́run.’
  rationale: Gíríìkì lè gba àwọn ìbáṣepọ̀ méjèèjì; yíyan ọ̀kan nìkan yóò dín ìtumọ̀ orísun kù.
- issue: Ìtumọ̀ κατεργασάμενοι
  choice: ‘tí ẹ bá ti ṣe ohun gbogbo’
  alternative: ‘tí ẹ bá ti mú ohun gbogbo ṣẹ’ tàbí ‘tí ẹ bá ti borí ohun gbogbo.’
  rationale: A yan ọ̀rọ̀ gbooro tí kò fi èrò ìṣẹ́gun tí kò ṣe kedere sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, aláṣẹ, tó sì ṣe kedere fún òǹkàwé òde òní. A pa àwòrán ogun àti àtúnsọ ‘dúró’ mọ́.
