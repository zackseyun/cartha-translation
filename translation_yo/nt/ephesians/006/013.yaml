  source_fidelity: 'Ìtumọ̀ náà pa èrò pàtàkì Gíríìkì mọ́: ìpè láti gbé ìhámọ́ra Ọlọ́run, láti lè kojú ìkọlù ní ọjọ́ búburú, àti láti dúró lẹ́yìn tí a ti ṣe gbogbo ohun tó yẹ. Ṣùgbọ́n ìtumọ̀ ‘dúró lòdì’ kò rọrùn ní Yorùbá nínú ìlò aláìní ohun tí a dúró lòdì sí; ‘kọjú ìjà sí’ jẹ́ ìfihàn tó ṣe kedere síi fún ἀντιστῆναι nínú àwòrán ogun náà.'
  naturalness: Àwọn gbolohun míì jẹ́ Yorùbá boṣewa tó dáa. A tún ṣètò apá ìkẹyìn díẹ̀ kí ìbáṣepọ̀ ‘having done everything’ àti ‘to stand’ lè ṣàn dáadáa, láìjẹ́ kí ‘lẹ́yìn’ dà bí ìpele àkókò tí ó le ju ohun tí participle Gíríìkì sọ lọ.
  terminology: ‘Gbogbo ìhámọ́ra Ọlọ́run’ yẹ, ó sì pa ìtumọ̀ πανοπλίαν àti genitive náà mọ́ ní ṣíṣí. ‘Kọjú ìjà sí’ dára ju ‘dúró lòdì’ lọ nínú àyíká yìí; ‘dúró ṣinṣin’ jẹ́ ìtumọ̀ adayeba fún στῆναι nínú ìpè ogun yìí.
  issues:
