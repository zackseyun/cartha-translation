  - severity: low
    issue: Ìdásílẹ̀ apá participle ‘lẹ́yìn tí…’
    rationale: ‘Lẹ́yìn’ lè sọ ìtẹ̀lé àkókò tó lágbára ju participle κατεργασάμενοι lọ. ‘Tí ẹ bá ti ṣe ohun gbogbo’ pa ìmọ̀ ‘having accomplished/done all’ mọ́ ní kíkún, ó sì so mọ́ ‘dúró’ ní adayeba.
