id: EPH.6.24
reference: Ephesians 6:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ wà pẹ̀lú gbogbo àwọn tí ó nífẹ̀ẹ́ Olúwa wa Jésù Mèsáyà nínú àìdíbàjẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìfẹ́ tí kì í ṣègbé”; ó tún lè jẹ́, “ní òtítọ́ ọkàn” tàbí “pẹ̀lú ìfẹ́ tí kì í kú.” Gbólóhùn Gíríìkì náà, “nínú àìdíbàjẹ́,” kúrú, ó sì lè ní ju ìtumọ̀ kan lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún χάρις, ó sì bá ìbùkún ìparí lẹ́tà Paulu mu.
- source_word: μετὰ πάντων
  choice: Kí ... wà pẹ̀lú gbogbo àwọn
  rationale: Bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀-ìṣe nínú Gíríìkì, fífi ‘Kí ... wà’ kún un jẹ́ ọ̀nà àdúrà-ìbùkún tí ó bójú mu ní Yorùbá; ‘pẹ̀lú gbogbo àwọn’ sì tẹ̀ lé μετά pẹ̀lú genitive.
- source_word: ἀγαπώντων
  choice: tí ó nífẹ̀ẹ́
  rationale: A tú participle yìí sí gbólóhùn ìbátan tí ó jẹ́ àdánidá ní Yorùbá, tí ó sì fi ìfẹ́ gẹ́gẹ́ bí ìwà tí ń bá a lọ hàn.
- source_word: κύριον
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ Yorùbá tí ó yẹ fún κύριος gẹ́gẹ́ bí orúkọ oyè Kristi níbí.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésù Mèsáyà
  rationale: A tú Χριστός gẹ́gẹ́ bí oyè náà, ‘Mèsáyà,’ dípò kí a fi fọ́ọ̀mù ‘Kristi’ tí ó lè dà bí apá orúkọ lasán sílẹ̀.
- source_word: ἐν ἀφθαρσίᾳ
  choice: nínú àìdíbàjẹ́
  rationale: Ìtumọ̀ yìí sún mọ́ ìrísí Gíríìkì, ó sì pa àìdánilójú mọ́ nípa bóyá ọ̀rọ̀ náà ń ṣàpèjúwe ìfẹ́ wọn, ipò ìbùkún náà, tàbí ìwà àìlèbàjẹ́.
theological_decisions:
- issue: Ìtumọ̀ ἐν ἀφθαρσίᾳ
  choice: Pa ọ̀rọ̀ kúkúrú tí ó ní ìtumọ̀ gbòòrò mọ́ gẹ́gẹ́ bí ‘nínú àìdíbàjẹ́’
  alternative: ‘pẹ̀lú ìfẹ́ tí kì í ṣègbé’; ‘ní òtítọ́ ọkàn’; tàbí ‘pẹ̀lú ìfẹ́ tí kì í kú’
  rationale: Gíríìkì kò sọ ní kedere ohun tí ἀφθαρσία ń ṣàpèjúwe. Nítorí náà, a kò yan ìtumọ̀ ẹ̀kọ́ kan ṣoṣo ní pàtàkì; a fi àwọn ìtumọ̀ tí ó ṣeé ṣe sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní iyì ìbùkún ìparí lẹ́tà, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní.
