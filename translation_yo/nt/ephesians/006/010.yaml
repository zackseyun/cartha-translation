  text: ⸂Τοῦ λοιποῦ⸃ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: yo
  text: Ní ìkẹyìn[a], ẹ máa gba okun nínú Olúwa àti nínú agbára ńlá rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa lágbára nínú Olúwa.” Fáàbù Gíríìkì náà lè jẹ́ ìtumọ̀ bẹ́ẹ̀ ní ọ̀nà tí ó rọrùn, ṣùgbọ́n “ẹ máa gba okun” ń pa ìró gbígba okun mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Ní ìkẹyìn
  rationale: Ó jẹ́ ọ̀rọ̀ ìyípadà tí ó ń ṣí apá ìparí lẹ́tà náà sílẹ̀; “Ní ìkẹyìn” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ibi yìí mu.
- source_word: ἐνδυναμοῦσθε
  choice: ẹ máa gba okun
  rationale: Àṣẹ yìí ń tẹnu mọ́ gbígba okun, kì í ṣe pé kí àwọn onígbàgbọ́ kàn ru agbára inú ara wọn sókè. Ó tún jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ìtumọ̀ aláìrọ̀rùn bí “ẹ jẹ́ kí a fún yín lókun” lọ.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: “Nínú” pa èrò Gíríìkì mọ́ pé Olúwa ni ààyè ìbáṣepọ̀ tí okun náà wà; “láti ọ̀dọ̀ Olúwa” yóò sọ ọ́ di ohun èlò tàbí orísun ní pàtó ju bí ọ̀rọ̀ náà ṣe sọ lọ.
- source_word: κράτει τῆς ἰσχύος αὐτοῦ
  choice: nínú agbára ńlá rẹ̀
  rationale: Gíríìkì ko àwọn ọ̀rọ̀ agbára méjì jọ láti fi agbára Olúwa hàn gidigidi. “Agbára ńlá rẹ̀” mú ìtẹnumọ́ yẹn jáde ní Yorùbá àdánidá láì dá gbolohun tí kò rọrùn sílẹ̀.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka padà sí Olúwa, “rẹ̀” sì ni ìbámu Yorùbá tó ṣe tààrà jù.
theological_decisions:
- issue: Ìró àti orísun okun nínú ἐνδυναμοῦσθε
  choice: Àṣẹ láti gba okun nínú Olúwa
  alternative: Ẹ máa lágbára nínú Olúwa
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìró gbígba ohun tí fáàbù Gíríìkì lè ní mọ́, ó sì yẹra fún fífi hàn pé àwọn olùgbọ́ gbọ́dọ̀ dá agbára sílẹ̀ láti inú ara wọn.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó yẹ fún κύριος ní àyíká Páùlù yìí, níbi tí ó ti tọ́ka sí Jésù tí a gbé ga.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbo ni a lò. “Ẹ máa gba okun” jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ pé a ń gba okun mọ́; “agbára ńlá rẹ̀” mú àkójọpọ̀ àwọn ọ̀rọ̀ agbára méjì nínú Gíríìkì jáde láì jẹ́ kí gbolohun di líle.
