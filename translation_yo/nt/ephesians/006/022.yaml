id: EPH.6.22
reference: Ephesians 6:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: yo
  text: 'ẹni tí mo rán sí yín fún ìdí yìí gan-an: kí ẹ lè mọ bí a ti wà[a], kí ó sì lè mú ọkàn yín le.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ lè mọ ipò wa,” tàbí “kí ẹ lè mọ àwọn ọ̀ràn nípa wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: ẹni tí mo rán sí yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan ὃν tọ́ka sí Tíkíkù nínú ẹsẹ tó ṣáájú. Ìtumọ̀ yìí pa ìsopọ̀ gbolohun Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: εἰς αὐτὸ τοῦτο
  choice: fún ìdí yìí gan-an
  rationale: “Gan-an” mú ìtẹnumọ́ inú αὐτὸ τοῦτο jáde, nígbà tí “fún ìdí yìí” fi ète ìránṣẹ́ náà hàn kedere.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: kí ẹ lè mọ bí a ti wà
  rationale: Ọ̀rọ̀ yìí sọ ète, ó sì lè kan ipò àti àwọn ọ̀ràn tó jẹ mọ́ Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀. “Bí a ti wà” jẹ́ èdè Yorùbá tó ṣe kedere láì fi ìtumọ̀ náà mọ́ àwọn ipò òde nìkan.
- source_word: παρακαλέσῃ τὰς καρδίας ὑμῶν
  choice: kí ó sì lè mú ọkàn yín le
  rationale: Nínú àyíká yìí, παρακαλέω túmọ̀ sí fífúnni ní ìṣírí tàbí fífúnni lókun. Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá àdánidá, ó sì pa àwòrán “ọkàn” mọ́.
theological_decisions:
- issue: Ìtumọ̀ τὰ περὶ ἡμῶν
  choice: bí a ti wà
  alternative: àwọn ọ̀ràn nípa wa; ipò wa
  rationale: Gíríìkì lè gba ipò ara ẹni àti gbogbo ohun tó jẹ mọ́ wọn. “Bí a ti wà” pa ìfẹ̀ ìtumọ̀ yẹn mọ́ láì dín un kù sí ipò òde nìkan.
- issue: Ìtumọ̀ παρακαλέω pẹ̀lú “ọkàn”
  choice: mú ọkàn yín le
  alternative: fún ọkàn yín ní ìṣírí; tu ọkàn yín nínú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìṣírí, ìtùnú, tàbí ìgbọ́ni-níyànjú. Àyíká ìtọ́jú àti fífún àwọn onígbàgbọ́ lókun ṣe àtìlẹ́yìn fún “mú ọkàn yín le,” láì sọ pé ìtùnú nìkan ni.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún. A lo “ẹni tí” láti so ẹsẹ yìí mọ́ ẹni tí ẹsẹ tó ṣáájú dárúkọ, “gan-an” fún ìtẹnumọ́, àti “mú ọkàn yín le” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá fún ìṣírí inú.
