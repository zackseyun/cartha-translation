id: EPH.6.6
reference: Ephesians 6:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: yo
  text: Kì í ṣe nípa iṣẹ́ ojú[a], gẹ́gẹ́ bí àwọn tí ń tẹ́ ènìyàn lọ́rùn, bí kò ṣe gẹ́gẹ́ bí ẹrú Mèsáyà[b], tí ẹ ń ṣe ìfẹ́ Ọlọ́run láti inú ọkàn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iṣẹ́ nígbà tí wọ́n bá ń wò yín nìkan”; ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “iṣẹ́ ojú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kristi”; ọ̀rọ̀ Gíríìkì náà ni Christos, ìyẹn ẹni tí a fòróró yàn.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “fi gbogbo ọkàn” tàbí “tọkàntọkàn”; ní tààrà, “láti inú ẹ̀mí/ọkàn ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: iṣẹ́ ojú
  rationale: Ó pa àkópọ̀ ọ̀rọ̀ Gíríìkì náà mọ́—‘ojú’ àti ‘iṣẹ́ ẹrú’—ó sì ń tọ́ka sí iṣẹ́ tí a ń ṣe fún ìríran tàbí nígbà tí ẹni tó ń ṣọ́ni bá ń wò nìkan.
- source_word: ἀνθρωπάρεσκοι
  choice: àwọn tí ń ṣe ohun tí yóò tẹ́ ènìyàn lọ́rùn
  rationale: Ìtumọ̀ àlàyé yìí jẹ́ Yorùbá àdánidá, ó sì pa èrò Gíríìkì mọ́ pé àwọn ẹni bẹ́ẹ̀ ń wá ìtẹ́wọ́gbà lọ́dọ̀ ènìyàn.
- source_word: δοῦλοι
  choice: àwọn ẹrú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, δοῦλοι ń sọ nípa àwọn ẹrú gidi, ó sì tún tẹnumọ́ jíjẹ́ ti Mèsáyà; ‘ẹrú’ pa agbára ìtumọ̀ náà mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò lílo ọ̀rọ̀ bí ẹni pé orúkọ lasán ni.
- source_word: ποιοῦντες
  choice: tí ẹ ń ... ṣe
  rationale: Ọ̀rọ̀ aláìparí náà ń bá àṣẹ inú àyíká ẹsẹ yìí lọ, ó sì fi hàn pé ṣíṣe ìfẹ́ Ọlọ́run ń lọ papọ̀ pẹ̀lú iṣẹ́ wọn.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: ‘Ìfẹ́ Ọlọ́run’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ àti tó ṣe kedere fún ohun tí Ọlọ́run fẹ́ kí a ṣe.
- source_word: ἐκ ψυχῆς
  choice: fi gbogbo ọkàn
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣe ohun kan tọkàntọkàn; àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé Gíríìkì sọ ní tààrà pé ‘láti inú ọkàn/ẹ̀mí.’
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλοι nínú àyíká ìlànà ilé
  choice: àwọn ẹrú Mèsáyà
  alternative: àwọn ìránṣẹ́ Mèsáyà
  rationale: Àwọn tí Pọ́ọ̀lù ń bá sọ jẹ́ ẹrú ní ti gidi, ó sì ń tún ìdánimọ̀ wọn ṣe gẹ́gẹ́ bí ẹni tí ó jẹ́ ti Mèsáyà. ‘Ẹrú’ kò dín ìṣòro àti agbára ọ̀rọ̀ Gíríìkì kù.
- issue: Bí a ṣe gbé Χριστοῦ kalẹ̀ gẹ́gẹ́ bí oyè tàbí ọ̀rọ̀ tó dà bí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ mú ìtumọ̀ ẹni tí a fòróró yàn hàn, ó sì pa oyè náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Iṣẹ́ ojú’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ mú un ṣe kedere. ‘Fi gbogbo ọkàn’ jẹ́ àdánidá ju ‘láti inú ọkàn’ lọ nínú gbólóhùn yìí, nígbà tí àlàyé [c] pa ìtumọ̀ gidi ψυχή mọ́.
