id: EPH.6.8
reference: Ephesians 6:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: yo
  text: ní mímọ̀ pé olúkúlùkù, ohunkóhun rere tí ó bá ṣe, èyí náà ni yóò gbà padà[a] lọ́dọ̀ Olúwa, yálà ó jẹ́ ẹrú tàbí ẹni òmìnira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Olúwa yóò san án padà fún un nítorí èyí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ohun tí ó bá iṣẹ́ ẹni mu padà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “yálà ó jẹ́ ẹrú tàbí ẹni tí ó lómìnira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: ní mímọ̀ pé
  rationale: Ọ̀rọ̀ yìí jẹ́ participle tí ó so ẹsẹ̀ náà mọ́ ìṣírí inú ẹsẹ̀ tí ó ṣáájú. “Ní mímọ̀ pé” pa ìsopọ̀ participle náà mọ́ láì sọ ọ́ di gbólóhùn ìdí ní pàtó.
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa ìtẹnumọ́ sí ẹnì kọ̀ọ̀kan mọ́, ó sì bá èdè Yorùbá ìsinsìnyí mu.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: ohunkóhun rere tí ó bá ṣe
  rationale: “Ohunkóhun” fi àìní ààlà tí ἄν ń tọ́ka sí hàn, “rere” sì pa ìwà rere iṣẹ́ náà mọ́.
- source_word: τοῦτο
  choice: èyí náà
  rationale: Àrọ́pò atọ́ka yìí ń tọ́ka padà sí ohun rere tí ẹni náà ṣe, “náà” sì mú ìbámu tàbí ìdáhùn tó bá iṣẹ́ náà mu hàn.
- source_word: κομίσεται
  choice: yóò gbà padà
  rationale: κομίζω níbí lè túmọ̀ sí gbígba ohun tí ó bá iṣẹ́ ẹni mu padà. “Gbà padà” pa ìtumọ̀ ìdáhùn náà mọ́ láì sọ ọ́ di ọ̀rọ̀ òwò tàbí owó sísan nìkan.
- source_word: παρὰ κυρίου
  choice: lọ́dọ̀ Olúwa
  rationale: παρά pẹ̀lú genitive fi orísun hàn. “Lọ́dọ̀ Olúwa” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé Olúwa ni orísun ohun tí a ó gbà.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Nínú àyíká tí a ti ń sọ̀rọ̀ nípa ẹrú àti ọ̀gá, “ẹrú” pa ipò ìdè ẹni náà àti ìyàtọ̀ rẹ̀ sí ẹni òmìnira mọ́.
- source_word: ἐλεύθερος
  choice: ẹni òmìnira
  rationale: Ó ń tọ́ka sí ẹni tí kò sí ní ipò ẹrú. “Ẹni òmìnira” ṣe ìyàtọ̀ náà kedere ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa tú δοῦλος nínú àyíká ìlànà ilé
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ìyàtọ̀ tààrà láàárín δοῦλος àti ἐλεύθερος mú kí ipò ẹrú àti òmìnira jẹ́ kókó; “ẹrú” kò dín òtítọ́ ìtàn àti àwùjọ náà kù.
- issue: Ẹni tí κύριος ń tọ́ka sí àti bí a ṣe túmọ̀ rẹ̀
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká náà sọ̀rọ̀ nípa àwọn ọ̀gá ènìyàn, Olúwa ni orísun ìdáhùn ní gbólóhùn yìí. “Olúwa” pa ìtumọ̀ ẹ̀sìn àti ìtọ́kasí tí ó ṣeé ṣe sí Kristi mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó níyì, tó sì ṣeé lóye. “Ní mímọ̀ pé” mọ̀ọ́mọ̀ pa ìrísí participle àti ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ẹsẹ̀ tó ṣáájú; “yálà … tàbí …” jẹ́ ìtumọ̀ àdánidá fún ìfiwéra εἴτε … εἴτε.
