source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: yo
  text: Nínú ẹni náà ni a ní ìgboyà àti ààyè láti súnmọ́ Ọlọ́run pẹ̀lú ìgbẹ́kẹ̀lé, nípasẹ̀ ìgbàgbọ́ nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìdúróṣinṣin rẹ̀.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́ nínú Kristi tàbí ìdúróṣinṣin Kristi fúnra rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ akọ, ó sì tọ́ka sí Kristi nínú àyíká ọ̀rọ̀; yíyan ‘Nínú ẹni tí’ pa ìtumọ̀ ìṣọ̀kan pẹ̀lú Kristi mọ́.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Ó túmọ̀ sí òmìnira láti sọ̀rọ̀ tàbí láti hùwà ní gbangba láìbẹ̀rù; ‘ìgboyà’ jẹ́ èdè Yorùbá àdánidá, ó sì yàtọ̀ sí πεποίθησις.
- source_word: προσαγωγὴν
  choice: ọ̀nà láti wọlé tọ Ọlọ́run lọ
  rationale: Nínú lílo Pọ́ọ̀lù, ọ̀rọ̀ náà ń tọ́ka sí àǹfààní tàbí ọ̀nà láti dé iwájú Ọlọ́run. Ìtumọ̀ yìí jẹ́ kedere fún òǹkàwé Yorùbá, bó tilẹ̀ jẹ́ pé a fi ‘Ọlọ́run’ hàn gbangba láti inú àyíká ọ̀rọ̀.
- source_word: ἐν πεποιθήσει
  choice: pẹ̀lú ìgbẹ́kẹ̀lé
  rationale: ‘Pẹ̀lú ìgbẹ́kẹ̀lé’ sọ ọ̀nà tí a fi ń wọlé, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí ‘ìgboyà.’
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: nípasẹ̀ ìgbàgbọ́ nínú rẹ̀
  rationale: A ka αὐτοῦ gẹ́gẹ́ bí ohun tí ìgbàgbọ́ dojú kọ nínú àkọ́kọ́ ọ̀rọ̀, ṣùgbọ́n Gíríìkì tún lè túmọ̀ sí ‘nípasẹ̀ ìṣòtítọ́ rẹ̀’; àlàyé ìsàlẹ̀ pa àìdánilójú gidi yìí mọ́.
theological_decisions:
- issue: Ìtumọ̀ διὰ τῆς πίστεως αὐτοῦ
  choice: nípasẹ̀ ìgbàgbọ́ nínú rẹ̀
  alternative: nípasẹ̀ ìṣòtítọ́ rẹ̀
  rationale: Àkópọ̀ πίστις àti αὐτοῦ lè tọ́ka sí ìgbàgbọ́ tí àwọn onígbàgbọ́ ní nínú Kristi tàbí sí ìṣòtítọ́ Kristi fúnra rẹ̀. Àkọ́kọ́ ọ̀rọ̀ yan ìtumọ̀ tí ó wọ́pọ̀ nítorí ẹsẹ náà ń sọ nípa bí àwa ṣe ń wọlé, ṣùgbọ́n àlàyé ìsàlẹ̀ kò jẹ́ kí ìtumọ̀ kejì sọnù.
- issue: Ẹni tí προσαγωγή ń mú wa tọ̀
  choice: tọ Ọlọ́run lọ
  alternative: ọ̀nà láti wọlé
  rationale: Ọlọ́run ni ẹni tí àyíká ọ̀rọ̀ fi hàn pé a ń wọlé tọ̀; fífi orúkọ rẹ̀ hàn mú Yorùbá ṣe kedere láìyí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ padà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. ‘Ọ̀nà láti wọlé tọ Ọlọ́run lọ’ tú àwòrán προσαγωγή sí èdè tí ó yé gbogbo ènìyàn; ‘ìgboyà’ àti ‘ìgbẹ́kẹ̀lé’ ni a yà sọ́tọ̀ kí àwọn ọ̀rọ̀ Gíríìkì méjèèjì má bà a dàpọ̀.
