    rationale: Àkọsílẹ̀ ìsàlẹ̀ yẹ kí ó fi yíyàn gidi hàn. ‘Gẹ́gẹ́ bí ìṣípayá’ ni àṣàyàn tó bá ‘according to revelation’ mu.
