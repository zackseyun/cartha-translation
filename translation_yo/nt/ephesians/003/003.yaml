  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń mú ìtànilẹ́yìn Gíríìkì náà dáadáa: ìṣípayá ni ọ̀nà tí a gbà mú ohun ìjìnlẹ̀ náà di mímọ̀ fún Pọ́ọ̀lù, ó sì tọ́ka sí ohun tí ó ti kọ ní ṣókí ṣáájú. Síbẹ̀, ìkọ́lé ‘nípasẹ̀ ìṣípayá ni a fi sọ’ jẹ́ ìtẹnumọ́ tí kò wúlò nínú Yorùbá nínú àyíká yìí; títẹ̀lé ọ̀nà náà lẹ́yìn ọ̀rọ̀-ìṣe mú un rọrùn sí i, láì yí ìtumọ̀ κατά padà.'
  naturalness: ‘A sọ ohun ìjìnlẹ̀ náà di mímọ̀ fún mi nípasẹ̀ ìṣípayá’ jẹ́ Yorùbá boṣewa, ó sì pa ìṣe aláìlẹ́ni Gíríìkì mọ́ nípasẹ̀ ‘a’ aláìdárúkọ. ‘Mo ti kọ tẹ́lẹ̀ ní ṣókí’ tún ṣe kedere pé ṣíṣókí ni ó ń ṣàpèjúwe ìkọ̀wé náà.
  terminology: ‘Ìṣípayá’ yẹ fún ἀποκάλυψις, ‘ohun ìjìnlẹ̀ náà’ sì yẹ fún μυστήριον nínú ọ̀rọ̀ Pọ́ọ̀lù; kò sọ ohun ìjìnlẹ̀ náà di àṣírí lasan, bẹ́ẹ̀ ni kò fi àlàyé ẹ̀kọ́ ìsìn kún ẹsẹ náà. Àmì ìsàlẹ̀ a gbọdọ̀ má tún ìtumọ̀ àkọ́kọ́ ‘nípasẹ̀ ìṣípayá’ sọ gẹ́gẹ́ bí àṣàyàn míì.
  issues:
