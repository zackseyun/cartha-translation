  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: yo
  text: pé a sọ ohun ìjìnlẹ̀ náà di mímọ̀ fún mi nípasẹ̀ ìṣípayá[a], gẹ́gẹ́ bí mo ti kọ tẹ́lẹ̀ ní ṣókí[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ìṣípayá.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní kúkúrú” tàbí “ní ọ̀rọ̀ díẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: nípasẹ̀ ìṣípayá
  rationale: Ó sọ ọ̀nà tí a gbà mú ohun náà di mímọ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá. Àkọsílẹ̀ ìsàlẹ̀ fi àwọn ìtumọ̀ míì tí κατά lè ní sílẹ̀.
- source_word: ἐγνωρίσθη μοι
  choice: a fi sọ ... di mímọ̀ fún mi
  rationale: Èyí pa ìṣe aláìlẹ́ni tí Gíríìkì mọ́, láì sọ ẹni tó ṣe é ní tààràtà. Kò tún lo ọ̀rọ̀ ìṣípayá lẹ́ẹ̀kejì láìnídìí.
- source_word: τὸ μυστήριον
  choice: ohun ìjìnlẹ̀ náà
  rationale: Nínú ọ̀rọ̀ Pọ́ọ̀lù, ó ń tọ́ka sí ète Ọlọ́run tí ó ti fara sin ṣùgbọ́n tí a sọ di mímọ̀. ‘Ohun ìjìnlẹ̀’ pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì fi àlàyé ọ̀rọ̀ tó yí i ká kún ẹsẹ náà.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí Pọ́ọ̀lù sọ pé òun ti kọ tẹ́lẹ̀, ó sì jẹ́ ìfiwéra tó ṣe kedere.
- source_word: προέγραψα
  choice: mo ti kọ ... tẹ́lẹ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí ohun tí Pọ́ọ̀lù ti kọ ṣáájú, ó ṣeé ṣe kó jẹ́ ní apá ìṣáájú lẹ́tà náà.
- source_word: ἐν ὀλίγῳ
  choice: ní ṣókí
  rationale: Ó jẹ́ ìtumọ̀ àdánidá fún ọ̀rọ̀ tí a kọ ní kúkúrú tàbí ní ọ̀rọ̀ díẹ̀.
theological_decisions:
- issue: Ìtumọ̀ μυστήριον nínú ìlò Pọ́ọ̀lù
  choice: ohun ìjìnlẹ̀ náà
  alternative: àṣírí náà; ète Ọlọ́run tó fara sin
  rationale: Ẹsẹ yìí dárúkọ ohun náà ṣùgbọ́n kò tíì ṣàlàyé gbogbo ohun tó wà nínú rẹ̀. ‘Ohun ìjìnlẹ̀’ jẹ́ kí àyíká ọ̀rọ̀ ṣàlàyé rẹ̀, láì sọ ọ́ di àṣírí lasan tàbí fi àlàyé tí kò sí nínú ẹsẹ náà kún un.
- issue: Ẹni tó mú ohun ìjìnlẹ̀ náà di mímọ̀
  choice: 'Pa ìṣe aláìlẹ́ni mọ́: ‘a fi sọ ... di mímọ̀ fún mi’'
  alternative: Ọlọ́run sọ ... di mímọ̀ fún mi
  rationale: Àyíká fi hàn pé ìṣípayá náà ti ọ̀dọ̀ Ọlọ́run wá, ṣùgbọ́n Gíríìkì kò dárúkọ olùṣe nínú gbólóhùn yìí. Ìtumọ̀ náà kò fi olùṣe kún ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A pa ‘pé’ mọ́ ní ìbẹ̀rẹ̀ nítorí ẹsẹ náà ń bá ìṣètò gbólóhùn ẹsẹ tó ṣáájú lọ.
