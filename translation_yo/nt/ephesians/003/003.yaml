    rationale: Ó jẹ́ ìkọ́lé ìtẹnumọ́ tí ó lè dá ìṣàn gbolohun dúró. Gíríìkì kò béèrè fún ìtẹnumọ́ yìí; fífi ‘nípasẹ̀ ìṣípayá’ lẹ́yìn ọ̀rọ̀-ìṣe dáadáa ń pa ìtumọ̀ mọ́.
