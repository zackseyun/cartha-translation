source:
  edition: SBLGNT
  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: yo
  text: pé àwọn tí kì í ṣe Júù[a] jẹ́ alábàá-jogún, ọmọ ẹgbẹ́ ara kan náà[b], àti alábàá-pín nínú ìlérí náà nínú Mèsáyà Jésù[c], nípasẹ̀ ìhìn rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka ní pàtó sí àwọn ènìyàn tí kì í ṣe Júù, tí a fi kún Ísírẹ́lì nínú ìlérí ìgbàlà Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ọmọ ẹgbẹ́ ara kan náà.”
    reason: literal_rendering
  - marker: c
    text: Ìtumọ̀ ìbílẹ̀ ni, “nínú Kristi Jésù.” Ọ̀rọ̀ Gíríìkì Χριστός níhìn-ín jẹ́ oyè “Mèsáyà.”
    reason: alternative_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: àwọn tí kì í ṣe Júù
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìṣèlú. Ìtumọ̀ yìí ṣe kedere, ó sì yẹ fún Yorùbá òde òní.
- source_word: συγκληρονόμα
  choice: ajùmọ̀jogún
  rationale: Ọ̀rọ̀ náà fi hàn pé wọ́n jọ ní ẹ̀tọ́ sí ogún kan náà; “ajùmọ̀jogún” pa agbára àfikún σύν mọ́ ní ṣókí.
- source_word: σύσσωμα
  choice: ẹ̀yà ara kan náà
  rationale: Ọ̀rọ̀ Gíríìkì aláìlẹ́gbẹ́ yìí túmọ̀ sí pé a ti so wọ́n pọ̀ sínú ara kan náà. Ìtumọ̀ yìí pa àwòrán ara mọ́ láìfi àlàyé tí ó pọ̀ kún un.
- source_word: συμμέτοχα
  choice: alábápín papọ̀
  rationale: Ó ń sọ nípa kíkópa tàbí pínpín ohun kan papọ̀. “Alábápín papọ̀” mú ìtumọ̀ àjọṣe inú σύν jáde, ó sì bá ìtẹ̀lé àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta mu.
- source_word: τῆς ἐπαγγελίας
  choice: nínú ìlérí náà
  rationale: Ẹni tí συμμέτοχα ń ṣàpèjúwe jẹ́ alábápín nínú ìlérí náà. Ẹyọ ọ̀rọ̀ “ìlérí” àti àmì ìdámọ̀ “náà” ṣe àfihàn fọ́ọ̀mù Gíríìkì.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jesu
  rationale: Χριστός ṣì ní agbára oyè ẹni tí Ọlọ́run yàn nínú àyíká ìtàn ìgbàlà yìí; “Mèsáyà” pa agbára oyè náà mọ́ dípò kí ó dà bí orúkọ lásán.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: nípasẹ̀ ìhìn rere
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ onífẹ̀ẹ́hónú fi ọ̀nà tàbí ohun èlò hàn. “Nípasẹ̀ ìhìn rere” sọ ọ̀nà tí wọ́n fi ń kópa nínú ìlérí náà ní kedere.
- source_word: εἶναι
  choice: pé ... jẹ́
  rationale: Ọ̀rọ̀-ìṣe aláìlópin yìí ń ṣàlàyé ohun tí àṣírí inú ẹsẹ tó ṣáájú jẹ́. “Pé ... jẹ́” so ẹsẹ náà mọ́ àyíká rẹ̀ lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: 'Bí a ó ṣe túmọ̀ Χριστῷ: oyè tàbí fọ́ọ̀mù tó dà bí orúkọ'
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: Àyíká náà ń sọ nípa ìmúṣẹ ìlérí Ọlọ́run àti fífi àwọn tí kì í ṣe Júù kún un; nítorí náà, agbára oyè “Mèsáyà” ṣì wà níhìn-ín.
- issue: Àwọn tí τὰ ἔθνη ń tọ́ka sí
  choice: àwọn tí kì í ṣe Júù
  alternative: àwọn orílẹ̀-èdè; àwọn Kèfèrí
  rationale: Ìtumọ̀ tí a yàn mú ìyàtọ̀ Júù àti aláìjẹ́-Júù inú àyíká náà jáde láìfi èrò ẹ̀sìn òde òní tí “Kèfèrí” lè ru kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. Ìtẹ̀lé ọ̀rọ̀ mẹ́ta—ajùmọ̀jogún, ẹ̀yà ara kan náà, àti alábápín papọ̀—ń gbìyànjú láti pa ìṣọ̀kan àwọn ọ̀rọ̀ Gíríìkì mẹ́ta tí ó bẹ̀rẹ̀ pẹ̀lú σύν mọ́, bí ó tilẹ̀ jẹ́ pé àṣà èdè Yorùbá kò jẹ́ kí gbogbo wọn ní fọ́ọ̀mù kan náà pátápátá.
