  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: yo
  text: Èmi, ẹni tí ó kéré jù lọ gan-an láàárín gbogbo àwọn ènìyàn mímọ́[c], ni a fi oore-ọ̀fẹ́ yìí fún—láti kéde ọrọ̀ Mèsáyà[a] tí a kò lè ṣe àwárí rẹ̀ tán fún àwọn tí kì í ṣe Júù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” A lè túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” tàbí “Kristi”; níhìn-ín a túmọ̀ rẹ̀ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
  - marker: b
    text: Tàbí “àwọn orílẹ̀-èdè.” Ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù lọ pé Pọ́ọ̀lù ń sọ nípa àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: c
    text: 'Ìtumọ̀ ìbílẹ̀: “ẹni tí ó kéré ju ẹni tí ó kéré jù lọ láàárín gbogbo àwọn ènìyàn mímọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: ẹni tí ó kéré jù lọ gan-an
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀nà àsọdùn tí Pọ́ọ̀lù fi ń sọ ara rẹ̀ di ẹni kékeré jù lọ. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtẹnumọ́ náà mọ́ láìdi ọ̀rọ̀ rú.
- source_word: ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Nínú àwọn lẹ́tà Pọ́ọ̀lù, ó ń tọ́ka sí àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn ènìyàn tí Ọlọ́run yà sọ́tọ̀ fún ara rẹ̀.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ó pa ìtumọ̀ ojúrere Ọlọ́run mọ́, pẹ̀lú iṣẹ́ ìránṣẹ́ tí a fi fún Pọ́ọ̀lù nípasẹ̀ ojúrere náà.
- source_word: ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka pàápàá sí àwọn ènìyàn tí kì í ṣe Júù, kì í ṣe sí àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìjọba.
- source_word: εὐαγγελίσασθαι
  choice: láti kéde
  rationale: Ó sọ iṣẹ́ Pọ́ọ̀lù gẹ́gẹ́ bí pípolongo ìhìn rere; ohun tí ó tẹ̀ lé e mú kí ìtumọ̀ ìhìn rere náà hàn gbangba.
- source_word: ἀνεξιχνίαστον
  choice: tí a kò lè ṣe àwárí rẹ̀ tán
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a kò lè tọpasẹ̀ tàbí lóye dé òpin. Ìtumọ̀ yìí pa àwòrán àwárí inú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: πλοῦτος
  choice: ọrọ̀
  rationale: Níhìn-ín, ọrọ̀ jẹ́ àkójọpọ̀ ọ̀pọ̀lọpọ̀ ohun rere tí ó wà nínú Mèsáyà, kì í ṣe owó tàbí dúkìá lásán.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró; Mèsáyà ń túmọ̀ oyè náà dípò kí ó sọ ọ́ di orúkọ lásán.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Mèsáyà mú ìtumọ̀ oyè ẹni àmì òróró jáde, láìfi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà; àṣàyàn tí ó wọ́pọ̀, Kristi, wà nínú àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ oore-ọ̀fẹ́ àti iṣẹ́ ìránṣẹ́
  choice: A pa χάρις mọ́ gẹ́gẹ́ bí “oore-ọ̀fẹ́,” iṣẹ́ ìkéde sì tẹ̀ lé e gẹ́gẹ́ bí àfojúsùn ẹ̀bùn náà
  alternative: Kí a túmọ̀ χάρις ní tààrà sí “ẹ̀bùn iṣẹ́ ìránṣẹ́”
  rationale: Gíríìkì gba ìtumọ̀ ojúrere àti iṣẹ́ tí ojúrere náà yọrí sí láyè; ìtumọ̀ yìí kò dín ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà kù.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà tẹ̀ lé ìṣètò Gíríìkì níwọ̀n tí Yorùbá àdánidá gbà, ó sì pa àsọdùn Pọ́ọ̀lù àti àwòrán ohun tí a kò lè ṣàwárí dé òpin mọ́.
