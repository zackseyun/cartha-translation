  to: Èmi, ẹni tí ó kéré jù lọ gan-an láàárín gbogbo àwọn ènìyàn mímọ́[c], ni a fi oore-ọ̀fẹ́ yìí fún—láti kéde ọrọ̀ Mèsáyà[a] tí a kò lè ṣe àwárí rẹ̀ tán fún àwọn tí kì í ṣe Júù[b].
  rationale: 'A ṣàtúnṣe ìpò ohun èlò ìkéde kí ó tẹ̀ lé gírámà Gíríìkì: Pọ́ọ̀lù ni a fún ní oore-ọ̀fẹ́ láti kéde ọrọ̀ Mèsáyà tí a kò lè ṣàwárí dé òpin fún àwọn tí kì í ṣe Júù. A yí “Kèfèrí” padà sí ìsọ̀rọ̀ tí ó ní ìtumọ̀ pàtó nínú àyíká Júù/ti kì í ṣe Júù, láìfi ìdájọ́ ẹ̀sìn kún un. A tún lo “àwọn ènìyàn mímọ́” fún ìsọ̀rọ̀ Yorùbá tó ṣe kedere.'
