id: EPH.3.18
reference: Ephesians 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: yo
  text: kí ẹ̀yin lè ní agbára tó láti lóye, pẹ̀lú gbogbo àwọn ènìyàn mímọ́, ohun tí ìbú àti gígùn àti gíga àti ìjìnlẹ̀[a] jẹ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èdè Gíríìkì kò sọ ohun tí ìbú, gígùn, gíga àti ìjìnlẹ̀ wọ̀nyí jẹ́ tiẹ̀; ọ̀pọ̀ ènìyàn ló lóye pé ẹsẹ tó tẹ̀ lé parí èrò náà nípa ìfẹ́ Mèsáyà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí
  rationale: Ó mú gbólóhùn ète tàbí àbájáde àdúrà tó ṣáájú wọlé lọ́nà àdánidá ní Yorùbá.
- source_word: ἐξισχύσητε
  choice: ẹ̀yin lè ní agbára tó láti
  rationale: Ó pa èrò níní agbára tàbí ìjáfáfá tó pé fún ohun tó tẹ̀ lé mọ́.
- source_word: καταλαβέσθαι
  choice: lóye
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí mímú òtítọ́ kan yé ni kíkún; ‘lóye’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìforúkọsílẹ̀ ọlọ́wọ̀ mu.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: pẹ̀lú gbogbo àwọn ènìyàn mímọ́
  rationale: ‘Pẹ̀lú’ fi ìkópa papọ̀ hàn, ‘àwọn ènìyàn mímọ́’ sì jẹ́ ọ̀nà tó ṣe kedere láti tọ́ka sí àwọn onígbàgbọ́ tí a yà sí mímọ́.
- source_word: τί
  choice: ohun tí ... jẹ́
  rationale: Ìṣètò yìí parí ìbéèrè aláìṣe-taara náà ní Yorùbá láìfi ‘bí ó ti tóbi tó’ kún un.
- source_word: τὸ πλάτος
  choice: ìbú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún breadth tàbí width.
- source_word: μῆκος
  choice: gígùn
  rationale: Ọ̀rọ̀ ìwọ̀n tó ṣe tààrà fún length.
- source_word: ὕψος
  choice: gíga
  rationale: Ọ̀rọ̀ ìwọ̀n tó ṣe tààrà fún height.
- source_word: βάθος
  choice: ìjìnlẹ̀
  rationale: Ó túmọ̀ depth lọ́nà àdánidá, ó sì lè gbé ìtumọ̀ ìwọ̀n àti ti àpèjúwe.
theological_decisions:
- issue: Ohun tí àwọn ìwọ̀n mẹ́rin náà ń ṣàpèjúwe
  choice: A kò sọ ohun tí ìbú, gígùn, gíga àti ìjìnlẹ̀ jẹ́ tiẹ̀ ní pàtó nínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a sọ pé wọ́n jẹ́ ìwọ̀n ìfẹ́ Mèsáyà, ètò ìgbàlà Ọlọ́run, tàbí ẹ̀kúnrẹ́rẹ́ Ọlọ́run.
  rationale: Gíríìkì ẹsẹ yìí kò sọ ohun tí àwọn ìwọ̀n náà jẹ́ tiẹ̀. Fífi ‘ìfẹ́ Mèsáyà’ sínú ẹsẹ yìí yóò mú ọ̀rọ̀ ẹsẹ tó tẹ̀ lé wá síbí, yóò sì yanjú ohun tí orísun fi sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọlọ́wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ̀yin’ láti fi ọ̀pọ̀ ènìyàn tí ọ̀rọ̀ náà ń bá sọ hàn. Kò sí àlàyé ẹ̀sìn ẹlẹ́gbẹ́ kan tí a fi kún un.
