source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: yo
  text: kí Mèsáyà[a] lè máa gbé nínú ọkàn yín nípasẹ̀ ìgbàgbọ́[b], kí ẹ sì jẹ́ ẹni tí ó ti ta gbòǹgbò, tí ó sì ti fìdí múlẹ̀ nínú ìfẹ́[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè ẹni tí a fi àmì òróró yàn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nípasẹ̀ ìgbẹ́kẹ̀lé.” Ọ̀rọ̀ Gíríìkì πίστις lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́; “ìgbàgbọ́” ló bá àyíká yìí mu jù.
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe jù pé “nínú ìfẹ́” so mọ́ “tí ẹ ti ta gbòǹgbò, tí ẹ sì ti fìdí múlẹ̀”; àwọn kan sì so ó mọ́ gbígbé Mèsáyà nínú ọkàn wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: lè máa gbé
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí gbígbé tí ó dúró ṣinṣin, kì í ṣe wíwà fún ìgbà díẹ̀; ‘lè’ tún fi ìbáṣepọ̀ rẹ̀ pẹ̀lú àdúrà inú gbólóhùn tó ṣáájú hàn.
- source_word: τὸν Χριστόν
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn tí ó sì fi àmì òróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò kí a ṣe é bí orúkọ lásán.
- source_word: διὰ τῆς πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Ní àyíká yìí πίστις ń tọ́ka sí ìgbàgbọ́ gẹ́gẹ́ bí ọ̀nà tí Mèsáyà fi ń gbé inú wọn; ‘ìgbẹ́kẹ̀lé’ ṣeé ṣe ní ti ìtumọ̀ ọ̀rọ̀, ṣùgbọ́n ‘ìgbàgbọ́’ bá àyíká mu jù.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nínú ọkàn yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ nípa inú ènìyàn, kì í ṣe ìmọ̀lára nìkan.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: A so gbólóhùn àsọtẹ́lẹ̀ yìí mọ́ àwọn àkàwé méjèèjì tó tẹ̀ lé e, bí ààyè tàbí ipò tí gbòǹgbò àti ìpìlẹ̀ wọn wà.
- source_word: ἐρριζωμένοι
  choice: tí ẹ ti ta gbòǹgbò
  rationale: Àkàwé ohun ọ̀gbìn yìí fi ipò tí ó ń bá a lọ lẹ́yìn ìṣe tí ó ti ṣẹlẹ̀ hàn; ‘ti ta gbòǹgbò’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: τεθεμελιωμένοι
  choice: tí ẹ sì ti fìdí múlẹ̀
  rationale: Èyí pa àkàwé ìpìlẹ̀ ilé àti ipò tí ó fẹsẹ̀ múlẹ̀ mọ́, bó tilẹ̀ jẹ́ pé Yorùbá sọ ọ́ lọ́nà àdánidá ju fífi ìṣe aláìṣe hàn ní tààràtà.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: A mú oyè náà jáde ní ìtumọ̀ rẹ̀ láì sọ ọ́ di orúkọ lásán; ‘Kristi’ jẹ́ àṣàyàn tí ó wọ́pọ̀ nínú èdè ìjọ.
- issue: Ìtumọ̀ πίστις nínú διὰ τῆς πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  alternative: nípasẹ̀ ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ tó bá àyíká yìí mu jù, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ ìgbẹ́kẹ̀lé.
- issue: Ibi tí ἐν ἀγάπῃ so mọ́
  choice: a so ó mọ́ ‘tí ẹ ti ta gbòǹgbò, tí ẹ sì ti fìdí múlẹ̀’
  alternative: a lè so ó mọ́ ‘máa gbé nínú ọkàn yín’
  rationale: Ìṣàn ọ̀rọ̀ àti àwọn àkàwé tó tẹ̀ lé e mú kí ìfẹ́ dà bí ilẹ̀ àti ìpìlẹ̀ tí àwọn onígbàgbọ́ dúró sínú rẹ̀, ṣùgbọ́n gírámà kò mú àṣàyàn kejì kúrò pátápátá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Máa gbé’ fi ìtumọ̀ ibùgbé tí ó ń bá a lọ hàn; ‘ta gbòǹgbò’ àti ‘fìdí múlẹ̀’ pa àkàwé iṣẹ́ ọ̀gbìn àti ti ìkọ́lé mọ́. Gbólóhùn náà ń bá àdúrà ẹsẹ tó ṣáájú lọ, nítorí náà a bẹ̀rẹ̀ rẹ̀ pẹ̀lú ‘kí’.
