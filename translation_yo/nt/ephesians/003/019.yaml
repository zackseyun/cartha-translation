id: EPH.3.19
reference: Ephesians 3:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: yo
  text: kí ẹ sì mọ̀ ìfẹ́ Mèsáyà[a] tí ó kọjá ìmọ̀, kí a lè kún yín dé gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “ìfẹ́ Kristi.”
    reason: alternative_reading
  - marker: b
    text: Àbí, “kí a fi gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run kún yín.” Gíríìkì sọ ní tààrà pé, “kí a kún yín dé gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run,” gbólóhùn kúkúrú tí ó lè tẹnu mọ́ ìlọsíwájú dé ìwọ̀n kíkún ti ẹ̀kúnrẹ́rẹ́ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: mọ̀
  rationale: Ó túmọ̀ γινώσκω ní tààrà, ó sì lè ní ìtumọ̀ ìmọ̀ inú àti ìrírí, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń béèrè.
- source_word: τε
  choice: sì
  rationale: ‘Sì’ so ẹ̀bẹ̀ yìí mọ́ àwọn ẹ̀bẹ̀ tó ṣáájú rẹ̀ lọ́nà àdánidá nínú Yorùbá.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: tí ó kọjá ìmọ̀
  rationale: Gbólóhùn aláṣe yìí mú ìtumọ̀ pé ìfẹ́ náà ré kọjá ohun tí a lè mọ̀, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ láàárín ‘mọ̀’ àti ‘ìmọ̀.’
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: ìfẹ́ Mèsáyà
  rationale: ‘Ìfẹ́’ ni ìtumọ̀ àdánidá fún ἀγάπη; ‘Mèsáyà’ sì fi Χριστός hàn gẹ́gẹ́ bí oyè. Ìṣètò ọ̀rọ̀ náà kò pinnu ní gbangba bóyá ìfẹ́ Mèsáyà sí àwọn onígbàgbọ́ ni tàbí ìfẹ́ sí Mèsáyà.
- source_word: ἵνα πληρωθῆτε
  choice: kí ẹ lè kún
  rationale: Ó pa agbára ète/àbájáde ἵνα àti ìtumọ̀ passive πληρωθῆτε mọ́ ní Yorùbá tó rọrùn.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: dé gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run
  rationale: ‘Dé’ pa ìdarí sí ibi àfojúsùn tí εἰς ní mọ́, dípò yíyí rẹ̀ padà sí ‘pẹ̀lú’ nìkan; ‘gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run’ sì tẹ̀ lé gbólóhùn Gíríìkì láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni àmì òróró; ‘Mèsáyà’ fi ìtumọ̀ oyè náà hàn. Àṣàyàn ìbílẹ̀ wà nínú àlàyé ìsàlẹ̀.
- issue: Irú ìfẹ́ tí ἀγάπην τοῦ Χριστοῦ ń tọ́ka sí
  choice: ìfẹ́ Mèsáyà
  alternative: ìfẹ́ tí Mèsáyà ní sí wa; ìfẹ́ wa sí Mèsáyà
  rationale: Genitive Gíríìkì lè gba ìtumọ̀ ju ọ̀kan lọ. Bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tẹ̀ sí ìfẹ́ Mèsáyà sí àwọn onígbàgbọ́, a kò yanju ohun tí ọ̀rọ̀ náà kò sọ ní gbangba.
- issue: Ìtumọ̀ εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: kún dé gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run
  alternative: kí a fi gbogbo ẹ̀kúnrẹ́rẹ́ Ọlọ́run kún yín
  rationale: ‘Dé’ pa agbára ìlọsíwájú sí ibi àfojúsùn mọ́, ó sì yẹra fún ṣíṣe εἰς bí ẹni pé ‘pẹ̀lú’ nìkan ni, tàbí fún fífi ìdánimọ̀ metaphysical kan tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘kí ẹ sì mọ̀’ nítorí ẹsẹ yìí ń bá àdúrà inú àwọn ẹsẹ tó ṣáájú lọ.
