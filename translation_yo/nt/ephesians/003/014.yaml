  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: yo
  text: Nítorí ìdí èyí, mo tẹ eékún mi balẹ̀ sí Baba,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Nítorí ìdí èyí
  rationale: Àpólà yìí ń sọ ìdí tàbí ohun tó mú kí ohun tó tẹ̀ lé ṣẹlẹ̀. “Nítorí ìdí èyí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, ó sì so ọ̀rọ̀ náà mọ́ àyíká tó ṣáájú.
- source_word: κάμπτω
  choice: mo tẹ ... ba
  rationale: Ọ̀rọ̀ náà túmọ̀ sí títẹ̀ tàbí fífi ohun kan rọ̀. Pẹ̀lú “eékún mi,” “mo tẹ eékún mi ba” pa àwòrán ìdúró ara inú Gíríìkì mọ́, dípò kíkàn túmọ̀ rẹ̀ sí “mo kúnlẹ̀.”
- source_word: τὰ γόνατά μου
  choice: eékún mi
  rationale: Èyí ni ìtumọ̀ Yorùbá àdánidá fún “my knees,” ó sì pa ìtọ́ka sí ẹ̀yà ara àti ìdúró àdúrà mọ́.
- source_word: πρὸς
  choice: sí ọ̀dọ̀
  rationale: Nínú àyíká àdúrà sí ẹni kan, πρός ń tọ́ka sí ibi tàbí ẹni tí ọ̀rọ̀ náà darí sí. “Sí ọ̀dọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìdarí àdúrà náà hàn láìfi ìtumọ̀ “níwájú” kún un.
- source_word: πατέρα
  choice: Baba
  rationale: Àyíká náà fi hàn pé Ọlọ́run ni Pọ́ọ̀lù ń gbàdúrà sí. “Baba” jẹ́ orúkọ oyè tó bójú mu ní Yorùbá, lẹ́tà ńlá sì ń fi lílò rẹ̀ fún Ọlọ́run hàn.
theological_decisions:
- issue: Bóyá πατέρα yẹ kí a túmọ̀ gẹ́gẹ́ bí orúkọ oyè fún Ọlọ́run
  choice: Baba
  alternative: baba
  rationale: Àyíká àdúrà àti ẹsẹ tó tẹ̀ lé fi hàn pé Ọlọ́run ni ọ̀rọ̀ náà ń tọ́ka sí. “Baba” pa ìtọ́kasí yẹn mọ́ láìfi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti kíkà-rọrùn ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Àwòrán gidi ti títẹ eékún ba ni a pa mọ́ dípò fífi ọ̀rọ̀ ṣókí sí “mo kúnlẹ̀.”
