id: EPH.3.21
reference: Ephesians 3:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: yo
  text: Kí ògo wà fún un nínú ìjọ àti nínú Mèsáyà Jésù[a], ní gbogbo ìran, láéláé àti láéláé. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí “Kristi Jésù.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí ó túmọ̀ sí Mèsáyà, ẹni Ààmì Òróró.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Kí ògo wà fún un
  rationale: Gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe; ọ̀nà yìí fi ìfọkànsìn àti fífi ògo fún Ọlọ́run hàn ní èdè Yorùbá àdúrà láì fi ìtumọ̀ míì kún un.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: nínú ìjọ
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwùjọ àwọn onígbàgbọ́; “nínú” sì pa ìtumọ̀ ἐν àti ìbáramu rẹ̀ pẹ̀lú gbólóhùn tó tẹ̀ lé mọ́.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: àti nínú Mèsáyà Jésù
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, “nínú” sì pa ìṣọ̀kan ìṣètò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: ní gbogbo ìran
  rationale: Ó sọ bí ògo náà ṣe ń bá a lọ ká gbogbo ìran ènìyàn; èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí kò sọ agbára àkókò náà nù.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: títí láéláé àti láéláé
  rationale: Èyí jẹ́ gbólóhùn ìfọkànsìn tó ń fi àkókò aláìlópin hàn; ìtumọ̀ Yorùbá yìí jẹ́ adayébá, ó sì pa ìtẹnumọ́ rẹ̀ mọ́.
- source_word: ἀμήν
  choice: Àmín
  rationale: Ìkọ̀wé Yorùbá tí a mọ̀ sí ìjẹ́rìí ìfọkànsìn àti ìmúlẹ̀ ọ̀rọ̀.
theological_decisions:
- issue: Bóyá kí Χριστῷ jẹ́ oyè tí a túmọ̀ tàbí ọ̀rọ̀ orúkọ tí a kọ ní ìró rẹ̀
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè tó ní ìtumọ̀; “Mèsáyà” mú ìtumọ̀ ẹni àmì òróró náà wá síwájú láì yí ẹni tí a ń tọ́ka sí padà.
- issue: Ìbáṣepọ̀ “nínú ìjọ” àti “nínú Mèsáyà Jésù”
  choice: Pa àwọn méjèèjì mọ́ gẹ́gẹ́ bí gbólóhùn tó jọra
  alternative: Túmọ̀ àkọ́kọ́ sí “láàárín ìjọ”
  rationale: Gíríìkì lo ἐν fún àwọn méjèèjì. Pípa “nínú” mọ́ ní ibì méjèèjì yẹra fún yíyanju bí ògo ṣe wà nínú ìjọ àti nínú Mèsáyà ní ọ̀nà ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti adayébá fún kíkà ní gbangba; a lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Gbólóhùn náà pa ìrísí ìfọkànsìn àti ìbáramu àwọn apá Gíríìkì mọ́.
