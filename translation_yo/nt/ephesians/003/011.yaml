  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: yo
  text: gẹ́gẹ́ bí ète ayérayé tí ó mú ṣẹ nínú Mèsáyà Jésù, Olúwa wa[c][b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ète ti àwọn sáà.” Ní ti gangan, èdè Gíríìkì ní “ète àwọn sáà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nípasẹ̀ Mèsáyà Jésù.” Ọ̀rọ̀ ìṣáájú náà nínú èdè Gíríìkì túmọ̀ sí “nínú,” ṣùgbọ́n ó tún lè ní ìtumọ̀ irinṣẹ́ tàbí ọ̀nà ìmúṣẹ nínú àyíká ọ̀rọ̀ yìí.
    reason: alternative_reading
  - marker: c
    text: Èdè Gíríìkì ní “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níhìn-ín nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: gẹ́gẹ́ bí
  rationale: Ó fi hàn pé ohun tí a sọ bá ète náà mu tàbí pé ó wà ní ìbámu pẹ̀lú rẹ̀.
- source_word: πρόθεσιν
  choice: ète
  rationale: “Ète” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìpinnu tàbí èrò tí a mọ̀ọ́mọ̀ gbé kalẹ̀.
- source_word: τῶν αἰώνων
  choice: ayérayé
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó sọ bí ète náà ṣe kọjá gbogbo ìgbà; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan, “ti àwọn sáà,” pamọ́ fún àyẹ̀wò.
- source_word: ἣν
  choice: tí
  rationale: Ọ̀rọ̀ arọ́pò-asopọ̀ náà tọ́ka padà sí “ète.”
- source_word: ἐποίησεν
  choice: ó mú ṣẹ
  rationale: Pẹ̀lú “ète,” gbolohun yìí sọ pé Ọlọ́run mú ète náà wá sí ìmúṣẹ, kì í ṣe pé ó kàn dá a sílẹ̀.
- source_word: ἐν
  choice: nínú
  rationale: “Nínú” pa ìtumọ̀ àkọ́kọ́ ti ἐν mọ́, láì fi dandan pinnu pé irinṣẹ́ ni ó ń tọ́ka sí.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà àti ìpìlẹ̀ Júù rẹ̀ hàn.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tí ó ṣe déédé fún oyè κύριος nínú Májẹ̀mú Tuntun.
- source_word: ἡμῶν
  choice: wa
  rationale: Ó jẹ́ arọ́pò-orúkọ ohun-ìní tí ó ń ṣe àpèjúwe “Olúwa.”
theological_decisions:
- issue: Ìtumọ̀ τῶν αἰώνων nínú πρόθεσιν τῶν αἰώνων
  choice: ète ayérayé
  alternative: ète ti àwọn sáà
  rationale: “Ète ayérayé” jẹ́ Yorùbá àdánidá tí ó mú agbára àkókò gígùn ti gbolohun náà hàn; àlàyé [a] pa ìtumọ̀ gangan tí ó ní ọ̀pọ̀ “sáà” mọ́.
- issue: Agbára ἐν nínú ἐν τῷ Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  alternative: nípasẹ̀ Mèsáyà Jésù
  rationale: “Nínú” tẹ̀lé ọ̀rọ̀-orísun ní tààrà, ó sì fi àyè sílẹ̀ fún ìtumọ̀ pé Mèsáyà ni ọ̀nà ìmúṣẹ láì fi tipátipá yàn ìtumọ̀ irinṣẹ́.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” fi ìtumọ̀ oyè náà hàn dípò lílo rẹ̀ bí apá kan orúkọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì pa àìdánilójú inú ἐν mọ́. A fi àmì ìdádúró kọ́mà sí òpin nítorí ẹsẹ yìí ń bá gbólóhùn tó bẹ̀rẹ̀ ṣáájú lọ.
