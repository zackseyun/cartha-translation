id: EPH.3.16
reference: Ephesians 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: yo
  text: kí ó lè fún yín, gẹ́gẹ́ bí ọ̀pọ̀lọpọ̀ ọrọ̀ ògo rẹ̀, ní agbára láti jẹ́ kí a mú yín lágbára nípasẹ̀ Ẹ̀mí rẹ̀ nínú ènìyàn inú[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni inú.” Èdè Gíríìkì ní “ènìyàn inú,” ọ̀rọ̀ ẹyọ kan tí ó dúró fún ìwà inú ènìyàn, kì í ṣe ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δῷ ὑμῖν
  choice: kí ó lè fún yín
  rationale: Ó sọ ohun tí Pọ́ọ̀lù ń gbàdúrà fún, ó sì pa ìtumọ̀ ìfẹ́ tàbí ète tí ἵνα àti ọ̀rọ̀-ìṣe oníṣiyèméjì δῷ ní mọ́.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: ní ìbámu pẹ̀lú ọ̀pọ̀ ọrọ̀ ògo rẹ̀
  rationale: ‘Ní ìbámu pẹ̀lú’ fi κατά hàn gẹ́gẹ́ bí òṣùwọ̀n tàbí ìlànà, kì í ṣe pé ó kàn mú díẹ̀ jáde nínú rẹ̀; ‘ọ̀pọ̀ ọrọ̀ ògo’ tún pa àwòrán πλοῦτος àti ìwúwo δόξα mọ́.
- source_word: δυνάμει κραταιωθῆναι
  choice: kí ... fi agbára mú yín lágbára
  rationale: Àkọsílẹ̀ yìí jẹ́ ti Yorùbá àdánidá, ó pa agbára gẹ́gẹ́ bí ohun èlò mọ́, ó sì fi hàn pé àwọn olùgbọ́ ni a ń mú lágbára.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: kí Ẹ̀mí rẹ̀ fi agbára
  rationale: Ìṣètò gbolohun Yorùbá yìí fi Ẹ̀mí rẹ̀ hàn gẹ́gẹ́ bí ọ̀nà tàbí aṣojú tí Ọlọ́run fi ń mú wọn lágbára, bí διά pẹ̀lú genitive ṣe túmọ̀ sí.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: nínú ènìyàn inú[a]
  rationale: Ó pa àwòrán Pọ́ọ̀lù ti ‘ènìyàn inú’ mọ́, ó sì jẹ́ kí nínú ara ẹni, kì í ṣe ara òde, jẹ́ ibi tí agbára náà ń ṣiṣẹ́. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ náà dúró fún gbogbo ènìyàn, kì í ṣe ọkùnrin nìkan.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí rẹ̀, ìyẹn Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí rẹ̀ gẹ́gẹ́ bí agbára Ọlọ́run tí kì í ṣe ẹni
  rationale: Nínú àyíká ọ̀rọ̀ náà àti nínú lílo Pọ́ọ̀lù, Ẹ̀mí Ọlọ́run ni ó ṣeé ṣe jù lọ; lílo lẹ́tà ńlá ń tọ́ka sí ẹni náà láìfi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìtumọ̀ ἔσω ἄνθρωπον
  choice: ènìyàn inú
  alternative: ẹni inú tàbí ìwà inú ẹni
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ẹyọ kan tí ó dúró fún ènìyàn lápapọ̀, kì í ṣe akọ nìkan. A pa àwòrán orísun mọ́, a sì ṣàlàyé ìwọ̀n ìtumọ̀ rẹ̀ nínú àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde tí ó ní ọlá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ènìyàn inú’ láti pa àwòrán orísun mọ́, bí ó tilẹ̀ jẹ́ pé ‘ẹni inú’ lè rọrùn díẹ̀; àkọsílẹ̀ ìsàlẹ̀ ni ó ṣàlàyé rẹ̀. Kọ́mà ìparí fi hàn pé ẹsẹ yìí ń bá gbolohun gígùn láti àwọn ẹsẹ tó ṣáájú àti tó tẹ̀ lé e lọ.
