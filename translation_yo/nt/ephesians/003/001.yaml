  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: yo
  text: Nítorí èyí, èmi Pọ́ọ̀lù, ẹlẹ́wọ̀n Mèsáyà Jésù nítorí yín, ẹ̀yin tí kì í ṣe Júù—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Nítorí èyí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ, ó sì ń fi ìdí ọ̀rọ̀ tó tẹ̀ lé e hàn. “Nítorí èyí” jẹ́ ọ̀nà àdánidá láti sọ inferential discourse marker náà ní Yorùbá.
- source_word: ἐγὼ Παῦλος
  choice: èmi Pọ́ọ̀lù
  rationale: “Èmi” mú ìtẹnumọ́ arọ́pò-orúkọ tó wà nínú Gíríìkì jáde, “Pọ́ọ̀lù” sì dúró gẹ́gẹ́ bí àfikún ìdánimọ̀ ẹni tó ń sọ̀rọ̀.
- source_word: ὁ δέσμιος
  choice: ẹlẹ́wọ̀n
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí a fi sínú ìdè tàbí àtìmọ́lé; “ẹlẹ́wọ̀n” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì yé ni.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jesu
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn, kì í ṣe orúkọ ìdílé Jesu. “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, genitive náà sì jẹ́ kí “ẹlẹ́wọ̀n Mèsáyà Jesu” lè tọ́ka sí jíjẹ́ ti Mèsáyà tàbí jíjẹ́ ẹlẹ́wọ̀n nítorí iṣẹ́ rẹ̀ láì fi ọ̀kan ṣoṣo múlẹ̀.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: Nínú àyíká yìí ὑπέρ lè ní ìtumọ̀ àǹfààní, aṣojú, tàbí ìdí. “Nítorí yín” jẹ́ àdánidá ní Yorùbá, ó sì pa ìfàsẹ́yìn ìtumọ̀ náà mọ́; àlàyé ìsàlẹ̀ fúnni ní ọ̀nà tó túbọ̀ tẹnu mọ́ àǹfààní wọn.
- source_word: τῶν ἐθνῶν
  choice: ẹ̀yin tí ẹ kì í ṣe Júù
  rationale: Nínú lílo Pọ́ọ̀lù níbí, ἔθνη ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Gbólóhùn yìí ṣe kedere, ó sì yẹra fún ìtumọ̀ òde òní tó lè jẹ́ ẹ̀gàn nínú “Kèfèrí.”
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ gẹ́gẹ́ bí oyè tàbí bí orúkọ tí kò ní ìtumọ̀ pàtó
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: Χριστός níbí jẹ́ oyè Jesu gẹ́gẹ́ bí ẹni àmì òróró; a lo “Mèsáyà” nínú ọ̀rọ̀ pàtàkì, a sì fi “Kristi Jesu” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ àṣà.
- issue: Ìbáṣepọ̀ Pọ́ọ̀lù gẹ́gẹ́ bí ẹlẹ́wọ̀n pẹ̀lú Mèsáyà Jesu
  choice: ẹlẹ́wọ̀n Mèsáyà Jesu
  alternative: ẹlẹ́wọ̀n nítorí Mèsáyà Jesu
  rationale: Genitive τοῦ Χριστοῦ Ἰησοῦ lè sọ ẹni tí ẹlẹ́wọ̀n náà jẹ́ tirẹ̀ tàbí ẹni tí ó jẹ́ ìdí ìwọ̀n rẹ̀. Ìtumọ̀ pàtàkì kò fi ọ̀kan nínú wọn múlẹ̀ ní ọ̀nà tó pa èkejì rẹ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, tó ní àmì ohùn níbi tó yẹ, tí ó sì ṣe kedere fún òǹkàwé òde òní. A pa dásì ìparí mọ́ nítorí ẹsẹ yìí bẹ̀rẹ̀ gbólóhùn kan tí Pọ́ọ̀lù dá dúró, tí ó sì tẹ̀ síwájú ní ẹsẹ tó tẹ̀ lé e.
