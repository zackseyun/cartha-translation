id: EPH.3.10
reference: Ephesians 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: yo
  text: kí a lè fi ọgbọ́n Ọlọ́run onírúurú[a] hàn nísinsin yìí, nípasẹ̀ ìjọ, fún àwọn alákòóso àti àwọn aláṣẹ ní àwọn ibi ọ̀run[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọgbọ́n Ọlọ́run tí ó ní oríṣiríṣi apá.” Ọ̀rọ̀ Gíríìkì náà ń sọ nípa ọgbọ́n tó ní ọ̀pọ̀lọpọ̀ ojú tàbí ìrísí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àwọn agbègbè ọ̀run.”
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe kí “àwọn alákòóso àti àwọn aláṣẹ ní àwọn ibi ọ̀run” tọ́ka sí àwọn agbára ẹ̀mí tàbí ti àgbáyé, kì í ṣe àwọn aláṣẹ ènìyàn nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó ṣe àfihàn ète tàbí àbájáde tí a ń lépa, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: γνωρισθῇ
  choice: kí a lè ... hàn
  rationale: Ìtumọ̀ rẹ̀ ni láti sọ ohun kan di mímọ̀. Ìṣètò aláìdárúkọ yìí jẹ́ àdánidá ní Yorùbá, kò sì sọ ẹni tó ń ṣe iṣẹ́ náà ní pàtó.
- source_word: νῦν
  choice: nísinsin yìí
  rationale: Ó pa ìtumọ̀ àkókò ìsinsin yìí mọ́ ní kedere.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: fún àwọn alákòóso àti àwọn aláṣẹ
  rationale: Àwọn ọ̀rọ̀ méjèèjì pa ìyàtọ̀ tó wà láàárín ìṣàkóso àti àṣẹ mọ́, láì sọ irú àwọn ẹni tàbí agbára wọ̀nyí ní pàtó nínú ọ̀rọ̀ àkọ́kọ́.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ní àwọn agbègbè ọ̀run
  rationale: Ó túmọ̀ gbígbé tàbí wíwà ní ìpínlẹ̀ ọ̀run lọ́nà tí òǹkàwé òde òní lè lóye.
- source_word: διὰ τῆς ἐκκλησίας
  choice: nípasẹ̀ ìjọ
  rationale: Ó pa ìtumọ̀ irinṣẹ́ tàbí ọ̀nà tí διά pẹ̀lú ẹ̀yà genitive ń fi hàn mọ́.
- source_word: ἡ πολυποίκιλος σοφία τοῦ θεοῦ
  choice: ọgbọ́n Ọlọ́run tí ó ní oríṣiríṣi apá
  rationale: Ó fi hàn pé ọgbọ́n náà ní ọ̀pọ̀ ẹ̀ka tàbí ojú, ó sì yẹra fún ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ ẹ̀sìn tí kò ṣe kedere.
theological_decisions:
- issue: Àwọn tí a pè ní ‘àwọn alákòóso àti àwọn aláṣẹ’
  choice: A kò fi ‘ẹ̀mí’ tàbí ‘áńgẹ́lì’ kún ọ̀rọ̀ àkọ́kọ́; àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe kí ó tọ́ka sí àwọn agbára ọ̀run.
  alternative: Àwọn alákòóso ènìyàn nìkan, tàbí àwọn alákòóso ayé àti ọ̀run lápapọ̀.
  rationale: Gbólóhùn ‘ní àwọn agbègbè ọ̀run’ tọ́ka gidigidi sí àwọn agbára tí kì í ṣe ènìyàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò pe irú wọn ní pàtó; nítorí náà a pa àìdánilójú yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A gbé ‘nípasẹ̀ ìjọ’ sí òpin láti mú kí gbólóhùn Yorùbá ṣàn dáadáa, láì yí ipa irinṣẹ́ rẹ̀ padà.
