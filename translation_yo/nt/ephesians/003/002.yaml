  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: yo
  text: Bí lóòótọ́[a] ẹ ti gbọ́ nípa ojúṣe ìríjú[b] oore-ọ̀fẹ́ Ọlọ́run tí a fi fún mi ní ti yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí ẹ bá ti gbọ́ lóòótọ́.” Gíríìkì pa ìrísí ọ̀rọ̀ àdéhùn mọ́, bí ó tilẹ̀ jẹ́ pé, nínú àyíká ọ̀rọ̀, ó ṣeé ṣe kí Pọ́ọ̀lù retí pé ohun náà jẹ́ òótọ́.
    reason: alternative_reading
  - marker: b
    text: A tún lè sọ pé “iṣẹ́ ìṣàkóso” tàbí “iṣẹ́ àṣẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí bíbójútó ohun tí a fi lé ẹni lọ́wọ́ tàbí iṣẹ́ tí a gbé fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: Bí ó bá ṣe pé lóòótọ́
  rationale: Èyí pa ìrísí ọ̀rọ̀ oní条件 mọ́, ó sì fi ìtẹnumọ́ γε hàn; àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ṣeé ṣe kó ń gbà pé ohun tí ó sọ jẹ́ òótọ́, kì í ṣe pé ó ń ṣiyèméjì gidigidi.
- source_word: ἠκούσατε
  choice: ẹ ti gbọ́
  rationale: Aorist náà wo gbígbọ́ náà gẹ́gẹ́ bí ìṣẹ̀lẹ̀ kan; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá, ó sì fi ipa rẹ̀ títí dé àsìkò ọ̀rọ̀ hàn.
- source_word: οἰκονομίαν
  choice: ojúṣe ìríjú
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìṣàkóso ohun tí a fi lé ẹni lọ́wọ́ tàbí iṣẹ́ àṣẹ tí a gbé fún un. “Ojúṣe ìríjú” fi apá méjèèjì—ìgbẹ́kẹ̀lé àti ojúṣe—hàn láì sọ ọ́ di ètò ìgbàlà lásán.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún χάρις nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù, ó sì pa ìtumọ̀ ẹ̀bùn àti ojú rere Ọlọ́run mọ́.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: 'Ìṣọ̀kan “oore-ọ̀fẹ́ Ọlọ́run” fi ìbátan genitive hàn lọ́nà Yorùbá àdánidá: oore-ọ̀fẹ́ náà ti Ọlọ́run ni, ó sì ti ọ̀dọ̀ rẹ̀ wá.'
- source_word: τῆς δοθείσης μοι
  choice: tí a fi fún mi
  rationale: Èyí pa ìṣe aláìlórúkọ passive mọ́, tí ó ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùfún láìfi orúkọ rẹ̀ kún ibi tí Gíríìkì kò ti tún un sọ.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Nínú àyíká yìí, εἰς sọ ìdarí àti àǹfààní iṣẹ́ Pọ́ọ̀lù sí àwọn olùkà hàn; “fún yín” jẹ́ kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí “ojúṣe ìríjú oore-ọ̀fẹ́ Ọlọ́run” ń tọ́ka sí
  choice: Ó tọ́ka sí ojúṣe tí Ọlọ́run fi lé Pọ́ọ̀lù lọ́wọ́ nípa oore-ọ̀fẹ́ rẹ̀ fún àǹfààní àwọn olùkà.
  alternative: Kí a ka a sí ètò tàbí ìṣàkóso ìgbàlà Ọlọ́run ní ìtumọ̀ gbígbòòrò, láìdojú kọ ojúṣe Pọ́ọ̀lù pàtó.
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ń tẹnu mọ́ iṣẹ́ tí a fi lé Pọ́ọ̀lù lọ́wọ́ fún àwọn Kèfèrí. “Ojúṣe ìríjú” pa ìtumọ̀ yìí mọ́ láìkọ ìtumọ̀ ètò Ọlọ́run tó gbòòrò sílẹ̀.
- issue: Agbára εἴ γε
  choice: Ọ̀rọ̀ oní条件 tí Pọ́ọ̀lù retí pé àwọn olùkà á jẹ́rìí sí gẹ́gẹ́ bí òótọ́.
  alternative: Condition gidi pé ó ṣeé ṣe kí wọn kò tíì gbọ́ rárá.
  rationale: A pa “bí” mọ́ nínú ẹsẹ̀ náà láti má ṣe yọ ìrísí Gíríìkì kúrò, ṣùgbọ́n “lóòótọ́” àti àlàyé ìsàlẹ̀ fi agbára àsọtẹ́lẹ̀ rẹ̀ hàn láìparí àríyànjiyàn náà.
- issue: Ohun tí τῆς δοθείσης ń ṣàlàyé
  choice: Ní gírámà Gíríìkì, participle náà bá “oore-ọ̀fẹ́” (χάριτος) mu; ìtumọ̀ náà sì wà nínú ojúṣe ìríjú tí a fi lé Pọ́ọ̀lù lọ́wọ́.
  alternative: Kí a so “tí a fi fún mi” mọ́ “ojúṣe ìríjú” ní tààràtà.
  rationale: Ìbámu genitive feminine singular so participle náà mọ́ χάριτος, kì í ṣe οἰκονομίαν tí ó jẹ́ accusative. Síbẹ̀, àyíká fi oore-ọ̀fẹ́ àti iṣẹ́ àṣẹ Pọ́ọ̀lù ṣọ̀kan pẹ́kípẹ́kí.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye ní òde òní. “Ẹ” jẹ́ ọ̀pọ̀ ènìyàn, “ojúṣe ìríjú” sì ṣàlàyé èrò ìgbẹ́kẹ̀lé dáadáa ju “ìríjú” nìkan lọ. Àwọn àmì ohùn ni a fi sí ibi tí wọ́n ti yẹ.
