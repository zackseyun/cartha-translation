id: EPH.3.20
reference: Ephesians 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: yo
  text: Fún ẹni tí ó lè ṣe ohun tí ó ju gbogbo ohun tí à ń béèrè tàbí tí à ń rò[a] lọ lọ́nà tí ó rékọjá ìwọ̀n[b], ní ìbámu pẹ̀lú agbára tí ń ṣiṣẹ́ nínú wa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a lè ronú fojú inú wò”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tí ọkàn lè lóye tàbí gbèrò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “lọ́nà tí ó pọ̀ gidigidi”; ọ̀rọ̀ Gíríìkì náà tẹnumọ́ gidigidi pé ohun tí ó lè ṣe rékọjá ohun tí a béèrè tàbí rò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Fún ẹni tí ó lè
  rationale: Àpólà alábápín onítumọ̀-orúkọ náà wà nínú ọ̀rọ̀ ìyìn tí yóò parí ní ẹsẹ tó tẹ̀ lé e. ‘Fún ẹni tí ó lè’ pa ìtumọ̀ àti ìṣètò yẹn mọ́ láìfi ‘Ọlọ́run’ kún ẹsẹ yìí níbi tí Gíríìkì kò ti tún orúkọ náà sọ.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: δὲ ń ṣe iṣẹ́ àsopọ̀ àti ìyípadà sí ọ̀rọ̀ ìyìn, kì í ṣe ìtakora líle. Nínú Yorùbá, bíbẹ̀rẹ̀ pẹ̀lú ‘Fún ẹni’ jẹ́ adayeba, ó sì yẹra fún fífi ‘ṣùgbọ́n’ tàbí ‘ǹjẹ́’ tí yóò fi ìtumọ̀ míì kún un.
- source_word: ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ
  choice: ṣe ohun tí ó ju ... lọ ní ọ̀pọ̀lọpọ̀
  rationale: Ọ̀rọ̀ yìí fi ìtẹnumọ́ tó lágbára hàn pé ohun tí ẹni náà lè ṣe rékọjá gbogbo ohun tí a lè béèrè tàbí rò. Àṣàyàn Yorùbá yìí jẹ́ kedere, ó sì pa agbára ọ̀rọ̀ ìpilẹ̀ mọ́.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: gbogbo ohun tí à ń béèrè tàbí tí à ń rò
  rationale: αἰτούμεθα túmọ̀ sí ‘à ń béèrè,’ νοοῦμεν sì tọ́ka sí ohun tí ọkàn lè rò tàbí lóye. ‘À ń rò’ jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò, tó sì yẹ níbí.
- source_word: κατὰ τὴν δύναμιν
  choice: ní ìbámu pẹ̀lú agbára
  rationale: κατά pẹ̀lú ẹ̀sùn-orúkọ tọ́ka sí ìwọ̀n tàbí ohun tí iṣẹ́ náà bá mu, kì í ṣe ohun èlò nìkan. ‘Ní ìbámu pẹ̀lú’ pa ìyàtọ̀ yẹn mọ́.
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: tí ń ṣiṣẹ́ nínú wa
  rationale: Àbápín ìsinsìnyí náà fi agbára tó ń ṣiṣẹ́ lọ́wọ́ hàn. ‘Nínú wa’ jẹ́ ìtumọ̀ tààrà, ó sì lè tọ́ka sí iṣẹ́ inú àwọn onígbàgbọ́ gẹ́gẹ́ bí àwùjọ láìdín ìtumọ̀ náà kù.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ ìyìn náà ń tọ́ka sí
  choice: ‘ẹni tí ó lè,’ láìfi ‘Ọlọ́run’ kún un
  alternative: ‘Ọlọ́run tí ó lè’
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Ọlọ́run ni a ń sọ̀rọ̀ nípa rẹ̀, ṣùgbọ́n ẹsẹ yìí kò tún orúkọ ‘Ọlọ́run’ sọ. Ìtumọ̀ náà pa ìṣètò ọ̀rọ̀ ìpilẹ̀ àti ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ẹsẹ tó tẹ̀ lé e.
- issue: Bí agbára náà ṣe ń ṣiṣẹ́ nínú àwọn onígbàgbọ́
  choice: ‘agbára tí ń ṣiṣẹ́ nínú wa’
  alternative: ‘agbára tí ń ṣiṣẹ́ láàárín wa’
  rationale: ‘Nínú wa’ bá ἐν ἡμῖν mu ní tààrà, ó sì jẹ́ kí ọ̀rọ̀ náà ní gbogbo ìwọ̀n rẹ̀ láìfi ẹ̀kọ́ ẹ̀sìn kan pàtó lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣeé lóye. A pa ẹsẹ náà mọ́ gẹ́gẹ́ bí ìbẹ̀rẹ̀ ọ̀rọ̀ ìyìn tí gbolohun rẹ̀ ń bá a lọ sí ẹsẹ 21; nítorí náà àmì kọ́mà ló parí rẹ̀.
