id: EPH.3.9
reference: Ephesians 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: yo
  text: àti láti mú kí ó hàn gbangba fún gbogbo ènìyàn ohun tí ìṣètò[a] ohun ìjìnlẹ̀ náà jẹ́, èyí tí a ti fi pamọ́ láti ìgbà ayé nínú Ọlọ́run[b], ẹni tí ó dá ohun gbogbo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “iṣẹ́ ìríjú ohun ìjìnlẹ̀ náà” tàbí “ète ohun ìjìnlẹ̀ náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tí a ti fi pamọ́ fún ọ̀pọ̀ sáà ayé” tàbí, ní ìtumọ̀ tí ó túbọ̀ ṣàlàyé, “tí a ti fi pamọ́ láti ayérayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: láti mú kí ó hàn gbangba
  rationale: Èyí pa àwòrán mímú ohun kan wá sí ìmọ́lẹ̀ mọ́ ní ọ̀nà tí ó ṣe àdánidá ní Yorùbá, ó sì bá gbólóhùn ohun tí ó tẹ̀ lé e mu.
- source_word: πάντας
  choice: fún gbogbo ènìyàn
  rationale: Ó fi hàn pé gbogbo ènìyàn ni ìdí tí fífi ọ̀rọ̀ náà hàn gbangba fi wà, dípò kí a ka πάντας sí ohun àìlẹ́mìí.
- source_word: τίς ἡ οἰκονομία
  choice: ohun tí ìṣètò ... jẹ́
  rationale: “Ìṣètò” lè gba ìtumọ̀ bí a ṣe ń ṣàkóso tàbí mú ète kan ṣiṣẹ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí ó wá lẹ́yìn sí ọ̀rọ̀ náà.
- source_word: μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ète Ọlọ́run tí ó ti fara sin ṣùgbọ́n tí a ń fihàn nísinsìnyí; “ohun ìjìnlẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere tí ó sì ní iyì.
- source_word: ἀποκεκρυμμένου
  choice: èyí tí a ti fi pamọ́
  rationale: Ìṣesí àṣepé aláìṣe náà fi ipò tí ó jẹ́ àbájáde fífi ohun náà pamọ́ tẹ́lẹ̀ hàn.
- source_word: ἀπὸ τῶν αἰώνων
  choice: láti àwọn sáà ayé àtijọ́
  rationale: “Sáà ayé” ń ṣàfihàn àwọn àkókò gígùn tàbí àwọn age, nígbà tí “àtijọ́” mú gbólóhùn náà ṣe àdánidá láìsọ ọ́ di “láti ayérayé.”
- source_word: ἐν τῷ θεῷ
  choice: nínú Ọlọ́run
  rationale: Èyí tẹ̀ lé ἐν ní tààrà, ó sì pa ìtumọ̀ pé inú Ọlọ́run ni ohun ìjìnlẹ̀ náà ti fara sin mọ́, kì í ṣe pé ó kàn wà lọ́dọ̀ rẹ̀.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: ẹni tí ó dá ohun gbogbo
  rationale: Gbólóhùn àsọyé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣàpèjúwe Ọlọ́run gẹ́gẹ́ bí Ẹlẹ́dàá ohun gbogbo.
theological_decisions:
- issue: Ìtumọ̀ οἰκονομία ní ìbámu pẹ̀lú ohun ìjìnlẹ̀ náà
  choice: ìṣètò
  alternative: iṣẹ́ ìríjú; ète
  rationale: “Ìṣètò” lè tọ́ka sí bí a ṣe ń mú ohun ìjìnlẹ̀ náà ṣiṣẹ́ tàbí ṣàkóso rẹ̀, láìdín ọ̀rọ̀ náà kù sí kìkì àkóónú ète kan tàbí kó ẹ̀kọ́ ìsìn kan tí ó wá lẹ́yìn wọ inú rẹ̀.
- issue: Agbára àkókò inú ἀπὸ τῶν αἰώνων
  choice: láti àwọn sáà ayé àtijọ́
  alternative: fún ọ̀pọ̀ sáà ayé; láti ayérayé
  rationale: Èdè Gíríìkì dárúkọ àwọn sáà ayé, kì í ṣe ayérayé ní tààrà; ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́ láìsọ ohun tí ẹsẹ náà kò sọ ní kedere.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. “Mú kí ó hàn gbangba” pa àwòrán ìmọ́lẹ̀ mọ́ láìdá bí èdè àjèjì, “ohun ìjìnlẹ̀” sì yẹra fún ọ̀rọ̀ tó lè túmọ̀ sí àṣírí lásán. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá ṣe àdánidá.
