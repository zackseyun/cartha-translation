source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: yo
  text: Nípa kíka èyí, ẹ lè mọ òye mi nípa àṣírí Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì náà Χριστός lè túmọ̀ sí “Mèsáyà” tàbí, gẹ́gẹ́ bí ìlò ìbílẹ̀, “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: Nípa kíka èyí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ kọ, ó sì fi kíka rẹ̀ hàn gẹ́gẹ́ bí ọ̀nà tí àwọn olùgbọ́ yóò gbà lóye. Èyí jẹ́ èdè Yorùbá àdánidá ju títúmọ̀ πρὸς ὃ lọ́rọ̀-lọ́rọ̀ lọ.
- source_word: δύνασθε
  choice: ẹ lè
  rationale: Ó fi agbára tàbí àǹfààní láti ṣe ohun kan hàn; ‘ẹ lè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá nọ́ńbà ọ̀pọ̀ ẹni kejì mu.
- source_word: νοῆσαι τὴν σύνεσίν μου
  choice: mọ ìjìnlẹ̀ òye tí mo ní
  rationale: Gíríìkì náà sọ nípa mímọ̀ tàbí lílóye òye Pọ́ọ̀lù. Yíyẹra fún ‘lóye òye mi’ mú kí gbolohun náà jẹ́ àdánidá, nígbà tí ‘ìjìnlẹ̀ òye’ pa agbára σύνεσις mọ́.
- source_word: ἐν τῷ μυστηρίῳ
  choice: nípa àṣírí
  rationale: Nínú àjọṣe rẹ̀ pẹ̀lú ‘ìjìnlẹ̀ òye,’ ἐν ń tọ́ka sí kókó tàbí ẹ̀ka òye náà. ‘Nípa àṣírí’ jẹ́ Yorùbá àdánidá, ‘àṣírí’ sì pa èrò ohun tí Ọlọ́run ti fi pamọ́ ṣùgbọ́n tó ń ṣí payá mọ́.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè níbí. ‘Mèsáyà’ ń mú ìtumọ̀ ẹni àmì òróró náà jáde, dípò kíkà á bí orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí pé ọ̀rọ̀ náà jẹ́ orúkọ oyè nínú àyíká yìí, ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́. ‘Kristi,’ tí ó jẹ́ ìlò ìbílẹ̀ tí ó wọ́pọ̀, wà nínú àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ genitive nínú τοῦ Χριστοῦ
  choice: àṣírí Mèsáyà
  alternative: àṣírí nípa Mèsáyà
  rationale: Ìsọ̀rọ̀ ‘àṣírí Mèsáyà’ pa àyè ìtumọ̀ Gíríìkì mọ́—ó lè jẹ́ àṣírí tó jẹ mọ́ Mèsáyà tàbí èyí tí ó ní ìbáṣepọ̀ pẹ̀lú rẹ̀—láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ẹ’ ń fi hàn pé àwọn olùkà púpọ̀ ni Pọ́ọ̀lù ń bá sọ̀rọ̀. A tún gbolohun νοῆσαι τὴν σύνεσίν μου ṣe ní ọ̀nà àdánidá láti yẹra fún àtúnwí tí kò dùn létí.
