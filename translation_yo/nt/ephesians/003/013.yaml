  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìmọ̀ Gíríìkì dáadáa ní gbogbogbò: διὸ jẹ́ ìsopọ̀ àbájáde, αἰτοῦμαι jẹ́ ẹ̀bẹ̀ sí àwọn olùgbọ́, μὴ ἐγκακεῖν jẹ́ ìkìlọ̀ kí wọ́n má rẹ̀wẹ̀sì, àti δόξα ὑμῶν ni “ògo yín.” Ṣùgbọ́n “nítorí yín” lè túmọ̀ sí pé àwọn ará Efésù ni wọ́n fa ìpọ́njú náà; “fún yín” dá ìtumọ̀ ὑπὲρ ὑμῶν gẹ́gẹ́ bí àǹfààní wọn dúró kedere. Àlàyé ẹsẹ̀ [b] sì fi ìtúmọ̀ tó fẹ̀ gùn ju ọ̀rọ̀ ìpilẹ̀ lọ.'
  naturalness: “Mo bẹ̀ yín pé kí ẹ má ṣe rẹ̀wẹ̀sì” àti “ìpọ́njú” jẹ́ Yorùbá boṣewa, òde òní, tí ó sì ní ìwọ̀n ọ̀rọ̀ tí ó yẹ. Ríròpo “àwọn náà” pẹ̀lú “àwọn ìpọ́njú wọ̀nyí” jẹ́ kí ìtọ́kasí náà hàn gbangba síi, láì padanu pé arọ́pò-orúkọ ẹyọ kan Gíríìkì ń tọ́ka sí gbogbo gbolohun “àwọn ìpọ́njú mi.”
