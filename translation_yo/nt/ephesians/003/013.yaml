source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: yo
  text: Nítorí náà, mo bẹ̀ yín pé kí ẹ má ṣe rẹ̀wẹ̀sì nítorí àwọn ìpọ́njú mi fún yín[a]; àwọn ìpọ́njú wọ̀nyí ni ògo yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ má ṣe rẹ̀wẹ̀sì nínú àwọn ìpọ́njú mi fún yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọlá yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí ó jáde láti inú ọ̀rọ̀ tí ó ṣáájú hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: αἰτοῦμαι
  choice: mo bẹ̀ yín
  rationale: Ó sọ ẹ̀bẹ̀ Pọ́ọ̀lù àti àwọn tí ó ń bá sọ̀rọ̀ di mímọ̀ láì mú ọ̀rọ̀ náà le jù.
- source_word: μὴ ἐγκακεῖν
  choice: kí ẹ má ṣe rẹ̀wẹ̀sì
  rationale: “Rẹ̀wẹ̀sì” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún pípàdánù ìgboyà tàbí jíjẹ́ kí ìṣòro múni lọ́kàn balẹ̀.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: nítorí àwọn ìpọ́njú mi
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ἐν ń tọ́ka sí ohun tí ó lè fa ìrẹ̀wẹ̀sì; “nítorí” mú ìbáṣepọ̀ yẹn hàn ní Yorùbá àdánidá.
- source_word: θλίψεσίν
  choice: àwọn ìpọ́njú
  rationale: “Ìpọ́njú” pa ìtumọ̀ ìnira, ìtẹ̀sí àti ìjìyà tó wà nínú θλῖψις mọ́.
- source_word: ὑπὲρ ὑμῶν
  choice: nítorí yín
  rationale: Ó sọ pé Pọ́ọ̀lù ń jìyà fún àǹfààní wọn tàbí ní tìtorí iṣẹ́ rẹ̀ láàárín wọn, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἥτις
  choice: àwọn náà
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo arọ́pò-orúkọ ẹyọ kan láti tọ́ka sí gbólóhùn náà gẹ́gẹ́ bí odindi, Yorùbá nílò ìbámu pẹ̀lú “àwọn ìpọ́njú”; “àwọn náà” tún fi ìtọ́kasí náà hàn kedere.
- source_word: δόξα ὑμῶν
  choice: ògo yín
  rationale: “Ògo” pa ìwọ̀n ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ọ̀rọ̀ àsọyé δόξα mọ́, pẹ̀lú àǹfààní ìtumọ̀ ọlá.
theological_decisions:
- issue: Ohun tí gbólóhùn ἥτις ἐστὶν δόξα ὑμῶν ń tọ́ka sí
  choice: Ó tọ́ka sí àwọn ìpọ́njú Pọ́ọ̀lù fún wọn gẹ́gẹ́ bí odindi.
  alternative: Ó lè tọ́ka sí iṣẹ́ ìránṣẹ́ àti ìjìyà Pọ́ọ̀lù fún wọn ní ìtumọ̀ gbígbòòrò.
  rationale: “Àwọn ìpọ́njú mi” ni ohun tó sún mọ́ ọn jù; síbẹ̀, ọ̀rọ̀ Yorùbá náà kò dí ìtumọ̀ gbígbòòrò tí ó ka iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù mọ́ ìjìyà rẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo “rẹ̀wẹ̀sì” dípò gbólóhùn gígùn, àti “ìpọ́njú” láti pa líle θλῖψις mọ́.
