  to: Nítorí náà, mo bẹ̀ yín pé kí ẹ má ṣe rẹ̀wẹ̀sì nítorí àwọn ìpọ́njú mi fún yín[a]; àwọn ìpọ́njú wọ̀nyí ni ògo yín.[b]
