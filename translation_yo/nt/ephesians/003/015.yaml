  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: yo
  text: láti ọ̀dọ̀ ẹni tí gbogbo ìdílé ní ọ̀run àti lórí ilẹ̀ ayé ti gba orúkọ wọn,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọ̀dọ̀ ẹni tí gbogbo ìdílé ní ọ̀run àti lórí ilẹ̀ ayé lápapọ̀ ti gba orúkọ rẹ̀”; tàbí, ní ọ̀nà àlàyé sí i, “láti ọ̀dọ̀ ẹni tí gbogbo ipò baba ní ọ̀run àti lórí ilẹ̀ ayé ti rí orúkọ rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ οὗ
  choice: láti ọ̀dọ̀ ẹni tí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ‘láti ọ̀dọ̀ ẹni tí,’ ó sì fi Ọlọ́run hàn gẹ́gẹ́ bí orísun orúkọ náà láìfi àlàyé tí kò sí ní tààrà sínú ọ̀rọ̀ pàtàkì.
- source_word: πᾶσα
  choice: gbogbo
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ kan, πᾶσα lè túmọ̀ sí ‘gbogbo ... kọ̀ọ̀kan’ tàbí ‘gbogbo rẹ̀ lápapọ̀.’ Ní Yorùbá, ‘gbogbo ìdílé’ lè gbé ìtumọ̀ pínpín náà jáde ní ọ̀nà àdánidá, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ àkójọpọ̀; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé àṣàyàn kejì.
- source_word: πατριὰ
  choice: ìdílé
  rationale: πατριά sábà ń tọ́ka sí ẹgbẹ́ ìdílé, ìran, tàbí ẹbí. ‘Ìdílé’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì yẹ fún òǹkàwé òde òní; kò sọ ọ́ di èrò àfojúrí bí ‘ipò baba.’
- source_word: ἐν οὐρανοῖς
  choice: ní ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀, ‘ní ọ̀run’ ni ọ̀nà Yorùbá àdánidá láti tọ́ka sí agbègbè ọ̀run.
- source_word: ἐπὶ γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Èyí jẹ́ ìtumọ̀ ibi tí ó ṣe kedere tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ὀνομάζεται
  choice: ti ń jẹ́ orúkọ wọn
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ìṣe àsìkò ìsinsìnyí ní ohùn àìṣe, ó sì túmọ̀ sí ‘ni a ń sọ ní orúkọ’ tàbí ‘ń jẹ́ orúkọ.’ Gbólóhùn Yorùbá yìí dá ìbáṣepọ̀ pẹ̀lú ‘orúkọ’ sílẹ̀, ó sì bá ọ̀pọ̀ ìdílé mu ní ti gírámà.
theological_decisions:
- issue: Ìtumọ̀ πᾶσα πατριὰ ní ìbáṣepọ̀ pẹ̀lú ‘Baba’ nínú ẹsẹ tó ṣáájú
  choice: gbogbo ìdílé
  alternative: gbogbo ìdílé náà lápapọ̀; tàbí gbogbo ipò baba
  rationale: Ọ̀rọ̀ náà ṣeé ṣe kí ó ní eré-ọ̀rọ̀ láàárín πατήρ (‘Baba’) àti πατριά (‘ìdílé/ìran’). A pa ìtumọ̀ ìdílé mọ́ nínú ọ̀rọ̀ pàtàkì, láìyí i padà sí ẹ̀kọ́ àfojúrí nípa gbogbo ipò baba. Àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn pé ìdílé kan ṣoṣo lápapọ̀ ni a ń sọ̀rọ̀ rẹ̀, àti ìtumọ̀ pé orúkọ náà ti ọ̀dọ̀ Baba wá, mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yé òǹkàwé lasán. A lo ‘ìdílé’ dípò ọ̀rọ̀ àfojúrí tàbí ẹ̀kọ́-ẹ̀sìn, a sì fi àìdánilójú tó wà nínú πᾶσα πατριά pamọ́ sínú àkọsílẹ̀ ìsàlẹ̀.
