source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: yo
  text: Mo di ìránṣẹ́ ìhìn rere náà gẹ́gẹ́ bí ẹ̀bùn oore-ọ̀fẹ́ Ọlọ́run tí a fi fún mi, gẹ́gẹ́ bí ìṣiṣẹ́ agbára rẹ̀—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sọ mí di òjíṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Èyí ni ... rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka padà sí ìhìn rere nínú ẹsẹ tó ṣáájú; ìṣètò yìí jẹ́ Yorùbá àdánidá fún ‘of which’ láìsọ ọ́ di ẹni.
- source_word: ἐγενήθην
  choice: mo di
  rationale: ‘Mo di’ fi hàn pé Pọ́ọ̀lù wọ ipò iṣẹ́ yìí, ó sì pa ààyè ìtumọ̀ passive mọ́ nítorí àyíká ẹsẹ náà fi oore-ọ̀fẹ́ àti agbára Ọlọ́run hàn gẹ́gẹ́ bí orísun rẹ̀.
- source_word: διάκονος
  choice: ìránṣẹ́
  rationale: ‘Ìránṣẹ́’ sọ iṣẹ́ sísìn di mímọ́ láìfi ipò ṣọ́ọ̀ṣì tí ó wáyé lẹ́yìn náà kún ọ̀rọ̀ náà.
- source_word: κατὰ τὴν δωρεὰν
  choice: ní ìbámu pẹ̀lú ẹ̀bùn
  rationale: Ó pa ìtumọ̀ ìwọ̀n tàbí ìlànà tí κατά pẹ̀lú accusative ní síbẹ̀ mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: oore-ọ̀fẹ́ Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti fi genitive chain náà hàn, tí ó sì mú kí ẹ̀bùn náà ní ìbáṣepọ̀ pẹ̀lú oore-ọ̀fẹ́ Ọlọ́run.
- source_word: τῆς δοθείσης μοι
  choice: tí a fi fún mi
  rationale: Ìlò passive aláìdárúkọ olùṣe jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ pé a fún Pọ́ọ̀lù ní oore-ọ̀fẹ́ náà mọ́.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: ní ìbámu pẹ̀lú iṣẹ́
  rationale: ‘Iṣẹ́’ níbí túmọ̀ sí bí agbára náà ṣe ń ṣiṣẹ́ nípa mímúná dóko; gbolohun náà pa àtúnṣe κατά kejì mọ́.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: agbára rẹ̀
  rationale: ‘Agbára’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún δύναμις nínú àyíká Pọ́ọ̀lù.
theological_decisions:
- issue: Irú ipa Pọ́ọ̀lù gẹ́gẹ́ bí διάκονος
  choice: ìránṣẹ́
  alternative: òjíṣẹ́; díákónì
  rationale: Àyíká náà ń sọ nípa iṣẹ́ tí Pọ́ọ̀lù ń ṣe fún ìhìn rere, kì í ṣe ní kedere nípa ipò àṣẹ inú ìjọ; ‘ìránṣẹ́’ kò fi ètò ṣọ́ọ̀ṣì tí ó wáyé lẹ́yìn náà sínú ẹsẹ náà.
- issue: Olùṣe nínú ἐγενήθην
  choice: mo di
  alternative: a sọ mí di
  rationale: Gíríìkì lè ní ìtumọ̀ passive, ṣùgbọ́n ‘mo di’ jẹ́ Yorùbá àdánidá, nígbà tí àyíká náà ṣì fi hàn pé oore-ọ̀fẹ́ àti agbára Ọlọ́run ni orísun iṣẹ́ Pọ́ọ̀lù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún àwọn òǹkàwé òde òní. A lo ‘ìránṣẹ́’ dípò ọ̀rọ̀ ipò ṣọ́ọ̀ṣì, a sì pa ìtẹ̀sí gbolohun Gíríìkì méjèèjì ‘ní ìbámu pẹ̀lú’ mọ́.
