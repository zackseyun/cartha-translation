id: EPH.3.5
reference: Ephesians 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: yo
  text: èyí tí a kò jẹ́ kí àwọn ọmọ ènìyàn[a] mọ̀ ọ́ ní àwọn ìran mìíràn, bí a ti ṣí i payá nísinsin yìí fún àwọn àpọ́sítélì rẹ̀ àti àwọn wòlíì rẹ̀, tí wọ́n jẹ́ mímọ́, nínú Ẹ̀mí[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún aráyé”; Gíríìkì náà kà ní tààrà pé, “fún àwọn ọmọ ènìyàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ Ẹ̀mí”; gbólóhùn Gíríìkì náà lè tọ́ka sí agbègbè ìṣe tàbí ohun èlò ìṣe.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò oníbátan yìí ń tọ́ka sí ohun ìjìnlẹ̀ tí ẹsẹ 4 mẹ́nu kàn; “èyí tí” pa ìsopọ̀ gírámà Gíríìkì mọ́ láì tún orúkọ ohun ìjìnlẹ̀ náà fi kún un.
- source_word: ἑτέραις γενεαῖς
  choice: ní àwọn ìran mìíràn
  rationale: Dátífù náà ní agbára àkókò níbí; “ní àwọn ìran mìíràn” tún ἑτέραις ṣe ní tààrà ju “ní àwọn ìran àtijọ́” lọ.
- source_word: οὐκ ἐγνωρίσθη
  choice: a kò sọ di mímọ̀
  rationale: Èyí pa ohùn àfarajẹ àti ìtumọ̀ ìṣe γνωρίζω, ‘sọ di mímọ̀,’ mọ́.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: fún àwọn ọmọ ènìyàn
  rationale: Ó pa àwòrán ọ̀rọ̀ orísun tí ó túmọ̀ sí aráyé lápapọ̀ mọ́, ó sì jẹ́ gbólóhùn tí ó yé ni Yorùbá.
- source_word: ὡς νῦν
  choice: bí a ti ... nísinsin yìí
  rationale: Ìtumọ̀ afíwéra náà fi hàn pé a kò sọ ọ́ di mímọ̀ tẹ́lẹ̀ ní ọ̀nà tàbí ìwọ̀n tí a fi ṣí i payá báyìí.
- source_word: ἀπεκαλύφθη
  choice: a ti ṣí i payá
  rationale: “Ṣí ... payá” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìṣípayá ohun tí ó ti fara sin hàn, ó sì pa ohùn àfarajẹ mọ́.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: fún àwọn àpọ́sítélì àti àwọn wòlíì mímọ́ rẹ̀
  rationale: “Mímọ́” ń ṣàpèjúwe àpọ́sítélì àti wòlíì papọ̀, “rẹ̀” sì pa αὐτοῦ mọ́ láì dá ẹni tí ó ń tọ́ka sí pàtó ju orísun lọ.
- source_word: ἐν πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Ọ̀rọ̀ inú àyíká ìṣípayá yìí ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́; “nínú” pa ἐν àti àìdánilójú bóyá ó ń tọ́ka sí agbègbè ìṣe tàbí ohun èlò mọ́.
theological_decisions:
- issue: Ẹni tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ipò/ọ̀nà ti ẹ̀mí
  rationale: Nínú ọ̀rọ̀ nípa ìṣípayá Ọlọ́run sí àwọn àpọ́sítélì àti àwọn wòlíì, lílo Páùlù mú kí Ẹ̀mí Mímọ́ ṣeé ṣe jù; síbẹ̀, “nínú” kò pinnu bóyá Ẹ̀mí ni ọ̀nà ìṣe tàbí agbègbè ìṣe.
translation_notes:
  register: Yorùbá àkànṣe tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “àpọ́sítélì,” “wòlíì,” àti “Ẹ̀mí” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí ó ti wọ́pọ̀. Àwọn àmì ìsàlẹ̀ [a] àti [b] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn gbólóhùn tí ọkọọkan ń ṣàlàyé.
