  source_fidelity: Ìtumọ̀ náà fi ìjìnlẹ̀ àṣẹ Βλέπετε, ìsopọ̀ abájáde οὖν, àwòrán περιπατεῖτε, àti ìfẹ̀hàn ìyàtọ̀ láàárín ἄσοφοι àti σοφοί hàn dáadáa. Ṣùgbọ́n “ẹ kíyè sí i dáadáa bí” ní “i” tí kò ní ohun tó ń tọ́ka sí, ó sì kéré síi ní ìbámu Yorùbá. “Ẹ ṣọ́ra gidigidi bí ẹ ṣe ń rìn” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì mú agbára ìkìlọ̀ ọ̀rọ̀ Gíríìkì náà wá.
  naturalness: A tún “bí ẹ ti ń rìn” ṣe sí “bí ẹ ṣe ń rìn,” èyí tó dára jù lọ fún gbólóhùn ìbámu ní Yorùbá ìgbàlódé. Fífún àwọn orúkọ náà ní ọ̀pọ̀—“àwọn aláìgbọ́n ... àwọn ọlọ́gbọ́n”—jẹ́ kí ìfiwéra náà hàn ní kedere láìfi akọ tàbí abo kún ìtumọ̀.
