  text: Βλέπετε οὖν ⸂ἀκριβῶς πῶς⸃ περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: yo
  text: Nítorí náà, ẹ ṣọ́ra gidigidi bí ẹ ṣe ń rìn[a]—kì í ṣe bí àwọn aláìgbọ́n, ṣùgbọ́n bí àwọn ọlọ́gbọ́n—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “Ẹ wo dáadáa bí ẹ ṣe ń rìn.” Níhìn-ín, “rìn” jẹ́ àwòrán fún ọ̀nà ìgbésí ayé ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: ẹ kíyè sí i
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn, ó sì ń pè wọ́n sí àkíyèsí gidigidi; ‘ẹ kíyè sí i’ jẹ́ èdè Yorùbá àdánidá tó pa agbára àṣẹ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìtumọ̀ ohun tí a ti sọ ṣáájú hàn, ó sì so ẹsẹ̀ yìí mọ́ àríyànjiyàn tó ṣáájú.
- source_word: ἀκριβῶς πῶς
  choice: dáadáa bí
  rationale: ‘Dáadáa’ mú ìtẹnumọ́ ἀκριβῶς wá, ‘bí’ sì ṣí gbólóhùn tó ṣàlàyé ọ̀nà ìwà wọn; àkójọpọ̀ náà jẹ́ ti Yorùbá àdánidá.
- source_word: περιπατεῖτε
  choice: ẹ ti ń rìn
  rationale: A pa àwòrán ‘rìn’ tí Pọ́ọ̀lù lò mọ́, níbi tí ó ti dúró fún bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀.
- source_word: μὴ ὡς ἄσοφοι
  choice: kì í ṣe bí aláìgbọ́n
  rationale: ‘Aláìgbọ́n’ fi àìní ọgbọ́n hàn láìfi ìtumọ̀ líle ju ti Gíríìkì lọ; ọ̀nà yìí kò fi akọ tàbí abo kún ohun tí ọ̀rọ̀ náà ń sọ ní àyíká yìí.
- source_word: ἀλλ’ ὡς σοφοί
  choice: ṣùgbọ́n bí ọlọ́gbọ́n
  rationale: Ó pa ìtakora tó dọ́gba mọ́ láàárín aláìgbọ́n àti ọlọ́gbọ́n, ó sì jẹ́ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἄσοφοι / σοφοί tó jẹ́ àpèjúwe akọ ní gírámà Gíríìkì
  choice: aláìgbọ́n … ọlọ́gbọ́n
  alternative: àwọn ọkùnrin aláìgbọ́n … àwọn ọkùnrin ọlọ́gbọ́n
  rationale: Àwọn fọ́ọ̀mù akọ ọ̀pọ̀ wọ̀nyí lè dúró fún gbogbo àwùjọ. Àyíká náà ń bá gbogbo ìjọ sọ̀rọ̀, kì í ṣe àwọn ọkùnrin nìkan; èdè Yorùbá náà kò béèrè fífi akọ kún un.
- issue: Bóyá kí a pa àwòrán ‘rìn’ mọ́ tàbí kí a túmọ̀ rẹ̀ sí ‘gbé ayé’
  choice: Pa ‘rìn’ mọ́ nínú ọ̀rọ̀ pàtàkì, kí àlàyé ẹsẹ̀ ìsàlẹ̀ ṣàlàyé rẹ̀
  alternative: ẹ kíyè sí i dáadáa bí ẹ ti ń gbé ayé
  rationale: ‘Rìn’ jẹ́ àwòrán pàtàkì nínú ìwé Éfésù fún ìwà àti ọ̀nà ìgbésí ayé; pípamọ́ rẹ̀ ń jẹ́ kí ìsopọ̀ ọ̀rọ̀ náà wà, nígbà tí àlàyé ń mú ìtumọ̀ rẹ̀ ṣe kedere.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Ẹ’ fi hàn pé àṣẹ náà ń lọ sí gbogbo àwùjọ. A pa àwòrán Pọ́ọ̀lù ti ‘rìn’ mọ́, ṣùgbọ́n a ṣàlàyé rẹ̀ ní ẹsẹ̀ ìsàlẹ̀. Àmì gígùn ní òpin ń fi hàn pé gbólóhùn náà ń bá a lọ sínú ẹsẹ̀ tó tẹ̀ lé e.
