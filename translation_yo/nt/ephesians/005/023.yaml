id: EPH.5.23
reference: Ephesians 5:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: yo
  text: Nítorí ọkọ ni orí aya, gẹ́gẹ́ bí Mèsáyà náà ṣe jẹ́ orí ìjọ[a], òun fúnra rẹ̀ ni Olùgbàlà ara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Orí’ pa àkàwé Gíríìkì mọ́. Àwọn onítúmọ̀ ti lóye rẹ̀ lọ́nà ọ̀tọ̀ọ̀tọ̀ gẹ́gẹ́ bí ohun tó lè tọ́ka sí àṣẹ, ipò ọlá, tàbí orísun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó fi ìdí tàbí àlàyé fún ìṣírí tó ṣáájú hàn; ‘Nítorí’ jẹ́ ọ̀nà àdánidá láti pa agbára ìtumọ̀ náà mọ́ ní Yorùbá.
- source_word: ἀνήρ / γυνή
  choice: ọkọ / aya
  rationale: Nínú ọ̀rọ̀ ilé-ìdílé yìí, àwọn ọ̀rọ̀ náà ń tọ́ka sí ìbáṣepọ̀ ìgbéyàwó, kì í ṣe ọkùnrin àti obìnrin lápapọ̀.
- source_word: κεφαλή
  choice: orí
  rationale: Ó pa àkàwé Gíríìkì mọ́ láì fi ìtumọ̀ kan ṣoṣo bí ‘olórí,’ ‘aláṣẹ,’ tàbí ‘orisun’ sí i.
- source_word: ὡς καὶ
  choice: gẹ́gẹ́ bí ... náà
  rationale: Ó pa ìfiwéra tó wà láàárín ọkọ àti aya, àti Messia àti ìjọ mọ́ láì sọ pé ìbáṣepọ̀ méjèèjì bá ara wọn mu ní gbogbo ọ̀nà.
- source_word: Χριστός
  choice: Messia
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, kì í ṣe bí orúkọ lásán.
- source_word: ἐκκλησία
  choice: ìjọ
  rationale: ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwùjọ àwọn onígbàgbọ́ tí Pọ́ọ̀lù ń tọ́ka sí.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ó sì so iṣẹ́ ìgbàlà náà mọ́ Messia pàtó.
- source_word: σωτήρ
  choice: Olùgbàlà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún ẹni tó ń gbà là, ó sì pa ìtumọ̀ ìgbàlà tó wà nínú àyíká ọ̀rọ̀ náà mọ́.
- source_word: σῶμα
  choice: ara náà
  rationale: Ó pa àkàwé ara tí Pọ́ọ̀lù lò fún ìjọ mọ́, láì fi ‘ara rẹ̀’ kún un, nítorí ‘rẹ̀’ kò fara hàn gbangba nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ κεφαλή nínú ìfiwéra ọkọ-aya àti Messia-ìjọ
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘orí.’
  alternative: ‘olórí,’ ‘aláṣẹ,’ tàbí ‘orisun’
  rationale: Àwọn onítúmọ̀ ń jiyàn lórí bóyá ọ̀rọ̀ náà tẹnumọ́ àṣẹ, ipò ọlá, tàbí orísun. Ìtumọ̀ yìí kò yanjú àríyànjiyàn náà ní ìkọ̀kọ̀, bí kò ṣe pé ó pa àkàwé ojúlówó mọ́.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Messia
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ní agbára oyè ẹni tí a fòróró yàn níhìn-ín; ‘Messia’ mú agbára oyè náà hàn kedere.
- issue: Ìbáṣepọ̀ αὐτὸς σωτὴρ τοῦ σώματος pẹ̀lú gbólóhùn tó ṣáájú
  choice: ‘òun fúnra rẹ̀ sì ni Olùgbàlà ara náà’
  alternative: ‘òun fúnra rẹ̀, Olùgbàlà ara náà’
  rationale: Fífi ‘sì ni’ kún un jẹ́ àdánidá ní Yorùbá, ó pa ìtẹnumọ́ αὐτός mọ́, ó sì kò sọ ìbáṣepọ̀ àpólà náà di ẹ̀kọ́ míì.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn kíkún níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye. A lo ‘aya rẹ̀’ láti jẹ́ kí ìbáṣepọ̀ ọkọ-aya ṣe kedere, a sì pa àkàwé ‘orí’ àti ‘ara’ mọ́.
