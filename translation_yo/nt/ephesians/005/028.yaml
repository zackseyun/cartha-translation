  terminology: ‘Àwọn ọkọ,’ ‘aya,’ ‘nífẹ̀ẹ́,’ àti ‘ara’ jẹ́ àwọn ọ̀rọ̀ tó péye fún οἱ ἄνδρες, γυναῖκες, ἀγαπάω, àti σώματα nínú àyíká ìgbéyàwó yìí. ‘Aya tiwọn’ àti ‘ara tiwọn’ ń pa ìtẹnumọ́ ἑαυτῶν mọ́ láì di Yorùbá aláìdánidá.
