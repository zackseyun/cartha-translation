- from: Bẹ́ẹ̀ náà ni ó yẹ kí àwọn ọkọ pẹ̀lú máa nífẹ̀ẹ́ àwọn aya wọn bí ara wọn. Ẹni tí ó bá nífẹ̀ẹ́ aya tirẹ̀, ó nífẹ̀ẹ́ ara rẹ̀.
  to: Bẹ́ẹ̀ náà ni ó yẹ kí àwọn ọkọ pẹ̀lú nífẹ̀ẹ́ àwọn aya tiwọn bí ara tiwọn. Ẹni tí ó nífẹ̀ẹ́ aya tirẹ̀, ó nífẹ̀ẹ́ ara rẹ̀.
  rationale: A yọ ‘máa’ kúrò kí a má bàa fi habitual aspect kún ọ̀rọ̀ Gíríìkì náà; a tún yọ ‘bá’ kúrò kí substantival participle náà má bàa dà bí conditional. A lo ‘tiwọn’ nínú ‘àwọn aya tiwọn’ àti ‘ara tiwọn’ láti fi ìtẹnumọ́ ἑαυτῶν hàn. Ìyókù ìṣètò àti ọ̀rọ̀ ìfẹ́, ọkọ, aya, ara sì wà ní ìbámu pẹ̀lú ìtumọ̀ ìpilẹ̀.
