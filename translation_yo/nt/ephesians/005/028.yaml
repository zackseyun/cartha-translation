id: EPH.5.28
reference: Ephesians 5:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ó yẹ kí àwọn ọkọ pẹ̀lú nífẹ̀ẹ́ àwọn aya tiwọn bí ara tiwọn. Ẹni tí ó nífẹ̀ẹ́ aya tirẹ̀, ó nífẹ̀ẹ́ ara rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ẹsẹ yìí mọ́ àfiwé àti ìṣírí inú ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘ní ọ̀nà kan náà’ ní Yorùbá.
- source_word: ὀφείλουσιν
  choice: ó yẹ kí … máa
  rationale: Ó fi ojúṣe ìwà rere hàn láì sọ ọ́ di àṣẹ líle ju bí ọ̀rọ̀ Gíríìkì ṣe rí lọ.
- source_word: καὶ οἱ ἄνδρες
  choice: àwọn ọkọ pẹ̀lú
  rationale: καί ní agbára àfikún, tí ‘pẹ̀lú’ gbé jáde; nínú àyíká ìgbéyàwó yìí, ἄνδρες túmọ̀ sí àwọn ọkọ.
- source_word: ἀγαπᾶν
  choice: máa nífẹ̀ẹ́
  rationale: Ó pa ìtumọ̀ ìfẹ́ mọ́, ó sì bá àṣà Yorùbá mu láti lo ‘nífẹ̀ẹ́’ fún ἀγαπάω.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: àwọn aya wọn
  rationale: γυναῖκας jẹ́ ‘aya’ ní àyíká yìí. Yorùbá kì í sábà fi ọ̀rọ̀ tó dọ́gba pẹ̀lú ‘own’ kún un níbí; ‘wọn’ ti fi ìbáṣepọ̀ ara ẹni hàn ní kedere.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: bí ara wọn
  rationale: ‘Ara’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún σώματα nínú àfiwé yìí, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí ẹyọ tàbí ọ̀pọ̀ láì mú ìtumọ̀ kúrò.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: Ẹni tí ó bá nífẹ̀ẹ́ aya tirẹ̀
  rationale: ‘Ẹni tí ó bá’ tú àpólà aláìlórúkọ Gíríìkì sí Yorùbá àdánidá; ‘aya tirẹ̀’ pa ìtẹnumọ́ ἑαυτοῦ mọ́.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: ó nífẹ̀ẹ́ ara rẹ̀
  rationale: Ó tú ọ̀rọ̀ arọ́pò-orúkọ afẹ̀yìntì àti ọ̀rọ̀-ìṣe tí a tún lò ní tààrà, ó sì pa ọgbọ́n inú àríyànjiyàn Pọ́ọ̀lù mọ́.
theological_decisions:
- issue: Èdè akọ nínú ìṣírí fún àwọn tọkọtaya
  choice: A tú οἱ ἄνδρες sí ‘àwọn ọkọ,’ a sì jẹ́ kí ‘ẹni’ tọ́ka sí ọkọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
  alternative: àwọn ọkùnrin; ọkùnrin tí ó bá nífẹ̀ẹ́
  rationale: Àyíká náà jẹ́ ti ìgbéyàwó ní pàtó. ‘Àwọn ọkọ’ ṣe kedere, nígbà tí ‘ẹni’ jẹ́ Yorùbá àdánidá fún substantival participle tí àyíká rẹ̀ ti fi ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ hàn.
- issue: Irú àfiwé tó wà láàárín aya àti ara ọkọ
  choice: A pa àfiwé náà mọ́ láì ṣàlàyé rẹ̀ sí ẹ̀kọ́ ìdánimọ̀ àjèjì.
  alternative: Láti ṣàlàyé pé aya àti ara ọkọ jẹ́ ohun kan ní ti ẹ̀dá tàbí ní ọ̀nà metaphysical.
  rationale: Ọ̀rọ̀ náà fi ìfẹ́ ọkọ sí aya rẹ̀ wé ìfẹ́ sí ara rẹ̀, ó sì parí pé ẹni tó nífẹ̀ẹ́ aya rẹ̀ nífẹ̀ẹ́ ara rẹ̀. Ìtumọ̀ náà pa ìdí ìwà rere àti ìmọ̀ Ọlọ́run yìí mọ́ láì fi àlàyé ẹ̀kọ́ míì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘nífẹ̀ẹ́’ déédéé fún ἀγαπάω, ‘ọkọ/aya’ fún àyíká ìgbéyàwó, àti ‘ara’ fún σῶμα.
