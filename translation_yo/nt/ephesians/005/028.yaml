  source_fidelity: 'Àtúmọ̀ náà gba ìtumọ̀ Gíríìkì náà ní pàtàkì: ó tọ́ka sí àwọn ọkọ, ojúṣe wọn láti nífẹ̀ẹ́ aya wọn, àfiwé pẹ̀lú ara wọn, àti ìparí pé ìfẹ́ aya jẹ́ ìfẹ́ ara ẹni. Ṣùgbọ́n ‘máa nífẹ̀ẹ́’ fi ìṣiṣẹ̀ àṣà/títẹ̀síwájú kún ἀγαπᾶν tí kò hàn ní pàtó nínú ọ̀rọ̀ ìpilẹ̀. ‘Ẹni tí ó bá nífẹ̀ẹ́’ sì lè ní ìró ìpò-ìṣèlẹ̀ (‘whoever/if one loves’) ju participle gbogbogbò ‘ẹni tí ó nífẹ̀ẹ́’ lọ.'
