id: EPH.5.2
reference: Ephesians 5:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: yo
  text: Ẹ sì máa rìn nínú ìfẹ́, gẹ́gẹ́ bí Mèsáyà[a] náà ti fẹ́ràn wa, tí ó sì fi ara rẹ̀ sílẹ̀ fún wa[b] gẹ́gẹ́ bí ọrẹ àti ẹbọ sí Ọlọ́run, gẹ́gẹ́ bí òórùn dídùn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘Kristi.’ Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni tí a fòróró yàn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé ‘nítorí wa’ tàbí ‘ní ànfààní wa.’ Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ aṣojú tàbí ìtumọ̀ àǹfààní níhìn-ín.
    reason: lexical_alternative
  - marker: c
    text: Gbólóhùn ‘òórùn dídùn’ ń lo èdè ìrúbọ inú Májẹ̀mú Láéláé fún ọrẹ tí ó tẹ́ Ọlọ́run lọ́rùn.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: ẹ máa rìn
  rationale: Ó pa àwòrán Pọ́ọ̀lù nípa rírìn mọ́ gẹ́gẹ́ bí ọ̀nà ìgbésí ayé, ó sì jẹ́ gbólóhùn tí a lè lóye ní Yorùbá.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Ó pa ìtumọ̀ ibi tàbí ọ̀nà ìgbésí ayé tí ọ̀rọ̀ ìṣáájú ἐν lè ní mọ́, ó sì so mọ́ ọ̀rọ̀-ìṣe ‘fẹ́ràn’ tó tẹ̀ lé e.
- source_word: ὁ Χριστός
  choice: Mèsáyà
  rationale: Χριστός pẹ̀lú àpilẹ̀kọ náà ń ṣiṣẹ́ bí oyè níhìn-ín; ‘Mèsáyà’ túmọ̀ oyè ẹni tí a fòróró yàn láì sọ ọ́ di orúkọ lásán.
- source_word: ἠγάπησεν ἡμᾶς
  choice: fẹ́ràn wa
  rationale: Ìtumọ̀ tààrà ni, ó sì pa ìbátan ọ̀rọ̀ rẹ̀ mọ́ pẹ̀lú ἀγάπη ní ìbẹ̀rẹ̀ ẹsẹ náà.
- source_word: παρέδωκεν ἑαυτὸν
  choice: fi ara rẹ̀ lélẹ̀
  rationale: Ó sọ ìfara-ẹni-rúbọ àti fífi ara ẹni fúnni hàn láì dapọ̀ ọ́ mọ́ ọ̀rọ̀ ‘ẹbọ’ tó wà lẹ́yìn rẹ̀.
- source_word: ὑπὲρ ἡμῶν
  choice: fún wa
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì fi agbára àǹfààní tàbí aṣojú tí ὑπέρ lè ní sílẹ̀ láì fi dandan túmọ̀ ọ́ sí ‘ní ipò wa.’
- source_word: προσφορὰν καὶ θυσίαν
  choice: ọrẹ àti ẹbọ
  rationale: A pa àwọn ọ̀rọ̀ ìrúbọ méjèèjì mọ́ dípò kíkó wọn jọ sí ọ̀rọ̀ kan.
- source_word: τῷ θεῷ
  choice: sí Ọlọ́run
  rationale: ‘Sí Ọlọ́run’ fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí a darí ọrẹ àti ẹbọ náà sí.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: fún òórùn dídùn
  rationale: Ó pa àwòrán òórùn ìrúbọ mọ́, ó sì yàgò fún fífi ọ̀rọ̀ ìtumọ̀ bí ‘tí ó tẹ́ Ọlọ́run lọ́rùn’ kún ohun tí Gíríìkì sọ ní àwòrán.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ ὁ àti àyíká gbólóhùn náà fi hàn pé oyè ni ó ń ṣiṣẹ́ bí; a túmọ̀ oyè náà dípò lílo irú orúkọ tí a yá wọlé nìkan.
- issue: Agbára ὑπὲρ ἡμῶν nínú ọ̀rọ̀ ìrúbọ
  choice: fún wa
  alternative: ní ipò wa
  rationale: ‘Fún wa’ pa ìtumọ̀ àǹfààní àti aṣojú mọ́, ṣùgbọ́n kò fi èrò pàṣípààrọ̀ tó dín kù lé ọ̀rọ̀ Gíríìkì náà lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì àti àmì ohùn ní kíkún. ‘Ẹ máa rìn nínú ìfẹ́’ pa àwòrán orísun mọ́ bí ó tilẹ̀ jẹ́ pé ó tún ń tọ́ka sí gbogbo ọ̀nà ìgbésí ayé. A yan ‘fi ara rẹ̀ lélẹ̀’ láti jẹ́ èdè àdánidá tí kò ní sọ pàtó ju παρέδωκεν lọ.
