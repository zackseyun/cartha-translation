id: EPH.5.13
reference: Ephesians 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo ohun tí ìmọ́lẹ̀ bá tú síta a máa hàn gbangba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n ohun gbogbo tí ìmọ́lẹ̀ bá tú síta ni ó máa hàn gbangba.” A lè lóye ọ̀rọ̀ àpọnlé àti ọ̀rọ̀-ìṣe Gíríìkì náà ní ọ̀nà méjì tó sún mọ́ra, yálà kí ìtẹnumọ́ wà lórí títú ohun náà síta tàbí lórí bí ó ṣe máa hàn gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: gbogbo ohun
  rationale: Ọ̀rọ̀ yìí jẹ́ àpapọ̀ aláìdánimọ̀ tó gbòòrò; “gbogbo ohun” pa ìwọ̀n rẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ tàbí ìtẹ̀síwájú hàn láti inú ọ̀rọ̀ tó ṣáájú.
- source_word: ἐλεγχόμενα
  choice: tí ... bá tú síta
  rationale: Nínú àyíká ìmọ́lẹ̀, ἐλέγχω túmọ̀ sí ṣí ohun tó farapamọ́ payá tàbí tú un síta, kì í ṣe báni wí lásán. Ìṣètò “tí ... bá” fi ìbáṣepọ̀ ọ̀rọ̀ àpọnlé náà hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: ìmọ́lẹ̀ bá
  rationale: Àkọ́lé orúkọ náà tọ́ka sí “ìmọ́lẹ̀” tí àyíká ọ̀rọ̀ ti mẹ́nu kàn; ìṣètò Yorùbá yìí pa ipa ìmọ́lẹ̀ gẹ́gẹ́ bí olùṣe mọ́.
- source_word: φανεροῦται
  choice: ni a mú kí ó hàn kedere
  rationale: Ó pa ìtumọ̀ ìṣe tí a ṣe sí ohun náà mọ́, ó sì bá àwòrán ìmọ́lẹ̀ tó ń mú ohun hàn mu.
theological_decisions:
- issue: Ìtumọ̀ “ìmọ́lẹ̀” nínú àyíká ọ̀rọ̀
  choice: A túmọ̀ rẹ̀ sí “ìmọ́lẹ̀” láì sọ ẹni tàbí ohun kan pàtó tó dúró fún.
  alternative: Kristi; ìhìn rere; òtítọ́ nípa ìwà; ẹ̀rí àwùjọ àwọn onígbàgbọ́
  rationale: Ẹsẹ náà fúnra rẹ̀ kò sọ ohun tí “ìmọ́lẹ̀” dúró fún ní pàtó; fífi àwòrán náà sílẹ̀ gẹ́gẹ́ bí ó ti rí ń pa ìfòyemọ̀ àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba. “Tú síta” jẹ́ àdánidá fún ṣí ohun tó farapamọ́ payá nínú àwòrán ìmọ́lẹ̀.
