id: EPH.5.8
reference: Ephesians 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: yo
  text: Nítorí ẹ jẹ́ òkùnkùn nígbà kan rí, ṣùgbọ́n ní báyìí ẹ jẹ́ ìmọ́lẹ̀ nínú Olúwa. Ẹ máa rìn gẹ́gẹ́ bí àwọn ọmọ ìmọ́lẹ̀,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà ìtumọ̀ tí ó ṣàlàyé sí i, “Ẹ máa gbé ìgbé ayé bí àwọn ọmọ ìmọ́lẹ̀.” Nínú èdè Gíríìkì, ọ̀rọ̀ náà ni “rìn,” àkàwé tí Páùlù sábà máa ń lò fún ọ̀nà ìgbé ayé ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: ẹ̀yin jẹ́
  rationale: Ọ̀rọ̀-ìṣe àìpé ti εἰμί ń tọ́ka sí ipò kan ní àkókò àtijọ́; “ẹ̀yin jẹ́” jẹ́ ìtumọ̀ tààrà tó sì bá Yorùbá mu.
- source_word: γάρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ìpìlẹ̀ fún ìkìlọ̀ tó ṣáájú; “Nítorí” pa ìsopọ̀ àlàyé náà mọ́.
- source_word: ποτε
  choice: nígbà kan rí
  rationale: Ó fi ipò àtijọ́ wé ipò ìsinsìnyí, ó sì jẹ́ ọ̀nà àdánidá láti sọ “formerly/once” ní Yorùbá.
- source_word: σκότος
  choice: òkùnkùn
  rationale: Orúkọ àpèjúwe ni Gíríìkì lò, kì í ṣe “nínú òkùnkùn”; fífi “òkùnkùn ni ẹ̀yin jẹ́” sílẹ̀ pa agbára àwòrán ìdánimọ̀ náà mọ́.
- source_word: νῦν δὲ
  choice: ṣùgbọ́n nísinsìnyí
  rationale: Ó mú ìyàtọ̀ tó lágbára wá láàárín ipò tẹ́lẹ̀ àti ipò ìsinsìnyí.
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: Gẹ́gẹ́ bí σκότος, orúkọ àpèjúwe ni; a kò rọ̀ ọ́ sí “nínú ìmọ́lẹ̀” tàbí “a ti fún yín ní ìmọ́lẹ̀.”
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: 'Ó dára jù láti fi agbègbè ìbáṣepọ̀ tàbí ìṣọ̀kan hàn: ìdánimọ̀ tuntun wọn gẹ́gẹ́ bí ìmọ́lẹ̀ wà nínú Olúwa.'
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó ń tọ́ka sí ìwà tó bá ìdánimọ̀ wọn mu, kì í ṣe àfiwé lasan.
- source_word: τέκνα φωτός
  choice: ọmọ ìmọ́lẹ̀
  rationale: τέκνα kó gbogbo akọ àti abo sínú, “ọmọ” sì lè jẹ́ ọ̀pọ̀ nínú àyíká yìí; a pa ìsopọ̀ “ti ìmọ́lẹ̀” mọ́.
- source_word: περιπατεῖτε
  choice: Ẹ máa rìn
  rationale: Àṣẹ ìsinsìnyí ni, ó sì jẹ́ àkàwé Páùlù tó wọ́pọ̀ fún ìlànà ìgbé-ayé; “Ẹ máa rìn” pa àkàwé àti ìtẹ̀síwájú ìṣe náà mọ́.
theological_decisions:
- issue: Èdè àkàwé ìdánimọ̀ nínú “òkùnkùn ni ẹ̀yin jẹ́ ... ìmọ́lẹ̀ ni ẹ̀yin”
  choice: Pa àwọn orúkọ àkàwé “òkùnkùn” àti “ìmọ́lẹ̀” mọ́ gẹ́gẹ́ bí ìdánimọ̀.
  alternative: “Ẹ̀yin wà nínú òkùnkùn tẹ́lẹ̀, ṣùgbọ́n ẹ̀yin wà nínú ìmọ́lẹ̀ báyìí.”
  rationale: Gíríìkì lò àwọn orúkọ àpèjúwe láìsí ọ̀rọ̀ atọ́ka ibi, nítorí náà ó ń tẹnumọ́ ìyípadà ipò àti ìdánimọ̀, kì í ṣe àyíká wọn nìkan.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” bá lílo Majẹmu Tuntun àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ mu láì dín ìtumọ̀ náà kù.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ̀yin” láti fi ọ̀pọ̀ ènìyàn hàn, a sì pa àkàwé “rìn” àti ìdánimọ̀ “òkùnkùn/ìmọ́lẹ̀” mọ́.
