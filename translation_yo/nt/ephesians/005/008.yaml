revisions:
- from: Nítorí nígbà kan rí, òkùnkùn ni ẹ̀yin jẹ́, ṣùgbọ́n nísinsìnyí, ìmọ́lẹ̀ ni ẹ̀yin nínú Olúwa. Ẹ máa rìn gẹ́gẹ́ bí ọmọ ìmọ́lẹ̀,[a]
  to: Nítorí ẹ jẹ́ òkùnkùn nígbà kan rí, ṣùgbọ́n ní báyìí ẹ jẹ́ ìmọ́lẹ̀ nínú Olúwa. Ẹ máa rìn gẹ́gẹ́ bí àwọn ọmọ ìmọ́lẹ̀,[a]
  rationale: 'Àtúnṣe náà ṣe gbolohun Yorùbá náà ní ìṣàn tó dára sí i láì yí ìtumọ̀ Gíríìkì padà: àwọn olùgbọ́ náà jẹ́ òkùnkùn tẹ́lẹ̀, ṣùgbọ́n ní báyìí wọ́n jẹ́ ìmọ́lẹ̀ nínú Olúwa. Ó tún fi ọ̀pọ̀ “àwọn ọmọ” hàn kedere, ó sì mú akọsílẹ̀ ẹsẹ̀ náà jẹ́ Yorùbá boṣewa tó rọrùn.'
