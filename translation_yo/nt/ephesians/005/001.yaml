id: EPH.5.1
reference: Ephesians 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: yo
  text: Nítorí náà, ẹ máa di[a] aláfarawé Ọlọ́run, gẹ́gẹ́ bí àwọn ọmọ tí a fẹ́ràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa jẹ́ aláfarawé Ọlọ́run”; ọ̀rọ̀ àṣẹ Gíríìkì náà lè tẹnumọ́ yíyípadà sí irú ẹni bẹ́ẹ̀ tàbí wíwà bẹ́ẹ̀ ní ọ̀nà tí ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ẹ máa di
  rationale: Ọ̀rọ̀ àṣẹ yìí wà ní àkókò tí ń lọ lọ́wọ́, ó sì lè tẹnumọ́ yíyípadà sí irú ẹni kan tàbí wíwà bẹ́ẹ̀ ní ọ̀nà tí ń bá a lọ. “Ẹ máa di” mú ìtumọ̀ ìlànà àti ìlọsíwájú náà jáde.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìkìlọ̀ yìí mọ́ ohun tí a ti sọ ṣáájú gẹ́gẹ́ bí àbájáde rẹ̀.
- source_word: μιμηταὶ
  choice: aláfarawé
  rationale: Ó túmọ̀ sí àwọn ẹni tí ń fara wé tàbí tẹ̀ lé àpẹẹrẹ ẹlòmíràn; “aláfarawé” pa àwòrán fífarawé mọ́ ju ọ̀rọ̀ gbogbogbò bí “olùtẹ̀lé” lọ.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Èdè Yorùbá fi “Ọlọ́run” hàn ní ti ẹ̀dá láìní àfikún ọ̀rọ̀ arọ́pò-ọrọ̀ míì nínú gbólóhùn yìí.
- source_word: ὡς
  choice: bí
  rationale: “Bí” pa ìfiwéra àti ìdánimọ̀ tí ó há mọ́ ọ̀rọ̀ Gíríìkì mọ́, láìfi ìtumọ̀ okunfa kún un ní pàtó.
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: Ọ̀rọ̀ náà kó gbogbo akọ àti abo sínú, ó sì ń tọ́ka sí ìbáṣepọ̀ ọmọ, kì í ṣe àwọn ọmọkùnrin nìkan.
- source_word: ἀγαπητά
  choice: tí a fẹ́ràn
  rationale: Ó sọ pé àwọn ọmọ náà jẹ́ ẹni tí a ní ìfẹ́ sí. Gbólóhùn yìí jẹ́ èdè Yorùbá adayébá, ó sì pa ìmọ̀lára ìfẹ́ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Agbára ìkìlọ̀ náà ní ìbáṣepọ̀ pẹ̀lú jíjẹ́ ọmọ Ọlọ́run
  choice: A rọ àwọn onígbàgbọ́ láti máa di aláfarawé Ọlọ́run gẹ́gẹ́ bí àwọn ọmọ tí a fẹ́ràn; ẹsẹ̀ náà kò sọ pé fífarawé ni ó sọ wọ́n di ọmọ Ọlọ́run.
  alternative: 'A lè ka ọ̀rọ̀ náà gẹ́gẹ́ bí ìfiwéra lasán: ẹ fara wé Ọlọ́run bí àwọn ọmọ tí a fẹ́ràn ti máa ń ṣe.'
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì jẹ́ kí “bí àwọn ọmọ tí a fẹ́ràn” ṣàlàyé ọ̀nà tàbí ìpìlẹ̀ ìkìlọ̀ náà. Ìtumọ̀ náà pa ìdíwọ̀n yìí mọ́ láìfi ẹ̀kọ́ ìsọdọmọ tí ẹsẹ̀ náà kò sọ ní kedere kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, adayébá, àti ọ̀wọ̀ ni a lò. “Ẹ máa di” fi ìlànà tó ń bá a lọ hàn, “aláfarawé” sì pa àwòrán ìfarawe inú ọ̀rọ̀ Gíríìkì mọ́. Àmì àlàyé [a] wà lẹ́yìn gbogbo gbólóhùn tí ó ń ṣàlàyé, gẹ́gẹ́ bí àṣà ìtẹ̀jáde.
