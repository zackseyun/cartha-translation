id: EPH.5.29
reference: Ephesians 5:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: yo
  text: Nítorí kò sí ẹni tí ó ti korira ara tirẹ̀ rí; ṣùgbọ́n ó ń bọ́ ọ, ó sì ń ṣìkẹ́ rẹ̀, gẹ́gẹ́ bí Kristi[a] náà ṣe ń bọ́ ìjọ, tí ó sì ń ṣìkẹ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kristi jẹ́ oyè tó túmọ̀ sí Ẹni tí a fi òróró yàn; a tún lè pè é ní Mèsáyà.
    reason: Ṣàlàyé pé Χριστός jẹ́ oyè, kì í ṣe orúkọ ẹni lásán.
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Nítorí kò sí ẹni ... rí
  rationale: Ọ̀rọ̀ yìí mú ìdí tàbí àlàyé tí γάρ ń fi hàn wá, ó sì lo ọ̀nà Yorùbá àdánidá ‘kò sí ẹni ... rí’ láti ṣàfihàn οὐδεὶς ... ποτε.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: ara tirẹ̀
  rationale: Nínú àyíká yìí, σάρξ ń tọ́ka sí ara ènìyàn fúnra rẹ̀, kì í ṣe ‘ìwà ẹlẹ́ṣẹ̀.’ ‘Ara tirẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu ju ‘ẹran ara tirẹ̀’ tó lè dún bíi ẹran lọ.
- source_word: ἐμίσησεν
  choice: ti korira
  rationale: ‘Korira’ ni ìtumọ̀ Yorùbá tó ṣe déédé fún μισέω; ẹ̀yà ọ̀rọ̀ ‘ti ... rí’ bá agbára aorist pẹ̀lú ποτέ mu nínú gbólóhùn àìní.
- source_word: ἐκτρέφει
  choice: ń bọ́ ọ
  rationale: ἐκτρέφω níbí túmọ̀ sí fífún ara ní oúnjẹ àti ohun tó ń mú un dàgbà; ‘bọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe náà.
- source_word: θάλπει
  choice: ń ṣìkẹ́ rẹ̀
  rationale: θάλπω lè túmọ̀ sí mímú kí ohun móoru, ṣùgbọ́n níbí ó ń sọ nípa ìtọ́jú oníjẹ̀lẹ́ńkẹ́. ‘Ṣìkẹ́’ pa ìfẹ́ àti ìtọ́jú pẹ̀lẹ́ mọ́.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí ... náà
  rationale: Ìṣètò yìí pa ìfiwéra καθὼς àti agbára àfikún καί mọ́ ní Yorùbá àdánidá.
- source_word: ὁ Χριστὸς
  choice: Kristi
  rationale: ‘Kristi’ ni orúkọ oyè Kristẹni tí àwọn olùkà Yorùbá mọ̀ jù lọ, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Ẹni Àmì-òróró níbí; àlàyé ìtumọ̀ rẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: τὴν ἐκκλησίαν
  choice: ìjọ
  rationale: Nínú ọ̀rọ̀ Paulu yìí, ἐκκλησία ń tọ́ka sí àwùjọ àwọn ènìyàn Ọlọ́run; ‘ìjọ’ ni ọ̀rọ̀ Yorùbá tó bójú mu, tó sì wọ́pọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Kristi
  alternative: Mèsáyà; Ẹni Àmì-òróró
  rationale: ‘Kristi’ jẹ́ ìlò Yorùbá tó fìdí múlẹ̀, ṣùgbọ́n a fi àlàyé hàn pé oyè ni, ìtumọ̀ rẹ̀ sì ni Ẹni Àmì-òróró, kó má bàa dà bí orúkọ lásán.
- issue: Bí a ṣe túmọ̀ σάρξ
  choice: ara tirẹ̀
  alternative: ẹran ara tirẹ̀
  rationale: Àyíká ìgbéyàwó àti ara fi hàn pé ara ènìyàn gangan ni a ń sọ, kì í ṣe ìtumọ̀ ẹ̀kọ́ nípa ‘ìwà ẹlẹ́ṣẹ̀.’ ‘Ara’ pa ìtumọ̀ ti ara mọ́ láì mú ìdàrúdàpọ̀ ‘ẹran’ wá.
- issue: Ọ̀rọ̀-ìṣe tí a kò tún sọ lẹ́yìn καθὼς
  choice: gẹ́gẹ́ bí Kristi náà ti ń ṣe fún ìjọ
  alternative: gẹ́gẹ́ bí Kristi náà ti ń bọ́ ìjọ, tí ó sì ń ṣìkẹ́ rẹ̀
  rationale: Gíríìkì fi àwọn ọ̀rọ̀-ìṣe sílẹ̀ kí olùkà lóye wọn láti apá àkọ́kọ́. ‘Ti ń ṣe fún ìjọ’ jẹ́ Yorùbá àdánidá tí ó pa ìsopọ̀ mọ́ láì fi ìtumọ̀ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
