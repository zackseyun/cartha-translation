id: EPH.5.5
reference: Ephesians 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: yo
  text: Nítorí ẹ mọ̀ dájú pé gbogbo ẹni tí ó ń ṣe ìṣekúṣe nípa ìbálòpọ̀, tàbí ẹni aláìmọ́, tàbí ẹni oníwọra—ẹni tí í ṣe abọ̀rìṣà[a]—kò ní ogún kankan nínú ìjọba Mèsáyà[b] àti Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki, “èyí tí í ṣe ìbọ̀rìṣà”; ó ṣeé ṣe kí èyí ń tọ́ka ní pàtàkì sí ojúkòkòrò.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ni “Kristi”; a túmọ̀ ọ́ sí “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: ẹ mọ èyí dájú, ẹ sì lóye pé
  rationale: Àpapọ̀ ọ̀rọ̀-ìṣe méjèèjì tẹnu mọ́ ìmọ̀ tí ó dájú pẹ̀lú òye; ìtumọ̀ yìí pa agbára ọ̀rọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: πόρνος
  choice: ẹni tí ó ń ṣe ìṣekúṣe nípa ìbálòpọ̀
  rationale: Ó ṣàpèjúwe ẹni tí ìwà ìbálòpọ̀ búburú jẹ́ àmì ìgbésí ayé rẹ̀; gbólóhùn yìí ṣe kedere fún òǹkàwé òde òní láì dín ìtumọ̀ náà kù sí panṣágà nìkan.
- source_word: ἀκάθαρτος
  choice: ẹni aláìmọ́
  rationale: Ó pa àwòrán àìmọ́ mọ́, ó sì lè tọ́ka sí àìmọ́ nípa ìwà gẹ́gẹ́ bí ó ti rí nínú àkójọ ìwà búburú yìí.
- source_word: πλεονέκτης
  choice: ẹni oníwọra
  rationale: “Oníwọra” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni tí ìfẹ́ láti kó ohun púpọ̀ jọ ń darí.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: ẹni tí í ṣe abọ̀rìṣà
  rationale: Ní àyíká ọ̀rọ̀ náà, gbólóhùn yìí ṣàpèjúwe ẹni oníwọra gẹ́gẹ́ bí abọ̀rìṣà. Bí ó tilẹ̀ jẹ́ pé arọ́pò-orúkọ Gíríìkì jẹ́ akọ̀-àìjẹ́-bákan, ìtumọ̀ ẹni ni ó ṣe àdánidá jù ní Yorùbá; àṣàyàn tó túmọ̀ sí “èyí tí í ṣe ìbọ̀rìṣà” wà nínú àlàyé ìsàlẹ̀.
- source_word: κληρονομίαν
  choice: ogún
  rationale: “Ogún” pa èrò ìní tí a jogún mọ́, pẹ̀lú ìró májẹ̀mú àti ìrètí ọjọ́ iwájú tó wà nínú lílo ọ̀rọ̀ náà lọ́dọ̀ Paulu.
- source_word: βασιλείᾳ
  choice: ìjọba
  rationale: “Ìjọba” jẹ́ ìtumọ̀ Yorùbá tó fìdí múlẹ̀, ó sì lè gba ìtumọ̀ ilẹ̀ ìjọba àti àṣẹ ọba pọ̀.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” mú iṣẹ́ oyè náà hàn kedere dípò kí a lò ó bí orúkọ lásán.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: Mèsáyà àti Ọlọ́run
  rationale: A pa ìṣọ̀kan ọ̀rọ̀-ìní méjèèjì mọ́ láì fi ìpinnu gírámà tàbí ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò sọ ní tààrà sínú ìtumọ̀.
theological_decisions:
- issue: Ohun tí ὅ ἐστιν εἰδωλολάτρης ń tọ́ka sí
  choice: 'A túmọ̀ ọ́ sí ẹni tí a ṣẹ̀ṣẹ̀ dárúkọ, ní pàtàkì ẹni oníwọra: “ẹni tí í ṣe abọ̀rìṣà.”'
  alternative: “èyí tí í ṣe ìbọ̀rìṣà,” tí ó ń tọ́ka sí ojúkòkòrò fúnra rẹ̀.
  rationale: Arọ́pò-orúkọ akọ̀-àìjẹ́-bákan mú kí gírámà náà ní àìdájú díẹ̀. Àyíká ọ̀rọ̀ àti Kólósè 3:5 ṣe àtìlẹ́yìn fún ìsopọ̀ ojúkòkòrò àti ìbọ̀rìṣà; àlàyé ìsàlẹ̀ pa àṣàyàn aláìní-ẹni náà mọ́.
- issue: Àkókò ìyọkúrò nínú ogún
  choice: “kò ní ogún kankan,” gẹ́gẹ́ bí ipò tó wà nísinsìnyí.
  alternative: “kì yóò jogún ìjọba náà.”
  rationale: Ọ̀rọ̀ Gíríìkì οὐκ ἔχει wà ní àkókò ìsinsìnyí; ìtumọ̀ náà kò yí i padà sí ọ̀rọ̀ ọjọ́ iwájú nìkan.
- issue: Ìbáṣepọ̀ “Mèsáyà àti Ọlọ́run”
  choice: A pa ọ̀rọ̀-ìní tó so Mèsáyà àti Ọlọ́run pọ̀ mọ́ gẹ́gẹ́ bí ó ṣe wà.
  alternative: Ìtumọ̀ tí yóò sọ ìpinnu pàtó kan nípa gírámà àti ìbáṣepọ̀ ẹni méjèèjì.
  rationale: Ọ̀rọ̀ náà fi àwọn méjèèjì sí abẹ́ ìjọba kan, ṣùgbọ́n ìtumọ̀ kò yẹ kí ó fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí a ń jiyàn lé gírámà náà lórí.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àtúnṣe “ẹ mọ èyí dájú, ẹ sì lóye” pa ìtẹnumọ́ Gíríìkì mọ́; àmì gígùn ya àlàyé nípa abọ̀rìṣà sọ́tọ̀ láì pa àìdájú rẹ̀ run.
