lexical_decisions:
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète hàn ní Yorùbá àdánidá, ó sì bá ìṣe abẹ́ ἵνα mu.
- source_word: αὐτὴν
  choice: ọ́ / ẹ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ìjọ nínú àyíká ọ̀rọ̀; Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ yìí.
- source_word: ἁγιάσῃ
  choice: sọ ọ́ di mímọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ sísọ ẹni di mímọ́ tàbí yíyà á sọ́tọ̀ fún Ọlọ́run mọ́.
- source_word: καθαρίσας
  choice: lẹ́yìn tí ó ti ... wẹ̀ ẹ́ mọ́
  rationale: Ó fi hàn pé ìwẹ̀nùmọ́ náà ṣáájú tàbí bá ète ọ̀rọ̀-ìṣe pàtàkì náà rìn, bí participle aorist náà ṣe lè túmọ̀ sí.
- source_word: τῷ λουτρῷ
  choice: fi ìwẹ̀nùmọ́
  rationale: ‘Fi’ ń sọ dative irinṣẹ́ di Yorùbá àdánidá; ‘ìwẹ̀nùmọ́’ mú èrò fífọ̀ àti ìwẹ̀ mọ́ra láì fi dandan sọ pé ibi ìwẹ̀ ni.
- source_word: τοῦ ὕδατος
  choice: omi
  rationale: Ó so omi mọ́ ìwẹ̀nùmọ́ ní ṣókí, gẹ́gẹ́ bí ìsopọ̀ genitive Gíríìkì náà.
- source_word: ἐν ῥήματι
  choice: pẹ̀lú ọ̀rọ̀
  rationale: ‘Pẹ̀lú’ pa àìdánilójú mọ́ bóyá ọ̀rọ̀ náà jẹ́ irinṣẹ́ tàbí ohun tó bá ìwẹ̀ náà lọ.
- source_word: ῥήματι
  choice: ọ̀rọ̀
  rationale: ‘Ọ̀rọ̀’ ní ààyè ìtumọ̀ tó gbòòrò, ó sì yẹra fún fífi dandan túmọ̀ rẹ̀ sí ìhìn, ìwàásù, tàbí ọ̀rọ̀ àkànṣe kan.
theological_decisions:
- issue: Ìbáṣepọ̀ tó wà láàárín ìwẹ̀nùmọ́, omi, àti ọ̀rọ̀ nínú àwòrán tó lè tọ́ka sí ìbatisí
  choice: Pa àwòrán ìwẹ̀ omi àti ọ̀rọ̀ mọ́ láì sọ ẹ̀kọ́ ìsìn pàtó kan di dandan.
  alternative: Túmọ̀ rẹ̀ ní tààràtà gẹ́gẹ́ bí iṣẹ́ àṣírí ìbatisí, tàbí gẹ́gẹ́ bí àfiwé lásán tí kò ní í ṣe pẹ̀lú ìbatisí.
  rationale: Èdè Gíríìkì náà lè mú ìbatisí wá sí ọkàn, ṣùgbọ́n kò dá bó ṣe yẹ kí a ṣàlàyé ipa rẹ̀ nínú ẹ̀kọ́ ìsìn pàtó.
- issue: Bóyá ῥήματι yẹ kí ó jẹ́ ‘ọ̀rọ̀’ tàbí ìtumọ̀ tóóró sí i
  choice: Lo ‘ọ̀rọ̀’ nínú ẹsẹ̀ pàtàkì.
  alternative: ‘ìhìn,’ ‘ọ̀rọ̀ tí a sọ,’ tàbí ‘ọ̀rọ̀ ìhìn rere.’
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju àwọn ìtumọ̀ pàtó wọ̀nyí lọ; ‘ọ̀rọ̀’ pa àìdánilójú rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A tún gbé ìṣètò gbólóhùn náà kalẹ̀ kí ó lè jẹ́ àdánidá ní Yorùbá, láì sọ àìdánilójú ἐν ῥήματι tàbí àwòrán ìbatisí di ẹ̀kọ́ ìsìn pàtó.
