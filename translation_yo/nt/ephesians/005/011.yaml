  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “Ẹ má sì ṣe kópa nínú” gbé ìtumọ̀ àṣẹ ìkọ̀kọ̀ ti καὶ μὴ συγκοινωνεῖτε kalẹ̀; “àwọn iṣẹ́ òkùnkùn tí kò so èso” pa ἔργοις τοῖς ἀκάρποις τοῦ σκότους mọ́; “kàkà bẹ́ẹ̀, ẹ tilẹ̀ fi wọn hàn gbangba” sì ṣàfihàn ìyàtọ̀ àti agbára àfikún ti μᾶλλον δὲ καὶ ἐλέγχετε. “Wọn” tọ́ka sí àwọn iṣẹ́ náà ní kedere, láì fi ohun míì kún ọ̀rọ̀ orísun.'
  naturalness: Yorùbá náà jẹ́ boṣewa, ó ní àmì ohùn tó péye níbi tó yẹ, ó sì rọrùn fún òǹkàwé òde òní. “Ṣe kópa nínú,” “tí kò so èso,” àti “fi wọn hàn gbangba” jẹ́ ọ̀nà ìsọ̀rọ̀ tí ó dára, tí ó sì yẹ fún àkọsílẹ̀ mímọ́.
  terminology: Àwọn ọ̀rọ̀ pàtàkì—“kópa,” “iṣẹ́,” “òkùnkùn,” “so èso,” àti “fi ... hàn gbangba”—jẹ́ ìbámu tó dára pẹ̀lú ọ̀rọ̀ Gíríìkì àti àkòrí ìmọ́lẹ̀/òkùnkùn inú àyíká ẹsẹ náà. Àlàyé ìsàlẹ̀ méjèèjì jẹ́ ohun tó yẹ, ó sì pa àwọn aṣàyàn ìtumọ̀ ti συγκοινωνεῖτε àti ἐλέγχετε mọ́.
