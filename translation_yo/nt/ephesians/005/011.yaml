id: EPH.5.11
reference: Ephesians 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: yo
  text: Ẹ má sì ṣe kópa nínú àwọn iṣẹ́ òkùnkùn tí kò so èso[a]; kàkà bẹ́ẹ̀, ẹ tilẹ̀ fi wọn hàn gbangba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ má ṣe jẹ́ alábápín nínú” tàbí “ẹ má ṣe ní àjọṣepọ̀ pẹ̀lú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ bá wọn wí” tàbí “ẹ fi ìdí ẹ̀bi wọn múlẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè ní ìbáwí ẹnu nínú, ṣùgbọ́n ní àyíká ọ̀rọ̀ yìí ó tún ní ìtumọ̀ mímú irú àwọn iṣẹ́ bẹ́ẹ̀ wá sí ìmọ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: ṣe kópa nínú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ alábápín tàbí kíkópa papọ̀ nínú ohun kan. “Ṣe kópa nínú” jẹ́ èdè Yorùbá òde òní tó ṣe kedere, ó sì fi hàn pé ẹni náà ń lọ́wọ́ nínú àwọn iṣẹ́ náà.
- source_word: ἔργοις
  choice: àwọn iṣẹ́
  rationale: “Àwọn iṣẹ́” pa ìtumọ̀ gbogbogbò ti ọ̀rọ̀ Gíríìkì mọ́, ó sì bá bí Pọ́ọ̀lù ṣe máa ń sọ nípa ìwà àti ìṣe mu.
- source_word: ἀκάρποις
  choice: tí kò so èso
  rationale: Èyí pa àkàwé èso inú ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá àdánidá, kò sì sọ ọ́ di “asán” lásán.
- source_word: σκότους
  choice: òkùnkùn
  rationale: “Àwọn iṣẹ́ òkùnkùn” fi ìbáṣepọ̀ ìní inú gbolohun Gíríìkì hàn láì pinnu bóyá ó túmọ̀ sí iṣẹ́ tí ó jẹ́ ti òkùnkùn tàbí iṣẹ́ tí a ṣe nínú òkùnkùn.
- source_word: μᾶλλον δὲ καὶ
  choice: kàkà bẹ́ẹ̀, ẹ tilẹ̀
  rationale: '“Kàkà bẹ́ẹ̀” mú ìyàtọ̀ tó lágbára wá, “ẹ tilẹ̀” sì fi agbára àfikún καὶ hàn: wọn kò kàn ní láti yẹra fún àwọn iṣẹ́ náà, wọn tún ní láti fi wọn hàn.'
- source_word: ἐλέγχετε
  choice: fi wọn hàn gbangba
  rationale: Nínú àyíká ọ̀rọ̀ tó ń sọ nípa ìmọ́lẹ̀ àti òkùnkùn, gbólóhùn yìí mú ìtumọ̀ mímú ohun tó burú wá sí ìmọ́lẹ̀ jáde, nígbà tó ṣì lè ní agbára ìbáwí.
theological_decisions:
- issue: Ìtumọ̀ ἐλέγχετε nípa àwọn iṣẹ́ búburú
  choice: fi wọn hàn gbangba
  alternative: bá wọn wí; fi ìdí ẹ̀bi wọn múlẹ̀
  rationale: Ẹsẹ 8 àti 13 fi ìmọ́lẹ̀ àti ohun tí a mú hàn ṣe àkòrí àyíká ọ̀rọ̀ náà. “Fi wọn hàn gbangba” pa ìsopọ̀ yẹn mọ́, láì dín àṣẹ náà kù sí ọ̀rọ̀ ìbáwí nìkan.
- issue: Agbára ìyàtọ̀ tó wà láàárín àwọn àṣẹ méjèèjì
  choice: má ṣe kópa ... kàkà bẹ́ẹ̀, ẹ tilẹ̀ fi wọn hàn
  alternative: má ṣe ní àjọṣepọ̀ ... ṣùgbọ́n ẹ bá wọn wí
  rationale: 'Èyí pa ìforígbárí méjì inú Gíríìkì mọ́: kí wọn yẹra fún ìkópa nínú ibi, kí wọn sì gbé ìgbésẹ̀ lòdì sí i, láì fi ọ̀nà pàtó kan kún ohun tí ẹsẹ náà sọ.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àṣẹ ọ̀pọ̀ ènìyàn “ẹ,” a pa àkàwé “òkùnkùn/èso” mọ́, a sì yẹra fún àwọn ọ̀rọ̀ ẹ̀sìn àkànṣe tí ó lè fi ẹ̀kọ́ ìjọ kan lé ẹsẹ náà lórí.
