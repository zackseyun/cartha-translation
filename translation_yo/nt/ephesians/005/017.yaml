  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: yo
  text: Nítorí èyí[a], ẹ má ṣe di aláìgbọ́n, ṣùgbọ́n ẹ lóye ohun tí Olúwa fẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí náà, ẹ má ṣe jẹ́ aláìgbọ́n.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “jẹ́,” ṣùgbọ́n “di” túbọ̀ fi ìtumọ̀ γίνεσθε hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó tọ́ka padà sí ìṣílétí tó ṣáájú, ó sì pa ìtumọ̀ ìdí tàbí àbájáde mọ́ ní Yorùbá àdánidá.
- source_word: μὴ γίνεσθε
  choice: ẹ má ṣe di
  rationale: “Di” fi ìtumọ̀ yíyípadà sí ipò kan hàn, ó sì ṣètìlẹ́yìn fún γίνεσθε ju ọ̀rọ̀ onípò “jẹ́” lọ.
- source_word: ἄφρονες
  choice: aláìlóye
  rationale: Ó sọ àìní òye àti làákàyè tó yẹ ní ọ̀nà tó ṣeé lóye, tó sì bójú mu fún àyíká ọ̀rọ̀ yìí láìfi ìtumọ̀ wèrè kún un.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó pa ìtakora tó lágbára láàárín àṣẹ òdì àti àṣẹ rere mọ́.
- source_word: συνίετε
  choice: ẹ lóye
  rationale: “Lóye” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún lílóye tàbí mímú ìtumọ̀ ohun kan dáadáa.
- source_word: τί τὸ θέλημα
  choice: ohun tí ìfẹ́ … jẹ́
  rationale: Ìṣètò yìí pa fọ́ọ̀mù ìbéèrè àìṣe-taara àti ọ̀rọ̀-orúkọ θέλημα mọ́, nígbà tó ṣì ṣeé lóye ní Yorùbá.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κύριος; a kò fi “Jésù” tàbí “Ọlọ́run” kún un nítorí Gíríìkì kò sọ ẹni tí ó jẹ́ ní pàtó nínú ẹsẹ yìí.
theological_decisions:
- issue: Ẹni tí “Olúwa” (τοῦ κυρίου) ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù; Ọlọ́run
  rationale: Àyíká lẹ́tà Éfésù lè mú kí a ka a sí Jésù, ṣùgbọ́n ẹsẹ náà fúnra rẹ̀ sọ κύριος nìkan; ìtumọ̀ náà kò fi ìdánimọ̀ tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó kún un.
- issue: Agbára ìkìlọ̀ μὴ γίνεσθε
  choice: ẹ má ṣe di
  alternative: ẹ má ṣe jẹ́; ẹ jáwọ́ nínú jíjẹ́
  rationale: “Ẹ má ṣe di” pa èrò wíwọ inú ipò kan mọ́, kò sì dá lé e pé àwọn olùgbọ́ ti jẹ́ aláìlóye tẹ́lẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo “ẹ” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, “aláìlóye” sì yẹra fún ìtumọ̀ líle tàbí ẹ̀gàn tí “aṣiwèrè” lè ní.
