id: EPH.5.32
reference: Ephesians 5:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: yo
  text: Ohun ìjìnlẹ̀ ńlá ni èyí, ṣùgbọ́n èmi ń sọ̀rọ̀ nípa Mèsáyà àti ìjọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún òtítọ́ Ọlọ́run tí ó ti farapamọ́ ṣáájú tí a sì ti ṣí payá; kò dín ìtumọ̀ náà kù sí ohun tí ó kan ṣòro láti lóye.
- source_word: μέγα
  choice: ńlá
  rationale: Ó pa ìtumọ̀ tààràtà ti ‘ńlá’ mọ́, ó sì lè tọ́ka sí bí ohun náà ti tóbi tàbí bí ó ti ṣe pàtàkì láìfi ìtumọ̀ ‘jìnlẹ̀ gan-an’ kún un.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré hàn láti inú gbólóhùn nípa ohun ìjìnlẹ̀ náà sí àlàyé Pọ́ọ̀lù nípa ohun tí ó ń tọ́ka sí.
- source_word: λέγω
  choice: èmi ń sọ̀rọ̀
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì bá ọ̀nà àlàyé inú gbólóhùn náà mu.
- source_word: εἰς
  choice: nípa
  rationale: Lẹ́yìn λέγω, ọ̀rọ̀ náà túmọ̀ sí ohun tí ọ̀rọ̀ ń tọ́ka sí; ‘nípa’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Ní àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, nítorí náà ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde.
- source_word: ἐκκλησίαν
  choice: ìjọ
  rationale: Níhìn-ín ó ń tọ́ka sí àpapọ̀ àwọn ènìyàn Ọlọ́run, ‘ìjọ’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù lọ fún ìtumọ̀ yìí.
theological_decisions:
- issue: Ohun tí ‘ohun ìjìnlẹ̀ yìí’ ń tọ́ka sí nínú àfiwé ìgbéyàwó, Mèsáyà, àti ìjọ
  choice: A túmọ̀ gbólóhùn náà ní tààràtà, láìsọ pàtó nínú ọ̀rọ̀ àkọ́kọ́ bóyá ohun ìjìnlẹ̀ náà ni ìgbéyàwó fúnra rẹ̀, Jẹ́nẹ́sísì 2:24, tàbí ìbáṣepọ̀ àpẹẹrẹ tí ó ń tọ́ka sí Mèsáyà àti ìjọ.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìṣọ̀kan ara kan nínú ìgbéyàwó, gẹ́gẹ́ bí ọ̀rọ̀ Jẹ́nẹ́sísì 2:24, tàbí gẹ́gẹ́ bí ìtumọ̀ àpẹẹrẹ ìgbéyàwó nípa Mèsáyà àti ìjọ.
  rationale: Gíríìkì fi àwọn àlàyé wọ̀nyí sílẹ̀ láìyan ọ̀kan ṣoṣo; ìtumọ̀ náà pa àìdánilójú àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàdojútó, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Ìṣètò ‘Ohun ìjìnlẹ̀ ńlá ni èyí’ jẹ́ àdánidá ní Yorùbá, ó sì pa ipò μέγα gẹ́gẹ́ bí àpèjúwe mọ́. A lo àmì ohùn níbi tí ó bá yẹ.
