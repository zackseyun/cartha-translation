id: EPH.5.3
reference: Ephesians 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: yo
  text: Ṣùgbọ́n kí a má tilẹ̀ dárúkọ ìwà àgbèrè, tàbí gbogbo ìwà àìmọ́, tàbí ojúkòkòrò[b], láàárín yín[a], gẹ́gẹ́ bí ó ti yẹ fún àwọn ènìyàn mímọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a má tilẹ̀ mẹ́nu kàn án láàárín yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwọra.”
    reason: lexical_alternative
  - marker: c
    text: “Àwọn ènìyàn mímọ́” níbí túmọ̀ sí àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn ènìyàn tí Ọlọ́run yà sọ́tọ̀ fún ara rẹ̀, kì í ṣe ẹgbẹ́ kan tí a sọ di ẹni mímọ́ ní àkókò tó tẹ̀ lé e.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: àgbèrè
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìwà ìbálòpọ̀ tí kò bófin Ọlọ́run mu; nínú àyíká yìí, kò yẹ kí a dín un kù sí ìbálòpọ̀ ṣáájú ìgbéyàwó nìkan.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ onírẹ̀lẹ̀ hàn sí ọ̀rọ̀ ìṣírí tó ṣáájú.
- source_word: ἀκαθαρσία πᾶσα
  choice: gbogbo ìwà àìmọ́
  rationale: Ó pa ìtumọ̀ ìwà tí kò mọ́ ní gbogbo ọ̀nà mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ἢ
  choice: tàbí
  rationale: Ó pa ìsọ̀kan aṣàyàn inú Gíríìkì mọ́ láì yí i sí ‘àti.’
- source_word: πλεονεξία
  choice: ojúkòkòrò
  rationale: Ó túmọ̀ sí ìfẹ́ oníwọra láti ní púpọ̀ sí i tàbí láti gba ohun ẹlòmíràn; a kò dín un kù sí ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀.
- source_word: μηδὲ ὀνομαζέσθω
  choice: kò tilẹ̀ gbọdọ̀ jẹ́ ohun tí a ń dárúkọ
  rationale: Ó pa agbára àṣẹ ìdènà àti ìtẹnumọ́ ‘kódà/kò tilẹ̀’ mọ́, nígbà tó tún fi àìṣedéédé passive Gíríìkì hàn.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó tọ́ka sí ohun tó ń ṣẹlẹ̀ nínú àwùjọ àwọn onígbàgbọ́, kì í ṣe inú ọkàn ẹnì kọ̀ọ̀kan nìkan.
- source_word: καθὼς πρέπει
  choice: gẹ́gẹ́ bí ó ti yẹ
  rationale: Ó ṣàfihàn ìwà tó bá ipò wọn mu ní èdè Yorùbá adayeba.
- source_word: ἁγίοις
  choice: àwọn ènìyàn mímọ́
  rationale: Ó tọ́ka sí gbogbo àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn tí a yà sọ́tọ̀ fún Ọlọ́run, kì í ṣe ẹgbẹ́ àwọn tí a sọ di ‘ẹni mímọ́’ ní àkókò tó tẹ̀ lé e.
theological_decisions:
- issue: Ìtumọ̀ πλεονεξία nínú àkójọ ẹ̀ṣẹ̀ tó sún mọ́ ọ̀rọ̀ ìbálòpọ̀
  choice: ojúkòkòrò ní ìtumọ̀ gbòòrò
  alternative: ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ oníwọra
  rationale: Lílo ọ̀rọ̀ náà nínú àwọn lẹ́tà Paulu gbòòrò ju ọ̀rọ̀ ìbálòpọ̀ lọ; ẹsẹ yìí kò fún wa ní àṣẹ láti dín ìtumọ̀ rẹ̀ kù.
- issue: Àwọn tí ἁγίοις ń tọ́ka sí
  choice: gbogbo àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn ènìyàn mímọ́ Ọlọ́run
  alternative: àwọn ẹni mímọ́ tí a dá mọ̀ ní ọ̀nà ìsìn ní ìgbà tó tẹ̀ lé e
  rationale: Nínú lílo Paulu, ọ̀rọ̀ náà jẹ́ orúkọ àwùjọ fún àwọn tí Ọlọ́run yà sọ́tọ̀ fún ara rẹ̀.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Àgbèrè’ àti ‘ojúkòkòrò’ jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lè lóye, nígbà tí ‘àwọn ènìyàn mímọ́’ yàgò fún àìgbọ́ye tó lè wá láti inú lílo ‘ẹni mímọ́’ nìkan.
