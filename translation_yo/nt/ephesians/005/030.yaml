  verdict: revise
  source_fidelity: Ìtumọ̀ àkọ́kọ́ ń pa ìbátan ìdí ti ὅτι àti àwòrán Pọ́ọ̀lù nípa ara Kristi mọ́. Ṣùgbọ́n μέλη jẹ́ ọ̀pọ̀, nítorí náà ‘àwọn ẹ̀yà’ túmọ̀ ọ̀pọ̀ náà hàn dáadáa. Àlàyé ìsàlẹ̀ tún yẹ kí ó fi ‘láti inú’ hàn fún ἐκ nínú kíkà gígùn náà, dípò ‘nínú.’
  naturalness: ‘Àwa jẹ́ àwọn ẹ̀yà ara rẹ̀’ jẹ́ Yorùbá boṣewa, ó sì ṣe kedere pé àwọn onígbàgbọ́ ni a ń pè ní àwọn apá/ẹ̀yà tó jẹ́ ara kan. Ó tún yẹra fún ìfẹ̀hónúhàn tí ‘ẹ̀yà’ ní ẹyọ kan lè mú wá.
  terminology: ‘Ara’ yẹ fún σῶμα, ‘ẹ̀yà ara’ sì yẹ fún μέλη nínú àwòrán ara Pọ́ọ̀lù. ‘Ẹran ara’ àti ‘egungun’ nínú àlàyé ìsàlẹ̀ ń tọ́ka dáadáa sí σάρξ àti ὀστέα, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
  issues:
  - severity: medium
    issue: Ọ̀rọ̀ ‘ẹ̀yà’ nínú ìtumọ̀ pàtàkì wà ní ẹyọ kan.
    rationale: Μέλη jẹ́ ọ̀pọ̀. Bí ó tilẹ̀ jẹ́ pé Yorùbá lè má samisi ọ̀pọ̀ nígbà gbogbo, ‘àwọn ẹ̀yà ara rẹ̀’ jẹ́ kedere síi, ó sì dá ìtumọ̀ orísun dúró.
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ lo ‘nínú’ fún kíkà gígùn náà.
    rationale: Kíkà ìyàtọ̀ náà ní ἐκ (‘láti inú’/‘nínú ... wá’), kì í ṣe ἐν (‘nínú’). ‘Láti inú’ pa ìbáṣepọ̀ orísun náà mọ́.
