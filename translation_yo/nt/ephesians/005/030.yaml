translation:
  language: yo
  text: nítorí pé àwa jẹ́ àwọn ẹ̀yà ara rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan fi kún un pé, “láti inú ẹran ara rẹ̀ àti láti inú egungun rẹ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ń fi ìdí tàbí àlàyé fún ọ̀rọ̀ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ ìdí ní Yorùbá òde òní.
- source_word: μέλη
  choice: ẹ̀yà
  rationale: Nínú àwòrán ara tí Pọ́ọ̀lù lò, ó túmọ̀ sí àwọn apá tí ara kan ní; ‘ẹ̀yà ara’ dá àwòrán ara àti ìṣọ̀kan àwọn onígbàgbọ́ mọ́.
- source_word: ἐσμὲν
  choice: àwa jẹ́
  rationale: Ó túmọ̀ ìṣe ọ̀rọ̀ ìsinsìnyí ‘a jẹ́’ ní kedere; fífi ‘àwa’ hàn tẹnu mọ́ arọ́pò-orúkọ tó wà nínú ọ̀rọ̀ Gíríìkì.
- source_word: σώματος
  choice: ara
  rationale: Èyí ni ìtumọ̀ tààrà, ó sì pa àwòrán ìjọ gẹ́gẹ́ bí ara Kristi mọ́.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka sí Kristi nínú àyíká ọ̀rọ̀; ‘rẹ̀’ ni ọ̀nà Yorùbá àdánidá láti fi ìní yìí hàn láìfi ohun tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Bóyá kí a fi ọ̀rọ̀ gígùn ti ọ̀pọ̀ ìwé àfọwọ́kọ kan ní, ‘nínú ẹran ara rẹ̀ àti nínú egungun rẹ̀,’ sínú ẹsẹ náà
  choice: 'A túmọ̀ kìkì ọ̀rọ̀ SBLGNT: ‘nítorí pé àwa jẹ́ ẹ̀yà ara rẹ̀.’'
  alternative: ‘nítorí pé àwa jẹ́ ẹ̀yà ara rẹ̀, nínú ẹran ara rẹ̀ àti nínú egungun rẹ̀.’
  rationale: Ọ̀rọ̀ orísun tí a pèsè ní kíkà kúkúrú, èyí tí a gbà pé ó ṣeé ṣe jù pé ó jẹ́ ti ìbẹ̀rẹ̀. Ó ṣeé ṣe kí kíkà gígùn jẹ́ àfikún tó fara wé Jẹ́nẹ́sísì 2:23, tí àyíká ọ̀rọ̀ náà ti ń tọ́ka sí. A fi kíkà gígùn sínú àlàyé ìsàlẹ̀ láti jẹ́ kó hàn gbangba, dípò fífi í sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò; ‘ẹ̀yà ara’ pa àwòrán ara mọ́ láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹ̀gbẹ́ kan.
