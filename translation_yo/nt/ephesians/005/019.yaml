  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λαλοῦντες ⸀ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ⸀ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: yo
  text: Ẹ máa bá ara yín sọ̀rọ̀ nípasẹ̀ àwọn sáàmù, orin ìyìn, àti orin tẹ̀mí[a]; ẹ máa kọrin, kí ẹ sì máa fi ọkàn yín kọ orin sí Olúwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “láàárín ara yín” tàbí “sí ara yín.” Ọ̀rọ̀ arọ́pò-afárá-ẹni Gíríìkì náà níbí ni a sábà máa ń lóye ní ìtumọ̀ ìbáṣepọ̀: “sí ara yín ní ọ̀kọ̀ọ̀kan.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ máa kọ orin ìyìn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkọ orin ìyìn tàbí ṣíṣe orin aládùn, láìjẹ́ pé ó ń sọ dandan pé kí a lo ohun èlò orin.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: Ẹ máa ... sọ̀rọ̀
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ‘sísọ̀rọ̀’ mọ́, ó sì bá àṣẹ tí àwọn ọ̀rọ̀ alábápín inú àyíká ẹsẹ̀ náà ń ṣàlàyé mu.
- source_word: ἑαυτοῖς
  choice: bá ara yín
  rationale: Nínú ọ̀pọ̀ ènìyàn, ọ̀rọ̀ arọ́pò afara-ẹni yìí sábà máa ń ní ìtumọ̀ ìṣe láàárín ara wọn; gbólóhùn Yorùbá yìí ṣe àfihàn ìtumọ̀ náà láìpa àwọn àṣàyàn míì rẹ́.
- source_word: ψαλμοῖς
  choice: àwọn sáàmù
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún sáàmù, ó sì lè tọ́ka sí Sáàmù inú Ìwé Mímọ́ tàbí orin bí sáàmù láìfi ààlà tí Gíríìkì kò fi sí i.
- source_word: ὕμνοις
  choice: orin ìyìn
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ orin tí a fi ń yin Ọlọ́run, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí ‘sáàmù’ àti ‘orin.’
- source_word: ᾠδαῖς πνευματικαῖς
  choice: orin tẹ̀mí
  rationale: Ó túmọ̀ ajẹtífù πνευματικαῖς ní ṣókí, láìsọ ní pàtó pé Ẹ̀mí ló mí sí gbogbo orin náà ju bí ọ̀rọ̀ orísun ṣe sọ lọ.
- source_word: ᾄδοντες
  choice: ẹ máa kọrin
  rationale: Ìtumọ̀ tààrà àti àdánidá fún iṣẹ́ kíkọrin ni.
- source_word: ψάλλοντες
  choice: ẹ sì máa ... kọ orin
  rationale: Ó pa èrò orin aládùn tàbí orin ìyìn mọ́, ṣùgbọ́n kò sọ pé ohun èlò orin gbọ́dọ̀ wà.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: fi ọkàn yín
  rationale: Fífi ‘ọkàn’ ṣe ohun èlò tàbí ọ̀nà ìṣe jẹ́ Yorùbá àdánidá fún dative Gíríìkì náà, ó sì fi hàn pé orin náà wá láti inú ọkàn.
- source_word: τῷ κυρίῳ
  choice: sí Olúwa
  rationale: ‘Sí’ fi hàn pé Olúwa ni orin náà ń tọ̀ sí; ‘Olúwa’ sì pa κύριος mọ́ láìfi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kún un.
theological_decisions:
- issue: Ìtumọ̀ ψάλλοντες nípa lílo ohun èlò orin
  choice: A túmọ̀ rẹ̀ sí ‘kọ orin’ láìsọ pé ohun èlò orin wà.
  alternative: ‘kọ orin ìyìn’ tàbí ‘lu ohun èlò orin’
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní ìtàn ìtumọ̀ pípa okùn ohun èlò orin, ṣùgbọ́n nínú Koinē àti àyíká yìí kò béèrè ohun èlò orin dandan. Ìtumọ̀ yìí kò gbé ẹ̀kọ́ ẹ̀sìn kan kalẹ̀ fún tàbí lòdì sí lílo ohun èlò orin.
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: A fi ‘Olúwa’ sílẹ̀ gẹ́gẹ́ bí orísun ṣe sọ.
  alternative: Kí a sọ ní pàtó pé ‘Olúwa Jésù’ ni
  rationale: Àyíká Éfésù lè tọ́ka sí Kristi, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ sọ κύριος nìkan; nítorí náà a kò fi ohun tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọlọ́wọ̀, àdánidá tí òǹkàwé òde òní lè lóye. A pa àtòjọ mẹ́ta—sáàmù, orin ìyìn, àti orin tẹ̀mí—mọ́, a sì yà ᾄδοντες àti ψάλλοντες sọ́tọ̀ bí orísun ṣe ṣe.
