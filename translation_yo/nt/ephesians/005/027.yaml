review_pass:
  verdict: revise
  source_fidelity: The draft retains the two purpose clauses, the emphatic/reflexive force of αὐτὸς ἑαυτῷ, the corporate sense of ἐκκλησία, and both the negative purity imagery and positive predicates. However, “síwájú ara rẹ̀” is less exact for the dative reflexive (‘for/to himself’) and makes the presentation sound primarily locative (‘before himself’).
  naturalness: “Ìlà kíká” is not a natural or clear Standard Yoruba expression for a wrinkle; it more readily suggests a line for reading/counting. “Ìlà ìpẹ̀” conveys a crease/wrinkle in the paired concrete imagery more naturally. “Mú ... wá fún ara rẹ̀” is a more idiomatic rendering of the reflexive presentation than “mú ... wá síwájú ara rẹ̀.”
  terminology: Retain “ìjọ,” “mímọ́,” and “aláìlẹ́bi,” which are established and appropriately preserve the verse’s corporate and purity language. “Àbààwọ́n” remains suitable for σπίλος (‘spot/stain’).
  issues:
  - severity: medium
    issue: The reflexive dative is rendered as “síwájú ara rẹ̀.”
    rationale: ἑαυτῷ is dative, meaning ‘to/for himself.’ Although ‘before himself’ is possible as an interpretive presentation idiom, “fún ara rẹ̀” preserves the Greek relation without adding a locative nuance.
  - severity: medium
    issue: “Ìlà kíká” is used for ῥυτίς.
    rationale: This expression is not a clear natural equivalent of ‘wrinkle’ in this context. “Ìlà ìpẹ̀” better communicates the concrete crease/wrinkle imagery and pairs intelligibly with ‘spot.’
  revised_text: kí òun fúnra rẹ̀ lè mú ìjọ náà wá fún ara rẹ̀ nínú ògo[a], láìní àbààwọ́n[c] tàbí ìlà ìpẹ̀, tàbí ohunkóhun tó jọ bẹ́ẹ̀[b], ṣùgbọ́n kí ó lè jẹ́ mímọ́ àti aláìlẹ́bi.
