  to: kí òun fúnra rẹ̀ lè mú ìjọ náà wá fún ara rẹ̀ nínú ògo[a], láìní àbààwọ́n[c] tàbí ìlà ìpẹ̀, tàbí ohunkóhun tó jọ bẹ́ẹ̀[b], ṣùgbọ́n kí ó lè jẹ́ mímọ́ àti aláìlẹ́bi.
