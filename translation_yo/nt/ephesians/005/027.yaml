id: EPH.5.27
reference: Ephesians 5:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: yo
  text: kí òun fúnra rẹ̀ lè mú ìjọ náà wá fún ara rẹ̀ nínú ògo[a], láìní àbààwọ́n[c] tàbí ìlà ìpẹ̀, tàbí ohunkóhun tó jọ bẹ́ẹ̀[b], ṣùgbọ́n kí ó lè jẹ́ mímọ́ àti aláìlẹ́bi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ológo”; ajẹtífù Gíríìkì náà lè tọ́ka sí ànímọ́ (“ológo”) tàbí sí ipò (“nínú ògo”).
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tàbí irú ohunkóhun bẹ́ẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “láìní àbùkù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: lè mú ... wá síwájú
  rationale: Ọ̀rọ̀ yìí fi ète hàn nínú gbólóhùn ἵνα, ó sì pa àwòrán mímú ìjọ wá fún ìfihàn mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: αὐτὸς ἑαυτῷ
  choice: òun fúnra rẹ̀ ... síwájú ara rẹ̀
  rationale: “Òun fúnra rẹ̀” pa ìtẹnumọ́ αὐτός mọ́, “ara rẹ̀” sì pa agbára arọ́pò-orúkọ afẹ̀hìntì ἑαυτῷ mọ́.
- source_word: ἔνδοξον
  choice: nínú ògo
  rationale: Ó ṣàfihàn ipò ológo tí ìjọ wà nígbà tí a mú un wá; ó tún jẹ́ ọ̀nà Yorùbá tó bójú mu ju àkójọpọ̀ ajẹtífù líle lọ.
- source_word: ἐκκλησίαν
  choice: ìjọ náà
  rationale: Nínú ọ̀rọ̀ Pọ́ọ̀lù níbí, ó ń tọ́ka sí àwọn ènìyàn Ọlọ́run lápapọ̀; “ìjọ” ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ìtumọ̀ yìí.
- source_word: μὴ ἔχουσαν σπίλον
  choice: láìní àbààwọ́n
  rationale: “Láìní” sọ ipò tí apá alábápín náà ń ṣàpèjúwe ní Yorùbá àdánidá; “àbààwọ́n” sì pa àwòrán àmì tàbí àbùkù mọ́.
- source_word: ῥυτίδα
  choice: ìlà kíká
  rationale: Ọ̀rọ̀ yìí jẹ́ àpèjúwe Yorùbá òde òní tó ṣe kedere fún wrinkle tàbí crease, ó sì pa àwòrán ara/ìyàwó inú ẹsẹ náà mọ́.
- source_word: ἤ τι τῶν τοιούτων
  choice: tàbí ohunkóhun tó jọ bẹ́ẹ̀
  rationale: Ó pa ìtumọ̀ gbòòrò tí ó kọjá àpẹẹrẹ méjèèjì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: ἁγία
  choice: mímọ́
  rationale: “Mímọ́” ni ìtumọ̀ Yorùbá tí a mọ̀ dáadáa, ó sì pa ìwúwo ẹ̀sìn àti ìwà ti ἁγία mọ́.
- source_word: ἄμωμος
  choice: aláìlẹ́bi
  rationale: Ó mú apá ìtumọ̀ àìní ẹ̀sùn tàbí àléébù jáde, nígbà tí “àbààwọ́n” tó ṣáájú ti pa àwòrán àbùkù ara mọ́.
theological_decisions:
- issue: Àwòrán pé Kristi fúnra rẹ̀ mú ìjọ wá síwájú ara rẹ̀
  choice: A pa “òun fúnra rẹ̀ ... síwájú ara rẹ̀” mọ́.
  alternative: Kí a mú un rọrùn sí “kí ó lè mú ìjọ wá,” tàbí kí a sọ ní pàtó pé ó mú un wá síwájú Ọlọ́run.
  rationale: Gíríìkì ní αὐτός onítẹnumọ́ àti ἑαυτῷ afẹ̀hìntì. Ìtumọ̀ náà kò yanjú ẹni míì tí a lè rò pé ìfihàn náà wà níwájú rẹ̀, bẹ́ẹ̀ ni kò dín àwòrán ọkọ àti ìyàwó kù.
- issue: Àwọn àwòrán ìwẹ̀nùmọ́ ìjọ
  choice: A lo “àbààwọ́n tàbí ìlà kíká ... mímọ́ àti aláìlẹ́bi.”
  alternative: “Àbùkù tàbí ìlà ogbó ... mímọ́ àti láìní àbùkù.”
  rationale: Èyí pa àwòrán gidi ti ara/ìyàwó àti èdè ìwà mímọ́ mọ́ lẹ́gbẹ̀ẹ́ ara wọn, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo “ìlà kíká” dípò ọ̀rọ̀ àtijọ́ tí ọ̀pọ̀ òǹkàwé òde òní lè má lóye; a kò sì fi abo tàbí akọ kún arọ́pò-orúkọ “ó,” nítorí Yorùbá kò fi akọ-abo hàn níbẹ̀.
