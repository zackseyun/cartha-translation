  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe di alábápín wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “ẹ má ṣe kópa pọ̀ pẹ̀lú wọn” tàbí “ẹ má ṣe ní ìpín pọ̀ pẹ̀lú wọn.” Nínú àyíká ọ̀rọ̀, èyí ń tọ́ka sí kíkópa nínú ìwà ẹ̀ṣẹ̀ wọn tàbí níní ìpín nínú àwọn àbájáde ìwà ẹ̀ṣẹ̀ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: ẹ má ṣe
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣèwọ̀ fún ọ̀pọ̀ ènìyàn, ó sì bá ẹni kejì ọ̀pọ̀ nínú γίνεσθε mu.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìṣèwọ̀ yìí jẹ́ àbájáde ìkìlọ̀ tó ṣáájú ní ẹsẹ 3–6.
- source_word: γίνεσθε
  choice: di
  rationale: Ó pa ìtumọ̀ ‘di’ tàbí ‘wá sí ipò kan’ mọ́, dípò kí a túmọ̀ rẹ̀ bí ipò tí ó dúró ṣinṣin pé ‘jẹ́’.
- source_word: συμμέτοχοι
  choice: alábàáṣepọ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tó ń ní ìpín tàbí tó ń kópa pọ̀ pẹ̀lú ẹlòmíràn; ‘alábàáṣepọ̀’ jẹ́ èdè Yorùbá òde òní tó ṣe kedere, tó sì yẹ fún àyíká yìí.
- source_word: αὐτῶν
  choice: pẹ̀lú wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí àwọn ènìyàn tí a mẹ́nu kàn ṣáájú. ‘Pẹ̀lú wọn’ jẹ́ àdánidá lẹ́yìn ‘alábàáṣepọ̀’ láì fi ‘nínú iṣẹ́ wọn’ kún ohun tí Gíríìkì sọ ní tààrà.
theological_decisions:
- issue: Ìwọ̀n ohun tí συμμέτοχοι αὐτῶν túmọ̀ sí pé kí wọn má ṣe ní ìpín nínú rẹ̀
  choice: A pa ìṣèwọ̀ gbogbogbò mọ́ pé kí wọn má ṣe di alábàáṣepọ̀ pẹ̀lú àwọn ènìyàn náà, láì sọ ohun tí wọ́n ń pín ní pàtó.
  alternative: Ẹ má ṣe kópa nínú àwọn ohun wọ̀nyí; ẹ má ṣe ní ìpín nínú iṣẹ́ wọn.
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìwà ẹ̀ṣẹ̀ àti àbájáde rẹ̀, ṣùgbọ́n Gíríìkì lo ‘wọn,’ ìyẹn àwọn ènìyàn, kò sì sọ ‘àwọn ohun wọ̀nyí’ tàbí ‘iṣẹ́ wọn’ ní tààrà. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
translation_notes:
  register: Èdè Yorùbá tó ṣe kedere, tó ní iyì, tí ó sì jẹ́ ti òde òní ni a lò. ‘Ẹ’ bá ẹni kejì ọ̀pọ̀ nínú Gíríìkì mu; a sì lo ‘alábàáṣepọ̀’ láti yẹra fún gbólóhùn tí kò wọ́pọ̀ tàbí èdè ẹ̀sìn tó ti gbó.
