  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ìṣèwọ̀ (μὴ), ìfẹ̀sẹ̀mulẹ̀ ọ̀rọ̀ tó ṣáájú (οὖν), àti ìtumọ̀ ìbẹ̀rẹ̀-ipò nínú γίνεσθε (‘di’). Ṣùgbọ́n ‘alábàáṣepọ̀ pẹ̀lú wọn’ lè ní ìró alábàáṣiṣẹ́ tàbí ìbáṣepọ̀ ìṣòwò ní Yorùbá òde òní. ‘Alábápín wọn’ sún mọ́ συμμέτοχοι αὐτῶν ju, ó sì pa ohun tí wọ́n ń pín mọ́ ní àìsọ pàtó.
  naturalness: ‘Nítorí náà, ẹ má ṣe di alábápín wọn’ jẹ́ gbolohun Yorùbá tó rọrùn, tó ní iyì, tí ó sì yẹ fún ìforígbárí Pọ́ọ̀lù. Kí a má fi ‘pẹ̀lú wọn’ kún ‘alábápín wọn’ tún mú un kúrò nínú ìtúnwí tí kò pọndandan.
