  rationale: A tún ìṣètò gbolohun ṣe kí ó lè jẹ́ Yorùbá rọrùn àti ìbágbépọ̀, láìyí ìtumọ̀ tàbí ìbáṣepọ̀ àwọn apá Gíríìkì padà. ‘Àní’ ṣì ń ṣàfihàn καὶ ní ipa ìfaramọ́, ‘wọ́n’ sì ṣì jẹ́ aláìlórúkọ gẹ́gẹ́ bí αὐτῶν.
