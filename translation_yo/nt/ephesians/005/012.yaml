source:
  edition: SBLGNT
  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: yo
  text: Nítorí pé ó jẹ́ ohun ìtìjú àní láti sọ̀rọ̀ nípa àwọn ohun tí wọ́n ń ṣe ní ìkọ̀kọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí wọ́n ń ṣe ní ìkọ̀kọ̀.”
    reason: Àtúnṣe ọ̀rọ̀ tó ṣeé lò fún τὰ ... γινόμενα ὑπ’ αὐτῶν, tí ó sọ gbólóhùn náà di ohun kan ṣoṣo dípò ‘àwọn ohun.’
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó ń fi ìdí ọ̀rọ̀ ìṣílétí tó ṣáájú múlẹ̀, ó sì pa ìsopọ̀ àríyànjiyàn Paulu mọ́.
- source_word: τὰ ... γινόμενα
  choice: àwọn ohun tí wọ́n ń ṣe
  rationale: Àpilẹ̀kọ pẹ̀lú participle dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ fún àwọn ìṣe; ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì mú ipa ìṣe tí ó ń lọ lọ́wọ́ hàn láìfi ohun míì kún un.
- source_word: κρυφῇ
  choice: ní ìkọ̀kọ̀
  rationale: Ó túmọ̀ sí pé wọ́n ṣe àwọn ohun náà ní ọ̀nà tí a fi pamọ́; ‘ní ìkọ̀kọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ὑπ’ αὐτῶν
  choice: tí wọ́n ń ṣe
  rationale: Ìrísí ọ̀rọ̀ Yorùbá yìí fi àwọn aṣèṣe hàn nípasẹ̀ ‘wọ́n’ láìdárúkọ àwọn tí ọ̀rọ̀ náà ń tọ́ka sí, bí Gíríìkì náà ṣe fi pronoun sílẹ̀.
- source_word: αἰσχρόν
  choice: ohun ìtìjú
  rationale: Ó pa agbára ìdájọ́ ìwà rere ti αἰσχρόν mọ́ ní èdè Yorùbá òde òní tí gbogbo ènìyàn lè lóye.
- source_word: καὶ λέγειν
  choice: àní láti sọ̀rọ̀ nípa wọn
  rationale: ‘Àní’ mú agbára ascensive ti καί (‘kódà/even’) jáde, ‘sọ̀rọ̀ nípa wọn’ sì jẹ́ ọ̀nà àdánidá láti sọ pé a mẹ́nu kan àwọn ohun náà.
theological_decisions:
- issue: Ibi tí αὐτῶν ń tọ́ka sí
  choice: Fi í sílẹ̀ gẹ́gẹ́ bí ‘wọ́n’ láìsọ àwọn tí wọ́n jẹ́ ní kedere nínú ẹsẹ náà.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘àwọn aláìgbọ́ràn’ tàbí ‘àwọn ọmọ àìgbọ́ràn.’
  rationale: Àyíká ọ̀rọ̀ ló ń fi ẹni tí pronoun náà ń tọ́ka sí hàn. Dídárúkọ wọn nínú ẹsẹ yìí yóò fi àlàyé àyíká kún ọ̀rọ̀ Gíríìkì dípò kí a túmọ̀ ohun tí ó wà níbẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá jẹ́ ti ẹ̀dá. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a pa pronoun àti ìfarapamọ́ inú Gíríìkì mọ́.
