revisions:
- from: Ẹ má sì ṣe fi ọtí wáìnì mú ara yín yó, nítorí ìwà wọ̀bìà wà nínú rẹ̀; ṣùgbọ́n ẹ jẹ́ kí Ẹ̀mí kún inú yín.[a]
  to: Ẹ má sì ṣe mú ọtí wáìnì yó, nítorí ìwà àìníjàánu wà nínú rẹ̀; ṣùgbọ́n ẹ kún fún Ẹ̀mí.[a]
  rationale: A tún ìbẹ̀rẹ̀ gbolohun ṣe sí ìlò Yorùbá tí ó wọ́pọ̀, láìyí ìkìlọ̀ lòdì sí mímu wáìnì dé ìmúyó padà. A rọ́pò “ìwà wọ̀bìà” pẹ̀lú “ìwà àìníjàánu” fún ìtumọ̀ ἀσωτία tí ó ṣe kedere síi. A lo “ẹ kún fún Ẹ̀mí” gẹ́gẹ́ bí ìtumọ̀ taara, àdánidá fún àṣẹ pásífù náà; àlàyé ìsàlẹ̀ sì ń pa ìfẹ̀hónúhàn tó wà nínú ἐν πνεύματι mọ́ láìpinnu rẹ̀ ju bó ṣe yẹ lọ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:27Z'
