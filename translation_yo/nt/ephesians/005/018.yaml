id: EPH.5.18
reference: Ephesians 5:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: yo
  text: Ẹ má sì ṣe mú ọtí wáìnì yó, nítorí ìwà àìníjàánu wà nínú rẹ̀; ṣùgbọ́n ẹ kún fún Ẹ̀mí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n ẹ kún nínú Ẹ̀mí.” Àwọn kan lóye rẹ̀ ní gbogbogbòò sí “ṣùgbọ́n ẹ kún nínú ẹ̀mí.”
    reason: alternative_reading
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: fi ọtí wáìnì mú ara yín yó
  rationale: Ìṣe àṣẹ pẹ̀lú μή jẹ́ ìkìlọ̀ pé kí wọ́n má ṣe mú ara wọn yó. Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì fi ìtumọ̀ ìwọ inú ọ̀mùtí hàn.
- source_word: οἴνῳ
  choice: ọ̀tí wáìnì
  rationale: Dátífù náà ń tọ́ka sí ohun tí ó ń múni yó; “ọ̀tí wáìnì” jẹ́ ọ̀nà tí ó ṣe kedere láti sọ irú ọtí tí Gíríìkì pè ní οἶνος.
- source_word: ἐν ᾧ
  choice: nínú rẹ̀
  rationale: Ó dá ìbáṣepọ̀ arọ́pò-orúkọ mọ́ ohun tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, láìfi ìtumọ̀ míì kún un.
- source_word: ἀσωτία
  choice: ìwà wọ̀bìà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìgbé ayé tí kò ní ìjánu, tí ó sì ń ṣòfò; “ìwà wọ̀bìà” jẹ́ èdè Yorùbá tí ó ṣe kedere, tí ó sì pa agbára ìkìlọ̀ ìwà rere náà mọ́.
- source_word: πληροῦσθε
  choice: ẹ jẹ́ kí ... kún inú yín
  rationale: Fọ́ọ̀mù pásífù àṣẹ tí ó wà ní àsìkò ìsinsìnyí ń pe fún ipò tàbí ìṣe tí ń bá a lọ. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ pé kí wọn gba ìkúnwọ̀n náà mọ́.
- source_word: ἐν πνεύματι
  choice: kí Ẹ̀mí kún inú yín
  rationale: Nínú àyíká ọ̀rọ̀ náà, πνεύματι ṣeé ṣe jù lọ láti tọ́ka sí Ẹ̀mí Mímọ́. Ìtumọ̀ yìí bá ìlò Yorùbá mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú bóyá ἐν ń sọ ohun tí ó kún inú wọn, agbára tí ó ń ṣe é, tàbí ààyè ìgbé ayé mọ́.
theological_decisions:
- issue: Ohun tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí (Ẹ̀mí Mímọ́)
  alternative: ẹ̀mí, tàbí ẹ̀mí yín
  rationale: Àyíká ìkìlọ̀ Paulu mú kí ìtọ́ka sí Ẹ̀mí Mímọ́ ṣeé ṣe jù, bí ó tilẹ̀ jẹ́ pé àpilẹ̀kọ kò sí níwájú πνεύματι. Nítorí náà, a lo “Ẹ̀mí” pẹ̀lú àmì lẹ́tà ńlá, a sì tọ́ka sí ìtumọ̀ kejì nínú àlàyé ìsàlẹ̀.
- issue: Agbára ìtumọ̀ ἐν nínú ἐν πνεύματι
  choice: Ẹ̀mí gẹ́gẹ́ bí ohun tí ó kún inú wọn
  alternative: nínú Ẹ̀mí, tàbí nípasẹ̀ Ẹ̀mí
  rationale: Ìyàtọ̀ tó wà láàárín ọtí àti Ẹ̀mí ṣe àtìlẹ́yìn fún ìtumọ̀ “kí Ẹ̀mí kún inú yín,” ṣùgbọ́n Gíríìkì lè tún fi ààyè tàbí ohun èlò hàn. Àlàyé ìsàlẹ̀ pa àwọn aṣàyàn wọ̀nyí mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” fún àṣẹ ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn síbi tí ó bá yẹ. “Ìwà wọ̀bìà” mú èrò ìgbé ayé aláìníjàánu àti aṣòfò jáde láìdi èdè náà rú.
