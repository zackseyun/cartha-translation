  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ gbogbogbòò Gíríìkì dáadáa, ṣùgbọ́n “fi ọtí wáìnì mú ara yín yó” kò jẹ́ ọ̀nà Yorùbá tí ó rọrùn, ó sì ní ìṣòro ìṣètò ọ̀rọ̀. “Ẹ kún fún Ẹ̀mí” jẹ́ ìtumọ̀ taara àti àdánidá fún πληροῦσθε ἐν πνεύματι, nígbà tí àlàyé ìsàlẹ̀ ń pa aṣàyàn ‘nínú Ẹ̀mí/nínú ẹ̀mí’ mọ́.
  naturalness: “Ẹ má sì ṣe mú ọtí wáìnì yó” àti “ẹ kún fún Ẹ̀mí” jẹ́ Yorùbá boṣewa tí ó mọ́, tí ó sì yẹ fún ìkìlọ̀ àti ìtọ́ni ìwé náà. “Ìwà àìníjàánu” sọ ìwà aláìníjàánu tí ἀσωτία ń tọ́ka sí ní èdè òde òní tí ó ṣe kedere.
