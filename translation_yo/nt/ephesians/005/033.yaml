  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: yo
  text: Síbẹ̀, kí ọkọ̀ọ̀kan nínú yín[a] fẹ́ràn aya tirẹ̀ ní ọ̀nà yìí, gẹ́gẹ́ bí ara rẹ̀; kí aya náà sì bẹ̀rù ọkọ rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà tẹnumọ́ pé ìmọ̀ràn yìí kan ọkọ kọ̀ọ̀kan fúnra rẹ̀, kì í ṣe gbogbo wọn gẹ́gẹ́ bí ẹgbẹ́ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, ‘kí aya bẹ̀rù ọkọ rẹ̀.’ Nínú àyíká yìí, ‘bẹ̀rù’ lè ní ìtumọ̀ ìbòwò ọlọ́lá fún ọkọ, kì í ṣe ìpayà nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Síbẹ̀
  rationale: Ó fi ìyípadà sí àkótán ìmọ̀ràn hàn, ó sì pa agbára ìtakora tàbí ìfàyègbà ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: kí ẹnì kọ̀ọ̀kan nínú yín
  rationale: 'Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìpínkiri ọ̀rọ̀ náà hàn: àṣẹ náà kan ọkọ kọ̀ọ̀kan fúnra rẹ̀.'
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: aya tirẹ̀
  rationale: Nínú àyíká ìgbéyàwó yìí, γυνή túmọ̀ sí ‘aya,’ ἑαυτοῦ sì tẹnumọ́ pé aya tirẹ̀ gan-an ni.
- source_word: οὕτως ἀγαπάτω
  choice: fẹ́ràn ... ní ọ̀nà yìí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ, ‘ní ọ̀nà yìí’ sì tọ́ka padà sí àpẹẹrẹ ìfẹ́ tí a ṣàlàyé ṣáájú.
- source_word: ὡς ἑαυτόν
  choice: gẹ́gẹ́ bí ara rẹ̀
  rationale: Ó pa àfiwé Gíríìkì mọ́ ní ṣókí, láìfi àlàyé míì kún un.
- source_word: ἡ δὲ γυνὴ
  choice: kí aya náà sì
  rationale: ‘Aya’ bá àyíká ìgbéyàwó mu; ‘sì’ ṣe àfihàn apá kejì ìmọ̀ràn náà ní Yorùbá àdánidá.
- source_word: ἵνα φοβῆται
  choice: kí ... máa bẹ̀rù
  rationale: ‘Bẹ̀rù’ pa ìtumọ̀ pàtàkì φοβέομαι àti ìfarapa ìtumọ̀ rẹ̀ mọ́. Àlàyé ìsàlẹ̀ fi hàn pé nínú àyíká yìí ó lè ní ìtumọ̀ ọ̀wọ̀ ọlọ́wọ̀, kì í ṣe ìpayà nìkan.
- source_word: τὸν ἄνδρα
  choice: ọkọ rẹ̀
  rationale: Nínú àyíká yìí, ἀνήρ túmọ̀ sí ‘ọkọ’; arọ́pò-orúkọ ‘rẹ̀’ jẹ́ ohun tí èdè Yorùbá ń béèrè ní ti àdánidá.
theological_decisions:
- issue: Ìtumọ̀ φοβῆται nínú ìmọ̀ràn sí aya
  choice: bẹ̀rù
  alternative: bọ̀wọ̀ fún; bẹ̀rù pẹ̀lú ọ̀wọ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ìbẹ̀rù, ọ̀wọ̀ ọlọ́wọ̀, tàbí ọ̀wọ̀ gẹ́gẹ́ bí àyíká ṣe rí. Lílo ‘bẹ̀rù’ nínú ọ̀rọ̀ pàtàkì pa ìfarapa àti agbára ọ̀rọ̀ orísun mọ́; àlàyé ìsàlẹ̀ ṣàlàyé ìtumọ̀ ọ̀wọ̀ láìsọ pé ẹ̀rù ìpayà tàbí ìfipá ni ẹsẹ̀ náà ń pàṣẹ.
- issue: Ìmọ̀ràn ẹyọ kan tó dá lórí ọkọ àti aya
  choice: aya tirẹ̀ ... aya náà ... ọkọ rẹ̀
  alternative: ọkọ tàbí aya wọn
  rationale: Gíríìkì lo àwọn ọ̀rọ̀ akọ àti abo ẹyọ kan ní pàtó fún ìbáṣepọ̀ ọkọ àti aya; ìtumọ̀ náà kò sọ wọn di ọ̀rọ̀ aláìṣe akọ tàbí abo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣe kedere ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Ìṣètò ‘kí ...’ mú agbára àṣẹ ẹni kẹta Gíríìkì jáde ní ọ̀nà Yorùbá àdánidá, semicolon sì ya àwọn ìmọ̀ràn méjèèjì sọ́tọ̀ láìjá ìṣọ̀kan wọn.
