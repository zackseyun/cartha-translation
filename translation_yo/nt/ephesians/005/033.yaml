  source_fidelity: Ìtumọ̀ náà mú πλὴν, ìfẹ́ ọkọ sí aya rẹ̀ ‘ní ọ̀nà yìí,’ àfiwé ‘gẹ́gẹ́ bí ara rẹ̀,’ àti φοβῆται ní ìtumọ̀ pàtàkì rẹ̀ ‘bẹ̀rù’ wá dáadáa. Ṣùgbọ́n ‘ẹnì kọ̀ọ̀kan nínú yín’ gbòòrò ju akọ-ẹyọ àṣẹ Gíríìkì lọ; ‘ọkọ̀ọ̀kan nínú yín’ ń jẹ́ kí olùgbọ́ tí àṣẹ àkọ́kọ́ ń tọ́ sí hàn kedere, láìyí ìtumọ̀ ẹsẹ̀ náà padà.
  naturalness: Ìṣètò ‘Kí …; kí … sì …’ jẹ́ Yorùbá boṣewa, ó sì yẹ fún àṣẹ ẹni-kẹta. Yíyọ ‘máa’ kúrò mú kí ìpè náà dúró gẹ́gẹ́ bí àṣẹ taara, láìfi ìtumọ̀ ìṣe àṣà tí ń ṣẹlẹ̀ léraléra kún un. A tún tún gbolohun àlàyé ìsàlẹ̀ ṣe kí ‘ìbòwò ọlọ́lá’ rọrùn, kedere, sì jẹ́ àdánidá.
  terminology: ‘Aya,’ ‘ọkọ,’ ‘fẹ́ràn,’ àti ‘bẹ̀rù’ bá àyíká ìgbéyàwó àti ọ̀rọ̀ Gíríìkì mu. ‘Bẹ̀rù’ ń pa ìfarapa φοβῆται mọ́; àlàyé ìsàlẹ̀ ń ṣàfihàn ìmọ̀lára ìbòwò ọlọ́lá tí ọ̀rọ̀ náà lè ní nínú àyíká yìí, láìrọ́pò ọ̀rọ̀ ìpilẹ̀ náà.
