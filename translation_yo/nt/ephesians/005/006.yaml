id: EPH.5.6
reference: Ephesians 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí ẹnikẹ́ni fi ọ̀rọ̀ asán tàn yín jẹ, nítorí àwọn nǹkan wọ̀nyí ni ìbínú Ọlọ́run fi ń bọ̀ wá sórí àwọn ọmọ àìgbọ́ràn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ọmọkùnrin àìgbọ́ràn”; ìyẹn ni, àwọn tí àìgbọ́ràn jẹ́ àmì ìwà wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: Ẹ má ṣe jẹ́ kí ẹnikẹ́ni … tàn yín jẹ
  rationale: 'Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfòfinṣọ́nà pẹ̀lú àṣẹ ìsinsìnyí: ‘Ẹ má ṣe jẹ́ kí ẹnikẹ́ni tàn yín jẹ.’ Ó pa ìkìlọ̀ Gíríìkì mọ́ láì sọ ọ́ di gbólóhùn lasan.'
- source_word: κενοῖς λόγοις
  choice: fi ọ̀rọ̀ asán
  rationale: ‘Ọ̀rọ̀ asán’ pa àwòrán ohun tí ó ṣófo, tí kò ní ìtumọ̀ tàbí ìdúróṣinṣin mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: διὰ ταῦτα
  choice: nítorí àwọn nǹkan wọ̀nyí
  rationale: Ó fi ìdí-okùnfà tí διά pẹ̀lú accusative ń sọ hàn gbangba, ó sì jẹ́ kí atọ́ka sí àwọn ìṣe tí a mẹ́nu kàn ṣáájú dúró.
- source_word: ἔρχεται
  choice: ń bọ̀ wá
  rationale: Fọ́ọ̀mù ìsinsìnyí yìí pa agbára present Gíríìkì mọ́ láì pinnu bóyá ó jẹ́ ohun tó ń ṣẹlẹ̀ déédéé tàbí ohun tó sún mọ́lé pátápátá.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ìbínú Ọlọ́run
  rationale: ‘Ìbínú’ túmọ̀ ὀργή ní tààrà, kò sì sọ ọ́ di ‘ìdájọ́’ tí ó gbòòrò ju ọ̀rọ̀ orísun lọ.
- source_word: ἐπὶ
  choice: sórí
  rationale: ‘Sórí’ jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìbínú tí ń bọ̀ wá lórí àwọn ènìyàn, ó sì pa ìtọ́sọ́nà ἐπί mọ́.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: àwọn ọmọ àìgbọ́ràn
  rationale: Èyí pa àkójọpọ̀ ọ̀rọ̀ Semitic náà mọ́ ní ọ̀nà tí Yorùbá lè lóye. Nítorí ‘ọmọkùnrin àìgbọ́ràn’ lè túmọ̀ sí àwọn ọkùnrin kékeré nìkan ní Yorùbá, ‘ọmọ’ ni a lò nínú ẹsẹ̀, a sì ṣàlàyé ìrísí gangan àti ìtumọ̀ àpèjúwe rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: ἀπειθείας
  choice: àìgbọ́ràn
  rationale: Ó bá ìtumọ̀ kíkọ̀ láti gbọ́ tàbí láti ṣègbọ́ràn mu, ó sì bá ọ̀rọ̀ ìwà rere inú àyíká ẹsẹ̀ náà mu.
theological_decisions:
- issue: Bí a ṣe túmọ̀ èdè nípa ìbínú Ọlọ́run
  choice: ìbínú Ọlọ́run
  alternative: ìdájọ́ Ọlọ́run
  rationale: Ọ̀rọ̀ orísun ni ὀργή, kì í ṣe ọ̀rọ̀ gbogbogbò fún ìdájọ́. Ìtumọ̀ náà kò rọ agbára ọ̀rọ̀ ẹ̀kọ́ nípa ìbínú Ọlọ́run kù.
- issue: Bí a ṣe túmọ̀ àpólà τοὺς υἱοὺς τῆς ἀπειθείας
  choice: àwọn ọmọ àìgbọ́ràn
  alternative: àwọn ọmọkùnrin àìgbọ́ràn; àwọn tí àìgbọ́ràn ń ṣàpèjúwe wọn
  rationale: Gíríìkì lò ‘àwọn ọmọkùnrin/ọmọ’ gẹ́gẹ́ bí àpólà Semitic fún àwọn tí àìgbọ́ràn jẹ́ àmì ìwà wọn. Yorùbá ‘ọmọ’ lè gbé àpólà náà, nígbà tí ‘ọmọkùnrin’ lè ṣìṣe kí òǹkàwé rò pé akọ nìkan ni a ń sọ. Àlàyé ìsàlẹ̀ pa ìrísí akọ inú Gíríìkì àti ìtumọ̀ àpèjúwe rẹ̀ méjèèjì mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ẹ má ṣe jẹ́ kí…’ jẹ́ ìkìlọ̀ àdánidá sí ọ̀pọ̀ ènìyàn; ‘fi ọ̀rọ̀ asán tàn yín jẹ’ sì ṣe kedere fún òǹkàwé lasan láì sọ àwòrán Gíríìkì nù.
