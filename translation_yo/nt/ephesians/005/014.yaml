id: EPH.5.14
reference: Ephesians 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: yo
  text: 'Nítorí ohun gbogbo tí a mú hàn jẹ́ ìmọ́lẹ̀.[a] Nítorí náà ni a ṣe wí pé,[c]


    “Jí, ìwọ tí ó sùn,


    kí o sì dìde kúrò láàárín àwọn òkú,


    Mèsáyà[b] yóò sì tàn sórí rẹ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí, “ohun gbogbo tí a ṣí payá jẹ́ ìmọ́lẹ̀.” Ọ̀rọ̀ Gíríìkì φανερούμενον lè túmọ̀ sí ohun tí a mú hàn tàbí ohun tí a ṣí payá.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “Kristi náà”; a lo “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. Ìtumọ̀ ìbílẹ̀ ni “Kristi.”
    reason: alternative_reading
  - marker: c
    text: Orísun ọ̀rọ̀ àyọlò yìí kò dájú. Ó lè fẹnu kan àwọn kókó inú Ìwé Mímọ́, pàápàá Àìsáyà 60:1, tàbí ó lè jẹ́ apá orin àwọn Kristẹni ìgbà àkọ́kọ́.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν
  choice: gbogbo ohun
  rationale: Ọ̀rọ̀ náà jẹ́ akọ́tọ̀ àárín ẹyọ kan tí ó ń tọ́ka sí gbogbo ohun lápapọ̀; “gbogbo ohun” pa ìtumọ̀ gbígbòòrò náà mọ́ láìfi dandan sọ pé ènìyàn ni.
- source_word: φανερούμενον
  choice: tí a mú kí ó fara hàn
  rationale: Ó fi ìṣe aláìlórúkọ hàn, ó sì lè túmọ̀ sí ohun tí a mú kí ó ṣeé rí tàbí tí a ṣí payá. Àṣàyàn yìí bá “ìmọ́lẹ̀” tí ó tẹ̀ lé e mu, a sì pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà, ó sì pa àwòrán ìmọ́lẹ̀ mọ́ láìṣe àlàyé àfikún.
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìparí ọ̀rọ̀ tó ṣáájú hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: λέγει
  choice: ni a ṣe wí pé
  rationale: Èdè Gíríìkì kò sọ ẹni tó ń sọ ọ̀rọ̀ náà. Ìṣọ̀rọ̀ aláìlórúkọ yìí kò fi dandan sọ pé Ọlọ́run, Ìwé Mímọ́, tàbí orin kan ni orísun rẹ̀.
- source_word: Ἔγειρε
  choice: Jí
  rationale: Àṣẹ yìí ń pe ẹni tí ó sùn pé kí ó jí; ọ̀rọ̀ Yorùbá yìí ṣe kedere, ó sì pa àwòrán oorun mọ́.
- source_word: ὁ καθεύδων
  choice: ìwọ tí o sùn
  rationale: Ó tú ìpè sí ẹni tí ó sùn jáde ní Yorùbá àdánidá, ó sì pa agbára ìpè tààrà mọ́.
- source_word: ἀνάστα
  choice: dìde
  rationale: Ó pa ìtumọ̀ dídìde mọ́, pẹ̀lú ìfarahàn rẹ̀ sí dídìde kúrò láàárín àwọn òkú.
- source_word: ἐκ τῶν νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: “Láàárín àwọn òkú” mú agbára ἐκ àti ọ̀pọ̀-orúkọ náà hàn ní kedere, láìdá ìtumọ̀ rẹ̀ mọ́ àjíǹde ara nìkan.
- source_word: ἐπιφαύσει
  choice: yóò tàn sí ọ lára
  rationale: Ó pa àwòrán pé ìmọ́lẹ̀ ń tàn sórí ẹni kan mọ́, dípò títú u sí àlàyé ẹ̀kọ́ ìsìn.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Àpilẹ̀kọ ὁ fi hàn pé oyè ni ọ̀rọ̀ náà ń ṣiṣẹ́ bí i níbí. “Mèsáyà” sọ ìtumọ̀ oyè náà, dípò kí a lò ó bí orúkọ lásán.
theological_decisions:
- issue: Orísun ọ̀rọ̀ àyọlò náà
  choice: Lo ìṣọ̀rọ̀ aláìlórúkọ “ni a ṣe wí pé.”
  alternative: “Ìwé Mímọ́ wí pé,” “ó wí pé,” tàbí “a kọrin pé.”
  rationale: Gíríìkì kò sọ ẹni tàbí ohun tó sọ ọ̀rọ̀ náà, orísun àyọlò náà kò sì dájú. Ìtumọ̀ náà nítorí náà pa àìdájú yìí mọ́.
- issue: Bí a ṣe tú Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, Χριστός ní àpilẹ̀kọ, ó sì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. “Mèsáyà” pa iṣẹ́ oyè náà hàn láìfi ẹ̀kọ́ ìjọ kan kún un.
- issue: Ìbáṣepọ̀ ohun tí a mú hàn àti ìmọ́lẹ̀
  choice: Pa gbólóhùn pé ohun tí a mú kí ó fara hàn “jẹ́ ìmọ́lẹ̀” mọ́ gẹ́gẹ́ bí ó ti rí.
  alternative: Ṣàlàyé rẹ̀ sí “ìmọ́lẹ̀ ló ń mú gbogbo ohun hàn.”
  rationale: Ìtumọ̀ gbólóhùn Gíríìkì ní ìṣòro àti ìṣòro-ẹ̀kọ́ kan; a kò yí ọ̀nà ìsọ rẹ̀ padà láti mú un rọrùn nípa fífi ohun tí a rò pé ó túmọ̀ sí rọ́pò rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lásán. A ṣètò ọ̀rọ̀ àyọlò náà sí ìlà mẹ́ta láti pa ìrísí ewì tàbí orin rẹ̀ mọ́, láìdá orísun rẹ̀ lójú.
