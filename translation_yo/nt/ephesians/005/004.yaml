id: EPH.5.4
reference: Ephesians 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: yo
  text: Ìwà ìtìjú, ọ̀rọ̀ òmùgọ̀, tàbí àwàdà ẹlẹ́gbin—àwọn nǹkan tí kò yẹ—ṣùgbọ́n kàkà bẹ́ẹ̀, ìdúpẹ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρότης
  choice: ìwà rírùn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun ìtìjú tàbí ohun ẹlẹ́gbin; nínú àyíká ọ̀rọ̀ tí ó dá lórí bí a ṣe ń sọ̀rọ̀, ‘ìwà rírùn’ lè ní ìtumọ̀ ọ̀rọ̀ tàbí ìṣe tí kò bójú mu láì fi ìtumọ̀ náà mọ́ ọ̀rọ̀ ẹnu nìkan.
- source_word: μωρολογία
  choice: ọ̀rọ̀ òmùgọ̀
  rationale: Ó túmọ̀ sí ọ̀rọ̀ aṣiwèrè tàbí ọ̀rọ̀ tí kò ní làákàyè; yíyan yìí ṣe kedere, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ἢ
  choice: tàbí
  rationale: Ó so ohun tó kẹ́yìn nínú àkójọ̀ náà pọ̀ mọ́ àwọn tó ṣáájú rẹ̀, ó sì pa ìtumọ̀ ìsopọ̀ Gíríìkì mọ́.
- source_word: εὐτραπελία
  choice: àwàdà ẹlẹ́gbin
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọgbọ́n inú àwàdà ní ibòmíràn, bí a ṣe kó o pọ̀ mọ́ àwọn ohun tí kò yẹ níbí fi hàn pé àwàdà tí kò bójú mu ni.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: àwọn nǹkan tí kò yẹ
  rationale: Gbólóhùn yìí ń tọ́ka padà sí gbogbo ohun tí a ṣẹ̀ṣẹ̀ tò, ó sì sọ pé wọn kò bójú mu tàbí kò yẹ.
- source_word: ἀλλὰ μᾶλλον
  choice: ṣùgbọ́n dípò bẹ́ẹ̀
  rationale: Ó mú ìyàtọ̀ tó lágbára jáde láàárín àwọn ọ̀rọ̀ tí a kọ̀ àti ohun rere tí ó yẹ kí ó rọ́pò wọn.
- source_word: εὐχαριστία
  choice: kí ẹ máa dúpẹ́
  rationale: Bó tilẹ̀ jẹ́ pé orúkọ ni ọ̀rọ̀ Gíríìkì, gbólóhùn-ìṣe yìí jẹ́ ọ̀nà àdánidá jù lọ ní Yorùbá láti sọ ìfihàn ọpẹ́, ó sì mú ìtakora pẹ̀lú ọ̀rọ̀ búburú hàn.
theological_decisions:
- issue: Ìwọ̀n tí αἰσχρότης kan ọ̀rọ̀ ẹnu
  choice: Lo ‘ìwà rírùn,’ tí ó lè ní ọ̀rọ̀ ẹlẹ́gbin nínú ní àyíká yìí ṣùgbọ́n tí kò fi ìtumọ̀ náà mọ́ ọ̀rọ̀ ẹnu nìkan.
  alternative: ‘ọ̀rọ̀ ẹlẹ́gbin’
  rationale: μωρολογία àti εὐτραπελία jẹ́ ti ọ̀rọ̀ ẹnu ní pàtó, εὐχαριστία sì lè jẹ́ ìfihàn ẹnu; síbẹ̀ αἰσχρότης lè túbọ̀ gbòòrò sí ìwà ìtìjú. Yíyan yìí pa àìdánilójú gidi náà mọ́.
- issue: Ìdájọ́ ìwà rere lórí εὐτραπελία
  choice: Túmọ̀ ọ́ ní ọ̀nà òdì gẹ́gẹ́ bí ‘àwàdà ẹlẹ́gbin.’
  alternative: ‘àwàdà ọlọ́gbọ́n’ tàbí ‘ọgbọ́n inú ọ̀rọ̀’
  rationale: Bí ọ̀rọ̀ náà tilẹ̀ lè ní ìtumọ̀ rere ní àwọn àyíká Gíríìkì mìíràn, fífi í sínú àkójọ̀ ohun tí kò yẹ mú kí ìtumọ̀ òdì ṣe pàtàkì níbí.
- issue: Ìlànà gírámà àṣẹ inú ẹsẹ náà
  choice: Ṣe àwọn orúkọ àkójọ̀ náà sí àṣẹ òdì, kí a sì fi ìdúpẹ́ hàn gẹ́gẹ́ bí ohun tó yẹ kí ó rọ́pò wọn.
  alternative: Fi gbogbo ẹsẹ náà sílẹ̀ gẹ́gẹ́ bí àkójọ̀ orúkọ tí kò ní ọ̀rọ̀-ìṣe gbangba.
  rationale: Gíríìkì jẹ́ àkójọ̀ tí ó gbẹ́kẹ̀ lé àyíká gbólóhùn, ṣùgbọ́n Yorùbá àdánidá nílò ọ̀rọ̀-ìṣe; ‘má tilẹ̀ sí’ àti ‘kí ẹ máa dúpẹ́’ mú agbára àṣẹ àti ìtakora náà hàn láì yí ẹ̀kọ́ ẹsẹ padà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìtumọ̀ náà mú àkójọ̀ Gíríìkì di gbólóhùn Yorùbá àdánidá, ṣùgbọ́n ó pa ìtakora láàárín ọ̀rọ̀ tí kò yẹ àti ìdúpẹ́ mọ́.
