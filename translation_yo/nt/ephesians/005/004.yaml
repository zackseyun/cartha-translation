revisions:
- from: Kí ìwà rírùn, ọ̀rọ̀ òmùgọ̀ tàbí àwàdà ẹlẹ́gbin má tilẹ̀ sí láàárín yín[a]—àwọn nǹkan tí kò yẹ[b]—ṣùgbọ́n dípò bẹ́ẹ̀, kí ẹ máa dúpẹ́.
  to: Ìwà ìtìjú, ọ̀rọ̀ òmùgọ̀, tàbí àwàdà ẹlẹ́gbin—àwọn nǹkan tí kò yẹ—ṣùgbọ́n kàkà bẹ́ẹ̀, ìdúpẹ́.
  rationale: Àtúnṣe náà rọ́pò ìwà rírùn, tí kò ní ìtumọ̀ αἰσχρότης, pẹ̀lú ìwà ìtìjú. Ó tún yọ “má tilẹ̀ sí láàárín yín” kúrò nítorí pé ọ̀rọ̀ náà wá láti ẹsẹ tó ṣáájú, kì í ṣe láti 5:4 fúnra rẹ̀. A pa àìpé gírámà/àkójọ̀ orúkọ ti Gíríìkì mọ́ ní Yorùbá, pẹ̀lú ìtakora sí ìdúpẹ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:12Z'
review_pass:
  verdict: revise
  source_fidelity: Ìwà rírùn does not convey αἰσχρότης; rírùn ordinarily means “easy/light,” so it is misleading here. In addition, “má tilẹ̀ sí láàárín yín” imports the explicit wording of 5:3 rather than translating the elliptical list and contrast of 5:4. The revised wording renders the three items and the collective relative clause without adding “among you.”
  naturalness: The revision uses clear, modern Standard Yoruba and preserves the source’s compressed, list-like construction. “Kàkà bẹ́ẹ̀” naturally expresses ἀλλὰ μᾶλλον, while the nominal “ìdúpẹ́” preserves the contrast with the Greek noun εὐχαριστία.
  terminology: “Ìwà ìtìjú” is a suitable broad rendering of αἰσχρότης, retaining the term’s shameful/indecent sense without restricting it exclusively to spoken obscenity. “Ọ̀rọ̀ òmùgọ̀,” “àwàdà ẹlẹ́gbin,” and “ìdúpẹ́” appropriately render μωρολογία, negatively used εὐτραπελία, and εὐχαριστία.
  issues:
  - severity: high
    issue: “Ìwà rírùn” mistranslates αἰσχρότης.
    rationale: Rírùn means “easy” or “light,” not shameful, indecent, or obscene. It fails to represent the vice named in the Greek text.
  - severity: medium
    issue: “Má tilẹ̀ sí láàárín yín” imports wording from the preceding verse.
    rationale: The phrase reflects the explicit prohibition in Ephesians 5:3, whereas 5:4 supplies a list, a relative evaluation, and a contrasting positive noun. It should not be presented as wording contained in this verse alone.
  - severity: low
    issue: The footnote’s description of εὐτραπελία as “ọgbọ́n inú àwàdà” is awkward.
    rationale: “Ọgbọ́n inú ọ̀rọ̀” or “àwàdà ọlọ́gbọ́n” is more idiomatic Yoruba for the broader positive sense of wit.
  revised_text: Ìwà ìtìjú, ọ̀rọ̀ òmùgọ̀, tàbí àwàdà ẹlẹ́gbin—àwọn nǹkan tí kò yẹ—ṣùgbọ́n kàkà bẹ́ẹ̀, ìdúpẹ́.
  revised_footnotes:
  - marker: a
    text: Tàbí, “àwàdà tí kò bójú mu.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọgbọ́n inú ọ̀rọ̀ tàbí àwàdà ọlọ́gbọ́n ní gbogbogbòò, ṣùgbọ́n níbí a lò ó ní ọ̀nà òdì nítorí a kó o pọ̀ mọ́ àwọn ọ̀rọ̀ tí kò yẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn nǹkan tí kò bójú mu” tàbí “àwọn nǹkan tí kò tọ́.”
    reason: lexical_alternative
  revision_rationale: Àtúnṣe náà rọ́pò ìwà rírùn, tí kò ní ìtumọ̀ αἰσχρότης, pẹ̀lú ìwà ìtìjú. Ó tún yọ “má tilẹ̀ sí láàárín yín” kúrò nítorí pé ọ̀rọ̀ náà wá láti ẹsẹ tó ṣáájú, kì í ṣe láti 5:4 fúnra rẹ̀. A pa àìpé gírámà/àkójọ̀ orúkọ ti Gíríìkì mọ́ ní Yorùbá, pẹ̀lú ìtakora sí ìdúpẹ́.
