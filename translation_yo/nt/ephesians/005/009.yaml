lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí àlàyé ẹsẹ̀ yìí múlẹ̀ lórí ìpè tó wà ní ẹsẹ̀ tó ṣáájú.
- source_word: καρπὸς
  choice: èso
  rationale: Èyí pa àwòrán Pọ́ọ̀lù mọ́ pé ìmọ́lẹ̀ ń mú àwọn ànímọ́ rere jáde bí igi ṣe ń so èso.
- source_word: τοῦ φωτός
  choice: ìmọ́lẹ̀
  rationale: Ó tọ́ka padà sí ìdánimọ̀ àwọn onígbàgbọ́ gẹ́gẹ́ bí ìmọ́lẹ̀ nínú Olúwa ní ẹsẹ̀ 8.
- source_word: ἐν
  choice: ń fara hàn nínú
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe níbí; gbólóhùn yìí sọ ibi tàbí ọ̀nà tí èso náà ti ń hàn, ó sì jẹ́ Yorùbá àdánidá ju ‘wà nínú’ lọ.
- source_word: πάσῃ
  choice: gbogbo
  rationale: Pẹ̀lú àwọn ọ̀rọ̀ àìlónkà wọ̀nyí, ó ní ìtumọ̀ tó kún ré kọjá gbogbo irú ànímọ́ náà.
- source_word: ἀγαθωσύνῃ
  choice: ìwà rere
  rationale: Ó túmọ̀ sí oore tàbí ìwà rere ní ọ̀nà ìwà rere tó gbòòrò, kì í ṣe inú rere nìkan.
- source_word: δικαιοσύνῃ
  choice: òdodo
  rationale: ‘Òdodo’ pa ìtumọ̀ ìwà títọ́ mọ́, láìpa ìtumọ̀ ìdájọ́ òdodo rẹ̀ rẹ́; a tọ́ka sí èkejì nínú àlàyé ìsàlẹ̀.
- source_word: ἀληθείᾳ
  choice: òtítọ́
  rationale: Ó lè ní òtítọ́ gẹ́gẹ́ bí ohun tó bá òtítọ́ mu àti ìwà olóòtítọ́; ‘òtítọ́’ gba ìtumọ̀ méjèèjì láàyè.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn ìwé àfọwọ́kọ ní τοῦ φωτός
  choice: èso ìmọ́lẹ̀
  alternative: èso Ẹ̀mí
  rationale: SBLGNT ka φωτός (‘ìmọ́lẹ̀’), èyí sì bá ọ̀rọ̀ ẹsẹ̀ 8 mu. A pa ẹ̀rí ìwé àfọwọ́kọ fún ‘Ẹ̀mí’ mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Ọ̀rọ̀ Gíríìkì lè tẹnumọ́ ìwà títọ́ tàbí ìdájọ́ tó tọ́. A lo ‘òdodo’ nínú ẹsẹ̀, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ń fara hàn nínú’ jẹ́ àdánidá, ó sì pa ipa ἐν mọ́ láìsọ pé ibi ti ara ni.
