id: EPH.5.24
reference: Ephesians 5:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: yo
  text: Ṣùgbọ́n gẹ́gẹ́ bí ìjọ ṣe ń tẹríba fún Mèsáyà[a], bẹ́ẹ̀ náà ni àwọn aya náà ṣe ń tẹríba fún àwọn ọkọ wọn nínú ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Oyè Gíríìkì Χριστός ni a tú sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn láti inú gbólóhùn tó ṣáájú, ó sì jẹ́ àsopọ̀ Yorùbá tó bójú mu.
- source_word: ὡς ... οὕτως καὶ
  choice: gẹ́gẹ́ bí ... bẹ́ẹ̀ náà ni
  rationale: Ó pa ìṣọ̀kan àfiwé méjèèjì inú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἡ ἐκκλησία
  choice: ìjọ
  rationale: Nínú lílò Pọ́ọ̀lù, ọ̀rọ̀ náà ń tọ́ka sí àwùjọ àwọn onígbàgbọ́; “ìjọ” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù ní àyíká yìí.
- source_word: ὑποτάσσεται
  choice: ń tẹrí ba fún
  rationale: Ó sọ ìfi ara sí abẹ́ ìṣètò tàbí àṣẹ láìfi ìtumọ̀ ìfipámúni tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
- source_word: τῷ Χριστῷ
  choice: fún Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” tú ìtumọ̀ oyè náà jáde dípò kí a kàn lo orúkọ àṣà “Kristi.”
- source_word: αἱ γυναῖκες
  choice: àwọn aya
  rationale: Àyíká ìtọ́nisọ́nà ilé àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ἀνδράσιν fi hàn pé “àwọn aya,” kì í ṣe “àwọn obìnrin” lápapọ̀, ni a ń tọ́ka sí.
- source_word: τοῖς ἀνδράσιν
  choice: fún àwọn ọkọ wọn
  rationale: Nínú àyíká ìgbéyàwó, ἀνήρ túmọ̀ sí “ọkọ”; “wọn” mú ìbáṣepọ̀ ọkọ àti aya tó wà nínú ọ̀rọ̀ Gíríìkì ṣe kedere ní Yorùbá.
- source_word: ἐν παντί
  choice: nínú ohun gbogbo
  rationale: Ó pa ìgbòòrò gbólóhùn Gíríìkì mọ́ láìfi àlàyé tàbí ààlà tí kò sí nínú ẹsẹ náà kún un.
- source_word: ellipsis of ὑποτάσσεται with αἱ γυναῖκες
  choice: kí àwọn aya máa tẹrí ba
  rationale: Gíríìkì kò tún ọ̀rọ̀-ìṣe náà sọ nínú apá kejì, ṣùgbọ́n Yorùbá àdánidá nílò kí a mú un padà; ìkọ̀lé “kí ... máa” fi ìtọ́nisọ́nà inú àyíká hàn láìlo ọ̀rọ̀ líle bí “gbọ́dọ̀.”
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè nínú àfiwé yìí. A tú oyè náà sí “Mèsáyà,” nígbà tí “Kristi” wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ àṣà mìíràn.
- issue: Ìwọ̀n gbólóhùn ìtẹríba aya
  choice: nínú ohun gbogbo
  alternative: nínú gbogbo ohun tó yẹ
  rationale: Ẹsẹ Gíríìkì sọ ἐν παντί láìfi ààlà mìíràn kún un. Fífi “tó yẹ” tàbí irú rẹ̀ sínú ọ̀rọ̀ àkọ́kọ́ yóò tú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà ní lọ́nà tí orísun kò ṣe.
- issue: Ọ̀rọ̀-ìṣe tí a kò tún sọ nínú apá kejì
  choice: Mú “tẹrí ba” padà fún ìtumọ̀ Yorùbá tó pé
  alternative: Fi apá náà sílẹ̀ láìsí ọ̀rọ̀-ìṣe bí Gíríìkì
  rationale: Àìtún ọ̀rọ̀-ìṣe sọ jẹ́ ellipsis Gíríìkì; mímú un padà ṣe Yorùbá náà ní àdánidá, kò sì yí ìtumọ̀ tàbí agbára gbólóhùn náà padà.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. “Tẹrí ba fún” jẹ́ ọ̀rọ̀ àdánidá fún ìfara-ẹni-sí-abẹ́ láìgbé ìfipámúni wọ inú ọ̀rọ̀. Àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
