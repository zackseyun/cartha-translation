  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: yo
  text: Ẹ máa dúpẹ́ nígbà gbogbo fún ohun gbogbo[b] lọ́wọ́ Ọlọ́run Baba, ní orúkọ Olúwa wa Jésù Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ọ̀nà ìbílẹ̀, “Jésù Kristi.”
    reason: alternative_reading
  - marker: b
    text: “Fún ohun gbogbo” tún lè túmọ̀ sí “fún gbogbo ohun.” Àwọn kan sì ka á sí “fún gbogbo ènìyàn,” bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ṣètìlẹ́yìn fún ìtumọ̀ tó kan gbogbo ipò tàbí gbogbo ọ̀ràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: Ẹ máa dúpẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó ń fi ìṣe tí ń bá a lọ hàn, tó sì so mọ́ àṣẹ inú ẹsẹ tó ṣáájú. “Ẹ máa dúpẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe tí ó yẹ kí ó máa tẹ̀ síwájú hàn.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá adverb Gíríìkì náà mu.
- source_word: ὑπὲρ πάντων
  choice: fún ohun gbogbo
  rationale: Fọ́ọ̀mù πάντων lè tọ́ka sí ohun gbogbo tàbí gbogbo ènìyàn. Àyíká ọ̀rọ̀ yìí ṣètìlẹ́yìn fún ìdúpẹ́ tí ó kan gbogbo ipò àti gbogbo ọ̀ràn; àlàyé ìtumọ̀ mìíràn wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν ὀνόματι
  choice: ní orúkọ
  rationale: Ó pa àkànlò Bíbélì mọ́, ó sì lè gba ìtumọ̀ ṣíṣe gẹ́gẹ́ bí aṣojú tàbí nípasẹ̀ àṣẹ ẹni náà láìfi àlàyé kún ọ̀rọ̀ pàtàkì.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún κύριος gẹ́gẹ́ bí oyè tí a lò fún Jésù.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός ní agbára oyè níbí; “Mèsáyà” túmọ̀ oyè náà, nígbà tí “Kristi” wà gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: τῷ θεῷ καὶ πατρί
  choice: lọ́dọ̀ Ọlọ́run Baba
  rationale: Dative náà fi ẹni tí a ń dúpẹ́ lọ́wọ́ rẹ̀ hàn. “Ọlọ́run Baba” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí ẹni kan náà gẹ́gẹ́ bí Ọlọ́run àti Baba.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà “Mèsáyà” mú ìtumọ̀ oyè náà jáde. “Kristi,” èyí tí ó jẹ́ ọ̀nà ìbílẹ̀, ni a pa mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ohun tí πάντων tọ́ka sí
  choice: ohun gbogbo
  alternative: gbogbo ènìyàn
  rationale: Fọ́ọ̀mù Gíríìkì náà lè jẹ́ akọ tàbí àárín, ṣùgbọ́n àyíká ọ̀rọ̀ nípa ìdúpẹ́ nígbà gbogbo mú “ohun gbogbo” ṣeé ṣe jù. A kò fi ìtumọ̀ kejì pamọ́; ó wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Ẹ máa dúpẹ́” mú ìṣe tí ń bá a lọ jáde ní Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé participle Gíríìkì náà sinmi lórí àṣẹ inú àyíká tó ṣáájú.
