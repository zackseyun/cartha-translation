  text: making the most of the time[a], because the days are evil.
translation:
  language: yo
  text: Ẹ máa lo àkókò náà dáadáa,[a] nítorí àwọn ọjọ́ náà burú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa ra àkókò náà padà”; ọ̀rọ̀ Gíríìkì náà tún ní àwòrán rírà àǹfààní náà ní kíkún.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: Ẹ máa lo ... ní ọ̀nà tó dára jù lọ
  rationale: Ọ̀rọ̀ náà ní àwòrán rírà ohun jáde tàbí rírí àǹfààní mú, ṣùgbọ́n nínú àyíká ìṣírí yìí ó túmọ̀ sí lílo àkókò tàbí àǹfààní lọ́nà tó péye. Èdè yìí jẹ́ Yorùbá àdánidá, kò sì fi èrò ìràpadà ẹ̀ṣẹ̀ kún ọ̀rọ̀ náà.
- source_word: καιρόν
  choice: àkókò náà
  rationale: καιρός lè túmọ̀ sí àkókò tó yẹ tàbí àǹfààní pàtó. “Àkókò náà” mú ìtumọ̀ tó hàn gbangba wá, nígbà tí gbólóhùn ìṣe náà ń fi lílo àǹfààní hàn.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ń ṣàlàyé ìdí fún ìṣírí náà ní Yorùbá òde òní tó ṣe kedere.
- source_word: αἱ ἡμέραι
  choice: àwọn ọjọ́ yìí
  rationale: Ó pa àwòrán ọ̀pọ̀ “ọjọ́” mọ́; “yìí” ń fi hàn pé ọ̀rọ̀ náà tọ́ka sí ipò àkókò tí wọ́n wà nínú rẹ̀.
- source_word: πονηραί
  choice: burú
  rationale: “Burú” lè ṣàpèjúwe àwọn ọjọ́ gẹ́gẹ́ bí èyí tí ìwà ibi àti ipò tó lòdì sí rere kún inú wọn, láì sọ ìtumọ̀ náà di ti wàhálà lásán.
theological_decisions:
- issue: Ó ṣeé ṣe kí ἐξαγοραζόμενοι dà bí ọ̀rọ̀ nípa ìràpadà ẹ̀ṣẹ̀.
  choice: Ìṣírí láti lo àkókò tàbí àǹfààní lọ́nà tó dára jù lọ.
  alternative: “Ẹ máa ra àkókò náà padà” tàbí “ẹ máa ra àǹfààní náà mú.”
  rationale: Nínú àyíká ìtọ́ni ìwà rere yìí, ọ̀rọ̀ náà jẹ́ nípa lílo àkókò tó yẹ dáadáa, kì í ṣe ìtẹnumọ́ ẹ̀kọ́ ìgbàlà. Àlàyé ìsàlẹ̀ ojú ewé pa àwòrán Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àṣẹ ọ̀pọ̀ ènìyàn “Ẹ máa” nítorí pé participle náà ń tẹ̀ lé ìtọ́ni inú ẹsẹ tó ṣáájú. Àmì ohùn kún ibi tí ó yẹ.
