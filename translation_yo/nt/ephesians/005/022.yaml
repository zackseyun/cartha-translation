  yaml_path: translation/nt/ephesians/005/022.yaml
  text: Wives[a], to your own husbands as to the Lord,
translation:
  language: yo
  text: Ẹ̀yin aya[a], fún ọkọ ti ẹnì kọ̀ọ̀kan yín bí fún Olúwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀pọ̀ ìtumọ̀ máa ń mú ọ̀rọ̀-ìṣe láti ẹsẹ 21 wá, wọ́n á sì túmọ̀ ọ́ pé, “Ẹ̀yin aya, ẹ máa tẹríba fún ọkọ ti ẹnì kọ̀ọ̀kan yín bí fún Olúwa.” Ṣùgbọ́n ẹsẹ 22 fúnra rẹ̀ kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì; gbólóhùn rẹ̀ gbẹ́kẹ̀ lé ohun tí ó ṣáájú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: Ẹ̀yin aya
  rationale: Nínú ọ̀rọ̀ ìtọ́ni nípa ìdílé yìí, γυνή túmọ̀ sí ‘aya,’ kì í ṣe ‘obìnrin’ lápapọ̀. ‘Ẹ̀yin’ mú ìpè tààrà náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἰδίοις ἀνδράσιν
  choice: fún ọkọ ara yín
  rationale: ἀνήρ níbí ni ‘ọkọ,’ nítorí àyíká ọ̀rọ̀ ìgbéyàwó. ‘Ara yín’ ṣàfihàn ἰδίοις, ó sì tọ́ka sí ọkọ tí aya kọ̀ọ̀kan ní.
- source_word: ὡς
  choice: bí fún
  rationale: ‘Bí fún’ pa ìfiwéra Gíríìkì mọ́ láì fi ìtumọ̀ tí ó ju ohun tí ọ̀rọ̀ náà sọ lọ kún un.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: Nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù níbí, κύριος tọ́ka sí Olúwa Jésù; ‘Olúwa’ ni ìtumọ̀ Yorùbá tó bójú mu.
- source_word: implicit verb from context
  choice: a kò fi ọ̀rọ̀-ìṣe sí ẹsẹ yìí
  rationale: Ẹsẹ Gíríìkì yìí kò ní ọ̀rọ̀-ìṣe tirẹ̀; ó gbẹ́kẹ̀ lé ὑποτασσόμενοι (‘ẹ máa tẹríba’) nínú ẹsẹ 21. A pa àìpé gírámà yìí mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bóyá kí a fi ‘ẹ máa tẹríba’ kún ọ̀rọ̀ pàtàkì bí ó tilẹ̀ jẹ́ pé kò sí nínú Gíríìkì ẹsẹ 22
  choice: A kò fi ọ̀rọ̀-ìṣe náà kún ọ̀rọ̀ pàtàkì; a pa gbólóhùn aláìpé náà mọ́, a sì ṣàlàyé ohun tí a lóye láti ẹsẹ 21 nínú àlàyé ìsàlẹ̀.
  alternative: Ẹ̀yin aya, ẹ máa tẹríba fún ọkọ ara yín bí fún Olúwa.
  rationale: Ọ̀rọ̀-ìṣe tí a lóye wá láti ẹsẹ 21. Fífi í kún un lè mú Yorùbá rọrùn, ṣùgbọ́n yóò fi ọ̀rọ̀ tí kò sí ní ẹsẹ 22 kún un. Pípa àìpé náà mọ́ bọ̀wọ̀ fún ẹ̀rí orísun, kò sì yanju ìbáṣepọ̀ gírámà àti ìtumọ̀ ẹsẹ 21–22 láìjẹ́ pé a sọ fún òǹkàwé.
translation_notes:
  register: Yorùbá tí a lò jẹ́ èdè ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. Gbólóhùn pàtàkì náà mọ̀ọ́mọ̀ jẹ́ aláìpé nítorí bẹ́ẹ̀ ni orísun Gíríìkì rí; àlàyé ìsàlẹ̀ ń ran òǹkàwé lọ́wọ́ láì bo ìṣòro gírámà náà mọ́lẹ̀.
