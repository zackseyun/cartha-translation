  text: δοκιμάζοντες τί ἐστιν εὐάρεστον τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/010.yaml
  text: testing what is pleasing to the Lord;[a]
translation:
  language: yo
  text: Ẹ máa dán ohun tí ó wu Olúwa wò;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa fi òye mọ ohun tí ó wu Olúwa,” tàbí “Ẹ máa wádìí ohun tí ó wu Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: Ẹ máa dán … wò
  rationale: Ọ̀rọ̀ náà jẹ́ participle ti ìṣe tí ń tẹ̀ síwájú, ó sì bá ìṣàn ìgbaniníyànjú inú àyíká rẹ̀ mu. “Dán … wò” pa agbára ìtumọ̀ ṣíṣe àyẹ̀wò láti mọ ohun tí ó yẹ tàbí tí ó dára mọ́, láìsọ ọ́ di àlàyé gígùn.
- source_word: τί
  choice: ohun tí
  rationale: 'Ó ṣe àgbékalẹ̀ ìbéèrè alákòóso nínú gbólóhùn náà: “ohun tí ó wu …” Èyí jẹ́ ọ̀nà Yorùbá àdánidá.'
- source_word: ἐστιν
  choice: ó
  rationale: Nínú gbólóhùn Yorùbá “ohun tí ó wu Olúwa,” kò pọn dandan láti tú copula náà sí ọ̀rọ̀ ọ̀tọ̀; àgbékalẹ̀ náà ti fi ìbáṣepọ̀ náà hàn ní kedere.
- source_word: εὐάρεστον
  choice: wu
  rationale: “Wu” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, òde òní, tí ó sì fi ohun tí ó jẹ́ ìtẹ́wọ́gbà tàbí ohun amúnú-dùn ní ojú ẹni hàn.
- source_word: τῷ κυρίῳ
  choice: Olúwa
  rationale: Dative náà bá εὐάρεστον ṣiṣẹ́ gẹ́gẹ́ bí ẹni tí ohun náà ń wù. “Olúwa” pa oyè κύριος mọ́ láìfikún ẹni tí ó ń tọ́ka sí.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù tàbí Ọlọ́run
  rationale: Gíríìkì lo oyè κύριος nìkan, kò sì ṣàlàyé rẹ̀ síwájú. Bí àyíká ṣe lè jẹ́ kí a lóye rẹ̀ nípa Kristi, ìtumọ̀ náà pa ìṣiyèméjì inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, kò sì pinnu ohun tí ẹsẹ náà kò sọ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbò. Àṣẹ “Ẹ máa …” mú ìṣe tí ń tẹ̀ síwájú àti ìṣàn ìgbaniníyànjú àyíká ẹsẹ náà jáde.
