source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: yo
  text: Ẹ̀yin ọkọ, ẹ fẹ́ràn àwọn aya yín, gẹ́gẹ́ bí Mèsáyà[a] náà ṣe fẹ́ràn ìjọ, tí ó sì fi ara rẹ̀ fún un[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” A túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” níhìn-ín láti pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè mọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “fi ara rẹ̀ lélẹ̀ fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: Ẹ̀yin ọkọ
  rationale: Nínú ọ̀rọ̀ ìgbéyàwó yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ọkùnrin gẹ́gẹ́ bí ọkọ, kì í ṣe sí àwọn ọkùnrin lápapọ̀.
- source_word: ἀγαπᾶτε
  choice: ẹ máa fẹ́ràn
  rationale: Àṣẹ ìsinsìnyí náà ń pe àwọn ọkọ sí ìfẹ́ tí wọ́n ń fi hàn nígbà gbogbo, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἠγάπησεν.
- source_word: τὰς γυναῖκας
  choice: àwọn aya yín
  rationale: Àyíká ọ̀rọ̀ fi hàn pé γυναῖκας túmọ̀ sí ‘aya’; ‘yín’ sì mú ìbáṣepọ̀ ọkọ àti aya náà ṣe kedere ní Yorùbá àdánidá.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí ... pẹ̀lú
  rationale: Èyí fi ìfẹ́ Mèsáyà hàn gẹ́gẹ́ bí àpẹẹrẹ fún àwọn ọkọ, ó sì pa agbára καί mọ́.
- source_word: ὁ Χριστὸς
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò lílo rẹ̀ bí orúkọ lásán.
- source_word: ἠγάπησεν
  choice: ti fẹ́ràn
  rationale: Ìṣe àtijọ́ náà ni a túmọ̀ ní ọ̀nà tó rọrùn, tí ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àṣẹ ‘ẹ máa fẹ́ràn.’
- source_word: τὴν ἐκκλησίαν
  choice: ìjọ
  rationale: Níhìn-ín ἐκκλησία ń tọ́ka sí àwùjọ àwọn ènìyàn Ọlọ́run lápapọ̀; ‘ìjọ’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ nínú àyíká yìí.
- source_word: ἑαυτὸν παρέδωκεν
  choice: fi ara rẹ̀ lélẹ̀
  rationale: Gbólóhùn yìí fi ìfara-ẹni-fúnni àti ìyọ̀ǹda ara ẹni hàn láìfi èrò ẹ̀kọ́ ìsìn kún ohun tí Gíríìkì sọ ní tààrà.
- source_word: ὑπὲρ αὐτῆς
  choice: fún un
  rationale: ὑπέρ pẹ̀lú ọ̀rọ̀ olùní túmọ̀ sí ‘fún’ tàbí ‘ní àǹfààní’; ‘fún un’ jẹ́ Yorùbá àdánidá, ó sì tọ́ka padà sí ìjọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú àfiwé ọkọ, aya àti ìjọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ‘ẹni tí a fòróró yàn’ mọ́; àlàyé ìsàlẹ̀ fi ọ̀nà tí ó wọ́pọ̀, ‘Kristi,’ hàn láìgbé ẹ̀kọ́ ẹ̀ya ìjọ kan ga.
- issue: Ìwọ̀n èrò ẹbọ nínú παρέδωκεν ὑπὲρ αὐτῆς
  choice: fi ara rẹ̀ lélẹ̀ fún un
  alternative: fi ara rẹ̀ fún un
  rationale: Èyí pa ìtumọ̀ ìyọ̀ǹda ara ẹni nítorí ìjọ mọ́, ṣùgbọ́n kò fi ọ̀rọ̀ ‘rúbọ’ tàbí àlàyé ètùtù tí kò fara hàn gbangba nínú gbólóhùn náà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹ̀yin ọkọ’ jẹ́ ìpè tààrà sí àwọn ọkọ; ‘ẹ máa fẹ́ràn’ jẹ́ àṣẹ àdánidá tó lè fi ìṣe tí ń bá a lọ hàn. A kò fi akọ tàbí abo kún arọ́pò-orúkọ tó ń tọ́ka sí ìjọ, nítorí Yorùbá kò pín arọ́pò-orúkọ ẹni kẹta nípa akọ tàbí abo.
