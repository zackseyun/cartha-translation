id: EPH.5.31
reference: Ephesians 5:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: yo
  text: Nítorí ìdí èyí[a], ọkùnrin yóò fi baba àti ìyá rẹ̀ sílẹ̀, yóò sì faramọ́ aya rẹ̀, àwọn méjèèjì yóò sì di ara kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí èyí.” Gbólóhùn Gíríìkì ἀντὶ τούτου ń ṣiṣẹ́ níhìn-ín gẹ́gẹ́ bí àsopọ̀ tó ń fi ìdí hàn nínú àyọlò Gẹnẹsisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Nítorí ìdí èyí
  rationale: Gbólóhùn yìí ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ tó ń tọ́ka sí ìdí tàbí àbájáde nínú àyọlò Gẹnẹsisi 2:24; ó bá èdè Yorùbá àdánidá mu ju ìtumọ̀ líle bí ‘dípò èyí’ lọ.
- source_word: καταλείψει
  choice: yóò fi ... sílẹ̀
  rationale: Ó túmọ̀ sí pé ọkùnrin náà yóò kúrò nínú ìdílé àwọn òbí rẹ̀ láti dá ìrẹ́pọ̀ ìgbéyàwó tuntun sílẹ̀, láìfi èrò pé ó kọ̀ wọ́n sílẹ̀ pátápátá kún un.
- source_word: ἄνθρωπος
  choice: ọkùnrin
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ènìyàn lápapọ̀, aya ọkùnrin náà ni àyíká ọ̀rọ̀ yìí ń sọ̀rọ̀ nípa rẹ̀.
- source_word: πατέρα ... μητέρα
  choice: baba àti ìyá rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá fún títọ́ka sí àwọn òbí ọkùnrin náà.
- source_word: προσκολληθήσεται
  choice: yóò sì darapọ̀ mọ́
  rationale: Yíyan yìí fi ìsopọ̀ tímọ́tímọ́ nínú ìgbéyàwó hàn ní Yorùbá àdánidá, láìdín ọ̀rọ̀ náà kù sí ìfaramọ́ ti ara nìkan.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: aya rẹ̀
  rationale: Àyíká ìgbéyàwó mú kí γυνή túmọ̀ sí ‘aya,’ kì í ṣe ‘obìnrin’ lásán.
- source_word: ἔσονται οἱ δύο
  choice: àwọn méjèèjì yóò sì di
  rationale: Bí ó tilẹ̀ jẹ́ pé ἔσονται jẹ́ ‘yóò jẹ́,’ ‘yóò di’ ni ó sọ àbájáde ìrẹ́pọ̀ náà ní Yorùbá tó ṣe kedere; ‘àwọn méjèèjì’ sì pa οἱ δύο mọ́.
- source_word: εἰς σάρκα μίαν
  choice: ara kan
  rationale: Nínú àyọlò Gẹnẹsisi yìí, σάρξ ń tọ́ka sí ìrẹ́pọ̀ ìgbéyàwó, kì í ṣe ìwà ẹlẹ́ṣẹ̀. ‘Ara kan’ ni gbólóhùn Bíbélì tó ṣe kedere, tó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Èdè tó fi akọ àti abo hàn nínú àyọlò ìgbéyàwó
  choice: ọkùnrin ... aya rẹ̀
  alternative: ènìyàn ... ọkọ tàbí aya rẹ̀
  rationale: Ọ̀rọ̀ orísun fi tọkọtaya akọ àti abo hàn nínú àyọlò Gẹnẹsisi 2:24; ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́ láìsọ ọ́ di èdè àìṣelámìí akọ tàbí abo.
- issue: Ìtumọ̀ σάρξ nínú εἰς σάρκα μίαν
  choice: ara kan
  alternative: ẹran ara kan
  rationale: Níhìn-ín, σάρξ jẹ́ èdè ìrẹ́pọ̀ láti inú Gẹnẹsisi, kì í ṣe àpẹẹrẹ fún ẹ̀dá tàbí ìwà ẹlẹ́ṣẹ̀. ‘Ara kan’ pa ìtumọ̀ ìrẹ́pọ̀ náà mọ́ ní Yorùbá tó yé ni.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo ‘darapọ̀ mọ́’ fún ìrẹ́pọ̀ tímọ́tímọ́, ‘ara kan’ sì pa gbólóhùn Bíbélì tí a mọ̀ mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
