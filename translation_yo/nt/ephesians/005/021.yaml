translation:
  language: yo
  text: Ẹ sì máa tẹríba fún ara yín nínú ìbẹ̀rù Mèsáyà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìbòwọ̀ fún Mèsáyà” tàbí “nínú ìfẹ̀rùfẹ̀ Mèsáyà.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì náà ní “Kristi”; a tú u sí “Mèsáyà” níbí nítorí pé Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: ẹ sì máa tẹrí ba
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí ó ń tẹ̀ síwájú láti inú àṣẹ inú ẹsẹ tó ṣáájú. Gbólóhùn yìí fi ìtẹ̀síwájú náà hàn ní Yorùbá àdánidá, láì sọ pé ọ̀rọ̀ Gíríìkì náà jẹ́ reflexive ní pàtó.
- source_word: ἀλλήλοις
  choice: fún ara yín lẹ́nì-kí-kejì
  rationale: 'Èyí mú ìtumọ̀ reciprocal dative náà jáde kedere: olúkúlùkù sí ẹnì kejì.'
- source_word: ἐν φόβῳ
  choice: nínú ìbẹ̀rù
  rationale: “Nínú” pa ààyè tàbí ọ̀nà ìṣe tí ἐν lè tọ́ka sí mọ́; “ìbẹ̀rù” sì pa agbára àti ìfọ̀kànsìn ọ̀rọ̀ φόβος mọ́ láì rọ̀ ọ́ di ọ̀wọ̀ lásán.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” tú oyè náà sí èdè tí òǹkàwé Yorùbá lè mọ̀, dípò kí a fi transliteration “Kristi” nìkan sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “ìbẹ̀rù Mèsáyà”
  choice: ìbẹ̀rù ọlọ́wọ̀ tí a darí sí Mèsáyà
  alternative: ọ̀wọ̀ fún Mèsáyà; ìbẹ̀rù tí Mèsáyà mú wá
  rationale: Genitive náà ṣeé lóye ju lọ gẹ́gẹ́ bí ìbẹ̀rù tí a darí sí Mèsáyà, ṣùgbọ́n ọ̀rọ̀ àkọ́kọ́ kò sọ gbogbo ìṣòro ìtumọ̀ náà di ọ̀kan ṣoṣo. “Ìbẹ̀rù” pa ìnira ẹ̀kọ́-ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
- issue: Bí a ṣe tú Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí, agbára oyè Χριστός ṣì hàn; a fi àṣàyàn ìbílẹ̀ “Kristi” sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. “Ẹ sì máa” so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ kí participle Gíríìkì dun bí Yorùbá tí a ń sọ lónìí. “Tẹrí ba” níbí túmọ̀ sí fífi ara ẹni sábẹ́ ìlànà fún ire ẹnì kejì, kì í ṣe ìforíbalẹ̀ ìkíni.
