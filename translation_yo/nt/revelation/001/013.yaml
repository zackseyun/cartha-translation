  to: Àti ní àárín àwọn ọ̀pá fìtílà náà ni mo rí ẹni kan tí ó dà bí ọmọ ènìyàn[a], tí ó wọ aṣọ gígùn dé ẹsẹ̀, tí a sì fi àmùrè wúrà dì í ní àyà.
