id: REV.1.13
reference: Revelation 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: yo
  text: Àti ní àárín àwọn ọ̀pá fìtílà náà ni mo rí ẹni kan tí ó dà bí ọmọ ènìyàn[a], tí ó wọ aṣọ gígùn dé ẹsẹ̀, tí a sì fi àmùrè wúrà dì í ní àyà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “ẹni kan tí ó dà bí Ọmọ Ènìyàn.” Ọ̀rọ̀ Gíríìkì náà ń ránni létí Dáníẹ́lì 7:13, a sì lò ó níhìn-ín fún Jésù ẹni tí a gbé ga.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: ní àárín
  rationale: Ó pa ìtumọ̀ ibi tí ohun kan wà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó bá ara ìran náà mu.
- source_word: λυχνιῶν
  choice: àwọn ọ̀pá fìtílà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí a gbé fìtílà lé, kì í ṣe fìtílà fúnra rẹ̀; yíyan ọ̀rọ̀ yìí tún bá àlàyé àwòrán náà nínú Ìfihàn mu.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: ẹni kan tí ó dà bí ọmọ ènìyàn
  rationale: Èyí pa àìní àtíkúlù níwájú υἱὸν mọ́, ó sì jẹ́ kí ìtọ́kasí sí Dáníẹ́lì 7:13 dúró láìfi ipò orúkọ oyè pàtó kún ọ̀rọ̀ Gíríìkì.
- source_word: ἐνδεδυμένον
  choice: Ó wọ
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ipò ẹni náà gẹ́gẹ́ bí ẹni tí aṣọ ti wà lára rẹ̀ ní ọ̀nà àdánidá.
- source_word: ποδήρη
  choice: aṣọ gígùn tí ó dé ẹsẹ̀
  rationale: 'Ó ṣàlàyé ìtumọ̀ ọ̀rọ̀ náà ní kedere: aṣọ tí gígùn rẹ̀ dé ẹsẹ̀.'
- source_word: περιεζωσμένον
  choice: fi ... di
  rationale: Èyí mú àwòrán bí a ṣe fi àmùrè yí ara ká jáde ní Yorùbá àdánidá.
- source_word: πρὸς τοῖς μαστοῖς
  choice: àyà rẹ̀
  rationale: Ó tọ́ka sí ibi tí àmùrè náà wà lókè ara, ní ọ̀nà tó ṣe kedere tí kò sì ṣàjèjì ní Yorùbá.
- source_word: ζώνην χρυσᾶν
  choice: àmùrè wúrà
  rationale: “Àmùrè” lè jẹ́ ìgbànú tàbí aṣọ gbígbòòrò tí a fi yí ara ká; ó bá ipò rẹ̀ ní àyà àti ọlá ìran náà mu.
theological_decisions:
- issue: Agbára Kristológì nínú ὅμοιον υἱὸν ἀνθρώπου
  choice: ẹni kan tí ó dà bí ọmọ ènìyàn
  alternative: ẹni kan tí ó dà bí Ọmọ Ènìyàn
  rationale: Àkọ́kọ́ tẹ̀ lé gírámà Gíríìkì tí kò ní àtíkúlù, ó sì pa ìró Dáníẹ́lì 7:13 mọ́ láìsọ ọ́ di orúkọ oyè ní pàtó. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ Kristológì ìbílẹ̀ mọ́, nítorí ìran náà ń tọ́ka sí Jésù ẹni tí a gbé ga.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣeé lóye. “Ọ̀pá fìtílà” àti “àmùrè” pa àwòrán aṣọ àti ohun èlò inú ìran náà mọ́.
