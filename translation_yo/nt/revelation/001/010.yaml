id: REV.1.10
reference: Revelation 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: yo
  text: Ní ọjọ́ Olúwa[a], mo wà nínú Ẹ̀mí[b], mo sì gbọ́ ohùn ńlá kan lẹ́yìn mi bí ìró kàkàkí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, bí ó tilẹ̀ jẹ́ pé kò ṣeé ṣe púpọ̀, “ní ọjọ́ Olúwa,” ní ìtumọ̀ ọjọ́ ìkẹyìn. Ọ̀rọ̀ Gíríìkì náà níhìn-ín ni κυριακῇ ἡμέρᾳ (“ọjọ́ tí ó jẹ́ ti Olúwa”); kì í ṣe gbólóhùn tí a sábà máa ń lò fún “ọjọ́ Olúwa” ní ìtumọ̀ ọjọ́ ìkẹyìn.
    reason: alternative_reading
  - marker: b
    text: Tàbí “nínú ẹ̀mí.” Ó ṣeé ṣe kí gbólóhùn náà túmọ̀ sí pé ó wà lábẹ́ ìdarí Ẹ̀mí Mímọ́ nínú ipá àsọtẹ́lẹ̀; ẹsẹ náà kò sọ ní tààrà pé ó wà nínú ojúran.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: mo wà
  rationale: Ní Yorùbá àdánidá, ‘mo wà nínú Ẹ̀mí’ sọ pípa ẹni mọ́ sínú ipò náà ní kedere; fífi ‘mo di ẹni tí ó wà’ ṣe yóò le, kò sì ní jẹ́ èdè àdánidá.
- source_word: ἐν πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀ Gíríìkì mọ́, ó sì bá lílo ìran àsọtẹ́lẹ̀ nínú Ìfihàn mu. Àmì ohùn àti lẹ́tà ńlá lórí ‘Ẹ̀mí’ tọ́ka sí Ẹ̀mí Mímọ́ láì túmọ̀ rẹ̀ sí ‘ojúran’ tàbí ‘ìran ojú’.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: ní ọjọ́ Olúwa
  rationale: κυριακός túmọ̀ sí ohun tí ó jẹ́ ti Olúwa. ‘Ọjọ́ Olúwa’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ‘the Lord’s day,’ bí ó tilẹ̀ jẹ́ pé ó tún lè dà bí gbólóhùn ọjọ́ ìkẹyìn; àlàyé ìsàlẹ̀ ojú-ìwé pa ìyàtọ̀ Gíríìkì mọ́.
- source_word: ἤκουσα
  choice: mo sì gbọ́
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìmòye ohun tí etí gbọ́, kì í ṣe fífetísílẹ̀ pẹ̀lú ìfarabalẹ̀.
- source_word: ὀπίσω μου
  choice: lẹ́yìn mi
  rationale: Ó sọ ibi tí ohùn náà ti wá, kì í ṣe ìtẹ̀lé ní àkókò.
- source_word: φωνὴν μεγάλην
  choice: ohùn ńlá kan
  rationale: Ní àyíká yìí, μέγας sọ bí ohùn náà ṣe lágbára. ‘Ohùn ńlá’ jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún ohùn gíga tàbí alágbára.
- source_word: ὡς σάλπιγγος
  choice: bí ìró kàkàkí
  rationale: Fífi ‘ìró’ kún un mú kí àfiwé ohun náà ṣe kedere ní Yorùbá, láì fi èrò ìfẹ́ tàbí ìlù líle tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Bóyá ἐν πνεύματι túmọ̀ sí pé Ẹ̀mí Mímọ́ darí Johanu tàbí pé ó wà nínú ipò ojúran kan
  choice: nínú Ẹ̀mí
  alternative: nínú ẹ̀mí; nínú ojúran
  rationale: Gbólóhùn náà ṣeé ṣe kí ó tọ́ka sí agbára àsọtẹ́lẹ̀ Ẹ̀mí Mímọ́, ṣùgbọ́n Gíríìkì kò sọ ‘ojúran’ ní tààrà. Ìtumọ̀ náà pa ìṣòro ìtumọ̀ yìí mọ́.
- issue: Bóyá κυριακῇ ἡμέρᾳ jẹ́ ọjọ́ ìjọsìn ọ̀sẹ̀ tàbí ọjọ́ Olúwa ti ìkẹyìn
  choice: ọjọ́ Olúwa
  alternative: ọjọ́ tí ó jẹ́ ti Olúwa; ọjọ́ ìdájọ́ Olúwa
  rationale: Àpèjúwe κυριακός túmọ̀ sí ‘tí ó jẹ́ ti Olúwa,’ ó sì yàtọ̀ sí ọ̀nà Gíríìkì tí a sábà máa ń lò fún ‘ọjọ́ Olúwa’ ti ìkẹyìn. Àlàyé ìsàlẹ̀ ojú-ìwé ṣàfihàn àṣàyàn kejì láì fi í sí inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘kàkàkí’ fún trumpet, a sì fi ‘ìró’ hàn nítorí pé ohun tí a ń fi ohùn wé ni ànímọ́ ohun èlò náà. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
