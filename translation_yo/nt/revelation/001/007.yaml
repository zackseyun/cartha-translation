id: REV.1.7
reference: Revelation 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: yo
  text: Wò ó! Ó ń bọ̀ pẹ̀lú àwọn ìkùukùu, gbogbo ojú yóò rí i, àní àwọn tí wọ́n gún un; gbogbo ẹ̀yà ilẹ̀ ayé[a] yóò sì ṣọ̀fọ̀ nítorí rẹ̀. Bẹ́ẹ̀ ni, àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ẹ̀yà ilẹ̀ náà yóò ṣọ̀fọ̀ nítorí rẹ̀.” Gbolohun yìí lè jẹ́ ìró Sekaráyà 12:10–12, níbi tí “ilẹ̀ náà” ti lè bá ọ̀rọ̀ ibẹ̀ mu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Kíyèsí i
  rationale: Ó jẹ́ ìpè pàtàkì láti fa àfiyèsí olùgbọ́ sí ohun tí ń bọ̀; ọ̀rọ̀ náà bójú mu fún èdè Yorùbá òde òní, ó sì ní ìyì.
- source_word: ἔρχεται
  choice: ó ń bọ̀
  rationale: Ó pa ìgbésẹ̀ tí ó hàn bí ohun tó ń ṣẹlẹ̀ mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tọ́ka sí ìbọ̀ tí ń bẹ níwájú.
- source_word: μετὰ τῶν νεφελῶν
  choice: pẹ̀lú àwọn ìkùukùu
  rationale: Ó pa àwòrán àwọn ìkùukùu àti ìtumọ̀ ‘pẹ̀lú’ inú Gíríìkì mọ́, pẹ̀lú ìró ìtọ́kasí sí Dáníẹ́lì 7:13.
- source_word: πᾶς ὀφθαλμὸς
  choice: gbogbo ojú
  rationale: Ó pa àpẹẹrẹ ara tó ṣe kedere nínú Gíríìkì mọ́ dípò yíyí i sí ‘gbogbo ènìyàn.’
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: àwọn tí wọ́n gún un
  rationale: ‘Gún un’ sọ ìṣe náà ní kedere láìfi ohun ìjà kan kún ọ̀rọ̀ orísun, ó sì pa ìbáṣepọ̀ pẹ̀lú Sekaráyà 12:10 mọ́.
- source_word: κόψονται
  choice: yóò ṣọ̀fọ̀
  rationale: ‘Ṣọ̀fọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye fún ìbànújẹ́ àti ẹkún ọ̀fọ̀, láìfi ìfarahàn ara kan tí Gíríìkì kò sọ ní pàtó kún un.
- source_word: ἐπ’ αὐτὸν
  choice: nítorí rẹ̀
  rationale: Nínú ọ̀rọ̀ ọ̀fọ̀, gbolohun yìí lè túmọ̀ sí ṣíṣọ̀fọ̀ nípa rẹ̀ tàbí nítorí rẹ̀; ‘nítorí rẹ̀’ jẹ́ èdè Yorùbá àdánidá tó ṣì gba ìtumọ̀ ọ̀fọ̀ náà láàyè.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: gbogbo ẹ̀yà ilẹ̀ ayé
  rationale: ‘Ẹ̀yà’ pa ìtumọ̀ φυλαί mọ́, ‘ilẹ̀ ayé’ sì bá ìwọ̀n gbogbo ayé nínú ẹsẹ náà mu. Síbẹ̀, γῆ tún lè túmọ̀ sí ‘ilẹ̀ náà,’ èyí tí àlàyé ìsàlẹ̀ ojú-ewé pa mọ́.
- source_word: ναί, ἀμήν
  choice: Bẹ́ẹ̀ ni, àmín
  rationale: Ó pa ìfìdí-múlẹ̀ méjèèjì àti ìwọ̀n ìjọsìn ọ̀rọ̀ ‘àmín’ mọ́.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ τῆς γῆς nínú πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: gbogbo ẹ̀yà ilẹ̀ ayé
  alternative: gbogbo ẹ̀yà ilẹ̀ náà
  rationale: ‘Gbogbo ojú’ àti àwòrán ìbọ̀ rẹ̀ ṣe àtìlẹ́yìn fún ìwọ̀n gbogbo ayé. Ṣùgbọ́n ìró Sekaráyà 12:10–12 jẹ́ kí ‘ilẹ̀ náà’ tún ṣeé ṣe, nítorí náà a pa á mọ́ nínú àlàyé dípò pípa àìdánilójú náà rẹ́.
translation_notes:
  register: A lo èdè Yorùbá tó ní ìyì, tó ṣeé lóye ní òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Kíyèsí i’ ní agbára ìpè sí àfiyèsí, ‘ó ń bọ̀’ sì pa ìyè inú ọ̀rọ̀ àsìkò ìsinsìnyí Gíríìkì mọ́. A kò fi ohun ìjà tí a fi gún un tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tí kò sí nínú ẹsẹ náà kún un.
