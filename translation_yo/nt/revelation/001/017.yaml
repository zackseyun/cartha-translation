id: REV.1.17
reference: Revelation 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: yo
  text: Nígbà tí mo sì rí i, mo ṣubú lulẹ̀ ní ẹsẹ̀ rẹ̀ bí òkú[a]. Ó sì gbé ọwọ́ ọ̀tún rẹ̀ lé mi, ó ní, “Má bẹ̀rù[b]. Èmi ni Ẹni Àkọ́kọ́ àti Ẹni Ìkẹyìn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹni pé mo ti kú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Má fòyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Nígbà tí ... sì
  rationale: Ọ̀nà yìí fi ìtumọ̀ àkókò ὅτε hàn, ó sì lo ‘sì’ láti pa àsopọ̀ ìtàn καί mọ́ ní èdè Yorùbá àdánidá.
- source_word: εἶδον αὐτόν
  choice: mo rí i
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì ṣe kedere, fún ìríran ẹni tàbí ohun kan.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: mo ṣubú lulẹ̀ ní ẹsẹ̀ rẹ̀
  rationale: Ó sọ ìṣubú Johanu sí ẹsẹ̀ ẹni náà ní ọ̀nà Yorùbá tó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: ὡς νεκρός
  choice: bí òkú
  rationale: Ó pa àfiwé ὡς mọ́, kò sì sọ pé Johanu kú ní ti gidi.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: Ó ... gbé ọwọ́ ọ̀tún rẹ̀ lé mi
  rationale: ‘Gbé ... lé’ jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọwọ́ lé ẹnìkan; ‘ọwọ́ ọ̀tún’ sì wà ní tààrà nínú Gíríìkì.
- source_word: λέγων
  choice: ó ní
  rationale: Èyí sọ ọ̀rọ̀ tó tẹ̀ lé ìṣe fífi ọwọ́ lé Johanu ní Yorùbá tó lọ geere.
- source_word: Μὴ φοβοῦ
  choice: Má bẹ̀rù
  rationale: Àṣẹ ìdènà yìí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó ṣe kedere, fún kí ẹni má ṣe ní ìbẹ̀rù.
- source_word: ἐγώ εἰμι
  choice: Èmi ni
  rationale: ‘Èmi’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́, ‘ni’ sì ṣàgbékalẹ̀ ìdánimọ̀ tó tẹ̀ lé e lọ́nà àdánidá.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Ẹni Àkọ́kọ́ àti Ẹni Ìkẹyìn
  rationale: Àwọn ajẹtífù ọlọ́rọ̀-ìtọ́ka náà ń ṣiṣẹ́ bí orúkọ oyè. ‘Ẹni’ mú ìlò yìí ṣe kedere ní Yorùbá, àwọn lẹ́tà ńlá sì fi hàn pé orúkọ oyè ni.
theological_decisions:
- issue: Lílo ὁ πρῶτος καὶ ὁ ἔσχατος gẹ́gẹ́ bí orúkọ oyè
  choice: Ẹni Àkọ́kọ́ àti Ẹni Ìkẹyìn
  alternative: ẹni àkọ́kọ́ àti ẹni ìkẹyìn
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ìdánimọ̀ ọlọ́lá ni, tó tún dún bí èdè orúkọ oyè Ọlọ́run nínú Aísáyà. Lẹ́tà ńlá fi agbára orúkọ oyè hàn láìyí ìtumọ̀ ọ̀rọ̀ Gíríìkì padà.
- issue: Agbára ìtẹnumọ́ ἐγώ εἰμι
  choice: Èmi ni
  alternative: Èmi ni ẹni náà
  rationale: ‘Èmi ni’ pa ìdánimọ̀ àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́, láìfi ‘ẹni náà’ tàbí ìtọ́kasí ẹ̀kọ́ ìgbàgbọ́ tí kò fara hàn nínú ẹsẹ yìí kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye. Àwọn àmì ohùn ni a lò ní kíkún níbi tí wọ́n ti yẹ. A pa ìṣàn ìtàn mọ́ pẹ̀lú ‘sì,’ a sì yàgò fún ọ̀rọ̀ ìjọ kan pàtó tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú orísun.
