id: REV.1.11
reference: Revelation 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: yo
  text: 'tí ó ń wí pé, “Ohun tí o rí, kọ ọ sínú ìwé[a], kí o sì rán an sí àwọn ìjọ méje náà: sí Éfésù, sí Símínà, sí Pẹ́gámù[b], sí Tíátírà, sí Sádísì, sí Fíládélífíà àti sí Laodíkíà.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “sínú àkájọ ìwé”; ọ̀rọ̀ Gíríìkì βιβλίον lè túmọ̀ sí àkájọ ìwé, ìwé tàbí àkọsílẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan tún máa ń pe Pẹ́gámù ní “Pẹ́gámọ́sì.”
    reason: alternative_reading
lexical_decisions:
- source_word: λεγούσης
  choice: tí ó ń wí pé
  rationale: Ọ̀rọ̀ alábápín ìsinsìnyí yìí ń tẹ̀ síwájú láti inú àpèjúwe ohùn ní ẹsẹ tó ṣáájú; gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti ṣí ọ̀rọ̀ tí a fa yọ.
- source_word: Ὃ βλέπεις
  choice: Ohun tí ìwọ rí
  rationale: Ó pa ìtumọ̀ gbòòrò ohun tí Jòhánù ń rí mọ́, láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: γράψον εἰς βιβλίον
  choice: kọ ọ sínú ìwé
  rationale: Àṣẹ γράψον ni a túmọ̀ ní tààrà gẹ́gẹ́ bí ‘kọ’; sínú ìwé sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ohun tí a kọ sínú ìwé tàbí àkọsílẹ̀.
- source_word: πέμψον
  choice: rán an
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ‘an’ tọ́ka sí ohun tí a kọ, bí àyíká ọ̀rọ̀ ṣe fi hàn, ó sì mú gbólóhùn Yorùbá ṣe déédéé.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: sí àwọn ìjọ méje náà
  rationale: ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn àwùjọ Kristẹni pàtó tí a ń kọ̀wé sí níbí; kò sọ ẹ̀ya ìjọ kan pàtó.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: sí Éfésù ... àti sí Laodíkíà
  rationale: Àtúnwí sí níwájú orúkọ ìlú kọ̀ọ̀kan ń fi ìpín àwọn ibi tí a ó rán ìwé náà sí hàn, gẹ́gẹ́ bí àtúnwí εἰς nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησίαις nínú Ìfihàn 1:11
  choice: àwọn ìjọ
  alternative: àwọn àpéjọ
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn àwùjọ Kristẹni tó wà ní àwọn ìlú pàtó. ‘Àwọn ìjọ’ sọ ìtumọ̀ yẹn ní Yorùbá àdánidá láìgbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọlé.
translation_notes:
  register: A lo Yorùbá àpéjọpọ̀, ọ̀wọ̀, àti ti òde òní pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa ìlànà àṣẹ méjèèjì àti àtúnwí ibi tí a ó rán ìwé sí mọ́. Àwọn àmì àlàyé ìsàlẹ̀ ni a gbé sí ọ̀rọ̀ tí wọ́n ń ṣàlàyé, dípò lẹ́yìn λεγούσης tàbí Ὃ βλέπεις.
