id: REV.1.5
reference: Revelation 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: yo
  text: àti láti ọ̀dọ̀ Jésù Mèsáyà[a], ẹlẹ́rìí olóòótọ́, ẹni àkọ́bí láti inú àwọn òkú, àti olùṣàkóso àwọn ọba ayé. Sí ẹni tí ó fẹ́ràn wa, tí ó sì tú wa sílẹ̀ kúrò nínú àwọn ẹ̀ṣẹ̀ wa nípasẹ̀ ẹ̀jẹ̀ rẹ̀[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ oyè tí ó túmọ̀ sí “Mèsáyà.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní “tí ó sì wẹ̀ wá kúrò nínú àwọn ẹ̀ṣẹ̀ wa nípasẹ̀ ẹ̀jẹ̀ rẹ̀” dípò “tí ó sì tú wa sílẹ̀ kúrò nínú àwọn ẹ̀ṣẹ̀ wa nípasẹ̀ ẹ̀jẹ̀ rẹ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí, kì í ṣe orúkọ ìdílé; “Mèsáyà” mú ìtumọ̀ oyè náà wá sí Yorùbá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé tọ́ka sí “Kristi” gẹ́gẹ́ bí ọ̀nà míì tí a mọ̀ dáadáa.
- source_word: μάρτυς ὁ πιστός
  choice: ẹlẹ́rìí olóòótọ́
  rationale: “Ẹlẹ́rìí” túmọ̀ sí ẹni tí ń jẹ́rìí, kì í ṣe dandan ẹni tí a pa nítorí ẹ̀rí rẹ̀; “olóòótọ́” sì pa ìgbẹ́kẹ̀lé àti ìdúróṣinṣin πιστός mọ́.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: ẹni àkọ́bí láti inú àwọn òkú
  rationale: Èyí pa àwòrán “àkọ́bí” mọ́, ó sì sọ ìjáde láti inú ikú ní Yorùbá tí ó ṣe kedere láì túmọ̀ àṣẹ tàbí ipò ọlá náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: olùṣàkóso àwọn ọba ayé
  rationale: “Olùṣàkóso” fi àṣẹ ἄρχων hàn ní kedere, “ayé” sì bá ìwọ̀n gbogbo ayé nínú Ìfihàn mu ju “ilẹ̀” lọ.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: Sí ẹni tí ó fẹ́ràn wa
  rationale: “Ó fẹ́ràn wa” jẹ́ ọ̀nà àdánidá láti fi iṣẹ́ tí ń bá a lọ nínú participle àsìkò ìsinsìnyí hàn; “Sí ẹni” pa ìbẹ̀rẹ̀ ọ̀rọ̀ ìyìn tí ń tẹ̀ síwájú mọ́.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: tí ó sì dá wa sílẹ̀ kúrò nínú àwọn ẹ̀ṣẹ̀ wa
  rationale: “Dá wa sílẹ̀” sọ ìtúsílẹ̀ λύω ní Yorùbá àdánidá, “kúrò nínú” sì pa ìtumọ̀ ìyapa ἐκ mọ́.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: nípasẹ̀ ẹ̀jẹ̀ rẹ̀
  rationale: Ní àyíká yìí ἐν ń tọ́ka sí ohun èlò tàbí ọ̀nà; “nípasẹ̀ ẹ̀jẹ̀ rẹ̀” sọ èyí kedere láì mú èdè ẹbọ náà kúrò.
theological_decisions:
- issue: Ìyàtọ̀ ọ̀rọ̀ inú àwọn ẹ̀dà lẹ́yìn “ó fẹ́ràn wa”
  choice: λύσαντι—“dá wa sílẹ̀”
  alternative: λούσαντι—“wẹ̀ wá mọ́”
  rationale: SBLGNT tí a fi lélẹ̀ ní λύσαντι, nítorí náà ọ̀rọ̀ pàtàkì tẹ̀ lé e; àlàyé ìsàlẹ̀ ojú ewé pa ẹ̀rí ẹ̀dà míì tí ó ṣe pàtàkì mọ́.
- issue: Bí a ṣe túmọ̀ oyè Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. “Mèsáyà” mú oyè ẹni àmì òróró náà hàn, nígbà tí àlàyé fi ọ̀nà ìbílẹ̀ “Kristi” pamọ́.
- issue: Ìtumọ̀ “àkọ́bí” ní ìbáṣepọ̀ pẹ̀lú àwọn òkú
  choice: ẹni àkọ́bí láti inú àwọn òkú
  alternative: àkọ́bí àwọn òkú
  rationale: Àṣàyàn náà pa àwòrán àkọ́bí àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àjíǹde mọ́, ṣùgbọ́n kò sọ ní pàtó bóyá àfojúsùn pàtàkì ni ìṣáájú ní àkókò tàbí ipò ọlá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì yẹ fún kíkà ní gbangba. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. Àmì gígùn ní ìparí fi hàn pé gbólóhùn ìyìn náà ń tẹ̀ síwájú sí ẹsẹ tó tẹ̀ lé e.
