id: REV.1.1
reference: Revelation 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: yo
  text: Ìṣípayá Jésù Mèsáyà[a], èyí tí Ọlọ́run fún un kí ó lè fi ohun tí ó gbọ́dọ̀ ṣẹlẹ̀ láìpẹ́[b] hàn àwọn ẹrú rẹ̀; ó sì fi àmì hàn[c] nípa rírán án nípasẹ̀ áńgẹ́lì rẹ̀ sí ẹrú rẹ̀, Jòhánù,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “Ìṣípayá láti ọ̀dọ̀ Jésù Mèsáyà” tàbí “Ìṣípayá nípa Jésù Mèsáyà.” Ìṣọ̀kan ọ̀rọ̀ Gíríìkì lè ní ju ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí lọ.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ní kíákíá.” Ó lè túmọ̀ sí pé àwọn nǹkan wọ̀nyí yóò ṣẹlẹ̀ láìpẹ́, tàbí pé wọn yóò ṣẹlẹ̀ kánkán nígbà tí wọn bá bẹ̀rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ ọ̀rọ̀ Gíríìkì náà sí “ó sọ ọ́ di mímọ̀.” “Ó fi àmì hàn” ń pa àfikún ìtumọ̀ ìbánisọ̀rọ̀ nípasẹ̀ àmì mọ́, èyí tí ó bá ọ̀pọ̀ àmì àti àpẹẹrẹ inú ìwé yìí mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: Ìṣípayá
  rationale: Ó túmọ̀ sí ṣíṣí ohun tí ó ti fara sin payá tàbí fífi í hàn; “ìṣípayá” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ìtumọ̀ náà mu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Mèsáyà” fi Χριστός hàn gẹ́gẹ́ bí oyè, kì í ṣe bí orúkọ ìdílé. Ìṣọ̀kan oníjẹ́nítífù Gíríìkì ṣì lè túmọ̀ sí ti, láti ọ̀dọ̀, tàbí nípa Jésù Mèsáyà.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: èyí tí Ọlọ́run fi fún un
  rationale: 'Ó pa ìyàtọ̀ tó wà nínú gbólóhùn Gíríìkì mọ́: Ọlọ́run ni olùfúnni, “un” sì ń tọ́ka sí Jésù Mèsáyà.'
- source_word: δεῖξαι
  choice: láti fi ... han
  rationale: Èyí jẹ́ ìtumọ̀ àdánidá fún ọ̀rọ̀ tó ń fi ète fífúnni hàn, ó sì bá àyíká ìran mu.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: àwọn ẹrú rẹ̀
  rationale: “Ẹrú” pa ìtumọ̀ jíjẹ́ ohun-ìní àti ìdè ìgbọràn inú δοῦλος mọ́, bí ó tilẹ̀ jẹ́ pé “ìránṣẹ́” lè rọrùn sí etí òde òní.
- source_word: ἃ δεῖ γενέσθαι
  choice: ohun tí ó ní láti ṣẹlẹ̀
  rationale: Ó sọ dandan tí δεῖ ń fi hàn ní Yorùbá àdánidá.
- source_word: ἐν τάχει
  choice: láìpẹ́
  rationale: Ó fi ìsúnmọ́ àkókò hàn; àmọ́ gbólóhùn náà tún lè tọ́ka sí bí nǹkan yóò ṣe ṣẹlẹ̀ kánkán.
- source_word: ἐσήμανεν
  choice: ó sọ ọ́ di mímọ̀
  rationale: Ó jẹ́ Yorùbá tí ó ṣe kedere fún “ó jẹ́ kí a mọ̀”; àfikún ìtumọ̀ ìbánisọ̀rọ̀ nípasẹ̀ àmì ni a pa mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: nípa rírán á nípasẹ̀ áńgẹ́lì rẹ̀
  rationale: Ó pa ipa participle gẹ́gẹ́ bí ọ̀nà tí ìfihàn náà gbà dé mọ́, διά sì fi áńgẹ́lì hàn gẹ́gẹ́ bí alárinà.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: sí ẹrú rẹ̀, Jòhánù
  rationale: Dative náà ń fi olùgbà hàn, a sì lo “ẹrú” ní ìbámu pẹ̀lú ìfarahàn àkọ́kọ́ ti δοῦλος.
theological_decisions:
- issue: Oníjẹ́nítífù nínú Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: Ìṣípayá Jésù Mèsáyà
  alternative: Ìṣípayá láti ọ̀dọ̀ Jésù Mèsáyà; ìṣípayá nípa Jésù Mèsáyà
  rationale: Ìkọ̀wé àkọ́kọ́ kò yan ọ̀kan ṣoṣo láàárín orísun, ohun-ìní, àti kókó ìṣípayá. Ìtumọ̀ pàtàkì pa àìdánilójú yẹn mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé rẹ̀.
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú/àwọn ẹrú
  alternative: ìránṣẹ́/àwọn ìránṣẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tẹnu mọ́ jíjẹ́ ti Olúwa àti ìgbọràn sí i; “ẹrú” pa agbára ọ̀rọ̀ Gíríìkì mọ́ láìfi ẹ̀kọ́ ẹgbẹ́ ìsìn kún un.
- issue: Ìtumọ̀ ἐν τάχει
  choice: láìpẹ́
  alternative: ní kíákíá
  rationale: 'Mejèèjì ṣeé ṣe: ó lè jẹ́ ìsúnmọ́ àkókò, tàbí yíyára lẹ́yìn tí ìṣẹ̀lẹ̀ bá bẹ̀rẹ̀. Àkọ́lé yan ìsúnmọ́ àkókò, àlàyé sì pa èkejì mọ́.'
- issue: Àfikún ìtumọ̀ àmì nínú ἐσήμανεν
  choice: ó sọ ọ́ di mímọ̀
  alternative: ó fi àmì sọ ọ́ di mímọ̀
  rationale: Àkọ́lé lo ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, ṣùgbọ́n àlàyé pa àfikún pé ìbánisọ̀rọ̀ lè jẹ́ nípasẹ̀ àmì mọ́, èyí tó bá ìwà ìṣàpẹẹrẹ ìwé náà mu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá; ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “Mèsáyà” gẹ́gẹ́ bí oyè, “ẹrú” fún agbára δοῦλος, àti “áńgẹ́lì” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó mọ́ sí ọ̀pọ̀ ènìyàn.
