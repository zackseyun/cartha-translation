  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ àti àwọn èrò pàtàkì Gíríìkì dáadáa: Ọlọ́run fún Jésù ní ìṣípayá náà, láti fihàn fún àwọn ẹrú rẹ̀ ohun tí ó jẹ́ dandan láti ṣẹlẹ̀; a sì rán án nípasẹ̀ áńgẹ́lì sí Jòhánù. Ṣùgbọ́n “ó sọ ọ́ di mímọ̀” kò pa ìfarahàn ‘nípasẹ̀ àmì’ nínú ἐσήμανεν mọ́ dáadáa nínú àkọ́lé, bí ó tilẹ̀ wà nínú àlàyé ìsàlẹ̀.'
  naturalness: Yorùbá náà léròye, ṣùgbọ́n “fi fún un láti fi ... hàn” tún ‘fi’ ṣe léraléra, àti “rírán á” yẹ kí ó jẹ́ “rírán án.” Àtúnṣe náà mú ìṣàn gbolóhùn boṣewa rọrùn, ó sì gbe àwọn àmì àlàyé síbi ọ̀rọ̀ tí ọkọọkan wọn ń ṣàlàyé.
  terminology: “Ìṣípayá,” “Mèsáyà,” “ẹrú,” àti “áńgẹ́lì” jẹ́ àwọn yíyan tó yẹ. “Ẹrú” ń pa agbára δοῦλος mọ́ nínú àyíká ìbámu sí olúwa. A pa àìdánilójú genitive nínú “Ìṣípayá Jésù Mèsáyà” mọ́, a kò sì túmọ̀ ọ́ sí ‘láti ọ̀dọ̀’ tàbí ‘nípa’ nìkan.
