id: REV.1.15
reference: Revelation 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: yo
  text: Àwọn ẹsẹ̀ rẹ̀ sì dà bí idẹ dídán[a], bí ẹni pé a ti fi iná mú un gbóná nínú ìléru; ohùn rẹ̀ sì dà bí ìró omi púpọ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ tí a túmọ̀ sí ‘idẹ dídán’ ṣọ̀wọ́n, ohun tí ó ń tọ́ka sí gan-an kò sì dájú. Ó lè jẹ́ irin àdàlú tí a ti yọ́ mọ́ gidigidi tàbí tí ó ń dán gbígbóná; a tún lè túmọ̀ rẹ̀ sí ‘idẹ dídára’ tàbí ‘idẹ tí a ti dán.’
    reason: lexical_alternative
  - marker: b
    text: 'Ní ìtumọ̀ tó tẹ̀ lé ọ̀rọ̀ Gíríìkì gan-an: ‘bí ohùn omi púpọ̀.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: àwọn ẹsẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘ẹsẹ̀’ ní pàtàkì; ó sì bá àwòrán ìran náà mu láì mú kí ó túmọ̀ sí gbogbo apá ìsàlẹ̀ ẹsẹ̀.
- source_word: ὅμοιοι
  choice: dà bí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìfiwéra hàn.
- source_word: χαλκολιβάνῳ
  choice: idẹ dídán
  rationale: Ọ̀rọ̀ Gíríìkì yìí ṣọ̀wọ́n, ohun tí irin náà jẹ́ gan-an kò sì dájú. ‘Idẹ dídán’ fi ìmọ́lẹ̀ irin tí a ti ṣiṣẹ́ dáadáa hàn láì sọ irú àdàlú irin kan pàtó.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: bí èyí tí a ti yọ́ mọ́ nínú ìléru
  rationale: Gbólóhùn náà ń tọ́ka sí irin tí iná ìléru ti mú gbóná tàbí ti yọ́ mọ́. Ìtumọ̀ yìí pa àwòrán iṣẹ́ irin mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: φωνή
  choice: ohùn
  rationale: Ní ìlò àkọ́kọ́, ọ̀rọ̀ náà ń tọ́ka sí ohùn ẹni náà, nítorí náà ‘ohùn’ ni ìtumọ̀ tààrà tó yẹ.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: bí ìró omi púpọ̀
  rationale: Ní ìfiwéra kejì, ‘ìró’ sọ ohun tí etí ń gbọ́ láti inú omi di mímọ̀, nígbà tí ‘omi púpọ̀’ pa àwòrán Bíbélì náà mọ́ láì dín in kù sí ìró òkun tàbí ìṣàn omi kan pàtó.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àtúnlò φωνή nínú ìfiwéra ìkẹyìn
  choice: ohùn rẹ̀ sì dà bí ìró omi púpọ̀
  alternative: ohùn rẹ̀ sì dà bí ohùn omi púpọ̀
  rationale: ‘Ìró omi púpọ̀’ jẹ́ Yorùbá tí ó yéni, ó sì pa agbára àwòrán ọlá Ọmọ Ènìyàn tí a gbé ga mọ́. Àṣàyàn tó tẹ̀ lé ọ̀rọ̀ Gíríìkì pé ‘ohùn omi púpọ̀’ wà nínú àlàyé ìsàlẹ̀ láti má ṣe fi ìtumọ̀ míì tó ṣeé ṣe pamọ́.
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tó ṣeé lóye. ‘Dà bí’ jẹ́ ọ̀nà ìfiwéra àdánidá; ‘ìléru’ sì pa àwòrán ibi tí a ti ń fi iná ṣiṣẹ́ irin mọ́. Àwọn àmì àlàyé [a] àti [b] bá àwọn àlàyé wọn mu.
