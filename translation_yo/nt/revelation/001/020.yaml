id: REV.1.20
reference: Revelation 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: yo
  text: 'Ní ti ohun ìjìnlẹ̀ nípa ìràwọ̀ méje tí o rí ní ọwọ́ ọ̀tún mi, àti ọ̀pá fìtílà wúrà méje náà: àwọn ìràwọ̀ méje náà ni àwọn áńgẹ́lì[a] ìjọ méje náà, àwọn ọ̀pá fìtílà méje náà sì ni ìjọ méje náà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ońṣẹ́ ìjọ méje náà.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn áńgẹ́lì tàbí àwọn ońṣẹ́ ènìyàn.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: Ó pa ìtumọ̀ ohun tí a kò mọ̀ tẹ́lẹ̀ ṣùgbọ́n tí a ṣí payá mọ́, láì sọ ọ́ di ‘ìtumọ̀ àmì’ lásán.
- source_word: ἀστέρων / ἀστέρες
  choice: ìràwọ̀ / àwọn ìràwọ̀
  rationale: Ìtumọ̀ tààrà fún àwòrán inú ìran náà; gbólóhùn tó tẹ̀ lé e ṣàlàyé ohun tí wọ́n dúró fún.
- source_word: οὓς εἶδες
  choice: tí o rí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti pa gbólóhùn aláṣepọ̀ tó ń ṣàpèjúwe àwọn ìràwọ̀ mọ́.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: ní ọwọ́ ọ̀tún mi
  rationale: Ó bá àwòrán tí a ti gbé kalẹ̀ nínú àyíká ọ̀rọ̀ mu, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: λυχνίας
  choice: ọ̀pá fìtílà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí a gbé fìtílà lé, kì í ṣe fìtílà fúnra rẹ̀.
- source_word: χρυσᾶς
  choice: wúrà
  rationale: Nínú àkópọ̀ ‘ọ̀pá fìtílà wúrà,’ èyí jẹ́ ọ̀nà Yorùbá ṣókí àti àdánidá láti sọ pé wúrà ni a fi ṣe wọ́n.
- source_word: ἄγγελοι
  choice: àwọn áńgẹ́lì
  rationale: Ìwé Ìfihàn sábà máa ń lo ọ̀rọ̀ náà fún àwọn ẹ̀dá ọ̀run; síbẹ̀, a pa ìtumọ̀ ‘àwọn ońṣẹ́’ mọ́ sínú àlàyé ìsàlẹ̀ nítorí ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí méjèèjì.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: ìjọ / àwọn ìjọ
  rationale: ‘Ìjọ’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àwọn àwùjọ onígbàgbọ́ tí a kọ̀wé sí mu.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Ní ti ohun ìjìnlẹ̀ nípa ... àti ...:'
  rationale: Ó gbé àwọn ohun méjèèjì kalẹ̀ gẹ́gẹ́ bí kókó ọ̀rọ̀, kí àlàyé wọn tó tẹ̀ lé e, láì fi ọ̀rọ̀ tuntun kún orísun.
theological_decisions:
- issue: Ohun tí ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν ń tọ́ka sí
  choice: àwọn áńgẹ́lì ìjọ méje náà
  alternative: àwọn ońṣẹ́ ìjọ méje náà
  rationale: Ἄγγελος lè jẹ́ ẹ̀dá ọ̀run tàbí ońṣẹ́ ènìyàn. Nítorí lílò rẹ̀ fún àwọn ẹ̀dá ọ̀run wọ́pọ̀ nínú Ìfihàn, ‘áńgẹ́lì’ wà nínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ sì pa ìtumọ̀ mìíràn mọ́, kí a má bàa yanju ohun tí orísun kò yanju.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. A lo àmì ohùn ní kíkún níbi tó bá yẹ; ‘ohun ìjìnlẹ̀’ pa àwọ̀ ìfihàn àti ẹ̀kọ́ ẹ̀sìn ti μυστήριον mọ́, ‘ọ̀pá fìtílà’ sì yà ibi tí a gbé fìtílà lé sọ́tọ̀ kúrò lọ́dọ̀ fìtílà fúnra rẹ̀.
