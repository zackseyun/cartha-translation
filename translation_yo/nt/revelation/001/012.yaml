id: REV.1.12
reference: Revelation 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: yo
  text: Mo sì yí padà láti wo ohùn tí ń bá mi sọ̀rọ̀[a]; nígbà tí mo sì yí padà, mo rí ọ̀pá fìtílà wúrà méje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ń sọ̀rọ̀ sí mi.” Ní ti gangan, Gíríìkì sọ pé, “tí ń bá mi sọ̀rọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: Mo sì yí padà
  rationale: Ó sọ ìṣe ti ara ní kedere pé Jòhánù yíjú sí ẹ̀yìn tàbí sí ibi tí ohùn náà ti ń wá, láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: βλέπειν
  choice: láti wo
  rationale: Ọ̀rọ̀ àìlẹ́ni náà fi ète ìyípadà Jòhánù hàn. “Láti wo” jẹ́ èdè Yorùbá àdánidá, ó sì pa àjèjì gbolohun náà mọ́ pé ó fẹ́ “wo ohùn.”
- source_word: φωνὴν
  choice: ohùn
  rationale: Nítorí pé ohun tí a ń sọ nípa rẹ̀ ń sọ̀rọ̀, “ohùn” ni ìtumọ̀ tó bá àyíká ọ̀rọ̀ mu jù “ìró” lọ.
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: tí ń bá mi sọ̀rọ̀
  rationale: “Ń … sọ̀rọ̀” fi ìṣe tó ń lọ lọ́wọ́ hàn, “bá mi” sì tẹ̀ lé ìtumọ̀ ìbáṣepọ̀ inú μετά pẹ̀lú ẹ̀yà arọ́pò-orúkọ genitive. Àmì àlàyé tọ́ka sí ọ̀nà Yorùbá mìíràn tó ṣeé ṣe.
- source_word: ἐπιστρέψας
  choice: nígbà tí mo sì yí padà
  rationale: Ó sọ ìbáṣepọ̀ àkókò participle aorist náà ní Yorùbá tó rọrùn, ó sì pa ìtẹ̀lé ìṣe mọ́.
- source_word: εἶδον
  choice: mo rí
  rationale: Ìtumọ̀ tààrà àti àdánidá ti aorist ὁράω ni àyíká yìí.
- source_word: ἑπτὰ
  choice: méje
  rationale: Òǹkà náà jẹ́ méje láìsí àìdánilójú.
- source_word: λυχνίας
  choice: ọ̀pá fìtílà
  rationale: Ó ń tọ́ka sí ohun tí a gbé fìtílà lé, kì í ṣe fìtílà fúnra rẹ̀. Yíyan yìí tún pa àwòrán tí a túmọ̀ ní Ìfihàn 1:20 mọ́.
- source_word: χρυσᾶς
  choice: wúrà
  rationale: Nínú àkójọpọ̀ “ọ̀pá fìtílà wúrà,” ó fi ohun èlò tàbí ìrísí wúrà wọn hàn ní ṣókí àti ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ λυχνίας, ohun àmì kan nínú ìran àpókálíìpù
  choice: ọ̀pá fìtílà
  alternative: fìtílà
  rationale: Ọ̀rọ̀ Gíríìkì ń tọ́ka sí ibi ìgbé-fìtílà, Ìfihàn 1:20 sì máa ń ṣàlàyé àwọn ọ̀pá fìtílà méje náà gẹ́gẹ́ bí àmì. “Fìtílà” nìkan yóò da ohun tí a gbé lé ọ̀pá pọ̀ mọ́ ọ̀pá fúnra rẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì àti àmì ohùn ní kíkún. A mọ̀ọ́mọ̀ pa àkójọpọ̀ àjèjì “wo ohùn” mọ́ nítorí pé bẹ́ẹ̀ ni ọ̀rọ̀ Gíríìkì ṣe rí, dípò ṣíṣe àlàyé rẹ̀ sí “wo ẹni tí ohùn náà ń jáde láti ọ̀dọ̀ rẹ̀.”
