  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: yo
  text: Nítorí náà, kọ ohun tí o ti rí, àti ohun tí ó wà, àti ohun tí ó fẹ́ ṣẹlẹ̀[a] lẹ́yìn àwọn nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí yóò ṣẹlẹ̀ lẹ́yìn àwọn nǹkan wọ̀nyí.” Ní àwọn àyíká kan, ọ̀rọ̀-ìṣe náà lè túmọ̀ bí ọjọ́ iwájú lásán, bó tilẹ̀ jẹ́ pé ó sábà máa ń ní ìtumọ̀ ohun tó fẹ́ ṣẹlẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: kọ
  rationale: Ọ̀rọ̀ àṣẹ ní ẹnì kejì ẹyọ ni; “kọ” jẹ́ ọ̀nà Yorùbá tó ṣe tààrà láti pa àṣẹ náà mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so àṣẹ yìí mọ́ ìran àti iṣẹ́ tí a ṣẹ̀ṣẹ̀ fi fún Jòhánù, ó sì pa agbára ìyọrísí ọ̀rọ̀ Gíríìkì náà mọ́.
- source_word: ἃ εἶδες
  choice: ohun tí o ti rí
  rationale: Ó tọ́ka sí ohun inú ìran tí Jòhánù ti rí tẹ́lẹ̀; “ti rí” fi ìṣe tó ti ṣẹlẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἃ εἰσὶν
  choice: ohun tí ó wà
  rationale: Ìtumọ̀ àpapọ̀ yìí jẹ́ Yorùbá àdánidá fún ọ̀pọ̀ ohun tàbí ipò tó wà ní ìsinsìnyí, láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: μέλλει γίνεσθαι
  choice: ohun tí ó fẹ́ ṣẹlẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí pa ìmọ̀lára ohun tó ń bọ̀ wá ṣẹlẹ̀ mọ́, dípò kí a sọ ọ́ di ọjọ́ iwájú lásán.
- source_word: μετὰ ταῦτα
  choice: lẹ́yìn àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ àkókò àti ọ̀pọ̀ nọ́ńbà inú ọ̀rọ̀ atọ́ka Gíríìkì náà mọ́.
theological_decisions:
- issue: Agbára àkókò μέλλει nínú ọ̀rọ̀ ìran nípa ohun tó ń bọ̀
  choice: ohun tí ó fẹ́ ṣẹlẹ̀
  alternative: ohun tí yóò ṣẹlẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà sábà máa ń tọ́ka sí ohun tó sún mọ́lé tàbí tó ń bọ̀ wá ṣẹlẹ̀. Yíyan èyí pa ìfọ̀kànsìn àkókò inú ẹsẹ náà mọ́, láìdá ìjíròrò nípa àsọtẹ́lẹ̀ ọjọ́ iwájú parí.
translation_notes:
  register: 'A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣe kedere fún òǹkàwé navnav. Àmì ohùn wà níbi tó bá yẹ; a lo “nǹkan” gẹ́gẹ́ bí àkọtọ̀ Yorùbá boṣewa. Àtẹ̀jáde náà tẹ̀ lé ìṣètò mẹ́ta inú Gíríìkì: ohun tí a ti rí, ohun tó wà, àti ohun tó fẹ́ ṣẹlẹ̀.'
