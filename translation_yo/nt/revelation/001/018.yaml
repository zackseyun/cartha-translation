id: REV.1.18
reference: Revelation 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: yo
  text: àti Ẹni Alààyè náà—mo sì di òkú[a], ṣùgbọ́n wò ó, mo wà láàyè títí láé àti láéláé[b]—mo sì ní àwọn kọ́kọ́rọ́ ikú àti ti Hédíìsì[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní èdè tí ó rọrùn sí i, “mo kú.” Gíríìkì sọ ní tààrà pé “mo di òkú,” ó ń tẹnumọ́ ìyípadà sí ipò ikú.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “sí àwọn sáà ti àwọn sáà”; àṣà-ọrọ Gíríìkì ni fún àkókò tí kò ní òpin.
    reason: lexical_alternative
  - marker: c
    text: “Hédíìsì” ń tọ́ka sí ibùgbé àwọn òkú, kì í ṣe ibi ìjìyà ìkẹyìn ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: Ẹni Alààyè náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníkọ̀ọ́kan pẹ̀lú àpilẹ̀kọ ni Gíríìkì, ó sì ń ṣiṣẹ́ bí orúkọ oyè. “Ẹni Alààyè náà” pa ìtumọ̀ oyè náà mọ́, ó sì jẹ́ èdè Yorùbá tí ó bójú mu.
- source_word: ἐγενόμην νεκρός
  choice: mo sì di òkú
  rationale: “Di” fi ìyípadà sí ipò ikú hàn, gẹ́gẹ́ bí γίνομαι, dípò kí a sọ ipò kan lásán. Àlàyé ìsàlẹ̀ fi ọ̀nà Yorùbá tí ó rọrùn sí i hàn.
- source_word: ἰδοὺ
  choice: sì kíyèsí i
  rationale: Ó pa agbára ọ̀rọ̀ ìpe Gíríìkì mọ́, ní fífi ohun tí ó tẹ̀ lé e hàn ní kedere, láì lo èdè àtijọ́ tí kò rọrùn.
- source_word: ζῶν εἰμι
  choice: mo wà láàyè
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ipò jíjẹ́ alààyè, ó sì dá ìyàtọ̀ rẹ̀ sí “mo di òkú” dúró.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: títí láé àti láéláé
  rationale: Èyí jẹ́ gbólóhùn Yorùbá àdánidá fún àkókò tí kò ní òpin, ó sì pa ìtẹnumọ́ àṣà-ọrọ Gíríìkì mọ́.
- source_word: κλεῖς
  choice: àwọn kọ́kọ́rọ́
  rationale: Ìtumọ̀ tààrà ni; nínú àwòrán ọ̀rọ̀ yìí, àwọn kọ́kọ́rọ́ ń tọ́ka sí àṣẹ àti agbára ìṣàkóso.
- source_word: τοῦ θανάτου
  choice: ikú
  rationale: A túmọ̀ ọ́n tààrà gẹ́gẹ́ bí ohun tí àwọn kọ́kọ́rọ́ náà jẹ́ ti rẹ̀, láì sọ ikú di ẹni kan ní pàtó.
- source_word: τοῦ ᾅδου
  choice: Hédíìsì
  rationale: Ìkọ̀rọ̀ Yorùbá yìí pa ọ̀rọ̀ Gíríìkì náà mọ́, kí a má bàa dín in kù sí ibojì ara tàbí mú un dọ́gba pẹ̀lú ibi ìjìyà ìkẹyìn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ᾅδης nínú ọ̀rọ̀ nípa òpin ayé
  choice: Hédíìsì
  alternative: ibojì; ilẹ̀ àwọn òkú; ọ̀run àpáàdì
  rationale: “Hédíìsì” jẹ́ kí ikú àti ibùgbé àwọn òkú dúró gẹ́gẹ́ bí ohun méjì tí ó ní ìbátan ṣùgbọ́n tí kò jẹ́ ọ̀kan náà. Ó tún yẹra fún fífi ẹ̀kọ́ pé ibi ìjìyà ìkẹyìn gan-an ni ọ̀rọ̀ náà túmọ̀ sí wọ inú ẹsẹ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ. Àwọn àmì ìsàlẹ̀ [a], [b], àti [c] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
