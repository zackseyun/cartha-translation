id: REV.1.3
reference: Revelation 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: yo
  text: Alábùkún ni ẹni tí ń kà á ní ohùn rara[a], àti àwọn tí ń gbọ́ ọ̀rọ̀ àsọtẹ́lẹ̀ yìí, tí wọ́n sì ń pa ohun tí a kọ nínú rẹ̀ mọ́, nítorí àkókò náà ti sún mọ́lé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ń kà á.” Ó ṣeé ṣe kí èdè Gíríìkì náà ń tọ́ka sí ẹni tí ń ka ìwé náà ní gbangba ní àárín ìjọ; ìdí nìyí tí a fi sọ pé “ń kà á ní ohùn rara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àkókò tí a yàn náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Alábùkún-fún
  rationale: Ó jẹ́ ọ̀rọ̀ ìbùkún tí ó wọ́pọ̀ nínú Bíbélì, ó sì fi ojúrere Ọlọ́run hàn ju ayọ̀ inú lásán lọ.
- source_word: ὁ ἀναγινώσκων
  choice: ẹni tí ó ń kà á sókè
  rationale: Ẹni kan tí ń kà àti ọ̀pọ̀ ènìyàn tí ń gbọ́ tọ́ka sí kíkà ní gbangba ní àárín ìjọ; ‘sókè’ mú ìtumọ̀ ẹnu yìí hàn láìfi ohun tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: οἱ ἀκούοντες
  choice: àwọn tí ń gbọ́
  rationale: ‘Gbọ́’ bá àyíká kíkà ní gbangba mu, ó sì tún lè ní agbára ìtumọ̀ gbígba ọ̀rọ̀ náà sí ọkàn.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: ọ̀rọ̀ àsọtẹ́lẹ̀ yìí
  rationale: ‘Ọ̀rọ̀’ pa ìtumọ̀ λόγοι mọ́, ‘yìí’ sì tọ́ka sí àsọtẹ́lẹ̀ inú ìwé tí a ń kà.
- source_word: τηροῦντες
  choice: ń pa ... mọ́
  rationale: Gbólóhùn ‘pa ... mọ́’ ní Yorùbá lè túmọ̀ sí fífi ìṣòtítọ́ tẹ̀ lé ohun tí a kọ, láìdín ìtumọ̀ náà kù sí pípa òfin lásán.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: ohun tí a kọ sínú rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí a ti kọ sínú àsọtẹ́lẹ̀ náà; ó pa ìtọ́kasí αὐτῇ mọ́.
- source_word: ὁ γὰρ καιρὸς
  choice: nítorí àkókò náà
  rationale: ‘Àkókò náà’ jẹ́ gbólóhùn tó ṣe kedere, tó sì fi ààyè sílẹ̀ fún ìtumọ̀ καιρός gẹ́gẹ́ bí àkókò pàtàkì tàbí àkókò tí a yàn.
- source_word: ἐγγύς
  choice: sún mọ́lé
  rationale: Èyí sọ ìsúnmọ́ àkókò náà ní Yorùbá òde òní, láìyan ètò ìmúṣẹ àsọtẹ́lẹ̀ kan pàtó.
theological_decisions:
- issue: Àyíká kíkà ní gbangba tí ẹni kan tí ń kà àti ọ̀pọ̀ ẹni tí ń gbọ́ ń tọ́ka sí
  choice: ẹni tí ó ń kà á sókè
  alternative: ẹni tí ó ń kà á
  rationale: Ìyàtọ̀ láàárín akàwé kan ṣoṣo àti àwọn olùgbọ́ púpọ̀ ṣeé ṣe kí ó tọ́ka sí kíkà ìwé náà ní gbangba nínú ìjọ; ìtumọ̀ yìí mú àyíká náà hàn láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- issue: Agbára ọ̀rọ̀ àsọtẹ́lẹ̀ inú καιρός ἐγγύς
  choice: àkókò náà sún mọ́lé
  alternative: àkókò tí a yàn náà sún mọ́lé
  rationale: Ọ̀rọ̀ náà fi ìsúnmọ́ àkókò hàn, ṣùgbọ́n kò ṣàlàyé ètò tàbí ìtòlẹ́sẹẹsẹ ìmúṣẹ rẹ̀; ìtumọ̀ yìí pa ìṣòro àti àìdánilójú náà mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Alábùkún-fún’ pa ìró ọ̀rọ̀ ìbùkún Bíbélì mọ́; ‘ń pa ... mọ́’ sì jẹ́ ọ̀nà àdánidá láti sọ ìgbọràn oníṣòtítọ́.
