id: REV.1.6
reference: Revelation 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: yo
  text: ó sì sọ wá di ìjọba[a], àwọn àlùfáà fún Ọlọ́run rẹ̀ àti Baba rẹ̀—tirẹ̀ ni ògo àti agbára ìṣàkóso títí láé àti láéláé[b]. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan tó wá lẹ́yìn kà á sí ‘àwọn ọba àti àwọn àlùfáà’ dípò ‘ìjọba, àwọn àlùfáà.’ Ọ̀rọ̀ inú ẹsẹ̀ yìí tẹ̀ lé Gíríìkì tí a pèsè.
    reason: textual_variant
  - marker: b
    text: 'Ní títẹ̀lé ọ̀rọ̀ náà pẹkipẹki: ‘títí dé àwọn ayé àwọn ayé.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: sọ wá di
  rationale: Ọ̀rọ̀ yìí fi hàn pé ó mú kí a di ohun tí a kò jẹ́ tẹ́lẹ̀; ó sì bá aorist inú Gíríìkì mu gẹ́gẹ́ bí ìṣe tí a sọ ní ṣókí.
- source_word: βασιλείαν
  choice: ìjọba
  rationale: Orúkọ ẹyọ ni, kì í ṣe ‘àwọn ọba.’ Ó pa ìdánimọ̀ àwùjọ àwọn ẹni ìràpadà mọ́ gẹ́gẹ́ bí ìjọba.
- source_word: ἱερεῖς
  choice: àwọn àlùfáà
  rationale: Ó túmọ̀ sí àwọn tí ń ṣe iṣẹ́ àlùfáà; fífi ‘àwọn’ kún un mú ọ̀pọ̀ nọ́ńbà inú Gíríìkì hàn kedere ní Yorùbá.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: fún Ọlọ́run rẹ̀ àti Baba rẹ̀
  rationale: ‘Fún’ fi ìbáṣepọ̀ iṣẹ́ wọn sí Ọlọ́run hàn. Àtúnṣe ‘rẹ̀’ lẹ́yìn orúkọ méjèèjì mú un kedere pé ẹni kan náà ni Ọlọ́run rẹ̀ àti Baba rẹ̀, láìrẹ̀wẹ̀sì ọ̀rọ̀ Gíríìkì.
- source_word: αὐτῷ
  choice: tirẹ̀ ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ àsọrí ògo tí kò ní ọ̀rọ̀-ìṣe ní Gíríìkì.
- source_word: δόξα
  choice: ògo
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún àsọrí ìyìn.
- source_word: κράτος
  choice: agbára ìṣàkóso
  rationale: Ó mú èrò agbára aláṣẹ tàbí agbára láti ṣàkóso jáde ju ‘agbára’ lásán lọ.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: títí láé àti láéláé
  rationale: Èyí ni ọ̀nà Yorùbá adayébá láti sọ àkókò tí kò lópin; ìtumọ̀ tó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹkipẹki wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀμήν
  choice: Àmín
  rationale: A pa ọ̀rọ̀ ìjẹ́rìí ìjọsìn tí a ti mọ̀ sílẹ̀ ní ìkọ̀wé Yorùbá.
theological_decisions:
- issue: Ẹni tí ‘Ọlọ́run rẹ̀ àti Baba rẹ̀’ ń tọ́ka sí
  choice: A mú ọ̀rọ̀ náà tọ́ka sí Jésù Kristi, ẹni tí àyíká ẹsẹ̀ 5–6 ń sọ̀rọ̀ nípa rẹ̀.
  alternative: Kí a sọ ọ́ di ‘fún Ọlọ́run Baba rẹ̀,’ èyí tó lè mú ìyàtọ̀ inú gbólóhùn Gíríìkì rẹ̀wẹ̀sì.
  rationale: Àtúmọ̀ náà pa ọ̀rọ̀ ìbáṣepọ̀ àti ìyàtọ̀ ẹni inú orísun mọ́ láìfi ẹ̀kọ́ ìsìn kan kún un.
- issue: Ipò àwùjọ àwọn ẹni ìràpadà
  choice: A pa ‘ìjọba, àwọn àlùfáà’ mọ́.
  alternative: ‘Àwọn ọba àti àwọn àlùfáà.’
  rationale: Ìwé Gíríìkì tí a pèsè ní βασιλείαν, ἱερεῖς, ìyẹn ‘ìjọba, àwọn àlùfáà’; kò ní ‘àwọn ọba.’
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ti ìjọsìn, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. Àmì ìdádúró gígùn pa ìyípadà láti ìṣe Kristi sí àsọrí ògo mọ́.
