id: REV.1.9
reference: Revelation 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: yo
  text: Èmi, Johanu, arákùnrin yín àti alábàápín pẹ̀lú yín nínú ìpọ́njú àti ìjọba àti ìfaradà nínú Jésù, mo wà ní erékùṣù tí a ń pè ní Pátímọ̀ nítorí ọ̀rọ̀ Ọlọ́run àti ẹ̀rí Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “ẹ̀rí nípa Jésù.” Ọ̀nà tí Gíríìkì gbà sọ ọ́ lè túmọ̀ sí ẹ̀rí tí Jésù fún ní tàbí ẹ̀rí nípa Jésù.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: alábàápín pẹ̀lú yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí ó ń bá àwọn ẹlòmíràn pín ohun kan. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé Johanu àti àwọn olùkà rẹ̀ jọ ń kópa nínú àwọn ohun mẹ́ta tí a dárúkọ.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: nínú ìpọ́njú àti ìjọba àti ìfaradà
  rationale: A pa ìsopọ̀ àwọn orúkọ mẹ́tẹ̀ẹ̀ta mọ́, pẹ̀lú ‘àti’ tí a tún sọ gẹ́gẹ́ bí Gíríìkì. ‘Ìpọ́njú’ ní ìwọ̀n tó yẹ fún θλῖψις, ‘ìjọba’ sì bá βασιλεία mu, nígbà tí ‘ìfaradà’ sọ ὑπομονή ní ṣókí láìfikún ìtumọ̀ tí kò sí ní tààrà.
- source_word: ἐν Ἰησοῦ
  choice: nínú Jésù
  rationale: A jẹ́ kí gbólóhùn náà ní ìbáṣepọ̀ pẹ̀lú ìpọ́njú, ìjọba àti ìfaradà, a sì pa ọ̀nà ìsọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó ṣókí náà mọ́ láìṣàlàyé rẹ̀ ju ohun tí orísun sọ lọ.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: wà ní erékùṣù
  rationale: Nínú àyíká yìí γίνομαι lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ jíjẹ́ ní ibi kan. ‘Wà ní’ jẹ́ Yorùbá tó ṣe kedere, kò sì sọ bí Johanu ṣe dé ibẹ̀, èyí tí Gíríìkì kò sọ ní pàtó.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: tí a ń pè ní Patmo
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orúkọ tí a fi ń pe erékùṣù náà.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: nítorí ọ̀rọ̀ Ọlọ́run
  rationale: διά pẹ̀lú accusative ń tọ́ka sí ìdí. ‘Nítorí’ pa ìdí náà mọ́, kò sì pinnu bóyá ìwàásù, ìgbọ́ràn tàbí inúnibíni ló mú Johanu dé ibẹ̀.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: ẹ̀rí Jésù
  rationale: Ìtumọ̀ genitive Ἰησοῦ lè jẹ́ ẹ̀rí tí Jésù fún tàbí ẹ̀rí nípa Jésù. ‘Ẹ̀rí Jésù’ pa àìdájú gidi yìí mọ́ nínú ọ̀rọ̀ àkọ́kọ́, àlàyé ìsàlẹ̀ sì sọ ìtumọ̀ kejì.
- source_word: ἀδελφὸς ὑμῶν
  choice: arákùnrin yín
  rationale: Johanu ń sọ ara rẹ̀ ní ẹyọ gẹ́gẹ́ bí arákùnrin àwọn olùkà rẹ̀. ‘Arákùnrin yín’ jẹ́ tààrà, ó sì yẹ fún ìṣọ̀kan ìdílé tí ọ̀rọ̀ náà ń fi hàn.
theological_decisions:
- issue: Àìdájú genitive nínú μαρτυρίαν Ἰησοῦ
  choice: A túmọ̀ ọ́ ní ṣókí sí ‘ẹ̀rí Jésù’ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: ‘ẹ̀rí nípa Jésù’
  rationale: Gíríìkì lè tọ́ka sí ẹ̀rí tí Jésù fún tàbí ẹ̀rí tí ó jẹ́ nípa Jésù. A kò yanju ìyàtọ̀ ẹ̀kọ́ ìtumọ̀ náà láìní ẹ̀rí; a pa àìdájú rẹ̀ mọ́, a sì fi ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa ìtẹ̀lé ‘ìpọ́njú àti ìjọba àti ìfaradà’ mọ́ láti fi ìṣọ̀kan àti ìtẹnumọ́ Gíríìkì hàn. Àwọn orúkọ ‘Johanu,’ ‘Jésù,’ àti ‘Patmo’ tẹ̀lé ìlò Yorùbá Bíbélì tí ó wọ́pọ̀.
