  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa: ó pa ìṣọ̀kan Johanu pẹ̀lú àwọn olùkà nínú ìpọ́njú, ìjọba, àti ìfaradà mọ́; ó sì fi ‘nínú Jésù’ kún gbogbo mẹ́tẹ̀ẹ̀ta. ‘Ẹ̀rí Jésù’ dá àìdájú genitive náà sílẹ̀ bí ó ti wà nínú orísun.'
