id: REV.1.2
reference: Revelation 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: yo
  text: ẹni tí ó jẹ́rìí sí ọ̀rọ̀ Ọlọ́run àti sí ẹ̀rí Jésù Mèsáyà[a], gbogbo ohun tí ó rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀rí láti ọ̀dọ̀ Jésù Mèsáyà” tàbí “ẹ̀rí nípa Jésù Mèsáyà.” Ọ̀rọ̀ Gíríìkì náà lè ní èyíkéyìí nínú ìtumọ̀ méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: jẹ́rìí sí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan fi ẹ̀rí mú ohun kan dájú; ó sì pa ìtumọ̀ iṣẹ́ ẹlẹ́rìí inú Gíríìkì mọ́.
- source_word: λόγον
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀ Ọlọ́run” jẹ́ gbólóhùn Yorùbá tí ó dúró ṣinṣin, ó sì bá ìtumọ̀ ọ̀rọ̀ tí Ọlọ́run fi hàn mu ju “ìránṣẹ́” lọ níhìn-ín.
- source_word: μαρτυρίαν
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún testimony/witness, ó sì ní ìbátan àdánidá pẹ̀lú ọ̀rọ̀-ìṣe “jẹ́rìí.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός níhìn-ín ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ dípò kí a sọ ọ́ di apá kan orúkọ lásán.
- source_word: ὅσα εἶδεν
  choice: gbogbo ohun tí ó rí
  rationale: “Gbogbo ohun” fi ìtẹnumọ́ ὅσα hàn, ó sì jẹ́ Yorùbá tó ṣe kedere àti àdánidá.
- source_word: τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: ọ̀rọ̀ Ọlọ́run àti sí ẹ̀rí Jésù Mèsáyà
  rationale: A pa àwọn ohun méjèèjì tí ọ̀rọ̀-ìṣe náà ń tọ́ka sí mọ́ gẹ́gẹ́ bí ohun méjì tí a so pọ̀; àtúnṣe “sí” ṣáájú “ẹ̀rí” mú kí Yorùbá náà ṣàn dáadáa.
theological_decisions:
- issue: Àìdájú ìbáṣepọ̀ inú μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: ẹ̀rí Jésù Mèsáyà
  alternative: ẹ̀rí tí Jésù Mèsáyà fúnni / ẹ̀rí nípa Jésù Mèsáyà
  rationale: Ìhun Gíríìkì lè túmọ̀ sí ẹ̀rí láti ọ̀dọ̀ Jésù tàbí ẹ̀rí nípa Jésù. Ìtumọ̀ pàtàkì kò yan ọ̀kan nínú wọn; àlàyé ìsàlẹ̀ ni ó ṣàfihàn méjèèjì.
- issue: Ìtumọ̀ Χριστοῦ gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí, Χριστός ṣì ní agbára oyè ẹni àmì-òróró tí a ṣèlérí; “Mèsáyà” mú ìtumọ̀ oyè náà jáde ní kedere.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ẹni tí” nítorí ẹsẹ yìí ń bá ìhun gbólóhùn ẹsẹ 1 lọ, a sì lo àmì gígùn láti fi “gbogbo ohun tí ó rí” hàn gẹ́gẹ́ bí àkótán ohun tí ó jẹ́rìí sí.
