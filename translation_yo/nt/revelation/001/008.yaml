  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: yo
  text: “Èmi ni Álfà àti Òmégà,” ni Olúwa Ọlọ́run wí, “ẹni tí ó wà, tí ó ti wà, tí ó sì ń bọ̀, ẹni tí ó ní agbára gbogbo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó wà, tí ó ti wà, tí yóò sì bọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Èmi ni
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ tí a tẹnu mọ́ pẹ̀lú ọ̀rọ̀ ìsopọ̀ ni a túmọ̀ sí “Èmi ni,” èyí tó jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún ìkéde ẹni ní Yorùbá.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Álfà àti Òmégà
  rationale: A pa orúkọ lẹ́tà Gíríìkì méjèèjì mọ́, dípò lílo lẹ́tà Yorùbá, kí àmì ìṣàpẹẹrẹ inú ọ̀rọ̀ náà má bàjẹ́.
- source_word: λέγει
  choice: ni ... wí
  rationale: Èyí fi àkókò ìsinsìnyí àti ọ̀nà ìkéde tó níyì hàn lọ́nà àdánidá ní Yorùbá.
- source_word: κύριος, ὁ θεός
  choice: Olúwa Ọlọ́run
  rationale: Àwọn orúkọ oyè méjèèjì dúró lẹ́gbẹ̀ẹ́ ara wọn nínú Gíríìkì; “Olúwa Ọlọ́run” jẹ́ ìtumọ̀ tó ṣe tààrà, tó sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá mu.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: ẹni tí ó wà, tí ó sì ti wà, tí ó sì ń bọ̀
  rationale: A pa ìlànà mẹ́ta náà mọ́. “Ń bọ̀” tú participle ìsinsìnyí ἐρχόμενος ní tààrà, ó sì pa ìmọ̀ pé ìbọ̀ náà ń lọ síwájú mọ́.
- source_word: ὁ παντοκράτωρ
  choice: Olódùmarè
  rationale: “Olódùmarè” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó níyì, fún Ọlọ́run aláṣẹ gbogbo; ó yẹ fún παντοκράτωρ láì lo gbólóhùn tó le koko tàbí tó dà bí àlàyé.
theological_decisions:
- issue: Ìtumọ̀ àpèjúwe Ọlọ́run nípa wíwà rẹ̀ àti ìbọ̀ rẹ̀ lọ́jọ́ iwájú
  choice: tí ó sì ń bọ̀
  alternative: tí yóò sì dé
  rationale: ἐρχόμενος jẹ́ participle ìsinsìnyí, nítorí náà “ń bọ̀” pa ìṣe tó ń lọ síwájú àti ìretí ìfarahàn ọjọ́ iwájú mọ́. “Tí yóò sì dé” jẹ́ ìtumọ̀ tó ṣeé ṣe, ṣùgbọ́n ó tú ọ̀rọ̀ náà sí ọjọ́ iwájú ní kedere ju Gíríìkì lọ.
translation_notes:
  register: Yorùbá àgbáyé òde òní tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A pa ìlànà ọ̀rọ̀ ìkéde àti ìtẹnumọ́ Gíríìkì mọ́, ṣùgbọ́n a ṣètò gbólóhùn náà ní ọ̀nà tó ṣàn dáadáa ní Yorùbá.
