id: REV.1.14
reference: Revelation 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: yo
  text: Orí rẹ̀ àti irun orí rẹ̀ jẹ́ funfun[a], bí irun àgùntàn funfun, bí yìnyín; ojú rẹ̀ sì dà bí ọ̀wọ́ iná[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ìṣètò ọ̀rọ̀ náà pé, “Orí rẹ̀ àti irun orí rẹ̀ funfun bí irun àgùntàn funfun, bí yìnyín.”
    reason: lexical_alternative
  - marker: b
    text: Àwòrán yìí mú Dáníẹ́lì 7:9 wá sí ìrántí, ó sì tẹnu mọ́ pé ohun tí a ń ṣàpèjúwe yìí jẹ́ ohun tí a rí nínú ìran.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Àsopọ̀ pẹ̀lẹ́ ni δὲ níbí; “sì” ń tẹ̀síwájú nínú àpèjúwe náà láì fi ìtumọ̀ àkókò kún un.
- source_word: κεφαλὴ
  choice: orí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ẹ̀yà ara tí a ń pè ní head.
- source_word: τρίχες
  choice: irun orí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀pọ̀ nínú Gíríìkì, ṣùgbọ́n “irun orí” jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ọ́ lápapọ̀.
- source_word: λευκαὶ
  choice: funfun
  rationale: Ó pa àwọ̀ funfun tí ọ̀rọ̀ Gíríìkì sọ mọ́, láì fi ìtumọ̀ mìíràn bí ìmọ́lẹ̀ tàbí mímọ́ kún un.
- source_word: ὡς ἔριον λευκόν
  choice: bí irun àgùntàn funfun
  rationale: Ó mú àfiwé náà àti àtúnwí àwọ̀ funfun jáde ní kedere, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: ὡς χιών
  choice: bí yìnyín
  rationale: Ó pa àfiwé kejì mọ́ ní ṣókí gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: ὀφθαλμοὶ
  choice: ojú
  rationale: Yorùbá sábà máa ń lo “ojú” gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ fún eyes, èyí sì jẹ́ ọ̀nà àdánidá jù lọ níbí.
- source_word: ὡς φλὸξ πυρός
  choice: bí ọ̀wọ́ iná
  rationale: “Ọ̀wọ́ iná” ń tọ́ka sí flame, ó sì pa àwòrán àpẹẹrẹ Gíríìkì mọ́ láì túmọ̀ àmì náà sí ẹ̀kọ́ kan.
theological_decisions:
- issue: Àpèjúwe aláàmì nípa Ọmọ Ènìyàn tí a gbé ga
  choice: A pa àwọn àfiwé náà mọ́ ní tààràtà láì ṣàlàyé ohun tí wọ́n dúró fún nínú ẹsẹ̀ náà.
  alternative: Kí a fi ọ̀rọ̀ kún un pé àwòrán náà ń tọ́ka sí ìwà mímọ́, àìnípẹ̀kun, tàbí ìdájọ́.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ gbé àwòrán ìran kalẹ̀, kò sì ṣàlàyé ẹ̀kọ́ tí àwòrán kọ̀ọ̀kan dúró fún; nítorí náà, ìtumọ̀ kò gbọ́dọ̀ yanju ohun tí ẹsẹ̀ náà fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àtẹ̀jáde náà pa ìlò àwòrán ìran mọ́, ó sì yàgò fún àlàyé ẹ̀kọ́ ìsìn tí ọ̀rọ̀ Gíríìkì kò sọ ní tààràtà.
