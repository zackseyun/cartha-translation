id: REV.1.16
reference: Revelation 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: yo
  text: Ó sì ní ìràwọ̀ méje ní ọwọ́ ọ̀tún rẹ̀, idà mímú olójú méjì[a] sì ń jáde láti ẹnu rẹ̀, ìrísí rẹ̀ sì dàbí oòrùn tí ń ràn ní agbára rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “idà mímú tí ó ní ojú ní ẹ̀gbẹ́ méjèèjì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ń ràn ní gbogbo agbára rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: ó sì ní
  rationale: A lo gbólóhùn-ìṣe tí ó pé láti mú àpèjúwe ìran náà dun bí Yorùbá àdánidá, nígbà tí ó ṣì ń fi ipò tí ó ń bá a lọ hàn.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: ní ọwọ́ ọ̀tún rẹ̀
  rationale: χείρ wà ní kedere nínú Gíríìkì, nítorí náà a pa ‘ọwọ́’ mọ́; ‘ọwọ́ ọ̀tún rẹ̀’ sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: ἀστέρας ἑπτά
  choice: ìràwọ̀ méje
  rationale: Ìtumọ̀ tààrà tí ó tẹ̀ lé ìṣètò ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ῥομφαία
  choice: idà
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí idà ńlá, ṣùgbọ́n ‘idà’ ṣe kedere, ó sì yẹ fún àwòrán inú Ìfihàn láì fi ìwọ̀n ohun ìjà náà kún ọ̀rọ̀ orísun.
- source_word: δίστομος
  choice: olójú méjì
  rationale: Ìtumọ̀ gangan rẹ̀ sun mọ́ ‘ẹnu méjì,’ ṣùgbọ́n nípa idà, ‘olójú méjì’ ni ọ̀nà Yorùbá tí ó bójú mu fún idà tí ó ní ojú ní ẹ̀gbẹ́ méjèèjì.
- source_word: ὀξεῖα
  choice: tí ó mú
  rationale: Ó pa àpèjúwe pé idà náà mú mọ́, yàtọ̀ sí pé ó ní ojú méjì.
- source_word: ἐκπορευομένη
  choice: ń jáde láti
  rationale: Ó fi hàn pé idà náà ń jáde láti ẹnu rẹ̀, ó sì pa agbára ìṣe tí ó ń lọ lọ́wọ́ inú participle Gíríìkì mọ́.
- source_word: ἡ ὄψις αὐτοῦ
  choice: ìrísí rẹ̀
  rationale: ὄψις lè túmọ̀ sí gbogbo bí ẹni náà ṣe farahàn, kì í ṣe ojú nìkan; ‘ìrísí’ kò dín àwòrán náà kù sí ojú.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: dàbí oòrùn tí ń ràn
  rationale: Ó jẹ́ àfiwé Yorùbá àdánidá, ó sì pa ìmọ́lẹ̀ tí ó ń bá a lọ mọ́.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: ní agbára rẹ̀
  rationale: Ó dúró sún mọ́ Gíríìkì, ó sì jẹ́ kí àṣàyàn ‘ní gbogbo agbára rẹ̀’ wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ tí ó túmọ̀ kún un díẹ̀.
theological_decisions:
- issue: Ìtumọ̀ àwòrán idà tí ń jáde láti ẹnu
  choice: Pa àwòrán ìran náà mọ́ láì ṣàlàyé ohun tí idà náà dúró fún nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàlàyé idà náà ní tààrà gẹ́gẹ́ bí ọ̀rọ̀ Kristi tí ń ṣe ìdájọ́.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ gbé àwòrán àmì inú ìran kalẹ̀. Bí ó tilẹ̀ jẹ́ pé àwọn ibòmíràn nínú Ìwé Mímọ́ lè so idà mọ́ ọ̀rọ̀ Ọlọ́run tàbí ìdájọ́, ìtumọ̀ kò gbọ́dọ̀ fi ìṣàlàyé yẹn kún ọ̀rọ̀ níbí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ìrísí’ dípò ‘ojú’ kí a má bàa dín ìtumọ̀ ὄψις kù. Àwọn àmì àlàyé ìsàlẹ̀ ni a gbé síbi ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
