  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì mọ́: ìràwọ̀ méje wà ní ọwọ́ ọ̀tún rẹ̀, idà olójú-méjì ń jáde láti ẹnu rẹ̀, ìrísí rẹ̀ sì dàbí oòrùn. Síbẹ̀, ìpínrọ̀ ‘idà olójú méjì tí ó mú sì ń jáde’ lè túmọ̀ sí pé ẹni náà mú idà náà ní ọwọ́, dípò pé idà náà ‘mú’ (gẹ́gẹ́ bí ìtumọ̀ ὀξεῖα, ‘mímú/sharp’).'
