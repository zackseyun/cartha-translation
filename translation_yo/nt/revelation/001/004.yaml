id: REV.1.4
reference: Revelation 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: yo
  text: 'Jòhánù, sí àwọn ìjọ méje tí ó wà ní Éṣíà: Kí oore-ọ̀fẹ́ àti àlàáfíà ó wà fún yín láti ọ̀dọ̀ Ẹni tí ó wà, ẹni tí ó ti wà, ẹni tí ó sì ń bọ̀,[a] àti láti ọ̀dọ̀ àwọn ẹ̀mí méje tí ó wà níwájú ìtẹ́ rẹ̀.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí a ti máa ń sọ ọ́ látijọ́, “láti ọ̀dọ̀ Ẹni tí ó wà, ẹni tí ó ti wà, ẹni tí ó máa bọ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ẹ̀mí méje” lè jẹ́ àpẹẹrẹ ẹ̀kúnrẹ́rẹ́ Ẹ̀mí Mímọ́, tàbí kí ó tọ́ka sí àwọn ẹ̀mí ọ̀run méje; ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ “àwọn ẹ̀mí méje.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Jòhánù
  rationale: Àkọsílẹ̀ orúkọ John tí ó ti fìdí múlẹ̀ nínú Yorùbá.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: sí àwọn ìjọ méje
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ἐκκλησία ní àyíká lẹ́tà Kristẹni yìí.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: tí ó wà ní Éṣíà
  rationale: Ó pa orúkọ ilẹ̀ inú Gíríìkì mọ́; níbí, Éṣíà túmọ̀ sí ẹkùn ìjọba Róòmù, kì í ṣe gbogbo kọ́ńtínẹ́ǹtì Éṣíà òde òní.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Kí oore-ọ̀fẹ́ àti àlàáfíà ó wà fún yín
  rationale: Ọ̀nà àdúrà-ìkíni adayeba ní Yorùbá tí ó sọ χάρις àti εἰρήνη ní kedere.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: láti ọ̀dọ̀ ẹni tí ó ń bẹ, ẹni tí ó ti wà, tí ó sì ń bọ̀
  rationale: Ó pa ìrísí oyè Ọlọ́run àti agbára ọ̀rọ̀ àkókò ìsinsìnyí nínú ὁ ἐρχόμενος mọ́, láì tún àìṣe-déédé gírámà Gíríìkì ṣe lọ́nà tí kò ní yé ẹni Yorùbá.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: àwọn ẹ̀mí méje
  rationale: Ó tẹ̀ lé ọ̀pọ̀ nínú Gíríìkì, dípò yíyàn ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: tí ó wà níwájú ìtẹ́ rẹ̀
  rationale: Gbólóhùn Yorùbá adayeba tí ó pa ipò wọn níwájú ìtẹ́ náà mọ́ láì pinnu irú ẹ̀dá wọn.
theological_decisions:
- issue: Ta ni “ẹni tí ó ń bẹ, ẹni tí ó ti wà, tí ó sì ń bọ̀”
  choice: A fi í hàn gẹ́gẹ́ bí oyè Ọlọ́run, pẹ̀lú “tí ó sì ń bọ̀” fún ọ̀rọ̀ ìṣe tí ń lọ lọ́wọ́.
  alternative: “ẹni tí ó ń bẹ, tí ó sì ti wà, tí yóò sì dé”
  rationale: Ẹ̀dà pàtàkì pa ìtumọ̀ ẹni àti ìwàláàyè oyè náà mọ́; àlàyé ìsàlẹ̀ fi ẹ̀dà ìbílẹ̀ hàn láì yanju ìfararora náà ní ìkọ̀kọ̀.
- issue: Ìdánimọ̀ “àwọn ẹ̀mí méje”
  choice: A pa ọ̀pọ̀ gangan náà mọ́ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Àpẹẹrẹ ẹ̀kúnrẹ́rẹ́ Ẹ̀mí Mímọ́; tàbí àwọn ẹ̀mí ọ̀run méje.
  rationale: Gíríìkì sọ “ẹ̀mí méje,” ṣùgbọ́n ìdánimọ̀ wọn ṣì jẹ́ ohun tí a ń jíròrò; ìtumọ̀ kò gbọ́dọ̀ fi ipá yan ọ̀kan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti adayeba, pẹ̀lú àmì ohùn ní kíkún. A lo “ìjọ,” “oore-ọ̀fẹ́,” “àlàáfíà,” àti “ìtẹ́” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí àwọn oníkàwé Yorùbá mọ̀, láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
