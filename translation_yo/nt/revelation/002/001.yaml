id: REV.2.1
reference: Revelation 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: yo
  text: 'Kọ̀wé sí áńgẹ́lì[a] ìjọ tí ó wà ní Éfésù pé: “Èyí ni ohun tí ẹni tí ó di ìràwọ̀ méje mú ní ọwọ́ ọ̀tún rẹ̀, tí ó ń rìn láàárín ọ̀pá fìtílà wúrà méje, wí:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òjíṣẹ́” ìjọ tí ó wà ní Éfésù.
    reason: Ọ̀rọ̀ Gíríìkì ἄγγελος lè túmọ̀ sí áńgẹ́lì tàbí òjíṣẹ́; ẹni tí ó ń tọ́ka sí níhìn-ín ṣì jẹ́ ọ̀ràn àríyànjiyàn.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: áńgẹ́lì
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí áńgẹ́lì ọ̀run tàbí òjíṣẹ́ ènìyàn. “Áńgẹ́lì” bá àyíká ìran ìṣípayá inú ìwé náà mu, ṣùgbọ́n a pa ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἐκκλησίας
  choice: ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tí ó ṣe déédé fún àwùjọ àwọn onígbàgbọ́ ní àyíká yìí.
- source_word: γράψον
  choice: kọ̀wé
  rationale: Ó fi àṣẹ pàtó tí ọ̀rọ̀ ìṣe Gíríìkì náà ń fún Jòhánù hàn ní kedere.
- source_word: Τάδε λέγει
  choice: Ohun wọ̀nyí ni ... wí
  rationale: Ìtumọ̀ yìí pa ìró ọ̀rọ̀ àsọtẹ́lẹ̀ oníyì àti ìtọ́ka sí ohun tí ó tẹ̀ lé mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κρατῶν
  choice: di ... mú
  rationale: Àkópọ̀ ọ̀rọ̀ yìí fi dídìmú àti àkóso tí κρατέω ní hàn láìfi ìtumọ̀ tí kò sí nínú orísun kún un.
- source_word: δεξιᾷ
  choice: ọwọ́ ọ̀tún
  rationale: Ó pa àwòrán gidi àti ìtumọ̀ àmì nípa ọlá-àṣẹ mọ́.
- source_word: περιπατῶν ἐν μέσῳ
  choice: ń rìn láàárín
  rationale: Ó fi ìṣípò láàárín àwọn ọ̀pá fìtílà hàn ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: λυχνιῶν
  choice: ọ̀pá fìtílà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí a gbé fìtílà lé, kì í ṣe fìtílà fúnra rẹ̀; yíyan yìí tún bá àwòrán inú Ìṣípayá 1 mu.
- source_word: χρυσῶν
  choice: wúrà
  rationale: Ó sọ ohun tí a fi ṣe àwọn ọ̀pá fìtílà náà ní ṣókí àti ní Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí “áńgẹ́lì ìjọ” ń tọ́ka sí
  choice: Lo “áńgẹ́lì” nínú ọ̀rọ̀ pàtàkì
  alternative: òjíṣẹ́
  rationale: Ἄγγελος lè jẹ́ áńgẹ́lì ọ̀run tàbí òjíṣẹ́ ènìyàn. Àyíká ìṣípayá àti àwòrán àwọn ẹ̀dá ọ̀run ti ìwé náà ṣe ìtìlẹ́yìn fún “áńgẹ́lì,” ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú tòótọ́ inú ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, oníyì, tí ó ṣe kedere fún òǹkàwé gbogbogbò. A pa ìlànà àsọtẹ́lẹ̀ “Ohun wọ̀nyí ni ... wí” àti àwọn àwòrán ìràwọ̀, ọwọ́ ọ̀tún, àti ọ̀pá fìtílà mọ́.
