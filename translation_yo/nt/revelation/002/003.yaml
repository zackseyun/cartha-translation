  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: yo
  text: O sì ní ìfaradà, o sì ti fara da nítorí orúkọ mi[a], o kò sì ti rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nítorí ti orúkọ mi” tàbí “nítorí orúkọ mi gan-an.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “o kò sì rẹ̀wẹ̀sì.” A tún lè lóye gbólóhùn náà ní ìbáṣepọ̀ pẹ̀lú iṣẹ́ àṣekára pé, “o kò ti rẹ̀ nínú iṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: ìfaradà
  rationale: “Ìfaradà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún dídúró ṣinṣin lábẹ́ ìdánwò tàbí ìnira; kò fi kún un pé ó jẹ́ sùúrù lásán tàbí ìsapá alágbára nìkan.
- source_word: ἔχεις
  choice: o sì ní
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ní tààràtà, ó sì pa ìyìn tí a ń sọ fún ẹni tí a ń bá sọ mọ́.
- source_word: ἐβάστασας
  choice: o sì ti fara da ìnira
  rationale: βαστάζω lè túmọ̀ sí rírù, gbígbé, tàbí fífarada. Nínú àyíká yìí, “fara da ìnira” jẹ́ Yorùbá àdánidá fún fífarada ohun tó nira, láì sọ irú ìnira pàtó tí ẹsẹ náà kò sọ.
- source_word: διὰ τὸ ὄνομά μου
  choice: nítorí orúkọ mi
  rationale: διά pẹ̀lú accusative lè tọ́ka sí ìdí tàbí ohun tí a ṣe nítorí rẹ̀. “Nítorí orúkọ mi” jẹ́ kedere, ó sì pa àṣà ọ̀rọ̀ Bíbélì mọ́ nípa fífarada nítorí ìfaramọ́ sí orúkọ Jésù.
- source_word: οὐ κεκοπίακες
  choice: o kò sì rẹ̀wẹ̀sì
  rationale: “Rẹ̀wẹ̀sì” sọ pé agbára ẹni kò tán, ẹni náà kò sì jáwọ́ lábẹ́ ìnira. Ó bá perfect Greek mu nípa ipò tí ó ti ń bá a lọ, láì dín κοπιάω kù sí iṣẹ́ ṣíṣe nìkan.
theological_decisions:
- issue: Ìtumọ̀ èdè ìfaradà àti ìnira nínú ìyìn yìí
  choice: Ẹsẹ náà yin ìfaradà tí ó ń bá a lọ àti fífarada ìnira nítorí orúkọ Jésù, láì sọ irú inúnibíni tàbí iṣẹ́ pàtó kan.
  alternative: A lè lóye gbólóhùn ìkẹyìn ní ìbáṣepọ̀ pẹ̀lú iṣẹ́ àṣekára, bíi pé “ìwọ kò rẹ̀ nínú iṣẹ́.”
  rationale: Ìtumọ̀ yìí pa ìyìn inú ọ̀rọ̀ Greek mọ́, kò sì fi ẹ̀kọ́ pàtó kan nípa inúnibíni, iṣẹ́ ìránṣẹ́, tàbí èrè kún ohun tí ẹsẹ náà sọ. Bí àwọn gbólóhùn náà ṣe tẹ̀ lé ara wọn ń ṣètìlẹ́yìn fún ìfaradà lábẹ́ ìnira.
translation_notes:
  register: Yorùbá boṣewa, èdè ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “ìfaradà,” “fara da ìnira,” àti “rẹ̀wẹ̀sì” kí ẹsẹ náà lè yé òǹkàwé lónìí, nígbà tí a ṣì pa ìyàtọ̀ láàárín ὑπομονή, βαστάζω, àti κοπιάω mọ́. Àwọn àmì àlàyé [a] àti [b] ni a gbe sí àwọn gbólóhùn tí wọ́n ń ṣàlàyé, dípò títẹ̀ lé ìṣípò àmì tí ó hàn nínú consultation layer.
