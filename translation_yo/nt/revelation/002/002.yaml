id: REV.2.2
reference: Revelation 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: yo
  text: Mo mọ̀ iṣẹ́ rẹ, làálàá rẹ, àti ìfaradà rẹ, àti pé o kò lè fara da àwọn ènìyàn búburú. O dán àwọn tí wọ́n pe ara wọn ní aposteli[a], tí wọn kò sì jẹ́ bẹ́ẹ̀, wò; o sì rí i pé èké ni wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí wọ́n ń sọ pé àwọn jẹ́ aposteli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Mo mọ
  rationale: Ó fi ìmọ̀ àti àyẹ̀wò ẹni tó ń sọ̀rọ̀ hàn ní ọ̀nà tààrà, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: τὰ ἔργα σου
  choice: iṣẹ́ rẹ
  rationale: “Iṣẹ́” ní ìtumọ̀ gbígbòòrò ti ohun tí ẹni ń ṣe, ó sì bá lílo ọ̀rọ̀ náà mu.
- source_word: τὸν κόπον
  choice: làálàá rẹ
  rationale: “Làálàá” sọ ìsapá líle àti iṣẹ́ tí ń rẹni jáde, èyí tó bá κόπος mu.
- source_word: τὴν ὑπομονήν σου
  choice: ìfaradà rẹ
  rationale: Ó ṣàfihàn dídúró ṣinṣin lábẹ́ ìnira tàbí ìkọlù.
- source_word: οὐ δύνῃ βαστάσαι κακούς
  choice: o kò lè gba àwọn ènìyàn búburú láàyè láàárín rẹ
  rationale: Ní àyíká yìí βαστάσαι túmọ̀ sí kíkọ̀ láti fàyè gba tàbí fara mọ́ àwọn ènìyàn búburú; àfikún “láàárín rẹ” mú èrò yẹn ṣe kedere ní Yorùbá láìyí kókó ọ̀rọ̀ padà.
- source_word: ἐπείρασας
  choice: O dán ... wò
  rationale: Àṣàyàn Yorùbá àdánidá fún ṣíṣe àyẹ̀wò òtítọ́ ẹ̀sùn tàbí ìjẹ́wọ́ ẹnì kan.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: àwọn tí wọ́n pe ara wọn ní aposteli
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò-orúkọ ἑαυτούς mọ́, ó sì fi hàn pé ipò tí wọ́n ń sọ jẹ́ ti ara wọn.
- source_word: ἀποστόλους
  choice: aposteli
  rationale: Ní àyíká ìjọ yìí, ọ̀rọ̀ náà ṣeé ṣe kó jẹ́ oyè fún àwọn aṣojú aláṣẹ, kì í ṣe “òjíṣẹ́” lásán.
- source_word: ψευδεῖς
  choice: èké ni wọ́n
  rationale: Ó pa ìtumọ̀ ajẹtífù náà mọ́ pé àwọn olùjẹ́wọ́ náà jẹ́ èké, láìsọ ọ́ di ẹ̀sùn tó le ju ọ̀rọ̀ orísun lọ.
theological_decisions:
- issue: Ìtumọ̀ ipò àwọn tó pe ara wọn ní ἀποστόλους
  choice: aposteli
  alternative: òjíṣẹ́
  rationale: Àyíká náà dá lórí fífi ẹ̀sùn ipò aposteli wọn dán wò nínú ìjọ. “Aposteli” pa agbára oyè náà mọ́ láìfi ètò ẹ̀sìn ìgbà tó tẹ̀ lé e kún un.
- issue: Bí a ṣe túmọ̀ κακούς tó jẹ́ akọ ní gírámà
  choice: àwọn ènìyàn búburú
  alternative: àwọn ọkùnrin búburú
  rationale: Fọ́ọ̀mù Gíríìkì náà jẹ́ akọ ọ̀pọ̀ ṣùgbọ́n ó dúró fún àwọn ènìyàn ní gbogbogbòò; “àwọn ènìyàn búburú” kò fi akọ tí àyíká kò béèrè kún un.
- issue: Agbára ψευδεῖς
  choice: èké ni wọ́n
  alternative: òpùrọ́ ni wọ́n
  rationale: “Èké ni wọ́n” pa àìdánilójú díẹ̀ mọ́ bóyá ọ̀rọ̀ náà ń sọ pé ìjẹ́wọ́ wọn kò tọ́ tàbí pé àwọn fúnra wọn jẹ́ olùpurọ́; “òpùrọ́” lè mú ẹ̀sùn náà lágbára ju fọ́ọ̀mù ajẹtífù orísun lọ.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “làálàá” fún iṣẹ́ líle, “ìfaradà” fún dídúró ṣinṣin, àti “aposteli” gẹ́gẹ́ bí oyè ìjọ. Àmì ẹsẹ̀ [a] wà lẹ́yìn ọ̀rọ̀ tó ń ṣàlàyé.
