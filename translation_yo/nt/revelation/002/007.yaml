id: REV.2.7
reference: Revelation 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: yo
  text: Ẹni tí ó bá ní etí, kí ó gbọ́ ohun tí Ẹ̀mí ń sọ fún àwọn ìjọ. Ẹni tí ó bá ṣẹ́gun[a], èmi yóò fún un ní láti jẹ nínú igi ìyè tí ó wà nínú Párádísè Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “borí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ẹni tí ó bá ní etí
  rationale: Ọ̀rọ̀ yìí pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi pè ẹnikẹ́ni tí ìkìlọ̀ náà kan.
- source_word: ἀκουσάτω
  choice: kí ó gbọ́
  rationale: Àṣẹ ẹni kẹta ni; ‘kí ó gbọ́’ fi agbára ìṣílétí náà hàn ní Yorùbá, ó sì lè túmọ̀ sí gbígbọ́ pẹ̀lú fífi ọkàn sí i.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Nínú ọ̀rọ̀ àsọtúnsọ sí àwọn ìjọ ní Ìfihàn 2–3, Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; lílo lẹ́tà ńlá fi ìtọ́kasí yìí hàn láìfi ọ̀rọ̀ míì kún un.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: ń sọ fún àwọn ìjọ
  rationale: Àmì ‘ń’ mú ìṣe àsìkò ìsinsìnyí inú Gíríìkì jáde lọ́nà àdánidá, ‘àwọn ìjọ’ sì bá ọ̀rọ̀ náà mu nínú Ìfihàn 2–3.
- source_word: τῷ νικῶντι
  choice: Ẹni tí ó bá ṣẹ́gun
  rationale: ‘Ṣẹ́gun’ pa àwòrán ìjà àti ìṣẹ́gun inú νικάω mọ́; ìṣètò ‘tí ó bá’ bá ìlérí sí ẹni tí ó ṣẹ́gun mu ní Yorùbá.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: èmi yóò fún un láṣẹ láti jẹ
  rationale: Gíríìkì sọ ní ti gidi pé ‘èmi yóò fún un láti jẹ’; fífi ‘láṣẹ’ kún un mú ìtumọ̀ fífúnni ní àǹfààní tàbí ìyọ̀nda náà ṣe kedere ní Yorùbá láìyí ìlérí náà padà.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: nínú igi ìyè
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘jẹ,’ Yorùbá máa ń sọ pé a jẹ ‘nínú’ igi kan, ìyẹn ni lára èso rẹ̀; ‘igi ìyè’ pa ìtọ́kasí sí Gẹ́nẹ́sísì àti Ìfihàn mọ́.
- source_word: παραδείσῳ
  choice: Párádísè
  rationale: Àyálò-ọ̀rọ̀ yìí pa ìwọ̀n ẹ̀kọ́ àti ìtọ́kasí ọ̀rọ̀ náà mọ́ ju ‘ọgbà’ lasan lọ.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsopọ̀ ‘Párádísè Ọlọ́run’ jẹ́ ọ̀nà Yorùbá tó ṣókí, tó sì ṣe àfihàn genitive Gíríìkì ní ti jíjẹ́ ti Ọlọ́run tàbí ní ìbáṣepọ̀ pẹ̀lú rẹ̀.
theological_decisions:
- issue: Ẹni tí τὸ πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́, tí a kọ sí ‘Ẹ̀mí’
  alternative: ẹ̀mí kan lápapọ̀
  rationale: Àsọtúnsọ náà nínú Ìfihàn 2–3 jẹ́ ọ̀rọ̀ àṣẹ Ọlọ́run sí àwọn ìjọ; lẹ́tà ńlá nìkan ni a lò láti fi ìtọ́kasí náà hàn, a kò sì fi àlàyé ẹ̀kọ́ míì kún ẹsẹ náà.
- issue: Ìtumọ̀ νικάω nínú ìlérí
  choice: ṣẹ́gun
  alternative: borí
  rationale: ‘Ṣẹ́gun’ mú àwòrán ìṣẹ́gun nínú ìjà jáde ní kedere; ‘borí’ tún ṣeé ṣe, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀ nítorí ìyàtọ̀ náà jẹ́ ti ọ̀rọ̀, kì í ṣe ti ẹ̀kọ́.
- issue: Ẹyọ aṣojú nínú ìṣílétí
  choice: Ẹni ... kí ó gbọ́
  alternative: Gbogbo ẹni ... kí wọ́n gbọ́
  rationale: A pa ẹyọ tí Gíríìkì lò mọ́, ṣùgbọ́n ‘ẹni’ ní Yorùbá jẹ́ aláìṣe àfihàn akọ tàbí abo, ó sì ní agbára aṣojú gbogbo ẹni tí ọ̀rọ̀ náà kan.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ìlànà ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ìjọ’ fún ἐκκλησία àti ‘Párádísè’ láti pa ìmọ̀lára àti ìtọ́kasí ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
