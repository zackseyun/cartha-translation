id: REV.2.8
reference: Revelation 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: yo
  text: '“Kọ̀wé sí áńgẹ́lì[a] ìjọ ní Símírínà pé: Èyí ni ohun tí Ẹni Àkọ́kọ́ àti Ẹni Ìkẹyìn, ẹni tí ó kú tí ó sì tún wà láàyè[b], wí:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òjíṣẹ́ ìjọ ní Símírínà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ẹni tí ó ti kú, tí ó sì padà wá sí ìyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: áńgẹ́lì
  rationale: Àyíká ìran àsọtẹ́lẹ̀ inú Ìfihàn ti mú kí ‘áńgẹ́lì’ jẹ́ ìtumọ̀ àkọ́kọ́; síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘òjíṣẹ́,’ a sì fi èyí sínú àlàyé ìsàlẹ̀.
- source_word: ἐκκλησίας
  choice: ìjọ
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwùjọ àwọn onígbàgbọ́ ní Símírínà; ‘ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ ẹ̀sìn àti ti àwùjọ mu.
- source_word: Τάδε λέγει
  choice: Ohun tí ... wí nìyí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní iyì fún gbólóhùn ìkéde àsọtẹ́lẹ̀ náà, nígbà tó ń pa ìtumọ̀ ‘Nǹkan wọ̀nyí ni ... wí’ mọ́.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Ẹni Àkọ́kọ́ àti Ẹni Ìkẹyìn
  rationale: A lo ‘Ẹni’ láti fi hàn pé orúkọ oyè ẹni ni gbólóhùn náà, a sì lo lẹ́tà ńlá láti fi agbára orúkọ oyè Kristi hàn.
- source_word: ἐγένετο νεκρὸς
  choice: ẹni tí ó kú
  rationale: Èyí sọ ìṣẹ̀lẹ̀ wíwọ inú ikú ní Yorùbá àdánidá, láì sọ ọ́ di ipò lásán tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἔζησεν
  choice: tí ó sì tún wà láàyè
  rationale: ‘Tún wà láàyè’ mú ìyàtọ̀ tó wà láàárín ikú àti ìyè hàn kedere, ó sì bá àyíká àjíǹde mu láì ṣe àfikún ju ohun tí ọ̀rọ̀ náà sọ lọ.
theological_decisions:
- issue: Orúkọ oyè Kristi àti ọ̀rọ̀ nípa ikú àti àjíǹde rẹ̀
  choice: Ẹni Àkọ́kọ́ àti Ẹni Ìkẹyìn, ẹni tí ó kú, tí ó sì tún wà láàyè
  alternative: ẹni tí ó ti kú, tí ó sì padà wá sí ìyè
  rationale: Ìtumọ̀ náà pa orúkọ oyè gíga ti Kristi àti ìyípadà láti inú ikú sí ìyè mọ́. Kò fi ẹ̀kọ́ ìsìn àfikún sí ọ̀rọ̀ Gíríìkì, kò sì mú ìtumọ̀ kan tí ọ̀rọ̀ náà kò fi dandan mú wọlé.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. A yan ‘Símírínà’ gẹ́gẹ́ bí ìkọ̀wé orúkọ ìlú Smyrna tó rọrùn fún olùkà Yorùbá. Ìṣètò ‘Ohun tí ... wí nìyí’ jẹ́ ti Yorùbá àdánidá, ṣùgbọ́n ó ṣì pa ìró ìkéde àsọtẹ́lẹ̀ mọ́.
