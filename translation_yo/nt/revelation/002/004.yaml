base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: yo
  text: 'Ṣùgbọ́n mo ní èyí lòdì sí ọ: o ti kọ ìfẹ́ àkọ́kọ́ rẹ sílẹ̀.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “o ti fi ìfẹ́ àkọ́kọ́ rẹ sílẹ̀.” Gbólóhùn náà lè tọ́ka sí ìfẹ́ tí o ní ní ìbẹ̀rẹ̀, yálà sí Olúwa, sí ara wọn, tàbí sí àwọn méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ìyìn tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἔχω κατὰ σοῦ
  choice: mo ní èyí sí ọ
  rationale: Gbólóhùn yìí ń sọ pé ẹni tó ń besz? ní ẹ̀sùn tàbí àríwísí kan sí ẹni náà; fífi “èyí” kún un mú àkóónú tí ὅτι ń ṣàlàyé tẹ̀ lé e lọ́nà tó ṣe kedere.
- source_word: ὅτι
  choice: ': ìwọ ti'
  rationale: Àmì olóṣù méjì ń ṣí àlàyé àkóónú ẹ̀sùn náà, láì túmọ̀ ὅτι sí “nítorí pé,” èyí tí ó lè fi ìtumọ̀ tó ju ti Gíríìkì lọ kún un.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó bójú mu, tó sì pa ìtumọ̀ ἀγάπη mọ́ láì fi irú ìfẹ́ pàtó kan kún un.
- source_word: τὴν πρώτην
  choice: àkọ́kọ́
  rationale: Ó tẹ̀ lé ìtumọ̀ πρώτην ní tààrà, ó sì jẹ́ kí gbólóhùn náà ṣì lè tọ́ka sí ìfẹ́ wọn ní ìbẹ̀rẹ̀ láì sọ ohun tí ìfẹ́ náà dojú kọ.
- source_word: ἀφῆκες
  choice: ti kọ ... sílẹ̀
  rationale: “Kọ ... sílẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ohun kan sílẹ̀ tàbí pípa á tì; ó ní agbára ìkìlọ̀ tó wà nínú ἀφῆκες, láì lo èdè àtijọ́.
theological_decisions:
- issue: Ìtumọ̀ “ìfẹ́ rẹ àkọ́kọ́”
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “ìfẹ́ rẹ àkọ́kọ́,” láì sọ ẹni tí ìfẹ́ náà dojú kọ.
  alternative: “ìfẹ́ tí o ní sí mi ní ìbẹ̀rẹ̀” tàbí “ìfẹ́ tí o ní ní ìbẹ̀rẹ̀”
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ní pàtó bóyá ìfẹ́ sí Olúwa, sí ara wọn, tàbí sí àwọn méjèèjì ni; ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó bójú mu, tó ní ọlá, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo “ìwọ” nítorí ẹni kan ṣoṣo ni σοῦ àti ἀφῆκες ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé aṣojú ìjọ ni a ń bá sọ̀rọ̀.
