id: REV.2.5
reference: Revelation 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: yo
  text: Nítorí náà, máa rántí ibi tí o ti ṣubú[a]; ronúpìwàdà, kí o sì ṣe àwọn iṣẹ́ tí o ṣe ní ìbẹ̀rẹ̀. Ṣùgbọ́n bí bẹ́ẹ̀ kọ́, mo ń bọ̀ sọ́dọ̀ rẹ, màá sì yọ ọ̀pá fìtílà rẹ kúrò ní ipò rẹ̀[b], bí o kò bá ronúpìwàdà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ibi gíga tí o ti ṣubú.” Gíríìkì sọ ní tààrà pé “ibi tí o ti ṣubú”; àwọn kan ka a sí àwòrán ibi gíga.
    reason: lexical_alternative
  - marker: b
    text: “Ọ̀pá fìtílà” ni àwòrán tí a lò fún ìjọ kan nínú Ìfihàn 1:20.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: máa rántí
  rationale: Ọ̀rọ̀ àṣẹ alásìkò ìsinsìnyí tọ́ka sí rírántí tí ó ń bá a lọ; “máa rántí” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ yìí mọ́.
- source_word: οὖν
  choice: nítorí náà
  rationale: Ó so àṣẹ náà mọ́ ìbáwí tó ṣáájú gẹ́gẹ́ bí àbájáde rẹ̀.
- source_word: πόθεν πέπτωκας
  choice: ibi tí o ti ṣubú kúrò
  rationale: Ó pa àwòrán ìṣubú àti ìtumọ̀ gangan “láti ibi tí” mọ́ láì fi “gíga” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: μετανόησον / μετανοήσῃς
  choice: ronú pìwà dà
  rationale: Èyí ni gbólóhùn Yorùbá tí ó wọ́pọ̀ fún ìyípadà ọkàn àti ìpadà kúrò nínú ìwà búburú ní àyíká ẹ̀mí àti ìwà rere.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: ṣe àwọn iṣẹ́ tí o ń ṣe ní ìbẹ̀rẹ̀
  rationale: Ó tú agbára àkókò inú πρῶτα jáde ní Yorùbá àdánidá, ó sì tọ́ka sí àwọn ìṣe wọn tẹ́lẹ̀.
- source_word: εἰ δὲ μή
  choice: ṣùgbọ́n bí bẹ́ẹ̀ kọ́
  rationale: Ó pa ìyípadà ọ̀rọ̀ àti ìkìlọ̀ oníṣ شرط mọ́ ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá.
- source_word: ἔρχομαί σοι
  choice: mo ń bọ̀ wá sọ́dọ̀ rẹ
  rationale: Ó pa ìmọ̀lára pé dídé náà sún mọ́lé mọ́, láì fi ìtumọ̀ “lòdì sí ọ” kún un.
- source_word: κινήσω
  choice: èmi yóò mú ... kúrò
  rationale: Pẹ̀lú “kúrò ní ipò rẹ̀,” ọ̀rọ̀ náà túmọ̀ sí yíyọ ohun náà kúrò níbi tí ó wà, kì í ṣe kìkàn ṣí i díẹ̀.
- source_word: τὴν λυχνίαν σου
  choice: ọ̀pá fìtílà rẹ
  rationale: Ó pa ohun ìṣàpẹẹrẹ náà mọ́ gẹ́gẹ́ bí ohun tí a gbé fìtílà lé, kì í ṣe fìtílà fúnra rẹ̀.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: kúrò ní ipò rẹ̀
  rationale: Ìtumọ̀ taara àti àdánidá fún yíyọ ọ̀pá fìtílà náà kúrò ní ibi tí a yàn fún un.
theological_decisions:
- issue: Ìtumọ̀ ìkìlọ̀ nípa ọ̀pá fìtílà
  choice: Pa àwòrán ìṣàpẹẹrẹ yíyọ ọ̀pá fìtílà ìjọ náà kúrò mọ́ láì ṣàlàyé rẹ̀ sí ẹ̀kọ́ nípa ìgbàlà ẹnì kọ̀ọ̀kan.
  alternative: Ìpàdánù ẹ̀rí ìjọ, ìdájọ́ lórí wíwà tàbí ipò ìjọ, tàbí ìpàdánù ìgbàlà.
  rationale: Ìfihàn 1:20 fi ọ̀pá fìtílà ṣàpẹẹrẹ ìjọ, ṣùgbọ́n ẹsẹ̀ yìí kò pinnu àbájáde ẹ̀kọ́ ìgbàgbọ́ kan nípa ìgbàlà ẹnì kọ̀ọ̀kan. Nítorí náà, a pa ìṣàpẹẹrẹ àti ẹ̀dọ̀fu ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A lo “o/rẹ” nítorí ẹni kejì ẹyọ kan ni Gíríìkì, bí ó tilẹ̀ jẹ́ pé a ń bá ìjọ sọ̀rọ̀. Àwọn àmì ohùn ni a fi sí ibi tí ó bá àṣà Yorùbá boṣewa mu.
