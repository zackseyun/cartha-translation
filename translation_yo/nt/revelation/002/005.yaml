  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní pàtàkì: àwọn àṣẹ náà, ìkìlọ̀ oníṣòro méjì, àwòrán ọ̀pá fìtílà, àti ìbáṣepọ̀ ‘láti ibi tí’ ni a ti pa mọ́. Síbẹ̀, ‘ṣubú kúrò’ fi èrò ‘kúrò/fall away’ kún πέπτωκας tí kò hàn gbangba nínú ọ̀rọ̀ ìpilẹ̀; ‘ṣubú’ nìkan dáa jù.'
  naturalness: ‘Ronúpìwàdà’ jẹ́ ọ̀rọ̀-ìṣe kan tí ó wọ́pọ̀, ó sì dára ju kí a kọ ọ́ sí ọ̀rọ̀ méjì lọ nínú ìtumọ̀ yìí. ‘Àwọn iṣẹ́ tí o ṣe ní ìbẹ̀rẹ̀’ jẹ́ ìsọ̀rọ̀ Yorùbá tí ó mọ́, ó sì yàgò fún ìmọ̀lára pé wọ́n ṣì ń ṣe iṣẹ́ wọ̀nyẹn (‘tí o ń ṣe’).
