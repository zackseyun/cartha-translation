  to: Nítorí náà, máa rántí ibi tí o ti ṣubú[a]; ronúpìwàdà, kí o sì ṣe àwọn iṣẹ́ tí o ṣe ní ìbẹ̀rẹ̀. Ṣùgbọ́n bí bẹ́ẹ̀ kọ́, mo ń bọ̀ sọ́dọ̀ rẹ, màá sì yọ ọ̀pá fìtílà rẹ kúrò ní ipò rẹ̀[b], bí o kò bá ronúpìwàdà.
  rationale: Àtúnṣe náà yọ ‘kúrò’ kúrò lẹ́yìn ‘ṣubú’ láti má ṣe fi ìtumọ̀ tí Gíríìkì kò sọ kún un. Ó tún lo ‘ronúpìwàdà’ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe Yorùbá tí ó jẹ́ àdánidá, ó sì ṣàtúnṣe gbólóhùn nípa àwọn iṣẹ́ ìbẹ̀rẹ̀ láti tọ́ka sí àwọn iṣẹ́ tí wọ́n ṣe tẹ́lẹ̀. Àwòrán ọ̀pá fìtílà àti ìdánilójú ìkìlọ̀ náà wà láì ṣàfikún ìtumọ̀ ẹ̀kọ́ kan.
