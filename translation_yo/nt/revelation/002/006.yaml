  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: yo
  text: 'Ṣùgbọ́n èyí ni ẹ ní: ẹ kórìíra àwọn iṣẹ́ àwọn Nikolaiti[a], tí èmi náà kórìíra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ‘àwọn iṣẹ́’ sí ‘àwọn ìṣe.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ìṣe tàbí àṣà tí wọ́n ń tẹ̀ lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ohun tí a sọ ṣáájú, ó sì jẹ́ ọ̀rọ̀ ìsopọ̀ tí ó ṣe déédé ní Yorùbá.
- source_word: τοῦτο ἔχεις
  choice: ohun kan ni èyí tí ẹ ní
  rationale: Ó pa ìtẹnumọ́ tí fífi τοῦτο sí iwájú mú wá mọ́, nígbà tí gbólóhùn náà ṣì jẹ́ ti Yorùbá àdánidá. Arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ’ bá ẹni tí a ń bá sọ nínú àyíká yìí mu.
- source_word: ὅτι
  choice: ':'
  rationale: Níhìn-ín ὅτι ń ṣàlàyé ohun tí wọ́n ní; àmì olóṣù méjì mú ìtumọ̀ náà jáde ní kedere láìfi ọ̀rọ̀ àfikún sí i.
- source_word: μισεῖς
  choice: ẹ kórìíra
  rationale: ‘Kórìíra’ sọ agbára μισέω jáde láìrọ̀ ọ́, ó sì yẹ fún èdè mímọ́ tí ó ṣe déédé.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: ‘Àwọn iṣẹ́’ jẹ́ ìtumọ̀ tààrà fún ἔργα, ó sì mú kedere pé àwọn ìṣe tàbí àṣà wọn ni a kórìíra, kì í ṣe àwọn ènìyàn náà ní tààrà.
- source_word: τῶν Νικολαϊτῶν
  choice: àwọn Nikolaiti
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹgbẹ́ náà ní ọ̀nà tí ó rọrùn fún òǹkà Yorùbá láti ka, láìfi ìtumọ̀ tí kò sí nínú orísun kún un.
- source_word: ἃ
  choice: èyí tí
  rationale: Ó tọ́ka padà sí ‘àwọn iṣẹ́’ gẹ́gẹ́ bí ohun tí a kórìíra, ó sì dá ìbáṣepọ̀ gbólóhùn náà dúró.
- source_word: κἀγὼ
  choice: èmi náà
  rationale: Ó pa ìtẹnumọ́ καὶ ἐγώ mọ́, ó sì fi hàn pé olùbánisọ̀rọ̀ náà ní irú ìdúró kan náà.
- source_word: μισῶ
  choice: kórìíra
  rationale: A tún lo ọ̀rọ̀ kan náà bíi ti μισεῖς láti pa àtúnṣe ọ̀rọ̀ Gíríìkì àti agbára rẹ̀ mọ́.
theological_decisions:
- issue: Ohun tí ìkórìíra náà dojú kọ
  choice: Àwọn iṣẹ́ àwọn Nikolaiti ni a sọ pé a kórìíra.
  alternative: Ìtumọ̀ tí ó túbọ̀ fẹ̀ lè mú un dà bí ẹni pé àwọn Nikolaiti fúnra wọn ni a kórìíra.
  rationale: τὰ ἔργα ni ohun tí ọ̀rọ̀-ìṣe μισεῖς dojú kọ ní tààrà; ìtumọ̀ náà kò gbọ́dọ̀ fa ìdálẹ́bi náà kọjá sí àwọn ènìyàn fúnra wọn.
- issue: Ìfarakẹ́gbẹ́ olùbánisọ̀rọ̀ pẹ̀lú ìdúró ìjọ
  choice: ‘èyí tí èmi náà kórìíra’
  alternative: ‘èyí tí èmi pẹ̀lú kórìíra’
  rationale: Ó pa agbára κἀγὼ μισῶ mọ́, ó sì fi hàn ní tààrà pé Jésù tí ó jíǹde fara mọ́ ìkọ̀sílẹ̀ àwọn iṣẹ́ wọ̀nyí.
translation_notes:
  register: Èdè Yorùbá àkókò yìí, tí ó ní iyì tí ó sì ṣe kedere fún òǹkà gbogbogbò, ni a lò. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ fún ìjọ, a sì fi àmì ohùn sí ibi tí ó yẹ.
