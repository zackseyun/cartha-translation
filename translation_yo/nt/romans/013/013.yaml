id: ROM.13.13
reference: Romans 13:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: yo
  text: 'Ẹ jẹ́ kí a rìn ní ìwà tó bójú mu, bí ní ọ̀sán: kì í ṣe nínú àríyá oníwà túká àti ìmutípara, kì í ṣe nínú ìwà ìbálòpọ̀ tí kò tọ́ àti ìwà àìlójú, kì í sì í ṣe nínú ìjà àti owú.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlara”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí owú tàbí ìlara, ṣùgbọ́n nínú àkójọ ìwà búburú yìí ó ní ìtumọ̀ odi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: bí ẹni tí ń rìn ní ọ̀sán
  rationale: Ó pa àwòrán ìrìn ní ìmọ́lẹ̀ ọ̀sán mọ́, ó sì mú kí gbólóhùn náà ṣe kedere ní Yorùbá láì túmọ̀ àwòrán náà ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: εὐσχημόνως
  choice: ní ìwà tí ó yẹ
  rationale: Ó túmọ̀ sí híhu ìwà lọ́nà tó bójú mu, tó yẹ, tí àwọn ènìyàn sì lè bọ̀wọ̀ fún; yíyan yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: περιπατήσωμεν
  choice: Ẹ jẹ́ kí a máa rìn
  rationale: Ó pa àkàwé Pọ́ọ̀lù nípa ‘rírìn’ gẹ́gẹ́ bí ọ̀nà ìgbésí ayé mọ́, ó sì fi agbára ọ̀rọ̀ ìṣírí ẹni-àkọ́kọ́ púpọ̀ hàn.
- source_word: κώμοις
  choice: àríyá oníwà túká
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àríyá aláriwo tí ìṣekúṣe àti ọtí sábà máa ń bá rìn; yíyan yìí kò fi í mọ́ ìwà ìbálòpọ̀ nìkan.
- source_word: μέθαις
  choice: ìmutípara
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún mímu ọtí dé ipò àìníjàánu.
- source_word: κοίταις
  choice: ìṣekúṣe
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ ni ‘ibusun,’ níbí ó jẹ́ àkànlò èdè fún ìbálòpọ̀ tí kò tọ́; títúmọ̀ ìtumọ̀ rẹ̀ mú kí agbára ìkìlọ̀ náà ṣe kedere.
- source_word: ἀσελγείαις
  choice: ìwà wọ̀bìà
  rationale: Ó ṣàpèjúwe ìwà àìníjàánu àti àìlójú, tí ó sábà ní ìtumọ̀ ìṣekúṣe, láì fi ọ̀rọ̀ náà mọ́ ìbálòpọ̀ nìkan.
- source_word: ἔριδι
  choice: ìjà
  rationale: Ní àkójọ ìwà búburú yìí, ó túmọ̀ sí awuyewuye, ìfíjàkadì, tàbí ìjà láàárín ènìyàn.
- source_word: ζήλῳ
  choice: owú
  rationale: Nínú àkójọ ìwà búburú yìí, ọ̀rọ̀ náà ní ìtumọ̀ odi; ‘owú’ bá ìjà mu, bí ó tilẹ̀ jẹ́ pé ‘ìlara’ tún ṣeé ṣe.
theological_decisions:
- issue: Àkàwé ọ̀sán àti òkùnkùn nínú ìṣírí sí ìwà rere
  choice: A pa àwòrán náà mọ́ gẹ́gẹ́ bí ‘bí ẹni tí ń rìn ní ọ̀sán.’
  alternative: láìṣàbòsí, bí ní ọ̀sán
  rationale: Ẹsẹ náà jẹ́ apá kan àkàwé ọ̀sán àti òru nínú àyíká rẹ̀; ìtumọ̀ náà pa àwòrán mọ́ láì sọ ọ́ di ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ yìí kò ṣàlàyé ní tààrà.
- issue: Ìtumọ̀ àkànlò κοίταις
  choice: A túmọ̀ ọ́ nípa ìtumọ̀ rẹ̀ sí ‘ìṣekúṣe,’ kì í ṣe ‘ibusun.’
  alternative: ibusun
  rationale: ‘Ibusun’ nìkan lè ṣókùnkùn ní Yorùbá, nígbà tí àyíká Gíríìkì fi ìtọ́kasí sí ìbálòpọ̀ tí kò tọ́ hàn kedere.
- issue: Ìtumọ̀ odi ζήλῳ
  choice: owú
  alternative: ìlara
  rationale: Àkójọ ìwà búburú àti bí ọ̀rọ̀ náà ṣe so mọ́ ‘ìjà’ ń béèrè ìtumọ̀ odi, ṣùgbọ́n a kò pa àṣàyàn ‘ìlara’ rẹ́; a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ìṣètò gbolohun mẹ́ta ‘kì í ṣe ...’ láti pa ìwọ̀ntúnwọ̀nsì àkójọ Gíríìkì mọ́, a sì lo ‘kì í sì í ṣe’ ní ìkẹyìn fún ìṣàn èdè Yorùbá àdánidá.
