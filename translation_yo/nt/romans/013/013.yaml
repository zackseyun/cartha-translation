- from: 'Ẹ jẹ́ kí a máa rìn ní ìwà tí ó yẹ[a], bí ẹni tí ń rìn ní ọ̀sán: kì í ṣe nínú àríyá oníwà túká àti ìmutípara, kì í ṣe nínú ìṣekúṣe àti ìwà wọ̀bìà, kì í sì í ṣe nínú ìjà àti owú.[b]'
  to: 'Ẹ jẹ́ kí a rìn ní ìwà tó bójú mu, bí ní ọ̀sán: kì í ṣe nínú àríyá oníwà túká àti ìmutípara, kì í ṣe nínú ìwà ìbálòpọ̀ tí kò tọ́ àti ìwà àìlójú, kì í sì í ṣe nínú ìjà àti owú.[a]'
  rationale: A tún un ṣe láti yọ ìfikún kékeré kúrò nínú àwòrán “bí ní ọ̀sán,” láti fi hortatory subjunctive hàn pẹ̀lú “Ẹ jẹ́ kí a rìn,” àti láti jẹ́ kí àwọn ọ̀rọ̀ fún κοίταις àti ἀσελγείαις ṣe kedere síi ní Yorùbá òde òní. A yọ àlàyé ìsàlẹ̀ fún εὐσχημόνως kúrò nítorí “ní ìwà tó bójú mu” ti yan ìtumọ̀ ‘decently/respectably’ tán; a pa àlàyé ζήλῳ mọ́, a sì gbe àmì rẹ̀ sún mọ́ ọ̀rọ̀ tí ó ṣàlàyé.
  reviewer_model: gpt-5.6-terra
