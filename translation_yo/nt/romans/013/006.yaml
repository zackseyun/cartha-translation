id: ROM.13.6
reference: Romans 13:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: yo
  text: Nítorí èyí ni ẹ̀yin pẹ̀lú ṣe ń san owó-orí, nítorí àwọn aláṣẹ jẹ́ àwọn ìránṣẹ́ Ọlọ́run, wọ́n sì ń fi ara wọn fún ohun gan-an yìí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: ẹ̀yin pẹ̀lú ṣe ń san owó-orí
  rationale: “Owó-orí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún owó tí ìjọba ń gba; “ṣe ń san” fi ìṣe tí ó ń bá a lọ hàn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: λειτουργοὶ θεοῦ
  choice: ìránṣẹ́ Ọlọ́run
  rationale: λειτουργοί túmọ̀ sí àwọn tí ń ṣe iṣẹ́ ìjọba tàbí iṣẹ́ àkànṣe; “ìránṣẹ́” ṣe kedere pé wọ́n ń ṣiṣẹ́ ní ipò tí Ọlọ́run gbà láàyè, láìfi oyè ẹ̀sìn kan kún un.
- source_word: εἰς αὐτὸ τοῦτο προσκαρτεροῦντες
  choice: wọ́n sì ń fi ara wọn fún iṣẹ́ yìí gan-an
  rationale: Gbólóhùn yìí mú ìtumọ̀ ìfaradà àti ìfọkànsìn προσκαρτεροῦντες jáde, nígbà tí “yìí gan-an” pa ìtẹnumọ́ αὐτὸ τοῦτο mọ́.
theological_decisions:
- issue: Bí a ṣe máa ṣàlàyé pé àwọn wo ni “wọ́n” jẹ́
  choice: àwọn aláṣẹ
  alternative: wọ́n
  rationale: Àwọn aláṣẹ ni àyíká ẹsẹ tó ṣáájú tọ́ka sí. Ṣíṣe orúkọ wọn ní kedere jẹ́ ohun àdánidá ní Yorùbá, kò sì yanjú ìbéèrè ẹ̀kọ́ ìgbàgbọ́ kan tí ọ̀rọ̀ Gíríìkì fi sílẹ̀.
- issue: Ìbáṣepọ̀ àwọn aláṣẹ pẹ̀lú Ọlọ́run
  choice: ìránṣẹ́ Ọlọ́run
  alternative: àwọn òjíṣẹ́ Ọlọ́run
  rationale: “Ìránṣẹ́ Ọlọ́run” pa ìtumọ̀ pé iṣẹ́ wọn wà lábẹ́ ètò Ọlọ́run mọ́, ṣùgbọ́n kò sọ wọ́n di olórí ẹ̀sìn tàbí fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo.
