id: ROM.13.11
reference: Romans 13:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: yo
  text: Ẹ sì ṣe èyí, ní mímọ̀ àkókò náà, pé wákàtí ti tó báyìí fún yín[a] láti jí kúrò nínú oorun, nítorí nísinsin yìí, ìgbàlà wa sún mọ́ wa ju ìgbà tí a gbàgbọ́[b] lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘fún wa’ dípò ‘fún yín’ nínú gbólóhùn náà, ‘wákàtí ti tó báyìí fún yín láti jí kúrò nínú oorun.’
    reason: textual_variant
  - marker: b
    text: Tàbí, ‘ju ìgbà tí a kọ́kọ́ gbàgbọ́ lọ.’ Èdè Gíríìkì kàn sọ pé, ‘nígbà tí a gbàgbọ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: Ẹ sì ṣe èyí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, τοῦτο ń tọ́ka sí àwọn ìṣílétí ìwà rere tó ṣáájú; fífi ọ̀rọ̀-ìṣe ‘ṣe’ hàn mú kí Yorùbá ṣe kedere, láìfi èrò tuntun kún un.
- source_word: εἰδότες τὸν καιρόν
  choice: ní mímọ̀ àkókò náà
  rationale: Èyí pa ìrísí participle náà mọ́, ó sì fi καιρός hàn gẹ́gẹ́ bí àkókò pàtàkì tí a wà, kì í ṣe kìkì iye àkókò lásán.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: pé wákàtí ti tó báyìí fún yín
  rationale: ‘Wákàtí ti tó báyìí’ sọ ìkánjú ὥρα àti ἤδη ní Yorùbá àdánidá; ‘fún yín’ tẹ̀lé ὑμᾶς, ẹni kejì ọ̀pọ̀.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: láti jí kúrò nínú oorun
  rationale: Ọ̀rọ̀ yìí pa àkàwé jíjíròrò kúrò nínú oorun mọ́, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: νῦν γὰρ
  choice: nítorí nísinsin yìí
  rationale: ‘Nítorí’ fi iṣẹ́ γάρ gẹ́gẹ́ bí ìdí hàn, ‘nísinsin yìí’ sì túmọ̀ νῦν.
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: ìgbàlà wa sún mọ́lé
  rationale: Èyí sọ σωτηρία di ‘ìgbàlà’ láìdín ìtumọ̀ rẹ̀ kù sí apá ẹ̀kọ́ ìgbàlà kan ṣoṣo, ó sì pa ìfiwéra ‘sún mọ́lé’ mọ́.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: ju ìgbà tí a gbàgbọ́ lọ
  rationale: Èyí tẹ̀lé Gíríìkì ní tààrà, láìfi ‘kọ́kọ́’ kún un, bó tilẹ̀ jẹ́ pé ìtumọ̀ yẹn ṣeé ṣe nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Ìgbàlà gẹ́gẹ́ bí ohun tí ó sún mọ́lé nísinsin yìí ju nígbà tí àwọn onígbàgbọ́ gbàgbọ́ lọ
  choice: Pa ‘ìgbàlà wa’ mọ́ láìsọ ọ́ di ipele kan pàtó.
  alternative: ‘ìgbàlà wa ní ìkẹyìn’ tàbí ‘ìdásílẹ̀ wa nígbà tí Olúwa bá padà’
  rationale: Ẹsẹ̀ náà ń sọ̀rọ̀ nípa ìgbàlà gẹ́gẹ́ bí ohun tí ó jẹ́ tiwa ṣùgbọ́n tí ó tún ń sún mọ́lé. Ìtumọ̀ kò gbọ́dọ̀ yanju ìdààmú ẹ̀kọ́ ìgbàgbọ́ yìí ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé gbogbo. A gbe àmì àlàyé [a] sí ‘fún yín,’ ibi tí ìyàtọ̀ ìwé àfọwọ́kọ náà kan, àti [b] sí ‘gbàgbọ́,’ ibi tí àṣàyàn ọ̀rọ̀ náà kan.
