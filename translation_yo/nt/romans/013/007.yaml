source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: yo
  text: 'Ẹ san fún gbogbo ènìyàn ohun tí ẹ jẹ wọ́n ní gbèsè: fún ẹni tí owó orí yẹ, ẹ san owó orí; fún ẹni tí owó-ìbòṣí yẹ, ẹ san owó-ìbòṣí; ẹni tí ó yẹ kí ẹ bẹ̀rù, ẹ bẹ̀rù ẹni náà; fún ẹni tí ọlá yẹ, ẹ fi ọlá fún un.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Ẹ san
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ohun tí ó tọ́ tàbí tí a jẹ ní gbèsè fún ẹni náà padà; “ẹ san” bá àyíká owó àti ojúṣe mu ní èdè Yorùbá.
- source_word: φόρον
  choice: owó orí
  rationale: Ó tọ́ka sí owó orí tí ìjọba máa ń gba, pàápàá owó orí taara.
- source_word: τέλος
  choice: owó ìlú
  rationale: Ó yàtọ̀ sí φόρος, ó sì lè jẹ́ owó tí a ń gba lórí ọjà, ẹrù, tàbí iṣẹ́ ìjọba; “owó ìlú” jẹ́ ọ̀rọ̀ àgbáyé tó pa ìyàtọ̀ náà mọ́ láì dín in sí irú owó kan ṣoṣo.
- source_word: φόβον
  choice: ẹ bẹ̀rù
  rationale: A pa ìtumọ̀ gidi “ìbẹ̀rù” mọ́ dípò yíyí i sí “ọ̀wọ̀” nìkan, nítorí pé ọ̀rọ̀ tó tẹ̀ lé e, τιμή, ló túmọ̀ sí ọlá tàbí ọ̀wọ̀.
- source_word: τιμήν
  choice: ẹ bọ̀wọ̀ fún
  rationale: Nínú àyíká yìí, ó túmọ̀ sí fífi ọlá tàbí ọ̀wọ̀ tí ó yẹ fún ẹni kan fún un; ìṣe “bọ̀wọ̀ fún” jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá φόβος yẹ kí a túmọ̀ sí ìbẹ̀rù tàbí ọ̀wọ̀
  choice: ẹ bẹ̀rù
  alternative: ẹ fi ọ̀wọ̀ fún
  rationale: A pa ìforígbárí inú ọ̀rọ̀ Gíríìkì mọ́, a kò sì da φόβος pọ̀ mọ́ τιμή, tí ó ti sọ̀rọ̀ nípa ọlá tàbí ọ̀wọ̀.
- issue: Àwọn ẹni tí a ní láti bẹ̀rù tàbí bọ̀wọ̀ fún
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní gbogbogbò bí orísun ṣe ṣe
  alternative: Ṣàlàyé wọn gẹ́gẹ́ bí àwọn aláṣẹ ìjọba nìkan
  rationale: Àyíká sọ̀rọ̀ nípa àwọn aláṣẹ, ṣùgbọ́n ẹsẹ̀ náà kò tún dárúkọ wọn ní tààrà; a kò fi àlàyé ìtumọ̀ sínú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “ẹ” gẹ́gẹ́ bí àṣẹ sí ọ̀pọ̀ ènìyàn, a sì tún àkọsílẹ̀ náà ṣe ní ọ̀nà àdánidá láti pa ìtẹnumọ́ àti ìfararọ̀ Gíríìkì mọ́.
