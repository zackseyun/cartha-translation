  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: yo
  text: Ìfẹ́ kì í ṣe ibi sí ẹni kejì[a]; nítorí náà, ìfẹ́ ni ìmúṣẹ òfin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìfẹ́ kì í ṣiṣẹ́ ohun búburú sí ẹni kejì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìfẹ́ ni ẹ̀kúnrẹ́rẹ́ òfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: Ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé jù fún ἀγάπη, ó sì pa àtúnlò ọ̀rọ̀ náà mọ́ ní apá méjèèjì ẹsẹ yìí.
- source_word: τῷ πλησίον
  choice: sí ẹnì kejì
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnì kan mìíràn tí ìṣe ẹni kan lè kàn. “Ẹnì kejì” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ̀rọ̀ nípa aládùúgbò tàbí ẹlẹgbẹ́ ènìyàn ní ìtumọ̀ ìwà rere yìí, láì fi sí àwọn tó ń gbé nítòsí nìkan.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: kì í ṣe ibi
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pé ìfẹ́ kì í ṣe tàbí mú ohun búburú ṣẹlẹ̀ sí ẹnì kejì. “Kì í ṣe ibi” jẹ́ gbolohun Yorùbá tó ṣe kedere, tó sì lè gba ìtumọ̀ ìpalára àti ìwà búburú méjèèjì.
- source_word: πλήρωμα
  choice: ìmúṣẹ
  rationale: Ní àríyànjiyàn Pọ́ọ̀lù, πλήρωμα ń tọ́ka sí ohun tí ó mú òfin dé ibi tí a pinnu fún un. “Ìmúṣẹ” sọ ìtumọ̀ yìí ní kedere, ó sì pa ìrísí gbólóhùn-orúkọ inú Gíríìkì mọ́.
- source_word: οὖν
  choice: nítorí náà
  rationale: Ó fi hàn pé gbólóhùn kejì jẹ́ àbájáde ọgbọ́n inú gbólóhùn àkọ́kọ́.
- source_word: νόμου
  choice: òfin
  rationale: Ní àyíká ọ̀rọ̀ yìí, “òfin” tọ́ka sí Òfin tí Pọ́ọ̀lù ti ń sọ̀rọ̀ nípa rẹ̀, láì nílò àlàyé ẹ̀kọ́ ìsìn míì.
theological_decisions:
- issue: Ìbáṣepọ̀ ìfẹ́ pẹ̀lú òfin
  choice: ìfẹ́ ni ìmúṣẹ òfin
  alternative: ìfẹ́ ni ẹ̀kúnrẹ́rẹ́ òfin; ìfẹ́ mú òfin ṣẹ
  rationale: Gíríìkì jẹ́ gbólóhùn-orúkọ, kì í ṣe àṣẹ tàbí gbólóhùn-ìṣe tààrà. “Ìfẹ́ ni ìmúṣẹ òfin” pa ètò yẹn àti ìtẹnumọ́ ẹ̀kọ́ Pọ́ọ̀lù mọ́ láì ṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún, a sì pa ìṣọ̀kan àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́ níbi tí Yorùbá ti lè ṣe bẹ́ẹ̀ lọ́nà àdánidá.
