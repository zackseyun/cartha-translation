id: ROM.13.5
reference: Romans 13:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: yo
  text: Nítorí náà, ó pọndandan láti tẹríba fún àwọn aláṣẹ[b], kì í ṣe nítorí ìbínú[a] nìkan, ṣùgbọ́n nítorí ẹ̀rí-ọkàn pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nítorí ìjìyà”; Gíríìkì ní “nítorí ìbínú,” èyí tó lè tọ́ka sí ìgbésẹ̀ ìjìyà aláṣẹ tàbí, ní ìtumọ̀ tó gbòòrò, sí ìbínú Ọlọ́run tó ń ṣiṣẹ́ nípasẹ̀ àṣẹ ìjọba.
    reason: alternative_reading
  - marker: b
    text: Tàbí “láti wà lábẹ́ àṣẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ nípa àwọn aláṣẹ.
- source_word: ἀνάγκη
  choice: ó pọndandan
  rationale: Ó pa agbára ọ̀rọ̀ àìníyànjú mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ὑποτάσσεσθαι
  choice: láti tẹríba fún àwọn aláṣẹ
  rationale: “Tẹríba fún” sọ ìdúró ìtẹríba tí ọ̀rọ̀ Gíríìkì ń béèrè, láìfi ìgbọràn pátápátá tí kò ní ààlà kún un. A tún sọ “àwọn aláṣẹ” láti mú ẹni tí a ń tẹríba fún, tí àyíká ẹsẹ tó ṣáájú ti fihàn, ṣe kedere ní Yorùbá.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: kì í ṣe … nìkan, ṣùgbọ́n … pẹ̀lú
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti pa ìbáṣepọ̀ àfikún àti ìyàtọ̀ inú gbólóhùn Gíríìkì mọ́.
- source_word: διὰ τὴν ὀργὴν
  choice: nítorí ìbínú
  rationale: “Ìbínú” pa ìtumọ̀ ὀργή mọ́, kò sì pinnu bóyá ìbínú Ọlọ́run ni tàbí ìjẹ̀bi tí aláṣẹ ń mú wá.
- source_word: διὰ τὴν συνείδησιν
  choice: nítorí ẹ̀rí-ọkàn
  rationale: “Ẹ̀rí-ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìmọ̀ inú nípa ohun tó tọ́ tàbí tó burú; “nítorí” sì fi ìdí tàbí ìsúnniṣe hàn.
theological_decisions:
- issue: Ẹni tí “ìbínú” (ὀργή) tọ́ka sí
  choice: A túmọ̀ rẹ̀ ní ṣókí sí “ìbínú,” láìsọ ẹni tí ó ni ín.
  alternative: Ìbínú Ọlọ́run; tàbí ìjìyà/ìbínú aláṣẹ.
  rationale: Àyíká ọ̀rọ̀ mẹ́nu kan Ọlọ́run tó ṣètò àṣẹ àti aláṣẹ tó ń mú idà. Gíríìkì kò sọ ẹni tí ìbínú náà jẹ́ níhìn-ín, nítorí náà a pa àìdánilójú náà mọ́.
- issue: Agbára ὑποτάσσεσθαι sí àwọn aláṣẹ
  choice: tẹríba fún àwọn aláṣẹ
  alternative: wà lábẹ́ àṣẹ àwọn aláṣẹ
  rationale: “Tẹríba fún” fi ìdáhùn tí a ń béèrè hàn ní kedere, ṣùgbọ́n kò sọ pé ẹni gbọ́dọ̀ ṣe gbogbo ohun tí aláṣẹ bá pàṣẹ láìsí ààlà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A mú “àwọn aláṣẹ” wá láti inú àyíká ọ̀rọ̀ nítorí infinitive Gíríìkì kò tún sọ ohun tí ìtẹríba náà dojú kọ ní ẹsẹ yìí.
