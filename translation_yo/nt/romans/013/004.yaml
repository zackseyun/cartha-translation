id: ROM.13.4
reference: Romans 13:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: yo
  text: Nítorí aláṣẹ jẹ́ ìránṣẹ́ Ọlọ́run fún rere rẹ. Ṣùgbọ́n bí o bá ń ṣe ohun búburú, bẹ̀rù, nítorí kì í ṣe lásán ni ó fi ń ru idà. Nítorí ìránṣẹ́ Ọlọ́run ni aláṣẹ jẹ́, olùgbẹ̀san tí ń mú ìbínú wá sórí ẹni tí ń hu ìwà búburú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ sí: “olùgbẹ̀san fún ìbínú sí ẹni tí ń hu ìwà búburú.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: ìránṣẹ́
  rationale: Ó túmọ̀ sí ẹni tí ń ṣiṣẹ́ tàbí tí ń mú iṣẹ́ àṣẹ kan ṣẹ; níbí, aláṣẹ ń ṣiṣẹ́ gẹ́gẹ́ bí aṣojú Ọlọ́run, láìfi ìtumọ̀ sí ipò iṣẹ́ ìjọ kan pàtó.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: fún ire rẹ
  rationale: Ó sọ ète tàbí àbájáde tó jẹ́ àǹfààní fún ẹni tí a ń bá sọ̀rọ̀ ní Yorùbá àdánidá.
- source_word: τὸ κακὸν ποιῇς
  choice: bá ń ṣe ohun búburú
  rationale: Ó pa agbára ìwà búburú mọ́, ó sì jẹ́ ọ̀nà ìsọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: φοβοῦ
  choice: bẹ̀rù
  rationale: Ọ̀rọ̀ àṣẹ yìí fi hàn pé ó yẹ kí ẹni tó ń ṣe búburú bẹ̀rù ipa ìjìyà aláṣẹ.
- source_word: εἰκῇ
  choice: lásán
  rationale: ‘Kì í ṣe lásán’ túmọ̀ sí pé rírú idà náà ní ète àti ipa gidi, kì í ṣe ohun asán.
- source_word: μάχαιραν φορεῖ
  choice: ń ru idà
  rationale: Ó pa àwòrán idà gẹ́gẹ́ bí àmì agbára láti fìyà jẹ mọ́; ‘ru’ tún fi ìṣe lílo tàbí gbígbé e ní gbogbo ìgbà hàn.
- source_word: ἔκδικος
  choice: olùgbẹ̀san
  rationale: Ó mú ìtumọ̀ ẹni tó ń mú ìdájọ́ ẹ̀san ṣẹ jáde, láìdín un kù sí àlàyé àìní àwòrán.
- source_word: εἰς ὀργὴν
  choice: tí ń mú ìbínú wá
  rationale: Ó jẹ́ Yorùbá tó lọ́gbọ́n-ín, ó sì pa ìmọ̀ pé ìbínú yìí ní í ṣe pẹ̀lú ipa ìdájọ́ aláṣẹ mọ́ láìsọ ní pàtó pé ‘ìbínú Ọlọ́run.’
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: sórí ẹni tí ń hu ìwà búburú
  rationale: Ó fi ìṣe tó ń bá a lọ tàbí tó ń ṣe àfihàn ìwà ẹni náà hàn, gẹ́gẹ́ bí participle Gíríìkì náà.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé àti ìdí tó wà láàárín àwọn gbólóhùn mọ́.
theological_decisions:
- issue: Irú ìbáṣepọ̀ tí ipa ìjìyà aláṣẹ ní pẹ̀lú ìbínú Ọlọ́run
  choice: ‘tí ń mú ìbínú wá’ láìfi ‘Ọlọ́run’ kún ‘ìbínú’
  alternative: ‘tí ń mú ìbínú Ọlọ́run wá’ tàbí ‘tí ń mú ìjìyà ṣẹ’
  rationale: Àyíká ọ̀rọ̀ fi hàn pé aláṣẹ ń ṣiṣẹ́ gẹ́gẹ́ bí ìránṣẹ́ Ọlọ́run, ṣùgbọ́n Gíríìkì kò tún ‘Ọlọ́run’ sọ mọ́ ìbínú; ìtumọ̀ yìí pa àìṣe kedere náà àti ìdí ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. ‘Aláṣẹ’ mú olùdarí ìjọba inú àyíká ọ̀rọ̀ wá kedere; a pa àwòrán ‘idà’ mọ́. Àmì àlàyé [a] wà nínú ẹsẹ̀, ó sì tọ́ka sí ọ̀nà ìtumọ̀ tó sún mọ́ ìṣètò Gíríìkì jù.
