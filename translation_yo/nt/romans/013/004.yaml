revisions:
- from: Nítorí aláṣẹ jẹ́ ìránṣẹ́ Ọlọ́run fún ire rẹ. Ṣùgbọ́n bí o bá ń ṣe ohun búburú, bẹ̀rù, nítorí kì í ṣe lásán ni ó fi ń ru idà. Nítorí ìránṣẹ́ Ọlọ́run ni í ṣe, olùgbẹ̀san tí ń mú ìbínú wá sórí ẹni tí ń hu ìwà búburú.[a]
  to: Nítorí aláṣẹ jẹ́ ìránṣẹ́ Ọlọ́run fún rere rẹ. Ṣùgbọ́n bí o bá ń ṣe ohun búburú, bẹ̀rù, nítorí kì í ṣe lásán ni ó fi ń ru idà. Nítorí ìránṣẹ́ Ọlọ́run ni aláṣẹ jẹ́, olùgbẹ̀san tí ń mú ìbínú wá sórí ẹni tí ń hu ìwà búburú.[a]
  rationale: Àtúnṣe náà ṣe girama gbolóhùn ìkẹyìn ní kedere, ó sì yan ‘rere’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ‘good.’ Ó pa ìtumọ̀, ìtẹnumọ́, àwòrán idà, àti àìṣèkedere tí ó wà nípa ẹni tí ìbínú náà jẹ́ mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: διάκονος jẹ́ ìránṣẹ́, idà wà ní ipò rẹ̀, a sì ti pa ipa ìjìyà/ìbínú mọ́ láìfi ‘ìbínú Ọlọ́run’ kún un. ‘Tí ń mú ìbínú wá sórí’ jẹ́ ìtumọ̀ tó dáa fún ἔκδικος εἰς ὀργὴν, bí ó tilẹ̀ jẹ́ pé ó tú u sílẹ̀ díẹ̀ ju ìṣètò Gíríìkì lọ.'
  naturalness: 'Gbólóhùn kejì ní ìpèníjà girama: ‘Nítorí ìránṣẹ́ Ọlọ́run ni í ṣe’ kò dágbọ́n nínú Yorùbá ìgbàlódé nítorí ‘ni í ṣe’ máa ń tọ́ka sí ìṣe àṣà/habitual iṣẹ́. ‘Nítorí ìránṣẹ́ Ọlọ́run ni aláṣẹ jẹ́’ kedere, ó sì tún ìtẹnumọ́ Gíríìkì ṣe. ‘Fún rere rẹ’ jẹ́ ọ̀rọ̀ ìbílẹ̀ tí ó wọ́pọ̀ ju ‘fún ire rẹ’ lọ nínú àyíká yìí.'
  terminology: ‘Aláṣẹ,’ ‘ìránṣẹ́ Ọlọ́run,’ ‘idà,’ àti ‘olùgbẹ̀san’ bá àyíká ìjọba àti ìdájọ́ mu. A kò yẹ kí a rọ́pò ‘olùgbẹ̀san’ pẹ̀lú ọ̀rọ̀ tó máa mú ìtumọ̀ ẹ̀kọ́ ìsìn kan wọlé.
  issues:
  - severity: medium
    issue: Ìkọ́lé ‘Nítorí ìránṣẹ́ Ọlọ́run ni í ṣe’ kò pé ní girama.
    rationale: Ó lè dà bí pé ‘ó máa ń jẹ́ ìránṣẹ́ Ọlọ́run,’ dípò ìdánimọ̀ tí ἐστίν ń sọ. Fífi ‘aláṣẹ’ sílẹ̀ gẹ́gẹ́ bí kókó-ọrọ̀ mú un kedere.
  - severity: low
    issue: ‘Fún ire rẹ’ kì í ṣe aṣiṣe, ṣùgbọ́n ‘fún rere rẹ’ dára síi ní ọ̀rọ̀ Yorùbá àdánidá.
    rationale: ‘Rere’ ni ọ̀rọ̀ tí ó wọ́pọ̀ fún ἀγαθόν nínú ìkọ́lé ‘fún ... rere’.
  revised_text: Nítorí aláṣẹ jẹ́ ìránṣẹ́ Ọlọ́run fún rere rẹ. Ṣùgbọ́n bí o bá ń ṣe ohun búburú, bẹ̀rù, nítorí kì í ṣe lásán ni ó fi ń ru idà. Nítorí ìránṣẹ́ Ọlọ́run ni aláṣẹ jẹ́, olùgbẹ̀san tí ń mú ìbínú wá sórí ẹni tí ń hu ìwà búburú.[a]
