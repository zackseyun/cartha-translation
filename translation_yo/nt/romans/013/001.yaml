id: ROM.13.1
reference: Romans 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: yo
  text: Kí olúkúlùkù tẹríba fún àwọn aláṣẹ tí ń ṣàkóso[a], nítorí kò sí àṣẹ kankan bí kò ṣe láti ọ̀dọ̀ Ọlọ́run; àwọn aláṣẹ tí ó sì wà ni Ọlọ́run ti tò sí ipò wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘àwọn aláṣẹ gíga,’ tàbí ‘àwọn aláṣẹ tí ó ga jù.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘ni Ọlọ́run ti fi lélẹ̀,’ tàbí ‘ni Ọlọ́run ti ṣètò.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: olúkúlùkù
  rationale: Ọ̀rọ̀ náà túmọ̀ ní ti gidi sí ‘olúkúlùkù ọkàn,’ ṣùgbọ́n ní Gíríìkì Koiné ó jẹ́ ọ̀nà àdánidá láti tọ́ka sí olúkúlùkù ènìyàn. ‘Olúkúlùkù’ mú agbára pínpín πᾶσα jáde ní Yorùbá àdánidá láì dá èrò pàtó kan nípa ẹ̀dá ọkàn sílẹ̀.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: àwọn aláṣẹ tí ń ṣàkóso
  rationale: ἐξουσίαις tọ́ka sí àwọn tí wọ́n ní àṣẹ, ὑπερεχούσαις sì ṣàpèjúwe wọn gẹ́gẹ́ bí àwọn tí ó wà ní ipò àṣẹ lókè àwọn ẹlòmíràn. Gbólóhùn yìí fi iṣẹ́ ìṣàkóso wọn hàn ní Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ ‘gíga’ tàbí ‘tí ó ga jù’ mọ́.
- source_word: ὑποτασσέσθω
  choice: kí ... tẹríba fún
  rationale: Àṣẹ ìsinsìnyí náà ń pè fún jíjẹ́ ẹni tí ó wà lábẹ́ ètò àṣẹ. ‘Tẹríba fún’ jẹ́ Yorùbá tí ó ṣe kedere, tí kò sì fi ìtumọ̀ àfikún sí i pé a gbọdọ̀ fọwọ́ sí gbogbo ohun tí aláṣẹ bá ṣe.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: nítorí kò sí àṣẹ kankan bí kò ṣe láti ọ̀dọ̀ Ọlọ́run
  rationale: ‘Láti ọ̀dọ̀ Ọlọ́run’ fi Ọlọ́run hàn gẹ́gẹ́ bí orísun àṣẹ, ó sì pa ìtumọ̀ ὑπὸ θεοῦ mọ́ láì ṣàlàyé rẹ̀ kọjá ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: αἱ δὲ οὖσαι
  choice: àwọn aláṣẹ tí ó sì wà
  rationale: Ọ̀rọ̀ arọ́pò abo ọ̀pọ̀ yìí ń tọ́ka padà sí ἐξουσίαις. Ṣíṣe ‘àwọn aláṣẹ’ ní kedere lẹ́ẹ̀kan sí i yọ ìdàrúdàpọ̀ kúrò ní Yorùbá.
- source_word: τεταγμέναι
  choice: ti tò sí ipò wọn
  rationale: Perfect passive τάσσω fi ipò tí ó jẹ́ àbájáde ìtòlẹ́sẹẹsẹ Ọlọ́run hàn. ‘Ti tò sí ipò wọn’ pa èrò ìṣètò tàbí fífi sí ipò mọ́, láì sọ pé Ọlọ́run fọwọ́ sí gbogbo ìṣe wọn.
theological_decisions:
- issue: Ìwọ̀n àti agbára ọ̀rọ̀ Paulu nípa àwọn aláṣẹ ìjọba àti Ọlọ́run
  choice: Ẹsẹ náà sọ pé àṣẹ àwọn olùṣàkóso wá láti ọ̀dọ̀ Ọlọ́run, àti pé àwọn aláṣẹ tí ó wà dúró nínú ètò tí Ọlọ́run ti tò.
  alternative: A lè kà á bí ẹni pé Ọlọ́run fọwọ́ sí gbogbo ìjọba àti gbogbo ìṣe olùṣàkóso; tàbí bí ẹni pé Paulu ń sọ̀rọ̀ nípa àṣẹ gẹ́gẹ́ bí ìlànà lásán, kì í ṣe nípa àwọn aláṣẹ gidi.
  rationale: Gíríìkì ń sọ ní pàtó nípa àwọn aláṣẹ tí ó wà, ó sì lo τεταγμέναι fún ipò tí ìtòlẹ́sẹẹsẹ Ọlọ́run mú wá. Ìtumọ̀ náà pa ìdánilójú yìí mọ́, ṣùgbọ́n kò fi àfikún sí i pé gbogbo ìṣe ìjọba jẹ́ ohun tí Ọlọ́run tẹ́wọ́ gbà.
translation_notes:
  register: A lo Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. ‘Tẹríba fún’ àti ‘tò sí ipò wọn’ pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ Gíríìkì mọ́ láì mú un le ju tàbí rọ̀ ju.
