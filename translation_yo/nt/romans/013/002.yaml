id: ROM.13.2
reference: Romans 13:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: yo
  text: Nítorí náà, ẹni tí ó ń kọjú ìjà sí ọlá-àṣẹ náà ti kọjú ìjà sí ìṣètò Ọlọ́run[a]; àwọn tí wọ́n sì ti kọjú ìjà sí i yóò fa ìdájọ́ wá sórí ara wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ètò Ọlọ́run” tàbí “ètò tí Ọlọ́run gbé kalẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìṣètò, ìlànà, tàbí ohun tí a ti gbé kalẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “ìdájọ́” sí “ìdálẹ́bi” tàbí “gbolohun ìdájọ́”; ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò mú kí ó di dandan pé ìdálẹ́bi ìkẹyìn ni níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó ń fi àbájáde ọ̀rọ̀ ẹsẹ̀ tó ṣáájú hàn ní ọ̀nà tó ṣe déédéé, tó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: ὁ ἀντιτασσόμενος
  choice: ẹni tí ó bá ń kọjú ìjà sí
  rationale: Ó mú iṣẹ́ participle tó ń tọ́ka sí ẹnikẹ́ni tó ń ṣe àtakò jáde, ó sì fi ìṣe àtakò tó ń bá a lọ hàn.
- source_word: τῇ ἐξουσίᾳ
  choice: ọlá-àṣẹ náà
  rationale: Ọ̀rọ̀ náà tọ́ka padà sí ọlá-àṣẹ ìjọba nínú ẹsẹ̀ tó ṣáájú; “náà” pa ìtọ́kasí yẹn mọ́ láì fi àlàyé míì kún un.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: ètò tí Ọlọ́run gbé kalẹ̀
  rationale: διαταγή lè túmọ̀ sí ètò, ìṣètò, tàbí ohun tí a là kalẹ̀. Gbólóhùn yìí mú èrò ohun tí Ọlọ́run ṣètò tàbí gbé kalẹ̀ jáde láì sọ ọ́ di àṣẹ pàtó kan.
- source_word: ἀνθέστηκεν
  choice: ti kọjú ìjà sí
  rationale: Àmì àsìkò perfect ń fi ìṣe tí a ti ṣe, tí ipa rẹ̀ sì ṣì wà hàn; “ti” ṣe iṣẹ́ yìí ní Yorùbá, bí àtúnsọ ọ̀rọ̀ náà ṣe tún pa ìbáṣepọ̀ rẹ̀ mọ́ apá àkọ́kọ́.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: àwọn tí wọ́n sì ti kọjú ìjà sí i
  rationale: Ó pa ìfararora mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú, “sí i” sì jẹ́ kí ohun tí wọ́n kọjú ìjà sí, èyí tí àyíká ọ̀rọ̀ ti sọ, ṣe kedere ní Yorùbá.
- source_word: ἑαυτοῖς
  choice: lé ara wọn
  rationale: Ó fi hàn pé àbájáde ìṣe náà yóò padà dé bá àwọn alátakò fúnra wọn.
- source_word: κρίμα
  choice: ìdájọ́
  rationale: “Ìdájọ́” pa ìtumọ̀ gbígbòòrò κρίμα mọ́, láì fi dandan sọ pé ó jẹ́ ìdálẹ́bi ìkẹyìn.
- source_word: λήμψονται
  choice: yóò gba
  rationale: Ó túmọ̀ ọ̀rọ̀ ọjọ́ iwájú náà ní tààràtà, ó sì bá lílo “gba ìdájọ́” mu ní Yorùbá.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ κρίμα
  choice: ìdájọ́
  alternative: ìdálẹ́bi; gbolohun ìdájọ́
  rationale: Ẹsẹ̀ náà kìlọ̀ pé àwọn alátakò yóò gba ìdájọ́, ṣùgbọ́n kò sọ ní pàtó pé ìdálẹ́bi ayérayé ni. “Ìdájọ́” pa àìmọ̀ pàtó yìí mọ́.
- issue: Ohun tí ἐξουσία ń tọ́ka sí
  choice: ọlá-àṣẹ náà, tí àyíká ọ̀rọ̀ fi hàn pé ó jẹ́ ọlá-àṣẹ ìjọba
  alternative: ọlá-àṣẹ ní ìtumọ̀ gbígbòòrò
  rationale: Róòmù 13:1 ń sọ̀rọ̀ nípa àwọn aláṣẹ tó ń ṣàkóso. Bí ó tilẹ̀ jẹ́ pé a lóye ọ̀rọ̀ náà gẹ́gẹ́ bí ọlá-àṣẹ ìjọba, a kò fi “ìjọba” kún ara ẹsẹ̀, kí ìtumọ̀ ọ̀rọ̀ Gíríìkì má bàa dín kù ju bó ṣe yẹ lọ.
- issue: Ìbáṣepọ̀ ọlá-àṣẹ pẹ̀lú ètò Ọlọ́run
  choice: àtakò sí ọlá-àṣẹ náà jẹ́ àtakò sí ètò tí Ọlọ́run gbé kalẹ̀
  alternative: àtakò sí gbogbo ìṣe ẹnì kọ̀ọ̀kan tó bá jẹ́ aláṣẹ jẹ́ àtakò sí Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì so ọlá-àṣẹ pọ̀ mọ́ ìṣètò Ọlọ́run, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ kò sọ pé gbogbo ìṣe aláṣẹ kọ̀ọ̀kan ni Ọlọ́run fọwọ́ sí. A kò fi ìtumọ̀ tó gbòòrò bẹ́ẹ̀ kún un.
translation_notes:
  register: A lo Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Kọjú ìjà sí” jẹ́ ọ̀nà àdánidá láti sọ àtakò tó lágbára; “ètò tí Ọlọ́run gbé kalẹ̀” sì yẹra fún èdè òfin tó le ju ìtumọ̀ διαταγή lọ. A fi àmì ohùn sí ibi tí ó yẹ.
