  to: Nítorí náà, ẹni tí ó ń kọjú ìjà sí ọlá-àṣẹ náà ti kọjú ìjà sí ìṣètò Ọlọ́run[a]; àwọn tí wọ́n sì ti kọjú ìjà sí i yóò fa ìdájọ́ wá sórí ara wọn[b].
