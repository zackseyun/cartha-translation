id: ROM.13.14
reference: Romans 13:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ wọ Olúwa Jésù Mèsáyà, ẹ má sì ṣe ìpèsè fún ara[a] láti tẹ́ àwọn ìfẹ́kúfẹ̀ẹ́ rẹ̀ lọ́rùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘ìwà ẹlẹ́ṣẹ̀.’ Ọ̀rọ̀ Gíríìkì náà ní ‘ara’ ní tààrà; Páùlù sábà máa ń lò ó fún àwọn ìtẹ̀sí ènìyàn tí ẹ̀ṣẹ̀ ti bà jẹ́, ní ìyàtọ̀ sí ìgbésí ayé tí Ọlọ́run ń darí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: ẹ fi … wọ ara yín
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn, ó sì lo àwòrán wíwọ aṣọ. Gbólóhùn Yorùbá yìí pa àwòrán náà mọ́, ó sì fi hàn pé kí ìgbésí ayé àti ìdánimọ̀ wọn jẹ́ ti Olúwa Jésù.
- source_word: κύριον
  choice: Olúwa
  rationale: Níhìn-ín, ọ̀rọ̀ náà jẹ́ oyè Jésù, ó sì ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó yẹ kí ó dúró.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Ọ̀rọ̀ Gíríìkì náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, kì í ṣe bí orúkọ ìdílé; ‘Mèsáyà’ mú ìtumọ̀ ẹni tí a fòróró yàn jáde.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: ẹ má sì ṣe ìpèsè
  rationale: Àpapọ̀ ọ̀rọ̀ yìí túmọ̀ sí kí wọ́n má ṣe ronú ṣáájú tàbí ṣètò ohun tí yóò mú ohun tí ó tẹ̀ lé ṣẹ.
- source_word: σάρξ
  choice: ara
  rationale: ‘Ara’ pa àwòrán àti àìdánilójú ọ̀rọ̀ Páùlù mọ́ dípò kí ó fi ìtumọ̀ ‘ìwà ẹlẹ́ṣẹ̀’ sí i ní pàtó.
- source_word: εἰς ἐπιθυμίας
  choice: láti tẹ́ àwọn ìfẹ́kúfẹ̀ẹ́ rẹ̀ lọ́rùn
  rationale: Gbólóhùn yìí sọ ète tàbí àbájáde ìpèsè náà ní Yorùbá tó ṣe kedere, nígbà tí ‘rẹ̀’ ń tọ́ka padà sí ‘ara’.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ ìwà rere Páùlù
  choice: ara
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí àwọn ìfẹ́ ènìyàn tí ẹ̀ṣẹ̀ ti yí padà, ṣùgbọ́n ‘ìwà ẹlẹ́ṣẹ̀’ lè dín àwòrán Páùlù kù, kí ó sì pinnu ẹ̀kọ́ níbi tí ọ̀rọ̀ Gíríìkì ti ní àyè ìtumọ̀ tó gbòòrò. Nítorí náà, ọ̀rọ̀ pàtàkì pa ‘ara’ mọ́, àlàyé ìsàlẹ̀ sì mẹ́nu kan ìtumọ̀ mìíràn.
translation_notes:
  register: Yorùbá àgbàlágba òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àṣẹ ‘ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ. A pa àwòrán wíwọ aṣọ àti ìforígbárí ẹ̀kọ́ inú ‘ara’ mọ́, ṣùgbọ́n a mú ìbáṣepọ̀ εἰς ἐπιθυμίας ṣe kedere ní ọ̀nà Yorùbá àdánidá.
