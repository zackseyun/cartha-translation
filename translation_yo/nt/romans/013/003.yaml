id: ROM.13.3
reference: Romans 13:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: yo
  text: Nítorí àwọn alákòóso kì í ṣe ohun ìbẹ̀rù fún ìwà rere,[a] bí kò ṣe fún ìwà búburú. Ṣùgbọ́n ṣé o fẹ́ láti má bẹ̀rù aláṣẹ?[b] Máa ṣe ohun rere, ìwọ yóò sì gba ìyìn láti ọ̀dọ̀ rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún iṣẹ́ rere … fún ohun búburú.” Gíríìkì fi ohun rere àti ohun búburú wéra ní ti ìwà ní gbogbogbòò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ǹjẹ́ o fẹ́ má bẹ̀rù aláṣẹ?”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, láti ọ̀dọ̀ aláṣẹ ìjọba.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρχοντες
  choice: àwọn alákòóso
  rationale: Ó tọ́ka sí àwọn tí wọ́n ń ṣàkóso tàbí tí wọ́n wà ní ipò ìjọba; ọ̀rọ̀ yìí bójú mu ọ̀rọ̀ ìṣèlú inú àyíká ẹsẹ náà láì sọ irú ipò pàtó kan.
- source_word: φόβος
  choice: ohun ìbẹ̀rù
  rationale: Orúkọ àpèjúwe yìí túmọ̀ sí ohun tàbí ẹni tí ó ń fa ẹ̀rù; ‘ohun ìbẹ̀rù’ jẹ́ Yorùbá àdánidá tí ó pa agbára gbólóhùn Gíríìkì mọ́.
- source_word: τῷ ἀγαθῷ ἔργῳ ... τῷ κακῷ
  choice: fún ìwà rere ... fún ìwà búburú
  rationale: Bí ó tilẹ̀ jẹ́ pé ἔργῳ wà ní ẹyọ kan, ìlò rẹ̀ jẹ́ ti ìwà rere ní gbogbogbòò; ìṣọ̀kan ‘ìwà rere/ìwà búburú’ mú ìtakora ọ̀rọ̀ náà hàn ní kedere.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Ǹjẹ́ o fẹ́ má bẹ̀rù
  rationale: Èyí pa ìrísí ìbéèrè àsọyé inú Gíríìkì mọ́, dípò yíyí i padà sí gbólóhùn oní ‘bí’.
- source_word: ἐξουσίαν
  choice: aláṣẹ
  rationale: Nínú àyíká yìí, ó tọ́ka sí àṣẹ ìjọba tí a ń sọ di ẹni tí ó di ipò náà mú; ‘aláṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ẹyọ kan mọ́.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Máa ṣe ohun rere
  rationale: Àṣẹ ìsinsìnyí lè ní ìtumọ̀ ìṣe tí ń bá a lọ; ‘máa ṣe ohun rere’ fi ẹ̀ka ìwà rere gbogbogbòò hàn.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: ìwọ yóò sì rí ìyìn gbà láti ọ̀dọ̀ rẹ̀
  rationale: ‘Rí ìyìn gbà’ jẹ́ Yorùbá tí ó ṣeé lóye fún níní tàbí gbígba ìyìn; ‘rẹ̀’ padà tọ́ka sí aláṣẹ.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn Paulu nípa àwọn alákòóso àti ìyìn
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí àlàyé ipa tí ìjọba yẹ kí ó máa kó ní ọ̀nà àdánidá, láì sọ ọ́ di ẹ̀kọ́ pé gbogbo alákòóso máa ń ṣe bẹ́ẹ̀ nígbà gbogbo.
  alternative: Kí a túmọ̀ ọ́ bí ìlérí tí kò ní ààlà nípa gbogbo alákòóso, tàbí bí ọ̀rọ̀ ẹ̀gàn.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ipa àwọn alákòóso ní tààrà; kò ní àmì pé ó jẹ́ ẹ̀gàn, bẹ́ẹ̀ ni ìtumọ̀ kò gbọ́dọ̀ mú ìjà-ẹ̀sìn tó wà nínú gbólóhùn náà kúrò.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé gbogbogbòò. Ìbéèrè àsọyé inú orísun ni a pa mọ́, a sì lo ‘aláṣẹ’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún àṣẹ ìjọba.
