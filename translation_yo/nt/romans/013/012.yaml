id: ROM.13.12
reference: Romans 13:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: yo
  text: Òru ti fẹ́rẹ̀ẹ́ kọjá[a], ọjọ́ sì ti súnmọ́. Nítorí náà, ẹ jẹ́ kí a bọ́ àwọn iṣẹ́ òkùnkùn sílẹ̀, kí a sì wọ ìhámọ́ra[b] ìmọ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Òru ti tẹ̀ síwájú.” Ọ̀rọ̀ Gíríìkì náà fi òru hàn bí ohun tí ó ti lọ síwájú, ìyẹn ni pé apá púpọ̀ rẹ̀ ti kọjá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ohun ìjà ìmọ́lẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ νὺξ
  choice: Òru
  rationale: A túmọ̀ ọ́ ní tààrà láti pa àkàwé àkókò mọ́, ní ìyàtọ̀ sí ‘ọjọ́’; a kò sọ ọ́ di ‘òkùnkùn’ nítorí σκότος tún wà lẹ́yìn rẹ̀.
- source_word: προέκοψεν
  choice: ti lọ jìnnà síwájú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé òru ti tẹ̀ síwájú dé ibi púpọ̀, ìyẹn pé ó ti fẹ́rẹ̀ẹ́ kọjá; gbólóhùn yìí pa àwòrán ìlọsíwájú inú Gíríìkì mọ́.
- source_word: ἡ ἡμέρα
  choice: ọjọ́
  rationale: A pa ọ̀rọ̀ àkàwé náà mọ́ ní tààrà, kí ìyàtọ̀ rẹ̀ sí ‘òru’ lè dúró.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Perfect Gíríìkì ń tọ́ka sí ohun tí ó ti súnmọ́ tí ó sì wà ní ipò ìsúnmọ́ nísinsìnyí; ‘ti sún mọ́lé’ jẹ́ ọ̀nà Yorùbá tó ṣeé lóye fún èyí.
- source_word: ἀποβαλώμεθα
  choice: ẹ jẹ́ kí a bọ́ ... sílẹ̀
  rationale: Ìpè àjọṣe ni subjunctive náà; ‘bọ́ ... sílẹ̀’ pa àwòrán yiyọ aṣọ mọ́, ó sì bá ‘wọ̀’ mu.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: ‘Iṣẹ́’ jẹ́ ìtumọ̀ àdánidá fún ἔργα, ó sì pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: τοῦ σκότους
  choice: òkùnkùn
  rationale: A pa genitive àti àkàwé ìwà rere/ìwà búburú mọ́ láì túmọ̀ ọ́ ní gbangba sí ‘ìwà búburú.’
- source_word: ἐνδυσώμεθα
  choice: kí a sì ... wọ̀
  rationale: Ìpè àjọṣe ni; ‘wọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó bá àwòrán aṣọ mu, ó sì dúró ní ìbámu pẹ̀lú ‘bọ́ ... sílẹ̀.’
- source_word: τὰ ὅπλα
  choice: ìhámọ́ra
  rationale: Ὅπλα lè túmọ̀ sí ohun ìjà tàbí ohun èlò ogun; pẹ̀lú ọ̀rọ̀ ‘wọ̀,’ ‘ìhámọ́ra’ dára jù fún ohun èlò ogun tí a wọ̀, láì dín àwòrán ogun kù sí ohun ìkọlù nìkan.
- source_word: τοῦ φωτός
  choice: ìmọ́lẹ̀
  rationale: A pa àkàwé ìmọ́lẹ̀ mọ́ ní tààrà, ní ìyàtọ̀ sí òkùnkùn.
theological_decisions:
- issue: Àkàwé nípa òru àti ọjọ́ tó ní ìtumọ̀ ọjọ́ ìkẹyìn
  choice: A fi ‘òru’ àti ‘ọjọ́’ sílẹ̀ gẹ́gẹ́ bí àkàwé inú ẹsẹ náà.
  alternative: ‘Ayé òkùnkùn yìí ti fẹ́rẹ̀ẹ́ dópin; ọjọ́ tuntun ti súnmọ́.’
  rationale: Àkàwé náà ní agbára àkókò, ìwà rere àti ìtàn ìgbàlà lẹ́ẹ̀kan náà. Ìtúmọ̀ tó ṣàlàyé rẹ̀ jù bẹ́ẹ̀ lọ yóò yan ìtumọ̀ kan dípò pípa ìfọ̀rọ̀wérọ̀ náà mọ́.
- issue: Ìtumọ̀ ὅπλα τοῦ φωτός
  choice: ‘ìhámọ́ra ìmọ́lẹ̀’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘àwọn ohun ìjà ìmọ́lẹ̀.’
  rationale: Ọ̀rọ̀-ìṣe ‘wọ̀’ ń ti ìtumọ̀ ohun èlò ogun tí a wọ̀ lẹ́yìn, ṣùgbọ́n ὅπλα lè túmọ̀ sí ohun ìjà pẹ̀lú; nítorí náà a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àkọ́tọ́ tó pé pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì yẹ fún kíkà ní gbangba. ‘Ẹ jẹ́ kí a’ jẹ́ ìpè àjọṣe tó wọ́pọ̀, ‘bọ́ ... sílẹ̀ / wọ̀’ sì pa àwòrán aṣọ méjèèjì mọ́.
