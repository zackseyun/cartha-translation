    rationale: “Gbèsè kankan” ni ìsopọ̀ tó wọ́pọ̀ jù nínú Yorùbá fún ìfòfindè “owe no one anything,” ó sì pa ìfaramọ́ ìfòfindè gbogbo rẹ̀ mọ́.
