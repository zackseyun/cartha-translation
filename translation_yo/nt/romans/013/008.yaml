id: ROM.13.8
reference: Romans 13:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: yo
  text: Ẹ má ṣe jẹ ẹnikẹ́ni ní gbèsè kankan, bí kò ṣe láti nífẹ̀ẹ́ ara yín; nítorí ẹni tí ó nífẹ̀ẹ́ ẹlòmíràn[a] ti mú òfin ṣẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ẹni òmíràn.” Ní Gíríìkì: “ẹni òmíràn náà” (“the other”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Ẹ má ṣe jẹ ẹnikẹ́ni ní gbèsè ohunkóhun
  rationale: Èyí mú ìfòfindè tó péye nínú ọ̀rọ̀ Gíríìkì—‘má ṣe jẹ ẹnikẹ́ni ní ohunkóhun’—wá sí Yorùbá àdánidá, ó sì pa àwòrán gbèsè tàbí ojúṣe mọ́.
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: bí kò ṣe láti nífẹ̀ẹ́ ara yín
  rationale: ‘Bí kò ṣe’ fi ìyọkúrò kan ṣoṣo hàn, ‘ara yín’ sì gbé ìtumọ̀ àpapọ̀ ἀλλήλους jáde láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: nítorí ẹni tí ó nífẹ̀ẹ́
  rationale: Àyọkà yìí pa agbára ẹni-aṣojú tó wà nínú participle olórúkọ mọ́, ó sì jẹ́ Yorùbá tó mọ́gbọ́n dání.
- source_word: τὸν ἕτερον
  choice: ẹlòmíràn
  rationale: ‘Ẹlòmíràn’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ẹni òmíràn’ tàbí ‘the other,’ láìyí i sí ‘aládùúgbò,’ èyí tí kò fara hàn ní kedere nínú gbólóhùn yìí.
- source_word: νόμον πεπλήρωκεν
  choice: ti mú òfin ṣẹ
  rationale: Ọ̀rọ̀ yìí jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún pípa tàbí mímú ohun tí òfin ń béèrè ṣẹ; ‘ti’ tún fi ipò àbájáde perfect tense hàn ní ti ẹ̀dá.
theological_decisions:
- issue: Ìwọ̀n ìfòfindè Pọ́ọ̀lù nípa gbèsè
  choice: Túmọ̀ ọ́ gẹ́gẹ́ bí ìfòfindè tààrà lórí jíjẹ ẹlòmíràn ní gbèsè, pẹ̀lú ìyọkúrò ti ojúṣe ìfẹ́ ara ẹni.
  alternative: Kà á sí ìfòfindè pátápátá lórí gbogbo yíyá owó, tàbí sí àkàwé nípa ojúṣe ìwà rere nìkan.
  rationale: Gbólóhùn Gíríìkì fúnra rẹ̀ lo èdè gbèsè, ó sì fi ìfẹ́ hàn gẹ́gẹ́ bí ìyọkúrò. Ìtumọ̀ kò gbọ́dọ̀ dá àríyànjiyàn ìwà rere tó gbooro sí i parí níbi tí ẹsẹ náà kò ti ṣe bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, a sì pa àwòrán gbèsè àti ìdíwọ̀n ẹ̀kọ́ ìsìn inú orísun mọ́.
