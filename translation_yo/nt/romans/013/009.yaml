- from: Nítorí àwọn òfin wọ̀nyí pé, “Ìwọ kò gbọdọ̀ ṣe panṣágà; ìwọ kò gbọdọ̀ pànìyàn[a]; ìwọ kò gbọdọ̀ jalè; ìwọ kò gbọdọ̀ ṣe ojúkòkòrò,” àti bí òfin mìíràn bá wà, a ṣàkópọ̀ rẹ̀ sínú ọ̀rọ̀ yìí[b] pé, “Ìwọ yóò nífẹ̀ẹ́ aládùúgbò rẹ bí ara rẹ.”
  to: Nítorí pé, “Ìwọ kò gbọdọ̀ ṣe panṣágà; ìwọ kò gbọdọ̀ pànìyàn[a]; ìwọ kò gbọdọ̀ jalè; ìwọ kò gbọdọ̀ ṣe ojúkòkòrò,” àti bí òfin mìíràn bá wà, a ṣàkópọ̀ rẹ̀ sínú ọ̀rọ̀ yìí[b] pé, “Ìwọ yóò nífẹ̀ẹ́ aládùúgbò rẹ bí ara rẹ.”
