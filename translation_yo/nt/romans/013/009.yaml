id: ROM.13.9
reference: Romans 13:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: yo
  text: Nítorí pé, “Ìwọ kò gbọdọ̀ ṣe panṣágà; ìwọ kò gbọdọ̀ pànìyàn[a]; ìwọ kò gbọdọ̀ jalè; ìwọ kò gbọdọ̀ ṣe ojúkòkòrò,” àti bí òfin mìíràn bá wà, a ṣàkópọ̀ rẹ̀ sínú ọ̀rọ̀ yìí[b] pé, “Ìwọ yóò nífẹ̀ẹ́ aládùúgbò rẹ bí ara rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pànìyàn” túmọ̀ sí pípa ènìyàn lọ́nà tí kò bófin mu; ọ̀rọ̀ Gíríìkì náà kò tọ́ka sí gbogbo irú pípa.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “a ṣàkópọ̀ rẹ̀ sínú gbólóhùn yìí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọ̀rọ̀,” “gbólóhùn,” tàbí “àsọjáde” ní àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Nítorí àwọn òfin wọ̀nyí pé
  rationale: Àpilẹ̀kọ aláìlẹ́gbẹ́ τὸ pẹ̀lú γάρ ń ṣí àkóónú àwọn òfin tí a ń sọ̀rọ̀ nípa wọn sílẹ̀. Gbólóhùn Yorùbá yìí mú ipa àlàyé náà hàn lọ́nà àdánidá.
- source_word: μοιχεύσεις
  choice: ìwọ kò gbọdọ̀ ṣe panṣágà
  rationale: Ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ nínú àyọlò Òfin Mẹ́wàá; “kò gbọdọ̀” pa ìrísí àṣẹ-ofin mọ́.
- source_word: φονεύσεις
  choice: ìwọ kò gbọdọ̀ pànìyàn
  rationale: φονεύω túmọ̀ sí pípa ènìyàn lọ́nà tí kò bófin mu, kì í ṣe gbogbo irú pípa; “pànìyàn” ló péye jù lọ.
- source_word: κλέψεις
  choice: ìwọ kò gbọdọ̀ jalè
  rationale: Ó pa àṣẹ ìdènà inú Òfin Mẹ́wàá mọ́ ní Yorùbá òde òní.
- source_word: ἐπιθυμήσεις
  choice: ìwọ kò gbọdọ̀ ṣe ojúkòkòrò
  rationale: Nínú àyíká Òfin Mẹ́wàá, ἐπιθυμέω jẹ́ ìfẹ́ ohun ẹlòmíràn lọ́nà ojúkòkòrò, kì í ṣe ìfẹ́ tàbí ìfẹ́kúfẹ̀ẹ́ gbogbo.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: bí òfin mìíràn bá wà
  rationale: Ó pa ipò àìdájú εἴ τις àti ìtumọ̀ “mìíràn” ti ἑτέρα mọ́ lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἀνακεφαλαιοῦται
  choice: a ṣàkópọ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkó àwọn nǹkan jọ sábẹ́ àkòrí tàbí gbólóhùn kan; “ṣàkópọ̀” ṣe kedere ní Yorùbá.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: sínú ọ̀rọ̀ yìí
  rationale: λόγος níbí tọ́ka sí gbólóhùn tàbí ọ̀rọ̀ tí ó ṣàkópọ̀ òfin; “ọ̀rọ̀” pa ìbú àti ìwúwo ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Ἀγαπήσεις
  choice: Ìwọ yóò nífẹ̀ẹ́
  rationale: A pa fọ́ọ̀mù ọjọ́ iwájú tí ó ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ nínú àyọlò Léfítíkù mọ́.
- source_word: πλησίον
  choice: aládùúgbò
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ẹni tí ó sún mọ́ni tàbí ẹnìkejì ẹni, ó sì pa ìsopọ̀ pẹ̀lú Léfítíkù mọ́.
- source_word: ὡς σεαυτόν
  choice: bí ara rẹ
  rationale: Ó tẹ̀lé àfiwé kúkúrú Gíríìkì láìfi àlàyé tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìrísí àwọn àṣẹ ìdènà tí a fa yọ láti inú Òfin Mẹ́wàá
  choice: “Ìwọ kò gbọdọ̀ ...” gẹ́gẹ́ bí àṣẹ májẹ̀mú
  alternative: “Má ṣe ...” gẹ́gẹ́ bí àṣẹ tààrà
  rationale: Gíríìkì lo ọ̀rọ̀ ọjọ́ iwájú ní ìrísí àyọlò Ìwé Mímọ́. “Ìwọ kò gbọdọ̀” pa ìsopọ̀ pẹ̀lú Òfin Mẹ́wàá mọ́, síbẹ̀ ó ṣe kedere ní Yorùbá.
- issue: Ìbú ìtumọ̀ λόγος nínú ἐν τῷ λόγῳ τούτῳ
  choice: “ọ̀rọ̀” gẹ́gẹ́ bí gbólóhùn àkópọ̀
  alternative: “gbólóhùn” tàbí “àsọjáde”
  rationale: Pọ́ọ̀lù kò ń tọ́ka sí ọ̀rọ̀ kan ṣoṣo, bí kò ṣe sí àyọlò Ìwé Mímọ́ tí ó tẹ̀ lé e. “Ọ̀rọ̀” pa ìbú ìtumọ̀ náà mọ́, àyíká sì mú un ṣe kedere.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé lásán. A lo “kò gbọdọ̀” fún ìrísí àṣẹ-ofin, “yóò nífẹ̀ẹ́” sì pa ìrísí àyọlò Léfítíkù mọ́.
