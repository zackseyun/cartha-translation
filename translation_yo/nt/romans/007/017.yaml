source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí, kì í ṣe èmi mọ́ ni mo ń ṣe é[a], bí kò ṣe ẹ̀ṣẹ̀ tí ń gbé inú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi kọ́ mọ́ ni ó ń ṣe é, bí kò ṣe ẹ̀ṣẹ̀ tí ń gbé inú mi.”
    reason: Àṣàyàn ìṣètò ọ̀rọ̀ mìíràn tó tún pa ìtẹnumọ́ Gíríìkì lórí ‘èmi’ mọ́.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n nísinsin yìí
  rationale: Ó fi ìyípadà àkókò àti ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: οὐκέτι ἐγὼ
  choice: kì í ṣe èmi mọ́
  rationale: Àkọ́lé yìí pa ìtẹnumọ́ tó wà lórí ἐγὼ mọ́, ó sì tú οὐκέτι sí ‘mọ́’ lọ́nà tó ṣe kedere.
- source_word: κατεργάζομαι αὐτὸ
  choice: ni mo ń ṣe é
  rationale: ‘Ṣe é’ tọ́ka padà sí ìṣe tí a ti sọ̀rọ̀ rẹ̀, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ ṣíṣe tàbí mímú ìṣe náà ṣẹ.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Nínú ìṣètò gbólóhùn yìí, ‘bí kò ṣe’ ń fi ohun tí Pọ́ọ̀lù gbé rópò ‘èmi’ hàn ní kedere.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: ẹ̀ṣẹ̀ tí ń gbé inú mi
  rationale: Ó pa àwòrán ẹ̀ṣẹ̀ bí ohun tó ń gbé inú ẹni mọ́, láìsọ àwòrán náà di ọ̀rọ̀ mìíràn.
theological_decisions:
- issue: Ìyàtọ̀ líle tí Pọ́ọ̀lù ṣe láàárín ‘èmi’ àti ‘ẹ̀ṣẹ̀ tí ń gbé inú mi’ lè dà bí ẹni pé ó ń yẹra fún ojúṣe.
  choice: A pa ìyàtọ̀ náà mọ́ gẹ́gẹ́ bí Gíríìkì ṣe gbé e kalẹ̀.
  alternative: Ṣíṣe àlàyé sí i pé ìjà inú ọkàn nìkan ni, tàbí fífi ọ̀rọ̀ kún un láti tẹnumọ́ ojúṣe ẹni.
  rationale: Ẹsẹ náà fúnra rẹ̀ fi ìforígbárí ẹ̀kọ́ yìí sílẹ̀; kò yẹ kí ìtumọ̀ tú u tàbí yanju rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
