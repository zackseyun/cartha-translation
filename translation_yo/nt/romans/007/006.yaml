id: ROM.7.6
reference: Romans 7:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsìnyí a ti tú wa sílẹ̀ kúrò nínú òfin,[a] níwọ̀n bí a ti kú sí ohun tí ó ń dì wá mú, kí a lè sìn ní ìtuntun ti Ẹ̀mí,[b] kì í sì í ṣe ní àtijọ́ ti lẹ́tà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwọ̀n bí a ti kú sí èyí tí ó fi dè wá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ìtuntun ti ẹ̀mí.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ní àtijọ́ ti òfin tí a kọ sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: a ti tú wa sílẹ̀ kúrò lábẹ́ òfin
  rationale: Ó fi hàn pé a ti bọ́ kúrò nínú ìdè àti àṣẹ òfin, kì í ṣe pé òfin fúnra rẹ̀ ti di asán tàbí pé kò sí mọ́.
- source_word: ἀποθανόντες
  choice: nítorí a ti kú
  rationale: Ó pa ẹni tí ó kú mọ́ gẹ́gẹ́ bí ‘àwa,’ ó sì sọ ìṣe tí ó ti ṣẹlẹ̀ ṣáájú iṣẹ́ ìsìn tuntun náà ní Yorùbá àdánidá.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: sí ohun tí ó dè wá mú
  rationale: Èyí mú ìtumọ̀ dídè tàbí dímú ṣinṣin jáde láì fi pàtó yan ohun tí gbolohun Gíríìkì náà kò darúkọ ní tààrà.
- source_word: δουλεύειν
  choice: máa sìn
  rationale: ‘Máa sìn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún iṣẹ́ ìránṣẹ́, ó sì yẹ mọ́ ìfọkànsìn sí Ọlọ́run nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἐν καινότητι
  choice: ní ọ̀nà tuntun
  rationale: Dípò àkójọpọ̀ ọ̀rọ̀ aláìdánidá fún ‘ìtuntun,’ ‘ní ọ̀nà tuntun’ sọ ìyàtọ̀ ìgbésí ayé àti iṣẹ́ ìsìn tuntun náà ní kedere.
- source_word: πνεύματος
  choice: ti Ẹ̀mí
  rationale: Lẹ́tà ńlá tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ìtumọ̀ tó ṣeé ṣe jù nínú ìyàtọ̀ Páùlù láàárín Ẹ̀mí àti òǹkọ̀wé; àṣàyàn ‘ẹ̀mí’ wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν παλαιότητι γράμματος
  choice: ní ọ̀nà àtijọ́ ti òǹkọ̀wé
  rationale: Ó pa ìyàtọ̀ tuntun/àtijọ́ àti àwòrán ‘òǹkọ̀wé’ mọ́, láì túmọ̀ rẹ̀ ní pàtó sí gbogbo òfin tí a kọ sílẹ̀.
theological_decisions:
- issue: Ṣé òfin ni ó kú, tàbí àwọn onígbàgbọ́ ni wọ́n kú sí ohun tí ó dè wọ́n mú?
  choice: 'Àwọn onígbàgbọ́ ni wọ́n kú: “a ti kú sí ohun tí ó dè wá mú.”'
  alternative: Òfin kú ní ìbáṣepọ̀ rẹ̀ pẹ̀lú wa.
  rationale: ἀποθανόντες jẹ́ participle nominative plural, ó sì tọ́ka sí àkòrí ‘àwa’; ìtumọ̀ náà tẹ̀ lé gírámà Gíríìkì.
- issue: Ṣé πνεύματος túmọ̀ sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí ènìyàn/ìwà inú?
  choice: “Ẹ̀mí” gẹ́gẹ́ bí Ẹ̀mí Mímọ́.
  alternative: “ẹ̀mí” ní ìtumọ̀ gbogbogbòò.
  rationale: Ìyàtọ̀ Páùlù láàárín Ẹ̀mí àti òǹkọ̀wé, pẹ̀lú àyíká májẹ̀mú tuntun, ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́; síbẹ̀, a pa àṣàyàn mìíràn mọ́ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀ àti èyí tí òǹkàwé òde òní lè lóye. A lo “ní ọ̀nà tuntun/àtijọ́” láti sọ àwọn abstract nouns Gíríìkì ní Yorùbá àdánidá, nígbà tí a pa ìyàtọ̀ rhetoric náà mọ́. Gbogbo àmì àlàyé [a], [b], [c] farahàn nínú ọ̀rọ̀ pàtàkì.
