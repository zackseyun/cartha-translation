revisions:
- from: Ṣùgbọ́n nísinsìnyí, a ti tú wa sílẹ̀ kúrò lábẹ́ òfin, nítorí a ti kú sí ohun tí ó dè wá mú,[a] kí a lè máa sìn ní ọ̀nà tuntun ti Ẹ̀mí,[b] kì í sì í ṣe ní ọ̀nà àtijọ́ ti òǹkọ̀wé.[c]
  to: Ṣùgbọ́n nísinsìnyí a ti tú wa sílẹ̀ kúrò nínú òfin,[a] níwọ̀n bí a ti kú sí ohun tí ó ń dì wá mú, kí a lè sìn ní ìtuntun ti Ẹ̀mí,[b] kì í sì í ṣe ní àtijọ́ ti lẹ́tà.[c]
  rationale: A tún un ṣe láti ṣàtúnṣe aṣiṣe pàtàkì níbi tí “òǹkọ̀wé” ti túmọ̀ γράμμα sí ẹni tí ń kọ ìwé. A lo “lẹ́tà,” a sì lo “ìtuntun/àtijọ́” láti pa ìyàtọ̀ abstract noun ti Gíríìkì mọ́. Gbolohun “níwọ̀n bí a ti kú sí ohun tí ó ń dì wá mú” pa gírámà náà mọ́ pé àwa ni a kú, kì í ṣe pé òfin ni ó kú. Àwọn àmì àlàyé àti àwọn àlàyé ìsàlẹ̀ wà ní ipò tó bá ọ̀rọ̀ mu.
