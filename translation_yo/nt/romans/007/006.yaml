  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìmọ̀ràn pàtàkì náà jáde pé àwọn onígbàgbọ́ ni wọ́n ti kú, tí a sì ti dá sílẹ̀ kúrò nínú ìdè òfin. Ṣùgbọ́n “òǹkọ̀wé” túmọ̀ sí ẹni tí ń kọ ìwé, kì í ṣe γράμμα (‘lẹ́tà’/ohun tí a kọ), nítorí náà ó yí ìtumọ̀ orísun padà. “Ní ọ̀nà tuntun/àtijọ́” jẹ́ ìṣàlàyé tó lè ṣeé gbà, ṣùgbọ́n ó dín ìfararora abstract noun ‘newness/oldness’ kù.
  naturalness: Yorùbá náà kedere ní ọ̀pọ̀ ibi. Síbẹ̀, “ohun tí ó dè wá mú” lè rọrùn sí i gẹ́gẹ́ bí “ohun tí ó ń dì wá mú,” àti lílo “ìtuntun/àtijọ́” ń jẹ́ kí ìdápọ̀ ọ̀rọ̀ Páùlù dun ní Yorùbá boṣewa nígbà tí ó sì sún mọ́ Gíríìkì.
  terminology: A yẹ kí γράμμα jẹ́ “lẹ́tà,” kì í ṣe “òǹkọ̀wé.” A pa “Ẹ̀mí” mọ́ fún πνεύματος, pẹ̀lú àlàyé ìsàlẹ̀ fún aṣàyàn “ẹ̀mí,” láì fipá mú ìtumọ̀ kan ju ohun tí gbolohun náà lè ru lọ.
