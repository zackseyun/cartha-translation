  to: Àbí, ẹ̀yin ará, ẹ kò mọ̀ pé—nítorí mo ń bá àwọn tí ó mọ òfin sọ̀rọ̀—òfin ń ṣàkóso ẹni níwọ̀n ìgbà tí ó bá wà láàyè? [a]
