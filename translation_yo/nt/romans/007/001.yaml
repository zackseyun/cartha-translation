id: ROM.7.1
reference: Romans 7:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: yo
  text: Àbí, ẹ̀yin ará, ẹ kò mọ̀ pé—nítorí mo ń bá àwọn tí ó mọ òfin sọ̀rọ̀—òfin ń ṣàkóso ẹni níwọ̀n ìgbà tí ó bá wà láàyè? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ẹ̀yin ará” jẹ́ ọ̀rọ̀ ọ̀pọ̀ akọ; nínú àyíká yìí, ó ṣeé ṣe kí ó tún kàn sí àwọn obìnrin lára àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: Àbí
  rationale: Ó pa ìsopọ̀ àríyànjiyàn Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìbéèrè yíyàn ní Yorùbá.
- source_word: ἀγνοεῖτε
  choice: ẹ̀yin ... kò mọ̀ pé
  rationale: Ó mú ìbéèrè àsọyé tí ó ń ké sí ìmọ̀ tí gbogbo wọn jọ ní jáde ní Yorùbá tó ṣe kedere.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè gba ọkùnrin àti obìnrin láì fi ìtumọ̀ akọ ti ọ̀rọ̀ Gíríìkì pamọ́; àlàyé ẹsẹ̀ ìwé ṣàlàyé irú ọ̀rọ̀ orísun náà.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: àwọn tí ó mọ òfin ni mo ń bá sọ̀rọ̀
  rationale: Ó pa ìtumọ̀ àlàyé àárín gbólóhùn mọ́, ó sì dun bí Yorùbá òde òní.
- source_word: νόμον / ὁ νόμος
  choice: òfin
  rationale: A kò dín ọ̀rọ̀ náà kù sí Òfin Mósè nìkan tàbí sí ìlànà òfin lápapọ̀; èyí pa àyè ìtumọ̀ Gíríìkì mọ́.
- source_word: κυριεύει
  choice: ń ṣàkóso
  rationale: Ó sọ agbára àti ìṣàkóso tí ọ̀rọ̀-ìṣe náà ní, láì lo gbólóhùn líle tàbí ti ẹ̀kọ́ ìsìn kan.
- source_word: τοῦ ἀνθρώπου
  choice: ẹni
  rationale: “Ẹni” jẹ́ àfihàn ènìyàn lápapọ̀, kì í sì í tọ́ka sí akọ nìkan.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: ní gbogbo ìgbà tí ó bá wà láàyè
  rationale: Ó pa ìwọ̀n àkókò náà mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere àti àdánidá.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ νόμος nínú gbólóhùn Pọ́ọ̀lù
  choice: A túmọ̀ ọ́ sí “òfin” láì fi kún un pé Òfin Mósè nìkan ni.
  alternative: “Òfin Mósè” tàbí “ìlànà òfin lápapọ̀.”
  rationale: Ọ̀rọ̀ Gíríìkì kò pinnu gbogbo ìwọ̀n rẹ̀ ní ẹsẹ yìí. Àyíká ń tọ́ka sí Òfin Mósè, ṣùgbọ́n ọ̀rọ̀ náà tún ní ìtumọ̀ gbòòrò; ìtumọ̀ yẹ kí ó pa ìfọ̀rọ̀wérọ̀ yìí mọ́.
- issue: Agbára κυριεύει
  choice: “ń ṣàkóso”
  alternative: “ní àṣẹ lórí”
  rationale: “Ń ṣàkóso” pa àwọ̀ ìtumọ̀ ìjọba tàbí agbára lórí ẹni mọ́, nígbà tí “ní àṣẹ lórí” jẹ́ àṣàyàn tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún àwọn òǹkàwé òde òní. Àwọn àmì gígùn ya àlàyé àárín gbólóhùn sọ́tọ̀.
