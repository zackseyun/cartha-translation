id: ROM.7.9
reference: Romans 7:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: yo
  text: Nígbà kan rí, èmi wà láàyè láìsí òfin; ṣùgbọ́n nígbà tí àṣẹ náà dé, ẹ̀ṣẹ̀ tún sọjí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀ṣẹ̀ wá sí ìyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔζων
  choice: wà láàyè
  rationale: Ó pa ìtumọ̀ jíjẹ́ alààyè mọ́, ó sì bá ìyàtọ̀ láàárín ìyè àti ikú nínú àyíká ẹsẹ yìí mu ju lílo ọ̀rọ̀ tí ó túmọ̀ sí ‘gbé ayé’ lásán lọ.
- source_word: χωρὶς νόμου
  choice: láìsí òfin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ẹni náà wà ní yàtọ̀ sí òfin tàbí láìsí i; ‘òfin’ tún bá ìtọ́kasí sí Òfin Mósè mu láìfi àlàyé yẹn kún ọ̀rọ̀ náà ní tààrà.
- source_word: ποτέ
  choice: nígbà kan rí
  rationale: Gbólóhùn yìí sọ àkókò ìṣáájú ní kedere, ó sì jẹ́ èdè Yorùbá tí ó wọ́pọ̀.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: nígbà tí àṣẹ náà dé
  rationale: A yí genitive absolute náà sí gbólóhùn àkókò Yorùbá àdánidá, nígbà tí a pa agbára ìṣẹ̀lẹ̀ nínú ‘dé’ mọ́.
- source_word: ἐντολῆς
  choice: àṣẹ náà
  rationale: ‘Àṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a pàṣẹ, ó sì yàtọ̀ sí ‘òfin’ bí Gíríìkì ṣe yà νόμος sí ἐντολή.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: A pa ẹyọ ọ̀rọ̀ náà àti fífi ẹ̀ṣẹ̀ hàn bí ẹni pé ó ń ṣe ohun kan mọ́.
- source_word: ἀνέζησεν
  choice: wá sí ìyè
  rationale: Ó pa àwòrán pé ẹ̀ṣẹ̀ di ohun alààyè mọ́ ní Yorùbá tó ṣe kedere. Ìtumọ̀ ‘tún sọjí’ tún ṣeé ṣe, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Pọ́ọ̀lù jẹ́ ìtàn ìrírí tirẹ̀ nìkan, ó dúró fún Ísírẹ́lì tàbí gbogbo ènìyàn, tàbí ó ń ṣàpèjúwe ìpele kan nínú ìtàn ìgbàlà
  choice: A pa ẹni-kìíní ‘èmi’ mọ́ láìfi àlàyé ìtumọ̀ kún un.
  alternative: Láti sọ ní pàtó pé Pọ́ọ̀lù ń sọ ìrírí ara rẹ̀ nìkan, tàbí pé ó ń sọ̀rọ̀ gẹ́gẹ́ bí aṣojú Ísírẹ́lì tàbí aráyé.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò yanju àwọn ọ̀nà ìtumọ̀ wọ̀nyí; ìtumọ̀ náà fi àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà sílẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìsọ̀rí ẹ̀ṣẹ̀ gẹ́gẹ́ bí ẹni tí ó ń ṣe ohun kan mọ́.
