  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: yo
  text: Nítorí èmi kò ṣe ohun rere tí mo fẹ́[a], ṣùgbọ́n ohun búburú tí èmi kò fẹ́, òun ni mo ń ṣe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “mú ṣẹ” dípò “ṣe” (ποιῶ); Gíríìkì lo ọ̀rọ̀-ìṣe mìíràn ní apá tó tẹ̀ lé e nínú ẹsẹ náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “òun ni mo ń hù.” Ọ̀rọ̀ Gíríìkì πράσσω lè túmọ̀ sí ṣíṣe tàbí híhu ohun kan; ìtumọ̀ rẹ̀ sì farakanra ti ποιῶ púpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: fẹ́
  rationale: “Fẹ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìfẹ́ inú tàbí ohun tí ẹni pinnu láti ṣe, láìfi ìtumọ̀ ọgbọ́n-orí tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: ποιῶ
  choice: ṣe
  rationale: “Ṣe” túmọ̀ ποιῶ ní ọ̀nà tó rọrùn, ó sì jẹ́ kí a lè fi ìyàtọ̀ kékeré hàn láàárín rẹ̀ àti πράσσω.
- source_word: ἀγαθόν
  choice: ohun rere
  rationale: “Ohun rere” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun tí ó dára ní ti ìwà, ó sì bá “ohun búburú” mu gẹ́gẹ́ bí àfiwé.
- source_word: κακὸν
  choice: ohun búburú
  rationale: “Ohun búburú” pa agbára ìtumọ̀ ìwà rere àti ìwà búburú mọ́; kò sọ ọ́ di ohun tí kò dára lásán.
- source_word: πράσσω
  choice: ń hù nígbà gbogbo
  rationale: “Hù” bá ìṣe tàbí ìwà tí ènìyàn ń fi sílò mu; “nígbà gbogbo” ń fi apá ìṣe tí ó ń ṣẹlẹ̀ léraléra hàn nínú àyíká ọ̀rọ̀, láìsọ pé πράσσω yà pátápátá sí ποιῶ.
- source_word: τοῦτο
  choice: òun gan-an
  rationale: “Òun gan-an” pa ìtẹnumọ́ ọ̀rọ̀-atọ́ka τοῦτο mọ́ ní Yorùbá àdánidá.
- source_word: οὐ γὰρ
  choice: Nítorí ... kò
  rationale: “Nítorí” so ẹsẹ yìí mọ́ àlàyé tó ṣáájú, “kò” sì gbé ìsẹ́ nínú òdì kalẹ̀.
theological_decisions:
- issue: Bóyá kí a rọ ìyàtọ̀ ìwà rere àti ìwà búburú tí Pọ́ọ̀lù ṣe
  choice: Pa “ohun rere” àti “ohun búburú” mọ́ gẹ́gẹ́ bí ẹ̀ka ìwà tó lódì sí ara wọn.
  alternative: ohun tó tọ́ / ohun tí kò tọ́; ohun dáadáa / ohun tí kò dára
  rationale: ἀγαθόν àti κακόν ní agbára ìtumọ̀ ìwà rere àti ìwà búburú níbí; a kò gbọ́dọ̀ sọ ìforígbárí náà di ọ̀ràn àǹfààní tàbí ìṣàmúlò lásán.
- issue: Bóyá ẹni tí “èmi” ń tọ́ka sí ni Pọ́ọ̀lù fúnra rẹ̀ ní ipò kan pàtó
  choice: Fi “èmi” sílẹ̀ láìṣàlàyé ẹni tàbí ipò tí ó dúró fún.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí Pọ́ọ̀lù ṣáájú ìgbàgbọ́, lẹ́yìn ìgbàgbọ́, tàbí gẹ́gẹ́ bí aṣojú ẹ̀dá ènìyàn.
  rationale: Ẹsẹ náà fúnra rẹ̀ kò yanjú ìjíròrò yìí; ìtumọ̀ yẹ kí ó pa àìdánilójú àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àtúnṣe gbolohun “òun gan-an ni” pa ìtẹnumọ́ Gíríìkì mọ́; “ń hù nígbà gbogbo” jẹ́ kó ṣe kedere pé ìṣe tó ń fara hàn nínú ìwà ni a ń sọ, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìfarakanra àwọn ọ̀rọ̀-ìṣe méjèèjì hàn.
