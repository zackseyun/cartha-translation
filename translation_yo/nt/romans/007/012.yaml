  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: yo
  text: Nítorí náà, òfin jẹ́ mímọ́, àṣẹ náà sì jẹ́ mímọ́, ó sì jẹ́ òdodo, ó sì dára.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí a fà jáde láti inú àlàyé tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: νόμος
  choice: òfin
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì fi kún un pé òfin Mósè ní pàtó, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí i.
- source_word: ἅγιος
  choice: mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún ohun tí a yà sọ́tọ̀ fún Ọlọ́run, tí ó sì ní ìwà mímọ́.
- source_word: ἐντολή
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè tọ́ka sí àṣẹ kan pàtó nínú òfin.
- source_word: δικαία
  choice: jẹ́ òdodo
  rationale: Ó sọ pé àṣẹ náà tọ́ àti pé kò ní àìṣòdodo; ó tún pa ìsopọ̀ mọ́ èdè ìwà òdodo Pọ́ọ̀lù.
- source_word: ἀγαθή
  choice: dára
  rationale: Ó mú ìtumọ̀ ìwà rere àti àǹfààní rere inú ọ̀rọ̀ Gíríìkì wá láì ṣe àlàyé ju bó ṣe yẹ lọ.
- source_word: μὲν
  choice: kò túmọ̀ sí ọ̀rọ̀ ọ̀tọ̀
  rationale: Ìtẹnumọ́ rẹ̀ wà nínú ìṣètò gbólóhùn; fífi ọ̀rọ̀ bí “ní tòótọ́” kún un lè wuwo, níwọ̀n bí kò ti sí δέ tó ń fi ohun mìíràn wé e.
theological_decisions:
- issue: Bóyá kí a pe νόμος ní “Òfin Mósè”
  choice: òfin
  alternative: Òfin Mósè
  rationale: Àyíká lè túmọ̀ sí Òfin Mósè, ṣùgbọ́n ẹsẹ̀ náà fúnra rẹ̀ sọ νόμος lásán; a pa ìwọ̀n àìsọ pàtó yẹn mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Àtúnṣe “ó sì jẹ́ òdodo, ó sì dára” jẹ́ ti Yorùbá àdánidá, ó sì pa gbogbo àpèjúwe Gíríìkì mọ́.
