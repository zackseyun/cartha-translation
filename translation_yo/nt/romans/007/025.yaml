id: ROM.7.25
reference: Romans 7:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: yo
  text: Ọpẹ́ ni fún Ọlọ́run nípasẹ̀ Jésù Mèsáyà, Olúwa wa! Nítorí náà, èmi fúnra mi ń fi ìrònú mi sin òfin Ọlọ́run, ṣùgbọ́n nípa ti ara mi[a], mo ń sin òfin ẹ̀ṣẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwà ẹ̀dá ẹlẹ́ṣẹ̀” dípò “ara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìlànà ẹ̀ṣẹ̀” dípò “òfin ẹ̀ṣẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Ọpẹ́ ni fún Ọlọ́run
  rationale: Nínú gbólóhùn ìyìn yìí, χάρις pẹ̀lú τῷ θεῷ jẹ́ ọ̀nà ìdúpẹ́, kì í ṣe ìtọ́ka sí oore-ọ̀fẹ́ gẹ́gẹ́ bí ẹ̀bùn tàbí ànímọ́.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: nípasẹ̀ Jesu Mèsáyà Olúwa wa
  rationale: διά pẹ̀lú ọ̀rọ̀ inú genitive túmọ̀ sí “nípasẹ̀”; Mèsáyà ń pa ìtumọ̀ Χριστός mọ́ gẹ́gẹ́ bí oyè, nígbà tí “Olúwa wa” jẹ́ Yorùbá àdánidá fún τοῦ κυρίου ἡμῶν.
- source_word: Ἄρα οὖν
  choice: Nítorí náà
  rationale: Àwọn patíkù méjèèjì ń fi àbájáde àti àkótán hàn; “Nítorí náà” sọ agbára ìyọrísí náà ní Yorùbá tó ṣe kedere.
- source_word: αὐτὸς ἐγώ
  choice: èmi fúnra mi
  rationale: Àkójọpọ̀ náà tẹnumọ́ ẹni tó ń sọ̀rọ̀; “èmi fúnra mi” pa ìtẹnumọ́ yẹn mọ́ láìfikún ìtumọ̀ mìíràn.
- source_word: τῷ μὲν νοῒ
  choice: fi ọkàn mi
  rationale: νοῦς níhìn-ín tọ́ka sí agbára inú ènìyàn láti ronú àti lóye. “Ọkàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún apá inú yìí nínú ìyàtọ̀ rẹ̀ sí ẹran ara.
- source_word: δουλεύω
  choice: ń ... sin
  rationale: “Sin” lè sọ ìtẹríba àti iṣẹ́ fún olúwa; ó tún bá àfiwé tó dọ́gba láàárín òfin Ọlọ́run àti òfin ẹ̀ṣẹ̀ mu.
- source_word: νόμῳ θεοῦ
  choice: òfin Ọlọ́run
  rationale: “Òfin” pa ọ̀rọ̀ νόμος àti ìṣọ̀kan rẹ̀ pẹ̀lú àríyànjiyàn inú Róòmù 7 mọ́.
- source_word: τῇ δὲ σαρκὶ
  choice: fi ẹran ara mi
  rationale: “Ẹran ara” pa àwòrán σάρξ mọ́, ó sì yẹra fún yíyanju ìjà ẹ̀kọ́ ìgbàgbọ́ náà sí “ìwà ẹlẹ́ṣẹ̀” nínú ọ̀rọ̀ pàtàkì.
- source_word: νόμῳ ἁμαρτίας
  choice: òfin ẹ̀ṣẹ̀
  rationale: Yíyan “òfin” pa àtúnṣe νόμος àti ìfiwéra pẹ̀lú “òfin Ọlọ́run” mọ́; “agbára ìṣàkóso ẹ̀ṣẹ̀” jẹ́ ìtumọ̀ àlàyé tó pọ̀ ju.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú àyíká Páùlù tó ní ìtumọ̀ ìwà rere àti búburú
  choice: ẹran ara
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: Gíríìkì lo σάρξ, kì í ṣe ọ̀rọ̀ tó sọ “ìwà ẹlẹ́ṣẹ̀” ní tààràtà. “Ẹran ara” pa ìṣòro àti ìfarakanra èrò Páùlù mọ́ láìfi ẹ̀kọ́ ìtumọ̀ kún un.
- issue: Bó ṣe yẹ kí νόμος túmọ̀ nínú “νόμῳ ἁμαρτίας”
  choice: òfin ẹ̀ṣẹ̀
  alternative: ìlànà ẹ̀ṣẹ̀
  rationale: “Òfin” pa ìfarajọ ọ̀rọ̀ pẹ̀lú “òfin Ọlọ́run” mọ́, nígbà tí “ìlànà” lè túmọ̀ rẹ̀ sí èrò àlàyé kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀ tó ṣeé lóye fún òǹkàwé òde òní. A lo “Mèsáyà” gẹ́gẹ́ bí oyè fún Χριστός. A tún ṣe àtòjọ gbólóhùn kejì ní ọ̀nà Yorùbá àdánidá, nípa ṣíṣe àtúnṣe “ń ... sin” lẹ́ẹ̀mejì láti mú ìyàtọ̀ méjèèjì kedere.
