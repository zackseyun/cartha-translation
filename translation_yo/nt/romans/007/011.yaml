id: ROM.7.11
reference: Romans 7:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: yo
  text: Nítorí ẹ̀ṣẹ̀, nígbà tí ó rí àǹfààní nípasẹ̀ àṣẹ náà,[a] tàn mí jẹ, ó sì pa mí nípasẹ̀ rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó rí àyè.”
    reason: lexical_alternative
  - marker: b
    text: “Rẹ̀” tọ́ka sí “àṣẹ náà.”
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa àlàyé tí γὰρ ní mọ́, ó sì so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá ní Yorùbá.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ἁμαρτία; fífi í ṣe olùṣe àwọn ìṣe náà pa àkàwé ẹni tí Pọ́ọ̀lù lò mọ́.
- source_word: ἀφορμὴν λαβοῦσα
  choice: nígbà tí ó rí àǹfààní gbà
  rationale: Ó túmọ̀ sí pé ẹ̀ṣẹ̀ rí àyè kan, ó sì lò ó fún ète rẹ̀; gbolohun yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára ìṣe náà mọ́.
- source_word: διὰ τῆς ἐντολῆς
  choice: nípasẹ̀ àṣẹ náà
  rationale: “Nípasẹ̀” fi hàn pé àṣẹ náà ni ohun èlò tàbí ọ̀nà tí ẹ̀ṣẹ̀ lò, “àṣẹ náà” sì pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐξηπάτησέν
  choice: ó tàn mí jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti kedere láti sọ pé ẹnì kan tan ẹlòmíràn jẹ; kò fi ìtumọ̀ àfikún kún ọ̀rọ̀ náà.
- source_word: με
  choice: mí
  rationale: Ó pa arọ́pò-orúkọ olùgbà ìṣe ẹni àkọ́kọ́ mọ́ ní tààràtà.
- source_word: δι’ αὐτῆς
  choice: nípasẹ̀ rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka sí “àṣẹ náà”; ìtumọ̀ yìí ṣókí, ó sì pa ipa ohun èlò mọ́.
- source_word: ἀπέκτεινεν
  choice: ó pa mí
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá agbára ἀπέκτεινεν mu láìsọ ọ́ di ọ̀rọ̀ ìdájọ́ lọ́nà àfikún.
theological_decisions:
- issue: Bí a ṣe lè pa àkàwé ẹ̀ṣẹ̀ gẹ́gẹ́ bí olùṣe alágbára mọ́
  choice: A fi “ẹ̀ṣẹ̀” ṣe olùṣe tó rí àǹfààní gbà, tó tàn, tó sì pa.
  alternative: Kí a sọ ọ́ bí agbára àìlẹ́ni tàbí kí a rọ ìṣe rẹ̀ kù.
  rationale: Nínú Gíríìkì, ẹ̀ṣẹ̀ ni olùṣe gbogbo àwọn ìṣe tó tẹ̀ lé ara wọn. Ìtumọ̀ náà pa ìfọkànsìn àti ìdọ̀tí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìfi àlàyé ẹ̀sìn kún un.
translation_notes:
  register: Yorùbá àfọwọ́kọ, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtẹ̀jáde náà yàgò fún ìtumọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan, ó sì pa ìtàn ẹ̀ṣẹ̀ bí ẹni pé ó ń ṣiṣẹ́ mọ́.
