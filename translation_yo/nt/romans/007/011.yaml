  to: Nítorí ẹ̀ṣẹ̀, nígbà tí ó rí àǹfààní nípasẹ̀ àṣẹ náà,[a] tàn mí jẹ, ó sì pa mí nípasẹ̀ rẹ̀.[b]
  rationale: A tún ‘rí àǹfààní gbà’ ṣe sí ‘rí àǹfààní’ kí gbolohun náà lè jẹ́ Yorùbá tó pé, nígbà tí a pa ìtumọ̀ ẹni-mímọ́ àti ipa irinṣẹ́ ti ọ̀rọ̀ Gíríìkì mọ́. A tún ṣàtúnṣe akọ-ìsàlẹ̀ [a] kí ó má bàa sọ ‘take time’ dípò ‘take occasion.’
