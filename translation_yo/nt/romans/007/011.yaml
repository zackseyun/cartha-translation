  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa olùṣe ẹni-mímọ́ ti ἁμαρτία, ipa irinṣẹ́ ti διὰ τῆς ἐντολῆς/δι’ αὐτῆς, àti àwọn ìṣe méjèèjì ‘tan’ àti ‘pa’ mọ́. Síbẹ̀, ‘rí àǹfààní gbà’ kò jẹ́ àgbékalẹ̀ Yorùbá tó pé fún ἀφορμὴν λαβοῦσα.
  naturalness: ‘Nígbà tí ó rí àǹfààní’ jẹ́ Yorùbá òde òní tó dára, tó sì sọ pé ẹ̀ṣẹ̀ rí/lo àyè kan. Àtúnṣe náà tún yọ ìfarahàn ‘gbà’ tí kò bá gbolohun náà mu kúrò.
  terminology: ‘Ẹ̀ṣẹ̀,’ ‘àṣẹ náà,’ ‘tàn mí jẹ,’ àti ‘pa mí’ bá ọ̀rọ̀ orísun mu, wọ́n sì jẹ́ ọ̀rọ̀ ìwé mímọ́ Yorùbá tó ṣe kedere. Arọ́pò-orúkọ ‘rẹ̀’ lè tọ́ka sí ‘àṣẹ náà,’ gẹ́gẹ́ bí akọ-ìsàlẹ̀ ṣe ṣàlàyé.
