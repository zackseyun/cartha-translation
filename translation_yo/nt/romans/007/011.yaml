  - severity: medium
    issue: Àkọsílẹ̀ [a] ‘nígbà tí ó gba àsìkò’ yí ìtumọ̀ lexical padà.
    rationale: ‘Gba àsìkò’ lè túmọ̀ sí ‘take time,’ kì í sì jẹ́ àfidípò tó dáa fún ‘take occasion/opportunity.’ Ó yẹ kí àfidípò náà jẹ́ ‘rí àyè’.
  revised_text: Nítorí ẹ̀ṣẹ̀, nígbà tí ó rí àǹfààní nípasẹ̀ àṣẹ náà,[a] tàn mí jẹ, ó sì pa mí nípasẹ̀ rẹ̀.[b]
