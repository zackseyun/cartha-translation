id: ROM.7.21
reference: Romans 7:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: yo
  text: 'Nítorí náà, mo rí òfin[a] yìí: nígbà tí mo bá fẹ́ ṣe ohun rere, ohun búburú wà lẹ́gbẹ̀ẹ́ mi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìlànà” tàbí “ìlànà ìṣàkóso.”
    reason: Ó pa àwọn ìtumọ̀ míì tí νόμος lè ní nínú àyíká ọ̀rọ̀ yìí mọ́.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: mo rí
  rationale: Ọ̀rọ̀ ìṣe yìí wà ní àkókò ìsinsìnyí, ó sì ń sọ ohun tí Pọ́ọ̀lù mọ̀ pé ó ń ṣẹlẹ̀.
- source_word: ἄρα
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí ó jáde láti inú àlàyé tó ṣáájú hàn.
- source_word: νόμον
  choice: òfin
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì νόμος mọ́, ó sì jẹ́ kí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí òfin tàbí ìlànà ìṣàkóso ṣì ṣí sílẹ̀.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: nígbà tí mo bá fẹ́ ṣe ohun rere
  rationale: Ìtumọ̀ yìí sọ ìhun dátífù Gíríìkì ní Yorùbá àdánidá, ó sì pa ìfẹ́ láti ṣe rere mọ́.
- source_word: τὸ καλὸν
  choice: ohun rere
  rationale: Àjẹtífù tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ túmọ̀ sí ohun tí ó dára; “ohun rere” jẹ́ Yorùbá tó ṣe kedere.
- source_word: τὸ κακὸν
  choice: ohun búburú
  rationale: Àjẹtífù oníṣúra yìí ń tọ́ka sí ohun tí ó burú tàbí ibi ní ọ̀nà tó ṣe pàtó.
- source_word: παράκειται
  choice: wà lẹ́gbẹ̀ẹ́ mi
  rationale: Ó pa àwòrán ohun tí ó sún mọ́ni, tí ó sì wà ní imurasilẹ̀, mọ́ láì ṣe àlàyé rẹ̀ ju bó ṣe yẹ lọ.
theological_decisions:
- issue: Bóyá νόμον túmọ̀ sí Òfin Mósè tàbí ìlànà kan tí ń ṣiṣẹ́
  choice: A lo “òfin” nínú ẹsẹ̀ náà, a sì fi “ìlànà” sí àlàyé ìsàlẹ̀.
  alternative: ìlànà tàbí ìlànà ìṣàkóso
  rationale: “Òfin” pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú νόμος mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ kò jẹ́ kí òǹkàwé rò pé dandan ni ó ń tọ́ka sí Òfin Mósè nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tó sì ṣe kedere ni a lò. A gbe àmì àlàyé [a] lẹ́gbẹ̀ẹ́ “òfin,” nítorí ọ̀rọ̀ yẹn gan-an ni àlàyé náà ń ṣàlàyé.
