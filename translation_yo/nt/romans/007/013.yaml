id: ROM.7.13
reference: Romans 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: yo
  text: Ǹjẹ́, ohun rere náà ha di ikú fún mi? Kí ó má rí bẹ́ẹ̀ láéláé! Kàkà bẹ́ẹ̀, ẹ̀ṣẹ̀ ni ń lo ohun rere náà láti mú ikú wá fún mi, kí ó lè hàn pé ẹ̀ṣẹ̀ ni; kí, nípasẹ̀ àṣẹ náà, ẹ̀ṣẹ̀ lè di ẹ̀ṣẹ̀ tí ó burú rékọjá gbogbo ìwọ̀n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “kí, nípasẹ̀ àṣẹ náà, ẹ̀ṣẹ̀ lè burú rékọjá gbogbo ìwọ̀n.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: ohun tí ó dára náà
  rationale: Ó ṣe àfihàn àjẹtífù aláìdábọ̀ tí a lò gẹ́gẹ́ bí orúkọ, ó sì tọ́ka padà sí àṣẹ rere tí ẹsẹ ṣáájú mẹ́nu kàn.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: di ikú fún mi
  rationale: Ó pa ìtumọ̀ predicative γίνομαι mọ́, pẹ̀lú dative ẹni tí ọ̀ràn náà kàn.
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ láé!
  rationale: Ọ̀rọ̀ Yorùbá adayébá tó fi agbára kọ èrò náà pátápátá, gẹ́gẹ́ bí ìkọ̀sílẹ̀ Pọ́ọ̀lù.
- source_word: ἡ ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Ó pa ẹ̀ṣẹ̀ mọ́ gẹ́gẹ́ bí ohun àfojúrí tí a sọ di ẹni tó ń ṣe iṣẹ́, láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: kí ó lè hàn gbangba pé ẹ̀ṣẹ̀ ni
  rationale: Ó mú agbára predicate ti àtúnwí ἁμαρτία jáde, ó sì pa ìdí/èrò inú ἵνα mọ́.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: nípasẹ̀ ohun tí ó dára
  rationale: Ó bá gbolohun àkọ́kọ́ mu, ó sì pa ipa irinṣẹ́ διά mọ́.
- source_word: μοι κατεργαζομένη θάνατον
  choice: nípa mímú ikú wá sínú mi
  rationale: Ó ṣàfihàn ẹ̀ṣẹ̀ gẹ́gẹ́ bí olùṣe tí ń mú ikú ṣẹlẹ̀ nínú ẹni náà.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: ẹlẹ́ṣẹ̀ rékọjá
  rationale: ‘Rékọjá’ jẹ́ ọ̀nà Yorùbá adayébá láti fi ìwọ̀n àṣejù hàn; ‘ẹlẹ́ṣẹ̀’ pa àtúnwí ọ̀rọ̀ ẹ̀ṣẹ̀/ẹlẹ́ṣẹ̀ mọ́.
- source_word: διὰ τῆς ἐντολῆς
  choice: nípasẹ̀ àṣẹ náà
  rationale: ‘Àṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἐντολή; àmì ‘náà’ tọ́ka sí àṣẹ tí a ti mẹ́nu kàn.
theological_decisions:
- issue: Ìdáhùn Pọ́ọ̀lù pé ohun rere tàbí àṣẹ náà kì í ṣe olùdá ikú ní ti ẹ̀bi ìwà
  choice: A fi iṣẹ́ mímú ikú ṣẹlẹ̀ lé ẹ̀ṣẹ̀ lórí, tí ó lo ohun rere gẹ́gẹ́ bí irinṣẹ́.
  alternative: A lè túmọ̀ ọ̀rọ̀ náà lọ́nà tí yóò dà bí ẹni pé àṣẹ rere fúnra rẹ̀ ló fa ikú ní ti ẹ̀bi.
  rationale: Ìtakò ἀλλὰ ἡ ἁμαρτία lẹ́yìn μὴ γένοιτο fi ẹ̀ṣẹ̀ hàn gẹ́gẹ́ bí olùṣe; ṣùgbọ́n a ṣì pa ìdààmú ọ̀rọ̀ náà mọ́ pé ẹ̀ṣẹ̀ ṣiṣẹ́ nípasẹ̀ ohun rere.
- issue: Ìtumọ̀ àwọn gbólóhùn ἵνα méjèèjì
  choice: 'A tú wọn sí ìdí tàbí èrò: ‘kí ó lè ...; kí ... lè ...’.'
  alternative: 'A lè ka wọn sí àbájáde nìkan: ‘tó fi jẹ́ pé ...’.'
  rationale: ἵνα sábà máa ń fi ìdí tàbí èrò hàn; síbẹ̀, àyíká yìí tún lè ní ìfarahàn àbájáde. Ìtumọ̀ yìí pa ìṣọ̀kan àwọn clause méjèèjì mọ́ láìṣàlàyé ẹni tó ní èrò náà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti kíkà-rọrùn ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa ìbéèrè àsọyé, ìkọ̀sílẹ̀ líle, àfijúwe ẹ̀ṣẹ̀ bí ẹni tó ń ṣiṣẹ́, àti ìtẹnumọ́ àṣejù Pọ́ọ̀lù mọ́. Àtẹ̀jáde English POB ní àmì ìsàlẹ̀ [a] lẹ́yìn ‘So then’ tí kò bá àkóónú àlàyé rẹ̀ mu; nítorí náà a kò gbé àṣìṣe àmì náà wọ inú Yorùbá.
