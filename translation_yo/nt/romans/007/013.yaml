  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìbéèrè àsọyé náà, ìkọ̀sílẹ̀ μὴ γένοιτο, àti ipa ẹ̀ṣẹ̀ gẹ́gẹ́ bí ohun tí ń ṣiṣẹ́ ikú nípasẹ̀ ohun rere mọ́ dáadáa. Ṣùgbọ́n ‘ẹlẹ́ṣẹ̀ rékọjá’ tú ἁμαρτωλός sí ‘ẹni tó ń ṣẹ̀,’ dípò àjẹtífù tó ṣàpèjúwe ẹ̀ṣẹ̀ fúnra rẹ̀; nítorí náà ó yí ìtumọ̀ gbolohun ìkẹyìn padà.
  naturalness: ‘Ẹlẹ́ṣẹ̀ rékọjá’ kò dára ní Yorùbá nínú àyíká yìí, nítorí ẹlẹ́ṣẹ̀ jẹ́ ènìyàn ẹni tó ṣẹ̀. ‘Ẹ̀ṣẹ̀ tí ó burú rékọjá gbogbo ìwọ̀n’ jẹ́ kedere, ó sì pa ìtẹnumọ́ Pọ́ọ̀lù mọ́. A tún ṣe gbolohun ìbéèrè náà ní ọ̀nà tó rọrùn fún ìkọ̀wé Yorùbá.
  terminology: ‘Ẹ̀ṣẹ̀,’ ‘ohun rere,’ ‘ikú,’ àti ‘àṣẹ’ bá ọ̀rọ̀ Gíríìkì àti ìlò Bíbélì Yorùbá mu. ‘Ohun rere náà’ ń tọ́ka sí ohun rere/àṣẹ rere tí àyíká ti sọ tẹlẹ̀, láìsọ ohun tí kò sí nínú ẹsẹ náà.
