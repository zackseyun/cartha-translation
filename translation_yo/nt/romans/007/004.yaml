id: ROM.7.4
reference: Romans 7:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin arákùnrin mi[a], ẹ̀yin náà, a ti sọ yín di òkú sí òfin nípasẹ̀ ara Mèsáyà[b], kí ẹ lè di ti ẹlòmíràn[c]—ẹni tí a jí dìde kúrò láàárín àwọn òkú—kí àwa lè so èso fún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “àwọn arákùnrin mi,” ṣùgbọ́n ó lè jẹ́ ọ̀nà láti bá àwùjọ tí àwọn ọkùnrin àti obìnrin wà nínú rẹ̀ sọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: Christou. A túmọ̀ rẹ̀ sí “Mèsáyà” nítorí ìtumọ̀ oyè náà ṣe pàtàkì níbí. A tún lè túmọ̀ rẹ̀ sí “Kristi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààrà: “kí ẹ lè di ti ẹlòmíràn.” Ọ̀rọ̀ yìí ń tẹ̀ síwájú pẹ̀lú àpẹẹrẹ ìgbéyàwó inú àwọn ẹsẹ tó ṣáájú.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìtumọ̀ àpẹẹrẹ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti so ọ̀rọ̀ náà pọ̀ ní Yorùbá.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: Ó pa ìrísí ọ̀rọ̀ Gíríìkì tó jẹ́ akọ ní ọ̀pọ̀ mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè tọ́ka sí àwùjọ ọkùnrin àti obìnrin.
- source_word: καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ
  choice: ẹ̀yin pẹ̀lú ni a ti sọ di òkú sí òfin
  rationale: ‘Ẹ̀yin pẹ̀lú’ mú καὶ ὑμεῖς jáde, ‘a ti sọ di òkú’ sì pa ohùn àìṣe ἐθανατώθητε mọ́. ‘Sí òfin’ kò tú ìbáṣepọ̀ dative náà sí ìtumọ̀ tó ju ohun tí orísun sọ lọ.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: nípasẹ̀ ara Mèsáyà
  rationale: ‘Nípasẹ̀’ fi ipa ọ̀nà tàbí ohun èlò διά pẹ̀lú genitive hàn; ‘ara’ sì pa àwòrán ikú ara Mèsáyà mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Nínú àyíká yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Ẹni Àmì Òróró Sí, kì í ṣe bí orúkọ lásán.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: kí ẹ lè di ti ẹlòmíràn
  rationale: Ó pa gbolohun ète náà àti èdè ìní ẹni mọ́, èyí tó ń tẹ̀ síwájú pẹ̀lú àpẹẹrẹ ìgbéyàwó inú ọ̀rọ̀ tó ṣáájú.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: ẹni tí a jí dìde kúrò láàárín àwọn òkú
  rationale: Ó tọ́ka sí Mèsáyà, ó pa ìrísí àìṣe ìjíǹde náà mọ́, ‘láàárín àwọn òkú’ sì ṣàfihàn ἐκ νεκρῶν ní kíkún.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: kí àwa lè so èso fún Ọlọ́run
  rationale: Ó pa ète ἵνα, àkàwé sísọ èso, àti ìyípadà láti ‘ẹ̀yin’ sí ‘àwa’ mọ́; ‘fún Ọlọ́run’ jẹ́ Yorùbá àdánidá fún dative náà.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú ọ̀rọ̀ Paulu
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ mú ìtumọ̀ oyè ẹni tí a fi àmì òróró yàn jáde láì sọ ọ́ di orúkọ pàtó lásán.
- issue: Àwòrán ìbáṣepọ̀ ìgbéyàwó nínú εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: kí ẹ lè di ti ẹlòmíràn
  alternative: kí a lè so yín pọ̀ mọ́ ẹlòmíràn
  rationale: Ìtumọ̀ tí a yàn pa ọ̀rọ̀ Gíríìkì tó túmọ̀ ní tààrà pé kí wọ́n ‘di ti ẹlòmíràn’ mọ́, ó sì jẹ́ kí àpẹẹrẹ ìgbéyàwó tó wà nínú àyíká ọ̀rọ̀ náà dúró láì fi ìtumọ̀ míì kún un.
- issue: Ohùn àìṣe nínú ἐθανατώθητε
  choice: a ti sọ di òkú
  alternative: ẹ ti kú
  rationale: Ìtumọ̀ yìí pa àbùdá passive Gíríìkì mọ́, láì sọ ẹni tó ṣe iṣẹ́ náà ní pàtó ju bí orísun ṣe sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán ‘di òkú,’ ‘di ti ẹlòmíràn,’ àti ‘so èso’ mọ́, bẹ́ẹ̀ ni a kò mú ìyípadà ‘ẹ̀yin’ sí ‘àwa’ dọ́gba.
