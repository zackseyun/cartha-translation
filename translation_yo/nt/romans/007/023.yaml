id: ROM.7.23
reference: Romans 7:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: yo
  text: Ṣùgbọ́n mo rí òfin[a] mìíràn nínú àwọn ẹ̀yà ara mi, tí ń bá òfin èrò inú mi jagun, tí ó sì ń sọ mí di ẹlẹ́wọ̀n lábẹ́ òfin ẹ̀ṣẹ̀[b] tí ó wà nínú àwọn ẹ̀yà ara mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìlànà” tàbí “agbára” ní àwọn ibi tí a ti tún ọ̀rọ̀ “òfin” lò nínú ẹsẹ yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “nínú òfin ẹ̀ṣẹ̀”; “lábẹ́ òfin ẹ̀ṣẹ̀” fi hàn pé a mú un sí ìgbèkùn sí abẹ́ agbára rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: mo rí
  rationale: Ó pa ìṣe àsìkò ìsinsìnyí àti bí Pọ́ọ̀lù ṣe ń sọ ohun tí òun fúnra rẹ̀ ṣàkíyèsí mọ́.
- source_word: ἕτερον
  choice: mìíràn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìyàtọ̀ tí ó wà láàárín òfin yìí àti òfin tí a mẹ́nu kàn ṣáájú.
- source_word: νόμον / νόμῳ
  choice: òfin
  rationale: A pa àsọtúnṣe ọ̀rọ̀ νόμος mọ́ ní gbogbo ibi tí ó ti fara hàn, kí agbára àsọyé àti ìforígbárí inú ẹ̀kọ́ ẹ̀sìn inú gbólóhùn náà má bàa sọnù.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: nínú àwọn ẹ̀yà ara mi
  rationale: Èyí pa àwòrán àwọn ẹ̀yà ara mọ́, ó sì ṣe kedere ju lílo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí ó lè dà bí ẹ̀yà ẹgbẹ́ lọ.
- source_word: ἀντιστρατευόμενον
  choice: tí ń bá … jagun
  rationale: Ó pa àwòrán ogun inú ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá tí ó ṣe déédéé.
- source_word: τοῦ νοός μου
  choice: èrò inú mi
  rationale: Èyí ń tọ́ka sí agbára inú ẹni láti ronú, lóye, àti pinnu, láì dín un kù sí ọpọlọ gẹ́gẹ́ bí ẹ̀yà ara nìkan.
- source_word: αἰχμαλωτίζοντά με
  choice: tí ó sì ń sọ mí di ẹlẹ́wọ̀n
  rationale: Ó ń bá àwòrán ogun lọ, ó sì fi ìtumọ̀ mímú ẹni ní ìgbèkùn hàn kedere.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: lábẹ́ òfin ẹ̀ṣẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν túmọ̀ ní tààrà sí “nínú,” “lábẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a mú ẹni sí ìgbèkùn sí abẹ́ agbára òfin náà; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gangan mọ́.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé, tí ó sì péye ní àyíká yìí.
theological_decisions:
- issue: Bóyá kí a túmọ̀ νόμος sí “òfin” tàbí kí a túmọ̀ rẹ̀ ní ọ̀nà àlàyé sí “ìlànà” tàbí “agbára.”
  choice: A lo “òfin” ní gbogbo ìgbà tí νόμος fara hàn.
  alternative: A lè lo “ìlànà” tàbí “agbára” ní ibi kan tàbí jù bẹ́ẹ̀ lọ.
  rationale: Lílo “òfin” ní gbogbo ibi pa àsọtúnṣe Pọ́ọ̀lù àti ìforígbárí tí ó mọ̀ọ́mọ̀ fi sílẹ̀ láàárín òfin, èrò inú, àti agbára ẹ̀ṣẹ̀ mọ́, dípò kí ìtumọ̀ yan ojútùú ẹ̀kọ́ kan fún òǹkàwé.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbo ni a lò. “Àwọn ẹ̀yà ara mi” pa àwòrán ara mọ́; “èrò inú mi” sì yẹra fún ìtumọ̀ tó lè fi ọpọlọ gẹ́gẹ́ bí ẹ̀yà ara nìkan hàn. Àwọn àmì ohùn ni a kọ níbi tí ó bá yẹ.
