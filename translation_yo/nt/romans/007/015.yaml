  to: Nítorí ohun tí mo ń ṣe kò yé mi; nítorí kì í ṣe ohun tí mo fẹ́ ni mo ń ṣe, ṣùgbọ́n ohun tí mo kórìíra ni mo ń ṣe.
  rationale: A ṣàtúnṣe ìkọ̀wé arọ́pò-orúkọ, a lo gbolohun adayeba fún “I do not understand,” a sì pa ìfaradà, ìsopọ̀ ìdí, àti ìtẹnumọ́ ohun tí a ń ṣe mọ́ láìfikún ìtumọ̀ ẹ̀kọ́ tàbí ìwọ̀n ìmọ̀lára tí kò hàn nínú ọ̀rọ̀ orísun.
