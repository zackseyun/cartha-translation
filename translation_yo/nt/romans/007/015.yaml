id: ROM.7.15
reference: Romans 7:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: yo
  text: Nítorí ohun tí mo ń ṣe kò yé mi; nítorí kì í ṣe ohun tí mo fẹ́ ni mo ń ṣe, ṣùgbọ́n ohun tí mo kórìíra ni mo ń ṣe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: ohun tí mò ń ṣe
  rationale: Ó túmọ̀ sí ohun tí ẹni ń mú ṣẹ tàbí ń ṣe; ọ̀rọ̀ yìí jẹ́ adayeba ní Yorùbá, ó sì bá ìtumọ̀ inú àyíká mu.
- source_word: οὐ γινώσκω
  choice: èmi kò lóye
  rationale: Nínú àyíká yìí, γινώσκω lè túmọ̀ sí pé ẹni kò mọ ohun tí ó ń ṣe tàbí kò lóye rẹ̀. “Kò lóye” pa ìjà inú ọkàn tí Pọ́ọ̀lù ń ṣàpèjúwe mọ́ láìsọ pé kò mọ iṣẹ́ náà rárá.
- source_word: πράσσω / ποιῶ
  choice: mo ń ṣe / mo ń ṣe
  rationale: Àwọn ọ̀rọ̀ Gíríìkì méjèèjì tọ́ka sí ṣíṣe ohun kan. Yorùbá kò nílò láti fi ìyàtọ̀ ọ̀rọ̀ tí kò ṣe kedere nínú àyíká yìí kún ẹsẹ náà.
- source_word: μισῶ
  choice: mo kórìíra
  rationale: “Kórìíra” jẹ́ ìtumọ̀ tààrà àti adayeba fún ìmọ̀lára líle tí μισέω ń sọ.
- source_word: τοῦτο
  choice: gan-an
  rationale: Ní ìpín gbólóhùn ìkẹyìn, τοῦτο ń tẹnu mọ́ pé ohun náà gan-an ni ẹni náà ń ṣe; “gan-an” mú ìtẹnumọ́ yẹn jáde ní Yorùbá adayeba.
theological_decisions:
- issue: Ta ni “èmi” ń tọ́ka sí nínú àríyànjiyàn Róòmù 7?
  choice: A pa ọ̀rọ̀ ẹni-kìíní “èmi” mọ́ láìṣe àlàyé ìdánimọ̀ rẹ̀.
  alternative: Ṣíṣe kedere pé ó jẹ́ Pọ́ọ̀lù gẹ́gẹ́ bí onígbàgbọ́, aláìgbàgbọ́, tàbí ẹni tí ó dúró fún Ísírẹ́lì.
  rationale: Ẹsẹ Gíríìkì fúnra rẹ̀ kò yanjú àríyànjiyàn yẹn; ìtumọ̀ kò gbọ́dọ̀ fi ẹ̀kọ́ ẹgbẹ́ kan sínú ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ γάρ kejì sí gbólóhùn àkọ́kọ́
  choice: “nítorí”
  alternative: “ìyẹn ni pé” tàbí fífi ìsopọ̀ náà sílẹ̀.
  rationale: 'γάρ fi ìdí tí ẹni náà fi sọ pé kò lóye ohun tí ó ń ṣe hàn: kì í ṣe ohun tí ó fẹ́ ni ó ń ṣe. “Nítorí” pa ìbáṣepọ̀ ìdí yìí mọ́.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “mò ń” gẹ́gẹ́ bí ìsúnkì adayeba ti “mo ń” lẹ́yìn “tí,” láìdín ìyì ọ̀rọ̀ kù.
