review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìṣọ̀kan ìdí méjì ti γάρ, ìfẹ́ ẹni-kìíní, àti ìfaradà láàárín ohun tí ẹni náà fẹ́ àti ohun tí ó kórìíra mọ́. Síbẹ̀, “mò ń ṣe” jẹ́ ìkọ̀wé tí kò tọ́ fún “mo ń ṣe.” Àtúnṣe náà tún yọ “èmi” kúrò, nítorí pé kò sí ọ̀rọ̀ arọ́pò-orúkọ ẹni-kìíní tí a tẹnu mọ́ nínú Gíríìkì, ó sì sọ οὐ γινώσκω ní ọ̀nà Yorùbá adayeba: “kò yé mi.”'
  naturalness: “Ohun tí mo ń ṣe kò yé mi” jẹ́ gbolohun Yorùbá boṣewa, ó sì yẹra fún ìṣúnkì “mò ń” tí ó lè dà bí ọ̀rọ̀-ìṣe “mọ̀.” Ìlànà ìtẹnumọ́ “... ni mo ń ṣe” dáa fún τοῦτο nínú àwọn gbolohun méjèèjì.
  terminology: “Kórìíra” jẹ́ ìtumọ̀ tó yẹ fún μισῶ. Kí a má fi “gan-an” kún un dára, nítorí pé ó lè sọ ìwọ̀n ìkórìíra di líle ju ohun tí Gíríìkì sọ lọ; ìtẹnumọ́ τοῦτο ti wà nínú ìṣètò ìfọkànsìn Yorùbá náà.
  issues:
  - severity: medium
    issue: Ìkọ̀wé “mò ń ṣe”
    rationale: Ní Yorùbá boṣewa, ọ̀rọ̀ arọ́pò-orúkọ ẹni-kìíní nínú gbólóhùn náà ni “mo,” nítorí náà a kọ ọ́ sí “tí mo ń ṣe.” “Mò” lè dà bí ọ̀rọ̀-ìṣe “mọ̀,” ó sì lè dá òye dúró.
  - severity: low
    issue: “èmi” ń fi ìtẹnumọ́ kún un
    rationale: SBLGNT ní ὃ γὰρ κατεργάζομαι, kì í sì ní ἐγώ tí a tẹnu mọ́. A lè fi koko ẹni-kìíní hàn pẹ̀lú “mo” láìfikún ìtẹnumọ́.
  - severity: low
    issue: “gan-an” lè túmọ̀ sí ìkórìíra tó pọ̀ gidigidi
    rationale: τοῦτο ń tọ́ka sí ohun náà tí a mẹ́nu kàn, kì í ṣe ìwọ̀n ìmọ̀lára ìkórìíra. Ìfọkànsìn “ohun tí mo kórìíra ni mo ń ṣe” ti mú ìtọ́kasí náà hàn.
  revised_text: Nítorí ohun tí mo ń ṣe kò yé mi; nítorí kì í ṣe ohun tí mo fẹ́ ni mo ń ṣe, ṣùgbọ́n ohun tí mo kórìíra ni mo ń ṣe.
