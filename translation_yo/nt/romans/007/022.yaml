lexical_decisions:
- source_word: συνήδομαι
  choice: inú mi ń dùn sí
  rationale: Ó fi ìfẹ́ inú àti ìtẹ́wọ́gbà pẹ̀lú ayọ̀ hàn, kì í ṣe pé ẹni náà kàn gbà á lọ́kàn.
- source_word: νόμῳ τοῦ θεοῦ
  choice: òfin Ọlọ́run
  rationale: “Òfin” pa ìtumọ̀ νόμος àti ìwúwo rẹ̀ nínú lẹ́tà Róòmù mọ́; ìsopọ̀ orúkọ yìí sì jẹ́ ọ̀nà àdánidá láti sọ genitive náà ní Yorùbá.
- source_word: κατὰ
  choice: ní ti
  rationale: Ó fi ojú-ìwòye tàbí apá ẹni tí ọ̀rọ̀ náà kàn hàn, ó sì sún mọ́ “according to/with respect to” ju fífi ọ̀rọ̀ náà sí ibi kan lọ.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: ẹni inú mi
  rationale: Ó pa àwòrán ẹni inú mọ́ ní Yorùbá àdánidá. “Mi” wá láti àyíká ẹni-kìíní, bí ó tilẹ̀ jẹ́ pé kò sí gẹ́gẹ́ bí ọ̀rọ̀ ọ̀tọ̀ nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ nípa irú ẹni tí “ẹni inú” ń tọ́ka sí
  choice: ẹni inú mi
  alternative: ẹni inú; ìwà inú mi; gbogbo ohun tí mo jẹ́ nínú
  rationale: Ìtúmọ̀ náà pa àkàwé Pọ́ọ̀lù mọ́ láìsọ ọ́ di ẹ̀kọ́ pàtó nípa bí a ṣe pín ẹ̀dá ènìyàn sí apá.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní. “Inú mi ń dùn sí” jẹ́ àdánidá fún ayọ̀ àti ìtẹ́wọ́gbà; “ní ti ẹni inú mi” pa ipa κατὰ àti àkàwé Pọ́ọ̀lù mọ́.
