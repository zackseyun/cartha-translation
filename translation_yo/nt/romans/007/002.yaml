id: ROM.7.2
reference: Romans 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: yo
  text: Nítorí obìnrin tí ó ní ọkọ ni a fi òfin dè mọ́ ọkọ rẹ̀ nígbà tí ọkọ rẹ̀ ṣì wà láàyè; ṣùgbọ́n bí ọkọ náà bá kú, a ti dá a sílẹ̀ kúrò nínú òfin ọkọ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ti di òmìnira kúrò nínú òfin ọkọ rẹ̀”; ó ṣeé ṣe kí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ìdè òfin tí ó so obìnrin náà mọ́ ọkọ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: obìnrin tí ó ti gbé ọkọ
  rationale: Ó túmọ̀ sí obìnrin tí ìdè ìgbéyàwó wà lórí; gbólóhùn yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: τῷ ζῶντι ἀνδρί
  choice: mọ́ ọkọ rẹ̀ nígbà tí ọkọ náà bá ṣì wà láàyè
  rationale: Ó fi hàn pé ìdè náà wà níwọ̀n ìgbà tí ọkọ rẹ̀ bá wà láàyè, gẹ́gẹ́ bí ìtumọ̀ ọ̀rọ̀ Gíríìkì.
- source_word: δέδεται
  choice: ni a fi ... dè mọ́
  rationale: Perfect passive náà ń tọ́ka sí ipò ìdè tí ó ń bá a lọ lẹ́yìn tí a ti dè é; ọ̀rọ̀ Yorùbá yìí pa àwòrán ìdè náà mọ́.
- source_word: νόμῳ
  choice: fi òfin
  rationale: A lo ‘òfin’ ní ọ̀nà gbogbogbò fún ìlànà òfin tó ń darí ìgbéyàwó, láì sọ ọ́ di Òfin Mósè ní pàtó.
- source_word: κατήργηται
  choice: ó ti bọ́ kúrò lábẹ́
  rationale: Ó sọ ìdásílẹ̀ kúrò nínú agbára tàbí ojúṣe òfin ní èdè Yorùbá tó ṣe kedere, ó sì fi ipa perfect náà hàn.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: kúrò lábẹ́ òfin ọkọ náà
  rationale: Ó pa ìṣọ̀kan genitive Gíríìkì ‘òfin ọkọ náà’ mọ́, bó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí ìdè òfin tó so obìnrin náà mọ́ ọkọ rẹ̀.
theological_decisions:
- issue: Bóyá νόμῳ / τοῦ νόμου ń tọ́ka sí Òfin Mósè ní pàtó tàbí sí ìlànà òfin ìgbéyàwó lápapọ̀
  choice: ìlànà òfin ìgbéyàwó lápapọ̀
  alternative: Òfin Mósè bí ó ṣe kan ìgbéyàwó
  rationale: Àyíká ẹsẹ̀ náà jẹ́ àpẹẹrẹ ìgbéyàwó nípa bí ikú ṣe ń tú ènìyàn sílẹ̀ kúrò lábẹ́ òfin; àìsí article pẹ̀lú νόμῳ àti àyíká ìgbéyàwó ṣe àtìlẹ́yìn fún ìtumọ̀ gbogbogbò yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘obìnrin tí ó ti gbé ọkọ’ dípò gbólóhùn líle bí ‘obìnrin lábẹ́ ọkọ,’ a sì pa àwòrán ìdè òfin mọ́.
