id: ROM.7.8
reference: Romans 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀ṣẹ̀, nígbà tí ó ti gba àǹfààní kan nípasẹ̀ àṣẹ náà[a], mú gbogbo ìfẹ́kúfẹ̀ẹ́[b] wáyé nínú mi. Nítorí láìsí òfin, ẹ̀ṣẹ̀ ti kú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àǹfààní láti ṣiṣẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gbogbo ìfẹ́.” Ní àyíká ọ̀rọ̀ yìí, ó ní ìtumọ̀ ìfẹ́kúfẹ̀ẹ́, ní pàtàkì ìfẹ́ láti ní ohun tí a kì í yẹ kí ẹni fẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν ... λαβοῦσα
  choice: lílo ... láti gba àǹfààní
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi ẹ̀ṣẹ̀ hàn bí agbára kan tí ó lo àṣẹ náà gẹ́gẹ́ bí àǹfààní láti ṣiṣẹ́; ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó tún pa àpèjúwe Gíríìkì mọ́.
- source_word: ἡ ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: A fi ẹ̀ṣẹ̀ sí ipò olùṣe gẹ́gẹ́ bí Gíríìkì ṣe ṣe, kí àsọ̀ròsọ tí ó sọ ẹ̀ṣẹ̀ di bí ẹni pé ó ń gbé ìgbésẹ̀ má bàjẹ́.
- source_word: διὰ τῆς ἐντολῆς
  choice: nípa lílo àṣẹ náà
  rationale: Ọ̀rọ̀ atọ́ka náà tọ́ka sí àṣẹ pàtó tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, διὰ sì fi àṣẹ náà hàn gẹ́gẹ́ bí ohun tí ẹ̀ṣẹ̀ fi ṣiṣẹ́.
- source_word: κατειργάσατο
  choice: mú ... wáyé
  rationale: Ó sọ pé ẹ̀ṣẹ̀ fa àbájáde kan jáde tàbí mú un ṣẹlẹ̀; gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: gbogbo onírúurú ojúkòkòrò
  rationale: Nítorí àṣẹ tí ó lòdì sí ojúkòkòrò ni àyíká ọ̀rọ̀ náà ń sọ̀rọ̀ nípa rẹ̀, ‘ojúkòkòrò’ mú ìtumọ̀ pàtó ibí yìí jáde; ‘gbogbo onírúurú’ sì fi πᾶσαν hàn lọ́nà àdánidá.
- source_word: χωρὶς γὰρ νόμου
  choice: nítorí láìsí òfin
  rationale: ‘Nítorí’ pa ipa ìṣàlàyé γάρ mọ́, ‘láìsí òfin’ sì tú χωρὶς νόμου ní ṣókí láìfi ìtumọ̀ míì kún un.
- source_word: νεκρά
  choice: ti kú
  rationale: A pa àpèjúwe líle ti ‘kú’ mọ́ dípò ṣíṣe àlàyé rẹ̀ sí ‘kò ṣiṣẹ́ mọ́.’
theological_decisions:
- issue: Bóyá kí a rọ àsọ̀ròsọ tí ó fi ẹ̀ṣẹ̀ hàn bí agbára tí ń gbé ìgbésẹ̀, tàbí kí a tú ‘kú’ sí ọ̀rọ̀ àlàyé.
  choice: A fi ẹ̀ṣẹ̀ sí ipò olùṣe, a sì sọ pé ‘ẹ̀ṣẹ̀ ti kú.’
  alternative: Kí a sọ ẹ̀ṣẹ̀ bí èrò lásán, tàbí kí a tú νεκρά sí ‘ẹ̀ṣẹ̀ kò ṣiṣẹ́.’
  rationale: Gíríìkì fi ẹ̀ṣẹ̀ hàn bí agbára tí ó gba àǹfààní, tí ó sì mú ohun kan wáyé; ó tún lo àpèjúwe ‘kú.’ Títọ́jú àwọn ọ̀rọ̀ wọ̀nyí pa ìṣòro àti ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́ láìyanju rẹ̀ fún òǹkàwé.
translation_notes:
  register: A lo Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Gbólóhùn náà pa ẹ̀ṣẹ̀ mọ́ gẹ́gẹ́ bí olùṣe, ó sì yà ‘àṣẹ náà’ (ἐντολή) sọ́tọ̀ sí ‘òfin’ (νόμος). A gbé àmì àlàyé ìsàlẹ̀ sí ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
