  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́jú ẹ̀ṣẹ̀ gẹ́gẹ́ bí olùṣe, ó sì ya ‘àṣẹ náà’ sọ́tọ̀ sí ‘òfin.’ Síbẹ̀, ‘nípa lílo àṣẹ náà láti gba àǹfààní’ mú kí ẹ̀ṣẹ̀ dà bí ẹni tí ó ń lo àṣẹ náà láti gba àǹfààní, dípò kí ó gba àǹfààní náà nípasẹ̀ àṣẹ náà, gẹ́gẹ́ bí ìkọ́ Gíríìkì ṣe sọ. ‘Ojúkòkòrò’ sì lè fi ìfẹ́ ọrọ̀/ojúkòkòrò nìkan hàn, níbi tí ἐπιθυμία ti gbòòrò sí i.
  naturalness: Àtúnṣe náà ń lo ìtọ́kasí àsìkò tí ó ṣe kedere, ‘nígbà tí ó ti gba àǹfààní kan nípasẹ̀ àṣẹ náà,’ tí ó jẹ́ Yorùbá àdánidá, tí ó sì pa ìbáṣepọ̀ participle Gíríìkì àti ọ̀rọ̀-ìṣe pàtàkì mọ́.
  terminology: ‘Ìfẹ́kúfẹ̀ẹ́’ bójú mu ἐπιθυμία dáadáa, ó sì lè tọ́ka sí ìfẹ́ tí kò bófin mu, pẹ̀lú ìtumọ̀ ‘ìfẹ́ láti ní ohun’ tí àyíká àṣẹ lòdì sí ìfẹ́kúfẹ̀ẹ́ ń pè. ‘Ti kú’ yẹ kí ó dúró láti pa àpèjúwe νεκρά mọ́.
