id: ROM.7.3
reference: Romans 7:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: yo
  text: Nítorí náà, nígbà tí ọkọ rẹ̀ ṣì wà láàyè, a ó pè é ní obìnrin panṣágà bí ó bá di aya ọkùnrin mìíràn.[a] Ṣùgbọ́n bí ọkọ náà bá kú, ó bọ́ lọ́wọ́ òfin náà,[b] tó fi jẹ́ pé kì í ṣe obìnrin panṣágà nígbà tí ó bá di aya ọkùnrin mìíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí ó bá di ti ọkùnrin mìíràn” tàbí “bí ó bá darapọ̀ mọ́ ọkùnrin mìíràn.”
    reason: lexical_alternative
  - marker: b
    text: “Òfin” níbí tọ́ka lẹ́sẹ̀kẹsẹ̀ sí ìdè òfin tó ń ṣàkóso ìbáṣepọ̀ ìgbéyàwó.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: nígbà tí ọkọ rẹ̀ ṣì wà láàyè
  rationale: Ó mú ìtumọ̀ àkókò inú genitive absolute jáde kedere; àyíká ọ̀rọ̀ ló fi hàn pé ọkùnrin náà ni ọkọ obìnrin náà.
- source_word: μοιχαλὶς
  choice: obìnrin panṣágà
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka pàtó sí obìnrin tí ó ṣe panṣágà; fífi ‘obìnrin’ kún un mú ìyàtọ̀ akọ àti abo inú ọ̀rọ̀ orísun hàn.
- source_word: χρηματίσει
  choice: a ó pè é ní
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pé a ó fi orúkọ tàbí ipò kan pè é; gbólóhùn Yorùbá yìí bá ìtumọ̀ náà mu láìdi ọ̀rọ̀ náà le.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: bí ó bá di ti ọkùnrin mìíràn
  rationale: Ó pa àìfihàn pàtó inú gbolohun Gíríìkì mọ́ pé obìnrin náà wọ ìbáṣepọ̀ pẹ̀lú ọkùnrin mìíràn, láìfi ‘aya’ kún ohun tí ọ̀rọ̀ orísun kò sọ ní tààràtà.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: ó ti bọ́ lọ́wọ́ òfin náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé agbára tàbí ìdè òfin náà kò wà lórí rẹ̀ mọ́, nígbà tí a ṣì pa ọ̀rọ̀ ‘òfin’ mọ́.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: tó fi jẹ́ pé kì í ṣe obìnrin panṣágà
  rationale: Ó sọ àbájáde ìdásílẹ̀ náà ní Yorùbá tó rọrùn, ó sì pa ìbáṣepọ̀ ọgbọ́n inú articular infinitive mọ́.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ νόμος nínú àpẹẹrẹ náà
  choice: òfin náà
  alternative: òfin ìgbéyàwó náà; Òfin Mósè ní ìtumọ̀ gbòòrò
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ ń sọ nípa ìdè òfin tó ń ṣàkóso ìbáṣepọ̀ ọkọ àti aya. Síbẹ̀, títúmọ̀ rẹ̀ sí ‘òfin náà’ pa ọ̀rọ̀ Pọ́ọ̀lù mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn tó gbòòrò lé e lórí.
- issue: Ìtumọ̀ ìbáṣepọ̀ nínú γένηται ἀνδρὶ ἑτέρῳ
  choice: bí ó bá di ti ọkùnrin mìíràn
  alternative: bí ó bá di aya ọkùnrin mìíràn; bí ó bá darapọ̀ mọ́ ọkùnrin mìíràn
  rationale: Yíyan ‘di ti’ pa ìtumọ̀ ìbáṣepọ̀ náà mọ́ láìpinnu ju ọ̀rọ̀ Gíríìkì lọ pé ìgbéyàwó tuntun ní pàtó ni.
translation_notes:
  register: A lo Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, tí ó bójú mu, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Obìnrin panṣágà’ pa ìtọ́kasí abo inú Gíríìkì mọ́; ‘bọ́ lọ́wọ́ òfin’ sì jẹ́ àdánidá ju ìtumọ̀ líle ti ‘jẹ́ òmìnira kúrò nínú òfin’ lọ.
