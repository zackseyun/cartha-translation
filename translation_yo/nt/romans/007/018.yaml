revisions:
- from: Nítorí mo mọ̀ pé ohun rere kan kò gbé inú mi—èyíinì ni, inú ẹran ara mi.[a] Nítorí ìfẹ́ láti ṣe rere wà pẹ̀lú mi, ṣùgbọ́n ṣíṣe ohun rere kò sí.
  to: Nítorí mo mọ̀ pé kò sí ohun rere kankan tí ń gbé nínú mi—ìyẹn ni, nínú ara mi.[a] Nítorí ìfẹ́ láti ṣe ohun rere wà pẹ̀lú mi, ṣùgbọ́n ṣíṣe ohun rere kò wà pẹ̀lú mi.
  rationale: Àtúnṣe náà mú ìfẹ̀sùn Gíríìkì lórí ἀγαθόν hàn ní kíkún, ó sì tún ìfararora ‘wà pẹ̀lú mi / kò wà pẹ̀lú mi’ ṣe. A lo ‘ara mi’ fún σάρξ láti pa ọ̀rọ̀ náà mọ́ ní ìtumọ̀ rẹ̀ tí kò fi ẹ̀kọ́ ìtumọ̀ kan lé e lórí. Àmì akọsílẹ̀ náà wà ní ibi ìtọ́ka tó yẹ, ó sì ń fúnni ní ìyàn míràn láìyí ìtumọ̀ ẹsẹ̀ náà padà.
