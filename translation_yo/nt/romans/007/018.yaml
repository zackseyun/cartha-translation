id: ROM.7.18
reference: Romans 7:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: yo
  text: Nítorí mo mọ̀ pé kò sí ohun rere kankan tí ń gbé nínú mi—ìyẹn ni, nínú ara mi.[a] Nítorí ìfẹ́ láti ṣe ohun rere wà pẹ̀lú mi, ṣùgbọ́n ṣíṣe ohun rere kò wà pẹ̀lú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà ẹlẹ́ṣẹ̀ mi” dípò “ara mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: mo mọ̀
  rationale: Ọ̀rọ̀-ìṣe náà ní ìtumọ̀ àsìkò ìsinsìnyí níbí; ‘mo mọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá àti tààrà.
- source_word: οἰκεῖ
  choice: gbé inú
  rationale: ‘Gbé inú’ pa àwòrán ohun tí ń gbé inú ènìyàn mọ́, ó sì bá ọ̀rọ̀ Pọ́ọ̀lù mu.
- source_word: ἀγαθόν
  choice: ohun rere kan
  rationale: Pẹ̀lú οὐκ, ọ̀rọ̀ ajẹtífù aláìní àpilẹ̀kọ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ; ‘ohun rere kan kò’ jẹ́ Yorùbá àdánidá fún ìtumọ̀ náà.
- source_word: σάρξ
  choice: ẹran ara
  rationale: Yíyan ‘ẹran ara’ dípò àlàyé bí ‘ìwà ẹlẹ́ṣẹ̀’ pa ọ̀rọ̀ Pọ́ọ̀lù àti ìṣòro ìtumọ̀ rẹ̀ mọ́ láìfi ẹ̀kọ́ ìtumọ̀ kan lé e lórí.
- source_word: θέλειν
  choice: ìfẹ́ láti ṣe rere
  rationale: Bí ó tilẹ̀ jẹ́ pé infinitive náà jẹ́ substantival, Yorùbá nílò àlàyé díẹ̀ kí ìtumọ̀ rẹ̀ ṣe kedere; ‘ìfẹ́ láti ṣe rere’ túmọ̀ ìfẹ́ inú láti ṣe ohun rere ní àdánidá.
- source_word: παράκειταί μοι
  choice: wà pẹ̀lú mi
  rationale: Èyí fi ìmọ̀ pé ìfẹ́ náà wà nítòsí ẹni tó ń sọ̀rọ̀ hàn, ó sì pa dative μοι mọ́.
- source_word: κατεργάζεσθαι
  choice: ṣíṣe
  rationale: ‘Ṣíṣe’ jẹ́ orúkọ-ìṣe tí ó bá θέλειν tó jẹ́ substantival mu, ó sì mú ìfìwéra ìfẹ́ àti ìṣe dúró.
- source_word: τὸ καλόν
  choice: ohun rere
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ, tí ó ń tọ́ka sí ohun tó dára ní ti ìwà.
- source_word: οὔ
  choice: kò sí
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ ní òpin; ‘kò sí’ jẹ́ ìkúnwọ̀n Yorùbá tó kéré jù, tó sì pa gbolohun kúkúrú náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ Pọ́ọ̀lù tó ní í ṣe pẹ̀lú ìwà àti ẹ̀ṣẹ̀
  choice: ẹran ara
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: ‘Ẹran ara’ jẹ́ kí ọ̀rọ̀ Pọ́ọ̀lù dúró pẹ̀lú gbogbo ìṣòro ìtumọ̀ rẹ̀, láìyànjú rẹ̀ sí ẹ̀kọ́ pé ó túmọ̀ sí ‘ìwà ẹlẹ́ṣẹ̀’ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘èyíinì ni’ láti fi τοῦτ’ ἔστιν hàn gẹ́gẹ́ bí àlàyé tó tẹ̀ lé ọ̀rọ̀ ṣáájú.
