id: ROM.7.5
reference: Romans 7:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: yo
  text: Nítorí nígbà tí a wà nínú ẹran ara[a], àwọn ìfẹ́kúfẹ̀ẹ́ ẹ̀ṣẹ̀[b] tí ń ṣiṣẹ́ nípasẹ̀ òfin ń ṣiṣẹ́ nínú àwọn ẹ̀yà ara wa[c], láti so èso fún ikú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ipò ènìyàn wa tí ẹ̀ṣẹ̀ ti bà jẹ́,” tàbí “ní abẹ́ agbára ìwà ẹ̀ṣẹ̀.”
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “àwọn ìfẹ́kúfẹ̀ẹ́ àwọn ẹ̀ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: “Àwọn ẹ̀yà ara” níhìn-ín túmọ̀ sí àwọn apá ara tàbí agbára inú ènìyàn tí a ń lò gẹ́gẹ́ bí irinṣẹ́ ìṣe.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: ẹran ara
  rationale: Ó pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù mọ́, ó sì yẹra fún yíyan ìtumọ̀ ẹ̀kọ́ kan ṣoṣo fún gbólóhùn ἐν τῇ σαρκί; àlàyé ìsàlẹ̀ ojú ìwé fi ìtumọ̀ àpèjúwe rẹ̀ hàn.
- source_word: παθήματα
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí àwọn ìmọ̀lára tàbí ìfẹ́ inú tí ń fa ènìyàn sí ẹ̀ṣẹ̀, kì í ṣe sí ìjìyà.
- source_word: τῶν ἁμαρτιῶν
  choice: ẹ̀ṣẹ̀
  rationale: Gbólóhùn ‘àwọn ìfẹ́kúfẹ̀ẹ́ ẹ̀ṣẹ̀’ jẹ́ èdè Yorùbá tó ṣe déédé, ó sì fi hàn pé ẹ̀ṣẹ̀ ló ń dá àwọn ìfẹ́kúfẹ̀ẹ́ náà mọ̀.
- source_word: διὰ τοῦ νόμου
  choice: tí ó wá nípasẹ̀ òfin
  rationale: Ó pa agbára ọ̀nà tàbí ìdí ti διά mọ́ láì fi kún un ní pàtó pé òfin ‘ru wọn sókè,’ èyí tí yóò túmọ̀ ọ̀rọ̀ náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἐνηργεῖτο
  choice: ń ṣiṣẹ́
  rationale: Àmì àkókò ń- fi iṣẹ́ tí ń bá a lọ ní àkókò tí a ń sọ̀rọ̀ rẹ̀ hàn, gẹ́gẹ́ bí imperfect Gíríìkì.
- source_word: μέλεσιν
  choice: àwọn ẹ̀yà ara wa
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn apá ara, ó sì lè ní ìtumọ̀ pé àwọn apá náà jẹ́ irinṣẹ́ ìṣe.
- source_word: καρποφορῆσαι
  choice: láti so èso
  rationale: Ó pa àpèjúwe ewéko àti èso tí Pọ́ọ̀lù lò mọ́.
- source_word: τῷ θανάτῳ
  choice: fún ikú
  rationale: Ó pa ìdarí tàbí àbájáde èso náà sí ikú mọ́ ní ọ̀nà ṣókí.
theological_decisions:
- issue: 'Bí a ṣe yẹ kí a túmọ̀ ἐν τῇ σαρκί: ní ti gidi gẹ́gẹ́ bí ‘nínú ẹran ara’ tàbí ní ìtumọ̀ àpèjúwe gẹ́gẹ́ bí ipò ènìyàn tí ẹ̀ṣẹ̀ ti bà jẹ́.'
  choice: nínú ẹran ara
  alternative: nínú ipò ènìyàn wa tí ẹ̀ṣẹ̀ ti bà jẹ́
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa èdè àti ìforígbárí ẹ̀kọ́ inú ọ̀rọ̀ Pọ́ọ̀lù mọ́; àlàyé ìsàlẹ̀ ojú ìwé ń ran òǹkàwé lọ́wọ́ láì sọ pé ìtumọ̀ kan ṣoṣo ni ó ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye ni a lò. A pa àwọn àwòrán pàtàkì ‘ẹran ara,’ ‘ẹ̀yà ara,’ àti ‘so èso’ mọ́, pẹ̀lú àmì ohùn níbi tí ó bá bá ìlò àdánidá mu.
