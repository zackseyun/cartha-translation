id: ROM.7.7
reference: Romans 7:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: yo
  text: Ǹjẹ́ kí ni àwa yóò wí? Ṣé òfin jẹ́ ẹ̀ṣẹ̀? Kí ó má ṣe rí bẹ́ẹ̀ láéláé! Kàkà bẹ́ẹ̀, èmi kì bá tí mọ ẹ̀ṣẹ̀ bí kò ṣe nípasẹ̀ òfin. Nítorí èmi kì bá tí mọ ojúkòkòrò[a] bí òfin kò bá sọ pé, “Ìwọ kò gbọdọ̀ ṣe ojúkòkòrò.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìfẹ́-ọkàn” dípò “ojúkòkòrò” (ἐπιθυμία); ṣùgbọ́n àṣẹ tí ó tọ́ka sí lẹ́sẹ̀kẹsẹ̀ mú kí ìtumọ̀ pàtó náà ṣeé fẹ́ jù níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Ǹjẹ́ kí ni àwa yóò wí?
  rationale: Ó pa ìbéèrè aláwíyé Pọ́ọ̀lù mọ́, ó sì jẹ́ Yorùbá àdánidá tí ó ní iyì.
- source_word: ὁ νόμος
  choice: òfin
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún νόμος; nínú àyíká yìí ó tọ́ka sí Òfin Mósè.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó sì pa agbára ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- source_word: μὴ γένοιτο
  choice: Kí ó má ṣe rí bẹ́ẹ̀ láéláé!
  rationale: Ó fi agbára ìkọ̀sílẹ̀ gbólóhùn Gíríìkì hàn ju ‘Rárá’ lásán lọ.
- source_word: ἀλλὰ
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi ìyàtọ̀ alágbára àti àtúnṣe èrò hàn lẹ́yìn ìkọ̀sílẹ̀ náà.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: èmi kì bá tí mọ ẹ̀ṣẹ̀ bí kò ṣe nípasẹ̀ òfin
  rationale: Ìlò ‘kì bá tí mọ’ mú ìtumọ̀ ipò àròsọ tí εἰ μὴ ń gbé jáde hàn ní Yorùbá àdánidá.
- source_word: ἐπιθυμίαν
  choice: ojúkòkòrò
  rationale: Bí ọ̀rọ̀ náà tilẹ̀ lè túmọ̀ sí ìfẹ́-ọkàn ní gbòòrò, àṣẹ tí Pọ́ọ̀lù tọ́ka sí lẹ́sẹ̀kẹsẹ̀ mú ‘ojúkòkòrò’ yẹ níbí.
- source_word: οὐκ ᾔδειν
  choice: kì bá tí mọ
  rationale: Ó pa ìbáramu pẹ̀lú gbólóhùn tó ṣáájú mọ́, bó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì méjèèjì yàtọ̀.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Ìwọ kò gbọdọ̀ ṣe ojúkòkòrò
  rationale: Ó sọ àṣẹ ìdènà náà ní Yorùbá kedere, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ‘ojúkòkòrò’ mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín òfin àti ẹ̀ṣẹ̀
  choice: Ṣé òfin jẹ́ ẹ̀ṣẹ̀?
  alternative: Ṣé òfin kún fún ẹ̀ṣẹ̀?
  rationale: Orúkọ àsọyé Gíríìkì béèrè bóyá òfin àti ẹ̀ṣẹ̀ jẹ́ ohun kan náà, kì í ṣe kìkì bóyá òfin ní ànímọ́ ẹ̀ṣẹ̀; ìtumọ̀ yìí pa ìbéèrè líle Pọ́ọ̀lù mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A fi àmì àlàyé [a] sí ọ̀dọ̀ ọ̀rọ̀ tí àlàyé náà kan ní tààrà.
