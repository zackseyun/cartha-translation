source:
  edition: SBLGNT
  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: yo
  text: Èmi, ènìyàn aláìláárí! Ta ni yóò gbà mí kúrò nínú ara ikú yìí?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ ní ọ̀rọ̀-ọ̀rọ̀ pé, “ara ti ikú yìí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “yọ mí sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: ènìyàn òṣì
  rationale: Nínú ọ̀rọ̀ yìí, “òṣì” ń sọ ipò ẹni tí ìpọ́njú àti ìbànújẹ́ rẹ̀ pọ̀, kì í ṣe òṣì ọrọ̀ nìkan. Gbólóhùn kúkúrú náà pa agbára igbe ìrora Paulu mọ́.
- source_word: ἐγὼ ἄνθρωπος
  choice: Èmi ènìyàn
  rationale: Ó tẹnumọ́ pé Paulu ń sọ nípa ara rẹ̀. Èdè Yorùbá kò fi akọ tàbí abo hàn nínú “ènìyàn,” ṣùgbọ́n ó ṣàfihàn ἄνθρωπος lọ́nà àdánidá.
- source_word: τίς
  choice: Ta ni
  rationale: Ìbéèrè náà ń wá ẹni tí yóò gba Paulu, nítorí náà “Ta ni” ni ìtumọ̀ Yorùbá tí ó ṣe kedere jù.
- source_word: ῥύσεται
  choice: yóò gbà mí
  rationale: “Gbà mí” fi ìgbàlà ẹni kúrò nínú ewu tàbí ìdè hàn, ó sì bá ἐκ tí ó tẹ̀ lé e mu ní “gbà mí kúrò nínú.”
- source_word: ἐκ
  choice: kúrò nínú
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ìyọkúrò láti inú ohun kan hàn ní Yorùbá àdánidá.
- source_word: σώματος
  choice: ara
  rationale: “Ara” pa àwòrán gidi tí ọ̀rọ̀ Gíríìkì ní mọ́ láìsọ ọ́ di àlàyé ẹ̀kọ́ ìgbàgbọ́.
- source_word: τοῦ θανάτου τούτου
  choice: ikú yìí
  rationale: Ó tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì pa ìbáṣepọ̀ tí kò ṣe kedere pátápátá láàárín ara àti ikú mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ σώματος τοῦ θανάτου τούτου láìyanju ìtumọ̀ rẹ̀ jù
  choice: ara ikú yìí
  alternative: ara tí ikú ti dè mọ́ yìí
  rationale: “Ara ikú yìí” pa àwòrán àti àìdánilójú ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́; àṣàyàn kejì lè fi èrò ìtumọ̀ kan kún un tí ẹsẹ náà kò sọ ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní iyì, ó sì rọrùn fún òǹkàwé òde òní. Gbólóhùn àkọ́kọ́ jẹ́ igbe ìrora kúkúrú; a kò fi ọ̀rọ̀ àlàyé kún un. Àwọn àmì ohùn ni a lò níbi tí ó yẹ.
