id: ROM.7.20
reference: Romans 7:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo bá ń ṣe ohun tí èmi kò fẹ́, kì í ṣe èmi mọ́ ni mo ń ṣe é, bí kò ṣe ẹ̀ṣẹ̀ tí ń gbé inú mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó ń tẹ̀ síwájú nínú àríyànjiyàn oníwà-ìpèníjà Pọ́ọ̀lù, ó sì fi ìyàtọ̀ díẹ̀ hàn lọ́nà tí ó bá èdè Yorùbá mu.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: mo bá ń ṣe ohun tí èmi kò fẹ́
  rationale: Ó pa ìtumọ̀ ìṣe ohun tí ẹni náà kò fẹ́ mọ́, èyí sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere; “èmi” mú ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà jáde.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: kì í ṣe èmi mọ́ ni mo ń ṣe é
  rationale: “Mọ́” fi ìtumọ̀ οὐκέτι hàn, ìṣètò “kì í ṣe èmi ... ni” sì pa ìtẹnumọ́ àti ìtakora ἐγώ mọ́ ní Yorùbá àdánidá.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó bá ìṣètò “kì í ṣe ... bí kò ṣe ...” mu, ó sì mú ìtakora tó lágbára láàárín “èmi” àti “ẹ̀ṣẹ̀” jáde.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: ẹ̀ṣẹ̀ tí ń gbé inú mi
  rationale: Ó túmọ̀ ἁμαρτία ní tààrà gẹ́gẹ́ bí “ẹ̀ṣẹ̀,” kì í ṣe “ìwà ẹlẹ́ṣẹ̀,” ó sì pa àwòrán ẹ̀ṣẹ̀ tí ń gbé inú ẹni mọ́.
theological_decisions:
- issue: Bóyá kí a dín ojúṣe ẹni náà kù tàbí kí a ṣàlàyé “ẹ̀ṣẹ̀” gẹ́gẹ́ bí ohun mìíràn.
  choice: Pa ìtakora Pọ́ọ̀lù mọ́ láàárín “èmi” àti “ẹ̀ṣẹ̀ tí ń gbé inú mi” láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Túmọ̀ “ẹ̀ṣẹ̀” sí “ìwà ẹlẹ́ṣẹ̀” tàbí ṣàlàyé bí ọ̀rọ̀ náà ṣe kan ojúṣe ẹni.
  rationale: Gíríìkì lo ἁμαρτία ní tààrà, ó sì mọ̀ọ́mọ̀ fi ìṣòro àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ sílẹ̀; ìtumọ̀ kò gbọ́dọ̀ yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì yé àwọn òǹkàwé lasán. A lo “ń gbé inú mi” dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn, a sì fi àmì ohùn síbi tí ó yẹ.
