  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo bá ṣe ohun tí mi ò fẹ́ ṣe, mo fohùn ṣọ̀kan pẹ̀lú òfin pé ó dára.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa ipá ọ̀rọ̀ àídájú εἰ mọ́, ó sì fi ìyàtọ̀ díẹ̀ tí δέ ní hàn ní Yorùbá àdánidá.
- source_word: ὃ … τοῦτο
  choice: ohun tí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìhun ọ̀rọ̀ ìbáṣepọ̀ náà láìsọ ọ́ di líle tàbí àjèjì.
- source_word: θέλω
  choice: fẹ́
  rationale: Ó sọ ìfẹ́ inú tí ó lòdì sí ohun tí ẹni náà ń ṣe ní kedere.
- source_word: ποιῶ
  choice: ń ṣe
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ bá ọ̀rọ̀ ìsinsìnyí Gíríìkì mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: σύμφημι
  choice: mo gbà pẹ̀lú
  rationale: Ó túmọ̀ sí jíjẹ́wọ́ tàbí fífi ara ẹni mọ́ ìdájọ́ òfin; ‘pẹ̀lú’ tún fi dative τῷ νόμῳ hàn lọ́nà àdánidá.
- source_word: νόμῳ
  choice: òfin
  rationale: Ọ̀rọ̀ náà tọ́ka sí òfin tí a ti mọ̀ nínú àyíká Róòmù, láìfi àlàyé tí kò sí nínú ẹsẹ̀ náà kún un.
- source_word: καλός
  choice: dára
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì fi ìwà rere tàbí ìyẹ̀ òfin hàn láìṣe àfikún ìtumọ̀.
theological_decisions:
- issue: Bóyá gbólóhùn Pọ́ọ̀lù jẹ́ ìjẹ́wọ́ rere nípa òfin fúnra rẹ̀
  choice: mo gbà pẹ̀lú òfin pé ó dára
  alternative: mo gbà pé òfin tọ́
  rationale: Ìtumọ̀ yìí pa ìjẹ́wọ́ gbangba pé òfin dára mọ́, ó sì dáàbò bo ìforígbárí inú ọ̀rọ̀ náà láìṣàlàyé ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘èmi’ láti tẹnumọ́ ẹni tí kò fẹ́ ìṣe náà, gẹ́gẹ́ bí ìyàtọ̀ inú ọ̀rọ̀ Gíríìkì ṣe ń ṣiṣẹ́.
