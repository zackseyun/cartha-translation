id: ROM.7.10
reference: Romans 7:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: yo
  text: Èmi sì kú, àṣẹ tí ó wà fún ìyè náà sì hàn sí mi pé ó wà fún ikú.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àṣẹ tí a pinnu fún ìyè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àṣẹ yìí gan-an sì hàn pé ó yọrí sí ikú fún mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: Èmi sì kú
  rationale: Aorist náà sọ ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀ ní tààrà; “kú” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì pa ìtumọ̀ náà mọ́.
- source_word: εὑρέθη μοι
  choice: hàn sí mi pé ó wà
  rationale: Ìtumọ̀ yìí fi irírí ẹni àkọ́kọ́ àti ohun tí ó wá mọ̀ hàn, láì tú ọ̀rọ̀ náà sí ìdí-okùnfà tí Gíríìkì kò sọ ní kedere.
- source_word: ἐντολή
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àṣẹ kan ṣoṣo, kò sì fi “òfin” kún ohun tí kò sí nínú gbólóhùn Gíríìkì.
- source_word: ἡ εἰς ζωὴν
  choice: tí ó wà fún ìyè
  rationale: “Fún ìyè” pa ìtọ́sọ́nà tàbí àbájáde tí εἰς lè fi hàn mọ́, ó sì bá àtakò tó tẹ̀ lé e mu.
- source_word: αὕτη
  choice: àṣẹ ... náà
  rationale: “Náà” mú agbára ọ̀rọ̀ atọ́ka αὕτη jáde lọ́nà àdánidá nínú Yorùbá.
- source_word: εἰς θάνατον
  choice: fún ikú
  rationale: Ó mọ̀ọ́mọ̀ ṣe àfiwé pẹ̀lú “fún ìyè,” ó sì yẹra fún ṣíṣe àlàyé ìdí-okùnfà ju ohun tí orísun sọ lọ.
theological_decisions:
- issue: Bóyá kí a tú ọ̀rọ̀ náà sí pé àṣẹ náà “mú ikú wá”
  choice: ó hàn sí mi pé ó wà fún ikú
  alternative: ó mú ikú wá fún mi
  rationale: Yíyan ọ̀rọ̀ tí kò pinnu ìdí-okùnfà ní kíkún pa ìforígbárí ẹ̀kọ́-ìgbàgbọ́ inú ẹsẹ náà mọ́, gẹ́gẹ́ bí Gíríìkì ṣe sọ àbájáde tí Pọ́ọ̀lù rí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì; a lo “ìyè” àti “ikú” láti pa àtakò inú Gíríìkì mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbólóhùn tí wọ́n jọ ń ṣàlàyé.
