source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: yo
  text: Nítorí a mọ̀ pé ti ẹ̀mí ni òfin; ṣùgbọ́n ẹni ti ara ni mí[a], ẹni tí a ti tà sábẹ́ ẹ̀ṣẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni ti ẹran ara ni mí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí a ti tà gẹ́gẹ́ bí ẹrú sábẹ́ ẹ̀ṣẹ̀,” ìyẹn ni pé, sábẹ́ agbára ẹ̀ṣẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: a mọ̀
  rationale: Ó sọ ìmọ̀ tí Pọ́ọ̀lù àti àwọn olùgbọ́ rẹ̀ jọ ní; “a mọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tó sì bójú mu.
- source_word: ὁ νόμος
  choice: òfin
  rationale: “Òfin” tẹ̀ lé ọ̀rọ̀ Gíríìkì láì fi àlàyé kún un pé Òfin Mósè ni, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà sábà máa ń ní ìtumọ̀ yẹn nínú Róòmù.
- source_word: πνευματικός
  choice: ti ẹ̀mí
  rationale: “Ti ẹ̀mí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tó ní ìbáṣepọ̀ pẹ̀lú ẹ̀mí tàbí tó ní ìwà ẹ̀mí; ó pa ìyàtọ̀ rẹ̀ mọ́ sí “ti ara” láì pinnu bóyá Ẹ̀mí Mímọ́ ni a ń tọ́ka sí ní pàtó.
- source_word: σάρκινός
  choice: ti ara
  rationale: “Ti ara” pa àwòrán ara ẹlẹ́ran àti ìtakora rẹ̀ sí “ti ẹ̀mí” mọ́. A kò lò “ẹlẹ́ṣẹ̀” tàbí “ẹni tó ní ẹ̀dá ẹ̀ṣẹ̀,” nítorí àwọn náà yóò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún Gíríìkì.
- source_word: πεπραμένος
  choice: a sì ti tà mí
  rationale: Ìsọ̀rọ̀ yìí fi ipò tó jẹ́ àbájáde títà hàn, gẹ́gẹ́ bí perfect passive participle Gíríìkì. Fífi “mí” hàn mú kí Yorùbá ṣe kedere, níwọ̀n bí ẹni àkọ́kọ́ náà ti wà nínú “èmi.”
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: sí abẹ́ ẹ̀ṣẹ̀
  rationale: “Sí abẹ́ ẹ̀ṣẹ̀” pa ọ̀rọ̀ kúkúrú Pọ́ọ̀lù àti èrò ìṣàkóso tàbí ìfìkúlẹ̀ mọ́, láì tú u sí “abẹ́ agbára ẹ̀ṣẹ̀” nínú ara ẹsẹ náà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ èdè Pọ́ọ̀lù nípa ara
  choice: Pa “ti ara” mọ́ nínú ara ẹsẹ náà.
  alternative: “ẹlẹ́ṣẹ̀,” “ẹni tó ní ẹ̀dá ẹ̀ṣẹ̀,” tàbí “ẹni tí kì í ṣe ti ẹ̀mí”
  rationale: “Ti ara” sun mọ́ σάρκινος, ó sì pa ìtakora pẹ̀lú πνευματικός mọ́ láì sọ èrò nípa ìwà ènìyàn di ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
- issue: Bóyá πνευματικός ń tọ́ka sí Ẹ̀mí Mímọ́ ní pàtó
  choice: Lo “ti ẹ̀mí” láì fi lẹ́tà ńlá pinnu ìtumọ̀ náà.
  alternative: “ti Ẹ̀mí Mímọ́”
  rationale: Gíríìkì lè tọ́ka sí ohun tó jẹ́ ti ẹ̀mí tàbí ohun tó ní ìbáṣepọ̀ pẹ̀lú Ẹ̀mí; ẹsẹ yìí fúnra rẹ̀ kò fi dandan mú wa yan ọ̀kan ṣoṣo.
- issue: Àwòrán ìfiniṣẹ́rú inú πεπραμένος ὑπὸ τὴν ἁμαρτίαν
  choice: Fi “a ti tà mí sí abẹ́ ẹ̀ṣẹ̀” sínú ara ẹsẹ, kí àlàyé ìfiniṣẹ́rú wà ní àkọsílẹ̀ ìsàlẹ̀.
  alternative: “a ti tà mí gẹ́gẹ́ bí ẹrú sábẹ́ agbára ẹ̀ṣẹ̀”
  rationale: Ìtumọ̀ ẹrú wà nínú àwòrán títà, ṣùgbọ́n fífi gbogbo àlàyé náà sínú ara ẹsẹ yóò gùn ju ọ̀rọ̀ Gíríìkì lọ, yóò sì tú “abẹ́ ẹ̀ṣẹ̀” sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀, ọlọ́lá, tó sì ṣe tààrà fún òǹkàwé òde òní. A lo “ti ẹ̀mí / ti ara” láti pa ìtakora Gíríìkì mọ́, a sì yẹra fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó lè pinnu àríyànjiyàn Pọ́ọ̀lù ṣáájú.
