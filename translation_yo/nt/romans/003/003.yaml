id: ROM.3.3
reference: Romans 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: yo
  text: Kí wá ni? Bí àwọn kan bá jẹ́ aláìṣòótọ́, àìṣòótọ́ wọn yóò ha sọ ìṣòtítọ́ Ọlọ́run di asán?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ Ọlọ́run.” Ní ìtumọ̀ gangan, gbólóhùn Gíríìkì náà ni “πίστις ti Ọlọ́run”; ṣùgbọ́n níbí ó ṣeé ṣe jù pé ó túmọ̀ sí ìṣòtítọ́ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Kí wá ni?
  rationale: Ó jẹ́ àmì ìyípadà nínú àríyànjiyàn Pọ́ọ̀lù, ó sì gbé ìbéèrè tàbí àtakò tí ó tẹ̀ lé e kalẹ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: ἠπίστησάν
  choice: kò ṣe olóòótọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà lè túmọ̀ sí àìgbàgbọ́, ṣùgbọ́n ìfarawé rẹ̀ pẹ̀lú ἀπιστία àti ìtakora rẹ̀ sí πίστις Ọlọ́run mú kí èrò àìṣòótọ́ tàbí àìṣeégbẹ́kẹ̀lé yẹ sí i.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó tọ́ka sí iye àwọn ènìyàn kan tí a kò dárúkọ ní pàtó.
- source_word: ἀπιστία
  choice: àìṣòótọ́
  rationale: Ó pa ìbámu mọ́ pẹ̀lú ἠπίστησάν, ó sì dá ìtakora sí ìṣòtítọ́ Ọlọ́run dúró; ‘àìgbàgbọ́’ ṣì jẹ́ ìtumọ̀ mìíràn tí ó ṣeé ṣe.
- source_word: πίστιν τοῦ θεοῦ
  choice: òtítọ́ Ọlọ́run
  rationale: Ẹ̀ka ọ̀rọ̀ Gíríìkì náà jẹ́ ‘πίστις ti Ọlọ́run’; níbí, ó ṣeé ṣe jù pé ó ń tọ́ka sí ìṣòtítọ́ àti jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé ti Ọlọ́run. ‘Òtítọ́ Ọlọ́run’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìwà olóòótọ́ Ọlọ́run, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń pa àṣàyàn ‘ìgbàgbọ́ Ọlọ́run’ mọ́.
- source_word: καταργήσει
  choice: sọ ... di asán
  rationale: Ó fi èrò yíyọ agbára tàbí ipa ohun kan kúrò hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πίστιν τοῦ θεοῦ nínú gbólóhùn Pọ́ọ̀lù tí ó ní àríyànjiyàn
  choice: òtítọ́ Ọlọ́run
  alternative: ìgbàgbọ́ Ọlọ́run
  rationale: Ìtakora láàárín àìṣòótọ́ ènìyàn àti πίστις Ọlọ́run tọ́ka sí ìṣòtítọ́ Ọlọ́run. Síbẹ̀, àlàyé [a] pa ìtumọ̀ gangan àti àṣàyàn ‘ìgbàgbọ́ Ọlọ́run’ mọ́, kí a má bàa fi agbára yanju ìṣòro ìtumọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó ní iyì, tí ó sì ṣeé yé fún gbogbo ènìyàn. A lo ‘yóò ha’ láti fi ìbéèrè àsọyé Pọ́ọ̀lù hàn, a sì lo ‘òtítọ́ Ọlọ́run’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ìṣòtítọ́ tàbí jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé.
