  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: yo
  text: Ó pọ̀ ní gbogbo ọ̀nà. Nítorí pé lákọ̀ọ́kọ́, a fi àwọn ọ̀rọ̀ Ọlọ́run[a] lé wọn lọ́wọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àsọjáde Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺ
  choice: Ó pọ̀
  rationale: Ọ̀rọ̀ náà ń dá ìbéèrè tó wà ní ẹsẹ tó ṣáájú lóhùn ní ṣókí; ó fi hàn pé àǹfààní náà pọ̀ láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: κατὰ πάντα τρόπον
  choice: ní gbogbo ọ̀nà
  rationale: Ó jẹ́ gbólóhùn Yorùbá àdánidá tó pa ìtumọ̀ pé ní gbogbo ọ̀nà tàbí ní gbogbo apá mọ́.
- source_word: πρῶτον μὲν γὰρ
  choice: Nítorí pé, lákọ̀ọ́kọ́
  rationale: “Nítorí pé” ṣàfihàn γὰρ, “lákọ̀ọ́kọ́” sì ṣàfihàn pé Pọ́ọ̀lù bẹ̀rẹ̀ àkọ́kọ́ kókó, bó tilẹ̀ jẹ́ pé kò darúkọ èkejì lẹ́sẹ̀kẹsẹ̀.
- source_word: ἐπιστεύθησαν
  choice: a fi … lé wọn lọ́wọ́
  rationale: Ìlò àìdárúkọ olùṣe yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe àfarawà Gíríìkì, ó sì mú èrò ìgbẹ́kẹ̀lé àti ojúṣe ìtọ́jú jáde.
- source_word: τὰ λόγια
  choice: àwọn ọ̀rọ̀ tí Ọlọ́run sọ
  rationale: λόγια níbí túmọ̀ sí àwọn àsọjáde tàbí ọ̀rọ̀ ìṣípayá láti ọ̀dọ̀ Ọlọ́run; yíyan ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé òde òní, a sì pa àṣàyàn tó ṣe gírámà Gíríìkì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τοῦ θεοῦ
  choice: tí Ọlọ́run sọ
  rationale: Gbólóhùn yìí ka gẹnitífù náà sí orísun àwọn ọ̀rọ̀ náà, ìtumọ̀ tí àyíká λόγια ti Ọlọ́run ń ṣe àtìlẹ́yìn fún.
theological_decisions:
- issue: Ta ni a fi àwọn ọ̀rọ̀ náà lé lọ́wọ́ nínú ọ̀rọ̀-orúkọ ọ̀pọ̀ ἐπιστεύθησαν?
  choice: wọn
  alternative: àwọn Júù
  rationale: A pa ọ̀rọ̀-orúkọ Gíríìkì mọ́, nítorí ẹni tí “wọn” ń tọ́ka sí ti ṣe kedere láti inú ẹsẹ tó ṣáájú; fífi “àwọn Júù” sínú ẹsẹ yìí yóò jẹ́ àlàyé àfikún.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àkójọpọ̀ ohùn ní kíkún níbi tó bá yẹ, a sì yẹra fún ọ̀rọ̀ ìjọ kan pàtó.
