  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: yo
  text: Ǹjẹ́ nígbà náà, àwa ha sọ òfin di asán nípasẹ̀ ìgbàgbọ́? Kí ó má ṣẹlẹ̀ rárá! Kàkà bẹ́ẹ̀,[a] àwa ń mú òfin dúró ṣinṣin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwa ń fìdí òfin múlẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: òfin
  rationale: Nínú ìjíròrò Paulu ní Róòmù, ọ̀rọ̀ náà tọ́ka sí Òfin/Tórà gẹ́gẹ́ bí ohun tí a ti mọ̀ tẹ́lẹ̀; Yorùbá kò nílò àpèjúwe pàtó bíi article Gẹ̀ẹ́sì.
- source_word: οὖν
  choice: nígbà náà
  rationale: Ó fi ìbéèrè àríyànjiyàn hàn gẹ́gẹ́ bí ohun tí ó tẹ̀ lé ọ̀rọ̀ tí ó ṣáájú, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: καταργοῦμεν
  choice: sọ ... di asán
  rationale: Ó mú ìtumọ̀ yíyọ agbára tàbí ìmúlò ohun kan kúrò jáde, láìfi dandan túmọ̀ sí pípa òfin rẹ́ patapata.
- source_word: διὰ τῆς πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Ó pa ipa irinṣẹ́ διά mọ́, ó sì lo ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún πίστις.
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ láéláé!
  rationale: Ọ̀rọ̀ yìí jẹ́ ìkọ̀sílẹ̀ líle tí ó bá agbára gbolohun Gíríìkì mu, tí ó sì ní iyì nínú Yorùbá òde òní.
- source_word: ἀλλὰ
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi ìyàtọ̀ àti àtúnṣe líle hàn lọ́nà tí ó ṣe kedere.
- source_word: ἱστάνομεν
  choice: ń fi ẹsẹ̀ ... múlẹ̀
  rationale: Àkànlò-èdè yìí fi hàn pé a ń jẹ́ kí òfin dúró ṣinṣin tàbí kí a fìdí rẹ̀ múlẹ̀, ní ìtakora pẹ̀lú sísọ ọ́ di asán.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti òfin
  choice: àwa ń fi ẹsẹ̀ òfin múlẹ̀
  alternative: àwa ń gbé òfin ró; àwa ń fìdí òfin múlẹ̀
  rationale: Gíríìkì lè túmọ̀ sí ‘mú dúró,’ ‘fìdí múlẹ̀,’ tàbí ‘gbé ró.’ Àkànlò-èdè tí a yàn tako ‘sọ di asán’ ní kedere, láìdá èrò ẹ̀kọ́ ìjọ kan pàtó sí ọ̀rọ̀ Paulu.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ‘Ǹjẹ́ ... ha’ láti pa ìrísí ìbéèrè àríyànjiyàn mọ́, àti ‘láéláé’ láti fi agbára ìkọ̀sílẹ̀ μὴ γένοιτο hàn.
