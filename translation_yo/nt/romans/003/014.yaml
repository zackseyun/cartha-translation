translation:
  language: yo
  text: Ẹnu wọn kún fún èébú àti ìkorò.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníbátan onípò-ìní náà tọ́ka sí àwọn ènìyàn tí ọ̀rọ̀ ṣáájú ń sọ̀rọ̀ nípa wọn. Nínú Yorùbá, ‘ẹnu wọn’ ni ọ̀nà àdánidá láti fi ìbátan ìní yìí hàn.
- source_word: τὸ στόμα
  choice: ẹnu
  rationale: ‘Ẹnu’ ni ìtumọ̀ tààrà tí ó sì pa àwòrán ẹ̀yà ara tí a fi ń sọ̀rọ̀ mọ́.
- source_word: ἀρᾶς
  choice: èébú
  rationale: ‘Èébú’ túmọ̀ sí ọ̀rọ̀ ìfibú tàbí ìpè ibi sí orí ẹlòmíràn; ó bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu nínú àyíká ọ̀rọ̀ ẹnu.
- source_word: πικρίας
  choice: ìkorò
  rationale: ‘Ìkorò’ pa àwòrán ìkorò àti agbára ìwà búburú inú ọ̀rọ̀ náà mọ́, ó sì lè ṣàpèjúwe ọ̀rọ̀ líle tó ń dunni.
- source_word: γέμει
  choice: kún fún
  rationale: ‘Kún fún’ jẹ́ gbólóhùn Yorùbá àdánidá fún ohun tí ó kún tàbí tí ó pọ̀ nínú ohun mìíràn, ó sì pa agbára àsìkò ìsinsìnyí mọ́.
