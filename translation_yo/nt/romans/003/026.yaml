id: ROM.3.26
reference: Romans 3:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: yo
  text: nínú ìfaradà Ọlọ́run, láti fi òdodo rẹ̀[a] hàn ní àkókò ìsinsìnyí, kí ó lè jẹ́ olódodo, kí ó sì jẹ́ ẹni tí ń dá[c] ẹni tí ó ní ìgbàgbọ́ nínú Jésù[b] láre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí ó jẹ́ ti ìṣòtítọ́ Jésù.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìgbàgbọ́ nínú Jésù tàbí sí ìṣòtítọ́ Jésù.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ń kà ẹni sí olódodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοχῇ
  choice: ìfaradà
  rationale: “Ìfaradà” fi hàn pé Ọlọ́run mọ̀ọ́mọ̀ dá ìdájọ́ dúró fún ìgbà díẹ̀; ó bá ọ̀rọ̀ Pọ́ọ̀lù mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἔνδειξιν
  choice: láti fi ... hàn
  rationale: Gbólóhùn yìí mú agbára ẹ̀rí àti ìṣípayá inú ἔνδειξις wá sí èdè Yorùbá tó ṣe kedere.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” ni ìtumọ̀ Yorùbá tó gbòòrò fún δικαιοσύνη, ó sì lè gbé ìtumọ̀ ìwà títọ́ Ọlọ́run; ìtumọ̀ ti ìdájọ́ òdodo ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: νῦν καιρῷ
  choice: ní àkókò ìsinsìnyí
  rationale: Ó pa ìtẹnumọ́ àkókò νῦν καιρός mọ́ ní Yorùbá òde òní tó mọ́gbọ́n dání.
- source_word: δίκαιον
  choice: olódodo
  rationale: “Olódodo” sọ pé Ọlọ́run tọ́, ó sì bá “dá ... láre” tó tẹ̀ lé e ṣiṣẹ́ nínú àyíká ìdájọ́.
- source_word: δικαιοῦντα
  choice: ẹni tí ń dá ... láre
  rationale: 'Ó tú participle náà sí Yorùbá àdánidá, ó sì pa agbára ìdájọ́ rẹ̀ mọ́: Ọlọ́run ni ẹni tí ń dá ènìyàn láre.'
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: ẹni tí ó ní ìgbàgbọ́ nínú Jesu
  rationale: Àkọ́kọ́ yìí ka genitive náà gẹ́gẹ́ bí ohun tí ìgbàgbọ́ dojú kọ, ní èdè Yorùbá tó ṣe kedere; a pa ìtumọ̀ “ìṣòtítọ́ Jesu” mọ́ sínú àlàyé ìsàlẹ̀ nítorí pé ọ̀rọ̀ Gíríìkì náà ní àríyànjiyàn.
theological_decisions:
- issue: Ìtumọ̀ ἐκ πίστεως Ἰησοῦ
  choice: ẹni tí ó ní ìgbàgbọ́ nínú Jesu
  alternative: ẹni tí ó dúró lórí ìṣòtítọ́ Jesu
  rationale: Àkọ́kọ́ yan objective genitive fún ìtẹ́wọ́gbà àti ìmúlò àdánidá, ṣùgbọ́n a kò pa subjective-genitive tí ó ṣeé ṣe mọ́; àlàyé ìsàlẹ̀ pa ìforígbárí ẹ̀kọ́-ìgbàgbọ́ náà mọ́.
- issue: Ìbáṣepọ̀ δίκαιον àti δικαιοῦντα
  choice: olódodo ... ẹni tí ń dá ... láre
  alternative: ẹni tí ìdájọ́ rẹ̀ tọ́ ... ẹni tí ń kà ... sí olódodo
  rationale: Ìtumọ̀ àkọ́kọ́ pa àyíká ilé-ẹjọ́ àti ìyàtọ̀ láàárín jíjẹ́ olódodo Ọlọ́run àti dídá onígbàgbọ́ láre mọ́, láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní ọlá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ìsinsìnyí,” “olódodo,” àti “dá ... láre” gẹ́gẹ́ bí àwọn ọ̀rọ̀ àdánidá tó pa àkókò, òdodo, àti àyíká ìdájọ́ inú Gíríìkì mọ́. Gbólóhùn náà jẹ́ ìtẹ̀síwájú láti ẹsẹ tó ṣáájú, nítorí náà ó bẹ̀rẹ̀ pẹ̀lú “nínú,” gẹ́gẹ́ bí orísun náà.
