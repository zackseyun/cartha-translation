  to: Ṣùgbọ́n nísinsin yìí, ní ọ̀tọ̀ sí òfin, a ti fi òdodo Ọlọ́run hàn[a][b], èyí tí Òfin àti àwọn Wòlíì jẹ́rìí sí[c].
