source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí, ní ọ̀tọ̀ sí òfin, a ti fi òdodo Ọlọ́run hàn[a][b], èyí tí Òfin àti àwọn Wòlíì jẹ́rìí sí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òdodo ìdájọ́ Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé ṣe kí ó túmọ̀ sí “òdodo láti ọ̀dọ̀ Ọlọ́run.”
    reason: alternative_reading
  - marker: c
    text: Ìyẹn ni, Ìwé Mímọ́; “Òfin àti àwọn Wòlíì” jẹ́ ọ̀nà kan láti tọ́ka sí ẹ̀rí àwọn Ìwé Mímọ́ ti Májẹ̀mú Àtijọ́.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Ṣùgbọ́n nísinsin yìí
  rationale: Ó pa ìyípadà tó lágbára nínú àríyànjiyàn Pọ́ọ̀lù mọ́, pẹ̀lú ìtumọ̀ ìyàtọ̀ àti ti àkókò.
- source_word: χωρὶς νόμου
  choice: láìsinmi lé òfin
  rationale: χωρίς túmọ̀ sí pé ohun kan wà ní ọ̀tọ̀ sí òfin, kì í ṣe àìsí òfin lásán; ọ̀rọ̀ yìí sì ṣe kedere ní Yorùbá pé òdodo náà kò gbára lé pípa Òfin Mósè mọ́.
- source_word: δικαιοσύνη θεοῦ
  choice: òdodo Ọlọ́run
  rationale: 'Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àìdánilójú genitive Gíríìkì mọ́: ó lè tọ́ka sí òdodo tí ó jẹ́ ti Ọlọ́run tàbí èyí tí ó ti ọ̀dọ̀ Ọlọ́run wá.'
- source_word: πεφανέρωται
  choice: a ti fi ... hàn
  rationale: Ìṣe àṣepé náà ń tọ́ka sí ìṣípayá tó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì ṣì dúró; “a ti fi ... hàn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ èyí.
- source_word: μαρτυρουμένη
  choice: èyí tí ... jẹ́rìí sí
  rationale: Ó sọ participle passive náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ẹ̀rí tàbí ìjẹ́rìí mọ́.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: Òfin àti àwọn Wòlíì
  rationale: Lílò lẹ́tà ńlá fi hàn pé ó ṣeé ṣe kí èyí jẹ́ orúkọ àkójọpọ̀ fún ẹ̀rí Ìwé Mímọ́, kì í ṣe òfin àti àwọn olùsọtẹ́lẹ̀ lásán.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú δικαιοσύνη θεοῦ
  choice: òdodo Ọlọ́run
  alternative: òdodo láti ọ̀dọ̀ Ọlọ́run
  rationale: Àkọlé pàtàkì náà kò pinnu bóyá ó ń sọ ní pàtàkì nípa ìwà àti iṣẹ́ òdodo Ọlọ́run tàbí òdodo tí Ọlọ́run ń fúnni; àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- issue: Ìtumọ̀ χωρὶς νόμου
  choice: láìsinmi lé òfin
  alternative: ní ọ̀tọ̀ sí òfin
  rationale: Àṣàyàn yìí ń sọ pé ìfihàn òdodo Ọlọ́run kò gbára lé òfin, láìsọ pé Òfin kò ní ipa ẹ̀rí, nítorí apá tó tẹ̀ lé sọ pé Òfin àti àwọn Wòlíì jẹ́rìí sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. “Láìsinmi lé òfin” jẹ́ àdánidá ju ìtumọ̀ gígùn bí “ní ọ̀tọ̀ sí òfin” lọ, nígbà tí “Òfin àti àwọn Wòlíì” pa ìtọ́kasí ìwé mímọ́ mọ́.
