  source_fidelity: Àṣàyàn “láìsinmi lé òfin” kò túmọ̀ χωρὶς νόμου ní tòótọ́. Ó ń sọ ìgbẹ́kẹ̀lé lórí òfin (“láìgbẹ́kẹ̀lé òfin”) tí kò sí ní gbolohun Gíríìkì náà, ó sì lè mú ìtumọ̀ Pọ́ọ̀lù gbòòrò síi ju ohun tí a kọ lọ. “Ní ọ̀tọ̀ sí òfin” pa ìmọ̀ ‘apart from/independently of the law’ mọ́ láìfi ìtumọ̀ mìíràn kún un. Ìyókù gbolohun náà, pàápàá “a ti fi òdodo Ọlọ́run hàn” àti “èyí tí Òfin àti àwọn Wòlíì jẹ́rìí sí,” fi perfect passive àti ìjẹ́rìí ti participle Gíríìkì hàn dáadáa.
  naturalness: Gbolohun tí a tún ṣe jẹ́ Yorùbá boṣewa, ó sì yẹ fún ìwé mímọ́. “Ní ọ̀tọ̀ sí òfin” jẹ́ ọ̀nà kedere àti àdánidá láti sọ ìpínyà χωρίς, bí ó tilẹ̀ jẹ́ pé ó kéré sí ìsọ̀rọ̀ ju àṣàyàn ìṣáájú lọ.
  terminology: “Òdodo Ọlọ́run” dáa gẹ́gẹ́ bí ìtumọ̀ pàtàkì fún δικαιοσύνη θεοῦ, nítorí ó dá àìdánilójú genitive sílẹ̀. “Òfin àti àwọn Wòlíì” yẹ gẹ́gẹ́ bí àkọ́lé ìwé mímọ́. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ kí “ìdájọ́ òdodo Ọlọ́run” má bàa dà bí ìdájọ́ tí Ọlọ́run ṣe; “òdodo ìdájọ́” ń ṣiṣẹ́ dáadáa gẹ́gẹ́ bí àṣàyàn ‘justice.’
