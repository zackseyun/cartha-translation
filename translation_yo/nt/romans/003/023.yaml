  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: yo
  text: Nítorí gbogbo ènìyàn ti ṣẹ̀, wọ́n sì kùnà láti dé ògo Ọlọ́run[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kò ní ògo Ọlọ́run” tàbí “wọ́n wà ní àìní ògo Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “ògo Ọlọ́run,” lè tọ́ka sí ògo Ọlọ́run fúnra rẹ̀, ògo tí a dá ènìyàn láti ṣàfihàn, tàbí ògo tí Ọlọ́run fi fúnni.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: gbogbo ènìyàn
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ tó kan gbogbo aráyé nínú àyíká ọ̀rọ̀ náà; fífi “ènìyàn” kún un mú un ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé tàbí ń fún àríyànjiyàn Pọ́ọ̀lù tó ṣáájú ní ìdí.
- source_word: ἥμαρτον
  choice: ti ṣẹ̀
  rationale: Aorist náà ṣàkójọ òtítọ́ pé gbogbo ènìyàn ti dá ẹ̀ṣẹ̀; “ti ṣẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì fi ìṣe náà hàn gẹ́gẹ́ bí ohun tó ti ṣẹlẹ̀ tí ó ní ipa nísinsìnyí.
- source_word: ὑστεροῦνται
  choice: wọ́n sì kùnà láti dé
  rationale: Present tense náà ń tọ́ka sí ipò àìtó tó ń bá a lọ. Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún jíjìnnà sí ohun tí a fẹ́ dé, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì tún lè túmọ̀ sí “ní àìní.”
- source_word: δόξης
  choice: ògo
  rationale: “Ògo” ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìjinlẹ̀ ọ̀rọ̀ δόξα mu láì sọ ọ́ di “ọlá” tàbí “ìmọ́lẹ̀ ńlá” nìkan.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Èyí pa ìbáṣepọ̀ genitive Gíríìkì mọ́ nínú “ògo Ọlọ́run,” láì pinnu bóyá ó túmọ̀ sí ògo tí í ṣe ti Ọlọ́run fúnra rẹ̀ tàbí èyí tó wá láti ọ̀dọ̀ rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “ògo Ọlọ́run”
  choice: A pa á mọ́ ní ọ̀nà àìdásí-ẹ̀kọ́ kan gẹ́gẹ́ bí “ògo Ọlọ́run.”
  alternative: “ògo tó wá láti ọ̀dọ̀ Ọlọ́run,” “ìwọ̀n ògo Ọlọ́run,” tàbí “kíkópa nínú ògo Ọlọ́run”
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí ògo Ọlọ́run fúnra rẹ̀, ògo tí a dá ènìyàn láti ṣàfihàn, tàbí ògo tí Ọlọ́run ń fi fúnni. Ìtumọ̀ pàtàkì kò yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “gbogbo ènìyàn” fún ìtumọ̀ àgbáyé, “ti ṣẹ̀” fún aorist, àti “wọ́n sì kùnà láti dé” fún ipò àìtó tó ń bá a lọ.
