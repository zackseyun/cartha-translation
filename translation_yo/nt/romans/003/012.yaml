id: ROM.3.12
reference: Romans 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: yo
  text: Gbogbo wọn ti ṣáko lọ; gbogbo wọn papọ̀ ti di aláìwúlò.[a] Kò sí ẹni tí ń ṣe ohun rere,[b] kò tilẹ̀ sí ẹnì kan ṣoṣo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti di asán” tàbí “ti bàjẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ń ṣe ìwà rere”; χρηστότητα tún lè túmọ̀ sí “inú rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Gbogbo wọn
  rationale: Ó pa ìtẹnumọ́ gbogbo ènìyàn mọ́ láìfi ọ̀rọ̀-orúkọ kan kún ohun tí Gíríìkì sọ.
- source_word: ἐξέκλιναν
  choice: ti yà kúrò ní ọ̀nà
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìyapa kúrò ní ipa ọ̀nà rere, ó sì pa ìtumọ̀ ìṣe tí ó ti ṣẹlẹ̀ mọ́.
- source_word: ἅμα
  choice: gbogbo wọn papọ̀
  rationale: Ó fi ipò tí gbogbo wọn jọ wà hàn, dípò kí ó túmọ̀ sí pé ìṣẹ̀lẹ̀ náà ṣẹlẹ̀ ní àkókò kan náà nìkan.
- source_word: ἠχρεώθησαν
  choice: ti di aláìwúlò
  rationale: Ó pa ìtumọ̀ pé wọ́n dé ipò àìníyelórí tàbí àìlèṣe ohun rere mọ́, pẹ̀lú agbára ìdájọ́ ọ̀rọ̀ Gíríìkì.
- source_word: ποιῶν
  choice: tí ń ṣe
  rationale: Àmì ìṣe ń ṣe fi ìṣe tí ó jẹ́ àṣà tàbí ìwà tẹ̀síwájú hàn lọ́nà àdánidá.
- source_word: χρηστότητα
  choice: ohun rere
  rationale: Ó ṣe kedere nínú ọ̀rọ̀ ìwà rere yìí, nígbà tí akọsilẹ̀ ẹsẹ̀ ń pa àṣàyàn ‘ìwà rere’ tàbí ‘inú rere’ mọ́.
- source_word: οὐκ ἔστιν
  choice: Kò sí ẹni
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tí ó ṣe kedere fún àìsí ẹnikẹ́ni.
- source_word: ἕως ἑνός
  choice: kò tilẹ̀ sí ẹnì kan ṣoṣo
  rationale: Ó mú ìtẹnumọ́ ìparí Gíríìkì jáde pé kò sí àfi ẹnì kan pàápàá.
theological_decisions:
- issue: Ìtẹnumọ́ pé gbogbo ènìyàn ti yà kúrò
  choice: Pa gbolohun méjèèjì mọ́ gẹ́gẹ́ bí ìdájọ́ tó kan gbogbo wọn
  alternative: Ṣàlàyé ‘gbogbo wọn’ gẹ́gẹ́ bí ẹgbẹ́ kan pàtó
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò dín πάντες kù sí ẹgbẹ́ kan, nítorí náà ìtumọ̀ kò gbọdọ̀ fi àlàyé ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àwọn àmì akọsilẹ̀ [a] àti [b] wà lẹ́yìn ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé; a tún ṣètò wọn ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì, nítorí akọsilẹ̀ Gẹ̀ẹ́sì tí a pèsè fi wọn sí ibi tí ó dà bí ẹni pé wọ́n yí padà.
