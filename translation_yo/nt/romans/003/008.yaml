revisions:
- from: Kí sì ni ìdí tí a kò fi ní sọ—gẹ́gẹ́ bí wọ́n ti ń parọ́ mọ́ wa, tí àwọn kan sì ń sọ pé àwa ń wí pé—“Ẹ jẹ́ kí a ṣe ohun búburú kí ohun rere lè wá”? Ìdálẹ́bi àwọn ẹni bẹ́ẹ̀ tọ́[a][b].
  to: Kí ló dé tí a kò fi sọ—gẹ́gẹ́ bí a ṣe ń fi ẹ̀sùn èké kàn wá, tí àwọn kan sì ń sọ pé a ń wí pé—“Ẹ jẹ́ ká ṣe ohun búburú kí ohun rere lè wá”? Ìdálẹ́bi wọn jẹ́ òdodo.[a][b]
  rationale: A tún ọ̀rọ̀ ìbẹ̀rẹ̀ ṣe kí ó jẹ́ ìbéèrè àríyànjiyàn Yorùbá tó dára, a sì rọ́pò ọ̀rọ̀ tó lè túmọ̀ sí píparọ́ fún ẹni kan pẹ̀lú ọ̀rọ̀ tó fi ẹ̀sùn èké kíkàn hàn. A tún fi arọ́pò-orúkọ “wọn” sílẹ̀ nínú ọ̀rọ̀ àkọ́kọ́ láti má ṣe mú ìtọ́kasí ὧν di pàtó jù, nígbà tí akọsilẹ̀ ń ṣàlàyé àyíká náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:27:28Z'
