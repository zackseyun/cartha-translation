  source_fidelity: Àtúnṣe díẹ̀ ni a nílò. Gbólóhùn ìbẹ̀rẹ̀ náà gbọ́dọ̀ pa ìbéèrè àríyànjiyàn ti καὶ μὴ mọ́ láì fi ìtumọ̀ ọjọ́ iwájú tí kò sí nínú orísun kún un. Bákan náà, βλασφημούμεθα túmọ̀ sí fífi ẹ̀sùn èké kan wọn nínú àyíká yìí, kì í ṣe píparọ́ mọ́ wọn.
