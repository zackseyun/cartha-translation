id: ROM.3.8
reference: Romans 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: yo
  text: Kí ló dé tí a kò fi sọ—gẹ́gẹ́ bí a ṣe ń fi ẹ̀sùn èké kàn wá, tí àwọn kan sì ń sọ pé a ń wí pé—“Ẹ jẹ́ ká ṣe ohun búburú kí ohun rere lè wá”? Ìdálẹ́bi wọn jẹ́ òdodo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ìṣètò ọ̀rọ̀ Gíríìkì: “Àti kì í ṣe—gẹ́gẹ́ bí a ṣe ń fi ẹ̀sùn èké kàn wá, tí àwọn kan sì ń sọ pé a ń wí pé—‘Ẹ jẹ́ ká ṣe ohun búburú kí ohun rere lè wá’?”'
    reason: lexical_alternative
  - marker: b
    text: “Ìdálẹ́bi wọn” tọ́ka sí àwọn tí wọ́n ń fi ẹ̀sùn yìí kàn wọn tàbí tí wọ́n ń fọwọ́ sí irú ìrònú náà.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: wọ́n ti ń parọ́ mọ́ wa
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí pé a ń fi ẹ̀sùn èké kan Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀, kì í ṣe pé a ń sọ̀rọ̀-òdì sí Ọlọ́run.
- source_word: φασίν τινες
  choice: àwọn kan sì ń sọ
  rationale: Èyí fi ìròyìn ẹ̀sùn wọn hàn láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: λέγειν
  choice: àwa ń wí pé
  rationale: Ó dúró mọ́ ìtumọ̀ tààrà ti ‘sọ’ dípò lílo ‘kọ́ni,’ èyí tí yóò túmọ̀ ọ̀rọ̀ náà jù.
- source_word: Ποιήσωμεν
  choice: Ẹ jẹ́ kí a ṣe
  rationale: Èyí fi ìṣírí ẹni àkọ́kọ́ ọ̀pọ̀ hàn ní Yorùbá àdánidá.
- source_word: τὰ κακὰ
  choice: ohun búburú
  rationale: Ó sọ ìtumọ̀ ohun tí ó burú tàbí ibi ní ọ̀nà tí ó ṣe kedere sí òǹkàwé Yorùbá.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: kí ohun rere lè wá
  rationale: Ó pa agbára ète tàbí àbájáde ti ἵνα mọ́, pẹ̀lú ‘lè’ fún subjunctive ἔλθῃ.
- source_word: κρίμα
  choice: ìdálẹ́bi
  rationale: Níhìn-ín, ó tọ́ka sí ìdájọ́ tí kò dá ẹni láre, kì í ṣe ìdájọ́ ní ìtumọ̀ gbòòrò nìkan.
- source_word: ἔνδικόν
  choice: tọ́
  rationale: Ó fi hàn pé ìdálẹ́bi náà bá ìdájọ́ òdodo mu, ní èdè Yorùbá tó ṣe déédéé.
- source_word: καὶ μὴ
  choice: Kí sì ni ìdí tí a kò fi ní sọ
  rationale: Gíríìkì jẹ́ gbólóhùn aláìpé tí ó ń tẹ̀ síwájú láti ẹsẹ tó ṣáájú; fífi ‘kí ni ìdí’ kún un mú ìbéèrè àríyànjiyàn náà yé ni Yorùbá.
theological_decisions:
- issue: Ẹni tí ‘ìdálẹ́bi wọn’ ń tọ́ka sí
  choice: àwọn ẹni bẹ́ẹ̀
  alternative: wọn
  rationale: Ọ̀rọ̀ arọ́pò ὧν lè dà bí ẹni pé kò ṣe kedere ní ìyàsọ́tọ̀, ṣùgbọ́n àyíká ọ̀rọ̀ tọ́ka sí àwọn tó ń fi ẹ̀sùn èké náà kan wọn tàbí tí wọ́n ń fọwọ́ sí ìrònú ‘ṣe ibi kí rere lè wá.’ Àlàyé ẹsẹ̀-àlàyé pa àlàyé yìí mọ́ láì sọ ọ́ di ẹ̀kọ́ ẹgbẹ́ ìsìn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ó sì jẹ́ ọ̀wọ̀, kedere, àti èyí tí àwọn òǹkàwé òde òní lè lóye. Àwọn dási dúró fún gbólóhùn àárín, wọ́n sì pa ìṣètò àríyànjiyàn orísun mọ́.
