id: ROM.3.27
reference: Romans 3:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: yo
  text: Níbo wá ni ìṣògo ń bẹ? A ti mú un kúrò. Nípasẹ̀ irú òfin wo? Ṣé òfin iṣẹ́ ni? Rárá, ṣùgbọ́n nípasẹ̀ òfin ìgbàgbọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: ìṣògo
  rationale: Ó túmọ̀ sí fífi ohun tí ènìyàn jẹ́ tàbí ṣe ṣe ìdí ìyangàn tàbí ìfọ́nnu; ‘ìṣògo’ mú èrò fífi ara ṣògo yé ní Yorùbá.
- source_word: ἐξεκλείσθη
  choice: A ti mú un kúrò
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive, ó sì sọ pé a ti yọ ìṣògo síta tàbí pé a kò fi ààyè sílẹ̀ fún un mọ́.
- source_word: διὰ ποίου νόμου
  choice: Nípasẹ̀ irú òfin wo?
  rationale: Ó pa ìtumọ̀ διὰ mọ́ gẹ́gẹ́ bí ohun èlò tàbí ọ̀nà, ó sì ṣàfihàn ποίου, ‘irú wo.’
- source_word: τῶν ἔργων
  choice: Òfin àwọn iṣẹ́ bí?
  rationale: Gíríìkì fi gbolohun kúkúrú sílẹ̀ tí ó dá lórí ‘òfin’ nínú ìbéèrè tó ṣáájú; fífi ‘òfin’ tún un ṣe ń jẹ́ kí Yorùbá ṣe kedere láì yí ìtumọ̀ padà.
- source_word: νόμου πίστεως
  choice: òfin ìgbàgbọ́
  rationale: Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ ìpilẹ̀ ni èyí, tí ó sì pa ìfara-ẹni-wé láàárín ‘òfin àwọn iṣẹ́’ àti ‘òfin ìgbàgbọ́’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘òfin’ nínú ‘òfin ìgbàgbọ́’
  choice: Pa á mọ́ gẹ́gẹ́ bí ‘òfin ìgbàgbọ́.’
  alternative: ‘ìlànà ìgbàgbọ́’ tàbí ‘ọ̀nà ìgbàgbọ́’
  rationale: νόμος lè ní ìtumọ̀ tí ó fẹ̀ ju òfin pàṣẹ lọ níbí, ṣùgbọ́n lílo ọ̀rọ̀ kan náà nínú àwọn apá méjèèjì ń pa ìmọ̀lára àti ìfara-ẹni-wé Gíríìkì mọ́, láì pinnu ìjíròrò ẹ̀kọ́ ìgbàgbọ́ náà fún òǹkàwé.
- issue: Agbára passive nínú ‘ἐξεκλείσθη’
  choice: ‘A ti mú un kúrò,’ láì sọ ẹni tó mú un kúrò.
  alternative: ‘Ọlọ́run ti mú un kúrò.’
  rationale: Ọ̀rọ̀ Gíríìkì kò dárúkọ olùṣe; fífi ‘Ọlọ́run’ kún un yóò mú ohun tí ó ṣeé lóye nínú àyíká ọ̀rọ̀ di ohun tí a sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún, pẹ̀lú èdè ọlọ́lá, adayeba, àti kíkà-rọrùn. A pa ìbéèrè àti ìdáhùn kúkúrú Pọ́ọ̀lù mọ́, pẹ̀lú ìfara-ẹni-wé láàárín iṣẹ́ àti ìgbàgbọ́.
