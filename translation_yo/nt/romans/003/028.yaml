id: ROM.3.28
reference: Romans 3:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: yo
  text: Nítorí a parí èrò pé ènìyàn[b] ni a dá láre[a] nípasẹ̀ ìgbàgbọ́, yàtọ̀ sí àwọn iṣẹ́ òfin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ènìyàn ni a kéde ní olódodo.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà, ṣùgbọ́n ó ń tọ́ka sí ènìyàn lápapọ̀ níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: a parí èrò sí pé
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìdájọ́ tàbí ìparí èrò tí ó wá láti inú àríyànjiyàn Pọ́ọ̀lù; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: γάρ
  choice: Nítorí náà
  rationale: Ó so gbólóhùn yìí mọ́ àlàyé àti àríyànjiyàn tó ṣáájú gẹ́gẹ́ bí ìdí tàbí ìparí èrò.
- source_word: δικαιοῦσθαι
  choice: a ń dá ... láre
  rationale: 'Èyí pa ìtumọ̀ ìdájọ́ mọ́: Ọlọ́run ń dá ẹni náà láre. Àmì àkókò tí ń lọ tún bá present infinitive mu.'
- source_word: πίστει
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Ó fi ipa ọ̀nà tàbí ohun èlò tí dative náà ní hàn láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
- source_word: ἄνθρωπον
  choice: ènìyàn
  rationale: Nínú àyíká yìí ọ̀rọ̀ Gíríìkì náà dúró fún ẹnikẹ́ni, kì í ṣe ọkùnrin nìkan; ‘ènìyàn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìtumọ̀ gbogbogbò.
- source_word: χωρὶς
  choice: láìka ... sí
  rationale: Ó sọ pé àwọn iṣẹ́ òfin kò ní ipa nínú ìdáláre náà, ní Yorùbá tí ó ṣe kedere.
- source_word: ἔργων νόμου
  choice: àwọn iṣẹ́ òfin
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́ láìdín ‘òfin’ kù sí iṣẹ́ rere lásán tàbí sí apá kan pàtó nínú òfin.
theological_decisions:
- issue: Ìtumọ̀ δικαιοῦσθαι nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: a ń dá ènìyàn láre
  alternative: a ń kéde ènìyàn ní olódodo
  rationale: ‘Dá ... láre’ jẹ́ ọ̀rọ̀ ìdájọ́ tó mọ́gbọ́n dání, ó sì pa ìdíwọ̀n ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́; àlàyé ‘kéde ... ní olódodo’ wà nínú àlàyé ìsàlẹ̀ láìfi agbára mú ìtumọ̀ kan ṣoṣo.
- issue: Ìtumọ̀ ἄνθρωπον tí ó jẹ́ akọ ní gírámà ṣùgbọ́n tí ó ní agbára gbogbogbò
  choice: ènìyàn
  alternative: ọkùnrin kan
  rationale: Àyíká náà ń sọ nípa ènìyàn lápapọ̀, kì í ṣe akọ nìkan; Yorùbá ‘ènìyàn’ fi ìtumọ̀ aṣojú yìí hàn lọ́nà àdánidá.
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti àwọn iṣẹ́ òfin
  choice: nípasẹ̀ ìgbàgbọ́, láìka àwọn iṣẹ́ òfin sí
  alternative: nípasẹ̀ ìgbàgbọ́, láìsí àwọn iṣẹ́ òfin
  rationale: Èyí pa ìyàtọ̀ tí Pọ́ọ̀lù gbé kalẹ̀ mọ́ láìtúmọ̀ ‘àwọn iṣẹ́ òfin’ sí ìsapá rere gbogbo tàbí sí àmì ìdánimọ̀ àwọn Júù nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé gbogbogbò. ‘A ń dá ... láre’ pa àwọ̀ ìdájọ́ inú δικαιοῦσθαι mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ kejì hàn.
