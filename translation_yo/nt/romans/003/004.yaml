id: ROM.3.4
reference: Romans 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: yo
  text: "Kí ó má ṣe rí bẹ́ẹ̀ láéláé! Kàkà bẹ́ẹ̀, kí Ọlọ́run jẹ́ olóòótọ́, kí gbogbo ènìyàn sì jẹ́ òpùrọ́, gẹ́gẹ́ bí a ti kọ ọ́ sí pé:\n\n“Kí a lè dá ọ láre[a] nínú àwọn ọ̀rọ̀ rẹ,\n kí o sì borí nígbà tí a bá dá ọ lẹ́jọ́.”[b]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a lè fi hàn pé o wà ní ẹ̀tọ́,” tàbí, “kí a lè fi hàn pé olódodo ni ọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nígbà tí ìwọ bá ń dájọ́.” Èyí tẹ̀ lé ọ̀rọ̀ Hébérù inú Sáàmù 51:4 ní tààrà sí i, ṣùgbọ́n ọ̀rọ̀ Gíríìkì inú Róòmù ṣeé kà ní ti àdánidá pé, “nígbà tí a bá dá ọ lẹ́jọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Kí ó má ṣe rí bẹ́ẹ̀ láéláé!
  rationale: Ó fi agbára ìkọ̀sílẹ̀ Pọ́ọ̀lù hàn ní Yorùbá àdánidá, ó sì pa ìrísí àdúrà-ìfẹ́ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: kí Ọlọ́run jẹ́ olóòótọ́
  rationale: Ó pa agbára àṣẹ γινέσθω àti ìyàtọ̀ tó lágbára sí ‘òpùrọ́’ mọ́; ‘olóòótọ́’ lè túmọ̀ sí ẹni tí ọ̀rọ̀ rẹ̀ jẹ́ òtítọ́.
- source_word: πᾶς ... ἄνθρωπος
  choice: gbogbo ènìyàn
  rationale: Ó fi hàn pé gbogbo ẹ̀dá ènìyàn ni ọ̀rọ̀ náà kàn, kì í ṣe ọkùnrin nìkan.
- source_word: ψεύστης
  choice: òpùrọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tààrà fún ẹni tí ń purọ́ tàbí ẹni tí kì í ṣe olóòótọ́.
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá àti ọ̀wọ̀ fún gbólóhùn ìtọ́kasí Ìwé Mímọ́.
- source_word: δικαιωθῇς
  choice: kí a lè dá ọ láre
  rationale: 'Ó pa ìtumọ̀ ìdájọ́ mọ́: kì í ṣe pé Ọlọ́run di olódodo, bí kò ṣe pé a fi hàn pé ó wà ní ẹ̀tọ́.'
- source_word: λόγοις
  choice: nínú àwọn ọ̀rọ̀ rẹ
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó bá ọ̀rọ̀ inú Sáàmù àti àyíká ẹsẹ náà mu.
- source_word: νικήσεις
  choice: kí o sì borí
  rationale: ‘Borí’ sọ àṣeyọrí nínú ọ̀ràn ìdájọ́ di mímọ̀ láìfi ìtumọ̀ ogun kún un.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: nígbà tí a bá dá ọ lẹ́jọ́
  rationale: Ó tẹ̀ lé bí ọ̀rọ̀ Gíríìkì inú Róòmù ṣe hàn ní ti àdánidá gẹ́gẹ́ bí ohun tí a ṣe sí ẹni náà.
theological_decisions:
- issue: Ìtumọ̀ ti ìdájọ́ nínú δικαιωθῇς nígbà tí Ọlọ́run ni a ń sọ̀rọ̀ nípa rẹ̀
  choice: kí a lè dá ọ láre
  alternative: kí a lè fi hàn pé o wà ní ẹ̀tọ́; kí a lè fi hàn pé olódodo ni ọ́
  rationale: Àyíká náà ń sọ nípa òtítọ́ Ọlọ́run ní ìyàtọ̀ sí irọ́ ènìyàn. Nítorí náà, kì í ṣe pé Ọlọ́run di olódodo, bí kò ṣe pé ìdájọ́ fi hàn pé ó wà ní ẹ̀tọ́.
- issue: Ohùn ἐν τῷ κρίνεσθαί σε
  choice: nígbà tí a bá dá ọ lẹ́jọ́
  alternative: nígbà tí ìwọ bá ń dájọ́
  rationale: Ọ̀rọ̀ Gíríìkì inú Róòmù ṣeé kà ní ti àdánidá gẹ́gẹ́ bí passive, ṣùgbọ́n ọ̀rọ̀ Hébérù inú Sáàmù 51:4 ń ṣe àtìlẹ́yìn fún ‘nígbà tí ìwọ bá ń dájọ́’; a pa àṣàyàn yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye ni a lò. ‘Kàkà bẹ́ẹ̀’ mú ìyípadà ìjiyàn hàn; ‘Àní’ bẹ̀rẹ̀ ìdí tí àyọlò Ìwé Mímọ́ náà fi ṣe àtìlẹ́yìn fún gbólóhùn tó ṣáájú. Àwọn àmì ohùn ni a lò ní kíkún níbi tí wọ́n ti bá Yorùbá àdánidá mu.
