lexical_decisions:
- source_word: σύντριμμα
  choice: Ìparun
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìbàjẹ́ tàbí ìparun tí ìfọ́ túútúú ń yọrí sí. “Ìparun” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: ταλαιπωρία
  choice: ìpọ́njú
  rationale: “Ìpọ́njú” sọ ìrora, wàhálà àti ipò òṣì tí ọ̀rọ̀ Gíríìkì náà ní lọ́nà àdánidá fún òǹkàwé Yorùbá òde òní.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: wà ní àwọn ọ̀nà wọn
  rationale: Ìtumọ̀ yìí pa àwòrán ọ̀nà mọ́, ó sì tún lè tọ́ka sí ipa ọ̀nà ìgbésí ayé wọn láì fi tipátipá yan ọ̀kan nínú àwọn ìtumọ̀ méjèèjì.
- source_word: καὶ
  choice: àti
  rationale: Asopọ̀ Yorùbá tó wọ́pọ̀ tí ó so àwọn ọ̀rọ̀-orúkọ méjèèjì pọ̀.
