review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìtakora ἀδικία/δικαιοσύνη, ìtumọ̀ συνίστησιν, àti ìbéèrè àsọyé μή mọ́ dáadáa. Ṣùgbọ́n “rẹ̀” àti “sórí ènìyàn” nínú gbólóhùn nípa ìbínú kì í sí nínú ọ̀rọ̀ Gíríìkì; bẹ́ẹ̀ náà ni “nígbà tí” yí apá-ìṣe ἐπιφέρων padà sí ìtumọ̀ àkókò (‘when’).
