  terminology: “Àìṣòdodo” àti “òdodo” dára fún ἀδικία àti δικαιοσύνη nínú àríyànjiyàn Páùlù. Àlàyé ìsàlẹ̀ yẹ kí ó lo “ìwà àìtọ́” àti “ìdájọ́ òdodo” gẹ́gẹ́ bí àṣàyàn tó hàn gbangba, dípò “àìdájọ́ òdodo,” tí ó lè túmọ̀ sí àìsí ìdájọ́.
