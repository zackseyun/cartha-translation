  to: Ṣùgbọ́n bí àìṣòdodo wa bá ń fi òdodo Ọlọ́run hàn[a], kí ni àwa yóò wí? Ọlọ́run ha jẹ́ aláìṣòdodo ní mímú ìbínú wá? (Mo ń sọ̀rọ̀ bí ènìyàn.)
