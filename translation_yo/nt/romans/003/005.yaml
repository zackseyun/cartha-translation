id: ROM.3.5
reference: Romans 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: yo
  text: Ṣùgbọ́n bí àìṣòdodo wa bá ń fi òdodo Ọlọ́run hàn[a], kí ni àwa yóò wí? Ọlọ́run ha jẹ́ aláìṣòdodo ní mímú ìbínú wá? (Mo ń sọ̀rọ̀ bí ènìyàn.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà àìtọ́ wa ń fi ìdájọ́ òdodo Ọlọ́run hàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: àìṣòdodo
  rationale: Ó pa ìtakora ọ̀rọ̀ mọ́ láàárín ìwà tàbí ìṣe àìṣòdodo ènìyàn àti òdodo Ọlọ́run; ó tún lè túmọ̀ sí àìdájọ́ òdodo gẹ́gẹ́ bí àlàyé ìsàlẹ̀.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìtumọ̀ ìwà títọ́ àti ìdájọ́ òdodo; àlàyé ìsàlẹ̀ pa ọ̀nà ìtumọ̀ kejì mọ́.
- source_word: συνίστησιν
  choice: ń fi ... hàn
  rationale: Ó sọ ní èdè Yorùbá àdánidá pé àìṣòdodo ènìyàn ń mú òdodo Ọlọ́run fara hàn kedere.
- source_word: μὴ ἄδικος
  choice: Ọlọ́run ha jẹ́ aláìṣòdodo
  rationale: “Ha” fi hàn pé ìbéèrè àsọyé ni, tí ó ń retí ìdáhùn òdì, láìfi ìdáhùn náà sínú ẹsẹ̀.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: nígbà tí ó mú ìbínú rẹ̀ wá sórí ènìyàn
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún mímú ìbínú ìdájọ́ dé sórí ẹni tí a ń dá lẹ́jọ́; “rẹ̀” ṣàlàyé ẹni tí ìbínú náà jẹ́ tirẹ̀ láìyí ìtumọ̀ padà.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Mo ń sọ̀rọ̀ bí ènìyàn
  rationale: Ó pa ọ̀nà àsọyé Páùlù mọ́ pé èrò ènìyàn ni ó ń gbé kalẹ̀ nínú àríyànjiyàn náà.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìbéèrè Páùlù nípa òdodo Ọlọ́run nínú ìdájọ́
  choice: 'Lo ìbéèrè àsọyé: “Ọlọ́run ha jẹ́ aláìṣòdodo...?”'
  alternative: “Ọlọ́run kì í ṣe aláìṣòdodo ... àbí ó jẹ́ bẹ́ẹ̀?”
  rationale: μή ń tọ́ka sí ìdáhùn òdì tí a retí, ṣùgbọ́n fífi í sí ìrísí ìbéèrè taara pa líle àtakò àti ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ Gíríìkì mọ́ láìyanjú rẹ̀ fún òǹkàwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ha” láti fi ìbéèrè àsọyé hàn, a sì pa àṣàyàn “òdodo/ìdájọ́ òdodo” mọ́ nínú àlàyé ìsàlẹ̀.
