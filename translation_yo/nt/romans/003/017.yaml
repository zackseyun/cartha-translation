  text: and they have not known the way of peace[a].
translation:
  language: yo
  text: Wọ́n kò sì mọ ọ̀nà àlàáfíà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: A lo “sì” lẹ́yìn olùṣe gẹ́gẹ́ bí àsopọ̀ Yorùbá àdánidá, kí ó sì pa ìtẹ̀síwájú àkójọ ẹ̀sùn inú ọ̀rọ̀ náà mọ́.
- source_word: ὁδὸν
  choice: ọ̀nà
  rationale: “Ọ̀nà” lè túmọ̀ sí ojú ọ̀nà gan-an tàbí ìlànà ìgbésí ayé, nítorí náà ó pa àwòrán àti ìtumọ̀ àfiwé ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἰρήνης
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bójú mu fún εἰρήνη níbí; ó lè ṣàpèjúwe ọ̀nà tí àlàáfíà jẹ́ ìwà rẹ̀ tàbí ọ̀nà tí ń yọrí sí àlàáfíà.
- source_word: οὐκ ἔγνωσαν
  choice: kò mọ
  rationale: Ìṣe àṣeyọrí aorist náà jẹ́ gbólóhùn ìdálẹ́bi gbogbogbò ní àyíká yìí. “Kò mọ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọn kò ní ìmọ̀ tàbí ìrírí ọ̀nà náà, láìfi àlàyé tí kò sí nínú orísun kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ genitive nínú ὁδὸν εἰρήνης
  choice: ọ̀nà àlàáfíà
  alternative: ọ̀nà tí ń yọrí sí àlàáfíà
  rationale: '“Ọ̀nà àlàáfíà” pa àìdánilójú orísun mọ́: ó lè jẹ́ ọ̀nà tí àlàáfíà ń ṣàpèjúwe tàbí ọ̀nà tí ń yọrí sí àlàáfíà. A kò fi ipa mú un sí ìtumọ̀ kan ṣoṣo.'
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A gbé “sì” sí ipò àdánidá lẹ́yìn “Wọn,” a sì lo àmì ohùn ní kíkún.
