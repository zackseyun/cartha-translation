  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní kíkún: προέθετο jẹ́ ‘gbé kalẹ̀ ní gbangba’; ἱλαστήριον jẹ́ ‘ẹbọ ètùtù’; ìtumọ̀ ‘nípasẹ̀ ìgbàgbọ́ nínú ẹ̀jẹ̀ rẹ̀’ pa ìsọ̀kan gírámà tí a ń jiyàn lé lórí mọ́; òdodo sì bá δικαιοσύνη mu. Ṣùgbọ́n ‘nítorí pé ó ti fo ... kọjá’ ń sọ ìṣe náà di gbolohun pípé tí ó ní kókó-ọrọ tí kò hàn gbangba. Gíríìkì náà ní ọ̀rọ̀-orúkọ, ‘nítorí ìfo ... kọjá.’'
  naturalness: Yorùbá ọ̀rọ̀ àkọ́kọ́ jẹ́ ti ìlò òde òní, ó sì ní àmì ohùn tó péye. Àtúnṣe kékeré sí ìparí ẹsẹ̀ náà mú un sún mọ́ ìṣètò Gíríìkì, ó sì yọ àìdánilójú nípa ẹni tí ‘ó’ ń tọ́ka sí kúrò.
  terminology: ‘Ẹbọ ètùtù’ jẹ́ yíyan tó dára fún ἱλαστήριον, níwọ̀n bí ó ti pa èrò ẹbọ àti ètùtù mọ́ láì mú ìtumọ̀ ‘ìtùnú ìbínú’ tàbí ‘ibi ètùtù’ di ìtumọ̀ kan ṣoṣo. Àlàyé ìsàlẹ̀ a ni a tún sọ di Yorùbá tó rọrùn díẹ̀, a sì pa àwọn àṣàyàn ìtumọ̀ mọ́.
