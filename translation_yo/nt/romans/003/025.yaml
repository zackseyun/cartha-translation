id: ROM.3.25
reference: Romans 3:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: yo
  text: Ẹni tí Ọlọ́run gbé kalẹ̀ ní gbangba gẹ́gẹ́ bí ẹbọ ètùtù[a] nípasẹ̀ ìgbàgbọ́ nínú ẹ̀jẹ̀ rẹ̀[b], láti fi òdodo rẹ̀ hàn[c], nítorí ìfo àwọn ẹ̀ṣẹ̀ tí a ti dá tẹ́lẹ̀ kọjá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtùnú ìbínú”; tàbí, “ibi ètùtù,” ìyẹn ìdérí wúrà àpótí májẹ̀mú, níbi tí a ti ń wọ́n ẹ̀jẹ̀ ètùtù sí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ ìgbàgbọ́, nípasẹ̀ ẹ̀jẹ̀ rẹ̀.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ìdájọ́ òdodo rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: gbé kalẹ̀ ní gbangba
  rationale: Ó mú ìtumọ̀ fífi Kristi hàn tàbí gbé e kalẹ̀ ní gbangba jáde, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn tóóró kan kún un.
- source_word: ἱλαστήριον
  choice: ẹbọ ètùtù
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ ẹbọ tí ń ṣe ètùtù mọ́ láì dá ọ̀ràn náà mọ́ sí ìtùnú ìbínú Ọlọ́run nìkan tàbí sí ìdérí àpótí májẹ̀mú nìkan.
- source_word: διὰ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Ó tẹ̀ lé ìtumọ̀ pàtàkì ti πίστις, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: nínú ẹ̀jẹ̀ rẹ̀
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì jẹ́ kí àìdánilójú ìsopọ̀ gírámà rẹ̀ dúró; àlàyé ìsopọ̀ mìíràn wà ní àlàyé ìsàlẹ̀.
- source_word: εἰς ἔνδειξιν
  choice: láti fi ... hàn
  rationale: Ó sọ agbára ète tàbí àbájáde gbólóhùn náà ní Yorùbá àdánidá.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún δικαιοσύνη, ó sì lè gba ìtumọ̀ ìwà títọ́ àti ìdájọ́ òdodo; “ìdájọ́ òdodo” wà gẹ́gẹ́ bí òmíràn.
- source_word: πάρεσιν
  choice: fo ... kọjá
  rationale: Ó pa ìtumọ̀ pé Ọlọ́run kò fi ìyà ẹ̀ṣẹ̀ wọ̀nyẹn jẹ lẹ́sẹ̀kẹsẹ̀ mọ́, láì sọ ọ́ di ìdáríjì pípé ní tààrà.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: àwọn ẹ̀ṣẹ̀ tí a ti dá tẹ́lẹ̀
  rationale: Ó mú ìtumọ̀ àkókò participle náà jáde ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ἱλαστήριον tí àwọn ènìyàn ń jiyàn lé lórí
  choice: ẹbọ ètùtù
  alternative: ohun ìtùnú ìbínú; ibi ètùtù (ìdérí àpótí májẹ̀mú)
  rationale: “Ẹbọ ètùtù” ṣeé lóye fún òǹkàwé lásán, ó pa agbára ẹbọ àti ètùtù mọ́, kò sì fi ipá yan ẹ̀ka ìtumọ̀ kan ṣoṣo.
- issue: Bí a ṣe máa so διὰ πίστεως mọ́ ἐν τῷ αὐτοῦ αἵματι
  choice: nípasẹ̀ ìgbàgbọ́ nínú ẹ̀jẹ̀ rẹ̀
  alternative: nípasẹ̀ ìgbàgbọ́, nípasẹ̀ ẹ̀jẹ̀ rẹ̀
  rationale: Ọ̀nà àkọ́kọ́ jẹ́ ìtumọ̀ tó wọ́pọ̀ tí ó sì bọ́gbọ́n mu, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àìdánilójú gírámà Gíríìkì mọ́.
- issue: Ìtumọ̀ δικαιοσύνη ní ọ̀rọ̀ Pọ́ọ̀lù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” pa ààyè ìtumọ̀ gbòòrò mọ́; àlàyé ìsàlẹ̀ fi hàn pé ìdájọ́ Ọlọ́run tó tọ́ lè jẹ́ ohun tí ọ̀rọ̀ náà tẹnu mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo “ẹbọ ètùtù” dípò ọ̀rọ̀ ìmọ̀-ẹ̀kọ́ ìsìn tó le, a sì fi àwọn ìtumọ̀ tí a ń jiyàn lé lórí pamọ́ sínú àwọn àlàyé ìsàlẹ̀.
