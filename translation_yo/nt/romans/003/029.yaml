id: ROM.3.29
reference: Romans 3:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: yo
  text: Àbí Ọlọ́run ha jẹ́ Ọlọ́run àwọn Júù nìkan? Ṣé kì í ṣe Ọlọ́run àwọn tí kì í ṣe Júù náà? Bẹ́ẹ̀ ni, ó jẹ́ Ọlọ́run àwọn tí kì í ṣe Júù náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì ἐθνῶν: “àwọn orílẹ̀-èdè.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ń mú àṣàyàn ìbéèrè mìíràn wọ inú ìjiyàn Pọ́ọ̀lù lọ́nà àdánidá ní Yorùbá.
- source_word: Ἰουδαίων
  choice: àwọn Júù
  rationale: Ó tọ́ka sí àwọn ènìyàn Júù gẹ́gẹ́ bí ẹgbẹ́ kan, ó sì bá ìtumọ̀ ẹ̀yà ọ̀rọ̀ onígbàgbọ́ náà mu.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún θεός; a tún un sọ nínú ìbéèrè kejì àti ìdáhùn kí ọ̀rọ̀ lè ṣe kedere.
- source_word: μόνον
  choice: nìkan
  rationale: Ó pa ìtumọ̀ ìyasọ́tọ̀ àti agbára ìbéèrè Pọ́ọ̀lù mọ́.
- source_word: οὐχὶ
  choice: Kì í ha ṣe ... bí?
  rationale: Àgbékalẹ̀ ìbéèrè yìí ń retí ìdáhùn bẹ́ẹ̀ ni, gẹ́gẹ́ bí οὐχί ṣe ń ṣiṣẹ́ nínú Gíríìkì.
- source_word: ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Nínú ìtakora Júù àti ἔθνη níbí, ọ̀rọ̀ náà túmọ̀ sí àwọn tí kì í ṣe Júù, kì í ṣe orílẹ̀-èdè ní ìtumọ̀ ìṣèlú.
- source_word: ναὶ
  choice: Bẹ́ẹ̀ ni
  rationale: Ìdáhùn ìjẹ́rìí kúkúrú yìí bá ìbéèrè àsọyé náà mu dáadáa.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi àwọn Kèfèrí kún àwọn Júù, ó sì pa ìtẹnumọ́ pé Ọlọ́run jẹ́ ti àwọn méjèèjì mọ́.
theological_decisions:
- issue: 'Bí a ṣe yẹ kí a túmọ̀ ἐθνῶν: ‘àwọn Kèfèrí’ tàbí ‘àwọn orílẹ̀-èdè’'
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Nítorí pé ẹsẹ yìí fi àwọn Júù wé ἔθνη ní tààrà, ohun tí ó ń tọ́ka sí ni àwọn ènìyàn tí kì í ṣe Júù. ‘Àwọn Kèfèrí’ mú ìyàtọ̀ ẹ̀yà inú ìjiyàn Pọ́ọ̀lù hàn kedere, láì sọ ọ́ di ìtumọ̀ ilẹ̀ tàbí ìjọba.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àgbékalẹ̀ ‘Kì í ha ṣe ... bí?’ pa ìbéèrè tí ń retí ìdáhùn rere mọ́.
