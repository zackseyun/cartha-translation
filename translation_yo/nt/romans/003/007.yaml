  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: yo
  text: Ṣùgbọ́n bí òtítọ́ Ọlọ́run ti pọ̀ sí i nípasẹ̀ irọ́ mi fún ògo rẹ̀, kí ló dé tí wọ́n ṣì ń dá mi lẹ́jọ́ bí ẹlẹ́ṣẹ̀?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: òtítọ́ Ọlọ́run
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí òtítọ́ tí ó jẹ́ ti Ọlọ́run tàbí jíjẹ́ olóòótọ́ rẹ̀. “Òtítọ́ Ọlọ́run” bá Gíríìkì mu, ó sì pa ìtumọ̀ méjèèjì mọ́ láì fi tipátipá yan ọ̀kan.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: nípasẹ̀ irọ́ mi
  rationale: ἐν níbí ń tọ́ka sí ohun èlò tàbí ọ̀nà tí ohun kan fi ṣẹlẹ̀; “nípasẹ̀” mú ìtumọ̀ yẹn jáde ní Yorùbá àdánidá.
- source_word: ψεύσματι
  choice: irọ́
  rationale: “Irọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tó sì bá ìtakora rẹ̀ pẹ̀lú òtítọ́ mu.
- source_word: ἐπερίσσευσεν
  choice: ti di púpọ̀ sí i
  rationale: Ó ń sọ nípa pípọ̀ sí i tàbí bíbọ̀ lọ́pọ̀; àkópọ̀ “bá ti di” tún mú ìṣe tó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà hàn.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: fún ògo rẹ̀
  rationale: “Fún ògo rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àbájáde tàbí ète tí εἰς lè fi hàn níbí.
- source_word: τί ἔτι
  choice: èé ṣe tí ... ṣì
  rationale: “Ṣì” pa agbára ἔτι mọ́, ìyẹn pé ìdájọ́ náà ń bá a lọ.
- source_word: κἀγὼ
  choice: mi
  rationale: κἀγώ ní ìtumọ̀ àfikún “èmi pẹ̀lú,” ṣùgbọ́n nínú ìbéèrè Yorùbá yìí “mi” jẹ́ àdánidá, agbára ọ̀rọ̀ náà sì wà nínú gbogbo gbólóhùn.
- source_word: κρίνομαι
  choice: a ... ń dá mi lẹ́jọ́
  rationale: Ìṣe àìmọ̀ ẹni tó ń ṣe é àti àkókò tó ń lọ lọwọ́ wà nínú “a ... ń dá,” láì dín ìtumọ̀ rẹ̀ kù sí ìdálẹ́bi ìkẹyìn.
- source_word: ὡς ἁμαρτωλὸς
  choice: bí ẹlẹ́ṣẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe tààrà fún bí ẹni tí a kà sí ẹlẹ́ṣẹ̀.
theological_decisions:
- issue: Bóyá ἀλήθεια τοῦ θεοῦ yẹ kí ó jẹ́ òtítọ́ ní ìtumọ̀ gbòòrò tàbí jíjẹ́ olóòótọ́ Ọlọ́run.
  choice: òtítọ́ Ọlọ́run
  alternative: jíjẹ́ olóòótọ́ Ọlọ́run
  rationale: Àyíká Romu 3:4–7 ń fi Ọlọ́run olóòótọ́ ṣe ìtakora sí ènìyàn opùrọ́. Síbẹ̀, gbolohun Gíríìkì náà lè gbé ìtumọ̀ gbòòrò “òtítọ́ Ọlọ́run”; yíyan èyí pa àìdánilójú tó wà nínú orísun mọ́ láì yan ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè ọ̀wọ̀, àdánidá, àti òde òní. A lo ìbéèrè àsọyé bí orísun ṣe rí, láì jẹ́ kí ó dà bí ẹni pé Pọ́ọ̀lù fúnra rẹ̀ ń fọwọ́ sí èrò alatako náà.
