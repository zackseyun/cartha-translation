  text: Ẹsẹ̀ wọn yára láti ta ẹ̀jẹ̀ sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ gangan, “Ẹsẹ̀ wọn mú láti tú ẹ̀jẹ̀ jáde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: yára
  rationale: Ní ti gbolohun yìí, ọ̀rọ̀ náà ṣàpèjúwe bí wọ́n ṣe múra tán, tí wọ́n sì tètè lọ ṣe ìwà ipá. “Yára” sọ ìtumọ̀ àkànṣe náà ní Yorùbá àdánidá, bó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààràtà lè jẹ́ “mú.”
- source_word: πόδες
  choice: ẹsẹ̀
  rationale: Èyí ni ìtumọ̀ tààràtà, ó sì pa àwòrán ara tí orísun lò mọ́.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fi hàn pé ẹsẹ̀ náà jẹ́ ti àwọn ẹni tí a ń sọ̀rọ̀ nípa wọn.
- source_word: ἐκχέαι
  choice: láti ta … sílẹ̀
  rationale: Nígbà tí ohun tí a ń tú jáde bá jẹ́ ẹ̀jẹ̀, “ta ẹ̀jẹ̀ sílẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwà pípa tàbí ìwà ipá yìí, dípò títú omi lásán.
- source_word: αἷμα
  choice: ẹ̀jẹ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé, kò sì sí ìdí nínú àyíká ọ̀rọ̀ láti yí i padà.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, tó ṣe kedere, tí ó sì bá ọ̀nà ìsọ̀rọ̀ òde òní mu. A pa àwòrán “ẹsẹ̀” àti ìkanra sí ìwà ipá mọ́, a sì fi ìtumọ̀ tààràtà sí àlàyé ìsàlẹ̀.
