id: ROM.3.22
reference: Romans 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: yo
  text: Àti òdodo Ọlọ́run, nípasẹ̀ ìgbàgbọ́ nínú Jésù Mèsáyà[b], wà fún gbogbo àwọn tí ó gbàgbọ́; nítorí kò sí ìyàtọ̀ kankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Tàbí, “nípasẹ̀ ìṣòtítọ́ Jésù Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó bá δικαιοσύνη mu jù ní àyíká Páùlù, ó sì lè tọ́ka sí ìwà àti iṣẹ́ Ọlọ́run tó tọ́, pẹ̀lú ipò títọ́ tí ó ń fi fún ènìyàn. Ìtumọ̀ bí “ìdájọ́ òdodo” kò gbooro tó fún gbogbo agbára ọ̀rọ̀ náà.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: A pa ìbáṣepọ̀ genitive náà mọ́ gẹ́gẹ́ bí “òdodo Ọlọ́run,” dípò fífi ìtumọ̀ kan pàtó bí “òdodo láti ọ̀dọ̀ Ọlọ́run” lé e lórí.
- source_word: διὰ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: “Ìgbàgbọ́” jẹ́ ìtumọ̀ àdánidá fún πίστις níbí, “nípasẹ̀” sì pa ipa ọ̀nà tàbí ohun èlò tí διά ń fi hàn mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè Mèsáyà níbí; Yorùbá kò nílò àpilẹ̀kọ pàtó bí “the,” nítorí náà “Jésù Mèsáyà” jẹ́ ọ̀nà àdánidá láti gbé orúkọ àti oyè náà kalẹ̀.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: wà fún gbogbo àwọn tí ó gbàgbọ́
  rationale: A ṣàfikún “wà” gẹ́gẹ́ bí àsopọ̀ tí Yorùbá nílò láti mú gbólóhùn náà pé, “fún gbogbo àwọn tí ó gbàgbọ́” sì pa àfojúsùn gbogbo àwọn onígbàgbọ́ mọ́.
- source_word: διαστολή
  choice: ìyàtọ̀
  rationale: “Ìyàtọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá ìtumọ̀ àìsí ìpín tàbí ìyàtọ̀ láàárín àwọn ènìyàn mu ní àyíká yìí.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: ìgbàgbọ́ nínú Jésù Mèsáyà
  alternative: ìṣòtítọ́ Jésù Mèsáyà
  rationale: Genitive náà lè jẹ́ objective, ìyẹn ìgbàgbọ́ tí Jésù Mèsáyà jẹ́ ẹni tí a gbàgbọ́ nínú rẹ̀, tàbí subjective, ìyẹn ìṣòtítọ́ Jésù fúnra rẹ̀. Ọ̀rọ̀ àkọ́kọ́ lo ìtumọ̀ tí ó wọ́pọ̀ jù, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ kejì mọ́.
- issue: δικαιοσύνη θεοῦ
  choice: òdodo Ọlọ́run
  alternative: ìdájọ́ òdodo Ọlọ́run
  rationale: “Òdodo Ọlọ́run” pa àìdánilójú genitive àti ìwọ̀n ìtumọ̀ gbígbòòrò rẹ̀ mọ́; kò pinnu bóyá ohun tí ó lágbára jù ni ìwà Ọlọ́run, iṣẹ́ ìgbàlà rẹ̀, tàbí ipò títọ́ tí ó ń fúnni.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A kò fi àmì [a] sí ọ̀rọ̀ “òdodo,” nítorí “ìdájọ́ òdodo” kì í ṣe àfidípò gígùn-kannáà tó lè dúró dípò rẹ̀ láì dín agbára δικαιοσύνη kù; àmì [b] nìkan ni a lò fún àìdánilójú gidi inú πίστεως Ἰησοῦ Χριστοῦ.
