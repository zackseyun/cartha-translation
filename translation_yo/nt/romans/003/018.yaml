lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: kò sí
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun kan kò sí, ó sì pa agbára ìsẹ̀ tí a sẹ́ mọ́.
- source_word: φόβος
  choice: ìbẹ̀rù
  rationale: “Ìbẹ̀rù” ni ìtumọ̀ tààrà jù lọ; ó tún bá ọ̀rọ̀ inú Ìwé Mímọ́ nípa ìbẹ̀rù tí ó yẹ sí Ọlọ́run mu, láìfi ìtumọ̀ “ọ̀wọ̀ jíjinlẹ̀” rọ́pò rẹ̀ nínú ọ̀rọ̀ pàtàkì.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Nínú gbólóhùn Yorùbá “ìbẹ̀rù Ọlọ́run,” Ọlọ́run ni ẹni tí ìbẹ̀rù náà tọ́ sí; ìṣètò yìí jẹ́ àdánidá, ó sì pa àkópọ̀ Gíríìkì mọ́.
- source_word: ἀπέναντι
  choice: níwájú
  rationale: “Níwájú” pa àwòrán ibi tàbí ìtọ́kasí ohun tí ó wà ní ojú ẹni mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: wọn
  rationale: Pẹ̀lú “níwájú,” Yorùbá àdánidá lè fi “wọn” sọ “níwájú wọn”; ṣùgbọ́n àwòrán ojú tí Gíríìkì ní ni a ṣàlàyé nínú àlàyé ìsàlẹ̀ kí ó má bàa sọnù.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ṣe kedere, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. “Níwájú wọn” jẹ́ àdánidá ju “níwájú ojú wọn” lọ ní Yorùbá; àlàyé ìtumọ̀ yíyàn náà jẹ́ kí àwòrán orísun Gíríìkì hàn.
