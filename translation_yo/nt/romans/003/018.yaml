  text: There is no fear of God before their eyes[a][b].
translation:
  language: yo
  text: “Kò sí ìbẹ̀rù Ọlọ́run níwájú ojú wọn.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
