id: ROM.3.30
reference: Romans 3:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: yo
  text: nítorí Ọlọ́run kan ni ó wà,[a] ẹni tí yóò dá àwọn tí a kọ nílà láre nípa ìgbàgbọ́, tí yóò sì dá àwọn tí a kò kọ nílà láre nípasẹ̀ ìgbàgbọ́.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó bá jẹ́ nítòótọ́ pé Ọlọ́run kan ni ó wà.”
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, ó ní “ìkọlà” àti “àìkọlà,” tí ó túmọ̀ sí àwọn tí a kọ nílà àti àwọn tí a kò kọ nílà.
    reason: cultural_note
  - marker: c
    text: 'Pọ́ọ̀lù lo gbólóhùn méjì tí ó yàtọ̀: “nípa ìgbàgbọ́” àti “nípasẹ̀ ìgbàgbọ́”; ó ṣeé ṣe kí ìyàtọ̀ náà jẹ́ ti ọ̀nà ìsọ̀rọ̀, kì í ṣe ìyàtọ̀ pàtàkì nínú ìtumọ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: nítorí
  rationale: Ní àríyànjiyàn yìí, ọ̀rọ̀ náà ń fi ìdí ohun tí ó tẹ̀ lé múlẹ̀ lórí ìgbàgbọ́ tí gbogbo wọn gbà pé Ọlọ́run kan ṣoṣo ni; kì í ṣe pé Pọ́ọ̀lù ń ṣiyèméjì.
- source_word: εἷς ὁ θεός
  choice: Ọlọ́run kan ni ó wà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtẹnumọ́ pé Ọlọ́run kan ṣoṣo ni mọ́.
- source_word: δικαιώσει
  choice: yóò dá ... láre
  rationale: Ó pa ìgbà ọjọ́ iwájú mọ́, ó sì sọ ìṣe Ọlọ́run ti pípe tàbí kíkà ènìyàn sí olódodo ní èdè Yorùbá tí ó ṣe kedere.
- source_word: περιτομήν
  choice: àwọn onílà
  rationale: Orúkọ àfojúsùn yìí dúró fún àwọn ènìyàn tí a kọ nílà, kì í ṣe ìlànà ìkọlà náà nìkan.
- source_word: ἐκ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ ìdáláre, ní ọ̀nà tí ó bójú mu ní Yorùbá.
- source_word: ἀκροβυστίαν
  choice: àwọn aláìlà
  rationale: Gẹ́gẹ́ bí περιτομήν, ọ̀rọ̀ yìí ń tọ́ka sí àwọn ènìyàn tí a kò kọ nílà; a kò túmọ̀ rẹ̀ sí ‘àwọn Kèfèrí’ nítorí ìyẹn yóò fi ìtumọ̀ kún un.
- source_word: διὰ τῆς πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Ó pa ìyàtọ̀ preposition διά mọ́ ní ìfiwéra pẹ̀lú ἐκ, láì fi dandan sọ pé ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtàkì kan wà.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú ẹsẹ yìí, ‘ìgbàgbọ́’ ni ìtumọ̀ tí ó ṣe kedere, tí ó sì bójú mu jù lọ; kò sí ìṣòro genitive bíi pistis Christou níbí.
theological_decisions:
- issue: Bóyá Pọ́ọ̀lù fẹ́ fi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ hàn láàárín ἐκ πίστεως àti διὰ τῆς πίστεως
  choice: Pa ìyàtọ̀ ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘nípa ìgbàgbọ́’ àti ‘nípasẹ̀ ìgbàgbọ́,’ láì sọ pé wọ́n ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ méjì tí ó yàtọ̀.
  alternative: Túmọ̀ àwọn méjèèjì sí ‘nípa ìgbàgbọ́,’ tàbí ka èkínní sí ìpìlẹ̀ àti èkejì sí ọ̀nà.
  rationale: Gíríìkì lo preposition méjì ọ̀tọ̀ọ̀tọ̀, ṣùgbọ́n àyíká ọ̀rọ̀ kò fipá mú wa láti sọ pé Pọ́ọ̀lù ń kọ́ ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtó kan.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé gbogbogbò ni a lò. ‘Onílà/aláìlà’ jẹ́ ọ̀nà ṣókí àti àdánidá fún àwọn tí a kọ nílà àti àwọn tí a kò kọ nílà. Gbogbo àmì ìsàlẹ̀ ojú ìwé fara hàn nínú ọ̀rọ̀ àkọ́kọ́.
