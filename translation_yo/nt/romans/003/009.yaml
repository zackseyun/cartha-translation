id: ROM.3.9
reference: Romans 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: yo
  text: Kí wá ni? Ṣé àwa sàn ju àwọn ẹlòmíràn lọ? Rárá rárá[a], nítorí a ti fi ẹ̀sùn kan àwọn Júù àti àwọn Gíríìkì tẹ́lẹ̀ pé gbogbo wọn wà lábẹ́ ẹ̀ṣẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé àwa ní àǹfààní kankan?”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “gbogbo wọn wà lábẹ́ agbára ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Kí wá ni?
  rationale: Ọ̀rọ̀ yìí jẹ́ ìbéèrè kúkúrú tó ń so àríyànjiyàn Pọ́ọ̀lù mọ́ ohun tó ṣáájú; “wá” mú ìtumọ̀ οὖν jáde láìfi àfikún tí kò sí nínú Gíríìkì kún un.
- source_word: προεχόμεθα
  choice: Ṣé àwa sàn ju wọn lọ?
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí jíjẹ́ ẹni tó ga tàbí tó wà ní ipò tó dára ju ẹlòmíràn lọ. Ìtumọ̀ yìí bá ọ̀rọ̀ nípa ipò àwọn Júù mu, bó tilẹ̀ jẹ́ pé “Ṣé àwa ní àǹfààní kankan?” tún ṣeé ṣe.
- source_word: οὐ πάντως
  choice: Rárá rárá
  rationale: Ó jẹ́ ìkọ̀sílẹ̀ tó lágbára; “Rárá rárá” jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìdáhùn náà hàn.
- source_word: προῃτιασάμεθα
  choice: a ti fi ẹ̀sùn kan ... tẹ́lẹ̀
  rationale: Ó túmọ̀ sí pé a ti gbé ẹ̀sùn kalẹ̀ ṣáájú; gbólóhùn Yorùbá yìí pa ìrísí ọ̀rọ̀ ẹjọ́ inú àríyànjiyàn Pọ́ọ̀lù mọ́.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: àwọn Júù àti àwọn Gíríìkì
  rationale: Èyí pa ìsopọ̀ ẹgbẹ́ méjèèjì mọ́, ó sì tú “Ἕλληνας” ní tààràtà gẹ́gẹ́ bí “àwọn Gíríìkì.”
- source_word: πάντας
  choice: gbogbo wọn
  rationale: Èyí tẹnumọ́ pé ẹ̀sùn náà kan gbogbo ẹni tó wà nínú ẹgbẹ́ méjèèjì láìsí ìyọkúrò.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: wà lábẹ́ ẹ̀ṣẹ̀
  rationale: Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì ni, ó sì pa àwòrán jíjẹ́ ẹni tó wà lábẹ́ ìṣàkóso tàbí agbára ẹ̀ṣẹ̀ mọ́ láìṣàlàyé rẹ̀ jù.
theological_decisions:
- issue: Ìtumọ̀ ẹni tí “àwa” ń tọ́ka sí àti irú ìfiwéra inú προεχόμεθα
  choice: A tú ìbéèrè náà sí “Ṣé àwa sàn ju wọn lọ?” gẹ́gẹ́ bí ìbéèrè nípa bóyá àwọn Júù ga ju àwọn ẹlòmíràn lọ ní ti ìwà rere tàbí ipò wọn níwájú Ọlọ́run.
  alternative: “Ṣé àwa ní àǹfààní kankan?” lè béèrè nípa àǹfààní àwọn Júù dípò jíjẹ́ ẹni tó sàn ju ẹlòmíràn lọ.
  rationale: Àyíká Róòmù 3:1–9 ń sọ nípa àǹfààní àwọn Júù àti jíjíhìn wọn. Ìtumọ̀ àkọ́kọ́ bá ìkọ̀sílẹ̀ ìgbéraga ẹ̀yà mu, ṣùgbọ́n a fi ìtumọ̀ kejì sínú àlàyé ìsàlẹ̀ nítorí ọ̀rọ̀ Gíríìkì náà kò ṣe kedere pátápátá.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé lásán. “Kí wá ni?” àti “Rárá rárá” mú ìṣàn àríyànjiyàn àti agbára ìdáhùn Pọ́ọ̀lù jáde; “wà lábẹ́ ẹ̀ṣẹ̀” pa àkójọpọ̀ ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́.
