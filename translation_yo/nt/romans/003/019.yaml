  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ó pa ìtọ́kasí sí Òfin, ète ἵνα, àwòrán ‘gbogbo ẹnu,’ àti ipò ìdájọ́ gbogbo ayé mọ́. Ṣùgbọ́n ìṣètò ‘àwọn tí ó wà lábẹ́ Òfin ni ó ń bá sọ̀rọ̀’ yí olùgbọ́ ìṣe náà padà sí kókó gbolóhùn; Gíríìkì sọ pé Òfin ni ó ń sọ̀rọ̀ sí àwọn ènìyàn wọ̀nyẹn.'
  naturalness: 'Àtúnṣe náà mú ìṣètò gbolóhùn Yorùbá rọrùn sí i: ‘ó ń bá àwọn tí ó wà lábẹ́ Òfin sọ̀rọ̀.’ A tún yọ àsọyé ọjọ́ iwájú ‘yóò’ kúrò nínú ọ̀rọ̀ ìdájọ́, nítorí ὑπόδικος γένηται ń sọ ipò tí wọ́n di ẹni tó ní láti dáhùn, kì í ṣe ìṣe ọjọ́ iwájú nìkan.'
  terminology: ‘Òfin’ jẹ́ ọ̀rọ̀ tó bójú mu fún ὁ νόμος nínú àyíká Paulu. ‘Di ẹni tí ó ní láti dáhùn níwájú Ọlọ́run’ dá agbára ilé-ẹjọ́ ὑπόδικος àti ìtumọ̀ ìbẹ̀rẹ̀ γένηται mọ́, láìsọ pé a ti dá gbogbo ayé lẹ́bi tán.
