    rationale: 'Nínú ‘àwọn tí ó wà lábẹ́ Òfin ni ó ń bá sọ̀rọ̀,’ àwọn ènìyàn tí Òfin ń bá sọ̀rọ̀ dà bí ẹni pé àwọn ni ń sọ̀rọ̀. Ọ̀rọ̀ orísun ní ὁ νόμος gẹ́gẹ́ bí kókó: ‘Òfin ... λαλεῖ τοῖς ...’.'
  - severity: low
    issue: ‘Yóò dáhùn’ lè fi ìṣe ọjọ́ iwájú kún ipò òfin náà.
