revisions:
- from: Àwa mọ̀ pé ohunkóhun tí Òfin bá wí, àwọn tí ó wà lábẹ́ Òfin[a] ni ó ń bá sọ̀rọ̀, kí gbogbo ẹnu lè dákẹ́[b], kí gbogbo ayé sì di ẹni tí yóò dáhùn níwájú Ọlọ́run[c].
  to: Àwa mọ̀ pé ohunkóhun tí Òfin bá wí, ó ń bá àwọn tí ó wà lábẹ́ Òfin[a] sọ̀rọ̀, kí gbogbo ẹnu lè dákẹ́[b], kí gbogbo ayé sì di ẹni tí ó ní láti dáhùn níwájú Ọlọ́run[c].
  rationale: A tún un ṣe nítorí àṣìṣe ìṣètò gbolóhùn tó kan ìbáṣepọ̀ kókó-ìṣe àti olùgbọ́ nínú ‘Òfin ń sọ̀rọ̀ sí àwọn tí ó wà lábẹ́ Òfin.’ A tún ṣe ‘yóò dáhùn’ sí ‘ó ní láti dáhùn’ kí ìtumọ̀ ipò-òfin ὑπόδικος γένηται lè hàn kedere. Àwọn àmì ẹsẹ̀ àti gbogbo àwọn àlàyé ìsàlẹ̀ ni a pa mọ́.
