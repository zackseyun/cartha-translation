id: ROM.3.19
reference: Romans 3:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: yo
  text: Àwa mọ̀ pé ohunkóhun tí Òfin bá wí, ó ń bá àwọn tí ó wà lábẹ́ Òfin[a] sọ̀rọ̀, kí gbogbo ẹnu lè dákẹ́[b], kí gbogbo ayé sì di ẹni tí ó ní láti dáhùn níwájú Ọlọ́run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀-lójú-ọ̀rọ̀: “àwọn tí ó wà nínú Òfin.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí a lè pa gbogbo ẹnu mọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “kí gbogbo ayé sì di ẹni tí ó ní láti jíhìn fún Ọlọ́run,” “tí ó yẹ fún ìdájọ́ Ọlọ́run,” tàbí “tí a rí pé ó jẹ̀bi níwájú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Àwa mọ̀ pé
  rationale: “Àwa mọ̀” sọ ìmọ̀ tí àwọn olùkọ̀wé àti olùgbọ́ ń pín; a kò fi ọ̀rọ̀ àkókò bí “nísinsin yìí” kún un. Agbára ìsopọ̀ δέ lè hàn nínú àyíká ọ̀rọ̀ láìfi ìyàtọ̀ líle kún ẹsẹ̀ náà.
- source_word: ὁ νόμος
  choice: Òfin
  rationale: Ó tọ́ka sí Òfin gẹ́gẹ́ bí àṣẹ tí a mọ̀ nínú àríyànjiyàn Paulu, láìsọ ohun tí Gíríìkì kò sọ sí i.
- source_word: ὅσα ... λέγει ... λαλεῖ
  choice: ohunkóhun ... bá wí ... ni ó ń bá sọ̀rọ̀
  rationale: “Wí” àti “sọ̀rọ̀” pa ìyàtọ̀ àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́, wọ́n sì jẹ́ èdè Yorùbá àdánidá.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: àwọn tí ó wà lábẹ́ Òfin
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ọ̀rọ̀-lójú-ọ̀rọ̀ ni “àwọn tí ó wà nínú Òfin,” “wà lábẹ́ Òfin” fi àṣẹ àti agbègbè ìṣàkóso Òfin hàn ní Yorùbá tó ṣe kedere.
- source_word: ἵνα
  choice: kí ... lè ... kí ... sì
  rationale: Ìgbékalẹ̀ yìí fi ète tàbí àbájáde tí ἵνα mú wọlé hàn ní Yorùbá àdánidá.
- source_word: πᾶν στόμα φραγῇ
  choice: kí gbogbo ẹnu lè dákẹ́
  rationale: Ó pa àwòrán “gbogbo ẹnu” mọ́, “dákẹ́” sì sọ ìdákẹ́jẹ́ ẹni tí kò ní àwíjàre ní ọ̀nà tó yé òǹkàwé Yorùbá.
- source_word: ὑπόδικος γένηται
  choice: di ẹni tí yóò dáhùn níwájú
  rationale: Ó pa agbára ọ̀rọ̀ ilé-ẹjọ́ mọ́ gẹ́gẹ́ bí jíjẹ́ ẹni tí ó ní láti dáhùn, láìmú un le dé ìkéde pé a ti dá a lẹ́bi.
- source_word: πᾶς ὁ κόσμος
  choice: gbogbo ayé
  rationale: Ó pa bí ọ̀rọ̀ náà ṣe kan gbogbo aráyé mọ́, ó sì tẹ̀lé àwòrán orísun tó pe ayé ní odindi kan.
- source_word: τῷ θεῷ
  choice: níwájú Ọlọ́run
  rationale: Nínú àyíká ilé-ẹjọ́, “níwájú Ọlọ́run” fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ayé gbọdọ̀ dáhùn níwájú rẹ̀, bó tilẹ̀ jẹ́ pé dátífù náà tún lè jẹ́ “fún Ọlọ́run.”
theological_decisions:
- issue: Agbára ọ̀rọ̀ ilé-ẹjọ́ nínú ὑπόδικος ní ìbáṣepọ̀ pẹ̀lú ìdájọ́ Ọlọ́run
  choice: gbogbo ayé ... di ẹni tí yóò dáhùn níwájú Ọlọ́run
  alternative: gbogbo ayé ... di ẹni tí a rí pé ó jẹ̀bi níwájú Ọlọ́run
  rationale: Yíyan “yóò dáhùn” fi ipò gbogbo ayé lábẹ́ ìdájọ́ Ọlọ́run hàn, ṣùgbọ́n kò sọ ìdájọ́ ẹ̀bi ní ọ̀nà tó lágbára ju ohun tí ὑπόδικος fúnra rẹ̀ béèrè lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo “Òfin” gẹ́gẹ́ bí orúkọ àṣẹ májẹ̀mú tí àyíká náà ń tọ́ka sí; a sì lo ọ̀rọ̀ ilé-ẹjọ́ tó rọrùn fún òǹkàwé òde òní láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
