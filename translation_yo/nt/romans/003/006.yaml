  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: yo
  text: Kí ó má rí bẹ́ẹ̀ rárá![a] Bí ó bá rí bẹ́ẹ̀, báwo ni Ọlọ́run yóò ṣe dá ayé lẹ́jọ́?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Rárá o!”; ní ọ̀nà ọ̀rọ̀ tó túbọ̀ tẹ̀lé ìrísí Gíríìkì, “Kí ó má ṣe rí bẹ́ẹ̀!”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ rárá!
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà tí Pọ́ọ̀lù fi ń kọ èrò kan sílẹ̀ pátápátá. Gbólóhùn Yorùbá yìí pa agbára ìkọ̀sílẹ̀ náà mọ́, ó sì jẹ́ èdè àdánidá tí ó ní iyì.
- source_word: ἐπεὶ
  choice: Bí ó bá rí bẹ́ẹ̀
  rationale: 'Níbi yìí, ọ̀rọ̀ náà mú àbájáde èrò tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ kọ̀ sílẹ̀ wá: bí èrò náà bá jẹ́ òótọ́, ìdájọ́ Ọlọ́run lórí ayé kò ní ṣeé ṣàlàyé. Èyí pa ìṣàn àríyànjiyàn náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.'
- source_word: κρινεῖ
  choice: yóò ṣe dá ... lẹ́jọ́
  rationale: Fáàbù Gíríìkì jẹ́ ọ̀rọ̀ ọjọ́ iwájú. ‘Yóò ṣe dá ... lẹ́jọ́’ fi àkókò náà hàn ní kedere, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: κόσμον
  choice: ayé
  rationale: Ní àyíká ọ̀rọ̀ yìí, κόσμος tọ́ka sí ayé gẹ́gẹ́ bí ohun tí Ọlọ́run yóò dá lẹ́jọ́. ‘Ayé’ ni ọ̀rọ̀ Yorùbá tó rọrùn, tó sì gbòòrò tó fún un.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ìkọ̀sílẹ̀ μὴ γένοιτο
  choice: 'Ìkọ̀sílẹ̀ líle: “Kí ó má rí bẹ́ẹ̀ rárá!”'
  alternative: “Rárá o!” tàbí “Kí ó má ṣe rí bẹ́ẹ̀!”
  rationale: A yan gbólóhùn tó fi ìkọ̀sílẹ̀ Pọ́ọ̀lù hàn gbangba, láìsọ ọ́ di àdúrà tàbí láìfi ẹ̀kọ́ ìsìn àfikún sí i.
- issue: Ìbáṣepọ̀ ἐπεὶ pẹ̀lú ìbéèrè tó tẹ̀ lé e
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ipò àròsọ: “Bí ó bá rí bẹ́ẹ̀”'
  alternative: “Bí bẹ́ẹ̀ kọ́” tàbí “Nítorí nígbà náà”
  rationale: 'Yíyan yìí mú ìtumọ̀ àríyànjiyàn náà jáde: bí ohun tí a ṣẹ̀ṣẹ̀ kọ̀ bá rí bẹ́ẹ̀, báwo ni Ọlọ́run yóò ṣe dá ayé lẹ́jọ́? Ó pa ìbéèrè náà mọ́ gẹ́gẹ́ bí ìbéèrè àròsọ.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní àmì ohùn, tó ṣe kedere fún òǹkàwé òde òní, tí ó sì ní iyì. A pa ìbéèrè àròsọ àti agbára ìkọ̀sílẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
