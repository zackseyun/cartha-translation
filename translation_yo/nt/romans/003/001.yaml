  verdict: revise
  source_fidelity: Ìtumọ̀ àkọ́kọ́ gbé ìbéèrè àsọyé méjèèjì ti Gíríìkì kalẹ̀ dáadáa, ó sì pa ‘Júù’ gẹ́gẹ́ bí ẹyọ aṣojú mọ́. Síbẹ̀, lílo ‘àǹfààní’ fún τὸ περισσὸν àti ἡ ὠφέλεια papọ̀ pa ìyàtọ̀ kékeré tí Pọ́ọ̀lù ṣe nínú ọ̀rọ̀ méjèèjì rẹ́; ‘ìwúlò’ yẹ fún ὠφέλεια dáadáa.
  naturalness: ‘Nítorí náà’ jẹ́ ìṣàn ọrọ̀ Yorùbá boṣewa tí ó rọrùn fún ìyípadà οὖν. ‘Àǹfààní wo ni Júù ní?’ àti ‘ìwúlò wo ni ìkọlà ní?’ jẹ́ ìbéèrè méjì tó dáńgájíá, tó sì jẹ́ ti ìforúkọsílẹ̀ òde òní.
  terminology: ‘Ìkọlà’ jẹ́ ọ̀rọ̀ tó yẹ fún περιτομή nínú àyíká Bíbélì. ‘Júù’ pa orúkọ ẹ̀yà/ẹgbẹ́ ìsìn àti ẹyọ aṣojú ti Ἰουδαίου mọ́. A yí ọ̀rọ̀ kejì sí ‘ìwúlò’ kí ὠφέλεια (‘benefit/usefulness’) má bàa dọ́gba pátápátá pẹ̀lú περισσόν (‘advantage’).
