source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: yo
  text: Nítorí náà, àǹfààní wo ni Júù[b] ní? Tàbí ìwúlò wo ni ìkọlà ní?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ ọ́ sí: “Tàbí iye wo ni ìkọlà ní?”'
    reason: lexical_alternative
  - marker: b
    text: “Júù” jẹ́ ẹyọ aṣojú tó ń tọ́ka sí ẹnì kan nínú ẹ̀ka àwọn Júù lápapọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: Ǹjẹ́ nígbà náà
  rationale: Ó pa ìyípadà ìrònú tí οὖν ń fi hàn mọ́, ó sì mú ìbéèrè àsọyé Pọ́ọ̀lù jáde ní Yorùbá àdánidá.
- source_word: τὸ περισσὸν
  choice: àǹfààní
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó jẹ́ àǹfààní tàbí ohun pàtàkì tí ẹnì kan ní, láìsọ pé Júù ga ju ẹlòmíràn lọ.
- source_word: τοῦ Ἰουδαίου
  choice: ni Júù ní
  rationale: ‘Júù’ lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ ẹ̀yà fún ẹnì kọ̀ọ̀kan ní Yorùbá, ó sì pa ẹyọ aṣojú inú Gíríìkì mọ́.
- source_word: ἢ τίς
  choice: Tàbí ... wo
  rationale: Ó pa ìbáramu ìbéèrè kejì mọ́ ní ọ̀nà tí ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: ἡ ὠφέλεια
  choice: àǹfààní
  rationale: ‘Àǹfààní’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún èrè tàbí ìwúlò tí ohun kan ń mú wá. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì yìí yàtọ̀ sí περισσόν, Yorùbá àdánidá gba àtúnlò ọ̀rọ̀ náà nínú àwọn ìbéèrè tó jọra.
- source_word: τῆς περιτομῆς
  choice: ìkọlà
  rationale: ‘Ìkọlà’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún circumcision, ìṣe májẹ̀mú tí àyíká ẹsẹ̀ náà ń tọ́ka sí.
theological_decisions:
- issue: Bóyá kí a túmọ̀ Ἰουδαίου gẹ́gẹ́ bí ẹyọ aṣojú tàbí ọ̀pọ̀
  choice: Júù (ẹyọ aṣojú)
  alternative: àwọn Júù
  rationale: Gíríìkì lo ẹyọ pẹ̀lú atọ́ka láti ṣojú ẹ̀ka àwọn Júù lápapọ̀. Mímú ‘Júù’ dúró pa ìlànà àsọyé Pọ́ọ̀lù mọ́ láìyí i sí ọ̀pọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé nav.
