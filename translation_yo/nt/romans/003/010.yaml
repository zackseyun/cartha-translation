  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: yo
  text: 'Gẹ́gẹ́ bí a ti kọ ọ́: “Kò sí olódodo kan, àní ọ̀kan ṣoṣo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó ṣe àfihàn ìbámu pẹ̀lú ohun tí a ti kọ sínú Ìwé Mímọ́, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ àyọlò ní Yorùbá.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ìṣe àìṣe ní ọ̀nà perfect yìí tọ́ka sí ohun tí a kọ tẹ́lẹ̀ tí ó ṣì dúró; ‘a ti kọ ọ́’ jẹ́ gbólóhùn Yorùbá àdánidá fún ìtọ́kasí Ìwé Mímọ́.
- source_word: ὅτι
  choice: 'pé:'
  rationale: ‘Pé’ ṣe ìṣàfihàn ọ̀rọ̀ tí a ń tọ́ka sí, àmì ọ̀rọ̀ méjì sì ṣí àyọlò náà sílẹ̀ ní kedere.
- source_word: Οὐκ ἔστιν
  choice: Kò sí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé jù láti sọ ìkọ̀sẹ̀ sí wíwà ẹnì kan.
- source_word: δίκαιος
  choice: olódodo
  rationale: ‘Olódodo’ pa ìtumọ̀ ìwà títọ́ àti ìdájọ́ ododo mọ́, ó sì bá lílo ọ̀rọ̀ náà nínú ọ̀rọ̀ ẹ̀kọ́ Paulu mu.
- source_word: οὐδὲ εἷς
  choice: àní ẹnì kan pàápàá
  rationale: Àkójọpọ̀ ‘àní’ àti ‘pàápàá’ mú ìtẹnumọ́ Gíríìkì hàn pé kò sí ẹyọ kan ṣoṣo tí a yọ sílẹ̀.
theological_decisions:
- issue: Bóyá kí a sọ ọ́ gẹ́gẹ́ bí àlàyé nípa ẹni kọ̀ọ̀kan tàbí kí a pa gbólóhùn náà mọ́ ní ọ̀nà tó gbòòrò, tó sì pé gbogbo ènìyàn.
  choice: Kò sí olódodo kan, àní ẹnì kan pàápàá.
  alternative: Kò sí ẹnì kankan tí ó jẹ́ olódodo.
  rationale: Àyànfẹ́ yìí pa ìtẹnumọ́ àti ìgbòòrò οὐδὲ εἷς mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un tàbí dín ìforígbárí ọ̀rọ̀ Paulu kù.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì, tó ṣeé yé fún gbogbo ènìyàn, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. A lo àgbékalẹ̀ àyọlò Ìwé Mímọ́ tó wọ́pọ̀ láìjẹ́ kí èdè di ti àtijọ́ tàbí ti ilé-ẹ̀kọ́ gíga.
