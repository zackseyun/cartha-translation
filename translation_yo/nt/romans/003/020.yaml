id: ROM.3.20
reference: Romans 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: yo
  text: Nítorí pé kò sí ẹnikẹ́ni tí a ó dá láre níwájú rẹ̀ nípa àwọn iṣẹ́ òfin, nítorí pé nípasẹ̀ òfin ni ìmọ̀ ẹ̀ṣẹ̀ fi ń wá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: nípa àwọn iṣẹ́ òfin
  rationale: 'Ó pa ìbáṣepọ̀ orísun mọ́: àwọn iṣẹ́ tí òfin béèrè tàbí tí a ṣe gẹ́gẹ́ bí òfin, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.'
- source_word: οὐ δικαιωθήσεται
  choice: kò sí ẹnikẹ́ni tí a ó dá láre
  rationale: Ọ̀rọ̀ yìí fi ìṣe ìdájọ́ hàn—pé a kì yóò kéde ẹni náà ní olódodo tàbí gba á sí ẹni tí ó tọ́—ní èdè Yorùbá tí ó ṣe déédéé.
- source_word: πᾶσα σὰρξ
  choice: ẹnikẹ́ni
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí gbogbo ènìyàn; ‘ẹnikẹ́ni’ jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ náà, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ gangan ni ‘gbogbo ẹran ara.’
- source_word: ἐνώπιον αὐτοῦ
  choice: níwájú rẹ̀
  rationale: Ó tẹ̀ lé àwòrán ìdájọ́ inú orísun, níbi tí ènìyàn ti dúró níwájú Ọlọ́run.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: ìmọ̀ ẹ̀ṣẹ̀
  rationale: Ó mú ìtumọ̀ mímọ̀ ẹ̀ṣẹ̀ ní kíkún tàbí dídámọ̀ rẹ̀ jáde, láìsọ òfin di ohun tí ó ń fa ẹ̀ṣẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ πᾶσα σὰρξ
  choice: ẹnikẹ́ni
  alternative: gbogbo ẹran ara
  rationale: ‘Ẹnikẹ́ni’ sọ ìtọ́kasí sí gbogbo ènìyàn ní kedere, ó sì bá èdè Yorùbá òde òní mu; àṣàyàn gangan lè dà bí ẹni pé ó ń tọ́ka sí ara nìkan.
- issue: Ìtumọ̀ δικαιόω
  choice: dá láre
  alternative: sọ di olódodo
  rationale: ‘Dá láre’ pa ìhà ìdájọ́ ọ̀rọ̀ náà mọ́, kò sì fi dandan yanjú gbogbo ìjiyàn nípa bóyá ó túmọ̀ sí ìkéde ipò tàbí ìyípadà inú.
- issue: Ipa òfin nínú gbólóhùn kejì
  choice: nípasẹ̀ òfin ni ìmọ̀ ẹ̀ṣẹ̀ ti ń wá
  alternative: òfin ni ó ń mú kí a mọ ẹ̀ṣẹ̀
  rationale: Àṣàyàn náà tẹ̀ lé ìṣètò orísun, ó sì pa ìfọkànsìn mọ́ pé òfin ń mú ìmọ̀ ẹ̀ṣẹ̀ wá, kì í ṣe pé iṣẹ́ òfin ń dá ènìyàn láre.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘A ó dá láre’ ni a lò dípò fọ́ọ̀mù tí ó le jù, ‘a kì yóò dá láre,’ láti fi ọjọ́ iwájú inú Giriki hàn.
