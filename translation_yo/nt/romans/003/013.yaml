id: ROM.3.13
reference: Romans 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: yo
  text: Ọ̀fun wọn jẹ́ ibojì tí a ṣí sílẹ̀; wọ́n ń fi ahọ́n wọn ṣe ẹ̀tàn[a]; oró ejò paramọ́lẹ̀[b][c] wà lábẹ́ ètè wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “wọ́n ń fi ahọ́n wọn tan ni jẹ.” Ọ̀rọ̀-ìṣe Gíríìkì náà fi ẹ̀tàn tó ń bá a lọ hàn.
    reason: lexical_alternative
  - marker: b
    text: Ní ti ejò, “oró” níbí ni oró tí ejò ń fi eyín rẹ̀ dá sínú ara.
    reason: lexical_clarification
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí asp, viper, tàbí adder; “paramọ́lẹ̀” ni a lò gẹ́gẹ́ bí orúkọ Yorùbá fún irú ejò olóró bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: ibojì
  rationale: “Ibojì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún grave/tomb, ó sì pa àwòrán ikú àti ìbàjẹ́ inú ẹsẹ yìí mọ́.
- source_word: ἀνεῳγμένος
  choice: tí a ṣí sílẹ̀
  rationale: 'Gbólóhùn yìí fi ìṣe tí a ti ṣe àti ipò tí ó yọrí sí hàn: ibojì náà ṣí sílẹ̀.'
- source_word: λάρυγξ
  choice: ọ̀fun
  rationale: “Ọ̀fun” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé jù lọ fún throat, ó sì pa àwòrán ara tó wà nínú Gíríìkì mọ́.
- source_word: ἐδολιοῦσαν
  choice: wọ́n ń fi ahọ́n wọn ṣe ẹ̀tàn
  rationale: Àmì “ń” mú ìṣe tó ń bá a lọ nínú imperfect Gíríìkì jáde, nígbà tí “ṣe ẹ̀tàn” sọ ìtumọ̀ ọ̀rọ̀-ìṣe náà ní Yorùbá àdánidá.
- source_word: ἰὸς
  choice: oró
  rationale: “Oró” lè túmọ̀ sí poison tàbí venom ní Yorùbá; níbi tí ejò ti wà nínú ọ̀rọ̀, venom ni ìtumọ̀ pàtó rẹ̀.
- source_word: ἀσπίδων
  choice: paramọ́lẹ̀
  rationale: “Paramọ́lẹ̀” jẹ́ orúkọ Yorùbá tó wọ́pọ̀ fún ejò olóró irú viper/asp, ó sì dá àwòrán ejò pàtó dúró ju “ejò olóró” lásán lọ.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: lábẹ́ ètè wọn
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì pa àwòrán ara inú orísun mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àkókò-òde tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìṣàkóso gbolóhùn náà tẹ̀ lé àwọn àwòrán mẹ́ta inú Gíríìkì, ṣùgbọ́n ó ń ṣàn lọ́nà àdánidá ní Yorùbá. Àmì “ń” pa ipa imperfect mọ́ láì sọ ọ̀rọ̀ náà di líle.
