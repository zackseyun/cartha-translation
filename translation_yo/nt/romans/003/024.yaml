source:
  edition: SBLGNT
  text: δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: yo
  text: a sì ń dá wọn láre lọ́fẹ̀ẹ́ nípa oore-ọ̀fẹ́ rẹ̀, nípasẹ̀ ìràpadà tí ó wà nínú Mèsáyà Jésù[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sì ń kéde pé wọ́n jẹ́ olódodo.”
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ ìbílẹ̀: “Kristi Jésù.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιούμενοι
  choice: a sì ń dá wọn láre
  rationale: Ọ̀rọ̀ yìí jẹ́ participle oníṣe-títẹ̀síwájú ní passive, ó sì tẹ̀ síwájú láti inú gbolohun ẹsẹ tó ṣáájú. Ìtumọ̀ yìí pa èrò pé Ọlọ́run ni ó ń dá wọn láre mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- source_word: δωρεὰν
  choice: lọ́fẹ̀ẹ́
  rationale: Ó fi hàn pé ìdáláre náà jẹ́ ọ̀fẹ́, kì í ṣe ohun tí ènìyàn fi iṣẹ́ rẹ̀ jèrè.
- source_word: χάριτι
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún χάρις nínú lílo Pọ́ọ̀lù; ó ní ìtumọ̀ ojú rere àti iṣẹ́ rere Ọlọ́run tí a kò tọ́ sí.
- source_word: ἀπολυτρώσεως
  choice: ìràpadà
  rationale: Ó pa èrò ìtúsílẹ̀ nípasẹ̀ owó ìràpadà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ní àyíká yìí.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde dípò kí ó dà bí orúkọ lásán.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: tí ó wà nínú Mèsáyà Jésù
  rationale: Gbólóhùn preposition yìí ń ṣàlàyé ‘ìràpadà’; ìtumọ̀ náà pa ìṣètò Gíríìkì àti ìbáṣepọ̀ ìràpadà pẹ̀lú Mèsáyà Jésù mọ́.
theological_decisions:
- issue: Èdè ìdáláre ti Pọ́ọ̀lù
  choice: a sì ń dá wọn láre
  alternative: a sì ń kéde wọn ní olódodo
  rationale: ‘Dá ... láre’ pa ìtumọ̀ òfin àti ìdájọ́ δικαιόω mọ́ ní ọ̀nà ṣókí, láìdín ọ̀rọ̀ náà kù sí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo. A fi àṣàyàn àlàyé sí àlàyé ìsàlẹ̀.
- issue: Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: ‘Mèsáyà’ fi ìtumọ̀ ẹni àmì-òróró hàn kedere; a pa ọ̀nà ìtumọ̀ ìbílẹ̀ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: 'A lo Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀ àti èdè òde òní. ‘A sì ń dá wọn láre’ jẹ́ ọ̀nà àdánidá láti sọ passive Gíríìkì, ó sì so ẹsẹ yìí mọ́ èrò ẹsẹ tó ṣáájú. ‘Lọ́fẹ̀ẹ́’ àti ‘oore-ọ̀fẹ́’ kò jẹ́ àtúnwí asán: ọ̀kan sọ pé kò sí iye owó tàbí iṣẹ́ tí a san, èkejì sì sọ orísun ìṣe náà.'
