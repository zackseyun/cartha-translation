  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: yo
  text: Kò sí ẹni tí ó lóye; kò sí ẹni tí ó ń wá[a] Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí ó ń fi taratara wá” tàbí “tí ó ń wá kiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: lóye
  rationale: Ọ̀rọ̀ náà túmọ̀ sí níní òye tàbí mímọ ohun pẹ̀lú ìjìnlẹ̀. “Lóye” jẹ́ ọ̀nà àdánidá, kedere ní Yorùbá láti sọ ìtumọ̀ yìí.
- source_word: ἐκζητῶν
  choice: ń wá
  rationale: Ọ̀rọ̀-ìṣe náà lè ní agbára ìtumọ̀ wíwá ohun gidigidi tàbí fífi taratara wá a. “Ń wá” dùn bí Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ alágbára náà pamọ́.
- source_word: οὐκ ἔστιν
  choice: Kò sí ẹni
  rationale: Èyí fi ìsẹ́ kíkún àti ti gbogbo ènìyàn tí ọ̀rọ̀ Gíríìkì ní hàn, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: ẹni tí ó lóye / ẹni tí ó ń wá
  rationale: Àwọn participle tí a lò bí orúkọ ni a túmọ̀ sí gbólóhùn alárọ̀pọ̀ “ẹni tí ó ...,” èyí tí ó bá ìlò Yorùbá mu láìsọ ìtumọ̀ rẹ̀ di aláìpé.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: “Ọlọ́run” ni ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí ní àyíká yìí.
theological_decisions:
- issue: Ìwọ̀n ìsẹ́ nínú ọ̀rọ̀ tí Pọ́ọ̀lù fa yọ
  choice: A pa ọ̀rọ̀ pátápátá “Kò sí ẹni ...” mọ́ ní ẹ̀ẹ̀mejì láìdín agbára rẹ̀ kù.
  alternative: Kò sí ẹni tí ó lóye ní tòótọ́; kò sí ẹni tí ó ń wá Ọlọ́run tọkàntọkàn.
  rationale: Gíríìkì sọ ìsẹ́ náà ní ọ̀nà pátápátá; nítorí náà, a kò fi ọ̀rọ̀ àlàyé kún un tí yóò túmọ̀ rẹ̀ sí ọ̀nà kan pàtó.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. Àtúnṣe “lóye” àti “ń wá” jẹ́ àdánidá, wọ́n sì pa ìsẹ́ pátápátá àti ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́.
