id: ROM.14.6
reference: Romans 14:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: yo
  text: Ẹni tí ó ń pa ọjọ́ náà mọ́[a], ó ń pa á mọ́ fún Olúwa. Ẹni tí ó ń jẹun sì ń jẹun fún Olúwa, nítorí ó ń dúpẹ́ lọ́wọ́ Ọlọ́run; ẹni tí kò sì jẹun, fún Olúwa ni kò jẹun, òun náà sì ń dúpẹ́ lọ́wọ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ka ọjọ́ náà sí pàtàkì” tàbí “ẹni tí ó fi ọkàn sí ọjọ́ náà”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ọkàn sí ohun kan tàbí fífi ojú pàtàkì wò ó. Níhìn-ín, ó ṣeé ṣe kí ó túmọ̀ sí pípa ọjọ́ kan mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: ń pa ... mọ́ / ń pa á mọ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ojú pàtàkì wo ọjọ́ kan nípa ṣíṣe ohun tí ọjọ́ náà béèrè, kì í ṣe ríronú nípa rẹ̀ lásán. “Pa ọjọ́ mọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnìkan ń ṣe àkíyèsí ọjọ́ kan, láìsọ irú ọjọ́ tí ó jẹ́.
- source_word: ἡμέραν
  choice: ọjọ́ náà
  rationale: “Náà” pa ìtọ́kasí pàtó inú àpilẹ̀kọ Gíríìkì mọ́, ó sì ń tọ́ka sí ọjọ́ tí a ti ń jíròrò ní àyíká ẹsẹ náà.
- source_word: κυρίῳ
  choice: nítorí Olúwa
  rationale: Nínú gbólóhùn yìí, dative náà fi hàn pé ìṣe náà dojú kọ Olúwa, a sì ń ṣe é fún un. “Nítorí Olúwa” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì túmọ̀ κύριος sí Ọlọ́run.
- source_word: ἐσθίων / ἐσθίει
  choice: ẹni tí ó ń jẹun / ń jẹun
  rationale: Àkókò ìṣe tí ń lọ ń fi àṣà tàbí ìṣe tí ẹnìkan máa ń ṣe hàn, ó sì pa ìfarawé inú Gíríìkì mọ́.
- source_word: εὐχαριστεῖ τῷ θεῷ
  choice: ó dúpẹ́ lọ́wọ́ Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìdúpẹ́ tí a darí sí Ọlọ́run.
- source_word: ὁ μὴ ἐσθίων
  choice: ẹni tí kò ... jẹun
  rationale: Ìtumọ̀ yìí pa ìkọ̀ àti ìfarawé pẹ̀lú “ẹni tí ó ń jẹun” mọ́, láìfi èrò míì kún un.
theological_decisions:
- issue: Ìtumọ̀ pípa “ọjọ́ náà” mọ́
  choice: Ìtọ́kasí gbogbogbò sí fífi ọjọ́ kan sí mímọ́ tàbí ṣíṣe àkíyèsí rẹ̀ nínú ọ̀ràn tí Róòmù 14 ń jíròrò
  alternative: Ọjọ́ Ìsinmi, ọjọ́ àjọ̀dún àwọn Júù, tàbí ọjọ́ ààwẹ̀ kan pàtó
  rationale: Pọ́ọ̀lù kò dárúkọ irú ọjọ́ náà. Ìtumọ̀ náà ní láti pa ààyè ọ̀rọ̀ rẹ̀ mọ́, kí ó má ṣe fi ẹ̀kọ́ ìjọ kan pàtó sínú rẹ̀.
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: Olúwa
  alternative: Ọlọ́run
  rationale: “Olúwa” pa ọ̀rọ̀ Gíríìkì κύριος mọ́, ó sì jẹ́ kí ìyàtọ̀ rẹ̀ sí “Ọlọ́run,” ẹni tí a dúpẹ́ lọ́wọ́ rẹ̀ nínú ẹsẹ náà, dúró.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó ti bá ìlò àdánidá mu. Ìtúmọ̀ náà pa ìfarawé gbólóhùn Gíríìkì mọ́, ṣùgbọ́n ó lo ìṣètò ọ̀rọ̀ Yorùbá àdánidá.
