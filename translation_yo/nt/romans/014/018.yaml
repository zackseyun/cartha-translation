id: ROM.14.18
reference: Romans 14:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: yo
  text: Nítorí ẹni tí ó bá ń sin Kristi ní ọ̀nà yìí ń mú inú Ọlọ́run dùn, àwọn ènìyàn sì tẹ́wọ́ gbà á.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ní ọ̀nà yìí
  rationale: Ọ̀rọ̀ náà tọ́ka sí ọ̀nà ìránṣẹ́ tí àyíká ẹsẹ̀ ṣáájú ṣàlàyé; yíyí rẹ̀ sí ‘ní ọ̀nà yìí’ jẹ́ Yorùbá àdánidá, ó sì pa ìtọ́kasí náà mọ́.
- source_word: δουλεύων τῷ Χριστῷ
  choice: ń sin Kristi
  rationale: ‘Sin’ fi ìránṣẹ́ àti ìgbọràn tí δουλεύω ní hàn ní Yorùbá tó ṣe kedere; ‘Kristi’ jẹ́ ìtumọ̀ oyè Χριστός tí a mọ̀ dáadáa.
- source_word: εὐάρεστος τῷ θεῷ
  choice: ń mú inú Ọlọ́run dùn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà jẹ́ ẹni ìtẹ́wọ́gbà tàbí ẹni tí ó wu Ọlọ́run.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: àwọn ènìyàn sì tẹ́wọ́ gbà á
  rationale: δόκιμος túmọ̀ sí ẹni tí a ti dán wò tí a sì fọwọ́ sí tàbí tẹ́wọ́ gbà; ‘àwọn ènìyàn’ bo ἀνθρώποις ní ìtumọ̀ gbogbogbò rẹ̀ láì dín un kù sí akọ nìkan.
theological_decisions:
- issue: Ìtọ́kasí τούτῳ
  choice: ní ọ̀nà yìí
  alternative: ní èyí
  rationale: A pa ìtọ́kasí sí ọ̀nà ìgbésí ayé nínú ẹsẹ̀ 17 mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- issue: Ìtumọ̀ Χριστός
  choice: Kristi
  alternative: Mèsáyà
  rationale: ‘Kristi’ jẹ́ oyè tí àwọn òǹkàwé Bíbélì Yorùbá mọ̀, ó sì pa oyè Gíríìkì mọ́; kò sọ ọ́ di orúkọ lasan nínú àlàyé.
- issue: Ìtẹ́wọ́gbà lọ́dọ̀ àwọn ènìyàn
  choice: àwọn ènìyàn sì tẹ́wọ́ gbà á
  alternative: ó sì jẹ́ ẹni tí àwọn ènìyàn fọwọ́ sí
  rationale: A kò túmọ̀ èyí gẹ́gẹ́ bí ìgbàlà tàbí ìdáláre níwájú Ọlọ́run; ó sọ ìdánimọ̀ rere láàárín àwọn ènìyàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘àwọn ènìyàn’ fún ἀνθρώποις nítorí ọ̀rọ̀ Gíríìkì náà jẹ́ ti gbogbo ènìyàn níbí.
