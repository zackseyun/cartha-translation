id: ROM.14.3
reference: Romans 14:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: yo
  text: Ẹni tí ń jẹun kò gbọdọ̀ kẹ́gàn ẹni tí kì í jẹun[a], ẹni tí kì í jẹun kò sì gbọdọ̀ dá ẹni tí ń jẹun lẹ́jọ́[b], nítorí Ọlọ́run ti tẹ́wọ́ gbà á[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kò gbọdọ̀ fi ẹ̀gàn hàn sí i.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kò gbọdọ̀ fi ìdájọ́ lórí ẹni tí ń jẹun.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “Ọlọ́run ti gbà á” tàbí “ti gba á wọlé.” Ọ̀rọ̀ náà tún lè túmọ̀ sí títẹ́wọ́ gba ẹnìkan sínú àjọṣepọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: Ẹni tí ó ń jẹun
  rationale: Ọ̀rọ̀ yìí jẹ́ participle oní-artíkù tí a lò gẹ́gẹ́ bí orúkọ fún irú ẹni tí ìṣe jíjẹun ń ṣàpèjúwe; “ẹni tí ó ń jẹun” jẹ́ Yorùbá àdánidá, ó sì pa agbára ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: τὸν μὴ ἐσθίοντα
  choice: ẹni tí kò jẹun
  rationale: Ó pa ìfiwéra tààrà pẹ̀lú ẹni tí ó ń jẹun mọ́, láì fi kún un pé ó jẹ́ nítorí ẹ̀kọ́ tàbí irú oúnjẹ kan pàtó.
- source_word: ἐξουθενείτω
  choice: kò gbọdọ̀ tẹ́ńbẹ́lú
  rationale: “Tẹ́ńbẹ́lú” túmọ̀ sí kí a ka ẹnìkan sí ẹni tí kò níyelórí tàbí kí a fi ẹ̀gàn hàn sí i; ó bá agbára ìkìlọ̀ náà mu.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: ẹni tí kò sì jẹun
  rationale: “sì” mú ìyàtọ̀ àti ìbáṣepọ̀ láàárín àwọn gbólóhùn méjèèjì hàn lọ́nà Yorùbá àdánidá.
- source_word: κρινέτω
  choice: kò gbọdọ̀ dá … lẹ́jọ́
  rationale: “Dá … lẹ́jọ́” pa ìtumọ̀ fífi ìdájọ́ lórí ẹnìkejì mọ́; a kò dín un kù sí fífi ẹ̀bi ikú tàbí ìdálẹ́bi tó parí sílẹ̀.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún olùṣe nínú gbólóhùn náà.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó fi hàn pé gbólóhùn tó tẹ̀ lé e ni ìdí fún àwọn ìkìlọ̀ méjèèjì.
- source_word: αὐτὸν
  choice: á
  rationale: Arọ́pò-orúkọ ẹnìkẹta ẹyọ kan ni; irú Yorùbá yìí kò fi akọ tàbí abo kún ọrọ̀ Gíríìkì, ó sì jẹ́ kí ìtọ́kasí rẹ̀ dúró bí ó ti rí.
- source_word: προσελάβετο
  choice: ti tẹ́wọ́ gbà
  rationale: “Tẹ́wọ́ gbà” lè sọ ìgbàwọlé, ìtẹ́wọ́gbà, àti gbígba ẹni sínú àjọṣepọ̀; ó bá lílo ọ̀rọ̀ náà ní Róòmù 14:1 àti 15:7 mu.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ìyàtọ̀ jíjẹun àti àìjẹun
  choice: A túmọ̀ rẹ̀ ní gbogbogbò gẹ́gẹ́ bí jíjẹun àti àìjẹun, láì sọ irú oúnjẹ tàbí ìdí ìyàsọ́tọ̀ kan pàtó.
  alternative: Kí a sọ ní kedere pé ọ̀kan ń jẹ gbogbo irú oúnjẹ, èkejì sì ń yẹra fún àwọn oúnjẹ kan.
  rationale: Àyíká ẹsẹ náà dá lórí àríyànjiyàn nípa oúnjẹ, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ ọ́ ní ṣókí gẹ́gẹ́ bí jíjẹun àti àìjẹun. A kò gbọdọ̀ fi àlàyé àyíká sínú ọ̀rọ̀ ẹsẹ náà.
- issue: Ẹni tí αὐτὸν ń tọ́ka sí nínú “Ọlọ́run ti tẹ́wọ́ gbà á”
  choice: A pa arọ́pò-orúkọ ẹyọ kan mọ́, láì pinnu nínú ìtumọ̀ pé ẹni tí ó ń jẹun nìkan ni tàbí pé ó lè kan ẹnìkejì nínú àwọn méjèèjì.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí “nítorí Ọlọ́run ti tẹ́wọ́ gba ẹni tí ó ń jẹun.”
  rationale: Ẹni tó sún mọ́ arọ́pò-orúkọ jù ni ẹni tí ó ń jẹun, ṣùgbọ́n àríyànjiyàn Pọ́ọ̀lù ní gbogbogbò ń kan arákùnrin tàbí arábìnrin tí Ọlọ́run gbà. Pípa arọ́pò-orúkọ mọ́ ń dáàbò bo ìṣòro ìtọ́kasí tó wà nínú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo “tẹ́ńbẹ́lú” fún agbára ẹ̀gàn àti “tẹ́wọ́ gbà” fún ìtumọ̀ ìbáṣepọ̀ ti προσλαμβάνομαι.
