id: ROM.14.5
reference: Romans 14:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: yo
  text: Ẹnì kan ka ọjọ́ kan sí pàtàkì ju ọjọ́ mìíràn lọ[a], ṣùgbọ́n ẹlòmíràn ka gbogbo ọjọ́ sí ọ̀kan náà[b]. Kí olúkúlùkù dá ara rẹ̀ lójú pátápátá nínú ìrònú tirẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnì kan ka ọjọ́ kan sí ohun tó ga ju ọjọ́ mìíràn lọ.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “gbogbo ọjọ́”; nínú àyíká yìí, ìtumọ̀ rẹ̀ ni pé ó ka gbogbo ọjọ́ sí ọ̀kan náà tàbí kò fi ìyàtọ̀ sí wọn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí olúkúlùkù ní ìdánilójú pátápátá nínú ìrònú tirẹ̀” tàbí “kí ìmọ̀lára rẹ̀ dá olúkúlùkù lójú pátápátá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: ka ... sí
  rationale: Nínú àyíká yìí, κρίνει ń tọ́ka sí ṣíṣe àyẹ̀wò tàbí fífi ìyàtọ̀ sí ohun kan, kì í ṣe dandan pé ó túmọ̀ sí dídá ẹnì kan lẹ́bi. ‘Ka ... sí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìgbéyẹ̀wò yìí.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: ọjọ́ kan sí pàtàkì ju ọjọ́ mìíràn lọ
  rationale: Ọ̀rọ̀ παρά nínú ìtòlẹ́sẹẹsẹ yìí fi ìfiwéra hàn. Ìtumọ̀ yìí mú ìyàtọ̀ láàárín ọjọ́ kan àti ọjọ́ mìíràn ṣe kedere láì sọ pé ọjọ́ wo ni Pọ́ọ̀lù ń tọ́ka sí.
- source_word: πᾶσαν ἡμέραν
  choice: gbogbo ọjọ́ sí ọ̀kan náà
  rationale: Ní ti gíríìkì, ó túmọ̀ ní tààrà sí ‘gbogbo ọjọ́,’ ṣùgbọ́n ìtakora pẹ̀lú gbólóhùn àkọ́kọ́ fi hàn pé ẹni kejì kò fi ìyàtọ̀ sí àwọn ọjọ́. ‘Sí ọ̀kan náà’ sọ ìtumọ̀ tí àyíká ń béèrè jáde.
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: ἕκαστος jẹ́ ẹyọ ọ̀rọ̀ tó ń pín ohun náà fún ẹni kọ̀ọ̀kan. ‘Olúkúlùkù’ jẹ́ Yorùbá tó ṣe kedere, ó sì kan gbogbo ẹni tó wà nínú àyíká náà.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: nínú èrò inú tirẹ̀
  rationale: νοῦς lè tọ́ka sí ọkàn ìrònú, òye, tàbí èrò inú. ‘Èrò inú tirẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìtẹnumọ́ lórí ìdájọ́ ara ẹni mọ́.
- source_word: πληροφορείσθω
  choice: ní ìdánilójú kíkún
  rationale: Àṣẹ yìí ń sọ pé kí ìgbàgbọ́ ẹni dá a lójú pátápátá. ‘Ní ìdánilójú kíkún’ mú èrò ìdánilójú tó péye jáde láì fi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
theological_decisions:
- issue: Irú àwọn ‘ọjọ́’ tí ẹsẹ náà ń tọ́ka sí
  choice: Fi ‘ọjọ́’ sílẹ̀ ní gbogbogbò láì sọ pé ó jẹ́ Sábáàtì, ọjọ́ àjọ̀dún, tàbí ọjọ́ ààwẹ̀.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ọjọ́ mímọ́ àwọn Júù, Sábáàtì, tàbí ọjọ́ ààwẹ̀ pàtó.
  rationale: Pọ́ọ̀lù kò sọ irú ọjọ́ náà ní pàtó; ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú tòótọ́ yìí mọ́.
- issue: Ìtumọ̀ πᾶσαν ἡμέραν nínú ìtakora gbólóhùn náà
  choice: ‘Ka gbogbo ọjọ́ sí ọ̀kan náà.’
  alternative: ‘Ka gbogbo ọjọ́’ nìkan.
  rationale: '‘Sí ọ̀kan náà’ kò dúró gẹ́gẹ́ bí ọ̀rọ̀ ọ̀tọ̀ nínú gíríìkì, ṣùgbọ́n ó wà nínú ìtumọ̀ ìtakora: ẹni kejì kò gbé ọjọ́ kan ga ju òmíràn lọ. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.'
- issue: Ẹni tí àṣẹ ἕκαστος ... πληροφορείσθω kàn
  choice: Lo ‘olúkúlùkù’ àti ‘tirẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ tó kan ẹni kọ̀ọ̀kan láì fi akọ tàbí abo sí i.
  alternative: Lo ọ̀rọ̀ aṣojú akọ ní pàtó.
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtòlẹ́sẹẹsẹ gíríìkì jẹ́ ẹyọ, akọ gírámà ni, àyíká náà kan gbogbo onígbàgbọ́. Yorùbá kò fi akọ tàbí abo hàn nínú ‘tirẹ̀,’ nítorí náà ó pa ẹyọ àti ìtẹnumọ́ ara ẹni mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ, ọ̀wọ̀, àti òde òní pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ àdánidá fún òǹkàwé lasán, ó sì pa ìfiwéra, ìtakora, àti àìsọ irú ọjọ́ náà ní pàtó mọ́.
