id: ROM.14.20
reference: Romans 14:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: yo
  text: Má ṣe wó iṣẹ́ Ọlọ́run lulẹ̀ nítorí oúnjẹ. Ohun gbogbo mọ́ ní tòótọ́[a], ṣùgbọ́n ó burú fún ẹni tí ó ń jẹun ní ọ̀nà tí ó fa ìkọsẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Gbogbo oúnjẹ mọ́ ní tòótọ́.” Àyíká ọ̀rọ̀ náà dá lórí oúnjẹ, ṣùgbọ́n Gíríìkì sọ ní tààrà pé “ohun gbogbo.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “fún ẹni tí ó ń jẹun pẹ̀lú ohun ìkọsẹ̀.” Gíríìkì kò sọ ní gbangba bóyá jíjẹ náà mú ẹlòmíràn kọsẹ̀ tàbí bóyá ẹni tí ó ń jẹun ń ṣe é ní ọ̀nà tí ó lòdì sí ẹ̀rí-ọkàn rẹ̀.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: nítorí oúnjẹ
  rationale: “Nítorí” fi ìdí tàbí ohun tí a ṣe nítorí rẹ̀ hàn ní èdè Yorùbá àdánidá; ó sì pa ìtumọ̀ pé oúnjẹ kò yẹ kí ó di okùnfà ìpalára mọ́.
- source_word: κατάλυε
  choice: wó ... lulẹ̀
  rationale: Àwòrán ọ̀rọ̀ yìí fi ìwó ohun tí a kọ́ hàn, ó sì bá ìtumọ̀ ìparun tàbí ìtúká iṣẹ́ Ọlọ́run mu láìsọ ọ́ di ìparun tí kò ṣeé túnṣe.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: iṣẹ́ Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó pa fífẹ̀ gbólóhùn Gíríìkì mọ́, yálà ó ń tọ́ka sí ohun tí Ọlọ́run ń ṣe nínú onígbàgbọ́ kan tàbí láàárín ìjọ.
- source_word: πάντα μὲν καθαρά
  choice: Ohun gbogbo mọ́ ní tòótọ́
  rationale: “Ohun gbogbo” pa fífẹ̀ πάντα mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ yìí dá lórí oúnjẹ; “mọ́” sì pa èdè ìwẹ̀mọ́ mọ́ dípò ṣíṣe àlàyé rẹ̀ sí “ó bófin mu.”
- source_word: κακὸν
  choice: ó burú
  rationale: “Ó burú” jẹ́ ọ̀nà Yorùbá àdánidá tí ó ní agbára ìkìlọ̀ ìwà rere, láìsọ gbólóhùn náà di èdè àjèjì.
- source_word: τῷ ἀνθρώπῳ
  choice: fún ẹni
  rationale: “Ẹni” jẹ́ ọ̀rọ̀ arọ́pò aṣojú tí ó bá ἄνθρωπος mu níbi yìí, ó sì kàn gbogbo ènìyàn láìfi akọ tàbí abo tí ọ̀rọ̀ náà kò fi dandan mú wọlé.
- source_word: διὰ προσκόμματος
  choice: ní ọ̀nà tí ó ń mú ẹlòmíràn kọsẹ̀
  rationale: Èyí pa àwòrán “kíkọsẹ̀” mọ́, ó sì sọ ìtumọ̀ ìwà rere inú àyíká ọ̀rọ̀ di mímọ̀ ní Yorùbá àdánidá.
- source_word: ἐσθίοντι
  choice: ẹni tí ó ń jẹun
  rationale: Ìṣe aláìparí náà ṣàpèjúwe ẹni tí irú jíjẹ bẹ́ẹ̀ ń ṣe; “tí ó ń jẹun” ni ìbámu Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn “ohun gbogbo mọ́” ní ìbáṣepọ̀ pẹ̀lú àwọn òfin oúnjẹ àti òmìnira Kristẹni
  choice: Lo “Ohun gbogbo mọ́ ní tòótọ́,” kí ọ̀rọ̀ náà lè gbòòrò bí ti Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká rẹ̀ dá lórí oúnjẹ.
  alternative: “Gbogbo oúnjẹ mọ́ ní tòótọ́” tàbí “ohun gbogbo bófin mu.”
  rationale: Gíríìkì kò sọ “oúnjẹ” ní gbólóhùn kejì ní tààrà. Fífi “ohun gbogbo” àti “mọ́” sílẹ̀ pa èdè ìwẹ̀mọ́ àti fífẹ̀ ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ kan kun un.
- issue: Ìtumọ̀ διὰ προσκόμματος àti ẹni tí ó ń kọsẹ̀
  choice: Ṣe àfihàn rẹ̀ gẹ́gẹ́ bí jíjẹ ní ọ̀nà tí ń mú ẹlòmíràn kọsẹ̀.
  alternative: Ẹni tí ó jẹun nípasẹ̀ ohun ìkọsẹ̀, tàbí ẹni tí jíjẹ rẹ̀ fúnra rẹ̀ mú un kọsẹ̀.
  rationale: Àyíká Róòmù 14 tẹnu mọ́ bí lílo òmìnira ẹni ṣe lè pa arákùnrin tàbí arábìnrin lára. Síbẹ̀, ìkọ̀lé Gíríìkì kúkúrú, nítorí náà a pa àṣàyàn tó sún mọ́ ọ̀rọ̀ náà mọ́ nínú àlàyé ìsàlẹ̀.
- issue: ἄνθρωπος gẹ́gẹ́ bí ẹyọ ọ̀rọ̀ aṣojú
  choice: Lo “ẹni,” èyí tí ó jẹ́ ẹyọ ọ̀rọ̀ tí ó kàn ènìyàn lápapọ̀.
  alternative: “Ọkùnrin náà.”
  rationale: Ní Yorùbá, “ẹni” pa ìtumọ̀ aṣojú ènìyàn mọ́ lọ́nà àdánidá, láìfi ìtumọ̀ akọ tí kò ṣe pàtàkì sí àyíká ọ̀rọ̀ náà wọlé.
translation_notes:
  register: Yorùbá ìlànà, òde òní, tí ó ní iyì ni a lò. “Wó ... lulẹ̀” àti “kọsẹ̀” pa àwọn àwòrán ọ̀rọ̀ Gíríìkì mọ́, nígbà tí “ẹni” àti ìṣètò gbólóhùn náà jẹ́ kí ẹsẹ náà yé òǹkàwé Yorùbá lójoojúmọ́.
