source:
  edition: SBLGNT
  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: yo
  text: Nítorí náà, ẹ jẹ́ kí a máa lépa àwọn ohun tí ń mú àlàáfíà wá àti àwọn ohun tí ń kọ́ ara wa sókè.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Àwọn ọ̀rọ̀ ìparí méjèèjì yìí ń fa àbájáde jáde láti inú àríyànjiyàn tó ṣáájú; “Nítorí náà” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé tí ó sì mú agbára ìtumọ̀ náà wá.
- source_word: τὰ τῆς εἰρήνης
  choice: àwọn ohun tí ń mú àlàáfíà wá
  rationale: Ẹ̀ka ọ̀rọ̀ yìí tọ́ka sí ohun gbogbo tó jẹ mọ́ àlàáfíà tàbí tó ń gbé e lárugẹ, kì í ṣe àlàáfíà gẹ́gẹ́ bí èrò lásán.
- source_word: διώκωμεν
  choice: ẹ jẹ́ kí a máa lépa
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ìṣílétí fún gbogbo àwùjọ, ó sì ní agbára ìsapá tí ń bá a lọ; “máa lépa” dá èyí hàn ju “wá” lásán lọ.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: àwọn ohun tí a fi ń gbé ... ró
  rationale: οἰκοδομή ní ìtumọ̀ àkàwé ti fífi ènìyàn múlẹ̀ tàbí fífún un lókun. “Gbég ... ró” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, tó ṣeé lóye, tí ó sì pa àkàwé ìkọ́lé mọ́ níwọ̀n kan.
- source_word: τῆς εἰς ἀλλήλους
  choice: ara wa
  rationale: Ọ̀rọ̀ yìí fi ìṣe ẹlẹgbẹ́-sí-ẹlẹgbẹ́ hàn nínú àwùjọ; “ara wa” bá ẹni-kìíní púpọ̀ inú ìṣílétí “ẹ jẹ́ kí a” mu.
theological_decisions:
- issue: Ìwọ̀n fífi ara ẹni ró nínú àwùjọ
  choice: Ẹsẹ̀ náà ń rọ àwọn onígbàgbọ́ lápapọ̀ láti lépa àlàáfíà àti ohun tí yóò fi ara wọn múlẹ̀.
  alternative: Kí a ka a sí ìtẹnumọ́ ìdàgbàsókè ìwà ẹni kọ̀ọ̀kan nìkan.
  rationale: Ọ̀rọ̀ ìṣílétí ẹni-kìíní púpọ̀ àti ἀλλήλους tó túmọ̀ sí “ara wa” fi ìgbé-ayé àwùjọ àti ìṣe tí wọ́n ń ṣe sí ara wọn hàn, láìfi ẹ̀kọ́ ẹ̀sìn ẹ̀ka kan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “àlàáfíà” fún εἰρήνη àti “gbé ara wa ró” fún àkàwé οἰκοδομή.
