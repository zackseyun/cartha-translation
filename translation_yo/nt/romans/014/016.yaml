id: ROM.14.16
reference: Romans 14:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe jẹ́ kí a ba ohun rere yín lórúkọ jẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a má ṣe gàn ohun rere yín” tàbí “kí a má ṣe sọ̀rọ̀ ẹ̀gàn sí ohun rere yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ àbùkù tàbí ọ̀rọ̀ ìbàjẹ́-orúkọ; ‘sọ̀rọ̀-òdì sí Ọlọ́run’ jẹ́ ìtumọ̀ títọ́ ní àwọn àyíká kan, ṣùgbọ́n ó lè mú ìtumọ̀ ẹ̀sìn pàtó wá síbí láìnídìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: ẹ má ṣe jẹ́ kí a máa sọ ibi sí
  rationale: Ìsọ̀rọ̀ yìí mú àṣẹ ìdènà pẹ̀lú ìṣe aláìṣe-taara inú Gíríìkì jáde ní Yorùbá àdánidá. ‘Sọ ibi sí’ túmọ̀ sí sísọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ tí ń ba ohun kan lórúkọ jẹ́, láì fi ìtumọ̀ ẹ̀sìn pàtó sí i.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ìjiyàn tí ó ṣáájú.
- source_word: ὑμῶν
  choice: yín
  rationale: Arọ́pò-orúkọ náà fi ìní tàbí ìbáṣepọ̀ hàn, ó sì bá àṣẹ tí a ń sọ fún ọ̀pọ̀ ènìyàn mu.
- source_word: τὸ ἀγαθόν
  choice: ohun rere yín
  rationale: Ajẹtífù oníṣọ̀kan náà dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ, ‘ohun rere.’ Ìtumọ̀ yìí pa ìtọ́kasí rẹ̀ mọ́ ní fífẹ̀, kò sì dín un kù sí òmìnira tàbí àǹfààní kan pàtó.
theological_decisions:
- issue: Ohun tí ‘τὸ ἀγαθόν’ (ohun rere yín) ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní fífẹ̀ sí ‘ohun rere yín,’ láì sọ ohun tí ó jẹ́ ní pàtó.
  alternative: òmìnira yín; àǹfààní yín; ẹ̀kọ́ rere tàbí ẹ̀rí rere yín
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù kúrú, ó sì lè ní ohun rere tó ní í ṣe pẹ̀lú ìdánilójú àti òmìnira àwọn onígbàgbọ́ nínú àwọn ọ̀ràn tí èrò yàtọ̀ síra. Sísọ ọ́ di ohun kan pàtó yóò yanjú àìdánilójú tí Gíríìkì kò yanjú.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo ‘ẹ’ àti ‘yín’ nítorí pé ὑμῶν tọ́ka sí ọ̀pọ̀ ènìyàn. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tó kan.
