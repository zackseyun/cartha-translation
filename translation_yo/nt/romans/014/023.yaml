id: ROM.14.23
reference: Romans 14:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó bá ń ṣiyèméjì, bí ó bá jẹ, a dá a lẹ́bi, nítorí pé kò jẹ láti inú ìgbàgbọ́[a]; ohun gbogbo tí kò sì wá láti inú ìgbàgbọ́ jẹ́ ẹ̀ṣẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí pé kò ṣe é pẹ̀lú ìdánilójú ọkàn.” Gíríìkì ní “láti inú ìgbàgbọ́,” èyí tí ó lè ní ìtumọ̀ ṣíṣe ohun kan pẹ̀lú ìdánilójú ọkàn tí ó fìdí múlẹ̀ níwájú Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: ẹni tí ó bá ń ṣiyèméjì
  rationale: Nínú ọ̀rọ̀ nípa jíjẹ oúnjẹ yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ọkàn rẹ̀ kò balẹ̀ lórí ohun tí ó fẹ́ ṣe, kì í ṣe ẹni tí ń bá ẹlòmíràn jiyàn.
- source_word: ἐὰν φάγῃ
  choice: bí ó bá jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ipò àídájú hàn.
- source_word: κατακέκριται
  choice: a dá a lẹ́bi
  rationale: Ó pa ohùn àìṣe olùṣe tí Gíríìkì mọ́, kò sì sọ ẹni tí ó dá a lẹ́bi ní pàtó.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó fi ìdí tí a fi dá ẹni náà lẹ́bi hàn ní kedere.
- source_word: ἐκ πίστεως
  choice: wá láti inú ìgbàgbọ́
  rationale: Ó pa àwòrán àti ọ̀rọ̀ pàtàkì Pọ́ọ̀lù mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìdánilójú ọkàn níwájú Ọlọ́run hàn.
- source_word: πᾶν ... ὃ
  choice: ohun gbogbo tí
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtẹnumọ́ gbogbo nǹkan mọ́.
- source_word: ἁμαρτία ἐστίν
  choice: jẹ́ ẹ̀ṣẹ̀
  rationale: Ó pa gbólóhùn ìdánimọ̀ tó lágbára mọ́ dípò yíyí i sí ‘kò dára’ tàbí ‘ó kún fún ẹ̀ṣẹ̀.’
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ọ̀rọ̀ ìwà rere Pọ́ọ̀lù
  choice: ìgbàgbọ́
  alternative: ìdánilójú ọkàn; ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: ‘Ìgbàgbọ́’ pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù mọ́, kò sì dín ìtumọ̀ rẹ̀ kù sí èrò ẹni nìkan. Àlàyé ìsàlẹ̀ tọ́ka sí ìdánilójú ọkàn gẹ́gẹ́ bí ìtumọ̀ tó bá àyíká ọ̀rọ̀ mu.
- issue: Ibi tí ìdálẹ́bi inú κατακέκριται ti wá
  choice: a dá a lẹ́bi
  alternative: ó dá ara rẹ̀ lẹ́bi; ó dúró gẹ́gẹ́ bí ẹni tí Ọlọ́run dá lẹ́bi
  rationale: Gíríìkì kò sọ ẹni tó ṣe ìdájọ́ náà ní pàtó. Nítorí náà, a pa ìṣòro àti àìsọ pàtó náà mọ́ láìfi kún un pé ẹ̀rí-ọkàn tàbí Ọlọ́run nìkan ló dá a lẹ́bi.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tó yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan pàtó.
