id: ROM.14.13
reference: Romans 14:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: yo
  text: 'Nítorí náà, ẹ jẹ́ kí a má ṣe dá ara wa lẹ́jọ́ mọ́. Kàkà bẹ́ẹ̀, ẹ pinnu èyí: kí ẹ má ṣe fi ohun ìkọ̀sẹ̀ tàbí ìdẹ̀kun[a] sí ọ̀nà arákùnrin kan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “okùnfà ìṣubú.” Níhìn-ín, “ìdẹ̀kun” túmọ̀ sí ohun tó lè mú ẹlòmíràn ṣubú sínú ẹ̀ṣẹ̀, kì í ṣe ohun tó kàn ń dun un nínú lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “arákùnrin tàbí arábìnrin kan.” Ọ̀rọ̀ Gíríìkì ní “arákùnrin” ní ẹyọ, ṣùgbọ́n níhìn-ín ó ń tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Μηκέτι
  choice: má ṣe … mọ́
  rationale: Ìṣàpẹẹrẹ Yorùbá yìí fi hàn pé kí ìṣe tí ó ti ń lọ tẹ́lẹ̀ dáwọ́ dúró.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú àti àbájáde ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: ἀλλήλους
  choice: ara wa
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe tí àwọn ènìyàn ń ṣe sí ara wọn.
- source_word: κρίνωμεν
  choice: ẹ jẹ́ kí a má ṣe dá … lẹ́jọ́
  rationale: Ó pa ìṣírí ẹni àkọ́kọ́ púpọ̀ mọ́, ó sì túmọ̀ κρίνω ní ìtumọ̀ dídá ẹlòmíràn lẹ́jọ́ nínú àyíká yìí.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Kàkà bẹ́ẹ̀, ẹ pinnu èyí
  rationale: ‘Ẹ pinnu’ fi ìtumọ̀ ìpinnu ara ẹni hàn, nígbà tí ‘Kàkà bẹ́ẹ̀’ ń ṣàfihàn ìyípadà àti μᾶλλον.
- source_word: τὸ μὴ τιθέναι
  choice: kí ẹ má ṣe fi
  rationale: Ó sọ àkóónú ohun tí wọ́n gbọ́dọ̀ pinnu ní Yorùbá tó ṣe déédéé.
- source_word: πρόσκομμα
  choice: ohun ìkọ̀sẹ̀
  rationale: Ó pa àwòrán ohun tí ó ń mú ènìyàn kọsẹ̀ mọ́, pẹ̀lú ìtumọ̀ ti ẹ̀mí tàbí ìwà rere.
- source_word: τῷ ἀδελφῷ
  choice: sí ọ̀nà arákùnrin kan
  rationale: ‘Sí ọ̀nà’ sọ ìtumọ̀ fífi ohun kan síwájú ẹnì kan ní Yorùbá àdánidá; ‘arákùnrin’ sì pa akọ ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἢ
  choice: tàbí
  rationale: Ó pa ìsopọ̀ yíyan ọ̀kan tàbí èkejì nínú Gíríìkì mọ́ láìfi ìyàtọ̀ tó le ju ti ìpilẹ̀ṣẹ̀ lọ sí wọn.
- source_word: σκάνδαλον
  choice: ìdẹ̀kun
  rationale: Ó fi hàn pé kì í ṣe ìbínú ọkàn lásán, bí kò ṣe ohun tó lè mú onígbàgbọ́ ṣubú sínú ẹ̀ṣẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφῷ gẹ́gẹ́ bí akọ ẹyọ tí ó dúró fún onígbàgbọ́ ẹlẹgbẹ́
  choice: arákùnrin kan
  alternative: arákùnrin tàbí arábìnrin kan; onígbàgbọ́ ẹlẹgbẹ́ kan
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa akọ ẹyọ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ewé sì jẹ́ kó ṣe kedere pé ó lè tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́ lápapọ̀.
- issue: Agbára ìtumọ̀ σκάνδαλον nínú ìkìlọ̀ nípa ìwà
  choice: ìdẹ̀kun
  alternative: okùnfà ìṣubú; ohun tí ń múni ṣubú
  rationale: ‘Ìdẹ̀kun’ pa àwòrán ohun tó dẹ ènìyàn mú, tó sì lè mú un ṣubú sínú ẹ̀ṣẹ̀ mọ́; kò dín un kù sí ohun tó kan ń dun ọkàn ẹnì kan.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ìyàtọ̀ láàárín ‘dá … lẹ́jọ́’ àti ‘pinnu’ ń jẹ́ kí àtúnsọ κρίνω hàn ní ìtumọ̀ tó bá ọ̀rọ̀ mu, bí ó tilẹ̀ jẹ́ pé kò ṣeé pa eré-ọ̀rọ̀ Gíríìkì mọ́ ní kíkún.
