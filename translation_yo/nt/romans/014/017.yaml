id: ROM.14.17
reference: Romans 14:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: yo
  text: Nítorí ìjọba Ọlọ́run kì í ṣe jíjẹ àti mímu, bí kò ṣe òdodo[a], àlàáfíà àti ayọ̀ nínú Ẹ̀mí Mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣòdodo.” Ọ̀rọ̀ Gíríìkì δικαιοσύνη lè túmọ̀ sí òdodo tàbí ìṣòdodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: ìjọba
  rationale: “Ìjọba” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè tọ́ka sí ìjọba Ọlọ́run gẹ́gẹ́ bí agbára ìṣàkóso rẹ̀ àti ipò tí ó ń ṣàkóso.
- source_word: βρῶσις καὶ πόσις
  choice: jíjẹ àti mímu
  rationale: Àwọn ọ̀rọ̀ méjèèjì jẹ́ orúkọ ìṣe nínú Gíríìkì; “jíjẹ àti mímu” pa ìbádọ́gba wọn mọ́, ó sì bá àríyànjiyàn nípa ohun tí a lè jẹ tàbí mu mu.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ àdánidá fún ìwà títọ́ níwájú Ọlọ́run àti ènìyàn, ó sì tún ní ààyè fún ìtumọ̀ ìṣòdodo tí ọ̀rọ̀ Gíríìkì náà lè ní.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” sọ ìbágbépọ̀ rere àti ìrẹ́pọ̀ tí àyíká ọ̀rọ̀ náà ń béèrè lọ́nà tó ṣe kedere.
- source_word: χαρά
  choice: ayọ̀
  rationale: “Ayọ̀” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé jù lọ fún χαρά, ó sì bójú mu nínú èdè ẹ̀sìn tó ní ọlá.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: “Nínú” pa àìdánilójú inú ἐν mọ́—ó lè fi àgbègbè ìrírí tàbí ipa Ẹ̀mí hàn—láì yí i sí “nípasẹ̀”; “Ẹ̀mí Mímọ́” tọ́ka sí Ẹ̀mí Ọlọ́run.
- source_word: γάρ
  choice: Nítorí
  rationale: “Nítorí” fi hàn pé ẹsẹ yìí ń ṣàlàyé ìdí fún ohun tí a sọ ṣáájú.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: òdodo
  alternative: ìṣòdodo
  rationale: “Òdodo” jẹ́ ìtumọ̀ gbooro tí ó lè gba ìwà títọ́ àti ipò títọ́; àlàyé ìsàlẹ̀ pa “ìṣòdodo” mọ́ gẹ́gẹ́ bí ìtumọ̀ tó ṣeé ṣe, láì fi ẹ̀kọ́ ìjọ kan pàtó lé ẹsẹ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní ọlá, tó sì rọrùn fún gbogbo ènìyàn. A lo “bí kò ṣe” láti gbé ìyàtọ̀ οὐ ... ἀλλά jáde lọ́nà àdánidá, a sì fi àmì ohùn sí ibi tó yẹ.
