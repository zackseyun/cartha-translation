id: ROM.14.21
reference: Romans 14:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: yo
  text: Ó dára kí a má jẹ ẹran, kí a má sì mu wáìnì, tàbí kí a má ṣe ohunkóhun tí arákùnrin rẹ yóò kọsẹ̀ nítorí rẹ̀, tàbí tí yóò di ohun ìkọsẹ̀ fún un, tàbí tí yóò fi di aláìlera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ tí ó gba gbogbo ẹni tí àyíká ọ̀rọ̀ yìí kàn, a tún lè sọ pé, “arákùnrin tàbí arábìnrin rẹ”—ìyẹn ni, onígbàgbọ́ ẹlẹgbẹ́ rẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: Ó dára
  rationale: Ó ṣe àfihàn pé ìṣe náà yẹ, ó sì dára ní ti ìwà, láì fi ìtumọ̀ míì kún un.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: kí a má jẹ ẹran
  rationale: Ó pa ìṣe àìjẹ ẹran mọ́ gẹ́gẹ́ bí ohun tí a ń gbé yẹ̀ wò, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: μηδὲ πιεῖν οἶνον
  choice: tàbí kí a mu wáìnì
  rationale: Ó so ìṣe àìmu wáìnì pọ̀ mọ́ àìjẹ ẹran gẹ́gẹ́ bí ohun mìíràn tí ó dára láti yẹra fún nínú ọ̀rọ̀ yìí.
- source_word: μηδὲ ἐν ᾧ
  choice: tàbí kí a ṣe ohunkóhun tí
  rationale: Gíríìkì fi ìṣe náà sílẹ̀ ní àfojúdi; fífi ‘ṣe ohunkóhun’ kún un mú kí Yorùbá péye, láì dín ìtumọ̀ gbígbòòrò rẹ̀ kù.
- source_word: ὁ ἀδελφός σου
  choice: arákùnrin rẹ
  rationale: Ó pa akọ ẹyọ kan nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ ní gbogbogbòò.
- source_word: προσκόπτει
  choice: kọsẹ̀
  rationale: ‘Kọsẹ̀’ pa àwòrán ìkọlù sí ohun tí ń díni lọ́nà mọ́, ó sì bá ìpalára nípa ìwà tàbí ẹ̀mí mu.
- source_word: σκανδαλίζεται
  choice: ṣubú sínú ẹ̀ṣẹ̀
  rationale: Ó yà ọ̀rọ̀ náà sọ́tọ̀ díẹ̀ sí προσκόπτει, ó sì ṣàfihàn jíjẹ́ kí ẹnì kan wọ inú ìdẹ̀ tàbí ìṣubú nípa ìwà; ó yẹra fún ‘bínú’ tí ó lè túmọ̀ sí ìmọ̀lára lásán.
- source_word: ἀσθενεῖ
  choice: di aláìlera
  rationale: Ó pa àìlera ẹ̀rí-ọkàn tàbí ti ẹ̀mí nínú àyíká ọ̀rọ̀ mọ́, láì sọ irú àìlera náà di ohun kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφός gẹ́gẹ́ bí ẹni aṣojú
  choice: arákùnrin rẹ
  alternative: arákùnrin tàbí arábìnrin rẹ; onígbàgbọ́ ẹlẹgbẹ́ rẹ
  rationale: Gíríìkì jẹ́ akọ ẹyọ kan, nítorí náà ọ̀rọ̀ pàtàkì pa èyí mọ́. Síbẹ̀, nínú àyíká ọ̀rọ̀ ó ṣeé ṣe kí ó kan onígbàgbọ́ ẹlẹgbẹ́ yálà ọkùnrin tàbí obìnrin; àlàyé ìsàlẹ̀ ni ó tọ́ka sí èyí.
- issue: Ìbátan láàárín προσκόπτει, σκανδαλίζεται, àti ἀσθενεῖ
  choice: kọsẹ̀, ṣubú sínú ẹ̀ṣẹ̀, tàbí di aláìlera
  alternative: kọsẹ̀, mú un kọsẹ̀, tàbí jẹ́ aláìlera
  rationale: A pa ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta mọ́ láì da wọn pọ̀, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ àwọn méjì àkọ́kọ́ yí ara wọn ká. Àṣàyàn yìí ṣàfihàn ìkọsẹ̀, ìṣubú sínú ẹ̀ṣẹ̀, àti jíjẹ́ aláìlera ní ti ẹ̀rí-ọkàn tàbí ẹ̀mí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. Àtúnṣe ‘kí a…’ mú gbólóhùn àìní olùṣe Gíríìkì wọ Yorùbá lọ́nà tí kò fi àṣẹ tààràtà kún un.
