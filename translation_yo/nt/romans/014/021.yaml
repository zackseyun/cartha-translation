revisions:
- from: Ó dára kí a má jẹ ẹran tàbí kí a mu wáìnì, tàbí kí a ṣe ohunkóhun tí yóò mú kí arákùnrin rẹ kọsẹ̀, tàbí kí ó ṣubú sínú ẹ̀ṣẹ̀, tàbí kí ó di aláìlera[a].
  to: Ó dára kí a má jẹ ẹran, kí a má sì mu wáìnì, tàbí kí a má ṣe ohunkóhun tí arákùnrin rẹ yóò kọsẹ̀ nítorí rẹ̀, tàbí tí yóò di ohun ìkọsẹ̀ fún un, tàbí tí yóò fi di aláìlera[a].
  rationale: A tún ìfẹ̀hónúhàn μηδέ ṣe nínú ìṣe mímu wáìnì. A rọ́pò “ṣubú sínú ẹ̀ṣẹ̀,” tí ó jẹ́ ìtúmọ̀ tó dín ìbòjú-bojú ọ̀rọ̀ orísun kù, pẹ̀lú “di ohun ìkọsẹ̀ fún un.” A tún ṣe ìtọ́kasí ἐν ᾧ ní “nítorí rẹ̀/fún un” kí ìṣe tàbí ohun tí a ṣe lè jẹ́ ayẹyẹ ìpalára náà, gẹ́gẹ́ bí Gíríìkì ṣe fi sílẹ̀.
