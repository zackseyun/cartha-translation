id: ROM.14.8
reference: Romans 14:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: yo
  text: Nítorí bí a bá wà láàyè, a wà láàyè fún Olúwa[a]; bí a bá sì kú, a kú fún Olúwa. Nítorí náà, yálà a wà láàyè tàbí a kú, a jẹ́ ti Olúwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ti Olúwa,” nínú àwọn gbólóhùn tí a tún sọ pé “a wà láàyè fún Olúwa” àti “a kú fún Olúwa.” Dative Gíríìkì lè fi ìbáṣepọ̀, ìdarí sí ẹnì kan, tàbí ohun tí a ṣe fún àǹfààní ẹnì kan hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a jẹ́ ohun-ìní Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Nítorí bí ... bá
  rationale: “Nítorí” pa iṣẹ́ ìṣàlàyé γάρ mọ́, “bí ... bá” sì jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn oníṣ شرط ἐάν τε.
- source_word: ζῶμεν / ζῶμεν
  choice: a bá wà láàyè / a wà láàyè
  rationale: “Wà láàyè” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ζάω níbí, ó sì pa ìyàtọ̀ láàárín gbólóhùn oníṣ شرط àti èsì rẹ̀ mọ́.
- source_word: τῷ κυρίῳ
  choice: fún Olúwa
  rationale: “Fún Olúwa” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu láti fi ìtọ́kasí àti ìdarí ìgbésí ayé tàbí ikú sí Olúwa hàn. Àkọ́lẹ̀ ìsàlẹ̀ jẹ́ kí àyè wà fún ìtumọ̀ dative Gíríìkì tí ó gbòòrò ju èrè tàbí iṣẹ́ nìkan lọ.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni akọ́lé Yorùbá tí ó bá κύριος mu, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ àti ìtumọ̀ inú àyíká ọ̀rọ̀ mọ́ láì sọ ẹni tí akọ́lé náà ń tọ́ka sí ní kedere ju orísun lọ.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: a bá kú / a kú
  rationale: “Kú” ni ìtumọ̀ Yorùbá tààrà fún ἀποθνῄσκω; àwọn fọ́ọ̀mù àsìkò ìsinsìnyí ní Gíríìkì ń sọ ohun tó lè ṣẹlẹ̀ lápapọ̀, kì í ṣe dandan pé ó ń ṣẹlẹ̀ lọ́wọ́lọ́wọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: “Nítorí náà” fi ìparí èrò tí οὖν mú jáde hàn ní Yorùbá ọ̀wọ̀ àti àdánidá.
- source_word: τοῦ κυρίου ἐσμέν
  choice: ti Olúwa ni wá
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá àti alágbára láti fi genitive ohun-ìní hàn, ó sì pa kókó pé a jẹ́ ti Olúwa mọ́.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí àti agbára akọ́lé náà
  choice: A pa “Olúwa” mọ́ gẹ́gẹ́ bí akọ́lé láì fi àlàyé ẹni tí ó jẹ́ sínú ẹsẹ̀ náà.
  alternative: “Ọlọ́run” tàbí “Ọ̀gá,” tí ọ̀kọ̀ọ̀kan wọn lè dín tàbí yí agbára akọ́lé Gíríìkì padà.
  rationale: Àyíká Róòmù 14:9 ń tọ́ka sí Kristi, ṣùgbọ́n κύριος nìkan ni ẹsẹ̀ yìí lò. “Olúwa” pa ìtọ́kasí inú àyíká àti ìró ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò mọ́.
- issue: Ìtumọ̀ ìbáṣepọ̀ nínú gbígbé àti kíkú τῷ κυρίῳ
  choice: “Fún Olúwa” ni a lò, pẹ̀lú àkọ́lẹ̀ ìsàlẹ̀ tó jẹ́ kí ìtumọ̀ ìtọ́kasí tàbí ìbáṣepọ̀ wà ní ṣíṣí.
  alternative: “Ní ti Olúwa” tàbí gbígbé àti kíkú lábẹ́ àṣẹ Olúwa.
  rationale: Dative tí a tún sọ àti ìparí “ti Olúwa ni wá” jọ ń fi ìdarí àti jíjẹ́ ti Olúwa hàn. A kò dín un kù sí iṣẹ́ ìsìn nìkan.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, àti òde òní. Ìṣètò oníṣ شرط “bí ... bá,” àpapọ̀ “yálà ... tàbí,” àti gbólóhùn ìtẹnumọ́ “ti Olúwa ni wá” jẹ́ ohun tí òǹkàwé Yorùbá lásán lè lóye kedere. Àwọn àmì ohùn ni a fi sí ibi gbogbo ní ọ̀nà tó bá Yorùbá boṣewa mu.
