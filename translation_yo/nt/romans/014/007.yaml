id: ROM.14.7
reference: Romans 14:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: yo
  text: Nítorí kò sí ẹni kankan nínú wa tí ó ń gbé fún ara rẹ̀,[a] kò sì sí ẹni kankan tí ó ń kú fún ara rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘sí ara rẹ̀.’ Arọ́pò-orúkọ ìpadà náà nínú dative Gíríìkì lè ní ìtumọ̀ gangan yìí, ṣùgbọ́n níhìn-ín ó ṣeé ṣe kí ó túmọ̀ sí pé ẹni náà ni ohun tí ìgbésí ayé tàbí ikú rẹ̀ ń dojú kọ́ ní pàtàkì jù lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: kò sí ẹnì kankan
  rationale: Ó fi ìkọ̀sẹ̀ àpapọ̀ hàn ní ọ̀nà Yorùbá tí ó ṣe déédé, ó sì bá ìṣọ̀kan àwọn gbólóhùn méjèèjì mu.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí.
- source_word: ἡμῶν
  choice: nínú wa
  rationale: 'Ó túmọ̀ àbájáde partitive genitive náà ní ti ẹ̀dá: ‘kò sí ẹnì kankan nínú wa.’'
- source_word: ἑαυτῷ
  choice: fún ara rẹ̀
  rationale: Ó pa ìtumọ̀ pé ẹni náà ni ìfojúsùn tàbí àǹfààní ìgbésí ayé àti ikú mọ́, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: ζῇ
  choice: ń wà láàyè
  rationale: Ìṣe àkókò ìsinsìnyí ń fi òtítọ́ gbogbogbò tí Pọ́ọ̀lù sọ hàn ní Yorùbá àdánidá.
- source_word: καὶ
  choice: kò sì
  rationale: ‘Sì’ so àwọn gbólóhùn méjèèjì pọ̀, nígbà tí ‘kò’ tún ìkọ̀sẹ̀ tí ó wà nínú οὐδεὶς ṣe.
- source_word: ἀποθνῄσκει
  choice: ń kú
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe gbogbogbò ní àkókò ìsinsìnyí, ó sì dọ́gba pẹ̀lú ‘ń wà láàyè.’
theological_decisions:
- issue: Ìtumọ̀ dative reflexive ἑαυτῷ nínú àwọn gbólóhùn méjèèjì
  choice: fún ara rẹ̀
  alternative: sí ara rẹ̀; nítorí ti ara rẹ̀
  rationale: Àyíká ẹsẹ 8 fi ìgbésí ayé àti ikú tí ó dojú kọ Olúwa wé èyí tí ó dojú kọ ẹni fúnra rẹ̀. ‘Fún ara rẹ̀’ pa ìtumọ̀ ìfojúsùn náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àṣàyàn gangan ‘sí ara rẹ̀’ hàn.
- issue: Ẹni akọ tí Gíríìkì lò gẹ́gẹ́ bí aṣojú gbogbo ènìyàn
  choice: ara rẹ̀
  alternative: ara wọn
  rationale: Yorùbá kò ní àmì akọ tàbí abo nínú ‘rẹ̀’; nítorí náà, ó pa nọ́ńbà ẹyọ Gíríìkì mọ́ láìfi akọ tàbí abo tí kò ṣe pàtàkì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘ń wà láàyè’ dípò ‘ń gbé’ láti yà ìtumọ̀ ‘to live’ sọ́tọ̀ kedere kúrò nínú ‘to dwell/carry.’
