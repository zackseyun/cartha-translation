  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: yo
  text: Ẹ gba ẹni tí ó jẹ́ aláìlera nínú ìgbàgbọ́ sí àárín yín[a], kì í ṣe láti jiyàn lórí àwọn èrò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ kí ẹni náà káàbọ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígba ẹnì kan sí ọ̀dọ̀ ẹni tàbí sínú ìbákẹ́gbẹ́.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́, “kì í ṣe láti máa dájọ́ àwọn èrò tí a ń jiyàn lé lórí,” tàbí, “kì í ṣe fún ìjà lórí àwọn ìrònú.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: ẹni tí ó jẹ́ aláìlera
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí a lò gẹ́gẹ́ bí orúkọ ẹni; yíyàn yìí pa ìtumọ̀ ‘ẹni tí ó jẹ́ aláìlera’ mọ́ láìfi ‘ẹ̀rí-ọkàn’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: τῇ πίστει
  choice: nínú ìgbàgbọ́
  rationale: Dative náà ń tọ́ka sí ibi tàbí ọ̀nà tí àìlera náà wà. ‘Nínú ìgbàgbọ́’ kò sọ ọ́ di àkójọpọ̀ ẹ̀kọ́ ìgbàgbọ́, bẹ́ẹ̀ ni kò fi ìtumọ̀ ‘ìṣòtítọ́’ tí kò bá àyíká mu sí i.
- source_word: προσλαμβάνεσθε
  choice: Ẹ gba ... sí ọ̀dọ̀ yín
  rationale: Imperative middle náà túmọ̀ sí kí wọ́n gba ẹni náà mọ́ra, kí wọ́n sì jẹ́ kó wà nínú ẹgbẹ́ àti ìbákẹ́gbẹ́ wọn. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtumọ̀ gbígbà ẹni sí àjọṣepọ̀ mọ́.
- source_word: μὴ εἰς
  choice: kì í ṣe fún
  rationale: Ó fi ète búburú tí wọn kò gbọdọ̀ ní nígbà tí wọ́n bá gba ẹni náà hàn.
- source_word: διακρίσεις
  choice: àríyànjiyàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà lè tọ́ka sí ìdájọ́ tàbí ìyàtọ̀ èrò tó ń fa awuyewuye; ‘àríyànjiyàn’ sọ agbára ìjà-ọ̀rọ̀ inú rẹ̀ ní Yorùbá òde òní.
- source_word: διαλογισμῶν
  choice: àwọn èrò
  rationale: Genitive náà lè sọ àwọn èrò tàbí ìrònú tí àríyànjiyàn dá lé lórí. ‘Àwọn èrò’ jẹ́ kedere, kò sì dín un kù sí ‘ẹ̀rí-ọkàn tí ń yọni lẹ́nu.’
- source_word: δὲ
  choice: a kò túmọ̀ ọ́ pẹ̀lú ọ̀rọ̀ asopọ̀ lọ́tọ̀
  rationale: Níhìn-ín δέ jẹ́ àmì ìyípadà ọ̀rọ̀ tí kò ní agbára ìtakora tó pọ̀. Bíbẹ̀rẹ̀ pẹ̀lú àṣẹ náà dára ní Yorùbá, ó sì yẹra fún fífi ‘ṣùgbọ́n’ tàbí ‘nísinsin yìí’ tí yóò pọ̀ ju agbára orísun lọ.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àyíká náà ń sọ̀rọ̀ nípa aláìlera nínú ìdánilójú rẹ̀ lórí àwọn ìṣe tí a lè ní èrò ọ̀tọ̀ sí. ‘Ìgbàgbọ́’ pa ọ̀rọ̀ ẹ̀kọ́ ìsìn náà mọ́ láìyanju rẹ̀ sí ‘ìṣòtítọ́’ tàbí sí ìgbẹ́kẹ̀lé nìkan.
- issue: Ìbáṣepọ̀ διακρίσεις àti διαλογισμῶν
  choice: àríyànjiyàn lórí àwọn èrò
  alternative: dídájọ́ àwọn èrò tí a ń jiyàn lé lórí; ìjà lórí àwọn ìrònú
  rationale: Ìsopọ̀ genitive náà kò dájú bóyá ó túmọ̀ sí àwọn èrò tí a ń ṣe ìyàtọ̀ tàbí ìdájọ́ sí, tàbí àwọn ìrònú tí ń fa ìjà. Ọ̀rọ̀ àkọ́kọ́ yan ìtumọ̀ tó bójú mu jù ní àyíká, àkọsílẹ̀ ẹsẹ̀ sì pa àwọn àṣàyàn mìíràn mọ́.
translation_notes:
  register: A lo Yorùbá àfọwọ́dá tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Àṣẹ ‘Ẹ gba’ bá ọ̀pọ̀ ènìyàn mu, ‘sí ọ̀dọ̀ yín’ sì mú ìtumọ̀ gbígba ẹni sínú ìbákẹ́gbẹ́ jáde. A kò fi ọ̀rọ̀ asopọ̀ sí ìbẹ̀rẹ̀ nítorí δέ jẹ́ àmì ìyípadà tó rọrùn níhìn-ín.
