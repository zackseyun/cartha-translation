  source_fidelity: 'Ìtumọ̀ náà mú àwọn ohun pàtàkì Gíríìkì náà wá: aṣẹ ọ̀pọ̀ ẹni, ẹni tí ó jẹ́ aláìlera nínú ìgbàgbọ́, gbígba rẹ̀ sínú ìbákẹ́gbẹ́, àti ìkìlọ̀ lòdì sí àríyànjiyàn nípa àwọn èrò. Síbẹ̀, ‘kì í ṣe fún àríyànjiyàn’ kò rọrùn gẹ́gẹ́ bí àfikún sí àṣẹ ‘Ẹ gba’; ‘kì í ṣe láti jiyàn’ sọ ète tí εἰς ń kọ̀ dáadáa síi.'
