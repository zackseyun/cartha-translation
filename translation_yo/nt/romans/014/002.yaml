id: ROM.14.2
reference: Romans 14:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: yo
  text: Ẹnì kan gbà pé òun lè jẹ ohun gbogbo[a], ṣùgbọ́n ẹni tí ó jẹ́ aláìlera[b] ń jẹ ewébẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó dá a lójú pé òun lè jẹ ohun gbogbo.”
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, “aláìlera” ń tọ́ka sí ẹni tí ìgbàgbọ́ tàbí ẹ̀rí-ọkàn rẹ̀ kò fún un ní òmìnira nípa àwọn àṣà jíjẹ oúnjẹ; wo Róòmù 14:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: Ẹnì kan
  rationale: Ó fi ẹni àkọ́kọ́ nínú ìfiwéra àwọn méjì hàn lọ́nà àdánidá, láìfi akọ tàbí abo kún ọ̀rọ̀ náà.
- source_word: πιστεύει
  choice: gbà pé
  rationale: Nínú àyíká yìí, ó túmọ̀ sí ìgbàgbọ́ tàbí ìdánilójú ẹni nípa ohun tí ó tọ́ láti jẹ, kì í ṣe ìgbàgbọ́ ìgbàlà.
- source_word: φαγεῖν πάντα
  choice: òun lè jẹ ohun gbogbo
  rationale: Ó sọ ohun tí ẹni náà gbà pé ó ní òmìnira láti ṣe; ‘lè’ mú ìtumọ̀ ìyọ̀ǹda tó wà nínú àyíká náà jáde lọ́nà àdánidá.
- source_word: ὁ δὲ
  choice: ṣùgbọ́n ẹni
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ẹni àkọ́kọ́ àti ẹni kejì mọ́.
- source_word: ἀσθενῶν
  choice: tí ó jẹ́ aláìlera
  rationale: Ó pa àpèjúwe Pọ́ọ̀lù mọ́ láìsọ ní pàtó nínú ẹsẹ yìí pé àìlera náà jẹ mọ́ ìgbàgbọ́ tàbí ẹ̀rí-ọkàn.
- source_word: λάχανα
  choice: ewébẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun ọ̀gbìn tí a ń jẹ; ‘ewébẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àyíká oúnjẹ mu.
- source_word: ἐσθίει
  choice: ń jẹ
  rationale: Ó túmọ̀ ọ̀rọ̀-ìṣe náà tààrà; a kò fi ‘nìkan’ kún un nítorí pé kò sí ní gbangba nínú Gíríìkì.
theological_decisions:
- issue: Irú ‘àìlera’ tí ἀσθενῶν ń tọ́ka sí
  choice: tí ó jẹ́ aláìlera
  alternative: tí ìgbàgbọ́ rẹ̀ jẹ́ aláìlera
  rationale: Róòmù 14:1 àti àyíká ọ̀rọ̀ fi hàn pé ó jẹ mọ́ ìgbàgbọ́ tàbí ẹ̀rí-ọkàn nípa oúnjẹ, ṣùgbọ́n ẹsẹ 2 fúnra rẹ̀ kò tún ‘nípa ìgbàgbọ́’ sọ. Ìtumọ̀ náà pa àìsọ-pàtó yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘òun’ láti mú kókó gbólóhùn infinitive náà ṣe kedere, a sì yàgò fún fífi ‘nìkan’ kún ọ̀rọ̀ Gíríìkì.
