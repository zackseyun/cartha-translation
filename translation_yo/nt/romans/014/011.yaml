  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé ọ̀rọ̀ Gíríìkì dáadáa ní gbogbogbò: ó pa àgbékalẹ̀ ‘a ti kọ ọ́,’ ìbúra náà, ‘fún mi,’ àti ìyípadà sí ‘fún Ọlọ́run’ mọ́. Ṣùgbọ́n ‘tẹ̀ ba’ kò pé gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá fún ìfarabalẹ̀/bíbọ̀wọ̀, ó sì nílò àtúnṣe.'
  naturalness: ‘Tẹrí ba’ ni ọ̀nà ìlò Yorùbá tó mọ́gbọ́n dání fún ‘bow’; nípa fífi ‘gbogbo eékún’ sílẹ̀ gẹ́gẹ́ bí kókó-ọrọ̀, ìtumọ̀ náà ṣì pa àwòrán Gíríìkì náà mọ́. Àlàyé ìsàlẹ̀ ti ṣàtúnṣe kí àwọn yíyàn ọ̀rọ̀ rẹ̀ jẹ́ Yorùbá adayeba.
  terminology: ‘Olúwa,’ ‘Ọlọ́run,’ ‘eékún,’ ‘ahọ́n,’ àti ‘jẹ́wọ́’ bójú mu. A kò yẹ kí a mú ‘fún Ọlọ́run’ padà sí ‘fún mi,’ nítorí ìyípadà náà wà nínú ọ̀rọ̀ Gíríìkì fúnra rẹ̀.
