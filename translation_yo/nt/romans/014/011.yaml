  - severity: low
    issue: Ọ̀rọ̀ ‘mọ Ọlọ́run sí’ nínú àlàyé ìsàlẹ̀
    rationale: Ó lè yọrí sí ìdààmú nínú Yorùbá òde òní. ‘jẹ́wọ́ pé Ọlọ́run ni’ ń ṣàfihàn ìtumọ̀ ìmúmọ̀-sí/ìjẹ́wọ́ ní kedere, láì sọ pé ìtumọ̀ kan ṣoṣo ni ọ̀rọ̀ Gíríìkì náà ní.
