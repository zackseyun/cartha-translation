  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: yo
  text: 'Nítorí a ti kọ ọ́ pé:


    “Bí mo ti wà láàyè,” ni Olúwa wí, “gbogbo eékún yóò tẹrí ba fún mi, gbogbo ahọ́n sì yóò jẹ́wọ́ fún Ọlọ́run.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò jẹ́wọ́ pé Ọlọ́run ni,” tàbí “yóò yin Ọlọ́run.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní ìtumọ̀ jíjẹ́wọ́, ìmúmọ̀-sí, tàbí yíyin, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé a ti kọ ọ̀rọ̀ náà sínú Ìwé Mímọ́, ó sì ṣì dúró gẹ́gẹ́ bí ohun tí a kọ.
- source_word: Ζῶ ἐγώ
  choice: Bí mo ti wà láàyè
  rationale: Ó pa agbára ọ̀rọ̀ ìbúra tàbí ìmúdájú ọlọ́wọ̀-mímọ́ náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún κύριος, láì yí i padà sí orúkọ àdáni Ọlọ́run tí kò sí nínú ọ̀rọ̀ Gíríìkì.
- source_word: ἐμοὶ
  choice: fún mi
  rationale: Ó tẹ̀ lé dative Gíríìkì náà ní tààrà, kò sì rọ́pò rẹ̀ pẹ̀lú ‘níwájú mi.’
- source_word: κάμψει πᾶν γόνυ
  choice: gbogbo eékún ni yóò tẹ̀ ba
  rationale: Ó pa àwòrán ara tí ó wà nínú Gíríìkì mọ́—eékún kọ̀ọ̀kan yóò tẹ̀ ba—dípò kí a sọ ọ́ di ‘gbogbo ènìyàn yóò kúnlẹ̀.’
- source_word: πᾶσα γλῶσσα
  choice: gbogbo ahọ́n
  rationale: Ó pa àkàwé ara àti ìró Ìwé Mímọ́ náà mọ́, dípò ìtumọ̀ àlàyé bí ‘gbogbo ènìyàn.’
- source_word: ἐξομολογήσεται
  choice: yóò jẹ́wọ́
  rationale: ‘Jẹ́wọ́’ lè sọ ìjẹ́wọ́ tàbí ìfihàn gbangba; àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn bí mímọ̀ sí àti yíyin mọ́.
- source_word: τῷ θεῷ
  choice: fún Ọlọ́run
  rationale: Ó pa dative náà mọ́ ní kedere, ó sì dá ìyípadà láti ‘fún mi’ sí ‘fún Ọlọ́run’ dúró gẹ́gẹ́ bí ó ti rí nínú ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘Olúwa’ àti ‘Ọlọ́run’ nínú ọ̀rọ̀ àyọlò náà
  choice: A pa ọ̀rọ̀ náà mọ́ pé ‘ni Olúwa wí ... gbogbo ahọ́n ... yóò jẹ́wọ́ fún Ọlọ́run.’
  alternative: Kí a sọ gbólóhùn ìkẹyìn di ‘yóò jẹ́wọ́ fún mi,’ tàbí kí a fi ìdánimọ̀ Kristẹni kan hàn gbangba nínú ìtumọ̀ náà.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ yí láti ẹni àkọ́kọ́ ‘fún mi’ sí ‘fún Ọlọ́run.’ Ìtumọ̀ kò gbọ́dọ̀ mú ìyípadà yìí dọ́gba tàbí pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tí ó lọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìtòlẹ́sẹẹsẹ ewì ọ̀rọ̀ àyọlò náà mọ́.
