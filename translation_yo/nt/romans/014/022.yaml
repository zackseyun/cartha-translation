id: ROM.14.22
reference: Romans 14:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: yo
  text: Ìgbàgbọ́ tí o ní[a], pa á mọ́ fún ara rẹ níwájú Ọlọ́run. Alábùkún ni ẹni tí kò dá ara rẹ̀ lẹ́jọ́[b] nínú ohun tí ó fọwọ́ sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìdánilójú tí o ní.” Ọ̀rọ̀ Gíríìkì πίστις sábà máa ń túmọ̀ sí “ìgbàgbọ́,” ṣùgbọ́n níhìn-ín ó lè tọ́ka sí ìdánilójú ẹni nípa àwọn ọ̀ràn tí èrò yà sí ọ̀tọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí kò dá ara rẹ̀ lẹ́bi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún πίστις. Nínú àyíká ẹsẹ yìí, ó ń tọ́ka sí ìdánilójú ẹni nípa ọ̀ràn tí èrò lè yà sí ọ̀tọ̀, kì í ṣe dandan pé ó ń sọ nípa ìgbàgbọ́ ìgbàlà.
- source_word: κατὰ σεαυτὸν
  choice: sí ara rẹ
  rationale: Gbólóhùn yìí fi hàn pé kí ẹni náà má ṣe fi ìdánilójú tirẹ̀ lé àwọn ẹlòmíràn lórí; ó yẹ kí ó pa á mọ́ fún ara rẹ̀.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: 'Ó pa ìtumọ̀ jíjíhìn sí Ọlọ́run mọ́: ẹni náà pa ìgbàgbọ́ yìí mọ́ fún ara rẹ̀, ṣùgbọ́n ó ń ṣe bẹ́ẹ̀ níwájú Ọlọ́run.'
- source_word: μακάριος
  choice: Alábùkún-fún
  rationale: Ọ̀rọ̀ yìí ní ìwọ̀n ìwà rere àti ti ẹ̀mí ju ‘aláyọ̀’ lọ, ó sì bá ìlò Páùlù nínú ìtọ́ni yìí mu.
- source_word: κρίνων ἑαυτὸν
  choice: dá ara rẹ̀ lẹ́jọ́
  rationale: Èyí dúró sún mọ́ ìtumọ̀ κρίνω gẹ́gẹ́ bí ‘ṣe ìdájọ́,’ nígbà tí àyíká náà tún lè fún un ní ìtumọ̀ dídá ara ẹni lẹ́bi.
- source_word: ἐν ᾧ δοκιμάζει
  choice: nípa ohun tí ó fọwọ́ sí
  rationale: δοκιμάζω níhìn-ín túmọ̀ sí fífi ọwọ́ sí ohun kan lẹ́yìn àyẹ̀wò. ‘Nípa’ fi hàn pé ohun tí ẹni náà fọwọ́ sí lè di ohun tí yóò fi dá ara rẹ̀ lẹ́jọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àyíká ọ̀ràn ìwà tí èrò yà sí ọ̀tọ̀
  choice: Ìgbàgbọ́ tí a lóye gẹ́gẹ́ bí ìdánilójú ẹni níwájú Ọlọ́run nípa ọ̀ràn náà
  alternative: Ìgbẹ́kẹ̀lé Ọlọ́run lápapọ̀ tàbí ìṣòtítọ́
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ń sọ nípa ìṣe tí èrò yà sí ọ̀tọ̀ àti ẹ̀rí-ọkàn. A pa ‘ìgbàgbọ́’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì, a sì fi ‘ìdánilójú’ hàn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá bá èdè àdánidá mu; ọ̀rọ̀ náà sì pa ìyàtọ̀ tó wà láàárín pípa ìdánilójú mọ́ fún ara ẹni àti jíjíhìn níwájú Ọlọ́run mọ́.
