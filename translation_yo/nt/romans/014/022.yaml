  to: Ìgbàgbọ́ tí o ní[a], pa á mọ́ fún ara rẹ níwájú Ọlọ́run. Alábùkún ni ẹni tí kò dá ara rẹ̀ lẹ́jọ́[b] nínú ohun tí ó fọwọ́ sí.
  rationale: Àtúnṣe náà mú ìpàṣẹ náà rọrùn, ó ṣàtúnṣe ọ̀rọ̀ ‘Alábùkún’ sí ìlò Yorùbá tó dára, ó sì mú ìbáṣepọ̀ ‘nínú’ pọ̀ mọ́ ἐν ní apá ìkẹyìn. Kò yí ìtumọ̀ ẹsẹ náà, ìtumọ̀ ẹ̀kọ́, tàbí àwọn àṣàyàn àlàyé ìsàlẹ̀ padà.
