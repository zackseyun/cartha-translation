  - severity: medium
    issue: ‘Alábùkún-fún’
    rationale: Àmì àsopọ̀ náà kò yẹ, ó sì dá bí ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀. ‘Alábùkún ni ẹni’ ni ọ̀nà Yorùbá tó dára láti sọ μακάριος ὁ.
