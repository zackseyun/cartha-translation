  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ gíríìkì náà mọ́ lápapọ̀: πίστις jẹ́ ‘ìgbàgbọ́,’ a sì ṣàlàyé ààyè ìtumọ̀ ‘ìdánilójú’ nínú àlàyé ìsàlẹ̀. Ìyàtọ̀ láàárín κατὰ σεαυτόν (‘fún ara rẹ’) àti ἐνώπιον τοῦ θεοῦ (‘níwájú Ọlọ́run’) wà ní kedere. ‘Nínú ohun tí ó fọwọ́ sí’ ń pa àyè/sífíà ἐν ᾧ dókímazéi mọ́ dáadáa.'
  naturalness: ‘Máa pa á mọ́ sí ara rẹ’ kò rọrùn gan-an nínú Yorùbá ìtọ́ni, ó sì lè fi ìṣe àṣà-tẹ̀síwájú hàn. ‘Pa á mọ́ fún ara rẹ’ jẹ́ ìlànà ìpàṣẹ tí ó tọ́, tí ó sì dára ní Yorùbá òde òní. Bákan náà, ‘Alábùkún-fún’ jẹ́ àkópọ̀ ọ̀rọ̀ tí kò dára; ‘Alábùkún ni ẹni’ jẹ́ àdánidá.
  terminology: A pa ‘ìgbàgbọ́,’ ‘Ọlọ́run,’ àti ‘Alábùkún’ mọ́ gẹ́gẹ́ bí àwọn ọ̀rọ̀ ìjọsìn Yorùbá tí ó bójú mu. ‘Dá ara rẹ̀ lẹ́jọ́’ ń tẹ̀lé ìtumọ̀ ìpilẹ̀ κρίνω, nígbà tí àlàyé ìsàlẹ̀ ń fúnni ní ‘dá ara rẹ̀ lẹ́bi’ gẹ́gẹ́ bí àṣàyàn tó bá àyíká mu.
  issues:
