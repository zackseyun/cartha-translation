    issue: ‘nípa ohun tí ó fọwọ́ sí’
    rationale: Ó ṣeé gbà, ṣùgbọ́n ‘nínú ohun tí ó fọwọ́ sí’ ń ṣàfihàn ἐν dáadáa ju, ó sì bá ìlò Yorùbá ti gbólóhùn yìí mu.
