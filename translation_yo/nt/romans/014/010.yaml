id: ROM.14.10
reference: Romans 14:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: yo
  text: Ṣùgbọ́n ìwọ, èé ṣe tí o fi ń dá arákùnrin rẹ lẹ́jọ́? Tàbí ìwọ náà, èé ṣe tí o fi ń kẹ́gàn arákùnrin rẹ[b]? Nítorí gbogbo wa yóò dúró níwájú ìtẹ́ ìdájọ́ Ọlọ́run[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “ìtẹ́ ìdájọ́ Kristi.”
    reason: textual_variant
  - marker: b
    text: Tàbí “arákùnrin tàbí arábìnrin rẹ”; èdè Gíríìkì ní “arákùnrin rẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ṣùgbọ́n ìwọ
  rationale: Ó pa agbára ìtakora δέ àti ìtẹnumọ́ arọ́pò-orúkọ σύ mọ́ ní Yorùbá àdánidá.
- source_word: τί κρίνεις
  choice: èé ṣe tí o fi ń dá ... lẹ́jọ́
  rationale: Nínú ìbéèrè aláwọ̀-ọrọ̀ yìí, τί túmọ̀ sí ‘èé ṣe’; ‘dá ... lẹ́jọ́’ pa ìtumọ̀ κρίνω mọ́ láì mú un dé ‘dálẹ́bi.’
- source_word: τὸν ἀδελφόν σου
  choice: arákùnrin rẹ
  rationale: Ó tẹ̀ lé akọ ẹyọ ọ̀rọ̀ Gíríìkì ἀδελφός ní tààrà; àlàyé ìtumọ̀ tó lè kan arábìnrin wà ní àlàyé ìsàlẹ̀.
- source_word: ἢ καὶ σὺ
  choice: Tàbí ìwọ pẹ̀lú
  rationale: Ó pa ìtẹnumọ́ ẹni kejì àti agbára àfikún καί mọ́.
- source_word: τί ἐξουθενεῖς
  choice: èé ṣe tí o fi ń kẹ́gàn
  rationale: ‘Kẹ́gàn’ sọ ìwà tí a fi ka ẹnì kan sí ẹni tí kò níye lórí, gẹ́gẹ́ bí ἐξουθενέω ṣe túmọ̀ sí.
- source_word: πάντες γὰρ
  choice: Nítorí gbogbo wa
  rationale: ‘Nítorí’ fi ipa ìdí tàbí àlàyé γάρ hàn, ‘gbogbo wa’ sì fi hàn pé Pọ́ọ̀lù ka ara rẹ̀ mọ́ àwọn olùgbọ́.
- source_word: παραστησόμεθα
  choice: ni a ó dúró níwájú
  rationale: Ó bá àwòrán ilé-ẹjọ́ mu, ó sì sọ ìfarahàn níwájú adájọ́ ní Yorùbá àdánidá.
- source_word: τῷ βήματι
  choice: ìtẹ́ ìdájọ́
  rationale: Ó pa àwòrán βῆμα gẹ́gẹ́ bí ibi ìjókòó adájọ́ tàbí ilé-ẹjọ́ mọ́.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ó túmọ̀ gẹnitífù náà ní tààrà gẹ́gẹ́ bí ‘ìtẹ́ ìdájọ́ Ọlọ́run,’ ní ìbámu pẹ̀lú ọ̀rọ̀ SBLGNT.
theological_decisions:
- issue: Ẹni tí gbogbo ènìyàn yóò dúró níwájú ìtẹ́ ìdájọ́ rẹ̀
  choice: Ọlọ́run
  alternative: Kristi
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè ní τοῦ θεοῦ (‘Ọlọ́run’). A kò ṣe é ní ìṣọ̀kan pẹ̀lú 2 Kọrinti 5:10; dípò bẹ́ẹ̀, a pa ẹ̀rí àfọwọ́kọ míì tí ó ní ‘Kristi’ mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A gbé àmì [a] sí lẹ́yìn ‘Ọlọ́run’ àti [b] sí lẹ́yìn ‘arákùnrin rẹ’ kí ọkọọkan lè bá àlàyé tirẹ̀ mu, nítorí ibi tí wọ́n wà nínú consultation layer Gẹ̀ẹ́sì dà bí ẹni pé wọ́n ti pààrọ̀.
