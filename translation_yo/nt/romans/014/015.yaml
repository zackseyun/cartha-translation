  naturalness: Yorùbá náà jẹ́ boṣewa, ó sì ní àmì ohùn tó yẹ. “Ń banújẹ́,” “rìn ní ìbámu pẹ̀lú,” àti “pa ... run” jẹ́ ọ̀nà tí ó ṣeé lóye, tó sì yẹ fún ìforúkọsílẹ̀ Bíbélì òde òní. Àtúnwá “kò tún ... mọ́” jẹ́ ìlò tí ó ṣeé gbà nínú àyíká ìkìlọ̀ yìí.
  terminology: “Arákùnrin” pa akọ-ẹyọ Gíríìkì mọ́, pẹ̀lú àlàyé ìsàlẹ̀ tó fi hàn pé ó lè kan arábìnrin náà. “Oúnjẹ” yẹ fún βρῶμα, kì í fi ọ̀rọ̀ náà sí ẹran nìkan. “Mèsáyà” bá ìpinnu ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè mu. Àwọn àmì àlàyé a, b, c wà ní ibi tí ó tọ́, wọ́n sì bá àlàyé wọn mu.
