id: ROM.14.15
reference: Romans 14:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: yo
  text: 'Nítorí bí arákùnrin rẹ[a] bá ń banújẹ́ nítorí oúnjẹ, ìwọ kò tún rìn ní ìbámu pẹ̀lú ìfẹ́ mọ́. Má ṣe fi oúnjẹ rẹ pa ẹni náà run[b]—ẹni tí Mèsáyà[c] kú fún.


    [a] Tàbí, “arákùnrin tàbí arábìnrin”; ọ̀rọ̀ Gíríìkì náà fún “arákùnrin” lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ ẹni.

    [b] Tàbí, “Má ṣe ba ẹni náà jẹ́” tàbí “Má ṣe fa ìparun ẹni náà.” Ọ̀rọ̀ ìṣe Gíríìkì náà lágbára, ó sì lè tọ́ka sí ìpalára ńlá nípa tẹ̀mí; ẹsẹ yìí fúnra rẹ̀ kò sọ pàtó ohun tí èyí túmọ̀ sí nípa ẹ̀kọ́ ìgbàgbọ́.

    [c] Gíríìkì, “Kristi”; a túmọ̀ ọ́ sí “Mèsáyà” níbí nítorí pé Χριστός jẹ́ orúkọ oyè.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin tàbí arábìnrin”; ọ̀rọ̀ Gíríìkì náà fún “arákùnrin” lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ ẹni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Má ṣe ba ẹni náà jẹ́” tàbí “Má ṣe fa ìparun ẹni náà.” Ọ̀rọ̀ ìṣe Gíríìkì náà lágbára, ó sì lè tọ́ka sí ìpalára ńlá nípa tẹ̀mí; ẹsẹ yìí fúnra rẹ̀ kò sọ pàtó ohun tí èyí túmọ̀ sí nípa ẹ̀kọ́ ìgbàgbọ́.
    reason: alternative_reading
  - marker: c
    text: Gíríìkì, “Kristi”; a túmọ̀ ọ́ sí “Mèsáyà” níbí nítorí pé Χριστός jẹ́ orúkọ oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: oúnjẹ / fi oúnjẹ rẹ
  rationale: “Oúnjẹ” tọ́ka sí ohun jíjẹ lápapọ̀, kì í ṣe ẹran nìkan. “Fi oúnjẹ rẹ” fi ipa dátífù ohun èlò tàbí ohun tó fa ìṣẹ̀lẹ̀ náà hàn lọ́nà Yorùbá àdánidá.
- source_word: ἀδελφός
  choice: arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ẹyọ; a pa ìrísí yẹn mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìtumọ̀ aṣojú rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: λυπεῖται
  choice: ń banújẹ́
  rationale: Ó sọ pé a mú kí ẹni náà ní ìbànújẹ́ tàbí ìdààmú, láìfi ìtumọ̀ tó kọjá ọ̀rọ̀ náà kún un.
- source_word: κατὰ ἀγάπην
  choice: ní ìbámu pẹ̀lú ìfẹ́
  rationale: Ó ṣe àfihàn ìfẹ́ gẹ́gẹ́ bí ìlànà tí ìwà ẹni gbọ́dọ̀ tẹ̀ lé.
- source_word: περιπατεῖς
  choice: rìn
  rationale: A pa àkàwé Pọ́ọ̀lù nípa “rírìn” gẹ́gẹ́ bí ìgbé ayé àti ìwà mọ́.
- source_word: ἀπόλλυε
  choice: Má ṣe ... pa ... run
  rationale: “Pa run” pa agbára ìkìlọ̀ Gíríìkì mọ́ láìdáhùn ìjiyàn bóyá ó túmọ̀ sí ìpalára tẹ̀mí ńlá tàbí ìparun ìkẹyìn.
- source_word: ὑπὲρ οὗ
  choice: ẹni tí ... kú fún
  rationale: “Kú fún” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe ní ipò tàbí nítorí ẹlòmíràn.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè; “Mèsáyà” mú ìtumọ̀ oyè náà hàn.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá ti ọ̀rọ̀ ìṣe náà.
- source_word: ἐκεῖνον
  choice: ẹni náà
  rationale: Ó pa ìtẹnumọ́ sí ẹni kan pàtó mọ́ ju ọ̀rọ̀ arọ́pò-orúkọ lásán lọ.
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” so ẹsẹ náà mọ́ àríyànjiyàn tó ṣáájú, “bí” sì pa ìṣètò onígbọ̀wọ̀ mọ́.
theological_decisions:
- issue: Agbára ἀπόλλυε nípa onígbàgbọ́ aláìlera
  choice: “Má ṣe ... pa ... run” gẹ́gẹ́ bí ìkìlọ̀ tó lágbára, láìsọ irú ìparun náà pàtó.
  alternative: “Má ṣe ba a jẹ́” tàbí “Má ṣe fa ìparun rẹ̀.”
  rationale: Ẹsẹ náà kò fi dandan pinnu bóyá Pọ́ọ̀lù ń tọ́ka sí ìpalára tẹ̀mí ní ayé yìí tàbí ìparun ìkẹyìn; ìtumọ̀ náà pa ìfòyemọ̀ ẹ̀kọ́ yìí mọ́.
- issue: Ẹni tí ἀδελφός ń tọ́ka sí
  choice: A lo “arákùnrin” nínú ọ̀rọ̀ pàtàkì.
  alternative: “arákùnrin tàbí arábìnrin” tàbí “onígbàgbọ́ ẹlẹgbẹ́ rẹ.”
  rationale: Gíríìkì jẹ́ akọ ní ẹyọ, ṣùgbọ́n ó lè dúró fún ọmọ ìjọ èyíkéyìí; àlàyé ìsàlẹ̀ ni ó pa ìtumọ̀ gbooro náà mọ́.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ bí orúkọ oyè níbí; “Mèsáyà” mú ìtumọ̀ oyè náà hàn kedere.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì bójú mu fún òǹkàwé òde òní. A pa àkàwé “rìn,” agbára ìkìlọ̀ “pa run,” àti àìdájú ẹ̀kọ́ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
