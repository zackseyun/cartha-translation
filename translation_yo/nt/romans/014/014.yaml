    issue: Àlàyé-ẹsẹ̀ [a] lo “gbogbogbò” gẹ́gẹ́ bí yíyàn mìíràn fún κοινόν.
    rationale: “Gbogbogbò” sábà ń túmọ̀ sí “general” tàbí “overall,” kò sì jẹ́ ìtumọ̀ tó pé fún “common.” “Wọ́pọ̀” ni ó sún mọ́ “common” jù, bí ó tilẹ̀ jẹ́ pé àyíká náà nílò ìtúmọ̀ “aláìmọ́” fún ìwẹ̀mọ́ ìsìn.
