  to: Mo mọ̀, ó sì dá mi lójú nínú Olúwa Jésù pé kò sí ohun kan tí ó jẹ́ aláìmọ́ nínú ara rẹ̀; ṣùgbọ́n bí ẹnì kan bá ka ohun kan sí aláìmọ́[a], ó jẹ́ aláìmọ́ fún ẹni náà.
  rationale: A kò yí ìtumọ̀ ẹsẹ̀ náà padà. A ṣàtúnṣe àlàyé-ẹsẹ̀ [a] nìkan, láti rọ́pò “gbogbogbò,” tí kò pé ní ìtumọ̀, pẹ̀lú “wọ́pọ̀,” kí yíyàn lexical “common” lè hàn ní tòótọ́. Àlàyé nípa ìwẹ̀mọ́ ìsìn ṣì dáàbò bo ìtumọ̀ àyíká κοινός.
