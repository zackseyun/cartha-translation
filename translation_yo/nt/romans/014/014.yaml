id: ROM.14.14
reference: Romans 14:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: yo
  text: Mo mọ̀, ó sì dá mi lójú nínú Olúwa Jésù pé kò sí ohun kan tí ó jẹ́ aláìmọ́ nínú ara rẹ̀; ṣùgbọ́n bí ẹnì kan bá ka ohun kan sí aláìmọ́[a], ó jẹ́ aláìmọ́ fún ẹni náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́pọ̀.” Ọ̀rọ̀ Gíríìkì náà níbí sábà ń tọ́ka sí ohun tí a kà sí ẹlẹ́gbin tàbí aláìmọ́ ní ti ìlànà ẹ̀sìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Mo mọ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ọ̀rọ̀ ìmọ̀ gidi mu.
- source_word: πέπεισμαι
  choice: ó sì dá mi lójú
  rationale: Perfect náà fi ìdánilójú tí ó ti fìdí múlẹ̀ hàn; gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: nínú Olúwa Jésù
  rationale: Ó pa ἐν mọ́ láì pinnu pé ó túmọ̀ sí ‘láti ọwọ́’ tàbí ‘nípasẹ̀,’ nítorí náà ó ṣì gba ìbáṣepọ̀ náà láàyè láì túmọ̀ rẹ̀ ju bó ṣe yẹ lọ.
- source_word: κοινόν
  choice: aláìmọ́
  rationale: Ní àyíká ọ̀rọ̀ nípa oúnjẹ àti ìwẹ̀mọ́, ọ̀rọ̀ náà ń tọ́ka sí ohun tí a kà sí ẹlẹ́gbin tàbí aláìmọ́ ní ti ìlànà ẹ̀sìn, kì í ṣe ohun ‘gbogbogbò’ lásán.
- source_word: δι’ ἑαυτοῦ
  choice: nínú ara rẹ̀
  rationale: Èyí fi hàn pé a ń sọ nípa bí ohun náà ṣe rí ní ìpilẹ̀ṣẹ̀ tàbí ní ti ara rẹ̀, kì í ṣe nítorí ohun míì.
- source_word: τῷ λογιζομένῳ
  choice: bí ẹnì kan bá ka ... sí
  rationale: ‘Ka ... sí’ jẹ́ ọ̀nà Yorùbá àdánidá fún gbígbà tàbí rí ohun kan gẹ́gẹ́ bí ohun tí ó ní irú ipò kan.
- source_word: τι
  choice: ohun kan
  rationale: Ó bá àpẹẹrẹ gbogbogbò tí Gíríìkì ń sọ mu, ó sì dun bí Yorùbá àdánidá.
- source_word: ἐκείνῳ κοινόν
  choice: ó jẹ́ aláìmọ́ fún ẹni náà
  rationale: ‘Fún ẹni náà’ pa agbára dative tó ń fi ìwúlò sí ẹni kọ̀ọ̀kan hàn, láì fi ọkùnrin nìkan sí i.
theological_decisions:
- issue: Ìtumọ̀ κοινός ní ìbáṣepọ̀ pẹ̀lú oúnjẹ àti ìwẹ̀mọ́
  choice: A túmọ̀ rẹ̀ sí ‘aláìmọ́,’ ṣùgbọ́n a sọ pé kò rí bẹ́ẹ̀ ‘nínú ara rẹ̀.’
  alternative: gbogbogbò; ẹlẹ́gbin
  rationale: Pọ́ọ̀lù kọ̀ pé ohun kan ní àìmọ́ gẹ́gẹ́ bí ohun tó wà nínú ìwà rẹ̀ gan-an, ṣùgbọ́n ó jẹ́wọ́ pé fún ẹni tí ẹ̀rí-ọkàn rẹ̀ kà á sí aláìmọ́, ó jẹ́ aláìmọ́ fún un. Ìtumọ̀ yìí pa ìforígbárí ẹ̀kọ́ náà mọ́ láì yanjú rẹ̀ ní ìkọ̀kọ̀.
- issue: Ìbáṣepọ̀ tí ἐν fi hàn nínú ‘ἐν κυρίῳ Ἰησοῦ’
  choice: nínú Olúwa Jésù
  alternative: nípasẹ̀ Olúwa Jésù; láti ọwọ́ Olúwa Jésù
  rationale: A pa àìdánilójú ìbáṣepọ̀ náà mọ́, dípò kí a sọ dájú pé Jésù ni orísun ìfihàn náà tàbí pé ọ̀rọ̀ náà túmọ̀ sí ìṣọ̀kan pẹ̀lú rẹ̀ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá ìlò àdánidá mu. Ọ̀rọ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ó dá mi lójú’ fún ìdánilójú tí ó fìdí múlẹ̀, àti ‘ka ... sí’ fún ìṣe ẹ̀rí-ọkàn ẹni kọ̀ọ̀kan.
