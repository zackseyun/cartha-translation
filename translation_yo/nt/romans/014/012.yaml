  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: yo
  text: Nítorí náà[a], olúkúlùkù wa yóò jìyìn nípa ara rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí ìyẹn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Nítorí náà
  rationale: Ó fi ìparí tí a fà jáde láti inú ọ̀rọ̀ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa agbára ìtumọ̀ náà mọ́.
- source_word: ἕκαστος ἡμῶν
  choice: olúkúlùkù wa
  rationale: Ó ṣe àfihàn agbára ìpínkiri ἕκαστος àti ìtumọ̀ ἡμῶν pé ẹni kọ̀ọ̀kan lára wa.
- source_word: περὶ ἑαυτοῦ
  choice: nípa ara rẹ̀
  rationale: Nípasẹ̀ ọ̀rọ̀ ìṣáájú περί pẹ̀lú genitive, gbólóhùn náà túmọ̀ sí ‘nípa ara rẹ̀’; èyí pa ìtumọ̀ gangan mọ́ láì fi ipa yan ìtumọ̀ àdánidá ‘fún ara rẹ̀.’
- source_word: λόγον
  choice: jíhìn
  rationale: Nínú àṣà ọ̀rọ̀ λόγον δώσει, ìtumọ̀ rẹ̀ ni láti sọ ohun tí ẹni ṣe àti láti dáhùn fún un; ‘jíhìn’ ni ọ̀rọ̀ Yorùbá àdánidá tó mú èrò ìṣirò tàbí ìdájọ́ yìí jáde.
- source_word: δώσει
  choice: yóò jíhìn
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni; ‘yóò’ pa àkókò ọjọ́ iwájú mọ́, ‘jíhìn’ sì tú odindi àṣà ọ̀rọ̀ λόγον δώσει ní Yorùbá àdánidá.
theological_decisions:
- issue: Ọ̀rọ̀ arọ́pò afẹ̀yìntì ẹyọ kan nínú gbólóhùn tó kan gbogbo ènìyàn
  choice: nípa ara rẹ̀
  alternative: fún ara rẹ̀
  rationale: ‘Ara rẹ̀’ jẹ́ ẹyọ kan, ó sì tẹ̀ lé bí Gíríìkì ṣe sọ pé ẹni kọ̀ọ̀kan ní ìpínkiri. Yorùbá kò nílò láti fi akọ tàbí abo hàn nínú ọ̀rọ̀ arọ́pò yìí, nítorí náà kò sí ìyípadà sí ọ̀pọ̀ ènìyàn tàbí ìdínkù agbára gbólóhùn náà.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. ‘Jíhìn’ ni a lò gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún àṣà ọ̀rọ̀ Gíríìkì ‘fi ìròyìn/ìṣirò lélẹ̀,’ nígbà tí ‘nípa ara rẹ̀’ pa àfojúsùn περί mọ́. Àmì ohùn ni a fi sí gbogbo ibi tó yẹ.
