id: ROM.14.9
reference: Romans 14:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: yo
  text: Fún ìdí èyí ni Mèsáyà fi kú, ó sì tún wà láàyè[a], kí ó lè jọba lórí àwọn òkú àti àwọn alààyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ó sì wà láàyè,’ tàbí, ní ọ̀nà tó túbọ̀ ṣe kedere, ‘ó sì jí dìde sí ìyè.’ Ọ̀rọ̀ Gíríìkì sọ pé ‘ó kú, ó sì wà láàyè’; àyíká rẹ̀ fi hàn pé ìyè lẹ́yìn àjíǹde ni a ń sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: Nítorí ète yìí ni
  rationale: Ọ̀rọ̀ yìí fi ìdí àti ète ohun tí a ṣẹ̀ṣẹ̀ sọ múlẹ̀; ìhun ‘ni’ jẹ́ kí agbára ète náà hàn ní Yorùbá àdánidá.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A túmọ̀ oyè náà ní ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ẹni tí a fòróró yàn, dípò lílo ‘Kristi’ bí orúkọ lásán.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Ó jẹ́ ọ̀rọ̀ tààrà fún ikú, kò sì nílò àfikún.
- source_word: ἔζησεν
  choice: tún wà láàyè
  rationale: Ní ìsopọ̀ pẹ̀lú ‘kú,’ ọ̀rọ̀ náà ń tọ́ka sí ìyè lẹ́yìn ikú. ‘Tún wà láàyè’ sọ ìtumọ̀ àyíká náà ní Yorùbá tó ṣe kedere láìfi ọ̀rọ̀ ‘jí dìde’ kún ọ̀rọ̀ Gíríìkì fúnra rẹ̀.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète ohun tí ikú àti ìyè Mèsáyà ń mú ṣẹ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: νεκρῶν καὶ ζώντων
  choice: àwọn òkú àti àwọn alààyè
  rationale: Àwọn méjèèjì jẹ́ àpèjúwe tí a lò gẹ́gẹ́ bí orúkọ ènìyàn; ìtumọ̀ yìí pa ìyàtọ̀ tó wà láàárín wọn mọ́.
- source_word: κυριεύσῃ
  choice: jọba lórí
  rationale: Ó pa ìṣe ìṣàkóso àti àṣẹ olúwa mọ́ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe, láìyí i sí oyè orúkọ.
theological_decisions:
- issue: Ìtumọ̀ ἔζησεν lẹ́yìn ἀπέθανεν
  choice: ó sì tún wà láàyè
  alternative: ó sì wà láàyè; ó sì jí dìde sí ìyè
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní pàtó pé ‘ó kú, ó sì yè/wà láàyè’; àyíká rẹ̀ fi ìyè àjíǹde hàn. A pa ìtumọ̀ àyíká náà mọ́, ṣùgbọ́n a kò sọ ọ́ di ọ̀rọ̀-ìṣe ‘jí dìde’ nínú ẹsẹ̀ gan-an.
- issue: Agbára Kristẹni inú κυριεύσῃ
  choice: kí ó lè jọba lórí àwọn òkú àti àwọn alààyè
  alternative: kí ó lè jẹ́ Olúwa àwọn òkú àti àwọn alààyè
  rationale: ‘Jọba lórí’ túmọ̀ ọ̀rọ̀-ìṣe ìṣàkóso náà ní tààrà, ó sì pa ẹ̀tọ́ àṣẹ Mèsáyà lórí àwọn méjèèjì mọ́ láìfi oyè orúkọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè, ‘jọba lórí’ fún ìṣàkóso, àti àmì ohùn ní kíkún níbi tó bá yẹ.
