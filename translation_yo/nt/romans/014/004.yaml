revisions:
- from: Ìwọ ta ni láti máa dá ìránṣẹ́ ilé ẹlòmíràn lẹ́jọ́? Níwájú olúwa tirẹ̀ ni ó dúró tàbí ṣubú. Ṣùgbọ́n a ó mú un dúró,[a] nítorí Olúwa lágbára láti mú un dúró.
  to: Ìwọ ta ni tí o fi ń dá ìránṣẹ́ ilé ẹlòmíràn lẹ́jọ́? Níwájú olúwa tirẹ̀ ni ó dúró tàbí ṣubú. Ó sì máa jẹ́ kí ó dúró,[a] nítorí Olúwa lágbára láti mú un dúró.
  rationale: Àtúnṣe náà mú kí ìbéèrè ìbáwí náà jẹ́ Yorùbá adayeba láìfi ìtumọ̀ ìṣe àṣà kún un. A tún rọ́pò ìsopọ̀ ìyàtọ̀ líle pẹ̀lú ìsopọ̀ ìtẹ̀síwájú tó bá δέ mu, nígbà tí a pa ìtumọ̀ ìṣe aláìṣe-taara, àwòrán “dúró,” àti àìdánilójú nípa Olúwa/olúwa mọ́.
