id: ROM.14.4
reference: Romans 14:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: yo
  text: Ìwọ ta ni tí o fi ń dá ìránṣẹ́ ilé ẹlòmíràn lẹ́jọ́? Níwájú olúwa tirẹ̀ ni ó dúró tàbí ṣubú. Ó sì máa jẹ́ kí ó dúró,[a] nítorí Olúwa lágbára láti mú un dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ náà tún lè túmọ̀ sí, “Ó sì máa dúró.” Ọ̀rọ̀ Gíríìkì náà wà ní ìṣe aláìṣe-taara, ó sì lè tẹnumọ́ pé Olúwa ni yóò mú kí ó dúró. “Olúwa” ní ìparí náà ṣeé ṣe kí ó tọ́ka sí Olúwa ní ìtumọ̀ ẹ̀sìn; àwọn mìíràn sì lóye rẹ̀ gẹ́gẹ́ bí olúwa ìránṣẹ́ náà nínú àkàwé. Bákan náà, οἰκέτης lè túmọ̀ sí ìránṣẹ́ ilé tàbí ẹrú ilé.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Ìwọ ta ni láti máa dá ... lẹ́jọ́?
  rationale: Ó pa ìtẹnumọ́ σὺ àti ìbéèrè ìbáwí náà mọ́, ní ọ̀nà tí ó bá Yorùbá àdánidá mu.
- source_word: ἀλλότριον οἰκέτην
  choice: ìránṣẹ́ ilé ẹlòmíràn
  rationale: “Ìránṣẹ́ ilé” fi hàn pé οἰκέτης jẹ́ ẹni tó ń ṣiṣẹ́ nínú agbo ilé; àlàyé ìsàlẹ̀ ṣàfihàn pé ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí ẹrú ilé.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: níwájú olúwa tirẹ̀
  rationale: Ó mú ìtumọ̀ jíjíhìn àti ìdájọ́ níwájú ọ̀gá ẹni jáde, ó sì pa àsopọ̀ pẹ̀lú κύριος tó tún fara hàn ní ìparí mọ́.
- source_word: στήκει ἢ πίπτει
  choice: ó dúró tàbí ṣubú
  rationale: Ó pa àwòrán ìdúró àti ìṣubú, àti ìyàtọ̀ tó wà láàárín àwọn ọ̀rọ̀-ìṣe méjèèjì, mọ́.
- source_word: σταθήσεται
  choice: a ó mú un dúró
  rationale: Ìṣe aláìṣe taara ọjọ́ iwájú náà tọ́ka sí pé agbára mìíràn ni yóò mú kí ó dúró; gbolohun tó tẹ̀ lé sọ ẹni tó ń ṣe é di mímọ̀.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: nítorí Olúwa lágbára láti mú un dúró
  rationale: Ó pa ìdí tí γάρ fi ń fúnni, agbára inú δυνατεῖ, àti àtúnṣe ọ̀rọ̀ “dúró” mọ́.
theological_decisions:
- issue: Ẹni tí ὁ κύριος inú gbólóhùn ìkẹyìn ń tọ́ka sí
  choice: “Olúwa” gẹ́gẹ́ bí orúkọ oyè ẹ̀sìn fún Olúwa
  alternative: “olúwa rẹ̀” tàbí ọ̀gá ẹrú náà nínú àkàwé
  rationale: Ìlérí pé a ó mú ẹni náà dúró dá lórí agbára Olúwa, èyí tó mú kí ìtọ́kasí ẹ̀sìn ṣeé ṣe jù; síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí àìdánilójú inú àkàwé náà hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “olúwa” ní lẹ́tà kékeré fún ọ̀gá inú àkàwé, àti “Olúwa” fún ìtọ́kasí ẹ̀sìn, láìfi àìdánilójú orísun pamọ́.
