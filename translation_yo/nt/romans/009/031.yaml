  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: yo
  text: Ṣùgbọ́n Israẹli, tí ń lépa òfin òdodo[a], kò dé òfin náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òfin ìdájọ́ òdodo.” Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ púpọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kò dé ibẹ̀,” tàbí “kò dé òfin.” Gbólóhùn Gíríìkì náà kúkúrú, ó sì ṣòro láti túmọ̀ ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραὴλ
  choice: Israẹli
  rationale: Ọ̀nà tí a sábà ń gbà kọ orúkọ náà ní Yorùbá; níbí ó ń tọ́ka sí Israẹli gẹ́gẹ́ bí orílẹ̀-èdè àti ẹ̀yà nínú àríyànjiyàn Paulu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi Israẹli ṣe ìyàtọ̀ sí àwọn Kèfèrí tí ẹsẹ tó ṣáájú sọ̀rọ̀ nípa wọn.
- source_word: διώκων
  choice: tí ń lépa
  rationale: Ó pa ìtumọ̀ ìsapá alágbára láti tọ ohun kan lẹ́yìn mọ́, láìfi ìtumọ̀ ìyọ̀ǹda tí kò hàn gbangba sínú ọ̀rọ̀ náà.
- source_word: νόμον δικαιοσύνης
  choice: òfin òdodo
  rationale: Ìsọ̀rọ̀ yìí jẹ́ àdàpọ̀ orúkọ méjì tó ṣeé túmọ̀ ní ọ̀pọ̀ ọ̀nà. ‘Òfin òdodo’ pa ìwúpọ̀ àti àìdánilójú rẹ̀ mọ́, kò sì ṣàlàyé rẹ̀ kọjá ohun tí Gíríìkì sọ.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún δικαιοσύνη ní àyíká ọ̀rọ̀ Paulu, ó sì lè gba ìtumọ̀ jíjẹ́ olódodo tàbí ìdájọ́ òdodo.
- source_word: εἰς νόμον
  choice: òfin náà
  rationale: Àtúnsọ νόμον lè tọ́ka padà sí òfin tí Israẹli ń lépa; fífi ‘náà’ kún un mú ìtọ́kasí náà ṣe kedere láìfi ‘ète òfin’ tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: οὐκ ἔφθασεν
  choice: kò dé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé wọn kò dé ibi tàbí ohun tí wọ́n ń lépa; ‘kò dé’ jẹ́ adayeba ní Yorùbá, ó sì pa àwòrán ìdé ibi-afẹ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àyíká ọ̀rọ̀ Paulu
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ lè sọ nípa ohun tó tọ́ àti ipò jíjẹ́ ẹni tí ó tọ́ níwájú Ọlọ́run, láìfi ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ náà. ‘Ìdájọ́ òdodo’ ṣeé ṣe ní ti ọ̀rọ̀, ṣùgbọ́n ó dín ìtumọ̀ náà sí apá ìdájọ́.
- issue: Ìbáṣepọ̀ νόμον àti δικαιοσύνης
  choice: òfin òdodo
  alternative: òfin tí ń yọrí sí òdodo
  rationale: Gíríìkì kò sọ ìbáṣepọ̀ náà ní kíkún. Àṣàyàn àkọ́kọ́ pa àìdánilójú náà mọ́; àṣàyàn kejì yóò pinnu pé òfin náà ń mú òdodo wá.
translation_notes:
  register: Yorùbá àpapọ̀, ọ̀wọ̀, àti èdè òde òní ni a lò. ‘Tí ń lépa’ àti ‘kò dé’ jẹ́ ọ̀rọ̀ adayeba fún òǹkàwé gbogbo, nígbà tí ‘òfin òdodo’ pa ìsọ̀rọ̀ Gíríìkì àti àìdánilójú rẹ̀ mọ́.
