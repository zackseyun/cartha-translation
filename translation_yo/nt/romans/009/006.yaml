id: ROM.9.6
reference: Romans 9:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: yo
  text: Ṣùgbọ́n kì í ṣe pé ọ̀rọ̀ Ọlọ́run ti kùnà. Nítorí kì í ṣe gbogbo àwọn tí ó ti inú Ísírẹ́lì wá[a] ni Ísírẹ́lì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó jẹ́ ìran Ísírẹ́lì.” Gbólóhùn Gíríìkì náà ń tọ́ka sí orísun tàbí ìran.
    reason: lexical_alternative
  - marker: b
    text: Nínú gbolóhùn yìí, ‘Ísírẹ́lì’ kejì ni a lò ní ìtumọ̀ tó dín ju ti àkọ́kọ́ lọ; Pọ́ọ̀lù ń fi àwọn tí wọ́n jẹ́ ìran Ísírẹ́lì yà sọ́tọ̀ kúrò nínú ‘Ísírẹ́lì’ ní ìtumọ̀ kejì náà.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Ṣùgbọ́n èyí kò túmọ̀ sí pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti kọ ìmọ̀ràn tí ẹnì kan lè fà jáde láti inú ọ̀rọ̀ tó ṣáájú, láì sọ gbólóhùn Gíríìkì di líle.
- source_word: ἐκπέπτωκεν
  choice: ti kùnà
  rationale: Ọ̀rọ̀ yìí fi hàn pé ohun kan kò ṣàṣeyọrí tàbí kò mú ohun tí a retí ṣẹ; ìṣe pípé náà tọ́ka sí ipò ìsinsìnyí tí ó jẹ́ àbájáde ohun tó ti ṣẹlẹ̀.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ìtumọ̀ yìí pa ìfẹ̀ ọrọ̀ λόγος mọ́, tí ó lè tọ́ka sí ọ̀rọ̀ tàbí ìlérí Ọlọ́run, láì fi ‘ìlérí’ sínú ẹsẹ̀ gẹ́gẹ́ bí ìtumọ̀ tó ti dín kù.
- source_word: οὐ γὰρ πάντες
  choice: Nítorí kì í ṣe gbogbo
  rationale: ‘Nítorí’ fi iṣẹ́ àlàyé γάρ hàn, ‘kì í ṣe gbogbo’ sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pa àtakò náà mọ́.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: àwọn tí ó ti inú Ísírẹ́lì wá
  rationale: Ọ̀rọ̀ ἐξ ń tọ́ka sí orísun tàbí ìran; gbólóhùn Yorùbá yìí pa méjèèjì sílẹ̀, láì pinnu ìtumọ̀ náà jù.
- source_word: οὗτοι Ἰσραήλ
  choice: ni Ísírẹ́lì
  rationale: ‘Ni’ jẹ́ àsopọ̀ ìdánimọ̀ Yorùbá tó bá gbólóhùn Gíríìkì kékeré náà mu, ó sì pa ìyàtọ̀ líle tó wà láàárín Ísírẹ́lì méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìṣẹ̀lẹ̀ kejì ti ‘Ísírẹ́lì’
  choice: A fi ‘Ísírẹ́lì’ sílẹ̀ nínú ẹsẹ̀ láì ṣàlàyé rẹ̀ sí ‘àwọn àyànfẹ́’ tàbí ‘àwọn ènìyàn Ọlọ́run,’ ṣùgbọ́n àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ májẹ̀mú tó dín ju ìran ara lọ.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ‘àwọn àyànfẹ́ láàárín Ísírẹ́lì’ tàbí sí ‘àwọn ènìyàn Ọlọ́run tòótọ́.’
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù ń fi ìran ti ara àti ìtumọ̀ Ísírẹ́lì nínú ète ìgbàlà Ọlọ́run yà sọ́tọ̀, ṣùgbọ́n ẹsẹ̀ yìí nìkan kò yanju gbogbo ìwọ̀n ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà; nítorí náà a pa ìfúnpọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò; a yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
