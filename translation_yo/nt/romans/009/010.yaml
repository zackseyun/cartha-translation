  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: yo
  text: Kì í ṣe èyí nìkan, ṣùgbọ́n Rẹ́bẹ́kà náà ní oyún láti ọ̀dọ̀ ọkùnrin kan ṣoṣo[a]—Ísáákì, baba wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ọ̀rọ̀ Gíríìkì náà ní ‘níní κοίτη láti ọ̀dọ̀ ẹni kan.’ Κοίτη lè tọ́ka sí ìbùsùn tàbí ìbálòpọ̀, ṣùgbọ́n nínú àyíká yìí ó ń tọ́ka sí oyún láti ọ̀dọ̀ ọkùnrin kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: Kì í sì í ṣe ìyẹn nìkan, ṣùgbọ́n … náà
  rationale: Ó mú ọ̀nà tí Pọ́ọ̀lù gbà ń fi àpẹẹrẹ mìíràn kún àríyànjiyàn rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: Ῥεβέκκα
  choice: Rẹ́bẹ́kà
  rationale: Àkọtọ̀ orúkọ náà ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: ἐξ ἑνός
  choice: nípasẹ̀ ọkùnrin kan ṣoṣo
  rationale: Ọ̀rọ̀ náà tọ́ka sí baba kan ṣoṣo; fífi ‘ọkùnrin’ hàn mú ìtumọ̀ tí Gíríìkì fi ṣe àfojúsùn yé kedere láìfi èrò ẹ̀kọ́ mìíràn kún un.
- source_word: κοίτην ἔχουσα
  choice: lóyún
  rationale: Àkànlò-èdè Gíríìkì náà ní í ṣe pẹ̀lú ìbálòpọ̀ tí ó yọrí sí oyún; ‘lóyún’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: ìyẹn Ísáákì baba wa
  rationale: ‘Ìyẹn’ ṣàlàyé ẹni tí ‘ọkùnrin kan ṣoṣo’ ń tọ́ka sí, ‘baba wa’ sì pa ìtumọ̀ ìran baba ńlá mọ́ ní ọ̀nà tó ṣe déédé.
theological_decisions:
- issue: Bí a ṣe máa tú àkànlò-èdè nípa ìbálòpọ̀ àti oyún nínú àríyànjiyàn Pọ́ọ̀lù
  choice: Rẹ́bẹ́kà lóyún nípasẹ̀ ọkùnrin kan ṣoṣo
  alternative: Rẹ́bẹ́kà ní ibùsùn láti ọ̀dọ̀ ẹni kan
  rationale: Ìtumọ̀ yìí sọ kókó àríyànjiyàn náà di mímọ̀—àwọn ọmọ inú rẹ̀ ní baba kan náà—láìsọ àkànlò-èdè náà di ọ̀rọ̀ líle tàbí láìfi ẹ̀kọ́ ìsìn kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
