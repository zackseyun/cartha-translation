  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: yo
  text: Ǹjẹ́, kí ni àwa yóò wí? Àìṣòdodo[a] ha wà lọ́dọ̀ Ọlọ́run? Kí ó má ṣe rí rárá![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà àìtọ́.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: “Kí ó má ṣẹlẹ̀!” Ọ̀rọ̀ ìkọ̀sílẹ̀ alágbára ni, tí ó fi ìfẹ́kúfẹ̀ẹ́ pé kí ohun náà má ṣẹlẹ̀ hàn; a tún lè túmọ̀ rẹ̀ sí, “Rárá o!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Ǹjẹ́, kí ni àwa yóò wí?
  rationale: Ó pa ìlànà ìbéèrè tí Paulu máa ń lò láti mú àbájáde tàbí àtakò kan wọlé mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: μὴ
  choice: ha ...?
  rationale: Nínú ìbéèrè yìí, μὴ ń retí ìdáhùn òdì. Ẹ̀ka ọ̀rọ̀ ‘ha’ mú kí ó jẹ́ ìbéèrè àtakò láìfi ìdáhùn kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀδικία
  choice: Àìṣòdodo
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ ìwà tí kò tọ́ àti àìdájọ́ òdodo; ‘àìṣòdodo’ pa ìtumọ̀ ìwà rere àti ti ìdájọ́ méjèèjì mọ́.
- source_word: παρὰ τῷ θεῷ
  choice: wà lọ́dọ̀ Ọlọ́run
  rationale: ‘Lọ́dọ̀ Ọlọ́run’ jẹ́ ọ̀nà Yorùbá tó bójú mu láti sọ pé irú ìwà bẹ́ẹ̀ wà níhà Ọlọ́run tàbí nínú ìṣe rẹ̀, láìsọ ọ́ di ‘Ọlọ́run jẹ́ aláìṣòdodo.’
- source_word: μὴ γένοιτο
  choice: Rárá, láéláé!
  rationale: Ó jẹ́ ìkọ̀sílẹ̀ tó lágbára, tó sì jẹ́ ti Yorùbá òde òní; àlàyé ìsàlẹ̀ fi ìrísí ọ̀rọ̀ Gíríìkì hàn.
theological_decisions:
- issue: Bóyá kí a tú ìbéèrè náà sí ‘Ọlọ́run ha jẹ́ aláìṣòdodo?’ tàbí kí a pa ọ̀rọ̀-orúkọ ἀδικία àti ìdíwọ̀n àtakò náà mọ́.
  choice: Àìṣòdodo ha wà lọ́dọ̀ Ọlọ́run?
  alternative: Ọlọ́run ha jẹ́ aláìṣòdodo?
  rationale: Yíyan ọ̀rọ̀-orúkọ ‘àìṣòdodo’ àti ‘lọ́dọ̀ Ọlọ́run’ sún mọ́ Gíríìkì, ó sì yẹra fún fífi àlàyé ẹ̀kọ́ nípa ìyàn, ìkọ̀sílẹ̀, tàbí bí Ọlọ́run ṣe ń ṣe ìdájọ́ kún ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá tó péye, tó lọ́lá, tí ó sì ṣeé lóye ni a lò. ‘Ha’ jẹ́ àmì ìbéèrè ọ̀wọ̀ tí ó bá ìjíròrò Paulu mu; ‘Rárá, láéláé!’ mú agbára ìkọ̀sílẹ̀ náà jáde láìjẹ́ èdè àtijọ́ tó le.
