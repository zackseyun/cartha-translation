  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: yo
  text: Kí ni a ó wí nígbà náà? Pé àwọn aláì-Júù[a], tí wọn kò ń lépa òdodo[b], ti rí òdodo—ìyẹn ni òdodo tí ó wá láti inú ìgbàgbọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè.” Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì δικαιοσύνη lè ní ìtumọ̀ ìwà tàbí ipò títọ́, ó sì tún lè ní ìtumọ̀ ìdájọ́ òdodo.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “òdodo tí a rí nípa ìgbàgbọ́”; tàbí, èyí tí kò fi bẹ́ẹ̀ ṣeé ṣe níhìn-ín, “òdodo tí ó wá láti inú ìṣòtítọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Kí ni àwa yóò wí nígbà náà?
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ ìyípadà tí Pọ́ọ̀lù sábà máa ń lò mọ́, ó sì fi ìrísí ọ̀rọ̀ ọjọ́ iwájú ἐροῦμεν hàn ní Yorùbá àdánidá.
- source_word: ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú àríyànjiyàn yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe Júù ní ìyàtọ̀ sí Ísírẹ́lì; “Kèfèrí” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún ìtumọ̀ yìí, nígbà tí àlàyé ìsàlẹ̀ fi “àwọn orílẹ̀-èdè” pamọ́ gẹ́gẹ́ bí ìtumọ̀ tó túbọ̀ tẹ̀ lé ọ̀rọ̀ Gíríìkì.
- source_word: τὰ μὴ διώκοντα
  choice: tí wọn kò ń lépa
  rationale: Ìrísí participle ti àsìkò ìsinsìnyí fi ìṣe tí ń lọ tàbí ìwà àṣà hàn; “kò ń lépa” mú èyí jáde lọ́nà Yorùbá tó ṣe déédé.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: “Òdodo” ní ààyè ìtumọ̀ tó lè gba jíjẹ́ ẹni tó tọ́ níwájú Ọlọ́run, ìwà títọ́, àti ìdájọ́ òdodo láìfi ẹ̀kọ́ ìsìn kan pàtó kún un.
- source_word: κατέλαβεν
  choice: ti rí … gbà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí wíwá sí ohun-ìní tàbí ṣíṣe àṣeyọrí ohun tí wọn kò ń lépa; “rí … gbà” jẹ́ Yorùbá àdánidá tí kò fi àwòrán mímú ohun kan ní ọwọ́ lé e.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: ìyẹn sì ni òdodo tí ó wá láti inú ìgbàgbọ́
  rationale: Àtúnsọ orúkọ náà pẹ̀lú article àti gbólóhùn ἐκ πίστεως ń ṣàlàyé irú òdodo tí a ní lọ́kàn. “Ìyẹn sì ni” mú ipa δέ gẹ́gẹ́ bí ìtẹnumọ́/ìṣàlàyé jáde láìdá ìtakora tí kò ṣe kedere sílẹ̀.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” jẹ́ ìtumọ̀ àkọ́kọ́ tó bójú mu níbí, ó sì pa ìbáṣepọ̀ ἐκ (“láti inú”) mọ́ láìfikún gbólóhùn ẹ̀kọ́ ìsìn tí kò sí nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àríyànjiyàn Pọ́ọ̀lù
  choice: òdodo
  alternative: ìdájọ́ òdodo; ipò títọ́ níwájú Ọlọ́run
  rationale: Ẹsẹ̀ náà kò tú ọ̀nà iṣẹ́ òdodo yìí ká ní kíkún. “Òdodo” pa fífẹ̀ ìtumọ̀ Pọ́ọ̀lù mọ́, kò sì dín un kù sí èrò ẹ̀kọ́ ìsìn kan ṣoṣo.
- issue: Ìtumọ̀ ἐκ πίστεως
  choice: tí ó wá láti inú ìgbàgbọ́
  alternative: tí a rí nípa ìgbàgbọ́; tí ó wá láti inú ìṣòtítọ́
  rationale: Ìtumọ̀ yìí pa agbára preposition ἐκ mọ́, kò sì fikún “ìgbàgbọ́ nìkan” tàbí ọ̀rọ̀ míì tí Gíríìkì kò sọ. A fi “ìṣòtítọ́” sí àlàyé gẹ́gẹ́ bí àṣàyàn tó ṣeé ṣe ṣùgbọ́n tí kò lágbára tó níbí.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọn ti jẹ́ ti ẹ̀dá èdè; a yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tó dín δικαιοσύνη tàbí πίστις sí ìtumọ̀ ẹ̀gbẹ́ kan.
