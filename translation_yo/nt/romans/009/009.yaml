id: ROM.9.9
reference: Romans 9:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: yo
  text: Nítorí ọ̀rọ̀ ìlérí náà nìyí pé, “Ní àkókò yìí ni èmi yóò wá[a], Sárà yóò sì ní ọmọkùnrin kan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èmi yóò padà wá.” Gíríìkì níbí sọ pé, “èmi yóò wá,” ṣùgbọ́n àwọn ìtumọ̀ kan tẹ̀ lé ọ̀rọ̀ inú Jẹ́nẹ́sísì pé, “padà wá.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: ìlérí
  rationale: Gẹ́gẹ́ bí àpèjúwe fún λόγος, ó tọ́ka sí ọ̀rọ̀ tí ó ní ìlérí Ọlọ́run nínú; ‘ọ̀rọ̀ ìlérí’ jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: Níbí, ó ń tọ́ka sí gbólóhùn ìlérí tí a fa yọ; ‘ọ̀rọ̀’ pa ìtumọ̀ náà mọ́ láìṣe àlàyé sí i.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé Pọ́ọ̀lù tó ṣáájú, ó sì fi ìdí ọ̀rọ̀ náà hàn.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: Ní àkókò yìí
  rationale: Ó fi àkókò tí a pinnu fún ìmúṣẹ ìlérí hàn ní èdè Yorùbá adayébá, láìfi ‘tí a yàn’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐλεύσομαι
  choice: èmi yóò dé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwá tàbí dídé. ‘Yóò dé’ jẹ́ adayébá nínú ọ̀rọ̀ nípa àkókò ọjọ́ iwájú, ó sì pa ìtumọ̀ ‘I will come’ mọ́; àṣàyàn ‘padà wá’ láti inú àyíká Jẹ́nẹ́sísì wà nínú àlàyé ìsàlẹ̀.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sárà yóò sì bí ọmọkùnrin kan
  rationale: Ìkọ̀lé Gíríìkì náà túmọ̀ ní ti adayébá sí pé Sárà yóò ní ọmọkùnrin; nínú àyíká ìlérí ìbí yìí, ‘yóò bí’ sọ ìtumọ̀ náà ní Yorùbá tó ṣe kedere.
- source_word: Σάρρᾳ
  choice: Sárà
  rationale: A lo ìkọ̀wé orúkọ náà gẹ́gẹ́ bí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: υἱός
  choice: ọmọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní pàtó, èyí sì ṣe pàtàkì nínú ìlérí nípa ọmọ Ábúráhámù àti Sárà.
theological_decisions:
- issue: Ìlérí fún Ábúráhámù àti ipa Ọlọ́run nínú ìmúṣẹ rẹ̀
  choice: A gbé ọ̀rọ̀ náà kalẹ̀ gẹ́gẹ́ bí ìlérí Ọlọ́run ní tààrà, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
  alternative: Lílo ‘èmi yóò padà wá’ láti bá àwọn ìtumọ̀ kan ti àyíká Jẹ́nẹ́sísì mu.
  rationale: Àríyànjiyàn Pọ́ọ̀lù gbára lé ìlérí Ọlọ́run gẹ́gẹ́ bí ìpìlẹ̀ ìbí Ísáákì. Gíríìkì Róòmù sọ ‘èmi yóò wá/dé’; a pa èyí mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì tọ́ka sí àṣàyàn inú Jẹ́nẹ́sísì ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. ‘Ọ̀rọ̀ ìlérí’ pa ìsopọ̀ λόγος àti ἐπαγγελίας mọ́; ìtòlẹ́sẹẹsẹ gbólóhùn kejì jẹ́ adayébá fún òǹkàwé Yorùbá.
