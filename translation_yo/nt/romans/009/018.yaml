  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: yo
  text: Nítorí náà, ó ń ṣàánú fún ẹni tí ó bá fẹ́, ó sì ń ṣe ọkàn ẹni tí ó bá fẹ́ le.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ pé, “ó sì ń mú ẹni tí ó bá fẹ́ di alágídí.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ohùn olùṣe; kò túmọ̀ sí pé ó kàn gbà á láàyè láti ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Àwọn ọ̀rọ̀ méjèèjì fi hàn pé Pọ́ọ̀lù ń fa ìparí ọ̀rọ̀ jáde láti inú ohun tí ó ṣẹ̀ṣẹ̀ sọ; “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìtumọ̀ yìí mọ́.
- source_word: ὃν θέλει
  choice: ẹni tí ó bá fẹ́
  rationale: Èyí pa ìfẹ́ tàbí ìpinnu ẹni tí ọ̀rọ̀ náà ń tọ́ka sí mọ́, ó sì tún jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere. Àyíká ẹsẹ náà fi hàn pé Ọlọ́run ni arọ́pò-orúkọ “ó” ń tọ́ka sí.
- source_word: ἐλεεῖ
  choice: ó ń ṣàánú fún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi àánú tàbí ìyọ́nú hàn sí ẹnì kan. “Ṣàánú fún” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì sọ ìṣe náà ní kedere.
- source_word: ὃν δὲ θέλει
  choice: ẹni tí ó bá fẹ́
  rationale: “Ó sì” mú ìyàtọ̀ tí δέ dá sílẹ̀ hàn, nígbà tí àtúnṣe “ẹni tí ó bá fẹ́” pa ìbáradọ́gba àwọn gbólóhùn méjèèjì mọ́.
- source_word: σκληρύνει
  choice: ó ń sé ọkàn … le
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún líle ẹni sí ohun kan tàbí fún mímú ẹni di alágídí. Ó pa ìṣe olùṣe tí ọ̀rọ̀ Gíríìkì sọ ní tààrà mọ́, ó sì bá àwòrán ọkàn líle nínú ìtàn Fáráò mu.
theological_decisions:
- issue: Ìfẹ́ Ọlọ́run nínú θέλει
  choice: A pa gbólóhùn tààrà nípa ẹni tí Ọlọ́run fẹ́ mọ́.
  alternative: Kí a túmọ̀ rẹ̀ bí ẹni pé Ọlọ́run kàn gbà á láàyè tàbí pé ó fẹ́ràn ẹni náà.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìfẹ́ tàbí ìpinnu olùṣe ní tààrà. Ìtumọ̀ náà kò gbìyànjú láti yanjú àríyànjiyàn nípa àyànmọ́ àti ojúṣe ènìyàn.
- issue: Olùṣe ìṣe nínú σκληρύνει
  choice: A lò gbólóhùn olùṣe pé “ó ń sé ọkàn … le.”
  alternative: “Ó ń jẹ́ kí ọkàn rẹ̀ le” tàbí “ó gbà á láàyè láti sé ọkàn ara rẹ̀ le.”
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ti olùṣe, ó sì fi ìṣe náà lé ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ lọ́wọ́. Yíyí i padà sí gbígbà-láàyè nìkan yóò dín agbára ọ̀rọ̀ orísun kù.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. Gbólóhùn náà pa ìbáradọ́gba àwọn apá méjèèjì mọ́; “sé ọkàn … le” sì jẹ́ àkànlò Yorùbá tí ó ṣe kedere ju lílo “mú ẹni le” lọ.
