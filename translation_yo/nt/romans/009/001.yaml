id: ROM.9.1
reference: Romans 9:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: yo
  text: Òtítọ́ ni mo ń sọ nínú Mèsáyà[a]; èmi kò purọ́, ẹ̀rí-ọkàn mi sì ń bá mi jẹ́rìí nínú Ẹ̀mí Mímọ́[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè ṣiṣẹ́ bí oyè (“Mèsáyà”) tàbí bí orúkọ (“Kristi”); níhìn-ín a túmọ̀ rẹ̀ bí oyè.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ̀rí-ọkàn mi sì ń jẹ́rìí pẹ̀lú mi.”
    reason: lexical_alternative
  - marker: c
    text: Ó tún ṣeé ṣe kí a túmọ̀ rẹ̀ sí “nínú ẹ̀mí mímọ́ kan,” bí ó tilẹ̀ jẹ́ pé nínú àwọn lẹ́tà Páùlù, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Òtítọ́ ni mo ń sọ
  rationale: Ọ̀nà Yorùbá àdánidá tí ó tẹnu mọ́ ẹ̀rí òtítọ́ ni èyí, ó sì bá ìtumọ̀ àpólà Gíríìkì mu.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: A tú Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró, kì í ṣe bí orúkọ lásán; “nínú” tún pa ἐν mọ́ láì sọ ìbáṣepọ̀ náà di ohun tí ó hàn ju ti orísun lọ.
- source_word: οὐ ψεύδομαι
  choice: èmi kò purọ́
  rationale: Ìtumọ̀ tààrà, àdánidá, tí ó sì pa ìtẹnumọ́ arọ́pò-orúkọ mọ́.
- source_word: συμμαρτυρούσης
  choice: ń bá mi jẹ́rìí
  rationale: Ó pa agbára ìpele συμ- mọ́, nígbà tí ó ń sọ pé ẹ̀rí-ọkàn Pọ́ọ̀lù ń fìdí ọ̀rọ̀ rẹ̀ múlẹ̀ pẹ̀lú rẹ̀.
- source_word: τῆς συνειδήσεώς μου
  choice: ẹ̀rí-ọkàn mi
  rationale: “Ẹ̀rí-ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún agbára inú tí ń dáni lẹ́jọ́ tàbí tí ń jẹ́rìí sí ìwà ẹni.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: nínú Ẹ̀mí Mímọ́
  rationale: Ó pa ọ̀rọ̀-àṣáájú ἐν mọ́, ó sì fi ìtumọ̀ Páùlù tí ó ṣeé ṣe jù hàn pé Ẹ̀mí Ọlọ́run ni a ń tọ́ka sí.
theological_decisions:
- issue: Ohun tí πνεύματι ἁγίῳ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́, ìyẹn Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí mímọ́ kan, tàbí ẹ̀mí Pọ́ọ̀lù tí a yà sí mímọ́
  rationale: Nínú lílo ọ̀rọ̀ Páùlù, “Ẹ̀mí Mímọ́” ni ìtumọ̀ tí ó ṣeé ṣe jù; síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé Gíríìkì kò ní atókùn pàtó.
- issue: Agbára ἐν nínú ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nípasẹ̀ Mèsáyà tàbí ní ìṣọ̀kan pẹ̀lú Mèsáyà
  rationale: “Nínú” pa àìmọ̀ pàtó ti ìbáṣepọ̀ tí ἐν ń sọ mọ́, dípò yíyan ìtumọ̀ irinṣẹ́ tàbí ìṣọ̀kan nìkan.
translation_notes:
  register: Yorùbá boṣewa onígbàlódé, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní ọlá, ó ṣe kedere fún òǹkàwé lásán, ó sì pa ìtẹnumọ́ àti ìṣòro ìtumọ̀ Gíríìkì mọ́.
