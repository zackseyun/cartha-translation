  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìbẹ̀rẹ̀ àkọ́kọ́, “Bẹ́ẹ̀ sì ni,” kò ṣe aṣojú ìsopọ̀ ìkọ̀sí οὐδὲ dáadáa; “Kì í sì í ṣe pé” ń so ọ́ mọ́ ohun tí ó ṣáájú ní ìkọ̀sí. Bákan náà, σοι nínú àyọkà náà dára kí a fi hàn bí “fún ọ,” kì í ṣe “rẹ” nìkan.
  naturalness: “Kì í sì í ṣe pé ... ni gbogbo wọn fi jẹ́ ọmọ” jẹ́ Yorùbá àgbàṣe, ó sì mú ìbáṣepọ̀ “kì í ṣe nítorí ... ni gbogbo wọn fi ...” hàn kedere. “A ó pè irú-ọmọ fún ọ” jẹ́ ọ̀nà Yorùbá tó dára jù “a ó ti pe irú-ọmọ rẹ” lọ fún ìtọ́ka ìpè/ìdásílẹ̀ ìran inú àyọkà náà.
  terminology: “Irú-ọmọ” jẹ́ àṣàyàn tó yẹ fún σπέρμα ní ibi méjèèjì, ó sì pa ìṣọ̀kan ọ̀rọ̀ mọ́. “Àwọn ọmọ”/“ọmọ” níbí ń fi τέκνα hàn láìfi akọ tàbí abo sínú rẹ̀. A kò fi ìtumọ̀ ìjọsìn kan lé ìyàtọ̀ Pọ́ọ̀lù láàárín ìran ara àti ọmọ ìlérí lórí.
