id: ROM.9.7
reference: Romans 9:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: yo
  text: Kì í sì í ṣe pé nítorí pé wọ́n jẹ́ irú-ọmọ Ábúráhámù[a] ni gbogbo wọn fi jẹ́ ọmọ. Kàkà bẹ́ẹ̀, “Nínú Ísáákì ni a ó pè irú-ọmọ fún ọ.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “irúgbìn Ábúráhámù.” Ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ ṣùgbọ́n ó ní ìtumọ̀ àpapọ̀, ó ń tọ́ka sí ọmọ tàbí àwọn àtọmọdọ́mọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí jẹ́ àyọkà láti inú Gẹnẹ́sísì 21:12. Ọ̀nà “Nínú Ísáákì” pa ọ̀rọ̀ Gíríìkì mọ́; nínú àyíká, ó tọ́ka sí ìlà Ísáákì.
    reason: cross_reference
  - marker: c
    text: “A ó pè” tún lè túmọ̀ sí “a ó dárúkọ” tàbí, nínú àyíká ọ̀rọ̀ yìí, “a ó kà sí” tàbí “a ó dá mọ̀ sí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Bẹ́ẹ̀ sì ni, kì í ṣe ... nítorí pé
  rationale: Ọ̀rọ̀ yìí so ẹsẹ náà mọ́ àríyànjiyàn tó ṣáájú, ó sì fi ìkọ̀sí míì kún un; gbólóhùn Yorùbá yìí mú ìbáṣepọ̀ ọgbọ́n náà ṣe kedere láìṣe àlàyé ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: σπέρμα Ἀβραάμ
  choice: irú-ọmọ Ábúráhámù
  rationale: “Irú-ọmọ” jẹ́ ọ̀rọ̀ àpapọ̀ tó lè tọ́ka sí ọmọ tàbí àwọn àtọmọdọ́mọ, ó sì pa àwòrán ‘irúgbìn’ inú σπέρμα mọ́ ní ọ̀nà tó bójú mu ní Yorùbá.
- source_word: πάντες τέκνα
  choice: gbogbo wọn ni ọmọ
  rationale: τέκνα túmọ̀ sí ‘àwọn ọmọ’ láìfi akọ tàbí abo hàn; fífi ‘ni’ sí i jẹ́ àdàkọ àdánidá fún gbólóhùn aláìlọ́̀rọ̀-ìṣe náà.
- source_word: ἀλλ’
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi ìyàtọ̀ líle àti àtúnṣe ọ̀rọ̀ Pọ́ọ̀lù hàn lọ́nà Yorùbá tó ṣe déédéé.
- source_word: Ἐν Ἰσαὰκ
  choice: Nínú Ísáákì
  rationale: Èyí tẹ̀ lé ìtumọ̀ pàtó ἐν, ó sì pa ìṣísẹ̀ ọ̀rọ̀ inú Gẹnẹ́sisi mọ́; àlàyé pé ó ń tọ́ka sí ìlà ìran ni a fi sí àlàyé ìsàlẹ̀.
- source_word: κληθήσεταί
  choice: ni a ó ti pe
  rationale: Ọ̀rọ̀ náà jẹ́ ọjọ́ iwájú aláìlórúkọ olùṣe ti καλέω, ‘a ó pè’; ‘ni ... ti’ so ìpè náà mọ́ Ísáákì gẹ́gẹ́ bí ìlà tí a ó fi dá irú-ọmọ mọ̀, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- source_word: σοι σπέρμα
  choice: irú-ọmọ rẹ
  rationale: Ọ̀rọ̀ arọ́pò σοι jẹ́ ti ẹni kejì, “fún ọ/ti rẹ”; Yorùbá àdánidá ń fi í hàn gẹ́gẹ́ bí ohun ìní nínú ‘irú-ọmọ rẹ.’
theological_decisions:
- issue: Ìbáṣepọ̀ ìran ara sí jíjẹ́ ọmọ ìlérí
  choice: A sọ pé kì í ṣe gbogbo irú-ọmọ Ábúráhámù ni ‘ọmọ,’ láìṣàlàyé nínú ẹsẹ yìí bí Ọlọ́run ṣe ń yàn tàbí ṣe ń kà wọ́n sí ọmọ.
  alternative: Láti sọ ní tààrà pé àwọn kan nìkan ni Ọlọ́run ti pinnu tẹ́lẹ̀ gẹ́gẹ́ bí ọmọ májẹ̀mú.
  rationale: Ẹsẹ náà ń ṣe ìyàtọ̀ láàárín ìran ara àti ìlà tí ọ̀rọ̀ ìlérí tọ́ka sí, ṣùgbọ́n kò tíì ṣàlàyé gbogbo ìlànà yíyan; ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Agbára ọ̀rọ̀ inú Gẹnẹ́sisi
  choice: “Nínú Ísáákì ni a ó ti pe irú-ọmọ rẹ.”
  alternative: “Nípasẹ̀ Ísáákì ni a ó ti ka àwọn kan sí irú-ọmọ rẹ.”
  rationale: Àṣàyàn àkọ́kọ́ pa ọ̀rọ̀ ‘nínú’ àti ‘pè’ mọ́, nígbà tí àṣàyàn kejì ti túmọ̀ ìlò ọ̀rọ̀ náà sí ‘kà sí’ ju ohun tí ẹsẹ náà sọ ní tààrà lọ.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn kíkún, tó ní ọlá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “irú-ọmọ” fún σπέρμα ní ibi méjèèjì láti pa àsopọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́; a sì yàgò fún èdè ẹ̀sìn ẹgbẹ́ kan pàtó.
