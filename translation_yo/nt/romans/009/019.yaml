source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: yo
  text: Nígbà náà, ìwọ yóò wí fún mi pé, “Èé ṣe, nígbà náà, tí ó fi ṣì ń dá lẹ́bi? Nítorí ta ni ó ti tako ète rẹ̀[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìfẹ́-inú rẹ̀.” Ọ̀rọ̀ Gíríìkì βούλημα lè túmọ̀ sí ìfẹ́-inú, èrò inú, tàbí ète.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: Ìwọ yóò sì wí
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà ń mú àtakò tí Pọ́ọ̀lù ń retí wọlé; “wí” dúró mọ́ ìtumọ̀ λέγω ju “béèrè” lọ.
- source_word: μοι
  choice: fún mi
  rationale: Ó fi ẹni tí ọ̀rọ̀ náà ń tọ̀ sí hàn ní kedere gẹ́gẹ́ bí dátífù àìṣe tààrà.
- source_word: οὖν
  choice: nígbà náà
  rationale: Ó ń fi ìgbésẹ̀ ìrònú tó tẹ̀ lé e hàn. A fi í sí inú ìbéèrè láti pa ìtẹnumọ́ οὖν kejì mọ́, nígbà tí “sì” ń so àtakò náà mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: Τί οὖν ἔτι
  choice: Èé ṣe, nígbà náà, tí ó fi ṣì
  rationale: Nínú àyíká yìí, τί túmọ̀ sí ìbéèrè ìdí, “èé ṣe”; ἔτι sì ni “ṣì.”
- source_word: μέμφεται
  choice: ń dá ènìyàn lẹ́bi
  rationale: Ó túmọ̀ sí láti dá lẹ́bi tàbí rí àṣìṣe sí. Fífi “ènìyàn” kún un jẹ́ ọ̀nà Yorùbá àdánidá láti fi ohun tí a kò sọ ní Gíríìkì hàn láì sọ ẹni pàtó.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: ète rẹ̀
  rationale: “Ète” lè gbé ìtumọ̀ èrò tí a ti pinnu, ìfẹ́, tàbí ète kalẹ̀, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé ọ̀rọ̀ náà.
- source_word: τίς
  choice: ta ni
  rationale: Ó pa ìrísí ìbéèrè àsọyé náà mọ́.
- source_word: ἀνθέστηκεν
  choice: ó ti lè kọjú ìjà sí
  rationale: Ó fi ìtakò tàbí dídìde sí ohun kan hàn. “Ti lè” bá agbára àsọyé ìbéèrè Yorùbá mu, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì fúnra rẹ̀ jẹ́ pípé, kì í ṣe ọ̀rọ̀ agbára.
theological_decisions:
- issue: Ìtumọ̀ βούλημα ní àyíká ọba-aláṣẹ Ọlọ́run àti ojúṣe ènìyàn
  choice: ète rẹ̀
  alternative: ìfẹ́ rẹ̀
  rationale: “Ète” fi ìpinnu tàbí èrò tí a ti pinnu hàn, ṣùgbọ́n ó tún pa àyè sílẹ̀ fún ìtumọ̀ “ìfẹ́.” Èyí pa ìforígbárí inú ẹsẹ̀ náà mọ́ láì yanju rẹ̀ ní ìbámu pẹ̀lú ẹ̀kọ́ ìjọ kan.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìbéèrè àsọyé náà jẹ́ àdánidá fún olùkà lónìí, ó sì pa àtakò tó lágbára nínú ọ̀rọ̀ Gíríìkì mọ́.
