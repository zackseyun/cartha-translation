id: ROM.9.22
reference: Romans 9:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: yo
  text: Ṣùgbọ́n bí Ọlọ́run bá fẹ́ fi ìbínú rẹ̀ hàn, kí ó sì jẹ́ kí a mọ̀ agbára rẹ̀,[a] tí ó sì fi sùúrù púpọ̀ faradà àwọn ohun èlò ìbínú tí a ti pèsè sílẹ̀ fún ìparun,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘ohun tí ó lágbára fún un’ tàbí ‘ohun tí ó ṣeé ṣe fún un’; níhìn-ín ó ń tọ́ka sí agbára Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà sọ pé a ti pèsè àwọn ohun èlò náà sílẹ̀ fún ìparun, ṣùgbọ́n kò sọ ẹni tí ó pèsè wọn. Àwọn olùtumọ̀ yàtọ̀ lórí bóyá Ọlọ́run ló ṣe é, bóyá àwọn náà mú ara wọn dé ipò yẹn, tàbí bóyá ọ̀rọ̀ náà kàn ṣàpèjúwe ipò tí wọ́n wà.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí ... bá
  rationale: Ó pa ìpilẹ̀ gbólóhùn oníṣ شرط tí ó ń bá a lọ sínú ẹsẹ tó tẹ̀ lé mọ́, láì fi ìbéèrè tí kò sí ní Gíríìkì kún un.
- source_word: θέλων
  choice: fẹ́
  rationale: Ó sọ èrò tàbí ìfẹ́ Ọlọ́run ní ọ̀nà àdánidá, ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì dúró láì pinnu bóyá ó túmọ̀ sí ‘nítorí pé’ tàbí ‘bí ó tilẹ̀ jẹ́ pé.’
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: fi ìbínú rẹ̀ hàn
  rationale: Èyí fi ìtumọ̀ ìṣípayá ìbínú Ọlọ́run hàn ní Yorùbá tí ó ṣe kedere, láì sọ ọ́ di ìbínú ènìyàn lasan.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: sọ agbára rẹ̀ di mímọ̀
  rationale: ‘Agbára rẹ̀’ jẹ́ ìtumọ̀ àdánidá ti ohun tí ó lágbára tàbí ohun tí ó ṣeé ṣe fún un ní àyíká ọ̀rọ̀ yìí.
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: fi sùúrù púpọ̀ fara da
  rationale: Ó mú ìfaradà pẹ́ tó wà nínú μακροθυμία àti ìfaradà ohun tí ó nira nínú ἤνεγκεν jáde ní èdè Yorùbá òde òní.
- source_word: σκεύη ὀργῆς
  choice: àwọn ohun èlò ìbínú
  rationale: ‘Ohun èlò’ pa àwòrán ìkòkò tàbí ohun èlò mọ́, ó sì yẹra fún fífi ìtumọ̀ ẹni tàbí ohun tí genitive náà ń tọ́ka sí pinnu ju Gíríìkì lọ.
- source_word: κατηρτισμένα εἰς ἀπώλειαν
  choice: tí a ti pèsè sílẹ̀ fún ìparun
  rationale: Ìṣe aláìdárúkọ olùṣe náà dúró; Yorùbá ‘a ti’ kò sọ ẹni tí ó pèsè wọn, ó sì fi ipò ìmúrasílẹ̀ tí perfect participle náà tọ́ka sí hàn.
theological_decisions:
- issue: Ta ni ó ṣe ìmúrasílẹ̀ tí κατηρτισμένα ń tọ́ka sí?
  choice: A lo ‘tí a ti pèsè sílẹ̀’ láì dárúkọ olùṣe.
  alternative: Ọlọ́run ló pèsè wọn; wọ́n mú ara wọn yẹ fún ìparun; tàbí wọ́n wà ní ipò tí ó ti yẹ fún ìparun.
  rationale: Gíríìkì jẹ́ passive, kò sì dárúkọ olùṣe. Ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Agbára gbólóhùn oníṣ شرط tí εἰ δὲ bẹ̀rẹ̀
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘Ṣùgbọ́n bí ... bá’ tí kò tíì parí ní ẹsẹ yìí.
  alternative: ‘Ṣùgbọ́n kí ni bí ...’ tàbí yí i padà sí gbólóhùn ìjẹ́rìí tó pé.
  rationale: Ìṣètò ọ̀rọ̀ Pọ́ọ̀lù ń bá a lọ sínú ẹsẹ 23; pípa rẹ̀ mọ́ yẹra fún mímú ọ̀rọ̀ ẹsẹ 22 lágbára ju ti Gíríìkì lọ.
- issue: Ìbáṣepọ̀ θέλων pẹ̀lú ἤνεγκεν
  choice: A túmọ̀ rẹ̀ ní ṣókí sí ‘fẹ́’ láì fi ‘nítorí pé’ tàbí ‘bí ó tilẹ̀ jẹ́ pé’ kún un.
  alternative: Nítorí pé ó fẹ́; bí ó tilẹ̀ jẹ́ pé ó fẹ́.
  rationale: Participle náà lè gba ìtumọ̀ ọ̀nà púpọ̀ nínú àyíká yìí; Yorùbá náà pa ìfọ̀rọ̀wérọ̀ yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. ‘Àwọn ohun èlò’ pa àwòrán amọ̀kòkò inú àyíká ọ̀rọ̀ mọ́, ‘fara da’ sì jẹ́ ọ̀rọ̀ àdánidá fún ìfaradà pẹ̀lú sùúrù. Kọ́mà ìkẹyìn fi hàn pé gbólóhùn náà ń bá a lọ sínú ẹsẹ tó tẹ̀ lé.
