  to: Àbí amọ̀kòkò kò ní àṣẹ[a] lórí amọ̀ náà láti inú ìṣù amọ̀ kan náà[b] ṣe ohun èlò kan fún ọlá, àti òmíràn fún àìníyì[c]?[d]
  rationale: A rọ́pò ‘láti fi’ pẹ̀lú ‘láti inú’ láti pa ìtumọ̀ orísun ἐκ mọ́, a sì gbe àwọn àmì àlàyé ìsàlẹ̀ sí ibi tí ọ̀rọ̀ tí wọ́n ń ṣàlàyé wà. Kò sí ìyípadà sí ìtumọ̀ ẹ̀kọ́-ìgbàgbọ́ tàbí ìyàtọ̀ ọlá àti àìníyì tí Gíríìkì fi sílẹ̀.
