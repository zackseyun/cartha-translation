id: ROM.9.21
reference: Romans 9:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: yo
  text: Àbí amọ̀kòkò kò ní àṣẹ[a] lórí amọ̀ náà láti inú ìṣù amọ̀ kan náà[b] ṣe ohun èlò kan fún ọlá, àti òmíràn fún àìníyì[c]?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “amọ̀kòkò kò ní ẹ̀tọ́ lórí amọ̀ náà bí?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti inú àpòpọ̀ amọ̀ kan náà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ohun èlò kan fún iṣẹ́ ọlọ́lá, àti òmíràn fún iṣẹ́ lásán.”
    reason: alternative_reading
  - marker: d
    text: Àwòrán amọ̀kòkò àti amọ̀ yìí jọ àwọn ẹsẹ̀ inú Májẹ̀mú Láéláé, bí Aísáyà 29:16; 45:9; Jeremáyà 18:1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ń ṣe àgbékalẹ̀ ìbéèrè àsọ̀rọ̀ mìíràn nínú ìjiyàn Pọ́ọ̀lù; “Àbí” bá ìṣàn ọ̀rọ̀ Yorùbá mu láìfi ìtẹnumọ́ kún un.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: kò ní àṣẹ
  rationale: ἐξουσία túmọ̀ sí àṣẹ tàbí ẹ̀tọ́ tó yẹ, kì í ṣe agbára láti ṣe nǹkan lásán; “ní àṣẹ lórí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ὁ κεραμεὺς
  choice: amọ̀kòkò
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí oníṣẹ́ tó ń fi amọ̀ mọ ohun èlò, ó sì pa àwòrán amọ̀kòkò àti amọ̀ mọ́.
- source_word: τοῦ πηλοῦ
  choice: lórí amọ̀ náà
  rationale: Ẹ̀yà genitive náà tẹ̀ lé ἐξουσία; “àṣẹ lórí amọ̀” fi ìbáṣepọ̀ ìṣàkóso náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: fi ìṣù amọ̀ kan náà
  rationale: φύραμα jẹ́ ìṣù tàbí àkójọpọ̀ ohun tí a pò; “ìṣù amọ̀” ṣe àwòrán ohun tí amọ̀kòkò ń lò ní kedere.
- source_word: ποιῆσαι
  choice: ṣe
  rationale: Ó jẹ́ ọ̀rọ̀ tó rọrùn, tó sì bá ìtumọ̀ “láti ṣe/mọ” mu láìgbé ìtumọ̀ míì wọlé.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: ohun èlò kan ... àti òmíràn
  rationale: Ó pa ìyàtọ̀ tó wà láàárín àwọn ohun méjèèjì mọ́ ní Yorùbá àdánidá.
- source_word: εἰς τιμὴν
  choice: fún ọlá
  rationale: Ó pa èdè ọlá àti àìníyì inú Gíríìkì mọ́, láìdín ìtumọ̀ rẹ̀ kù sí irú iṣẹ́ ilé kan pàtó.
- source_word: σκεῦος
  choice: ohun èlò
  rationale: σκεῦος lè jẹ́ ìkòkò tàbí ohun èlò; “ohun èlò” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ó sì lè gbé ìtumọ̀ àpẹẹrẹ náà.
- source_word: εἰς ἀτιμίαν
  choice: fún àìníyì
  rationale: “Àìníyì” jẹ́ òdìkejì “ọlá” ní tààràtà, ó sì pa ìyàtọ̀ τιμή/ἀτιμία mọ́ láìtumọ̀ rẹ̀ sí iṣẹ́ lasán.
theological_decisions:
- issue: Bó yẹ kí ἐξουσία jẹ́ “àṣẹ” tàbí “ẹ̀tọ́” nínú ẹsẹ̀ tí a sábà máa ń lò nínú àríyànjiyàn nípa ìjọba Ọlọ́run àti ojúṣe ènìyàn
  choice: àṣẹ
  alternative: ẹ̀tọ́; agbára
  rationale: “Àṣẹ” fi ẹ̀tọ́ ìṣàkóso tó yẹ hàn láìyí ọ̀rọ̀ náà sí agbára lasán, bẹ́ẹ̀ ni kò pinnu àríyànjiyàn nípa ìpinnu Ọlọ́run àti òmìnira ènìyàn.
- issue: Bó yẹ kí εἰς τιμὴν / εἰς ἀτιμίαν túmọ̀ sí irú iṣẹ́ pàtó tàbí kí èdè ọlá-àìníyì dúró
  choice: fún ọlá ... fún àìníyì
  alternative: fún iṣẹ́ ọlọ́lá ... fún iṣẹ́ lásán
  rationale: Gíríìkì fúnra rẹ̀ lo èdè ọlá àti àìníyì. Ìtumọ̀ yìí kò fi dandan mọ ọ́ sí bí a ṣe ń lo ohun èlò inú ilé, ó sì pa àìdánilójú àpẹẹrẹ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Amọ̀kòkò” pa àwòrán iṣẹ́ amọ̀ mọ́; “ohun èlò” yàgò fún ọ̀rọ̀ àjèjì tàbí èdè àtijọ́ tí kò ṣe kedere.
