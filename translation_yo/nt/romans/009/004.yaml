id: ROM.9.4
reference: Romans 9:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: yo
  text: àwọn tí í ṣe ọmọ Ísírẹ́lì, tí ìgbàṣọmọ[c], ògo[b], àwọn májẹ̀mú, fífi Òfin fún wọn, ìjọsìn[d], àti àwọn ìlérí jẹ́ tiwọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘tí ìgbàṣọmọ, ògo, àwọn májẹ̀mú, fífi Òfin fún wọn, ìjọsìn, àti àwọn ìlérí jẹ́ tiwọn.’
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ‘ògo’ tọ́ka sí ìfarahàn Ọlọ́run láàárín Ísírẹ́lì.
    reason: cross_reference
  - marker: c
    text: Tàbí, ‘ipò ọmọ’ tàbí ‘gbígbà wọ́n gẹ́gẹ́ bí ọmọ.’
    reason: lexical_alternative
  - marker: d
    text: Ìyẹn ni, ìjọsìn tàbí iṣẹ́ ìsìn Ísírẹ́lì níwájú Ọlọ́run ní ìbámu pẹ̀lú májẹ̀mú.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: àwọn tí í ṣe ọmọ Ísírẹ́lì
  rationale: Gbólóhùn yìí ṣàlàyé àwọn ìbátan Pọ́ọ̀lù tí ẹsẹ tó ṣáájú mẹ́nu kàn. ‘Ọmọ Ísírẹ́lì’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí àwọn ọmọ orílẹ̀-èdè àti àwọn ènìyàn májẹ̀mú Ísírẹ́lì.
- source_word: ὧν
  choice: tí … jẹ́ tiwọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣàpèjúwe yìí fi jíjẹ́-nǹkan-ẹni hàn; ìṣètò ‘tí … jẹ́ tiwọn’ mú ìtumọ̀ náà jáde ní Yorùbá tó ṣe kedere.
- source_word: υἱοθεσία
  choice: ìgbàṣọmọ
  rationale: Ó pa àwòrán fífi ẹnì kan sí ipò ọmọ mọ́, níbí gẹ́gẹ́ bí ipò ọmọ tí Ọlọ́run fi fún Ísírẹ́lì nínú májẹ̀mú.
- source_word: δόξα
  choice: ògo
  rationale: Ó pa ọ̀rọ̀ Gíríìkì tí kò ṣàlàyé ẹni tí ògo náà jẹ́ mọ́, láìfi ìtumọ̀ pàtó kún un nínú ẹsẹ.
- source_word: διαθῆκαι
  choice: àwọn májẹ̀mú
  rationale: A pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́; ‘májẹ̀mú’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àdéhùn mímọ́ tí Ọlọ́run dá.
- source_word: νομοθεσία
  choice: fífi Òfin fúnni
  rationale: Ó tọ́ka sí ìṣe fífi tàbí gbígbé Òfin kalẹ̀, kì í ṣe Òfin nìkan.
- source_word: λατρεία
  choice: ìjọsìn
  rationale: Ó mú iṣẹ́ ìsìn tí Ísírẹ́lì ń ṣe níwájú Ọlọ́run jáde, láìdín in kù sí iṣẹ́ tẹ́ńpìlì tàbí iṣẹ́ àlùfáà nìkan.
- source_word: ἐπαγγελίαι
  choice: àwọn ìlérí
  rationale: A pa ọ̀pọ̀ nǹkan inú Gíríìkì mọ́, ó sì tọ́ka sí àwọn ìlérí tí Ọlọ́run fi fún Ísírẹ́lì.
theological_decisions:
- issue: Ìtumọ̀ υἱοθεσία nípa Ísírẹ́lì
  choice: ìgbàṣọmọ
  alternative: ipò ọmọ; gbígbà wọ́n gẹ́gẹ́ bí ọmọ
  rationale: Àkójọ yìí jẹ́ ti àwọn àǹfààní májẹ̀mú Ísírẹ́lì gẹ́gẹ́ bí ènìyàn kan. Ìtumọ̀ náà pa àwòrán ìgbàṣọmọ mọ́ láìfi ẹ̀kọ́ nípa ìgbàlà ẹnì kọ̀ọ̀kan tí ó lè wá láti ibòmíràn wọ̀ ọ́.
- issue: Ohun tí ἡ δόξα ń tọ́ka sí
  choice: ògo
  alternative: ògo Ọlọ́run; ìfarahàn ògo Ọlọ́run
  rationale: Ó ṣeé ṣe kó jẹ́ ìfarahàn Ọlọ́run láàárín Ísírẹ́lì, ṣùgbọ́n Gíríìkì sọ ‘ògo’ nìkan; ọ̀rọ̀ pàtàkì náà dúró nínú àyọkà, àlàyé sì wà ní àlàyé ìsàlẹ̀.
- issue: Ìwọ̀n ìtumọ̀ λατρεία
  choice: ìjọsìn
  alternative: iṣẹ́ ìsìn; iṣẹ́ tẹ́ńpìlì
  rationale: ‘Ìjọsìn’ gba ìtumọ̀ iṣẹ́ ìsìn májẹ̀mú Ísírẹ́lì sí Ọlọ́run, láìsọ pé tẹ́ńpìlì tàbí iṣẹ́ àlùfáà nìkan ni ọ̀rọ̀ náà túmọ̀ sí.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì lo ‘Òfin’ gẹ́gẹ́ bí orúkọ fún Òfin Mósè. Ìṣètò gbólóhùn náà tẹ̀ lé àkójọ Gíríìkì, ṣùgbọ́n ó jẹ́ ti Yorùbá àdánidá.
