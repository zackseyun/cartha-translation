id: ROM.9.20
reference: Romans 9:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: yo
  text: Ṣùgbọ́n, ìwọ ènìyàn, ta ni ọ́ tí ìwọ fi ń dá Ọlọ́run lóhùn padà? Ohun tí a mọ̀ kì yóò sọ fún ẹni tí ó mọ̀ ọ́ pé, “Èéṣe tí o fi ṣe mí báyìí?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní gígùn-gangan: “Èéṣe tí o fi ṣe mí ní báyìí?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Ṣùgbọ́n
  rationale: Ó mú ìtakò àti àtúnṣe inú ọ̀rọ̀ náà jáde ní Yorùbá àdánidá láì sọ ọ́ di ọ̀rọ̀ líle jù.
- source_word: ὦ ἄνθρωπε
  choice: ìwọ ènìyàn
  rationale: Ó pa ìpè tààrà sí ẹnì kọ̀ọ̀kan mọ́, nígbà tí ‘ènìyàn’ dúró fún ọmọ aráyé lápapọ̀ láì fi akọ tàbí abo kún un.
- source_word: σὺ τίς εἶ
  choice: ta ni ọ́
  rationale: Ìbéèrè yìí jẹ́ ìbáwí, kì í ṣe wíwádìí ẹni tí ẹni náà jẹ́; ọ̀nà yìí jẹ́ àdánidá, ó sì pa agbára ìpèníjà náà mọ́.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: tí ìwọ fi ń dá Ọlọ́run lóhùn padà
  rationale: ‘Dá ... lóhùn padà’ fi ìtumọ̀ ìtakò tàbí ìdáhùn àfojúdi hàn, kì í ṣe ìdáhùn lásán.
- source_word: μὴ ἐρεῖ
  choice: kì yóò sọ
  rationale: μή pẹ̀lú ọ̀rọ̀-ìṣe ọjọ́ iwájú ń retí ìdáhùn òdì; fífi ‘kì yóò’ hàn gbangba jẹ́ àdánidá ní Yorùbá, ó sì pa agbára ìbéèrè àsọyé náà mọ́.
- source_word: τὸ πλάσμα
  choice: Ohun tí a mọ
  rationale: Ó tọ́ka sí ohun tí a mọ tàbí tí a dá ní ìrísí kan, ó sì bá ọ̀rọ̀-ìṣe πλάσσω mu.
- source_word: τῷ πλάσαντι
  choice: ẹni tí ó mọ ọ́
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ mọ́ láàárín ohun tí a mọ àti ẹni tí ó mọ ọn.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Èéṣe tí o fi ṣe mí báyìí?
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ gangan ‘Kí ló dé tí o fi ṣe mí ní báyìí?’ mọ́.
theological_decisions:
- issue: Agbára aṣojú ti ἄνθρωπε
  choice: ‘ènìyàn’ gẹ́gẹ́ bí ẹnì kọ̀ọ̀kan tí ó dúró fún ọmọ aráyé
  alternative: ‘ọkùnrin’
  rationale: Nínú àyíká yìí, ἄνθρωπος ń tọ́ka sí ènìyàn níwájú Ọlọ́run, kì í ṣe sí akọ nìkan; ‘ènìyàn’ pa agbára aṣojú náà mọ́ dáadáa ní Yorùbá.
- issue: Ìbáwí líle àti ìyàtọ̀ láàárín Ẹlẹ́dàá àti ohun tí a dá
  choice: Pa ìpèníjà ‘ta ni ọ́’ àti ‘dá Ọlọ́run lóhùn padà’ mọ́
  alternative: Ọ̀rọ̀ tútù bí ‘láti dá Ọlọ́run lóhùn’
  rationale: Gíríìkì fi àfojúdi ìtakò ohun tí a dá sí Ẹlẹ́dàá hàn; a kò gbọdọ̀ rọ agbára yẹn kù tàbí yanjú ẹ̀dùn ọ̀rọ̀ ẹ̀kọ́-ìgbàgbọ́ inú àyíká náà.
- issue: Ìbéèrè àsọyé μὴ ἐρεῖ
  choice: 'Túmọ̀ ọ́ ní ọ̀nà tí ó retí ìdáhùn òdì: ‘kì yóò sọ ...?’'
  alternative: ‘Ǹjẹ́ ... yóò sọ ...?’
  rationale: μή pẹ̀lú ọjọ́ iwájú tọ́ka sí ìdáhùn òdì tí a retí. Yorùbá tó ní òdì gbangba pa ìtọ́sọ́nà náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ọ̀rọ̀ àdánidá fún òǹkàwé òde òní. A lo ‘mọ’ fún àwòrán ohun tí a mọ ní ọwọ́, kí ìfarakanra πλάσμα/πλάσαντι lè dúró; a sì lo ‘ènìyàn’ nítorí pé Yorùbá kò nílò akọ gẹ́gẹ́ bí aṣojú gbogbo ọmọ aráyé.
