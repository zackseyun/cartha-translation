  to: Ṣùgbọ́n, ìwọ ènìyàn, ta ni ọ́ tí ìwọ fi ń dá Ọlọ́run lóhùn padà? Ohun tí a mọ̀ kì yóò sọ fún ẹni tí ó mọ̀ ọ́ pé, “Èéṣe tí o fi ṣe mí báyìí?”[a]
