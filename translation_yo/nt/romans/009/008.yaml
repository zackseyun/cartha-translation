id: ROM.9.8
reference: Romans 9:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: yo
  text: Èyí ni pé, kì í ṣe àwọn ọmọ nípa ti ara[a] ni wọ́n jẹ́ àwọn ọmọ Ọlọ́run, ṣùgbọ́n àwọn ọmọ ìlérí ni a kà sí àtọmọdọ́mọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ nípa ìran nípa ti ara.” Ní ti gidi, Gíríìkì ní, “àwọn ọmọ ti ara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a kà sí irúgbìn.” Ọ̀rọ̀ Gíríìkì sperma (“irúgbìn”) túmọ̀ sí àwọn àtọmọdọ́mọ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Èyí ni pé
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń ṣàlàyé ọ̀rọ̀ tó ṣáájú; gbólóhùn náà jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ìtumọ̀ Gíríìkì mọ́.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: àwọn ọmọ nípa ti ara
  rationale: Ó tọ́ka sí àwọn àtọmọdọ́mọ nípa ìran ẹ̀dá. Èyí mú ìtumọ̀ genealogical ti σάρξ yé kedere láì fi èrò ìwà ẹlẹ́ṣẹ̀ kún un.
- source_word: τέκνα τοῦ θεοῦ
  choice: àwọn ọmọ Ọlọ́run
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìbátan genitive náà, ó sì pa ìyàtọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: àwọn ọmọ ìlérí
  rationale: Ó pa àwòrán Pọ́ọ̀lù mọ́ pé ìlérí Ọlọ́run ló ń ṣàlàyé irú ọmọ tí wọ́n jẹ́, kì í ṣe pé wọ́n kàn jẹ́ ọmọ tí a ti ṣèlérí.
- source_word: λογίζεται εἰς σπέρμα
  choice: ni a kà sí irú-ọmọ
  rationale: Ìṣe aláìlórúkọ náà kò fi ẹni tó ń kà wọ́n sí bẹ́ẹ̀ hàn ní tààrà, gẹ́gẹ́ bí Gíríìkì; “irú-ọmọ” sì sọ σπέρμα ní ìtumọ̀ àtọmọdọ́mọ nínú àyíká Ábúráhámù.
theological_decisions:
- issue: Ìyàtọ̀ láàárín àwọn àtọmọdọ́mọ nípa ti ara àti àwọn ọmọ tí ìlérí Ọlọ́run dá mọ̀
  choice: A pa ìyàtọ̀ náà mọ́ gẹ́gẹ́ bí Pọ́ọ̀lù ṣe sọ ọ́, láì sọ ètò ẹ̀kọ́ ìsìn kan pàtó di apá ìtumọ̀.
  alternative: Kí a túmọ̀ ẹsẹ náà ní pàtó gẹ́gẹ́ bí ọ̀rọ̀ nípa àwùjọ nìkan, tàbí gẹ́gẹ́ bí ọ̀rọ̀ nípa àyànmọ́ ẹni kọ̀ọ̀kan nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì fi ìyàtọ̀ náà hàn, ṣùgbọ́n kò pinnu gbogbo àríyànjiyàn ẹ̀kọ́ ìsìn tó yí Róòmù 9 ká; nítorí náà, ìtumọ̀ náà pa ìṣòro àti ààyè ìtumọ̀ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bójú mu. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé lasán. A lo “nípa ti ara” láti jẹ́ kí ìtumọ̀ ìran ẹ̀dá yé kedere, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀rọ̀ àwòrán Gíríìkì hàn.
