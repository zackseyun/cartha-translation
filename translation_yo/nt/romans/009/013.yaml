  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: yo
  text: gẹ́gẹ́ bí a ti kọ ọ́ pé, “Mo fẹ́ràn Jákọ́bù,[a][b] ṣùgbọ́n mo kórìíra Ẹ́sáù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ àyọlò náà wá láti Málákì 1:2–3.
    reason: cross_reference
  - marker: b
    text: Tàbí, “Mo kọ̀ ọ́ sílẹ̀,” tàbí, “Mo fẹ́ràn rẹ̀ kéré sí i.” Àwọn kan lóye “kórìíra” níhìn-ín gẹ́gẹ́ bí ìkọ̀sílẹ̀ nínú májẹ̀mú tàbí fífi ẹnì kan ṣáájú ẹlòmíràn, kì í ṣe ìkórìíra ọkàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó mú ọ̀nà ìfiwé tí ó ń ṣáájú àyọlò Ìwé Mímọ́ jáde lọ́nà àdánidá ní Yorùbá.
- source_word: γέγραπται
  choice: a ti kọ ọ́ pé
  rationale: Ó fi ìṣe tí a ti parí ṣùgbọ́n tí ohun tí a kọ ṣì dúró hàn, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe déédé fún gbólóhùn ìtọ́kasí Ìwé Mímọ́.
- source_word: Ἰακώβ
  choice: Jákọ́bù
  rationale: Àkọsílẹ̀ orúkọ ẹni náà tẹ̀ lé ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: ἠγάπησα
  choice: Mo fẹ́ràn
  rationale: Ó túmọ̀ ìfẹ́ tí ọ̀rọ̀ Gíríìkì náà sọ ní tààrà, ní ìrísí ìṣe àtijọ́ tí ó bá àyọlò náà mu.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó lágbára láàárín Jákọ́bù àti Ẹ́sáù hàn kedere.
- source_word: Ἠσαῦ
  choice: Ẹ́sáù
  rationale: Àkọsílẹ̀ orúkọ ẹni náà tẹ̀ lé ìlò Yorùbá tí ó wọ́pọ̀.
- source_word: ἐμίσησα
  choice: mo kórìíra
  rationale: Èyí ni ìtumọ̀ tààrà fún ọ̀rọ̀ Gíríìkì μισέω; a kò sọ ọ́ di tútù nínú ọ̀rọ̀ pàtàkì, kí ìdíjú ẹ̀kọ́ ìgbàgbọ́ inú àyọlò náà lè dúró.
theological_decisions:
- issue: Bóyá kí a sọ “mo kórìíra” di ọ̀rọ̀ tútù nítorí àríyànjiyàn nípa yíyan Ọlọ́run àti àṣà ọ̀rọ̀ Sémítìkì
  choice: Fi “mo kórìíra” sílẹ̀ nínú ọ̀rọ̀ pàtàkì
  alternative: “mo kọ̀ sílẹ̀” tàbí “mo fẹ́ràn díẹ̀ sí i”
  rationale: Àyọlò Gíríìkì láti Málákì lo μισέω, ọ̀rọ̀ tó lágbára tí ìtumọ̀ rẹ̀ tààrà jẹ́ “kórìíra.” Fífi ọ̀rọ̀ tútù rọ́pò rẹ̀ yóò yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan láìjẹ́ kí àìdánilójú àti ìdíjú inú orísun dúró.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tí ó bójú mu, tó ní àmì ohùn ní kíkún níbi tó ti yẹ. “Gẹ́gẹ́ bí a ti kọ ọ́ pé” jẹ́ ọ̀nà ìtọ́kasí Ìwé Mímọ́ tó ṣe déédé; “mo kórìíra” pa agbára àti ìdíjú ọ̀rọ̀ orísun mọ́. Àwọn àmì àlàyé tẹ̀ lé ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
