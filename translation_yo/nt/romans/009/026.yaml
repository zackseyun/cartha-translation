id: ROM.9.26
reference: Romans 9:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: yo
  text: Yóò sì ṣẹlẹ̀ pé, ní ibi náà gan-an tí a ti sọ fún wọn pé, “Ẹ̀yin kì í ṣe àwọn ènìyàn mi,” níbẹ̀ ni a ó pè wọ́n ní àwọn ọmọkùnrin Ọlọ́run alààyè.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lè túmọ̀ ọ́ sí “àwọn ọmọ Ọlọ́run alààyè.” Gíríìkì ní “àwọn ọmọkùnrin,” èyí tí a pa mọ́ nínú ẹsẹ̀ láti fi ọ̀rọ̀ orísun náà àti ìtumọ̀ ipò ọmọ àti ogún rẹ̀ hàn. Síbẹ̀, ìtọ́kasí náà lè kan gbogbo àwọn tí Ọlọ́run sọ di ènìyàn rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yíyọ tàbí ìtọ́kasí sí Hósíà 1:10 (2:1 nínú LXX), tí ó lo èdè ìmúpadàbọ̀sípò májẹ̀mú.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἔσται
  choice: Yóò sì ṣẹlẹ̀ pé
  rationale: Ó pa àsopọ̀ καὶ àti ìtumọ̀ ọjọ́ iwájú ἔσται mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti bẹ̀rẹ̀ ohun tí yóò ṣẹlẹ̀.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: ní ibi náà gan-an tí
  rationale: “Ibi” túmọ̀ τόπος, “náà gan-an” sì mú ìbámu pàtó àti ìtẹnumọ́ inú ọ̀rọ̀ àyọlò náà jáde láìfi èrò tuntun kún un.
- source_word: ἐρρέθη αὐτοῖς
  choice: a ti sọ fún wọn
  rationale: Ìkọ́lé aláìdárúkọ ẹni tó ṣe iṣẹ́ náà jẹ́ ọ̀nà Yorùbá tó bá ìṣe àìṣe-taara Gíríìkì mu, láìsọ pé Ọlọ́run ni ẹni tó sọ ọ́ nígbà tí ẹsẹ̀ náà kò sọ bẹ́ẹ̀ ní tààrà.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Ẹ̀yin kì í ṣe ènìyàn mi
  rationale: Ó pa ọ̀rọ̀ májẹ̀mú “ènìyàn mi” mọ́, ó sì gbé gbolohun náà kalẹ̀ ní Yorùbá tó ṣe kedere.
- source_word: ἐκεῖ
  choice: níbẹ̀
  rationale: Ó tẹnumọ́ ìyípadà tí yóò wáyé ní ibi kan náà.
- source_word: κληθήσονται
  choice: a ó ti pè wọ́n
  rationale: Ìkọ́lé aláìdárúkọ olùṣe náà ń ṣiṣẹ́ gẹ́gẹ́ bí àìṣe-taara Gíríìkì, ó sì fi ẹni tó ń pè wọ́n sílẹ̀ láìdárúkọ bí orísun ṣe ṣe.
- source_word: υἱοὶ
  choice: àwọn ọmọkùnrin
  rationale: Gíríìkì lo ọ̀rọ̀ akọ ní ọ̀pọ̀, kì í ṣe τέκνα tó túmọ̀ sí ọmọ lápapọ̀. “Àwọn ọmọkùnrin” pa ìrísí ọ̀rọ̀ orísun àti ìró ipò ọmọ/alábápín ogún mọ́; àlàyé ìsàlẹ̀ fi hàn pé gbogbo àwọn tí Ọlọ́run sọ di ènìyàn rẹ̀ ni ìtọ́kasí náà lè kàn.
- source_word: θεοῦ ζῶντος
  choice: Ọlọ́run alààyè
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀, tó sì pa ìyàtọ̀ Bíbélì láàárín Ọlọ́run tó wà láàyè àti àwọn òrìṣà aláìlẹ́mìí mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ υἱοὶ, ọ̀rọ̀ akọ ní ọ̀pọ̀ tó lè dúró fún gbogbo ẹgbẹ́
  choice: àwọn ọmọkùnrin
  alternative: àwọn ọmọ; àwọn ọmọkùnrin àti ọmọbìnrin
  rationale: Ọ̀rọ̀ orísun jẹ́ υἱοὶ (“àwọn ọmọkùnrin”), ó sì lè ní ìró ipò ọmọ àti ogún nínú ọ̀rọ̀ Paulu àti àyọlò Hósíà. A pa ọ̀rọ̀ akọ náà mọ́ nínú ẹsẹ̀, ṣùgbọ́n a ṣàlàyé ìtọ́kasí tó lè gba gbogbo àwọn tí a sọ di ènìyàn Ọlọ́run nínú àlàyé ìsàlẹ̀.
- issue: Ìdánimọ̀ májẹ̀mú inú λαός μου
  choice: ènìyàn mi
  alternative: àwọn ènìyàn tèmi
  rationale: “Ènìyàn mi” pa ìlànà ọ̀rọ̀ májẹ̀mú inú Hósíà mọ́, kò sì tú u sí ọ̀rọ̀ àlàyé tó lè dín ìró ìmúpadàbọ̀sípò rẹ̀ kù.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti àdánidá. “Yóò sì ṣẹlẹ̀ pé” ń pa ìlànà àyọlò Bíbélì mọ́ láìdi ọ̀rọ̀ àtijọ́; “ní ibi náà gan-an” sì mú ìtẹnumọ́ orísun jáde. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbogbo àyọlò náà nítorí pé ọ̀kan ṣàlàyé “àwọn ọmọkùnrin,” èkejì sì tọ́ka sí Hósíà.
