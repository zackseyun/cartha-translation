  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní ìlànà gbogbogbò: ó pa ọjọ́ iwájú, ìkọ́lé aláìṣiṣẹ́-taara ti ‘a ó pè,’ ìtẹnumọ́ ‘níbẹ̀,’ àti ‘àwọn ọmọkùnrin Ọlọ́run alààyè’ mọ́. Ṣùgbọ́n ‘ènìyàn mi’ lè túmọ̀ sí ẹni kan tí í ṣe ti èmi ní Yorùbá, níbi tí λαός μου jẹ́ ẹgbẹ́ ènìyàn májẹ̀mú. ‘Àwọn ènìyàn mi’ mú ìtumọ̀ ẹgbẹ́ náà hàn kedere.'
  naturalness: ‘Yóò sì ṣẹlẹ̀ pé’ jẹ́ ohun tí ó ṣeé gbà, ṣùgbọ́n ‘a ó ti pè wọ́n’ lè dá bí ọjọ́ iwájú pípé (‘will have called’) ju ọjọ́ iwájú aláìṣe-taara κληθήσονται lọ. ‘A ó pè wọ́n’ jẹ́ àdánidá, ó sì péye.
  terminology: ‘Àwọn ọmọkùnrin Ọlọ́run alààyè’ pa υἱοὶ àti θεοῦ ζῶντος mọ́ ní ìforúkọsílẹ̀ Bíbélì. A ṣe àtúnṣe àlàyé ìsàlẹ̀ kí èdè rẹ̀ le túbọ̀ jẹ́ Yorùbá àpapọ̀ tó rọrùn àti kí ó má ṣe sọ ju ohun tí orísun fi hàn lọ.
