id: ROM.9.28
reference: Romans 9:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: yo
  text: Nítorí Olúwa yóò mú ọ̀rọ̀ rẹ̀ ṣẹ lórí ilẹ̀ ayé[a][c], yóò parí rẹ̀, yóò sì gé e kúrú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olúwa yóò mú ọ̀ràn náà tàbí ìdájọ́ náà ṣẹ lórí ilẹ̀ ayé.”
    reason: lexical_alternative
  - marker: b
    text: “Gé e kúrú” tún lè túmọ̀ sí “dín in kù,” tàbí, ní ìtumọ̀ tí ó lè yọ láti inú rẹ̀, “mú un ṣẹ ní kíákíá.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn kan túmọ̀ ἐπὶ τῆς γῆς sí “ní ilẹ̀ náà,” ní títẹ̀lé àyíká ọ̀rọ̀ Aísáyà; níbí a túmọ̀ ọ̀rọ̀ Gíríìkì inú Róòmù ní ìtumọ̀ gbígbòòrò rẹ̀, “lórí ilẹ̀ ayé.”
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: ọ̀rọ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí ọ̀rọ̀ tí a sọ, ọ̀ràn, tàbí ìdájọ́. “Ọ̀rọ̀ rẹ̀” pa ìtumọ̀ ohun tí Olúwa ti sọ mọ́, ó sì bá èdè Yorùbá àdánidá mu; “rẹ̀” jẹ́ ohun tí a fi kún un láti inú ẹni tí ó ṣe iṣẹ́ náà, kì í ṣe ọ̀rọ̀ ọ̀tọ̀ nínú Gíríìkì.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ohun tí a sọ ṣáájú.
- source_word: συντελῶν
  choice: yóò parí rẹ̀
  rationale: Ó sọ pé Olúwa yóò mú ohun tí ó sọ dé òpin rẹ̀. Fífi ọ̀rọ̀-ìṣe olódindi lò jẹ́ èdè Yorùbá tó ṣe kedere fún ìṣe alábàákẹ́gbẹ́ tí participle Gíríìkì ń sọ.
- source_word: καὶ συντέμνων
  choice: yóò sì gé e kúrú
  rationale: Ó pa àwòrán líle ti ‘gígé kúrú’ mọ́ láì pinnu bóyá ohun pàtàkì jù ni kíkúrú rẹ̀ tàbí yíyára mú un ṣẹ.
- source_word: ποιήσει
  choice: yóò mú … ṣẹ
  rationale: Pẹ̀lú λόγον gẹ́gẹ́ bí ohun tí iṣẹ́ náà kan, gbólóhùn Yorùbá “mú ọ̀rọ̀ ṣẹ” túmọ̀ sí ṣíṣe ohun tí a ti sọ, ó sì ṣe kedere ju “ṣe ọ̀rọ̀” lọ.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó bójú mu fún orúkọ oyè Ọlọ́run nínú àyọlò yìí.
- source_word: ἐπὶ τῆς γῆς
  choice: lórí ilẹ̀ ayé
  rationale: Èyí pa ìtumọ̀ gbígbòòrò ti ọ̀rọ̀ Gíríìkì inú Róòmù mọ́; “ní ilẹ̀ náà” ṣì ṣeé ṣe ní ìmọ́lẹ̀ àyíká Aísáyà.
theological_decisions:
- issue: Irú iṣẹ́ Ọlọ́run tí àyọlò Aísáyà ń tọ́ka sí
  choice: Olúwa yóò mú ọ̀rọ̀ tí ó ti sọ ṣẹ ní kíkún àti ní ọ̀nà tí a gé kúrú.
  alternative: Olúwa yóò mú ìdájọ́ kan ṣẹ ní kíákíá àti pátápátá.
  rationale: Àwọn participle méjèèjì lè ní agbára ìdájọ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò fi dandan sọ ètò ẹ̀kọ́ kan pàtó. Ìtumọ̀ náà pa ìfojúsùn tó wà láàárín ‘ọ̀rọ̀,’ ‘ọ̀ràn,’ àti ‘ìdájọ́,’ àti láàárín ‘gígé kúrú’ àti ‘mímú ṣẹ ní kíákíá,’ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo “mú ọ̀rọ̀ ṣẹ” gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ṣíṣe ohun tí a ti kéde, nígbà tí “gé e kúrú” pa àwòrán orísun Gíríìkì mọ́. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó yẹ.
