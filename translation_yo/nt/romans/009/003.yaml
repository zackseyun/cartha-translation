id: ROM.9.3
reference: Romans 9:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: yo
  text: Nítorí mo lè fẹ́ kí èmi fúnra mi jẹ́ ẹni ègún, kí a sì yà mí kúrò lọ́dọ̀ Mèsáyà, nítorí àwọn arákùnrin mi,[a] àwọn ìbátan mi nípa ti ara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “àwọn arákùnrin mi”; nínú àyíká ọ̀rọ̀ yìí, Pọ́ọ̀lù ń tọ́ka sí àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ rẹ̀, ìbátan rẹ̀ nípa ẹ̀yà.
    reason: cultural_note
  - marker: b
    text: “Nípa ti ara” níbí túmọ̀ sí nípa ìbí tàbí ìran ẹ̀yà, kì í ṣe “ẹ̀dá ẹlẹ́ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí, “kí èmi fúnra mi wà lábẹ́ ègún, ní ìyapa kúrò lọ́dọ̀ Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: mo lè fẹ́
  rationale: Ó fi ìfẹ́ àròjinlẹ̀ tàbí ohun tí ó ṣòro láti fẹ́ hàn, dípò kí a sọ ọ́ bí àdúrà tàbí ìṣẹ̀lẹ̀ kan ní àkókò tí ó kọjá.
- source_word: ἀνάθεμα
  choice: wà lábẹ́ ègún
  rationale: Ó sọ ipò ẹni tí ègún dé bá ní èdè Yorùbá tí ó ṣe kedere, ó sì pa ìwọ̀n ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: kí a sì yà mí kúrò lọ́dọ̀ Mèsáyà
  rationale: ἀπό ní agbára ìyapa; ọ̀rọ̀ yìí mú ìyapa kúrò lọ́dọ̀ Mèsáyà hàn ní kedere. Χριστός jẹ́ oyè níbí, nítorí náà a lò “Mèsáyà.”
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Ní àyíká yìí, ó túmọ̀ sí fún ire tàbí nítorí àwọn ẹlòmíràn, èyí tí “nítorí” gbé jáde lọ́nà àdánidá.
- source_word: τῶν ἀδελφῶν μου
  choice: àwọn arákùnrin mi
  rationale: Ó pa ọ̀rọ̀ akọ ọ̀pọ̀ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé àwọn ọmọ Ísírẹ́lì ẹlẹgbẹ́ Pọ́ọ̀lù ni ó ń tọ́ka sí.
- source_word: τῶν συγγενῶν μου
  choice: àwọn ìbátan mi
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ẹni tí ìran tàbí ẹ̀jẹ̀ so pọ̀, pẹ̀lú ìtumọ̀ àpapọ̀ ní àyíká yìí.
- source_word: κατὰ σάρκα
  choice: nípa ti ẹ̀yà ara
  rationale: Ó pa àwòrán “ẹran ara” mọ́ ní ọ̀nà tí ó lè túmọ̀ sí ìran ti ara; àlàyé ìsàlẹ̀ dáàbò bo lòdì sí ìtumọ̀ “ẹ̀dá ẹlẹ́ṣẹ̀.”
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Pọ́ọ̀lù jẹ́ àdúrà gidi tàbí ìfẹ́ àròjinlẹ̀
  choice: A túmọ̀ ọ́ sí “mo lè fẹ́,” èyí tó fi ìfẹ́ àròjinlẹ̀ hàn.
  alternative: “Mo ń fẹ́” tàbí “mo gbàdúrà.”
  rationale: Èyí kò sọ ju ẹ̀rí Gíríìkì lọ pé Pọ́ọ̀lù gbàdúrà gangan láti yapa kúrò lọ́dọ̀ Mèsáyà, síbẹ̀ ó pa bí ìfẹ́ rẹ̀ ti lágbára mọ́.
- issue: Bóyá Χριστός jẹ́ oyè tàbí orúkọ bí orúkọ ẹni
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, agbára oyè náà bá ọ̀rọ̀ mu, ó sì mú ìtumọ̀ ẹni àmì òróró hàn.
- issue: Ìtumọ̀ σάρξ nínú κατὰ σάρκα
  choice: Ìran tàbí ìbátan ti ara
  alternative: Ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: Pọ́ọ̀lù ń sọ nípa ìbátan ẹ̀yà àti ìran, kì í ṣe nípa ìwà ẹlẹ́ṣẹ̀.
- issue: Ìbáṣepọ̀ ἀνάθεμα àti ἀπὸ τοῦ Χριστοῦ
  choice: 'A sọ ègún àti yíyapa ní àwọn gbólóhùn tó so pọ̀: “wà lábẹ́ ègún, kí a sì yà mí...”'
  alternative: “jẹ́ ohun ègún kúrò lọ́dọ̀ Mèsáyà” tàbí kí gbolohun náà dúró ní ìṣòro rẹ̀ láìsí àsopọ̀.
  rationale: Èyí jẹ́ Yorùbá àdánidá, ó sì fi àwọn èrò méjèèjì—ègún àti ìyapa—hàn láìsọ pé wọn kò ní ìbáṣepọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo “Mèsáyà” gẹ́gẹ́ bí oyè, “lábẹ́ ègún” fún ἀνάθεμα, a sì fi àmi ohùn sí ibi tí ó bá àdánidá mu. Àwọn àlàyé ìsàlẹ̀ méjèèjì ni gbogbo àmi wọn farahàn nínú ọ̀rọ̀ pàtàkì.
