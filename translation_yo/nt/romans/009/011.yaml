    issue: Ìtumọ̀ “kí wọ́n tó bí wọn” ní aṣojú-ọrọ̀ tí ó lè ṣàìdánilẹ́kọ̀ọ́.
    rationale: Ní Yorùbá, ó lè túmọ̀ sí ‘before they bore them,’ níbi tí ‘wọ́n’ ṣe dà bí olùṣe ìbí. “Kí a tó bí wọn” ń sọ passive γεννηθέντων ní kedere.
  - severity: low
