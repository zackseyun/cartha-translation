revisions:
- from: Nítorí kí wọ́n tó bí wọn, tí wọn kò sì tíì ṣe ohunkóhun rere tàbí búburú[a]—kí ète Ọlọ́run gẹ́gẹ́ bí ìyàn rẹ̀ lè dúró ṣinṣin[b][c]—
  to: Nítorí, kí a tó bí wọn, tí wọn kò sì tíì ṣe ohunkóhun rere tàbí búburú[a], kí ète Ọlọ́run ní ìbámu pẹ̀lú ìyàn lè wà nìṣó[b][c]—
  rationale: Àtúnṣe náà mú passive genitive absolute náà hàn ní Yorùbá tí kò ní ìdààmú, ó sì dín ìtumọ̀ tí a fi kún μένω kù. Ó pa agbára gbólóhùn ète ἵνα, ìyàtọ̀ rere/búburú, àti àìdánilójú ìtumọ̀ tó wà nínú κατ’ ἐκλογήν mọ́.
  reviewer_model: gpt-5.6-terra
