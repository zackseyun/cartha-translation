    rationale: μένῃ jẹ́ ‘might remain/continue’; ‘ṣinṣin’ ń mú èrò ìdúró láìyípadà wọlé ju ọ̀rọ̀ Gíríìkì lọ, bí ó tilẹ̀ jẹ́ pé ‘stand’ jẹ́ àṣàyàn tó ṣeé ṣe nínú àlàyé.
  - severity: low
