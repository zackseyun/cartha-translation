id: ROM.9.11
reference: Romans 9:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: yo
  text: Nítorí, kí a tó bí wọn, tí wọn kò sì tíì ṣe ohunkóhun rere tàbí búburú[a], kí ète Ọlọ́run ní ìbámu pẹ̀lú ìyàn lè wà nìṣó[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohunkóhun rere tàbí ibi.” Ọ̀rọ̀ Gíríìkì φαῦλον lè túmọ̀ sí ohun búburú, ohun tí kò níye, tàbí ohun ibi ní ti ìwà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ète yíyan Ọlọ́run” tàbí “ète Ọlọ́run ní ti ìyàn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “lè dúró.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí “lè wà nìṣó” tàbí “lè dúró”; ní àyíká ọ̀rọ̀ yìí, ó lè túmọ̀ sí pé ète náà ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω ... γεννηθέντων
  choice: kí wọ́n tó bí wọn
  rationale: 'Ó sọ ìbáṣepọ̀ àkókò náà ní Yorùbá àdánidá: àwọn ìṣẹ̀lẹ̀ inú gbólóhùn àkọ́kọ́ kò tíì ṣẹlẹ̀ ṣáájú ète tí a mẹ́nu kàn.'
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé tí Pọ́ọ̀lù ṣe mọ́ ẹsẹ tó ṣáájú mọ́.
- source_word: μηδὲ πραξάντων
  choice: tí wọn kò sì tíì ṣe
  rationale: Ó pa àfikún ìkọ̀ náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé lẹ́yìn ‘kí wọ́n tó bí wọn.’
- source_word: τι ἀγαθὸν ἢ φαῦλον
  choice: ohunkóhun rere tàbí búburú
  rationale: Àwọn ọ̀rọ̀ méjèèjì dúró ní ìyàtọ̀ tó ṣe kedere; ‘búburú’ lè túmọ̀ sí ohun tí kò dára tàbí ohun ibi láìfi ìtumọ̀ kan ṣoṣo lé φαῦλον lórí.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìkọ̀lé yìí fi agbára gbólóhùn ète hàn, láìpinnu àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tó gbòòrò ju ohun tí gírámà sọ lọ.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: ète Ọlọ́run gẹ́gẹ́ bí ìyàn rẹ̀
  rationale: Ó pa ìbáṣepọ̀ κατ’ ἐκλογήν mọ́ ní ọ̀nà tó ṣe kedere, kò sì sọ ọ́ di àlàyé ẹ̀kọ́ ìgbàgbọ́ tó ju ọ̀rọ̀ orísun lọ.
- source_word: μένῃ
  choice: lè dúró ṣinṣin
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó mú ìtumọ̀ ‘wà nìṣó/dúró’ jáde lọ́nà Yorùbá tó ṣe déédéé, pẹ̀lú èrò pé ète náà kò yí padà.
theological_decisions:
- issue: Agbára ἵνα nínú ọ̀rọ̀ nípa ìyàn Ọlọ́run
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí gbólóhùn ète: ‘kí ète Ọlọ́run ... lè dúró ṣinṣin.’'
  alternative: ‘tó fi jẹ́ pé ...’ gẹ́gẹ́ bí àbájáde
  rationale: Gírámà náà ṣe àtìlẹ́yìn fún ète, ṣùgbọ́n ìtumọ̀ yìí kò fi ipá yanju àríyànjiyàn nípa bí ìpinnu Ọlọ́run àti ìṣe ènìyàn ṣe jọ ṣiṣẹ́.
- issue: Ìtumọ̀ ἐκλογή
  choice: ìyàn
  alternative: àyànfẹ́; yíyan
  rationale: ‘Ìyàn’ jẹ́ ọ̀rọ̀ kúkúrú tó dúró fún ìṣe yíyan, tí ó sì pa ìwúwo ọ̀rọ̀ Pọ́ọ̀lù mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. Àmì gígùn fi hàn pé ẹsẹ yìí ń bá ọ̀rọ̀ rẹ̀ lọ sí ẹsẹ tó tẹ̀ lé e.
