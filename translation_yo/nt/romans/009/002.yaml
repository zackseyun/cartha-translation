  text: ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/002.yaml
  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: yo
  text: pé mo ní ìbànújẹ́ ńlá àti ìrora tí kò dáwọ́ dúró nínú ọkàn mi.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ‘ìbànújẹ́’ sí ‘ìkẹ́dùn.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ‘ìrora’ sí ‘ìpọ́njú ọkàn.’
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, èdè Gíríìkì sọ pé ‘sí ọkàn mi’; ‘nínú ọkàn mi’ ni àṣà ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ rẹ̀ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàlàyé ohun tí Pọ́ọ̀lù fi ìdánilójú sọ ní ẹsẹ tó ṣáájú; ‘pé’ ni ọ̀nà àdánidá láti so gbólóhùn náà pọ̀ ní Yorùbá.
- source_word: λύπη
  choice: ìbànújẹ́
  rationale: Ó túmọ̀ sí ìbànújẹ́ tàbí ìkẹ́dùn jíjinlẹ̀; ‘ìbànújẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ní ìwọ̀n ẹ̀dùn tó yẹ.
- source_word: μοί ἐστιν
  choice: mo ní
  rationale: Ìṣètò dátífù pẹ̀lú εἰμί ń fi ohun tí ẹni kan ní tàbí ń ní ìrírí rẹ̀ hàn; ‘mo ní’ sọ èrò náà ní Yorùbá àdánidá.
- source_word: μεγάλη
  choice: ńlá
  rationale: Ó ń mú ìwọ̀n λύπη lágbára; ‘ìbànújẹ́ ńlá’ jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: καὶ
  choice: àti
  rationale: Ó so àwọn ọ̀rọ̀ méjèèjì tó ń ṣàpèjúwe ẹ̀dùn pọ̀.
- source_word: ἀδιάλειπτος
  choice: tí kò dáwọ́ dúró
  rationale: Ó fi hàn pé ìrora náà ń bá a lọ láìsinmi; gbólóhùn yìí jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὀδύνη
  choice: ìrora
  rationale: Ó tọ́ka sí ìrora tàbí ìpọ́njú inú tó le; ‘ìrora’ jẹ́ ọ̀rọ̀ tààrà, tí àyíká ọkàn sì mú kí a lóye rẹ̀ gẹ́gẹ́ bí ẹ̀dùn inú.
- source_word: τῇ καρδίᾳ μου
  choice: nínú ọkàn mi
  rationale: Bí ó tilẹ̀ jẹ́ pé dátífù Gíríìkì túmọ̀ ní tààrà sí ‘sí ọkàn mi,’ ‘nínú ọkàn mi’ ni àṣà ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ ẹ̀dùn inú mu, tó sì pa àwòrán ‘ọkàn’ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A pa ìṣọ̀kan ẹsẹ yìí mọ́ pẹ̀lú ẹsẹ tó ṣáájú nípa lílo ‘pé.’
