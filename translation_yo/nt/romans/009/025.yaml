id: ROM.9.25
reference: Romans 9:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: yo
  text: Bí ó ti tún sọ nínú ìwé Hóséà[a] pé, “Èmi yóò pe àwọn tí kì í ṣe ènìyàn mi ní ‘ènìyàn mi,’[b] àti obìnrin tí a kò fẹ́ràn ní ‘ẹni tí a fẹ́ràn.’”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìtọ́kasí ni sí Hóséà 2:23; ìṣírò àwọn ẹsẹ lè yàtọ̀ nínú àwọn àṣà Ìwé Mímọ́ kan.
    reason: cross_reference
  - marker: b
    text: Gíríìkì lo ìrísí ẹyọ kan ní gírámà, ṣùgbọ́n “ènìyàn” níbí lè tọ́ka sí àwùjọ kan lápapọ̀.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì fi ẹni kejì hàn gẹ́gẹ́ bí abo ẹyọ kan. A tún lè túmọ̀ ọ́ sí “ẹni tí a kò fẹ́ràn ... ẹni tí a fẹ́ràn”; “ààyò” tàbí “olùfẹ́” lè mú apá kan nínú ìtumọ̀ náà jáde, ṣùgbọ́n wọn kò pa àtúnlò ọ̀rọ̀-ìṣe “fẹ́ràn” mọ́ bákan náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: Bí ó ti tún
  rationale: Ó mú agbára ìfiwéra àti àfikún tí ὡς καὶ ní wá sí Yorùbá ní ọ̀nà àdánidá, ó sì fi hàn pé ẹsẹ Ìwé Mímọ́ yìí tún ń fi ohun tí a ṣẹ̀ṣẹ̀ sọ múlẹ̀.
- source_word: ἐν τῷ Ὡσηὲ
  choice: nínú ìwé Hóséà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún gbólóhùn ìtọ́kasí sí apá kan nínú ìwé Hóséà; fífi “ìwé” kún un kò jẹ́ kí ẹni kà á bí ẹni pé Ọlọ́run sọ̀rọ̀ nínú ara wòlíì náà.
- source_word: λέγει
  choice: sọ
  rationale: Ó pa ìṣe sísọ mọ́, ó sì jẹ́ kí arọ́pò-orúkọ “ó” tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùsọ nínú ọ̀rọ̀ tó yí ẹsẹ náà ká.
- source_word: Καλέσω
  choice: Èmi yóò pe ... ní
  rationale: “Pe ... ní” ni ọ̀nà Yorùbá tó bá àpèjúwe tàbí yíyan orúkọ mu, ó sì pa àkókò ọjọ́ iwájú mọ́.
- source_word: τὸν οὐ λαόν μου
  choice: ẹni tí kì í ṣe ènìyàn mi
  rationale: “Ènìyàn mi” lè ní ìtumọ̀ àpapọ̀ ní Yorùbá bí λαός, nígbà tí “ẹni” pa ìrísí ẹyọ kan ti Gíríìkì mọ́ láìsọ ọ́ di ẹni kọ̀ọ̀kan nìkan.
- source_word: λαόν μου
  choice: ènìyàn mi
  rationale: Èyí ni gbólóhùn Yorùbá tó wọ́pọ̀ fún ìbáṣepọ̀ májẹ̀mú “my people,” ó sì lè dúró fún gbogbo àwùjọ kan.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: obìnrin tí a kò fẹ́ràn
  rationale: Orúkọ “obìnrin” mú ìrísí abo ẹyọ kan nínú Gíríìkì hàn, nígbà tí “tí a kò fẹ́ràn” pa ìtumọ̀ àìfẹ́ràn àti ohùn àìṣe mọ́.
- source_word: ἠγαπημένην
  choice: obìnrin tí a fẹ́ràn
  rationale: Ó tún ọ̀rọ̀-ìṣe “fẹ́ràn” lò kí ìbátan ọ̀rọ̀ náà hàn kedere, ó sì túmọ̀ sí ẹni tí ìfẹ́ wà lórí rẹ̀ dípò fífi akọ́lé ẹ̀kọ́ ìsìn kan kún un.
theological_decisions:
- issue: Agbára àpapọ̀ tàbí ti ẹnìkọ̀ọ̀kan nínú àyọlò Hóséà
  choice: A pa ìrísí ẹyọ kan mọ́ pẹ̀lú “ẹni,” ṣùgbọ́n “ènìyàn mi” ṣì ní agbára àpapọ̀ ní Yorùbá.
  alternative: “Àwọn tí kì í ṣe ènìyàn mi” tàbí lílo àwọn akọ́lé “Kì í ṣe ènìyàn mi” àti “A kò fẹ́ràn.”
  rationale: Pọ́ọ̀lù ń lo Hóséà láti sọ nípa pípe àwùjọ kan fún Ọlọ́run, ṣùgbọ́n Gíríìkì fi ọ̀rọ̀ náà sí ẹyọ kan. Ìtumọ̀ yìí kò pa èyíkéyìí nínú àwọn méjèèjì rẹ́.
- issue: Ìrísí abo nínú τὴν οὐκ ἠγαπημένην
  choice: A sọ “obìnrin tí a kò fẹ́ràn” kí ìrísí abo náà lè hàn ní Yorùbá.
  alternative: “Ẹni tí a kò fẹ́ràn,” èyí tí kò sọ akọ tàbí abo.
  rationale: Yorùbá kì í fi akọ tàbí abo hàn nínú arọ́pò-orúkọ, nítorí náà fífi “obìnrin” síbẹ̀ jẹ́ ọ̀nà tó ṣe kedere láti pa àmì abo ti Gíríìkì àti àyíká Hóséà mọ́ láìyanju ìtumọ̀ ẹ̀kọ́ ìsìn náà ju ohun tí ọ̀rọ̀ sọ lọ.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Gbólóhùn àyọlò náà pa ìṣọ̀kan “ènìyàn mi” àti àtúnlò “fẹ́ràn” mọ́, ó sì yẹra fún àwọn ọ̀rọ̀ ìjọ tàbí ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
