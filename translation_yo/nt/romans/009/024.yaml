  source_fidelity: Ìtumọ̀ náà fi ìbáṣepọ̀ οὓς ... ἡμᾶς hàn dáadáa nínú “àní àwa tí ó sì pè,” ó sì pa ìtẹnumọ́ “àwa” mọ́. “Ó sì pè” túmọ̀ ἐκάλεσεν pẹ̀lú agbára àfikún καί, nígbà tí ìlànà “kì í ṣe ... nìkan, ṣùgbọ́n ... pẹ̀lú” ń ṣojú οὐ μόνον ... ἀλλὰ καί ní ìwọ̀ntúnwọ̀nsì. “Àwọn tí kì í ṣe Júù” jẹ́ ìtumọ̀ tó péye ní àyíká ìyàtọ̀ Júù/ἐθνῶν.
  naturalness: Yorùbá náà jẹ́ ti òde òní, ó sì dáa fún ọ̀rọ̀ mímọ́ tó ní iyì. “Láti inú àwọn Júù” àti “láti inú àwọn tí kì í ṣe Júù” jẹ́ ọ̀nà tí ó ṣe kedere láti fi ìtumọ̀ ἐξ hàn. Àmì ohùn àti ìkọ̀wé orúkọ wà ní ìlànà tó yẹ.
  terminology: “Pè” yẹ fún καλέω nínú ọ̀rọ̀ Pọ́ọ̀lù, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un. Yíyan “àwọn tí kì í ṣe Júù” dípò “Kèfèrí” dáàbò bo ìtumọ̀ ẹ̀yà/àwọn ènìyàn ti ἐθνῶν, kì í sì í sọ pé gbogbo wọn jẹ́ aláìgbàgbọ́. Àwọn àlàyé ìsàlẹ̀ jẹ́ olóòtítọ́ sí Gíríìkì, àwọn àmì a àti b sì wà ní ibi tó tọ́.
