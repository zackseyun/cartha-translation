id: ROM.9.24
reference: Romans 9:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: yo
  text: àní àwa[a] tí ó sì pè, kì í ṣe láti inú àwọn Júù nìkan, ṣùgbọ́n láti inú àwọn tí kì í ṣe Júù[b] pẹ̀lú—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ṣísọ ọ́ ní ọ̀nà tó sún mọ́ ìṣètò ọ̀rọ̀ Gíríìkì: “àwọn tí ó sì pè, àní àwa.” Pọ́ọ̀lù fi “àwa” hàn gẹ́gẹ́ bí àwọn tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.'
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: “àwọn orílẹ̀-èdè.” Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe Júù.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: àní àwa tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ οὓς ń tọ́ka sí àwọn tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú, ἡμᾶς sì ṣàlàyé pé ‘àwa’ ni wọ́n. ‘Àní àwa tí’ mú ìtẹnumọ́ àti ìsopọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: καὶ ἐκάλεσεν
  choice: ó sì pè
  rationale: ‘Pè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún καλέω, ‘sì’ sì fi agbára àfikún καί hàn láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: kì í ṣe ... nìkan, ṣùgbọ́n ... pẹ̀lú
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti pa ìwọ̀ntúnwọ̀nsì àti ìtakora inú gbólóhùn Gíríìkì mọ́.
- source_word: ἐξ Ἰουδαίων
  choice: láti inú àwọn Júù
  rationale: ἐξ ń fi orísun tàbí ẹgbẹ́ tí a ti yan àwọn ènìyàn láti inú rẹ̀ hàn; ‘láti inú’ mú ìtumọ̀ yìí ṣe kedere.
- source_word: ἐξ ἐθνῶν
  choice: láti inú àwọn tí kì í ṣe Júù
  rationale: Nínú ìtakora pẹ̀lú Ἰουδαίων, ἐθνῶν ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Gbólóhùn yìí ṣe kedere, ó sì yẹra fún ‘Kèfèrí,’ tó lè túmọ̀ sí aláìgbàgbọ́ dípò ìdánimọ̀ ẹ̀yà.
theological_decisions:
- issue: Ìtumọ̀ ἐθνῶν nínú ìtakora Júù àti àwọn orílẹ̀-èdè
  choice: àwọn tí kì í ṣe Júù
  alternative: àwọn orílẹ̀-èdè
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ìyàtọ̀ láàárín Júù àti ẹni tí kì í ṣe Júù ni Pọ́ọ̀lù ń sọ. Ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́ láìsọ gbogbo wọn di aláìgbàgbọ́.
- issue: Ìsopọ̀ àwọn tí Ọlọ́run pè pẹ̀lú ohun tí a sọ ní ẹsẹ tó ṣáájú
  choice: àní àwa tí ó sì pè
  alternative: àwọn tí ó sì pè, àní àwa
  rationale: Ọ̀rọ̀ náà ṣì gbára lé ẹsẹ tó ṣáájú. Àtúmọ̀ yìí pa ìsopọ̀ àti ìtẹnumọ́ ‘àwa’ mọ́, láìyanjú àríyànjiyàn nípa ìyàn tàbí ìpè ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Àwọn tí kì í ṣe Júù’ ṣe kedere fún òǹkàwé òde òní, ó sì yẹra fún ìtumọ̀ ẹ̀sìn tí ‘Kèfèrí’ lè fà. Àmì gígùn ní òpin pa á mọ́ pé gbólóhùn náà ń tẹ̀ síwájú sínú ẹsẹ tó tẹ̀ lé e.
