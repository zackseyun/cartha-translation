id: ROM.9.5
reference: Romans 9:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: yo
  text: Àwọn baba ńlá náà jẹ́ tiwọn; Messia náà sì ti ọ̀dọ̀ wọn wá nípa ti ara[a]. Òun ni ẹni tí ó wà lórí ohun gbogbo, Ọlọ́run, ẹni tí a bù kún fún títí láéláé[b]. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ìran ènìyàn.” Ní tààrà, “nípa ti ara.”
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, bí a bá ka gbólóhùn ìkẹyìn sí ìyìn ọ̀tọ̀: “Kí a máa bù kún Ọlọ́run, ẹni tí ó wà lórí ohun gbogbo, títí láéláé. Àmín,” dípò kí ó jẹ́ àpèjúwe Messia.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: àwọn baba ńlá
  rationale: Ó tọ́ka sí àwọn baba ńlá Ísírẹ́lì tí a bọ̀wọ̀ fún nínú ìtàn májẹ̀mú; ó ṣe kedere sí òǹkàwé Yorùbá láì dín ọ̀rọ̀ náà kù sí àwọn baba ìpilẹ̀ kan ṣoṣo.
- source_word: ἐξ ὧν
  choice: láti ọ̀dọ̀ wọn
  rationale: Ó ń tọ́ka padà sí àwọn ọmọ Ísírẹ́lì, ó sì sọ orísun ìran Messia ní Yorùbá àdánidá.
- source_word: ὁ χριστός
  choice: Messia
  rationale: Níbí Χριστός jẹ́ oyè ẹni tí a fi àmì òróró yàn, tí ó sì so mọ́ àwọn àǹfààní Ísírẹ́lì; ‘Messia’ pa iṣẹ́ oyè náà mọ́.
- source_word: τὸ κατὰ σάρκα
  choice: nípa ti ara
  rationale: Ó pa àkànlò Gíríìkì mọ́ ní ṣókí, ó sì tọ́ka sí ìran ènìyàn tàbí ìbí nípa ti ara, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: Òun ni ẹni tí ó wà lórí ohun gbogbo
  rationale: Ó tẹ̀síwájú gẹ́gẹ́ bí àpèjúwe Messia, ó sì pa agbára articular participle náà mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: θεὸς εὐλογητὸς
  choice: Ọlọ́run tí a ń yin ín ní ìbùkún
  rationale: Ìtumọ̀ yìí mú ìdánimọ̀ ‘Ọlọ́run’ àti èrò εὐλογητός gẹ́gẹ́ bí ẹni tí ó yẹ fún ìyìn ìbùkún jáde ní Yorùbá àdánidá.
- source_word: εἰς τοὺς αἰῶνας
  choice: títí láéláé
  rationale: Èyí ni àfikún doxological Yorùbá tó wọ́pọ̀, tó bá ìtumọ̀ ‘fún gbogbo ayé’ mu.
- source_word: ἀμήν
  choice: Àmín
  rationale: A pa ọ̀rọ̀ ìjẹ́rìí ìjọsìn náà mọ́ ní fọ́ọ̀mù Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Bóyá gbólóhùn ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας ń bá a lọ láti ṣàpèjúwe Messia tàbí ó bẹ̀rẹ̀ ìyìn ọ̀tọ̀ sí Ọlọ́run
  choice: 'A ka gbólóhùn náà sí àpèjúwe Messia: ‘Òun ni ẹni tí ó wà lórí ohun gbogbo, Ọlọ́run tí a ń yin ín ní ìbùkún títí láéláé.’'
  alternative: 'A lè ka a sí ìyìn ọ̀tọ̀: ‘Kí Ọlọ́run, ẹni tí ó wà lórí ohun gbogbo, jẹ́ ẹni ìbùkún títí láéláé.’'
  rationale: Ìṣàn gírámà Gíríìkì, pàápàá ὁ ὢν tó tẹ̀ lé ὁ χριστός, rọrùn jù láti kà gẹ́gẹ́ bí àfikún sí Messia. Síbẹ̀, àwọn ìwé àfọwọ́kọ àkọ́kọ́ kò fi àmì ìkọ̀wé tó yanju ìpín gbólóhùn hàn, nítorí náà a pa ìtumọ̀ ìyìn ọ̀tọ̀ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọ̀wọ̀, òde òní, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. ‘Àwọn baba ńlá’ àti ‘nípa ti ara’ pa èdè ìtàn májẹ̀mú àti àkànlò Pọ́ọ̀lù mọ́, nígbà tí àlàyé ìsàlẹ̀ ń ṣàlàyé ìran ènìyàn àti àìdánilójú àmì ìkọ̀wé.
