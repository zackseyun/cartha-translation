id: ROM.9.23
reference: Romans 9:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: yo
  text: àti kí ó lè fi ìṣúra ògo rẹ̀ hàn sórí àwọn ohun èlò àánú, tí ó ti pèsè sílẹ̀ tẹ́lẹ̀ fún ògo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτον τῆς δόξης αὐτοῦ
  choice: ọrọ̀ ògo rẹ̀
  rationale: “Ọrọ̀” ṣe àfihàn ọ̀pọ̀ àti iye ńlá tí πλοῦτος ní, nígbà tí ó sì pa àkópọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ láì sọ ọ́ di ‘bí ògo rẹ̀ ti pọ̀ tó’ nìkan.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: sórí àwọn ohun èlò àánú
  rationale: “Sórí” tẹ̀ lé ìdarí ἐπί, “àwọn ohun èlò” sì pa àkàwé σκεύη mọ́. “Àánú” jẹ́ ìtumọ̀ ἐλέους láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: προητοίμασεν
  choice: ti pèsè sílẹ̀ tẹ́lẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí a ṣe ṣáájú hàn ní kedere, gẹ́gẹ́ bí προ- ṣe ń tọ́ka sí ìmúrasílẹ̀ ṣáájú.
- source_word: εἰς δόξαν
  choice: fún ògo
  rationale: “Fún” sọ ète tàbí ibi tí ìmúrasílẹ̀ náà ń tọ sí, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti gbé εἰς jáde ní àyíká yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ gírámà àti ìmọ̀ ẹ̀kọ́ láàárín ‘àwọn ohun èlò àánú’ àti ìmúrasílẹ̀ ṣáájú
  choice: tí ó ti pèsè sílẹ̀ tẹ́lẹ̀ fún ògo
  alternative: tí a ti pèsè sílẹ̀ tẹ́lẹ̀ fún ògo
  rationale: Gíríìkì ní ọ̀rọ̀-ìṣe aláṣe kan ṣoṣo, προητοίμασεν, ẹni tí ó ń ṣe é sì ń tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀. Nítorí náà, “ó” pa ìṣe Ọlọ́run mọ́, láì ṣàfikún bí ìmúrasílẹ̀ yẹn ṣe ń ṣiṣẹ́ tàbí yanjú ìforígbárí ẹ̀kọ́ inú àyíká náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn. A pa àkàwé ‘ohun èlò’ àti ọ̀rọ̀-ìṣàkóso ‘sórí’ mọ́ nítorí pé wọ́n ṣe pàtàkì sí ìrísí àti àìdánilójú tó wà nínú orísun. Kọ́mà ìparí fi hàn pé ẹsẹ yìí ń bá gbólóhùn gígùn inú àyíká rẹ̀ lọ.
