id: ROM.9.15
reference: Romans 9:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: yo
  text: Nítorí ó ń sọ fún Mósè pé, “Èmi yóò ṣàánú ẹni tí mo bá ṣàánú,[a] èmi yóò sì ní ìyọ́nú sí ẹni tí mo bá ní ìyọ́nú sí.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Èmi yóò ṣe àánú fún ẹni tí mo bá ṣe àánú fún, èmi yóò sì fi ìyọ́nú hàn sí ẹni tí mo bá fi ìyọ́nú hàn sí.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ àyọlò láti Eksodu 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: fún Mósè
  rationale: Ọ̀rọ̀ orúkọ náà wà ní dative gẹ́gẹ́ bí ẹni tí a ń bá sọ̀rọ̀; “sọ fún Mósè” ni ìtumọ̀ Yorùbá tó ṣe déédé.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé tí Pọ́ọ̀lù ń ṣe ṣáájú, ó sì pa ìbáṣepọ̀ ìjiyàn inú ọ̀rọ̀ náà mọ́.
- source_word: λέγει
  choice: ó sọ
  rationale: A pa àkókò ìsinsìnyí ti ọ̀nà ìtọ́kasí Ìwé Mímọ́ mọ́ ní ọ̀nà Yorùbá tó dùn mọ́ni. Arọ́pò-orúkọ náà tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀ Eksodu, láìfi orúkọ tí Gíríìkì kò sọ kún un.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: Èmi yóò ṣàánú … mo bá ṣàánú
  rationale: “Ṣàánú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi àánú hàn; àtúnṣe ọ̀rọ̀ náà pa ìbádọ́gba àti ìtẹnumọ́ Gíríìkì mọ́.
- source_word: ὃν ἂν
  choice: ẹni tí … bá
  rationale: Ìṣètò “ẹni tí … bá” fi ẹni tí a kò dá mọ́ pàtó hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún relative pronoun pẹ̀lú ἄν.
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: Èmi yóò ní ìyọ́nú sí … mo bá ní ìyọ́nú sí
  rationale: “Ní ìyọ́nú sí” pa ìyàtọ̀ kékeré mọ́ láàárín οἰκτίρω àti ἐλεέω, nígbà tí ó tún yẹra fún ọ̀rọ̀ tó lè dún bí ẹni pé a ń tẹ́ńbẹ́lú ẹlòmíràn. Àtúnṣe náà ṣe àfihàn parallelism orísun.
theological_decisions:
- issue: Ta ni ó ń sọ̀rọ̀ nínú ọ̀rọ̀ àyọlò náà?
  choice: Lo “ó sọ,” tí ó ń tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀.
  alternative: “Ìwé Mímọ́ sọ fún Mósè” tàbí fí “Ọlọ́run” kún un ní tààrà.
  rationale: Gíríìkì kò sọ subject ní gbangba, ṣùgbọ́n ọ̀rọ̀ tí a yọ láti Eksodu jẹ́ ọ̀rọ̀ Ọlọ́run sí Mósè. Arọ́pò-orúkọ pa àìsọ subject náà mọ́ láìsọ ọ̀rọ̀ náà di aláìlẹ́ni.
- issue: Òmìnira Ọlọ́run nínú àánú àti ìyọ́nú
  choice: 'Pa àtúnṣe líle náà mọ́: “ẹni tí mo bá ṣàánú … ẹni tí mo bá ní ìyọ́nú sí.”'
  alternative: Ṣàlàyé rẹ̀ sí “ẹnikẹ́ni tí mo bá yàn láti ṣàánú.”
  rationale: Ọ̀rọ̀ “yàn” kò sí nínú Gíríìkì. Ìtumọ̀ yìí pa ìfẹ̀hónúhàn àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́, kò sì pinnu àríyànjiyàn nípasẹ̀ àlàyé tí orísun kò sọ.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Lílo “Èmi” nínú gbólóhùn méjèèjì ń gbé ìtẹnumọ́ àti ìbádọ́gba ọ̀rọ̀ Ọlọ́run jáde; “ṣàánú” àti “ní ìyọ́nú sí” sì pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjì mọ́.
