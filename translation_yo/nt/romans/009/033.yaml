  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti àwọn àwòrán Gíríìkì dáadáa: ìlànà àyọlò Ìwé Mímọ́, ‘Wò ó,’ fífi òkúta àti àpáta sí Síónì, àti ìgbẹ́kẹ̀lé ẹni tí ó gbàgbọ́. ‘Àpáta ìṣubú’ jẹ́ ọ̀nà tí ó bójú mu láti pa σκάνδαλον mọ́ gẹ́gẹ́ bí ohun tí ń fa ìṣubú. Ṣùgbọ́n ‘dójú tì í’ lè túmọ̀ sí pé ẹni náà tijú ẹni/ohun tí ‘í’ tọ́ka sí, èyí tí ó yí ìtumọ̀ καταισχυνθήσεται padà. Ọ̀rọ̀ náà ní ìtumọ̀ ẹni tí a kì yóò mú dójú tì, kì í ṣe ẹni tí kì yóò tijú òkúta náà.'
  naturalness: ‘Gẹ́gẹ́ bí a ti kọ ọ́ pé,’ ‘Wò ó,’ àti ‘gbẹ́kẹ̀ lé e’ jẹ́ Yorùbá boṣewa, òde òní, tí ó sì yẹ fún àyọlò mímọ́. ‘Kì yóò dójú tì’ láì fi ‘í’ kún un jẹ́ kedere, ó sì jẹ́ ìsọ̀rọ̀ àdánidá.
