id: ROM.9.33
reference: Romans 9:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: yo
  text: 'Gẹ́gẹ́ bí a ti kọ ọ́ pé: “Wò ó, mo ń fi òkúta ìkọ̀sẹ̀ àti àpáta ìṣubú sílẹ̀ ní Síónì; ẹni tí ó bá sì gbẹ́kẹ̀ lé e[a], kì yóò dójú tì.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ sí ní tààràtà pé “gbàgbọ́ lé e.” Àwòrán òkúta náà lè mú kí a ka “e” sí ohun, ṣùgbọ́n àyíká ọ̀rọ̀ Pọ́ọ̀lù fi àwòrán náà kan Mèsáyà.
    reason: lexical_alternative
  - marker: c
    text: Níhìn-ín Pọ́ọ̀lù parapọ̀ Aísáyà 8:14 àti Aísáyà 28:16.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì ní iyì fún gbólóhùn tí a fi ń ṣáájú àyọlò Ìwé Mímọ́.
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ ìtọ́ka náà mọ́ ní èdè Yorùbá òde òní láì lo ọ̀rọ̀ àtijọ́ tí kò rọrùn.
- source_word: τίθημι
  choice: mo ń fi ... sílẹ̀
  rationale: Ó pa ìṣe àsìkò ìsinsìnyí mọ́, ó sì bá àwòrán fífi òkúta ilé sílẹ̀ mu.
- source_word: ἐν Σιὼν
  choice: ní Síónì
  rationale: Ó fi ibi tí ìṣe náà ti ṣẹlẹ̀ hàn ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: λίθον προσκόμματος
  choice: òkúta ìkọ̀sẹ̀
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀ náà àti àwòrán ohun tí ń mú ènìyàn kọsẹ̀ mọ́.
- source_word: πέτραν σκανδάλου
  choice: àpáta ìṣubú
  rationale: Ó yà á sọ́tọ̀ sí ‘òkúta ìkọ̀sẹ̀,’ ó sì sọ ipa σκάνδαλον gẹ́gẹ́ bí ohun tí ń fa ìṣubú ní kedere, láì dín àwòrán náà kù sí ìbínú nìkan.
- source_word: ὁ πιστεύων
  choice: ẹni tí ó bá ... gbẹ́kẹ̀ lé
  rationale: Ó mú ipa participle oníṣe náà jáde ní Yorùbá àdánidá, ó sì jẹ́ gbólóhùn àpapọ̀ tí kò fi akọ tàbí abo kún un.
- source_word: ἐπ’ αὐτῷ
  choice: gbẹ́kẹ̀ lé e
  rationale: ‘Gbẹ́kẹ̀ lé’ sọ ìgbàgbọ́ tí ó sinmi lé ẹni kan ní Yorùbá àdánidá, ó sì bá ìtumọ̀ gangan ‘lé e’ mu.
- source_word: οὐ καταισχυνθήσεται
  choice: a kì yóò dójú tì í
  rationale: Ó pa ọjọ́ iwájú àti ohùn àfaradà mọ́, ó sì fi èrò ìtìjú níwájú ènìyàn hàn dáadáa.
theological_decisions:
- issue: Ohun tàbí ẹni tí αὐτῷ ń tọ́ka sí nínú àyọlò àkópọ̀ Aísáyà
  choice: 'A túmọ̀ ọ́ ní ti ẹni: ‘lé e,’ níbi tí ‘e’ ti ń tọ́ka sí ẹni tí àwòrán òkúta/àpáta dúró fún.'
  alternative: A lè túmọ̀ ọ́ ní ti ohun, kí ó tọ́ka sí òkúta náà nìkan.
  rationale: Bí ó tilẹ̀ jẹ́ pé òkúta ni ohun tí ọ̀rọ̀ àwòrán náà mẹ́nu kàn, ọ̀rọ̀ Gíríìkì αὐτῷ jẹ́ akọ ẹyọ kan, àyíká Róòmù 9:32–33 àti 10:11 sì fi àyọlò náà kan Mèsáyà. Yorùbá ‘lé e’ pa ìṣòro ìtọ́kasí náà mọ́ ju lílo orúkọ arọ́pò ẹni tí ó ṣàlàyé rẹ̀ kọjá lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. ‘Wò ó’ jẹ́ ìpè ìfiyèsí tí ó ṣe kedere; ‘òkúta ìkọ̀sẹ̀’ àti ‘àpáta ìṣubú’ pa ìfararora àti ìyàtọ̀ àwọn àwòrán Gíríìkì méjèèjì mọ́. Gbólóhùn ‘gbẹ́kẹ̀ lé e’ jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ἐπί mọ́.
