  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: yo
  text: Ṣùgbọ́n Aísáyà ké jáde nípa Israẹli pé, “Bí iye àwọn ọmọ Israẹli tilẹ̀ jẹ́ bí iyanrìn òkun[b], àwọn tí ó ṣẹ́ kù ni a ó gbà là.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó dá nídè.” Ọ̀rọ̀ náà ń tẹnu mọ́ àsọtẹ́lẹ̀ Aísáyà nípa ìyókù tí a ó gbà là.
    reason: cross_reference
  - marker: b
    text: 'Tàbí, ní títúmọ̀ gbólóhùn Gíríìkì náà ní ọ̀nà gangan jù: “Bí iye àwọn ọmọ Israẹli bá jẹ́ bí iyanrìn òkun.” Ní àyíká yìí, ó ní ìtumọ̀ ìfàyègba.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tí ó ní ìtakora hàn nínú ìjiyàn Paulu, gẹ́gẹ́ bí ‘ṣùgbọ́n’ ṣe máa ń ṣe ní Yorùbá.
- source_word: κράζει
  choice: ké jáde
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe ìsinsìnyí mọ́, ó sì fi hàn pé Isaiah kéde ọ̀rọ̀ náà ní ohùn lílágbára.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: nípa Israẹli
  rationale: Nínú àyọlò ọ̀rọ̀ àsọtẹ́lẹ̀ yìí, gbólóhùn náà túmọ̀ sí ‘nípa’ tàbí ‘ní ti,’ kì í ṣe dandan ‘ní ipò’ Israẹli.
- source_word: Ἐὰν ᾖ
  choice: Bí ... tilẹ̀
  rationale: 'Ìkọ̀lé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìyọ̀ǹda hàn: bí iye náà tilẹ̀ pọ̀ tó, ìyókù nìkan ni a ó gbà là. Àlàyé ìsàlẹ̀ tún pa ìtumọ̀ àídájú gangan mọ́.'
- source_word: ὁ ἀριθμὸς
  choice: iye
  rationale: ‘Iye’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ‘nọ́ńbà/ìṣirò àwọn ènìyàn’ mu ní àyíká yìí.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: àwọn ọmọ Israẹli
  rationale: Ó pa àpèjúwe májẹ̀mú ìbílẹ̀ náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún àwọn ọmọ tàbí ìran Israẹli lápapọ̀.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: bí iyanrìn òkun
  rationale: Ó pa àfiwé Ìwé Mímọ́ tí a mọ̀ dáadáa mọ́ ní èdè Yorùbá àdánidá.
- source_word: τὸ ὑπόλειμμα
  choice: àwọn ìyókù nìkan
  rationale: Ó sọ ẹgbẹ́ kékeré tí ó ṣẹ́ kù di mímọ̀, ó sì mú àtakò pẹ̀lú iye ńlá tó wà ní apá àkọ́kọ́ hàn. ‘Nìkan’ jẹ́ ohun tí àyíká àti ìṣètò gbólóhùn Gíríìkì ń tẹnumọ́.
- source_word: σωθήσεται
  choice: ni a ó gbà là
  rationale: Ìsọ̀rọ̀ yìí pa ìwúwo ìgbàlà nínú àyíká Romu mọ́, nígbà tí ó ṣì lè ní ìtumọ̀ ìdáǹdè nínú àsọtẹ́lẹ̀ Isaiah.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn àídájú Ἐὰν ᾖ nínú àyọlò àsọtẹ́lẹ̀
  choice: 'A túmọ̀ ọ́ ní agbára ìyọ̀ǹda: “Bí iye ... tilẹ̀ pọ̀ ...”'
  alternative: A lè túmọ̀ ọ́ gangan sí “Bí iye ... bá pọ̀ ...”
  rationale: Kókó àyọlò náà ni ìtakora láàárín ọ̀pọ̀lọpọ̀ Israẹli àti àwọn ìyókù tí a ó gbà là. ‘Bí ... tilẹ̀’ sọ ìtumọ̀ yìí ní kedere láìfi ẹ̀kọ́ ìsìn kan kun ọ̀rọ̀ náà.
- issue: Ìtumọ̀ σωθήσεται
  choice: “a ó gbà là”
  alternative: “a ó dá nídè” tàbí “a ó pa mọ́”
  rationale: Nínú Romu 9–11, ‘gbà là’ pa ìwúwo ti ẹ̀kọ́ ìgbàlà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ ìdáǹdè nínú àsọtẹ́lẹ̀ ìpilẹ̀ ṣì hàn.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. A lo ‘àwọn ọmọ Israẹli’ gẹ́gẹ́ bí àpèjúwe májẹ̀mú àjọ; ‘ké jáde’ pa agbára κράζει mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
