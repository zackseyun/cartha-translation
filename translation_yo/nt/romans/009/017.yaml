id: ROM.9.17
reference: Romans 9:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: yo
  text: 'Nítorí Ìwé Mímọ́ sọ fún Fáráò pé, “Nítorí ète yìí gan-an ni mo ṣe gbé ọ dìde[a]: kí n lè fi agbára mi hàn nínú rẹ, àti kí a lè kéde orúkọ mi[b] ní gbogbo ayé.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “mo pa ọ́ mọ́” tàbí “mo mú ọ dúró.” Ọ̀rọ̀ náà lè ní ìtumọ̀ gbígbé ẹnì kan jáde sí ipò kan tàbí mímú un dúró fún ète kan.
    reason: lexical_alternative
  - marker: b
    text: “Orúkọ mi” túmọ̀ sí òkìkí àti bí Ọlọ́run ti fi ara rẹ̀ hàn, kì í ṣe orúkọ tí a fi ń pè é nìkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Ọ̀rọ̀ náà wà ní ẹyọ kan pẹ̀lú atọ́ka, a sì mú un bí ẹni tí ń sọ̀rọ̀, gẹ́gẹ́ bí Pọ́ọ̀lù ṣe lò ó.
- source_word: λέγει ... τῷ Φαραώ
  choice: sọ fún Fáráò
  rationale: A pa àsìkò ìsinsìnyí mọ́ gẹ́gẹ́ bí ọ̀nà tí Májẹ̀mú Tuntun fi sábà máa ń tọ́ka sí ọ̀rọ̀ Ìwé Mímọ́ tí ó ṣì ń sọ̀rọ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìbáṣepọ̀ àlàyé ẹsẹ yìí pẹ̀lú ọ̀rọ̀ tí ó ṣáájú hàn.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Nítorí ète yìí gan-an
  rationale: Ó pa ìtumọ̀ ète àti ìtẹnumọ́ inú gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἐξήγειρά σε
  choice: mo ṣe gbé ọ dìde
  rationale: Ó pa ààyè ìtumọ̀ gbígbé Fáráò jáde sí ipò yìí tàbí mímú un dúró fún ète náà mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó lé e lórí.
- source_word: ὅπως ἐνδείξωμαι
  choice: kí n lè fi ... hàn
  rationale: Ó fi ète iṣẹ́ náà àti fífi agbára Ọlọ́run hàn ní gbangba sọ́nà.
- source_word: ἐν σοὶ
  choice: nínú rẹ
  rationale: A pa àfihàn ἐν mọ́, kí ó lè tọ́ka sí agbára tí a fi hàn nínú ọ̀ràn àti ẹni Fáráò, dípò yíyí i sí ‘nípasẹ̀ rẹ’.
- source_word: τὴν δύναμίν μου
  choice: agbára mi
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá δύναμις mu ní àyíká yìí.
- source_word: καὶ ὅπως διαγγελῇ
  choice: àti kí a lè kéde
  rationale: Ìṣètò yìí pa ìṣe aláìlórúkọ àti ète ìkéde gbangba mọ́.
- source_word: τὸ ὄνομά μου
  choice: orúkọ mi
  rationale: A pa àwòrán Bíbélì mọ́; ‘orúkọ’ níhìn-ín ju àmì ìpè lasán lọ, ó kan òkìkí Ọlọ́run tí a fi hàn.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: ní gbogbo ayé
  rationale: ‘Gbogbo ayé’ jẹ́ Yorùbá àdánidá tí ó fi ìwọ̀n àgbáyé inú ọ̀rọ̀ náà hàn, dípò dídín γῆ kù sí ilẹ̀ kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ἐξήγειρά σε nípa Fáráò àti ọba aláṣẹ Ọlọ́run
  choice: mo ṣe gbé ọ dìde
  alternative: mo pa ọ́ mọ́ / mo mú ọ dúró
  rationale: A yan ọ̀rọ̀ tí ó ní agbára gbígbé Fáráò jáde sí ipò rẹ̀ tàbí mímú un dúró fún ète Ọlọ́run. A kò dín un kù sí ìṣẹ̀dá rẹ̀, àjíǹde, tàbí pípa á mọ́ láàyè nìkan, kí ìforígbárí tó wà láàárín ọba aláṣẹ Ọlọ́run àti ojúṣe ènìyàn lè dúró.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó yẹ, a sì pa ìtẹnumọ́, ète, àti àìdánilójú gidi inú ọ̀rọ̀ orísun mọ́.
