source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, ἐρρέθη αὐτῇ ὅτι Ὁ μείζων δουλεύσει τῷ ἐλάσσονι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: yo
  text: kì í ṣe nítorí àwọn iṣẹ́, bí kò ṣe nítorí Ẹni tí ń pè, a sọ fún un pé, “Ẹ̀gbọ́n yóò sin àbúrò.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í ṣe lórí ìpìlẹ̀ àwọn iṣẹ́, bí kò ṣe lórí ìpìlẹ̀ Ẹni tí ń pè.”
    reason: lexical_alternative
  - marker: b
    text: Àyọlò láti Jẹ́nẹ́sísì 25:23.
    reason: cross_reference
  - marker: c
    text: Tàbí, “Ẹni títóbi jù yóò sin ẹni tí ó kéré jù.” Àyíká Jékọ́bù àti Ẹ́sáù ló mú kí a túmọ̀ wọn sí “ẹ̀gbọ́n” àti “àbúrò.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: kì í ṣe láti inú àwọn iṣẹ́
  rationale: 'Ọ̀rọ̀ náà pa ìyàtọ̀ ṣókí tí Pọ́ọ̀lù ṣe mọ́: kì í ṣe pé àwọn iṣẹ́ ni orísun tàbí ìpìlẹ̀ rẹ̀. ‘Láti inú’ ṣe àfihàn ἐκ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.'
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: bí kò ṣe láti ọ̀dọ̀ Ẹni tí ń pè
  rationale: Ọ̀rọ̀ apá-ìṣe olókìkí náà dúró gẹ́gẹ́ bí orúkọ fún Ọlọ́run. ‘Tí ń pè’ pa ìṣe tó ń lọ nínú present participle mọ́, ‘Ẹni’ sì jẹ́ ìtọ́kasí ọlọ́wọ̀ sí Ọlọ́run láì fi orúkọ tí Gíríìkì kò sọ kún un.
- source_word: ἐρρέθη αὐτῇ
  choice: a sọ fún un
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa passive tí kò dárúkọ olùsọ mọ́; kò fi ẹni tí ó sọ ọ̀rọ̀ náà kún ẹsẹ̀.
- source_word: ὅτι
  choice: pé, “…”
  rationale: ὅτι ń ṣí ọ̀rọ̀ tààrà sílẹ̀ níbí; ‘pé’ pẹ̀lú àmì ọ̀rọ̀ àyọlò jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere.
- source_word: Ὁ μείζων
  choice: Ẹ̀gbọ́n
  rationale: Nínú àyíká Jékọ́bù àti Ẹ́sáù, ẹni tí ó dàgbà jù ní ọjọ́ orí ni a ń tọ́ka sí. ‘Ẹ̀gbọ́n’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lè túmọ̀ sí ‘ẹni títóbi jù.’
- source_word: δουλεύσει
  choice: ni yóò máa sin
  rationale: ‘Máa sin’ sọ ìbáṣepọ̀ ìtẹríba tí δουλεύω ní nínú àyọlò Jẹ́nẹ́sísì, láì fi ìtumọ̀ ẹrú gidi lé e lórí ju ohun tí àyíká ń béèrè lọ.
- source_word: τῷ ἐλάσσονι
  choice: àbúrò
  rationale: Nínú àyíká àwọn arákùnrin méjì náà, ‘àbúrò’ bá ‘ẹ̀gbọ́n’ mu dáadáa, ó sì ṣe kedere ju ‘ẹni tí ó kéré jù’ lọ.
theological_decisions:
- issue: Bóyá kí a mú ‘kì í ṣe láti inú àwọn iṣẹ́, bí kò ṣe láti ọ̀dọ̀ Ẹni tí ń pè’ gbòòrò láti sọ ẹ̀kọ́ ìyàn àìnídìí ní pàtó
  choice: A pa ìyàtọ̀ ṣókí inú Gíríìkì mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: kì í ṣe nítorí àwọn iṣẹ́, bí kò ṣe nítorí Ọlọ́run tí ń pè
  rationale: Ẹsẹ̀ náà fi iṣẹ́ àti Ẹni tí ń pè wéra, ṣùgbọ́n kò yẹ kí ìtumọ̀ fi ìpinnu ẹ̀kọ́ ẹgbẹ́ kan sínú ọ̀rọ̀ tó ṣókí yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́wọ̀, àdánidá. A lo ‘ẹ̀gbọ́n/àbúrò’ fún ìtumọ̀ tó ṣe kedere nínú àyíká, a sì fi ìtumọ̀ gbooro ‘títóbi/kéré’ sínú àlàyé ìsàlẹ̀.
