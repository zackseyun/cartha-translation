  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìyàtọ̀ Gíríìkì náà mọ́: kì í ṣe ní ìpìlẹ̀ iṣẹ́, ṣùgbọ́n ní ìpìlẹ̀ Ẹni tí ń pè; ó sì tọ́ka sí ọ̀rọ̀ tí a sọ fún Rebeka. ‘Ẹ̀gbọ́n/àbúrò’ jẹ́ ìtumọ̀ tó yẹ nínú àyíká Jékọ́bù àti Ẹ́sáù. Síbẹ̀, ‘yóò máa sin’ lè fi ìṣe àṣà-tí-ń-tẹ̀síwájú kún ọjọ́ iwájú Gíríìkì δουλεύσει, nítorí náà ‘yóò sin’ sún mọ́ ọ̀rọ̀ ìpilẹ̀ ju.'
  naturalness: ‘Láti inú àwọn iṣẹ́’ àti ‘láti ọ̀dọ̀ Ẹni tí ń pè’ lè lóye, ṣùgbọ́n wọn kì í dára jù lọ gẹ́gẹ́ bí ìṣọ̀kan ìdí/ìpìlẹ̀ nínú Yorùbá òde òní. ‘Nítorí àwọn iṣẹ́ ... nítorí Ẹni tí ń pè’ jẹ́ adayeba, ṣókí, ó sì bá ìjiyàn Pọ́ọ̀lù mu. ‘A sọ fún un pé’ jẹ́ ìsọ̀rọ̀ Yorùbá tí ó bójú mu fún passive aláìsọ ẹni tó sọ.
  terminology: A pa ‘Ẹni tí ń pè’ mọ́ gẹ́gẹ́ bí ìtọ́kasí ọlọ́wọ̀ sí Ọlọ́run láì fi orúkọ kan kún un. ‘Ẹ̀gbọ́n’ àti ‘àbúrò’ jẹ́ ọ̀rọ̀ Yorùbá tí ó dára fún ìyàtọ̀ ọjọ́ orí nínú àyíká yìí. Àlàyé ìsàlẹ̀ c ń pa aṣàyàn gbooro ‘títóbi/kéré’ mọ́.
