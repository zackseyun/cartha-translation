    rationale: ἐκ nínú ọ̀rọ̀ méjèèjì ń samisi ìpìlẹ̀ tàbí orísun ìdí; ‘nítorí’ ń ṣe ìfiwéra Yorùbá tó dára jù níbí, láì mú ẹ̀kọ́ ìsìn gbooro.
