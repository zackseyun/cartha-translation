- from: Àti gẹ́gẹ́ bí Aísáyà ti sọ tẹ́lẹ̀ pé, “Ká ní Olúwa àwọn ọmọ ogun[a] kò fi irú-ọmọ kan sílẹ̀ fún wa[b][c], àwa ìbá ti dà bí Sódómù, a sì ìbá ti sọ wá dà bí Gòmórà.”
