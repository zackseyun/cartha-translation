id: ROM.9.29
reference: Romans 9:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: yo
  text: Bẹ́ẹ̀ sì ni, gẹ́gẹ́ bí Aísáyà ti sọ tẹ́lẹ̀ pé, “Bí Olúwa àwọn ọmọ ogun[a] kò bá fi irú-ọmọ kan sílẹ̀ fún wa[b], àwa ìbá ti dà bí Sódómù, a sì ìbá ti fi wa wé Gòmórà.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Olúwa Sábáótì.” Ọ̀rọ̀ Gíríìkì Σαβαώθ jẹ́ ìkọ-ohùn oyè Ọlọ́run kan ní èdè Hébérù, tí a sábà máa ń túmọ̀ sí “àwọn ọmọ ogun” tàbí “àwọn ẹgbẹ́ ogun.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “irúgbìn.” Níhìn-ín, ó ń tọ́ka sí irú-ọmọ tàbí ìran tí ó ṣẹ́ kù.
    reason: lexical_alternative
  - marker: c
    text: Àyọlò láti inú Aísáyà 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: Àti gẹ́gẹ́ bí
  rationale: Ó pa ìsopọ̀ àti ìfiwéra mọ́ pẹ̀lú ohun tí ó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: προείρηκεν
  choice: ti sọ tẹ́lẹ̀
  rationale: Ó fi hàn pé Aísáyà ti sọ ọ̀rọ̀ náà ṣáájú, tí ọ̀rọ̀ náà sì ṣì ṣe pàtàkì; kò túmọ̀ ọ́ ní pàtó sí àsọtẹ́lẹ̀.
- source_word: κύριος Σαβαὼθ
  choice: Olúwa àwọn ọmọ ogun
  rationale: Σαβαώθ jẹ́ àkọsílẹ̀ ohùn orúkọ oyè Hébérù kan; ‘àwọn ọmọ ogun’ ń mú ìtumọ̀ oyè náà jáde ní Yorùbá.
- source_word: ἐγκατέλιπεν
  choice: fi ... sílẹ̀ fún wa
  rationale: Ó tẹ̀lé ìtumọ̀ fífi ohun kan sílẹ̀ tàbí jíjẹ́ kí ó ṣẹ́ kù láìfi ‘àṣẹ́kù’ sínú ọ̀rọ̀ náà.
- source_word: σπέρμα
  choice: irú-ọmọ kan
  rationale: Ní ti gidi, ọ̀rọ̀ náà túmọ̀ sí ‘irúgbìn,’ ṣùgbọ́n níbí ó tọ́ka sí àwọn ọmọ tàbí ìran tí ó ṣẹ́ kù; ‘irú-ọmọ’ pa àwòrán ọ̀rọ̀ náà mọ́.
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: àwa ìbá ti dà bí Sódómù
  rationale: Ó mú ipò tí kò ṣẹlẹ̀ ní ti gidi àti ìṣe γίνομαι, ‘dà,’ jáde lọ́nà Yorùbá àdánidá.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: a sì ìbá ti sọ wá dà bí Gòmórà
  rationale: Ìlò ọ̀rọ̀ àìṣe taara náà pa ìyàtọ̀ ὁμοιόω mọ́ sí ìṣe ‘sọ di bí,’ dípò kí a mú un dọ́gba pátápátá pẹ̀lú ‘dà’ tó ṣáájú.
theological_decisions:
- issue: Bí a ṣe yẹ kí a túmọ̀ oyè Ọlọ́run κύριος Σαβαώθ nínú àyọlò Májẹ̀mú Láéláé
  choice: Olúwa àwọn ọmọ ogun
  alternative: Olúwa Sábáótì; Olúwa àwọn ọ̀wọ́ ogun
  rationale: Ọ̀rọ̀ Gíríìkì náà lo κύριος pẹ̀lú àkọsílẹ̀ ohùn oyè Hébérù. Títúmọ̀ oyè náà ń jẹ́ kí ìtumọ̀ rẹ̀ yé òǹkàwé láìfi àlàyé ẹ̀kọ́ ìjọ kan kún un.
- issue: Bóyá kí σπέρμα di ọ̀rọ̀ ẹ̀kọ́ ‘àṣẹ́kù’
  choice: irú-ọmọ kan
  alternative: irúgbìn; àwọn ọmọ; àṣẹ́kù
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń sọ nípa àwọn tó ṣẹ́ kù, σπέρμα fúnra rẹ̀ jẹ́ ‘irúgbìn/irú-ọmọ.’ Yíyan ‘irú-ọmọ’ kò fi ọ̀rọ̀ ẹ̀kọ́ tí kò sí nínú gbólóhùn náà rọ́pò rẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìṣọ̀kan ọ̀rọ̀ ìwé mímọ́ àti ìyàtọ̀ àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì mọ́, láìjẹ́ kí gbólóhùn náà di líle fún òǹkàwé lasán.
