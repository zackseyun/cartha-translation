    rationale: Gbólóhùn náà kò rọrùn ní Yorùbá, ó sì lè dà bí ẹni pé ‘a’ kan tí a kò dárúkọ ni olùṣe. ‘Fi wa wé’ ń mú passive ὡμοιώθημεν jáde kedere.
