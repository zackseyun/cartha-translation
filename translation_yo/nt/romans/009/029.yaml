  source_fidelity: Ìtumọ̀ náà mú ìbáṣepọ̀ ìṣàpẹẹrẹ, ipò àfojúrí tí kò ṣẹlẹ̀, àti ìyàtọ̀ láàárín ‘di’ (ἐγενήθημεν) àti ìṣe passive ‘fi wé’ (ὡμοιώθημεν) jáde. Síbẹ̀, ‘Ká ní’ kì í sọ èyí tí εἰ μή (‘bí ... kò bá’) ní kedere tó, àti ‘a sì ìbá ti sọ wá dà’ kò dá ìṣe passive náà dúró ní Yorùbá àdánidá.
  naturalness: ‘Bí Olúwa ... kò bá fi ... sílẹ̀ fún wa’ jẹ́ gbolóhùn Yorùbá tó mọ́gbọ́n dání fún ìpò àfojúrí. ‘A sì ìbá ti fi wa wé Gòmórà’ jẹ́ ọ̀nà àdánidá láti sọ ‘we would have been likened to Gomorrah.’
  terminology: ‘Olúwa àwọn ọmọ ogun’ àti ‘irú-ọmọ’ yẹ, wọ́n sì pa oyè Σαβαώθ àti àwòrán σπέρμα mọ́. A tún ṣàtúnṣe àlàyé akọsílẹ̀ a kí ó sọ ìkọ-ohùn Hébérù náà ní Yorùbá tó yéni.
