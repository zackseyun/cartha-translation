  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: yo
  text: Kí nìdí? Nítorí pé kì í ṣe láti inú ìgbàgbọ́[a], bí kò ṣe bí ẹni pé láti inú àwọn iṣẹ́[b]. Wọ́n kọsẹ̀ sí òkúta ìkọsẹ̀[d][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘kì í ṣe nípa ìgbàgbọ́’ tàbí ‘kì í ṣe lórí ìpìlẹ̀ ìgbàgbọ́.’ Gíríìkì sọ ní tààràtà pé ‘kì í ṣe láti inú ìgbàgbọ́.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘bí ẹni pé ó wá láti inú àwọn iṣẹ́.’ Ọ̀rọ̀ náà pa ìtumọ̀ ‘bí ẹni pé’ mọ́.
    reason: lexical_alternative
  - marker: c
    text: Èyí ń tọ́ka sí Aísáyà 8:14; tún fi wé Aísáyà 28:16 nínú ẹsẹ tó tẹ̀ lé e.
    reason: cross_reference
  - marker: d
    text: A tún lè túmọ̀ rẹ̀ sí ‘òkúta ìdènà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: Nítorí kí ni?
  rationale: Ọ̀rọ̀ ìbéèrè yìí pa agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti béèrè ìdí.
- source_word: οὐκ ἐκ πίστεως
  choice: kì í ṣe láti inú ìgbàgbọ́
  rationale: Ó pa ìtumọ̀ ἐκ, ‘láti inú,’ mọ́, nígbà tí ‘ìgbàgbọ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó yẹ fún πίστις ní àyíká yìí.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: bí kò ṣe bí ẹni pé láti inú àwọn iṣẹ́
  rationale: ‘Bí ẹni pé’ pa ìṣọ́ra ὡς mọ́, kó má bàa túmọ̀ rẹ̀ sí ‘nípa iṣẹ́’ lásán; ‘àwọn iṣẹ́’ sì bá ọ̀rọ̀ Pọ́ọ̀lù mu.
- source_word: προσέκοψαν
  choice: Wọ́n kọsẹ̀ lára
  rationale: Ó fi àwòrán gidi ti fífi ẹsẹ̀ kọ ohun ìdènà hàn ní Yorùbá àdánidá.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: òkúta ìkọsẹ̀
  rationale: Ó jẹ́ gbólóhùn ṣókí tí ó pa ìbáṣepọ̀ ọ̀rọ̀ láàárín ‘kọsẹ̀’ àti ‘ìkọsẹ̀’ mọ́, ó sì tọ́ka sí àwòrán Aísáyà.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ìyàtọ̀ láàárín ìgbàgbọ́ àti iṣẹ́
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú àyíká Róòmù 9:32, Pọ́ọ̀lù ń fi ìgbàgbọ́ àti iṣẹ́ wéra gẹ́gẹ́ bí ohun tí a fi lépa òdodo; ‘ìgbàgbọ́’ pa ọ̀rọ̀ ẹ̀kọ́ rẹ̀ mọ́ láìfi ìtumọ̀ àfikún kan lé e lórí.
- issue: Agbára ὡς nínú ‘ὡς ἐξ ἔργων’
  choice: bí ẹni pé láti inú àwọn iṣẹ́
  alternative: láti inú àwọn iṣẹ́; nípa àwọn iṣẹ́
  rationale: Yíyan ‘bí ẹni pé’ pa àìdájú tàbí ìfiwéra tí ὡς mú wá mọ́, dípò kí a sọ pé iṣẹ́ ni ìpìlẹ̀ náà ní tààràtà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán òkúta àti ìkọsẹ̀ mọ́, bẹ́ẹ̀ ni a kò yanjú ὡς tàbí πίστις kọjá ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ.
