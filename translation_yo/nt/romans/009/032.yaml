  to: Kí nìdí? Nítorí pé kì í ṣe láti inú ìgbàgbọ́[a], bí kò ṣe bí ẹni pé láti inú àwọn iṣẹ́[b]. Wọ́n kọsẹ̀ sí òkúta ìkọsẹ̀[d][c].
