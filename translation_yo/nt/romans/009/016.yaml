  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: yo
  text: Nítorí náà[a], èyí kò dá lórí ẹni tí ó fẹ́, tàbí ẹni tí ó ń sáré[b], bí kò ṣe Ọlọ́run tí ń ṣàánú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Nítorí náà, kì í ṣe ti ẹni tí ó fẹ́, bẹ́ẹ̀ ni kì í ṣe ti ẹni tí ó ń sáré, bí kò ṣe ti Ọlọ́run tí ń ṣàánú.” Gbólóhùn Gíríìkì kò sọ kókó tí a ń sọ̀rọ̀ nípa rẹ̀ ní gbangba; àyíká ọ̀rọ̀ nípa ète àti àánú Ọlọ́run ló ń pèsè rẹ̀.'
    reason: lexical_alternative
  - marker: b
    text: “Ń sáré” lè jẹ́ àkàwé fún ìsapá tàbí ìtiraka ènìyàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì túmọ̀ sí “ń sáré” ní tààrà.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Àwọn ọ̀rọ̀ ìparí méjèèjì yìí fi hàn pé Pọ́ọ̀lù ń fa àbájáde láti inú ohun tí ó ṣẹ̀ṣẹ̀ sọ; “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìtumọ̀ náà mọ́.
- source_word: οὐ ... οὐδὲ
  choice: kò ... tàbí
  rationale: Ìṣètò “kò ... tàbí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé kì í ṣe èyí àkọ́kọ́, bẹ́ẹ̀ ni kì í ṣe èkejì.
- source_word: τοῦ θέλοντος
  choice: ẹni tí ó fẹ́
  rationale: Ó pa ìtumọ̀ ìfẹ́ inú tàbí ìpinnu ẹni mọ́, láìfi ẹ̀kọ́ ìsìn kan kún un.
- source_word: τοῦ τρέχοντος
  choice: ẹni tí ó ń sáré
  rationale: A pa àwòrán gidi ti τρέχω, “sáré,” mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè tọ́ka sí ìsapá ènìyàn.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: 'Ó fi ìyàtọ̀ líle hàn ní Yorùbá àdánidá: kì í ṣe ti ènìyàn, bí kò ṣe ti Ọlọ́run.'
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: Ọlọ́run tí ń ṣàánú
  rationale: Ó pa ìṣe aláìgbédè ti participle náà mọ́, ó sì ṣàfihàn Ọlọ́run gẹ́gẹ́ bí ẹni tí ń ṣe àánú.
- source_word: implied predicate/expression
  choice: kò sinmi lé
  rationale: Gíríìkì kò sọ kókó tàbí ọ̀rọ̀-ìṣe tí gbólóhùn náà sinmi lé ní kíkún. “Kò sinmi lé” mú un yé ni Yorùbá láìdín ìtọ́kasí rẹ̀ kù sí ìgbàlà tàbí ìyànfẹ́ nìkan.
theological_decisions:
- issue: Kókó tí a kò sọ ní gbangba àti ohun tí gbólóhùn náà ń tọ́ka sí
  choice: Lo ọ̀rọ̀ àìsọ-kókó pàtó, “kò sinmi lé,” láìdárúkọ ìgbàlà, ìyànfẹ́, tàbí ìpinnu Ọlọ́run nínú ẹsẹ̀ pàtàkì.
  alternative: “Nítorí náà, ìgbàlà kò sinmi lé ìfẹ́ tàbí ìsapá ènìyàn” tàbí “ìyànfẹ́ Ọlọ́run kò sinmi lé ẹni tí ó fẹ́ tàbí ẹni tí ó ń sáré.”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ aláìpé ní ìṣètò rẹ̀, àyíká sì ń sọ̀rọ̀ nípa ète àti àánú Ọlọ́run. Yíyan ọ̀rọ̀ gbogbogbò yìí pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìsìn inú ọ̀rọ̀ náà mọ́, láìfi ìtumọ̀ ẹ̀ya ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àwòrán “sáré” àti àìpé ìṣètò Gíríìkì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
