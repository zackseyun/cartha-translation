id: ROM.10.8
reference: Romans 10:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: yo
  text: Ṣùgbọ́n kí ni ó wí? “Ọ̀rọ̀ náà wà nítòsí rẹ, ní ẹnu rẹ àti ní ọkàn rẹ.”[a] Ìyẹn ni ọ̀rọ̀ ìgbàgbọ́[b] tí àwa ń kéde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọ́ọ̀lù ń tọ́ka sí Deuteronomi 30:14, ó sì ń lo èdè rẹ̀ fún ọ̀rọ̀ ìgbàgbọ́ tí a ń kéde.
    reason: cross_reference
  - marker: b
    text: A tún lè túmọ̀ “ọ̀rọ̀ ìgbàgbọ́” sí “ìhìn nípa ìgbàgbọ́.” Nínú àwọn àyíká kan, πίστις tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé” tàbí “ìṣòtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀rọ̀ tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìbéèrè náà ní Yorùbá.
- source_word: τί λέγει
  choice: kí ni ó wí?
  rationale: A pa ẹni tàbí ohun tí ó ń sọ̀rọ̀ mọ́ ní àìsọ pàtó bí Gíríìkì, dípò fífi ‘Ìwé Mímọ́’ kún un ní àlàyé.
- source_word: Ἐγγύς σου
  choice: sún mọ́ ọ
  rationale: Ó mú ìtumọ̀ pé ohun náà wà nítòsí ẹni jáde ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: τὸ ῥῆμά
  choice: Ọ̀rọ̀ náà
  rationale: ‘Ọ̀rọ̀’ lè túmọ̀ sí ọ̀rọ̀ tí a sọ tàbí iṣẹ́ ìránṣẹ́, ó sì pa ìsopọ̀ mọ́ ìlò kejì ti ῥῆμα.
- source_word: ἐν τῷ στόματί σου
  choice: ó wà ní ẹnu rẹ
  rationale: Ó pa àwòrán ara tí orísun lò mọ́, ó sì ṣe kedere ní Yorùbá.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: ní ọkàn rẹ
  rationale: ‘Ọkàn’ ni ìtumọ̀ àdánidá fún καρδία, ó sì pa èrò inú àti ìfaramọ́ ẹni mọ́.
- source_word: τοῦτ’ ἔστιν
  choice: èyí ni
  rationale: Ó ń ṣàlàyé ohun tí ọ̀rọ̀ àyọlò náà ń tọ́ka sí láìfi ìtumọ̀ míràn kún un.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: ọ̀rọ̀ ìgbàgbọ́
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ ῥῆμα méjèèjì mọ́, ó sì fi ìbáṣepọ̀ genitive náà sílẹ̀ ní ṣókí láìyanju gbogbo àìdánilójú rẹ̀.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ àkọ́kọ́ tó bá ọ̀rọ̀ Pọ́ọ̀lù mu níbí; ‘ìgbẹ́kẹ̀lé’ tàbí ‘ìṣòtítọ́’ lè jẹ́ yíyàn ní àwọn àyíká míràn.
- source_word: ὃ κηρύσσομεν
  choice: tí àwa ń kéde
  rationale: ‘Ń kéde’ mú èrò ìpolongo ní gbangba ti κηρύσσω jáde; lílo ‘àwa’ fi ìtẹnumọ́ tí ó ṣeé ṣe nínú fáwẹ́lì ọ̀rọ̀-ìṣe Gíríìkì hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú τὸ ῥῆμα τῆς πίστεως
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Ní àyíká yìí, Pọ́ọ̀lù ń sọ̀rọ̀ nípa iṣẹ́ ìránṣẹ́ tí a ń kéde, tí ó ní ìbáṣepọ̀ pẹ̀lú ìgbàgbọ́. ‘Ìgbàgbọ́’ pa ìlò Pọ́ọ̀lù tó wọ́pọ̀ mọ́ láìfi ẹ̀kọ́ ìjọ kan pàtó sínú rẹ̀.
- issue: Ìbáṣepọ̀ àyọlò Deuteronomi 30:14 pẹ̀lú ìhìn rere
  choice: A pa ọ̀rọ̀ àyọlò náà mọ́, lẹ́yìn náà a jẹ́ kí àlàyé Pọ́ọ̀lù ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘ọ̀rọ̀ ìgbàgbọ́.’
  alternative: Túmọ̀ àyọlò náà taara gẹ́gẹ́ bí ‘ìhìn rere’
  rationale: 'Ọ̀nà yìí pa ìṣòro àti ìlọsíwájú èrò inú ẹsẹ náà mọ́: àkọ́kọ́ ni àyọlò, lẹ́yìn náà ni ìlò Pọ́ọ̀lù sí iṣẹ́ ìránṣẹ́ tí wọ́n ń kéde.'
translation_notes:
  register: Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. A pa àwòrán ‘ẹnu’ àti ‘ọkàn’ mọ́, a sì yà àyọlò síta pẹ̀lú àmì àsọyé.
