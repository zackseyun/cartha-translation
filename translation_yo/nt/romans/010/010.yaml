id: ROM.10.10
reference: Romans 10:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: yo
  text: Nítorí pé ọkàn ni a fi ń gbàgbọ́ sí òdodo[a], ẹnu sì ni a fi ń jẹ́wọ́ sí ìgbàlà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘sí ìṣe ìdájọ́ òdodo.’ Ọ̀rọ̀ Gíríìkì δικαιοσύνη tún lè tọ́ka sí ìdájọ́ òdodo, bí ó tilẹ̀ jẹ́ pé ‘òdodo’ ni ìtumọ̀ àkọ́kọ́ rẹ̀ nínú àwọn ìwé Paulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: ọkàn ni a fi
  rationale: Dátífù náà ń tọ́ka sí ohun inú ènìyàn tí a fi ń gbàgbọ́. Èdè yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìfarajọ rẹ̀ mọ́ pẹ̀lú ‘ẹnu ni a fi’.
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé, láì fi ìtumọ̀ tí ó pọ̀ ju ti Gíríìkì lọ kún un.
- source_word: πιστεύεται
  choice: a fi ń gbàgbọ́
  rationale: Fọ́ọ̀mù ọ̀rọ̀-ìṣe náà ní agbára gbólóhùn gbogbogbò. Arọ́pò-orúkọ ‘a’ sọ èrò yìí ní Yorùbá àdánidá láì sọ ẹni pàtó.
- source_word: εἰς δικαιοσύνην
  choice: sí òdodo
  rationale: ‘Sí’ pa ìtọ́sọ́nà tàbí àbájáde tí εἰς lè ní mọ́, nígbà tí ‘òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tó gbooro fún δικαιοσύνη láì dín un kù sí apá kan ṣoṣo.
- source_word: στόματι
  choice: ẹnu ni a fi
  rationale: Ó fi ẹnu hàn gẹ́gẹ́ bí ohun èlò ìjẹ́wọ́, ó sì dá ìfarajọ inú/òde pẹ̀lú ọkàn dúró.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ fi ìtẹ̀síwájú àti ìyàtọ̀ díẹ̀ láàárín gbígbàgbọ́ inú àti ìjẹ́wọ́ gbangba hàn, láì sọ pé àwọn méjèèjì ń tako ara wọn.
- source_word: ὁμολογεῖται
  choice: a fi ń jẹ́wọ́
  rationale: Nínú àyíká ẹsẹ 9, ‘jẹ́wọ́’ bá ìpolongo tàbí ìfẹnukò gbangba pé Jésù ni Olúwa mu. ‘A’ tún pa agbára gbogbogbò ti fọ́ọ̀mù Gíríìkì mọ́.
- source_word: εἰς σωτηρίαν
  choice: sí ìgbàlà
  rationale: Ó pa ìfarajọ ọ̀rọ̀ mọ́ pẹ̀lú ‘sí òdodo,’ ó sì fi ibi tí ìjẹ́wọ́ ń tọ sí tàbí àbájáde rẹ̀ hàn láì ṣàlàyé rẹ̀ rékọjá.
- source_word: σωτηρίαν
  choice: ìgbàlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún σωτηρία nínú àyíká ẹ̀kọ́ Paulu, ó sì lè gba ìgbàlà ìsinsìnyí àti ti ọjọ́ iwájú.
theological_decisions:
- issue: Ìbáṣepọ̀ gbígbàgbọ́ àti ìjẹ́wọ́ sí òdodo àti ìgbàlà
  choice: 'A túmọ̀ àwọn gbólóhùn méjèèjì ní ìfarajọ tààrà: a fi ọkàn gbàgbọ́ sí òdodo, a sì fi ẹnu jẹ́wọ́ sí ìgbàlà.'
  alternative: Kí a sọ ìjẹ́wọ́ di ẹ̀rí lásán ti ìgbàlà, tàbí kí a sọ ọ́ di iṣẹ́ àfikún tí ènìyàn fi ń jèrè ìgbàlà.
  rationale: Gíríìkì fi àwọn gbólóhùn méjèèjì sí ìfarajọ pẹ̀lú εἰς. Ìtumọ̀ náà kò pinnu bí ìjẹ́wọ́ àti gbígbàgbọ́ ṣe tẹ̀ lé ara wọn nínú ètò ìgbàlà, bẹ́ẹ̀ ni kò sọ ìjẹ́wọ́ di iṣẹ́ ẹ̀tọ́.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti ti òde òní ni a lò. Àtúnṣe ‘ọkàn ni a fi … ẹnu sì ni a fi’ jẹ́ àdánidá fún olùkà Yorùbá, ó sì pa ìfarajọ inú àti òde ti Gíríìkì mọ́. A fi àmì ohùn sí ibi tí ó yẹ.
