id: ROM.10.17
reference: Romans 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: yo
  text: Nítorí náà, ìgbàgbọ́ ń wá láti inú ìgbọ́, ìgbọ́ náà sì jẹ́ nípasẹ̀ ọ̀rọ̀ Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ nípa Mèsáyà” tàbí “ìhìn tí ó jẹ́ nípa Mèsáyà.” Ìbáṣepọ̀ ìfẹ̀yàrá nínú ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ju ọ̀kan lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Nítorí náà
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń fa ìparí ọ̀rọ̀ jáde láti inú àríyànjiyàn tó ṣáájú.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ìdáhùn ẹni tó gba ìkéde ìhìn rere gbọ́, kì í ṣe ìṣòtítọ́ ní pàtàkì.
- source_word: ἐξ ἀκοῆς
  choice: ń wá láti inú gbígbọ́
  rationale: ἐξ ń tọ́ka sí orísun; fífi ‘ń wá’ kún un mú gbólóhùn tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì ṣe kedere àti àdánidá ní Yorùbá.
- source_word: ἀκοή
  choice: gbígbọ́
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìṣe gbígbọ́ tàbí ohun tí a gbọ́. ‘Gbígbọ́’ pa ìtumọ̀ àkọ́kọ́ mọ́, ó sì bá àyíká ọ̀rọ̀ mu.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, ó so abala kejì mọ́ ti àkọ́kọ́ láìfi ìtakora líle hàn.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Ó fi ọ̀nà tàbí ohun èlò tí gbígbọ́ fi wá hàn.
- source_word: ῥήματος
  choice: ọ̀rọ̀
  rationale: ῥῆμα sábà ń tọ́ka sí ọ̀rọ̀ tí a sọ tàbí ìkéde; ‘ọ̀rọ̀’ pa ìfararora mọ́, ó sì yé àwọn òǹkàwé.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níhìn-ín. Àkójọpọ̀ ‘ọ̀rọ̀ Mèsáyà’ pa ìbáṣepọ̀ genitive Gíríìkì mọ́ láìdá ìtumọ̀ rẹ̀ sí ọ̀nà kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àyíká ọ̀rọ̀ yìí
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Róòmù 10:14–16 ń sọ nípa bí ènìyàn ṣe ń dáhùn sí ìhìn tí a kéde; nítorí náà, ‘ìgbàgbọ́’ ló bá ọ̀rọ̀ mu jù láìfi ẹ̀kọ́ ìsìn àfikún sí i.
- issue: Ìbáṣepọ̀ Χριστοῦ pẹ̀lú ῥήματος
  choice: ọ̀rọ̀ Mèsáyà
  alternative: ọ̀rọ̀ nípa Mèsáyà; ìhìn tó jẹ mọ́ Mèsáyà
  rationale: Genitive Gíríìkì lè tọ́ka sí ọ̀rọ̀ tó ti ọ̀dọ̀ Mèsáyà wá tàbí ọ̀rọ̀ tí Mèsáyà jẹ́ kókó rẹ̀. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ń wá’ lẹ́ẹ̀mejì láti mú ìhun gbólóhùn Gíríìkì tí kò ní ọ̀rọ̀-ìṣe ṣe kedere ní Yorùbá.
