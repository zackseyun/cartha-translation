revisions:
- from: Nítorí náà, ìgbàgbọ́ ń wá láti inú gbígbọ́, gbígbọ́ sì ń wá nípasẹ̀ ọ̀rọ̀ Mèsáyà.[a]
  to: Nítorí náà, ìgbàgbọ́ ń wá láti inú ìgbọ́, ìgbọ́ náà sì jẹ́ nípasẹ̀ ọ̀rọ̀ Mèsáyà.[a]
  rationale: The revision replaces the awkward repeated “ń wá” in the second clause with a natural Yoruba mediating construction, while preserving the source’s parallelism and the English audit trail’s distinction between faith arising from hearing and hearing being through the Messiah’s word. It also clarifies the footnote’s grammatical explanation and retains all stated alternative readings.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:28:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential force of ἄρα, renders πίστις appropriately as ìgbàgbọ́, and retains the ambiguity of the genitive Χριστοῦ in “ọ̀rọ̀ Mèsáyà.” However, supplying “ń wá” with the second ἀκοή produces an awkward Yoruba construction and can suggest that the act of hearing itself ‘comes’ in the same sense as faith. A more idiomatic copular/mediating construction expresses the Greek’s elliptical parallel without resolving the ambiguous genitive.
  naturalness: “Gbígbọ́ sì ń wá nípasẹ̀ ọ̀rọ̀ Mèsáyà” is understandable but not idiomatic modern Standard Yoruba. “Ìgbọ́ náà sì jẹ́ nípasẹ̀ ọ̀rọ̀ Mèsáyà” is smoother and keeps the concise, proverbial register. The footnote’s “Ìhun ọ̀rọ̀ Gíríìkì” is also unclear; it should identify the Greek genitive construction directly.
  terminology: Ìgbàgbọ́ and Mèsáyà are appropriate. “Ọ̀rọ̀ Mèsáyà” suitably mirrors the source wording while leaving open whether the word is from, belongs to, or concerns the Messiah. The alternatives in the note properly make the likely objective sense available without imposing it.
  issues:
  - severity: medium
    issue: The repeated predicate “ń wá” is unnatural in the second clause.
    rationale: The Greek has an elliptical nominal parallel, but Yoruba need not repeat ‘come’ where it yields the unnatural idea that hearing itself comes. A neutral copular expression better conveys the mediated relationship.
  - severity: low
    issue: The footnote does not clearly describe the grammatical basis of the alternatives.
    rationale: “Ìhun ọ̀rọ̀ Gíríìkì” is not a clear description of the genitive relationship at issue. Naming it as “ìbáṣepọ̀ ìfẹ̀yàrá”/genitive construction is more precise for a scholarly note.
  revised_text: Nítorí náà, ìgbàgbọ́ ń wá láti inú ìgbọ́, ìgbọ́ náà sì jẹ́ nípasẹ̀ ọ̀rọ̀ Mèsáyà.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ nípa Mèsáyà” tàbí “ìhìn tí ó jẹ́ nípa Mèsáyà.” Ìbáṣepọ̀ ìfẹ̀yàrá nínú ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ju ọ̀kan lọ.
    reason: alternative_reading
