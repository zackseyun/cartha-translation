id: ROM.10.12
reference: Romans 10:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: yo
  text: Nítorí kò sí ìyàtọ̀ láàárín Júù àti Gíríìkì[a], nítorí pé Olúwa kan náà ni Olúwa gbogbo ènìyàn[b], ó sì jẹ́ ọlọ́rọ̀ sí gbogbo àwọn tí ń pè é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, ọ̀rọ̀ náà ni ‘Gíríìkì.’ Níbi yìí, fífi Júù àti Gíríìkì wéra túmọ̀ sí Júù àti ẹni tí kì í ṣe Júù. Àwọn ìtumọ̀ kan ní ‘aláì-Júù.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘Olúwa kan náà ló wà lórí gbogbo ènìyàn.’
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: ìyàtọ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé kò sí ìpínsí tàbí ìyàtọ̀ tí a fi ń ya àwọn ẹgbẹ́ méjèèjì sọ́tọ̀ ní ọ̀rọ̀ tí Pọ́ọ̀lù ń sọ.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: Júù ... Gíríìkì
  rationale: A pa ‘Gíríìkì’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ inú èdè orísun, bó tilẹ̀ jẹ́ pé níbí ìfara-wé yìí dúró fún Júù àti ẹni tí kì í ṣe Júù.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: Olúwa kan náà ni Olúwa gbogbo ènìyàn
  rationale: Ìtúmọ̀ yìí mú gbólóhùn aláìṣe-orúkọ ìṣe Gíríìkì ṣe kedere ní Yorùbá, ó sì pa ìtẹnumọ́ ‘Olúwa kan náà’ àti àṣẹ rẹ̀ lórí gbogbo ènìyàn mọ́.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún oyè κύριος ní àyíká yìí, ó sì pa ìtumọ̀ ẹ̀kọ́ nípa ẹni tí Jésù jẹ́ mọ́ láìfikún àlàyé sínú ẹsẹ̀ náà.
- source_word: πλουτῶν εἰς πάντας
  choice: ó sì ní ọ̀pọ̀lọpọ̀ ọrọ̀ fún gbogbo
  rationale: Ìtumọ̀ yìí pa àwòrán ọrọ̀ àti ọ̀pọ̀lọpọ̀ ìní inú πλουτῶν mọ́, nígbà tó ń fi hàn pé ọ̀pọ̀lọpọ̀ oore Olúwa ń lọ sí ọ̀dọ̀ gbogbo àwọn tí a mẹ́nu kàn.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: àwọn tí ń ké pè é
  rationale: ‘Ké pè é’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pípe Olúwa fún ìrànlọ́wọ́ àti ní ìgbàgbọ́, ó sì bá ẹsẹ̀ tó tẹ̀ lé e mu.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: A fi oyè náà sílẹ̀ gẹ́gẹ́ bí ‘Olúwa,’ ní ìbámu pẹ̀lú àyíká tó jẹ́wọ́ Jésù gẹ́gẹ́ bí Olúwa.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ìtọ́ka gbogbogbò sí Ọlọ́run láìsọ pé Kristi ni.
  rationale: Róòmù 10:9–13 dá lórí jíjẹ́wọ́ Jésù gẹ́gẹ́ bí Olúwa, ó sì tún lo ọ̀rọ̀ Ìwé Mímọ́ nípa kíké pe Olúwa. A kò fi orúkọ Jésù kún ẹsẹ̀ yìí, kí àyíká fúnra rẹ̀ lè fi ìtọ́kasí náà hàn.
- issue: Ìwọ̀n ‘gbogbo’
  choice: ‘Gbogbo’ tọ́ka sí gbogbo àwọn tí ń ké pe Olúwa, láìka bóyá wọ́n jẹ́ Júù tàbí Gíríìkì.
  alternative: Kí ‘gbogbo’ túmọ̀ sí gbogbo ènìyàn láìsí ààlà kankan.
  rationale: Gírámà Gíríìkì fi ‘àwọn tí ń ké pè é’ ṣe àlàyé àwọn tí ‘gbogbo’ tọ́ka sí. Ìtúmọ̀ náà pa ìmúṣẹ̀ oore fún gbogbo ẹ̀yà àti ààlà gbólóhùn náà mọ́.
translation_notes:
  register: A lo Yorùbá àjùmọ̀lò òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ó ní ọ̀pọ̀lọpọ̀ ọrọ̀ fún’ jẹ́ ọ̀nà àdánidá láti pa àwòrán ọrọ̀ inú Gíríìkì mọ́ láìsọ ọ́ di ẹ̀kọ́ ìdájọ́ kan pàtó.
