  source_fidelity: Ìyàtọ̀, Júù/Gíríìkì, àti ìtẹnumọ́ pé Olúwa kan náà ni Olúwa gbogbo ènìyàn ni a fi hàn dáadáa. Ṣùgbọ́n ‘ó ní ọ̀pọ̀lọpọ̀ ọrọ̀ fún’ lè túmọ̀ sí pé ó ní ọrọ̀ ohun-ìní fún wọn, ó sì dín àwòrán πλουτῶν (‘jẹ́ ọlọ́rọ̀/ní ọ̀pọ̀ oore’) kù. ‘Ń ké pè é’ tún lè dà bí kíkígbe; ‘ń pè é’ jẹ́ ìtumọ̀ tó mọ́, tó sì bá ἐπικαλουμένους mu.
