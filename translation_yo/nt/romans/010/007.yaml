base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: yo
  text: tàbí, “Ta ni yóò sọ̀kalẹ̀ sínú ọ̀gbun[a]?” (ìyẹn ni pé, láti mú Mèsáyà[b] gòkè wá láti inú àwọn òkú).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ibú.” Pọ́ọ̀lù ń tún ọ̀rọ̀ inú Diutarónómì 30:13 ṣe; ṣùgbọ́n níhìn-ín, ó lo “ọ̀gbun,” ó sì lo ọ́ láti tọ́ka sí mímú Mèsáyà gòkè wá láti inú àwọn òkú.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níhìn-ín nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: tàbí
  rationale: Ó mú apá kejì ìbéèrè àfiwé náà wọlé ní ọ̀nà tó ṣe déédé pẹ̀lú Gíríìkì.
- source_word: Τίς
  choice: Ta ni
  rationale: Ìtumọ̀ tààrà fún arọ́pò-orúkọ oníbéèrè náà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: καταβήσεται
  choice: yóò sọ̀kalẹ̀
  rationale: Ó pa ìṣe ọjọ́ iwájú àti àwòrán yíyọ sọ̀kalẹ̀ mọ́.
- source_word: εἰς τὴν ἄβυσσον
  choice: sínú ọ̀gbun
  rationale: “Ọ̀gbun” ń tọ́ka sí ibi jíjìn tí kò ṣeé dé ìsàlẹ̀ rẹ̀, ó sì pa àwòrán Gíríìkì mọ́ láì sọ ọ́ di ibojì tàbí ilẹ̀ òkú.
- source_word: τοῦτ’ ἔστιν
  choice: ìyẹn ni pé
  rationale: Ọ̀nà Yorùbá tó ṣe déédé fún gbólóhùn àlàyé náà.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” fi ìtumọ̀ ẹni àmì òróró yàn hàn dípò kíkàn án bí orúkọ.
- source_word: ἐκ νεκρῶν
  choice: láti inú àwọn òkú
  rationale: Ó fi hàn pé a mú un jáde láàárín àwọn tí ó ti kú, ó sì bá àsọyé Yorùbá mu.
- source_word: ἀναγαγεῖν
  choice: láti mú ... gòkè wá
  rationale: Ó pa ìṣípò sókè mọ́ gẹ́gẹ́ bí ohun tó dojú kọ sísọ̀kalẹ̀, láì fi ọ̀rọ̀ míì tó túmọ̀ sí jíǹde rọ́pò rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àlàyé Pọ́ọ̀lù yìí; “Mèsáyà” mú ìtumọ̀ oyè náà jáde ní kedere.
- issue: Ìtumọ̀ ἄβυσσος nínú àlàyé Pọ́ọ̀lù
  choice: Pa “ọ̀gbun” mọ́ láì sọ ọ́ di ibojì tàbí ilẹ̀ àwọn òkú
  alternative: ibú; ilẹ̀ àwọn òkú
  rationale: Èyí pa ìtọ́kasí sí Diutarónómì àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú àwòrán náà mọ́, láì fi ìtumọ̀ tóóró kan lé e lórí.
translation_notes:
  register: Yorùbá àpéjọ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “sọ̀kalẹ̀” àti “gòkè wá” láti pa ìbáramu àwòrán ibi mọ́; a gbé àmì àlàyé lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń tọ́ka sí.
