  to: Ṣùgbọ́n kì í ṣe gbogbo wọn ni wọ́n gbọ́ràn sí ìhìn rere[a] náà. Nítorí Àìsáyà sọ pé, “Olúwa, ta ni ó gba ìròyìn wa[b] gbọ́?”
