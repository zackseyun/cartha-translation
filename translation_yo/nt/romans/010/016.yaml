id: ROM.10.16
reference: Romans 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: yo
  text: Ṣùgbọ́n kì í ṣe gbogbo wọn ni wọ́n gbọ́ràn sí ìhìn rere[a] náà. Nítorí Àìsáyà sọ pé, “Olúwa, ta ni ó gba ìròyìn wa[b] gbọ́?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìnrere.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìhìn wa”; ní tààràtà, “ìgbọ́gbọ́ wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ọ̀rọ̀ tí ó ṣáájú hàn ní ọ̀nà àdánidá àti ṣókí.
- source_word: οὐ πάντες
  choice: kì í ṣe gbogbo wọn
  rationale: 'Ó pa ìṣòro ìkọ̀sẹ̀ apá kan mọ́: kì í ṣe pé gbogbo ènìyàn kọ̀, bí kò ṣe pé àwọn kan kò ṣe bẹ́ẹ̀.'
- source_word: ὑπήκουσαν
  choice: ṣègbọ́ràn sí
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ṣíṣe ìgbọ́ràn, kì í ṣe gbígbọ́ lásán; èyí sì pa agbára ìdáhùn tí Pọ́ọ̀lù ń béèrè mọ́.
- source_word: τῷ εὐαγγελίῳ
  choice: ìhìn rere náà
  rationale: Èyí ni ìtumọ̀ gbangba ti εὐαγγέλιον ní Yorùbá òde òní; àfikún “náà” fi hàn pé ìhìn rere tí a ti ń sọ̀rọ̀ rẹ̀ ni.
- source_word: Ἠσαΐας
  choice: Àìsáyà
  rationale: Orúkọ wòlíì náà ní ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé àyọkà Ìwé Mímọ́ yìí ń ṣe àtìlẹ́yìn fún gbólóhùn tí ó ṣáájú.
- source_word: λέγει
  choice: sọ
  rationale: Ọ̀nà àdánidá ni èyí fún fífi ọ̀rọ̀ Ìwé Mímọ́ hàn ní Yorùbá, láìfi ìtumọ̀ míì kún un.
- source_word: Κύριε
  choice: Olúwa
  rationale: Ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος ní ipò àpèjúwe yìí.
- source_word: τίς ἐπίστευσεν
  choice: ta ni ó ... gbọ́?
  rationale: Ìsọ̀rọ̀ “gba ... gbọ́” ni ọ̀nà Yorùbá àdánidá láti sọ ìgbàgbọ́ nínú ìhìn kan, ó sì pa ìbéèrè àsọyé náà mọ́.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: ìhìn tí a kéde
  rationale: ἀκοή lè tọ́ka sí ohun tí a gbọ́, ìròyìn, tàbí ìhìn tí a polongo. “Ìhìn tí a kéde” mú ìtumọ̀ ohun tí àwọn olùkéde mú wá ṣe kedere, láìdín ọ̀rọ̀ náà kù sí ìṣe gbígbọ́ nìkan.
theological_decisions:
- issue: Irú ìdáhùn tí ὑπήκουσαν τῷ εὐαγγελίῳ ń béèrè
  choice: “ṣègbọ́ràn sí ìhìn rere”
  alternative: “fetí sí ìhìn rere” tàbí “gba ìhìn rere”
  rationale: Ọ̀rọ̀ náà jẹ́ ti ìgbọ́ràn ní pàtó. Ìtumọ̀ yìí pa ìsopọ̀ tí Pọ́ọ̀lù ṣe láàárín ìgbàgbọ́ àti ìdáhùn onígbọ́ràn mọ́, láìfi ẹ̀kọ́ ìjọ kan pàtó kún un.
- issue: Ìtumọ̀ ἀκοή nínú àyọkà Àìsáyà
  choice: “ìhìn tí a kéde” nínú ọ̀rọ̀ pàtàkì
  alternative: “ìròyìn wa” tàbí, ní tààràtà, “ohun tí a gbọ́”
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbọ́ràn etí tàbí ohun tí a gbọ́. Nínú àyíká yìí, ohun tí a polongo ni ìtumọ̀ tí ó ṣeé lóye jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn míì mọ́.
translation_notes:
  register: A lo Yorùbá ìṣàkóso tí ó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn “gba ìhìn ... gbọ́” jẹ́ àdánidá ní Yorùbá, ó sì mú ìbéèrè àsọyé inú àyọkà náà jáde dáadáa.
