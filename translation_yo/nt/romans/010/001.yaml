id: ROM.10.1
reference: Romans 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: yo
  text: Ẹ̀yin arákùnrin[a], ohun tí ọkàn mi ń fẹ́ jù lọ àti àdúrà mi sí Ọlọ́run fún wọn ni pé kí wọ́n rí ìgbàlà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀yin arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì náà wà ní ọ̀pọ̀ akọ, ṣùgbọ́n a lè lò ó láti pe àwùjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ẹ̀yin arákùnrin
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ akọ tí a lò láti pe àwọn ènìyàn ní tààrà; a pa ìrísí akọ inú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó lè tọ́ka sí gbogbo ìjọ.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: ìfẹ́ inú ọkàn mi
  rationale: Ní àyíká yìí, εὐδοκία túmọ̀ sí ohun tí Paulu fẹ́ gidigidi; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ọkàn mọ́.
- source_word: δέησις
  choice: àdúrà mi
  rationale: Ó ń tọ́ka sí ẹ̀bẹ̀ tàbí ìbéèrè tọkàntọkàn sí Ọlọ́run; ‘àdúrà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí àyíká sì ń fi ìtumọ̀ ẹ̀bẹ̀ hàn.
- source_word: πρὸς τὸν θεόν
  choice: sí Ọlọ́run
  rationale: πρός pẹ̀lú ẹ̀sùn-ọrọ̀ ń fi ibi tí àdúrà náà dojú kọ hàn; ‘sí Ọlọ́run’ jẹ́ ìtumọ̀ tó ṣe déédé.
- source_word: ὑπὲρ αὐτῶν
  choice: fún wọn
  rationale: ὑπέρ ń fi ẹni tí àdúrà náà jẹ́ fún hàn; a pa arọ́pò-orúkọ ‘wọn’ mọ́ láì fi ‘Ísírẹ́lì’ kún ọ̀rọ̀.
- source_word: εἰς σωτηρίαν
  choice: ni pé kí wọ́n rí ìgbàlà
  rationale: εἰς ń tọ́ka sí ète tàbí àbájáde; gbólóhùn yìí sọ ète àdúrà náà ní Yorùbá àdánidá, ó sì mú kí ó ṣe kedere pé ìgbàlà náà jẹ́ ti ‘wọn.’
- source_word: μέν
  choice: a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: μέν ń ṣe iṣẹ́ ìṣètò ọ̀rọ̀ tàbí ìyàtọ̀ díẹ̀ níbí, ṣùgbọ́n kò ní δέ tó hàn gbangba nínú ẹsẹ yìí; fífi ọ̀rọ̀ míì kún un yóò mú kí Yorùbá le.
theological_decisions:
- issue: Ìpè akọ Ἀδελφοί àti bí ó ṣe lè kan gbogbo ìjọ
  choice: Ẹ̀yin arákùnrin
  alternative: Ẹ̀yin ará; Ẹ̀yin arákùnrin àti arábìnrin
  rationale: A pa ọ̀pọ̀ akọ inú ọ̀rọ̀ Gíríìkì mọ́ nínú àyọkà pàtàkì, láì sẹ́ pé nínú ìlò rẹ̀ ó lè pe àwùjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀; àlàyé ìtumọ̀ gbòòrò náà wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ìfẹ́ inú ọkàn mi’ àti ‘kí wọ́n rí ìgbàlà’ láti mú ọ̀rọ̀ náà ṣàn lọ́nà àdánidá, nígbà tí a ṣì pa ète àti ìmọ̀lára tọkàntọkàn inú Gíríìkì mọ́.
