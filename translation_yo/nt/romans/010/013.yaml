  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: yo
  text: Nítorí gbogbo ẹni tí ó bá pe orúkọ Olúwa ni a ó gbàlà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọ́ọ̀lù ń yọ ọ̀rọ̀ yìí látinú Jóẹli 2:32. Nínú Jóẹli, YHWH (‘OLÚWA’) ni ọ̀rọ̀ náà ń tọ́ka sí; níbí, àyíká fi hàn pé Pọ́ọ̀lù lo ọ̀rọ̀ náà fún Jésù.
    reason: cross_reference
  - marker: b
    text: Tàbí, ‘tí ó bá pè sí.’ Gbólóhùn Gíríìkì náà túmọ̀ sí pípe sí Olúwa ní ẹ̀bẹ̀ tàbí ní ìfẹ̀hónúhàn, nípa pípe orúkọ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: gbogbo ẹni tí ó bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí ẹni yòówù kí ó jẹ́, láìfi ẹnikẹ́ni sílẹ̀; ‘gbogbo ẹni tí ó bá’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ìtumọ̀ àpapọ̀ àti àìdánimọ̀ náà hàn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ń mú ẹ̀rí Ìwé Mímọ́ wá láti ṣàlàyé tàbí fi ohun tí a sọ ṣáájú múlẹ̀.
- source_word: ἐπικαλέσηται
  choice: ké pe
  rationale: Nínú gbólóhùn Bíbélì yìí, ọ̀rọ̀ náà túmọ̀ sí pípe sí Olúwa ní ẹ̀bẹ̀, àdúrà tàbí ìjẹ́wọ́; ‘ké pe’ mú ìtumọ̀ ìpè fún ìrànlọ́wọ́ yìí jáde ní Yorùbá.
- source_word: τὸ ὄνομα
  choice: orúkọ
  rationale: A pa àwòrán Bíbélì náà mọ́; ‘orúkọ’ dúró fún ẹni tí a ń pè, ìdánimọ̀ rẹ̀ àti àṣẹ rẹ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ tààrà ti κύριος ní àyíká yìí, láìfi ‘Jésù’ kún ọ̀rọ̀ inú ẹsẹ náà.
- source_word: σωθήσεται
  choice: ni a ó gbà là
  rationale: Ọ̀rọ̀ ọjọ́ iwájú aláìṣe náà ní ìtumọ̀ ìgbàlà nínú àyíká Pọ́ọ̀lù; ọ̀nà Yorùbá yìí ṣe kedere, ó sì pa ìtẹnumọ́ ìlérí náà mọ́.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí nínú àyọlò Jóẹli
  choice: Pa ‘Olúwa’ mọ́ nínú ẹsẹ náà, kí àlàyé ìsàlẹ̀ sọ bí Pọ́ọ̀lù ṣe lo ọ̀rọ̀ náà fún Jésù nínú àyíká rẹ̀.
  alternative: ‘OLÚWA’ tàbí ‘Olúwa Jésù’
  rationale: Gíríìkì ní κυρίου (‘Olúwa’). Àyíká Róòmù 10 fi Jésù hàn gẹ́gẹ́ bí ẹni tí a ń pè, ṣùgbọ́n àfikún ‘Jésù’ sínú ẹsẹ náà yóò kọjá ọ̀rọ̀ orísun; ní Jóẹli, YHWH ni ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọlọ́lá, tí ó sì yé òǹkàwé òde òní ni a lò. ‘Ké pe’ jẹ́ àdánidá ju ìtumọ̀ líle bí ‘pè lórúkọ’ lọ, ó sì mú èrò ìpè ẹ̀bẹ̀ inú ἐπικαλέομαι hàn. Àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ.
