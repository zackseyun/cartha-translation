id: ROM.10.9
reference: Romans 10:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: yo
  text: nítorí pé bí o bá fi ẹnu rẹ jẹ́wọ́ pé Jésù ni Olúwa[a], tí o sì gbàgbọ́ ní ọkàn rẹ pé Ọlọ́run jí i dìde kúrò nínú àwọn òkú, a ó gbà ọ́ là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “jẹ́wọ́ Jésù gẹ́gẹ́ bí Olúwa.” A lè tú κύριον Ἰησοῦν lọ́nà yìí; ọ̀rọ̀ inú ẹsẹ náà mú ohun tí a jẹ́wọ́ hàn kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ń ṣàlàyé ìdí ọ̀rọ̀ tí ó ṣáájú; ‘nítorí pé’ mú ìtumọ̀ ìdí náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Ìlànà àdánidá Yorùbá fún gbólóhùn oníṣ شرط, ó sì bá ọ̀rọ̀-ìṣe subjunctive méjèèjì mu.
- source_word: ὁμολογήσῃς
  choice: jẹ́wọ́
  rationale: ‘Jẹ́wọ́’ lè túmọ̀ sí ìkéde tàbí ìfihàn gbangba nípa ohun tí ẹni gbà pé ó jẹ́ òótọ́; kò fi dandan sí ìjẹ́wọ́ ẹ̀ṣẹ̀ nìkan.
- source_word: ἐν τῷ στόματί σου
  choice: fi ẹnu rẹ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnu ni a fi ṣe ìjẹ́wọ́ náà, ó sì pa ìfihàn ní gbangba mọ́.
- source_word: κύριον Ἰησοῦν
  choice: pé Jésù ni Olúwa
  rationale: Ó mú àkóónú ìjẹ́wọ́ náà hàn kedere, ó sì pa κύριος mọ́ gẹ́gẹ́ bí oyè ‘Olúwa.’
- source_word: πιστεύσῃς
  choice: gbàgbọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tààrà fún gbígba ohun tí gbólóhùn tó tẹ̀ lé sọ gbọ́.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: ní ọkàn rẹ
  rationale: Ó pa àwòrán inú ọkàn àti ìdánilójú inú mọ́ láìsọ ọ́ di àlàyé ju ti orísun lọ.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Ọlọ́run jí i dìde
  rationale: Ó tú aorist náà sí ìṣe tí ó ṣẹlẹ̀, ní gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἐκ νεκρῶν
  choice: kúrò nínú àwọn òkú
  rationale: Ó pa ìtumọ̀ jíjí dìde láàárín àwọn ẹni tí ó ti kú mọ́, ní ọ̀nà tó yé òǹkàwé Yorùbá.
- source_word: σωθήσῃ
  choice: a ó gbà ọ́ là
  rationale: Àpólà àìsọ ẹni tó ṣe ìṣe náà ní Gíríìkì ni a tú sí ìlànà passive Yorùbá àdánidá; ‘gbà ... là’ pa agbára ìgbàlà inú àyíká ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ìjẹ́wọ́ náà
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: ‘Olúwa’ pa ìtumọ̀ àṣẹ àti ìró Ìwé Mímọ́ tó wà ní àyíká ọ̀rọ̀ náà mọ́; ‘Ọ̀gá’ kéré ju fún oyè náà.
- issue: Ìrísí gbólóhùn κύριον Ἰησοῦν
  choice: pé Jésù ni Olúwa
  alternative: jẹ́wọ́ Jésù gẹ́gẹ́ bí Olúwa
  rationale: Àṣàyàn yìí sọ àkóónú ìjẹ́wọ́ náà di mímọ̀ láìyí i padà sí orúkọ-oyè tí ó dì papọ̀.
- issue: Agbára σωθήσῃ nípa ìgbàlà
  choice: a ó gbà ọ́ là
  alternative: a ó dá ọ sílẹ̀
  rationale: Àyíká ọ̀rọ̀ Pọ́ọ̀lù jẹ́ ti ìgbàlà; ‘gbà ... là’ pa ìtumọ̀ náà mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn míràn kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí gbogbo ènìyàn lè lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìlànà ‘bí ... bá ... tí ... sì’ so àwọn şart méjèèjì pọ̀ lọ́nà àdánidá; ‘a ó gbà ọ́ là’ jẹ́ passive Yorùbá tí kò sọ ẹni tó ṣe ìgbàlà náà ní kedere, bí Gíríìkì náà ṣe rí.
