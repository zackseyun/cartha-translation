id: ROM.10.11
reference: Romans 10:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: yo
  text: Nítorí Ìwé Mímọ́ sọ pé[a], “Ẹnikẹ́ni tí ó bá gbẹ́kẹ̀ lé e kì yóò dójútì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnikẹ́ni tí ó bá gbà á gbọ́ kì yóò tijú.”
    reason: Ó fi ọ̀nà Yorùbá mìíràn hàn fún πιστεύων ἐπ’ αὐτῷ àti καταισχυνθήσεται. “Gbà á gbọ́” lè túmọ̀ sí “gbọ́/ní ìgbàgbọ́ nínú un,” nígbà tí “kì yóò tijú” ń sọ ìtumọ̀ ìtìjú náà ní ọ̀nà tó rọrùn.
lexical_decisions:
- source_word: λέγει
  choice: wí pé
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdáyébá ní Yorùbá láti fi ohun tí Ìwé Mímọ́ ń sọ hàn; ó sì pa ìsinsìnyí aláàyè inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń fi ìdí ọ̀rọ̀ tí ó ṣáájú múlẹ̀, gẹ́gẹ́ bí γάρ ṣe rí nínú ìjiyàn Paulu.
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Nínú ọ̀nà ìtọ́kasí Paulu, γραφή túmọ̀ sí Ìwé Mímọ́, kì í ṣe ìwé lásán.
- source_word: Πᾶς ὁ πιστεύων
  choice: Ẹnikẹ́ni tí ó bá gbẹ́kẹ̀ lé e
  rationale: Ẹnikẹ́ni ń pa ìtumọ̀ gbogbo ènìyàn mọ́ láì sọ ọ́ di ti akọ nìkan; gbẹ́kẹ̀ lé e sì sọ ìgbàgbọ́ tí ó dojú kọ ẹni kan àti ìgbẹ́kẹ̀lé ẹni náà ní Yorùbá àdáyébá.
- source_word: ἐπ’ αὐτῷ
  choice: lé e
  rationale: Pẹ̀lú πιστεύω, ἐπί àti dative ń tọ́ka sí ìgbẹ́kẹ̀lé tí a gbé lé ẹni kan. “Gbẹ́kẹ̀ lé e” mú agbára yìí jáde dáadáa láì tú ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí síta.
- source_word: οὐ καταισχυνθήσεται
  choice: a kì yóò dójú tì í
  rationale: 'Yorùbá máa ń lo aṣojú aláìlẹ́ni “a” láti sọ ìṣe àìlèsọ ẹni, èyí sì pa ìtumọ̀ passive náà mọ́: a kì yóò mú un wá sínú ìtìjú tàbí ìjákulẹ̀ ní gbangba.'
theological_decisions:
- issue: Agbára gbogbo ènìyàn nínú Πᾶς ὁ πιστεύων
  choice: Ẹnikẹ́ni tí ó bá gbẹ́kẹ̀ lé e
  alternative: Gbogbo ẹni tí ó bá gbà á gbọ́
  rationale: Akọ ẹyọ nínú Gíríìkì dúró fún gbogbo ènìyàn, kì í ṣe àwọn ọkùnrin nìkan; “ẹnikẹ́ni” pa agbára àpapọ̀ yìí mọ́.
- issue: Ẹni tí αὐτῷ ń tọ́ka sí
  choice: e
  alternative: Kristi
  rationale: A pa arọ́pò-orúkọ mọ́ bí ó ti rí nínú àyọlò, nítorí àyíká ọ̀rọ̀ ni ó ń fi ẹni náà hàn; fífi “Kristi” sínú ọ̀rọ̀ náà yóò jẹ́ àlàyé tí orísun kò sọ ní tààrà.
- issue: Ìtumọ̀ passive nínú καταισχυνθήσεται
  choice: a kì yóò dójú tì í
  alternative: ojú kì yóò tì í
  rationale: Àṣàyàn àkọ́kọ́ pa èrò pé a kì yóò fi onígbàgbọ́ sínú ìtìjú tàbí ìjákulẹ̀ ní gbangba mọ́. Àṣàyàn kejì lè túmọ̀ sí ìmọ̀lára ìtìjú inú ẹni, bó tilẹ̀ jẹ́ pé ó tún ṣeé ṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. “Ìwé Mímọ́ wí pé” ní ìrísí ọ̀wọ̀ tó bá àyọlò mu, nígbà tí “gbẹ́kẹ̀ lé e” àti àṣojú aláìlẹ́ni “a” jẹ́ èdè àdáyébá. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
