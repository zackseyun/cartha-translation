  source_fidelity: Ìtumọ̀ náà ń pa γάρ, ìtọ́kasí sí Ìwé Mímọ́, agbára gbogbogbòò ti Πᾶς ὁ πιστεύων, àti ẹni tí ìgbọ́kànlé dojú kọ mọ́. Síbẹ̀, “a kì yóò dójú tì í” jẹ́ ọ̀nà passive tí kò dáa tó nínú Yorùbá ìgbàlódé. Ọ̀rọ̀-ìsọ̀rí “kì yóò dójútì” jẹ́ àdáyébá, ó sì ń mú ìtumọ̀ ìtìjú/ìtìlẹ́yìn ní gbangba ti καταισχυνθήσεται jáde, bí ó tilẹ̀ jẹ́ pé Yorùbá lo ìrísí aláìní-iṣẹ́-ọwọ́ (intransitive) dípò passive Gíríìkì.
