id: ROM.10.14
reference: Romans 10:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: yo
  text: 'Nítorí náà, báwo ni wọn yóò ṣe pe orúkọ ẹni tí wọn kò gbàgbọ́ nínú rẹ̀? Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́ nípa rẹ̀[a]? Báwo sì ni wọn yóò ṣe gbọ́ láìsí ẹni tí ń wàásù?


    [a] Tàbí, “Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Nítorí náà, báwo ni
  rationale: “Nítorí náà” ń pa agbára ìyọrísí οὖν mọ́, “báwo ni” sì ń mú ìbéèrè àsọyé Pọ́ọ̀lù jáde ní Yorùbá àdánidá.
- source_word: ἐπικαλέσωνται
  choice: wọn yóò ṣe ké pe
  rationale: “Ké pe” túmọ̀ sí pípe ẹnì kan tọkàntọkàn fún ìrànlọ́wọ́ tàbí ìgbàlà, ó sì bá ìtumọ̀ ìpè sí Olúwa nínú àyíká ọ̀rọ̀ náà mu.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: ẹni tí wọn kò gbàgbọ́ nínú rẹ̀
  rationale: “Gbàgbọ́ nínú” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi πιστεύω εἰς hàn, láìsọ ìgbàgbọ́ di èrò tàbí ìgbẹ́kẹ̀lé nìkan.
- source_word: πιστεύσωσιν
  choice: wọn yóò ṣe gbàgbọ́
  rationale: Ọ̀rọ̀ ọjọ́ iwájú nínú ìbéèrè àsọyé jẹ́ ọ̀nà Yorùbá àdánidá láti gbé subjunctive Gíríìkì yìí jáde; “gbàgbọ́” sì pa ìsopọ̀ ọ̀rọ̀ mọ́.
- source_word: οὗ οὐκ ἤκουσαν
  choice: ẹni tí wọn kò gbọ́
  rationale: Èyí pa àǹfààní ìtumọ̀ pé ẹni náà ni wọn kò gbọ́ mọ́. Nítorí genitive Gíríìkì tún lè tọ́ka sí gbígbọ́ nípa ẹni náà, a fi ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀.
- source_word: ἀκούσωσιν
  choice: wọn yóò ṣe gbọ́
  rationale: “Gbọ́” ni ìbámu tààrà fún ἀκούω, ó sì pa àsopọ̀ mọ́ pẹ̀lú gbígbọ́ nínú gbólóhùn tó ṣáájú.
- source_word: χωρὶς κηρύσσοντος
  choice: láìsí ẹni tí ń wàásù
  rationale: Ìtumọ̀ yìí tẹnu mọ́ iṣẹ́ ìkéde gẹ́gẹ́ bí participle Gíríìkì ṣe rí, dípò kí ó dá ipò tàbí oyè “oníwàásù” sílẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πιστεύω
  choice: gbàgbọ́ / gbàgbọ́ nínú
  alternative: gbẹ́kẹ̀ lé
  rationale: “Gbàgbọ́” pa ìlà ọ̀rọ̀ ìgbàgbọ́ Pọ́ọ̀lù mọ́, kò sì fi ìtumọ̀ kan ṣoṣo tí ó le ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ lé e lórí.
- issue: Ohun tàbí ẹni tí a gbọ́ nínú οὗ οὐκ ἤκουσαν
  choice: ẹni tí wọn kò gbọ́
  alternative: ẹni tí wọn kò gbọ́ nípa rẹ̀
  rationale: Genitive οὗ lẹ́yìn ἀκούω lè jẹ́ ẹni tí a gbọ́ tàbí ẹni tí a gbọ́ nípa rẹ̀. A kò yanju ìṣòro ìtumọ̀ yìí ní ìkọ̀kọ̀; a fi àṣàyàn kejì hàn nínú àlàyé ìsàlẹ̀.
- issue: κηρύσσοντος gẹ́gẹ́ bí iṣẹ́ tàbí ipò
  choice: ẹni tí ń wàásù
  alternative: oníwàásù
  rationale: Gíríìkì lo participle tó ń ṣàpèjúwe ẹni tó ń ṣe iṣẹ́ ìkéde, kì í ṣe dandan ẹni tó ní oyè tàbí ipò ìjọ kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Ké pe” àti “wàásù” jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá lóde òní lè lóye láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan sí i.
