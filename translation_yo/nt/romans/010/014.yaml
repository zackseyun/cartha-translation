review_pass:
  verdict: revise
  source_fidelity: The rhetorical sequence and future-like questions are retained. However, the first clause's “ké pe ẹni” is not the clearest Yoruba expression for ἐπικαλέσωνται in this context; “pe orúkọ ...” explicitly conveys invoking/calling upon. In the second question, οὗ after ἀκούω naturally denotes hearing of/about someone; the draft's unqualified “gbọ́ ẹni” can suggest directly hearing the person and is less idiomatic.
  naturalness: The revision uses natural Standard Yoruba while preserving the formal public-reading register. “Pe orúkọ ẹni” is clearer than “ké pe ẹni,” and “gbọ́ nípa ẹni” is the normal Yoruba expression for receiving a report/message concerning someone.
  terminology: “Gbàgbọ́ nínú” appropriately maintains the πιστεύω chain, and “ẹni tí ń wàásù” accurately presents κηρύσσοντος as an acting proclaimer rather than an ecclesiastical office.
  issues:
  - severity: medium
    issue: “ké pe ẹni” is an unclear rendering of invoking someone.
    rationale: The Greek ἐπικαλέσωνται here means call upon/invoke. Yoruba idiom normally expresses this as “pe orúkọ ẹni” (call a person's name), especially in a religious appeal.
  - severity: medium
    issue: The main rendering “ẹni tí wọn kò gbọ́” for οὗ οὐκ ἤκουσαν is both less natural and potentially misleading.
    rationale: With ἀκούω, the genitive relative pronoun normally conveys hearing of/about a person. “Gbọ́ nípa ẹni” makes the intended relation clear without adding doctrinal interpretation; the more literal construction can remain as a footnoted alternative.
  revised_text: 'Nítorí náà, báwo ni wọn yóò ṣe pe orúkọ ẹni tí wọn kò gbàgbọ́ nínú rẹ̀? Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́ nípa rẹ̀[a]? Báwo sì ni wọn yóò ṣe gbọ́ láìsí ẹni tí ń wàásù?


    [a] Tàbí, “Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́?”'
  revised_footnotes:
  - marker: a
    text: Tàbí, “Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́?”
    reason: lexical_alternative
  revision_rationale: The revision corrects the Yoruba idiom for calling upon the Lord and gives the genitive object of ἀκούω its natural sense, “hear about/of.” The footnote preserves the more formally literal Yoruba alternative and keeps the lexical ambiguity visible.
