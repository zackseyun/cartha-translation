  to: 'Nítorí náà, báwo ni wọn yóò ṣe pe orúkọ ẹni tí wọn kò gbàgbọ́ nínú rẹ̀? Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́ nípa rẹ̀[a]? Báwo sì ni wọn yóò ṣe gbọ́ láìsí ẹni tí ń wàásù?


    [a] Tàbí, “Báwo sì ni wọn yóò ṣe gbàgbọ́ nínú ẹni tí wọn kò gbọ́?”'
