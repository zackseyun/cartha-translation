id: ROM.10.20
reference: Romans 10:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: yo
  text: Ṣùgbọ́n Aísáyà sì fi ìgboyà ńláǹlà sọ pé, “A rí mi láàrín àwọn tí kò wá mi; mo fara hàn fún àwọn tí kò béèrè nípa mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: tilẹ̀ fi ìgboyà sọ
  rationale: Ó mú ìtumọ̀ ìgboyà tàbí fífi ọkàn ṣe ohun tí ó le koko jáde, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: Εὑρέθην
  choice: Àwọn ... rí mi
  rationale: Ìṣe aláìṣe ti Gíríìkì, ‘a rí mi,’ jẹ́ adayeba jù lọ ní Yorùbá gẹ́gẹ́ bí gbólóhùn olùṣe ‘àwọn ... rí mi,’ láìyí ìtumọ̀ padà.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: Àwọn tí kò wá mi rí mi
  rationale: Nínú àyọlò yìí, ἐν ń tọ́ka sí àwọn ènìyàn tí wọ́n rí Ọlọ́run; ìtumọ̀ yìí ṣe kedere ní Yorùbá, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ ‘wá mi.’
- source_word: ζητοῦσιν
  choice: wá mi
  rationale: ‘Wá’ jẹ́ ọ̀rọ̀ Yorùbá adayeba fún fífi taratara ṣàwárí ẹnì kan, ó sì pa ìṣọ̀kan àwòrán inú ọ̀rọ̀ mọ́.
- source_word: ἐμφανὴς ἐγενόμην
  choice: mo fara hàn
  rationale: ‘Fara hàn’ sọ ìfarahàn tàbí jíjẹ́ ẹni tí a lè mọ̀ ní ọ̀nà adayeba, láìfi kún un ní pàtó pé Ọlọ́run ‘sọ ara rẹ̀ di mímọ̀.’
- source_word: ἐπερωτῶσιν
  choice: béèrè nípa mi
  rationale: Ó mú ìtumọ̀ bíbéèrè tàbí wádìí nípa ẹni kan jáde, ó sì yẹra fún mímú un túmọ̀ sí ‘ké pe mi,’ èyí tí yóò jẹ́ pàtó ju ọ̀rọ̀ orísun lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ ọ̀rọ̀ yìí sí ohun tí ó ṣáájú hàn kedere.
- source_word: Ἠσαΐας
  choice: Isaiah
  rationale: Orúkọ wòlíì náà ni a kọ ní ọ̀nà tí ó wọ́pọ̀ nínú Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ìfarahàn Ọlọ́run nínú àyọlò Isaiah
  choice: mo fara hàn fún àwọn tí kò béèrè nípa mi
  alternative: mo sọ ara mi di mímọ̀ fún àwọn tí kò béèrè nípa mi
  rationale: Àṣàyàn náà pa ìtẹnumọ́ Gíríìkì mọ́ lórí ìfarahàn, kò sì sọ ọ́ di ìṣe afarahẹ tí ọ̀rọ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘tilẹ̀ fi ìgboyà sọ’ láti fi ipa ἀποτολμᾷ hàn, ‘mo fara hàn’ sì pa ìfarahàn inú ọ̀rọ̀ Gíríìkì mọ́ láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ ju orísun lọ.
