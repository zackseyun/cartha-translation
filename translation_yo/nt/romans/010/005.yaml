id: ROM.10.5
reference: Romans 10:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: yo
  text: Nítorí Mósè kọ pé, “Ẹni tí ó bá ṣe òdodo tí ó wá láti inú Òfin yóò yè nínú rẹ̀.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá ìkẹyìn náà pé, “yóò yè nípa rẹ̀.” Páùlù ń tọ́ka sí Léfítíkù 18:5.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé ẹsẹ̀ yìí ń ṣàlàyé ọ̀rọ̀ tí ó ṣáájú; “Nítorí” ni àsopọ̀ Yorùbá tó ṣe déédé jù níhìn-ín.
- source_word: γράφει
  choice: kọ
  rationale: Ọ̀rọ̀ ìṣe ìsinsìnyí nínú Gíríìkì jẹ́ ọ̀nà ìtọ́ka sí Ìwé Mímọ́; Yorùbá lè sọ ọ́ lọ́nà àdánidá pé Mósè “kọ” ọ̀rọ̀ náà.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: “Òdodo” gba ìtumọ̀ ìwà tó tọ́ àti ipò títọ́ níwájú Ọlọ́run, ó sì pa àsopọ̀ ọ̀rọ̀ Páùlù mọ́ nínú Róòmù.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: tí ó ti inú Òfin wá
  rationale: Ó pa èrò orísun nínú ἐκ mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere fún ìyàtọ̀ tí Páùlù ń ṣe láàárín òdodo láti inú Òfin àti òdodo láti inú ìgbàgbọ́.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: Ẹni tí ó bá ṣe é
  rationale: ἄνθρωπος níhìn-ín dúró fún ẹnikẹ́ni, kì í ṣe ọkùnrin nìkan. “Ẹni” sọ agbára aṣojú náà jáde ní Yorùbá láìfi akọ tàbí abo tí kò ṣe pàtàkì kún un; “ṣe é” sì pa ọ̀rọ̀ ìṣe gbogbogbò inú àyọlò náà mọ́.
- source_word: ζήσεται
  choice: yóò yè
  rationale: Ó túmọ̀ ọjọ́-ọ̀la Gíríìkì ní tààrà, ó sì bá èdè àyọlò Léfítíkù mu.
- source_word: ἐν αὐτῇ
  choice: nípa rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ abo ẹyọ kan, ó sì ń tọ́ka sí òdodo tí ó ti inú Òfin wá. “Nípa rẹ̀” fi ìtumọ̀ ohun tí ìyè gbára lé hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gẹ́gẹ́ bí “nínú rẹ̀” mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ìyàtọ̀ tí Páùlù ń ṣe
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó gbooro tó láti ru ìtumọ̀ ìwà títọ́ àti ipò títọ́ níwájú Ọlọ́run, láìdín ọ̀rọ̀ náà kù sí ìdájọ́ ilé-ẹjọ́ nìkan.
- issue: Ohun tí ἐν αὐτῇ ń tọ́ka sí àti bí a ṣe túmọ̀ rẹ̀
  choice: nípa rẹ̀
  alternative: nínú rẹ̀
  rationale: Gíríìkì tí a fún wa ní arọ́pò-orúkọ abo ẹyọ kan, èyí tó lè tọ́ka sí “òdodo” tí ó ti inú Òfin wá. Síbẹ̀, àyọlò náà ń dún bí Léfítíkù 18:5, níbi tí ẹni náà ti ń yè nípa ṣíṣe àwọn àṣẹ; nítorí náà a pa ọ̀nà míì mọ́ sínú àlàyé dípò yíyanjú ìyọnu náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò tó níyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “Òfin” gẹ́gẹ́ bí ẹ̀ka Òfin Mósè, “ẹni” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ἄνθρωπος tó ń ṣojú gbogbo ènìyàn.
