revisions:
- from: Nítorí Mósè kọ nípa òdodo tí ó ti inú Òfin wá pé, “Ẹni tí ó bá ṣe é yóò yè nípa rẹ̀.”[a]
  to: Nítorí Mósè kọ pé, “Ẹni tí ó bá ṣe òdodo tí ó wá láti inú Òfin yóò yè nínú rẹ̀.”[a]
  rationale: A tún ọ̀rọ̀ náà ṣe kí γράφει ὅτι hàn gẹ́gẹ́ bí “kọ pé,” kí δικαιοσύνην jẹ́ ohun tí ẹni náà “ṣe” ní kedere, àti kí “ἐν αὐτῇ” gba ìtumọ̀ gígùn rẹ̀ “nínú rẹ̀.” Àlàyé ìsàlẹ̀ náà pa ìtumọ̀ àfihàn “nípa rẹ̀” mọ́ àti ìtọ́kasí sí Léfítíkù 18:5.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:28:53Z'
review_pass:
  verdict: revise
  source_fidelity: Àkọsílẹ̀ náà ní ìtumọ̀ pàtàkì tó dára fún γάρ, δικαιοσύνη, νόμος, àti ζήσεται. Síbẹ̀, γράφει ὅτι túmọ̀ sí “kọ pé,” kì í ṣe “kọ nípa … pé.” Bákan náà, ὁ ποιήσας ní δικαιοσύνην gẹ́gẹ́ bí ohun tí a ṣe; “ṣe é” lè ṣiṣẹ́ ní Yorùbá, ṣùgbọ́n ó jẹ́ kí ìtọ́kasí ohun arọ́pò náà má ṣe hàn kedere. Gíríìkì náà ní ἐν αὐτῇ (“nínú rẹ̀”), pẹ̀lú αὐτῇ tó jẹ́ abo ẹyọ kan tí ó ń tọ́ka sí òdodo; a kò gbọ́dọ̀ fi “nípa rẹ̀” rọ́pò ó nínú ọ̀rọ̀ àkọ́kọ́.
  naturalness: Ìtúnṣe náà máa jẹ́ Yorùbá ìkọ̀wé òde òní tó mọ́, tó sì ní ìwọ̀ntúnwọ̀nsì. “Òdodo tí ó wá láti inú Òfin” dára, ó sì kedere ju “tí ó ti inú Òfin wá” díẹ̀. Lílò “ẹni” jẹ́ àdánidá, ó sì lè ṣojú gbogbo ènìyàn láìfi ìtumọ̀ akọ nìkan kún un.
  terminology: “Òdodo” yẹ fún δικαιοσύνη nínú àríyànjiyàn Páùlù ní Róòmù, “Òfin” sì yẹ fún νόμος níhìn-ín. “Mósè,” “Páùlù,” àti “Léfítíkù” ni ìlò orúkọ tó bójú mu. A pa ìmúrasílẹ̀ ẹsẹ̀ Léfítíkù 18:5 mọ́, ṣùgbọ́n a tún pa ìtọ́kasí abo-ẹyọ-kan ti Gíríìkì mọ́.
  issues:
  - severity: medium
    issue: “Mósè kọ nípa … pé” kò tẹ̀lé ìkọ́lé γράφει ὅτι dáadáa.
    rationale: Ìṣọ̀kan náà túmọ̀ sí “Mósè kọ pé,” nígbà tí apá tí ó tẹ̀lé jẹ́ àkóónú ohun tí ó kọ, kì í ṣe ohun tí ó kọ nípa rẹ̀ nìkan.
  - severity: medium
    issue: “Ẹni tí ó bá ṣe é” fi ohun tí a ṣe sílẹ̀ nínú arọ́pò-orúkọ tí kò ṣe kedere.
    rationale: δικαιοσύνην ni ohun taara ti ὁ ποιήσας. Ṣíṣàfihàn “òdodo” lẹ́ẹ̀kan sí i mú ìbáṣepọ̀ gírámà náà hàn, ó sì yẹra fún ìdààmú pé “é” lè tọ́ka sí Òfin.
  - severity: medium
    issue: “nípa rẹ̀” nínú ọ̀rọ̀ àkọ́kọ́ jẹ́ ìtumọ̀ àlàyé dípò ìtumọ̀ gígùn ἐν αὐτῇ.
    rationale: SBLGNT ní “ἐν αὐτῇ,” ìyẹn “nínú rẹ̀.” Nítorí ìtọ́kasí Léfítíkù, “nípa rẹ̀” lè jẹ́ àlàyé ìtumọ̀, ṣùgbọ́n ó yẹ kí ó wà nínú àlàyé ìsàlẹ̀, kì í ṣe kí ó rọ́pò ìtumọ̀ gígùn náà.
