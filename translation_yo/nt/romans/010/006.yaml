id: ROM.10.6
reference: Romans 10:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: yo
  text: 'Ṣùgbọ́n òdodo[a] tí ó ti inú ìgbàgbọ́ wá ń sọ báyìí: “Má ṣe wí nínú ọkàn rẹ pé, ‘Ta ni yóò gòkè lọ sí ọ̀run?’”[c] (èyí ni láti mú Mèsáyà[b] sọ̀kalẹ̀ wá).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìdájọ́ òdodo tí ó ti inú ìgbàgbọ́ wá.” Ọ̀rọ̀ Gíríìkì δικαιοσύνη lè ní ìtumọ̀ “òdodo” àti “ìdájọ́ òdodo” nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Kristi”; a túmọ̀ ọ́ sí “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, kì í ṣe bí orúkọ lásán.
    reason: lexical_alternative
  - marker: c
    text: Pọ́ọ̀lù ń tọ́ka sí Diutarónómì 30:12, ó sì ń fi ọ̀rọ̀ náà ṣàlàyé nípa Mèsáyà.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìtumọ̀ Pọ́ọ̀lù nípa jíjẹ́ ẹni tí ó tọ́ níwájú Ọlọ́run, ó sì tún lè ní ìbáṣepọ̀ pẹ̀lú ìdájọ́ òdodo; a fi ìtumọ̀ kejì náà sínú àlàyé ìsàlẹ̀.
- source_word: ἐκ πίστεως
  choice: tí ó ti inú ìgbàgbọ́ wá
  rationale: Èyí ṣe àfihàn ἐκ gẹ́gẹ́ bí orísun, ó sì pa ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe láàárín òdodo láti inú ìgbàgbọ́ àti èyí tí ó dá lórí òfin mọ́.
- source_word: οὕτως λέγει
  choice: ń sọ báyìí pé
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa àsìkò ìsinsìnyí àti fífi òdodo hàn bí ẹni tí ń sọ̀rọ̀ mọ́.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Má ṣe wí nínú ọkàn rẹ pé
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ tí a fa yọ, ó sì pa èrò ọkàn ẹni—ibi ìrònú àti ète—mọ́.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Ta ni yóò gòkè lọ sí ọ̀run?
  rationale: “Gòkè lọ sí ọ̀run” jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì bá ìṣípò ἀναβήσεται ... εἰς mu.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Ní àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró, nítorí náà “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ ju lílo rẹ̀ bí orúkọ lọ.
- source_word: καταγαγεῖν
  choice: láti mú ... sọ̀kalẹ̀ wá
  rationale: Ìtòlẹ́sẹẹsẹ aláṣẹ “mú ... sọ̀kalẹ̀ wá” sọ ìṣe transitive náà ní Yorùbá àdánidá, ó sì pa ìdarí sísàlẹ̀ mọ́.
theological_decisions:
- issue: Fífi “òdodo láti inú ìgbàgbọ́” hàn bí ẹni tí ń sọ̀rọ̀
  choice: 'A pa àkànlò-ẹni náà mọ́: “òdodo ... ń sọ báyìí pé.”'
  alternative: “Ohun tí òdodo láti inú ìgbàgbọ́ sọ ni pé ...”
  rationale: δικαιοσύνη ni olùṣe gírámà fún λέγει; pípa èyí mọ́ ń gbé ọ̀nà àsọyé Pọ́ọ̀lù àti ìyàtọ̀ rẹ̀ sí ẹsẹ tó ṣáájú jáde.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àlàyé Pọ́ọ̀lù lórí Ìwé Mímọ́ níbí, ọ̀rọ̀ náà ń ṣiṣẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ ẹni àmì òróró náà hàn láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Ìtumọ̀ àsọyé òfin nínú Diutarónómì sí Mèsáyà
  choice: 'A pa àlàyé Pọ́ọ̀lù mọ́ nínú àkámọ́: “èyí túmọ̀ sí láti mú Mèsáyà sọ̀kalẹ̀ wá.”'
  alternative: Kí a darapọ̀ àlàyé náà mọ́ ọ̀rọ̀ tí a fa yọ láìsí àkámọ́.
  rationale: Àkámọ́ ń jẹ́ kí ó ṣe kedere pé ọ̀rọ̀ ìkẹyìn jẹ́ àlàyé Pọ́ọ̀lù sí ìbéèrè náà, kì í ṣe apá kan nínú ọ̀rọ̀ Diutarónómì tí ó fa yọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, tó níyì, tó sì rọrùn fún òǹkàwé gbogbogbò. A pa ìrísí àsọyé Ìwé Mímọ́ àti àkànlò-ẹni Pọ́ọ̀lù mọ́ láìjẹ́ kí gbólóhùn náà le ju bó ṣe yẹ lọ.
