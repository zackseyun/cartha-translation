id: ROM.10.21
reference: Romans 10:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: yo
  text: Ṣùgbọ́n nípa Ísírẹ́lì, ó sọ pé[a], “Ní gbogbo ọjọ́ ni mo na ọwọ́ mi méjèèjì sí àwọn ènìyàn aláìgbọ́ràn àti alátakò[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n ó sọ fún Ísírẹ́lì pé.” Ìṣètò ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ọ̀rọ̀ nípa Ísírẹ́lì tàbí ọ̀rọ̀ tí a sọ sí Ísírẹ́lì ní tààrà.
    reason: alternative_reading
  - marker: b
    text: “Aláìgbọ́ràn” tún lè ní ìtumọ̀ “aláìgbàgbọ́” tàbí “ẹni tí ó kọ̀ láti gba ọ̀rọ̀ gbọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn tí wọ́n ń tako,” “àwọn tí wọ́n ń sọ̀rọ̀ lòdì,” tàbí “àwọn tí wọ́n ń tako ọ̀rọ̀ náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Ṣùgbọ́n nípa Ísírẹ́lì
  rationale: “Nípa” mú kí Ísírẹ́lì jẹ́ kókó ọ̀rọ̀ náà, bí ìtumọ̀ tó ṣeé ṣe jù lọ nínú àyíká yìí; síbẹ̀, “sí Ísírẹ́lì” tún ṣeé gbà, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: λέγει
  choice: ó sọ pé
  rationale: A pa àsìkò ìsinsìnyí ti ọ̀nà ìtọ́kasí Pọ́ọ̀lù mọ́ ní èdè Yorùbá. A kò fi orúkọ Ọlọ́run kún ọ̀rọ̀ pàtàkì, nítorí olùṣe náà kò hàn gbangba nínú Gíríìkì ẹsẹ yìí.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Ọjọ́ náà gbogbo
  rationale: Èyí tọ́ka sí gbogbo gígùn ọjọ́ náà, kì í ṣe dandan pé “ojoojúmọ́”; ó sì bá accusative of extent of time mu.
- source_word: ἐξεπέτασα
  choice: mo na
  rationale: Ọ̀rọ̀ yìí mú àwòrán ẹni tó na ọwọ́ sí ẹlòmíràn jáde ní ti ẹ̀dá, láìfi ìtumọ̀ àkókò kan tí Gíríìkì kò fi dandan múlẹ̀ kún un.
- source_word: τὰς χεῖράς μου
  choice: ọwọ́ mi méjèèjì
  rationale: “Méjèèjì” pa ọ̀pọ̀ iye “ọwọ́” inú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: πρὸς λαὸν
  choice: sí àwọn ènìyàn
  rationale: “Sí” fi ìdarí ìṣe níná ọwọ́ hàn, “àwọn ènìyàn” sì sọ λαός ní ọ̀nà tó ṣe kedere ní Yorùbá.
- source_word: ἀπειθοῦντα
  choice: aláìgbọ́ràn
  rationale: Ó pa apá ìtumọ̀ ìkọ̀gbọ́ràn àti ìkọ̀ láti gba ọ̀rọ̀ gbọ́ mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn hàn.
- source_word: ἀντιλέγοντα
  choice: tí wọ́n sì ń sọ̀rọ̀ lòdì sí mi
  rationale: Èyí fi ìṣe sísọ lòdì tàbí àtakò inú ἀντιλέγω hàn ní kedere ju ọ̀rọ̀ àpapọ̀ kan lọ.
theological_decisions:
- issue: Bí Ísírẹ́lì ṣe dáhùn sí ìnà ọwọ́ Ọlọ́run
  choice: àwọn ènìyàn aláìgbọ́ràn tí wọ́n sì ń sọ̀rọ̀ lòdì sí mi
  alternative: àwọn ènìyàn aláìgbàgbọ́ tí wọ́n sì ń tako mi
  rationale: 'Ìtumọ̀ yìí pa méjèèjì mọ́: ìnà ọwọ́ olùsọ̀rọ̀ náà àti ìkọ̀gbọ́ràn pẹ̀lú àtakò àwọn ènìyàn. Kò sọ ju ohun tí àyọlò Aísáyà fúnra rẹ̀ sọ lọ nípa ipò Ísírẹ́lì.'
- issue: Ẹni tí ó sọ ọ̀rọ̀ inú àyọlò náà
  choice: A fi “ó” sílẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe fi olùṣe náà hàn láìdárúkọ rẹ̀ ní ẹsẹ yìí
  alternative: Ọlọ́run sọ pé
  rationale: Àyíká àyọlò náà tọ́ka sí Ọlọ́run, ṣùgbọ́n fífi orúkọ náà sínú ọ̀rọ̀ pàtàkì yóò sọ ohun tí Gíríìkì fi sí ìmọ̀ràn di ohun tí a sọ ní tààrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. “Ọjọ́ náà gbogbo” yàgò fún ìtumọ̀ “ojoojúmọ́,” “ọwọ́ mi méjèèjì” sì pa àwòrán ọ̀pọ̀ ọwọ́ inú orísun mọ́.
