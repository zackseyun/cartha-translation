id: ROM.10.19
reference: Romans 10:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: yo
  text: 'Ṣùgbọ́n mo béèrè pé, ṣé Ísírẹ́lì kò mọ̀? Mose ni ó kọ́kọ́ sọ pé,


    “Èmi yóò fi ohun tí kì í ṣe orílẹ̀-èdè mú kí ẹ jowú[a];


    ẹ̀mi yóò fi orílẹ̀-èdè aláìlóye mú kí ẹ bínú.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ yìí jẹ́ àyọlò láti inú Diutarónómì 32:21. “Ohun tí kì í ṣe orílẹ̀-èdè” lè tọ́ka sí àwọn ènìyàn tí a kò kà sí orílẹ̀-èdè tòótọ́, ìyẹn àwọn Kèfèrí.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: ṣé Ísírẹ́lì kò mọ̀ bí?
  rationale: Ó pa ìbéèrè àsọyé Gíríìkì mọ́, ó sì lo “mọ̀” fún ἔγνω láìfi ìtumọ̀ “lóye” mú un ní ọ̀nà kan ṣoṣo; ọ̀rọ̀ ìsàlẹ̀ ṣàlàyé pé ó tún lè túmọ̀ sí mímọ ìjẹ́pàtàkì ohun tí a gbọ́.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Mose ni ẹni àkọ́kọ́ tí ó sọ pé
  rationale: Èyí mú Mose hàn gẹ́gẹ́ bí ẹlẹ́rìí Ìwé Mímọ́ àkọ́kọ́ nínú ìtẹ̀lé ọ̀rọ̀ Paulu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: παραζηλώσω
  choice: mú kí ẹ jowú
  rationale: 'Ó pa ìṣe okùnfà náà mọ́: Ọlọ́run yóò lo àwọn ẹlòmíràn láti ru owú wọn sókè.'
- source_word: ἐπ’ οὐκ ἔθνει
  choice: fi ohun tí kì í ṣe orílẹ̀-èdè
  rationale: Ó pa ìsọfúnni àrà ọ̀tọ̀ inú àyọlò Diutarónómì mọ́, láìsọ ẹni tí gbólóhùn náà ń tọ́ka sí ní tààràtà.
- source_word: ἔθνει ἀσυνέτῳ
  choice: fi orílẹ̀-èdè aláìlóye
  rationale: “Aláìlóye” ṣàfihàn àìní òye inú ἀσυνέτῳ ju ọ̀rọ̀ tí ó lè túmọ̀ sí òmùgọ̀ lásán lọ, ó sì bá èdè Yorùbá òde òní mu.
- source_word: παροργιῶ
  choice: mú inú bí yín
  rationale: 'Ó sọ ìtumọ̀ okùnfà náà ní Yorùbá àdánidá: yóò mú kí wọ́n bínú.'
- source_word: ὑμᾶς
  choice: ẹ / yín
  rationale: Àwọn arọ́pò-orúkọ wọ̀nyí fi hàn pé ẹni kejì ọ̀pọ̀ ni Gíríìkì ń bá sọ̀rọ̀.
theological_decisions:
- issue: Ẹni tí “ohun tí kì í ṣe orílẹ̀-èdè” àti “orílẹ̀-èdè aláìlóye” ń tọ́ka sí
  choice: A pa ọ̀rọ̀ àyọlò náà mọ́ láìdá ẹni tí ó ń tọ́ka sí lórúkọ nínú ẹsẹ̀.
  alternative: Àwọn Kèfèrí, tàbí àwọn ènìyàn tí Ísírẹ́lì kò kà sí orílẹ̀-èdè tòótọ́.
  rationale: Paulu ń fa Diutarónómì 32:21 yọ láti fi hàn pé Ìwé Mímọ́ ti sọ tẹ́lẹ̀ pé Ọlọ́run yóò lo àwọn ènìyàn òde láti ru Ísírẹ́lì sókè. Fífi ọ̀rọ̀ àyọlò náà sílẹ̀ bí ó ti rí ń pa àìdánilójú àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “Mose” gẹ́gẹ́ bí orúkọ Bíbélì tí ó wọ́pọ̀. Àmì ohùn kún ibi tí ó bá yẹ. Àmì ọ̀rọ̀ ìsàlẹ̀ [a] wà nínú ọ̀rọ̀ pàtàkì.
