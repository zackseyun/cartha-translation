  source_fidelity: 'Ìtumọ̀ náà fi ìbéèrè àsọyé Gíríìkì náà (μὴ οὐκ ἤκουσαν) hàn dáadáa nínú “ṣé wọn kò gbọ́?”, ó sì fi ìmúdájú to lágbára ti μενοῦνγε hàn nínú “Dájúdájú, wọ́n gbọ́.” Àyọlò náà pa ìbáramu ewì ti φθόγγος/ῥήματα àti γῆ/οἰκουμένη mọ́: “Ìró ... gbogbo ayé” àti “àwọn ọ̀rọ̀ ... ilẹ̀ ayé tí ènìyàn ń gbé.” “Ti jáde lọ” jẹ́ ìlò Yorùbá tí ó bojú mu fún aorist nínú àyọlò tí ipa rẹ̀ ń bá ìjàpẹẹrẹ Pọ́ọ̀lù lọ.'
