id: ROM.10.18
reference: Romans 10:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: yo
  text: 'Ṣùgbọ́n mo béèrè pé, ṣé wọn kò gbọ́? Dájúdájú, wọ́n gbọ́:


    “Ìró wọn ti jáde lọ sí gbogbo ayé,

    àwọn ọ̀rọ̀ wọn sì dé òpin ilẹ̀ ayé tí ènìyàn ń gbé.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohùn wọn ti jáde lọ sí gbogbo ayé.”
    reason: lexical_alternative
  - marker: b
    text: Pọ́ọ̀lù ń fa Sáàmù 19:4 yọ, ó sì ń lo èdè rẹ̀ fún bí ìhìn tí a kéde ṣe tàn ká.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: ṣé wọn kò gbọ́?
  rationale: Ìbéèrè àsọyé tí ó ń retí ìdáhùn rere ni gbolohun Gíríìkì náà; ìtumọ̀ yìí jẹ́ ti ara Yorùbá, ó sì pa ìbéèrè náà mọ́.
- source_word: μενοῦνγε
  choice: Dájúdájú, wọ́n gbọ́
  rationale: Ó fi ìdáhùn rere tí ó lágbára hàn, ó sì sọ ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ di mímọ́ ní Yorùbá.
- source_word: φθόγγος
  choice: ìró
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìró tàbí ohùn; “ìró” kò fi dandan sọ pé ohùn ènìyàn ni, ó sì bá àyíká Sáàmù 19 mu.
- source_word: γῆ
  choice: gbogbo ayé
  rationale: Nínú àyọlò ewì tí ó ní ìwọ̀n gbogbo ayé yìí, “ayé” dára ju “ilẹ̀” tí ó lè tọ́ka sí agbègbè kan lọ.
- source_word: ἐξῆλθεν
  choice: ti jáde lọ
  rationale: Ìsọ̀rí “ti” ní Yorùbá fi ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ sì wà hàn lọ́nà àdánidá.
- source_word: πέρατα
  choice: òpin
  rationale: “Dé òpin” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ ìdé àwọn ibi jíjìnnà jù lọ, ó sì pa ìbáramu ewì mọ́.
- source_word: οἰκουμένης
  choice: ilẹ̀ ayé tí ènìyàn ń gbé
  rationale: Ó mú ìtumọ̀ pàtó ti “ayé tí a ń gbé” jáde, dípò kí a fi “ayé” nìkan túmọ̀ rẹ̀.
- source_word: ῥήματα
  choice: àwọn ọ̀rọ̀
  rationale: Èyí ni ìtumọ̀ tààrà, ó sì pa ìbáramu pẹ̀lú “ìró” mọ́ láì túmọ̀ rẹ̀ sí “ìhìn iṣẹ́” ní ọ̀nà àlàyé.
theological_decisions:
- issue: Ohun tí arọ́pò-orúkọ “wọn” ń tọ́ka sí nínú àyọlò Sáàmù tí Pọ́ọ̀lù lò
  choice: Pa “wọn” mọ́ láì fi ẹni tàbí ohun tí ó ń tọ́ka sí kún un
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí àwọn ọ̀run inú Sáàmù 19, tàbí gẹ́gẹ́ bí àwọn oníwàásù/apọ́sítélì nínú lílò Pọ́ọ̀lù
  rationale: Pọ́ọ̀lù fa ọ̀rọ̀ Sáàmù 19 yọ, ó sì lò ó nínú àríyànjiyàn rẹ̀ nípa ohun tí a kéde. Fífi arọ́pò-orúkọ náà sílẹ̀ pa àìdájú ìtọ́kasí àti ìfọ̀rọ̀wérọ̀ láàárín àwọn ọ̀rọ̀ méjèèjì mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní àmì ohùn ní kíkún, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ìlà ewì fún àyọlò Sáàmù. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì; a kò fi àlàyé míì sí “ilẹ̀ ayé tí ènìyàn ń gbé” nítorí ìtumọ̀ náà ti hàn gbangba nínú ọ̀rọ̀.
