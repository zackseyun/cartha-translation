  source_fidelity: Ìbéèrè àkọ́kọ́ náà pa ìtumọ̀ κηρύξωσιν àti ohùn àìṣe ἀποσταλῶσιν mọ́ dáadáa. Ṣùgbọ́n nínú àyọlò náà, àfikún “Ẹ wo” kò sí nínú ọ̀rọ̀ Gíríìkì, ó sì yí ìkéde ìyàlẹ́nu “Bí ... ṣe lẹ́wà tó!” padà sí ìpè sí olùgbọ́. “Dára” fún ὡραῖοι tún fọ àwòrán ẹwà/ìfẹ́sẹ̀tẹ̀ àwọn ẹsẹ̀ náà rọra ju.
  naturalness: “Báwo ni wọn yóò ṣe kéde bí a kò bá rán wọn?” jẹ́ Yorùbá boṣewa tó rọrùn. A lè mú àyọlò náà dára síi nípa lílo ìkéde ìyàlẹ́nu Yorùbá taara, láìfi “Ẹ wo” kún un. “Ìròyìn rere” jẹ́ ìsọ̀rọ̀ òde-òní tó dára fún εὐαγγελιζομένων.
  terminology: “Kéde,” “rán,” àti “ẹsẹ̀” yẹ. “Lẹ́wà” dára ju “dára” lọ fún ὡραῖοι nínú àwòrán yìí; àlàyé ìsàlẹ̀ lè pa ìtumọ̀ “káàbọ̀” tàbí “ní àkókò tí ó yẹ” mọ́. “Ìròyìn rere nípa àwọn ohun rere” ń ṣètọju ìyàtọ̀ láàrin εὐαγγελιζομένων àti τὰ ἀγαθά.
