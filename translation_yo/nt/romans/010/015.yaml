id: ROM.10.15
reference: Romans 10:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: yo
  text: Àti báwo ni wọn yóò ṣe kéde bí a kò bá rán wọn? Gẹ́gẹ́ bí a ti kọ ọ́ pé, “Bí ẹsẹ̀ àwọn tí ń mú ìròyìn rere nípa àwọn ohun rere ṣe lẹ́wà[a] tó!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí dídé wọn ṣe ṣe káàbọ̀ tó,” tàbí “bí dídé wọn ṣe yẹ ní àkókò rẹ̀ tó.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹwà, àti sí dídé oníròyìn tí ó yẹ, tí inú ènìyàn sì dùn sí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “àwọn tí ń mú ìròyìn rere nípa àwọn ohun rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: kéde
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pípolongo ní gbangba. “Kéde” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìtumọ̀ náà mọ́ ìwàásù inú ìjọ nìkan.
- source_word: ἀποσταλῶσιν
  choice: bí a kò bá rán wọn
  rationale: Èyí pa ohùn àìṣe ti ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé ẹni mìíràn ni ó rán wọn, láìsọ ẹni náà ní pàtó.
- source_word: καθὼς γέγραπται
  choice: Gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó bójú mu fún gbólóhùn tí a fi ń ṣáájú àyọlò Ìwé Mímọ́.
- source_word: ὡραῖοι
  choice: dára
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà lè tọ́ka sí ẹwà, ìdùnnú, tàbí bí dídé oníròyìn ṣe yẹ ní àkókò rẹ̀. “Dára” mú ìtumọ̀ gbòòrò yìí wọ Yorùbá àdánidá; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn.
- source_word: πόδες
  choice: ẹsẹ̀
  rationale: A pa àwòrán ara tí ó wà nínú àyọlò náà mọ́; ó dúró fún dídé àwọn oníròyìn.
- source_word: εὐαγγελιζομένων
  choice: àwọn tí ń mú ìròyìn ayọ̀
  rationale: Èyí bá àwòrán àwọn oníròyìn arìnrìn-àjò mu, kò sì sọ ọ́ di ọ̀rọ̀ iṣẹ́ ìjọ kan pàtó.
- source_word: τὰ ἀγαθά
  choice: nípa àwọn ohun rere
  rationale: A pa ọ̀rọ̀ Gíríìkì tó túmọ̀ ní tààrà sí “àwọn ohun rere” mọ́, dípò kí a ṣàkópọ̀ rẹ̀ mọ́ “ìròyìn ayọ̀.”
theological_decisions:
- issue: Ìbáṣepọ̀ àyọlò nípa oníròyìn pẹ̀lú ìkéde ìhìnrere
  choice: Pa àwòrán àwọn tí a rán tí wọ́n ń mú ìròyìn ayọ̀ mọ́, láìfi ìkéde náà mọ́ àwọn oníwàásù tí a yàn sí ipò nìkan.
  alternative: Lo “wàásù” àti “wàásù ìhìnrere,” èyí tí ó lè mú kí a rò pé iṣẹ́ àwọn olórí ìjọ nìkan ni.
  rationale: Àròkọ Pọ́ọ̀lù so rírán ènìyàn pọ̀ mọ́ ìkéde, ṣùgbọ́n àyọlò Aísáyà ń yọ̀ sí dídé àwọn tí ń kéde ìròyìn rere. Ìtumọ̀ yìí pa méjèèjì mọ́ láìfi ẹ̀kọ́ nípa ipò iṣẹ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa ìbéèrè oníròyìn, ohùn àìṣe, àti àwòrán ẹsẹ̀ àwọn oníròyìn mọ́.
