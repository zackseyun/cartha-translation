revisions:
- from: Àti pé báwo ni wọn yóò ṣe kéde bí a kò bá rán wọn? Gẹ́gẹ́ bí a ti kọ ọ́ pé, “Ẹ wo bí ẹsẹ̀ àwọn tí ń mú ìròyìn ayọ̀ nípa àwọn ohun rere ti dára tó!”[a][b]
  to: Àti báwo ni wọn yóò ṣe kéde bí a kò bá rán wọn? Gẹ́gẹ́ bí a ti kọ ọ́ pé, “Bí ẹsẹ̀ àwọn tí ń mú ìròyìn rere nípa àwọn ohun rere ṣe lẹ́wà[a] tó!”[b]
  rationale: Àtúnṣe náà yọ àṣẹ tí kò sí nínú Gíríìkì kúrò, ó sì tún fi ìkéde ìyàlẹ́nu tí Ὡς ὡραῖοι ní hàn. A rọ́pò “dára” pẹ̀lú “lẹ́wà” láti pa àwòrán ẹwà àwọn ẹsẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ ń ṣètọju ìtànilẹ́yìn pé ọ̀rọ̀ náà tún lè tọ́ka sí dídé tí a káàbọ̀ sí tàbí tí ó yẹ ní àkókò. A tún gbe àwọn àmì àlàyé sí ibi tí wọ́n ń tọ́ka sí gan-an.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:28:54Z'
