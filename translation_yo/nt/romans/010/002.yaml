- from: Nítorí mo jẹ́rìí nípa wọn pé wọ́n ní ìtara fún Ọlọ́run[a], ṣùgbọ́n kì í ṣe ní ìbámu pẹ̀lú ìmọ̀[b].
  to: Nítorí mo jẹ́rìí nípa wọn pé wọ́n ní ìtara fún Ọlọ́run[a], ṣùgbọ́n ìtara náà kò bá ìmọ̀ mu[b].
  rationale: Àtúnṣe náà mú gbolóhùn ìyàtọ̀ náà rọrùn, ó sì jẹ́ kí ó ṣe kedere pé ìtara wọn ni kò bá ìmọ̀ mu. Ó pa àìdánilójú ìwọ̀n ἐπίγνωσις mọ́, ó sì pa ìtumọ̀ jénítífù θεοῦ gẹ́gẹ́ bí ìtara tí ó darí sí Ọlọ́run mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:28:42Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi μαρτυρῶ γὰρ αὐτοῖς, ζῆλον θεοῦ ἔχουσιν, àti ìyàtọ̀ ἀλλ’ οὐ κατ’ ἐπίγνωσιν hàn dáadáa. “Ìtara fún Ọlọ́run” jẹ́ ìtumọ̀ tó bójú mu fún jénítífù náà, láì sọ pé ìtara Ọlọ́run fúnra rẹ̀ ni wọ́n ní.
  naturalness: “Kì í ṣe ní ìbámu pẹ̀lú ìmọ̀” lè dun bí ìsọfúnni àṣà tàbí ìwà tó máa ń ṣẹlẹ̀, ó sì jẹ́ kí ohun tí a ń sọ̀rọ̀ rẹ̀ má hàn gbangba. “Ìtara náà kò bá ìmọ̀ mu” jẹ́ Yorùbá àdánidá síi, ó sì pa ìtumọ̀ κατά + ἐπίγνωσιν mọ́.
  terminology: “Jẹ́rìí,” “ìtara,” “Ọlọ́run,” àti “ìmọ̀” yẹ fún ìforúkọsílẹ̀ ẹsẹ náà. A kò gbọdọ̀ sọ “ìmọ̀ tòótọ́” sínú ọ̀rọ̀ àkọ́kọ́, nítorí ìyẹn lè túmọ̀ ἐπίγνωσις lọ síwájú; a lè fi “ìmọ̀ kíkún” sí ìsàlẹ̀-ojúewé gẹ́gẹ́ bí àṣàyàn.
  issues:
