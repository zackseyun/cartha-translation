id: ROM.10.2
reference: Romans 10:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: yo
  text: Nítorí mo jẹ́rìí nípa wọn pé wọ́n ní ìtara fún Ọlọ́run[a], ṣùgbọ́n ìtara náà kò bá ìmọ̀ mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ní ìtara Ọlọ́run”; jénítífù Gíríìkì náà lè jẹ́ ìtumọ̀ tààràtà bẹ́ẹ̀, ṣùgbọ́n ó ṣeé ṣe jù pé ìtara tí ó dojú kọ Ọlọ́run ni ó túmọ̀ sí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kì í ṣe pẹ̀lú ìmọ̀ kíkún” tàbí “kò dá lórí ìmọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: mo jẹ́rìí
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ ìṣe onítẹ̀síwájú ẹni àkọ́kọ́ mọ́, ó sì fi hàn pé Pọ́ọ̀lù ń sọ ohun tí òun mọ̀ dájú nípa wọn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé ẹsẹ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé sí i.
- source_word: αὐτοῖς
  choice: nípa wọn
  rationale: Nínú àyíká yìí, dátífù náà tọ́ka sí àwọn ẹni tí Pọ́ọ̀lù ń jẹ́rìí nípa wọn, kì í ṣe àwọn tó ń bá sọ̀rọ̀.
- source_word: ζῆλον
  choice: ìtara
  rationale: “Ìtara” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìfẹ́ gbígbóná àti ìfọkànsìn tó lágbára.
- source_word: θεοῦ
  choice: fún Ọlọ́run
  rationale: A gba jénítífù náà gẹ́gẹ́ bí ohun tí ìtara wọn darí sí; èyí yẹra fún ìtumọ̀ pé ìtara Ọlọ́run fúnra rẹ̀ ni wọ́n ní.
- source_word: ἔχουσιν
  choice: wọ́n ní
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó rọrùn, tó sì bá ọ̀rọ̀ ìṣe onítẹ̀síwájú náà mu.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ìtara wọn àti àìpé ìmọ̀ wọn.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: kì í ṣe ní ìbámu pẹ̀lú ìmọ̀
  rationale: Ó pa àkópọ̀ κατά àti ἐπίγνωσιν mọ́ láì fi “ìmọ̀ tòótọ́” tàbí “ìmọ̀ kíkún” kún un gẹ́gẹ́ bí ìtumọ̀ pàtó kan ṣoṣo.
theological_decisions:
- issue: Irú ìtara tí Ísírẹ́lì ní
  choice: Ìtara wọn darí sí Ọlọ́run, ṣùgbọ́n kò bá ìmọ̀ mu.
  alternative: Wọ́n ní ìtara Ọlọ́run fúnra rẹ̀, tàbí wọ́n ní ìtara ẹ̀sìn láì sọ ohun tí ó darí sí.
  rationale: 'Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń jẹ́wọ́ ìfọkànsìn wọn sí Ọlọ́run, nígbà tó tún ń ṣàríwísí àìní ìmọ̀ tó yẹ. Èyí pa ẹ̀dọ̀fu inú ọ̀rọ̀ náà mọ́: ó gba òótọ́ inú wọn, ṣùgbọ́n kò fìdí òye wọn múlẹ̀.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; “mo jẹ́rìí nípa wọn” àti “ní ìbámu pẹ̀lú ìmọ̀” pa agbára ẹ̀rí àti àìdánilójú tó wà nínú Gíríìkì mọ́.
