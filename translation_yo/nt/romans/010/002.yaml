    rationale: Gíríìkì náà ní ellipsis, ṣùgbọ́n Yorùbá ń rọrùn síi nígbà tí a bá tún “ìtara náà” sọ. “Kò bá ìmọ̀ mu” ń sọ àìbámu náà ní ọ̀nà adayeba láì yí ìtumọ̀ padà.
