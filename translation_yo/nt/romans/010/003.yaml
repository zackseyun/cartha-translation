  source_fidelity: 'Ìtumọ̀ náà ń gbé ìtumọ̀ pàtàkì Gíríìkì náà kalẹ̀ dáadáa: àìmọ̀ òdodo Ọlọ́run, ìfẹ́ láti fìdí òdodo tiwọn múlẹ̀, àti àìtẹríba sí òdodo Ọlọ́run. Ṣùgbọ́n “bí wọn kò ti mọ” ń mú ìdàgbàsókè oníṣekúṣe/àkókò kan wá tí kò hàn nínú participle ἀγνοοῦντες; “wọ́n kò mọ” dáa ju fún ìdí tí γάρ ń ṣàlàyé. Bákan náà, “ń wá ọ̀nà láti” fi ‘ọ̀nà’ kún ìtumọ̀ στῆσαι láìnídìí.'
