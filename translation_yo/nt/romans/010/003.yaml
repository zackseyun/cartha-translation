source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: yo
  text: 'Nítorí wọn kò mọ òdodo Ọlọ́run[a][b], wọ́n sì ń wá láti fi òdodo tiwọn múlẹ̀, wọn kò tẹrí ba fún òdodo Ọlọ́run.


    [a] A tún lè túmọ̀ ọ́ sí “ìdájọ́ òdodo” ní ibi méjèèjì tí “òdodo” ti fara hàn. Nínú àwọn ìwé Paulu, δικαιοσύνη lè tọ́ka sí òdodo, ìdájọ́ òdodo, tàbí ọ̀nà òdodo tí Ọlọ́run fi ń mú ènìyàn dúró ní ipò tí ó tọ́ níwájú rẹ̀.


    [b] Gbólóhùn náà “òdodo Ọlọ́run” tún lè túmọ̀ sí “òdodo láti ọ̀dọ̀ Ọlọ́run” tàbí “òdodo Ọlọ́run fúnra rẹ̀.” Ọ̀rọ̀ Gíríìkì náà gba ju ìtumọ̀ kan lọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìdájọ́ òdodo” ní ibi méjèèjì tí “òdodo” ti fara hàn. Nínú àwọn ìwé Paulu, δικαιοσύνη lè tọ́ka sí òdodo, ìdájọ́ òdodo, tàbí ọ̀nà òdodo tí Ọlọ́run fi ń mú ènìyàn dúró ní ipò tí ó tọ́ níwájú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà “òdodo Ọlọ́run” tún lè túmọ̀ sí “òdodo láti ọ̀dọ̀ Ọlọ́run” tàbí “òdodo Ọlọ́run fúnra rẹ̀.” Ọ̀rọ̀ Gíríìkì náà gba ju ìtumọ̀ kan lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: bí wọn kò ti mọ
  rationale: Ó sọ ipò tí ó fa ìkùnà wọn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti fi participle tí ń bá a lọ hàn láì sọ pé wọ́n mọ̀ọ́mọ̀ kọ̀ ọ́.
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ọ̀rọ̀ ẹsẹ tó ṣáájú.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó bójú mu jù fún ìtumọ̀ Paulu níbí; àlàyé ìsàlẹ̀ pa “ìdájọ́ òdodo” àti ọ̀nà Ọlọ́run ti mímú ènìyàn dúró ní rere mọ́ gẹ́gẹ́ bí àwọ̀ ìtumọ̀ míì.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsopọ̀ “òdodo Ọlọ́run” jẹ́ kíkúrú, ó sì lè gba ìtumọ̀ ohun tí ó jẹ́ ti Ọlọ́run tàbí ohun tí ó wá láti ọ̀dọ̀ rẹ̀, bí Gíríìkì náà ti ṣe.
- source_word: ἰδίαν
  choice: òdodo tiwọn
  rationale: Adjective náà dúró dípò “òdodo” tí a ti mẹ́nu kàn; Yorùbá nílò kí a tún orúkọ náà sọ kí ìtumọ̀ lè ṣe kedere àti àdánidá.
- source_word: ζητοῦντες
  choice: tí wọ́n sì ń wá ọ̀nà
  rationale: Ó pa ìṣe tí ń bá a lọ mọ́, ó sì dun bí Yorùbá òde òní.
- source_word: στῆσαι
  choice: láti fi ìdí ... múlẹ̀
  rationale: Àkànlò èdè yìí fi ìtumọ̀ “mú kí ó dúró ṣinṣin” tàbí “fìdí rẹ̀ múlẹ̀” hàn lọ́nà àdánidá.
- source_word: ὑπετάγησαν
  choice: wọn kò tẹrí ba fún
  rationale: Ó fi hàn pé wọn kò fi ara wọn sí abẹ́ òdodo Ọlọ́run, láì fi èdè àjèjì tàbí ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
theological_decisions:
- issue: Ìtumọ̀ “òdodo Ọlọ́run” nínú lílo Paulu
  choice: A lò “òdodo Ọlọ́run” láì pinnu bóyá ó túmọ̀ ní pàtàkì sí òdodo tí Ọlọ́run ní, òdodo tí ó wá láti ọ̀dọ̀ Ọlọ́run, tàbí iṣẹ́ ìgbàlà rẹ̀ tí ó bá òdodo mu.
  alternative: “òdodo láti ọ̀dọ̀ Ọlọ́run” tàbí “òdodo tí í ṣe ti Ọlọ́run”
  rationale: Genitive Gíríìkì náà lè ní àwọn àwọ̀ ìtumọ̀ wọ̀nyí papọ̀. Kí a má bàa fi ẹ̀kọ́ ìsìn kan ṣoṣo dí ọ̀rọ̀ náà mú, a pa àìdánilójú tó wà nínú orísun mọ́, a sì ṣàlàyé rẹ̀ ní àkọsílẹ̀ [b].
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. “Tẹrí ba fún” àti “fi ìdí ... múlẹ̀” jẹ́ àkànlò èdè àdánidá; a fi àmì ohùn sí ibi tí ó yẹ.
