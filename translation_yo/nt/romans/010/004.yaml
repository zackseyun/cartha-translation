  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: yo
  text: Nítorí Mèsáyà ni òpin Òfin fún òdodo fún gbogbo ẹni tí ó gbàgbọ́.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àfojúsùn” tàbí “àṣepé.” Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “òpin” lè túmọ̀ sí ìparí, àfojúsùn, tàbí àṣepé.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ìdájọ́ òdodo” dípò “òdodo” nínú lílo ọ̀rọ̀ Páùlù.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: òpin
  rationale: “Òpin” pa ìtumọ̀ Gíríìkì náà mọ́ ní ṣókí, ó sì lè tọ́ka sí ibi tí ohun kan parí tàbí ibi tí ó ń lépa; àlàyé ìsàlẹ̀ ojú-ìwé ṣàfihàn àwọn ìtumọ̀ míì.
- source_word: νόμου
  choice: òfin
  rationale: Nínú ọ̀rọ̀ Páùlù yìí, “òfin” tọ́ka sí Òfin Mósè gẹ́gẹ́ bí ohun tí àwọn òǹkàwé ti mọ̀ tẹ́lẹ̀.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, ní pàtàkì nínú àríyànjiyàn nípa Ísírẹ́lì àti òfin.
- source_word: εἰς δικαιοσύνην
  choice: láti mú òdodo wá
  rationale: Gbólóhùn yìí sọ ìdí tàbí àbájáde; yíyí rẹ̀ sí ọ̀nà yìí jẹ́ Yorùbá àdánidá láì pinnu pátápátá bóyá ìdí tàbí àbájáde ni Páùlù tẹnumọ́.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tí ó gbooro tó láti gbé èrò ìbáṣepọ̀ tó tọ́ àti ohun tí ó bá ìdájọ́ òdodo mu; àṣàyàn “ìdájọ́ òdodo” wà nínú àlàyé.
- source_word: παντὶ τῷ πιστεύοντι
  choice: fún gbogbo ẹni tí ó gbàgbọ́
  rationale: Èyí mú gbogbo ènìyàn kan ṣoṣo tí ó ń gbàgbọ́ wọ inú ọ̀rọ̀ náà, láì fi èrò ẹ̀kọ́ ìsìn míì kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: “Nítorí” so ẹsẹ yìí mọ́ àlàyé tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí ìtẹ̀síwájú àríyànjiyàn.
theological_decisions:
- issue: Ìtumọ̀ τέλος νόμου nípa Òfin Mósè
  choice: “òpin òfin” nínú ọ̀rọ̀ pàtàkì
  alternative: “èròǹgbà òfin,” “ibi tí òfin ń lépa,” tàbí “àṣepé òfin”
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ìparí, àfojúsùn, tàbí ibi tí ohun kan dé àṣepé. “Òpin” àti àlàyé [a] pa ìforígbárí ìtumọ̀ náà mọ́ dípò pípa á mọ́ sí ìtumọ̀ kan ṣoṣo.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká ọ̀rọ̀ nípa Ísírẹ́lì àti òfin mú kí ìtumọ̀ oyè náà hàn kedere ju lílo ọ̀rọ̀ bí orúkọ lọ.
- issue: Bí a ṣe túmọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” dára jù fún ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé [b] pa ìtumọ̀ tó sún mọ́ justice mọ́ nítorí pé ó lè nípa lórí bí a ṣe lóye ọ̀rọ̀ Páùlù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti èdè òde òní tó ní iyì. A lo “láti mú òdodo wá” láti yàgò fún àtúnṣe ọ̀rọ̀ “fún” lẹ́ẹ̀mejì tí kò dùn mọ́ etí ní Yorùbá, nígbà tí a ṣì pa agbára εἰς mọ́ gẹ́gẹ́ bí ìdí tàbí àbájáde.
