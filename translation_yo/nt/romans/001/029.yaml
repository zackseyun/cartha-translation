source:
  edition: SBLGNT
  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: yo
  text: wọ́n kún fún gbogbo àìṣòdodo[a], ìwà búburú, ojúkòkòrò àti ìkà; wọ́n kún fún ìlara, ìpànìyàn, ìjà, ẹ̀tàn àti ìkà inú; wọ́n jẹ́ afọ̀rọ̀-ẹ̀yìn[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “onírúurú àìṣòdodo”; gbólóhùn Gíríìkì náà fi hàn pé ìwọ̀n rẹ̀ gbòòrò dé gbogbo ọ̀nà.
    reason: lexical_alternative
  - marker: b
    text: “Afọ̀rọ̀-ẹ̀yìn” tún lè túmọ̀ sí àwọn tó ń tan òfófó tàbí tí wọ́n ń sọ̀rọ̀ abàmì nípa ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: wọ́n kún fún
  rationale: Ó ṣàfihàn ipò tí ó ti pé tí ó sì ń bá a lọ, ní ìbámu pẹ̀lú perfect passive participle, láì mú èdè Yorùbá le.
- source_word: πάσῃ
  choice: onírúurú
  rationale: Pẹ̀lú àwọn ọ̀rọ̀ àfojúrí tó tẹ̀ lé e, ‘onírúurú’ sọ bí ìwọ̀n náà ṣe gbòòrò ní Yorùbá àdánidá; àlàyé ìsàlẹ̀ tún pa àṣàyàn ‘gbogbo’ mọ́.
- source_word: ἀδικίᾳ
  choice: àìṣòdodo
  rationale: Ó gbé ìtumọ̀ ìwà tí kò tọ́ àti àìdájọ́ òdodo pọ̀, gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe gbòòrò nínú Pọ́ọ̀lù.
- source_word: πονηρίᾳ
  choice: ìwà búburú
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìbàjẹ́ ìwà ní gbogbogbòò.
- source_word: πλεονεξίᾳ
  choice: ojúkòkòrò
  rationale: Ó sọ ìfẹ́ onímọtara-ẹni-nìkan láti ní púpọ̀ sí i ní ọ̀nà tí òǹkàwé òde òní yóò lóye.
- source_word: κακίᾳ
  choice: arankàn
  rationale: Ó tẹnu mọ́ èrò láti ṣe ibi sí ẹlòmíràn, ó sì yàtọ̀ sí πονηρία, tí a tú sí ‘ìwà búburú.’
- source_word: μεστοὺς
  choice: wọ́n kún fún
  rationale: Ìtumọ̀ yìí jẹ́ àdánidá, ó sì fi ìkúnwọ́ vice-list náà hàn, bó tilẹ̀ jẹ́ pé Yorùbá kò nílò láti fi ìyàtọ̀ ọ̀rọ̀ Gíríìkì méjèèjì hàn nípa ọ̀rọ̀ ọ̀tọ̀.
- source_word: φθόνου
  choice: ìlara
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó péye jù fún ìbànújẹ́ nítorí ohun rere tí ẹlòmíràn ní.
- source_word: φόνου
  choice: ìpànìyàn
  rationale: Ó pa ìtumọ̀ ìwà ọ̀daràn àti ìwà búburú ti ‘murder’ mọ́ ju ‘pípa’ lásán lọ.
- source_word: ἔριδος
  choice: ìjà
  rationale: Ó jẹ́ ọ̀rọ̀ kúkúrú, tó wọ́pọ̀, fún awuyewuye àti ìforígbárí.
- source_word: δόλου
  choice: ẹ̀tàn
  rationale: Ó fi ìṣe fífi ọgbọ́n burúkú tan ẹlòmíràn jẹ hàn ní kedere.
- source_word: κακοηθείας
  choice: èrò búburú
  rationale: Ó ṣàfihàn ìwà inú tí ó máa ń túmọ̀ ohun sí búburú tàbí fẹ́ ibi sí ẹlòmíràn, láì da a pọ̀ mọ́ ‘arankàn’ pátápátá.
- source_word: ψιθυριστάς
  choice: afẹ̀yìn-sọ̀rọ̀
  rationale: Ó mú ìtumọ̀ ẹni tó ń sọ̀rọ̀ burúkú ní ìkọ̀kọ̀ tàbí lẹ́yìn ẹlòmíràn jáde ní Yorùbá tó ṣe kedere.
