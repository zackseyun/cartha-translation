source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: yo
  text: àwọn olùbanilórúkọjẹ́, àwọn olùkórìíra Ọlọ́run[a], àwọn aláìníìtìjú, àwọn agbéraga, àwọn afọ́nnu, àwọn tó ń pilẹ̀ ohun búburú, àwọn aláìgbọ́ràn sí òbí,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn tí Ọlọ́run kórìíra.”
    reason: alternative_reading
lexical_decisions:
- source_word: καταλάλους
  choice: àwọn olùbanilórúkọjẹ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tó ń sọ ohun tí yóò ba orúkọ ẹlòmíràn jẹ́. Yíyan yìí ṣe kedere, ó sì mú agbára ìwà búburú inú ọ̀rọ̀ Gíríìkì náà jáde.
- source_word: θεοστυγεῖς
  choice: àwọn olùkórìíra Ọlọ́run
  rationale: Ìtumọ̀ aláṣe, ìyẹn àwọn ènìyàn tí wọ́n kórìíra Ọlọ́run, bá àtòjọ ìwà búburú yìí mu dáadáa. Àmì àlàyé pa ìtumọ̀ afarahàn mọ́ gẹ́gẹ́ bí àṣàyàn.
- source_word: ὑβριστάς
  choice: àwọn aláfojúdi
  rationale: “Aláfojúdi” sọ ìwà àìbọ̀wọ̀, ìgbéraga àti lílo ẹlòmíràn ní ìlòkulò jáde láìfi ìtumọ̀ náà mọ́ ìwà ipá ara nìkan.
- source_word: ὑπερηφάνους
  choice: àwọn agbéraga
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ti ìlò òde òní, ó sì sọ èrò gíga tí ènìyàn ní nípa ara rẹ̀ jáde ní kedere.
- source_word: ἀλαζόνας
  choice: àwọn afínnú
  rationale: “Afínnú” ń tọ́ka sí ẹni tó ń fọ́nnu tàbí tó ń yangàn nípa ara rẹ̀, ó sì yàtọ̀ díẹ̀ sí “agbéraga” tó wà lẹ́gbẹ̀ẹ́ rẹ̀.
- source_word: ἐφευρετὰς κακῶν
  choice: àwọn tó ń pilẹ̀ ohun búburú
  rationale: Gbólóhùn yìí mú èrò àwọn tó ń ronú ọ̀nà tuntun láti ṣe búburú jáde, ó sì jẹ́ èdè Yorùbá tó rọrùn láti lóye.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: àwọn aláìgbọ́ràn sí òbí
  rationale: Yíyan yìí túmọ̀ ìbáṣepọ̀ atọ́ka ọ̀rọ̀ Gíríìkì náà ní tààrà, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ θεοστυγεῖς
  choice: 'aláṣe: “àwọn olùkórìíra Ọlọ́run”'
  alternative: 'afarahàn: “àwọn tí Ọlọ́run kórìíra”'
  rationale: Ìtumọ̀ aláṣe bá bí gbogbo àwọn ọ̀rọ̀ inú àtòjọ náà ṣe ń ṣàpèjúwe ìwà tàbí ìṣe ènìyàn mu. Síbẹ̀, nítorí pé a ti máa ń jíròrò ìtumọ̀ afarahàn náà látijọ́, a pa á mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàdá òde òní, tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò. A tún “àwọn” ṣe láti jẹ́ kí gbogbo ohun inú àtòjọ náà yéni bí àpèjúwe àwọn ènìyàn, nígbà tí a pa ìrísí àtòjọ kúkúrú ti Gíríìkì mọ́.
