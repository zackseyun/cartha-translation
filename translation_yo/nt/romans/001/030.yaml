  source_fidelity: Ìtumọ̀ náà mú àtòjọ àwọn ìwà búburú inú Gíríìkì jáde dáadáa, ó sì pa ìtumọ̀ aláṣe ti θεοστυγεῖς mọ́, pẹ̀lú ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀. Síbẹ̀, “aláfojúdi” túmọ̀ sí ẹni alágídí tàbí aláìgbọ́ràn ju ẹni aláìnítìjú/oníwà ìbàjẹ́ lọ; kò péye fún ὑβριστάς. “Afínnú” náà kò jẹ́ ìfẹ̀sẹ̀mulẹ̀ tó dára fún ἀλαζόνας; “afọ́nnu” ni ọ̀rọ̀ tó ṣe kedere fún ẹni afọ́nnu.
  naturalness: Àtòjọ náà jẹ́ Yorùbá òde òní tí ó ṣe kedere. Àwọn àtúnṣe náà mú ìyàtọ̀ tó yẹ wà láàárín ὑβριστάς, ὑπερηφάνους, àti ἀλαζόνας. A tún gbé àmì àlàyé lọ sí ọ̀rọ̀ θεοστυγεῖς tí àlàyé náà kan.
  terminology: “Àwọn aláìníìtìjú” fi ìwà àìbọ̀wọ̀ àti ìwà ìbàjẹ́ ti ὑβριστάς hàn dáadáa nínú àtòjọ yìí. “Àwọn agbéraga” yẹ fún ὑπερηφάνους, “àwọn afọ́nnu” sì yẹ fún ἀλαζόνας. “Àwọn olùkórìíra Ọlọ́run” pa ìtumọ̀ aláṣe tí ó ṣeé ṣe jù lọ mọ́; àlàyé ìsàlẹ̀ pa ìtumọ̀ afarahàn mọ́ láìdájọ́ ariyanjiyan náà.
