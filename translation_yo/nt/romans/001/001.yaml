  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: yo
  text: Pọ́ọ̀lù, ẹrú[a] Mèsáyà Jésù[b], àpọ́sítélì tí a pè[c], tí a yà sọ́tọ̀ fún ìhìn rere Ọlọ́run,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́”; ní ìtumọ̀ ìbílẹ̀, “ẹrú-ọ̀dọ̀ olúwa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kristi Jésù.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹni tí a pè gẹ́gẹ́ bí àpọ́sítélì”; a tún lè túmọ̀ rẹ̀ sí “ẹni tí a pè láti jẹ́ àpọ́sítélì.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Ìkọ̀wé orúkọ yìí ni ó wọ́pọ̀, tí ó sì ṣe kedere ní Yorùbá.
- source_word: δοῦλος
  choice: ẹrú
  rationale: “Ẹrú” fi ipò ẹni tí ó jẹ́ ti olúwa rẹ̀ hàn kedere ju “ìránṣẹ́” lọ, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́ ní àyíká yìí.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: “Mèsáyà” túmọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró, nígbà tí “Jésù” jẹ́ ìkọ̀wé orúkọ náà ní Yorùbá.
- source_word: κλητὸς ἀπόστολος
  choice: ẹni tí a pè gẹ́gẹ́ bí àpọ́sítélì
  rationale: Ó sọ ìpè Pọ́ọ̀lù àti ipò àpọ́sítélì rẹ̀ ní Yorùbá àdánidá, láìfi “láti jẹ́” kún ọ̀rọ̀ orísun láìṣàlàyé.
- source_word: ἀφωρισμένος
  choice: tí a yà sọ́tọ̀
  rationale: Ó pa ìtumọ̀ aláìṣe ti ọ̀rọ̀ náà mọ́, ó sì lè tọ́ka sí yíyan ẹni kan sọ́tọ̀ fún iṣẹ́ pàtó.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: fún ìhìn rere Ọlọ́run
  rationale: “Fún” fi ète hàn ní ṣókí; “ìhìn rere” jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún εὐαγγέλιον, “Ọlọ́run” sì pa ìbáṣepọ̀ genitive mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìdánimọ̀ Pọ́ọ̀lù
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Níbí, Χριστός ṣì lè ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ ẹni àmì òróró jáde, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà ìbílẹ̀ “Kristi” hàn.
- issue: Ìtumọ̀ δοῦλος
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: “Ẹrú” pa ìbáṣepọ̀ jíjẹ́ ti olúwa àti ìgbọràn tó lágbára mọ́; “ìránṣẹ́” rọrùn sí etí ṣùgbọ́n ó lè dín agbára δοῦλος kù.
- issue: Ìtumọ̀ κλητὸς ἀπόστολος
  choice: ẹni tí a pè gẹ́gẹ́ bí àpọ́sítélì
  alternative: ẹni tí a pè láti jẹ́ àpọ́sítélì
  rationale: Àṣàyàn àkọ́kọ́ yẹra fún fífi ète tí “láti jẹ́” lè túmọ̀ kún un, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ yẹn sílẹ̀ gẹ́gẹ́ bí ọ̀nà Yorùbá míì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. Àwọn gbólóhùn mẹ́ta tó ń ṣàpèjúwe Pọ́ọ̀lù ni a pa mọ́ ní ọ̀nà apposition, a sì fi àmì kọ́mà ìparí sílẹ̀ nítorí ẹsẹ yìí ń bá a lọ sínú ẹsẹ tó tẹ̀ lé e.
