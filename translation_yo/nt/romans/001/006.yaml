  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: yo
  text: Ẹ̀yin náà wà lára wọn, ẹ̀yin tí a pè láti jẹ́ ti Jésù Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin tí Jésù Mèsáyà pè,” tàbí ní ọ̀rọ̀ gangan, “àwọn ẹni tí a pè, ti Jésù Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν οἷς
  choice: wà lára wọn
  rationale: Ọ̀rọ̀ yìí tọ́ka sí àwọn Kèfèrí tí ẹsẹ tó ṣáájú mẹ́nu kàn, ó sì fi hàn pé àwọn onígbàgbọ́ ní Róòmù wà nínú ẹgbẹ́ wọn.
- source_word: καὶ ὑμεῖς
  choice: Ẹ̀yin náà
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ pé àwọn olùgbọ́ náà wà lára ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: κλητοὶ
  choice: tí a pè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé wọ́n jẹ́ àwọn ẹni tí a pè, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: A mú Ἰησοῦ gẹ́gẹ́ bí orúkọ ẹni, a sì tú Χριστοῦ gẹ́gẹ́ bí oyè náà, ‘Mèsáyà.’
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: tí a pè láti jẹ́ ti Jésù Mèsáyà
  rationale: Ìtumọ̀ yìí sọ ìbáṣepọ̀ tàbí jíjẹ́ ohun-ìní tí àkójọpọ̀ ọ̀rọ̀ Gíríìkì lè ní lọ́nà Yorùbá tó ṣe déédéé; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ míì mọ́.
theological_decisions:
- issue: Irú ìbáṣepọ̀ tí ọ̀rọ̀ genitive ní nínú κλητοὶ Ἰησοῦ Χριστοῦ
  choice: tí a pè láti jẹ́ ti Jésù Mèsáyà
  alternative: ẹ̀yin tí Jésù Mèsáyà pè; àwọn ẹni tí a pè, ti Jésù Mèsáyà
  rationale: Gíríìkì náà ṣókí, ó sì lè tọ́ka sí jíjẹ́ ti Mèsáyà, sí ẹni tó pè wọ́n, tàbí sí ìbáṣepọ̀ lásán. Ọ̀rọ̀ inú ẹsẹ yan ìtumọ̀ tó ṣe déédéé jù ní Yorùbá, àlàyé sì jẹ́ kí àìdánilójú ojúlówó náà dúró.
translation_notes:
  register: Yorùbá àgbáyélujára tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó ti bá èdè mu.
