translation:
  language: yo
  text: Èyí ni pé, kí n lè bá yín jọ gba ìṣírí[a] nípasẹ̀ ìgbàgbọ́ tí a jọ ní[b]—ìgbàgbọ́ yín àti tèmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “kí a lè jọ gba ìṣírí ní àárín yín.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “nípasẹ̀ ìgbàgbọ́ tí ó wà láàárín ara wa, tiyín àti tèmi”; èyí ń tẹnumọ́ ìṣírí alájọṣepọ̀ nípasẹ̀ ìgbàgbọ́ tí a jọ ní.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: Èyí ni pé
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń ṣàlàyé ọ̀rọ̀ tí ó ṣẹ̀ṣẹ̀ sọ; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó sì pa agbára àlàyé náà mọ́.
- source_word: συμπαρακληθῆναι
  choice: kí n lè bá yín jọ gba ìṣírí
  rationale: ‘Bá yín jọ’ pa ìtumọ̀ ìṣe alájọṣepọ̀ inú προθετικό συν- mọ́, ‘kí n lè’ sì tẹ̀ lé ojú ìwòye Pọ́ọ̀lù nínú àyíká ọ̀rọ̀ láì sọ ìṣírí náà di ohun tí ó ń lọ sí ọ̀nà kan ṣoṣo.
- source_word: ἐν ὑμῖν
  choice: bá yín jọ
  rationale: Nínú èdè Yorùbá, fífi ọ̀rọ̀ yìí mọ́ ìṣe ‘jọ gba ìṣírí’ fi ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú àwọn onígbàgbọ́ Róòmù hàn lọ́nà àdánidá ju ìtumọ̀ gígangan bí ‘nínú yín’ lọ.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: nípasẹ̀ ìgbàgbọ́ tí ó wà láàárín ara wa
  rationale: ‘Nípasẹ̀’ fi ọ̀nà tàbí ohun èlò ìṣírí hàn, ‘láàárín ara wa’ sì pa ìtumọ̀ ìfọwọ́sowọ́pọ̀ ἀλλήλοις mọ́ láì sọ pé ohun tí wọ́n gbàgbọ́ lé ni ara wọn.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí gbígbàgbọ́ Pọ́ọ̀lù àti ti àwọn ará Róòmù, kì í ṣe ìṣòtítọ́ ní pàtàkì.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: ìgbàgbọ́ yín àti tèmi
  rationale: Ó pa ìwọ̀ntúnwọ̀nsì tó wà láàárín ìgbàgbọ́ àwọn ará Róòmù àti ti Pọ́ọ̀lù mọ́, ó sì ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Bóyá Pọ́ọ̀lù nìkan ni yóò fún wọn ní okun tàbí pé òun àti wọn yóò jọ gba ìṣírí
  choice: Ìṣírí alájọṣepọ̀ láàárín Pọ́ọ̀lù àti àwọn onígbàgbọ́ Róòmù
  alternative: Pọ́ọ̀lù nìkan ni yóò fún wọn ní okun
  rationale: συμπαρακληθῆναι àti ‘ìgbàgbọ́ yín àti tèmi’ tẹnumọ́ ìbáṣepọ̀ méjèèjì; nítorí náà, ìtumọ̀ náà kò sọ iṣẹ́ ìránṣẹ́ yìí di ohun tí ó ń lọ sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ìṣírí’ dípò ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tó lè túmọ̀ sí ìtùnú nínú ìbànújẹ̀ nìkan. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá èdè àgbàṣe mu.
