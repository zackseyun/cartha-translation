id: ROM.1.23
reference: Romans 1:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: yo
  text: wọ́n sì fi ògo Ọlọ́run tí kì í ṣègbé[a] pààrò fún ìdàbí àwòrán ènìyàn tí ń ṣègbé[b][c], àwọn ẹyẹ, àwọn ẹranko ẹlẹ́sẹ̀ mẹ́rin, àti àwọn ẹranko tí ń rákò[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ọlọ́run tí kò lè bàjẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “fún àwòrán tí ó dà bí ènìyàn tí ń ṣègbé, àwọn ẹyẹ, àwọn ẹranko ẹlẹ́sẹ̀ mẹ́rin, àti àwọn ẹranko tí ń rákò.” Ní ti gangan, Gíríìkì lo ọ̀rọ̀ méjì tó jọmọ́ àwòrán níbí.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ènìyàn tí ó lè kú.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “àwọn ohun tí ń rákò.” Ọ̀rọ̀ Gíríìkì lè gbòòrò ju ẹ̀ka àwọn ẹranko afàyàfà nínú ìmọ̀ sáyẹ́ǹsì òde òní lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: fi … pààrò fún
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n mọ̀ọ́mọ̀ fi ohun kan sí ipò òmíràn; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ìrọ́pò mọ́.
- source_word: δόξαν
  choice: ògo
  rationale: “Ògo” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìyàtọ̀ tí Pọ́ọ̀lù ṣe láàárín ọlá ńlá Ọlọ́run àti àwọn ère mu.
- source_word: ἀφθάρτου
  choice: tí kì í ṣègbé
  rationale: Ó fi àìlèparun Ọlọ́run hàn, ó sì dá ìtakora tó ṣe kedere pẹ̀lú φθαρτοῦ sílẹ̀.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: fún àwòrán tí ó dà bí
  rationale: Èyí sọ èdè àwòrán méjèèjì inú Gíríìkì ní Yorùbá àdánidá láì sọ ìtumọ̀ náà di líle tàbí aláìgbọ́yé; àlàyé ìsàlẹ̀ fi ìṣètò gangan hàn.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: ènìyàn tí ń ṣègbé
  rationale: Ó pa àpapọ̀ ẹyọ ọ̀rọ̀ náà mọ́, ó sì dá ìtakora pẹ̀lú Ọlọ́run “tí kì í ṣègbé” sílẹ̀.
- source_word: πετεινῶν
  choice: àwọn ẹyẹ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì jẹ́ ti gbogbo ènìyàn fún àwọn ẹ̀dá abìyẹ́.
- source_word: τετραπόδων
  choice: àwọn ẹranko ẹlẹ́sẹ̀ mẹ́rin
  rationale: Ó tẹ̀ lé ìtumọ̀ gangan, ó sì jẹ́ èdè Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: ἑρπετῶν
  choice: àwọn ẹranko tí ń rákò
  rationale: Ó pa ìtumọ̀ gbooro ti àwọn ẹ̀dá tí ń rákò mọ́, dípò dídi ọ̀rọ̀ náà mọ́ ẹ̀ka ẹranko òde òní kan ṣoṣo.
theological_decisions:
- issue: Ìtakora láàárín ἀφθάρτου θεοῦ àti φθαρτοῦ ἀνθρώπου
  choice: Ọlọ́run “tí kì í ṣègbé” àti ènìyàn “tí ń ṣègbé”
  alternative: Ọlọ́run aláìlèbàjẹ́ àti ènìyàn kíkú
  rationale: Àṣàyàn náà mú ìtakora ọ̀rọ̀ Gíríìkì méjèèjì hàn gbangba láì fi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. Gbólóhùn náà bẹ̀rẹ̀ pẹ̀lú “wọ́n sì” láti pa καὶ àti ìtẹ̀síwájú láti ẹsẹ tó ṣáájú mọ́.
