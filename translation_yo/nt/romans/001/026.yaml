  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: yo
  text: Nítorí èyí, Ọlọ́run fi wọ́n sílẹ̀ fún àwọn ìfẹ́kúfẹ̀ẹ́ ìtìjú; nítorí àwọn obìnrin wọn[a] pàápàá pààrọ̀ ìbálòpọ̀ tí ó bá ìṣẹ̀dá mu[b] fún èyí tí ó lòdì sí ìṣẹ̀dá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan jù bẹ́ẹ̀ lọ, “àwọn abo wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìlò tí ó bá ìṣẹ̀dá mu.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “èyí tí kò bá ìṣẹ̀dá mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó jẹ́ àsopọ̀ onídi tí ó ṣe kedere, ó sì so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú.
- source_word: παρέδωκεν
  choice: fi wọ́n lé ... lọ́wọ́
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìṣe Ọlọ́run tí ó jọ fífi ènìyàn lé àbájáde ìṣọ̀tẹ̀ rẹ̀ lọ́wọ́ hàn, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: πάθη ἀτιμίας
  choice: àwọn ìfẹ́kúfẹ̀ẹ́ àbùkù
  rationale: Ó pa agbára ìmọ̀lára inú πάθη àti ìdájọ́ ìwà inú ἀτιμίας mọ́ ní èdè Yorùbá tó ṣeé lóye.
- source_word: θήλειαι
  choice: àwọn obìnrin
  rationale: “Àwọn obìnrin” jẹ́ ọ̀rọ̀ àdánidá fún ènìyàn nínú Yorùbá; ìtumọ̀ gangan “àwọn abo” wà nínú àlàyé ìsàlẹ̀.
- source_word: μετήλλαξαν
  choice: pààrọ̀
  rationale: Ó sọ ìyípadà ohun kan fún òmíràn ní tààrà, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe túmọ̀ sí.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: ìbálòpọ̀ tí ó bá ìṣẹ̀dá mu
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí ìbálòpọ̀; ìtumọ̀ yìí ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa “ìlò” tí ó sún mọ́ ọ̀rọ̀ gangan mọ́.
- source_word: τὴν παρὰ φύσιν
  choice: èyí tí ó lòdì sí ìṣẹ̀dá
  rationale: Ó pa àfiwé Gíríìkì mọ́, ó sì yẹra fún fífi ẹ̀ka ìwà tàbí ìdánimọ̀ òde òní tí ẹsẹ náà kò dárúkọ kún un.
theological_decisions:
- issue: Bóyá kí a mú ìdájọ́ ìwà Pọ́ọ̀lù le sí i tàbí kí a rọ̀ ọ́
  choice: Pa “àbùkù” àti “lòdì sí ìṣẹ̀dá” mọ́ láìfi àlàyé míì kún un.
  alternative: Lílo ọ̀rọ̀ tó rọ̀ bí “ìfẹ́ tí kò bójú mu,” tàbí fífi àwọn ẹ̀ka ìdánimọ̀ òde òní tí kò sí nínú ẹsẹ náà kún un.
  rationale: Ẹsẹ náà fúnra rẹ̀ ní ìdájọ́ ìwà nínú, nítorí náà a gbọ́dọ̀ pa agbára rẹ̀ mọ́; síbẹ̀, ìtumọ̀ kò gbọ́dọ̀ yanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa fífi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ìbálòpọ̀” láti mú ìtumọ̀ àyíká hàn kedere, ṣùgbọ́n a fi ìtumọ̀ tó sún mọ́ χρῆσις sí àlàyé ìsàlẹ̀. Gbogbo àmì àlàyé [a], [b], àti [c] wà ní ibi tí ọ̀rọ̀ tí wọ́n ń ṣàlàyé ti fara hàn.
