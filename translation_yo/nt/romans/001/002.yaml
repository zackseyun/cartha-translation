lexical_decisions:
- source_word: ὃ
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan yìí tọ́ka padà sí ìhìn rere ní Róòmù 1:1, ó sì so ẹsẹ yìí mọ́ ọ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: προεπηγγείλατο
  choice: ó ti ṣèlérí tẹ́lẹ̀
  rationale: Èyí pa agbára ìlérí àti ìtumọ̀ pé ó ti ṣẹlẹ̀ ṣáájú mọ́, láìjẹ́ kí gbólóhùn náà ṣòro ní Yorùbá.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: nípasẹ̀ àwọn wòlíì rẹ̀
  rationale: “Nípasẹ̀” fi àwọn wòlíì hàn gẹ́gẹ́ bí àwọn tí Ọlọ́run lò láti sọ ìlérí náà, “rẹ̀” sì pa ìbátan tí ọ̀rọ̀ Gíríìkì fi hàn mọ́.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: nínú àwọn Ìwé Mímọ́
  rationale: “Nínú” mú ìtumọ̀ ibi tàbí àyíká tí ìlérí náà wà jáde; “àwọn Ìwé Mímọ́” sì jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún àwọn ìwé tí a yà sọ́tọ̀ gẹ́gẹ́ bí Ìwé Mímọ́.
theological_decisions:
- issue: Bóyá kí γραφαῖς ἁγίαις jẹ́ “àwọn Ìwé Mímọ́” tàbí “àwọn ìwé mímọ́”
  choice: àwọn Ìwé Mímọ́
  alternative: àwọn ìwé mímọ́
  rationale: Nínú ọ̀rọ̀ Pọ́ọ̀lù, γραφαί sábà máa ń tọ́ka sí àwọn ìwé tí a mọ̀ sí Ìwé Mímọ́. Bí ó tilẹ̀ rí bẹ́ẹ̀, ọ̀rọ̀ Gíríìkì fúnra rẹ̀ tún lè túmọ̀ sí “àwọn ìwé mímọ́,” nítorí náà a pa àṣàyàn náà mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ ọlọ́wọ̀ àti kíkún àmì ohùn. Gbólóhùn náà dúró gẹ́gẹ́ bí apá kan tí ó ń bá Róòmù 1:1 lọ, bí ó ti rí nínú orísun Gíríìkì.
