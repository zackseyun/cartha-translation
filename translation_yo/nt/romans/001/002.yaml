translation:
  language: yo
  text: èyí tí ó ti ṣèlérí tẹ́lẹ̀ nípasẹ̀ àwọn wòlíì rẹ̀ nínú àwọn ìwé mímọ́,[a]
  philosophy: optimal-equivalence
