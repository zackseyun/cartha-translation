  source_fidelity: 'Ìtumọ̀ náà gba àwọn ìtumọ̀ pàtàkì nínú Gíríìkì: ìmọ̀ nípa ìdájọ́ Ọlọ́run, ẹ̀bi ikú, ṣíṣe àwọn nǹkan náà, àti fífi ìtẹ́wọ́gbà hàn sí àwọn olùṣe wọn. Síbẹ̀, ó yẹ kí a sọ ipa ìtakora ti ἐπιγνόντες ní kedere, kí ìbámu ọ̀rọ̀-orúkọ ọ̀pọ̀ pẹ̀lú ọ̀rọ̀-ìse sì péye.'
