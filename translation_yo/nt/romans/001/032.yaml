id: ROM.1.32
reference: Romans 1:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé wọ́n mọ ìdájọ́ òdodo Ọlọ́run[a]—pé àwọn tí ń ṣe irú nǹkan bẹ́ẹ̀ yẹ fún ikú—kì í ṣe àwọn fúnra wọn nìkan ni wọ́n ń ṣe irú nǹkan bẹ́ẹ̀, ṣùgbọ́n wọ́n tún ń fọwọ́ sí àwọn tí ń ṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìlànà,” “ohun tí Ọlọ́run béèrè,” tàbí “ìpinnu ìdájọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Àwọn ẹni tí ó
  rationale: Ó ń tẹ̀ síwájú láti ṣàpèjúwe àwọn ènìyàn tí ọ̀rọ̀ ṣáájú ń tọ́ka sí; ọ̀rọ̀ yìí jẹ́ ti ẹ̀dá, ó sì bá gírámà Yorùbá mu.
- source_word: δικαίωμα
  choice: ìdájọ́ òdodo
  rationale: Nínú àyíká yìí, ó ní agbára ìlànà àti ìdájọ́ Ọlọ́run tí ó tọ́, gẹ́gẹ́ bí gbólóhùn tó tẹ̀ lé e ṣe ṣàlàyé pé àwọn olùṣe bẹ́ẹ̀ yẹ fún ikú.
- source_word: ἐπιγνόντες
  choice: tí ó mọ
  rationale: Ó fi hàn pé wọ́n mọ ìdájọ́ náà, síbẹ̀ wọ́n ń ṣe ohun tó lòdì sí i; ìtumọ̀ ìtakora náà fara hàn ní kíkún nínú gbólóhùn.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: àwọn tí ń ṣe irú àwọn nǹkan bẹ́ẹ̀
  rationale: Àmì ‘ń’ ń fi ìṣe tí ó ń bá a lọ tàbí ìwà àṣà hàn, ó sì ṣe àfihàn agbára participle πράσσοντες.
- source_word: ἄξιοι θανάτου
  choice: yẹ fún ikú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe tààrà láti sọ ìdájọ́ pé ikú ni ó tọ́ sí wọn, láì dín ìtumọ̀ ikú náà kù sí irú kan pàtó.
- source_word: ποιοῦσιν
  choice: ń ṣe wọ́n
  rationale: Ó jẹ́ ìtumọ̀ adayeba fún ‘ṣe,’ ó sì tọ́ka padà sí àwọn nǹkan tí a mẹ́nu kàn.
- source_word: συνευδοκοῦσιν
  choice: ń fi ọwọ́ sí
  rationale: Àkànlò-èdè Yorùbá yìí túmọ̀ sí pé wọ́n fara mọ́, wọ́n fọwọ́ sí, tàbí wọ́n gba ìṣe àwọn ẹlòmíràn láàyè; ó lágbára ju wíwà ní ìṣọ̀kan lásán lọ.
- source_word: τοῖς πράσσουσιν
  choice: àwọn tí ń ṣe wọ́n
  rationale: Ó pa ìfarajọ pẹ̀lú gbólóhùn participle àkọ́kọ́ mọ́, ó sì tún fi ìṣe tó ń bá a lọ hàn.
theological_decisions:
- issue: Ìtumọ̀ ‘yẹ fún ikú’
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìdájọ́ Ọlọ́run pé ikú tọ́ sí wọn, láì sọ irú ikú náà ní pàtó.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ìjìyà ikú lábẹ́ òfin ìjọba, tàbí sí ikú ìkẹyìn nìkan.
  rationale: Ẹsẹ̀ náà kò ṣàlàyé bí ‘ikú’ ṣe gbòòrò tó. Ìtumọ̀ yìí pa agbára ìdájọ́ ọ̀rọ̀ Gíríìkì mọ́ láì fi ẹ̀kọ́ kan tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó níyì, tí ó sì ṣeé lóye ni a lò. ‘Fi ọwọ́ sí’ jẹ́ àkànlò-èdè tí ó wọ́pọ̀ fún fífara mọ́ tàbí fífọwọ́ sí ìṣe ẹlòmíràn. A pa àìsọ pàtó nípa bí ‘ikú’ ṣe gbòòrò tó mọ́.
