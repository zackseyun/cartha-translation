  to: Gẹ́gẹ́ bí wọ́n kò ti kà á sí ohun tó yẹ láti ní Ọlọ́run nínú ìmọ̀ wọn[a], Ọlọ́run fi wọ́n sílẹ̀ fún èrò inú tí kò yẹ, láti ṣe àwọn ohun tí kò bójú mu[b].
