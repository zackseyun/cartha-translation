id: ROM.1.28
reference: Romans 1:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: yo
  text: Gẹ́gẹ́ bí wọ́n kò ti kà á sí ohun tó yẹ láti ní Ọlọ́run nínú ìmọ̀ wọn[a], Ọlọ́run fi wọ́n sílẹ̀ fún èrò inú tí kò yẹ, láti ṣe àwọn ohun tí kò bójú mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti pa Ọlọ́run mọ́ nínú ìmọ̀ wọn,” tàbí “láti pa ìmọ̀ nípa Ọlọ́run mọ́.”
    reason: lexical_alternative
  - marker: b
    text: “Tí kò yẹ” túmọ̀ ọ̀rọ̀ kan tó jọ “kà á sí ohun tó yẹ” ní ìbẹ̀rẹ̀ ẹsẹ náà, ó sì pa eré ọ̀rọ̀ Pọ́ọ̀lù mọ́. A tún lè túmọ̀ ọ́ sí “èrò inú ìbàjẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó pa ìtumọ̀ ìfiwéra ‘gẹ́gẹ́ bí’ mọ́, nígbà tí àkójọpọ̀ ‘gẹ́gẹ́ bí ... ti’ tún lè tọ́ka sí ìdí nínú Yorùbá láìfi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
- source_word: ἐδοκίμασαν
  choice: kò ... ka ó yẹ
  rationale: Ó fi hàn pé wọ́n ṣe àyẹ̀wò, ṣùgbọ́n wọn kò fọwọ́ sí i tàbí kà á sí ohun tó yẹ; ó tún ń bá ἀδόκιμον dún ní ọ̀nà kan náà.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: láti ní Ọlọ́run nínú ìmọ̀ wọn
  rationale: A pa àwòrán gírámà Gíríìkì náà mọ́ dípò yíyí rẹ̀ padà sí ‘jẹ́wọ́ Ọlọ́run’ nìkan; gbólóhùn náà lè túmọ̀ sí mímú Ọlọ́run wà nínú ìmọ̀ tàbí ìdánimọ̀ wọn.
- source_word: παρέδωκεν
  choice: fi wọ́n sílẹ̀ fún
  rationale: Ó sọ ìṣe Ọlọ́run gẹ́gẹ́ bí fífi wọn lé agbára ìrònú yẹn lọ́wọ́, ó sì bá ìtumọ̀ ìdájọ́ tí ọ̀rọ̀ náà ní nínú àyíká mu.
- source_word: ἀδόκιμον νοῦν
  choice: èrò inú tí kò yẹ
  rationale: ‘Èrò inú’ sọ νοῦς ní èdè Yorùbá tí ó ṣe kedere, ‘tí kò yẹ’ sì pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú ‘ka ó yẹ’ ní ìbẹ̀rẹ̀ ẹsẹ náà láìlo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lágbára jù.
- source_word: ποιεῖν
  choice: láti máa ṣe
  rationale: Ó pa ìsopọ̀ àbájáde tàbí ète mọ́ lẹ́yìn ‘fi wọ́n sílẹ̀ fún,’ láìyanju ìṣòro gírámà náà ju bó ṣe yẹ lọ.
- source_word: τὰ μὴ καθήκοντα
  choice: àwọn ohun tí kò bójú mu
  rationale: Ó sọ àwọn ohun tí kò tọ́ tàbí tí kò yẹ ní ọ̀nà Yorùbá adayeba, ó sì yà á sọ́tọ̀ kúrò nínú eré ọ̀rọ̀ δοκιμάζω/ἀδόκιμος.
theological_decisions:
- issue: Bóyá kí ἀδόκιμον νοῦν jẹ́ ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lágbára bí ‘ọkàn ìbàjẹ́’ tàbí ‘ọkàn ẹni tí a ti kọ̀.’
  choice: èrò inú tí kò yẹ
  alternative: èrò inú ìbàjẹ́
  rationale: Yíyan ‘tí kò yẹ’ pa ìtumọ̀ ohun tí kò yege tàbí tí a kò fọwọ́ sí mọ́, ó sì fi eré ọ̀rọ̀ Pọ́ọ̀lù hàn láìkó ìtumọ̀ ẹ̀kọ́ ìsìn tó ti gbòòrò sí i wọ inú ẹsẹ náà.
- issue: Bóyá ἔχειν ἐν ἐπιγνώσει yẹ kí a túmọ̀ sí jíjẹ́wọ́ Ọlọ́run tàbí pípa Ọlọ́run mọ́ nínú ìmọ̀.
  choice: ní Ọlọ́run nínú ìmọ̀ wọn
  alternative: pa ìmọ̀ nípa Ọlọ́run mọ́
  rationale: Ìtumọ̀ àkọ́kọ́ pa àìdánilójú àti àwòrán ọ̀rọ̀ orísun mọ́; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀ láti fi ipa ‘retain’ hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Èrò inú’ jẹ́ yíyan adayeba fún νοῦς, nígbà tí ‘kò bójú mu’ jẹ́ ọ̀nà tó wọ́pọ̀ láti sọ ohun tí kò yẹ kí a ṣe.
