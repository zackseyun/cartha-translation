id: ROM.1.21
reference: Romans 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: yo
  text: Nítorí bí ó tilẹ̀ jẹ́ pé wọ́n mọ Ọlọ́run, wọ́n kò fi ògo fún un gẹ́gẹ́ bí Ọlọ́run, bẹ́ẹ̀ ni wọ́n kò dúpẹ́; ṣùgbọ́n èrò wọn di asán,[a] ọkàn wọn tí kò ní òye sì ṣókùnkùn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n di asán nínú ìrònú wọn”; tàbí, “nínú ìgbèrò wọn.”
    reason: lexical_alternative
  - marker: b
    text: Nínú èdè Gíríìkì, “ọkàn” jẹ́ ẹyọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀, ó sì pa ìsopọ̀ ọgbọ́n inú gbólóhùn náà mọ́.
- source_word: γνόντες τὸν θεὸν
  choice: bí ó tilẹ̀ jẹ́ pé wọ́n mọ Ọlọ́run
  rationale: 'Àyíká ọ̀rọ̀ fi agbára ìyọ̀ǹda hàn: láìka pé wọ́n mọ Ọlọ́run sí, wọn kò dáhùn lọ́nà tó yẹ.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: wọn kò fi ògo fún un gẹ́gẹ́ bí Ọlọ́run
  rationale: Èyí pa ìtumọ̀ pé wọn kò bu ọlá tó yẹ fún Ọlọ́run ní ipò rẹ̀ gẹ́gẹ́ bí Ọlọ́run mọ́.
- source_word: ἢ ηὐχαρίστησαν
  choice: bẹ́ẹ̀ ni wọn kò dúpẹ́
  rationale: ‘Dúpẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ìmọrírì hàn; agbára ìsopọ̀ ἢ nínú gbólóhùn òdì ni ‘bẹ́ẹ̀ ni ... kò’ mú jáde.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: èrò wọn di asán
  rationale: Ó mú àbájáde ìṣe àìṣe náà jáde ní Yorùbá àdánidá, ó sì jẹ́ kí διαλογισμοί lè túmọ̀ sí èrò, ìrònú, tàbí ìgbèrò láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ἐσκοτίσθη
  choice: ṣókùnkùn
  rationale: Ó pa àwòrán òkùnkùn ti ọ̀rọ̀ Gíríìkì àti ìṣe tó ṣẹlẹ̀ sí ọkàn mọ́.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: ọkàn wọn tí kò ní òye
  rationale: Ó tú ἀσύνετος sí ‘àìní òye’ dípò fífi kàn án mọ́ ọgbọ́n kékeré; ‘ọkàn’ jẹ́ ẹyọ bí ó ti rí nínú Gíríìkì, ṣùgbọ́n ó ń tọ́ka sí inú gbogbo wọn lápapọ̀.
theological_decisions:
- issue: Agbára ìyọ̀ǹda nínú γνόντες
  choice: bí ó tilẹ̀ jẹ́ pé wọ́n mọ Ọlọ́run
  alternative: nígbà tí wọ́n mọ Ọlọ́run; lẹ́yìn tí wọ́n ti mọ Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ ń tẹnumọ́ pé bí ó tilẹ̀ jẹ́ pé ìmọ̀ Ọlọ́run wà fún wọn, wọn kò ṣe ohun tó yẹ. Èyí jẹ́ ìpinnu gírámà àti àyíká, kì í ṣe yíyanjú gbogbo ìbéèrè ẹ̀kọ́ ìgbàgbọ́ nípa irú ìmọ̀ náà.
- issue: Ohun tó fa ἐματαιώθησαν àti ἐσκοτίσθη
  choice: èrò wọn di asán ... ọkàn wọn ... sì ṣókùnkùn
  alternative: a sọ èrò wọn di asán ... a sì sọ ọkàn wọn di òkùnkùn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ aláìṣe, ṣùgbọ́n kò sọ ẹni tó ṣe e ní tààràtà. Ìtumọ̀ yìí pa àìdájú yẹn mọ́, kò sì fi Ọlọ́run tàbí wọn fúnra wọn hàn gẹ́gẹ́ bí olùṣe níbi tí ẹsẹ̀ náà kò ti sọ bẹ́ẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tó bá jẹ́ àdánidá. ‘Fi ògo fún’ àti ‘gẹ́gẹ́ bí Ọlọ́run’ pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ àti ìṣọ̀kan pẹ̀lú orísun mọ́, nígbà tí ‘èrò wọn di asán’ jẹ́ ọ̀rọ̀ Yorùbá tó ń ṣàn dáadáa.
