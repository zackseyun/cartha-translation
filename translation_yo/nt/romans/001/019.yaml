source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: yo
  text: nítorí pé ohun tí a lè mọ̀ nípa Ọlọ́run hàn kedere láàárín wọn[a], nítorí Ọlọ́run ti jẹ́ kí ó hàn kedere fún wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú wọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: nítorí pé
  rationale: Ó ń ṣàlàyé ìdí ọ̀rọ̀ tó ṣáájú; ‘nítorí pé’ jẹ́ ọ̀nà àdánidá láti fi ìbáṣepọ̀ ìdí hàn ní Yorùbá.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: ohun tí a lè mọ̀ nípa Ọlọ́run
  rationale: Ọ̀rọ̀ ajẹtífù aláìlẹ́gbẹ́ tó ní àfihàn náà dúró gẹ́gẹ́ bí orúkọ, ó sì lè tọ́ka sí ohun tó ṣeé mọ̀. ‘Nípa Ọlọ́run’ mú ìtumọ̀ genitive náà jáde lọ́nà Yorùbá tó ṣe kedere.
- source_word: φανερόν ἐστιν
  choice: ṣe kedere
  rationale: Ó fi hàn pé ohun náà farahàn gbangba, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tó rọrùn láti lóye.
- source_word: ἐν αὐτοῖς
  choice: láàárín wọn
  rationale: Èyí gba ìtumọ̀ ibi tàbí àwùjọ pé ó hàn gbangba láàárín wọn; ìtumọ̀ pé ó wà nínú wọn ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: nítorí Ọlọ́run ti mú un ṣe kedere fún wọn
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ láàárín φανερόν àti ἐφανέρωσεν, ó sì sọ ìṣípayá Ọlọ́run ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἐν αὐτοῖς
  choice: láàárín wọn
  alternative: nínú wọn tàbí nínú ọkàn wọn
  rationale: Gbólóhùn Gíríìkì náà lè túmọ̀ sí ohun tó hàn ní gbangba láàárín àwùjọ wọn tàbí ohun tó wà nínú wọn. Ọ̀rọ̀ àyíká tó tẹ̀ lé e ń tẹnu mọ́ ìṣípayá tó ṣeé rí nínú ìṣẹ̀dá, ṣùgbọ́n a kò pa ìtumọ̀ inú-ọkàn rẹ́, a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà ní ọlá, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní. A tún ‘ṣe kedere’ lò láti pa ìbáṣepọ̀ φανερόν/ἐφανέρωσεν mọ́.
