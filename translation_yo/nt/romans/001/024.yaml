id: ROM.1.24
reference: Romans 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: yo
  text: Nítorí náà, Ọlọ́run fi wọ́n lé ìwà àìmọ́ lọ́wọ́ nínú ìfẹ́kúfẹ̀ẹ́ ọkàn wọn, kí ara wọn lè di ohun àbùkù láàárín ara wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín wọn”; ó sì ṣeé ṣe kí ó túmọ̀ sí “nínú ara wọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde ohun tí a sọ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: παρέδωκεν
  choice: fi wọ́n lé ... lọ́wọ́
  rationale: Ó pa ìtumọ̀ fífi ẹnì kan lé agbára tàbí ipò kan lọ́wọ́ mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: nínú àwọn ìfẹ́-ọkàn wọn
  rationale: Ó pa àwòrán ‘ọkàn’ àti ìtumọ̀ ibi tàbí ipò tí fífi wọ́n lé lọ́wọ́ ti ń ṣẹlẹ̀ mọ́.
- source_word: ἐπιθυμίαις
  choice: àwọn ìfẹ́-ọkàn
  rationale: Ọ̀rọ̀ náà gbòòrò ju ìfẹ́ ìbálòpọ̀ lọ; yíyan èyí kò tètè dín ìtumọ̀ rẹ̀ kù.
- source_word: ἀκαθαρσίαν
  choice: ìwà àìmọ́
  rationale: Ó sọ àìmọ́ ní ti ìwà ní Yorùbá òde òní, kì í sì í tọ́ka sí èérí ara nìkan.
- source_word: τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν
  choice: kí ara wọn lè di ohun àbùkù
  rationale: Ó fi àbájáde tàbí ète tó wà nínú infinitive Gíríìkì hàn ní ọ̀nà Yorùbá tó ṣeé lóye, ó sì pa passive náà mọ́ láì sọ ẹni tó ṣe é ní pàtó.
- source_word: ἐν αὐτοῖς
  choice: láàárín ara wọn
  rationale: Ó mú ìtumọ̀ ìṣe tó wáyé láàárín wọn jáde, ṣùgbọ́n a fi àwọn ìtumọ̀ míì sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bóyá παρέδωκεν yẹ kí a túmọ̀ rẹ̀ pẹ̀lú àlàyé pé Ọlọ́run kọ̀ wọ́n sílẹ̀ gẹ́gẹ́ bí ìdájọ́
  choice: fi wọ́n lé ... lọ́wọ́
  alternative: kọ̀ wọ́n sílẹ̀; dá wọn lẹ́jọ́ nípa fífi wọ́n lé ... lọ́wọ́
  rationale: Èdè yìí pa agbára ìdájọ́ tó wà nínú ọ̀rọ̀ náà mọ́, ṣùgbọ́n kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò sọ ní tààràtà kún un.
- issue: Ibasepo laarin τοῦ ἀτιμάζεσθαι ati gbolohun akọkọ
  choice: kí ara wọn lè di ohun àbùkù
  alternative: fún fífi ara wọn ṣe àbùkù
  rationale: Ìtúmọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì jẹ́ kí ìdàrúdàpọ̀ tó ṣeé ṣe láàárín ète àti àbájáde má parẹ́ pátápátá.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì yẹra fún èdè ẹgbẹ́ ìjọ kan pàtó.
