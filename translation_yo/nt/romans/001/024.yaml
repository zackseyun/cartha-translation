revisions:
- from: Nítorí náà, Ọlọ́run fi wọ́n lé ìwà àìmọ́ lọ́wọ́ nínú àwọn ìfẹ́-ọkàn wọn, kí ara wọn lè di ohun àbùkù láàárín ara wọn.[a]
  to: Nítorí náà, Ọlọ́run fi wọ́n lé ìwà àìmọ́ lọ́wọ́ nínú ìfẹ́kúfẹ̀ẹ́ ọkàn wọn, kí ara wọn lè di ohun àbùkù láàárín ara wọn.[a]
  rationale: A tún “àwọn ìfẹ́-ọkàn wọn” ṣe sí “ìfẹ́kúfẹ̀ẹ́ ọkàn wọn” nìkan. Ìyípadà náà mú ìtumọ̀ ἐπιθυμίαις sun mọ́ ọ̀rọ̀ ìpilẹ̀, ó sì jẹ́ Yorùbá àdánidá. A kò yí ìdí, agbára, tàbí àìdánilójú tó wà nínú ἐν αὐτοῖς padà; àlàyé ìsàlẹ̀ náà ṣì ń pa àwọn aṣàyàn pàtàkì mọ́.
