id: ROM.1.20
reference: Romans 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: yo
  text: Nítorí àwọn ohun tí a kò lè fi ojú rí nípa rẹ̀[a], èyíinì ni agbára rẹ̀ tí ó wà títí láé àti ìwà àtọ̀runwá rẹ̀[b], ni a ti ń rí kedere láti ìgbà ìṣẹ̀dá ayé; a ń fi òye mọ̀ wọ́n nípasẹ̀ àwọn ohun tí a dá. Nítorí náà, wọn kò ní àwíjàre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ànímọ́ rẹ̀ tí a kò lè fi ojú rí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ànímọ́ àtọ̀runwá rẹ̀.” Ọ̀rọ̀ Gíríìkì níbí ni θειότης, kì í ṣe ọ̀rọ̀ tó lágbára jù ú lọ, θεότης.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: àwọn ohun tí a kò lè fi ojú rí nípa rẹ̀
  rationale: 'Ó pa ìtumọ̀ gbooro ti ọ̀pọ̀ nọ́ńbà aláìlábùkù náà mọ́: àwọn ohun tí ojú kò rí nípa Ọlọ́run, láìfi ọ̀rọ̀ ẹ̀kọ́ onímọ̀ bí ‘àwọn ànímọ́’ sí i.'
- source_word: ἀπὸ κτίσεως κόσμου
  choice: láti ìgbà ìṣẹ̀dá ayé
  rationale: Ó sọ ìbẹ̀rẹ̀ àkókò tí ἀπό tọ́ka sí ní Yorùbá àdánidá.
- source_word: τοῖς ποιήμασιν
  choice: nípasẹ̀ àwọn ohun tí a dá
  rationale: ‘Nípasẹ̀’ fi ipa irinṣẹ́ dative náà hàn, ‘àwọn ohun tí a dá’ sì pa ìtumọ̀ iṣẹ́ tí a ti ṣe mọ́.
- source_word: νοούμενα
  choice: a ń fi òye mọ̀ wọ́n
  rationale: Ó mú apá ti ìrònú àti ìmọ̀ ọpọlọ inú νοέω jáde, kì í ṣe rírí lásán.
- source_word: καθορᾶται
  choice: ni a ti ń rí kedere
  rationale: ‘Kedere’ fi agbára ọ̀rọ̀-ìṣe náà hàn; ‘ti ń’ sì darapọ̀ ìbẹ̀rẹ̀ láti ìṣẹ̀dá pẹ̀lú ohun tí ó ń bá a lọ.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: agbára rẹ̀ tí ó wà títí láé
  rationale: Ó jẹ́ Yorùbá tí ó ṣe kedere, ó sì pa ìtumọ̀ agbára tí kò lópin mọ́.
- source_word: θειότης
  choice: ìwà àtọ̀runwá rẹ̀
  rationale: Ó tọ́ka sí ànímọ́ tàbí ìwà tí ó jẹ́ ti Ọlọ́run, láìfi agbára ontological tó le ju ti θειότης lọ sí ọ̀rọ̀ náà.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: Nítorí náà, wọn kò ní àwíjàre
  rationale: Ó mú àbájáde inú gbólóhùn Gíríìkì náà hàn ní Yorùbá tó rọrùn, tí ó sì pa ‘wọn’ mọ́ gẹ́gẹ́ bí ẹni tí a ń tọ́ka sí.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ θειότης láìmú kí ọ̀rọ̀ Paulu le ju bó ṣe wà lọ
  choice: ìwà àtọ̀runwá rẹ̀
  alternative: jijẹ́ Ọlọ́run rẹ̀; ìṣẹ̀dá àtọ̀runwá rẹ̀
  rationale: θειότης sọ nípa ànímọ́ tàbí ìwà àtọ̀runwá; kò lágbára déédéé pẹ̀lú θεότης. Yíyan ‘ìwà àtọ̀runwá’ pa ìyàtọ̀ yìí mọ́.
- issue: Ìbáṣepọ̀ εἰς τό pẹ̀lú àbájáde tàbí ète
  choice: 'àbájáde: ‘Nítorí náà’'
  alternative: 'ète: ‘kí wọn lè má ní àwíjàre’'
  rationale: Nínú àyíká gbólóhùn náà, ẹ̀rí ìṣẹ̀dá yọrí sí pé wọn kò ní àwíjàre; yíyan àbájáde kò sọ pé Ọlọ́run dá ayé fún ète láti dá wọn lẹ́bi.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘a’ gẹ́gẹ́ bí ọ̀nà àìdárúkọ ẹni nínú gbólóhùn àìṣe, ‘wọn’ sì tọ́ka sí àwọn ènìyàn inú àyíká ẹsẹ tó ṣáájú. Gbogbo àmì ìsàlẹ̀-ìwé wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ó ń ṣàlàyé.
