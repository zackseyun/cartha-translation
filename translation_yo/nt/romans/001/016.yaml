id: ROM.1.16
reference: Romans 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: yo
  text: Nítorí èmi kò tijú ìhìn rere[a] náà, nítorí agbára Ọlọ́run ni ó jẹ́ fún ìgbàlà fún gbogbo ẹni tí ó bá gbàgbọ́—ní àkọ́kọ́ fún Júù, àti fún Gíríìkì pẹ̀lú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘gọ́spelì.’
    reason: lexical_alternative
  - marker: b
    text: ‘Gíríìkì’ níbí lè tọ́ka ní ọ̀nà gbòòrò sí ẹni tí kì í ṣe Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: kò tijú
  rationale: Ó sọ pé ẹni kò ní ìtìjú tàbí fà sẹ́yìn nítorí ohun tí ó ń kéde; ‘kò tijú’ jẹ́ Yorùbá àdánidá tí ó pa ìgboyà Pọ́ọ̀lù mọ́.
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: ‘Ìhìn rere’ fi ìtumọ̀ ọ̀rọ̀ Gíríìkì hàn ní kedere, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: δύναμις
  choice: agbára
  rationale: ‘Agbára’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún agbára Ọlọ́run tí ń mú ìgbàlà ṣẹ.
- source_word: εἰς σωτηρίαν
  choice: fún ìgbàlà
  rationale: Ó pa ipa ìtọ́ka sí àfojúsùn tàbí àbájáde ti εἰς mọ́ láì fi àlàyé míì kún un.
- source_word: παντὶ τῷ πιστεύοντι
  choice: gbogbo ẹni tí ó bá gbàgbọ́
  rationale: Ó pa ìtumọ̀ pínpín ‘olúkúlùkù ẹni’ àti ìṣe gbígbàgbọ́ mọ́ ní Yorùbá tó rọrùn.
- source_word: Ἰουδαίῳ
  choice: Júù
  rationale: Nínú ìyàtọ̀ rẹ̀ sí Ἕλληνι, ọ̀rọ̀ náà tọ́ka sí Júù gẹ́gẹ́ bí ẹ̀yà àti àwùjọ ẹ̀sìn, kì í ṣe ará Jùdíà lásán.
- source_word: πρῶτον
  choice: ní àkọ́kọ́
  rationale: Ó pa ìṣáájú tí ọ̀rọ̀ Gíríìkì sọ mọ́ láì ṣàlàyé irú ìṣáájú náà ju ohun tí ẹsẹ̀ sọ lọ.
- source_word: Ἕλληνι
  choice: Gíríìkì
  rationale: Èyí pa ọ̀rọ̀ pàtó inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó tún lè dúró fún ẹni tí kì í ṣe Júù ní gbogbogbòò.
- source_word: τε ... καί
  choice: àti ... pẹ̀lú
  rationale: Àkójọpọ̀ yìí fi àfikún lẹ́yìn ìṣáájú hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ Ἕλληνι nínú gbólóhùn ‘Júù ní àkọ́kọ́, àti Gíríìkì pẹ̀lú’
  choice: Gíríìkì nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó lè túmọ̀ sí àwọn tí kì í ṣe Júù ní gbogbogbòò
  alternative: Kèfèrí tàbí ẹni tí kì í ṣe Júù nínú ọ̀rọ̀ pàtàkì
  rationale: Yíyan ‘Gíríìkì’ pa àṣàyàn ọ̀rọ̀ inú orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́wọ́ lílo rẹ̀ lọ́nà gbígbòòrò nínú Pọ́ọ̀lù láì pa ìyàtọ̀ ìtàn àti àṣà rẹ́.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún bí ó ti yẹ. Àtúnṣe gbólóhùn náà tẹ̀ lé ìtẹ̀sí Gíríìkì ní pẹkipẹki, ṣùgbọ́n ó jẹ́ Yorùbá àdánidá.
