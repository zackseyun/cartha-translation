lexical_decisions:
- source_word: ἀσυνέτους
  choice: aláìlóye
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn tí kò ní òye tàbí ìfòyemọ̀; “aláìlóye” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, kò sì sọ ọ́ di àìní ọgbọ́n lásán.
- source_word: ἀσυνθέτους
  choice: aláìṣe olóòtítọ́ sí àdéhùn
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àwọn tí kì í dúró lórí ohun tí wọ́n fohùn ṣọ̀kan lé lórí; gbolohun yìí mú ìtumọ̀ àìṣe olóòtítọ́ nínú àdéhùn jáde.
- source_word: ἀστόργους
  choice: aláìní ìfẹ́ àbínibí fún ẹbí
  rationale: Àkọ́lé náà pàápàá ni àìní ìfẹ́ àdánidá tí ó yẹ kí ó wà láàárín àwọn ará ilé; ìtumọ̀ yìí sọ ìtumọ̀ ẹbí náà ní kedere.
- source_word: ἀνελεήμονας
  choice: aláìní àánú
  rationale: Èyí túmọ̀ sí ẹni tí kò ní àánú tàbí ìyọ́nú; “aláìní àánú” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
theological_decisions: []
translation_notes:
