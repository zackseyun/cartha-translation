id: ROM.1.9
reference: Romans 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: yo
  text: Nítorí Ọlọ́run, ẹni tí mo ń sìn nínú ẹ̀mí mi nípa ìhìn rere Ọmọ rẹ̀, ni ẹlẹ́rìí mi pé mo ń mẹ́nu kàn yín láìdáwọ́ dúró.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ní gbogbo ìgbà ni mo ń mẹ́nu kàn yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: ẹlẹ́rìí
  rationale: Nínú ẹ̀bẹ̀ tí ó dà bí ìbúra yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó lè jẹ́rìí sí òtítọ́ ohun tí Pọ́ọ̀lù sọ.
- source_word: λατρεύω
  choice: ń sìn
  rationale: Ó ní ìtumọ̀ iṣẹ́ ìsìn fún Ọlọ́run, ó sì lè ní ìmọ̀lára ìjọsìn; ‘ń sìn’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ méjèèjì mọ́.
- source_word: ἐν τῷ πνεύματί μου
  choice: nínú ẹ̀mí mi
  rationale: Ìtumọ̀ yìí tẹ̀lé ìṣọ̀kan Gíríìkì, ó sì pa àìdájú mọ́ bóyá ἐν ń tọ́ka sí ibi inú tàbí ọ̀nà tí Pọ́ọ̀lù fi ń sìn.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: nípa ìhìn rere
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ἐν lè ṣàpèjúwe àgbègbè tàbí ọ̀nà iṣẹ́ ìsìn Pọ́ọ̀lù; ‘nípa’ jẹ́ Yorùbá tí ó ṣàn, tí ó sì so iṣẹ́ ìsìn rẹ̀ mọ́ ìkéde ìhìn rere.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Ọmọ rẹ̀
  rationale: A pa ìbátan genitive náà mọ́ láìfi kun un pé ‘nípa Ọmọ rẹ̀,’ èyí tí yóò túmọ̀ rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀδιαλείπτως
  choice: láìdáwọ́ dúró
  rationale: Ó sọ ìṣe tí ó ń bá a lọ déédéé; gbólóhùn yìí jẹ́ kedere, ó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: mo ń mẹ́nu kàn yín
  rationale: Èyí tú ìlò ọ̀rọ̀ Gíríìkì náà sí Yorùbá àdánidá láìyí i padà sí ‘mo ń rántí yín,’ èyí tí ó lè fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Bóyá εὐαγγέλιον yẹ kí a túmọ̀ sí ọ̀rọ̀ ìjọ àtọwọ́dọ́wọ́ tàbí sí ìtumọ̀ rẹ̀ ní kedere
  choice: ìhìn rere
  alternative: ìhìnrere
  rationale: ‘Ìhìn rere’ fi ìtumọ̀ Gíríìkì hàn ní kedere fún òǹkàwé òde òní, láìyí ẹ̀kọ́ ìgbàgbọ́ kankan padà.
- issue: Bóyá ἐν τῷ πνεύματί μου túmọ̀ sí ibi inú tàbí ọ̀nà ohun èlò
  choice: nínú ẹ̀mí mi
  alternative: pẹ̀lú ẹ̀mí mi
  rationale: ‘Nínú ẹ̀mí mi’ sun mọ́ ọ̀nà tí Gíríìkì gbà sọ ọ́, ó sì yẹra fún pípa àìdájú náà tán sí ìtumọ̀ ohun èlò nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘yín’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῶν.
