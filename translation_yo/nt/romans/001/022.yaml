lexical_decisions:
- source_word: φάσκοντες
  choice: Bí wọ́n ti ń sọ pé
  rationale: Ó fi ìsọ̀rọ̀ ẹni nípa ara rẹ̀ hàn gẹ́gẹ́ bí ọ̀rọ̀ ìjẹ́rìí tàbí ìfẹnuṣọ; ìṣàmúlò ‘ń’ tún pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: εἶναι
  choice: àwọn jẹ́
  rationale: Ó sọ ohun tí wọ́n ń sọ nípa ara wọn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: σοφοὶ
  choice: ọlọ́gbọ́n
  rationale: Ọ̀rọ̀ yìí jẹ́ àdámọ̀ tí ó ṣe deede pẹ̀lú ‘wise,’ ó sì pa ìṣòro ìyàtọ̀ tó wà láàárín ọgbọ́n àti òmùgọ̀ mọ́.
- source_word: ἐμωράνθησαν
  choice: wọ́n di òmùgọ̀
  rationale: ‘Di’ fi ìyípadà sí ipò tuntun hàn, ‘òmùgọ̀’ sì pa agbára ìtakora Pọ́ọ̀lù mọ́ ju ọ̀rọ̀ tó túmọ̀ sí pé wọ́n hùwà òmùgọ̀ lọ.
theological_decisions:
- issue: Bóyá ἐμωράνθησαν yẹ kí ó jẹ́ àpèjúwe ìwà (‘wọ́n di aláìgbọ́n’) tàbí orúkọ ìdánimọ̀ tó lágbára (‘wọ́n di òmùgọ̀’).
  choice: wọ́n di òmùgọ̀
  alternative: wọ́n di aláìgbọ́n; a sọ wọ́n di òmùgọ̀
  rationale: Àṣàyàn yìí pa ìtakora líle tó wà nínú Gíríìkì mọ́ láàárín ‘ọlọ́gbọ́n’ àti ‘òmùgọ̀,’ láì pinnu bóyá agbára òde ni ó sọ wọ́n di bẹ́ẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘àwọn’ gẹ́gẹ́ bí arọ́pò-orúkọ ẹni kẹta nínú gbólóhùn tí wọ́n sọ nípa ara wọn, a sì yàgò fún fífi ‘ṣùgbọ́n’ kún un nítorí kò sí ní tààrà nínú Gíríìkì.
