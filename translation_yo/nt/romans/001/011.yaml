source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: yo
  text: Nítorí mo ń hára gàgà láti rí yín, kí n lè fi ẹ̀bùn tẹ̀mí kan fún yín[a], láti fún yín lókun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pín ẹ̀bùn tẹ̀mí kan pẹ̀lú yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ẹ lè túbọ̀ dúró ṣinṣin.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: mo ń hára gàgà
  rationale: Ó sọ ìfẹ́-ọkàn tó lágbára jáde ní Yorùbá òde òní láì di ọ̀rọ̀ àtijọ́ tàbí àsọdùn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé tí gbólóhùn yìí ní pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: ἰδεῖν
  choice: láti rí
  rationale: Èyí tẹ̀ lé ìtumọ̀ tààrà ti ọ̀rọ̀ Gíríìkì; bí ó tilẹ̀ jẹ́ pé lílọ bẹ wọn wò wà nínú àyíká ọ̀rọ̀ náà, a kò fi kún un.
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó fi ète hàn ní ọ̀nà tó jẹ́ ti ẹ̀dá Yorùbá.
- source_word: τι
  choice: kan
  rationale: Ó pa àìsọ pàtó inú Gíríìkì mọ́ nínú gbólóhùn Yorùbá tó ṣe déédéé.
- source_word: μεταδῶ
  choice: pín ... pẹ̀lú yín
  rationale: Ó mú èrò fífi ohun tí ẹni ní kópa fún ẹlòmíràn jáde, láì jẹ́ kí ó dà bí ẹni pé Paulu ló dá ẹ̀bùn náà sílẹ̀.
- source_word: χάρισμα
  choice: ẹ̀bùn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a fi oore-ọ̀fẹ́ fúnni; kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ Gíríìkì kò fi dandan mú wọlé.
- source_word: πνευματικὸν
  choice: tẹ̀mí
  rationale: Ó jẹ́ àpèjúwe àdánidá fún ohun ti ẹ̀mí, ó sì yẹra fún pípinnu bóyá ẹ̀bùn iṣẹ́ ìyanu pàtó ni tàbí àǹfààní tẹ̀mí ní ìtumọ̀ gbòòrò.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: láti fún yín lókun
  rationale: Ó sọ ète tàbí àbájáde tí a fẹ́ ní Yorùbá tó rọrùn; àkọsílẹ̀ ìsàlẹ̀ pa ìrísí aláìṣe ti Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá “ẹ̀bùn tẹ̀mí” ń tọ́ka sí ẹ̀bùn iṣẹ́ ìyanu pàtó tàbí àǹfààní tẹ̀mí ní ìtumọ̀ gbòòrò
  choice: ẹ̀bùn tẹ̀mí kan
  alternative: ẹ̀bùn kan láti ọ̀dọ̀ Ẹ̀mí
  rationale: Gbólóhùn Gíríìkì kò fi dandan yan ìtumọ̀ tóóró tàbí sọ Ẹ̀mí Mímọ́ ní tààrà; ìtumọ̀ yìí pa ààyè ìtumọ̀ náà mọ́, kò sì gbé ẹ̀kọ́ ẹ̀sìn ẹ̀ka kan wọlé.
- issue: Bóyá a ó sọ gbolohun ìkẹyìn ní ìṣe tàbí ní aláìṣe
  choice: láti fún yín lókun
  alternative: kí a lè fún yín lókun
  rationale: Ọ̀nà ìṣe náà jẹ́ ti Yorùbá àdánidá, ṣùgbọ́n a fi aláìṣe Gíríìkì hàn nínú àkọsílẹ̀ kí ìfararora ọ̀rọ̀ orísun àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹsẹ tó tẹ̀ lé e má bàjẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. “Mo ń hára gàgà” jẹ́ ọ̀rọ̀ òde òní tó ní iyì, “pín ... pẹ̀lú” sì ṣe àfihàn ìbáṣepọ̀ láì sọ pé ẹ̀bùn náà jẹ́ ẹ̀bùn iṣẹ́ ìyanu pàtó.
