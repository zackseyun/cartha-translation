id: ROM.1.3
reference: Romans 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: yo
  text: nípa Ọmọ rẹ̀, ẹni tí ó wá láti inú irú-ọmọ Dafidi[a] nípa ti ara[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó jẹ́ ìran Dafidi.”
    reason: lexical_alternative
  - marker: b
    text: “Nípa ti ara” níhìn-ín ń tọ́ka sí ìran ènìyàn tàbí ibi tí ó ti wá lórí ayé, kì í ṣe sí ìwà ẹlẹ́ṣẹ̀.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: nípa
  rationale: Ó ń tọ́ka sí ohun tí ìhìn rere tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú dá lé; “nípa” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó sì bá ìṣọ̀kan gbólóhùn náà mu.
- source_word: υἱοῦ
  choice: Ọmọ
  rationale: “Ọmọ” ni ìtumọ̀ tààrà, lẹ́tà ńlá sì ń mú kí ó ṣe kedere pé Ọmọ Ọlọ́run ni a ń tọ́ka sí, láìfi ẹ̀kọ́ míì kún ọ̀rọ̀ Gíríìkì náà.
- source_word: γενομένου
  choice: ẹni tí ó wá láti inú
  rationale: Àṣàyàn yìí pa èrò ìpilẹ̀ṣẹ̀ tàbí ìran tí γίνομαι ní nínú àyíká yìí mọ́, ó sì jẹ́ Yorùbá àdánidá ju ìtumọ̀ líle bí “ẹni tí ó di” lọ.
- source_word: σπέρματος
  choice: irú-ọmọ
  rationale: Nínú àyíká ìran ìdílé, “irú-ọmọ” sọ ìtumọ̀ “irúgbìn/ọmọ tí ó ti inú ẹnìkan jáde” di mímọ̀, ó sì tún pa àwòrán ọ̀rọ̀ orísun mọ́ dé ìwọ̀n tó yẹ.
- source_word: Δαυὶδ
  choice: Dafidi
  rationale: Èyí ni ọ̀nà tí a sábà ń gbà kọ orúkọ Dáfídì nínú Yorùbá Bíbélì àti èdè ìjọsìn.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: Ó pa ìtumọ̀ tààrà ti “gẹ́gẹ́ bí ara” mọ́ ní Yorùbá tó ṣeé lóye, láìyí i sí ọ̀rọ̀ ẹ̀kọ́ nípa “ìwà ẹlẹ́ṣẹ̀.”
theological_decisions:
- issue: Bí a ṣe máa sọ ìbáṣepọ̀ láàárín jíjẹ́ Ọmọ Ọlọ́run àti jíjẹ́ ẹni ìran Dafidi
  choice: 'A pa méjèèjì mọ́ ní tààrà: “Ọmọ rẹ̀” àti “ẹni tí ó wá láti inú irú-ọmọ Dafidi nípa ti ara.”'
  alternative: “Ọmọ rẹ̀, ẹni tí ó jẹ́ ìran Dafidi nípa ẹ̀dá ènìyàn rẹ̀.”
  rationale: Ọ̀rọ̀ náà fi jíjẹ́ Ọmọ Ọlọ́run àti ìran ènìyàn tòótọ́ láti ọ̀dọ̀ Dafidi sí ẹ̀gbẹ́ ara wọn, kò sì ṣàlàyé bí wọ́n ṣe jọ wà. Ìtumọ̀ yìí pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yẹn mọ́ dípò kí ó fi èdè ẹ̀kọ́ ìgbàgbọ́ ti àkókò tó tẹ̀ lé e tú u.
- issue: Ìtumọ̀ “ara” nínú κατὰ σάρκα
  choice: “nípa ti ara,” pẹ̀lú àlàyé pé ìran ènìyàn ni ó ń tọ́ka sí
  alternative: “nípa ìran ènìyàn”
  rationale: Mímú “ara” dúró pa ọ̀rọ̀ Pọ́ọ̀lù tí ó ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ mọ́; àlàyé ìsàlẹ̀ ojú-ewé dènà kí a má bà a kà sí ìwà ẹlẹ́ṣẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “irú-ọmọ” láti pa ìró ọ̀rọ̀ ìran Bíbélì mọ́, ṣùgbọ́n àlàyé [a] pèsè ọ̀nà tí ó túbọ̀ wọ́pọ̀. Àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
