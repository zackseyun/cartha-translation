id: ROM.1.5
reference: Romans 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: yo
  text: Nípasẹ̀ ẹni náà ni àwa ti gba oore-ọ̀fẹ́ àti iṣẹ́ àpọ́sítélì fún ìgbọ́ràn ìgbàgbọ́[a] láàárín gbogbo àwọn orílẹ̀-èdè[b], nítorí orúkọ rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbọ́ràn tí ó ti inú ìgbàgbọ́ wá,” tàbí “ìgbọ́ràn tí ó jẹ́ ìgbàgbọ́.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “láàárín gbogbo àwọn Kèfèrí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Nípasẹ̀ ẹni tí
  rationale: Ọ̀rọ̀ yìí fi ẹni tí a mẹ́nu kàn ṣáájú—Jésù Kristi—hàn gẹ́gẹ́ bí ẹni tí a fi gba ohun tí ó tẹ̀ lé e, ó sì pa ìsopọ̀ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ἐλάβομεν
  choice: àwa gba
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ “àwa” mú ẹni àkọ́kọ́ púpọ̀ inú Gíríìkì hàn kedere, láì pinnu bóyá Pọ́ọ̀lù ń lo ọ̀rọ̀ náà fún ara rẹ̀ nìkan tàbí fún ẹgbẹ́ kan.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún χάρις nínú lílo Pọ́ọ̀lù; ó tọ́ka sí ojúrere tí Ọlọ́run fi fúnni lọ́fẹ̀ẹ́.
- source_word: καὶ ἀποστολήν
  choice: àti iṣẹ́ àpọ́sítélì
  rationale: A pa àwọn orúkọ méjèèjì, “oore-ọ̀fẹ́” àti “iṣẹ́ àpọ́sítélì,” mọ́ gẹ́gẹ́ bí Gíríìkì ṣe so wọ́n pọ̀, dípò kíkó wọn di èrò kan ṣoṣo.
- source_word: εἰς
  choice: fún
  rationale: “Fún” fi ète tàbí àfojúsùn iṣẹ́ àpọ́sítélì hàn ní Yorùbá àdánidá.
- source_word: ὑπακοὴν πίστεως
  choice: ìgbọ́ràn ìgbàgbọ́
  rationale: 'Ìtumọ̀ yìí fara mọ́ ìsopọ̀ àwọn orúkọ méjèèjì, ó sì jẹ́ kí àìdánilójú náà dúró: ó lè jẹ́ ìgbọ́ràn tí ó ti inú ìgbàgbọ́ wá tàbí ìgbọ́ràn tí ó jẹ́ ìgbàgbọ́ fúnra rẹ̀.'
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ Yorùbá tí ó ṣe déédé jù lọ fún πίστις níbí, láì yí i sí “ìṣòtítọ́” tàbí ṣíṣe àlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: láàárín gbogbo àwọn orílẹ̀-èdè
  rationale: “Àwọn orílẹ̀-èdè” pa ìtumọ̀ gbígbòòrò ἔθνη mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ “àwọn Kèfèrí” hàn.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: nítorí orúkọ rẹ̀
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ohun tí a ṣe nítorí ẹni náà àti fún ire tàbí ọlá orúkọ rẹ̀, láì fi ọ̀rọ̀ àlàyé míì kún un.
theological_decisions:
- issue: Ìtumọ̀ ὑπακοὴν πίστεως
  choice: ìgbọ́ràn ìgbàgbọ́
  alternative: ìgbọ́ràn tí ó ti inú ìgbàgbọ́ wá; ìgbọ́ràn tí ó jẹ́ ìgbàgbọ́
  rationale: Ìsopọ̀ genitive náà kúkúrú, ó sì lè gba ju ìtumọ̀ kan lọ. Ọ̀rọ̀ inú ẹsẹ̀ pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ náà mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ àwọn ìtumọ̀ pàtàkì tó ṣeé ṣe.
translation_notes:
  register: A lo Yorùbá ọ̀nà ìkọ̀wé òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Àwa” mú nọ́ńbà púpọ̀ Gíríìkì hàn kedere; “ìgbọ́ràn ìgbàgbọ́” sì mọ̀ọ́mọ̀ pa ìhámọ́ra àti àìdánilójú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
