  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn èrò pàtàkì Gíríìkì mọ́: ẹni tí iṣẹ́ náà ti wá, ẹni àkọ́kọ́ púpọ̀ nínú “a gba,” oore-ọ̀fẹ́ àti ipò/ìṣẹ́ àpọ́sítélì gẹ́gẹ́ bí ohun méjì tí a so pọ̀, ète ìgbọ́ràn ìgbàgbọ́, gbogbo àwọn orílẹ̀-èdè, àti ṣíṣe é fún orúkọ rẹ̀. Síbẹ̀, “Nípasẹ̀ ẹni tí àwa gba” kò dáa gẹ́gẹ́ bí ìbẹ̀rẹ̀ gbolóhùn Yorùbá: “ẹni tí” ń retí gbolóhùn ìbátan, ṣùgbọ́n a nílò ìtumọ̀ “through whom.”'
