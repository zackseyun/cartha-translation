id: ROM.1.18
reference: Romans 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: yo
  text: Nítorí ìbínú Ọlọ́run ni a ń ṣí payá láti ọ̀run lòdì sí gbogbo àìbọ̀wọ̀ fún Ọlọ́run àti àìṣòdodo àwọn ènìyàn tí wọ́n ń fi àìṣòdodo tẹ òtítọ́ mọ́lẹ̀.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ni a ṣí payá.”
    reason: lexical_alternative
  - marker: b
    text: “Tẹ … mọ́lẹ̀” tún lè jẹ́ “dè … dúró” tàbí “ṣèdíwọ́ fún …” nínú àyíká yìí.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ sí, “tí wọ́n ń tẹ òtítọ́ mọ́lẹ̀ nínú àìṣòdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: ni a ń ṣí payá
  rationale: Ọ̀rọ̀ ìṣe aláìṣe ní àkókò ìsinsìnyí ni; ‘a ń ṣí payá’ fi hàn pé ìṣípayá náà ń ṣẹlẹ̀, láìsọ ẹni tí ó ń ṣe é ní pàtó.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: ὀργὴ θεοῦ
  choice: ìbínú Ọlọ́run
  rationale: Ó pa ìtumọ̀ ìdájọ́ àti ìdáhùn Ọlọ́run fún ẹ̀ṣẹ̀ mọ́, dípò kí a sọ ọ́ di àbájáde aláìlẹ́ni-nínú lásán.
- source_word: ἀπ’ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ìtumọ̀ tààrà tí ó fi orísun ìṣípayá náà hàn.
- source_word: πᾶσαν ἀσέβειαν
  choice: gbogbo àìbọ̀wọ̀ fún Ọlọ́run
  rationale: Ó mú ìdarí ọ̀rọ̀ náà sí Ọlọ́run hàn kedere, ó sì jẹ́ èdè Yorùbá àdánidá ju ọ̀rọ̀ àkójọpọ̀ tí kò wọ́pọ̀ lọ.
- source_word: ἀδικίαν
  choice: àìṣòdodo
  rationale: Ó ní ìwọ̀n ìtumọ̀ ìwà búburú àti àìtọ́ tí ἀδικία ní nínú ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ènìyàn lápapọ̀, kì í ṣe ọkùnrin nìkan.
- source_word: τῶν ... κατεχόντων
  choice: tí wọ́n ń ... tẹ ... mọ́lẹ̀
  rationale: Nínú àyíká yìí κατέχω túmọ̀ sí dídènà tàbí títẹ òtítọ́ mọ́lẹ̀, kì í ṣe dídi í mú nìkan.
- source_word: τὴν ἀλήθειαν
  choice: òtítọ́
  rationale: Ìtumọ̀ tààrà, tí àyíká kò béèrè pé kí a dín ìtumọ̀ rẹ̀ kù.
- source_word: ἐν ἀδικίᾳ
  choice: fi àìṣòdodo
  rationale: Ìlò ‘fi’ ń sọ ọ̀nà tàbí ohun èlò tí wọ́n fi ń tẹ òtítọ́ mọ́lẹ̀; síbẹ̀, Gíríìkì tún lè tọ́ka sí àyíká ìwà àìṣòdodo.
theological_decisions:
- issue: Bóyá ὀργὴ θεοῦ yẹ kí a rọ̀ sí àbájáde ìwà búburú tí kò jẹ́ ìdáhùn Ọlọ́run fúnra rẹ̀
  choice: ‘ìbínú Ọlọ́run’ gẹ́gẹ́ bí ìdáhùn ìdájọ́ Ọlọ́run fúnra rẹ̀
  alternative: àbájáde ìwà búburú tí ń ṣiṣẹ́ fúnra rẹ̀
  rationale: Ìṣọ̀kan ọ̀rọ̀ Gíríìkì àti ìjiyàn Pọ́ọ̀lù ń tọ́ka sí ìdáhùn Ọlọ́run fúnra rẹ̀; a kò mú un rọ̀ tàbí fi ẹ̀kọ́ mìíràn kún un.
- issue: Ìbáṣepọ̀ ἐν ἀδικίᾳ pẹ̀lú títẹ òtítọ́ mọ́lẹ̀
  choice: àìṣòdodo gẹ́gẹ́ bí ọ̀nà tí wọ́n fi ń tẹ òtítọ́ mọ́lẹ̀
  alternative: àìṣòdodo gẹ́gẹ́ bí ipò tàbí àyíká tí títẹ òtítọ́ mọ́lẹ̀ ti ń ṣẹlẹ̀
  rationale: Ìtumọ̀ ọ̀nà/ohun èlò bá àyíká mu dáadáa, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ ipò/àyíká tí Gíríìkì lè ní mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé lóye fún òǹkàwé gbogbogbò ni a lò. A yan ‘àìbọ̀wọ̀ fún Ọlọ́run’ láti sọ ìtumọ̀ ἀσέβεια ní kedere, ‘àìṣòdodo’ sì pa àtúnwí ἀδικία ... ἐν ἀδικίᾳ mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá àṣà Yorùbá boṣewa mu.
