id: ROM.1.7
reference: Romans 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: yo
  text: 'Sí gbogbo àwọn tí ó wà ní Róòmù, tí Ọlọ́run fẹ́ràn, tí a sì pè ní àwọn ẹni mímọ́[a]: Kí oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà[b] wà fún yín.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ẹni mímọ́ tí a pè” tàbí “tí a pè láti jẹ́ ẹni mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Kristi.”
    reason: lexical_alternative
  - marker: c
    text: 'A tún lè ṣètò apá àkọ́kọ́ pé: “tí Ọlọ́run fẹ́ràn, àwọn ẹni mímọ́ tí a pè.”'
    reason: previous_rendering
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: Sí gbogbo àwọn tí ó wà ní Róòmù
  rationale: Ó pa ìtumọ̀ gbogbo ẹni tí lẹ́tà náà ń bá sọ ní Róòmù mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: ἀγαπητοῖς θεοῦ
  choice: tí Ọlọ́run fẹ́ràn
  rationale: Ó sọ ìbáṣepọ̀ náà ní kedere àti ní èdè Yorùbá òde òní, láì sọ agbára ajẹtífù náà nù.
- source_word: κλητοῖς ἁγίοις
  choice: tí a sì pè ní ẹni mímọ́
  rationale: Ó tẹ̀ lé àwọn ajẹtífù Gíríìkì méjèèjì, kò sì fi ọ̀rọ̀ tó bá ‘láti di’ kún un; ‘ẹni mímọ́’ jẹ́ àkọlé àpèjúwe tó yé àwọn òǹkàwé.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún χάρις, ó sì pa ìtumọ̀ ìkíni àti ti ẹ̀kọ́ ìgbàgbọ́ mọ́.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ó bá ìtumọ̀ ìkíni àti ìwà rere pípé ti εἰρήνη mu ní àdánidá.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: Ọ̀nà yìí jẹ́ kedere, ó ní iyì, ó sì bá ìṣètò ọ̀rọ̀ Yorùbá mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó dúró ṣinṣin fún κύριος, ó sì pa agbára àkọlé náà mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ àkọlé ẹni àmì òróró; ‘Mèsáyà’ mú ìtumọ̀ àkọlé náà hàn ju lílo ọ̀rọ̀ àdàkọ ‘Kristi’ lọ.
theological_decisions:
- issue: Bóyá κλητοῖς ἁγίοις túmọ̀ sí ‘àwọn ẹni mímọ́ tí a pè’ tàbí ‘àwọn tí a pè láti di ẹni mímọ́’
  choice: tí a sì pè ní ẹni mímọ́
  alternative: tí a pè láti jẹ́ ẹni mímọ́
  rationale: Gíríìkì kò ní ọ̀rọ̀ tó túmọ̀ sí ‘láti jẹ́’ tàbí ‘láti di’; yíyan ‘pè ní ẹni mímọ́’ pa àìṣàlàyé díẹ̀ àti ìfarakanra àwọn ajẹtífù náà mọ́.
- issue: Bóyá Χριστοῦ yẹ kí a túmọ̀ sí àkọlé tàbí kí a kọ ọ́ gẹ́gẹ́ bí orúkọ àdàkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ìkíni yìí, Χριστός ṣì lè ṣiṣẹ́ gẹ́gẹ́ bí àkọlé; ‘Mèsáyà’ mú ìtumọ̀ ẹni àmì òróró náà hàn, nígbà tí àlàyé ìsàlẹ̀ fi àṣà ‘Kristi’ pamọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Kí ... wà fún yín’ mú ìṣe ìkíni Pọ́ọ̀lù jáde ní àdánidá; àtòjọ àwọn gbolohun àpèjúwe sì pa ìṣètò orísun Gíríìkì mọ́ láì jẹ́ kí Yorùbá le.
