  to: 'Sí gbogbo àwọn tí ó wà ní Róòmù, tí Ọlọ́run fẹ́ràn, tí a sì pè ní àwọn ẹni mímọ́[a]: Kí oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà[b] wà fún yín.[c]'
