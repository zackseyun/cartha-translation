    issue: Àìbáamu iye-orúkọ nínú ‘tí a sì pè ní ẹni mímọ́.’
    rationale: Àdírẹ́sì náà jẹ́ sí ‘gbogbo àwọn’ ènìyàn ní Róòmù. Ní Yorùbá, ‘tí a pè ní àwọn ẹni mímọ́’ ni ó bá olùgbọ́ púpọ̀ náà mu. Ìyípadà yìí kò fi ìtumọ̀ ‘láti jẹ́’ kún κλητοῖς ἁγίοις.
