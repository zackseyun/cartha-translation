  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pe gbogbo àwọn tó wà ní Róòmù, àwọn tí Ọlọ́run fẹ́ràn, tí a sì pè ní ẹni mímọ́; ó sì mú ìkíni ‘oore-ọ̀fẹ́ àti àlàáfíà’ àti orísun wọn wá láti ọ̀dọ̀ Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà hàn. Àmọ́, ‘ẹni mímọ́’ ní ẹyọ kan kò bá olùgbọ́ púpọ̀ ‘àwọn’ mu nínú gbolohun Yorùbá yìí.'
  naturalness: Àgbékalẹ̀ gbolohun náà dára, ó ní ìwọ̀n ìyì tí ó yẹ fún lẹ́tà Pọ́ọ̀lù, àwọn àmì ohùn sì pé. Yíyí ‘ní ẹni mímọ́’ sí ‘ní àwọn ẹni mímọ́’ mú ìbáamu iye-orúkọ rẹ̀ dára sí i.
  terminology: ‘Oore-ọ̀fẹ́,’ ‘àlàáfíà,’ ‘Ọlọ́run Baba wa,’ àti ‘Olúwa’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu. ‘Mèsáyà’ jẹ́ ìtumọ̀ àkọlé tó ṣeé gbà fún Χριστοῦ, àti àlàyé ‘Kristi’ ń fi ọ̀nà ìbílẹ̀ náà hàn.
  issues:
