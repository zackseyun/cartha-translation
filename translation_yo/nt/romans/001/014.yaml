  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: yo
  text: Mo ní ojúṣe sí àwọn Gíríìkì àti àwọn tí kì í ṣe Gíríìkì[a], sí àwọn ọlọ́gbọ́n àti àwọn aláìgbọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àjèjì” tàbí “àwọn báríbárì.” Níhìn-ín, ọ̀rọ̀ Gíríìkì náà ń fi ìyàtọ̀ àṣà tí ó wọ́pọ̀ láàárín àwọn Gíríìkì àti àwọn tí kì í ṣe Gíríìkì hàn; kò ní dandan túmọ̀ sí àwọn ènìyàn òǹrorò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: àwọn Gíríìkì
  rationale: Ó tọ́ka sí àwọn Gíríìkì gẹ́gẹ́ bí ẹgbẹ́ ènìyàn àti àṣà, ó sì pa ìyàtọ̀ méjì àkọ́kọ́ mọ́.
- source_word: βαρβάροις
  choice: àwọn aláìsọ èdè Gíríìkì
  rationale: Nínú ìlò Gíríìkì ìgbà náà, ọ̀rọ̀ yìí sábà ń tọ́ka sí àwọn tí kì í sọ èdè Gíríìkì, gẹ́gẹ́ bí òdìkejì àwọn Gíríìkì; yíyan ọ̀rọ̀ yìí yẹra fún ìtumọ̀ òde òní pé wọ́n jẹ́ òǹrorò.
- source_word: σοφοῖς
  choice: àwọn ọlọ́gbọ́n
  rationale: Ìtumọ̀ tààrà, àdánidá ni èyí, ó sì bá òdìkejì rẹ̀ mu.
- source_word: ἀνοήτοις
  choice: àwọn aláìgbọ́n
  rationale: Ó pa ìyàtọ̀ pẹ̀lú ‘àwọn ọlọ́gbọ́n’ mọ́ láì fi ìtumọ̀ náà mọ́ ẹ̀kọ́ ilé-ẹ̀kọ́ nìkan.
- source_word: ὀφειλέτης
  choice: Mo jẹ gbèsè fún
  rationale: Àpẹẹrẹ gbèsè tí orúkọ Gíríìkì náà ní ni èyí pa mọ́, ṣùgbọ́n ní àyíká yìí ó túmọ̀ sí ojúṣe líle, kì í ṣe gbèsè owó.
- source_word: τε ... καὶ / τε ... καὶ
  choice: àti ... àti ...; fún ... àti fún ...
  rationale: Ìṣètò tó dọ́gba yìí pa àwọn ìsọ̀rí méjèèjì àti ìlù ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ gbèsè Pọ́ọ̀lù
  choice: Gbèsè gẹ́gẹ́ bí àpẹẹrẹ ojúṣe
  alternative: Gbèsè owó ní ti gidi
  rationale: Àyíká iṣẹ́ ìhìn rere fi hàn pé ὀφειλέτης ń sọ nípa ojúṣe tí ó wà lórí Pọ́ọ̀lù, kì í ṣe gbèsè owó.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘jẹ gbèsè fún’ láti pa àwòrán ọ̀rọ̀ orísun mọ́, a sì lo ‘aláìsọ èdè Gíríìkì’ láti yàgò fún ìtumọ̀ àbùkù tí ‘barbarian’ lè ní lónìí.
