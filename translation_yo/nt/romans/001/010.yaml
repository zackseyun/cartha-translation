  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì nínú ọ̀rọ̀ Gíríìkì náà wá: ìrántí nínú àdúrà déédéé, ẹ̀bẹ̀ onítara, àìdánilójú nípa àǹfààní láti wá, àti ìṣàkóso ìfẹ́ Ọlọ́run. Ṣùgbọ́n “ní àsẹ̀yìnwá àsẹ̀yìnbọ̀” kò ṣe kedere, kò sì jẹ́ ọ̀nà tó dára láti fi ἤδη ποτὲ (“ní ìgbẹ̀yìn/níkẹyìn”) hàn. “Tọ̀ ọ́ wá sọ́dọ̀ yín” tún lè túmọ̀ sí lílépa ẹni kan, dípò wíwá sí ọ̀dọ̀ wọn.'
