  terminology: “Ìfẹ́ Ọlọ́run” yẹ. Ṣíṣe é ní “gẹ́gẹ́ bí ìfẹ́ Ọlọ́run” ṣàfihàn ἐν τῷ θελήματι τοῦ θεοῦ ní kedere, láìkọjá ohun tí ọ̀rọ̀ náà sọ. Àlàyé ìsàlẹ̀ ojú ewé yẹ kí ó pa àṣàyàn “ọ̀nà yọrí sí rere/ìrìn àjò yọrí sí rere” mọ́, ṣùgbọ́n kí ó má sọ Ọlọ́run di olùṣe gírámà níbi tí ìṣe palolo Gíríìkì kò ti sọ ọ́ ní tààrà.
