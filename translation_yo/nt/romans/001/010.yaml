source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: yo
  text: Nígbà gbogbo nínú àdúrà mi, mo ń bẹ̀bẹ̀ pé bóyá ní ọ̀nà kan, ní ìgbẹ̀yìn, yóò ṣeé ṣe fún mi, gẹ́gẹ́ bí ìfẹ́ Ọlọ́run, láti wá sọ́dọ̀ yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀nà mi lè yọrí sí rere,” tàbí, “ìrìn àjò mi láti wá sọ́dọ̀ yín lè yọrí sí rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó fi hàn pé Pọ́ọ̀lù máa ń ṣe èyí déédéé; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: nínú àdúrà mi
  rationale: Èyí ni ọ̀nà àdánidá láti sọ pé ó máa ń fi ọ̀ràn náà sínú àdúrà rẹ̀.
- source_word: δεόμενος
  choice: mo ń bẹ̀bẹ̀
  rationale: Ó mú ìtara inú ẹ̀bẹ̀ àdúrà náà jáde ju ‘mo ń béèrè’ lọ, láìsọ ọ́ di àsọdùn.
- source_word: εἴ πως
  choice: pé bóyá ní ọ̀nà kan
  rationale: Ó pa àìdánilójú àti ìfẹ́ ọkàn tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἤδη ποτὲ
  choice: ní àsẹ̀yìnwá àsẹ̀yìnbọ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìrètí pípẹ́ pé ohun náà yóò ṣẹlẹ̀ níkẹyìn hàn.
- source_word: εὐοδωθήσομαι
  choice: yóò ṣeé ṣe fún mi
  rationale: Nínú àyíká yìí, ó túmọ̀ sí pé ọ̀nà yóò ṣí tàbí pé ète ìrìn náà yóò yọrí sí rere; yíyan yìí yẹra fún ìtumọ̀ ọrọ̀-ajé tí ‘ní aásìkí’ lè mú wá.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: nípa ìfẹ́ Ọlọ́run
  rationale: Ó fi ìfẹ́ Ọlọ́run hàn gẹ́gẹ́ bí ohun tó ń darí bóyá ìrìn náà yóò ṣeé ṣe.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: láti tọ̀ ọ́ wá sọ́dọ̀ yín
  rationale: Ó túmọ̀ ìṣípò wá sọ́dọ̀ àwọn olùgbọ́ ní kedere láìfi èrò míì kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìbáṣepọ̀ àdúrà Pọ́ọ̀lù àti ìfẹ́ Ọlọ́run
  choice: Pa ‘nípa ìfẹ́ Ọlọ́run’ mọ́ gẹ́gẹ́ bí ohun tó ń darí àṣeyọrí ìrìn náà.
  alternative: Túmọ̀ rẹ̀ bí ‘bí Ọlọ́run bá fẹ́.’
  rationale: Yíyan náà dúró sún mọ́ ἐν τῷ θελήματι τοῦ θεοῦ, kò sì yanjú bí ìfẹ́ Ọlọ́run ṣe ń ṣiṣẹ́ nípa ìrìn náà ju ohun tí ẹsẹ̀ sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó yẹ. ‘Ní àsẹ̀yìnwá àsẹ̀yìnbọ̀’ jẹ́ ọ̀rọ̀ àdánidá fún ìrètí pé ohun kan yóò ṣẹlẹ̀ níkẹyìn; àlàyé ìsàlẹ̀ ojú ewé sì pa àwòrán ‘ọ̀nà tí ó yọrí sí rere’ nínú εὐοδωθήσομαι mọ́.
