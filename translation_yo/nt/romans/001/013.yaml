  to: Èmi kò fẹ́ kí ẹ má mọ̀, ẹ̀yin ará[a], pé ní ọ̀pọ̀ ìgbà ni mo ti pinnu láti wá sọ́dọ̀ yín, ṣùgbọ́n a ti dí mi lọ́wọ́ títí di ìsinsìnyí, kí n lè ní èso díẹ̀[b] láàárín yín pẹ̀lú, gẹ́gẹ́ bí mo ti ní láàárín àwọn ènìyàn tí kì í ṣe Júù yòókù[c].
