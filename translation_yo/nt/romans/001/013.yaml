id: ROM.1.13
reference: Romans 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: yo
  text: Èmi kò fẹ́ kí ẹ má mọ̀, ẹ̀yin ará[a], pé ní ọ̀pọ̀ ìgbà ni mo ti pinnu láti wá sọ́dọ̀ yín, ṣùgbọ́n a ti dí mi lọ́wọ́ títí di ìsinsìnyí, kí n lè ní èso díẹ̀[b] láàárín yín pẹ̀lú, gẹ́gẹ́ bí mo ti ní láàárín àwọn ènìyàn tí kì í ṣe Júù yòókù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ náà lè túmọ̀ sí ‘ẹ̀yin arákùnrin àti arábìnrin,’ ìyẹn gbogbo àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: ‘Èso’ níhìn-ín ń tọ́ka sí àbájáde iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù láàárín wọn.
    reason: cultural_note
  - marker: c
    text: Tàbí ‘àwọn orílẹ̀-èdè yòókù.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: Èmi kò fẹ́ kí ẹ má mọ̀
  rationale: Ó pa ìsọ̀rọ̀ alátakò ti Gíríìkì mọ́ dípò yíyí i padà sí ‘Mo fẹ́ kí ẹ mọ̀,’ síbẹ̀ ó ṣe kedere ní Yorùbá òde òní.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ará’ jẹ́ ọ̀rọ̀ àdúgbò ìgbàgbọ́ tó bójú mu, ó sì lè tọ́ka sí gbogbo àwọn onígbàgbọ́ láìfi akọ tàbí abo hàn ní dandan; àlàyé ìtumọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: πολλάκις προεθέμην
  choice: ní ọ̀pọ̀ ìgbà ni mo ti pinnu
  rationale: Ó fi ìpinnu tí Pọ́ọ̀lù ti ṣe léraléra hàn ní Yorùbá àdánidá.
- source_word: ἐκωλύθην
  choice: a ti dí mi lọ́wọ́
  rationale: Ó pa ohùn àìṣe (passive) mọ́, kò sì sọ ẹni tàbí ohun tó dá a dúró níbi tí orísun kò ti sọ ọ́.
- source_word: ἄχρι τοῦ δεῦρο
  choice: títí di ìsinsìnyí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti sọ àkókò tó dé báyìí.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: kí n lè ní èso díẹ̀
  rationale: Ó pa àkàwé iṣẹ́ àgbẹ̀ náà mọ́, pẹ̀lú àlàyé pé àbájáde iṣẹ́ ìránṣẹ́ ni ‘èso’ túmọ̀ sí níhìn-ín.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó bá ọ̀rọ̀ nípa àbájáde iṣẹ́ Pọ́ọ̀lù nínú àwùjọ wọn mu ju ‘nínú yín’ lọ.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: àwọn aláìní-Júù yòókù
  rationale: Nínú ọ̀rọ̀ Pọ́ọ̀lù níbí, ἔθνη tọ́ka sí àwọn tí kì í ṣe Júù; ‘yòókù’ tún fi hàn pé àwọn tó ń kọ̀wé sí wà lára pápá iṣẹ́ rẹ̀ sí àwọn aláìní-Júù.
theological_decisions:
- issue: Bí ‘èso’ ṣe kan Pọ́ọ̀lù àti àwọn ará Róòmù
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘ní èso díẹ̀ láàárín yín.’
  alternative: Túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘kí iṣẹ́ ìránṣẹ́ mi lè ní àbájáde láàárín yín.’
  rationale: Orísun fi àkàwé ‘èso’ sílẹ̀, ó sì lè gba ìtumọ̀ tó fẹ̀ ju ìyípadà ọkàn nìkan lọ; àlàyé ìsàlẹ̀ ń ràn òǹkàwé lọ́wọ́ láìdín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: A lo Yorùbá boṣewa tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà pa ìtẹ̀sí ìtumọ̀ orísun mọ́, kò fi ‘ní báyìí’ sí ìbẹ̀rẹ̀, ó sì yà àlàyé tí Pọ́ọ̀lù dá sí àárín gbólóhùn náà sọ́tọ̀ pẹ̀lú àmì kọ́má.
