id: ROM.1.25
reference: Romans 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: yo
  text: Àwọn náà ni wọ́n pààrọ̀ òtítọ́ Ọlọ́run fún irọ́, wọ́n sì bọ̀wọ̀ fún ohun tí a dá, wọ́n sì sìn ín dípò Ẹlẹ́dàá, ẹni tí a bùkún fún títí láéláé. Àmín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν ... ἐν
  choice: pààrọ̀ ... fún
  rationale: Èyí sọ ìyípadà láti inú òtítọ́ Ọlọ́run sí irọ́ ní Yorùbá àdánidá, ó sì pa àwòrán ‘pàṣípààrọ̀’ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: òtítọ́ Ọlọ́run
  rationale: Ó tẹ̀ lé ìtumọ̀ genitive Gíríìkì láì fi àlàyé míì kún un pé bóyá òtítọ́ láti ọ̀dọ̀ Ọlọ́run ni tàbí òtítọ́ nípa Ọlọ́run.
- source_word: τῷ ψεύδει
  choice: irọ́
  rationale: ‘Irò’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ψεῦδος; Yorùbá kì í lo article bí Gíríìkì, nítorí náà a kò fi ‘irọ́ náà’ mú un di irọ́ kan pàtó láìní dandan.
- source_word: ἐσεβάσθησαν
  choice: bọ̀wọ̀ fún
  rationale: Ó mú ìtumọ̀ fífi ọ̀wọ̀ ẹ̀sìn tàbí ọ̀wọ̀ gíga fún nǹkan jáde, ó sì yà á sọ́tọ̀ kúrò ní ἐλάτρευσαν.
- source_word: ἐλάτρευσαν
  choice: sìn
  rationale: ‘Sìn’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún iṣẹ́ ìjọsìn tàbí iṣẹ́ ẹ̀sìn tí λατρεύω ń tọ́ka sí.
- source_word: τῇ κτίσει
  choice: ohun tí a dá
  rationale: Ìsọ̀rọ̀ yìí jẹ́ ti òde òní, ó sì lè gba ìtumọ̀ ohun ẹ̀dá tàbí àpapọ̀ ohun tí a dá láì dín κτίσις kù sí ẹ̀dá alààyè nìkan.
- source_word: τὸν κτίσαντα
  choice: Ẹlẹ́dàá
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ohun tí a dá àti ẹni tó dá a, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: ẹni tí ìyìn yẹ fún títí láéláé
  rationale: Èyí jẹ́ Yorùbá àdánidá fún àsọyé ìyìn sí Ọlọ́run; ó yẹra fún gbolohun tí ó lè dà bí ẹni pé ẹlòmíràn ni ń súre fún Ẹlẹ́dàá.
theological_decisions:
- issue: Ohun tí gbolohun ‘òtítọ́ Ọlọ́run’ túmọ̀ sí ní pàtó
  choice: Pa àkójọpọ̀ ‘òtítọ́ Ọlọ́run’ mọ́
  alternative: ‘òtítọ́ nípa Ọlọ́run’ tàbí ‘òtítọ́ tí Ọlọ́run fi hàn’
  rationale: τοῦ θεοῦ lè gba ju ìbáṣepọ̀ kan lọ; fífi àlàyé kan pàtó sínú ẹsẹ̀ yóò tú ohun tí orísun fi sílẹ̀ ní fífẹ̀.
- issue: Ìbáṣepọ̀ ἐσεβάσθησαν àti ἐλάτρευσαν
  choice: ‘bọ̀wọ̀ fún ... sì sìn’
  alternative: ‘jọsìn ... sì sìn’
  rationale: Yíyan ọ̀rọ̀ méjì ọ̀tọ̀ ń pa ìtẹnumọ́ méjèèjì mọ́, kò sì jẹ́ kí a sọ pé àwọn ọ̀rọ̀ Gíríìkì méjèèjì túmọ̀ sí ohun kan náà pátápátá.
- issue: Ìtumọ̀ εὐλογητός nípa Ẹlẹ́dàá
  choice: ‘ẹni tí ìyìn yẹ fún’
  alternative: ‘ẹni ìbùkún’
  rationale: Ní àyíká doxology yìí, ọ̀rọ̀ náà ń polongo pé Ẹlẹ́dàá yẹ fún ìyìn; ìtumọ̀ yìí kò tú u sí èrò pé Ọlọ́run ń gba ìbùkún bí ẹ̀bùn lọ́wọ́ ẹni mìíràn.
translation_notes:
  register: A lo Yorùbá àgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi gbogbo tí ó bá yẹ. ‘Àwọn náà ni’ so ẹsẹ̀ náà mọ́ àwọn ènìyàn tí a ń ṣàpèjúwe nínú àyíká tó ṣáájú, bí οἵτινες ṣe ń ṣe. A kò fi àlàyé ẹ̀kọ́ ìsìn tàbí àmì ìsàlẹ̀ ojú ìwé kún un.
