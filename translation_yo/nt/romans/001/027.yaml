id: ROM.1.27
reference: Romans 1:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: yo
  text: Bákan náà, àwọn akọ[a], lẹ́yìn tí wọ́n ti fi lílo abo ní ọ̀nà àdánidá sílẹ̀[b], jó nínú ìfẹ́kúfẹ̀ẹ́ wọn sí ara wọn[c]. Àwọn akọ ń ṣe ohun ìtìjú pẹ̀lú àwọn akọ[d], wọ́n sì ń gba ìsanpadà tí ó yẹ fún ìṣìnà wọn nínú ara wọn[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọkùnrin.” Gíríìkì lo ọ̀rọ̀ tí ó tọ́ka sí ẹni akọ.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ìlò àdánidá ti abo”; ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí lílo abo ní ti ìbálòpọ̀.
    reason: lexical_clarification
  - marker: c
    text: Tàbí, “wọ́n jó nínú ìfẹ́-ọkàn wọn sí ara wọn.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ń ṣe ohun tí ó yẹ fún ìtìjú.”
    reason: lexical_alternative
  - marker: e
    text: Tàbí, “ìsan tí ó yẹ.” Ọ̀rọ̀ náà lè tọ́ka sí ìpadà tàbí àbájáde tí ó bá ìṣìnà wọn mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: àwọn akọ / abo
  rationale: Àwọn ọ̀rọ̀ yìí pa ìtumọ̀ tí ó dá lórí ìbálòpọ̀ akọ àti abo mọ́, bí Gíríìkì ṣe sọ ọ́, dípò yíyí wọn sí ọ̀rọ̀ ìbáṣepọ̀ bí ‘ọkùnrin’ àti ‘obìnrin.’
- source_word: ἀφέντες
  choice: fi ... sílẹ̀
  rationale: Ó fi hàn pé wọ́n kọ ohun tí wọ́n ti ní tàbí ń ṣe tẹ́lẹ̀ sílẹ̀, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún participle náà.
- source_word: τὴν φυσικὴν χρῆσιν τῆς θηλείας
  choice: lílo abo ní ọ̀nà àdánidá
  rationale: Ó tẹ̀ lé èdè Gíríìkì ‘ìlò’ àti ‘abo’ pẹ́kípẹ́kí, láì fi ọ̀rọ̀ ìbálòpọ̀ tàbí ìbáṣepọ̀ tí ó túmọ̀ ju orísun lọ kún un.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους
  choice: ìfẹ́-ọkàn wọn sí ara wọn sì mú wọn jó bí iná
  rationale: Ó pa àwòrán jíjó iná inú ọ̀rọ̀-ìṣe Gíríìkì mọ́, nígbà tí ‘ìfẹ́-ọkàn’ kò fi ìdájọ́ míì kún ὄρεξις.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: àwọn akọ ... pẹ̀lú àwọn akọ
  rationale: Ó pa àtúnwí ọ̀rọ̀ tí ó dá lórí ìbálòpọ̀ akọ mọ́ àti agbára àsọyé rẹ̀.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: ń ṣe ohun ìtìjú
  rationale: Ó mú ìdájọ́ ìwà inú ἀσχημοσύνη jáde kedere, ṣùgbọ́n kò sọ irú ìṣe náà ní pàtó ju Gíríìkì lọ.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: ìsan tí ó yẹ
  rationale: ‘Ìsan’ lè jẹ́ ohun tí a rí padà gẹ́gẹ́ bí àbájáde, ‘tí ó yẹ’ sì pa ìtumọ̀ ohun tí ó bá a mu tàbí tí ó pọndandan mọ́.
- source_word: τῆς πλάνης αὐτῶν
  choice: fún ìṣìnà wọn
  rationale: ‘Ìṣìnà’ lè túmọ̀ sí pínyà kúrò ní ọ̀nà tàbí àṣìṣe, ó sì pa ààyè ìtumọ̀ πλάνη mọ́.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: ń gba ... nínú ara wọn
  rationale: Ó pa ìtumọ̀ reflexive mọ́ láì pinnu bóyá ó ń tọ́ka sí ara wọn gan-an, inú wọn, tàbí láàárín ara wọn.
theological_decisions:
- issue: Bóyá kí a rọ àwọn ọ̀rọ̀ akọ/abo di ọkùnrin/obìnrin
  choice: àwọn akọ ... abo ... àwọn akọ pẹ̀lú àwọn akọ
  alternative: àwọn ọkùnrin ... obìnrin ... àwọn ọkùnrin pẹ̀lú àwọn ọkùnrin
  rationale: Orísun lo àwọn ọ̀rọ̀ tí ó sàmì sí akọ àti abo nípa ìbálòpọ̀, kì í ṣe àwọn ọ̀rọ̀ ìbáṣepọ̀ tí ó wọ́pọ̀; ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́ láì fi ẹ̀kọ́ míì kún un.
- issue: Bóyá kí a sọ ohun ìtìjú náà ní pàtó ju orísun lọ
  choice: ń ṣe ohun ìtìjú
  alternative: ń ṣe ìṣe ìbálòpọ̀ akọ sí akọ
  rationale: ἀσχημοσύνη ní agbára ìdájọ́ ìwà, ṣùgbọ́n kò fún ìṣe náà ní orúkọ ìmọ̀-ìgbàlódé; a pa agbára náà mọ́ láì tú àìfihàn rẹ̀.
- issue: Ìtumọ̀ ìsan tí wọ́n gba nínú ara wọn
  choice: nínú ara wọn
  alternative: láàárín ara wọn / nínú ara wọn fúnra wọn
  rationale: Gíríìkì lè ru ìbéèrè nípa ọ̀nà tàbí ibi tí wọ́n ti gba ìsan náà; a kò sọ irú ìjìyà kan ní pàtó nítorí orísun náà kò ṣe bẹ́ẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A mọ̀ọ́mọ̀ lo ‘akọ/abo’ láti pa àsọyé Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ‘ọkùnrin/obìnrin’ lè wọ́pọ̀ sí i nínú ọ̀rọ̀ ojoojúmọ́. Àwọn gbólóhùn ‘mú wọn jó bí iná’ àti ‘ìsan tí ó yẹ’ jẹ́ àdánidá ní Yorùbá, wọ́n sì pa àwòrán àti ìforígbárí inú orísun mọ́.
