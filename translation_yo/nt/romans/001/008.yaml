id: ROM.1.8
reference: Romans 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: yo
  text: Lákọ̀ọ́kọ́, mo dúpẹ́ lọ́wọ́ Ọlọ́run mi nípasẹ̀ Jésù Mèsáyà[a] nítorí gbogbo yín, nítorí pé a ń kéde ìgbàgbọ́ yín[b] káàkiri gbogbo ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìdúróṣinṣin yín”; ó tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Lákọ̀ọ́kọ́
  rationale: Ó fi kókó àkọ́kọ́ nínú ọ̀rọ̀ Paulu hàn; Yorùbá yìí jẹ́ àdánidá, kò sì pọndandan láti tú μὲν lọ́tọ̀.
- source_word: εὐχαριστῶ τῷ θεῷ μου
  choice: mo dúpẹ́ lọ́wọ́ Ọlọ́run mi
  rationale: Ọ̀nà Yorùbá àdánidá ni ‘dúpẹ́ lọ́wọ́’ fún fífi ọpẹ́ fún ẹnì kan, ó sì pa ìbáṣepọ̀ ara ẹni inú ‘Ọlọ́run mi’ mọ́.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jésù Mèsáyà
  rationale: διά pẹ̀lú genitive tọ́ka sí ọ̀nà tàbí alárinà; ‘nípasẹ̀’ pa ìtumọ̀ náà mọ́. ‘Mèsáyà’ tú Χριστός gẹ́gẹ́ bí oyè ẹni àmì-òróró, dípò kí a fi í sílẹ̀ gẹ́gẹ́ bí àkọsílẹ̀-orúkọ nìkan.
- source_word: περὶ πάντων ὑμῶν
  choice: nítorí gbogbo yín
  rationale: Nínú ọ̀rọ̀ ìdúpẹ́ yìí, περί ní ìtumọ̀ pé ìdúpẹ́ náà jẹ́ nítorí gbogbo wọn; èyí jẹ́ Yorùbá tó ṣe kedere.
- source_word: ἡ πίστις ὑμῶν
  choice: ìgbàgbọ́ yín
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ tó bá àyíká ọ̀rọ̀ mu jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ ‘ìṣòtítọ́’ àti ‘ìgbẹ́kẹ̀lé’ mọ́.
- source_word: καταγγέλλεται
  choice: a ń kéde
  rationale: Ilana ‘a ń’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ẹni tó ń ṣe iṣẹ́ sílẹ̀ láìdárúkọ rẹ̀, ó sì pa ìṣe tó ń bá a lọ nínú present passive mọ́.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: káàkiri gbogbo ayé
  rationale: Ó sọ ìtànkálẹ̀ ọ̀rọ̀ náà ká gbogbo ayé tí a mọ̀ ní ọ̀nà Yorùbá tó lágbára, tó sì bá ìgbòòrò ọ̀rọ̀ Gíríìkì mu.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú διὰ Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì-òróró; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ìbílẹ̀ ‘Kristi’ mọ́.
- issue: Ìtumọ̀ πίστις nínú ἡ πίστις ὑμῶν
  choice: ìgbàgbọ́ yín
  alternative: ìṣòtítọ́ yín; ìgbẹ́kẹ̀lé yín
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka sí ìgbàgbọ́ àwọn ará Róòmù tí ìròyìn rẹ̀ tàn ká; síbẹ̀, πίστις lè ní àwọ̀ ìtumọ̀ ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé, a sì pa wọ́n mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè ìjọsìn tó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn Yorùbá àdánidá láìsọ ìṣe passive Gíríìkì di iṣẹ́ ẹni pàtó.
