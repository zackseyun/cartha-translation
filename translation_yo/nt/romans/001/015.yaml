  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni, ní ti èmi, mo ní ìtara láti kéde ìhìn rere fún ẹ̀yin náà tí ẹ wà ní Róòmù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti wàásù ìhìn rere fún ẹ̀yin náà tí ẹ wà ní Róòmù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Nítorí náà
  rationale: Níhìn-ín ó so ọ̀rọ̀ yìí mọ́ àlàyé Pọ́ọ̀lù tó ṣáájú gẹ́gẹ́ bí àbájáde tàbí ìparí èrò rẹ̀; ‘Nítorí náà’ jẹ́ àsopọ̀ Yorùbá tó ṣe kedere.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: ní ti èmi, mo ní ìtara
  rationale: Gbólóhùn Gíríìkì náà jẹ́ àkópọ̀ ọ̀rọ̀ tí a fi ohun kan sílẹ̀ láì sọ ọ́ ní kíkún. Ìtumọ̀ yìí pa ‘ní ti èmi’ mọ́, ó sì fi πρόθυμον hàn gẹ́gẹ́ bí ìfẹ́ inú àti ìtara, kì í ṣe wíwà ní imúrasílẹ̀ lásán.
- source_word: καὶ ὑμῖν
  choice: fún ẹ̀yin pẹ̀lú
  rationale: καὶ tẹnumọ́ pé àwọn tó wà ní Róòmù wà lára àwọn tí Pọ́ọ̀lù fẹ́ kéde ìhìn rere fún; fífi ‘pẹ̀lú’ sí lẹ́gbẹ̀ẹ́ àwọn olùgbà náà pa ìtẹnumọ́ yìí mọ́.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: tí ẹ wà ní Róòmù
  rationale: Ó dá àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ mọ̀ gẹ́gẹ́ bí àwọn tó wà ní Róòmù, ní ọ̀nà tó wọ́pọ̀, tó sì ṣe kedere ní Yorùbá.
- source_word: εὐαγγελίσασθαι
  choice: láti kéde ìhìn rere
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pípolongo ìròyìn ayọ̀ tàbí ìhìn rere. ‘Kéde ìhìn rere’ jẹ́ èdè Yorùbá tó ṣe kedere, kò sì fi ìtumọ̀ rẹ̀ mọ́ ìwàásù lórí pẹpẹ nìkan.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Ìtumọ̀ náà tẹ̀ lé ìṣètò àti ìtẹnumọ́ Gíríìkì níwọ̀n tó ti lè jẹ́ èdè Yorùbá àdánidá.
