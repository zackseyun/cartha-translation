  source_fidelity: 'Ìtumọ̀ náà mú èrò pàtàkì Gíríìkì náà dáadáa: ìfẹ́-inú Pọ́ọ̀lù láti kéde ìhìn rere fún àwọn olùgbọ́ rẹ̀ ní Róòmù. Síbẹ̀, “Nítorí náà” lè fi ìbáṣepọ̀ ìdí-àbájáde tó lágbára ju οὕτως (‘Bẹ́ẹ̀ ni/ní ọ̀nà yìí’) hàn, àti “pẹ̀lú” lẹ́yìn “ẹ̀yin” lè túmọ̀ sí ‘with’ dípò ‘also’ ní Yorùbá.'
