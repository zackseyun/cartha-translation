id: ROM.1.17
reference: Romans 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: yo
  text: Nítorí nínú rẹ̀ ni a ń fi òdodo Ọlọ́run[a] hàn láti inú ìgbàgbọ́ sí ìgbàgbọ́[b], gẹ́gẹ́ bí a ti kọ ọ́ sílẹ̀ pé, “Ẹni olódodo yóò wà láàyè nípa ìgbàgbọ́.”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdájọ́ òdodo Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ἐκ πίστεως εἰς πίστιν jẹ́ gbolohun tí ìtumọ̀ rẹ̀ ṣòro gan-an. “Láti inú ìgbàgbọ́ sí ìgbàgbọ́” pa “láti inú” àti “sí” mọ́, ó sì pa ìtúnlò “ìgbàgbọ́” mọ́. Àwọn ìtumọ̀ mìíràn ni “láti inú ìgbàgbọ́ fún ìgbàgbọ́,” “nípa ìgbàgbọ́ láti ìbẹ̀rẹ̀ dé òpin,” tàbí “nípasẹ̀ ìgbàgbọ́, fún ìgbàgbọ́.”
    reason: alternative_reading
  - marker: c
    text: Tàbí “ẹni tí ó jẹ́ olódodo nípa ìgbàgbọ́ yóò wà láàyè.”
    reason: alternative_reading
  - marker: d
    text: Tàbí “Ṣùgbọ́n ẹni olódodo yóò wà láàyè nípa ìgbàgbọ́.”
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún righteousness, ó sì lè gbé ìtumọ̀ ìwà títọ́ àti ìdájọ́ títọ́; àlàyé ìsàlẹ̀ fi “ìdájọ́ òdodo” hàn gẹ́gẹ́ bí ọ̀nà mìíràn.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Ìsọ̀rọ̀ “òdodo Ọlọ́run” pa ìbáṣepọ̀ genitive Gíríìkì mọ́ láì pinnu bóyá ó túmọ̀ sí òdodo tí Ọlọ́run ní tàbí èyí tó ti ọ̀dọ̀ Ọlọ́run wá.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Aropò-orúkọ neuter náà tọ́ka sí ìhìnrere tó wà ní ẹsẹ tó ṣáájú; “nínú rẹ̀” pa ìtọ́kasí yẹn mọ́.
- source_word: ἀποκαλύπτεται
  choice: ni a ti ń fi … hàn
  rationale: Ọ̀rọ̀ yìí sọ ìṣípayá ní ọ̀nà àdánidá ní Yorùbá, ó sì fi ipò passive àti ìṣe tó ń lọ hàn láì fi ẹni tó ń ṣe é kún un.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: láti inú ìgbàgbọ́ sí ìgbàgbọ́
  rationale: Ó pa preposition méjèèjì àti àtúnṣe πίστις mọ́, kí a má bàa yan ọ̀kan nínú àwọn ìtumọ̀ tí a ń jiyàn lé lórí.
- source_word: δίκαιος
  choice: ẹni olódodo
  rationale: Ó tú substantival adjective náà ní Yorùbá àdánidá, ó sì pa singular aṣojú rẹ̀ mọ́ láì fi akọ tàbí abo tí kò pọn dandan kún un.
- source_word: ἐκ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún modal tàbí instrumental sense, síbẹ̀ àlàyé ìsàlẹ̀ pa ambiguity ìsopọ̀ gbolohun náà mọ́.
- source_word: ζήσεται
  choice: yóò wà láàyè
  rationale: Ó pa future force mọ́, ó sì gbooro ju “yóò yè” lọ, èyí tó lè túmọ̀ sí líla ewu tàbí ikú nìkan.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη θεοῦ
  choice: òdodo Ọlọ́run
  alternative: òdodo tó ti ọ̀dọ̀ Ọlọ́run wá; ìdájọ́ òdodo Ọlọ́run
  rationale: Ìtumọ̀ genitive náà jẹ́ ohun tí a ń jiyàn lé lórí. Ìtumọ̀ àkọ́kọ́ pa ìṣòro àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ dípò kí ó yanjú rẹ̀ ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ ἐκ πίστεως εἰς πίστιν
  choice: láti inú ìgbàgbọ́ sí ìgbàgbọ́
  alternative: láti inú ìgbàgbọ́ fún ìgbàgbọ́; nípa ìgbàgbọ́ láti ìbẹ̀rẹ̀ dé òpin; nípasẹ̀ ìgbàgbọ́, fún ìgbàgbọ́
  rationale: Gbolohun náà ní ọ̀pọ̀ ìtumọ̀ tó ṣeé gbèjà. Ìtumọ̀ àkọ́kọ́ pa preposition àti àtúnṣe Gíríìkì mọ́ láì fi ẹ̀kọ́ pàtó kan sínú rẹ̀.
- issue: Ibi tí ἐκ πίστεως so mọ́ nínú ọ̀rọ̀ Hábákúkù
  choice: ẹni olódodo yóò wà láàyè nípa ìgbàgbọ́
  alternative: ẹni tí ó jẹ́ olódodo nípa ìgbàgbọ́ yóò wà láàyè
  rationale: Ní Gíríìkì, gbolohun prepositional náà lè so mọ́ “olódodo” tàbí “yóò wà láàyè.” Ọ̀rọ̀ àkọ́kọ́ jẹ́ àdánidá, àlàyé ìsàlẹ̀ sì pa ọ̀nà kejì mọ́.
- issue: Ìtumọ̀ particle δέ nínú àyọlò
  choice: a kò tú u lọ́tọ̀ nínú ọ̀rọ̀ àkọ́kọ́
  alternative: Ṣùgbọ́n ẹni olódodo yóò wà láàyè nípa ìgbàgbọ́
  rationale: Níhìn-ín δέ kì í ṣe ìtakora tó lágbára; fífi “ṣùgbọ́n” sí i lè mú kí àyọlò tó ń ṣètìlẹ́yìn fún ọ̀rọ̀ Pọ́ọ̀lù dà bí ìtakora. Àlàyé ìsàlẹ̀ pa ìtumọ̀ formal náà mọ́.
translation_notes:
  register: Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn ní kíkún bí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìrísí àyọlò Ìwé Mímọ́ mọ́ láì di Yorùbá àtijọ́ tàbí ti ẹ̀sìn ẹgbẹ́ kan.
