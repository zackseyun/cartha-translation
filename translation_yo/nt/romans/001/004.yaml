  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: ὁρισθέντος ni a fi hàn gẹ́gẹ́ bí ìkéde/fífihàn, ἐν δυνάμει ni “nínú agbára,” àti ἐξ ἀναστάσεως νεκρῶν ni ìsopọ̀ pẹ̀lú àjíǹde. Síbẹ̀, “jíjí dìde” lè dun bí ìṣe lasan ju ọ̀rọ̀ orúkọ ἀνάστασις lọ; “àjíǹde” dáa ju fún ìdúróṣinṣin sí orísun náà.'
  naturalness: “Ẹ̀mí ìjẹ́mímọ́” kò rọrùn tó nínú Yorùbá ìgbàlódé, ó sì lè tọ́ka sí ìlànà ìsọdimímọ́ ju “holiness” lọ. “ẹ̀mí ìwà mímọ́” ṣàfihàn ìtumọ̀ náà dáadáa, ó sì lè fi ìtọ́kasí sí Ẹ̀mí Mímọ́ sílẹ̀ ní àìdájú, gẹ́gẹ́ bí Gíríìkì. A tún mú àfikún ìdánimọ̀ Jésù rọrùn sí i ní Yorùbá.
  terminology: “Ọmọ Ọlọ́run,” “Mèsáyà,” àti “Olúwa wa” yẹ, wọ́n sì pa oyè Kristi mọ́. Kí a má ṣe fi ìtumọ̀ kan tí ó dájú ju orísun lọ sórí πνεῦμα ἁγιωσύνης, a lo ọ̀rọ̀ kékeré “ẹ̀mí ìwà mímọ́” nínú ara-ẹsẹ̀; àlàyé ìsàlẹ̀ sì ṣàfihàn “Ẹ̀mí Mímọ́” gẹ́gẹ́ bí àṣàyàn.
