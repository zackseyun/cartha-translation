  to: ẹni tí a sì fi hàn pé òun ni Ọmọ Ọlọ́run nínú agbára[a], gẹ́gẹ́ bí ẹ̀mí ìwà mímọ́[b], nípasẹ̀ àjíǹde kúrò nínú òkú—Jésù, ẹni tí í ṣe Mèsáyà náà, Olúwa wa.
