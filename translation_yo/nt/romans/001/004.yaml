id: ROM.1.4
reference: Romans 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: yo
  text: ẹni tí a sì fi hàn pé òun ni Ọmọ Ọlọ́run nínú agbára[a], gẹ́gẹ́ bí ẹ̀mí ìwà mímọ́[b], nípasẹ̀ àjíǹde kúrò nínú òkú—Jésù, ẹni tí í ṣe Mèsáyà náà, Olúwa wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a yàn án gẹ́gẹ́ bí Ọmọ Ọlọ́run nínú agbára,” tàbí “a pinnu pé òun ni Ọmọ Ọlọ́run nínú agbára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí Ẹ̀mí Mímọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: a fi hàn pé òun ni
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí yíyan, ṣíṣe àkíyèsí ẹni kan sí ipò kan, tàbí fífi ẹni náà hàn gbangba. “A fi hàn pé òun ni” jẹ́ Yorùbá àdánidá tí ó bá ìtumọ̀ ‘declared/designated’ mu, láì sọ pé Jésù ṣẹ̀ṣẹ̀ di Ọmọ Ọlọ́run nígbà àjíǹde.
- source_word: υἱοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa oyè Kristológì tó wà nínú Gíríìkì mọ́ ní ọ̀nà tààrà tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐν δυνάμει
  choice: nínú agbára
  rationale: Ìtumọ̀ yìí sún mọ́ Gíríìkì, ó sì pa ìsopọ̀ ‘Ọmọ Ọlọ́run nínú agbára’ mọ́ dípò kí ó sọ ọ́ di pé ìkéde náà nìkan ni a ṣe pẹ̀lú agbára.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: gẹ́gẹ́ bí Ẹ̀mí ìjẹ́mímọ́
  rationale: Ó pa gbólóhùn Gíríìkì tí kò wọ́pọ̀ yìí mọ́, kò sì fi dandan pinnu bóyá Ẹ̀mí Mímọ́ gan-an ni Pọ́ọ̀lù ń tọ́ka sí tàbí ipò ẹ̀mí tí ìjẹ́mímọ́ ń ṣàpèjúwe.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: nípasẹ̀ jíjí dìde kúrò nínú òkú
  rationale: Ó fi àjíǹde hàn gẹ́gẹ́ bí ìpìlẹ̀ tàbí ohun tí ó mú fífi ẹni náà hàn ṣẹlẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti sọ resurrection from the dead ní Yorùbá.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ dípò yíyá a gẹ́gẹ́ bí orúkọ lásán.
- source_word: κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún oyè κύριος, ó sì pa ìtumọ̀ Kristológì rẹ̀ mọ́.
theological_decisions:
- issue: Bóyá ὁρισθέντος túmọ̀ sí pé Jésù ṣẹ̀ṣẹ̀ di Ọmọ Ọlọ́run nígbà àjíǹde
  choice: A lo “a fi hàn pé òun ni Ọmọ Ọlọ́run nínú agbára,” èyí tí kò sọ pé ìbẹ̀rẹ̀ jíjẹ́ Ọmọ Ọlọ́run rẹ̀ ni àjíǹde.
  alternative: “a yàn sí ipò Ọmọ Ọlọ́run nínú agbára” tàbí “a pinnu rẹ̀ gẹ́gẹ́ bí Ọmọ Ọlọ́run nínú agbára”
  rationale: Ọ̀rọ̀ Gíríìkì ní agbára ìtumọ̀ yíyan tàbí fífi ẹni kan hàn gbangba. Àyíká ẹsẹ̀ 3–4 ń tọ́ka sí Jésù kan náà ṣáájú àti lẹ́yìn àjíǹde; ìtumọ̀ àkọ́kọ́ pa ẹ̀dọ̀fu ọ̀rọ̀ náà mọ́ láì fi ẹ̀kọ́ ìsìn kan kún un.
- issue: Bóyá πνεῦμα ἁγιωσύνης ń tọ́ka pàtó sí Ẹ̀mí Mímọ́
  choice: A lo “Ẹ̀mí ìjẹ́mímọ́,” tí ó fi ọ̀rọ̀ náà sílẹ̀ ní ṣíṣí díẹ̀.
  alternative: “Ẹ̀mí Mímọ́” tàbí “ẹ̀mí mímọ́ rẹ̀”
  rationale: Gbólóhùn Gíríìkì náà kò wọ́pọ̀, ó sì lè jẹ́ ìtọ́ka sí Ẹ̀mí Mímọ́ tàbí ìfiwéra pẹ̀lú “nípa ti ara” nínú ẹsẹ̀ 3. Ìtumọ̀ tààrà yẹra fún pípa ìṣòro náà mọ́lẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A pa ìṣàn gbólóhùn tó bẹ̀rẹ̀ ní ẹsẹ̀ tó ṣáájú mọ́ nípa lílo “ẹni tí a sì…”. Àmì gígùn ṣáájú “Jésù Mèsáyà Olúwa wa” ń fi àfikún ìdánimọ̀ Gíríìkì hàn kedere.
