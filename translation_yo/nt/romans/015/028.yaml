    rationale: “Kọjá” lè túmọ̀ sí ṣí Róòmù kọjá/báyìí kọjá a, nígbà tí δι’ ὑμῶν nínú àyíká yìí túmọ̀ sí pé Róòmù yóò jẹ́ ọ̀nà ìrìn-àjò rẹ̀. “Gba ọ̀dọ̀ yín lọ” àti “nípasẹ̀ Róòmù” yà ìtumọ̀ náà kúrò nínú àìdánilójú yẹn.
