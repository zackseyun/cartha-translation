  to: Nítorí náà, nígbà tí mo bá ti parí iṣẹ́ yìí, tí mo sì ti fi èdìdì fìdí èso yìí múlẹ̀ fún wọn[a], èmi yóò gba ọ̀dọ̀ yín lọ sí Sípéènì[b].
  rationale: Àtúnṣe náà tún gbolohun σφραγισάμενος ṣe sí Yorùbá tó ṣeé lò, láì pa àwòrán “ẹ̀dìdì” tàbí “èso” rẹ́. Ó tún yọ ìmọ̀ pé Pọ́ọ̀lù yóò kọjá Róòmù síwájú kúrò, nípa fífi ìtumọ̀ δι’ ὑμῶν hàn gẹ́gẹ́ bí ọ̀nà tí yóò gbà lọ.
  reviewer_model: gpt-5.6-terra
