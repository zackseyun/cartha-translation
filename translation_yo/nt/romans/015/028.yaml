id: ROM.15.28
reference: Romans 15:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: yo
  text: Nítorí náà, nígbà tí mo bá ti parí iṣẹ́ yìí, tí mo sì ti fi èdìdì fìdí èso yìí múlẹ̀ fún wọn[a], èmi yóò gba ọ̀dọ̀ yín lọ sí Sípéènì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí mo sì ti fi èso yìí lé wọn lọ́wọ́ láìléwu.” “Èso yìí” ni ọrẹ owó tí àwọn onígbàgbọ́ tí kì í ṣe Júù kó jọ fún àwọn ènìyàn mímọ́ ní Jerúsálẹ́mù.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Ní èdè míì, “nípasẹ̀ yín.” Ó ṣeé ṣe kí Pọ́ọ̀lù túmọ̀ sí pé òun yóò gba nípasẹ̀ Róòmù ní ọ̀nà òun lọ sí Sípéènì.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Nítorí náà, nígbà tí mo bá ti parí iṣẹ́ yìí
  rationale: “Nítorí náà” pa ìsopọ̀ ọgbọ́n οὖν mọ́; “iṣẹ́ yìí” mú ohun tí τοῦτο ń tọ́ka sí—iṣẹ́ gbígbé ọrẹ náà dé—yé ní Yorùbá láì ṣe àlàyé rẹ̀ ju bó ṣe yẹ lọ. Ẹ̀ka àkókò náà fi hàn pé iṣẹ́ yìí yóò parí ṣáájú ìrìn àjò.
- source_word: σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον
  choice: tí mo sì ti fi èdìdì mú èso yìí dájú fún wọn
  rationale: Ó pa àwòrán “ẹ̀dìdì” ti σφραγίζω àti àwòrán “èso” ti καρπός mọ́, ṣùgbọ́n “mú ... dájú fún wọn” jẹ́ kí ìtumọ̀ fífi ọrẹ náà lé wọn lọ́wọ́ láìléwu tàbí ìfọwọ́sí rẹ̀ ṣe kedere ní Yorùbá.
- source_word: ἀπελεύσομαι δι’ ὑμῶν
  choice: èmi yóò gba ọ̀dọ̀ yín kọjá lọ
  rationale: Ọ̀rọ̀ yìí fi ìrìn àjò tí yóò gba Róòmù kọjá hàn, ó sì pa ààyè sílẹ̀ fún ìtumọ̀ διά gẹ́gẹ́ bí “gba ọ̀dọ̀ yín kọjá,” láì sọ ìrànlọ́wọ́ wọn di ohun tí ọ̀rọ̀ náà fi dandan múlẹ̀.
- source_word: εἰς Σπανίαν
  choice: sí Sípéènì
  rationale: Ìtumọ̀ ìtọ́sọ́nà sí ibi tí Pọ́ọ̀lù ń lọ ni; “Sípéènì” ni orúkọ Yorùbá tó wọ́pọ̀ fún Spain.
theological_decisions:
- issue: Ìtumọ̀ àwòrán “fí èdìdì” nípa ọrẹ fún àwọn ènìyàn mímọ́ ní Jerúsálẹ́mù
  choice: Pa “ẹ̀dìdì” àti “èso” mọ́ nínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú “mú ... dájú fún wọn.”
  alternative: “tí mo sì ti fi ọrẹ yìí lé wọn lọ́wọ́ láìléwu”
  rationale: Àṣàyàn náà pa àwọn àwòrán Gíríìkì méjèèjì mọ́, nígbà tí Yorùbá àfikún náà ń ṣàfihàn ìṣe fífi ọrẹ náà dé ọ̀dọ̀ àwọn olùgbà tàbí fífi ìfọwọ́sí mú un dájú. Kò pinnu láìnídí láàárín àwọn ìtumọ̀ wọ̀nyí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ẹ̀dìdì” àti “èso” láti pa àwòrán Pọ́ọ̀lù mọ́, ṣùgbọ́n a fi gbólóhùn adayeba “mú ... dájú fún wọn” ṣàlàyé ìbáṣepọ̀ wọn. Gbogbo àmì àlàyé ìsàlẹ̀ ojú ewé wà nínú ọ̀rọ̀ náà.
