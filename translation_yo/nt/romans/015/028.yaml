    issue: “tí mo sì ti fi èdìdì mú èso yìí dájú fún wọn”
    rationale: Gbólóhùn náà kò ṣàn dáadáa nínú Yorùbá, ó sì ń fi “mú dájú” ṣe iṣẹ́ pàtàkì dípò ìṣe fífi èdìdì tí σφραγίζω ń ṣàpẹẹrẹ. “Fi èdìdì fìdí ... múlẹ̀” pa àwòrán náà mọ́, ó sì jẹ́ ìtumọ̀ Yorùbá tó mọ́gbọ́n dání.
  - severity: medium
