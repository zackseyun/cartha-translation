  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìbáṣepọ̀ àkókò, ìtumọ̀ “èso,” àti ibi ìrìn-àjò mọ́. Ṣùgbọ́n “fi èdìdì mú ... dájú” kò jẹ́ ọ̀nà Yorùbá tó dára láti sọ ìṣe σφραγίζω, ó sì lè mú kí “ẹ̀dìdì” dà bí ọ̀nà láti mú ohun kan dájú dípò fífi èdìdì fìdí ẹ̀tọ́/ìfìlé-lọ́wọ́ ọrẹ náà múlẹ̀. “Gba ọ̀dọ̀ yín kọjá lọ” tún lè dà bí ẹni pé Pọ́ọ̀lù ń kọjá Róòmù síwájú, dípò pé Róòmù ni ọ̀nà ìrìn-àjò rẹ̀.
  naturalness: A ṣe àtúnṣe sí “fi èdìdì fìdí ... múlẹ̀,” èyí tí ó dára síi nínú Yorùbá ìgbàlódé, tí ó sì pa àwòrán èdìdì mọ́. “Gba ọ̀dọ̀ yín lọ” jẹ́ adayeba síi fún ìtumọ̀ ìrìn-àjò “by way of you.”
  terminology: “Èso” yẹ kí ó dúró nínú ọ̀rọ̀ àkọ́kọ́ láti pa καρπός mọ́. Àlàyé ìsàlẹ̀ ojú-ewé ṣàlàyé rẹ̀ gẹ́gẹ́ bí ọrẹ owó. “Àwọn onígbàgbọ́ tí kì í ṣe Júù” ṣe kedere síi ju “onígbàgbọ́ aláìkọlà” lọ fún àwọn aláìkọlà/Gentiles nínú àlàyé.
  issues:
