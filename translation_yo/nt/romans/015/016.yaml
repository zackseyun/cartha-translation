id: ROM.15.16
reference: Romans 15:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: yo
  text: láti jẹ́ ìránṣẹ́ Mèsáyà Jésù fún àwọn tí kì í ṣe Júù[a], ní ṣíṣe iṣẹ́ àlùfáà nípa ìhìn rere Ọlọ́run[b], kí ọrẹ àwọn tí kì í ṣe Júù lè di ohun ìtẹ́wọ́gbà[c], tí a sọ di mímọ́ nínú Ẹ̀mí Mímọ́[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ṣíṣe iṣẹ́ ìsìn bí àlùfáà” tàbí “ní ṣíṣe iṣẹ́ àlùfáà.”
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe jù pé àwọn tí kì í ṣe Júù fúnra wọn ni a gbé kalẹ̀ sí Ọlọ́run gẹ́gẹ́ bí ọrẹ; ìtumọ̀ mìíràn ni, “ọrẹ tí àwọn tí kì í ṣe Júù mú wá.”
    reason: alternative_reading
  - marker: d
    text: Tàbí, “tí Ẹ̀mí Mímọ́ sọ di mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: ìránṣẹ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ń ṣe iṣẹ́ fún ẹlòmíràn tàbí iṣẹ́ mímọ́. “Ìránṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí àwòrán iṣẹ́ àlùfáà nínú gbólóhùn tó tẹ̀ lé sì ń fún ní ìtumọ̀ ẹ̀sìn rẹ̀.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός níbí ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, nítorí náà “Mèsáyà” ń fi ìtumọ̀ oyè náà hàn dípò kí a kàn lo àkọlé ìbílẹ̀ “Kristi.”
- source_word: εἰς τὰ ἔθνη
  choice: fún àwọn tí kì í ṣe Júù
  rationale: Nínú ọ̀rọ̀ Pọ́ọ̀lù ní Róòmù, ἔθνη sábà ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Ìtumọ̀ yìí ṣe kedere sí òǹkàwé Yorùbá òde òní, nígbà tí “àwọn orílẹ̀-èdè” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἱερουργοῦντα
  choice: ní ṣíṣe iṣẹ́ àlùfáà
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀rọ̀ ìjọsìn tó ń tọ́ka pàtó sí iṣẹ́ àlùfáà. Ìtumọ̀ yìí pa àwòrán ẹbọ àti iṣẹ́ àlùfáà mọ́ láì sọ pé Pọ́ọ̀lù ń ṣe ẹbọ ètùtù.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ìhìn rere Ọlọ́run
  rationale: “Ìhìn rere” jẹ́ Yorùbá àdánidá tó túmọ̀ εὐαγγέλιον ní kedere; ìsopọ̀ náà lè túmọ̀ sí ìhìn rere tó ti ọ̀dọ̀ Ọlọ́run wá tàbí tó jẹ́ ti Ọlọ́run, èyí tí àkójọpọ̀ ọ̀rọ̀ Yorùbá náà kò fi dandan pinnu sí ọ̀nà kan ṣoṣo.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: ọrẹ tí í ṣe àwọn tí kì í ṣe Júù
  rationale: Àyíká ọ̀rọ̀ iṣẹ́ àlùfáà fi hàn pé ó ṣeé ṣe jù pé àwọn tí kì í ṣe Júù fúnra wọn ni Pọ́ọ̀lù ń gbé kalẹ̀ gẹ́gẹ́ bí ọrẹ sí Ọlọ́run. Àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn tí gírámà Gíríìkì gbà láyè mọ́.
- source_word: εὐπρόσδεκτος
  choice: ìtẹ́wọ́gbà
  rationale: “Ìtẹ́wọ́gbà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a gbà pẹ̀lú ojúrere, ó sì bá àyíká ọrẹ sí Ọlọ́run mu.
- source_word: ἡγιασμένη
  choice: sọ di mímọ́
  rationale: Àpólà yìí fi ipò tó jẹ́ àbájáde iṣẹ́ sísọ ohun kan di mímọ́ hàn. “Sọ di mímọ́” ṣe kedere ju ọ̀rọ̀ àyálò lọ fún òǹkàwé gbogbo.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: tí Ẹ̀mí Mímọ́ sọ di mímọ́
  rationale: 'A ka ἐν ní ọ̀nà irinṣẹ́ tàbí aṣojú: Ẹ̀mí Mímọ́ ni ó mú ìsọdimímọ́ náà ṣẹ. Ìtumọ̀ “nínú Ẹ̀mí Mímọ́” tún ṣeé ṣe, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.'
theological_decisions:
- issue: Àpèjúwe Pọ́ọ̀lù nípa iṣẹ́ ara rẹ̀ pẹ̀lú èdè iṣẹ́ àlùfáà
  choice: A pa àwòrán iṣẹ́ àlùfáà mọ́ gẹ́gẹ́ bí àpèjúwe iṣẹ́ Pọ́ọ̀lù láàárín àwọn tí kì í ṣe Júù.
  alternative: Kí a túmọ̀ ọ́ gẹ́gẹ́ bí ipò àlùfáà lásán, tàbí kí a yọ gbogbo àwòrán iṣẹ́ àlùfáà kúrò.
  rationale: λειτουργός, ἱερουργέω àti προσφορά jọ ń dá àwòrán iṣẹ́ àlùfáà àti ọrẹ sílẹ̀. Síbẹ̀, ẹsẹ náà ń sọ̀rọ̀ nípa iṣẹ́ ìhìn rere àti fífi àwọn tí kì í ṣe Júù hàn sí Ọlọ́run, kì í ṣe ẹbọ ètùtù mìíràn.
- issue: Ohun tí “ọrẹ àwọn tí kì í ṣe Júù” ń tọ́ka sí
  choice: Àwọn tí kì í ṣe Júù fúnra wọn ni ọrẹ tí a gbé kalẹ̀ sí Ọlọ́run.
  alternative: Ọrẹ kan tí àwọn tí kì í ṣe Júù mú wá.
  rationale: Àwòrán iṣẹ́ àlùfáà àti iṣẹ́ Pọ́ọ̀lù láàárín àwọn tí kì í ṣe Júù ṣe àṣàyàn àkọ́kọ́ ní èyí tó ṣeé ṣe jù; ṣùgbọ́n gírámà Gíríìkì tún gba ìtumọ̀ kejì láyè, nítorí náà a pa á mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἐν nínú ἐν πνεύματι ἁγίῳ
  choice: Ẹ̀mí Mímọ́ ni aṣojú tàbí ọ̀nà ìsọdimímọ́ náà.
  alternative: Ọrẹ náà di mímọ́ nínú àyíká tàbí ìṣọ̀kan Ẹ̀mí Mímọ́.
  rationale: Ìtumọ̀ irinṣẹ́ bá ọ̀rọ̀ ἡγιασμένη mu dáadáa, ṣùgbọ́n a kò gbọ́dọ̀ pa ìtumọ̀ ibi tàbí àyíká tí ἐν tún lè ní rẹ́.
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. “Àwọn tí kì í ṣe Júù” yàgò fún àìmọ̀ye tàbí ìmọ̀lára òdì tí “Kèfèrí” lè dá sílẹ̀, “ọrẹ” sì pa èdè ìrúbọ mọ́ láì dámọ̀ràn pé ẹbọ ètùtù ni.
