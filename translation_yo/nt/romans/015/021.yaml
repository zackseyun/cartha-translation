  source_fidelity: 'Ìtumọ̀ náà pa ìyàtọ̀ ti ἀλλὰ, ọ̀nà ìtọ́kasí Ìwé Mímọ́, arọ́pò-orúkọ tí a kò ṣàlàyé ju, àti ìbáramu ‘rí i / lóye’ mọ́. Síbẹ̀, ‘Àwọn tí a kò sọ nípa rẹ̀ fún’ kò pé ní gírámà Yorùbá: ohun tí a sọ tàbí ‘ọ̀rọ̀’ ni a nílò kí passive ἀνηγγέλη hàn kedere.'
