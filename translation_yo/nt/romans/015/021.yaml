source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: yo
  text: 'ṣùgbọ́n gẹ́gẹ́ bí a ti kọ ọ́ pé:


    “Àwọn tí a kò sọ ọ̀rọ̀ nípa rẹ̀ fún yóò rí i,[b][a]

    àwọn tí kò tíì gbọ́ yóò lóye.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọ́ọ̀lù ń fa ọ̀rọ̀ yọ láti Aísáyà 52:15. Nínú àyíká ọ̀rọ̀ Aísáyà, arọ́pò-orúkọ “rẹ̀” ń tọ́ka sí ẹni ìránṣẹ́ náà; níbí, Pọ́ọ̀lù lo ọ̀rọ̀ yìí fún iṣẹ́ ìkéde ìhìn rere rẹ̀.
    reason: cross_reference
  - marker: b
    text: Tàbí, “Àwọn tí a kò kéde ohunkóhun nípa rẹ̀ fún ... àwọn tí kò tíì gbọ́ yóò lóye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ohun tí Pọ́ọ̀lù ń sọ níbí ṣe ìyàtọ̀ sí ohun tó sọ ṣáájú, “ṣùgbọ́n” sì jẹ́ ọ̀nà àdánidá láti fi ìyàtọ̀ náà hàn ní Yorùbá.
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bójú mu fún gbólóhùn tí a fi ń tọ́ka sí ohun tí Ìwé Mímọ́ sọ.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Àwọn tí a kò sọ nípa rẹ̀ fún
  rationale: Ìṣètò yìí mú dative relative Οἷς àti passive ἀνηγγέλη jáde ní Yorùbá tó ṣe kedere, ó sì pa περὶ αὐτοῦ mọ́ gẹ́gẹ́ bí “nípa rẹ̀” láì túmọ̀ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí.
- source_word: ὄψονται
  choice: yóò rí i
  rationale: Ó pa ìtumọ̀ taara ti ὁράω mọ́; a kò yí i sí “yóò mọ̀” tàbí “yóò fòye mọ̀,” nítorí apá kejì ti lo ọ̀rọ̀ tó túmọ̀ sí òye.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: àwọn tí wọn kò sì gbọ́
  rationale: “Kò gbọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ipò àwọn tí ìròyìn náà kò dé etí wọn; “sì” ń pa ìbáramu àwọn ìlà méjèèjì mọ́.
- source_word: συνήσουσιν
  choice: yóò lóye
  rationale: “Lóye” sọ ìtumọ̀ συνίημι ní kedere, ó sì bá ìlànà ọ̀rọ̀ àsọtẹ́lẹ̀ náà mu.
theological_decisions:
- issue: Ẹni tí arọ́pò-orúkọ αὐτοῦ (“rẹ̀”) ń tọ́ka sí nínú ọ̀rọ̀ tí Pọ́ọ̀lù fa yọ
  choice: A pa “rẹ̀” mọ́ láì fi “Kristi” tàbí “Messiah” rọ́pò rẹ̀.
  alternative: “nípa Kristi” tàbí “nípa Messiah”
  rationale: Gíríìkì lo arọ́pò-orúkọ, kò sì dárúkọ Kristi tààrà níbí. Pípa arọ́pò-orúkọ náà mọ́ ń dáàbò bo bí ọ̀rọ̀ Aísáyà ṣe rí àti bí Pọ́ọ̀lù ṣe lò ó, láì fi ìtumọ̀ àlàyé kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu fún kíkà ní gbangba ni a lò. Gbólóhùn náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé lásán, ó sì pa ìṣètò ewì àti ìbáramu àwọn ìlà méjèèjì nínú ọ̀rọ̀ Aísáyà mọ́. A fi àmì ohùn sí ibi tó yẹ ní àdánidá.
