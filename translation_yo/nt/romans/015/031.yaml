id: ROM.15.31
reference: Romans 15:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: yo
  text: kí a lè gbà mí là lọ́wọ́ àwọn aláìgbọ́ràn ní Jùdíà[a], àti kí iṣẹ́ ìránṣẹ́ mi sí Jerúsálẹ́mù lè di ohun ìtẹ́wọ́gbà lọ́dọ̀ àwọn ènìyàn mímọ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ́wọ́ àwọn aláìgbàgbọ́ ní Jùdíà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn tí wọ́n kọ̀ láti gbà gbọ́, tí wọ́n sì tipa bẹ́ẹ̀ ṣe àìgbọ́ràn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí ... àti kí
  rationale: Ó ṣe àfihàn ète àdúrà Pọ́ọ̀lù, ó sì so gbólóhùn méjì tí ó wà nínú ọ̀rọ̀ ìfẹ́ tàbí ìrètí pọ̀ lọ́nà Yorùbá àdánidá.
- source_word: ῥυσθῶ
  choice: kí a lè gbà mí là
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kí a dá a sílẹ̀ tàbí kí a yọ ọ́ kúrò nínú ewu; ìlò aláìlórúkọ ‘a’ pa ohùn àìṣe ti Gíríìkì mọ́ láìfi olùgbàlà kan tí ẹsẹ̀ náà kò dárúkọ kún un.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: lọ́wọ́ àwọn aláìgbọ́ràn
  rationale: ‘Aláìgbọ́ràn’ pa ìtumọ̀ àìgbọ́ràn mọ́, ó sì tún lè gba èrò kíkọ̀ láti gba ìhìn rere gbọ́; àṣàyàn ‘àwọn aláìgbàgbọ́’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: ní Jùdíà
  rationale: Èyí ni orúkọ ilẹ̀ náà ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: διακονία
  choice: iṣẹ́ ìránṣẹ́
  rationale: Ó pa ìtumọ̀ iṣẹ́ tí a ṣe láti ran àwọn ẹlòmíràn lọ́wọ́ mọ́, láìdín ọ̀rọ̀ náà kù sí owó ìrànlọ́wọ́ nìkan.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: mi fún Jerúsálẹ́mù
  rationale: ‘Fún’ fi hàn pé Jerúsálẹ́mù ni iṣẹ́ náà dojú kọ, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: εὐπρόσδεκτος
  choice: èyí tí ... yóò tẹ́wọ́ gbà
  rationale: Gbólóhùn yìí sọ ìtumọ̀ ohun tí a fi inú rere gbà ní Yorùbá tó ṣe kedere, dípò ọ̀rọ̀ líle tàbí èdè ilé-ẹ̀kọ́.
- source_word: τοῖς ἁγίοις
  choice: àwọn ènìyàn mímọ́
  rationale: Èyí túmọ̀ sí àwọn onígbàgbọ́ tí a yà sí mímọ́; ó jẹ́ kedere sí òǹkàwé Yorùbá òde òní láìfi ìtumọ̀ ẹ̀sìn mìíràn kún un.
- source_word: γένηται
  choice: lè di èyí tí ... yóò tẹ́wọ́ gbà
  rationale: ‘Lè di’ pa agbára ‘wá sí ipò kan’ ti γίνομαι mọ́, nígbà tí gbólóhùn tó tẹ̀ lé e fi bí a ó ṣe gba iṣẹ́ náà hàn.
theological_decisions:
- issue: Ìtumọ̀ ἀπειθούντων nípa àwọn alatako Pọ́ọ̀lù ní Jùdíà
  choice: àwọn aláìgbọ́ràn
  alternative: àwọn aláìgbàgbọ́
  rationale: Participle náà lè túmọ̀ sí kíkọ̀ láti gba ohun kan gbọ́ àti àìgbọ́ràn tó bá a rìn. Ọ̀rọ̀ inú ẹsẹ̀ yan ìtumọ̀ tó gbòòrò, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ ‘aláìgbàgbọ́’ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìṣọ̀kan gbólóhùn méjì lábẹ́ ἵνα mọ́.
