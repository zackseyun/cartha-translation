  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: yo
  text: Kí Ọlọ́run àlàáfíà wà pẹ̀lú gbogbo yín. Àmín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Kò ṣe é túmọ̀ ní ọ̀rọ̀ ọ̀tọ̀ níbí
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ tàbí àmì ìyípadà sí àdúrà ìparí, kì í ṣe ìtakora líle. Yorùbá àdánidá kò nílò “ṣùgbọ́n” tàbí “ní báyìí” níbí.
- source_word: θεὸς τῆς εἰρήνης
  choice: Ọlọ́run àlàáfíà
  rationale: Èyí pa àkọ́lé Pọ́ọ̀lù mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere. “Àlàáfíà” ní àlàáfíà, ìwàpẹ̀lẹ́, àti ire tí ìbáṣepọ̀ rere ń mú nínú.
- source_word: μετὰ πάντων ὑμῶν
  choice: wà pẹ̀lú gbogbo yín
  rationale: A fi “wà” kún un láti sọ ìbùkún tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì di Yorùbá àdánidá; “gbogbo yín” pa ìtẹnumọ́ πάντων mọ́.
- source_word: ἀμήν
  choice: Àmín
  rationale: A pa ọ̀rọ̀ ìjọsìn tí Yorùbá ti mọ̀ dáadáa mọ́ gẹ́gẹ́ bí ìparí ọlọ́wọ̀.
theological_decisions:
- issue: Bóyá gbólóhùn tí kò ní ọ̀rọ̀-ìṣe jẹ́ gbólóhùn ìròyìn tàbí ìbùkún
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí àdúrà ìbùkún: “Kí Ọlọ́run àlàáfíà wà pẹ̀lú gbogbo yín.”'
  alternative: “Ọlọ́run àlàáfíà wà pẹ̀lú gbogbo yín.”
  rationale: Nínú àwọn ìparí lẹ́tà, irú gbólóhùn yìí máa ń ṣiṣẹ́ gẹ́gẹ́ bí ìfẹ́-àdúrà tàbí ìbùkún. “Kí ... wà” fi iṣẹ́ rẹ̀ hàn ní Yorùbá láì fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ kúkúrú, ọlọ́wọ̀, ó sì bá àdúrà ìparí lẹ́tà mu. A kò fi àsopọ̀ kan sí ìbẹ̀rẹ̀ nítorí pé δέ kò béèrè fún “ṣùgbọ́n” tàbí “ní báyìí” nínú Yorùbá àdánidá.
