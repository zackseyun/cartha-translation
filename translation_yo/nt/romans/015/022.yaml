  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ gírámà Gíríìkì dáadáa: Διὸ jẹ́ ìparí èrò, καὶ ní agbára àfikún, ἐνεκοπτόμην jẹ́ ìdíwọ́ tí ó ń ṣẹlẹ̀ léraléra ní ìgbà tí ó kọjá, τὰ πολλὰ sì túmọ̀ sí ìgbà púpọ̀/léraléra. Síbẹ̀, “a máa ń dí mi lọ́wọ́” lè dún bí ìṣe àṣà lọwọlọwọ tàbí ọjọ́ iwájú ní Yorùbá; fífi àmì ìgbà tí ó kọjá hàn yóò jẹ́ kó túbọ̀ bá imperfect inú àyíká yìí mu.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá tí ó ṣeé lóye. “A máa ń dí mi lọ́wọ́” jẹ́ ọ̀nà aláìsọ ẹni tó fa ìdíwọ́, èyí tó dáa; ṣùgbọ́n “a ti ń dí mi lọ́wọ́” jẹ́ ìlò tó mọ́ ìtàn ìdíwọ́ tí Pọ́ọ̀lù ń rántí dáadáa ju bẹ́ẹ̀ lọ.
  terminology: “Nítorí náà,” “dí ... lọ́wọ́,” “ní ọ̀pọ̀ ìgbà,” àti “sọ́dọ̀ yín” jẹ́ àwọn yíyan ọ̀rọ̀ tó tọ́, tó sì bá ìforúkọsílẹ̀ ọ̀wọ̀ ti lẹ́tà náà mu. Àlàyé ẹsẹ̀ ìsàlẹ̀ yẹ kí ó ṣe ìtọ́kasí yíyan “léraléra” gẹ́gẹ́ bí ọ̀nà míì, láì tún ìtumọ̀ pàtàkì ẹsẹ̀ sọ lásán.
