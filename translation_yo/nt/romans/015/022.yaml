  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “a máa ń dí mi lọ́wọ́” láti má ṣe dá ẹni tàbí ohun tó fa ìdíwọ́ náà lórúkọ, nítorí Gíríìkì kò sọ ọ́ ní pàtó.
