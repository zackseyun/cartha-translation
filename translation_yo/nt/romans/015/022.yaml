  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: yo
  text: Nítorí náà, a sì ti ń dí mi lọ́wọ́ ní ọ̀pọ̀ ìgbà láti wá sọ́dọ̀ yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “léraléra.” Ọ̀rọ̀ Gíríìkì τὰ πολλὰ jẹ́ àṣà ọ̀rọ̀ tó ń fi ìṣẹ̀lẹ̀ tí ó tún ara rẹ̀ ṣe hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí Pọ́ọ̀lù ṣàlàyé ṣáájú.
- source_word: καὶ
  choice: sì
  rationale: Ní Yorùbá, “sì” so ipò Pọ́ọ̀lù mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá, ó sì ń gbé agbára àfikún καὶ jáde.
- source_word: ἐνεκοπτόμην
  choice: a máa ń dí mi lọ́wọ́
  rationale: Fọ́ọ̀mù imperfect náà tọ́ka sí ìdíwọ́ tó ṣẹlẹ̀ léraléra ní àkókò tó kọjá; gbolohun aláìlẹ́ni “a … dí mi lọ́wọ́” kò sọ ẹni tàbí ohun tó fa ìdíwọ́ náà ní pàtó.
- source_word: τὰ πολλὰ
  choice: ní ọ̀pọ̀ ìgbà
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí jẹ́ àṣà ọ̀rọ̀ adverbial tó túmọ̀ sí pé ohun náà ṣẹlẹ̀ léraléra tàbí ní ọ̀pọ̀ ìgbà.
- source_word: τοῦ ἐλθεῖν
  choice: láti wá
  rationale: Articular infinitive lẹ́yìn ọ̀rọ̀ ìdíwọ́ ń sọ ohun tí a dí Pọ́ọ̀lù lọ́wọ́ láti ṣe; “láti wá” jẹ́ Yorùbá tó tààrà, tó sì ṣe déédé.
- source_word: πρὸς ὑμᾶς
  choice: sọ́dọ̀ yín
  rationale: Ó ń fi ìṣípò sí ọ̀dọ̀ àwọn onígbàgbọ́ ní Róòmù hàn ní Yorùbá àdánidá.
