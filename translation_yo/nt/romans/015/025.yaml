id: ROM.15.25
reference: Romans 15:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: yo
  text: Ṣùgbọ́n ní báyìí, mo ń lọ sí Jerúsálẹ́mù, láti ṣe ìránṣẹ́ fún àwọn ènìyàn mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “láti sin àwọn ènìyàn mímọ́” tàbí “láti mú ìrànlọ́wọ́ lọ sí àwọn ènìyàn mímọ́.” Ọ̀rọ̀ Gíríìkì διακονῶν lè túmọ̀ sí iṣẹ́ ìránṣẹ́ tàbí iṣẹ́ ìrànlọ́wọ́ ní ti gidi; níhìn-ín, ó ṣeé ṣe kó ń tọ́ka sí ìkójọpọ̀ ìrànlọ́wọ́ tí Pọ́ọ̀lù ń mú lọ fún àwọn onígbàgbọ́ ní Jerúsálẹ́mù (wo Róòmù 15:26).
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n ní báyìí
  rationale: “Ní báyìí” fi ìtẹnumọ́ àkókò νυνί hàn, “ṣùgbọ́n” sì mú ìyípadà onírẹ̀lẹ̀ tí δέ ń ṣe jáde lọ́nà àdánidá ní Yorùbá.
- source_word: πορεύομαι
  choice: mo ń lọ
  rationale: Ó túmọ̀ ìrìn tàbí ète tí ó wà lọ́wọ́lọ́wọ́ sí ibi kan, láìfi ìtumọ̀ míì kún un.
- source_word: εἰς Ἰερουσαλὴμ
  choice: sí Jerúsálẹ́mù
  rationale: εἰς pẹ̀lú orúkọ ìlú tọ́ka sí ibi tí ẹni ń lọ; “sí” ni ọ̀nà Yorùbá tó bójú mu.
- source_word: διακονῶν
  choice: láti ṣe ìránṣẹ́ fún
  rationale: Ọ̀rọ̀ àbọ̀ yìí ṣàlàyé ète tàbí ipò ìrìn Pọ́ọ̀lù. “Ṣe ìránṣẹ́ fún” pa ìtumọ̀ iṣẹ́ ìrànlọ́wọ́ mọ́, kò sì sọ ọ́ di ipò iṣẹ́ ìjọ kan pàtó.
- source_word: τοῖς ἁγίοις
  choice: àwọn ènìyàn mímọ́
  rationale: Nínú lílò Pọ́ọ̀lù, gbólóhùn náà ń tọ́ka sí àwọn onígbàgbọ́ tí Ọlọ́run yà sí mímọ́. Èyí sun mọ́ ọ̀rọ̀ Gíríìkì, ó sì ṣe kedere ní Yorùbá òde òní.
theological_decisions:
- issue: Àwọn tí “τοῖς ἁγίοις” ń tọ́ka sí
  choice: A fi “àwọn ènìyàn mímọ́” sí ọ̀rọ̀ àkọ́kọ́, nígbà tí àyíká fi hàn pé àwọn onígbàgbọ́ ní Jerúsálẹ́mù ni, pàápàá àwọn aláìní láàárín wọn.
  alternative: Kí a túmọ̀ rẹ̀ tààrà sí “àwọn onígbàgbọ́ ní Jerúsálẹ́mù” tàbí “àwọn ènìyàn Ọlọ́run.”
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ “aláìní” tàbí tún “ní Jerúsálẹ́mù” nínú àpólà yìí, bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ tó tẹ̀ lé e ṣàlàyé bẹ́ẹ̀. Ìtumọ̀ náà pa ọ̀rọ̀ orísun àti àìsọ pàtó rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́wọ̀, ọ̀wọ̀, tó ṣeé lóye fún òǹkàwé òde òní. “Ṣe ìránṣẹ́ fún” jẹ́ àdánidá ju lílo ọ̀rọ̀ tó lè dábàá ipò àlùfáà tàbí iṣẹ́ ìjọ pàtó lọ.
