id: ROM.15.11
reference: Romans 15:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: yo
  text: "Ó sì tún sọ pé:\n\n“Ẹ yìn Olúwa[b], gbogbo ẹ̀yin orílẹ̀-èdè[a],\n    kí gbogbo àwọn ènìyàn sì yìn ín.”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ẹ̀yin tí kì í ṣe Júù.” Ọ̀rọ̀ Gíríìkì ἔθνη lè túmọ̀ sí “àwọn orílẹ̀-èdè” tàbí “àwọn tí kì í ṣe Júù.” Níhìn-ín, ẹsẹ tí a fa yọ kan gbogbo orílẹ̀-èdè, ó sì tún bá ọ̀rọ̀ Pọ́ọ̀lù nípa àwọn tí kì í ṣe Júù mu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ yìn OLÚWA.” Nínú orísun Hébérù tí a fa ọ̀rọ̀ yìí yọ, orúkọ Ọlọ́run ni ó wà níbẹ̀; ọ̀rọ̀ Gíríìkì κύριος (“Olúwa”) ni a fi dúró fún un.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Ó ń fi ẹsẹ Ìwé Mímọ́ mìíràn kún àwọn ẹsẹ tí Pọ́ọ̀lù ń tọ́ka sí; “tún” jẹ́ ọ̀nà àdánidá láti fi “again” hàn ní Yorùbá.
- source_word: Αἰνεῖτε
  choice: Ẹ yin
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; “Ẹ yin” ṣe àfihàn àṣẹ náà ní kedere, ó sì bá èdè Yorùbá mu.
- source_word: πάντα τὰ ἔθνη
  choice: gbogbo ẹ̀yin orílẹ̀-èdè
  rationale: “Orílẹ̀-èdè” pa ìtumọ̀ àpapọ̀ àti ti gbogbo ayé mọ́, nígbà tí “ẹ̀yin” mú kí ó ṣe kedere pé àwọn orílẹ̀-èdè náà ni a ń bá sọ. Ìtumọ̀ “àwọn tí kì í ṣe Júù” wà nínú àlàyé ìsàlẹ̀.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ fún κύριος. Bí ó tilẹ̀ jẹ́ pé ẹsẹ Májẹ̀mú Láéláé tí a fa yọ ní orúkọ Ọlọ́run nínú Hébérù, ọ̀rọ̀ Gíríìkì níbí ni κύριον.
- source_word: ἐπαινεσάτωσαν
  choice: kí ... yìn
  rationale: Ilana “kí” pẹ̀lú ọ̀rọ̀-ìṣe ṣe àfihàn àṣẹ ẹni kẹta ní Yorùbá lọ́nà àdánidá.
- source_word: αὐτὸν
  choice: ín
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí Olúwa; fọ́ọ̀mù “ín” lẹ́yìn “yìn” jẹ́ èdè Yorùbá àdánidá.
- source_word: πάντες οἱ λαοί
  choice: gbogbo àwọn ènìyàn
  rationale: Èyí yàtọ̀ sí “gbogbo ... orílẹ̀-èdè” ní ìlà àkọ́kọ́, ó sì pa ìbáradọ́gba ewì àti ìyàtọ̀ láàárín λαοί àti ἔθνη mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ κύριος nínú ẹsẹ Májẹ̀mú Láéláé tí ó ń tọ́ka sí Ọlọ́run Ísírẹ́lì
  choice: Olúwa
  alternative: OLÚWA
  rationale: A tẹ̀ lé ọ̀rọ̀ Gíríìkì κύριος nínú àyọkà Róòmù. Síbẹ̀, a fi “OLÚWA” sí àlàyé ìsàlẹ̀ láti fi hàn pé orúkọ Ọlọ́run ni ó wà nínú orísun Hébérù.
- issue: Bí a ṣe túmọ̀ ἔθνη nínú àríyànjiyàn Pọ́ọ̀lù nípa àwọn Júù àti àwọn tí kì í ṣe Júù
  choice: gbogbo ẹ̀yin orílẹ̀-èdè
  alternative: gbogbo ẹ̀yin tí kì í ṣe Júù
  rationale: Ọ̀rọ̀ inú ẹsẹ tí a fa yọ ní ìtumọ̀ tó kan gbogbo àwọn orílẹ̀-èdè. Ṣùgbọ́n nítorí ọ̀rọ̀ Pọ́ọ̀lù ní Róòmù 15 tún kan ìwọlé àwọn tí kì í ṣe Júù, a pa ìtumọ̀ kejì náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá Àjùmọ̀lò tó ní iyì, tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Ìṣètò ewì àti ìbáradọ́gba àwọn ìlà méjèèjì ni a pa mọ́, pẹ̀lú ìyàtọ̀ láàárín “orílẹ̀-èdè” àti “ènìyàn.”
