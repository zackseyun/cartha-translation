id: ROM.15.4
reference: Romans 15:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: yo
  text: Nítorí gbogbo ohun tí a ti kọ tẹ́lẹ̀ ni a kọ fún ìkọ́ni wa, kí a lè ní ìrètí[b] nípasẹ̀ ìfaradà àti nípasẹ̀ ìṣírí[a] tí Ìwé Mímọ́ ń fúnni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtùnú” tàbí “ìyànjú”; παράκλησις lè túmọ̀ sí ìṣírí, ìtùnú, tàbí ìyànjú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a ní ìrètí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: gbogbo ohun tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀ aláìlẹ́mìí yìí ní ìtumọ̀ tí ó gbòòrò; ‘gbogbo ohun tí’ jẹ́ èdè Yorùbá àdánidá tí ó mú gbogbo ohun tí a kọ tẹ́lẹ̀ mọ́ra.
- source_word: προεγράφη
  choice: a ti kọ tẹ́lẹ̀
  rationale: Ó tọ́ka sí ohun tí a kọ ní àkókò ìṣáájú, kì í ṣe ohun tí a fi sí gbangba. ‘Tẹ́lẹ̀’ pa ìtumọ̀ προ- mọ́.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: fún ìkọ́ni wa
  rationale: εἰς pẹ̀lú ọ̀rọ̀ ní accusative fi ète tàbí àbájáde hàn; ‘ìkọ́ni’ sọ iṣẹ́ ìtọ́nisọ́nà àti ìmúgbèrú tí Ìwé Mímọ́ ń ṣe.
- source_word: ἐγράφη
  choice: ni a kọ
  rationale: A tún ọ̀rọ̀ ‘kọ’ ṣe gẹ́gẹ́ bí Gíríìkì ṣe tún γράφω ṣe, láti pa ìtẹnumọ́ ọ̀rọ̀ náà mọ́.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète hàn ní Yorùbá àdánidá, ó sì bá subjunctive ἔχωμεν mu.
- source_word: διὰ τῆς ὑπομονῆς
  choice: nípasẹ̀ ìfaradà
  rationale: ὑπομονή túmọ̀ sí fífarada tàbí dídúró ṣinṣin lábẹ́ ìṣòro; ‘ìfaradà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: nípasẹ̀ ìṣírí tí Ìwé Mímọ́ ń fúnni
  rationale: παράκλησις lè jẹ́ ìṣírí, ìtùnú, tàbí ìyànjú. Nínú ọ̀rọ̀ nípa ìrètí, ‘ìṣírí’ ní ìbòòrò tó yẹ; gbólóhùn ìbátan náà sọ genitive náà ní Yorùbá tó ṣàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τῶν γραφῶν
  choice: Ìwé Mímọ́
  rationale: Nínú lílo Paulu, γραφαί sábà máa ń tọ́ka sí àkójọpọ̀ àwọn ìwé mímọ́; Yorùbá sábà ń lo ‘Ìwé Mímọ́’ gẹ́gẹ́ bí orúkọ àkójọpọ̀.
- source_word: τὴν ἐλπίδα
  choice: ìrètí
  rationale: Orúkọ àfojúrí Yorùbá kò nílò ohun tó bá article Gíríìkì mu níbí; ‘ìrètí’ pa ìtumọ̀ náà mọ́ lọ́nà àdánidá.
- source_word: ἔχωμεν
  choice: a lè ní
  rationale: Present subjunctive lẹ́yìn ἵνα ń sọ ète; ‘kí a lè ní’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ète yìí hàn láìfi àìdánilójú tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Iṣẹ́ tí Ìwé Mímọ́ ń ṣe nínú mímú ìrètí wá
  choice: A so ‘tí Ìwé Mímọ́ ń fúnni’ mọ́ ‘ìṣírí,’ gẹ́gẹ́ bí ìtòlẹ́sẹẹsẹ Gíríìkì, nígbà tí a kò pinnu bóyá ‘ìfaradà’ náà wá láti inú Ìwé Mímọ́ ní tààràtà.
  alternative: A lè túmọ̀ ọ́ pé ‘nípasẹ̀ ìfaradà àti ìṣírí láti inú Ìwé Mímọ́,’ èyí tí ó lè mú kí àwọn méjèèjì dà bí ohun tí Ìwé Mímọ́ ń pèsè.
  rationale: Genitive τῶν γραφῶν sún mọ́ παρακλήσεως jù lọ. Ìtumọ̀ náà pa ìbátan yìí mọ́, ṣùgbọ́n kò dí òye tó gbòòrò pé Ìwé Mímọ́ ń mú ìfaradà àti ìrètí dàgbà.
- issue: Iye ìtumọ̀ παράκλησις
  choice: ìṣírí
  alternative: ìtùnú tàbí ìyànjú
  rationale: ‘Ìṣírí’ bá àyíká ọ̀rọ̀ nípa fífaradà àti níní ìrètí mu, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn tí Gíríìkì gbà láàyè mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn ní kíkún. A tún ‘kọ’ ṣe láti pa ìtẹnumọ́ Gíríìkì mọ́. ‘Ìwé Mímọ́’ jẹ́ ẹyọ gẹ́gẹ́ bí orúkọ àkójọpọ̀ àwọn Ìwé Mímọ́. Gbogbo àmì àkọsílẹ̀ ìsàlẹ̀ [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
