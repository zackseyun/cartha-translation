  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: yo
  text: 'Lẹ́ẹ̀kan sí i, Aísáyà sọ pé, “Gbòǹgbò Jésè yóò wà,

    áti ẹni tí yóò dìde láti ṣàkóso àwọn orílẹ̀-èdè;

    áwọn orílẹ̀-èdè yóò ní ìrètí nínú rẹ̀.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: Gbòǹgbò Jésè
  rationale: Ó pa àwòrán ‘gbòǹgbò’ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí ẹni tí ó ti inú ìdílé Jésè jáde.
- source_word: ὁ ἀνιστάμενος
  choice: ẹni tí ó dìde
  rationale: Ìtumọ̀ yìí pa ìṣípòpadà ọ̀rọ̀ náà mọ́ láì fi dandan túmọ̀ rẹ̀ sí àjíǹde kúrò nínú òkú ní ibi yìí.
- source_word: ἐθνῶν / ἔθνη
  choice: àwọn orílẹ̀-èdè
  rationale: Ó ṣe àfihàn àwọn ènìyàn tàbí àwọn orílẹ̀-èdè tí kì í ṣe Ísírẹ́lì, láì lo ọ̀rọ̀ tí ó lè dà bí ẹ̀gàn ní Yorùbá òde òní.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: òun ni ... yóò gbẹ́kẹ̀ lé
  rationale: ‘Gbẹ́kẹ̀ lé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìrètí tí a fi lé ẹni kan lórí.
- source_word: ἄρχειν
  choice: láti ṣàkóso
  rationale: Ó sọ ète dídìde ẹni náà ní kedere, ìyẹn láti jẹ olórí tàbí alákòóso àwọn orílẹ̀-èdè.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ‘Gbòǹgbò Jésè’ àti ‘ẹni tí ó dìde’
  choice: A pa ‘àti’ mọ́ gẹ́gẹ́ bí ó ti wà nínú Gíríìkì.
  alternative: Ṣí i sí ‘ìyẹn ẹni tí ó dìde’ tàbí ‘àní ẹni tí ó dìde.’
  rationale: Ọ̀rọ̀ Gíríìkì lo καὶ, nítorí náà a kò sọ ìbáṣepọ̀ náà di àlàyé ju bí orísun ṣe sọ lọ.
- issue: Ìtumọ̀ ἀνιστάμενος
  choice: ‘ẹni tí ó dìde’
  alternative: ‘ẹni tí ó jí dìde’ tàbí ‘ẹni tí yóò farahàn.’
  rationale: Yíyan ‘dìde’ pa ìtumọ̀ gbígbòòrò àti àìdánilójú rẹ̀ mọ́, kò sì fi ẹ̀kọ́ àjíǹde sínú gbolohun ní dandan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘orílẹ̀-èdè’ dípò ọ̀rọ̀ ẹ̀sìn àtijọ́ fún ‘Gentiles’ kí ìtumọ̀ má bàa di ti ẹ̀ya tàbí ti ẹ̀gàn.
