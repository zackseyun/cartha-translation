  to: 'Lẹ́ẹ̀kan sí i, Aísáyà sọ pé, “Gbòǹgbò Jésè yóò wà,

    áti ẹni tí yóò dìde láti ṣàkóso àwọn orílẹ̀-èdè;

    áwọn orílẹ̀-èdè yóò ní ìrètí nínú rẹ̀.”'
  rationale: Àtúnṣe náà mú πάλιν, ìṣàkóso ọjọ́ iwájú nínú àsọtẹ́lẹ̀ náà, àti ìtumọ̀ ‘nínú ẹni náà ni wọn yóò ní ìrètí’ hàn kedere. Ó pa ìbáṣepọ̀ tí καὶ fi sílẹ̀ láàárín ‘Gbòǹgbò Jésè’ àti ‘ẹni tí yóò dìde’ mọ́, láì sọ ẹni méjì ni wọ́n jẹ́ tàbí láì fi ìtumọ̀ àjíǹde pàtó kún un.
