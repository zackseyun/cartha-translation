  source_fidelity: 'Ìtumọ̀ náà mú àwọn ìpín pàtàkì ti Gíríìkì náà wá: Aísáyà, gbòǹgbò Jésè, ẹni tí ó dìde láti ṣàkóso àwọn orílẹ̀-èdè, àti ìrètí àwọn orílẹ̀-èdè nínú ẹni náà. Ṣùgbọ́n ‘Àti pé’ kì í ṣe ìbẹ̀rẹ̀ àdánidá fún καὶ πάλιν, àti ‘ó dìde’ lè dà bí ohun tí ó ti ṣẹlẹ̀, níbi tí ìṣe ọjọ́ iwájú ti ọ̀rọ̀ yíyọ sílẹ̀ náà yẹ kí ó hàn dáadáa. ‘Ní ìrètí nínú rẹ̀’ tú ἐπ’ αὐτῷ ... ἐλπιοῦσιν sílẹ̀ ní kedere ju ‘òun ni ... gbẹ́kẹ̀ lé’ lọ.'
