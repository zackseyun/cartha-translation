  naturalness: “Àwọn Kèfèrí” jẹ́ ọ̀rọ̀ Bíbélì ìbílẹ̀, ṣùgbọ́n ó lè ní ìró ìsọ̀rọ̀ ẹni tàbí ìtumọ̀ ẹlẹ́sìn tó le ní Yorùbá òde òní. “Àwọn tí kì í ṣe Júù” jẹ́ kedere fún ìlò Pọ́ọ̀lù; “àwọn orílẹ̀-èdè” sì bá àyọlò náà mu ní ti ẹ̀dá rẹ̀. “Kọ orin ìyìn sí orúkọ rẹ̀” tún rọrùn, ó sì jẹ́ Yorùbá àdánidá.
  terminology: A pa “àánú rẹ̀,” “yin Ọlọ́run lógo,” àti “gẹ́gẹ́ bí a ti kọ ọ́ sílẹ̀” mọ́. A yí ọ̀rọ̀ fún ἔθνη padà láti yẹra fún ìtumọ̀ ẹlẹ́sìn tó lè jẹ́ ẹlẹ́gàn, láì sọ ìyàtọ̀ Júù/aláì-Júù tàbí ìtumọ̀ “nations” nù.
