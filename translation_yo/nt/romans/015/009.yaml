id: ROM.15.9
reference: Romans 15:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: yo
  text: 'àti kí àwọn tí kì í ṣe Júù lè yin Ọlọ́run lógo nítorí àánú rẹ̀,[a] gẹ́gẹ́ bí a ti kọ ọ́ sílẹ̀ pé,


    “Nítorí náà, èmi yóò yìn ọ́ láàárín àwọn orílẹ̀-èdè,

    ẹ̀mí yóò sì kọ orin ìyìn sí orúkọ rẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ἔθνη/ἔθνεσι ní àwọn ibi méjèèjì pé “àwọn orílẹ̀-èdè.” Nínú àríyànjiyàn Pọ́ọ̀lù, ọ̀rọ̀ náà ń tọ́ka ní pàtó sí àwọn tí kì í ṣe Júù; ṣùgbọ́n nínú àyọlò ìpilẹ̀ṣẹ̀ náà, ó tún ní ìtumọ̀ gbòòrò náà, “àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú Róòmù, ọ̀rọ̀ náà sábà máa ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù, ní ìyàtọ̀ sí àwọn Júù; “àwọn Kèfèrí” mú ìtumọ̀ yìí jáde ní kedere.
- source_word: ὑπὲρ ἐλέους
  choice: nítorí àánú rẹ̀
  rationale: ὑπέρ pẹ̀lú ọ̀rọ̀ inú genitive ń fi ìdí tàbí ohun tí ó fa ìṣe hàn níbí. “rẹ̀” mú un ṣe kedere pé àánú Ọlọ́run ni, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: δοξάσαι
  choice: kí ... lè yin Ọlọ́run lógo
  rationale: Infinitive náà sinmi lé gbólóhùn ẹsẹ tó ṣáájú, ó sì ń sọ ète tàbí àbájáde. Ìṣètò “kí ... lè” jẹ́ Yorùbá àdánidá fún ìbáṣepọ̀ yìí.
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu fún gbólóhùn ìtọ́kasí sí Ìwé Mímọ́.
- source_word: ἐξομολογήσομαί
  choice: èmi yóò yìn ọ́
  rationale: Nínú àyíká orin ìjọsìn yìí, ọ̀rọ̀ náà túmọ̀ sí ìyìn tàbí ọpẹ́ ní gbangba, kì í ṣe jíjẹ́wọ́ ẹ̀ṣẹ̀.
- source_word: ἐν ἔθνεσι
  choice: láàárín àwọn Kèfèrí
  rationale: ἐν pẹ̀lú dative jẹ́ ti ibi níbí, ìyẹn “láàárín.” “Àwọn Kèfèrí” bá bí Pọ́ọ̀lù ṣe lo àyọlò náà láti fi ṣàlàyé ìkópa àwọn tí kì í ṣe Júù mu.
- source_word: ψαλῶ
  choice: èmi yóò sì fi orin yin
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí kíkọ orin ìyìn. Ìtumọ̀ yìí jẹ́ Yorùbá òde òní tó ṣe kedere láì fi hàn pé Sáàmù kánkán nìkan ni a ń kọ.
- source_word: τῷ ὀνόματί σου
  choice: orúkọ rẹ
  rationale: Èyí pa àwòrán Bíbélì ti fífi orin yin orúkọ Ọlọ́run mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Ohun tí gbólóhùn infinitive ìbẹ̀rẹ̀ ń tọ́ka sí àti ipa rẹ̀
  choice: 'A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìtẹ̀síwájú èrò Pọ́ọ̀lù láti ẹsẹ 8: iṣẹ́ Kristi yọrí sí pé àwọn Kèfèrí yin Ọlọ́run lógo nítorí àánú rẹ̀.'
  alternative: Ìtumọ̀ líle bíi “àti àwọn Kèfèrí láti yin Ọlọ́run lógo nítorí àánú.”
  rationale: 'Gíríìkì ẹsẹ yìí sinmi lé gbólóhùn ẹsẹ 8. “Kí ... lè” mú ìbáṣepọ̀ ète tàbí àbájáde náà yé ni Yorùbá láì fi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un. Àánú náà pa ìyàtọ̀ tí Pọ́ọ̀lù ṣe mọ́: a mú àwọn ìlérí fún Ísírẹ́lì ṣẹ, àwọn Kèfèrí sì ń yin Ọlọ́run nítorí àánú.'
translation_notes:
  register: A lo Yorùbá àgbà tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó yẹ. “Kèfèrí” ni ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún àwọn tí kì í ṣe Júù; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gbòòrò “àwọn orílẹ̀-èdè” mọ́. A tún gbé àyọlò náà kalẹ̀ bí ewì láti fi ìbáradọ́gba àwọn ìlà rẹ̀ hàn.
