  source_fidelity: 'Ìtumọ̀ náà fi gbogbo àwọn èrò pàtàkì nínú Gíríìkì hàn dáadáa: καὶ πάλιν λέγει jẹ́ “Ó sì tún sọ pé”; àṣẹ ọ̀pọ̀ Εὐφράνθητε jẹ́ “Ẹ yọ̀”; ἔθνη, ní àyíká Pọ́ọ̀lù, jẹ́ “ẹ̀yin tí kì í ṣe Júù”; μετὰ τοῦ λαοῦ αὐτοῦ sì jẹ́ “pẹ̀lú àwọn ènìyàn rẹ̀.” Kò fi Ísírẹ́lì tàbí ìtumọ̀ ẹ̀kọ́ ìjọ kún ọ̀rọ̀ Gíríìkì.'
  naturalness: Yorùbá náà jẹ́ boṣewa, ó ní àmì ohùn tó yẹ, ó sì ní ìró ìyì tó bá àyọlò Ìwé Mímọ́ mu. “Ẹ̀yin tí kì í ṣe Júù” gun díẹ̀ ju ọ̀rọ̀ kan lọ, ṣùgbọ́n ó ṣe kedere, ó sì yẹra fún “Kèfèrí,” tí ó lè ru ìtumọ̀ tàbí ìró tí kò bójú mu ní lílo òde òní.
  terminology: Yíyan “ẹ̀yin tí kì í ṣe Júù” tọ́ka dáadáa sí ìyàtọ̀ Júù àti àwọn aláì-Júù nínú Róòmù 15. Àlàyé ìsàlẹ̀ “ẹ̀yin orílẹ̀-èdè” pa ìtumọ̀ gbooro ti ἔθνη mọ́, ó sì so mọ́ ibi tí ọ̀rọ̀ yẹn wà nínú ẹsẹ náà. “Àwọn ènìyàn rẹ̀” jẹ́ ìtumọ̀ tó pé fún λαοῦ αὐτοῦ, ó sì dá ìtọ́kasí ẹni tí “rẹ̀” jẹ́ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ orísun ṣe rí.
