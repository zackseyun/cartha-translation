id: ROM.15.10
reference: Romans 15:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: yo
  text: Ó sì tún sọ pé, “Ẹ yọ̀, ẹ̀yin tí kì í ṣe Júù[a], pẹ̀lú àwọn ènìyàn rẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin orílẹ̀-èdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tún
  rationale: Nínú ọ̀nà tí a fi ń bẹ̀rẹ̀ àyọlò Ìwé Mímọ́, “tún” sọ ìtumọ̀ ‘again’ ní Yorùbá àdánidá.
- source_word: λέγει
  choice: sọ
  rationale: A pa àkókò ìsinsìnyí ti ọ̀rọ̀ Gíríìkì mọ́ nínú gbólóhùn “Ó sì tún sọ pé,” bí Ìwé Mímọ́ ṣe ń bá a lọ láti sọ̀rọ̀. Arọ́pò-orúkọ “Ó” jẹ́ kí kókó-ọ̀rọ̀ tí a kò dárúkọ ní Gíríìkì hàn ní Yorùbá.
- source_word: Εὐφράνθητε
  choice: Ẹ yọ̀
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn ni ọ̀rọ̀ náà; “Ẹ yọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní iyì.
- source_word: ἔθνη
  choice: ẹ̀yin tí kì í ṣe Júù
  rationale: Ní àyíká Róòmù 15, ọ̀rọ̀ náà tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Ìtumọ̀ yìí mú ìyàtọ̀ Júù àti aláì-Júù hàn láìlo “Kèfèrí,” èyí tó lè ní ìró ẹ̀gàn tàbí ìtumọ̀ ẹ̀sìn míì ní Yorùbá òde òní. A fi “àwọn orílẹ̀-èdè” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn tó ṣeé ṣe.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: pẹ̀lú àwọn ènìyàn rẹ̀
  rationale: “Pẹ̀lú” fi ìbákẹ́gbẹ́ tí μετά pẹ̀lú ọ̀rọ̀ olùní hàn; “àwọn ènìyàn rẹ̀” pa ìmọ̀lára àwọn ènìyàn tí í ṣe tirẹ̀ mọ́ láìfi “Ísírẹ́lì” kún ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη nínú àyọlò Pọ́ọ̀lù nípa ìṣọ̀kan Júù àti àwọn tí kì í ṣe Júù
  choice: ẹ̀yin tí kì í ṣe Júù
  alternative: ẹ̀yin orílẹ̀-èdè
  rationale: Àyíká Róòmù 15 tẹnumọ́ pé àwọn tí kì í ṣe Júù darapọ̀ mọ́ àwọn ènìyàn Ọlọ́run láti yin Ọlọ́run. Ìtumọ̀ àkọ́kọ́ mú èrò Pọ́ọ̀lù hàn gbangba, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbòòrò ‘àwọn orílẹ̀-èdè’ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì; a yàgò fún “Kèfèrí” nítorí ìró ẹ̀gàn tàbí ìtumọ̀ ẹ̀sìn míì tí ó lè ní fún àwọn òǹkàwé òde òní.
