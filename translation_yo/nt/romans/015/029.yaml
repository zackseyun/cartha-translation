id: ROM.15.29
reference: Romans 15:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: yo
  text: Mo sì mọ̀ pé nígbà tí mo bá dé ọ̀dọ̀ yín, mo yóò dé pẹ̀lú ẹ̀kúnrẹ́rẹ́ ìbùkún Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìbùkún Kristi.”
    reason: 'Àṣàyàn ìtumọ̀ oyè Χριστός: “Mèsáyà” ń ṣàlàyé oyè náà, nígbà tí “Kristi” jẹ́ fọ́ọ̀mù tí a ti ń lò lọ́pọ̀lọpọ̀ ní Yorùbá.'
lexical_decisions:
- source_word: οἶδα
  choice: Mo mọ̀
  rationale: Ó fi ìmọ̀ àti ìdánilójú Pọ́ọ̀lù hàn ní tààrà, láì sọ ọ́ di èrò lásán.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ ọ̀rọ̀ náà síwájú; “sì” jẹ́ ọ̀nà àdánidá láti fi èyí hàn ní Yorùbá.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: nígbà tí mo bá dé ọ̀dọ̀ yín
  rationale: Àpólà aláìlópin náà ní ìtumọ̀ àkókò ní ìbámu pẹ̀lú ọ̀rọ̀-ìṣe ọjọ́ iwájú; gbolohun yìí jẹ́ Yorùbá àdánidá tí ó pa ìbáṣepọ̀ àkókò náà mọ́.
- source_word: ἐλεύσομαι
  choice: èmi yóò dé
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà sọ ìbẹ̀wò Pọ́ọ̀lù ní tààrà. Fífi “èmi” hàn mú ìtẹnumọ́ díẹ̀ wá, bí gbolohun Gíríìkì ṣe tún èrò wíwá náà sọ.
- source_word: ἐν πληρώματι
  choice: pẹ̀lú ẹ̀kúnrẹ́rẹ́
  rationale: ἐν pẹ̀lú dátífù lè fi ipò tàbí ohun tí ó bá ìṣe náà rìn hàn. “Pẹ̀lú ẹ̀kúnrẹ́rẹ́” jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ọ̀pọ̀lọpọ̀ àti pípé inú πλήρωμα mọ́.
- source_word: εὐλογίας
  choice: ìbùkún
  rationale: Ó túmọ̀ sí ìbùkún tí ẹ̀kúnrẹ́rẹ́ náà ní tàbí tí ó fi ara hàn; “ìbùkún” ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín. “Mèsáyà” pa ìtumọ̀ oyè ẹni àmì òróró náà mọ́ dípò kí a lò ó bí orúkọ ìdílé.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, Χριστός jẹ́ oyè Kristọ́lọ́jì. “Mèsáyà” mú ìtumọ̀ oyè náà jáde; àkọsílẹ̀ ìsàlẹ̀ sì fún òǹkàwé ní àṣàyàn “Kristi” tí ó wọ́pọ̀ nínú ìlò ìjọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo “dé ọ̀dọ̀ yín” dípò àtúnsọ “wá sọ́dọ̀ yín” láti jẹ́ kí gbolohun náà ṣàn dáadáa, ṣùgbọ́n a pa àtúnsọ ìṣe wíwá inú Gíríìkì mọ́ ní “nígbà tí mo bá dé … èmi yóò dé.”
