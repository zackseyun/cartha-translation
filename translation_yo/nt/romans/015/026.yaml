source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: yo
  text: Nítorí Makedóníà àti Akaíà ní inú-dídùn láti ṣe ìkópa kan fún àwọn tálákà nínú àwọn ẹni mímọ́ tí wọ́n wà ní Jerusalẹmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ṣe ìpínpín kan”; gbólóhùn Gíríìkì náà tẹnumọ́ ìbáṣepọ̀ tí a fi hàn nípa ìrànlọ́wọ́ ohun ìní.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: fi tayọ̀tayọ̀ pinnu
  rationale: Èyí mú ìfẹ́ inú rere àti ìpinnu àtinúwá tí εὐδοκέω ní jáde; kì í ṣe ìpinnu lásán.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ tó ṣáájú.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: Makedóníà àti Akaíà
  rationale: A pa orúkọ àwọn agbègbè náà mọ́ gẹ́gẹ́ bí Gíríìkì, níbi tí wọ́n ti dúró fún àwọn ìjọ Kristẹni wọn, láì fi ‘àwọn ìjọ’ tàbí ‘àwọn onígbàgbọ́’ kún un.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: láti ṣe àfikún ọrẹ kan
  rationale: Ní àyíká gbígba ọrẹ yìí, gbólóhùn náà túmọ̀ sí fífi ohun ìní ṣètìlẹ́yìn, ṣùgbọ́n κοινωνία tún ní ìtumọ̀ ìpínpín àti ìdàpọ̀. ‘Kan’ ń fi àìdánimọ̀ τινά hàn.
- source_word: εἰς τοὺς πτωχοὺς
  choice: fún àwọn tálákà
  rationale: εἰς ń tọ́ka sí àwọn tí àfikún náà yóò ṣe anfàní fún.
- source_word: τῶν ἁγίων
  choice: láàárín àwọn ẹni mímọ́
  rationale: Ọ̀rọ̀ náà fi hàn pé àwọn tálákà náà jẹ́ apá kan lára ẹgbẹ́ àwọn ẹni mímọ́; ó tún pa ọ̀rọ̀ Pọ́ọ̀lù fún àwọn onígbàgbọ́ mọ́.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: tí ó wà ní Jerusalẹmu
  rationale: Gbólóhùn yìí ń ṣàlàyé àwọn ẹni mímọ́, ó sì pa ìbáṣepọ̀ gírámà Gíríìkì mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἅγιοι nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: àwọn ẹni mímọ́
  alternative: àwọn ènìyàn Ọlọ́run
  rationale: ‘Àwọn ẹni mímọ́’ pa ìtumọ̀ pàtàkì ọ̀rọ̀ Pọ́ọ̀lù fún gbogbo àwọn onígbàgbọ́ mọ́, láì sọ ọ́ di àkọlé fún àwọn ènìyàn pàtàkì kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tó lọ́lá, tó ṣe kedere fún gbogbo ènìyàn. A lo ‘fi tayọ̀tayọ̀ pinnu’ láti darapọ̀ ìdùnnú àti ìfẹ́ àtinúwá; a sì pa orúkọ agbègbè náà mọ́ gẹ́gẹ́ bí ẹni pé wọ́n ni wọ́n ṣe ìṣe náà, bí ó ti rí nínú Gíríìkì.
