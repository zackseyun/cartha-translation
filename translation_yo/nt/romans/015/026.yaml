review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn orúkọ agbègbè, ìtumọ̀ ìrànlọ́wọ́ fún àwọn tálákà, àti ìdánimọ̀ àwọn ẹni mímọ́ ní Jerusalẹmu mọ́. Ṣùgbọ́n “fi tayọ̀tayọ̀ pinnu” kò túmọ̀ εὐδόκησαν dáadáa: ó túmọ̀ sí pípa ìpinnu ní ọ̀nà tí ó tayọ̀, kì í ṣe ìfẹ́ inú rere/tí inú dùn láti ṣe ohun kan.'
  naturalness: “Ní inú-dídùn” jẹ́ ìsọ̀rọ̀ Yorùbá ìgbàlódé tó dára fún ìfẹ́ rere tí εὐδοκέω ń sọ. “Ṣe ìkópa kan” jẹ́ ọ̀nà tó kedere láti sọ ìdásílẹ̀ tàbí àfikún ohun ìní, láì sọ iye rẹ̀ di pàtó.
  terminology: “Àwọn ẹni mímọ́” yẹ fún ἅγιοι nínú ìlò Pọ́ọ̀lù. A tún ṣe àtúnṣe àlàyé ìsàlẹ̀ kí “ìdàpọ̀” (eyiti kò bá κοινωνία mu níbí) má bà a jẹ; “ìbáṣepọ̀” àti ìpínpín ohun ìní dá ìtumọ̀ ọ̀rọ̀ náà mú dáadáa.
