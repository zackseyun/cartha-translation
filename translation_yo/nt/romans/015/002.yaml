  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: yo
  text: Kí olúkúlùkù wa máa wu aládùúgbò rẹ̀ fún ire rẹ̀[a], láti mú un lágbára[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ohun rere” tàbí “sí ohun tí ó dára.” Gbólóhùn Gíríìkì náà tẹnu mọ́ ohun tí ó ṣe àǹfààní, kì í ṣe ohun tí ó kan tẹ́ ẹnì kan lọ́rùn lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún ìmúni lágbára.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí “ìkọ́lé,” ṣùgbọ́n a lò ó gẹ́gẹ́ bí àkàwé fún fífún ẹnì kan ní okun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: olúkúlùkù wa
  rationale: Ó fi ìpínkiri ẹnì kọ̀ọ̀kan nínú gbogbo wa hàn ní Yorùbá àdánidá.
- source_word: τῷ πλησίον
  choice: aládùúgbò rẹ̀
  rationale: Ó túmọ̀ sí ẹni ẹlẹgbẹ́ tàbí aládùúgbò ẹni ní ti ìwà; ọ̀rọ̀ yìí bá ẹyọ ọ̀rọ̀ Gíríìkì mu.
- source_word: ἀρεσκέτω
  choice: kí ... máa ṣe ohun tí ó wu
  rationale: Ìṣísẹ̀ yìí pa agbára àṣẹ ìgbaniníyànjú mọ́, kò sì túmọ̀ ọ́ sí fífi ojú ẹni hàn lásán.
- source_word: εἰς τὸ ἀγαθὸν
  choice: fún ire rẹ̀
  rationale: Ó mú ète àti àǹfààní fún aládùúgbò hàn, kì í ṣe ṣíṣe gbogbo ohun tí ó bá fẹ́ lásán.
- source_word: πρὸς οἰκοδομήν
  choice: láti gbé e ró
  rationale: Ó sọ àkàwé ìkọ́lé di Yorùbá àdánidá fún fífún ẹlòmíràn ní okun àti ìdàgbàsókè.
theological_decisions:
- issue: Ààlà ìtúmọ̀ ṣíṣe ohun tí ó wu aládùúgbò
  choice: Àṣẹ náà dá lórí ohun tí yóò ṣe aládùúgbò ní ire tí yóò sì gbé e ró.
  alternative: Kí a máa tẹ́wọ́ gba gbogbo ohun tí àwọn ẹlòmíràn fẹ́ láìsí ààlà.
  rationale: Àwọn gbólóhùn ète méjèèjì, εἰς τὸ ἀγαθὸν àti πρὸς οἰκοδομήν, fi ààlà sí ἀρεσκέτω; nítorí náà, ẹsẹ náà kò kọ́ ìwà fífi ojú ẹni hàn láìní ààlà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Gbé e ró” pa àkàwé ìkọ́lé mọ́ ní ọ̀nà Yorùbá tó wọ́pọ̀.
