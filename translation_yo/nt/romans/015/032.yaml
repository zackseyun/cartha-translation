  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: yo
  text: kí n lè fi ayọ̀ wá sọ́dọ̀ yín nípasẹ̀ ìfẹ́ Ọlọ́run, kí n sì bá yín jọ gba ìtura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “kí n lè bá yín jọ ní ìtura,” tàbí “kí n lè bá yín jọ sinmi.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìtura tàbí ìsinmi tí wọ́n jọ ń ní.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí èmi lè
  rationale: Ó mú ète tí gbólóhùn inú ẹsẹ tó ṣáájú yìí ń tọ́ka sí jáde ní Yorùbá àdánidá.
- source_word: ἐν χαρᾷ
  choice: fi ayọ̀
  rationale: Ó fi ayọ̀ hàn gẹ́gẹ́ bí ipò tàbí ọ̀nà tí Pọ́ọ̀lù yóò gbà dé, ó sì pa orúkọ náà mọ́.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: tọ̀ yín wá
  rationale: Ìtumọ̀ àdánidá ní Yorùbá fún wíwá sí ọ̀dọ̀ àwọn olùgbà lẹ́tà; a so participle náà mọ́ ète ọ̀rọ̀ náà.
- source_word: διὰ θελήματος θεοῦ
  choice: nípa ìfẹ́ Ọlọ́run
  rationale: διά pẹ̀lú genitive níbí tọ́ka sí pé dídé náà sinmi lórí ìfẹ́ Ọlọ́run tàbí pé ó wá nípasẹ̀ rẹ̀, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: συναναπαύσωμαι
  choice: kí n sì bá yín jọ rí ìtura
  rationale: Ó pa èrò συν- mọ́ pé ìsinmi tàbí ìtura náà jẹ́ ohun tí Pọ́ọ̀lù àti àwọn onígbàgbọ́ Róòmù yóò jọ ní.
theological_decisions:
- issue: Ìbáṣepọ̀ alájọpín nínú ìtura tí Pọ́ọ̀lù retí láàárín àwọn onígbàgbọ́ Róòmù
  choice: bá yín jọ rí ìtura
  alternative: rí ìtura lọ́dọ̀ yín
  rationale: Àṣàyàn náà dá ìtumọ̀ alájọpín inú συναναπαύσωμαι sí, kó má dà bí ẹni pé Pọ́ọ̀lù nìkan ni yóò gba ìtura lọ́wọ́ wọn.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Tọ̀ yín wá” àti “bá yín jọ rí ìtura” jẹ́ ọ̀rọ̀ àdánidá tí òǹkàwé gbogbogbò lè lóye.
