  source_fidelity: Ìtumọ̀ náà ń fi ète ἵνα, ayọ̀ nínú ἐν χαρᾷ, ìwá sí ọ̀dọ̀ àwọn ará Róòmù, àti ìtura alájọpín inú συναναπαύσωμαι hàn dáadáa. Síbẹ̀, gbolohun àlàyé àkọsílẹ̀ lọwọlọwọ náà mú kí ìtumọ̀ náà dà bí pé Pọ́ọ̀lù àti àwọn olùgbà lẹ́tà yóò ‘fún ara wọn ní ìtura,’ èyí tí ó kọjá ohun tí ọ̀rọ̀ Gíríìkì sọ. Àtúnṣe náà pa ìtumọ̀ ìsinmi/ìtura tí wọ́n jọ ní mọ́ láìfi ìṣe fífún ara ẹni kún un.
  naturalness: “Tọ̀ yín wá” àti “bá yín jọ rí ìtura” jẹ́ Yorùbá tí ó ye ẹni, ṣùgbọ́n “wá sọ́dọ̀ yín” jẹ́ ọ̀nà tí ó hàn gbangba díẹ̀ fún πρὸς ὑμᾶς nínú àyíká lẹ́tà. “Gba ìtura” sì jẹ́ ìsọ̀rọ̀ àdánidá fún ìrírí ìtura tí ó lè jẹ́ ti ìjọpọ̀.
