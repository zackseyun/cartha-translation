id: ROM.15.1
reference: Romans 15:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: yo
  text: Ó yẹ kí àwa tí a lágbára ru àwọn àìlera àwọn tí kò lágbára[a], kí a má sì tẹ́ ara wa lọ́rùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àṣìṣe àwọn tí kò lágbára.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àìlera, ààlà, tàbí àṣìṣe; níbí ó ṣeé ṣe kí ó ń tọ́ka sí àwọn ohun tí ẹ̀rí-ọkàn wọn kò gbà tàbí àwọn ààlà tí a jíròrò ní orí tí ó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: ó yẹ kí àwa … máa
  rationale: Ó fi ojúṣe ìwà rere hàn láìsọ ọ́ di àṣẹ líle tí kò ní ààyè fún ìyàtọ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìjíròrò tó ṣáájú gẹ́gẹ́ bí ìyípadà kékeré pẹ̀lú ìtakora sí ìwà tí a mẹ́nu kàn ní 14:23.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: àwa tí a lágbára
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ mọ́, ó sì bá ìyàtọ̀ láàárín ẹni tó lágbára àti ẹni tí kò lágbára nínú Róòmù 14–15 mu.
- source_word: τὰ ἀσθενήματα
  choice: àwọn àìlera
  rationale: Ọ̀rọ̀ yìí gbòòrò tó láti ní àwọn ààlà tàbí ohun tí ẹ̀rí-ọkàn ẹni tí kò lágbára kò gbà, láìdá wọn lẹ́bi pé wọ́n ṣẹ̀.
- source_word: τῶν ἀδυνάτων
  choice: àwọn tí kò lágbára
  rationale: Ó mú ìtakora ọ̀rọ̀ láàárín δυνατοί àti ἀδύνατοι hàn kedere, kò sì fi hàn pé agbára ara tàbí ipò láwùjọ ni a ń sọ.
- source_word: βαστάζειν
  choice: máa ru
  rationale: ‘Ru’ pa àwòrán gbígbé ẹrù ẹlòmíràn mọ́, ó sì lágbára ju pé kí ènìyàn kàn fara da a lọ.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: kí a má sì máa ṣe ohun tó wu ara wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kò gbọdọ̀ fi ìfẹ́ ara rẹ̀ ṣáájú ire ẹlòmíràn.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn tí ó lágbára’ àti ‘àwọn tí kò lágbára’
  choice: Àwọn onígbàgbọ́ tí ẹ̀rí-ọkàn wọn ní òmìnira púpọ̀ sí i àti àwọn tí ẹ̀rí-ọkàn wọn ní ààlà púpọ̀ sí i
  alternative: Àwọn alágbára àti aláìlágbára nípa ipò láwùjọ tàbí agbára ara
  rationale: Àyíká Róòmù 14 ń sọ nípa oúnjẹ, ọjọ́, àti àwọn ìyàtọ̀ nínú ohun tí ẹ̀rí-ọkàn onígbàgbọ́ gbà; nítorí náà, agbára níbí ní í ṣe ní pàtàkì pẹ̀lú òmìnira ẹ̀rí-ọkàn.
translation_notes:
  register: Yorùbá ìgbàlódé, tó níyì, tó sì rọrùn fún gbogbo ènìyàn. A lo ‘máa ru’ láti fi ojúṣe tó ń bá a lọ hàn, a sì lo ‘ohun tó wu ara wa’ gẹ́gẹ́ bí gbólóhùn Yorùbá àdánidá.
