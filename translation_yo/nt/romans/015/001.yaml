  source_fidelity: Ìtumọ̀ náà gbé ojúṣe (ὀφείλομεν), ìyàtọ̀ alágbára/aláìlágbára, àti àwòrán ‘ríru’ (βαστάζειν) kalẹ̀ dáadáa. Ṣùgbọ́n ‘Ṣùgbọ́n’ mú ìtakora δέ lágbára ju bó ṣe rí lọ; δέ níbí jẹ́ ìsopọ̀ ìyípadà pẹ̀lẹ́, ó sì lè má hàn gbangba nínú Yorùbá. Àmì ìṣe àtúnlò ‘máa’ kì í ṣe dandan fún àwọn infinitive Gíríìkì wọ̀nyí, ó sì lè fi ìṣe àṣà tí kò wà nínú ọ̀rọ̀ ìpilẹ̀ hàn.
