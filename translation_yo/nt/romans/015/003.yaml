  to: Nítorí àní Mèsáyà kò wá ohun tí ó wu ara rẹ̀[a], ṣùgbọ́n gẹ́gẹ́ bí a ti kọ ọ́ pé, “Àwọn ẹ̀gàn àwọn tí ń gàn ọ́ wọ̀ sórí mi.”
