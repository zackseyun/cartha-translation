  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbòò: “Nítorí àní” gbé ìsopọ̀ àti ìtẹnumọ́ καὶ γάρ kalẹ̀, “Mèsáyà” yẹ fún ὁ Χριστός, ìtọ́kasí Ìwé Mímọ́ náà sì dúró ṣinṣin. Ṣùgbọ́n “ṣubú lé mi lórí” kì í ṣe ọ̀nà Yorùbá tó péye fún ἐπέπεσαν ἐπ’ ἐμέ; “wọ̀ sórí mi” ni ọ̀nà àdánidá tó pa àwòrán náà mọ́. “Kò wá ohun tí ó wu ara rẹ̀” sì sọ ìtumọ̀ náà dáadáa pé kò ṣàwárí ìtẹ́lọ́rùn fún ara rẹ̀.'
  naturalness: 'Ìforúkọsílẹ̀ náà ní ìyì, ó sì bá Yorùbá boṣewa mu. A tún ìlànà méjì ṣe láti mú un rọrùn sí i: “kò wá ohun tí ó wu ara rẹ̀” àti “wọ̀ sórí mi.” Àmì ohùn àti àkọsílẹ̀ orúkọ Mèsáyà/Kristi dára.'
