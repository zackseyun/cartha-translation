id: ROM.15.3
reference: Romans 15:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: yo
  text: Nítorí àní Mèsáyà kò wá ohun tí ó wu ara rẹ̀[a], ṣùgbọ́n gẹ́gẹ́ bí a ti kọ ọ́ pé, “Àwọn ẹ̀gàn àwọn tí ń gàn ọ́ wọ̀ sórí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi” dípò “Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí àní
  rationale: “Nítorí” so ẹsẹ yìí mọ́ ìṣírí tó ṣáájú gẹ́gẹ́ bí ìdí, “àní” sì tẹnumọ́ pé Mèsáyà fúnra rẹ̀ jẹ́ àpẹẹrẹ náà.
- source_word: ὁ Χριστός
  choice: Mèsáyà
  rationale: Àpilẹ̀kọ náà àti lílo rẹ̀ gẹ́gẹ́ bí oyè nínú ọ̀rọ̀ yìí ṣe àtìlẹ́yìn fún “Mèsáyà”; àlàyé ìsàlẹ̀ ojú ìwé fi “Kristi” hàn gẹ́gẹ́ bí ìtumọ̀ míì.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: kò ṣe ohun tí ó wu ara rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kò gbé ìfẹ́ tàbí ìtẹ́lọ́rùn ara rẹ̀ síwájú, láì fi ìtumọ̀ míì kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: ṣùgbọ́n gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Ó pa àtakò náà àti ọ̀nà ìtọ́kasí Ìwé Mímọ́ mọ́ ní èdè Yorùbá tó ṣe déédé.
- source_word: ὀνειδισμοί
  choice: ẹ̀gàn
  rationale: “Ẹ̀gàn” sọ ìkórìíra àti ọ̀rọ̀ àbùkù tí ọ̀rọ̀ náà ń tọ́ka sí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ní iyì.
- source_word: τῶν ὀνειδιζόντων σε
  choice: àwọn tí ń gàn ọ́
  rationale: Ìtumọ̀ yìí pa ìbátan ọ̀rọ̀ tó wà láàárín ὀνειδισμοί àti ὀνειδιζόντων mọ́ nípasẹ̀ “ẹ̀gàn/gàn,” ó sì tẹ̀ lé ìṣe tí ń lọ lọ́wọ́ nínú participle.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: ṣubú lé mi lórí
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti àdánidá fún àwòrán pé àwọn ẹ̀gàn náà dé bá ẹni tó ń sọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fi ṣe àpẹẹrẹ fún àwọn onígbàgbọ́. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ìbílẹ̀ “Kristi” mọ́.
- issue: Ẹni tó ń sọ̀rọ̀ nínú ọ̀rọ̀ àyọlò
  choice: A fi “mi” sílẹ̀ bí ó ṣe wà nínú Sáàmù, láì sọ ní pàtó pé Mèsáyà ni.
  alternative: Ṣíṣe àlàyé “mi” ní pàtó gẹ́gẹ́ bí Mèsáyà/Kristi
  rationale: Pọ́ọ̀lù lo Sáàmù 69:9 sí Mèsáyà, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò fi àlàyé ìdánimọ̀ yẹn kún àyọlò náà; ìtumọ̀ náà yẹ kí ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti ìgbàlódé, ó ní iyì, ó sì ṣe kedere fún òǹkàwé nav; “gẹ́gẹ́ bí a ti kọ ọ́ pé” ní ìró Ìwé Mímọ́ láì di èdè àtijọ́.
