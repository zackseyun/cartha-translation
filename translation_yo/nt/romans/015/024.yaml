source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: yo
  text: nígbà yòówù tí mo bá lọ sí Sípéènì[a]—nítorí mo retí láti rí yín bí mo ṣe ń kọjá lọ, kí ẹ sì rán mi lọ sí ibẹ̀[b], bí mo bá ti kọ́kọ́ ní ìtẹ́lọ́rùn ní ìwọ̀n kan nínú wíwà pẹ̀lú yín[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nígbà tí mo bá lọ sí Sípéènì.” Ìṣètò ọ̀rọ̀ Gíríìkì ń tọ́ka sí àkókò ọjọ́ iwájú tí a kò tíì dá lé.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “kí ẹ sì ràn mí lọ́wọ́ lórí ìrìn àjò mi sí ibẹ̀.” Ọ̀rọ̀ náà lè ní ríran arìnrìn-àjò lọ́wọ́ tàbí títẹ̀lé e síwájú.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, Gíríìkì sọ pé “bí mo bá kọ́kọ́ kún dé ìwọ̀n kan láti ọ̀dọ̀ yín.” Ó ṣeé ṣe kí ó ń sọ nípa ayọ̀ àjọṣe pẹ̀lú wọn fún àkókò tí ó ní ààlà kí ó tó tẹ̀ síwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: nígbà yòówù tí mo bá lọ
  rationale: Ó fi àkókò ọjọ́ iwájú tí kò tíì dájú hàn, ó sì jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: Σπανίαν
  choice: Sípéènì
  rationale: Orúkọ ilẹ̀ Spain ní ìkọ̀wé Yorùbá tí ó bá ìpè rẹ̀ mu.
- source_word: ἐλπίζω γὰρ
  choice: nítorí mo ní ìrètí pé
  rationale: “Nítorí” pa iṣẹ́ àlàyé γάρ mọ́, “mo ní ìrètí” sì fi ìfojúsọ́nà pẹ̀lú ìfẹ́ inú hàn.
- source_word: διαπορευόμενος
  choice: bí mo bá ṣe ń kọjá lọ
  rationale: Ó fi hàn pé Róòmù wà lójú ọ̀nà rẹ̀ sí ibi mìíràn, láìsọ pé ibẹ̀ ni òpin ìrìn àjò rẹ̀.
- source_word: θεάσασθαι ὑμᾶς
  choice: èmi yóò rí yín
  rationale: “Rí yín” jẹ́ ọ̀rọ̀ àdánidá fún ìpàdé ojúkojú nínú àyíká ìrìn àjò yìí.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: kí ẹ sì rán mi lọ sí ibẹ̀
  rationale: Ó pa èrò pé àwọn onígbàgbọ́ yóò ṣèrànwọ́ fún ìtẹ̀síwájú ìrìn àjò mọ́, láìpinnu bóyá owó, ìpèsè, tàbí títẹ̀lé e ni ìrànwọ́ náà.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: bí mo bá ... ní ìtẹ́lọ́rùn
  rationale: “Bí mo bá” pa àìdájú ọjọ́ iwájú mọ́; “ní ìtẹ́lọ́rùn” jẹ́ Yorùbá àdánidá fún àwòrán jíjẹ́-kún nínú àyíká ìbáṣepọ̀.
- source_word: ὑμῶν πρῶτον ἀπὸ μέρους
  choice: kọ́kọ́ ... dé ìwọ̀n kan nínú wíwà pẹ̀lú yín
  rationale: “Kọ́kọ́” fi àkókò ṣáájú ìtẹ̀síwájú ìrìn àjò hàn; “dé ìwọ̀n kan” pa ààlà ἀπὸ μέρους mọ́ láìpinnu bóyá àkókò kúkúrú tàbí ìtẹ́lọ́rùn tí kò pé ni.
theological_decisions:
- issue: Irú ìrànwọ́ tí Pọ́ọ̀lù ń retí lọ́wọ́ àwọn onígbàgbọ́ Róòmù
  choice: kí ẹ sì rán mi lọ sí ibẹ̀
  alternative: kí ẹ sì ràn mí lọ́wọ́ lórí ìrìn àjò mi sí ibẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè ní títẹ̀lé ẹni, pípèsè fún un, tàbí ríran an lọ; a kò sọ irú ìrànwọ́ pàtó, nítorí náà ìtumọ̀ náà kò fi ètò iṣẹ́ ìránṣẹ́ kan tí ẹsẹ̀ kò sọ kún un.
- issue: Ìtumọ̀ ἐμπλησθῶ ... ἀπὸ μέρους nínú ìbáṣepọ̀ Pọ́ọ̀lù pẹ̀lú wọn
  choice: ní ìtẹ́lọ́rùn dé ìwọ̀n kan nínú wíwà pẹ̀lú yín
  alternative: jẹ́ kí n kún dé ìwọ̀n kan nínú yín
  rationale: Àṣàyàn náà jẹ́ èdè Yorùbá tí ó ṣe kedere, ó sì pa ìtẹ́lọ́rùn àti ààlà gbolohun Gíríìkì mọ́, láìfipá pinnu bóyá àkókò ìbẹ̀wò tàbí ìwọ̀n ayọ̀ ni a ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ìṣe alágbèṣe níbi tí ó bá jẹ́ àdánidá ní Yorùbá, a sì pa gbogbo àìdájú àti ààlà inú Gíríìkì mọ́. Àmì gígùn ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ̀ tó tẹ̀ lé e.
