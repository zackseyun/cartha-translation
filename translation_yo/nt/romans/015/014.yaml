  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fi ìtumọ̀ àwọn apá Gíríìkì pàtàkì hàn dáadáa: ìdánilójú tí ó ti fìdí múlẹ̀, ìtẹnumọ́ ẹni akọkọ àti àwọn olùgbọ́, ìwà rere, gbogbo ìmọ̀, àti agbára fún ìmúnilọ́gbọ̀n. Síbẹ̀, ‘fún ara yín ní ìtọ́nisọ́nà’ lè dá bí fífi ìtọ́nisọ́nà fún ara ẹni, kì í sì fi ìbáṣepọ̀ ἀλλήλους hàn kedere. ‘Gba ara yín ní ìmọ̀ràn’ jẹ́ ọ̀nà kedere àti àdánidá láti ṣàfihàn ìṣe àárín ara wọn, pẹ̀lú ìtumọ̀ ìtọ́ni/ìmúnilọ́gbọ̀n inú νουθετεῖν.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa tí ó rọrùn láti ka, àmì ohùn sì péye ní gbogbogbò. Àtúnṣe kékeré sí òpin ẹsẹ̀ náà mú ìbáṣepọ̀ ‘ọ̀kan sí ẹnì kejì’ hàn kedere. A tún ṣàtúnṣe ‘tọ́ ... sọ́nà’ sí ‘tọ́ ... sọ́nà,’ èyí tí ó jẹ́ ìkọ̀wé Yorùbá boṣewa.
  terminology: ‘Ìwà rere’ dáa fún ἀγαθωσύνη. ‘Ìmọ̀ràn’ nínú gbólóhùn ‘gba ara yín ní ìmọ̀ràn’ ń ṣiṣẹ́ gẹ́gẹ́ bí ìmúnilọ́gbọ̀n tàbí ìtọ́ni arákùnrin, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn pàtó kún un. Àlàyé ìsàlẹ̀ ojú ìwé pa ‘kìlọ̀’ àti ‘tọ́sọ́nà’ mọ́ gẹ́gẹ́ bí àwọn ìtumọ̀ mìíràn.
