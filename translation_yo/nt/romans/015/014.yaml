id: ROM.15.14
reference: Romans 15:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: yo
  text: Èmi fúnra mi sì ní ìdánilójú nípa yín, ẹ̀yin arákùnrin mi[a], pé ẹ̀yin fúnra yín pẹ̀lú kún fún ìwà rere, ẹ kún fún gbogbo ìmọ̀, ẹ sì lè máa gba ara yín ní ìmọ̀ràn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arákùnrin” túmọ̀ Gíríìkì adelphoi, tí a lè lò láti pe gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́, títí kan àwọn obìnrin àti àwọn ọkùnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kìlọ̀ fún ara yín” tàbí “tọ́ ara yín sọ́nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: ní ìdánilójú
  rationale: Ọ̀rọ̀ náà jẹ́ perfect tí ó ń ṣàpèjúwe ìdánilójú tí ó ti fìdí múlẹ̀, tí ó sì wà títí di ìsinsìnyí; ‘ní ìdánilójú’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ yìí mọ́.
- source_word: δέ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ ìyípadà pẹ̀lẹ́, kì í ṣe ìtakora líle; ‘sì’ bá ìṣàn ọ̀rọ̀ mu.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: Èyí pa àwòrán ọ̀rọ̀ akọ ọ̀pọ̀ nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé fi hàn pé ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: Èmi fúnra mi
  rationale: ‘Èmi fúnra mi’ mú ìtẹnumọ́ Pọ́ọ̀lù jáde ní Yorùbá àdánidá láìfi ọ̀rọ̀ tí kò pọndandan kún un.
- source_word: περὶ ὑμῶν
  choice: nípa yín
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: καὶ αὐτοὶ
  choice: ẹ̀yin fúnra yín pẹ̀lú
  rationale: ‘Fúnra yín’ pa ìtẹnumọ́ αὐτοί mọ́, ‘pẹ̀lú’ sì mú ipa àfikún καί jáde.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: kún fún ìwà rere
  rationale: ‘Kún fún’ bá μεστός pẹ̀lú genitive mu, ‘ìwà rere’ sì mú abala ìwà rere tàbí ìdúróṣinṣin inú ἀγαθωσύνη jáde ju ‘oore’ tí ó lè túmọ̀ sí inú rere lásán lọ.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: ẹ kún fún gbogbo ìmọ̀
  rationale: Perfect participle náà ń ṣàpèjúwe ipò tí ó wà nísinsìnyí; ‘gbogbo ìmọ̀’ pa ìwọ̀n gbígbòòrò πάσης γνώσεως mọ́ láìdín in kù.
- source_word: δυνάμενοι
  choice: ẹ sì lè
  rationale: ‘Lè’ sọ agbára tàbí ìmúrasílẹ̀ wọn ní kedere, gẹ́gẹ́ bí participle náà ṣe ń sọ.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Nínú gbólóhùn aláṣepọ̀ yìí, ‘ara yín’ ni ọ̀nà Yorùbá àdánidá láti sọ ‘ọ̀kan sí ẹnì kejì.’
- source_word: νουθετεῖν
  choice: máa fún ara yín ní ìtọ́nisọ́nà
  rationale: Àṣàyàn yìí mú abala ìkọ́ni tó ń túnni ṣe jáde ní àyíká ìyìn yìí; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ tó le sí i, bí ìkìlọ̀ tàbí títọ́ni sọ́nà, mọ́.
theological_decisions:
- issue: Ìpè ἀδελφοί tí ó jẹ́ akọ ní ìlànà gírámà sí ìjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀
  choice: ẹ̀yin arákùnrin mi
  alternative: ẹ̀yin ará mi; ẹ̀yin arákùnrin àti arábìnrin mi
  rationale: A pa ìrísí ọ̀rọ̀ Gíríìkì mọ́ nínú ẹsẹ̀, ṣùgbọ́n a ṣàlàyé ní ìsàlẹ̀ ojú ìwé pé ìpè náà lè gba àwọn obìnrin onígbàgbọ́ pẹ̀lú, kí a má bàa fi ìtumọ̀ tí ó dín àwùjọ kù sí i.
- issue: Ìwọ̀n ìtumọ̀ νουθετεῖν láàárín ìkọ́ni, ìtọ́nisọ́nà, ìbáwí, àti ìkìlọ̀
  choice: máa fún ara yín ní ìtọ́nisọ́nà
  alternative: máa kìlọ̀ fún ara yín; máa tọ́ ara yín sọ́nà
  rationale: Nítorí pé Pọ́ọ̀lù ń yin ìdàgbàsókè wọn, ìtọ́nisọ́nà jẹ́ àṣàyàn gbígbòòrò tí ó bá àyíká mu; síbẹ̀, àlàyé pa agbára ìtúnṣe àti ìkìlọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ, ó sì ní ìgbékalẹ̀ ọ̀wọ̀ àti àdánidá fún olùkà òde òní. A lo ‘ẹ’ lẹ́yìn ìpè ‘ẹ̀yin’ gẹ́gẹ́ bí ìlànà Yorùbá àdánidá, a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
