id: ROM.15.19
reference: Romans 15:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: yo
  text: nípasẹ̀ agbára àwọn àmì àti iṣẹ́ ìyanu, nípasẹ̀ agbára Ẹ̀mí[a], débi pé láti Jerúsálẹ́mù àti ní gbogbo agbègbè tó yí i ká títí dé Ilíríkúmù, mo ti kéde ìhìn rere Mèsáyà ní ẹ̀kúnrẹ́rẹ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀mí Mímọ́.”
    reason: Àṣàyàn yìí sọ ẹni tí πνεύματος ń tọ́ka sí ní kedere, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì kò fi “Mímọ́” kún un níbí.
  - marker: b
    text: Tàbí, “mo ti mú ìhìn rere Mèsáyà dé ẹ̀kúnrẹ́rẹ́.”
    reason: Èyí pa àwòrán ìpilẹ̀ ti πληρόω, ‘mú kún’ tàbí ‘mú dé ẹ̀kúnrẹ́rẹ́,’ mọ́, nígbà tí ọ̀rọ̀ pàtàkì sọ ìtumọ̀ rẹ̀ nínú àyíká yìí ní Yorùbá àdánidá.
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: nípasẹ̀ agbára
  rationale: Ọ̀rọ̀ yìí fi ọ̀nà tàbí ohun èlò tí iṣẹ́ náà fi ṣẹ hàn; “nípasẹ̀ agbára” jẹ́ Yorùbá àdánidá tí ó sì pa ìtẹnumọ́ agbára tó ń ṣiṣẹ́ mọ́.
- source_word: σημείων καὶ τεράτων
  choice: àwọn àmì àti iṣẹ́ ìyanu
  rationale: Èyí jẹ́ àkójọpọ̀ ọ̀rọ̀ Bíbélì fún àwọn iṣẹ́ àrà tí ń jẹ́rìí sí iṣẹ́ Ọlọ́run; “iṣẹ́ ìyanu” mú τεράτων yé kedere ní Yorùbá.
- source_word: πνεύματος
  choice: Ẹ̀mí
  rationale: Nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí. “Ẹ̀mí” kò fi ọ̀rọ̀ “Mímọ́” kún Gíríìkì, ṣùgbọ́n lílo lẹ́tà ńlá fi ẹni tí a ń tọ́ka sí hàn.
- source_word: ὥστε
  choice: débi pé
  rationale: Ó ń sọ àbájáde iṣẹ́ ìránṣẹ́ tí agbára náà mú wá; “débi pé” bá ìtumọ̀ àti ìṣàn Yorùbá mu.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: láti Jerúsálẹ́mù àti ní gbogbo agbègbè tó yí i ká
  rationale: κύκλῳ jẹ́ ọ̀rọ̀ adverbial tó tọ́ka sí àwọn agbègbè yíká ní ìrìn iṣẹ́ ìránṣẹ́, kì í ṣe dandan pé ó rìn ní àyíká kan ṣoṣo.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: títí dé Ilíríkúmù
  rationale: μέχρι ń fi ààlà ibi tí iṣẹ́ ìránṣẹ́ náà dé hàn; “títí dé” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: πεπληρωκέναι
  choice: mo ti kéde ... ní ẹ̀kúnrẹ́rẹ́
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, πληρόω pẹ̀lú “ìhìn rere” túmọ̀ sí mímú ìkéde rẹ̀ dé ẹ̀kúnrẹ́rẹ́ káàkiri agbègbè náà. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára perfect infinitive mọ́ nípasẹ̀ “mo ti.”
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere
  rationale: “Ìhìn rere” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún εὐαγγέλιον, tí àwọn òǹkàwé òde òní lè lóye láìsí ìṣòro.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Níbi yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a ti fòróró yàn, nítorí náà “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
theological_decisions:
- issue: Ẹni tí πνεύματος ń tọ́ka sí
  choice: Ẹ̀mí, tó ń tọ́ka sí Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ní ìtumọ̀ gbogbogbò, tàbí “Ẹ̀mí Mímọ́” ní pàtó
  rationale: Àyíká iṣẹ́ ìránṣẹ́ apọ́sítélì, àwọn àmì àti iṣẹ́ ìyanu fi hàn pé Ẹ̀mí Mímọ́ ni ó ṣeé ṣe jù. A kò fi “Mímọ́” sínú ọ̀rọ̀ pàtàkì nítorí kò sí ní ọ̀rọ̀ Gíríìkì tí a tẹ̀ lé.
- issue: Ìtumọ̀ πεπληρωκέναι τὸ εὐαγγέλιον
  choice: mo ti kéde ìhìn rere ... ní ẹ̀kúnrẹ́rẹ́
  alternative: mo ti mú ìhìn rere Mèsáyà dé ẹ̀kúnrẹ́rẹ́
  rationale: Ọ̀rọ̀ náà lè ní ìrísí “mú ṣẹ” ní tààràtà, ṣùgbọ́n pẹ̀lú “ìhìn rere” àti àlàyé ilẹ̀ tí Pọ́ọ̀lù dé, ìtumọ̀ rẹ̀ ni pé ó mú iṣẹ́ ìkéde náà dé ẹ̀kúnrẹ́rẹ́. Àlàyé ìsàlẹ̀ pa ìrísí ọ̀rọ̀ Gíríìkì tó sún mọ́ “mú dé ẹ̀kúnrẹ́rẹ́” mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “Mèsáyà” gẹ́gẹ́ bí oyè, a sì lo “ìhìn rere” dípò ọ̀rọ̀ àyálò láti mú ìtumọ̀ hàn gbangba.
