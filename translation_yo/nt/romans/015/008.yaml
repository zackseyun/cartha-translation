id: ROM.15.8
reference: Romans 15:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: yo
  text: Nítorí mo sọ pé Messáyà ti di ìránṣẹ́ fún àwọn tí a kọ nílà nítorí òtítọ́ Ọlọ́run[a], kí ó lè fi àwọn ìlérí tí a ṣe fún àwọn baba múlẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí pé Ọlọ́run jẹ́ olóòótọ́,” èyí tó tẹnu mọ́ bí Ọlọ́run ṣe jẹ́ olóòótọ́ ní mímú àwọn ìlérí májẹ̀mú rẹ̀ ṣẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Nítorí mo sọ pé
  rationale: “Nítorí” pa ipa àlàyé γάρ mọ́, “mo sọ pé” sì túmọ̀ λέγω ní ọ̀nà adayeba.
- source_word: Χριστόν
  choice: Messáyà
  rationale: Ní àyíká ọ̀rọ̀ nípa Ísírẹ́lì, ìkọ nílà, àti àwọn ìlérí fún àwọn baba, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
- source_word: διάκονον γεγενῆσθαι
  choice: ti di ìránṣẹ́
  rationale: “Ti di” pa abala perfect tí ó fi ipò tó jẹ́ àbájáde ìyípadà hàn mọ́; “ìránṣẹ́” kò sì mú ipò iṣẹ́ ìjọ ti díákónì wọ inú ẹsẹ̀ náà.
- source_word: περιτομῆς
  choice: fún àwọn tí a kọ nílà
  rationale: Genitive náà tọ́ka sí àwọn ènìyàn tí a kọ nílà, ìyẹn àwọn Júù; “fún” sọ ìbáṣepọ̀ iṣẹ́ náà ní Yorùbá adayeba.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: nítorí òtítọ́ Ọlọ́run
  rationale: ὑπέρ fi ìdí tàbí àǹfààní hàn; ἀλήθεια θεοῦ lè túmọ̀ sí òtítọ́ Ọlọ́run tàbí jíjẹ́ olóòótọ́ rẹ̀, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: kí ó lè fi ìdí ... múlẹ̀
  rationale: Ìsọ̀rọ̀ náà fi ète hàn, βεβαιόω sì túmọ̀ sí fífi ohun kan múlẹ̀ tàbí jíjẹ́rìí sí i.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: àwọn ìlérí tí a ṣe fún àwọn baba
  rationale: Èyí mú kí ìbáṣepọ̀ genitive náà ṣe kedere ní Yorùbá, ó sì pa àkànṣe ìtàn ìgbàlà ti “àwọn baba” mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Messáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àyíká ìtàn ìgbàlà tó dá lórí Ísírẹ́lì àti àwọn ìlérí fún àwọn baba.
- issue: Ìtumọ̀ ἀλήθεια θεοῦ
  choice: òtítọ́ Ọlọ́run
  alternative: jíjẹ́ olóòótọ́ Ọlọ́run
  rationale: Gíríìkì gba méjèèjì láyè. Ọ̀rọ̀ tó tẹ̀ lé nípa mímú àwọn ìlérí ṣẹ fi jíjẹ́ olóòótọ́ Ọlọ́run hàn gidigidi, ṣùgbọ́n a kò fẹ́ dá ìtumọ̀ tó gbòòrò sí i dúró; nítorí náà a fi àṣàyàn náà sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. A lo “àwọn tí a kọ nílà” dípò ọ̀rọ̀ àfojúsùn tó lè ṣòro, a sì pa “àwọn baba” mọ́ nítorí ìtọ́kasí rẹ̀ sí àwọn baba ńlá Ísírẹ́lì.
