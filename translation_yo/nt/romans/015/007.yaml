id: ROM.15.7
reference: Romans 15:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: yo
  text: Nítorí náà, ẹ tẹ́wọ́ gba ara yín[a], gẹ́gẹ́ bí Mèsáyà náà ti tẹ́wọ́ gba yín, fún ògo Ọlọ́run.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹ máa gba ara yín’ tàbí ‘ẹ máa kí ara yín sílẹ̀.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí ‘sí ògo Ọlọ́run’; gbólóhùn Gíríìkì náà lè tọ́ka sí ète tàbí àbájáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ ìparí èrò tí Pọ́ọ̀lù ti ń ṣàlàyé ṣáájú.
- source_word: προσλαμβάνεσθε … προσελάβετο
  choice: ẹ máa gba ara yín tọ̀wọ̀tọ̀wọ̀ … ti gba yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbígba ẹnì kan mọ́ra tàbí sí àárín ẹgbẹ́; ‘tọ̀wọ̀tọ̀wọ̀’ mú ìtumọ̀ ìkíni àti ìtẹ́wọ́gbà onífẹ̀ẹ́ jáde. Lílo ‘gba’ ní ibi méjèèjì pa ìbáradọ́gba ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe tí àwọn ènìyàn ń ṣe sí ara wọn.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí … pẹ̀lú
  rationale: ‘Gẹ́gẹ́ bí’ pa ìfiwéra mọ́, ‘pẹ̀lú’ sì ṣojú καί.
- source_word: ὁ Χριστὸς
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός dúró gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde ní kedere.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: fún ògo Ọlọ́run
  rationale: Èyí jẹ́ Yorùbá àdánidá tí ó lè tọ́ka sí ète tàbí àbájáde, bí εἰς ṣe lè túmọ̀ sí níhìn-ín.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àpilẹ̀kọ ὁ àti àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún lílo rẹ̀ gẹ́gẹ́ bí oyè. Àfikún ìsàlẹ̀ jẹ́ kí ọ̀nà ìtumọ̀ tí ó wọ́pọ̀ ‘Kristi’ hàn láìfi ẹ̀kọ́ ẹ̀sìn kan lé ẹsẹ náà lórí.
- issue: Ìtumọ̀ προσλαμβάνομαι nínú ìjọ
  choice: gba ara yín tọ̀wọ̀tọ̀wọ̀
  alternative: gba ara yín / tẹ́wọ́ gba ara yín
  rationale: Ó sọ ìtẹ́wọ́gbà láàárín àwọn onígbàgbọ́ ní ọ̀nà onífẹ̀ẹ́, láìdín ọ̀rọ̀ náà kù sí ìfaradà lásán tàbí fi ìtumọ̀ ẹ̀kọ́ kan tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- issue: Ipa εἰς nínú εἰς δόξαν τοῦ θεοῦ
  choice: fún ògo Ọlọ́run
  alternative: sí ògo Ọlọ́run / kí Ọlọ́run lè gba ògo
  rationale: ‘Fún’ jẹ́ àdánidá, ó sì pa ààyè sílẹ̀ fún ìtumọ̀ ète tàbí àbájáde, dípò yíyan ọ̀kan nínú wọn ní dandan.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ọ̀rọ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo ọ̀nà àṣẹ ọ̀pọ̀ ènìyàn ‘ẹ máa …’ láti mú agbára ìṣe tí ń bá a lọ nínú προσλαμβάνεσθε jáde.
