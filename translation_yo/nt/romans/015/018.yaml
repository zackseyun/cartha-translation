id: ROM.15.18
reference: Romans 15:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: yo
  text: Nítorí èmi kò ní gbójú láti sọ ohunkóhun, àyàfi ohun tí Mèsáyà ti ṣe nípasẹ̀ mi láti mú àwọn aláì-Júù[a] wá sí ìgbọ́ràn, nípasẹ̀ ọ̀rọ̀ àti iṣẹ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Èmi kò ní gbójú láti sọ ohunkóhun, àyàfi ohun tí Mèsáyà ti ṣe nípasẹ̀ mi.”
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: kì yóò láyà
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀-ìṣe ọjọ́ iwájú, ó sì sọ pé Pọ́ọ̀lù kò ní gbìyànjú tàbí ní ìgboyà láti sọ ohun tí kò yẹ; “kì yóò láyà” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ náà mọ́.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: láti sọ ohunkóhun, àyàfi ohun tí
  rationale: 'Àkójọpọ̀ ọ̀rọ̀ Gíríìkì yìí ní ìtumọ̀ ìdíwọ̀: kì í sọ ohun mìíràn ju ohun tí Mèsáyà ṣe lọ. “Àyàfi” mú ìbáṣepọ̀ náà hàn kedere ní Yorùbá.'
- source_word: κατειργάσατο
  choice: ti ṣe
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ohun tí a mú ṣẹ tàbí tí a ṣàṣeparí. “Ti ṣe” jẹ́ èdè Yorùbá tó rọrùn, ó sì fi hàn pé iṣẹ́ náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì dúró.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níhìn-ín, Χριστός ń tọ́ka sí ipò ẹni tí Ọlọ́run yàn, ẹni tó ń ṣiṣẹ́ nípasẹ̀ Pọ́ọ̀lù; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: δι’ ἐμοῦ
  choice: nípasẹ̀ mi
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ nínú genitive fi ẹni tàbí ohun èlò tí iṣẹ́ gba ọ̀dọ̀ rẹ̀ hàn. Èyí jẹ́ kí Mèsáyà jẹ́ olùṣe pàtàkì, Pọ́ọ̀lù sì jẹ́ ẹni tí ó lò.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: láti mú àwọn Kèfèrí wá sínú ìgbọ́ràn
  rationale: Ìtumọ̀ ìdí tàbí àbájáde εἰς jẹ́ èdè Yorùbá àdánidá ní ọ̀nà yìí. Nínú Róòmù, ἔθνη sábà máa ń tọ́ka sí àwọn tí kì í ṣe Júù.
- source_word: λόγῳ καὶ ἔργῳ
  choice: nípa ọ̀rọ̀ àti iṣẹ́
  rationale: Àwọn dative méjèèjì lè fi ọ̀nà tàbí ohun èlò hàn; gbolohun yìí pa ìyàtọ̀ tó wà láàárín ohun tí a sọ àti ohun tí a ṣe mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà lè ti di orúkọ bí “Kristi” nínú lílò Kristẹni, ṣùgbọ́n ní àyíká yìí ó ṣeé kà sí oyè ẹni tí Ọlọ́run yàn; “Mèsáyà” jẹ́ kí agbára oyè náà hàn.
- issue: Ìtumọ̀ ἐθνῶν
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Nínú ìjíròrò Pọ́ọ̀lù nínú Róòmù, ọ̀rọ̀ náà sábà ń yà àwọn tí kì í ṣe Júù sọ́tọ̀; àlàyé ìsàlẹ̀ fi ìtumọ̀ gbooro “àwọn orílẹ̀-èdè” sílẹ̀.
- issue: Ẹni tó ń ṣe iṣẹ́ ìránṣẹ́ náà
  choice: Mèsáyà ni olùṣe; Pọ́ọ̀lù ni ọ̀nà tí iṣẹ́ náà gbà
  alternative: Kí a sọ ọ́ bí ẹni pé Pọ́ọ̀lù fúnra rẹ̀ ni olùṣe pàtàkì
  rationale: δι’ ἐμοῦ fi Pọ́ọ̀lù hàn gẹ́gẹ́ bí ẹni tí iṣẹ́ Mèsáyà gbà ṣe; ìtumọ̀ náà kò yẹ kí ó yí ìtẹnumọ́ yìí padà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu fún kíkà ní gbangba. A lo “Kèfèrí” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ọ̀pọ̀ ènìyàn mọ̀ fún àwọn tí kì í ṣe Júù, a sì fi “àwọn orílẹ̀-èdè” sínú àlàyé láti pa ìtumọ̀ míì mọ́. Àmì kọ́mà tó parí ẹsẹ yìí ń tẹ̀ lé pé gbolohun náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
