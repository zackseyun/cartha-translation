id: ROM.15.5
reference: Romans 15:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: yo
  text: Kí Ọlọ́run, ẹni tí ó ń fúnni ní ìfaradà àti ìṣírí, mú kí ẹ jọ ní èrò kan náà[a], ní ìbámu pẹ̀lú Mèsáyà Jésù[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ní ìrònú kan náà” tàbí “láti jẹ́ onínú kan náà.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “gẹ́gẹ́ bí Mèsáyà Jésù”; “ní ìbámu pẹ̀lú” fi hàn pé Mèsáyà Jésù ni òṣùwọ̀n ìṣọ̀kan èrò náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Kí Ọlọ́run
  rationale: δέ jẹ́ àsopọ̀ onírẹ̀lẹ̀ nínú àyíká yìí, ṣùgbọ́n kò pọn dandan láti fi ọ̀rọ̀ àsopọ̀ kan sí iwájú ní Yorùbá. Àgbékalẹ̀ “Kí Ọlọ́run…” fi agbára àdúrà-ìfẹ́ inú optative δῴη hàn lọ́nà àdánidá.
- source_word: τῆς ὑπομονῆς
  choice: ẹni tí ó ń fúnni ní ìfaradà
  rationale: Genitive náà lè tọ́ka sí Ọlọ́run gẹ́gẹ́ bí orísun tàbí olùfúnni ní ὑπομονή. “Ìfaradà” túmọ̀ sí dídúró ṣinṣin lábẹ́ ìnira ju sùúrù lásán lọ.
- source_word: τῆς παρακλήσεως
  choice: àti ìṣírí
  rationale: παράκλησις lè jẹ́ ìtùnú, ìṣírí, tàbí ìyanjú. “Ìṣírí” pa ìtumọ̀ fífúnni-lókun tí ó bá àyíká ẹsẹ 4 mu mọ́.
- source_word: δῴη
  choice: mú kí ẹ ní
  rationale: Aorist optative nínú àdúrà-ìfẹ́ ni; “kí… mú kí…” jẹ́ àgbékalẹ̀ Yorùbá àdánidá tí ó pa ìfẹ́ àdúrà náà mọ́.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: ní èrò kan náà
  rationale: φρονεῖν kan èrò inú, ìwòye, tàbí ọ̀nà ìrònú. “Ní èrò kan náà” sun mọ́ Gíríìkì, ó sì yàgò fún fífi ìṣọ̀kan gbogbo èrò lórí gbogbo ọ̀ràn kún un.
- source_word: ἐν ἀλλήλοις
  choice: sí ara yín
  rationale: Gbólóhùn náà ṣàpèjúwe ìbáṣepọ̀ alárinrin láàárín wọn. “Sí ara yín” jẹ́ Yorùbá àdánidá fún ìtọ́sọ́nà ìwà tàbí èrò sí ara ẹni.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: ní ìbámu pẹ̀lú Mèsáyà Jésù
  rationale: κατά fi ìbámu pẹ̀lú àpẹẹrẹ tàbí òṣùwọ̀n hàn. Χριστός ni a túmọ̀ gẹ́gẹ́ bí oyè “Mèsáyà,” nígbà tí Ἰησοῦς jẹ́ orúkọ “Jésù.”
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ṣì ní agbára oyè rẹ̀ nínú gbólóhùn yìí; “Mèsáyà” pa ìtumọ̀ ẹni àmìòróró mọ́ dípò lílo ọ̀rọ̀ náà bí ẹni pé ó jẹ́ apá orúkọ lásán.
- issue: Ìtumọ̀ τὸ αὐτὸ φρονεῖν
  choice: ní èrò kan náà
  alternative: jẹ́ onírúurú èrò kan náà / ní inú kan náà
  rationale: Àṣàyàn náà pa ìpè sí ìṣọ̀kan èrò inú mọ́ láìsọ pé gbogbo wọn gbọ́dọ̀ ní èrò kan náà lórí gbogbo kókó.
translation_notes:
  register: Yorùbá boṣewa oníyì pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo àgbékalẹ̀ àdúrà “Kí…” àti ọ̀rọ̀ ìgbàlódé tí ó ṣe kedere fún òǹkàwé gbogbogbò.
