    rationale: Ó lè túmọ̀ sí ohun tí ó kan ara ẹni; “ohun ìní” sọ ìrànlọ́wọ́ ti ara/ti ohun-ìní tí àyíká ìkójọpọ̀ owó ń béèrè ní kedere.
