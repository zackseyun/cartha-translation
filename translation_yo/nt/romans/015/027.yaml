id: ROM.15.27
reference: Romans 15:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: yo
  text: Nítorí inú wọn dùn láti ṣe é, wọ́n sì jẹ wọ́n ní gbèsè. Nítorí bí àwọn Kèfèrí[a] ti ní ìpín nínú àwọn ohun ẹ̀mí wọn[b], wọ́n sì ní ojúṣe láti ṣe iṣẹ́ ìránṣẹ́ fún wọn nípa ohun ìní[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè”; níbí ó túmọ̀ sí àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ìbùkún ẹ̀mí wọn.” Ní tààrà, Gíríìkì sọ pé “àwọn ohun ẹ̀mí wọn.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ní àwọn ohun ti ara”; níbí ó túmọ̀ sí ohun ìní tàbí ìrànlọ́wọ́ fún àìní ara, ní ìtakò sí àwọn ohun ẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: inú wọn dùn láti ṣe é
  rationale: Ó fi ìtẹ́wọ́gbà àtinúwá àti inú dídùn hàn, ó sì jẹ́ kí ohun tí wọ́n ṣe—ìdáwó tí ẹsẹ tó ṣáájú mẹ́nu kàn—wà ní ìtumọ̀ láìṣe àlàyé ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: wọ́n jẹ wọ́n ní gbèsè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ojúṣe tàbí gbèsè ìwà rere wà lórí wọn sí àwọn olùgbà.
- source_word: τὰ ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká ọ̀rọ̀ Paulu, ó ń tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe gbogbo orílẹ̀-èdè láìsí ìyàtọ̀.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: àwọn ohun ti Ẹ̀mí tiwọn
  rationale: Ó pa ìṣubú-orúkọ ajẹtífù Gíríìkì mọ́ gẹ́gẹ́ bí ‘àwọn ohun ti Ẹ̀mí,’ láìfi ‘ìbùkún’ kún un bí ẹni pé ó wà ní gbangba nínú ọ̀rọ̀ orísun.
- source_word: ἐκοινώνησαν
  choice: ní ìpín nínú
  rationale: Ọ̀rọ̀ yìí sọ nípa kíkópa tàbí jíjẹ́ alábápín nínú ohun kan, ó sì bá ìlò dátífù Gíríìkì mu.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: fi àwọn ohun ti ara
  rationale: Níbí, ‘ti ara’ dúró ní ìtakò sí ‘ti Ẹ̀mí’ ó sì túmọ̀ sí ohun ìní tàbí ìrànlọ́wọ́ fún àìní ara, kì í ṣe ìwà ẹlẹ́ṣẹ̀.
- source_word: λειτουργῆσαι
  choice: ṣe iṣẹ́ ìránṣẹ́
  rationale: Ó pa èrò iṣẹ́ tí a ṣe fún àǹfààní ẹlòmíràn mọ́, pẹ̀lú ọlá tí ọ̀rọ̀ Gíríìkì lè ní, láìdín un mọ́ iṣẹ́ àwọn aṣáájú ìjọ.
theological_decisions:
- issue: Ìtumọ̀ σαρκικοῖς ní ìtakò sí πνευματικοῖς
  choice: àwọn ohun ti ara
  alternative: àwọn ohun ti ẹran ara
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti ìdáwó owó fún àwọn ènìyàn mímọ́ ní Jerusalẹmu; nítorí náà, ó ń tọ́ka sí ìrànlọ́wọ́ ti ohun ìní tàbí àìní ara, kì í ṣe ẹran ara gẹ́gẹ́ bí agbára ẹ̀ṣẹ̀.
- issue: Àwọn tí αὐτῶν àti αὐτοῖς ń tọ́ka sí
  choice: àwọn onígbàgbọ́ Júù ní Jerusalẹmu tí a ń kó ìdáwó fún
  alternative: Israẹli lápapọ̀
  rationale: Róòmù 15:25–26 sọ ní tààrà nípa àwọn ènìyàn mímọ́ ní Jerusalẹmu. Síbẹ̀, ìdí tí Paulu fi sọ gbèsè náà ní ìpìlẹ̀ tó gbòòrò nínú bí àwọn Kèfèrí ṣe gba àwọn ohun ti Ẹ̀mí láti ọ̀dọ̀ àwọn Júù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “Kèfèrí” ní ìtumọ̀ Bíbélì fún àwọn tí kì í ṣe Júù, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
