  source_fidelity: Ìtumọ̀ náà tẹ̀lé ìtumọ̀ gígùn ẹsẹ náà dáadáa, ṣùgbọ́n lílo “Ẹ̀mí” pẹ̀lú lẹ́tà ńlá fún πνευματικοῖς fi ìtumọ̀ pàtó (Ẹ̀mí Mímọ́) kún ọ̀rọ̀ tí Gíríìkì fi sílẹ̀ gẹ́gẹ́ bí “àwọn ohun ẹ̀mí.” Bákan náà, “ó yẹ kí” rọ̀ ju ὀφείλουσιν, èyí tí ó sọ ojúṣe/gbèsè ní kedere.
  naturalness: “Wọ́n jẹ wọ́n ní gbèsè” ṣeé lóye, ṣùgbọ́n “wọ́n jẹ wọ́n ní gbèsè” lè dà bí ìlò tó tún ọ̀rọ̀ arọ́pò-orúkọ ṣe. “Wọ́n jẹ wọ́n ní gbèsè” náà kò burú, ṣùgbọ́n “wọ́n jẹ wọ́n ní gbèsè” ni a fi rọ́pò pẹ̀lú “wọ́n jẹ wọ́n ní gbèsè” nínú àtúnyẹ̀wò? Ní ti ìtúmọ̀ àtúnṣe, “wọ́n jẹ wọ́n ní gbèsè” wà ní ìlò Yorùbá; a pa á mọ́. Àmọ́ “wọ́n sì ní ojúṣe láti” jẹ́ ìsọ̀rọ̀ tó lágbára, tó sì dára ju “ó yẹ kí” lọ fún gbolohun kejì.
  terminology: A pa “àwọn Kèfèrí” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí àlàyé ìsàlẹ̀ rẹ̀ ṣàlàyé. A yí “àwọn ohun ti Ẹ̀mí tiwọn” padà sí “àwọn ohun ẹ̀mí wọn” láti má ṣe dá πνευματικοῖς mọ́ Ẹ̀mí Mímọ́ nìkan. A sọ σαρκικοῖς di “ohun ìní” nínú ìtumọ̀ àkọ́kọ́, níwọ̀n bí àyíká ṣe jẹ́ ìrànlọ́wọ́ ohun-ìní.
