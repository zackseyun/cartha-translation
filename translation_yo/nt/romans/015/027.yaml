  to: Nítorí inú wọn dùn láti ṣe é, wọ́n sì jẹ wọ́n ní gbèsè. Nítorí bí àwọn Kèfèrí[a] ti ní ìpín nínú àwọn ohun ẹ̀mí wọn[b], wọ́n sì ní ojúṣe láti ṣe iṣẹ́ ìránṣẹ́ fún wọn nípa ohun ìní[c].
