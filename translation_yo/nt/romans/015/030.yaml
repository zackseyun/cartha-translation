id: ROM.15.30
reference: Romans 15:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: yo
  text: Mo sì ń rọ̀ yín, ẹ̀yin ará[b], nípasẹ̀ Olúwa wa Jésù Mèsáyà[a] àti nípasẹ̀ ìfẹ́ Ẹ̀mí[c], pé kí ẹ bá mi jọ tiraka nínú àwọn àdúrà sí Ọlọ́run fún mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì Christos jẹ́ oyè tó túmọ̀ sí “Ẹni Àmì Òróró” tàbí “Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “ará” jẹ́ akọ ní ìlànà gírámà, ṣùgbọ́n ó lè ń bá gbogbo àwùjọ onígbàgbọ́ sọ̀rọ̀, ìyẹn àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
  - marker: c
    text: Ó tún lè túmọ̀ sí “ìfẹ́ tí Ẹ̀mí ní” tàbí “ìfẹ́ tí Ẹ̀mí mú jáde”; ìbáṣepọ̀ ọ̀rọ̀ inú Gíríìkì lè gba ìtumọ̀ ju ọ̀kan lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Mo sì ń rọ̀ yín
  rationale: “Rọ̀” fi hàn pé Pọ́ọ̀lù ń fi tọkàntọkàn gba wọn níyànjú, kì í ṣe pé ó kàn ń béèrè lásán. “Sì” ń gbé iṣẹ́ δέ gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀, láì fi ìtumọ̀ àkókò “nísinsin yìí” kún un.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” ni ọ̀rọ̀ Yorùbá àdánidá fún àwọn ọmọ ìjọ tàbí àwọn onígbàgbọ́ ẹlẹgbẹ́; èdè Yorùbá kò fi akọ hàn nínú ọ̀rọ̀ yìí bí Gíríìkì ti ṣe, nítorí náà àlàyé ìhà akọ àti àǹfààní ìtumọ̀ tó kan gbogbo ìjọ wà ní àlàyé ìsàlẹ̀.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Olúwa wa Jésù Mèsáyà
  rationale: “Nípasẹ̀” pa àtúnlò διά mọ́, ó sì lè tọ́ka sí ìpìlẹ̀ ẹ̀bẹ̀ náà tàbí ọ̀nà rẹ̀. “Mèsáyà” mú Χριστός gẹ́gẹ́ bí oyè, ìyẹn Ẹni Àmì Òróró.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: ìfẹ́ Ẹ̀mí
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ genitive Gíríìkì mọ́ láì pinnu bóyá ìfẹ́ tí Ẹ̀mí ní ni tàbí ìfẹ́ tí Ẹ̀mí mú jáde. Lẹ́tà ńlá nínú “Ẹ̀mí” fi ìtọ́kasí tó ṣeé ṣe jù lọ sí Ẹ̀mí Mímọ́ hàn.
- source_word: συναγωνίσασθαί μοι
  choice: kí ẹ bá mi jọ tiraka
  rationale: “Bá mi jọ” mú agbára συν- (ṣíṣe papọ̀) jáde, “tiraka” sì pa àwòrán ìsapá líle inú ọ̀rọ̀ náà mọ́.
- source_word: ἐν ταῖς προσευχαῖς
  choice: nínú àwọn àdúrà
  rationale: Ó pa ọ̀pọ̀ nǹkan inú ταῖς προσευχαῖς mọ́, kò sì fi arọ́pò-orúkọ ohun-ìní kan tí kò sí nínú Gíríìkì kún un.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: sí Ọlọ́run fún mi
  rationale: “Sí Ọlọ́run” fi ibi tí àdúrà náà dojú kọ hàn; “fún mi” sì sọ pé àdúrà náà jẹ́ nítorí Pọ́ọ̀lù.
theological_decisions:
- issue: Ẹni tí “Ẹ̀mí” ń tọ́ka sí nínú “ìfẹ́ Ẹ̀mí”
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ẹ̀mí ní ìtumọ̀ àìlẹ́ni-nínú
  rationale: Lílò Pọ́ọ̀lù àti àyíká ọ̀rọ̀ mú kí ìtọ́kasí sí Ẹ̀mí Mímọ́ ṣeé ṣe jù lọ; síbẹ̀, a kò fi “Mímọ́” tí kò sí ní gbangba nínú ẹsẹ náà kún ọ̀rọ̀ pàtàkì.
- issue: Irú genitive nínú “ἀγάπης τοῦ πνεύματος”
  choice: ìfẹ́ Ẹ̀mí
  alternative: ìfẹ́ tí Ẹ̀mí ní / ìfẹ́ tí Ẹ̀mí mú jáde
  rationale: Ìkọ̀wé Gíríìkì lè gba ìtumọ̀ méjèèjì; ìtumọ̀ pàtàkì àti àlàyé ìsàlẹ̀ pa àìdánilójú náà mọ́.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός jẹ́ oyè fún Ẹni Àmì Òróró; “Kristi” tí ó wọ́pọ̀ wà gẹ́gẹ́ bí òmíràn nínú àlàyé ìsàlẹ̀.
- issue: Àwọn tí ἀδελφοί ń bá sọ̀rọ̀
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin / ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìlànà gírámà, ṣùgbọ́n ó lè pe gbogbo àwùjọ onígbàgbọ́. “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, àlàyé ìsàlẹ̀ sì pa ìsọfúnni Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtẹ̀sí àsopọ̀ δέ wà nínú “sì,” láì dá ọ̀rọ̀ àkókò tuntun sílẹ̀. Gbólóhùn náà pa àtúnlò “nípasẹ̀” àti agbára ìsapá papọ̀ nínú συναγωνίζομαι mọ́, nígbà tí àwọn àlàyé ìsàlẹ̀ ń dáàbò bo àwọn ibi tí Gíríìkì ní àìdánilójú.
