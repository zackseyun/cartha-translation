id: ROM.15.17
reference: Romans 15:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: yo
  text: Nítorí náà, mo ní ìdí láti ṣògo[a] nínú Mèsáyà Jésù[b] nípa àwọn ọ̀ràn tó kan Ọlọ́run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ní ìṣògo” tàbí “mo ní ohun tí mo fi lè ṣògo.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “nínú Kristi Jésù”; a lò “nínú Mèsáyà Jésù” nítorí Χριστός jẹ́ oyè níbí.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “nípa àwọn ohun tó ní í ṣe pẹ̀lú Ọlọ́run” tàbí “nínú àwọn ọ̀ràn ti Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: mo ní
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ní ẹni àkọ́kọ́ ẹyọ; “mo ní” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìsọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde tàbí ìparí èrò tó ṣáájú.
- source_word: καύχησιν
  choice: ìdí láti ṣògo
  rationale: Orúkọ náà lè túmọ̀ sí ìṣògo tàbí ohun tí ènìyàn fi lè ṣògo. Ọ̀rọ̀ yìí mú ìtumọ̀ àyíká náà jáde ní Yorùbá àdánidá láì sọ ọ́ di ìgbéraga aláìtọ́.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa ipa ἐν mọ́ gẹ́gẹ́ bí ààyè ìṣọ̀kan tàbí ipò tí ìṣògo náà wà, kì í ṣe ohun èlò lásán. Χριστός jẹ́ oyè níbí, nítorí náà a túmọ̀ rẹ̀ sí “Mèsáyà,” a sì kọ orúkọ Jésù gẹ́gẹ́ bí orúkọ.
- source_word: τὰ πρὸς τὸν θεόν
  choice: nípa àwọn ọ̀ràn tó kan Ọlọ́run
  rationale: Gbólóhùn náà ní ìtumọ̀ gbígbòòrò sí àwọn ọ̀ràn tó ní í ṣe pẹ̀lú Ọlọ́run. Èyí jẹ́ Yorùbá àdánidá, kò sì dín un kù sí iṣẹ́ àlùfáà tàbí iṣẹ́ ìránṣẹ́ kan ṣoṣo.
- source_word: θεόν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àyíká náà mu fún θεός.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a yàn ní àyíká yìí; “Mèsáyà” túmọ̀ oyè náà dípò kí ó kan ṣe àkọsílẹ̀ ohùn rẹ̀.
- issue: Irú ìṣògo tí καύχησις ń tọ́ka sí
  choice: Ìdí Pọ́ọ̀lù láti ṣògo wà nínú Mèsáyà Jésù, ó sì ní í ṣe pẹ̀lú àwọn ọ̀ràn Ọlọ́run
  alternative: Ìgbọ́kànlé ara ẹni tàbí ìgbéraga Pọ́ọ̀lù ní gbogbogbòò
  rationale: Àwọn gbólóhùn “nínú Mèsáyà Jésù” àti “àwọn ọ̀ràn tó kan Ọlọ́run” fi ààlà sí ìṣògo náà. Ìtumọ̀ náà pa ààlà wọ̀nyí mọ́ láì fi ẹ̀kọ́ ẹ̀sìn míì kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn níbi tó yẹ. “Tó” jẹ́ ìkékúrú àdánidá ti “tí ó,” ó sì jẹ́ kí gbólóhùn náà má le ju bó ṣe yẹ lọ.
