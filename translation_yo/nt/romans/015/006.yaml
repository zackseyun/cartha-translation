id: ROM.15.6
reference: Romans 15:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: yo
  text: kí ẹ lè fi ọkàn kan àti ẹnu kan[a] yin Ọlọ́run, ẹni tí ó jẹ́ Baba Olúwa wa Jésù náà, Mèsáyà[b], lógo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ ní ọ̀nà àdánidá pé, “ní ohùn kan.” Gíríìkì ní “ní ẹnu kan,” èyí tí ń tẹnumọ́ ìyìn àpapọ̀.
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ Yorùbá ìbílẹ̀ ní “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí “Mèsáyà,” ìyẹn Ẹni Àmì-Oróró.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí ẹ̀yin lè
  rationale: Ó fi ète tàbí àbájáde ọ̀rọ̀ tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ète ní Yorùbá.
- source_word: ὁμοθυμαδόν
  choice: ní ìṣọ̀kan
  rationale: Ó tọ́ka sí ìṣọ̀kan inú àti ète àpapọ̀; ó yàtọ̀ sí àwòrán ‘ẹnu kan’ tó tẹ̀ lé e.
- source_word: ἐν ἑνὶ στόματι
  choice: fi ẹnu kan
  rationale: Ó pa àwòrán ara inú Gíríìkì mọ́, ó sì tẹnumọ́ ìyìn àpapọ̀ tí gbogbo wọn ń sọ ní ìṣọ̀kan.
- source_word: δοξάζητε
  choice: yin ... lógo
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ti àdúrà àti ìjọsìn, ó sì mú ìtumọ̀ fífi ògo fún Ọlọ́run jáde.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: Ọlọ́run àti Baba
  rationale: Ó pa ìsopọ̀ tímọ́tímọ́ àwọn orúkọ méjèèjì mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: Ó túmọ̀ κύριος gẹ́gẹ́ bí oyè, ó sì pa ọ̀rọ̀ arọ́pò-orúkọ ‘wa’ mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Jésù jẹ́ orúkọ ẹni; Mèsáyà sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì-oróró náà dípò kí a kàn ṣe àfọwọ́kọ ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà/Ẹni Àmì-Oróró; yíyan ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Ìbáṣepọ̀ τὸν θεὸν καὶ πατέρα pẹ̀lú τοῦ κυρίου ἡμῶν
  choice: Ọlọ́run àti Baba Olúwa wa
  alternative: Ọlọ́run, ẹni tí í ṣe Baba Olúwa wa
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìṣọ̀kan gírámà Gíríìkì àti ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ Pọ́ọ̀lù mọ́; àṣàyàn kejì lè tú ìbáṣepọ̀ náà ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán ‘ẹnu kan’ mọ́, ṣùgbọ́n a lo ‘ní ìṣọ̀kan’ fún ὁμοθυμαδόν láti yẹra fún àtúnṣe tí kò pọndandan.
