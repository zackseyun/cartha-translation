  verdict: revise
  source_fidelity: Àkọsílẹ̀ náà ń pa ọ̀pọ̀ ìtumọ̀ Gíríìkì mọ́, ṣùgbọ́n ó sọ ὁμοθυμαδόν di ohun tí àwọn olùgbọ́ gbọ́dọ̀ ‘ní’ nípasẹ̀ gbólóhùn kejì. Ní Gíríìkì, ὁμοθυμαδόν àti ἐν ἑνὶ στόματι jọ ń ṣàlàyé bí wọ́n ṣe máa yin Ọlọ́run. Àtúnṣe náà tún so ‘Baba’ mọ́ ‘Olúwa wa’ ní kedere.
  naturalness: ‘Kí ẹ lè fi ọkàn kan àti ẹnu kan…’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bojú mu fún ìkànsí ὁμοθυμαδόν/ἐν ἑνὶ στόματι. Ó yẹ fún kíkà ní gbangba, ó sì yẹra fún ìtẹ̀lé ‘kí… kí ẹ sì…’ tí ó lè yí ìdí gbólóhùn Gíríìkì padà díẹ̀.
  terminology: ‘Olúwa,’ ‘yin…lógo,’ àti ‘Mèsáyà’ dáa fún ìforúkọsílẹ̀ òye àti èdè ìjọsìn. ‘Jésù náà, Mèsáyà’ gbé oyè Χριστός kalẹ̀ gẹ́gẹ́ bí oyè tí a túmọ̀, ní ìbámu pẹ̀lú ìlànà iṣẹ́ náà, láìfi ìtumọ̀ ẹ̀kọ́ ẹ̀sìn kún un.
