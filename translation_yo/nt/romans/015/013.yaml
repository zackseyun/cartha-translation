    rationale: Nínú Yorùbá boṣewa, “Kí Ọlọ́run ... fi ...” ti pé fún ìbùkún yìí. Fífi “kí ó” kún un lẹ́yìn náà jẹ́ àtúnsọ tí ó jẹ́ kí gbolohun náà rọ̀gbọ̀kú.
