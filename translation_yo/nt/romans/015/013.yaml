id: ROM.15.13
reference: Romans 15:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: yo
  text: Kí Ọlọ́run ìrètí fi gbogbo ayọ̀ àti àlàáfíà kún yín nígbà tí ẹ ń gbàgbọ́, kí ìrètí yín lè máa pọ̀ sí i nípasẹ̀ agbára Ẹ̀mí Mímọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Kí Ọlọ́run ìrètí
  rationale: Gbólóhùn yìí ṣàpèjúwe Ọlọ́run gẹ́gẹ́ bí orísun àti ẹni tí ìrètí dúró lé; ‘Ọlọ́run ìrètí’ pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá. δὲ jẹ́ àsopọ̀ fífẹ́ tí kò pọndandan láti fara hàn lọ́tọ̀ nínú ẹsẹ yìí.
- source_word: πληρώσαι
  choice: kí ó fi ... kún yín
  rationale: Optative náà jẹ́ àdúrà tàbí ìfẹ́ rere; àkọ́lé ‘Kí ... kí ó’ àti ‘fi ... kún’ pa àwòrán kíkún mọ́ ní Yorùbá.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: gbogbo ayọ̀ àti àlàáfíà
  rationale: ‘Gbogbo’ fi ìtumọ̀ pípé πάσης hàn; ‘ayọ̀’ àti ‘àlàáfíà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì yẹ fún àyíká yìí.
- source_word: ἐν τῷ πιστεύειν
  choice: bí ẹ ti ń gbàgbọ́
  rationale: Ó fi ìṣe tí ó ń lọ àti àyíká gbígbàgbọ́ hàn, dípò yíyí ọ̀rọ̀-ìṣe πιστεύειν padà sí orúkọ ‘ìgbàgbọ́’.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: kí ẹ lè máa pọ̀ sí i
  rationale: Ó pa ìtumọ̀ ète tàbí àbájáde mọ́. ‘Máa pọ̀ sí i’ jẹ́ Yorùbá àdánidá fún jíjẹ́ lọ́pọ̀ yanturu tàbí bíbọ̀ síwájú ju.
- source_word: ἐν τῇ ἐλπίδι
  choice: nínú ìrètí
  rationale: Ó pa ọ̀rọ̀ kan náà mọ́ pẹ̀lú τῆς ἐλπίδος, ó sì ṣàfihàn ibi tàbí ipò tí ìpọ̀sí náà wà.
- source_word: ἐν δυνάμει
  choice: nípa agbára
  rationale: Nínú àyíká yìí, ἐν ní ìtumọ̀ ohun èlò tàbí ọ̀nà; ‘nípa agbára’ sọ pé agbára Ẹ̀mí ni ó mú ìpọ̀sí náà ṣẹlẹ̀.
- source_word: πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí a mọ̀ sí rere fún Ẹ̀mí Ọlọ́run nínú lílo Pọ́ọ̀lù; àwọn lẹ́tà ńlá fi hàn pé ẹni pàtó ni a ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ πνεύματος ἁγίου
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí mímọ́
  rationale: Àyíká Pọ́ọ̀lù ń tọ́ka sí Ẹ̀mí Ọlọ́run, kì í ṣe ìwà rere tàbí agbára aláìlẹ́ni-nínú lásán. Ìkọ̀wé ‘Ẹ̀mí Mímọ́’ ṣàfihàn ẹni tí ọ̀rọ̀ náà ń tọ́ka sí láìfi ẹ̀kọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti àdúrà, ó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘yín/ẹ’ gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμᾶς.
