  to: Kí Ọlọ́run ìrètí fi gbogbo ayọ̀ àti àlàáfíà kún yín nígbà tí ẹ ń gbàgbọ́, kí ìrètí yín lè máa pọ̀ sí i nípasẹ̀ agbára Ẹ̀mí Mímọ́.
  rationale: A yọ “kí ó” kejì kúrò kí ìbùkún náà lè jẹ́ Yorùbá tó rọrùn. A tún ṣàtúnṣe apá ìgbẹ̀yìn sí “kí ìrètí yín lè máa pọ̀ sí i,” èyí tí ó ń gbé ìtumọ̀ ‘ẹ pọ̀ yanturu nínú ìrètí’ kalẹ̀ ní ọ̀nà Yorùbá tó ṣe kedere. Kò sí àfikún ẹ̀kọ́ ìsìn tàbí ìtumọ̀ tí ó kọjá ti Gíríìkì.
