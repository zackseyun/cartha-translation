  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: ó pa ìfẹ́-ìbùkún πληρώσαι mọ́, ó ṣàfihàn ayọ̀, àlàáfíà, gbígbàgbọ́, ìrètí, àti agbára Ẹ̀mí Mímọ́. Síbẹ̀, àtúnṣe kékeré kan mú ìbáṣepọ̀ gbolohun Yorùbá náà dára sí i, ó sì mú ‘abound in hope’ hàn ní èdè àdánidá.'
  naturalness: Ìbẹ̀rẹ̀ náà, “Kí Ọlọ́run ìrètí kí ó fi,” ní àmì ìfẹ́/ìbùkún méjì tí kò pọndandan. “Kí Ọlọ́run ìrètí fi” jẹ́ èdè Yorùbá tó rọrùn, tó sì bójú mu. Pẹ̀lú náà, “kí ìrètí yín lè máa pọ̀ sí i” sọ ìtumọ̀ περισσεύειν ἐν τῇ ἐλπίδι ní ọ̀nà tí ó dára ju fífi àwọn olùgbọ́ fúnra wọn “pọ̀ sí i nínú ìrètí.”
  terminology: “Ọlọ́run ìrètí,” “ayọ̀,” “àlàáfíà,” “ìrètí,” “agbára,” àti “Ẹ̀mí Mímọ́” yẹ, wọ́pọ̀, sì bá ìforúkọsílẹ̀ ìbùkún Pọ́ọ̀lù mu. “Nígbà tí ẹ ń gbàgbọ́” jẹ́ ìfihàn àdánidá fún ἐν τῷ πιστεύειν, láìsọ ìbáṣepọ̀ náà di ohun tó lágbára jù.
