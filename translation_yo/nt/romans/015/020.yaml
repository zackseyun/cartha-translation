id: ROM.15.20
reference: Romans 15:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: yo
  text: Ní ọ̀nà yìí sì ni mo fi ṣe ìfojúsùn mi kì í ṣe láti kéde ìhìn rere níbi tí a ti sọ orúkọ Mèsáyà[a], kí n má bàa kọ́lé sórí ìpìlẹ̀ ẹlòmíràn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà, ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: b
    text: Èdè Gíríìkì sọ ní tààràtà pé, “sórí ìpìlẹ̀ ẹlòmíràn.” Àwòrán ilé-kíkọ́ ni Pọ́ọ̀lù lò fún iṣẹ́ ìránṣẹ́ tí ẹlòmíràn ti bẹ̀rẹ̀.
    reason: metaphor_clarification
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Ní ọ̀nà yìí sì ni
  rationale: Ó so gbólóhùn náà mọ́ àlàyé iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù tó ṣáájú; “sì” jẹ́ àsopọ̀ pẹ̀lẹ́, kì í ṣe àmì ìtakora líle.
- source_word: φιλοτιμούμενον
  choice: mo fi ṣe ìfojúsùn mi
  rationale: Ó fi ìfẹ́ ọkàn àti ìsapá líle Pọ́ọ̀lù hàn láì sọ ọ́ di àṣẹ fún gbogbo òjíṣẹ́.
- source_word: εὐαγγελίζεσθαι
  choice: láti kéde ìhìn rere
  rationale: Ó pa ìtumọ̀ iṣẹ́ ìkéde ìhìn rere mọ́ ní èdè Yorùbá òde òní tó ṣe kedere.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: kì í ṣe níbi tí a ti sọ orúkọ Mèsáyà
  rationale: Ó pa ọ̀rọ̀ àìṣe àti ìṣe àìlórúkọ ti èdè Gíríìkì mọ́. A kò fi “tẹ́lẹ̀” kún un nítorí pé kò sí ní tààràtà nínú orísun, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ yíká ń tọ́ka sí iṣẹ́ tó ti wáyé.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níbí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a ń kéde, dípò bí orúkọ lasan.
- source_word: ἵνα μὴ
  choice: kí n má bàa
  rationale: Ìtumọ̀ yìí fi ète tí a sọ ní ọ̀nà àìṣe hàn lọ́nà Yorùbá àdánidá.
- source_word: ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  choice: kọ́lé sórí ìpìlẹ̀ ẹlòmíràn
  rationale: Ó pa àwòrán ilé-kíkọ́ àti ìpìlẹ̀ mọ́, láì fi “ọkùnrin” tàbí ohun mìíràn tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí, Χριστός jẹ́ oyè ẹni tí a sọ orúkọ rẹ̀ tàbí tí a kéde rẹ̀. Àfikún ìsàlẹ̀ fi “Kristi” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tó wọ́pọ̀.
- issue: Ìlànà iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìfojúsùn ara Pọ́ọ̀lù láti ṣiṣẹ́ níbi tí a kò tíì kéde Mèsáyà
  alternative: Àṣẹ tí kò gba ẹnikẹ́ni láyè láti ṣiṣẹ́ ní agbègbè tí a ti kéde Mèsáyà rí
  rationale: Ẹ̀ka ọ̀rọ̀ ẹni àkọ́kọ́ àti èrò inú tó wà nínú φιλοτιμούμενον ń ṣàpèjúwe ìlànà iṣẹ́ Pọ́ọ̀lù; kò sọ ọ́ di òfin fún gbogbo òjíṣẹ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Ìfojúsùn mi” sọ ìtara ara ẹni Pọ́ọ̀lù, “kéde ìhìn rere” sì yẹra fún èdè ẹ̀sìn tó lè ṣòro fún òǹkàwé gbogbogbò.
