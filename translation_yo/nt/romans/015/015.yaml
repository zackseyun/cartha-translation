source:
  edition: SBLGNT
  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: yo
  text: Ṣùgbọ́n mo ti kọ̀wé sí yín pẹ̀lú ìgboyà púpọ̀ sí i nípa àwọn ọ̀ràn kan,[a] bí ẹni tí ń rán yín létí lẹ́ẹ̀kan sí i, nítorí oore-ọ̀fẹ́ tí Ọlọ́run fi fún mi,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo kọ̀wé sí yín pẹ̀lú ìgboyà púpọ̀ sí i ní ìwọ̀n kan.” Gbólóhùn náà lè túmọ̀ sí pé Pọ́ọ̀lù kọ̀wé pẹ̀lú ìgboyà púpọ̀ sí i, tàbí pé ó kọ̀wé pẹ̀lú ìgboyà nípa àwọn ọ̀ràn kan.
    reason: lexical_alternative
  - marker: b
    text: Níhìn-ín, “oore-ọ̀fẹ́ tí Ọlọ́run fi fún mi” ń tọ́ka sí iṣẹ́-ìránṣẹ́ tàbí àṣẹ tí Ọlọ́run fi fún Pọ́ọ̀lù, kì í ṣe oore-ọ̀fẹ́ ní ìtumọ̀ gbogbogbò nìkan.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: pẹ̀lú ìgboyà díẹ̀ sí i
  rationale: Ọ̀rọ̀ náà jẹ́ afiwéra, ó sì ń tọ́ka sí ìgboyà tí ó pọ̀ sí i; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ afiwéra mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora pẹ̀lẹ́ hàn lẹ́yìn ọ̀rọ̀ ìyìn tó ṣáájú.
- source_word: ἔγραψα
  choice: mo ti kọ̀wé
  rationale: Aoristi inú lẹ́tà náà lè tọ́ka sí ohun tí Pọ́ọ̀lù ń kọ nínú lẹ́tà yìí; 'mo ti kọ̀wé' jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ἀπὸ μέρους
  choice: ní apá kan
  rationale: Ó lè túmọ̀ sí ní ìwọ̀n kan tàbí nípa àwọn kókó kan; ìtumọ̀ yìí pa àìdánilójú ìpín gbólóhùn náà mọ́.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: bí ẹni tí ń rán yín létí lẹ́ẹ̀kan sí i
  rationale: Ọ̀rọ̀-ìṣe àkópọ̀ náà ní èrò pípa ohun kan padà sí ìrántí; a fi èyí hàn ní kedere láì sọ pé àwọn olùkà ti gbàgbé.
- source_word: διὰ τὴν χάριν
  choice: nítorí oore-ọ̀fẹ́
  rationale: διά pẹ̀lú accusative ń fi ìdí tàbí ìpìlẹ̀ hàn; 'oore-ọ̀fẹ́' jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún χάρις.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: tí Ọlọ́run fi fún mi
  rationale: Ìṣọ̀kan yìí sọ Ọlọ́run di ẹni tó ṣe iṣẹ́ fífún; ìṣètò Yorùbá aláṣe yìí dára, ó sì pa ìtumọ̀ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú àyíká ọ̀rọ̀ yìí
  choice: A pa á mọ́ gẹ́gẹ́ bí 'oore-ọ̀fẹ́,' pẹ̀lú àlàyé pé ó kan iṣẹ́-ìránṣẹ́ tàbí àṣẹ tí Ọlọ́run fi fún Pọ́ọ̀lù.
  alternative: Oore tàbí ojú-rere Ọlọ́run ní ìtumọ̀ gbogbogbòò nìkan.
  rationale: Àwọn ẹsẹ tó tẹ̀ lé e so oore-ọ̀fẹ́ yìí mọ́ iṣẹ́ Pọ́ọ̀lù láàárín àwọn Kèfèrí. Síbẹ̀, kí ìtumọ̀ má bàa dín ọ̀rọ̀ Gíríìkì náà kù sí 'àṣẹ' nìkan, a pa 'oore-ọ̀fẹ́' mọ́ nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò. A pa ìṣòro ibi tí ἀπὸ μέρους ti so mọ́ mọ́ nípasẹ̀ àlàyé ìsàlẹ̀, a sì yàgò fún dídín χάρις kù sí ẹ̀kọ́ ìjọ kan pàtó.
