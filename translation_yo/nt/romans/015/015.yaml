  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ náà dáadáa: ìyàtọ̀ pẹ̀lẹ́ náà, ìgboyà afiwéra, ìkọ̀wé sí àwọn olùgbọ́, ìdí ìránnilétí, àti oore-ọ̀fẹ́ tí Ọlọ́run fún Pọ́ọ̀lù. Ṣùgbọ́n “pẹ̀lú ìgboyà díẹ̀ sí i” túmọ̀ sí ìgboyà tí ó kéré díẹ̀ sí i, kò sì fara mọ́ τολμηρότερον, èyí tí ó ń sọ ìgboyà púpọ̀ sí i. “Ní apá kan” náà kò rọrùn gẹ́gẹ́ bí ọ̀nà Yorùbá fún ἀπὸ μέρους nínú àyíká yìí.'
  naturalness: “Pẹ̀lú ìgboyà púpọ̀ sí i” àti “nípa àwọn ọ̀ràn kan” jẹ́ Yorùbá boṣewa, òde-òní, tí ó sì mọ́gbọ́n dání ju “pẹ̀lú ìgboyà díẹ̀ sí i ní apá kan” lọ. “Bí ẹni tí ń rán yín létí lẹ́ẹ̀kan sí i” jẹ́ ìṣètò tó dára, ó sì gba agbára ἐπαναμιμνῄσκων mọ́.
