id: ROM.5.12
reference: Romans 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: yo
  text: Nítorí náà, gẹ́gẹ́ bí ẹ̀ṣẹ̀ ṣe wọ ayé nípasẹ̀ ènìyàn kan, tí ikú sì wọ ayé nípasẹ̀ ẹ̀ṣẹ̀, bẹ́ẹ̀ náà ni ikú tàn dé gbogbo ènìyàn, nítorí gbogbo wọn ṣẹ̀[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀: “nínú ẹni tí gbogbo wọn ti ṣẹ̀.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí tàbí ìparí èrò tó ṣáájú hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: tipasẹ̀ ènìyàn kan
  rationale: Ó pa ipa διά pẹ̀lú ọ̀rọ̀-orúkọ oníjẹnítífù mọ́ gẹ́gẹ́ bí ọ̀nà tàbí aṣojú; “ènìyàn kan” tún bá Adamu, ọkùnrin aṣojú náà, mu láìsọ ohun tí Gíríìkì kò sọ kún un.
- source_word: ἡ ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ Pọ́ọ̀lù mu láìfikún àlàyé.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: wọ ayé
  rationale: Ó fi ìlọsí inú ayé hàn ní èdè Yorùbá àdánidá.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: tí ikú sì tipasẹ̀ ẹ̀ṣẹ̀ wọ̀ ọ́
  rationale: 'Ó pa ìfarajọ́ ọ̀rọ̀ náà mọ́: ẹ̀ṣẹ̀ wọ ayé tipasẹ̀ ènìyàn kan, ikú sì wọ ayé tipasẹ̀ ẹ̀ṣẹ̀; arọ́pò-orúkọ “ọ́” mú ohun tí a yọ sílẹ̀ nínú Gíríìkì yé kedere ní Yorùbá.'
- source_word: οὕτως
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó sọ ìbáṣepọ̀ àfiwé àti àbájáde náà ní ọ̀nà tó mọ́ ní Yorùbá.
- source_word: εἰς πάντας ἀνθρώπους
  choice: dé ọ̀dọ̀ gbogbo ènìyàn
  rationale: Ó fi ìtànkálẹ̀ dé gbogbo aráyé hàn, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ὁ θάνατος διῆλθεν
  choice: ikú tàn
  rationale: “Tàn” sọ ìlọsíwájú ikú káàkiri gbogbo ènìyàn ní ṣókí àti ní èdè àdánidá.
- source_word: ἐφ’ ᾧ
  choice: nítorí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ìtumọ̀ okùnfà ni ó ṣeé ṣe jù lọ, ṣùgbọ́n a pa ìtumọ̀ àṣà mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: πάντες ἥμαρτον
  choice: gbogbo wọn ti ṣẹ̀
  rationale: Ó sọ pé gbogbo ènìyàn ló dá ẹ̀ṣẹ̀, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti tú àkókò aorist náà.
theological_decisions:
- issue: Ìtumọ̀ ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'Okùnfà: “nítorí gbogbo wọn ti ṣẹ̀”'
  alternative: 'Aṣojú/ìṣọ̀kan: “nínú ẹni tí gbogbo wọn ti ṣẹ̀”'
  rationale: Ìtumọ̀ okùnfà bá gírámà àti àyíká ọ̀rọ̀ mu dáadáa, láìfipá mú ẹ̀kọ́ ìgbàgbọ́ kan wọ inú ẹsẹ náà. Nítorí pé ọ̀rọ̀ yìí ṣe pàtàkì nínú àríyànjiyàn nípa Adamu àti aráyé, a tọ́ka sí ìtumọ̀ àṣà mìíràn ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá tó ṣe déédé, tó ní iyì, tó sì yé òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Àmì ìdádúró gígùn ní òpin pa hàn pé gbólóhùn Pọ́ọ̀lù ń bá a lọ.
