id: ROM.5.4
reference: Romans 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: yo
  text: Ìfaradà sì ń mú ìwà tí a ti dán wò jáde[a], ìwà tí a ti dán wò sì ń mú ìrètí jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà tí a ti dán wò pé ó dúró ṣinṣin,” tàbí “ìtẹ́wọ́gbà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: ìfaradà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún fífaradà lábẹ́ ìpọ́njú láìjáwọ́; ó bá ìtẹ̀síwájú èrò inú àyíká ẹsẹ̀ náà mu.
- source_word: δοκιμή
  choice: ìwà tí a ti dán wò
  rationale: Ó fi hàn pé kì í ṣe ìwà lásán, bí kò ṣe ìwà tí ìdánwò ti fi hàn pé ó dúró ṣinṣin. Gbólóhùn yìí tún pa ààyè sílẹ̀ fún ìtumọ̀ 'ìwà tí a ti dán wò' tàbí 'ìtẹ́wọ́gbà.'
- source_word: ἐλπίς
  choice: ìrètí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìrètí; àyíká ọ̀rọ̀ Pọ́ọ̀lù ló ń fi ìgbẹ́kẹ̀lé inú rẹ̀ hàn láìní àfikún ọ̀rọ̀ míì.
- source_word: δὲ
  choice: sì
  rationale: Níbí, δέ ń so àwọn ìpele ọ̀rọ̀ náà pọ̀ ju pé ó ń fi ìtakora hàn; 'sì' jẹ́ àsopọ̀ àdánidá ní Yorùbá.
- source_word: ellipsis of κατεργάζεται
  choice: ń mú ... jáde
  rationale: Gíríìkì kò tún ọ̀rọ̀-ìṣe inú ẹsẹ̀ tó ṣáájú sọ, ṣùgbọ́n Yorùbá nílò rẹ̀ kí ìtẹ̀síwájú náà lè ṣe kedere. 'Ń mú ... jáde' sọ ìbáṣepọ̀ èsì yẹn ní èdè àdánidá.
theological_decisions:
- issue: Ìtumọ̀ δοκιμή nínú ìtẹ̀síwájú láti inú ìfaradà sí ìrètí
  choice: Ìwà tí ìdánwò ti fi hàn pé ó dúró ṣinṣin
  alternative: Ìlànà ìdánwò fúnra rẹ̀, tàbí ìtẹ́wọ́gbà
  rationale: Nínú ọ̀wọ́ èrò yìí, δοκιμή dà bí èsì ìfaradà, kì í ṣe ìṣẹ̀lẹ̀ ìdánwò fúnra rẹ̀. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí àwọn ìtumọ̀ míì láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtúmọ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àtúnṣe ọ̀rọ̀ inú Gíríìkì mọ́ nípasẹ̀ lílo àsopọ̀ 'sì' àti ọ̀rọ̀-ìṣe kan náà ní ẹ̀ẹ̀mejì.
