id: ROM.5.16
reference: Romans 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: yo
  text: Ẹ̀bùn náà kò sì dà bí ohun tí ó wá nípasẹ̀ ẹni kan tí ó ṣẹ̀[a]. Nítorí ìdájọ́ tí ó wá láti inú ìrékọjá kan yọrí sí ìdálẹ́bi[b], ṣùgbọ́n ẹ̀bùn oore-ọ̀fẹ́ tí ó wá láti inú ọ̀pọ̀ ìrékọjá yọrí sí ìdáláre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀bùn náà kò dà bí ohun tí ó wá nípasẹ̀ ọkùnrin kan tí ó ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti inú ẹ̀ṣẹ̀ kan.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “yọrí sí ìdájọ́ pé olódodo ni” tàbí “yọrí sí ìdásílẹ̀ láìlẹ́bi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: ẹ̀bùn náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a fi fúnni gẹ́gẹ́ bí ẹ̀bùn; ‘ẹ̀bùn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi ìtumọ̀ míì kún un.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: nípasẹ̀ ẹni kan tí ó ṣẹ̀
  rationale: Èyí pa ìtọ́ka sí ẹni náà mọ́, ó sì tẹ̀ lé ìsọ̀rọ̀ Gíríìkì tí kò sọ ohun tí ó wá nípasẹ̀ rẹ̀ ní kíkún. ‘Ẹni’ jẹ́ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ń tọ́ka sí Ádámù.
- source_word: κρίμα
  choice: ìdájọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, κρίμα jẹ́ ìpinnu ilé-ẹjọ́; ‘ìdájọ́’ ṣe àfihàn èyí ní kedere.
- source_word: ἐξ ἑνὸς
  choice: láti inú ìrékọjá kan
  rationale: ἑνός lè tọ́ka sí ìrékọjá kan, pàápàá nítorí àtakò rẹ̀ pẹ̀lú ‘ọ̀pọ̀ ìrékọjá’ ní apá kejì gbólóhùn náà. A fi ‘ìrékọjá’ kún un láti jẹ́ kí Yorùbá yéni.
- source_word: κατάκριμα
  choice: ìdálẹ́bi
  rationale: Ọ̀rọ̀ náà jẹ́ ìdájọ́ tí ó sọ ẹni di ẹlẹ́bi; ‘ìdálẹ́bi’ bá àtakò ti òfin nínú ẹsẹ yìí mu.
- source_word: χάρισμα
  choice: ẹ̀bùn oore-ọ̀fẹ́
  rationale: χάρισμα tẹnumọ́ ẹ̀bùn tí ó ti inú oore-ọ̀fẹ́ wá. Ìtumọ̀ yìí tún yà á sọ́tọ̀ díẹ̀ sí δώρημα tó wà ní ìbẹ̀rẹ̀ ẹsẹ náà.
- source_word: παραπτωμάτων
  choice: ìrékọjá
  rationale: παράπτωμα ń tọ́ka sí ìṣìnà tàbí rírú ohun tí ó tọ́; ‘ìrékọjá’ pa ìtumọ̀ ìwà àti ti òfin náà mọ́.
- source_word: δικαίωμα
  choice: ìdáláre
  rationale: Nínú àtakò pẹ̀lú κατάκριμα, ọ̀rọ̀ náà ń tọ́ka sí àbájáde ìdájọ́ tí ó lòdì sí ìdálẹ́bi. ‘Ìdáláre’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún èrò yìí, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ‘ìdájọ́ pé olódodo ni’ tún ṣeé ṣe.
theological_decisions:
- issue: Agbára ti òfin nínú δικαίωμα ní àtakò pẹ̀lú κατάκριμα
  choice: A tú δικαίωμα sí ‘ìdáláre,’ gẹ́gẹ́ bí àbájáde ìdájọ́ tí ó lòdì sí ìdálẹ́bi.
  alternative: ‘ìdájọ́ pé olódodo ni’ tàbí ‘ìdásílẹ̀ láìlẹ́bi’
  rationale: Ìṣètò ẹsẹ náà fi ìdájọ́ àti ìdálẹ́bi ṣe àtakò sí ẹ̀bùn oore-ọ̀fẹ́ àti δικαίωμα. ‘Ìdáláre’ mú àtakò ti òfin yìí jáde ní Yorùbá, láìkọ ìtumọ̀ ìpinnu ilé-ẹjọ́ tí ọ̀rọ̀ náà tún lè ní sílẹ̀.
translation_notes:
  register: A lo Yorùbá àtijọ́-tuntun tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé lásán. ‘Kò dà bí,’ ‘yọrí sí,’ àti ‘láti inú’ jẹ́ àwọn ìsọ̀rọ̀ àdánidá; àwọn ọ̀rọ̀ bí ‘ìdálẹ́bi’ àti ‘ìdáláre’ sì pa àwòrán ilé-ẹjọ́ inú Gíríìkì mọ́. A fi àmì ohùn sí ibi tí ó yẹ ká sì yẹra fún ṣíṣe àlàyé Ádámù sínú ọ̀rọ̀ níbi tí Gíríìkì ti sọ ọ́ ní ṣókí.
