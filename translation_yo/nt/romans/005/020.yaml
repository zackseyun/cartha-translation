revisions:
- from: Òfin sì wọlé sí àárín[a], kí ìrékọjá náà lè pọ̀ sí i[b]; ṣùgbọ́n níbi tí ẹ̀ṣẹ̀ ti pọ̀ sí i, oore-ọ̀fẹ́ sì túbọ̀ pọ̀ rékọjá ààlà[c],
  to: Òfin sì wọlé gẹ́gẹ́ bí àfikún[a], kí ìrékọjá náà lè pọ̀ sí i[b]; ṣùgbọ́n níbi tí ẹ̀ṣẹ̀ ti pọ̀ sí i, oore-ọ̀fẹ́ sì pọ̀ ju bẹ́ẹ̀ lọ lọ́pọ̀lọpọ̀[c],
  rationale: “gẹ́gẹ́ bí àfikún” replaces the misleading spatial phrase “sí àárín” and directly expresses entry in addition. The final clause is recast in idiomatic Yoruba to convey the Greek verb’s intensified abundance without adding an unsupported image of crossing a boundary. The sentence-final comma is retained because the Greek verse continues into the following verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the main contrasts and preserves the purpose force of ἵνα with “kí ... lè.” However, “wọlé sí àárín” means entering into the middle, rather than entering alongside/in addition, and “túbọ̀ pọ̀ rékọjá ààlà” is syntactically awkward and introduces an explicit boundary image not required by ὑπερεπερίσσευσεν.
  naturalness: 'The revised wording uses natural Standard Yoruba while retaining the heightened comparison: grace increased far more than sin. Full tone marks are supplied where applicable.'
  terminology: “Òfin,” “ìrékọjá,” “ẹ̀ṣẹ̀,” and “oore-ọ̀fẹ́” are suitable renderings in this Pauline context. “gẹ́gẹ́ bí àfikún” accurately conveys the para- nuance of παρεισῆλθεν without implying a physical location.
  issues:
  - severity: medium
    issue: “wọlé sí àárín” renders spatial entry into a middle.
    rationale: παρεισῆλθεν denotes entering alongside or in addition; it does not mean entering into the midst of something.
  - severity: medium
    issue: “túbọ̀ pọ̀ rékọjá ààlà” is awkward and over-specifies the metaphor.
    rationale: The Greek intensifies abundance, but does not explicitly mention crossing a boundary. “pọ̀ ju bẹ́ẹ̀ lọ lọ́pọ̀lọpọ̀” naturally retains the emphatic comparative force.
