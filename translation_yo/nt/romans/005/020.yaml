id: ROM.5.20
reference: Romans 5:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: yo
  text: Òfin sì wọlé gẹ́gẹ́ bí àfikún[a], kí ìrékọjá náà lè pọ̀ sí i[b]; ṣùgbọ́n níbi tí ẹ̀ṣẹ̀ ti pọ̀ sí i, oore-ọ̀fẹ́ sì pọ̀ ju bẹ́ẹ̀ lọ lọ́pọ̀lọpọ̀[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọlé,” tàbí “yọ́ wọlé”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí wíwọlé lẹ́gbẹ̀ẹ́ ohun mìíràn tàbí gẹ́gẹ́ bí àfikún.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìrúfin náà,” tàbí “ìṣìnà náà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “oore-ọ̀fẹ́ sì pọ̀ lọ́pọ̀lọpọ̀ ju bẹ́ẹ̀ lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: òfin
  rationale: Ọ̀rọ̀ náà tọ́ka sí Òfin Mósè nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù; ‘òfin’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì nílò àfikún ‘Mósè’ tí kò sí nínú ẹsẹ yìí.
- source_word: παρεισῆλθεν
  choice: wọlé sí àárín
  rationale: Ó pa ìtumọ̀ wíwọlé lẹ́gbẹ̀ẹ́ tàbí gẹ́gẹ́ bí ohun àfikún mọ́, dípò kí a sọ pé ó kàn ‘dé’ lásán.
- source_word: ἵνα πλεονάσῃ
  choice: kí ... lè pọ̀ sí i
  rationale: Ìṣètò yìí pa agbára gbólóhùn ète ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́fẹ́ mọ́, láìsọ ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà di ohun míì.
- source_word: τὸ παράπτωμα
  choice: ìrékọjá náà
  rationale: ‘Ìrékọjá’ fi hàn pé a kọjá ààlà tàbí àṣẹ kan, ó sì bá ìtumọ̀ ẹ̀ṣẹ̀ pàtó tàbí ìṣìnà mu.
- source_word: οὗ
  choice: níbi tí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi sọ ìbáṣepọ̀ adverbial ‘where’ nínú ìfiwéra yìí.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún ἁμαρτία nínú ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: ὑπερεπερίσσευσεν
  choice: túbọ̀ pọ̀ rékọjá ààlà
  rationale: 'Gbólóhùn náà mú ìtẹnumọ́ inú ọ̀rọ̀-ìṣe àkójọpọ̀ Gíríìkì jáde: kì í ṣe pé ó pọ̀ lásán, ṣùgbọ́n ó pọ̀ débi pé ó rékọjá ààlà.'
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún χάρις, ó sì mú ìtumọ̀ ẹ̀bùn inú rere Ọlọ́run jáde.
theological_decisions:
- issue: Bóyá kí ἵνα jẹ́ gbólóhùn ète tàbí kí a rọ̀ ọ́ di àbájáde nítorí ìṣòro ẹ̀kọ́ ìgbàgbọ́ tó lè dà bí ẹni pé Ọlọ́run fẹ́ràn ẹ̀ṣẹ̀.
  choice: kí ìrékọjá náà lè pọ̀ sí i
  alternative: tí ó sì yọrí sí pé ìrékọjá náà pọ̀ sí i
  rationale: Gíríìkì lo ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́fẹ́ ní kedere. Ìtumọ̀ náà pa agbára ète mọ́, láìfi kún un pé Ọlọ́run fọwọ́ sí ẹ̀ṣẹ̀ tàbí láìyanjú ìforígbárí ọ̀rọ̀ Pọ́ọ̀lù ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀ tó ṣeé lóye fún òǹkàwé òde òní. ‘Sì’ ní ìbẹ̀rẹ̀ ń gbé δέ gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀, láìfi ọ̀rọ̀ àkókò bí ‘nísinsin yìí’ kún un. A pa àmì ìdákẹ́jẹ ìkẹyìn mọ́ gẹ́gẹ́ bí apá kan nínú gbólóhùn tó ń tẹ̀ síwájú.
