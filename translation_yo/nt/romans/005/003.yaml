  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: yo
  text: Kì í ṣe ìyẹn nìkan, ṣùgbọ́n a tún ń yọ̀[a] nínú àwọn ìpọ́njú[b], níwọ̀n bí a ti mọ̀ pé ìpọ́njú ń mú ìfaradà[c] wá,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “a tún ń ṣògo” tàbí “a ń yọ̀ gidigidi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ìnira” tàbí “àwọn ìjìyà.”
