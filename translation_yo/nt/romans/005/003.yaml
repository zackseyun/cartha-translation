lexical_decisions:
- source_word: καυχώμεθα
  choice: a tún ń yọ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ṣíṣògo, ṣùgbọ́n ní àyíká ọ̀rọ̀ yìí ó ń fi ayọ̀ àti ìgboyà tí ó dá lórí iṣẹ́ Ọlọ́run hàn, kì í ṣe ìgbéraga ẹni. “Ń yọ̀” jẹ́ èdè Yorùbá àdánidá, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ míì mọ́.
- source_word: θλίψεσιν / θλῖψις
  choice: àwọn ìpọ́njú / ìpọ́njú
  rationale: “Ìpọ́njú” mú èrò ìkìmọ́lẹ̀, ìnira àti ìjìyà inú ọ̀rọ̀ Gíríìkì jáde. A pa ìyípadà láti ọ̀pọ̀ nínú gbólóhùn àkọ́kọ́ sí ẹyọ kan nínú òfin gbogbogbò mọ́.
- source_word: ὑπομονήν
  choice: ìfaradà
  rationale: “Ìfaradà” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún agbára láti dúró ṣinṣin lábẹ́ ìnira, láìjáwọ́.
- source_word: κατεργάζεται
  choice: ń mú ... wá
  rationale: Gbólóhùn yìí sọ àbájáde tí ìpọ́njú ń mú jáde ní èdè Yorùbá àdánidá.
- source_word: εἰδότες
  choice: ní mímọ̀ pé
  rationale: Èyí pa ìrísí ọ̀rọ̀ aláṣepọ̀ Gíríìkì mọ́, ó sì so ìmọ̀ náà mọ́ ayọ̀ tí gbólóhùn pàtàkì sọ láìfi ìtumọ̀ mìíràn kún un.
theological_decisions:
- issue: Ìtumọ̀ καυχώμεθα ní àyíká ẹ̀mí rere
  choice: Ayọ̀ àti ìgboyà tí ó dojú kọ iṣẹ́ Ọlọ́run
  alternative: Ṣíṣògo tàbí ṣíṣekára ayọ̀ ńlá
  rationale: Àríyànjiyàn Pọ́ọ̀lù dá lórí ohun tí ìpọ́njú ń mú jáde, kì í ṣe ìgbéraga ara ẹni. “Ń yọ̀” fi èyí hàn ní èdè Yorùbá òde òní, àlàyé ìsàlẹ̀ sì jẹ́ kí agbára ọ̀rọ̀ “ṣògo” wà ní gbangba.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó ní àmì ohùn ní kíkún, ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. A pa koma ìparí mọ́ nítorí ẹsẹ yìí ń bá ìrònú náà lọ sí ẹsẹ tó tẹ̀ lé e.
