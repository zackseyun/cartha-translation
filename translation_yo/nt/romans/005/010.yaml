id: ROM.5.10
reference: Romans 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: yo
  text: Nítorí bí a ti bá Ọlọ́run làjà nípasẹ̀ ikú Ọmọ rẹ̀ nígbà tí a jẹ́ ọ̀tá rẹ̀, mélòómélòó ni a ó rí ìgbàlà nípasẹ̀ ìyè Ọmọ náà, ní báyìí tí a ti bá a làjà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ó rí ìgbàlà nínú ìyè Ọmọ náà.”
    reason: Ó pa ìtumọ̀ ibi tàbí ìṣọ̀kan tí ἐν τῇ ζωῇ αὐτοῦ lè ní mọ́.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” so ẹsẹ̀ yìí mọ́ àríyànjiyàn tó ṣáájú, “bí” sì pa ìrísí gbólóhùn oní条件 Greek mọ́, bó tilẹ̀ jẹ́ pé ohun tí Paulu sọ jẹ́ òtítọ́ tí ó ti ṣẹlẹ̀.
- source_word: ἐχθροὶ ὄντες
  choice: nígbà tí a jẹ́ ọ̀tá rẹ̀
  rationale: Ó sọ ipò ìbáṣepọ̀ wọn pẹ̀lú Ọlọ́run ṣáájú ìlàjà ní èdè Yorùbá tó ṣe kedere, láì dín “ἐχθροί” kù sí ìmọ̀lára ọ̀tá nìkan.
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: a bá Ọlọ́run làjà
  rationale: “Bá … làjà” jẹ́ ọ̀nà àdánidá láti sọ ìmúpadàbọ̀ ìbáṣepọ̀; ó pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tí ìlàjà náà wà pẹ̀lú rẹ̀.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: nípasẹ̀ ikú Ọmọ rẹ̀
  rationale: “Nípasẹ̀” fi ipa διά gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò hàn, “Ọmọ rẹ̀” sì pa ìbátan Ọmọ sí Ọlọ́run mọ́ láìfikún àlàyé.
- source_word: πολλῷ μᾶλλον
  choice: mélòómélòó ni
  rationale: Ọ̀rọ̀ Yorùbá yìí fi agbára àríyànjiyàn láti ohun tó tóbi sí ohun tó dájú jù hàn lọ́nà àdánidá.
- source_word: καταλλαγέντες
  choice: ní báyìí tí a ti bá a làjà
  rationale: Ó fi hàn pé ìlàjà ti ṣẹlẹ̀ ṣáájú ìgbàlà ọjọ́ iwájú, gẹ́gẹ́ bí aorist participle ṣe ń ṣiṣẹ́.
- source_word: σωθησόμεθα
  choice: Ọlọ́run yóò gba wa là
  rationale: Yorùbá kò ní passive tó bá Greek mu ní kíkún láìdi àjèjì; lílo Ọlọ́run gẹ́gẹ́ bí olùṣe tí àyíká ọ̀rọ̀ tọ́ka sí jẹ́ kedere, ó sì pa ìtumọ̀ ọjọ́ iwájú mọ́.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: nípasẹ̀ ìyè Ọmọ náà
  rationale: A mú ἐν ní ìtumọ̀ ohun èlò nínú ọ̀rọ̀ àkọ́kọ́, ní ìbámu pẹ̀lú ìyàtọ̀ ikú/ìyè; “Ọmọ náà” yọ ìṣiyèméjì ti àsọyé Yorùbá “rẹ̀” kúrò nípa ẹni tí ìyè náà jẹ́.
theological_decisions:
- issue: Agbára ἐν τῇ ζωῇ αὐτοῦ
  choice: 'ohun èlò: “nípasẹ̀ ìyè Ọmọ náà”'
  alternative: 'ibi tàbí ìṣọ̀kan: “nínú ìyè Ọmọ náà”'
  rationale: Ìfiwéra pẹ̀lú “nípasẹ̀ ikú Ọmọ rẹ̀” ń ṣètìlẹ́yìn fún ìtumọ̀ ohun èlò, ṣùgbọ́n ἐν lè ní ìtumọ̀ “nínú”; a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀ láìyanjú ìfẹ̀sẹ̀mulẹ̀ ẹ̀kọ́ ìgbàgbọ́ kan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “bá … làjà” fún ìlàjà, “mélòómélòó ni” fún àfikún agbára àríyànjiyàn, a sì tún “Ọlọ́run” àti “Ọmọ náà” sọ láti yàgò fún àìmọ̀ ẹni tí àwọn arọ́pò-orúkọ ń tọ́ka sí.
