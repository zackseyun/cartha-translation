  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú àwọn èrò pàtàkì Gíríìkì náà jáde dáadáa: Kristi ni ọ̀nà náà, ìgbàgbọ́ ni ọ̀nà ìwọlé, oore-ọ̀fẹ́ ni ipò tí àwọn onígbàgbọ́ dúró nínú rẹ̀, ìṣògo náà sì wà nínú ìrètí ògo Ọlọ́run. Síbẹ̀, “ti rí ọ̀nà wọ inú” tú προσαγωγή gẹ́gẹ́ bí wíwá ọ̀nà, dípò ìwọlé/ààyè ìwọlé tí a ti fún wọn.'
