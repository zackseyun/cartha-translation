id: ROM.5.2
reference: Romans 5:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: yo
  text: Nípasẹ̀ ẹni tí àwa náà ti ní ààyè láti wọ inú oore-ọ̀fẹ́ yìí nípa ìgbàgbọ́, nínú èyí tí a dúró; a sì ń ṣògo[a] nínú ìrètí ògo Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “a ń yọ̀” tàbí “a ń yọ̀ gidigidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: ọ̀nà wọ inú
  rationale: Ó fi èrò wíwọlé tàbí jíjẹ́ kí ènìyàn dé inú ipò oore-ọ̀fẹ́ hàn ní Yorùbá àdánidá, láì dín un kù sí ìmọ̀ ojú-ọ̀nà lásán.
- source_word: πίστει
  choice: nípa ìgbàgbọ́
  rationale: Dative náà ní agbára ohun èlò; ‘nípa ìgbàgbọ́’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ‘by/through faith.’
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó dúró ṣinṣin fún χάρις nínú àyíká Pauline, ó sì tọ́ka sí inú-rere Ọlọ́run tí a kò tọ́ sí.
- source_word: ἑστήκαμεν
  choice: a dúró
  rationale: Perfect náà sọ ipò tí ó bẹ̀rẹ̀ tẹ́lẹ̀ tí ó sì ń bá a lọ; ‘a dúró’ mú ipò ìsinsìnyí náà jáde ní ṣókí.
- source_word: καυχώμεθα
  choice: a ń ṣògo
  rationale: ‘Ṣògo’ pa agbára ọ̀rọ̀ ìṣògo onígboyà mọ́, dípò yíyí rẹ̀ padà sí ayọ̀ nìkan; akọsilẹ̀ fi àwọn ìtumọ̀ àyíká míì hàn.
- source_word: ἐπ’ ἐλπίδι
  choice: nínú ìrètí
  rationale: Ó jẹ́ Yorùbá àdánidá tí ó pa ìrètí mọ́ gẹ́gẹ́ bí ààyè tàbí ìpìlẹ̀ ìṣògo náà.
- source_word: δόξης τοῦ θεοῦ
  choice: ògo Ọlọ́run
  rationale: Ó tú genitive náà ní tààrà, ó sì pa ohùn ọ̀wọ̀ àti ọlá ti Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe máa tú καυχώμεθα láì mú ìforígbárí èrò Pọ́ọ̀lù kúrò
  choice: a ń ṣògo
  alternative: a ń yọ̀ / a ń ṣe ayẹyẹ pẹ̀lú ayọ̀ ńlá
  rationale: ‘A ń ṣògo’ pa agbára ìlò Pọ́ọ̀lù mọ́, níbi tí ìṣògo kò gbára lé ara ẹni bí kò ṣe ìrètí ògo Ọlọ́run. Àwọn yíyan míì rọrùn sí etí ṣùgbọ́n wọ́n lè rọ agbára ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọ ‘àwa’ lẹ́yìn ‘ẹni tí’ ń ṣàfihàn καὶ (pẹ̀lú), nígbà tí ‘a’ tó tẹ̀ lé jẹ́ kí gbolohun náà ṣàn lọ́nà Yorùbá àdánidá. Ohùn náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba.
