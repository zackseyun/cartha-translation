id: ROM.5.21
reference: Romans 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: yo
  text: kí, gẹ́gẹ́ bí ẹ̀ṣẹ̀ ti jọba nínú ikú, bẹ́ẹ̀ náà ni oore-ọ̀fẹ́ lè jọba nípasẹ̀ òdodo[a] sí ìyè àìnípẹ̀kun nípasẹ̀ Jésù Mèsáyà, Olúwa wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ó lè rí bẹ́ẹ̀ pé
  rationale: Ó fi ète tàbí àbájáde tí ἵνα àti ọ̀rọ̀-ìṣe abẹ́-ìfẹ́ tí ó tẹ̀ lé e hàn, ó sì jẹ́ ọ̀nà àdánidá láti so ẹsẹ yìí mọ́ èrò tí ó ṣáájú.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: ti jọba / lè jọba
  rationale: Ó pa àwòrán ìjọba tí Paulu lò mọ́, ó sì fi ìyàtọ̀ láàárín àkókò-ìṣe àtọ́ka àti ọ̀rọ̀-ìṣe abẹ́-ìfẹ́ hàn.
- source_word: ἐν τῷ θανάτῳ
  choice: nínú ikú
  rationale: ‘Nínú’ pa ìtumọ̀ ἐν gẹ́gẹ́ bí agbègbè tàbí ipò tí ẹ̀ṣẹ̀ ti jọba mọ́, láì sọ ọ́ di ọ̀nà-ìṣe ní dandan.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún χάρις, ó sì gba àpèjúwe rẹ̀ gẹ́gẹ́ bí ẹni tí ń jọba láàyè.
- source_word: διὰ δικαιοσύνης
  choice: nípasẹ̀ òdodo
  rationale: ‘Nípasẹ̀’ fi διά pẹ̀lú ọ̀rọ̀ inú ẹ̀ka ohun-ìní hàn gẹ́gẹ́ bí ọ̀nà; ‘òdodo’ sì pa ìtumọ̀ ìbáṣepọ̀ tó tọ́ àti ìdájọ́ tó tọ́ mọ́.
- source_word: εἰς ζωὴν αἰώνιον
  choice: kí ó sì yọrí sí ìyè àìnípẹ̀kun
  rationale: Ó sọ agbára ìtọ́sọ́nà tàbí àbájáde inú εἰς di Yorùbá àdánidá, láì dín ìyè àìnípẹ̀kun kù sí ipò kan ṣoṣo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè níbí; ‘Mèsáyà’ mú ìtumọ̀ ẹni tí a fòróró yàn hàn dípò kí ó dà bí orúkọ kejì lásán.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún κύριος àti arọ́pò-orúkọ ohun-ìní náà.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ọ̀rọ̀ Paulu
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ gba ìtumọ̀ fífi ènìyàn sí ipò tó tọ́ àti ìwà tàbí ìṣe tó tọ́; àlàyé ìsàlẹ̀ pa apá ìdájọ́ ododo rẹ̀ mọ́ láì fi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
- issue: Bí a ṣe máa túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè Jésù; ‘Mèsáyà’ jẹ́ kí iṣẹ́ oyè náà ṣe kedere.
- issue: Ìbáṣepọ̀ oore-ọ̀fẹ́, òdodo, àti ìyè
  choice: oore-ọ̀fẹ́ jọba nípasẹ̀ òdodo, ó sì yọrí sí ìyè àìnípẹ̀kun
  alternative: oore-ọ̀fẹ́ jọba nítorí òdodo láti fúnni ní ìyè àìnípẹ̀kun
  rationale: Àṣàyàn náà pa διά mọ́ gẹ́gẹ́ bí ọ̀nà àti εἰς gẹ́gẹ́ bí ìtọ́sọ́nà tàbí àbájáde, láì pinnu ju Gíríìkì lọ nípa ẹni tí òdodo náà jẹ́ tàbí irú ìbáṣepọ̀ ìdí tí ó ní.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àṣàyàn ọ̀rọ̀ jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán ìjọba ẹ̀ṣẹ̀ àti oore-ọ̀fẹ́ mọ́.
