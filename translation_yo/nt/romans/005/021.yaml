  source_fidelity: Ìtumọ̀ náà pa ìfiwéra ẹ̀ṣẹ̀ àti oore-ọ̀fẹ́, àwòrán ìjọba, ‘nípasẹ̀ òdodo,’ àti ìparí nípasẹ̀ Jésù Mèsáyà mọ́ dáadáa. Síbẹ̀, ‘kí ó lè rí bẹ́ẹ̀ pé’ kì í ṣe ọ̀nà Yorùbá tó rọrùn láti gbé ἵνα kalẹ̀, ó sì ń fi ọ̀rọ̀ àfikún kún un. Bákan náà, ‘kí ó sì yọrí sí’ tú εἰς sí àbájáde tí ó ṣe kedere ju gbolohun Gíríìkì lọ; ‘sí ìyè àìnípẹ̀kun’ pa agbára ìtọ́sọ́nà rẹ̀ mọ́ dáadáa.
