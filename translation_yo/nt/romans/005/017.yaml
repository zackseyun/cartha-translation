id: ROM.5.17
reference: Romans 5:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: yo
  text: Nítorí bí ikú bá ti jọba nípasẹ̀ ẹni kan náà nítorí ìrékọjá ẹni kan náà, ó kù sí mélòómélòó, àwọn tí ń gba ìpọ̀lọpọ̀ oore-ọ̀fẹ́ àti ẹ̀bùn òdodo[a] yóò jọba nínú ìyè nípasẹ̀ ẹni kan náà, Jésù Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀bùn ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Jésù Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: ìrékọjá
  rationale: Ó túmọ̀ sí fífi ẹsẹ̀ ṣìnà tàbí rú ohun tí ó tọ́; “ìrékọjá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, ó sì bá ìyàtọ̀ Ádámù àti Kristi mu.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: jẹ ọba / yóò jẹ ọba
  rationale: Ó pa àwòrán ìṣàkóso ọba mọ́, ó sì mú ìfiwéra láàárín ikú àti àwọn olùgba ẹ̀bùn hàn.
- source_word: περισσείαν
  choice: ọ̀pọ̀lọpọ̀
  rationale: Ó sọ ìwọ̀n tí ó pọ̀ rékọjá di Yorùbá àdánidá láì sọ ọ̀rọ̀ náà di àlàyé gígùn.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ojú rere àti ẹ̀bùn Ọlọ́run tí a kò tọ́ sí.
- source_word: δωρεᾶς
  choice: ẹ̀bùn
  rationale: Ó jẹ́ ìtumọ̀ tààrà, oore-ọ̀fẹ́ tó wà lẹ́gbẹ̀ẹ́ rẹ̀ sì ti fi hàn pé kì í ṣe ohun tí a rà.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” jẹ́ ìtumọ̀ tó gbòòrò, tó sì bá àyíká ìdáláre inú Róòmù 5 mu; a pa “ìdájọ́ òdodo” mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- source_word: λαμβάνοντες
  choice: àwọn tí ń gba
  rationale: Ìṣe aláìparí náà ṣàpèjúwe àwọn ẹni tí gbígba jẹ́ àmì wọn; “tí ń gba” pa ìrísí yìí mọ́.
- source_word: ἐν ζωῇ
  choice: nínú ìyè
  rationale: Ó pa gbólóhùn Gíríìkì kúkúrú àti ìyàtọ̀ rẹ̀ sí ìṣàkóso ikú mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè ẹni àmì òróró; “Mèsáyà” mú agbára oyè náà hàn ní Yorùbá, bí ó tilẹ̀ jẹ́ pé “Jésù Kristi” tún wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνης nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: ẹ̀bùn òdodo
  alternative: ẹ̀bùn ìdájọ́ òdodo
  rationale: “Òdodo” bá ọ̀rọ̀ ìdáláre tó yí ẹsẹ yìí ká mu, ṣùgbọ́n δικαιοσύνη tún lè tọ́ka sí ìdájọ́ tàbí ètò tó tọ́; àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- issue: Ìtumọ̀ Χριστοῦ lẹ́yìn Ἰησοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: A yan “Mèsáyà” láti mú oyè ẹni àmì òróró hàn, ṣùgbọ́n a jẹ́wọ́ pé àkójọpọ̀ náà lè ṣiṣẹ́ bí orúkọ tí ó ti fẹsẹ̀ mú, “Jésù Kristi.”
- issue: Ẹni kan náà nínú àríyànjiyàn Ádámù àti Jésù
  choice: pa “ẹni kan náà” mọ́ ní ibi méjèèjì
  alternative: sọ ẹni àkọ́kọ́ ní Ádámù ní kedere
  rationale: Gíríìkì kò dárúkọ Ádámù nínú ẹsẹ yìí, bí àyíká tilẹ̀ fi hàn pé òun ni; pípa ọ̀rọ̀ náà mọ́ kò jẹ́ kí ìtumọ̀ ṣàlàyé ohun tí orísun fi sí àyíká.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A tún ètò gbólóhùn ṣe díẹ̀ fún ìṣàn Yorùbá, ṣùgbọ́n a pa àwòrán jíjẹ ọba, ìfiwéra “mélòómélòó,” àti àìdánilójú àwọn ọ̀rọ̀ pàtàkì mọ́.
