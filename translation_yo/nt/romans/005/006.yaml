id: ROM.5.6
reference: Romans 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: yo
  text: Nítorí pé nígbà tí àwa ṣì jẹ́ aláìlágbára, ní àkókò tí ó yẹ, Mèsáyà kú fún[a] àwọn aláìbọ̀wọ̀ fún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ire àwọn aláìbọ̀wọ̀ fún Ọlọ́run.”
    reason: Ọ̀rọ̀ Gíríìkì ὑπὲρ lè tẹnu mọ́ pé ikú náà jẹ́ fún ànfààní wọn; “fún” nínú àyọkà pàtàkì pa ìtumọ̀ náà mọ́ ní ṣókí.
lexical_decisions:
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A tú orúkọ oyè náà sí “Mèsáyà” dípò lílo àkọsílẹ̀ ohùn “Kristi,” nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè níhìn-ín.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: nígbà tí àwa ṣì jẹ́ aláìlágbára
  rationale: Gbólóhùn genitive absolute náà di gbólóhùn àkókò ní Yorùbá àdánidá. “Aláìlágbára” fi àìlera tàbí àìní agbára ènìyàn hàn láìfi kún un pé àìsàn ara nìkan ni tàbí láìsọ ọ́ di ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
- source_word: ἔτι
  choice: ṣì
  rationale: “Ṣì” fi hàn pé ipò àìlágbára náà ń bá a lọ. Ìtumọ̀ Yorùbá àdánidá kò nílò kí a tún ọ̀rọ̀ náà sọ lẹ́ẹ̀mejì bí ìtòlẹ́sẹẹsẹ Gíríìkì ṣe jẹ́.
- source_word: κατὰ καιρὸν
  choice: ní àkókò tí ó yẹ
  rationale: Ó pa ìtumọ̀ àkókò tí ó bá a mu tàbí tí a yàn mọ́, láìsọ ní pàtó ju ohun tí Gíríìkì sọ lọ pé ta ni ó yan àkókò náà.
- source_word: ὑπὲρ
  choice: fún
  rationale: “Fún” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere tí ó sì lè gba ìtumọ̀ pé ikú náà wá fún ànfààní wọn tàbí ní ipò aṣojú wọn, láìyan ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
- source_word: ἀσεβῶν
  choice: àwọn aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: Àpèjúwe yìí sọ ìtumọ̀ ìwà àìní ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run ní èdè òde òní tí òǹkàwé Yorùbá lè lóye.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Ọ̀rọ̀-ìṣe aorist náà túmọ̀ sí “kú” ní tààrà, kò sì nílò àfikún.
theological_decisions:
- issue: Agbára ὑπὲρ nínú ọ̀rọ̀ nípa ikú Mèsáyà
  choice: fún àwọn aláìbọ̀wọ̀ fún Ọlọ́run
  alternative: nítorí ire àwọn aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: “Fún” pa òtítọ́ mọ́ pé ikú Mèsáyà jẹ́ fún ànfààní àwọn aláìbọ̀wọ̀ fún Ọlọ́run, ó sì jẹ́ kí ààyè wà fún ìtumọ̀ aṣojú tàbí àròpò láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé ọ̀rọ̀ Gíríìkì lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “àwa” láti mú ἡμῶν hàn gbangba, a sì lo “Mèsáyà” gẹ́gẹ́ bí orúkọ oyè.
