reference: Romans 5:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí nípasẹ̀ àìgbọ́ràn ọkùnrin kan ṣoṣo ni a ṣe sọ àwọn ọ̀pọ̀ ènìyàn di ẹlẹ́ṣẹ̀[a], bẹ́ẹ̀ náà nípasẹ̀ ìgbọ́ràn ọkùnrin kan ṣoṣo[b] ni a ó ṣe sọ àwọn ọ̀pọ̀ ènìyàn di olódodo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a fi àwọn ọ̀pọ̀ ènìyàn sí ipò ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “nípasẹ̀ ìgbọ́ràn ẹni kan ṣoṣo”; a pèsè “ọkùnrin” fún ìfararọ̀ pẹ̀lú abala àkọ́kọ́.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a ó fi àwọn ọ̀pọ̀ ènìyàn sí ipò olódodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: àìgbọ́ràn
  rationale: Ó túmọ̀ sí kí ènìyàn má ṣe gbọ́ràn; ó sì dá ìtakora rẹ̀ pẹ̀lú ὑπακοή mọ́.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ọkùnrin kan ṣoṣo
  rationale: Ó fi hàn pé ọkùnrin kan ni Pọ́ọ̀lù ń tọ́ka sí, ìyẹn Adamu nínú àyíká ọ̀rọ̀, láìfi orúkọ tí kò sí nínú ẹsẹ yìí kún un.
- source_word: ἁμαρτωλοὶ
  choice: ẹlẹ́ṣẹ̀
  rationale: Àjẹtífù náà ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ tàbí ipò àwọn ènìyàn; ‘ẹlẹ́ṣẹ̀’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: κατεστάθησαν
  choice: sọ … di
  rationale: Ó sọ nípa fífi àwọn ènìyàn sí ipò kan. ‘Sọ … di’ jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó lé ọ̀rọ̀ náà lórí.
- source_word: οἱ πολλοί
  choice: àwọn ọ̀pọ̀ ènìyàn
  rationale: Ó pa àfihàn ọ̀pọ̀ ènìyàn tí ó ní arítíkù mọ́, láìtú u sí ‘gbogbo ènìyàn’.
- source_word: ὑπακοῆς
  choice: ìgbọ́ràn
  rationale: Èyí ni ìtumọ̀ àdánidá tó sì pa ìtakora rẹ̀ pẹ̀lú àìgbọ́ràn mọ́.
- source_word: τοῦ ἑνὸς
  choice: ẹni kan ṣoṣo
  rationale: Gíríìkì kò tún ἀνθρώπου, ‘ọkùnrin,’ sọ ní abala kejì; ‘ẹni kan ṣoṣo’ pa ìsopọ̀ mọ́ ọkùnrin tí a mẹ́nu kàn ní abala àkọ́kọ́.
- source_word: δίκαιοι
  choice: olódodo
  rationale: ‘Olódodo’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí ó jẹ́ δίκαιος, ó sì bá èdè δικ- ti Pọ́ọ̀lù lò mu.
- source_word: κατασταθήσονται
  choice: a ó … sọ … di
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí fara wé κατεστάθησαν ní abala àkọ́kọ́, ó sì pa ìfararọ̀ gbolohun méjèèjì mọ́.
theological_decisions:
- issue: Bóyá kí οἱ πολλοί jẹ́ ‘àwọn ọ̀pọ̀ ènìyàn’ tàbí kí a tú u ní ìtumọ̀ sí ‘gbogbo ènìyàn.’
  choice: àwọn ọ̀pọ̀ ènìyàn
  alternative: gbogbo ènìyàn; ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì gan-an ni οἱ πολλοί. Yíyan ‘àwọn ọ̀pọ̀ ènìyàn’ pa ọ̀rọ̀ Pọ́ọ̀lù àti àìdánilójú nípa ìwọ̀n rẹ̀ mọ́.
- issue: Bóyá κατασταθήσονται δίκαιοι yẹ kí ó túmọ̀ sí ‘a ó sọ … di olódodo’ tàbí ọ̀rọ̀ ìdájọ́ tó túmọ̀ sí ‘a ó kéde wọn ní olódodo.’
  choice: a ó sọ … di olódodo
  alternative: a ó kéde wọn ní olódodo; a ó fi wọn sí ipò olódodo
  rationale: Gíríìkì lo καθίστημι pẹ̀lú δίκαιοι, kì í ṣe δικαιόω. Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ orísun, kò sì yanju ìjiyàn ẹ̀kọ́ ìgbàgbọ́ fún òǹkàwé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ. Ìṣètò ‘fi … sọ … di’ pa àjọṣe ohun tó fa nǹkan àti àbájáde rẹ̀ mọ́, àwọn abala méjèèjì sì fara wé ara wọn.
