- from: Nítorí gẹ́gẹ́ bí a ti fi àìgbọ́ràn ọkùnrin kan ṣoṣo sọ àwọn ọ̀pọ̀ ènìyàn di ẹlẹ́ṣẹ̀[a], bẹ́ẹ̀ náà ni a ó fi ìgbọ́ràn ẹni kan ṣoṣo[b] sọ àwọn ọ̀pọ̀ ènìyàn di olódodo[c].
  to: Nítorí gẹ́gẹ́ bí nípasẹ̀ àìgbọ́ràn ọkùnrin kan ṣoṣo ni a ṣe sọ àwọn ọ̀pọ̀ ènìyàn di ẹlẹ́ṣẹ̀[a], bẹ́ẹ̀ náà nípasẹ̀ ìgbọ́ràn ọkùnrin kan ṣoṣo[b] ni a ó ṣe sọ àwọn ọ̀pọ̀ ènìyàn di olódodo[c].
  rationale: Àtúnṣe náà ṣe ìṣètò gbolohun náà sí ìrísí Yorùbá tó ń hàn bí passive, kàkà kí ó dà bí pé ‘a’ jẹ́ olùṣe. Ó tún lo ‘ọkùnrin kan ṣoṣo’ ní abala kejì gẹ́gẹ́ bí ọ̀rọ̀ tí a pèsè láti pa ìfararọ̀ orísun àti ìtàn àyíká mọ́. Àwọn ìyànjẹ́ nípa ìwọ̀n ‘àwọn ọ̀pọ̀ ènìyàn’ àti bí a ṣe lè lóye ‘sọ di olódodo’ kò yí padà.
