id: ROM.5.7
reference: Romans 5:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: yo
  text: Nítorí, ó ṣòro fún ẹnikẹ́ni láti kú fún olódodo[a][b]; bóyá ẹnì kan tilẹ̀ lè gbójú láti kú fún ẹni rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ọkùnrin olódodo.” Ọ̀rọ̀ Gíríìkì náà ní ìrísí akọ ní ti gírámà, ṣùgbọ́n ó ṣeé ṣe kí ó ń tọ́ka sí ènìyàn lápapọ̀ níhìn-ín.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ìyàtọ̀ láàárín “olódodo” àti “ẹni rere” jẹ́ ohun tí Pọ́ọ̀lù mọ̀ọ́mọ̀ ṣe, kì í ṣe ọ̀nà méjì lásán láti sọ ohun kan náà.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: ó ṣòro
  rationale: Ó fi hàn pé irú ikú bẹ́ẹ̀ kì í sábà ṣẹlẹ̀ rárá, tàbí pé ó ṣòro púpọ̀ láti rí; ọ̀rọ̀ yìí sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Nínú àyíká yìí, ó túmọ̀ sí ikú fún àǹfààní ẹlòmíràn tàbí dípò rẹ̀. “Nítorí” mú ìtumọ̀ náà jáde ní ṣókí láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: δικαίου
  choice: olódodo
  rationale: Ọ̀rọ̀ ajẹtífù Gíríìkì náà dúró gẹ́gẹ́ bí orúkọ ẹni tí ó ní ìwà òdodo. “Olódodo” pa ẹ̀ka ìwà àti ìdájọ́ òdodo tí Pọ́ọ̀lù lò mọ́.
- source_word: ἀποθανεῖται
  choice: kú
  rationale: Ìtumọ̀ tààrà ni; ìṣètò “ó ṣòro kí … kú” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ gbólóhùn gbogbogbò ọjọ́ iwájú yìí.
- source_word: τοῦ ἀγαθοῦ
  choice: ẹni rere
  rationale: Ó yà “ẹni rere” sọ́tọ̀ kúrò lọ́dọ̀ “olódodo,” ó sì pa ìyàtọ̀ tó ṣeé ṣe kí Pọ́ọ̀lù mọ̀ọ́mọ̀ ṣe mọ́.
- source_word: τάχα
  choice: bóyá
  rationale: Ó fi àṣàyàn tàbí ohun tó ṣeé ṣe hàn láì sọ ọ́ di ohun tó dájú.
- source_word: καὶ
  choice: tilẹ̀
  rationale: Níhìn-ín, καί ń fi ìtẹnumọ́ kún ọ̀rọ̀ náà; “tilẹ̀” ni ọ̀nà Yorùbá àdánidá láti mú agbára “even” jáde.
- source_word: τολμᾷ
  choice: lè láyà
  rationale: Ó mú èrò ìgboyà láti ṣe ohun tó ṣòro tàbí tó léwu jáde, nígbà tí “lè” bá àìdánilójú inú τάχα mu.
- source_word: ἀποθανεῖν
  choice: láti kú
  rationale: Ìtumọ̀ tààrà ni, ó sì pa àtúnlò èrò ikú nínú àwọn abala méjèèjì mọ́.
theological_decisions:
- issue: Bóyá kí a pa ìyàtọ̀ láàárín δικαίου àti ἀγαθοῦ mọ́
  choice: A túmọ̀ wọn lọ́tọ̀ sí “olódodo” àti “ẹni rere.”
  alternative: Kí a ka àwọn ọ̀rọ̀ méjèèjì sí ọ̀rọ̀ tó fẹ́rẹ̀ẹ́ jọra, kí a sì túmọ̀ wọn ní ọ̀nà kan náà.
  rationale: Ó ṣeé ṣe kí ìyàtọ̀ náà jẹ́ apá pàtàkì nínú ìjiyàn Pọ́ọ̀lù. Pípa wọn mọ́ lọ́tọ̀ kò ní mú ìtumọ̀ tí orísun kò sọ wọ inú ẹsẹ náà, bẹ́ẹ̀ ni kò ní pa ìforígbárí rẹ̀ rẹ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ẹnikẹ́ni” àti “ẹni” láti jẹ́ kí ìtọ́kasí náà jẹ́ ti ènìyàn lápapọ̀; a sì pa àtúnlò “kú” mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
