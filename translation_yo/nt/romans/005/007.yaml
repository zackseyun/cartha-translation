revisions:
- from: Nítorí ó ṣòro kí ẹnikẹ́ni kú nítorí olódodo[a][b]; síbẹ̀, bóyá ẹnì kan tilẹ̀ lè láyà láti kú nítorí ẹni rere.
  to: Nítorí, ó ṣòro fún ẹnikẹ́ni láti kú fún olódodo[a][b]; bóyá ẹnì kan tilẹ̀ lè gbójú láti kú fún ẹni rere.
  rationale: A rọ́pò ‘nítorí’ pẹ̀lú ‘fún’ lẹ́yìn ọ̀rọ̀ ‘kú’ ní àwọn ibi méjèèjì, láti fi ìtumọ̀ ὑπέρ hàn kedere. A tún ṣàtúnṣe ìṣètò gbólóhùn sí ọ̀nà Yorùbá tí ó rọrùn láti ka, a sì lo ‘gbọ́jú láti kú’ fún ìtumọ̀ ‘dare to die.’ Àwọn àmì akọsílẹ̀ àti ìtumọ̀ wọn wà ní ipò tó yẹ, kò sì sí ìyípadà sí ìtumọ̀ ẹsẹ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:27Z'
