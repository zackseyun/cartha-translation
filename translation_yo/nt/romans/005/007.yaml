  source_fidelity: Ìtumọ̀ náà pa ìyàtọ̀ tó ṣeé ṣe láàárín δικαίου (‘olódodo’) àti ἀγαθοῦ (‘ẹni rere’) mọ́, ó sì tún pa àìdánilójú τάχα (‘bóyá’) àti ìtẹnumọ́ καί (‘tilẹ̀’) mọ́. Ṣùgbọ́n ‘nítorí’ fún ὑπέρ lè túmọ̀ sí ‘because of’ ní Yorùbá, nítorí náà kò fi ìfẹ́ ẹni tí ikú náà ń ṣe àǹfààní hàn dáadáa. ‘Fún’ dáa jù fún ‘for/on behalf of’ ní àyíká yìí.
  naturalness: Ìṣètò tuntun náà—‘ó ṣòro fún ẹnikẹ́ni láti kú fún…’—jẹ́ Yorùbá ìgbàlódé tí ó mọ́, ó sì yọ àìgbọ́gbọ́n ‘ó ṣòro kí … kú’ kúrò. ‘Gbójú láti kú’ jẹ́ ọ̀nà àdánidá láti sọ ìgboyà tàbí ìgbọ́kànlé tó wà nínú τολμᾷ.
