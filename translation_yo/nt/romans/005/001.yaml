  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti dá wa láre nípasẹ̀ ìgbàgbọ́[b], a ní àlàáfíà[a] pẹ̀lú Ọlọ́run nípasẹ̀ Olúwa wa Jésù Mèsáyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn ìwé àfọwọ́kọ kan ní: “ẹ jẹ́ kí a ní àlàáfíà pẹ̀lú Ọlọ́run.”'
    reason: textual_variant
  - marker: b
    text: Tàbí, “lórí ìpìlẹ̀ ìgbàgbọ́.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì náà ni Christos, ìtumọ̀ rẹ̀ ni “Mèsáyà”; ní àṣà ìtumọ̀, a sábà máa ń pè é ní “Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: níwọ̀n bí a ti dá wa láre
  rationale: Ọ̀rọ̀ yìí jẹ́ participle aorist passive ti δικαιόω. “Dá wa láre” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé a ti dá ẹnì kan láre tàbí pé a ti fi hàn pé ó tọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde tàbí ìparí èrò tó ṣáájú.
- source_word: ἐκ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐκ ní ìtumọ̀ ìpilẹ̀ pé “láti inú,” “nípasẹ̀ ìgbàgbọ́” ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ipa gbólóhùn náà mu. Àṣàyàn “lórí ìpìlẹ̀ ìgbàgbọ́” wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: “Àlàáfíà” pa ìtumọ̀ gbooro ti εἰρήνη mọ́, pàápàá ìbáṣepọ̀ àlàáfíà pẹ̀lú Ọlọ́run, láìdín un kù sí ìmọ̀lára inú tàbí túmọ̀ ọ́ ní pàtó sí ìpadàrẹ́.
- source_word: ἔχομεν
  choice: a ní
  rationale: A tẹ̀ lé indicative ἔχομεν inú SBLGNT. Àkàwé hortatory subjunctive ἔχωμεν, “ẹ jẹ́ kí a ní,” wà nínú àlàyé ìsàlẹ̀.
- source_word: πρὸς τὸν θεὸν
  choice: pẹ̀lú Ọlọ́run
  rationale: Ní ìṣọ̀kan pẹ̀lú “àlàáfíà,” èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìbáṣepọ̀ àlàáfíà láàárín wa àti Ọlọ́run.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ọ̀rọ̀ Yorùbá tó bójú mu fún κύριος nínú àkọlé ọ̀wọ̀ yìí.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ àkọlé tó túmọ̀ sí ẹni àmì òróró, ìyẹn Mèsáyà; “Mèsáyà” fi ìtumọ̀ àkọlé náà hàn dípò kí a lò ó bí orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ δικαιωθέντες nínú ẹ̀kọ́ Paulu
  choice: a ti dá wa láre
  alternative: a ti kéde wa ní olódodo; a ti sọ wa di olódodo
  rationale: Ìtumọ̀ náà sọ iṣẹ́ tí a ṣe sí wa, ṣùgbọ́n kò ṣàlàyé gbogbo ọ̀nà tàbí ìlànà rẹ̀. “Dá wa láre” pa gbólóhùn náà mọ́ láìyanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ fún òǹkàwé.
- issue: Ìtumọ̀ “àlàáfíà pẹ̀lú Ọlọ́run”
  choice: A sọ ọ́ gẹ́gẹ́ bí ìbáṣepọ̀ àlàáfíà pẹ̀lú Ọlọ́run.
  alternative: ìfọ̀kànbalẹ̀ inú láti ọ̀dọ̀ Ọlọ́run; ìpadàrẹ́ pẹ̀lú Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ìbáṣepọ̀ pẹ̀lú Ọlọ́run, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ni “àlàáfíà,” kì í ṣe ọ̀rọ̀ pàtó fún “ìpadàrẹ́.” A pa ìwọ̀n àti ìfọkànsìn ọ̀rọ̀ náà mọ́.
- issue: Àkàwé ọ̀rọ̀ inú ἔχομεν/ἔχωμεν
  choice: a ní àlàáfíà
  alternative: ẹ jẹ́ kí a ní àlàáfíà
  rationale: Ọ̀rọ̀ SBLGNT tí a fi lélẹ̀ ní indicative ἔχομεν, torí náà àyọkà pàtàkì sọ ohun tí a ní. A kò fi àkàwé subjunctive pamọ́; a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àkókò-òde tó ní iyì, tó ṣe kedere fún gbogbo ènìyàn, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìṣètò “níwọ̀n bí …, a ní …” mú participle Gíríìkì wá sí Yorùbá àdánidá, ó sì pa ìsopọ̀ ìdí àti àbájáde mọ́. A yan “Mèsáyà” fún Χριστός, a sì ṣàlàyé “Kristi” nínú àlàyé ìsàlẹ̀.
