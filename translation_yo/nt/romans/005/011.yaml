id: ROM.5.11
reference: Romans 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: yo
  text: Kì í sì í ṣe ìyẹn nìkan, ṣùgbọ́n àwa tún ń ṣògo nínú Ọlọ́run nípasẹ̀ Olúwa wa Jesu Mèsáyà,[a][b] ẹni tí ó tipasẹ̀ rẹ̀ jẹ́ pé a ti gba ìlàjà náà nísinsìnyí.[c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καυχώμενοι
  choice: ń ṣògo
  rationale: Ó fi ìtumọ̀ ìpilẹ̀ṣẹ̀ ti ṣíṣe ìṣògo tàbí yíyọ̀ pẹ̀lú ìgbẹ́kẹ̀lé hàn. Nínú àyíká yìí, Ọlọ́run ni ohun tí a ń ṣògo nínú rẹ̀, kì í ṣe ìgbéraga ara ẹni.
- source_word: ἐν τῷ θεῷ
  choice: nínú Ọlọ́run
  rationale: Ìtumọ̀ yìí pa àwòrán Gíríìkì mọ́, ó sì lè tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tí ìṣògo náà dá lé tàbí ààyè ìgbẹ́kẹ̀lé náà.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Olúwa wa Jesu Mèsáyà
  rationale: ‘Nípasẹ̀’ fi ipa Kristi gẹ́gẹ́ bí alárinà hàn; ‘Olúwa’ jẹ́ ìtumọ̀ àdáyébá fún κύριος níbí, ‘Mèsáyà’ sì mú ìtumọ̀ oyè Χριστός jáde.
- source_word: τὴν καταλλαγὴν
  choice: ìlàjà náà
  rationale: ‘Ìlàjà’ túmọ̀ sí mímú ìbáṣepọ̀ tí ó bàjẹ́ padà sí àlàáfíà; ‘náà’ pa article náà àti ìtọ́kasí sí ìlàjà tí a ṣẹ̀ṣẹ̀ ṣàlàyé mọ́.
- source_word: νῦν ... ἐλάβομεν
  choice: a ti gba ... nísinsìnyí
  rationale: Ọ̀rọ̀ yìí fi iṣẹ́ tí ó ti ṣẹlẹ̀ àti àbájáde rẹ̀ tí ó wà lọ́wọ́lọ́wọ́ hàn, pẹ̀lú ìtẹnumọ́ νῦν.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ gẹ́gẹ́ bí oyè Kristi
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni àmì òróró; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn gbangba láì sọ ọ́ di orúkọ lásán.
- issue: Ohun tí καυχώμενοι ἐν τῷ θεῷ túmọ̀ sí
  choice: ń ṣògo nínú Ọlọ́run
  alternative: ń yọ̀ nínú Ọlọ́run
  rationale: ‘Ń ṣògo’ sún mọ́ agbára ọ̀rọ̀ Gíríìkì ju ‘ń yọ̀’ lọ, ṣùgbọ́n àfikún ‘nínú Ọlọ́run’ jẹ́ kó ṣe kedere pé kì í ṣe ìgbéraga ara ẹni.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. ‘Kì í sì í ṣe ìyẹn nìkan’ so ẹsẹ̀ náà mọ́ ọ̀rọ̀ tó ṣáájú; ‘ẹni tí ó tipasẹ̀ rẹ̀ jẹ́ pé’ yàgò fún àìmọ̀ ẹni tí ‘nípasẹ̀ rẹ̀’ ń tọ́ka sí. Àmì ohùn ni a fi sí ibi tí ó yẹ.
