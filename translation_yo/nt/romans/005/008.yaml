source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run ń fi ìfẹ́ tirẹ̀ sí wa[a] hàn ní èyí pé, nígbà tí àwa ṣì jẹ́ ẹlẹ́ṣẹ̀, Mèsáyà[b] kú fún wa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ tirẹ̀ sí ọ̀dọ̀ wa.”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: Christos; ní ìbílẹ̀, “Kristi.” Níhìn-ín a túmọ̀ ọ́ sí “Mèsáyà” gẹ́gẹ́ bí oyè.'
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí wa” tàbí “fún ire wa”; ọ̀rọ̀ Gíríìkì kò fi dandan pinnu ìtumọ̀ kan ṣoṣo níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: ń fi … hàn
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ń lọ lọ́wọ́ hàn, ó sì túmọ̀ sí pé Ọlọ́run ń ṣàfihàn tàbí ń jẹ́rìí sí ìfẹ́ rẹ̀. ‘Ń fi … hàn’ jẹ́ èdè Yorùbá àdánidá tí ó mú agbára ẹ̀rí inú ọ̀rọ̀ náà wá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó tọ́ka sí ìyípadà tàbí ìtakora pẹ̀lẹ́ nínú ìjíròrò Pọ́ọ̀lù; ‘Ṣùgbọ́n’ mú ìyípadà náà jáde kedere.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: ìfẹ́ tirẹ̀
  rationale: ‘Tirẹ̀’ pa ìtẹnumọ́ inú ἑαυτοῦ mọ́, nígbà tí ‘ìfẹ́’ jẹ́ ìtumọ̀ àdánidá fún ἀγάπη.
- source_word: εἰς ἡμᾶς
  choice: sí wa
  rationale: ‘Sí wa’ pa ìtọ́sọ́nà ìfẹ́ Ọlọ́run mọ́ ní ọ̀nà tí ó ṣe déédé pẹ̀lú Gíríìkì, láì dá a mọ́ ìtumọ̀ kan ṣoṣo bí ‘fún wa.’
- source_word: ὅτι
  choice: ní èyí pé
  rationale: Gbólóhùn yìí ṣàlàyé ọ̀nà tí Ọlọ́run gbà ń fi ìfẹ́ rẹ̀ hàn; ‘ní èyí pé’ bá iṣẹ́ àlàyé náà mu.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: nígbà tí àwa ṣì jẹ́ ẹlẹ́ṣẹ̀
  rationale: Ó tú genitive absolute sí gbólóhùn àkókò tí ó bójú mu ní Yorùbá; ‘ṣì’ pa agbára ἔτι mọ́, ‘àwa’ sì mú ẹni tí ọ̀rọ̀ náà kàn hàn gbangba.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, kì í ṣe orúkọ lásán; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́.
- source_word: ὑπὲρ ἡμῶν
  choice: fún wa
  rationale: ‘Fún wa’ sọ pé ikú Mèsáyà jẹ́ fún ire wa, ṣùgbọ́n kò fi tipátipá pinnu bóyá ὑπέρ túmọ̀ sí nítorí wa, ní ipò wa, tàbí ní orúkọ wa.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Ìtumọ̀ tààrà, kúkúrú, àti àdánidá fún ọ̀rọ̀-ìṣe aorist náà ni ‘kú.’
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ẹsẹ yìí, ọ̀rọ̀ náà ní agbára oyè ẹni àmì òróró. ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ ọ̀nà ìbílẹ̀ ‘Kristi.’
- issue: Agbára ìtumọ̀ ὑπὲρ ἡμῶν
  choice: fún wa
  alternative: ní ipò wa / ní orúkọ wa
  rationale: Gíríìkì fi hàn pé ikú Mèsáyà jẹ́ fún ire wa, ṣùgbọ́n ẹsẹ yìí nìkan kò béèrè pé kí a yan ìtumọ̀ ètùtù kan pàtó. ‘Fún wa’ pa ààyè ìtumọ̀ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ológo ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ń fi … hàn’ jẹ́ gbólóhùn àdánidá; ‘Mèsáyà’ pa oyè náà mọ́; ‘fún wa’ sì yẹra fún fífi ẹ̀kọ́ ìsìn kan pàtó lé ὑπέρ lórí.
