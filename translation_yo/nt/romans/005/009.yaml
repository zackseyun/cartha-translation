id: ROM.5.9
reference: Romans 5:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: yo
  text: Nítorí náà, níwọ̀n bí a ti dá wa láre[a] nísinsìnyí nípa ẹ̀jẹ̀ rẹ̀[b], a ó túbọ̀ rí ìgbàlà gbà nípasẹ̀ rẹ̀ kúrò lọ́wọ́ ìbínú náà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kà wa sí olódodo.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gírámà, a tún lè túmọ̀ ọ́ sí “nínú ẹ̀jẹ̀ rẹ̀”; níhìn-ín, gbólóhùn náà ń tọ́ka sí ẹ̀jẹ̀ rẹ̀ gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ dídáláre.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, ìbínú Ọlọ́run tí àyíká ọ̀rọ̀ náà ń tọ́ka sí.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Nítorí náà … ó túbọ̀ dájú púpọ̀ pé
  rationale: “Nítorí náà” fi ìtumọ̀ ìyọrísí οὖν hàn, “ó túbọ̀ dájú púpọ̀” sì mú ìfiwéra tí πολλῷ … μᾶλλον ń tẹnumọ́ jáde ní Yorùbá àdánidá.
- source_word: δικαιωθέντες
  choice: níwọ̀n bí a ti dá wa láre
  rationale: Ó fi iṣẹ́ tí a ti ṣe sí wa ṣáájú ìgbàlà ọjọ́ iwájú hàn, ó sì pa ọ̀rọ̀ pàtàkì ti Pọ́ọ̀lù fún dídáláre mọ́.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó tọ́ka sí ipò ìsinsìnyí tí ó jẹ́ àbájáde dídáláre.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: nípa ẹ̀jẹ̀ rẹ̀
  rationale: Nínú àyíká yìí, ἐν ń sọ ọ̀nà tàbí ìpìlẹ̀; “nípa” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí láì ṣàlàyé ìtumọ̀ ẹbọ náà ré kọjá ohun tí ẹsẹ náà sọ.
- source_word: σωθησόμεθα
  choice: a ó rí ìgbàlà gbà
  rationale: Ó pa ìgbà ọjọ́ iwájú mọ́, ó sì yẹra fún fífi ẹni tó ń ṣe iṣẹ́ ìgbàlà kún ọ̀rọ̀ tí fọ́ọ̀mù páàsìfù Gíríìkì kò sọ ní tààrà.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: Ó fi ipa rẹ̀ gẹ́gẹ́ bí ọ̀nà tàbí aṣojú ìgbàlà hàn ní kedere.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: kúrò lọ́wọ́ ìbínú náà
  rationale: “Kúrò lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún ìdáǹdè kúrò nínú ewu; “ìbínú náà” pa ìdánimọ̀ ọ̀rọ̀ náà mọ́ láì fi “Ọlọ́run” kún un.
theological_decisions:
- issue: Ìtumọ̀ δικαιωθέντες
  choice: dá wa láre
  alternative: kà wa sí olódodo
  rationale: “Dá wa láre” pa ìbáṣepọ̀ pẹ̀lú èdè ìdáláre ti Pọ́ọ̀lù mọ́, láì pinnu nípa ọ̀nà ẹ̀kọ́ ìjọ kan ṣoṣo bí ìdáláre ṣe ń ṣiṣẹ́.
- issue: Ẹni tí ìbínú náà jẹ́ tirẹ̀ nínú ἡ ὀργή
  choice: ìbínú náà
  alternative: ìbínú Ọlọ́run
  rationale: Àyíká fi hàn pé ìbínú Ọlọ́run ni, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò darúkọ Ọlọ́run ní tààrà; nítorí náà, a kò fi orúkọ náà kún àkọsílẹ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, àdánidá tí òǹkàwé òde òní lè lóye. A lo “ó túbọ̀ dájú púpọ̀ pé” láti mú ìlọsíwájú ìjiyàn Pọ́ọ̀lù hàn, a sì lo “rí ìgbàlà gbà” láti pa àìsọ ẹni tó ṣe iṣẹ́ inú páàsìfù Gíríìkì mọ́.
