  to: Nítorí náà, níwọ̀n bí a ti dá wa láre[a] nísinsìnyí nípa ẹ̀jẹ̀ rẹ̀[b], a ó túbọ̀ rí ìgbàlà gbà nípasẹ̀ rẹ̀ kúrò lọ́wọ́ ìbínú náà.[c]
  rationale: Àtúnṣe náà yọ ‘dájú púpọ̀’ kúrò, nítorí kò sí ọ̀rọ̀ ìdánilójú bẹ́ẹ̀ nínú πολλῷ ... μᾶλλον. ‘A ó túbọ̀ rí ìgbàlà gbà’ ń ṣàfihàn ìfiwéra ìjiyàn Pọ́ọ̀lù, nígbà tí ó ń pa fọ́ọ̀mù ọjọ́ iwájú σωθησόμεθα àti àìsọ aṣojú páàsìfù mọ́. Gbogbo àmì ẹsẹ̀-ìsàlẹ̀ àti ìtumọ̀ wọn wà ní ipò tó tọ́.
