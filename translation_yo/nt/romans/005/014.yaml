id: ROM.5.14
reference: Romans 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: yo
  text: Síbẹ̀, ikú jọba láti ìgbà Ádámù títí dé ìgbà Mósè, àní lórí àwọn tí kò dẹ́ṣẹ̀ ní ọ̀nà kan náà bí ìrékọjá Ádámù. Ádámù sì jẹ́ àpẹẹrẹ[a] ẹni tí ń bọ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘àkọ́ṣe’ tàbí ‘àmì ohun tí yóò dé.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘ẹni tí yóò dé.’ Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí Kristi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Síbẹ̀
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: ikú jọba
  rationale: Ó pa àwòrán ikú gẹ́gẹ́ bí ọba tó ń ṣàkóso mọ́.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: láti ìgbà Ádámù títí dé ìgbà Mósè
  rationale: Fífi ‘ìgbà’ kún un mú àkókò tí gbólóhùn náà ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: àní lórí àwọn tí kò dẹ́ṣẹ̀
  rationale: ‘Àní’ mú ìyàlẹ́nu inú καί hàn, ‘lórí’ sì fi ibi tí ìjọba ikú dé hàn.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: ní ọ̀nà kan náà bí ìrékọjá Ádámù
  rationale: Ó sọ ìbájọra náà ní Yorùbá tó ṣe kedere láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: παράβασις
  choice: ìrékọjá
  rationale: Ọ̀rọ̀ yìí pa èrò fífi ààlà àṣẹ kọjá mọ́.
- source_word: τύπος
  choice: àpẹẹrẹ
  rationale: ‘Àpẹẹrẹ’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ó sì lè túmọ̀ sí àwòrán tàbí àkọ́ṣe ohun tí yóò dé.
- source_word: τοῦ μέλλοντος
  choice: ẹni tí ń bọ̀
  rationale: Ó pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ẹni kan tí ń bọ̀, láì fi ‘Kristi’ sínú ẹsẹ̀ náà ní tààrà.
theological_decisions:
- issue: Ẹni tí ‘ẹni tí ń bọ̀’ ń tọ́ka sí
  choice: A kò dárúkọ Kristi nínú àyọkà, ṣùgbọ́n akọ́silẹ̀ ṣàlàyé pé ọ̀rọ̀ inú àyíká tọ́ka sí i.
  alternative: Kí a túmọ̀ ọ́ ní tààrà sí ‘Kristi tí ń bọ̀.’
  rationale: Róòmù 5:12–21 ń fi Ádámù àti Kristi wé ara wọn, ṣùgbọ́n τοῦ μέλλοντος kò dárúkọ Kristi ní tààrà; mímú èyí wà nínú akọ́silẹ̀ pa ìtumọ̀ àti ìṣọ́ra àyọkà mọ́.
- issue: Ìbájọra ẹ̀ṣẹ̀ àwọn ènìyàn sí ìrékọjá Ádámù
  choice: ‘ní ọ̀nà kan náà bí’ fi hàn pé wọn kò ṣẹ̀ ní irú ọ̀nà tí Ádámù gbà ṣẹ̀.
  alternative: ‘gẹ́gẹ́ bí àwòrán ìrékọjá Ádámù,’ èyí tó túmọ̀ ọ̀rọ̀ náà ní ìlànà tó túbọ̀ tẹ̀lé Gíríìkì ṣùgbọ́n tí kò rọrùn ní Yorùbá.
  rationale: Ìtumọ̀ náà pa ìfiwéra mọ́ láì ṣàlàyé ní pàtó ohun tó yà ẹ̀ṣẹ̀ wọn sí ti Ádámù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà ní ibi tó yẹ; ‘ikú jọba’ pa ìsọdi-ẹni ikú mọ́, ‘ìrékọjá’ sì pa àwòrán rírú àṣẹ mọ́.
