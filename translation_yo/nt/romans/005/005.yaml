id: ROM.5.5
reference: Romans 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: yo
  text: Ìrètí náà kò sì kó wa ní ìtìjú,[a] nítorí a ti tú ìfẹ́ Ọlọ́run[b] sínú ọkàn wa nípasẹ̀ Ẹ̀mí Mímọ́, ẹni tí a fún wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò já wa kulẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà tún lè túmọ̀ sí “ìfẹ́ wa sí Ọlọ́run,” bí ó tilẹ̀ jẹ́ pé ìtumọ̀ yẹn kò ṣeé ṣe tó.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: ìrètí
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ ἐλπίς mu ní àyíká yìí.
- source_word: δέ
  choice: sì
  rationale: Ó dúró fún àsopọ̀ fẹ́ẹ́rẹ́ inú Gíríìkì láì sọ ìyàtọ̀ náà di líle ju bó ṣe rí lọ.
- source_word: καταισχύνει
  choice: kò dójú tì wá
  rationale: Ó pa èrò ìtìjú àti àbùkù mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: Ó pa ìṣọ̀kan genitive inú Gíríìkì mọ́ dé ìwọ̀n kan; àyíká gbé ìtumọ̀ pé ìfẹ́ Ọlọ́run sí wa lágbára, ṣùgbọ́n a kò gbọ́dọ̀ pa ìtumọ̀ kejì rẹ́.
- source_word: ἐκκέχυται
  choice: a ti tú ... sínú
  rationale: Àmì perfect náà hàn nínú ‘a ti,’ èyí tó tọ́ka sí ohun tí a ṣe tẹ́lẹ̀ tí àbájáde rẹ̀ sì ń bá a lọ.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: sínú ọkàn wa
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ nípa inú ẹni; ‘sínú’ tún bá àwòrán títú nkan wọ inú ohun kan mu.
- source_word: διὰ πνεύματος ἁγίου
  choice: nípasẹ̀ Ẹ̀mí Mímọ́
  rationale: Ó fi ipa irinṣẹ́ tàbí alárinà διά pẹ̀lú genitive hàn kedere.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: ẹni tí a fi fún wa
  rationale: ‘Ẹni tí’ tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni, ó sì tú participle náà sí Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú ἡ ἀγάπη τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run sí wa ni àyíká yìí ń tọ́ka sí ní pàtàkì
  alternative: ìfẹ́ wa sí Ọlọ́run
  rationale: Gbólóhùn tó tẹ̀ lé e, pé a tú ìfẹ́ náà sínú ọkàn wa nípasẹ̀ Ẹ̀mí Mímọ́, mú kí ìfẹ́ tí Ọlọ́run ní sí wa ṣeé ṣe jù; síbẹ̀, ìṣọ̀kan Gíríìkì lè gba ìtumọ̀ kejì, nítorí náà akọsilẹ̀ pa á mọ́.
- issue: Agbára ìtumọ̀ καταισχύνει
  choice: kò dójú tì wá
  alternative: kò já wa kulẹ̀
  rationale: Yíyan àkọ́kọ́ pa àwọ̀ ìtìjú àti ọlá inú ọ̀rọ̀ Gíríìkì mọ́; èkejì jẹ́ ìtumọ̀ tó ṣeé ṣe ṣùgbọ́n tó rọ èrò ìtìjú kù.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. A lo ‘dójú tì’ láti pa àkòrí ìtìjú mọ́, ‘a ti tú’ láti fi perfect hàn, àti ‘ẹni tí’ fún Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni. Àwọn àmì akọsilẹ̀ [a] àti [b] wà lẹ́yìn àwọn gbolohun tí wọ́n ń ṣàlàyé.
