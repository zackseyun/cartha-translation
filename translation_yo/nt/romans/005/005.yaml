  to: Ìrètí náà kò sì kó wa ní ìtìjú,[a] nítorí a ti tú ìfẹ́ Ọlọ́run[b] sínú ọkàn wa nípasẹ̀ Ẹ̀mí Mímọ́, ẹni tí a fún wa.
