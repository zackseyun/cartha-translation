  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: yo
  text: Nítorí pé títí di ìgbà tí òfin dé, ẹ̀ṣẹ̀ wà nínú ayé; ṣùgbọ́n a kì í ka ẹ̀ṣẹ̀ sí àkọọ́lẹ̀ ẹni kan[a] nígbà tí òfin kò bá sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kì í fi ẹ̀ṣẹ̀ kàn ẹnìkan” tàbí “a kì í gbé e kalẹ̀ sórí àkọọ́lẹ̀ ẹni kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: Nítorí pé títí di ìgbà tí òfin dé
  rationale: Ọ̀rọ̀ yìí fi àkókò tó lọ títí dé fífúnni ní òfin hàn. Àfikún ‘ìgbà tí ... dé’ jẹ́ kí èdè Yorùbá ṣe kedere láì sọ ju ohun tí ọ̀rọ̀ Gíríìkì túmọ̀ sí lọ.
- source_word: νόμου
  choice: òfin
  rationale: Àyíká Róòmù 5:14 tọ́ka sí òfin Mósè, ṣùgbọ́n Yorùbá kò nílò àmì pàtó bí article Gẹ̀ẹ́sì; ‘òfin’ dá ìtọ́kasí náà sílẹ̀ fún àyíká láti ṣàlàyé.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún èrò Pọ́ọ̀lù nípa ẹ̀ṣẹ̀, ó sì lè pa agbára rẹ̀ gẹ́gẹ́ bí ohun tó ń ṣiṣẹ́ mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: ἐν κόσμῳ
  choice: nínú ayé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti tọ́ka sí ayé ènìyàn tí ẹ̀ṣẹ̀ wà nínú rẹ̀.
- source_word: ἐλλογεῖται
  choice: a kì í ka ... sí àkọọ́lẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì ní ìtumọ̀ ìṣírò tàbí fífi ohun kan sí àkọọ́lẹ̀ ẹnìkan. Gbólóhùn yìí jẹ́ ti Yorùbá òde òní, ó sì pa àwòrán àkọọ́lẹ̀ mọ́ láì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó wuwo.
- source_word: μὴ ὄντος νόμου
  choice: nígbà tí òfin kò bá sí
  rationale: Genitive absolute náà sọ àìsí òfin di ipò tí gbólóhùn náà dúró lé; ‘nígbà tí’ bá ìtumọ̀ àkókò inú àyíká mu, bó tilẹ̀ jẹ́ pé a tún lè túmọ̀ rẹ̀ sí ‘níbi tí’.
theological_decisions:
- issue: Ohun tí ‘òfin’ ń tọ́ka sí
  choice: A lo ‘òfin,’ tí àyíká láti Ádámù dé Mósè fi hàn pé ó ṣeé ṣe kó jẹ́ òfin Mósè.
  alternative: Kí a ka a sí òfin lápapọ̀ láì ní ìtọ́kasí pàtó sí òfin Mósè.
  rationale: Ẹsẹ tó tẹ̀ lé e mẹ́nu kan Mósè, nítorí náà òfin Mósè ni ó ṣeé ṣe jù; síbẹ̀, a kò fi ‘Mósè’ kún ẹsẹ yìí, kí a má bàa yanjú ohun tí Gíríìkì kò sọ ní tààrà.
- issue: Agbára ọ̀rọ̀ ἐλλογεῖται
  choice: ‘a kì í ka ẹ̀ṣẹ̀ sí àkọọ́lẹ̀’
  alternative: ‘a kì í kà á sí ẹ̀ṣẹ̀’ tàbí ‘a kì í fi ẹ̀ṣẹ̀ náà kàn án’
  rationale: Yíyan ọ̀rọ̀ àkọọ́lẹ̀ pa ìtumọ̀ ìṣírò àti jíjíyìn ẹ̀ṣẹ̀ sí ẹnìkan mọ́, ṣùgbọ́n kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. A lo ‘a kì í’ fún gbólóhùn gbogbogbò tí present passive Gíríìkì ń sọ. Gbogbo àmì ohùn ni a fi síbi tí ó yẹ.
