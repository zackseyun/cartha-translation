    rationale: ‘Kan náà’ sábà ń túmọ̀ sí ‘the same’ ẹni tí a ti tọ́ka sí. Gíríìkì náà ń tẹnumọ́ ‘ọkùnrin kan’ nínú ìyàtọ̀ ẹni kan/ọ̀pọ̀; ‘ọkùnrin kan’ pa èyí mọ́ láì fi ìtọ́kasí àfikún kún un.
