id: ROM.5.15
reference: Romans 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀bùn náà kò rí bí ìrékọjá náà. Nítorí bí ìrékọjá ọkùnrin kan ṣe mú kí ọ̀pọ̀ ènìyàn náà kú, kódà jù bẹ́ẹ̀ lọ, oore-ọ̀fẹ́ Ọlọ́run àti ẹ̀bùn tí ó wá nípasẹ̀ oore-ọ̀fẹ́[a] ọkùnrin kan, Jesu Mèsáyà[b], ti ṣàn lọ́pọ̀ yanturu dé ọ̀dọ̀ ọ̀pọ̀ ènìyàn náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀bùn nínú oore-ọ̀fẹ́” tàbí “ẹ̀bùn tí ó wá nítorí oore-ọ̀fẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Jesu Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: ìrékọjá
  rationale: “Ìrékọjá” ń sọ ìṣe tí ó ré kọjá ààlà ohun tí ó tọ́, ó sì bá agbára ti ọ̀rọ̀ Gíríìkì mu láì sọ ọ́ di ọ̀rọ̀ òfin líle jù.
- source_word: χάρισμα
  choice: ẹ̀bùn
  rationale: “Ẹ̀bùn” mú ìyàtọ̀ tó wà láàárín ìrékọjá Ádámù àti ohun tí Ọlọ́run fi fúnni hàn ní kedere; gbólóhùn tó tẹ̀ lé e ló ṣàlàyé pé oore-ọ̀fẹ́ ni orísun rẹ̀.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: àwọn ọ̀pọ̀ ènìyàn náà
  rationale: Àfikún “àwọn” àti “náà” ń pa ìtumọ̀ ẹgbẹ́ tí a dá mọ̀—‘the many’—mọ́, láì yí i sí “gbogbo ènìyàn” tàbí yanju bí ìwọ̀n ẹgbẹ́ náà ṣe tó.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: oore-ọ̀fẹ́ Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tó mọ́gbọ́n dání, tó níyì, tí ó sì pa ìtumọ̀ χάρις mọ́.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: ẹ̀bùn tí ó wá nípasẹ̀ oore-ọ̀fẹ́
  rationale: A ka ἐν ní ìtumọ̀ ọ̀nà tàbí ìbáṣepọ̀; ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì fi hàn pé oore-ọ̀fẹ́ ni ẹ̀bùn náà fi wá.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ọkùnrin kan náà
  rationale: Ó pa ìtẹnumọ́ ẹni kan ṣoṣo àti ìfiwéra ẹni-kan/pọ̀-ènìyàn tí Paulu lò mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: “Mèsáyà” ń gbé Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró jáde, kì í ṣe bí orúkọ ìdílé.
- source_word: ἐπερίσσευσεν
  choice: ti ṣàn lọ́pọ̀ yanturu dé ọ̀dọ̀
  rationale: Àwòrán ohun tí ń ṣàn lọ́pọ̀ yanturu ń pa agbára àkúnwọ́sílẹ̀ περισσεύω mọ́, ó sì bá “mélòómélòó” mu.
theological_decisions:
- issue: Ìwọ̀n àwọn tí “οἱ πολλοί / τοὺς πολλούς” ń tọ́ka sí nínú ìfiwéra Ádámù àti Kristi
  choice: Pa “àwọn ọ̀pọ̀ ènìyàn náà” mọ́ láì yí i sí “gbogbo ènìyàn.”
  alternative: Túmọ̀ ọ́ sí “gbogbo ènìyàn” láti mú ìwọ̀n aṣojú náà ṣe kedere.
  rationale: Paulu mọ̀ọ́mọ̀ fi ẹni kan àti ọ̀pọ̀ ènìyàn wéra. Fífi ọ̀rọ̀ náà sílẹ̀ báyìí ń pa ẹdọfu inú ẹsẹ náà mọ́, kò sì fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìṣètò ẹni-kan/àwọn-ọ̀pọ̀ ni a tẹnumọ́, ṣùgbọ́n a tún jẹ́ kí gbólóhùn náà ṣàn ní ti ẹ̀dá Yorùbá. A gbé àmì àlàyé [a] sí lẹ́yìn gbólóhùn ἡ δωρεὰ ἐν χάριτι tí àlàyé náà ń tọ́ka sí.
