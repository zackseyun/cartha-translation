  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìfiwéra ìrékọjá ẹni kan àti ẹ̀bùn/oore-ọ̀fẹ́ Ọlọ́run, pẹ̀lú ìtẹnumọ́ ‘ọ̀pọ̀ ènìyàn,’ hàn dáadáa. Síbẹ̀, ‘mélòómélòó ni’ kò jẹ́ ìtumọ̀ tó péye tàbí tó rọrùn fún πολλῷ μᾶλλον (‘kódà jù bẹ́ẹ̀ lọ’), ‘kan náà’ sì lè túmọ̀ sí ẹni kan tí a ti mẹ́nuba tẹlẹ̀ dípò ‘ẹni kan náà/one man’ nínú ìfiwéra Paulu.
  naturalness: Àtúnṣe náà ń lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn. ‘Kódà jù bẹ́ẹ̀ lọ’ jẹ́ ọ̀nà àdánidá láti fi ìfiwéra πολλῷ μᾶλλον hàn, ‘ọ̀pọ̀ ènìyàn náà’ sì rọrùn ju ‘àwọn ọ̀pọ̀ ènìyàn náà’ lọ nínú àyíká yìí.
  terminology: A pa ‘ìrékọjá,’ ‘ẹ̀bùn,’ ‘oore-ọ̀fẹ́,’ àti ‘Mèsáyà’ mọ́. ‘Jesu Mèsáyà’ ń gbé Χριστός jáde gẹ́gẹ́ bí oyè; àmì àlàyé b ń pa ‘Jesu Kristi’ gẹ́gẹ́ bí àṣàyàn mọ́. Àmì a wà ní ibi gbolohun ἐν χάριτι tí ó yẹ.
