id: ROM.5.18
reference: Romans 5:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: yo
  text: Nítorí náà, gẹ́gẹ́ bí ìdálẹ́bi ti dé bá gbogbo ènìyàn nípasẹ̀ ìrékọjá kan, bẹ́ẹ̀ náà ni ìdáláre tí ń mú ìyè wá ti dé bá gbogbo ènìyàn nípasẹ̀ iṣẹ́ òdodo kan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “nípasẹ̀ iṣẹ́ òdodo kan ... sí ìdáláre ìyè.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí Pọ́ọ̀lù ń fà jáde hàn ní Yorùbá àdánidá.
- source_word: παραπτώματος
  choice: ìrékọjá
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìṣe tí ó ré kọjá àṣẹ tàbí ohun tí ó tọ́, ó sì yàtọ̀ sí ọ̀rọ̀ gbogbogbò fún ẹ̀ṣẹ̀.
- source_word: κατάκριμα
  choice: ìdálẹ́bi
  rationale: Ó pa agbára ọ̀rọ̀ ilé-ẹjọ́ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ìyàtọ̀ láàárín Ádámù àti Kristi mu.
- source_word: δικαιώματος
  choice: iṣẹ́ òdodo
  rationale: Nínú àyíká yìí, ẹyọ ọ̀rọ̀ náà tọ́ka sí iṣẹ́ pàtàkì kan tí ó bá ohun tí ó tọ́ mu; ‘iṣẹ́ òdodo’ ṣe èyí ní Yorùbá tí ó ṣe kedere.
- source_word: δικαίωσιν ζωῆς
  choice: ìdáláre tí ń mú ìyè wá
  rationale: Ó sọ ìbáṣepọ̀ ìdáláre àti ìyè di mímọ́ ní Yorùbá, nígbà tí ó ń pa ìtumọ̀ ilé-ẹjọ́ àti abajade tí ń fúnni ní ìyè mọ́.
- source_word: πάντας ἀνθρώπους
  choice: gbogbo ènìyàn
  rationale: Ó dúró fún gbogbo ẹ̀dá ènìyàn láì fi ìtumọ̀ akọ nìkan sí gbolohun náà, ó sì tún ọ̀rọ̀ kan náà ṣe ní apá méjèèjì.
theological_decisions:
- issue: Bóyá kí a dín ‘gbogbo ènìyàn’ kejì kù láti yẹra fún ìtumọ̀ tí ó dà bí ẹni pé ó kan gbogbo ayé láìsí ààlà
  choice: A pa ‘gbogbo ènìyàn’ mọ́ ní apá méjèèjì láì fi àlàyé ìdínkù kún un.
  alternative: gbogbo àwọn tí a dá láre; gbogbo àwọn tí ó gbàgbọ́
  rationale: Gíríìkì tún πάντας ἀνθρώπους kan náà ṣe ní ìdajì méjèèjì. Dídín èkejì kù yóò tú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà fúnra rẹ̀ kò tú níbí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Ìtòlẹ́sẹẹsẹ ‘gẹ́gẹ́ bí ... bẹ́ẹ̀ náà ni ...’ pa afiwe Gíríìkì mọ́, nígbà tí ‘ti dé bá’ ń pèsè ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ nítorí àkótán.
