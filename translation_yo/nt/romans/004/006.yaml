  terminology: “Ìbùkún,” “òdodo,” àti “ka òdodo sí” bójú mu fún μακαρισμός, δικαιοσύνην, àti λογίζεται. Àlàyé a ni a ṣe àtúnṣe kí ó má ṣe sọ pé ἀνθρώπου túmọ̀ sí “ọkùnrin” nìkan; ọ̀rọ̀ náà ní fọ́ọ̀mù ẹyọ akọ ṣùgbọ́n ó lè jẹ́ aṣojú fún ènìyàn ní gbogbogbòò.
