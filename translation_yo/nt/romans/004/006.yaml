  source_fidelity: 'Ìtumọ̀ náà ń fi gbogbo àwọn èrò pàtàkì ti Gíríìkì hàn: àfiwé náà, Dáfídì gẹ́gẹ́ bí ẹlẹ́rìí àfikún, ìbùkún, fífi òdodo sí àkọọ́lẹ̀ ẹni, àti ìyàtọ̀ rẹ̀ sí iṣẹ́. Ṣùgbọ́n “Dáfídì pẹ̀lú ti ń sọ” kò jẹ́ ìṣètò Yorùbá tó dára fún καὶ ... λέγει; “Dáfídì náà ń sọ” dáa sí i. “Àwọn iṣẹ́” tún lè fi ìdíwọ̀n pàtó kún ἔργων tí kò ní ọ̀rọ̀ ìpìlẹ̀; “iṣẹ́” dá ìtumọ̀ Gíríìkì náà mọ́ dáadáa.'
