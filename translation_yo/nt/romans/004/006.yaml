  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: yo
  text: Gẹ́gẹ́ bí Dáfídì náà ṣe ń sọ nípa ìbùkún ẹni tí Ọlọ́run ń ka òdodo sí láìsí iṣẹ́:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ènìyàn náà”; ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ akọ, ṣùgbọ́n ó dúró fún ènìyàn lápapọ̀ níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ṣírò òdodo sí” tàbí “fi òdodo sí àkọọ́lẹ̀ fún.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ìdájọ́ òdodo” dípò “òdodo.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: Gẹ́gẹ́ bí
  rationale: Ó mú àfiwé pẹ̀lú àríyànjiyàn tó ṣáájú wá, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi Dáfídì kún un gẹ́gẹ́ bí ẹlẹ́rìí mìíràn.
- source_word: λέγει
  choice: ń sọ nípa
  rationale: Àkókò ìsinsìnyí bá ọ̀nà tí a fi ń tọ́ka sí ẹsẹ Ìwé Mímọ́ mu; ‘sọ nípa’ sì bá ohun tí ó tẹ̀ lé e mu.
- source_word: μακαρισμός
  choice: ìbùkún
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ipò tàbí ìkéde ẹni tí a bù kún; ‘ìbùkún’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tó sì bójú mu.
- source_word: ἀνθρώπου
  choice: ẹni
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ ẹyọ akọ, agbára aṣojú ni ó ní níbí; ‘ẹni’ jẹ́ àdánidá, kò sì dín ìtumọ̀ rẹ̀ sí ọkùnrin nìkan.
- source_word: λογίζεται
  choice: ka ... sí
  rationale: Ó pa àwòrán ìṣirò tàbí fífi ohun kan sí àkọọ́lẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: ‘Òdodo’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún δικαιοσύνη nínú lílo Páùlù, ó sì lè gba ìtumọ̀ ìbámu pẹ̀lú ìlànà òdodo àti ìdájọ́.
- source_word: χωρὶς ἔργων
  choice: láìsí àwọn iṣẹ́
  rationale: Ó pa ìyàtọ̀ tí Páùlù ń ṣe láàárín ohun tí Ọlọ́run kà sí ẹni àti àwọn iṣẹ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ aṣojú akọ nínú ἀνθρώπου
  choice: ẹni
  alternative: ọkùnrin náà
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí, ṣùgbọ́n ó dúró fún ènìyàn lápapọ̀ níbí; ‘ẹni’ sọ ìtumọ̀ aṣojú náà ní Yorùbá àdánidá láìfi kún un pé ó jẹ́ ọkùnrin nìkan.
- issue: δικαιοσύνη nínú lílo Páùlù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ Páùlù mọ́, nígbà tí àlàyé ìsàlẹ̀ fi apá ìtumọ̀ tó ní í ṣe pẹ̀lú ìdájọ́ òdodo hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹni’ láti fi agbára aṣojú ἀνθρώπου hàn, a sì pa àwọn àṣàyàn pàtàkì mọ́ nínú àlàyé ìsàlẹ̀.
