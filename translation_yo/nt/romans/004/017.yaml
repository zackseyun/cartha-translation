  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: yo
  text: Gẹ́gẹ́ bí a ti kọ ọ́ pé, “Mo ti fi ọ́ ṣe baba àwọn orílẹ̀-èdè púpọ̀”[a]—níwájú Ọlọ́run tí Abrahamu gbàgbọ́ nínú rẹ̀, ẹni tí ń fún àwọn òkú ní ìyè, tí ó sì ń pe àwọn ohun tí kò sí gẹ́gẹ́ bí ohun tí ó wà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn orílẹ̀-èdè” níbí tún lè túmọ̀ sí “àwọn Kèfèrí,” ṣùgbọ́n nínú ọ̀rọ̀ tí a fa yọ láti inú Gẹnẹsisi, ìtumọ̀ gbòòrò náà, “àwọn orílẹ̀-èdè,” ló ṣeé ṣe jù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ní ìtumọ̀ tí a tú síwájú sí i, “tí ó ń pe àwọn ohun tí kò sí wá sí wíwà.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà àdámọ̀ Yorùbá láti tọ́ka sí ohun tí Ìwé Mímọ́ ti kọ sílẹ̀, ó sì pa agbára perfect passive náà mọ́ pé ohun tí a kọ ṣì dúró.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: baba orílẹ̀-èdè púpọ̀
  rationale: Ní àyíká ọ̀rọ̀ tí a fa yọ láti inú Gẹnẹsisi, ἐθνῶν túmọ̀ sí àwọn orílẹ̀-èdè tàbí àwọn ènìyàn ní ìtumọ̀ gbòòrò, kì í ṣe àwọn Kèfèrí nìkan.
- source_word: τέθεικά σε
  choice: Mo ti fi ọ́ ṣe
  rationale: Ọ̀rọ̀ yìí mú ìṣe tí a ti ṣe, tí ipa rẹ̀ sì ń bá a lọ, jáde lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: κατέναντι
  choice: níwájú
  rationale: Ó pa ìtumọ̀ wíwà níwájú tàbí ní ojú ẹni kan mọ́, ó sì bá ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Yorùbá mu.
- source_word: οὗ ἐπίστευσεν
  choice: tí Abrahamu gbàgbọ́ nínú rẹ̀
  rationale: A dárúkọ Abrahamu láti mú ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere ní Yorùbá, láì yí ìtumọ̀ ìgbẹ́kẹ̀lé rẹ̀ nínú Ọlọ́run padà.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: ẹni tí ń sọ àwọn òkú di alààyè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún fífi ìyè fún àwọn òkú, ó sì fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí agbára fífúnni ní ìyè jẹ́ ti tirẹ̀.
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: tí ó sì ń pe àwọn ohun tí kò sí bí ẹni pé wọ́n wà
  rationale: A pa ọ̀rọ̀ Gíríìkì tí ó ṣókùnkùn díẹ̀ mọ́, láì sọ ọ́ di ẹ̀kọ́ ìṣẹ̀dá láti inú àìsí ní pàtó nínú ọ̀rọ̀ àkọ́kọ́.
theological_decisions:
- issue: Bóyá a ó tú gbólóhùn ìkẹyìn gẹ́gẹ́ bí ọ̀rọ̀ tààrà nípa dídá ohun láti inú àìsí, tàbí kí a pa ọ̀rọ̀ rẹ̀ mọ́ ní ìtumọ̀ gbòòrò.
  choice: ń pe àwọn ohun tí kò sí bí ẹni pé wọ́n wà
  alternative: ń pe àwọn ohun tí kò sí wá sí ìwàláàyè
  rationale: Gbólóhùn Gíríìkì náà lè ní agbára ìṣẹ̀dá Ọlọ́run nínú, ṣùgbọ́n ọ̀rọ̀ rẹ̀ fúnra rẹ̀ ṣókùnkùn, ó sì ní ààyè fún ìtumọ̀ ju ẹyọ kan lọ. Ọ̀rọ̀ pàtàkì pa ìfọ̀kànbalẹ̀ yẹn mọ́; àlàyé ìtumọ̀ tí ó ṣe pàtó sí i wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àgbàṣe tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ, a sì yẹra fún ọ̀rọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan pàtó. Dídárúkọ Abrahamu nínú gbólóhùn ìbátan náà yọ ìṣòro arọ́pò-orúkọ kúrò ní Yorùbá.
