  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: yo
  text: Nítorí èyí ni ó fi jẹ́ nípa ìgbàgbọ́[a], kí ó lè jẹ́ ní ìbámu pẹ̀lú oore-ọ̀fẹ́, kí ìlérí náà lè dájú fún gbogbo irú-ọmọ[b]—kì í ṣe fún àwọn tí ó jẹ́ ti òfin nìkan, ṣùgbọ́n fún àwọn tí ó ní ìgbàgbọ́ Abrahamu pẹ̀lú[c]. Òun ni baba gbogbo wa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìgbàgbọ́” tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé”; “ìṣòtítọ́” kò fi bẹ́ẹ̀ ṣeé ṣe nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, ọ̀rọ̀ Gíríìkì náà ni “irúgbìn”; níbí ó jẹ́ ọ̀rọ̀ àkójọpọ̀ fún irú-ọmọ tàbí àwọn àtọmọdọ́mọ̀ Abrahamu.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “kì í ṣe fún ẹni tí ó jẹ́ ti òfin nìkan, ṣùgbọ́n fún ẹni tí ó ní ìgbàgbọ́ Abrahamu pẹ̀lú.” Ẹyọ ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ àkójọpọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó pa agbára ìtumọ̀ ìparí-ọ̀rọ̀ náà mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐκ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀, láì sọ ó di iṣẹ́ òfin.
- source_word: ἵνα κατὰ χάριν
  choice: kí ó lè jẹ́ ní ìbámu pẹ̀lú oore-ọ̀fẹ́
  rationale: Ó pa gbólóhùn ète àti ìbáṣepọ̀ rẹ̀ pẹ̀lú oore-ọ̀fẹ́ mọ́.
- source_word: βεβαίαν τὴν ἐπαγγελίαν
  choice: kí ìlérí náà lè dájú
  rationale: “Dájú” sọ pé ìlérí náà dúró ṣinṣin, ó sì ṣeé gbẹ́kẹ̀ lé.
- source_word: παντὶ τῷ σπέρματι
  choice: fún gbogbo irú-ọmọ́
  rationale: “Irú-ọmọ́” lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ fún àwọn àtọmọdọ́mọ̀, bí σπέρμα ṣe rí níbí.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: kì í ṣe fún àwọn tí ó ti inú òfin wá nìkan
  rationale: A lo ọ̀pọ̀ ènìyàn ní Yorùbá láti mú ìtumọ̀ àkójọpọ̀ ti ẹyọ ọ̀rọ̀ Gíríìkì náà ṣe kedere.
- source_word: ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ
  choice: ṣùgbọ́n fún àwọn tí ó ti inú ìgbàgbọ́ Abrahamu wá pẹ̀lú
  rationale: Ó pa ìsopọ̀ genitive “ìgbàgbọ́ Abrahamu” mọ́, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: πατὴρ πάντων ἡμῶν
  choice: Òun ni baba gbogbo wa
  rationale: Ìtumọ̀ yìí sún mọ́ Gíríìkì, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó lọ́nà rere.
theological_decisions:
- issue: Bí a ṣe máa lóye τῷ ἐκ πίστεως Ἀβραάμ.
  choice: àwọn tí ó ti inú ìgbàgbọ́ Abrahamu wá
  alternative: àwọn tí wọ́n ní irú ìgbàgbọ́ Abrahamu
  rationale: Àṣàyàn náà pa àìdánilójú genitive mọ́, kò sì fi “irú” tàbí “pín ìgbàgbọ́ kan náà” kún ohun tí Gíríìkì sọ ní tààrà.
- issue: Ohun tí ó jẹ́ “nípa ìgbàgbọ́” nínú gbólóhùn àkọ́kọ́.
  choice: A pa arọ́pò-orúkọ “ó” mọ́ láì sọ pé ìlérí tàbí ogún ni ní tààrà.
  alternative: ìlérí náà sinmi lórí ìgbàgbọ́
  rationale: Gíríìkì fi ohun tí a ń tọ́ka sí sílẹ̀ fún àyíká ọ̀rọ̀; ìtumọ̀ kò gbọ́dọ̀ yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa oníwọ̀ntúnwọ̀nsì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì yẹ fún kíkà ní gbangba. A lo “oore-ọ̀fẹ́,” “ìgbàgbọ́,” “òfin,” àti “ìlérí” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀, láì mú ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọlé.
