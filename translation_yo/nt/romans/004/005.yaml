id: ROM.4.5
reference: Romans 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: yo
  text: Ṣùgbọ́n fún ẹni tí kò ṣiṣẹ́[a], ṣùgbọ́n tí ó gba Ẹni tí ń dá aláìbọ̀wọ̀ fún Ọlọ́run láre[b] gbọ́, a ka ìgbàgbọ́ rẹ̀ sí òdodo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààràtà: “tí kò ṣiṣẹ́.” Nínú àyíká ọ̀rọ̀ yìí, a fi iṣẹ́ ṣe ìyàtọ̀ sí ìgbàgbọ́; èyí kì í ṣe ìdálẹ́bi gbogbo iṣẹ́.'
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tí ń kéde aláìbọ̀wọ̀ fún Ọlọ́run ní olódodo.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “a kà á” tàbí “a sì í rẹ́kọjá.” Ọ̀rọ̀ náà ní àwòrán fífi ohun kan sínú ìṣírò; “òdodo” ni ìtumọ̀ tó yẹ ní àyíká Pọ́ọ̀lù yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: fún ẹni tí kò gbẹ́kẹ̀ lé iṣẹ́ rẹ̀
  rationale: Ní àríyànjiyàn Róòmù 4, gbólóhùn náà kọ iṣẹ́ sí ìgbàgbọ́, kì í sì í ṣe ìdálẹ́bi gbogbo iṣẹ́. ‘Kò gbẹ́kẹ̀ lé iṣẹ́ rẹ̀’ sọ ìtumọ̀ náà ní Yorùbá àdánidá láì sọ pé ẹni náà kò ṣiṣẹ́ rárá.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: ṣùgbọ́n tí ó gba ... gbọ́
  rationale: ‘Gba ... gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún gbígbàgbọ́ nínú ẹni kan, ó sì lè ní ìtumọ̀ fífi ara lé ẹni náà.
- source_word: τὸν δικαιοῦντα
  choice: ẹni tí ń dá ... láre
  rationale: ‘Dá láre’ pa agbára ìdájọ́ δικαιόω mọ́, ó sì yẹra fún fífi ètò ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ̀ náà.
- source_word: τὸν ἀσεβῆ
  choice: aláìbọ̀wọ̀-fún-Ọlọ́run
  rationale: Àṣàyàn yìí fi àìní ìbẹ̀rù àti ọ̀wọ̀ fún Ọlọ́run hàn ju ‘ẹlẹ́ṣẹ̀’ tàbí ‘ènìyàn búburú’ lọ, nítorí ἀσεβής dojú kọ ìfọkànsìn sí Ọlọ́run.
- source_word: λογίζεται
  choice: a ka ... sí
  rationale: ‘A ka ... sí’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìṣírò tàbí fífi ohun kan sí ipò ohun mìíràn, láì dín àwòrán náà kù sí ètò ìṣúná nìkan.
- source_word: ἡ πίστις αὐτοῦ
  choice: ìgbàgbọ́ rẹ̀
  rationale: ‘Ìgbàgbọ́’ bá ọ̀rọ̀-ìṣe ‘gba ... gbọ́’ mu, ó sì bá ìyàtọ̀ tí Pọ́ọ̀lù fi sáàárín iṣẹ́ àti gbígbàgbọ́ mu.
- source_word: εἰς δικαιοσύνην
  choice: sí òdodo
  rationale: Nínú àkópọ̀ λογίζεται ... εἰς, ‘ka ... sí òdodo’ jẹ́ Yorùbá tí ó ṣe kedere, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ δικαιοσύνη.
theological_decisions:
- issue: Ìtumọ̀ δικαιοῦντα nínú àríyànjiyàn ẹ̀kọ́ Pọ́ọ̀lù
  choice: ẹni tí ń dá ... láre
  alternative: ẹni tí ń kéde ... ní olódodo
  rationale: ‘Dá láre’ pa ìtumọ̀ ìdájọ́ àti ìforígbárí ẹ̀kọ́ ọ̀rọ̀ náà mọ́ láì pinnu gbogbo ohun tí ìdáláre ní nínú ètò ẹ̀kọ́ ìgbàgbọ́ kan.
- issue: Ìtumọ̀ πιστεύω/πίστις
  choice: gba ... gbọ́ / ìgbàgbọ́
  alternative: gbẹ́kẹ̀ lé / ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Ọ̀rọ̀-ìṣe inú ẹsẹ̀ yìí àti ìyàtọ̀ rẹ̀ sí iṣẹ́ tọ́ka sí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé, kì í ṣe ‘ìṣòtítọ́’ ní pàtàkì; àmọ́ fífi ara lé ẹni tí a gbà gbọ́ wà nínú ìtumọ̀ rẹ̀.
- issue: Ìbáṣepọ̀ iṣẹ́ àti ìgbàgbọ́
  choice: kò gbẹ́kẹ̀ lé iṣẹ́ rẹ̀
  alternative: kò ṣiṣẹ́
  rationale: Àṣàyàn pàtàkì náà yẹra fún ìtumọ̀ pé Pọ́ọ̀lù ń gbé àìṣiṣẹ́ lárugẹ; ohun tí àyíká ọ̀rọ̀ ń kọ síra ni iṣẹ́ gẹ́gẹ́ bí ìpìlẹ̀ ẹ̀tọ́ àti ìgbàgbọ́.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ pa ìtumọ̀ ìwà tàbí ipò tó tọ́ mọ́; ‘ìdájọ́ òdodo’ jẹ́ apá mìíràn tí ọ̀rọ̀ Gíríìkì lè ní, ṣùgbọ́n kò yẹ kí a fi ipa yan án nínú ẹsẹ̀ yìí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘aláìbọ̀wọ̀-fún-Ọlọ́run’ láti yà ἀσεβής sọ́tọ̀ kúrò nínú ọ̀rọ̀ gbogbogbò bí ‘ẹlẹ́ṣẹ̀.’
