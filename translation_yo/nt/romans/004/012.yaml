id: ROM.4.12
reference: Romans 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: yo
  text: àti baba àwọn tí a kọlà fún àwọn tí kì í ṣe àwọn tí a kọlà nìkan, ṣùgbọ́n tí wọ́n tún ń tẹ̀lé àwọn ipasẹ̀ ìgbàgbọ́ tí baba wa Ábúráhámù ní nígbà tí a kò tíì kọlà sí i.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: baba àwọn onílà
  rationale: Èyí fi Ábúráhámù hàn gẹ́gẹ́ bí baba àwọn ènìyàn tí a kọ ilà sí ara, dípò bí baba àṣà náà fúnra rẹ̀; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: àwọn tí kì í ṣe onílà lásán
  rationale: Ó pa ìyàtọ̀ tí Pọ́ọ̀lù ṣe mọ́ láàárín jíjẹ́ ẹni tí a kọ ilà sí ara nìkan àti jíjẹ́ ẹni tí ó tún tẹ̀lé ìgbàgbọ́ Ábúráhámù.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: ń rìn ní ipasẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ àwòrán àtẹ̀lé ìṣísẹ̀ ẹlòmíràn; ‘rìn ní ipasẹ̀’ jẹ́ àdàkọ àwòrán náà tó sì bójú mu ní Yorùbá.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí bí Ábúráhámù ṣe gba Ọlọ́run gbọ́, kì í ṣe sí ìṣòtítọ́ rẹ̀ ní pàtàkì.
- source_word: ἐν ἀκροβυστίᾳ
  choice: nígbà tí kò tíì kọ ilà sí ara
  rationale: Ìtumọ̀ àkókò yìí ṣàlàyé ipò Ábúráhámù nígbà tí ó ní ìgbàgbọ́, kí a tó kọ ilà sí ara rẹ̀.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: tí Ábúráhámù baba wa ní
  rationale: Ó tú ìhun gẹnitífù Gíríìkì sí Yorùbá àdánidá, ó sì pa orúkọ oyè àjọṣepọ̀ ‘baba wa’ mọ́.
theological_decisions:
- issue: Bóyá Ábúráhámù jẹ́ baba gbogbo àwọn tí a kọ ilà sí ara láìsí ààlà, tàbí baba àwọn onílà tí wọ́n tún tẹ̀lé ìgbàgbọ́ rẹ̀
  choice: Gbólóhùn náà fi ìdí rẹ̀ múlẹ̀ pé baba ni fún àwọn onílà tí kì í ṣe onílà lásán, ṣùgbọ́n tí wọ́n tún ń rìn ní ipasẹ̀ ìgbàgbọ́ rẹ̀.
  alternative: Ábúráhámù jẹ́ baba gbogbo àwọn onílà láìka ìgbàgbọ́ wọn sí.
  rationale: Ìhun οὐκ… μόνον ἀλλὰ καὶ… fi ààlà sí ẹgbẹ́ àwọn onílà, nípa fífi títẹ̀lé ìgbàgbọ́ Ábúráhámù kún jíjẹ́ onílà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. ‘Kọ ilà sí ara’ ni a lò fún ìkọlà abẹ́ gẹ́gẹ́ bí àṣà ẹ̀sìn; ‘onílà’ mú ọ̀rọ̀ náà ṣókí níbi tí ó tún fara hàn.
