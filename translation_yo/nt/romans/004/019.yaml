id: ROM.4.19
reference: Romans 4:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: yo
  text: Kò sì rẹ̀wẹ̀sì nínú ìgbàgbọ́; ó kíyè sí[a] ara rẹ̀, tí ó ti dà bíi pé ó ti kú—níwọ̀n bí ó ti jẹ́ ẹni bí ọgọ́rùn-ún ọdún—àti ikú ilé-ọmọ Sárà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àṣà àfọwọ́kọ mìíràn ní: “kò kíyè sí ara rẹ̀, tí ó ti dà bíi pé ó ti kú.”'
    reason: textual_variant
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “àìlèlóyún” dípò “ikú ilé-ọmọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας τῇ πίστει
  choice: rẹ̀wẹ̀sì nínú ìgbàgbọ́ rẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Ábúráhámù kò sọ agbára ìgbàgbọ́ rẹ̀ nù; ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ participle náà pẹ̀lú dative ti respect.
- source_word: κατενόησεν
  choice: ó kíyè sí
  rationale: ‘Kíyè sí’ dúró fún fífi ọkàn sí ohun kan tàbí gbígbé e yẹ̀ wò, láìfi ìtumọ̀ ìtúpalẹ̀ tó jinlẹ̀ kún un.
- source_word: νενεκρωμένον
  choice: tí ó ti dà bí ẹni pé ó kú
  rationale: Èyí pa àwòrán ikú mọ́, ṣùgbọ́n ó mú un ṣe kedere pé kì í ṣe ikú ara gangan ni, bí kò ṣe pé ara rẹ̀ kò fẹ́rẹ̀ ní agbára ìbímọ mọ́.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: níwọ̀n bí ó ti jẹ́ ẹni bí ọgọ́rùn-ún ọdún
  rationale: ‘Bí’ ṣe àfihàn ìwọ̀n àfojúsùn inú πού, ‘níwọ̀n bí’ sì so ọjọ́-orí náà mọ́ ìdí tí ara rẹ̀ fi dà bí èyí tó kú.
- source_word: νέκρωσιν τῆς μήτρας Σάρρας
  choice: bí ilé-ọmọ Sárà náà ti kú
  rationale: Ọ̀nà yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ikú àti ìbáramu rẹ̀ pẹ̀lú ara Ábúráhámù mọ́.
theological_decisions:
- issue: Bóyá kí a rọ àwòrán ikú tó kan agbára ìbímọ̀ sí ‘àìlèbímọ’ tàbí ‘àìlèlóyún.’
  choice: 'Pa èdè ikú mọ́ nínú gbólóhùn méjèèjì: ‘tí ó ti dà bí ẹni pé ó kú’ àti ‘bí ilé-ọmọ Sárà náà ti kú.’'
  alternative: Ara Ábúráhámù kò lè bímọ mọ́, ilé-ọmọ Sárà sì yàgàn.
  rationale: Pọ́ọ̀lù mọ̀ọ́mọ̀ lo àwọn ọ̀rọ̀ ikú tó jọra fún ara Ábúráhámù àti ilé-ọmọ Sárà, láti tẹnu mọ́ ohun tí kò ṣeé ṣe lójú ènìyàn ṣùgbọ́n tí ìlérí Ọlọ́run borí.
- issue: Ìyàtọ̀ inú àwọn àfọwọ́kọ nípa bóyá Ábúráhámù ‘kíyè sí’ ara rẹ̀ tàbí ‘kò kíyè sí’ i.
  choice: 'Tẹ̀lé SBLGNT nínú ọ̀rọ̀ àkọ́kọ́: ‘ó kíyè sí.’'
  alternative: ‘Kò kíyè sí ara òun fúnra rẹ̀, tí ó ti dà bí ẹni pé ó kú.’
  rationale: Ẹ̀rí àkọ́kọ́ tí a pèsè ní κατενόησεν láìsí οὐ; a pa ìtumọ̀ àṣà àfọwọ́kọ kejì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. ‘Rẹ̀wẹ̀sì nínú ìgbàgbọ́’ àti ‘kíyè sí’ rọrùn fún òǹkàwé lasán, nígbà tí àwòrán ikú inú Gíríìkì ṣì dúró kedere. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
