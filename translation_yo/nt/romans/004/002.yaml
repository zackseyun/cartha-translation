reference: Romans 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: yo
  text: Nítorí bí a bá dá Ábúráhámù láre[a] nítorí àwọn iṣẹ́, ó ní ohun tí ó lè fi yangàn[b]; ṣùgbọ́n kì í ṣe níwájú Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “kéde Ábúráhámù ní olódodo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “ó ní ìdí láti fi yangàn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” pa ìsopọ̀ γάρ mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú, “bí” sì gbé àbá oníṣ شرط εἰ kalẹ̀ láì fi ìtumọ̀ míì kún un.
- source_word: Ἀβραὰμ
  choice: Ábúráhám
  rationale: Èyí ni àkọtọ̀ orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ἐξ ἔργων
  choice: nítorí àwọn iṣẹ́ rẹ̀
  rationale: Ó sọ àwọn iṣẹ́ di ìpìlẹ̀ tàbí ìdí fún dídá láre; “rẹ̀” mú ẹni tí iṣẹ́ náà jẹ́ hàn ní Yorùbá láì yí ìtumọ̀ Gíríìkì padà.
- source_word: ἐδικαιώθη
  choice: a bá dá … láre
  rationale: “Dá … láre” jẹ́ ọ̀nà àdánidá láti sọ ìṣe ìdájọ́ pé ẹni kan jẹ́ olódodo tàbí kò lẹ́bi, ó sì pa ohùn àfarawà Gíríìkì mọ́.
- source_word: ἔχει καύχημα
  choice: ó ní ohun tí ó lè fi yangàn
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún jíjẹ́ pé ó ní ìpìlẹ̀ tàbí ohun ìyangàn, ó sì pa agbára orúkọ καύχημα mọ́.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: ṣùgbọ́n kì í ṣe níwájú Ọlọ́run
  rationale: “Níwájú Ọlọ́run” sọ ìdíwọ̀n tàbí ìwòye Ọlọ́run ní ọ̀nà tí ó mọ́gbọ́n dání, láì pinnu ohun tí gbolohun kúkúrú náà kò sọ ní kedere.
theological_decisions:
- issue: Bóyá àbá náà jẹ́ ohun tó ṣẹlẹ̀ gan-an tàbí àbá ìjiyàn nìkan
  choice: “bí a bá dá Ábúráhám láre”
  alternative: “bí a bá ti dá Ábúráhám láre” tàbí “ká ní a dá Ábúráhám láre”
  rationale: A tú ìpèníjà εἰ jáde ní tààràtà, láì fi èrò pé ó ṣẹlẹ̀ gan-an tàbí pé kò ṣeé ṣe rárá sínú ọ̀rọ̀ náà; èyí pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́.
- issue: Ìtumọ̀ ἐδικαιώθη gẹ́gẹ́ bí ìdájọ́ tàbí mímú ènìyàn di olódodo
  choice: “dá … láre”
  alternative: “kéde … ní olódodo”
  rationale: “Dá láre” lè gbé agbára ìdájọ́ ọ̀rọ̀ náà, ṣùgbọ́n a fi àṣàyàn “kéde ní olódodo” sínú àlàyé láti pa ààyè ìtumọ̀ Gíríìkì mọ́ láì gbé ẹ̀kọ́ ẹgbẹ́ ìjọ kan wọlé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “dá láre” fún ọ̀rọ̀ ìdájọ́, “ohun tí ó lè fi yangàn” sì jẹ́ ọ̀nà àdánidá láti gbé gbolohun Gíríìkì kúkúrú náà jáde. Gbogbo àmì àlàyé [a], [b] wà nínú ọ̀rọ̀ pàtàkì.
