revisions:
- from: Nítorí bí a bá dá Ábúráhám láre nítorí àwọn iṣẹ́ rẹ̀,[a] ó ní ohun tí ó lè fi yangàn;[b] ṣùgbọ́n kì í ṣe níwájú Ọlọ́run.
  to: Nítorí bí a bá dá Ábúráhámù láre[a] nítorí àwọn iṣẹ́, ó ní ohun tí ó lè fi yangàn[b]; ṣùgbọ́n kì í ṣe níwájú Ọlọ́run.
  rationale: The revision relocates note [a] to “dá ... láre,” the expression corresponding to ἐδικαιώθη, and removes the unexpressed possessive from “àwọn iṣẹ́.” It also uses the conventional Yoruba biblical form “Ábúráhámù.” The conditional construction, judicial terminology, boast language, and the deliberately terse final contrast remain intact.
