source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: yo
  text: Ǹjẹ́, kí ni tí a óò sọ pé Abrahamu, baba ìran wa nípa ti ara[a], ti rí?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó túbọ̀ ṣe déédéé: “baba ìran wa nípa ìbímọ̀.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ó ṣeé ṣe láti so “nípa ti ara” mọ́ “ti rí,” ìyẹn ni pé: “Kí ni Abrahamu ti rí nípa ti ara?”—nípasẹ̀ agbára ènìyàn tàbí lójú ìwòye ti ènìyàn.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Ǹjẹ́, kí ni àwa yóò sọ
  rationale: “Ǹjẹ́” ṣe iṣẹ́ οὖν gẹ́gẹ́ bí ọ̀rọ̀ ìyípadà nínú àríyànjiyàn, “kí ni àwa yóò sọ” sì pa ìbéèrè ìmọ̀ràn tí Pọ́ọ̀lù ń béèrè mọ́.
- source_word: εὑρηκέναι
  choice: ti rí
  rationale: Àmì ìṣe “ti” fi abajade ìṣe tí ó ti ṣẹlẹ̀ hàn, ó sì bá perfect infinitive náà mu láì fi ìtumọ̀ “ṣàwárí” kún un.
- source_word: προπάτορα
  choice: baba ńlá
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún baba ìran tàbí baba ńlá, ó sì pa ìtọ́ka ọkùnrin ẹyọ kan nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἡμῶν
  choice: wa
  rationale: A fi í hàn gbangba láti pa bí Pọ́ọ̀lù ṣe ka ara rẹ̀ mọ́ àwọn tí Abrahamu jẹ́ baba ìran wọn mọ́.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: Nínú àyíká yìí, ó tọ́ka sí ìbátan nípa ìran ti ara, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀; gbolohun yìí tún pa ìṣọ̀kan pẹ̀lú ìlò “ara” nínú Róòmù mọ́.
theological_decisions:
- issue: Ohun tí κατὰ σάρκα ń ṣàlàyé
  choice: A so “nípa ti ara” mọ́ “baba ńlá wa,” kí ó túmọ̀ sí ìbátan nípa ìran ti ara.
  alternative: A lè so ó mọ́ “ti rí,” kí ìtumọ̀ náà jẹ́ ohun tí Abrahamu rí nípasẹ̀ agbára ènìyàn tàbí lójú ìwòye ti ènìyàn.
  rationale: Ìṣàn gbolohun náà lè jẹ́ kí ó ṣàlàyé ipò Abrahamu gẹ́gẹ́ bí baba ìran; síbẹ̀, ìṣètò ọ̀rọ̀ Gíríìkì gba ìtumọ̀ kejì láyè, nítorí náà a ṣàkọsílẹ̀ rẹ̀ dípò kí a pa àìdánilójú gidi náà rẹ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. “Ǹjẹ́” àti “àwa yóò sọ” pa ìrísí ìbéèrè àríyànjiyàn Pọ́ọ̀lù mọ́; a lo àmì ohùn níbi tí ó bá yẹ.
