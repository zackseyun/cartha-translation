  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: yo
  text: Ẹni tí a fi lé lọ́wọ́ nítorí àwọn ìrékọjá wa, tí a sì jí dìde fún ìdáláre wa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ìdáláre wa.”
    reason: alternative_reading
  - marker: b
    text: “Ìdáláre” tún lè túmọ̀ sí “dídá wa láre” tàbí “kíkà wa sí olódodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: a fi lé wọn lọ́wọ́
  rationale: Ó pa ìṣe àìṣe-ẹni-náà mọ́, ó sì túmọ̀ sí pé a fi Kristi lé àwọn tí yóò pa á lọ́wọ́; ọ̀rọ̀ náà tún jẹ́ kí agbára ìtumọ̀ pé Ọlọ́run ni olùṣe tí a kò dárúkọ dúró.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: nítorí àwọn àṣìṣe wa
  rationale: διά pẹ̀lú accusative ní gbólóhùn àkọ́kọ́ ní ìtumọ̀ ohun tó fa ìṣẹ̀lẹ̀; “nítorí” sọ ìbáṣepọ̀ yìí jáde ní Yorùbá adayeba.
- source_word: παραπτώματα
  choice: àwọn àṣìṣe
  rationale: “Àṣìṣe” níbí ń tọ́ka sí ìwà ẹ̀ṣẹ̀ àti yíyapa kúrò ní ọ̀nà tó tọ́, kì í ṣe àṣìṣe aláìmọ̀ọ́mọ̀ lásán; ó sì yàtọ̀ díẹ̀ sí ọ̀rọ̀ gbogbogbò “ẹ̀ṣẹ̀.”
- source_word: ἠγέρθη
  choice: a jí dìde
  rationale: Ìtumọ̀ yìí pa irú ọ̀rọ̀ passive Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún jíjí Kristi dìde.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: fún ìdáláre wa
  rationale: “Fún” jẹ́ kí ìtumọ̀ ète tàbí àbájáde tí ó wọ́pọ̀ jù lọ nínú àyíká yìí hàn, láìpa ìtumọ̀ ohun tó fa ìṣẹ̀lẹ̀ tí gírámà náà tún lè gbà mọ́; a fi èyí sínú àlàyé ìsàlẹ̀.
- source_word: δικαίωσιν
  choice: ìdáláre
  rationale: '“Ìdáláre” pa agbára ọ̀rọ̀ ilé-ẹjọ́ δικαίωσις mọ́: yíyan ènìyàn láre tàbí kíkà á sí olódodo, dípò ìtumọ̀ gbogbogbò bí ìgbàlà.'
theological_decisions:
- issue: Bóyá διὰ τὴν δικαίωσιν ἡμῶν túmọ̀ sí ète/àbájáde (“fún ìdáláre wa”) tàbí ohun tó fa ìṣẹ̀lẹ̀ (“nítorí ìdáláre wa”).
  choice: fún ìdáláre wa
  alternative: nítorí ìdáláre wa
  rationale: Àkọ́kọ́ bá ìbáṣepọ̀ ikú àti àjíǹde Kristi pẹ̀lú ìdáláre àwọn onígbàgbọ́ mu dáadáa, ṣùgbọ́n διά pẹ̀lú accusative tún lè jẹ́ ti ohun tó fa ìṣẹ̀lẹ̀; nítorí náà, a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó ṣeé lóye fún gbogbo ènìyàn ni a lò. “A fi lé wọn lọ́wọ́” àti “a jí dìde” pa passive Gíríìkì mọ́ ní ọ̀nà adayeba. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
