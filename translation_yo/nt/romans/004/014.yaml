  to: Nítorí bí àwọn tí í ṣe ti òfin bá jẹ́ ajogún, ìgbàgbọ́ ti di asán,[a] ìlérí náà sì ti di aláìní ipa.[b]
  rationale: Àtúnṣe náà rọ́pò ìsọ̀rọ̀ “láàbẹ́ òfin,” tí ó lè ṣàlàyé οἱ ἐκ νόμου ju bó ṣe yẹ lọ, pẹ̀lú “tí í ṣe ti òfin,” tí ó pa ìtumọ̀ Paulù mọ́ nípasẹ̀ ọ̀nà Yorùbá àdánidá. Ó tún rọ́pò “aláìléṣe” pẹ̀lú “aláìní ipa” kí ó lè fi κατήργηται hàn gẹ́gẹ́ bí ohun tí a ti mú di aláìṣiṣẹ́ tàbí aláìní èso, kì í ṣe ohun tí kò ṣeé ṣe.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:12Z'
