id: ROM.4.14
reference: Romans 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: yo
  text: Nítorí bí àwọn tí í ṣe ti òfin bá jẹ́ ajogún, ìgbàgbọ́ ti di asán,[a] ìlérí náà sì ti di aláìní ipa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ ti di òfo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ti sọ ìlérí náà di asán,” tàbí “ìlérí náà ti di ohun tí kò ṣiṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: àwọn tí ó wà lábẹ́ òfin
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn ènìyàn tí ìbáṣepọ̀ wọn pẹ̀lú òfin ń dá wọn mọ̀, láìfi kún un pé kìkì àwọn olùpa òfin ni.
- source_word: κληρονόμοι
  choice: ajogún
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ó ní ẹ̀tọ́ sí ogún; ó bá àyíká ogún àti ìlérí mu.
- source_word: κεκένωται
  choice: a ti sọ ... di asán
  rationale: Ó pa àwòrán ohun tí a sọ di òfo tàbí aláìní agbára mọ́, ó sì fi ipò tí ìṣe náà ti mú wá hàn.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún πίστις ní àyíká ìyàtọ̀ láàárín ìgbàgbọ́ àti òfin nínú Róòmù 4.
- source_word: κατήργηται
  choice: a ti sọ ... di aláìléṣe
  rationale: Ó túmọ̀ sí pé a ti mú ohun náà má ṣiṣẹ́ tàbí má ní ipa, láìsọ pé a ti pa á run pátápátá.
- source_word: ἐπαγγελία
  choice: ìlérí náà
  rationale: Ó tọ́ka sí ìlérí pàtó tí Pọ́ọ̀lù ti ń sọ̀rọ̀ nípa rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πίστις níbi tí Pọ́ọ̀lù ti fi í wé νόμος
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àríyànjiyàn Róòmù 4 ń sọ nípa ogún tí a rí nípasẹ̀ ìgbàgbọ́ ní ìyàtọ̀ sí èyí tí ó jẹ́ láti inú òfin; “ìgbàgbọ́” pa ìlànà ọ̀rọ̀ náà mọ́ láìyanju gbogbo ìtumọ̀ ọ̀rọ̀ náà ní ibòmíràn.
- issue: Ìtumọ̀ οἱ ἐκ νόμου
  choice: àwọn tí ó wà lábẹ́ òfin
  alternative: àwọn tí í ṣe ti òfin; àwọn tí wọ́n gbé ayé nípa òfin
  rationale: Yíyan “lábe òfin” mú ìbáṣepọ̀ àwọn ènìyàn náà pẹ̀lú òfin hàn ní Yorùbá àdánidá, ṣùgbọ́n kò dín gbólóhùn náà kù sí pípa òfin mọ́ nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìṣètò ìdí–àbájáde Gíríìkì mọ́, ṣùgbọ́n ó lo àkópọ̀ ọ̀rọ̀ tí ó ṣe kedere fún òǹkàwé Yorùbá.
