  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: yo
  text: Alábùkún ni àwọn tí a ti dárí àwọn ìṣe àìlófin wọn jì[a], tí a sì ti bo àwọn ẹ̀ṣẹ̀ wọn mọ́lẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a ti dárí àwọn àìṣedéédé wọn jì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Alábùkún ni àwọn
  rationale: Ó pa ìtumọ̀ ìkéde pé Ọlọ́run ti bù kún wọn mọ́, dípò kí ó túmọ̀ sí ìmọ̀lára ayọ̀ nìkan.
- source_word: ἀφέθησαν
  choice: a ti dárí ... jì
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìdáríjì, ó sì fi hàn pé ìṣe náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì dúró.
- source_word: ἀνομίαι
  choice: àwọn ìwà àìlófin
  rationale: Ó mú èrò ìrúfin tàbí ṣíṣe lòdì sí òfin jáde, ó sì yàtọ̀ sí ọ̀rọ̀ gbogbogbò fún ẹ̀ṣẹ̀.
- source_word: ἐπεκαλύφθησαν
  choice: a ti bo ... mọ́lẹ̀
  rationale: Ó pa àwòrán inú ọ̀rọ̀ Gíríìkì àti inú Sáàmù 32:1 mọ́, láì sọ àwòrán náà di àlàyé.
- source_word: ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere fún ἁμαρτίαι.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ἀνομίαι àti ἁμαρτίαι
  choice: Lo “àwọn ìwà àìlófin” àti “àwọn ẹ̀ṣẹ̀” lọ́tọ̀ọ̀tọ̀.
  alternative: Túmọ̀ àwọn méjèèjì sí “ẹ̀ṣẹ̀.”
  rationale: Ọ̀rọ̀ náà fi ìlà ewì méjì tó jọra hàn, ṣùgbọ́n ó lo ọ̀rọ̀ méjì tí ìtumọ̀ wọn sún mọ́ra láì jẹ́ ọ̀kan náà. Ìtumọ̀ yìí pa ìyàtọ̀ náà mọ́ láì fi ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ tó le ju ti orísun lọ kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “bo ... mọ́lẹ̀” láti pa àkàwé orísun mọ́.
