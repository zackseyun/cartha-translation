  to: Ṣùgbọ́n ní ti ìlérí Ọlọ́run, kò ṣiyèméjì nínú àìgbàgbọ́;[a] dípò bẹ́ẹ̀, a fún un ní agbára nínú ìgbàgbọ́,[b] ó sì fi ògo fún Ọlọ́run.
