  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti ìlérí Ọlọ́run, kò ṣiyèméjì nínú àìgbàgbọ́;[a] dípò bẹ́ẹ̀, a fún un ní agbára nínú ìgbàgbọ́,[b] ó sì fi ògo fún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò ṣiyèméjì nítorí àìgbàgbọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a fún un ní agbára nípasẹ̀ ìgbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Ṣùgbọ́n ní ti ìlérí Ọlọ́run
  rationale: “Ní ti” fi ìtumọ̀ ìtọ́kasí εἰς hàn, “ṣùgbọ́n” sì pa ìyàtọ̀ tí δέ ń mú wá mọ́; “ìlérí” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ἐπαγγελία.
- source_word: οὐ διεκρίθη τῇ ἀπιστίᾳ
  choice: kò ṣiyèméjì nítorí àìgbàgbọ́
  rationale: “Ṣiyèméjì” mú ìtumọ̀ ṣíṣiyèméjì tàbí yíyẹsẹ̀ kúrò ní ìdánilójú tí διακρίνω ní nínú àyíká yìí; “nítorí àìgbàgbọ́” fi ipa dative τῇ ἀπιστίᾳ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἀλλὰ ἐνεδυναμώθη τῇ πίστει
  choice: dípò bẹ́ẹ̀, ó di alágbára nínú ìgbàgbọ́
  rationale: “Dípò bẹ́ẹ̀” fi ìtakora ἀλλά hàn. “Ó di alágbára” jẹ́ ọ̀nà àdánidá láti sọ passive ἐνεδυναμώθη láì pinnu ẹni tó fún un ní agbára; “nínú ìgbàgbọ́” pa ìtumọ̀ sphere dative mọ́, bí ó tilẹ̀ jẹ́ pé a tún lè lóye rẹ̀ gẹ́gẹ́ bí ohun èlò.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: ó sì fi ògo fún Ọlọ́run
  rationale: Ọ̀rọ̀ yìí sọ ìṣe tó bá fífi agbára mú un rìn; ìsopọ̀ pẹ̀lú “ó sì” jẹ́ àdánidá ní Yorùbá, ó sì pa ìbáṣepọ̀ participle mọ́.
theological_decisions:
- issue: Bóyá διακρίνω túmọ̀ sí iyèméjì ọpọlọ lásán tàbí yíyẹsẹ̀ nínú ìgbẹ́kẹ̀lé
  choice: kò ṣiyèméjì nítorí àìgbàgbọ́
  alternative: kò yẹsẹ̀ nínú àìgbàgbọ́
  rationale: “Ṣiyèméjì” jẹ́ èdè Yorùbá tó ṣe kedere, ó sì lè gba ìtumọ̀ iyèméjì àti àìdúróṣinṣin; kò fi ẹsẹ̀ náà mọ́ ìmọ̀ ọpọlọ nìkan.
- issue: Bóyá τῇ πίστει jẹ́ sphere tàbí means
  choice: nínú ìgbàgbọ́
  alternative: nípasẹ̀ ìgbàgbọ́
  rationale: “Nínú ìgbàgbọ́” bá ìtakora pẹ̀lú àìgbàgbọ́ mu, kò sì sọ ipa ìgbàgbọ́ di ohun èlò nìkan; àfikún ìsàlẹ̀ ojú ìwé pa àṣàyàn means mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “ṣiyèméjì” fún ìṣàn àdánidá, “ó di alágbára” láti pa ohùn passive mọ́ láì ṣàfikún olùṣe tí Gíríìkì kò dárúkọ, àti “fi ògo fún Ọlọ́run” gẹ́gẹ́ bí àṣà ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
