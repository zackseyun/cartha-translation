id: ROM.4.10
reference: Romans 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: yo
  text: Ǹjẹ́, báwo ni a ṣe kà á fún un[a]? Ṣé nígbà tí a ti kọ ọ́ ní ilà ni, àbí nígbà tí a kò tíì kọ ọ́ ní ilà? Kì í ṣe nígbà tí a ti kọ ọ́ ní ilà, bí kò ṣe nígbà tí a kò tíì kọ ọ́ ní ilà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ṣe ìṣirò rẹ̀ fún un” tàbí “a gbà á fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: báwo ni
  rationale: Ó jẹ́ ọ̀rọ̀ ìbéèrè nípa bí ìkà-sí náà ṣe wáyé; “báwo ni” jẹ́ Yorùbá àdánidá tí ó pa ìbéèrè Pọ́ọ̀lù mọ́.
- source_word: οὖν
  choice: Ǹjẹ́
  rationale: Ó so ìbéèrè yìí mọ́ àríyànjiyàn tó ṣáájú, ó sì mú un jáde gẹ́gẹ́ bí ìbéèrè ìparí èrò; “Ǹjẹ́” ṣe iṣẹ́ yìí lọ́nà àdánidá ní Yorùbá.
- source_word: ἐλογίσθη
  choice: a ṣe kà á sí i
  rationale: Yorùbá kì í lo ọ̀nà àìṣe bí Gíríìkì ní gbogbo ibi; lílo “a” gẹ́gẹ́ bí olùṣe àìdásí-orúkọ pa ìtumọ̀ “a kà á fún un” mọ́, láìfi èrò ìṣúná kun ọ̀rọ̀ náà.
- source_word: ἐν περιτομῇ ὄντι
  choice: nígbà tí a ti kọ ọ́ ní ilà
  rationale: Gbólóhùn Gíríìkì ń tọ́ka sí ipò àti àkókò tí Ábúráhámù ti kọ ilà; ọ̀nà yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἀκροβυστίᾳ
  choice: nígbà tí a kò tíì kọ ọ́ ní ilà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ipò ẹni tí kò tíì kọ ilà. “Kò tíì” mú ìyàtọ̀ àkókò náà hàn kedere.
- source_word: οὐκ ... ἀλλ’
  choice: Kì í ṣe ... bí kò ṣe ...
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ìtakora tó lágbára, ó sì pa ìtẹnumọ́ Pọ́ọ̀lù mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá boṣewa, tó ṣe kedere, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Kọ ọ́ ní ilà” jẹ́ ọ̀nà tí òǹkàwé Yorùbá lónìí lè lóye fún ìkọlà, “kò tíì” sì pa ìtẹnumọ́ àkókò inú àríyànjiyàn náà mọ́.
