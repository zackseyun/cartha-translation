  to: Ǹjẹ́, báwo ni a ṣe kà á fún un[a]? Ṣé nígbà tí a ti kọ ọ́ ní ilà ni, àbí nígbà tí a kò tíì kọ ọ́ ní ilà? Kì í ṣe nígbà tí a ti kọ ọ́ ní ilà, bí kò ṣe nígbà tí a kò tíì kọ ọ́ ní ilà.
