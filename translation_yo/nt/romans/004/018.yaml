id: ROM.4.18
reference: Romans 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: yo
  text: Ẹni náà, lódì sí ìrètí, ní ìrètí ó gbàgbọ́, kí ó lè di baba àwọn orílẹ̀-èdè púpọ̀[c], gẹ́gẹ́ bí ohun tí a ti sọ pé, “Bẹ́ẹ̀ ni irú-ọmọ rẹ yóò rí.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ní tààràtà, “irúgbìn rẹ”; ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ kan, ṣùgbọ́n ó ń tọ́ka sí gbogbo irú-ọmọ lápapọ̀.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ yìí wá láti Gẹnẹsisi 15:5; tún wo Gẹnẹsisi 17:5.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: láìsí ohun tí ó lè mú un ní ìrètí
  rationale: Ọ̀rọ̀ yìí fi hàn pé kò sí ìdí tí ènìyàn lè fi retí ohun náà nípa ipò àdánidá. Èyí mú ìtakora tó wà nínú gbólóhùn Gíríìkì jáde lọ́nà Yorùbá tó ṣe kedere, láìsọ pé Ábúráhámù kò ní ìrètí rárá.
- source_word: ἐπ’ ἐλπίδι
  choice: pẹ̀lú ìrètí
  rationale: Èyí pa ìyàtọ̀ mọ́ láàárín àìsí ìdí àdánidá fún ìrètí àti ìrètí tí Ábúráhámù ní nígbà tó gbàgbọ́.
- source_word: ἐπίστευσεν
  choice: ó gbàgbọ́
  rationale: Ìtumọ̀ yìí bá lílo πιστεύω mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún gbígba ohun tàbí ẹni kan gbọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: kí ó lè di
  rationale: Ó pa agbára ète tàbí àbájáde inú εἰς τό pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni mọ́, láìyanju bóyá ète tàbí àbájáde ni a fẹ́ tẹnu mọ́ jù.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: baba orílẹ̀-èdè púpọ̀
  rationale: “Orílẹ̀-èdè” ń tọ́ka sí àwọn ẹgbẹ́ ènìyàn inú ìlérí Ábúráhámù, dípò kíkó ìtumọ̀ “Kèfèrí” wọ inú ọ̀rọ̀ náà.
- source_word: κατὰ τὸ εἰρημένον
  choice: gẹ́gẹ́ bí a ti sọ pé
  rationale: Ó jẹ́ Yorùbá àdánidá tó tún pa ìtọ́kasí sí ọ̀rọ̀ tí a ti sọ tẹ́lẹ̀, tí ó sì ṣì ní agbára, mọ́.
- source_word: Οὕτως ἔσται
  choice: Bẹ́ẹ̀ ni ... yóò rí
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó lọ́lá, tó sì bá ìlérí ọjọ́ iwájú inú àyọlò Ìwé Mímọ́ mu.
- source_word: τὸ σπέρμα σου
  choice: irú-ọmọ rẹ
  rationale: “Irú-ọmọ” jẹ́ ọ̀rọ̀ Yorùbá tó lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀ fún àwọn ọmọ-ọmọ, ó sì sún mọ́ àwòrán σπέρμα ju “àwọn àtọmọdọ́mọ” lọ.
theological_decisions:
- issue: Ohun tí “ọ̀pọ̀ ἔθνη” ń tọ́ka sí nínú ìlérí Ábúráhámù
  choice: orílẹ̀-èdè púpọ̀
  alternative: àwọn Kèfèrí; àwọn ènìyàn púpọ̀
  rationale: Níhìn-ín Pọ́ọ̀lù ń lo èdè ìlérí Ábúráhámù nínú Gẹnẹsisi. “Orílẹ̀-èdè” pa ààyè ìlérí náà mọ́, kò sì fi ìyàtọ̀ Júù àti Kèfèrí tí Pọ́ọ̀lù máa ń lò ní àwọn ibòmíràn lé ẹsẹ̀ yìí lórí.
- issue: Ìbáṣepọ̀ εἰς τὸ γενέσθαι pẹ̀lú ìgbàgbọ́ Ábúráhámù
  choice: kí ó lè di
  alternative: tó fi di; èyí sì yọrí sí pé ó di
  rationale: Ẹ̀ka Gíríìkì lè ní agbára ète tàbí àbájáde. “Kí ó lè di” pa ìfojúsọ́nà ìlérí náà mọ́ láìfi dandan sọ pé ìgbàgbọ́ Ábúráhámù fúnra rẹ̀ ló fa ìmúṣẹ rẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A pa àfiwé ìtakora ìrètí mọ́, a sì lo “irú-ọmọ” láti mú àwòrán ọ̀rọ̀ àpapọ̀ tó jẹ́ ẹyọ kan hàn. Àwọn àmì ohùn àti àmì abẹ́lẹ̀ Yorùbá ni a fi sí ibi tó yẹ.
