id: ROM.4.15
reference: Romans 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: yo
  text: Nítorí òfin[a] ń mú ìbínú wá; ṣùgbọ́n níbi tí kò sí òfin, ìrékọjá[b] kò sí pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Òfin náà ń mú ìbínú wá.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìrúfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: òfin
  rationale: “Òfin” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún νόμος, ó sì pa ìtumọ̀ rẹ̀ mọ́ láì fi dandan dín un kù sí Òfin Mósè nìkan.
- source_word: ὀργή
  choice: ìbínú Ọlọ́run
  rationale: Nínú àríyànjiyàn Pọ́ọ̀lù, ὀργή ní ìwọ̀n ìdájọ́ àti ti ẹ̀kọ́ nípa Ọlọ́run; fífi “Ọlọ́run” kún un mú ẹni tí ìbínú náà jẹ́ tirẹ̀ yé kedere nínú Yorùbá.
- source_word: κατεργάζεται
  choice: ń mú ... wá
  rationale: Ọ̀rọ̀ yìí sọ ìyọrísí tàbí ohun tí òfin ń fà; “ń mú ... wá” jẹ́ èdè Yorùbá ti òde òní tí ó ṣe kedere.
- source_word: οὗ δὲ
  choice: ṣùgbọ́n níbi tí
  rationale: Ó pa ìtumọ̀ ibi tí οὗ ní àti ìyàtọ̀ díẹ̀ tí δέ ń fi hàn mọ́.
- source_word: παράβασις
  choice: ìrékọjá òfin
  rationale: Yíyan yìí fi hàn pé ohun tí a ń sọ ni líla ààlà tàbí rú àṣẹ tí òfin ti fi lélẹ̀, kì í ṣe ẹ̀ṣẹ̀ ní ìtumọ̀ gbogbogbòò.
- source_word: οὐδὲ
  choice: kò sí pẹ̀lú
  rationale: “Pẹ̀lú” mú agbára ‘neither/also not’ ti οὐδὲ hàn ní Yorùbá láì mú gbólóhùn náà le.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ νόμος nínú àríyànjiyàn Pọ́ọ̀lù
  choice: òfin
  alternative: Òfin Mósè
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa ìlànà gbogbogbòò tí Pọ́ọ̀lù ń sọ mọ́, láì pinnu pé Òfin Mósè nìkan ni ó ní lọ́kàn, bó tilẹ̀ jẹ́ pé Òfin Mósè wà lẹ́yìn àríyànjiyàn náà.
- issue: Ẹni tí ὀργή jẹ́ tirẹ̀
  choice: ìbínú Ọlọ́run
  alternative: ìbínú
  rationale: Àyíká Róòmù 4 àti lílo ọ̀rọ̀ náà lọ́dọ̀ Pọ́ọ̀lù tọ́ka sí ìbínú Ọlọ́run nínú ìdájọ́; síbẹ̀, orúkọ “Ọlọ́run” kò fara hàn ní Gíríìkì, nítorí náà àlàyé ìsàlẹ̀ fi èyí hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbòò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá. Gbólóhùn náà tẹ̀ lé ìṣàn àríyànjiyàn Gíríìkì, ó sì pa ìyàtọ̀ láàárín òfin àti ìrékọjá òfin mọ́.
