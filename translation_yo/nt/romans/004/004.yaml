  to: Ní ti ẹni tí ó ń ṣiṣẹ́, a kò ka owó iṣẹ́ sí ohun tí a fi oore-ọ̀fẹ́ fún un,[a] bí kò ṣe sí ohun tí ó yẹ kí a san fún un.[b]
  rationale: 'Àtúnṣe náà ń pa ìtumọ̀ gírámà àti àwòrán ìṣírò inú ọ̀rọ̀ Gíríìkì mọ́: owó iṣẹ́ ni a kà, kì í ṣe gẹ́gẹ́ bí oore-ọ̀fẹ́, ṣùgbọ́n gẹ́gẹ́ bí ohun tí ó yẹ kí a san. “Ní ti” ń ṣàfihàn ìṣípadà δέ láìsọ ọ́ di ìyàtọ̀ tó lágbára ju. Àwọn ìsàlẹ̀-ẹsẹ̀ ń tọ́ka sí ibi tí ó yẹ, wọ́n sì ń pèsè àwọn ìtumọ̀ gangan láìsọ ìtumọ̀ ara-ẹsẹ̀ di aláìdánidá.'
