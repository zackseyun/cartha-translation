  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: yo
  text: Ní ti ẹni tí ó ń ṣiṣẹ́, a kò ka owó iṣẹ́ sí ohun tí a fi oore-ọ̀fẹ́ fún un,[a] bí kò ṣe sí ohun tí ó yẹ kí a san fún un.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí oore-ọ̀fẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “gẹ́gẹ́ bí gbèsè,” tàbí “gẹ́gẹ́ bí ohun tí a jẹ ẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: ẹni tí ó ń ṣiṣẹ́
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláfikún ọ̀rọ̀-ìṣe yìí ń tọ́ka ní gbogbogbò sí ẹni tí ó ń ṣiṣẹ́; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: μισθὸς
  choice: owó iṣẹ́ rẹ̀
  rationale: Nínú àyíká iṣẹ́ àti sísan owó, ‘owó iṣẹ́’ fi hàn kedere pé èrè tí ẹni náà tọ́ sí nítorí iṣẹ́ ni, kì í ṣe ẹ̀bùn gbogbogbò.
- source_word: λογίζεται
  choice: a kò ka ... sí
  rationale: ‘Ka ... sí’ jẹ́ ọ̀nà Yorùbá tí ó bá àwòrán ìṣírò tàbí fífi nǹkan sínú àkọọ́lẹ̀ mu, láìfi ìtumọ̀ míì kún un.
- source_word: κατὰ χάριν
  choice: sí oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ pa ọ̀rọ̀ χάρις àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé ohun tí a kò rí gbà nítorí iṣẹ́ ni.
- source_word: ὀφείλημα
  choice: sí gbèsè—ohun tí a jẹ ẹ́ ní gbèsè
  rationale: ‘Gbèsè’ jẹ́ ìbámu pẹ̀lú ọ̀rọ̀ orísun, àfikún ṣókí náà sì mú kedere pé owó tí ó tọ́ sí òṣìṣẹ́ ni, kì í ṣe gbèsè òṣìṣẹ́ fún ẹlòmíràn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń so gbólóhùn yìí mọ́ èyí tí ó ṣáájú, ó sì ní agbára ìyàtọ̀ díẹ̀; ‘Ṣùgbọ́n’ mú ìyàtọ̀ náà hàn láìfi ìtumọ̀ àkókò kún un.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ χάρις nínú ìyàtọ̀ láàárín owó iṣẹ́ àti ohun tí a kò rí gbà nítorí iṣẹ́
  choice: oore-ọ̀fẹ́
  alternative: ẹ̀bùn
  rationale: ‘Oore-ọ̀fẹ́’ pa ọ̀rọ̀ pàtàkì Pọ́ọ̀lù mọ́, ó sì yàgò fún pípa ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ kúrò. Ẹsẹ náà fúnra rẹ̀ mú ìtumọ̀ ohun tí a kò rí gbà nítorí iṣẹ́ hàn nípasẹ̀ ìyàtọ̀ rẹ̀ sí gbèsè.
- issue: Bí a ṣe máa fi ὀφείλημα hàn
  choice: gbèsè—ohun tí a jẹ ẹ́ ní gbèsè
  alternative: ọ̀ranyàn
  rationale: ‘Gbèsè’ pa àwòrán ohun tí ó yẹ kí a san mọ́; ìṣàlàyé kékeré náà dènà àìgbọ́ye nípa ẹni tí ó jẹ gbèsè náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì lo ‘owó iṣẹ́’ àti ‘ka ... sí’ láti mú àwòrán iṣẹ́ àti ìṣírò inú ọ̀rọ̀ orísun yé kedere.
