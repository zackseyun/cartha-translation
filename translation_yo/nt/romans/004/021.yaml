  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: yo
  text: Ó sì ní ìdánilójú kíkún[a] pé ohun tí ó ti ṣèlérí[c], ó tún lágbára[b] láti ṣe é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ó dá a lójú pátápátá.’
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì, ọ̀rọ̀ náà wà ní àsìkò ìsinsìnyí: ‘ó lágbára’ tàbí ‘ó lè ṣe é.’'
    reason: lexical_alternative
  - marker: c
    text: Àyíká ọ̀rọ̀ fi hàn pé ‘ó’ ń tọ́ka sí Ọlọ́run.
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: ní ìdánilójú kíkún
  rationale: Ó fi ìdánilójú pátápátá tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí hàn ní Yorùbá àdánidá, láì sọ ọ́ di ìmọ̀ lásán.
- source_word: ὅτι
  choice: pé
  rationale: Èyí ni ọ̀nà àdánidá láti mú àkóónú ohun tí Ábúráhámù ní ìdánilójú nípa rẹ̀ wọlé.
- source_word: ὃ
  choice: ohun tí
  rationale: Ó túmọ̀ arọ́pò-orúkọ ìbátan náà ní Yorùbá tó ṣe kedere, láì fi ìtumọ̀ míì kún un.
- source_word: ἐπήγγελται
  choice: ó ti ṣèlérí
  rationale: Àmì ‘ti’ ń fi iṣẹ́ tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà hàn, gẹ́gẹ́ bí perfect Gíríìkì.
- source_word: δυνατός ἐστιν
  choice: ó lágbára
  rationale: A pa àsìkò ìsinsìnyí inú Gíríìkì mọ́, ó sì sọ agbára ẹni tí ó ṣèlérí láti mú un ṣẹ.
- source_word: καὶ
  choice: tún
  rationale: ‘Tún’ mú ìtumọ̀ pé ẹni tí ó ṣèlérí náà tún ní agbára láti ṣe ohun tí ó sọ hàn ní Yorùbá àdánidá.
- source_word: ποιῆσαι
  choice: láti ṣe é
  rationale: Ó pa ìtumọ̀ gbòòrò àti rírọrùn ti ποιέω mọ́, láì sọ ọ́ di ‘mú ṣẹ’ nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ẹni tí ó ṣèlérí tí ó sì lágbára
  choice: A lo arọ́pò-orúkọ ‘ó’ nínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a sọ ‘Ọlọ́run’ ní tààrà.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Ọlọ́run ni a ń tọ́ka sí, ṣùgbọ́n ẹsẹ yìí kò pe orúkọ náà ní tààrà; arọ́pò-orúkọ pa ìṣètò orísun mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Ìṣètò ‘ohun tí …, ó tún …’ ń tẹ̀ lé ìtẹnumọ́ orísun Gíríìkì, bó tilẹ̀ jẹ́ pé ó ní ìrísí gbolóhùn tí a gbé ohun sí iwájú.
