source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: yo
  text: Nítorí kí ni Ìwé Mímọ́ sọ? “Ábúráhámù gba Ọlọ́run gbọ́, a sì kà á sí òdodo[b] fún un.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sì kà á fún un gẹ́gẹ́ bí òdodo,” tàbí, “a sì fi í sí àkọọ́lẹ̀ rẹ̀ gẹ́gẹ́ bí òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: Ìwé Mímọ́
  rationale: Nínú lílo Páùlù, ọ̀rọ̀ náà ń tọ́ka sí Ìwé Mímọ́, kì í ṣe sí ìwé lásán. ‘Ìwé Mímọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká yìí mu.
- source_word: Ἐπίστευσεν
  choice: gba ... gbọ́
  rationale: ‘Gba Ọlọ́run gbọ́’ fi hàn ní Yorùbá àdánidá pé Ábúráhámù gba ohun tí Ọlọ́run sọ gbọ́, láìfi àlàyé ìtumọ̀ míì kún ọ̀rọ̀ náà.
- source_word: τῷ θεῷ
  choice: Ọlọ́run
  rationale: Dátífù tó tẹ̀ lé πιστεύω níbí dára jù lọ gẹ́gẹ́ bí ‘gba Ọlọ́run gbọ́,’ èyí tó tẹnu mọ́ gbígba ọ̀rọ̀ Ọlọ́run gbọ́ ju ‘ní ìgbàgbọ́ nínú Ọlọ́run’ lọ.
- source_word: ἐλογίσθη
  choice: a sì kà á
  rationale: Èyí pa ohùn àìṣe Gíríìkì mọ́, ó sì sọ ìṣe kíkà ohun kan sí ipò kan ní Yorùbá òde òní tó ṣe kedere. Àwọn ìtumọ̀ bí ‘ka á fún un’ tàbí ‘fi í sí àkọọ́lẹ̀ rẹ̀’ wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰς δικαιοσύνην
  choice: sí òdodo
  rationale: ‘Sí òdodo’ bá ọ̀nà ìsọ Gíríìkì mu, ó sì dá ìtumọ̀ δικαιοσύνη gẹ́gẹ́ bí òdodo dúró nínú àyíká Páùlù. Àṣàyàn tó tẹnu mọ́ ìdájọ́ òdodo wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àyíká ìdáláre ti Páùlù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ lè gbé àwọn ìtumọ̀ ìwà tó tọ́ àti ipò tí a kà sí títọ́ níwájú Ọlọ́run, láìdín ọ̀rọ̀ náà kù sí ẹ̀kọ́ ìsìn kan ṣoṣo. ‘Ìdájọ́ òdodo’ jẹ́ àṣàyàn ọ̀rọ̀ tó ṣeé ṣe, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé lásán. A lo ọ̀nà ìsọ àdánidá ‘gba Ọlọ́run gbọ́’ láti pa ìbáṣepọ̀ gírámà Gíríìkì mọ́.
