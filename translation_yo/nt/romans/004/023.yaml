  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: yo
  text: A kò sì kọ ọ́ fún un nìkan pé a kà á sí i,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a fi í sí àkọọ́lẹ̀ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: a kọ ọ́
  rationale: Ó pa ìṣe aláìlórúkọ mọ́, ó sì fi hàn pé ohun tí Ìwé Mímọ́ kọ sílẹ̀ ni a ń tọ́ka sí.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ̀síwájú nínú àlàyé Pọ́ọ̀lù láìfi ìtakora líle kún un; ‘sì’ bá èdè Yorùbá àdánidá mu.
- source_word: δι’ αὐτὸν μόνον
  choice: nítorí tirẹ̀ nìkan
  rationale: 'Èyí fi ìtumọ̀ διά pẹ̀lú accusative àti ìtẹnumọ́ μόνον hàn: kì í ṣe Ábúráhámù nìkan ni ọ̀rọ̀ náà wà fún.'
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ ṣàgbékalẹ̀ àkóónú ohun tí a kọ ní ọ̀nà Yorùbá tí ó ṣe déédé.
- source_word: ἐλογίσθη
  choice: a kà á sí
  rationale: ‘A kà á sí’ pa ìtumọ̀ fífi ohun kan sí ìṣirò tàbí sí àkọọ́lẹ̀ mọ́, ó sì jẹ́ gbólóhùn tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: αὐτῷ
  choice: fún un
  rationale: ‘Fún un’ ṣàfihàn ẹni tí a ka ohun náà sí fún, ó sì bá àkójọpọ̀ ọ̀rọ̀ Yorùbá ‘kà á sí fún un’ mu.
theological_decisions:
- issue: Ìtumọ̀ λογίζομαι nínú àríyànjiyàn Pọ́ọ̀lù nípa ìdáláre
  choice: a kà á sí fún un
  alternative: a fi í sí àkọọ́lẹ̀ rẹ̀
  rationale: Yíyan yìí pa àwòrán ìṣirò tàbí fífi ohun kan sí ẹni mọ́ láìfi ẹ̀kọ́ ìsìn kan tí ẹsẹ náà kò sọ ní tààràtà kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àsopọ̀ ‘sì’ ni a lò láti pa ipa δέ mọ́, bó tilẹ̀ jẹ́ pé Gẹ̀ẹ́sì ìtọ́kasí kò fi ọ̀rọ̀ àsopọ̀ sí ìbẹ̀rẹ̀.
