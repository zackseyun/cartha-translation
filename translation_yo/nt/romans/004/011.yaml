id: ROM.4.11
reference: Romans 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: yo
  text: Ó sì gba àmì ìkọlà gẹ́gẹ́ bí èdìdì òdodo tí ó ní nípasẹ̀ ìgbàgbọ́ nígbà tí kò tíì kọlà,[a] kí ó lè jẹ́ baba gbogbo àwọn tí ń gbàgbọ́ nígbà tí wọn kò tíì kọlà,[b] kí a sì lè ka òdodo sí wọn náà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti Gíríìkì, ó tún ṣeé túmọ̀ sí, “òdodo ìgbàgbọ́ tí ó ní nínú àìkọlà.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti Gíríìkì, “nípasẹ̀ àìkọlà”; ìyẹn ni pé, nígbà tí wọn kò tíì kọlà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ka òdodo sínú àkọọ́lẹ̀ wọn” tàbí “ka òdodo sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: àmì
  rationale: “Àmì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí ń tọ́ka sí òtítọ́ míì, ó sì pa ìtumọ̀ àmì májẹ̀mú mọ́.
- source_word: περιτομή
  choice: ìdádọ̀dọ́
  rationale: “Ìdádọ̀dọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún àṣà yìí nínú àríyànjiyàn Paulu.
- source_word: σφραγίς
  choice: èdìdì
  rationale: “Èdìdì” pa àwòrán ohun tí ń fi ìjẹ́rìí sí tàbí ń fìdí ohun kan múlẹ̀ mọ́, láì sọ ọ́ di àlàyé lásán.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” ni ìtumọ̀ àdánidá àti èdè Bíbélì tó mọ́gbọ́n dání fún δικαιοσύνη níbí, ó sì lè gbé ìmọ̀ràn ìbáṣepọ̀ títọ́ àti ìdáláre nínú ọ̀rọ̀ Paulu.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Ẹ̀wọ̀n ọ̀rọ̀ τῆς δικαιοσύνης τῆς πίστεως ń tọ́ka sí òdodo tó ní í ṣe pẹ̀lú ìgbàgbọ́; “ìgbàgbọ́” jẹ́ kedere, kò sì fi “ìṣòtítọ́” tí kò ṣe pàtàkì jù lọ níbí sí iwájú.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: nígbà tí a kò tíì dá a lọ́dọ̀
  rationale: Ìtumọ̀ yìí sọ ipò Ábúráhámù àti àsìkò tí ó ti ní ìgbàgbọ́ náà jáde ní Yorùbá àdánidá ju ìtumọ̀ gígírí bí “nínú àìdádọ̀dọ́” lọ.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: baba gbogbo àwọn tí ó gbàgbọ́
  rationale: Ó jẹ́ Yorùbá àdánidá, ó sì pa èrò Paulu pé Ábúráhámù jẹ́ baba aṣojú àwọn onígbàgbọ́ mọ́.
- source_word: δι’ ἀκροβυστίας
  choice: nígbà tí a kò dá wọn lọ́dọ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, διά pẹ̀lú genitive ń ṣàpèjúwe ipò àwọn tó gbàgbọ́, kì í ṣe pé àìdádọ̀dọ́ ni irinṣẹ́ ìgbàgbọ́ wọn.
- source_word: λογισθῆναι
  choice: ka ... sí
  rationale: “Ka ... sí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún èrò ìṣírò tàbí fífi ohun kan sí àkọọ́lẹ̀ ẹnì kan, láì di èdè ẹ̀kọ́ ìsìn tó le.
- source_word: καί
  choice: pẹ̀lú
  rationale: “Pẹ̀lú” mú ìtumọ̀ pé a ka òdodo sí àwọn onígbàgbọ́ aláìdádọ̀dọ́ náà jáde.
theological_decisions:
- issue: Ìbáṣepọ̀ ìdádọ̀dọ́ àti òdodo
  choice: A ṣe ìdádọ̀dọ́ ní àmì àti èdìdì òdodo tí Ábúráhámù ti ní nípasẹ̀ ìgbàgbọ́ kí a tó dá a lọ́dọ̀.
  alternative: A lè ṣe gbolohun náà lọ́nà tí yóò dà bí ẹni pé ìdádọ̀dọ́ fúnra rẹ̀ ló mú òdodo wá.
  rationale: Èdè Gíríìkì gbé ìdádọ̀dọ́ kalẹ̀ gẹ́gẹ́ bí àmì ìjẹ́rìí tó tẹ̀ lé òdodo tó ní í ṣe pẹ̀lú ìgbàgbọ́ Ábúráhámù nígbà àìdádọ̀dọ́; ìtumọ̀ náà pa ìtẹ̀lé yìí mọ́ láì gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọlé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A lo “ìdádọ̀dọ́,” “èdìdì,” “òdodo,” àti “ka ... sí” láti pa àwọn àwòrán àti ọ̀rọ̀ pàtàkì Paulu mọ́. Àwọn àmì ìsẹ̀lẹ̀ [a], [b], [c] wà nínú ẹsẹ̀ náà, wọ́n sì bá àwọn àlàyé ìsàlẹ̀ mu.
