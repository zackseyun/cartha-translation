    issue: “Ìdádọ̀dọ́” àti àwọn ọ̀rọ̀ “dá ... lọ́dọ̀” ni a lò fún περιτομή/ἀκροβυστία.
    rationale: “Ìkọlà” àti “àìkọlà” ni ọ̀rọ̀ Standard Yorùbá Bíbélì tó mọ́gbọ́n dání jù lọ fún ìkọlà àti àìkọlà. Wọ́n tún jẹ́ kí ìbáṣepọ̀ ọ̀rọ̀ Paulu láàárín περιτομή àti ἀκροβυστία hàn gbangba.
  - severity: low
    issue: “Pẹ̀lú” ní ìkẹyìn gbolohun lè dà bí “with them” dípò “also.”
    rationale: καί níbí ń fi kún un pé a ka òdodo sí àwọn onígbàgbọ́ aláìkọlà náà. “Náà” ṣàfihàn èyí ní kedere.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ [c] ní “fi òdodo sí wọn,” tí kò fi àwòrán ìṣírò λογίζομαι hàn dáadáa.
