revisions:
- from: Ó sì gba àmì ìdádọ̀dọ́ gẹ́gẹ́ bí èdìdì òdodo tó wá nípasẹ̀ ìgbàgbọ́ tí ó ní nígbà tí a kò tíì dá a lọ́dọ̀,[a] kí ó lè jẹ́ baba gbogbo àwọn tí ó gbàgbọ́ nígbà tí a kò dá wọn lọ́dọ̀,[b] kí a sì lè ka òdodo sí wọn pẹ̀lú.[c]
  to: Ó sì gba àmì ìkọlà gẹ́gẹ́ bí èdìdì òdodo tí ó ní nípasẹ̀ ìgbàgbọ́ nígbà tí kò tíì kọlà,[a] kí ó lè jẹ́ baba gbogbo àwọn tí ń gbàgbọ́ nígbà tí wọn kò tíì kọlà,[b] kí a sì lè ka òdodo sí wọn náà.[c]
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ ìkọlà sí “ìkọlà/àìkọlà,” èyí tó péye ní Standard Yorùbá àti nínú ìlò Bíbélì. Ó tún mú ipò àìkọlà Ábúráhámù àti ti àwọn onígbàgbọ́ hàn ní èdè tó rọrùn, ó sì fi ìtumọ̀ “also” ti καί hàn pẹ̀lú “náà.” A pa ìbáṣepọ̀ ìkọlà gẹ́gẹ́ bí àmì/èdìdì, kì í ṣe ọ̀nà ìgbọ́nwọ́ òdodo, mọ́.
