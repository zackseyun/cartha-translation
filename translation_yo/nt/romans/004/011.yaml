  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò àríyànjiyàn Paulu wá ní gbogbogbòò: Ábúráhámù gba ìkọlà gẹ́gẹ́ bí àmì àti èdìdì òdodo tó ní nípasẹ̀ ìgbàgbọ́ kí a tó kọ ọ́ níkọlà; ète náà sì ni kí ó jẹ́ baba àwọn tí ń gbàgbọ́ ní ipò àìkọlà, kí a lè ka òdodo sí wọn náà. Ṣùgbọ́n “ìdádọ̀dọ́” kì í ṣe ọ̀rọ̀ ìlò Bíbélì Yorùbá tó dájú fún περιτομή; “ìkọlà/àìkọlà” ni ọ̀rọ̀ tó péye, tó sì bá ọ̀rọ̀ Paulu mu dáadáa.'
  naturalness: Àwọn gbolohun náà dára ní gbogbogbòò, ṣùgbọ́n “nígbà tí a kò dá wọn lọ́dọ̀” kéré sí ìlò àdánidá ju “nígbà tí wọn kò tíì kọlà” lọ. “Náà” tún ṣe kedere ju “pẹ̀lú” lọ fún καί ní gbolohun ìkẹyìn, nítorí ó fi ìtumọ̀ “also” hàn kedere.
  terminology: A yẹ kí a lo “ìkọlà” fún περιτομή àti “àìkọlà” fún ἀκροβυστία, gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tó ti fìdí múlẹ̀. “Àmì,” “èdìdì,” “òdodo,” “ìgbàgbọ́,” àti “ka ... sí” yẹ, wọ́n sì pa àwòrán àti ìtumọ̀ Gíríìkì mọ́.
  issues:
