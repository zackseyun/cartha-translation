language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: yo
  text: Nítorí ìlérí tí a ṣe fún Ábúráhámù tàbí fún irú-ọmọ rẹ̀[a] pé òun yóò jẹ́ ajogún ayé kì í ṣe nípasẹ̀ òfin, bí kò ṣe nípasẹ̀ òdodo[c] ìgbàgbọ́[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “irúgbìn.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ kan, ṣùgbọ́n ó lè dúró fún àkójọpọ̀: “irú-ọmọ” tàbí “àwọn àtọmọdọ́mọ.”'
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “nípasẹ̀ òdodo tí ó wá nípasẹ̀ ìgbàgbọ́” tàbí “nípasẹ̀ òdodo tó dá lórí ìgbàgbọ́.”
    reason: alternative_reading
  - marker: c
    text: Nínú àwọn ọ̀rọ̀ Pọ́ọ̀lù, “òdodo” tún lè ní ìtumọ̀ “ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: d
    text: “Ìgbàgbọ́” tún lè túmọ̀ sí “ìṣòtítọ́” tàbí “ìgbẹ́kẹ̀lé,” gẹ́gẹ́ bí ọ̀rọ̀ tó yí i ká.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: ìlérí
  rationale: “Ìlérí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìlérí Ọlọ́run, ó sì pa agbára májẹ̀mú inú ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: σπέρματι
  choice: irú-ọmọ
  rationale: “Irú-ọmọ” lè tọ́ka sí ẹnì kan tàbí àwọn àtọmọdọ́mọ lápapọ̀, nítorí náà ó pa ìtumọ̀ ẹyọ kan tí ó tún lè jẹ́ àkójọpọ̀ mọ́.
- source_word: κληρονόμον ... κόσμου
  choice: ajogún ayé
  rationale: Èyí pa èdè ogún Pọ́ọ̀lù àti gbígbòòrò κόσμος mọ́ láì dín ìtumọ̀ rẹ̀ kù.
- source_word: διὰ νόμου
  choice: nípasẹ̀ òfin
  rationale: Ó fi òfin hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò, ó sì bá ìjíròrò Pọ́ọ̀lù nípa òfin mu.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì lè ru ìtumọ̀ ìbáṣepọ̀ tó tọ́ àti ìdáláre nínú ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ tó bá àtakò Pọ́ọ̀lù láàárín òfin àti ìgbàgbọ́ mu, láì kọ àwọn ìtumọ̀ bí ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́ sílẹ̀ pátápátá.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: nípasẹ̀ òdodo ìgbàgbọ́
  rationale: Gbólóhùn kúkúrú yìí pa ìsopọ̀ genitive inú Gíríìkì mọ́, kò sì pinnu bóyá ìgbàgbọ́ ni orísun, ọ̀nà, tàbí àbùdá òdodo náà.
theological_decisions:
- issue: Ìbáṣepọ̀ δικαιοσύνης àti πίστεως
  choice: òdodo ìgbàgbọ́
  alternative: òdodo tí ó wá nípasẹ̀ ìgbàgbọ́; òdodo tí a gbé karí ìgbàgbọ́
  rationale: Àkójọpọ̀ Gíríìkì náà kúkúrú, ó sì lè gba ju àlàyé kan lọ. Ìtumọ̀ yìí pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láì fi ìtumọ̀ ẹ̀sìn kan lé e lórí.
- issue: Ẹni tí αὐτόν (“òun”) ń tọ́ka sí
  choice: Pa “òun” mọ́ láì tún orúkọ ẹni náà sọ
  alternative: Ábúráhámù yóò jẹ́ ajogún ayé; irú-ọmọ rẹ̀ yóò jẹ́ ajogún ayé
  rationale: Àrọ́pò-orúkọ inú orísun lè jẹ́ kí olùkà ronú nípa ẹni tí ó ń tọ́ka sí. “Òun” pa ààyè yẹn mọ́ ju ṣíṣe àlàyé ẹni náà ní pàtó lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún olùkà òde òní. “Ìlérí náà dé ọ̀dọ̀” jẹ́ ọ̀nà Yorùbá tó rọrùn láti sọ pé a fi ìlérí fún ẹnì kan, nígbà tí “ajogún ayé” pa àwòrán ogún inú Gíríìkì mọ́.
