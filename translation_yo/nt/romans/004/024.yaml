id: ROM.4.24
reference: Romans 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: yo
  text: ṣùgbọ́n fún àwa náà, àwa tí a ó kà á sí wa, àwa tí a gba ẹni tí ó jí Jésù Olúwa wa dìde kúrò nínú òkú gbọ́,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: ṣùgbọ́n ... náà
  rationale: Ó pa agbára ìtakora àti àfikún mọ́, ó sì so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: δι’ ἡμᾶς
  choice: nítorí àwa
  rationale: Nínú àyíká yìí, διά pẹ̀lú accusative túmọ̀ sí pé a kọ ọ̀rọ̀ náà pẹ̀lú àwa náà lọ́kàn.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: àwa tí a ó kà á sí fún
  rationale: ‘A ó’ fi ìtọ́ka sí ọjọ́ iwájú hàn; ‘kà á sí fún’ pa àwòrán ìṣírò àti ohun tí a yàn sí ẹnì kan mọ́. Ọ̀rọ̀ arọ́pò ‘á’ dúró fún ohun tí àyíká ṣáájú ti sọ, láìfi ‘òdodo’ kún ẹsẹ̀ náà ní tààrà.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: àwa tí a gba ... gbọ́
  rationale: Ìṣètò ‘gba ẹni ... gbọ́’ jẹ́ Yorùbá àdánidá fún ìgbàgbọ́ tí a darí sí ẹni kan, ó sì lè ní agbára ìgbẹ́kẹ̀lé.
- source_word: τὸν ἐγείραντα
  choice: ẹni tí ó jí ... dìde
  rationale: Ó pa participle onítumọ̀-orúkọ náà mọ́, ó sì sọ Ọlọ́run di mímọ̀ nípasẹ̀ iṣẹ́ tí ó ṣe.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jésù Olúwa wa
  rationale: Ó lo ìkọ̀wé orúkọ Yorùbá tí ó wọ́pọ̀, ó sì tú κύριος sí ‘Olúwa’ láìfi ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kan kún un.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó fi ìtumọ̀ ‘jáde láti inú àwọn òkú’ hàn ní Yorùbá àdánidá, dípò ọ̀rọ̀ tí ó lè dà bí ẹni pé Jésù jí kúrò nínú ipò ikú nìkan.
theological_decisions:
- issue: Ohun tí a kò sọ ní tààrà gẹ́gẹ́ bí object fún λογίζεσθαι
  choice: 'Lo ọ̀rọ̀ arọ́pò ‘á’: ‘a ó kà á sí fún’'
  alternative: ‘a ó ka òdodo sí fún’
  rationale: Gíríìkì fi ohun tí a kà sí ẹni sílẹ̀ láìsọ ọ́, nítorí àyíká ṣáájú ti mú un yé wa. ‘Á’ jẹ́ kí Yorùbá pé, ṣùgbọ́n kò mú ‘òdodo’ wọ ẹsẹ̀ yìí ní gbangba.
- issue: Bí πιστεύω ἐπί ṣe ní ìtumọ̀ ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé
  choice: ‘gba ... gbọ́’ nínú ọ̀rọ̀ pàtàkì
  alternative: ‘gbẹ́kẹ̀ lé’
  rationale: ‘Gba ... gbọ́’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ‘believe in’; àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘trust in’ mọ́ láìyanju ìfarakanra ọ̀rọ̀ Gíríìkì ju bó ṣe yẹ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. Àtúnṣe gbolohun náà pa ìtẹ̀síwájú láti ẹsẹ̀ 23 mọ́; ìlò ‘àwa’ lẹ́ẹ̀mejì mú apposition Gíríìkì yé kedere.
