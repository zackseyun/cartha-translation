  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: yo
  text: Nítorí náà, a kà á sí òdodo fún un.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “a fi sí àkọọ́lẹ̀ rẹ̀” tàbí “a kà á fún un.”
