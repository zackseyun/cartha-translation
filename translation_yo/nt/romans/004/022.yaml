lexical_decisions:
- source_word: διό
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ tí ó ṣáájú hàn ní Yorùbá àdánidá, ó sì pa ìsopọ̀ ọgbọ́n inú àríyànjiyàn náà mọ́.
- source_word: ἐλογίσθη
  choice: a kà á
  rationale: Ìtumọ̀ yìí pa àwòrán ìṣírò tàbí kíkà sí ipò kan mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ̀rọ̀ ìṣe aláìlẹ́ni tí Gíríìkì lò.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ó tọ́ka sí Ábúráhámù gẹ́gẹ́ bí ẹni tí a kà ohun náà fún, ní ìbámu pẹ̀lú ìlò dátífù inú Gíríìkì.
- source_word: εἰς
  choice: sí
  rationale: Nínú gbólóhùn “kà ... sí,” ọ̀rọ̀ yìí sọ ipò tàbí àbájáde tí a kà á sí ní Yorùbá tí ó ṣe déédéé.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tí ó bójú mu jù lọ fún δικαιοσύνη nínú àyíká Pọ́ọ̀lù yìí, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ ìdájọ́ òdodo.
theological_decisions:
- issue: Bí a ṣe máa pa àwòrán kíkà sí tàbí ìṣírò ti Pọ́ọ̀lù mọ́ láìfi ẹ̀kọ́ ìsìn àfikún sínú rẹ̀
  choice: a kà á sí òdodo fún un
  alternative: a ka òdodo sí i; a gbà á sí òdodo fún un
  rationale: Ìtumọ̀ àkọ́kọ́ pa àwòrán kíkà ohun kan sí ipò kan mọ́, kò sì ṣàlàyé ju ohun tí Gíríìkì sọ lọ. Ó tún pa àìṣedéédéé díẹ̀ tó wà nínú ẹni tàbí ohun tí “á” ń tọ́ka sí mọ́ ní ìbámu pẹ̀lú ọ̀rọ̀ tí ó ṣáájú.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn kúkúrú náà pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àyíká Ábúráhámù nínú Róòmù 4.
