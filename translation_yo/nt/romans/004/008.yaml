  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: yo
  text: Alábùkún ni ọkùnrin tí Olúwa kì yóò ka ẹ̀ṣẹ̀ sí i láéláé.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Alábùkún ni ẹni tí Olúwa kì yóò ka ẹ̀ṣẹ̀ sí i láéláé.” “Ọkùnrin” níbí dúró fún ènìyàn lápapọ̀; kì í tọ́ka sí akọ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kì yóò ka ẹ̀ṣẹ̀ sí i rárá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Alábùkún
  rationale: Ọ̀rọ̀ yìí pa èdè ìbùkún inú Ìwé Mímọ́ mọ́, ó sì ní ìwọ̀n ẹ̀sìn àti májẹ̀mú ju ọ̀rọ̀ tó túmọ̀ sí pé inú ènìyàn dùn lásán lọ.
- source_word: ἀνήρ
  choice: ọkùnrin
  rationale: A pa ẹyọ akọ tó wà nínú Gíríìkì mọ́; síbẹ̀, nínú àyọlò yìí ó dúró fún ènìyàn lápapọ̀, kì í ṣe fún akọ nìkan.
- source_word: οὗ
  choice: tí ... sí
  rationale: Ìṣètò Yorùbá “tí Olúwa ... ka ẹ̀ṣẹ̀ sí” fi hàn pé ẹni náà ni a bá fi ẹ̀ṣẹ̀ náà kàn, láìfi gbolohun ṣe àjèjì.
- source_word: οὐ μὴ
  choice: kì yóò ... láéláé
  rationale: Àpapọ̀ ìkọ̀ Gíríìkì yìí lágbára; “kì yóò ... láéláé” sọ ìdánilójú ìkọ̀ náà ní Yorùbá àdánidá.
- source_word: λογίσηται
  choice: ka
  rationale: “Ka” ṣe àfihàn àkàntì tàbí ìṣírò tó ṣe pàtàkì nínú Róòmù 4, láìlo ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó ti ní ìtumọ̀ àfikún.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún àyọlò Ìwé Mímọ́ tí Pọ́ọ̀lù ń fa yọ.
- source_word: ἁμαρτίαν
  choice: ẹ̀ṣẹ̀
  rationale: A pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí orúkọ ohun tàbí ẹ̀ka kan, èyí sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ọ̀rọ̀ akọ tó dúró fún gbogbo ènìyàn
  choice: A lo “ọkùnrin” nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a ṣàlàyé pé ó ní ìtumọ̀ aṣojú.
  alternative: ẹni; ènìyàn
  rationale: ἀνήρ jẹ́ ẹyọ akọ ní gírámà, ṣùgbọ́n nínú àyọlò Sáàmù yìí, ìbùkún náà kò mọ sí akọ nìkan. Àlàyé ìsàlẹ̀ ojú ìwé pa ìrísí orísun àti ìtumọ̀ àpapọ̀ rẹ̀ pọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. “Alábùkún” bá ohùn ìbùkún Ìwé Mímọ́ mu; “ka ẹ̀ṣẹ̀ sí” sì jẹ́ gbolohun àdánidá tó pa àwòrán ìṣírò inú ọ̀rọ̀ náà mọ́.
