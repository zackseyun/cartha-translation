  source_fidelity: Ìtumọ̀ náà tọ́ka sí ìbùkún, ọkùnrin aṣojú, ìkọ̀ tó lágbára, àti àwòrán ‘kíkà’ ẹ̀ṣẹ̀ ní ìbámu pẹ̀lú Gíríìkì. Ṣùgbọ́n gbolohun àkọ́kọ́ fi ‘sí’ sílẹ̀ láìsí àṣekún ẹni tí a ń ka ẹ̀ṣẹ̀ sí; a nílò ‘sí i’ láti sọ ìbáṣepọ̀ οὗ/‘against whom’ ní kíkún.
  naturalness: ‘Alábùkún ni ọkùnrin tí Olúwa kì yóò ka ẹ̀ṣẹ̀ sí i láéláé’ jẹ́ Yorùbá boṣewa, ó sì dáa ní ohùn ìwé mímọ́. Ó pa ìtumọ̀ ìkọ̀ ‘kì yóò … láéláé’ mọ́.
  terminology: ‘Alábùkún,’ ‘Olúwa,’ ‘ẹ̀ṣẹ̀,’ àti ‘ka … sí i’ yẹ fún àyíká Pọ́ọ̀lù àti fún àwòrán ìṣírò nínú Róòmù 4. A pa ‘ọkùnrin’ mọ́ gẹ́gẹ́ bí ìrísí akọ-ẹyọ orísun, pẹ̀lú àlàyé pé ìtumọ̀ rẹ̀ jẹ́ aṣojú.
