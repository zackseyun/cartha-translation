  terminology: A pa “ìbùkún,” “ìgbàgbọ́,” àti “òdodo” mọ́. “Kọlà” jẹ́ ọ̀rọ̀ tó yẹ fún περιτομή nínú àyíká Bíbélì; a fi ẹgbẹ́ àwọn ènìyàn hàn nípasẹ̀ “àwọn tí a ti kọlà” àti “àwọn tí a kò kọlà.” Àlàyé ìsàlẹ̀ fún òdodo ni a pa mọ́ gẹ́gẹ́ bí àṣàyàn ìtumọ̀.
  issues:
