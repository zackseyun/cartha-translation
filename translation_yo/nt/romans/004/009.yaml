    rationale: Ó lè yọrí sí ìtumọ̀ míì nípa kíkó ìlà. “Kọlà” ń sọ περιτομή ní kedere, ó sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá mu.
  - severity: low
    issue: “A ka ìgbàgbọ́ Ábúráhámù sí òdodo fún un” tún “fún un” ṣe, ó sì lè fi ìgbàgbọ́ náà hàn gẹ́gẹ́ bí ohun-ìní Ábúráhámù dípò kí ó ṣe àfihàn ẹni tí a kà á fún.
    rationale: Gíríìkì náà ní dative “τῷ Ἀβραὰμ.” Ìtúnṣe náà mú kí ìbáṣepọ̀ yìí hàn kedere láìfi ìtumọ̀ ẹ̀kọ́ kún un.
