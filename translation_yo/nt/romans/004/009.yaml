id: ROM.4.9
reference: Romans 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: yo
  text: Ǹjẹ́ ìbùkún yìí wà fún àwọn tí a ti kọlà nìkan, tàbí ó tún wà fún àwọn tí a kò kọlà? Nítorí a sọ pé, “A kà ìgbàgbọ́ sí òdodo[a] fún Ábúráhámù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: ìbùkún
  rationale: Ó tọ́ka sí ipò alábùkún tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ ní 4:6–8; “ìbùkún” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó ṣe kedere.
- source_word: περιτομή
  choice: àwọn tí a kọ nílà
  rationale: Orúkọ Gíríìkì náà dúró fún àwọn ènìyàn tí wọ́n ní àmì ìkọlà; yíyí i sí ẹgbẹ́ àwọn ènìyàn jẹ́ kedere ní Yorùbá.
- source_word: ἀκροβυστία
  choice: àwọn tí a kò kọ nílà
  rationale: Gẹ́gẹ́ bí περιτομή, ọ̀rọ̀ náà dúró fún ẹgbẹ́ àwọn ènìyàn; ìtumọ̀ yìí pa ìyàtọ̀ Pọ́ọ̀lù mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Nínú àyọlò Jẹ́nẹ́sísì yìí àti àríyànjiyàn Pọ́ọ̀lù, “ìgbàgbọ́” ni ìtumọ̀ tó bá ọ̀rọ̀ mu jù lọ.
- source_word: ἐλογίσθη
  choice: a ka ... sí
  rationale: Ó pa àwòrán ìṣírò inú λογίζομαι mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún δικαιοσύνη nínú àríyànjiyàn Pọ́ọ̀lù nípa bí ènìyàn ṣe dúró níwájú Ọlọ́run; “ìdájọ́ òdodo” wà ní àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn ọ̀rọ̀.
- source_word: εἰς δικαιοσύνην
  choice: sí òdodo fún un
  rationale: Ó fi ìbáṣepọ̀ tí ọ̀rọ̀ Gíríìkì ṣe láàárín ìgbàgbọ́ Ábúráhámù àti òdodo hàn, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Ọ̀rọ̀ Pọ́ọ̀lù nípa ìgbàgbọ́ Ábúráhámù àti òdodo
  choice: A ka ìgbàgbọ́ Ábúráhámù sí òdodo fún un.
  alternative: A kà ìgbàgbọ́ sí òdodo fún Ábúráhámù.
  rationale: Ọ̀rọ̀ yìí pa ìdọ́gba àti ìfọ̀rọ̀wérọ̀ inú àyọlò Pọ́ọ̀lù mọ́, kò sì fi ètò ẹ̀kọ́ ìgbàgbọ́ tí ó gbooro ju ẹsẹ náà lọ sínú ìtumọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ọlọ́wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Kọ nílà” ni a lò fún ìkọlà nítorí ó jẹ́ ọ̀rọ̀ àdánidá tí òǹkàwé òde òní lè lóye.
