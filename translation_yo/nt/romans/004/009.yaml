  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì mọ́: ìbùkún náà ni a béèrè bóyá ó kan àwọn tó kọlà tàbí àwọn tí kò kọlà, a sì ń tọ́ka sí ìgbàgbọ́ tí a kà sí òdodo fún Ábúráhámù. Ṣùgbọ́n ìlò “kọ nílà” kò dájú gẹ́gẹ́ bí ọ̀rọ̀ boṣewa fún ìkọlà, àti pé ìtòlé ọ̀rọ̀ nínú àyọlò náà lè túmọ̀ sí pé ìgbàgbọ́ náà jẹ́ ti Ábúráhámù ní kíkún dípò kí ó pa dative Gíríìkì náà mọ́ kedere.'
