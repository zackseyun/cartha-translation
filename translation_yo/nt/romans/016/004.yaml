id: ROM.16.4
reference: Romans 16:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: yo
  text: àwọn ẹni tí wọ́n fi ọrùn ara wọn wéwu nítorí ìyè mi; kì í ṣe èmi nìkan ló dúpẹ́ lọ́wọ́ wọn, ṣùgbọ́n gbogbo àwọn ìjọ àwọn Kèfèrí náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn ìjọ àwọn orílẹ̀-èdè.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: àwọn ẹni tí wọ́n
  rationale: Ó so gbólóhùn àlàyé yìí mọ́ Pírísíkílà àti Ákúlà, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘àwọn ẹni tí wọ́n.’
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: nítorí ẹ̀mí mi
  rationale: Nínú àyíká yìí, ẹ̀mí túmọ̀ sí ìyè Pọ́ọ̀lù, kì í ṣe apá àìrí ènìyàn; gbólóhùn náà tọ́ka sí fífi ara sínú ewu láti gba ẹ̀mí rẹ̀ là.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: fi ọrùn ara wọn wéwu
  rationale: 'Èyí pa àwòrán ‘ọrùn’ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì sọ ìtumọ̀ àpẹẹrẹ náà ní Yorùbá tí ó ṣe kedere: wọ́n fi ara wọn sínú ewu ikú.'
- source_word: οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: kì í sì í ṣe èmi nìkan ni mo dúpẹ́ lọ́wọ́ wọn, ṣùgbọ́n ... pẹ̀lú
  rationale: Ìṣètò yìí pa ìtẹnumọ́ lórí ‘èmi nìkan’ àti ìyàtọ̀ ‘ṣùgbọ́n ... pẹ̀lú’ mọ́ ní Yorùbá àdánidá.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: gbogbo àwọn ìjọ
  rationale: Ó ṣàfihàn ọ̀pọ̀ ìjọ tí Pọ́ọ̀lù ń tọ́ka sí, gẹ́gẹ́ bí ọ̀pọ̀-orúkọ tí ó ní àfihàn nínú Gíríìkì.
- source_word: τῶν ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Nínú lílo Pọ́ọ̀lù, ọ̀rọ̀ náà sábà ń tọ́ka sí àwọn tí kì í ṣe Júù; ‘Kèfèrí’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ fún ìyàtọ̀ ẹ̀yà àti ẹ̀sìn yìí.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: ẹ̀mí, ní ìtumọ̀ ìyè
  alternative: ọkàn tàbí ẹ̀mí gẹ́gẹ́ bí apá àìrí ènìyàn
  rationale: Àyíká náà jẹ́ ti ewu ikú àti ìṣe ìrúbọ; nítorí náà, ọ̀rọ̀ náà tọ́ka sí ìyè Pọ́ọ̀lù.
- issue: Ìtumọ̀ ἐθνῶν
  choice: Kèfèrí, ìyẹn àwọn tí kì í ṣe Júù
  alternative: àwọn orílẹ̀-èdè
  rationale: Ìtumọ̀ yìí bá lílo Pọ́ọ̀lù àti ìyàtọ̀ Júù–Kèfèrí nínú lẹ́tà sí àwọn ará Róòmù mu, láìgbọ́wọ́ ìtumọ̀ ‘àwọn orílẹ̀-èdè’ kúrò; a fi í sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, ti òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo àpẹẹrẹ ‘fi ọrùn ... wéwu’ láti pa àwòrán Gíríìkì mọ́ ní ọ̀nà tí òǹkàwé Yorùbá lè lóye; a sì yàgò fún ìtumọ̀ tí yóò sọ ψυχή di ẹ̀kọ́ nípa ẹ̀mí ènìyàn.
