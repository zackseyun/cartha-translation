  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: yo
  text: Kí ògo wà fún Ọlọ́run ọlọ́gbọ́n kan ṣoṣo, nípasẹ̀ Jésù Mèsáyà, títí láéláé. Àmín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí parí ọ̀rọ̀ ìyìn tó wà ní Róòmù 16:25–27. Gẹ́gẹ́ bí a ti ṣàlàyé ní Róòmù 16:25, ibi tí ọ̀rọ̀ ìyìn yìí wà àti bóyá ó wà nínú àfọwọ́kọ náà yàtọ̀ gidigidi láàárín àwọn àfọwọ́kọ ìgbàanì; síbẹ̀, ó wà níbí nínú àṣà ọ̀pọ̀ jù lọ ti àwọn àfọwọ́kọ Bísántíòmù.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: kan ṣoṣo
  rationale: Ó tẹnu mọ́ pé Ọlọ́run nìkan ṣoṣo ni Ọlọ́run ọlọ́gbọ́n náà; ó bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu láìsọ pé àwọn mìíràn kò ní ọgbọ́n rárá.
- source_word: σοφῷ
  choice: ọlọ́gbọ́n
  rationale: Ìtumọ̀ àdánidá àti ọ̀wọ̀ fún σοφός ní Yorùbá, ó sì bá Ọlọ́run gẹ́gẹ́ bí ẹni tí ó ní ọgbọ́n mu.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Ó pa ìtumọ̀ irinṣẹ́ tàbí alárinà mọ́ nínú gbólóhùn ‘nípasẹ̀ Jésù Mèsáyà.’
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró; ‘Mèsáyà’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti pa oyè náà mọ́.
- source_word: ᾧ
  choice: ẹni tí ... tirẹ̀
  rationale: Ó pa ìtọ́kasí arọ́pò-orúkọ ibátan Gíríìkì mọ́, pẹ̀lú ìṣiyèméjì díẹ̀ nípa bóyá Ọlọ́run tàbí Jésù Mèsáyà ni ó ń tọ́ka sí.
- source_word: εἰς τοὺς αἰῶνας
  choice: títí láéláé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún àṣà-ọrọ Gíríìkì ‘sí àwọn sáà,’ tó túmọ̀ sí láéláé.
theological_decisions:
- issue: Ẹni tí arọ́pò-orúkọ ᾧ ń tọ́ka sí
  choice: ẹni tí ògo jẹ́ tirẹ̀
  alternative: kí ògo jẹ́ ti Ọlọ́run / kí ògo jẹ́ ti Jésù Mèsáyà
  rationale: Ètò gbólóhùn Gíríìkì ní ìṣiyèméjì díẹ̀ nítorí Jésù Kristi wà lẹ́gbẹ̀ẹ́ arọ́pò-orúkọ náà, ṣùgbọ́n Ọlọ́run ni olùgbà doxology. Ìtumọ̀ yìí kò fi tipátipá yan ọ̀kan nínú wọn.
translation_notes:
  register: Yorùbá àpéwọ̀n, ọ̀wọ̀, àti ìgbàlódé ni a lò. ‘Kan ṣoṣo’ jẹ́ àdánidá lẹ́yìn ‘Ọlọ́run ọlọ́gbọ́n,’ ‘nípasẹ̀’ sì pa ìbáṣepọ̀ gírámà Gíríìkì mọ́. A fi àmì àlàyé [a] sí òpin ẹsẹ kí ó má bà a gé ọ̀rọ̀ ìyìn náà.
