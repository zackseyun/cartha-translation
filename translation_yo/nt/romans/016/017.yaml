  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ó pa ìpè Pọ́ọ̀lù, ìkìlọ̀ láti kíyèsi àwọn kan, ìyapa, ohun ìkọ̀sẹ̀, ìtakò ẹ̀kọ́ tí wọ́n ti kọ́, àti àṣẹ láti yà kúrò lọ́dọ̀ wọn mọ́. Síbẹ̀, ìbátan ‘tí ó lòdì sí ẹ̀kọ́’ nínú àtẹ̀jáde náà lè dà bí ẹni pé ‘ohun ìkọ̀sẹ̀’ nìkan ni ó ń ṣàlàyé, dípò kí ó kan gbogbo iṣẹ́ àwọn ènìyàn wọ̀nyẹn, gẹ́gẹ́ bí Gíríìkì ṣe ṣe.'
  naturalness: ‘Mo sì bẹ̀ yín ... kí ẹ máa ṣọ́ra fún’ jẹ́ ọ̀nà Yorùbá boṣewa tí ó rọrùn ju ‘Mo sì rọ̀ yín ... pé kí’ lọ nínú ìpè àpóstélì yìí. Gbólóhùn tí a tún ṣètò náà sì mú kí ìsopọ̀ ‘ní ìlòdì sí ẹ̀kọ́’ hàn kedere.
  terminology: ‘Ẹ̀yin arákùnrin,’ ‘ìyapa,’ ‘ohun ìkọ̀sẹ̀,’ ‘ẹ̀kọ́,’ àti ‘yà kúrò lọ́dọ̀ wọn’ yẹ, wọ́n sì pa ọ̀rọ̀ àti àwòrán Gíríìkì mọ́. Àlàyé ìsàlẹ̀ nípa ἀδελφοί tún bá ìlànà ìtumọ̀ mu, ṣùgbọ́n a tún ọ́ ṣe kí ó ṣàlàyé ìlò ọ̀rọ̀ náà ní kedere.
  issues:
