revisions:
- from: Mo sì rọ̀ yín, ẹ̀yin arákùnrin[a], pé kí ẹ máa ṣọ́ra fún àwọn tí ń fa ìyapa àti ohun ìkọ̀sẹ̀ tí ó lòdì sí ẹ̀kọ́ tí ẹ̀yin ti kọ́; kí ẹ sì yà kúrò lọ́dọ̀ wọn.
  to: Mo sì bẹ̀ yín, ẹ̀yin arákùnrin[a], kí ẹ máa ṣọ́ra fún àwọn tí ń fa ìyapa àti ohun ìkọ̀sẹ̀ ní ìlòdì sí ẹ̀kọ́ tí ẹ̀yin ti kọ́; kí ẹ sì yà kúrò lọ́dọ̀ wọn.
  rationale: A tún ìṣètò gbólóhùn ṣe kí ‘ní ìlòdì sí ẹ̀kọ́ tí ẹ̀yin ti kọ́’ lè kan ìyapa àti ohun ìkọ̀sẹ̀ papọ̀, gẹ́gẹ́ bí ìtumọ̀ Gíríìkì. A sì yí ‘rọ̀’ padà sí ‘bẹ̀’ fún ìpè tí ó dára síi nínú Yorùbá boṣewa, láì dín agbára παρακαλῶ kù. Àlàyé ìsàlẹ̀ náà ni a tún ṣe fún ìmọ́lẹ̀ àti ìbámu pẹ̀lú ìtumọ̀ aṣojú ἀδελφοί.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:43Z'
