id: ROM.16.17
reference: Romans 16:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: yo
  text: Mo sì bẹ̀ yín, ẹ̀yin arákùnrin[a], kí ẹ máa ṣọ́ra fún àwọn tí ń fa ìyapa àti ohun ìkọ̀sẹ̀ ní ìlòdì sí ẹ̀kọ́ tí ẹ̀yin ti kọ́; kí ẹ sì yà kúrò lọ́dọ̀ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin”; ọ̀rọ̀ Gíríìkì náà ní “arákùnrin,” ṣùgbọ́n ó ṣeé ṣe kí ó tọ́ka sí gbogbo ìjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Mo sì rọ̀ yín
  rationale: “Rọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìpè olùṣọ́-àgùntàn tí ó lágbára; “sì” ń gbé δέ kalẹ̀ gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀, kì í ṣe àmì àkókò.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Èyí pa akọ ọ̀pọ̀ nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí ó ń bá gbogbo ìjọ, títí kan àwọn obìnrin, sọ̀rọ̀.
- source_word: σκοπεῖν
  choice: kí ẹ máa ṣọ́ra fún
  rationale: Ó sọ ìfiyèsí pẹ̀lú ìkìlọ̀ ní Yorùbá àdánidá, dípò ọ̀rọ̀ tí yóò túmọ̀ sí wíwo lásán.
- source_word: διχοστασίας
  choice: ìyapa
  rationale: Ó ṣe kedere pé a ń sọ̀rọ̀ nípa ìpín tàbí ìdàrúdàpọ̀ tí ń ya àwùjọ onígbàgbọ́ sí méjì.
- source_word: σκάνδαλα
  choice: ohun ìkọ̀sẹ̀
  rationale: Ó pa àwòrán ohun tí ń mú ènìyàn kọsẹ̀ nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: παρὰ τὴν διδαχήν
  choice: tí ó lòdì sí ẹ̀kọ́
  rationale: Παρά pẹ̀lú accusative níbí ń tọ́ka sí ohun tí ó yà kúrò nínú ìlànà ẹ̀kọ́ tàbí tí ó tako ó.
- source_word: ἐμάθετε
  choice: tí ẹ̀yin ti kọ́
  rationale: Ó fi hàn pé àwọn olùgbọ́ ti kọ́ ẹ̀kọ́ náà tẹ́lẹ̀, ó sì jẹ́ ọ̀nà Yorùbá tí ó tààrà.
- source_word: ποιοῦντας
  choice: àwọn tí ń fa
  rationale: Ní àyíká yìí participle náà túmọ̀ sí àwọn tí ń mú ìyapa àti ìkọ̀sẹ̀ wá.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: kí ẹ sì yà kúrò lọ́dọ̀ wọn
  rationale: Ó pa agbára àṣẹ àti àwòrán yíyà tàbí yíyí kúrò lọ́dọ̀ wọn mọ́.
theological_decisions:
- issue: Bí ἀδελφοί ṣe dúró fún àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ nínú ìjọ Róòmù
  choice: Pa “ẹ̀yin arákùnrin” mọ́ nínú ẹsẹ̀, kí àlàyé ìsàlẹ̀ sì sọ pé ó ṣeé ṣe kí gbogbo ìjọ ni ó ń tọ́ka sí.
  alternative: Túmọ̀ ọ́ ní pàtó gẹ́gẹ́ bí “ẹ̀yin arákùnrin àti arábìnrin.”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ọ̀pọ̀ ní ìrísí, ṣùgbọ́n nínú lílò Pọ́ọ̀lù ó sábà máa ń pe gbogbo àwùjọ onígbàgbọ́; àlàyé ìsàlẹ̀ ń pa ìrísí àti agbára aṣojú rẹ̀ méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo “ẹ̀yin” láti fi ìtẹnumọ́ ὑμεῖς hàn, a sì pa àwòrán “ohun ìkọ̀sẹ̀” àti yíyà kúrò lọ́dọ̀ wọn mọ́.
