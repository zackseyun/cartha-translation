id: ROM.16.25
reference: Romans 16:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: yo
  text: '[a] Fún ẹni tí ó lè fi ẹ múlẹ̀ gẹ́gẹ́ bí ìhìn rere mi àti ìkéde Jésù Mèsáyà, gẹ́gẹ́ bí ìṣípayá àṣírí tí a ti fi pamọ́ jálẹ̀ àwọn ìgbà àtijọ́ pípẹ́,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ 25–27 jẹ́ orin ìyìn ìparí tí ó wà ní ibi ọ̀tọ̀ọ̀tọ̀ nínú àwọn àfọwọ́kọ ìgbàanì. Ó wà ní òpin orí 14 nínú ọ̀pọ̀ jù lọ àwọn àfọwọ́kọ àṣà Baisántáìnì, lẹ́yìn orí 15 nínú páírọ́sì àkọ́kọ́ jù lọ tí ó ṣì wà, ó sì wà níbí ní òpin orí 16 nínú àwọn àfọwọ́kọ pàtàkì ti ọ̀rúndún kẹrin àti nínú àṣà èdè Látìn. Àwọn àfọwọ́kọ kan fi sí ibi tí ó ju ẹyọ kan lọ, àwọn díẹ̀ sì yọ ọ́ kúrò pátápátá. Ọ̀pọ̀ àwọn ìtumọ̀ òde òní fi í síbí gẹ́gẹ́ bí ìparí lẹ́tà Pọ́ọ̀lù.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: mú kí ẹ dúró ṣinṣin
  rationale: Ó sọ nípa fífi àwọn onígbàgbọ́ múlẹ̀ kí wọ́n sì lágbára nínú ìgbàgbọ́; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó tún pa àwòrán ‘dídúró ṣinṣin’ mọ́.
- source_word: εὐαγγέλιόν
  choice: ìhìn rere
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ṣe kedere fún ìròyìn rere Ọlọ́run tí Pọ́ọ̀lù ń kéde.
- source_word: κήρυγμα
  choice: ìkéde
  rationale: ‘Ìkéde’ mú ìṣe pípolongo ọ̀rọ̀ ní gbangba jáde, ó sì yẹ fún ọ̀rọ̀ Gíríìkì yìí láìfi ìtumọ̀ ẹ̀sìn kan tí ó dín kù sí i.
- source_word: μυστηρίου
  choice: àṣírí
  rationale: Nínú àyíká yìí, ó tọ́ka sí ète Ọlọ́run tí kò tíì hàn ṣùgbọ́n tí a ṣí payá; ‘àṣírí’ jẹ́ èdè Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: σεσιγημένου
  choice: tí a ti pa mọ́
  rationale: Ó fi hàn pé a kò sọ tàbí ṣí àṣírí náà payá ní àwọn àkókò ìṣáájú; ‘pa mọ́’ jẹ́ àdánidá ju ìtumọ̀ gangan bí ‘pa ní ìdákẹ́jẹ́’ lọ.
- source_word: χρόνοις αἰωνίοις
  choice: jálẹ̀ àwọn ìgbà àtijọ́ pípẹ́
  rationale: Nínú ọ̀rọ̀ yìí, gbólóhùn náà tọ́ka sí ọ̀pọ̀lọpọ̀ àkókò tí ó ti kọjá, kì í ṣe dandan sí àìlópin; yíyan yìí mú ìtumọ̀ àyíká náà hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ ọ̀rọ̀ nínú κήρυγμα Ἰησοῦ Χριστοῦ
  choice: ìkéde Jésù Mèsáyà
  alternative: ìkéde nípa Jésù Mèsáyà / ìkéde tí Jésù Mèsáyà ṣe
  rationale: Gíríìkì lè túmọ̀ sí ìkéde nípa Jésù tàbí ìkéde tirẹ̀. Fífi àwọn orúkọ náà lẹ́gbẹ̀ẹ́ ara wọn ní Yorùbá ń pa ìwọ̀n àìdánilójú yìí mọ́ dípò pípa á mọ́ sí ọ̀nà kan ṣoṣo.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró, ó sì bá ‘Mèsáyà’ mu; a yà á sí oyè lẹ́yìn orúkọ Jésù láìfi ẹ̀kọ́ ìjọ kan kún un.
- issue: Àkókò tí àṣírí náà wà ní ìpamọ́
  choice: àwọn ìgbà àtijọ́ pípẹ́
  alternative: àwọn ìgbà ayérayé
  rationale: Àyíká náà ń fi ìpamọ́ ní ìgbà pípẹ́ wé ìṣípayá rẹ̀ nísinsìnyí. ‘Àtijọ́ pípẹ́’ yẹra fún fífi èrò pé àṣírí náà wà ní ìpamọ́ láìní ìbẹ̀rẹ̀ tàbí òpin wọ inú ọ̀rọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tí ó níyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìrísí gbólóhùn tí ń bá ẹsẹ tó tẹ̀ lé e lọ mọ́ nípasẹ̀ àmì kọ́mà ní òpin.
