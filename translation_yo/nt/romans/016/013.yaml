id: ROM.16.13
reference: Romans 16:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: yo
  text: Ẹ kí Rúfù, ẹni tí a yàn[a] nínú Olúwa, àti ìyá rẹ̀ àti tèmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni àṣàyàn nínú Olúwa.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ẹni pàtàkì tàbí ẹni tí ó tayọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ìkíni ìparí lẹ́tà mu.
- source_word: Ῥοῦφον
  choice: Rúfù
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró rẹ̀, ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: ἐκλεκτὸν
  choice: ẹni tí a yàn
  rationale: Ó pa ìtumọ̀ “ẹni tí a yàn” mọ́ láì fi kún un pé ta ni ó yàn án tàbí láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtó; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì hàn.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa àjọṣe tàbí ipò tí gbólóhùn Gíríìkì ń tọ́ka sí mọ́, láì yí i sí “láti ọwọ́ Olúwa” tàbí “nípasẹ̀ Olúwa.”
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: ìyá rẹ̀ àti tèmi
  rationale: 'Èyí pa ìsọ̀rọ̀-kúkúrú àti ìfẹ́ inú gbólóhùn Gíríìkì náà mọ́: ìyá Rúfù ni Pọ́ọ̀lù tún pè ní ìyá tirẹ̀, láì ṣàlàyé ìbáṣepọ̀ náà jù.'
theological_decisions:
- issue: Ìtumọ̀ ἐκλεκτὸν ἐν κυρίῳ
  choice: ẹni tí a yàn nínú Olúwa
  alternative: ẹni àṣàyàn tàbí ẹni tí ó tayọ nínú Olúwa
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí yíyàn láti ọ̀dọ̀ Ọlọ́run tàbí sí ẹni pàtàkì tó tayọ láàárín àwọn tó wà nínú Olúwa. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ pa ìṣòro ìtumọ̀ yìí mọ́ láì fi ẹ̀kọ́ ìgbàgbọ́ kan pàtó lé e lórí.
- issue: Ìtumọ̀ “ìyá rẹ̀ àti tèmi”
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ó ti rí, kí ó lè fi ìfẹ́ àti ìbáṣepọ̀ Pọ́ọ̀lù hàn.
  alternative: ìyá rẹ̀, ẹni tí ó tún dà bí ìyá sí mi
  rationale: Àyíká lẹ́tà náà fi hàn pé ó ṣeé ṣe kó jẹ́ ìbáṣepọ̀ ìfẹ́ àti ìtọ́jú, kì í ṣe pé obìnrin náà bí Pọ́ọ̀lù ní ti ara. Síbẹ̀, a kò sọ ìtumọ̀ àpèjúwe náà di dandan nínú ọrọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹ kí” bá àṣẹ sí ọ̀pọ̀ ènìyàn mu; “ìyá rẹ̀ àti tèmi” sì pa ọ̀rọ̀ kúkúrú, onífẹ̀ẹ́ ti orísun náà mọ́.
