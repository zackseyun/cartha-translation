  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: yo
  text: Tímótì, alábáṣiṣẹ́ mi, kí yín. Lúkíù, Jásónì àti Sósípátérì, àwọn ará mi[a], náà sì kí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ tí a túmọ̀ sí “àwọn ará mi” lè túmọ̀ sí “àwọn ìbátan mi” tàbí “àwọn Júù bí èmi.” Ó lè tọ́ka sí ìbátan ẹ̀jẹ̀ tàbí ìbátan ẹ̀yà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: kí yín
  rationale: Nínú lẹ́tà, ἀσπάζομαι túmọ̀ sí fífi ìkíni ránṣẹ́ tàbí kí ẹnì kan; “kí yín” jẹ́ ọ̀nà Yorùbá àdánidá, ó sì bá nọ́ńbà ọ̀pọ̀ ὑμᾶς mu.
- source_word: συνεργός
  choice: alábáṣiṣẹ́
  rationale: Ó tọ́ka sí ẹni tí ó ń ṣiṣẹ́ pọ̀ pẹ̀lú ẹlòmíràn nínú iṣẹ́ kan; “alábáṣiṣẹ́” ṣe ìtumọ̀ ìfọwọ́sowọ́pọ̀ náà ní kedere láì mú èrò ilé-iṣẹ́ òde òní wọ inú rẹ̀.
- source_word: Τιμόθεος
  choice: Tímótì
  rationale: Orúkọ náà ni a ṣe ní ìrísí tí ó ti wọ́pọ̀, tí ó sì rọrùn fún òǹkàwé Yorùbá.
- source_word: Λούκιος
  choice: Lúkíù
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìró Gíríìkì ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: Ἰάσων
  choice: Jásónì
  rationale: Àkọsílẹ̀ orúkọ náà jẹ́ èyí tí ó ṣeé kà ní Yorùbá, tí ó sì pa ìdánimọ̀ orúkọ Gíríìkì mọ́.
- source_word: Σωσίπατρος
  choice: Sósípátérì
  rationale: A tẹ̀ lé fọ́ọ̀mù kíkún Σωσίπατρος tí ó wà nínú ẹsẹ yìí, dípò fọ́ọ̀mù kúkúrú mìíràn.
- source_word: συγγενεῖς μου
  choice: àwọn ará mi
  rationale: “Àwọn ará mi” lè tọ́ka sí ìbátan ẹ̀jẹ̀ tàbí sí àwọn ènìyàn ẹ̀yà kan náà, nítorí náà ó dá àìdánilójú inú ọ̀rọ̀ Gíríìkì náà sílẹ̀ dáadáa ju ọ̀rọ̀ tó dín ìtumọ̀ rẹ̀ kù lọ.
theological_decisions:
- issue: Ìtumọ̀ συγγενεῖς μου nínú lílo Páùlù
  choice: àwọn ará mi
  alternative: àwọn ìbátan mi; àwọn Júù bí èmi
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbátan ẹ̀jẹ̀ tàbí ìbátan ẹ̀yà. Ẹsẹ náà kò pinnu èwo ni Páùlù ní lọ́kàn, nítorí náà a pa àìdánilójú náà mọ́ nínú àkọ́kọ́, a sì fi àwọn ìtumọ̀ tó ṣeé ṣe sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A lo “kí yín” láti fi hàn pé àwọn olùgbà jẹ́ ọ̀pọ̀; gbolohun méjì mú àtòjọ àwọn olùkíni ṣe kedere àti àdánidá.
