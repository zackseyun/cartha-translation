  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: yo
  text: Ẹ kí Amplíátù[a], olùfẹ́ mi nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè kọ ìrísí orúkọ Gíríìkì náà sí “Amplíásì”; ṣùgbọ́n kíkà SBLGNT níhìn-ín ṣe àtìlẹ́yìn fún “Amplíátù.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Àṣẹ aorist middle fún ọ̀pọ̀ ènìyàn ni; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àṣà ìkíni inú lẹ́tà mu.
- source_word: Ἀμπλιᾶτον
  choice: Amplíátù
  rationale: 'A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìrísí Gíríìkì Ἀμπλιᾶτον (ìpìlẹ̀ orúkọ: Ἀμπλιᾶτος), a sì mú un bá ìró àti ìkọ̀wé Yorùbá mu.'
- source_word: ἀγαπητόν μου
  choice: olùfẹ́ mi
  rationale: “Olùfẹ́ mi” fi ìfẹ́ àti ìbátan tímọ́tímọ́ tí ọ̀rọ̀ Gíríìkì náà ní hàn ní èdè Yorùbá àdánidá, láì sọ ọ́ di ìfẹ́ ọkọ sí aya.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa àkànṣe ọ̀rọ̀ Paulu mọ́, ó sì tọ́ka sí ìbátan tàbí ipò ìyè wọn nínú Olúwa, láì fi “Jésù” kún ohun tí Gíríìkì kò sọ.
theological_decisions:
- issue: Ìtumọ̀ ìfẹ́ Paulu àti ipa ἐν κυρίῳ
  choice: “olùfẹ́ mi nínú Olúwa” so ìfẹ́ Paulu mọ́ ìbáṣepọ̀ wọn nínú Olúwa.
  alternative: Kí a túmọ̀ rẹ̀ sí ọ̀rẹ́ mi ọ̀wọ́n lásán, tàbí kí “nínú Olúwa” ṣàlàyé ìṣe kíkí náà.
  rationale: Ìtò ọ̀rọ̀ Gíríìkì fi hàn pé τὸν ἀγαπητόν μου ἐν κυρίῳ ń ṣàpèjúwe Amplíátù. Ìtumọ̀ yìí pa ìfẹ́ ẹni-kọ̀ọ̀kan àti ìpilẹ̀ rẹ̀ nínú ìrẹ́pọ̀ Kristẹni mọ́ láì pinnu ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye ni a lò. “Ẹ” fi hàn pé àṣẹ náà ń lọ sí ọ̀pọ̀ olùgbọ́; àmì ohùn ni a fi sí àwọn ọ̀rọ̀ Yorùbá àti orúkọ bí ó ṣe yẹ.
