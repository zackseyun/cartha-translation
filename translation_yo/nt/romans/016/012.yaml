  to: Ẹ kí Trífénà àti Trífósà, tí wọ́n ti ṣiṣẹ́ takuntakun nínú Olúwa.[a] Ẹ kí Pérísì, olùfẹ́,[b] ẹni tí ó ti ṣiṣẹ́ takuntakun púpọ̀ nínú Olúwa.
  rationale: Àtúnṣe náà yọ “náà” kúrò nínú “olùfẹ́ náà” kí ἀγαπητήν má bà a dà bí “ẹni yẹn náà,” àti kí a pa ìdí tí kò fi yẹ kí a fi “mi” kún un mọ́. A tún yọ “àwọn obìnrin” kúrò nítorí pé ó jẹ́ àfikún tí Yorùbá kò nílò nínú ìkíni yìí. “Ṣiṣẹ́ takuntakun” ń fi ìsapá tí κοπιάω ní hàn, ó sì ń pa àtúnlò náà mọ́ ní apá méjèèjì.
