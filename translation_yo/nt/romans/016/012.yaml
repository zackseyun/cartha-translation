  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: yo
  text: Ẹ kí Trífénà àti Trífósà, tí wọ́n ti ṣiṣẹ́ takuntakun nínú Olúwa.[a] Ẹ kí Pérísì, olùfẹ́,[b] ẹni tí ó ti ṣiṣẹ́ takuntakun púpọ̀ nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “tí wọ́n ń ṣiṣẹ́ takuntakun nínú Olúwa” tàbí “tí wọ́n ti ṣe iṣẹ́ àṣekára nínú Olúwa.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìtumọ̀ kan ní “Pérísì, olùfẹ́ mi”; ṣùgbọ́n Gíríìkì wí pé “olùfẹ́” lásán, kò sì sọ “mi” ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ sí ọ̀pọ̀ ènìyàn ni; “Ẹ kí” jẹ́ ọ̀nà Yorùbá àdánidá, kúkúrú, tó sì bá àkójọ ìkíni lẹ́tà mu.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Trífénà àti Trífósà
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe wọ́n, dípò títúmọ̀ ìtumọ̀ orúkọ wọn.
- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: tí wọ́n ti ṣe làálàá / tí ó ti ṣe làálàá
  rationale: “Ṣe làálàá” fi iṣẹ́ takuntakun àti àárẹ̀ inú iṣẹ́ hàn, ó sì pa àtúnlò ọ̀rọ̀ κοπιάω mọ́ ní apá méjèèjì.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ìtumọ̀ Pọ́ọ̀lù nípa iṣẹ́ tí a ṣe nínú ìbáṣepọ̀ àti ààyè Olúwa mọ́, láì dín un kù sí “fún Olúwa” nìkan.
- source_word: Περσίδα
  choice: Pérísì
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní fọ́ọ̀mù tó ṣeé pè ní Yorùbá, a kò sì túmọ̀ orúkọ náà.
- source_word: τὴν ἀγαπητήν
  choice: olùfẹ́ náà
  rationale: Ó túmọ̀ àpèjúwe ẹni tí a fẹ́ràn láì fi “mi” kún un, nítorí pé ọ̀rọ̀ Gíríìkì kò ní arọ́pò-orúkọ ohun-ìní.
- source_word: πολλὰ
  choice: púpọ̀
  rationale: Ó fi bí iṣẹ́ Pérísì ti pọ̀ tó hàn ní ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ ἐν κυρίῳ nínú gbólóhùn iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù
  choice: nínú Olúwa
  alternative: fún Olúwa; nínú iṣẹ́ ìránṣẹ́ sí Olúwa
  rationale: “Nínú Olúwa” pa ìtumọ̀ ìbáṣepọ̀ àti ààyè tẹ̀mí mọ́, láì sọ ọ́ di ète iṣẹ́ nìkan.
- issue: Ṣíṣe àfihàn ἀγαπητήν láì fi ohun-ìní kún un
  choice: olùfẹ́ náà
  alternative: olùfẹ́ mi
  rationale: Ko sí μου (“mi”) nínú Gíríìkì; nítorí náà, a kò fi ìtumọ̀ ohun-ìní tí kò sí nínú ẹsẹ̀ náà kún un.
translation_notes:
  register: Yorùbá àṣà-lítíréṣọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Àwọn obìnrin” mú akọ abo ti participle Gíríìkì hàn; “ṣe làálàá” pa agbára ọ̀rọ̀ àti àtúnlò κοπιάω mọ́.
