  terminology: “Nínú Olúwa” tọ́, ó sì yẹ kí a pa á mọ́. “Olùfẹ́” ni a lò gẹ́gẹ́ bí àpèjúwe fún ẹni tí a fẹ́ràn; a yọ “náà” kúrò kí a má bà a dà bí aṣàròyé tàbí àmì ìtọ́kasí ẹni kan. Àwọn orúkọ náà ni a pa mọ́ gẹ́gẹ́ bí a ṣe kọ wọ́n nínú àtẹ̀jáde.
