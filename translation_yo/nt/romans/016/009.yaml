source:
  edition: SBLGNT
  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: yo
  text: Ẹ kí Urbanu, alábàáṣiṣẹ́ wa nínú Mèsáyà, àti Stákísì, olùfẹ́ mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì túmọ̀ sí kí wọ́n fi ìkíni ránṣẹ́ sí àwọn tí a dárúkọ. “Ẹ kí” jẹ́ ọ̀nà àdánidá, ṣókí, tí ó sì bójú mu ní Yorùbá.
- source_word: Οὐρβανὸν
  choice: Úrbánù
  rationale: A ṣe àfọwọ́kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró Gíríìkì, ní ọ̀nà tí agbọrọsọ Yorùbá lè kà nírọ̀rùn.
- source_word: συνεργὸν ἡμῶν
  choice: alábàáṣiṣẹ́ wa
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó ń ṣiṣẹ́ pọ̀ pẹ̀lú Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀; “alábàáṣiṣẹ́ wa” pa ìtumọ̀ ìfọwọ́sowọ́pọ̀ náà mọ́.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: “Nínú” pa àkíyèsí Gíríìkì mọ́ pé iṣẹ́ àjọṣe náà wà lábẹ́ ìṣọ̀kan àti ìbáṣepọ̀ pẹ̀lú ẹni tí a ń pè ní Mèsáyà. “Mèsáyà” fi iṣẹ́ Χριστός gẹ́gẹ́ bí oyè hàn.
- source_word: Στάχυν
  choice: Stákísì
  rationale: A ṣe àfọwọ́kọ orúkọ Gíríìkì náà ní ọ̀nà tí ó bá ìró rẹ̀ mu tí ó sì ṣeé kà ní Yorùbá.
- source_word: ἀγαπητόν μου
  choice: olùfẹ́ mi
  rationale: Gbólóhùn yìí ń fi ìfẹ́ àti ìmọyì ara ẹni hàn; “olùfẹ́ mi” jẹ́ ọ̀rọ̀ Yorùbá tó ní iyì, tó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú èrò ìfẹ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ nínú ἐν Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí, Χριστός ṣì lè hàn gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn. “Mèsáyà” mú oyè náà jáde kedere, nígbà tí “Kristi” jẹ́ àṣàyàn àdánidá mìíràn tí ó ti dà bí orúkọ nínú lílò Yorùbá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ó ní iyì, ó sì rọrùn fún òǹkàwé òde òní. A lo ọ̀rọ̀ àṣẹ ọ̀pọ̀ “Ẹ kí,” a sì fi àmì ohùn sí ibi tí ó ṣe àǹfààní fún kíkà tó péye.
