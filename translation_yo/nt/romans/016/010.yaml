id: ROM.16.10
reference: Romans 16:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: yo
  text: Ẹ kí Apeli, ẹni tí a ti dán wò, tí ó sì yege nínú Mèsáyà.[a] Ẹ kí àwọn ará ilé Aristobulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, gẹ́gẹ́ bí ìtumọ̀ tí ó ti wọ́pọ̀: “nínú Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bójú mu fún fífi ìkíni ránṣẹ́.
- source_word: Ἀπελλῆν
  choice: Apẹlè
  rationale: A ṣe àfọwọ́kọ orúkọ Gíríìkì náà sí ìró àti ìkọ̀wé Yorùbá.
- source_word: τὸν δόκιμον
  choice: ẹni tí a ti dán wò, tí ó sì yege
  rationale: δόκιμος ń tọ́ka sí ẹni tí ìdánwò ti fi hàn pé ó jẹ́ ojúlówó tàbí ẹni ìtẹ́wọ́gbà; gbolohun yìí pa ìtumọ̀ ìdánwò àti yíyẹ mọ́.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: “Nínú” pa àkànlò èdè Páùlù nípa ìbáṣepọ̀ tàbí ipò ẹni mọ́; “Mèsáyà” sì fi Χριστός hàn gẹ́gẹ́ bí oyè ẹni àmì òróró.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: àwọn ará ilé Aristobulu
  rationale: Àkànlò náà ṣeé ṣe kí ó tọ́ka sí àwọn ènìyàn inú agbo ilé tàbí ohun ìní Aristobulu, kì í ṣe dandan sí Aristobulu fúnra rẹ̀; “àwọn ará ilé” jẹ́ kedere, ó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ nínú àkànlò Páùlù ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nínú Kristi
  rationale: A mú oyè “Mèsáyà” láti fi ìtumọ̀ ẹni àmì òróró hàn, nígbà tí a pa “nínú” mọ́ láì sọ ọ́ di “gẹ́gẹ́ bí onígbàgbọ́.” A fi “nínú Kristi,” èyí tí ó wọ́pọ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá, sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. Àṣẹ ọ̀pọ̀ ènìyàn “Ẹ kí” ni a tún ṣe gẹ́gẹ́ bí ó ti rí nínú Gíríìkì. A lo àmì ohùn níbi tí ó bá yẹ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹlẹ́gbẹ́ kan pàtó.
