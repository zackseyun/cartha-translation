id: ROM.16.16
reference: Romans 16:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: yo
  text: Ẹ kí ara yín pẹ̀lú ìfẹnukonu mímọ́[b]. Gbogbo àwọn ìjọ ti Mèsáyà ń kí yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo àwọn ìjọ ti Kristi ń kí yín.”
    reason: alternative_reading
  - marker: b
    text: “Ìfẹnukonu mímọ́” jẹ́ irú ìkíni tí àṣà ìgbà náà mọ̀, tí ó ń fi ìfẹ́ mímọ́ àti ìbáṣepọ̀ láàárín àwọn onígbàgbọ́ hàn.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: Ẹ … kí ara yín
  rationale: Ọ̀rọ̀ ìṣe àṣẹ Ἀσπάσασθε túmọ̀ sí ‘ẹ kí,’ ἀλλήλους sì jẹ́ ọ̀rọ̀ arọ́pò-orúkọ ìfèsì ‘ara yín.’ Àkójọpọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa àṣẹ àti ìfèsì inú Gíríìkì mọ́.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: fi ìfẹnukonu mímọ́
  rationale: ἐν níbí ń fi ohun tí wọ́n fi ṣe ìkíni hàn; φίλημα ni ‘ìfẹnukonu,’ ἁγίῳ sì ṣàpèjúwe rẹ̀ gẹ́gẹ́ bí mímọ́. ‘Fi … kí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìtumọ̀ yìí.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: ń kí yín
  rationale: Fọ́ọ̀mù ìsinsìnyí Ἀσπάζονται ni a fi ‘ń kí’ hàn, ‘yín’ sì pa bí ὑμᾶς ṣe jẹ́ ọ̀pọ̀ ènìyàn mọ́.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: Gbogbo àwọn ìjọ
  rationale: Èyí pa àfihàn gbogbo àwọn ìjọ gẹ́gẹ́ bí àkójọpọ̀ mọ́, ó sì jẹ́ ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn, ìyẹn Mèsáyà; ìsopọ̀ ọ̀rọ̀ náà fi hàn pé àwọn ìjọ náà jẹ́ tirẹ̀ tàbí wọ́n ní ìbáṣepọ̀ pẹ̀lú rẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: A pa ìtumọ̀ oyè Χριστός mọ́ ní kedere pẹ̀lú ‘Mèsáyà,’ dípò kí a mú un bí orúkọ lásán. Nítorí ‘Kristi’ jẹ́ ìtumọ̀ ìbílẹ̀ tó tún ṣeé gbà, a fi sí àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ‘ìfẹnukonu mímọ́’
  choice: A pa àwòrán àṣà àti èdè orísun náà mọ́
  alternative: Kí ara yín ní ìfẹ́ mímọ́
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní pàtó pé φίλημα, ‘ìfẹnukonu.’ A kò sọ ọ́ di ìkíni gbogbogbò, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣàlàyé ipa rẹ̀ nínú àṣà àwọn onígbàgbọ́.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, tó rọrùn fún òǹkàwé lónìí. Àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tó yẹ. ‘Ẹ’ àti ‘yín’ fi hàn pé ọ̀pọ̀ ènìyàn ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
