id: ROM.16.7
reference: Romans 16:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: yo
  text: Ẹ kí Andiróníkù àti Júnìá[a], àwọn ará mi àti àwọn tí a fi sẹ́wọ̀n pọ̀ mọ́ mi. Wọ́n lókìkí láàárín àwọn àpọ́sítélì[b], wọ́n sì ti wà nínú Mèsáyà ṣáájú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Júnìá: ó tún lè jẹ́ “Júníásì,” orúkọ ọkùnrin; ṣùgbọ́n orúkọ obìnrin ló ṣeé ṣe jù lọ nítorí ìrísí ọ̀rọ̀ Gíríìkì náà àti ẹ̀rí ìtàn nípa lílo orúkọ náà.'
    reason: alternative_reading
  - marker: b
    text: Ó tún lè jẹ́ “wọ́n jẹ́ gbajúgbajà láàárín àwọn àpọ́sítélì”; gbolohun náà sì tún lè túmọ̀ sí “àwọn àpọ́sítélì mọ̀ wọ́n dáadáa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí kí a kí ẹnì kan tàbí kí a fi ìkíni ránṣẹ́ sí i; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa agbára àṣẹ náà mọ́.
- source_word: Ἀνδρόνικον
  choice: Andiróníkù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe àwọn orúkọ Gíríìkì ní Yorùbá.
- source_word: Ἰουνίαν
  choice: Júnìá
  rationale: Ìrísí ọ̀rọ̀ Gíríìkì náà ṣeé ṣe jù lọ gẹ́gẹ́ bí orúkọ obìnrin Júnìá; a fi àṣàyàn orúkọ ọkùnrin sínú àlàyé ìsàlẹ̀.
- source_word: συγγενεῖς μου
  choice: àwọn ará mi
  rationale: Ó lè túmọ̀ sí ìbátan tàbí àwọn alábáṣepọ̀ ẹ̀yà kan náà. “Àwọn ará mi” jẹ́ ti ẹ̀dá Yorùbá, ó sì jẹ́ kí ìtumọ̀ méjèèjì ṣì ṣeé gbà.
- source_word: συναιχμαλώτους μου
  choice: àwọn ẹlẹ́wọ̀n ẹlẹgbẹ́ mi
  rationale: Ó tọ́ka sí àwọn tí a fi sẹ́wọ̀n papọ̀ pẹ̀lú ẹni náà; gbolohun yìí mú ìtumọ̀ gidi náà jáde ní kedere.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: ẹni pàtàkì láàárín àwọn àpọ́sítélì
  rationale: “Ẹni pàtàkì” mú ìtumọ̀ ọlá tàbí òkìkí ἐπίσημοι jáde, “láàárín” sì tẹ̀ lé ìtumọ̀ tó ṣe tààrà jù lọ ti ἐν; àlàyé ìsàlẹ̀ pa àìdánilójú bóyá wọ́n wà nínú ẹgbẹ́ náà tàbí àwọn àpọ́sítélì mọ̀ wọ́n dáadáa mọ́.
- source_word: πρὸ ἐμοῦ
  choice: ṣáájú mi
  rationale: Ó fi àkókò tí ó ṣáájú ti Pọ́ọ̀lù hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: γέγοναν ἐν Χριστῷ
  choice: wọ́n ti wà nínú Mèsáyà
  rationale: Ọ̀rọ̀ ìṣe pípé náà fi ipò tí ó bẹ̀rẹ̀ tẹ́lẹ̀ tí ó sì ń bá a lọ hàn. “Nínú Mèsáyà” pa àpẹẹrẹ ọ̀rọ̀ orísun àti Χριστός gẹ́gẹ́ bí oyè mọ́, láì yí i padà sí àlàyé ìyípadà ìgbàgbọ́.
theological_decisions:
- issue: Ìdánimọ̀ àti akọ tàbí abo ti Ἰουνίαν
  choice: A túmọ̀ ọ́ sí Júnìá, orúkọ obìnrin.
  alternative: Júníásì, orúkọ ọkùnrin.
  rationale: Ìrísí Gíríìkì àti ẹ̀rí lílo orúkọ ní ìtàn ṣe àtìlẹ́yìn fún orúkọ obìnrin. Síbẹ̀, a fi àṣàyàn ọkùnrin tí ó ti ní ipa nínú ìtumọ̀ sí àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: “ẹni pàtàkì láàárín àwọn àpọ́sítélì”
  alternative: “àwọn àpọ́sítélì mọ̀ wọ́n dáadáa” tàbí “wọ́n tayọ láàárín àwọn àpọ́sítélì”
  rationale: Gbolohun náà lè ka wọ́n mọ́ àwọn àpọ́sítélì tàbí kí ó sọ pé àwọn àpọ́sítélì mọ̀ wọ́n, ìtumọ̀ ἐπίσημοι sì lè tẹnumọ́ ọlá tàbí òkìkí. Ọ̀rọ̀ inú ẹsẹ̀ tẹ̀ lé ìtumọ̀ Gíríìkì tó ṣe tààrà, àlàyé ìsàlẹ̀ sì pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá àgbàdojúbo tó ní àmì ohùn ni a lò, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Àwọn ará mi” pa àìdánilójú ìbátan tàbí ẹ̀yà kan náà mọ́; “Mèsáyà” sì fi Χριστός hàn gẹ́gẹ́ bí oyè.
