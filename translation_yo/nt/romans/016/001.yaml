id: ROM.16.1
reference: Romans 16:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: yo
  text: Mo fi Fóíbè, arábìnrin wa, sọ̀rọ̀ rere fún yín. Òun sì tún jẹ́ díákónì[a] ti ìjọ tí ó wà ní Kẹ́ńkíréà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìránṣẹ́” tàbí “òjíṣẹ́” ti ìjọ ní Kẹ́ńkíréà. Ọ̀rọ̀ Gíríìkì náà, diakonos, lè tọ́ka sí ojúṣe iṣẹ́ ìránṣẹ́ kan tí ìjọ mọ̀ sí, tàbí sí ẹni tí ń ṣe iṣẹ́ ìránṣẹ́ lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Mo fi … sọ̀rọ̀ rere fún yín
  rationale: Nínú lẹ́tà, ọ̀rọ̀ náà jẹ́ ọ̀nà láti fi ẹni kan hàn sí àwọn olùgbà lẹ́tà pẹ̀lú ìfọwọ́sí, kí wọ́n lè gbà á dáadáa. Èyí túmọ̀ ìyìn àti ìdámọ̀ràn náà láì sọ ọ́ di fífi ẹni náà lé wọn lọ́wọ́.
- source_word: δὲ
  choice: (kò ní ọ̀rọ̀ ọ̀tọ̀ ní ìbẹ̀rẹ̀); sì ni gbólóhùn kejì
  rationale: δὲ jẹ́ àmì ìyípadà ọ̀rọ̀ tí kò ní ìtakò líle. Yorùbá kò nílò ‘nísinsìnyí’ níbí; ‘sì’ ń jẹ́ kí ìṣàn ọ̀rọ̀ náà bá èdè Yorùbá mu.
- source_word: Φοίβην
  choice: Fóíbè
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìbámu pẹ̀lú ìró rẹ̀, dípò kí a gbẹ́kẹ̀ lé ìpè Gẹ̀ẹ́sì.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: arábìnrin wa
  rationale: Ó pa èdè ìdílé tí Pọ́ọ̀lù lò fún ẹni tí ó jẹ́ onígbàgbọ́ bíi tiwọn mọ́ láì fi àlàyé kún un.
- source_word: οὖσαν καὶ
  choice: Òun sì tún jẹ́
  rationale: Ó sọ àlàyé àfikún ní Yorùbá àdánidá, ó sì pa agbára àfikún καί (‘tún’) mọ́.
- source_word: διάκονον
  choice: díákónì
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ojúṣe tí ìjọ mọ̀ sí tàbí sí ẹni tí ń ṣe iṣẹ́ ìránṣẹ́ lápapọ̀. ‘Díákónì’ pa ìtumọ̀ ojúṣe ìjọ mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn hàn.
- source_word: τῆς ἐκκλησίας
  choice: ti ìjọ
  rationale: ‘Ìjọ’ ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún àwùjọ àwọn onígbàgbọ́ ní àyíká yìí.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: tí ó wà ní Kẹ́ńkíréà
  rationale: Ó túmọ̀ gbólóhùn ibi náà ní Yorùbá àdánidá, ó sì kọ orúkọ ibi Gíríìkì náà ní ìbámu pẹ̀lú ìró rẹ̀.
theological_decisions:
- issue: Bóyá διάκονον túmọ̀ sí orúkọ ipò iṣẹ́ ìjọ tàbí ẹni tí ń ṣe iṣẹ́ ìránṣẹ́ lápapọ̀
  choice: díákónì
  alternative: ìránṣẹ́ tàbí òjíṣẹ́ ìjọ
  rationale: Àpapọ̀ rẹ̀ mọ́ ‘ti ìjọ tí ó wà ní Kẹ́ńkíréà’ lè fi ojúṣe kan tí ìjọ náà mọ̀ hàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà kò fi dandan pinnu irú ètò díákónì tí àwọn ẹ̀sìn kan ní nígbà tó yá. Nítorí náà, a lo ‘díákónì’ nínú ọ̀rọ̀, a sì pa àwọn ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. A kọ àwọn orúkọ Fóíbè àti Kẹ́ńkíréà láti inú ìró Gíríìkì; ‘díákónì’ jẹ́ ọ̀rọ̀ àyálò tí ọ̀pọ̀ ìjọ Yorùbá mọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ dènà kí onítumọ̀ má bàa fi ètò ẹ̀sìn ìgbà tó yá sínú ẹsẹ̀ náà.
