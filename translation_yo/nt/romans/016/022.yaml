  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: yo
  text: Èmi Tẹ́rítíọ̀sì, ẹni tí ó kọ lẹ́tà náà, mo kí yín nínú Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, tí ó kéré sí i ní ìṣeéṣe: “Èmi Tẹ́rítíọ̀sì, ẹni tí ó kọ lẹ́tà náà nínú Olúwa, mo kí yín.” Nínú èdè Gíríìkì, a lè so gbólóhùn náà, “nínú Olúwa,” mọ́ “kọ,” ṣùgbọ́n ó ṣeé ṣe jù pé ó ń ṣàlàyé ìkíni náà.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: mo kí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí kíni tàbí fífi ìkíni ránṣẹ́; “mo kí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìparí lẹ́tà mu láìfi ìmọ̀lára tí Gíríìkì kò sọ kún un.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni; “yín” fi ọ̀pọ̀ hàn ní Yorùbá.
- source_word: ἐγὼ Τέρτιος
  choice: Èmi Tẹ́tíọ̀sì
  rationale: Arọ́pò-orúkọ tí a sọ ní gbangba pẹ̀lú orúkọ náà ń fi ẹni tó ń sọ̀rọ̀ hàn ní pàtó; “Èmi Tẹ́tíọ̀sì” pa ìtẹnumọ́ yẹn mọ́ lọ́nà àdánidá.
- source_word: ὁ γράψας
  choice: ẹni tí ó kọ
  rationale: Èyí fi Tẹ́tíọ̀sì hàn gẹ́gẹ́ bí ẹni tó kọ lẹ́tà náà sílẹ̀ ní ti ọwọ́; gbólóhùn ìbátan yìí ṣe kedere ní Yorùbá.
- source_word: τὴν ἐπιστολήν
  choice: lẹ́tà náà
  rationale: “Lẹ́tà” jẹ́ ọ̀rọ̀ òde òní tó wọ́pọ̀ fún ἐπιστολή, “náà” sì bá atókùn pàtó inú Gíríìkì mu láìfi ọ̀rọ̀ atọ́ka “yìí” kún un.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: “Nínú Olúwa” pa gbólóhùn Pọ́ọ̀lù yìí mọ́ gẹ́gẹ́ bí ìbáṣepọ̀ tàbí ààyè ìrẹ́pọ̀ àwọn onígbàgbọ́ nínú Olúwa.
theological_decisions:
- issue: Ohun tí “ἐν κυρίῳ” ń ṣàlàyé
  choice: 'A so “nínú Olúwa” mọ́ ìkíni: Tẹ́tíọ̀sì ń kí wọn nínú Olúwa.'
  alternative: 'A lè so ó mọ́ kíkọ lẹ́tà náà: “ẹni tí ó kọ lẹ́tà náà nínú Olúwa.”'
  rationale: Nínú ọ̀rọ̀ ìparí lẹ́tà yìí, ó ṣeé ṣe jù pé gbólóhùn náà ń ṣàlàyé ìkíni gẹ́gẹ́ bí ìkíni láàárín àwọn tó wà ní ìrẹ́pọ̀ pẹ̀lú Olúwa. Síbẹ̀, àkọsílẹ̀ ìsàlẹ̀ jẹ́wọ́ pé ìṣọ̀kan ọ̀rọ̀ Gíríìkì tún lè jẹ́ kí a so ó mọ́ “kọ.”
translation_notes:
  register: Yorùbá àgbàdojú-ìwọ̀n, ọlọ́lá, tó sì ṣeé lóye ni a lò. Àmì ohùn wà níbi tí ó yẹ; “lẹ́tà” jẹ́ ọ̀rọ̀ òde òní tó wọ́pọ̀, “Olúwa” sì pa ìtumọ̀ κύριος mọ́.
