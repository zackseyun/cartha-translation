base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: yo
  text: '[b]Kí oore-ọ̀fẹ́ Olúwa wa Jésù Kristi wà pẹ̀lú gbogbo yín. Àmín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní ẹsẹ̀ yìí, ṣùgbọ́n àwọn mìíràn sì yọ ọ́ kúrò; ọ̀pọ̀ àtẹ̀jáde òde òní ka a sí àyípadà ọ̀rọ̀ ní apá ìparí ìwé Róòmù.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó sì ní ìwọ̀n láti sọ èrò inú χάρις gẹ́gẹ́ bí ojú rere àti ẹ̀bùn àìlẹ́tọ̀ọ́sí Ọlọ́run.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ ìtumọ̀ àdánidá àti ọ̀wọ̀ fún κύριος nínú oyè tí a fi ń jẹ́wọ́ ipò Jésù.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Kristi
  rationale: “Jésù” ni ìrísí orúkọ tí ó ti fìdí múlẹ̀ ní Yorùbá; “Kristi” jẹ́ ìrísí ìbílẹ̀ fún Χριστός tí ó sì ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Mèsáyà nínú èdè Yorùbá ìgbàlódé.
- source_word: μετὰ πάντων ὑμῶν
  choice: wà pẹ̀lú gbogbo yín
  rationale: Ó pa ìtumọ̀ μετά pẹ̀lú genitive àti ìkó gbogbo àwọn olùgbọ́ sínú πάντων ὑμῶν mọ́ ní Yorùbá àdánidá.
- source_word: Ἀμήν
  choice: Àmín
  rationale: Ìkọ̀wé ìbílẹ̀ tí àwọn òǹkà Yorùbá mọ̀ dáadáa ni, ó sì bójú tó iṣẹ́ ìjẹ́rìí ìjọsìn ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Bí a ṣe máa ṣe Χριστός nínú Ἰησοῦ Χριστοῦ
  choice: Kristi
  alternative: Mèsáyà
  rationale: “Kristi” ti di oyè tí ó ṣe kedere, tí ó sì ní ọlá nínú Yorùbá; yíyí i padà sí “Mèsáyà” níbí kò ṣe pàtàkì fún ìtumọ̀ gbolohun ìbùkún náà. Àlàyé ìtumọ̀ oyè náà wà nínú àlàyé ìsàlẹ̀ [a].
- issue: Ìdúró ẹsẹ̀ náà nínú àṣà ìkọ̀wé
  choice: Fi ẹsẹ̀ náà sínú ọ̀rọ̀ pẹ̀lú àmì [b]
  alternative: Yọ ọ́ kúrò nínú ọ̀rọ̀ pàtàkì tàbí fi sí àárín àkámọ́
  rationale: SBLGNT fi gbogbo gbolohun ìbùkún náà hàn gẹ́gẹ́ bí àyípadà ọ̀rọ̀; fífi í sínú ọ̀rọ̀ pẹ̀lú àlàyé ìsàlẹ̀ ń pa ẹ̀rí méjèèjì mọ́ láìpinnu ju ẹ̀rí lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, kedere, tí ó sì bá ìbùkún ìjọ mu. A lo “Kí … wà” láti fi ìfẹ́-àdúrà gbolohun Gíríìkì tí kò ní ọ̀rọ̀-ìṣe hàn. Gbogbo àmì ohùn wà níbi tí ó bá jẹ́ àdánidá.
