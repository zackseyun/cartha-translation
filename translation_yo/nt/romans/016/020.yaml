id: ROM.16.20
reference: Romans 16:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: yo
  text: Ọlọ́run àlàáfíà yóò sì tẹ̀ Sátánì mọ́lẹ̀ lábẹ́ ẹsẹ̀ yín láìpẹ́. Kí oore-ọ̀fẹ́ Olúwa wa Jésù Mèsáyà[a] wà pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Jésù Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Ọlọ́run àlàáfíà
  rationale: Ó pa àkọ́lé gẹnitífù ti Pọ́ọ̀lù mọ́ ní ọ̀nà tó ṣe déédéé, láì túmọ̀ ọ́ sí àlàyé bí ‘Ọlọ́run tí ń fúnni ní àlàáfíà.’ A fi ‘sì’ hàn fún δέ ní ipò àdàpọ̀ gbólóhùn tó bá èdè Yorùbá mu.
- source_word: συντρίψει
  choice: yóò ... tẹ̀ ... mọ́lẹ̀
  rationale: ‘Yóò’ fi ìṣe ọjọ́ iwájú tó dájú hàn; ‘tẹ̀ ... mọ́lẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi agbára écrase ohun kan àti fífi í sábẹ́ ìṣàkóso, ó sì bá àwòrán ‘lábẹ́ ẹsẹ̀’ mu.
- source_word: τὸν Σατανᾶν
  choice: Sátánì
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìrísí tó bá ìpè Yorùbá mu, dípò fífi ìtumọ̀ àlàyé bí ‘Ọ̀tá’ sínú ọ̀rọ̀.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: lábẹ́ ẹsẹ̀ yín
  rationale: Ó pa àwòrán ìṣẹ́gun àti fífi ẹni sábẹ́ mọ́, ‘yín’ sì fi hàn pé gbogbo ìjọ ni a ń bá sọ̀rọ̀.
- source_word: ἐν τάχει
  choice: láìpẹ́
  rationale: Ó fi ìsúnmọ́ àkókò hàn ní Yorùbá àdánidá, dípò kí a túmọ̀ rẹ̀ bí bí ìṣe náà yóò ṣe yára nìkan.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún χάρις nínú ìbùkún Pọ́ọ̀lù, láì sọ ìtumọ̀ rẹ̀ di àlàyé gígùn.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: 'Ó pa ìbáṣepọ̀ gẹnitífù náà mọ́ ní ọ̀nà àdánidá: oore-ọ̀fẹ́ tí ó jẹ́ ti Olúwa wa.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: A tú Χριστός sí ‘Mèsáyà’ nítorí agbára àkọ́lé rẹ̀ lẹ́gbẹ̀ẹ́ Jésù, nígbà tí a pa ìrísí ìbílẹ̀ ‘Kristi’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: μεθ’ ὑμῶν
  choice: wà pẹ̀lú yín
  rationale: Bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀-ìṣe ní Gíríìkì, Yorùbá nílò ‘wà’ nínú ìbùkún yìí; ‘yín’ tún pa ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe tú Χριστοῦ nínú ìbùkún ìparí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àkójọpọ̀ ‘Jésù Mèsáyà,’ ọ̀rọ̀ náà ṣì lè ní agbára àkọ́lé, ìyẹn Ẹni Àmì-òróró. Síbẹ̀, ‘Kristi’ jẹ́ ìrísí ìbílẹ̀ tó sì lè dà bí apá orúkọ; a fi í sínú àlàyé ìsàlẹ̀ láti pa yíyan ọ̀rọ̀ yìí mọ́ ní gbangba.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, ó ní ọlá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘kí ... wà’ gẹ́gẹ́ bí ọ̀nà àdánidá fún ìbùkún, a sì pa ‘yín’ mọ́ ní gbogbo ibi láti fi hàn pé ọ̀pọ̀ ènìyàn ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
