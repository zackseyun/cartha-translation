id: ROM.16.5
reference: Romans 16:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: yo
  text: Ẹ sì kí ìjọ tí ó wà ní ilé wọn.[a] Ẹ kí Epáínétù, olùfẹ́ mi, ẹni tí í ṣe àkọ́so Éṣíà[b] fún Mèsáyà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjọ tí ó máa ń péjọ ní ilé wọn.”
    reason: lexical_alternative
  - marker: b
    text: Èyí tọ́ka sí ìpínlẹ̀ Éṣíà ti Róòmù, kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà ti òde òní.
    reason: cultural_note
  - marker: c
    text: Tàbí, “ẹni àkọ́kọ́ ní Éṣíà tó gba Mèsáyà gbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: Ẹ sì kí ìjọ tí ó wà ní ilé wọn
  rationale: Ó tẹ̀ lé ìtumọ̀ gírámà Gíríìkì pé ìjọ náà ní ìbáṣepọ̀ pẹ̀lú ilé wọn, láì fi dandan sọ ju ohun tí ọ̀rọ̀ náà sọ lọ pé ibẹ̀ ni wọ́n ti máa ń péjọ.
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Nínú àkójọ ìkíni lẹ́tà, ‘Ẹ kí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àṣẹ ọ̀pọ̀ ènìyàn mu.
- source_word: Ἐπαίνετον
  choice: Epáínétù
  rationale: A ṣe àkọsílẹ̀ orúkọ Gíríìkì náà ní ìró Yorùbá, pẹ̀lú fáwẹ́lì ìparí tó jẹ́ kí ó rọrùn láti pè.
- source_word: ἀγαπητόν μου
  choice: olùfẹ́ mi
  rationale: Ó fi ìfẹ́ ara ẹni tí Pọ́ọ̀lù ní sí i hàn ní èdè Yorùbá adayébá, ọlọ́lá.
- source_word: ἀπαρχὴ
  choice: àkọ́so
  rationale: ‘Àkọ́so’ pa àwòrán èso àkọ́kọ́ tí Pọ́ọ̀lù lò mọ́, dípò yíyanjú rẹ̀ sí ‘ẹni àkọ́kọ́ tó gba ìgbàgbọ́.’
- source_word: τῆς Ἀσίας
  choice: Éṣíà
  rationale: Ó pa ìbáṣepọ̀ oníjẹnítífù Gíríìkì mọ́; àlàyé ìtàn pé agbègbè ìjọba Róòmù ni a fi sínú àlàyé ìsàlẹ̀.
- source_word: εἰς Χριστόν
  choice: fún Mèsáyà
  rationale: ‘Fún’ fi ìdarí tàbí ìbáṣepọ̀ εἰς pẹ̀lú àkọ́so hàn, ‘Mèsáyà’ sì pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστόν
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín, Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ láì fi ẹ̀kọ́ ẹ̀sìn àfikún kún un.
- issue: Ìtumọ̀ ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: ẹni tí í ṣe àkọ́so Éṣíà fún Mèsáyà
  alternative: ẹni àkọ́kọ́ ní Éṣíà tó gba Mèsáyà gbọ́
  rationale: Ọ̀rọ̀ inú ẹsẹ̀ pa àwòrán ‘àkọ́so’ mọ́, nígbà tí àlàyé ìsàlẹ̀ ń sọ ìtumọ̀ tí ó ṣeé ṣe nínú ọ̀rọ̀ yìí. Èyí kò yanjú àìdánilójú ọ̀rọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó lọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tí ó bá yẹ, a sì pa àwòrán ‘àkọ́so’ àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
