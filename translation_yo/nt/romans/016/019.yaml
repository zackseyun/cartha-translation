id: ROM.16.19
reference: Romans 16:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: yo
  text: Nítorí ìgbọ́ràn yín ti dé ọ̀dọ̀ gbogbo ènìyàn[a]. Nítorí náà, mo yọ̀ nítorí yín[b]. Ṣùgbọ́n mo fẹ́ kí ẹ jẹ́ ọlọ́gbọ́n ní ti ohun rere, kí ẹ sì jẹ́ aláìlábàwọ́n ní ti ohun búburú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìròyìn ìgbọ́ràn yín ti di mímọ̀ fún gbogbo ènìyàn.” Ní tààràtà, Gíríìkì sọ pé, “ìgbọ́ràn yín ti dé ọ̀dọ̀ gbogbo ènìyàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo yọ̀ lórí yín.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí ẹ jẹ́ mímọ́” tàbí “aláìlábàwọ́n” ní ti ohun búburú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: ìgbọ́ràn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ìgbọ́ràn hàn, kì í ṣe gbígbọ́ lásán; “ìgbọ́ràn” bá ìyìn tí Pọ́ọ̀lù ń fún àwọn onígbàgbọ́ Róòmù mu.
- source_word: εἰς πάντας … ἀφίκετο
  choice: ti dé ọ̀dọ̀ gbogbo ènìyàn
  rationale: Èyí pa àwòrán Gíríìkì ti ohun kan tí ó ‘dé’ mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìròyìn ìgbọ́ràn wọn ti tàn káàkiri.
- source_word: ἐφ’ ὑμῖν … χαίρω
  choice: mo yọ̀ nítorí yín
  rationale: Pẹ̀lú χαίρω, gbólóhùn náà lè tọ́ka sí àwọn ará Róòmù gẹ́gẹ́ bí ìdí tàbí àǹfààní ayọ̀ Pọ́ọ̀lù; “mo yọ̀ nítorí yín” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: σοφοὺς … εἰς τὸ ἀγαθόν
  choice: ọlọ́gbọ́n ní ti ohun rere
  rationale: Ó sọ nípa ọgbọ́n àti ìfòyemọ̀ tó dojú kọ ohun rere, láìfi ìtumọ̀ míì kún un.
- source_word: ἀκεραίους … εἰς τὸ κακόν
  choice: aláìlẹ́ṣẹ̀ ní ti ohun búburú
  rationale: ἀκέραιος lè túmọ̀ sí mímọ́, aláìdàpọ̀, tàbí aláìlẹ́ṣẹ̀. Nínú ìyàtọ̀ rẹ̀ sí ọgbọ́n ní ti rere, “aláìlẹ́ṣẹ̀ ní ti ohun búburú” fi ìbáṣepọ̀ tí kò ní àbàwọ́n pẹ̀lú ibi hàn.
theological_decisions:
- issue: Ìwọ̀n πάντας nínú ọ̀rọ̀ ìyìn náà
  choice: “gbogbo ènìyàn” ni a lò gẹ́gẹ́ bí ọ̀rọ̀ fífẹ̀ tó ń fi bí ìròyìn náà ṣe tàn káàkiri hàn.
  alternative: “gbogbo ènìyàn nínú àwọn ìjọ” tàbí “ọ̀pọ̀ ènìyàn”
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù jẹ́ ìyìn àsọyé, kì í ṣe dandan pé ó ń sọ gbogbo ẹ̀dá ènìyàn láìyọ ẹnikẹ́ni sílẹ̀. A kò fi ààlà tí kò sí nínú Gíríìkì kún ọ̀rọ̀ náà.
- issue: Ìyàtọ̀ tó wà láàárín σοφούς àti ἀκεραίους
  choice: A pa ìyàtọ̀ láàárín ọgbọ́n ní ti rere àti jíjẹ́ aláìlẹ́ṣẹ̀ ní ti búburú mọ́.
  alternative: “mọ ohun rere dáadáa, ṣùgbọ́n kí ẹ má mọ ohun búburú” tàbí “jẹ́ mímọ́ kúrò nínú ibi”
  rationale: Èyí kò sọ pé kí wọn jẹ́ òpè tàbí aláìmọ̀kan nípa bí ibi ṣe rí; ó rọ̀ wọn sí ìfòyemọ̀ rere àti ìwà tí ibi kò bà jẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn méjì ni a fi ṣe e láti jẹ́ kí ìṣàn ọ̀rọ̀ rọrùn, nígbà tí ìsopọ̀ ‘ṣùgbọ́n’ àti ìbáradọ́gba ‘ohun rere/ohun búburú’ ṣì dúró.
