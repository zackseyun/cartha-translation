id: ROM.16.23
reference: Romans 16:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: yo
  text: Gáyù, olùgbàlejò mi àti olùgbàlejò fún gbogbo ìjọ, kí yín. Ẹrástù, olùtọ́jú owó ìlú[a], àti Kúártù, arákùnrin náà, kí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olùṣàkóso ìlú.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí aláṣẹ ìlú ní ìtumọ̀ tó gbòòrò, bí ó tilẹ̀ jẹ́ pé “olùtọ́jú owó ìlú” bá ipò ìjọba ìbílẹ̀ tí a ní lọ́kàn níbí mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: kí yín
  rationale: Ọ̀rọ̀ yìí ni a sábà máa ń lò fún fífi ìkíni ránṣẹ́ nínú ìparí lẹ́tà; “kí yín” jẹ́ Yorùbá àdánidá, ó sì fi hàn pé ẹni náà fúnra rẹ̀ ni ó ń kí àwọn olùgbọ́ púpọ̀.
- source_word: ξένος
  choice: ẹni tí ó gbà mí sílé
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ξένος ń tọ́ka sí ẹni tó ń ṣe àlejò nípa gbígba ẹlòmíràn sílé, kì í ṣe “àjèjì.” Gbólóhùn yìí ṣe kedere ní Yorùbá, ó sì lè bá “gbogbo ìjọ” lọ láìsí ìdàrúdàpọ̀.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: gbogbo ìjọ
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwùjọ àwọn onígbàgbọ́, “gbogbo” sì pa ìtẹnumọ́ ὅλης mọ́.
- source_word: οἰκονόμος τῆς πόλεως
  choice: akápò ìlú
  rationale: “Akápò ìlú” fi ipò aláṣẹ tó ń bójú tó owó ìlú hàn ní ṣókí. Nítorí οἰκονόμος tún lè túmọ̀ sí olùṣàkóso ìlú ní ìtumọ̀ gbòòrò, a fi àṣàyàn yẹn sínú àlàyé ìsàlẹ̀.
- source_word: ἀδελφός
  choice: arákùnrin náà
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ, ó sì ní àmì ìdánimọ̀. “Arákùnrin náà” pa ìwọ̀nyí mọ́ láìfi “wa” kún ohun tí kò sí nínú orísun.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία nínú ìkíni yìí
  choice: ìjọ
  alternative: àpéjọ; àwùjọ
  rationale: Nínú lílo Pọ́ọ̀lù, ἐκκλησία sábà ń tọ́ka sí àwùjọ àwọn onígbàgbọ́. “Ìjọ” jẹ́ èdè Yorùbá tó ṣe déédé láìfi èrò nípa ètò ìjọ kan pàtó kún un.
- issue: Ọ̀rọ̀ ìbátan akọ ἀδελφός
  choice: arákùnrin náà
  alternative: arákùnrin wa; onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Orísun náà sọ nípa ọkùnrin kan ní pàtó. A pa “arákùnrin” mọ́, a kò sì fi ọ̀rọ̀ amúnisọ̀kan tàbí ọ̀rọ̀ aláìtọ́ka sí akọ rọ́pò rẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì àti àmì ohùn ní kíkún. “Ẹni tí ó gbà mí sílé” àti “ń gba gbogbo ìjọ sílé” jẹ́ ọ̀nà àdánidá láti ṣàlàyé ipa Gáyù gẹ́gẹ́ bí olùgbàlejò. A gbe àmì àlàyé [a] sí “akápò ìlú,” ibi tí àṣàyàn ọ̀rọ̀ náà ti wà.
