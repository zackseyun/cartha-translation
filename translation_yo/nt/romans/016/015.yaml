id: ROM.16.15
reference: Romans 16:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: yo
  text: Ẹ kí Fílólógù àti Júlíà[a], Néréù àti arábìnrin rẹ̀, àti Olímpàsì àti gbogbo àwọn ènìyàn mímọ́ tí wọ́n wà pẹ̀lú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ó ṣeé ṣe, “Júlíásì,” bí a bá ka orúkọ náà sí orúkọ ọkùnrin; ṣùgbọ́n ọ̀pọ̀ ènìyàn ló lóye ìrísí Gíríìkì náà gẹ́gẹ́ bí orúkọ obìnrin “Júlíà.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn láti fi ìkíni ránṣẹ́; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ọ̀rọ̀ lẹ́tà mu.
- source_word: Φιλόλογον
  choice: Fílólógù
  rationale: Orúkọ ènìyàn ni; a kọ ọ́ ní ọ̀nà tó bá ìró Gíríìkì àti ìlànà kíkọ orúkọ ní Yorùbá mu.
- source_word: Ἰουλίαν
  choice: Júlíà
  rationale: Ìrísí orúkọ náà nínú Gíríìkì ṣeé lóye jù lọ gẹ́gẹ́ bí orúkọ obìnrin Júlíà; a fi àṣàyàn orúkọ ọkùnrin sí àlàyé ìsàlẹ̀.
- source_word: Νηρέα
  choice: Néréù
  rationale: Orúkọ ènìyàn ni; a ṣe àkọsílẹ̀ rẹ̀ ní ìbámu pẹ̀lú ìró rẹ̀ ní Gíríìkì.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: arábìnrin rẹ̀
  rationale: ἀδελφή túmọ̀ sí “arábìnrin,” αὐτοῦ sì tọ́ka sí Néréù; “rẹ̀” ni ọ̀nà àdánidá láti sọ ìní náà ní Yorùbá.
- source_word: Ὀλυμπᾶν
  choice: Olíḿpà
  rationale: Orúkọ ènìyàn ni; a ṣe àkọsílẹ̀ rẹ̀ ní ọ̀nà Yorùbá tó sún mọ́ ìró Gíríìkì Ὀλυμπᾶς.
- source_word: τοὺς σὺν αὐτοῖς
  choice: tí wọ́n wà pẹ̀lú wọn
  rationale: σύν pẹ̀lú ọ̀rọ̀ olùgbà ń fi ìbáṣepọ̀ hàn; gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: πάντας ἁγίους
  choice: gbogbo àwọn ènìyàn mímọ́
  rationale: Nínú àwọn lẹ́tà Pọ́ọ̀lù, ἅγιοι ń tọ́ka sí àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn tí a yà sí mímọ́; “àwọn ènìyàn mímọ́” pa ìtumọ̀ yẹn mọ́ láìfi èrò ìkéde ẹni gẹ́gẹ́ bí sẹ́ńtì kún un.
theological_decisions:
- issue: Ìtumọ̀ ἅγιοι nínú àkójọ ìkíni Pọ́ọ̀lù
  choice: àwọn ènìyàn mímọ́
  alternative: àwọn ẹni mímọ́; àwọn ènìyàn Ọlọ́run tí a yà sí mímọ́
  rationale: Ọ̀rọ̀ náà ń dá àwọn onígbàgbọ́ tí wọ́n wà pẹ̀lú àwọn ẹni tí a dárúkọ mọ̀. “Àwọn ènìyàn mímọ́” pa èrò ìyàsímímọ́ mọ́, kò sì mú èrò ìkéde sẹ́ńtì ti àkókò tó tẹ̀ lé e wọ inú ẹsẹ náà.
- issue: Ìbálòpọ̀ orúkọ Ἰουλίαν
  choice: Júlíà
  alternative: Júlíásì
  rationale: Ìrísí Gíríìkì náà ṣeé kà ní ti àdánidá gẹ́gẹ́ bí orúkọ obìnrin Júlíà. Nítorí pé àwọn kan ti kà á sí orúkọ ọkùnrin nínú ìtàn ìtumọ̀, a pa àṣàyàn náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo “Ẹ kí” fún àṣẹ ọ̀pọ̀, a sì tú “àwọn ènìyàn mímọ́” ní ọ̀nà tí kò gbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọ inú ọ̀rọ̀ náà.
