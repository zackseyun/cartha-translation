  source_fidelity: 'Ìtumọ̀ náà tọ́ka dáadáa sí ohun ìjìnlẹ̀ nínú ẹsẹ 25, ó sì pa àwọn èrò pàtàkì mọ́: ìṣípayá rẹ̀ nísinsin yìí, ipa àwọn Ìwé Mímọ́ àsọtẹ́lẹ̀, àṣẹ Ọlọ́run ayérayé, àti ìwọ̀n àwọn orílẹ̀-èdè gbogbo. Ṣùgbọ́n ìfarahàn “ti tipasẹ̀” jẹ́ àṣìṣe ìkọ̀wé, àti “láti mú wọn dé inú” ń ṣàfikún ìṣàpẹẹrẹ kan tí kò hàn nínú Gíríìkì náà.'
  naturalness: 'Àtúnṣe náà mú gbolohun náà rọrùn síi nínú Yorùbá òde òní: “nípasẹ̀ ... mú di mímọ̀” jẹ́ ìlò tó ṣe kedere, a sì yọ àtúnsọ “ti” kúrò. “kí wọ́n lè ní ìgbọ́ràn ìgbàgbọ́” ṣàlàyé ète “εἰς” ní ọna Yorùbá tí ó wọ́gbọ́n, láì yan ìtumọ̀ ẹ̀kọ́ kan fún ìbáṣepọ̀ ìgbọ́ràn àti ìgbàgbọ́.'
