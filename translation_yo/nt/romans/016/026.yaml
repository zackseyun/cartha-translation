  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: yo
  text: ṣùgbọ́n tí a ti ṣí payá nísinsin yìí, tí a sì ti mú di mímọ̀ fún gbogbo àwọn orílẹ̀-èdè nípasẹ̀ àwọn Ìwé Mímọ́ àsọtẹ́lẹ̀, gẹ́gẹ́ bí àṣẹ Ọlọ́run ayérayé, kí wọ́n lè ní ìgbọ́ràn ìgbàgbọ́—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ẹsẹ yìí ń tẹ̀síwájú nínú orin ìyìn ìparí (Róòmù 16:25–27). Wo àlàyé lórí Róòmù 16:25 nípa ibi tí apá yìí wà àti ẹ̀rí àwọn àfọwọ́kọ.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: tí a ti ṣí payá
  rationale: Ó tọ́ka padà sí ohun ìjìnlẹ̀ inú ẹsẹ 25, ó sì fi hàn pé ohun tí ó ti farapamọ́ ni a mú wá sí ìmọ́lẹ̀.
- source_word: γραφαῖς προφητικαῖς
  choice: àwọn Ìwé Mímọ́ àsọtẹ́lẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ìwé mímọ́ tí ìwà àsọtẹ́lẹ̀ wà lára wọn, kì í ṣe sí ìkọ̀wé lásán.
- source_word: ἐπιταγή
  choice: àṣẹ
  rationale: Ó túmọ̀ sí ìtọ́ni aláṣẹ tí ó wá láti ọ̀dọ̀ Ọlọ́run.
- source_word: ὑπακοὴν πίστεως
  choice: ìgbọ́ràn ìgbàgbọ́
  rationale: A pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́, pẹ̀lú àìdájú bóyá ó túmọ̀ sí ìgbọ́ràn tí ó jẹ́ ti ìgbàgbọ́ tàbí ìgbọ́ràn tí ìgbàgbọ́ ń mú wá; ó tún bá Róòmù 1:5 mu.
- source_word: πάντα τὰ ἔθνη
  choice: gbogbo àwọn orílẹ̀-èdè
  rationale: Ó pa ìwọ̀n àgbáyé gbólóhùn náà mọ́, láì dín un kù sí àwọn Kèfèrí nìkan.
theological_decisions:
- issue: Ìtumọ̀ ὑπακοὴ πίστεως
  choice: ìgbọ́ràn ìgbàgbọ́
  alternative: ìgbọ́ràn tí ó ti inú ìgbàgbọ́ wá
  rationale: Àṣàyàn yìí pa àìdájú gírámà ìpilẹ̀ṣẹ̀ àti ìfaramọ́ rẹ̀ pẹ̀lú Róòmù 1:5 mọ́, láì fi ìtumọ̀ ẹ̀kọ́ kan ṣoṣo lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. Ìṣètò gbólóhùn náà fi hàn pé ẹsẹ yìí ń tẹ̀síwájú láti inú ẹsẹ 25; àmì ìdádúró gígùn ní òpin ń tọ́ka sí ìtẹ̀síwájú rẹ̀ sínú ẹsẹ 27.
