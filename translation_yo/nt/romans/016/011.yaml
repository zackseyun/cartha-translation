id: ROM.16.11
reference: Romans 16:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: yo
  text: Ẹ kí Hẹrodíónì, ará mi[a]. Ẹ kí àwọn tó jẹ́ ti Nákísósì[b], àwọn tí wọ́n wà nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “ìbátan mi” tàbí “ẹgbẹ́ Júù mi”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìbátan ẹ̀jẹ̀ tàbí sí ẹnì kan lára àwọn ènìyàn Pọ́ọ̀lù.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kó ń tọ́ka sí àwọn ará ilé Nákísósì tàbí àwọn tó wà lábẹ́ ìṣàkóso rẹ̀, tí wọ́n jẹ́ onígbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ ọ̀pọ̀ yìí túmọ̀ sí kí wọ́n fi ìkíni ránṣẹ́ sí àwọn ẹni tí a dárúkọ; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ọ̀rọ̀ ìkíni inú lẹ́tà mu.
- source_word: Ἡρῳδίωνα
  choice: Hẹrodíónì
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró rẹ̀ nínú Gíríìkì, ní ọ̀nà tí ahọ́n Yorùbá lè pè.
- source_word: συγγενῆ μου
  choice: ará mi
  rationale: “Ará mi” lè tọ́ka sí ìbátan ẹ̀jẹ̀ tàbí ẹni ẹ̀yà kan náà, nítorí náà ó dáàbò bo ìtumọ̀ gbígbòòrò συγγενής láì fi tipátipá mú un túmọ̀ sí ọ̀kan ṣoṣo.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: àwọn tó jẹ́ ti Nákísósì
  rationale: Gbólóhùn yìí fi hàn pé àwọn ènìyàn náà ní ìbáṣepọ̀ pẹ̀lú Nákísósì, ṣùgbọ́n kò sọ “agbo ilé” ní tààràtà. Ìtumọ̀ yìí pa àìdánilójú yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó ṣeé ṣe jù hàn.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: àwọn tí wọ́n wà nínú Olúwa
  rationale: Èyí pa àkànlò èdè pàtàkì ti Pọ́ọ̀lù, “nínú Olúwa,” mọ́, láì sọ ọ́ di àlàyé pé àwọn náà jẹ́ onígbàgbọ́ tàbí pé wọ́n jẹ́ ti Olúwa nìkan.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó yẹ fún κύριος ní àkànlò Kristẹni ti Pọ́ọ̀lù níbí.
theological_decisions:
- issue: Ìtumọ̀ συγγενής nínú ìkíni Pọ́ọ̀lù
  choice: ará mi
  alternative: ìbátan mi; Júù bíi tèmi
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbátan ẹ̀jẹ̀ tàbí ọmọ ẹgbẹ́ àwọn ènìyàn Pọ́ọ̀lù. “Ará mi” jẹ́ kí àìdánilójú gidi inú ẹsẹ náà dúró.
- issue: Àwọn tí a so mọ́ Nákísósì jẹ́ àwọn wo
  choice: àwọn tó jẹ́ ti Nákísósì
  alternative: àwọn ará agbo ilé Nákísósì; àwọn tó wà lábẹ́ Nákísósì
  rationale: Gíríìkì sọ pé wọ́n jẹ́ àwọn “láti inú/ti” Nákísósì, kò sì lo ọ̀rọ̀ tó túmọ̀ sí agbo ilé ní tààràtà. A kò fi “agbo ilé” sínú ọ̀rọ̀ pàtàkì, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí èyí ni a ní lọ́kàn.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A pa àkànlò “nínú Olúwa” mọ́ nítorí ìjẹ́pàtàkì rẹ̀ nínú ọ̀rọ̀ Pọ́ọ̀lù. A tún fi àmì ohùn sí ibi tí ó bá ìlò Yorùbá mu, pẹ̀lú àkọsílẹ̀ orúkọ Gíríìkì ní fọ́ọ̀mù tí ahọ́n Yorùbá lè pè.
