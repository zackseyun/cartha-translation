id: ROM.16.18
reference: Romans 16:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: yo
  text: Nítorí àwọn irú ẹni bẹ́ẹ̀ kì í sin Olúwa wa Mèsáyà[a], bí kò ṣe ikùn ara wọn[b]; nípasẹ̀ ọ̀rọ̀ adùn-ún-gbọ́ àti ìpọ́nni, wọ́n ń tan ọkàn àwọn aláìfura[c] jẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Olúwa wa Kristi.”
    reason: alternative_reading
  - marker: b
    text: Ní tààrà, “ikùn ara wọn”; àwòrán tó lágbára ni fún ìfẹ́kúfẹ̀ẹ́ ẹni àti fífi ìgbádùn ara ẹni ṣáájú.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn aláìṣẹ̀” tàbí “àwọn tí kò ní ẹ̀tàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: àwọn irú ẹni bẹ́ẹ̀
  rationale: Ó tọ́ka sí àwọn ẹni tí ń fa ìyapa tí ẹsẹ tó ṣáájú mẹ́nu kàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìtọ́kasí ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: Olúwa wa Mèsáyà
  rationale: A túmọ̀ κύριος sí ‘Olúwa,’ a sì fi Χριστός hàn gẹ́gẹ́ bí oyè ‘Mèsáyà,’ láìfi orúkọ Jésù kún ohun tí kò sí nínú Gíríìkì.
- source_word: δουλεύουσιν
  choice: sin
  rationale: ‘Sin’ jẹ́ ọ̀rọ̀ Yorùbá tó bá àyíká yìí mu, ó sì mú ìyàtọ̀ tó wà láàárín sísin Olúwa àti sísin ikùn ara wọn jáde.
- source_word: κοιλίᾳ
  choice: ikùn
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán alágbára tí Paulu lò mọ́, dípò yíyí i padà sí ìfẹ́kúfẹ̀ẹ́ tàbí ojúkòkòrò nìkan.
- source_word: χρηστολογίας
  choice: ọ̀rọ̀ adùn-ún-gbọ́
  rationale: Ó sọ̀rọ̀ nípa ọ̀rọ̀ dídùn tó dùn mọ́ etí tí a fi ń fa ènìyàn mọ́ra; yíyan yìí jẹ́ àdánidá, ó sì bá ète ẹ̀tàn inú àyíká mu.
- source_word: εὐλογίας
  choice: ìpọ́nni
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ọ̀rọ̀ ìyìn tí a fi ń yọjú sí ènìyàn láti tàn án, kì í ṣe ìbùkún tòótọ́.
- source_word: ἐξαπατῶσι
  choice: tan … jẹ
  rationale: Àpólà Yorùbá yìí sọ ìṣe ẹ̀tàn náà ní kedere àti ní ọ̀nà tó wọ́pọ̀.
- source_word: καρδίας
  choice: ọkàn
  rationale: ‘Ọkàn’ pa ìtumọ̀ ẹni-inú mọ́, láìdín ọ̀rọ̀ náà kù sí èrò inú tàbí òye nìkan.
- source_word: ἀκάκων
  choice: àwọn aláìfura
  rationale: Nínú ìkìlọ̀ yìí, ọ̀rọ̀ náà fi àwọn tí kò fura sí ewu ẹ̀tàn hàn, láìsọ pé wọ́n jẹ̀bi tàbí pé wọn kò ní ọgbọ́n rárá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστός nínú oyè Paulu yìí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde; àṣàyàn ìbílẹ̀ ‘Kristi’ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò. Gbólóhùn náà jẹ́ kíkà-rọrùn fún gbogbo ènìyàn, ṣùgbọ́n ó pa àwòrán ‘ikùn,’ ìyàtọ̀ inú ‘sísin,’ àti àìdánilójú díẹ̀ tó wà nínú ἀκάκων mọ́.
