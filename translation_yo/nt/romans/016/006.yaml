base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: yo
  text: Ẹ kí Màríà[a], ẹni tí ó ti ṣiṣẹ́ takuntakun fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “fún wa” tàbí “láàárín yín” dípò “fún yín.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ìkíni inú lẹ́tà mu.
- source_word: Μαριάμ
  choice: Màríà
  rationale: A lo orúkọ tí ó ti wọ́pọ̀ nínú Yorùbá fún Μαριάμ.
- source_word: ἥτις
  choice: ẹni tí
  rationale: Ó dá gbólóhùn àlàyé nípa Màríà sílẹ̀ lọ́nà àdánidá, láìfi ìtumọ̀ míì kún un.
- source_word: πολλὰ
  choice: púpọ̀
  rationale: Ó ń fi bí iṣẹ́ náà ti pọ̀ tó hàn; pẹ̀lú “takuntakun,” ó mú agbára ọ̀rọ̀ Gíríìkì jáde ní Yorùbá tó ṣe déédéé.
- source_word: ἐκοπίασεν
  choice: ó ti ṣiṣẹ́ takuntakun
  rationale: κοπιάω túmọ̀ sí iṣẹ́ líle tàbí làálàá. “Ṣiṣẹ́ takuntakun” mú ìsapá ńlá náà hàn, “ó ti” sì tọ́ka sí iṣẹ́ tí ó ti ṣe ṣáájú tí a ń yìn ín fún un báyìí.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Nínú ẹ̀dà SBLGNT, gbólóhùn náà tọ́ka sí iṣẹ́ tí ó ṣe fún àǹfààní àwọn olùgbọ́; “fún yín” ni ìtumọ̀ Yorùbá tó ṣe kedere jù.
theological_decisions:
- issue: Ìyàtọ̀ ọ̀rọ̀ inú àwọn àfọwọ́kọ ní gbólóhùn ìkẹyìn
  choice: fún yín
  alternative: fún wa; láàárín yín
  rationale: A tẹ̀ lé εἰς ὑμᾶς inú SBLGNT nínú àkọ́kọ́ ẹsẹ̀. Àwọn ẹ̀dà mìíràn tó ní εἰς ἡμᾶς tàbí ἐν ὑμῖν ni a pa mọ́ sínú àlàyé ìsàlẹ̀ láti fi ẹ̀rí ìyàtọ̀ náà hàn láìyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹ kí” bá àṣẹ sí ọ̀pọ̀ ènìyàn mu, “ṣiṣẹ́ takuntakun púpọ̀” sì mú èrò iṣẹ́ líle àti ọ̀pọ̀ làálàá jáde lọ́nà tí gbogbo ènìyàn lè lóye.
