  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: yo
  text: Ẹ kí Asínkírítù, Fílégónì, Hẹ́mẹ̀sì, Pátíróbà, Hẹ́mà, àti àwọn arákùnrin tí wọ́n wà pẹ̀lú wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin tí ó wà pẹ̀lú wọn.” Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí àwọn onígbàgbọ́ ẹlẹgbẹ́ tí ó ní í ṣe pẹ̀lú àwọn ọkùnrin wọ̀nyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Ẹ kí
  rationale: Àṣẹ aorist middle, ẹni kejì ọ̀pọ̀; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá àkójọ ìkíni Pọ́ọ̀lù mu.
- source_word: Ἀσύγκριτον
  choice: Asínkírítù
  rationale: Orúkọ ènìyàn ni; a ṣe àfọwọ́kọ ìró Gíríìkì rẹ̀ sí Yorùbá.
- source_word: Φλέγοντα
  choice: Fílégónì
  rationale: Orúkọ ènìyàn ni; a ṣe àfọwọ́kọ ìró rẹ̀ ní ọ̀nà tí òǹkàwé Yorùbá lè pè.
- source_word: Ἑρμῆν
  choice: Hẹ́mẹ̀sì
  rationale: Orúkọ ènìyàn ni níbí; a ṣe àfọwọ́kọ rẹ̀, a sì yà á sọ́tọ̀ kúrò lọ́dọ̀ Ἑρμᾶν.
- source_word: Πατροβᾶν
  choice: Pátíróbà
  rationale: Orúkọ ènìyàn ni; àfọwọ́kọ náà ń tẹ̀ lé ìró Gíríìkì ní èdè Yorùbá.
- source_word: Ἑρμᾶν
  choice: Hẹ́mà
  rationale: Orúkọ ènìyàn ni; a ṣe àfọwọ́kọ rẹ̀ ní ọ̀nà tí ó yàtọ̀ sí Hẹ́mẹ̀sì (Ἑρμῆν).
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: àwọn arákùnrin tí ó wà pẹ̀lú wọn
  rationale: “Àwọn arákùnrin” pa akọ ọ̀pọ̀ ἀδελφούς mọ́, “tí ó wà pẹ̀lú wọn” sì túmọ̀ σὺν αὐτοῖς ní kedere láì fi ohun tí kò sí nínú ọ̀rọ̀ kún un.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφούς nínú ìkíni sí àwùjọ
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ọ̀pọ̀ ní gírámà. Àyíká yìí kò fi hàn ní kedere pé kí a fẹ̀ ọ́ sí i gẹ́gẹ́ bí akọ àti abo, nítorí náà a pa ìrísí orísun mọ́ láì pinnu ohun tí ẹsẹ̀ náà kò sọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ kúkúrú tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn orúkọ ni a ṣe àfọwọ́kọ láti inú Gíríìkì, a kò sì túmọ̀ ìtumọ̀ àwọn orúkọ náà.
