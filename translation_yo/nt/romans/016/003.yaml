  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: yo
  text: Ẹ kí Pírísíkà[a] àti Ákílà, àwọn alábàáṣiṣẹ́ mi nínú Mèsáyà Jésù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pírísíkà ni ìrísí orúkọ náà nínú Gíríìkì níbí; Pírísílà ni ìrísí orúkọ kan náà tí ọ̀pọ̀ ènìyàn mọ̀ jù, tí a sì lò ní àwọn ibòmíràn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nínú Kristi Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn láti fi ìkíni ránṣẹ́; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe kedere.
- source_word: Πρίσκαν
  choice: Pírísíkà
  rationale: A ṣe àfọwọ́kọ orúkọ gẹ́gẹ́ bí ìrísí Πρίσκα tó wà nínú ẹsẹ yìí, dípò lílo ìrísí Pírísílà tó farahàn ní àwọn ibòmíràn.
- source_word: Ἀκύλαν
  choice: Ákílà
  rationale: Àfọwọ́kọ orúkọ Ἀκύλας sí Yorùbá ni.
- source_word: συνεργούς μου
  choice: àwọn alábàáṣiṣẹ́ mi
  rationale: Ó túmọ̀ sí àwọn tí wọ́n ń bá Pọ́ọ̀lù ṣiṣẹ́ pọ̀ nínú iṣẹ́ kan náà; “alábàáṣiṣẹ́” fi ìfọwọ́sowọ́pọ̀ náà hàn ní èdè Yorùbá àdánidá.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa àwòrán Gíríìkì mọ́ nípa ipò tàbí ìṣọ̀kan tí iṣẹ́ wọn wà, “Mèsáyà” sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè níbí.
theological_decisions:
- issue: Bí a ṣe máa tú Χριστῷ nínú gbólóhùn Pọ́ọ̀lù ἐν Χριστῷ Ἰησοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ọ̀rọ̀ yìí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró Ọlọ́run, nítorí náà “Mèsáyà” mú ìtumọ̀ oyè náà jáde. A fi “Kristi” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ àṣà tí ó tún ṣeé lò.
- issue: Ìtumọ̀ ἐν nínú ἐν Χριστῷ Ἰησοῦ
  choice: nínú
  alternative: ní ìṣọ̀kan pẹ̀lú
  rationale: “Nínú” jẹ́ kí àìdánilójú ọlọ́rọ̀ inú Gíríìkì dúró, nítorí ó lè tọ́ka sí ipò, ìṣọ̀kan, tàbí ààyè ìbáṣepọ̀ ẹ̀mí, láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá bá ìlò àdánidá mu. “Ẹ kí” tọ́ka sí àwùjọ àwọn olùgbọ́, “àwọn alábàáṣiṣẹ́ mi” sì jẹ́ ọ̀rọ̀ tó rọrùn fún òǹkàwé lónìí láìsọ èdè di ti ilé-iṣẹ́ tàbí ti àtijọ́.
