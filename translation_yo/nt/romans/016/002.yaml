    rationale: Ìlò ‘mi’ lẹ́yìn ‘fún’ ló wọ́pọ̀, ó sì dára jù ní Yorùbá òde òní; ‘fúnra mi’ ṣì ń pa ìtẹnumọ́ αὐτοῦ mọ́.
