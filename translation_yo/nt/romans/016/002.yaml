    rationale: ‘Aláàánú’ lè yí ìtumọ̀ προστάτις sí ìwà ìfẹ́-àánú. Àlàyé náà yẹ kí ó ṣàfihàn ìrànlọ́wọ́, àtìlẹ́yìn, tàbí ipò alágbàtọ́ láìdín un kù.
