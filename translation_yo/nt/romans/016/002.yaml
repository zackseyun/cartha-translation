id: ROM.16.2
reference: Romans 16:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: yo
  text: kí ẹ lè tẹ́wọ́ gbà á nínú Olúwa lọ́nà tí ó yẹ fún àwọn ẹni mímọ́, kí ẹ sì dúró tì í[a] nínú ọ̀ràn èyíkéyìí tí ó bá nílò yín; nítorí òun fúnra rẹ̀ ti jẹ́ olùṣètìlẹ́yìn fún ọ̀pọ̀ ènìyàn[b], àti fún mi fúnra mi pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ sì ràn án lọ́wọ́.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ dídúró lẹ́gbẹ̀ẹ́ ẹnì kan láti ṣe àtìlẹ́yìn fún un.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “olùrànlọ́wọ́,” “olùtọ́jú,” tàbí “alágbàtọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí obìnrin kan tí ó ń pèsè ìrànlọ́wọ́, ohun ìní, ipa, tàbí ààbò fún àwọn ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: tẹ́wọ́ gbà á
  rationale: Ó túmọ̀ sí láti gba Fọ́ìbè tọkàntọkàn sínú àwùjọ; ọ̀rọ̀ yìí fi ìgbàlejò àti ìtẹ́wọ́gbà hàn ní Yorùbá àdánidá.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Èyí pa ọ̀nà ọ̀rọ̀ Páùlù mọ́, ó sì fi àjọṣe àti ìdàpọ̀ àwọn onígbàgbọ́ nínú Olúwa hàn láìṣe àlàyé lé e lórí.
- source_word: ἀξίως τῶν ἁγίων
  choice: lọ́nà tí ó yẹ fún àwọn ẹni mímọ́
  rationale: Ó pa ìtumọ̀ ọ̀nà ìṣe ἀξίως àti ìtọ́ka sí àwọn ènìyàn Ọlọ́run mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: παραστῆτε αὐτῇ
  choice: dúró tì í
  rationale: Ìtumọ̀ gidi rẹ̀ ni láti dúró lẹ́gbẹ̀ẹ́ ẹnì kan fún ìrànlọ́wọ́ tàbí àtìlẹ́yìn. ‘Dúró tì í’ pa àwòrán yẹn mọ́, kò sì dín un kù sí irú ìrànlọ́wọ́ kan ṣoṣo.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: nínú ọ̀ràn èyíkéyìí tí ó bá nílò yín sí
  rationale: πρᾶγμα lè jẹ́ ọ̀ràn, iṣẹ́, tàbí ìṣòwò; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ rẹ̀ ní fífẹ̀ mọ́.
- source_word: προστάτις
  choice: olùṣètìlẹ́yìn
  rationale: Ọ̀rọ̀ náà tọ́ka sí obìnrin kan tí ó ń pèsè ààbò, ohun ìní, ipa, tàbí àtìlẹ́yìn fún àwọn ẹlòmíràn. ‘Olùṣètìlẹ́yìn’ yàgò fún ìtumọ̀ aláìlágbára ti ‘olùrànlọ́wọ́’ àti ìtumọ̀ tóóró ti ‘olùdáàbòbò.’
- source_word: ἐμοῦ αὐτοῦ
  choice: fún èmi fúnra mi pẹ̀lú
  rationale: ‘Èmi fúnra mi’ pa ìtẹnumọ́ αὐτοῦ mọ́, ‘pẹ̀lú’ sì fi agbára àfikún καί hàn.
theological_decisions:
- issue: Ìtumọ̀ προστάτις nípa Fọ́ìbè
  choice: olùṣètìlẹ́yìn
  alternative: olùrànlọ́wọ́; alágbàtọ́; olùdáàbòbò
  rationale: Ọ̀rọ̀ Gíríìkì náà ṣeé ṣe kí ó tọ́ka sí ipò àwùjọ ti ẹni tí ń fi ohun ìní, ipa, tàbí ààbò ṣe àtìlẹ́yìn fún àwọn ẹlòmíràn. Ìtumọ̀ yìí pa ipa pàtàkì Fọ́ìbè mọ́ láìsọ ọ́ di ipò iṣẹ́ ìjọ kan tí ẹsẹ̀ náà kò dárúkọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ó jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán ‘dúró tì í’ àti ìtumọ̀ àwùjọ ti προστάτις mọ́.
