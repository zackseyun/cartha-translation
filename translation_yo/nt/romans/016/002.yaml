  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì ní gbogbogbòò: ìgbàlejò ‘nínú Olúwa,’ ìlànà tó yẹ fún àwọn ẹni mímọ́, ìrànlọ́wọ́ nínú ọ̀ràn tí Fọ́ìbè bá nílò, àti ipa rẹ̀ gẹ́gẹ́ bí προστάτις ni a pa mọ́. Ṣùgbọ́n ‘nílò yín sí’ kì í jẹ́ ìṣọ̀kan Yorùbá àdánidá nínú gbólóhùn yìí, a sì tún nílò láti ṣe àtúnṣe ‘fún èmi fúnra mi’ sí ọ̀nà tí ó rọrùn, tí ó sì jẹ́ gírámà Yorùbá.'
  naturalness: ‘Dúró tì í’ jẹ́ ìtumọ̀ àdánidá fún ìpè láti ṣe àtìlẹ́yìn, ó sì yẹ ní àyíká ọ̀ràn yìí. ‘Nínú ọ̀ràn èyíkéyìí tí ó bá nílò yín’ jẹ́ kedere ju ‘nílò yín sí’ lọ. ‘Fún mi fúnra mi pẹ̀lú’ jẹ́ ìsọ̀rọ̀ àdánidá tó pa ìtẹnumọ́ Gíríìkì náà mọ́.
  terminology: ‘Olùṣètìlẹ́yìn’ lè gbé ìtumọ̀ προστάτις gẹ́gẹ́ bí ẹni tí ń ṣètìlẹ́yìn tàbí ẹni tó ní ipa/ohun ìní láti ran ẹlòmíràn lọ́wọ́. Àlàyé ìsàlẹ̀ gbọdọ̀ má ṣe pè ‘aláàánú’ ní aṣàyàn tó dọ́gba, nítorí ó ń tọ́ka sí ìfẹ́-àánú dípò ipò alágbàtọ́ tàbí olùṣètìlẹ́yìn tó hàn nínú ọ̀rọ̀ Gíríìkì.
