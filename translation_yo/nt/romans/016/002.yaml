  to: kí ẹ lè tẹ́wọ́ gbà á nínú Olúwa lọ́nà tí ó yẹ fún àwọn ẹni mímọ́, kí ẹ sì dúró tì í[a] nínú ọ̀ràn èyíkéyìí tí ó bá nílò yín; nítorí òun fúnra rẹ̀ ti jẹ́ olùṣètìlẹ́yìn fún ọ̀pọ̀ ènìyàn[b], àti fún mi fúnra mi pẹ̀lú.
