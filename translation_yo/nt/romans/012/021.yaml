  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: yo
  text: Má ṣe jẹ́ kí ibi borí rẹ [a], ṣùgbọ́n fi rere borí ibi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Má ṣe jẹ́ kí ohun tí ó burú borí rẹ … fi ohun tí ó dára borí ohun tí ó burú.” Ní èdè Gíríìkì, àwọn ajẹtífù aláìlẹ́mìí tí ó ní akọlá wà níbí; a lè túmọ̀ wọn sí “ibi” àti “rere,” tàbí sí “ohun tí ó burú” àti “ohun tí ó dára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Má ṣe jẹ́ kí ... borí rẹ
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ ìdènà ní ohùn àgbàwọlé, ẹni kejì ẹyọ. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa èrò pé ẹni náà kò gbọ́dọ̀ jẹ́ ẹni tí ibi ṣẹ́gun mọ́.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: ibi
  rationale: ὑπό pẹ̀lú ọ̀rọ̀-orúkọ oníṣe ń fi aṣojú ohun tó ń borí hàn. τοῦ κακοῦ jẹ́ ajẹtífù akọlá aláìlẹ́mìí tó lè túmọ̀ sí ‘ibi’ tàbí ‘ohun tí ó burú’; ‘ibi’ jẹ́ kíkuru, àdánidá, ó sì bá ìtakora ìwà rere inú ẹsẹ náà mu.
- source_word: ἀλλὰ νίκα
  choice: ṣùgbọ́n ... borí
  rationale: ἀλλά fi ìtakora líle hàn, νίκα sì jẹ́ àṣẹ ohùn aṣeyọrí. Lílo ‘borí’ lẹ́ẹ̀kejì pa ìṣọ̀kan ọ̀rọ̀ νικάω àti ìró àsọyé Gíríìkì mọ́.
- source_word: ἐν τῷ ἀγαθῷ
  choice: fi rere
  rationale: ἐν pẹ̀lú dátífù níbí ń sọ ọ̀nà tàbí ohun èlò. Èdè Yorùbá ‘fi rere’ sọ ní kedere pé rere ni ọ̀nà tí a fi ń borí ibi.
- source_word: τὸ κακόν
  choice: ibi
  rationale: Ajẹtífù akọlá aláìlẹ́mìí náà ń ṣiṣẹ́ gẹ́gẹ́ bí ẹ̀ka ìwà lápapọ̀. ‘Ibi’ pa ìtakora kíkún sí ‘rere’ àti àtúnlò ọ̀rọ̀ inú Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá κακός/ἀγαθός yẹ kí a sọ di ẹni kan pàtó tàbí kí a mú wọn gẹ́gẹ́ bí ẹ̀ka ìwà
  choice: ibi àti rere gẹ́gẹ́ bí ẹ̀ka ìwà
  alternative: ẹni ibi tàbí Èṣù gẹ́gẹ́ bí ẹni pàtó
  rationale: Àwọn fọ́ọ̀mù aláìlẹ́mìí náà àti àyíká Róòmù 12 tọ́ka sí ìwà búburú àti ìwà rere lápapọ̀; kò sí ohun nínú gírámà tó béèrè pé kí ‘ibi’ di Èṣù tàbí ẹni ibi kan pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ṣe kedere, tó ní iyì, tí ó sì yé òǹkàwé òde òní. ‘Má ṣe jẹ́ kí ibi borí rẹ’ jẹ́ ọ̀nà àdánidá láti fi ohùn àgbàwọlé Gíríìkì hàn; ‘fi rere borí ibi’ sì pa ìtakora kíkuru àti agbára àsọyé ẹsẹ náà mọ́.
