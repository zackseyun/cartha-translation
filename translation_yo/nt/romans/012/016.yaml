  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìpìlẹ̀ ẹsẹ náà dáadáa: ìṣọ̀kan sí ara ẹni, àìfi ọkàn sí ohun gíga, ìkìlọ̀ sí ọgbọ́n ní ojú ara ẹni, àti agbára ìbẹ̀rẹ̀/ìdàgbàsókè nínú γίνεσθε. Ṣùgbọ́n «àwọn ẹni rírẹ̀lẹ̀» lè tú ταπεινοῖς sí ‘àwọn ẹni onírẹ̀lẹ̀’ ní ti ìwà, níbi tí ọ̀rọ̀ Gíríìkì náà ti ń tọ́ka ní pàtàkì sí ẹni tàbí ohun tí ó wà ní ipò kékeré; ìtumọ̀ náà sì nílò kí a pa àṣàyàn ‘ohun rírẹ̀lẹ̀’ mọ́ ní àlàyé ìsàlẹ̀.'
