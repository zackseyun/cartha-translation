id: ROM.12.16
reference: Romans 12:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: yo
  text: Ẹ máa ní ọkàn kan sí ara yín. Ẹ má ṣe fi ọkàn sí àwọn ohun gíga[a], ṣùgbọ́n ẹ máa bá àwọn ẹni ipò rírẹ̀lẹ̀ kẹ́gbẹ́[b]. Ẹ má ṣe di ọlọ́gbọ́n lójú ara yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “Ẹ má ṣe lépa àwọn ohun ọ̀lá,” tàbí, “Ẹ má ṣe gbéraga.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ máa fara mọ́ àwọn ohun rírẹ̀lẹ̀”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ẹni ipò rírẹ̀lẹ̀ tàbí sí àwọn ohun rírẹ̀lẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Ẹ máa ní ọkàn kan sí ara yín
  rationale: Èyí tú ọ̀rọ̀ ìṣe Gíríìkì náà sí Yorùbá àdánidá gẹ́gẹ́ bí ìṣọ̀kan èrò àti ìwà sí ara ẹni, dípò pé gbogbo ènìyàn gbọ́dọ̀ ní èrò kan náà lórí gbogbo ohun.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: Ẹ má ṣe fi ọkàn sí àwọn ohun gíga
  rationale: Ó pa àwòrán ‘ohun gíga’ inú Gíríìkì mọ́, ó sì lè tọ́ka sí ìgbéraga tàbí fífẹ́ ipò àti ohun ọ̀lá, láì fi tipátipá yan ìtumọ̀ kan ṣoṣo.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: ẹ máa bá àwọn ẹni rírẹ̀lẹ̀ kẹ́gbẹ́
  rationale: ‘Bá … kẹ́gbẹ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún jíjẹ́ kí a fà mọ́ àwọn tí a kà sí ẹni kékeré tàbí ẹni ipò rírẹ̀lẹ̀; àlàyé ìsàlẹ̀ fi ìtumọ̀ míì tí ó ṣeé ṣe hàn.
- source_word: μὴ γίνεσθε
  choice: Ẹ má ṣe di
  rationale: ‘Di’ pa agbára ọ̀rọ̀ γίνομαι mọ́ pé ìkìlọ̀ náà jẹ́ lòdì sí bíbẹ̀rẹ̀ sí í gba irú ìwà yìí.
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: ọlọ́gbọ́n lójú ara yín
  rationale: Èyí tẹ̀lé àpólà Gíríìkì, ó sì sọ ìgbéraga ẹni nínú ìdájọ́ ara rẹ̀ ní kedere.
theological_decisions:
- issue: Ìtumọ̀ τὰ ὑψηλά àti τοῖς ταπεινοῖς nínú ìkìlọ̀ nípa ìrẹ̀lẹ̀
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí kí a má ṣe fi ọkàn sí ‘àwọn ohun gíga,’ ṣùgbọ́n kí a bá ‘àwọn ẹni rírẹ̀lẹ̀’ kẹ́gbẹ́, pẹ̀lú àlàyé ìsàlẹ̀ tó pa àwọn ìtumọ̀ míì mọ́.
  alternative: Kí ẹ má ṣe gbéraga, ṣùgbọ́n kí ẹ fi ara yín fún àwọn iṣẹ́ rírẹ̀lẹ̀.
  rationale: Gíríìkì lè dá lórí ìgbéraga inú ọkàn, ìfẹ́ sí ipò gíga, tàbí bí a ṣe ń bá àwọn ẹni ipò rírẹ̀lẹ̀ lò; τοῖς ταπεινοῖς tún lè jẹ́ ènìyàn tàbí ohun. A kò fi tipátipá mú kí ẹsẹ náà ní ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. Ọ̀rọ̀ ‘ní ọkàn kan’ ń fi ìṣọ̀kan àwùjọ hàn, ‘bá … kẹ́gbẹ́’ sì jẹ́ ọ̀rọ̀ àdánidá fún ìbáṣepọ̀ pẹ̀lú àwọn ẹni tí a kà sí ẹni kékeré.
