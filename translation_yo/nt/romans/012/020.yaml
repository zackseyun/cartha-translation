id: ROM.12.20
reference: Romans 12:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: yo
  text: Ṣùgbọ́n bí ebi bá ń pa ọ̀tá rẹ, fún un ní oúnjẹ; bí òǹgbẹ bá ńgbẹ ẹ́, fún un ní ohun tí yóò mu; nítorí pé nípa ṣíṣe èyí, iwọ yóò kó ẹ̀yín iná tí ń jó[a] jọ lórí orí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yín iná.” Àwòrán náà lè tọ́ka sí ìtìjú tó ń yọrí sí ìrònúpìwàdà, ìdálẹ́bi ọkàn tó ń fa ìrora, tàbí ìdájọ́ tó ń bọ̀; a fi àwòrán Gíríìkì náà sílẹ̀ gẹ́gẹ́ bí ó ti rí nínú ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Ṣùgbọ́n bí
  rationale: “Ṣùgbọ́n” pa agbára ìtakora ἀλλά mọ́ sí ìkìlọ̀ tó ṣáájú nípa ẹ̀san, “bí” sì fi gbólóhùn oníṣ شرط ἐάν hàn lọ́nà Yorùbá àdánidá.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: ebi bá ń pa ọ̀tá rẹ
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tó ṣe kedere láti sọ pé ọ̀tá ẹni ń pa á lára nítorí ebi; ó sì pa ẹyọ ọ̀tá inú Gíríìkì mọ́.
- source_word: ψώμιζε αὐτόν
  choice: fún un ní oúnjẹ
  rationale: Àṣẹ ψώμιζε ni láti pèsè oúnjẹ fún un; yíyan ọ̀rọ̀ yìí ṣe kedere, ó sì bójú mu ní Yorùbá ju ìtumọ̀ líle tí kò wọ́pọ̀ lọ.
- source_word: ἐὰν διψᾷ
  choice: bí òùngbẹ bá ń gbẹ ẹ́
  rationale: Ọ̀rọ̀ yìí tú ipò òùngbẹ nínú gbólóhùn oníṣ شرط náà sí Yorùbá àdánidá.
- source_word: πότιζε αὐτόν
  choice: fún un ní ohun tí yóò mu
  rationale: πότιζε túmọ̀ sí fí ohun mímu fún ẹnì kan; a kò fi “omi” sí i nítorí Gíríìkì kò dín ohun mímu náà mọ́ omi nìkan.
- source_word: τοῦτο γὰρ ποιῶν
  choice: nítorí pé nípa ṣíṣe èyí
  rationale: Èyí pa ìtumọ̀ ìdí àti ọ̀nà inú γάρ àti participle ποιῶν mọ́.
- source_word: ἄνθρακας πυρὸς
  choice: ẹ̀yín iná tí ń jó
  rationale: Èyí jẹ́ àfihàn Yorùbá tó ṣe kedere fún ẹ̀yín iná gbígbóná, ó sì pa àwòrán Gíríìkì mọ́ láì túmọ̀ ohun tí àkàwé náà dúró fún.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: ìwọ yóò kó ... jọ sórí rẹ̀
  rationale: “Yóò kó ... jọ” pa ọjọ́ iwájú àti ìṣe kíkó ohun pọ̀ inú σωρεύσεις mọ́; “sórí rẹ̀” sì tẹ̀ lé àwòrán gangan náà.
theological_decisions:
- issue: Ìtumọ̀ àkàwé “kó ẹ̀yín iná ... jọ sórí rẹ̀”
  choice: A fi àkàwé náà sílẹ̀ láì ṣe ìtumọ̀ rẹ̀ nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìtìjú tó ń yọrí sí ìrònúpìwàdà, ìdálẹ́bi ọkàn tó lágbára, tàbí ìdájọ́ tó ń bọ̀.
  rationale: Àkàwé Gíríìkì náà ní ọ̀pọ̀ ìtumọ̀ tí àwọn ènìyàn ń jíròrò. Pípa àwòrán náà mọ́ ń yẹra fún yíyan ẹ̀kọ́ kan níbi tí ẹsẹ náà kò ti pinnu rẹ̀ ní kedere.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn gbólóhùn “ebi ń pa” àti “òùngbẹ ń gbẹ” jẹ́ àdánidá fún òǹkàwé Yorùbá, nígbà tí àwòrán ẹ̀yín iná sì dúró láì gba ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan láàyè ju òmíràn lọ.
