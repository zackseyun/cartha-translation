  source_fidelity: 'Àwọn gbólóhùn ìbẹ̀rẹ̀, àwọn àṣẹ láti fún ní oúnjẹ àti ohun mímu, àti ọjọ́ iwájú ti σωρεύσεις ni a túmọ̀ ní ìfẹ̀sẹ̀mulẹ̀. Ṣùgbọ́n ἐπὶ τὴν κεφαλὴν αὐτοῦ, ‘lórí orí rẹ̀,’ ti sọnù nínú àkọsílẹ̀: ‘sórí rẹ̀’ lè túmọ̀ sí lórí ara rẹ̀ ní gbogbogbò, kì í sì pa ‘orí’ mọ́.'
