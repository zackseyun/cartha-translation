  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ọ̀rọ̀ Gíríìkì náà dáadáa: àwọn pátísípù mẹ́tẹ̀ẹ̀ta náà ni a gbé kalẹ̀ gẹ́gẹ́ bí ìṣírí tí ń bá a lọ—ayọ̀ nínú ìrètí, ìfaradà nínú ìpọ́njú, àti ìdúróṣinṣin nínú àdúrà. “Ẹ máa fara da ìpọ́njú” ń mú ὑπομένοντες ... θλίψει hàn ní tòótọ́; “ẹ máa dúró ṣinṣin nínú àdúrà” sì ń pa ìdúró-tẹ́ra ti προσκαρτεροῦντες mọ́.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, ìforúkọsílẹ̀ rẹ̀ sì yẹ fún ìṣírí aposteli. Àtúnlò “Ẹ máa ...” jẹ́ àdánidá, ó sì fún àwọn gbolohun mẹ́tẹ̀ẹ̀ta náà ní ìfararora tó dára. Àmì ohùn àti ìkọ̀wé gbogbogbò jẹ́ pípé.
  terminology: “Ìrètí,” “ìpọ́njú,” “fara da,” àti “àdúrà” jẹ́ àwọn ọ̀rọ̀ tó bójú mu, tó sì wọ́pọ̀. “Dúró ṣinṣin nínú àdúrà” jẹ́ ìtumọ̀ tí ó dára fún ìtẹramọ́/ìfaradà nínú àdúrà, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un. Àwọn àmì àlàyé Yorùbá ni a so mọ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé ní tòótọ́; èyí tún ṣe atunṣe ìbámu-àmì tí ó dàrú nínú àkọsílẹ̀ Gẹ̀ẹ́sì.
