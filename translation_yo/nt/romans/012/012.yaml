source:
  edition: SBLGNT
  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: yo
  text: Ẹ máa yọ̀ nínú ìrètí, ẹ máa fara da ìpọ́njú[a], ẹ sì máa dúró ṣinṣin nínú àdúrà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìyà,” “wàhálà líle,” tàbí “ìkìmọ́lẹ̀”; θλίψει ń tọ́ka sí ipò ìṣòro tàbí ìpọ́njú líle.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ máa fi ara yín fún àdúrà.” προσκαρτεροῦντες tẹnu mọ́ títẹra mọ́ ohun kan pẹ̀lú ìfọkànsìn, kì í ṣe kìkì pé kí a má ṣe dáwọ́ dúró.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: nínú ìrètí
  rationale: Dátífù náà ń sọ ibi tàbí ìpìlẹ̀ ayọ̀; “nínú ìrètí” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ ìrètí tàbí ohun tí a ń retí mọ́.
- source_word: χαίροντες
  choice: Ẹ máa yọ̀
  rationale: Pátísípù àkókò ìsinsìnyí ní agbára ìṣírí nínú àyíká yìí. “Ẹ máa yọ̀” fi ìṣe tí ń bá a lọ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: θλίψει
  choice: ìpọ́njú
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìkìmọ́lẹ̀, wàhálà, tàbí ìyà líle. “Ìpọ́njú” pa ìwọ̀n ìjìyà náà mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
- source_word: ὑπομένοντες
  choice: ẹ máa fara da
  rationale: ὑπομένω túmọ̀ sí dídúró lábẹ́ ìṣòro láìyẹ̀. “Fara da” jẹ́ àdánidá, ó sì fi ìfaradà tí ó dúró ṣinṣin hàn.
- source_word: προσευχῇ
  choice: nínú àdúrà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àdúrà lápapọ̀; “nínú àdúrà” jẹ́ ìtumọ̀ dátífù tí ó bójú mu ní Yorùbá.
- source_word: προσκαρτεροῦντες
  choice: ẹ máa dúró ṣinṣin
  rationale: Ọ̀rọ̀-ìṣe náà ní ìtumọ̀ títẹ̀síwájú pẹ̀lú ìfọkànsìn àti ìdúróṣinṣin. Àṣàyàn yìí pa ìṣe tí ń bá a lọ àti agbára ìfaradà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Àwọn gbólóhùn ìṣírí mẹ́tẹ̀ẹ̀ta lo àpẹẹrẹ “Ẹ máa …” láti fi ìṣe tí ń bá a lọ hàn, ní èdè ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì àlàyé ni a gbé sí ọ̀rọ̀ tí wọ́n ń ṣàlàyé, nítorí àwọn àmì inú ipele ìgbìmọ̀ Gẹ̀ẹ́sì kò bá àkóónú àlàyé wọn mu.
