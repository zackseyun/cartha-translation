revisions:
- from: Ẹ máa pín nínú àìní àwọn ẹni mímọ́[a]; ẹ máa fi ìtara wá ọ̀nà láti gba àlejò[b].
  to: Ẹ máa kópa nínú ríràn àwọn ẹni mímọ́ lọ́wọ́ ní àìní wọn[a]; ẹ máa fi ìtara gba àlejò[b].
  rationale: The revision clarifies that believers are to take part in relieving fellow believers' practical needs, not merely share their deprivation. It also renders the second exhortation directly and naturally while retaining the Greek verb's deliberate, energetic force through “fi ìtara.” The footnotes preserve the relevant lexical alternatives and the outward-facing sense of hospitality.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:09Z'
review_pass:
  verdict: revise
  source_fidelity: The two present participles function as continuing exhortations. The draft appropriately represents the active support of the saints' needs and the intentional pursuit of hospitality. However, “pín nínú àìní” can naturally suggest sharing in their state of deprivation rather than participating in meeting their needs.
  naturalness: “Ẹ máa kópa nínú ríràn ... lọ́wọ́” is clearer, idiomatic Standard Yorùbá for active participation in relieving needs. “Ẹ máa fi ìtara gba àlejò” is concise and preserves the urgent, active force of διώκοντες without adding “ọ̀nà” (ways).
  terminology: “Àwọn ẹni mímọ́” suitably retains Paul's corporate designation for believers. “Àlejò” is an appropriate natural rendering of φιλοξενία in context; the footnote preserves its stranger-welcoming dimension.
  issues:
  - severity: medium
    issue: “Ẹ máa pín nínú àìní àwọn ẹni mímọ́” is potentially ambiguous in Yorùbá.
    rationale: It may be heard as an instruction to share the saints' deprivation, rather than to share materially and actively in addressing their needs, which is the contextual force of κοινωνοῦντες with χρείαις.
  - severity: low
    issue: “Wá ọ̀nà láti gba àlejò” adds an explicit object, “ways.”
    rationale: The addition is compatible with the exhortation but is unnecessary. A direct imperative to eagerly welcome guests is more concise and closer to the Greek's “pursuing hospitality.”
  revised_text: Ẹ máa kópa nínú ríràn àwọn ẹni mímọ́ lọ́wọ́ ní àìní wọn[a]; ẹ máa fi ìtara gba àlejò[b].
