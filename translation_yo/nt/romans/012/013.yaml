  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: yo
  text: Ẹ máa kópa nínú ríràn àwọn ẹni mímọ́ lọ́wọ́ ní àìní wọn[a]; ẹ máa fi ìtara gba àlejò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa ṣèrànwọ́ láti pèsè ohun tí àwọn ẹni mímọ́ nílò.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gidi pé “ìfẹ́ àwọn àjèjì”; ó lè tẹnumọ́ fífi inú rere tẹ́wọ́ gba àwọn tí ẹni kò mọ̀ tẹ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: àìní
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí ó ṣe pàtàkì fún ìgbésí ayé tàbí ipò àìní; “àìní” jẹ́ ọ̀rọ̀ Yorùbá adayébá tó bá àyíká ìrànlọ́wọ́ ohun ìní mu.
- source_word: ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Èyí pa àmì ìdánimọ̀ ti Pọ́ọ̀lù mọ́ fún gbogbo àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn ènìyàn tí Ọlọ́run yà sí mímọ́, kì í ṣe àwọn ẹni tí a sọ di ẹni mímọ́ ní ìtumọ̀ ṣọ́ọ̀ṣì ti ìgbà tó tẹ̀ lé e.
- source_word: κοινωνοῦντες
  choice: ẹ máa pín nínú
  rationale: Ó pa èrò ìkópa tàbí ìdàpọ̀ mọ́, ó sì ní àyíká yìí túmọ̀ sí kíkópa ní ti gidi láti bójú tó àìní wọn; kò fi ìtumọ̀ náà mọ́ ọrẹ owó nìkan.
- source_word: φιλοξενίαν
  choice: láti gba àlejò
  rationale: 'Gbólóhùn yìí sọ ìṣe tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí ní Yorùbá adayébá: fífi inú rere tẹ́wọ́ gba ẹni tí ó wá sí ọ̀dọ̀ ẹni, pàápàá àlejò tàbí àjèjì.'
- source_word: διώκοντες
  choice: ẹ máa fi ìtara wá ọ̀nà
  rationale: Èyí pa agbára ọ̀rọ̀ náà mọ́—lílépa, wíwá tàbí fífi taratara ṣe ohun kan—dípò kí ó dà bí ìṣe tí kò ní ìtara.
theological_decisions:
- issue: Ẹni tí “àwọn ẹni mímọ́” ń tọ́ka sí
  choice: àwọn onígbàgbọ́, ìyẹn àwọn ènìyàn mímọ́ ti Ọlọ́run
  alternative: àwọn ẹni mímọ́ tí ṣọ́ọ̀ṣì sọ di mímọ́ ní ìtumọ̀ tó wáyé lẹ́yìn náà
  rationale: Nínú lílo Pọ́ọ̀lù, ọ̀rọ̀ náà sábà ń tọ́ka sí àwọn Kristẹni lápapọ̀ gẹ́gẹ́ bí àwọn tí Ọlọ́run yà sí mímọ́.
translation_notes:
  register: Yorùbá ìlòde-òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àṣẹ méjèèjì jẹ́ ti ìṣe tí ó yẹ kí ó máa bá a lọ; “ẹ máa” mú èyí hàn. Ìtumọ̀ náà yàgò fún lílo “àlejò ṣíṣe,” èyí tí ó lè túmọ̀ sí jíjẹ́ àlejò dípò gbígba àlejò.
