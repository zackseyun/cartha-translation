  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: yo
  text: 'Bẹ́ẹ̀ náà ni àwa, bí a tilẹ̀ pọ̀, jẹ́ ara kan nínú Mèsáyà[a]; ní ti ẹnì kọ̀ọ̀kan wa sì, a jẹ́ ẹ̀yà ara àwọn ẹlòmíràn.


    [a] Tàbí: “nínú Kristi.” Χριστός jẹ́ oyè Gíríìkì tí a lè túmọ̀ sí “Mèsáyà”; “Kristi” sì jẹ́ ọ̀nà ìlò tí ó wọ́pọ̀ fún oyè náà ní Yorùbá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “nínú Kristi.” Χριστός jẹ́ oyè Gíríìkì tí a lè túmọ̀ sí “Mèsáyà”; “Kristi” sì jẹ́ ọ̀nà ìlò tí ó wọ́pọ̀ fún oyè náà ní Yorùbá.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ẹsẹ yìí mọ́ àpẹẹrẹ ara tí ẹsẹ tó ṣáájú rẹ̀ gbé kalẹ̀, ó sì pa agbára ìfiwéra ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οἱ πολλοὶ
  choice: àwa, bí a tilẹ̀ pọ̀
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń fi ara rẹ̀ sínú àwọn onígbàgbọ́ tí ó ń bá sọ̀rọ̀; gbólóhùn yìí sì fi ọ̀pọ̀ wọn àti ìṣọ̀kan wọn hàn.
- source_word: ἓν σῶμά
  choice: ara kan
  rationale: Ó pa àpèjúwe ara àti ìṣọ̀kan mọ́ ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Ó pa gbólóhùn pàtàkì ti Pọ́ọ̀lù nípa wíwà nínú Mèsáyà mọ́, ó sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè.
- source_word: τὸ δὲ καθ’ εἷς
  choice: ní ọ̀kọ̀ọ̀kan sì
  rationale: 'Ó fi agbára ìpínkiri ọ̀rọ̀ náà hàn: ẹni kọ̀ọ̀kan ní tirẹ̀, láàárín gbogbo wọn.'
- source_word: ἀλλήλων
  choice: fún ara wa
  rationale: Ó sọ ìbáṣepọ̀ alábápín àti jíjẹ́ ti ara wọn di Yorùbá adayeba láì sọ ìtumọ̀ náà di ẹ̀kọ́ mìíràn.
- source_word: μέλη
  choice: ẹ̀yà ara
  rationale: Ó pa àwòrán ara mọ́ ní kedere ju ọ̀rọ̀ tí ó lè túmọ̀ sí ọmọ ẹgbẹ́ lásán lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστῷ nínú ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: nínú Kristi
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí Mèsáyà. Yíyan “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fi ìtumọ̀ Yorùbá ìbílẹ̀ “Kristi” hàn láì yanjú ìfarahàn méjèèjì ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ; “ẹ̀yà ara” ń mú àpèjúwe ara náà ṣe kedere, “fún ara wa” sì ń fi ìbáṣepọ̀ ara-ẹni-sí-ara-ẹni hàn.
