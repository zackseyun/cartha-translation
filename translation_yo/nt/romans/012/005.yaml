    issue: ‘fún ara wa’ fún ἀλλήλων
    rationale: Fún ní Yorùbá sábà máa ń tọ́ka sí ẹni tí a ń ṣe ohun kan fún, kì í ṣe ìbátan onífẹ̀hónúhàn ‘of one another.’ Ó lè ṣí ìtumọ̀ Gíríìkì pàdánù.
  - severity: low
    issue: Ọ̀rọ̀ àkọsílẹ̀ ìsàlẹ̀ nípa ‘Kristi’
    rationale: Wí pé Χριστός ‘lè jẹ́ Kristi’ lè dà bí ẹni pé ‘Kristi’ jẹ́ ìtumọ̀-ọrọ̀ tí ó dọ́gba pẹ̀lú ‘Mèsáyà.’ Ó dára láti pè é ní ọ̀nà ìlò tí ó wọ́pọ̀ fún oyè náà.
