id: ROM.12.8
reference: Romans 12:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: yo
  text: bí ó bá jẹ́ ẹni tí ń gba ènìyàn níyànjú[a], kí ó máa ṣe é nípa ìgbani-níyànjú; ẹni tí ń pín ohun tí ó ní fún ẹlòmíràn[b], kí ó ṣe é pẹ̀lú ìwà ọ̀làwọ́[c]; ẹni tí ń ṣe aṣáájú[d], kí ó ṣe é pẹ̀lú ìtara[e]; ẹni tí ń ṣàánú, kí ó ṣe é pẹ̀lú inú dídùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ẹni tí ń rọni láti ṣe ohun tó yẹ.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí rírọni, fífi ọkàn ẹni balẹ̀, tàbí fífúnni ní ìgboyà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹni tí ń fúnni” tàbí “ẹni tí ń ṣètìlẹ́yìn pẹ̀lú ohun ìní rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “pẹ̀lú òtítọ́ inú” tàbí “láìlẹ́tan.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọkàn kan ṣoṣo tí kò ní ète méjì, tàbí sí ọ̀làwọ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: d
    text: Tàbí “ẹni tí ń ṣàkóso” tàbí “ẹni tí ń bójú tó iṣẹ́.”
    reason: lexical_alternative
  - marker: e
    text: Tàbí “pẹ̀lú ìfọkànsìn” tàbí “tọkàntọkàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: bí ó bá jẹ́
  rationale: Ó ń tẹ̀ síwájú nínú àtòjọ ọ̀rọ̀ tí kò sọ gbogbo gbólóhùn jáde láti ẹsẹ tó ṣáájú; ọ̀rọ̀ yìí mú ìtumọ̀ àídájú náà hàn ní Yorùbá àdánidá.
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: ẹni tí ń gbani níyànjú … kí ó fi ara rẹ̀ fún ìgbọ́ni-níyànjú
  rationale: “Gbani níyànjú” lè ní ìtumọ̀ fífi ọkàn ẹni balẹ̀ tàbí rírọ ẹni láti ṣe ohun tó yẹ. Àtúnsọ ọ̀rọ̀ náà jẹ́ kí ìbátan ọ̀rọ̀ Gíríìkì παρακαλέω àti παράκλησις ṣì hàn, bí ó tilẹ̀ jẹ́ pé Yorùbá nílò gbólóhùn tó gùn díẹ̀.
- source_word: ὁ μεταδιδοὺς
  choice: ẹni tí ń pín ohun tó ní fún ẹlòmíràn
  rationale: Ó fi hàn pé ẹni náà ń mú nínú ohun ìní tàbí ohun àmúṣọrọ̀ rẹ̀ fún ẹlòmíràn, kì í ṣe fífúnni lásán.
- source_word: ἐν ἁπλότητι
  choice: pẹ̀lú ọ̀làwọ́
  rationale: Ní àyíká pípín ohun ìní, ọ̀làwọ́ ni ìtumọ̀ tó bá ọ̀rọ̀ mu jù; àkọsílẹ̀ ìsàlẹ̀ ṣètọ́jú àwọn ìtumọ̀ míì bí àìlábùkù ọkàn àti àìlẹ́tan.
- source_word: ὁ προϊστάμενος
  choice: ẹni tí ń ṣe aṣáájú
  rationale: Ó jẹ́ ọ̀rọ̀ gbogbogbò fún ẹni tó ń darí tàbí tó ń bójú tó iṣẹ́, láì sọ ọ́ di orúkọ ipò pàtó nínú ìjọ.
- source_word: ἐν σπουδῇ
  choice: pẹ̀lú ìtara
  rationale: “Ìtara” gba èrò ìkánjú rere, ìfọkànsìn, àti ṣíṣe iṣẹ́ tọkàntọkàn tí σπουδή lè ní.
- source_word: ὁ ἐλεῶν
  choice: ẹni tí ń ṣàánú
  rationale: Ó pa ìṣe alágbára inú participle Gíríìkì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἐν ἱλαρότητι
  choice: pẹ̀lú inú dídùn
  rationale: Ó túmọ̀ sí ṣíṣe àánú pẹ̀lú ayọ̀ àti ìfẹ́ inú, kì í ṣe pẹ̀lú ìkùnsínú.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ὁ προϊστάμενος
  choice: ẹni tí ń ṣe aṣáájú
  alternative: ẹni tí ń ṣàkóso tàbí ẹni tó ń bójú tó iṣẹ́
  rationale: Àwọn ọ̀rọ̀ inú ẹsẹ yìí ń sọ nípa àwọn ẹ̀bùn oore-ọ̀fẹ́ ní gbogbogbò, wọn kò sì dárúkọ ipò kan pàtó nínú ìjọ. Yíyan ọ̀rọ̀ gbogbogbò yàgò fún fífi ètò ìṣàkóso ẹ̀sìn kan lé ẹsẹ náà lórí.
- issue: Ìtumọ̀ ἁπλότης níbi fífúnni
  choice: ọ̀làwọ́ nínú pípín ohun ìní
  alternative: òtítọ́ inú tàbí àìlẹ́tan
  rationale: Nítorí pé ọ̀rọ̀ náà tẹ̀ lé pípín ohun tí ẹni ní, ìtumọ̀ ọ̀làwọ́ ló bá àyíká mu jù. Àmọ́ àkọsílẹ̀ ìsàlẹ̀ kò jẹ́ kí àwọn ìtumọ̀ gidi mìíràn sọnù.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ọ̀wọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A mú àtòjọ Pọ́ọ̀lù di Yorùbá àdánidá nípa lílo “kí ó…” láti ṣàlàyé àwọn gbólóhùn Gíríìkì tí a fi apá kan sílẹ̀, láì yí agbára ìlànà wọn padà. “Pín ohun tó ní fún ẹlòmíràn” ṣe kedere sí òǹkàwé òde òní, nígbà tí “ṣe aṣáájú” kò fi ipò ìjọ kan pàtó kún ọ̀rọ̀ náà.
