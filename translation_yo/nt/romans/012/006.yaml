id: ROM.12.6
reference: Romans 12:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: yo
  text: Àmọ́ níwọ̀n bí a ti ní àwọn ẹ̀bùn tí ó yàtọ̀ síra, gẹ́gẹ́ bí oore-ọ̀fẹ́ tí a fi fún wa, bí ẹ̀bùn náà bá jẹ́ ti ìsọtẹ́lẹ̀, kí a lò ó ní ìwọ̀n tó bá ìgbàgbọ́ mu[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “gẹ́gẹ́ bí ìwọ̀n ìgbàgbọ́ ẹni”; tàbí, “ní ìbámu pẹ̀lú ẹ̀kọ́ ìgbàgbọ́.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìwọ̀n ìgbàgbọ́ tí ẹni tó ń sọ àsọtẹ́lẹ̀ ní, tàbí sí bí ọ̀rọ̀ náà ṣe bá àkóónú ìgbàgbọ́ Kristẹni mu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες
  choice: níwọ̀n bí a ti ní
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó ń tẹ̀ síwájú láti inú ọ̀rọ̀ ẹsẹ tó ṣáájú. ‘Níwọ̀n bí a ti ní’ jẹ́ èdè Yorùbá àdánidá tó pa ìtumọ̀ ìní ẹ̀bùn mọ́ láì fi ìbáṣepọ̀ gírámà sílẹ̀ ní pàtó ju Gíríìkì lọ.
- source_word: δὲ
  choice: Àmọ́
  rationale: Ó fi ìyípadà kékeré hàn láti àpẹẹrẹ ara kan ṣoṣo sí onírúurú ẹ̀bùn; ‘Àmọ́’ jẹ́ ìsopọ̀ onírẹ̀lẹ̀, kì í ṣe àtakò líle.
- source_word: χαρίσματα
  choice: àwọn ẹ̀bùn
  rationale: ‘Àwọn ẹ̀bùn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn ohun tí Ọlọ́run fi oore-ọ̀fẹ́ fún ènìyàn; gbólóhùn tó tẹ̀ lé e ṣàlàyé pé oore-ọ̀fẹ́ ni orísun wọn.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: gẹ́gẹ́ bí oore-ọ̀fẹ́ tí a fi fún wa
  rationale: ‘Gẹ́gẹ́ bí’ fi ìbámu tàbí ìbáṣepọ̀ tí κατά ń tọ́ka sí hàn, ‘oore-ọ̀fẹ́’ sì pa ìtumọ̀ χάρις gẹ́gẹ́ bí ìfúnni Ọlọ́run tí a kò tọ́ sí mọ́.
- source_word: διάφορα
  choice: tí ó yàtọ̀ síra
  rationale: Ó sọ pé àwọn ẹ̀bùn náà kì í ṣe ọ̀kan náà; gbólóhùn ìbátan yìí jẹ́ èdè Yorùbá tó ṣàn déédé.
- source_word: εἴτε
  choice: bí ... bá jẹ́
  rationale: Èyí bẹ̀rẹ̀ àkọ́kọ́ nínú àtòjọ àwọn ẹ̀bùn. Ìṣètò ‘bí ... bá jẹ́’ mú gbólóhùn Gíríìkì tí a gé kúrú náà ṣe kedere ní Yorùbá.
- source_word: προφητείαν
  choice: ìsọtẹ́lẹ̀
  rationale: Èyí ni ọ̀rọ̀ ìsìn Yorùbá tó wọ́pọ̀ fún iṣẹ́ wòlíì tàbí ọ̀rọ̀ tí wòlíì ń sọ. Àyíká ọ̀rọ̀ fi hàn pé ẹ̀bùn tàbí iṣẹ́ ni, kì í ṣe àsọtẹ́lẹ̀ ọjọ́ iwájú nìkan.
- source_word: κατὰ τὴν ἀναλογίαν
  choice: ní ìwọ̀n tó bá ... mu
  rationale: Gbólóhùn yìí lè túmọ̀ sí ìwọ̀n, ìbámu, tàbí ìbáṣepọ̀ tó yẹ. Èdè Yorùbá yìí pa fífẹ̀ ìtumọ̀ náà mọ́ dípò yíyan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
- source_word: τῆς πίστεως
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ tó taara fún πίστις níbí. A kò fi ọ̀rọ̀ ‘ẹni’ tàbí ‘ẹ̀kọ́’ kún un nínú ẹsẹ náà, kí a má bàa pinnu bóyá ó ń tọ́ka sí ìwọ̀n ìgbàgbọ́ ẹni tàbí sí àkóónú ìgbàgbọ́ Kristẹni.
theological_decisions:
- issue: Ìtumọ̀ κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: ní ìwọ̀n tó bá ìgbàgbọ́ mu
  alternative: gẹ́gẹ́ bí ìwọ̀n ìgbàgbọ́ ẹni; tàbí ní ìbámu pẹ̀lú ẹ̀kọ́ ìgbàgbọ́
  rationale: Gíríìkì náà lè tọ́ka sí ìwọ̀n ìgbàgbọ́ ẹni tó ń sọ àsọtẹ́lẹ̀, tàbí sí bí ọ̀rọ̀ rẹ̀ ṣe bá àkóónú ìgbàgbọ́ Kristẹni mu. Ọ̀rọ̀ inú ẹsẹ náà jẹ́ fífẹ̀, àlàyé ìsàlẹ̀ sì pa àwọn ọ̀nà ìtumọ̀ pàtàkì méjèèjì mọ́.
translation_notes:
  register: A lo Yorùbá àfọwọ́kọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Àmọ́’ jẹ́ ìsopọ̀ onírẹ̀lẹ̀; ‘oore-ọ̀fẹ́,’ ‘ẹ̀bùn,’ ‘ìsọtẹ́lẹ̀,’ àti ‘ìgbàgbọ́’ jẹ́ ọ̀rọ̀ tó yé àwọn òǹkàwé Yorùbá púpọ̀ láì gbára lé èdè ẹ̀ka ìjọ kan pàtó.
