  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí a ti ní ẹ̀yà ara púpọ̀[a] nínú ara kan, kì í ṣe gbogbo àwọn ẹ̀yà náà ló ní iṣẹ́ kan náà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀pọ̀lọpọ̀ apá ara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgbòkègbodò kan náà.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbòkègbodò tàbí iṣẹ́; “iṣẹ́” bá àwòrán ara àti onírúurú ohun tí ẹ̀yà kọ̀ọ̀kan ń ṣe mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” pa ìsopọ̀ àlàyé γὰρ mọ́, “gẹ́gẹ́ bí” sì bẹ̀rẹ̀ àfiwé tí ẹsẹ tó tẹ̀ lé yóò parí.
- source_word: ἐν ἑνὶ σώματι
  choice: nínú ara kan
  rationale: Ó túmọ̀ gbólóhùn ibi náà ní tààrà, ó sì pa ìṣọ̀kan àwòrán ara kan mọ́ láìfi ìjọ kún un ní ẹsẹ yìí.
- source_word: πολλὰ μέλη
  choice: ẹ̀yà púpọ̀
  rationale: “Ẹ̀yà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn apá ara, ó sì lè gbé ìtumọ̀ àwòrán Pọ́ọ̀lù lọ sí àwọn ènìyàn inú ẹgbẹ́ kan.
- source_word: ἔχομεν
  choice: a ti ní
  rationale: Ìsọ̀rọ̀ yìí túmọ̀ ìṣe ìsinsìnyí gẹ́gẹ́ bí ohun tí ó jẹ́ òtítọ́ nípa wa; “a ti ní” jẹ́ ọ̀nà Yorùbá àdánidá nínú àfiwé yìí.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: ṣùgbọ́n gbogbo àwọn ẹ̀yà náà kò
  rationale: 'Ó pa ìyàtọ̀ δέ àti ìwọ̀n àìfẹsẹ̀múlẹ̀ náà mọ́: kì í ṣe pé kò sí ẹ̀yà kankan tó ní iṣẹ́, bí kò ṣe pé gbogbo wọn kì í ṣe iṣẹ́ kan náà.'
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: ní iṣẹ́ kan náà
  rationale: “Iṣẹ́” lè tọ́ka sí ohun tí ẹ̀yà kọ̀ọ̀kan ń ṣe nínú ara, ó sì bá àwòrán ara àti ọ̀rọ̀ nípa onírúurú ipa mu; “ìgbòkègbodò” tún ṣeé ṣe.
theological_decisions:
- issue: Agbára àwòrán ara sí ẹ̀kọ́ nípa ìjọ
  choice: Pa “ara kan” àti “ẹ̀yà púpọ̀” mọ́ gẹ́gẹ́ bí àfiwé, láìsọ “ìjọ” ní tààrà.
  alternative: “Ara kan, èyí tí í ṣe ìjọ”
  rationale: Ẹsẹ yìí ń gbé àfiwé kalẹ̀; ẹsẹ tó tẹ̀ lé ni yóò fi í lò fún àwọn onígbàgbọ́. Fífi “ìjọ” sínú ẹsẹ yìí yóò ṣáájú ìlọsíwájú ọ̀rọ̀ náà.
- issue: Ìtumọ̀ πρᾶξις
  choice: “iṣẹ́”
  alternative: “ìgbòkègbodò” tàbí “ipa”
  rationale: Nínú àwòrán ara, ọ̀rọ̀ náà lè túmọ̀ sí iṣẹ́ tàbí ìgbòkègbodò ẹ̀yà kọ̀ọ̀kan. “Iṣẹ́” jẹ́ àdánidá, kò sì sọ ìtumọ̀ náà di ọ̀rọ̀ ìmọ̀ iṣẹ́ pàtó ju bí Gíríìkì ṣe sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣeé lóye fún òǹkàwé òde òní, ó sì pa gbólóhùn náà sílẹ̀ gẹ́gẹ́ bí ìbẹ̀rẹ̀ àfiwé tí ẹsẹ tó tẹ̀ lé ń parí.
