  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: yo
  text: Nínú ìsapá, ẹ má ṣe jẹ́ ọ̀lẹ; ẹ máa gbóná nínú ẹ̀mí[a]; ẹ máa sin Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa gbóná nínú Ẹ̀mí,” bí πνεύματι bá ń tọ́ka sí Ẹ̀mí Mímọ́ dípò ẹ̀mí inú onígbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: ìtara
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìtara, ìmúra-tán, tàbí ṣíṣe ohun pẹ̀lú gbogbo ọkàn. “Nínú ìtara” bá ìtakora rẹ̀ pẹ̀lú ὀκνηροί mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ὀκνηροί
  choice: jẹ́ ọ̀lẹ
  rationale: Ó ṣàpèjúwe ìlọ́ra tàbí àìfẹ́ láti ṣe ohun tí ó yẹ. “Jẹ́ ọ̀lẹ” ṣe kedere, ó sì bá ìtara tí a mẹ́nu kàn mu.
- source_word: πνεύματι
  choice: ní ẹ̀mí
  rationale: Gíríìkì kò sọ ní pàtó bóyá ẹ̀mí inú onígbàgbọ́ ni tàbí Ẹ̀mí Mímọ́. Ọ̀rọ̀ inú ẹsẹ náà fi ẹ̀mí inú ènìyàn hàn gẹ́gẹ́ bí èrò tó ṣeé ṣe jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: ζέοντες
  choice: máa jó
  rationale: Ìtumọ̀ rẹ̀ ní tààrà ni “síse bí omi gbígbóná.” “Máa jó ní ẹ̀mí” pa àwòrán ìgbóná àti ìtara inú mọ́ ní èdè Yorùbá tó yè kooro.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: Àkọlé “Olúwa” ni ìtumọ̀ àdánidá fún κύριος ní àyíká ọ̀rọ̀ Paulu, láì fi ìdánimọ̀ tó ju ohun tí ẹsẹ náà sọ lọ kún un.
- source_word: δουλεύοντες
  choice: máa sin
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní ìbátan pẹ̀lú jíjẹ́ ẹrú, “sin Olúwa” ni ọ̀nà àdánidá láti sọ ìfọkànsìn àti ìgbọràn tí àṣẹ yìí béèrè.
theological_decisions:
- issue: Ohun tí πνεύματι ń tọ́ka sí nínú τῷ πνεύματι ζέοντες
  choice: ẹ̀mí inú ènìyàn / ìtara inú ọkàn
  alternative: Ẹ̀mí Mímọ́
  rationale: Àwọn gbólóhùn ìkìlọ̀ tó tẹ̀ lé ara wọn nínú àyíká ọ̀rọ̀ náà ṣe àtìlẹ́yìn fún ìtumọ̀ pé kí ẹ̀mí inú onígbàgbọ́ gbóná. Síbẹ̀, Gíríìkì kò yanjú ohun tí πνεύματι ń tọ́ka sí, nítorí náà a pa ìtumọ̀ Ẹ̀mí Mímọ́ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí Gíríìkì ṣe fi hàn. Àtúnṣe “ẹ máa” mú àwọn participle Gíríìkì ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ìkìlọ̀ tó tẹ̀ síwájú.
