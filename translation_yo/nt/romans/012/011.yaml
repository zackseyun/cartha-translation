review_pass:
  verdict: revise
  source_fidelity: The three coordinated exhortations and their sequence are retained. However, “jó” primarily means “dance” in ordinary modern Yoruba, so “máa jó ní ẹ̀mí” can communicate dancing rather than the θερmal metaphor of ζέοντες (“boiling/fervent”). “Gbóná” safely preserves the metaphor. “Ìsapá” gives σπουδῇ its practical sense of diligence/earnest effort and fits the contrast with being sluggish.
  naturalness: The revised wording is idiomatic, clear Standard Yoruba, and retains the plural exhortational force. “Ẹ máa gbóná nínú ẹ̀mí” is substantially less ambiguous in Yoruba than the draft’s use of “jó.”
  terminology: “Olúwa” and “sin” are appropriate for κυρίῳ and δουλεύοντες. The lowercase “ẹ̀mí” leaves πνεύματι open as in the Greek; the footnote appropriately presents the Holy-Spirit reading without deciding it.
  issues:
  - severity: high
    issue: “Ẹ máa jó ní ẹ̀mí” is lexically misleading.
    rationale: In normal Yoruba usage, jó means “dance.” Although it may be intended as an image of burning, it can readily be read as an instruction to dance spiritually and does not reliably render ζέοντες.
  - severity: medium
    issue: “jẹ́ ọ̀lẹ nínú ìtara” is an awkward collocation.
    rationale: The Greek contrasts diligence/earnest effort with sluggishness. “Nínú ìsapá, ẹ má ṣe jẹ́ ọ̀lẹ” expresses this contrast naturally without changing the exhortation.
  revised_text: Nínú ìsapá, ẹ má ṣe jẹ́ ọ̀lẹ; ẹ máa gbóná nínú ẹ̀mí[a]; ẹ máa sin Olúwa.
  revised_footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa gbóná nínú Ẹ̀mí,” bí πνεύματι bá ń tọ́ka sí Ẹ̀mí Mímọ́ dípò ẹ̀mí inú onígbàgbọ́.
    reason: alternative_reading
  revision_rationale: The revision replaces “jó,” which commonly denotes dancing, with “gbóná,” preserving Paul’s metaphor of inward fervor. It also recasts the first clause into a natural Yoruba contrast between earnest effort and laziness. The ambiguity of πνεύματι remains in both the main text and footnote.
