  rationale: The revision replaces “jó,” which commonly denotes dancing, with “gbóná,” preserving Paul’s metaphor of inward fervor. It also recasts the first clause into a natural Yoruba contrast between earnest effort and laziness. The ambiguity of πνεύματι remains in both the main text and footnote.
