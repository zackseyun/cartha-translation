id: ROM.12.3
reference: Romans 12:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: yo
  text: Nítorí, nípasẹ̀ oore-ọ̀fẹ́ tí a fi fún mi, mo sọ fún olúkúlùkù nínú yín pé kí ó má ṣe ronú nípa ara rẹ̀ ju bí ó ti yẹ lọ, ṣùgbọ́n kí ó ronú pẹ̀lú ìwọ̀ntúnwọ̀nsì,[a] gẹ́gẹ́ bí Ọlọ́run ti pín ìwọ̀n ìgbàgbọ́ fún olúkúlùkù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n kí ó ronú lọ́nà tí yóò fi jẹ́ oníwọ̀ntúnwọ̀nsì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwọ̀n ìgbàgbọ́ náà,” tàbí bóyá “ìwọ̀n ìgbẹ́kẹ̀lé kan” tàbí “ìwọ̀n òtítọ́-inú kan.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìwọ̀n kan tí Ọlọ́run ti fi fún ẹnì kọ̀ọ̀kan, tí ó ní í ṣe pẹ̀lú ìgbàgbọ́, láì sọ ìtumọ̀ pàtó rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: nípa oore-ọ̀fẹ́ tí a fi fún mi
  rationale: ‘Nípa’ fi διά pẹ̀lú ẹ̀yà olùní hàn gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ ọ̀rọ̀ Pọ́ọ̀lù; gbólóhùn náà tún pa àìsọ ẹni tó fi oore-ọ̀fẹ́ náà fún un mọ́, bí ó tilẹ̀ jẹ́ pé Ọlọ́run ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: fún olúkúlùkù láàárín yín
  rationale: Èyí jẹ́ Yorùbá àdánidá tí ó sì pa agbára ìpín sí ẹnì kọ̀ọ̀kan ti παντί mọ́.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: kí ó má ṣe gbé ara rẹ̀ ga nínú èrò ju bí ó ti yẹ kí ó rò lọ
  rationale: Ó mú ìtumọ̀ fífi ara ẹni ga jù nínú èrò jáde, ó sì pa àtúnlò gbòǹgbò ọ̀rọ̀ ‘rò/èrò’ mọ́ dé ìwọ̀n tí Yorùbá àdánidá gbà.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: ṣùgbọ́n kí ó máa ronú pẹ̀lú ìdájọ́ tí ó péye
  rationale: Ó sọ ìtumọ̀ ìrònú ọlọ́gbọ́n, tí ó ní ìwọ̀ntúnwọ̀nsì àti ìkóra-ẹni-níjàánu ní ọ̀nà tí ó ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: ἐμέρισεν
  choice: ti pín
  rationale: ‘Pín’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì mú ìtumọ̀ pípín tàbí yíyan apá fún ẹnì kọ̀ọ̀kan jáde.
- source_word: μέτρον πίστεως
  choice: ìwọ̀n ìgbàgbọ́
  rationale: Ìtumọ̀ yìí tẹ̀lé gbólóhùn Gíríìkì ní pẹkipẹki láì pinnu bóyá ó túmọ̀ sí iye, ààlà, agbára iṣẹ́ ìránṣẹ́, tàbí ìlànà ìgbàgbọ́.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tí ó bójú mu fún πίστις níbí, ó sì pa ààyè ìtumọ̀ gbólóhùn náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ μέτρον πίστεως
  choice: Pa gbólóhùn gbooro ‘ìwọ̀n ìgbàgbọ́’ mọ́.
  alternative: ‘ìwọ̀n ìgbẹ́kẹ̀lé,’ ‘ìwọ̀n òtítọ́-inú,’ tàbí ‘ìwọ̀n ìgbàgbọ́ náà’ gẹ́gẹ́ bí ìlànà kan
  rationale: Àyíká tó tẹ̀ lé sọ̀rọ̀ nípa onírúurú ẹ̀bùn, ṣùgbọ́n Gíríìkì kò sọ ní pàtó bóyá ìwọ̀n náà jẹ́ ìgbàgbọ́ ìgbàlà, agbára iṣẹ́ ìránṣẹ́, tàbí ìlànà kan. A kò gbọdọ̀ yanju ohun tí ọ̀rọ̀ náà fi sílẹ̀ ní gbangba.
- issue: Olùṣe ìṣe inú μὴ ὑπερφρονεῖν
  choice: Lo ‘ara rẹ̀’ láti fi hàn pé ìkìlọ̀ náà kan bí ẹnì kọ̀ọ̀kan ṣe ń wo ara rẹ̀.
  alternative: Fi ‘ara rẹ̀’ sílẹ̀, kí a sọ pé ‘kí ó má ṣe ronú ga jù’
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ arọ́pò ara-ẹni kò dúró lọ́tọ̀ nínú Gíríìkì, ìṣe ὑπερφρονεῖν nínú àyíká yìí ń tọ́ka sí ìṣírò ara ẹni; fífi ‘ara rẹ̀’ kun un jẹ́ Yorùbá tó ṣe kedere láì fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa, olóhùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti kíkà-rọrùn. A lo ‘olúkúlùkù’ láti pa ìtọ́ka sí ẹnì kọ̀ọ̀kan mọ́, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
