  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìpín ọ̀rọ̀ Gíríìkì dáadáa: oore-ọ̀fẹ́ tí a fi fún Pọ́ọ̀lù, ìkìlọ̀ sí ẹnì kọ̀ọ̀kan, ìrònú ara ẹni tí kò gbọdọ̀ ga jù, àti ìpín ìwọ̀n ìgbàgbọ́ láti ọ̀dọ̀ Ọlọ́run. Ṣùgbọ́n “ìdájọ́ tí ó péye” lè túmọ̀ sí ìdájọ́ aláìlábùkù/pípé, èyí tí ó lágbára ju σωφρονεῖν lọ. “Ìwọ̀ntúnwọ̀nsì” ń mú ìrònú ọlọ́gbọ́n, tó ní ìkóra-ẹni-níjàánu, jáde dáadáa.'
