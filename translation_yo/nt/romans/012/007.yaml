translation:
  language: yo
  text: bí ó bá jẹ́ iṣẹ́ sísìn[a], kí ó máa fi ara rẹ̀ fún iṣẹ́ sísìn náà; bí ó bá jẹ́ ẹni tí ń kọ́ni, kí ó máa fi ara rẹ̀ fún ìkọ́ni[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iṣẹ́ ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà, διακονία, lè túmọ̀ sí iṣẹ́ sísìn tàbí iṣẹ́ ìránṣẹ́, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí ó bá jẹ́ olùkọ́, kí ó máa fi ara rẹ̀ fún ìkọ́ni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: bí ó bá jẹ́
  rationale: Ó bá ìtòlẹ́sẹẹsẹ ọ̀rọ̀ kúkúrú yìí mu gẹ́gẹ́ bí àkójọ iṣẹ́ tàbí ẹ̀bùn, ó sì mú ìtumọ̀ ‘if/or if’ jáde ní Yorùbá àdánidá.
- source_word: διακονίαν
  choice: iṣẹ́ sísìn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí iṣẹ́ sísìn, iṣẹ́ ìránṣẹ́, tàbí iṣẹ́ òjíṣẹ́. ‘Iṣẹ́ sísìn’ gbooro, kò sì sọ ọ́ di ipò pàtó nínú ìjọ.
- source_word: ἐν τῇ διακονίᾳ
  choice: kí ó máa fi ara rẹ̀ fún iṣẹ́ sísìn náà
  rationale: Èdè Gíríìkì jẹ́ gbólóhùn aláìpé níbí. Gbólóhùn Yorùbá yìí sọ ìmọ̀ràn tí àyíká ọ̀rọ̀ fi sílẹ̀ hàn ní ọ̀nà àdánidá, ó sì pa àtúnlò ọ̀rọ̀ ‘iṣẹ́ sísìn’ mọ́.
- source_word: ὁ διδάσκων
  choice: ẹni tí ń kọ́ni
  rationale: Èyí pa ìtumọ̀ ẹni tó ń ṣe iṣẹ́ náà mọ́, láì sọ ọ́ di oyè tàbí ipò ‘olùkọ́’ nínú ìjọ.
- source_word: διδασκαλίᾳ
  choice: kíkọ́ni
  rationale: ‘Kíkọ́ni’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún iṣẹ́ ìkọ́ni, kò sì dín ọ̀rọ̀ náà kù sí ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
theological_decisions:
- issue: Bóyá kí a fi ọ̀rọ̀ tó ń tọ́ka sí ipò pàtó nínú ìjọ túmọ̀ διακονία
  choice: iṣẹ́ sísìn
  alternative: iṣẹ́ òjíṣẹ́
  rationale: Àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa àwọn ẹ̀bùn àti iṣẹ́ onírúurú. ‘Iṣẹ́ sísìn’ pa ìtumọ̀ náà mọ́ ní fífẹ̀, láì fi ètò ìjọ ẹ̀ya kan kún un.
- issue: Bóyá kí a sọ ὁ διδάσκων di oyè tàbí ipò
  choice: ẹni tí ń kọ́ni
  alternative: olùkọ́
  rationale: Ọ̀rọ̀ Gíríìkì tẹnu mọ́ ẹni tó ń ṣe iṣẹ́ kíkọ́ni, kì í ṣe dandan pé ó ń dárúkọ ipò kan nínú ìjọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A tú gbólóhùn Gíríìkì aláìpé sí Yorùbá àdánidá nípa lílo ‘kí ó máa fi ara rẹ̀ fún,’ láì yí ìtọ́sọ́nà àyíká ọ̀rọ̀ padà. Àmì àbọ̀-ọ̀rọ̀ ní ìparí fi hàn pé ẹsẹ náà ń bá àkójọ inú ọ̀rọ̀ tó yí i ká lọ.
