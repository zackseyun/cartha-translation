  source_fidelity: 'The translation accurately preserves both qualifications: εἰ δυνατόν is rendered “Bí ó bá ṣeé ṣe,” and τὸ ἐξ ὑμῶν is naturally represented by “níwọ̀n bí ó ti wà lọ́wọ́ yín.” It retains the universal scope of μετὰ πάντων ἀνθρώπων (“pẹ̀lú gbogbo ènìyàn”) and appropriately conveys the ongoing exhortatory force of εἰρηνεύοντες with “ẹ máa wà ní àlàáfíà.”'
  naturalness: The Yorùbá is clear, idiomatic, and appropriately modern while retaining a dignified scriptural register. Tone marks are consistently and naturally supplied. “Níwọ̀n bí ó ti wà lọ́wọ́ yín” is a good, intelligible idiom for what lies within the readers’ power or responsibility.
  terminology: “Àlàáfíà” is the established and suitable term for peace. “Gbogbo ènìyàn” correctly reflects the inclusive generic force of ἀνθρώπων rather than restricting the referent to males. The plural forms “ẹ” and “yín” properly reflect ὑμῶν and the communal address.
