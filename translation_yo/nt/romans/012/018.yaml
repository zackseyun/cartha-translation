  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: yo
  text: Bí ó bá ṣeé ṣe[a], níwọ̀n bí ó ti wà lọ́wọ́ yín, ẹ máa wà ní àlàáfíà pẹ̀lú gbogbo ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ó bá ṣeé ṣe, ní ti tiyín, ẹ máa wà ní àlàáfíà pẹ̀lú gbogbo ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Bí ó bá ṣeé ṣe
  rationale: Gbólóhùn oníṣ شرط yìí fi hàn pé àṣẹ náà mọ ààlà ohun tí ó ṣeé ṣe ní ti gidi; ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τὸ ἐξ ὑμῶν
  choice: níwọ̀n bí ó ti wà lọ́wọ́ yín
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ohun tí ó wà lábẹ́ agbára tàbí ojúṣe àwọn olùgbọ́; ìtumọ̀ náà pa ààlà tí Pọ́ọ̀lù fi sí ìkìlọ̀ náà mọ́.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: pẹ̀lú gbogbo ènìyàn
  rationale: ἄνθρωποι jẹ́ àpapọ̀ fún gbogbo ẹ̀dá ènìyàn níbí, kì í ṣe àwọn ọkùnrin nìkan; ‘gbogbo ènìyàn’ jẹ́ kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: εἰρηνεύοντες
  choice: ẹ máa wà ní àlàáfíà
  rationale: Participle ìsinsìnyí náà ń ṣiṣẹ́ gẹ́gẹ́ bí ìṣílétí nínú àyíká ọ̀rọ̀; ‘ẹ máa wà’ fi ìṣe tàbí ìgbé-ayé tí ń bá a lọ hàn, dípò ipò ìṣẹ́jú kan.
theological_decisions:
- issue: Ìwọ̀n àti ààlà ìṣílétí láti wà ní àlàáfíà
  choice: A pe àwọn onígbàgbọ́ láti wà ní àlàáfíà pẹ̀lú gbogbo ènìyàn, ṣùgbọ́n ojúṣe wọn ní ààlà ohun tí ó ṣeé ṣe àti ohun tí ó wà lọ́wọ́ wọn.
  alternative: Kí a ka a sí àṣẹ tí kò ní ààlà, tàbí sí ìdánilójú pé àlàáfíà yóò ṣẹlẹ̀ nígbà gbogbo bí onígbàgbọ́ bá ṣe ohun tí ó tọ́.
  rationale: 'Àwọn gbólóhùn εἰ δυνατόν àti τὸ ἐξ ὑμῶν pa ìforígbárí inú ọ̀rọ̀ náà mọ́: àfojúsùn náà kan gbogbo ènìyàn, ṣùgbọ́n àṣeyọrí àlàáfíà kò sí lọ́wọ́ ẹgbẹ́ kan ṣoṣo.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ’ àti ‘yín’ láti pa nọ́ńbà ọ̀pọ̀ inú ὑμῶν àti ìṣílétí àpapọ̀ mọ́.
