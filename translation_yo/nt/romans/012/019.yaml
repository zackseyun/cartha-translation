revisions:
- from: Ẹ má ṣe gbẹ̀san ara yín, ẹ̀yin olùfẹ́, ṣùgbọ́n ẹ fi ààyè sílẹ̀ fún ìbínú[a], nítorí a ti kọ ọ pé, “Tèmi ni ẹ̀san; èmi yóò san án padà[b],” ni Olúwa wí.
  to: Ẹ má ṣe gbẹ̀san fún ara yín, ẹ̀yin olùfẹ́, ṣùgbọ́n ẹ fi ààyè sílẹ̀ fún ìbínú[a], nítorí a ti kọ ọ pé, “Tèmi ni ìgbẹ̀san; èmi yóò san án padà[b],” ni Olúwa wí.
  rationale: The revision clarifies the reflexive sense of the prohibition and uses the more exact Yoruba term for vengeance in the biblical quotation. It does not add “Ọlọ́run” to “ìbínú,” thus retaining the source text's terseness and contextual ambiguity. Footnote a is retained; footnote b is normalized to idiomatic Yoruba and continues to preserve the traditional-form rendering.
