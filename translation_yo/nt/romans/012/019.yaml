id: ROM.12.19
reference: Romans 12:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: yo
  text: Ẹ má ṣe gbẹ̀san fún ara yín, ẹ̀yin olùfẹ́, ṣùgbọ́n ẹ fi ààyè sílẹ̀ fún ìbínú[a], nítorí a ti kọ ọ pé, “Tèmi ni ìgbẹ̀san; èmi yóò san án padà[b],” ni Olúwa wí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìtumọ̀ mìíràn ni “ẹ fi ààyè fún ìbínú”; ó ṣeé ṣe kí ó túmọ̀ sí ìbínú Ọlọ́run nítorí ọ̀rọ̀ tí a fa yọ lẹ́yìn rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ ìbílẹ̀: “Tèmi ni ìgbẹ̀san; èmi yóò san án padà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Ẹ má ṣe gbẹ̀san ara yín
  rationale: Ó fi ìfàyègba ara ẹni inú ἑαυτούς hàn ní kedere, ó sì sọ ìkìlọ̀ náà ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: ἀγαπητοί
  choice: ẹ̀yin olùfẹ́
  rationale: Ó pa ìfẹ́ àti ọlá inú ọ̀rọ̀ àpèjúwe náà mọ́ láìfi “mi” kún ohun tí Gíríìkì kò sọ.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: ṣùgbọ́n ẹ fi ààyè sílẹ̀ fún ìbínú
  rationale: Ọ̀rọ̀ yìí mú àwòrán ‘fífún ní ààyè’ inú Gíríìkì wá sí Yorùbá àdánidá, kò sì fi ‘Ọlọ́run’ kún ὀργή ní pàtó.
- source_word: γέγραπται γάρ
  choice: nítorí a ti kọ ọ pé
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe déédéé fún gbólóhùn tí a fi ń tọ́ka sí Ìwé Mímọ́.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Tèmi ni ẹ̀san
  rationale: Ó pa ìtumọ̀ ohun-ìní inú dative náà mọ́, ó sì jẹ́ gbólóhùn kúkúrú, ọlọ́lá, tí Yorùbá lè lóye.
- source_word: ἐγὼ ἀνταποδώσω
  choice: èmi yóò san án padà
  rationale: Ó fi ìtẹnumọ́ ἐγώ hàn, ‘san án padà’ sì bá ọ̀rọ̀ ìdájọ́ àti ìsanpadà mu.
- source_word: λέγει κύριος
  choice: ni Olúwa wí
  rationale: Ó jẹ́ àgbékalẹ̀ Yorùbá ọlọ́lá fún ọ̀rọ̀ ìtọ́kasí yìí, ó sì tú κύριος sí ‘Olúwa.’
theological_decisions:
- issue: Ohun tí τῇ ὀργῇ ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘ìbínú’ nínú ẹsẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka sí ìbínú Ọlọ́run.
  alternative: Kí a sọ ní tààrà pé ‘ìbínú Ọlọ́run,’ tàbí kí a ka á sí ìbínú ènìyàn lápapọ̀.
  rationale: Àyọlò tó tẹ̀ lé e fi ẹ̀san sí ọwọ́ Olúwa, nítorí náà ìbínú Ọlọ́run ni ó ṣeé ṣe jù; síbẹ̀ Gíríìkì kò sọ ‘Ọlọ́run’ ní gbangba, nítorí náà a kò yanjú àìdánilójú náà nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye lónìí ni a lò. Àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ’ bá àpèjúwe ọ̀pọ̀ ἀγαπητοί mu; a sì pa kíkuru àti ìfọkànsìn àyọlò Ìwé Mímọ́ mọ́.
