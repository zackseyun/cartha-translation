id: ROM.12.2
reference: Romans 12:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: yo
  text: Ẹ má sì ṣe fara wé ìgbà ayé yìí[a], ṣùgbọ́n ẹ jẹ́ kí a yí yín padà nípa ìtúntunṣe èrò inú yín, kí ẹ lè fòye mọ̀ ohun tí ìfẹ́ Ọlọ́run jẹ́—èyí tí ó dára, tí ó dùn mọ́ Ọlọ́run[c], tí ó sì pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ìgbà yìí” tàbí “ètò ayé ìsinsìnyí.” Ọ̀rọ̀ Gíríìkì αἰών túmọ̀ sí “ìgbà” ní pàtàkì, ó sì ń tọ́ka sí àkókò tàbí ètò tó ń bẹ nísinsìnyí.'
    reason: lexical_alternative
  - marker: c
    text: “Tí ó dùn mọ́ Ọlọ́run” lè tún jẹ́ “tí ó ṣe ìtẹ́wọ́gbà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: ẹ má ṣe jẹ́ kí ayé ìsinsìnyí mú yín dà bí ara rẹ̀
  rationale: Èyí fi ìṣe àṣẹ ìkọ̀sílẹ̀ náà hàn, ó sì sọ ní Yorùbá àdánidá pé kí àwọn olùgbọ́ má ṣe gbà kí àkókò yìí tẹ̀ wọ́n sínú àwòrán tàbí ìlànà rẹ̀.
- source_word: αἰῶνι τούτῳ
  choice: ayé ìsinsìnyí
  rationale: Nínú Yorùbá, ‘ayé ìsinsìnyí’ lè tọ́ka sí ìgbà àti ètò ìwà tó ń ṣàkóso nísinsìnyí, kì í ṣe ayé ẹ̀dá lásán; àlàyé ìsàlẹ̀ ṣètìlẹ́yìn fún ìtumọ̀ náà.
- source_word: μεταμορφοῦσθε
  choice: ẹ jẹ́ kí a yí yín padà
  rationale: Ọ̀rọ̀ yìí pa agbára ìṣe ìgbàgbọ́/passive mọ́, ó sì fi ìyípadà jíjinlẹ̀ hàn ní ìtakora sí jíjẹ́ bí àwòrán ayé ìsinsìnyí.
- source_word: ἀνακαινώσει τοῦ νοός
  choice: nípa sísọ èrò inú yín di tuntun
  rationale: A tú dative náà gẹ́gẹ́ bí ohun èlò tàbí ọ̀nà ìyípadà; ‘èrò inú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún agbára ìrònú àti ìfòyemọ̀ ìwà tí νοῦς ń tọ́ka sí níbí.
- source_word: εἰς τὸ δοκιμάζειν
  choice: kí ẹ lè mọ̀ nípa dídánwò
  rationale: Èyí pa ète/àbájáde mọ́, ó sì gbìyànjú láti mú méjèèjì nínú ìtumọ̀ δοκιμάζω—dán wò àti dá ohun tó yẹ mọ̀—wọ inú ọ̀rọ̀ náà.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: ohun tí ìfẹ́ Ọlọ́run jẹ́
  rationale: Èyí pa ìbéèrè tí τί ń gbé kalẹ̀ àti genitive ‘Ọlọ́run’ mọ́ ní Yorùbá tó bójú mu.
- source_word: τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: èyí tí ó dára, tí ó dùn mọ́ ọn, tí ó sì pé
  rationale: Àwọn àpèjúwe mẹ́tẹ̀ẹ̀ta ni a fi sí apposition pẹ̀lú ìfẹ́ Ọlọ́run, bí Gíríìkì ṣe rí; ‘ó dùn mọ́ ọn’ jẹ́ kí ẹni tí inú rẹ̀ dùn, Ọlọ́run, hàn láì sọ ọ́ di gbolohun ẹ̀kọ́ ìgbàgbọ́ tó ju orísun lọ.
theological_decisions:
- issue: Ìtumọ̀ αἰών nínú ìtakora ìwà
  choice: ayé ìsinsìnyí
  alternative: ìgbà yìí; ètò ayé ìsinsìnyí
  rationale: Àṣàyàn yìí jẹ́ Yorùbá àdánidá tí ó lè gbé ìtumọ̀ àkókò àti ètò ìwà; àlàyé [a] dènà kí a má bà a ka sí ayé ẹ̀dá lásán.
- issue: Agbára δοκιμάζειν nípa ìfẹ́ Ọlọ́run
  choice: mọ̀ nípa dídánwò
  alternative: fòye mọ̀; dán wò kí ẹ sì fọwọ́ sí i
  rationale: A kò fi ènìyàn ṣe onídàájọ́ lórí ìfẹ́ Ọlọ́run; dídọtun èrò inú mú kí wọ́n dán ohun wò, kí wọ́n sì dá ohun tí ó jẹ́ ìfẹ́ rẹ̀ mọ̀. Àlàyé [b] pa àìṣedédé lexical náà mọ́.
- issue: Ẹni tí εὐάρεστον dùn mọ́
  choice: tí ó dùn mọ́ ọn
  alternative: tí ó ṣe ìtẹ́wọ́gbà
  rationale: Ọ̀rọ̀ arọ́pò ‘ọn’ tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀, ṣùgbọ́n àlàyé [c] jẹ́wọ́ pé Gíríìkì kò tún ẹni náà sọ ní kedere, ‘ṣe ìtẹ́wọ́gbà’ sì tún ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì lo àṣẹ ọ̀pọ̀ ènìyàn ‘ẹ’. A yàgò fún èdè ìjọ kan pàtó, a sì pa ìtakora láàárín mímú ènìyàn dà bí ayé àti yíyípadà inú mọ́.
