  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: yo
  text: Nínú ìfẹ́ ará, ẹ máa ní ìfẹ́ ọkàn sí ara yín; ní fífi ọlá fún ara yín, ẹ máa ṣáájú ara yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: ìfẹ́ ará
  rationale: Ó túmọ̀ sí ìfẹ́ tí ó wà láàárín àwọn ará; nínú àyíká yìí, ó ń tọ́ka sí ìfẹ́ láàárín àwọn onígbàgbọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: φιλόστοργοι
  choice: ẹ máa fi ìfẹ́ ọkàn hàn
  rationale: Ọ̀rọ̀ náà ń sọ nípa ìfẹ́ oníjẹ̀lẹ́ńkẹ́ bí ti àwọn ẹbí. Ìtumọ̀ yìí jẹ́ adayeba ní Yorùbá, ó sì pa àwọ̀ ìfẹ́ tí ó jinlẹ̀ mọ́.
- source_word: προηγούμενοι
  choice: ẹ máa ṣáájú ara yín
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí jíjẹ́ ẹni tí ó ń ṣáájú tàbí mú ipò iwájú nínú fífi ọlá fún ẹlòmíràn. Yíyan ‘ṣáájú’ pa àwòrán ìdíje rere inú ọ̀rọ̀ náà mọ́ láìsọ ọ́ di fífi ẹnì kejì síwájú lásán.
- source_word: τιμῇ
  choice: nínú fífi ọlá fúnni
  rationale: Ó ṣàfihàn ọlá gẹ́gẹ́ bí ohun tí a ń fi fún ẹlòmíràn, èyí sì bá ìṣe tí gbolohun náà ń pàṣẹ mu.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ προηγούμενοι
  choice: ẹ máa ṣáájú ara yín
  alternative: ẹ máa fi ara yín sílẹ̀ fún ara yín / ẹ máa ka ara yín sí ẹni tí ó yẹ ní ọlá jù
  rationale: A kò yan ìtumọ̀ tí yóò sọ pé kí ẹni kan máa tẹrí ba fún ẹlòmíràn nìkan, nítorí προηγούμενοι ní agbára ìtumọ̀ ‘ṣáájú’ tàbí ‘ju ara yín lọ’ nínú ọlá. Ìtumọ̀ yìí pa ìṣòro àti ìmúrasílẹ̀ ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ adayeba, ọlọ́lá, ó sì lo ọ̀nà àṣẹ onítẹ̀síwájú ‘ẹ máa…’ fún ìwà tí ó yẹ kí ó máa bá a lọ.
