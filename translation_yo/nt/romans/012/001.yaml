id: ROM.12.1
reference: Romans 12:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: yo
  text: Nítorí náà, mo rọ̀ yín, ẹ̀yin ará[a], nípa àwọn àánú Ọlọ́run, pé kí ẹ fi ara yín fún un gẹ́gẹ́ bí ẹbọ alààyè, mímọ́, tí ó sì wu Ọlọ́run—èyí ni ìjọsìn yín tí ó bá ọgbọ́n mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì ní “ẹ̀yin arákùnrin”; ọ̀rọ̀ akọ yìí sábà máa ń jẹ́ ọ̀nà láti bá àwùjọ tí àwọn arákùnrin àti arábìnrin wà nínú rẹ̀ sọ̀rọ̀.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ìjọsìn yín ti ẹ̀mí” tàbí “iṣẹ́ ìsìn yín tí ó ní ìrònú.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ohun tí ó bá ọgbọ́n mu, tí ó yẹ, tàbí ti ẹ̀mí; “ìjọsìn” náà sì tún lè túmọ̀ sí iṣẹ́ ìsìn fún Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: mo rọ̀ yín
  rationale: Ó fi ìṣírí àti ẹ̀bẹ̀ líle Pọ́ọ̀lù hàn ní èdè Yorùbá àdánidá, láì sọ ọ́ di àṣẹ tààrà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú mọ́ pẹ̀lú àlàyé inú Róòmù 1–11.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ọmọ ìgbàgbọ́, kò sì fi akọ tàbí abo hàn ní pàtó; àlàyé ẹsẹ̀ ìsàlẹ̀ ṣàfihàn pé Gíríìkì lo fọ́ọ̀mù akọ tí ó lè kan àwùjọ adalu.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: nípa àwọn àánú Ọlọ́run
  rationale: Ó pa ọ̀pọ̀ iye οἰκτιρμῶν mọ́, ó sì jẹ́ kí διά dúró ní àárín ìtumọ̀ ọ̀nà àti ìpìlẹ̀ ẹ̀bẹ̀.
- source_word: παραστῆσαι
  choice: kí ẹ fi ara yín fún un
  rationale: Ó mú èrò fífi ohun kan sílẹ̀ fún Ọlọ́run hàn ní Yorùbá tó ṣe kedere, nígbà tí àwòrán ẹbọ inú gbólóhùn tó tẹ̀ lé pa ìtumọ̀ ìrúbọ mọ́.
- source_word: τὰ σώματα ὑμῶν
  choice: ara yín
  rationale: Ó pa ọ̀rọ̀ gidi “ara” mọ́ dípò fífi “ẹ̀yin fúnra yín” rọ́pò rẹ̀; Yorùbá kì í sábà fi àmì ọ̀pọ̀ sí “ara” ní irú àkópọ̀ yìí.
- source_word: θυσίαν ζῶσαν
  choice: gẹ́gẹ́ bí ẹbọ alààyè
  rationale: Ó pa àwòrán ìyàlẹ́nu ẹbọ tí ó wà láàyè mọ́.
- source_word: ἁγίαν
  choice: mímọ́
  rationale: Ọ̀rọ̀ ìsìn Yorùbá tó wọ́pọ̀ ni, ó sì lè túmọ̀ sí ohun tí a yà sọ́tọ̀ fún Ọlọ́run.
- source_word: εὐάρεστον τῷ θεῷ
  choice: tí ó sì wu Ọlọ́run
  rationale: Ó sọ ohun tí ó jẹ́ ìtẹ́wọ́gbà àti ìdùnnú fún Ọlọ́run ní ọ̀nà Yorùbá àdánidá, kì í ṣe ìtẹ́wọ́gbà kékeré lásán.
- source_word: λογικὴν
  choice: tí ó bá ọgbọ́n mu
  rationale: Ó ṣàfihàn ìtumọ̀ ohun tí ó ní ìdí, tí ó yẹ, tàbí tí ìrònú gbà, láì pinnu pé “ti ẹ̀mí” nìkan ni; àwọn ìtumọ̀ mìíràn wà nínú àlàyé.
- source_word: λατρείαν
  choice: ìjọsìn
  rationale: Ó sọ iṣẹ́ tí a ń ṣe sí Ọlọ́run di mímọ̀ fún olùkà Yorùbá, nígbà tí àwòrán ẹbọ tún pa ojú iṣẹ́ ìsìn rẹ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί fún àwùjọ tí ó ṣeé ṣe kí akọ àti abo wà nínú rẹ̀
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìbátan àwọn onígbàgbọ́, tí ó sì lè gba gbogbo àwùjọ; àlàyé [a] pa fọ́ọ̀mù akọ inú Gíríìkì àti ìlò aṣojú rẹ̀ mọ́ ní gbangba.
- issue: Ìtumọ̀ λογικὴν λατρείαν
  choice: ìjọsìn yín tí ó bá ọgbọ́n mu
  alternative: ìjọsìn yín ti ẹ̀mí; iṣẹ́ ìsìn yín tí ó ní ìrònú
  rationale: Gbólóhùn Gíríìkì ní àyè fún “tí ó ní ìdí/tí ó yẹ,” “ti ẹ̀mí,” àti “iṣẹ́ ìsìn.” Ọ̀rọ̀ àkọ́kọ́ yàn ìtumọ̀ tí kò fi ipa mú àríyànjiyàn náà, àlàyé [b] sì pa àwọn àṣàyàn pàtàkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, olóhùn kíkún níbi tí ó bá yẹ, pẹ̀lú ìforúkọsílẹ̀ ọlọ́wọ̀ àti ọ̀rọ̀ òde òní. A lo “fi ara yín fún un” gẹ́gẹ́ bí ọ̀nà àdánidá láti sọ ìfihàn ara fún Ọlọ́run; “gẹ́gẹ́ bí ẹbọ” pa àwòrán ìrúbọ mọ́. Gbólóhùn ikẹyìn ṣì pa àìdájú λογικός mọ́ nípasẹ̀ àlàyé [b].
