id: ROM.12.17
reference: Romans 12:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: yo
  text: Ẹ má ṣe fi ibi san ibi fún ẹnikẹ́ni; ẹ máa ronú ṣáájú nípa ohun tí ó dára[a] lójú gbogbo ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohun tí ó yẹ fún ọlá” tàbí “ohun ọlọ́lá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: fún ẹnikẹ́ni
  rationale: Ọ̀rọ̀ yìí wà ní dative gẹ́gẹ́ bí ẹni tí a lè san ohun kan fún; “fún ẹnikẹ́ni” bá ìlò Yorùbá mu, ó sì pa ìtumọ̀ pé kò sí ẹnikẹ́ni tí a yọ sílẹ̀ mọ́.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: fi ibi san ibi
  rationale: Àpólà Yorùbá yìí ṣàfihàn ìsanpadà tàbí ẹ̀san ibi pẹ̀lú ibi, ó sì pa agbára ìwà rere àti búburú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀποδιδόντες
  choice: Ẹ má ṣe … san
  rationale: Bí ó tilẹ̀ jẹ́ participle ní Gíríìkì, ó ń bá ìṣísẹ̀ ìkìlọ̀ inú àyíká ọ̀rọ̀ lọ. Ìlànà “Ẹ má ṣe” jẹ́ ọ̀nà àdánidá láti sọ agbára ìkìlọ̀ náà ní Yorùbá.
- source_word: προνοούμενοι
  choice: ẹ máa ronú ṣáájú nípa
  rationale: Èyí pa èrò ìgbèrò tàbí fífi ọkàn sí ohun kan ṣáájú mọ́, láì dín ọ̀rọ̀ náà kù sí pípèsè ohun ìní nìkan.
- source_word: καλὰ
  choice: ohun tí ó dára
  rationale: “Ohun tí ó dára” gbòòrò tó láti gba ìwà rere àti ohun tí ó yẹ ní ojú àwọn ènìyàn; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ “ọlọ́lá” mọ́.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: lójú gbogbo ènìyàn
  rationale: Àpólà yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún “ní ojú/níwájú gbogbo ènìyàn,” ó sì fi hàn pé ohun tí a ń ṣe fara hàn sí gbogbo ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ ìwà rere àti ọlá inú καλά ní àyíká gbangba
  choice: ohun tí ó dára
  alternative: ohun tí ó yẹ fún ọlá; ohun ọlọ́lá
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ohun rere nípa ìwà àti ohun tí àwọn ènìyàn ka sí ọlọ́lá. Àkọ́kọ́ ọrọ̀ lo èyí tó gbòòrò jù, àlàyé sì pa àwọn ìtumọ̀ mìíràn mọ́ láì sọ pé ìrísí níwájú ènìyàn nìkan ni Pọ́ọ̀lù ń tẹnumọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A lo “ẹ” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn tí Pọ́ọ̀lù ń bá sọ̀rọ̀, a sì fi àmì ohùn sí ibi tí ó bá èdè Yorùbá àfọwọ́kọ mu.
