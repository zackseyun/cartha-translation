  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: yo
  text: Ẹ yọ̀ ayọ̀ pẹ̀lú àwọn tí ń yọ̀ ayọ̀; ẹ sunkún pẹ̀lú àwọn tí ń sunkún.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: ẹ … yọ̀ ayọ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀-ìṣe àìnípè ní Gíríìkì, ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ nínú àwọn ìṣírí ọ̀wọ́ yìí. ‘Yọ̀ ayọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣeé lóye, tó sì fi ìmọ̀lára inú-dídùn hàn.
- source_word: μετὰ
  choice: ẹ bá …
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní ìwòye genitive, μετά túmọ̀ sí ìbákẹ́gbẹ́ tàbí kíkópa pẹ̀lú ẹlòmíràn. Àkópọ̀ ‘ẹ bá …’ ni Yorùbá adayeba fún ‘ṣe ohun kan pẹ̀lú wọn’.
- source_word: χαιρόντων
  choice: àwọn tí ń yọ̀
  rationale: Ó jẹ́ participle present active, plural, tí a lò bí ọ̀rọ̀-orúkọ. ‘Àwọn tí ń yọ̀’ pa ìtumọ̀ ẹgbẹ́ ènìyàn àti ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: κλαίειν
  choice: ẹ … sunkún
  rationale: Gẹ́gẹ́ bí χαίρειν, infinitive yìí ní agbára àṣẹ. ‘Sunkún’ bá κλαίω mu dáadáa, ó sì dá ìbànújẹ́ tí a ń fi ẹkún hàn mọ́ láì sọ ọ́ di ọ̀fọ̀ nìkan.
- source_word: κλαιόντων
  choice: àwọn tí ń sunkún
  rationale: Ó jẹ́ participle present active, plural, tí a lò bí ọ̀rọ̀-orúkọ. ‘Àwọn tí ń sunkún’ jẹ́ Yorùbá tó ṣe kedere, ó sì pa ìfarajọ́ gbolohun méjèèjì mọ́.
theological_decisions:
- issue: Agbára àṣẹ inú àwọn infinitive nínú àkójọ ìṣírí
  choice: 'Tú àwọn méjèèjì sí àṣẹ Yorùbá: ‘Ẹ bá …’'
  alternative: ‘Láti bá àwọn tí ń yọ̀ yọ̀ ayọ̀; láti bá àwọn tí ń sunkún sunkún.’
  rationale: Bí ó tilẹ̀ jẹ́ pé infinitive ni Gíríìkì lò, àyíká Róòmù 12:9–21 jẹ́ àkójọ ìṣírí àti àṣẹ. Fífi wọ́n hàn gẹ́gẹ́ bí àṣẹ mú iṣẹ́ wọn nínú ọ̀rọ̀ jáde ní Yorùbá adayeba láì fi ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. Ìtunṣe ‘ẹ bá …’ fi ìbákẹ́gbẹ́ μετά hàn ní ọ̀nà adayeba, nígbà tí àtúnṣe ọ̀rọ̀-ìṣe (‘yọ̀ ayọ̀’ àti ‘sunkún’) pa ìfarajọ́ Gíríìkì mọ́. A kò fi àlàyé ẹsẹ̀-àlàyé kún un nítorí yíyan ọ̀rọ̀ mìíràn ní Gẹ̀ẹ́sì (‘be glad’) kò mú ìyàtọ̀ pàtàkì kan wá tí ó nílò àmì [a] nínú Yorùbá.
