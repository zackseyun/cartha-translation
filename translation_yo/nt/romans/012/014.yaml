id: ROM.12.14
reference: Romans 12:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: yo
  text: Ẹ bùkún fún àwọn tó ń ṣe inúnibíni sí yín[a]; ẹ bùkún, ẹ má sì fi ègún bú wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn tó ń lépa yín.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘lépa,’ ṣùgbọ́n níbí ó ṣeé ṣe kí ó tọ́ka sí inúnibíni láti ọ̀dọ̀ àwọn ọ̀tá.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Ẹ máa súre fún
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni. ‘Súre fún’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì mú ìtumọ̀ sísọ tàbí fífẹ́ ohun rere fún ẹlòmíràn jáde. A tún un sọ gẹ́gẹ́ bí Pọ́ọ̀lù ṣe tún un sọ fún ìtẹnumọ́.
- source_word: τοὺς διώκοντας
  choice: àwọn tó ń ṣe inúnibíni sí yín
  rationale: Participle tí ó ní article yìí ń tọ́ka sí àwọn ẹni tó ń ṣe ìṣe náà. Bí ó tilẹ̀ jẹ́ pé διώκω tún lè túmọ̀ sí ‘lépa,’ àyíká ọ̀rọ̀ yìí ń tọ́ka sí ìṣe ọ̀tá àti inúnibíni. ‘Yín’ mú ẹni tí wọ́n ń ṣe inúnibíni sí hàn ní Yorùbá àdánidá.
- source_word: καὶ
  choice: ẹ máa súre, ẹ má sì
  rationale: Asopọ̀ náà so àṣẹ rere tí a tún sọ pọ̀ mọ́ ìfòfindè. Ìṣètò yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìyàtọ̀ láàárín sísúre àti bíbú mọ́.
- source_word: μὴ καταρᾶσθε
  choice: ẹ má sì ṣe bú wọn
  rationale: Ìfòfindè ni gbolohun Giriki náà. ‘Ẹ má sì ṣe bú wọn’ ṣe kedere ní Yorùbá òde òní, ó sì yàtọ̀ ní tààrà sí ‘ẹ máa súre.’ A fi ‘wọn’ kún un láti mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ διώκω nínú àyíká ọ̀rọ̀
  choice: Ṣe inúnibíni sí
  alternative: Lépa
  rationale: διώκω lè túmọ̀ sí ‘lépa,’ ṣùgbọ́n nínú àyíká ìtọ́ni ìwà rere Kristẹni yìí, ìlòdì ọ̀tá àti inúnibíni ló ṣeé ṣe jù. Àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ míì tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá àpéjọ tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, a sì pa àtúnsọ Pọ́ọ̀lù mọ́ fún ìtẹnumọ́.
