source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: yo
  text: Kí ìfẹ́ má ní àgàbàgebè.[a] Ẹ kórìíra ohun búburú; ẹ faramọ́ ohun rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ìfẹ́ jẹ́ tòótọ́.” Ní ti gidi, Gíríìkì náà ní, “Ìfẹ́ tí kò ní àgàbàgebè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá adayeba fún irú ìfẹ́ tí ἀγάπη ń tọ́ka sí níhìn-ín, ó sì pa agbára ìwà rere rẹ̀ mọ́.
- source_word: ἀνυπόκριτος
  choice: má ṣe jẹ́ ti àgàbàgebè
  rationale: Yíyan yìí ṣàfihàn ìtumọ̀ pé ìfẹ́ kò gbọ́dọ̀ jẹ́ ti ṣíṣe bí ẹni pé ó ní ohun tí kò sí lọ́kàn. A fi “kí ... má ṣe jẹ́” kún un láti sọ gbólóhùn aláìlọ́rọ̀-ìṣe Gíríìkì di ìkìlọ̀ adayeba ní Yorùbá.
- source_word: ἀποστυγοῦντες
  choice: ẹ kórìíra
  rationale: “Kórìíra” sọ ìríra líle sí ohun kan, ó sì bójú mu agbára ọ̀rọ̀ Gíríìkì. A tú participle náà sí àṣẹ nítorí ipa ìkìlọ̀ rẹ̀ nínú àyíká ọ̀rọ̀.
- source_word: τὸ πονηρόν
  choice: ohun búburú
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí ohun gbogbo tí ó burú, kì í ṣe ìṣe kan ṣoṣo.
- source_word: κολλώμενοι
  choice: ẹ rọ̀ mọ́
  rationale: “Rọ̀ mọ́” jẹ́ ọ̀nà Yorùbá adayeba láti sọ dídì mọ́ ohun kan pẹ̀lú ìfaramọ́ tímọ́tímọ́; a tún sọ ọ́ di àṣẹ ní ìbámu pẹ̀lú àyíká.
- source_word: τῷ ἀγαθῷ
  choice: ohun rere
  rationale: Ó pa ìtumọ̀ gbooro ti ohun tí ó dára mọ́, ó sì bá “ohun búburú” ṣe àfiwé ní kedere.
theological_decisions:
- issue: Agbára gbólóhùn aláìlọ́rọ̀-ìṣe àti àwọn participle nínú àyíká ìkìlọ̀
  choice: 'Túmọ̀ ẹsẹ náà sí àwọn ìkìlọ̀: “Kí ìfẹ́ ... Ẹ kórìíra ... ẹ rọ̀ mọ́ ...”'
  alternative: 'Ìtumọ̀ tí ó tẹ̀ lé ìrísí gírámà Gíríìkì gan-an: “Ìfẹ́ láìsí àgàbàgebè, ní kíkórìíra ohun búburú, ní rírọ̀ mọ́ ohun rere.”'
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì bẹ̀rẹ̀ pẹ̀lú gbólóhùn tí kò ní ọ̀rọ̀-ìṣe, tí ó sì tẹ̀ síwájú pẹ̀lú participle, Róòmù 12 jẹ́ ọ̀wọ́ àwọn ìkìlọ̀. Fífi agbára àṣẹ hàn ní Yorùbá ń sọ ète ọ̀rọ̀ náà di kedere láìyí ẹ̀kọ́ rẹ̀ padà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “àgàbàgebè” láti pa àwòrán ìwà àìṣòótọ́ inú ἀνυπόκριτος mọ́; àlàyé ìsàlẹ̀ fúnni ní ọ̀nà tí ó rọrùn sí i.
