id: ROM.6.19
reference: Romans 6:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: yo
  text: Mo ń sọ èyí ní ọ̀nà ènìyàn nítorí àìlera ara yín.[a] Nítorí, gẹ́gẹ́ bí ẹ ti fi àwọn ẹ̀yà ara yín fún àìmọ́ àti fún àìlófin gẹ́gẹ́ bí ẹrú, tí ó yọrí sí àìlófin, bẹ́ẹ̀ náà ni kí ẹ fi àwọn ẹ̀yà ara yín fún òdodo gẹ́gẹ́ bí ẹrú nísinsìnyí,[b] tí ó yọrí sí ìsọdimímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè lóye “ara” níhìn-ín ní ọ̀nà ìtumọ̀ sí i gẹ́gẹ́ bí “ìwà ẹ̀ṣẹ̀,” bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì gbòòrò ju bẹ́ẹ̀ lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Mo ń sọ̀rọ̀ lọ́nà ti ènìyàn
  rationale: Ó pa èrò pé Pọ́ọ̀lù ń sọ̀rọ̀ ní ọ̀nà tí ó bá òye ènìyàn mu mọ́, láì sọ ọ́ di àpèjúwe pàtó ju ohun tí Gíríìkì wí lọ.
- source_word: ἀσθένειαν
  choice: àìlera
  rationale: Ọ̀rọ̀ yìí gbòòrò tó láti ní ìtumọ̀ ailagbara tàbí àìlera ènìyàn, láì dín un kù sí ti ara tàbí ti ìwà nìkan.
- source_word: σάρξ
  choice: ẹran ara
  rationale: Ó pa gbòòrò ọ̀rọ̀ Gíríìkì mọ́ ju kí a túmọ̀ rẹ̀ ní tààrà sí “ìwà ẹ̀ṣẹ̀,” èyí tí yóò ti yan ìtumọ̀ ẹ̀kọ́ kan pàtó.
- source_word: παρεστήσατε / παραστήσατε
  choice: ẹ ti fi … sílẹ̀ / kí ẹ fi … sílẹ̀
  rationale: Àtúmọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa àsopọ̀ láàárín ìṣe wọn tẹ́lẹ̀ àti àṣẹ tí Pọ́ọ̀lù ń pa nísinsìnyí mọ́.
- source_word: μέλη
  choice: àwọn ẹ̀yà ara
  rationale: Ó ṣe kedere sí òǹkàwé òde òní, ó sì lè tọ́ka sí àwọn apá ara àti agbára tí ènìyàn fi ń ṣe ohun kan.
- source_word: δοῦλα
  choice: ẹrú
  rationale: “Ẹrú” pa líle àwòrán ìsìnrú àti jíjẹ́ ẹni tí ọ̀gá kan ń ṣàkóso mọ́ nínú Róòmù 6.
- source_word: ἀκαθαρσίᾳ
  choice: ìwà àìmọ́
  rationale: Ó sọ ìtumọ̀ ìwà búburú tàbí ìbàjẹ́ di mímọ̀ ní Yorùbá òde òní.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: ìwà àìlófin / ìwà àìlófin
  rationale: Àtúnṣe ọ̀rọ̀ kan náà pa àtúnwí àti ìtẹ̀síwájú láti inú ìwà àìlófin sí ìwà àìlófin sí i mọ́.
- source_word: εἰς τὴν ἀνομίαν
  choice: tí ó yọrí sí ìwà àìlófin
  rationale: Ó fi ìdarí tàbí àbájáde tí εἰς ní níhìn-ín hàn ní Yorùbá tí ó ṣe kedere.
- source_word: δικαιοσύνῃ
  choice: ìṣòdodo
  rationale: Ó bá ìyàtọ̀ tó wà láàárín ìwà àìmọ́, ìwà àìlófin, àti ìgbé ayé tó tọ́ mu; a fi “ìdájọ́ òdodo” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì.
- source_word: ἁγιασμόν
  choice: ìsọdimímọ́
  rationale: Ó fi ìlànà tàbí àbájáde jíjẹ́ mímọ́ hàn, èyí tó bá ìṣípò tí Pọ́ọ̀lù ń ṣàpèjúwe mu.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú gbólóhùn “àìlera ẹran ara yín”
  choice: ẹran ara
  alternative: ìwà ẹ̀ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ náà kan àìlera ènìyàn nínú ìwàláàyè ti ara tí ẹ̀ṣẹ̀ ti bà jẹ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò fi dandan mú ká dín ìtumọ̀ rẹ̀ kù sí “ìwà ẹ̀ṣẹ̀.”
- issue: Ìtumọ̀ δικαιοσύνη nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: ìṣòdodo
  alternative: ìdájọ́ òdodo
  rationale: Nínú ẹsẹ yìí, ìṣòdodo dúró gẹ́gẹ́ bí òdì kejì ìwà àìmọ́ àti ìwà àìlófin; síbẹ̀, a pa ìtumọ̀ tó lè jẹ́ ìdájọ́ òdodo mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti èyí tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá ṣe àdánidá. A pa àwòrán ìsìnrú, àtúnwí “ìwà àìlófin,” àti ìyàtọ̀ láàárín ìgbésí ayé àtijọ́ àti ìpè tuntun mọ́. Àwọn àmì àlàyé [a] àti [b] bá kókó tí wọ́n ń ṣàlàyé mu.
