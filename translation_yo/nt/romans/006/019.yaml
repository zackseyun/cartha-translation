  source_fidelity: 'Ìtumọ̀ náà ń pa ìtànkálẹ̀ àti ìlòdì sí ara wọn nínú ọ̀rọ̀ Gíríìkì mọ́: àìmọ́ àti àìlófin ń darí sí àìlófin, nígbà tí òdodo ń darí sí ìsọdimímọ́. Ṣùgbọ́n “fi ... sílẹ̀” túmọ̀ sí fí silẹ̀ tàbí kọ̀ sílẹ̀ ní Yorùbá ju kí ó túmọ̀ sí ‘fihàn/fi ara ẹni sábẹ́’ (παρίστημι); ó sì lè yi ìtumọ̀ àwòrán ìsìnrú padà. “Ẹran ara” tún kéré sí ìlò Yorùbá àdánidá fún σάρξ nínú gbolohun yìí.'
