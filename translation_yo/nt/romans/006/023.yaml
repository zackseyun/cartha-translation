id: ROM.6.23
reference: Romans 6:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: yo
  text: Nítorí owó iṣẹ́ ẹ̀ṣẹ̀ ni ikú, ṣùgbọ́n ẹ̀bùn[a] Ọlọ́run ni ìyè àìnípẹ̀kun nínú Mèsáyà Jésù[b] Olúwa wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀bùn oore-ọ̀fẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú Kristi Jésù.” “Kristi” àti “Mèsáyà” jẹ́ ọ̀nà méjì láti fi oyè kan náà hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: owó iṣẹ́
  rationale: Ó túmọ̀ sí ohun tí a san fún iṣẹ́; yíyan ‘owó iṣẹ́’ pa àfiwé ohun tí a jẹ nípasẹ̀ iṣẹ́ mọ́, ó sì yà á sọ́tọ̀ kedere sí ẹ̀bùn.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: A pa ìbátan gẹnitífù Gíríìkì mọ́ nínú gbólóhùn kúkúrú ‘owó iṣẹ́ ẹ̀ṣẹ̀,’ láì pinnu ju bó ṣe yẹ lọ bóyá ẹ̀ṣẹ̀ ni olùsan tàbí ohun tí owó náà jẹ mọ́.
- source_word: θάνατος
  choice: ikú
  rationale: Èyí ni ìtumọ̀ tààrà, ó sì pa agbára ọ̀rọ̀ náà mọ́ láì fi irú ikú kan pàtó kún un.
- source_word: χάρισμα
  choice: ẹ̀bùn
  rationale: ‘Ẹ̀bùn’ jẹ́ ọ̀rọ̀ àdánidá tí ó ṣe ìyàtọ̀ sí owó iṣẹ́; àlàyé ìtumọ̀ oore-ọ̀fẹ́ inú ọ̀rọ̀ Gíríìkì wà nínú àlàyé ìsàlẹ̀.
- source_word: ζωὴ αἰώνιος
  choice: ìyè àìnípẹ̀kun
  rationale: Gbólóhùn yìí sọ ìyè tí kò ní òpin ní ọ̀nà tí ó mọ́gbọ́n dání, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἐν
  choice: nínú
  rationale: ‘Nínú’ pa ìtumọ̀ ààyè tàbí ìṣọ̀kan pẹ̀lú Mèsáyà mọ́, dípò kí a dín un kù sí ohun èlò tàbí okùnfà nìkan.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: A túmọ̀ oyè Χριστός sí ‘Mèsáyà,’ kí ipa rẹ̀ gẹ́gẹ́ bí oyè ẹni àmì-òróró Ọlọ́run lè hàn gbangba.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: ‘Olúwa’ bá ìjẹ́wọ́ Kristẹni ìjímìjí mu, ó sì pa ìwọ̀n ẹ̀kọ́-ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Agbára ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  alternative: nípasẹ̀ Mèsáyà Jésù
  rationale: ‘Nínú’ pa àìdánilójú àti ìtẹnumọ́ Paulu lórí ààyè tàbí ìṣọ̀kan pẹ̀lú Mèsáyà mọ́; ‘nípasẹ̀’ yóò dín ọ̀rọ̀ náà kù sí ohun èlò tàbí okùnfà.
- issue: Ìtumọ̀ χάρισμα
  choice: ẹ̀bùn
  alternative: ẹ̀bùn oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ àkọ́kọ́ jẹ́ àdánidá, ó sì mú ìyàtọ̀ ẹ̀bùn sí owó iṣẹ́ hàn; àlàyé ìsàlẹ̀ pa ìtumọ̀ oore-ọ̀fẹ́ mọ́.
translation_notes:
  register: Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé navnav; a pa àfiwé owó iṣẹ́ sí ẹ̀bùn àti gbólóhùn Paulu ‘nínú Mèsáyà’ mọ́.
