id: ROM.6.13
reference: Romans 6:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: yo
  text: Ẹ má sì fi àwọn ẹ̀yà ara yín fún ẹ̀ṣẹ̀ gẹ́gẹ́ bí ohun ìjà[a] àìṣòdodo; ṣùgbọ́n ẹ fi ara yín fún Ọlọ́run gẹ́gẹ́ bí àwọn tí wọ́n wà láàyè láti inú àwọn òkú, kí ẹ sì fi àwọn ẹ̀yà ara yín fún Ọlọ́run gẹ́gẹ́ bí ohun ìjà òdodo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “irinṣẹ́”; bákan náà ní apá ìkẹyìn ẹsẹ yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: fi … fún
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí ènìyàn gbé ara rẹ̀ tàbí ẹ̀yà ara rẹ̀ kalẹ̀ sí ìkáwọ́ ẹlòmíràn; a tún un lò ní àwọn apá méjèèjì láti pa ìtakora Gíríìkì mọ́.
- source_word: μέλη
  choice: àwọn ẹ̀yà ara
  rationale: Ó ṣe kedere sí òǹkàwé Yorùbá òde òní, ó sì tọ́ka sí àwọn apá ara tí a ń lò nínú ìṣe.
- source_word: ὅπλα
  choice: ohun ìjà
  rationale: Ó pa àwòrán ogun inú ọ̀rọ̀ náà mọ́; ‘irinṣẹ́’ jẹ́ ìtumọ̀ míì tí ó ṣeé ṣe, a sì fi í sínú àlàyé ìsàlẹ̀.
- source_word: ἀδικίας
  choice: àìṣòdodo
  rationale: Ó bá ìtumọ̀ ìwà búburú àti ìdákẹ́gbẹ̀ẹ́ rẹ̀ pẹ̀lú ‘òdodo’ mu.
- source_word: ἁμαρτίᾳ
  choice: ẹ̀ṣẹ̀
  rationale: Ìtumọ̀ tààrà yìí jẹ́ kí àpèjúwe ẹ̀ṣẹ̀ bí ẹni tàbí agbára tí a lè fi ara fún dúró láìṣàlàyé rẹ̀ jù.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: gẹ́gẹ́ bí àwọn tí wọ́n wà láàyè láti inú àwọn òkú
  rationale: Ó pa agbára ìfiwéra ὡσεὶ àti ìtakora ikú sí ìyè mọ́, láìfi ọ̀rọ̀ ‘jí dìde’ kún un.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìtumọ̀ ìwà rere àti ìbáṣepọ̀ tó tọ́ ní àyíká Pọ́ọ̀lù; àṣàyàn tó tẹnu mọ́ justice wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtakora láàárín ẹ̀ṣẹ̀ àti Ọlọ́run gẹ́gẹ́ bí ẹni méjì tí ènìyàn lè fi ara rẹ̀ sí ìkáwọ́ wọn
  choice: A lò ‘fi … fún ẹ̀ṣẹ̀’ àti ‘fi … fún Ọlọ́run’ ní tààrà.
  alternative: Fi … ṣe iṣẹ́ ìránṣẹ́ fún ẹ̀ṣẹ̀ / Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì ti ní ìtumọ̀ ìfara-ẹni-jìn àti ìdarí sí ọ̀dọ̀ ẹni kan; a kò fi àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ náà kún un.
- issue: Ìtumọ̀ ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: gẹ́gẹ́ bí àwọn tí wọ́n wà láàyè láti inú àwọn òkú
  alternative: gẹ́gẹ́ bí àwọn tí a ti jí dìde kúrò nínú òkú
  rationale: Ìtumọ̀ tí a yàn pa ìfihàn tí ó ní ìbáṣepọ̀ pẹ̀lú àjíǹde mọ́, ṣùgbọ́n kò sọ ní pàtó pé a jí wọn dìde níbi tí Gíríìkì kò ti lo ọ̀rọ̀-ìṣe yẹn.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó níyì, tí ó sì yé òǹkàwé òde òní. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó yẹ. Àtúnṣe ‘kí ẹ sì fi’ mú ìbáṣepọ̀ gírámà apá ìkẹyìn ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
