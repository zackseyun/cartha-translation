id: ROM.6.21
reference: Romans 6:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: yo
  text: Nítorí náà, èso wo ni ẹ rí nígbà náà nínú àwọn ohun tí ojú ń tì yín báyìí? Nítorí òpin àwọn ohun wọ̀nyẹn ni ikú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àbájáde” dípò “òpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: wo
  rationale: 'Ó mú kí ìbéèrè àsọyé náà ṣe kedere ní Yorùbá: “èso wo,” láì fi ìtumọ̀ míì kún un.'
- source_word: καρπὸν
  choice: èso
  rationale: “Èso” pa àkàwé Pọ́ọ̀lù mọ́, dípò yíyan ọ̀rọ̀ tí yóò túmọ̀ rẹ̀ sí àǹfààní tàbí àbájáde nìkan.
- source_word: εἴχετε
  choice: ẹ ní
  rationale: Ìsọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ipò wọn ní àkókò àtijọ́, tí “nígbà náà” sì mú àkókò náà hàn.
- source_word: τότε
  choice: nígbà náà
  rationale: Ó pa ìyàtọ̀ àkókò mọ́ láàárín ìgbà àtijọ́ àti “báyìí.”
- source_word: ἐφ’ οἷς
  choice: láti inú àwọn ohun tí
  rationale: Ó fi hàn pé èso náà jẹ́ ohun tí àwọn ìṣe wọn tẹ́lẹ̀ mú jáde, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: νῦν
  choice: báyìí
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó bá ìyàtọ̀ pẹ̀lú “nígbà náà” mu.
- source_word: ἐπαισχύνεσθε
  choice: ẹ ń tijú wọn
  rationale: Ó sọ ìmọ̀lára ìtìjú tó ní ìwọ̀n ìwà rere, kì í ṣe ìdójútì kékeré lásán.
- source_word: τέλος
  choice: òpin
  rationale: “Òpin” pa ìtumọ̀ ibi tí ohun kan parí dé mọ́, ó sì tún lè tọ́ka sí àbájáde rẹ̀ nínú àyíká ọ̀rọ̀ náà.
- source_word: ἐκείνων
  choice: àwọn ohun náà
  rationale: Ó tọ́ka padà sí àwọn ohun tí wọ́n ń tijú, láì mú ìtọ́kasí tuntun wọlé.
- source_word: θάνατος
  choice: ikú
  rationale: Èyí ni ìtumọ̀ tààrà àti ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìwọ̀n ìkìlọ̀ Pọ́ọ̀lù mọ́.
theological_decisions:
- issue: Bóyá a ó tú τέλος sí “òpin” tàbí kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí “àbájáde”
  choice: òpin
  alternative: àbájáde
  rationale: '“Òpin” pa àìdánilójú tó wà nínú ọ̀rọ̀ Gíríìkì mọ́: ó lè jẹ́ ibi tí ìgbésí ayé náà parí sí àti ohun tí ó mú jáde. Àkọ́lé ìsàlẹ̀ fúnni ní àṣàyàn “àbájáde” láì yanju ẹ̀dọ̀fu náà ní ìkọ̀kọ̀.'
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, “ẹ ń tijú wọn” sì jẹ́ gbólóhùn àdánidá ju títẹ̀lé ìṣètò Gíríìkì lẹ́yọ-ọ̀rọ̀ lọ.
