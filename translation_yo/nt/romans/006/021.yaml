revisions:
- from: Nítorí náà, èso wo ni ẹ ní nígbà náà láti inú àwọn ohun tí ẹ ń tijú wọn báyìí? Nítorí òpin àwọn ohun náà ni ikú.[a]
  to: Nítorí náà, èso wo ni ẹ rí nígbà náà nínú àwọn ohun tí ojú ń tì yín báyìí? Nítorí òpin àwọn ohun wọ̀nyẹn ni ikú.[a]
  rationale: The revision retains the source text’s rhetorical structure and key lexical choices while using more natural Yoruba for the result formerly obtained and for present shame. “Òpin” is retained because it preserves the source term’s sense of both termination and outcome; the footnote supplies “àbájáde” as a legitimate alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the rhetorical question, the then/now contrast, the fruit metaphor, and the statement that the end is death. However, “ẹ ń tijú wọn” is not the most natural way to express being ashamed of the preceding things in this context, and “ní” is less idiomatic than “rí” for the fruit/result one received or experienced.
  naturalness: A small revision gives more idiomatic Standard Yoruba while retaining the Greek imagery and rhetorical force. “Tí ojú ń tì yín báyìí” naturally conveys “of which you are now ashamed,” without adding interpretive content.
  terminology: “Èso,” “òpin,” and “ikú” are appropriate and preserve the source’s metaphor, terminus/result ambiguity, and theological weight. The lexical-alternative footnote for “òpin” remains suitable.
  issues:
  - severity: medium
    issue: The expression “ẹ ń tijú wọn” is awkward in this clause.
    rationale: Although understandable, it is less natural here than an idiomatic Yoruba construction for present shame. “Tí ojú ń tì yín báyìí” clearly refers back to the former things and conveys the present state expressed by ἐπαισχύνεσθε.
  - severity: low
    issue: “Èso wo ni ẹ ní” is less idiomatic than “Èso wo ni ẹ rí” in a question about the result of former conduct.
    rationale: The Greek imperfect εἴχετε can be rendered with a natural Yoruba verb of receiving/obtaining in this rhetorical context, while “nígbà náà” retains the past-time reference.
  revised_text: Nítorí náà, èso wo ni ẹ rí nígbà náà nínú àwọn ohun tí ojú ń tì yín báyìí? Nítorí òpin àwọn ohun wọ̀nyẹn ni ikú.[a]
  revised_footnotes:
