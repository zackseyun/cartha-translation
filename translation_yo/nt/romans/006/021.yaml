    text: Tàbí “àbájáde” dípò “òpin.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source text’s rhetorical structure and key lexical choices while using more natural Yoruba for the result formerly obtained and for present shame. “Òpin” is retained because it preserves the source term’s sense of both termination and outcome; the footnote supplies “àbájáde” as a legitimate alternative.
