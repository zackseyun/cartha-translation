id: ROM.6.11
reference: Romans 6:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni, ẹ̀yin náà, ẹ ka[a] ara yín sí òkú fún ẹ̀ṣẹ̀, ṣùgbọ́n sí alààyè[b] fún Ọlọ́run nínú Mèsáyà Jésù.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ka ara yín sí” tàbí “gbọ́dọ̀ ka ara yín sí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ń gbé fún Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì ní, “nínú Kristi Jésù”; “Mèsáyà” ni ìtumọ̀ oyè Χριστός.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni ... pẹ̀lú
  rationale: Ó pa ìsopọ̀ ìparí-ọ̀rọ̀ mọ́ pẹ̀lú ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: λογίζεσθε
  choice: máa ka ... sí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí túmọ̀ sí kí wọ́n máa wo ohun náà gẹ́gẹ́ bí òtítọ́ tàbí kí wọ́n máa kà á bẹ́ẹ̀; ó tún pa agbára àṣẹ ìsinsìnyí nínú Gíríìkì mọ́.
- source_word: ἑαυτοὺς
  choice: ara yín
  rationale: A pa arọ́pò-orúkọ afarahẹ̀ tí Gíríìkì sọ ní kedere mọ́.
- source_word: εἶναι
  choice: sí ẹni tí ó
  rationale: Ìkọ́lé Yorùbá yìí fi ipò tí a ní kí wọ́n ka ara wọn sí hàn, bí infinitive Gíríìkì ṣe ń ṣe.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: ẹni tí ó ti kú sí ẹ̀ṣẹ̀
  rationale: Ó pa àjọṣe dative mọ́ láì sọ ọ́ di pé wọ́n kan ṣíwọ́ ẹ̀ṣẹ̀; ‘ṣùgbọ́n’ nínú abala kejì gbé ìyàtọ̀ μέν ... δέ jáde.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: ṣùgbọ́n tí ó wà láàyè sí Ọlọ́run
  rationale: ‘Wà láàyè’ bá ‘kú’ yàtọ̀ ní kedere, ‘sí Ọlọ́run’ sì pa àjọṣe dative náà mọ́ láì túmọ̀ rẹ̀ ju ohun tí orísun sọ lọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: ‘Nínú’ pa èdè Pọ́ọ̀lù nípa ìṣọ̀kan tàbí ààyè ìwà mọ́; ‘Mèsáyà’ túmọ̀ Χριστός gẹ́gẹ́ bí oyè.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστῷ gẹ́gẹ́ bí oyè tàbí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ṣì ní agbára oyè rẹ̀, nítorí náà ‘Mèsáyà’ mú ìtumọ̀ náà jáde dípò kí ó dà bí orúkọ lásán.
- issue: Agbára ἐν nínú ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  alternative: nípasẹ̀ Mèsáyà Jésù; nítorí Mèsáyà Jésù
  rationale: A pa ‘nínú’ mọ́ kí a má bàa pinnu pé ohun èlò tàbí okùnfà nìkan ni àjọṣe náà; èyí pa àìdánilójú àti ìjinlẹ̀ èdè Pọ́ọ̀lù mọ́.
- issue: Ìtumọ̀ dative nínú τῇ ἁμαρτίᾳ àti τῷ θεῷ
  choice: sí ẹ̀ṣẹ̀ ... sí Ọlọ́run
  alternative: ní ti ẹ̀ṣẹ̀ ... ní ti Ọlọ́run; fún Ọlọ́run
  rationale: Ìṣọ̀kan ‘sí ... sí ...’ pa ìfarawé àwọn abala méjèèjì àti ìdíje wọn mọ́, kò sì yí abala kejì padà sí ète ìwà nìkan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́wọ̀, tí ó ṣeé lóye fún gbogbo ènìyàn. Ìkọ́lé ‘kí ... máa ka’ mú àṣẹ tí ń bá a lọ jáde; ‘kú sí ẹ̀ṣẹ̀’ àti ‘wà láàyè sí Ọlọ́run’ pa ìdíje àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú Gíríìkì mọ́ láì ṣàlàyé rẹ̀ ju bó ṣe wà lọ.
