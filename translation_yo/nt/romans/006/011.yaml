  source_fidelity: Ìtumọ̀ náà ń pa ìsopọ̀ οὕτως καὶ, ìfẹ̀hàn ara ẹni ἑαυτούς, ìyàtọ̀ νεκρούς μέν ... ζῶντας δέ, àti ‘nínú Mèsáyà Jésù’ mọ́. Ṣùgbọ́n ‘kí ... máa ka’ fi ìtumọ̀ ìṣe àṣà/tí ń bá a lọ kún àṣẹ λογίζεσθε, ‘ẹni tí ó ti kú’ sì yí àpèjúwe ‘òkú’ padà sí ìṣẹ̀lẹ̀ ikú tí ó ti ṣẹlẹ̀, ó sì fa ìṣòro ẹyọ-ọ̀kan nínú ìtọ́kasí sí ẹgbẹ́ ‘ẹ̀yin.’
  naturalness: ‘Bẹ́ẹ̀ náà ni, ẹ̀yin náà, ẹ ka ara yín sí òkú ... ṣùgbọ́n sí alààyè ...’ jẹ́ Yorùbá ìgbàlódé, ó sì jẹ́ kedere. Ìlò ‘òkú’ àti ‘alààyè’ jẹ́ ìdíje tó ṣókì tí ó bá ìṣọ̀kan ọ̀rọ̀ Gíríìkì mu dáadáa.
  terminology: ‘ẹ̀ṣẹ̀,’ ‘Ọlọ́run,’ àti ‘Mèsáyà Jésù’ yẹ. ‘Nínú’ tọ́ka sí ἐν láì sọ àjọṣe Pọ́ọ̀lù di ohun èlò tàbí okùnfà. ‘Sí’ nínú ‘òkú sí ẹ̀ṣẹ̀ ... alààyè sí Ọlọ́run’ dá ìbáṣepọ̀ dative méjèèjì dúró, ó sì pa ìfarawé wọn mọ́.
