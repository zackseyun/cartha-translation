  - severity: medium
    issue: ‘sí ẹni tí ó ti kú ... tí ó wà láàyè’
    rationale: 'Νεκρούς àti ζῶντας jẹ́ àwọn àpèjúwe ìpò tó ń ṣe ìdíje: ‘dead ... alive.’ ‘Ẹni tí ó ti kú’ ń tẹnumọ́ ìṣẹ̀lẹ̀ ikú, ‘ẹni’ sì jẹ́ ẹyọ-ọ̀kan láàárín àṣẹ sí ẹgbẹ́. ‘Òkú ... alààyè’ dá ipò náà àti ìdíje náà dúró.'
