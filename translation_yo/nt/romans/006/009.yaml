source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: yo
  text: ní mímọ̀ pé Mèsáyà[a] tí a ti jí i dìde kúrò láàárín àwọn òkú kò tún kú mọ́; ikú kò tún ń jọba lórí rẹ̀ mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: ní mímọ̀ pé
  rationale: Ó pa ìrísí ọ̀rọ̀-àpólà aláìlẹ́ni mọ́, ó sì so gbólóhùn náà mọ́ ìjiyàn tó ṣáájú láì fi ipa ìsopọ̀ kan pàtó kún un.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè tó túmọ̀ sí ẹni àmì-òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: ἐγερθεὶς
  choice: nígbà tí a ti jí i dìde
  rationale: Ìtumọ̀ yìí fi ohùn àfaradà àti pé ìjíǹde náà ti ṣẹlẹ̀ ṣáájú hàn ní Yorùbá àdánidá.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó fi ìtumọ̀ orísun náà hàn pé a jí i dìde kúrò nínú àwùjọ àwọn tó ti kú.
- source_word: οὐκέτι
  choice: kì í ... mọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí ń fi hàn pé ohun náà kò tún ṣẹlẹ̀ mọ́; a lò ó fún ìṣẹ̀lẹ̀ méjèèjì.
- source_word: ἀποθνῄσκει
  choice: kú
  rationale: Pẹ̀lú “kì í ... mọ́,” ó sọ òtítọ́ tó ń bá a lọ pé Mèsáyà kò tún wà lábẹ́ ikú.
- source_word: θάνατος
  choice: ikú
  rationale: A túmọ̀ orúkọ náà tààrà, a sì pa àkàwé Pọ́ọ̀lù mọ́ níbi tí ikú ti dà bí ẹni tó ń ṣàkóso.
- source_word: κυριεύει
  choice: ṣe olúwa lórí
  rationale: Ó pa àwòrán ìjẹ́-olúwa àti agbára ìṣàkóso inú ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ní agbára oyè níbí, nítorí náà “Mèsáyà” mú ìtumọ̀ ẹni àmì-òróró jáde; àlàyé ìsàlẹ̀ jẹ́ kí àṣàyàn “Kristi” tún hàn láì pa ìyàtọ̀ náà rẹ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọlọ́wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa ìtẹnumọ́ méjì ti οὐκέτι mọ́, àti àkàwé ikú gẹ́gẹ́ bí olúwa.
