id: ROM.6.14
reference: Romans 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: yo
  text: Nítorí ẹ̀ṣẹ̀ kì yóò ṣàkóso yín,[a] nítorí ẹ̀yin kò wà lábẹ́ òfin,[b] bí kò ṣe lábẹ́ oore-ọ̀fẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì yóò jẹ ọba lórí yín” tàbí “kì yóò ní ìjọba lórí yín.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “lábẹ́ òfin”; èyí jẹ́ ọ̀nà-ìsọ̀rọ̀ tí ó lè tọ́ka sí wíwà lábẹ́ àṣẹ tàbí ètò òfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ‘sin’ ni ‘ẹ̀ṣẹ̀.’ Bí ó tilẹ̀ jẹ́ pé ẹsẹ yìí fi ẹ̀ṣẹ̀ hàn bí agbára tí ń ṣàkóso, a kò fi àmì tàbí ọ̀rọ̀ míì kún un tí Gíríìkì kò béèrè.
- source_word: κυριεύσει
  choice: kì yóò jẹ ọba lórí yín
  rationale: Gbólóhùn yìí mú èrò ṣíṣe olúwa tàbí lílo agbára ìṣàkóso jáde, ó sì pa àwòrán ẹ̀ṣẹ̀ gẹ́gẹ́ bí alákòóso mọ́ ní Yorùbá àdánidá.
- source_word: ὑπὸ νόμον
  choice: lábẹ́ òfin
  rationale: Ó pa àkàwé ibi-tàbí-àṣẹ ‘lábẹ́’ mọ́, ó sì lè túmọ̀ sí wíwà lábẹ́ agbára tàbí ètò òfin láìfi ìtumọ̀ ìjọ kan lé e lórí.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ ni ọ̀rọ̀ Yorùbá tó fìdí múlẹ̀ fún χάρις nínú ọ̀rọ̀ Páùlù, ó sì dáàbò bo ìyàtọ̀ tó wà láàárín òfin àti oore-ọ̀fẹ́.
- source_word: γὰρ … γάρ
  choice: Nítorí … nítorí
  rationale: Àwọn ìfarahàn méjèèjì ní agbára ìṣàlàyé. Lílo ‘nítorí’ ní ìbẹ̀rẹ̀ so ẹsẹ náà mọ́ èrò tó ṣáájú, èkejì sì fi ìdí gbólóhùn àkọ́kọ́ múlẹ̀.
theological_decisions:
- issue: Bóyá kí a mú jíjẹ́ ẹni ẹ̀ṣẹ̀ hàn gbangba sí i
  choice: Lo ‘ẹ̀ṣẹ̀ kì yóò jẹ ọba lórí yín’ láìsọ ‘ẹ̀ṣẹ̀’ di orúkọ ẹni tàbí fi akọ́lé pàtàkì sí i.
  alternative: ‘Ẹ̀ṣẹ̀ kì yóò ṣàkóso yín’ tàbí ‘ẹ̀ṣẹ̀ kì yóò jẹ olúwa yín.’
  rationale: Gíríìkì fi ẹ̀ṣẹ̀ hàn bí agbára alákòóso, ṣùgbọ́n kò béèrè pé kí a sọ ọ́ di ẹni tàbí kí a fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ìtumọ̀ ὑπὸ νόμον
  choice: Pa a mọ́ gẹ́gẹ́ bí ‘lábẹ́ òfin.’
  alternative: ‘Lábẹ́ àṣẹ òfin’ tàbí ‘lábẹ́ ètò òfin.’
  rationale: Àyípadà tààrà yìí pa àìdánilójú àti ìwọ̀n ọ̀rọ̀ Páùlù mọ́; àfikún ‘àṣẹ’ tàbí ‘ètò’ lè túmọ̀ àkàwé náà ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. A yan ‘jẹ ọba lórí’ láti pa àwòrán κυριεύσει mọ́, láìlo èdè àtijọ́ tàbí èdè ẹ̀kọ́ ìjọ kan.
