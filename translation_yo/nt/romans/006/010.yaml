  source_fidelity: 'Àwọn ìpín pàtàkì ti ẹsẹ̀ náà wà nínú ìtumọ̀ náà: γάρ jẹ́ “Nítorí,” ìṣe ikú tí ó ṣẹlẹ̀ lẹ́ẹ̀kan ṣoṣo ni ἐφάπαξ, ìbáṣepọ̀ náà sì jẹ́ sí ẹ̀ṣẹ̀ àti fún Ọlọ́run. Síbẹ̀, “ìyè tí ó wà láàyè, ó wà láàyè sí Ọlọ́run” kì í ṣojú ὃ δὲ ζῇ, ζῇ τῷ θεῷ dáadáa ní Yorùbá; ó tún ìtumọ̀ “wà láàyè” ṣe lọ́nà tí kò dára, “sí Ọlọ́run” sì kì í jẹ́ àṣàyàn tí ó rọrùn jù fún ìgbé ayé tí a darí sí Ọlọ́run.'
  naturalness: 'A tún ìpín ìyè náà ṣe sí ìkọ̀lé Yorùbá ìtẹ́wọ́gbà: “ìyè tí ó wà, ó wà fún Ọlọ́run.” A yọ “títí láé” kúrò, nítorí “lẹ́ẹ̀kan ṣoṣo” ti mú ἐφάπαξ jáde, nígbà tí “títí láé” lè fi ìtumọ̀ àfikún sí i.'
  terminology: “Ó kú sí ẹ̀ṣẹ̀” jẹ́ ọ̀nà tó yẹ láti pa ìtakora Paulu mọ́ pẹ̀lú “ó wà fún Ọlọ́run,” láì dámọ̀ràn pé Kristi ní ẹ̀ṣẹ̀ ti ara rẹ̀. “Ọlọ́run” jẹ́ ọ̀rọ̀ ìsìn tó bójú mu. Àlàyé ìsàlẹ̀ náà gbọdọ̀ tọ́ka sí ọ̀rọ̀ ìṣe “ó kú,” kì í ṣe sí “ikú tí ó kú” nìkan.
