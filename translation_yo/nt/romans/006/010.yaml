source:
  edition: SBLGNT
  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: yo
  text: Nítorí ikú tí ó kú[a], ó kú sí ẹ̀ṣẹ̀ lẹ́ẹ̀kan ṣoṣo; ṣùgbọ́n ìyè tí ó wà, ó wà fún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ó kú nítorí ẹ̀ṣẹ̀” tàbí “ó kú ní ti ẹ̀ṣẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: Nítorí ikú tí ó kú
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ὃ ṣiṣẹ́ pẹ̀lú ọ̀rọ̀-ìṣe tí a tún sọ láti tọ́ka sí ìṣẹ̀lẹ̀ ikú rẹ̀. Ìtumọ̀ yìí pa ìtẹnumọ́ àti ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá.
- source_word: τῇ ἁμαρτίᾳ
  choice: sí ẹ̀ṣẹ̀
  rationale: Dative náà ṣe àfihàn ìbáṣepọ̀ tàbí ìtọ́kasí. “Sí ẹ̀ṣẹ̀” pa ìtakora tó wà láàárín “sí ẹ̀ṣẹ̀” àti “sí Ọlọ́run” mọ́, láìsọ pé Kristi ní ẹ̀ṣẹ̀ tirẹ̀.
- source_word: ἐφάπαξ
  choice: lẹ́ẹ̀kan ṣoṣo títí láé
  rationale: Ó fi hàn pé ikú náà ṣẹlẹ̀ lẹ́ẹ̀kan ṣoṣo, kò sì ní tún ṣẹlẹ̀ mọ́, pẹ̀lú ìtumọ̀ tí ó dúró títí.
- source_word: ὃ δὲ ζῇ
  choice: ṣùgbọ́n ìyè tí ó wà láàyè
  rationale: Ìtumọ̀ yìí fara wé ìṣọ̀kan ìkọ̀lé apá àkọ́kọ́, ó sì sọ ìyàtọ̀ láàárín ikú àti ìyè di mímọ́ ní Yorùbá.
- source_word: τῷ θεῷ
  choice: sí Ọlọ́run
  rationale: “Sí Ọlọ́run” bá “sí ẹ̀ṣẹ̀” dọ́gba nínú ìkọ̀lé ẹsẹ náà, ó sì fi ìdarí àti ìbáṣepọ̀ ìyè rẹ̀ sí Ọlọ́run hàn.
theological_decisions:
- issue: Bóyá τῇ ἁμαρτίᾳ yẹ kí a túmọ̀ ní ọ̀nà tó lè dà bí ẹni pé Kristi ní ẹ̀ṣẹ̀ tirẹ̀.
  choice: sí ẹ̀ṣẹ̀
  alternative: nítorí ẹ̀ṣẹ̀; ní ti ẹ̀ṣẹ̀
  rationale: “Sí ẹ̀ṣẹ̀” pa ìtakora Paulu mọ́ láàárín ikú sí ẹ̀ṣẹ̀ àti ìyè sí Ọlọ́run. A kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ náà, a sì pa àìdánilójú gírámà rẹ̀ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa ìṣọ̀kan ọ̀rọ̀ nípa ikú àti ìyè mọ́, bí ó tilẹ̀ jẹ́ pé “ìyè tí ó wà láàyè” ní ìrísí lítíréṣọ̀ díẹ̀ láti tẹ̀ lé ìtẹnumọ́ orísun.
