id: ROM.6.6
reference: Romans 6:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: yo
  text: Níwọ̀n bí a ti mọ̀ èyí, pé a kàn ẹni àtijọ́ wa mọ́ àgbélébùú pẹ̀lú rẹ̀, kí ara ẹ̀ṣẹ̀ lè di aláìlágbára[a], kí a má ṣe jẹ́ ẹrú fún ẹ̀ṣẹ̀ mọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ara ẹ̀ṣẹ̀ di asán,” tàbí, “kí a mú ara ẹ̀ṣẹ̀ kúrò ní ipò iṣẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a má tún sin ẹ̀ṣẹ̀ mọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Ní mímọ èyí
  rationale: Ó pa ìtumọ̀ participle náà àti ìsopọ̀ rẹ̀ mọ́ ọ̀rọ̀ tó ṣáájú, láì sọ ọ́ di gbólóhùn ìdí ní kíkún.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: ẹni àtijọ́ wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti tọ́ka sí ẹni tí a jẹ́ tẹ́lẹ̀, ó sì pa àwòrán ẹni ènìyàn inú ọ̀rọ̀ Gíríìkì mọ́ láì mú kí ó dà bí ẹni pé akọ nìkan ni a ń sọ.
- source_word: συνεσταυρώθη
  choice: a kàn ... mọ́ àgbélébùú pọ̀ mọ́ ọn
  rationale: Ọ̀rọ̀ náà fi ìkànmọ́ àgbélébùú papọ̀ hàn; “pọ̀ mọ́ ọn” sì jẹ́ kí ìtumọ̀ συν- àti ìdàpọ̀ pẹ̀lú Kristi ṣe kedere.
- source_word: καταργηθῇ
  choice: lè di aláìlágbára
  rationale: Ó sọ pé a mú agbára iṣẹ́ rẹ̀ kúrò, láì fi dandan túmọ̀ ọ́ sí píparẹ́ tàbí ìparun pátápátá.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: ara ẹ̀ṣẹ̀
  rationale: Ó pa ìṣètò genitive tó ṣókùnkùn díẹ̀ mọ́, láì pinnu bóyá ara tí ẹ̀ṣẹ̀ ń ṣàkóso tàbí ara tó ní ìbáṣepọ̀ pẹ̀lú ẹ̀ṣẹ̀ ni Pọ́ọ̀lù ní lọ́kàn.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: kí a má bàa ṣe ẹrú fún ẹ̀ṣẹ̀ mọ́
  rationale: “Ṣe ẹrú fún” pa àwòrán ìsìn lábẹ́ ọ̀gá àti ìdè ẹrú inú δουλεύω mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ ènìyàn nínú ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: ẹni àtijọ́ wa
  alternative: ènìyàn àtijọ́ wa
  rationale: “Ẹni àtijọ́ wa” jẹ́ èdè Yorùbá àdánidá fún ipò ènìyàn wa tẹ́lẹ̀, ṣùgbọ́n kò yí i padà sí èrò aláìní àwòrán ẹni bí “ìwà àtijọ́.”
- issue: Agbára καταργηθῇ lórí ara ẹ̀ṣẹ̀
  choice: lè di aláìlágbára
  alternative: lè di asán tàbí kí a mú un kúrò
  rationale: Yíyan yìí fi bí agbára ìṣàkóso ẹ̀ṣẹ̀ ṣe di aláṣiṣẹ́ hàn, láì sọ ju orísun lọ pé ara náà ti parun pátápátá.
- issue: Ìtumọ̀ ìdè nínú δουλεύειν
  choice: ṣe ẹrú fún ẹ̀ṣẹ̀
  alternative: sìn ẹ̀ṣẹ̀
  rationale: Àwòrán ẹrú ni ọ̀rọ̀ Gíríìkì gbé jáde ní àyíká ìṣàkóso ẹ̀ṣẹ̀; “sìn” jẹ́ yíyan tó rọrùn sí i ṣùgbọ́n tó lè dín agbára àwòrán náà kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa àwòrán àgbélébùú, ara ẹ̀ṣẹ̀ àti ẹrú mọ́, nígbà tí a yẹra fún gbolohun tí kò wọ́pọ̀ nínú Yorùbá òde òní.
