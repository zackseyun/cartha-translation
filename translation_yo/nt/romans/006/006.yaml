revisions:
- from: Ní mímọ èyí, pé a kàn ẹni àtijọ́ wa mọ́ àgbélébùú pọ̀ mọ́ ọn, kí ara ẹ̀ṣẹ̀ lè di aláìlágbára[a], kí a má bàa ṣe ẹrú fún ẹ̀ṣẹ̀ mọ́[b].
  to: Níwọ̀n bí a ti mọ̀ èyí, pé a kàn ẹni àtijọ́ wa mọ́ àgbélébùú pẹ̀lú rẹ̀, kí ara ẹ̀ṣẹ̀ lè di aláìlágbára[a], kí a má ṣe jẹ́ ẹrú fún ẹ̀ṣẹ̀ mọ́[b].
  rationale: Àtúnṣe náà mú ọ̀rọ̀ náà rọrùn sí i nínú Yorùbá, ó ṣàlàyé ìtumọ̀ ‘pẹ̀lú rẹ̀’ nínú συνεσταυρώθη, ó sì mú gbolóhùn ìdí ìkẹyìn bá τοῦ μηκέτι δουλεύειν mu. A pa àìdánilójú ìbáṣepọ̀ nínú ‘ara ẹ̀ṣẹ̀’ mọ́, a kò sì fi ìtumọ̀ ẹ̀kọ́ kankan tí kò sí nínú orísun kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì ní pàtàkì: ó pa ìmọ̀ tí γινώσκοντες ń fi hàn, ìdàpọ̀ nínú συνεσταυρώθη, ‘ara ẹ̀ṣẹ̀,’ ìdí καταργηθῇ, àti àwòrán ìfẹ̀sùn-ẹrú nínú δουλεύειν mọ́. Síbẹ̀, ‘pọ̀ mọ́ ọn’ kò ṣàlàyé ẹni tí ọ̀rọ̀ arọ́pò náà ń tọ́ka sí dáadáa, ó sì kéré sí ‘pẹ̀lú rẹ̀’ nínú fífi συν- hàn. ‘Má bàa ṣe ẹrú’ tún jẹ́ ọ̀nà ìṣọ́ra/ìdènà díẹ̀, dípò àbájáde ìdí tí infinitive Gíríìkì ń sọ.'
  naturalness: ‘Ní mímọ̀ èyí’ jẹ́ èdè tí a lè lóye, ṣùgbọ́n ‘Níwọ̀n bí a ti mọ̀ èyí’ jẹ́ gbolóhùn Yorùbá òde òní tó rọrùn, tó sì pa ipa participle náà mọ́. ‘Jẹ́ ẹrú fún ẹ̀ṣẹ̀’ jẹ́ àdánidá ju ‘ṣe ẹrú fún ẹ̀ṣẹ̀’ lọ. Àmì ohùn nínú ‘mímọ̀’ tún yẹ kí ó pé.
  terminology: ‘Ẹni àtijọ́ wa,’ ‘ara ẹ̀ṣẹ̀,’ ‘aláìlágbára,’ àti ‘ẹrú’ jẹ́ àwọn ọ̀rọ̀ tó bá ìtumọ̀ àti ìforúkọsílẹ̀ ẹ̀kọ́ Pọ́ọ̀lù mu. ‘Kí a mú un kúrò’ nínú ẹsẹ̀ àlàyé a jẹ́ yíyan tó lágbára ju καταργηθῇ lọ, nítorí náà a yẹ kí a máa fi ‘di asán’/‘mú kúrò ní ipò iṣẹ́’ hàn gẹ́gẹ́ bí àwọn yíyan ìtúmọ̀, kì í ṣe ìparun tàbí yíyọ kúrò pátápátá.
  issues:
  - severity: medium
    issue: ‘pọ̀ mọ́ ọn’ nínú gbolóhùn ìkànmọ́ àgbélébùú
    rationale: Ó dùn bí ìfikún tí kò rọrùn, ‘ọ́n’ sì lè ní aṣojú tí kò ṣe kedere. ‘Pẹ̀lú rẹ̀’ ń ṣàfihàn συν- nínú συνεσταυρώθη ní kedere, ó sì tẹ̀lé ‘with him’ nínú ọ̀rọ̀ ìtọ́kasí.
  - severity: medium
    issue: ‘kí a má bàa ṣe ẹrú fún ẹ̀ṣẹ̀ mọ́’
    rationale: '‘Má bàa’ sábà máa ń ní ìrísí ìṣọ́ra tàbí ìdènà (‘kí ó má ṣẹlẹ̀’). Gíríìkì náà sọ àbájáde ìdí: kí a má tún wà lábẹ́ ẹrú ẹ̀ṣẹ̀. ‘Kí a má ṣe jẹ́ ẹrú fún ẹ̀ṣẹ̀ mọ́’ jẹ́ ọ̀nà tó péye àti àdánidá.'
  - severity: low
    issue: Àmì ohùn nínú ‘mímọ’
    rationale: Ọ̀rọ̀ orúkọ-iṣẹ́ náà yẹ kí ó jẹ́ ‘mímọ̀’ ní Yorùbá boṣewa.
  - severity: low
    issue: Ẹsẹ̀ àlàyé a ní ‘kí a mú un kúrò’
    rationale: Èyí lè fi ìparun tàbí yíyọ kúrò pátápátá hàn, nígbà tí καταργηθῇ ní àyíká yìí lè túmọ̀ sí mímú kí ohun kan má ṣiṣẹ́ tàbí di asán. A tún ọ́ ṣe kí ó má kọjá ìwọn orísun.
  revised_text: Níwọ̀n bí a ti mọ̀ èyí, pé a kàn ẹni àtijọ́ wa mọ́ àgbélébùú pẹ̀lú rẹ̀, kí ara ẹ̀ṣẹ̀ lè di aláìlágbára[a], kí a má ṣe jẹ́ ẹrú fún ẹ̀ṣẹ̀ mọ́[b].
