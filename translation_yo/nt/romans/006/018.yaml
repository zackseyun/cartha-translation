  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: yo
  text: Nígbà tí a dá yín sílẹ̀ kúrò nínú ẹ̀ṣẹ̀, a sọ yín di ẹrú òdodo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: nígbà tí a dá yín sílẹ̀
  rationale: Ó pa ìtumọ̀ àkókò tí participle aorist náà ní mọ́, ó sì fi ohùn àìṣe hàn pé àwọn tí a ń bá sọ gba ìdásílẹ̀ náà, wọn kò dá ara wọn sílẹ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Nínú ọ̀rọ̀ yìí, δέ so gbólóhùn náà mọ́ ìyàtọ̀ tó wà nínú ẹsẹ tó ṣáájú; “Ṣùgbọ́n” jẹ́ ọ̀nà àdánidá láti fi ìyípadà kékeré yìí hàn.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: kúrò lábẹ́ ẹ̀ṣẹ̀
  rationale: “Kúrò lábẹ́” mú ìtumọ̀ ìdásílẹ̀ kúrò nínú agbára tàbí ìṣàkóso ẹ̀ṣẹ̀ jáde, nígbà tí “ẹ̀ṣẹ̀” ṣì pa àìṣedéédé tó wà láàárín ohun àfojúrí àti agbára tí a sọ di ẹni mọ́.
- source_word: ἐδουλώθητε
  choice: a sọ yín di ẹrú
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive, ó sì túmọ̀ sí pé a mú wọn wá sínú ipò ẹrú. Ìtumọ̀ yìí kò rọ àwòrán líle ti oko-ẹrú tí Pọ́ọ̀lù lò.
- source_word: τῇ δικαιοσύνῃ
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún δικαιοσύνη, ó sì lè gbé ìtumọ̀ ìwà títọ́ àti ìdájọ́ tó tọ́ láìfi ẹ̀kọ́ ẹ̀sìn pàtó kan kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Bí a ṣe tú àwòrán δουλόω
  choice: a sọ yín di ẹrú òdodo
  alternative: ẹ di ìránṣẹ́ òdodo
  rationale: “Ẹrú” pa ìyípadà olúwa àti ìdè tó lágbára nínú àríyànjiyàn Róòmù 6 mọ́; “ìránṣẹ́” lè mú àwòrán náà rọ̀ ju ohun tí Gíríìkì sọ lọ.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” pa ìbú ìtumọ̀ Pọ́ọ̀lù mọ́, tó lè kan ìwà títọ́ àti ohun tó bá ìdájọ́ Ọlọ́run mu; a fi àṣàyàn tó tẹ̀ sí justice sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá àgbàlágba tó bójú mu, tó sì ṣe kedere fún òǹkàwé òde òní. A lo “a” gẹ́gẹ́ bí àmì ohùn àìṣe tí kò sọ ẹni tó ṣe iṣẹ́ náà, ní ìbámu pẹ̀lú àwọn ọ̀rọ̀-ìṣe passive méjèèjì nínú Gíríìkì. Àmì ohùn ni a fi sí ibi tó yẹ.
