  source_fidelity: Ìtumọ̀ náà pa ìtumọ̀ passive ti ἐλευθερωθέντες àti ἐδουλώθητε mọ́, ó sì lo “ẹrú” ní tòótọ́ fún àwòrán δουλόω. Síbẹ̀, “kúrò lábẹ́ ẹ̀ṣẹ̀” ṣàfikún àwòrán ìṣàkóso “lábẹ́” tí kò hàn gbangba nínú ἀπὸ τῆς ἁμαρτίας, níbi tí “kúrò nínú ẹ̀ṣẹ̀” ti tó láti fi “kúrò lọ́dọ̀/nínú ẹ̀ṣẹ̀” hàn. “Ṣùgbọ́n” lè ṣeé gbà fún δέ, bí ó tilẹ̀ jẹ́ pé ó lágbára díẹ̀ ju asopọ̀ onírẹ̀lẹ̀ náà lọ; “Nígbà tí” ń jẹ́ kí ìbáṣepọ̀ participle náà rọrùn nínú Yorùbá.
