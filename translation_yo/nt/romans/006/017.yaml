source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: yo
  text: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run pé, nígbà tí ẹ jẹ́ ẹrú ẹ̀ṣẹ̀ tẹ́lẹ̀, ẹ ṣègbọràn láti inú ọkàn sí àwòṣe ẹ̀kọ́[a] tí a fi yín lé àwòṣe ẹ̀kọ́ náà lọ́wọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrísí ẹ̀kọ́” tàbí “òṣùwọ̀n ẹ̀kọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, àwọn onígbàgbọ́ ni a fi lé àwòṣe ẹ̀kọ́ náà lọ́wọ́; kì í ṣe pé ẹ̀kọ́ náà ni a fi lé wọn lọ́wọ́.
    reason: source_imagery
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run
  rationale: Nínú gbólóhùn yìí, χάρις túmọ̀ sí fífi ọpẹ́ fún Ọlọ́run, kì í ṣe ‘oore-ọ̀fẹ́’ gẹ́gẹ́ bí ànímọ́ kan. ‘Ọpẹ́ ni fún Ọlọ́run’ jẹ́ ọ̀nà Yorùbá tó bójú mu fún ìdúpẹ́ Pọ́ọ̀lù.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: ẹrú ẹ̀ṣẹ̀
  rationale: ‘Ẹrú’ pa àwòrán ìdè, ìní àti àṣẹ ẹ̀ṣẹ̀ mọ́, èyí tó ṣe pàtàkì nínú ìyàtọ̀ tí Róòmù 6 ń fi hàn láàárín jíjẹ́ ẹrú ẹ̀ṣẹ̀ àti jíjẹ́ ẹrú òdodo.
- source_word: ὑπηκούσατε
  choice: ẹ̀yin sì ... ṣègbọràn
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí ṣíṣe ìgbọràn, kì í ṣe gbígbọ́ lásán. Fífi ‘sì’ sí i tún mú ìtakora δέ pẹ̀lú ipò wọn tẹ́lẹ̀ hàn.
- source_word: ἐκ καρδίας
  choice: fi tọkàntọkàn
  rationale: ‘Tọkàntọkàn’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó fi ìgbọràn inú ọkàn, òótọ́ àti àìṣèké hàn.
- source_word: τύπον διδαχῆς
  choice: àwòṣe ẹ̀kọ́
  rationale: ‘Àwòṣe’ lè dúró fún ìrísí, àpẹẹrẹ tàbí òṣùwọ̀n tí τύπος ní, nígbà tí ‘ẹ̀kọ́’ fi διδαχή hàn ní kedere.
- source_word: παρεδόθητε
  choice: tí a fi yín lé lọ́wọ́ rẹ̀
  rationale: 'Èyí pa ohùn àìṣe Greek mọ́: àwọn onígbàgbọ́ ni a fi lé àwòṣe ẹ̀kọ́ náà lọ́wọ́, kì í ṣe pé ẹ̀kọ́ náà nìkan ni a fi lé wọn lọ́wọ́.'
- source_word: εἰς ὃν
  choice: tí ... lé lọ́wọ́ rẹ̀
  rationale: Àrọ́pò ‘rẹ̀’ ń tọ́ka padà sí àwòṣe ẹ̀kọ́, ó sì fi ìdarí sí ohun tí a fà wọ́n lé lọ́wọ́ rẹ̀ hàn ní Yorùbá tó ṣeé lóye.
theological_decisions:
- issue: Bóyá kí δοῦλοι jẹ́ ‘ìránṣẹ́’ tàbí ‘ẹrú’
  choice: ẹrú ẹ̀ṣẹ̀
  alternative: ìránṣẹ́ ẹ̀ṣẹ̀
  rationale: Àyíká Róòmù 6 tẹnumọ́ ìdè àti ìṣàkóso. ‘Ẹrú’ pa agbára àwòrán náà mọ́ láì sọ ọ́ di pẹ̀lẹ́ ju ti orísun lọ.
- issue: Bóyá kí a yí ohun tí a fi lé ẹnìkan lọ́wọ́ padà
  choice: àwòṣe ẹ̀kọ́ tí a fi yín lé lọ́wọ́ rẹ̀
  alternative: ẹ̀kọ́ tí a fi lé yín lọ́wọ́
  rationale: Greek fi àwọn olùgbọ́ hàn gẹ́gẹ́ bí àwọn tí a fi lé ẹ̀kọ́ náà lọ́wọ́. Yíyí i padà sí ẹ̀kọ́ tí a fi lé wọn lọ́wọ́ yóò mú àwòrán àti ìtẹnumọ́ ọ̀rọ̀ náà kúrò.
- issue: Ìbáṣepọ̀ láàárín jíjẹ́ ẹrú ẹ̀ṣẹ̀ tẹ́lẹ̀ àti ìgbọràn
  choice: bí ó tilẹ̀ jẹ́ pé ... ẹ̀yin sì ... ṣègbọràn
  alternative: pé ẹ̀yin jẹ́ ẹrú ẹ̀ṣẹ̀, ṣùgbọ́n ẹ ṣègbọràn
  rationale: ὅτι bẹ̀rẹ̀ ohun tí Pọ́ọ̀lù dúpẹ́ fún, δέ kejì sì fi ìtakora hàn. ‘Bí ó tilẹ̀ jẹ́ pé’ mú kedere pé kì í ṣe jíjẹ́ ẹrú ẹ̀ṣẹ̀ ni ohun ìdúpẹ́, láì yí ìtumọ̀ àkọ́kọ́ padà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Tọkàntọkàn’ jẹ́ àdánidá ju títú ‘láti inú ọkàn’ lọ, nígbà tí ‘a fi yín lé lọ́wọ́ rẹ̀’ mọ́ àwòrán àìṣe alágbára ti Greek.
