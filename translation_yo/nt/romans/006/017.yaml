revisions:
- from: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run pé, bí ó tilẹ̀ jẹ́ pé ẹ̀yin ti jẹ́ ẹrú ẹ̀ṣẹ̀ rí, ẹ̀yin sì fi tọkàntọkàn ṣègbọràn sí àwòṣe ẹ̀kọ́[a] tí a fi yín lé lọ́wọ́ rẹ̀[b].
  to: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run pé, nígbà tí ẹ jẹ́ ẹrú ẹ̀ṣẹ̀ tẹ́lẹ̀, ẹ ṣègbọràn láti inú ọkàn sí àwòṣe ẹ̀kọ́[a] tí a fi yín lé àwòṣe ẹ̀kọ́ náà lọ́wọ́[b].
  rationale: A tún gbolohun náà ṣe kí ìdarí εἰς ὃν àti ohùn àìṣe παρεδόθητε hàn gbangba nínú Yorùbá. A tún lo ‘tẹ́lẹ̀’ fún ipò wọn àtijọ́, àti ‘láti inú ọkàn’ láti pa àwòrán orísun mọ́. Àwọn àkọsílẹ̀-ẹsẹ̀ méjèèjì wà níbi tí ó tọ́, wọ́n sì bá ìtumọ̀ mu.
