  source_fidelity: Ìtumọ̀ náà pa ìtakora νυνὶ δέ mọ́, ó sì fi hàn pé a dá wọn sílẹ̀ kúrò nínú agbára ẹ̀ṣẹ̀, a sì sọ wọ́n di ẹrú Ọlọ́run. Ó tún dá àtẹ̀lé καρπός—εἰς ἁγιασμόν—τέλος—ζωὴ αἰώνιος dúró. Síbẹ̀, “níwọ̀n bí” túmọ̀ sí ìdí/cause (“nítorí pé/since”), nígbà tí àwọn participle Gíríìkì ń ṣàpèjúwe ipò tí ó ti ṣẹlẹ̀, kì í ṣe ìdí tí ìjẹ́ èso náà fi wà. Àtúnṣe náà yọ ìbáṣepọ̀ ìdí tí kò sí nínú orísun kúrò.
  naturalness: Yorùbá ìbẹ̀rẹ̀ gbólóhùn àti àwòrán “sọ yín di ẹrú Ọlọ́run” jẹ́ àdánidá, ó sì ní ìwọ̀ntúnwọ̀nsì. Lílo “lẹ́yìn tí” fún àwọn ìṣe passive tí ó ti parí jẹ́ kedere, ó sì yẹ ní ọ̀rọ̀ Yorùbá òde òní nínú àyíká yìí.
  terminology: “Ẹ̀ṣẹ̀,” “ẹrú Ọlọ́run,” “èso,” “ìsọdimímọ́,” “òpin,” àti “ìyè àìnípẹ̀kun” bá ọ̀rọ̀ Gíríìkì mu dáadáa. “Ìwà mímọ́” àti “àbájáde” jẹ́ àṣàyàn tó bófin mu nínú àlàyé ìsàlẹ̀.
