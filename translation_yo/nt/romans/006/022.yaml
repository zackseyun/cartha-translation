id: ROM.6.22
reference: Romans 6:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí, lẹ́yìn tí a ti dá yín sílẹ̀ kúrò lọ́wọ́ ẹ̀ṣẹ̀, tí a sì sọ yín di ẹrú Ọlọ́run, ẹ ní èso yín tí ń yọrí sí ìsọdimímọ́[a]; òpin náà[b] sì ni ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àbájáde náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Ṣùgbọ́n nísinsin yìí
  rationale: Ó pa ìyàtọ̀ tó lágbára mọ́ láàárín ipò wọn tẹ́lẹ̀ àti ipò wọn nísinsin yìí, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: níwọ̀n bí a ti dá yín sílẹ̀ kúrò lọ́wọ́ ẹ̀ṣẹ̀
  rationale: Èyí fi ìṣe àṣekágbá tí àwọn onígbàgbọ́ gbà hàn, ó sì pa àwòrán ẹ̀ṣẹ̀ gẹ́gẹ́ bí agbára tí ó ti dè wọ́n mọ́.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: tí a sì sọ yín di ẹrú Ọlọ́run
  rationale: Ó pa àwòrán líle ti jíjẹ́ ẹrú mọ́, gẹ́gẹ́ bí ìyàtọ̀ sí jíjẹ́ ẹrú ẹ̀ṣẹ̀ nínú Róòmù 6; ‘ẹrú Ọlọ́run’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáṣepọ̀ ẹni tí ó jẹ́ ti olúwa rẹ̀.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: ẹ ní èso yín
  rationale: Ó pa àkàwé èso mọ́, kò sì sọ ọ́ di ‘àǹfààní’ nìkan.
- source_word: εἰς ἁγιασμόν
  choice: tí ń yọrí sí ìsọdimímọ́
  rationale: ‘Ń yọrí sí’ fi ìtọ́sọ́nà sí àbájáde tí εἰς ní hàn; ‘ìsọdimímọ́’ sì pa ìtumọ̀ ìṣe tàbí ìlọsíwájú ἁγιασμός mọ́.
- source_word: τὸ δὲ τέλος
  choice: òpin náà sì ni
  rationale: ‘Òpin’ bá τέλος mu ní tààrà, ó sì lè túmọ̀ sí ibi tí ọ̀nà náà parí tàbí àbájáde rẹ̀; àfikún ‘ni’ mú gbólóhùn náà jẹ́ Yorùbá àdánidá.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìyè tí kò ní òpin, ó sì pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Àwòrán jíjẹ́ ẹrú ní ìbáṣepọ̀ pẹ̀lú Ọlọ́run
  choice: Pa ọ̀rọ̀ líle náà mọ́ pẹ̀lú ‘sọ yín di ẹrú Ọlọ́run.’
  alternative: ‘sọ yín di ìránṣẹ́ Ọlọ́run’ tàbí ‘fi yín fún iṣẹ́ Ọlọ́run’
  rationale: Pọ́ọ̀lù mọ̀ọ́mọ̀ fi jíjẹ́ ẹrú Ọlọ́run ṣe ìyàtọ̀ sí jíjẹ́ ẹrú ẹ̀ṣẹ̀; yíyí i padà sí ‘ìránṣẹ́’ nìkan yóò dín agbára àkàwé náà kù.
- issue: Ìtumọ̀ ἁγιασμός
  choice: Lo ‘ìsọdimímọ́’ nínú àyọkà pàtàkì.
  alternative: ‘ìwà mímọ́’
  rationale: ‘Ìsọdimímọ́’ lè fi ìṣe àti ìlọsíwájú hàn, ṣùgbọ́n ‘ìwà mímọ́’ gẹ́gẹ́ bí ipò tàbí àbájáde náà tún ṣeé gbà; a pa ọ̀nà kejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ τέλος
  choice: Lo ‘òpin.’
  alternative: ‘àbájáde’
  rationale: ‘Òpin’ sun mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa àìdánilójú mọ́ bóyá a ń tẹnumọ́ ìparí ọ̀nà náà tàbí àbájáde rẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Ìtòlẹ́sẹẹsẹ náà dá àtakò ‘ẹ̀ṣẹ̀/Ọlọ́run’ àti ìtẹ̀síwájú ‘èso—ìsọdimímọ́—ìyè àìnípẹ̀kun’ dúró, láì rọ àwòrán jíjẹ́ ẹrú tàbí yanjú àìdánilójú τέλος ní ìkọ̀kọ̀.
