  to: Ṣùgbọ́n nísinsin yìí, lẹ́yìn tí a ti dá yín sílẹ̀ kúrò lọ́wọ́ ẹ̀ṣẹ̀, tí a sì sọ yín di ẹrú Ọlọ́run, ẹ ní èso yín tí ń yọrí sí ìsọdimímọ́[a]; òpin náà[b] sì ni ìyè àìnípẹ̀kun.
  rationale: A rọ́pò “níwọ̀n bí” pẹ̀lú “lẹ́yìn tí” láti yẹra fún fífi ìtumọ̀ ìdí sínú participle Gíríìkì, nígbà tí a pa ìṣe tí a ti ṣe sí àwọn olùgbọ́ náà àti ìṣàn ọ̀rọ̀ ayọkà mọ́. Àwọn àmì àlàyé ìsàlẹ̀ wà níbi tí ó tọ́, kò sì nílò àtúnṣe míràn.
