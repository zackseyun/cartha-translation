  rationale: A tún àmì ohùn orúkọ “Jésù” ṣe nínú ọ̀rọ̀ pàtàkì àti ẹsẹ̀-ìsàlẹ̀, a sì fi àmì ìdákẹ́gbẹ́ kún un láti ṣàfihàn ìpín gbólóhùn ìbátan. Gbogbo àwọn àṣàyàn ìtumọ̀ pàtàkì—ní pàtàkì “Mèsáyà” fún Χριστός àti “sínú” fún εἰς—ni a pa mọ́.
