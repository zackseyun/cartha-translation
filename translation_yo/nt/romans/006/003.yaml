id: ROM.6.3
reference: Romans 6:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: yo
  text: Àbí ẹ̀yin kò mọ̀ pé gbogbo àwa tí a batisí sínú Mèsáyà Jésù, ni a batisí sínú ikú rẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “Kristi Jésù.” Ní Gíríìkì: “Christos Iēsous.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó pa ìyípadà àríyànjiyàn Paulu àti ìbéèrè rẹ̀ tí ó ń tọ́ka sí ohun tí ó sọ ṣáájú mọ́ ní Yorùbá àdánidá.
- source_word: ἀγνοεῖτε
  choice: ẹ̀yin kò mọ̀
  rationale: Ìbéèrè àsọyé yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti pe àwọn olùgbọ́ sí ìmọ̀ tí ó yẹ kí wọ́n ní; “ẹ̀yin” tún fi ẹni kejì ọ̀pọ̀ hàn.
- source_word: ὅσοι
  choice: gbogbo àwa tí
  rationale: Ó pa ìtumọ̀ gbogbo àwọn tó wà nínú ẹgbẹ́ náà mọ́, ó sì bá ọ̀rọ̀-ìṣe ẹni kìíní ọ̀pọ̀ tó tẹ̀ lé e mu.
- source_word: ἐβαπτίσθημεν
  choice: a batisí
  rationale: Ìṣẹ̀dá aláìṣe nípa ẹni pàtó ní Yorùbá ń fi ohun tí a ṣe sí wa hàn, láìfi àlàyé ẹ̀sìn kan kún ìṣe batisí.
- source_word: εἰς
  choice: sínú
  rationale: “Sínú” pa àwòrán ìwọlé tàbí ìdásípọ̀ tó lágbára mọ́ ní ibi méjèèjì, láìdá ọ̀nà pàtó tí ìdásípọ̀ náà fi ń ṣiṣẹ́ lájọ́.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mèsáyà Jesu
  rationale: Χριστός ní agbára oyè ẹni tí a fòróró yàn níbí; “Mèsáyà” mú oyè náà hàn, dípò kí ó dà bí orúkọ lásán.
- source_word: θάνατον
  choice: ikú
  rationale: Ìtumọ̀ tààrà tí ó péye, láìsí ìfikún.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ oníhun Yorùbá tó tọ́ fún “ikú rẹ̀.”
theological_decisions:
- issue: Bóyá kí a túmọ̀ εἰς pẹ̀lú èdè batisí ní ọ̀nà tó ń fọwọ́ sí agbára sakaramenti, àmì ìdánimọ̀, tàbí ìṣọ̀kan májẹ̀mú.
  choice: A túmọ̀ εἰς ní ibi méjèèjì sí “sínú.”
  alternative: “ní ìbáṣepọ̀ pẹ̀lú” tàbí “sínú ìṣọ̀kan pẹ̀lú”
  rationale: Èdè Gíríìkì náà ń sọ ìwọlé tàbí ìdásípọ̀ sínú Mèsáyà Jesu àti sínú ikú rẹ̀. “Sínú” pa agbára àti àìmọ́ pàtó inú ọ̀rọ̀ náà mọ́ láìfọwọ́ sí àlàyé ẹ̀ka ìjọ kan.
translation_notes:
  register: Yorùbá ìgbàlódé, tó níyì, tó sì ṣeé lóye ni a lò. “Àbí” àti ìtẹnumọ́ “ni” mú ìbéèrè àsọyé náà ṣàn déédéé; àmì ohùn ni a fi sí ibi tí ó bá àkọtọ̀ Yorùbá mu.
