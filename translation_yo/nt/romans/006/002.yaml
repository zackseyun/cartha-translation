source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: yo
  text: Kí ó má rí bẹ́ẹ̀ láéláé![a] Àwa tí a kú sí ẹ̀ṣẹ̀, báwo ni a ó ṣe tún máa gbé inú rẹ̀?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Rárá o, kò lè rí bẹ́ẹ̀!” Ọ̀rọ̀ yìí jẹ́ ọ̀nà líle láti kọ èrò kan pátápátá.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ láéláé!
  rationale: Àṣàyàn yìí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi agbára ìkọ̀sílẹ̀ Pọ́ọ̀lù hàn, láì lo ọ̀rọ̀ àtijọ́ tàbí túmọ̀ rẹ̀ sí àlàyé.
- source_word: οἵτινες
  choice: Àwa tí
  rationale: Ó pa ìdánimọ̀ ẹni àkọ́kọ́ ọ̀pọ̀ Pọ́ọ̀lù mọ́, ó sì so àwọn tí wọ́n kú sí ẹ̀ṣẹ̀ mọ́ ‘àwa’ ní tààrà.
- source_word: ἀπεθάνομεν
  choice: a kú
  rationale: Ó túmọ̀ aorist gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tí ó ṣẹlẹ̀, ó sì pa àwòrán ikú tí Gíríìkì lò mọ́.
- source_word: τῇ ἁμαρτίᾳ
  choice: sí ẹ̀ṣẹ̀
  rationale: Dative náà fi ìbáṣepọ̀ hàn—ikú ní ti ẹ̀ṣẹ̀ tàbí sí ẹ̀ṣẹ̀. ‘Kú sí ẹ̀ṣẹ̀’ jẹ́ ọ̀nà kedere láti pa àwòrán àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- source_word: πῶς ἔτι
  choice: báwo ni a ó ṣe tún
  rationale: 'Ó mú ìbéèrè àròsọ àti èrò ìtẹ̀síwájú ἔτι jáde: báwo ni ìgbé ayé bẹ́ẹ̀ ṣe lè tún máa bá a lọ?'
- source_word: ζήσομεν
  choice: máa gbé
  rationale: Future indicative náà wà nínú ìbéèrè àròsọ; ‘a ó ṣe tún máa gbé’ jẹ́ Yorùbá àdánidá tí ó fi ìtẹ̀síwájú ìgbé ayé hàn.
- source_word: ἐν αὐτῇ
  choice: inú rẹ̀
  rationale: Ó tọ́ka padà sí ẹ̀ṣẹ̀ gẹ́gẹ́ bí agbègbè tàbí ipò tí ènìyàn ń gbé, ó sì pa ìṣọ̀kan àwòrán Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá gbólóhùn Pọ́ọ̀lù túmọ̀ sí ìlọsíwájú ìwà rere tàbí ìyapa pàtó kúrò lábẹ́ agbára ẹ̀ṣẹ̀
  choice: A pa àwòrán náà mọ́ ní tààrà gẹ́gẹ́ bí ‘a kú sí ẹ̀ṣẹ̀.’
  alternative: ‘a ti dín ìfẹ́ sí ẹ̀ṣẹ̀ kù’ tàbí ‘a yí padà kúrò nínú ẹ̀ṣẹ̀’
  rationale: Gíríìkì sọ àwòrán ikú ní tààrà. Ìtumọ̀ náà kò tú u sí ẹ̀kọ́ ìsìn kan pàtó, bẹ́ẹ̀ ni kò sọ pé ó kàn jẹ́ ìlọsíwájú ìwà; ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. ‘Kí ó má rí bẹ́ẹ̀ láéláé’ àti ‘tún máa gbé inú rẹ̀’ mú agbára ìkọ̀sílẹ̀ àti àwòrán ẹ̀ṣẹ̀ gẹ́gẹ́ bí agbègbè ìgbé ayé jáde.
