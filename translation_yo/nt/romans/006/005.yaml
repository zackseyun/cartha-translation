id: ROM.6.5
reference: Romans 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: yo
  text: Nítorí bí a bá ti di ẹni tí a so pọ̀ mọ́ ọn[a] ní ìjọra ikú rẹ̀, dájúdájú, a ó sì jẹ́ ẹni tí a so pọ̀ mọ́ ọn ní ìjọra àjíǹde rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ti dàgbà papọ̀ mọ́ ọn.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: “a ó sì jẹ́ ti àjíǹde”; a lóye “ẹni tí a so pọ̀ mọ́ ọn” láti inú apá àkọ́kọ́ gbólóhùn náà.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: ẹni tí a so pọ̀ mọ́ ọn
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìṣọ̀kan tàbí kíkópa papọ̀ tí ó jinlẹ̀. Gbólóhùn yìí ṣe kedere ní Yorùbá òde òní, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún ohun tí Gíríìkì sọ.
- source_word: γεγόναμεν
  choice: a bá ti di
  rationale: Èyí fi hàn pé ohun náà ti ṣẹlẹ̀ tẹ́lẹ̀, àbájáde rẹ̀ sì wà títí di ìsinsìnyí, gẹ́gẹ́ bí perfect tense Gíríìkì ṣe ń tọ́ka sí.
- source_word: τῷ ὁμοιώματι
  choice: ní ìjọra
  rationale: “Ìjọra” pa èrò likeness mọ́ láìsọ ọ́ di ìdánimọ̀ pátápátá tàbí àwòrán lásán.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: ikú rẹ̀
  rationale: Èyí tẹ̀ lé ìbáṣepọ̀ genitive Gíríìkì ní tààrà, láìfikún àlàyé tí kò sí nínú ọ̀rọ̀ náà.
- source_word: ἀλλὰ καὶ
  choice: dájúdájú, a ó sì
  rationale: “Dájúdájú” àti “sì” mú ìtẹnumọ́ àti ìsopọ̀ gbólóhùn kejì mọ́ ti àkọ́kọ́ jáde ní Yorùbá àdánidá.
- source_word: τῆς ἀναστάσεως
  choice: ní ìjọra àjíǹde rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì kò tún “rẹ̀” tàbí “ní ìjọra” sọ, ìfiwéra pẹ̀lú apá àkọ́kọ́ fi àwọn èrò wọ̀nyí hàn; fífi wọn hàn gbangba mú kí Yorùbá yéni.
- source_word: ἐσόμεθα
  choice: a ó sì jẹ́ ẹni tí a so pọ̀ mọ́ ọn
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí “a ó jẹ́,” ṣùgbọ́n predicate láti σύμφυτοι ni a gbọ́dọ̀ lóye pẹ̀lú rẹ̀. A tún un sọ ní Yorùbá kí gbólóhùn náà lè pé, kí ó sì yéni.
theological_decisions:
- issue: Bóyá kí a ṣàlàyé ìṣọ̀kan pẹ̀lú Kristi gẹ́gẹ́ bí sacrament, ohun ìjìnlẹ̀, tàbí àkàwé pàtó
  choice: A pa ọ̀rọ̀ mọ́ sí “a so pọ̀ mọ́ ọn ní ìjọra ikú rẹ̀ … ní ìjọra àjíǹde rẹ̀.”
  alternative: “a kópa nínú ikú àti àjíǹde rẹ̀” tàbí “a dàgbà papọ̀ mọ́ ọn”
  rationale: Ẹsẹ̀ náà ń sọ ìṣọ̀kan gidi, síbẹ̀ ó tún lo ὁμοίωμα, “ìjọra.” Ìtumọ̀ yìí pa méjèèjì mọ́ láìyanju bí ìkópa náà ṣe ń ṣiṣẹ́ ní ọ̀nà ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu; a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
