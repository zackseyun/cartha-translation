id: ROM.6.15
reference: Romans 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: yo
  text: Ǹjẹ́ kí ni? Ṣé kí a ṣẹ̀ nítorí pé a kò sí lábẹ́ òfin, ṣùgbọ́n a wà lábẹ́ oore-ọ̀fẹ́? Kí a má rí bẹ́ẹ̀![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé a ó ṣẹ̀?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Rárá o!”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Ǹjẹ́ kí ni?
  rationale: Ó fi ìbéèrè ìyípadà èrò Pọ́ọ̀lù hàn ní ṣókí, láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἁμαρτήσωμεν
  choice: Ṣé kí a máa ṣẹ̀
  rationale: Ìṣe abẹ́nú ẹni àkọ́kọ́ ọ̀pọ̀ yìí jẹ́ ìbéèrè ìfọ̀rọ̀wérọ̀ nípa ohun tí a lè ṣe; àkópọ̀ ‘Ṣé kí a’ mú un jáde ní Yorùbá àdánidá. ‘Máa ṣẹ̀’ sọ ìṣe ẹ̀ṣẹ̀ gẹ́gẹ́ bí ìlànà ìwà tí àríyànjiyàn náà ń dábàá.
- source_word: ὅτι
  choice: nítorí pé
  rationale: 'Ó sọ ìdí tí ìbéèrè náà fi ń dábàá ẹ̀ṣẹ̀: pé àwọn onígbàgbọ́ kò sí lábẹ́ òfin bí kò ṣe lábẹ́ oore-ọ̀fẹ́.'
- source_word: ὑπὸ νόμον
  choice: lábẹ́ òfin
  rationale: Ó pa àwòrán Gíríìkì ti wíwà lábẹ́ àṣẹ òfin mọ́, láìsọ ó di ‘Òfin Mósè’ tàbí fi ìtumọ̀ ẹ̀kọ́ kan pàtó lé e lórí.
- source_word: ὑπὸ χάριν
  choice: lábẹ́ oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún χάρις nínú ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe láàárín òfin àti oore-ọ̀fẹ́.
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ láéláé!
  rationale: Ó mú ìkọ̀sílẹ̀ líle ti ọ̀rọ̀ Gíríìkì jáde ní èdè Yorùbá ọlọ́lá tí ó sì yé ni, kì í ṣe ìdáhùn ‘rárá’ lásán.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ νόμος nínú ìyàtọ̀ tí Pọ́ọ̀lù ṣe
  choice: òfin
  alternative: Òfin Mósè
  rationale: A kò sọ νόμος di Òfin Mósè ní pàtó, kí ìtumọ̀ náà má bàa dín ààyè ẹ̀kọ́ ọ̀rọ̀ náà kù ju bí Gíríìkì ṣe sọ lọ. Yorùbá nílò àmì ìdánimọ̀ orúkọ ‘òfin’ ní irú gbólóhùn yìí, ṣùgbọ́n a kò fi àlàyé mìíràn kún un.
- issue: Agbára ìkọ̀sílẹ̀ μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ láéláé!
  alternative: Rárá o!
  rationale: Àṣàyàn àkọ́kọ́ pa ìrísí ìfẹ́-ọkàn/ìkọ̀sílẹ̀ Gíríìkì àti agbára rẹ̀ mọ́; àṣàyàn kejì ṣe é ní kúkúrú sí i ṣùgbọ́n ó dín ìrísí ọ̀rọ̀ náà kù.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. ‘Ṣé’ jẹ́ àmì ìbéèrè àdánidá; ‘kí a máa ṣẹ̀’ mú ìbéèrè ìfọ̀rọ̀wérọ̀ àti àbájáde ìwà tí Pọ́ọ̀lù ń kọ̀ hàn.
