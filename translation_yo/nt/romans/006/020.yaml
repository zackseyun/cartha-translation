source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: yo
  text: Nítorí, nígbà tí ẹ jẹ́ ẹrú ẹ̀ṣẹ̀, ẹ jẹ́ òmìnira ní ti òdodo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ti ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ẹrú
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ìdè ẹrú mọ́, ó sì bá ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe láàárín ẹrú ẹ̀ṣẹ̀ àti ẹrú òdodo mu.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Àkójọpọ̀ náà, “ẹrú ẹ̀ṣẹ̀,” fi ẹ̀ṣẹ̀ hàn gẹ́gẹ́ bí ọ̀gá tàbí agbára tí wọ́n wà lábẹ́ rẹ̀.
- source_word: ἐλεύθεροι
  choice: òmìnira
  rationale: '“Òmìnira” pa ìtakora mímú tí Pọ́ọ̀lù lò mọ́: nígbà tí wọ́n jẹ́ ẹrú ẹ̀ṣẹ̀, wọn kò sí lábẹ́ ìbéèrè òdodo.'
- source_word: τῇ δικαιοσύνῃ
  choice: ní ti òdodo
  rationale: “Ní ti” túmọ̀ dative náà gẹ́gẹ́ bí ìtọ́kasí tàbí ọ̀rọ̀ tí a ń sọ nípa rẹ̀, láìfi hàn pé òdodo fúnra rẹ̀ jẹ́ agbára ìnilára.
- source_word: δικαιοσύνῃ
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún δικαιοσύνη nínú ọ̀rọ̀ Pọ́ọ̀lù; ó lè ní ìtumọ̀ ìwà títọ́ àti ìdájọ́ òdodo gẹ́gẹ́ bí àyíká ṣe ń béèrè.
- source_word: γὰρ
  choice: Nítorí
  rationale: “Nítorí” pa ìsopọ̀ àlàyé mọ́ pẹ̀lú àríyànjiyàn tó ṣáájú.
theological_decisions:
- issue: Bí a ṣe máa sọ ìbáṣepọ̀ wọn pẹ̀lú òdodo nínú ìtakora Pọ́ọ̀lù
  choice: ẹ̀yin jẹ́ òmìnira ní ti òdodo
  alternative: ẹ̀yin bọ́ lọ́wọ́ òdodo
  rationale: Àṣàyàn yìí pa ìfọkànsìn àti ìtakora Gíríìkì mọ́, láìjẹ́ kí ó dà bí ẹni pé òdodo jẹ́ ọ̀gá búburú tàbí agbára ìnilára.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “ẹrú” dípò “ìránṣẹ́” láti pa àwòrán ìdè ẹrú nínú Róòmù 6 mọ́; “ní ti òdodo” jẹ́ ọ̀nà àdánidá láti fi ìtumọ̀ ìtọ́kasí dative hàn.
