id: ROM.6.8
reference: Romans 6:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: yo
  text: Bí a bá ti kú pẹ̀lú Mèsáyà[a], a gbàgbọ́ pé a ó tún wà láàyè pẹ̀lú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “Kristi”: Gíríìkì, “Χριστῷ” (Christō).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” fi ipò àdéhùn hàn, “ṣùgbọ́n” sì mú ìlọsíwájú tàbí ìyàtọ̀ kékeré tí δέ ní nínú àríyànjiyàn Pọ́ọ̀lù wá.
- source_word: ἀπεθάνομεν
  choice: a bá ti kú
  rationale: Àkópọ̀ “bá ti kú” jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí ikú tí ó ti ṣẹlẹ̀ tẹ́lẹ̀ nínú gbólóhùn àdéhùn, bí aorist náà ṣe ń ṣe níhìn-ín.
- source_word: σὺν Χριστῷ
  choice: pẹ̀lú Mèsáyà
  rationale: σύν túmọ̀ sí ìbáṣepọ̀ tàbí ìṣọ̀kan “pẹ̀lú”; Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín, nítorí náà “Mèsáyà” ni a lò, pẹ̀lú àṣàyàn “Kristi” nínú àlàyé ìsàlẹ̀.
- source_word: πιστεύομεν
  choice: a gbàgbọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tààrà, tí ó sì bójú mu fún ìjẹ́wọ́ ìgbàgbọ́ nínú ọ̀rọ̀ yìí.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ṣí àkóónú ohun tí a gbàgbọ́ sílẹ̀ ní Yorùbá, gẹ́gẹ́ bí ὅτι ṣe rí.
- source_word: καὶ
  choice: sì
  rationale: “Sì” fi kún un pé ìyè ọjọ́ iwájú bá ikú pẹ̀lú Mèsáyà mu, láìfi ìtumọ̀ míì kún ọ̀rọ̀ náà.
- source_word: συζήσομεν αὐτῷ
  choice: a ó sì wà láàyè pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀ náà sọ nípa jíjẹ́ alààyè pẹ̀lú ẹnì kan ní ọjọ́ iwájú; ìtumọ̀ yìí pa ìbáṣepọ̀ “pẹ̀lú rẹ̀” mọ́ ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àríyànjiyàn nípa ìṣọ̀kan pẹ̀lú Jésù yìí, Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè. A fi “Mèsáyà” sínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a pa “Kristi” mọ́ gẹ́gẹ́ bí àṣàyàn tó yẹ nínú àlàyé ìsàlẹ̀.
- issue: Irú ìyè ọjọ́ iwájú nínú συζήσομεν αὐτῷ
  choice: a ó sì wà láàyè pẹ̀lú rẹ̀
  alternative: a ó sì bá a ní ìyè àjíǹde
  rationale: A kò dín ọ̀rọ̀ Gíríìkì náà kù sí àlàyé ẹ̀kọ́ kan pàtó; a pa gbígbòòrò àti ìfọ̀rọ̀wérọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́ nípa ìyè ọjọ́ iwájú pẹ̀lú Mèsáyà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún òǹkàwé gbogbo. Àmì ohùn kún un níbi tí ó bá jẹ́ àdánidá; “a bá ti kú” pa ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ mọ́, “a ó … wà láàyè” sì fi ọjọ́ iwájú hàn kedere.
