revisions:
- from: Ṣùgbọ́n bí a bá ti kú pẹ̀lú Mèsáyà[a], a gbàgbọ́ pé a ó sì wà láàyè pẹ̀lú rẹ̀.
  to: Bí a bá ti kú pẹ̀lú Mèsáyà[a], a gbàgbọ́ pé a ó tún wà láàyè pẹ̀lú rẹ̀.
  rationale: The revision removes an unnecessarily adversative connector and renders the additive καί explicitly, while retaining the draft’s faithful conditional, completed-death, Messiah-title, and future-shared-life wording.
  reviewer_model: gpt-5.6-terra
