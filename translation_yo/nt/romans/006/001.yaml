source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: yo
  text: Kí ni a ó wá sọ? Ṣé a ó máa bá a lọ nínú ẹ̀ṣẹ̀,[a] kí oore-ọ̀fẹ́ lè pọ̀ sí i?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé a ó máa tẹ̀ síwájú nínú ẹ̀ṣẹ̀ …?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí oore-ọ̀fẹ́ lè pọ̀ yanturu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Nítorí náà, kí ni
  rationale: Ó pa ìtumọ̀ ìyọrísí οὖν mọ́, ó sì gbé ìbéèrè àsọyé Pọ́ọ̀lù kalẹ̀ ní Yorùbá àdánidá.
- source_word: ἐροῦμεν
  choice: àwa yóò sọ
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí jẹ́ ti ìgbìmọ̀ inú ìbéèrè; gbólóhùn náà ṣe kedere, ó sì bá ìṣètò àsọyé mu.
- source_word: ἐπιμένωμεν
  choice: kí a máa bá a lọ
  rationale: Àmì ìṣe tí ń tẹ̀ síwájú nínú ọ̀rọ̀ Gíríìkì ń béèrè nípa ìwà tí a lè máa ṣe láìdáwọ́ dúró; yíyan yìí jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: τῇ ἁμαρτίᾳ
  choice: nínú ẹ̀ṣẹ̀
  rationale: Ó fi ẹ̀ṣẹ̀ hàn gẹ́gẹ́ bí ipò tàbí ìṣe tí ènìyàn ń dúró nínú rẹ̀, láìfi ohun tí kò sí nínú orísun kún un.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó mú ète tàbí àbájáde tí ìbéèrè àsọyé náà dábàá jáde ní kedere.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì péye fún oore tí Ọlọ́run ń fi fúnni nínú àríyànjiyàn Pọ́ọ̀lù.
- source_word: πλεονάσῃ
  choice: máa pọ̀ sí i
  rationale: Ó sọ ìbísí ní ìwọ̀n tàbí ní ọ̀pọ̀ yanturu ní èdè Yorùbá tó ṣe kedere, ó sì pa àmì ìṣe tó lè máa tẹ̀ síwájú mọ́.
theological_decisions:
- issue: Bóyá ìbéèrè Pọ́ọ̀lù ń sọ nípa àṣẹ, ààyè láti ṣe ohun kan, tàbí àsọtẹ́lẹ̀ lásán
  choice: 'Ìbéèrè ìgbìmọ̀ nípa ìwà: “Ǹjẹ́ kí a máa bá a lọ nínú ẹ̀ṣẹ̀”'
  alternative: “Ṣé a ó máa bá a lọ nínú ẹ̀ṣẹ̀?”
  rationale: Kí a máa jẹ́ kí agbára ìbéèrè ìwà inú subjunctive Gíríìkì hàn, láìyànjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí Pọ́ọ̀lù mọ̀ọ́mọ̀ gbé kalẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. “Ǹjẹ́” ń jẹ́ kí ìbéèrè àsọyé náà dún lọ́nà àdánidá, “máa bá a lọ” sì mú ìṣe tí ń tẹ̀ síwájú hàn. A fi àmì ohùn síbi tí ó yẹ.
