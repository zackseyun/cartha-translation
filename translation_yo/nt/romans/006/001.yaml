review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìbéèrè àsọyé Pọ́ọ̀lù, ìfẹ́ láti máa bá a lọ nínú ẹ̀ṣẹ̀, àti ìdí tí a dábàá ('kí oore-ọ̀fẹ́ lè pọ̀ sí i') hàn dáadáa. Síbẹ̀, 'Ǹjẹ́ kí a...' lè dún bí ìfẹ́/ìyọ̀nda tàbí àṣẹ ní Yorùbá, dípò ìbéèrè ìgbìmọ̀ tí subjunctive Gíríìkì náà jẹ́. 'Ṣé a ó...?' pa ìbéèrè ìwà náà mọ́ dáadáa jù.
  naturalness: '''Kí ni a ó wá sọ?'' àti ''Ṣé a ó máa bá a lọ...?'' jẹ́ Yorùbá boṣewa, òde òní, tí ó sì ń dún gẹ́gẹ́ bí ìbéèrè àsọyé. Wọ́n tún yẹra fún ìtẹnumọ́ ''àwa'' tí kò pọndandan nínú gbólóhùn yìí.'
  terminology: '''Ẹ̀ṣẹ̀'' fún ἁμαρτία àti ''oore-ọ̀fẹ́'' fún χάρις jẹ́ yíyan tí ó péye, tí ó sì bá ìlò tí ó wọ́pọ̀ nínú ìtumọ̀ Bíbélì Yorùbá mu. ''Lè pọ̀ sí i'' ń sọ πλεονάσῃ ní kedere láìfi ìtumọ̀ ẹ̀kọ́ kún un.'
  issues:
  - severity: medium
    issue: '''Ǹjẹ́ kí a máa bá a lọ'' lè túmọ̀ sí ìyọ̀nda tàbí ìpè láti ṣe ohun kan.'
    rationale: 'ἐπιμένωμεν jẹ́ subjunctive inú ìbéèrè ìgbìmọ̀: Pọ́ọ̀lù ń béèrè bóyá a yẹ kí a tẹ̀síwájú nínú ẹ̀ṣẹ̀, kì í ṣe pé ó ń sọ ''jẹ́ kí a'' gẹ́gẹ́ bí ìpè tàbí ìfọwọ́sí.'
