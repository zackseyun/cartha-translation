  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ètò gírámà Gíríìkì dáadáa: a sin àwọn onígbàgbọ́ pẹ̀lú Mèsáyà nípasẹ̀ ìbatisí sínú ikú; a jí Mèsáyà dìde kúrò láàárín òkú nípasẹ̀ ògo Baba; ète náà ni kí àwọn onígbàgbọ́ rìn nínú ìtuntun ìyè. Ṣùgbọ́n a nílò àtúnṣe kékeré sí gbolohun ìbẹ̀rẹ̀ àti gbolohun ète náà kí Yorùbá rẹ̀ lè péye.'
  naturalness: “A sin wa” kò dára ní Yorùbá boṣewa, nítorí “wa” nínú ipò náà gbọ́dọ̀ jẹ́ “wá,” tàbí kí a tún ọ̀rọ̀ náà ṣe. Bákan náà, “kí ó lè jẹ́ pé” jẹ́ àfikún tí kò pọndandan, ó sì mú ìṣàn gbolohun náà wuwo. “Nínú ìtuntun ìyè” mú ìtumọ̀ abstract ti καινότης ζωῆς hàn dáadáa ju “nínú ìyè tuntun,” tí ó lè túmọ̀ sí ‘nínú ìyè tuntun kan,’ lọ.
  terminology: “Ìbatisí,” “Mèsáyà,” “ògo Baba,” àti “rìn” jẹ́ àwọn yíyan tó yẹ. Àkọsílẹ̀ [a] tẹ̀lé Χριστός ní ibi tó tọ́, ó sì fún “Kristi” gẹ́gẹ́ bí ọ̀nà mìíràn láìfi ìtumọ̀ ẹ̀kọ́ kún ọ̀rọ̀ náà.
