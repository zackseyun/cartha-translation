id: ROM.6.4
reference: Romans 6:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: yo
  text: 'Nítorí náà, a sin wá pẹ̀lú rẹ̀ nípasẹ̀ ìbatisí sínú ikú, kí, gẹ́gẹ́ bí a ti jí Mèsáyà[a] dìde kúrò láàárín àwọn òkú nípasẹ̀ ògo Baba, bẹ́ẹ̀ náà ni àwa náà lè rìn nínú ìtuntun ìyè.


    [a] Tàbí, “Kristi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: Ọ̀nà mìíràn tí a lè fi oyè Χριστός hàn ní Yorùbá.
lexical_decisions:
- source_word: συνετάφημεν
  choice: a sin wa pẹ̀lú rẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ó ti ṣẹlẹ̀ hàn ní ọ̀nà àìṣe, ó sì ní ìtumọ̀ ‘sin papọ̀’; ‘pẹ̀lú rẹ̀’ gbé ìtumọ̀ συν- jáde ní Yorùbá àdánidá.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú gẹ́gẹ́ bí àbájáde rẹ̀.
- source_word: διὰ τοῦ βαπτίσματος
  choice: nípasẹ̀ ìbatisí
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí ohun èlò mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- source_word: εἰς τὸν θάνατον
  choice: sínú ikú
  rationale: ‘Sínú’ pa agbára ìtọ́sọ́nà εἰς mọ́, ó sì fi ìdásí sínú ikú hàn.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A túmọ̀ oyè náà ní tààrà; àkọsílẹ̀ ìsàlẹ̀ fi ‘Kristi’ hàn gẹ́gẹ́ bí ọ̀nà míì tí a mọ̀ dáadáa.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó sọ ìdìde kúrò láàárín àwọn tí ó kú ní kedere, ó sì tẹ̀lé àwòrán Gíríìkì.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: nípasẹ̀ ògo Baba
  rationale: Ó pa ‘ògo’ àti ipa ohun èlò tí διά ní mọ́, dípò fífi ‘agbára’ rópò rẹ̀.
- source_word: περιπατήσωμεν
  choice: lè máa rìn
  rationale: Ó pa àwòrán ‘rìn’ mọ́, nígbà tí ‘lè’ bá ète tí ἵνα àti ọ̀rọ̀-ìṣe subjunctive ń fi hàn mu.
- source_word: ἐν καινότητι ζωῆς
  choice: nínú ìyè tuntun
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá tí ó pa èrò ìtuntun ìyè mọ́, láìsọ àwòrán ‘rìn’ di àsọyé pẹlẹbẹ.
theological_decisions:
- issue: Bí a ṣe lè túmọ̀ διὰ τοῦ βαπτίσματος láìdá ẹ̀kọ́ pàtó nípa ìbatisí kalẹ̀
  choice: nípasẹ̀ ìbatisí
  alternative: nípa ìbatisí
  rationale: ‘Nípasẹ̀’ pa ipa gírámà ọ̀nà tàbí ohun èlò mọ́, ṣùgbọ́n kò pinnu bí ìbatisí ṣe ń ṣiṣẹ́ nínú ìṣọ̀kan pẹ̀lú Mèsáyà.
- issue: Bí a ṣe lè túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ fi agbára oyè náà hàn; ‘Kristi’ wà nínú àkọsílẹ̀ ìsàlẹ̀ nítorí pé ó jẹ́ ọ̀nà ìtumọ̀ tí ó wọ́pọ̀.
- issue: Ìbáṣepọ̀ ìbatisí, ikú, àti ìyè tuntun
  choice: A pa èdè ìdásí ‘sínú ikú’ àti ète ‘lè máa rìn nínú ìyè tuntun’ mọ́
  alternative: Ṣíṣe àlàyé wọn gẹ́gẹ́ bí àmì lasan tàbí gẹ́gẹ́ bí ìṣe tó ń gba ènìyàn là fúnra rẹ̀
  rationale: Orísun náà fi ìbáṣepọ̀ tó lágbára hàn, ṣùgbọ́n kò yẹ kí ìtumọ̀ fi ìpinnu ẹ̀kọ́ ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A pa àwòrán Pọ́ọ̀lù nípa ‘rìn’ mọ́, ṣùgbọ́n a lo ‘ìyè tuntun’ dípò gbólóhùn líle ‘ìtuntun ìyè’ kí ọ̀rọ̀ náà lè jẹ́ àdánidá. A fi àmì àkọsílẹ̀ [a] sí ‘Mèsáyà,’ ibi tí àṣàyàn ‘Kristi’ bá mu ní ìtumọ̀, dípò lẹ́yìn ‘ikú,’ nítorí pé àkọsílẹ̀ Gẹ̀ẹ́sì tó sọ ‘Or Christ’ dájú pé ó ń tọ́ka sí Χριστός.
