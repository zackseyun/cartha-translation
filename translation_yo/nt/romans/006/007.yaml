  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: yo
  text: Nítorí a ti dá ẹni tí ó ti kú náà láre kúrò lọ́wọ́ ẹ̀ṣẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè jẹ́, “a ti dá ẹni náà sílẹ̀ láìjẹ̀bi kúrò lọ́wọ́ ẹ̀ṣẹ̀”; ní àyíká ọ̀rọ̀ yìí, ó tún lè túmọ̀ sí, “ó ti bọ́ lọ́wọ́ ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: ẹni tí ó ti kú
  rationale: Àpilẹ̀kọ pẹ̀lú àpólà-ìṣe aorist náà dúró gẹ́gẹ́ bí orúkọ. ‘Ẹni tí ó ti kú’ jẹ́ Yorùbá àdánidá, kò sì fi akọ tàbí abo kún ohun tí Gíríìkì kò tẹnumọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: γάρ ń ṣàlàyé ìdí tàbí ìpìlẹ̀ ọ̀rọ̀ tó ṣáájú; ‘Nítorí’ jẹ́ àsopọ̀ Yorùbá tó ṣe kedere níbí.
- source_word: δεδικαίωται
  choice: a ti dá a láre
  rationale: ‘Dá ... láre’ pa agbára ọ̀rọ̀ ilé-ẹjọ́ δικαιόω mọ́, ó sì lè tọ́ka sí dídáláre tàbí dídá ẹni sílẹ̀ láìjẹ̀bi. Ìkọ̀ ‘a ti ...’ fi perfect passive hàn lọ́nà Yorùbá àdánidá.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: kúrò lọ́wọ́ ẹ̀ṣẹ̀
  rationale: ἀπό fi ìyapa tàbí ìtúsílẹ̀ hàn. ‘Kúrò lọ́wọ́ ẹ̀ṣẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìtúsílẹ̀ kúrò lábẹ́ ìkápá ẹ̀ṣẹ̀ hàn, láìdín ìtumọ̀ náà kù sí ẹ̀bi nìkan tàbí agbára nìkan.
theological_decisions:
- issue: Bóyá a óò mú δικαιόω gẹ́gẹ́ bí ọ̀rọ̀ ilé-ẹjọ́ nìkan (‘dáláre/dásílẹ̀ láìjẹ̀bi’) tàbí gẹ́gẹ́ bí ìtúsílẹ̀ (‘bọ́ lọ́wọ́’).
  choice: a ti dá a láre kúrò lọ́wọ́ ẹ̀ṣẹ̀
  alternative: ó ti bọ́ lọ́wọ́ ẹ̀ṣẹ̀
  rationale: ‘Dá a láre’ pa ìrísí ọ̀rọ̀ ilé-ẹjọ́ mọ́, nígbà tí ‘kúrò lọ́wọ́ ẹ̀ṣẹ̀’ jẹ́ kí àyíká ọ̀rọ̀ nípa ìtúsílẹ̀ kúrò lábẹ́ ìṣàkóso ẹ̀ṣẹ̀ hàn. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ìtúsílẹ̀ mọ́ láìyanjú ẹdọfu náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹni’ àti arọ́pò-orúkọ ‘a’ láìfi akọ tàbí abo kún ọ̀rọ̀ orísun.
