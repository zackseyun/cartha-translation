review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents οὖν, the prohibitive present imperative, sin’s royal personification, the plural possessive ‘your,’ and the body as mortal. The antecedent of αὐτοῦ is appropriately retained as the body in the main text, with the contextual alternative supplied in a footnote.
  naturalness: 'The clause “kí ẹ sì máa ṣègbọràn” is problematic after “ẹ má ṣe jẹ́ kí”: in ordinary Yoruba it can read as a further positive exhortation (‘and keep obeying’), rather than the outcome to be avoided. “kí ẹ má bàa ṣègbọràn” naturally expresses the intended/resultant warning.'
  terminology: “Ẹ̀ṣẹ̀,” “ara,” “tí ó lè kú,” “jẹ ọba,” and “ìfẹ́kúfẹ̀ẹ́” are suitable Standard Yoruba renderings and retain the source’s register and personification.
  issues:
  - severity: medium
    issue: The purpose/result clause is ambiguously and potentially reversely expressed.
    rationale: Greek εἰς τὸ ὑπακούειν states the obedience that sin’s reign would bring about. Replacing “kí ẹ sì máa ṣègbọràn” with “kí ẹ má bàa ṣègbọràn” makes clear that readers are not to permit sin’s reign with the consequence of obeying its desires.
  revised_text: Nítorí náà, ẹ má ṣe jẹ́ kí ẹ̀ṣẹ̀ jẹ ọba nínú ara yín tí ó lè kú, kí ẹ má bàa ṣègbọràn sí àwọn ìfẹ́kúfẹ̀ẹ́ rẹ̀.[a]
  revised_footnotes:
