id: ROM.6.12
reference: Romans 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe jẹ́ kí ẹ̀ṣẹ̀ jẹ ọba nínú ara yín tí ó lè kú, kí ẹ má bàa ṣègbọràn sí àwọn ìfẹ́kúfẹ̀ẹ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí ó ṣeé ṣe: “kí ẹ má bàa ṣègbọràn sí àwọn ìfẹ́kúfẹ̀ẹ́ ẹ̀ṣẹ̀.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ yìí jẹ́ àbájáde ọ̀rọ̀ tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti so ìtumọ̀ náà pọ̀ ní Yorùbá.
- source_word: βασιλευέτω
  choice: ẹ má ṣe jẹ́ kí ... jẹ ọba
  rationale: Ó pa agbára àṣẹ ìdènà mọ́, ó sì tún pa àwòrán ẹ̀ṣẹ̀ bí ọba tí ń ṣàkóso mọ́.
- source_word: ἡ ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe déédé fún ẹ̀ṣẹ̀ ni, ìṣe ọba tí a so mọ́ ọn sì pa ìsọ̀rọ̀-ẹni Pọ́ọ̀lù mọ́.
- source_word: θνητῷ
  choice: tí ó lè kú
  rationale: Ó sọ ìtumọ̀ ara tí ikú lè dé bá ní Yorùbá tí ó ṣe kedere, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: σώματι
  choice: ara
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tó sì bá lílo ọ̀rọ̀ náà nínú àyíká yìí mu.
- source_word: εἰς τὸ ὑπακούειν
  choice: kí ẹ sì máa ṣègbọràn
  rationale: Ó lè sọ ète tàbí àbájáde ìṣàkóso ẹ̀ṣẹ̀; ‘máa’ tún bá ìṣe tí ń bá a lọ mu.
- source_word: ἐπιθυμίαις
  choice: àwọn ìfẹ́kúfẹ̀ẹ́
  rationale: Ó ní ìwọ̀n ìtumọ̀ tó gbòòrò ju ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ nìkan lọ, ó sì ní agbára ìkìlọ̀ ní àyíká ọ̀rọ̀ náà.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ náà tọ́ka sí ‘ara’ gẹ́gẹ́ bí ìbámu gírámà Gíríìkì tó ṣeé ṣe jù; àmọ́ Yorùbá kò fi akọ tàbí abo hàn nínú ‘rẹ̀,’ nítorí náà àlàyé ìtumọ̀ mìíràn wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bóyá ẹ̀ṣẹ̀ jẹ́ àwọn ìṣe lásán tàbí agbára tí ń ṣàkóso
  choice: A pa àwòrán ẹ̀ṣẹ̀ bí ọba tí ń ṣàkóso mọ́ pẹ̀lú ‘jẹ ọba.’
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ìwà ẹ̀ṣẹ̀ tí ń gba àṣẹ lórí ènìyàn.
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ àwòrán ìjọba, ó sì sọ ẹ̀ṣẹ̀ di bí ẹni pé ó jẹ́ alákòóso; pípa àwòrán náà mọ́ kò fi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
- issue: Ohun tí αὐτοῦ (‘rẹ̀’) ń tọ́ka sí
  choice: A ka ‘rẹ̀’ sí ohun tí ó ń tọ́ka sí ara tí ó lè kú.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí àwọn ìfẹ́kúfẹ̀ẹ́ ẹ̀ṣẹ̀.
  rationale: Ìrísí arọ́pò-orúkọ Gíríìkì bá ‘ara’ tó jẹ́ aláìlẹ́mìí, ẹyọ kan mu ju ‘ẹ̀ṣẹ̀’ tó jẹ́ abo lọ; síbẹ̀, àyíká lè jẹ́ kí ẹlòmíràn so ó mọ́ ẹ̀ṣẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe, ọ̀wọ̀, àti èdè òde òní ni a lò. ‘Jẹ ọba’ pa àwòrán ìjọba inú Gíríìkì mọ́, ‘ara ... tí ó lè kú’ sì yé òǹkàwé lásán. A lò ‘ẹ’ gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμῶν.
