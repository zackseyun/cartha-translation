revisions:
- from: Nítorí náà, ẹ má ṣe jẹ́ kí ẹ̀ṣẹ̀ jẹ ọba nínú ara yín tí ó lè kú, kí ẹ sì máa ṣègbọràn sí àwọn ìfẹ́kúfẹ̀ẹ́ rẹ̀.[a]
  to: Nítorí náà, ẹ má ṣe jẹ́ kí ẹ̀ṣẹ̀ jẹ ọba nínú ara yín tí ó lè kú, kí ẹ má bàa ṣègbọràn sí àwọn ìfẹ́kúfẹ̀ẹ́ rẹ̀.[a]
