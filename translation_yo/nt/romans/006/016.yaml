revisions:
- from: Ẹ̀yin kò ha mọ̀ pé ẹni tí ẹ fi ara yín fún gẹ́gẹ́ bí ẹrú láti máa ṣègbọràn sí, ẹrú ẹni tí ẹ ń ṣègbọràn sí ni yín—ìbáà ṣe ti ẹ̀ṣẹ̀ tí ń yọrí sí ikú, tàbí ti ìgbọràn tí ń yọrí sí òdodo[a]?
  to: Ẹ kò ha mọ̀ pé ẹni tí ẹ fi ara yín fún gẹ́gẹ́ bí ẹrú fún ìgbọràn, ẹrú ẹni tí ẹ ń ṣègbọràn sí ni ẹ jẹ́—yálà ti ẹ̀ṣẹ̀ tí ń yọrí sí ikú, tàbí ti ìgbọràn tí ń yọrí sí òdodo[a]?
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀-ìṣe "láti máa ṣègbọràn sí" pẹ̀lú "fún ìgbọràn" láti pa εἰς ὑπακοήν mọ́ gẹ́gẹ́ bí gbolohun orúkọ, láti mú ìṣọ̀kan gírámà Yorùbá dára sí i, àti láti yẹra fún "sí" tí kò ní ohun tó ń tọ́ka sí. A tún mú ìbẹ̀rẹ̀ ìbéèrè náà rọrùn sí "Ẹ kò ha mọ̀."
  reviewer_model: gpt-5.6-terra
