id: ROM.6.16
reference: Romans 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: yo
  text: Ẹ kò ha mọ̀ pé ẹni tí ẹ fi ara yín fún gẹ́gẹ́ bí ẹrú fún ìgbọràn, ẹrú ẹni tí ẹ ń ṣègbọràn sí ni ẹ jẹ́—yálà ti ẹ̀ṣẹ̀ tí ń yọrí sí ikú, tàbí ti ìgbọràn tí ń yọrí sí òdodo[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ìdájọ́ òdodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: ẹ fi ara yín fún
  rationale: Ó sọ nípa fífi ara ẹni sílẹ̀ fún ìṣàkóso ẹlòmíràn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò túmọ̀ ọ̀rọ̀ náà ju bí Gíríìkì ṣe sọ lọ.
- source_word: δούλους / δοῦλοί
  choice: ẹrú / ẹrú ... ni yín
  rationale: “Ẹrú” pa ipò ẹni tí ó wà lábẹ́ agbára olúwa mọ́, èyí tí ó ṣe pàtàkì nínú àwòrán tí Pọ́ọ̀lù lò.
- source_word: εἰς ὑπακοήν
  choice: láti máa ṣègbọràn sí
  rationale: Ìtumọ̀ yìí fi ète fífi ara ẹni fún hàn ní Yorùbá tí ó rọrùn, bó tilẹ̀ jẹ́ pé ó yí orúkọ “ìgbọràn” padà sí ọ̀rọ̀-ìṣe ní apá yìí.
- source_word: ᾧ ὑπακούετε
  choice: ẹni tí ẹ ń ṣègbọràn sí
  rationale: Ó pa ìbáṣepọ̀ ẹni àti olúwa tí àyíká ẹsẹ náà ń tọ́ka sí mọ́ láìfi orúkọ “olúwa” kún Gíríìkì.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: A pa ọ̀rọ̀ tààrà “ẹ̀ṣẹ̀” mọ́, a sì jẹ́ kí àwòrán ẹrú inú gbólóhùn náà fúnra rẹ̀ fi hàn pé a ń sọ ẹ̀ṣẹ̀ bí ẹni pé ó jẹ́ olúwa.
- source_word: εἰς θάνατον
  choice: tí ń yọrí sí ikú
  rationale: Ó fi ipa ìtọ́sọ́nà tàbí àbájáde εἰς hàn ní ọ̀nà tí ó ṣe kedere ní Yorùbá òde òní.
- source_word: ὑπακοῆς
  choice: ìgbọràn
  rationale: Orúkọ àìṣe “ìgbọràn” pa ìfiwéra Pọ́ọ̀lù láàárín ẹ̀ṣẹ̀ àti ìgbọràn mọ́.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún ìtumọ̀ ìwà àti ipò títọ́ níwájú Ọlọ́run; ó sì gbòòrò ju ìdájọ́ láwùjọ nìkan lọ.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ìfiwéra Pọ́ọ̀lù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Àyíká náà ń fi ẹrú ẹ̀ṣẹ̀ tí ó yọrí sí ikú wé ìgbọràn tí ó yọrí sí δικαιοσύνη. “Òdodo” pa ìtumọ̀ ìwà rere àti ti ẹ̀kọ́ ìgbàgbọ́ mọ́; àṣàyàn tó tẹnu mọ́ justice wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye. “Ẹ̀yin” mú àdísọ ọ̀pọ̀ ènìyàn inú Gíríìkì hàn kedere; “ìbáà ṣe ... tàbí ...” sì gbé ìyàtọ̀ méjèèjì kalẹ̀ lọ́nà àdánidá.
