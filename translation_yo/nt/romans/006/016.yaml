  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì mọ́: fífi ara ẹni sí ìkáwọ́ ẹni mìíràn, ìbáṣepọ̀ ẹrú, ẹ̀ṣẹ̀ sí ikú, àti ìgbọràn sí òdodo. Ṣùgbọ́n ìṣọ̀kan gírámà nínú gbólóhùn àkọ́kọ́ nílò àtúnṣe kí ''sí'' má bàa dá sílẹ̀ láìní ìpìlẹ̀ kedere.'
  naturalness: '"láti máa ṣègbọràn sí" lẹ́yìn "gẹ́gẹ́ bí ẹrú" fi "sí" sílẹ̀ ní ibi tí ohun tí a ń ṣègbọràn sí kò hàn kedere. Lílò "fún ìgbọràn" pa ìtumọ̀ orúkọ Gíríìkì mọ́, ó sì jẹ́ kí gbolohun náà rọrùn, kedere, àti àdánidá ní Yorùbá.'
  terminology: '"Ẹrú," "ẹ̀ṣẹ̀," "ìgbọràn," "ikú," àti "òdodo" yẹ, wọ́n sì bá ìforígbárí Pọ́ọ̀lù mu. Àlàyé ìsàlẹ̀ fún "ìdájọ́ òdodo" jẹ́ àṣàyàn lexical tí ó yẹ.'
