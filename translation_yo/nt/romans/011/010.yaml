  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ‘Kí’ ń gbé agbára ìfẹ́-aláṣẹ náà kalẹ̀; ‘ojú wọn ṣókùnkùn’ pa àwòrán σκοτισθήτωσαν mọ́; ‘kí wọn má bàa rí’ ń sọ abajade/ìdí τοῦ μὴ βλέπειν; ‘kí o sì máa tẹ ẹ̀yìn wọn ba nígbà gbogbo’ ń dá ìpè ọlọ́run-ìdájọ́ σύγκαμψον àti διὰ παντός padà. Kò yẹ kí a yí i sí àsọtẹ́lẹ̀ tàbí dín líle ìpè náà kù.'
