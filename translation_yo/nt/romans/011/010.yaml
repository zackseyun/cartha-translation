  terminology: '‘Ṣókùnkùn’ yẹ fún ìmọ́lẹ̀/òkùnkùn tí ọrọ̀ Gíríìkì ń gbé kalẹ̀. ‘Ẹ̀yìn’ àti ‘tẹ ... ba’ ń pa àwòrán ara ẹni tí a tẹ ba mọ́. Àmì-ẹsẹ̀ a nikan ni a tún ṣe: ‘fọ́jú’ lè túmọ̀ sí pípa ojú mọ́ tàbí ìṣe tí ẹni fúnra rẹ̀ ṣe, nítorí náà ‘di afọ́jú’ dáa ju u lọ gẹ́gẹ́ bí àṣàyàn fún ‘be blinded.’'
