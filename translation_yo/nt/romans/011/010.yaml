id: ROM.11.10
reference: Romans 11:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: yo
  text: Kí ojú wọn ṣókùnkùn, kí wọn má bàa rí,[a] kí o sì máa tẹ ẹ̀yìn wọn ba nígbà gbogbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “kí wọ́n di afọ́jú.” Gíríìkì sọ ní tààrà pé kí ojú wọn “ṣókùnkùn,” èyí sì pa àwòrán òkùnkùn inú ọ̀rọ̀ náà mọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní gbogbo ìgbà.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ohun tí ń bá a lọ tàbí ohun tí ó máa ń wà déédéé.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: Kí ... ṣókùnkùn
  rationale: Ọ̀rọ̀ yìí fi àṣẹ tàbí ìfẹ́ aláṣẹ ẹni-kẹta hàn ní ọ̀nà àìṣe, ó sì pa àwòrán òkùnkùn inú Gíríìkì àti inú ọ̀rọ̀ Sáàmù tí a fa yọ mọ́.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ojú wọn
  rationale: Ó túmọ̀ sí ‘ojú wọn’ ní tààrà; a pa àwòrán ẹ̀yà ara náà mọ́ nítorí pé ó ṣe pàtàkì sí àkàwé inú ẹsẹ̀ náà.
- source_word: τοῦ μὴ βλέπειν
  choice: kí wọn má bàa ríran
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì jẹ́ kí ìbáṣepọ̀ ète àti àbájáde inú gbólóhùn Gíríìkì dúró láìfi dandan yan ọ̀kan ṣoṣo.
- source_word: τὸν νῶτον αὐτῶν
  choice: ẹ̀yìn wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé ‘ẹ̀yìn’ wà ní ẹyọ kan nínú Gíríìkì, Yorùbá náà lè lo ẹyọ kan pẹ̀lú ‘wọn’ ní ìtumọ̀ pínpín fún gbogbo wọn.
- source_word: διὰ παντός
  choice: nígbà gbogbo
  rationale: Ó ń tọ́ka sí ohun tí ń bá a lọ tàbí tí ó máa ń ṣẹlẹ̀ déédéé; kò fi dandan túmọ̀ sí ‘títí láéláé.’
- source_word: σύγκαμψον
  choice: máa tẹ ... ba
  rationale: Ó pa àwòrán ti títẹ ẹ̀yìn ẹni ba mọ́, ó sì fi àṣẹ tí a ń sọ sí ẹni kan—ní àyíká yìí, Ọlọ́run—hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ọ̀rọ̀ ègún adúrà àti iṣẹ́ Ọlọ́run
  choice: 'A pa agbára ìfẹ́ aláṣẹ/àṣẹ náà mọ́: ‘Kí ojú wọn ṣókùnkùn ... kí o sì máa tẹ ẹ̀yìn wọn ba.’'
  alternative: Kí a sọ ọ́ di àsọtẹ́lẹ̀ lásán, tàbí kí a sọ ìdájọ́ náà láìfi ẹni tó ń ṣe é hàn.
  rationale: Pọ́ọ̀lù ń fa ọ̀rọ̀ Ìwé Mímọ́ yọ ní ìrísí adúrà ìdájọ́. Ìtumọ̀ kò gbọ́dọ̀ dín líle ọ̀rọ̀ náà kù, bẹ́ẹ̀ ni kò gbọ́dọ̀ fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. ‘Kí ...’ pa ìrísí adúrà-aláṣẹ mọ́; ‘máa tẹ ... ba’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ títẹ ẹ̀yìn ba léraléra tàbí láìdáwọ́ dúró.
