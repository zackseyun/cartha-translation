source:
  edition: SBLGNT
  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: yo
  text: Ìwọ yóò wí nígbà náà pé, “A ṣẹ́ àwọn ẹ̀ka kúrò kí a lè lọ́ mi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: Ìwọ yóò wí
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú, ẹni kejì ẹyọ kan, ni. Fífi “Ìwọ” hàn dá ìjíròrò Pọ́ọ̀lù pẹ̀lú ẹni tí ó ń dáhùn nínú ọ̀rọ̀ rẹ̀ mọ́, ó sì tẹ̀ lé ìrísí Gíríìkì.
- source_word: οὖν
  choice: nígbà náà
  rationale: Ó so èrò yìí mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ gẹ́gẹ́ bí ìyọrísí nínú ìjíròrò; “nígbà náà” jẹ́ ọ̀nà àdánidá láti fi ìlọsíwájú ọ̀rọ̀ náà hàn ní Yorùbá.
- source_word: Ἐξεκλάσθησαν
  choice: A ṣẹ́ ... kúrò
  rationale: Ọ̀rọ̀ náà jẹ́ àìṣe-ẹni pàtó ní Gíríìkì, ó sì túmọ̀ sí pé a ṣẹ́ wọn kúrò lára igi. Ìlò “a” aláìtọ́ka pa ìtumọ̀ yẹn mọ́ láìsọ ẹni tó ṣe é.
- source_word: κλάδοι
  choice: àwọn ẹ̀ka
  rationale: Èyí ni ìtumọ̀ tààrà nínú àkàwé igi ólífì; kò yí àwòrán iṣẹ́ ọ̀gbìn náà padà.
- source_word: ἵνα
  choice: kí
  rationale: “Kí” ṣàfihàn ète tàbí àbájáde tí ẹni tí ń sọ̀rọ̀ náà ń fi síwájú, láìpinnu ju bí Gíríìkì ṣe pinnu lọ.
- source_word: ἐγὼ
  choice: mi
  rationale: Arọ́pò-orúkọ ẹni kìíní wà ní kedere; Yorùbá fi í sí ipò àṣeparí lẹ́yìn ọ̀rọ̀-ìṣe nínú ìtumọ̀ àdánidá yìí.
- source_word: ἐγκεντρισθῶ
  choice: a lè lọ́ mi sínú rẹ̀
  rationale: Ìkọ́lé pẹ̀lú “a” aláìtọ́ka mú ohùn àìṣe ẹni pàtó Gíríìkì jáde ní Yorùbá. “Lọ́ ... sínú” pa àwòrán fífi ẹ̀ka kan sínú igi mìíràn mọ́; “rẹ̀” tọ́ka sí igi ólífì inú àyíká ọ̀rọ̀ láìfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
theological_decisions:
- issue: Bóyá kí a sọ ní kedere pé ẹni tí Pọ́ọ̀lù ń bá sọ̀rọ̀ jẹ́ ẹni àròsọ nínú ìjíròrò rẹ̀
  choice: Pa ọ̀rọ̀ ẹni kejì tààrà “Ìwọ yóò wí” mọ́
  alternative: Ẹnì kan lè wí nígbà náà
  rationale: Gíríìkì sọ ẹni kejì ẹyọ kan ní tààrà. Ṣíṣàlàyé ẹni náà gẹ́gẹ́ bí “ẹnì kan” yóò fi ohun tí kò sí nínú ẹsẹ náà kún un.
- issue: Bóyá kí gbólóhùn ète náà di ìjẹ́wọ́ nípa ète Ọlọ́run
  choice: Túmọ̀ ẹ̀sùn ẹni tí ń sọ̀rọ̀ náà ní tààrà pé “kí a lè lọ́ mi sínú rẹ̀”
  alternative: Nítorí náà ni Ọlọ́run ṣe ṣẹ́ wọn kúrò, kí ó lè lọ́ mi sínú rẹ̀
  rationale: Ẹsẹ náà ń ròyìn ìpinnu tí ẹni tí Pọ́ọ̀lù ń bá sọ̀rọ̀ fà jáde; kò sọ pé Pọ́ọ̀lù fọwọ́ sí i, kò sì dárúkọ Ọlọ́run gẹ́gẹ́ bí olùṣe nínú gbólóhùn náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọ̀wọ̀, àdánidá. Ìkọ́lé “a” aláìtọ́ka ni a lò láti ṣàfihàn ohùn àìṣe ẹni pàtó, nígbà tí “lọ́ ... sínú” pa àkàwé iṣẹ́ àlọ́mọ̀-ẹ̀ka mọ́.
