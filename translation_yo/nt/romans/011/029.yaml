  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: yo
  text: Nítorí àwọn ẹ̀bùn àti ìpè Ọlọ́run kò ṣeé dá padà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kì í kábàámọ̀ wọn,” tàbí “a kì í gba wọ́n padà.” Àwọn ìtumọ̀ Gẹ̀ẹ́sì àtijọ́ kan máa ń túmọ̀ rẹ̀ sí “láìsí ìrònúpìwàdà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: kò ṣeé dá padà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí a kì í kábàámọ̀ tàbí tí a kì í gba padà. Nínú àyíká yìí, gbólóhùn yìí sọ ní èdè Yorùbá àdánidá pé Ọlọ́run kì í fagilé tàbí gba àwọn ẹ̀bùn àti ìpè rẹ̀ padà, láì sọ pé wọn kò lè yí padà ní gbogbo ọ̀nà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: τὰ χαρίσματα
  choice: àwọn ẹ̀bùn
  rationale: Ó pa nọ́ńbà púpọ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún àwọn ohun tí Ọlọ́run fi oore-ọ̀fẹ́ fúnni.
- source_word: ἡ κλῆσις
  choice: ìpè
  rationale: “Ìpè” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa ìtumọ̀ ìpè tàbí ìkésíni Ọlọ́run mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsọ̀kan ọ̀rọ̀ Yorùbá yìí jẹ́ kí Ọlọ́run jẹ́ orísun tàbí ẹni tí àwọn ẹ̀bùn àti ìpè náà jẹ́ tirẹ̀, nígbà tí ó ṣì pa ààyè ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ “àwọn ẹ̀bùn àti ìpè Ọlọ́run” nínú àyíká ọ̀rọ̀
  choice: A kò sọ nínú ìtumọ̀ náà bóyá ó ń tọ́ka sí àwọn àǹfààní àti ìpè Ísírẹ́lì nìkan tàbí sí ìlànà gbogbogbò nípa àwọn ẹ̀bùn àti ìpè Ọlọ́run.
  alternative: Kí a sọ ní pàtó pé ó jẹ́ ti Ísírẹ́lì, tàbí kí a mú un gbooro sí gbogbo ìpè oore-ọ̀fẹ́ Ọlọ́run.
  rationale: Róòmù 9–11 ń sọ̀rọ̀ ní pàtàkì nípa Ísírẹ́lì, ṣùgbọ́n gbólóhùn Gíríìkì fúnra rẹ̀ kò tún ẹni tí a ń pè tàbí àwọn ẹ̀bùn náà jẹ́ sílẹ̀ ní kedere; nítorí náà, ìtumọ̀ náà pa àìmọ́ pàtó yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó rọrùn fún òǹkàwé òde òní. “Kò ṣeé dá padà” jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ewé fi àwọn ojú ìtumọ̀ yòókù hàn.
