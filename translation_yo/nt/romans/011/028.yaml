id: ROM.11.28
reference: Romans 11:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: yo
  text: Ní ti ìhìn rere[a], ọ̀tá ni wọ́n nítorí yín; ṣùgbọ́n ní ti ìyànfẹ́, olùfẹ́ ni wọ́n nítorí àwọn baba ńlá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ní ti ìhìn rere, ọ̀tá ni wọ́n nítorí yín … ṣùgbọ́n ní ti ìyànfẹ́, olùfẹ́ ni wọ́n nítorí àwọn baba ńlá.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn baba ńlá” ń tọ́ka sí àwọn baba ìran Ísírẹ́lì, pàápàá Ábúráhámù, Ísáákì àti Jákọ́bù.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: Ní ti ìhìn rere
  rationale: “Ní ti” fi ẹ̀ka tàbí ojú-ìwòye tí κατά pẹ̀lú accusative ń tọ́ka sí hàn, ó sì pa ìtakora μέν…δέ mọ́ ní Yorùbá àdánidá.
- source_word: ἐχθροὶ
  choice: ọ̀tá
  rationale: Ọ̀rọ̀ náà jẹ́ adjective tí a lò gẹ́gẹ́ bí àpèjúwe predicative; “ọ̀tá ni wọ́n” pa agbára ìbáṣepọ̀ rẹ̀ mọ́ láì sọ pé Ọlọ́run kórìíra wọn pátápátá.
- source_word: δι’ ὑμᾶς
  choice: nítorí tiyín
  rationale: Èyí lè ṣàfihàn ìdí tàbí àǹfààní fún àwọn olùgbọ́; “nítorí tiyín” jẹ́ Yorùbá àdánidá fún “for your sake” láì fi àlàyé míì kún un.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: ṣùgbọ́n ní ti ìyànfẹ́
  rationale: “Ní ti” tún pa ìṣọ̀kan àgbékalẹ̀ Gíríìkì mọ́, “ìyànfẹ́” sì jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún yíyan Ọlọ́run nínú àyíká yìí.
- source_word: ἀγαπητοὶ
  choice: olùfẹ́
  rationale: “Olùfẹ́ ni wọ́n” fi hàn pé a nífẹ̀ẹ́ wọn, ó sì pa ìwọ̀n ẹ̀kọ́ àti ìtakora rẹ̀ pẹ̀lú “ọ̀tá” mọ́.
- source_word: διὰ τοὺς πατέρας
  choice: nítorí àwọn baba ńlá
  rationale: “Nítorí” ṣàfihàn ìdí tàbí ìpìlẹ̀; “àwọn baba ńlá” jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí àwọn baba ìran, pàápàá àwọn baba ńlá Ísírẹ́lì.
theological_decisions:
- issue: Àwọn tí “wọ́n” ń tọ́ka sí
  choice: A fi “wọ́n” sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ orísun, kí ó lè tọ́ka sí Ísírẹ́lì gẹ́gẹ́ bí àwùjọ nínú Róòmù 9–11.
  alternative: Kí a sọ ọ́ di “àwọn Júù aláìgbàgbọ́ ìgbà Paulu” nìkan.
  rationale: Àyíká náà ń sọ̀rọ̀ nípa Ísírẹ́lì lápapọ̀, bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ wọn kò gba ìhìn rere gbọ́ nígbà náà; a kò gbọdọ̀ dín ìtọ́kasí Gíríìkì kù.
- issue: Ìtumọ̀ “ọ̀tá”
  choice: A pa “ọ̀tá” àti “olùfẹ́” méjèèjì mọ́ gẹ́gẹ́ bí ìtakora tí ẹsẹ náà fúnra rẹ̀ gbé kalẹ̀.
  alternative: Kí “ọ̀tá” túmọ̀ sí pé Ọlọ́run kórìíra wọn pátápátá, tàbí kí a sọ ọ́ di àtakò láwùjọ lásán.
  rationale: Ẹsẹ náà kò yanjú ìfọ̀kànbalẹ̀ ẹ̀kọ́ yìí nípa pípa ọ̀kan rẹ́; ó gbé ipò wọn ní ti ìhìn rere lẹ́gbẹ̀ẹ́ ìfẹ́ tí ó ní í ṣe pẹ̀lú ìyànfẹ́.
- issue: Ìtumọ̀ “àwọn baba ńlá”
  choice: Ó tọ́ka sí àwọn baba ìran Ísírẹ́lì, pàápàá Ábúráhámù, Ísáákì àti Jákọ́bù.
  alternative: Àwọn baba ìran lápapọ̀ láìsí ìtọ́kasí pàtàkì sí àwọn baba ńlá májẹ̀mú.
  rationale: Nínú Róòmù 9–11, ọ̀rọ̀ náà rántí àwọn baba ńlá àti àwọn ìlérí Ọlọ́run sí wọn; àlàyé ìsàlẹ̀ ojú-ewé ló mú èyí ṣe kedere láì fa ọ̀rọ̀ inú ẹsẹ gùn.
translation_notes:
  register: A lo Yorùbá boṣewa, ìgbàlódé, tó ní ọlá, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àgbékalẹ̀ “Ní ti … ṣùgbọ́n ní ti …” pa ìṣọ̀kan àti ìtakora inú Gíríìkì mọ́, nígbà tí “ọ̀tá ni wọ́n / olùfẹ́ ni wọ́n” jẹ́ kíkà tó rọrùn fún òǹkàwé Yorùbá òde òní.
