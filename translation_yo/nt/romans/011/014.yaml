  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: yo
  text: Bóyá mo lè mú àwọn ènìyàn ẹ̀yà mi jowú, kí n sì gba àwọn kan nínú wọn là[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹran ara mi”; ìyẹn ni, àwọn ènìyàn ẹ̀yà mi, àwọn ẹlẹgbẹ́ Júù mi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: bí ó bá ṣeé ṣe
  rationale: Ó fi ìrètí tàbí ète tí kò dá lójú hàn, láì sọ ọ́ di ohun tí yóò ṣẹlẹ̀ dájúdájú.
- source_word: παραζηλώσω
  choice: kí n ru ... sókè sí owú
  rationale: Ó pa agbára ọ̀rọ̀ náà mọ́ pé Pọ́ọ̀lù fẹ́ mú kí owú dìde nínú wọn, ó sì bá àyíká ọ̀rọ̀ nípa owú Ísírẹ́lì mu.
- source_word: μου τὴν σάρκα
  choice: àwọn ènìyàn ẹ̀yà mi
  rationale: Ní àyíká yìí, ‘ẹran ara mi’ jẹ́ àkànlò èdè fún àwọn tí wọ́n jẹ́ ìbátan Pọ́ọ̀lù nípa ẹ̀yà, ìyẹn àwọn Júù ẹlẹgbẹ́ rẹ̀. Ìtumọ̀ yìí jẹ́ adayébá ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀rọ̀ gangan hàn.
- source_word: σώσω
  choice: kí n ... gba ... là
  rationale: ‘Gba là’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìgbàlà, ó sì pa ìtumọ̀ ẹ̀kọ́ ìgbàlà inú ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: τινὰς ἐξ αὐτῶν
  choice: àwọn kan nínú wọn
  rationale: Ó sọ ní kedere pé apá kan lára ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ni, kì í ṣe gbogbo wọn.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nígbà tí Pọ́ọ̀lù ń tọ́ka sí ẹgbẹ́ ẹ̀yà tirẹ̀
  choice: àwọn ènìyàn ẹ̀yà mi
  alternative: ẹran ara mi
  rationale: Níbí, σάρξ kò túmọ̀ sí ìwà ẹlẹ́ṣẹ̀, bí kò ṣe ìbátan ti ẹ̀dá àti ti ẹ̀yà. Ọ̀rọ̀ inú ẹsẹ̀ jẹ́ kíkà tí ó ṣe kedere ní Yorùbá, àlàyé ìsàlẹ̀ sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ìbáṣepọ̀ ipa Pọ́ọ̀lù pẹ̀lú ìgbàlà
  choice: kí n sì gba àwọn kan ... là
  alternative: kí Ọlọ́run sì tipasẹ̀ iṣẹ́ mi gba àwọn kan là
  rationale: A pa ọ̀nà tí Pọ́ọ̀lù gbà sọ ọ́ mọ́, láì fi àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ̀ kún un. Ọ̀rọ̀ náà fi ipa iṣẹ́ ìránṣẹ́ rẹ̀ hàn, kò sì nílò kí a yanjú gbogbo ìbéèrè nípa aṣojú ìkẹyìn ti ìgbàlà nínú ìtumọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Àwọn ènìyàn ẹ̀yà mi’ jẹ́ adayébá ju ‘ẹran ara mi’ lọ fún ìbátan ẹ̀yà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àkànlò orísun mọ́.
