  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: yo
  text: “Olúwa, wọ́n pa àwọn wòlíì rẹ, wọ́n wó àwọn pẹpẹ rẹ lulẹ̀, èmi nìkan ni ó ṣẹ́ kù, wọ́n sì ń wá ìwàláàyè mi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gangan, “wọ́n ń wá ẹ̀mí mi”; nínú àṣà ọ̀rọ̀ Gíríìkì níbí, ìtumọ̀ rẹ̀ ni pé wọ́n ń wá ọ̀nà láti pa mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Olúwa
  rationale: Ọ̀rọ̀ ìpè sí Ọlọ́run ni κύριε nínú àyíká yìí; “Olúwa” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó sì ní iyì.
- source_word: ἀπέκτειναν
  choice: wọ́n pa
  rationale: “Pa” sọ ìṣe pípa jáde ní kedere láìfi ìtumọ̀ àfikún bí “wọ́n paniyan” kún un.
- source_word: τὰ θυσιαστήριά σου
  choice: àwọn pẹpẹ rẹ
  rationale: “Pẹpẹ” ni ọ̀rọ̀ Yorùbá tí a sábà lò fún ibi ìrúbọ; àyíká náà ti mú kí ìtumọ̀ rẹ̀ ṣe kedere láìní láti fi “ìrúbọ” kún un.
- source_word: κατέσκαψαν
  choice: wọ́n wó ... lulẹ̀
  rationale: Gbólóhùn yìí pa ìtumọ̀ fífọ́ tàbí fífọ́ ohun kan dé ìpìlẹ̀ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: èmi nìkan sì ni ó ṣẹ́ kù
  rationale: Èyí tẹnu mọ́ pé ẹni kan ṣoṣo ni ó kù, gẹ́gẹ́ bí μόνος ṣe ń fi hàn, ó sì dá ìtumọ̀ passive ὑπελείφθην mọ́ nínú Yorùbá àdánidá.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: wọ́n sì ń wá ẹ̀mí mi
  rationale: “Ń wá” fi ìṣe tó ń lọ lọ́wọ́ hàn; “ẹ̀mí mi” túmọ̀ sí ìwàláàyè ẹni nínú gbólóhùn ìhalẹ̀ yìí, kì í ṣe ẹ̀kọ́ nípa apá àìrí ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú gbólóhùn ìhalẹ̀
  choice: ẹ̀mí mi, ní ìtumọ̀ ìwàláàyè mi
  alternative: ọkàn mi; wọ́n ń gbìyànjú láti pa mí
  rationale: Níbí, ψυχή ń tọ́ka sí ìwàláàyè Elijah tí àwọn ọ̀tá ń lépa láti mú kúrò, kì í ṣe sí “ọkàn” gẹ́gẹ́ bí ẹ̀kọ́ nípa ìṣedá ènìyàn. A pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, a sì ṣàlàyé ìtumọ̀ rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa alámi ohùn ni a lò, pẹ̀lú èdè tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Ìtẹnumọ́ “èmi nìkan” pa agbára μόνος mọ́; “wó ... lulẹ̀” sì mú àwòrán ìparun pẹpẹ náà hàn ní kedere.
