id: ROM.11.11
reference: Romans 11:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: yo
  text: Nítorí náà, mo béèrè pé, ṣé wọ́n kọsẹ̀ kí wọ́n lè ṣubú ni[a]? Kí ó má ṣe rí bẹ́ẹ̀ rárá! Kàkà bẹ́ẹ̀, nípasẹ̀ ìrékọjá wọn[b] ni ìgbàlà ti dé ọ̀dọ̀ àwọn aláì-Júù[c], láti mú wọn jowú[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n baà lè ṣubú.” Èdè Gíríìkì náà fi ‘kọsẹ̀’ yà sọ́tọ̀ kúrò ní ‘ṣubú,’ ìbéèrè náà sì ń retí ìdáhùn ‘rárá.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ ìrìnà wọn.”
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “àwọn orílẹ̀-èdè”; ní àyíká yìí, ó túmọ̀ sí àwọn ènìyàn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “láti ru wọn sókè sí owú”; èyí lè ní ìtumọ̀ mímú kí wọ́n fẹ́ wá ìgbàlà kan náà.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Nítorí náà, mo béèrè pé
  rationale: Nínú ọ̀rọ̀ yìí, λέγω ń ṣí ìbéèrè àsọyé Pọ́ọ̀lù sílẹ̀, οὖν sì so ó mọ́ ohun tó ṣáájú. ‘Mo béèrè pé’ jẹ́ èdè Yorùbá àdánidá fún ipa yìí.
- source_word: μὴ ἔπταισαν
  choice: wọ́n kò kọsẹ̀ ... àbí?
  rationale: μή pẹ̀lú ọ̀rọ̀-ìṣe atọ́ka ń retí ìdáhùn òdì. Ìbéèrè tó parí sí ‘àbí?’ mú ìretí yẹn hàn, ‘kọsẹ̀’ sì pa àwòrán πταίω mọ́.
- source_word: ἵνα πέσωσιν
  choice: láti ṣubú
  rationale: Ìtumọ̀ yìí pa ìyàtọ̀ tó wà láàárín ‘kọsẹ̀’ àti ‘ṣubú’ mọ́, láì fi èrò bí ‘ṣubú tán pátápátá’ kún ọ̀rọ̀ Gíríìkì.
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀!
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ìkọ̀sílẹ̀ líle tó tún pa ìrísí ìfẹ́-ọkàn optative ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: nípasẹ̀ ìrékọjá wọn
  rationale: ‘Ìrékọjá’ sọ ìṣe tí kò tọ́ tàbí transgression di mímọ̀, ó sì bá dative ohun-èlò mu nípasẹ̀ ‘nípasẹ̀.’
- source_word: ἡ σωτηρία
  choice: ìgbàlà
  rationale: ‘Ìgbàlà’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ìwọ̀n ẹ̀kọ́ ìgbàlà ti σωτηρία nínú Róòmù.
- source_word: τοῖς ἔθνεσιν
  choice: àwọn Kèfèrí
  rationale: Nínú ìyàtọ̀ Júù àti aláìní-Júù nínú Róòmù 9–11, ἔθνη tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. ‘Àwọn Kèfèrí’ jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tó ṣe kedere ní àyíká yìí.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: láti mú wọn jowú
  rationale: Gbólóhùn náà sọ ète tàbí àbájáde, ‘mú wọn jowú’ sì pa àìdánilójú παραζηλόω mọ́ láàárín owú àti ìfẹ́ láti ní ìbùkún kan náà.
theological_decisions:
- issue: Bóyá ìkọsẹ̀ Ísírẹ́lì túmọ̀ sí ìṣubú ìkẹyìn tí kò ṣeé yí padà
  choice: Ẹsẹ̀ náà sẹ́ pé wọ́n kọsẹ̀ kí wọ́n lè ṣubú.
  alternative: A lè ka ọ̀rọ̀ náà gẹ́gẹ́ bí sísẹ́ ìwópalẹ̀ lẹ́sẹ̀kẹsẹ̀ nìkan, tàbí ìṣubú tó pé ṣùgbọ́n tó jẹ́ fún ìgbà díẹ̀.
  rationale: A pa ọ̀rọ̀ méjì náà, ‘kọsẹ̀’ àti ‘ṣubú,’ mọ́ lọ́tọ̀ọ̀tọ̀, a kò sì fi ‘pátápátá’ tàbí ‘láìlè dìde mọ́’ kún un.
- issue: Ìtumọ̀ èdè owú nínú ètò ìgbàlà
  choice: Ìgbàlà àwọn Kèfèrí ní ète tàbí àbájáde mímú Ísírẹ́lì jowú.
  alternative: Owú náà lè jẹ́ ìlara òdì lásán, tàbí ìfẹ́ láti wá ìgbàlà kan náà.
  rationale: παραζηλόω lè túmọ̀ sí jíjí owú dìde, ó sì tún lè ní àbájáde fífúnni ní ìfẹ́ láti ní ohun rere kan náà; a kò yanju àìdánilójú náà nínú àkọ́kọ́.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Kí ó má rí bẹ́ẹ̀!’ mú agbára ìkọ̀sílẹ̀ Pọ́ọ̀lù hàn; ‘kọsẹ̀’ àti ‘ṣubú’ sì pa eré-ọ̀rọ̀ àti ìyàtọ̀ Gíríìkì mọ́. ‘Kèfèrí’ ni a lò ní ìtumọ̀ Bíbélì rẹ̀ fún àwọn tí kì í ṣe Júù, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
