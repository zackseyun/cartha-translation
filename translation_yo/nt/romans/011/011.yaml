revisions:
- from: Nítorí náà, mo béèrè pé, wọ́n kò kọsẹ̀ láti ṣubú, àbí? Kí ó má rí bẹ́ẹ̀! Kàkà bẹ́ẹ̀, nípasẹ̀ ìrékọjá wọn[a] ni ìgbàlà dé ọ̀dọ̀ àwọn Kèfèrí[b], láti mú wọn jowú[c].
  to: Nítorí náà, mo béèrè pé, ṣé wọ́n kọsẹ̀ kí wọ́n lè ṣubú ni[a]? Kí ó má ṣe rí bẹ́ẹ̀ rárá! Kàkà bẹ́ẹ̀, nípasẹ̀ ìrékọjá wọn[b] ni ìgbàlà ti dé ọ̀dọ̀ àwọn aláì-Júù[c], láti mú wọn jowú[d].
  rationale: Àtúnṣe náà yí ‘Kèfèrí’ padà sí ‘aláì-Júù’ kí ìtumọ̀ Pauline ti τοῖς ἔθνεσιν lè ṣe kedere ní Yorùbá òde òní. A tún ṣe ìbéèrè àkọ́kọ́ ní ọ̀nà Yorùbá tó dára síi, láì yí ìtumọ̀, àìdánilójú, tàbí ìforígbárí ‘kọsẹ̀/ṣubú’ nínú orísun padà. A fi àlàyé ìsàlẹ̀ kan kún un fún ìyàtọ̀ náà, a sì ṣètò àwọn àmì àlàyé ìsàlẹ̀ ní títẹ̀lé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:29:07Z'
