  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: yo
  text: Èyí sì ni májẹ̀mú mi pẹ̀lú wọn[a], nígbà tí mo bá mú àwọn ẹ̀ṣẹ̀ wọn kúrò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó túbọ̀ tẹ̀ lé ọ̀rọ̀ Gíríìkì, “májẹ̀mú tí ó ti ọ̀dọ̀ mi wá sí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: májẹ̀mú
  rationale: Nínú àyọkà àsọtẹ́lẹ̀ tí Paulu ń tọ́ka sí, ọ̀rọ̀ náà túmọ̀ sí ìlérí tí Ọlọ́run fi dè ara rẹ̀ mọ́ àwọn ènìyàn rẹ̀; “májẹ̀mú” pa ìtumọ̀ àti ìwọ̀n ọ̀rọ̀ yìí mọ́.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: májẹ̀mú mi
  rationale: Bí ó tilẹ̀ jẹ́ pé gbólóhùn Gíríìkì náà túmọ̀ ní tààrà sí “májẹ̀mú tí ó ti ọ̀dọ̀ mi wá,” “májẹ̀mú mi” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì fi hàn pé Ọlọ́run ni orísun májẹ̀mú náà.
- source_word: αὐτοῖς
  choice: pẹ̀lú wọn
  rationale: Dátífù náà lè jẹ́ “sí wọn” tàbí “fún wọn,” ṣùgbọ́n “májẹ̀mú pẹ̀lú wọn” ni ọ̀rọ̀ Yorùbá àdánidá fún ìbáṣepọ̀ májẹ̀mú.
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Èyí sọ àkókò tí ìlérí àsọtẹ́lẹ̀ náà yóò ṣẹ, kì í ṣe ìṣẹ̀lẹ̀ tí ń ṣẹ léraléra.
- source_word: ἀφέλωμαι
  choice: mo bá mú ... kúrò
  rationale: Àfihàn yìí sọ pé Ọlọ́run yóò mú ẹ̀ṣẹ̀ kúrò; ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì pa àwòrán ìmúkúrò mọ́.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: àwọn ẹ̀ṣẹ̀ wọn
  rationale: Èyí pa nọ́ńbà púpọ̀ àti ìtumọ̀ ìwà-bí-Ọlọ́run-kò-fẹ́ tí ọ̀rọ̀ Gíríìkì náà ní mọ́.
- source_word: καὶ αὕτη
  choice: Èyí sì ni yóò jẹ́
  rationale: Gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe ní gbangba, ṣùgbọ́n àyíká àsọtẹ́lẹ̀ ń tọ́ka sí ìlérí ọjọ́ iwájú; fífi “yóò jẹ́” kún un mú kí Yorùbá náà pé láìfi èrò mìíràn kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ διαθήκη nínú àyọkà ìlérí àsọtẹ́lẹ̀
  choice: májẹ̀mú
  alternative: ìwé ìfẹ́ ẹni tí ó kú; àdéhùn
  rationale: “Májẹ̀mú” ló bá èdè àwọn wòlíì àti ìlérí ìràpadà Ọlọ́run mu, láìkó èrò nípa ìwé ogún tàbí àdéhùn lásán wọ inú ẹsẹ náà.
- issue: Agbára àkókò ὅταν ἀφέλωμαι
  choice: nígbà tí mo bá mú àwọn ẹ̀ṣẹ̀ wọn kúrò
  alternative: ní gbogbo ìgbà tí mo bá mú àwọn ẹ̀ṣẹ̀ wọn kúrò
  rationale: Àyíká náà jẹ́ ìlérí àsọtẹ́lẹ̀ nípa ohun tí Ọlọ́run yóò ṣe; “nígbà tí” pa ìdánilójú náà mọ́ láìsọ àkókò pàtó tàbí yí i padà sí ohun tí ń ṣẹ léraléra.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó bá yẹ, a sì lo “májẹ̀mú” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀ tí ó sì ṣe kedere.
