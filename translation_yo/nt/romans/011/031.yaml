id: ROM.11.31
reference: Romans 11:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni àwọn wọ̀nyí ti ṣàìgbọ́ràn nísinsìnyí, kí àwọn náà lè gba àánú nísinsìnyí nípasẹ̀ àánú tí Ọlọ́run fi hàn sí yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “nípasẹ̀ àánú yín.” A lè tú gbólóhùn Gíríìkì náà ní ọ̀nà yìí ní tààràtà; ṣùgbọ́n nínú àyíká ọ̀rọ̀, ó ṣeé ṣe jù pé ó ń tọ́ka sí àánú tí Ọlọ́run fi hàn sí yín.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni ... pẹ̀lú
  rationale: Ó fi ìfiwéra àti ìtẹ̀síwájú ọ̀rọ̀ Pọ́ọ̀lù hàn ní Yorùbá àdánidá.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ó pa agbára ọ̀rọ̀ atọ́ka mọ́, ó sì ń tọ́ka sí Israẹli nínú àyíká ọ̀rọ̀ náà.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó pa ìtẹnumọ́ àkókò ìsinsìnyí mọ́ ní ibi méjèèjì tí ọ̀rọ̀ náà ti fara hàn.
- source_word: ἠπείθησαν
  choice: ti ṣàìgbọ́ràn
  rationale: Ó gba ìtumọ̀ àìgbọ́ràn tí ó lè ní àìgbàgbọ́ nínú láìdín ọ̀rọ̀ náà kù sí ìṣòro ọpọlọ nìkan.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: nípasẹ̀ àánú tí Ọlọ́run fi hàn sí yín
  rationale: Ó tú gbólóhùn dátífù Gíríìkì tí ó há pọ̀ sí ọ̀nà tí ó ṣe kedere, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ nípa àánú Ọlọ́run tí àwọn Kèfèrí rí gbà.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìlò Yorùbá àdánidá ni fún ète tàbí àbájáde, ó sì pa ìbáṣepọ̀ gbólóhùn mọ́.
- source_word: αὐτοὶ
  choice: àwọn náà
  rationale: Ó fi ìtẹnumọ́ pé Israẹli pẹ̀lú wà nínú ète àánú náà hàn.
- source_word: ἐλεηθῶσιν
  choice: rí àánú gbà
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún pẹ́síbù Gíríìkì, nígbà tí Ọlọ́run jẹ́ olùfi àánú hàn.
theological_decisions:
- issue: Bóyá “àánú yín” túmọ̀ sí àánú tí àwọn onígbàgbọ́ Kèfèrí fi hàn tàbí àánú tí Ọlọ́run fi hàn sí wọn
  choice: àánú tí Ọlọ́run fi hàn sí yín
  alternative: àánú yín
  rationale: Ìṣàn ọ̀rọ̀ ní Róòmù 11:30–32 ń sọ nípa àánú Ọlọ́run tí ẹgbẹ́ kọ̀ọ̀kan rí gbà lẹ́yìn àìgbọ́ràn. Síbẹ̀, ẹsẹ̀ Gíríìkì lè gba ìtumọ̀ gígùn náà, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ṣàìgbọ́ràn” láti pa ìwọ̀n ìtumọ̀ ἀπειθέω mọ́, a sì fi àlàyé ìsàlẹ̀ pamọ́ fún àìdánilójú dátífù náà.
