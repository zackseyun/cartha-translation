id: ROM.11.35
reference: Romans 11:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: yo
  text: Tàbí ta ni ó kọ́kọ́ fi nǹkan fún un[a], tí a ó sì san án padà fún un[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ta ni ó ti fi nǹkan fún un ṣáájú?”
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ rẹ̀ ni pé, kò sí ẹni tí ó ti fún Ọlọ́run ní ohun kan lọ́nà tí yóò fi mú Ọlọ́run di ẹni tí ó jẹ ẹ́ ní gbèsè láti san án padà.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Tàbí
  rationale: Ó ń mú ìbéèrè àsọyé mìíràn wọlé nínú ọ̀wọ́ ìbéèrè tí Pọ́ọ̀lù ń béèrè.
- source_word: τίς
  choice: ta ni
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti béèrè nípa ẹni kan nínú ìbéèrè àsọyé.
- source_word: προέδωκεν
  choice: ó kọ́kọ́ fi nǹkan fún un
  rationale: “Kọ́kọ́” pa ìtumọ̀ fífúnni ṣáájú mọ́, nígbà tí “fi nǹkan fún” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere láìfi irú ohun tí a fúnni kún ọ̀rọ̀ Gíríìkì.
- source_word: αὐτῷ
  choice: fún un
  rationale: A pa arọ́pò-orúkọ mọ́ bí ó ti rí ní Gíríìkì; ó tọ́ka sí Ọlọ́run gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: καὶ
  choice: tí ... sì
  rationale: Ìṣopọ̀ yìí jẹ́ àdánidá ní Yorùbá fún sísọ abala kejì ìbéèrè náà pọ̀ mọ́ ti àkọ́kọ́, ó sì pa ìbáṣepọ̀ àwọn gbólóhùn náà mọ́.
- source_word: ἀνταποδοθήσεται
  choice: a ó san án padà
  rationale: Ó fi ìtumọ̀ sísan ohun tí a jẹ ẹnìkan padà hàn. Lílò “a” aláìní ẹni pàtó ń ṣe iṣẹ́ àrọ́pò aláìsọ ẹni tí ìṣe ń tọ́ka sí, láìfi ẹni tuntun kún ọ̀rọ̀ náà.
- source_word: αὐτῷ
  choice: fún un
  rationale: A tún pa arọ́pò-orúkọ náà mọ́ láti ṣètìlẹ́yìn fún ìbáramu abala méjèèjì.
theological_decisions:
- issue: Ẹni tí αὐτῷ ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí “un,” tí ó ń tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀.
  alternative: Kí a fi “Ọlọ́run” sí i ní tààràtà fún ìmúlẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì lo arọ́pò-orúkọ, kì í ṣe orúkọ “Ọlọ́run.” Pípamọ́ arọ́pò-orúkọ náà bọ̀wọ̀ fún ìrísí orísun, àyíká ọ̀rọ̀ sì mú ẹni tí ó ń tọ́ka sí ṣe kedere.
- issue: Ìtumọ̀ προέδωκεν nípa jíjẹ Ọlọ́run ní gbèsè
  choice: A pa ìtumọ̀ fífúnni ṣáájú mọ́ pẹ̀lú “kọ́kọ́,” láìsọ àlàyé ẹ̀kọ́ ìgbàgbọ́ náà di apá ọ̀rọ̀ pàtàkì.
  alternative: “Ó fi nǹkan fún un” láìsí “kọ́kọ́,” tàbí fífi kún un pé Ọlọ́run di ẹni tí ó jẹ gbèsè.
  rationale: Ìbéèrè àsọyé náà ń sẹ́ pé ẹnikẹ́ni ti fún Ọlọ́run ṣáájú débi pé Ọlọ́run yóò jẹ ẹ́ ní gbèsè. “Kọ́kọ́” pa agbára yẹn mọ́, àkọsílẹ̀ ìsàlẹ̀ sì ṣàlàyé rẹ̀ láìgbé ìtumọ̀ sínú ọ̀rọ̀ pàtàkì.
- issue: Àìṣe pàtó ẹni tí yóò san padà nínú ἀνταποδοθήσεται
  choice: A lo “a ó san án padà,” ìkọ́lé aláìsọ olùṣe ní pàtó.
  alternative: “Ọlọ́run yóò san án padà fún un” tàbí “a ó sì san ẹ̀san fún un.”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ ìṣe àfaragà ọjọ́ iwájú, kò sì dárúkọ olùṣe. Ìtumọ̀ yìí pa àìṣe pàtó yẹn mọ́, bí ó tilẹ̀ jẹ́ pé àyíká fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ìsanpadà náà yóò wá láti ọ̀dọ̀ rẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó bá yẹ. “Tàbí ta ni...” pa ìrísí ìbéèrè àsọyé mọ́; “nǹkan” jẹ́ àfikún gírámà Yorùbá tí ó jẹ́ dandan fún ìtumọ̀ àdánidá, kì í ṣe ìdín ohun tí a fúnni sí irú kan pàtó.
