  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ ẹsẹ̀ Gíríìkì náà mọ́ ní pàtàkì: ó ṣàfihàn ìjìnlẹ̀ ọrọ̀, ọgbọ́n, àti ìmọ̀ Ọlọ́run; ó sì yà ‘kò ṣeé wádìí’ sọ́tọ̀ kúrò ní ‘kò ṣeé tọpasẹ̀.’ Síbẹ̀, ‘ti tó bẹ́ẹ̀’ kì í ṣe ọ̀nà tó dára jù láti gbé ìyàlẹ́nu Ὦ ... ὡς jáde, nítorí ó lè dà bí ohun kan tí ó ṣẹ̀ṣẹ̀ dé ìwọ̀n kan.'
  naturalness: ‘Ìjìnlẹ̀ ... Ọlọ́run o!’ jẹ́ ìkéde ìyàlẹ́nu tó dájú, tó sì rọrùn nínú Yorùbá boṣewa. ‘Kò ṣeé tọpasẹ̀’ tún jẹ́ gbólóhùn kúkúrú, adayébá, tí ó mú àwòrán ‘títẹ̀lé ipa’ inú ἀνεξιχνίαστοι wá.
  terminology: ‘Ọ̀rọ̀,’ ‘ọgbọ́n,’ ‘ìmọ̀,’ ‘ìdájọ́,’ àti ‘ọ̀nà’ yẹ. A pa ìyàtọ̀ ọ̀rọ̀ Gíríìkì méjì fún ohun tí a kò lè ṣàwárí/tọpasẹ̀ mọ́. Àlàyé ìsàlẹ̀ (a) gbọ́dọ̀ ṣàlàyé ìkànnì ìtúmọ̀ míì ní ọ̀nà Yorùbá tó ṣe kedere; a tún fi (b) kún un láti pa ìpinnu ọ̀rọ̀-ìtumọ̀ pàtàkì ti àkọsílẹ̀ Gẹ̀ẹ́sì mọ́.
