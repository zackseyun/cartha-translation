  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: yo
  text: Ìjìnlẹ̀ ọrọ̀, ọgbọ́n àti ìmọ̀ Ọlọ́run o![a] Àwọn ìdájọ́ rẹ̀ kò ṣeé wádìí, àwọn ọ̀nà rẹ̀ kò sì ṣeé tọpasẹ̀![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè tú apá àkọ́kọ́ sí: “Ìjìnlẹ̀ ìṣúra ọgbọ́n àti ìmọ̀ Ọlọ́run o!” Ìtò ọ̀rọ̀ Gíríìkì gba ìjápọ̀ tímọ́tímọ́ bẹ́ẹ̀ láàárín ‘ọ̀rọ̀/ìṣúra’ àti ‘ọgbọ́n àti ìmọ̀’; ṣùgbọ́n ọ̀rọ̀ inú ẹsẹ̀ ka ọrọ̀, ọgbọ́n, àti ìmọ̀ sí ohun mẹ́ta tí ó jẹ́ ti Ọlọ́run.'
    reason: alternative_reading
  - marker: b
    text: ‘Kò ṣeé tọpasẹ̀’ túmọ̀ ọ̀rọ̀ kan tí ó fi ohun tí a kò lè tẹ̀lé ipasẹ̀ rẹ̀ hàn; èyí yàtọ̀ díẹ̀ sí ‘kò ṣeé wádìí.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Háà!
  rationale: Ọ̀rọ̀ ìyanu yìí fi ìyàlẹ́nu àti ìjọsìn inú ọkàn hàn ní Yorùbá òde òní.
- source_word: βάθος
  choice: ìjìnlẹ̀
  rationale: Ó pa àwòrán ohun tí ó jinlẹ̀ tí a kò lè dé òpin rẹ̀ mọ́.
- source_word: πλούτου
  choice: ọrọ̀
  rationale: Nínú àyíká yìí, ó túmọ̀ sí ọ̀pọ̀lọpọ̀ ohun iyebíye tí ó jẹ́ ti Ọlọ́run; ‘ọrọ̀’ jẹ́ ọ̀rọ̀ Yorùbá adayébá fún ìní púpọ̀ tàbí ọlá ọrọ̀.
- source_word: σοφίας
  choice: ọgbọ́n
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún ọgbọ́n Ọlọ́run nínú ètò àti iṣẹ́ rẹ̀.
- source_word: γνώσεως
  choice: ìmọ̀
  rationale: A pa á mọ́ gẹ́gẹ́ bí ohun tí ó yàtọ̀ sí ọgbọ́n, bí Gíríìkì ṣe ṣe.
- source_word: κρίματα
  choice: àwọn ìdájọ́
  rationale: Ó gba ìtumọ̀ ìdájọ́, ìpinnu, tàbí ohun tí Ọlọ́run pinnu láì dín un kù sí àṣẹ pàtó kan ṣoṣo.
- source_word: ἀνεξεραύνητα
  choice: kò ṣeé wádìí rí
  rationale: Ó fi hàn pé kò ṣeé ṣàyẹ̀wò dé òpin tàbí ṣàwárí ní kíkún.
- source_word: ἀνεξιχνίαστοι
  choice: kọjá ohun tí a lè tọpasẹ̀
  rationale: Ó pa àwòrán títọ ipa ohun kan mọ́, ó sì yàtọ̀ díẹ̀ sí ‘kò ṣeé wádìí rí.’
- source_word: ὁδοὶ
  choice: àwọn ọ̀nà
  rationale: Ó pa àkàwé Gíríìkì mọ́ fún bí Ọlọ́run ṣe ń ṣiṣẹ́ àti ipa tí ó ń gbà.
theological_decisions:
- issue: Ìbáṣepọ̀ θεοῦ pẹ̀lú ọrọ̀, ọgbọ́n àti ìmọ̀
  choice: 'A ka gbogbo mẹ́tẹ̀ẹ̀ta sí ohun tí ó jẹ́ ti Ọlọ́run: ọrọ̀ rẹ̀, ọgbọ́n rẹ̀ àti ìmọ̀ rẹ̀.'
  alternative: ‘Ìjìnlẹ̀ ọrọ̀ ọgbọ́n àti ìmọ̀ Ọlọ́run,’ níbi tí ‘ọrọ̀’ ti so mọ́ ọgbọ́n àti ìmọ̀ ní pàtàkì.
  rationale: Ìtò Gíríìkì gba méjèèjì láyè, ṣùgbọ́n àkójọpọ̀ ànímọ́ mẹ́ta ti Ọlọ́run bá ọ̀rọ̀ ìyìn náà mu jù; àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- issue: Yíyà ἀνεξεραύνητα àti ἀνεξιχνίαστοι sọ́tọ̀
  choice: ‘kò ṣeé wádìí rí’ àti ‘kọjá ohun tí a lè tọpasẹ̀’
  alternative: Lílo gbólóhùn kan náà tàbí àwọn ọ̀rọ̀ tó fẹ́rẹ̀ẹ́ jẹ́ ọ̀kan fún méjèèjì.
  rationale: Gíríìkì lo àwọn ọ̀rọ̀ méjì tí wọ́n jọra ṣùgbọ́n tí àwòrán wọn yàtọ̀; ìtumọ̀ náà pa ìyàtọ̀ yẹn mọ́ láì sọ ọ́ di ẹ̀kọ́ ìgbàgbọ́ pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n adayébá. ‘Háà!’ mú ìyàlẹ́nu ìjọsìn jáde; àwọn gbólóhùn ‘kò ṣeé wádìí rí’ àti ‘kọjá ohun tí a lè tọpasẹ̀’ jẹ́ kedere fún òǹkàwé òde òní, wọ́n sì pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjì mọ́.
