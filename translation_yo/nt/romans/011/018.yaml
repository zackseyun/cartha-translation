id: ROM.11.18
reference: Romans 11:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: yo
  text: má ṣe fọ́nnu sí àwọn ẹ̀ka náà[a]. Ṣùgbọ́n bí ìwọ bá fọ́nnu, kì í ṣe ìwọ ni ó ń gbé gbòǹgbò náà ró[b], ṣùgbọ́n gbòǹgbò náà ni ó ń gbé ọ ró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “má ṣe fọ́nnu lòdì sí àwọn ẹ̀ka náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìwọ kì í ṣe ẹni tí ó ń gbé gbòǹgbò náà, ṣùgbọ́n gbòǹgbò náà ló ń gbé ọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: fọ́nnu sí / bá fọ́nnu
  rationale: “Fọ́nnu sí” sọ ìgbéraga tí a ń fi ara ẹni ga sí àwọn ẹlòmíràn, ó sì pa ìtumọ̀ κατά mọ́ láìfi ìtumọ̀ tí ó pọ̀ ju ti Gíríìkì lọ kún un. Ní ìṣẹ̀lẹ̀ kejì, “bí ìwọ bá fọ́nnu” tẹ̀ lé ìṣètò gbólóhùn oníwàláàyè náà.
- source_word: κλάδων
  choice: àwọn ẹ̀ka náà
  rationale: Ọ̀rọ̀ atọ́ka “náà” tọ́ka sí àwọn ẹ̀ka pàtó inú àkàwé igi ólífì tí ọ̀rọ̀ tó yí ẹsẹ̀ náà ká ti sọ̀rọ̀ nípa wọn.
- source_word: ῥίζαν / ῥίζα
  choice: gbòǹgbò náà
  rationale: A lo ọ̀rọ̀ kan náà ní ìṣẹ̀lẹ̀ méjèèjì láti pa àwòrán gbòǹgbò gẹ́gẹ́ bí orísun àti ohun tí ń gbé ẹlòmíràn ró mọ́.
- source_word: βαστάζεις
  choice: gbé ... ró
  rationale: Nínú àkàwé yìí, “gbé ... ró” lè túmọ̀ sí gbígbé ẹrù àti pípèsè ìdúróṣinṣin; ó bá àwòrán igi mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: kì í ṣe ìwọ ni ó ... ṣùgbọ́n gbòǹgbò náà ni ó ...
  rationale: Ìṣètò yìí pa ìtẹnumọ́ Gíríìkì mọ́, nípa fífi “ìwọ” àti “gbòǹgbò náà” dojú kọ ara wọn, kí ìyípadà ẹni tí ó ń gbé ẹnì kejì ró lè hàn kedere.
- source_word: μὴ
  choice: má ṣe
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ìfòfindè tààrà ní Yorùbá, láìfi ìtumọ̀ àkókò tàbí ìtẹ̀síwájú tí ọrọ̀ náà kò fi dandan mú wá kún un.
theological_decisions:
- issue: Agbára àkàwé gbòǹgbò àti àwọn ẹ̀ka nínú àwòrán igi ólífì ti Pọ́ọ̀lù
  choice: Pa àkàwé náà mọ́ bí ó ti rí, láìṣàlàyé ta ni gbòǹgbò tàbí àwọn ẹ̀ka dúró fún nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣàlàyé gbòǹgbò náà nínú ìtumọ̀ gẹ́gẹ́ bí àwọn baba ńlá, Ábúráhámù, tàbí àwọn ìlérí májẹ̀mú.
  rationale: Ọ̀rọ̀ Gíríìkì fi àkàwé náà sílẹ̀ láìdá ẹni tí gbòǹgbò dúró fún lójú. Ṣíṣàlàyé rẹ̀ nínú ìtumọ̀ yóò mú àlàyé onítumọ̀ wọ inú ẹsẹ̀, yóò sì dín ìṣípayá ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà fi sílẹ̀ fún àyíká rẹ̀ kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “fọ́nnu sí” fún ìgbéraga sí ẹlòmíràn, àti “gbé ... ró” láti pa àwòrán ohun tí ń ṣe àtìlẹ́yìn mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
