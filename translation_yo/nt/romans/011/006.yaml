id: ROM.11.6
reference: Romans 11:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: yo
  text: Ṣùgbọ́n bí ó bá jẹ́ nípa oore-ọ̀fẹ́, kò tún jẹ́ láti inú àwọn iṣẹ́ mọ́; bí bẹ́ẹ̀ kọ́, oore-ọ̀fẹ́ kò tún di oore-ọ̀fẹ́ mọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι / χάρις
  choice: nípa oore-ọ̀fẹ́ / oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún χάρις ní ọ̀rọ̀ ìgbàlà; “nípa” fi dative ti ọ̀nà tàbí ìpìlẹ̀ hàn láì fi ìtumọ̀ míì kún un.
- source_word: ἐξ ἔργων
  choice: nípa àwọn iṣẹ́
  rationale: Ó ṣàfihàn pé àwọn iṣẹ́ ni ìpìlẹ̀ tàbí ọ̀nà tí a ń sọ̀rọ̀ nípa rẹ̀, ó sì pa ìyàtọ̀ tó wà láàárín oore-ọ̀fẹ́ àti iṣẹ́ mọ́.
- source_word: γίνεται
  choice: di
  rationale: “Di” túmọ̀ ìṣe γίνομαι ní tààrà, ó sì pa ìtẹnumọ́ inú gbólóhùn náà mọ́ pé bí iṣẹ́ bá jẹ́ ìpìlẹ̀, oore-ọ̀fẹ́ kò tún “di” ohun tí oore-ọ̀fẹ́ jẹ́.
- source_word: οὐκέτι
  choice: kì í ṣe ... mọ́ / kò tún ... mọ́
  rationale: Àwọn ọ̀nà méjèèjì jẹ́ èdè Yorùbá àdánidá fún “not/no longer,” wọ́n sì bójú tó àtúnwí ọ̀rọ̀ náà nínú ẹsẹ̀.
- source_word: ἐπεὶ
  choice: bí bẹ́ẹ̀ kọ́
  rationale: 'Nínú àríyànjiyàn yìí, ọ̀rọ̀ náà ń tọ́ka sí àbájáde òdì: bí kì í bá ṣe bẹ́ẹ̀, ìtumọ̀ oore-ọ̀fẹ́ yóò bàjẹ́.'
theological_decisions:
- issue: Ìbáṣepọ̀ oore-ọ̀fẹ́ àti àwọn iṣẹ́
  choice: Pa wọ́n mọ́ gẹ́gẹ́ bí ìpìlẹ̀ méjì tí kò lè parapọ̀ nínú àríyànjiyàn ẹsẹ̀ yìí.
  alternative: Ṣàlàyé “àwọn iṣẹ́” ní pàtó gẹ́gẹ́ bí iṣẹ́ òfin tàbí iṣẹ́ rere.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ἔργων lásán; fífi “òfin” tàbí “rere” kún un yóò dín àìsọ pàtó ti orísun kù, ó sì lè mú ìtumọ̀ ẹ̀kọ́ ìsìn kan wọlé.
- issue: Ìtumọ̀ γίνεται χάρις
  choice: “kò tún di oore-ọ̀fẹ́ mọ́”
  alternative: “kì í ṣe oore-ọ̀fẹ́ mọ́”
  rationale: Yíyan “di” tẹ̀lé γίνεται ní kedere, ó sì pa ìtẹnumọ́ àti ìfọ̀rọ̀wérọ̀ inú Gíríìkì mọ́ láì yanjú rẹ̀ sí gbólóhùn ìdánimọ̀ lásán.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún, a sì pa ìṣọ̀kan àti àtúnwí inú orísun Gíríìkì mọ́. Kò sí àlàyé ẹ̀kọ́ ìsìn tí a fi kún ọ̀rọ̀ náà.
