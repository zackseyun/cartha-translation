id: ROM.11.32
reference: Romans 11:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: yo
  text: Nítorí Ọlọ́run ti sé[a] gbogbo wọn[c] mọ́ sínú àìgbọ́ràn[b], kí ó lè ṣàánú gbogbo wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “fi gbogbo wọn sábẹ́ àhámọ́” tàbí “há gbogbo wọn mọ́.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú “àìgbọ́ràn” sí “àìgbàgbọ́” ní àwọn àyíká ọ̀rọ̀ kan; ṣùgbọ́n níbí, ìtumọ̀ tó gbòòrò ti kíkọ̀ láti ṣègbọ́ràn ni ó ṣeé ṣe kó wà lọ́kàn.
    reason: lexical_alternative
  - marker: c
    text: Àtúnsọ “gbogbo wọn” pa ọ̀rọ̀ Pọ́ọ̀lù mọ́, kò sì yẹ kí a tètè dín ìwọ̀n rẹ̀ kù; nínú àyíká ọ̀rọ̀, ó ń sọ̀rọ̀ nípa àwọn Júù àti àwọn Kèfèrí papọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: ti sé ... mọ́
  rationale: Ọ̀rọ̀ yìí pa àwòrán títì mọ́ tàbí fífi sínú àhámọ́ mọ́, láì sọ ọ́ di ìjìyà ẹ̀wọ̀n nìkan. Fífi “ti” hàn ń tọ́ka sí iṣẹ́ tí Ọlọ́run ti ṣe tí ó sì ní ìtumọ̀ fún ọ̀rọ̀ tí Pọ́ọ̀lù ń sọ.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó mú ìdí tàbí àlàyé tí ẹsẹ yìí fi ń tẹ̀ lé ọ̀rọ̀ tó ṣáájú jáde ní kedere.
- source_word: τοὺς πάντας
  choice: gbogbo wọn
  rationale: A pa gbólóhùn náà mọ́ ní ibi méjèèjì gẹ́gẹ́ bí Gíríìkì, láì dín ẹni tí ó ń tọ́ka sí kù tàbí fi ìtumọ̀ míì kún un.
- source_word: εἰς ἀπείθειαν
  choice: sínú àìgbọ́ràn
  rationale: “Sínú” tẹ̀ lé agbára εἰς, “àìgbọ́ràn” sì gbòòrò ju àìgbàgbọ́ lọ, ó ní ìtumọ̀ kíkọ̀ láti gbọ́ tàbí láti ṣègbọ́ràn.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó sọ ète tàbí àbájáde iṣẹ́ náà ní Yorùbá àdánidá; “lè” níbí kò túmọ̀ sí pé kò dá Ọlọ́run lójú.
- source_word: ἐλεήσῃ
  choice: ṣàánú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀, fún fífi àánú hàn.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ “gbogbo wọn” ní abala méjèèjì
  choice: A tú τοὺς πάντας sí “gbogbo wọn” ní ìgbà méjèèjì.
  alternative: “gbogbo ènìyàn,” “olúkúlùkù,” tàbí “àwọn Júù àti àwọn Kèfèrí”
  rationale: Gíríìkì tún gbólóhùn gbòòrò kan náà sọ ní abala méjèèjì. Àyíká ọ̀rọ̀ ní àwọn Júù àti àwọn Kèfèrí lọ́kàn, ṣùgbọ́n ìtumọ̀ kò gbọdọ̀ tètè yanjú àríyànjiyàn nípa bí “gbogbo” ṣe gbòòrò tó.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. Àwòrán títì mọ́ àti ìfararora “gbogbo wọn ... gbogbo wọn” ni a pa mọ́.
