  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni, ní àkókò ìsinsìnyí pẹ̀lú, àṣẹ́kù kan ti wáyé gẹ́gẹ́ bí àṣàyàn oore-ọ̀fẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àṣàyàn tí ó kún fún oore-ọ̀fẹ́,” tàbí “gẹ́gẹ́ bí àṣàyàn nípa oore-ọ̀fẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Bẹ́ẹ̀ náà ni ... pẹ̀lú
  rationale: Ó fi ìparí ọ̀rọ̀ tí Pọ́ọ̀lù fà jáde láti inú àpẹẹrẹ Èlíjà hàn, ó sì pa ìfiwéra pẹ̀lú àkókò ìsinsìnyí mọ́.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: ní àkókò ìsinsìnyí
  rationale: καιρός tọ́ka sí àkókò tàbí sáà kan pàtó; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìyàtọ̀ láàárín ọjọ́ Èlíjà àti ìsinsìnyí mọ́.
- source_word: λεῖμμα
  choice: àṣẹ́kù kan
  rationale: Àṣẹ́kù ni iye díẹ̀ tí ó ṣẹ́ kù lára ọ̀pọ̀; ó bá àyíká ọ̀rọ̀ Májẹ̀mú Láéláé àti ti Pọ́ọ̀lù mu.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: gẹ́gẹ́ bí àṣàyàn oore-ọ̀fẹ́
  rationale: Ó pa ἐκλογή àti χάρις méjèèjì mọ́, láì pinnu bóyá genitive náà ń fi orísun, ìwà, tàbí ìpìlẹ̀ àṣàyàn hàn.
- source_word: γέγονεν
  choice: ti wà
  rationale: Perfect γίνομαι ń tọ́ka sí ipò tí ó wà nísinsìnyí nítorí ohun tí ó ti ṣẹlẹ̀; “ti wà” sọ èyí ní Yorùbá àdánidá láì fi ìtumọ̀ “ti ṣẹ́ kù” kún un.
theological_decisions:
- issue: Ìtumọ̀ ἐκλογή nínú àyíká ẹ̀kọ́ ìgbàgbọ́ tí èrò yàtọ̀ síra
  choice: àṣàyàn
  alternative: yíyan; àwọn tí a yàn
  rationale: “Àṣàyàn” pa ìṣe tàbí ètò yíyan tí ọ̀rọ̀ Gíríìkì ń sọ mọ́, láì sọ ọ́ di ètò ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
- issue: Ìbáṣepọ̀ oore-ọ̀fẹ́ àti àṣàyàn nínú κατ’ ἐκλογὴν χάριτος
  choice: àṣàyàn oore-ọ̀fẹ́
  alternative: àṣàyàn nípa oore-ọ̀fẹ́; àṣàyàn tí ó kún fún oore-ọ̀fẹ́
  rationale: Ìṣọ̀kan ọ̀rọ̀ náà pa àìdánilójú genitive Gíríìkì mọ́, dípò pípin rẹ̀ sí orísun, ìwà, tàbí ìpìlẹ̀ nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọlọ́wọ̀, ó lóye fún òǹkàwé òde òní, ó sì pa ìwúwo ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
