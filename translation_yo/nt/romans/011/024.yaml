id: ROM.11.24
reference: Romans 11:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: yo
  text: Nítorí bí a bá gé ọ kúrò nínú igi ólífì ìgbẹ́ nípa ti ẹ̀dá, tí a sì lọ́ ọ mọ́ igi ólífì tí a gbin ní ìlòdì sí ẹ̀dá, báwo ni a kò ṣe ní túbọ̀ lọ́ àwọn wọ̀nyí, àwọn ẹ̀ka àbínibí[a], mọ́ igi ólífì tiwọn fúnra wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn wọ̀nyí, àwọn tí ó jẹ́ ti ẹ̀dá.” Gíríìkì sọ ní tààrà pé “àwọn wọ̀nyí, àwọn tí ó wà nípa ti ẹ̀dá”; a mú “ẹ̀ka” wá láti inú àpẹẹrẹ igi ólífì ní àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó lọ́ wọn padà mọ́ igi ólífì tiwọn fúnra wọn.” Àyíká ọ̀rọ̀ fi èrò ìpadà hàn, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ “padà” kò sí ní gbangba nínú ọ̀rọ̀-ìṣe Gíríìkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: a bá gé ìwọ kúrò
  rationale: Ó pa ìtumọ̀ gígé kúrò mọ́, dípò lílo ọ̀rọ̀ tí yóò túmọ̀ sí pé a ṣẹ́ ẹ̀ka náà.
- source_word: ἀγριελαίου
  choice: igi ólífì ìgbẹ́
  rationale: Ó túmọ̀ igi ólífì tí a kò gbin tàbí tọ́jú, ó sì bá àwòrán iṣẹ́ àgbẹ̀ mu.
- source_word: παρὰ φύσιν
  choice: ní òdì sí ẹ̀dá
  rationale: Ó pa ìtakora mọ́ pẹ̀lú κατὰ φύσιν, ó sì fi hàn pé iṣẹ́ lílọ́ yìí kò tẹ̀ lé ìlànà àdánidá.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: a lọ́ ọ ... a ó fi lọ ... mọ́
  rationale: ‘Lọ́ mọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó bá iṣẹ́ fífi ẹ̀ka igi kan mọ́ igi mìíràn mu, ó sì pa ohùn àìṣe ti Gíríìkì mọ́ nípa lílo ‘a’ aláìsọ ẹni.
- source_word: καλλιέλαιον
  choice: igi ólífì àgbẹ̀
  rationale: Ó fi ìyàtọ̀ sí igi ólífì ìgbẹ́ hàn gẹ́gẹ́ bí igi tí a ń gbin tí a sì ń tọ́jú, láì pe e ní ‘igi rere.’
- source_word: πόσῳ μᾶλλον
  choice: mélòómélòó ni
  rationale: Àsọyé Yorùbá àdánidá fún ìfiwéra a fortiori, ‘how much more.’
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: àwọn wọ̀nyí, àwọn ẹ̀ka àbínibí
  rationale: ‘Àwọn ẹ̀ka’ ni a ṣàfikún láti inú àpẹẹrẹ igi ólífì ní àyíká ọ̀rọ̀; ‘àbínibí’ fi ìbáṣepọ̀ wọn pẹ̀lú igi náà nípa ti ẹ̀dá hàn láì dárúkọ Ísírẹ́lì ní tààrà.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: mọ́ igi ólífì tiwọn fúnra wọn
  rationale: Ó pa ìtẹnumọ́ ἰδίᾳ mọ́ pé igi náà jẹ́ tiwọn gan-an, ‘lọ́ ... mọ́’ sì tẹ̀ lé àwòrán fífi ẹ̀ka mọ́ igi.
theological_decisions:
- issue: Bóyá kí a dárúkọ àwọn Júù tàbí Ísírẹ́lì ní tààrà
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘àwọn wọ̀nyí, àwọn ẹ̀ka àbínibí.’
  alternative: ‘Àwọn Júù wọ̀nyí’ tàbí ‘àwọn ọmọ Ísírẹ́lì wọ̀nyí.’
  rationale: Àyíká ọ̀rọ̀ ló ń fi ẹni tí ọ̀rọ̀ ń tọ́ka sí hàn; Gíríìkì kò dárúkọ wọn ní ẹsẹ yìí, nítorí náà ìtumọ̀ náà pa àpẹẹrẹ àti ìfarasin itọ́kasí náà mọ́.
- issue: Bóyá kí a ṣàfikún ‘ẹ̀ka’ tí kò sí ní gbangba nínú Gíríìkì
  choice: A ṣàfikún ‘àwọn ẹ̀ka’ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: ‘Àwọn wọ̀nyí, àwọn tí ó jẹ́ ti ẹ̀dá.’
  rationale: Àpẹẹrẹ lílọ́ ẹ̀ka mọ́ igi àti àyíká Róòmù 11 mú ‘ẹ̀ka’ dájú; àfikún náà mú Yorùbá ṣe kedere láì yí èrò ọ̀rọ̀ padà.
- issue: Bóyá kí a sọ pé a ó ‘lọ́ wọn padà’
  choice: A kò fi ‘padà’ sínú ọ̀rọ̀ àkọ́kọ́.
  alternative: ‘A ó lọ́ wọn padà mọ́ igi ólífì tiwọn.’
  rationale: Ìpadà bọ̀ wà nínú àyíká ọ̀rọ̀, ṣùgbọ́n kò sí ní gbangba nínú ọ̀rọ̀-ìṣe Gíríìkì; àlàyé ẹsẹ̀ ìsàlẹ̀ ló tọ́ka sí i.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘igi ólífì ìgbẹ́’ àti ‘igi ólífì àgbẹ̀’ láti mú ìtakora igi ẹhànnà àti igi tí a gbin kedere; a lo ‘lọ́ mọ́’ gẹ́gẹ́ bí ọ̀rọ̀ iṣẹ́ àgbẹ̀ fún grafting. Àmì ohùn ni a fi sí ibi tí ó jẹ́ àdánidá.
