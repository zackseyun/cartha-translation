id: ROM.11.12
reference: Romans 11:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: yo
  text: 'Bí ìkọsẹ̀ wọn bá mú ọrọ̀ wá fún ayé, tí àdánù wọn[a] sì mú ọrọ̀ wá fún àwọn tí kì í ṣe Júù, mélòómélòó ni ẹ̀kúnrẹ́rẹ́ wọn[b] yóò tún mú wá!


    [a] Tàbí “ìjákulẹ̀ wọn” tàbí “dídínkù wọn.”


    [b] Tàbí “iye wọn ní kíkún” tàbí “gbígba gbogbo wọn wọlé.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìjákulẹ̀ wọn” tàbí “dídínkù wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “iye wọn ní kíkún” tàbí “gbígba gbogbo wọn wọlé.”
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: ìṣìnà
  rationale: Ó ń sọ nípa ìgbésẹ̀ tí kò tọ́ tàbí ẹ̀ṣẹ̀; “ìṣìnà” pa ìtumọ̀ ìwà búburú náà mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: πλοῦτος
  choice: ọrọ̀
  rationale: “Ọrọ̀” jẹ́ àpèjúwe àìnípẹ̀kun fún ọ̀pọ̀lọpọ̀ ìbùkún, ó sì pa àwòrán ọrọ̀ nínú Gíríìkì mọ́.
- source_word: κόσμου
  choice: ayé
  rationale: Ó tọ́ka sí ayé ní gbòòrò, ní pàtàkì àwọn ènìyàn tí ó wà lẹ́yìn odi Ísírẹ́lì.
- source_word: ἥττημα
  choice: àdánù
  rationale: Ọ̀rọ̀ Gíríìkì yìí lè túmọ̀ sí àdánù, ìjákulẹ̀, tàbí dídínkù; “àdánù” pa àìdánilójú náà mọ́ dáadáa jù.
- source_word: ἐθνῶν
  choice: àwọn tí kì í ṣe Júù
  rationale: Nínú àyíká Róòmù 11, ọ̀rọ̀ náà ń fi àwọn orílẹ̀-èdè tàbí àwọn Kèfèrí wé Ísírẹ́lì; ọ̀nà yìí ṣe ìyàtọ̀ Júù àti ẹni tí kì í ṣe Júù kedere, láì lo ọ̀rọ̀ tí ó lè dun bí ẹ̀gàn.
- source_word: πόσῳ μᾶλλον
  choice: mélòómélòó ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi àríyànjiyàn ‘how much more’ hàn.
- source_word: πλήρωμα
  choice: ẹ̀kúnrẹ́rẹ́
  rationale: “Ẹ̀kúnrẹ́rẹ́” pa ìtumọ̀ gbígbòòrò ti πλήρωμα mọ́, yálà ó ń tọ́ka sí iye kíkún, ìkópa kíkún, tàbí ìmúpadàbọ̀sípò.
theological_decisions:
- issue: Ohun tí “ẹ̀kúnrẹ́rẹ́ wọn” (τὸ πλήρωμα αὐτῶν) ń tọ́ka sí
  choice: ẹ̀kúnrẹ́rẹ́ wọn
  alternative: iye wọn ní kíkún; gbígba gbogbo wọn wọlé; ìmúpadàbọ̀sípò wọn
  rationale: Gbólóhùn Pọ́ọ̀lù kúkúrú, ó sì lè gba ọ̀pọ̀ ìtumọ̀. Ìtumọ̀ àkọ́kọ́ kò pinnu bóyá ó ń sọ nípa iye, ìkópa, tàbí ìmúpadàbọ̀sípò Ísírẹ́lì.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Àwọn tí kì í ṣe Júù” ni a yàn dípò “àwọn Kèfèrí” láti mú ìyàtọ̀ Júù àti àwọn orílẹ̀-èdè yòókù ṣe kedere láì mú ìtumọ̀ ẹ̀gàn wọlé. A tún gbe àwọn àmì àlàyé [a] àti [b] sí lẹ́yìn àwọn ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
