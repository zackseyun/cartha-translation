id: ROM.11.30
reference: Romans 11:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí ẹ̀yin ti jẹ́ aláìgbọ́ràn sí Ọlọ́run nígbà kan rí, ṣùgbọ́n a ti ṣàánú yín nísinsìnyí nítorí àìgbọ́ràn wọn,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: Ó pa agbára ìṣàlàyé γάρ àti ti ìfiwéra ὥσπερ mọ́ ní Yorùbá àdánidá.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni; “ẹ̀yin” mú ọ̀pọ̀ yẹn hàn láìfi “Kèfèrí” kún ọ̀rọ̀ náà.
- source_word: ποτε
  choice: nígbà kan rí
  rationale: Ó fi ipò àtijọ́ hàn, ó sì dúró ní ìtakora pẹ̀lú “nísinsìnyí.”
- source_word: ἠπειθήσατε
  choice: ti ṣàìgbọ́ràn
  rationale: Ó ṣàfihàn àìgbọ́ràn sí Ọlọ́run, ó sì pa ìbátan ọ̀rọ̀ náà mọ́ pẹ̀lú ἀπείθεια tó tẹ̀ lé e; ó tún lè ní ìtumọ̀ àìgbàgbọ́ nínú àyíká yìí.
- source_word: τῷ θεῷ
  choice: sí Ọlọ́run
  rationale: Ìtumọ̀ àdánidá fún dative tó ń tẹ̀ lé ọ̀rọ̀ ìṣe ἀπειθέω.
- source_word: νῦν δὲ
  choice: ṣùgbọ́n ... nísinsìnyí
  rationale: Ó mú ìtakora láàárín ipò àtijọ́ àti àánú tí wọ́n rí gbà nísinsìnyí hàn kedere.
- source_word: ἠλεήθητε
  choice: tí ẹ gba àánú
  rationale: Ọ̀rọ̀ náà jẹ́ passive, ó sì túmọ̀ sí pé àánú ni a fi fún wọn; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: nítorí àìgbọ́ràn wọn
  rationale: Dative náà lè jẹ́ ti ohun èlò tàbí ti ìdí; “nítorí” sọ ìbátan náà di mímọ́ láìsọ ọ̀nà ìṣiṣẹ́ rẹ̀ ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ ἀπειθέω / ἀπείθεια nínú àyíká ìgbàlà tí Pọ́ọ̀lù ń ṣàlàyé
  choice: àìgbọ́ràn
  alternative: àìgbàgbọ́
  rationale: Àwọn ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ àìgbọ́ràn àti àìgbàgbọ́ papọ̀. “Àìgbọ́ràn” pa ìbátan láàárín ọ̀rọ̀ ìṣe àti ọ̀rọ̀-orúkọ inú ẹsẹ yìí mọ́, kò sì dín ọ̀rọ̀ Pọ́ọ̀lù kù sí àìgbàgbọ́ lọ́kàn nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A fi “ẹ̀yin” mú ọ̀pọ̀ ẹni kejì hàn, a kò sì fi ìdánimọ̀ “Kèfèrí” kún ohun tí ẹsẹ náà sọ ní tààrà.
