id: ROM.11.23
reference: Romans 11:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: yo
  text: Àwọn náà pẹ̀lú, bí wọn kò bá dúró nínú àìgbàgbọ́, a óò lọ́ wọn mọ́ igi náà[a]; nítorí Ọlọ́run lágbára láti tún lọ́ wọn mọ́ ọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a óò tún lọ́ wọn mọ́ igi náà.” Ọ̀rọ̀ Gíríìkì fún “tún” wà ní kedere nínú apá kejì ẹsẹ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Àwọn náà pẹ̀lú
  rationale: Ó pa agbára àfikún καί mọ́, ó sì ń tọ́ka sí àwọn ẹ̀ka aláìgbàgbọ́ tí a mẹ́nu kàn ṣáájú.
- source_word: ἐὰν μὴ ἐπιμένωσι τῇ ἀπιστίᾳ
  choice: bí wọn kò bá dúró nínú àìgbàgbọ́
  rationale: “Dúró nínú” fi ìtẹ̀síwájú ipò tí ἐπιμένω ń sọ hàn, “àìgbàgbọ́” sì bá ìyàtọ̀ láàárín ìgbàgbọ́ àti àìgbàgbọ́ nínú àyíká ọ̀rọ̀ mu.
- source_word: ἐγκεντρισθήσονται
  choice: a óò lọ́ wọn mọ́ igi náà
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ọjọ́ iwájú ní ohùn àfaradà nínú àkàwé lílọ́ ẹ̀ka mọ́ igi; fífi “igi náà” kún un mú àwòrán náà ṣe kedere ní Yorùbá láìyí ìtumọ̀ padà.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: nítorí Ọlọ́run lágbára
  rationale: Ó sọ agbára Ọlọ́run láti ṣe ohun tí a mẹ́nu kàn ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: láti tún lọ́ wọn mọ́ ọn
  rationale: “Tún” fi πάλιν hàn ní kedere, “mọ́ ọn” sì tún tọ́ka sí igi náà láìsọ ọ́ di ọ̀rọ̀ àsọdùn.
theological_decisions:
- issue: Ìtumọ̀ ἀπιστία nínú àyíká ọ̀rọ̀ yìí
  choice: àìgbàgbọ́
  alternative: àìṣòótọ́
  rationale: Róòmù 11 ń fi ìgbàgbọ́ àti àìgbàgbọ́ wéra nípa dídúró tàbí yíyọ ẹ̀ka; “àìgbàgbọ́” ni ó bá ìjíròrò tó sún mọ́ ọ jù.
- issue: Bóyá kí ìpadà sínú igi hàn nínú ọ̀rọ̀ lílọ́ àkọ́kọ́
  choice: a óò lọ́ wọn mọ́ igi náà
  alternative: a óò tún lọ́ wọn mọ́ igi náà
  rationale: πάλιν kò sí nínú gbólóhùn àkọ́kọ́; a fi “tún” sí ibi tí ó wà ní kedere nínú gbólóhùn kejì, kí a má bàa fi ohun tí Gíríìkì kò samì sí ibẹ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ológo ṣùgbọ́n tó ṣeé lóye. A lo àkàwé lílọ́ ẹ̀ka mọ́ igi ní ọ̀nà àdánidá, a sì pa ìyàtọ̀ tó wà láàárín àìgbàgbọ́ àti àìṣòótọ́ mọ́ nípasẹ̀ yíyan “àìgbàgbọ́.”
