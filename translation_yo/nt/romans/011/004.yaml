id: ROM.11.4
reference: Romans 11:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: yo
  text: Ṣùgbọ́n kí ni ìdáhùn Ọlọ́run[a] sọ fún un? “Mo ti pa ọkùnrin ẹgbẹ̀rún méje mọ́ fún ara mi[b], àwọn tí kò tẹ eékún fún Báálì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdáhùn láti ọ̀dọ̀ Ọlọ́run” tàbí “ọ̀rọ̀ ìfihàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Mo ti fi ... sílẹ̀ fún ara mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: ìdáhùn Ọlọ́run
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìdáhùn aláṣẹ tí Ọlọ́run fún Èlíjà. ‘Ìdáhùn Ọlọ́run’ jẹ́ èdè Yorùbá àdánidá, ó sì mú orísun ìdáhùn náà hàn láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: Κατέλιπον
  choice: Mo ti fi … sílẹ̀
  rationale: 'Àpólà yìí fi ìṣe tí a ti ṣe àti àbájáde rẹ̀ tí ó ṣì wà hàn: Ọlọ́run fi ìyókù náà sílẹ̀ fún ara rẹ̀. Ó tún pa àwòrán ìpilẹ̀ṣẹ̀ ti ‘fi sílẹ̀’ mọ́.'
- source_word: ἐμαυτῷ
  choice: fún ara mi
  rationale: Èyí túmọ̀ reflexive dative náà ní tààràtà, ó sì fi hàn pé Ọlọ́run pa àwọn náà mọ́ fún ara rẹ̀.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: ẹgbẹ̀rún méje ọkùnrin
  rationale: ἄνδρας jẹ́ ọ̀rọ̀ akọ ní pàtó; ‘ọkùnrin’ pa ìtumọ̀ akọ inú orísun náà mọ́ dípò lílo ọ̀rọ̀ gbogbogbò fún ènìyàn.
- source_word: οἵτινες
  choice: àwọn tí wọn
  rationale: Àpólà náà ṣàpèjúwe àwọn ẹgbẹ̀rún méje náà. ‘Àwọn tí wọn’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó ṣe àdánidá.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: kò tẹ eékún
  rationale: Èyí pa àwòrán fífi eékún tẹ̀ fún ìjọsìn tàbí ìtẹríba mọ́, ó sì ṣe kedere ní Yorùbá.
- source_word: τῇ Βάαλ
  choice: ba Báálì
  rationale: ‘Báálì’ ni ìkọ̀wé orúkọ òrìṣà náà ní Yorùbá; ‘ba’ bá ọ̀rọ̀-ìṣe ‘tẹ eékún’ mu ní èdè àdánidá.
theological_decisions:
- issue: Bóyá kí a sọ ní kedere pé Ọlọ́run ni orísun ìdáhùn náà
  choice: ìdáhùn Ọlọ́run
  alternative: ìdáhùn náà; ọ̀rọ̀ ìfihàn
  rationale: Àyíká ọ̀rọ̀ àti ìtọ́kasí Májẹ̀mú Láéláé fi hàn pé Ọlọ́run ló dá Èlíjà lóhùn. Yíyan ‘ìdáhùn Ọlọ́run’ mú ìtumọ̀ χρηματισμός jáde láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ọ̀rọ̀ náà kún un.
- issue: Ìtumọ̀ akọ nínú ἄνδρας
  choice: ọkùnrin
  alternative: ènìyàn
  rationale: Nítorí ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní pàtó, a pa ìyẹn mọ́ dípò ṣíṣe é ní ọ̀rọ̀ gbogbogbò.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti èdè òde òní ni a lò. ‘Tẹ eékún ba’ pa àwòrán ìpilẹ̀ṣẹ̀ mọ́, ó sì yé òǹkàwé lasán gẹ́gẹ́ bí ìtẹríba fún ìjọsìn. Àwọn àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
