  to: 'Gẹ́gẹ́ bí a ti kọ ọ́ sílẹ̀ pé: “Ọlọ́run fún wọn ní ẹ̀mí àìnímọ̀lára[a], ojú tí kì í rí àti etí tí kì í gbọ́, títí di òní yìí.”'
  rationale: Àtúnṣe náà mú ọ̀rọ̀ κατάνυξις wá sí èdè Yorùbá tí ó ṣeé lóye, ó sì rọ́pò ìsọ̀rọ̀ ojú àti etí tí kò tẹ̀lé ìlò Yorùbá dáadáa. A pa gbolóhùn ìtọ́kasí náà, ìṣe tààrà Ọlọ́run, ìfarakanra àwọn ọ̀rọ̀ náà, àti ìtẹnumọ́ “títí di òní yìí” mọ́. Àlàyé ìsàlẹ̀ náà ṣì fi “oorun jíjìn” hàn gẹ́gẹ́ bí àṣàyàn tí ó ní ìbáṣepọ̀ pẹ̀lú Aísáyà.
