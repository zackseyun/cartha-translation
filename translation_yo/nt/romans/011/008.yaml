id: ROM.11.8
reference: Romans 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: yo
  text: 'Gẹ́gẹ́ bí a ti kọ ọ́ sílẹ̀ pé: “Ọlọ́run fún wọn ní ẹ̀mí àìnímọ̀lára[a], ojú tí kì í rí àti etí tí kì í gbọ́, títí di òní yìí.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀mí oorun jíjìn.” Gbólóhùn náà ń tọ́ka sí Aísáyà 29:10, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì tí a lò níbí ń fi ipò ìdákú tàbí àìnímọ̀lára hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Ó jẹ́ ọ̀nà àdáyébá ní Yorùbá láti fi àyọlò Ìwé Mímọ́ hàn, ó sì pa ìtumọ̀ καθώς mọ́.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Ọlọ́run fún wọn ní
  rationale: A pa Ọlọ́run mọ́ gẹ́gẹ́ bí olùṣe ní tààrà, a sì tú aorist náà sí ìṣe àtijọ́ rírọrùn.
- source_word: πνεῦμα κατανύξεως
  choice: ẹ̀mí ìkó-dòríkọ́
  rationale: Ìkó-dòríkọ́ ń sọ ipò ìrònú àti ìmọ̀lára tí ó kú sùn tàbí tí kò dáhùn dáadáa; ó yẹra fún fífi ‘oorun jíjìn’ ṣe ìtumọ̀ pàtó nígbà tí ọ̀rọ̀ Gíríìkì gbòòrò sí i.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: ojú tí kì yóò fi ríran
  rationale: Ìsọ̀rọ̀ yìí jẹ́ ti Yorùbá àdáyébá, ó sì pa ìbáṣepọ̀ ète/àbájáde inú τοῦ μὴ pẹ̀lú ọ̀rọ̀ ìṣe mọ́.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: etí tí kì yóò fi gbọ́rọ̀
  rationale: Ó bá gbólóhùn ojú mu, ó sì tú ἀκούειν gẹ́gẹ́ bí agbára láti gbọ́, láì yí i padà sí títẹ́tí sílẹ̀ nìkan.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: títí di òní yìí
  rationale: Ó pa ìtẹnumọ́ ‘ọjọ́ òní yìí gan-an’ mọ́ ní ọ̀nà tí ó ṣe déédé ní Yorùbá.
theological_decisions:
- issue: Ìṣe Ọlọ́run nínú líle ọkàn tàbí àìnímọ̀lára gẹ́gẹ́ bí ìdájọ́
  choice: “Ọlọ́run fún wọn ní”
  alternative: “Ọlọ́run jẹ́ kí wọ́n ní”
  rationale: Ọ̀rọ̀ Gíríìkì fi Ọlọ́run hàn gbangba gẹ́gẹ́ bí olùṣe Ἔδωκεν. A kò sọ ọ́ di fífàyè gba nìkan, bẹ́ẹ̀ ni a kò fi ètò ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá àdáyébá, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní; a pa ìṣọ̀kan àti ìró àyọlò Ìwé Mímọ́ mọ́, pẹ̀lú àmì ohùn níbi tí ó ti yẹ.
