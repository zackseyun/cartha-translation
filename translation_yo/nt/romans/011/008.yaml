  terminology: “Ẹ̀mí àìnímọ̀lára” jẹ́ ọ̀nà tí ó ṣeé lóye láti sọ ipò ìdákú/ìdẹ̀dẹ̀ ọpọlọ tí πνεῦμα κατανύξεως ń fihàn, láì mú un dọ́gba pátápátá pẹ̀lú “oorun jíjìn” ti àtẹ̀yìnwá Aísáyà. Àṣàyàn kejì náà wà ní àlàyé ìsàlẹ̀.
