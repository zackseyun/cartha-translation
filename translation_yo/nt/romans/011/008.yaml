  source_fidelity: 'Ìtumọ̀ náà pa olùṣe ìṣe náà mọ́ ní tààrà: Ọlọ́run ni ó fún wọn. Síbẹ̀, “ìkó-dòríkọ́” kò ṣe kedere gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá òde òní fún κατάνυξις, àti “ojú tí kì yóò fi ríran ... etí tí kì yóò fi gbọ́rọ̀” ń sọ ìtumọ̀ náà di aláìdánilẹ́kọ̀ọ́, pẹ̀lú ìrísí ọjọ́-òní/ọjọ́-òla tí kò sí nínú Gíríìkì.'
