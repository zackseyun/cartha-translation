id: ROM.11.15
reference: Romans 11:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: yo
  text: Nítorí bí ìkọ̀sílẹ̀ wọn bá mú ìlàjà wá fún ayé, kí ni ìtẹ́wọ́gbà wọn yóò jẹ́ bí kò ṣe ìyè láti inú òkú?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbígba wọn padà.” Ọ̀rọ̀ Gíríìkì náà tako “ìkọ̀sílẹ̀,” ó sì lè túmọ̀ sí títẹ́wọ́ gba wọn tàbí gbígba wọn padà.
    reason: lexical_alternative
  - marker: b
    text: “Ìyè láti inú òkú” lè jẹ́ àpèjúwe ìmúdọ̀tun ẹ̀mí gíga, tàbí ó lè tọ́ka ní pàtó sí àjíǹde; Pọ́ọ̀lù fi gbólóhùn náà sílẹ̀ ní ṣókí, pẹ̀lú agbára àwòrán.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: ìkọ̀sílẹ̀
  rationale: Ó fi hàn pé a kọ àwọn ènìyàn sílẹ̀ tàbí pé a yà wọ́n sí ẹ̀gbẹ́ kan; ó sì bá ìyàtọ̀ rẹ̀ pẹ̀lú πρόσλημψις mu láì sọ pé ìkọ̀sílẹ̀ náà jẹ́ ti ayérayé.
- source_word: καταλλαγὴ
  choice: ìlàjà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìmúpadàbọ̀ ìbáṣepọ̀ rere láàárín àwọn tí ìyapa ti wà tẹ́lẹ̀, ó sì bá lílo ọ̀rọ̀ náà lọ́dọ̀ Pọ́ọ̀lù mu.
- source_word: κόσμου
  choice: ayé
  rationale: Ó pa ìtúmọ̀ gbòòrò ti κόσμος mọ́, láì dín un kù sí àwọn Kèfèrí nìkan bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà ní wọ́n nínú.
- source_word: πρόσλημψις
  choice: ìtẹ́wọ́gbà
  rationale: Ó dá ìtakora tó ṣe kedere sí ìkọ̀sílẹ̀ sílẹ̀, ó sì lè túmọ̀ sí gbígba wọn padà tàbí títẹ́wọ́ gbà wọ́n.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: ìyè láti inú òkú
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì àti àìdánilójú rẹ̀ mọ́, láì fi dandan túmọ̀ rẹ̀ sí àjíǹde tàbí ìsọjí ẹ̀mí nìkan.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Ó bá ìbéèrè àsọyé Yorùbá mu, ó sì ń tọ́ka sí ìdáhùn tí a retí láì túmọ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ ìdí pẹ̀lú àríyànjiyàn ẹsẹ tó ṣáájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ìyè láti inú òkú’
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ṣókí tó ṣí sí ju ìtumọ̀ kan lọ.
  alternative: A lè kà á sí ìmúdọ̀tun ẹ̀mí ńlá, àjíǹde ìkẹyìn, tàbí gbólóhùn tó so àwọn méjèèjì pọ̀.
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù jẹ́ ṣókí, ó sì ní agbára àwòrán; kí a má ṣe yanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì fúnra rẹ̀ kò yanjú.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ètò ìbéèrè àsọyé náà tẹ̀ lé Gíríìkì, a sì fi àìdánilójú ọ̀rọ̀ ìkẹyìn sílẹ̀.
