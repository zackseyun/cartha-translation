id: ROM.11.13
reference: Romans 11:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: yo
  text: 'Mo ń sọ fún yín, ẹ̀yin aláìjẹ́ Júù[a]: níwọ̀n bí mo ṣe jẹ́ àpọ́sítélì fún àwọn aláìjẹ́ Júù, mo ń gbé iṣẹ́ ìránṣẹ́ mi ga[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè,” fún ọ̀rọ̀ náà ní ibi méjèèjì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo ń yin iṣẹ́ ìránṣẹ́ mi lógo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Ṣùgbọ́n mo ń sọ fún ẹ̀yin Kèfèrí
  rationale: Gbólóhùn yìí pa Ὑμῖν àti τοῖς ἔθνεσιν pọ̀ gẹ́gẹ́ bí ìpè tààrà sí àwọn olùgbọ́ tí kì í ṣe Júù. “Ṣùgbọ́n” fi ìyípadà díẹ̀ tí δέ ń mú wá hàn láìsọ ọ́ di àtakò líle.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: níwọ̀n bí
  rationale: Ó ṣàfihàn ìwọ̀n tàbí ìpìlẹ̀ ọ̀rọ̀ Paulu ní Yorùbá àdánidá; àwọn patíkù μὲν οὖν kò nílò kí a túmọ̀ wọn lọ́kọ̀ọ̀kan.
- source_word: εἰμι ἐγὼ ἐθνῶν ἀπόστολος
  choice: èmi ti jẹ́ aposteli sí àwọn Kèfèrí
  rationale: “Èmi” pa ìtẹnumọ́ ἐγώ mọ́, “aposteli” sì tọ́ka sí iṣẹ́ àṣẹ pàtó Paulu. “Sí àwọn Kèfèrí” fi ibi tí iṣẹ́ rẹ̀ dojú kọ hàn.
- source_word: τὴν διακονίαν μου
  choice: iṣẹ́ ìránṣẹ́ mi
  rationale: Yíyan yìí pa èrò iṣẹ́ ìsìn àti iṣẹ́ tí a fi lé ẹni lọ́wọ́ inú διακονία mọ́, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: δοξάζω
  choice: mo ń fi ọlá fún
  rationale: Ó gbé ìtumọ̀ fífi iyì tàbí ọlá fún iṣẹ́ náà jáde, láìdá a sí fífi ara ẹni yangàn.
theological_decisions:
- issue: Ohun tí Paulu túmọ̀ sí nípa iṣẹ́ ìránṣẹ́ rẹ̀
  choice: Ó ń fi ọlá fún iṣẹ́ ìránṣẹ́ rẹ̀, kì í ṣe pé ó ń yin ara rẹ̀ lógo.
  alternative: Mo ń gbé iṣẹ́ ìránṣẹ́ mi ga; mo ń yin iṣẹ́ ìránṣẹ́ mi lógo.
  rationale: Ohun tí δοξάζω ń ṣe sí ni “iṣẹ́ ìránṣẹ́ mi,” kì í ṣe Paulu fúnra rẹ̀. Yíyan náà pa agbára ọ̀rọ̀ mọ́ láìfi ìkọ́ni nípa ìyangàn ara ẹni kún un.
- issue: Ẹni tí ἔθνη / ἐθνῶν ń tọ́ka sí
  choice: Àwọn Kèfèrí, ìyẹn àwọn tí kì í ṣe Júù.
  alternative: Àwọn orílẹ̀-èdè.
  rationale: Nínú Róòmù 9–11, àfiwé pàtàkì wà láàárín Ísírẹ́lì àti àwọn ènìyàn tí kì í ṣe Júù; “Kèfèrí” mú ìyàtọ̀ yẹn hàn dáadáa.
translation_notes:
  register: Yorùbá àfọwọ́kọ jẹ́ ti ìpele ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yin” fún ọ̀pọ̀ ènìyàn, “Kèfèrí” fún ìyàtọ̀ Júù/àìjẹ́-Júù nínú àyíká yìí, àti “iṣẹ́ ìránṣẹ́” láti yẹra fún ọ̀rọ̀ ẹ̀sìn tí ó le ṣókùnkùn. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
