id: ROM.11.2
reference: Romans 11:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: yo
  text: Ọlọ́run kò kọ àwọn ènìyàn rẹ̀ tí ó ti mọ̀ tẹ́lẹ̀[a] sílẹ̀. Àbí ẹ̀yin kò mọ̀ ohun tí Ìwé Mímọ́ sọ nínú abala Ìwé Mímọ́ nípa Èlíjà[b], bí Èlíjà ṣe ń bẹ Ọlọ́run lòdì sí Ísírẹ́lì[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Mọ̀ tẹ́lẹ̀’ tún lè jẹ́ ‘mọ̀ láti ìṣáájú.’ Àwọn kan ka ọ̀rọ̀ Gíríìkì náà sí ohun tó ní ìtumọ̀ tó lágbára bí ‘yàn tẹ́lẹ̀,’ ṣùgbọ́n a kò pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ yẹn nínú ọ̀rọ̀ pàtàkì.
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, ‘nínú Èlíjà’; èyí jẹ́ ọ̀nà ìsọ̀rọ̀ fún abala Ìwé Mímọ́ tí ó sọ nípa Èlíjà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí ‘bí Èlíjà ṣe ń bẹ Ọlọ́run ní ẹ̀bẹ̀ lòdì sí Ísírẹ́lì.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: kò kọ ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí kí a kọ ẹnì kan tàbí kí a lé e kúrò. ‘Kọ ... sílẹ̀’ jẹ́ ọ̀nà Yorùbá òde òní tí ó ṣe kedere, tí ó sì bá ìsẹ̀lẹ̀ náà mu.
- source_word: τὸν λαὸν αὐτοῦ
  choice: àwọn ènìyàn rẹ̀
  rationale: Èyí pa ìtumọ̀ àwọn ènìyàn tí í ṣe ti Ọlọ́run mọ́ láìfi ‘Ísírẹ́lì’ kún gbólóhùn àkọ́kọ́, níwọ̀n bí orúkọ náà ti fara hàn ní òpin ẹsẹ náà.
- source_word: προέγνω
  choice: tí ó ti mọ̀ tẹ́lẹ̀
  rationale: Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù ni ‘mọ̀ tẹ́lẹ̀.’ A kò fi ìtumọ̀ tó lágbára sí i bí ‘yàn tẹ́lẹ̀’ sínú ọ̀rọ̀ pàtàkì, kí àìdánilójú ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà lè wà.
- source_word: ἢ οὐκ οἴδατε
  choice: Àbí ẹ̀yin kò mọ
  rationale: Èyí jẹ́ ìbéèrè àsọyé tí Pọ́ọ̀lù fi ń tọ́ka sí ohun tí àwọn olùgbọ́ yẹ kí wọ́n mọ̀.
- source_word: ἐν Ἠλίᾳ
  choice: nínú abala tí ó jẹ́ ti Èlíjà
  rationale: Àṣà ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí abala Ìwé Mímọ́ nípa Èlíjà, kì í ṣe pé ohun kan wà nínú Èlíjà fúnra rẹ̀.
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Nínú lílo Pọ́ọ̀lù, ọ̀rọ̀ náà ń tọ́ka sí Ìwé Mímọ́, ‘Ìwé Mímọ́’ sì jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání fún un.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: bí Èlíjà ṣe ń rawọ́ ẹ̀bẹ̀ sí Ọlọ́run
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí kí a ké pe, rawọ́ ẹ̀bẹ̀, tàbí bẹ̀bẹ̀ lọ́dọ̀ ẹnì kan. A tún orúkọ Èlíjà sọ dípò arọ́pò-orúkọ nítorí ìmọ́ye kedere ní Yorùbá.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: lòdì sí Ísírẹ́lì
  rationale: κατά pẹ̀lú ẹ̀yà ọ̀rọ̀ yìí ní ìtumọ̀ ìtakò, ‘lòdì sí’; a sì pa orúkọ Ísírẹ́lì mọ́ gẹ́gẹ́ bí ó ti wà.
theological_decisions:
- issue: Ìtumọ̀ προέγνω ní ìbáṣepọ̀ pẹ̀lú yíyan Ọlọ́run
  choice: tí ó ti mọ̀ tẹ́lẹ̀
  alternative: tí ó ti yàn tẹ́lẹ̀; tí ó ti nífẹ̀ẹ́ sí tẹ́lẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè wọ inú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa yíyan Ọlọ́run, ṣùgbọ́n ìtumọ̀ kò gbọdọ̀ pinnu àríyànjiyàn náà ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ lọ. ‘Mọ̀ tẹ́lẹ̀’ pa ìtumọ̀ ìpilẹ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Àwọn ènìyàn rẹ̀’ pa ìmọ̀ ìbáṣepọ̀ májẹ̀mú mọ́, ‘abala tí ó jẹ́ ti Èlíjà’ sì tú àṣà ọ̀rọ̀ Gíríìkì sí Yorùbá àdánidá.
