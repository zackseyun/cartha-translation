- from: Nítorí bí Ọlọ́run kò bá dá àwọn ẹ̀ka àbínibí sí[a], òun kì yóò dá ìwọ náà sí.
  to: Nítorí bí Ọlọ́run kò ṣàánú àwọn ẹ̀ka àbínibí[a], òun kì yóò ṣàánú rẹ̀ náà.
  rationale: The revision uses ṣàánú as the transparent and natural equivalent of “spare,” retains the repeated verb and the singular force of σοῦ through rẹ̀, and removes interpretive material from the lexical footnote. It leaves the branch metaphor and its referent unexpanded.
