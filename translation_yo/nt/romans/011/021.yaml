id: ROM.11.21
reference: Romans 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: yo
  text: Nítorí bí Ọlọ́run kò ṣàánú àwọn ẹ̀ka àbínibí[a], òun kì yóò ṣàánú rẹ̀ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀ka tí ó jẹ́ àbínibí”; ní tààrà, “àwọn ẹ̀ka ní ìbámu pẹ̀lú ìṣẹ̀dá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: Ó pa ìsopọ̀ àlàyé γάρ àti ipò àdéhùn εἰ mọ́ nínú Yorùbá àdánidá.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún θεός.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: àwọn ẹ̀ka àbínibí
  rationale: “Àbínibí” fi ìtumọ̀ κατὰ φύσιν hàn gẹ́gẹ́ bí ohun tí ó jẹ́ ti igi náà nípa ìṣẹ̀dá, láìṣàlàyé ẹni tí àkàwé náà dúró fún.
- source_word: οὐκ ἐφείσατο
  choice: kò ... dá ... sí
  rationale: Ọ̀rọ̀ àpólà Yorùbá “dá ... sí” túmọ̀ sí láti ṣàánú tàbí yà ẹni sílẹ̀ kúrò nínú ìpalára, ó sì lè tún ṣe àfiwé ọ̀rọ̀-ìṣe náà ní abala kejì.
- source_word: οὐδὲ σοῦ φείσεται
  choice: òun kì yóò dá ìwọ náà sí
  rationale: Ó pa ìtẹnumọ́ àtẹ̀lé òdì οὐδέ àti “ìwọ” ẹyọ ọ̀kan (σοῦ) mọ́.
theological_decisions:
- issue: Ẹni tí “àwọn ẹ̀ka àbínibí” dúró fún nínú àkàwé igi ólífì
  choice: A pa àkàwé àwọn ẹ̀ka mọ́ láìdarúkọ Ísírẹ́lì nínú ẹsẹ̀ náà.
  alternative: Ṣàlàyé rẹ̀ ní tààrà pé àwọn ẹ̀ka náà ni Ísírẹ́lì ẹ̀yà.
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí Ísírẹ́lì, ṣùgbọ́n Pọ́ọ̀lù sọ ọ́ nípasẹ̀ àkàwé; ìtumọ̀ náà kò gbọ́dọ̀ kọjá ohun tí Gíríìkì sọ ní tààrà.
- issue: Agbára ìkìlọ̀ sí “ìwọ”
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ìkìlọ̀ tààrà sí “ìwọ” ẹyọ ọ̀kan.
  alternative: Fi àlàyé ẹ̀kọ́ ìgbàlà kan kún un nípa ìforítì, ìṣubú kúrò nínú ìgbàgbọ́, tàbí yíyan ẹgbẹ́ àti ẹnì kọ̀ọ̀kan.
  rationale: Gíríìkì fúnra rẹ̀ jẹ́ ìkìlọ̀ gidi, ṣùgbọ́n kò yanju gbogbo àríyànjiyàn ẹ̀kọ́ ìgbàlà; nítorí náà a kò fi ìtumọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì pa àkàwé igi àti ìkìlọ̀ líle ti orísun mọ́.
