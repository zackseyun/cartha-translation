    reason: lexical_alternative
  revision_rationale: The revision uses ṣàánú as the transparent and natural equivalent of “spare,” retains the repeated verb and the singular force of σοῦ through rẹ̀, and removes interpretive material from the lexical footnote. It leaves the branch metaphor and its referent unexpanded.
