review_pass:
  verdict: revise
  source_fidelity: The draft preserves the explanatory conditional, the olive-tree metaphor, the negative parallel, and the singular addressee. However, “dá ... sí” is not as clear or idiomatic here as the direct Yoruba verb “ṣàánú” for Greek φείδομαι (“spare”).
  naturalness: “Kò dá ... sí” is potentially obscure in this context. “Kò ṣàánú ...; kì yóò ṣàánú rẹ̀ náà” is clear, natural Standard Yoruba and preserves the solemn warning.
  terminology: “Ọlọ́run” and “àwọn ẹ̀ka àbínibí” are suitable. The footnote should not add “ti igi náà,” since the Greek does not explicitly say “of the tree,” and its literal gloss should render κατὰ φύσιν more accurately as “ní ìbámu pẹ̀lú ìṣẹ̀dá.”
  issues:
  - severity: medium
    issue: The rendering “dá ... sí” for φείδομαι is unclear/marked in this warning context.
    rationale: Greek φείδομαι means “spare,” and “ṣàánú” is the direct, idiomatic Yoruba equivalent that also permits the verbal repetition in both clauses.
  - severity: low
    issue: The footnote introduces “igi náà” (“the tree”).
    rationale: Although the larger metaphor involves a tree, this phrase is not stated in Romans 11:21 itself. The alternative should remain lexical rather than add contextual material.
  - severity: low
    issue: The footnote's “gẹ́gẹ́ bí ìṣẹ̀dá” is a less exact and less natural representation of κατὰ φύσιν.
    rationale: “Ní ìbámu pẹ̀lú ìṣẹ̀dá” more directly conveys “according to nature.”
  revised_text: Nítorí bí Ọlọ́run kò ṣàánú àwọn ẹ̀ka àbínibí[a], òun kì yóò ṣàánú rẹ̀ náà.
  revised_footnotes:
