id: ROM.11.20
reference: Romans 11:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: yo
  text: 'Ó dára: nítorí àìgbàgbọ́ ni a fi ṣẹ́ wọn kúrò, ṣùgbọ́n nítorí ìgbàgbọ́ ni ìwọ fi dúró. Má ṣe gbéraga, ṣùgbọ́n bẹ̀rù.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς
  choice: Ó dára
  rationale: Ó jẹ́ ìfọwọ́sí ohun tí ẹni tí Pọ́ọ̀lù ń bá sọ sọ ní ẹsẹ tó ṣáájú; ó tún lè túmọ̀ sí ‘Bẹ́ẹ̀ ni.’
- source_word: ἀπιστίᾳ
  choice: nítorí àìgbàgbọ́
  rationale: Dative náà ní agbára ìdí tàbí ọ̀nà ní àyíká yìí; ‘nítorí’ mú ìdí tí a fi ṣẹ́ àwọn ẹ̀ka náà kúrò hàn, ó sì pa ìyàtọ̀ rẹ̀ sí πίστις mọ́.
- source_word: ἐξεκλάσθησαν
  choice: a fi ṣẹ́ wọn kúrò
  rationale: Ó pa àwòrán igi ólífì tó wà ní àyíká ọ̀rọ̀ náà mọ́, ó sì ṣe àfihàn bí a ṣe ṣẹ́ ẹ̀ka kúrò lára igi.
- source_word: πίστει
  choice: nípa ìgbàgbọ́
  rationale: Dative náà ń tọ́ka sí ọ̀nà tàbí ìpìlẹ̀ tí ẹni náà fi dúró; ‘ìgbàgbọ́’ bá ìlò Pọ́ọ̀lù àti ìyàtọ̀ sí ‘àìgbàgbọ́’ mu.
- source_word: ἕστηκας
  choice: ìwọ dúró
  rationale: Perfect náà sọ ipò tó ń bá a lọ lẹ́yìn ohun tó ti ṣẹlẹ̀; ‘ìwọ dúró’ jẹ́ Yorùbá àdánidá tí kò ṣe àlàyé ju ohun tí Gíríìkì sọ lọ.
- source_word: ὑψηλὰ φρόνει
  choice: Má ṣe gbéraga
  rationale: Ọ̀rọ̀ àpèjúwe náà túmọ̀ sí kí ènìyàn má ṣe ní èrò gíga tàbí ìgbéraga nípa ara rẹ̀; ‘gbéraga’ ṣe ìtumọ̀ náà ní kedere fún òǹkàwé òde òní.
- source_word: φοβοῦ
  choice: bẹ̀rù
  rationale: Aṣẹ ìsinsìnyí náà pa agbára ìkìlọ̀ mọ́, láì rọ̀ ọ́ sí ọ̀wọ̀ lásán tàbí mú un le sí ìpayà.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní ìyàtọ̀ sí ἀπιστία
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Ìyàtọ̀ tó hàn gbangba sí ‘àìgbàgbọ́’ tọ́ka sí ìdáhùn ènìyàn nípa ìgbàgbọ́; síbẹ̀, ‘ìgbẹ́kẹ̀lé’ jẹ́ ọ̀nà àlàyé tó ṣeé ṣe.
- issue: Agbára φοβοῦ
  choice: bẹ̀rù
  alternative: máa bẹ̀rù; ní ìbẹ̀rù ọlọ́wọ̀
  rationale: Ọ̀rọ̀ náà kìlọ̀ lòdì sí ìgbéraga àti ìgbẹ́kẹ̀lé ara ẹni. ‘Bẹ̀rù’ pa ìdọ̀gbà ẹ̀kọ́ ìgbàgbọ́ náà mọ́, láì sọ ọ́ di ọ̀wọ̀ lásán tàbí ìpayà.
translation_notes:
  register: Yorùbá àṣàjú, ọlọ́lá, tó sì ṣeé lóye ni a lò. A yan ‘ṣẹ́ ... kúrò’ láti pa àwòrán ẹ̀ka igi mọ́, ‘gbéraga’ fún àṣà-ọ̀rọ̀ ὑψηλὰ φρόνει, àti ‘bẹ̀rù’ láti pa líle ìkìlọ̀ Gíríìkì mọ́. A kò fi àmì àlàyé sí ọ̀rọ̀ pàtàkì nítorí ọ̀rọ̀ àkọ́kọ́ lè dúró ní kedere láìsí wọn.
