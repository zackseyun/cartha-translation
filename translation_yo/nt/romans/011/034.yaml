id: ROM.11.34
reference: Romans 11:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: yo
  text: Nítorí ta ni ó ti mọ èrò inú Olúwa? Tàbí ta ni ó ti di olùdámọ̀ràn rẹ̀?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọ́ọ̀lù ń ṣe àtúnsọ Aísáyà 40:13, níbi tí ọ̀rọ̀ Gíríìkì náà ti béèrè bákan náà pé ta ni ó ti mọ èrò inú Olúwa tàbí tí ó ti di olùdámọ̀ràn rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: ta ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbéèrè ni; ‘ta ni’ jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa agbára ìbéèrè àsọyé náà mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé, láìfi ìtumọ̀ míì kún un.
- source_word: ἔγνω
  choice: ó ti mọ
  rationale: ‘Ó ti mọ’ mú ìbéèrè náà dúró gẹ́gẹ́ bí ohun tó kan gbogbo ìgbà, ó sì sún mọ́ ìtumọ̀ γινώσκω ju ‘lóye’ lọ.
- source_word: νοῦν
  choice: èrò inú
  rationale: Ní àyíká yìí νοῦς tọ́ka sí èrò, ìpinnu, tàbí ohun tó wà lọ́kàn. ‘Èrò inú’ jẹ́ Yorùbá àdánidá tí kò fi ìtumọ̀ náà mọ́ ‘ọpọlọ’ tàbí ‘òye’ nìkan.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος nínú ọ̀rọ̀ yìí, ó sì pa ìtọ́kasí sí Ọlọ́run nínú àyọlò Aísáyà mọ́.
- source_word: ἢ
  choice: Tàbí
  rationale: Ó pa ìṣètò ìbéèrè méjì tó jọra àti ìyàtọ̀ alásopọ̀ Gíríìkì mọ́.
- source_word: σύμβουλος
  choice: olùdámọ̀ràn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tó ń fún ẹlòmíràn ní ìmọ̀ràn; ‘olùdámọ̀ràn’ jẹ́ kedere, ó sì ní ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ mímọ́.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Arọ́pò-orúkọ oníhun Yorùbá tó tọ́ ni fún ‘tirẹ̀,’ ó sì tọ́ka sí Olúwa.
- source_word: ἐγένετο
  choice: ó ti di
  rationale: ‘Ó ti di’ fi ìtumọ̀ ‘di’ tàbí ‘wá sí ipò kan’ hàn, ó sì bá agbára ìbéèrè náà mu pé kò sí ẹni tó ti gba ipò yìí sí Ọlọ́run rí.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí nínú àyọlò Aísáyà
  choice: A tú κύριος sí ‘Olúwa’ láìfi àlàyé tó dín ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kù; nínú àyíká yìí ó tọ́ka sí Ọlọ́run.
  alternative: Lílo ‘OLÚWA’ láti mú orúkọ májẹ̀mú Ọlọ́run nínú Aísáyà hàn ní tààràtà.
  rationale: Ọ̀rọ̀ Gíríìkì Róòmù ní κυρίου. ‘Olúwa’ pa ọ̀rọ̀ Májẹ̀mú Tuntun mọ́, ó sì jẹ́ kí àyọlò Aísáyà hàn láìgbé ọ̀nà ìtumọ̀ kan wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìtumọ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìṣètò ìbéèrè àsọyé méjì àti ìró àyọlò Ìwé Mímọ́ mọ́.
