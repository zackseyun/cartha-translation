id: ROM.11.1
reference: Romans 11:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: yo
  text: Nítorí náà, mo béèrè pé, “Ǹjẹ́ Ọlọ́run ti kọ àwọn ènìyàn rẹ̀ sílẹ̀[a]?” Kí ó má rí bẹ́ẹ̀![b] Nítorí èmi fúnra mi jẹ́ ọmọ Ísírẹ́lì, láti inú irú-ọmọ Ábúráhámù[c], láti inú ẹ̀yà Bẹ́ńjámínì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “ti lé àwọn ènìyàn rẹ̀ kúrò lọ́dọ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: “Kí ó má rí bẹ́ẹ̀”; gbólóhùn ìkọ̀ líle ni, tí a tún lè túmọ̀ sí, “Rárá o, kò ṣeé ṣe!”'
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààràtà: “láti inú irúgbìn Ábúráhámù.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Nítorí náà, mo béèrè pé
  rationale: Ó mú ìtumọ̀ ìyọrísí οὖν àti iṣẹ́ λέγω gẹ́gẹ́ bí ìṣíwájú ìbéèrè àròsọ jáde ní Yorùbá àdánidá.
- source_word: μὴ ἀπώσατο
  choice: Ǹjẹ́ ... ti kọ ... sílẹ̀
  rationale: Ìbéèrè pẹ̀lú μή ń retí ìdáhùn òdì; ‘kọ ... sílẹ̀’ sọ ìkọ̀sílẹ̀ tàbí ìtakò kedere láìfi ‘títí láé’ tàbí ‘pátápátá’ kún un.
- source_word: τὸν λαὸν αὐτοῦ
  choice: àwọn ènìyàn rẹ̀
  rationale: Ó pa ìtumọ̀ àwọn ènìyàn tí í ṣe tirẹ̀ mọ́, láìṣàlàyé ìbáṣepọ̀ májẹ̀mú ju ohun tí ọ̀rọ̀ náà sọ lọ.
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ láéláé!
  rationale: Gbólóhùn yìí jẹ́ ìkọ̀ líle ní Yorùbá, ó sì pa agbára optative Gíríìkì mọ́ ju ‘Rárá’ lásán lọ.
- source_word: καὶ γὰρ ἐγὼ
  choice: Nítorí èmi fúnra mi
  rationale: ‘Nítorí’ fi γάρ hàn, ‘èmi fúnra mi’ sì mú ìtẹnumọ́ ἐγώ jáde gẹ́gẹ́ bí ẹ̀rí Pọ́ọ̀lù.
- source_word: Ἰσραηλίτης
  choice: ọmọ Ísírẹ́lì
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti tọ́ka sí ẹni tí ó jẹ́ ará Ísírẹ́lì nípa ìran àti ìdánimọ̀.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: láti inú irú-ọmọ Ábúráhámù
  rationale: ‘Irú-ọmọ’ jẹ́ ọ̀rọ̀ àdánidá fún àwọn àtọmọdọ́mọ, ó sì ṣì pa àwòrán ‘irúgbìn/seed’ mọ́ dé ìwọ̀n kan.
- source_word: φυλῆς Βενιαμίν
  choice: láti inú ẹ̀yà Bẹ́ńjámínì
  rationale: ‘Ẹ̀yà’ ni ìbámu Yorùbá tó ṣe kedere fún φυλή nínú àyíká ìran Ísírẹ́lì.
theological_decisions:
- issue: Bóyá ìbéèrè Pọ́ọ̀lù túmọ̀ sí pé Ọlọ́run kọ Ísírẹ́lì nípa ẹ̀yà pátápátá tàbí títí láé
  choice: A túmọ̀ ọ́ láìfi ‘pátápátá’ tàbí ‘títí láé’ kún ìbéèrè náà.
  alternative: ‘Ǹjẹ́ Ọlọ́run ti kọ àwọn ènìyàn rẹ̀ sílẹ̀ pátápátá/títí láé?’
  rationale: Kò sí ọ̀rọ̀ adverb bẹ́ẹ̀ nínú Gíríìkì; àyíká tó tẹ̀ lé ni yóò ṣàlàyé bí ìkọ̀sílẹ̀ náà ṣe gbòòrò. Èyí pa ìfọ̀kànsìn ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà mọ́ láìyanjú rẹ̀ ṣáájú.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ìbéèrè àròsọ àti ìkọ̀ líle láti pa ìṣísẹ̀ àríyànjiyàn Pọ́ọ̀lù mọ́.
