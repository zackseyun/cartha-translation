id: ROM.11.22
reference: Romans 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: yo
  text: 'Nítorí náà, wo inú rere àti ìwà líle Ọlọ́run: ìwà líle sí àwọn tí ó ṣubú, ṣùgbọ́n inú rere Ọlọ́run sí ọ, bí o bá tẹ̀síwájú nínú inú rere Ọlọ́run náà; bí bẹ́ẹ̀ kọ́, a ó gé ìwọ náà kúrò.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “a ó já ọ náà kúrò.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “gé kúrò”; “já kúrò” sì jẹ́ ìtumọ̀ mìíràn nítorí àwòrán ẹ̀ka igi ólífì nínú àwọn ẹsẹ tó yí i ká.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: wo
  rationale: Ọ̀rọ̀ àṣẹ yìí pe olùgbọ́ láti kíyè sí ohun náà kí ó sì ronú jinlẹ̀; “wo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára ìkìlọ̀ náà mọ́.
- source_word: χρηστότητα / χρηστότης
  choice: inú rere
  rationale: “Inú rere” sọ ìṣe rere onínúure Ọlọ́run jáde ní ọ̀nà tí ó ṣe kedere, ó sì dúró ní ìtakora pẹ̀lú ìmúná.
- source_word: ἀποτομίαν / ἀποτομία
  choice: ìmúná
  rationale: Níhìn-ín ọ̀rọ̀ náà túmọ̀ sí bí Ọlọ́run ṣe le koko, tí ó sì mú ìdájọ́ ṣẹ láìyẹsẹ̀; “ìmúná” jẹ́ èdè Yorùbá ọlọ́wọ̀ àti àdánidá fún ìtumọ̀ yìí.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: sí àwọn tí ó ṣubú
  rationale: “Sí” fi ipa tàbí ìtọ́kasí ìmúná Ọlọ́run sí àwọn tí ó ṣubú hàn, ní ìbámu pẹ̀lú ìtakora gírámà Gíríìkì.
- source_word: ἐπὶ δὲ σὲ
  choice: sí ọ
  rationale: Ó pa ìfarawé gbolohun méjèèjì mọ́, ó sì tọ́ka inú rere Ọlọ́run sí ẹni tí a ń bá sọ̀rọ̀.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: bí ìwọ bá ń bá a lọ nínú inú rere rẹ̀
  rationale: Ó pa ipò àídájú náà mọ́, “nínú” sì fi ìtẹ̀síwájú lábẹ́ tàbí nínú ààyè inú rere Ọlọ́run hàn láìṣàlàyé ẹ̀kọ́ ìgbàgbọ́ kan sí i.
- source_word: ἐπεὶ
  choice: bí bẹ́ẹ̀ kọ́
  rationale: Nínú ìṣàn ọ̀rọ̀ yìí, ó ń mú àbájáde odi wá bí ipò tí a sọ ṣáájú kò bá ṣẹ; “bí bẹ́ẹ̀ kọ́” jẹ́ Yorùbá àdánidá fún ìlànà yẹn.
- source_word: ἐκκοπήσῃ
  choice: a ó gé ìwọ náà kúrò
  rationale: Ó tẹ̀lé agbára gangan ti ἐκκόπτω, ó sì bá àwòrán igi ólífì tó yí ẹsẹ náà ká mu.
theological_decisions:
- issue: Ìkìlọ̀ onípò nípa inú rere àti ìdájọ́ Ọlọ́run
  choice: 'A pa ìkìlọ̀ náà mọ́ gẹ́gẹ́ bí ipò gidi: bí ẹni tí a ń bá sọ̀rọ̀ bá ń bá a lọ nínú inú rere Ọlọ́run, inú rere náà wà sí i; bí bẹ́ẹ̀ kọ́, a ó gé e kúrò.'
  alternative: Kí a sọ ìkìlọ̀ náà di àròsọ lásán tàbí kí a fi ẹ̀kọ́ ìjọ kan nípa ìfaradà tàbí ìṣubú kún un.
  rationale: Gíríìkì fi ipò àti ìkìlọ̀ hàn gbangba, ṣùgbọ́n kò dá àríyànjiyàn nípa ìfaradà, ìṣubú kúrò nínú ìgbàgbọ́, tàbí bóyá ẹni kọ̀ọ̀kan tàbí àwùjọ ni a ń sọ̀rọ̀ rẹ̀ sí. Ìtumọ̀ náà pa ìfọ̀kànbalẹ̀ ẹ̀kọ́ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ìmúná” fún ìdájọ́ líle láìfi ìwà ìkà kún Ọlọ́run; a sì pa ìtakora “inú rere/ìmúná” àti ìkìlọ̀ onípò mọ́.
