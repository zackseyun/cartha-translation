  to: 'Nítorí náà, wo inú rere àti ìwà líle Ọlọ́run: ìwà líle sí àwọn tí ó ṣubú, ṣùgbọ́n inú rere Ọlọ́run sí ọ, bí o bá tẹ̀síwájú nínú inú rere Ọlọ́run náà; bí bẹ́ẹ̀ kọ́, a ó gé ìwọ náà kúrò.[a]'
  rationale: A rọ́pò “ìmúná” pẹ̀lú “ìwà líle” nítorí pé ọrọ̀ náà bá ἀποτομία—líle nínú ìdájọ́—mu dáadáa, ó sì pa ìtakora rẹ̀ pẹ̀lú χρηστότης (“inú rere”) mọ́. A tún sọ ìtọ́kasí inú rere náà di kedere. Ìkìlọ̀ onípò náà, àti àìfi ẹ̀kọ́ ìjọ kan kún un, wà bí ó ti rí nínú Gíríìkì.
