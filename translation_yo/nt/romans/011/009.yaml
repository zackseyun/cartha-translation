  to: Dáfídì sì sọ pé, “Kí tábìlì wọn di ìdẹ̀ àti ìdẹkùn,[a] àti ohun ìkọ̀sẹ̀, àti ìsanpadà fún wọn.[b]”
  rationale: Àtúnṣe náà yọ “okùn” kúrò kí ìtumọ̀ θήραν má bàa di pàtó ju ti orísun lọ, ó sì lo “ìsanpadà” fún ἀνταπόδομα láti pa ìtumọ̀ ìpadà-ẹ̀san/ìjìyà mọ́ ní ọ̀nà Yorùbá tó mọ́. A kò yí agbára ìfẹ́-ìdájọ́ nínú “Kí ... di” tàbí ìtòlẹ́sẹẹsẹ àwòrán Gíríìkì padà.
