  source_fidelity: 'Àkọ́kọ́ ọ̀rọ̀ náà ń tẹ̀lé Gíríìkì náà dáadáa: “Kí ... di” ń pa ìfẹ́/àṣẹ Γενηθήτω mọ́, “tábìlì” ń dá τράπεζα silẹ̀ ní ìtumọ̀ gidi rẹ̀, àti “ohun ìkọ̀sẹ̀” yẹ fún σκάνδαλον. Síbẹ̀, “okùn ìdẹkùn” fi ohun èlò pàtó (okùn) kún θήραν tí orísun kò sọ. “Ìdẹkùn” nìkan dá ìtumọ̀ ohun tí a fi ń dẹ́kùn tàbí ohun ọdẹ mú mọ́lẹ̀ silẹ̀ láì ṣàfikún àlàyé.'
