source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: yo
  text: Dáfídì sì sọ pé, “Kí tábìlì wọn di ìdẹ̀ àti ìdẹkùn,[a] àti ohun ìkọ̀sẹ̀, àti ìsanpadà fún wọn.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdẹ̀ àti ìdẹkùn ọdẹ”; àwọn ọ̀rọ̀ méjèèjì sún mọ́ra ní ìtumọ̀, wọ́n sì ń tọ́ka sí ohun tí a fi ń mú ẹni mọ́lẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀san” tàbí “ẹ̀san ìdájọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: Dáfídì
  rationale: Ìkọ̀wé orúkọ David ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ náà ní Yorùbá.
- source_word: λέγει
  choice: sọ pé
  rationale: Ó pa ìsinsìnyí lítíréṣọ̀ mọ́ ní ọ̀nà àdánidá fún fífi ọ̀rọ̀ àyọlò hàn.
- source_word: Γενηθήτω
  choice: Kí ... di
  rationale: Ó fi agbára àṣẹ tàbí ìfẹ́ júsífù ti ọ̀rọ̀ Gíríìkì hàn, láì sọ ọ́ di àsọtẹ́lẹ̀ lasan.
- source_word: τράπεζα
  choice: tábìlì
  rationale: Ó pa àwòrán gidi ti tábìlì mọ́, bó tilẹ̀ jẹ́ pé ó tún lè tọ́ka sí oúnjẹ àti ìpèsè.
- source_word: παγίδα
  choice: ìdẹ̀
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a fi ń mú ẹni tàbí ẹranko mọ́lẹ̀.
- source_word: θήραν
  choice: okùn ìdẹkùn
  rationale: Ó yà á díẹ̀ sí ìdẹ̀ àkọ́kọ́, ó sì pa ìtumọ̀ ohun èlò ọdẹ tí ń mú mọ́lẹ̀ mọ́.
- source_word: σκάνδαλον
  choice: ohun ìkọ̀sẹ̀
  rationale: Ó pa àwòrán ohun tí ń mú kí ènìyàn kọsẹ̀ tàbí ṣubú mọ́.
- source_word: ἀνταπόδομα
  choice: ẹ̀san
  rationale: Ó túmọ̀ sí ohun tí a san padà gẹ́gẹ́ bí ìwà tàbí iṣẹ́ ẹni; àyíká ọ̀rọ̀ fi hàn pé ẹ̀san ìdájọ́ ni, láì fi ìtumọ̀ tó ju orísun lọ kún un.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí ẹ̀san náà dé bá.
theological_decisions:
- issue: Ọ̀rọ̀ èébú/ìdájọ́ tí a fa yọ láti Sáàmù 69:22
  choice: Kí tábìlì wọn di...
  alternative: Tábìlì wọn yóò di...
  rationale: A pa àṣẹ-ìfẹ́ tí Γενηθήτω ní mọ́, dípò yíyí i padà sí àsọtẹ́lẹ̀ tàbí rírẹ agbára ìdájọ́ rẹ̀ kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “sì” fún καί gẹ́gẹ́ bí àsopọ̀ sí ẹsẹ tó ṣáájú.
