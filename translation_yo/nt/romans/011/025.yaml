  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ọ̀pọ̀ èrò ẹsẹ náà dáadáa, ṣùgbọ́n “líle ọkàn ti dé bá apá kan Ísírẹ́lì” yí ἀπὸ μέρους padà sí apá kan nínú Ísírẹ́lì, dípò kí ó sọ pé líle ọkàn náà ṣẹlẹ̀ sí Ísírẹ́lì ní ìwọ̀n kan. Bákan náà, “ẹ̀kún” kì í ṣe ìbámu tó yẹ fún πλήρωμα níbí; “ìkún” ni “fullness.”
  naturalness: Ọ̀rọ̀ náà lè ka dáadáa lẹ́yìn àtúnṣe. “Kí ẹ má ṣe jẹ́ aláìmọ̀ nípa” jẹ́ ọ̀nà Yorùbá tó rọrùn àti tó ṣe kedere fún ọ̀rọ̀ ìbẹ̀rẹ̀ náà. “Ní ojú ara yín” jẹ́ ọ̀nà àdánidá fún ìkìlọ̀ náà.
  terminology: “Ohun ìjìnlẹ̀,” “líle ọkàn,” Ísírẹ́lì, àti “àwọn Kèfèrí” yẹ fún ìforúkọsílẹ̀ Bíbélì náà. A tún ìtumọ̀ πλήρωμα ṣe sí “ìkún” láti pa àìdánilójú ìtumọ̀ rẹ̀ mọ́, láì fi dandan sọ pé iye péré ni a ń tọ́ka sí.
  issues:
