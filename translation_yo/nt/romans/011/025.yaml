id: ROM.11.25
reference: Romans 11:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: yo
  text: 'Nítorí èmi kò fẹ́ kí ẹ má ṣe jẹ́ aláìmọ̀ nípa ohun ìjìnlẹ̀ yìí, ẹ̀yin arákùnrin[a], kí ẹ má bàa gbọ́n ní ojú ara yín: líle ọkàn ti ṣẹlẹ̀ sí Ísírẹ́lì ní ìwọ̀n kan, títí ìkún àwọn Kèfèrí yóò fi wọlé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀yin arákùnrin àti arábìnrin”; Gíríìkì ní “arákùnrin,” ó sì lè jẹ́ ọ̀rọ̀ ìpè sí àwùjọ tí ọkùnrin àti obìnrin wà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “títí iye àwọn Kèfèrí tí ó pé yóò fi wọlé.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: má mọ
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àìmọ̀ tàbí àìní ìròyìn nípa ohun kan; “má mọ” jẹ́ èdè Yorùbá àdánidá tí kò fi ẹ̀gàn kún un.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Ó pa ìrísí akọ ní ọ̀pọ̀ nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè tọ́ka sí àwùjọ tí ọkùnrin àti obìnrin wà.
- source_word: μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: Nínú Pọ́ọ̀lù, ó jẹ́ ète Ọlọ́run tí ó ti fara sin ṣùgbọ́n tí a ń fi hàn; “ohun ìjìnlẹ̀” pa ìtumọ̀ ẹ̀sìn àti ohun tí kò ṣe kedere lójú mọ́.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: kí ẹ má bàa gbọ́n lójú ara yín
  rationale: Gbólóhùn Yorùbá yìí sọ ìkìlọ̀ lòdì sí fífi ara ẹni pe ọlọ́gbọ́n láìṣe àfikún ìtumọ̀.
- source_word: πώρωσις
  choice: líle ọkàn
  rationale: Ó ṣàfihàn àìfarabalẹ̀ tàbí àìlérò nípa ti ẹ̀mí, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún “hardening.”
- source_word: ἀπὸ μέρους
  choice: apá kan
  rationale: Ó tọ́ka sí bí líle ọkàn náà ṣe gbòòrò tó, kì í ṣe dandan sí iye àkókò rẹ̀.
- source_word: τῷ Ἰσραήλ ... γέγονεν
  choice: ti dé bá ... Ísírẹ́lì
  rationale: “Ti dé bá” mú ipò tí ìṣẹ̀lẹ̀ àtijọ́ ti mú wá tí ó sì ṣì ń bá a lọ hàn lọ́nà Yorùbá àdánidá.
- source_word: πλήρωμα
  choice: ẹ̀kún
  rationale: “Ẹ̀kún” pa àìdánilójú náà mọ́ láàárín ẹ̀kún, iye tí ó pé, àti ìmúṣẹ ní kíkún.
- source_word: τῶν ἐθνῶν
  choice: àwọn Kèfèrí
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà dúró fún àwọn tí kì í ṣe Júù ní ìyàtọ̀ sí Ísírẹ́lì.
- source_word: εἰσέλθῃ
  choice: yóò fi wọlé
  rationale: Pẹ̀lú “títí,” ọ̀nà yìí sọ ààlà ọjọ́ iwájú tí ìwọlé náà yóò dé sí ní Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ “ẹ̀kún àwọn Kèfèrí”
  choice: A pa “ẹ̀kún àwọn Kèfèrí” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: iye àwọn Kèfèrí tí ó pé
  rationale: πλήρωμα lè túmọ̀ sí ẹ̀kún, iye tí ó pé, tàbí ìmúṣẹ ní kíkún; a kò fẹ́ yanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà fúnra rẹ̀ kò yanju.
- issue: Àwọn tí ἀδελφοί kàn
  choice: A lò “ẹ̀yin arákùnrin” nínú ọ̀rọ̀ pàtàkì.
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: Èyí pa ìrísí akọ ọ̀pọ̀ Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ó lè pe àwùjọ adalu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì yẹ fún kíkà ní gbangba. A lo “líle ọkàn” gẹ́gẹ́ bí àkójọpọ̀ ọ̀rọ̀ àdánidá, a sì pa àìdánilójú πλήρωμα mọ́ ní “ẹ̀kún.”
