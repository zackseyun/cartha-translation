id: ROM.11.16
reference: Romans 11:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: yo
  text: Bí àkọ́so bá jẹ́ mímọ́, gbogbo ìṣù ìyẹ̀fun náà[a] pẹ̀lú jẹ́ mímọ́; bí gbòǹgbò bá sì jẹ́ mímọ́, àwọn ẹ̀ka náà pẹ̀lú jẹ́ mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo àkójọpọ̀ ìyẹ̀fun tí a pò náà.” Ọ̀rọ̀ Gíríìkì φύραμα ń tọ́ka sí ìṣù tàbí àkójọpọ̀ ìyẹ̀fun tí a pò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: àkọ́so
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìpín àkọ́kọ́ tí a fi fún Ọlọ́run. “Àkọ́so” pa èrò ẹbọ àkọ́kọ́ àti ìbáṣepọ̀ májẹ̀mú mọ́ láì sọ ọ́ di “ìpín àkọ́kọ́” lásán.
- source_word: ἁγία
  choice: jẹ́ mímọ́
  rationale: “Mímọ́” pa ẹ̀ka èrò Bíbélì náà àti ìfararora àwọn gbólóhùn méjèèjì mọ́, láì pinnu bóyá mímọ́ yìí túmọ̀ sí yíyà sọ́tọ̀, ipò májẹ̀mú, tàbí ìgbàlà.
- source_word: φύραμα
  choice: gbogbo ìṣù ìyẹ̀fun náà
  rationale: Ó túmọ̀ sí àkójọpọ̀ ìyẹ̀fun tí a ti pò tàbí ìṣù rẹ̀. Gbólóhùn yìí mú àwòrán náà ṣe kedere ní Yorùbá, ó sì pa ìbáṣepọ̀ àkọ́so àti gbogbo ìṣù náà mọ́.
- source_word: ῥίζα
  choice: gbòǹgbò
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún àwòrán gbòǹgbò igi.
- source_word: κλάδοι
  choice: àwọn ẹ̀ka
  rationale: Èyí ni ìtumọ̀ àdánidá fún ẹ̀ka igi, ó sì bá àwòrán igi ólífì nínú àyíká ọ̀rọ̀ náà mu.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Bí ... bá ..., ... pẹ̀lú ...; bí ... bá sì ..., ... pẹ̀lú ...
  rationale: Ìṣètò yìí fi ọgbọ́n ìfiwéra Gíríìkì hàn ní Yorùbá tó ṣe kedere. “Pẹ̀lú” ń gbé ìtumọ̀ καὶ jáde, “sì” sì ń so àpẹẹrẹ kejì mọ́ ti àkọ́kọ́ láì fi ọ̀rọ̀ àkókò kún un.
theological_decisions:
- issue: Irú ìwà mímọ́ tó wà nínú àpẹẹrẹ àkọ́so àti ìṣù ìyẹ̀fun, àti gbòǹgbò àti àwọn ẹ̀ka
  choice: Lo “mímọ́” láì ṣàlàyé irú ìwà mímọ́ náà síwájú sí i.
  alternative: Túmọ̀ ọ́ ní pàtó sí yíyà sọ́tọ̀ nínú májẹ̀mú tàbí sí jíjẹ́ ẹni tí a gbà là.
  rationale: Ẹsẹ̀ náà fi hàn pé ohun tó jẹ́ ti gbogbo ìṣù tàbí àwọn ẹ̀ka ní ìbáṣepọ̀ pẹ̀lú àkọ́so tàbí gbòǹgbò, ṣùgbọ́n kò ṣàlàyé bóyá ìbáṣepọ̀ náà jẹ́ ti májẹ̀mú, aṣojú, ẹ̀yà ènìyàn, tàbí ìgbàlà. Ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tó yẹ; ìfararora àwọn àpẹẹrẹ méjèèjì sì dúró ṣinṣin.
