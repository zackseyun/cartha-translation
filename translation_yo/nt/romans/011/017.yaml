id: ROM.11.17
reference: Romans 11:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ṣẹ́ díẹ̀ lára àwọn ẹ̀ka náà kúrò, tí a sì lọ́ ọ mọ́ igi náà láàárín wọn, bí ó tilẹ̀ jẹ́ pé igi ólífì igbó ni ọ, tí o sì di alábápín nínú gbòǹgbò, nínú ọ̀rá igi ólífì náà[b],[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sì lọ́ ọ mọ́ àwọn ẹ̀ka wọ̀nyẹn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí o sì di alábápín nínú gbòǹgbò àti ọ̀rá igi ólífì náà”; ní ìtumọ̀ àtọwọ́dọ́wọ́, “gbòǹgbò àti ọ̀rá igi ólífì náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa ìtumọ̀ àtakò pẹ̀lẹ́ ti δέ àti ipò àdéhùn ti εἰ mọ́ ní Yorùbá àdánidá.
- source_word: τινες τῶν κλάδων
  choice: díẹ̀ lára àwọn ẹ̀ka náà
  rationale: “Díẹ̀ lára” fi ìbáṣepọ̀ apá-nínú-àpapọ̀ tí genitive náà ní hàn kedere.
- source_word: ἐξεκλάσθησαν
  choice: a bá ṣẹ́ ... kúrò
  rationale: Ọ̀nà àìsọ ẹni tó ṣe é nípa “a” jẹ́ àdánidá ní Yorùbá, “ṣẹ́ ... kúrò” sì pa àwòrán ẹ̀ka tí a yọ kúrò lára igi mọ́.
- source_word: ἀγριέλαιος ὢν
  choice: bí ó tilẹ̀ jẹ́ pé igi ólífì igbó ni ọ́
  rationale: Ó tú participle náà sí ọ̀rọ̀ ìyọ̀ǹda, ó sì pa àwòrán igi ólífì igbó mọ́ láì túmọ̀ rẹ̀ sí orílẹ̀-èdè tàbí ẹ̀yà ènìyàn.
- source_word: ἐνεκεντρίσθης
  choice: a ... lọ́ ìwọ ... mọ́ ọn
  rationale: “Lọ́ ... mọ́” jẹ́ ọ̀rọ̀ iṣẹ́ ọ̀gbìn fún fífi ẹ̀ka kan mọ́ igi mìíràn kí wọ́n lè dàgbà pọ̀.
- source_word: ἐν αὐτοῖς
  choice: láàárín wọn
  rationale: Ó tọ́ka sí àwọn ẹ̀ka tó wà níbẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: συγκοινωνὸς
  choice: alábápín
  rationale: Ó fi ìkópa àti pínpín ohun kan pọ̀ pẹ̀lú àwọn ẹlòmíràn hàn.
- source_word: τῆς ῥίζης
  choice: nínú gbòǹgbò
  rationale: Preposition “nínú” mú ìkópa nínú ohun tí gbòǹgbò ń pèsè hàn nínú àkàwé náà.
- source_word: τῆς πιότητος τῆς ἐλαίας
  choice: nínú ọ̀rá igi ólífì náà
  rationale: “Ọ̀rá” pa àwòrán ìpilẹ̀ ti πιότης—ọ̀pọ̀ yanturu tó ń bọ́ni—mọ́, “igi” sì mú ἐλαία yéni ní àyíká yìí.
- source_word: ἐγένου
  choice: tí o sì di
  rationale: “Di” sọ ìwọlé sí ipò tuntun tí aorist γίνομαι ń tọ́ka sí.
theological_decisions:
- issue: Ìdánimọ̀ ἀγριέλαιος nínú àkàwé náà
  choice: igi ólífì igbó
  alternative: ẹ̀ka igi ólífì igbó; ẹni tí kì í ṣe Júù
  rationale: A pa àwòrán iṣẹ́ ọ̀gbìn tí Pọ́ọ̀lù lò mọ́, dípò fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rọ́pò àkàwé náà.
- issue: Ìbáṣepọ̀ “gbòǹgbò” àti “ọ̀rá”
  choice: alábápín nínú gbòǹgbò, nínú ọ̀rá igi ólífì náà
  alternative: alábápín nínú gbòǹgbò ọlọ́ràá ti igi ólífì náà; alábápín nínú gbòǹgbò àti ọ̀rá igi ólífì náà
  rationale: Èyí pa ìṣùpọ̀ genitive Gíríìkì àti díẹ̀ lára àìdánilójú ìbáṣepọ̀ wọn mọ́, láì sọ ọ́ di ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A pa gbolohun náà mọ́ gẹ́gẹ́ bí apá àdéhùn tí ẹsẹ tó tẹ̀ lé e máa parí; nítorí náà, àmì kọ́mà wà ní òpin.
