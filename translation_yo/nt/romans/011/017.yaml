  to: Ṣùgbọ́n bí a bá ṣẹ́ díẹ̀ lára àwọn ẹ̀ka náà kúrò, tí a sì lọ́ ọ mọ́ igi náà láàárín wọn, bí ó tilẹ̀ jẹ́ pé igi ólífì igbó ni ọ, tí o sì di alábápín nínú gbòǹgbò, nínú ọ̀rá igi ólífì náà[b],[a]
  rationale: 'A tún kọ́ apá ἐνεκεντρίσθης ἐν αὐτοῖς sí Yorùbá tó pé: “a sì lọ́ ọ mọ́ igi náà láàárín wọn.” Èyí fi ìwọ hàn gẹ́gẹ́ bí ohun tí a lọ́ mọ́, ó sì sọ ibi ìlọ́mọ́ náà di kedere. Láti jẹ́ kí àmì àlàyé a bá gbolohun tuntun mu, a gbé àmì [a] sí òpin gbolohun ìlọ́mọ́, a sì ṣàtúnṣe àlàyé rẹ̀. Ìtòlẹ́sẹẹsẹ [b],[a] nínú ọrọ̀ àtúnṣe jẹ́ dandan láti fi [a] tẹ̀lé gbolohun ìlọ́mọ́ rẹ̀; ẹ̀sẹ̀ náà ṣì ní kọ́mà ní òpin gẹ́gẹ́ bí apá àdéhùn.'
