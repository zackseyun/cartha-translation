source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: yo
  text: Nítorí, láti ọ̀dọ̀ rẹ̀, nípasẹ̀ rẹ̀, àti sí i ni ohun gbogbo wà.[a] Ògo ni fún un títí láé.[b] Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí pé láti ọ̀dọ̀ rẹ̀, nípasẹ̀ rẹ̀, àti sí i ni ohun gbogbo wà.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “sí àwọn ìgbà ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó fi ìdí tàbí àlàyé fún orin ìyìn tó ṣáájú hàn, ó sì pa agbára ìtumọ̀ ìdí mọ́.
- source_word: ἐξ αὐτοῦ
  choice: láti ọ̀dọ̀ rẹ̀
  rationale: Ó sọ pé òun ni orísun ohun gbogbo ní Yorùbá àdánidá.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: Ó pa ìtumọ̀ pé ohun gbogbo wáyé nípasẹ̀ rẹ̀ mọ́, láì dín un kù sí irinṣẹ́ lásán.
- source_word: εἰς αὐτὸν
  choice: sí ọ̀dọ̀ rẹ̀
  rationale: Ó pa ìdarí sí ibi ìparí tàbí ète mọ́ láì fi dandan túmọ̀ ọ́ sí ‘fún un.’
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Gbólóhùn yìí kún fún gbogbo ohun tó wà, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: αὐτῷ ἡ δόξα
  choice: Ògo ni fún un
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá, ọlọ́lá láti fi ògo fún ẹni kan nínú orin ìyìn.
- source_word: εἰς τοὺς αἰῶνας
  choice: títí láé
  rationale: Ó tú idiomu Gíríìkì tó túmọ̀ sí àkókò aláìlópin sí Yorùbá tó wọ́pọ̀.
- source_word: ἀμήν
  choice: Àmín
  rationale: A pa ọ̀rọ̀ ìfìdímúlẹ̀ ìjọsìn tó ti wọ́pọ̀ nínú Yorùbá mọ́.
theological_decisions:
- issue: Ẹni tí àwọn arọ́pò-orúkọ αὐτοῦ/αὐτὸν/αὐτῷ ń tọ́ka sí
  choice: A pa ‘rẹ̀/un’ mọ́, nígbà tí àyíká Róòmù 11:33–35 fi hàn pé Ọlọ́run ni a ń tọ́ka sí.
  alternative: Kí a rọ́pò gbogbo arọ́pò-orúkọ náà pẹ̀lú ‘Ọlọ́run.’
  rationale: Pípa arọ́pò-orúkọ mọ́ ń tẹ̀ lé ọ̀rọ̀ Gíríìkì, ó sì yàgò fún ṣíṣe ohun tí àyíká sọ di gbangba ju bí ọ̀rọ̀ ẹsẹ̀ náà ṣe sọ ọ́ lọ.
- issue: Ìtumọ̀ αὐτῷ ἡ δόξα gẹ́gẹ́ bí gbólóhùn ìyìn tí kò ní ọ̀rọ̀-ìṣe
  choice: Ògo ni fún un
  alternative: Ògo jẹ́ tirẹ̀; Kí ògo jẹ́ tirẹ̀
  rationale: Yíyan yìí pa agbára ìfifi ògo fún un mọ́ ní Yorùbá àdánidá, láì sọ bóyá gbólóhùn náà jẹ́ ìfẹ́-ọkàn tàbí ìjẹ́wọ́ ohun tó jẹ́ tirẹ̀ nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì yẹ fún orin ìyìn. ‘ni … ti wá’ ń mú ìtumọ̀ orísun àti ìdarí gbólóhùn náà yé ẹni tó ń kà, ṣùgbọ́n àlàyé ìsàlẹ̀ fún [a] pa yíyan gírámà tí kò sọ ọ̀rọ̀-ìṣe ní pàtó mọ́.
