  source_fidelity: Àfikún “ti wá” nínú ìtumọ̀ àkọ́kọ́ ń sọ pé ohun gbogbo ‘ti dé/wáyé,’ níbi tí Gíríìkì fi gbólóhùn ìwà-títẹ̀síwájú, τὰ πάντα, hàn láì lo ọ̀rọ̀-ìṣe irú bẹ́ẹ̀. “ni ohun gbogbo wà” ń pa ìṣètò àti ìtumọ̀ ọ̀rọ̀ orísun mọ́ dáadáa. “sí i” sì jẹ́ ìfihàn kíkún, tó ṣókí, fún εἰς αὐτόν. Àlàyé [b] ìṣáájú, “sí àwọn ayé,” lè dá ẹni kà sí ‘worlds’; αἰῶνας níhìn-ín jẹ́ ‘àwọn ìgbà ayé/ages.’
