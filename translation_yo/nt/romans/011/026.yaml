id: ROM.11.26
reference: Romans 11:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: yo
  text: 'Àti ní ọ̀nà yìí ni gbogbo Israẹli[b] yóò fi rí ìgbàlà[a], gẹ́gẹ́ bí a ti kọ ọ́ pé: “Olùgbàlà náà yóò wá láti Síónì[c]; yóò yí àìbọ̀wọ̀ fún Ọlọ́run kúrò lára Jakọbu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u pé, “Àti báyìí ni gbogbo Israẹli yóò ṣe rí ìgbàlà.” Ọ̀rọ̀ Gíríìkì οὕτως lè túmọ̀ sí “báyìí” tàbí “ní ọ̀nà yìí”; níbí, ó ṣeé ṣe kó tọ́ka sí ọ̀nà tí a ṣẹ̀ṣẹ̀ ṣàlàyé.
    reason: lexical_alternative
  - marker: b
    text: Àwọn onítúmọ̀ kò fohùn ṣọ̀kan lórí ẹni tí “gbogbo Israẹli” ń tọ́ka sí. Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì mọ́ láìpinnu bóyá Pọ́ọ̀lù ń sọ̀rọ̀ nípa gbogbo Israẹli nípa ẹ̀yà, ìyókù àwọn onígbàgbọ́ nínú Israẹli, tàbí gbogbo àwọn ènìyàn Ọlọ́run.
    reason: alternative_reading
  - marker: c
    text: Ní ti gidi, ἐκ Σιὼν túmọ̀ sí “láti inú Síónì” tàbí “láti Síónì.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ní ọ̀nà yìí
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí bí ohun ṣe ṣẹlẹ̀ mọ́, ó sì lè tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ ṣàlàyé, láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- source_word: πᾶς Ἰσραήλ
  choice: gbogbo Israẹli
  rationale: Èyí ni ìtumọ̀ tààrà, tó sì jẹ́ ti Yorùbá àdánidá; a kò fi àlàyé kún un láti pinnu ẹni tí gbólóhùn náà ń tọ́ka sí.
- source_word: σωθήσεται
  choice: yóò rí ìgbàlà
  rationale: Ó mú agbára ìtumọ̀ ìgbàlà inú ọ̀rọ̀ σῴζω jáde ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́
  rationale: Ọ̀nà Yorùbá tó wọ́pọ̀ fún gbólóhùn ìtọ́kasí Ìwé Mímọ́, tó sì fi ìbámu ohun tí a sọ àti ohun tí a kọ hàn.
- source_word: Ἥξει
  choice: yóò ... wá
  rationale: Ó jẹ́ ìtumọ̀ tó rọrùn, tó sì bá ìlànà àsọtẹ́lẹ̀ mu.
- source_word: ἐκ Σιὼν
  choice: yóò ti Síónì wá
  rationale: Ìkọ̀lé ‘ti ... wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orísun ìbọ̀wọ̀n tàbí ibi tí ẹni kan ti ń bọ̀.
- source_word: ὁ ῥυόμενος
  choice: Olùgbàlà náà
  rationale: Ó tú participle onípò-orúkọ náà sí oyè tó ní ìwúwo, tí ó sì ye òǹkàwé Yorùbá.
- source_word: ἀποστρέψει
  choice: yóò yí ... kúrò
  rationale: Ó pa àwòrán ìṣe yíyí ohun kan padà tàbí kúrò mọ́, dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí pípa rẹ́.
- source_word: ἀσεβείας
  choice: àìbọ̀wọ̀ fún Ọlọ́run
  rationale: Ó sọ agbára ìwà àti ẹ̀sìn inú ἀσέβεια ní kedere sí Yorùbá òde òní.
- source_word: ἀπὸ Ἰακώβ
  choice: kúrò lára Jakọbu
  rationale: Ó pa orúkọ Jakọbu inú àyọlò Ìwé Mímọ́ mọ́, ó sì sọ ìyà sọ́tọ̀ kúrò lára ènìyàn náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí ‘gbogbo Israẹli’ ń tọ́ka sí
  choice: A pa gbólóhùn ‘gbogbo Israẹli’ mọ́ láìfi àlàyé ìtumọ̀ kún un.
  alternative: Gbogbo Israẹli nípa ẹ̀yà; ìyókù onígbàgbọ́ nínú Israẹli; tàbí gbogbo àwọn ènìyàn Ọlọ́run pẹ̀lú àwọn Kèfèrí.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò yanjú àríyànjiyàn yìí; ìtumọ̀ gbọ́dọ̀ pa àìdánilójú àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Ìdánimọ̀ Mèsáyà ti ὁ ῥυόμενος
  choice: A lo ‘Olùgbàlà’ bí oyè.
  alternative: olùgbàlà; ẹni tí ń gbàlà
  rationale: Nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù, àyọlò náà ní agbára Mèsáyà; lílo oyè kò fi ohun tuntun kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Rí ìgbàlà’ àti ‘Olùgbàlà’ jẹ́ àwọn gbólóhùn tó wọ́pọ̀, tó sì pa ìwúwo ẹ̀kọ́ ìgbàgbọ́ mọ́. Orúkọ Israẹli, Síónì àti Jakọbu ni a kọ ní fọ́ọ̀mù Yorùbá tó wọ́pọ̀.
