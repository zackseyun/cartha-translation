source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: yo
  text: Kí wá ni? Ísírẹ́lì kò rí ohun tí ó ń wá gbà, ṣùgbọ́n àwọn àyànfẹ́[a] rí i gbà; ọkàn àwọn ìyókù sì di líle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ìyàn” tàbí “yíyan”; ó ṣeé ṣe kó dúró níbí fún àwọn ènìyàn tí a yàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n di aláìní ìmọ̀lára.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ṣíṣe ọkàn le tàbí mímú kí ènìyàn má lè fèsì nípa tẹ̀mí; kò sọ ẹni tó mú un ṣẹlẹ̀ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Kí wá ni?
  rationale: Ó pa ìbéèrè àsọyé tí Pọ́ọ̀lù fi ń mú àbájáde ọ̀rọ̀ tó ṣáájú wọlé mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: ohun tí Ísírẹ́lì ń wá
  rationale: “Ń wá” fi ìṣe tó ń lọ lọ́wọ́ hàn; “Ísírẹ́lì” dúró fún àwọn ènìyàn Ísírẹ́lì lápapọ̀ nínú àyíká ọ̀rọ̀ yìí.
- source_word: τοῦτο οὐκ ἐπέτυχεν … ἐπέτυχεν
  choice: kò rí … gbà … rí i gbà
  rationale: Àtúnsọ ọ̀rọ̀ kan náà pa ìyàtọ̀ tó wà láàárín Ísírẹ́lì àti àwọn àyànfẹ́ mọ́, ó sì túmọ̀ sí rírí ohun tí a ń lépa gbà.
- source_word: ἡ ἐκλογὴ
  choice: àwọn àyànfẹ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìyàn,” níbí ó dúró fún àwọn ènìyàn tí a yàn, ní ìtakora sí “àwọn ìyókù.”
- source_word: οἱ δὲ λοιποὶ
  choice: àwọn ìyókù
  rationale: Ó tọ́ka sí àwọn tó kù lẹ́yìn ẹgbẹ́ àwọn àyànfẹ́.
- source_word: ἐπωρώθησαν
  choice: ọkàn … sé le
  rationale: Ó pa àwòrán líle tàbí àìní ìmọ̀lára nípa tẹ̀mí mọ́, láì yí i sí “fọ́jú” tàbí ṣàlàyé ẹni tó ṣe é.
theological_decisions:
- issue: Ìtumọ̀ ἡ ἐκλογὴ nínú àyíká ọ̀rọ̀
  choice: àwọn àyànfẹ́, ìyẹn àwọn ènìyàn tí a yàn
  alternative: ìyàn
  rationale: Ìtakora rẹ̀ pẹ̀lú “àwọn ìyókù” fi hàn pé àwọn ènìyàn ni ọ̀rọ̀ náà ń tọ́ka sí níbí; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan náà sílẹ̀.
- issue: Ohùn àti aṣojú nínú ἐπωρώθησαν
  choice: ọkàn àwọn ìyókù sì sé le
  alternative: Ọlọ́run mú ọkàn wọn le; wọ́n mú ọkàn ara wọn le
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ aláìṣe tí kò dárúkọ aṣojú. Ìtumọ̀ yìí kò pinnu bóyá Ọlọ́run, àwọn ènìyàn fúnra wọn, tàbí àwọn méjèèjì ni a gbọ́dọ̀ tẹnumọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “rí … gbà” ní ìgbà méjèèjì láti pa àtúnsọ Gíríìkì mọ́.
