id: ROM.8.1
reference: Romans 8:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: yo
  text: Nítorí náà, kò sí ìdálẹ́bi kankan nísinsìnyí fún àwọn tí ó wà nínú Mèsáyà Jésù.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ tí ó ṣẹ̀yìn fi ọ̀rọ̀ yìí kún un: “àwọn tí kò rìn nípa ti ara.” Àwọn ẹlẹ́rìí Gíríìkì tó ṣáájú jù lọ ṣe atilẹyin fún ọ̀rọ̀ kúkúrú níbí.'
    reason: textual_variant
  - marker: b
    text: Tàbí, “Kristi Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: kò sí ... kankan
  rationale: 'Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìsẹ́ òdì tó lágbára hàn: ‘kò sí ... rárá/kankan.’'
- source_word: ἄρα
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde tàbí ìpinnu tí ó jáde láti inú àríyànjiyàn Pọ́ọ̀lù ṣáájú rẹ̀.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: A pa àmì àsìkò ìsinsìnyí mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe tẹnumọ́ òtítọ́ tó wà ní báyìí.
- source_word: κατάκριμα
  choice: ìdálẹ́bi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìdájọ́ tí ń dá ẹni lẹ́bi, kì í ṣe ìmọ̀lára ẹ̀bi nìkan; ‘ìdálẹ́bi’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ilé-ẹjọ́ mu.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: fún àwọn tí ó wà nínú Mèsáyà Jésù
  rationale: Ìtumọ̀ yìí mú dative náà dà bí Yorùbá àdánidá, ó sì pa èdè Pọ́ọ̀lù nípa wíwà ‘nínú’ Mèsáyà mọ́ láì sọ ọ́ di àlàyé kan ṣoṣo.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: A túmọ̀ oyè náà gẹ́gẹ́ bí ‘Mèsáyà’ nítorí ìtumọ̀ oyè ẹni àmì òróró náà ṣì ń ṣiṣẹ́ nínú àyíká yìí.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ Ἰησοῦς tí ó wọ́pọ̀, tí ó sì dára ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ‘nínú Mèsáyà Jésù’
  choice: 'A pa ọ̀rọ̀ ìṣọ̀kan àti ìkópa mọ́: àwọn tí ó jẹ́ ti Mèsáyà Jésù, tí a sì kà sí ẹni tí ó wà nínú rẹ̀.'
  alternative: ‘nítorí Mèsáyà Jésù,’ èyí tí yóò jẹ́ ìtumọ̀ àlàyé tó túbọ̀ dín ìtumọ̀ ἐν kù.
  rationale: Níbi yìí, ἐν tó wà nínú èdè Pọ́ọ̀lù ní ìjìnlẹ̀ ìtumọ̀ ìṣọ̀kan/ìkópa. ‘Nínú’ pa ìjìnlẹ̀ àti àìsọ̀rọ̀dájú yẹn mọ́ dípò kí a yan àlàyé ẹ̀kọ́ kan ṣoṣo.
- issue: Gbólóhùn àfikún nípa rírìn nípa ti ara
  choice: A kò fi gbólóhùn náà sínú ẹsẹ̀ náà; a ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
  alternative: Fífi ‘àwọn tí kò rìn nípa ti ara’ kún ọ̀rọ̀ pàtàkì.
  rationale: Àwọn ẹ̀rí Gíríìkì àkọ́kọ́ àti tó lágbára jù lọ ṣe atilẹyin fún ọ̀rọ̀ kúkúrú; àfikún náà farahàn nínú àwọn àfọwọ́kọ tó pẹ́yà.
translation_notes:
  register: Yorùbá àgbàlágba tó bójú mu, tó ní ẹ̀wà àti ọlá, ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ìdálẹ́bi’ fún àkóónú ilé-ẹjọ́, ‘Mèsáyà’ fún oyè Χριστός, a sì pa ‘nínú’ mọ́ láti gbé èdè ìṣọ̀kan Pọ́ọ̀lù kalẹ̀. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
