  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin ará[a], a jẹ́ ajigbèsè—kì í ṣe fún ẹran ara[b], kí a máa gbé ní ìbámu pẹ̀lú ẹran ara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “arákùnrin,” ṣùgbọ́n a lò ó gẹ́gẹ́ bí ọ̀rọ̀ ìpè sí gbogbo àwùjọ àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
    reason: lexical_alternative
  - marker: b
    text: “Ẹran ara” níbí kì í tọ́ka sí ara ènìyàn lásán; ó ń tọ́ka sí ìwà ènìyàn tí ẹ̀ṣẹ̀ ti bàjẹ́. A tún lè túmọ̀ ọ́ sí “ìwà ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Nítorí náà
  rationale: Àwọn ọ̀rọ̀ méjèèjì ń fi ìparí èrò tí ó jáde láti inú àlàyé iṣáájú hàn; “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìtumọ̀ yìí mọ́.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ ìpè àdánidá ní Yorùbá fún àwọn ọmọ ìjọ lápapọ̀, ó sì lè gba akọ àti abo láìfi akọ nìkan hàn.
- source_word: ὀφειλέται ἐσμέν
  choice: ajigbèsè ni wá
  rationale: Èyí pa àwòrán gbèsè inú ὀφειλέται mọ́, ṣùgbọ́n nínú àyíká yìí ó túmọ̀ sí ẹni tí ojúṣe kan wà lórí rẹ̀, kì í ṣe gbèsè owó ní pàtó.
- source_word: σάρξ / σαρκί
  choice: ẹran ara
  rationale: A pa ọ̀rọ̀ Pọ́ọ̀lù àti ìtakora rẹ̀ láàárín ẹran ara àti Ẹ̀mí mọ́, dípò yíyanju ìtumọ̀ náà sí “ìwà ẹ̀ṣẹ̀” nínú ẹsẹ̀ pàtàkì.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: láti máa gbé ní ìbámu pẹ̀lú ẹran ara
  rationale: Gbólóhùn yìí fi ohun tí gbèsè náà ì bá béèrè hàn, ó sì pa àṣà ọ̀rọ̀ κατὰ σάρκα, “ní ìbámu pẹ̀lú ẹran ara,” mọ́.
theological_decisions:
- issue: Bí a ṣe yẹ kí a túmọ̀ σάρξ nínú ìtakora Pọ́ọ̀lù yìí
  choice: ẹran ara
  alternative: ìwà ẹ̀ṣẹ̀ tàbí ìwà ènìyàn tí ẹ̀ṣẹ̀ ti bàjẹ́
  rationale: “Ẹran ara” pa àìdánilójú àti ẹ̀dùn ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù mọ́; àlàyé ìtumọ̀ rẹ̀ wà nínú àlàyé ìsàlẹ̀ láìfi ìtumọ̀ kan ṣoṣo lé ẹsẹ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́wọ̀ àti ti òde òní. A lo “ẹ̀yin ará” fún ìpè àwùjọ, “ajigbèsè” láti pa àwòrán gbèsè mọ́, àti “ẹran ara” láti ṣètìlẹ́yìn fún ìṣọ̀kan ọ̀rọ̀ Pọ́ọ̀lù.
