id: ROM.8.4
reference: Romans 8:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: yo
  text: kí ohun tí ó tọ́ tí òfin ń béèrè lè ní ìmúṣẹ nínú wa[a], àwa tí kò rìn ní ìbámu pẹ̀lú ẹran ara[b], bí kò ṣe ní ìbámu pẹ̀lú Ẹ̀mí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lè ní ìmúṣẹ láàárín wa.” Ọ̀rọ̀ Gíríìkì náà kò sọ ní tààrà pé “nípasẹ̀ wa.”
    reason: alternative_reading
  - marker: b
    text: “Ẹran ara” níbí ń tọ́ka sí ìwà ènìyàn tí ẹ̀ṣẹ̀ ti bà jẹ́ tàbí sí ìgbésí ayé tí ó yí kúrò lọ́dọ̀ Ọlọ́run; àwọn mìíràn túmọ̀ rẹ̀ sí “ìwà ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹ̀mí”; nínú àyíká Róòmù 8, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ète tàbí àbájáde hàn.
- source_word: δικαίωμα
  choice: ìbéèrè òdodo
  rationale: Ó pa agbára òfin àti ìwà títọ́ inú ọ̀rọ̀ náà mọ́; kì í ṣe àṣẹ kan ṣoṣo nìkan.
- source_word: νόμος
  choice: òfin
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún νόμος nínú àyíká ọ̀rọ̀ Paulu.
- source_word: πληρωθῇ
  choice: lè ṣẹ
  rationale: Ó jẹ́ kí gírámà àfojúsùn lẹ́yìn ἵνα àti ìtumọ̀ pé ohun tí òfin ń béèrè dé ìmúṣẹ dúró, láì sọ pé àwa fúnra wa ni a mú un ṣẹ.
- source_word: ἐν ἡμῖν
  choice: ní inú wa
  rationale: Ó tẹ̀lé ἐν ní tààrà, ó sì yẹra fún fífi ‘nípasẹ̀ wa’ kún ọ̀rọ̀ náà.
- source_word: περιπατοῦσιν
  choice: rìn
  rationale: Ó pa àwòrán ìrìn gẹ́gẹ́ bí ọ̀nà ìgbésí ayé mọ́, bí Paulu ṣe máa ń lò ó.
- source_word: σάρξ
  choice: ẹran ara
  rationale: Ó pa àwòrán gangan ti σάρξ mọ́ dípò kí a túmọ̀ rẹ̀ tààrà sí ‘ìwà ẹlẹ́ṣẹ̀,’ èyí tí yóò dín ìtumọ̀ rẹ̀ kù.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká Róòmù 8 tọ́ka sí Ẹ̀mí Mímọ́; a lo lẹ́tà ńlá, ṣùgbọ́n àlàyé ìsàlẹ̀ fi àṣàyàn ‘ẹ̀mí’ pamọ́.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: ní ìbámu pẹ̀lú ẹran ara ... ní ìbámu pẹ̀lú Ẹ̀mí
  rationale: ‘Ní ìbámu pẹ̀lú’ sọ ìṣàkóso tàbí ìlànà ìgbésí ayé tí κατά ń fi hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá πνεῦμα túmọ̀ sí ẹ̀mí ènìyàn tàbí Ẹ̀mí Mímọ́
  choice: Ẹ̀mí
  alternative: ẹ̀mí
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ nínú Róòmù 8 tẹnumọ́ iṣẹ́ àti agbára Ẹ̀mí Mímọ́, ṣùgbọ́n fọ́ọ̀mù Gíríìkì fúnra rẹ̀ lè gba ìtumọ̀ gbogbogbò nígbà tí a bá yà á sọ́tọ̀.
- issue: Bóyá ἐν ἡμῖν túmọ̀ sí pé ìmúṣẹ náà ṣẹ ní inú wa tàbí nípasẹ̀ wa
  choice: ní inú wa
  alternative: nípasẹ̀ wa; láàárín wa
  rationale: ἐν ṣe àtìlẹ́yìn fún ‘ní inú wa’; yíyan èyí kò fi agbára ènìyàn tí ọ̀rọ̀ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àgbàlódé, ọlọ́lá, tí ó ṣeé lóye fún gbogbo ènìyàn. A pa àwòrán ‘rìn’ àti ‘ẹran ara’ mọ́ nítorí ìwúwo ọ̀rọ̀ Paulu, a sì lo ‘ní ìbámu pẹ̀lú’ láti mú ìtumọ̀ wọn ṣe kedere. Gbogbo àmì àlàyé [a]–[c] wà nínú ọ̀rọ̀ pàtàkì.
