id: ROM.8.10
reference: Romans 8:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: yo
  text: Ṣùgbọ́n bí Mèsáyà bá wà nínú yín, ara ti kú[b] nítorí ẹ̀ṣẹ̀, ṣùgbọ́n ẹ̀mí[a] jẹ́ ìyè nítorí òdodo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ẹ̀mí jẹ́ ìyè.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹ̀mí ènìyàn tí Ọlọ́run sọ di alààyè tàbí sí Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ara náà wà lábẹ́ ikú” tàbí “ara náà lè kú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Ó pa ipò oyè Χριστός mọ́ gẹ́gẹ́ bí ẹni àmì òróró, dípò kí a kàn lò ó bí orúkọ ẹni.
- source_word: σῶμα
  choice: ara
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ara ní pàtó, ó sì pa ìyàtọ̀ tó wà láàárín ara àti ẹ̀mí mọ́.
- source_word: νεκρὸν
  choice: ti kú
  rationale: Èyí pa ìtumọ̀ líle ti ọ̀rọ̀ Gíríìkì náà, ‘kú,’ mọ́; àlàyé ìṣòro pé ó tún lè tọ́ka sí jíjẹ́ ẹni ikú wà nínú àlàyé ìsàlẹ̀.
- source_word: διὰ ἁμαρτίαν
  choice: nítorí ẹ̀ṣẹ̀
  rationale: διά pẹ̀lú accusative níbí ń fi okùnfà hàn; ‘nítorí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ́.
- source_word: πνεῦμα
  choice: ẹ̀mí
  rationale: Lílo lẹ́tà kékeré pa ìyàtọ̀ ara àti ẹ̀mí ènìyàn mọ́ láì fòpin sí ṣíṣeéṣe pé Ẹ̀mí Mímọ́ ni Pọ́ọ̀lù ń tọ́ka sí.
- source_word: ζωὴ
  choice: jẹ́ ìyè
  rationale: ζωή jẹ́ ọ̀rọ̀-orúkọ ‘ìyè,’ kì í ṣe ọ̀rọ̀-àpèjúwe ‘wà láàyè’; gbólóhùn yìí pa ìsọ̀rọ̀ kúkúrú Pọ́ọ̀lù mọ́.
- source_word: διὰ δικαιοσύνην
  choice: nítorí òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún δικαιοσύνη nínú ọ̀rọ̀ Pọ́ọ̀lù, ‘nítorí’ sì pa agbára okùnfà διά mọ́.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: ẹ̀mí
  alternative: Ẹ̀mí, ìyẹn Ẹ̀mí Mímọ́
  rationale: Ìtumọ̀ àkọ́kọ́ pa ìfarakanra tó wà láàárín ara onígbàgbọ́ àti ẹ̀mí rẹ̀ mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ kò pa ṣíṣeéṣe pé Ẹ̀mí Mímọ́ ni ọ̀rọ̀ náà ń tọ́ka sí run.
- issue: Agbára νεκρὸν pẹ̀lú σῶμα
  choice: ara náà ti kú
  alternative: ara náà wà lábẹ́ ikú; ara náà lè kú
  rationale: Bí ó tilẹ̀ jẹ́ pé Pọ́ọ̀lù lè máa sọ nípa jíjẹ́ ẹni ikú, ọ̀rọ̀ Gíríìkì náà sọ ‘kú’ ní tààrà; a pa èyí mọ́ nínú ẹsẹ̀, a sì fi ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àmì ohùn wà níbi tó yẹ. Gbólóhùn náà tẹ̀ lé ìfarakanra àti ìsọ̀rọ̀ kúkúrú ti orísun Gíríìkì, láì yanjú àìdánilójú tó wà nínú πνεῦμα fún òǹkàwé.
