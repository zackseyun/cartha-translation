  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ń retí ohun tí a kò rí, a fi ìfaradà dúró dè é.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “pẹ̀lú sùúrù tí kì í rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ ìṣe náà tún lè túmọ̀ sí “a fi ìtara dúró dè é.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa ipò àídájú εἰ mọ́, ó sì fi ìyípadà kékeré tí δέ ní hàn ní Yorùbá àdánidá.
- source_word: ὃ οὐ βλέπομεν
  choice: ohun tí a kò rí
  rationale: Ó túmọ̀ arọ́pò-orúkọ aláìlẹ́gbẹ́ ὃ ní ọ̀nà Yorùbá tó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: ἐλπίζομεν
  choice: a ń retí
  rationale: Fọ́ọ̀mù onítẹ̀síwájú “ń retí” fi ìṣe tó ń bá a lọ hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìrètí sí ohun ọjọ́ iwájú ní Yorùbá.
- source_word: δι’ ὑπομονῆς
  choice: a fi ìfaradà
  rationale: “Ìfaradà” ní ìtumọ̀ dídúró ṣinṣin lábẹ́ ìdádúró tàbí ìṣòro, kì í ṣe sùúrù lásán.
- source_word: ἀπεκδεχόμεθα
  choice: dúró dè é
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún fífi ìfojúsọ́nà dúró de ohun kan; àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì náà tún lè tẹnumọ́ fífi ìtara dúró de ohun náà.
theological_decisions:
- issue: Ìrètí Kristẹni nípa ohun ọjọ́ iwájú tí a kò tíì rí
  choice: A fi ohun tí a ń retí sílẹ̀ gẹ́gẹ́ bí “ohun tí a kò rí.”
  alternative: Kí a sọ ohun náà ní pàtó gẹ́gẹ́ bí ìgbàlà, ìràpadà ara, tàbí àjíǹde.
  rationale: Àyíká ẹsẹ náà lè tọ́ka sí àwọn nǹkan wọ̀nyí, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò dárúkọ wọn; ìtumọ̀ náà pa àìsọ pàtó inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; “dúró dè é” jẹ́ àsọyé Yorùbá àdánidá.
