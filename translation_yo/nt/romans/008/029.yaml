id: ROM.8.29
reference: Romans 8:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: yo
  text: Nítorí àwọn tí ó ti mọ̀ tẹ́lẹ̀[a], ó tún pinnu tẹ́lẹ̀ pé kí wọ́n dàbí àwòrán Ọmọ rẹ̀, kí Ọmọ náà lè jẹ́ àkọ́bí láàárín ọ̀pọ̀ àwọn arákùnrin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mọ̀ ṣáájú.” Àwọn kan lóye “mọ̀ tẹ́lẹ̀” níbí gẹ́gẹ́ bí ọ̀rọ̀ ìbátan, ìyẹn ni pé, “fi ojú rere sí wọn tẹ́lẹ̀.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ náà wà ní akọ nínú èdè Gíríìkì; àwọn tí ó ń tọ́ka sí lè ní ọkùnrin àti obìnrin nínú ìdílé Ọlọ́run.
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: mọ̀ tẹ́lẹ̀
  rationale: Èyí ń pa ìtumọ̀ gidi ọ̀rọ̀ Gíríìkì náà mọ́—‘mọ̀ ṣáájú’—láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
- source_word: προώρισεν
  choice: pinnu tẹ́lẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Ọlọ́run ṣe ìpinnu náà ṣáájú; ó yẹra fún èrò àyànmọ́ afọ́jú tí ‘pín àyànmọ́’ lè mú wá.
- source_word: συμμόρφους τῆς εἰκόνος
  choice: kí wọ́n dàbí àwòrán
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa èrò jíjẹ́ ẹni tí ó bá ìrí tàbí àwòrán Ọmọ náà mu mọ́.
- source_word: υἱοῦ αὐτοῦ
  choice: Ọmọ rẹ̀
  rationale: Ó pa orúkọ ipò ìbátan Kristi mọ́ ní tààràtà.
- source_word: εἰς τὸ εἶναι αὐτὸν
  choice: kí Ọmọ náà lè jẹ́
  rationale: ‘Kí ... lè’ lè sọ ète tàbí àbájáde tí ìkọ̀ Gíríìkì náà gbà láàyè; lílo ‘Ọmọ náà’ mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere.
- source_word: πρωτότοκον
  choice: àkọ́bí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bá àpèjúwe ‘ẹni àkọ́bí’ mu, ó sì pa ìtumọ̀ ipò ọlá rẹ̀ mọ́ láìrọ́pò àwòrán ọ̀rọ̀ náà.
- source_word: ἀδελφοῖς
  choice: àwọn arákùnrin
  rationale: Ó dúró fún ọ̀pọ̀ akọ tí ìlànà èdè Gíríìkì lò; àlàyé ìsàlẹ̀ fi hàn pé àwùjọ tí a ń tọ́ka sí lè ní ọkùnrin àti obìnrin.
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìdí tàbí àlàyé fún ohun tí a sọ ṣáájú.
theological_decisions:
- issue: Bóyá προέγνω yẹ kí a túmọ̀ rẹ̀ lọ́nà tí yóò pinnu ìjiyàn nípa ìmọ̀-tẹ́lẹ̀ àti yíyan-tẹ́lẹ̀.
  choice: mọ̀ tẹ́lẹ̀
  alternative: fi ojú rere sí wọn tẹ́lẹ̀
  rationale: Ìtumọ̀ àkọ́kọ́ pa ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ẹ̀kọ́ ìsìn ẹgbẹ́ kan ṣoṣo sínú ẹsẹ náà; àlàyé ìsàlẹ̀ jẹ́wọ́ ìtumọ̀ ìbátan tí àwọn kan rí nínú rẹ̀.
- issue: Bóyá ἀδελφοῖς yẹ kí ó jẹ́ ọ̀rọ̀ tí ó kó ọkùnrin àti obìnrin jọ nínú ẹsẹ pàtàkì.
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin
  rationale: A pa akọ ọ̀pọ̀ tí Gíríìkì lò mọ́ nínú ẹsẹ, ṣùgbọ́n a ṣàlàyé ní ìsàlẹ̀ pé àwọn obìnrin lè wà lára àwọn tí ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘Ọmọ náà’ dípò arọ́pò-orúkọ tí ó lè ṣokùnfà àìmọ̀ ẹni tí a ń tọ́ka sí.
