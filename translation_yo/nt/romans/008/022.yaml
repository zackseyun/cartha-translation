  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: yo
  text: Nítorí àwa mọ̀ pé gbogbo ìṣẹ̀dá ń kérora papọ̀, ó sì ń jìyà ìrora ìbímọ̀ papọ̀ títí di ìsinsìnyí[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “gbogbo ẹ̀dá”; tàbí “gbogbo ohun tí a dá,” bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe jù pé gbogbo ètò ìṣẹ̀dá ni ọ̀rọ̀ náà ń tọ́ka sí níbí.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn “ń jìyà ìrora ìbímọ̀ papọ̀” ń gbé àwòrán ìrora ìbímọ̀ dìde; nítorí náà, kì í tọ́ka sí ìjìyà nìkan, ṣùgbọ́n ó lè tún fi ìjìyà tí ó ṣí sí ìyè tuntun hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: àwa mọ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ipò ìmọ̀ tí ó dúró ní àsìkò yìí; fífi ọ̀rọ̀ arọ́pò-orúkọ “àwa” hàn bá ìtẹnumọ́ Gíríìkì mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa àsopọ̀ àlàyé mọ́, ní sísọ ẹsẹ yìí pọ̀ mọ́ àríyànjiyàn tó ṣáájú.
- source_word: πᾶσα ἡ κτίσις
  choice: gbogbo ìṣẹ̀dá
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tọ́ka sí gbogbo ètò ohun tí a dá gẹ́gẹ́ bí odindi, dípò kí a tú u sí olúkúlùkù ẹ̀dá.
- source_word: συστενάζει
  choice: ń kérora papọ̀
  rationale: “Kérora” sọ ìrora tí a ń fi ohùn hàn; “papọ̀” sì pa agbára àkọ́bẹ̀rẹ̀ συν- mọ́, èyí tó fi ìkérora àjọṣe hàn.
- source_word: συνωδίνει
  choice: ń jẹ ìrora ìrọbí papọ̀
  rationale: Ó pa àwòrán ìrora ìbímọ̀ mọ́, kì í ṣe ìjìyà lásán, “papọ̀” sì tún ṣàfihàn agbára συν-.
- source_word: ἄχρι τοῦ νῦν
  choice: títí di ìsinsìnyí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti fi ipò tí ó ti ń bá a lọ dé àsìkò yìí hàn.
theological_decisions:
- issue: Bóyá κτίσις yẹ kí ó jẹ́ “ìṣẹ̀dá” tàbí “ẹ̀dá/ohun tí a dá.”
  choice: gbogbo ìṣẹ̀dá
  alternative: gbogbo ẹ̀dá; olúkúlùkù ohun tí a dá
  rationale: Nínú Róòmù 8:19–23, Pọ́ọ̀lù sọ nípa ètò ìṣẹ̀dá tí kì í ṣe ènìyàn ní ọ̀nà àkàwé bí ẹni pé ó ń retí ìdáǹdè. “Gbogbo ìṣẹ̀dá” pa ìwọ̀n àgbáyé yẹn mọ́ láì dín un kù sí olúkúlùkù ẹ̀dá.
- issue: Bóyá àwòrán συνωδίνει jẹ́ ìjìyà lásán tàbí ìrora ìbímọ̀.
  choice: ìrora ìrọbí
  alternative: ìjìyà papọ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka pàtó sí ìrora ìbímọ̀. Ìtumọ̀ yìí pa ìrora àti ìrètí ohun tuntun tí àwòrán náà lè ru mọ́, láì sọ abajade rẹ̀ di ohun tí ẹsẹ náà sọ ní tààrà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “ìrọbí” láti pa àwòrán ìbímọ̀ mọ́, a sì lo “papọ̀” lẹ́ẹ̀mejì láti ṣàfihàn συν- nínú àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì. Àìbáramu nọ́ńbà tó ṣeé rí láàárín “ìṣẹ̀dá” àti “wọ́n” ni a lo gẹ́gẹ́ bí ìfihàn àkójọpọ̀ ní Yorùbá, ṣùgbọ́n a lè tún un ṣe sí “ó sì ń jẹ…” bí ìlànà ilé-iṣẹ́ bá fẹ́ ìbáramu gírámà tó muna.
