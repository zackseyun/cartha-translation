id: ROM.8.26
reference: Romans 8:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: yo
  text: Bákan náà, Ẹ̀mí náà ń bá wa gbé ẹrù àìlera wa; nítorí a kò mọ ohun tí ó yẹ kí a gbàdúrà fún bí ó ti yẹ, ṣùgbọ́n Ẹ̀mí náà fúnra rẹ̀ ń bẹ̀bẹ̀ fún wa pẹ̀lú ìkérora tí a kò lè fi ọ̀rọ̀ sọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘pẹ̀lú ìkérora tí kò ṣeé sọ’ tàbí ‘pẹ̀lú ìkérora tí kò ní ọ̀rọ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως
  choice: Bákan náà
  rationale: Ó so iṣẹ́ Ẹ̀mí pọ̀ mọ́ ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún ‘ní ọ̀nà kan náà.’
- source_word: συναντιλαμβάνεται
  choice: ń bá wa gbé ẹrù
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí dídáwọ́lé láti ran ẹnì kan lọ́wọ́ ní gbígbé ohun tó dojú kọ ọ́; àkànlò yìí lágbára ju ‘ń ràn wá lọ́wọ́’ lásán, ó sì bá ‘àìlera wa’ mu.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: àìlera wa
  rationale: A pa ẹyọ ọ̀rọ̀ orísun mọ́, láì dín ìtumọ̀ rẹ̀ kù sí àìlera ara tàbí ti ẹ̀mí nìkan.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: nítorí a kò mọ ohun tí ó yẹ kí a gbàdúrà fún bí ó ti yẹ
  rationale: Ó pa ìbéèrè ohun tí a ó gbàdúrà fún àti ọ̀nà tó yẹ kí a gbàdúrà rẹ̀ mọ́, bí gbolohun Gíríìkì ṣe fi wọ́n hàn.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Ẹ̀mí náà fúnra rẹ̀
  rationale: ‘Fúnra rẹ̀’ fi ìtẹnumọ́ αὐτό hàn, ó sì jẹ́ àdánidá ní Yorùbá láti ṣàfihàn Ẹ̀mí gẹ́gẹ́ bí olùṣe.
- source_word: ὑπερεντυγχάνει
  choice: ń bẹ̀bẹ̀ fún wa
  rationale: Ó ṣàfihàn ìbẹ̀bẹ̀ alágbára ní ipò wa; ‘fún wa’ jẹ́ kedere ní Yorùbá, ó sì bá àyíká ẹsẹ náà mu.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: pẹ̀lú ìkérora tí a kò lè fi ọ̀rọ̀ sọ
  rationale: Ó fi àìṣedéédé ἀλαλήτοις sílẹ̀ láàárín ‘tí kò ṣeé sọ’ àti ‘tí kò ní ọ̀rọ̀,’ láì sọ ọ́ di ìdákẹ́jẹ́ lásán.
theological_decisions:
- issue: Bí a ṣe máa fi ìṣe ara-ẹni ti Ẹ̀mí hàn láì gbára lé akọ tàbí abo gírámà èdè mìíràn
  choice: Ẹ̀mí náà fúnra rẹ̀ ń bẹ̀bẹ̀
  alternative: Ẹ̀mí náà fúnra rẹ̀ ni ó ń bẹ̀bẹ̀
  rationale: Yorùbá kò fi akọ tàbí abo sí arọ́pò-orúkọ ẹni kẹta. ‘Fúnra rẹ̀’ pa ìtẹnumọ́ àti ìṣe ara-ẹni mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí kò sí nínú gírámà orísun kún un.
- issue: Ẹni tí ìkérora jẹ́ tirẹ̀
  choice: A fi gbolohun náà mọ́ ìbẹ̀bẹ̀ Ẹ̀mí, ṣùgbọ́n a kò ṣàlàyé síwájú ẹni tó ń kérora
  alternative: Ẹ̀mí ń kérora fúnra rẹ̀
  rationale: Gíríìkì so ìkérora mọ́ ọ̀nà ìbẹ̀bẹ̀ Ẹ̀mí, ṣùgbọ́n kò yẹ kí ìtumọ̀ náà yanju ju èyí lọ nípa orísun ìkérora.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. ‘Ń bá wa gbé ẹrù’ jẹ́ àwòrán àkànlò tó mú agbára συναντιλαμβάνεται jáde, nígbà tí gbogbo gbolohun ṣì rọrùn fún òǹkàwé òde òní.
