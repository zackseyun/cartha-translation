  source_fidelity: Ìtumọ̀ ìpilẹ̀ pa ẹ̀wọ̀n olùtọ́ka náà mọ́, ó sì tú ἐκάλεσεν, ἐδικαίωσεν, àti ἐδόξασεν ní ìrísí ìṣe tó ti ṣẹlẹ̀. Síbẹ̀, “tún” lè túmọ̀ sí “lẹ́ẹ̀kan sí i” ní Yorùbá, èyí tí kò sí nínú καί; a yọ ọ́. “Ti pinnu tẹ́lẹ̀” sì sún mọ́ ìtumọ̀ προώρισεν—pípin/ìpinnu ṣáájú—ju “ti yàn kalẹ̀ tẹ́lẹ̀” lọ.
  naturalness: Ìlànà “Àwọn tí ó …, àwọn náà ni ó …” jẹ́ Yorùbá boṣewa, ó sì pa ìtẹnumọ́ οὓς … τούτους mọ́ láìjẹ́ kí ọ̀rọ̀ náà rọ̀gbọ̀. Yíyọ “tún” mú ìtẹ̀síwájú ìṣe náà jẹ́ ohun àdánidá, kì í sì ṣe bí ìṣe kan tí a tún ṣe.
  terminology: “Dá láre” jẹ́ ìtumọ̀ Yorùbá tó bójú mu fún δικαιόω nínú àyíká Pọ́ọ̀lù. “Fi ògo fún” pa δοξάζω mọ́, nígbà tí “ti pinnu tẹ́lẹ̀” ń yẹra fún fífi ètò ẹ̀kọ́ ẹ̀sìn kan kún προώρισεν. Àlàyé ìsàlẹ̀ b ti tún ṣàlàyé aorist náà ní ọ̀nà tó péye.
