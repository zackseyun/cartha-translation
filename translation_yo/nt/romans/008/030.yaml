  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: yo
  text: Àwọn tí ó ti pinnu tẹ́lẹ̀[a], àwọn náà ni ó pè; àwọn tí ó pè, àwọn náà ni ó dá láre; àwọn tí ó dá láre, àwọn náà ni ó fi ògo fún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti yàn kalẹ̀ tẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: 'Nínú Gíríìkì, ọ̀rọ̀-ìṣe náà wà ní ìrísí ìṣe tó ti ṣẹlẹ̀: “ó fi ògo fún.” Àwọn kan lóye èyí gẹ́gẹ́ bí ìtọ́ka sí ògo ọjọ́ iwájú tó dájú débi pé a ṣàpèjúwe rẹ̀ bí ohun tí ó ti ṣẹlẹ̀ tán.'
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: ti yàn kalẹ̀ tẹ́lẹ̀
  rationale: Ọ̀rọ̀ yìí sọ pé Ọlọ́run pinnu tàbí yan àwọn ènìyàn náà fún ohun kan ṣáájú. “Yàn kalẹ̀ tẹ́lẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tí kò sì fi ẹ̀kọ́ ẹ̀sìn kan pàtó kún ọ̀rọ̀ Gíríìkì.
- source_word: ἐκάλεσεν
  choice: pè
  rationale: “Pè” ni ìtumọ̀ Yorùbá tó ṣe déédéé fún καλέω níbí, ó sì pa ìsopọ̀ àwọn ìṣe inú gbólóhùn náà mọ́.
- source_word: ἐδικαίωσεν
  choice: dá láre
  rationale: '“Dá láre” fi ìtumọ̀ ìdájọ́ δικαιόω hàn ní Yorùbá àdánidá: pípolongo pé ẹni náà wà ní ẹ̀tọ́ tàbí kò lẹ́bi.'
- source_word: ἐδόξασεν
  choice: fi ògo fún
  rationale: “Fi ògo fún” tú δοξάζω ní ọ̀nà àdánidá, ó sì pa ìṣe náà mọ́ gẹ́gẹ́ bí ohun tí Pọ́ọ̀lù sọ pé Ọlọ́run ṣe, láìyí i sí ọjọ́ iwájú nínú ẹsẹ̀ pàtàkì.
- source_word: οὓς ... τούτους
  choice: àwọn tí ... àwọn náà
  rationale: Àtúnṣe “àwọn tí ... àwọn náà” pa ìtẹnumọ́ Gíríìkì mọ́ pé ẹgbẹ́ kan náà ni a ń tọ̀ lé láti ìbẹ̀rẹ̀ dé òpin.
- source_word: καὶ
  choice: tún
  rationale: “Tún” níbí ní agbára àfikún, ó ń fi ìgbésẹ̀ kọ̀ọ̀kan kún èyí tó ṣáájú, kì í ṣe pé Ọlọ́run ṣe ìṣe náà lẹ́ẹ̀kejì.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tó bá δέ mu ní àyíká yìí; kò sọ ìtakora líle.
theological_decisions:
- issue: Bí a ó ṣe tú προώρισεν láìrọ̀ ọ́ sí ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan
  choice: ti yàn kalẹ̀ tẹ́lẹ̀
  alternative: ti pinnu fún tẹ́lẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní ìtumọ̀ ìpinnu tàbí yíyan ṣáájú. Ìtumọ̀ yìí pa èrò náà mọ́, ṣùgbọ́n kò ṣàlàyé irú ìpinnu náà kọjá ohun tí ẹsẹ̀ sọ.
- issue: 'Bí a ó ṣe lóye ἐδόξασεν: ìṣe tó ti ṣẹlẹ̀ tàbí ògo ọjọ́ iwájú'
  choice: fi ògo fún
  alternative: yóò fi ògo fún
  rationale: Gíríìkì lo aorist indicative, nítorí náà a kò yí gbólóhùn pàtàkì sí ọjọ́ iwájú. Àlàyé pé ó lè tọ́ka sí ògo ọjọ́ iwájú tí ó dájú ni a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. Àtúnṣe “àwọn tí ... àwọn náà” dá ìlà ọ̀rọ̀ Pọ́ọ̀lù mọ́, “dá láre” sì jẹ́ gbólóhùn tó yé àwọn òǹkàwé lasán láìsọ ìtumọ̀ òfin rẹ̀ nù. Àmì ohùn ni a fi sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
