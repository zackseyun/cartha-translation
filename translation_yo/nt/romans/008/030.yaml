revisions:
- from: Àwọn tí ó sì ti yàn kalẹ̀ tẹ́lẹ̀[a], àwọn náà ni ó tún pè; àwọn tí ó pè, àwọn náà ni ó tún dá láre; àwọn tí ó dá láre, àwọn náà ni ó tún fi ògo fún[b].
  to: Àwọn tí ó ti pinnu tẹ́lẹ̀[a], àwọn náà ni ó pè; àwọn tí ó pè, àwọn náà ni ó dá láre; àwọn tí ó dá láre, àwọn náà ni ó fi ògo fún[b].
  rationale: A tún ìtumọ̀ náà ṣe nìkan láti yọ ìtumọ̀ “lẹ́ẹ̀kan sí i” tí “tún” lè fi kún ọrọ̀ Gíríìkì, àti láti lo “ti pinnu tẹ́lẹ̀,” èyí tó ba προώρισεν mu dáadáa. Ẹ̀wọ̀n ẹgbẹ́ kan náà, ìrísí ìṣe tó ti ṣẹlẹ̀, àti àìdánilójú ìtumọ̀ ìsìn tí ẹsẹ̀ kò ṣàlàyé ni a pa mọ́.
