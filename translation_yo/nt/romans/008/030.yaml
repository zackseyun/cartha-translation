    rationale: Ní Yorùbá, “tún” sábà máa ń túmọ̀ sí pé a ṣe ohun kan padà/lẹ́ẹ̀kan sí i. Καί níbí jẹ́ àfikún nínú ẹ̀wọ̀n ìjìnlẹ̀ náà, kì í ṣe ìtúnsẹ̀ ìṣe; “àwọn náà ni” ti ń mú agbára àfikún náà jáde dáadáa.
  - severity: low
    issue: “Ti yàn kalẹ̀ tẹ́lẹ̀” gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́ fún προώρισεν.
    rationale: Ó lè ṣiṣẹ́, ṣùgbọ́n ó lè dá sí “appoint/choose” ju sí ìpinnu tàbí ìdíwọ̀n ṣáájú lọ. “Ti pinnu tẹ́lẹ̀” jẹ́ ìtumọ̀ tó fẹ̀rẹ̀ẹ́ tọ́ ìtumọ̀ ìpilẹ̀ síi, láìdá ìjìnlẹ̀ ẹ̀kọ́ ẹ̀sìn kan lórí rẹ̀.
