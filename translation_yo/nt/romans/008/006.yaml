  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: yo
  text: Nítorí èrò inú ti ẹran-ara[a] jẹ́ ikú, ṣùgbọ́n èrò inú ti Ẹ̀mí[b] jẹ́ ìyè àti àlàáfíà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwà ẹ̀ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ̀mí.”
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àlàyé ohun tí ó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: φρόνημα
  choice: fífi ọkàn sí ohun tí ... fẹ́
  rationale: Gbólóhùn yìí fi ìṣarasí ọkàn tí ó dúró ṣinṣin hàn, kì í ṣe èrò kan ṣoṣo tàbí agbára ìrònú lásán.
- source_word: σάρξ
  choice: ẹran-ara
  rationale: Ó pa àwòrán àti ọ̀rọ̀ pàtàkì tí Paulu lò mọ́, láì túmọ̀ rẹ̀ ní ọ̀nà tí yóò yanjú gbogbo ìtumọ̀ rẹ̀ tẹ́lẹ̀.
- source_word: θάνατος
  choice: ikú
  rationale: Èyí ni ìtumọ̀ tààrà tí ó pa agbára ti ara àti ti ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká Róòmù 8 ń tọ́ka sí Ẹ̀mí Ọlọ́run; lílo lẹ́tà ńlá fi ìdájọ́ àyíká yìí hàn, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn pamọ́.
- source_word: ζωή
  choice: ìyè
  rationale: Ó jẹ́ ìtumọ̀ tààrà, ó sì pa ìtakora pẹ̀lú “ikú” mọ́.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ọ̀rọ̀ Yorùbá yìí wọ́pọ̀, ó sì lè gbé gbogbo ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì náà.
theological_decisions:
- issue: Bóyá πνεῦμα túmọ̀ sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí ènìyàn
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ẹ̀mí ní ìtumọ̀ gbogbogbòò
  rationale: Nínú àyíká Róòmù 8, Paulu ń sọ léraléra nípa Ẹ̀mí gẹ́gẹ́ bí ẹni àtọ̀runwá tí ń fúnni ní ìyè, ó sì ń fi í ṣe ìtakora sí ẹran-ara. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ mìíràn hàn.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó bójú mu, tí ó sì ṣeé lóye ni a lò. Gbólóhùn “fífi ọkàn sí ohun tí ... fẹ́” mú ìtumọ̀ ìṣarasí ọkàn inú φρόνημα jáde lọ́nà àdánidá; “ẹran-ara” sì pa àwòrán àti ìṣòro ìtumọ̀ ọ̀rọ̀ Paulu mọ́.
