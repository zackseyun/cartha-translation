  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: yo
  text: Ẹ̀mí náà fúnra rẹ̀[a] ń bá ẹ̀mí wa jẹ́rìí[b] pé ọmọ Ọlọ́run ni àwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “Ẹ̀mí náà gan-an.” Ọ̀rọ̀ αὐτὸ tẹnu mọ́ Ẹ̀mí náà; “fúnra rẹ̀” ló gbé ìtẹnumọ́ yìí jáde ní Yorùbá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ń jẹ́rìí papọ̀ pẹ̀lú ẹ̀mí wa.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “àwọn ọmọ Ọlọ́run ni àwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Ẹ̀mí náà fúnra rẹ̀
  rationale: Ọ̀rọ̀ αὐτό tẹnu mọ́ Ẹ̀mí náà gan-an. “Fúnra rẹ̀” fi ìtẹnumọ́ yìí hàn ní Yorùbá àdánidá; arọ́pò-orúkọ Yorùbá kò sì ní ìyàtọ̀ akọ tàbí abo.
- source_word: συμμαρτυρεῖ
  choice: ń bá ... jẹ́rìí
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí jíjẹ́rìí papọ̀ tàbí ní ìbámu pẹ̀lú ẹlòmíràn. Àkójọpọ̀ “ń bá ẹ̀mí wa jẹ́rìí” ṣe àfihàn ẹ̀rí alábàáṣiṣẹ́ yìí lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: τῷ πνεύματι ἡμῶν
  choice: ẹ̀mí wa
  rationale: 'Dative náà bá ìtumọ̀ ìbákẹ́gbẹ́ nínú συμμαρτυρεῖ mu: Ẹ̀mí ń jẹ́rìí papọ̀ pẹ̀lú ẹ̀mí wa, kì í ṣe pé ó kàn ń jẹ́rìí sí i nìkan.'
- source_word: ὅτι ἐσμὲν
  choice: pé ... ni àwa
  rationale: “Pé” ṣí gbólóhùn àkóónú náà, “ni àwa” sì sọ ìdánimọ̀ náà ní Yorùbá àdánidá láìfi ìtẹnumọ́ mìíràn kún un.
- source_word: τέκνα θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: τέκνα jẹ́ “àwọn ọmọ,” kì í ṣe “àwọn ọmọkùnrin” ní pàtó. Bí ó tilẹ̀ jẹ́ pé “ọmọ” wà ní ẹyọ ọ̀rọ̀ níbí, “àwa” fi hàn kedere pé ọ̀pọ̀ ènìyàn ni a ń sọ̀rọ̀ nípa wọn.
theological_decisions:
- issue: Bí a ṣe ń tọ́ka sí πνεῦμα gẹ́gẹ́ bí Ẹ̀mí Mímọ́
  choice: Ẹ̀mí náà fúnra rẹ̀
  alternative: ẹ̀mí náà fúnra rẹ̀
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí Ẹ̀mí Mímọ́, nítorí náà lẹ́tà ńlá fún “Ẹ̀mí” mú ìtọ́kasí náà ṣe kedere. Yorùbá kò ní arọ́pò-orúkọ tí ó pín sí akọ, abo, tàbí ohun aláìlẹ́mìí, nítorí náà kò sí dandan láti yanjú ìbéèrè gírámà Gíríìkì náà nípasẹ̀ fífi akọ tàbí ohun aláìlẹ́mìí hàn.
- issue: Ẹni tí Ẹ̀mí ń jẹ́rìí pẹ̀lú rẹ̀
  choice: ń bá ẹ̀mí wa jẹ́rìí
  alternative: ń jẹ́rìí fún ẹ̀mí wa
  rationale: συμμαρτυρεῖ àti dative tó tẹ̀ lé e ṣe àfihàn ẹ̀rí tí Ẹ̀mí àti ẹ̀mí wa ń jẹ́ papọ̀. A kò yí i sí ẹ̀rí tí Ẹ̀mí ń fún ẹ̀mí wa nìkan, kí a má bàa pa ìtumọ̀ ìbákẹ́gbẹ́ rẹ̀ rẹ́.
translation_notes:
  register: A lo Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. “Ń bá ... jẹ́rìí” jẹ́ ọ̀nà àdánidá láti pa èrò ẹ̀rí alábàáṣiṣẹ́ mọ́; “ọmọ Ọlọ́run ni àwa” sì jẹ́ ìṣètò Yorùbá tó rọrùn, nígbà tí “àwa” ń mú ọ̀pọ̀ hàn kedere.
