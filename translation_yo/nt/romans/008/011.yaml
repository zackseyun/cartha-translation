id: ROM.8.11
reference: Romans 8:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: yo
  text: Bí ó sì ṣe pé Ẹ̀mí ẹni tí ó jí Jésù dìde láti inú àwọn òkú ń gbé inú yín, ẹni tí ó jí Kristi Jésù dìde láti inú àwọn òkú yóò tún sọ ara yín tí ó lè kú di alààyè nítorí Ẹ̀mí rẹ̀ tí ń gbé inú yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Ẹ̀mí rẹ̀ tí ń gbé inú yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Ọ̀rọ̀ náà tọ́ka sí Ẹ̀mí Mímọ́ nínú àríyànjiyàn Paulu; lẹ́tà ńlá sì mú ìtọ́kasí yìí hàn láì fi ‘Mímọ́’ tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἐγείραντος / ἐγείρας
  choice: jí … dìde
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá láti sọ nípa jíjí ẹni dìde kúrò nínú òkú.
- source_word: ἐκ νεκρῶν
  choice: kúrò nínú òkú
  rationale: Ó pa àwòrán orísun mọ́ pé a jí ẹni náà dìde láti àárín àwọn òkú, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: ń gbé inú yín
  rationale: Ìtumọ̀ kan náà ni a lò ní ibi méjèèjì láti pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́, ní èdè Yorùbá àdánidá.
- source_word: Χριστὸν Ἰησοῦν
  choice: Kristi Jésù
  rationale: ‘Kristi’ jẹ́ ọ̀rọ̀ oyè Mèsáyà tí ó ti fìdí múlẹ̀ nínú Yorùbá, a sì pa àtẹ̀lé orúkọ Gíríìkì ‘Kristi Jésù’ mọ́.
- source_word: ζῳοποιήσει
  choice: yóò tún sọ … di alààyè
  rationale: Ó pa ìṣe ọjọ́ iwájú àti agbára fífúnni ní ìyè mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: θνητὰ σώματα
  choice: ara yín tí ó lè kú
  rationale: Gbólóhùn yìí tú ‘ara kíkú’ sí Yorùbá àdánidá, ó sì pa ìtumọ̀ pé ara náà wà lábẹ́ ikú mọ́.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: nítorí Ẹ̀mí rẹ̀ tí ń gbé inú yín
  rationale: διά pẹ̀lú accusative nínú ẹ̀dà SBLGNT yìí sábà ń fi ìdí tàbí okùnfà hàn; ‘nítorí’ tẹ̀lé ìtumọ̀ gírámà yẹn.
theological_decisions:
- issue: Ìtumọ̀ διὰ pẹ̀lú accusative ní gbólóhùn ìkẹyìn
  choice: nítorí Ẹ̀mí rẹ̀ tí ń gbé inú yín
  alternative: nípasẹ̀ Ẹ̀mí rẹ̀ tí ń gbé inú yín
  rationale: Ọ̀rọ̀ àkọ́kọ́ tẹ̀lé agbára okùnfà tí διά pẹ̀lú accusative ní nínú ọ̀rọ̀ SBLGNT. Àmọ́ ìtumọ̀ ohun èlò—‘nípasẹ̀’—jẹ́ àṣà ìtumọ̀ tó wọ́pọ̀, nítorí náà a fi sí àlàyé ìsàlẹ̀ láti pa àìdánilójú ẹ̀rí ọ̀rọ̀ mọ́.
- issue: Agbára oyè Χριστός
  choice: Kristi Jésù
  alternative: Mèsáyà Jésù
  rationale: ‘Kristi’ nínú Yorùbá ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró, kì í ṣe orúkọ ìdílé lásán; ó sì jẹ́ ọ̀rọ̀ tó ti fìdí múlẹ̀ jù fún òǹkàwé Yorùbá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa àtúnwí àti ìsopọ̀ ọ̀rọ̀ inú Gíríìkì mọ́ láì jẹ́ kí gbólóhùn di àjèjì.
