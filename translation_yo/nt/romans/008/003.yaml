id: ROM.8.3
reference: Romans 8:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: yo
  text: Nítorí ohun tí òfin kò lè ṣe[a], ní ti pé ó jẹ́ aláìlágbára nípasẹ̀ ẹran ara[b], Ọlọ́run ṣe é nípa rírán Ọmọ tirẹ̀ gan-an ní ìdàbí ẹran ara ẹlẹ́ṣẹ̀[d] àti nítorí ẹ̀ṣẹ̀[c]; ó dá ẹ̀ṣẹ̀ lẹ́bi nínú ẹran ara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ Gíríìkì jù: “àìlèṣe òfin.”'
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “ẹran ara” níbí tọ́ka sí ìwà ènìyàn nínú àìlera rẹ̀ tí ẹ̀ṣẹ̀ ti bà jẹ́; àwọn ìtumọ̀ kan máa ń túmọ̀ rẹ̀ ní àwọn àyíká kan sí “ìwà ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gẹ́gẹ́ bí ẹbọ ẹ̀ṣẹ̀.” Gbólóhùn Gíríìkì náà lè ní ìtumọ̀ ìrúbọ bẹ́ẹ̀.
    reason: alternative_reading
  - marker: d
    text: Ọ̀rọ̀ náà, “ní ìdàbí ẹran ara ẹlẹ́ṣẹ̀,” fi hàn pé Ọmọ náà di ènìyàn ní tòótọ́, ṣùgbọ́n ó tún fi ìyàtọ̀ rẹ̀ sí ẹ̀ṣẹ̀ hàn.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: ohun tí òfin kò lè ṣe
  rationale: Èyí sọ ọ̀rọ̀ àìlèṣe òfin náà di Yorùbá àdánidá, ó sì pa ìtumọ̀ àìlágbára rẹ̀ mọ́.
- source_word: νόμος
  choice: òfin
  rationale: A lo ọ̀rọ̀ gbogbogbò ‘òfin’ bí Gíríìkì ṣe ṣe àfiyèsí iṣẹ́ rẹ̀ níbí láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: nítorí pé ẹran ara sọ ọ́ di aláìlágbára
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá tó ṣe kedere, ó sì fi hàn pé àìlera náà wá nípasẹ̀ ẹran ara, kì í ṣe pé ohun búburú kan wà nínú òfin fúnra rẹ̀.
- source_word: πέμψας
  choice: nípa rírán
  rationale: 'Ó fi ipa ọ̀nà tàbí ohun èlò tí participle náà ní hàn: Ọlọ́run ṣe iṣẹ́ náà nípa rírán Ọmọ rẹ̀.'
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: Ọmọ tirẹ̀ gan-an
  rationale: ‘Gan-an’ pa ìtẹnumọ́ ἑαυτοῦ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘his own Son’ ní Yorùbá.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: ní ìrí ẹran ara ẹlẹ́ṣẹ̀
  rationale: ‘Ìrí’ pa èrò ìjọra mọ́ láìsọ pé Ọmọ náà jẹ́ ẹlẹ́ṣẹ̀ tàbí pé ìwà ènìyàn rẹ̀ kì í ṣe òtítọ́.
- source_word: περὶ ἁμαρτίας
  choice: nítorí ẹ̀ṣẹ̀
  rationale: Èyí pa gbólóhùn Gíríìkì náà mọ́ ní ọ̀nà tí kò fi tipátipá yan ìtumọ̀ irúbọ ẹ̀ṣẹ̀; a tọ́ka sí ìtumọ̀ irúbọ náà nínú àlàyé ìsàlẹ̀.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: ó dá ẹ̀ṣẹ̀ lẹ́bi
  rationale: Gbólóhùn Yorùbá yìí pa agbára ìdájọ́ ọ̀rọ̀-ìṣe Gíríìkì náà mọ́.
- source_word: ἐν τῇ σαρκί
  choice: nínú ẹran ara
  rationale: A kò fi arọ́pò-orúkọ tí kò sí nínú Gíríìkì kún un, kí ìṣókí àti àìdánilójú tí ọ̀rọ̀ náà ní lè dúró.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ẹsẹ yìí
  choice: A túmọ̀ ọ́ sí ‘ẹran ara’ ní ibi méjèèjì.
  alternative: ‘ìwà ẹlẹ́ṣẹ̀’ tàbí ‘ẹ̀dá ẹlẹ́ṣẹ̀’
  rationale: ‘Ẹran ara’ pa àwòrán àti ìtumọ̀ onípele Pọ́ọ̀lù mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó rọ́pò rẹ̀.
- issue: Ìtumọ̀ περὶ ἁμαρτίας
  choice: nítorí ẹ̀ṣẹ̀
  alternative: gẹ́gẹ́ bí ẹbọ ẹ̀ṣẹ̀
  rationale: Gbólóhùn Gíríìkì lè ní agbára ìrúbọ, ṣùgbọ́n ó tún lè túmọ̀ sí ‘nítorí ẹ̀ṣẹ̀.’ Ọ̀rọ̀ àkọ́kọ́ pa ìtumọ̀ gbooro mọ́, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ ìrúbọ náà mọ́.
- issue: Agbára ọ̀rọ̀ nípa Kristi nínú ‘ní ìrí ẹran ara ẹlẹ́ṣẹ̀’
  choice: A pa ‘ìrí’ mọ́, láìsọ pé Ọmọ náà ní ẹ̀ṣẹ̀.
  alternative: Ọ̀rọ̀ tí yóò ṣàlàyé ìjọra tàbí ìyàtọ̀ náà ju bí Gíríìkì ṣe sọ ọ́ lọ
  rationale: 'Èyí pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ náà mọ́: Ọmọ náà wá gẹ́gẹ́ bí ènìyàn ní tòótọ́, ṣùgbọ́n ẹsẹ náà kò pe òun fúnra rẹ̀ ní ẹlẹ́ṣẹ̀.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa ‘ẹran ara’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì Pọ́ọ̀lù, bí ó tilẹ̀ jẹ́ pé ó wuwo díẹ̀ ju ‘ara’ lásán lọ, nítorí ó dáàbò bo ìsopọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn inú ẹsẹ náà.
