id: ROM.8.19
reference: Romans 8:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: yo
  text: Nítorí ìṣẹ̀dá ń fi ìháragàgà retí ìfihàn àwọn ọmọkùnrin Ọlọ́run[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ Ọlọ́run.” Gíríìkì ní “àwọn ọmọkùnrin,” èyí tí ó tún lè tẹnu mọ́ ipò ọmọ àti ẹ̀tọ́ ogún wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé ẹsẹ̀ yìí mọ́ pẹ̀lú ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn ní Yorùbá.
- source_word: ἀποκαραδοκία
  choice: fi ìháragàgà retí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìfojúsọ́nà líle àti ìretí onítara; gbólóhùn yìí sọ agbára rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: κτίσεως
  choice: ìṣẹ̀dá
  rationale: A lò ó gẹ́gẹ́ bí àpapọ̀ gbogbo ohun tí a dá, èyí tó bá ìwọ̀n àgbáyé inú àyíká ọ̀rọ̀ náà mu ju ẹ̀dá kọ̀ọ̀kan lọ.
- source_word: ἀποκάλυψιν
  choice: fífihàn
  rationale: Ó sọ ní kedere pé ohun tí ó fara sin nísinsìnyí yóò di mímọ̀ ní ọjọ́ iwájú, láìfi ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò ṣe dandan kún un.
- source_word: υἱῶν
  choice: àwọn ọmọkùnrin
  rationale: Ó pa ìtumọ̀ akọ ọ̀pọ̀ inú Gíríìkì mọ́, ó sì jẹ́ kí àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ náà lè ní ìtumọ̀ gbogbo àwọn ọmọ Ọlọ́run àti ipò ajogún.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: “Àwọn ọmọkùnrin Ọlọ́run” fi ìbáṣepọ̀ tí genitive náà ń sọ hàn ní Yorùbá àdánidá.
- source_word: ἀπεκδέχεται
  choice: retí
  rationale: Ó mú ìtumọ̀ dídúró de ohun ọjọ́ iwájú jáde; “ìháragàgà” ti sọ agbára ìretí inú ọ̀rọ̀-ìṣe náà di mímọ̀, nítorí náà a kò tún un sọ.
theological_decisions:
- issue: Bóyá kí υἱῶν θεοῦ jẹ́ “àwọn ọmọkùnrin Ọlọ́run” tàbí “àwọn ọmọ Ọlọ́run.”
  choice: àwọn ọmọkùnrin Ọlọ́run
  alternative: àwọn ọmọ Ọlọ́run
  rationale: Gíríìkì lo ọ̀rọ̀ akọ ọ̀pọ̀ “àwọn ọmọkùnrin.” Yíyan èyí pa ìrísí orísun mọ́, ó sì lè mú ìtumọ̀ ipò ọmọ àti ogún nínú àríyànjiyàn Paulu wá; àlàyé ìsàlẹ̀ jẹ́ kó hàn pé kì í ṣe dandan pé ó ń yọ àwọn obìnrin kúrò.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Fi ìháragàgà retí” jẹ́ àdánidá fún olùkà gbogbogbò, nígbà tí “àwọn ọmọkùnrin Ọlọ́run” pa ìfarahàn akọ inú orísun mọ́, pẹ̀lú àlàyé ìsàlẹ̀ fún ìtumọ̀ tó gbòòrò.
