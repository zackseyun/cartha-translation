id: ROM.8.15
reference: Romans 8:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: yo
  text: Nítorí ẹ̀yin kò gba ẹ̀mí ìsìnrú tí ń mú yín padà sínú ìbẹ̀rù; ṣùgbọ́n ẹ̀yin gba Ẹ̀mí ìtẹ́wọ́gbà gẹ́gẹ́ bí ọmọ[a], nípasẹ̀ ẹni tí àwa ń ké pé[b], “Abba! Bàbá!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀mí ìtẹ́wọ́gbà gẹ́gẹ́ bí ọmọ.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ fífi ẹni sí ipò ọmọkùnrin tó ní ẹ̀tọ́ ọmọ àti ogún.
    reason: alternative_reading
  - marker: b
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì jù: “nínú ẹni tí àwa ń ké pé.” Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà bá “ẹ̀mí” mu ní ìbámu gírámà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: ẹ̀mí ìsìnrú
  rationale: Èyí pa àwòrán ipò ẹrú mọ́, ó sì jẹ́ kí ìyàtọ̀ rẹ̀ sí πνεῦμα υἱοθεσίας hàn kedere láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: πάλιν εἰς φόβον
  choice: tí yóò tún mú yín sínú ìbẹ̀rù
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ πάλιν (‘tún/padà’) àti εἰς φόβον (‘sínú ìbẹ̀rù’) mọ́.
- source_word: πνεῦμα υἱοθεσίας
  choice: Ẹ̀mí ìgbà-sí-ipò-ọmọ
  rationale: ‘Ìgbà-sí-ipò-ọmọ’ tẹnu mọ́ ipò tuntun tí ẹni gba gẹ́gẹ́ bí ọmọ àti ẹ̀tọ́ ogún tó wà nínú υἱοθεσία. Lílo ‘Ẹ̀mí’ pẹ̀lú lẹ́tà ńlá ń tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí àyíká ẹsẹ náà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn tí kò sọ ọ́ di ẹni pàtó mọ́.
- source_word: ἐν ᾧ
  choice: nípasẹ̀ ẹni tí
  rationale: Èyí fi ipa ọ̀nà tàbí ohun èlò tí ἐν lè ní hàn, ó sì bá ìtọ́kasí sí Ẹ̀mí gẹ́gẹ́ bí ẹni mu; ìtumọ̀ gangan ‘nínú ẹni tí’ wà nínú àlàyé ìsàlẹ̀.
- source_word: κράζομεν
  choice: àwa fi ń ké pé
  rationale: ‘Ké’ pa agbára àti ìtara ìpè náà mọ́, nígbà tí ‘àwa’ pa ìyípadà láti ‘ẹ̀yin gba’ sí ‘àwa ń ké’ mọ́.
- source_word: Αββα ὁ πατήρ
  choice: Ábà! Baba!
  rationale: A kọ Αββα gẹ́gẹ́ bí ó ṣe ń dún dípò títúmọ̀ rẹ̀ kúrò, a sì túmọ̀ ὁ πατήρ sí ‘Baba’; àmì ìyanu fi ìtara ìpè náà hàn.
theological_decisions:
- issue: Bóyá πνεῦμα υἱοθεσίας ń tọ́ka ní tààrà sí Ẹ̀mí Mímọ́ tàbí sí irú ẹ̀mí/ipò kan
  choice: Ọ̀rọ̀ àkọ́kọ́ lo ‘Ẹ̀mí’ pẹ̀lú lẹ́tà ńlá, nítorí àyíká Róòmù 8 àti ἐν ᾧ tó tẹ̀ lé e ń tọ́ka gidigidi sí Ẹ̀mí Mímọ́.
  alternative: ‘ẹ̀mí ìgbà-sí-ipò-ọmọ,’ èyí tó pa ìfarajọ pẹ̀lú ‘ẹ̀mí ìsìnrú’ mọ́ láìsọ ẹni tí ẹ̀mí náà jẹ́ ní pàtó.
  rationale: Àyíká náà ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́, ṣùgbọ́n àìsí árítíkì àti ìfarajọ àwọn gbólóhùn méjèèjì fi ààyè sílẹ̀ fún ìtumọ̀ tí kò sọ ọ́ di ẹni pàtó; àlàyé ìsàlẹ̀ pa ìṣòro náà mọ́.
- issue: Bí a ṣe lè gbé ìtumọ̀ ọmọkùnrin àti ẹ̀tọ́ òfin inú υἱοθεσία jáde
  choice: ‘ìgbà-sí-ipò-ọmọ,’ pẹ̀lú àlàyé pé ọ̀rọ̀ Gíríìkì tọ́ka sí fífi ẹni sí ipò ọmọkùnrin tó ní ẹ̀tọ́ ogún.
  alternative: ‘ìsọni di ọmọ’ tàbí ‘ìgbà-sí-ipò-ọmọkùnrin.’
  rationale: Ọ̀rọ̀ àkọ́kọ́ jẹ́ àdánidá sí i ní Yorùbá, ó sì tẹnu mọ́ ipò àti ẹ̀tọ́; àlàyé ṣe àfihàn àbùdá akọ àti ti òfin nínú ọ̀rọ̀ Gíríìkì láìjẹ́ kí gbólóhùn náà le láti lóye.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tó ṣeé lóye. A lo ‘ẹ̀yin’ àti ‘àwa’ láti pa ìyípadà ẹni inú orísun mọ́. ‘Ìgbà-sí-ipò-ọmọ’ jẹ́ gbólóhùn ṣókí tó ń sọ ipò tuntun àti ẹ̀tọ́ òfin, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ ni ó mú àbùdá ‘ọmọkùnrin’ inú ọ̀rọ̀ Gíríìkì hàn ní kíkún.
