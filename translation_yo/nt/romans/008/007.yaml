id: ROM.8.7
reference: Romans 8:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: yo
  text: Nítorí pé ìtẹ̀sí ọkàn ti ara[a] jẹ́ ìṣọ̀tá sí Ọlọ́run[b]; kò tẹrí ba fún òfin Ọlọ́run, nítorí pé kò tilẹ̀ lè ṣe bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìtẹ̀sí ọkàn ìwà ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “jẹ́ ọ̀tá sí Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ tí ó ṣáájú múlẹ̀, ó sì pa agbára ìtumọ̀ okùnfà mọ́ ní Yorùbá àdánidá.
- source_word: τὸ φρόνημα
  choice: ìtẹ̀sí ọkàn
  rationale: Kì í ṣe ìrònú lásán, ṣùgbọ́n ìdarí tàbí ìtẹ̀sí tí ọkàn gbà; ‘ìtẹ̀sí ọkàn’ mú ìtumọ̀ yìí jáde ní kedere.
- source_word: τῆς σαρκὸς
  choice: ẹran ara
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì σάρξ mọ́, láì sọ ọ́ di ‘ìwà ẹlẹ́ṣẹ̀’ nínú ẹsẹ pàtàkì; àlàyé ìtumọ̀ àfiwé wà ní àlàyé ìsàlẹ̀.
- source_word: ἔχθρα εἰς θεόν
  choice: ìṣọ̀tá sí Ọlọ́run
  rationale: Ọ̀rọ̀-orúkọ ‘ìṣọ̀tá’ bá ἔχθρα mu, ‘sí Ọlọ́run’ sì fi ibi tí ìṣọ̀tá náà dojú kọ hàn.
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: kò tẹrí ba fún òfin Ọlọ́run
  rationale: ‘Tẹrí ba fún’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ara sí abẹ́ àṣẹ, ó sì pa ìtumọ̀ ὑποτάσσεται mọ́.
- source_word: οὐδὲ γὰρ δύναται
  choice: bẹ́ẹ̀ ni kò tilẹ̀ lè ṣe bẹ́ẹ̀
  rationale: ‘Kò tilẹ̀ lè’ fi ìtẹnumọ́ οὐδέ àti àìlè ṣe tí δύναται túmọ̀ sí hàn, láì sọ ọ́ di àìfẹ́ nìkan.
theological_decisions:
- issue: Bóyá kí a tú σάρξ sí ‘ẹran ara’ tàbí kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘ìwà ẹlẹ́ṣẹ̀’
  choice: A lo ‘ẹran ara’ nínú ẹsẹ pàtàkì, a sì fi ‘ìwà ẹlẹ́ṣẹ̀’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ àfiwé.
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ fi hàn pé lílò àfiwé ni, ṣùgbọ́n pípa ‘ẹran ara’ mọ́ kò jẹ́ kí ìtumọ̀ oní ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo rọ́pò ọ̀rọ̀ orísun.
- issue: Bóyá kí a rọ gbolohun ìkẹyìn sí àìfẹ́ láti tẹrí ba tàbí kí a pa àìlè ṣe rẹ̀ mọ́
  choice: A sọ ní tààrà pé ‘kò tilẹ̀ lè ṣe bẹ́ẹ̀.’
  alternative: kò fẹ́ tẹrí ba
  rationale: δύναται dá lórí agbára tàbí àǹfààní láti ṣe ohun kan; ẹsẹ náà sọ àìlè ṣe, nítorí náà a pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láì tú u sí ètò ẹ̀kọ́ kan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ìtẹ̀sí ọkàn’ fún ìdarí inú ènìyàn, ‘ẹran ara’ láti pa àwòrán Páùlù mọ́, àti ‘tẹrí ba’ fún fífi ara sí abẹ́ àṣẹ.
