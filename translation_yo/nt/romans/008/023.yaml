id: ROM.8.23
reference: Romans 8:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: yo
  text: Kì í sì í ṣe ìyẹn nìkan, ṣùgbọ́n àwa fúnra wa pẹ̀lú, tí a ní àkọ́so Ẹ̀mí[a], àní àwa fúnra wa ń kérora nínú ara wa, bí a ti ń fi ìháragàgà dúró de gbígbà wa sí ipò ọmọ[b]—ìràpadà ara wa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe kí a tú u pé, “Ẹ̀mí gẹ́gẹ́ bí àkọ́so.”
    reason: alternative_reading
  - marker: b
    text: Tàbí ní ṣókí, “gbígbà wa gẹ́gẹ́ bí ọmọ.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbígbà ẹni sí ipò ọmọkùnrin.
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “ara wa” wà ní ọ̀rọ̀ ẹyọ, ṣùgbọ́n a lò ó fún ara olúkúlùkù wa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: Kì í sì í ṣe ìyẹn nìkan, ṣùgbọ́n
  rationale: Ó so ìyàtọ̀ tí Pọ́ọ̀lù ń tẹ̀ síwájú mọ́ ọ̀rọ̀ tó ṣáájú, ó sì pa ìtẹnumọ́ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: àwa fúnra wa pẹ̀lú, ... àní àwa fúnra wa
  rationale: Ó pa àtúnsọ àti ìtẹnumọ́ αὐτοὶ àti ἡμεῖς mọ́, pé àwọn onígbàgbọ́ fúnra wọn náà ń kérora.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: àkọ́so Ẹ̀mí
  rationale: “Àkọ́so” túmọ̀ sí ìpín àkọ́kọ́ nínú èso tàbí ohun tí a kórè; àkójọpọ̀ ọ̀rọ̀ yìí tún jẹ́ kí ìbáṣepọ̀ genitive náà wà ní ṣíṣí sí ìtumọ̀ ju ẹyọ kan lọ.
- source_word: ἔχοντες
  choice: tí a ní
  rationale: Gbólóhùn aṣọ̀rọ̀-ṣe bẹ́ẹ̀ dùn mọ́ Yorùbá ju lílo participle lọ, láì yí ìtumọ̀ rẹ̀ padà.
- source_word: ἐν ἑαυτοῖς
  choice: nínú ara wa
  rationale: Ó fi hàn pé ìkérora náà wà nínú wọn, ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: στενάζομεν
  choice: ń kérora
  rationale: Ó pa ìsopọ̀ mọ́ ìkérora gbogbo ìṣẹ̀dá nínú àyíká ẹsẹ náà mọ́.
- source_word: υἱοθεσίαν
  choice: gbígbà wa sí ipò ọmọ
  rationale: Ó sọ èrò gbígbà ẹni wọ inú ipò ọmọ àti ajogún ní Yorùbá àdánidá; “ọmọ” kò ní àmì akọ tàbí abo ní Yorùbá, nítorí náà ó lè kan gbogbo onígbàgbọ́ láì pa ìtumọ̀ ipò ọmọ run.
- source_word: ἀπεκδεχόμενοι
  choice: bí a ti ń fi ìháragàgà dúró de
  rationale: Ó mú ìfojúsọ́nà líle àti ìdúró pẹ̀lú ìfẹ́ ọkàn tí ọ̀rọ̀ Gíríìkì náà ní jáde.
- source_word: τὴν ἀπολύτρωσιν
  choice: ìràpadà
  rationale: Ó pa èdè ẹ̀kọ́ ìgbàlà Pọ́ọ̀lù àti ìwúwo ìrètí ọjọ́ iwájú rẹ̀ mọ́.
- source_word: τοῦ σώματος ἡμῶν
  choice: ara wa
  rationale: Yorùbá máa ń lo “ara wa” lọ́nà àdánidá fún ara olúkúlùkù wa; ó tún bá singular distributive Gíríìkì mu.
theological_decisions:
- issue: Bí a ṣe lè tú υἱοθεσίαν láì sọ ìmọ̀lára ipò ọmọ àti ogún rẹ̀ nù tàbí ya àwọn obìnrin sọ́tọ̀
  choice: gbígbà wa sí ipò ọmọ
  alternative: gbígbà wa ṣọmọ; gbígbà wa sí ipò ọmọkùnrin
  rationale: “Ọmọ” ní Yorùbá kò dá lórí akọ tàbí abo, ṣùgbọ́n “ipò ọmọ” ṣì pa àwòrán ipò ìdílé àti ẹ̀tọ́ ogún mọ́. Àlàyé ìsàlẹ̀ sọ pé ọ̀rọ̀ Gíríìkì tẹnu mọ́ ipò ọmọkùnrin nínú ètò òfin ìgbà náà.
- issue: Bóyá “àkọ́so Ẹ̀mí” jẹ́ ohun tí Ẹ̀mí fi fúnni tàbí Ẹ̀mí fúnra rẹ̀ gẹ́gẹ́ bí àkọ́so
  choice: àkọ́so Ẹ̀mí
  alternative: Ẹ̀mí gẹ́gẹ́ bí àkọ́so
  rationale: Ìkọ̀lé Gíríìkì lè gba ìtumọ̀ méjèèjì; ọ̀rọ̀ inú ẹsẹ pa àìdánilójú náà mọ́, àlàyé ìsàlẹ̀ sì fi ọ̀nà kejì hàn.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó lọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn síbi tí ó yẹ, a sì pa àtúnsọ ìtẹnumọ́ Pọ́ọ̀lù mọ́ láì mú kí gbólóhùn náà di àjèjì.
