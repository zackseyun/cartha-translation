    rationale: ‘Fún wa’ sábà máa ń túmọ̀ sí ‘ní àǹfààní wa’ tàbí ‘for us’; níbí, εἰς ἡμᾶς dáa jù lọ ní ‘sí wa’ (‘to us’), nígbà tí ‘nínú wa’ wà gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
