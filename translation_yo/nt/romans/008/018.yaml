review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìjìyà ìsinsìnyí, àìdọ́gba wọn pẹ̀lú ògo ọjọ́ iwájú, àti ìṣípayá ògo náà mọ́ dáadáa. Ṣùgbọ́n εἰς ἡμᾶς yẹ kí ó jẹ́ ‘sí wa’ ní ìtumọ̀ àkọ́kọ́, kì í ṣe ‘fún wa,’ kí ìhà ‘sí àwọn tí a ń fihàn sí’ má bàa di ìtumọ̀ ìfẹ́sí ‘ní àǹfààní wa.’
  naturalness: ‘A ó ṣí payá sí wa’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó dáa jù ‘a ó ṣí payá fún wa’ lọ nínú àyíká yìí. Ìyókù gbólóhùn náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, ó sì rọrùn láti lóye.
  terminology: ‘Àwọn ìjìyà,’ ‘ìgbà ìsinsìnyí,’ ‘ògo tí ń bọ̀,’ àti ‘ṣí payá’ bá ọ̀rọ̀ Gíríìkì mu. Àlàyé ìsàlẹ̀ náà ń pa ìṣeéṣe ‘nínú wa’ mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
