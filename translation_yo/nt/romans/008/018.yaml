id: ROM.8.18
reference: Romans 8:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: yo
  text: Nítorí mo gbà pé àwọn ìjìyà ìgbà ìsinsìnyí kò tó nǹkan láti fi wé ògo tí ń bọ̀, tí a ó ṣí payá sí wa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú wa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: mo gbà pé
  rationale: Ó fi ìdájọ́ tí ènìyàn ṣe lẹ́yìn ìrònú hàn, kì í ṣe ìmọ̀lára lásán; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: οὐκ ἄξια … πρὸς
  choice: kò tó nǹkan láti fi wé
  rationale: Ó sọ àìdọ́gba tó pọ̀ láàárín ìjìyà ìsinsìnyí àti ògo ọjọ́ iwájú ní Yorùbá tó ṣe kedere.
- source_word: τὰ παθήματα
  choice: àwọn ìjìyà
  rationale: Ó tọ́ka sí àwọn ohun ìrora àti ìpọ́njú tí a ń fara dà.
- source_word: τοῦ νῦν καιροῦ
  choice: ìgbà ìsinsìnyí
  rationale: Ó pa ìtumọ̀ àkókò tàbí sáà tí ó wà nísinsìnyí mọ́ láìfi èrò míì kún un.
- source_word: τὴν μέλλουσαν δόξαν
  choice: ògo tí ń bọ̀
  rationale: Ó pa μέλλουσαν mọ́ gẹ́gẹ́ bí ohun ọjọ́ iwájú tí ń bọ̀, ní ọ̀nà tó rọrùn láti lóye.
- source_word: ἀποκαλυφθῆναι
  choice: tí a ó ṣí payá
  rationale: Ó pa ìtumọ̀ fífi ohun tí ó farapamọ́ hàn àti irú ọ̀rọ̀ àìṣe-taara ti Gíríìkì mọ́.
- source_word: εἰς ἡμᾶς
  choice: fún wa
  rationale: Ní àyíká yìí, ó lè sọ pé ògo náà ni a ó fihàn fún àwọn onígbàgbọ́; ìtumọ̀ ‘nínú wa’ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ εἰς ἡμᾶς nípa bí a ó ṣe ṣí ògo payá
  choice: fún wa
  alternative: nínú wa
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí fífi ògo náà hàn fún wa tàbí sí ṣíṣí rẹ̀ payá nínú wa. A fi àṣàyàn kejì sínú àlàyé ìsàlẹ̀ kí a má bàa mú àìdánilójú tó ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kúrò.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí àwọn òǹkàwé lásán lè lóye. A lo ‘kò tó nǹkan láti fi wé’ gẹ́gẹ́ bí àfiwé àdánidá, a sì yà ‘tí ń bọ̀’ sọ́tọ̀ láti pa μέλλουσαν mọ́.
