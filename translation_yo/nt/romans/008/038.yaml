revisions:
- from: Nítorí ó dá mi lójú pé kì í ṣe ikú, kì í ṣe ìyè, kì í ṣe àwọn áńgẹ́lì, kì í ṣe àwọn alákòóso[a], kì í ṣe ohun tí ó wà nísinsìnyí, kì í ṣe ohun tí ń bọ̀, kì í sì ṣe àwọn agbára,
  to: Nítorí ó dá mi lójú pé bẹ́ẹ̀ ni ikú, bẹ́ẹ̀ ni ìyè, bẹ́ẹ̀ ni àwọn áńgẹ́lì, bẹ́ẹ̀ ni àwọn alákòóso[a], bẹ́ẹ̀ ni ohun tí ó wà nísinsìnyí, bẹ́ẹ̀ ni ohun tí ń bọ̀, bẹ́ẹ̀ ni àwọn agbára,
  rationale: The revision replaces the unnatural repeated copular negative with ‘bẹ́ẹ̀ ni,’ which naturally maintains the Greek rhetorical sequence and its dependence on the predicate in the following verse. It also refines the lexical-alternative note for ἀρχαὶ, while retaining the main text’s deliberate ambiguity concerning the nature of these rulers/authorities.
  reviewer_model: gpt-5.6-terra
