id: ROM.8.38
reference: Romans 8:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: yo
  text: Nítorí ó dá mi lójú pé bẹ́ẹ̀ ni ikú, bẹ́ẹ̀ ni ìyè, bẹ́ẹ̀ ni àwọn áńgẹ́lì, bẹ́ẹ̀ ni àwọn alákòóso[a], bẹ́ẹ̀ ni ohun tí ó wà nísinsìnyí, bẹ́ẹ̀ ni ohun tí ń bọ̀, bẹ́ẹ̀ ni àwọn agbára,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aláṣẹ”; ó ṣeé ṣe kí ó ń tọ́ka sí àwọn ọlá-àṣẹ àgbáyé tàbí ti ẹ̀mí.
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ἀρχαὶ, èyí tí ó lè tọ́ka sí àwọn alákòóso tàbí àwọn ọlá-àṣẹ.
lexical_decisions:
- source_word: πέπεισμαι
  choice: ó dá mi lójú
  rationale: Ìṣe pípé náà ń sọ ìdánilójú tí ó ti fìdí múlẹ̀, tí ó sì ń bá a lọ; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá tí ó fi ìdánilójú Pọ́ọ̀lù hàn.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tí ó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí fún un.
- source_word: οὔτε ... οὔτε
  choice: kì í ṣe ... kì í ṣe
  rationale: Àtúnṣe gbólóhùn yìí pa ìkọ̀sẹ̀ àti ìtẹnumọ́ àtòjọ Gíríìkì mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: θάνατος
  choice: ikú
  rationale: Ìtumọ̀ tààrà tí ó sì wọ́pọ̀.
- source_word: ζωή
  choice: ìyè
  rationale: Ìtumọ̀ tààrà tí ó dúró ní òdìkejì ikú.
- source_word: ἄγγελοι
  choice: àwọn áńgẹ́lì
  rationale: Àyíká ọ̀rọ̀ tó ń sọ nípa àwọn ohun ọ̀run tàbí agbára tí ó ju ti ènìyàn lọ mú kí ‘áńgẹ́lì’ bá a mu ju ‘òjíṣẹ́’ lọ.
- source_word: ἀρχαὶ
  choice: àwọn alákòóso
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn tí ń ṣàkóso tàbí àwọn ọlá-àṣẹ inú àgbáyé ẹ̀mí; ‘àwọn alákòóso’ jẹ́ kíkà tí ó ṣe kedere láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó lé e lórí.
- source_word: ἐνεστῶτα
  choice: ohun tí ó wà nísinsìnyí
  rationale: Ó sọ àwọn ohun tàbí ipò ìsinsìnyí di ohun tí a ń tọ́ka sí, ó sì bá ìlànà ọ̀rọ̀ Yorùbá mu.
- source_word: μέλλοντα
  choice: ohun tí ń bọ̀
  rationale: Ó tọ́ka sí ohun ọjọ́ iwájú, ó sì dá ìṣọ̀kan pẹ̀lú ‘ohun tí ó wà nísinsìnyí’ dúró.
- source_word: δυνάμεις
  choice: àwọn agbára
  rationale: Ó pa àìdánilójú mọ́ bóyá àwọn ẹ̀dá tàbí ọlá-àṣẹ ẹ̀mí ni, tàbí àwọn ipá alágbára lápapọ̀.
theological_decisions:
- issue: Bóyá ἀρχαὶ àti δυνάμεις jẹ́ orúkọ ìmọ̀-ẹ̀kọ́ pàtó fún àwọn ẹ̀dá ẹ̀mí
  choice: A lo ‘àwọn alákòóso’ àti ‘àwọn agbára’ nínú ẹsẹ pàtàkì.
  alternative: ‘àwọn ìjọba’ àti ‘àwọn agbára ẹ̀mí’
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí àwọn agbára àgbáyé tàbí ti ẹ̀mí, ṣùgbọ́n àwọn ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbígbòòrò. Ìtumọ̀ yìí kò fi ẹ̀kọ́ ìsìn kan pàtó pinnu ohun tí Pọ́ọ̀lù mọ̀ọ́mọ̀ fi sílẹ̀ ní gbígbòòrò.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àtúnṣe ‘kì í ṣe’ pa ìtẹnumọ́ οὔτε mọ́; àmì kọ́mà ní òpin fi hàn pé àtòjọ náà ń tẹ̀ síwájú sí ẹsẹ 39.
