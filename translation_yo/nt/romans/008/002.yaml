id: ROM.8.2
reference: Romans 8:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: yo
  text: Nítorí òfin Ẹ̀mí ìyè nínú Mèsáyà Jésù ti dá ọ́ sílẹ̀ kúrò nínú òfin ẹ̀ṣẹ̀ àti ikú.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “ìlànà”: “ìlànà Ẹ̀mí ìyè.”'
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní “mi” dípò “ọ́.”
    reason: textual_variant
  - marker: c
    text: 'Ìtumọ̀ tí a sábà máa ń lò ni: “nínú Kristi Jésù.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: òfin
  rationale: A lo “òfin” ní ibi méjèèjì láti pa àtúnlò ọ̀rọ̀ Pọ́ọ̀lù àti ìfíwéra rẹ̀ mọ́; “ìlànà” jẹ́ ìtumọ̀ mìíràn tó ṣeé ṣe, ṣùgbọ́n ó lè dín ìtumọ̀ náà kù.
- source_word: πνεύματος
  choice: Ẹ̀mí
  rationale: Àyíká Róòmù 8 ń tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tó ń fúnni ní ìyè; a fi lẹ́tà ńlá bẹ̀rẹ̀ ọ̀rọ̀ náà láti fi èyí hàn.
- source_word: ζωῆς
  choice: ìyè
  rationale: “Ìyè” ni ìtumọ̀ tààrà, ó sì pa gbólóhùn náà mọ́ láìfi àlàyé kún un.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa èdè Pọ́ọ̀lù nípa ìṣọ̀kan pẹ̀lú Mèsáyà mọ́; “Mèsáyà” sì mú Χριστός jáde gẹ́gẹ́ bí oyè.
- source_word: ἠλευθέρωσέν
  choice: ti sọ ... di òmìnira
  rationale: Ọ̀rọ̀ yìí sọ ìṣe kan tó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì ń bá a lọ; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì mú èrò ìdásílẹ̀ jáde.
- source_word: σε
  choice: ọ́
  rationale: A tẹ̀ lé kíkà ẹni kejì ẹyọ kan σε nínú SBLGNT; kíkà “mi” wà nínú àwọn àfọwọ́kọ kan, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- source_word: ἁμαρτίας
  choice: ẹ̀ṣẹ̀
  rationale: Ìtumọ̀ Yorùbá tó bójú mu ni; ó lè tọ́ka sí ẹ̀ṣẹ̀ gẹ́gẹ́ bí ipá tó ń sọni di ẹrú àti gẹ́gẹ́ bí ohun àìtọ́.
- source_word: θανάτου
  choice: ikú
  rationale: Ìtumọ̀ tààrà ni, a sì pa á mọ́ ní ìsopọ̀ pẹ̀lú “ẹ̀ṣẹ̀.”
theological_decisions:
- issue: Bóyá πνεύματος ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí ènìyàn/ìlànà tẹ̀mí
  choice: Ẹ̀mí Mímọ́ (“Ẹ̀mí” pẹ̀lú lẹ́tà ńlá)
  alternative: ẹ̀mí ènìyàn tàbí ìlànà tẹ̀mí
  rationale: Nínú Róòmù 8, ìyàtọ̀ láàárín ẹran ara, ẹ̀ṣẹ̀, ikú àti Ẹ̀mí Ọlọ́run tó ń fúnni ní ìyè ń fi hàn pé Ẹ̀mí Mímọ́ ni ọ̀rọ̀ náà ń tọ́ka sí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. “Kúrò lábẹ́ òfin” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdásílẹ̀ kúrò ní ìkáwọ́ òfin, láìpa àtúnlò νόμος run. Gbogbo àmì àlàyé ìsàlẹ̀ wà nínú ọ̀rọ̀ pàtàkì.
