id: ROM.8.35
reference: Romans 8:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: yo
  text: Ta ni yóò yà wá kúrò nínú ìfẹ́ tí Mèsáyà ní sí wa? Ṣé ìpọ́njú ni, tàbí ìdààmú, tàbí inúnibíni, tàbí ìyàn, tàbí ìhòòhò, tàbí ewu, tàbí idà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kúrò nínú ìfẹ́ wa sí Mèsáyà.” Ìlò ìní nínú èdè Gíríìkì lè túmọ̀ sí bẹ́ẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà tẹ̀ sí “ìfẹ́ tí Mèsáyà ní sí wa.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Ta ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbéèrè yìí túmọ̀ sí “ta ni”; ó sì pa ìbéèrè àsọyé Pọ́ọ̀lù mọ́, bó tilẹ̀ jẹ́ pé àwọn ohun tí ó tẹ̀ lé e kì í ṣe ènìyàn.
- source_word: χωρίσει
  choice: yóò yà wá kúrò
  rationale: Ó fi ìṣe ọjọ́ iwájú tàbí ohun tí ó ṣeé ṣe hàn, “yà ... kúrò” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìpínyà kúrò lọ́dọ̀ ohun kan.
- source_word: ἀγάπης τοῦ Χριστοῦ
  choice: ìfẹ́ tí Mèsáyà ní sí wa
  rationale: Àyíká Róòmù 8:31–39 tẹ̀ sí ìfẹ́ Mèsáyà fún àwọn onígbàgbọ́; gbólóhùn yìí mú ìtumọ̀ pàtàkì náà ṣe kedere ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: θλῖψις
  choice: ìpọ́njú
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ní agbára tó yẹ fún ìnira tàbí ìyà tí ń tẹ ènìyàn mọ́lẹ̀.
- source_word: στενοχωρία
  choice: ìdààmú
  rationale: Ó sọ ipò híhá àti ìrora ọkàn ní èdè Yorùbá òde òní, ó sì yà díẹ̀ sí “ìpọ́njú.”
- source_word: διωγμός
  choice: inúnibíni
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó péye fún lílépa tàbí ṣíṣe ènìyàn ní ibi nítorí ohun tí ó gbà gbọ́.
- source_word: λιμός
  choice: ìyàn
  rationale: Ó túmọ̀ sí àìsí oúnjẹ tó le koko, kì í ṣe ebi ara lásán.
- source_word: γυμνότης
  choice: ìhòòhò
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún àìní aṣọ, ó sì pa agbára àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κίνδυνος
  choice: ewu
  rationale: Ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ipò tí ìpalára lè ti dé.
- source_word: μάχαιρα
  choice: idà
  rationale: Ìtumọ̀ tààrà yìí pa àwòrán ohun ìjà àti ewu ikú oníwà ipá mọ́.
theological_decisions:
- issue: Ipa ẹ̀ka ìní nínú τοῦ Χριστοῦ
  choice: ìfẹ́ tí Mèsáyà ní sí wa
  alternative: ìfẹ́ wa sí Mèsáyà
  rationale: Ẹ̀ka ìní Gíríìkì lè tọ́ka sí Mèsáyà gẹ́gẹ́ bí ẹni tó nífẹ̀ẹ́ tàbí gẹ́gẹ́ bí ẹni tí a nífẹ̀ẹ́. Àyíká ẹsẹ 31–39 ṣe àtìlẹ́yìn tó lágbára fún ìfẹ́ Mèsáyà sí wa, ṣùgbọ́n a pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá tí ó ṣe kedere, tí ó ní iyì, tí àwọn òǹkàwé òde òní sì lè lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti bá èdè àdánidá mu; “Mèsáyà” pa Χριστός mọ́ gẹ́gẹ́ bí oyè.
