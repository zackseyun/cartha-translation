  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n nínú gbogbo nǹkan wọ̀nyí, a ń borí pátápátá[a] nípasẹ̀ ẹni tí ó ti fẹ́ràn wa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ju àwọn aṣégun lọ.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, ó ṣeé ṣe kí ó jẹ́ Kristi ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ tó sún mọ́ ọn.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn sí àwọn ìpọ́njú àti ewu tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ ọ̀rọ̀ àtakò tí ó bójú mu ní Yorùbá.
- source_word: ἐν τούτοις πᾶσιν
  choice: nínú gbogbo nǹkan wọ̀nyí
  rationale: Ó tẹ̀ lé ìrísí gbólóhùn Gíríìkì, ó sì so ẹsẹ yìí mọ́ gbogbo ìpọ́njú tí a tò lẹ́sẹ̀sẹ̀ ní ẹsẹ tí ó ṣáájú.
- source_word: ὑπερνικῶμεν
  choice: a ń borí pátápátá
  rationale: Ọ̀rọ̀-ìṣe náà mú ìtumọ̀ ‘ṣẹ́gun’ lágbára. ‘Borí pátápátá’ jẹ́ Yorùbá àdánidá tí ó fi ìṣẹ́gun tí ó péye àti tí ó lágbára hàn, láìyí ọ̀rọ̀-ìṣe náà sí orúkọ.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀ tí ó tẹ̀ lé e, ó tọ́ka sí ẹni tí ó jẹ́ ọ̀nà tàbí agbára tí ìṣẹ́gun náà fi wá.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: ẹni tí ó fẹ́ràn wa
  rationale: Ó pa ìrísí alábápín tí a lò gẹ́gẹ́ bí orúkọ mọ́, kò sì fi orúkọ ẹni náà kún ohun tí Gíríìkì sọ ní tààrà.
- source_word: ἀγαπήσαντος
  choice: fẹ́ràn
  rationale: ‘Fẹ́ràn’ ni ọ̀rọ̀ Yorùbá àdánidá fún ἀγαπάω. Nínú gbólóhùn ìbátan yìí, ó lè tọ́ka sí ìfẹ́ tí a ti fi hàn láìfi àlàyé àkókò tí kò ṣe pàtàkì kún un.
theological_decisions:
- issue: Ta ni ‘ẹni tí ó fẹ́ràn wa’ ń tọ́ka sí?
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘ẹni tí ó fẹ́ràn wa’ nínú àyọkà pàtàkì.
  alternative: Kí a sọ ní tààrà pé Kristi ni.
  rationale: Àyíká ọ̀rọ̀ tó sún mọ́ ọn jù lọ fi Kristi hàn gẹ́gẹ́ bí ẹni tí ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí, ṣùgbọ́n Gíríìkì kò dárúkọ rẹ̀ nínú ẹsẹ yìí. Ìtumọ̀ náà pa àìsọ orúkọ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. ‘A ń borí pátápátá’ jẹ́ kedere fún òǹkàwé lásán, ó sì pa agbára ọ̀rọ̀-ìṣe Gíríìkì mọ́.
