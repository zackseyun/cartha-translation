  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: yo
  text: Ǹjẹ́ kí ni àwa yóò wí nípa àwọn nǹkan wọ̀nyí?[a] Bí Ọlọ́run bá wà fún wa,[b] ta ni ó lòdì sí wa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ni àwa yóò wí sí àwọn nǹkan wọ̀nyí?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Níwọ̀n bí Ọlọ́run ti wà fún wa, ta ni ó lòdì sí wa?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Ǹjẹ́ kí ni àwa yóò wí
  rationale: Ó mú ìbéèrè ìrònú tí ó ń fa ìparí ọ̀rọ̀ jáde hàn; “Ǹjẹ́” ń so ẹsẹ̀ náà mọ́ àríyànjiyàn tí ó ṣáájú, “kí ni ... yóò wí” sì jẹ́ ọ̀nà Yorùbá àdánidá fún deliberative future.
- source_word: πρὸς ταῦτα
  choice: nípa àwọn nǹkan wọ̀nyí
  rationale: Ní àyíká yìí, πρός tọ́ka sí ohun tí ọ̀rọ̀ náà ń dáhùn sí tàbí ń tọ́ka sí. “Nípa” jẹ́ mímọ́ àti àdánidá ní Yorùbá, láì pàdánù ìtọ́kasí sí ohun tí ó ṣáájú.
- source_word: εἰ
  choice: Bí ... bá
  rationale: Ó pa ìrísí gbólóhùn oníṣòro Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé àyíká fi hàn pé Pọ́ọ̀lù ka òtítọ́ rẹ̀ sí ohun tí ó dájú.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédéé fún θεός nínú àyíká yìí.
- source_word: ὑπὲρ ἡμῶν
  choice: wà fún wa
  rationale: Ó sọ ìtìlẹ́yìn àti ìdúró ní ìhà tiwa tí ὑπέρ túmọ̀ sí níbí, ní ọ̀nà tí ó rọrùn fún òǹkàwé Yorùbá.
- source_word: τίς καθ’ ἡμῶν
  choice: ta ni ó lè dojú kọ wa
  rationale: '“Ta ni” pa ìbéèrè ẹni mọ́; “dojú kọ wa” sọ ìtakò κατά pẹ̀lú genitive ní Yorùbá àdánidá. “Lè” mú agbára ìbéèrè àsọyé náà hàn: kì í ṣe pé kò sí alatako rárá, ṣùgbọ́n kò sí ẹni tí ìtakò rẹ̀ lè borí ète Ọlọ́run.'
theological_decisions:
- issue: Agbára gbólóhùn εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: “Bí Ọlọ́run bá wà fún wa” nínú ọ̀rọ̀ pàtàkì
  alternative: “Níwọ̀n bí Ọlọ́run ti wà fún wa”
  rationale: “Bí ... bá” pa ìrísí εἰ mọ́ àti ìgbésẹ̀ ìbéèrè àsọyé Pọ́ọ̀lù. Àyíká fi hàn pé kò ń ṣiyèméjì nípa ìdúró Ọlọ́run fún àwọn tirẹ̀; àlàyé ìsàlẹ̀ sọ agbára yìí di mímọ́.
- issue: Ìtumọ̀ ìbéèrè τίς καθ’ ἡμῶν
  choice: “ta ni ó lè dojú kọ wa?”
  alternative: “ta ni ó lòdì sí wa?”
  rationale: Àṣàyàn pàtàkì kò kọ́ pé àwọn alatako lè wà; ó mú ìpèníjà ìṣẹ́gun inú ọ̀rọ̀ náà hàn, pé kò sí alatako tí yóò lè borí ìtìlẹ́yìn Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. A lo “àwa” láti mú ẹni púpọ̀ ἡμῶν hàn kedere, àti “dojú kọ” gẹ́gẹ́ bí ọ̀rọ̀ ìtakò tí ó wọ́pọ̀.
