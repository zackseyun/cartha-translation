id: ROM.8.20
reference: Romans 8:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: yo
  text: Nítorí a fi ìṣẹ̀dá sábẹ́ asán[a], kì í ṣe lọ́kàn ara rẹ̀, ṣùgbọ́n nítorí ẹni tí ó fi í sábẹ́[b], pẹ̀lú ìrètí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àìléso” tàbí “ìjákulẹ̀,” dípò “asán.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì kò sọ ní kedere ẹni tí “ó fi í sábẹ́.”
    reason: alternative_reading
  - marker: c
    text: Tàbí “nínú ìrètí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: asán
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ipò tí ìṣẹ̀dá kò ti lè dé ète rẹ̀, kì í ṣe sí ìwà búburú. “Asán” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè gba ìtumọ̀ ìjákulẹ̀ àti àìléso.
- source_word: κτίσις
  choice: ìṣẹ̀dá
  rationale: Nínú àyíká Róòmù 8:19–22, ọ̀rọ̀ náà ń tọ́ka sí gbogbo ohun tí a dá lápapọ̀, pàápàá jù lọ ayé ẹ̀dá tí kì í ṣe ènìyàn, kì í ṣe sí ẹ̀dá kan ṣoṣo.
- source_word: ὑπετάγη
  choice: a fi ... sábẹ́
  rationale: Ìṣe àìṣe-taara inú Gíríìkì fi hàn pé agbára mìíràn ló mú kí ìṣẹ̀dá wà lábẹ́ ipò yìí. “A fi ... sábẹ́” jẹ́ ọ̀nà àdánidá láti pa agbára ìṣe náà mọ́ ní Yorùbá.
- source_word: οὐχ ἑκοῦσα
  choice: kì í ṣe nípa ìfẹ́ tirẹ̀
  rationale: Èyí sọ ní kedere pé ìṣẹ̀dá kò fi ìfẹ́ ara rẹ̀ yan ipò náà, ó sì pa ìyàtọ̀ tó wà láàárín ìṣẹ̀dá àti ẹni tó fi í sábẹ́ mọ́.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: nítorí ẹni tí ó fi í sábẹ́
  rationale: διά pẹ̀lú accusative níhìn-ín dára jù láti lóye gẹ́gẹ́ bí ohun tó fa ìṣẹ̀lẹ̀ náà. A kò dárúkọ ẹni náà, gẹ́gẹ́ bí Gíríìkì náà kò ti ṣe.
- source_word: ἐφ’ ἑλπίδι
  choice: pẹ̀lú ìrètí
  rationale: Gbólóhùn kúkúrú yìí ń tọ́ka sí ìrètí tó bá ìfísábẹ́ náà lọ. “Pẹ̀lú ìrètí” jẹ́ Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi “nínú ìrètí” hàn gẹ́gẹ́ bí òmíràn.
theological_decisions:
- issue: Ta ni “ẹni tí ó fi” ìṣẹ̀dá sábẹ́?
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “ẹni tí ó fi í sábẹ́,” láìdárúkọ ẹni náà.
  alternative: A lè túmọ̀ ẹni náà sí Ọlọ́run; àwọn kan sì lè so ìfísábẹ́ náà mọ́ ìṣubú Ádámù, tàbí kí wọ́n dábàá Sátánì.
  rationale: Gíríìkì kò dárúkọ ẹni náà ní kedere. Ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú àti ìfọ̀kànsìn ẹ̀kọ́ ìgbàgbọ́ yìí mọ́, dípò kíkó ìtumọ̀ kan wọ inú ọ̀rọ̀ pàtàkì.
- issue: Ìbáṣepọ̀ ἐφ’ ἑλπίδι pẹ̀lú gbólóhùn náà
  choice: “Pẹ̀lú ìrètí,” tó so ìrètí mọ́ ìfísábẹ́ náà láìṣe àlàyé ju ohun tí Gíríìkì sọ lọ.
  alternative: “Nínú ìrètí,” tàbí lílo gbólóhùn náà gẹ́gẹ́ bí ìbẹ̀rẹ̀ ẹsẹ tó tẹ̀ lé.
  rationale: Àtẹ̀jáde SBLGNT fi gbólóhùn náà sí òpin ẹsẹ yìí, ṣùgbọ́n ìbáṣepọ̀ rẹ̀ pẹ̀lú àwọn ọ̀rọ̀ tó yí i ká jẹ́ kúkúrú, ó sì ní ìwọ̀n àìdánilójú kan. Ìtumọ̀ náà pa ìrètí náà mọ́ láìfẹ̀ ẹ̀kọ́ kan lé e lórí.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “A fi ... sábẹ́” pa ìṣe àìṣe-taara Gíríìkì mọ́ lọ́nà àdánidá; “kì í ṣe nípa ìfẹ́ tirẹ̀” sì yàgò fún ọ̀rọ̀ líle tàbí àtijọ́.
