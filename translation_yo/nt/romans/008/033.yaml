  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: yo
  text: Ta ni yóò fẹ̀sùn kan àwọn tí Ọlọ́run yàn[a]? Ọlọ́run ni ẹni tí ń dá wọn láre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “àwọn àyànfẹ́ Ọlọ́run.”'
    reason: lexical_alternative
  - marker: b
    text: '“Dá wọn láre” ní ìtumọ̀ ilé-ẹjọ́ níbí: Ọlọ́run ni ẹni tí ń polongo pé wọ́n jẹ́ olódodo.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Ta ni
  rationale: Ó gbé ìbéèrè àsọ àsọyé Pọ́ọ̀lù jáde ní Yorùbá àdánidá.
- source_word: ἐγκαλέσει
  choice: yóò fẹ̀sùn kan
  rationale: 'Ó pa ìtumọ̀ ọ̀rọ̀ ilé-ẹjọ́ mọ́: gbígbé ẹ̀sùn tàbí fífi ẹ̀sùn kan ẹnì kan.'
- source_word: κατὰ ἐκλεκτῶν θεοῦ
  choice: kan àwọn tí Ọlọ́run yàn
  rationale: Ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì fi àwọn tí Ọlọ́run yàn hàn láìlo ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ó lè ní ìtumọ̀ àfikún.
- source_word: θεὸς ὁ δικαιῶν
  choice: Ọlọ́run ni ẹni tí ń dá wọn láre
  rationale: Ó pa ìtẹnumọ́ sí Ọlọ́run mọ́, ó sì lo ọ̀rọ̀ ilé-ẹjọ́ Yorùbá fún pípolongo pé ẹni kan jẹ́ olódodo tàbí kò jẹ̀bi.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἐκλεκτῶν láìfi ètò ẹ̀kọ́ ìgbàgbọ́ ọjọ́ iwájú kún un
  choice: àwọn tí Ọlọ́run yàn
  alternative: àwọn àyànfẹ́ Ọlọ́run
  rationale: Ó sọ ìṣe yíyan Ọlọ́run ní tààrà, ó sì yẹra fún lílo ọ̀rọ̀ tí a lè kà sí àmì ètò ẹ̀kọ́ ìgbàgbọ́ pàtó.
- issue: Ìtumọ̀ ìlànà θεὸς ὁ δικαιῶν
  choice: Ọlọ́run ni ẹni tí ń dá wọn láre
  alternative: Ọlọ́run ni ó ń sọ pé wọ́n jẹ́ olódodo
  rationale: Ìtumọ̀ tí a yàn pa ìtẹnumọ́ àti àyíká ilé-ẹjọ́ mọ́. Ọ̀rọ̀ arọ́pò-orúkọ “wọn” jẹ́ àfikún èdè Yorùbá tó tọ́ka sí àwọn tí Ọlọ́run yàn, kì í ṣe ìyípadà ẹni tí gbolohun náà ń sọ̀rọ̀ nípa rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. “Fẹ̀sùn kan” àti “dá wọn láre” pa àwòrán ilé-ẹjọ́ inú Gíríìkì mọ́; ìtẹnumọ́ “Ọlọ́run ni” fara mọ́ ìṣètò θεὸς ὁ δικαιῶν.
