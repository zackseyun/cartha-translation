  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ìṣẹ̀dá gẹ́gẹ́ bí ohun tí a óò tú sílẹ̀ ní ọjọ́ iwájú, ó sì pa ìtẹnumọ́ ‘fúnra rẹ̀’ àti ìlọsíwájú ‘sínú òmìnira’ mọ́. Ṣùgbọ́n ‘ìsìnrú fún ìbàjẹ́’ lè dà bí ìsìnrú tí ó wà fún ète ìbàjẹ́, dípò ìsìnrú tí ìbàjẹ́ jẹ́ olúwa/tabi ipò rẹ̀. ‘Ìsìnrú ìbàjẹ́’ sún mọ́ genitive Gíríìkì náà ju.
