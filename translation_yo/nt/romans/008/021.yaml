id: ROM.8.21
reference: Romans 8:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: yo
  text: Nítorí pé a ó tú ìṣẹ̀dá fúnra rẹ̀ náà sílẹ̀ kúrò nínú ìsìnrú ìbàjẹ́, sínú òmìnira ògo àwọn ọmọ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí pé, “sínú òmìnira ológo ti àwọn ọmọ Ọlọ́run.”
    reason: Ó fi ìtumọ̀ àdánidá mìíràn hàn, níbi tí ‘ògo’ ti ń ṣàpèjúwe irú òmìnira náà.
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí pé
  rationale: Ó ṣe àlàyé ìdí ìrètí tí a mẹ́nu kàn ṣáájú, ó sì bá ìtumọ̀ causal ti ὅτι mu.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: ìṣẹ̀dá fúnra rẹ̀ pẹ̀lú
  rationale: “Fúnra rẹ̀” pa ìtẹnumọ́ αὐτή mọ́, “pẹ̀lú” sì fi agbára àfikún καί hàn; “ìṣẹ̀dá” ń tọ́ka sí gbogbo ètò ohun tí a dá.
- source_word: ἐλευθερωθήσεται
  choice: a ó dá ... sílẹ̀
  rationale: Ìsọ̀rọ̀ aláìlórúkọ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìṣe ọjọ́ iwájú tí ẹni mìíràn yóò ṣe sí ìṣẹ̀dá mọ́, láìfi ẹni tí yóò ṣe é kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: kúrò nínú ìsìnrú fún ìbàjẹ́
  rationale: “Ìsìnrú” pa àwòrán ipò ẹrú mọ́; “ìbàjẹ́” ní àyíká yìí túmọ̀ sí díbàjẹ́ àti píparun ju ìwà búburú lọ, “fún” sì fi ohun tí ìṣẹ̀dá wà ní ìsìnrú fún hàn.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: sínú òmìnira
  rationale: “Sínú” pa ìrìn láti ipò kan wọ ipò tuntun tí εἰς ń fi hàn mọ́.
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: ògo àwọn ọmọ Ọlọ́run
  rationale: Ó pa ìtẹ̀lé àwọn ọ̀rọ̀ genitive mọ́ láìsọ ní pàtó bóyá ògo náà ń ṣàpèjúwe òmìnira tàbí ó jẹ́ ohun tí àwọn ọmọ Ọlọ́run ní.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: òmìnira ògo àwọn ọmọ Ọlọ́run
  alternative: òmìnira ológo ti àwọn ọmọ Ọlọ́run
  rationale: Àṣàyàn pàtàkì pa ìsopọ̀ genitive Gíríìkì àti àìdánilójú rẹ̀ mọ́; kò yí “ògo” padà sí àpèjúwe “ológo” ní ọ̀nà tí yóò ti túmọ̀ ìbáṣepọ̀ náà fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo “ìṣẹ̀dá” gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ fún gbogbo ètò ohun tí a dá, a sì pa àwòrán ìsìnrú àti ìwọlé sínú òmìnira mọ́.
