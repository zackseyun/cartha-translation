revisions:
- from: Nítorí pé a ó dá ìṣẹ̀dá fúnra rẹ̀ pẹ̀lú sílẹ̀ kúrò nínú ìsìnrú fún ìbàjẹ́, sínú òmìnira ògo àwọn ọmọ Ọlọ́run.[a]
  to: Nítorí pé a ó tú ìṣẹ̀dá fúnra rẹ̀ náà sílẹ̀ kúrò nínú ìsìnrú ìbàjẹ́, sínú òmìnira ògo àwọn ọmọ Ọlọ́run.[a]
  rationale: A rọ́pò ‘fún ìbàjẹ́’ pẹ̀lú ‘ìbàjẹ́’ nínú ìsopọ̀ genitive kí ìsìnrú náà lè jẹ́ ti ìbàjẹ́, gẹ́gẹ́ bí τῆς δουλείας τῆς φθορᾶς, kì í ṣe ìsìnrú fún ète ìbàjẹ́. A tún lo ‘tú ... sílẹ̀’ àti ‘náà’ fún ìsọ̀rọ̀ Yorùbá tó rọrùn. Ìtumọ̀ ‘òmìnira ògo àwọn ọmọ Ọlọ́run’ àti àlàyé ẹsẹ̀-isàlẹ̀ rẹ̀ ni a pa mọ́ nítorí wọ́n ṣetọju àìdánilójú genitive ti orísun.
