id: ROM.8.32
reference: Romans 8:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: yo
  text: Ẹni tí kò tilẹ̀ dá Ọmọ tirẹ̀ sí, ṣùgbọ́n tí ó fi í lé àwọn mìíràn lọ́wọ́ nítorí gbogbo wa[a]—báwo ni kì yóò ṣe tún fi gbogbo ohun fún wa ní ọ̀fẹ́ pẹ̀lú rẹ̀?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘fún gbogbo wa’ tàbí ‘nítorí àǹfààní gbogbo wa.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὅς γε
  choice: Ẹni tí
  rationale: Ó tọ́ka padà sí Ọlọ́run nínú ọ̀rọ̀ tó ṣáájú. Ìṣọ̀kan ‘Ẹni tí’ so ẹsẹ yìí mọ́ àyíká rẹ̀ lọ́nà àdánidá; agbára ìtẹnumọ́ γε wà nínú gbogbo gbólóhùn náà láìfi ọ̀rọ̀ àfikún tí yóò wuwo sí i.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: Ọmọ tirẹ̀
  rationale: ‘Tirẹ̀’ mú ìtẹnumọ́ ἰδίου àti ìbátan tímọ́tímọ́ náà hàn; ‘Ọmọ’ jẹ́ akọlé fún Jésù nínú àyíká yìí.
- source_word: οὐκ ἐφείσατο
  choice: kò dá … sí
  rationale: Ọ̀rọ̀ Yorùbá ‘dá ẹni sí’ túmọ̀ sí láti yọ ẹni sílẹ̀ tàbí láti kọ̀ láti fi ẹni fún ìjìyà; ó bá φείδομαι mu ní àyíká fífi Ọmọ náà lé wọn lọ́wọ́.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: nítorí gbogbo wa
  rationale: Ó mú ìṣe fún àǹfààní gbogbo wa hàn láìfi ìtumọ̀ ìrọ́pò kan pàtó kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: παρέδωκεν αὐτόν
  choice: fi í lé wọn lọ́wọ́
  rationale: Ó pa ìtumọ̀ fífi ẹni lé àwọn mìíràn lọ́wọ́ fún ìjìyà tàbí ikú mọ́; ‘wọn’ jẹ́ ohun tí èdè Yorùbá nílò láti mú àpólà náà dùn, bó tilẹ̀ jẹ́ pé Gíríìkì kò sọ ẹni tí a fi í lé lọ́wọ́ ní pàtó.
- source_word: πῶς οὐχὶ καὶ
  choice: báwo ni kì yóò ṣe
  rationale: Ó pa ìbéèrè àsọyé àti ìmúlẹ̀ láti ẹ̀bùn ńlá sí àwọn ẹ̀bùn yòókù mọ́.
- source_word: σὺν αὐτῷ
  choice: pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ tààrà àti àdánidá fún σύν; ó pa ìsopọ̀ àwọn ẹ̀bùn náà mọ́ Ọmọ náà mọ́.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìwọ̀n gbòòrò tí Pọ́ọ̀lù lò mọ́ láìdín un sí irú ẹ̀bùn kan pàtó.
- source_word: ἡμῖν χαρίσεται
  choice: fi inú oore-ọ̀fẹ́ fún wa
  rationale: Ó mú ìtumọ̀ fífúnni lọ́fẹ̀ẹ́ àti nípa oore-ọ̀fẹ́ tí χαρίζομαι ní hàn, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Bóyá ὑπὲρ ἡμῶν πάντων yẹ kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ìrọ́pò pàtó
  choice: nítorí gbogbo wa
  alternative: ní ipò gbogbo wa; fún gbogbo wa
  rationale: Ọ̀rọ̀ náà fi ìṣe Ọlọ́run fún àǹfààní gbogbo wa hàn, ó sì lè ní ìró ẹbọ; ṣùgbọ́n a kò mú un le sí ẹ̀kọ́ ìràpadà kan pàtó ju Gíríìkì lọ.
- issue: Ìwọ̀n τὰ πάντα
  choice: ohun gbogbo
  alternative: gbogbo ohun tí a nílò
  rationale: A pa gbólóhùn Pọ́ọ̀lù mọ́ ní fífẹ̀ rẹ̀, a kò sì ṣàlàyé rẹ̀ sí àwọn ohun tẹ̀mí tàbí ti ara nìkan.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá, a sì pa ìbéèrè àsọyé àti ìyàtọ̀ tó wà láàárín ‘kò dá Ọmọ sí’ àti ‘fi í lé wọn lọ́wọ́’ mọ́.
