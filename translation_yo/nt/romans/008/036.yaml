id: ROM.8.36
reference: Romans 8:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: yo
  text: 'Gẹ́gẹ́ bí a ti kọ ọ́ pé:


    “Nítorí rẹ ni a ń pa wá ní gbogbo ọjọ́;

    a kà wá[a] sí àwọn àgùntàn fún pípa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a wò wá bí àwọn àgùntàn fún pípa.”
    reason: Àtúnṣe ọ̀rọ̀ míì fún ἐλογίσθημεν, èyí tí ó lè túmọ̀ sí pé a kà wá tàbí a wò wá ní irú ọ̀nà bẹ́ẹ̀.
lexical_decisions:
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó mú ìtumọ̀ ìfiwé tí ó ń ṣáájú àyọlò Ìwé Mímọ́ jáde ní Yorùbá àdánidá.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ìṣe àìlórúkọ yìí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ọ̀rọ̀ ìṣáájú Ìwé Mímọ́, ó sì pa ìtumọ̀ ohun tí a kọ tí ó ṣì dúró mọ́.
- source_word: Ἕνεκεν σοῦ
  choice: Nítorí tìrẹ
  rationale: Ó túmọ̀ sí “nítorí rẹ” tàbí “fún ọ̀ràn rẹ,” ó sì pa ọ̀rọ̀ tí a ń bá Ọlọ́run sọ tààrà mọ́.
- source_word: θανατούμεθα
  choice: a ń pa wá
  rationale: Àmì “ń” fi hàn pé ìṣe náà ń bá a lọ, ìṣẹ̀dá gbólóhùn náà sì pa ohùn aláìṣe ti Gíríìkì mọ́.
- source_word: ὅλην τὴν ἡμέραν
  choice: ní gbogbo ọjọ́
  rationale: Ọ̀rọ̀ Yorùbá yìí lè sọ ìgbà tí ó gba gbogbo ọjọ́, ó sì bá ìlò ewì inú Sáàmù mu.
- source_word: ἐλογίσθημεν
  choice: a kà wá
  rationale: Ó pa èrò kíkà tàbí gbígbà pé ohun kan rí ní ọ̀nà kan mọ́, láìfi àlàyé míì kún un.
- source_word: ὡς
  choice: sí bí
  rationale: Nínú àkópọ̀ “kà ... sí bí,” ó ṣe àfihàn ìfiwé náà ní Yorùbá tó ṣeé lóye.
- source_word: πρόβατα σφαγῆς
  choice: àwọn àgùntàn tí a ó pa
  rationale: Ó sọ àwòrán àwọn àgùntàn tí a pèsè fún pípa ní ọ̀nà Yorùbá àdánidá, láìṣàfikún ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
theological_decisions:
- issue: Àyọlò Sáàmù 44:22 ní àyíká ìjìyà
  choice: 'Pa ohùn àpapọ̀ àti ìjìyà tí ó ń bá a lọ mọ́: “a ń pa wá.”'
  alternative: Túmọ̀ rẹ̀ ní ọ̀nà tí yóò fi tọ́ka sí ikú ajẹ́rìíkú nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì kò fi ìjìyà náà mọ́ ikú ajẹ́rìíkú nìkan; nítorí náà, a kò dín ìtumọ̀ rẹ̀ kù sí ẹ̀kọ́ pàtó kan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ìlà ewì fún àyọlò Sáàmù, pẹ̀lú àmì ohùn níbi tí ó bá yẹ.
