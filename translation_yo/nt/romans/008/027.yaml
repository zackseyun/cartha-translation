id: ROM.8.27
reference: Romans 8:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: yo
  text: Ẹni tí ń yẹ àwọn ọkàn wò sì mọ ohun tí èrò inú Ẹ̀mí jẹ́, nítorí Ẹ̀mí ń bẹ̀bẹ̀ fún àwọn ẹni mímọ́ ní ìbámu pẹ̀lú Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìbámu pẹ̀lú ìfẹ́ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: ń yẹ … wò
  rationale: Ọ̀rọ̀ yìí fi ìwádìí jíjinlẹ̀ hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ń ṣàyẹ̀wò ohun kan dáadáa.
- source_word: καρδίας
  choice: àwọn ọkàn
  rationale: Èyí pa àwòrán inú ọ̀rọ̀ Gíríìkì àti ìṣúpò rẹ̀ mọ́, láì túmọ̀ ọ́ sí ‘èrò inú’ tàbí ‘ọkàn àti èrò.’
- source_word: τί τὸ φρόνημα
  choice: ohun tí èrò inú … jẹ́
  rationale: ‘Èrò inú’ mú ìtumọ̀ ìrònú, ìfojúsùn, tàbí ìtẹ̀sí inú φρόνημα jáde ní Yorùbá àdánidá, láì dín un kù sí òye lásán.
- source_word: τοῦ πνεύματος
  choice: Ẹ̀mí
  rationale: Àyíká Róòmù 8 ń tọ́ka sí Ẹ̀mí Mímọ́, kì í ṣe ẹ̀mí ènìyàn.
- source_word: ἐντυγχάνει
  choice: ń bẹ̀bẹ̀ fún
  rationale: Nínú àyíká àdúrà yìí, gbólóhùn náà túmọ̀ sí fífi ẹ̀bẹ̀ ṣe fún ẹlòmíràn.
- source_word: ὑπὲρ ἁγίων
  choice: fún àwọn ẹni mímọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé Ẹ̀mí ń ṣe ìkẹ́bẹ̀ nítorí àwọn tí a yà sí mímọ́ fún Ọlọ́run.
- source_word: κατὰ θεὸν
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  rationale: Èyí tẹ̀ lé gbólóhùn Gíríìkì tó ní ‘gẹ́gẹ́ bí Ọlọ́run’ tàbí ‘ní ìbámu pẹ̀lú Ọlọ́run,’ láì fi ọ̀rọ̀ ‘ìfẹ́’ kún ẹsẹ̀ pàtàkì.
theological_decisions:
- issue: Bóyá kí κατὰ θεὸν di ‘ní ìbámu pẹ̀lú ìfẹ́ Ọlọ́run’ ní tààràtà
  choice: ní ìbámu pẹ̀lú Ọlọ́run
  alternative: ní ìbámu pẹ̀lú ìfẹ́ Ọlọ́run
  rationale: Ó ṣeé ṣe kí ìtumọ̀ náà ní ìfẹ́ Ọlọ́run nínú, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò mẹ́nu kan ‘ìfẹ́.’ Ẹsẹ̀ pàtàkì pa ìsọ̀rọ̀ kúkúrú àti àìdánilójú tó wà nínú orísun mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ sì fúnni ní ìtumọ̀ míì tó wọ́pọ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. ‘Ń yẹ àwọn ọkàn wò’ àti ‘èrò inú Ẹ̀mí’ pa àwòrán orísun mọ́ ní ọ̀nà tí òǹkàwé Yorùbá lè lóye; a sì lo àmì ohùn ní kíkún níbi tó bá yẹ.
