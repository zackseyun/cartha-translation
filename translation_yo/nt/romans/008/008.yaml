id: ROM.8.8
reference: Romans 8:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν σαρκὶ ὄντες θεῷ ἀρέσαι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: yo
  text: Àwọn tí ó wà nínú ara kò lè tẹ́ Ọlọ́run lọ́rùn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “nínú ìwà ẹ̀ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà ní “nínú ara,” ọ̀rọ̀ pàtàkì kan tí Paulu lò nínú àyíká ọ̀rọ̀ yìí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: Àwọn tí ó wà
  rationale: Àpilẹ̀kọ pẹ̀lú participle yìí ń tọ́ka sí ẹgbẹ́ àwọn ènìyàn tí ipò kan ń bá a lọ; ‘Àwọn tí ó wà’ jẹ́ ọ̀nà Yorùbá tí ó ṣe déédé, tí ó sì pa ìtumọ̀ ipò ìsinsìnyí mọ́.
- source_word: δὲ
  choice: —
  rationale: Ọ̀rọ̀ àsopọ̀ náà ń bá ìyàtọ̀ inú ọ̀rọ̀ tó ṣáájú lọ, ṣùgbọ́n gbolohun náà ṣe déédé ní Yorùbá láìfi àsopọ̀ kan kún un; àyíká ọ̀rọ̀ ṣì mú ìyàtọ̀ náà hàn.
- source_word: ἐν σαρκὶ
  choice: nínú ẹran ara
  rationale: σάρξ jẹ́ ọ̀rọ̀ pàtàkì nínú ìrònú Paulu ní Róòmù 8. Ìtumọ̀ yìí pa àwòrán àti ìsopọ̀ ọ̀rọ̀ náà mọ́, láìfi ìtumọ̀ àlàyé bí ‘ìwà ẹ̀ṣẹ̀’ rọ́pò rẹ̀ nínú ẹsẹ̀.
- source_word: θεῷ ἀρέσαι
  choice: ṣe ohun tí ó wu Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ‘mú inú Ọlọ́run dùn’ tàbí ‘jẹ́ ẹni tí ó tẹ́ Ọlọ́run lọ́rùn’; ó fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ìṣe náà ní í ṣe pẹ̀lú.
- source_word: οὐ δύνανται
  choice: kò lè
  rationale: ‘Kò lè’ jẹ́ ọ̀nà Yorùbá ṣókí, tí ó sì ṣe déédé fún àìní agbára tí ọ̀rọ̀ Gíríìkì náà sọ.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú àyíká ọ̀rọ̀ Paulu tí a ń jiyàn lé lórí
  choice: nínú ẹran ara
  alternative: nínú ìwà ẹ̀ṣẹ̀; lábẹ́ agbára ẹran ara
  rationale: A pa ọ̀rọ̀ àwòrán Paulu mọ́ nínú ẹsẹ̀, kí a má bàa pinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo níbi tí ọ̀rọ̀ náà ní ìwọ̀n ìtumọ̀ tó jinlẹ̀. Àlàyé ìtumọ̀ míì wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lò ‘ṣe ohun tí ó wu Ọlọ́run’ gẹ́gẹ́ bí ọ̀nà àdánidá ju títú ‘ἀρέσαι’ sílẹ̀ lọ́rọ̀-ọ̀rọ̀; a sì pa ‘ẹran ara’ mọ́ láti dáàbò bo ọ̀rọ̀ pàtàkì Paulu àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wà nínú rẹ̀.
