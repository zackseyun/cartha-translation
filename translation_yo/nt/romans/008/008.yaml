revisions:
- from: Àwọn tí ó wà nínú ẹran ara kò lè ṣe ohun tí ó wu Ọlọ́run[a].
  to: Àwọn tí ó wà nínú ara kò lè tẹ́ Ọlọ́run lọ́rùn[a].
  rationale: The revision corrects the rendering of ἀρέσαι by using the idiomatic Yorùbá expression ‘tẹ́ Ọlọ́run lọ́rùn.’ It replaces the awkward ‘ẹran ara’ with ‘ara,’ retaining the source term’s ambiguity and its Pauline conceptual linkage. The footnote preserves the interpretive alternative without placing it in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:27:38Z'
review_pass:
  verdict: revise
  source_fidelity: Àwọn tí ó wà nínú ara faithfully represents the substantival participle and preserves Paul’s intentionally weighty σάρξ terminology without importing the more interpretive sense of sinful nature. The draft’s ‘ṣe ohun tí ó wu Ọlọ́run’ means ‘do what God wants,’ which is not equivalent to ἀρέσαι (‘please’). ‘Tẹ́ Ọlọ́run lọ́rùn’ accurately renders the infinitive of pleasing with the negated ability.
  naturalness: ‘Nínú ẹran ara’ is awkward and overly corporeal in Standard Yorùbá. ‘Nínú ara’ is the established, natural idiom in biblical Yorùbá and can bear the contextual Pauline sense. ‘Tẹ́ Ọlọ́run lọ́rùn’ is a natural direct expression for pleasing God.
  terminology: Use ara in the main text to retain the lexical and conceptual connection of σάρξ in Romans 8. The footnote may give ‘ìwà ẹ̀ṣẹ̀’ as an interpretive alternative, while explicitly noting that the Greek itself says ‘nínú ara.’
  issues:
  - severity: medium
    issue: The predicate ‘ṣe ohun tí ó wu Ọlọ́run’ is semantically broader than ‘please God.’
    rationale: It denotes doing what God desires, whereas θεῷ ἀρέσαι specifically concerns being pleasing to God.
  - severity: low
    issue: ‘Ẹran ara’ is unnatural and risks specifying physical flesh more strongly than the Greek contextual term requires.
    rationale: ‘Ara’ is the more idiomatic Yorùbá rendering and preserves the source term’s theological openness.
  revised_text: Àwọn tí ó wà nínú ara kò lè tẹ́ Ọlọ́run lọ́rùn[a].
  revised_footnotes:
  - marker: a
    text: 'Tàbí: “nínú ìwà ẹ̀ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà ní “nínú ara,” ọ̀rọ̀ pàtàkì kan tí Paulu lò nínú àyíká ọ̀rọ̀ yìí.'
    reason: lexical_alternative
  revision_rationale: The revision corrects the rendering of ἀρέσαι by using the idiomatic Yorùbá expression ‘tẹ́ Ọlọ́run lọ́rùn.’ It replaces the awkward ‘ẹran ara’ with ‘ara,’ retaining the source term’s ambiguity and its Pauline conceptual linkage. The footnote preserves the interpretive alternative without placing it in the main text.
