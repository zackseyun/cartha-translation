id: ROM.8.5
reference: Romans 8:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: yo
  text: Nítorí àwọn tí ń gbé ní ìbámu pẹ̀lú ẹran ara ń fi ọkàn wọn sí àwọn ohun tí ó jẹ́ ti ẹran ara; ṣùgbọ́n àwọn tí ń gbé ní ìbámu pẹ̀lú Ẹ̀mí ń fi ọkàn wọn sí àwọn ohun tí ó jẹ́ ti Ẹ̀mí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: àwọn tí ń gbé ní ìbámu pẹ̀lú ẹran ara
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí àwọn tí ó wà ‘gẹ́gẹ́ bí ẹran ara,’ ṣùgbọ́n ‘ń gbé ní ìbámu pẹ̀lú’ sọ ìtọ́sọ́nà ìgbésí ayé tí ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ní Yorùbá àdánidá, láì dín ‘ẹran ara’ kù sí ara ènìyàn lásán.
- source_word: φρονοῦσιν
  choice: máa ń gbé ọkàn wọn lé
  rationale: Ó ní ìtumọ̀ fífi èrò, ìfẹ́, àti ìfojúsùn ẹni sí ohun kan; gbólóhùn Yorùbá yìí ju ‘ronú nípa’ lọ, ó sì bá ìtumọ̀ ọ̀rọ̀ náà mu.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Lẹ́tà ńlá fi hàn pé Ẹ̀mí Ọlọ́run ni a ń tọ́ka sí nínú àyíká Róòmù 8, nígbà tí a ṣì pa ọ̀rọ̀ Gíríìkì náà mọ́ gẹ́gẹ́ bí ‘Ẹ̀mí.’
- source_word: τὰ τῆς σαρκὸς / τὰ τοῦ πνεύματος
  choice: àwọn ohun ti ẹran ara / àwọn ohun ti Ẹ̀mí
  rationale: Ìtumọ̀ tó sún mọ́ ìrísí orísun ni èyí, ó sì pa ìfiwéra tó mọ́ láàárín ẹran ara àti Ẹ̀mí mọ́.
theological_decisions:
- issue: Ìtumọ̀ σάρξ (‘ẹran ara’)
  choice: ẹran ara
  alternative: ìwà ẹ̀ṣẹ̀ tàbí ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: ‘Ẹran ara’ pa ààyè ìtumọ̀ àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Pọ́ọ̀lù mọ́; títúmọ̀ rẹ̀ sí ‘ìwà ẹ̀ṣẹ̀’ yóò ti pinnu ìtumọ̀ náà ju ohun tí orísun sọ lọ.
- issue: Ìdánimọ̀ πνεῦμα
  choice: Ẹ̀mí
  alternative: ẹ̀mí ènìyàn
  rationale: Àyíká Róòmù 8 ń tọ́ka sí Ẹ̀mí Ọlọ́run, ṣùgbọ́n a kò fi ọ̀rọ̀ ‘Ọlọ́run’ kún un nítorí kò sí nínú ẹsẹ yìí.
translation_notes:
  register: Yorùbá boṣewa, olóhùn, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ìṣọ̀kan gírámà ‘máa ń’ láti fi ìṣe tàbí ìtẹ̀sí tí ó ń bá a lọ hàn, a sì pa ìfararọ̀ àwọn apá méjèèjì mọ́.
