  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: yo
  text: Nítorí gbogbo àwọn tí Ẹ̀mí Ọlọ́run ń darí, àwọn wọ̀nyí ni àwọn ọmọ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ ‘àwọn ọmọkùnrin Ọlọ́run.’ Nínú àyíká ọ̀rọ̀ yìí, ó kan àwọn ọmọ Ọlọ́run lápapọ̀, ó sì ní ìró ìsọdọmọ àti ẹ̀tọ́ ogún.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: gbogbo àwọn tí
  rationale: Ó fi ìtumọ̀ ẹgbẹ́ gbogbo tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa àlàyé ọ̀rọ̀ náà mọ́, ó sì so ẹsẹ̀ yìí pọ̀ mọ́ àríyànjiyàn tó ṣáájú.
- source_word: πνεύματι θεοῦ
  choice: Ẹ̀mí Ọlọ́run
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘ń darí,’ èyí ń fi dative ohun-èlò hàn ní Yorùbá, ó sì pa gbólóhùn Páùlù ‘Ẹ̀mí Ọlọ́run’ mọ́.
- source_word: ἄγονται
  choice: ń darí
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ lọ́wọ́ hàn; ìṣètò gbólóhùn náà jẹ́ àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo passive.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí ni
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀-atọ́ka Gíríìkì mọ́ láì jẹ́ kí Yorùbá le.
- source_word: υἱοί
  choice: ọmọ
  rationale: ‘Ọmọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè kan akọ àti abo; àlàyé ìsọdọmọ àti ogún tó wà nínú ọ̀rọ̀ Gíríìkì ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Ìkọ́lé Yorùbá ‘Ẹ̀mí Ọlọ́run’ àti ‘ọmọ Ọlọ́run’ fi genitive méjèèjì hàn ní kedere, ó sì pa àtúnwí náà mọ́.
theological_decisions:
- issue: Bóyá kí a túmọ̀ υἱοί θεοῦ pẹ̀lú ọ̀rọ̀ tó túmọ̀ sí ‘àwọn ọmọkùnrin Ọlọ́run’ tàbí ‘àwọn ọmọ Ọlọ́run.’
  choice: ọmọ Ọlọ́run
  alternative: àwọn ọmọkùnrin Ọlọ́run
  rationale: Nínú Yorùbá, ‘ọmọ’ lè gba gbogbo akọ àti abo, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìbáṣepọ̀ ọmọ sí baba. Àlàyé ìsàlẹ̀ pa òtítọ́ mọ́ pé υἱοί jẹ́ ọ̀rọ̀ akọ ní Gíríìkì, tí ó sì ní ìró ìsọdọmọ àti ẹ̀tọ́ ogún nínú àyíká ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún òǹkàwé òde òní.
