source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: yo
  text: 'Nítorí pé nínú ìrètí ni a gbà wá là[a]. Ṣùgbọ́n ìrètí tí a rí kì í ṣe ìrètí[b], nítorí ta ni ó retí ohun tí ó rí?


    [a] Tàbí, “nípasẹ̀ ìrètí ni a gbà wá là.”


    [b] Ìyẹn ni pé, ohun tí a kò tíì rí ni a ń retí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìrètí ni a gbà wá là.”
    reason: alternative_reading
  - marker: b
    text: Ìyẹn ni pé, ohun tí a kò tíì rí ni a ń retí.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: nínú ìrètí
  rationale: Dátífù náà lè tọ́ka sí ipò tàbí ọ̀nà tí ìgbàlà wà; “nínú ìrètí” pa ìforígbárí tó wà láàárín ìgbàlà tí a ti rí gbà àti ìmúṣẹ rẹ̀ tí a kò tíì rí mọ́, láì sọ ìrètí di ohun tó fa ìgbàlà.
- source_word: ἐσώθημεν
  choice: a gbà wá là
  rationale: 'Ọ̀rọ̀ yìí pa ohùn àìṣe ti Gíríìkì mọ́: ẹlòmíràn ni olùgbàlà, àwa sì ni a gbà là. Ó tún fi ìṣe náà hàn gẹ́gẹ́ bí ohun tó ṣẹlẹ̀.'
- source_word: ἐλπὶς ... βλεπομένη
  choice: ìrètí tí a rí
  rationale: Gbólóhùn aláṣe-àpèjúwe yìí jẹ́ Yorùbá àdánidá fún partísípù Gíríìkì, ó sì pa ìyàtọ̀ láàárín ìrètí àti rírí mọ́.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: kì í ṣe ìrètí
  rationale: Èyí túmọ̀ ìsọ̀rí àsọyé Gíríìkì ní ṣókí, ní èdè Yorùbá tó ṣe déédéé.
- source_word: ὃ ... βλέπει
  choice: ohun tí ó rí
  rationale: Arọ́pò-orúkọ aláìlẹ́mìí Gíríìkì tọ́ka sí ohun kan; “ohun tí ó rí” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, ó sì bá ìbéèrè gbogbogbò mu.
- source_word: τίς ἐλπίζει
  choice: ta ni ń retí
  rationale: Ìbéèrè àsọyé yìí jẹ́ ti gbogbo ènìyàn, kì í ṣe ti akọ nìkan; “ta ni” pa ìtumọ̀ àti ìhùwàsí àsọyé yẹn mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàlà àti ìrètí nínú τῇ ἐλπίδι ἐσώθημεν
  choice: “nínú ìrètí ni a gbà wá là,” èyí tó fi ìrètí hàn gẹ́gẹ́ bí ipò tí a ti ní ìgbàlà báyìí, bí ó tilẹ̀ jẹ́ pé ìmúṣẹ rẹ̀ ní kíkún kò tíì hàn sí ojú.
  alternative: “nípasẹ̀ ìrètí ni a gbà wá là,” èyí tó lè ka dátífù náà gẹ́gẹ́ bí ohun èlò.
  rationale: Àyíká ẹsẹ̀ náà so ohun tí a ti ní báyìí pọ̀ mọ́ ohun tí a ṣì ń retí. Ìtumọ̀ àkọ́kọ́ pa ìforígbárí ẹ̀kọ́ ìgbàlà yìí mọ́, láì pinnu pé ìrètí fúnra rẹ̀ ni okùnfà ìgbàlà.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforígbárí láàárín ohun tí a ti rí gbà àti ohun tí a kò tíì rí ni a pa mọ́. “Ta ni” jẹ́ ọ̀nà àdánidá tí kò fi akọ tàbí abo kan pàtó sí ìbéèrè gbogbogbò náà.
