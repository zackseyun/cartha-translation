id: ROM.8.34
reference: Romans 8:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: yo
  text: Ta ni ẹni tí ń dá wa lẹ́bi? Mèsáyà[a] ni ẹni tí ó kú—àní ju bẹ́ẹ̀ lọ, ẹni tí a jí dìde[b]—ẹni tí ó sì wà ní ọwọ́ ọ̀tún Ọlọ́run[c], tí ó sì ń bẹ̀bẹ̀ fún wa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.”
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí “ẹni tí ó jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ohùn àfarawà: “ẹni tí a jí dìde.”'
    reason: alternative_reading
  - marker: c
    text: “Ní ọwọ́ ọ̀tún Ọlọ́run” jẹ́ ọ̀nà tí Bíbélì fi ń sọ nípa ipò ọlá àti àṣẹ tó ga jù lọ.
    reason: cultural_note
  - marker: d
    text: Tàbí “tí ó ń bẹ̀bẹ̀ nítorí tiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: ẹni tí ń dá wa lẹ́bi
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníṣe yìí jẹ́ ẹni tí ń ṣe ìdálẹ́bi. Fífikun “wa” mú gbólóhùn náà pé ní Yorùbá, ó sì bá àyíká ọ̀rọ̀ tó ń sọ nípa àwọn onígbàgbọ́ mu, láìyí agbára ìbéèrè náà padà.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, kì í ṣe bí orúkọ lásán; “Mèsáyà” mú ìtumọ̀ oyè náà hàn. Ẹ̀dà àṣà “Kristi” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀποθανών
  choice: ẹni tí ó kú
  rationale: Ó fi ìṣẹ̀lẹ̀ ikú tó ti ṣẹlẹ̀ hàn ní ọ̀nà tó rọrùn, tó sì ṣe déédé ní Yorùbá.
- source_word: μᾶλλον δὲ
  choice: àní ju bẹ́ẹ̀ lọ
  rationale: Gbólóhùn yìí gbé ọ̀rọ̀ sókè láti ikú Mèsáyà sí jíjí rẹ̀ dìde, dípò kí ó kan ṣàtúnṣe ọ̀rọ̀ tó ṣáájú.
- source_word: ἐγερθείς
  choice: ẹni tí a jí dìde
  rationale: 'Ìtumọ̀ yìí pa ohùn àfarawà Gíríìkì mọ́: ẹnì kan jí Mèsáyà dìde; a kò yí i sí ọ̀rọ̀ oníṣe pé ó jí dìde fúnra rẹ̀.'
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: Ó pa àwòrán Bíbélì mọ́, ó sì jẹ́ gbólóhùn tí àwọn olùka Yorùbá lè lóye gẹ́gẹ́ bí ipò ọlá àti àṣẹ.
- source_word: ἐντυγχάνει ὑπὲρ ἡμῶν
  choice: ń bẹ̀bẹ̀ fún wa
  rationale: “Bẹ̀bẹ̀ fún wa” sọ iṣẹ́ aṣojú rẹ̀ níwájú Ọlọ́run ní èdè Yorùbá tó ṣe kedere, láìfi èrò ẹ̀kọ́ ìsìn míì kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ Gíríìkì náà dúró gẹ́gẹ́ bí oyè ẹni tí a fi òróró yàn nínú àríyànjiyàn Pọ́ọ̀lù; “Mèsáyà” mú iṣẹ́ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa “Kristi” mọ́ gẹ́gẹ́ bí ìtumọ̀ àṣà.
- issue: Ohùn ọ̀rọ̀ ἐγερθείς
  choice: ẹni tí a jí dìde
  alternative: ẹni tí ó jí dìde
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àfarawà, nítorí náà a pa ìfihàn pé a ṣe iṣẹ́ jíjí dìde sí Mèsáyà mọ́, láìyan ẹni tó ṣe é ní kedere ju orísun lọ.
translation_notes:
  register: A lo Yorùbá àpéjọ tó lódodo, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn gbólóhùn arọ́pò-orúkọ pa ìtẹ̀sí àti ìlọsíwájú Gíríìkì mọ́, ṣùgbọ́n a fi “wa” sí ìbéèrè àkọ́kọ́ kí òwe “dá … lẹ́bi” lè pé ní Yorùbá, gẹ́gẹ́ bí àyíká ẹsẹ náà ṣe ń tọ́ka sí àwọn tí a lè dá lẹ́bi. A kò fi “Jésù” kún ọ̀rọ̀ nítorí Χριστός nìkan ni SBLGNT ní ẹsẹ yìí.
