id: ROM.8.9
reference: Romans 8:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin kò wà nínú ẹran ara[a], bí kò ṣe nínú Ẹ̀mí, bí ó bá jẹ́ pé Ẹ̀mí Ọlọ́run ń gbé inú yín ní tòótọ́. Ṣùgbọ́n bí ẹnikẹ́ni kò bá ní Ẹ̀mí Mèsáyà[b], ẹni náà kò jẹ́ tirẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nínú ìwà ẹ̀ṣẹ̀.” Ní Gíríìkì, “nínú ẹran ara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Ẹ̀mí Kristi.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “ẹni náà kì í ṣe tirẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: ẹran ara
  rationale: A pa ọ̀rọ̀ àpẹẹrẹ Pọ́ọ̀lù mọ́, dípò ṣíṣe àlàyé rẹ̀ ní tààràtà gẹ́gẹ́ bí “ìwà ẹ̀ṣẹ̀”; “nínú” náà pa èrò ipò tàbí agbègbè ìwàláàyè inú Gíríìkì mọ́.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Ẹ̀mí Ọlọ́run ni a ń sọ, kì í ṣe ẹ̀mí ènìyàn tàbí ìhùwàsí inú; nítorí náà a kọ ọ́ pẹ̀lú lẹ́tà ńlá.
- source_word: οἰκεῖ
  choice: ń gbé inú yín
  rationale: Ó sọ nípa gbígbé inú ẹni gẹ́gẹ́ bí ibùgbé tí ó dúró, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: A mú Χριστός gẹ́gẹ́ bí oyè, “Mèsáyà,” kì í ṣe bí orúkọ lasán; àlàyé ìsàlẹ̀ fi “Kristi” hàn gẹ́gẹ́ bí àṣàyàn tí ó wọ́pọ̀.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: kò jẹ́ ọ̀kan lára àwọn tirẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ẹni náà kò jẹ́ tirẹ̀ tàbí kò jẹ́ ti ẹgbẹ́ àwọn tirẹ̀, láì sọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ní kedere ju Gíríìkì lọ.
- source_word: εἴπερ
  choice: bí ó bá jẹ́ pé … ní tòótọ́
  rationale: Ó pa ìrísí gbólóhùn oníwọ̀n mọ́, nígbà tí “ní tòótọ́” ń fi agbára ìrònú tí olùkọ̀wé gbà pé ó ṣeé ṣe hàn.
- source_word: Ὑμεῖς
  choice: ẹ̀yin
  rationale: Arọ́pò-orúkọ náà farahàn gbangba, ó sì ní ìtẹnumọ́ nínú Gíríìkì; “ẹ̀yin” pa ìyàtọ̀ náà mọ́.
- source_word: οὗτος
  choice: ẹni náà
  rationale: Ó jẹ́ ọ̀nà àdánidá àti pípé ní Yorùbá fún arọ́pò-orúkọ aṣojú ẹnì kan láì fi akọ tàbí abo tí Yorùbá kò nílò kún un.
theological_decisions:
- issue: Ìyàtọ̀ láàárín “nínú ẹran ara” àti “nínú Ẹ̀mí”
  choice: A pa èdè agbègbè tàbí ipò ìwàláàyè mọ́, tí ó ní ìbáṣepọ̀ pẹ̀lú gbígbé Ẹ̀mí Ọlọ́run inú àwọn onígbàgbọ́.
  alternative: Kí a túmọ̀ rẹ̀ sí ìjà láàárín ìwà ẹ̀ṣẹ̀ àti ìrònú tẹ̀mí, tàbí sí ìgbésí ayé tí Ẹ̀mí ń ṣàkóso.
  rationale: Gbólóhùn náà ń sọ nípa ipò ìwàláàyè ènìyàn ní ìbáṣepọ̀ pẹ̀lú Ẹ̀mí Ọlọ́run. Pípa “ẹran ara” àti “Ẹ̀mí” mọ́ kò jẹ́ kí ìtumọ̀ di èyí tí ó dín kù sí ètò ẹ̀kọ́ kan ṣoṣo.
- issue: Ohun tí “tirẹ̀” ń tọ́ka sí nínú gbólóhùn ìkẹyìn
  choice: A pa arọ́pò-orúkọ “tirẹ̀” mọ́; ẹni tí ó sún mọ́ ọn jù ni Mèsáyà.
  alternative: Kí a sọ “ti Ọlọ́run” ní gbangba nítorí ìsopọ̀ pẹ̀lú “Ẹ̀mí Ọlọ́run” nínú àyíká ọ̀rọ̀.
  rationale: Mèsáyà ni ẹni tí ó sún mọ́ arọ́pò-orúkọ náà jù ní gírámà, ṣùgbọ́n fífi “tirẹ̀” sílẹ̀ kò kọjá ohun tí Gíríìkì sọ, ó sì pa ìsopọ̀ tó wà nínú àyíká ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A pa àmì ohùn mọ́ níbi tí ó bá jẹ́ àdánidá. “Ẹran ara” àti èdè “nínú” mọ ìṣòro àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ Pọ́ọ̀lù sílẹ̀, nígbà tí ìparí gbólóhùn jẹ́ Yorùbá tí ó ṣeé ka dáadáa.
