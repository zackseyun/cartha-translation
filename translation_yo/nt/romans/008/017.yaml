  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìlànà gírámà ẹsẹ̀ Gíríìkì mọ́ ní pàtàkì: ọmọ → ajogún, ajogún Ọlọ́run, ìpín ogún pẹ̀lú Mèsáyà, àti àídájú ìjìyà tí ó yọrí sí gbígba ògo pẹ̀lú rẹ̀. Ṣùgbọ́n ọ̀nà tí a gbé εἴπερ kalẹ̀ nínú àkọ́kọ́ kò rọrùn gan-an nínú Yorùbá, àti ìparí náà tún “pẹ̀lú” ṣe lọ́ọ̀rẹẹ̀mejì ní ọ̀nà tí ó lè dà bí ìtẹnumọ́ àṣejù.'
  naturalness: “Bí ó bá sì jẹ́ pé ọmọ ni wá” jẹ́ ohun tí a lè lóye, ṣùgbọ́n “Bí a bá sì jẹ́ ọmọ” jẹ́ Yorùbá òde òní tí ó rọrùn síi. “Alábàájọpín ogún pẹ̀lú Mèsáyà” jẹ́ ọ̀nà tí ó dáa síi láti sọ ìtumọ̀ συγκληρονόμοι ní kedere ju “alábàájogún pẹ̀lú” lọ. “Kí a lè bá a gba ògo náà” mú ìtumọ̀ ìkópa-pọ̀ àti gbígba ògo hàn láìṣe ìtúnwí tí kò yẹ.
  terminology: A pa “ọmọ,” “ajogún,” “Ọlọ́run,” àti “Mèsáyà” mọ́. “Alábàájọpín ogún” sọ ìpín ogún papọ̀, èyí tí συν- nínú συγκληρονόμοι béèrè. “Gba ògo” ṣètọ́jú ohùn ìgbàwọ́ (passive/receiving glory) nínú συνδοξασθῶμεν.
  issues:
