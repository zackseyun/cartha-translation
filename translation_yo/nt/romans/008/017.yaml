revisions:
- from: Bí ó bá sì jẹ́ pé ọmọ ni wá, nígbà náà a tún jẹ́ ajogún—ajogún Ọlọ́run àti alábàájogún pẹ̀lú Mèsáyà—bí ó bá jẹ́ lóòótọ́ pé a ń bá a jìyà, kí a lè bá a gba ògo pẹ̀lú.
  to: Bí a bá sì jẹ́ ọmọ, a sì tún jẹ́ ajogún—ajogún Ọlọ́run àti alábàájọpín ogún pẹ̀lú Mèsáyà—bí a bá ń bá a jìyà lóòótọ́, kí a lè bá a gba ògo náà.
  rationale: Àtúnṣe náà jẹ́ ti ìṣàn Yorùbá àti ìfarahàn gangan ti àwọn ìpele ìkópa-pọ̀ nínú Gíríìkì. Ó pa àídájú εἴπερ mọ́, kò sọ ìjìyà di iṣẹ́ tí ń jèrè ògo, ó sì pa Mèsáyà mọ́ gẹ́gẹ́ bí oyè Χριστοῦ.
