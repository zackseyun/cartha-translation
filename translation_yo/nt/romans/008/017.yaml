id: ROM.8.17
reference: Romans 8:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: yo
  text: Bí a bá sì jẹ́ ọmọ, a sì tún jẹ́ ajogún—ajogún Ọlọ́run àti alábàájọpín ogún pẹ̀lú Mèsáyà—bí a bá ń bá a jìyà lóòótọ́, kí a lè bá a gba ògo náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: ọmọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ipò wa gẹ́gẹ́ bí ọmọ láìṣe àfihàn akọ tàbí abo; ‘ọmọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bo gbogbo wọn.
- source_word: κληρονόμοι
  choice: ajogún
  rationale: ‘Ajogún’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ẹni tí ó ní ẹ̀tọ́ sí ogún, ó sì bá àwòrán ìdílé àti ogún inú ẹsẹ̀ náà mu.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Ìsọ̀rí ‘ajogún Ọlọ́run’ pa ìbáṣepọ̀ genitive Gíríìkì mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: συγκληρονόμοι
  choice: alábàájogún pẹ̀lú
  rationale: Èyí mú ìtumọ̀ συν- jáde, pé àwọn onígbàgbọ́ ń pín ogún náà pẹ̀lú Mèsáyà.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ ní àyíká ọba àti ogún yìí.
- source_word: εἴπερ
  choice: bí ó bá jẹ́ lóòótọ́ pé
  rationale: Gbólóhùn yìí pa agbára ọ̀rọ̀ àídájú náà mọ́, pẹ̀lú ìfojúsọ́nà pé ohun tí a sọ jẹ́ òótọ́.
- source_word: συμπάσχομεν
  choice: a ń bá a jìyà
  rationale: ‘Bá a’ mú ìtumọ̀ συν- hàn gbangba, ẹni tí a sì ń bá jìyà ni Mèsáyà gẹ́gẹ́ bí àyíká ṣe fi hàn.
- source_word: ἵνα
  choice: kí a lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ète tàbí àbájáde tí ἵνα ń tọ́ka sí.
- source_word: συνδοξασθῶμεν
  choice: kí a lè bá a gba ògo pẹ̀lú
  rationale: ‘Gba ògo’ fi ohùn àìṣe ti Gíríìkì hàn pé a ń gba ògo, ‘bá a ... pẹ̀lú’ sì pa ìtumọ̀ ìkópa papọ̀ mọ́.
theological_decisions:
- issue: Bóyá εἴπερ συμπάσχομεν sọ pé ìjìyà ni ohun tí a fi ń jèrè ògo, tàbí pé ó jẹ́ àpẹẹrẹ ìkópa pẹ̀lú Mèsáyà
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí àídájú gidi: ‘bí ó bá jẹ́ lóòótọ́ pé a ń bá a jìyà,’ láìsọ pé ìjìyà ń ra tàbí ń jèrè ògo.'
  alternative: ‘Níwọ̀n bí a ti ń bá a jìyà’ tàbí ìtumọ̀ tí ó sọ ìjìyà di iṣẹ́ ẹ̀tọ́ sí ògo.
  rationale: εἴπερ ní agbára àídájú gidi, ṣùgbọ́n àyíká ń sọ nípa ìkópa pẹ̀lú Mèsáyà; nítorí náà, a pa ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanjú rẹ̀ ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. Àwọn àtúnṣe gbolóhùn àti àtẹ̀jáde pẹ̀lú àmì ìdákẹ́jẹ ń pa ìṣàn àríyànjiyàn Pọ́ọ̀lù mọ́.
