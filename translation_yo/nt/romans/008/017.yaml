    rationale: συγκληρονόμοι ń tọ́ka sí àwọn tí wọ́n jọ ń pín ogún; “alábàájọpín ogún pẹ̀lú Mèsáyà” sọ èyí ní Yorùbá àdánidá àti ní kedere.
  - severity: medium
