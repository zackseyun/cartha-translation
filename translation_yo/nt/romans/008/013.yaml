id: ROM.8.13
reference: Romans 8:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: yo
  text: Nítorí bí ẹ̀yin bá ń gbé gẹ́gẹ́ bí ẹran ara[a], ẹ ó kú; ṣùgbọ́n bí ẹ̀yin bá fi Ẹ̀mí pa àwọn ìṣe ara kú, ẹ ó yè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Níhìn-ín, “ẹran ara” kì í tọ́ka sí ara ti ara nìkan, bí kò ṣe sí ìgbé ayé tí ìfẹ́kúfẹ̀ẹ́ ẹ̀dá ènìyàn ń darí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára ọ̀rọ̀ àlàyé mọ́, ó sì so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú.
- source_word: κατὰ σάρκα
  choice: ní ìbámu pẹ̀lú ẹran ara[a]
  rationale: Ó pa àwòrán àti ìtumọ̀ gangan σάρξ mọ́ láì sọ ọ́ di ‘ìwà ẹlẹ́ṣẹ̀,’ èyí tí yóò tú ìtumọ̀ Pọ́ọ̀lù ju bó ṣe yẹ lọ.
- source_word: ζῆτε
  choice: ẹ̀yin bá ń gbé
  rationale: Ìṣe tí ń lọ lọ́wọ́ yìí bá present indicative inú gbólóhùn oníṣ条件 mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: ikú ń dúró de yín
  rationale: Ó fi ọjọ́ iwájú tó dájú hàn láì mú μέλλω túmọ̀ sí pé ikú náà yóò ṣẹlẹ̀ lójú ẹsẹ̀.
- source_word: πνεύματι
  choice: fi Ẹ̀mí
  rationale: Lílo ‘fi’ fi dative irinṣẹ́ hàn ní Yorùbá àdánidá; lẹ́tà ńlá tọ́ka sí Ẹ̀mí Mímọ́ nítorí àyíká Róòmù 8.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: àwọn ìṣe ara
  rationale: ‘Àwọn ìṣe’ mú agbára πράξεις jáde, ‘ara’ sì pa ìbáṣepọ̀ genitive mọ́ láì fi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: θανατοῦτε
  choice: pa … kú
  rationale: Ó pa àwòrán fífi ohun kan sí ikú mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣeé lóye fún dídá àwọn ìṣe náà dúró pátápátá.
- source_word: ζήσεσθε
  choice: ẹ ó yè
  rationale: Ó ṣàfihàn future náà ní ṣókí, ó sì pa ìtumọ̀ ìyè tó lágbára mọ́.
theological_decisions:
- issue: Bóyá πνεύματι ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí ènìyàn
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn, tàbí ‘ẹ̀mí’ tí a kò pinnu rẹ̀ ní kedere
  rationale: Àyíká Róòmù 8 ń tọ́ka gidigidi sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí ẹni tó ń fún onígbàgbọ́ lágbára; nítorí náà, ‘Ẹ̀mí’ pẹ̀lú lẹ́tà ńlá ni a lò.
- issue: Ìtumọ̀ σάρξ nínú ìyàtọ̀ ìwà rere yìí
  choice: pa àwòrán ‘ẹran ara’ mọ́ nínú ọ̀rọ̀ pàtàkì
  alternative: ìwà ẹlẹ́ṣẹ̀; ìfẹ́kúfẹ̀ẹ́ ara
  rationale: Àwọn àṣàyàn míì ń ṣàlàyé ìtumọ̀ náà ṣáájú ju bó ṣe yẹ lọ, wọ́n sì lè mú kí ìdíwọ̀n láàárín σάρξ àti σῶμα nínú ẹsẹ náà pòórá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. Àmì ohùn wà níbi tí ó yẹ. A pa àwòrán Pọ́ọ̀lù nípa ‘ẹran ara,’ ‘ara,’ àti pípa àwọn ìṣe kú mọ́, láì fi èrò ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún ọ̀rọ̀ náà.
