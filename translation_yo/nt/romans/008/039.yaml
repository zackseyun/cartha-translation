id: ROM.8.39
reference: Romans 8:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: yo
  text: tàbí ibi gíga, tàbí ibú, tàbí ohunkóhun mìíràn tí a dá[a], kò ní lè yà wá kúrò nínú ìfẹ́ Ọlọ́run[c] tí ó wà nínú Mèsáyà Jésù[b] Olúwa wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ohunkóhun mìíràn nínú gbogbo ohun tí a dá” tàbí “ẹ̀dá mìíràn èyíkéyìí.”
    reason: lexical_alternative
  - marker: b
    text: Ní àṣà ìtumọ̀ Bíbélì, “Mèsáyà Jésù” ni a sábà máa ń pè ní “Kristi Jésù.”
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe jù lọ pé “ìfẹ́ Ọlọ́run” níbí túmọ̀ sí ìfẹ́ tí Ọlọ́run ní sí wa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: ibi gíga
  rationale: Nínú ìsọ̀kan rẹ̀ pẹ̀lú βάθος, ọ̀rọ̀ náà ń tọ́ka sí ohun tàbí ibi tí ó ga; “ibi gíga” mú ìyàtọ̀ gíga àti ibú hàn ní Yorùbá àdánidá.
- source_word: βάθος
  choice: ibú
  rationale: Ó bá ὕψωμα ṣe àtakò, ó sì pa àwòrán ìwọ̀n méjèèjì mọ́ láì fi “ọ̀gbun” kún un, èyí tí ó lè dín ìtumọ̀ náà sí ibi pàtó kan.
- source_word: κτίσις ἑτέρα
  choice: ohunkóhun mìíràn tí a dá
  rationale: Ìtumọ̀ yìí fi κτίσις hàn gẹ́gẹ́ bí ohun tí a dá, ó sì pa ìtumọ̀ ἑτέρα àti agbára àìdánimọ̀ τις mọ́.
- source_word: δυνήσεται
  choice: kò ní lè
  rationale: Ó pa àsìkò ọjọ́ iwájú àti agbára tàbí àǹfààní ṣíṣe tí ọ̀rọ̀ Gíríìkì náà ní mọ́.
- source_word: χωρίσαι
  choice: yà wá kúrò
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé kí a pín àwọn ènìyàn kúrò nínú ìbáṣepọ̀ tàbí ìfẹ́ kan.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: Ó pa ìṣètò ọ̀rọ̀ orísun mọ́, kò sì fi ipá pinnu bóyá ó túmọ̀ sí ìfẹ́ Ọlọ́run sí wa tàbí ìfẹ́ wa sí Ọlọ́run, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń ṣètìlẹ́yìn fún ìfẹ́ Ọlọ́run sí wa.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Mèsáyà” túmọ̀ Χριστός gẹ́gẹ́ bí oyè, “nínú” sì pa ἐν mọ́ ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: κυρίῳ ἡμῶν
  choice: Olúwa wa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó fìdí múlẹ̀ fún κύριος, ó sì pa ọ̀rọ̀ arọ́pò ẹni ti ἡμῶν mọ́.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú “ìfẹ́ Ọlọ́run”
  choice: A pa á mọ́ gẹ́gẹ́ bí “ìfẹ́ Ọlọ́run” nínú ẹsẹ̀ náà; àlàyé ìsàlẹ̀ sọ pé ó ṣeé ṣe jù lọ kí ó jẹ́ ìfẹ́ Ọlọ́run sí wa.
  alternative: Ìfẹ́ wa sí Ọlọ́run, tàbí ọ̀rọ̀ tí ó mọ̀ọ́mọ̀ gba ìtumọ̀ méjèèjì.
  rationale: Róòmù 8:31–39 tẹnumọ́ ohun tí Ọlọ́run ṣe fún àwọn ènìyàn rẹ̀, ṣùgbọ́n ìrísí genitive nínú orísun kò sọ ìbáṣepọ̀ náà ní gbangba; nítorí náà, àkọ́kọ́ ẹsẹ̀ pa àìdánilójú náà mọ́.
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” mú iṣẹ́ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ ìbílẹ̀ “Kristi.”
translation_notes:
  register: A lo Yorùbá àkókò yìí tí ó ní ọlá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àtẹ̀jáde náà jẹ́ apá ìkẹyìn àtòjọ tí ó bẹ̀rẹ̀ ní ẹsẹ̀ ṣáájú, nítorí náà ó bẹ̀rẹ̀ pẹ̀lú “tàbí” láti pa ìṣàn οὔτε … οὔτε mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá àdánidá mu.
