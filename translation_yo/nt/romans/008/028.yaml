id: ROM.8.28
reference: Romans 8:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: yo
  text: A sì mọ̀ pé, fún àwọn tí wọ́n fẹ́ràn Ọlọ́run, ohun gbogbo ń ṣiṣẹ́ pọ̀ fún rere[a]—fún àwọn tí a pè ní ìbámu pẹ̀lú ète.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà á pé, “Ọlọ́run ń mú kí ohun gbogbo ṣiṣẹ́ pọ̀ fún rere.”
    reason: textual_variant
  - marker: b
    text: Tàbí, “ní ìbámu pẹ̀lú ète rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Àwa mọ̀
  rationale: Ó fi ìmọ̀ tí ó dájú, tí ó sì dúró ṣinṣin hàn; fífi ọ̀rọ̀ arọ́pò-orúkọ “Àwa” kún un jẹ́ àdánù àdánidá ní Yorùbá.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí ń tẹ̀síwájú nínú ìjíròrò láìfi ìtakora líle kún ọ̀rọ̀ náà.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: fún àwọn tí ó nífẹ̀ẹ́ Ọlọ́run
  rationale: “Fún” gbé iṣẹ́ dative náà jáde lọ́nà tí ó ṣe kedere, “nífẹ̀ẹ́” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́ tí ń bá a lọ.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìbú ìtumọ̀ neuter plural mọ́ láìdín un kù sí àwọn ìṣẹ̀lẹ̀ rere nìkan.
- source_word: συνεργεῖ
  choice: ń ṣiṣẹ́ pọ̀
  rationale: Ó pa ìtumọ̀ pé àwọn ohun náà ń ṣiṣẹ́ papọ̀ sí àbájáde kan mọ́, láìfi “Ọlọ́run” ṣe olùṣe ní pàtó nínú ẹsẹ̀ àkọ́kọ́.
- source_word: εἰς ἀγαθόν
  choice: fún rere
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún àbájáde tàbí ìdarí sí rere, láìfi àlàyé míì kún ọ̀rọ̀ Gíríìkì.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: fún àwọn tí a pè ní ìbámu pẹ̀lú ète
  rationale: Ó pa àpèjúwe àwọn ẹni tí a pè àti ìbámu pẹ̀lú ète mọ́, láìṣàfikún arọ́pò-orúkọ ohun-ìní tí kò sí nínú ọ̀rọ̀ Gíríìkì.
- source_word: πρόθεσιν
  choice: ète
  rationale: “Ète” túmọ̀ sí ìpinnu tàbí èrò tí a gbé kalẹ̀, ó sì bá àyíká ọ̀rọ̀ Pọ́ọ̀lù mu.
- source_word: κλητοῖς
  choice: àwọn tí a pè
  rationale: Ó jẹ́ ìtumọ̀ taara, ó sì pa èdè ìpè ti Pọ́ọ̀lù mọ́ láìṣàlàyé bí ìpè náà ṣe ń ṣiṣẹ́.
theological_decisions:
- issue: Olùṣe tí a kò sọ ní gbangba nínú συνεργεῖ
  choice: Ọ̀rọ̀ àkọ́kọ́ sọ pé “ohun gbogbo ń ṣiṣẹ́ pọ̀ fún rere.”
  alternative: “Ọlọ́run ń mú kí ohun gbogbo ṣiṣẹ́ pọ̀ fún rere.”
  rationale: SBLGNT tí a pèsè kò ní θεός gẹ́gẹ́ bí olùṣe ní gbangba. Ìtumọ̀ àkọ́kọ́ pa ìrísí àti àìdánilójú ẹ̀rí yẹn mọ́; àkíyèsí ìsàlẹ̀ fi ẹ̀dà mìíràn hàn.
- issue: Bóyá kí a ṣàfikún ohun-ìní sí κατὰ πρόθεσιν
  choice: “ní ìbámu pẹ̀lú ète” láìfi “tirẹ̀” kún un
  alternative: “ní ìbámu pẹ̀lú ète rẹ̀”
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ète Ọlọ́run, ṣùgbọ́n Gíríìkì kò sọ arọ́pò-orúkọ ohun-ìní ní gbangba; a fi ọ̀nà míì sí àkíyèsí ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àtúnṣe náà tẹ̀lé ìṣọ̀kan tó dára láàárín ìtumọ̀ tó sún mọ́ ìrísí Gíríìkì àti gbólóhùn Yorùbá tó ń ṣàn dáadáa.
