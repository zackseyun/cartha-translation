id: ROM.2.29
reference: Romans 2:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó jẹ́ Júù ní inú ni Júù; ìkọlà sì jẹ́ ti ọkàn, ní ẹ̀mí, kì í ṣe nínú ohun tí a kọ sílẹ̀. Ìyìn ẹni náà kò wá láti ọ̀dọ̀ ènìyàn, bí kò ṣe láti ọ̀dọ̀ Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: ní inú
  rationale: Ó fi ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe láàárín ohun inú tí a kò rí àti àmì òde hàn ní Yorùbá àdánidá, láì sọ ọ́ di ohun tí a kàn ń ṣe ní ìkọ̀kọ̀.
- source_word: Ἰουδαῖος
  choice: Júù
  rationale: Àríyànjiyàn ẹsẹ̀ yìí dá lórí ìdánimọ̀ ẹ̀sìn àti májẹ̀mú, kì í ṣe lórí agbègbè Jùdíà nìkan.
- source_word: περιτομὴ καρδίας
  choice: ìkọlà … ti ọkàn
  rationale: Ó pa àwòrán ìkọlà ọkàn mọ́, ó sì ṣe kedere pé Pọ́ọ̀lù ń tọ́ka sí ohun inú dípò àmì ara nìkan.
- source_word: ἐν πνεύματι
  choice: nípasẹ̀ Ẹ̀mí
  rationale: Ìtumọ̀ yìí ka πνεύματι sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí olùṣe iṣẹ́ inú ọkàn, ní ìbámu pẹ̀lú ìyàtọ̀ tí Pọ́ọ̀lù sábà máa ń ṣe láàárín Ẹ̀mí àti ohun tí a kọ sílẹ̀; àmọ́ a fi ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
- source_word: οὐ γράμματι
  choice: kì í ṣe nípasẹ̀ ohun tí a kọ sílẹ̀
  rationale: Èyí sọ ìtumọ̀ γράμμα gẹ́gẹ́ bí àṣẹ tàbí ọ̀rọ̀ tí a kọ sílẹ̀ ní Yorùbá tí ó ṣe kedere, láì lo ‘lẹ́tà,’ èyí tí ó lè túmọ̀ sí lẹ́tà àlìfábẹ́ẹ̀tì tàbí ìwé tí a fi ránṣẹ́.
- source_word: οὗ ὁ ἔπαινος
  choice: Ìyìn ẹni náà
  rationale: Ó so ìyìn náà mọ́ ẹni tí ó jẹ́ Júù ní inú lọ́nà tí ó ṣe kedere, tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐξ ἀνθρώπων
  choice: láti ọ̀dọ̀ ènìyàn
  rationale: ‘Ènìyàn’ níhìn-ín jẹ́ orúkọ àpapọ̀ fún gbogbo ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ἐκ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó tú gbólóhùn Gíríìkì náà ní tààràtà àti ní Yorùbá àdánidá láì fi ìtumọ̀ kún un.
theological_decisions:
- issue: Bóyá πνεύματι ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí/inú ènìyàn
  choice: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí olùṣe iṣẹ́ náà
  alternative: ẹ̀mí ènìyàn tàbí òtítọ́ tẹ̀mí inú
  rationale: Ìyàtọ̀ ‘Ẹ̀mí’ àti ‘ohun tí a kọ sílẹ̀’ nínú èrò Pọ́ọ̀lù ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́, ṣùgbọ́n Gíríìkì kò dá ìtumọ̀ yìí mú patapata; nítorí náà, àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Ìtòlẹ́sẹẹsẹ gbólóhùn náà ń pa ìfarawe láàárín ohun inú àti ohun òde mọ́, ṣùgbọ́n a tú àwọn àsopọ̀ Gíríìkì sí Yorùbá tí ó ṣe kedere fún òǹkàwé gbogbogbò.
