id: ROM.2.25
reference: Romans 2:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: yo
  text: Nítorí ìkọlà wúlò nítòótọ́ bí o bá ń ṣe òfin[a]; ṣùgbọ́n bí o bá jẹ́ ẹni tí ó rú òfin, ìkọlà rẹ ti di àìkọlà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí o bá ń pa òfin mọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ìkọlà rẹ ti di àìkọlà”; ìyẹn ni pé, ìkọlà gẹ́gẹ́ bí àmì májẹ̀mú pàdánù ìwúlò rẹ̀ nígbà tí ẹni náà bá rú òfin.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: ìkọlà
  rationale: Ọ̀rọ̀ yìí jẹ́ orúkọ àfoyemọ̀ fún circumcision, ó sì pa ìyàtọ̀ májẹ̀mú tí Pọ́ọ̀lù fi ṣe pẹ̀lú ἀκροβυστία mọ́.
- source_word: μὲν γὰρ
  choice: Nítorí ... nítòótọ́
  rationale: Àpapọ̀ ọ̀rọ̀ náà fi ìdí gbólóhùn àkọ́kọ́ múlẹ̀, ó sì ń pèsè ọ̀nà fún ìtakora tí ó tẹ̀ lé e.
- source_word: ὠφελεῖ
  choice: ní àǹfààní
  rationale: Ó sọ pé ohun náà ní ìwúlò tàbí iye gidi lábẹ́ àdéhùn tí ó tẹ̀ lé e, láìsọ ọ́ di èrè owó.
- source_word: ἐὰν νόμον πράσσῃς
  choice: bí o bá ń ṣe òfin
  rationale: ‘Ń ṣe òfin’ tẹ̀ lé ìtumọ̀ πράσσω gẹ́gẹ́ bí ṣíṣe tàbí mímú ohun kan ṣẹ, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: παραβάτης νόμου
  choice: arúfin
  rationale: ‘Arúfin’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ó rú òfin; ìtọ́kasí sí òfin ṣì hàn gbangba nínú àyíká gbólóhùn náà.
- source_word: ἡ περιτομή σου
  choice: ìkọlà rẹ
  rationale: Ó pa ìní ẹni kejì àti agbára ọ̀rọ̀ tààrà Pọ́ọ̀lù mọ́.
- source_word: ἀκροβυστία
  choice: àìkọlà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà dúró fún ipò àìkọlà gẹ́gẹ́ bí òdìkejì ìkọlà, kì í ṣe awọ iwájú ara ní pàtó.
- source_word: γέγονεν
  choice: ti di
  rationale: Ìṣe pípé Gíríìkì fi ìyípadà tí àbájáde rẹ̀ ṣì wà hàn; ‘ti di’ mú ìyípadà àti ipò tó yọrí sí i papọ̀.
theological_decisions:
- issue: Bóyá kí a tú gbólóhùn ìkẹyìn sí ipò ara ní tààrà tàbí sí ipò májẹ̀mú
  choice: ìkọlà rẹ ti di àìkọlà
  alternative: a ka ìkọlà rẹ sí àìkọlà
  rationale: A pa àwòrán líle tí γέγονεν lò mọ́ dípò fífi ‘a kà á sí’ rọ agbára ìyípadà ọ̀rọ̀ náà; àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé ìtumọ̀ májẹ̀mú rẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ìkọlà/àìkọlà’ pa ìtakora ọ̀rọ̀ Gíríìkì mọ́, ‘arúfin’ sì jẹ́ ọ̀rọ̀ ṣókí àti àdánidá. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
