    rationale: παραβάτης νόμου túmọ̀ sí ẹni tí ó rú/ta òfin, níbi tí νόμου wà ní gbangba. ‘Ẹni tí ó rú òfin’ pa èyí mọ́, ó sì jẹ́ ìsọ̀rọ̀ Yorùbá òde òní tí ó yege.
