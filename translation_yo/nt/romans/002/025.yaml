  to: Nítorí ìkọlà wúlò nítòótọ́ bí o bá ń ṣe òfin[a]; ṣùgbọ́n bí o bá jẹ́ ẹni tí ó rú òfin, ìkọlà rẹ ti di àìkọlà[b].
