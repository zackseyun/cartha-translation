  source_fidelity: 'Ìtumọ̀ náà ń pa ìgbékalẹ̀ àti ìtakora pàtàkì nínú Gíríìkì mọ́: ìkọlà ní iye ní abẹ́ ìpèsè ‘bí,’ ẹni kejì ni a ń bá sọ̀rọ̀, àti pé ìkọlà ti ‘di’ àìkọlà. Síbẹ̀, ‘arúfin’ jẹ́ ọ̀rọ̀ tí ó lè má ṣe yé òǹkàwé òde òní dáadáa, ó sì fi ‘òfin’ tí παραβάτης νόμου sọ ní gbangba kù sí àyíká. ‘Ẹni tí ó rú òfin’ jẹ́ ìtumọ̀ tó han gbangba, tó sì bá orísun mu pẹkipẹki.'
  naturalness: ‘Ìkọlà wúlò nítòótọ́’ jẹ́ ìṣọ̀kan Yorùbá tí ó rọrùn síi ju ‘ìkọlà ní àǹfààní nítòótọ́,’ bí ó tilẹ̀ jẹ́ pé èyí ìkẹyìn kì í ṣe aṣìṣe. Àwọn ọ̀rọ̀ ‘bí o bá ń ṣe òfin,’ ‘rú òfin,’ àti ‘ti di àìkọlà’ jẹ́ Yorùbá boṣewa tí ó ṣàlàyé.
  terminology: ‘Ìkọlà’ àti ‘àìkọlà’ jẹ́ àṣàyàn tó dára fún Περιτομή àti ἀκροβυστία nítorí wọ́n pa ìtakora májẹ̀mú nínú ọ̀rọ̀ Pọ́ọ̀lù mọ́. ‘Ẹni tí ó rú òfin’ tún dá ìtumọ̀ παραβάτης νόμου hàn láìlo ọ̀rọ̀ tó lè ṣókùnkùn.
