id: ROM.2.16
reference: Romans 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: yo
  text: ní ọjọ́ tí Ọlọ́run yóò dá àwọn ohun ìkọ̀kọ̀ àwọn ènìyàn lẹ́jọ́ nípasẹ̀ Mèsáyà Jésù[a], gẹ́gẹ́ bí ìhìnrere mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Kristi Jésù.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: ní ọjọ́ tí
  rationale: Ó sọ ọjọ́ ìdájọ́ pàtó náà ní ọ̀nà tí ó bá èdè Yorùbá mu, ó sì pa ìtumọ̀ àkókò inú Gíríìkì mọ́.
- source_word: κρίνει
  choice: yóò ... dá ... lẹ́jọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní ìrísí ìsinsìnyí, àyíká ọ̀rọ̀ ń tọ́ka sí ìdájọ́ ọjọ́ iwájú; ‘dá ... lẹ́jọ́’ jẹ́ ọ̀nà àdánidá láti sọ ìdájọ́ ní Yorùbá.
- source_word: τὰ κρυπτὰ
  choice: àwọn ohun ìkọ̀kọ̀
  rationale: Èyí mú ìtumọ̀ àwọn ohun tí a fi pamọ́ tàbí tí kò hàn gbangba jáde láì fi ìtumọ̀ míì kún un.
- source_word: τῶν ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: ἄνθρωπος jẹ́ ọ̀rọ̀ gbogbogbò fún ènìyàn, kì í ṣe fún ọkùnrin nìkan.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: gẹ́gẹ́ bí ìhìnrere mi
  rationale: Ó pa ọ̀rọ̀ arọ́pò oníni Paulu mọ́, ó sì sọ pé ìdájọ́ yìí bá ìhìnrere tí ó ń kéde mu.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: fipasẹ̀ Mèsáyà Jésù
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive ń fi aṣojú tàbí ọ̀nà tí Ọlọ́run yóò gbà ṣe ìdájọ́ hàn; ‘Mèsáyà’ pa agbára oyè Χριστός mọ́.
theological_decisions:
- issue: Bóyá Χριστοῦ jẹ́ oyè tàbí apá orúkọ tí ó ti fẹsẹ̀ múlẹ̀
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú àyíká yìí, Χριστός ṣì lè ní agbára oyè ‘Ẹni Àmì-òróró’; a fi ìtumọ̀ oyè náà sínú ọ̀rọ̀ pàtàkì, a sì tọ́ka sí ìtumọ̀ ìbílẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ní àmì ohùn ní kíkún. Ìtòlẹ́sẹẹsẹ ‘fipasẹ̀ ... dá ... lẹ́jọ́’ jẹ́ ti àdánidá ní Yorùbá, ó sì pa iṣẹ́ aṣojú inú διά mọ́.
