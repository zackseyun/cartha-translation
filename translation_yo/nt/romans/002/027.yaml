id: ROM.2.27
reference: Romans 2:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: yo
  text: Ẹni tí kò ní ìkọlà nípa ìṣẹ̀dá[a], tí ó sì ń mú òfin ṣẹ, yóò dá ọ lẹ́jọ́, ìwọ ẹni tí ó ní ìwé òfin àti ìkọlà[b], tí o sì jẹ́ arúfin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘àìkọlà’; ìyẹn ni, ẹni tí kò ní ìkọlà.
    reason: lexical_alternative
  - marker: b
    text: ‘Nípasẹ̀ ìkọ̀wé’ ni a tún lè túmọ̀ γράμματος; ní àyíká yìí, ó ń tọ́ka sí òfin tí a kọ sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: ẹni tí a kò kọ ní ilà
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí àìkọlà, ṣùgbọ́n níbí ó dúró fún ẹni tí a kò kọ ní ilà. Yíyan ọ̀rọ̀ ẹni yìí mú kí ìtọ́kasí sí ènìyàn ṣe kedere láìfi ‘Kèfèrí’ kún ohun tí Gíríìkì sọ.
- source_word: ἐκ φύσεως
  choice: nípa ìṣẹ̀dá
  rationale: Ó pa ìyàtọ̀ mọ́ láàárín ẹni tí kò ní ìkọlà nípa ipò ìbílẹ̀ rẹ̀ àti ẹni tí ó ní àmì ìkọlà.
- source_word: τελοῦσα
  choice: tí ó sì ń mú ... ṣẹ
  rationale: Ó pa agbára participle mọ́ gẹ́gẹ́ bí ìṣe tí ẹni náà ń ṣe, láìsọ ọ́ di gbólóhùn àídájú ní pàtó.
- source_word: νόμον
  choice: òfin
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí Òfin Mósè gẹ́gẹ́ bí ohun tí àwọn olùgbọ́ mọ̀.
- source_word: διὰ γράμματος
  choice: ní ìwé òfin
  rationale: γράμμα tọ́ka sí òfin ní ìkọ̀wé. Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ohun èlò tàbí ohun tí ẹni náà ní mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ fi ìtumọ̀ gangan hàn.
- source_word: περιτομῆς
  choice: ìkọlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún àmì májẹ̀mú ìkọlà.
- source_word: παραβάτην νόμου
  choice: arúfin
  rationale: ‘Arúfin’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí ó rú òfin, ó sì pa ìbáṣepọ̀ náà pẹ̀lú òfin mọ́ nínú àyíká gbólóhùn.
theological_decisions:
- issue: Bóyá kí a sọ ἀκροβυστία di ‘Kèfèrí’ ní tààrà
  choice: Ẹni tí a kò kọ ní ilà
  alternative: Kèfèrí
  rationale: Àríyànjiyàn Pọ́ọ̀lù kan Júù àti Kèfèrí, ṣùgbọ́n ọ̀rọ̀ pàtó ní ẹsẹ yìí dá lórí ìkọlà àti àìkọlà. Ìtumọ̀ náà kò fi àmì ẹ̀yà kan kún ọ̀rọ̀ Gíríìkì.
- issue: Ìbáṣepọ̀ participle τελοῦσα sí ìṣe ìdájọ́
  choice: tí ó sì ń mú òfin ṣẹ
  alternative: bí ó bá mú òfin ṣẹ
  rationale: Participles náà lè ní ìtumọ̀ àídájú nínú àyíká, ṣùgbọ́n Gíríìkì kò ní ọ̀rọ̀ àídájú ní gbangba. Ìtumọ̀ àkọ́kọ́ pa ìṣòro yẹn mọ́ dípò yíyan ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo ‘kọ ní ilà/ìkọlà’ fún àìkọlà àti ìkọlà, ‘ìwé òfin’ fún γράμμα ní àyíká yìí, àti ‘arúfin’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ẹni tí ó rú òfin. Gbogbo àmì ẹsẹ̀ ìsàlẹ̀ wà nínú ọ̀rọ̀ àkọ́kọ́.
