  source_fidelity: 'Àwọn ọ̀rọ̀ pàtàkì ni a ti mú dáadáa: ἀκροβυστία ń tọ́ka sí ẹni tí kò ní ìkọlà, τελοῦσα sí mímú òfin ṣẹ, àti παραβάτην νόμου sí ẹni tó rú òfin. Ṣùgbọ́n ‘a kò kọ ní ilà’ kò jẹ́ ọ̀nà Yorùbá boṣewa tó ṣe kedere fún àìkọlà, ó sì lè túmọ̀ sí ohun mìíràn. Gbólóhùn ‘yóò dá ìwọ lẹ́jọ́’ tún nílò àtúnṣe sí ‘yóò dá ọ lẹ́jọ́.’'
  naturalness: ‘Ẹni tí kò ní ìkọlà nípa ìṣẹ̀dá’ jẹ́ Yorùbá adayeba, kedere, ó sì pa ìyàtọ̀ tí Gíríìkì ṣe mọ́. ‘Ìwọ ẹni tí ó ní ìwé òfin àti ìkọlà’ ń gbé ìtọ́kasí sí ẹni tí a ń bá sọ̀rọ̀ kalẹ̀ dáadáa. A yọ ‘ṣùgbọ́n’ kúrò, nítorí kò sí ọ̀rọ̀ ìyàtọ̀ tó hàn gbangba nínú Gíríìkì ní ibẹ̀.
  terminology: A pa ‘ìkọlà,’ ‘òfin,’ àti ‘arúfin’ mọ́. ‘Ìwé òfin’ jẹ́ ìtumọ̀ tó yege fún γράμμα nínú àyíká Òfin Mósè, bí ó tilẹ̀ jẹ́ pé ‘ìkọ̀wé’ lè sun mọ́ ọ̀rọ̀ Gíríìkì síi. Àlàyé ẹsẹ̀ ìsàlẹ̀ ń tọ́ka sí aṣayan ‘nípasẹ̀ òfin tí a kọ sílẹ̀ àti ìkọlà,’ ṣùgbọ́n ìtumọ̀ gangan ti διὰ γράμματος kò yẹ kí a pè ní ‘apá yìí’ nítorí ó le dáa pọ̀ mọ́ ìkọlà náà; a ṣe é kedere.
