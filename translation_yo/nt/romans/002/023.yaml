id: ROM.2.23
reference: Romans 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: yo
  text: Ìwọ tí o ń fi òfin ṣògo, ǹjẹ́ o ń tàbùkù sí Ọlọ́run nípa rírú òfin[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìrékọjá òfin.”
    reason: Àṣàyàn yìí pa ọ̀rọ̀-orúkọ παράβασις (“ìrékọjá”) mọ́ ní kíkún ju gbólóhùn àdánidá “rírú òfin” lọ.
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: fi òfin
  rationale: Èyí fi òfin hàn gẹ́gẹ́ bí ohun tí ẹni náà fi ń ṣògo; ó jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára gbólóhùn Gíríìkì mọ́ láì sọ ọ́ di pé ó kàn ń sọ̀rọ̀ nípa òfin.
- source_word: καυχᾶσαι
  choice: ń ṣògo
  rationale: “Ṣògo” mú ìtumọ̀ ìyangàn tàbí fífi ohun kan ṣe ìgbéraga jáde, ó sì bá ohùn ìbáwí Pọ́ọ̀lù mu.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: nípa rírú òfin
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá tó ṣe kedere, tó sì fi hàn pé rírú òfin ni ọ̀nà tí ẹni náà fi ń tàbùkù sí Ọlọ́run. Àlàyé ìsàlẹ̀ fi ìṣètò ọ̀rọ̀-orúkọ tó sún mọ́ Gíríìkì hàn.
- source_word: τὸν θεὸν
  choice: Ọlọ́run
  rationale: “Ọlọ́run” ni orúkọ àdánidá ní Yorùbá fún ẹni pàtó tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí.
- source_word: ἀτιμάζεις
  choice: ń tàbùkù sí
  rationale: Àṣàyàn yìí túmọ̀ sí pípa ọlá ẹnì kan jẹ́, ó sì pa ìtakora tó wà láàárín ṣíṣògo àti àìbọ̀wọ̀ fún Ọlọ́run mọ́.
theological_decisions:
- issue: νόμος nínú ọ̀rọ̀ ìjiyàn Pọ́ọ̀lù
  choice: òfin
  alternative: Òfin, gẹ́gẹ́ bí akọlé pàtó fún Òfin Mósè
  rationale: Àyíká ọ̀rọ̀ fi hàn pé òfin àwọn Júù ni Pọ́ọ̀lù ń tọ́ka sí, ṣùgbọ́n Gíríìkì kò fi ìlànà kọ̀wé tó béèrè pé kí a sọ ọ́ di akọlé pàtó. “Òfin” kékeré jẹ́ àdánidá, àyíká sì ń ṣàlàyé ohun tí ó túmọ̀ sí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó níyì, tí ó sì yé òǹkàwé lásán. A lo “ǹjẹ́” láti mú ìbéèrè àtakò Gíríìkì jáde, a sì tún ìtòlẹ́sẹẹsẹ díẹ̀ ṣe kí gbólóhùn náà lè ṣàn dáadáa ní Yorùbá.
