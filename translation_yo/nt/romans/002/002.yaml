id: ROM.2.2
reference: Romans 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: yo
  text: A sì mọ̀ pé ìdájọ́ Ọlọ́run lòdì sí àwọn tí ń ṣe irú àwọn nǹkan bẹ́ẹ̀ bá òtítọ́ mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “wà ní ìbámu pẹ̀lú òtítọ́”; ìyẹn ni pé, ìdájọ́ Ọlọ́run bá ohun tó jẹ́ òtítọ́ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: A mọ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ àsìkò ìsinsìnyí níbí; “a mọ̀” jẹ́ ọ̀nà Yorùbá tó ṣe tààrà, tó sì ṣe àdánidá.
- source_word: δέ
  choice: sì
  rationale: “Sì” so gbólóhùn náà mọ́ ohun tó ṣáájú láìfi ìtakora líle kún un.
- source_word: κρίμα
  choice: ìdájọ́
  rationale: Ó tọ́ka sí ìdájọ́ Ọlọ́run ní ipò Onídàájọ́, láìdín ìtumọ̀ rẹ̀ kù sí ìdálẹ́bi nìkan.
- source_word: κατὰ ἀλήθειαν
  choice: bá òtítọ́ mu
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ní kedere pé ìdájọ́ Ọlọ́run ní ìbámu pẹ̀lú ohun tó jẹ́ òtítọ́, ó sì yẹra fún títú u sí “lọ́nà tó tọ́” nìkan.
- source_word: ἐπὶ
  choice: lòdì sí
  rationale: Nínú àyíká ìdájọ́ tí kò dára fún àwọn ẹni tí a ń sọ̀rọ̀ nípa wọn, “lòdì sí” mú ìdarí ìdájọ́ náà hàn kedere.
- source_word: τὰ τοιαῦτα
  choice: irú àwọn nǹkan bẹ́ẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe àdánidá láti tọ́ka padà sí irú àwọn ìṣe tí a mẹ́nu kàn ṣáájú.
- source_word: πράσσοντας
  choice: àwọn tí ń ṣe
  rationale: Àmì “ń” ń fi ìṣe tó ń bá a lọ tàbí tó ti di àṣà hàn, gẹ́gẹ́ bí participle àsìkò ìsinsìnyí ṣe lè túmọ̀ sí níbí.
theological_decisions:
- issue: Bóyá a ó túmọ̀ κατὰ ἀλήθειαν lọ́nà ìtumọ̀ sí “lọ́nà tó tọ́” tàbí kí a pa ìbáṣepọ̀ rẹ̀ pẹ̀lú òtítọ́ mọ́.
  choice: bá òtítọ́ mu
  alternative: lọ́nà tó tọ́; wà ní ìbámu pẹ̀lú òtítọ́
  rationale: Yíyan “bá òtítọ́ mu” pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ pé ìdájọ́ Ọlọ́run bá òtítọ́ tàbí ohun tó jẹ́ gidi mu, dípò kí a dín un kù sí ọ̀rọ̀ àpèjúwe “lọ́nà tó tọ́.”
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. A lo èdè ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbo; “bá òtítọ́ mu” jẹ́ àdánidá ju gbólóhùn àyálò “gẹ́gẹ́ bí òtítọ́” lọ.
