id: ROM.2.26
reference: Romans 2:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: yo
  text: Nítorí náà, bí ẹni tí a kò kọ ní ilà bá ń pa àwọn ohun tí òfin béèrè mọ́, ṣé a kì yóò ka àìkọlà rẹ̀ sí ìkọlà bí? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “bí àìkọlà bá ń pa àwọn ohun tí òfin béèrè mọ́, ṣé a kì yóò ka àìkọlà rẹ̀ sí ìkọlà bí?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: ẹni tí a kò kọ ní ilà / àìkọlà rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtàkì sí ‘àìkọlà,’ ṣùgbọ́n lílò rẹ̀ ní apá àkọ́kọ́ dúró fún ẹni tí a kò kọ ní ilà; αὐτοῦ sì mú kí ìtumọ̀ ẹni hàn gbangba. Ní apá kejì, ‘àìkọlà rẹ̀’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δικαιώματα
  choice: àwọn ohun tí òfin béèrè
  rationale: Ó sọ ohun tí òfin pàṣẹ tàbí ń fẹ́ kí ènìyàn ṣe, ní èdè Yorùbá tó ṣe kedere láìfi ìtumọ̀ míì kún un.
- source_word: νόμου
  choice: òfin
  rationale: Ó tọ́ka sí òfin Mósè nínú àríyànjiyàn Pọ́ọ̀lù; ‘òfin’ jẹ́ ìtumọ̀ àdánidá fún àyíká yìí.
- source_word: φυλάσσῃ
  choice: bá ń pa ... mọ́
  rationale: ‘Pa ... mọ́’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ṣíṣe ìgbọ́ràn sí àṣẹ tàbí òfin.
- source_word: λογισθήσεται
  choice: a ... ka
  rationale: Ó pa èrò ìṣírò tàbí kíkà ohun kan sí ipò kan mọ́, tí ó ṣe pàtàkì nínú èdè Pọ́ọ̀lù.
- source_word: εἰς περιτομήν
  choice: sí ìkọlà
  rationale: Pẹ̀lú ‘ka ... sí,’ ó fi hàn pé a ka ipò àìkọlà náà sí ipò ìkọlà.
- source_word: οὐχ
  choice: ṣé a kì yóò ... bí?
  rationale: Ìbéèrè òdì náà ń retí ìdáhùn rere; ìṣètò yìí mú agbára ọ̀rọ̀ àsọyé Gíríìkì jáde ní Yorùbá.
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà ń sọ pé ìgbọ́ràn ló ń gba ènìyàn là
  choice: A túmọ̀ gbolohun náà gẹ́gẹ́ bí ìbéèrè àsọyé Pọ́ọ̀lù láìṣàlàyé ọ̀nà ìgbàlà sínú rẹ̀.
  alternative: Láti fi ọ̀rọ̀ kún un pé ẹni náà di ẹni tí Ọlọ́run dá láre nítorí pípa òfin mọ́.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ ń sọ nípa kíkà àìkọlà sí ìkọlà; kò yẹ kí ìtumọ̀ náà pinnu àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tí àyíká tó gbooro ni yóò ṣàlàyé.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘kọ ní ilà/ìkọlà’ fún àṣà ìkọlà ọkùnrin, a sì pa ìbéèrè àsọyé àti ìyàtọ̀ àìkọlà–ìkọlà mọ́. A gbe àmì àlàyé [a] sí òpin ẹsẹ̀ nítorí pé ó kan ìṣètò gbogbo gbolohun.
