id: ROM.2.1
reference: Romans 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: yo
  text: Nítorí náà, ìwọ ènìyàn, ẹni yòówù tí o bá jẹ́ tí o ń dájọ́, kò ní àwáwí. Nítorí nínú bí o ṣe ń dá ẹlòmíràn lẹ́jọ́ ni o ṣe ń dá ara rẹ̀ lẹ́bi, nítorí ìwọ tí ń dájọ́ ń ṣe àwọn ohun kan náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ìjiyàn tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ náà ní Yorùbá.
- source_word: ἀναπολόγητος
  choice: kò ní àwáwí
  rationale: Ó túmọ̀ sí pé ẹni náà kò ní àlàyé tàbí ìgbèjà tí ó lè dá a láre; ó tún pa ìmọ̀ ìdájọ́ inú ọ̀rọ̀ náà mọ́.
- source_word: ὦ ἄνθρωπε
  choice: ìwọ ènìyàn
  rationale: ἄνθρωπος jẹ́ akọ ní gírámà Gíríìkì níbí, ṣùgbọ́n ó dúró fún ènìyàn lápapọ̀. ‘Ìwọ ènìyàn’ pa ìpè taara àti agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì fi akọ nìkan sí i.
- source_word: πᾶς ὁ κρίνων
  choice: ẹnikẹ́ni tí ó ń dájọ́
  rationale: Ó pa agbára gbogbo ènìyàn tí πᾶς ní mọ́, ó sì ṣe kedere pé ọ̀rọ̀ náà kan gbogbo ẹni tí ń dá ẹlòmíràn lẹ́jọ́.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: nígbà tí o bá ń dá ẹlòmíràn lẹ́jọ́
  rationale: Ẹ̀yà Gíríìkì náà lè ní ìtumọ̀ àkókò àti ohun-èlò papọ̀. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa èrò pé nínú ìṣe dídá ẹlòmíràn lẹ́jọ́ ni ẹni náà fi ń dá ara rẹ̀ lẹ́bi mọ́.
- source_word: κατακρίνεις
  choice: ara rẹ ni o ń dá lẹ́bi
  rationale: ‘Dá lẹ́bi’ lágbára ju ‘dájọ́’ lọ, ó sì sọ ìdálẹ́bi tàbí ìdá ẹni sí ẹ̀bi tí ọ̀rọ̀ Gíríìkì náà ní.
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: ń ṣe àwọn ohun kan náà
  rationale: Àkókò ìsinsìnyí àti πράσσω tọ́ka sí ìwà tí ẹni náà ń hu; ‘ń ṣe’ sọ ìṣe tí ó ń bá a lọ ní Yorùbá àdánidá.
- source_word: ὁ κρίνων
  choice: ìwọ tí ń dájọ́
  rationale: Ó pa ìdánimọ̀ olùgbọ́ gẹ́gẹ́ bí ẹni tí ń dájọ́ mọ́, ó sì bá ìpè taara ẹni kejì mu.
theological_decisions:
- issue: Ìpè akọ tí ó dúró fún ènìyàn lápapọ̀ nínú ìbáwí Pọ́ọ̀lù
  choice: Lo ‘ìwọ ènìyàn’ nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sọ pé ó kan gbogbo ènìyàn.
  alternative: ‘Ìwọ ọkùnrin’ tàbí ‘ìwọ ẹ̀dá ènìyàn’
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ẹ̀dá gírámà, ipa rẹ̀ níbí kárí gbogbo ènìyàn. ‘Ìwọ ènìyàn’ jẹ́ àdánidá, ó pa ìpè alágbára mọ́, kò sì dín àwọn tí ọ̀rọ̀ náà ń tọ́ka sí kù.
- issue: Ìbáṣepọ̀ láàárín dídá ẹlòmíràn lẹ́jọ́ àti dídá ara ẹni lẹ́bi
  choice: Ṣe àfihàn pé nínú ìṣe dídá ẹlòmíràn lẹ́jọ́ ni ẹni náà ń dá ara rẹ̀ lẹ́bi.
  alternative: ‘Lórí ìpìlẹ̀ èyíkéyìí tí o fi ń dá ẹlòmíràn lẹ́jọ́’
  rationale: ἐν ᾧ lè ní agbára àkókò àti ohun-èlò. Ìtumọ̀ pàtàkì kò yẹ kí ó fìdí ọ̀kan ṣoṣo múlẹ̀ ju bí Gíríìkì ṣe ṣe lọ; àlàyé ìsàlẹ̀ pa ààyè ìtumọ̀ méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ìbáwí taara tí ó ní iyì. ‘Dájọ́’ àti ‘dá lẹ́bi’ ni a yà sọ́tọ̀ láti pa ìyàtọ̀ κρίνω àti κατακρίνω mọ́.
