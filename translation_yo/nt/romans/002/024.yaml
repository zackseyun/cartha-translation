id: ROM.2.24
reference: Romans 2:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: yo
  text: Nítorí orúkọ Ọlọ́run ni a ń sọ̀rọ̀ òdì sí láàárín àwọn orílẹ̀-èdè nítorí yín[b][a], gẹ́gẹ́ bí a ti kọ ọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “láàárín àwọn Kèfèrí.”'
    reason: lexical_alternative
  - marker: b
    text: Pọ́ọ̀lù ń mú ọ̀rọ̀ inú Ìwé Mímọ́ wá sí ìrántí, pàápàá Àìsáyà 52:5, àti àwọn kókó ọ̀rọ̀ tí a tún rí nínú Ìsíkíẹ́lì 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí àlàyé fún ìbáwí tó ṣáájú múlẹ̀, ó sì jẹ́ ọ̀nà àdánidá láti so gbólóhùn náà mọ́ ohun tó ṣáájú ní Yorùbá.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: orúkọ Ọlọ́run
  rationale: Ó pa àwòrán ‘orúkọ’ inú Gíríìkì mọ́, èyí tó tún lè ní ìtumọ̀ orúkọ rere tàbí bí a ṣe mọ Ọlọ́run.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: διά pẹ̀lú accusative ń tọ́ka sí ohun tó fa ìṣẹ̀lẹ̀ níbí; àṣàyàn yìí sọ ẹ̀sùn Pọ́ọ̀lù ní kedere.
- source_word: βλασφημεῖται
  choice: ni a ń sọ̀rọ̀-òdì sí
  rationale: Ìtumọ̀ yìí jẹ́ ti àsìkò ìsinsìnyí àti ti ohùn àìṣe-taara, ó sì fi hàn pé àwọn ènìyàn ń sọ ọ̀rọ̀ àbùkù àti ọ̀rọ̀ aláìbọ̀wọ̀ sí Ọlọ́run.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: láàárín àwọn Kèfèrí
  rationale: Nínú àyíká Júù àti Kèfèrí ti lẹ́tà náà, ἔθνη tọ́ka sí àwọn tí kì í ṣe Júù; ‘àwọn orílẹ̀-èdè’ ṣì jẹ́ ìtumọ̀ míì tó ṣeé ṣe.
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó bójú mu fún gbólóhùn ìtọ́kasí Ìwé Mímọ́, ó sì pa ìfiwéra καθώς mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá àpéjọ tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Kèfèrí’ gẹ́gẹ́ bí ọ̀rọ̀ inú àyíká Bíbélì fún àwọn tí kì í ṣe Júù, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn. Àwọn àmì ẹsẹ̀ [b][a] tẹ̀ lé ìtòlẹ́sẹẹsẹ tí a fi fún wa, gbogbo wọn sì fara hàn nínú ọ̀rọ̀ pàtàkì.
