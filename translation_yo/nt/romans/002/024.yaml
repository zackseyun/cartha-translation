- from: Nítorí “orúkọ Ọlọ́run ni a ń sọ̀rọ̀-òdì sí láàárín àwọn Kèfèrí nítorí yín”[b][a], gẹ́gẹ́ bí a ti kọ ọ́.
  to: Nítorí orúkọ Ọlọ́run ni a ń sọ̀rọ̀ òdì sí láàárín àwọn orílẹ̀-èdè nítorí yín[b][a], gẹ́gẹ́ bí a ti kọ ọ́.
  rationale: The revision retains every semantic component of the Greek and the supplied audit trail, while replacing a potentially loaded main-text label with the neutral lexical rendering “àwọn orílẹ̀-èdè.” The alternative contextual rendering is retained at the existing [a] anchor. Footnote order and anchors remain [b][a].
