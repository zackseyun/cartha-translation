id: ROM.2.12
reference: Romans 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: yo
  text: Nítorí gbogbo àwọn tí ó ṣẹ̀ láìsí òfin yóò ṣègbé láìsí òfin pẹ̀lú,[a] gbogbo àwọn tí ó sì ṣẹ̀ lábẹ́ òfin ni a ó fi òfin dá lẹ́jọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìní òfin” tàbí “lọ́nà àìlófin,” ní ibi méjèèjì tí ‘láìsí òfin’ ti fara hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ òfin” tàbí “gẹ́gẹ́ bí òfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: láìsí òfin
  rationale: Ó fi hàn pé àwọn tí a ń sọ̀rọ̀ nípa wọn kò sí lábẹ́ àṣẹ Òfin Mósè; kò túmọ̀ sí ìwà àìlófin lásán. Ó sì pa àfiwé pẹ̀lú ‘lábẹ́ òfin’ mọ́.
- source_word: ἥμαρτον
  choice: tí ó ṣẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀-ìṣe aorist náà, láìfi ìtumọ̀ tí kò sí nínú rẹ̀ kún un.
- source_word: ἀπολοῦνται
  choice: yóò ṣègbé
  rationale: ‘Ṣègbé’ pa ìtumọ̀ àbájáde ìdájọ́ ọjọ́ iwájú mọ́, láìpinnu bí ìparun náà ṣe rí ní ti ẹ̀kọ́ ìgbàgbọ́.
- source_word: ἐν νόμῳ
  choice: lábẹ́ òfin
  rationale: Ó sọ jíjẹ́ ẹni tí ó wà láàárín agbègbè àṣẹ àti ìdájọ́ òfin jáde lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: διὰ νόμου
  choice: fi òfin
  rationale: Ìkọ́lé ‘fi ... dá lẹ́jọ́’ jẹ́ Yorùbá àdánidá, ó sì fi òfin hàn gẹ́gẹ́ bí ohun èlò tàbí ìlànà ìdájọ́.
- source_word: κριθήσονται
  choice: ni a ó ... dá lẹ́jọ́
  rationale: A yan ọ̀rọ̀ ìdájọ́ tí kò sọ tẹ́lẹ̀ pé ìdálẹ́bi ni àbájáde, kí ọ̀rọ̀ náà má bàa túmọ̀ ju Gíríìkì lọ.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: gbogbo àwọn tí ... gbogbo àwọn tí
  rationale: Ó pa agbára pínpín àti ìbáramu àwọn apá méjèèjì mọ́ ní Yorùbá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ ọgbọ́n mọ́, níbi tí ẹsẹ yìí ti ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀.
theological_decisions:
- issue: Ohun tí ‘òfin’ (νόμος) ń tọ́ka sí
  choice: Òfin Mósè ní pàtàkì, ṣùgbọ́n a túmọ̀ rẹ̀ ní ṣókí sí ‘òfin’
  alternative: Òfin ìwà rere ní ìtumọ̀ gbogbogbò
  rationale: Àtakò Júù àti Kèfèrí nínú Róòmù 2 ń tọ́ka sí àwọn tí kò ní Òfin Mósè àti àwọn tí ó wà lábẹ́ àṣẹ rẹ̀. A kò fi ‘Mósè’ sínú àyọkà, kí a má bàa dín ààyè ìtumọ̀ Pọ́ọ̀lù kù.
- issue: Ìtumọ̀ ‘ṣègbé’ ní ìbáṣepọ̀ pẹ̀lú ìdálẹ́bi ìkẹyìn
  choice: Lo ‘yóò ṣègbé’ láìṣàlàyé irú ìparun náà
  alternative: ‘A ó dá lẹ́bi’ tàbí ‘a ó parun’
  rationale: Ẹsẹ náà sọ àbájáde ìdájọ́, ṣùgbọ́n kò ṣàlàyé bí ìyà ìkẹyìn ṣe rí; ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àwọn gbólóhùn méjèèjì ní ìbáramu tó ṣe kedere; ‘lábẹ́ òfin’ àti ‘fi òfin dá lẹ́jọ́’ yà ἐν νόμῳ sí ọ̀tọ̀ kúrò lọ́dọ̀ διὰ νόμου ní ọ̀nà àdánidá.
