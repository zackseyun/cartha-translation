source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: yo
  text: Nítorí ẹni tí ó jẹ́ Júù ní òde kì í ṣe Júù[a][b]; bẹ́ẹ̀ ni ìkọlà tí ó hàn ní ara kì í ṣe ìkọlà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ohun tí ojú rí” tàbí “ní ìta.”
    reason: lexical_alternative
  - marker: b
    text: Ní àwọn àyíká ọ̀rọ̀ kan, ‘Júù’ lè túmọ̀ sí ‘ará Jùdíà’; ṣùgbọ́n níbí, ìtumọ̀ tó kan ìdánimọ̀ májẹ̀mú ló ṣeé ṣe jù.
    reason: lexical_alternative
  - marker: c
    text: ‘Ní ara’ jẹ́ ìtumọ̀ tààràtà níbí; ó ń tọ́ka sí ìkọlà ti ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Júù
  rationale: Ní àyíká ọ̀rọ̀ Róòmù yìí, ọ̀rọ̀ náà ń tọ́ka sí ìdánimọ̀ àwọn ènìyàn májẹ̀mú Ísírẹ́lì, kì í ṣe kìkì ẹni tí ó wá láti agbègbè Jùdíà.
- source_word: ἐν τῷ φανερῷ
  choice: ní ohun tí ó hàn / tí ó hàn
  rationale: Èyí pa ìtumọ̀ ohun tí ó wà ní ìta, tí ojú sì lè rí mọ́, ó sì mú ìyàtọ̀ rẹ̀ sí ohun inú ní ẹsẹ tó tẹ̀ lé e dúró.
- source_word: περιτομή
  choice: ìkọlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún àmì májẹ̀mú ti gígé awọ iwájú ara ọkùnrin.
- source_word: ἐν σαρκί
  choice: ní ara
  rationale: Níbí, σάρξ ń tọ́ka sí ara gidi àti ìkọlà ti ara, kì í ṣe sí ìtumọ̀ àkàwé ti ‘ẹran ara.’
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ láàárín ẹsẹ yìí àti àríyànjiyàn tó ṣáájú.
theological_decisions:
- issue: Ìtumọ̀ ìdánimọ̀ májẹ̀mú nínú ‘Júù’ àti ‘ìkọlà’
  choice: A kọ ọ́ sílẹ̀ pé ìfarahàn ìta tàbí àmì ti ara nìkan ni ó ń pinnu ẹni tí ó jẹ́ Júù àti ohun tí ìkọlà jẹ́.
  alternative: Pọ́ọ̀lù ń sọ pé ìdánimọ̀ Júù kò sí mọ́, tàbí pé ó fi ẹ̀ka ẹ̀mí lásán rọ́pò rẹ̀.
  rationale: Èdè Gíríìkì fi ohun tí ó hàn ní ìta wé ohun inú tí ẹsẹ 29 yóò sọ; kò sọ ní kedere pé gbogbo ìdánimọ̀ Júù ti parẹ́. A kò fi ‘tòótọ́’ kún ‘Júù,’ nítorí ọ̀rọ̀ náà kò sí nínú orísun, ó sì lè yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ ju bí ẹsẹ náà ṣe ṣe lọ.
translation_notes:
  register: A lo Yorùbá àṣàdéédé òde òní pẹ̀lú àmì ohùn ní kíkún. Ìṣètò ‘kì í ṣe … ló jẹ́ …’ pa ìtakora àti ìfọkànsí ọ̀rọ̀ Gíríìkì mọ́, nígbà tí gbolohun kejì jẹ́ mímúrọrùn díẹ̀ kí ó lè yé òǹkàwé Yorùbá láì fi ‘tòótọ́’ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
