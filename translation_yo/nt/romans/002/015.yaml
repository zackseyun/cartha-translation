revisions:
- from: Wọ́n fi hàn pé iṣẹ́ òfin ni a kọ sínú ọkàn wọn[a], ẹ̀rí-ọkàn wọn sì ń bá a jẹ́rìí, àwọn èrò wọn sì ń fẹ̀sùn kàn wọ́n tàbí tilẹ̀ ń sọ̀rọ̀ gbèjà wọn.[b]
  to: Wọ́n fi hàn pé a kọ iṣẹ́ òfin sínú ọkàn wọn[a], nígbà tí ẹ̀rí-ọkàn wọn ń bá a jẹ́rìí, àwọn èrò wọn sì ń fẹ̀sùn kan ara wọn tàbí tilẹ̀ ń gbè ara wọn lẹ́yìn.[b]
  rationale: Àtúnṣe náà ń mú ìtumọ̀ ìbáṣepọ̀ ti μεταξὺ ἀλλήλων hàn nínú ọ̀rọ̀ àkọ́kọ́, gẹ́gẹ́ bí orísun Gíríìkì, nígbà tí ó ń pa ìtumọ̀ àlàyé ‘wọ́n’ mọ́ nínú àlàyé ìsàlẹ̀. A tún ṣètò gbolohun akọkọ sí ọ̀nà Yorùbá tó rọrùn ju láìyí ìtumọ̀ rẹ̀ padà.
