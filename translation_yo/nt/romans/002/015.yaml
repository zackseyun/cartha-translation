id: ROM.2.15
reference: Romans 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: yo
  text: Wọ́n fi hàn pé a kọ iṣẹ́ òfin sínú ọkàn wọn[a], nígbà tí ẹ̀rí-ọkàn wọn ń bá a jẹ́rìí, àwọn èrò wọn sì ń fẹ̀sùn kan ara wọn tàbí tilẹ̀ ń gbè ara wọn lẹ́yìn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí òfin béèrè” tàbí “ohun tí òfin ń béèrè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn èrò wọn ń fẹ̀sùn kàn wọ́n tàbí tilẹ̀ ń gbèjà wọn.” Gíríìkì ní ìtumọ̀ ìbáṣepọ̀, “ara wọn,” ṣùgbọ́n a tún lè ka a sí àwọn ènìyàn tí a ń sọ̀rọ̀ nípa wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: fi hàn
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún “show,” ó sì pa agbára ìfihàn ẹ̀rí mọ́ láìsọ ọ́ di ìmúdájú tí kò ṣeé já ní koro.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: iṣẹ́ òfin
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì tó lo “iṣẹ́” ní ẹyọ, dípò kí a túmọ̀ rẹ̀ ní pàtó sí ohun tí òfin béèrè.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: a kọ sínú ọkàn wọn
  rationale: “Kọ sínú ọkàn” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwòrán ohun tí a kọ sí inú ènìyàn.
- source_word: συμμαρτυρούσης ... τῆς συνειδήσεως
  choice: ẹ̀rí-ọkàn wọn sì ń bá a jẹ́rìí
  rationale: “Ẹ̀rí-ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún conscience; “ń bá a jẹ́rìí” sì pa ìtumọ̀ ẹ̀rí àfikún tàbí ẹ̀rí tó fara mọ́ ohun tí a sọ mọ́.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: àwọn èrò wọn
  rationale: Àwọn èrò ni wọ́n ń ṣe iṣẹ́ fífi ẹ̀sùn kàn tàbí gbígbèjà; ìtumọ̀ ìbáṣepọ̀ inú μεταξὺ ἀλλήλων ni a tọ́ka sí nínú àlàyé ìsàlẹ̀ nítorí gbólóhùn Gíríìkì náà há pọ̀.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: ń fẹ̀sùn kàn wọ́n tàbí tilẹ̀ ń sọ̀rọ̀ gbèjà wọn
  rationale: “Fẹ̀sùn kàn” àti “sọ̀rọ̀ gbèjà” fi ìyàtọ̀ accuse/defend hàn; “tilẹ̀” sì ṣàfihàn agbára καὶ lẹ́yìn ἢ.
theological_decisions:
- issue: Bóyá τὸ ἔργον τοῦ νόμου túmọ̀ sí ìmọ̀ ìwà rere inú gbogbo ènìyàn tàbí “ohun tí òfin béèrè” ní pàtó.
  choice: A pa gbólóhùn tí kò túmọ̀ ju orísun lọ, “iṣẹ́ òfin,” mọ́ nínú ẹsẹ̀.
  alternative: “ohun tí òfin béèrè” tàbí “àwọn ohun tí òfin pàṣẹ.”
  rationale: Gíríìkì sọ “iṣẹ́” ní ẹyọ, ó sì há ju àwọn ìtumọ̀ yẹn lọ; yíyan “iṣẹ́ òfin” ń pa àìdánilójú àti ìfàsẹ́yìn ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Ẹni tàbí ohun tí àwọn èrò ń fẹ̀sùn kàn tàbí ń gbèjà.
  choice: A sọ pé àwọn èrò wọn ń fẹ̀sùn kàn wọ́n tàbí ń gbèjà wọn.
  alternative: Àwọn èrò náà ń fẹ̀sùn kan ara wọn tàbí ń gbè ara wọn lẹ́yìn.
  rationale: Èyí jẹ́ kó ṣeé ka ní Yorùbá, ó sì bá ìtumọ̀ pé àwọn èrò ń dá àwọn ènìyàn náà lẹ́jọ́ mu; àlàyé ìsàlẹ̀ tún pa ìmọ̀ ìbáṣepọ̀ ἀλλήλων mọ́.
translation_notes:
  register: A lo Yorùbá Àjùmọ̀lò pẹ̀lú àmì ohùn ní kíkún, ní èdè tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà pa ìṣàn ọ̀rọ̀ Pọ́ọ̀lù àti àwòrán ohun tí a kọ sínú ọkàn mọ́, láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
