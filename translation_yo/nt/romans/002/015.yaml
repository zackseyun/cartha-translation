  source_fidelity: 'Ìtumọ̀ náà dá àwọn ọ̀rọ̀ pàtàkì sílẹ̀ dáadáa: ἐνδείκνυνται (‘fi hàn’), τὸ ἔργον τοῦ νόμου (‘iṣẹ́ òfin’), àti συμμαρτυρούσης (‘ń bá a jẹ́rìí’). Ṣùgbọ́n μεταξὺ ἀλλήλων ní ipa kedere lórí àwọn ìrònú náà; ìtumọ̀ àkọ́kọ́ gbọ́dọ̀ pa ìbáṣepọ̀ ‘ara wọn/láàárín ara wọn’ mọ́, dípò ‘wọ́n,’ èyí tí ó jẹ́ ìtumọ̀ àlàyé kan.'
