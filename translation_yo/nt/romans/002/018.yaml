  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: yo
  text: o sì mọ ìfẹ́ Ọlọ́run[a], o sì ń yẹ àwọn ohun tí ó yàtọ̀ wò[b], bí a ti ń kọ́ ọ láti inú Òfin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ìfẹ́ náà”; Gíríìkì kò sọ “Ọlọ́run” ní kedere níbí, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí i.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè túmọ̀ sí, “o sì ń fọwọ́ sí àwọn ohun tó dára jù.” Ní tààrà, “o sì ń dán àwọn ohun tí ó yàtọ̀ wò.”
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκεις
  choice: mọ
  rationale: Ọ̀rọ̀ yìí ń sọ ní tààrà pé ẹni náà ní ìmọ̀; “mọ” jẹ́ ọ̀nà Yorùbá tó ṣe déédé jù láti sọ ọ́.
- source_word: τὸ θέλημα
  choice: ìfẹ́ Ọlọ́run
  rationale: Ní ti gírámà, Gíríìkì sọ “ìfẹ́ náà” láìfi arọ́pò-orúkọ olóhun kún un, ṣùgbọ́n àyíká ọ̀rọ̀ fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ìfẹ́ náà jẹ́ tirẹ̀. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gírámà náà mọ́.
- source_word: δοκιμάζεις
  choice: ń yẹ ... wò
  rationale: “Yẹ̀ wò” mú èrò ìdánwò àti ìṣàyẹ̀wò láti mọ ohun tó yẹ mu, láìfi dandan parí rẹ̀ sí “fọwọ́ sí” nìkan.
- source_word: τὰ διαφέροντα
  choice: àwọn ohun tí ó yàtọ̀ sí ara wọn
  rationale: Èyí tẹ̀ lé ìtumọ̀ gírámà tó ṣe tààrà, ó sì pa àǹfààní ìtumọ̀ kejì—àwọn ohun tó dára jù tàbí tó ṣe pàtàkì jù—mọ́ sínú àlàyé ìsàlẹ̀ ojú ìwé.
- source_word: κατηχούμενος
  choice: bí a ti ń kọ́ ọ
  rationale: Ìtumọ̀ yìí pa fọ́ọ̀mù participle passive mọ́ ní Yorùbá àdánidá, ó sì lè tọ́ka sí ipò tàbí ìdí tí ẹni náà fi mọ̀ láìfi ìbáṣepọ̀ náà mọ́ sí ọ̀nà kan ṣoṣo.
- source_word: ἐκ τοῦ νόμου
  choice: láti inú Òfin
  rationale: “Láti inú” pa èrò orísun tó wà nínú ἐκ mọ́; “Òfin” tọ́ka sí Òfin tí a mẹ́nu kàn ní àyíká ọ̀rọ̀.
theological_decisions:
- issue: Ẹni tí τὸ θέλημα jẹ́ tirẹ̀
  choice: ìfẹ́ Ọlọ́run
  alternative: ìfẹ́ náà
  rationale: Àyíká ẹsẹ tó ṣáájú tọ́ka sí Ọlọ́run, ṣùgbọ́n àlàyé [a] jẹ́ kó ṣe kedere pé orúkọ Ọlọ́run kò sí ní tààrà nínú gbólóhùn Gíríìkì.
- issue: Ìtumọ̀ τὰ διαφέροντα
  choice: àwọn ohun tí ó yàtọ̀ sí ara wọn
  alternative: àwọn ohun tó dára jù
  rationale: Gbólóhùn náà lè túmọ̀ sí ohun tí ó yàtọ̀, tàbí ní ọ̀nà àkànlò sí ohun tó dára tàbí tó ṣe pàtàkì jù. A fi ìtumọ̀ tó sun mọ́ ọ̀rọ̀ Gíríìkì sínú ara ẹsẹ, a sì pa òmíràn mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “Òfin” gẹ́gẹ́ bí orúkọ pàtó nínú àyíká Romu 2.
