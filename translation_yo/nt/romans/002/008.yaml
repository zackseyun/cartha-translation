id: ROM.2.8
reference: Romans 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: yo
  text: 'Ṣùgbọ́n fún àwọn tí ìṣe wọn ń wá láti inú ìmọtara-ẹni-nìkan, tí wọn kò sì ṣègbọràn sí òtítọ́, ṣùgbọ́n tí wọn ń ṣègbọràn sí àìṣòdodo[a]: ìbínú àti ìrunú.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà àìdájọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: tí ìmọtara-ẹni-nìkan ń darí
  rationale: Ọ̀rọ̀ náà tọ́ka sí orísun tàbí ohun tó ń darí ìṣe wọn; yíyan yìí mú èrò ìfẹ́ ara ẹni àti ìfojúsùn onímọtara-ẹni-nìkan jáde ní Yorùbá àdánidá.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: tí wọn kò sì ṣègbọràn sí òtítọ́
  rationale: ἀπειθέω níbí ní agbára ìwà àti ìpinnu, kì í ṣe àìgbàgbọ́ lásán; ‘kò ṣègbọràn’ pa ìtumọ̀ yẹn mọ́.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: ṣùgbọ́n tí wọn ń ṣègbọràn sí àìṣòdodo
  rationale: Ó bá ìlòdì sí ‘kò ṣègbọràn sí òtítọ́’ mu, ó sì fi hàn pé wọ́n fi ara wọn sí abẹ́ ìdarí àìṣòdodo.
- source_word: ἀδικίᾳ
  choice: àìṣòdodo
  rationale: ‘Àìṣòdodo’ pa ìwọ̀n ìtumọ̀ ìwà búburú àti ohun tí kò tọ́ níwájú Ọlọ́run mọ́, láì dín un kù sí ìwà àìṣèdájọ́ òdodo nìkan.
- source_word: ὀργὴ
  choice: ìbínú
  rationale: Nínú àyíká ìdájọ́ Ọlọ́run, ‘ìbínú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní ọlá tó yẹ.
- source_word: θυμός
  choice: ìrunú
  rationale: Ní ìbámu pẹ̀lú ὀργή, ‘ìrunú’ mú ìgbóná àti líle ìbínú náà jáde láì lo ọ̀rọ̀ àṣejù.
- source_word: implicit verbal ellipsis
  choice: àmì olóṣù méjì lẹ́yìn ‘àìṣòdodo’
  rationale: Gíríìkì kò sọ ọ̀rọ̀-ìṣe fún àbájáde náà ní tààrà; àmì olóṣù méjì pa kíkuru àti agbára gbólóhùn orísun mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀδικία nínú àyíká ìdájọ́ Paulu
  choice: àìṣòdodo
  alternative: ìwà àìṣèdájọ́ òdodo
  rationale: ‘Àìṣòdodo’ gbooro ju ìṣèdájọ́ láàárín ènìyàn lọ, ó sì pa ìtumọ̀ ìwà àti ìbáṣepọ̀ ẹni pẹ̀lú Ọlọ́run mọ́; àmọ́ ìtumọ̀ àfikún náà ṣì ṣeé gbà.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ń darí’ láti fi ἐξ hàn gẹ́gẹ́ bí orísun ìwà, a sì pa ìlòdì tó wà láàárín àìgbọràn sí òtítọ́ àti ìgbọràn sí àìṣòdodo mọ́. Àmì olóṣù méjì pa àìsí ọ̀rọ̀-ìṣe nínú gbólóhùn Gíríìkì mọ́.
