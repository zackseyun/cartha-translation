  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: yo
  text: Ìpọ́njú àti ìdààmú yóò wà lórí gbogbo ọkàn ènìyàn[a] tí ń ṣe ohun búburú—lórí Júù kọ́kọ́, àti lórí Gíríìkì pẹ̀lú.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ènìyàn” tàbí “olúkúlùkù ènìyàn.”
    reason: lexical_alternative
  - marker: b
    text: Níhìn-ín, “Gíríìkì” túmọ̀ sí ẹni tí kì í ṣe Júù nínú àfiwé Júù/Gíríìkì yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: ìpọ́njú
  rationale: Ó fi ìnira tàbí ìyà tó le koko hàn ní èdè Yorùbá tó ṣe kedere, ó sì yàtọ̀ sí ìdààmú tí a lò fún στενοχωρία.
- source_word: στενοχωρία
  choice: ìdààmú
  rationale: Ó bá ìpọ́njú mu gẹ́gẹ́ bí ọ̀rọ̀ méjì tó ń mú ìtumọ̀ ara wọn lágbára, ó sì lè fi ìhámọ́ra inú àti ìbànújẹ́ hàn.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: dé bá gbogbo ọkàn ènìyàn
  rationale: ‘Ọkàn ènìyàn’ pa àwòrán ψυχή mọ́, nígbà tí ‘dé bá’ jẹ́ ọ̀nà àdánidá láti sọ pé ìdájọ́ náà yóò dé sórí ẹni náà.
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: tí ń ṣe ohun búburú
  rationale: Ó tú participle náà sí Yorùbá tó rọrùn, ó sì pa ìtumọ̀ ìṣe ohun búburú mọ́ láìfi èrò míì kún un.
- source_word: Ἰουδαίου
  choice: Júù
  rationale: Nínú ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe níhìn-ín, ọ̀rọ̀ náà tọ́ka sí àwọn Júù gẹ́gẹ́ bí ènìyàn àti ẹgbẹ́ ẹ̀sìn, kì í ṣe àwọn olùgbé Jùdíà nìkan.
- source_word: Ἕλληνος
  choice: Gíríìkì
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù àti àfiwé Júù/Gíríìkì mọ́; ní àyíká yìí, ó ń tọ́ka sí ẹni tí kì í ṣe Júù.
- source_word: πρῶτον
  choice: ní àkọ́kọ́
  rationale: Ó pa ètò ìṣáájú tí ọ̀rọ̀ Gíríìkì sọ mọ́ láìṣàlàyé irú ìṣáájú náà ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Bí a ṣe máa sọ àsọtẹ́lẹ̀ ìdájọ́ tí Gíríìkì fi sílẹ̀ ní ọ̀nà ṣókí
  choice: ìpọ́njú àti ìdààmú yóò dé bá...
  alternative: ìpọ́njú àti ìdààmú lórí...
  rationale: Fífi ‘yóò dé bá’ kún un mú gbólóhùn náà pé ní Yorùbá, ó sì bá àyíká ìdájọ́ ọjọ́ iwájú mu láìfi ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀ náà.
- issue: Bí a ṣe máa lóye Ἕλλην nínú àfiwé Júù/Gíríìkì
  choice: Gíríìkì, pẹ̀lú àlàyé pé ó túmọ̀ sí ẹni tí kì í ṣe Júù ní àyíká yìí
  alternative: Kèfèrí tàbí ẹni tí kì í ṣe Júù nínú ọ̀rọ̀ pàtàkì
  rationale: ‘Gíríìkì’ pa ọ̀rọ̀ orísun àti ìforígbárí Pọ́ọ̀lù mọ́; àkọsílẹ̀ ẹsẹ̀ ṣàlàyé iṣẹ́ rẹ̀ nínú àyíká láìrọ́pò ọ̀rọ̀ náà pẹ̀lú ìtumọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán ‘ọkàn ènìyàn’ àti àfiwé ‘Júù/Gíríìkì’ mọ́, a sì lo àmì ohùn níbi tó bá yẹ.
