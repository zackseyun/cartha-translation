  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì pàtàkì mọ́: θλῖψις/στενοχωρία gẹ́gẹ́ bí ‘Ìpọ́njú àti ìdààmú,’ τὸ κακόν gẹ́gẹ́ bí ‘ohun búburú,’ àti ìyàtọ̀ Júù/Gíríìkì. Ṣùgbọ́n ‘yóò dé bá’ kò fi ἐπί (‘lórí’) hàn dáadáa, àti ‘ní àkọ́kọ́’ lè dun bí ìtòlẹ́sẹẹsẹ lasán dípò ìṣáájú tí πρῶτον ń sọ.'
