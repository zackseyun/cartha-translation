  to: Ìpọ́njú àti ìdààmú yóò wà lórí gbogbo ọkàn ènìyàn[a] tí ń ṣe ohun búburú—lórí Júù kọ́kọ́, àti lórí Gíríìkì pẹ̀lú.[b]
  rationale: Àtúnṣe náà mú ìtumọ̀ ἐπὶ (‘lórí’) hàn sí i, ó sì mú ìṣáájú πρῶτον hàn ní ọ̀nà Yorùbá tó rọrùn. Kò ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn tàbí ìdájọ́ mìíràn, àwọn àkọsílẹ̀ sì ṣì wà níbi tí ó yẹ.
