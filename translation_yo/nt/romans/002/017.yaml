  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: yo
  text: Ṣùgbọ́n bí ìwọ bá ń pe ara rẹ ní Júù[a], tí o sì ń gbára lé Òfin[b], tí o sì ń ṣògo nínú Ọlọ́run,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ń pè ọ ní Júù,” tàbí “tí o ru orúkọ Júù.”
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀ gangan, “tí o sì sinmi lé Òfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa agbára ọ̀rọ̀ oní条件 εἰ mọ́, ó sì fi ìyàtọ̀ kékeré tí δέ mú wá hàn nínú ìjíròrò Pọ́ọ̀lù.
- source_word: Ἰουδαῖος
  choice: Júù
  rationale: Nínú Róòmù, ọ̀rọ̀ náà ń tọ́ka pàtàkì sí ìdánimọ̀ ẹ̀yà àti ẹ̀sìn, kì í ṣe ibi tí ènìyàn ti wá nìkan.
- source_word: ἐπονομάζῃ
  choice: ń pe ara rẹ
  rationale: Ó fi ìtumọ̀ aláfarawé ti middle voice hàn, ó sì pa etí ọ̀rọ̀ ìbéèrè-àtakò Pọ́ọ̀lù mọ́ ní Yorùbá àdánidá.
- source_word: ἐπαναπαύῃ
  choice: gbára lé
  rationale: Ó sọ ìgbẹ́kẹ̀lé tàbí fífi ìdánilójú sínú ohun kan hàn kedere, dípò ìsinmi ti ara.
- source_word: νόμῳ
  choice: Òfin
  rationale: Lẹ́tà ńlá àti àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kí Pọ́ọ̀lù máa tọ́ka sí Òfin Mósè gẹ́gẹ́ bí ohun tí àwọn Júù mọ̀ dáadáa.
- source_word: καυχᾶσαι
  choice: ń ṣògo
  rationale: Ó pa ìtumọ̀ Pọ́ọ̀lù ti fífi ohun kan ṣe ìdí ìgbéraga tàbí ìyìn mọ́, láì pinnu fún òǹkàwé bóyá ó dára tàbí ó burú níbí.
- source_word: ἐν θεῷ
  choice: nínú Ọlọ́run
  rationale: Ó tẹ̀lé ἐν pẹ̀kipẹ̀ki, ó sì jẹ́ gbólóhùn Yorùbá tí ó lè túmọ̀ sí fífi Ọlọ́run ṣe ìdí ìṣògo.
theological_decisions:
- issue: Bóyá καυχᾶσαι ἐν θεῷ túmọ̀ sí ìṣògo rere tàbí ìgbéraga tí Pọ́ọ̀lù ń bá wí
  choice: ń ṣògo nínú Ọlọ́run
  alternative: ń fi Ọlọ́run yangàn
  rationale: A kò yanju ẹ̀dọ̀fu ọ̀rọ̀ náà ní ìkọ̀kọ̀; ‘ṣògo nínú Ọlọ́run’ jẹ́ kí àyíká ọ̀rọ̀ pinnu irú ìṣògo tí Pọ́ọ̀lù ń sọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ìwọ’ láti fi ìtẹnumọ́ σὺ hàn, a sì pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ìbẹ̀rẹ̀ àkójọ ọ̀rọ̀ oní条件 tí ó tẹ̀ síwájú nínú ẹsẹ tó tẹ̀ lé e.
