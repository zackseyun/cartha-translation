  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: yo
  text: Ó sì dá ọ lójú pé ìwọ fúnra rẹ jẹ́ amọ̀nà fún àwọn afọ́jú, ìmọ́lẹ̀ fún àwọn tí ó wà nínú òkùnkùn,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: Ó dá ọ lójú
  rationale: Ọ̀rọ̀-ìṣe pípé náà ń sọ ipò ìdánilójú tí ó ti fìdí múlẹ̀; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì mú ìgbẹ́kẹ̀lé ẹni sí ara rẹ̀ hàn.
- source_word: τε
  choice: sì
  rationale: “Sì” so gbólóhùn yìí mọ́ ohun tí ó ṣáájú láì fi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: σεαυτὸν
  choice: ìwọ fúnra rẹ
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ afẹ̀yìntì mọ́, ó sì tẹnu mọ́ bí ẹni náà ṣe ka ara rẹ̀ sí irú ẹni bẹ́ẹ̀.
- source_word: ὁδηγὸν
  choice: amọ̀nà
  rationale: “Amọ̀nà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ẹni tí ń tọ́ ẹlòmíràn sí ọ̀nà, ó sì bá àkàwé inú ẹsẹ yìí mu.
- source_word: τυφλῶν
  choice: àwọn afọ́jú
  rationale: Ó túmọ̀ ẹgbẹ́ àwọn ẹni tí kò ríran ní kedere, ó sì ṣiṣẹ́ gẹ́gẹ́ bí àwọn tí amọ̀nà ń tọ́.
- source_word: φῶς
  choice: ìmọ́lẹ̀
  rationale: Ó pa àkàwé nípa ẹni tí ń mú òye àti ìtọ́sọ́nà wá mọ́ láì ṣe àlàyé rẹ̀ kọjá ohun tí orísun sọ.
- source_word: τῶν ἐν σκότει
  choice: àwọn tí ó wà nínú òkùnkùn
  rationale: Gbólóhùn yìí tọ́ka sí àwọn ènìyàn, ó sì pa àkàwé “òkùnkùn” mọ́ ní Yorùbá àdánidá.
theological_decisions: []
translation_notes:
  register: Yorùbá àpéjọ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “ìwọ fúnra rẹ” láti pa ìtẹnumọ́ Gíríìkì mọ́; kò sí àlàyé ẹ̀kọ́ ìsìn tí a fi kún ọ̀rọ̀ náà.
