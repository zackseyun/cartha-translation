id: ROM.2.20
reference: Romans 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: yo
  text: olùtọ́ni àwọn aláìgbọ́n, olùkọ́ àwọn ọmọ ọwọ́, tí ó ní àwòrán[a] ìmọ̀ àti òtítọ́ nínú Òfin—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìrísí ìmọ̀ àti òtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδευτὴν
  choice: olùkọ́
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ń kọ́ni tàbí tí ń tọ́ni; “olùkọ́” bá àyíká ẹ̀kọ́ inú ọ̀rọ̀ yìí mu láì fi ìtumọ̀ ìjìyà kún un.
- source_word: ἀφρόνων
  choice: àwọn aláìgbọ́n
  rationale: Ó pa ìtumọ̀ àwọn tí kò ní ọgbọ́n àti ohùn ìkẹ́gàn inú àlàyé ẹni náà mọ́ ní Yorùbá àdánidá.
- source_word: διδάσκαλον
  choice: olùkọ́
  rationale: Èyí ni ìtumọ̀ tààrà, tí ó sì ṣe kedere jù lọ fún ẹni tí ń kọ́ àwọn ẹlòmíràn.
- source_word: νηπίων
  choice: àwọn ọmọ ọwọ́
  rationale: Ó pa àwòrán gidi ti àwọn ọmọ kéékèèké mọ́, bó tilẹ̀ jẹ́ pé ó tún lè tọ́ka lọ́nà àkàwé sí àwọn tí kò tíì dàgbà ní òye.
- source_word: ἔχοντα
  choice: tí o ní
  rationale: Ó so àpèjúwe yìí mọ́ ẹni tí a ń bá sọ ní ẹsẹ̀ tó bẹ̀rẹ̀ ṣáájú, ó sì fi ìtumọ̀ participle náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: μόρφωσιν
  choice: àwòrán
  rationale: μόρφωσις lè túmọ̀ sí ìrísí, àwòrán, tàbí ìfihàn ohun kan. “Àwòrán” pa àìdánilójú náà mọ́ ju ọ̀rọ̀ tí yóò pinnu pé Òfin ni ìmúṣẹ̀ pípé ìmọ̀ àti òtítọ́ lọ.
- source_word: γνώσεως
  choice: ìmọ̀
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, ó sì bá “òtítọ́” ṣe méjì gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: ἀληθείας
  choice: òtítọ́
  rationale: Èyí ni ìtumọ̀ àdánidá tí ó pa ìbáṣepọ̀ rẹ̀ pẹ̀lú “ìmọ̀” mọ́.
- source_word: ἐν τῷ νόμῳ
  choice: nínú Òfin
  rationale: Ó pa agbára preposition ἐν mọ́, Òfin sì tọ́ka sí Òfin àwọn Júù ní àyíká yìí.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ μόρφωσις àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Òfin
  choice: àwòrán ìmọ̀ àti òtítọ́ nínú Òfin
  alternative: ìfihàn ìmọ̀ àti òtítọ́ nínú Òfin
  rationale: “Àwòrán” pa àyè ìtumọ̀ ‘form’ tàbí ‘formulation’ mọ́, kò sì fi dandan sọ pé ẹni tí a ń bá sọ fún ní ìmọ̀ àti òtítọ́ ní ẹ̀kúnrẹ́rẹ́. Èyí bá ìforígbárí ọ̀rọ̀ Pọ́ọ̀lù ní àyíká náà mu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye. Àmì ìparí gígùn (—) fi hàn pé gbolóhùn náà ń bá a lọ láti inú ẹsẹ̀ ṣáájú sí ẹsẹ̀ tó tẹ̀ lé e.
