id: ROM.2.10
reference: Romans 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: yo
  text: ṣùgbọ́n ògo, ọlá àti àlàáfíà yóò wà fún olúkúlùkù tí ń ṣe ohun rere[a], fún Júù lákọ̀ọ́kọ́, àti fún Gíríìkì pẹ̀lú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohun tí ó dára.”
    reason: lexical_alternative
  - marker: b
    text: “Gíríìkì” níbí ṣeé ṣe kó túmọ̀ sí ẹni tí kì í ṣe Júù lápapọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: ògo
  rationale: “Ògo” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún ìtumọ̀ ọlá ńlá àti èrè ọjọ́ ìkẹyìn tí ọ̀rọ̀ Gíríìkì náà ní níbí.
- source_word: τιμή
  choice: ọlá
  rationale: “Ọlá” bá δόξα mu gẹ́gẹ́ bí èdè èrè, ó sì yàtọ̀ sí “ògo” láìsọ ìtumọ̀ náà di ohun míì.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ tó gbòòrò mọ́ láìfi kún un bóyá ó jẹ́ ti inú, ti àjọṣe, tàbí ti májẹ̀mú.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: fún olúkúlùkù ẹni tí ń ṣe
  rationale: Ìtumọ̀ yìí fi hàn pé ìṣe náà ń ṣàpèjúwe ìwà ẹni náà déédéé, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: τὸ ἀγαθόν
  choice: ohun rere
  rationale: Àpilẹ̀kọ pẹ̀lú ajẹtífù náà túmọ̀ sí “ohun tí ó dára/rere.” “Ohun rere” jẹ́ àdánidá, ó sì pa ìtumọ̀ ọ̀rọ̀ orísun mọ́.
- source_word: Ἰουδαίῳ
  choice: Júù
  rationale: “Júù” ni ìtumọ̀ tààrà fún Ἰουδαῖος; ẹyọ ọ̀rọ̀ náà dúró fún gbogbo ẹni tó jẹ́ Júù níbí.
- source_word: πρῶτον
  choice: lákọ̀ọ́kọ́
  rationale: “Lákọ̀ọ́kọ́” pa ìtòlẹ́sẹẹsẹ tí Pọ́ọ̀lù sọ mọ́ láìṣàlàyé ìdí rẹ̀ sí i nínú ẹsẹ náà.
- source_word: Ἕλληνι
  choice: Gíríìkì
  rationale: “Gíríìkì” pa ọ̀rọ̀ orísun àti àkójọpọ̀ “Júù àti Gíríìkì” mọ́; àlàyé ìtumọ̀ rẹ̀ tó gbòòrò wà nínú àlàyé ìsàlẹ̀.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: δὲ ṣe àfihàn ìyàtọ̀ sí ìbínú àti ìpọ́njú tí ẹsẹ tó ṣáájú sọ, nítorí náà “ṣùgbọ́n” mú ìtakora náà jáde dáadáa.
- source_word: ἔσται (understood from Romans 2:9)
  choice: yóò wà
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe náà kò tún farahàn ní ẹsẹ 10, èdè Gíríìkì jogún rẹ̀ láti ẹsẹ 9. Fífihàn rẹ̀ ní Yorùbá mú gbólóhùn náà pé láìfi èrò tuntun kún un.
theological_decisions:
- issue: Ìtumọ̀ Ἕλληνι nínú ìyàtọ̀ láàárín Júù àti Gíríìkì
  choice: A lo “Gíríìkì” nínú ẹsẹ náà, a sì ṣàlàyé pé ó ṣeé ṣe kó túmọ̀ sí ẹni tí kì í ṣe Júù lápapọ̀.
  alternative: Kèfèrí tàbí ẹni tí kì í ṣe Júù
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “Gíríìkì” ní tààrà, ṣùgbọ́n nínú Róòmù, ìyàtọ̀ “Júù àti Gíríìkì” sábà máa ń tọ́ka sí Júù àti gbogbo àwọn tí kì í ṣe Júù. Yíyan ọ̀rọ̀ tààrà pẹ̀lú àlàyé ìsàlẹ̀ pa ọ̀rọ̀ orísun àti àìdánilójú tó yẹ mọ́.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu. A tún fi ọ̀rọ̀-ìṣe “yóò wà” hàn, èyí tí Gíríìkì jogún láti ẹsẹ 9, kí gbólóhùn Yorùbá lè pé. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọ̀kọ̀ọ̀kan wọn ń ṣàlàyé.
