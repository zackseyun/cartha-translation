id: ROM.2.22
reference: Romans 2:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: yo
  text: Ìwọ tí o ń sọ pé, “Má ṣe ṣe panṣágà,” ṣé ìwọ ń ṣe panṣágà? Ìwọ tí o kórìíra àwọn ère òrìṣà, ṣé ìwọ ń jí ohun ìní àwọn ilé òrìṣà[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gbòòrò, “ṣé ìwọ ń ṣe àìbọ̀wọ̀ sí ohun mímọ́?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ìwọ tí o ń sọ pé
  rationale: Àpilẹ̀kọ pẹ̀lú participle ìsinsìnyí ń dúró gẹ́gẹ́ bí ẹni tí Pọ́ọ̀lù ń bá sọ ní tààrà; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìbéèrè rẹ̀ mọ́.
- source_word: μὴ μοιχεύειν
  choice: Má ṣe ṣe panṣágà
  rationale: μή pẹ̀lú infinitive sọ ohun tí ẹni náà ń pàṣẹ pé kí a má ṣe; “ṣe panṣágà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìbálòpọ̀ àìṣòótọ́ nínú ìgbéyàwó.
- source_word: μοιχεύεις
  choice: ṣé ìwọ ń ṣe panṣágà?
  rationale: Ìbéèrè àsọyé ni present indicative náà; “ń ṣe” mú ìṣe tí ẹsẹ náà ń fi ẹni náà fẹ̀sùn kàn hàn láìfi dandan sọ pé ìṣẹ̀lẹ̀ kan ṣoṣo ni.
- source_word: ὁ βδελυσσόμενος
  choice: Ìwọ tí o kórìíra
  rationale: βδελύσσομαι túmọ̀ sí ìríra tó lágbára; “kórìíra” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó lágbára, tó sì yé gbogbo ènìyàn.
- source_word: τὰ εἴδωλα
  choice: àwọn ère òrìṣà
  rationale: Nínú àyíká yìí, εἴδωλα tọ́ka sí àwọn ère tí a ń bọ̀; “ère òrìṣà” ṣe ìyàtọ̀ láàárín ère ìbọ̀rìṣà àti òrìṣà fúnra rẹ̀.
- source_word: ἱεροσυλεῖς
  choice: ṣé ìwọ ń ja ilé òrìṣà lólè
  rationale: Ọ̀rọ̀ náà lè túmọ̀ ní pàtó sí jíjí tàbí kíkó ohun ìní tẹ́ńpìlì; “ja ilé òrìṣà lólè” pa àwòrán ìṣe náà àti ìtakora rẹ̀ pẹ̀lú kíkórìíra ère òrìṣà mọ́.
theological_decisions:
- issue: Bóyá ἱεροσυλεῖς túmọ̀ sí jíja tẹ́ńpìlì lólè ní pàtó tàbí ṣíṣe àìbọ̀wọ̀ sí ohun mímọ́ ní gbòòrò
  choice: ṣé ìwọ ń ja ilé òrìṣà lólè
  alternative: ṣé ìwọ ń ṣẹ̀ sí ohun mímọ́
  rationale: Ìtumọ̀ pàtó náà bá τὰ εἴδωλα àti ìtakora inú ìbéèrè Pọ́ọ̀lù mu dáadáa. Síbẹ̀, a pa ìtumọ̀ gbòòrò mọ́ sínú àlàyé ìsàlẹ̀ láìyanjú àìdánilójú ọ̀rọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ṣé” mú ìbéèrè àsọyé náà jẹ́ àdánidá fún olùkà Yorùbá, “ilé òrìṣà” sì túmọ̀ tẹ́ńpìlì àwọn òrìṣà ní kedere láìfi èrò ẹ̀sìn ìjọ kan kún un.
