  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: yo
  text: Nítorí pé kò sí ojúsàájú lọ́dọ̀ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run kì í ṣe ojúsàájú.”
    reason: àṣàyàn ìṣètò gbólóhùn
lexical_decisions:
- source_word: γάρ
  choice: Nítorí pé
  rationale: Ó fi hàn pé ẹsẹ yìí ń sọ ìdí fún ọ̀rọ̀ tó ṣáájú; “Nítorí pé” jẹ́ ọ̀nà àdánidá láti mú agbára àlàyé náà jáde ní Yorùbá.
- source_word: προσωπολημψία
  choice: ojúsàájú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ojú ẹni kan ṣe ju ẹlòmíràn lọ nítorí ipò tàbí ohun tí a rí lára rẹ̀. “Ojúsàájú” ṣe kedere, ó sì bá èrò ìdájọ́ òdodo mu.
- source_word: παρὰ τῷ θεῷ
  choice: Ọlọ́run kì í ṣe
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo gbólóhùn tó túmọ̀ ní tààrà pé ojúsàájú kò sí lọ́dọ̀ Ọlọ́run, ìṣètò yìí jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì pa ìtumọ̀ ìbáṣepọ̀ pẹ̀lú Ọlọ́run mọ́.
- source_word: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ
  choice: Nítorí pé Ọlọ́run kì í ṣe ojúsàájú.
  rationale: 'A yí ìṣètò gbólóhùn ìwàláàyè Gíríìkì sí ọ̀nà Yorùbá àdánidá láì yí ìtumọ̀ rẹ̀ padà: kò sí ojúsàájú nínú ìwà Ọlọ́run tàbí ìdájọ́ rẹ̀.'
theological_decisions:
- issue: Bí a ṣe sọ àìṣojúsàájú Ọlọ́run
  choice: Ọlọ́run kì í ṣe ojúsàájú.
  alternative: Nítorí pé kò sí ojúsàájú lọ́dọ̀ Ọlọ́run.
  rationale: Àwọn méjèèjì sọ òtítọ́ kan náà. Èyí tí a yàn jẹ́ Yorùbá tó ṣe kedere sí òǹkàwé òde òní, láì fi ẹ̀kọ́ ẹ̀sìn mìíràn kún ọ̀rọ̀ náà; àlàyé ìsàlẹ̀ sì pa ìṣètò Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tó yẹ.
