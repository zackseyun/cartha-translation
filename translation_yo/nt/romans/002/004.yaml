id: ROM.2.4
reference: Romans 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: yo
  text: Àbí ìwọ ń kẹ́gàn ọ̀pọ̀lọpọ̀ inú rere rẹ̀, ìfaradà rẹ̀ àti sùúrù rẹ̀, tí o kò mọ̀ pé inú rere Ọlọ́run[a] ń ṣamọ̀nà rẹ sí ìrònúpìwàdà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwà rere” fún “inú rere” ní ibi méjèèjì.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: ọrọ̀
  rationale: “Ọrọ̀” pa àwòrán ọrọ̀ púpọ̀ mọ́, ó sì fi hàn pé inú rere, ìfaradà àti sùúrù Ọlọ́run pọ̀ lọ́pọlọpọ̀.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: inú rere
  rationale: “Inú rere” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe rere onínúure sí ẹlòmíràn, ó sì pa ọ̀rọ̀ kan náà mọ́ ní ibi méjèèjì.
- source_word: ἀνοχῆς
  choice: ìfaradà
  rationale: Ó sọ bí Ọlọ́run ṣe ń mú ara rẹ̀ dúró láti má ṣe dá ẹ̀bi lẹ́sẹ̀kẹsẹ̀, láìfi èrò ìfàyègba ohun búburú kún un.
- source_word: μακροθυμίας
  choice: sùúrù
  rationale: “Sùúrù” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì dá ìfaradà pípẹ́ hàn.
- source_word: καταφρονεῖς
  choice: ń kẹ́gàn
  rationale: 'Ó pa agbára ìbáwí inú ọ̀rọ̀ Gíríìkì mọ́: kì í ṣe pé ẹni náà kàn ṣàìfiyèsí, ṣùgbọ́n ó ń wo ohun náà sí kékeré.'
- source_word: ἀγνοῶν
  choice: tí o kò mọ̀
  rationale: Ìtumọ̀ yìí tẹ̀ lé participle náà láìfi èrò pé àìmọ̀ náà jẹ́ ti ìmọ̀ọ́mọ̀ kún un.
- source_word: εἰς μετάνοιάν
  choice: sí ìrònúpìwàdà
  rationale: Ó pa ìdarí εἰς mọ́, “ìrònúpìwàdà” sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún yíyí ọkàn àti ìwà padà kúrò nínú ẹ̀ṣẹ̀.
- source_word: ἄγει
  choice: ń ṣamọ̀nà rẹ
  rationale: Fọ́ọ̀mù ìsinsìnyí “ń ṣamọ̀nà” fi iṣẹ́ Ọlọ́run tí ń bá a lọ hàn, láìsọ pé ẹni náà ti ronúpìwàdà tán.
theological_decisions:
- issue: 'Bí a ṣe yẹ kí χρηστότης / χρηστόν fi ìṣe Ọlọ́run hàn: “inú rere” tàbí “ìwà rere.”'
  choice: A lo “inú rere” ní ibi méjèèjì.
  alternative: A lè lo “ìwà rere” ní ibi méjèèjì.
  rationale: Àyíká ọ̀rọ̀ náà tẹnumọ́ bí Ọlọ́run ṣe ń ṣe onínúure sí ẹlẹ́ṣẹ̀ tó sì ń dá ìdájọ́ dúró; “inú rere” mú ìbáṣepọ̀ yìí jáde dáadáa, ó sì ṣì bá Gíríìkì mu.
- issue: Bí ἄγει ṣe ní í ṣe pẹ̀lú ìrònúpìwàdà.
  choice: “Ń ṣamọ̀nà rẹ sí ìrònúpìwàdà.”
  alternative: “Ó ń mú ọ ronúpìwàdà.”
  rationale: “Ń ṣamọ̀nà ... sí” pa ìdarí ọ̀rọ̀ Gíríìkì mọ́, kò sì yanjú ní ìkọ̀kọ̀ bóyá ẹni tí a ń bá sọ yóò dáhùn sí inú rere Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọ “ìwọ” mú ẹnìkan ṣoṣo inú Gíríìkì hàn; èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì.
