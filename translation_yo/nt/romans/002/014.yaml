id: ROM.2.14
reference: Romans 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: yo
  text: Nítorí nígbàkígbà tí àwọn aláì-Júù[a], tí wọn kò ní òfin, bá ń ṣe ohun tí òfin ń béèrè[c] nípa ìwà ẹ̀dá[b], àwọn wọ̀nyí, bí wọn kò tilẹ̀ ní òfin, jẹ́ òfin fún ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè” tàbí “àwọn Kèfèrí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa ìmọ̀lára àdánidá.”
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààrà: “ṣe àwọn ohun ti òfin.”'
    reason: literal_rendering
lexical_decisions:
- source_word: ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú àríyànjiyàn Paulu níbí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe Júù, ní ìyàtọ̀ sí àwọn Júù tí wọ́n ní Òfin Mósè. “Àwọn Kèfèrí” sọ ìtumọ̀ ẹ̀yà àti ẹ̀sìn yìí di mímọ́; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ gbogbogbò “àwọn orílẹ̀-èdè” mọ́.
- source_word: νόμον / νόμου / νόμος
  choice: òfin
  rationale: A lo ọ̀rọ̀ kan náà ní gbogbo ẹsẹ náà láti pa ìṣeré-ọ̀rọ̀ àti ìsopọ̀ èrò Gíríìkì mọ́. Nínú àyíká yìí, ó ń tọ́ka sí Òfin Mósè, ṣùgbọ́n gbólóhùn ìkẹyìn lò ó gẹ́gẹ́ bí àkàwé.
- source_word: φύσει
  choice: fi ẹ̀dá
  rationale: Èyí pa ìtumọ̀ “nípa ẹ̀dá” mọ́ láì fi dandan túmọ̀ ọ́ sí ìmọ̀ inú, ìwà àṣà, tàbí ìmọ̀lára àdánidá nìkan.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: ṣe àwọn ohun tí òfin ní
  rationale: 'Ìtumọ̀ yìí sún mọ́ ìṣètò ọ̀rọ̀ orísun, ó sì ṣì ṣeé lóye ní Yorùbá. Àlàyé ìsàlẹ̀ ojú ewé fúnni ní ọ̀nà tí ó rọrùn sí i: “ṣe ohun tí òfin béèrè.”'
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: jẹ́ òfin fún ara wọn
  rationale: “Fún ara wọn” jẹ́ ọ̀nà Yorùbá àdánidá láti túmọ̀ dative ἑαυτοῖς, ó sì pa àkàwé Paulu mọ́ láì fi kún un pé àwọn ènìyàn náà dá òfin tiwọn sílẹ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ φύσει ní ìbáṣepọ̀ pẹ̀lú ìmọ̀ ìwà rere àti ẹ̀rí-ọkàn
  choice: Fi “fi ẹ̀dá” sílẹ̀ nínú ọ̀rọ̀ pàtàkì láì ṣàlàyé rẹ̀ sí ìmọ̀ inú tàbí ẹ̀rí-ọkàn nìkan.
  alternative: “Nípa ìmọ̀lára àdánidá” tàbí “láìjẹ́ pé a kọ́ wọn.”
  rationale: Ọ̀rọ̀ Gíríìkì kan ṣoṣo náà kò pinnu bóyá Paulu ń sọ̀rọ̀ nípa ìmọ̀ ìwà rere tí a bí mọ́ni, ìṣe àṣà, tàbí ipò ẹ̀dá. Ìtumọ̀ yìí pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá tí ó ṣeé lóye fún òǹkàwé òde òní. A pa àtúnsọ “òfin” mọ́ fún ìṣeré-ọ̀rọ̀ Paulu. Àwọn àmì ìsàlẹ̀ ojú ewé ni a gbe lẹ́gbẹ̀ẹ́ àwọn gbólóhùn tí wọ́n ń ṣàlàyé.
