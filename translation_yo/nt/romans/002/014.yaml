  to: Nítorí nígbàkígbà tí àwọn aláì-Júù[a], tí wọn kò ní òfin, bá ń ṣe ohun tí òfin ń béèrè[c] nípa ìwà ẹ̀dá[b], àwọn wọ̀nyí, bí wọn kò tilẹ̀ ní òfin, jẹ́ òfin fún ara wọn.
