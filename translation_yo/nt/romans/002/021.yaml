id: ROM.2.21
reference: Romans 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: yo
  text: Nítorí náà, ìwọ tí ń kọ ẹlòmíràn, ṣé ìwọ kò kọ ara rẹ? Ìwọ tí ń kéde pé, “Má ṣe jalè,” ṣé ìwọ ń jalè?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìpinnu tí ó jáde láti inú àríyànjiyàn tó ṣáájú hàn, ó sì pa agbára ìtumọ̀ ìsopọ̀ náà mọ́.
- source_word: διδάσκων
  choice: tí ń kọ
  rationale: Àpólà ìbátan yìí jẹ́ èdè Yorùbá àdánidá, ó sì fi iṣẹ́ tí ẹni náà máa ń ṣe hàn.
- source_word: ἕτερον
  choice: ẹlòmíràn
  rationale: Ó pa nọ́ńbà ẹyọ ọ̀rọ̀ Gíríìkì mọ́, láì sọ ọ́ di ọ̀pọ̀ ènìyàn.
- source_word: σεαυτὸν
  choice: ara rẹ
  rationale: Ó mú ìyàtọ̀ líle láàárín kíkọ ẹlòmíràn àti kíkọ ara ẹni jáde kedere.
- source_word: οὐ διδάσκεις;
  choice: ṣé ìwọ kò kọ
  rationale: Ó pa ìrísí ìbéèrè àti agbára ìbáwí ẹ̀gàn inú ọ̀rọ̀ náà mọ́.
- source_word: κηρύσσων
  choice: tí ń kéde
  rationale: “Kéde” ń sọ ìpolongo ní gbangba láì fi ìtumọ̀ ìjọ tàbí ẹ̀sìn kan kún un.
- source_word: μὴ κλέπτειν
  choice: Má ṣe jalè
  rationale: A gbé àkóónú ìkéde náà kalẹ̀ gẹ́gẹ́ bí àṣẹ ìdènà tààrà, èyí tó ṣe déédé ní Yorùbá.
- source_word: κλέπτεις;
  choice: ṣé ìwọ ń jalè
  rationale: Ìbéèrè àsọyé tààrà yìí pa ọ̀nà ìbáwí Pọ́ọ̀lù mọ́.
theological_decisions: []
