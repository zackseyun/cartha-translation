id: ROM.2.7
reference: Romans 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: yo
  text: ìyè àìnípẹ̀kun fún àwọn tí wọ́n fi sùúrù tẹ̀ síwájú láti máa ṣe rere, tí wọ́n sì ń wá ògo, ọlá àti àìbàjẹ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: fi sùúrù tẹ̀ síwájú láti máa ṣe rere
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí ìfaradà tàbí ìtẹ̀síwájú nínú iṣẹ́ rere. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì yẹra fún yíyí ἔργου ἀγαθοῦ sí iṣẹ́ kan ṣoṣo.
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: ògo, ọlá àti àìbàjẹ́
  rationale: 'A pa àwọn ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta àti ìyàtọ̀ wọn mọ́: δόξα jẹ́ ògo, τιμή jẹ́ ọlá, ἀφθαρσία sì jẹ́ ipò tí kò lè bàjẹ́.'
- source_word: ζητοῦσιν
  choice: ń wá
  rationale: Ó pa ìṣe tí ń bá a lọ nínú participle Gíríìkì mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó mọ́gbọ́n dání fún ìyè tí kò ní òpin, ó sì bá àṣà ìtumọ̀ Bíbélì mu.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ṣíṣe rere àti ìyè àìnípẹ̀kun
  choice: 'A pa ìtòlẹ́sẹẹsẹ àti ìsopọ̀ gbólóhùn Gíríìkì mọ́: ìyè àìnípẹ̀kun ni fún àwọn tí wọ́n ń forí tì í nínú ṣíṣe rere.'
  alternative: Ṣíṣe àlàyé pé iṣẹ́ rere jẹ́ ẹ̀rí ìgbàgbọ́ tàbí ìpìlẹ̀ ìsanpadà.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò ṣàlàyé ìbáṣepọ̀ náà ní ìpele ẹ̀kọ́ ìgbàgbọ́; a kò gbọ́dọ̀ fi ìtumọ̀ ẹ̀sìn kan pàtó wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, níyì, ó sì rọrùn fún òǹkàwé lasán. Gbólóhùn náà jẹ́ àjákù tí ó tẹ̀ lé Róòmù 2:6, gẹ́gẹ́ bí orísun Gíríìkì.
