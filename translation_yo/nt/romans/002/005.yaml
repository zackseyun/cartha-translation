review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the causal/adversative force, moral hardness, continuing accumulation for oneself, wrath, and the coordinated nominal phrase concerning the day of wrath and revelation. The revised wording retains the source’s nominal ambiguity and does not turn the final phrase into an interpretive clause.
  naturalness: “Ń to ìbínú jọ” is understandable, but “ń kó ìbínú jọ” is more idiomatic contemporary Standard Yorùbá for accumulating something. “Ọkàn aláìronúpìwàdà rẹ” is also more compact and natural than repeating “ọkàn rẹ” with a relative clause.
  terminology: “Líle ọkàn,” “ìbínú,” “ìṣípayá,” and “ìdájọ́ òdodo Ọlọ́run” are suitable biblical-register terms. The lexical-alternative footnote remains appropriate.
  issues:
  - severity: low
    issue: The phrase “ń to ìbínú jọ” is less idiomatic than “ń kó ìbínú jọ.”
    rationale: Both can convey accumulation, but “kó ... jọ” is the more usual Yorùbá collocation and preserves the ongoing sense of θησαυρίζεις.
  - severity: low
    issue: The wording repeats “ọkàn rẹ” and uses a relatively cumbersome relative clause.
    rationale: “Líle ọkàn rẹ àti ọkàn aláìronúpìwàdà rẹ” retains the two Greek expressions while reading more smoothly in Standard Yorùbá.
  revised_text: Ṣùgbọ́n nítorí líle ọkàn rẹ àti ọkàn aláìronúpìwàdà rẹ, ìwọ ń kó ìbínú jọ fún ara rẹ ní ọjọ́ ìbínú àti ìṣípayá ìdájọ́ òdodo Ọlọ́run.[a]
  revised_footnotes:
