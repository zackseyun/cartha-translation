revisions:
- from: Ṣùgbọ́n nítorí líle ọkàn rẹ àti ọkàn rẹ tí kò ronúpìwàdà, ìwọ ń to ìbínú jọ fún ara rẹ ní ọjọ́ ìbínú àti ìṣípayá ìdájọ́ òdodo Ọlọ́run.[a]
  to: Ṣùgbọ́n nítorí líle ọkàn rẹ àti ọkàn aláìronúpìwàdà rẹ, ìwọ ń kó ìbínú jọ fún ara rẹ ní ọjọ́ ìbínú àti ìṣípayá ìdájọ́ òdodo Ọlọ́run.[a]
  rationale: The revision is limited to idiomatic Yorùbá phrasing. It preserves the causal force of κατὰ δέ, the heart metaphor, the reflexive personal consequence, the progressive accumulation, and the coordinated nouns “wrath” and “revelation,” without making the revelation into an explicit temporal clause.
