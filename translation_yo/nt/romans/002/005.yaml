id: ROM.2.5
reference: Romans 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: yo
  text: Ṣùgbọ́n nítorí líle ọkàn rẹ àti ọkàn aláìronúpìwàdà rẹ, ìwọ ń kó ìbínú jọ fún ara rẹ ní ọjọ́ ìbínú àti ìṣípayá ìdájọ́ òdodo Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ìdájọ́ tí ó tọ́ ti Ọlọ́run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Ṣùgbọ́n nítorí
  rationale: “Ṣùgbọ́n” mú ìyípadà kékeré tí δέ ní wá, “nítorí” sì sọ ipa ìdí tí κατά pẹ̀lú accusative ní ní àyíká yìí ní Yorùbá àdánidá.
- source_word: σκληρότητά σου καὶ ἀμετανόητον καρδίαν
  choice: líle ọkàn rẹ àti ọkàn rẹ tí kò ronúpìwàdà
  rationale: “Líle ọkàn” pa àkàwé ìkòkò ọkàn mọ́; àtúnṣe “ọkàn rẹ” mú àwọn ànímọ́ méjèèjì hàn kedere, “tí kò ronúpìwàdà” sì jẹ́ ọ̀rọ̀ òde òní tí ó yé ni.
- source_word: θησαυρίζεις σεαυτῷ
  choice: ìwọ ń to ... jọ fún ara rẹ
  rationale: “Ń to ... jọ” fi ìkojọpọ̀ tí ń bá a lọ hàn, “fún ara rẹ” sì pa reflexive dative mọ́ gẹ́gẹ́ bí àbájáde tí ẹni náà ń kó bá ara rẹ.
- source_word: ὀργή
  choice: ìbínú
  rationale: “Ìbínú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbínú Ọlọ́run nínú ọ̀rọ̀ ìdájọ́, ó sì pa ìwọ̀n àti agbára ọ̀rọ̀ náà mọ́.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: ní ọjọ́ ìbínú àti ìṣípayá
  rationale: “Ní ọjọ́” jẹ́ ìtumọ̀ àdánidá ti ἐν fún àsìkò; àwọn orúkọ méjì tí καί so pọ̀ ni a pa mọ́ láì yí wọn sí gbólóhùn oníṣe.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: ìdájọ́ òdodo Ọlọ́run
  rationale: “Ìdájọ́ òdodo” mú èrò ìdájọ́ tó tọ́ inú δικαιοκρισία jáde; “Ọlọ́run” sì dúró gẹ́gẹ́ bí ẹni tí ìdájọ́ náà jẹ́ tirẹ̀.
theological_decisions:
- issue: Bóyá kí a yí ọ̀rọ̀ orúkọ náà sí gbólóhùn oníṣe pé “nígbà tí Ọlọ́run yóò fi ìdájọ́ òdodo rẹ̀ hàn.”
  choice: ní ọjọ́ ìbínú àti ìṣípayá ìdájọ́ òdodo Ọlọ́run
  alternative: ní ọjọ́ ìbínú, nígbà tí Ọlọ́run yóò fi ìdájọ́ òdodo rẹ̀ hàn
  rationale: Gíríìkì lo àwọn orúkọ tí a so pọ̀, kì í ṣe gbólóhùn oníṣe. Ìtumọ̀ yìí pa ìṣètò àti ìṣiyèméjì orísun mọ́ láì ṣàlàyé rẹ̀ ré kọjá ohun tí a kọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó yé àwọn òǹkàwé òde òní; àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ. A pa àkàwé “líle ọkàn,” ìkojọpọ̀ ìbínú, àti ìṣètò orúkọ ní apá ìkẹyìn mọ́.
