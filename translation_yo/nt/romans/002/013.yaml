id: ROM.2.13
reference: Romans 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: yo
  text: Nítorí kì í ṣe àwọn olùgbọ́ òfin ni ó jẹ́ olódodo níwájú Ọlọ́run, bí kò ṣe àwọn olùṣe òfin ni a ó dá láre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ni a ó kéde pé wọ́n jẹ́ olódodo”; ìtumọ̀ mìíràn ni, “a ó fi hàn pé wọ́n tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: àwọn olùgbọ́
  rationale: Ó pa ìyàtọ̀ tààrà láàárín àwọn tó ń gbọ́ òfin àti àwọn tó ń ṣe é mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: νόμου
  choice: òfin
  rationale: Bí ó tilẹ̀ jẹ́ pé àpilẹ̀kọ kò sí ní Gíríìkì, ‘òfin’ dá ohun tí Pọ́ọ̀lù ń tọ́ka sí hàn ní Yorùbá láìfi ìtumọ̀ míì kún un.
- source_word: δίκαιοι
  choice: olódodo
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún ẹni tí ó tọ́ ní ìdájọ́ tàbí níwájú Ọlọ́run.
- source_word: παρὰ τῷ θεῷ
  choice: níwájú Ọlọ́run
  rationale: Ó ṣàfihàn ipò ẹni ní ojú ìdájọ́ àti àyẹ̀wò Ọlọ́run ní ọ̀nà ṣókí, àdánidá.
- source_word: ποιηταὶ
  choice: àwọn olùṣe
  rationale: Ó pa ìkọlura pẹ̀lú ‘àwọn olùgbọ́’ mọ́, ó sì fi hàn pé àwọn tí ń fi òfin sílò ni a ń sọ.
- source_word: δικαιωθήσονται
  choice: ni a ó dá láre
  rationale: ‘Dá láre’ jẹ́ gbólóhùn Yorùbá tó bá ìṣe ìdájọ́ δικαιόω mu, ó sì pa fọ́ọ̀mù ọjọ́ iwájú àti ohùn àìṣe mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ δικαιωθήσονται láìdín ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù kù
  choice: ni a ó dá láre
  alternative: ni a ó kéde pé wọ́n jẹ́ olódodo; ni a ó sì fìdí rẹ̀ múlẹ̀ pé wọ́n tọ́
  rationale: ‘A ó dá láre’ pa èdè ìdájọ́ àti àìṣe ọ̀rọ̀ Gíríìkì mọ́, láìpinnu bóyá àfojúsùn pàtàkì ni ìkéde ìdájọ́ tàbí ìfìdí ẹni múlẹ̀ pé ó tọ́; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ tó ṣeé ṣe hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti kíkà-rọrùn ni a lò. Àwọn ọ̀rọ̀ ‘olùgbọ́/olùṣe’ pa ìkọlura ọ̀rọ̀ Gíríìkì mọ́; ‘dá láre’ sì jẹ́ àdánidá ju gbólóhùn àjèjì lọ, pẹ̀lú àlàyé ìsàlẹ̀ láti pa àìdánilójú lexical mọ́.
