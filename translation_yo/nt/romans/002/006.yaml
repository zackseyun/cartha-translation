translation:
  language: yo
  text: ẹni tí yóò san fún olúkúlùkù gẹ́gẹ́ bí iṣẹ́ rẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣe.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì, “rẹ̀” jẹ́ akọ-ẹyọ, ṣùgbọ́n ó dúró fún gbogbo ènìyàn níbí: “iṣẹ́ ẹni kọ̀ọ̀kan.”'
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan yìí tọ́ka padà sí Ọlọ́run nínú ọ̀rọ̀ tó ṣáájú; “ẹni tí” jẹ́ èdè Yorùbá àdánidá tó sì pa ìsopọ̀ náà mọ́.
- source_word: ἀποδώσει
  choice: yóò san án padà
  rationale: Ó túmọ̀ sí fífún ẹnìkan ní ohun tó tọ́ sí i, pàápàá nínú ọ̀rọ̀ ìdájọ́ tàbí ẹ̀san; “san án padà” pa agbára ìtúmọ̀ yẹn mọ́ láì sọ ọ́ di ẹ̀san rere nìkan.
- source_word: ἑκάστῳ
  choice: fún olúkúlùkù
  rationale: Ó pa ìtumọ̀ pínpín ọ̀kọ̀ọ̀kan mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere àti àdánidá.
- source_word: κατὰ
  choice: gẹ́gẹ́ bí
  rationale: Ó fi hàn pé iṣẹ́ olúkúlùkù ni ìwọ̀n tàbí ìlànà tí ìsanpadà yóò tẹ̀ lé.
- source_word: τὰ ἔργα
  choice: iṣẹ́
  rationale: “Iṣẹ́” jẹ́ ìbámu tààrà fún ἔργα, ó sì lè gba ìtumọ̀ àwọn ohun tí ènìyàn ṣe; àṣàyàn “ìṣe” wà nínú àlàyé ìsàlẹ̀.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: 'Pẹ̀lú “olúkúlùkù,” arọ́pò-orúkọ “rẹ̀” jẹ́ àdánidá, ó sì ní agbára aṣojú gbogbogbò: iṣẹ́ ẹni kọ̀ọ̀kan.'
theological_decisions:
- issue: Ìdájọ́ gẹ́gẹ́ bí iṣẹ́
  choice: Pa ọ̀rọ̀ ìsanpadà ní ìbámu pẹ̀lú iṣẹ́ mọ́ láì rọ̀ ọ́ tàbí mú un bá ẹ̀kọ́ míì mu.
  alternative: Lílo ọ̀rọ̀ gbogbogbò bí “yóò ṣe sí” tàbí ọ̀rọ̀ tí ó túmọ̀ sí ẹ̀san rere nìkan.
  rationale: Ẹsẹ̀ náà sọ ní tààrà pé Ọlọ́run yóò san án padà fún olúkúlùkù gẹ́gẹ́ bí iṣẹ́ rẹ̀; ó yẹ kí ìtumọ̀ pa ìfọ̀kànsìn ẹ̀kọ́-ìgbàgbọ́ yìí mọ́ dípò kí ó tú u ní ọ̀nà ìtumọ̀ aláṣẹ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “San án padà” jẹ́ kedere fún ọ̀rọ̀ ìdájọ́, “olúkúlùkù” sì pa ìtẹnumọ́ ẹni kọ̀ọ̀kan mọ́.
