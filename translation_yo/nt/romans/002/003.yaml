id: ROM.2.3
reference: Romans 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: yo
  text: Ṣùgbọ́n ìwọ, ènìyàn[a] tí o ń dá àwọn tó ń ṣe irú àwọn nǹkan bẹ́ẹ̀ lẹ́jọ́, tí ìwọ náà sì ń ṣe wọn—ṣé o rò pé ìwọ yóò bọ́ lọ́wọ́ ìdájọ́ Ọlọ́run?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èdè Gíríìkì lo ọ̀rọ̀ tí ó lè túmọ̀ sí “ènìyàn” tàbí “ọkùnrin”; níbí, ẹni kan ni Pọ́ọ̀lù ń bá sọ̀rọ̀ gẹ́gẹ́ bí aṣojú ẹ̀dá ènìyàn.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: ṣé o rò
  rationale: Ó fi èrò tàbí ìrònú ẹni tí ìbéèrè náà ń yẹ̀ wò hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìbéèrè àtakò ní Yorùbá.
- source_word: ἄνθρωπε
  choice: ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ àpèjúwe ẹnì kọ̀ọ̀kan tí Pọ́ọ̀lù ń bá sọ̀rọ̀ gẹ́gẹ́ bí aṣojú gbogbo ènìyàn; “ènìyàn” jẹ́ ti ẹ̀dá ènìyàn lápapọ̀ ní Yorùbá, láìfi akọ tàbí abo kún un.
- source_word: κρίνων
  choice: ń dá ... lẹ́jọ́
  rationale: Ó pa ìtumọ̀ ṣíṣe ìdájọ́ lórí ìwà ẹlòmíràn mọ́, láìlágbára dé “dálẹ́bi.”
- source_word: πράσσοντας
  choice: ń ṣe
  rationale: Ó ṣàfihàn ìṣe tí ń lọ lọ́wọ́ tàbí ìwà tí ẹni ń hù déédéé; Yorùbá kò nílò ọ̀rọ̀ ọ̀tọ̀ láti jẹ́ kí gbolohun náà ṣe kedere.
- source_word: ποιῶν αὐτά
  choice: ìwọ náà sì ń ṣe wọn
  rationale: Ó pa ẹ̀sùn náà mọ́ pé ẹni tó ń dá àwọn ẹlòmíràn lẹ́jọ́ fúnra rẹ̀ ń ṣe àwọn ohun kan náà; “ìwọ náà” ń mú ìtẹnumọ́ àyíká ọ̀rọ̀ jáde.
- source_word: ἐκφεύξῃ
  choice: yóò bọ́ lọ́wọ́
  rationale: Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá àdánidá fún yíyẹ tàbí sísá kúrò ní abajade ìdájọ́ tó ń bọ̀.
- source_word: κρίμα τοῦ θεοῦ
  choice: ìdájọ́ Ọlọ́run
  rationale: Ó pa àwòrán ìdájọ́ Ọlọ́run mọ́ ní ìtumọ̀ gbòòrò, láìdín in kù sí ìkéde ẹ̀bi tàbí ìjìyà nìkan.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ìwọ” àti ìbéèrè “ṣé” láti pa ọ̀nà ìjíròrò alátakò Pọ́ọ̀lù mọ́; àmì gígùn náà ya àpèjúwe ẹni tí a ń bá sọ̀rọ̀ sọ́tọ̀ láìsọ gbolohun di líle.
