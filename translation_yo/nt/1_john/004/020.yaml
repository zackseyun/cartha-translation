id: 1JN.4.20
reference: 1 John 4:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: yo
  text: Bí ẹnì kan bá sọ pé, “Mo nífẹ̀ẹ́ Ọlọ́run,” tí ó sì kórìíra arákùnrin rẹ̀,[a] opurọ́ ni ẹni náà; nítorí ẹni tí kò nífẹ̀ẹ́ arákùnrin rẹ̀, ẹni tí ó ti rí, kò lè nífẹ̀ẹ́ Ọlọ́run, ẹni tí kò tíì rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin tàbí arábìnrin rẹ̀.” Ọ̀rọ̀ Gíríìkì sọ pé “arákùnrin rẹ̀” (ἀδελφόν), ìrísí akọ ẹyọ kan tí ó lè dúró fún àwọn méjèèjì nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Bí ẹnì kan bá sọ pé
  rationale: Àkójọpọ̀ bí ... bá fi àídájú gbogbogbò tí ἐάν pẹ̀lú subjunctive ní hàn, ẹnì kan sì pa ìtumọ̀ àìsọ ẹni pàtó ti τις mọ́.
- source_word: Ἀγαπῶ / ἀγαπῶν / ἀγαπᾶν
  choice: nífẹ̀ẹ́
  rationale: A lo ọ̀rọ̀ kan náà ní gbogbo ibi mẹ́ta láti pa ìsopọ̀ ọ̀rọ̀-ìpilẹ̀ ἀγαπάω mọ́.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédéé fún θεός nígbà tí ó ń tọ́ka sí Ọlọ́run.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Ó pa akọ ẹyọ kan ti ἀδελφός mọ́ láì fi ìtumọ̀ ‘onígbàgbọ́ ẹlẹgbẹ́’ kún ọ̀rọ̀ pàtàkì; àlàyé pé ó lè dúró fún arákùnrin tàbí arábìnrin wà ní àlàyé ìsàlẹ̀.
- source_word: μισῇ
  choice: kórìíra
  rationale: Kórìíra jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì lágbára fún ‘kórìíra/ṣe ìkórìíra,’ ó bá ìtakora pẹ̀lú nífẹ̀ẹ́ mu.
- source_word: ψεύστης ἐστίν
  choice: èké ni ẹni náà
  rationale: Àpólà orúkọ ψεύστης ń ṣe ìdájọ́ lórí irú ẹni náà, kì í ṣe pé ó kan ń sọ irọ́ ní àkókò yẹn; ‘èké ni ẹni náà’ jẹ́ ọ̀nà Yorùbá ọlọ́lá àti àdánidá.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: nítorí ẹni tí kò nífẹ̀ẹ́
  rationale: Nítorí fi iṣẹ́ àlàyé γάρ hàn, ẹni tí kò nífẹ̀ẹ́ sì mú participle tí a sọ di orúkọ yọ ní kedere.
- source_word: ὃν ἑώρακεν
  choice: ẹni tí ó ti rí
  rationale: Àmì ti pẹ̀lú rí ń fi perfect ἑώρακεν hàn gẹ́gẹ́ bí ìríran tí ó ti ṣẹlẹ̀ tí ó sì ṣe pàtàkì sí ọ̀rọ̀ lọ́wọ́lọ́wọ́.
- source_word: ὃν οὐχ ἑώρακεν
  choice: ẹni tí kò tíì rí
  rationale: Kò tíì rí jẹ́ Yorùbá àdánidá fún perfect tí a sẹ́, ó sì pa ìtakora pẹ̀lú ‘ó ti rí’ mọ́.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: kò lè nífẹ̀ẹ́
  rationale: Kò lè pa agbára àìṣeéṣe ti οὐ δύναται mọ́, kì í sì í sọ ọ́ di ìṣòro lásán.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφός ní àyíká tí ó lè ṣojú àwọn onígbàgbọ́ lápapọ̀
  choice: arákùnrin
  alternative: arákùnrin tàbí arábìnrin; onígbàgbọ́ ẹlẹgbẹ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ kan. Ọ̀rọ̀ pàtàkì pa irú rẹ̀ mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí iṣẹ́ aṣojú tí ó lè ní nínú àyíká yìí hàn.
- issue: Agbára οὐ δύναται ἀγαπᾶν
  choice: kò lè nífẹ̀ẹ́ Ọlọ́run
  alternative: kò lágbára láti nífẹ̀ẹ́ Ọlọ́run
  rationale: Àyànfẹ́ náà pa ọ̀rọ̀ líle ti Jòhánù mọ́ gẹ́gẹ́ bí àìṣeéṣe ní ti ìwà àti ẹ̀mí, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Ìbáṣepọ̀ láàárín gbólóhùn pé ẹni náà nífẹ̀ẹ́ Ọlọ́run àti ìkórìíra arákùnrin rẹ̀
  choice: síbẹ̀ tí ó kórìíra
  alternative: tí ó sì kórìíra
  rationale: καί lè so àwọn gbolohun pọ̀, ṣùgbọ́n ní àyíká yìí ìtakora ni ó hàn gbangba. ‘Síbẹ̀’ mú ìtakora náà jáde láì yí ìdájọ́ ẹsẹ náà padà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àmì ohùn kún gbogbo ọ̀rọ̀ níbi tí ó ti yẹ. Àtúnsọ ‘ẹni tí ...’ pa ìfarawé àwọn relative clauses Gíríìkì mọ́, ṣùgbọ́n ó ṣì ń dun bí Yorùbá àdánidá.
