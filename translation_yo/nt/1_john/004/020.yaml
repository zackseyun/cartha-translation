  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: àídájú gbogbogbò, ìfẹ́/ìkórìíra, ìdájọ́ pé ẹni náà jẹ́ opurọ́, àti agbára àìṣeéṣe nínú gbolohun ìkẹyìn ni a ti pa mọ́. Ṣùgbọ́n ‘síbẹ̀’ fún καί ń mú ìtumọ̀ ìtakora kan wọlé tí kò sí ní ọ̀rọ̀ Gíríìkì fúnra rẹ̀, bí ó tilẹ̀ jẹ́ pé ìtakora náà hàn nínú ìjiyàn ẹsẹ náà.'
  naturalness: Ọ̀rọ̀ Yorùbá náà dára, ó sì ní àmì ohùn tó péye ní gbogbogbò. ‘Èké ni ẹni náà’ lè túmọ̀ sí pé ọ̀rọ̀ rẹ̀ jẹ́ èké, níbi tí ψεύστης ti ń pe ẹni náà ní opurọ́. ‘Opurọ́ ni’ jẹ́ kedere síi, ó sì jẹ́ ọ̀nà Yorùbá àdánidá.
  terminology: ‘Nífẹ̀ẹ́,’ ‘kórìíra,’ ‘Ọlọ́run,’ àti ‘arákùnrin rẹ̀’ jẹ́ àwọn àṣàyàn tó yẹ. Àlàyé ìsàlẹ̀ pa àṣàyàn ‘arákùnrin tàbí arábìnrin’ mọ́ láì fa ìtumọ̀ tó gbòòrò sínú ọ̀rọ̀ pàtàkì.
  issues:
