    issue: ‘Síbẹ̀’ ni a lò fún καί.
    rationale: Καί níbí jẹ́ ‘àti,’ kò sì sọ àmì ìtakora kan ní tààrà. Bí ó tilẹ̀ jẹ́ pé ìtakora wà ní ìtumọ̀ ọ̀rọ̀ náà, ‘àti’ pa ìbáṣepọ̀ alásopọ̀ ti orísun mọ́ dáadáa.
  - severity: medium
    issue: ‘Èké ni ẹni náà’ kò ṣe kedere tó fún ψεύστης ἐστίν.
    rationale: ψεύστης jẹ́ orúkọ ẹni, ‘liar’; ‘opurọ́ ni ẹni náà’ ń sọ ìdájọ́ náà di kedere, láì sọ ọ́ di ìṣe ìrọ́ ní ìṣẹ̀lẹ̀ kan.
