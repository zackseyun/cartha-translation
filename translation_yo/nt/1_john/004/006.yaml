  source_fidelity: 'Ìtumọ̀ náà fi ìdàkejì pàtàkì nínú ọ̀rọ̀ Gíríìkì náà hàn dáadáa: àwọn tí wọ́n jẹ́ ti Ọlọ́run ń fetí sí ẹ̀rí “wa,” àwọn tí kì í ṣe ti Ọlọ́run kò ń fetí sí i; nípa èyí ni a fi ń mọ ẹ̀mí méjèèjì. ‘Ẹ̀mí òtítọ́’ àti ‘ẹ̀mí ìṣìnà’ jẹ́ ìtumọ̀ tó bá τὸ πνεῦμα τῆς ἀληθείας àti τὸ πνεῦμα τῆς πλάνης mu. Àtúnṣe kékeré kan ń mú ‘jẹ́ ti Ọlọ́run’ hàn kedere ju ìfi ‘jẹ́’ sílẹ̀ lọ, ó sì ń ṣètò àwọn àmì àlàyé ìsàlẹ̀ sí ibi tí ọ̀rọ̀ tí wọ́n ń ṣàlàyé wà.'
