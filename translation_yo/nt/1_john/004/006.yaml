id: 1JN.4.6
reference: 1 John 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: yo
  text: Àwa jẹ́ ti Ọlọ́run. Ẹni tí ó mọ Ọlọ́run máa ń fetí sí wa; ẹni tí kò jẹ́ ti Ọlọ́run kò fetí sí wa.[a] Nípa èyí ni a fi mọ Ẹ̀mí òtítọ́[b][c] àti ẹ̀mí ìṣìnà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ń gbọ́ wa” ní ibi méjèèjì. Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí gbígbọ́, ṣùgbọ́n níbí ó ṣeé ṣe kí ó túmọ̀ sí fífetí sí ìjẹ́rìí àwọn àpọ́sítélì pẹ̀lú ìtẹ́wọ́gbà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè kọ ọ́ sí “ẹ̀mí òtítọ́” gẹ́gẹ́ bí gbólóhùn gbogbogbò; síbẹ̀, nínú àwọn ìwé Johanu ó sábà máa ń tọ́ka sí Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: c
    text: “Ẹ̀mí òtítọ́” tún fara hàn nínú Johanu 14:17; 15:26; 16:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: ti Ọlọ́run
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé orísun tàbí ìbáṣepọ̀ ẹni wá láti ọ̀dọ̀ Ọlọ́run; ó tún pa ìyàtọ̀ Johanu mọ́ láàárín àwọn tí wọ́n jẹ́ ti Ọlọ́run àti àwọn tí kì í ṣe tirẹ̀.
- source_word: γινώσκων
  choice: ẹni tí ó mọ
  rationale: Ó dúró fún ẹni tí ìmọ̀ Ọlọ́run jẹ́ ànímọ́ rẹ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἀκούει ἡμῶν
  choice: ń fetí sí wa
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἀκούω kọjá gbígbọ́ ohùn lásán, ó ń tọ́ka sí fífetí sí ẹ̀rí àwọn aposteli pẹ̀lú ìtẹ́wọ́gbà, láì mú un lágbára dé ‘gbọ́ràn sí.’
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: ẹni tí kì í ṣe ti Ọlọ́run
  rationale: Ó fi ìtumọ̀ orísun àti ìbáṣepọ̀ ἐκ hàn ní Yorùbá àdánidá, ó sì pa ìfihàn gbogbogbò ti gbolohun Giriki mọ́.
- source_word: ἐκ τούτου
  choice: nípa èyí
  rationale: Ó fi hàn pé ohun tí a ṣẹ̀ṣẹ̀ sọ ni àmì tàbí ìpìlẹ̀ tí a fi ń mọ ìyàtọ̀ náà.
- source_word: γινώσκομεν
  choice: ni a fi mọ
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú γινώσκων, nígbà tí ètò gbolohun Yorùbá náà fi ìtumọ̀ ìdánimọ̀ tàbí ìyàtọ̀ hàn.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Ẹ̀mí òtítọ́
  rationale: Nínú àwọn ìwé Johanu, gbólóhùn yìí sábà máa ń tọ́ka sí Ẹ̀mí Mímọ́; lílo lẹ́tà ńlá fi ìtọ́kasí ẹni hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí àǹfààní ìtumọ̀ gbogbogbò dúró.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: ẹ̀mí ìṣìnà
  rationale: Ìṣìnà ní Yorùbá lè túmọ̀ sí yíyapa kúrò nínú òtítọ́ tàbí mímú ẹlòmíràn ṣìnà, ó sì bá ìdàkejì òtítọ́ mu láì dín πλάνη kù sí àṣìṣe lasán.
theological_decisions:
- issue: Bóyá πνεῦμα nínú τὸ πνεῦμα τῆς ἀληθείας ń tọ́ka sí Ẹ̀mí Mímọ́ ní pàtó
  choice: Ẹ̀mí òtítọ́
  alternative: ẹ̀mí òtítọ́
  rationale: Àyíká dídán àwọn ẹ̀mí wò àti lílo gbólóhùn náà nínú Johanu mú kí ìtọ́kasí sí Ẹ̀mí Mímọ́ ṣeé ṣe jù; lẹ́tà ńlá ni a lò, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn mọ́.
- issue: Bóyá ἀκούει ἡμῶν túmọ̀ sí gbígbọ́ lásán tàbí fífetí sí ẹ̀rí àwọn aposteli pẹ̀lú ìtẹ́wọ́gbà
  choice: ń fetí sí wa
  alternative: ń gbọ́ tiwa
  rationale: Ọ̀rọ̀ náà ń ṣàpèjúwe bí ènìyàn ṣe ń gba ẹ̀kọ́ àwọn aposteli; ‘fetí sí’ fi ìtẹ́wọ́gbà hàn láì fi ìtumọ̀ ‘gbọ́ràn’ tí ó lágbára ju ti Giriki lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Ti Ọlọ́run’ jẹ́ àdánidá ju ‘láti ọ̀dọ̀ Ọlọ́run’ lọ nínú gbolohun yìí, nígbà tí ó ṣì pa èrò orísun àti jíjẹ́ tirẹ̀ mọ́.
