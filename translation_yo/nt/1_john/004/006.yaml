revisions:
- from: Àwa ti Ọlọ́run ni. Ẹni tí ó mọ Ọlọ́run ń fetí sí wa; ẹni tí kì í ṣe ti Ọlọ́run kì í fetí sí wa.[a] Nípa èyí ni a fi mọ Ẹ̀mí òtítọ́[b] àti ẹ̀mí ìṣìnà.[c]
  to: Àwa jẹ́ ti Ọlọ́run. Ẹni tí ó mọ Ọlọ́run máa ń fetí sí wa; ẹni tí kò jẹ́ ti Ọlọ́run kò fetí sí wa.[a] Nípa èyí ni a fi mọ Ẹ̀mí òtítọ́[b][c] àti ẹ̀mí ìṣìnà.
  rationale: Àtúnṣe náà jẹ́ ti gírámà àti ìtọ́kasí àlàyé nìkan. A fi ‘jẹ́’ kún gbolohun àkọ́kọ́ fún kíkún àti ìmúlò Yorùbá tó rọrùn; a lo ‘máa ń’ láti hàn ipa ànímọ́/gbogbogbò ti àwọn participle náà; a sì gbe àwọn àmì [b] àti [c] sí lẹ́yìn ‘Ẹ̀mí òtítọ́,’ níbi tí àlàyé wọn ti kan. Kò sí ìyípadà sí ìtumọ̀ tàbí ìpinnu ẹ̀kọ́-ìsìn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:38:45Z'
