id: 1JN.4.9
reference: 1 John 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: yo
  text: 'Nínú èyí ni a fi ìfẹ́ Ọlọ́run hàn láàárín wa[b]: pé Ọlọ́run ti rán Ọmọ rẹ̀ kan ṣoṣo[a] sí ayé, kí àwa lè ní ìyè nípasẹ̀ rẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ìtumọ̀ ìbílẹ̀: “Ọmọ rẹ̀ tí a bí kan ṣoṣo.” Ọ̀rọ̀ Gíríìkì μονογενής tẹnumọ́ pé Ọmọ náà jẹ́ aláìlẹ́gbẹ́, ẹni kan ṣoṣo ní irú ipò rẹ̀.'
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ apá yìí pé, “Nínú èyí ni a fi ìfẹ́ Ọlọ́run hàn nínú wa.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí fífarahàn ìfẹ́ náà nínú àwọn onígbàgbọ́ tàbí láàárín wọn gẹ́gẹ́ bí àwùjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nínú èyí
  rationale: Ó pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́, ó sì ń tọ́ka sí gbólóhùn pé tí ó tẹ̀ lé gẹ́gẹ́ bí àlàyé ọ̀nà tí ìfẹ́ náà gbà farahàn.
- source_word: ἐφανερώθη
  choice: ni a fi ... hàn
  rationale: Ìtumọ̀ aláìlórúkọ olùṣe yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí a mú kí ó hàn gbangba, ó sì bá fọ́ọ̀mù àìṣe Gíríìkì mu.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: Ó túmọ̀ sí ìfẹ́ tí ó jẹ́ ti Ọlọ́run tàbí tí ó ti ọ̀dọ̀ rẹ̀ wá, gẹ́gẹ́ bí fífi Ọmọ ránṣẹ́ ṣe fi hàn.
- source_word: ἐν ἡμῖν
  choice: láàárín wa
  rationale: Ó mú ìtumọ̀ àwùjọ àti fífarahàn ní àárín àwọn onígbàgbọ́ jáde; àmọ́ Gíríìkì tún lè túmọ̀ sí ‘nínú wa,’ èyí tí akọsilẹ̀ ìsàlẹ̀ pa mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àlàyé ohun tí ó fi ìfẹ́ Ọlọ́run hàn sílẹ̀, dípò kí a mú un gẹ́gẹ́ bí ìdí nìkan.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: Ọmọ rẹ̀ kan ṣoṣo
  rationale: ‘Kan ṣoṣo’ fi ìyàtọ̀ àti ipò aláìlẹ́gbẹ́ Ọmọ náà hàn láìfi èrò ìbí sínú ọ̀rọ̀ μονογενής ní dandan.
- source_word: ἀπέσταλκεν
  choice: ti rán
  rationale: Àmì ‘ti’ fi iṣẹ́ tí a ti parí ṣùgbọ́n tí ipa rẹ̀ ṣì wà hàn, ní ìbámu pẹ̀lú perfect Gíríìkì.
- source_word: εἰς τὸν κόσμον
  choice: sí ayé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún rírán ẹnì kan wọ inú àgbáyé ènìyàn.
- source_word: ἵνα ζήσωμεν
  choice: kí àwa lè ní ìyè
  rationale: Ó fi ète rírán Ọmọ náà hàn; ‘ní ìyè’ dá ìtumọ̀ Jòhánù ti ζωή dúró dáadáa ju ‘wà láàyè’ lọ.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: 'Ó pa ìtumọ̀ ọ̀nà tàbí aṣojú mọ́: Ọmọ ni ọ̀nà tí a fi ń rí ìyè.'
theological_decisions:
- issue: Ìtumọ̀ μονογενής nípa Ọmọ
  choice: Ọmọ rẹ̀ kan ṣoṣo
  alternative: Ọmọ rẹ̀ tí a bí kan ṣoṣo; Ọmọ rẹ̀ aláìlẹ́gbẹ́
  rationale: Ọ̀rọ̀ náà tẹnumọ́ ìbáṣepọ̀ Ọmọ tí kò lẹ́gbẹ́ pẹ̀lú Baba. Àkọ́kọ́ ọ̀rọ̀ kò fi èrò ìbímọ̀ gẹ́gẹ́ bí ìṣe hàn ní dandan, ṣùgbọ́n akọsilẹ̀ pa ìtumọ̀ ìbílẹ̀ mọ́.
- issue: Agbára ἐν ἡμῖν
  choice: láàárín wa
  alternative: nínú wa
  rationale: ‘Láàárín wa’ mú ìhà àwùjọ àti fífarahàn ìfẹ́ náà hàn, ṣùgbọ́n ‘nínú wa’ ṣeé ṣe ní ti èdè Gíríìkì, nítorí náà a kò fi ìṣòro ìtumọ̀ náà pamọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, kedere, ó sì bójú mu fún kíkà ní gbangba. A lo ‘ní ìyè’ láti pa ìtumọ̀ ẹ̀kọ́ Jòhánù mọ́, a sì lo ‘àwa’ fún ìtẹnumọ́ ìdí rírán Ọmọ náà.
