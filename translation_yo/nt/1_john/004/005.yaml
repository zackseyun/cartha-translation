  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: yo
  text: Àwọn náà jẹ́ ti ayé[a]; nítorí náà, láti inú ayé ni wọ́n ń sọ̀rọ̀, ayé sì ń fetí sí wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ ọ́ sí: ‘Wọ́n jẹ́ ti ayé … wọ́n ń sọ̀rọ̀ láti inú ayé.’ Ọ̀rọ̀ Gíríìkì tún ‘láti inú ayé’ ṣe, ó ń tẹnumọ́ orísun tàbí ibi ìpilẹ̀ wọn.'
    reason: lexical_alternative
  - marker: b
    text: ‘Ayé’ níbí túmọ̀ sí ètò àwọn ènìyàn tí ó dojú kọ Ọlọ́run, kì í ṣe gbogbo ìṣẹ̀dá lásán.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: Àwọn náà
  rationale: Ó tọ́ka sí àwọn wòlíì èké tàbí àwọn ẹ̀mí tí a mẹ́nu kàn ṣáájú, ó sì pa ìyàtọ̀ wọn mọ́ sí ‘àwa’ nínú ẹsẹ tó tẹ̀ lé e láì fi ìtẹnumọ́ àpọ̀jù kún un.
- source_word: ἐκ τοῦ κόσμου
  choice: láti inú ayé
  rationale: Ọ̀rọ̀ ἐκ fi orísun tàbí ibi ìpilẹ̀ hàn. ‘Láti inú ayé’ pa ìtumọ̀ yìí àti àtúnwí ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: κόσμος
  choice: ayé
  rationale: Níbí, ó ń tọ́ka sí ètò àwọn ènìyàn tí ó dojú kọ Ọlọ́run, kì í ṣe gbogbo ìṣẹ̀dá tàbí ilẹ̀ ayé lásán. ‘Ayé’ pa ìró ẹ̀kọ́ Johanu mọ́ láì túmọ̀ ọ́ jù nínú ọ̀rọ̀ pàtàkì.
- source_word: διὰ τοῦτο
  choice: nítorí èyí
  rationale: Ó so orísun wọn pọ̀ mọ́ irú ọ̀rọ̀ tí wọ́n ń sọ, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: λαλοῦσιν
  choice: ń sọ̀rọ̀
  rationale: Àkókò ìṣe lọ́wọ́ nínú Gíríìkì ní agbára ìṣe àṣà tàbí ohun tí wọ́n máa ń ṣe; ‘ń sọ̀rọ̀’ jẹ́ èdè Yorùbá tó ṣe déédé.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: láti inú ayé ni wọ́n ti ń sọ̀rọ̀
  rationale: Ó tún àkójọpọ̀ ‘láti inú ayé’ ṣe gẹ́gẹ́ bí Gíríìkì, ó sì tẹnumọ́ pé ayé ni orísun àti àkóónú ìsọ̀rọ̀ wọn.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: ayé sì ń fetí sí wọn
  rationale: ‘Fetí sí’ fi ìgbọ́ tí ó tẹ́wọ́ gba ọ̀rọ̀ hàn, kì í ṣe kíkàn gbọ́ ohùn lásán.
theological_decisions:
- issue: Ìtumọ̀ κόσμος nínú ẹ̀kọ́ Johanu
  choice: ‘ayé’ túmọ̀ sí ètò àwọn ènìyàn tí ó yapa sí Ọlọ́run, kì í ṣe gbogbo ìṣẹ̀dá
  alternative: ayé gẹ́gẹ́ bí gbogbo ìṣẹ̀dá tàbí gbogbo aráyé láìsí ìtumọ̀ ìwà-ẹ̀mí
  rationale: Àyíká ọ̀rọ̀ fi àwọn tí wọ́n ‘wá láti ọ̀dọ̀ Ọlọ́run’ wé àwọn tí wọ́n ‘wá láti inú ayé’; nítorí náà, orísun àti ìfarahàn ti ẹ̀mí àti ìwà ni a ń sọ̀rọ̀ nípa rẹ̀.
- issue: Agbára ìtẹnumọ́ αὐτοὶ
  choice: Àwọn náà
  alternative: Àwọn fúnra wọn
  rationale: ‘Àwọn náà’ pa ìyàtọ̀ mọ́ láì mú ìtẹnumọ́ náà le ju bí ó ti yẹ lọ ní Yorùbá.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu, a sì pa àtúnwí ‘láti inú ayé’ mọ́ láti fi ìtẹnumọ́ orísun nínú Gíríìkì hàn.
