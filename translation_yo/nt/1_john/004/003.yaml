id: 1JN.4.3
reference: 1 John 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: yo
  text: Gbogbo ẹ̀mí tí kò jẹ́wọ́ Jésù kò ti ọ̀dọ̀ Ọlọ́run wá[a]. Èyí sì ni ẹ̀mí Aṣòdì-sí-Kristi[b], èyí tí ẹ ti gbọ́ pé ó ń bọ̀, ó sì ti wà nínú ayé nísinsìnyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, “tí kò jẹ́wọ́ pé Jésù Kristi ti wá nínú ara.”
    reason: textual_variant
  - marker: b
    text: Ní ṣókí, Gíríìkì ní, “Èyí ni ti Aṣòdì-sí-Kristi”; kò tún ọ̀rọ̀ náà “ẹ̀mí” sọ ní gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: gbogbo ẹ̀mí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀kọ̀ọ̀kan àwọn agbára tàbí ìdarí ti ẹ̀mí tí a gbọ́dọ̀ dán wò; kì í ṣe Ẹ̀mí Mímọ́ níbí.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: jẹ́wọ́ Jésù
  rationale: “Jẹ́wọ́” fi ìtumọ̀ gbígba àti jíjẹ́rìí ní gbangba hàn, ó sì tẹ̀ lé àkójọpọ̀ ọ̀rọ̀ kúkúrú inú SBLGNT láì fi gbólóhùn ẹsẹ 2 kún un.
- source_word: ἐκ τοῦ θεοῦ
  choice: ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ orísun tàbí ibi tí ohun kan ti wá.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Èyí sì ni ẹ̀mí Aṣòdì-sí-Kristi
  rationale: Gíríìkì fi orúkọ tí a ń tọ́ka sí sílẹ̀, ṣùgbọ́n “ẹ̀mí” ni àyíká gbólóhùn mú kí ó yé. Fífi í kún un mú Yorùbá ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ fi àkójọpọ̀ Gíríìkì hàn.
- source_word: ἀντιχρίστου
  choice: Aṣòdì-sí-Kristi
  rationale: Àṣàyàn yìí sọ ipa ẹni náà ní kedere, ó sì jẹ́ akọlé pàtó nínú àyíká ọ̀rọ̀ Johanu.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: èyí tí ẹ ti gbọ́ pé ó ń bọ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì jẹ́ aláìlẹ́gbẹ́ akọ tàbí abo, ó sì tọ́ka sí ohun tí a ṣẹ̀ṣẹ̀ sọ; Yorùbá “ó” kò fi akọ tàbí abo kún un.
- source_word: ἤδη ἐν τῷ κόσμῳ ἐστίν
  choice: ó sì ti wà nínú ayé nísinsìnyí
  rationale: “Ti wà ... nísinsìnyí” fi ìtẹnumọ́ ἤδη hàn pé ó ti bẹ̀rẹ̀ sí í wà ní ayé báyìí gan-an.
theological_decisions:
- issue: Ìrísí ìjẹ́wọ́ tí ẹ̀mí náà kò ṣe
  choice: Tẹ̀ lé àkójọpọ̀ kúkúrú SBLGNT, “kò jẹ́wọ́ Jésù,” nínú ọ̀rọ̀ pàtàkì.
  alternative: “Kò jẹ́wọ́ pé Jésù Kristi ti wá nínú ara.”
  rationale: Ẹ̀rí àkójọpọ̀ ìwé Gíríìkì tí a lò ṣe àtìlẹ́yìn fún ìrísí kúkúrú; àlàyé ìsàlẹ̀ pa ìrísí gígùn tí àwọn ìwé àfọwọ́kọ kan ní mọ́.
- issue: Bí a ṣe máa sọ gbólóhùn tí Gíríìkì kò parí ní kíkún
  choice: Fi “ẹ̀mí” tí àyíká ọ̀rọ̀ túmọ̀ sí kún un nínú ọ̀rọ̀ pàtàkì.
  alternative: “Èyí ni ti Aṣòdì-sí-Kristi.”
  rationale: Ọ̀nà kúkúrú náà fara mọ́ ìrísí Gíríìkì, ṣùgbọ́n ó le dà bí ọ̀rọ̀ tí kò pé ní Yorùbá. Fífi “ẹ̀mí” kún un mú un ṣe kedere láì yí ohun tí àyíká sọ padà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Aṣòdì-sí-Kristi” ni a lò gẹ́gẹ́ bí akọlé pàtó, “ó” sì pa àìdánimọ̀ akọ tàbí abo inú Gíríìkì mọ́.
