id: 1JN.4.7
reference: 1 John 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́[a], ẹ jẹ́ kí a nífẹ̀ẹ́ ara wa, nítorí ìfẹ́ wá láti ọ̀dọ̀ Ọlọ́run; ẹnikẹ́ni tí ó nífẹ̀ẹ́ ni a ti bí láti ọ̀dọ̀ Ọlọ́run, ó sì mọ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ẹ̀yin ọ̀rẹ́ ọ̀wọ́n.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ìkíni fún àwọn ẹni tí a fẹ́ràn, ó sì ní ìsopọ̀ pẹ̀lú àwọn ọ̀rọ̀ fún “ìfẹ́” àti “nífẹ̀ẹ́” tí a tún lò nínú ẹsẹ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ àkọ́lé àpèjúwe ní ọ̀pọ̀ ènìyàn ni; ó jẹ́ ọ̀nà ìkíni onífẹ̀ẹ́, ó sì pa ìsopọ̀ pẹ̀lú gbòǹgbò ọ̀rọ̀ ἀγαπ- mọ́ nínú ẹsẹ yìí.
- source_word: ἀγαπῶμεν
  choice: ẹ jẹ́ kí a nífẹ̀ẹ́
  rationale: Ìṣe subjunctive oníṣírí hortatory ni, tó ń pe olùkọ̀wé àti àwọn olùgbọ́ pọ̀ sí ìfẹ́; ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá láìfi ìtẹnumọ́ ìtẹ̀síwájú kún un.
- source_word: ἀλλήλους
  choice: ara wa
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún reciprocal pronoun ní àyíká yìí.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tàbí ohun tó fa ìmòràn náà hàn ní kedere.
- source_word: ἡ ἀγάπη
  choice: ìfẹ́
  rationale: Ó túmọ̀ nọ́ńbà náà ní tààrà, ó sì pa àtúnwí gbòǹgbò ἀγαπ- mọ́.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ti ọ̀dọ̀ Ọlọ́run wá
  rationale: ἐκ ń tọ́ka sí orísun; gbólóhùn Yorùbá yìí sọ pé Ọlọ́run ni orísun ìfẹ́.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: olúkúlùkù ẹni tí ó bá nífẹ̀ẹ́
  rationale: Ó mú ìtumọ̀ gbogbo ènìyàn nínú substantival participle náà jáde ní Yorùbá tó ṣe kedere, pẹ̀lú agbára gbólóhùn gbogbogbò.
- source_word: γεγέννηται
  choice: ni a ti bí
  rationale: Perfect passive ni; ‘a ti bí’ ń fi ìṣe tó ti ṣẹlẹ̀ hàn, tí àbájáde rẹ̀ sì wà títí di ìsinsìnyí.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ni a ti bí láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa èrò orísun tàbí ìpilẹ̀ láti ọ̀dọ̀ Ọlọ́run mọ́, láìyí passive náà padà sí active.
- source_word: γινώσκει τὸν θεόν
  choice: ó sì mọ Ọlọ́run
  rationale: Present tense náà ń sọ ìmọ̀ Ọlọ́run tó ń bẹ lọ́wọ́; ‘mọ Ọlọ́run’ jẹ́ ìtumọ̀ tààrà tó sì jẹ́ àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìfẹ́, bíbí láti ọ̀dọ̀ Ọlọ́run, àti mímọ Ọlọ́run
  choice: A túmọ̀ gbólóhùn náà ní tààrà pé ẹni tó nífẹ̀ẹ́ ni a ti bí láti ọ̀dọ̀ Ọlọ́run, ó sì mọ Ọlọ́run.
  alternative: Kí a sọ ọ́ di àlàyé ẹ̀kọ́ ìgbàlà tó ń pinnu bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn, tàbí kí a sọ ọ́ di ìlànà ìwà rere lásán.
  rationale: Gíríìkì so àwọn ohun mẹ́tẹ̀ẹ̀ta pọ̀, ṣùgbọ́n kò ṣàlàyé ètò ìgbàlà ní ìlànà ẹ̀kọ́ ìjọ kankan; ìtumọ̀ náà pa ìsopọ̀ ẹ̀kọ́ Johanu mọ́ láìfikún tàbí dín un kù.
- issue: Àtúnwí ἀγάπη / ἀγαπάω
  choice: Lo ‘olùfẹ́,’ ‘nífẹ̀ẹ́,’ àti ‘ìfẹ́’ láti jẹ́ kí ìdílé ọ̀rọ̀ ìfẹ́ hàn.
  alternative: Lo ìkíni bí ‘ẹ̀yin ọ̀rẹ́ ọ̀wọ́n’ tí yóò mú ìsopọ̀ ọ̀rọ̀ náà ṣòro láti rí.
  rationale: Àtúnwí gbòǹgbò ἀγαπ- jẹ́ apá pàtàkì ti ọ̀nà tí Johanu gbà kọ ẹsẹ náà; àwọn ọ̀rọ̀ Yorùbá yìí pa ìsopọ̀ náà mọ́ níwọ̀n tó bá ṣe àdánidá.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. ‘Ẹ̀yin olùfẹ́’ jẹ́ ìkíni tó ní iyì, bí ó tilẹ̀ jẹ́ pé ‘ẹ̀yin ọ̀rẹ́ ọ̀wọ́n’ lè dun bí ọ̀rọ̀ ojoojúmọ́ síi; àkọ́kọ́ ni a yàn láti pa àtúnwí ọ̀rọ̀ ìfẹ́ mọ́. Gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
