    issue: “Òfin” fún ἐντολή
    rationale: “Òfin” lè túmọ̀ sí law, pàápàá òfin ìjọba tàbí òfin tí a kọ sílẹ̀. “Àṣẹ” ni ọ̀rọ̀ tó péye jù fún ἐντολή nínú àyíká Johanu yìí.
  - severity: low
    issue: “Pẹ̀lú” ní ipari gẹ́gẹ́ bí ìtumọ̀ καί kejì
    rationale: Ó lè dà bí ‘together with’ nínú Yorùbá. “Nàá” lẹ́yìn ohun tí a fẹ́ràn ń ṣàfihàn ‘also’ dáadáa, ó sì ń mú gbolohun náà rọrùn.
