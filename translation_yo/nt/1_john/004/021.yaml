id: 1JN.4.21
reference: 1 John 4:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: yo
  text: 'A sì ní àṣẹ yìí láti ọ̀dọ̀ rẹ̀: kí ẹni tí ó nífẹ̀ẹ́ Ọlọ́run nífẹ̀ẹ́ arákùnrin rẹ̀ náà.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin tàbí arábìnrin rẹ̀.” Gíríìkì ní “arákùnrin rẹ̀,” ó sì lo ìrísí akọ nínú ẹyọ̀n tí ó lè dúró gẹ́gẹ́ bí aṣojú fún ẹlẹgbẹ́ onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: òfin
  rationale: “Òfin” sọ àṣẹ tí ó ní agbára àti ojúṣe ìwà rere jáde ní Yorùbá àdánidá; ní àyíká yìí, kì í ṣe òfin ìjọba, bí kò ṣe àṣẹ Ọlọ́run.
- source_word: ἀπ’ αὐτοῦ
  choice: láti ọ̀dọ̀ rẹ̀
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́ dípò lílo “láti ọ̀dọ̀ Ọlọ́run”; ẹni tí “rẹ̀” ń tọ́ka sí ni Ọlọ́run gẹ́gẹ́ bí àyíká ẹsẹ̀ ṣe fi hàn.
- source_word: ἵνα
  choice: kí
  rationale: Níhìn-ín, ἵνα ń ṣàlàyé ohun tí òfin náà ń béèrè; “kí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ojúṣe yìí hàn.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: ẹni tí ó bá nífẹ̀ẹ́ Ọlọ́run
  rationale: “Ẹni tí ó bá” dúró fún ẹni kọ̀ọ̀kan ní ọ̀nà àdánidá tí kò sì fi akọ tàbí abo kún ohun tí ọ̀rọ̀ náà ń tẹnumọ́.
- source_word: ἀγαπᾷ
  choice: nífẹ̀ẹ́
  rationale: Ìṣe náà wà lẹ́yìn “kí,” nítorí náà ó fi ohun tí àṣẹ náà ń béèrè hàn láì sọ ọ́ di gbólóhùn àlàyé lasan.
- source_word: ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: A pa ẹyọ akọ inú Gíríìkì mọ́ nínú àyọkà; àlàyé ìsàlẹ̀ ojú ìwé fi hàn pé ó lè dúró fún arákùnrin tàbí arábìnrin nínú ìgbàgbọ́.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: '“Pẹ̀lú” mú agbára àfikún καὶ kejì jáde: ìfẹ́ sí Ọlọ́run gbọ́dọ̀ ní ìfẹ́ sí arákùnrin ẹni ní ìbámu pẹ̀lú rẹ̀.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: nífẹ̀ẹ́
  rationale: A lo ọ̀rọ̀ kan náà fún àwọn ìfarahàn méjèèjì láti pa ìsopọ̀ kókó ọ̀rọ̀ Johanu mọ́.
theological_decisions:
- issue: Ìtọ́kasí ẹyọ akọ nínú ἀδελφὸν αὐτοῦ
  choice: A lo “arákùnrin rẹ̀” nínú àyọkà, a sì ṣàlàyé ìtumọ̀ aṣojú rẹ̀ ní àlàyé ìsàlẹ̀ ojú ìwé.
  alternative: “arákùnrin tàbí arábìnrin rẹ̀” tàbí “ẹlẹgbẹ́ rẹ̀ nínú ìgbàgbọ́”
  rationale: Gíríìkì lo ẹyọ akọ ní tààrà, ṣùgbọ́n nínú àyíká ìjọ ó lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ ní gbogbogbòò. Ìtumọ̀ yìí pa ìrísí orísun mọ́ láì fi ìwọ̀n ìtumọ̀ rẹ̀ pamọ́.
- issue: Ẹni tí arọ́pò-orúkọ αὐτοῦ ń tọ́ka sí
  choice: A pa “rẹ̀” mọ́, Ọlọ́run ni ẹni tí àyíká tọ́ka sí.
  alternative: “láti ọ̀dọ̀ Ọlọ́run”
  rationale: Orísun lo arọ́pò-orúkọ, kò tún “Ọlọ́run” sọ. Pípa arọ́pò-orúkọ mọ́ ń dáàbò bo ìṣàn ọ̀rọ̀ àti ìtọ́kasí orísun.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “Àwa sì ní” láti pa καὶ ìbẹ̀rẹ̀ mọ́, “láti ọ̀dọ̀ rẹ̀” fún ìtọ́kasí arọ́pò-orúkọ, àti “pẹ̀lú” láti mú agbára àfikún καὶ kejì hàn.
