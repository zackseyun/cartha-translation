id: 1JN.4.12
reference: 1 John 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: yo
  text: Kò sí ẹni tí ó ti rí Ọlọ́run rí; bí a bá nífẹ̀ẹ́ ara wa, Ọlọ́run ń gbé nínú wa, ìfẹ́ rẹ̀[a] sì ti pé nínú wa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “ìfẹ́ wa sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìfẹ́ Ọlọ́run sí wa tàbí ìfẹ́ wa sí Ọlọ́run; àyíká ọ̀rọ̀ yìí ṣètìlẹ́yìn fún ìfẹ́ Ọlọ́run sí wa.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìfẹ́ náà ti dé ìmúṣẹ̀ nínú wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται … πώποτε
  choice: tí ó ti rí … rí
  rationale: 'Àkópọ̀ “ti rí … rí” pẹ̀lú ìkọ̀ “Kò sí ẹni” fi ìtumọ̀ perfect tense àti πώποτε hàn lọ́nà Yorùbá àdánidá: kò sí ẹni tí ó rí Ọlọ́run nígbà kan rí.'
- source_word: ἐὰν ἀγαπῶμεν ἀλλήλους
  choice: bí a bá nífẹ̀ẹ́ ara wa
  rationale: “Bí … bá” pa ipò àídájú ἐάν mọ́, “nífẹ̀ẹ́” sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἀγαπάω; “ara wa” sọ ìṣe àfẹ̀hìntì ἀλλήλους di mímọ́.
- source_word: μένει
  choice: ń gbé inú wa
  rationale: Nínú àyíká ọ̀rọ̀ Johanu, “ń gbé inú wa” sọ ìbáṣepọ̀ tí ń bá a lọ àti ìwànínú Ọlọ́run hàn ní èdè Yorùbá tó ṣe kedere ju ìtumọ̀ gígangan “ń dúró” lọ.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: ìfẹ́ rẹ̀
  rationale: Èyí pa ìsọ̀rọ̀ Gíríìkì náà mọ́ láì fi àlàyé sínú ọ̀rọ̀ pàtàkì; àyíká ẹsẹ 10–11 ṣètìlẹ́yìn fún ìtumọ̀ pé ìfẹ́ Ọlọ́run sí wa ni.
- source_word: τετελειωμένη ἐστιν
  choice: ti pé
  rationale: “Ti pé” fi ipò tó ti dé sí ìmúṣẹ̀, tí àbájáde rẹ̀ sì ń bá a lọ, hàn ní ṣókí àti ní Yorùbá àdánidá.
- source_word: ἐν ἡμῖν
  choice: inú wa / nínú wa
  rationale: A pa ìtumọ̀ “nínú wa” mọ́ ní ibi méjèèjì; ìyàtọ̀ fọ́ọ̀mù náà jẹ́ nítorí gírámà Yorùbá, kì í ṣe ìyàtọ̀ ìtumọ̀.
theological_decisions:
- issue: Ìtumọ̀ ἡ ἀγάπη αὐτοῦ (“ìfẹ́ rẹ̀”)
  choice: Ìfẹ́ Ọlọ́run sí wa ni a gbé sí iwájú gẹ́gẹ́ bí ìtumọ̀ tó ṣeé ṣe jù.
  alternative: Ìfẹ́ wa sí Ọlọ́run ti pé nínú wa.
  rationale: Ọ̀rọ̀ tó ṣáájú, pàápàá ẹsẹ 10–11, tẹnumọ́ ìfẹ́ tí Ọlọ́run kọ́kọ́ fi hàn. Síbẹ̀, irú genitive Gíríìkì yìí lè túmọ̀ sí ìfẹ́ wa sí Ọlọ́run, nítorí náà àkọsílẹ̀ ìsàlẹ̀ pa àṣàyàn náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì yé ẹni gbogbogbòò. A lo “ń gbé inú wa” fún μένει láti fi àkòrí ìwànínú Johanu hàn lọ́nà àdánidá. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
