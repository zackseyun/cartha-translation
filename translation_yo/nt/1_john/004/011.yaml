  to: Ẹ̀yin olùfẹ́ [a], bí Ọlọ́run bá ti fẹ́ràn wa tó bẹ́ẹ̀, ó yẹ kí àwa náà fẹ́ràn ara wa.
  rationale: Àtúnṣe náà fi ‘fẹ́ràn’ rọ́pò ‘fẹ́’ kí ìfẹ́, kì í ṣe ìfẹ́ ohun kan, lè hàn gbangba; ó yọ ‘máa’ kúrò kí ó má ba fi aspect kún ìtumọ̀; ó sì fi ‘ti’ kun ìpín àídájú láti ṣàfihàn ìṣe aorist tí Ọlọ́run ṣe. Ìkọ̀lé ‘bí ... bá’ àti ìtumọ̀ àídájú rẹ̀ wà nípamọ́.
