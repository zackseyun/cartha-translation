  verdict: revise
  source_fidelity: Àkọlé ‘bí Ọlọ́run bá fẹ́ wa tó bẹ́ẹ̀’ ń pa ìkọ̀lé àídájú mọ́, ṣùgbọ́n ‘bá ti fẹ́ràn’ ń fi ìṣe ìfẹ́ Ọlọ́run tí a ti parí hàn dáadáa, gẹ́gẹ́ bí aorist ἠγάπησεν. ‘Fẹ́ràn ara wa’ tún ṣàlàyé ìfẹ́ ìbáṣepọ̀ ἀγαπᾶν ἀλλήλους ní kedere.
  naturalness: ‘Fẹ́ràn’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ‘love’; ‘fẹ́’ nìkan lè túmọ̀ sí ‘want’ níbi kan. Yíyọ ‘máa’ kúrò nínú ìpín kejì yẹra fún fífi ìṣe àṣà-tí-ń-tẹ̀síwájú kún infinitive Gíríìkì láìnídìí.
  terminology: ‘Ẹ̀yin olùfẹ́,’ ‘Ọlọ́run,’ àti ‘ó yẹ kí àwa náà’ bójú mu ìpè onífẹ̀ẹ́, orúkọ Ọlọ́run, àti ojúṣe ìwà rere tó wà nínú ọ̀rọ̀ ìpilẹ̀. ‘Ara wa’ ní àyíká ọ̀rọ̀ yìí ń ṣiṣẹ́ gẹ́gẹ́ bí arọ́pò-orúkọ ìbáṣepọ̀.
