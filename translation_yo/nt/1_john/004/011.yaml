id: 1JN.4.11
reference: 1 John 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́ [a], bí Ọlọ́run bá ti fẹ́ràn wa tó bẹ́ẹ̀, ó yẹ kí àwa náà fẹ́ràn ara wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ apá yìí sí, “Níwọ̀n bí Ọlọ́run ti fẹ́ràn wa ní ọ̀nà yìí.” Èdè Gíríìkì lo ọ̀nà àídájú (“bí”), ṣùgbọ́n ó ṣeé ṣe kó ń gbà pé ohun tí a sọ jẹ́ òótọ́ nínú àyíká ọ̀rọ̀ náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ni; ó fi ìfẹ́ onífẹ̀ẹ́ hàn, ó sì pa ìsopọ̀ mọ́ àwọn ọ̀rọ̀ ἀγαπάω tó tún wà nínú ẹsẹ yìí.
- source_word: εἰ
  choice: bí ... bá
  rationale: Ìkọ̀lé yìí pa ọ̀nà àídájú Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ gbà pé ohun tí a sọ jẹ́ òótọ́.
- source_word: οὕτως
  choice: tó bẹ́ẹ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí bí ìfẹ́ Ọlọ́run ṣe rí tàbí bí ó ṣe tóbi tó, láìfi ìtumọ̀ kan ṣoṣo múlẹ̀.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Ìtumọ̀ tààrà fún ẹni tó jẹ́ olùṣe nínú gbólóhùn náà.
- source_word: ἠγάπησεν
  choice: fẹ́
  rationale: Ó túmọ̀ ìṣe ἀγαπάω ní kedere, ó sì pa ìsopọ̀ ọ̀rọ̀ ìfẹ́ jálẹ̀ ẹsẹ náà mọ́.
- source_word: ἡμᾶς
  choice: wa
  rationale: Arọ́pò-orúkọ ẹni àkọ́kọ́ ọ̀pọ̀ gẹ́gẹ́ bí ohun tí ìṣe náà kàn.
- source_word: καὶ ἡμεῖς
  choice: àwa náà
  rationale: Ó mú ìtẹnumọ́ arọ́pò-orúkọ ἡμεῖς àti ìtumọ̀ καί jáde ní Yorùbá àdánidá.
- source_word: ὀφείλομεν
  choice: ó yẹ kí
  rationale: Ó sọ ojúṣe ìwà rere tó wà nínú ὀφείλω, láìsọ ọ́ di àṣẹ líle ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ lọ.
- source_word: ἀλλήλους
  choice: ara wa
  rationale: Ìtumọ̀ àdánidá Yorùbá fún arọ́pò-orúkọ ìbáṣepọ̀ aláfẹ̀yìntì ‘ara wa.’
- source_word: ἀγαπᾶν
  choice: máa fẹ́
  rationale: Ó túmọ̀ infinitive present náà lọ́nà tó bá Yorùbá mu, ‘máa’ sì lè fi ìṣe tó ń bá a lọ hàn.
theological_decisions:
- issue: Agbára gbólóhùn àídájú εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: Pa àídájú mọ́ pẹ̀lú ‘bí Ọlọ́run bá fẹ́ wa tó bẹ́ẹ̀.’
  alternative: ‘Níwọ̀n bí Ọlọ́run ti fẹ́ wa lọ́nà yìí.’
  rationale: Àyíká ọ̀rọ̀ gbà pé ìfẹ́ Ọlọ́run jẹ́ òótọ́, ṣùgbọ́n Gíríìkì fi í sí ọ̀nà àídájú fún agbára ìṣírí; ìtumọ̀ náà kò gbọ́dọ̀ sọ ìyẹn di ìdí pàtó nìkan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá fún òǹkàwé òde òní. A lo ‘Ẹ̀yin olùfẹ́’ gẹ́gẹ́ bí ìpè onífẹ̀ẹ́, ‘bí ... bá’ láti pa ìkọ̀lé àídájú mọ́, àti ‘ó yẹ kí’ fún ojúṣe ìwà rere.
