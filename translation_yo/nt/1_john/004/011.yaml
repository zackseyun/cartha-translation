    rationale: Nínú Yorùbá òde òní, ‘fẹ́’ sábà máa ń túmọ̀ sí ‘want’; ‘fẹ́ràn’ ń jẹ́ kí ìtumọ̀ ἀγαπάω/ἀγαπᾶν, ìyẹn ìfẹ́, hàn gbangba.
  - severity: low
    issue: ‘máa’ fi ìrísí ìṣe àtẹ̀síwájú/habitual kún ọ̀rọ̀ náà
