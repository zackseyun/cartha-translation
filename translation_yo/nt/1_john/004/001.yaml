id: 1JN.4.1
reference: 1 John 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: yo
  text: Ẹ̀yin ọ̀wọ́n[a], ẹ má ṣe gba gbogbo ẹ̀mí gbọ́, ṣùgbọ́n ẹ dán àwọn ẹ̀mí wò láti mọ̀ bóyá láti ọ̀dọ̀ Ọlọ́run ni wọ́n ti wá[b], nítorí ọ̀pọ̀ wòlíì èké ti jáde lọ sínú ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ẹ̀yin ọ̀rẹ́ ọ̀wọ́n.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tààrà pé “àwọn ẹni tí a fẹ́ràn.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, a yẹ orísun ẹ̀mí tó wà lẹ́yìn ohun tí ẹnì kan sọ pé ó ti ọ̀dọ̀ Ọlọ́run wá wò; gbólóhùn tó tẹ̀ lé e pe àwọn ènìyàn tó ń sọ irú ọ̀rọ̀ bẹ́ẹ̀ ní “wòlíì èké.”
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́ ọ̀wọ́n
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ènìyàn ni, ó sì fi ìfẹ́ jíjinlẹ̀ hàn. Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú èrò ìfẹ́.
- source_word: παντὶ πνεύματι
  choice: gbogbo ẹ̀mí
  rationale: A pa àwòrán ti ọ̀rọ̀ Gíríìkì mọ́, kí a má bàa dín ìtumọ̀ rẹ̀ kù sí àwọn olùkọ́ ènìyàn tàbí ọ̀rọ̀ àsọtẹ́lẹ̀ nìkan.
- source_word: πιστεύετε
  choice: gba ... gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ fún gbígba ohun kan gẹ́gẹ́ bí òtítọ́; àṣẹ ìkọ̀ ni ẹ má ṣe fi hàn.
- source_word: δοκιμάζετε
  choice: dán ... wò
  rationale: Ó túmọ̀ sí fífi ohun kan yẹ̀ wò láti mọ bóyá ó jẹ́ ojúlówó, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: τὰ πνεύματα
  choice: àwọn ẹ̀mí
  rationale: A pa èdè nípa ẹ̀mí gẹ́gẹ́ bí ó ti wà nínú orísun mọ́, láì sọ ọ́ di àwọn olùkọ́ tàbí àwọn ẹ̀kọ́ nìkan.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: láti mọ̀ bóyá láti ọ̀dọ̀ Ọlọ́run ni wọ́n ti wá
  rationale: Ìtumọ̀ orísun tàbí ìpilẹ̀ ni ἐκ níbí. Gbólóhùn yìí dára ní Yorùbá, ó sì mú ète ìdánwò náà hàn láì yanjú ìṣòro ọ̀rọ̀ kọjá ohun tí àyọkà sọ.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: ọ̀pọ̀ èké wòlíì
  rationale: Èyí jẹ́ ìtumọ̀ tààrà àti èdè Yorùbá tí a mọ̀ fún àwọn tí wọ́n ń sọ àsọtẹ́lẹ̀ èké.
- source_word: ἐξεληλύθασιν
  choice: ti jáde lọ
  rationale: Ó pa àwòrán ìjáde lọ mọ́, ó sì fi hàn pé ìṣe náà ti ṣẹlẹ̀, àwọn náà sì ń ṣiṣẹ́ nínú ayé báyìí.
- source_word: εἰς τὸν κόσμον
  choice: sínú ayé
  rationale: Èyí pa ìtumọ̀ gbooro ti κόσμος mọ́ láì fi èrò ‘ètò ayé’ kún un.
theological_decisions:
- issue: Ohun tí ‘àwọn ẹ̀mí’ ń tọ́ka sí
  choice: Àwọn ẹ̀mí tàbí orísun ẹ̀mí tó wà lẹ́yìn àwọn ohun tí àwọn wòlíì ń sọ, tí a sì ń fi àwọn ènìyàn tó ń sọ̀rọ̀ náà yẹ̀ wò
  alternative: Àwọn olùkọ́ ènìyàn nìkan, tàbí àwọn ọ̀rọ̀ àsọtẹ́lẹ̀ lásán
  rationale: Àyọkà náà sọ ‘àwọn ẹ̀mí’ lẹ́yìn náà ó sì mẹ́nu kan ‘èké wòlíì.’ Nítorí náà, a pa èdè nípa ẹ̀mí mọ́, láì sọ pé àwọn ẹ̀mí náà jẹ́ àwọn ènìyàn nìkan.
translation_notes:
  register: Èdè Yorùbá tó lérò, tó bọ́gbọ́n mu, tí ó sì ṣeé lóye ni a lò. Fọ́ọ̀mù ọ̀wọ̀ ọ̀pọ̀ ènìyàn ‘ẹ̀yin/ẹ’ bá ọ̀rọ̀ ìpè àti àwọn àṣẹ ọ̀pọ̀ inú Gíríìkì mu. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
