id: 1JN.4.17
reference: 1 John 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: yo
  text: Nípa èyí[a][d] ni ìfẹ́ ti dé àṣepé pẹ̀lú wa, kí a lè ní ìgboyà[b] ní ọjọ́ ìdájọ́, nítorí gẹ́gẹ́ bí òun[c] ṣe rí, bẹ́ẹ̀ náà ni àwa náà ṣe rí ní ayé yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “Nípa èyí ni ìfẹ́ ti dé àṣepé láàárín wa.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ọ̀nà tàbí ipò; “pẹ̀lú wa” sì tún lè jẹ́ “láàárín wa.”
    reason: lexical_alternative
  - marker: b
    text: “Ìgboyà” tún lè jẹ́ “ìgbẹ́kẹ̀lé tí kò ní ìbẹ̀rù.”
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe jù pé “òun” ń tọ́ka sí Jesu; àwọn kan sì lóye rẹ̀ gẹ́gẹ́ bí ìtọ́kasí sí Ọlọ́run ní gbogbogbòò.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “Nínú èyí.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nípa èyí
  rationale: Ó lè túmọ̀ sí ọ̀nà, ìdí, tàbí ipò tí a ti mú ìfẹ́ dé àṣepé. “Nípa èyí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa ìtọ́kasí náà mọ́ láì pinnu ohun tí “èyí” ń tọ́ka sí ju ohun tí Gíríìkì sọ lọ.
- source_word: τετελείωται
  choice: ti dé àṣepé
  rationale: Ìṣe aláṣepé tí ó wà ní ohùn àfarawà ń tọ́ka sí ohun tí a ti mú dé òpin rẹ̀, tí àbájáde rẹ̀ sì ṣì dúró. “Ti dé àṣepé” fi ìtumọ̀ ìmúṣẹ tàbí ẹ̀kúnrẹ́rẹ́ hàn láì sọ pé ìfẹ́ Ọlọ́run ní àbùkù tẹ́lẹ̀.
- source_word: ἡ ἀγάπη
  choice: ìfẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe déédéé jù lọ fún ἀγάπη, ó sì jẹ́ kí ìtumọ̀ rẹ̀ nínú àyíká ẹsẹ náà ṣí sílẹ̀.
- source_word: μεθ’ ἡμῶν
  choice: pẹ̀lú wa
  rationale: μετά pẹ̀lú ọ̀rọ̀ inú genitive sábà máa ń túmọ̀ sí “pẹ̀lú.” Ìtumọ̀ yìí kò fipá pinnu bóyá ìfẹ́ náà jẹ́ ìfẹ́ Ọlọ́run sí wa, tiwa sí Ọlọ́run, tàbí ìfẹ́ tí ń ṣiṣẹ́ láàárín àwọn onígbàgbọ́.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète tàbí àbájáde hàn ní Yorùbá òde òní.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Nínú àyíká ìdájọ́, ọ̀rọ̀ náà túmọ̀ sí òmìnira àti ìgbẹ́kẹ̀lé láìsí ìbẹ̀rù; “ìgboyà” mú èyí jáde ní kedere.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: ní ọjọ́ ìdájọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn ìṣẹ̀lẹ̀ ọjọ́ iwájú náà.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí a fi lè ní ìgboyà hàn.
- source_word: καθὼς ἐκεῖνός ἐστιν
  choice: bí òun ti rí
  rationale: “Òun” pa ìtọ́kasí arọ́pò-orúkọ Gíríìkì mọ́, ìṣe àsìkò ìsinsìnyí “rí” sì pa èrò ipò rẹ̀ nísinsìnyí mọ́.
- source_word: καὶ ἡμεῖς ἐσμεν
  choice: bẹ́ẹ̀ náà ni àwa pẹ̀lú rí
  rationale: Ó fi ìfiwéra καθὼς…καί hàn kedere, ó sì tẹnu mọ́ “àwa” gẹ́gẹ́ bí Gíríìkì ti ṣe.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: ní ayé yìí
  rationale: “Ayé yìí” tọ́ka sí ibi àti ipò ìgbésí ayé ènìyàn nísinsìnyí, gẹ́gẹ́ bí κόσμος ṣe túmọ̀ sí níbí.
theological_decisions:
- issue: Ẹni tí ἐκεῖνος (“òun”) ń tọ́ka sí
  choice: Ó ṣeé ṣe jù pé ó ń tọ́ka sí Jesu Kristi/Ọmọ náà, ṣùgbọ́n a pa arọ́pò-orúkọ náà mọ́.
  alternative: Àwọn kan lóye rẹ̀ gẹ́gẹ́ bí ìtọ́kasí sí Ọlọ́run ní gbogbogbòò.
  rationale: Nínú 1 Jòhánù, ἐκεῖνος sábà ń tọ́ka sí Jesu, pàápàá nínú àwọn gbólóhùn tó ń fi ìwà àwọn onígbàgbọ́ wé tirẹ̀. Síbẹ̀, ẹsẹ yìí kò sọ orúkọ ẹni náà ní tààrà, nítorí náà “òun” pa àìṣedéédé tó wà nínú orísun mọ́.
- issue: Ìtumọ̀ ìfẹ́ tí ó “dé àṣepé”
  choice: A ti mú ìfẹ́ dé ìmúṣẹ tàbí ẹ̀kúnrẹ́rẹ́ ète rẹ̀ ní ìbáṣepọ̀ pẹ̀lú wa, èyí sì ń yọrí sí ìgboyà ní ọjọ́ ìdájọ́.
  alternative: Ó lè jẹ́ ìfẹ́ wa sí Ọlọ́run nìkan, tàbí ìfẹ́ Ọlọ́run sí wa nìkan, tí ó di pípé.
  rationale: Gíríìkì kò fi dandan pinnu ọ̀nà kan ṣoṣo tí ìfẹ́ náà gbà ń ṣiṣẹ́. “Pẹ̀lú wa” pa ìforígbárí ìtumọ̀ náà mọ́, kò sì gbé ẹ̀kọ́ pé ènìyàn lè dé àìlẹ́ṣẹ̀ patapata wọ inú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti àdánidá. Gbólóhùn náà jẹ́ kíkàgbọ́ fún òǹkàwé òde òní, ṣùgbọ́n ó pa àtúnsọ ìfiwéra àti àìṣedéédé ìtumọ̀ inú Gíríìkì mọ́.
