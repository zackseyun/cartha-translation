id: 1JN.4.18
reference: 1 John 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: yo
  text: Ẹ̀rù kò sí nínú ìfẹ́, ṣùgbọ́n ìfẹ́ tí ó pé lé ẹ̀rù jáde, nítorí ẹ̀rù ní ìjìyà.[a] Ṣùgbọ́n ẹni tí ó ń bẹ̀rù kò tíì pé nínú ìfẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘ẹ̀rù ní ìjìyà’; a tún lè lóye rẹ̀ pé ẹ̀rù ní í ṣe pẹ̀lú ìjìyà.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος
  choice: ẹ̀rù
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbẹ̀rù tàbí ìpayà níwájú ìdájọ́, ó sì pa àtúnlò ọ̀rọ̀ náà mọ́ jákèjádò ẹsẹ náà.
- source_word: ἀγάπῃ / ἀγάπη
  choice: ìfẹ́
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì pa ọ̀rọ̀ pàtàkì tí a tún lò mọ́.
- source_word: τελεία
  choice: tí ó pé
  rationale: Ó fi ìfẹ́ tí ó ti dé ẹ̀kúnrẹ́rẹ́ ète rẹ̀ hàn, láìdín ìtumọ̀ rẹ̀ kù sí ìdàgbàsókè ìmọ̀lára nìkan.
- source_word: ἔξω βάλλει
  choice: lé ... jáde
  rationale: Àpèjúwe Yorùbá àdánidá ni fún yíyọ ohun kan kúrò pátápátá, ó sì pa agbára àwòrán Gíríìkì mọ́.
- source_word: κόλασιν ἔχει
  choice: ní ìjìyà
  rationale: Ó tẹ̀lé gbolohun Gíríìkì náà ní tààràtà, ‘ẹ̀rù ní ìjìyà,’ láìfi àlàyé ìtumọ̀ míì kún un nínú ọ̀rọ̀ pàtàkì.
- source_word: ὁ δὲ φοβούμενος
  choice: ẹni tí ó ń bẹ̀rù
  rationale: Ó ṣe àfihàn participle tí a sọ di orúkọ ní Yorùbá àdánidá, láìfi akọ tàbí abo kún un.
- source_word: οὐ τετελείωται
  choice: kò tíì di ẹni pípé
  rationale: Ó fi ipò tí ìṣe pípe kò tíì mú wá hàn, ó sì pa ìsopọ̀ pẹ̀lú ‘tí ó pé’ mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἐν τῇ ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Ó jẹ́ ìtumọ̀ rírọrùn, àdánidá fún gbólóhùn preposition náà, tí ó sì pa èrò gbígbé tàbí dídàgbà láàárín ìfẹ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ìfẹ́ tí ó pé’ àti ‘kò tíì di ẹni pípé’
  choice: A lo ‘ìfẹ́ tí ó pé’ àti ‘kò tíì di ẹni pípé nínú ìfẹ́.’
  alternative: ‘ìfẹ́ tí ó dàgbà dénú’ / ‘kò tíì dàgbà dénú nínú ìfẹ́’
  rationale: Yíyan ‘pé/pípé’ pa ìsopọ̀ ọ̀rọ̀ τελεία àti τετελείωται mọ́, ó sì jẹ́ kí a rí ìfẹ́ tí ó dé ẹ̀kúnrẹ́rẹ́ ète rẹ̀, láìfi ẹ̀kọ́ àìlẹ́ṣẹ̀ pátápátá sínú ẹsẹ náà.
- issue: Ìbáṣepọ̀ ẹ̀rù àti ìjìyà
  choice: A pa ọ̀rọ̀ tààrà ‘ẹ̀rù ní ìjìyà’ mọ́.
  alternative: ‘ẹ̀rù ní í ṣe pẹ̀lú ìjìyà’ tàbí ‘ẹ̀rù ní ìrètí ìjìyà nínú’
  rationale: Gíríìkì jẹ́ κόλασιν ἔχει ní tààrà; yíyan yìí pa àìdánilójú àti ìnira ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́ dípò fífi ìtumọ̀ kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àtúnlò ‘ẹ̀rù,’ ‘ìfẹ́,’ àti ìsopọ̀ ‘pé/pípé’ mọ́.
