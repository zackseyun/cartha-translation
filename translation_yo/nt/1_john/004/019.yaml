  text: We love because he first loved us[a].
translation:
  language: yo
  text: Àwa nífẹ̀ẹ́, nítorí òun ni ó ti kọ́kọ́ nífẹ̀ẹ́ wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà á pé, “Àwa nífẹ̀ẹ́ rẹ̀, nítorí òun ni ó ti kọ́kọ́ nífẹ̀ẹ́ wa.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: Àwa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní gbangba nínú Gíríìkì ní ìtẹnumọ́ díẹ̀; “Àwa” pa ìtẹnumọ́ náà mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: ἀγαπῶμεν
  choice: nífẹ̀ẹ́
  rationale: Ìṣe ìsinsìnyí ni; “nífẹ̀ẹ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ọ̀rọ̀ ìfẹ́ nínú àyíká ẹsẹ náà.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ń fi ìdí hàn pé ìfẹ́ Ọlọ́run tó ṣáájú ni ìpìlẹ̀ ìfẹ́ wa.
- source_word: αὐτὸς
  choice: òun ni
  rationale: Ó tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀, ó sì pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́ láì wuwo.
- source_word: πρῶτος
  choice: kọ́kọ́
  rationale: Ó fi hàn pé ìfẹ́ rẹ̀ ṣáájú tiwa ní àkókò, ó sì jẹ́ ìdí fún un.
- source_word: ἠγάπησεν
  choice: nífẹ̀ẹ́
  rationale: Bí ó tilẹ̀ jẹ́ pé àkókò àtijọ́ ni fọ́ọ̀mù Gíríìkì, Yorùbá sábà máa ń jẹ́ kí àyíká àti “kọ́kọ́” fi ìṣe tó ti ṣẹlẹ̀ hàn; fífi “nífẹ̀ẹ́” sílẹ̀ tún pa ìbámu ọ̀rọ̀ mọ́.
- source_word: ἡμᾶς
  choice: wa
  rationale: Ó jẹ́ ẹni tí ìṣe ìfẹ́ náà kan; “wa” ni ìtumọ̀ Yorùbá tó tààrà.
theological_decisions:
- issue: Bóyá a ó fi ohun tí “àwa nífẹ̀ẹ́” kàn kun un
  choice: 'A kò sọ ohun tí ìfẹ́ náà kàn ní pàtó: “Àwa nífẹ̀ẹ́”'
  alternative: “Àwa nífẹ̀ẹ́ rẹ̀” tàbí “Àwa nífẹ̀ẹ́ Ọlọ́run”
  rationale: Ọ̀rọ̀ Gíríìkì SBLGNT kò ní ohun tí ἀγαπῶμεν kàn ní gbangba. Àìsọ ọ́ ní pàtó pa àìdánilójú gidi inú ẹ̀rí ọ̀rọ̀ mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìtẹnumọ́ àti àìsọ ohun tí ìfẹ́ kàn ní pàtó mọ́.
