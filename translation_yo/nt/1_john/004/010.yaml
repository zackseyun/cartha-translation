    rationale: Nínú Yorùbá òde òní, ìtùnú sábà ń tọ́ka sí ìtùnú ẹni tí ìbànújẹ́ bá, kì í ṣe ìtùnú/ìmú ìbínú rọ̀ nínú ọ̀rọ̀ ẹbọ. A lè dá àfidípò náà sílẹ̀ kí a sì ṣàlàyé ìṣòro ìtumọ̀ náà láì fi ọ̀rọ̀ tó lè dàrú kún un.
