    rationale: ἱλασμός fúnra rẹ̀ ń tọ́ka sí ọ̀nà ẹbọ/ètùtù tí ó bá ẹ̀ṣẹ̀ lò; ẹsẹ̀ náà kò sọ ní kedere pé Ọmọ “fi ara rẹ̀ rú ẹbọ.” Àlàyé náà yẹ kí ó má ṣe kọjá ohun tí orísun sọ.
