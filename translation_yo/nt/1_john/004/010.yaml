source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: yo
  text: 'Èyí ni ìfẹ́: kì í ṣe pé àwa ti nífẹ̀ẹ́ Ọlọ́run, ṣùgbọ́n pé òun nífẹ̀ẹ́ wa, ó sì rán Ọmọ rẹ̀ gẹ́gẹ́ bí ẹbọ ètùtù fún àwọn ẹ̀ṣẹ̀ wa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìmúkúrò ẹ̀ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà, ἱλασμός, ń tọ́ka sí ẹbọ tí ó bá ẹ̀ṣẹ̀ lò.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Èyí ni ìfẹ́
  rationale: Ó pa ìtọ́ka Johanu mọ́ sí ohun tí ó tẹ̀ lé gẹ́gẹ́ bí ohun tí ó fi ìfẹ́ hàn, ó sì jẹ́ Yorùbá àdánidá.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: kì í ṣe pé ... ṣùgbọ́n pé
  rationale: Ó pa ìtakora àti ìtumọ̀ ìṣàlàyé Gíríìkì mọ́ láì sọ ọ́ di gbólóhùn ìdí.
- source_word: ἠγαπήκαμεν τὸν θεόν
  choice: àwa ti nífẹ̀ẹ́ Ọlọ́run
  rationale: “Ti nífẹ̀ẹ́” fi àkókò pípé hàn, “àwa” sì mú ìtakora pẹ̀lú Ọlọ́run ṣe kedere.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: òun nífẹ̀ẹ́ wa
  rationale: “Òun” gbé ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì jáde nínú ìtakora pẹ̀lú “àwa.”
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: ó sì rán Ọmọ rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà, àdánidá tí ó pa èrò ìránṣẹ́ àti ìbátan Ọmọ mọ́.
- source_word: ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: gẹ́gẹ́ bí ẹbọ ètùtù fún àwọn ẹ̀ṣẹ̀ wa
  rationale: “Ẹbọ ètùtù” sọ ìṣe ẹbọ tí ó bá ẹ̀ṣẹ̀ lò di mímọ̀ ní èdè Yorùbá tó ṣeé lóye, láì fi tipátipá yan láàárín ìtùnú ìbínú àti ìmúkúrò ẹ̀ṣẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἱλασμός nínú ọ̀rọ̀ ètùtù
  choice: ẹbọ ètùtù
  alternative: ẹbọ ìtùnú; ẹbọ ìmúkúrò ẹ̀ṣẹ̀
  rationale: “Ẹbọ ètùtù” pa ìtumọ̀ pàtàkì mọ́ pé Ọmọ náà jẹ́ ẹbọ tí ó kojú ẹ̀ṣẹ̀ wa lọ́nà tó múná dóko, ṣùgbọ́n kò dá àríyànjiyàn lórí bí ọ̀rọ̀ náà ṣe kan ìtùnú ìbínú tàbí ìmúkúrò ẹ̀ṣẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn; àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ. A lo “Ọmọ” fún akọ́lé Kristi, àti “ẹbọ ètùtù” láti yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó le ju.
