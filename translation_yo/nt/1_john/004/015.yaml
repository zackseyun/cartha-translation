  source_fidelity: Ìtumọ̀ náà pa ìtumọ̀ gbogbogbò ti ὃς ἐὰν, ìjẹ́wọ́ nípa Jésù gẹ́gẹ́ bí Ọmọ Ọlọ́run, àti ìbágbépọ̀ alábàápín tí μένω ń ṣàfihàn mọ́. Ṣùgbọ́n ‘ń gbé inú’ lè dá bí ìbùgbé nínú ara tàbí ibi kan ju bí μένω ṣe gbooro lọ; ‘ń dúró nínú’ dáa jù fún àṣàyàn ìsàlẹ̀ ojúewé náà.
