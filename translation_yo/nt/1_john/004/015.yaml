id: 1JN.4.15
reference: 1 John 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá jẹ́wọ́ pé Jésù ni Ọmọ Ọlọ́run, Ọlọ́run wà nínú rẹ̀, òun náà sì wà nínú Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni láìsí ààlà; ìtumọ̀ náà jẹ́ èdè Yorùbá àdánidá fún gbólóhùn ìbátan aláìnídìí pàtó.
- source_word: ὁμολογήσῃ
  choice: jẹ́wọ́
  rationale: “Jẹ́wọ́” fi hàn pé ẹni náà ń sọ ohun tí ó gbà pé ó jẹ́ òtítọ́ nípa Jésù, ó sì pa ìwúwo ẹ̀sìn inú ọ̀rọ̀ Gíríìkì mọ́ láìfi àlàyé kún un.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: Jésù ni Ọmọ Ọlọ́run
  rationale: Ìlànà “X ni Y” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìdánimọ̀ yìí; “Ọmọ Ọlọ́run” sì pa oyè Kristi yẹn mọ́.
- source_word: ἐν αὐτῷ μένει
  choice: ń gbé inú ẹni náà
  rationale: Nínú àyíká yìí, “ń gbé inú” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì mú ìtumọ̀ ìbágbépọ̀ tí ń bá a lọ nínú μένω jáde. “Ẹni náà” tún yẹra fún fífi akọ tàbí abo tí èdè Yorùbá kò fi hàn sínú ọ̀rọ̀ náà.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: ẹni náà sì ń gbé inú Ọlọ́run
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ ní apá kejì, pípa “ń gbé” tún sọ ní Yorùbá mú ìtumọ̀ àti ìbáṣepọ̀ méjèèjì ṣe kedere, láìyí ohun tí orísun sọ padà.
theological_decisions:
- issue: Ìbágbépọ̀ Ọlọ́run àti ènìyàn nínú ara wọn
  choice: Ọlọ́run ń gbé inú ẹni náà, ẹni náà sì ń gbé inú Ọlọ́run
  alternative: Ọlọ́run wà nínú ẹni náà, ẹni náà sì wà nínú Ọlọ́run
  rationale: A pa ìsọ̀rí méjèèjì àti ìdọ́gba ọ̀rọ̀ orísun mọ́, láìṣàlàyé bí ìbágbépọ̀ yìí ṣe rí tàbí láìdín in kù sí ìbáṣepọ̀ lásán.
- issue: Oyè nípa Kristi
  choice: Ọmọ Ọlọ́run
  alternative: Ọmọ tí Ọlọ́run bí
  rationale: “Ọmọ Ọlọ́run” ni oyè tó bá ὁ υἱὸς τοῦ θεοῦ mu ní tààrà, tí kò sì fi èrò míì tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́wọ̀, tó sì ṣeé lóye. A lo àmì ohùn níbi tó yẹ, a sì tún “ẹni náà” lò dípò arọ́pò-orúkọ akọ nítorí Yorùbá kì í fi akọ tàbí abo hàn ní ọ̀nà yẹn.
