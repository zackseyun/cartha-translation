  terminology: ‘jẹ́wọ́,’ ‘Jésù,’ àti ‘Ọmọ Ọlọ́run’ jẹ́ àwọn ọ̀rọ̀ tó péye fún ὁμολογήσῃ, Ἰησοῦς, àti ὁ υἱὸς τοῦ θεοῦ. ‘Wà nínú’ jẹ́ ọ̀nà adayeba tó lè gbé μένω, nígbà tí àlàyé ìsàlẹ̀ ojúewé ń tọ́ka sí ‘dúró nínú’ gẹ́gẹ́ bí àṣàyàn tó sún mọ́ ìtumọ̀ ‘abide/remain’.
