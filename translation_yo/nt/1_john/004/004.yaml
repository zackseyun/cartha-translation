id: 1JN.4.4
reference: 1 John 4:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: yo
  text: Ẹ̀yin ọmọ kéékèèké, ẹ jẹ́ ti Ọlọ́run, ẹ sì ti borí wọn[a], nítorí ẹni tí ó wà nínú yín tóbi ju ẹni tí ó wà nínú ayé lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Èyí ni àwọn alátakò tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, pàápàá jù lọ àwọn wòlíì èké.
    reason: cross_reference
  - marker: b
    text: Nínú Gíríìkì, a kò dárúkọ ẹni tí ó wà nínú yín àti ẹni tí ó wà nínú ayé ní pàtó. Àyíká ọ̀rọ̀ tọ́ka sí Ọlọ́run tàbí Ẹ̀mí rẹ̀ fún ẹni àkọ́kọ́, àti sí ẹni ibi tó wà lẹ́yìn ayé fún ẹni kejì.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba, ó sì ní ìtẹnumọ́ nínú Gíríìkì; “Ẹ̀yin” dá ìtẹnumọ́ yẹn dúró ní Yorùbá.
- source_word: ἐκ τοῦ θεοῦ
  choice: ti Ọlọ́run ni
  rationale: Gbólóhùn yìí sọ nípa orísun àti jíjẹ́ ti Ọlọ́run. “Ti Ọlọ́run ni” jẹ́ Yorùbá àdánidá, ó sì bá ìyàtọ̀ tí Jòhánù ń ṣe mu láìfi ọ̀rọ̀ míì kún un.
- source_word: τεκνία
  choice: ẹ̀yin ọmọ kéékèèké
  rationale: Ó pa ìtumọ̀ ìdílé àti ìfẹ́ni inú ọ̀rọ̀ ìpè Gíríìkì mọ́, láìfi “mi” kún ọ̀rọ̀ tí kò sí ní orísun.
- source_word: νενικήκατε
  choice: ẹ sì ti borí
  rationale: “Ti borí” fi hàn pé ìṣẹ́gun náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ń bá a lọ, gẹ́gẹ́ bí àkókò perfect nínú Gíríìkì.
- source_word: αὐτούς
  choice: wọn
  rationale: Arọ́pò-orúkọ náà tọ́ka sí àwọn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, láìsọ ẹni tí wọ́n jẹ́ ní pàtó ju orísun lọ.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí àwọn onígbàgbọ́ fi borí wọn.
- source_word: μείζων
  choice: tóbi ju
  rationale: Èyí pa ìtumọ̀ fífẹ̀ ti àfiwé náà mọ́; kò dín in kù sí agbára nìkan bí “lágbára ju” ṣe lè ṣe.
- source_word: ὁ ἐν ὑμῖν
  choice: ẹni tí ó wà nínú yín
  rationale: Ó mú ẹni tí gbólóhùn Gíríìkì ń tọ́ka sí hàn gẹ́gẹ́ bí ẹni, ṣùgbọ́n kò dá ẹni náà mọ̀ ní pàtó níbi tí orísun kò ti ṣe bẹ́ẹ̀.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: ẹni tí ó wà nínú ayé
  rationale: Ó bá gbólóhùn tó ṣáájú rẹ̀ dọ́gba, ó sì pa ìtakora ọ̀rọ̀ náà mọ́ láìfi ìdánimọ̀ tó ṣe kedere ju ti Gíríìkì lọ kún un.
- source_word: κόσμῳ
  choice: ayé
  rationale: “Ayé” ni ìtumọ̀ ìpìlẹ̀ tó yẹ; kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ bí “ètò ayé búburú” sínú ẹsẹ̀ náà.
theological_decisions:
- issue: Ta ni “ẹni tí ó wà nínú yín” àti “ẹni tí ó wà nínú ayé”?
  choice: A kò dárúkọ ẹni méjèèjì ní pàtó nínú ẹsẹ̀ náà.
  alternative: Láti sọ ẹni àkọ́kọ́ di Ọlọ́run tàbí Ẹ̀mí Mímọ́, kí a sì sọ ẹni kejì di Èṣù tàbí ẹni ibi náà.
  rationale: Àyíká ọ̀rọ̀ tọ́ka gidigidi sí Ọlọ́run tàbí Ẹ̀mí rẹ̀ ní àkọ́kọ́, àti sí ẹni ibi tó wà lẹ́yìn ayé ní ìkejì; síbẹ̀, Gíríìkì kò dárúkọ wọn ní pàtó. Ìtumọ̀ náà pa àìsọ-kedere yìí àti ìtẹnumọ́ ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Gbólóhùn náà pa àtúnṣe ìfẹ́ni ti “τεκνία” àti ìbáradọ́gba àwọn apá méjì tó parí ẹsẹ̀ mọ́.
