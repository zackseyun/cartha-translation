  text: ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: yo
  text: Ẹni tí kò nífẹ̀ẹ́ kò mọ Ọlọ́run[a], nítorí Ọlọ́run jẹ́ ìfẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnikẹ́ni tí kò nífẹ̀ẹ́ kò mọ Ọlọ́run.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “kò tíì mọ” láti tẹnu mọ́ ipò ẹni tí kò tíì wá mọ Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Ẹni tí kò nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnì kan tí àìnífẹ̀ẹ́ jẹ́ ìwà tó ń hàn nígbésí ayé rẹ̀. Ìtumọ̀ yìí jẹ́ ti gbogbo ènìyàn, ó sì pa ìṣe tí ó ń bá a lọ mọ́.
- source_word: ἀγαπῶν
  choice: nífẹ̀ẹ́
  rationale: A lo ọ̀rọ̀ ìṣe ‘nífẹ̀ẹ́’ kí ìbátan rẹ̀ pẹ̀lú ọ̀rọ̀-orúkọ ‘ìfẹ́’ (ἀγάπη) ní ìparí ẹsẹ náà lè hàn kedere.
- source_word: οὐκ ἔγνω
  choice: kò tíì mọ
  rationale: ‘Kò tíì mọ’ fi hàn pé ẹni náà kò tíì dé ipò mímọ Ọlọ́run nípa ìbáṣepọ̀; kì í ṣe pé kò lóye ohun kan nípa Ọlọ́run lásán.
- source_word: τὸν θεόν / ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀nà àdánidá àti ọ̀wọ̀ fún títúmọ̀ θεός ní Yorùbá nínú ọ̀rọ̀ yìí.
- source_word: ὅτι
  choice: nítorí
  rationale: ὅτι ń sọ ìdí fún gbólóhùn tó ṣáájú, nítorí náà ‘nítorí’ mú ipa ìdí náà hàn kedere.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: Ọ̀rọ̀-orúkọ àfoyemọ́ ‘ìfẹ́’ pa agbára gbólóhùn Gíríìkì mọ́, ó sì tún pa ìbátan ọ̀rọ̀ rẹ̀ pẹ̀lú ‘nífẹ̀ẹ́’ mọ́.
- source_word: ἐστίν
  choice: jẹ́
  rationale: ‘Jẹ́’ ni ọ̀nà àdánidá láti so Ọlọ́run pọ̀ mọ́ àpèjúwe ‘ìfẹ́’ nínú Yorùbá.
theological_decisions:
- issue: Agbára gbólóhùn ‘Ọlọ́run jẹ́ ìfẹ́’
  choice: Ọlọ́run jẹ́ ìfẹ́
  alternative: Ọlọ́run nífẹ̀ẹ́; Ìfẹ́ ni Ọlọ́run
  rationale: Gíríìkì fi ‘Ọlọ́run’ ṣe olùṣe, ó sì fi ‘ìfẹ́’ sọ irú ẹni tí Ọlọ́run jẹ́. A kò sọ ọ́ di ‘Ìfẹ́ ni Ọlọ́run,’ bẹ́ẹ̀ ni a kò sọ ọ́ di ọ̀rọ̀ aláìlágbára bí ‘Ọlọ́run nífẹ̀ẹ́’ nìkan.
- issue: Ìtumọ̀ mímọ Ọlọ́run
  choice: kò tíì mọ Ọlọ́run
  alternative: kò lóye Ọlọ́run; kò mọ Ọlọ́run
  rationale: Nínú àwọn ìwé Jòhánù, ‘mọ̀’ sábà máa ń tọ́ka sí ìmọ̀ nípa ìbáṣepọ̀ tí ìwà ènìyàn ń jẹ́rìí sí. ‘Kò tíì mọ’ pa èrò pé kò tíì wá mọ Ọlọ́run mọ́ láìsọ ọ́ di òye orí lásán.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ṣe kedere, tó sì níyì ni a lò. A lo àmì ohùn níbi tó yẹ, a sì pa àtúnṣe ọ̀rọ̀ ‘nífẹ̀ẹ́/ìfẹ́’ mọ́ láti fi ìbátan ἀγαπῶν àti ἀγάπη hàn.
