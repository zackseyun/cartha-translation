id: 1JN.4.16
reference: 1 John 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: yo
  text: Àwa sì ti mọ̀, a sì ti gba ìfẹ́ tí Ọlọ́run ní láàárín wa gbọ́.[a] Ọlọ́run jẹ́ ìfẹ́; ẹni tí ó ń gbé nínú ìfẹ́ ń gbé nínú Ọlọ́run, Ọlọ́run sì ń gbé nínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ tí Ọlọ́run ní nínú wa.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìfẹ́ tí ó wà nínú àwọn onígbàgbọ́ tàbí tí ó ń hàn láàárín àwùjọ wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: ti mọ̀
  rationale: Ọ̀rọ̀-ìṣe pípé náà ń tọ́ka sí mímọ̀ tí a ti dé bá, tí ipò rẹ̀ sì ń bá a lọ ní ìsinsin yìí; “ti mọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti fi èyí hàn.
- source_word: πεπιστεύκαμεν
  choice: ti gba … gbọ́
  rationale: “Gba … gbọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígbàgbọ́; àmì “ti” ń pa ìtumọ̀ ìṣe pípé tí ó ní àbájáde títí di ìsinsin yìí mọ́.
- source_word: τὴν ἀγάπην
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ἀγάπη, ó sì bá gbólóhùn pàtàkì “Ọlọ́run jẹ́ ìfẹ́” mu.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: tí Ọlọ́run ní láàárín wa
  rationale: “Láàárín wa” pa agbára ibi/àwùjọ inú ἐν ἡμῖν mọ́ ju “fún wa” lọ, láì dí ìtumọ̀ pé ìfẹ́ náà lè wà nínú àwọn onígbàgbọ́ kọ̀ọ̀kan.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Ọlọ́run jẹ́ ìfẹ́
  rationale: Èyí tú ìhun orúkọ-asọtẹ́lẹ̀ Gíríìkì náà ní tààràtà, láì fi àlàyé míì kún un.
- source_word: ὁ μένων / μένει
  choice: ẹni tí ó ń gbé / ń gbé
  rationale: Nínú àyíká ìbáṣepọ̀ àti gbígbé inú ara ẹni, “ń gbé nínú” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìdúró tí ń bá a lọ ti μένω mọ́. Lílo rẹ̀ ní gbogbo ìgbà mẹ́ta tún pa ìṣọ̀kan ọ̀rọ̀ Johanu mọ́.
- source_word: ἐν τῇ ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: “Nínú ìfẹ́” fi ìfẹ́ hàn gẹ́gẹ́ bí ipò tàbí agbègbè ìwàláàyè, kì í ṣe ìmọ̀lára lásán.
- source_word: ἐν τῷ θεῷ / ἐν αὐτῷ
  choice: nínú Ọlọ́run / nínú rẹ̀
  rationale: Àwọn gbólóhùn wọ̀nyí pa àwòrán ìgbé-inú-ara-ẹni tí ó wà nínú Gíríìkì mọ́. Arọ́pò-orúkọ Yorùbá “rẹ̀” kò fi akọ tàbí abo hàn, ṣùgbọ́n ó ń tọ́ka sí ẹni náà ní ẹyọ.
theological_decisions:
- issue: Ìtumọ̀ ἐν ἡμῖν nínú gbólóhùn àkọ́kọ́
  choice: “láàárín wa,” ní ìtumọ̀ ibi àti àwùjọ
  alternative: “nínú wa” gẹ́gẹ́ bí ìgbé inú onígbàgbọ́, tàbí “fún wa” gẹ́gẹ́ bí ẹni tí ìfẹ́ náà dojú kọ
  rationale: ἐν sábà máa ń túmọ̀ sí “nínú” tàbí “láàárín,” àyíká náà sì ń sọ̀rọ̀ nípa ìfẹ́ Ọlọ́run tí ó hàn nínú àwùjọ àti ìgbé-inú-ara-ẹni. “Láàárín wa” pa ìfọ̀rọ̀wérọ̀ yìí mọ́, nígbà tí “fún wa” bá ti pinnu ìtumọ̀ ju ohun tí ọ̀rọ̀ orísun sọ lọ.
- issue: Ìgbé-inú-ara-ẹni láàárín Ọlọ́run àti ẹni tí ó ń gbé nínú ìfẹ́
  choice: 'Pa àwọn gbólóhùn méjèèjì mọ́ ní tààràtà: ẹni náà ń gbé nínú Ọlọ́run, Ọlọ́run sì ń gbé nínú rẹ̀'
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ìṣọ̀kan, ìbáṣepọ̀, tàbí agbára Ẹ̀mí
  rationale: Ọ̀rọ̀ náà fúnra rẹ̀ lo àwòrán ìgbé-inú-ara-ẹni, kò sì ṣàlàyé ọ̀nà rẹ̀ níbí. Ìtumọ̀ náà kò gbọ́dọ̀ yan ẹ̀kọ́ ìsìn kan láti tú u síwájú.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, àti òde òní pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ń gbé nínú” rọrùn fún òǹkàwé ju “ń dúró nínú” lọ nínú àyíká yìí, ó sì pa àsọtẹ́lẹ̀ ìgbé-inú-ara-ẹni àti àtúnlò μένω mọ́.
