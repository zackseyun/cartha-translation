id: 1JN.4.14
reference: 1 John 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: yo
  text: Àwa sì ti rí i, a sì ń jẹ́rìí pé Baba ti rán Ọmọ náà láti jẹ́ Olùgbàlà ayé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀-sí-ọ̀rọ̀ jù bẹ́ẹ̀ lọ, “Baba ti rán Ọmọ náà, Olùgbàlà ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: Àwa náà sì
  rationale: Ó pa ìtẹnumọ́ díẹ̀ tí ọ̀rọ̀ arọ́pò orúkọ ἡμεῖς ní mọ́, ó sì so gbólóhùn náà mọ́ ohun tí ó ṣáájú lọ́nà àdánidá ní Yorùbá.
- source_word: τεθεάμεθα
  choice: ti rí i
  rationale: Àkókò perfect fi hàn pé rírí náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì ṣì dúró. “Ti rí i” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó tún pa agbára ẹlẹ́rìí ojú mọ́.
- source_word: μαρτυροῦμεν
  choice: ń jẹ́rìí
  rationale: Ó fi iṣẹ́ jíjẹ́rìí tí ó ń bá a lọ hàn, ó sì jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá òde òní lóye dáadáa.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣàgbékalẹ̀ ohun tí wọ́n ń jẹ́rìí sí, kì í ṣe ìdí ohun kan.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: “Baba” pa orúkọ ipò ìbátan tí Jòhánù lò fún Ọlọ́run mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: ἀπέσταλκεν
  choice: ti rán
  rationale: “Ti rán” fi iṣẹ́ tí a ti ṣe tán tí ìjẹ́pàtàkì rẹ̀ ṣì wà hàn, ní ìbámu pẹ̀lú perfect active Gíríìkì.
- source_word: τὸν υἱόν
  choice: Ọmọ náà
  rationale: Ó tẹ̀lé article Gíríìkì, ó sì pa orúkọ ipò ìbátan “Ọmọ” mọ́ láìṣàfikún “tirẹ̀,” tí kò sí nínú ọ̀rọ̀ orísun.
- source_word: σωτῆρα
  choice: Olùgbàlà
  rationale: “Olùgbàlà” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ní iyì, fún ẹni tí ń gbà là; kò dín ìtumọ̀ náà kù sí ìgbàlà lọ́wọ́ ewu ti ara nìkan.
- source_word: τοῦ κόσμου
  choice: ayé
  rationale: Nínú àkópọ̀ “Olùgbàlà ayé,” ìbáṣepọ̀ genitive náà ṣe kedere, ó sì pa ìwọ̀n gbígbòòrò κόσμος mọ́.
- source_word: σωτῆρα τοῦ κόσμου
  choice: láti jẹ́ Olùgbàlà ayé
  rationale: Èyí sọ apposition Gíríìkì di Yorùbá àdánidá, nípa fífi ipa tí Ọmọ náà wá ṣe hàn. Àlàyé ìsàlẹ̀ ojú ewé pa ìtúmọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ mọ́.
theological_decisions:
- issue: Ìwọ̀n tí “Olùgbàlà ayé” túmọ̀ sí
  choice: A pa gbólóhùn Jòhánù tí ó gbòòrò, “Olùgbàlà ayé,” mọ́ láìdín “ayé” kù.
  alternative: Olùgbàlà àwọn àyànfẹ́; ẹni tí ó ṣeé ṣe kí ó gba ayé là
  rationale: Ọ̀rọ̀ Gíríìkì sọ àkọlé àti ìwọ̀n rẹ̀ ní tààrà. Ìtumọ̀ kò gbọ́dọ̀ fi èrò ẹ̀kọ́ ìsìn kan nípa bí ìgbàlà ṣe ń ṣiṣẹ́ kún un.
- issue: Èdè ìbátan Baba àti Ọmọ
  choice: A lo “Baba” àti “Ọmọ náà” gẹ́gẹ́ bí àwọn orúkọ ipò ìbátan.
  alternative: Ọlọ́run Baba rán Jésù Kristi
  rationale: Ẹsẹ̀ náà lo àwọn orúkọ ìbátan, kì í sì í lo orúkọ “Jésù” tàbí oyè “Kristi.” Fífi àwọn wọ̀nyẹn kún un yóò kọjá ohun tí ọ̀rọ̀ orísun sọ.
- issue: Ìtumọ̀ apposition σωτῆρα τοῦ κόσμου
  choice: Nínú ọ̀rọ̀ àkọ́kọ́, a túmọ̀ ọ́ sí “láti jẹ́ Olùgbàlà ayé,” a sì fi ìtumọ̀ tó sún mọ́ ọ̀rọ̀-sí-ọ̀rọ̀ sínú àlàyé.
  alternative: Baba ti rán Ọmọ náà, Olùgbàlà ayé
  rationale: Ìtumọ̀ àkọ́kọ́ jẹ́ Yorùbá àdánidá, ṣùgbọ́n Gíríìkì kò ní ọ̀rọ̀ tó bá “láti jẹ́” mu ní tààrà. Àlàyé náà jẹ́ kí ìṣètò Gíríìkì àti àìdájú kékeré tó wà nínú rẹ̀ hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ń jẹ́rìí” fún iṣẹ́ tó ń bá a lọ, àti “ti rí i/ti rán” láti fi perfect Gíríìkì hàn lọ́nà àdánidá.
