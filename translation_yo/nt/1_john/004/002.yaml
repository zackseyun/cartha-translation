id: 1JN.4.2
reference: 1 John 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: yo
  text: 'Nípa èyí ni ẹ fi mọ Ẹ̀mí Ọlọ́run: gbogbo ẹ̀mí tí ó jẹ́wọ́ pé Jésù Mèsáyà[a] ti wá nínú ara[b][c] jẹ́ ti Ọlọ́run ni,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí ó túmọ̀ sí “Mèsáyà,” kì í ṣe orúkọ ìdílé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ti wá nínú ara.” Èdè Gíríìkì lò participle àkókò pípé, tí ó tẹnumọ́ wíwá tí ó ti ṣẹlẹ̀ àti ìtumọ̀ rẹ̀ tí ó ń bá a lọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “tí ó jẹ́wọ́ Jésù Mèsáyà gẹ́gẹ́ bí ẹni tí ó ti wá nínú ara.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nípa èyí
  rationale: Ó fi èyí hàn gẹ́gẹ́ bí àmì tàbí ọ̀nà tí a fi ń dá Ẹ̀mí Ọlọ́run mọ̀; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: γινώσκετε
  choice: ẹ fi mọ
  rationale: 'A mú un gẹ́gẹ́ bí ọ̀rọ̀ ìṣàpèjúwe, kì í ṣe àṣẹ: nípa àmì yìí ni àwọn olùgbọ́ fi ń mọ̀ tàbí dá a mọ̀.'
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Ẹ̀mí Ọlọ́run
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí Ẹ̀mí tí í ṣe ti Ọlọ́run; lílo lẹ́tà ńlá yà á sọ́tọ̀ kúrò lọ́dọ̀ ‘gbogbo ẹ̀mí’ tí a ń dán wò.
- source_word: πᾶν πνεῦμα
  choice: gbogbo ẹ̀mí
  rationale: Ó pa gbogbo ẹ̀mí tàbí agbára ẹ̀mí kọ̀ọ̀kan tí ó ń sọ̀rọ̀ mọ́, bóyá òótọ́ ni tàbí èké.
- source_word: ὁμολογεῖ
  choice: jẹ́wọ́
  rationale: ‘Jẹ́wọ́’ mú ìtumọ̀ gbígbà ní gbangba àti fífi ẹnu sọ ohun tí ẹni gbà mú.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí Mèsáyà, kì í ṣe apá orúkọ lásán; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́.
- source_word: ἐν σαρκὶ
  choice: nínú ẹran ara
  rationale: Gbólóhùn náà tẹnumọ́ pé wíwá Jésù jẹ́ wíwá gidi nínú ara ènìyàn; ‘ẹran ara’ pa àwòrán σάρξ mọ́ láìfi èdè ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ἐληλυθότα
  choice: ti wá
  rationale: Àkókò pípé ti participle Gíríìkì ń tọ́ka sí wíwá tí ó ti ṣẹlẹ̀ tí ìtumọ̀ rẹ̀ sì dúró; ‘ti wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: láti ọ̀dọ̀ Ọlọ́run ni
  rationale: ἐκ ń sọ orísun; ìtumọ̀ náà ni pé Ọlọ́run ni orísun ẹ̀mí bẹ́ẹ̀.
theological_decisions:
- issue: Bóyá τὸ πνεῦμα τοῦ θεοῦ ń tọ́ka pàtó sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí kan láti ọ̀dọ̀ Ọlọ́run
  choice: Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí láti ọ̀dọ̀ Ọlọ́run
  rationale: Ọ̀rọ̀ atọ́ka àti àyíká fífi àwọn ẹ̀mí wé ara wọn ṣe àtìlẹ́yìn fún ìtọ́ka sí Ẹ̀mí Ọlọ́run, ní ìyàtọ̀ sí ‘gbogbo ẹ̀mí’ tí ó tẹ̀ lé e.
- issue: Agbára ẹ̀kọ́ nípa Jésù nínú ἐν σαρκὶ ἐληλυθότα
  choice: ti wá nínú ẹran ara
  alternative: ti wá gẹ́gẹ́ bí ènìyàn
  rationale: A pa ọ̀rọ̀ orísun mọ́ láti jẹ́rìí sí wíwá Jésù nínú ara ènìyàn gidi, láìfi èdè imọ̀ ẹ̀kọ́ tí kò sí nínú Gíríìkì kún un.
- issue: Ìbáṣepọ̀ ὁμολογεῖ pẹ̀lú object àti participle
  choice: jẹ́wọ́ pé Jésù Mèsáyà ti wá
  alternative: jẹ́wọ́ Jésù Mèsáyà gẹ́gẹ́ bí ẹni tí ó ti wá
  rationale: Gíríìkì lè farahàn ní ọ̀nà méjèèjì. Gbólóhùn ‘pé’ jẹ́ Yorùbá tó rọrùn, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà tó tẹ̀ lé ìṣètò Gíríìkì pẹ́kípẹ́kí sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní ọlá, tó sì ṣeé lóye ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti àdánidá. ‘Ẹ̀mí Ọlọ́run’ ní lẹ́tà ńlá fún ìtọ́ka pàtó, ṣùgbọ́n ‘gbogbo ẹ̀mí’ wà ní lẹ́tà kékeré fún ẹ̀ka gbogbogbò.
