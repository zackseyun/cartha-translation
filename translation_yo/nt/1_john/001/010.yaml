id: 1JN.1.10
reference: 1 John 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: yo
  text: Tí a bá sọ pé a kò dẹ́ṣẹ̀[a], a sọ ọ́ di òpùrọ́, ọ̀rọ̀ rẹ̀[b] kò sì sí nínú wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘a kò ṣe ẹ̀ṣẹ̀.’ Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí àṣepé; ó ń tọ́ka sí ohun tí ó ti ṣẹlẹ̀ tí ó sì ní ìṣe pẹ̀lú ipò ìsinsìnyí. Èdè Yorùbá kò fi ìyàtọ̀ yìí hàn ní ọ̀nà kan náà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ‘ọ̀rọ̀ rẹ̀’ sí ‘ìròyìn rẹ̀.’ Ọ̀rọ̀ Gíríìkì λόγος lè ní ìtumọ̀ méjèèjì; a pa ‘ọ̀rọ̀’ mọ́ nítorí bí Johanu ṣe máa ń lò ó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Tí a bá sọ
  rationale: Àkójọpọ̀ ‘tí … bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ipò àídájú hàn, ó sì pa agbára gbólóhùn oní条件 Gíríìkì mọ́ láìfi ìtumọ̀ ‘tí a bá fẹ̀sùn kàn’ kún un.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: a kò dẹ́ṣẹ̀
  rationale: ‘Dẹ́ṣẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ṣíṣe ẹ̀ṣẹ̀. Èdè Yorùbá kò fi ìṣe àṣepé Gíríìkì hàn ní ọ̀nà kan náà; gbólóhùn yìí jẹ́ àdánidá, ó sì yẹra fún fífi ‘rí’ kún un, èyí tí ó lè mú ìtumọ̀ náà le sí ‘a kò dẹ́ṣẹ̀ rí rárá.’
- source_word: ψεύστην
  choice: òpùrọ́
  rationale: Ọ̀rọ̀-orúkọ ni ψεύστης, nítorí náà ‘òpùrọ́’ pa agbára tààrà àti ti ara ẹni ti ọ̀rọ̀ náà mọ́, dípò kí a rọ̀ ọ́ sí ‘ẹni tí kò sọ òtítọ́.’
- source_word: ποιοῦμεν αὐτὸν
  choice: a sọ ọ́ di
  rationale: '‘Sọ … di’ jẹ́ ọ̀nà Yorùbá àdánidá fún ποιέω pẹ̀lú àfikún-orúkọ níbí: a ń fi hàn pé ẹni náà jẹ́ irú ẹni bẹ́ẹ̀ tàbí a ń mú un jẹ́ bẹ́ẹ̀ nínú ọ̀rọ̀ wa.'
- source_word: ὁ λόγος αὐτοῦ
  choice: ọ̀rọ̀ rẹ̀
  rationale: λόγος lè túmọ̀ sí ‘ọ̀rọ̀’ tàbí ‘ìhìn.’ ‘Ọ̀rọ̀ rẹ̀’ pa àṣà ọ̀rọ̀ Johanu àti ìtumọ̀ méjèèjì náà mọ́ dáadáa.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: kò sì sí nínú wa
  rationale: Ìtumọ̀ yìí pa àwòrán inú ẹni ti Gíríìkì mọ́, láìfi èrò ‘gbé inú wa’ kún ọ̀rọ̀ tí kò sọ ọ́ ní tààrà.
theological_decisions:
- issue: Ẹni tí αὐτόν àti αὐτοῦ ń tọ́ka sí
  choice: A pa ọ̀rọ̀-arọ́pò-orúkọ náà mọ́ gẹ́gẹ́ bí ‘ọ́/rẹ̀’; àyíká ọ̀rọ̀ fi hàn pé Ọlọ́run ni ó ń tọ́ka sí.
  alternative: Kí a rọ́pò ọ̀rọ̀-arọ́pò-orúkọ náà pẹ̀lú ‘Ọlọ́run’ nínú ẹsẹ̀ náà.
  rationale: Àyíká 1 Johanu 1:5–10 tọ́ka sí Ọlọ́run gẹ́gẹ́ bí ẹni tí a ń tako ẹ̀rí rẹ̀. Síbẹ̀, lílo ọ̀rọ̀-arọ́pò-orúkọ pa ìkọ̀wé Gíríìkì mọ́, kò sì yanju ohun tí àyíká yẹ kí ó ṣàlàyé nínú ẹsẹ̀ fúnra rẹ̀.
translation_notes:
  register: A lo Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti ti òde òní pẹ̀lú àmì ohùn ní kíkún. ‘Dẹ́ṣẹ̀’ àti ‘sọrọ̀ di òpùrọ́’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lè lóye, tí wọn kò sì gbé ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan wọ inú ẹsẹ̀ náà.
