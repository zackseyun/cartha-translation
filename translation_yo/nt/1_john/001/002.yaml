id: 1JN.1.2
reference: 1 John 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: yo
  text: —ìyè náà sì farahàn[a], àwa sì ti rí i, a sì ń jẹ́rìí, a sì ń kéde ìyè àìnípẹ̀kun náà fún yín[b], èyí tí ó wà pẹ̀lú Baba, tí ó sì farahàn sí wa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘fi ara hàn’ tàbí ‘jẹ́ kí a rí i’ (ἐφανερώθη).
    reason: lexical_alternative
  - marker: b
    text: Ní ìlànà gírámà, a sọ ọ́ gẹ́gẹ́ bí ‘ìyè àìnípẹ̀kun náà’; ṣùgbọ́n nínú àyíká yìí, ó ń tọ́ka sí Ọmọ gẹ́gẹ́ bí ẹni—ẹni tí ó wà pẹ̀lú Baba, tí ó sì farahàn sí àwọn aposteli.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: ìyè náà
  rationale: A pa ìsọ̀dí pàtó náà mọ́ nípasẹ̀ ‘náà,’ nítorí ọ̀rọ̀ náà ń tọ́ka sí òtítọ́ pàtó kan tí ó ní ìbáṣepọ̀ pẹ̀lú Ọmọ, kì í ṣe ìyè gẹ́gẹ́ bí èrò lásán.
- source_word: ἐφανερώθη
  choice: farahàn
  rationale: ‘Farahàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè túmọ̀ sí pé ohun tí a kò rí tẹ́lẹ̀ di mímọ̀ tàbí di rírí; ó tún bá ìṣe aláìṣe-pàtó ti Gíríìkì mu láìfi àlàyé kún un.
- source_word: ἑωράκαμεν
  choice: àwa sì ti rí i
  rationale: Àmì ‘ti’ ń fi ìṣe tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ ṣì wà hàn, ó sì pa ìtẹnumọ́ ẹlẹ́rìí ojú mọ́.
- source_word: μαρτυροῦμεν
  choice: a sì ń jẹ́rìí
  rationale: ‘Jẹ́rìí’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ fífi ẹ̀rí ohun tí ẹni rí múlẹ̀ mọ́.
- source_word: ἀπαγγέλλομεν
  choice: a sì ń kéde
  rationale: ‘Kéde’ yàtọ̀ sí ‘jẹ́rìí,’ ó sì sọ ìtumọ̀ ìpolongo tàbí jíjíṣẹ́ ní gbangba.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi olùgbà ìkéde hàn.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun náà
  rationale: ‘Àìnípẹ̀kun’ sọ ohun tí kò ní òpin; ‘náà’ sì pa ìsọ̀dí pàtó ti gbólóhùn Gíríìkì mọ́.
- source_word: ἥτις
  choice: èyí tí
  rationale: A tọ́ka padà sí ‘ìyè’ gẹ́gẹ́ bí ọ̀rọ̀-orúkọ, láìyí i padà sí arọ́pò-orúkọ ẹni tàbí dárúkọ Ọmọ ní tààrà.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: ó wà pẹ̀lú Baba
  rationale: ‘Wà pẹ̀lú Baba’ jẹ́ Yorùbá àdánidá, ó sì pa ìsúnmọ́ àti ìbáṣepọ̀ tí πρὸς ń fi hàn mọ́ láìṣàlàyé rẹ̀ ju ti orísun lọ.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: A lo ‘Baba’ gẹ́gẹ́ bí oyè Ọlọ́run nínú àyíká yìí.
- source_word: ἡμῖν
  choice: sí wa
  rationale: Èyí bá ‘farahàn’ mu ní Yorùbá, ó sì tẹnumọ́ pé àwọn aposteli ni ó rí ìfarahàn náà.
theological_decisions:
- issue: Bóyá kí a sọ ‘ìyè’ di ẹni ní tààrà
  choice: A pa ‘ìyè náà’ àti ‘ìyè àìnípẹ̀kun náà’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘Òun sì farahàn’ tàbí dídárúkọ Ọmọ ní tààrà.
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí Ọmọ gẹ́gẹ́ bí ẹni, Gíríìkì lo ζωὴ, ‘ìyè,’ kì í ṣe orúkọ Ọmọ tàbí arọ́pò-orúkọ akọ. Ìtumọ̀ yìí pa ọ̀nà ọ̀rọ̀ Johanu àti ìfarapamọ́ ìtumọ̀ rẹ̀ mọ́.
- issue: Bí a ṣe máa fi ìwà-tẹ́lẹ̀ Ọmọ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Baba hàn
  choice: ‘èyí tí ó wà pẹ̀lú Baba’
  alternative: ‘èyí tí ó wà níwájú Baba’ tàbí ‘ní ojú Baba’
  rationale: ‘Pẹ̀lú Baba’ fi ìbáṣepọ̀ àti ìsúnmọ́ hàn ní kedere, ó sì bá lílo Johanu mu láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ sí ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. A pa ìtẹ̀síwájú gbólóhùn láti ẹsẹ 1 mọ́ nípasẹ̀ àmì gígùn ní ìbẹ̀rẹ̀ àti òpin.
