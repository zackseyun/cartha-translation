  source_fidelity: 'Ọ̀rọ̀ pàtàkì náà fara mọ́ Gíríìkì dáadáa: ‘farahàn’ ń gbé ἐφανερώθη kalẹ̀; ‘àwa sì ti rí i’ ń pa iye pípé ti ἑωράκαμεν mọ́; ‘jẹ́rìí’ àti ‘kéde’ yàtọ̀ gẹ́gẹ́ bí μαρτυροῦμεν àti ἀπαγγέλλομεν. ‘èyí tí ó wà pẹ̀lú Baba’ ń tọ́ka sí ‘ìyè àìnípẹ̀kun náà’ láìsọ ọ́ di ẹni ní tààrà. Àmọ́, àlàyé ìsàlẹ̀ a lọwọlọwọ fún [a] ní ‘di mímọ̀,’ èyí tí ó túmọ̀ sí becoming holy, kì í ṣe being revealed, nítorí náà ó lè ṣi ìtumọ̀ ἐφανερώθη.'
