  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: yo
  text: Àwa sì ń kọ nǹkan wọ̀nyí kí ayọ̀ wa lè kún[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ka “ayọ̀ yín” dípò “ayọ̀ wa.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so gbólóhùn yìí mọ́ ẹ̀rí inú àwọn ẹsẹ tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà arọ́pò-orúkọ náà mọ́, ó sì tọ́ka sí gbogbo ohun tí àwọn òǹkọ̀wé ń kọ.
- source_word: γράφομεν
  choice: ń kọ
  rationale: Àmì ìṣe aláìparí “ń” mú ìṣe tí ń lọ lọ́wọ́ yọ, ó sì bá ọ̀rọ̀ lẹ́tà mu.
- source_word: ἡμεῖς
  choice: Àwa
  rationale: Arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì ní ìtẹnumọ́ díẹ̀; “Àwa” pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Àgbékalẹ̀ Yorùbá àdánidá yìí fi ète tàbí àbájáde tí a ń retí hàn.
- source_word: χαρά
  choice: ayọ̀
  rationale: “Ayọ̀” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere, tí ó sì bá ìtumọ̀ Johannine mu.
- source_word: ἡμῶν
  choice: wa
  rationale: Ó túmọ̀ kíkà SBLGNT, ἡμῶν, ní tààrà gẹ́gẹ́ bí ẹni kìíní ọ̀pọ̀.
- source_word: ᾖ πεπληρωμένη
  choice: lè pé
  rationale: Ó sọ ipò tí ayọ̀ dé ẹ̀kúnrẹ́rẹ́ rẹ̀ ní Yorùbá àdánidá, láìfi dandan túmọ̀ ọ́ sí ìmúṣẹ àsọtẹ́lẹ̀.
theological_decisions:
- issue: Arọ́pò-orúkọ inú gbólóhùn ἡ χαρὰ ἡμῶν
  choice: ayọ̀ wa
  alternative: ayọ̀ yín
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè ka ἡμῶν, “wa.” Nítorí “yín” jẹ́ ìyàtọ̀ pàtàkì nínú àwọn àfọwọ́kọ kan, a pa á mọ́ sínú àlàyé ìsàlẹ̀ dípò fífi sí ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́, tó níyì, tí ó sì rọrùn fún òǹkàwé gbogbogbòò; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
