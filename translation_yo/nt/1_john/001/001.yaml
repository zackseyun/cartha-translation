  naturalness: 'Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá boṣewa, ó sì yẹ fún ìforígbárí ìwé náà. “Ọwọ́ wa sì fọwọ́ kàn” jẹ́ ìlò tó tẹnumọ́ ìfọwọ́kàn pẹ̀lú ọwọ́, ó sì bá ẹ̀rí ojú-ara mu. Àtúnṣe kékeré kan nínú akọsílẹ̀ b yóò mú un dáa sí i: “ìhìn iṣẹ́” lè túmọ̀ sí iṣẹ́/mísíònù, kì í ṣe ìhìn tàbí ọ̀rọ̀ tí λόγος lè túmọ̀ sí níbí.'
