id: 1JN.1.1
reference: 1 John 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: yo
  text: Ohun tí ó wà láti ìbẹ̀rẹ̀[a], ohun tí àwa ti gbọ́, ohun tí àwa ti fi ojú wa rí, ohun tí àwa tẹjú wò, tí ọwọ́ wa sì fọwọ́ kàn, nípa ọ̀rọ̀ ìyè[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì lo arọ́pò-orúkọ tí kò fi akọ tàbí abo hàn. Ó lè tọ́ka ní gbòòrò sí gbogbo ẹ̀rí àwọn àpọ́sítélì nípa Ọmọ náà, dípò kí ó pè é ní “ẹni tí” ní tààrà.
    reason: alternative_reading
  - marker: b
    text: Ó tún ṣeé túmọ̀ sí “Ọ̀rọ̀ Ìyè.” Gbólóhùn náà lè tọ́ka sí Ọmọ náà gẹ́gẹ́ bí ẹni, pẹ̀lú ìbámu tí a mọ̀ọ́mọ̀ ṣe sí Johanu 1:1; ó sì lè tọ́ka sí ìhìn tí ń fúnni ní ìyè nípa rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Ohun tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ti akọ tàbí abo tí a kò pààlà sí ní Gíríìkì; “ohun tí” pa ìtànkálẹ̀ ìtumọ̀ yẹn mọ́, kò sì sọ ọ́ di “ẹni tí” ní pàtó.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: ó wà láti ìbẹ̀rẹ̀
  rationale: Èyí tẹ̀ lé ìtumọ̀ àkókò imperfect náà lọ́nà tààrà, ó sì pa ìró èdè Johanu “láti ìbẹ̀rẹ̀” mọ́.
- source_word: ἀκηκόαμεν
  choice: àwa ti gbọ́
  rationale: “Ti gbọ́” fi hàn pé ìgbọ́ náà ṣẹlẹ̀ tẹ́lẹ̀, ẹ̀rí rẹ̀ sì ṣì dúró; “àwa” tún tẹnumọ́ àwọn ẹlẹ́rìí.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: àwa ti fi ojú wa rí
  rationale: Èyí pa perfect náà àti ìtẹnumọ́ ẹ̀rí ojú ara ẹni mọ́ ní Yorùbá àdánidá.
- source_word: ἐθεασάμεθα
  choice: àwa tẹjú wò
  rationale: “Tẹjú wò” túmọ̀ sí wíwo pẹ̀lú àkíyèsí, kì í ṣe rírí lásán.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: ọwọ́ wa sì fọwọ́ kàn
  rationale: Èyí pa bí ọwọ́ ṣe jẹ́ olùṣe nínú Gíríìkì mọ́, ó sì fi jíjẹ́ gidi ti ìfọwọ́kàn náà hàn.
- source_word: περὶ
  choice: nípa
  rationale: “Nípa” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti fi kókó ẹ̀rí tí a ń sọ̀rọ̀ lé lórí hàn.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: ọ̀rọ̀ ìyè
  rationale: “Ọ̀rọ̀” lè tọ́ka sí ọ̀rọ̀ tàbí ìhìn iṣẹ́, ó sì tún lè ní ìró ìtumọ̀ ti Ọmọ náà; lílo lẹ́tà kékeré kò fi tipátipá yan ọ̀kan nínú wọn.
theological_decisions:
- issue: Ohun tí àwọn gbólóhùn arọ́pò-orúkọ náà àti λόγος ń tọ́ka sí
  choice: A lo “Ohun tí” àti “ọ̀rọ̀ ìyè” láì sọ ọ́ di ẹni akọ tàbí orúkọ oyè ní pàtó.
  alternative: “Ẹni tí ó wà láti ìbẹ̀rẹ̀” tàbí “Ọ̀rọ̀ Ìyè.”
  rationale: 'Àyíká ọ̀rọ̀ náà ní ẹ̀rí nípa Kristi, ṣùgbọ́n Gíríìkì lo arọ́pò-orúkọ tí kò sọ akọ tàbí abo, kò sì ní ọ̀nà láti fi lẹ́tà ńlá yan orúkọ oyè. Ìtumọ̀ yìí pa àfojúsùn méjèèjì mọ́: Ọmọ náà àti ìhìn iṣẹ́ ìyè nípa rẹ̀.'
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àtúnsọ “ohun tí” pa ìlànà àti ìtẹnumọ́ Gíríìkì mọ́; “tẹjú wò” àti “fọwọ́ kàn” mú ẹ̀rí ìrírí ara ẹni hàn kedere.
