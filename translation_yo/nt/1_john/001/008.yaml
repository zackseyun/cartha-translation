id: 1JN.1.8
reference: 1 John 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: yo
  text: Bí a bá sọ pé a kò ní ẹ̀ṣẹ̀ kankan[a], a ń tan ara wa jẹ, òtítọ́ kò sì sí nínú wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tí ó túbọ̀ ṣàlàyé, “ìwà ẹlẹ́ṣẹ̀”; Gíríìkì sọ ní tààrà pé “ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Bí a bá sọ pé
  rationale: Èyí fi ọ̀rọ̀ oníṣ شرط hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ aorist subjunctive lẹ́yìn ἐὰν mọ́.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: a kò ní ẹ̀ṣẹ̀ kankan
  rationale: “Ẹ̀ṣẹ̀” dúró gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀ fún wíwà ẹ̀ṣẹ̀, kì í ṣe ìṣe ẹ̀ṣẹ̀ kan ṣoṣo; “kankan” mú agbára ìkọ̀sílẹ̀ náà ṣe kedere láì yí ẹ̀ṣẹ̀ padà sí ọ̀pọ̀ ìṣe.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: a ń tan ara wa jẹ
  rationale: Ọ̀rọ̀ Yorùbá àdánidá ni fún fífi ara ẹni sínú ìṣìnà tàbí ẹ̀tàn.
- source_word: ἡ ἀλήθεια
  choice: òtítọ́
  rationale: Ó pa ìtumọ̀ Johannine tí ó lè kan òtítọ́ Ọlọ́run àti jíjẹ́ olóòótọ́ mọ́, láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: kò sì sí nínú wa
  rationale: Ó tẹ̀ lé gbólóhùn Gíríìkì ní ti wíwà ohun kan nínú ẹni, ó sì jẹ́ Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìtumọ̀ “ẹ̀ṣẹ̀” nínú gbólóhùn “a kò ní ẹ̀ṣẹ̀”
  choice: A lò “a kò ní ẹ̀ṣẹ̀ kankan,” èyí tó ń tọ́ka sí wíwà ẹ̀ṣẹ̀ nínú ẹni.
  alternative: “A kò ti dá ẹ̀ṣẹ̀ rí” tàbí “a kò ní ẹ̀ṣẹ̀ inú.”
  rationale: Gíríìkì sọ pé “ní ẹ̀ṣẹ̀,” kò sọ pé “dá ẹ̀ṣẹ̀”; èyí pa ìyàtọ̀ tó wà láàárín ẹsẹ yìí àti 1 Jòhánù 1:10 mọ́.
- issue: Ìtumọ̀ “òtítọ́ kò sí nínú wa”
  choice: A pa gbólóhùn náà mọ́ láì ṣàlàyé “òtítọ́” sí i.
  alternative: “Òtítọ́ Ọlọ́run kò sí nínú wa” tàbí “a kò gbé nínú òtítọ́.”
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìró méjèèjì—òtítọ́ tí Ọlọ́run fi hàn àti jíjẹ́ olóòótọ́—nítorí náà a kò yanju ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ náà ní ìtumọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A lò àmì ohùn ní kíkún níbi tó yẹ; “tan ara wa jẹ” jẹ́ ọ̀rọ̀ àdánidá, nígbà tí “òtítọ́ kò sì sí nínú wa” pa ìwọ̀n àti ìró ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
