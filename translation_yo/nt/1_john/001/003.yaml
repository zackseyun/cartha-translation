id: 1JN.1.3
reference: 1 John 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: yo
  text: Ohun tí àwa ti rí, tí a sì ti gbọ́, ni àwa ń kéde fún yín náà, kí ẹ̀yin náà lè ní ìdàpọ̀[a] pẹ̀lú wa; ní tòótọ́, ìdàpọ̀ wa sì wà pẹ̀lú Bàbá àti pẹ̀lú Ọmọ rẹ̀, Jésù Mèsáyà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ‘ìdàpọ̀’ sí ‘ìrẹ́pọ̀,’ ‘àjọpín,’ tàbí ‘ìkópa papọ̀’; ọ̀rọ̀ náà tẹnu mọ́ ìgbésí ayé àti ìbáṣepọ̀ tí àwọn ènìyàn ń pín papọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘Jésù Kristi.’ A lè túmọ̀ Χριστός, oyè Gíríìkì, sí ‘Kristi’ tàbí ‘Mèsáyà’; níhìn-ín a lò ‘Mèsáyà’ láti pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: Ohun tí
  rationale: Ó pa ìtọ́kasí aláìdáni ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ‘ohun tí’.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: àwa ti rí, tí a sì ti gbọ́
  rationale: Àmì ‘ti’ fi hàn pé ìrírí náà ṣẹlẹ̀ tẹ́lẹ̀ ṣùgbọ́n ẹ̀rí rẹ̀ ṣì dúró; ‘àwa’ tún tẹnu mọ́ àwọn ẹlẹ́rìí náà.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: àwa ń kéde fún yín pẹ̀lú
  rationale: ‘ń kéde’ sọ ìpolongo tàbí ìjíṣẹ́ ẹ̀rí ní kedere, ‘pẹ̀lú’ sì dúró fún καὶ tó bá ὑμῖν lọ.
- source_word: ἵνα καὶ ὑμεῖς
  choice: kí ẹ̀yin náà lè
  rationale: Ó fi ète gbólóhùn náà hàn, ó sì pa ìtẹnumọ́ ‘ẹ̀yin náà’ mọ́.
- source_word: κοινωνίαν
  choice: ìdàpọ̀
  rationale: ‘Ìdàpọ̀’ lè gba ìtumọ̀ ìbáṣepọ̀, ṣíṣe àjọpín, àti kíkópa papọ̀; kò fi ọ̀rọ̀ náà mọ́ ìbákẹ́gbẹ́ awujọ nìkan.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: ní tòótọ́, ìdàpọ̀ wa sì
  rationale: ‘ní tòótọ́’ mú agbára ìṣàlàyé δέ jáde, ‘sì’ sì so gbólóhùn náà mọ́ ohun tó ṣáájú láì sọ ìyàtọ̀ tó le ju ti Gíríìkì lọ.
- source_word: μετὰ τοῦ πατρὸς
  choice: pẹ̀lú Baba
  rationale: ‘Baba’ jẹ́ orúkọ ipò fún Ọlọ́run ní àyíká ọ̀rọ̀ Johanu.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: pẹ̀lú Ọmọ rẹ̀
  rationale: Ó pa ìbáṣepọ̀ Baba àti Ọmọ mọ́ ní Yorùbá tó ṣe kedere, tó sì jẹ́ àdánidá.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; ‘Mèsáyà’ pa ìtumọ̀ ẹni àmì òróró yàn mọ́ dípò kí ó dà bí apá kan orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àfikún sí ‘Jesu’; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ọ̀nà ìtumọ̀ ìbílẹ̀ ‘Kristi’ mọ́.
- issue: Ìwọ̀n ìtumọ̀ κοινωνία
  choice: ìdàpọ̀
  alternative: ìrẹ́pọ̀; àjọpín; ìkópa papọ̀
  rationale: ‘Ìdàpọ̀’ jẹ́ kí ọ̀rọ̀ náà lè tọ́ka sí ìbáṣepọ̀ àti ìkópa nínú ìgbésí ayé kan náà, láàárín àwọn onígbàgbọ́ àti pẹ̀lú Baba àti Ọmọ, láì dín ìtumọ̀ rẹ̀ kù sí ẹ̀ka ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn ọ̀rọ̀ arọ́pò-orúkọ ‘àwa’ àti ‘ẹ̀yin’ mú ìtẹnumọ́ inú Gíríìkì jáde. A fi àmì ìsàlẹ̀ ojú ewé [a] sí ‘ìdàpọ̀’ àti [b] sí ‘Jesu Mèsáyà’ kí àmì kọ̀ọ̀kan bá àlàyé tirẹ̀ mu.
