  source_fidelity: Ìtumọ̀ náà pa ìpò àdéhùn, arọ́pò-orúkọ ‘rẹ̀,’ àkàwé rírìn nínú òkùnkùn, àti ìyàtọ̀ láàárín ohun tí a sọ àti ìwà ẹni mọ́. Ṣùgbọ́n ‘ìdàpọ̀’ kì í ṣe ọ̀rọ̀ tó péye jù fún κοινωνία nínú àyíká yìí; ó sábà máa ń tọ́ka sí dídàpọ̀ àwọn nǹkan, dípò ìbáṣepọ̀/fẹ́lòọ́ṣípì. Gbólóhùn ‘a kò sì ń ṣe ohun tí ó jẹ́ òtítọ́’ tún fi ‘ohun tí ó jẹ́’ kún ọ̀rọ̀ náà láìní ìdí nínú Gíríìkì.
  naturalness: ‘A ń purọ́’ jẹ́ ọ̀nà Yorùbá boṣewa tó rọrùn, tó sì tààrà láti fi ψευδόμεθα hàn. ‘Ṣe òtítọ́’ jẹ́ ìfaradà tí ó sún mọ́ Gíríìkì; àlàyé ìsàlẹ̀ ṣàlàyé idiom náà fún olùkà.
  terminology: A rọ́pò ‘ìdàpọ̀’ pẹ̀lú ‘ìbáṣepọ̀,’ ọ̀rọ̀ tó wọ́pọ̀, tó sì dára fún κοινωνία nínú ìtumọ̀ ìwé mímọ́. ‘Òkùnkùn,’ ‘rìn,’ àti ‘òtítọ́’ wà ní ìbámu pẹ̀lú ọ̀rọ̀ Jòhánù, láìsọ àkàwé náà di ẹ̀kọ́ ìjọ kan.
