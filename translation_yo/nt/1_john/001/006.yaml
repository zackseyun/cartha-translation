id: 1JN.1.6
reference: 1 John 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: yo
  text: Bí a bá sọ pé a ní ìbáṣepọ̀ pẹ̀lú rẹ̀, tí a sì ń rìn nínú òkùnkùn[a], a ń purọ́, a kò sì ń ṣe òtítọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì ní ‘nínú òkùnkùn náà’; article náà lè tẹnu mọ́ òkùnkùn gẹ́gẹ́ bí agbègbè ìwà àti ẹ̀mí tí ó lòdì sí Ọlọ́run nínú àwọn ìwé Jòhánù.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, ‘a kò sì ń ṣe òtítọ́.’ Èyí jẹ́ àṣà ọ̀rọ̀ Jòhánù tí ń so òtítọ́ mọ́ ìṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Bí a bá sọ pé
  rationale: Ó fi ipò àdéhùn tí ó ṣeé ṣe hàn ní Yorùbá láìfi ìtumọ̀ ‘jẹ́wọ́’ tàbí ‘fẹ̀sùn kan’ kún un.
- source_word: κοινωνίαν ἔχομεν
  choice: a ní ìdàpọ̀
  rationale: ‘Ìdàpọ̀’ sọ ìbáṣepọ̀ àti ohun tí àwọn ẹni méjì ń pín pọ̀, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì ‘ní ìdàpọ̀’ mọ́.
- source_word: μετ’ αὐτοῦ
  choice: pẹ̀lú rẹ̀
  rationale: A pa arọ́pò-orúkọ náà mọ́ bí ó ti rí nínú Gíríìkì, láìrọ́pò rẹ̀ pẹ̀lú ‘Ọlọ́run,’ bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí Ọlọ́run.
- source_word: ἐν τῷ σκότει
  choice: nínú òkùnkùn
  rationale: Ó pa àwòrán òkùnkùn mọ́ gẹ́gẹ́ bí agbègbè ìwà àti ẹ̀mí tí ó lòdì sí Ọlọ́run; Yorùbá kò ní àmì atúmọ̀ pàtó tí ó bá article Gíríìkì mu ní gbogbo ọ̀nà.
- source_word: περιπατῶμεν
  choice: a ń rìn
  rationale: ‘Rìn’ pa àkàwé Bíbélì fún ìgbésí ayé àti ìwà ènìyàn mọ́, ó sì ṣì ṣe kedere ní Yorùbá òde òní.
- source_word: ψευδόμεθα
  choice: irọ́ ni a ń pa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a ń purọ́, ó sì fi ìṣe tí ń bá a lọ hàn.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: a kò sì ń ṣe ohun tí ó jẹ́ òtítọ́
  rationale: Èyí mú àṣà ọ̀rọ̀ Gíríìkì ‘ṣe òtítọ́’ wá sí Yorùbá tí ó ṣeé lóye, nígbà tí ó ṣì so òtítọ́ mọ́ ìṣe dípò ìmọ̀ tàbí ọ̀rọ̀ ẹnu nìkan.
theological_decisions:
- issue: Àkàwé òkùnkùn nípa ìwà àti ẹ̀mí
  choice: Pa ‘rìn nínú òkùnkùn’ mọ́
  alternative: gbé nínú ẹ̀ṣẹ̀
  rationale: Nínú àwọn ìwé Jòhánù, òkùnkùn ní ìtumọ̀ gbígbòòrò tó kan ibi, èké, àti jíjìnnà sí Ọlọ́run. A kò dín àkàwé náà kù sí ẹ̀ṣẹ̀ nìkan.
- issue: Ìbáṣepọ̀ òtítọ́ pẹ̀lú ìṣe
  choice: ṣe ohun tí ó jẹ́ òtítọ́
  alternative: sọ òtítọ́
  rationale: Gíríìkì ń sọ nípa ṣíṣe òtítọ́, kì í ṣe sísọ òtítọ́ nìkan; ìtumọ̀ yìí pa ìjà theological tó wà láàárín ohun tí a sọ àti bí a ṣe ń gbé ayé mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó lọ́lá, ó sì ṣeé lóye fún gbogbo ènìyàn. A pa àwọn àkàwé ‘rìn’ àti ‘òkùnkùn’ mọ́ láìtú wọn sí ẹ̀kọ́ ẹ̀sìn ẹlẹ́gbẹ́ kan.
