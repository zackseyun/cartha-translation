id: 1JN.1.9
reference: 1 John 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: yo
  text: Bí a bá jẹ́wọ́ àwọn ẹ̀ṣẹ̀ wa, ó jẹ́ olóòótọ́ àti olódodo[a] láti dárí àwọn ẹ̀ṣẹ̀ wa jì wá, àti láti wẹ̀ wá mọ́ kúrò nínú gbogbo àìṣòdodo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ó ṣe òdodo”: “ó jẹ́ olóòótọ́, ó sì ṣe òdodo láti dárí àwọn ẹ̀ṣẹ̀ wa jì wá, àti láti wẹ̀ wá mọ́ kúrò nínú gbogbo àìṣòdodo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Bí ... bá
  rationale: Àkójọpọ̀ ‘bí ... bá’ ni ọ̀nà Yorùbá àdánidá láti sọ gbólóhùn oníṣ شرط, ó sì pa agbára ìtumọ̀ ‘if’ mọ́ láì sọ ọ́ di ohun tó gbọdọ̀ máa ṣẹlẹ̀ léraléra.
- source_word: ὁμολογῶμεν
  choice: a bá jẹ́wọ́
  rationale: ‘Jẹ́wọ́’ túmọ̀ sí fífi ẹnu gba ohun tí a ṣe; ó yẹ fún ọ̀rọ̀ ẹ̀ṣẹ̀, ó sì ru ìtumọ̀ ìmúwọ́lé àti ìjẹ́wọ́ gbangba.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: àwọn ẹ̀ṣẹ̀ wa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ọ̀pọ̀ nǹkan nínú Gíríìkì mu.
- source_word: πιστός
  choice: olóòótọ́
  rationale: ‘Olóòótọ́’ sọ pé Ọlọ́run ṣeé gbẹ́kẹ̀ lé, ó sì dúró ṣinṣin nínú ìwà àti ọ̀rọ̀ rẹ̀.
- source_word: δίκαιος
  choice: olódodo
  rationale: ‘Olódodo’ pa ìtumọ̀ ìwà rere àti ṣíṣe ohun tó tọ́ mọ́, láì fi ọ̀rọ̀ náà mọ́ ìdájọ́ ilé-ẹjọ́ nìkan.
- source_word: ἵνα
  choice: láti
  rationale: Lẹ́yìn ‘olóòótọ́ àti olódodo,’ ‘láti’ jẹ́ ọ̀nà Yorùbá tó rọrùn láti fi ìdí tàbí àbájáde tí ọ̀rọ̀ Gíríìkì lè ní hàn, láì pinnu àìdánilójú náà jù.
- source_word: ἀφῇ
  choice: dárí ... jì
  rationale: ‘Dárí ẹ̀ṣẹ̀ jì’ ni gbólóhùn Yorùbá àdánidá fún ìdáríjì ẹ̀ṣẹ̀.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: dárí àwọn ẹ̀ṣẹ̀ wa jì wá
  rationale: Ìṣètò yìí sọ ẹni tí a dárí jì àti ohun tí a dárí jì ní Yorùbá tó ṣe kedere.
- source_word: καθαρίσῃ
  choice: wẹ̀ wá mọ́
  rationale: ‘Wẹ̀ ... mọ́’ pa àwòrán ìmímọ́ kúrò nínú ẹ̀gbin ìwà búburú mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: kúrò nínú gbogbo àìṣòdodo
  rationale: ‘Gbogbo àìṣòdodo’ pa ìbú ìtumọ̀ ἀδικία mọ́—ohun gbogbo tí kò tọ́ tàbí tí kò bá òdodo mu.
theological_decisions:
- issue: Ìtumọ̀ δίκαιος ní ìbáṣepọ̀ pẹ̀lú ìdáríjì Ọlọ́run
  choice: olódodo
  alternative: ó ṣe òdodo
  rationale: Ẹsẹ náà fi ìdáríjì àti ìwẹ̀nùmọ́ lélẹ̀ lórí irú ẹni tí Ọlọ́run jẹ́. ‘Olódodo’ gba ìwà rere àti ṣíṣe ohun tó tọ́ sínú, nígbà tí ‘ó ṣe òdodo’ lè tẹnu mọ́ ìdájọ́ tàbí ìṣe tó tọ́. Àlàyé ìsàlẹ̀ pa àṣàyàn kejì mọ́ láì fi ìtumọ̀ ọ̀kan ṣoṣo lé ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: A lo Yorùbá àมาตรฐาน tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Bí ... bá,’ ‘jẹ́wọ́,’ ‘dárí ... jì,’ àti ‘wẹ̀ ... mọ́’ jẹ́ àwọn ọ̀nà Yorùbá àdánidá; a sì yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
