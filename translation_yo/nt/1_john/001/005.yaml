id: 1JN.1.5
reference: 1 John 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: yo
  text: 'Èyí sì ni ìhìn náà tí a ti gbọ́ láti ọ̀dọ̀ rẹ̀, tí a sì ń kéde fún yín: Ọlọ́run jẹ́ ìmọ́lẹ̀, kò sì sí òkùnkùn kankan nínú rẹ̀.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: iṣẹ́
  rationale: “Iṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a gbọ́ tí a sì ń sọ dé ọ̀dọ̀ àwọn ẹlòmíràn; ó bá àyíká lẹ́tà yìí mu ju “ìkéde” gẹ́gẹ́ bí nọ́ọ̀nù lọ.
- source_word: ἀκηκόαμεν
  choice: àwa ti gbọ́
  rationale: “Ti gbọ́” fi hàn pé gbígbọ́ náà ti ṣẹlẹ̀, ipa rẹ̀ sì wà títí di ìsinsìnyí; fífi “àwa” hàn ń mú àfọwọ́ṣe Gíríìkì náà ṣe kedere.
- source_word: ἀπ’ αὐτοῦ
  choice: láti ọ̀dọ̀ rẹ̀
  rationale: A pa arọ́pò-orúkọ orísun náà mọ́ láì fi “Jésù” tàbí “Ọmọ” kún un, kí ìtumọ̀ má bà a yan ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἀναγγέλλομεν
  choice: a sì ń kéde
  rationale: “Ń kéde” sọ ìgbésẹ̀ ìsinsìnyí ti fífi iṣẹ́ tí a gbà dé ọ̀dọ̀ àwọn olùgbọ́; ó tún ní agbára gbangba tí ọ̀rọ̀ Gíríìkì ní.
- source_word: ὅτι
  choice: ':'
  rationale: Àmì ẹ̀ẹ̀mejì ṣàgbékalẹ̀ àkóónú iṣẹ́ náà lọ́nà Yorùbá tó rọrùn, láì nílò láti tún “pé” fi kún un lẹ́yìn “Èyí ... ni.”
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Ọlọ́run jẹ́ ìmọ́lẹ̀
  rationale: A pa àkàwé alágbára náà mọ́ ní tààrà, láì fi “mímọ́” tàbí “funfun” kún un; “ìmọ́lẹ̀” jẹ́ àpèjúwe ìwà tàbí ìṣesí Ọlọ́run, kì í ṣe ìdánimọ̀ ohun kan tí a ń pè ní “ìmọ́lẹ̀ náà.”
- source_word: σκοτία
  choice: òkùnkùn
  rationale: “Òkùnkùn” jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, ó sì pa agbára gidi àti ti ìṣàpẹẹrẹ ọ̀rọ̀ náà mọ́.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: “Nínú rẹ̀” pa àsọyé àpẹẹrẹ Gíríìkì mọ́ láì túmọ̀ rẹ̀ ju bí a ti kọ ọ́ lọ.
- source_word: οὐδεμία
  choice: kankan
  rationale: Nínú gbólóhùn òdì “kò sí ... kankan,” ọ̀rọ̀ yìí fi agbára ìkọ̀sílẹ̀ pátápátá hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Àkàwé olùwàásù “Ọlọ́run jẹ́ ìmọ́lẹ̀”
  choice: 'A pa àkàwé náà mọ́ ní tààrà: “Ọlọ́run jẹ́ ìmọ́lẹ̀.”'
  alternative: “Ọlọ́run jẹ́ ìmọ́lẹ̀ mímọ́” tàbí “Ọlọ́run ni ìmọ́lẹ̀ náà.”
  rationale: Gíríìkì sọ àkàwé náà ní kíkún láì ṣe àlàyé rẹ̀. Fífi “mímọ́” kún un yóò dín ìbú ìtumọ̀ rẹ̀ kù, fífi “náà” kún un sì lè yí àpèjúwe ìwà padà sí ìdánimọ̀ ohun pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “iṣẹ́” fún ἀγγελία àti “ń kéde” fún ἀναγγέλλομεν; ìbáṣepọ̀ ìtumọ̀ wọn wà, bí ó tilẹ̀ jẹ́ pé Yorùbá kò lè pa ìbáṣepọ̀ gbòǹgbò ọ̀rọ̀ Gíríìkì mọ́ pátápátá. Kò sí àlàyé ìsàlẹ̀ ojú ìwé nítorí àlàyé Gẹ̀ẹ́sì tí a pèsè fún [a] kò bá ibi àmì náà wà, ó sì jọ pé ó ń tọ́ka sí àṣàyàn fún ἀναγγέλλομεν; àṣàyàn yẹn kò nílò fún ẹsẹ Yorùbá yìí.
