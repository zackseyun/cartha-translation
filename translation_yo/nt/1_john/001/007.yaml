  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti àwòrán Gíríìkì dáadáa: ipò àdéhùn náà, ‘rìn nínú ìmọ́lẹ̀,’ ìfiwéra náà, ìbáṣepọ̀ alábàápín, àti ìwẹ̀nùmọ́ kúrò nínú gbogbo ẹ̀ṣẹ̀ wà níbẹ̀. Síbẹ̀, àmì ohùn nínú ‘wá’ lè yí ìtumọ̀ aṣojú ẹni-àkọ́kọ́ púpọ̀ padà; ó yẹ kí ó jẹ́ ‘wa.’'
  naturalness: ‘Ìbáṣepọ̀ pẹ̀lú ara wa’ dáa ju ‘ìdàpọ̀ pẹ̀lú ara wa’ lọ fún κοινωνία nínú Yorùbá òde òní, nítorí ‘ìdàpọ̀’ lè dá bí ìpọ̀-ọ̀rọ̀ tàbí ìṣọ̀kan ohun. ‘Gẹ́gẹ́ bí òun tìkára rẹ̀ ṣe wà’ sì jẹ́ ìṣàn Yorùbá tó rọrùn.
  terminology: A pa ‘ìmọ́lẹ̀,’ ‘rìn,’ ‘ẹ̀jẹ̀,’ ‘Ọmọ rẹ̀,’ àti ‘wẹ̀ … mọ́’ mọ́. ‘Ìbáṣepọ̀’ ní ìforúkọsílẹ̀ tó dára fún κοινωνία láì fi ìtumọ̀ sacramenti tàbí ẹ̀kọ́ ìjọ kan kún un.
  issues:
