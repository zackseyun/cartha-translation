    issue: ‘ń wẹ̀ wá mọ́’
    rationale: Nínú gbólóhùn yìí, aṣojú ohun ‘wa’ (us) kò ní àmì ohùn gíga. Ìkọ̀wé ‘wá’ lè ka sí ọ̀rọ̀ míì (‘come’) tàbí fa ìdàrúdàpọ̀. ‘Ń wẹ̀ wa mọ́’ ni ó yẹ.
  - severity: medium
    issue: ‘Ìdàpọ̀’ fún κοινωνία
    rationale: Bí ó tilẹ̀ lè tọ́ka sí ìṣọ̀kan, ‘ìdàpọ̀’ kì í ṣe ọ̀rọ̀ tó rọrùn jù lọ fún ìbáṣepọ̀ alábàápín nínú àyíká yìí. ‘Ìbáṣepọ̀’ pa ìtumọ̀ ìjọṣepọ̀/shared fellowship mọ́ dáadáa.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ a bẹrẹ pẹ̀lú ‘Tàbí, “pẹ̀lú ara wọn.”’
    rationale: ‘Pẹ̀lú ara wọn’ yí ẹni-ọrọ ‘wa’ padà sí ẹni-kẹta, nítorí náà kì í ṣe àṣàyàn ìtumọ̀ tó bá gbólóhùn náà mu. A tún ọ́ ṣe kí ó ṣàlàyé ìtumọ̀ mìíràn láì yí ẹni-ọrọ padà.
