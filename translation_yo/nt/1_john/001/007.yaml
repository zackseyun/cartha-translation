id: 1JN.1.7
reference: 1 John 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ń rìn nínú ìmọ́lẹ̀, gẹ́gẹ́ bí òun tìkára rẹ̀ ṣe wà nínú ìmọ́lẹ̀, a ní ìbáṣepọ̀ pẹ̀lú ara wa[a], ẹ̀jẹ̀ Jesu, Ọmọ rẹ̀, sì ń wẹ̀ wa mọ́ kúrò nínú gbogbo ẹ̀ṣẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn atúmọ̀ kan lóye “pẹ̀lú ara wa” gẹ́gẹ́ bí ìbáṣepọ̀ láàárín wa àti Ọlọ́run, ṣùgbọ́n ọ̀rọ̀ Gíríìkì tó ń fi ìṣe sí ara ẹni hàn sábà máa ń tọ́ka sí ìbáṣepọ̀ alábàápín láàárín àwọn onígbàgbọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kúrò nínú ẹ̀ṣẹ̀ kọ̀ọ̀kan.” A lè lóye Gíríìkì náà gẹ́gẹ́ bí ẹ̀ṣẹ̀ kọ̀ọ̀kan tàbí gẹ́gẹ́ bí gbogbo ẹ̀ṣẹ̀ lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ṣùgbọ́n bí
  rationale: δέ ṣe àfihàn ìyàtọ̀ sí ọ̀rọ̀ ẹsẹ̀ tó ṣáájú nípa rírìn nínú òkùnkùn; “Ṣùgbọ́n bí” jẹ́ ọ̀nà àdánidá láti pa agbára ìyàtọ̀ náà mọ́.
- source_word: ἐν τῷ φωτὶ
  choice: nínú ìmọ́lẹ̀
  rationale: Ó pa àwòrán Johannine ti ìmọ́lẹ̀ mọ́ láì tú ìtumọ̀ rẹ̀ sílẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: περιπατῶμεν
  choice: a bá ń rìn
  rationale: “Ń rìn” pa àkàwé ìwàláàyè inú orísun mọ́, ó sì fi ìṣe tí ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: gẹ́gẹ́ bí òun tìkára rẹ̀ ti wà nínú ìmọ́lẹ̀
  rationale: “Òun tìkára rẹ̀” fi ìtẹnumọ́ αὐτός hàn; “gẹ́gẹ́ bí” sì pa ìfiwéra mọ́ láì sọ pé ìbámu náà dọ́gba pátápátá.
- source_word: κοινωνίαν ἔχομεν
  choice: àwa ní ìdàpọ̀
  rationale: “Ìdàpọ̀” sọ ìkópa àti ìbáṣepọ̀ tí κοινωνία ní jáde ní èdè Yorùbá tó mọ́gbọ́n dání, láì fi ìtumọ̀ ẹ̀sìn àfikún kún un.
- source_word: μετ’ ἀλλήλων
  choice: pẹ̀lú ara wa
  rationale: Èyí jẹ́ ìtumọ̀ reciprocal tó ṣe àdánidá, ó sì fi ìbáṣepọ̀ alábàápín láàárín àwọn onígbàgbọ́ hàn.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: ẹ̀jẹ̀ Jesu Ọmọ rẹ̀
  rationale: Ó pa “ẹ̀jẹ̀” mọ́ gẹ́gẹ́ bí olùṣe nínú gbólóhùn náà, “Ọmọ rẹ̀” sì so Jesu mọ́ Ọlọ́run lọ́nà àdánidá.
- source_word: καθαρίζει
  choice: ń wẹ̀ wá mọ́
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ ìwẹ̀nùmọ́ ti καθαρίζω jáde, àmì “ń” sì fi ìṣe tó ń lọ tàbí tó jẹ́ àṣà hàn láì sọ ọ́ di àlàyé tó pọ̀ jù.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: kúrò nínú gbogbo ẹ̀ṣẹ̀
  rationale: “Gbogbo ẹ̀ṣẹ̀” lè gbé ìtumọ̀ collective ti “all sin” àti ìtumọ̀ distributive ti “every sin” pọ̀ ní Yorùbá; àlàyé ìsàlẹ̀ tọ́ka sí ààyè ìtumọ̀ méjèèjì.
theological_decisions:
- issue: Ohun tí “μετ’ ἀλλήλων” ń tọ́ka sí
  choice: ìdàpọ̀ alábàápín láàárín àwọn onígbàgbọ́
  alternative: ìdàpọ̀ láàárín àwọn onígbàgbọ́ àti Ọlọ́run
  rationale: ἀλλήλων jẹ́ ọ̀rọ̀ reciprocal tí ó sábà máa ń tọ́ka sí àwọn ènìyàn tí wọ́n ń bá ara wọn ṣe. Ẹsẹ̀ náà sì tẹ̀ síwájú pẹ̀lú abajade kejì pé ẹ̀jẹ̀ Jesu ń wẹ̀ “wá” mọ́. Àlàyé ìsàlẹ̀ pa ìtumọ̀ míì tí àwọn kan gbà mọ́.
- issue: Agbára àsìkò ìsinsìnyí nínú καθαρίζει
  choice: ìwẹ̀nùmọ́ tó ń bá a lọ, tí “ń wẹ̀ ... mọ́” fi hàn
  alternative: ìwẹ̀nùmọ́ ẹ̀ẹ̀kan ṣoṣo tàbí ìtumọ̀ tí a mú lágbára sí “ń bá a nìṣó láti wẹ̀”
  rationale: Present indicative Gíríìkì lè fi ìṣe tó ń lọ tàbí tó jẹ́ ìṣe àṣà hàn. Yorùbá “ń wẹ̀ ... mọ́” mú èyí jáde láì ṣe àfikún ẹ̀kọ́ tí orísun kò sọ ní kedere.
translation_notes:
  register: Èdè Yorùbá àgbàṣe tó ní àmì ohùn ni a lò, pẹ̀lú ìforúkọsílẹ̀ ọ̀wọ̀ àti ìṣàn gbólóhùn tó ṣe àdánidá fún òǹkàwé òde òní. A pa àwọn àwòrán “rìn,” “ìmọ́lẹ̀,” “ẹ̀jẹ̀,” àti “wẹ̀ mọ́” mọ́ nítorí wọ́n ṣe pàtàkì nínú ọ̀rọ̀ orísun. “Jesu” ni a lò gẹ́gẹ́ bí akọtọ orúkọ Bíbélì tó wọ́pọ̀.
