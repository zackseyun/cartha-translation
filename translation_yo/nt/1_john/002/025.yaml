  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: yo
  text: 'Èyí sì ni ìlérí tí òun fúnra rẹ̀ ṣèlérí fún wa: ìyè àìnípẹ̀kun.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìyè àìnípẹ̀kun náà.” Ọ̀rọ̀ Gíríìkì ní áríkùlù pàtó, ṣùgbọ́n “ìyè àìnípẹ̀kun” jẹ́ ọ̀nà àdánidá jù lọ ní Yorùbá.
    reason: lexical_alternative
  - marker: b
    text: “Òun fúnra rẹ̀” ní ìtẹnumọ́ nínú Gíríìkì. Ẹsẹ̀ yìí kò sọ ní tààràtà bóyá arọ́pò-orúkọ náà ń tọ́ka sí Baba tàbí Ọmọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: ìlérí / ṣe … fún
  rationale: “Ìlérí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ohun tí a ṣèlérí. Gbólóhùn “ìlérí tí … ṣe fún wa” jẹ́ àdánidá, ó sì pa ìbátan tó wà láàárín orúkọ àti ọ̀rọ̀-ìṣe Gíríìkì mọ́ bí ó ti ṣeé ṣe.
- source_word: αὐτός
  choice: òun fúnra rẹ̀
  rationale: Àṣàyàn yìí fi ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì hàn, láì sọ ẹni tí “òun” ń tọ́ka sí ní pàtó.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ẹni tí a ṣe ìlérí náà fún ní Yorùbá.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Ó sọ ohun tí ìlérí náà jẹ́ ní kedere, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀, tó níyì, fún ζωή αἰώνιος.
- source_word: καὶ αὕτη ἐστίν
  choice: Èyí sì ni
  rationale: Ìṣètò yìí jẹ́ àdánidá ní Yorùbá, ó ń so ẹsẹ̀ náà mọ́ ọ̀rọ̀ tó ṣáájú, ó sì ń mú àkóónú ìlérí náà wọlé.
theological_decisions:
- issue: Ẹni tí αὐτός (“òun fúnra rẹ̀”) ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “òun fúnra rẹ̀,” láì dá a mọ́ Baba tàbí Ọmọ ní pàtó.
  alternative: “Baba fúnra rẹ̀” tàbí “Ọmọ fúnra rẹ̀”
  rationale: Ẹsẹ̀ Gíríìkì náà kò tún sọ ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí. Ìtumọ̀ yìí pa àìdánilójú tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, dípò kí ó yanjú rẹ̀ nípa ẹ̀kọ́ ìgbàgbọ́ kan.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ọ̀rọ̀ náà níyì, ó rọrùn fún òǹkàwé lásán láti lóye, kò sì fi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ ìpilẹ̀ṣẹ̀.
