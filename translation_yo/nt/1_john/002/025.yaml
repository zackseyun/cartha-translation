  source_fidelity: 'Ìtumọ̀ náà ń fi ìtumọ̀ Gíríìkì hàn dáadáa: αὕτη/ἐστίν jẹ́ “Èyí sì ni,” αὐτός ní ìtẹnumọ́ nínú “òun fúnra rẹ̀,” ἡμῖν jẹ́ “fún wa,” àti τὴν ζωὴν τὴν αἰώνιον jẹ́ “ìyè àìnípẹ̀kun.” Síbẹ̀, “ìlérí tí ... ṣe fún wa” lè túmọ̀ sí ìlérí kan tí a ṣe nítorí wa, dípò ohun tí a ṣèlérí fún wa. “ṣèlérí fún wa” sọ iṣẹ́-ìṣe ἐπηγγείλατο ní kedere, ó sì dá ìbátan rẹ̀ pọ̀ mọ́ ìlérí (ἐπαγγελία).'
  naturalness: “Èyí sì ni ìlérí tí òun fúnra rẹ̀ ṣèlérí fún wa” jẹ́ Yorùbá àpapọ̀ tó ṣe kedere, tó ní ìwọ̀n ìtẹnumọ́ tó yẹ, tí ó sì bá ọ̀nà ìkọ̀wé Bíbélì mu. Ìgbólóhùn “ìlérí tí ... ṣèlérí” ní ìtúnwí díẹ̀, ṣùgbọ́n ó jẹ́ ìtúnwí tí ó wúlò nítorí ó pa ìbátan orúkọ àti ọ̀rọ̀-ìṣe inú Gíríìkì mọ́.
  terminology: “Ìlérí,” “òun fúnra rẹ̀,” àti “ìyè àìnípẹ̀kun” jẹ́ àwọn ọ̀rọ̀ tó bójú mu, tó wọ́pọ̀, tí ó sì ní ìforúkọsílẹ̀ Bíbélì tó yẹ. A kò gbọdọ̀ sọ pé Baba tàbí Ọmọ ni “òun,” nítorí ẹsẹ̀ náà kò sọ ọ́ ní pàtó.
  issues:
