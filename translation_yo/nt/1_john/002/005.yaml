id: 1JN.2.5
reference: 1 John 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: yo
  text: 'Ṣùgbọ́n ẹni tí ó bá ń pa ọ̀rọ̀ rẹ̀ mọ́, lóòótọ́, nínú ẹni yìí[a] ni a ti mú ìfẹ́ Ọlọ́run[b] di pípé. Nípa èyí ni a fi mọ̀ pé a wà nínú rẹ̀:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀rọ̀ gangan, ó tún lè jẹ́ “nínú èyí” tàbí “nínú ẹni yìí.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ẹni tí ó pa ọ̀rọ̀ rẹ̀ mọ́, tàbí sí ọ̀ràn yìí gẹ́gẹ́ bí ẹ̀rí.
    reason: alternative_reading
  - marker: b
    text: “Ìfẹ́ Ọlọ́run” lè túmọ̀ sí ìfẹ́ tí Ọlọ́run ní sí ẹni yìí, tàbí ìfẹ́ ẹni yìí sí Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Ṣùgbọ́n ẹni tí ó bá
  rationale: “Ẹni tí ó bá” ṣàfihàn ipò gbogbogbò tí ἄν ń fún gbólóhùn náà, ìyẹn, ẹnikẹ́ni tí ó bá ṣe bẹ́ẹ̀; “Ṣùgbọ́n” sì pa ìyàtọ̀ kékeré tí δέ ń fi hàn mọ́.
- source_word: τηρῇ
  choice: pa … mọ́
  rationale: “Pa ọ̀rọ̀ mọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pípa ohun tí a ti sọ mọ́, ṣíṣe é, tàbí ṣègbọràn sí i; ó tún pa ìtumọ̀ gbígbòòrò τηρέω mọ́ láì dín un kù sí ìgbọràn òde nìkan.
- source_word: αὐτοῦ τὸν λόγον
  choice: ọ̀rọ̀ rẹ̀
  rationale: “Ọ̀rọ̀” bá λόγος ẹyọ kan mu, ó sì pa àṣà ọ̀rọ̀ Jòhánù àti àìdájú ẹni tí arọ́pò-orúkọ “rẹ̀” ń tọ́ka sí mọ́.
- source_word: ἀληθῶς
  choice: ní tòótọ́
  rationale: Ó fi ìtẹnumọ́ ἀληθῶς hàn ní Yorùbá àdánidá.
- source_word: ἐν τούτῳ
  choice: nínú ẹni yìí
  rationale: Ọ̀rọ̀ yìí jẹ́ kó ṣe kedere pé ó lè tọ́ka sí ẹni tí ó pa ọ̀rọ̀ náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ míì, “nínú èyí,” mọ́.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: Ìṣọ̀kan ọ̀rọ̀ yìí lè túmọ̀ sí ìfẹ́ tí Ọlọ́run ní tàbí ìfẹ́ tí ènìyàn ní sí Ọlọ́run. “Ìfẹ́ Ọlọ́run” pa àìdájú gidi náà mọ́.
- source_word: τετελείωται
  choice: a ti mú … pé
  rationale: 'Ìlò yìí fi perfect passive hàn: a ti mú ìfẹ́ náà dé ìpé, ó sì wà ní ipò pípé. Ó pa èrò ìmúṣẹ tàbí dídé ibi-afẹ́ mọ́ ju ọ̀rọ̀ tó lè túmọ̀ sí àìní àbùkù lásán lọ.'
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Nípa èyí ni àwa fi mọ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ni ẹ̀rí tàbí ìpìlẹ̀ ìmọ̀ náà.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: pé a wà nínú rẹ̀
  rationale: Ó pa gbólóhùn pàtàkì ti Jòhánù, “wà nínú rẹ̀,” mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú ἡ ἀγάπη τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  alternative: ìfẹ́ Ọlọ́run sí wa; tàbí ìfẹ́ wa sí Ọlọ́run
  rationale: Gíríìkì lè gba méjèèjì, àṣà ọ̀rọ̀ Jòhánù sì lè fara mọ́ ọ̀kọ̀ọ̀kan. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ ojú-ewé pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì pinnu rẹ̀ fún òǹkàwé.
- issue: Ohun tí ἐν τούτῳ àkọ́kọ́ ń tọ́ka sí
  choice: nínú ẹni yìí
  alternative: nínú èyí, ìyẹn, nínú ọ̀ràn yìí
  rationale: Ó ṣeé ṣe kí demonstrative náà tọ́ka sí ẹni tí ó pa ọ̀rọ̀ mọ́ tàbí sí ìṣẹ̀lẹ̀ náà gẹ́gẹ́ bí ẹ̀rí. A yan ìtumọ̀ ẹni fún àlàyé tó mọ́ ní Yorùbá, a sì fi èkejì sínú àlàyé ìsàlẹ̀ ojú-ewé.
- issue: Ìtumọ̀ “wà nínú rẹ̀”
  choice: a wà nínú rẹ̀
  alternative: a wà ní ìṣọ̀kan pẹ̀lú rẹ̀
  rationale: A pa àwòrán àti ìṣòro ọ̀rọ̀ Jòhánù mọ́, dípò kí a tú u sí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. “Pa ọ̀rọ̀ rẹ̀ mọ́” àti “a ti mú … pé” jẹ́ àdánidá ní Yorùbá, wọ́n sì pa àsopọ̀ ọ̀rọ̀ àti ìtumọ̀ Gíríìkì mọ́.
