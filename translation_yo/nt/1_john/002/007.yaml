id: 1JN.2.7
reference: 1 John 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́, kì í ṣe àṣẹ tuntun ni mo ń kọ sí yín, bí kò ṣe àṣẹ àtijọ́ tí ẹ ti ní láti ìbẹ̀rẹ̀. Àṣẹ àtijọ́ náà ni ọ̀rọ̀[a] tí ẹ gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ìhìn”: “Àṣẹ àtijọ́ náà ni ìhìn tí ẹ gbọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ó jẹ́ ọ̀nà àdúgbò ọ̀pọ̀ ènìyàn tí ó ní ìfẹ́ nínú, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú ἀγαπάω/ἀγάπη àti ohùn onífẹ̀ẹ́ ti Johanu.
- source_word: ἐντολήν
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a pàṣẹ, ó sì lè gbé ìwúwo ọ̀rọ̀ náà nínú àwọn ìwé Johanu láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
- source_word: καινήν
  choice: tuntun
  rationale: Ó pa ìyàtọ̀ tààrà láàárín καινός àti παλαιός mọ́.
- source_word: γράφω
  choice: mo ń kọ
  rationale: Àmì “ń” fi hàn pé iṣẹ́ kíkọ náà ń lọ lọ́wọ́, gẹ́gẹ́ bí ìṣe ọ̀rọ̀ ìsinsìnyí nínú lẹ́tà.
- source_word: παλαιάν / παλαιά
  choice: àtijọ́
  rationale: Ó dára jù lọ gẹ́gẹ́ bí òdìkejì “tuntun,” ó sì fi hàn pé àṣẹ náà ti wà pẹ́ láti ìbẹ̀rẹ̀.
- source_word: εἴχετε
  choice: ẹ ti ní
  rationale: Ó sọ ní ti ẹ̀dá Yorùbá pé wọ́n ti ní àṣẹ náà láti ìgbà àtijọ́ dé àkókò tí a ń sọ̀rọ̀.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Ó pa gbólóhùn Johanu mọ́ láì sọ pàtó ohun tí “ìbẹ̀rẹ̀” náà tọ́ka sí.
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” ni ìbámu pẹ̀lú λόγος, ó sì lè túmọ̀ sí ohun tàbí ìhìn tí a sọ tí àwọn olùgbọ́ gbọ́; àlàyé ìsàlẹ̀ fi “ìhìn” hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: ἠκούσατε
  choice: ẹ gbọ́
  rationale: Ó tú aorist náà ní ọ̀nà àdánidá gẹ́gẹ́ bí ìṣe tí àwọn olùkà ṣe nígbà tí wọ́n gba ohun tí a kéde fún wọn.
theological_decisions:
- issue: Ohun tí “láti ìbẹ̀rẹ̀” ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “láti ìbẹ̀rẹ̀,” láì sọ bóyá ó jẹ́ ìbẹ̀rẹ̀ ìgbésí ayé Kristẹni àwọn olùkà tàbí ìbẹ̀rẹ̀ ìkéde ìhìn rere.
  alternative: “láti ìbẹ̀rẹ̀ ìgbà tí ẹ di Kristẹni” tàbí “láti ìbẹ̀rẹ̀ ìkéde ìhìn rere”
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ohun tí wọ́n ti gbọ́, ṣùgbọ́n Gíríìkì kò ṣàlàyé rẹ̀ ní pàtó; nítorí náà, a pa àìdájú tó wà nínú ẹsẹ náà mọ́.
- issue: Ìdánimọ̀ àṣẹ àtijọ́ pẹ̀lú λόγος tí wọ́n gbọ́
  choice: “Àṣẹ àtijọ́ náà ni ọ̀rọ̀ tí ẹ gbọ́.”
  alternative: Ṣíṣe àlàyé rẹ̀ sí i gẹ́gẹ́ bí àṣẹ ìfẹ́ tàbí gbogbo ìhìn rere.
  rationale: Gíríìkì fi àṣẹ àtijọ́ àti λόγος tí wọ́n gbọ́ dọ́gba ní tààrà; a kò fi àlàyé láti ẹsẹ míì tàbí ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè tó lọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. “Ẹ̀yin” mú kí àdúgbò ọ̀pọ̀ ènìyàn hàn gbangba; “bí kò ṣe” sì jẹ́ ọ̀nà àdánidá láti sọ ìyàtọ̀ οὐκ ... ἀλλά.
