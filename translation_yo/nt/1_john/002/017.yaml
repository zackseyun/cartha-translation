language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: yo
  text: Ayé àti ìfẹ́kúfẹ̀ẹ́ rẹ̀[a] ń kọjá lọ; ṣùgbọ́n ẹni tí ń ṣe ìfẹ́ Ọlọ́run ń dúró títí láéláé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ìfẹ́kúfẹ̀ẹ́ sí “ìfẹ́-ọkàn líle” tàbí “ojúkòkòrò.” Níbí, ó túmọ̀ sí onírúurú ìfẹ́ ayé tí kò bá ìfẹ́ Ọlọ́run mu, kì í ṣe ìfẹ́ ìbálòpọ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ń dúró sí “ń wà” tàbí “ń gbé.” Ọ̀rọ̀ Gíríìkì μένει jẹ́ ọ̀rọ̀ pàtàkì nínú àwọn ìwé Jòhánù, ó sì ń tọ́ka sí dídúró tàbí wíwà tí ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún κόσμος, ó sì jẹ́ kí àyíká 1 Jòhánù 2:15–16 fi hàn pé ètò àti ìwà ayé tó lòdì sí Ọlọ́run ni a ń sọ, kì í ṣe ìṣẹ̀dá ti ara nìkan.
- source_word: παράγεται
  choice: ń kọjá lọ
  rationale: 'Àmì “ń” pa ìtumọ̀ ìṣe tó ń bá a lọ mọ́: ayé wà nínú ìlànà kọjá lọ, kì í ṣe gbólóhùn gbogbogbò lasán.'
- source_word: ἐπιθυμία
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: “Ìfẹ́kúfẹ̀ẹ́” sọ ìfẹ́ tó lágbára, tí kò sì tọ́ ní àyíká yìí; kò fi ìtumọ̀ rẹ̀ mọ́ ọ̀rọ̀ ìbálòpọ̀ nìkan.
- source_word: αὐτοῦ
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí ayé; “rẹ̀” ni ọ̀nà àdánidá láti fi ìní yìí hàn ní Yorùbá.
- source_word: ὁ δὲ ποιῶν
  choice: ṣùgbọ́n ẹni tí ń ṣe
  rationale: “Ẹni tí ń ṣe” pa àpẹẹrẹ ẹni kan tí ìṣe rẹ̀ ń tẹ̀ síwájú mọ́, láì sọ ọ́ di gbólóhùn àdéhùn.
- source_word: θέλημα
  choice: ìfẹ́ Ọlọ́run
  rationale: “Ìfẹ́ Ọlọ́run” jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀ fún ohun tí Ọlọ́run fẹ́ àti ète rẹ̀, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú θέλημα mọ́.
- source_word: μένει
  choice: ń dúró
  rationale: “Ń dúró” fi ìfaradà àti ìtẹ̀síwájú hàn ní èdè òde òní, ó sì lè gbé ìtumọ̀ pàtàkì μένω nínú àwọn ìwé Jòhánù.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láéláé
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédé láti sọ ìdúró tí kò ní òpin ní àyíká yìí.
theological_decisions:
- issue: Ìtumọ̀ κόσμος nínú àyíká Jòhánù
  choice: “Ayé” gẹ́gẹ́ bí ayé àti ètò ìwà rẹ̀ tó ń kọjá lọ, tó sì lòdì sí Ọlọ́run
  alternative: Ìṣẹ̀dá ayé ti ara nìkan
  rationale: Àwọn ẹsẹ 15–16 ṣàlàyé ayé nípasẹ̀ ìfẹ́kúfẹ̀ẹ́ àti ìgbéraga rẹ̀. A pa ọ̀rọ̀ gbòòrò “ayé” mọ́ nínú ẹsẹ náà, kí àyíká lè ṣàlàyé agbára ìwà àti ẹ̀kọ́ ìgbàgbọ́ rẹ̀.
- issue: Agbára μένει εἰς τὸν αἰῶνα
  choice: Ẹni tó ń ṣe ìfẹ́ Ọlọ́run ń dúró láìní òpin
  alternative: Gbólóhùn ìmọ̀-ẹ̀kọ́ ní pàtó nípa ìyè àìnípẹ̀kun
  rationale: Gíríìkì sọ ìdúró tó máa ń bá a lọ láì ṣàlàyé ọ̀nà ẹ̀kọ́ ìgbàgbọ́ tó mú un ṣẹ. “Ń dúró títí láéláé” pa agbára náà mọ́ láì fi ohun tí ẹsẹ kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. Ìṣọ̀kan “àti … pẹ̀lú” mú ìtumọ̀ καὶ … καὶ hàn lọ́nà àdánidá.
