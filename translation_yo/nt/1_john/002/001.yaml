  to: Ẹ̀yin ọmọ mi kéékèèké, mo ń kọ àwọn nǹkan wọ̀nyí sí yín kí ẹ má bàa dẹ́ṣẹ̀. Ṣùgbọ́n bí ẹnikẹ́ni bá dẹ́ṣẹ̀, a ní alágbàwí[a] lọ́dọ̀ Baba—Jésù Mèsáyà, Ẹni Olódodo.[b]
