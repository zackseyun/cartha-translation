  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé Gíríìkì dáadáa: ó pa ìfẹ́ inú Τεκνία μου, ète ἵνα, ipò àìdánilójú ἐάν τις ἁμάρτῃ, àti ipa aṣojú nínú παράκλητος mọ́. Ṣùgbọ́n ‘mo kọ’ sábà máa ń tọ́ka sí iṣẹ́ tí a ti parí ní Yorùbá, níbi tí γράφω jẹ́ ìsinsìnyí nínú lẹ́tà.'
  naturalness: ‘Mo ń kọ’ jẹ́ Yorùbá òde òní tí ó dára, ó sì fi hàn pé òǹkọ̀wé ń kọ lẹ́tà náà lọ́wọ́lọwọ. Àwọn ìyókù, títí kan ‘Ẹ̀yin ọmọ mi kéékèèké,’ ‘kí ẹ má bàa dẹ́ṣẹ̀,’ àti ‘alágbàwí,’ bá ìforúkọsílẹ̀ ìfẹ́ àti ti ọ̀wọ̀ mu.
  terminology: ‘Alágbàwí’ bá àyíká πρὸς τὸν πατέρα mu, a sì ti pa àwọn àṣàyàn ìtumọ̀ rẹ̀ mọ́ nínú àlàyé. ‘Jésù Mèsáyà, Ẹni Olódodo’ ń gbé Χριστός kalẹ̀ gẹ́gẹ́ bí oyè, ó sì jẹ́ kí δίκαιον hàn gẹ́gẹ́ bí àpèjúwe alágbára. Àlàyé fún ‘Jésù Kristi’ yẹ, àti àwọn àmì ìsàlẹ̀ wà ní ibi tí ó tọ́.
