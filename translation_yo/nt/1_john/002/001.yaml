id: 1JN.2.1
reference: 1 John 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: yo
  text: Ẹ̀yin ọmọ mi kéékèèké, mo ń kọ àwọn nǹkan wọ̀nyí sí yín kí ẹ má bàa dẹ́ṣẹ̀. Ṣùgbọ́n bí ẹnikẹ́ni bá dẹ́ṣẹ̀, a ní alágbàwí[a] lọ́dọ̀ Baba—Jésù Mèsáyà, Ẹni Olódodo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì παράκλητος tún lè ní ìtumọ̀ tó gbòòrò bí ‘olùrànlọ́wọ́,’ ‘olùdámọ̀ràn,’ tàbí ‘olùtùnú.’
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ àṣà fún ‘Jésù Mèsáyà’ ni ‘Jésù Kristi.’ Ọ̀rọ̀ Gíríìkì Χριστός lè túmọ̀ sí ‘Mèsáyà’ tàbí kí ó máa ṣiṣẹ́ bí apá orúkọ, ‘Kristi.’
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Ẹ̀yin ọmọ mi kéékèèké
  rationale: Ó pa àwòrán ìbátan ọmọ àti ìfẹ́ oníwà tútù inú ọ̀rọ̀ ìdínkù τεκνία mọ́; ‘kéékèèké’ níbí ń fi ìfẹ́ hàn, kì í ṣe dandan pé ọjọ́-orí wọn kéré.
- source_word: ταῦτα γράφω ὑμῖν
  choice: mo kọ àwọn nǹkan wọ̀nyí sí yín
  rationale: Ó tẹ̀ lé àsìkò ìsinsìnyí γράφω ní ọ̀nà tí ó bá lẹ́tà Yorùbá mu, ó sì pa ταῦτα mọ́ láì pinnu ohun tí ó ń tọ́ka sí ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: kí ẹ má bàa dẹ́ṣẹ̀
  rationale: Ọ̀rọ̀ yìí fi ète hàn, gẹ́gẹ́ bí ἵνα pẹ̀lú subjunctive; kò sọ pé àwọn olùgbọ́ ti dé ipò àìlẹ́ṣẹ̀ pátápátá.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Ṣùgbọ́n bí ẹnikẹ́ni bá dẹ́ṣẹ̀
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ inú ọ̀rọ̀ hàn lọ́nà àdánidá, ‘bí ... bá’ sì dúró fún ipò àìdánilójú ἐάν pẹ̀lú subjunctive.
- source_word: παράκλητον
  choice: alágbàwí
  rationale: Ní àyíká ẹ̀ṣẹ̀ àti wíwà lọ́dọ̀ Baba, ‘alágbàwí’ mú ipa aṣojú àti ẹni tí ń sọ̀rọ̀ fún ẹlòmíràn hàn dáadáa, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó gbòòrò.
- source_word: πρὸς τὸν πατέρα
  choice: lọ́dọ̀ Baba
  rationale: ‘Lọ́dọ̀ Baba’ sọ ìwàníhìn-ín àti ìbáṣepọ̀ pẹ̀lú Baba ní Yorùbá àdánidá, láì dín πρός kù sí ìtọ́sọ́nà ibi nìkan.
- source_word: Ἰησοῦν Χριστὸν
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ bí oyè ní àfikún sí orúkọ Jésù; ‘Mèsáyà’ pa ìtumọ̀ ẹni àmì òróró mọ́. Fọ́ọ̀mù àṣà ‘Jésù Kristi’ wà nínú àlàyé ìsàlẹ̀.
- source_word: δίκαιον
  choice: Ẹni Olódodo
  rationale: Ó jẹ́ àpèjúwe tí ó bá Jésù Mèsáyà mu; yíyí i sí ‘Ẹni Olódodo’ mú agbára àpèjúwe náà jáde ní Yorùbá tó bójú mu.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè Kristẹni
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ìṣètò ‘Jésù Mèsáyà, Ẹni Olódodo’ ṣe àfihàn oyè àti àpèjúwe; a kò sọ ìyàtọ̀ ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ, a sì pa fọ́ọ̀mù àṣà mọ́ nínú àlàyé.
- issue: Bóyá ἵνα μὴ ἁμάρτητε ń kọ́ àìlẹ́ṣẹ̀ pátápátá
  choice: 'A pa á mọ́ gẹ́gẹ́ bí ète: ‘kí ẹ má bàa dẹ́ṣẹ̀’'
  alternative: Ìtumọ̀ tí yóò fi hàn pé àwọn onígbàgbọ́ lè tàbí gbọ́dọ̀ dé àìlẹ́ṣẹ̀ pátápátá nísinsìnyí
  rationale: Gbólóhùn tó tẹ̀ lé e—‘bí ẹnikẹ́ni bá dẹ́ṣẹ̀’—pa ìforígbárí inú ẹsẹ náà mọ́; ìtumọ̀ kò yẹ kí ó yanjú rẹ̀ nípa fífi ẹ̀kọ́ kan kún un.
- issue: Ipa παράκλητος níwájú Baba
  choice: alágbàwí
  alternative: olùrànlọ́wọ́, olùdámọ̀ràn, tàbí olùtùnú
  rationale: Àyíká yìí ṣe atilẹyin ipa aṣojú tàbí ẹni tí ń bẹ̀bẹ̀ fún ẹlòmíràn, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ náà ní ààyè ìtumọ̀ tó gbòòrò.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti ìfẹ́ olùṣọ́-agùntàn, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ẹ̀yin’ àti ‘yín’ pa ọ̀pọ̀ ènìyàn tí ὑμῖν ń tọ́ka sí mọ́, ‘Baba’ sì dúró gẹ́gẹ́ bí oyè ìbáṣepọ̀.
