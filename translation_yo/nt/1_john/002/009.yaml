  terminology: “Ìmọ́lẹ̀,” “òkùnkùn,” “kórìíra,” àti “arákùnrin” yẹ, wọ́n sì pa àwòrán àti akọ ẹyọ Gíríìkì mọ́. A tún ṣe àtúnṣe gbolohun àlàyé ìsàlẹ̀ kí ohun-ìní “rẹ̀” hàn pẹ̀lú aṣàyàn méjèèjì, àti kí a ṣàlàyé akọ-ẹyọ ní kedere.
