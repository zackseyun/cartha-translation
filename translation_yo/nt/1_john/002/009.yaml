  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: yo
  text: Ẹni tí ó ń sọ pé ó wà nínú ìmọ́lẹ̀, tí ó sì kórìíra arákùnrin rẹ̀, ṣì wà nínú òkùnkùn títí di ìsinsìnyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin rẹ̀ tàbí arábìnrin rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lo “arákùnrin” ní ẹ̀dá akọ, ní ẹyọ kan, ṣùgbọ́n ó lè dúró fún ọkùnrin tàbí obìnrin nínú ọ̀rọ̀ ìwà rere yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ẹni tí ó ń sọ
  rationale: Àpilẹ̀kọ pẹ̀lú participle ìsinsìnyí ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí ẹni àpẹẹrẹ kan. Fífi “ń” sí i mú ìṣe tàbí ìwà tí ó ń bá a lọ hàn ní Yorùbá.
- source_word: ἐν τῷ φωτὶ
  choice: nínú ìmọ́lẹ̀
  rationale: Èyí pa àwòrán Johanu mọ́, níbi tí ìmọ́lẹ̀ ti jẹ́ ipò tàbí agbègbè ìwà àti ẹ̀mí.
- source_word: εἶναι
  choice: òun wà
  rationale: Ọ̀rọ̀-arọ́pò-orúkọ “òun” tọ́ka padà sí ẹni tí ó ń sọ̀rọ̀, ó sì jẹ́ kí gbólóhùn náà ṣe kedere ní Yorùbá.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: ἀδελφός jẹ́ akọ ní ẹyọ kan. “Arákùnrin rẹ̀” pa ìrísí ọ̀rọ̀ Gíríìkì mọ́, láì fi ìtumọ̀ “onígbàgbọ́ ẹlẹgbẹ́ rẹ̀” sínú ọ̀rọ̀ pàtàkì; àlàyé ìtumọ̀ aṣojú wà ní àlàyé ìsàlẹ̀.
- source_word: μισῶν
  choice: tí ó kórìíra
  rationale: Ìṣe ìsinsìnyí náà ń ṣàpèjúwe ìwà tí ó ń bá a lọ. “Kórìíra” jẹ́ ọ̀rọ̀ Yorùbá adayébá fún ìkórìíra.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nínú òkùnkùn
  rationale: Èyí bá “nínú ìmọ́lẹ̀” dọ́gba, ó sì pa ìyàtọ̀ àwòrán Johanu láàárín ìmọ́lẹ̀ àti òkùnkùn mọ́.
- source_word: ἕως ἄρτι
  choice: títí di ìsinsìnyí
  rationale: Gbólóhùn yìí ń fi hàn pé ipò náà ti ń bá a lọ dé àkókò òde òní. “Ó ṣì wà” tún mú ìtẹ̀síwájú yìí ṣe kedere lọ́nà adayébá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφός nínú gbólóhùn ìwà rere tí ó lo akọ ẹyọ kan gẹ́gẹ́ bí aṣojú
  choice: arákùnrin rẹ̀
  alternative: arákùnrin tàbí arábìnrin rẹ̀; onígbàgbọ́ ẹlẹgbẹ́ rẹ̀
  rationale: Ọ̀rọ̀ pàtàkì pa akọ ẹyọ kan tí Gíríìkì lò mọ́. Àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ọ̀rọ̀ náà lè ṣiṣẹ́ gẹ́gẹ́ bí aṣojú, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí ó dín ààlà rẹ̀ kù sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: A lo Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ṣùgbọ́n” mú ìtakora láàárín ohun tí ẹni náà sọ àti ìwà rẹ̀ hàn lọ́nà adayébá, bí ó tilẹ̀ jẹ́ pé καί ni Gíríìkì; a kò yanjú ààlà “arákùnrin” sí “onígbàgbọ́ ẹlẹgbẹ́” nínú ọ̀rọ̀ pàtàkì.
