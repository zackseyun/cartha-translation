  source_fidelity: Àkọlé náà gba ìtumọ̀ pàtàkì Gíríìkì—ẹni tí ó ń sọ, ìmọ́lẹ̀, ìkórìíra arákùnrin rẹ̀, òkùnkùn, àti ìtẹ̀síwájú dé ìsinsìnyí—mú dáadáa. Ṣùgbọ́n “ṣùgbọ́n” tú καί (“àti”) sí ìtakora tí a kò sọ ní tààrà nínú èdè orísun. Ìtakora náà hàn nínú àyíká, ṣùgbọ́n a lè pa ìṣọ̀kan àwọn participle méjèèjì mọ́ dáadáa pẹ̀lú “tí ó sì.”
