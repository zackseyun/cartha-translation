id: 1JN.2.13
reference: 1 John 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: yo
  text: Mo ń kọ̀wé sí yín, ẹ̀yin baba, nítorí ẹ ti mọ ẹni tí ó wà láti ìbẹ̀rẹ̀[a]; mo ń kọ̀wé sí yín, ẹ̀yin ọ̀dọ́mọkùnrin, nítorí ẹ ti ṣẹ́gun ẹni búburú náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni náà tí ó wà láti ìbẹ̀rẹ̀.” Ó ṣeé ṣe jù lọ pé gbólóhùn yìí ń tọ́ka sí Ọmọ Ọlọ́run, bí ó tilẹ̀ jẹ́ pé àwọn kan gbà pé ó ń tọ́ka sí Ọlọ́run ní ìtumọ̀ gbòòrò.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: Mo ń kọ̀wé
  rationale: Àkókò ìsinsìnyí nínú Gíríìkì bá ọ̀rọ̀ Yorùbá yìí mu lọ́nà àdánidá, ó sì fi hàn pé ìṣe kíkọ lẹ́tà náà ń lọ lọ́wọ́.
- source_word: πατέρες
  choice: ẹ̀yin baba
  rationale: Ó pa ìtumọ̀ gangan ti ọ̀rọ̀ Gíríìkì mọ́, láì túmọ̀ ọ́ sí ‘àwọn àgbàlagbà’ tàbí fi kún un pé ó dájú pé ìdàgbàsókè nípa ẹ̀mí ni ó ń tọ́ka sí.
- source_word: ἐγνώκατε
  choice: ẹ ti mọ
  rationale: Ìṣe pípé inú Gíríìkì tọ́ka sí mímọ̀ tí ó ti ṣẹlẹ̀, tí ipa rẹ̀ sì dúró; ‘ẹ ti mọ’ sọ èyí ní Yorùbá àdánidá.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ẹni tí ó wà láti ìbẹ̀rẹ̀
  rationale: Ó pa gbólóhùn ẹni-kí-ẹni ti Gíríìkì mọ́, kò sì sọ ẹni tí a ń tọ́ka sí ní pàtó ju bí ẹsẹ náà ṣe sọ lọ.
- source_word: νεανίσκοι
  choice: ẹ̀yin ọ̀dọ́mọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, nítorí náà ‘ọ̀dọ́mọkùnrin’ jẹ́ ìtumọ̀ tó péye tí ó sì ṣe kedere.
- source_word: νενικήκατε
  choice: ẹ ti ṣẹ́gun
  rationale: Ó fi ìṣẹ́gun tí a ti rí gbà, tí ipa rẹ̀ sì ń bá a lọ, hàn ní Yorùbá tó rọrùn.
- source_word: τὸν πονηρόν
  choice: ẹni ibi náà
  rationale: Àpilẹ̀kọ akọ ẹyọ kan pẹ̀lú àpèjúwe tí a lò gẹ́gẹ́ bí orúkọ tọ́ka sí ọ̀tá búburú kan, kì í ṣe ibi gẹ́gẹ́ bí èrò lásán; a kò fi orúkọ ‘Sátánì’ kún ohun tí Gíríìkì kò sọ ní tààrà.
theological_decisions:
- issue: Ẹni tí ‘ẹni tí ó wà láti ìbẹ̀rẹ̀’ ń tọ́ka sí
  choice: A pa gbólóhùn náà mọ́ láì dárúkọ ẹni náà ní pàtó nínú ẹsẹ.
  alternative: Ó ṣeé ṣe kí ó tọ́ka sí Ọmọ Ọlọ́run; àwọn mìíràn lè gbà pé ó ń tọ́ka sí Ọlọ́run ní ìtumọ̀ gbòòrò.
  rationale: Ìlò ọ̀rọ̀ irú èyí nínú àwọn ìwé Jòhánù mú kí Ọmọ náà ṣeé ṣe jù lọ, ṣùgbọ́n Gíríìkì kò dárúkọ rẹ̀ níbí; ìtumọ̀ náà pa àìdájú tó wà nínú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
- issue: Ìtumọ̀ ‘ẹni ibi náà’
  choice: Ọ̀tá búburú kan tó jẹ́ ẹni
  alternative: Ibi gẹ́gẹ́ bí ohun àìrí tàbí èrò lásán
  rationale: Ìrísí akọ ẹyọ kan pẹ̀lú àpilẹ̀kọ nínú Gíríìkì ṣe àtìlẹ́yìn fún ẹni kan, ẹni tí a sábà ń pè ní Sátánì, ṣùgbọ́n a kò fi orúkọ yẹn kún ẹsẹ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíka ní gbangba; ‘ẹ̀yin’ fi ìpè tààrà hàn dáadáa.
