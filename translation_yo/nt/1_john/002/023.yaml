id: 1JN.2.23
reference: 1 John 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó sẹ́ Ọmọ kò ní Baba pẹ̀lú[a]; ẹni tí ó jẹ́wọ́ Ọmọ ní Baba pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ kan kò ní: “ẹni tí ó jẹ́wọ́ Ọmọ ní Baba pẹ̀lú.”'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Olúkúlùkù ẹni tí ó bá sẹ́
  rationale: Ọ̀rọ̀ yìí fi gbogbo ẹni tó bá ń ṣe bẹ́ẹ̀ hàn ní ìtumọ̀ gbogbogbò; àṣàyàn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ìtumọ̀ gbogbo ènìyàn mọ́.
- source_word: ἀρνούμενος
  choice: sẹ́
  rationale: Nínú àyíká ìjẹ́wọ́ ìgbàgbọ́, ‘sẹ́’ túmọ̀ sí kí ènìyàn kọ̀ tàbí má gba ẹni tí a ń sọ̀rọ̀ rẹ̀; kò fi àlàyé míì tí kò sí nínú Gíríìkì kún un.
- source_word: τὸν υἱὸν
  choice: Ọmọ
  rationale: Gíríìkì sọ ‘Ọmọ’ nìkan gẹ́gẹ́ bí orúkọ oyè pàtó; a kò fi ‘Ọmọ Ọlọ́run’ kún un, bí ó tilẹ̀ jẹ́ pé àyíká fi ẹni tí a ń tọ́ka sí hàn.
- source_word: οὐδὲ
  choice: kò ní Baba pẹ̀lú
  rationale: '‘Pẹ̀lú’ mú ìbáṣepọ̀ ìkọ̀sẹ̀ méjèèjì jáde: ẹni tí ó sẹ́ Ọmọ kò ní Baba bákan náà.'
- source_word: τὸν πατέρα ἔχει
  choice: ní Baba
  rationale: A pa ọ̀rọ̀ Johanu náà mọ́ ní tààrà, dípò ṣíṣe àlàyé rẹ̀ sí ‘ní àjọṣepọ̀ pẹ̀lú Baba’ tàbí ‘jẹ́ ti Baba.’
- source_word: ὁ ὁμολογῶν
  choice: ẹni tí ó bá jẹ́wọ́
  rationale: ‘Jẹ́wọ́’ bójú mu ìtumọ̀ gbígba àti sísọ ní gbangba pé Ọmọ ni ẹni tí ó jẹ́; ọ̀nà gbólóhùn yìí sì jẹ́ Yorùbá àdánidá fún ẹni yòówù tó bá ṣe bẹ́ẹ̀.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Nínú ìtakora tó dọ́gba yìí, ‘pẹ̀lú’ fi hàn pé ẹni tí ó jẹ́wọ́ Ọmọ ní Baba bákan náà.
theological_decisions:
- issue: Ìpín kejì tí a fi àmì àkámọ́ sí nínú ẹ̀dà Gíríìkì
  choice: A fi ‘ẹni tí ó bá jẹ́wọ́ Ọmọ ní Baba pẹ̀lú’ sínú ọ̀rọ̀ pàtàkì.
  alternative: Kí a yọ ìpín kejì kúrò nítorí pé kò sí nínú àwọn àfọwọ́kọ kan.
  rationale: SBLGNT fi ìpín náà sínú ọ̀rọ̀, bó tilẹ̀ jẹ́ pé àmì rẹ̀ fi ìyàtọ̀ àwọn àfọwọ́kọ hàn. Nítorí náà, a túmọ̀ rẹ̀ sínú ọ̀rọ̀ pàtàkì, a sì ṣàkọsílẹ̀ ìyàtọ̀ náà ní àlàyé ìsàlẹ̀.
- issue: Agbára ìbáṣepọ̀ inú ọ̀rọ̀ ‘ní Baba’
  choice: A pa ọ̀rọ̀ tààrà ‘ní Baba’ mọ́ láìṣàlàyé rẹ̀ sí i.
  alternative: ‘ní àjọṣepọ̀ pẹ̀lú Baba’ tàbí ‘jẹ́ ti Baba.’
  rationale: Ọ̀rọ̀ náà so jíjẹ́wọ́ Ọmọ àti níní Baba pọ̀ gidigidi. Pípa àṣà ọ̀rọ̀ Johanu mọ́ kò jẹ́ kí ìtumọ̀ túmọ̀wé tóóró kan ṣoṣo gba àyè ohun tí orísun sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Ìforúkọ oyè ‘Ọmọ’ àti ‘Baba’ bẹ̀rẹ̀ pẹ̀lú lẹ́tà ńlá láti pa ìtọ́kasí pàtó inú àyíká mọ́. Èdè náà jẹ́ ọlọ́lá, kedere, ó sì yẹ fún òǹkàwé Yorùbá òde òní.
