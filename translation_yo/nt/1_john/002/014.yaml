id: 1JN.2.14
reference: 1 John 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: yo
  text: Mo ti kọ̀wé sí yín[a], ẹ̀yin ọmọ, nítorí ẹ ti mọ̀ Baba. Mo ti kọ̀wé sí yín, ẹ̀yin baba, nítorí ẹ ti mọ̀ ẹni tí ó wà láti ìbẹ̀rẹ̀[b]. Mo ti kọ̀wé sí yín, ẹ̀yin ọ̀dọ́kùnrin, nítorí ẹ lágbára, ọ̀rọ̀ Ọlọ́run sì ń dúró nínú yín[c], ẹ sì ti ṣẹ́gun ẹni búburú náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo kọ̀wé sí yín,” ní gbogbo ẹsẹ náà. Aorist Gíríìkì lè jẹ́ àkókò tí ó kọjá lásán, ṣùgbọ́n “Mo ti kọ̀wé” bá àyíká lẹ́tà àti ìwúlò ọ̀rọ̀ náà ní ìsinsìnyí mu dáadáa.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “ẹni tí ó wà láti ìbẹ̀rẹ̀” tọ́ka sí Ọmọ tí ó ti wà ṣáájú ohun gbogbo, gẹ́gẹ́ bí ìlò Johanu, bí ó tilẹ̀ jẹ́ pé ẹsẹ náà kò dárúkọ ẹni tí ó ń tọ́ka sí.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ọ̀rọ̀ Ọlọ́run sì ń gbé nínú yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Mo ti kọ̀wé sí yín
  rationale: Àkókò aorist Gíríìkì lè túmọ̀ sí ohun tí ó ṣẹlẹ̀ nígbà kan, ṣùgbọ́n ọ̀rọ̀ ‘ti kọ̀wé’ bá ipò lẹ́tà yìí mu, ó sì fi hàn pé ohun tí a kọ ní ìtumọ̀ títí di ìsinsìnyí.
- source_word: παιδία
  choice: ẹ̀yin ọmọ
  rationale: Ó pa àpèjúwe ìdílé mọ́ láìfi ọ̀rọ̀ ìfẹ́ tàbí kékeré kún ohun tí orísun sọ.
- source_word: ἐγνώκατε
  choice: ẹ ti mọ
  rationale: Ìṣe pípé náà ń tọ́ka sí ìmọ̀ tí wọ́n ti ní, tí ó sì dúró títí di ìsinsìnyí; èdè Yorùbá fi ‘ti mọ’ sọ èyí lọ́nà àdánidá.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Nínú ìlò Johanu, èyí jẹ́ orúkọ oyè fún Ọlọ́run; ‘Baba’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere tó sì ní iyì.
- source_word: πατέρες
  choice: ẹ̀yin baba
  rationale: Ó pa ọ̀rọ̀ orísun àti ìṣọ̀kan àkójọpọ̀ àwọn ọmọ, àwọn baba, àti àwọn ọ̀dọ́kùnrin mọ́, láìdín un kù sí ọjọ́-orí nìkan.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ẹni tí ó wà láti ìbẹ̀rẹ̀
  rationale: Ó pa ẹni tí gbólóhùn náà ń tọ́ka sí mọ́ láìdárúkọ rẹ̀, ó sì yàgò fún fífi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ tí Gíríìkì kò sọ ní tààràtà.
- source_word: νεανίσκοι
  choice: ẹ̀yin ọ̀dọ́kùnrin
  rationale: Èyí ni ìtumọ̀ tààrà fún ọ̀pọ̀ akọ, ó sì pa ìyàtọ̀ rẹ̀ sí ‘àwọn baba’ àti ‘àwọn ọmọ’ mọ́.
- source_word: ἰσχυροί
  choice: ẹ lágbára
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún agbára ní ipò ẹ̀mí àti ìwà rere yìí.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa gbólóhùn Bíbélì tó mọ́gbọ́n dání mọ́, láìfi dandan pinnu bóyá gbogbo ìhìn Ọlọ́run ni tàbí ìhìn rere ní pàtó.
- source_word: μένει
  choice: ń gbé inú yín
  rationale: Nínú àyíká Johanu, ‘ń gbé’ fi ìdúró tí ń bá a lọ hàn lọ́nà Yorùbá tó ṣe àdánidá; ‘ń dúró’ tún ṣeé lò.
- source_word: νενικήκατε
  choice: ẹ sì ti ṣẹ́gun
  rationale: ‘Ti ṣẹ́gun’ fi iṣẹ́gun tí ó ti ṣẹlẹ̀, tí ipa rẹ̀ sì ń bá a lọ, hàn.
- source_word: τὸν πονηρόν
  choice: ẹni ibi náà
  rationale: Àpilẹ̀kọ àti ìrísí akọ Gíríìkì tọ́ka sí ẹni kan, kì í ṣe ibi bí ohun àìlẹ́ni; ọ̀rọ̀ yìí kò sì fi orúkọ Èṣù kún ẹsẹ náà.
theological_decisions:
- issue: Ẹni tí ‘ó wà láti ìbẹ̀rẹ̀’ ń tọ́ka sí
  choice: 'A fi ẹni náà sílẹ̀ láìdárúkọ rẹ̀: ‘ẹni tí ó wà láti ìbẹ̀rẹ̀.’'
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí Kristi/Ọmọ, tàbí gẹ́gẹ́ bí Ọlọ́run lápapọ̀.
  rationale: Ìlò Johanu lè tọ́ka sí Ọmọ tí ó ti wà ṣáájú ohun gbogbo, ṣùgbọ́n ẹsẹ Gíríìkì fúnra rẹ̀ kò dárúkọ ẹni náà. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
- issue: Ìbálòpọ̀ àti àwọn tí a ń bá sọ̀rọ̀ nínú ẹgbẹ́ mẹ́ta
  choice: A túmọ̀ παιδία sí ‘àwọn ọmọ,’ ṣùgbọ́n πατέρες àti νεανίσκοι sí ‘àwọn baba’ àti ‘àwọn ọ̀dọ́kùnrin.’
  alternative: Kí a sọ gbogbo wọn di ọ̀rọ̀ àpapọ̀ tí kò fi akọ tàbí abo hàn fún gbogbo ìjọ.
  rationale: Gíríìkì lo ọ̀rọ̀ ọmọ tó lè gbòòrò, lẹ́yìn náà ó lo àwọn ọ̀rọ̀ akọ fún àwọn ẹgbẹ́ méjì yòókù. Ìtumọ̀ náà pa ìrísí yìí mọ́ láìpinnu bóyá àwọn ẹgbẹ́ náà jẹ́ àpẹẹrẹ ìdàgbàsókè ẹ̀mí.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa àtúnṣe ọ̀rọ̀ mẹ́ta àti ìtẹnumọ́ àwọn ìṣe pípé mọ́ ní ọ̀nà Yorùbá àdánidá.
