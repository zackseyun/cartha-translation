  to: Mo ti kọ̀wé sí yín[a], ẹ̀yin ọmọ, nítorí ẹ ti mọ̀ Baba. Mo ti kọ̀wé sí yín, ẹ̀yin baba, nítorí ẹ ti mọ̀ ẹni tí ó wà láti ìbẹ̀rẹ̀[b]. Mo ti kọ̀wé sí yín, ẹ̀yin ọ̀dọ́kùnrin, nítorí ẹ lágbára, ọ̀rọ̀ Ọlọ́run sì ń dúró nínú yín[c], ẹ sì ti ṣẹ́gun ẹni búburú náà.
