id: 1JN.2.22
reference: 1 John 2:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: yo
  text: Ta ni òpùrọ́ náà bí kò ṣe ẹni tí ó sẹ́ pé Jésù ni Mèsáyà[a]? Ẹni yìí ni aṣòdì sí Mèsáyà náà[b]—ẹni tí ó sẹ́ Baba àti Ọmọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni ὁ χριστός; “Mèsáyà” ni a lò níhìn-ín nítorí pé ó jẹ́ oyè, kì í ṣe orúkọ.
    reason: alternative_reading
  - marker: b
    text: 'A tún lè pe e ní “antikristi.” Ọ̀rọ̀ Gíríìkì náà ní atíkà pàtó: “antikristi náà.” Nínú àwọn lẹ́tà Jòhánù, ó lè tọ́ka sí irú alátakò tí ó ń sẹ́ Baba àti Ọmọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: òpùrọ́ náà
  rationale: Ọ̀rọ̀ náà ní atíkà ὁ, nítorí náà “òpùrọ́ náà” fi ìdánimọ̀ pàtó àti agbára ọ̀rọ̀ ìtakò inú ẹsẹ̀ náà hàn.
- source_word: ὁ ἀρνούμενος
  choice: ẹni tí ó sẹ́
  rationale: Àpólà aláìparí náà ń ṣàpèjúwe ẹni tí ìsẹ́ yìí jẹ́ ìwà àmì rẹ̀; ọ̀nà yìí sì jẹ́ Yorùbá àdánidá.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: pé Jésù ni Mèsáyà
  rationale: 'Nínú àkópọ̀ ọ̀rọ̀ Gíríìkì yìí, οὐκ wà lára ohun tí ẹni náà ń sẹ́: ó ń sọ pé Jésù kì í ṣe Mèsáyà. Yorùbá “sẹ́ pé Jésù ni Mèsáyà” fi kókó ìsẹ́ náà hàn láì dá ìtumọ̀ rú pẹ̀lú ìkọ̀ méjì.'
- source_word: ὁ χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín ó jẹ́ oyè ẹni tí Ọlọ́run yàn, kì í ṣe apá kan orúkọ; “Mèsáyà” pa iṣẹ́ oyè náà mọ́.
- source_word: ὁ ἀντίχριστος
  choice: aṣòdì sí Kristi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ẹni tí ó tako Kristi. Àwọn ọ̀rọ̀ “Ẹni yìí ni” ń gbé ìdánimọ̀ tí atíkà Gíríìkì náà fi hàn.
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: Baba àti Ọmọ
  rationale: Àwọn orúkọ oyè wọ̀nyí tọ́ka sí Ọlọ́run Baba àti Ọmọ rẹ̀ nínú ìbáṣepọ̀ pàtó, nítorí náà a kọ wọ́n pẹ̀lú lẹ́tà ńlá.
- source_word: οὗτός ἐστιν
  choice: Ẹni yìí ni
  rationale: Ó tọ́ka padà sí ẹni tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe, ó sì mú ìdánimọ̀ náà ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ọ̀rọ̀ ìjẹ́wọ́ tàbí ìsẹ́
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè níhìn-ín. “Mèsáyà” pa ẹ̀sùn pàtàkì náà mọ́—ìyẹn, pé Jésù ni ẹni àmì-òróró tí a ṣèlérí—láì sọ oyè náà di orúkọ lásán.
- issue: Ohun tí ἀντίχριστος ń tọ́ka sí
  choice: aṣòdì sí Kristi
  alternative: Aṣòdì-sí-Kristi náà
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ẹni tàbí irú ẹni tí ìsẹ́ Baba àti Ọmọ jẹ́ àmì rẹ̀. Ìtumọ̀ yìí kò fi tipátipá sọ ọ́ di ẹni kan ṣoṣo ti ọjọ́ ìkẹyìn, bẹ́ẹ̀ ni kò yọ agbára ìdánimọ̀ inú Gíríìkì kúrò.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àmì gígùn náà so àlàyé “ẹni tí ó sẹ́ Baba àti Ọmọ” mọ́ “aṣòdì sí Kristi” láì mú kí ìtumọ̀ rẹ̀ dín kù.
