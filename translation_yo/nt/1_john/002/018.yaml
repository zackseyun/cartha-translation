id: 1JN.2.18
reference: 1 John 2:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: yo
  text: Ẹ̀yin ọmọ, àkókò ìkẹyìn ni. Gẹ́gẹ́ bí ẹ ti gbọ́ pé alátakò Kristi[a] ń bọ̀, àní nísinsìnyí ọ̀pọ̀ alátakò Kristi ti dìde[b]. Láti inú èyí ni àwa fi mọ̀ pé àkókò ìkẹyìn ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè gbà á gẹ́gẹ́ bí “alátakò Kristi náà ń bọ̀.” Ọ̀rọ̀ Gíríìkì náà kò ní àròkọ, ṣùgbọ́n nínú ìlò èdè ó lè tọ́ka sí ẹni tí àwọn olùgbọ́ ti mọ̀ pé a ń retí.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ti farahàn” tàbí “ti dé.” Ọ̀rọ̀ ìṣe Gíríìkì náà fi hàn pé wọ́n ti dìde, wọ́n sì wà níbẹ̀ nísinsìnyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Ẹ̀yin ọmọ mi
  rationale: Ọ̀rọ̀ ìpè olùṣọ́-agùntàn sí àwọn olùgbọ́ rẹ̀ ni; “ẹ̀yin ọmọ mi” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìfẹ́ àti ìbátan mọ́ láìsọ pé ọmọ kékeré ni wọ́n.
- source_word: ἐσχάτη ὥρα
  choice: àkókò ìkẹyìn
  rationale: “Àkókò” mú àpẹẹrẹ ti ὥρα hàn ní Yorùbá àdánidá, láìfi dandan túmọ̀ rẹ̀ sí wákàtí ọgọ́ta ìṣẹ́jú tàbí pinnu ètò ìgbà ìkẹyìn kan.
- source_word: καθὼς ἠκούσατε
  choice: Gẹ́gẹ́ bí ẹ ti gbọ́
  rationale: Ó pa ìfiwéra καθὼς àti ìtọ́ka sí ẹ̀kọ́ tí àwọn olùgbọ́ ti gbà tẹ́lẹ̀ mọ́.
- source_word: ἀντίχριστος
  choice: aṣòdì sí Kristi
  rationale: Ìtumọ̀ yìí jẹ́ kó ṣe kedere fún òǹkà Yorùbá pé ẹni tàbí agbára tí ó tako Kristi ni a ń sọ, ó sì lè gba ìtumọ̀ “antichrist” gẹ́gẹ́ bí àkọlé tàbí ẹ̀ka kan láìfi àròkọ tí Gíríìkì kò ní kún un.
- source_word: ἔρχεται
  choice: ń bọ̀
  rationale: Ó mú ìṣe tó ń lọ lọ́wọ́ ṣùgbọ́n tó dojú kọ́ ìbọ̀wọ̀ ọjọ́ iwájú hàn ní Yorùbá àdánidá.
- source_word: καὶ νῦν
  choice: àní nísinsìnyí
  rationale: “Àní” mú ìtẹnumọ́ àti ìyàtọ̀ láàárín ẹni tí a retí àti ọ̀pọ̀ tí wọ́n ti wà ní báyìí hàn.
- source_word: ἀντίχριστοι πολλοὶ
  choice: ọ̀pọ̀ aṣòdì sí Kristi
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἀντίχριστος tó ṣáájú, ó sì fi ọ̀pọ̀ hàn ní kedere.
- source_word: γεγόνασιν
  choice: ti dìde
  rationale: Ìṣe pípé náà fi hàn pé wọ́n ti yọ síta, wọ́n sì wà níbẹ̀ báyìí; “ti dìde” jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún ìfarahàn irú àwọn ẹni bẹ́ẹ̀.
- source_word: ὅθεν γινώσκομεν
  choice: Láti inú èyí ni àwa fi mọ̀
  rationale: Ó pa ìtọ́ka ὅθεν sí ẹ̀rí tó ṣáájú mọ́, ó sì fi ìmọ̀ tí a rí láti inú ẹ̀rí náà hàn.
theological_decisions:
- issue: Ìtumọ̀ “ἐσχάτη ὥρα”
  choice: A túmọ̀ rẹ̀ sí “àkókò ìkẹyìn,” èyí tó pa èdè àkókò àti ìtumọ̀ ọjọ́ ìkẹyìn mọ́ láìsọ pé wákàtí gangan ni.
  alternative: “wákàtí ìkẹyìn” tàbí ọ̀rọ̀ tó sọ pé ìṣẹ̀lẹ̀ náà máa ṣẹlẹ̀ lójú-ẹsẹ̀ gan-an
  rationale: Àyíká ẹsẹ náà ní ìtumọ̀ ọjọ́ ìkẹyìn, ṣùgbọ́n ọ̀rọ̀ náà kò ṣàlàyé ètò ìgbà ìkẹyìn kan pàtó; a pa àìdánilójú tó wà nínú rẹ̀ mọ́.
- issue: Ẹni kan ἀντίχριστος àti ọ̀pọ̀ ἀντίχριστοι
  choice: A pa ìyàtọ̀ láàárín “aṣòdì sí Kristi” tí ń bọ̀ àti “ọ̀pọ̀ aṣòdì sí Kristi” tí wọ́n ti dìde mọ́.
  alternative: Kí a sọ pé ẹni kan pàtó ni àkọ́kọ́, tàbí kí a sọ gbogbo rẹ̀ di ẹ̀ka àpapọ̀ nìkan
  rationale: Jòhánù fi ẹni/ẹ̀ka kan tí a retí sí ẹ̀gbẹ́ ọ̀pọ̀ ẹni tó ti farahàn; ìtumọ̀ kò gbọ́dọ̀ fi ètò ẹ̀kọ́ kan yanju ìfaramọ́ yìí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ti ìfẹ́ olùṣọ́-agùntàn, ó sì yẹ fún kíkà ní gbangba. “Ẹ̀yin ọmọ mi” jẹ́ ọ̀rọ̀ ìpè àdánidá, “àkókò ìkẹyìn” sì yẹra fún ìtumọ̀ wákàtí gangan.
