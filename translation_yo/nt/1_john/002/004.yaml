id: 1JN.2.4
reference: 1 John 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: yo
  text: Ẹni tí ó sọ pé, “Mo ti wá mọ̀ ọ́n,”[a] ṣùgbọ́n tí kò pa àwọn àṣẹ rẹ̀ mọ́, jẹ́ òpùrọ́, òtítọ́ kò sì sí nínú ẹni náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Mo mọ̀ ọ́n.” A lè tú perfect nínú Gíríìkì sí ọ̀nà tó rọrùn bẹ́ẹ̀, ṣùgbọ́n “Mo ti wá mọ̀ ọ́n” túbọ̀ fi hàn pé ipò mímọ̀ ọ́n tó wà nísinsìnyí wá láti inú bí ẹni náà ṣe mọ̀ ọ́ tẹ́lẹ̀.'
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: “òtítọ́ kò sì sí nínú ẹni yìí”; tàbí: “nínú irú ẹni bẹ́ẹ̀.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ẹni tí ó bá sọ pé
  rationale: Ọ̀rọ̀ yìí jẹ́ àpèjúwe ẹni kọ̀ọ̀kan ní gbogbogbòò; ìtumọ̀ yìí bójú mu ní Yorùbá, kò sì fi akọ tàbí abo kún ohun tí Gíríìkì kò tẹnumọ́.
- source_word: Ἔγνωκα
  choice: Mo ti wá mọ̀ ọ́n
  rationale: Àkókò perfect nínú Gíríìkì ń tọ́ka sí mímọ̀ tí ó bẹ̀rẹ̀ tẹ́lẹ̀ tí àbájáde rẹ̀ sì ń bá a lọ; “ti wá mọ̀” pa ìrísí yìí mọ́ ju “mọ̀” lásán lọ.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: àwọn àṣẹ rẹ̀
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì gbé ìtumọ̀ ἐντολή gẹ́gẹ́ bí ohun tí Ọlọ́run pàṣẹ kalẹ̀.
- source_word: μὴ τηρῶν
  choice: tí kò sì pa ... mọ́
  rationale: “Pa ... mọ́” ṣàfihàn títẹ̀síwájú nínú pípa àṣẹ mọ́, ó sì pa ìtumọ̀ τηρέω gẹ́gẹ́ bí ṣíṣọ́ tàbí ṣíṣe ohun tí a pàṣẹ mọ́.
- source_word: ψεύστης
  choice: òpùrọ́
  rationale: Orúkọ àpèjúwe ẹni ni Gíríìkì lò, kì í ṣe pé ẹni náà ń parọ́ ní àsìkò kan ṣoṣo; “òpùrọ́” mú agbára ìdájọ́ ọ̀rọ̀ náà jáde.
- source_word: ἐν τούτῳ
  choice: nínú ẹni náà
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka padà sí ẹni tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe; “ẹni náà” ṣe kedere ní Yorùbá láì fi akọ tàbí abo kún un.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: òtítọ́ kò sì sí
  rationale: Ìtumọ̀ tààrà yìí pa ìjìnlẹ̀ ìtumọ̀ Johannine ti “òtítọ́” mọ́, láì dín in kù sí òtítọ́ inú ẹni tàbí ìwà olóòótọ́ nìkan.
theological_decisions:
- issue: Ẹni tí αὐτόν / αὐτοῦ ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “ọ́n / rẹ̀,” èyí tí ó ń tọ́ka sí Ọlọ́run nínú àyíká ọ̀rọ̀.
  alternative: Kí a sọ ní pàtó pé ó ń tọ́ka sí Kristi.
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ mú Ọlọ́run wá síwájú jù, ṣùgbọ́n ẹ̀kọ́ Johanu so Ọlọ́run àti Ọmọ rẹ̀ pọ̀ gidigidi. Lílo ọ̀rọ̀ arọ́pò pa ìfararora àti àìdánilójú tó yẹ mọ́.
- issue: Agbára ọ̀rọ̀ “mọ̀” nínú Johanu
  choice: “Mo ti wá mọ̀ ọ́n,” tí ó ṣàfihàn ìbáṣepọ̀ tí ó ń bá a lọ.
  alternative: “Mo mọ̀ ọ́n,” èyí tí ó lè jẹ́ ìmọ̀ lásán.
  rationale: Perfect γινώσκω tọ́ka sí ipò mímọ̀ lọ́wọ́lọ́wọ́ tí ó jẹ́ àbájáde bí ẹni ṣe wá mọ̀ ọ́ tẹ́lẹ̀; ìtumọ̀ náà kò sọ ọ́ di ìmọ̀ orí lásán, bẹ́ẹ̀ ni kò sọ ju ohun tí ẹsẹ náà wí lọ.
translation_notes:
  register: Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí gbogbo ọ̀rọ̀ níbi tí ó ti yẹ. “Ẹni tí ó bá” jẹ́ àfihàn gbogbogbòò tó bá èdè Yorùbá mu, “pa àwọn àṣẹ ... mọ́” sì pa àwọ̀ ìtumọ̀ Johannine mọ́.
