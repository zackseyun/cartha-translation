id: 1JN.2.24
reference: 1 John 2:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: yo
  text: Ní ti ẹ̀yin[a], ẹ jẹ́ kí ohun tí ẹ gbọ́ láti ìbẹ̀rẹ̀ máa wà nínú yín. Bí ohun tí ẹ gbọ́ láti ìbẹ̀rẹ̀ bá ń wà nínú yín[b], ẹ̀yin pẹ̀lú yóò máa wà nínú Ọmọ àti nínú Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn náà tẹ ‘ẹ̀yin’ mọ́lẹ̀, ní ìyàtọ̀ sí àwọn olùkọ́ èké tí a mẹ́nu kàn ṣáájú.
    reason: discourse_emphasis
  - marker: b
    text: ‘Máa wà’ túmọ̀ ọ̀rọ̀-ìṣe Gíríìkì kan náà tí a lò ní gbogbo ẹsẹ̀ yìí; a tún lè túmọ̀ rẹ̀ sí ‘máa dúró.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ní ti ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà wà níwájú fún ìtẹnumọ́ àti láti fi àwọn olùgbọ́wé yà sọ́tọ̀ sí àwọn olùkọ́ èké tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. ‘Ní ti ẹ̀yin’ mú ìtẹnumọ́ yìí jáde ní Yorùbá àdánidá.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: ohun tí ẹ gbọ́ láti ìbẹ̀rẹ̀
  rationale: ‘Ohun tí’ pa ìtumọ̀ arọ́pò-orúkọ aláìdásí ọkùnrin tàbí obìnrin ὃ mọ́ láì fi ‘ìhìn rere’ tàbí ‘ẹ̀kọ́ àwọn aposteli’ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn Johanu yìí, ó sì pa ìró ìtumọ̀ rẹ̀ mọ́.
- source_word: μένω (μενέτω, μείνῃ, μενεῖτε)
  choice: máa wà / bá ń wà / yóò máa wà
  rationale: 'Àwọn ọ̀nà wọ̀nyí jẹ́ àdánidá ní Yorùbá, wọ́n sì pa àsopọ̀ ọ̀rọ̀-ìṣe kan náà mọ́ ní gbogbo ẹsẹ̀ náà: àṣẹ fún ìtẹ̀síwájú, ipò nínú gbólóhùn àídájú, àti ọjọ́ iwájú.'
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin pẹ̀lú
  rationale: ‘Pẹ̀lú’ túmọ̀ καί gẹ́gẹ́ bí ‘pẹ̀lú/àti ẹ̀yin náà,’ nígbà tí ‘ẹ̀yin’ pa ìtẹnumọ́ arọ́pò-orúkọ tó hàn gbangba mọ́.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: nínú Ọmọ àti nínú Baba
  rationale: Àtúnlò ‘nínú’ pa ìfararora àwọn gbólóhùn méjèèjì mọ́; ‘Ọmọ’ àti ‘Baba’ jẹ́ orúkọ oyè tó bá ìlò Johanu mu.
theological_decisions:
- issue: Irú ìlérí onípò tí ó wà ní apá ìkẹyìn
  choice: ẹ̀yin pẹ̀lú yóò máa wà nínú Ọmọ àti nínú Baba
  alternative: Kí a sọ ọ́ di àṣẹ tàbí kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ ẹ̀sìn kan pàtó nípa ìfaradà àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú Gíríìkì ni a túmọ̀ ní tààrà, ní ìbámu pẹ̀lú gbólóhùn àídájú, láìyanjú àríyànjiyàn ẹ̀kọ́ ẹ̀sìn tí ẹsẹ̀ náà kò sọ ní kedere.
- issue: Ohun tí ‘ohun tí ẹ gbọ́ láti ìbẹ̀rẹ̀’ ń tọ́ka sí
  choice: A fi gbólóhùn náà sílẹ̀ ní gbogbogbò gẹ́gẹ́ bí orísun Gíríìkì
  alternative: ìhìn rere tàbí ẹ̀kọ́ àwọn aposteli tí ẹ gbọ́ láti ìbẹ̀rẹ̀
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kó jẹ́ ìkéde ìpilẹ̀ṣẹ̀ nípa Ọmọ, ṣùgbọ́n arọ́pò-orúkọ Gíríìkì kò sọ ohun náà ní pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Ọ̀rọ̀ náà jẹ́ ti ìgbàlódé, ó bójú mu, ó sì ní iyì; a yẹra fún ọ̀rọ̀ ẹ̀sìn àtijọ́ tí kò rọrùn fún òǹkàwé lónìí.
