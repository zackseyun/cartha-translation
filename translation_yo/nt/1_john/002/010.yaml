source:
  edition: SBLGNT
  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: yo
  text: Ẹni tí ó fẹ́ràn arákùnrin rẹ̀ ń dúró nínú ìmọ́lẹ̀, kò sì sí ohun ìkọ̀sẹ̀ kankan nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò sì sí ohun ìkọ̀sẹ̀ kankan fún un.” Gbólóhùn Gíríìkì náà lè ṣàpèjúwe ohun tí kò sí nínú rẹ̀ tàbí ohun tí kò dojú kọ ọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Ẹni tí ó bá ń fẹ́
  rationale: Ọ̀rọ̀-orúkọ tí a fi participle onítẹ̀síwájú ṣe ń tọ́ka sí ẹnikẹ́ni tí ìfẹ́ rẹ̀ jẹ́ ìṣe tí ń bá a lọ. Àkópọ̀ “Ẹni tí ó bá ń fẹ́” jẹ́ Yorùbá àdánidá, ó sì pa agbára gbogbogbò àti onítẹ̀síwájú náà mọ́.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Èyí tẹ̀ lé akọ ẹyọ ọ̀rọ̀ Gíríìkì ἀδελφός láì fi ìtumọ̀ àlàyé bí “ẹlẹgbẹ́ onígbàgbọ́” kún un.
- source_word: ἐν τῷ φωτὶ
  choice: nínú ìmọ́lẹ̀
  rationale: Ó pa àwòrán ìmọ́lẹ̀ ti Johanu mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe déédé.
- source_word: μένει
  choice: dúró
  rationale: Nínú àyíká yìí, “dúró” túmọ̀ sí pé ẹni náà ń bá a lọ láti wà nínú ìmọ́lẹ̀; ó jẹ́ èdè òde òní tí kò ní ìró àtijọ́.
- source_word: σκάνδαλον
  choice: ohun ìkọ̀sẹ̀
  rationale: Àṣàyàn yìí pa àpẹẹrẹ ohun tí ń múni kọsẹ̀ mọ́, ó sì lè gba ìtumọ̀ ohun tó wà nínú ẹni náà tàbí ohun tó lè dojú kọ ọ́.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ fún preposition àti arọ́pò-orúkọ akọ ẹyọ náà, tí ó ṣeé ṣe kí ó tọ́ka sí ẹni tí ń fẹ́ arákùnrin rẹ̀.
- source_word: οὐκ ἔστιν
  choice: kò sì sí ... kankan
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan kò sí rárá.
theological_decisions:
- issue: Ìtọ́kasí àti ìtumọ̀ gbólóhùn ìkẹyìn καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: Kò sí ohun ìkọ̀sẹ̀ kankan nínú ẹni tí ó fẹ́ arákùnrin rẹ̀.
  alternative: Kò sí ohun ìkọ̀sẹ̀ kankan fún un.
  rationale: ἐν αὐτῷ lè túmọ̀ sí “nínú rẹ̀” ní tààrà, ṣùgbọ́n ó tún lè ní agbára “fún un.” A yan ìtumọ̀ tààrà sínú ọ̀rọ̀ pàtàkì, a sì fi èkejì sínú àlàyé ìsàlẹ̀ kí a má bàa mú àìdánilójú inú Gíríìkì kúrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. A pa àwòrán “ìmọ́lẹ̀” àti “ìkọ̀sẹ̀” mọ́, a sì yẹra fún fífi àlàyé ẹ̀kọ́ ìsìn kan pàtó sínú ẹsẹ náà.
