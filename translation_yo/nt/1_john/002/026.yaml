id: 1JN.2.26
reference: 1 John 2:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ὑμῖν περὶ τῶν πλανώντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/026.yaml
  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: yo
  text: Mo ti kọ àwọn nǹkan wọ̀nyí sí yín nípa àwọn tí ń mú yín ṣìnà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ń tàn yín jẹ” tàbí “àwọn tí ń gbìyànjú láti mú yín ṣìnà.” Participle Gíríìkì náà lè ṣàpèjúwe ìtànjẹ tí wọ́n ń ṣe tàbí ìgbìyànjú láti mú àwọn olùkà ṣìnà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ atọ́ka ọ̀pọ̀ nọ́ńbà yìí ń tọ́ka sí àwọn ohun tí òǹkọ̀wé ti kọ ṣáájú; ‘àwọn nǹkan wọ̀nyí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἔγραψα
  choice: Mo ti kọ
  rationale: Aorist náà sọ nípa iṣẹ́ kíkọ tí ó ti parí. ‘Mo ti kọ’ jẹ́ èdè Yorùbá àdánidá, ó sì fi hàn pé ohun tí a kọ ṣì ṣe pàtàkì fún àwọn olùkà nísinsìnyí.
- source_word: ὑμῖν
  choice: sí yín
  rationale: Dative náà ń tọ́ka sí àwọn tí a kọ ọ̀rọ̀ náà sí; ‘sí yín’ ni ìtumọ̀ Yorùbá tó tààrà jù.
- source_word: περὶ
  choice: nípa
  rationale: Ọ̀rọ̀-atọ́ka yìí fi kókó tí òǹkọ̀wé ń sọ lé lórí hàn; ‘nípa’ jẹ́ èdè Yorùbá tó ṣe kedere, tó sì yẹ fún ìforúkọsílẹ̀ ọlọ́lá.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: àwọn tí ń mú yín ṣìnà
  rationale: Àpólà participle yìí dá àwọn alátakò mọ̀ nípa iṣẹ́ tí wọ́n ń ṣe sí àwọn olùkà. ‘Mú ... ṣìnà’ pa àwòrán jíjáde kúrò ní ọ̀nà òtítọ́ mọ́, láì fi dandan mú un pé wọ́n ti ṣàṣeyọrí.
- source_word: πλανάω
  choice: mú ... ṣìnà
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ẹnì kan ṣìnà tàbí títàn án jẹ. ‘Mú ... ṣìnà’ pa àwòrán ìrìn kúrò ní ọ̀nà tó tọ́ mọ́, ó sì bá ọ̀rọ̀ Jòhánù mu.
theological_decisions:
- issue: Bóyá πλανώντων túmọ̀ sí pé ìtànjẹ náà ti ṣàṣeyọrí tàbí pé wọ́n ń gbìyànjú láti mú àwọn olùkà ṣìnà
  choice: àwọn tí ń mú yín ṣìnà
  alternative: àwọn tí ń gbìyànjú láti mú yín ṣìnà; àwọn tí ń tàn yín jẹ
  rationale: Participles Gíríìkì náà ṣàpèjúwe iṣẹ́ àwọn alátakò sí àwọn olùkà, ṣùgbọ́n kò fi dandan mú un pé wọ́n ti ṣàṣeyọrí. Èdè inú ẹsẹ náà dúró ṣinṣin bí ìkìlọ̀, nígbà tí àlàyé ìsàlẹ̀ ojú-ìwé ń pa àìdánilójú yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tó sì ṣe kedere ni a lò. ‘Àwọn nǹkan wọ̀nyí’ jẹ́ àdánidá ju títú ọ̀pọ̀ nọ́ńbà Gíríìkì sí ọ̀rọ̀ kan ṣoṣo lọ; ‘ń mú yín ṣìnà’ sì pa àwòrán inú πλανάω mọ́.
