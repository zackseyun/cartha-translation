source:
  edition: SBLGNT
  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: yo
  text: 'Nípa èyí ni a fi mọ̀ pé a ti wá mọ̀ ọ́n: bí a bá ń pa àwọn àṣẹ rẹ̀ mọ́.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki, “pé a ti mọ̀ ọ́n”; ìrísí ọ̀rọ̀ ìṣe Gíríìkì náà lè ní ìtumọ̀ pé “a ti wá mọ̀ ọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: nípa èyí ni a fi
  rationale: Ọ̀rọ̀ yìí fi ohun tí ó jẹ́ ẹ̀rí tàbí ìpìlẹ̀ ìmọ̀ hàn. ‘Nípa èyí ni a fi’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa agbára ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: γινώσκομεν
  choice: a mọ̀
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí náà ń sọ ìdánilójú tí a ní nísinsìnyí; ‘a mọ̀’ ni ìtumọ̀ Yorùbá tí ó ṣe kedere jù.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: pé a ti wá mọ̀ ọ́n
  rationale: Ìrísí perfect ti ἐγνώκαμεν tọ́ka sí wíwá sínú ìmọ̀ ẹni náà, tí àbájáde rẹ̀ sì ń bá a lọ. ‘A ti wá mọ̀ ọ́n’ mú ìtumọ̀ yìí jáde láìsọ ohun tí Gíríìkì kò sọ.
- source_word: αὐτόν
  choice: ọ́n
  rationale: A pa ọ̀rọ̀ arọ́pò-orúkọ náà mọ́, dípò kí a sọ pàtó pé Ọlọ́run tàbí Kristi ni, nítorí Gíríìkì kò ṣe àlàyé síwájú sí i ní ẹsẹ yìí.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Èyí ni ìṣètò gbólóhùn oníwà-ìpẹ̀yà tí ó ṣe àdánidá ní Yorùbá, ó sì bá agbára ‘if’ inú Gíríìkì mu.
- source_word: ἐντολάς
  choice: àwọn àṣẹ
  rationale: ‘Àṣẹ’ pa ìwúwo ọ̀rọ̀ ἐντολή mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí gbogbo ènìyàn lè lóye.
- source_word: τηρῶμεν
  choice: ń pa ... mọ́
  rationale: ‘Pa àṣẹ mọ́’ jẹ́ gbólóhùn Yorùbá àdánidá fún ṣíṣe ìgbọràn sí àṣẹ, ó sì pa ìtumọ̀ pípa tàbí ṣíṣọ́ ohun mọ́ tí τηρέω ní mọ́.
theological_decisions:
- issue: Ẹni tí αὐτόν (‘ọ́n’) ń tọ́ka sí
  choice: Pa ọ̀rọ̀ arọ́pò-orúkọ ‘ọ́n’ mọ́ láìsọ ẹni náà ní pàtó.
  alternative: Sọ pé ‘Ọlọ́run’ tàbí ‘Jésù/Kristi.’
  rationale: Gíríìkì lo ọ̀rọ̀ arọ́pò-orúkọ, àyíká lẹ́tà náà sì so mímọ Ọlọ́run àti ìbáṣepọ̀ pẹ̀lú Ọmọ rẹ̀ pọ̀ gidigidi. Pípa ‘ọ́n’ mọ́ kò jẹ́ kí ìtumọ̀ yanju àìdánilójú tí ẹsẹ náà fúnra rẹ̀ kò yanjú.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà ní iyì, ó ṣe kedere, kò sì yanju ẹni tí ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí ju bí orísun Gíríìkì ṣe ṣe lọ.
