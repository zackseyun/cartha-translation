id: 1JN.2.16
reference: 1 John 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: yo
  text: Nítorí gbogbo ohun tí ó wà nínú ayé—ìfẹ́kúfẹ̀ẹ́ ti ara[a][b], ìfẹ́kúfẹ̀ẹ́ ojú, àti ìgbéraga ìgbésí ayé[c]—kì í ṣe láti ọ̀dọ̀ Baba, bí kò ṣe láti inú ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìfẹ́kúfẹ̀ẹ́ ara.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìfẹ́ tó lágbára, ìyánhànhàn, tàbí ìfẹ́kúfẹ̀ẹ́; kò fi mọ́ ìfẹ́ ìbálòpọ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “ara” níhìn-ín sí “ìwà ẹlẹ́ṣẹ̀.” Ní àwọn àyíká kan, ọ̀rọ̀ Gíríìkì fún “ara” lè tọ́ka lọ́nà àpẹẹrẹ sí ìwà ènìyàn tó ti ṣubú sínú ẹ̀ṣẹ̀.
    reason: alternative_reading
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “ìṣògo ìgbésí ayé” tàbí “ìgbéraga nítorí ohun ìní àti ipò ayé.” Ó lè ní ìgbéraga nínú ipò ẹni, ohun ìní rẹ̀, tàbí ọ̀nà ìgbé ayé rẹ̀ nínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó fi ìdí fún àṣẹ inú ẹsẹ tó ṣáájú; “Nítorí” pa agbára ìdí náà mọ́ ní Yorùbá àdánidá.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: gbogbo ohun tí ó wà nínú ayé
  rationale: Ìkọ̀lé ẹyọ ọ̀rọ̀ aláìlẹ́mìí náà ní ìtumọ̀ àkójọpọ̀, “gbogbo ohun” sì fi ìwọ̀n rẹ̀ hàn kedere.
- source_word: κόσμῳ / κόσμου
  choice: ayé
  rationale: “Ayé” ni ìtumọ̀ taara tó tún jẹ́ kí ọ̀rọ̀ náà pa ìfẹ̀ rẹ̀ mọ́ láìfi àlàyé “ètò ayé búburú” sínú ẹsẹ náà.
- source_word: ἐπιθυμία
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: Ó túmọ̀ sí ìfẹ́ tó lágbára, tí ó sì ní ìtumọ̀ búburú nínú àyíká yìí; ọ̀rọ̀ náà kò fi í mọ́ ìfẹ́ ìbálòpọ̀ nìkan.
- source_word: τῆς σαρκὸς
  choice: ti ara
  rationale: “Ara” pa àwòrán σάρξ mọ́, ó sì yẹra fún yíyanjú rẹ̀ ní pàtó sí ẹ̀kọ́ kan nípa ìwà ẹlẹ́ṣẹ̀ ènìyàn.
- source_word: τῶν ὀφθαλμῶν
  choice: ojú
  rationale: Ìsọ̀rí “ìfẹ́kúfẹ̀ẹ́ ojú” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ohun tí ojú ń fẹ́ mọ́.
- source_word: ἀλαζονεία τοῦ βίου
  choice: ìgbéraga ìgbésí ayé
  rationale: Ó pa àpapọ̀ ìtumọ̀ ìgbéraga, ìṣeféfé, ipò, ohun ìní, àti ọ̀nà ìgbé ayé mọ́ láìdín gbólóhùn Gíríìkì náà kù sí ọ̀kan ṣoṣo.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: kì í ṣe láti ọ̀dọ̀ Baba
  rationale: Ó fi orísun hàn kedere, ó sì pa ìyàtọ̀ tó wà láàárín Baba àti ayé mọ́.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: bí kò ṣe láti inú ayé
  rationale: Ó tẹ̀síwájú pẹ̀lú ìfiwéra orísun náà, ní Yorùbá tó rọrùn láti lóye.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú àkójọ ohun búburú
  choice: ara
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: “Ara” sun mọ́ ọ̀rọ̀ orísun, ó sì pa ìfarakanra ẹ̀kọ́ ìgbàgbọ́ náà mọ́; àlàyé ìtumọ̀ àpẹẹrẹ wà nínú àkọsílẹ̀ ìsàlẹ̀.
- issue: Ìtumọ̀ κόσμος
  choice: ayé
  alternative: ètò ayé tó tako Ọlọ́run
  rationale: Ọ̀rọ̀ orísun sọ “ayé”; fífi “ètò ayé” sínú ẹsẹ yóò túmọ̀ ọ̀rọ̀ náà ju bí Gíríìkì ṣe sọ ọ́ lọ.
- issue: Ìbáṣepọ̀ ἀλαζονεία àti βίος
  choice: ìgbéraga ìgbésí ayé
  alternative: ìṣeféfé nípa ipò àti ohun ìní ayé
  rationale: Ìtumọ̀ àkọ́kọ́ pa àìdánilójú gbólóhùn náà mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé àwọn ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ìkọ̀lé tó ṣeé lóye fún gbogbo ènìyàn, ṣùgbọ́n a pa àwòrán àti àìdánilójú pàtàkì inú Gíríìkì mọ́.
