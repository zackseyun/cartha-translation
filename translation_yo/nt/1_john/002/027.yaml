id: 1JN.2.27
reference: 1 John 2:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: yo
  text: Ní ti ẹ̀yin sì, ìfòróró tí ẹ gbà láti ọ̀dọ̀ rẹ̀ ń dúró nínú yín, ẹ kò sì nílò kí ẹnikẹ́ni kọ́ yín. Ṣùgbọ́n bí ìfòróró rẹ̀ ti ń kọ́ yín nípa ohun gbogbo, tí ó sì jẹ́ òtítọ́, tí kì í sì í ṣe irọ́, àti gẹ́gẹ́ bí ó ti kọ́ yín, ẹ dúró nínú rẹ̀.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ kan ní: “àti gẹ́gẹ́ bí ó ti kọ́ yín, ẹ ń dúró nínú rẹ̀.”'
    reason: textual_variant
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ń wà nínú yín” àti “ẹ wà nínú rẹ̀”; ọ̀rọ̀-ìṣe Gíríìkì kan náà ni a lò ní gbogbo ẹsẹ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: ìfòróró
  rationale: Ó pa àwòrán ìfòróró inú Gíríìkì mọ́ láì sọ ọ́ di ‘Ẹ̀mí Mímọ́’ tàbí ohun mìíràn tí ẹsẹ náà kò dárúkọ ní tààràtà.
- source_word: ἀπ’ αὐτοῦ
  choice: lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ni a pa mọ́, kí àyíká ọ̀rọ̀ ló pinnu ẹni tí ‘rẹ̀’ ń tọ́ka sí.
- source_word: μένει / μένετε
  choice: ń dúró / ẹ máa dúró
  rationale: ‘Dúró’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ṣíṣe àìkúrò tàbí wíwà nìṣó, ó sì jẹ́ kí àtúnwí ọ̀rọ̀ Gíríìkì kan náà hàn ní apá méjèèjì.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: ẹ kò sì nílò kí ẹnikẹ́ni kọ́ yín
  rationale: Ó tẹ̀ lé agbára gbólóhùn Gíríìkì láì sọ ọ́ di ìkọ̀sílẹ̀ gbogbo olùkọ́ ènìyàn tàbí láì dín ohun tí ẹsẹ náà sọ kù.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: kọ́ / ń kọ́ / ti kọ́
  rationale: A lo gbòǹgbò ọ̀rọ̀ kan náà ní gbogbo ibi láti pa àtúnwí àti ìtẹnumọ́ Gíríìkì mọ́.
- source_word: περὶ πάντων
  choice: nípa ohun gbogbo
  rationale: Ó pa ìbú gbólóhùn náà mọ́ láì fi àlàyé tó dín ìtumọ̀ rẹ̀ kù sí i.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: ó sì jẹ́ òtítọ́, tí kì í sì í ṣe irọ́
  rationale: Ó pa ìtakora Johanu láàárín òtítọ́ àti irọ́ mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: gẹ́gẹ́ bí ó ti kọ́ yín
  rationale: Ó pa ìbáṣepọ̀ afiwéra mọ́ láàárín ohun tí ìfòróró ti kọ́ wọn àti àṣẹ tó tẹ̀ lé e.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú ‘rẹ̀’; yíyan yìí pa ọ̀rọ̀ arọ́pò-orúkọ orísun mọ́ láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ohun tí χρῖσμα (‘ìfòróró’) ń tọ́ka sí
  choice: A pa àpèjúwe náà mọ́ gẹ́gẹ́ bí ‘ìfòróró’.
  alternative: ‘Ẹ̀mí Mímọ́’ tàbí ‘ìhìn rere tí wọ́n gbà’.
  rationale: Bó tilẹ̀ jẹ́ pé àyíká lè tọ́ka sí Ẹ̀mí àti iṣẹ́ ìkọ́ni rẹ̀, ẹsẹ náà fúnra rẹ̀ lo àwòrán ‘ìfòróró’; ìtumọ̀ kò gbọ́dọ̀ yan ẹ̀kọ́ kan níbi tí ọ̀rọ̀ náà kò ti sọ ọ́ ní tààràtà.
- issue: Agbára ọ̀rọ̀ ‘ẹ kò nílò kí ẹnikẹ́ni kọ́ yín’
  choice: A pa gbólóhùn náà mọ́ bí ó ti le tó.
  alternative: Kí a túmọ̀ rẹ̀ sí ìkọ̀sílẹ̀ gbogbo olùkọ́ ènìyàn, tàbí kí a dín in kù sí àwọn olùkọ́ èké nìkan.
  rationale: Ìtumọ̀ náà kò mú gbólóhùn náà le ju orísun lọ, kò sì sọ ọ́ di rírẹ̀; àyíká ni yóò darí bí a ṣe lóye rẹ̀.
- issue: Ìrísí ọ̀rọ̀-ìṣe ìparí μένετε
  choice: 'Àṣẹ: ‘ẹ máa dúró nínú rẹ̀.’'
  alternative: 'Àlàyé: ‘ẹ ń dúró nínú rẹ̀.’'
  rationale: Ọ̀rọ̀ inú SBLGNT bá àṣẹ mu dáadáa ní àyíká yìí, ṣùgbọ́n ẹ̀rí àwọn àfọwọ́kọ kan fún ìrísí àlàyé ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- issue: Ẹni tí ‘nínú rẹ̀’ ń tọ́ka sí
  choice: A fi ‘rẹ̀’ sílẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ arọ́pò-orúkọ.
  alternative: Kí a sọ ní pàtó pé ‘nínú Kristi,’ ‘nínú Ọlọ́run,’ tàbí ‘nínú ìfòróró náà.’
  rationale: Gíríìkì lo ọ̀rọ̀ arọ́pò-orúkọ akọ, ṣùgbọ́n kò tún ẹni tí ó ń tọ́ka sí dárúkọ; Yorùbá ‘rẹ̀’ pa àìdánilójú àyíká yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ní ti ẹ̀yin sì’ mú καὶ ὑμεῖς jáde bí ìyàtọ̀ tàbí ìtẹnumọ́, ‘ìfòróró’ sì pa àwòrán ẹ̀sìn orísun mọ́. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, bí àwọn ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì ṣe jẹ́ ọ̀pọ̀.
