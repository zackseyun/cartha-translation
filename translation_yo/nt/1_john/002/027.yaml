    rationale: Ìrísí yìí lè sọ àṣà tàbí ìṣe tí ń ṣẹlẹ̀ léraléra, nígbà tí μένετε nínú ọ̀rọ̀ SBLGNT jẹ́ àṣẹ. ‘Ẹ dúró nínú rẹ̀’ jẹ́ àṣẹ Yorùbá tó mọ́ síi.
  - severity: medium
