  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé SBLGNT dáadáa ní gbogbogbò: ó pa ‘ìfòróró’ mọ́, ó fi ìtumọ̀ ‘nípa ohun gbogbo’ hàn, ó sì pa àṣẹ ìkẹyìn mọ́. Síbẹ̀, ‘lọ́wọ́ rẹ̀’ lè mú èrò ‘láti ọwọ́ rẹ̀’ (from his hand) wá, níbi tí ἀπ’ αὐτοῦ kan sọ pé ‘láti ọ̀dọ̀ rẹ̀.’ ‘Ẹ máa dúró’ tún ní ìró ìṣe tí ń tẹ̀síwájú/àṣà, dípò àṣẹ tààrà ‘ẹ dúró.’'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tí ó mọ́, pẹ̀lú àmì ohùn tó péye ní ọ̀pọ̀ ibi. Àmọ́ ‘ẹ dúró nínú rẹ̀’ jẹ́ àṣẹ tó dáa síi ju ‘ẹ máa dúró nínú rẹ̀’ lọ ní ibi yìí. Àlàyé ìsàlẹ̀ b ní ‘gbé inú,’ èyí tí kò dáa ní Yorùbá nínú ìtumọ̀ ‘abide/remain’; ‘wà nínú’ ni ó yẹ.
  terminology: ‘Ìfòróró,’ ‘kọ́,’ ‘òtítọ́,’ àti ‘irọ́’ yẹ fún ìforúkọsílẹ̀ àti ọ̀rọ̀ ẹ̀sìn Yorùbá. ‘Láti ọ̀dọ̀ rẹ̀’ pa ìtumọ̀ arọ́pò-orúkọ orísun mọ́ láì fi ‘ọwọ́’ kún un. ‘Ń dúró’ àti ‘ẹ dúró’ ń pa àtúnwí μένω mọ́ dáadáa.
  issues:
  - severity: low
    issue: ‘lọ́wọ́ rẹ̀’ ní ìbẹ̀rẹ̀ ẹsẹ náà
    rationale: Bí ó tilẹ̀ lè túmọ̀ sí ‘from him’ ní ọ̀pọ̀ àyíká, ó lè túmọ̀ sí ‘from his hand.’ ‘Láti ọ̀dọ̀ rẹ̀’ jẹ́ ìtumọ̀ tó taara síi fún ἀπ’ αὐτοῦ, ó sì pa ẹni tí arọ́pò-orúkọ ń tọ́ka sí mọ́.
