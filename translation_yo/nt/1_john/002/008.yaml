id: 1JN.2.8
reference: 1 John 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: yo
  text: Lẹ́ẹ̀kan sí i, òfin tuntun ni mo ń kọ sí yín; èyí sì jẹ́ òtítọ́ nínú Kristi àti nínú yín, nítorí òkùnkùn ń kọjá lọ, ìmọ́lẹ̀ tòótọ́ sì ti ń tàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: Lẹ́ẹ̀kan sí i
  rationale: Ó ṣe àfihàn pé Jòhánù tún ń sọ ọ̀rọ̀ náà ní ojú ìwòye mìíràn lẹ́yìn ẹsẹ 7, láìfi ìtumọ̀ àtakò tí ó lágbára kún un.
- source_word: ἐντολὴν καινὴν
  choice: òfin tuntun
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, ó sì pa ìtumọ̀ òfin tí ó jẹ́ tuntun ní irú tàbí ní ànímọ́ mọ́.
- source_word: γράφω
  choice: ni mo ń kọ sí yín
  rationale: Àmì ‘ń’ fi hàn pé iṣẹ́ kíkọ náà ń lọ lọ́wọ́, bí ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí inú Gíríìkì ṣe lè túmọ̀ sí.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: Òfin yìí jẹ́ òtítọ́
  rationale: Pípa gbólóhùn náà sí méjì mú un ṣe kedere ní Yorùbá; ‘jẹ́ òtítọ́’ pa ìtumọ̀ ohun tí ó jẹ́ gidi tàbí òtítọ́ mọ́.
- source_word: ἐν αὐτῷ
  choice: nínú òun
  rationale: ‘Òun’ tọ́ka sí ẹni, ó sì ṣe àfihàn ìtumọ̀ tí ó ṣeé ṣe jù pé Kristi ni ọ̀rọ̀ náà ń tọ́ka sí, láìfi orúkọ tí kò sí nínú gbólóhùn Gíríìkì kún un.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Ó pa ìfaradà tó wà láàárín ‘nínú òun’ àti ‘nínú yín’ mọ́, ó sì lè tọ́ka sí bí òtítọ́ náà ṣe wà nínú àwọn onígbàgbọ́.
- source_word: ἡ σκοτία παράγεται
  choice: òkùnkùn ń kọjá lọ
  rationale: Ó fi hàn pé píparẹ́ òkùnkùn jẹ́ ohun tí ó ti ń ṣẹlẹ̀ báyìí, kì í ṣe ohun tí ó ti parí tán.
- source_word: τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει
  choice: ìmọ́lẹ̀ tòótọ́ sì ti ń tàn
  rationale: ‘Tòótọ́’ pa àṣàyàn ọ̀rọ̀ pàtàkì ti Jòhánù mọ́; ‘ti ń tàn’ sì mú ἤδη àti iṣẹ́ tí ó ń bá a lọ jáde lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Ohun tí αὐτῷ ń tọ́ka sí
  choice: 'A mú un gẹ́gẹ́ bí ẹni tí ó ń tọ́ka sí Kristi: ‘nínú òun.’'
  alternative: 'A lè mú un gẹ́gẹ́ bí ohun tí ó ń tọ́ka sí òfin náà: ‘nínú rẹ̀.’'
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ akọ nínú Gíríìkì àti àyíká ìwé Jòhánù mú kí Kristi jẹ́ ẹni tí ó ṣeé ṣe jù lọ. Síbẹ̀, nítorí ìṣòro ìbámu ọ̀rọ̀ àti ìtumọ̀ gbólóhùn náà, a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Pípa gbólóhùn Gíríìkì kan sí gbólóhùn Yorùbá méjì ń mú kíkà rẹ̀ rọrùn láìyí ìbáṣepọ̀ ọ̀rọ̀ padà.
