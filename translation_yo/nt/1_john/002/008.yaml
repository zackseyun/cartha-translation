  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: πάλιν, ἐντολὴν καινήν, ìparun òkùnkùn tí ń lọ lọ́wọ́, àti ìmọ́lẹ̀ tòótọ́ tí ó ti bẹ̀rẹ̀ sí í tàn. Ṣùgbọ́n ‘nínú òun’ kò dáa gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ἐν αὐτῷ, ó sì lè ṣàìmọ ẹni tí a ń tọ́ka sí. Fífi ‘Kristi’ hàn nínú ìtumọ̀ àkọ́kọ́ jẹ́ ìṣàlàyé tó yẹ nítorí àyíká ọ̀rọ̀ náà, nígbà tí àlàyé ìsàlẹ̀ ń pa ìfẹ̀hónúhàn míràn mọ́.'
