id: 1JN.2.19
reference: 1 John 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: yo
  text: Wọ́n jáde kúrò láàárín wa, ṣùgbọ́n wọn kò jẹ́ ara wa; nítorí bí wọ́n bá ti jẹ́ ara wa, wọn ìbá ti dúró pẹ̀lú wa[a]. Ṣùgbọ́n èyí ṣẹlẹ̀ kí wọ́n lè hàn gbangba[b] pé kì í ṣe gbogbo wọn ni ó jẹ́ ara wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn ìbá ti ń bá a lọ láti wà pẹ̀lú wa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí wọ́n lè fara hàn” tàbí “kí a lè fi wọ́n hàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: kúrò láàárín wa / ara wa
  rationale: Ní ìṣẹ̀lẹ̀ àkọ́kọ́, gbólóhùn náà ń tọ́ka sí jíjáde kúrò nínú àwùjọ, nítorí náà “kúrò láàárín wa” jẹ́ èdè Yorùbá àdánidá. Ní àwọn ìṣẹ̀lẹ̀ tó tẹ̀ lé e, “ara wa” ń fi ìbáṣepọ̀ àti jíjẹ́ ọ̀kan lára àwùjọ hàn láì túmọ̀ rẹ̀ sí ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
- source_word: ἐξῆλθαν
  choice: Wọ́n jáde
  rationale: Èyí pa àwòrán gidi ti jíjáde mọ́, kò sì fi ìtumọ̀ bí “wọ́n kọ ìgbàgbọ́ sílẹ̀” kún ọ̀rọ̀-ìṣe náà.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: wọn kò jẹ́ ara wa
  rationale: Ó fi àsìkò tí ó ti kọjá hàn, ó sì mú èrò ìbáṣepọ̀ inú “ἐξ ἡμῶν” jáde ní Yorùbá tó ṣe kedere láì sọ pé “wọn kì í ṣe onígbàgbọ́ tòótọ́.”
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: nítorí bí wọ́n bá ti jẹ́ ara wa
  rationale: Ìlànà “bá ti …, ìbá ti …” jẹ́ ọ̀nà Yorùbá àdánidá fún ipò àròsọ tí kò ṣẹlẹ̀.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: wọn ìbá ti dúró pẹ̀lú wa
  rationale: “Dúró pẹ̀lú wa” sọ abajade ipò àròsọ náà ní kedere, ó sì pa ìtumọ̀ μένω ti dídúró tàbí títẹ̀ síwájú mọ́.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: Ṣùgbọ́n èyí ṣẹlẹ̀ kí ó lè hàn gbangba
  rationale: Èyí jẹ́ Yorùbá tó ṣàn déédéé fún ìtumọ̀ ète tàbí abajade inú ἵνα àti ìtumọ̀ aláìlórúkọ ti φανερωθῶσιν, láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: pé kì í ṣe gbogbo wọn ni ó jẹ́ ara wa
  rationale: Èyí pa bí Gíríìkì ṣe so “kì í ṣe gbogbo” pọ̀ mọ́ jíjẹ́ ara wa mọ́, kò sì yí ọ̀rọ̀ náà sí àlàyé ẹ̀kọ́ ìgbàgbọ́ tó túbọ̀ le.
theological_decisions:
- issue: Bóyá kí a túmọ̀ “ara wa” ní ọ̀nà tí yóò pinnu ẹni tó jẹ́ ọmọ ìjọ tàbí onígbàgbọ́ tòótọ́
  choice: Pa èdè ìbáṣepọ̀ “ara wa” mọ́.
  alternative: “wọn kì í ṣe onígbàgbọ́ tòótọ́” tàbí “wọn kò jẹ́ ọmọ ìjọ ní tòótọ́”
  rationale: Ẹsẹ̀ náà fi ìyàtọ̀ hàn láàárín jíjáde kúrò láàárín wọn àti jíjẹ́ ara wọn, ṣùgbọ́n kò lo àwọn ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí àwọn àṣà ìjọ máa ń lò. “Ara wa” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ náà mọ́ láì dá a parí fún òǹkàwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. Àwọn ọ̀rọ̀ bí “ara wa” àti “dúró pẹ̀lú wa” jẹ́ ti ìbánisọ̀rọ̀ ojoojúmọ́, ṣùgbọ́n wọ́n tún bójú mu fún ìtẹ̀jáde Ìwé Mímọ́.
