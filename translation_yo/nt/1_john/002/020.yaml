id: 1JN.2.20
reference: 1 John 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin ní ìfòróró láti ọ̀dọ̀ Ẹni Mímọ́[a], gbogbo yín sì mọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ mìíràn ní ọ̀nà kíkà tí ó lè túmọ̀ sí, “ẹ sì mọ ohun gbogbo.” Ọ̀nà kíkà SBLGNT ṣe àtìlẹ́yìn fún, “gbogbo yín sì mọ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Ṣùgbọ́n
  rationale: Ní àyíká ọ̀rọ̀ yìí, καί ń fi ẹ̀yin olùgbọ́ wé àwọn aṣòdì sí Kristi tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; “Ṣùgbọ́n” mú ìyàtọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ní ìtẹnumọ́; “ẹ̀yin” pa ìtẹnumọ́ àti ìyàtọ̀ mọ́.
- source_word: χρῖσμα
  choice: àmì-òróró
  rationale: Yíyan “àmì-òróró” pa àwòrán ìfòróróyàn inú ọ̀rọ̀ Gíríìkì mọ́ láì túmọ̀ rẹ̀ ní pàtó sí Ẹ̀mí Mímọ́ tàbí iṣẹ́ rẹ̀.
- source_word: ἔχετε
  choice: ní
  rationale: “Ní” ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti sọ pé ẹnì kan ní tàbí gba ohun kan.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: láti ọ̀dọ̀ Ẹni Mímọ́
  rationale: Èyí pa oyè àìsọ pàtó náà mọ́, láì pinnu pé Baba tàbí Ọmọ ni a ń tọ́ka sí.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so gbólóhùn kejì mọ́ ti àkọ́kọ́ lọ́nà Yorùbá tó rọrùn.
- source_word: οἴδατε
  choice: mọ̀
  rationale: “Mọ̀” ni ìtumọ̀ tààrà, tó sì bá Yorùbá òde òní mu.
- source_word: πάντες
  choice: gbogbo yín
  rationale: πάντες jẹ́ àpèjúwe àwọn ẹni tí a ń bá sọ̀rọ̀, nítorí náà “gbogbo yín” túmọ̀ sí “you all,” kì í ṣe “gbogbo ohun.”
theological_decisions:
- issue: Ẹni tí oyè “Ẹni Mímọ́” ń tọ́ka sí
  choice: A pa á mọ́ gẹ́gẹ́ bí “Ẹni Mímọ́,” láì sọ pé Baba tàbí Ọmọ ni.
  alternative: Baba; Ọmọ/Jésù Kristi
  rationale: Ọ̀rọ̀ Gíríìkì kò dá ẹni tí oyè náà tọ́ka sí lójú níhìn-ín; títúmọ̀ oyè náà bí ó ti rí pa àìsọ pàtó tó wà nínú ẹsẹ náà mọ́.
- issue: Ìtumọ̀ χρῖσμα
  choice: A túmọ̀ rẹ̀ sí “àmì-òróró,” a sì pa àwòrán náà mọ́.
  alternative: Ẹ̀mí Mímọ́; ìfòróróyàn Ẹ̀mí; ẹ̀bùn ìfòróróyàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ènìyàn ló lóye rẹ̀ gẹ́gẹ́ bí Ẹ̀mí Mímọ́ tàbí iṣẹ́ Ẹ̀mí, ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àwòrán ìfòróróyàn; kò yẹ kí ìtumọ̀ pinnu àlàyé ẹ̀kọ́ ìgbàgbọ́ náà.
- issue: Ìyàtọ̀ àfọwọ́kọ ní πάντες/πάντα
  choice: 'A tẹ̀ lé SBLGNT: “gbogbo yín sì mọ̀.”'
  alternative: “ẹ sì mọ ohun gbogbo”
  rationale: Àfọwọ́kọ tí a fi fún wa ní πάντες, tí ó jẹ́ àkọ́lé ọ̀pọ̀ ènìyàn (“gbogbo yín”), dípò πάντα (“ohun gbogbo”).
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe déédéé fún kíkà ní gbangba, ni a lò. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà wà ní kíkún níbi tí ó bá yẹ. “Àmì-òróró” jẹ́ ọ̀rọ̀ tó pa àwòrán Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó ní ìwọ̀n àkànṣe nínú èdè ìjọ.
