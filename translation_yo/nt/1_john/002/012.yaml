id: 1JN.2.12
reference: 1 John 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: yo
  text: Mo ń kọ̀wé sí yín[a], ẹ̀yin ọmọ kékeré, nítorí[b] a ti dárí àwọn ẹ̀ṣẹ̀ yín jì yín nítorí orúkọ rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo kọ̀wé sí yín.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè jẹ́ àsìkò ìsinsìnyí lasán tàbí kí ó tọ́ka sí ìṣe kíkọ tí ó ń lọ lọ́wọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “pé a ti dárí àwọn ẹ̀ṣẹ̀ yín jì yín.” Ọ̀rọ̀ Gíríìkì náà lè bẹ̀rẹ̀ ohun tí Johanu ń sọ, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe jù pé ó ń sọ ìdí tí ó fi ń kọ̀wé níbí.
    reason: alternative_reading
  - marker: c
    text: Nínú àyíká ọ̀rọ̀, “rẹ̀” lè tọ́ka sí Ọlọ́run tàbí sí Jésù; Gíríìkì kò dárúkọ ẹni náà ní pàtó níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: Mo ń kọ̀wé
  rationale: Ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí yìí lè túmọ̀ sí “Mo kọ̀wé” tàbí “Mo ń kọ̀wé.” Àmì “ń” bá ìṣe kíkọ lẹ́tà tí ó ń lọ lọ́wọ́ mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: τεκνία
  choice: ẹ̀yin ọmọ mi kékeré
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ìfẹ́ni tí ẹni àgbà fi ń pe àwọn tó kà sí ọmọ rẹ̀, kì í ṣe pé ọjọ́-orí wọn kéré nìkan. “Ọmọ mi kékeré” pa ìbáṣepọ̀ ìdílé àti ìfẹ́ni rẹ̀ mọ́ nínú Yorùbá àdánidá.
- source_word: ὅτι
  choice: nítorí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù pé ὅτι ń sọ ìdí tí Johanu fi ń kọ̀wé, bí ó tilẹ̀ jẹ́ pé ó tún lè fi ohun tí ó ń kọ hàn.
- source_word: ἀφέωνται
  choice: a ti dárí … jì yín
  rationale: Ìrísí perfect passive náà ń tọ́ka sí ohun tí a ti ṣe tí àbájáde rẹ̀ ṣì wà. “A ti dárí … jì yín” fi ohùn àfaragà àti ipò tí ó ń bá a lọ hàn dáadáa.
- source_word: αἱ ἁμαρτίαι
  choice: àwọn ẹ̀ṣẹ̀ yín
  rationale: Dative ὑμῖν pẹ̀lú ọ̀rọ̀ ìdáríjì ń fi hàn pé ẹ̀ṣẹ̀ àwọn tí a ń bá sọ̀rọ̀ ni. Lílo “yín” mú èyí ṣe kedere ní Yorùbá.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: nítorí orúkọ rẹ̀
  rationale: διά pẹ̀lú accusative ń sọ ìdí tàbí ìpìlẹ̀. “Nítorí orúkọ rẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ Bíbélì ti “orúkọ” mọ́ láì sọ ọ́ di òkìkí lásán.
- source_word: ὄνομα
  choice: orúkọ
  rationale: “Orúkọ” pa ìtumọ̀ ti ẹni náà fúnra rẹ̀, ọlá rẹ̀, àti àṣẹ rẹ̀ mọ́; “òkìkí” nìkan kò ní gbòòrò tó.
theological_decisions:
- issue: Ẹni tí “rẹ̀” ń tọ́ka sí nínú “orúkọ rẹ̀”
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “rẹ̀,” láì sọ ẹni náà ní pàtó nínú ọ̀rọ̀ pàtàkì.
  alternative: Ọlọ́run tàbí Jésù Kristi
  rationale: Ẹsẹ̀ yìí fúnra rẹ̀ kò dárúkọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí. Fífi “rẹ̀” sílẹ̀ pa àìdánilójú tó wà nínú Gíríìkì mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “ọmọ mi kékeré” gẹ́gẹ́ bí ọ̀rọ̀ ìfẹ́ni àdánidá, kì í ṣe láti fi ọjọ́-orí kékeré múlẹ̀. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
