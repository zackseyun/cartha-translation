  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: yo
  text: Bí ẹ̀yin bá mọ̀ pé olódodo ni òun[b], ẹ̀yin mọ̀ pé gbogbo ẹni tí ó ń ṣe òdodo jẹ́ ẹni tí a ti bí láti ọ̀dọ̀ rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “láti inú rẹ̀,” èyí tí ó tẹnumọ́ pé òun ni orísun ìbí náà.
    reason: lexical_alternative
  - marker: b
    text: “Òun” lè tọ́ka sí Ọlọ́run Baba tàbí sí Ọmọ; ọ̀rọ̀ Gíríìkì kò sọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí ní pàtó níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Bí ẹ̀yin bá mọ̀
  rationale: Ọ̀rọ̀ yìí fi ipò àdéhùn hàn. “Bí ... bá mọ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ náà.
- source_word: δίκαιός
  choice: olódodo
  rationale: “Olódodo” sọ ànímọ́ ẹni tí ó tọ́ níwà àti ní ìṣe, ó sì bá “òdodo” mu nínú gbólóhùn kan náà.
- source_word: γινώσκετε
  choice: ẹ̀yin mọ̀
  rationale: A mú un gẹ́gẹ́ bí gbólóhùn ìsọfúnni, kì í ṣe àṣẹ. Àtúnsọ “mọ̀” tún pa ìbáramu àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́ ní Yorùbá.
- source_word: πᾶς ὁ ποιῶν
  choice: gbogbo ẹni tí ó ń ṣe
  rationale: Àmì “ń” fi ìṣe tí ń bá a lọ tàbí tí ó jẹ́ ìwà ẹni hàn, dípò ìṣe ẹ̀ẹ̀kan ṣoṣo.
- source_word: τὴν δικαιοσύνην
  choice: òdodo
  rationale: “Òdodo” bá “olódodo” mu, ó sì tọ́ka sí ìwà àti ìṣe tí ó tọ́.
- source_word: ἐξ αὐτοῦ
  choice: láti ọ̀dọ̀ rẹ̀
  rationale: Ọ̀rọ̀ yìí pa èrò orísun mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ìbí náà wá láti ọ̀dọ̀ ẹni náà.
- source_word: γεγέννηται
  choice: ni a ti bí
  rationale: “A ti bí” pa ohùn àìṣe àti ìṣe tí ó ti ṣẹlẹ̀ ṣùgbọ́n tí àbájáde rẹ̀ ṣì dúró mọ́, gẹ́gẹ́ bí perfect passive Gíríìkì.
theological_decisions:
- issue: Ẹni tí “òun/rẹ̀” ń tọ́ka sí (δίκαιός ἐστιν ... ἐξ αὐτοῦ)
  choice: A fi arọ́pò-orúkọ “òun” àti “rẹ̀” sílẹ̀ láì sọ orúkọ ẹni náà.
  alternative: Ọlọ́run Baba tàbí Ọmọ
  rationale: Àyíká ọ̀rọ̀ lè jẹ́ kí a ka arọ́pò-orúkọ náà sí Baba tàbí sí Ọmọ; ẹsẹ yìí fúnra rẹ̀ kò sọ ẹni tí ó jẹ́ ní pàtó. Ìtumọ̀ náà kò yanju àìdánilójú tí ọ̀rọ̀ Gíríìkì fi sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye ni a lò. “Ẹ̀yin” mú ẹni kejì púpọ̀ hàn ní kedere; “ń ṣe òdodo” fi ìṣe àṣà tàbí ìwà tí ń bá a lọ hàn. A mọ̀ọ́mọ̀ pa àìdánilójú arọ́pò-orúkọ inú Gíríìkì mọ́.
