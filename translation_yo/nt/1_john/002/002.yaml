source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: yo
  text: Òun fúnra rẹ̀ sì ni ẹbọ ètùtù fún àwọn ẹ̀ṣẹ̀ wa[a], kì í sì í ṣe fún àwọn ẹ̀ṣẹ̀ wa nìkan, ṣùgbọ́n fún ti gbogbo ayé pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìpẹ̀tù”; àwọn mìíràn sì lóye rẹ̀ gẹ́gẹ́ bí “ìmúkúrò ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Òun fúnra rẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìtẹnumọ́ αὐτός hàn, ó sì tẹnu mọ́ ipa tí Jesu fúnra rẹ̀ kó.
- source_word: ἱλασμός
  choice: ẹbọ ètùtù
  rationale: Ó sọ èrò ẹbọ tí ń ṣe ètùtù di mímọ̀ ní èdè Yorùbá tí ó ṣeé lóye, láì fi ọ̀rọ̀ náà sínú àlàyé ẹ̀kọ́ ìsìn kan ṣoṣo.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: fún àwọn ẹ̀ṣẹ̀ wa
  rationale: “Fún” bá ìtumọ̀ περί ní ìbáṣepọ̀ pẹ̀lú ἱλασμός mu, “àwọn ẹ̀ṣẹ̀” sì pa ọ̀pọ̀ nọ́ńbà inú Gíríìkì mọ́.
- source_word: τῶν ἡμετέρων
  choice: tiwa
  rationale: Ọ̀rọ̀ arọ́pò ohun-ìní yìí dúró fún “àwọn ẹ̀ṣẹ̀ wa” tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: ὅλου τοῦ κόσμου
  choice: gbogbo ayé
  rationale: Ó pa ìwọ̀n gbígbòòrò ὅλου mọ́, láì dín κόσμος kù sí ẹgbẹ́ ènìyàn kan.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: kì í sì í ṣe ... nìkan, ṣùgbọ́n ... pẹ̀lú
  rationale: Ìṣètò yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìfiwéra àti àfikún inú Gíríìkì mọ́.
theological_decisions:
- issue: Ìwọ̀n “gbogbo ayé”
  choice: A pa gbólóhùn gbígbòòrò náà mọ́ gẹ́gẹ́ bí “gbogbo ayé.”
  alternative: “àwọn ènìyàn láti gbogbo ayé” tàbí “àwọn àyànfẹ́ káàkiri ayé”
  rationale: Gíríìkì kò fi ìdínkù bẹ́ẹ̀ hàn; ìtumọ̀ náà kò gbọ́dọ̀ yanjú awuyewuye ẹ̀kọ́ ìsìn níbi tí ọ̀rọ̀ ìpilẹ̀ ti fi ìfọ̀rọ̀wérọ̀ sílẹ̀.
- issue: Ìtumọ̀ ἱλασμός
  choice: ẹbọ ètùtù
  alternative: ohun ìpẹ̀tù; ẹbọ tí ń mú ẹ̀ṣẹ̀ kúrò
  rationale: “Ẹbọ ètùtù” jẹ́ ọ̀rọ̀ tí ó ṣeé lóye, ó pa àyíká ẹbọ mọ́, kò sì pinnu pé apá kan ṣoṣo nínú ìtumọ̀ ọ̀rọ̀ náà ni ó tọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “Òun fúnra rẹ̀” fún ìtẹnumọ́, “tiwa” sì pa àfojúsùn gírámà Gíríìkì mọ́ láì tún “àwọn ẹ̀ṣẹ̀ wa” sọ lásán.
