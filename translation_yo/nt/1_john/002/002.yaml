  to: Òun fúnra rẹ̀ sì ni ẹbọ ètùtù fún àwọn ẹ̀ṣẹ̀ wa[a], kì í sì í ṣe fún àwọn ẹ̀ṣẹ̀ wa nìkan, ṣùgbọ́n fún ti gbogbo ayé pẹ̀lú.
  rationale: A tún “àwọn ẹ̀ṣẹ̀ wa” sọ ní apá kejì láti mú ellipsis Gíríìkì náà hàn ní kedere ní Yorùbá. Èyí kò yí ìtumọ̀ tàbí ìwọ̀n gbòòrò gbólóhùn náà padà. A sì ṣàtúnṣe àlàyé ẹsẹ̀ díẹ̀ láti fi àwọn ìtumọ̀ ἱλασμός tó ṣeé ṣe hàn láì yan ẹgbẹ́ ìtumọ̀ ẹ̀kọ́ ìsìn kankan.
