  source_fidelity: 'Ìtumọ̀ náà pa ìtẹ̀lé gbolohun Gíríìkì mọ́ dáadáa: ẹni náà wà nínú òkùnkùn, ó ń rìn nínú rẹ̀, kò mọ ibi tí ó ń lọ, òkùnkùn sì ti fọ́ ọ́ lójú. Àmọ́ ‘tí ó bá kórìíra’ ní agbára ìṣèjọba/ìpèníjà (‘ẹni tí ó bá…’) tí participle ìsinsìnyí μισῶν kò béèrè fún. ‘Tí ó kórìíra’ dá ìwà tí ó ń bá a lọ hàn dáadáa láì ṣàfikún ìpele ìṣèjọba.'
