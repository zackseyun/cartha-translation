id: 1JN.2.11
reference: 1 John 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó kórìíra arákùnrin rẹ̀ wà nínú òkùnkùn, ó sì ń rìn nínú òkùnkùn[a]. Kò mọ ibi tí ó ń lọ, nítorí pé òkùnkùn ti fọ́ ọ́ lójú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin tàbí arábìnrin rẹ̀.” Ọ̀rọ̀ náà ní èdè Gíríìkì jẹ́ “arákùnrin,” ó sì ṣeé ṣe kí ó tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́ kan nínú àwùjọ àwọn Kristẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: ẹni tí ó bá kórìíra
  rationale: Ọ̀rọ̀ náà jẹ́ participle ti àkókò ìsinsìnyí tí a lò gẹ́gẹ́ bí orúkọ; ìtumọ̀ yìí fi ìwà tàbí ìdúró ẹni náà hàn ní èdè Yorùbá àdánidá.
- source_word: ἀδελφὸν
  choice: arákùnrin rẹ̀
  rationale: Ó pa ẹyọ akọ inú Gíríìkì mọ́; ní àyíká lẹ́tà Johanu, ó sábà ń tọ́ka sí ọmọ ẹgbẹ́ kan náà nínú àwùjọ àwọn onígbàgbọ́.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nínú òkùnkùn
  rationale: Ó pa àwòrán òkùnkùn àti àtúnwí rẹ̀ mọ́, láì tú u sí ‘ìwà búburú’ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ kan.
- source_word: περιπατεῖ
  choice: ń rìn
  rationale: Ó pa àkàwé ìrìn gẹ́gẹ́ bí ìwà ayé ẹni mọ́ dípò kí a sọ ọ́ di ‘ń gbé ìgbésí ayé’.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: Kò mọ ibi tí òun ń lọ
  rationale: Èyí jẹ́ Yorùbá àdánidá, ó sì pa èrò ìlọsíwájú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ti fọ́ ọ lójú
  rationale: Àṣà-ọ̀rọ̀ Yorùbá yìí túmọ̀ sí pé a ti sọ ọ́ di afọ́jú; ‘ti’ tún fi àbájáde tí ó ṣì wà nísinsìnyí hàn.
theological_decisions:
- issue: Ìtumọ̀ ìwà àti ti ẹ̀mí fún òkùnkùn nínú àkàwé Johanu
  choice: òkùnkùn
  alternative: ìwà búburú; òkùnkùn ẹ̀ṣẹ̀
  rationale: A pa àkàwé orísun mọ́ kí ìtakora rẹ̀ pẹ̀lú ìmọ́lẹ̀ àti ìjinlẹ̀ ẹ̀kọ́ rẹ̀ lè dúró láì fi àlàyé tóóró kún un.
- issue: Ẹni tí ‘arákùnrin’ ń tọ́ka sí
  choice: Pa ‘arákùnrin’ mọ́ nínú ọ̀rọ̀ pàtàkì, kí àlàyé tó gbooro wà ní àlàyé ìsàlẹ̀.
  alternative: arákùnrin tàbí arábìnrin; onígbàgbọ́ ẹlẹgbẹ́ rẹ̀
  rationale: Orísun jẹ́ akọ ẹyọ, ó sì ṣeé ṣe kí ó dúró fún ọmọ ẹgbẹ́ mìíràn nínú àwùjọ àwọn onígbàgbọ́; àlàyé ìsàlẹ̀ ń ṣàlàyé agbára ìtọ́kasí rẹ̀ láì yí fọ́ọ̀mù orísun padà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì yé òǹkàwé òde òní. A pa àtúnwí ‘nínú òkùnkùn’ àti àkàwé ‘ń rìn’ mọ́. Gbogbo àmì ohùn ni a lò níbi tí ó bá yẹ.
