  terminology: ‘Òkùnkùn,’ ‘ń rìn,’ àti ‘arákùnrin’ jẹ́ àwọn yíyan tó péye; wọ́n pa àkàwé Johanu, àtúnwí, àti akọ-ẹyọ orísun mọ́. Àlàyé ìsàlẹ̀ náà ń jẹ́ kí ìtọ́kasí tí ó lè gbooro sí arábìnrin hàn láì rọ́pò ọrọ̀ pàtàkì.
