id: 1JN.2.15
reference: 1 John 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: yo
  text: Ẹ má ṣe nífẹ̀ẹ́ ayé tàbí àwọn ohun tí ó wà nínú ayé. Bí ẹnikẹ́ni bá nífẹ̀ẹ́ ayé, ìfẹ́ Baba kò sí nínú ẹni náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìfẹ́ Baba” lè túmọ̀ sí “ìfẹ́ sí Baba”; ó sì lè túmọ̀ sí “ìfẹ́ tí Baba ní,” bí ó tilẹ̀ jẹ́ pé èyí kò ṣeé ṣe tó bẹ́ẹ̀ nínú àyíká yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: Ẹ má ṣe nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ ìpàṣẹ̀ pẹ̀lú μή lè jẹ́ ìkìlọ̀ gbogbogbò tàbí dídènà ohun tí ń lọ lọ́wọ́; ìtumọ̀ yìí pa agbára ìpàṣẹ̀ náà mọ́ láì fi àlàyé aspect tí ó pọ̀ kún un.
- source_word: κόσμον
  choice: ayé
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún κόσμος, ó sì jẹ́ kí àyíká ọ̀rọ̀ ṣàlàyé pé ètò ènìyàn tí ó tako Ọlọ́run ni a ń tọ́ka sí, kì í ṣe gbogbo ìṣẹ̀dá.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: tàbí àwọn ohun tí ó wà nínú ayé
  rationale: Ó tẹ̀lé ìtẹ̀sí ọ̀rọ̀ Gíríìkì, ó sì jẹ́ èdè Yorùbá àdánidá fún fífi àwọn ohun inú ayé kún ohun tí a kọ̀.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Bí ẹnikẹ́ni bá nífẹ̀ẹ́
  rationale: “Ẹnikẹ́ni” pa ìtumọ̀ àìnídìí τις mọ́, ìlò bá sì bá ìpèníjà oníṣ条件 náà mu ní Yorùbá.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: ìfẹ́ ti Baba
  rationale: 'Ìtumọ̀ yìí mọ̀ọ́mọ̀ pa àìdájú genitive mọ́: ó lè túmọ̀ sí ìfẹ́ sí Baba tàbí ìfẹ́ Baba, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn púpọ̀ sí ìfẹ́ sí Baba.'
- source_word: πατρὸς
  choice: Baba
  rationale: “Baba” pa orúkọ ìbáṣepọ̀ inú ọ̀rọ̀ Johanu mọ́ láì fi “Ọlọ́run” tí kò sí ní gbólóhùn orísun kún un.
- source_word: ἐν αὐτῷ
  choice: nínú ẹni náà
  rationale: Yorùbá kò nílò àmì akọ nínú ọ̀rọ̀ arọ́pò-orúkọ yìí; “ẹni náà” fi ìtọ́kasí sí ẹnikẹ́ni náà hàn ní kedere láì dín ìwọ̀n gbogbogbò ọ̀rọ̀ kù.
theological_decisions:
- issue: Ìtumọ̀ “ayé” nínú ìlànà ìwà rere Johanu
  choice: A túmọ̀ rẹ̀ sí “ayé” láì ṣàlàyé rẹ̀ sí “ètò ayé” nínú àkọ́kọ́ ọ̀rọ̀.
  alternative: ètò ayé; ìlànà ayé tí ó tako Ọlọ́run
  rationale: Àyíká fi hàn pé ìfẹ́ tí kò tọ́ sí ètò tí ó tako Ọlọ́run ni a kọ̀, kì í ṣe ìfẹ́ sí ìṣẹ̀dá Ọlọ́run tàbí àwọn ènìyàn. Ọ̀rọ̀ tó gbòòrò pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Genitive nínú ἡ ἀγάπη τοῦ πατρὸς
  choice: A pa á mọ́ gẹ́gẹ́ bí “ìfẹ́ ti Baba.”
  alternative: ìfẹ́ sí Baba; ìfẹ́ Baba sí ènìyàn
  rationale: Àyíká ìyàtọ̀ láàárín nínífẹ̀ẹ́ ayé àti Baba mú kí “ìfẹ́ sí Baba” ṣeé ṣe jù, ṣùgbọ́n èdè Gíríìkì fúnra rẹ̀ kò yanjú genitive náà pátápátá; nítorí náà a pa àìdájú tó jẹ́ ojúlówó mọ́, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere ni a lò. A yan “Ẹ má ṣe” gẹ́gẹ́ bí ọ̀nà ọ̀wọ̀ àti ọ̀pọ̀ ènìyàn fún ìpàṣẹ̀; “ẹni náà” jẹ́ ìtọ́kasí gbogbogbò tó bá ìṣàkóso èdè Yorùbá mu. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
