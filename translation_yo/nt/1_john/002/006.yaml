id: 1JN.2.6
reference: 1 John 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: yo
  text: Ẹni tí ó bá sọ pé òun ń dúró nínú rẹ̀[a], òun fúnra rẹ̀ náà ní láti máa rìn gẹ́gẹ́ bí ẹni náà[b] ti rìn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ń gbé nínú rẹ̀.’ Ọ̀rọ̀ Gíríìkì μένω jẹ́ ọ̀rọ̀ pàtàkì nínú àwọn ìwé Jòhánù; ó lè túmọ̀ sí títẹ̀síwájú, dídúró, tàbí gbígbé nínú ìbáṣepọ̀.
    reason: lexical_alternative
  - marker: b
    text: ‘Ẹni náà’ ń tọ́ka sí Jésù, ó sì pa ìtẹnumọ́ arọ́pò-orúkọ ìtọ́kasí Gíríìkì mọ́; ọ̀pọ̀ ìtumọ̀ máa ń sọ pé ‘ó’ lásán.
    reason: alternative_reading
  - marker: c
    text: ‘Rìn’ jẹ́ àkàwé Bíbélì fún ọ̀nà tí ènìyàn ń gbà gbé ìgbésí ayé rẹ̀; ìyẹn ni pé, ẹni tí ó sọ pé ó ń dúró nínú Jésù ní láti máa gbé ìgbésí ayé bí Jésù ti gbé e.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ẹni tí ó bá sọ pé
  rationale: Gbólóhùn yìí mú iṣẹ́ participle olóropọ̀ náà jáde gẹ́gẹ́ bí ẹni àpẹẹrẹ kan, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘ẹni tí ó sọ pé.’
- source_word: ἐν αὐτῷ μένειν
  choice: òun ń dúró nínú rẹ̀
  rationale: ‘Dúró’ pa ìtumọ̀ títẹ̀síwájú, ṣíṣe àìkúrò, àti ìbáṣepọ̀ tí μένω ní nínú àwọn ìwé Jòhánù mọ́; ‘nínú rẹ̀’ sì pa ἐν αὐτῷ mọ́. ‘Òun’ jẹ́ kí ó ṣe kedere pé ẹni tó ń sọ̀rọ̀ ń sọ nípa ara rẹ̀.
- source_word: ὀφείλει
  choice: ní láti
  rationale: Nínú àyíká yìí, gbólóhùn náà fi ojúṣe ìwà rere hàn; ‘ní láti’ jẹ́ èdè Yorùbá tó ṣe kedere, láìsọ ọ́ di ọ̀rọ̀ òfin gbígbẹ.
- source_word: καθὼς
  choice: gan-an gẹ́gẹ́ bí
  rationale: 'Ó fi ìbámu tó lágbára hàn: ìgbésí ayé ẹni náà gbọ́dọ̀ bá àpẹẹrẹ Kristi mu.'
- source_word: ἐκεῖνος
  choice: ẹni náà
  rationale: ‘Ẹni náà’ pa agbára arọ́pò-orúkọ ìtọ́kasí ἐκεῖνος mọ́, dípò lílo ‘ó’ lásán; àyíká ló fi hàn pé Jésù ni a ń tọ́ka sí.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: ti rìn ... láti máa rìn
  rationale: A pa àkàwé Bíbélì ti ‘rírìn’ mọ́ fún ọ̀nà ìgbésí ayé, bákan náà ni a pa ìbámu ọ̀rọ̀ méjèèjì nínú Gíríìkì mọ́.
- source_word: καὶ αὐτὸς
  choice: pẹ̀lú
  rationale: '‘Pẹ̀lú’ mú agbára àfikún καὶ αὐτός jáde ní èdè Yorùbá àdánidá: ẹni tó ń sọ bẹ́ẹ̀ fúnra rẹ̀ náà wà lábẹ́ ojúṣe yìí.'
theological_decisions:
- issue: Ẹni tí αὐτῷ àti ἐκεῖνος ń tọ́ka sí
  choice: A lo ‘rẹ̀’ àti ‘ẹni náà,’ kí àyíká fi hàn pé Kristi/Jésù ni wọ́n ń tọ́ka sí.
  alternative: Láti fi orúkọ ‘Jésù’ tàbí ‘Kristi’ sínú ọ̀rọ̀ pàtó.
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ń tọ́ka sí Jésù, ṣùgbọ́n Gíríìkì lo arọ́pò-orúkọ, kì í ṣe orúkọ. Ìtumọ̀ náà kò gbọ́dọ̀ mú ohun tí ọ̀rọ̀ orísun fi sílẹ̀ fún àyíká ṣe kedere ju bó ṣe wà lọ.
- issue: Iye agbára ojúṣe nínú ὀφείλει
  choice: A túmọ̀ rẹ̀ sí ‘ní láti,’ gẹ́gẹ́ bí ojúṣe ìwà rere.
  alternative: ‘Ó yẹ kí,’ èyí tí ó lè dà bí ìmọ̀ràn tí kò lágbára tó.
  rationale: ὀφείλει sọ ojúṣe gidi, kì í ṣe àṣàyàn tàbí ìmọ̀ràn lásán; síbẹ̀, a kò fi èdè òfin ẹ̀sùn kún un.
- issue: Àkàwé ‘rírìn’
  choice: A pa ‘rìn’ mọ́ nínú ọ̀rọ̀ pàtó.
  alternative: Láti túmọ̀ rẹ̀ ní tààrà sí ‘gbé ìgbésí ayé.’
  rationale: Rírìn gẹ́gẹ́ bí àpẹẹrẹ ọ̀nà ìgbésí ayé jẹ́ àkàwé pàtàkì nínú Bíbélì. Àlàyé ìsàlẹ̀ ojú-ewé ń ṣàlàyé rẹ̀ láìpa àwòrán ọ̀rọ̀ orísun rẹ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn. A lo ‘òun’ gẹ́gẹ́ bí arọ́pò-orúkọ ẹni tí ọ̀rọ̀ inú gbólóhùn ń tọ́ka sí, a sì fi àmì ohùn sí ibi tí wọ́n ti jẹ́ àdánidá. A pa àkàwé ‘rìn’ àti ìtọ́kasí ‘ẹni náà’ mọ́, pẹ̀lú àlàyé ní ìsàlẹ̀ ojú-ewé.
