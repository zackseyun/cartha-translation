id: 1JN.2.21
reference: 1 John 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: yo
  text: N kò kọ̀wé sí yín[a] nítorí pé ẹ kò mọ òtítọ́, ṣùgbọ́n nítorí pé ẹ mọ̀ ọ́, àti nítorí pé kò sí irọ́ kankan tí ó wá láti inú òtítọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ ní ọ̀nà tí ó tẹ̀lé Gíríìkì pẹkipẹki pé, “N kò kọ̀wé sí yín.” Aorist Gíríìkì lè tọ́ka sí ohun tí ó ṣẹlẹ̀ ní ìgbà tí ó kọjá lásán, ṣùgbọ́n nínú àyíká lẹ́tà ó tún lè tọ́ka sí ohun tí onkọ̀wé ti kọ sínú lẹ́tà tí àwọn olùgbà ń kà báyìí.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ìtumọ̀ tó tẹ̀lé ìṣètò Gíríìkì pẹkipẹki: “Gbogbo irọ́ kì í wá láti inú òtítọ́.”'
    reason: formal_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: kọ̀wé
  rationale: Ọ̀rọ̀ Gíríìkì náà wà ní aorist. “Kọ̀wé” lè tọ́ka sí ohun tí onkọ̀wé ti kọ sínú lẹ́tà tí àwọn olùgbà ń kà báyìí, láìfi ìtumọ̀ tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: οἴδατε
  choice: ẹ mọ̀
  rationale: Èyí túmọ̀ sí “mọ̀.” Àtúnṣe gbolohun náà—“ẹ kò mọ … bí kò ṣe … ẹ mọ̀”—mú ìtakora àti ìtẹnumọ́ inú Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: ἡ ἀλήθεια
  choice: òtítọ́
  rationale: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “òtítọ́,” láìdín ìtumọ̀ rẹ̀ kù sí “ìhìn rere” tàbí ẹ̀kọ́ pàtó kan tí ẹsẹ̀ náà kò sọ ní tààrà.
- source_word: πᾶν ψεῦδος
  choice: kò sí irọ́ kankan
  rationale: Bó tilẹ̀ jẹ́ pé ìṣètò Gíríìkì sún mọ́ “gbogbo irọ́ … kì í ṣe,” àkópọ̀ “kò sí irọ́ kankan” ni Yorùbá àdánidá fún ìsẹ́-ni-lódì gbogbo rẹ̀.
- source_word: ἐκ τῆς ἀληθείας
  choice: tí ó ti inú òtítọ́ wá
  rationale: ἐκ fi orísun tàbí ìpilẹ̀ṣẹ̀ hàn; “ti inú … wá” sọ ìbáṣepọ̀ orísun náà ní kedere àti ní Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ “òtítọ́” nínú ọ̀rọ̀ Johanu
  choice: òtítọ́
  alternative: ìhìn òtítọ́; òtítọ́ ìhìn rere
  rationale: Ọ̀rọ̀ Johanu lè ní ìjìnlẹ̀ ẹ̀kọ́ nípa Ọlọ́run, ṣùgbọ́n ẹsẹ̀ yìí kò fi àlàyé tóóró kún un. Ìtumọ̀ náà pa ìfẹ̀ rẹ̀ mọ́ láìfi ẹ̀kọ́ ẹgbẹ́ kan wọ inú rẹ̀.
- issue: Ìbáṣepọ̀ irọ́ pẹ̀lú òtítọ́
  choice: kò sí irọ́ kankan tí ó ti inú òtítọ́ wá
  alternative: gbogbo irọ́ kì í ṣe ti òtítọ́
  rationale: Àṣàyàn náà pa ìtumọ̀ ἐκ gẹ́gẹ́ bí orísun mọ́, kò sì yí gbólóhùn náà padà sí ìsọ̀rọ̀ metaphysical tó gbòòrò ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìtumọ̀ kedere fún olùkà òde òní. A lo “ẹ/yín” fún ọ̀pọ̀ ènìyàn, a sì pa ìtakora gbolohun Gíríìkì àti èrò orísun inú ἐκ mọ́.
