id: 1JN.2.28
reference: 1 John 2:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: yo
  text: Nísinsìnyí náà, ẹ̀yin ọmọ mi, ẹ máa dúró nínú rẹ̀, kí, bí a bá fi í hàn[a], a lè ní ìgboyà, kí a má sì fà sẹ́yìn kúrò lọ́dọ̀ rẹ̀ nítorí ìtìjú[b] ní ìgbà wíwá rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “bí ó bá farahàn.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ohùn àìṣe: “bí a bá fi í hàn” tàbí “bí a bá jẹ́ kí ó farahàn.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ojú má sì tì wá níwájú rẹ̀.” A tún lè lóye gbólóhùn náà gẹ́gẹ́ bí ìtìjú ní iwájú rẹ̀, láìtẹnumọ́ fífà sẹ́yìn kúrò lọ́dọ̀ rẹ̀.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ní ìgbà ìwàníhìn-ín rẹ̀.” Nínú àyíká yìí, “wíwá” ń fi ìtumọ̀ παρουσία, ìyẹn wíwá Kristi ní ọjọ́ iwájú, hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: ẹ̀yin ọmọ mi
  rationale: Ọ̀rọ̀ ìpè onífẹ̀ẹ́ ti olùtọ́jú ni. ‘Ẹ̀yin ọmọ mi’ jẹ́ èdè Yorùbá àdánidá tí ó fi ìbáṣepọ̀ ìdílé àti ìfẹ́ hàn; títúmọ̀ rẹ̀ ní tààrà sí ‘àwọn ọmọ kéékèèké’ lè dà bí ẹni pé ọjọ́ orí wọn ni a ń sọ.
- source_word: μένετε
  choice: ẹ máa dúró
  rationale: Ó pa ìtumọ̀ ìtẹ̀síwájú àti ìfaradà mọ́, ó sì bá àsọyé Johanu pé kí ènìyàn ‘dúró nínú’ ẹnì kan mu.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa àwòrán ìbáṣepọ̀ inú Kristi mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: φανερωθῇ
  choice: bí a bá fi í hàn
  rationale: 'Ìtumọ̀ yìí pa ohùn àìṣe Gíríìkì mọ́: a fi í hàn tàbí a sọ ọ́ di mímọ̀, dípò lílo ‘ó bá farahàn’ nìkan.'
- source_word: σχῶμεν παρρησίαν
  choice: àwa yóò ní ìgboyà
  rationale: ‘Ìgboyà’ sọ òmìnira ọkàn àti ìdánilójú láti dúró níwájú rẹ̀ nígbà ìfarahàn rẹ̀, láìfi ìtumọ̀ ìjà tàbí ìpèníjà kún un.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: ìtìjú kò sì ní mú wa fà sẹ́yìn kúrò lọ́dọ̀ rẹ̀
  rationale: Ó mú ìtìjú àti agbára ἀπό, ‘kúrò lọ́dọ̀,’ jọ. Ó fi ewu fífà sẹ́yìn nítorí ìtìjú hàn, ṣùgbọ́n kò sọ ọ́ di ìdálẹ́bi ìkẹyìn.
- source_word: παρουσίᾳ
  choice: ní ìgbà wíwá rẹ̀
  rationale: Nínú àyíká ẹ̀kọ́ nípa ọjọ́ iwájú yìí, παρουσία tọ́ka sí wíwá Kristi. ‘Wíwá rẹ̀’ jẹ́ èdè Yorùbá tí ó ṣe kedere, ó sì tún jẹ́ kí ìtumọ̀ ìwàníhìn-ín tí ọ̀rọ̀ náà lè ní wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ẹni tí àwọn arọ́pò-orúkọ ń tọ́ka sí àti ìfarahàn ọjọ́ iwájú
  choice: Àwọn arọ́pò-orúkọ ń tọ́ka sí Ọmọ náà, Jésù Kristi, ẹsẹ náà sì ń sọ nípa fífi í hàn àti wíwá rẹ̀ ní ọjọ́ iwájú.
  alternative: Kí a ka wọn sí ìtọ́ka gbogbogbò sí Ọlọ́run láìsọ pé Ọmọ náà ni pàtó.
  rationale: Àyíká tó sún mọ́ ẹsẹ yìí ń sọ nípa dídúró nínú Ọmọ àti ìfarahàn rẹ̀. Síbẹ̀, a kò fi orúkọ ‘Kristi’ sínú ọ̀rọ̀ ẹsẹ níbi tí Gíríìkì ti lo arọ́pò-orúkọ nìkan.
- issue: Ìtumọ̀ gbólóhùn ìtìjú nígbà wíwá rẹ̀
  choice: Ìtìjú lè mú kí àwọn onígbàgbọ́ fà sẹ́yìn kúrò lọ́dọ̀ rẹ̀ nígbà wíwá rẹ̀.
  alternative: Kí ojú tì wọ́n níwájú rẹ̀, láìfi èrò fífà sẹ́yìn hàn.
  rationale: Àpapọ̀ αἰσχυνθῶμεν àti ἀπ’ αὐτοῦ ṣe àtìlẹ́yìn fún ìtumọ̀ fífà sẹ́yìn nítorí ìtìjú, ṣùgbọ́n ìtumọ̀ ‘ojú tì wá níwájú rẹ̀’ ṣì ṣeé ṣe, a sì tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. ‘Ẹ máa dúró nínú rẹ̀’ pa àsọyé pàtàkì Johanu mọ́; ‘ẹ̀yin ọmọ mi’ sì jẹ́ ìpè onífẹ̀ẹ́ tí ó jẹ́ àdánidá ju ‘ẹ̀yin ọmọ kéékèèké’ lọ. Àwọn àmì ohùn ni a lò níbi tí wọ́n ti jẹ́ àdánidá.
