id: 1JN.5.15
reference: 1 John 5:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: yo
  text: Bí a sì mọ̀ pé ó ń gbọ́ wa nípa ohunkóhun tí a bá béèrè,[a] a mọ̀ pé a ní àwọn ohun tí a ti béèrè lọ́wọ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ohunkóhun tí a lè béèrè.’ Ìṣètò ọ̀rọ̀ Gíríìkì ń tọ́ka sí ohunkóhun láì fi ohun pàtó kan mọ́ ọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: ó ń gbọ́ wa
  rationale: Èyí túmọ̀ sí pé ó gbọ́ àdúrà wa, láì sọ ọ́ di ‘ó dá wa lóhùn,’ èyí tí yóò fi ìtumọ̀ tí ó lágbára ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: nípa ohunkóhun tí a bá béèrè
  rationale: 'Ọ̀rọ̀ arọ́pò orúkọ pọ̀ mọ́ ἐάν ń fi ohun tí kò ní ààlà pàtó hàn: ‘ohunkóhun tí a bá béèrè,’ kì í ṣe ‘nígbàkigbà tí a bá béèrè.’ ‘Nípa’ mú ìbáṣepọ̀ rẹ̀ pẹ̀lú ‘ó ń gbọ́ wa’ ṣe kedere ní Yorùbá.'
- source_word: αἰτώμεθα
  choice: tí a bá béèrè
  rationale: ‘Béèrè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún bíbéèrè ohun kan nínú àdúrà; ‘bá’ tún ṣàfihàn ìtumọ̀ tí kò dá ohun kan pàtó.
- source_word: ἔχομεν
  choice: a ní
  rationale: Èyí pa ìṣe àsìkò ìsinsìnyí ‘ní’ mọ́; a kò túmọ̀ rẹ̀ sí ‘a ó rí gbà,’ nítorí ìyẹn yóò jẹ́ àlàyé tí ọ̀rọ̀ náà kò sọ ní tààrà.
- source_word: τὰ αἰτήματα
  choice: àwọn ohun
  rationale: Nínú àkópọ̀ ‘àwọn ohun tí a ti béèrè,’ èyí ń tọ́ka sí àwọn ohun tí a béèrè fún lọ́nà Yorùbá tó ṣe déédé, dípò gbólóhùn líle bí ‘àwọn ìbéèrè.’
- source_word: ἃ ᾐτήκαμεν
  choice: tí a ti béèrè
  rationale: ‘Ti béèrè’ pa ìṣe tó ti ṣẹlẹ̀ ṣùgbọ́n tó ṣì ní ipa nísinsìnyí mọ́, ní ìbámu pẹ̀lú perfect Gíríìkì.
- source_word: ἀπ’ αὐτοῦ
  choice: lọ́wọ́ rẹ̀
  rationale: ‘Béèrè lọ́wọ́ rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi orísun tàbí ẹni tí a tọ̀ sí hàn.
- source_word: οἴδαμεν
  choice: a mọ̀
  rationale: Èyí pa àsọtúnsọ ọ̀rọ̀ pàtàkì Johanu nípa ìmọ̀ àti ìdánilójú mọ́ láì fi àlàyé míì kún un.
theological_decisions:
- issue: Bóyá ἀκούει túmọ̀ sí pé Ọlọ́run kàn ń gbọ́, tàbí pé ó dá àdúrà lóhùn.
  choice: ó ń gbọ́ wa
  alternative: ó ń dá wa lóhùn
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ó ń gbọ́ wa, lẹ́yìn náà ó fi èyí ṣe ìpìlẹ̀ fún mímọ̀ pé a ní ohun tí a béèrè. ‘Ó ń dá wa lóhùn’ yóò da àwọn ìgbésẹ̀ méjèèjì pọ̀, yóò sì yanjú ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà fúnra rẹ̀ fi sílẹ̀.
translation_notes:
  register: Èdè Yorùbá àkókò yìí ni a lò, pẹ̀lú ohùn tó níyì tí ó sì rọrùn fún gbogbo ènìyàn. A pa àsọtúnsọ ‘a mọ̀’ àti ìyàtọ̀ láàárín ‘gbọ́’ àti ‘dá lóhùn’ mọ́. A tún yan ‘ohunkóhun’ dípò ‘nígbàkigbà,’ nítorí ὃ ἐὰν ń tọ́ka sí ohun tí a béèrè, kì í ṣe àkókò bíbéèrè.
