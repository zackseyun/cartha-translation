  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: ó pa ìlànà ‘bí a bá mọ̀ … a mọ̀’ mọ́, ó túmọ̀ ἀκούει sí ‘ó ń gbọ́ wa’ láì sọ ọ́ di ìdáhùn àdúrà, ó sì fi ìtumọ̀ ohun-gbogbo-hun ti ὃ ἐὰν αἰτώμεθα hàn ní ‘nípa ohunkóhun tí a bá béèrè.’ ‘A ní àwọn ohun tí a ti béèrè lọ́wọ́ rẹ̀’ ń pa ἔχομεν, αἰτήματα, perfect ᾐτήκαμεν, àti ἀπ’ αὐτοῦ mọ́ ní èdè Yorùbá.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá Standard tó rọrùn, tó ní ìwọ̀ntúnwọ̀nsì ìjọsìn, tí ó sì ní àmì ohùn yẹ. ‘Béèrè lọ́wọ́ rẹ̀’ jẹ́ ìlò àdánidá fún ìbéèrè sí Ọlọ́run; ‘àwọn ohun tí a ti béèrè’ sì yẹra fún lílo ‘àwọn ìbéèrè’ tí ó lè dun bí ohun tí a sọ dípò ohun tí a ń béèrè fún.
