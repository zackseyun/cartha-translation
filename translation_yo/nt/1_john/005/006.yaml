id: 1JN.5.6
reference: 1 John 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: yo
  text: Èyí ni ẹni tí ó wá nípasẹ̀ omi àti ẹ̀jẹ̀[a]—Jésù Mèsáyà[b]; kì í ṣe nípasẹ̀ omi nìkan, ṣùgbọ́n nípasẹ̀ omi àti nípasẹ̀ ẹ̀jẹ̀. Ẹ̀mí sì ni ẹni tí ń jẹ́rìí, nítorí[c] Ẹ̀mí ni òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ ọ́ sí “pẹ̀lú omi àti ẹ̀jẹ̀.” Àwọn olùṣàlàyé kò fohùn ṣọ̀kan lórí gbólóhùn yìí: àwọn kan rí i gẹ́gẹ́ bí ìrìbọmi àti ikú Jésù, àwọn mìíràn bí ìbí àti ikú rẹ̀, àwọn mìíràn sì rí àwòrán sákrámẹ́ǹtì nínú rẹ̀. Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì mọ́ láì yan ọ̀kan nínú wọn.'
    reason: alternative_reading
  - marker: b
    text: 'Gíríìkì: “Jésù Kristi.” A lo “Jésù Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: lexical_alternative
  - marker: c
    text: Ó tún ṣeé túmọ̀ sí “pé Ẹ̀mí ni òtítọ́.” Ọ̀rọ̀ ìsopọ̀ Gíríìkì lè fi ohun tí ẹ̀rí náà sọ hàn tàbí kí ó sọ ìdí; “nítorí” bá ìṣàn ọ̀rọ̀ mu dáadáa níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: Èyí ni ẹni tí ó wá
  rationale: Ó pa agbára ìdánimọ̀ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí Jésù gẹ́gẹ́ bí ẹni tí a ń sọ̀rọ̀ rẹ̀.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: nípasẹ̀ omi àti ẹ̀jẹ̀
  rationale: “Nípasẹ̀” lè sọ ọ̀nà tàbí ohun tí ó bá ìṣẹ̀lẹ̀ náà lọ; a kò fi ìtumọ̀ kan pàtó bí ìbatisí, ìbí, ikú, tàbí ààmì sákrámẹ́ǹtì kún un.
- source_word: Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  rationale: Χριστός ní agbára oyè níbí; “Mèsáyà” mú oyè náà hàn dípò kí ó dà bí orúkọ ìdílé.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: kì í ṣe nípasẹ̀ omi nìkan, ṣùgbọ́n nípasẹ̀ omi àti nípasẹ̀ ẹ̀jẹ̀
  rationale: Àtúnlò “nípasẹ̀” pa ìtẹnumọ́ àti ìyàtọ̀ láàárín omi nìkan àti omi pẹ̀lú ẹ̀jẹ̀ mọ́ ní Yorùbá tó ṣe kedere.
- source_word: τὸ πνεῦμά
  choice: Ẹ̀mí
  rationale: Àyíká ẹ̀rí Ọlọ́run nínú 1 Jòhánù tọ́ka sí Ẹ̀mí Mímọ́; lílo lẹ́tà ńlá fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: τὸ μαρτυροῦν
  choice: ẹni tí ń jẹ́rìí
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ nínú participle àsìkò ìsinsìnyí mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe déédéé.
- source_word: ὅτι
  choice: nítorí
  rationale: 'A mú un gẹ́gẹ́ bí ìsopọ̀ tó ń sọ ìdí: Ẹ̀mí ń jẹ́rìí nítorí Ẹ̀mí ni òtítọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì “pé” hàn.'
- source_word: ἡ ἀλήθεια
  choice: òtítọ́
  rationale: Gbólóhùn “Ẹ̀mí ni òtítọ́” pa ìdánimọ̀ tó lágbára nínú Gíríìkì mọ́, kì í ṣe pé Ẹ̀mí kàn jẹ́ olóòótọ́.
theological_decisions:
- issue: Ohun tí “Ẹ̀mí” ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí kan lápapọ̀ tàbí ẹ̀mí ènìyàn
  rationale: Àyíká ẹ̀rí ti Ọlọ́run àti bí Jòhánù ṣe máa ń lo ọ̀rọ̀ náà ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́, láìfi àfikún ẹ̀kọ́ ìsìn sínú ẹsẹ náà.
- issue: Ìtumọ̀ “omi àti ẹ̀jẹ̀”
  choice: A pa gbólóhùn náà mọ́ láìyan ìtumọ̀ kan pàtó
  alternative: ìbatisí àti ikú Jésù; ìbí àti ikú rẹ̀; tàbí àwòrán sákrámẹ́ǹtì
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò ṣàlàyé àwọn ohun méjèèjì; ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú àti ìfàṣẹ̀yàn ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àfikún orúkọ yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú iṣẹ́ oyè náà hàn kedere.
- issue: Ìṣe ὅτι
  choice: “nítorí” gẹ́gẹ́ bí ìdí
  alternative: “pé” gẹ́gẹ́ bí ohun tí ẹ̀rí náà sọ
  rationale: Ìtumọ̀ ìdí bá ìṣàn gbólóhùn náà mu dáadáa, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn gírámà kejì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, àti èyí tí òǹkàwé òde òní lè lóye; a pa àtúnlò inú Gíríìkì mọ́ níbi tí ó ń fi ìtẹnumọ́ hàn.
