id: 1JN.5.12
reference: 1 John 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: yo
  text: Ẹni tí ó ní Ọmọ náà ní ìyè[a]; ẹni tí kò ní Ọmọ Ọlọ́run kò ní ìyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìyè àìnípẹ̀kun”; nínú ìlò Jòhánù, “ìyè” níbí ń tọ́ka sí ìyè tí a rí nínú Ọmọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ẹni tí ó bá ní
  rationale: Àpólà oníṣe tó ní áríkà yìí ń tọ́ka sí ẹnikẹ́ni tí ìní Ọmọ náà jẹ́ àmì ìdánimọ̀ rẹ̀. “Ẹni tí ó bá ní” jẹ́ Yorùbá àdánidá, ó sì pa agbára gbólóhùn aṣojú ẹnìkan mọ́.
- source_word: τὸν υἱόν
  choice: Ọmọ náà
  rationale: Gbólóhùn àkọ́kọ́ sọ “Ọmọ” nìkan. “Náà” fi hàn pé Ọmọ tí a ti mọ̀ ni, láìfi “Ọlọ́run” kún ibi tí Gíríìkì kò ti ní í.
- source_word: ἔχει
  choice: ní
  rationale: “Ní” ni ìtumọ̀ tààrà àti àdánidá fún ἔχω níbí; ó tún lè gbé ìtumọ̀ ìbáṣepọ̀ àti ìpínní tí ọ̀rọ̀ Johanu ní láìṣe àlàyé lé e lórí.
- source_word: τὴν ζωήν
  choice: ìyè
  rationale: “Ìyè” pa ọ̀rọ̀ Gíríìkì ζωή mọ́ láìfẹ̀ sí i sí “ìyè àìnípẹ̀kun,” bó tilẹ̀ jẹ́ pé àyíká Johanu ń fún un ní ìtumọ̀ jinlẹ̀ yẹn.
- source_word: ὁ μὴ ἔχων
  choice: ẹni tí kò bá ní
  rationale: Ìtumọ̀ yìí bá ìlà àkọ́kọ́ dọ́gba, ó sì sọ ìtakora náà ní Yorùbá òde òní tó ṣe kedere.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Èyí pa orúkọ oyè Kírísítì tó pé ní abala kejì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìbáṣepọ̀ genitive náà.
- source_word: οὐκ ἔχει
  choice: kò ní
  rationale: “Kò ní” jẹ́ ìkọ̀sílẹ̀ ọ̀rọ̀-ìṣe tó ṣe àdánidá, ó sì pa ìbádọ́gba pẹ̀lú “ní” nínú abala àkọ́kọ́ mọ́.
theological_decisions:
- issue: Ìtumọ̀ “ìyè” nínú àyíká àwọn ìwé Johanu
  choice: Lo “ìyè” nínú ọ̀rọ̀ pàtàkì, kí akọsilẹ̀ ṣàlàyé pé ó lè túmọ̀ sí “ìyè àìnípẹ̀kun.”
  alternative: ìyè àìnípẹ̀kun
  rationale: Ẹsẹ̀ Gíríìkì sọ ζωή, kì í ṣe gbolohun náà ζωὴ αἰώνιος. “Ìyè” pa ọ̀rọ̀ orísun àti ìwúwo ẹ̀kọ́ rẹ̀ mọ́, nígbà tí àyíká fi hàn pé ìyè inú Ọmọ ni.
- issue: Àpólà oníṣe akọ ẹyọkan tí ń dúró fún gbogbo ènìyàn
  choice: Ẹni tí ó bá ní / ẹni tí kò bá ní
  alternative: Ọkùnrin tí ó ní / ó ní
  rationale: Akọ ẹyọkan nínú Gíríìkì jẹ́ aṣojú gbogbo ènìyàn, kì í ṣe ìtọ́kasí sí ọkùnrin nìkan. “Ẹni tí...” sọ ète náà péye láìyí i padà sí ọ̀pọ̀ ènìyàn.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún níbi tó yẹ; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé lásán. A pa ìbádọ́gba àti ìtakora àwọn abala méjèèjì mọ́.
