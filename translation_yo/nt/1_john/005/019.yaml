  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: yo
  text: Àwa mọ̀ pé láti ọ̀dọ̀ Ọlọ́run ni àwa jẹ́, àti pé gbogbo ayé wà lábẹ́ agbára ẹni búburú náà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki: “gbogbo ayé sì wà nínú ẹni búburú náà.”'
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lè lóye “ẹni búburú náà” sí “ibi”; ṣùgbọ́n nínú lílo ọ̀rọ̀ Johanu, ìtumọ̀ ẹni ibi kan ṣeé ṣe jù lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: Àwa mọ̀
  rationale: Ó sọ ìmọ̀ tí ó dáni lójú ní ọ̀nà àdánidá, ó sì pa ohùn ìdánilójú lẹ́tà náà mọ́.
- source_word: ἐκ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run ni àwa ti wá
  rationale: Ó fi orísun tàbí jíjẹ́ ti Ọlọ́run hàn láìfi ọ̀rọ̀ pàtó nípa àtúnbí kún ẹsẹ náà.
- source_word: ὁ κόσμος ὅλος
  choice: gbogbo ayé
  rationale: Ó pa ìtẹnumọ́ ὅλος mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún gbogbo ètò ayé tí ó tako Ọlọ́run.
- source_word: ἐν τῷ πονηρῷ
  choice: lábẹ́ agbára ẹni ibi náà
  rationale: Ní àyíká àwọn ìwé Johanu, τῷ πονηρῷ ṣeé ṣe jù lọ láti tọ́ka sí ẹni ibi kan; ‘lábẹ́ agbára’ mú ipò ìṣàkóso tí gbólóhùn náà ń sọ jáde ní Yorùbá àdánidá.
- source_word: κεῖται
  choice: wà
  rationale: Níhìn-ín κεῖται ń ṣàpèjúwe ipò tí ohun kan wà; ‘wà’ jẹ́ Yorùbá àdánidá, nígbà tí ‘lábẹ́ agbára’ ń mú ìtumọ̀ àyíká rẹ̀ hàn.
theological_decisions:
- issue: Bóyá τῷ πονηρῷ túmọ̀ sí ibi gẹ́gẹ́ bí agbára àìní-ẹni tàbí ẹni ibi kan
  choice: ẹni ibi náà
  alternative: ibi
  rationale: Lílo ọ̀rọ̀ náà nínú àwọn ìwé Johanu àti àpilẹ̀kọ Gíríìkì rẹ̀ ṣètìlẹ́yìn fún ẹni ibi kan, ṣùgbọ́n a tọ́ka sí ìtumọ̀ kejì nínú àlàyé ìsàlẹ̀.
- issue: Bí a ṣe máa sọ ἐν τῷ πονηρῷ
  choice: lábẹ́ agbára ẹni ibi náà
  alternative: wà nínú ẹni ibi náà
  rationale: Àṣàyàn pàtàkì jẹ́ Yorùbá tí ó ṣe kedere, tí ó sì mú ìṣàkóso tàbí ìdarí hàn; àṣàyàn gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì gan-an ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìkọ̀wé náà yàgò fún èdè ẹ̀sìn àkànṣe, ó sì fi àṣàyàn gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì àti àìdánilójú kékeré rẹ̀ sínú àwọn àlàyé ìsàlẹ̀.
