  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò, pàápàá ní fífi ‘ikú’ sílẹ̀ láì sọ irú ikú tí a túmọ̀ sí, àti ní mímú Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ń fúnni ní ìyè. Síbẹ̀, ‘Ẹ̀ṣẹ̀ kan wà’ lè sọ ẹ̀ṣẹ̀ náà di ìṣẹ̀lẹ̀ kan pàtó ju ìkọ́ Gíríìkì anarthrous lọ, àti ‘nípa irú èyí’ ń yí ìtọ́kasí sí ẹ̀ṣẹ̀ náà padà sí ìsọ̀rí tàbí àpẹẹrẹ.
  naturalness: ‘Ń dá ẹ̀ṣẹ̀’ lóye, ṣùgbọ́n ‘ń ṣe ẹ̀ṣẹ̀’ jẹ́ ọ̀nà Yorùbá òde òní tí ó wọ́pọ̀, tí ó sì rọrùn. Ìpín ‘èyí ni fún àwọn ...’ kò rọrùn gẹ́gẹ́ bí àlàyé lẹ́yìn ‘fún un ní ìyè’; a tún un ṣe kí ìbáṣepọ̀ ẹni ẹyọ àti ọ̀pọ̀ tí Gíríìkì ní hàn ní kedere.
  terminology: ‘Arákùnrin,’ ‘ìyè,’ ‘ikú,’ ‘Ọlọ́run,’ àti ‘béèrè’ bójú mu, wọ́n sì pa ìforígbárí ìtumọ̀ orísun mọ́. A pa ‘arákùnrin’ mọ́ nítorí akọ ẹyọ ni ἀδελφός nínú ọ̀rọ̀ náà.
