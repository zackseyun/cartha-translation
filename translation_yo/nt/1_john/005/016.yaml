    rationale: Ìsọ̀rọ̀ náà kò rọrùn ní Yorùbá, ó sì lè ṣokùnfà àìmọ ẹni tí ‘èyí’ ń tọ́ka sí. Àtúnṣe náà fi ìtumọ̀ appositional dative náà hàn ní kedere.
