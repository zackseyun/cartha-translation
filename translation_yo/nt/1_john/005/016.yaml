id: 1JN.5.16
reference: 1 John 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá rí arákùnrin rẹ̀ tí ń ṣe ẹ̀ṣẹ̀ tí kò yọrí sí ikú[a], kí ó béèrè, Ọlọ́run yóò sì fún ẹni náà ní ìyè—fún àwọn tí ń ṣe ẹ̀ṣẹ̀ tí kò yọrí sí ikú. Ẹ̀ṣẹ̀ wà tí ó yọrí sí ikú; èmi kò sọ pé kí ó béèrè nípa ẹ̀ṣẹ̀ náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì kò sọ bóyá ‘ikú’ níbí jẹ́ ikú ara, ikú ẹ̀mí, tàbí ìdálẹ́bi ìkẹyìn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφὸν
  choice: arákùnrin rẹ̀
  rationale: Ó pa ẹyọ akọ inú Gíríìkì mọ́; nínú àyíká lẹ́tà náà, ó ṣeé ṣe kí ó túmọ̀ sí arákùnrin nínú ìgbàgbọ́.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: tí ó ń dá ẹ̀ṣẹ̀
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ gbòǹgbò kan náà, ó sì fi ìṣe ẹ̀ṣẹ̀ hàn.
- source_word: μὴ πρὸς θάνατον
  choice: tí kò yọrí sí ikú
  rationale: ‘Yọrí sí’ fi ìtọ́sọ́nà tàbí àbájáde πρός hàn láì pinnu bóyá ikú ara, ikú ẹ̀mí, tàbí ìdálẹ́bi ìkẹyìn ni.
- source_word: αἰτήσει
  choice: kí ó béèrè
  rationale: Ọ̀nà yìí fi agbára ìtọ́ni ti ọ̀rọ̀-ìṣe ọjọ́ iwájú hàn ní Yorùbá àdánidá; àyíká fi hàn pé ìbéèrè sí Ọlọ́run ni.
- source_word: δώσει αὐτῷ ζωήν
  choice: Ọlọ́run yóò sì fún un ní ìyè
  rationale: Gíríìkì kò sọ olùṣe náà ní tààrà, ṣùgbọ́n àyíká àdúrà tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùfúnni ní ìyè.
- source_word: ζωήν
  choice: ìyè
  rationale: Ó pa ọ̀rọ̀ gbooro náà mọ́ láì dín in kù sí ‘ìyè ẹ̀mí’ tàbí ‘ìyè àìnípẹ̀kun.’
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: èyí ni fún àwọn tí ń dá ẹ̀ṣẹ̀ tí kò yọrí sí ikú
  rationale: Ó mú ọ̀pọ̀ dative participle náà jáde gẹ́gẹ́ bí àlàyé, láì fi ìtumọ̀ tí kò dájú kún un.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: Ẹ̀ṣẹ̀ kan wà tí ó yọrí sí ikú
  rationale: ‘Kan’ jẹ́ kí gbólóhùn Yorùbá ṣe kedere, ṣùgbọ́n kò sọ pé ẹ̀ṣẹ̀ pàtó kan ṣoṣo ni; ó lè tọ́ka sí irú ẹ̀ṣẹ̀ kan.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: èmi kò sọ pé kí ó béèrè nípa irú èyí
  rationale: Ó pa ìyàtọ̀ ọ̀rọ̀-ìṣe Gíríìkì mọ́ ní ìwọ̀n tí Yorùbá àdánidá gbà, ó sì tú περὶ ἐκείνης sí ‘nípa irú èyí.’
theological_decisions:
- issue: Ìtumọ̀ ‘ikú’ nínú ẹ̀ṣẹ̀ tí ó yọrí sí ikú
  choice: Fi ‘ikú’ sílẹ̀ láì ṣàlàyé irú ikú náà nínú ọ̀rọ̀ pàtàkì.
  alternative: Ikú ara gẹ́gẹ́ bí ìdájọ́ Ọlọ́run; ikú ẹ̀mí tàbí ayérayé; ìdálẹ́bi ní òpin.
  rationale: Ẹsẹ náà kò ṣàlàyé irú ikú tí ó ní lọ́kàn, nítorí náà a pa àìdájú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Ẹni tí yóò fún un ní ìyè
  choice: Ṣe ‘Ọlọ́run’ ní olùṣe tí a sọ ní gbangba.
  alternative: Fi sí ‘yóò fún un ní ìyè’ láì sọ olùṣe; tàbí ka ẹni tí ń gbàdúrà sí olùṣe.
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì fi olùṣe sílẹ̀ láì sọ, àyíká ìbéèrè nínú àdúrà fi agbára tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùfúnni.
- issue: Bóyá òǹkọ̀wé ń fòfin de àdúrà fún ẹ̀ṣẹ̀ tí ó yọrí sí ikú
  choice: ‘Èmi kò sọ pé kí ó béèrè’—kò ṣe é ní òfin ìdènà gbangba.
  alternative: ‘Èmi sọ pé kí ó má ṣe béèrè.’
  rationale: οὐ ... λέγω ἵνα jẹ́ ìkọ̀ láti fúnni ní ìtọ́ni rere yẹn, kì í ṣe dandan pé ó jẹ́ àṣẹ gbangba láti má ṣe gbàdúrà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘arákùnrin’ láti pa ẹyọ akọ orísun mọ́, nígbà tí àyíká lè ní gbogbo onígbàgbọ́ ẹlẹgbẹ́ lọ́kàn.
