- from: Bí ẹnikẹ́ni bá rí arákùnrin rẹ̀ tí ó ń dá ẹ̀ṣẹ̀ tí kò yọrí sí ikú[a], kí ó béèrè, Ọlọ́run yóò sì fún un ní ìyè—èyí ni fún àwọn tí ń dá ẹ̀ṣẹ̀ tí kò yọrí sí ikú. Ẹ̀ṣẹ̀ kan wà tí ó yọrí sí ikú; èmi kò sọ pé kí ó béèrè nípa irú èyí.
  to: Bí ẹnikẹ́ni bá rí arákùnrin rẹ̀ tí ń ṣe ẹ̀ṣẹ̀ tí kò yọrí sí ikú[a], kí ó béèrè, Ọlọ́run yóò sì fún ẹni náà ní ìyè—fún àwọn tí ń ṣe ẹ̀ṣẹ̀ tí kò yọrí sí ikú. Ẹ̀ṣẹ̀ wà tí ó yọrí sí ikú; èmi kò sọ pé kí ó béèrè nípa ẹ̀ṣẹ̀ náà.
  rationale: Àtúnṣe náà mú àwọn ìtọ́kasí Gíríìkì sun mọ́ ọn, mú ìsọ̀rọ̀ Yorùbá rọrùn, ó sì pa àìdájú ẹsẹ̀ náà mọ́. A kò sọ irú ‘ikú’ náà di pàtó, a kò sì yí ọ̀rọ̀ òǹkọ̀wé padà sí ìfòfin-dè àdúrà.
