language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: yo
  text: 'Èyí sì ni ìgbẹ́kẹ̀lé[a] tí a ní níwájú rẹ̀: pé bí a bá béèrè ohunkóhun ní ìbámu pẹ̀lú ìfẹ́ rẹ̀, ó ń gbọ́ wa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgboyà” tàbí “ìdánilójú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: ìgbẹ́kẹ̀lé
  rationale: Ọ̀rọ̀ yìí sọ nípa ìgbẹ́kẹ̀lé àti òmìnira ọkàn tí àwọn onígbàgbọ́ ní níwájú Ọlọ́run; “ìgbẹ́kẹ̀lé” jẹ́ èdè Yorùbá àdánidá tí ó bá àyíká àdúrà mu.
- source_word: πρὸς αὐτόν
  choice: níwájú rẹ̀
  rationale: Ó fi ìbáṣepọ̀ àti wíwà ní iwájú Ọlọ́run hàn ní ọ̀nà tí ó bá èdè Yorùbá mu, dípò ìtumọ̀ líle bí “sí ọ̀dọ̀ rẹ̀.”
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ὅτι ń ṣàlàyé ohun tí ìgbẹ́kẹ̀lé náà dá lé, kì í ṣe okùnfà rẹ̀.
- source_word: ἐάν τι αἰτώμεθα
  choice: bí a bá béèrè ohunkóhun
  rationale: Ó pa ìtumọ̀ àídájú gbogbogbò àti àyè gbígbòòrò τι mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣàn déédéé.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: ní ìbámu pẹ̀lú ìfẹ́ rẹ̀
  rationale: Ó sọ pé ohun tí a béèrè gbọ́dọ̀ bá ohun tí Ọlọ́run fẹ́ mu, láì sọ θέλημα di ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀκούει ἡμῶν
  choice: ó ń gbọ́ tiwa
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run ń tẹ́tí sí àdúrà wa, láì túmọ̀ ọ́ sí pé ó ti fi gbogbo ohun tí a béèrè fún wa.
theological_decisions:
- issue: Ìtumọ̀ gbígbọ́ Ọlọ́run nínú àdúrà
  choice: ó ń gbọ́ tiwa
  alternative: ó ń dá wa lóhùn; ó ń fún wa ní ohun tí a béèrè
  rationale: Ẹsẹ̀ náà sọ pé Ọlọ́run ń gbọ́ tàbí ń tẹ́tí sí ìbéèrè tí ó bá ìfẹ́ rẹ̀ mu. Kò yẹ kí ìtumọ̀ náà fi kún un pé gbogbo ìbéèrè ni a fi fún ẹni náà lẹ́sẹ̀kẹsẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A yan “ìgbẹ́kẹ̀lé” fún παρρησία, “níwájú rẹ̀” fún ìtọ́kasí ìbáṣepọ̀ pẹ̀lú Ọlọ́run, àti “ó ń gbọ́ tiwa” láti pa ìyàtọ̀ mọ́ láàárín gbígbọ́ àdúrà àti fífi ohun tí a béèrè fúnni.
