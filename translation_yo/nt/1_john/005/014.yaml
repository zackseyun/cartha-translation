  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò àti ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: παρρησία jẹ́ ìgbẹ́kẹ̀lé, πρὸς αὐτόν jẹ́ níwájú rẹ̀, ὅτι ń ṣàfihàn àkóónú ìgbẹ́kẹ̀lé náà, àti ìpèsè ‘bí a bá béèrè’ pa ìtumọ̀ gbogbogbò ἐάν mọ́. Ṣùgbọ́n ‘ó ń gbọ́ tiwa’ kò péye gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá fún ἀκούει ἡμῶν; ó lè dà bí ‘ó ń gbọ́ ohun tiwa.’ ‘Ó ń gbọ́ wa’ jẹ́ ìtumọ̀ tààrà, ó sì yẹ nínú àyíká àdúrà.'
