id: 1JN.5.5
reference: 1 John 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: yo
  text: Ta sì ni ó ń ṣẹ́gun ayé, bí kò ṣe ẹni tí ó gbàgbọ́ pé Jésù ni Ọmọ Ọlọ́run?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀ sí ọ̀rọ̀ jù bẹ́ẹ̀ lọ: “ẹni tí ó ń ṣẹ́gun ... ẹni tí ó gbàgbọ́.” Èdè Gíríìkì lo àwọn alábápín akọ, ẹyọ ọ̀kan, ṣùgbọ́n wọ́n dúró fún ẹnikẹ́ni tó bá ní ànímọ́ náà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Ta
  rationale: Ọ̀rọ̀ ìbéèrè yìí bẹ̀rẹ̀ ìbéèrè àsọyé; “Ta” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: δέ
  choice: sì
  rationale: Níhìn-ín, δέ ń so ọ̀rọ̀ yìí mọ́ èyí tó ṣáájú láì fi ìtakora líle hàn; “sì” mú ìsopọ̀ náà jáde lọ́nà àdánidá.
- source_word: ὁ νικῶν
  choice: ẹni tí ó ń ṣẹ́gun
  rationale: Ọ̀rọ̀ alábápín onísinsìnyí tí a fi àpilẹ̀kọ ṣe orúkọ ni; “ẹni tí ó ń ṣẹ́gun” pa ìtumọ̀ ìṣe tó ń bá a lọ tàbí tó jẹ́ ànímọ́ mọ́.
- source_word: τὸν κόσμον
  choice: ayé
  rationale: κόσμος túmọ̀ sí “ayé” ní tààrà; a kò fi àlàyé ìtumọ̀ bí “ètò ayé búburú” kún un, nítorí ìyẹn yóò kọjá ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Nínú irú ìbéèrè àsọyé yìí, gbólóhùn náà túmọ̀ sí ìyọkúrò tó dájú; “bí kò ṣe” jẹ́ ọ̀nà Yorùbá tó bójú mu.
- source_word: ὁ πιστεύων
  choice: ẹni tí ó gbàgbọ́
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe ti alábápín náà mọ́, dípò yíyí i padà sí orúkọ lasán.
- source_word: ὅτι
  choice: pé
  rationale: ὅτι ń ṣàfihàn ohun tí a gbàgbọ́, kì í ṣe ìdí; “pé” ni àsopọ̀ Yorùbá tó yẹ.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó pa oyè Krístì yìí mọ́ ní tààrà, láì fikún un tàbí dín ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ kù.
theological_decisions:
- issue: Bí a ṣe túmọ̀ àwọn alábápín akọ ẹyọ ọ̀kan ὁ νικῶν àti ὁ πιστεύων
  choice: ẹni tí ó ń ṣẹ́gun / ẹni tí ó gbàgbọ́
  alternative: ọkùnrin tí ó ń ṣẹ́gun / ọkùnrin tí ó gbàgbọ́
  rationale: Bó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì náà jẹ́ akọ ẹyọ ọ̀kan ní gírámà, ó ń dúró fún ẹnikẹ́ni tó bá ní ànímọ́ náà. “Ẹni tí...” sọ èyí jáde ní Yorùbá láì fi akọ kún ibi tí ọ̀rọ̀ náà kò ti ń tọ́ka sí ọkùnrin nìkan.
- issue: Ìjẹ́wọ́ nípa ẹni tí Jésù jẹ́ nínú ὁ υἱὸς τοῦ θεοῦ
  choice: Jésù ni Ọmọ Ọlọ́run
  alternative: Jésù jẹ́ Ọmọ tí ó jẹ́ ti Ọlọ́run
  rationale: “Ọmọ Ọlọ́run” pa oyè pàtàkì náà àti agbára ìjẹ́wọ́ rẹ̀ mọ́, láì ṣàlàyé rẹ̀ kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. “Ta sì ni ó...” jẹ́ àkójọpọ̀ ọ̀rọ̀ àdánidá ju “Ta sì ni ẹni tí...” lọ, nígbà tí “ẹni tí...” ṣì fara hàn nínú abala ìyọkúrò.
