id: 1JN.5.3
reference: 1 John 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: yo
  text: 'Nítorí èyí ni ìfẹ́ sí Ọlọ́run[a]: pé kí a pa àwọn àṣẹ rẹ̀ mọ́; àwọn àṣẹ rẹ̀ kì í ṣe ẹrù.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ Ọlọ́run.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ìfẹ́ tí a ní sí Ọlọ́run tàbí ìfẹ́ tó wá láti ọ̀dọ̀ Ọlọ́run, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ yìí fọwọ́ sí “ìfẹ́ sí Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka sí gbólóhùn àlàyé tó tẹ̀ lé e; “èyí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ orísun mu.
- source_word: γάρ
  choice: nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ nípa fífẹ́ Ọlọ́run, ó sì fi ìdí rẹ̀ múlẹ̀.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: ìfẹ́ sí Ọlọ́run[a]
  rationale: Àyíká ọ̀rọ̀ ní ẹsẹ 2–3 ń sọ nípa ìfẹ́ àwọn onígbàgbọ́ sí Ọlọ́run tí wọ́n fi ń pa àwọn àṣẹ rẹ̀ mọ́. Fífi “sí” kún un mú ìtumọ̀ tí àyíká ọ̀rọ̀ fọwọ́ sí hàn ní Yorùbá; àlàyé ìsàlẹ̀ ojú ìwé dá ìtumọ̀ mìíràn tí gírámà Gíríìkì lè gbà sí.
- source_word: ἵνα
  choice: pé kí
  rationale: Níhìn-ín, ἵνα ń ṣàlàyé ohun tí ìfẹ́ sí Ọlọ́run jẹ́, kì í ṣe ète kan lásán. “Pé kí” jẹ́ ọ̀nà àdánidá láti ṣàfihàn àkóónú yẹn ní Yorùbá.
- source_word: ἐντολάς
  choice: àwọn àṣẹ
  rationale: “Àṣẹ” fi agbára ohun tí ẹni aláṣẹ pàṣẹ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ἐντολή.
- source_word: τηρῶμεν
  choice: kí a máa pa … mọ́
  rationale: “Pa àṣẹ mọ́” jẹ́ àkójọpọ̀ ọ̀rọ̀ Yorùbá tó túmọ̀ sí ṣíṣe tàbí ṣíṣègbọ́ràn sí àṣẹ, ó sì pa àbájáde ìtumọ̀ τηρέω mọ́.
- source_word: βαρεῖαι
  choice: kò … jẹ́ ẹrù
  rationale: βαρεῖαι túmọ̀ sí ohun tó wúwo tàbí tó nira láti ru. “Kò jẹ́ ẹrù” jẹ́ àpèjúwe Yorùbá àdánidá fún ohun tí kò ni lára tàbí tí kò ṣòro láti gbé.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú ἡ ἀγάπη τοῦ θεοῦ
  choice: Ìfẹ́ àwọn onígbàgbọ́ sí Ọlọ́run
  alternative: Ìfẹ́ Ọlọ́run sí àwọn onígbàgbọ́, tàbí gbígba pé gbólóhùn náà lè ru ìtumọ̀ méjèèjì
  rationale: Ẹsẹ tó ṣáájú so fífẹ́ Ọlọ́run pọ̀ mọ́ pípa àwọn àṣẹ rẹ̀ mọ́, ẹsẹ yìí sì ṣàlàyé ìfẹ́ náà ní ọ̀nà kan náà. Nítorí náà, “ìfẹ́ sí Ọlọ́run” ni àyíká ọ̀rọ̀ fọwọ́ sí jù; síbẹ̀, àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú gírámà Gíríìkì mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà ní ọlá, ó ṣe kedere fún òǹkàwé lásán, kò sì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
