source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: yo
  text: 'Àwa mọ̀ pé gbogbo ẹni tí a ti bí láti ọ̀dọ̀ Ọlọ́run kì í máa dẹ́ṣẹ̀[a]; ṣùgbọ́n ẹni tí a bí láti ọ̀dọ̀ Ọlọ́run ń ṣọ́ ọ[b], ẹni búburú náà kì í sì fọwọ́ kàn án[c].


    [a] Tàbí, “kì í dẹ́ṣẹ̀.” Ọ̀rọ̀ ìṣe Gíríìkì níbí ṣeé lóye gẹ́gẹ́ bí dídẹ́ṣẹ̀ tí ń bá a lọ tàbí tí ó di àṣà; kò fi dandan sọ pé onígbàgbọ́ kì í ṣe ẹ̀ṣẹ̀ rárá. Fi wé 1 Jòhánù 1:8-10; 2:1.


    [b] Tàbí, “ẹni tí a bí láti ọ̀dọ̀ Ọlọ́run ń ṣọ́ ara rẹ̀.” Ṣùgbọ́n ọ̀pọ̀ àwọn olùtumọ̀ lóye “ẹni tí a bí láti ọ̀dọ̀ Ọlọ́run” níbí pé ó ń tọ́ka sí Jésù, Ọmọ Ọlọ́run, ẹni tí ń ṣọ́ onígbàgbọ́.


    [c] “Fọwọ́ kàn” lè túmọ̀ sí mímú ẹni kan láti ṣe é nípalára.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í dẹ́ṣẹ̀.” Ọ̀rọ̀ ìṣe Gíríìkì níbí ṣeé lóye gẹ́gẹ́ bí dídẹ́ṣẹ̀ tí ń bá a lọ tàbí tí ó di àṣà; kò fi dandan sọ pé onígbàgbọ́ kì í ṣe ẹ̀ṣẹ̀ rárá. Fi wé 1 Jòhánù 1:8-10; 2:1.
    reason: cross_reference
  - marker: b
    text: Tàbí, “ẹni tí a bí láti ọ̀dọ̀ Ọlọ́run ń ṣọ́ ara rẹ̀.” Ṣùgbọ́n ọ̀pọ̀ àwọn olùtumọ̀ lóye “ẹni tí a bí láti ọ̀dọ̀ Ọlọ́run” níbí pé ó ń tọ́ka sí Jésù, Ọmọ Ọlọ́run, ẹni tí ń ṣọ́ onígbàgbọ́.
    reason: alternative_reading
  - marker: c
    text: “Fọwọ́ kàn” lè túmọ̀ sí mímú ẹni kan láti ṣe é nípalára.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Àwa mọ̀
  rationale: Ọ̀nà perfect οἶδα ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ìṣe ipò ní àkókò ìsinsìnyí; “Àwa mọ̀” jẹ́ Yorùbá àdánidá.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: gbogbo ẹni tí a ti bí láti ọ̀dọ̀ Ọlọ́run
  rationale: “Gbogbo ẹni” pa ìtumọ̀ pínpín πᾶς ὁ mọ́; “a ti bí” tún fi ipò tí perfect participle ń tẹnumọ́ hàn.
- source_word: οὐχ ἁμαρτάνει
  choice: kì í máa dẹ́ṣẹ̀
  rationale: “Kì í máa” fi ìṣe tí ń bá a lọ tàbí ìwà àṣà hàn, láì sọ pé ẹni tí Ọlọ́run bí kò lè dá ẹ̀ṣẹ̀ kankan rí.
- source_word: ἀλλ’
  choice: dípò bẹ́ẹ̀
  rationale: Ó mú ìyàtọ̀ tí ἀλλά ń ṣe jáde ní Yorùbá tó ṣe kedere.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: ẹni tí a bí láti ọ̀dọ̀ Ọlọ́run
  rationale: Ọ̀rọ̀ yìí pa àìdánilójú Gíríìkì mọ́ nípa bóyá onígbàgbọ́ ni tàbí Jésù ni a ń tọ́ka sí; a kò fi “Ọmọ” kún àyọkà pàtàkì.
- source_word: τηρεῖ αὐτόν
  choice: ń ṣọ́ ọ
  rationale: τηρέω lè túmọ̀ sí ṣíṣọ́, pípamọ́, tàbí dídáàbò bo. “Ń ṣọ́ ọ” sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa ọ̀rọ̀ arọ́pò-orúkọ tí kì í ṣe reflexive mọ́.
- source_word: ὁ πονηρὸς
  choice: Ẹni Ibi náà
  rationale: Pẹ̀lú article àti lílò rẹ̀ nínú ìwé Jòhánù, ó ṣeé ṣe jù pé ẹni kan—Sátánì—ni a ń tọ́ka sí, kì í ṣe ibi gẹ́gẹ́ bí èrò lásán.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: kò fọwọ́ kàn án
  rationale: Ó pa àwòrán “fọwọ́ kàn” mọ́, nígbà tí àyíká ọ̀rọ̀ gba ìtumọ̀ mímú ẹni láti ṣe é ní ibi láàyè.
theological_decisions:
- issue: Ìtumọ̀ present tense nínú οὐχ ἁμαρτάνει
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí kíkọ dídẹ́ṣẹ̀ tí ń bá a lọ tàbí tí ó di àṣà.
  alternative: Onígbàgbọ́ kì í dá ẹ̀ṣẹ̀ kankan rárá.
  rationale: Èyí bá imperfective force mu, ó sì pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ mọ́ pẹ̀lú 1 Jòhánù 1:8-10 àti 2:1.
- issue: Ẹni tí ὁ γεννηθεὶς ἐκ τοῦ θεοῦ ń tọ́ka sí
  choice: Àyọkà pàtàkì sọ “ẹni tí a bí láti ọ̀dọ̀ Ọlọ́run,” láì dá ẹni tí ó jẹ́ múlẹ̀.
  alternative: Ó lè jẹ́ onígbàgbọ́ tí Ọlọ́run bí, tàbí Jésù Ọmọ Ọlọ́run.
  rationale: Gíríìkì ní àìdánilójú gidi níbí. Àyọkà pa á mọ́, àlàyé ìsàlẹ̀ sì fi àwọn ọ̀nà méjèèjì hàn.
- issue: Ìtọ́kasí αὐτόν àti αὐτοῦ
  choice: A lo “ọ” àti “án” fún ẹni tí a ń ṣọ́, ẹni tí Ẹni Ibi kò sì fọwọ́ kàn.
  alternative: Bí participle náà bá ń tọ́ka sí onígbàgbọ́, a lè lóye gbolohun náà ní reflexive pé “ń ṣọ́ ara rẹ̀.”
  rationale: Àyọkà SBLGNT ní αὐτόν, kì í ṣe reflexive pronoun. Ìtumọ̀ pàtàkì pa èyí mọ́, àlàyé sì jẹ́ kí òye mìíràn hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “a ti bí” àti “a bí” láti pa ìyàtọ̀ perfect àti aorist participle mọ́ dé ibi tí Yorùbá ti lè ṣe é; a sì yẹra fún fífi ìdánimọ̀ ẹ̀kọ́ ìjọ kan sínú àyọkà.
