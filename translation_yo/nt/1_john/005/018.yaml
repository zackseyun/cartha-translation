  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní ọ̀pọ̀ ibi: “Àwa mọ̀,” ìbí láti ọ̀dọ̀ Ọlọ́run, àti ìtumọ̀ ìṣe tí ń tẹ̀síwájú nínú “kì í máa dẹ́ṣẹ̀.” Síbẹ̀, “kò fọwọ́ kàn án” lè hàn bí ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀ tàbí ìkọ̀sílẹ̀ tí kì í ṣe ìwà ìsinsìnyí. ἅπτεται wà ní present tense; “kì í fọwọ́ kàn án” dara jù fún ìtumọ̀ gbogbogbò/tí ń bá a lọ. “Ẹni Ibi náà” kò rọrùn bí “ẹni búburú náà” fún ὁ πονηρός.'
  naturalness: “Ẹni búburú náà” jẹ́ ọ̀nà Yorùbá boṣewa tí ó túbọ̀ jẹ́ ti ẹnu àti ti kíkà ní gbangba ju “Ẹni Ibi náà” lọ. “Ṣùgbọ́n” jẹ́ ìsopọ̀ àtakò tí ó ṣe kedere, tí ó sì jẹ́ àdánidá fún ἀλλʼ níbí.
