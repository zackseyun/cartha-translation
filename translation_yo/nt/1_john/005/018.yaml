    rationale: “Ẹni búburú náà” jẹ́ ìtumọ̀ ti ara Yorùbá, ó sì ń pa ìtọ́kasí sí ẹni kan mọ́ láì ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
  - severity: low
