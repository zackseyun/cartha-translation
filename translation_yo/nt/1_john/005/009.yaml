id: 1JN.5.9
reference: 1 John 5:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: yo
  text: 'Bí a bá gba ẹ̀rí àwọn ènìyàn, ẹ̀rí Ọlọ́run sì ga ju ẹ̀rí àwọn ènìyàn lọ, nítorí èyí ni ẹ̀rí Ọlọ́run: pé ó ti jẹ́rìí nípa Ọmọ rẹ̀.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè lóye gbólóhùn ìkẹyìn gẹ́gẹ́ bí okùnfà: “nítorí ó ti jẹ́rìí nípa Ọmọ rẹ̀.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ohun tí ẹnì kan fi dá ọ̀rọ̀ kan múlẹ̀; ó sì jẹ́ kí àtúnlò ọ̀rọ̀ náà nínú ẹsẹ yìí dúró.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn / ènìyàn
  rationale: Ἄνθρωπος níbí ń tọ́ka sí ènìyàn lápapọ̀, ní ìyàtọ̀ sí Ọlọ́run; “ènìyàn” jẹ́ ọ̀rọ̀ àpapọ̀ tó bójú mu ní Yorùbá.
- source_word: λαμβάνομεν
  choice: a bá gba
  rationale: “Gba” lè túmọ̀ sí gbígba ẹ̀rí wọlé tàbí fífi ọwọ́ sí i, láìfi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ Gíríìkì náà lórí.
- source_word: μείζων
  choice: tóbi ju ti ènìyàn lọ
  rationale: 'Ìtumọ̀ yìí fi ìfiwéra hàn ní Yorùbá àdánidá: ẹ̀rí Ọlọ́run ga ju ẹ̀rí ènìyàn lọ, láìṣàfikún ẹ̀kọ́ míì.'
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: èyí ni ẹ̀rí Ọlọ́run
  rationale: Ó pa àtúnlò “ẹ̀rí Ọlọ́run” mọ́, gẹ́gẹ́ bí ìtẹnumọ́ inú Gíríìkì.
- source_word: μεμαρτύρηκεν
  choice: ó ti jẹ́rìí
  rationale: “Ti jẹ́rìí” fi iṣẹ́ tí a ti ṣe, tí ipa rẹ̀ sì ṣì wà, hàn lọ́nà Yorùbá tó ṣe kedere.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: nípa Ọmọ rẹ̀
  rationale: “Nípa” jẹ́ ìtumọ̀ àdánidá ti περί pẹ̀lú ọ̀rọ̀-orúkọ oníbáṣepọ̀ níbí; “Ọmọ” ń tọ́ka sí Ọmọ Ọlọ́run nínú àyíká ọ̀rọ̀ náà.
theological_decisions:
- issue: Ipa ὅτι kejì
  choice: 'Gbólóhùn tó ṣàlàyé ohun tí ẹ̀rí náà jẹ́: “pé ó ti jẹ́rìí nípa Ọmọ rẹ̀”'
  alternative: 'Gbólóhùn okùnfà: “nítorí ó ti jẹ́rìí nípa Ọmọ rẹ̀”'
  rationale: Ìtòlẹ́sẹẹsẹ ọ̀rọ̀ náà sábà máa ń jẹ́ kí ὅτι kejì ṣàlàyé àkóónú ẹ̀rí Ọlọ́run; síbẹ̀, ìtumọ̀ okùnfà náà ṣeé ṣe, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ àpapọ̀ ti ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ní àyíká yìí, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo ènìyàn, kì í ṣe àwọn ọkùnrin nìkan. “Àwọn ènìyàn” pa ìyàtọ̀ láàárín ẹ̀rí ènìyàn àti ẹ̀rí Ọlọ́run mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé yé ni a lò. A pa àtúnlò “ẹ̀rí” mọ́ fún ìtẹnumọ́, a sì lo àmì ohùn ní kíkún níbi tó bá yẹ.
