lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń fi ìdí fún ohun tí a sọ ṣáájú; “Nítorí” ni ó mú ipa àlàyé yẹn jáde lọ́nà àdánidá ní Yorùbá.
- source_word: τρεῖς
  choice: mẹ́ta
  rationale: Èyí ni nọ́ńbà kádínà mẹ́ta ní tààrà, kò sì sí ohun kan nínú àyíká ọ̀rọ̀ tó béèrè fún ìtumọ̀ mìíràn.
- source_word: εἰσιν
  choice: ni àwọn
  rationale: 'Ìṣètò “mẹ́ta ni àwọn tí ...” fi ọ̀rọ̀ ìwàláàyè/copula inú Gíríìkì hàn ní ọ̀nà Yorùbá tó ṣe kedere: àwọn tó ń ṣe iṣẹ́ náà jẹ́ mẹ́ta.'
- source_word: οἱ μαρτυροῦντες
  choice: àwọn tí ń jẹ́rìí
  rationale: Participle tó ní article yìí ń tọ́ka sí ‘àwọn tí ń jẹ́rìí.’ Ìtumọ̀ yìí pa ìṣe jíjẹ́rìí tó ń lọ lọ́wọ́ mọ́, dípò lílo orúkọ bí ‘àwọn ẹlẹ́rìí’ nìkan.
theological_decisions:
- issue: Ìrísí ọ̀rọ̀ inú 1 Jòhánù 5:7 àti Comma Johanneum
  choice: 'A túmọ̀ ọ̀rọ̀ SBLGNT kúkúrú nìkan nínú àkọsílẹ̀ pàtàkì: “Nítorí mẹ́ta ni àwọn tí ń jẹ́rìí,”'
  alternative: Àwọn àfọwọ́kọ tó wá lẹ́yìn fi ọ̀rọ̀ gígùn kan kún un nípa Baba, Ọ̀rọ̀ àti Ẹ̀mí Mímọ́ ní ọ̀run, àti pé àwọn mẹ́tẹ̀ẹ̀ta jẹ́ ọ̀kan.
  rationale: Orísun Gíríìkì tí a pèsè ni ọ̀rọ̀ kúkúrú tí SBLGNT gbà. Àfikún Mẹ́talọ́kan náà kò sí nínú ẹ̀rí àfọwọ́kọ Gíríìkì àkọ́kọ́; nítorí náà, àkọsílẹ̀ pàtàkì tẹ̀ lé orísun, a sì ṣàlàyé ìyàtọ̀ ọ̀rọ̀ ìtàn yìí nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbo. Kọ́má ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
