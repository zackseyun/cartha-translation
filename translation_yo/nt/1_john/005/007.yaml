translation:
  language: yo
  text: Nítorí mẹ́ta ni àwọn tí ń jẹ́rìí,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ tó wá lẹ́yìn fi ọ̀rọ̀ gígùn kan kún un, èyí tí a sábà máa ń pè ní Comma Johanneum: “ní ọ̀run: Baba, Ọ̀rọ̀, àti Ẹ̀mí Mímọ́; àwọn mẹ́tẹ̀ẹ̀ta yìí sì jẹ́ ọ̀kan. Àwọn mẹ́ta sì tún wà tí ń jẹ́rìí ní ayé ...” Ọ̀rọ̀ yìí kò sí nínú àwọn àfọwọ́kọ Gíríìkì tó ti pẹ́ jù lọ, SBLGNT kò sì fi í sínú ọ̀rọ̀ inú rẹ̀.'
