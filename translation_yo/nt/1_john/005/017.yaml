  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: yo
  text: Gbogbo ìwà àìṣòdodo ni ẹ̀ṣẹ̀,[a] ẹ̀ṣẹ̀ tí kì í yọrí sí ikú sì wà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Gbogbo ohun tí kò tọ́ ni ẹ̀ṣẹ̀,” tàbí “Gbogbo ìwà ìrẹ́jẹ ni ẹ̀ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀ṣẹ̀ tí àbájáde rẹ̀ kì í ṣe ikú,” tàbí ní ọ̀nà tó tẹ̀ lé ìrísí ọ̀rọ̀ ìpilẹ̀ pẹ́kípẹ́kí, “ẹ̀ṣẹ̀ tí kò lọ sí ikú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: Gbogbo
  rationale: Pẹ̀lú ἀδικία tí kò ní árítíkù tí ó sì jẹ́ ọ̀rọ̀-orúkọ ẹyọ, πᾶσα ní ìtumọ̀ tó gba gbogbo rẹ̀ mọ́ra. “Gbogbo” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtẹnumọ́ àpapọ̀ náà mọ́.
- source_word: ἀδικία
  choice: ìwà àìṣòdodo
  rationale: “Ìwà àìṣòdodo” fi ìtumọ̀ ìwà búburú tí ó lòdì sí òdodo hàn, ó sì pa ìbátan ọ̀rọ̀ náà mọ́ pẹ̀lú èdè nípa òdodo. Kò dín ìtumọ̀ rẹ̀ kù sí ìrẹ́jẹ láàárín ènìyàn nìkan.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: “Ẹ̀ṣẹ̀” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó ṣe kedere, tó sì bá ἁμαρτία mu ní ibi méjèèjì.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so gbólóhùn àpapọ̀ àkọ́kọ́ pọ̀ mọ́ àlàyé tó tẹ̀ lé e lọ́nà Yorùbá àdánidá.
- source_word: οὐ πρὸς θάνατον
  choice: tí kì í yọrí sí ikú
  rationale: Gbólóhùn yìí fi ìtọ́sọ́nà tàbí àbájáde hàn. “Tí kì í yọrí sí ikú” ṣe kedere ní Yorùbá òde òní, ó sì bá ọ̀nà tí a gbà lo gbólóhùn náà ní ẹsẹ tó ṣáájú mu.
- source_word: θάνατον
  choice: ikú
  rationale: Èyí ni ìtumọ̀ tààrà θάνατος. A kò fi àfikún kankan sí i tó lè pinnu bóyá ikú ara, ikú nípa ẹ̀mí, tàbí ìdájọ́ ìkẹyìn ni a ń sọ.
theological_decisions:
- issue: Irú “ikú” tí a ń tọ́ka sí nínú gbólóhùn “ẹ̀ṣẹ̀ tí kì í yọrí sí ikú”
  choice: A túmọ̀ ọ́ sí “ikú” lásán láìfi àlàyé ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: ikú ara; ikú nípa ẹ̀mí; ìdájọ́ ìkẹyìn
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ θάνατον nìkan, kò sì ṣàlàyé irú ikú tí ó jẹ́. Nítorí náà, ìtumọ̀ náà pa àìdánilójú inú ẹsẹ náà mọ́ dípò kí ó pinnu ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ kan.
- issue: Ìtumọ̀ ἀδικία nínú gbólóhùn tó sọ nípa gbogbo ìwà búburú
  choice: A lo “ìwà àìṣòdodo” nínú ọ̀rọ̀ pàtàkì.
  alternative: ìwà búburú; ohun tí kò tọ́; ìwà ìrẹ́jẹ
  rationale: “Ìwà àìṣòdodo” gbòòrò tó láti fi ìtumọ̀ ìwà àti ti ẹ̀kọ́ ìgbàgbọ́ hàn, ó sì pa ìbátan mọ́ pẹ̀lú “òdodo,” láìdín ọ̀rọ̀ náà kù sí ìrẹ́jẹ láwùjọ nìkan.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. Ìṣètò “ẹ̀ṣẹ̀ … sì wà” jẹ́ Yorùbá àdánidá fún gbólóhùn ìwàláàyè Gíríìkì, nígbà tí “kì í yọrí sí” pa ìtumọ̀ ìtọ́sọ́nà tàbí àbájáde mọ́.
