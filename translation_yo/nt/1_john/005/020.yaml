id: 1JN.5.20
reference: 1 John 5:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: yo
  text: Àwa sì mọ̀ pé Ọmọ Ọlọ́run ti dé, ó sì ti fún wa ní òye kí a lè mọ Ẹni Òtítọ́ náà; àwa sì wà nínú Ẹni Òtítọ́ náà[a], nínú Ọmọ rẹ̀, Jésù Mèsáyà. Ẹni yìí ni Ọlọ́run òtítọ́ àti ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ ìtọ́ka náà, “Ẹni yìí,” lè tọ́ka ní pàtó sí Jésù Mèsáyà, bí ó tilẹ̀ jẹ́ pé àwọn kan lóye rẹ̀ pé ó ń tọ́ka sí “Ẹni Òtítọ́ náà” (Baba) nínú gbólóhùn tó ṣáájú.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: àwa mọ̀
  rationale: Ọ̀rọ̀ náà ní ìrísí perfect ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí ìmọ̀ tí ó dúró ṣinṣin ní àkókò ìsinsìnyí; “àwa mọ̀” ni Yorùbá àdánidá.
- source_word: ἥκει
  choice: ti dé
  rationale: Ó túmọ̀ sí pé ó ti wá, ó sì ti wà níbí; “ti dé” pa ìṣe tí ó ṣẹ̀ àti àbájáde rẹ̀ mọ́.
- source_word: δέδωκεν
  choice: ti fún wa
  rationale: Perfect náà tọ́ka sí ẹ̀bùn tí a ti fi fún wọn tí ipa rẹ̀ sì ń bá a lọ.
- source_word: διάνοιαν
  choice: òye
  rationale: Ní àyíká yìí, ó jẹ́ agbára láti lóye òtítọ́ nípa Ọlọ́run, kì í ṣe ọpọlọ lásán.
- source_word: ἵνα γινώσκωμεν
  choice: kí a lè mọ
  rationale: Ó fi ète hàn ní Yorùbá àdánidá, láìfi ìtumọ̀ àfikún sí aspect ọ̀rọ̀ Gíríìkì.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: Ẹni Òtítọ́ náà
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ ẹni; lílo gbolóhùn kan náà ní ibi méjèèjì pa àtúnwí Johanu mọ́.
- source_word: ἐσμὲν ἐν
  choice: àwa wà nínú
  rationale: Ó pa èdè ìbáṣepọ̀ Johanu mọ́ láìyí i sí “a ń gbé inú” tàbí “a darapọ̀ mọ́,” nítorí μένω kò sí níbí.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jésù Mèsáyà
  rationale: Χριστός níbí ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, nítorí náà “Mèsáyà” yẹ ju yíyá a gẹ́gẹ́ bí orúkọ ìdílé lọ.
- source_word: οὗτός
  choice: Ẹni yìí
  rationale: Ó ṣe àfihàn demonstrative Gíríìkì ní kedere, ó sì jẹ́ kí ìbéèrè nípa ẹni tí ọ̀rọ̀ náà ń tọ́ka sí wà ní ṣíṣí.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: Ọlọ́run òtítọ́
  rationale: Ìtumọ̀ àdánidá tí ó sì bá èdè Johanu mu.
- source_word: ζωὴ αἰώνιος
  choice: ìyè àìnípẹ̀kun
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí a mọ̀ dáadáa fún ìyè tí kò ní òpin, tí ó sì ní ìwúlò ìmọ̀-ẹ̀sìn Johanu.
theological_decisions:
- issue: Ẹni tí οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος ń tọ́ka sí
  choice: “Ẹni yìí” wà nínú ọ̀rọ̀ pàtàkì, ẹni tó sún mọ́ ọn jù ni Jésù Mèsáyà.
  alternative: Ó lè tọ́ka sí “Ẹni Òtítọ́ náà,” ìyẹn Baba, nínú gbólóhùn tó ṣáájú.
  rationale: Ní Gíríìkì, demonstrative οὗτός sábà máa ń tọ́ka sí ẹni tó sún mọ́ ọn jù, ṣùgbọ́n ìṣètò gbólóhùn náà ti jẹ́ ohun àríyànjiyàn tipẹ́. Ìtumọ̀ yìí kò pa ọ̀nà kejì rẹ́, ó sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní ọlá, tó ṣeé lóye fún gbogbo ènìyàn, pẹ̀lú àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. “Ẹni Òtítọ́ náà” pa àtúnwí àti ìtẹnumọ́ Johanu mọ́; “Ẹni yìí” sì pa àìdánilójú antecedent mọ́.
