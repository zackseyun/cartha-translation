id: 1JN.5.1
reference: 1 John 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: yo
  text: 'Gbogbo ẹni tí ó gbàgbọ́ pé Jésù ni Mèsáyà[a], ni a ti bí láti ọ̀dọ̀ Ọlọ́run[b]; gbogbo ẹni tí ó nífẹ̀ẹ́ ẹni tí ó bí tún nífẹ̀ẹ́ ẹni tí a bí láti ọ̀dọ̀ rẹ̀.


    [a] Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ oyè, ó sì túmọ̀ sí Ẹni tí a fi òróró yàn.


    [b] Ní Gíríìkì, àwọn ọ̀rọ̀ náà “a ti bí,” “ẹni tí ó bí,” àti “ẹni tí a bí” jẹ́ oríṣiríṣi ìrísí ọ̀rọ̀-ìṣe kan náà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà jẹ́ oyè, ó sì túmọ̀ sí Ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, àwọn ọ̀rọ̀ náà “a ti bí,” “ẹni tí ó bí,” àti “ẹni tí a bí” jẹ́ oríṣiríṣi ìrísí ọ̀rọ̀-ìṣe kan náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Gbogbo ẹni tí ó gbàgbọ́
  rationale: Èyí fi ìtumọ̀ gbogbogbò ti participle oní-artíkù hàn ní Yorùbá àdánidá, láì sọ ọ́ di gbólóhùn àídájú.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: pé Jésù ni Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí. “Mèsáyà” mú ìtumọ̀ ẹni àmì-òróró tí a ṣèlérí hàn; àkọsílẹ̀ ìsàlẹ̀ fún “Kristi” gẹ́gẹ́ bí yíyan mìíràn.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ni a ti bí láti ọ̀dọ̀ Ọlọ́run
  rationale: “A ti bí” ń fi perfect passive àti àbájáde tó ń bá a lọ hàn, “láti ọ̀dọ̀ Ọlọ́run” sì pa ìtumọ̀ orísun ἐκ mọ́.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: gbogbo ẹni tí ó sì nífẹ̀ẹ́
  rationale: Ìtumọ̀ gbogbogbò ni a pa mọ́, “sì” sì so abala kejì mọ́ àkọ́kọ́ lọ́nà àdánidá.
- source_word: τὸν γεννήσαντα
  choice: ẹni tí ó bí
  rationale: Yíyan yìí pa participle active mọ́ láì ṣàfikún ẹni tí kò fara hàn gẹ́gẹ́ bí object nínú Gíríìkì; ó tún lo gbòǹgbò “bí” kan náà pẹ̀lú àwọn ọ̀rọ̀ tó yí i ká.
- source_word: ἀγαπᾷ καὶ
  choice: nífẹ̀ẹ́ ... pẹ̀lú
  rationale: “Pẹ̀lú” ní òpin mú ipa καί gẹ́gẹ́ bí “tún/also” hàn ní Yorùbá tó rọrùn.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: ẹni tí a bí láti ọ̀dọ̀ rẹ̀
  rationale: Èyí pa perfect passive, àjọṣe pẹ̀lú γεννάω, àti orísun tí ἐξ αὐτοῦ ń tọ́ka sí mọ́.
theological_decisions:
- issue: Èdè ìbí láti ọ̀dọ̀ Ọlọ́run nínú γεννάω
  choice: Lo “a ti bí láti ọ̀dọ̀ Ọlọ́run,” “ẹni tí ó bí,” àti “ẹni tí a bí láti ọ̀dọ̀ rẹ̀.”
  alternative: Lo “di ọmọ Ọlọ́run,” tàbí sọ ní tààrà pé “Baba” àti “ọmọ rẹ̀.”
  rationale: Yíyan náà pa àwòrán ìbí àti ìbáṣepọ̀ ẹni tó bí sí ẹni tí a bí mọ́, láì tú ìtumọ̀ rẹ̀ sí ẹ̀kọ́ ìsìn kan tàbí ṣàfikún “Baba/ọmọ” tí kò fara hàn ní ọ̀rọ̀ Gíríìkì.
- issue: Oyè messianic ti Jésù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè ìjẹ́wọ́ níbí, kì í ṣe orúkọ lásán. “Mèsáyà” sọ ipa Ẹni Àmì-Òróró tó jẹ́ ìlérí di mímọ̀; “Kristi” wà nínú àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa àtúnlò ọ̀rọ̀-ìṣe “bí” mọ́ láti fi ìsopọ̀ inú Gíríìkì hàn.
