  to: 'Nítorí gbogbo ẹni tí a ti bí láti ọ̀dọ̀ Ọlọ́run[a] ni ó ń ṣẹ́gun ayé. Èyí sì ni ìṣẹ́gun tí ó ti ṣẹ́gun ayé: ìgbàgbọ́ wa.[b]'
