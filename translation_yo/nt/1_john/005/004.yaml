reference: 1 John 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: yo
  text: 'Nítorí gbogbo ẹni tí a ti bí láti ọ̀dọ̀ Ọlọ́run[a] ni ó ń ṣẹ́gun ayé. Èyí sì ni ìṣẹ́gun tí ó ti ṣẹ́gun ayé: ìgbàgbọ́ wa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohunkóhun tí a bí láti ọ̀dọ̀ Ọlọ́run.” Gbólóhùn Gíríìkì náà wà ní ẹ̀yà àárín, ó sì lè sọ nípa gbogbo àwùjọ àwọn tí a bí láti ọ̀dọ̀ Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdúróṣinṣin wa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìgbàgbọ́,” “ìgbẹ́kẹ̀lé,” tàbí “ìdúróṣinṣin” ní àwọn àyíká kan; ẹsẹ àkọ́kọ́ lo ìtumọ̀ tó wọ́pọ̀ jù, “ìgbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀, ó sì pa agbára ìtumọ̀ ìdí tàbí ìdáláre mọ́.
- source_word: πᾶν τὸ γεγεννημένον
  choice: gbogbo ẹni tí a bí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ẹ̀yà àárín, ó ń tọ́ka sí gbogbo àwùjọ àwọn ènìyàn tí Ọlọ́run bí; ‘gbogbo ẹni’ jẹ́ Yorùbá àdánidá tó mú ìtọ́kasí ènìyàn náà hàn.
- source_word: γεγεννημένον
  choice: tí a bí
  rationale: Ìṣe aláìṣe ní àkókò pípé ń tọ́ka sí ìbí tó ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì ń bá a lọ; ‘tí a bí’ bá èdè ìbí tuntun mu láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: ἐκ τοῦ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó fi Ọlọ́run hàn gẹ́gẹ́ bí orísun ìbí náà, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: νικᾷ
  choice: ń ṣẹ́gun
  rationale: Àmì ‘ń’ mú ìṣe tó ń bá a lọ tàbí tó jẹ́ àṣà hàn, ‘ṣẹ́gun’ sì pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú νίκη àti νικήσασα.
- source_word: τὸν κόσμον
  choice: ayé
  rationale: Nínú 1 Jòhánù, ‘ayé’ sábà ń tọ́ka sí ètò ayé tó dojú kọ Ọlọ́run; a pa ọ̀rọ̀ náà mọ́ láìṣàlàyé rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: Èyí sì ni ìṣẹ́gun
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ náà àti ìbáṣepọ̀ νίκη pẹ̀lú ‘ṣẹ́gun’ mọ́.
- source_word: ἡ νικήσασα
  choice: tí ó ti ṣẹ́gun
  rationale: ‘Ti’ fi ìṣe tí a ti parí àti àbájáde rẹ̀ hàn, ó sì pa gbòǹgbò ọ̀rọ̀ kan náà mọ́ pẹ̀lú ‘ń ṣẹ́gun’ àti ‘ìṣẹ́gun.’
- source_word: ἡ πίστις ἡμῶν
  choice: ìgbàgbọ́ wa
  rationale: ‘Ìgbàgbọ́ wa’ ni ìtumọ̀ àdánidá jù lọ ní àyíká yìí, níbi tí a ti ń dá ohun tí ìṣẹ́gun náà jẹ́ mọ̀; àṣàyàn ‘ìṣòtítọ́ wa’ wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí πᾶν τὸ γεγεννημένον ń tọ́ka sí
  choice: Gbogbo àwọn ènìyàn tí a bí láti ọ̀dọ̀ Ọlọ́run
  alternative: Ohunkóhun tí a bí láti ọ̀dọ̀ Ọlọ́run
  rationale: Ẹ̀yà àárín Gíríìkì lè gba ìtumọ̀ tó jẹ́ ‘ohunkóhun,’ ṣùgbọ́n àyíká ọ̀rọ̀ ń sọ nípa àwọn onígbàgbọ́. ‘Gbogbo ẹni’ mú ìtọ́kasí ènìyàn náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìrísí Gíríìkì mọ́.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: Nínú àyíká yìí, ‘ìgbàgbọ́ wa’ ni ìtumọ̀ tó ṣeé ṣe jù lọ, ṣùgbọ́n πίστις lè túmọ̀ sí ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́ ní àwọn àyíká mìíràn; a kò fi àṣàyàn yẹn pamọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ó jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹ̀lé ọ̀rọ̀ ‘ṣẹ́gun—ìṣẹ́gun—ṣẹ́gun’ mọ́ láti ṣàfihàn ìbáṣepọ̀ àwọn ọ̀rọ̀ Gíríìkì.
