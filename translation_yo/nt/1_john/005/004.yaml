  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ὅτι jẹ́ ‘Nítorí’; ìtumọ̀ ènìyàn-pọ̀ fún πᾶν τὸ γεγεννημένον yẹ; àwọn ọ̀rọ̀ ‘ṣẹ́gun—ìṣẹ́gun—ṣẹ́gun’ pa ìbáṣepọ̀ νικᾷ—νίκη—νικήσασα mọ́; ‘ìgbàgbọ́ wa’ sì bá ἡ πίστις ἡμῶν mu. Ṣùgbọ́n ‘tí a bí’ kò ṣàfihàn kedere apá pípé ti γεγεννημένον, nítorí náà ‘tí a ti bí’ yẹ.'
  naturalness: Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá boṣewa tó mọ́, ó sì rọrùn láti ka. ‘Gbogbo ẹni tí a ti bí láti ọ̀dọ̀ Ọlọ́run’ jẹ́ ìtumọ̀ àdánidá àti pípa àbájáde ìbí tí ó ti ṣẹlẹ̀ mọ́.
  terminology: ‘Ìgbàgbọ́’ jẹ́ ìtumọ̀ tó péye fún πίστις ní ẹsẹ yìí. Ní ìsàlẹ̀ akọsilẹ̀ b, ‘ìṣòtítọ́’ sábà túmọ̀ sí òtítọ́ tàbí ìwà òdodo ju ‘faithfulness’ lọ; ‘ìdúróṣinṣin wa’ dara jù gẹ́gẹ́ bí àṣàyàn tó sún mọ́ ìdúróṣinṣin/ìṣòtítọ́ nínú ìbáṣepọ̀.
  issues:
