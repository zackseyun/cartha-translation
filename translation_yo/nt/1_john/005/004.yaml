    issue: Àpá pípé nínú γεγεννημένον kò hàn kedere nínú ‘tí a bí’.
    rationale: Participle náà jẹ́ perfect passive. Fífi ‘ti’ kún un—‘tí a ti bí’—ń fi hàn pé ìbí náà ti ṣẹlẹ̀, pẹ̀lú ipò tàbí àbájáde tó ń bá a lọ.
  - severity: medium
    issue: ‘Ìṣòtítọ́ wa’ nínú akọsilẹ̀ b kì í ṣe ìtumọ̀ tó ṣe kedere fún ‘our faithfulness’.
    rationale: Nínú lílo Yorùbá òde òní, ìṣòtítọ́ sábà ń tọ́ka sí truth/honesty. ‘Ìdúróṣinṣin wa’ ń ṣàfihàn faithfulness/steadfastness dáadáa, láìyí ìtumọ̀ àkọ́kọ́ padà.
