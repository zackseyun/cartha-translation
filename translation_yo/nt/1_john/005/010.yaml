id: 1JN.5.10
reference: 1 John 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: yo
  text: Ẹni tí ó bá gba Ọmọ Ọlọ́run gbọ́ ní ẹ̀rí náà nínú ara rẹ̀[a]; ẹni tí kò gba Ọlọ́run gbọ́ ti sọ ọ́ di òpùrọ́, nítorí pé kò gba ẹ̀rí tí Ọlọ́run ti jẹ́rìí nípa Ọmọ rẹ̀ gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní ‘nínú rẹ̀’ dípò ‘nínú ara rẹ̀’; èyí lè túmọ̀ sí ‘nínú Ọmọ náà’ dípò ‘nínú onígbàgbọ́ náà.’
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Ẹni tí ó bá ... gbọ́
  rationale: Ọ̀rọ̀ yìí fi ẹni gbogbo tí ó ń gbàgbọ́ hàn ní ọ̀nà àpapọ̀; ìtumọ̀ náà jẹ́ ti Yorùbá òde òní, kò sì ní èdè àtijọ́.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: gba Ọmọ Ọlọ́run gbọ́
  rationale: Pẹ̀lú πιστεύω, εἰς tọ́ka sí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé tí a darí sí ẹni kan. Èdè Yorùbá sábà máa ń lo ‘gba ... gbọ́’ láìfi preposition Gẹ̀ẹ́sì ‘in’ hàn lọ́tọ̀.
- source_word: μαρτυρίαν
  choice: ẹ̀rí
  rationale: ‘Ẹ̀rí’ mú ìtumọ̀ ohun tí a jẹ́rìí sí àti àwọ̀ òfin inú ọ̀rọ̀ Johanu mu lọ́nà àdánidá.
- source_word: ἐν αὑτῷ
  choice: nínú ara rẹ̀
  rationale: Arọ́pò-orúkọ afẹ́yìntì náà tọ́ka padà sí ẹni tí ó gba Ọmọ Ọlọ́run gbọ́, ó sì pa ìtumọ̀ pé ẹ̀rí náà wà nínú rẹ̀ mọ́.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: ẹni tí kò gba Ọlọ́run gbọ́
  rationale: Dative náà túmọ̀ sí kí ẹni má gba ohun tí Ọlọ́run sọ gẹ́gẹ́ bí òtítọ́; kì í ṣe pé ẹni náà kàn kò gbà pé Ọlọ́run wà.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: ti sọ ọ́ di òpùrọ́
  rationale: A pa àwòrán Gíríìkì ‘ṣe é ní òpùrọ́’ mọ́. Àkókò perfect fi ipò tí ó wà nísinsìnyí nítorí ìṣe náà hàn.
- source_word: οὐ πεπίστευκεν
  choice: kò ... gbọ́
  rationale: Yorùbá kò sábà fi perfect Gíríìkì hàn ní fọ́ọ̀mù ọ̀rọ̀-ìṣe kan náà; àyíká gbolohun náà fi àìgbọ́ tí ó ṣì dúró hàn.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: tí Ọlọ́run jẹ́
  rationale: Ọ̀rọ̀-ìṣe ‘jẹ́ ẹ̀rí’ bá orúkọ ‘ẹ̀rí’ mu, ó sì pa ìtẹnumọ́ Johanu nípasẹ̀ ọ̀rọ̀ méjì tí ó ní gbòǹgbò kan mọ́ ní Yorùbá.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: nípa Ọmọ rẹ̀
  rationale: περί pẹ̀lú genitive túmọ̀ sí ‘nípa’ tàbí ‘ní ti’; ‘nípa Ọmọ rẹ̀’ jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí ‘ẹ̀rí náà nínú ara rẹ̀’ tọ́ka sí
  choice: Ẹni tí ó gba Ọmọ Ọlọ́run gbọ́ ló ní ẹ̀rí náà nínú ara rẹ̀.
  alternative: Ẹ̀rí náà wà nínú Ọmọ Ọlọ́run, gẹ́gẹ́ bí àwọn àfọwọ́kọ kan ṣe lè túmọ̀ sí.
  rationale: SBLGNT tí a pèsè ka ἐν αὑτῷ, arọ́pò-orúkọ afẹ́yìntì tí ó tọ́ka sí onígbàgbọ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn. A kò ṣàfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ.
- issue: Agbára ‘ẹni tí kò gba Ọlọ́run gbọ́’
  choice: Ó ń sọ ní pàtó nípa kíkọ ẹ̀rí Ọlọ́run sílẹ̀.
  alternative: Àìgbàgbọ́ gbogbogbò pé Ọlọ́run wà.
  rationale: Gbólóhùn ὅτι tó tẹ̀ lé e ṣàlàyé pé àìgbàgbọ́ náà ni àìgba ẹ̀rí tí Ọlọ́run jẹ́ nípa Ọmọ rẹ̀ gbọ́.
translation_notes:
  register: 'Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ‘ẹ̀rí/ jẹ́ ẹ̀rí’ láti pa ìbáṣepọ̀ μαρτυρία/μαρτυρέω mọ́. Àkíyèsí: Àlàyé Gẹ̀ẹ́sì tí a pèsè dà bí ẹni pé àwọn àmì [a] àti [b] ti yí ipò pa dà; nítorí náà a so àmì [a] mọ́ ἐν αὑτῷ, ibi tí variant àfọwọ́kọ náà wà. A kò fi àlàyé ‘sọ ọ́ di òpùrọ́’ sí àlàyé ìsàlẹ̀, nítorí ìtumọ̀ Yorùbá náà ti pa ọ̀rọ̀ Gíríìkì mọ́ ní kedere.'
