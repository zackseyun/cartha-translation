  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: yo
  text: Ẹ̀yin ọmọ ọ̀wọ́n[a], ẹ ṣọ́ ara yín kúrò lọ́dọ̀ àwọn òrìṣà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Ẹ̀yin ọmọ.’ Ọ̀rọ̀ Gíríìkì náà jẹ́ diminutive onífẹ̀ẹ́ tí Jòhánù fi ń pe àwọn tí ó ń bá sọ̀rọ̀; ‘ọ̀wọ́n’ ń fi ìfẹ́ inú náà hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Ẹ̀yin ọmọ mi ọ̀wọ́n
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́ tí Jòhánù máa ń lò fún àwọn tí ó ń kọ̀wé sí. ‘Àwọn ọmọ mi ọ̀wọ́n’ mú ìbátan àti ìfẹ́ inú ọ̀rọ̀ náà jáde ní Yorùbá àdánidá, láìfi hàn pé ọmọ kéékèèké ní ọjọ́ orí nìkan ni a ń bá sọ̀rọ̀.
- source_word: φυλάξατε
  choice: ẹ máa ṣọ́
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn pé kí wọ́n ṣọ́ra gidigidi. ‘Ẹ máa ṣọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìṣọ́ra àti ìṣọ́ ara ẹni tí àṣẹ náà béèrè.
- source_word: ἑαυτὰ
  choice: ara yín
  rationale: Ó pa agbára arọ́pò-orúkọ afẹ̀yìntì mọ́, ó sì bá ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀ mu.
- source_word: ἀπὸ
  choice: kúrò lọ́dọ̀
  rationale: Ó fi ìyapa àti jíjìnnà sí ohun kan hàn ní Yorùbá àdánidá; ó túmọ̀ àkópọ̀ φυλάξατε ... ἀπὸ dáadáa.
- source_word: εἰδώλων
  choice: àwọn òrìṣà
  rationale: Nínú àyíká ìjọsìn, εἴδωλον ń tọ́ka sí ère tàbí ohun tí a ń bọ̀ gẹ́gẹ́ bí ọlọ́run èké. ‘Àwọn òrìṣà’ ni ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní yóò lóye lẹ́sẹ̀kẹsẹ̀ fún àwọn ohun tí a ń sìn dípò Ọlọ́run tòótọ́; a kò fẹ̀ ọ́ sí ‘ohunkóhun tó gba ipò Ọlọ́run.’
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ‘àwọn òrìṣà’
  choice: A túmọ̀ ọ́ ní tààrà sí ‘àwọn òrìṣà,’ láìfẹ̀ ọ́ sí gbogbo ohun tó lè gba ipò Ọlọ́run.
  alternative: ohunkóhun tó di òrìṣà; gbogbo ìjọsìn èké
  rationale: Gíríìkì dárúkọ àwọn ohun ìbọ̀rìṣà ní tààrà. Bí ìkìlọ̀ náà tilẹ̀ lè kan gbogbo ìbọ̀rìṣà nípa ìtumọ̀ rẹ̀, ìtumọ̀ Bíbélì kò gbọ́dọ̀ fi àlàyé gbooro kún ohun tí orísun sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, àdánidá. ‘Ẹ̀yin’ àti ‘ẹ ... yín’ pa ìpè sí ọ̀pọ̀ ènìyàn mọ́; ‘ọ̀wọ́n’ mú ìfẹ́ inú diminutive Gíríìkì jáde láìjẹ́ kí gbolohun náà dà bí ẹni pé àwọn ọmọdé nìkan ni a ń pè.
