language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: yo
  text: 'Nípa èyí ni a fi mọ̀ pé a nífẹ̀ẹ́ àwọn ọmọ Ọlọ́run: nígbà tí a bá nífẹ̀ẹ́ Ọlọ́run, tí a sì ń ṣe àwọn àṣẹ rẹ̀.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “tí a sì ń pa àwọn àṣẹ rẹ̀ mọ́,” tàbí “tí a sì ń ṣègbọ́ràn sí àwọn àṣẹ rẹ̀.” Ọ̀rọ̀ ìṣe Gíríìkì níbí túmọ̀ ní tààrà sí “ṣe” (ποιῶμεν), kì í ṣe ọ̀rọ̀ tí a sábà máa ń lò fún “pa mọ́” (τηρέω).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nípa èyí ni àwa fi
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí a fi mọ̀ nǹkan, ó sì pa agbára ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: γινώσκομεν
  choice: mọ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímọ̀ tàbí dídá ohun kan mọ̀; ìṣe àsìkò ìsinsìnyí náà bá ‘mọ̀’ mu nínú àyíká yìí.
- source_word: ἀγαπῶμεν
  choice: a nífẹ̀ẹ́
  rationale: ‘Nífẹ̀ẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹ fún ìfẹ́ sí Ọlọ́run àti sí àwọn ọmọ rẹ̀.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: àwọn ọmọ Ọlọ́run
  rationale: Ó pa ìtumọ̀ ìbátan ọmọ mọ́, ó sì kan gbogbo ọmọ Ọlọ́run láìfi akọ tàbí abo sí i.
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá tó bójú mu fún ìtumọ̀ ‘nígbà tí’ tàbí ‘nígbàkigbà tí,’ ó sì pa ìfarahàn àdéhùn àti àkókò inú Gíríìkì mọ́.
- source_word: τὸν θεὸν
  choice: Ọlọ́run
  rationale: Èyí ni orúkọ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún Θεός níbi yìí.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: a ń ṣe àwọn àṣẹ rẹ̀
  rationale: ‘Ṣe’ tẹ̀lé ποιέω ní tààrà, dípò lílo ọ̀rọ̀ tó túmọ̀ sí ‘pa mọ́’; àmì ‘ń’ sì mú kí gbolohun náà dùn bí Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín nínífẹ̀ẹ́ àwọn ọmọ Ọlọ́run àti nínífẹ̀ẹ́ Ọlọ́run
  choice: A sọ pé a fi nínífẹ̀ẹ́ Ọlọ́run àti ṣíṣe àwọn àṣẹ rẹ̀ mọ̀ pé a nífẹ̀ẹ́ àwọn ọmọ Ọlọ́run.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó gẹ́gẹ́ bí ẹ̀rí nìkan, ohun tó fa ìfẹ́ sí ẹlòmíràn, tàbí ìtumọ̀ ìfẹ́ fúnra rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìlànà ìdánimọ̀ náà ní ṣókí, ṣùgbọ́n kò yanju bí ìbáṣepọ̀ náà ṣe jẹ́ ti ẹ̀rí, ti okùnfà, tàbí ti ìtumọ̀. Ìtumọ̀ náà fi àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí sílẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yan ‘a ń ṣe àwọn àṣẹ rẹ̀’ láti pa àṣàyàn ọ̀rọ̀ Gíríìkì mọ́ láìjẹ́ kí Yorùbá rẹ̀ le.
