id: 1JN.5.13
reference: 1 John 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: yo
  text: Mo ti kọ àwọn nǹkan wọ̀nyí sí yín, ẹ̀yin tí ẹ gbàgbọ́ nínú orúkọ Ọmọ Ọlọ́run, kí ẹ lè mọ̀ pé ẹ ní ìyè àìnípẹ̀kun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí a bá tẹ̀ lé ìtò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Mo ti kọ àwọn nǹkan wọ̀nyí sí yín, kí ẹ lè mọ̀ pé ẹ ní ìyè àìnípẹ̀kun, ẹ̀yin tí ẹ gbàgbọ́ nínú orúkọ Ọmọ Ọlọ́run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà arọ́pò-orúkọ Gíríìkì mọ́, ó sì ń tọ́ka sí ohun tí a kọ sínú lẹ́tà náà tàbí sí àlàyé tó ṣáájú.
- source_word: ἔγραψα
  choice: Èmi ti kọ
  rationale: Ìṣe aorist náà ń tọ́ka sí iṣẹ́ kíkọ tí a ti parí; lílo “ti kọ” jẹ́ èdè Yorùbá àdánidá fún ọ̀rọ̀ lẹ́tà yìí, “Èmi” sì mú ẹni tó ń sọ̀rọ̀ hàn kedere.
- source_word: ὑμῖν
  choice: sí yín
  rationale: Dative náà fi àwọn ẹni tí a kọ lẹ́tà sí hàn; “sí yín” ni ìtumọ̀ Yorùbá tó ṣe déédé.
- source_word: ἵνα εἰδῆτε
  choice: kí ẹ lè mọ̀
  rationale: Ó fi ète ìkọ̀wé hàn, ó sì pa ìtumọ̀ pé kí ìmọ̀ tó dájú wà lọ́wọ́ àwọn olùgbọ́ mọ́.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe déédé fún ìyè tí kò ní òpin, láì dín ìtumọ̀ ẹ̀kọ́ Johanu kù.
- source_word: ἔχετε
  choice: ẹ ní
  rationale: 'Ó pa present indicative mọ́: ìyè náà jẹ́ ohun tí àwọn onígbàgbọ́ ní nísinsìnyí, kì í ṣe ìrètí ọjọ́ iwájú nìkan.'
- source_word: τοῖς πιστεύουσιν
  choice: yín tí ẹ ... gbọ́
  rationale: A mú un gẹ́gẹ́ bí àfikún tó ń dá àwọn “yín” mọ̀, èyí tó jẹ́ Yorùbá àdánidá tí ó sì bá ìtumọ̀ tó ṣeé ṣe jù lọ mu.
- source_word: πιστεύουσιν εἰς
  choice: gba ... gbọ́
  rationale: “Gba ... gbọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbàgbọ́ nínú ẹni kan; nínú àyíká yìí ó ní ìtumọ̀ fífi ìgbẹ́kẹ̀lé sínú ẹni tí orúkọ náà dúró fún.
- source_word: τὸ ὄνομα
  choice: orúkọ
  rationale: Ó pa àkànlò èdè Bíbélì mọ́, níbi tí “orúkọ” ti ń ṣojú ẹni, ìṣípayá àti àṣẹ rẹ̀.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ó túmọ̀ oyè Kristi náà ní tààràtà, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ibi tí τοῖς πιστεύουσιν wà àti ohun tí ó so mọ́ nínú gbólóhùn
  choice: 'A so ó mọ́ ὑμῖν: “sí yín tí ẹ gba orúkọ Ọmọ Ọlọ́run gbọ́.”'
  alternative: 'A lè fi í sí ẹ̀yìn gbólóhùn ìdánilójú náà: “kí ẹ lè mọ̀ pé ẹ ní ìyè àìnípẹ̀kun—ẹ̀yin tí ẹ gba orúkọ Ọmọ Ọlọ́run gbọ́.”'
  rationale: Ìtò ọ̀rọ̀ Gíríìkì lè gba méjèèjì. Àṣàyàn àkọ́kọ́ dá àwọn tí Johanu kọ̀wé sí mọ̀ ní Yorùbá tó rọrùn; àlàyé ìsàlẹ̀ pa ìtò Gíríìkì àti àìdánilójú gírámà náà mọ́ láì yí ẹ̀kọ́ pàtàkì padà.
translation_notes:
  register: Èdè Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá jẹ́ àdánidá, a sì pa àkànlò Bíbélì “orúkọ Ọmọ Ọlọ́run” mọ́.
