  text: τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα, καὶ οἱ τρεῖς εἰς τὸ ἕν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: yo
  text: Ẹ̀mí àti omi àti ẹ̀jẹ̀, àwọn mẹ́tẹ̀ẹ̀ta sì fohùn ṣọ̀kan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tààràtà, “àwọn mẹ́tẹ̀ẹ̀ta sì jẹ́ ọ̀kan.” Ó ṣeé ṣe kí gbólóhùn Gíríìkì náà túmọ̀ sí pé ẹ̀rí wọn bára mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká 1 Jòhánù 5:6–8 fi hàn pé Ẹ̀mí Mímọ́ ni ọ̀rọ̀ náà ń tọ́ka sí; nítorí náà, a lo lẹ́tà ńlá. A kò fi ‘Mímọ́’ kún un, nítorí kò sí nínú ẹsẹ yìí.
- source_word: τὸ ὕδωρ
  choice: omi
  rationale: A pa àwòrán ohun gidi tí ọ̀rọ̀ Gíríìkì ní mọ́, láì ṣàlàyé ohun tí omi náà dúró fún nínú àyíká yìí.
- source_word: τὸ αἷμα
  choice: ẹ̀jẹ̀
  rationale: A túmọ̀ ọ̀rọ̀ náà ní tààràtà, láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún ohun tí ẹsẹ náà sọ.
- source_word: οἱ τρεῖς
  choice: àwọn mẹ́tẹ̀ẹ̀ta
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka pa dà sí Ẹ̀mí, omi àti ẹ̀jẹ̀ gẹ́gẹ́ bí ẹgbẹ́ mẹ́ta.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: fohùn ṣọ̀kan
  rationale: Nínú àyíká ẹ̀rí jíjẹ́, gbólóhùn Gíríìkì náà ń sọ pé ẹ̀rí àwọn mẹ́tẹ̀ẹ̀ta bára mu. ‘Fohùn ṣọ̀kan’ jẹ́ Yorùbá àdánidá tí ó mú ìtumọ̀ ìṣọ̀kan ẹ̀rí náà jáde láì sọ pé wọ́n jẹ́ ohun kan náà ní ti ìwàláàyè.
theological_decisions:
- issue: Bóyá εἰς τὸ ἕν εἰσιν ń sọ ìṣọ̀kan ẹ̀rí tàbí pé àwọn mẹ́tẹ̀ẹ̀ta jẹ́ ọ̀kan ní ti ìwàláàyè
  choice: 'ìṣọ̀kan ẹ̀rí: ‘àwọn mẹ́tẹ̀ẹ̀ta sì fohùn ṣọ̀kan’'
  alternative: ‘àwọn mẹ́tẹ̀ẹ̀ta sì jẹ́ ọ̀kan’
  rationale: Àyíká náà ń sọ nípa àwọn ẹlẹ́rìí, nítorí náà ìbáramu ẹ̀rí ni ìtumọ̀ tí ó ṣeé ṣe jù. Àṣàyàn yìí kò fi ẹ̀kọ́ nípa ìṣọ̀kan ní ti ìwàláàyè sínú ẹsẹ náà, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tààràtà tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A pa àtòjọ ‘Ẹ̀mí àti omi àti ẹ̀jẹ̀’ mọ́, a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
