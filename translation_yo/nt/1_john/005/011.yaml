id: 1JN.5.11
reference: 1 John 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: yo
  text: 'Èyí sì ni ẹ̀rí náà[a]: pé Ọlọ́run ti fún wa ní ìyè àìnípẹ̀kun[b], ìyè yìí sì wà nínú Ọmọ rẹ̀[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìjẹ́rìí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Ọlọ́run fún wa ní ìyè àìnípẹ̀kun”; aorist Gíríìkì lè jẹ́ títúmọ̀ ní ọ̀nà yìí, ṣùgbọ́n “ti fún wa” ń fi àbájáde tó ṣì wà nísinsìnyí hàn dáadáa.
    reason: lexical_alternative
  - marker: c
    text: “Nínú Ọmọ rẹ̀” pa ọ̀rọ̀ Gíríìkì mọ́; “pẹ̀lú Ọmọ rẹ̀” ṣeé lò gẹ́gẹ́ bí òmíràn, ṣùgbọ́n kò fi ọ̀nà ọ̀rọ̀ Johanu hàn tó bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ohun tí a fi ń jẹ́rìí sí, ó sì bá ìtumọ̀ ọ̀rọ̀ náà nínú àyíká ẹ̀rí-ofin ti Johanu mu. “Ìjẹ́rìí” tún ṣeé lò.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ń ṣe àfihàn ohun tí ẹ̀rí náà sọ ní ọ̀nà tó ṣe déédé, láìfi àlàyé míì kún un.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa èrò ìyè tí kò ní òpin mọ́ nínú lílò Johanu.
- source_word: ἔδωκεν
  choice: ti fún
  rationale: Ìṣètò “ti fún wa” fi hàn pé Ọlọ́run ti ṣe ìfúnni náà, àbájáde rẹ̀ sì ṣì wà fún wa nísinsìnyí. “Fún wa” nìkan lè tẹ̀lé aorist Gíríìkì ní ọ̀nà tó túbọ̀ jẹ́ ti ìrísí ọ̀rọ̀.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Ìtumọ̀ tààrà fún ẹni tó ṣe ìṣe náà, láìfikún àlàyé.
- source_word: ἡμῖν
  choice: wa
  rationale: Ó túmọ̀ dative indirect object náà ní ṣókí, láìdín àwọn tí ọ̀rọ̀ náà ń tọ́ka sí kù tàbí mú wọn gbòòrò.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: nínú Ọmọ rẹ̀
  rationale: “Nínú” pa agbára ἐν àti ọ̀nà tí Johanu gbà ń sọ pé ìyè wà nínú Ọmọ mọ́; “pẹ̀lú Ọmọ rẹ̀” yóò dín ìtumọ̀ yìí kù.
- source_word: υἱῷ
  choice: Ọmọ
  rationale: A kọ ọ́ pẹ̀lú lẹ́tà ńlá gẹ́gẹ́ bí orúkọ oyè tó ń tọ́ka sí Jésù ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Ọlọ́run Baba.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: Èyí ... ìyè yìí
  rationale: A pa àtúnsọ demonstrative Gíríìkì mọ́ láti fi ìtẹnumọ́ àti ìsopọ̀ láàárín ẹ̀rí náà àti ìyè tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn hàn.
theological_decisions:
- issue: Agbára aorist ἔδωκεν àti bí ó ṣe kan jíjẹ́ tí ìyè náà wà lọ́wọ́ wa nísinsìnyí
  choice: “Ọlọ́run ti fún wa ní ìyè àìnípẹ̀kun”
  alternative: “Ọlọ́run fún wa ní ìyè àìnípẹ̀kun”
  rationale: “Ti fún” pa ìṣe tí Ọlọ́run ti parí mọ́, ó sì sọ àbájáde rẹ̀ tó ṣì wà di ohun tó ṣe kedere ní Yorùbá, láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé ẹsẹ náà lórí.
- issue: Ìtumọ̀ pé ìyè náà wà “nínú Ọmọ rẹ̀”
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “nínú Ọmọ rẹ̀”
  alternative: “nípasẹ̀ Ọmọ rẹ̀” tàbí “pẹ̀lú Ọmọ rẹ̀”
  rationale: Èyí pa ọ̀nà ọ̀rọ̀ Johanu àti ìtumọ̀ rẹ̀ tó jinlẹ̀ mọ́, láìsọ ọ́ di àlàyé nípa ibi tí ìyè ti ń wá tàbí ọ̀nà tí a fi ń rí i gbà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Ẹ̀rí” àti “ìyè àìnípẹ̀kun” jẹ́ ọ̀rọ̀ adayébá tí òǹkàwé Yorùbá òde òní lè lóye.
