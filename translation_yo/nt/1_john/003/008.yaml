id: 1JN.3.8
reference: 1 John 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: yo
  text: 'Ẹni tí ó ń ṣe ẹ̀ṣẹ̀[a] wá láti ọ̀dọ̀ Èṣù, nítorí Èṣù ti ń dẹ́ṣẹ̀ láti ìbẹ̀rẹ̀[b]. Èyí ni ìdí tí a fi fi Ọmọ Ọlọ́run hàn[c]: kí ó lè pa àwọn iṣẹ́ Èṣù run[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹni tí ó ń dẹ́ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà sábà ń tọ́ka sí ìṣe tí ń bá a lọ tàbí tí ó ti di àṣà, kì í ṣe ìṣẹ̀lẹ̀ ẹyọ kan ṣoṣo.
    reason: lexical_alternative
  - marker: b
    text: “Láti ìbẹ̀rẹ̀” kò sọ ní pàtó bóyá ìbẹ̀rẹ̀ ìṣẹ̀dá, ìṣọ̀tẹ̀ Èṣù, tàbí ìbẹ̀rẹ̀ ẹ̀ṣẹ̀ ènìyàn ni.
    reason: preserve_ambiguity
  - marker: c
    text: Tàbí, “Ọmọ Ọlọ́run farahàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìfarahàn tàbí fífi ẹni hàn.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “kí ó lè tú àwọn iṣẹ́ Èṣù ká.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ìpilẹ̀ sí “tú,” ó sì lè ní ìtumọ̀ fífọ́ tàbí pípa ohun run nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Ẹni tí ó ń dẹ́ṣẹ̀ ní ìgbà gbogbo
  rationale: Ọ̀rọ̀ ìṣe alábápín àsìkò ìsinsìnyí ποιῶν tọ́ka sí ìṣe tí ń bá a lọ tàbí tí ó ti di àṣà; gbólóhùn yìí jẹ́ kó yé ẹni lójoojúmọ́ pé kì í ṣe ẹ̀ṣẹ̀ ẹyọ kan ṣoṣo.
- source_word: ἐκ τοῦ διαβόλου
  choice: ti ọ̀dọ̀ Èṣù wá
  rationale: Ó pa àwòrán orísun inú ἐκ mọ́, ó sì ń sọ nípa ìbámu ti ìwà àti ti ẹ̀mí, kì í ṣe pé Èṣù bí ẹni náà ní ti ara.
- source_word: διάβολος
  choice: Èṣù
  rationale: Èyí ni orúkọ Yorùbá tí ó wọ́pọ̀ fún ẹni búburú náà; ní àyíká yìí διάβολος jẹ́ orúkọ ẹni, kì í ṣe pé a kàn ń pè é ní af̀ọ̀rọ̀sọ̀rọ̀.
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: nítorí ... láti ìbẹ̀rẹ̀
  rationale: “Nítorí” fi ìdí ọ̀rọ̀ tó ṣáájú hàn; “láti ìbẹ̀rẹ̀” pa àìdánilójú ọrọ̀ Gíríìkì mọ́ láì sọ ìbẹ̀rẹ̀ wo gan-an.
- source_word: ἁμαρτάνει
  choice: ti ń dẹ́ṣẹ̀
  rationale: Pẹ̀lú “láti ìbẹ̀rẹ̀,” ìṣètò yìí fi ìṣe tó bẹ̀rẹ̀ sẹ́yìn tí ó sì ń bá a lọ hàn.
- source_word: εἰς τοῦτο
  choice: Nítorí ète yìí
  rationale: Gbólóhùn náà tọ́ka sí ìdí tàbí ète tí gbólóhùn ἵνα tó tẹ̀ lé yóò ṣàlàyé.
- source_word: ἐφανερώθη
  choice: ni a fi ... hàn
  rationale: Ó pa ìrísí aláìṣe ti Gíríìkì àti èrò ìfarahàn/ìṣípayá mọ́; ó ju rírí lójú lásán lọ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọmọ Ọlọ́run
  rationale: Ìtumọ̀ taara, adayeba, tí ó sì pa oyè nípa ìbátan Ọmọ mọ́.
- source_word: ἵνα λύσῃ
  choice: kí ó lè tú ... ká
  rationale: λύω túmọ̀ ní ìpilẹ̀ sí tú tàbí tú okùn; “tú ... ká” pa àwòrán yẹn mọ́, ó sì sọ ìparun tàbí fífi agbára iṣẹ́ náà ṣòfo ní Yorùbá adayeba.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: àwọn iṣẹ́ Èṣù
  rationale: Ó pa ọ̀pọ̀ “àwọn iṣẹ́” àti ìbáṣepọ̀ wọn pẹ̀lú Èṣù mọ́, láì dín ìtumọ̀ rẹ̀ kù sí àwọn ìṣe kan pàtó.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nípa ẹ̀ṣẹ̀
  choice: Ìṣe ẹ̀ṣẹ̀ tí ń bá a lọ tàbí tí ó ti di àṣà (“ń dẹ́ṣẹ̀ ní ìgbà gbogbo”; “ti ń dẹ́ṣẹ̀”)
  alternative: Gbólóhùn pípé nípa ẹnikẹ́ni tó dá ẹ̀ṣẹ̀ lẹ́ẹ̀kan ṣoṣo
  rationale: Ìrísí ποιῶν àti àyíká 1 Jòhánù tọ́ka sí àpẹẹrẹ ìgbésí ayé, nígbà tí lẹ́tà náà tún jẹ́wọ́ pé àwọn onígbàgbọ́ lè dá ẹ̀ṣẹ̀. Ìtumọ̀ yìí pa ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú lẹ́tà náà mọ́.
- issue: Ìtumọ̀ “láti ọ̀dọ̀ Èṣù”
  choice: Orísun tàbí ìbámu ti ìwà àti ti ẹ̀mí
  alternative: Pé Èṣù ló bí ẹni náà ní ti gidi
  rationale: ἐκ ń fi orísun tàbí ẹgbẹ́ tí ìwà ẹni fara mọ́ hàn nínú èdè Jòhánù; kò fi dandan sọ ìbímọ̀ ní ti ara.
- issue: Ète fífi Ọmọ Ọlọ́run hàn
  choice: Láti tú àwọn iṣẹ́ Èṣù ká, kí ó sọ agbára wọn di asán
  alternative: Láti ṣí àwọn iṣẹ́ Èṣù payá nìkan
  rationale: ἵνα λύσῃ jẹ́ gbólóhùn ète, λύω sì tọ́ka sí títú, fífọ́, tàbí pípa iṣẹ́ náà run, kì í ṣe ṣíṣí i payá lásán.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ jẹ́ adayeba, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Èṣù” ni a lò gẹ́gẹ́ bí orúkọ ẹni, “tú ... ká” sì pa àwòrán ọrọ̀ Gíríìkì λύω mọ́ ní èdè Yorùbá tó mọ́gbọ́n dání.
