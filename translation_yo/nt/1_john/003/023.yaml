id: 1JN.3.23
reference: 1 John 3:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: yo
  text: 'Èyí sì ni àṣẹ rẹ̀: kí a gbàgbọ́ nínú orúkọ Ọmọ rẹ̀, Jésù Mèsáyà[a], kí a sì nífẹ̀ẹ́ ara wa, gẹ́gẹ́ bí ó ti fún wa ní àṣẹ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà, ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: c
    text: Ní ti gidi, Gíríìkì ní, “gẹ́gẹ́ bí ó ti fún wa ní àṣẹ,” tàbí “gẹ́gẹ́ bí ó ti fún wa ní àṣẹ kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa agbára ohun tí a pàṣẹ mọ́. A tún lò ó ní ìparí ẹsẹ̀ náà láti pa àtúnlò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἵνα πιστεύσωμεν
  choice: pé kí a ... gbọ́
  rationale: Lẹ́yìn “Àṣẹ rẹ̀ sì nìyí,” “pé kí a” fi hàn pé gbólóhùn tó tẹ̀ lé e ni ohun tí àṣẹ náà ní ká ṣe, ó sì bá ipá hortatory/subjunctive mu ní Yorùbá.
- source_word: πιστεύω τῷ ὀνόματι
  choice: gba orúkọ ... gbọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbígbàgbọ́ nínú ẹni tí orúkọ náà dúró fún. Ó pa “orúkọ” mọ́ láì sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà ju ohun tí orísun sọ lọ.
- source_word: υἱοῦ
  choice: Ọmọ
  rationale: “Ọmọ” ni ìtumọ̀ tààrà fún υἱός ní àyíká yìí; lẹ́tà ńlá fi hàn pé Jésù ni a ń tọ́ka sí gẹ́gẹ́ bí Ọmọ Ọlọ́run.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a ti yàn níbí, nítorí náà “Mèsáyà” pa agbára oyè náà mọ́ ju lílo “Kristi” bí ẹni pé ó jẹ́ apá orúkọ lọ.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: kí a sì nífẹ̀ẹ́ ara wa
  rationale: “Nífẹ̀ẹ́ ara wa” jẹ́ ọ̀nà àdánidá ní Yorùbá fún ìfẹ́ tí àwọn ọmọ ẹgbẹ́ ń fi hàn sí ara wọn.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: “Gẹ́gẹ́ bí” fi ìbámu tàbí àfiwé tí καθὼς ní hàn.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: ó ti fún wa ní àṣẹ
  rationale: Èyí tẹ̀ lé àwòrán Gíríìkì pé ó “fún wa ní àṣẹ,” ó sì jẹ́ Yorùbá àdánidá, nígbà tó tún pa àtúnlò ἐντολή mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí, Χριστός jẹ́ oyè tó ń dá ẹni tí Ọmọ náà jẹ́ mọ̀; “Mèsáyà” mú ìtumọ̀ ẹni àmì òróró náà jáde, nígbà tí “Kristi” jẹ́ fọ́ọ̀mù ìbílẹ̀ tó tún ṣeé lò.
- issue: Agbára πιστεύω τῷ ὀνόματι
  choice: gba orúkọ ... gbọ́
  alternative: fi ìgbàgbọ́ wa sínú orúkọ
  rationale: Yíyan yìí pa àfiyèsí mọ́ sórí Jésù gẹ́gẹ́ bí ẹni tí orúkọ rẹ̀ ń ṣàfihàn, láì dín un kù sí gbígbà pé ọ̀rọ̀ kan jẹ́ òótọ́ nìkan.
- issue: Ẹni tí ó fún wa ní àṣẹ
  choice: pa ọ̀rọ̀ arọ́pò-orúkọ “ó” mọ́
  alternative: sọ pé Ọlọ́run tàbí Jésù ni
  rationale: Gíríìkì lo ọ̀rọ̀ arọ́pò-orúkọ láì tún ẹni náà dárúkọ; Yorùbá náà pa ìtọ́kasí yẹn mọ́, kó má bàa yanjú ohun tí ẹsẹ̀ náà kò sọ ní kedere.
translation_notes:
  register: 'A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Ìtòlẹ́sẹẹsẹ “Àṣẹ rẹ̀ sì nìyí: pé kí a ...” pa ìṣọ̀kan àwọn ohun méjì tí àṣẹ kan náà ní ká ṣe mọ́: gbígbàgbọ́ àti nínífẹ̀ẹ́.'
