source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: yo
  text: 'Ẹnikẹ́ni tí ń dúró nínú rẹ̀ kì í máa dẹ́ṣẹ̀[a]; ẹnikẹ́ni tí ń máa dẹ́ṣẹ̀ kò rí i rí, bẹ́ẹ̀ ni kò mọ̀ ọ́n rí.


    [a] Lọ́nà tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki: “kì í dẹ́ṣẹ̀ … ẹnikẹ́ni tí ń dẹ́ṣẹ̀.” Àwọn ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí náà lè tọ́ka sí ìṣe tí ń bá a lọ tàbí tí ó ti di ìwà ẹni; nítorí náà, a lè lóye wọn gẹ́gẹ́ bí “kì í máa dẹ́ṣẹ̀ … ẹnikẹ́ni tí ń máa dẹ́ṣẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lọ́nà tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki: “kì í dẹ́ṣẹ̀ … ẹnikẹ́ni tí ń dẹ́ṣẹ̀.” Àwọn ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí náà lè tọ́ka sí ìṣe tí ń bá a lọ tàbí tí ó ti di ìwà ẹni; nítorí náà, a lè lóye wọn gẹ́gẹ́ bí “kì í máa dẹ́ṣẹ̀ … ẹnikẹ́ni tí ń máa dẹ́ṣẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: Ẹnikẹ́ni tí ó bá
  rationale: Ìṣètò ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni láìsí ààlà; ọ̀nà Yorùbá yìí jẹ́ àdánidá, ó sì pa agbára gbogbo ènìyàn inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐν αὐτῷ μένων
  choice: tí ó bá ń dúró nínú rẹ̀
  rationale: “Dúró” pa ìtumọ̀ μένω gẹ́gẹ́ bí ìbáṣepọ̀ tí ń bá a lọ mọ́, “nínú rẹ̀” sì pa àwòrán ìṣọ̀kan inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὐχ ἁμαρτάνει
  choice: kì í máa dẹ́ṣẹ̀
  rationale: “Kì í máa” fi ìṣe tí ń ṣẹlẹ̀ léraléra tàbí tí ó ti di ìwà hàn ní Yorùbá. Àlàyé ìsàlẹ̀ ojú ìwé sì pa ìtumọ̀ tí ó tẹ̀ lé fọ́ọ̀mù Gíríìkì ní pẹkipẹki mọ́.
- source_word: ὁ ἁμαρτάνων
  choice: ẹnikẹ́ni tí ó bá ń dẹ́ṣẹ̀
  rationale: Àmì “ń” bá àpólà ìṣe àsìkò ìsinsìnyí mu, ó sì lè sọ ìṣe tí ń lọ lọ́wọ́ tàbí ìwà tí ó ń bá a lọ láìfi dandan túmọ̀ rẹ̀ sí ẹ̀ṣẹ̀ ẹyọ kan ṣoṣo.
- source_word: οὐχ ἑώρακεν
  choice: kò tíì rí i
  rationale: “Kò tíì” fi ipò ìsinsìnyí tí ó jẹ́ àbájáde àìrí i tẹ́lẹ̀ hàn, ní ìbámu pẹ̀lú perfect Gíríìkì.
- source_word: οὐδὲ ἔγνωκεν
  choice: bẹ́ẹ̀ ni kò tíì mọ̀ ọ́n
  rationale: “Mọ̀” lè gba ìtumọ̀ ìmọ̀ ẹni nípa ìbáṣepọ̀, kì í ṣe ìmọ̀ ọpọlọ nìkan; “bẹ́ẹ̀ ni” sì pa ìsopọ̀ οὐδέ mọ́.
- source_word: αὐτῷ / αὐτόν
  choice: rẹ̀ / i / ọ́n
  rationale: A pa àwọn arọ́pò-orúkọ mọ́ bí arọ́pò-orúkọ, láìsọ pé ẹni náà ni Ọlọ́run, Ọmọ, tàbí Kristi ní pàtó ju bí ẹsẹ náà ṣe sọ lọ.
theological_decisions:
- issue: Bóyá ẹsẹ náà ń kọ́ pé onígbàgbọ́ kò lè dá ẹ̀ṣẹ̀ kankan rárá
  choice: A lo ọ̀nà tí ó lè fi ìṣe ẹ̀ṣẹ̀ tí ń bá a lọ tàbí tí ó di ìwà hàn, pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé nípa ìtumọ̀ gírámà Gíríìkì.
  alternative: Kí a túmọ̀ ọ́ ní kíkún pé “kò dẹ́ṣẹ̀” àti “ẹnikẹ́ni tí ó dẹ́ṣẹ̀,” bí ẹni pé ẹ̀ṣẹ̀ ẹyọ kan ṣoṣo ni ọ̀rọ̀ náà dá lórí.
  rationale: Èyí pa ìkìlọ̀ líle sí ẹ̀ṣẹ̀ mọ́, ó sì tún pa ìforígbárí tó wà nínú lẹ́tà náà mọ́, níbi tí 1 Jòhánù 1:8–2:2 ti jẹ́wọ́ pé àwọn onígbàgbọ́ lè dẹ́ṣẹ̀, tí Kristi sì jẹ́ alágbàwí.
- issue: Ẹni tí “rẹ̀/i/ọ́n” ń tọ́ka sí
  choice: A fi arọ́pò-orúkọ náà sílẹ̀ gẹ́gẹ́ bí arọ́pò-orúkọ.
  alternative: Kí a sọ ní pàtó pé Ọlọ́run, Ọmọ, tàbí Kristi ni.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo arọ́pò-orúkọ, àyíká lẹ́tà náà sì ń sọ̀rọ̀ nípa Baba àti Ọmọ; ṣíṣàìyan ẹni kan ní pàtó kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Dúró nínú rẹ̀” pa àwòrán pàtàkì ti Jòhánù mọ́; “kì í máa dẹ́ṣẹ̀” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe tí kì í ṣe ohun àdádó.
