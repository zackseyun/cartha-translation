id: 1JN.3.24
reference: 1 John 3:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: yo
  text: 'Ẹni tí ó ń pa àwọn àṣẹ rẹ̀ mọ́ ń dúró nínú rẹ̀[a], òun náà ń dúró nínú ẹni náà. Nípa èyí ni àwa fi mọ̀ pé ó ń dúró nínú wa: nípasẹ̀ Ẹ̀mí[b] tí ó fún wa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ń gbé nínú rẹ̀.” Ọ̀rọ̀ Gíríìkì náà, μένω, lè túmọ̀ sí dídúró, wíwà, tàbí gbígbé nínú; ó fara hàn ní ẹ̀ẹ̀mẹ́ta nínú ẹsẹ yìí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láti ọ̀dọ̀ Ẹ̀mí.” Àtẹ̀jáde Gíríìkì ἐκ lè tẹnumọ́ orísun ohun kan, ó sì tún lè tọ́ka sí ìpìlẹ̀ tàbí ọ̀nà tí a fi mọ ohun kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: ń pa … mọ́
  rationale: Ọ̀rọ̀ Yorùbá náà túmọ̀ sí pípa àṣẹ mọ́ nípa ṣíṣe ìgbọ́ràn sí i, ó sì tún pa ìtumọ̀ ìṣọ́ra àti ìdúróṣinṣin inú τηρέω mọ́.
- source_word: ἐντολάς
  choice: àwọn àṣẹ
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá ìgbàlódé, tí ó ṣe kedere, tí ó sì pa agbára ìwà rere àti ojúṣe inú ἐντολή mọ́.
- source_word: μένει
  choice: ń dúró
  rationale: “Ń dúró” fi ìṣe tí ń bá a lọ hàn, ó sì pa àkòrí pàtàkì ti μένω nínú àwọn ìwé Jòhánù mọ́ láì sọ ọ́ di “ń gbé inú,” èyí tí ó lè tẹnumọ́ gbígbé inú ju ìtumọ̀ ọ̀rọ̀ náà lọ.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: A pa arọ́pò-orúkọ Gíríìkì mọ́ dípò fífi “Ọlọ́run” kún un, kí ìtọ́kasí àti àìdánilójú tí ọ̀rọ̀ ìpilẹ̀ ní má bàjẹ́.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Nípa èyí ni àwa fi mọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi hàn pé ohun tí ó tẹ̀ lé e ni ẹ̀rí tàbí ìpìlẹ̀ ìmọ̀ náà.
- source_word: ἐκ τοῦ πνεύματος
  choice: nípasẹ̀ Ẹ̀mí
  rationale: “Nípasẹ̀” fi Ẹ̀mí hàn gẹ́gẹ́ bí ọ̀nà tàbí ẹ̀rí tí a fi mọ̀ pé Ọlọ́run ń dúró nínú wa; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ orísun tí ἐκ tún lè ní mọ́.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: tí ó fi fún wa
  rationale: Ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìṣe fífúnni inú aorist ἔδωκεν mọ́ láìfi àmì àsìkò míì kún un.
theological_decisions:
- issue: Ẹni tí àwọn arọ́pò-orúkọ αὐτῷ / αὐτός àti ẹni tí “ó ń dúró nínú wa” ń tọ́ka sí
  choice: A pa àwọn arọ́pò-orúkọ mọ́; àyíká ọ̀rọ̀ tọ́ka sí Ọlọ́run.
  alternative: A lè fi “Ọlọ́run” tààrà sí àwọn ibi náà, tàbí kí gbólóhùn ìkẹyìn ní ìbáṣepọ̀ pẹ̀lú ìgbé-inú ti Kristi.
  rationale: Ọ̀rọ̀ Gíríìkì lo arọ́pò-orúkọ, kì í ṣe orúkọ “Ọlọ́run.” Pípa èyí mọ́ kò jẹ́ kí ìtumọ̀ ó ṣeé ṣe nípa ìgbé-inú Ọlọ́run àti ti Kristi nínú ẹ̀kọ́ Jòhánù di èyí tí atúmọ̀ ti pinnu fún òǹkàwé.
- issue: Ìtọ́kasí πνεῦμα
  choice: Ẹ̀mí, pẹ̀lú lẹ́tà ńlá, gẹ́gẹ́ bí Ẹ̀mí Mímọ́
  alternative: ẹ̀mí, pẹ̀lú lẹ́tà kékeré
  rationale: Àyíká ọ̀rọ̀ àti gbólóhùn “tí ó fi fún wa” tọ́ka sí Ẹ̀mí Ọlọ́run, kì í ṣe ẹ̀mí ènìyàn tàbí agbára kan tí kì í ṣe ẹni.
translation_notes:
  register: Yorùbá tí a lò jẹ́ èdè ìgbàlódé, ọlọ́wọ̀, tí ó sì yẹ fún kíkà ní gbangba. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A lo “ń pa … mọ́” àti “ń dúró nínú” láti pa ìṣọ̀kan àwọn ọ̀rọ̀ pàtàkì ti Jòhánù mọ́, nígbà tí a kò fi orúkọ “Ọlọ́run” sí ibi tí Gíríìkì ti lo arọ́pò-orúkọ.
