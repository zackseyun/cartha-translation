  to: 'Ẹni tí ó ń pa àwọn àṣẹ rẹ̀ mọ́ ń dúró nínú rẹ̀[a], òun náà ń dúró nínú ẹni náà. Nípa èyí ni àwa fi mọ̀ pé ó ń dúró nínú wa: nípasẹ̀ Ẹ̀mí[b] tí ó fún wa.'
  rationale: A ṣàtúnṣe “tí ó fi fún wa” sí “tí ó fún wa” kí ìtumọ̀ náà lè fara mọ́ aorist ἔδωκεν àti aṣojú-ọrọ̀ οὗ ní tààrà. A tún yọ “sì” kúrò nínú gbólóhùn kejì fún ìṣàn Yorùbá tó rọrùn; ìyípadà yìí kò yí ìtumọ̀ padà. Àwọn àmì ẹsẹ ìsàlẹ̀ àti àlàyé wọn wà ní ibi tó bá ọ̀rọ̀ tí wọ́n ń ṣàlàyé mu.
