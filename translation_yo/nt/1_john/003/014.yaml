id: 1JN.3.14
reference: 1 John 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: yo
  text: Àwa mọ̀ pé a ti kọjá láti inú ikú sínú ìyè, nítorí pé a nífẹ̀ẹ́ àwọn arákùnrin[a]. Ẹni tí kò nífẹ̀ẹ́ ṣì wà nínú ikú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn arákùnrin àti arábìnrin”; Gíríìkì sọ “àwọn arákùnrin,” ó sì ṣeé ṣe kí ó ń tọ́ka sí gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Àwa mọ̀
  rationale: Ọ̀rọ̀ náà ní ìrísí pípé ní Gíríìkì, ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀-ìṣe ipò ní àkókò ìsinsìnyí; “Àwa mọ̀” ni Yorùbá àdánidá.
- source_word: μεταβεβήκαμεν
  choice: a ti ré kọjá
  rationale: “Ti” fi hàn pé ìyípadà náà ti ṣẹlẹ̀, tí àbájáde rẹ̀ sì ṣì dúró; “ré kọjá” tún pa àwòrán ìrìn láti ipò kan sí òmíràn mọ́.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: láti inú ikú sínú ìyè
  rationale: “Láti inú… sínú…” pa ìṣípò kúrò nínú agbègbè kan wọ òmíràn mọ́, gẹ́gẹ́ bí ἐκ…εἰς ṣe sọ.
- source_word: ἀγαπῶμεν
  choice: a nífẹ̀ẹ́
  rationale: Ó sọ ìṣe tí ó ń bá a lọ, tí ó sì jẹ́ àbùdá àwọn tí a ń sọ̀rọ̀ nípa wọn; “nífẹ̀ẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἀγαπάω.
- source_word: τοὺς ἀδελφούς
  choice: àwọn arákùnrin
  rationale: Èyí pa ìrísí akọ ti ọ̀rọ̀ Gíríìkì mọ́. Nínú ọ̀rọ̀ yìí ó ṣeé ṣe kí ó dúró fún gbogbo àwọn onígbàgbọ́, nítorí náà a ṣàlàyé ìtumọ̀ àkópọ̀ náà nínú àlàyé ìsàlẹ̀.
- source_word: ὁ μὴ ἀγαπῶν
  choice: Ẹni tí kò nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ alábápín pẹ̀lú àpilẹ̀kọ náà ń tọ́ka sí irú ẹni tí àìnífẹ̀ẹ́ jẹ́ àbùdá rẹ̀; gbolohun Yorùbá yìí ṣe kedere, ó sì pa agbára ẹyọ tó lè kan ẹnikẹ́ni mọ́.
- source_word: μένει
  choice: ṣì wà
  rationale: “Ṣì wà” sọ ìtẹ̀síwájú nínú ipò kan ní Yorùbá òde òní, ó sì rọrùn láti lóye ju ọ̀rọ̀ àtijọ́ tàbí àlàyé gígùn lọ.
- source_word: ἐν τῷ θανάτῳ
  choice: nínú ikú
  rationale: Èyí pa àwòrán jíjẹ́ ẹni tí ó wà nínú agbègbè ikú mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Ohun tí ἀδελφοί tọ́ka sí àti agbára akọ rẹ̀
  choice: A lo “àwọn arákùnrin” nínú ẹsẹ̀, a sì fi ìtumọ̀ tó ṣeé ṣe pé ó kan gbogbo àwọn onígbàgbọ́ sínú àlàyé ìsàlẹ̀.
  alternative: àwọn arákùnrin àti arábìnrin; àwọn ará onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìlò gírámà. Síbẹ̀, nínú 1 Jòhánù ó ṣeé ṣe kí ó ń pe gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin. Ìtumọ̀ pàtàkì pa ìrísí orísun mọ́, àlàyé ìsàlẹ̀ sì ṣí ìtumọ̀ àkópọ̀ náà sílẹ̀.
- issue: Irú “ikú” àti “ìyè” tí ẹsẹ̀ náà ń sọ
  choice: A fi wọ́n sílẹ̀ gẹ́gẹ́ bí “ikú” àti “ìyè,” láì túmọ̀ wọn síwájú.
  alternative: ikú nípa tẹ̀mí àti ìyè àìnípẹ̀kun; agbègbè ikú àti agbègbè ìyè
  rationale: Gbolohun náà dájú pé ó ń sọ ìyípadà jíjinlẹ̀ nípa ẹ̀kọ́ ìgbàgbọ́, ṣùgbọ́n orísun fi í hàn ní àwòrán kúkúrú. Fífi àwọn ọ̀rọ̀ náà sílẹ̀ láì fẹ̀ wọ́n jù pa àìlédè àti agbára ẹ̀kọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. A pa àwòrán ìṣípò “láti inú… sínú…” mọ́, a sì lo “ṣì wà” fún μένει kí gbolohun náà lè jẹ́ ti Yorùbá òde òní láì sọ agbára orísun nù.
