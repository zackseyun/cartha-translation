id: 1JN.3.3
reference: 1 John 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó ní ìrètí yìí nínú rẹ̀[a] a máa sọ ara rẹ̀ di mímọ́, gẹ́gẹ́ bí òun náà ṣe jẹ́ mímọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó gbé ìrètí yìí lé e lórí.” Àpólà Gíríìkì náà lè túmọ̀ sí ọ̀nà méjèèjì; ọ̀nà kejì ń fi ẹni tí ìrètí náà dojú kọ hàn kedere sí i.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe jù pé “òun náà” ń tọ́ka sí Ọmọ/Kristi nínú àyíká yìí, bí ó tilẹ̀ jẹ́ pé Gíríìkì lo arọ́pò-orúkọ tí kò sọ ẹni náà ní tààrà.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: Ẹnikẹ́ni tí ó bá ní
  rationale: Ó mú ìtumọ̀ gbogbogbò ti àpólà alábápín ọ̀rọ̀ náà jáde ní Yorùbá àdánidá, ó sì fi hàn pé ìwà tí ó ń bá a lọ ni.
- source_word: ἐλπίδα ταύτην
  choice: ìrètí yìí
  rationale: “Ìrètí” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìfojúsọ́nà tó dájú nínú àyíká yìí; “yìí” ń tọ́ka sí ìrètí tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: ἐπ’ αὐτῷ
  choice: tí ó gbé lé e
  rationale: Àpólà yìí sọ ẹni tí ìrètí náà dúró lé lórí ní Yorùbá tó ṣe kedere, láìfi orúkọ ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí kún ẹsẹ náà.
- source_word: ἁγνίζει ἑαυτὸν
  choice: a máa sọ ara rẹ̀ di mímọ́
  rationale: Ó fi ìṣe tí ń tẹ̀síwájú hàn, ó sì pa ìbátan ọ̀rọ̀ mọ́ láàárín ἁγνίζει àti ἁγνός.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ìfiwéra tó dọ́gba hàn.
- source_word: ἐκεῖνος
  choice: òun náà
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì náà mọ́ láìfi “Kristi” tàbí “Ọmọ” sínú ọ̀rọ̀ tí kò sí ní gbangba.
- source_word: ἁγνός
  choice: mímọ́
  rationale: Nínú àyíká ìwà rere yìí, “mímọ́” túmọ̀ sí ẹni tí kò ní àbàwọ́n; ó tún pa ìbátan rẹ̀ mọ́ pẹ̀lú “sọ ... di mímọ́.”
theological_decisions:
- issue: Ẹni tí αὐτῷ àti ἐκεῖνος ń tọ́ka sí
  choice: A pa àwọn arọ́pò-orúkọ mọ́; àyíká fi hàn pé ó ṣeé ṣe jù pé Ọmọ/Kristi ni.
  alternative: αὐτῷ lè tọ́ka sí Ọlọ́run Baba, tàbí kí àìdájú díẹ̀ wà láàárín Baba àti Ọmọ.
  rationale: Àwọn ẹsẹ tó ṣáájú ń tọ́ka sí rírí i bí ó ti rí, èyí tó fara mọ́ Kristi; síbẹ̀, Gíríìkì kò darúkọ ẹni náà ní tààrà, nítorí náà a kò yanjú àìdájú náà ju ohun tí orísun sọ lọ.
- issue: Ìtumọ̀ ἁγνίζει ἑαυτὸν
  choice: “a máa sọ ara rẹ̀ di mímọ́” gẹ́gẹ́ bí ìdáhùn ìwà ẹni tó ní ìrètí.
  alternative: “a máa wẹ ara rẹ̀ mọ́,” èyí tó lè tẹnumọ́ àwòrán ìwẹ̀nùmọ́ ti ìlànà ẹ̀sìn.
  rationale: Ọ̀rọ̀ náà lè ní ìró ìwẹ̀nùmọ́ ti ìlànà ẹ̀sìn tàbí ti ìwà rere; àyíká Jòhánù níbí tẹnumọ́ ìwà mímọ́, ṣùgbọ́n a pa àwòrán ìsọdimímọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, àdánidá, àti òde òní. A lo “Ẹnikẹ́ni” fún ìtumọ̀ gbogbogbò láìfi akọ tàbí abo kún ohun tí Yorùbá kò fi hàn; “a máa” ń ṣàfihàn ìṣe àṣà tó ń bá a lọ.
