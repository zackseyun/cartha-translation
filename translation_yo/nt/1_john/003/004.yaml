id: 1JN.3.4
reference: 1 John 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ń ṣe ẹ̀ṣẹ̀[a] tún ń ṣe àìlófin; ẹ̀ṣẹ̀ sì ni àìlófin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, ‘Ẹnikẹ́ni tí ó ṣe ẹ̀ṣẹ̀.’ Àwọn ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ṣíṣe ohun kan nírọ̀rùn, ṣùgbọ́n ní àyíká yìí wọ́n tún lè fi ìṣe tí ó ń bá a lọ tàbí tí ó jẹ́ àṣà ẹni hàn.
    reason: lexical_alternative
  - marker: b
    text: ‘Àìlófin’ ní ìbátan pẹ̀lú òfin, ṣùgbọ́n ọ̀rọ̀ náà kò sọ ní pàtó pé òfin wo ni a ń tọ́ka sí.
    reason: lexical_clarification
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: Ẹnikẹ́ni tí ó bá ń ṣe
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ẹnikẹ́ni lápapọ̀, ìlò ọ̀rọ̀-ìṣe aláìparí sì lè fi ìṣe tí ó ń bá a lọ tàbí tí ó jẹ́ àṣà ẹni hàn. ‘Tí ó bá ń ṣe’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ gbogbogbò àti ipa ọ̀rọ̀-ìṣe náà mọ́.
- source_word: τὴν ἁμαρτίαν
  choice: ẹ̀ṣẹ̀
  rationale: Níbí, ẹ̀ṣẹ̀ jẹ́ èrò gbogbogbò, kì í ṣe ẹ̀ṣẹ̀ kan pàtó tí a ti mẹ́nu kàn tẹ́lẹ̀.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: tún ń ṣe àìlófin
  rationale: Ìtúmọ̀ yìí tún ọ̀rọ̀-ìṣe ‘ṣe’ lò gẹ́gẹ́ bí Gíríìkì ti ṣe, ó sì pa ìbáramu tó wà láàárín ṣíṣe ẹ̀ṣẹ̀ àti ṣíṣe àìlófin mọ́.
- source_word: ἀνομία
  choice: àìlófin
  rationale: ‘Àìlófin’ pa ìbátan ọ̀rọ̀ náà mọ́ pẹ̀lú òfin, kò sì fi ìtumọ̀ tóóró bí ‘rírú Òfin Mósè’ tàbí ‘rírú òfin ìjọba’ kún un.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: ẹ̀ṣẹ̀ sì ni àìlófin
  rationale: Gbólóhùn náà jẹ́ ìtumọ̀ kúkúrú tó fi ẹ̀ṣẹ̀ àti àìlófin dọ́gba; Yorùbá yìí pa agbára gbólóhùn náà mọ́ láìrọ̀ ọ́.
theological_decisions:
- issue: Bóyá ọ̀rọ̀-ìṣe ìsinsìnyí tọ́ka sí ìṣẹ̀lẹ̀ ẹ̀ṣẹ̀ kan ṣoṣo tàbí ìṣe tí ó ń bá a lọ/tí ó jẹ́ àṣà
  choice: Lílo ‘ń ṣe’ láti fi ìṣe tí ó ń bá a lọ tàbí tí ó sábà máa ń ṣẹlẹ̀ hàn
  alternative: ‘ṣe’ tàbí ‘dá ẹ̀ṣẹ̀’ láìfi ipa ìtẹ̀síwájú hàn
  rationale: Nínú àyíká 1 Jòhánù 3, ọ̀rọ̀-ìṣe ìsinsìnyí lè ṣàpèjúwe ìwà tàbí ìṣe tó ń bá a lọ. ‘Ń ṣe’ pa èyí mọ́ láìsọ ọ́ di ẹ̀kọ́ pé ẹ̀ṣẹ̀ kọ̀ọ̀kan kò ṣe pàtàkì.
- issue: Ìtumọ̀ ἀνομία nínú gbólóhùn ìṣàlàyé
  choice: àìlófin
  alternative: rírú òfin; ìwà búburú
  rationale: ‘Àìlófin’ pa ìtumọ̀ ọ̀rọ̀ Gíríìkì àti ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́, láìfi kún un pé òfin pàtó wo ni a ń sọ tàbí láìsọ ọ́ di ìwà búburú lápapọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Àìlófin’ kéré ní lílò ju àpólà bí ‘rírú òfin’ lọ, ṣùgbọ́n ó ṣe pàtàkì nínú gbólóhùn ìtumọ̀ yìí nítorí ó pa ìṣọ̀kan ọ̀rọ̀ àti ìdọ́gba tí Gíríìkì sọ mọ́.
