source:
  edition: SBLGNT
  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: yo
  text: Nípa èyí ni a ó fi mọ̀ pé a wá láti inú òtítọ́[a], a ó sì mú ọkàn wa balẹ̀ níwájú rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a jẹ́ ti òtítọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ó fi ọkàn wa lójú níwájú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nípa èyí ni ... fi
  rationale: Ọ̀rọ̀ yìí fi èyí tí a ṣẹ̀ṣẹ̀ sọ hàn gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀ tí a fi mọ ohun tó tẹ̀ lé e; ìṣètò ‘ni ... fi’ jẹ́ èdè Yorùbá àdánidá.
- source_word: γνωσόμεθα
  choice: a ó ... mọ̀
  rationale: Ó túmọ̀ sí ìmọ̀ ọjọ́ iwájú ní tààrà, láìfi ìtumọ̀ pé ìmọ̀ náà bẹ̀rẹ̀ nígbà kan kún un.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: a ti inú òtítọ́ wá
  rationale: Ó pa agbára ἐκ mọ́ gẹ́gẹ́ bí orísun tàbí ìpilẹ̀ṣẹ̀, láìyí i sí àlàyé ẹ̀kọ́ ìgbàgbọ́ tó lágbára sí i pé a jẹ́ ti Ọlọ́run.
- source_word: ἀληθείας
  choice: òtítọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ἀλήθεια, ó sì jẹ́ kí ìtumọ̀ rẹ̀ tó jinlẹ̀ nínú àwọn ìwé Johanu dúró láìfikún àlàyé.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: níwájú rẹ̀
  rationale: Ó pa àwòrán ibi àti ìbáṣepọ̀ inú Gíríìkì mọ́, ó sì lè túmọ̀ sí ‘ní iwájú rẹ̀’ tàbí ‘ní àárín wíwà rẹ̀.’
- source_word: πείσομεν
  choice: a ó ... mú ... balẹ̀
  rationale: Pẹ̀lú ‘ọkàn’ gẹ́gẹ́ bí ohun tí ìṣe náà kan, gbólóhùn yìí sọ ìfọ̀kànbalẹ̀ inú lọ́nà Yorùbá àdánidá. Àlàyé ìsàlẹ̀ fi ìtumọ̀ tààrà ‘yí ọkàn wa lọ́kàn padà’ pamọ́.
- source_word: τὴν καρδίαν ἡμῶν
  choice: ọkàn wa
  rationale: Gíríìkì lo ‘ọkàn’ ní ẹyọ kan pẹ̀lú ‘wa’; Yorùbá náà lè lo ẹyọ kan ní ti pínpín fún gbogbo ẹgbẹ́ náà, nítorí náà ó bá fọ́ọ̀mù àti ìtumọ̀ mu.
theological_decisions:
- issue: Ìtumọ̀ ‘láti inú òtítọ́’ nínú ẹ̀kọ́ Johanu
  choice: a ti inú òtítọ́ wá
  alternative: a jẹ́ ti òtítọ́
  rationale: A fi èdè orísun náà sílẹ̀ láìsọ ọ́ di àlàyé pé ‘a jẹ́ ènìyàn Ọlọ́run ní tòótọ́,’ èyí tí ẹsẹ̀ náà kò sọ ní tààrà.
- issue: Ìtumọ̀ πείσομεν pẹ̀lú ‘ọkàn’
  choice: mú ọkàn wa balẹ̀
  alternative: yí ọkàn wa lọ́kàn padà
  rationale: Ọ̀rọ̀ tó yí ẹsẹ̀ náà ká ń sọ nípa ìdánilójú níwájú Ọlọ́run. A yan gbólóhùn Yorùbá tó fi ìfọ̀kànbalẹ̀ inú hàn, ṣùgbọ́n a pa ìtumọ̀ ‘persuade’ mọ́ nínú àlàyé kí a má bàa pa àìdánilójú ọ̀rọ̀ Gíríìkì rẹ́.
translation_notes:
  register: A lo Yorùbá tó bójú mu, tó ṣeé lóye lónìí, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà ní ìṣàn àdánidá Yorùbá, ṣùgbọ́n ó pa àwòrán ‘òtítọ́,’ ‘ọkàn,’ àti ‘níwájú rẹ̀’ ti Gíríìkì mọ́.
