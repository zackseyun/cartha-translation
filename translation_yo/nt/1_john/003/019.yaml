  rationale: 'A ṣètúnṣe ìṣètò ‘a ti inú òtítọ́ wá’ sí ‘a wá láti inú òtítọ́’ fún Yorùbá tó rọrùn, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un. A tún ṣàtúnṣe àwọn àlàyé ìsàlẹ̀ méjèèjì: a yọ ìtumọ̀ ẹgbẹ́ tí kò sí nínú orísun kúrò, a sì rọ́pò ìtumọ̀ ‘yí ọkàn padà’ tí kò bá πείσομεν mu pẹ̀lú àṣàyàn tó ṣàfihàn ìdánilójú ọkàn. Ìtumọ̀ àkọ́kọ́ ‘mú ọkàn wa balẹ̀’ ni a dá sílẹ̀ nítorí ó jẹ́ adayeba, ó sì bá àyíká ẹsẹ̀ náà mu.'
