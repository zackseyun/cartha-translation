id: 1JN.3.16
reference: 1 John 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: yo
  text: 'Nípa èyí[a] ni a ti mọ̀ ìfẹ́: òun fi ẹ̀mí rẹ̀ lélẹ̀ nítorí wa, àwa náà sì ní láti fi ẹ̀mí wa lélẹ̀ nítorí àwọn arákùnrin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nípa èyí” tún lè jẹ́ “Nínú èyí” tàbí “Ní ọ̀nà yìí.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn arákùnrin”; nínú àyíká yìí, ó ṣeé ṣe kí ó tọ́ka sí gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́, títí kan àwọn arábìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nípa èyí
  rationale: Ó lè tọ́ka sí ọ̀nà tàbí ìpìlẹ̀ tí a fi mọ ìfẹ́; “nípa èyí” jẹ́ èdè Yorùbá àdánidá, ó sì pa àlàyé inú gbólóhùn náà mọ́.
- source_word: ἐγνώκαμεν
  choice: a ti mọ
  rationale: Àkókò perfect Gíríìkì tọ́ka sí ìmọ̀ tí a dé bá nígbà kan tí ó sì ń bá a lọ; “a ti mọ” mú abájáde tó wà títí di ìsinsìnyí jáde.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún ἀγάπη nínú àyíká yìí.
- source_word: ἐκεῖνος
  choice: òun
  rationale: Ọ̀rọ̀ arọ́pò orúkọ náà tẹ ẹni tí a ń tọ́ka sí mọ́; nínú àyíká 1 Jòhánù, ẹni náà ni Jésù. “Òun” pa ìtẹnumọ́ náà mọ́ láìfi orúkọ tí Gíríìkì kò sọ kún un.
- source_word: ὑπὲρ ἡμῶν
  choice: nítorí wa
  rationale: Ó sọ pé ìfara-ẹni-rú náà jẹ́ fún ire wa àti ní ipò wa láìdá ẹ̀kọ́ pàtó kan nípa ètùtù lé e lórí.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: fi ẹ̀mí rẹ̀ lélẹ̀
  rationale: Nínú àṣà ọ̀rọ̀ Jòhánù yìí, ψυχή túmọ̀ sí ìyè ẹni, τίθημι sì ń sọ ìfara-ẹni-rú àtinúwá. “Fi ẹ̀mí rẹ̀ lélẹ̀” jẹ́ àṣà ọ̀rọ̀ Bíbélì tó yé ni Yorùbá, tí ó sì pa àwòrán Gíríìkì mọ́.
- source_word: ὀφείλομεν
  choice: a ní láti
  rationale: Ó fi ojúṣe ìwà rere hàn ní èdè Yorùbá òde òní tó ṣe kedere, láìsọ ọ́ di àṣẹ gbígbẹ.
- source_word: τῶν ἀδελφῶν
  choice: àwọn arákùnrin
  rationale: Èyí pa ìrísí akọ ọ̀pọ̀ Gíríìkì mọ́. Àlàyé ìsàlẹ̀ sọ pé nínú àyíká ìjọ ó ṣeé ṣe kí ó gba àwọn onígbàgbọ́ obìnrin pẹ̀lú.
- source_word: τὰς ψυχὰς θεῖναι
  choice: fi ẹ̀mí wa lélẹ̀
  rationale: Ó bá àṣà ọ̀rọ̀ tó ṣáájú mu, ó sì pa ìbáradọ́gba ìfara-ẹni-rú Kristi àti ojúṣe àwọn onígbàgbọ́ mọ́.
theological_decisions:
- issue: Ẹni tí ἐκεῖνος ń tọ́ka sí
  choice: “Òun,” tí àyíká fi hàn pé Jésù Ọmọ ni
  alternative: “Ẹni náà,” láìjẹ́ kí ìtọ́ka sí Kristi ṣe kedere tó bẹ́ẹ̀
  rationale: Àyíká lẹ́tà náà àti àṣà ọ̀rọ̀ fífi ẹ̀mí lélẹ̀ tọ́ka sí Jésù. “Òun” pa ìtẹnumọ́ Gíríìkì mọ́, ó sì jẹ́ kí àyíká ló dá ẹni náà mọ̀.
- issue: Ìwọ̀n àwọn tí ἀδελφῶν kàn
  choice: “Àwọn arákùnrin” nínú ọ̀rọ̀, pẹ̀lú àlàyé pé ó ṣeé ṣe kí ó túmọ̀ sí gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́
  alternative: “Àwọn arákùnrin àti arábìnrin”
  rationale: Gíríìkì jẹ́ akọ ọ̀pọ̀, ṣùgbọ́n nínú àyíká ìjọ ó sábà máa ń dúró fún gbogbo àwọn onígbàgbọ́. Ìtumọ̀ náà pa ìrísí ọ̀rọ̀ orísun mọ́, àlàyé sì ṣàlàyé ìwọ̀n rẹ̀.
- issue: Ìtumọ̀ ὑπέρ nínú ikú Kristi
  choice: “Nítorí wa”
  alternative: “Ní ipò wa” tàbí “fún wa”
  rationale: “Nítorí wa” pa ìtumọ̀ ire ẹni àti àfihàn ìfara-ẹni-rú mọ́ láìfi àlàyé ètùtù kan ṣoṣo lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún. A lo “fi ẹ̀mí … lélẹ̀” láti pa àwòrán àti ìṣọ̀kan ọ̀rọ̀ Jòhánù mọ́; “òun” ń mú ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì jáde.
