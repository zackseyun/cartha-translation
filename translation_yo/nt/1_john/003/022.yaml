id: 1JN.3.22
reference: 1 John 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: yo
  text: Ohunkóhun tí a bá sì béèrè, a ń gbà á lọ́wọ́ rẹ̀, nítorí pé a ń pa àwọn àṣẹ rẹ̀ mọ́, a sì ń ṣe ohun tí ó tẹ́ ẹ lọ́rùn ní ojú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwájú rẹ̀.”
    reason: ἐνώπιον αὐτοῦ tún lè jẹ́ ‘níwájú rẹ̀’; ‘ní ojú rẹ̀’ ní ọ̀rọ̀ àkọ́kọ́ ń fi ìtumọ̀ ‘in his sight’ hàn ní Yorùbá àdánidá.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: ohunkóhun tí a bá
  rationale: 'Àkópọ̀ ọ̀rọ̀ arọ́pò-orúkọ àti ἐάν ń tọ́ka sí ohun àìsọ pàtó: ‘ohunkóhun tí ... bá.’ Èyí jẹ́ èdè Yorùbá àdánidá.'
- source_word: αἰτῶμεν
  choice: a bá béèrè
  rationale: Nínú ọ̀rọ̀ àdúrà tàbí ìbéèrè, αἰτέω túmọ̀ sí ‘béèrè.’ ‘Bá’ bá ìtumọ̀ àìsọ pàtó ti ἐάν mu.
- source_word: λαμβάνομεν ἀπ’ αὐτοῦ
  choice: a ń gbà á lọ́wọ́ rẹ̀
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ó máa ń ṣẹlẹ̀ hàn, ἀπό sì tọ́ka sí ẹni tí ohun náà ti wá. ‘Gbà ... lọ́wọ́ rẹ̀’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé a rí ohun náà gbà láti ọ̀dọ̀ rẹ̀.
- source_word: ὅτι
  choice: nítorí pé
  rationale: ὅτι ń sọ ìdí tí gbígba ohun tí a béèrè fi ṣẹlẹ̀; ‘nítorí pé’ pa ìbáṣepọ̀ ìdí yẹn mọ́ láìrọ̀ ọ́.
- source_word: τὰς ἐντολὰς αὐτοῦ τηροῦμεν
  choice: a ń pa àwọn àṣẹ rẹ̀ mọ́
  rationale: τηρέω níhìn-ín ní ìtumọ̀ pípa tàbí ṣíṣọ́ àwọn àṣẹ mọ́. Gbólóhùn Yorùbá ‘pa àṣẹ mọ́’ jẹ́ àdánidá, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ ju yíyí rẹ̀ sí ‘gbọ́ràn’ nìkan lọ.
- source_word: τὰ ἀρεστὰ ... ποιοῦμεν
  choice: a ń ṣe ohun tí ó tẹ́ ẹ lọ́rùn
  rationale: Adíjẹ́ púpọ̀ aláìlẹ́ni τὰ ἀρεστά dúró gẹ́gẹ́ bí orúkọ fún àwọn ohun tí ó mú inú Ọlọ́run dùn. ‘Ohun tí ó tẹ́ ẹ lọ́rùn’ jẹ́ Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἐνώπιον αὐτοῦ
  choice: níwájú rẹ̀
  rationale: ἐνώπιον lè túmọ̀ sí ‘níwájú,’ ‘lójú,’ tàbí ‘ní iwájú ẹni.’ ‘Níwájú rẹ̀’ pa ìtumọ̀ orísun mọ́, ó sì yàgò fún ṣíṣe àfikún ohun tí kò sí nínú rẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ tó wà láàárín ìdáhùn sí àdúrà àti pípa àṣẹ mọ́
  choice: 'A pa ìsopọ̀ ìdí tí ὅτι fi hàn mọ́: a ń gbà ohun tí a béèrè nítorí pé a ń pa àwọn àṣẹ rẹ̀ mọ́, a sì ń ṣe ohun tí ó tẹ́ ẹ lọ́rùn.'
  alternative: Kí a sọ àwọn méjèèjì bí ohun tí ó kàn ń ṣẹlẹ̀ papọ̀, láìsọ pé ọ̀kan jẹ́ ìdí fún èkejì.
  rationale: Ọ̀rọ̀ Gíríìkì ὅτι sọ ìdí ní tààrà. A kò yẹ kí ìtumọ̀ rọ ìdí yìí kù, bẹ́ẹ̀ ni a kò yẹ kí ó sọ ẹsẹ náà di ìlànà aláìyẹsẹ̀ nípa gbogbo àdúrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì lo ‘rẹ̀’ fún Ọlọ́run láìfi lẹ́tà ńlá tí kì í ṣe àṣà Yorùbá kún un.
