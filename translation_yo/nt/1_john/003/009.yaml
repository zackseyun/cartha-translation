id: 1JN.3.9
reference: 1 John 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: yo
  text: Gbogbo ẹni tí Ọlọ́run bí kì í máa dẹ́ṣẹ̀[a], nítorí irúgbìn Ọlọ́run ń dúró nínú rẹ̀[b]; kò sì lè máa bá a lọ ní dídẹ́ṣẹ̀[c], nítorí Ọlọ́run ni ó bí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tí ó tẹ̀ lé ọ̀rọ̀ Gíríìkì gan-an: “kì í ṣe ẹ̀ṣẹ̀.” Nínú àyíká yìí, ó ṣeé ṣe kí ó túmọ̀ sí dídẹ́ṣẹ̀ tí ó di àṣà, kì í ṣe ìṣe ẹ̀ṣẹ̀ ẹyọ kan ṣoṣo.'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ń wà nínú rẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: 'Ní gígúnná sí i: “kò lè dẹ́ṣẹ̀.” Ọ̀rọ̀ ìṣe Gíríìkì nínú àyíká yìí ṣeé lóye gẹ́gẹ́ bí “kò lè máa bá a lọ ní dídẹ́ṣẹ̀.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: Gbogbo ẹni tí Ọlọ́run bí
  rationale: Ọ̀rọ̀ yìí sọ̀rọ̀ nípa gbogbo àwọn tí ìbí wọn ti ọ̀dọ̀ Ọlọ́run wá. Èdè Yorùbá kò fi ìṣe tí ó ti parí ṣùgbọ́n tí àbájáde rẹ̀ ṣì dúró hàn bí Gíríìkì ṣe ń ṣe, ṣùgbọ́n gbólóhùn yìí jẹ́ ti ẹ̀dá, ó sì fi Ọlọ́run hàn gẹ́gẹ́ bí orísun ìbí náà.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: kì í máa dẹ́ṣẹ̀
  rationale: Àpapọ̀ “kì í” àti “máa” fi ìṣe tí ó jẹ́ àṣà tàbí ohun tí ènìyàn ń ṣe léraléra hàn. Èyí bá ìṣe tí ń lọ lọ́wọ́ nínú ọ̀rọ̀ Gíríìkì mu láì sọ pé ẹni náà kò lè ṣubú sínú ẹ̀ṣẹ̀ kan rí.
- source_word: σπέρμα αὐτοῦ
  choice: irúgbìn Ọlọ́run
  rationale: A pa àkàwé “irúgbìn” mọ́ láì túmọ̀ rẹ̀ sí ọ̀rọ̀ Ọlọ́run, ìyè Ọlọ́run tàbí ìwà Ọlọ́run. A tún orúkọ Ọlọ́run lò dípò arọ́pò-orúkọ kí ẹni tí “rẹ̀” ń tọ́ka sí má bàa rújú ní Yorùbá.
- source_word: ἐν αὐτῷ μένει
  choice: ṣì ń bẹ nínú rẹ̀
  rationale: “Ṣì ń bẹ” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ń bá a lọ láti wà; ó mú ìtumọ̀ ìdúró-pẹ́ ti μένω jáde.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: kò sì lè máa bá a lọ ní dídẹ́ṣẹ̀
  rationale: Ọ̀rọ̀ ìṣe àìparí ti Gíríìkì nínú àyíká yìí ṣeé lóye gẹ́gẹ́ bí dídẹ́ṣẹ̀ tí ń bá a lọ. “Máa bá a lọ” mú ìtumọ̀ yẹn jáde, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gígúnná “kò lè dẹ́ṣẹ̀” pamọ́.
- source_word: ὅτι ἐκ τοῦ θεοῦ γεγέννηται
  choice: nítorí Ọlọ́run ni ó bí i
  rationale: Ìtẹnumọ́ “Ọlọ́run ni” fi orísun ìbí tuntun náà hàn ní Yorùbá tí ó ṣe kedere, ó sì tún ìdí tí a sọ ní ìbẹ̀rẹ̀ ẹsẹ náà mú.
theological_decisions:
- issue: Bóyá ẹsẹ náà ń kọ́ni pé ẹni tí Ọlọ́run bí kò lè dá ẹ̀ṣẹ̀ kankan rárá, tàbí pé kò lè fi ẹ̀ṣẹ̀ ṣe àṣà tí ó ń bá a lọ
  choice: Ọ̀rọ̀ pàtàkì sọ pé ẹni náà kì í fi dídẹ́ṣẹ̀ ṣe àṣà, kò sì lè máa bá a lọ nínú rẹ̀.
  alternative: “Kò lè dẹ́ṣẹ̀,” èyí tí a lè kà sí àìlágbára pátápátá láti dá ẹ̀ṣẹ̀ ẹyọ kan.
  rationale: Àwọn ọ̀rọ̀ ìṣe tí ó wà ní àkókò ìsinsìnyí, àti àyíká 1 Jòhánù 1:8–2:1, ṣe àtìlẹ́yìn fún ìṣe tí ń bá a lọ tàbí tí ó di àṣà. Àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ gígúnná ti Gíríìkì mọ́ kí a má bàa pa ìjà ẹ̀kọ́ inú ọ̀rọ̀ náà rẹ́.
- issue: Ohun tí “irúgbìn Ọlọ́run” dúró fún
  choice: A pa àkàwé “irúgbìn Ọlọ́run” mọ́ láì ṣàlàyé ohun tí ó dúró fún nínú ọ̀rọ̀ pàtàkì.
  alternative: Ọ̀rọ̀ Ọlọ́run; ìyè Ọlọ́run; tàbí ìwà Ọlọ́run.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ohun tí àkàwé náà tọ́ka sí ní pàtó. Pípa àkàwé náà mọ́ yàgò fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan sínú ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. “Kì í máa” àti “máa bá a lọ” fi ìṣe àṣà hàn ní ti ẹ̀dá. A pa àkàwé “irúgbìn” mọ́, a sì lo “Ọlọ́run ni ó bí i” láti fi ìtẹnumọ́ àti orísun ìbí náà hàn kedere.
