  to: Ẹ̀yin olùfẹ́, àwa jẹ́ ọmọ Ọlọ́run nísinsìnyí, àti pé ohun tí a ó jẹ́ kò tíì hàn. A mọ̀ pé bí ó bá hàn[a][b], a ó dà bíi rẹ̀, nítorí pé a ó rí i gẹ́gẹ́ bí ó ti rí.
