id: 1JN.3.2
reference: 1 John 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́, àwa jẹ́ ọmọ Ọlọ́run nísinsìnyí, àti pé ohun tí a ó jẹ́ kò tíì hàn. A mọ̀ pé bí ó bá hàn[a][b], a ó dà bíi rẹ̀, nítorí pé a ó rí i gẹ́gẹ́ bí ó ti rí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “bí ohun tí a ó jẹ́ bá hàn”; Gíríìkì kò sọ kókó ọ̀rọ̀-ìṣe náà ní gbangba. Àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe jù pé Kristi ni a ń tọ́ka sí.
    reason: alternative_reading
  - marker: b
    text: Ọ̀pọ̀ ìtumọ̀ Bíbélì tú gbólóhùn yìí sí “nígbà tí yóò farahàn.” Ní tààrà jù, Gíríìkì sọ pé “bí ó bá hàn,” ó sì lo ọ̀rọ̀-ìṣe kan náà tí ó lò ní ìbẹ̀rẹ̀ ẹsẹ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ènìyàn ni; ó fi ìfẹ́ onífẹ̀ẹ́ hàn, ó sì pa ìbátan rẹ̀ mọ́ pẹ̀lú ἀγαπάω/ἀγάπη láì di ọ̀rọ̀ náà sí ‘ọ̀rẹ́’ nìkan.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó fi ipò àwọn onígbàgbọ́ lọ́wọ́lọ́wọ́ wé ohun tí yóò farahàn lọ́jọ́ iwájú.
- source_word: τέκνα θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: ‘Ọmọ’ jẹ́ ọ̀rọ̀ Yorùbá tí kò fi akọ tàbí abo sí iwájú, ó sì tẹnu mọ́ ìbátan ọmọ pẹ̀lú Ọlọ́run.
- source_word: οὔπω ἐφανερώθη
  choice: kò tíì hàn
  rationale: Ó sọ pé ohun náà kò tíì di mímọ̀ tàbí farahàn; ó tún jẹ́ kí a lè lo gbólóhùn kan náà fún φανερωθῇ ní apá kejì.
- source_word: τί ἐσόμεθα
  choice: ohun tí a ó jẹ́
  rationale: Ó tọ́ka sí irú ipò tàbí ìwà tí àwọn onígbàgbọ́ yóò ní lọ́jọ́ iwájú, kì í ṣe sí ẹni tí wọ́n jẹ́ ní ìtumọ̀ tóóró.
- source_word: οἴδαμεν
  choice: A mọ̀
  rationale: Ìtumọ̀ tààrà, àdánidá fún ọ̀rọ̀-ìṣe Gíríìkì tí ó ní ìtumọ̀ ìsinsìnyí.
- source_word: ἐὰν φανερωθῇ
  choice: bí ó bá hàn
  rationale: Ó pa ìtumọ̀ àídájú ‘bí’ àti àtúnlò ọ̀rọ̀ φανερόω mọ́. Arọ́pò-orúkọ Yorùbá ‘ó’ kò ní akọ tàbí abo, ó sì jẹ́ kí àìdánilójú nípa ohun tàbí ẹni tí ó jẹ́ kókó gbólóhùn náà wà ní ṣíṣí.
- source_word: ὅμοιοι αὐτῷ
  choice: a ó dà bíi rẹ̀
  rationale: Ó sọ ìjọra gidi láì sọ pé a ó di ohun kan náà pẹ̀lú rẹ̀.
- source_word: ὀψόμεθα αὐτὸν
  choice: a ó rí i
  rationale: Ó tú ọ̀rọ̀ ọjọ́ iwájú náà ní tààrà, ó sì pa ẹni tí a ó rí gẹ́gẹ́ bí àfojúsùn ọ̀rọ̀-ìṣe mọ́.
- source_word: καθώς ἐστιν
  choice: gẹ́gẹ́ bí ó ti rí
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí ìfiwéra καθώς mọ́, ó sì sọ pé a ó rí i nínú òtítọ́ ipò rẹ̀.
theological_decisions:
- issue: Ẹni tàbí ohun tí a kò sọ ní gbangba gẹ́gẹ́ bí kókó ἐὰν φανερωθῇ
  choice: A lò ‘bí ó bá hàn,’ èyí tí ó bá àyíká mu pé Kristi ni a ń tọ́ka sí, ṣùgbọ́n tí kò pa àìdánilójú Gíríìkì rẹ́.
  alternative: ‘Bí ohun tí a ó jẹ́ bá hàn,’ tàbí ìtumọ̀ alálàyé jù lọ, ‘nígbà tí Kristi bá farahàn.’
  rationale: Ọ̀rọ̀ tó tẹ̀ lé e nípa rírí ‘i’ àti jíjẹ́ bíi ‘rẹ̀’ mú kí Kristi jẹ́ ẹni tí ó ṣeé ṣe jù lọ; síbẹ̀, Gíríìkì kò sọ kókó ọ̀rọ̀-ìṣe náà ní gbangba. Yorùbá ‘ó’ jẹ́ kí ìfarahàn yìí dúró láì fi tipátipá yanjú rẹ̀.
- issue: Irú ìjọra àwọn onígbàgbọ́ pẹ̀lú Kristi lọ́jọ́ iwájú
  choice: ‘a ó dà bíi rẹ̀’ sọ ìjọra àti ìyípadà gidi, kì í ṣe ìdọ́gba nínú ìwàláàyè tàbí jíjẹ́ ohun kan náà.
  alternative: ‘a ó rí gẹ́gẹ́ bí òun,’ èyí tí ó lè túmọ̀ sí ìdọ́gba ju ohun tí ὅμοιοι sọ lọ.
  rationale: ὅμοιοι túmọ̀ sí jíjọra, kì í ṣe jíjẹ́ ohun kan náà; ìtumọ̀ náà gbọdọ̀ pa ìlérí ìyípadà tó lágbára mọ́ láì sọ pé ẹ̀dá di Kristi ní ìwàláàyè.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti ti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ẹ̀yin olùfẹ́’ jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́; ‘ọmọ Ọlọ́run’ jẹ́ àdánidá ní Yorùbá fún ẹyọ àti ọ̀pọ̀, kò sì fi akọ tàbí abo kún orísun. Àtúnlò ‘hàn’ ní ìdajì méjèèjì pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́.
