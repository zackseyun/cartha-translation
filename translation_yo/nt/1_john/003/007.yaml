id: 1JN.3.7
reference: 1 John 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: yo
  text: Ẹ̀yin ọmọ kéékèèké, ẹ má ṣe jẹ́ kí ẹnikẹ́ni tàn yín jẹ[a]. Ẹni tí ó ń ṣe òdodo[c] jẹ́ olódodo, gẹ́gẹ́ bí ẹni náà[b] ṣe jẹ́ olódodo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe jẹ́ kí ẹnikẹ́ni mú yín ṣìnà.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ẹni náà”; ó ṣeé ṣe jù lọ pé Kristi ni ọ̀rọ̀ yìí ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé àwọn kan gbà pé Ọlọ́run ni.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ìdájọ́”; níhìn-ín, ìtumọ̀ rẹ̀ ni ìwà títọ́ tí ó bá jíjẹ́ olódodo mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Ẹ̀yin ọmọ kéékèèké
  rationale: Ọ̀rọ̀ ìpè onífẹ̀ẹ́ ni τεκνία, ó sì ní ìtumọ̀ ọmọ kékeré. Èyí pa ìmọ̀lára ìbátan àti ìfẹ́ inú ọ̀rọ̀ Gíríìkì mọ́ láìfi ọ̀rọ̀ míì kún un.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: ẹ má ṣe jẹ́ kí ẹnikẹ́ni tàn yín jẹ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìkìlọ̀ pé kí wọ́n má ṣe gba ẹnikẹ́ni láyè láti tan wọ́n jẹ. πλανάω tún lè túmọ̀ sí ṣíni lọ́nà.
- source_word: ὁ ποιῶν
  choice: Ẹni tí ó ń ṣe
  rationale: Àmì àkókò ‘ń’ fi hàn pé ìṣe tí ó ń bá a lọ tàbí ìwà tí ó wọ́pọ̀ ni, kì í ṣe ìṣe ẹ̀ẹ̀kan ṣoṣo.
- source_word: τὴν δικαιοσύνην
  choice: òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tó yẹ fún ìwà títọ́ ní àyíká yìí, ó sì pa ìbátan ọ̀rọ̀ náà mọ́ pẹ̀lú ‘olódodo’ fún δίκαιος.
- source_word: δίκαιός ἐστιν
  choice: jẹ́ olódodo
  rationale: ‘Olódodo’ ṣàpèjúwe ipò tàbí ìwà ẹni náà, ó sì bá ‘ṣe òdodo’ mu ní kedere.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Èyí sọ ìfiwéra tààrà tí καθὼς ń ṣe ní Yorùbá àdánidá.
- source_word: ἐκεῖνος
  choice: ẹni náà
  rationale: Èyí pa agbára ọ̀rọ̀ arọ́pò-orúkọ afihàn Gíríìkì mọ́, láìyàn Kristi tàbí Ọlọ́run ní pàtó sínú àyọkà.
theological_decisions:
- issue: Ẹni tí ἐκεῖνος ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ‘ẹni náà’ nínú àyọkà; ó ṣeé ṣe jù pé Kristi ni.
  alternative: Ó lè tọ́ka sí Ọlọ́run/Baba, tàbí kí ó jẹ́ ìtọ́kasí ọlọ́wọ̀ sí ẹni ti Ọlọ́run láìdín ìtumọ̀ náà mọ́ ọ̀kan.
  rationale: Ní 1 Jòhánù, ἐκεῖνος sábà máa ń tọ́ka sí Jesu, pàápàá nínú ọ̀rọ̀ nípa fífi ìwà rẹ̀ ṣe àpẹẹrẹ. Síbẹ̀, ọ̀rọ̀ Gíríìkì kò dárúkọ ẹni náà níhìn-ín, nítorí náà ‘ẹni náà’ pa àìdájú tó wà nínú orísun mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní èdè ọ̀wọ̀, àdánidá, tí òǹkàwé òde òní lè lóye. Àtúnṣe ‘ń ṣe’ mú ìṣe tí ó ń bá a lọ hàn, ‘ẹni náà’ sì mọ̀ọ́mọ̀ pa àìdájú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí mọ́.
