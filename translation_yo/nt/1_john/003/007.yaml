  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: τεκνία jẹ́ ìpè onífẹ̀ẹ́, ìkìlọ̀ μηδεὶς πλανάτω ὑμᾶς wà ní kedere, àti ‘ń ṣe’ ń ṣàfihàn ìṣe/ìwà tó ń bá a lọ nínú ὁ ποιῶν. Ṣùgbọ́n ‘ti jẹ́ olódodo’ ní ìparí ń mú àkókò pípé tàbí ti ìṣáájú wá síbi tí Gíríìkì ní àkókò ìsinsìnyí ἐστιν.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa tó dára ní gbogbogbò. Àtúnṣe sí ‘gẹ́gẹ́ bí ẹni náà ṣe jẹ́ olódodo’ jẹ́ àdánidá jù, ó sì yẹ fún ìfiwéra ìsinsìnyí. Àṣàyàn ìsàlẹ̀ àkọsílẹ̀ a nílò ìtúnṣe nítorí ‘ṣì yín lọ́nà’ kì í sọ ‘darí ṣìnà’ ní Yorùbá àdánidá.
  terminology: ‘Òdodo’ àti ‘olódodo’ pa ìbáṣepọ̀ δικαιοσύνη/δίκαιος mọ́ dáadáa. Nínú àkọsílẹ̀ c, ‘ìdájọ́ òdodo’ túmọ̀ sí ìdájọ́ tí ó tọ́ dípò ‘justice’ gẹ́gẹ́ bí ọ̀rọ̀ yíyàn; ‘ìdájọ́’ nìkan dáa jù lọ gẹ́gẹ́ bí àṣàyàn ọ̀rọ̀ náà.
