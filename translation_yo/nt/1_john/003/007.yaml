revisions:
- from: Ẹ̀yin ọmọ kéékèèké, ẹ má ṣe jẹ́ kí ẹnikẹ́ni tàn yín jẹ[a]. Ẹni tí ó ń ṣe òdodo[c] jẹ́ olódodo, gẹ́gẹ́ bí ẹni náà[b] ti jẹ́ olódodo.
  to: Ẹ̀yin ọmọ kéékèèké, ẹ má ṣe jẹ́ kí ẹnikẹ́ni tàn yín jẹ[a]. Ẹni tí ó ń ṣe òdodo[c] jẹ́ olódodo, gẹ́gẹ́ bí ẹni náà[b] ṣe jẹ́ olódodo.
  rationale: A rọ́pò ‘ti jẹ́’ pẹ̀lú ‘ṣe jẹ́’ láti pa àkókò ìsinsìnyí àti ìfiwéra orísun mọ́. A tún ṣe àtúnṣe àwọn àṣàyàn nínú àkọsílẹ̀ a àti c kí wọ́n lè jẹ́ Yorùbá àdánidá, kí wọ́n sì dúró ṣinṣin pẹ̀lú ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì. ‘Ẹni náà’ ni a dá sílẹ̀ láti má ṣe fòpin sí ẹni tí ἐκεῖνος ń tọ́ka sí.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:37:23Z'
