    rationale: Ìsọ̀rọ̀ náà kì í jẹ́ ọ̀nà Yorùbá boṣewa fún ‘lead you astray.’ ‘mú yín ṣìnà’ ṣe ìtumọ̀ náà ní ti ẹ̀dá àti ní ti ìlò.
  - severity: low
    issue: 'Àkọsílẹ̀ c: ‘ìdájọ́ òdodo’'
    rationale: Èyí ní ìtumọ̀ ‘a just judgment,’ kì í ṣe àṣàyàn gbooro ‘justice.’ ‘Ìdájọ́’ dáa jù fún àṣàyàn lexical náà.
