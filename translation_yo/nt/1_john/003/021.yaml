  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́, bí ọkàn wa kò bá dá wa lẹ́bi[a], a ní ìgboyà níwájú Ọlọ́run[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò fẹ̀sùn kàn wa” tàbí “kò rí àléébù sí wa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìgbẹ́kẹ̀lé” tàbí “ìdánilójú níwájú Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: “Ọkàn” níbí ń tọ́ka sí inú ẹni, pàápàá ìmọ̀ inú ẹni nípa ohun tí ó tọ́ tàbí ohun tí kò tọ́; ó sún mọ́ ohun tí a ń pè ní “ẹ̀rí-ọkàn.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ènìyàn ni; ó pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú èdè ìfẹ́ tí ó wọ́pọ̀ nínú 1 Jòhánù, ó sì jẹ́ èdè Yorùbá adayébá àti ọlọ́wọ̀.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Ó ṣàfihàn gbólóhùn oníṣ شرط; ìṣètò ‘bí ... bá’ ni ọ̀nà Yorùbá adayébá láti túmọ̀ rẹ̀.
- source_word: καρδία
  choice: ọkàn
  rationale: ‘Ọkàn’ pa àwòrán orísun mọ́; ní àyíká yìí ó ń tọ́ka sí inú ẹni àti ìmọ̀ ìwà rere ẹni, láìdín ìtumọ̀ rẹ̀ kù sí ‘ẹ̀rí-ọkàn’ nìkan.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: kò dá wa lẹ́bi
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ fífi ẹ̀sùn tàbí ìdájọ́ sí ẹni; ‘dá ... lẹ́bi’ mú àwọ̀ ìdájọ́ náà jáde, ó sì bá àyíká ẹsẹ tó ṣáájú mu.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Ó lè túmọ̀ sí ìgboyà, òmìnira ọ̀rọ̀, tàbí ìgbẹ́kẹ̀lé. ‘Ìgboyà’ sọ ipò ẹni tí kò tijú níwájú Ọlọ́run di mímọ̀, láìsọ ọ́ di ìgbéraga.
- source_word: πρὸς τὸν θεόν
  choice: níwájú Ọlọ́run
  rationale: Nínú ìṣọ̀kan rẹ̀ pẹ̀lú παρρησία, ó ṣàpèjúwe ipò tàbí ìbáṣepọ̀ ẹni ní ojú Ọlọ́run; ‘níwájú Ọlọ́run’ jẹ́ Yorùbá adayébá tí ó pa ìtumọ̀ yìí mọ́.
theological_decisions:
- issue: Ẹ̀ka inú ẹni tí καρδία ń tọ́ka sí
  choice: ọkàn
  alternative: ẹ̀rí-ọkàn
  rationale: ‘Ọkàn’ pa ọ̀rọ̀-àwòrán Jòhánù àti ìfẹ̀sí ìtumọ̀ rẹ̀ mọ́. ‘Ẹ̀rí-ọkàn’ lè ṣàlàyé iṣẹ́ rẹ̀ níbí, ṣùgbọ́n ó lè dín ìtumọ̀ ọkàn gẹ́gẹ́ bí inú ẹni kù.
- issue: Ìtumọ̀ παρρησίαν nínú ìbáṣepọ̀ pẹ̀lú Ọlọ́run
  choice: ìgboyà níwájú Ọlọ́run
  alternative: ìgbẹ́kẹ̀lé níwájú Ọlọ́run; òmìnira láti sún mọ́ Ọlọ́run
  rationale: ‘Ìgboyà’ pa èrò ìṣípayá àti àìtijú níwájú Ọlọ́run mọ́, láìyọ ọ̀wọ̀ fún ìjẹ́mímọ́ Ọlọ́run kúrò tàbí sọ ọ́ di ìdánilójú ti ìmọ̀lára nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀ ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ẹ̀yin olùfẹ́’ gẹ́gẹ́ bí ọ̀rọ̀ ìpè onífẹ̀ẹ́, a sì pa ‘ọkàn’ mọ́ dípò fífi ìtumọ̀ ‘ẹ̀rí-ọkàn’ sínú ọ̀rọ̀ pàtàkì. Gbogbo àmì àlàyé [a], [b], àti [c] wà nínú ẹsẹ.
