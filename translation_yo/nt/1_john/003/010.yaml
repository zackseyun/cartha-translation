  rationale: Àtúnṣe náà jẹ́ kí àsọyé «kì í ṣe ti Ọlọ́run» kan ẹni tí kò fẹ́ràn arákùnrin rẹ̀ gẹ́gẹ́ bí ellipsis Gíríìkì ṣe béèrè. Ó tún rọ́pò àfihàn àdéhùn «kò bá máa ṣe» pẹ̀lú ọ̀nà tí ó fi ìwà tí ó ń bá a lọ hàn, ó sì lo «fẹ́ràn» fún Yorùbá boṣewa tó dájú. A pa èdè ẹbí, akọ ẹyọ «arákùnrin», àti àìdájú ìbátan/orísun inú ἐκ τοῦ θεοῦ mọ́ nínú àlàyé ìsàlẹ̀.
