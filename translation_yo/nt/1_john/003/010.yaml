id: 1JN.3.10
reference: 1 John 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: yo
  text: 'Nípa èyí ni a fi mọ̀ kedere àwọn ọmọ Ọlọ́run àti àwọn ọmọ Èṣù: ẹnikẹ́ni tí kò máa ń ṣe òdodo[b] kì í ṣe ti Ọlọ́run[a], bẹ́ẹ̀ náà ni ẹni tí kò fẹ́ràn arákùnrin rẹ̀[c] kì í ṣe ti Ọlọ́run.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í wá láti ọ̀dọ̀ Ọlọ́run.” Gíríìkì lè tọ́ka sí orísun tàbí sí jíjẹ́ ti Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí òdodo tàbí ìdájọ́ òdodo, ṣùgbọ́n òdodo gẹ́gẹ́ bí ìwà títọ́ bá ìyàtọ̀ ìwà níbí mu jù.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “arákùnrin tàbí arábìnrin rẹ̀,” ìyẹn, onígbàgbọ́ ẹlẹgbẹ́ rẹ̀. Gíríìkì ní “arákùnrin rẹ̀” ní akọ ẹyọ kan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nípa èyí
  rationale: Ó tọ́ka sí ìpìlẹ̀ tàbí ọ̀nà tí a fi lè mọ ìyàtọ̀ náà, láì fi dandan pinnu bóyá ìtumọ̀ rẹ̀ jẹ́ ‘nínú èyí’ tàbí ‘láti inú èyí.’
- source_word: φανερά ἐστιν
  choice: fi hàn kedere
  rationale: Ó mú ìtumọ̀ ohun tí ó ṣe kedere tàbí tí a lè dá mọ̀ jáde ní Yorùbá àdánidá.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: àwọn ọmọ Ọlọ́run àti àwọn ọmọ Èṣù
  rationale: Ó pa àwòrán ìbátan ẹbí àti ìyàtọ̀ nípa ẹni tí wọ́n jẹ́ ti mọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: πᾶς ὁ μὴ ποιῶν
  choice: ẹnikẹ́ni tí kò bá máa ṣe
  rationale: ‘Máa ṣe’ fi agbára ìṣe tí ó jẹ́ àṣà tàbí ìwà tí ó ń bá a lọ hàn, kì í ṣe ìṣẹ̀lẹ̀ ẹyọ kan ṣoṣo.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìwà títọ́ ní ìbámu pẹ̀lú ìwà Ọlọ́run; ó tún lè ní ìtumọ̀ ìdájọ́ òdodo ní ibòmíràn.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: kì í ṣe láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa èrò orísun àti jíjẹ́ ti Ọlọ́run mọ́ láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: καὶ ὁ μὴ ἀγαπῶν
  choice: bẹ́ẹ̀ ni ẹni tí kò nífẹ̀ẹ́ ... pẹ̀lú
  rationale: Ó mú gbólóhùn tí a fi sílẹ̀ lábẹ́ òye—pé ẹni náà náà kì í ṣe láti ọ̀dọ̀ Ọlọ́run—hàn ní Yorùbá àdánidá.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Ó tẹ̀ lé akọ ẹyọ kan inú Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó lè gbòòrò sí arákùnrin tàbí arábìnrin nínú ìgbàgbọ́ hàn.
theological_decisions:
- issue: Èdè ìbátan ẹbí fún ìdánimọ̀ ti ẹ̀mí àti ìwà
  choice: àwọn ọmọ Ọlọ́run àti àwọn ọmọ Èṣù
  alternative: àwọn ènìyàn tí ó jẹ́ ti Ọlọ́run àti àwọn ènìyàn tí ó jẹ́ ti Èṣù
  rationale: Gíríìkì lo ‘ọmọ’ ní tààràtà; pípa èdè yìí mọ́ dáàbò bo àwòrán àti ìfọ̀kànsìn Johanu.
- issue: Ìtumọ̀ ἀδελφός tí ó jẹ́ akọ
  choice: arákùnrin rẹ̀
  alternative: arákùnrin tàbí arábìnrin rẹ̀ nínú ìgbàgbọ́
  rationale: Ọ̀rọ̀ orísun jẹ́ akọ ẹyọ kan. A pa á mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé agbára ìtumọ̀ tó gbòòrò nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Gbólóhùn náà pa ìfarahàn ìwà tí ó ń bá a lọ àti èdè ẹbí Johanu mọ́.
