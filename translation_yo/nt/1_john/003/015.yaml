id: 1JN.3.15
reference: 1 John 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: yo
  text: Ẹnikẹ́ni tí ó bá kórìíra arákùnrin rẹ̀[b] jẹ́ apànìyàn, ẹ sì mọ̀ pé kò sí apànìyàn kankan tí ó ní ìyè àìnípẹ̀kun tí ń dúró nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ń gbé inú rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì μένω jẹ́ ọ̀rọ̀ pàtàkì nínú àwọn ìwé Johanu, a sì lè túmọ̀ rẹ̀ sí “dúró,” “wà,” tàbí “gbé.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “arákùnrin rẹ̀” tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́ rẹ̀ nínú àyíká ọ̀rọ̀ yìí; ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ kan.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Ẹnikẹ́ni tí ó bá kórìíra
  rationale: Àpólà arọ́pò-orúkọ olùṣe ní àkókò ìsinsìnyí náà ń tọ́ka sí gbogbo ẹni tí ìkórìíra jẹ́ ìwà rẹ̀; ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá ó sì pa ìtumọ̀ gbogbogbò mọ́.
- source_word: ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Èdè Gíríìkì jẹ́ akọ ẹyọ kan. Nínú àyíká lẹ́tà náà, ó ṣeé ṣe kí ó túmọ̀ sí arákùnrin kan nínú ìgbàgbọ́, ṣùgbọ́n a kò fi ìtumọ̀ yẹn rọ́pò ọ̀rọ̀ orísun nínú ẹsẹ̀.
- source_word: ἀνθρωποκτόνος
  choice: apànìyàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì pa agbára ìdájọ́ ìwà rere inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οἴδατε
  choice: ẹ sì mọ̀
  rationale: ‘Ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀, ‘sì’ sì so gbólóhùn kejì mọ́ ti àkọ́kọ́ gẹ́gẹ́ bí καί.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: kò sí apànìyàn kankan tí ó ní
  rationale: 'Ìṣètò yìí sọ ìkọ̀ gbogbo ènìyàn náà ní Yorùbá àdánidá: kò sí ẹnikẹ́ni nínú ẹgbẹ́ àwọn apànìyàn tí ó ní ohun tí a mẹ́nu kàn.'
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Ọ̀rọ̀ yìí jẹ́ ìtumọ̀ Yorùbá tí ó mọ́gbọ́n dání fún ìyè tí kò ní òpin, ó sì bá ìlò Johanu mu.
- source_word: ἐν αὐτῷ μένουσαν
  choice: tí ń dúró nínú rẹ̀
  rationale: ‘Ń dúró’ pa ìtumọ̀ ìtẹ̀síwájú μένω mọ́, láìfi ọ̀rọ̀ ẹ̀sìn tí ó le fún òǹkàwé òde òní sí i.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ‘arákùnrin’
  choice: A pa ‘arákùnrin rẹ̀’ mọ́ nínú ẹsẹ̀, a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé ó ṣeé ṣe kí ó tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́ rẹ̀.
  alternative: arákùnrin tàbí arábìnrin rẹ̀; onígbàgbọ́ ẹlẹgbẹ́ rẹ̀
  rationale: Àyíká ọ̀rọ̀ Johanu dá lórí ìfẹ́ láàárín àwùjọ àwọn onígbàgbọ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ kan. Ìtumọ̀ náà kò yẹ kí ó yanjú ìwọ̀n ọ̀rọ̀ náà ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ μένω nínú àwọn ìwé Johanu
  choice: tí ń dúró nínú rẹ̀
  alternative: tí ń gbé inú rẹ̀; tí ń wà nínú rẹ̀
  rationale: ‘Ń dúró’ fi ìtẹ̀síwájú tàbí ìfaradà hàn, ó sì jẹ́ kí ìsopọ̀ pẹ̀lú kókó pàtàkì μένω nínú àwọn ìwé Johanu wà láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹ’ láti fi ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀ hàn, a sì yan ‘kò sí … kankan’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ìkọ̀ gbogbogbò.
