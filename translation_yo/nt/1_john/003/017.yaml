id: 1JN.3.17
reference: 1 John 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: yo
  text: 'Ṣùgbọ́n ẹni tí ó bá ní ohun ìní ayé yìí, tí ó sì rí arákùnrin rẹ̀[a] tí ó ṣe aláìní, síbẹ̀ tí ó sì di ìyọ́nú rẹ̀ mọ́ ọn,[b] báwo ni ìfẹ́ Ọlọ́run[c] ṣe ń gbé inú rẹ̀?


    [a] Tàbí “arákùnrin tàbí arábìnrin”; èdè Gíríìkì ní “arákùnrin,” ó sì lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ ẹni.


    [b] Tàbí “tí ó di àánú rẹ̀ mọ́ ọn”; ní tààràtà, “tí ó ti àwọn ohun inú rẹ̀ pa mọ́ kúrò lọ́dọ̀ rẹ̀,” èyí jẹ́ ọ̀nà àsọyé fún dídá àánú àtọkànwá dúró.


    [c] “Ìfẹ́ Ọlọ́run” lè túmọ̀ sí ìfẹ́ tí Ọlọ́run ní tí ó sì ń ṣiṣẹ́ nínú ẹni náà, tàbí ìfẹ́ tí ẹni náà ní sí Ọlọ́run.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “arákùnrin tàbí arábìnrin”; èdè Gíríìkì ní “arákùnrin,” ó sì lè dúró fún onígbàgbọ́ ẹlẹgbẹ́ ẹni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tí ó di àánú rẹ̀ mọ́ ọn”; ní tààràtà, “tí ó ti àwọn ohun inú rẹ̀ pa mọ́ kúrò lọ́dọ̀ rẹ̀,” èyí jẹ́ ọ̀nà àsọyé fún dídá àánú àtọkànwá dúró.
    reason: lexical_alternative
  - marker: c
    text: “Ìfẹ́ Ọlọ́run” lè túmọ̀ sí ìfẹ́ tí Ọlọ́run ní tí ó sì ń ṣiṣẹ́ nínú ẹni náà, tàbí ìfẹ́ tí ẹni náà ní sí Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: ohun ìní ayé yìí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, βίος ń tọ́ka sí ohun àmúṣọrọ̀ tàbí ohun ìní ayé tí a lè fi ran aláìní lọ́wọ́, kì í ṣe ‘ìyè’ lásán.
- source_word: θεωρῇ
  choice: rí
  rationale: ‘Rí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ojú rí ẹni náà àti mímọ ipò àìní rẹ̀.
- source_word: ἀδελφὸν
  choice: arákùnrin
  rationale: Èdè Gíríìkì jẹ́ akọ ẹyọ kan. A pa ìtumọ̀ gangan mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìlò aṣojú rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: χρείαν ἔχοντα
  choice: tí ó ṣe aláìní
  rationale: Èyí túmọ̀ ‘ẹni tí ó ní àìní’ lọ́nà Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: tí ó sé ọkàn àánú rẹ̀ mọ́ ọn
  rationale: σπλάγχνα túmọ̀ sí àwọn ohun inú ní tààràtà, ṣùgbọ́n ó jẹ́ àsọyé fún àánú jíjinlẹ̀. Gbólóhùn yìí fi ìmọ̀ọ́mọ̀ kọ̀ láti ṣàánú hàn ní Yorùbá òde òní.
- source_word: πῶς
  choice: báwo ni ... ṣe
  rationale: Èyí pa ìrísí ìbéèrè àtakò ti Gíríìkì mọ́ láìfi ọ̀rọ̀ bí ‘lè’ kún un.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: 'Àkópọ̀ ọ̀rọ̀ Yorùbá yìí pa àìdájú genitive náà mọ́: ó lè tọ́ka sí ìfẹ́ Ọlọ́run sí ènìyàn tàbí ìfẹ́ ènìyàn sí Ọlọ́run.'
- source_word: μένει ἐν αὐτῷ
  choice: ń gbé inú rẹ̀
  rationale: ‘Ń gbé inú rẹ̀’ jẹ́ ọ̀nà àdánidá láti fi ìtẹ̀síwájú wíwà tàbí gbígbé inú ẹni hàn, ó sì bá ìlò pàtàkì μένω nínú àwọn ìwé Johanu mu.
theological_decisions:
- issue: Àìdájú ìtumọ̀ ‘ἡ ἀγάπη τοῦ θεοῦ’
  choice: ìfẹ́ Ọlọ́run
  alternative: ìfẹ́ tí Ọlọ́run ní sí i; tàbí ìfẹ́ rẹ̀ sí Ọlọ́run
  rationale: Gíríìkì lè gba ìtumọ̀ méjèèjì, ẹ̀kọ́ Johanu sì so ìfẹ́ tí Ọlọ́run fúnni àti ìfẹ́ tí onígbàgbọ́ ń fi hàn pọ̀. A kò yanjú ìforígbárí náà nínú ẹsẹ̀.
- issue: Ìtumọ̀ akọ nínú ἀδελφὸν
  choice: arákùnrin
  alternative: arákùnrin tàbí arábìnrin; onígbàgbọ́ ẹlẹgbẹ́ ẹni
  rationale: A tẹ̀ lé akọ ẹyọ kan nínú orísun, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ó lè ṣiṣẹ́ gẹ́gẹ́ bí aṣojú fún onígbàgbọ́ ẹlẹgbẹ́ ẹni.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘ọkàn àánú’ gẹ́gẹ́ bí àsọyé Yorùbá àdánidá fún σπλάγχνα, nígbà tí àlàyé ìsàlẹ̀ pa àwòrán gangan ti Gíríìkì mọ́.
