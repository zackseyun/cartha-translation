  source_fidelity: 'Àwọn ìtumọ̀ pàtàkì jẹ́ olóòtọ́ sí Gíríìkì: ìpè náà, ìyàlẹ́nu tó wà nínú ποταπή, ìfẹ́ tí Baba ti fi hàn, jíjẹ́ ọmọ Ọlọ́run, àti ìdí tí ayé kò fi mọ̀ àwọn onígbàgbọ́. Ṣùgbọ́n “ó mú kí a máa pè wá” kò dá ìbáṣepọ̀ ἵνα κληθῶμεν hàn lọ́nà Yorùbá tó rọrùn, “máa” sì lè fi ìtumọ̀ ìṣe àṣà/tí ń ṣẹlẹ̀ léraléra kún un.'
  naturalness: 'A tún ọ̀rọ̀ náà ṣe sí ìkọ́lé Yorùbá tó wọ́pọ̀: “tí ó fi jẹ́ pé a ń pè wá…” Ó pa ìṣe passive tí a kò sọ ẹni tó ń pè wọn mọ́, ó sì yọ ìṣòro ìlò “máa” kúrò. “Àwọn ọmọ Ọlọ́run” mú ọ̀pọ̀ τέκνα hàn kedere, bí ó tilẹ̀ jẹ́ pé “ọmọ Ọlọ́run” lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀.'
