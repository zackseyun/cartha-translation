id: 1JN.3.1
reference: 1 John 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: yo
  text: Ẹ wo irú ìfẹ́ tí Baba ti fún wa[a], tí ó fi jẹ́ pé a ń pè wá ní àwọn ọmọ Ọlọ́run—àti pé bẹ́ẹ̀ ni a jẹ́.[b] Ìdí nìyí tí ayé kò fi mọ̀ wá[c], nítorí kò mọ̀ ọ́.[d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “irú ìfẹ́ wo”; nínú ìtumọ̀ ìbílẹ̀, “ìfẹ́ tó pọ̀ tó bẹ́ẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń fi ìyàlẹ́nu tẹnu mọ́ irú tàbí ànímọ́ ìfẹ́ Baba, kì í ṣe bí ó ti pọ̀ tó nìkan.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan kò ní “àti pé bẹ́ẹ̀ ni a jẹ́.”
    reason: textual_variant
  - marker: c
    text: Tàbí, “ayé kò dá wa mọ̀ … kò dá a mọ̀.”
    reason: lexical_alternative
  - marker: d
    text: Ó ṣeé ṣe jù lọ pé “ọ́” ń tọ́ka sí Baba nínú ẹsẹ̀ yìí; àwọn kan lóye rẹ̀ gẹ́gẹ́ bí Kristi nítorí àyíká ọ̀rọ̀ Johanu.
    reason: alternative_reading
  - marker: e
    text: 'A tún lè pín gbólóhùn náà báyìí: “Ayé kò mọ̀ wá: nítorí kò mọ̀ ọ́.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἴδετε
  choice: Ẹ wo
  rationale: Ọ̀rọ̀ àṣẹ náà ń pe ọ̀pọ̀ ènìyàn láti fiyè sí ohun ìyanu kan; “Ẹ wo” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, tí kò sì ní ìrísí ọ̀rọ̀ àtijọ́.
- source_word: ποταπὴν ἀγάπην
  choice: irú ìfẹ́
  rationale: ποταπή ń tẹnu mọ́ irú tàbí ànímọ́ ìfẹ́ náà pẹ̀lú ìyàlẹ́nu, kì í ṣe bí ó ti tóbi nìkan.
- source_word: δέδωκεν ἡμῖν
  choice: ti fi fún wa
  rationale: Àkókò perfect Gíríìkì tọ́ka sí ohun tí Baba ti ṣe tí àbájáde rẹ̀ sì ṣì wà; “ti fi fún wa” mú ìtumọ̀ yẹn jáde lọ́nà àdánidá.
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: ó mú kí a máa pè wá ní ọmọ Ọlọ́run
  rationale: Èyí pa ìtumọ̀ àbájáde/èrò ἵνα àti ìṣe àìsọ ẹni tó ṣe é nínú κληθῶμεν mọ́, láì sọ τέκνα di “àwọn ọmọkùnrin” nìkan.
- source_word: καὶ ἐσμέν
  choice: àti pé ọmọ Ọlọ́run ni wá
  rationale: Ó pa ìjẹ́rìí pàtó inú Gíríìkì mọ́ pé kì í ṣe pé orúkọ náà nìkan ni a ń pè wọ́n, wọ́n jẹ́ ọmọ Ọlọ́run ní tòótọ́.
- source_word: διὰ τοῦτο
  choice: Ìdí nìyí
  rationale: Ó fi ìbáṣepọ̀ ìdí àti àbájáde tó wà pẹ̀lú ohun tó ṣáájú hàn ní Yorùbá tó rọrùn.
- source_word: ὁ κόσμος
  choice: ayé
  rationale: A pa àpẹẹrẹ ọ̀rọ̀ Johanu “ayé” mọ́, dípò ṣíṣe àlàyé rẹ̀ nínú ẹsẹ̀ gẹ́gẹ́ bí gbogbo ènìyàn tàbí ètò ènìyàn tó tako Ọlọ́run.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: kò mọ̀ wá
  rationale: γινώσκω lè túmọ̀ sí mímọ̀ tàbí dídámọ̀; “kò mọ̀ wá” ni ìtumọ̀ tààrà, ó sì bá “kò mọ̀ ọ́n” mu.
theological_decisions:
- issue: Ẹni tí αὐτόν (“ọ́n”) ń tọ́ka sí
  choice: Baba ni ẹni tó ṣeé ṣe jù lọ nínú ẹsẹ̀ yìí
  alternative: Kristi
  rationale: “Baba” ni orúkọ ẹni tó sún mọ́ ọ̀rọ̀ arọ́pò-orúkọ náà jù lọ nínú ẹsẹ̀ yìí, ṣùgbọ́n àyíká ẹ̀kọ́ Johanu lè mú kí àwọn kan lóye rẹ̀ gẹ́gẹ́ bí Kristi. A kò yanjú àìdánilójú yìí ní ìkọ̀kọ̀; àlàyé ìsàlẹ̀ pa ọ̀nà kejì mọ́.
- issue: Wíwà καὶ ἐσμέν nínú ọ̀rọ̀
  choice: A fi “àti pé ọmọ Ọlọ́run ni wá” sínú ẹsẹ̀
  alternative: Kí a má fi ọ̀rọ̀ náà sí i
  rationale: SBLGNT fi ọ̀rọ̀ náà sínú ẹsẹ̀, ó sì jẹ́ ìjẹ́rìí pàtàkì pé àwọn onígbàgbọ́ jẹ́ ọmọ Ọlọ́run. Àlàyé ìsàlẹ̀ sọ pé àwọn ìwé àfọwọ́kọ kan kò ní i.
translation_notes:
  register: Yorùbá àgbàjọ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. “Baba” àti “Ọlọ́run” jẹ́ àkọlé/orúkọ fún Ọlọ́run; “ọmọ” nínú Yorùbá kò dá akọ tàbí abo pàtó, nítorí náà ó bá τέκνα mu.
