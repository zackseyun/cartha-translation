id: 1JN.3.13
reference: 1 John 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ kí ó yà yín lẹ́nu, ẹ̀yin ará[a], bí ayé bá kórìíra yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ará” jẹ́ ọ̀pọ̀ akọ ní ìlànà gírámà, ṣùgbọ́n ó ṣeé ṣe kí ó ń tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Ẹ má ṣe jẹ́ kí ó yà yín lẹ́nu
  rationale: Ọ̀rọ̀ ìfòfin-dè yìí wà ní àkókò ìsinsìnyí, ó sì ń sọ fún ọ̀pọ̀ ènìyàn. Gbólóhùn Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé kí ohun náà má ṣe ya wọn lẹ́nu.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Èyí jẹ́ ọ̀rọ̀ ìpè sí ọ̀pọ̀ ènìyàn. “Ẹ̀yin ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún àwọn onígbàgbọ́ ẹlẹgbẹ́, láìfi ìtumọ̀ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: εἰ
  choice: bí ... bá
  rationale: Ìṣọ̀kan “bí ... bá” ń pa ìrísí gbólóhùn oníṣèpé mọ́, kò sì túmọ̀ ọ́ sí “nígbà tí” lọ́nà tí yóò mú ìtumọ̀ náà le ju ti orísun lọ.
- source_word: μισεῖ
  choice: kórìíra
  rationale: “Kórìíra” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ìkórìíra tí ọ̀rọ̀ Gíríìkì náà ń sọ, ó sì bá ìṣe tí ń bá a lọ tàbí òtítọ́ gbogbogbò mu.
- source_word: ὁ κόσμος
  choice: ayé
  rationale: “Ayé” pa ọ̀rọ̀ àti ìwọ̀n ìtumọ̀ κόσμος mọ́. Ní àwọn ìwé Johanu ó lè tọ́ka sí àwọn ènìyàn tàbí ètò ìgbé ayé tí ó kọjú sí Ọlọ́run, ṣùgbọ́n a kò fi àlàyé ìtumọ̀ náà sínú ẹsẹ̀ fúnra rẹ̀.
theological_decisions:
- issue: Ìpè akọ aṣojú nínú ἀδελφοί
  choice: Lo “ẹ̀yin ará” nínú ọ̀rọ̀ pàtàkì, kí àlàyé nípa ìrísí akọ Gíríìkì wà ní àlàyé ìsàlẹ̀.
  alternative: “ẹ̀yin arákùnrin” tàbí “ẹ̀yin arákùnrin àti arábìnrin”
  rationale: ἀδελφοί jẹ́ akọ ní ìlànà gírámà Gíríìkì, ṣùgbọ́n ó ṣeé ṣe kí ó ń bá gbogbo ìjọ onígbàgbọ́ sọ̀rọ̀. “Ẹ̀yin ará” ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bá ipò yìí mu; àlàyé ìsàlẹ̀ ń jẹ́ kí ìrísí orísun hàn láìfi akọ nìkan sí ibi tí orísun lè ń lo akọ gẹ́gẹ́ bí aṣojú gbogbo ẹgbẹ́.
- issue: Ìtumọ̀ κόσμος nínú àwọn ìwé Johanu
  choice: Túmọ̀ rẹ̀ sí “ayé” láìfi àlàyé ìtumọ̀ kún ọ̀rọ̀ pàtàkì.
  alternative: “ètò ayé tí ó kọjú sí Ọlọ́run” tàbí “àwọn ènìyàn ayé tí ó ṣọ̀tẹ̀ sí Ọlọ́run”
  rationale: “Ayé” ń pa fífẹ̀ ìtumọ̀ àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́. Àyíká ni yóò fi hàn bí ó ṣe ń tọ́ka sí ayé ènìyàn tí ó kọjú sí Ọlọ́run; fífi ìtumọ̀ náà sí inú ẹsẹ̀ yóò jẹ́ àlàyé ju ìtumọ̀ lọ.
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Ẹ má ṣe jẹ́ kí ó yà yín lẹ́nu” jẹ́ àdánidá ju àfarawé gírámà Gíríìkì lọ, nígbà tí “bí ... bá” àti “ayé” ń pa àìdánilójú àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ orísun mọ́.
