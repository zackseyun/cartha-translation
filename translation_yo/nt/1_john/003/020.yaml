id: 1JN.3.20
reference: 1 John 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: yo
  text: nítorí bí ọkàn wa bá dá wa lẹ́bi[a], Ọlọ́run tóbi ju ọkàn wa lọ[b], ó sì mọ ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ọkàn wa bá fi ẹ̀sùn kàn wa” tàbí “bí ọkàn wa bá rí àléébù nínú wa.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà pé “Ọlọ́run tóbi ju ọkàn wa lọ” lè tọ́ka sí pé Ọlọ́run mọ gbogbo òtítọ́ nípa wa ju bí àwa fúnra wa ṣe mọ̀ ọ́ lọ, ó sì lè tún fi hàn pé àṣẹ rẹ̀ ga ju ìdálẹ́bi tí ọkàn wa fi lé wa lórí lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: nítorí
  rationale: ὅτι àkọ́kọ́ ń ṣàlàyé ìdí fún ohun tí a sọ ṣáájú; “nítorí” mú ipa ìṣàlàyé yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe subjunctive, ἐὰν fi ipò àdéhùn hàn; ìṣètò “bí ... bá” ni ọ̀nà Yorùbá tó ṣe déédé jù fún un.
- source_word: καταγινώσκῃ
  choice: dá ... lẹ́bi
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí dídálẹ́bi, fífi ẹ̀sùn kàn, tàbí rí àléébù. “Dá wa lẹ́bi” bá àwòrán ìdájọ́ inú ọkàn mu, láìsọ ìtumọ̀ náà di ti ẹ̀kọ́ kan ṣoṣo.
- source_word: ἡ καρδία ἡμῶν
  choice: ọkàn wa
  rationale: A pa àwòrán καρδία mọ́ gẹ́gẹ́ bí “ọkàn,” dípò kí a túmọ̀ rẹ̀ ní pàtó sí “ẹ̀rí-ọkàn”; èyí pa fífẹ̀ ìtumọ̀ Gíríìkì mọ́.
- source_word: ὅτι
  choice: '[a kò túmọ̀ ọ́ lọ́tọ̀ ní ẹ̀ẹ̀kejì]'
  rationale: ὅτι kejì lè fi àkóónú tàbí ìdí ìtùnú náà hàn. Ìṣètò gbólóhùn Yorùbá ń pa ipa rẹ̀ mọ́ láìfi “pé” míì kún un, èyí tí yóò mú kí gbólóhùn náà le.
- source_word: μείζων
  choice: tóbi ju ... lọ
  rationale: A fi ìfiwéra náà sílẹ̀ ní fífẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe rí; a kò dín un kù sí títóbi nínú àánú, àṣẹ, tàbí ìmọ̀ nìkan.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún θεός ní àyíká yìí.
- source_word: τῆς καρδίας ἡμῶν
  choice: ju ọkàn wa lọ
  rationale: Ìṣètò “ju ... lọ” ni ọ̀nà àdánidá Yorùbá láti sọ genitive ìfiwéra Gíríìkì.
- source_word: γινώσκει πάντα
  choice: ó sì mọ ohun gbogbo
  rationale: “Ohun gbogbo” pa ìwọ̀n pípé πάντα mọ́, “ó sì” sì so gbólóhùn náà mọ́ ìṣáájú rẹ̀ bí καί ṣe rí.
theological_decisions:
- issue: Bí a ṣe máa lóye pé Ọlọ́run tóbi ju ọkàn wa lọ
  choice: A fi gbólóhùn náà sílẹ̀ ní fífẹ̀, láìdín títóbi Ọlọ́run kù sí àánú, àṣẹ, tàbí ìmọ̀ nìkan.
  alternative: Kí a sọ pé Ọlọ́run ṣàánú ju ẹ̀rí-ọkàn wa lọ; tàbí pé ìdájọ́ rẹ̀ borí ìdálẹ́bi ara ẹni; tàbí pé ó mọ òtítọ́ ní kíkún ju bí a ṣe mọ ara wa lọ.
  rationale: Gíríìkì sọ ní gbogbogbò pé Ọlọ́run tóbi ju ọkàn wa lọ, lẹ́yìn náà ó fi kún un pé ó mọ ohun gbogbo. Ìmọ̀ rẹ̀ ṣe pàtàkì nínú àyíká náà, ṣùgbọ́n ọ̀rọ̀ ìfiwéra náà ní agbára tó gbòòrò sí i; ìtumọ̀ kò gbọ́dọ̀ yan ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A pa “ọkàn” mọ́ gẹ́gẹ́ bí àwòrán inú ẹsẹ náà, a sì lo ẹyọ ọ̀rọ̀ náà bí Gíríìkì ṣe ṣe, bó tilẹ̀ jẹ́ pé ó dúró fún ìgbésí-ayé inú ti gbogbo wa.
