source:
  edition: SBLGNT
  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: yo
  text: 'Nítorí èyí ni ìhìn náà tí ẹ gbọ́ láti ìbẹ̀rẹ̀: pé kí a nífẹ̀ẹ́ ara wa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ó tún lè jẹ́: “kí a lè nífẹ̀ẹ́ ara wa,” tàbí “ẹ jẹ́ kí a nífẹ̀ẹ́ ara wa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: Nítorí
  rationale: Ó ń ṣàlàyé ohun tí a sọ ṣáájú; “Nítorí” mú ipa ìṣàlàyé náà jáde ní Yorùbá àdánidá.
- source_word: ἀγγελία
  choice: ìhìn iṣẹ́
  rationale: Ó túmọ̀ sí ìhìn tàbí ọ̀rọ̀ tí a kéde; “ìhìn iṣẹ́” ṣe kedere, ó sì bá èdè Bíbélì Yorùbá mu láì di ọ̀rọ̀ àtijọ́.
- source_word: ἣν ἠκούσατε
  choice: tí ẹ̀yin ti gbọ́
  rationale: Aorist Gíríìkì tọ́ka sí ohun tí àwọn olùgbọ́ ti gbà tẹ́lẹ̀; “ti gbọ́” sọ ìṣe tó ti ṣẹlẹ̀ ní Yorùbá àdánidá, “ẹ̀yin” sì mú ẹni kejì ọ̀pọ̀ hàn kedere.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Ó pa gbólóhùn pàtàkì ti Johanu mọ́, ó sì ní ìtumọ̀ àdánidá ní Yorùbá.
- source_word: ἵνα
  choice: pé kí
  rationale: Ní àyíká yìí, ἵνα lè ṣàfihàn ohun tí ìhìn náà ní nínú rẹ̀ pẹ̀lú agbára ìtọ́ni; “pé kí” pa ìtumọ̀ méjèèjì mọ́ láì fi ipa ète nìkan lé e.
- source_word: ἀγαπῶμεν
  choice: kí a máa nífẹ̀ẹ́
  rationale: Subjunctive náà ní agbára ìtọ́ni, present stem náà sì lè tọ́ka sí ìṣe tí ó ń bá a lọ; “kí a máa nífẹ̀ẹ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ojúṣe ìfẹ́ tó ń tẹ̀ síwájú.
- source_word: ἀλλήλους
  choice: ara wa
  rationale: “Ara wa” ni ọ̀nà Yorùbá àdánidá fún reciprocal “one another,” ó sì bá ìtumọ̀ ìfẹ́ láàárín àwọn ọmọ ìjọ mu.
theological_decisions:
- issue: Agbára ἵνα ἀγαπῶμεν ἀλλήλους
  choice: pé kí a máa nífẹ̀ẹ́ ara wa
  alternative: kí a lè máa nífẹ̀ẹ́ ara wa; ẹ jẹ́ kí a máa nífẹ̀ẹ́ ara wa
  rationale: Ìtumọ̀ àkọ́kọ́ fi hàn pé ìfẹ́ ara ẹni sí ara ẹni ni kókó àti ìtọ́ni inú ìhìn náà. Kò sọ ọ́ di ète nìkan bí “kí a lè,” bẹ́ẹ̀ ni kò yí gírámà rẹ̀ padà sí àṣẹ tààrà bí “ẹ jẹ́ kí a.”
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ẹ̀yin” mú ọ̀pọ̀ ènìyàn tí a ń bá sọ̀rọ̀ hàn; “a” ní apá kejì jẹ́ gbogbo àwọn onígbàgbọ́, tó fi ẹni tó ń kọ̀wé sí wọn kún un.
