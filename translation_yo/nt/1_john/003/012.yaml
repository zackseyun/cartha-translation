id: 1JN.3.12
reference: 1 John 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: yo
  text: Kì í ṣe bí Káínì, ẹni tí ó wá láti ọ̀dọ̀ Ẹni Búburú náà[a], tí ó sì ṣekúpa[b] arákùnrin rẹ̀. Kí sì ni ìdí tí ó fi ṣekúpa rẹ̀? Nítorí àwọn ìṣe rẹ̀ jẹ́ ibi, ṣùgbọ́n àwọn ti arákùnrin rẹ̀ jẹ́ òdodo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “láti inú ibi.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ibi fúnra rẹ̀, ṣùgbọ́n nínú àwọn ìwé Johanu ó sábà máa ń tọ́ka sí Ẹni Búburú náà.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lágbára ju “pa” lásán lọ; ó ní ìtumọ̀ ṣíṣekúpa tàbí pípa bí ẹran.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Kì í ṣe bí Káínì
  rationale: Ó pa àfiwé aláìní náà mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti tẹ̀ síwájú láti inú àṣẹ ẹsẹ tó ṣáájú.
- source_word: ἐκ τοῦ πονηροῦ
  choice: wá láti ọ̀dọ̀ ẹni ibi náà
  rationale: “Láti ọ̀dọ̀” fi orísun tàbí ìpilẹ̀ hàn, “ẹni ibi náà” sì pa ìtumọ̀ ẹni gidi tí gbolohun Johanu sábà máa ń ní mọ́, láìfi orúkọ míì kún un.
- source_word: ἔσφαξεν
  choice: ṣekúpa
  rationale: Ọ̀rọ̀ yìí lágbára ju “pa” lásán lọ, ó sì sọ ìpànìyàn oníwà ipá tí σφάζω ń tọ́ka sí ní Yorùbá tó ṣe kedere.
- source_word: ἀδελφὸν αὐτοῦ
  choice: arákùnrin rẹ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà, àdánidá, ó sì pa ìbátan ẹ̀gbọ́n-àbúrò tó ṣe pàtàkì nínú ìyàtọ̀ ìwà ẹsẹ náà mọ́.
- source_word: χάριν τίνος
  choice: Kí sì ni ìdí tí
  rationale: Èyí ni ọ̀nà Yorùbá òde òní tó ṣe kedere láti béèrè ìdí ohun kan, láìdi ọ̀rọ̀ Gíríìkì mú lọ́nà líle.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: àwọn ìṣe tirẹ̀ jẹ́ ibi
  rationale: “Àwọn ìṣe” bá ἔργα mu nínú àyíká ìwà yìí; “jẹ́ ibi” sì pa ìdájọ́ ìwà pẹ̀lú ìyàtọ̀ rẹ̀ sí “òdodo” mọ́.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: ṣùgbọ́n àwọn ti arákùnrin rẹ̀ jẹ́ òdodo
  rationale: “Àwọn” ń tọ́ka padà sí àwọn ìṣe, gẹ́gẹ́ bí Gíríìkì ṣe fi ọ̀rọ̀ náà sílẹ̀ nínú gbólóhùn kejì; “òdodo” sì sọ ìwà tó tọ́ níwájú Ọlọ́run àti nípa ìṣe.
theological_decisions:
- issue: Bóyá τοῦ πονηροῦ túmọ̀ sí ẹni gidi (“ẹni ibi náà”) tàbí ibi gẹ́gẹ́ bí ohun àìní-ẹni
  choice: 'ẹni gidi: “ẹni ibi náà”'
  alternative: 'ohun àìní-ẹni: “ibi”'
  rationale: Lílo àpilẹ̀kọ pẹ̀lú πονηρός nínú àwọn ìwé Johanu sábà máa ń tọ́ka sí ẹni ibi gidi. Àkọsílẹ̀ ìsàlẹ̀ sì pa àǹfààní ìtumọ̀ àìní-ẹni mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbo ènìyàn. A lo “ṣekúpa” láti pa agbára àwòrán ọ̀rọ̀ Gíríìkì mọ́, a sì fi àkọsílẹ̀ ṣàlàyé rẹ̀.
