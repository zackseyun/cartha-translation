id: 1JN.3.18
reference: 1 John 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: yo
  text: Ẹ̀yin ọmọ kékeré[a], kí a má ṣe nífẹ̀ẹ́ ní ọ̀rọ̀ tàbí ní ahọ́n[b], bí kò ṣe ní ìṣe àti ní òtítọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọmọ kékeré” jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́; a tún lè túmọ̀ rẹ̀ sí “ẹ̀yin ọmọ.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ó túmọ̀ sí “ní ahọ́n” ní tààrà; ìtumọ̀ rẹ̀ níbí ni ọ̀rọ̀ ẹnu.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “ní ohun tí a ń ṣe àti ní òtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Ẹ̀yin ọmọ kékeré
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìpè ọ̀pọ̀ tí ó ní ìfẹ́ àti ìrẹ̀lẹ̀ nínú; “ọmọ kékeré” pa àwòrán ìdílé àti ìfẹ́ inú diminutive náà mọ́ láìfi “ọ̀wọ́n” tàbí “mi” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: μὴ ἀγαπῶμεν
  choice: kí a má ṣe nífẹ̀ẹ́
  rationale: 'Èyí fi ìṣírí ẹni-àkọ́kọ́ ọ̀pọ̀ inú subjunctive hàn lọ́nà Yorùbá tí ó ṣe déédéé: olùkọ̀wé fi ara rẹ̀ sínú ìpè náà.'
- source_word: λόγῳ
  choice: ní ọ̀rọ̀
  rationale: “Ọ̀rọ̀” jẹ́ ìtumọ̀ tó sún mọ́ λόγος, ó sì pa ìfiwéra kúkúrú pẹ̀lú “ìṣe” mọ́.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: tàbí ní ahọ́n
  rationale: “Ahọ́n” pa àwòrán gidi ti γλῶσσα mọ́, bí ó tilẹ̀ jẹ́ pé níbí ó dúró fún ọ̀rọ̀ ẹnu.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Nínú gbólóhùn òdì Yorùbá yìí, “bí kò ṣe” fi ìtakora alágbára ἀλλά hàn ní ti ẹ̀dá ju “ṣùgbọ́n” lọ.
- source_word: ἐν ἔργῳ
  choice: ní ìṣe
  rationale: “Ìṣe” mú ìtumọ̀ iṣẹ́ tàbí ohun tí a ṣe jáde, ó sì dá ìtakora “ọ̀rọ̀/ìṣe” dúró kedere.
- source_word: καὶ ἀληθείᾳ
  choice: àti ní òtítọ́
  rationale: “Òtítọ́” pa ìtumọ̀ gbooro àti ìró pàtàkì ἀλήθεια nínú àwọn ìwé Johanu mọ́, dípò kí a dín un kù sí òótọ́-ọkàn nìkan.
theological_decisions:
- issue: Ìtumọ̀ “òtítọ́” nínú “ní ìṣe àti ní òtítọ́”
  choice: Pa “òtítọ́” mọ́
  alternative: ní òótọ́-ọkàn; láìṣẹ̀tàn
  rationale: ἀλήθεια lè tọ́ka sí ìfẹ́ gidi, ṣùgbọ́n lílo ọ̀rọ̀ náà nínú àwọn ìwé Johanu tún lè ní ìtumọ̀ jíjinlẹ̀ nípa òtítọ́ Ọlọ́run. “Òtítọ́” pa àwọn ìtumọ̀ méjèèjì mọ́ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, oníyì, tí ó sì ṣeé lóye. A lo “kí a má ṣe” láti fi ìṣírí tí olùkọ̀wé fi ara rẹ̀ sínú rẹ̀ hàn; a sì pa ìfiwéra ọ̀rọ̀/ahọ́n sí ìṣe/òtítọ́ mọ́.
