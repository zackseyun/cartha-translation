id: 1JN.3.5
reference: 1 John 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: yo
  text: Ẹ̀yin sì mọ̀ pé òun farahàn láti mú àwọn ẹ̀ṣẹ̀ kúrò[a], ẹ̀ṣẹ̀ kò sì sí nínú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti kó àwọn ẹ̀ṣẹ̀ lọ,” tàbí “láti ru àwọn ẹ̀ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí mú kúrò, kó lọ, tàbí ru.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: ẹ̀yin mọ̀
  rationale: Ọ̀rọ̀ οἶδα ní ìrísí pípé ṣùgbọ́n ó sábà ní ìtumọ̀ àsìkò ìsinsìnyí ní Gíríìkì Koiné; “ẹ̀yin mọ̀” jẹ́ Yorùbá àdánidá.
- source_word: ἐκεῖνος
  choice: òun
  rationale: Ní àyíká ọ̀rọ̀ Johanu, arọ́pò-orúkọ yìí tọ́ka sí Kristi pẹ̀lú ìtẹnumọ́. “Òun” pa ìtẹnumọ́ náà mọ́ láìfi orúkọ tí kò sí nínú gbólóhùn Gíríìkì kún un.
- source_word: ἐφανερώθη
  choice: farahàn
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí wíwá Kristi sí ayé ní ọ̀nà tí ó hàn gbangba; “farahàn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ náà mu.
- source_word: ἵνα
  choice: láti
  rationale: “Láti” fi ète ìfarahàn rẹ̀ hàn ní Yorùbá àdánidá.
- source_word: τὰς ἁμαρτίας
  choice: àwọn ẹ̀ṣẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀, nítorí náà “àwọn ẹ̀ṣẹ̀” pa ọ̀pọ̀ náà mọ́.
- source_word: ἄρῃ
  choice: mú ... kúrò
  rationale: αἴρω lè túmọ̀ sí gbé, kó lọ, tàbí mú kúrò. “Mú àwọn ẹ̀ṣẹ̀ kúrò” sọ èrò ìyọkúrò di mímọ́ láìdín ìtumọ̀ rẹ̀ kù sí àlàyé ètùtù kan ṣoṣo.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Orúkọ ẹyọ tí kò ní article níhìn-ín dára jù lọ gẹ́gẹ́ bí “ẹ̀ṣẹ̀,” ó sì sọ àìní ẹ̀ṣẹ̀ rẹ̀ ní kíkún.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: “Nínú rẹ̀” jẹ́ ìtumọ̀ Yorùbá tààrà tí ó pa àwòrán àti ìtẹnumọ́ gbólóhùn Johanu mọ́.
theological_decisions:
- issue: Ẹni tí ἐκεῖνος ń tọ́ka sí
  choice: Jésù Kristi, tí a fi “òun” ṣàpẹẹrẹ
  alternative: “ẹni náà” ní ọ̀nà gbogbogbòò
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ fi hàn pé ẹni tó farahàn láti mú àwọn ẹ̀ṣẹ̀ kúrò, tí ẹ̀ṣẹ̀ kò sì sí nínú rẹ̀, ni Jésù Kristi. “Òun” jẹ́ kí ìtọ́kasí náà ṣe kedere láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún ẹsẹ náà.
- issue: Ìtumọ̀ αἴρω nígbà tí ohun tí ó ń ṣe sí jẹ́ àwọn ẹ̀ṣẹ̀
  choice: mú àwọn ẹ̀ṣẹ̀ kúrò
  alternative: ru tàbí kó àwọn ẹ̀ṣẹ̀ lọ
  rationale: Ẹsẹ náà tẹnumọ́ pé ète ìfarahàn Kristi ni yíyọ àwọn ẹ̀ṣẹ̀ kúrò. Àṣàyàn yìí kò fi ipa mú ọ̀rọ̀ náà wọ inú àwòrán ètùtù kan ṣoṣo, ó sì pa àìdánilójú ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún níbi tó yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “òun” fún ìtẹnumọ́ ἐκεῖνος, a sì yan “farahàn” gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἐφανερώθη.
