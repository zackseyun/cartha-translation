source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: yo
  text: Ẹ̀ṣẹ̀ àwọn ènìyàn kan hàn kedere[a], wọ́n sì ń ṣáájú wọn lọ sí ìdájọ́[b], ṣùgbọ́n ẹ̀ṣẹ̀ àwọn mìíràn ń tọ̀ wọ́n lẹ́yìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀ṣẹ̀ àwọn ènìyàn kan hàn gbangba, wọ́n sì ń ṣáájú wọn lọ sí ìdájọ́.”
    reason: lexical_alternative
  - marker: b
    text: Nínú àyíká ọ̀rọ̀ yìí, “ìdájọ́” lè túmọ̀ sí ìgbéyẹ̀wò tí a ń ṣe ní báyìí; síbẹ̀, ọ̀rọ̀ náà tún lè ní ìtumọ̀ tó gbòòrò sí i nípa ìdájọ́ Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Ẹ̀ṣẹ̀ àwọn ènìyàn kan
  rationale: Èyí fi hàn pé àwọn ẹ̀ṣẹ̀ náà jẹ́ ti àwọn ènìyàn kan, ó sì lo “ènìyàn” ní ìtumọ̀ gbogbogbò gẹ́gẹ́ bí ἄνθρωπος ṣe rí níbí.
- source_word: πρόδηλοί
  choice: hàn kedere
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún ohun tí ó ṣe kedere tàbí tí ó fara hàn gbangba.
- source_word: προάγουσαι
  choice: wọ́n sì ń ṣáájú wọn lọ
  rationale: “Wọ́n” àkọ́kọ́ tọ́ka sí àwọn ẹ̀ṣẹ̀, èkejì sì tọ́ka sí àwọn ènìyàn; ìtumọ̀ náà pa àwòrán pé ẹ̀ṣẹ̀ ń lọ níwájú ẹni mọ́.
- source_word: εἰς κρίσιν
  choice: sí ìdájọ́
  rationale: Ó pa agbára ìtọ́sọ́nà εἰς àti àìdánilójú nípa irú ìdájọ́ tí a ń sọ mọ́.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: ṣùgbọ́n ti àwọn mìíràn ń tọ̀ wọ́n lẹ́yìn
  rationale: “Ti àwọn mìíràn” dúró fún ẹ̀ṣẹ̀ àwọn ènìyàn mìíràn, ó sì pa àwòrán pé àwọn ẹ̀ṣẹ̀ náà ń bọ̀ lẹ́yìn wọn mọ́ láìṣàlàyé àkókò tàbí irú ìdájọ́ náà ju orísun lọ.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ κρίσις
  choice: ìdájọ́
  alternative: àyẹ̀wò tàbí ìgbéyẹ̀wò nínú ìjọ; ìdájọ́ Ọlọ́run níkẹyìn
  rationale: Àyíká ẹsẹ̀ náà lè tọ́ka sí ìgbéyẹ̀wò àwọn ènìyàn ní báyìí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì tún lè ní ìtumọ̀ ìdájọ́ Ọlọ́run tó gbòòrò. A kò fi ọ̀kan dí èkejì.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye. A lo arọ́pò-orúkọ láti pa àwòrán ẹni-bí-ohun pé àwọn ẹ̀ṣẹ̀ ń ṣáájú tàbí ń tọ̀ lẹ́yìn mọ́.
