id: 1TI.5.17
reference: 1 Timothy 5:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: yo
  text: Kí a kà àwọn alàgbà tí ń darí dáadáa sí àwọn tí ó yẹ fún ọlá ìlọ́po méjì[a], pàápàá[b] àwọn tí ń ṣiṣẹ́ kára nínú ọ̀rọ̀ àti kíkọ́ni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọlá tó jẹ́ ìlọ́po méjì.” Gbólóhùn náà lè ní ọ̀wọ̀ àti ìrànlọ́wọ́ ohun ìní nínú, pàápàá ní ìbámu pẹ̀lú ẹsẹ tó tẹ̀ lé e.
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lè lóye “pàápàá” sí “ìyẹn ni pé,” kí ó fi àwọn alàgbà tí a ń sọ̀rọ̀ nípa wọn hàn gẹ́gẹ́ bí àwọn tó ń ṣiṣẹ́ kára nínú ọ̀rọ̀ àti kíkọ́ni.
    reason: alternative_reading
  - marker: c
    text: “Nínú ọ̀rọ̀ àti kíkọ́ni” ṣeé ṣe kí ó tọ́ka sí iṣẹ́ ìsọ̀rọ̀, bí ìwàásù àti fífi ẹ̀kọ́ kọ́ni.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: àwọn alàgbà
  rationale: Nínú àwọn lẹ́tà pásítọ̀, ọ̀rọ̀ yìí ń tọ́ka sí àwọn aṣáájú tí ìjọ dá mọ̀, kì í ṣe àwọn àgbàlagbà ọkùnrin lásán. “Àwọn alàgbà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi ètò ìjọ kan pàtó kún un.
- source_word: καλῶς προεστῶτες
  choice: tí ń darí dáadáa
  rationale: Ó túmọ̀ sí ṣíṣe aṣáájú tàbí àbójútó. “Darí dáadáa” jẹ́ èdè àdánidá tó pa ìtumọ̀ àṣẹ àti ojúṣe aṣáájú mọ́ láìsọ ọ́ di ìṣàkóso líle.
- source_word: διπλῆς τιμῆς
  choice: ọlá ìlọ́po méjì
  rationale: 'Ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì ni, ó sì pa ààyè ìtumọ̀ rẹ̀ mọ́: ó lè ní ọ̀wọ̀ àti ìrànlọ́wọ́ ohun ìní nínú.'
- source_word: ἀξιούσθωσαν
  choice: kí a kà sí ẹni tí ó yẹ
  rationale: Ìlànà ọ̀rọ̀ yìí ń pe ìjọ láti mọ iye àwọn alàgbà náà, kí wọ́n sì gbà pé wọ́n yẹ fún ọlá.
- source_word: μάλιστα
  choice: pàápàá
  rationale: “Pàápàá” fi ìtẹnumọ́ sí ẹgbẹ́ kan láàárín àwọn alàgbà, láìfi tipátipá sọ pé ‘ìyẹn ni pé.’
- source_word: κοπιῶντες
  choice: àwọn tí ń ṣiṣẹ́ kára
  rationale: Ó fi ìsapá líle àti làálàá hàn ní èdè Yorùbá òde òní tó ṣe kedere.
- source_word: ἐν λόγῳ
  choice: nínú ọ̀rọ̀
  rationale: Ìtumọ̀ yìí pa fífẹ̀ λόγος mọ́; nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí iṣẹ́ ìsọ̀rọ̀ bí ìwàásù, ṣùgbọ́n a kò fi ìtumọ̀ tóóró yẹn sí inú ẹsẹ̀.
- source_word: διδασκαλίᾳ
  choice: kíkọ́ni
  rationale: “Kíkọ́ni” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì sọ iṣẹ́ fífi ẹ̀kọ́ kọ́ni ní kedere láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ onímọ̀ ní pàtó.
theological_decisions:
- issue: Ìtumọ̀ “ọlá ìlọ́po méjì” nípa àwọn aṣáájú ìjọ
  choice: A pa gbólóhùn fífẹ̀ náà mọ́ láìdín in kù sí ọ̀wọ̀ nìkan tàbí owó ìtọ́jú nìkan.
  alternative: ọ̀wọ̀ ìlọ́po méjì; owó ìtọ́jú ìlọ́po méjì; ọlá tó ní ìrànlọ́wọ́ ohun ìní nínú
  rationale: Ẹsẹ tó tẹ̀ lé e tọ́ka sí ìtọ́jú ohun ìní, ṣùgbọ́n τιμή tún lè túmọ̀ sí ọlá tàbí ọ̀wọ̀. Ìtumọ̀ yìí pa méjèèjì sílẹ̀ láìgbé ètò ẹ̀sìn kan wọ inú ẹsẹ̀.
- issue: Agbára μάλιστα
  choice: pàápàá
  alternative: ìyẹn ni pé
  rationale: “Pàápàá” pa ìtẹnumọ́ sí ẹgbẹ́ kan mọ́, láìparí àríyànjiyàn bóyá gbogbo àwọn alàgbà ló ń kọ́ni tàbí àwọn kan ló ya ara wọn sí iṣẹ́ náà jù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì yẹra fún àwọn ọ̀rọ̀ tó lè gbé ètò ìjọ tàbí ẹ̀kọ́ ìsìn ẹgbẹ́ kan wọ inú ẹsẹ̀.
