id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: yo
  text: 'tí a sì jẹ́rìí rere fún un nítorí àwọn iṣẹ́ rere rẹ̀: bí ó bá ti tọ́ àwọn ọmọ dàgbà, bí ó bá ti gba àlejò[a], bí ó bá ti fọ ẹsẹ̀ àwọn ẹni mímọ́[b], bí ó bá ti ran àwọn tí ó wà nínú ìpọ́njú lọ́wọ́, àti bí ó bá ti fi taratara lépa gbogbo iṣẹ́ rere[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “gba àwọn àjèjì tàbí àlejò sínú ilé.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ẹni mímọ́” níbí ni àwọn ènìyàn Ọlọ́run, ìyẹn àwọn onígbàgbọ́ ẹlẹgbẹ́ rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “tẹ̀lé gbogbo iṣẹ́ rere.” Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ fífi taratara lépa iṣẹ́ rere àti fífi ara mọ́ ọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: tí a sì jẹ́rìí rere sí nítorí àwọn iṣẹ́ rere rẹ̀
  rationale: Ó pa ìtumọ̀ participle passive mọ́—àwọn ẹlòmíràn ni wọ́n ń jẹ́rìí sí i—ó sì sọ pé iṣẹ́ rere rẹ̀ ni ìpìlẹ̀ ẹ̀rí náà.
- source_word: εἰ
  choice: bí ó bá ti
  rationale: Ó pa àtòjọ àwọn ànímọ́ ìdánilójú tí εἰ ń mú wọlé mọ́, ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: ἐτεκνοτρόφησεν
  choice: tọ́ àwọn ọmọ dàgbà
  rationale: Èyí túmọ̀ sí títọ́jú àti títọ́ àwọn ọmọ dàgbà, láì sọ pé ọmọ inú rẹ̀ ni wọ́n.
- source_word: ἐξενοδόχησεν
  choice: gba àlejò
  rationale: Ọ̀rọ̀ Gíríìkì náà dá lórí gbígba àlejò tàbí àjèjì sínú ilé; ọ̀rọ̀ yìí ṣe kedere ó sì jẹ́ ti ẹ̀dá Yorùbá.
- source_word: ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Ó pa èdè ìyàsọ́tọ̀ fún Ọlọ́run mọ́, dípò kíkàn túmọ̀ rẹ̀ sí ‘àwọn onígbàgbọ́.’
- source_word: πόδας ἔνιψεν
  choice: fọ ẹsẹ̀
  rationale: Ó pa iṣẹ́ ìrẹ̀lẹ̀ gidi tí ọ̀rọ̀ orísun mẹ́nu kàn mọ́.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: ran àwọn tí ó wà nínú ìpọ́njú lọ́wọ́
  rationale: Ó gba ìtumọ̀ ìrànlọ́wọ́ sí àwọn tí ìṣòro, ìnira, tàbí ìkà ń pọ́n láì dín un kù sí inúnibíni nìkan.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: fi taratara lé gbogbo iṣẹ́ rere
  rationale: ἐπακολουθέω túmọ̀ sí títẹ̀lé lẹ́yìn; nínú àyíká ìwà rere yìí, ‘fi taratara lé’ pa àwòrán ìtẹ̀lé àti ìfọkànsìn mọ́ láì túmọ̀ rẹ̀ sí iṣẹ́ tí ó kan ṣe lẹ́ẹ̀kan.
theological_decisions:
- issue: Ẹni tí ἁγίων ń tọ́ka sí
  choice: àwọn ẹni mímọ́
  alternative: àwọn onígbàgbọ́
  rationale: Nínú ìlò Pọ́ọ̀lù, ọ̀rọ̀ náà sábà máa ń tọ́ka sí àwọn ènìyàn Ọlọ́run tí a yà sí mímọ́. Ìtumọ̀ pàtàkì náà wà nínú ọ̀rọ̀ àkọ́kọ́, àlàyé sì wà ní àlàyé ìsàlẹ̀.
- issue: Ìwọ̀n ìtumọ̀ ἐπηκολούθησεν
  choice: fi taratara lé gbogbo iṣẹ́ rere
  alternative: tẹ̀lé gbogbo iṣẹ́ rere
  rationale: Yíyan yìí pa ìrísí ‘tẹ̀lé lẹ́yìn’ mọ́, ṣùgbọ́n ó tún fi ìsapá àti ìfaramọ́ tí ọ̀rọ̀ náà lè ní nínú àyíká yìí hàn, láì sọ ọ́ di ẹ̀kọ́ ìsìn pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ rẹ̀ jẹ́ ọlọ́wọ̀, adayeba, ó sì yẹ fún kíkà ní gbangba. A lo ‘àlejò’ fún ìṣe àlejò gbígbà, ‘àwọn ẹni mímọ́’ fún ọ̀rọ̀ ìsìn pàtàkì, àti ‘ìpọ́njú’ ní ìtumọ̀ gbígbòòrò.
