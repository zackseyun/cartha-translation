  text: Χήρας τίμα τὰς ὄντως χήρας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: yo
  text: Fi ọlá fún àwọn opó tí wọ́n jẹ́ opó ní tòótọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Pèsè fún àwọn opó tí wọ́n jẹ́ opó ní tòótọ́.” Nínú àyíká ọ̀rọ̀ yìí, “fi ọlá fún” lè ní ìtumọ̀ pípèsè ohun àìní fún wọn pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: àwọn opó
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn obìnrin tí ọkọ wọn ti kú; fọọ́mù ọ̀pọ̀ ni, ó sì jẹ́ ohun tí àṣẹ náà kan.
- source_word: τίμα
  choice: Bọlá fún
  rationale: Ìtumọ̀ pàtàkì rẹ̀ ni láti bu ọlá fún tàbí fi iyì hàn. Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí ó tún ní ìtọju nípa ohun àìní nínú, ṣùgbọ́n ‘bọlá fún’ kò dín ìtumọ̀ Gíríìkì náà kù sí ìrànlọ́wọ́ owó nìkan.
- source_word: τὰς ὄντως χήρας
  choice: àwọn opó tí wọ́n jẹ́ opó ní tòótọ́
  rationale: Àtúnsọ ‘opó’ pa ìtẹnumọ́ inú Gíríìkì mọ́, ó sì fi hàn pé àwọn tí ipò wọn bá àpèjúwe inú ẹsẹ̀ tó tẹ̀ lé mu ni a ń sọ̀rọ̀ nípa wọn.
- source_word: ὄντως
  choice: ní tòótọ́
  rationale: Ó fi ìyàtọ̀ tó ní ìtumọ̀ hàn—ìyẹn àwọn tí wọ́n jẹ́ bẹ́ẹ̀ gan-an—kì í ṣe ìtẹnumọ́ ọ̀rọ̀ lásán.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ τιμάω nínú àyíká ọ̀rọ̀
  choice: A lo ‘Bọlá fún,’ èyí tó gba ọ̀wọ̀ àti ìtọju tó ṣeé ṣe kí ó jẹ́ ti ohun àìní láàyè.
  alternative: Pèsè fún àwọn opó tí wọ́n jẹ́ opó ní tòótọ́.
  rationale: Àwọn ẹsẹ̀ tó yí i ká ń sọ̀rọ̀ nípa pípèsè fún àwọn opó, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà gbòòrò ju ìrànlọ́wọ́ ti ara tàbí ti owó nìkan lọ. Ìtumọ̀ àkọ́kọ́ pa ìfẹ̀ ọ̀rọ̀ náà mọ́, àlàyé ìsàlẹ̀ sì ṣàfihàn ohun tí àyíká ọ̀rọ̀ lè ní nínú.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. ‘Bọlá fún’ jẹ́ gbólóhùn àdánidá; a pa àtúnsọ ‘opó’ mọ́ láti ṣàfihàn ìtẹnumọ́ àti ìyàtọ̀ inú orísun Gíríìkì.
