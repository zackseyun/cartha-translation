id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: yo
  text: Má máa mu omi nìkan mọ́[a], ṣùgbọ́n máa lo wáìnì díẹ̀ nítorí ikùn rẹ àti àwọn àìsàn rẹ tí ń ṣẹlẹ̀ léraléra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ èdè Gíríìkì, “Má ṣe jẹ́ ẹni tí ń mu omi mọ́.” Ìtumọ̀ rẹ̀ ní àyíká yìí ni pé Tímótì kò gbọdọ̀ máa mu omi nìkan mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: Má ṣe ... mọ́
  rationale: Ó fi hàn pé kí Tímótì dá ìṣe kan tí ó ti ń ṣe tẹ́lẹ̀ dúró; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá fún àṣẹ òdì.
- source_word: ὑδροπότει
  choice: máa mu omi nìkan
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímu omi; ìyàtọ̀ pẹ̀lú wáìnì fi hàn pé mímu omi nìkan ni a ń sọ, kì í ṣe pé kí ó dá mímu omi dúró pátápátá.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó mú ìtọ́ni kejì wá gẹ́gẹ́ bí ohun tí ó yàtọ̀ sí ti àkọ́kọ́.
- source_word: οἴνῳ ὀλίγῳ
  choice: wáìnì díẹ̀
  rationale: Ó pa ọ̀rọ̀ pàtó fún wáìnì àti ìwọ̀n kékeré tí ὀλίγῳ sọ mọ́.
- source_word: χρῶ
  choice: máa lo
  rationale: χράομαι túmọ̀ sí lílo ohun kan; ‘máa lo’ jẹ́ títọ́, ó sì lè ní mímu rẹ̀ fún ìlera nínú ọ̀rọ̀ yìí láìfi èrò míì kún un.
- source_word: διὰ
  choice: nítorí
  rationale: Pẹ̀lú accusative, διά sọ ìdí tàbí ohun tí ó fa ìtọ́ni náà.
- source_word: στόμαχον
  choice: ikùn
  rationale: ‘Ikùn’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún stomach nínú àyíká ìlera.
- source_word: πυκνάς
  choice: tí ó máa ń ṣẹlẹ̀ lemọ́lemọ́
  rationale: Ó ṣàfihàn pé àwọn àìsàn náà ń ṣẹlẹ̀ ní ọ̀pọ̀ ìgbà.
- source_word: ἀσθενείας
  choice: àìsàn
  rationale: Nínú àyíká ikùn àti lílo wáìnì, àìsàn ara ni ìtumọ̀ tó ṣeé ṣe jù; Yorùbá lè lo ọ̀rọ̀ àkójọpọ̀ ẹyọ ‘àìsàn’ fún àwọn ìṣòro ìlera tí ń ṣẹlẹ̀ léraléra.
theological_decisions:
- issue: Bóyá kí a sọ ní kedere pé omi nìkan ni Tímótì ń mu
  choice: máa mu omi nìkan
  alternative: máa mu omi
  rationale: Ìyàtọ̀ tí ἀλλά àti ìtọ́ni láti lo wáìnì díẹ̀ dá sílẹ̀ fi hàn pé kì í ṣe ìfòfindè omi pátápátá; ‘nìkan’ dènà àṣìlóye náà.
- issue: Bóyá kí οἶνος dúró gẹ́gẹ́ bí wáìnì tàbí kí a sọ ọ́ di ohun mímu ìtọ́jú
  choice: wáìnì
  alternative: ohun mímu oníṣègùn
  rationale: Gíríìkì sọ οἶνος ní pàtó. ‘Wáìnì’ pa ìtumọ̀ náà mọ́ láìrọ̀ ọ́ tàbí láìfi ẹ̀kọ́ ìsìn kún un; ‘díẹ̀’ sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, àdánidá, ọ̀wọ̀, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo ‘wáìnì’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀ fún οἶνος, a sì pa àmì ohùn mọ́ níbi tí ó ti yẹ.
