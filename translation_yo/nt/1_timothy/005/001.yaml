id: 1TI.5.1
reference: 1 Timothy 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: yo
  text: Má ṣe bá ọkùnrin àgbà[a] wí, ṣùgbọ́n rọ̀ ọ́ bí baba, àti àwọn ọ̀dọ́kùnrin bí arákùnrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Má ṣe bá alàgbà wí líle.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọkùnrin àgbà” tàbí “alàgbà,” ṣùgbọ́n ìyàtọ̀ ọjọ́-orí nínú àyíká yìí mú kí “ọkùnrin àgbà” ṣeé fẹ́ràn jù.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: ọkùnrin àgbà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ọkùnrin tí ó dàgbà tàbí alàgbà nínú ìjọ. Ìfiwéra rẹ̀ pẹ̀lú νεωτέρους àti ìtẹ̀síwájú àwọn ẹgbẹ́ ọjọ́-orí àti akọ/abo ní ẹsẹ tó tẹ̀ lé mú kí ìtumọ̀ ọjọ́-orí, ‘ọkùnrin àgbà,’ bá àyíká mu jù.
- source_word: μὴ ἐπιπλήξῃς
  choice: Má ṣe bá ... wí
  rationale: ‘Bá ẹni wí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìbáwí tàbí ìbánijẹ́ ní ọ̀rọ̀. A kò fi ‘líle’ sínú àyọkà pàtàkì, kí a má bàa fi ìwọ̀n líle kan kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: ἀλλὰ παρακάλει
  choice: ṣùgbọ́n rọ̀ ọ́
  rationale: Nínú ìyàtọ̀ sí ìbáwí, ‘rọ̀ ọ́’ fi ìbẹ̀bẹ̀ tàbí ìṣílétí ọlọ́wọ̀ hàn, ó sì bá àpẹẹrẹ ìbátan baba mu.
- source_word: ὡς πατέρα
  choice: bí baba
  rationale: ‘Bí baba’ jẹ́ ìfiwéra tó ṣe déédéé, tó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: νεωτέρους
  choice: àwọn ọ̀dọ́kùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, àyíká ẹsẹ 2 sì ń ya àwọn ọkùnrin àti obìnrin sọ́tọ̀. ‘Àwọn ọ̀dọ́kùnrin’ pa ọjọ́-orí àti akọ mọ́.
- source_word: ὡς ἀδελφούς
  choice: bí arákùnrin
  rationale: Àyíká yìí ń sọ nípa àwọn ọkùnrin ní pàtó, nítorí náà ‘arákùnrin’ dára ju ọ̀rọ̀ àpapọ̀ akọ àti abo lọ. Yorùbá sábà máa ń lo orúkọ yìí láìfi àmì ọ̀pọ̀ sí i lẹ́yìn ‘àwọn’.
theological_decisions:
- issue: Bóyá Πρεσβυτέρῳ túmọ̀ sí ipò alàgbà ìjọ tàbí ọkùnrin tí ó dàgbà
  choice: 'Ìtumọ̀ ọjọ́-orí: ‘ọkùnrin àgbà’'
  alternative: ‘alàgbà’ tàbí ‘alàgbà ìjọ’
  rationale: 'Ìṣètò ọ̀rọ̀ yìí dá lórí ọjọ́-orí àti akọ/abo: ọkùnrin àgbà bí baba, ọ̀dọ́kùnrin bí arákùnrin, àti ní ẹsẹ tó tẹ̀ lé, obìnrin àgbà bí ìyá àti ọ̀dọ́bìnrin bí arábìnrin. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ ipò ìjọ tó ṣeé ṣe mọ́.'
- issue: Bóyá ἀδελφούς yẹ kí ó ní akọ àti abo papọ̀
  choice: ‘arákùnrin’
  alternative: ‘arákùnrin àti arábìnrin’
  rationale: Ní àyíká yìí, akọ ọ̀pọ̀ kì í ṣe ọ̀rọ̀ àpapọ̀; ó wà lára ìpín tó ń ya àwọn ọkùnrin àti obìnrin sọ́tọ̀.
translation_notes:
  register: A lo Yorùbá boṣewa tó níyì, tó sì rọrùn fún òǹkàwé òde òní. ‘Rọ̀ ọ́’ ń mú ohùn ìbẹ̀bẹ̀ ọlọ́wọ̀ ti παρακάλει jáde, nígbà tí ‘bí baba/arákùnrin’ pa àwòrán ìdílé inú Gíríìkì mọ́. Gbólóhùn ‘kí o sì máa rọ’ ni a fi ṣàlàyé ọ̀rọ̀-ìṣe tí Gíríìkì fi sílẹ̀ láti inú apá àkọ́kọ́.
