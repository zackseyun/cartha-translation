  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: yo
  text: Má ṣe gba ẹ̀sùn tí a fi kan alàgbà[a], bí kò ṣe nípa ẹ̀rí ẹlẹ́rìí méjì tàbí mẹ́ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àgbà ọkùnrin,” bí a bá lóye πρεσβυτέρου gẹ́gẹ́ bí ọ̀rọ̀ tó ń tọ́ka sí ọjọ́ orí dípò ipò alàgbà nínú ìjọ.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ yìí tẹ̀ lé ìlànà òfin inú Májẹ̀mú Láéláé pé a fi ẹnu ẹlẹ́rìí méjì tàbí mẹ́ta mú ọ̀ràn kanlẹ̀ (wo Diutarónómì 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: sí alàgbà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, πρεσβύτερος ṣeé ṣe jù lọ láti tọ́ka sí alàgbà tó jẹ́ aṣáájú nínú ìjọ; síbẹ̀, ó tún lè túmọ̀ sí àgbà ọkùnrin, èyí tí àlàyé ìsàlẹ̀ fi hàn.
- source_word: κατηγορίαν
  choice: ẹ̀sùn kan
  rationale: Ẹ̀sùn jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹ̀sùn tàbí ẹjọ́ tí a fi kan ẹnì kan, ó sì pa ìtumọ̀ ti ọ̀rọ̀ ìdájọ́ mọ́.
- source_word: μὴ παραδέχου
  choice: Má ṣe gba
  rationale: Gbólóhùn yìí fi hàn pé kí a má ṣe tẹ́wọ́ gba ẹ̀sùn náà fún àyẹ̀wò láìsí ẹ̀rí tó yẹ; kò túmọ̀ sí pé a ti pinnu bóyá ẹ̀sùn náà jẹ́ òótọ́.
- source_word: ἐκτὸς εἰ μὴ
  choice: bí kò ṣe
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìyọkúrò tàbí àyíká kan ṣoṣo tí ohun náà fi lè ṣẹlẹ̀.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: lórí ẹ̀rí àwọn ẹlẹ́rìí méjì tàbí mẹ́ta
  rationale: Ọ̀rọ̀ yìí mú agbára ẹ̀rí inú ἐπί jáde, ó sì pa ìró èdè òfin tó wà nínú ẹsẹ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ πρεσβυτέρου nínú àyíká ìjọ
  choice: alàgbà gẹ́gẹ́ bí aṣáájú ìjọ
  alternative: àgbà ọkùnrin
  rationale: Àyíká 1 Tímótì 5 àti lílo ọ̀rọ̀ náà nínú àwọn lẹ́tà olùṣọ́-àgùntàn mú kí ìtumọ̀ aṣáájú ìjọ ṣeé ṣe jù; àlàyé ìsàlẹ̀ sì pa ìtumọ̀ mìíràn mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A yan “alàgbà” fún ipò aṣáájú ìjọ, a sì fi ìtumọ̀ ọjọ́ orí sínú àlàyé ìsàlẹ̀. A tún lo “lórí ẹ̀rí” láti mú ìlànà ẹ̀rí òfin inú orísun náà hàn.
