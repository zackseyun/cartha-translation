id: 1TI.5.20
reference: 1 Timothy 5:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: yo
  text: Àwọn tí ń dẹ́ṣẹ̀, bá wọn wí níwájú gbogbo ènìyàn[b][a], kí àwọn yòókù pẹ̀lú lè ní ìbẹ̀rù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ń tẹ̀ síwájú nínú ẹ̀ṣẹ̀”; irú ọ̀rọ̀ ìṣe yìí lè tọ́ka sí ìwà ẹ̀ṣẹ̀ tí ń bá a lọ.
    reason: lexical_alternative
  - marker: b
    text: Àyíká ọ̀rọ̀ tó sún mọ́ ẹsẹ̀ yìí lè fi hàn pé àwọn alàgbà tí ń dẹ́ṣẹ̀ ni pàápàá ni a ń sọ̀rọ̀ nípa wọn, bí ó tilẹ̀ jẹ́ pé ẹsẹ̀ náà fúnra rẹ̀ kàn sọ pé “àwọn tí ń dẹ́ṣẹ̀.”
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: Àwọn tí ń dẹ́ṣẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ participle present tí a lò gẹ́gẹ́ bí orúkọ, ó sì túmọ̀ ní ti ara rẹ̀ sí ‘àwọn tí ń dẹ́ṣẹ̀.’ Àmì ìṣe tí ń lọ lọ́wọ́ lè tọ́ka sí fífaradà nínú ẹ̀ṣẹ̀, ṣùgbọ́n fifi ‘tẹ̀ síwájú’ sínú ọ̀rọ̀ pàtàkì yóò túmọ̀ ọ́ ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἐνώπιον πάντων
  choice: níwájú gbogbo ènìyàn
  rationale: Èyí pa ìtumọ̀ gangan ‘níwájú gbogbo’ mọ́, ó sì fi hàn pé ìbáwí náà ṣẹlẹ̀ ní gbangba.
- source_word: ἔλεγχε
  choice: bá wọn wí
  rationale: Nínú ọ̀rọ̀ ìtọ́nisọ́nà àti ìbáwí yìí, ‘bá wọn wí’ jẹ́ Yorùbá àdánidá fún ṣíṣe àfihàn àṣìṣe àti ṣíṣe àtúnṣe, láìfi ìtumọ̀ ìtìjú gbangba kún un.
- source_word: οἱ λοιποὶ
  choice: àwọn yòókù
  rationale: Ó tọ́ka sí àwọn mìíràn tí ó ṣẹ́ kù yàtọ̀ sí àwọn ẹni tí a ń bá wí; ‘àwọn yòókù’ ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: φόβον ἔχωσιν
  choice: lè ní ìbẹ̀rù
  rationale: Èyí tẹ̀ lé àkójọpọ̀ ọ̀rọ̀ Gíríìkì ‘ní ìbẹ̀rù’ ní pẹ̀kipẹ̀ki, láìdá a lójú pé ẹ̀rù lásán ni tàbí ìbẹ̀rù ọlọ́wọ̀.
theological_decisions:
- issue: Àwọn wo ni ‘àwọn tí ń dẹ́ṣẹ̀’ ń tọ́ka sí nínú àyíká ọ̀rọ̀ náà?
  choice: A fi ọ̀rọ̀ ẹsẹ náà sílẹ̀ ní gbogbogbò gẹ́gẹ́ bí ‘àwọn tí ń dẹ́ṣẹ̀,’ láìfi ‘àwọn alàgbà’ sínú ọ̀rọ̀ pàtàkì.
  alternative: Nítorí ẹsẹ 19–20 ń sọ̀rọ̀ nípa àwọn alàgbà, ó ṣeé ṣe kí àwọn alàgbà tí ń dẹ́ṣẹ̀ gan-an ni ọ̀rọ̀ náà ń tọ́ka sí.
  rationale: Gíríìkì ẹsẹ yìí kò tún sọ ‘àwọn alàgbà’; nítorí náà, a pa ọ̀rọ̀ rẹ̀ mọ́, a sì ṣàlàyé àyíká tó ṣeé ṣe nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní ọlá, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Bá wọn wí’ jẹ́ ọ̀rọ̀ tó yé àwọn ènìyàn lónìí, ‘níwájú gbogbo ènìyàn’ sì pa ìṣípayá gbangba tí Gíríìkì ní mọ́. A tẹ̀ lé bí àwọn àmì àlàyé [b][a] ṣe wà nínú ẹ̀dà ìtọ́kasí.
