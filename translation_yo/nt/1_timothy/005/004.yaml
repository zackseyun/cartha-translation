id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: yo
  text: Bí opó kan bá ní àwọn ọmọ tàbí ọmọ-ọmọ[a], kí wọ́n kọ́kọ́ kọ́ láti máa ṣe ojúṣe ìfọkànsìn nínú ìdílé tiwọn[b], kí wọ́n sì máa san ẹ̀san padà fún àwọn tó ṣáájú wọn nínú ìran[c], nítorí èyí jẹ́ ohun ìtẹ́wọ́gbà níwájú Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ọmọ tàbí àwọn àtọmọdọ́mọ.” Ọ̀rọ̀ Gíríìkì ἔκγονα lè ní ìtumọ̀ tó gbòòrò ju “ọmọ-ọmọ” lọ, ṣùgbọ́n níbí ó ṣeé ṣe kí ó tọ́ka sí ìran tó tẹ̀ lé e nínú ìdílé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí wọ́n máa fi ìfọkànsìn hàn nínú ìdílé tiwọn.” Ọ̀rọ̀ Gíríìkì so ìtọ́jú ìdílé pọ̀ mọ́ ìfọkànsìn sí Ọlọ́run.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “fún àwọn tó ṣáájú wọn.” Èyí lè túmọ̀ sí àwọn òbí wọn tàbí àwọn baba ńlá wọn. Ọ̀rọ̀ Gíríìkì πρόγονοι gbòòrò ju “àwọn òbí” lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: opó
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún obìnrin tí ọkọ rẹ̀ ti kú; àyíká ẹsẹ náà ń sọ̀rọ̀ nípa àwọn opó.
- source_word: τέκνα ἢ ἔκγονα
  choice: àwọn ọmọ tàbí ọmọ-ọmọ
  rationale: “Àwọn ọmọ” túmọ̀ τέκνα, “ọmọ-ọmọ” sì jẹ́ ọ̀nà àdánidá láti sọ ìran tó tẹ̀ lé e nínú àyíká ojúṣe ìdílé yìí; àlàyé ìsàlẹ̀ fi ìtumọ̀ gbígbòòrò ἔκγονα hàn.
- source_word: μανθανέτωσαν πρῶτον
  choice: kí àwọn náà kọ́kọ́ kọ́
  rationale: Ó pa agbára àṣẹ ẹni kẹta púpọ̀ mọ́, “kọ́kọ́” sì fi ipò àkọ́kọ́ ojúṣe ìdílé hàn.
- source_word: τὸν ἴδιον οἶκον
  choice: ìdílé tiwọn
  rationale: Níbí, οἶκος tọ́ka sí àwọn ènìyàn inú agbo ilé ju ilé gẹ́gẹ́ bí ilé gbígbé lọ; “tiwọn” ṣe aṣojú ἴδιον.
- source_word: εὐσεβεῖν
  choice: máa fi ìfọkànsìn hàn
  rationale: Ó pa ìtumọ̀ ẹ̀sìn—ìwà ìfọkànsìn sí Ọlọ́run—mọ́, nígbà tí àyíká fi hàn pé ìtọju ìdílé ni ìfọkànsìn náà ń farahàn.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: san ohun tí wọ́n jẹ … padà
  rationale: Gbólóhùn náà sọ nípa dídá ohun tí ó tọ́ padà nítorí ìtọju tí àwọn àgbà ìdílé ti ṣe tẹ́lẹ̀; èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìsanpadà ojúṣe.
- source_word: τοῖς προγόνοις
  choice: àwọn òbí wọn
  rationale: Nínú àyíká ìtọju opó, ó ṣeé ṣe kí πρόγονοι tọ́ka sí àwọn òbí tàbí àwọn àgbà ìran tó wà láàyè. “Àwọn òbí wọn” jẹ́ àdánidá, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ gbígbòòrò náà mọ́.
- source_word: ἀπόδεκτον ἐνώπιον τοῦ θεοῦ
  choice: ohun ìtẹ́wọ́gbà níwájú Ọlọ́run
  rationale: Ó tẹ̀lé ìtumọ̀ pé Ọlọ́run gba irú ìwà bẹ́ẹ̀, ó sì pa àwòrán “níwájú” mọ́.
theological_decisions:
- issue: Ẹni tí àṣẹ ọ̀pọ̀ μανθανέτωσαν ń tọ́ka sí
  choice: Àṣẹ náà ń tọ́ka sí àwọn ọmọ tàbí ọmọ-ọmọ opó náà.
  alternative: Kí a ka àṣẹ náà sí ohun tí a sọ fún àwọn opó lápapọ̀, pẹ̀lú àyípadà nínú iye tàbí kókó ọ̀rọ̀ tí a kò sọ jáde.
  rationale: Àwọn orúkọ ọ̀pọ̀ tó sún mọ́ ọn jù ni τέκνα ἢ ἔκγονα; ìtumọ̀ yìí sì bá ojúṣe àwọn ọmọ ìdílé láti tọ́jú opó àti láti san oore àwọn ìran ṣáájú padà mu.
- issue: Ìtumọ̀ εὐσεβεῖν nínú ìtọju ìdílé
  choice: Ìtọju ìdílé jẹ́ ọ̀nà tí ìfọkànsìn sí Ọlọ́run gbà farahàn.
  alternative: Kí ọ̀rọ̀ náà túmọ̀ sí ṣíṣe ojúṣe ìdílé nìkan láìsí ìtumọ̀ ẹ̀sìn tó ṣe kedere.
  rationale: εὐσεβεῖν ní ìtumọ̀ ìfọkànsìn tó ṣe kedere, ẹsẹ náà sì sọ pé ìwà yìí jẹ́ ìtẹ́wọ́gbà níwájú Ọlọ́run; ìtumọ̀ náà kò yẹ kí ó pa ìhà ẹ̀sìn rẹ̀ rẹ́.
translation_notes:
  register: Yorùbá ìlànà, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. Gbólóhùn “fi ìfọkànsìn hàn” pa ìhà ẹ̀sìn mọ́ láìya ojúṣe ìtọju ìdílé sọ́tọ̀; “san ohun tí wọ́n jẹ … padà” jẹ́ àdánidá ju gbólóhùn ìsan ẹ̀san tó le koko lọ.
