  to: Bí opó kan bá ní àwọn ọmọ tàbí ọmọ-ọmọ[a], kí wọ́n kọ́kọ́ kọ́ láti máa ṣe ojúṣe ìfọkànsìn nínú ìdílé tiwọn[b], kí wọ́n sì máa san ẹ̀san padà fún àwọn tó ṣáájú wọn nínú ìran[c], nítorí èyí jẹ́ ohun ìtẹ́wọ́gbà níwájú Ọlọ́run.
