  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: yo
  text: Bákan náà, àwọn iṣẹ́ rere pẹ̀lú hàn gbangba, àwọn tí ó yàtọ̀ kò sì lè farapamọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí kò rí bẹ́ẹ̀” tàbí “àwọn tí ó jẹ́ ní ọ̀nà mìíràn”; àwọn kan lóye èyí gẹ́gẹ́ bí iṣẹ́ búburú ní pàtó, ní ìbámu pẹ̀lú ẹsẹ tó ṣáájú.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Bẹ́ẹ̀ náà pẹ̀lú
  rationale: Ó so ẹsẹ yìí mọ́ àfiwé inú ẹsẹ 24, ó sì pa ìtẹnumọ́ ὡσαύτως àti καί mọ́ ní Yorùbá àdánidá.
- source_word: ἔργα τὰ καλά
  choice: àwọn iṣẹ́ rere
  rationale: Ó mú ìtumọ̀ iṣẹ́ tàbí ohun tí a ṣe àti ìwà rere rẹ̀ jáde ní ọ̀nà tí ó wọ́pọ̀, tí ó sì bá èdè Pọ́ọ̀lù mu.
- source_word: πρόδηλα
  choice: hàn gbangba
  rationale: Ó sọ pé àwọn iṣẹ́ náà jẹ́ ohun tí ó farahàn kedere, ní ìyàtọ̀ sí ohun tí ó farapamọ́.
- source_word: τὰ ἄλλως ἔχοντα
  choice: àwọn iṣẹ́ tí kò sì rí bẹ́ẹ̀
  rationale: 'Ó pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́: ó lè tọ́ka sí àwọn iṣẹ́ tí kò fara hàn bákan náà, láìfi dandan pè wọ́n ní iṣẹ́ búburú.'
- source_word: κρυβῆναι οὐ δύνανται
  choice: kò lè farapamọ́
  rationale: Ó ṣàfihàn àìlè farapamọ́; ní àyíká ọ̀rọ̀ náà, ohun tí kò tíì hàn yóò wá sí ìmọ̀ níkẹyìn.
theological_decisions:
- issue: Bóyá τὰ ἄλλως ἔχοντα ń tọ́ka pàtó sí iṣẹ́ búburú tàbí sí àwọn iṣẹ́ tí kò fara hàn lẹ́sẹ̀kẹsẹ̀
  choice: àwọn iṣẹ́ tí kò rí bẹ́ẹ̀, ní ìtumọ̀ gbòòrò
  alternative: àwọn iṣẹ́ búburú ní pàtó
  rationale: Gíríìkì kò sọ pé ‘búburú’ ní tààràtà. Gbólóhùn tí a yàn pa ìtumọ̀ gbòòrò àti àìdánilójú náà mọ́, bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ 24 lè mú kí àwọn kan lóye rẹ̀ gẹ́gẹ́ bí iṣẹ́ búburú.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo ‘hàn gbangba’ àti ‘farapamọ́’ fún ìtakora tó ṣe kedere, a sì yẹra fún fífi ‘búburú’ sínú ọ̀rọ̀ pàtàkì níbi tí Gíríìkì kò ti sọ ọ́ ní tààràtà.
