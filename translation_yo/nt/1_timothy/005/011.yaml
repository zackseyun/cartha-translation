id: 1TI.5.11
reference: 1 Timothy 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: yo
  text: Ṣùgbọ́n má ṣe gba àwọn opó tí wọ́n kéré sí i sí àkọsílẹ̀[a]; nítorí nígbà tí wọ́n bá jẹ́ kí ìfẹ́kúfẹ̀ẹ́ ara darí wọn ní ìtakò sí Mèsáyà[b], wọ́n á fẹ́ gbé ọkọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní pàtó: “kọ̀ àwọn opó tí wọ́n kéré sí i.” Àyíká ọ̀rọ̀ fi hàn pé ó ń tọ́ka sí kí a má ṣe gba wọn sínú àkọsílẹ̀ àwọn opó.'
    reason: contextual_clarification
  - marker: b
    text: 'Ní Gíríìkì: “ní ìtakò sí Mèsáyà.” Ìbáṣepọ̀ ọ̀rọ̀ náà lè túmọ̀ sí pé ìfẹ́kúfẹ̀ẹ́ wọn ń tako ìfọkànsìn tàbí ìlérí tí wọ́n ti ní sí i tẹ́lẹ̀. Ìtumọ̀ ìbílẹ̀ sábà máa ń ní “Kristi.”'
    reason: alternative_reading
  - marker: c
    text: 'Ó tún ṣeé túmọ̀ sí: “nígbà tí wọ́n bá di ẹni tí ìfẹ́ ara ń darí ní ìtakò sí Mèsáyà, wọ́n á fẹ́ gbé ọkọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: Ṣùgbọ́n ... àwọn opó tí wọ́n kéré sí i
  rationale: Ọ̀rọ̀ náà fi àwọn opó wọ̀nyí wé àwọn àgbà opó inú ọ̀rọ̀ tó ṣáájú; ‘tí wọ́n kéré sí i’ pa ìtumọ̀ ìfiwéra mọ́ láì dá ààlà ọjọ́-orí kan sílẹ̀.
- source_word: παραιτοῦ
  choice: kọ̀ láti fi orúkọ ... sílẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, àṣẹ náà dá lórí kí Timotiu má ṣe gba wọn sínú àkọsílẹ̀ àwọn opó, kì í ṣe pé kí ó kọ̀ wọ́n sílẹ̀ pátápátá.
- source_word: ὅταν γὰρ
  choice: nítorí nígbà tí ... bá
  rationale: Èyí pa ipa ìdí àti ipò àkókò tí gbólóhùn Gíríìkì náà ní mọ́.
- source_word: καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: ìfẹ́kúfẹ̀ẹ́ wọn bá fà wọ́n kúrò lọ́dọ̀ Mèsáyà
  rationale: Ọ̀rọ̀-ìṣe tó ṣọ̀wọ́n yìí ń tọ́ka sí ìfẹ́ ara tó lágbára tí ó sì tako ìfọkànsìn wọn sí Mèsáyà. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìṣòro ìbáṣepọ̀ genitive náà mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
- source_word: γαμεῖν θέλουσιν
  choice: wọn yóò fẹ́ láti gbé ọkọ
  rationale: ‘Fẹ́ láti’ sọ ìfẹ́ tàbí ète θέλω; ‘gbé ọkọ’ jẹ́ ọ̀nà àdánidá láti sọ pé obìnrin fẹ́ ṣe ìgbéyàwó.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ pa ipa oyè náà mọ́, nígbà tí àlàyé ìsàlẹ̀ darúkọ ìtumọ̀ ìbílẹ̀ ‘Kristi’.
- issue: Ìtumọ̀ καταστρηνιάω τοῦ Χριστοῦ
  choice: ìfẹ́kúfẹ̀ẹ́ wọn bá fà wọ́n kúrò lọ́dọ̀ Mèsáyà
  alternative: wọ́n bá ń hùwà ìfẹ́kúfẹ̀ẹ́ ní ìtakò sí Mèsáyà
  rationale: Èyí kò fi hàn pé ṣíṣe ìgbéyàwó kejì fúnra rẹ̀ ni a ń dá lẹ́bi; ó fi ìforígbárí tó wà láàárín ìfẹ́ ara àti ìfọkànsìn tàbí àdéhùn tẹ́lẹ̀ sí Mèsáyà hàn, láì pinnu gbogbo ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ náà.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì tú παραιτοῦ ní ìbámu pẹ̀lú àyíká àkọsílẹ̀ àwọn opó, láì sọ ọ́ di ìkọ̀sílẹ̀ ẹni náà lápapọ̀.
