id: 1TI.5.5
reference: 1 Timothy 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: yo
  text: Ṣùgbọ́n obìnrin tí ó jẹ́ opó ní tòótọ́[a], tí ó sì dá wà pátápátá[b], ti fi ìrètí rẹ̀ lé Ọlọ́run[c], ó sì ń bá a lọ nínú àwọn ẹ̀bẹ̀ àti àwọn àdúrà[d] ní òru àti ní ọ̀sán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Opó ní tòótọ́’ túmọ̀ sí opó tí ipò rẹ̀ bá àpèjúwe inú àyíká ọ̀rọ̀ yìí mu, kì í ṣe pé a ń ṣiyèméjì pé ọkọ rẹ̀ ti kú.
    reason: contextual_clarification
  - marker: b
    text: Tàbí, ‘tí a ti fi sílẹ̀ ní òun nìkan.’ Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ pé ó wà láìní ìdílé tàbí alátìlẹ́yìn lẹ́gbẹ̀ẹ́ rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘ti ní ìrètí nínú Ọlọ́run.’ Ìṣe ọ̀rọ̀ perfect Gíríìkì lè tẹnumọ́ ìrètí tí ó ti fìdí múlẹ̀, tí ó sì ń bá a lọ.
    reason: lexical_alternative
  - marker: d
    text: A pa ‘ẹ̀bẹ̀’ àti ‘àdúrà’ méjèèjì mọ́ láti ṣàfihàn ìyàtọ̀ Gíríìkì láàárín àwọn ìbéèrè pàtó àti àdúrà ní ìtumọ̀ gbòòrò.
    reason: lexical_clarification
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín opó tí ẹsẹ yìí ń ṣàpèjúwe àti àwọn mìíràn nínú àyíká ọ̀rọ̀ náà; kò túmọ̀ sí ọ̀rọ̀ àsìkò bí ‘nísinsin yìí.’
- source_word: ὄντως χήρα
  choice: opó ní tòótọ́
  rationale: Ó pa ìtumọ̀ obìnrin tí ọkọ rẹ̀ ti kú mọ́, ó sì fi hàn pé àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa opó tí ipò rẹ̀ bá àpèjúwe pàtó yìí mu.
- source_word: μεμονωμένη
  choice: dá wà pátápátá
  rationale: Participle perfect náà ń tẹnumọ́ ipò tí ó ti wà nínú rẹ̀—pé kò ní ìdílé tàbí alátìlẹ́yìn lẹ́gbẹ̀ẹ́ rẹ̀—láìfi ohun tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: ti fi ìrètí rẹ̀ lé Ọlọ́run
  rationale: Perfect náà ń tọ́ka sí ìrètí tí ó ti fi lélẹ̀, tí ipa rẹ̀ sì ń bá a lọ; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtọ́sọ́nà ìrètí sí Ọlọ́run mọ́.
- source_word: προσμένει
  choice: ń bá a lọ nínú
  rationale: Ó sọ ìṣe tí ń tẹ̀ síwájú tàbí ìfaradà nínú ohun kan, láìmú ìtumọ̀ náà le ju bí Gíríìkì ṣe sọ lọ.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: àwọn ẹ̀bẹ̀ àti àwọn àdúrà
  rationale: 'A pa àwọn ọ̀rọ̀ méjèèjì mọ́: ‘ẹ̀bẹ̀’ ń ṣàfihàn ìbéèrè pàtó, ‘àdúrà’ sì jẹ́ ọ̀rọ̀ gbòòrò fún sísọ̀rọ̀ sí Ọlọ́run.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ní òru àti ní ọ̀sán
  rationale: Ó tẹ̀lé ìtò Gíríìkì, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ ìṣe tí a ń ṣe nígbà gbogbo.
theological_decisions:
- issue: Ìtumọ̀ ‘opó ní tòótọ́’
  choice: 'A mú un gẹ́gẹ́ bí opó tí ipò rẹ̀ bá àpèjúwe inú àyíká ọ̀rọ̀ mu: ó dá wà, ó gbẹ́kẹ̀ lé Ọlọ́run, ó sì ń tẹ̀ síwájú nínú àdúrà.'
  alternative: Kí a mú un gẹ́gẹ́ bí àpèjúwe gbogbo opó láìsí ìtumọ̀ pé àyíká ọ̀rọ̀ ń dá irú opó kan mọ̀.
  rationale: ὄντως àti àyíká 1 Tímótì 5 fi hàn pé Pọ́ọ̀lù ń sọ nípa irú opó kan ní pàtó. A kò fi ètò ìjọ tàbí ẹ̀kọ́ ẹ̀sìn kan tí ẹsẹ náà kò sọ kún un.
- issue: Ipò ìrètí tí perfect ἤλπικεν ń ṣàfihàn
  choice: Ìrètí tí a ti fi lé Ọlọ́run, tí ó sì dúró títí di ìsinsin yìí.
  alternative: Ìṣe ìrètí kan ṣoṣo tí ó ti parí nígbà àtijọ́.
  rationale: Perfect Gíríìkì lè tẹnumọ́ ìṣe tí ó ti ṣẹlẹ̀ pẹ̀lú ipò tàbí ipa tí ń bá a lọ; ‘ti fi ìrètí rẹ̀ lé’ pa ìfararora yìí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ó jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo ọ̀rọ̀ ìjọ kan tí ó lè darí òye sí ẹ̀ka ìgbàgbọ́ kan pàtó.
