id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: yo
  text: Mo fi ìdúróṣinṣin pàṣẹ fún ọ níwájú Ọlọ́run, Mèsáyà Jésù, àti àwọn áńgẹ́lì tí a yàn[a], pé kí o pa àwọn nǹkan wọ̀nyí mọ́ láì ṣe ìdájọ́ ṣáájú[b], kí o má sì ṣe ohunkóhun pẹ̀lú ojúsàájú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn áńgẹ́lì ààyàn.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “láìṣe ìdájọ́ tẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “láì ṣe ojú rere sí ẹnì kan ju ẹlòmíràn lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: Mo fi ọ̀rọ̀ mímọ́ pàṣẹ fún ọ
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ tàbí ìkìlọ̀ tí ó lágbára, tí a sì fi ẹlẹ́rìí mímọ́ múlẹ̀; gbolohun Yorùbá yìí pa ìwọ̀n àti ọ̀wọ̀ ọ̀rọ̀ náà mọ́.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: Ó túmọ̀ sí wíwà níwájú àwọn tí a pè gẹ́gẹ́ bí ẹlẹ́rìí sí àṣẹ pàtàkì náà.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ní agbára oyè níbí; “Mèsáyà” mú ìtumọ̀ oyè ẹni àmì òróró náà jáde dípò kí ó kàn jẹ́ àkọlélẹ̀ orúkọ.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: àwọn áńgẹ́lì tí a yàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún àwọn áńgẹ́lì tí a ti yàn tàbí tí a ti yan fún ipò kan, láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ìtọ́ni tó ṣáájú, ṣùgbọ́n a pa àfihàn gbogbogbò rẹ̀ mọ́ láì fi “àwọn ìtọ́ni” kún un.
- source_word: φυλάξῃς
  choice: pa ... mọ́
  rationale: Ní àyíká yìí, ó túmọ̀ sí láti ṣọ́ra láti tẹ̀ lé tàbí mú ohun tí a pa láṣẹ ṣẹ.
- source_word: χωρὶς προκρίματος
  choice: láì ṣe ìdájọ́ ẹnikẹ́ni ṣáájú
  rationale: πρόκριμα tọ́ka sí ìdájọ́ tí a ti ṣe ṣáájú kí a tó gbọ́ ọ̀ràn dáadáa; ìtumọ̀ yìí yà á sọ́tọ̀ kúrò nínú ojúsàájú tó wà ní apá tó tẹ̀ lé e.
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: kí o má sì ṣe ohunkóhun pẹ̀lú ojúsàájú
  rationale: πρόσκλισις jẹ́ títẹ̀ sí ẹ̀gbẹ́ kan tàbí ṣíṣe ojú rere sí ẹnì kan ju ẹlòmíràn lọ; gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìtumọ̀ náà mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú ìpè mímọ́ yìí, Χριστός ṣì lè ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” jẹ́ kí ìtumọ̀ ẹni àmì òróró náà hàn, bí ó tilẹ̀ jẹ́ pé “Kristi Jésù” ni ọ̀nà tí ó ti wọ́pọ̀ jù nínú èdè ìjọ.
- issue: Ta ni ἐκλεκτῶν ṣe àpèjúwe
  choice: àwọn áńgẹ́lì tí a yàn
  alternative: àwọn áńgẹ́lì àyànfẹ́
  rationale: A pa ìtumọ̀ yíyan mọ́, láì ṣàlàyé ohun tí a yàn wọ́n fún tàbí dá ẹ̀kọ́ kan lórí ipò wọn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tí ó ní ọ̀wọ̀, tí ó sì yẹ fún kíkà ní gbangba. A lo àmì ohùn níbi tí ó yẹ, a sì yà “ìdájọ́ ṣáájú” sọ́tọ̀ kúrò nínú “ojúsàájú” kí àwọn ọ̀rọ̀ Gíríìkì méjèèjì má bàa dàpọ̀.
