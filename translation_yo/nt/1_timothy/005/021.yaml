  source_fidelity: 'Ìtumọ̀ náà mú ètò àti ìtumọ̀ pàtàkì ti Gíríìkì náà wá sí Yorùbá dáadáa: ìpè mímọ́ níwájú Ọlọ́run, Mèsáyà Jésù, àti àwọn áńgẹ́lì tí a yàn; ìpàṣẹ láti pa àwọn nǹkan wọ̀nyí mọ́ láì ṣe ìdájọ́ ṣáájú; àti láì ṣe ohunkóhun pẹ̀lú ojúsàájú. Ṣùgbọ́n “ọ̀rọ̀ mímọ́” kò jẹ́ ìtumọ̀ tó pé fún διαμαρτύρομαι, nítorí kò túmọ̀ sí “ọ̀rọ̀ mímọ́” níbí.'
  naturalness: Ìyókù gbolóhùn náà jẹ́ Yorùbá ìgbàlódé tó mọ́, tó sì ní ọ̀wọ̀. “Mo fi ìdúróṣinṣin pàṣẹ fún ọ” jẹ́ ọ̀nà tí ó ṣe kedere, tí ó sì dáa ju “Mo fi ọ̀rọ̀ mímọ́ pàṣẹ fún ọ” lọ fún àṣẹ líle, àmọ́ tí ó ní ìwọ̀n, nínú àyíká yìí.
  terminology: “Mèsáyà Jésù” pa agbára oyè Χριστός mọ́. “Àwọn áńgẹ́lì tí a yàn,” “ìdájọ́ ṣáájú,” àti “ojúsàájú” ya πρόκριμα sọ́tọ̀ kúrò ní πρόσκλισις dáadáa. A yọ “ẹnikẹ́ni” kúrò nínú ìtumọ̀ àkọ́kọ́ kí a má fi ohun tí Gíríìkì kò sọ hàn gbangba.
