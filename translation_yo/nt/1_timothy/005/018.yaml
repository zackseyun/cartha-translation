id: 1TI.5.18
reference: 1 Timothy 5:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: yo
  text: Nítorí Ìwé Mímọ́ wí pé, “Má di ẹnu màlúù nígbà tí ó ń tẹ ọkà,”[a] àti pé, “Ó yẹ kí òṣìṣẹ́ gba owó iṣẹ́ rẹ̀.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó ń pa ọkà.” Ọ̀rọ̀ aláìlẹ́gbẹ́ Gíríìkì náà tọ́ka sí màlúù tí ó ń ṣe iṣẹ́ ìpakà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ó yẹ kí òṣìṣẹ́ gba èrè iṣẹ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Nítorí Ìwé Mímọ́ wí pé
  rationale: “Nítorí” fi ìbáṣepọ̀ àlàyé γάρ hàn; “Ìwé Mímọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún γραφή gẹ́gẹ́ bí ìkọ̀wé mímọ́ aláṣẹ, “wí” sì mú ẹ̀rí tí ó dúró ṣinṣin jáde.
- source_word: Βοῦν
  choice: màlúù
  rationale: Nínú àyíká iṣẹ́ oko yìí, βοῦς tọ́ka sí màlúù tí a fi ń ṣiṣẹ́; “màlúù” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere láìfi akọ tàbí abo tí Gíríìkì kò tẹnumọ́ kún un.
- source_word: ἀλοῶντα
  choice: nígbà tí ó ń tẹ ọkà
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ yìí ṣàpèjúwe màlúù tí ó ń ṣe iṣẹ́ ìpakà nípa títẹ ọkà; gbolohun yìí mú ìṣe àtijọ́ náà yé òǹkàwé Yorùbá kedere.
- source_word: οὐ φιμώσεις
  choice: Ìwọ kò gbọdọ̀ dí ... ní ẹnu
  rationale: Ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ní agbára ìfòfin-dè níbí. “Kò gbọdọ̀” jẹ́ ìlànà Yorùbá tó ṣe kedere, “dí ... ní ẹnu” sì sọ fíìmù sí ẹnu ẹranko ní èdè àdánidá.
- source_word: καί
  choice: àti pé
  rationale: Ó so àwọn ọ̀rọ̀ àyọlò méjèèjì pọ̀; fífi “pé” kún un jẹ́ kí ìṣètò ọ̀rọ̀ Yorùbá rọrùn láti ka.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Oṣìṣẹ́ yẹ
  rationale: ἐργάτης jẹ́ ẹni tí ń ṣiṣẹ́. “Oṣìṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá òde òní, tó wọ́pọ̀, tí ó sì pa ìlànà gbogbogbò ti orísun mọ́.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: fún owó iṣẹ́ rẹ̀
  rationale: μισθός níbí túmọ̀ sí owó tí iṣẹ́ tọ́ sí, kì í ṣe èrè ẹ̀mí tàbí ẹ̀bùn. “Owó iṣẹ́” ṣe kedere, “rẹ̀” sì pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́ láìsọ akọ tàbí abo tí èdè Yorùbá kò fi hàn.
theological_decisions:
- issue: Bóyá γραφή bo àwọn àyọlò méjèèjì
  choice: A fi àwọn ọ̀rọ̀ méjèèjì sí abẹ́ ìṣáájú “Ìwé Mímọ́ wí pé” gẹ́gẹ́ bí ìṣètò ẹsẹ náà.
  alternative: Kí a ka àyọlò àkọ́kọ́ nìkan sí Ìwé Mímọ́, kí a sì ka èkejì sí òwe tàbí ọ̀rọ̀ Olúwa lọ́tọ̀.
  rationale: Èdè Gíríìkì gbé àwọn àyọlò méjèèjì kalẹ̀ lẹ́yìn ìṣáájú kan náà, ó sì so wọ́n pọ̀ pẹ̀lú καί. Ìtumọ̀ kò yẹ kí ó pinnu àríyànjiyàn nípa ìtẹ̀wọ̀gbà àwọn ìwé mímọ́ ju bí ọ̀rọ̀ Paulu ṣe dúró lọ.
- issue: Ìṣàmì akọ nínú αὐτοῦ
  choice: rẹ̀
  alternative: tirẹ̀ gẹ́gẹ́ bí ọkùnrin tàbí “wọn” gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn
  rationale: αὐτοῦ jẹ́ ẹyọ ọ̀rọ̀, “rẹ̀” sì pa ẹyọ náà mọ́. Àrọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn, nítorí náà a kò gbọ́dọ̀ fi ìyàtọ̀ tí èdè afojúsùn kò ní kún ọrọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “kò gbọdọ̀” fún agbára òfin, “tẹ ọkà” fún àṣà ìpakà, àti “owó iṣẹ́” fún ìsanwó tí iṣẹ́ tọ́ sí. Gbogbo àmì ìsàlẹ̀-ìwé wà nínú ọ̀rọ̀ pàtàkì.
