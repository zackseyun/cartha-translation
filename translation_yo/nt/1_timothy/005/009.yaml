  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: yo
  text: Kí a má ṣe kọ orúkọ opó kan sínú àkọsílẹ̀ àyàfi bí ó bá ti pé ọgọ́ta ọdún, tí ó sì ti jẹ́ aya ọkùnrin kan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “obìnrin ọkùnrin kan.” Gbólóhùn náà lè tọ́ka sí ìṣòtítọ́ tàbí orúkọ rere rẹ̀ nínú ìgbéyàwó; àwọn kan sì lóye rẹ̀ sí “ẹni tí ó ti ṣe ìgbéyàwó lẹ́ẹ̀kan ṣoṣo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: opó
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún obìnrin tí ọkọ rẹ̀ ti kú; àyíká ẹsẹ̀ yìí ń sọ nípa fífi irú obìnrin bẹ́ẹ̀ sínú àkọsílẹ̀ ìjọ.
- source_word: καταλεγέσθω
  choice: kí a má ṣe kọ orúkọ ... sínú àkọsílẹ̀ àyàfi
  rationale: Ó fi ìtumọ̀ ìṣàkóso hàn pé a ń fi orúkọ sí àkọsílẹ̀ pàtó, kì í ṣe pé a kàn ń gbé ẹni náà yẹ̀ wò.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: àyàfi bí ó bá ti pé ọgọ́ta ọdún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni náà kò gbọ́dọ̀ kéré ju ọgọ́ta ọdún lọ, ó sì mú ìtumọ̀ ọjọ́-orí tí a ti dé nínú γεγονυῖα wá.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: aya ọkọ kan ṣoṣo
  rationale: Ìtumọ̀ yìí pa àpẹẹrẹ ọ̀rọ̀ Gíríìkì mọ́, kò sì pinnu bóyá ó túmọ̀ sí ìṣòtítọ́ nínú ìgbéyàwó tàbí pé obìnrin náà ti ṣe ìgbéyàwó lẹ́ẹ̀kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ἑνὸς ἀνδρὸς γυνή
  choice: Pa àpẹẹrẹ náà mọ́ gẹ́gẹ́ bí “aya ọkọ kan ṣoṣo” nínú ẹsẹ̀.
  alternative: “obìnrin tí ó jẹ́ olóòótọ́ sí ọkọ rẹ̀” tàbí “obìnrin tí ó ti ṣe ìgbéyàwó lẹ́ẹ̀kan ṣoṣo”
  rationale: Gbólóhùn Gíríìkì lè tọ́ka sí ìṣòtítọ́ àti orúkọ rere nínú ìgbéyàwó, ṣùgbọ́n àwọn kan gbà pé ó túmọ̀ sí ìgbéyàwó lẹ́ẹ̀kan ṣoṣo. Ẹsẹ̀ fúnra rẹ̀ kò yanju rẹ̀ ní kedere, nítorí náà àlàyé ìsàlẹ̀ ni a fi ṣàfihàn àwọn ìtumọ̀ pàtàkì náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. “Kọ orúkọ ... sínú àkọsílẹ̀” jẹ́ ọ̀rọ̀ àdánidá fún ìforúkọsílẹ̀ pàtó, “ó bá ti pé ọgọ́ta ọdún” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ọjọ́-orí tí a ti dé.
