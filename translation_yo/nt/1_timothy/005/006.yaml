  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: yo
  text: Ṣùgbọ́n obìnrin tí ó ń gbé ìgbésí ayé fún ìgbádùn ti kú, bí ó tilẹ̀ jẹ́ pé ó wà láàyè[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “obìnrin tí ó ń fi ara rẹ̀ fún ìgbádùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: ẹni tí ó fi ara rẹ̀ fún ìgbádùn
  rationale: Ó fi hàn pé obìnrin náà ń gbé ìgbésí ayé ìfẹ́ ara àti ìlépa ìgbádùn, kì í ṣe pé ó kàn ń gbádùn ohun rere lásán. Àpólà yìí tún pa ìṣe tí ó ń bá a lọ nínú participle mọ́.
- source_word: ζῶσα
  choice: bí ó tilẹ̀ jẹ́ pé ó wà láàyè
  rationale: 'Ìtumọ̀ concessive yìí mú ìtakora tí ọ̀rọ̀ Gíríìkì dá sílẹ̀ hàn ní Yorùbá àdánidá: ó wà láàyè nípa ti ara, síbẹ̀ a sọ pé ó ti kú.'
- source_word: τέθνηκεν
  choice: ti kú
  rationale: Perfect náà tọ́ka sí ipò ikú tí ó ti dé tí ó sì ń bá a lọ. ‘Ti kú’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ipò yẹn àti àkàwé inú ẹsẹ náà mọ́.
- source_word: ἡ ... σπαταλῶσα
  choice: ẹni tí ó fi ara rẹ̀ fún ìgbádùn
  rationale: Article àti participle abo ẹyọ kan ń ṣiṣẹ́ gẹ́gẹ́ bí nọ́ọ̀nù. Àyíká ọ̀rọ̀ ti sọ̀rọ̀ nípa opó, nítorí náà ‘ẹni tí...’ tọ́ka sí obìnrin náà láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó samisi ìyàtọ̀ sí opó tòótọ́ tí ó gbẹ́kẹ̀ lé Ọlọ́run tí a ṣàpèjúwe ní ẹsẹ tó ṣáájú.
theological_decisions:
- issue: Irú ‘ikú’ tí ẹsẹ náà ń sọ
  choice: A pa àkàwé ‘ti kú’ mọ́ láìsọ ọ́ di ikú ti ara.
  alternative: Ó ti kú nípa ẹ̀mí; ó ti kú nípa ìwà; tàbí ó dàbí ẹni tí ó kú ní àwùjọ.
  rationale: Ìsọ pé ẹni náà ‘ti kú’ bó tilẹ̀ jẹ́ pé ó ‘wà láàyè’ mọ̀ọ́mọ̀ dá ìtakora sílẹ̀, ó sì tọ́ka sí ikú tí kì í ṣe ti ara. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìsìn pàtó kan lé àkàwé náà lórí.
translation_notes:
  register: Yorùbá àpéjọ, ọ̀wọ̀, àti òde òní ni a lò. ‘Fi ara rẹ̀ fún ìgbádùn’ jẹ́ ọ̀rọ̀ tí ó yé ni ṣókí, ó sì lágbára ju ‘ń gbádùn ayé’ lọ, èyí tí ó lè túmọ̀ sí ìgbádùn lasán tí kò ní ìdálẹ́bi.
