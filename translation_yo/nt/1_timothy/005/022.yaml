  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: yo
  text: Má ṣe fi ọwọ́ lé ẹnikẹ́ni ní ìkánjú[a], má sì ṣe kópa nínú ẹ̀ṣẹ̀ àwọn ẹlòmíràn; pa ara rẹ mọ́ ní mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn, “Má ṣe yan ẹnikẹ́ni sí ipò tàbí fi ẹni kan sí iṣẹ́ ìjọ ní kánkán.” Gíríìkì sọ ní tààrà pé “fi ọwọ́ lé”; èyí jẹ́ ọ̀nà ọ̀rọ̀ tí a sábà máa ń lò ní ìbáṣepọ̀ pẹ̀lú fífi ẹni kan sí iṣẹ́ ìránṣẹ́ tàbí fífún un ní ìfẹ̀sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: fi ọwọ́ lé
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì náà mọ́ ní Yorùbá, ó sì lè tọ́ka sí fífi ọwọ́ lé ènìyàn fún iṣẹ́ ìránṣẹ́ láì fi ìtumọ̀ tóóró bíi yíyan sí ipò tàbí ìfinijoyè sínú ẹsẹ̀ náà.
- source_word: ταχέως
  choice: ní ìkánjú
  rationale: Ọ̀rọ̀ náà kì í ṣe kìkì yíyára, ṣùgbọ́n ṣíṣe ohun kan láìfara balẹ̀ tàbí kí àkókò tó; “ní ìkánjú” mú ìkìlọ̀ yìí jáde lọ́nà àdánidá.
- source_word: μηδενὶ
  choice: ẹnikẹ́ni
  rationale: Pẹ̀lú àṣẹ òdì “Má ṣe,” “ẹnikẹ́ni” fi gbogbo ẹni tí ìkìlọ̀ náà kan hàn ní Yorùbá àdánidá.
- source_word: μηδὲ κοινώνει
  choice: má sì ṣe kópa nínú
  rationale: “Kópa nínú” túmọ̀ sí dídapọ̀ mọ́ ohun kan tàbí jíjẹ́ alábàápín nínú rẹ̀, ó sì yẹ fún ìtumọ̀ κοινωνέω níbí.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: ẹ̀ṣẹ̀ àwọn ẹlòmíràn
  rationale: Èyí ṣàfihàn ẹ̀ṣẹ̀ tí ó jẹ́ ti àwọn mìíràn láì pinnu bí ìkópa náà ṣe rí ní pàtó.
- source_word: σεαυτὸν
  choice: ara rẹ
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún arọ́pò-orúkọ afẹniṣe náà.
- source_word: ἁγνὸν
  choice: ní mímọ́
  rationale: “Mímọ́” níbí gba ìwà pípé àti àìlábàwọ́n ní ti ìwà rere, láì dín ìtumọ̀ rẹ̀ kù sí ìwà mímọ́ nípa ìbálòpọ̀ nìkan.
- source_word: τήρει
  choice: pa ... mọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ “pa ara rẹ mọ́” jẹ́ Yorùbá àdánidá, ó sì fi ìtọ́jú tó ń bá a lọ hàn.
theological_decisions:
- issue: Ìtumọ̀ “fi ọwọ́ lé” nínú àyíká ọ̀rọ̀
  choice: Pa àkójọpọ̀ ọ̀rọ̀ “fi ọwọ́ lé” mọ́ láì sọ ní pàtó pé ó túmọ̀ sí yíyan sí ipò tàbí ìfinijoyè.
  alternative: “Má ṣe yan ẹnikẹ́ni sí ipò ní ìkánjú” tàbí “Má ṣe fi ẹnikẹ́ni jẹ oyè ní kánkán.”
  rationale: Àyíká ọ̀rọ̀ nípa àwọn alàgbà fi hàn pé ó ṣeé ṣe kí ó tọ́ka sí fífi ènìyàn sí iṣẹ́ ìránṣẹ́ tàbí jíjẹ́wọ́ rẹ̀ fún un. Síbẹ̀, ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àpèjúwe fífi ọwọ́ lé, nítorí náà a kò fi ètò ìjọ kan pàtó sínú ẹsẹ̀ náà.
- issue: Ìbáṣepọ̀ láàárín àwọn ìkìlọ̀ méjèèjì
  choice: Fi ìkìlọ̀ kejì sílẹ̀ gẹ́gẹ́ bí àṣẹ pé kí Timotiu má ṣe kópa nínú ẹ̀ṣẹ̀ àwọn ẹlòmíràn, láì sọ bí ìbáṣepọ̀ rẹ̀ pẹ̀lú fífi ọwọ́ lé ṣe rí ní pàtó.
  alternative: Ṣàlàyé rẹ̀ ní tààrà pé fífi ọwọ́ lé ènìyàn ní ìkánjú ń mú kí ẹni náà di alábàápín nínú ẹ̀ṣẹ̀ rẹ̀.
  rationale: Títẹ̀lé ara wọn lè tọ́ka sí ẹ̀bi tí ìfọwọ́sí ẹni tí kò yẹ lè mú wá, ṣùgbọ́n Gíríìkì kò ṣàlàyé ìbáṣepọ̀ náà ní tààrà. Ìtumọ̀ náà pa àìdájú yìí mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé yé fún gbogbo ènìyàn. “Fi ọwọ́ lé” pa ọ̀nà ọ̀rọ̀ orísun mọ́; àlàyé ìtumọ̀ rẹ̀ ní àyíká iṣẹ́ ìránṣẹ́ wà nínú àlàyé ìsàlẹ̀. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tí ó bá yẹ.
