revisions:
- from: Nítorí náà, mo fẹ́ kí àwọn opó tí ó kéré ní ọjọ́ kí wọ́n fẹ́ ọkọ,[a] kí wọ́n bí ọmọ, kí wọ́n máa bójú tó agbo ilé wọn, kí wọ́n má sì fún alátakò ní àǹfààní kankan láti sọ̀rọ̀-èébú.[b]
  to: Nítorí náà, mo fẹ́ kí àwọn opó ọ̀dọ́ fẹ́ ọkọ,[a] kí wọ́n bí ọmọ, kí wọ́n máa ṣe ìtọ́jú ilé wọn, kí wọ́n má sì fún alátakò ní àǹfààní kankan láti fi ọ̀rọ̀ ẹ̀gàn kàn wọ́n.[b]
  rationale: Àtúnṣe náà mú ọ̀rọ̀ Yorùbá di adayeba síi, ó sì ṣàtúnṣe ìtumọ̀ λοιδορίας kí ó má bà a dà bí ìbúni nìkan. Ó pa ìlànà Gíríìkì, ìtumọ̀ ‘alátakò’ tí kò dá ẹni náà mọ̀ ní pàtó, àti ìtumọ̀ ìfẹ́ ọkọ lẹ́ẹ̀kansi tí àyíká ń fi hàn mọ́.
