id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: yo
  text: Nítorí náà, mo fẹ́ kí àwọn opó ọ̀dọ́ fẹ́ ọkọ,[a] kí wọ́n bí ọmọ, kí wọ́n máa ṣe ìtọ́jú ilé wọn, kí wọ́n má sì fún alátakò ní àǹfààní kankan láti fi ọ̀rọ̀ ẹ̀gàn kàn wọ́n.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì sọ pé “kí wọ́n fẹ́ ọkọ” lásán. Nítorí àwọn opó ni àyíká ọ̀rọ̀ náà ń sọ̀rọ̀ nípa wọn, ìfẹ́ ọkọ lẹ́ẹ̀kansi ni a lè lóye.
    reason: lexical_alternative
  - marker: b
    text: “Alátakò” tún lè jẹ́ “ọ̀tá”; ó ṣeé ṣe kí ó tọ́ka sí Sátánì. Ọ̀rọ̀ Gíríìkì fún “ọ̀rọ̀ ẹ̀gàn” tún lè túmọ̀ sí ìfi ọ̀rọ̀ burúkú kànni tàbí ẹ̀gàn.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: mo fẹ́
  rationale: Ó fi ìfẹ́ tàbí ìpinnu Pọ́ọ̀lù hàn ní èdè Yorùbá tó ṣe déédé, láì sọ ọ́ di àṣẹ gígùn.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: νεωτέρας
  choice: àwọn opó tí ó kéré ní ọjọ́
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí ‘àwọn obìnrin tí ó kéré ní ọjọ́,’ ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé àwọn opó ni a ń sọ̀rọ̀ sí.
- source_word: γαμεῖν
  choice: kí wọ́n fẹ́ ọkọ
  rationale: Ọ̀rọ̀ náà sọ pé kí wọ́n gbéyàwó; nítorí pé opó ni wọ́n, àyíká ọ̀rọ̀ túmọ̀ sí pé kí wọ́n tún fẹ́ ọkọ, bí ó tilẹ̀ jẹ́ pé ‘tún’ kò sí ní tààrà nínú Gíríìkì.
- source_word: τεκνογονεῖν
  choice: kí wọ́n bí ọmọ
  rationale: Ó pa ìtumọ̀ pàtó ti bíbí ọmọ mọ́ ní ọ̀nà tó ṣe déédé ní Yorùbá.
- source_word: οἰκοδεσποτεῖν
  choice: kí wọ́n máa bójú tó agbo ilé wọn
  rationale: Ó sọ ojúṣe ìṣàkóso àti àbójútó ilé láì fi ìtumọ̀ ìjọba líle kún un.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: kí wọ́n má sì fún ... ní àǹfààní kankan
  rationale: Ó mú èrò ti ṣíṣí ọ̀nà tàbí fífúnni ní àyè láti gbéjà kò wọlé ní Yorùbá adayeba.
- source_word: τῷ ἀντικειμένῳ
  choice: alátakò
  rationale: Ó pa ẹni kan tí ń tako mọ́ láì dá a mọ̀ ní pàtó gẹ́gẹ́ bí Sátánì.
- source_word: λοιδορίας χάριν
  choice: láti sọ̀rọ̀-èébú
  rationale: Ó ṣàfihàn ọ̀rọ̀ ìkóbìnrin, ẹ̀gàn, tàbí ọ̀rọ̀ burúkú tí a lè sọ sí wọn; àlàyé ìtumọ̀ míì wà ní àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ta ni τῷ ἀντικειμένῳ ń tọ́ka sí?
  choice: alátakò kan ní gbogbogbò, ẹni tàbí ẹgbẹ́ tí ń tako
  alternative: Ọ̀tá náà, tí a lè lóye sí Sátánì
  rationale: Ọ̀rọ̀ Gíríìkì kò dá ẹni náà mọ̀ ní pàtó gẹ́gẹ́ bí Èṣù. Àyíká ọ̀rọ̀ tún lè tọ́ka sí alárìnkiri tàbí aṣelámèyítọ́, nítorí náà a pa àìdánilójú náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘opó tí ó kéré ní ọjọ́’ láti yẹra fún àìmọ̀ bóyá ‘kékeré’ ń tọ́ka sí ọjọ́-orí tàbí ipò. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
