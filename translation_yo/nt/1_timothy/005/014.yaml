  source_fidelity: Ìtumọ̀ náà tọ́pa ọ̀wọ̀ àwọn infinitive Gíríìkì náà dáadáa, ó sì pa ‘alátakò’ mọ́ gẹ́gẹ́ bí ẹni/ẹgbẹ́ tí ń tako láì dá a mọ̀ sí Sátánì. Ṣùgbọ́n ‘sọ̀rọ̀-èébú’ máa ń túmọ̀ sí fífi èébú bú ẹni; λοιδορίας sì jẹ́ ẹ̀gàn, ìfi-ọrọ̀ burúkú kànni, tàbí ìsọ̀rọ̀ ìkórìíra. ‘Agbo ilé’ kì í ṣe ìtumọ̀ adayeba tàbí tó pé fún οἰκοδεσποτεῖν nínú àyíká yìí.
  naturalness: ‘Àwọn opó ọ̀dọ́’ jẹ́ ọ̀nà Yorùbá tó rọrùn ju ‘àwọn opó tí ó kéré ní ọjọ́’ lọ. ‘Máa bójú tó ilé wọn’ dáa, ṣùgbọ́n ‘máa ṣe ìtọ́jú ilé wọn’ jẹ́ adayeba, ó sì lè ṣàfihàn ìṣàkóso ilé láì fi ìjọba líle sínú ọ̀rọ̀.
  terminology: A pa ‘opó,’ ‘fẹ́ ọkọ,’ ‘bí ọmọ,’ àti ‘alátakò’ mọ́. A rọ́pò ‘sọ̀rọ̀-èébú’ pẹ̀lú ‘fi ọ̀rọ̀ ẹ̀gàn kàn wọ́n’ láti mú λοιδορίας hàn dáadáa. Àlàyé ìsàlẹ̀ pa ìdánimọ̀ alátakò mọ́ ní ìmọ̀lẹ̀-òde.
