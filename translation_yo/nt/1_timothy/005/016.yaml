id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: yo
  text: Bí obìnrin onígbàgbọ́ kan bá ní àwọn opó[a], kí ó pèsè fún wọn; kí ó má sì ṣe ìjọ ní ẹrù, kí ìjọ lè pèsè fún àwọn tí wọ́n jẹ́ opó ní tòótọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan kà á pé, “bí ọkùnrin tàbí obìnrin onígbàgbọ́ kan bá ní àwọn opó,” tàbí “bí onígbàgbọ́ kan bá ní àwọn opó,” èyí tí ó fa ìtọ́ni náà gbòòrò ju ẹni obìnrin lọ.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: obìnrin onígbàgbọ́ kan
  rationale: Ọ̀rọ̀ ajẹtífù πιστή jẹ́ abo ẹyọ kan nínú ẹ̀dà yìí, nítorí náà ó ń tọ́ka sí obìnrin kan pàtó. “Onígbàgbọ́” fi hàn pé ọmọ ìjọ Kristẹni ni.
- source_word: χήρας
  choice: àwọn opó
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ χήρα, ó sì tọ́ka sí àwọn obìnrin tí ọkọ wọn ti kú, tí ọ̀rọ̀ ìpèsè fún wọn jẹ́ kókó inú àyíká ẹsẹ̀ náà.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: kí ó pèsè fún / kí ó lè pèsè fún
  rationale: ἐπαρκέω níbí túmọ̀ sí fífún ẹnì kan ní ìrànlọ́wọ́ tó tó fún àìní rẹ̀. Lílo “pèsè fún” ní ibi méjèèjì pa ìṣọ̀kan ọ̀rọ̀ orísun mọ́, ó sì bá àyíká ìtọju ohun ìní mu.
- source_word: βαρείσθω
  choice: kí ìjọ má sì di ẹni tí a di ẹrù lé lórí
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ aláìṣe tí ó túmọ̀ sí pé a kò gbọdọ̀ fi ojúṣe ìpèsè yìí di ẹrù fún ìjọ. Gbólóhùn Yorùbá yìí pa àwòrán ‘ẹrù’ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἡ ἐκκλησία
  choice: ìjọ
  rationale: Nínú lẹ́tà yìí, ἐκκλησία tọ́ka sí àwùjọ àwọn onígbàgbọ́; “ìjọ” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere jù lọ.
- source_word: ὄντως
  choice: ní tòótọ́
  rationale: Ó ya àwọn opó tí kò ní ìtìlẹ́yìn ìdílé, tí wọ́n sì yẹ fún ìrànlọ́wọ́ ìjọ, sọ́tọ̀ kúrò lọ́dọ̀ àwọn mìíràn. “Ní tòótọ́” pa ìtẹnumọ́ ọ̀rọ̀ orísun mọ́.
- source_word: ταῖς ὄντως χήραις
  choice: àwọn tí wọ́n jẹ́ opó ní tòótọ́
  rationale: Ìtumọ̀ yìí pa ọ̀nà tí Gíríìkì gbà tẹnumọ́ ìpín àwọn opó tó yẹ fún ìrànlọ́wọ́ mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
theological_decisions:
- issue: Ìbálòpọ̀ ẹni tí a mẹ́nuba ní ìbẹ̀rẹ̀ gbólóhùn
  choice: 'obìnrin kan pàtó: “obìnrin onígbàgbọ́ kan”'
  alternative: “onígbàgbọ́ kan” láì sọ akọ tàbí abo, tàbí “ọkùnrin tàbí obìnrin onígbàgbọ́ kan,” gẹ́gẹ́ bí àwọn ẹ̀dà àfọwọ́kọ mìíràn
  rationale: SBLGNT tí a pèsè ní τις πιστή, èyí tí gírámà rẹ̀ jẹ́ abo ẹyọ kan. Nítorí náà, ọ̀rọ̀ pàtàkì fi obìnrin hàn, a sì tọ́ka sí àwọn ẹ̀dà tó mú un gbòòrò sí i nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ “àwọn opó ní tòótọ́”
  choice: pa ẹ̀ka tí ọ̀rọ̀ orísun dá sílẹ̀ mọ́ láì ṣàlàyé rẹ̀ jù
  alternative: túmọ̀ ọ́ ní tààràtà sí “àwọn opó tí kò ní ìdílé láti ràn wọ́n lọ́wọ́”
  rationale: Àyíká orí karùn-ún fi hàn pé àwọn tí wọ́n dá wà tí wọ́n sì nílò ìtọju ni a ń sọ̀rọ̀ nípa wọn, ṣùgbọ́n ẹsẹ̀ yìí fúnra rẹ̀ lo gbólóhùn “opó ní tòótọ́.” Dídá a mọ́ bẹ́ẹ̀ ń pa ìtẹnumọ́ àti ìwọ̀n àìṣedédé ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Pèsè fún” jẹ́ ọ̀rọ̀ adayeba fún ìtọju ohun ìní, “ìjọ” sì ṣe kedere fún àwùjọ Kristẹni. Àmì àlàyé [a] wà lẹ́yìn “àwọn opó” nínú ọ̀rọ̀ pàtàkì.
