id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni kò bá pèsè fún àwọn tirẹ̀[a], pàápàá jù lọ fún àwọn ará ilé rẹ̀, ó ti sẹ́ ìgbàgbọ́[b], ó sì burú ju aláìgbàgbọ́ lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn tirẹ̀.” Gbólóhùn yìí gbòòrò ju àwọn tó ń gbé lábẹ́ òrùlé kan náà lọ; “àwọn ará ilé rẹ̀” sì ń sọ ní pàtó nípa ẹgbẹ́ tí ojúṣe ẹni sí wọn pọ̀ jù lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó sì ti kọ ìgbàgbọ́ náà sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó jẹ́ arọ́pò-orúkọ aláìlópìn tó ní ìtumọ̀ gbogbogbò; “ẹnikẹ́ni” kò fi ọ̀rọ̀ náà mọ́ ọkùnrin nìkan.
- source_word: τῶν ἰδίων
  choice: àwọn tirẹ̀
  rationale: Ó pa ìtumọ̀ gbòòrò ti àwọn ènìyàn ẹni—bí ìbátan tàbí àwọn tó wà lábẹ́ ojúṣe rẹ̀—mọ́, kí gbólóhùn tó tẹ̀ lé e lè ṣe àfihàn ẹgbẹ́ pàtàkì jù lọ.
- source_word: μάλιστα
  choice: pàápàá jù lọ
  rationale: Ó tẹnu mọ́ ẹgbẹ́ kan nínú ẹgbẹ́ tó gbòòrò, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: οἰκείων
  choice: àwọn ará ilé rẹ̀
  rationale: Ó tọ́ka sí àwọn tó jẹ́ ara agbo ilé ẹni; “àwọn ará ilé rẹ̀” yàtọ̀ sí “àwọn tirẹ̀” tó gbòòrò sí i.
- source_word: προνοεῖ
  choice: pèsè fún
  rationale: Nínú àyíká yìí, ó túmọ̀ sí rí sí àìní wọn nípa ìtọ́jú tó ṣeé fojú rí àti ìpèsè ohun ìgbésí ayé.
- source_word: τὴν πίστιν
  choice: ìgbàgbọ́
  rationale: Níbí, ó tọ́ka sí ìgbàgbọ́ Kristẹni tí ẹni náà jẹ́wọ́, kì í ṣe ìgbẹ́kẹ̀lé lásán.
- source_word: ἤρνηται
  choice: ó ti sẹ́
  rationale: Ó fi àkókò perfect Gíríìkì hàn gẹ́gẹ́ bí ohun tó ti ṣẹlẹ̀ tí ipò rẹ̀ ṣì dúró, ó sì pa líle ìdájọ́ náà mọ́.
- source_word: ἀπίστου
  choice: aláìgbàgbọ́
  rationale: Nínú ìfiwéra yìí, ó tọ́ka sí ẹni tí kò gbàgbọ́, kì í ṣe ẹni aláìṣòótọ́ lásán.
- source_word: χείρων
  choice: burú ju ... lọ
  rationale: Ó jẹ́ ìfiwéra ìwà rere tàbí ẹ̀bi, “burú ju ... lọ” sì ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìṣàpẹẹrẹ akọ nínú gbólóhùn Gíríìkì tí ó ní ìtumọ̀ gbogbogbò
  choice: Lo “ẹnikẹ́ni” àti “rẹ̀,” èyí tí kò ní àmì akọ tàbí abo ní Yorùbá.
  alternative: Lo ọ̀rọ̀ tó sọ “ọkùnrin” ní pàtó.
  rationale: τις ní agbára gbogbogbò, bí ó tilẹ̀ jẹ́ pé ìṣètò Gíríìkì jẹ́ akọ ní gírámà. Yorùbá lè pa ìtumọ̀ gbogbogbò náà mọ́ láì fi akọ kún un.
- issue: Ìtumọ̀ πίστις nínú “τὴν πίστιν ἤρνηται”
  choice: “ìgbàgbọ́” gẹ́gẹ́ bí ìgbàgbọ́ Kristẹni tí a jẹ́wọ́
  alternative: “ìgbẹ́kẹ̀lé” tàbí “ìṣòtítọ́”
  rationale: Àpilẹ̀kọ náà àti lílò ọ̀rọ̀ náà nínú àwọn Lẹ́tà Olùṣọ́ tọ́ka sí ìgbàgbọ́ tí ẹni náà jẹ́wọ́, tí ìwà rẹ̀ sì lè sẹ́.
- issue: Bí a ṣe máa sọ ἤρνηται
  choice: “ó ti sẹ́”
  alternative: “ó ti kọ ìgbàgbọ́ náà sílẹ̀”
  rationale: “Sẹ́” pa ìtumọ̀ tààrà àti ìforígbárí ọ̀rọ̀ náà mọ́; àṣàyàn kejì lè túmọ̀ sí ìkọ̀sílẹ̀ ìgbàgbọ́ ní gbangba ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá jẹ́ ti ẹ̀dá; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Pèsè fún” mú ojúṣe ìtọ́jú tó ṣeé fojú rí jáde, “àwọn tirẹ̀” sì pa ìbòòrò ọ̀rọ̀ Gíríìkì mọ́.
