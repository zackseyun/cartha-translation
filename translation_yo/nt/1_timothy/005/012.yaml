  yaml_path: translation/nt/1_timothy/005/012.yaml
  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: yo
  text: Wọ́n wà lábẹ́ ìdájọ́ nítorí wọ́n ti kọ ìgbàgbọ́ àkọ́kọ́ wọn sílẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlérí àkọ́kọ́ wọn” tàbí “ìfaramọ́ wọn tẹ́lẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìgbàgbọ́,” ṣùgbọ́n nínú àyíká yìí, àwọn kan gbà pé ó ń tọ́ka sí ìlérí tàbí ìfaramọ́ tí wọ́n ti ṣe tẹ́lẹ̀, bóyá ní ìsopọ̀ pẹ̀lú ìforúkọsílẹ̀ wọn gẹ́gẹ́ bí opó.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: wọ́n sì tipa bẹ́ẹ̀ wà lábẹ́
  rationale: Ọ̀rọ̀ alábápín náà túmọ̀ ní tààrà sí ‘níní,’ ṣùgbọ́n pẹ̀lú κρίμα, gbólóhùn Yorùbá ‘wà lábẹ́ ìdájọ́’ fi ipò tí wọ́n mú wá sórí ara wọn hàn lọ́nà àdánidá. ‘Típa bẹ́ẹ̀’ tún so ọ̀rọ̀ náà mọ́ àyíká ẹsẹ tó ṣáájú.
- source_word: κρίμα
  choice: ìdájọ́
  rationale: ‘Ìdájọ́’ pa ìtumọ̀ gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́ láì sọ ọ́ di ìdálẹ́bi ayérayé, èyí tí ẹsẹ yìí kò sọ ní pàtó.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí tí wọ́n fi wà lábẹ́ ìdájọ́ hàn ní Yorùbá tó ṣe kedere.
- source_word: τὴν πρώτην πίστιν
  choice: ìgbàgbọ́ wọn àkọ́kọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ fún πίστις, ‘àkọ́kọ́’ sì pa ìṣòro ìtumọ̀ πρώτην mọ́ dáadáa ju ‘tẹ́lẹ̀ rí’ lọ, nítorí ọ̀rọ̀ náà lè tọ́ka sí ìgbàgbọ́ tàbí ìlérí/ìfaramọ́ àkọ́kọ́. Àlàyé ìsàlẹ̀ fi ìtumọ̀ mìíràn hàn.
- source_word: ἠθέτησαν
  choice: ti kọ ... sílẹ̀
  rationale: ‘Kọ ... sílẹ̀’ fi ìṣe yíyọ ohun tí a ti tẹ́wọ́ gbà tàbí ìfaramọ́ kan sí ẹ̀gbẹ́ hàn, láì fi ìtumọ̀ tó le ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
theological_decisions:
- issue: Ìtumọ̀ τὴν πρώτην πίστιν nínú àyíká ọ̀rọ̀
  choice: ìgbàgbọ́ wọn àkọ́kọ́
  alternative: ìlérí wọn àkọ́kọ́; ìfaramọ́ wọn tẹ́lẹ̀
  rationale: πίστις sábà máa ń túmọ̀ sí ‘ìgbàgbọ́,’ ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí ìlérí tàbí ìfaramọ́ kan tó ní í ṣe pẹ̀lú fífi orúkọ opó sínú àkọsílẹ̀. A pa ‘ìgbàgbọ́’ mọ́ nínú ọ̀rọ̀ pàtàkì, a sì fi àwọn ìtumọ̀ mìíràn sí àlàyé ìsàlẹ̀ láti má ṣe dá ẹ̀rí tí kò dájú lẹ́jọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yan ‘wà lábẹ́ ìdájọ́’ gẹ́gẹ́ bí gbólóhùn àdánidá dípò ìtumọ̀ ọ̀rọ̀-lọ́rọ̀ tí kò rọrùn.
