  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́ra ní gbogbogbòò: γάρ jẹ́ “Nítorí,” ἤδη jẹ́ “tẹ́lẹ̀,” τινες jẹ́ “àwọn kan,” àti ìkìlọ̀ nípa yípadà kúrò lọ sí ọ̀dọ̀ Sátánì wà ní kedere. Ṣùgbọ́n “láti tọ Sátánì lẹ́yìn” kò dáa gẹ́gẹ́ bí ọ̀nà Yorùbá tí ó wọ́pọ̀ jù lọ fún ὀπίσω; “tẹ̀lé Sátánì” túmọ̀ ìfaramọ́/títẹ̀lé náà dáadáa.'
