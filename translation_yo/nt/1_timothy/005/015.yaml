  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: yo
  text: Nítorí àwọn kan ti yà kúrò ní ọ̀nà tẹ́lẹ̀ láti tẹ̀lé Sátánì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ gangan, “ti yà kúrò ní ọ̀nà lẹ́yìn Sátánì”; ìtumọ̀ náà ní èrò títẹ̀lé Sátánì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: tẹ́lẹ̀
  rationale: Ó fi hàn pé ìyapa náà ti ṣẹlẹ̀ ní àkókò yìí; ‘tẹ́lẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘already’.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó tọ́ka sí iye ènìyàn tí a kò sọ pàtó láàárín ẹgbẹ́ kan.
- source_word: ἐξετράπησαν
  choice: ti yà kúrò ní ọ̀nà
  rationale: Ó pa àwòrán ìyapa kúrò ní ọ̀nà tó tọ́ mọ́, láìfi èrò pé ẹlòmíràn ló mú wọn ṣìnà kún un.
- source_word: ὀπίσω
  choice: láti tọ ... lẹ́yìn
  rationale: Ìtumọ̀ gangan rẹ̀ ni ‘lẹ́yìn’ tàbí ‘ní ẹ̀yìn’; pẹ̀lú ẹni gẹ́gẹ́ bí ohun tí a ń tọ̀, ó túmọ̀ sí títẹ̀lé ẹni náà.
- source_word: Σατανᾶ
  choice: Sátánì
  rationale: Èyí ni ọ̀nà àkọtọ́ orúkọ náà tí ó wọ́pọ̀ ní Yorùbá.
theological_decisions:
- issue: 'Bí a ṣe yẹ kí a túmọ̀ ὀπίσω τοῦ Σατανᾶ: ní ọ̀nà gangan (‘lẹ́yìn Sátánì’) tàbí ní ọ̀nà ìtumọ̀ (‘tẹ̀lé Sátánì’).'
  choice: láti tọ Sátánì lẹ́yìn
  alternative: lẹ́yìn Sátánì / ní ẹ̀yìn Sátánì
  rationale: ‘Tọ ... lẹ́yìn’ jẹ́ Yorùbá àdánidá tó sọ ìtẹ̀lé tàbí ìfaramọ́ di mímọ̀, nígbà tó tún pa àwòrán ὀπίσω, ‘lẹ́yìn,’ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá bá èdè mu.
