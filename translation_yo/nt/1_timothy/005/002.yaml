id: 1TI.5.2
reference: 1 Timothy 5:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: yo
  text: àwọn àgbà obìnrin bí ìyá, àwọn ọ̀dọ́ obìnrin bí arábìnrin, pẹ̀lú ìwà mímọ́ pátápátá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “nínú gbogbo ìwà mímọ́.” Nínú àyíká yìí, ọ̀rọ̀ náà tún lè ní ìtumọ̀ lílágbára nípa ìwà àìlábàwọ́n àti ìṣọ́ra nípa ìbálòpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: àwọn àgbà obìnrin
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù abo ọ̀pọ̀ tí a lò gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí ọjọ́-orí ní ìyàtọ̀ sí νεωτέρας, kì í ṣe ipò alàgbà nínú ìjọ.
- source_word: ὡς
  choice: bí
  rationale: 'Ó ń fi ìfiwéra hàn, ‘bí’ sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣọ̀kan ọ̀rọ̀ náà: bí ìyá ... bí arábìnrin.'
- source_word: μητέρας
  choice: ìyá
  rationale: Ó pa àpẹẹrẹ ìbátan ẹbí mọ́ láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: νεωτέρας
  choice: àwọn ọ̀dọ́ obìnrin
  rationale: Ajẹtífù abo ọ̀pọ̀ tí a lò gẹ́gẹ́ bí orúkọ ni, ó sì ń tọ́ka sí àwọn obìnrin tí ọjọ́-orí wọn kéré ju ti ẹgbẹ́ àkọ́kọ́ lọ.
- source_word: ἀδελφὰς
  choice: arábìnrin
  rationale: Ó tẹ̀síwájú nínú àpẹẹrẹ ìbátan ẹbí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún obìnrin tí a ń wò bí ọmọ ìyá ẹni.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: pẹ̀lú ìwà mímọ́ pátápátá
  rationale: ‘Pẹ̀lú’ sọ ọ̀nà tí a ó gbà bá wọn lò hàn; ‘ìwà mímọ́’ pa ìtumọ̀ gbígbòòrò ἁγνεία mọ́, ‘pátápátá’ sì ṣàfihàn πάσῃ láìdín ọ̀rọ̀ náà kù sí ìṣọ́ra nípa ìbálòpọ̀ nìkan.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ἁγνεία nínú ìtọ́ni nípa àwọn ọ̀dọ́ obìnrin
  choice: ìwà mímọ́
  alternative: ìwà àìlábàwọ́n nípa ìbálòpọ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìwà mímọ́ ní gbogbogbòò, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí ó ní ìtumọ̀ lílágbára nípa ìṣọ́ra àti ìwà tó yẹ láàárín ọkùnrin àti obìnrin. Ìtumọ̀ gbígbòòrò yìí pa gbogbo agbára ọ̀rọ̀ náà mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ àdánidá, ọ̀wọ̀, àti èdè tó yé òǹkàwé òde òní. A lo ‘àgbà obìnrin’ fún ọjọ́-orí, kì í ṣe oyè ìjọ; a sì pa ìṣọ̀kan àpẹẹrẹ ẹbí mọ́.
