  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì: ‘àwọn àgbà obìnrin’ àti ‘àwọn ọ̀dọ́ obìnrin’ ń tọ́ka sí ìyàtọ̀ ọjọ́-orí, kì í ṣe oyè ìjọ. Àpẹẹrẹ ẹbí náà (‘bí ìyá ... bí arábìnrin’) wà ní ìbámu pẹ̀lú ὡς μητέρας ... ὡς ἀδελφὰς. ‘Pẹ̀lú ìwà mímọ́ pátápátá’ gbé ἐν πάσῃ ἁγνείᾳ kalẹ̀ ní tòótọ́, ó sì fi ìtumọ̀ rẹ̀ sílẹ̀ ní gbòòrò dípò kí ó kàn mọ́ ìbálòpọ̀ nìkan.'
  naturalness: Yorùbá náà jẹ́ boṣewa, ó ní àmì ohùn tó yẹ, ó sì dára gẹ́gẹ́ bí ìtẹ̀síwájú gbolóhùn ìtọ́ni láti ẹsẹ̀ tí ó ṣáájú. Lílò ‘ìyá’ àti ‘arábìnrin’ ní ẹyọ kan lẹ́yìn ẹgbẹ́ ọ̀pọ̀ jẹ́ ọ̀nà àdánidá fún àpẹẹrẹ ìbátan nínú Yorùbá.
  terminology: ‘Àgbà obìnrin’ yẹ fún πρεσβυτέρας nínú àyíká yìí; kò dáa láti lo ‘àwọn alàgbà’ nítorí pé ìyẹn lè dámọ̀ràn ipò ìjọ. ‘Ìwà mímọ́’ jẹ́ ìfẹ̀sẹ̀mulẹ̀ tó dára fún ἁγνεία, ‘pátápátá’ sì ń mú agbára πάσῃ wá. Àlàyé ìsàlẹ̀ ṣètọ́jú ìtumọ̀ ìwà àìlábàwọ́n/ìṣọ́ra ìbálòpọ̀ láìfi í ṣe ìtumọ̀ kan ṣoṣo.
