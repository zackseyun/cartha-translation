id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: yo
  text: Ní àkókò kan náà, wọ́n tún ń kọ́ láti jẹ́ ọ̀lẹ, wọ́n ń lọ káàkiri láti ilé dé ilé. Kì í ṣe ọ̀lẹ nìkan ni wọ́n jẹ́, ṣùgbọ́n wọ́n tún ń ṣe òfófó[a], wọ́n sì ń dá sí ọ̀ràn tí kò kan wọ́n[b], wọ́n ń sọ ohun tí kò yẹ kí wọ́n sọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń sọ ọ̀rọ̀ asán”; ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ọ̀rọ̀ òmùgọ̀ tàbí ọ̀rọ̀ tí kò ní láárí ní ìtumọ̀ tó gbòòrò, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kó ní òfófó nínú níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń fi ara sínú ọ̀ràn àwọn ẹlòmíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Ní àkókò kan náà, wọ́n tún
  rationale: Ó mú ìtumọ̀ ohun tó ń ṣẹlẹ̀ ní àkókò kan náà àti ohun tí a fi kún ọ̀rọ̀ tó ṣáájú jáde ní Yorùbá àdánidá.
- source_word: ἀργαὶ
  choice: ń ṣe ọ̀lẹ
  rationale: Ó tọ́ka sí àìṣiṣẹ́ tàbí jíjẹ́ aláìníṣẹ́, kì í ṣe dandan pé ó ń dá wọn lẹ́bi gẹ́gẹ́ bí ọ̀lẹ lásán. A pa àtúnlò ọ̀rọ̀ Gíríìkì náà mọ́ ní ibi méjèèjì.
- source_word: μανθάνουσιν
  choice: ń kọ́ láti máa
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé wọ́n ń mú ìwà kan mọ́ra díẹ̀díẹ̀, kì í ṣe pé wọ́n ń gba ẹ̀kọ́ ní ilé ẹ̀kọ́.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: ń lọ káàkiri láti ilé dé ilé
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n ń lọ láti agbo ilé kan sí òmíràn; ìtumọ̀ Yorùbá yìí ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: φλύαροι
  choice: ń ṣe òfófó
  rationale: Ó bá àyíká ọ̀rọ̀ mu pé wọ́n ń sọ ọ̀rọ̀ asán tàbí ọ̀rọ̀ àwọn ẹlòmíràn tí kò yẹ. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó gbòòrò sí i mọ́.
- source_word: περίεργοι
  choice: ń fi ara sí ọ̀ràn tí kò kàn wọ́n
  rationale: Ó sọ ìtumọ̀ dídá sí ọ̀ràn àwọn ẹlòmíràn lọ́nà Yorùbá tí ó ṣe kedere, láìfi ìtumọ̀ àfikún ẹ̀sìn kún un.
- source_word: λαλοῦσαι
  choice: ń sọ
  rationale: Ọ̀rọ̀ ìṣe tó rọrùn yìí bá gbólóhùn tó tẹ̀ lé e mu, kò sì túmọ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: τὰ μὴ δέοντα
  choice: ohun tí kò yẹ kí wọ́n sọ
  rationale: Ó fi hàn pé àwọn ohun tí kò bójú mu ni wọ́n ń sọ; fífi “sọ” sínú gbólóhùn náà mú ìbáṣepọ̀ rẹ̀ pẹ̀lú λαλοῦσαι ṣe kedere.
theological_decisions:
- issue: Ìtọ́kasí akọ tàbí abo nínú àwọn ọ̀rọ̀ ọ̀pọ̀ abo Gíríìkì
  choice: wọ́n
  alternative: àwọn obìnrin wọ̀nyí
  rationale: Àwọn ọ̀rọ̀ Gíríìkì tọ́ka sí àwọn opó ọ̀dọ́bìnrin tí a mẹ́nu kàn nínú àyíká ẹsẹ náà. “Wọ́n” jẹ́ àdánidá ní Yorùbá, àyíká ọ̀rọ̀ sì ń pa ìtọ́kasí sí àwọn obìnrin náà mọ́ láìṣe àtúnlò tí kò pọn dandan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ṣeé lóye fún gbogbo ènìyàn. Gbólóhùn náà pa ìtẹnumọ́ àti àtúnlò ἀργαὶ mọ́, ó sì lo àwọn ọ̀rọ̀ àdánidá dípò gbólóhùn tó le tàbí ti àtijọ́.
