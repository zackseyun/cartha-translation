  source_fidelity: Ìtumọ̀ náà pa ìmọ̀ ète nínú ἵνα ... ὦσιν mọ́, ó sì fi olùtọ́kasí ọ̀pọ̀ náà sílẹ̀ láìsọ ọ́ di pàtó. Ṣùgbọ́n ‘aláìlẹ́gàn’ túmọ̀ sí ẹni tí a kò gàn tàbí kẹ́gàn, kì í ṣe ẹni tí kò sí ẹ̀sùn tàbí ìbáwí tó yẹ lórí rẹ̀; nítorí náà kò ṣojú ἀνεπίλημπτοι dáadáa. Bákan náà, ‘pàṣẹ àwọn nǹkan’ kò dáa bí ‘pa ... láṣẹ’ fún fífi παράγγελλε pẹ̀lú ταῦτα hàn ní Yorùbá.
  naturalness: ‘Kí o sì máa pa àwọn nǹkan wọ̀nyí láṣẹ’ jẹ́ Yorùbá boṣewa, ó sì ní agbára àṣẹ àti ìrísí ìṣe tí ń tẹ̀síwájú. ‘Aláìlábùkù’ jẹ́ ọ̀nà kedere, ìbámu pẹ̀lú ìlò Bíbélì, láti sọ ẹni tí kò ṣí sílẹ̀ fún ẹ̀sùn tàbí ìbáwí tó yẹ.
  terminology: A rọ́pò ‘aláìlẹ́gàn’ pẹ̀lú ‘aláìlábùkù’ nítorí ‘lẹ́gàn’ ní ìtumọ̀ ìtìjú/kẹ́gàn, nígbà tí ἀνεπίλημπτος ń tọ́ka sí ìwà tí kò ní àbùkù tàbí ẹ̀sùn tó yẹ. ‘Pa ... láṣẹ’ dára ju ‘pàṣẹ ...’ lọ níbí.
