  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: yo
  text: Kí o sì máa pa àwọn nǹkan wọ̀nyí láṣẹ[a], kí wọ́n lè jẹ́ aláìlábùkù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “máa kọ́ni” tàbí “máa tọ́ni sọ́nà”; ọ̀rọ̀ ìṣe Gíríìkì náà ní agbára àṣẹ nínú.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì kò sọ àwọn ẹni tí “wọ́n” ń tọ́ka sí ní tààrà. Ní àyíká ẹsẹ náà, ó ṣeé ṣe jù pé ó ń tọ́ka sí àwọn tí àwọn ìtọ́nisọ́nà tó ṣáájú kàn, pàápàá àwọn opó àti ìdílé wọn.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so àṣẹ yìí mọ́ àwọn ìtọ́nisọ́nà tó ṣáájú láìfi ìtẹnumọ́ tuntun kún un.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ mọ́, ó sì tọ́ka sí àwọn ìtọ́nisọ́nà tó wà ní àyíká ẹsẹ náà láìsọ wọ́n di pàtó ju Gíríìkì lọ.
- source_word: παράγγελλε
  choice: máa pàṣẹ
  rationale: Ọ̀rọ̀ ìṣe àṣẹ ní àkókò ìsinsìnyí ń tọ́ka sí ìṣe tí a ó máa bá a lọ; ‘máa pàṣẹ’ tún pa agbára àṣẹ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìkọ́lé yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ète tàbí àbájáde hàn.
- source_word: ἀνεπίλημπτοι
  choice: aláìlẹ́gàn
  rationale: Ó túmọ̀ sí ẹni tí kò sí ìdí tó lẹ́sẹ̀ nílẹ̀ láti fi dá lẹ́bi tàbí gàn; kò béèrè àìní-àṣìṣe pátápátá.
- source_word: ὦσιν
  choice: wọ́n lè jẹ́
  rationale: Ó dúró fún ọ̀rọ̀ ìṣe ọ̀pọ̀ nínú gbólóhùn ète, nígbà tí ẹni tí ‘wọ́n’ ń tọ́ka sí ṣì jẹ́ aláìsọ pàtó gẹ́gẹ́ bí ó ti rí ní Gíríìkì.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ inú ‘kí wọ́n lè jẹ́ aláìlẹ́gàn’ ń tọ́ka sí
  choice: A lo ‘wọ́n’ láìdárúkọ ẹgbẹ́ kan pàtó nínú ẹsẹ náà.
  alternative: Ó lè tọ́ka sí àwọn opó àti ìdílé wọn tí àwọn ìtọ́nisọ́nà tó ṣáájú ń sọ̀rọ̀ nípa wọn; àwọn kan tún lè ka a sí Tímótì tàbí ìjọ ní gbogbogbòò.
  rationale: Gíríìkì kò sọ olùṣe ọ̀pọ̀ náà ní tààrà. Àyíká ẹsẹ náà mú kí àwọn tí a ṣẹ̀ṣẹ̀ fún ní ìtọ́nisọ́nà, pàápàá àwọn opó àti ìdílé wọn, ṣeé ṣe jù, ṣùgbọ́n ìtumọ̀ náà kò yẹ kí a fi tipátipá sọ di pàtó.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Máa pàṣẹ’ fi àṣẹ tó wà nínú παράγγελλε hàn, nígbà tí ‘aláìlẹ́gàn’ yẹra fún ìtumọ̀ àìní-àṣìṣe pátápátá. A fi àmì ohùn síbi tí ó bá yẹ.
