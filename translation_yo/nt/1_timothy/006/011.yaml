id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: yo
  text: Ṣùgbọ́n ìwọ, ènìyàn Ọlọ́run, sá fún àwọn nǹkan wọ̀nyí; kí o sì máa lépa òdodo[a], ìwà ìbẹ̀rù Ọlọ́run, ìgbàgbọ́[b], ìfẹ́, ìfaradà, ìwà tútù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìdúróṣinṣin” tàbí “ìgbẹ́kẹ̀lé.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n yìí tún lè jẹ́ “ìrẹ̀lẹ̀,” “ìfaradà,” tàbí “ìwà tútù onísùúrù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Ṣùgbọ́n ìwọ
  rationale: Ó tẹnu mọ́ ẹni tí a ń bá sọ, ó sì fi Tímótì ṣe ìyàtọ̀ sí àwọn tí a ṣàpèjúwe ṣáájú.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: ènìyàn Ọlọ́run
  rationale: Èyí ni ọ̀nà àdáyébá àti ọ̀rọ̀ oyè Bíbélì ní Yorùbá fún ẹni tí ó jẹ́ ti Ọlọ́run; nínú àyíká yìí, Tímótì ni a ń pè ní tààrà.
- source_word: ταῦτα φεῦγε
  choice: sá fún àwọn nǹkan wọ̀nyí
  rationale: ‘Sá fún’ pa agbára àṣẹ náà mọ́, ó sì ju ‘yẹra fún’ lọ ní kíkankíkan; ‘àwọn nǹkan wọ̀nyí’ tọ́ka sí àwọn ìwà búburú àti ìfẹ́ owó tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: δίωκε
  choice: máa lépa
  rationale: Àṣẹ ìsinsìnyí ń fi ìṣe tí ó ń bá a lọ hàn; ‘lépa’ tún bá ìyàtọ̀ tó wà láàárín sísá fún ibi àti wíwá ìwà rere mu.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìwà títọ́ níwájú Ọlọ́run àti ènìyàn, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ ìdájọ́ òdodo.
- source_word: εὐσέβειαν
  choice: ìwà-bí-Ọlọ́run
  rationale: Ó ṣàfihàn ìgbé ayé olùfọkànsìn tí ó bọ̀wọ̀ fún Ọlọ́run. Àmì ìdàpọ̀ náà mú kí àkójọpọ̀ ọ̀rọ̀ náà ṣe kedere.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ pàtàkì tó mọ́gbọ́n dání, ṣùgbọ́n àyíká àkójọ ìwà rere tún jẹ́ kí ‘ìṣòtítọ́’ tàbí ‘ìgbẹ́kẹ̀lé’ ṣeé ṣe.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Ìtumọ̀ àdáyébá, kedere, tí ó sì yẹ fún àkójọ ìwà rere.
- source_word: ὑπομονήν
  choice: ìfaradà
  rationale: Ó sọ nípa dídúró ṣinṣin lábẹ́ ìṣòro, kì í ṣe dídúró de nǹkan lásán.
- source_word: πραϋπαθίαν
  choice: ìwà tútù
  rationale: Ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n yìí ní èrò ìwà pẹ̀lẹ́ àti sùúrù tí ń kó ara níjàánu; ‘ìwà tútù’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere jù lọ, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ìpè ὦ ἄνθρωπε θεοῦ
  choice: ènìyàn Ọlọ́run
  alternative: ọkùnrin Ọlọ́run
  rationale: Ní Gíríìkì, ἄνθρωπος lè túmọ̀ sí ènìyàn, ó sì jẹ́ ọ̀rọ̀ oyè tí a lò fún Tímótì níbí. ‘Ènìyàn Ọlọ́run’ pa àṣà ọ̀rọ̀ Bíbélì mọ́ láì sọ ìtumọ̀ rẹ̀ di ti gbogbo ènìyàn nínú àyíká yìí.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Àkójọ ìwà rere ṣe ìtìlẹ́yìn fún ‘òdodo,’ ṣùgbọ́n àlàyé ìsàlẹ̀ kò pa apá ìtumọ̀ tó kan ìdájọ́ òdodo rẹ́.
- issue: Ìtumọ̀ πίστις nínú àkójọ ìwà rere
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́, ṣùgbọ́n nínú àyíká yìí ọ̀rọ̀ náà tún lè tọ́ka sí jíjẹ́ olóòtítọ́ tàbí gbígbẹ́kẹ̀lé; a fi àṣàyàn náà sílẹ̀ ní àlàyé dípò píparí àríyànjiyàn náà.
- issue: Ìtumọ̀ ọ̀rọ̀ tó ṣọ̀wọ́n πραϋπαθία
  choice: ìwà tútù
  alternative: ìrẹ̀lẹ̀, ìforígbárí, tàbí ìwà tútù onísùúrù
  rationale: Ọ̀rọ̀ náà ṣọ̀wọ́n, ó sì lè darapọ̀ ìwà pẹ̀lẹ́ mọ́ sùúrù àti ìkóra-ẹni-níjàánu; àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. Àwọn àṣẹ ‘sá fún’ àti ‘máa lépa’ pa agbára àti ìyàtọ̀ inú Gíríìkì mọ́.
