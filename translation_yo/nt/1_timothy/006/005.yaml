id: 1TI.6.5
reference: 1 Timothy 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: yo
  text: ìforígbárí tí kò dáwọ́ dúró[a] láàárín àwọn ènìyàn tí èrò inú wọn ti bàjẹ́, tí a sì ti gba òtítọ́ kúrò lọ́dọ̀ wọn, tí wọ́n rò pé ìfọkànsìn sí Ọlọ́run jẹ́ ọ̀nà láti jèrè[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìjà tí kò lópin” tàbí “àríyànjiyàn léraléra.” Ọ̀rọ̀ Gíríìkì náà ń fi ìforígbárí tàbí ìjà tí ń ṣẹlẹ̀ léraléra hàn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “pé ìfọkànsìn sí Ọlọ́run jẹ́ èrè” tàbí “orisun èrè.” Ìtumọ̀ rẹ̀ ni pé wọ́n ń lo ìfọkànsìn sí Ọlọ́run láti wá àǹfààní, pàápàá èrè ohun ìní.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: ìforígbárí tí kò dáwọ́ dúró
  rationale: Ọ̀rọ̀ Gíríìkì náà ṣàpẹẹrẹ fífi ara ẹni kọ ara ẹni léraléra, èyí tí ó ń yọrí sí ìforígbárí tí ń bá a lọ. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìjà tàbí ìforígbárí aláìdáwọ́dúró mọ́.
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: tí èrò inú wọn ti bàjẹ́
  rationale: Àpólà aláìṣe náà fi ipò tí ìbàjẹ́ ti mú wá hàn. “Èrò inú” mú apá ìrònú àti ìwà inú νοῦς jáde láìfi ìdálẹ́bi tí ó le ju ti ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: tí a sì ti fi òtítọ́ dù wọ́n
  rationale: 'Èyí pa ìṣe aláìṣe àti ipò tí ó ti wáyé mọ́: a ti fi ohun kan dù wọ́n, ohun náà sì ni òtítọ́. Kò sọ ẹni tí ó ṣe é ní pàtó, gẹ́gẹ́ bí Gíríìkì.'
- source_word: νομιζόντων
  choice: tí wọ́n rò pé
  rationale: Ó ṣàlàyé èrò àṣìṣe tí àwọn ènìyàn náà ní. Àyíká ọ̀rọ̀ ni ó fi hàn pé èrò náà kò tọ́, nítorí náà kò pọndandan láti fi ọ̀rọ̀ ìdálẹ́bi mìíràn kún un.
- source_word: πορισμὸν
  choice: ọ̀nà láti jèrè
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí èrè tàbí ohun tí a fi ń rí èrè. Yíyan “ọ̀nà láti jèrè” mú ìlò ìfọkànsìn gẹ́gẹ́ bí irinṣẹ́ fún àǹfààní hàn ní kedere.
- source_word: εὐσέβειαν
  choice: ìfọkànsìn Ọlọ́run
  rationale: Nínú àwọn lẹ́tà pásítọ́, ọ̀rọ̀ náà ń tọ́ka sí ìgbésí ayé ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run. Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì yẹra fún fífi ìtumọ̀ náà mọ́ ìṣe ẹ̀sìn òde nìkan.
theological_decisions:
- issue: Bóyá εὐσέβεια ń tọ́ka sí ìfọkànsìn tòótọ́ tàbí sí àṣà ẹ̀sìn òde lásán
  choice: ìfọkànsìn Ọlọ́run
  alternative: ẹ̀sìn; ìwà-bí-Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní ìtumọ̀ rere; àṣìṣe àwọn olùkọ́ náà wà nínú bí wọ́n ṣe sọ ọ́ di irinṣẹ́ èrè, kì í ṣe nínú pé ìfọkànsìn náà jẹ́ ohun búburú.
- issue: Bí a ṣe yẹ kí a fi ipò διεφθαρμένων hàn líle tó
  choice: èrò inú wọn ti bàjẹ́
  alternative: wọ́n ti di ẹni ìwà ìbàjẹ́ ní inú
  rationale: Ìtumọ̀ tí a yàn pa ìdájọ́ ìwà inú ọ̀rọ̀ náà mọ́ láìgbọ̀n-ọ́n ju agbára ọ̀rọ̀ Gíríìkì lọ tàbí láìfi èrò ẹ̀kọ́ ìgbà mìíràn kún un.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ẹsẹ̀ náà jẹ́ àjákù gírámà tó ń bá ọ̀rọ̀ ẹsẹ̀ tó ṣáájú lọ, nítorí náà a pa ìrísí àpólà àpèjúwe rẹ̀ mọ́ dípò ṣíṣe e ní gbólóhùn tuntun.
