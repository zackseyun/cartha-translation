id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: yo
  text: kí o pa àṣẹ náà mọ́ láìní àbàwọ́n àti láìní ẹ̀sùn[b][c], títí di ìfarahàn Olúwa wa Jésù Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” Akọ́lé Gíríìkì Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí akọ́lé tí a túmọ̀ sí “Mèsáyà,” tàbí gẹ́gẹ́ bí ìrísí àṣà “Kristi,” tó ti fẹ́rẹ̀ẹ́ dà bí apá orúkọ.
    reason: alternative_reading
  - marker: b
    text: Nínú Gíríìkì, àwọn ọ̀rọ̀ “láìní àbàwọ́n” àti “láìní ẹ̀sùn” bá ẹni tí a ń bá sọ̀rọ̀, Tímótì, mu ní gírámà; nítorí náà wọ́n ṣàpèjúwe rẹ̀, kì í ṣe àṣẹ náà.
    reason: lexical_alternative
  - marker: c
    text: 'A tún lè sọ ọ́ pé: “kí o pa àṣẹ náà mọ́, kí o sì wà láìní àbàwọ́n àti láìní ẹ̀sùn.”'
    reason: previous_rendering
lexical_decisions:
- source_word: τηρῆσαί
  choice: pa … mọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pípa àṣẹ mọ́ ní ìgbọ́ràn àti òtítọ́, láìfi kún un pé ó túmọ̀ sí ṣíṣọ́ nìkan.
- source_word: ἐντολήν
  choice: àṣẹ náà
  rationale: Ó pa ìtumọ̀ àṣẹ pàtó kan àti ìwọ̀n ọlá rẹ̀ mọ́, ó sì bá àyíká ọ̀rọ̀ nípa ohun tí a fi lé Tímótì lọ́wọ́ mu.
- source_word: ἄσπιλον
  choice: láìní àbàwọ́n
  rationale: Ó túmọ̀ sí pé kò ní àbàwọ́n tàbí àbùkù; gbólóhùn náà kò fi dandan pinnu bóyá àṣẹ náà tàbí bí Tímótì ṣe ń pa á mọ́ ni a ń ṣàpèjúwe.
- source_word: ἀνεπίλημπτον
  choice: láìlẹ́gàn
  rationale: Ó fi hàn pé kò sí ẹ̀sùn tó lẹ́sẹ̀ nílẹ̀ tí a lè fi gàn án; ó jẹ́ ọ̀rọ̀ Yorùbá kúkúrú, tó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ náà mu.
- source_word: μέχρι
  choice: títí di
  rationale: Ó tọ́ka sí bí ohun náà yóò ṣe bá a lọ dé ìṣẹ̀lẹ̀ ọjọ́ iwájú kan.
- source_word: ἐπιφανείας
  choice: ìfarahàn
  rationale: Ó sọ ìfarahàn tí a ó rí ní gbangba láìfi ọ̀rọ̀ ‘lẹ́ẹ̀kejì’ kún ohun tí orísun kò sọ ní tààrà.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ akọ́lé ọlá tí a sábà máa ń lò fún κύριος ní Yorùbá.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Jésù jẹ́ orúkọ, Mèsáyà sì mú agbára akọ́lé Χριστός jáde ní kedere nínú àyíká ọ̀rọ̀ nípa ìfarahàn rẹ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn ọlá yìí, pàápàá ní àyíká ìfarahàn ọjọ́ iwájú, agbára akọ́lé náà ṣì hàn; ‘Mèsáyà’ mú ìtumọ̀ ẹni tí a fòróró yàn jáde, nígbà tí ‘Kristi’ jẹ́ ìrísí àṣà tí ó lè dà bí apá orúkọ.
- issue: Ohun tí ἄσπιλον àti ἀνεπίλημπτον ń ṣàpèjúwe
  choice: 'A fi àjọṣe náà sílẹ̀ ní ọ̀nà kúkúrú: ‘pa àṣẹ náà mọ́ láìní àbàwọ́n àti láìlẹ́gàn’'
  alternative: Kí a so àwọn àpèjúwe náà mọ́ àṣẹ náà nìkan, tàbí mọ́ Tímótì àti bí ó ṣe ń pa á mọ́ nìkan
  rationale: Àwọn ajẹtífù Gíríìkì bá ‘àṣẹ’ mu ní gírámà, ṣùgbọ́n ìtumọ̀ gbólóhùn kúkúrú náà lè kan àṣẹ bí a ti pa á mọ́ tàbí ẹni tó ń pa á mọ́. Yorùbá àkọ́kọ́ pa ìfúnpọ̀ yìí mọ́ dípò yíyan ọ̀kan láìsí ìdí tó lágbára.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘kí o’ dípò ìrísí tó le ju, ‘pa … mọ́’ fún ìgbọ́ràn tó ń bá a lọ, àti ‘ìfarahàn’ láìfi ẹ̀kọ́ ‘ìfarahàn kejì’ kún orísun. Àmì ohùn ni a lò níbi tí ó bá yẹ.
