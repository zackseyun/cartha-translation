  terminology: A yí βλασφημίαι sí ‘ọ̀rọ̀ ìgàn’ láti fi ọ̀rọ̀ ìbàjẹ́/ìsọ̀rọ̀ sí ènìyàn hàn láì sọ ọ́ di ìfibú nìkan tàbí ọ̀rọ̀-òdì sí Ọlọ́run nìkan. ‘Ìjà ọ̀rọ̀’ wúlò fún λογομαχίαι, ‘ìlara’ fún φθόνος, àti ‘ìfura búburú’ fún ὑπόνοιαι πονηραί.
