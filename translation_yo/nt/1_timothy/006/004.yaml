    rationale: Ní Yorùbá, ọ̀rọ̀-èébú sábà ń tọ́ka sí ìfibú. Nínú àkójọ ìwà láàárín ènìyàn yìí, βλασφημίαι túmọ̀ sí ọ̀rọ̀ ìgàn, ìsọ̀rọ̀, tàbí ọ̀rọ̀ tí ń ba orúkọ ẹni jẹ́.
