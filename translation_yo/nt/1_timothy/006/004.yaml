source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: yo
  text: Ó ti gbéraga[a], kò sì lóye ohunkóhun, ṣùgbọ́n ó ń ṣàìsàn nítorí ìfẹ́kúfẹ̀ẹ́ sí àríyànjiyàn àti ìjà ọ̀rọ̀[b]. Láti inú àwọn nǹkan wọ̀nyí ni ìlara, ìjà, ọ̀rọ̀ ìgàn[c], àti àwọn ìfura búburú ti ń wá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ti di agbéraga.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà ń fi àwòrán ẹni tí ó wú nítorí ìgbéraga hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìjà ọ̀rọ̀” tàbí “àríyànjiyàn nípa àwọn ọ̀rọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Níhìn-ín, “ọ̀rọ̀ ìgàn” túmọ̀ sí ọ̀rọ̀ ìbàjẹ́ tàbí ọ̀rọ̀ tí ń ba orúkọ ènìyàn jẹ́; ní àwọn àyíká mìíràn, ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀-òdì sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: ó ti gbéraga
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ perfect passive/middle, ó sì ń tọ́ka sí ipò ìgbéraga tí ẹni náà ti dé. ‘Ó ti gbéraga’ jẹ́ èdè Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé a ṣàlàyé àwòrán ‘wíwú’ inú ọ̀rọ̀ náà nínú àlàyé ìsàlẹ̀.
- source_word: μηδὲν ἐπιστάμενος
  choice: kò lóye ohunkóhun
  rationale: Èyí fi hàn pé ẹni náà kò ní òye gidi, kì í ṣe pé kò mọ àwọn òtítọ́ kan ṣoṣo.
- source_word: νοσῶν περὶ ζητήσεις
  choice: ó ní ìfẹ́ àìlera sí àwọn àríyànjiyàn
  rationale: ‘Ìfẹ́ àìlera’ pa àkàwé àìsàn mọ́ ní ọ̀nà tí ó yé òǹkàwé Yorùbá, ó sì fi ìfẹ́ tí kò dára sí àríyànjiyàn hàn.
- source_word: λογομαχίας
  choice: ìjà lórí ọ̀rọ̀
  rationale: Ó mú agbára àkàwé ogun inú ọ̀rọ̀ náà jáde, ó sì ṣàlàyé pé ìjà náà ní í ṣe pẹ̀lú àwọn ọ̀rọ̀.
- source_word: ἐξ ὧν γίνεται
  choice: Láti inú àwọn nǹkan wọ̀nyí ni ... ti ń wá
  rationale: 'Ó sọ ìbáṣepọ̀ àbájáde di mímọ́: àwọn ìwà búburú wọ̀nyí ń jáde láti inú àríyànjiyàn àti ìjà ọ̀rọ̀.'
- source_word: φθόνος
  choice: ìlara
  rationale: ‘Ìlara’ jẹ́ ọ̀rọ̀ Yorùbá tó pé fún ìbànújẹ́ sí rere tàbí àǹfààní ẹlòmíràn.
- source_word: ἔρις
  choice: ìjà
  rationale: Nínú àkójọ ìwà búburú yìí, ‘ìjà’ jẹ́ ọ̀rọ̀ ṣókí, àdánidá fún awuyewuye àti ìforígbárí.
- source_word: βλασφημίαι
  choice: ọ̀rọ̀-èébú
  rationale: Ní àyíká ìbáṣepọ̀ láàárín ènìyàn yìí, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ọ̀rọ̀ tí ń ba ẹlòmíràn jẹ́ tàbí tí ń gàn án; ‘ọ̀rọ̀-èébú’ pa ìtumọ̀ náà mọ́ láì fi sí ọ̀rọ̀ sí Ọlọ́run nìkan.
- source_word: ὑπόνοιαι πονηραί
  choice: ìfura búburú
  rationale: Ìtumọ̀ tààrà ni èyí fún ìfura tí ìwà búburú ń darí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye ni a lò. A pa àwòrán àìsàn inú νοσῶν mọ́ nípasẹ̀ ‘ìfẹ́ àìlera,’ a sì mú àwòrán ìjà inú λογομαχίας jáde. Gbogbo àmì àlàyé ìsàlẹ̀ [a], [b], àti [c] wà nínú ọ̀rọ̀ àkọ́kọ́.
