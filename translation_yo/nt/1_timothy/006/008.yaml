  text: But if we have food and covering[a], we will be content with these.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ní oúnjẹ àti àwọn ohun tí ń bò wá[a], a ó tẹ́lọ́rùn pẹ̀lú àwọn nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aṣọ.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka ní gbangba sí ohun tí ń bo ènìyàn; ó sì lè ní ibi ààbò nínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: bí a bá ní
  rationale: Ọ̀rọ̀ àbọ̀ náà ń fi ipò tí ọ̀rọ̀-ìṣe pàtàkì dúró lé hàn. Ìtumọ̀ oníṣ条件 ‘bí a bá ní’ bá èdè Yorùbá mu, kò sì fi dandan túmọ̀ ọ́ sí ‘nítorí pé a ní.’
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó ń fi ìyàtọ̀ kékeré tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn láti inú ẹsẹ tó ṣáájú; ‘Ṣùgbọ́n’ mú ìyàtọ̀ náà jáde ní kedere.
- source_word: διατροφὰς
  choice: oúnjẹ
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun ìgbé-ayé, pàápàá oúnjẹ; ‘oúnjẹ’ jẹ́ ọ̀rọ̀ àdánidá, tó sì ṣe kedere ní Yorùbá òde òní.
- source_word: σκεπάσματα
  choice: ohun ìbò
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí a fi ń bo ènìyàn, bí aṣọ, ó sì ṣeé ṣe kí ó tún kan ibi ààbò. ‘Ohun ìbò’ pa ìtumọ̀ gbígbòòrò náà mọ́.
- source_word: τούτοις
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka padà sí oúnjẹ àti ohun ìbò tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì pa agbára ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: ἀρκεσθησόμεθα
  choice: yóò tẹ́ wa lọ́rùn
  rationale: Fọ́ọ̀mù ọjọ́ iwájú náà sọ pé àwọn ohun pàtàkì wọ̀nyí yóò tó fún wa, a ó sì ní ìtẹ́lọ́rùn pẹ̀lú wọn. Ìtumọ̀ yìí pa ọjọ́ iwájú indicative mọ́, dípò kí ó yí i sí àṣẹ ‘ẹ jẹ́ kí...’
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ σκεπάσματα
  choice: ohun ìbò, tó lè ní aṣọ àti ibi ààbò nínú
  alternative: aṣọ nìkan tàbí ilé/ibi ààbò nìkan
  rationale: Ọ̀rọ̀ náà gbòòrò ju aṣọ nìkan lọ, ó sì ṣeé ṣe kí ó kan ibi tí ń dáàbò bo ènìyàn. Ìtumọ̀ gbígbòòrò yìí kò fi ẹ̀kọ́ ẹ̀sìn tàbí ìlò àwùjọ tóóró kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé láti lóye. ‘Ohun ìbò’ mọ̀ọ́mọ̀ pa àìdánilójú lexical ti σκεπάσματα mọ́.
