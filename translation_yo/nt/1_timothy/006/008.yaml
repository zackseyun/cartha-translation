  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtumọ̀ gbogbogbọ̀ ti ἔχοντες, διατροφάς, τούτοις, àti ọjọ́ iwájú ἀρκεσθησόμεθα dáadáa. Ṣùgbọ́n “ohun ìbò” kò wọ́pọ̀, kò sì hàn gbangba gẹ́gẹ́ bí ohun tí ń bo ènìyàn; ó lè fa ìdàrúdàpọ̀ fún òǹkàwé Yorùbá òde òní. “Àwọn ohun tí ń bò wá” dá ìtumọ̀ gbooro ti σκεπάσματα dúró láì fi aṣọ tàbí ibi ààbò nìkan dí i.
  naturalness: “Àwọn ohun tí ń bò wá” jẹ́ èdè Yorùbá boṣewa tí ó rọrùn, tí ó sì ṣàlàyé ‘coverings’ ní ti gidi. “A ó tẹ́lọ́rùn pẹ̀lú àwọn nǹkan wọ̀nyí” jẹ́ ọ̀nà àdánidá láti sọ ìtẹ́lọ́rùn pẹ̀lú àwọn ohun ìpèsè wọ̀nyí, ó sì pa ipa ọjọ́ iwájú ọ̀rọ̀ Gíríìkì náà mọ́.
  terminology: A pa “oúnjẹ” mọ́ fún διατροφάς. A rọ́pò “ohun ìbò” pẹ̀lú “àwọn ohun tí ń bò wá” fún σκεπάσματα, kí ìtumọ̀ náà lè wúlò fún aṣọ, ohun ìbora, àti, ní ìtumọ̀ gbooro, ibi ààbò. Àlàyé ìsàlẹ̀ tún ṣe kedere pé “aṣọ” jẹ́ ìtumọ̀ míì, kì í ṣe ìtumọ̀ kan ṣoṣo.
