id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: yo
  text: Nítorí ìfẹ́ owó jẹ́ gbòǹgbò kan fún onírúurú ibi[a]; àwọn kan, nípa fífẹ́ rẹ̀ gidigidi, ti ṣáko kúrò nínú ìgbàgbọ́[b], wọ́n sì ti fi ọ̀pọ̀lọpọ̀ ìrora gún ara wọn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ àtijọ́, “Nítorí ìfẹ́ owó ni gbòǹgbò gbogbo ibi.” Gíríìkì túbọ̀ gba “gbòǹgbò kan fún onírúurú ibi” láàyè, èyí tí kò sọ pé gbogbo ibi ní orísun kan ṣoṣo.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ti ṣáko kúrò nínú ìgbàgbọ́.” Níhìn-ín, ó ṣeé ṣe kí “ìgbàgbọ́” tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí àwọn Kristẹni gbà gbọ́.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “wọ́n sì ti fi ọ̀pọ̀lọpọ̀ ìbànújẹ́ gún ara wọn” tàbí “wọ́n sì ti fi ọ̀pọ̀lọpọ̀ ìpọ́njú gún ara wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: gbòǹgbò kan
  rationale: Ọ̀rọ̀ náà kò ní árítíkù ní Gíríìkì, ó sì jẹ́ orúkọ-àpèjúwe tó wà ṣáájú ọ̀rọ̀-ìṣe; ‘gbòǹgbò kan’ fi hàn pé ó jẹ́ ọ̀kan lára àwọn orísun, kì í ṣe dandan pé òun nìkan ni orísun gbogbo ibi.
- source_word: πάντων τῶν κακῶν
  choice: fún onírúurú ohun búburú
  rationale: Ọ̀rọ̀ ọ̀pọ̀ κακῶν lè túmọ̀ sí àwọn ibi tàbí ohun búburú. ‘Onírúurú ohun búburú’ sọ ìtànkálẹ̀ irú wọn ní Yorùbá láì sọ pé gbogbo ibi láìsí àyọkà ní orísun kan ṣoṣo.
- source_word: φιλαργυρία
  choice: ìfẹ́ owó
  rationale: Ó túmọ̀ ní pàtó sí fífẹ́ owó tàbí fàdákà; ‘ìfẹ́ owó’ ṣe kedere, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ ju ọ̀rọ̀ gbooro bí ‘ojúkòkòrò’ lọ.
- source_word: ὀρεγόμενοι
  choice: nípa fífẹ́ rẹ̀ gidigidi
  rationale: Participle náà ń tọ́ka sí ìfẹ́ líle tàbí lílépa ohun kan; gbolohun yìí sọ agbára ìfẹ́ náà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ṣíṣáko.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: ti ṣáko kúrò nínú ìgbàgbọ́
  rationale: ‘Ṣáko kúrò’ pa àwòrán jíjìnà sí ipò tẹ́lẹ̀ mọ́, ó sì bá ìtumọ̀ ọ̀rọ̀-ìṣe náà mu ní èdè Yorùbá àdánidá.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Pẹ̀lú árítíkù àti bí a ṣe ń lo ọ̀rọ̀ náà nínú àwọn Lẹ́tà Olùṣọ́ Àgùntàn, ó ṣeé ṣe kí ó tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí a gbà gbọ́; Yorùbá lè fi ìtumọ̀ yìí sílẹ̀ láìfi àlàyé sínú ọ̀rọ̀ pàtàkì.
- source_word: περιέπειραν
  choice: fi ... gún ara wọn
  rationale: Ọ̀rọ̀-ìṣe náà ní àwòrán gígún tàbí lílu ohun kan wọ inú; ìtumọ̀ yìí pa àwòrán líle inú Gíríìkì mọ́.
- source_word: ὀδύναις πολλαῖς
  choice: ọ̀pọ̀lọpọ̀ ìrora
  rationale: ὀδύνη lè jẹ́ ìrora, ìbànújẹ́, tàbí ìpọ́njú líle. ‘Ìrora’ gbooro tó láti gba ìyà ara àti ti ọkàn láàyè.
theological_decisions:
- issue: Ìwọ̀n ohun tí Pọ́ọ̀lù sọ nípa ìfẹ́ owó àti ibi
  choice: Ìfẹ́ owó jẹ́ gbòǹgbò kan fún onírúurú ohun búburú.
  alternative: Ìfẹ́ owó ni gbòǹgbò gbogbo ibi.
  rationale: Àìsí árítíkù pẹ̀lú ῥίζα àti ọ̀rọ̀ ọ̀pọ̀ πάντων τῶν κακῶν ṣe àtìlẹ́yìn fún ìtumọ̀ tí kò sọ ìfẹ́ owó di orísun kan ṣoṣo ti gbogbo ibi láìsí àyọkà.
- issue: Ìtumọ̀ τῆς πίστεως
  choice: ‘Ìgbàgbọ́’ gẹ́gẹ́ bí ìgbàgbọ́ Kristẹni tí a ń jẹ́wọ́.
  alternative: Ìgbàgbọ́ gẹ́gẹ́ bí ìgbẹ́kẹ̀lé ẹni kọ̀ọ̀kan.
  rationale: Nínú àwọn Lẹ́tà Olùṣọ́ Àgùntàn, ‘ìgbàgbọ́ náà’ sábà máa ń tọ́ka sí ẹ̀kọ́ tàbí ìjẹ́wọ́ Kristẹni; síbẹ̀, a kò fi ọ̀rọ̀ àfikún sínú ẹsẹ náà kí ìwọ̀n àìdájú tó wà nínú ọ̀rọ̀ lè dúró.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa àwòrán ‘gbòǹgbò,’ ‘ṣáko,’ àti ‘gún ara wọn’ mọ́ láti inú Gíríìkì.
