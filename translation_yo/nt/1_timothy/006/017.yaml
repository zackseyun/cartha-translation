id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: yo
  text: Paṣẹ fún àwọn tí wọ́n jẹ́ ọlọ́rọ̀ ní ayé ìsinsìnyí[a] pé kí wọ́n má ṣe gbéraga, kí wọ́n má sì gbẹ́kẹ̀ lé àìdánilójú ọrọ̀[b], ṣùgbọ́n kí wọ́n gbẹ́kẹ̀ lé Ọlọ́run, ẹni tí ó ń pèsè ohun gbogbo fún wa lọ́pọ̀ yanturu láti gbádùn wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìgbà ìsinsìnyí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìgbà” tàbí, ní ìtumọ̀ tó gbòòrò, ètò ayé tó wà nísinsìnyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọrọ̀ tí kò dáni lójú” tàbí “ọrọ̀ tí kò dúró ṣinṣin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: Àwọn tí wọ́n jẹ́ ọlọ́rọ̀
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹgbẹ́ àwọn olówó láì sọ ọrọ̀ di àmì ìdánimọ̀ tí ó le koko; ó sì bá ìlò Yorùbá òde òní mu.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: ní ayé ìsinsìnyí
  rationale: “Ayé ìsinsìnyí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkókò tàbí ètò ayé tó wà nísinsìnyí, ó sì pa ìtumọ̀ àkókò tí αἰών ní mọ́.
- source_word: παράγγελλε
  choice: ni kí o pàṣẹ fún
  rationale: Ọ̀rọ̀ ìṣe náà jẹ́ àṣẹ lọwọlọwọ tí ó ní agbára; “pàṣẹ fún” fi ìwọ̀n agbára yẹn hàn kedere.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: kí wọ́n má ṣe gbéraga
  rationale: “Gbéraga” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, ó sì mú èrò ìgbéraga tàbí fífi ara ga hàn.
- source_word: μηδὲ ἠλπικέναι
  choice: kí wọ́n má sì gbẹ́kẹ̀ lé
  rationale: “Gbẹ́kẹ̀ lé” sọ ìgbẹ́mìí lé ohun kan gẹ́gẹ́ bí ìpìlẹ̀ ìrètí, ó sì dára ní àyíká ọ̀rọ̀ yìí.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: lé ọrọ̀ tí kò dáni lójú
  rationale: Ìtumọ̀ yìí fi àìdánilójú àti àìdúróṣinṣin ọrọ̀ hàn ní Yorùbá àdánidá, láì pinnu bóyá gírámà náà tẹnumọ́ “àìdánilójú ọrọ̀” tàbí “ọrọ̀ tí kò dáni lójú.”
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: bí kò ṣe Ọlọ́run
  rationale: Ó pa ìyàtọ̀ tó lágbára mọ́ láàárín gbígbẹ́kẹ̀ lé ọrọ̀ àti gbígbẹ́kẹ̀ lé Ọlọ́run; ohun tí a gbẹ́kẹ̀ lé láti gbolohun ṣáájú ni a lóye nínú èyí.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: ẹni tí ó ń pèsè ... fún wa
  rationale: “Ń pèsè” mú ìṣe Ọlọ́run gẹ́gẹ́ bí ẹni tó ń fúnni ní ohun tó yẹ hàn, ó sì bá participle náà mu.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìwọ̀n gbòòrò ọrọ̀ Gíríìkì mọ́ láì fi kún un pé àwọn ohun tí a nílò nìkan ni.
- source_word: πλουσίως
  choice: lọ́pọ̀ yanturu
  rationale: Ó sọ ọ̀pọ̀ àti ọ̀làwọ́ ìpèsè Ọlọ́run ní Yorùbá tí ó ṣe kedere; ìsopọ̀ pẹ̀lú àkòrí ọrọ̀ wà nínú àyíká gbolohun.
- source_word: εἰς ἀπόλαυσιν
  choice: láti máa gbádùn rẹ̀
  rationale: Ó fi ète tàbí àbájáde ìpèsè náà hàn ní ọ̀nà Yorùbá àdánidá, láì túmọ̀ “gbádùn” sí ìwà àṣejù.
theological_decisions:
- issue: Ìtumọ̀ αἰών nínú àyíká ìwà rere àti ìfojúsọ́nà ọjọ́ iwájú
  choice: ayé ìsinsìnyí
  alternative: ìgbà ìsinsìnyí
  rationale: “Ayé ìsinsìnyí” lè bo àkókò àti ètò ayé tó wà báyìí, ó sì jẹ́ àdánidá ju “ìgbà” lọ ní Yorùbá; àlàyé ẹsẹ̀ pa àṣàyàn “ìgbà” mọ́.
- issue: Ìwọ̀n ìpèsè Ọlọ́run nínú πάντα
  choice: ohun gbogbo
  alternative: gbogbo ohun tí a nílò
  rationale: Ọ̀rọ̀ orísun kò fi ìpèsè náà mọ́ àwọn ohun àìní nìkan. A pa gbígbòòrò rẹ̀ mọ́ láì fi ẹ̀kọ́ pé ọrọ̀ ayé dájú fún onígbàgbọ́ sínú rẹ̀.
- issue: Ète ìpèsè nínú εἰς ἀπόλαυσιν
  choice: láti máa gbádùn rẹ̀
  alternative: fún ìgbádùn
  rationale: Ọ̀rọ̀ náà jẹ́wọ́ pé a lè gbádùn ohun tí Ọlọ́run pèsè, ṣùgbọ́n kò sọ pé ìgbádùn tàbí ọrọ̀ ni góńgó pàtàkì jù lọ; a kò tú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ yìí sí ọ̀nà ẹ̀gbẹ́ kankan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. “Ní ayé ìsinsìnyí” ni a yàn fún ìṣàn èdè, nígbà tí àlàyé ẹsẹ̀ tọ́ka sí ìtumọ̀ àkókò. “Lọ́pọ̀ yanturu” mú ọ̀làwọ́ ìpèsè hàn, bí ó tilẹ̀ jẹ́ pé kò pa àtúnṣe ọ̀rọ̀ ọlọ́rọ̀/ọrọ̀ mọ́ ní fọ́ọ̀mù kan náà.
