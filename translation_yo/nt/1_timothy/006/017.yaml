  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: àṣẹ náà, ìkìlọ̀ lòdì sí ìgbéraga, àìdánilójú ọrọ̀, àti ìpèsè Ọlọ́run lọ́pọ̀ yanturu ni a pa mọ́. Ṣùgbọ́n ìyàtọ̀ ἀλλὰ ... ἐπὶ θεῷ yẹ kí ó tún sọ ìṣe ‘gbẹ́kẹ̀ lé’ jáde nínú Yorùbá, kí ohun tí ìrètí wọn yẹ kí ó wà lé lórí hàn láìsí àìlójú.'
