  terminology: ‘Ayé ìsinsìnyí,’ ‘gbéraga,’ ‘gbẹ́kẹ̀ lé,’ ‘àìdánilójú ọrọ̀,’ àti ‘Ọlọ́run’ bá ìlò Yorùbá òde òní mu, wọ́n sì fara mọ́ àwọn ìpinnu ọrọ̀ orísun. ‘Àìdánilójú ọrọ̀’ pa ìfarahàn Gíríìkì ‘uncertainty of riches’ mọ́ dáadáa.
