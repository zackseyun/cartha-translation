id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn tí ó fẹ́ di ọlọ́rọ̀ máa ń ṣubú sínú ìdẹwò, ìdẹkùn, àti ọ̀pọ̀ ìfẹ́kúfẹ̀ẹ́ aláìgbọ́n àti apanilára, tí wọ́n ń mú àwọn ènìyàn rì sínú ìparun àti ìṣègbé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι πλουτεῖν
  choice: Ṣùgbọ́n àwọn tí ó fẹ́ di ọlọ́rọ̀
  rationale: “Fẹ́” sọ ìfẹ́ tàbí ète tí ó dúró ṣinṣin; “di ọlọ́rọ̀” sì mú ìrònú lílépa ọrọ̀ hàn láìfi kún ohun tí Gíríìkì sọ.
- source_word: ἐμπίπτουσιν εἰς πειρασμὸν
  choice: máa ń ṣubú sínú ìdẹwò
  rationale: Ó pa àwòrán ṣíṣubú sínú ipò búburú mọ́, “ìdẹwò” sì bá ọ̀rọ̀ ìkìlọ̀ nípa ẹ̀ṣẹ̀ mu ju ìdánwò aláìdásí lọ.
- source_word: παγίδα
  choice: ìkẹ́kun
  rationale: “Ìkẹ́kun” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a fi ń dẹ ẹni, ó sì pa àwòrán ewu ìwà rere inú ọ̀rọ̀ náà mọ́.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: ọ̀pọ̀ ìfẹ́kúfẹ̀ẹ́ òmùgọ̀ tí ń pani lára
  rationale: “Ìfẹ́kúfẹ̀ẹ́” mú ìfẹ́ líle tí kò tọ́ hàn; “òmùgọ̀” àti “tí ń pani lára” túmọ̀ àìlóye àti ipa búburú wọn ní èdè Yorùbá tí ó ṣe kedere.
- source_word: βυθίζουσι τοὺς ἀνθρώπους
  choice: ń rì àwọn ènìyàn
  rationale: “Ń rì” pa àwòrán fífi ènìyàn wọ abẹ́ omi mọ́; “àwọn ènìyàn” jẹ́ gbogbogbò, kò sì tọ́ka sí akọ nìkan.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: ìparun àti ìṣègbé
  rationale: Àwọn ọ̀rọ̀ méjèèjì pa ìtẹnumọ́ méjì inú Gíríìkì mọ́, láìsọ pé ẹ̀bi ayérayé nìkan ni wọ́n túmọ̀ sí.
theological_decisions:
- issue: Bóyá ὄλεθρον καὶ ἀπώλειαν yẹ kí ó sọ ìdálẹ́bi ayérayé ní pàtó
  choice: ìparun àti ìṣègbé
  alternative: ìparun àti ègbé ayérayé
  rationale: Gíríìkì fi àbájáde tí ó burú gidigidi hàn, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò fi “ayérayé” kún un. Ìtumọ̀ náà pa ìkìlọ̀ líle àti ààyè ìtumọ̀ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A tún “sínú” ṣe nínú àtòjọ náà láti mú ìbáṣepọ̀ gírámà Gíríìkì àti kíkà Yorùbá ṣe kedere.
