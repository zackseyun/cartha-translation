revisions:
- from: Ṣùgbọ́n àwọn tí ó fẹ́ di ọlọ́rọ̀ máa ń ṣubú sínú ìdẹwò, sínú ìkẹ́kun,[a] àti sínú ọ̀pọ̀ ìfẹ́kúfẹ̀ẹ́ òmùgọ̀ tí ń pani lára; àwọn ìfẹ́kúfẹ̀ẹ́ wọ̀nyí sì ń rì àwọn ènìyàn sínú ìparun àti ìṣègbé.
