  to: Bí ẹnikẹ́ni bá ń kọ́ni ní ẹ̀kọ́ mìíràn, tí kò sì faramọ́ àwọn ọ̀rọ̀ tí ó ní ìlera, àwọn ọ̀rọ̀ Olúwa wa Jésù Mèsáyà[a], àti ẹ̀kọ́ tí ó bá ìfọkànsìn sí Ọlọ́run mu[b],
  rationale: Àtúnṣe náà yí “tí ó péye” padà sí “tí ó ní ìlera” kí àpẹẹrẹ ὑγιαίνουσι (‘ní ìlera,’ ní ọ̀nà àfiwé) má bàa sọnù. A tún so “faramọ́” pọ̀ gẹ́gẹ́ bí ọ̀rọ̀ kan fún ìlò Yorùbá tó rọrùn àti tó bá ìtumọ̀ ‘dúró ti/gbọ́ ọ̀rọ̀’ mu. A kò yí ìtumọ̀ Mèsáyà, ìfọkànsìn sí Ọlọ́run, àwọn àmì àkọlé ìsàlẹ̀, tàbí kóńmá ìkẹyìn—níwọ̀n bí gbolóhùn náà ti ń lọ sí ẹsẹ̀ tó tẹ̀ lé e—padà.
