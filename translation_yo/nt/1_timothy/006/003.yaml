id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá ń kọ́ni ní ẹ̀kọ́ mìíràn, tí kò sì faramọ́ àwọn ọ̀rọ̀ tí ó ní ìlera, àwọn ọ̀rọ̀ Olúwa wa Jésù Mèsáyà[a], àti ẹ̀kọ́ tí ó bá ìfọkànsìn sí Ọlọ́run mu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” “Mèsáyà” àti “Kristi” jẹ́ ọ̀nà méjì láti fi oyè Χριστός hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀kọ́ tí ó wà ní ìbámu pẹ̀lú ìwà ìfọkànsìn sí Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: ń kọ́ni ní ẹ̀kọ́ mìíràn
  rationale: Ó sọ pé ẹni náà ń kọ́ ẹ̀kọ́ tí ó yàtọ̀ sí èyí tí a ti gbà, láìfi ọ̀rọ̀ ìdájọ́ bí ‘ẹ̀kọ́ èké’ kún ohun tí ọ̀rọ̀ Gíríìkì sọ ní tààrà.
- source_word: προσέρχεται
  choice: fara mọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí gbígba ẹ̀kọ́ kan àti dídúró ti i, kì í ṣe wíwá sún mọ́ ọn ní ti ara.
- source_word: ὑγιαίνουσι λόγοις
  choice: àwọn ọ̀rọ̀ tí ó péye
  rationale: ‘Péye’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìlera àti ìdúróṣinṣin ẹ̀kọ́ hàn, nígbà tí ‘àwọn ọ̀rọ̀’ sì pa λόγοις mọ́.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: àwọn ọ̀rọ̀ Olúwa wa Jésù Mèsáyà
  rationale: Gbólóhùn náà dá àwọn ọ̀rọ̀ tí ó péye mọ̀ sí ti Olúwa Jésù, yálà gẹ́gẹ́ bí ọ̀rọ̀ tí ó sọ tàbí ọ̀rọ̀ tí ó ti ọ̀dọ̀ rẹ̀ wá.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ dípò lílo rẹ̀ bí orúkọ lásán.
- source_word: κατ’ εὐσέβειαν
  choice: tí ó bá ìfọkànsìn sí Ọlọ́run mu
  rationale: κατά níbí ń fi ìbámu hàn; yíyan yìí kò fi kún un pé ẹ̀kọ́ náà dá ìfọkànsìn sí Ọlọ́run sílẹ̀, bí ó tilẹ̀ jẹ́ pé èyí lè jẹ́ àbájáde rẹ̀.
- source_word: διδασκαλίᾳ
  choice: ẹ̀kọ́
  rationale: ‘Ẹ̀kọ́’ lè tọ́ka sí ohun tí a ń kọ́ni, ó sì bá àyíká ẹsẹ̀ náà mu.
- source_word: εὐσέβειαν
  choice: ìfọkànsìn sí Ọlọ́run
  rationale: Ó sọ nípa ìgbésí ayé ọ̀wọ̀ àti ìfọkànsìn tí ó dojú kọ Ọlọ́run; ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé Yorùbá òde òní.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: ‘Mèsáyà’ pa ipa Χριστός gẹ́gẹ́ bí oyè mọ́; àkọlé ìsàlẹ̀ sì tọ́ka sí irú ọ̀rọ̀ ìbílẹ̀ ‘Kristi’ láìsọ pé ìtumọ̀ méjèèjì yàtọ̀ ní ti ẹni tí wọ́n ń tọ́ka sí.
- issue: Ìbáṣepọ̀ ẹ̀kọ́ àti εὐσέβεια
  choice: ẹ̀kọ́ tí ó bá ìfọkànsìn sí Ọlọ́run mu
  alternative: ẹ̀kọ́ tí ó ń yọrí sí ìfọkànsìn sí Ọlọ́run
  rationale: κατά sọ ìbámu ní kedere ju ìdí-okùnfà lọ; nítorí náà, a kò sọ ní pàtó pé ẹ̀kọ́ náà ló ń fa ìfọkànsìn sí Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀rọ̀ tí ó níyì ṣùgbọ́n tí ó ṣeé lóye. A lo ‘fara mọ́’ àti ‘bá … mu’ fún ìṣàn ọ̀rọ̀ àdánidá. Àmì kọ́ńmá ìkẹyìn wà níbẹ̀ nítorí ẹsẹ̀ náà ń bá ọ̀rọ̀ rẹ̀ lọ sí ẹsẹ̀ tó tẹ̀ lé e.
