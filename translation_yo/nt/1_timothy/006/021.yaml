id: 1TI.6.21
reference: 1 Timothy 6:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: yo
  text: Àwọn kan ti ń sọ pé àwọn ní ìmọ̀ náà[a], wọ́n sì ti ṣìnà ní ti ìgbàgbọ́[b]. Kí oore-ọ̀fẹ́ wà pẹ̀lú yín[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí àwọn kan ń jẹ́wọ́, wọ́n ti ṣìnà ní ti ìgbàgbọ́.” Ọ̀rọ̀ Gíríìkì pa arọ́pò-orúkọ ìbátan náà mọ́ ní kedere; fáàbù náà sì tún lè túmọ̀ sí “wọ́n ti ṣàṣìṣe” tàbí “wọ́n ti pàdánù ibi àfojúsùn.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “ìgbàgbọ́” níbí túmọ̀ sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí àkójọpọ̀ ohun tí àwọn Kristẹni gbà gbọ́; síbẹ̀, ó tún lè túmọ̀ sí ìgbàgbọ́ tàbí ìgbẹ́kẹ̀lé ara ẹni ní ọ̀nà tó gbòòrò sí i.
    reason: alternative_reading
  - marker: c
    text: “Yín” nínú ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀, kì í ṣe ẹyọ kan.
    reason: textual_detail
lexical_decisions:
- source_word: ἥν
  choice: ìmọ̀ náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ abo ẹyọ kan yìí ń tọ́ka sí “ìmọ̀” tí ẹsẹ tó ṣáájú pè ní ìmọ̀ lásán. Dídá a padà sí “ìmọ̀ náà” mú ìtọ́kasí náà ṣe kedere ní Yorùbá láìgé e kúrò ní àyíká rẹ̀.
- source_word: ἐπαγγελλόμενοι
  choice: ń sọ pé àwọn ní
  rationale: Ní ọ̀nà tí a lò ó níbí, ọ̀rọ̀ náà túmọ̀ sí jíjẹ́wọ́ tàbí fífi ara ẹni hàn gẹ́gẹ́ bí ẹni tó ní ohun kan, kì í ṣe ṣíṣe ìlérí. Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìtumọ̀ náà.
- source_word: περὶ τὴν πίστιν
  choice: ní ti ìgbàgbọ́
  rationale: περί pẹ̀lú accusative ń fi ohun tí ọ̀rọ̀ kan kàn hàn. “Ní ti” pa ìbáṣepọ̀ yìí mọ́ ní Yorùbá.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ Yorùbá tó ṣe déédéé fún πίστις; ní àyíká yìí ó ṣeé ṣe kó tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ẹ̀kọ́ àti ohun tí àwọn onígbàgbọ́ gbà.
- source_word: ἠστόχησαν
  choice: ti ṣìnà
  rationale: Ọ̀rọ̀ náà ní àwòrán ẹni tó pàdánù ibi àfojúsùn. “Ti ṣìnà” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání, ó sì pa èrò pé wọn kò dé ibi tó yẹ mọ́.
- source_word: Ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ ìbùkún ìparí lẹ́tà; Yorùbá kò nílò àfihàn pàtó kan tó bá article Gíríìkì mu.
- source_word: μεθ’ ὑμῶν
  choice: wà pẹ̀lú yín
  rationale: A fi “wà” kún un kí ìbùkún náà lè pé ní Yorùbá. “Yín” pa nọ́ńbà púpọ̀ inú ὑμῶν mọ́.
theological_decisions:
- issue: Ìtumọ̀ “ìgbàgbọ́” nínú ìkìlọ̀ náà
  choice: Ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí a gbà gbọ́ àti tí a dì mú
  alternative: Ìgbàgbọ́ ara ẹni tàbí ìgbẹ́kẹ̀lé ẹni kọ̀ọ̀kan
  rationale: Nínú àwọn Lẹ́tà Olùṣọ́-àgùntàn, “ìgbàgbọ́” sábà máa ń tọ́ka sí ìgbàgbọ́ Kristẹni, pàápàá níbi tí ọ̀rọ̀ ti jẹ mọ́ ẹ̀kọ́ èké. Síbẹ̀, a kò fi àlàyé náà sínú ọ̀rọ̀ pàtàkì, kí ààyè ìtumọ̀ tó gbòòrò sí i lè wà.
- issue: Àwọn tí ìbùkún ìparí kàn
  choice: A pa “yín” tó jẹ́ ọ̀pọ̀ mọ́
  alternative: Kí a sọ ọ́ di ẹyọ kan bí ẹni pé Timotiu nìkan ni a ń bá sọ
  rationale: ὑμῶν jẹ́ ọ̀pọ̀, ó sì lè fi hàn pé ìbùkún náà dé ọ̀dọ̀ Timotiu àti àwùjọ àwọn onígbàgbọ́ tó wà pẹ̀lú rẹ̀.
translation_notes:
  register: A lo Yorùbá àdánidá, ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. “Ń sọ pé àwọn ní” yẹra fún ìtumọ̀ “ṣèlérí” tí kò bá àyíká mu; “ti ṣìnà” sì pa agbára àwòrán ἀστοχέω mọ́ láìlo gbólóhùn líle tàbí àjèjì.
