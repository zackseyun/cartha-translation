id: 1TI.6.7
reference: 1 Timothy 6:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: yo
  text: Nítorí a kò mú ohunkóhun wá sínú ayé[a], bẹ́ẹ̀ ni a kò lè gbé ohunkóhun jáde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹkipẹki: “Nítorí a kò mú ohunkóhun wá sínú ayé, nítorí pé a kò tilẹ̀ lè gbé ohunkóhun jáde.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè túmọ̀ sí “nítorí pé,” tàbí kó fi gbólóhùn kejì tó bá ti àkọ́kọ́ mu hàn.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ohunkóhun ... kò
  rationale: 'Ètò àtakò Yorùbá yìí fi ìkọ̀sẹ̀ pátápátá hàn ní ọ̀nà àdánidá: ‘a kò mú ohunkóhun.’'
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé tàbí ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀.
- source_word: εἰσηνέγκαμεν
  choice: a kò mú ... wá sínú
  rationale: ‘Mú ... wá sínú’ pa ìtumọ̀ ìṣe εἰσφέρω, ìyẹn mímú ohun wọ inú ibì kan, mọ́ ní Yorùbá tó ṣe kedere.
- source_word: εἰς τὸν κόσμον
  choice: sínú ayé
  rationale: Níhìn-ín κόσμος túmọ̀ sí ayé tí ènìyàn wọ̀ nígbà ìbí, kì í ṣe àgbáyé gẹ́gẹ́ bí ọ̀rọ̀ ìmọ̀ sáyẹ́ǹsì.
- source_word: ὅτι
  choice: bẹ́ẹ̀ ni
  rationale: Ó gbé gbólóhùn kejì kalẹ̀ gẹ́gẹ́ bí òtítọ́ tó bá ti àkọ́kọ́ mu, ní ọ̀nà àdánidá ní Yorùbá; àlàyé ìsàlẹ̀ pa ìtumọ̀ okùnfà ‘nítorí pé’ mọ́.
- source_word: οὐδὲ
  choice: kò ... ohunkóhun
  rationale: Àpapọ̀ àtakò yìí sọ ní kedere pé kò sí ohun kan rárá tí a lè gbé jáde.
- source_word: ἐξενεγκεῖν
  choice: gbé ... jáde
  rationale: Ó pa àwòrán gbígbé ohun jáde kúrò nínú ayé mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
- source_word: τι
  choice: ohunkóhun
  rationale: Ní abẹ́ àtakò, ‘ohunkóhun’ ni ìbámu àdánidá fún arọ́pò-orúkọ aláìdánimọ̀ yìí.
- source_word: δυνάμεθα
  choice: a kò lè
  rationale: Ó túmọ̀ agbára tàbí àǹfààní ṣíṣe ní kedere, ó sì jẹ́ ọ̀nà Yorùbá tó rọrùn jù fún ‘we are not able.’
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn kejì tí ὅτι bẹ̀rẹ̀
  choice: 'Gbólóhùn tó ń bá ti àkọ́kọ́ mu: a kò mú ohunkóhun wọ ayé, bẹ́ẹ̀ ni a kò lè gbé ohunkóhun jáde.'
  alternative: 'Gbólóhùn okùnfà: ‘nítorí pé a kò tilẹ̀ lè gbé ohunkóhun jáde.’'
  rationale: Ọ̀rọ̀ Gíríìkì ὅτι lè fi okùnfà hàn, ṣùgbọ́n ó tún lè so àwọn gbólóhùn méjì tó dọ́gba pọ̀ nínú òwe yìí. Àyànfẹ́ náà mú ìwọ̀ntúnwọ̀nsì àwọn méjèèjì jáde láìfi ẹ̀kọ́ ìsìn kún un; àlàyé ìsàlẹ̀ sì pa àṣàyàn okùnfà mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó níyì, tó ṣe kedere fún òǹkàwé òde òní. ‘Mú ... wá sínú’ àti ‘gbé ... jáde’ pa àfiwé wíwọ ayé àti fífi ayé sílẹ̀ mọ́; ‘bẹ́ẹ̀ ni’ sì mú ìwọ̀ntúnwọ̀nsì òwe náà dun dáadáa.
