translation:
  language: yo
  text: kí wọ́n ṣe rere, kí wọ́n jẹ́ ọlọ́rọ̀ nínú àwọn iṣẹ́ rere, kí wọ́n jẹ́ ọlàwọ́, kí wọ́n sì múra tán láti ṣàjọpín pẹ̀lú àwọn ẹlòmíràn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: kí wọ́n máa ṣe rere
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe náà mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ṣíṣe ohun rere ní ìtẹ̀síwájú.
- source_word: πλουτεῖν
  choice: kí wọ́n jẹ́ ọlọ́rọ̀
  rationale: Ó pa àwòrán ọrọ̀ mọ́, ó sì ń bá ìyàtọ̀ tí àyíká ẹsẹ̀ náà dá sílẹ̀ láàárín ọrọ̀ ayé àti ọrọ̀ nínú ìṣe rere mu.
- source_word: ἐν ἔργοις καλοῖς
  choice: nínú iṣẹ́ rere
  rationale: Ó fi hàn pé iṣẹ́ rere ni ibi tàbí ẹ̀ka tí wọ́n gbọ́dọ̀ ti jẹ́ ọlọ́rọ̀; gbolohun náà ṣe kedere, ó sì wọ́pọ̀ ní Yorùbá ìgbàlódé.
- source_word: εὐμεταδότους
  choice: kí wọ́n jẹ́ ọlàwọ́
  rationale: “Ọlàwọ́” sọ ìmúratán láti fi ohun ẹni fún ẹlòmíràn ní ṣókí àti ní èdè àdánidá.
- source_word: κοινωνικούς
  choice: kí wọ́n sì múra tán láti pín ohun tí wọ́n ní fún ẹlòmíràn
  rationale: Ó mú ìtẹ̀sí ọkàn sí ṣíṣàjọpín jáde, ó sì yà á sọ́tọ̀ díẹ̀ sí ìwà ọlàwọ́ láì fi ìtumọ̀ ẹgbẹ́ tàbí àwùjọ tí kò bá àyíká mu kún un.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: kí wọ́n jẹ́ ọlàwọ́, kí wọ́n sì múra tán láti pín ohun tí wọ́n ní fún ẹlòmíràn
  rationale: 'Ìtumọ̀ náà pa àwọn ànímọ́ méjèèjì mọ́: ìwà ọlàwọ́ nínú fífúnni àti ìmúratán láti ṣàjọpín.'
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún àwọn òǹkàwé òde òní. Àtúnṣe “ohun tí wọ́n ní fún ẹlòmíràn” mú ohun tí “pín” túmọ̀ sí kedere láì dín ìtẹ̀sí fífúnni àti ṣíṣàjọpín kù.
