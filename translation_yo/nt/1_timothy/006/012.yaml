id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: yo
  text: Máa ja ìjà rere ti ìgbàgbọ́[a]; di ìyè àìnípẹ̀kun mú, èyí tí a pè ọ́ sí, tí o sì ṣe ìjẹ́wọ́ rere náà níwájú ọ̀pọ̀ ẹlẹ́rìí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn Gíríìkì náà lè túmọ̀ sí ìjà tí ìgbàgbọ́ ń ṣàpèjúwe tàbí ìjà fún ìgbàgbọ́ Kristẹni.
    reason: alternative_reading
  - marker: b
    text: Gíríìkì kò sọ ohun tí ìjẹ́wọ́ náà jẹ́ ní tààrà. A lè ní ìbáṣepọ̀ rẹ̀ pẹ̀lú ìpè sí ìyè àìnípẹ̀kun nínú àyíká ọ̀rọ̀, ṣùgbọ́n a tún lè ka a gẹ́gẹ́ bí, “tí o sì ṣe ìjẹ́wọ́ rere náà níwájú ọ̀pọ̀ ẹlẹ́rìí.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου
  choice: Máa ja
  rationale: Ọ̀rọ̀ àṣẹ yìí ń tọ́ka sí ìsapá tí ó ń bá a lọ. “Máa ja” jẹ́ Yorùbá àdánidá, ó sì pa àwòrán ìjà tàbí ìdíje inú Gíríìkì mọ́.
- source_word: τὸν καλὸν ἀγῶνα
  choice: ìjà rere
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ ἀγωνίζου/ἀγῶνα mọ́ nípasẹ̀ “ja ìjà,” ó sì tú καλός sí “rere” láìfi ìtumọ̀ ẹ̀sìn mìíràn kún un.
- source_word: τῆς πίστεως
  choice: ti ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ pàtàkì πίστις. Àkópọ̀ ọ̀rọ̀ náà lè túmọ̀ sí ìjà tí ìgbàgbọ́ ń dá lórí tàbí ìjà fún ẹ̀kọ́ ìgbàgbọ́ Kristẹni; àlàyé ìsàlẹ̀ ojú ìwé pa méjèèjì mọ́.
- source_word: ἐπιλαβοῦ
  choice: di ... mú
  rationale: “Di ... mú” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún fífi ọwọ́ mú ohun kan tàbí gbígbà á fún ara ẹni, ó sì bá àṣẹ onípinnu inú Gíríìkì mu.
- source_word: τῆς αἰωνίου ζωῆς
  choice: ìyè àìnípẹ̀kun
  rationale: Gbólóhùn yìí jẹ́ èdè Yorùbá tí ó mọ́gbọ́n dání fún ìyè tí kò ní òpin, ó sì tọ́ka sí ìyè pàtó tí a mẹ́nu kàn nínú ìhìn rere.
- source_word: εἰς ἣν ἐκλήθης
  choice: èyí tí a pè ọ́ sí
  rationale: Ó pa èrò ibi-afẹ́ tàbí ohun tí ìpè náà darí sí mọ́. Fífi “a” lò jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí a kò dárúkọ olùṣe rẹ̀, láìṣàlàyé ju orísun lọ.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: o sì ṣe ìjẹ́wọ́ rere
  rationale: “Ṣe ìjẹ́wọ́” jẹ́ àkópọ̀ ọ̀rọ̀ Yorùbá àdánidá fún ìjẹ́wọ́ gbangba; “rere” tún pa ìbádọ́gba καλός pẹ̀lú “ìjà rere” mọ́.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: níwájú ọ̀pọ̀ ẹlẹ́rìí
  rationale: Ìtumọ̀ yìí sún mọ́ Gíríìkì, ó sì ṣe kedere pé àwọn ẹni tí ó rí tàbí gbọ́ ìjẹ́wọ́ náà ni a ń sọ, kì í ṣe “ajẹ́rìíkú.”
- source_word: καί
  choice: tí o sì ... nípa rẹ̀
  rationale: Ó so ìjẹ́wọ́ náà mọ́ ìyè àìnípẹ̀kun tí ìpè náà tọ́ka sí, gẹ́gẹ́ bí ọ̀nà kan tí ìtòlẹ́sẹẹsẹ Gíríìkì lè gbà yé wa. Nítorí Gíríìkì kò sọ “nípa rẹ̀” ní tààrà, a fi ìtumọ̀ aláìso yìí sínú àlàyé ìsàlẹ̀ ojú ìwé.
theological_decisions:
- issue: Ìtumọ̀ πίστεως nínú τὸν καλὸν ἀγῶνα τῆς πίστεως
  choice: “ti ìgbàgbọ́,” tí ó lè tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí a ń jà fún
  alternative: Ìjà tí ìgbàgbọ́ ẹni fúnra rẹ̀ ń dá lórí tàbí tí ìgbàgbọ́ ń ṣàpèjúwe
  rationale: Àpilẹ̀kọ Gíríìkì àti lílo πίστις nínú àwọn lẹ́tà olùṣọ́-agùntàn lè ṣe àtìlẹ́yìn fún ìtumọ̀ pàtó náà, ṣùgbọ́n gírámà kò mú ìtumọ̀ kejì kúrò. A kò yanjú àìdánilójú náà ní ìkọ̀kọ̀.
- issue: Ìbáṣepọ̀ ìjẹ́wọ́ náà pẹ̀lú ìyè àìnípẹ̀kun àti ìpè
  choice: A fi “nípa rẹ̀” hàn pé ìjẹ́wọ́ náà ní í ṣe pẹ̀lú ìyè àìnípẹ̀kun tí a pè Tímótì sí
  alternative: 'Kí a ka καί gẹ́gẹ́ bí àsopọ̀ lasan: “tí o sì ṣe ìjẹ́wọ́ rere níwájú ọ̀pọ̀ ẹlẹ́rìí”'
  rationale: Ìtòlẹ́sẹẹsẹ gbolohun Gíríìkì lè mú kí ìjẹ́wọ́ náà ní ìbáṣepọ̀ pẹ̀lú ìpè sí ìyè àìnípẹ̀kun, ṣùgbọ́n kò sọ ohun tí ìjẹ́wọ́ náà jẹ́ ní tààrà. Àlàyé [b] pa ìtumọ̀ aláìso mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Máa ja ìjà” pa agbára àwòrán Gíríìkì mọ́; “di ... mú” sì jẹ́ àṣẹ kíkún tí ó dùn bí Yorùbá àdánidá. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
