  source_fidelity: Ìtumọ̀ náà mú àwọn àṣẹ méjèèjì, àwòrán ‘ja ìjà,’ ìpè sí ìyè àìnípẹ̀kun, àti ìjẹ́wọ́ níwájú ẹlẹ́rìí púpọ̀ hàn dáadáa. Ṣùgbọ́n ‘nípa rẹ̀’ nínú ọ̀rọ̀ àkọ́kọ́ fi ohun tí ìjẹ́wọ́ náà jẹ́ kún ọ̀rọ̀ Gíríìkì. Gíríìkì so ìpè náà mọ́ ìyè àìnípẹ̀kun nípasẹ̀ εἰς ἣν, lẹ́yìn náà ó fi καί ṣàfikún ìjẹ́wọ́ náà; kò sọ pé ìjẹ́wọ́ náà jẹ́ nípa ìyè náà ní tààrà.
