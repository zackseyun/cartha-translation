id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: yo
  text: Timotiu, ṣọ́ ohun tí a fi lé ọ lọ́wọ́; yẹra fún àwọn ọ̀rọ̀ asán tí kò bá ìwà mímọ́ mu, àti àwọn ìtakora[a] ti ìmọ̀ tí a fi orúkọ èké pè[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àtakò.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun tí a kàn ń pè ní ìmọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Ìwọ Timotiu
  rationale: “Ìwọ” pẹ̀lú orúkọ ẹni tí a ń bá sọ ń fi agbára ìpè tààrà àti ìtumọ̀ ọ̀wọ̀ tí Ὦ ní hàn ní Yorùbá àdánidá.
- source_word: παραθήκην
  choice: ohun tí a fi sí ìkáwọ́ rẹ
  rationale: Gbólóhùn yìí sọ ohun tí a fi lé ẹnì kan lọ́wọ́ fún ìtọ́jú, láì sọ ní pàtó pé ìhìnrere, ẹ̀kọ́ àwọn aposteli, tàbí iṣẹ́ ìránṣẹ́ ni.
- source_word: φύλαξον
  choice: ṣọ́
  rationale: “Ṣọ́” túmọ̀ sí pípa ohun mọ́ àti dídáàbò bò ó pẹ̀lú ìṣọ́ra, ó sì bá àṣẹ aorist náà mu.
- source_word: ἐκτρεπόμενος
  choice: máa yẹra fún
  rationale: Ó mú èrò yíyà kúrò lẹ́gbẹ̀ẹ́ tàbí yíyẹra fún ohun kan jáde ní Yorùbá tí ó ṣe kedere.
- source_word: βεβήλους
  choice: tí kò ní ìbọ̀wọ̀ fún Ọlọ́run
  rationale: Dípò ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ tí ó lè ṣókùnkùn, gbólóhùn yìí fi ìyàtọ̀ sí ohun mímọ́ hàn ní èdè Yorùbá òde òní.
- source_word: κενοφωνίας
  choice: ọ̀rọ̀ asán
  rationale: Ó sọ̀rọ̀ nípa àsọyé tí kò ní èrè tàbí kókó, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: ἀντιθέσεις
  choice: àwọn àtakò
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn ohun tí a gbé dìde lòdì sí ohun mìíràn; “àtakò” pa ìtumọ̀ gbígbòòrò náà mọ́ ju fífi dandan túmọ̀ rẹ̀ sí ìtakora inú ọ̀rọ̀ lọ.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: ohun tí a ń pè ní ìmọ̀ lọ́nà èké
  rationale: Èyí mú kí ó ṣe kedere pé orúkọ “ìmọ̀” tí a fún un kò bá ohun tí ó jẹ́ mu, nígbà tí ó ń pa ìbáwí inú ψευδώνυμος mọ́.
theological_decisions:
- issue: Irú ohun tí παραθήκη ń tọ́ka sí nínú àyíká ọ̀rọ̀
  choice: A túmọ̀ ọ́ ní gbogbogbò gẹ́gẹ́ bí “ohun tí a fi sí ìkáwọ́ rẹ,” láì sọ ohun tí ó jẹ́ ní pàtó.
  alternative: A lè sọ pé “ìhìnrere,” “ẹ̀kọ́ àwọn aposteli,” tàbí “ojúṣe iṣẹ́ ìránṣẹ́ Timotiu.”
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí ọ̀rọ̀ tàbí ẹ̀kọ́ aposteli, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò dín ohun tí a fi lé Timotiu lọ́wọ́ kù sí ọ̀kan nínú àwọn àlàyé wọ̀nyí.
- issue: Ìbáṣepọ̀ τῆς ψευδωνύμου γνώσεως pẹ̀lú ἀντιθέσεις
  choice: A so “ohun tí a ń pè ní ìmọ̀ lọ́nà èké” mọ́ “àwọn àtakò” gẹ́gẹ́ bí ìtòlẹ́sẹẹsẹ Gíríìkì ṣe fi hàn.
  alternative: A lè ka gbólóhùn náà bí àpèjúwe tí ó kan “ọ̀rọ̀ asán” àti “àwọn àtakò” papọ̀.
  rationale: Genitive náà tẹ̀ lé ἀντιθέσεις ní tààrà, ṣùgbọ́n àgbékalẹ̀ ọ̀rọ̀ náà kò fi gbogbo ìbáṣepọ̀ àwọn èrò náà hàn láìsí àní-àní; a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéwọ̀, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá; “Ìwọ Timotiu” pa agbára ìpè tààrà mọ́, “fi sí ìkáwọ́” sì jẹ́ àwòrán Yorùbá àdánidá fún ohun tí a fi lé ẹnì kan lọ́wọ́ láti tọ́jú.
