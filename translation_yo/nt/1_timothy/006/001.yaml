review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the major Greek elements: enslaved persons under a yoke, their own masters, comprehensive honor, and the purpose that God''s name and the teaching not be reviled. However, footnote b expands διδασκαλία (''teaching'') to ''ẹ̀kọ́ ìgbàgbọ́'' (''teaching of faith''), which is not warranted by the source.'
  naturalness: The wording is generally clear Standard Yoruba. Recasting the opening as 'Gbogbo àwọn ẹrú tí wọ́n wà lábẹ́ àjàgà' more naturally attaches 'under a yoke' to the enslaved persons. 'sọ ọ̀rọ̀ òdì sí' is a more idiomatic expression than the hyphenated form.
  terminology: ‘Ẹrú,’ ‘àjàgà,’ ‘olúwa wọn,’ ‘ọlá,’ ‘orúkọ Ọlọ́run,’ and ‘ẹ̀kọ́ náà’ are appropriate contextual renderings. The alternative for διδασκαλία must remain semantically broad; ‘ẹ̀kọ́ ìgbàgbọ́ náà’ introduces a restriction absent from the Greek.
  issues:
  - severity: medium
    issue: Footnote b adds ‘ìgbàgbọ́’ to διδασκαλία.
    rationale: The Greek says simply ‘the teaching’ (ἡ διδασκαλία), not specifically ‘the teaching of faith.’ The note should offer a non-expansive alternative such as ‘ẹ̀kọ́-ìlànà náà’.
  - severity: low
    issue: The opening clause and expression for abusive speech can be made more idiomatic.
    rationale: ‘Gbogbo àwọn ẹrú tí wọ́n wà lábẹ́ àjàgà’ clearly reflects the Greek construction, and ‘sọ ọ̀rọ̀ òdì sí’ is standard, natural Yoruba.
  revised_text: Gbogbo àwọn ẹrú[a] tí wọ́n wà lábẹ́ àjàgà, kí wọ́n máa ka àwọn olúwa wọn sí ẹni tí ó yẹ fún gbogbo ọlá, kí a má bàa sọ ọ̀rọ̀ òdì sí orúkọ Ọlọ́run àti ẹ̀kọ́ náà[b][c].
  revised_footnotes:
