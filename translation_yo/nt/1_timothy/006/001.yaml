id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: yo
  text: Gbogbo àwọn ẹrú[a] tí wọ́n wà lábẹ́ àjàgà, kí wọ́n máa ka àwọn olúwa wọn sí ẹni tí ó yẹ fún gbogbo ọlá, kí a má bàa sọ ọ̀rọ̀ òdì sí orúkọ Ọlọ́run àti ẹ̀kọ́ náà[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí ‘ìránṣẹ́’ tàbí ‘ẹrú-ìránṣẹ́’; Gíríìkì: δοῦλοι. A lo ‘ẹrú’ níhìn-ín nítorí pé gbólóhùn ‘lábẹ́ àjàgà’ fi ipò ìdè náà hàn ní kedere.'
    reason: alternative_reading
  - marker: b
    text: Tàbí ‘ẹ̀kọ́-ìlànà náà.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí ‘kí a má bàa kẹ́gàn.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ẹrú
  rationale: Ọ̀rọ̀ yìí fi ipò ìdè ènìyàn hàn ní kedere, pàápàá nítorí gbólóhùn ‘lábẹ́ àjàgà’; ‘ẹrú’ ni ó bá ẹ̀rí Gíríìkì mu jù.
- source_word: ὑπὸ ζυγὸν
  choice: lábẹ́ àjàgà
  rationale: Ó pa àkàwé àjàgà mọ́, ó sì fi ipò ìtẹríba àti ìdè hàn.
- source_word: τοὺς ἰδίους δεσπότας
  choice: àwọn olúwa tiwọn
  rationale: ‘Olúwa’ lè tọ́ka sí ẹni tí ó ní àṣẹ lórí ẹrú, ‘tiwọn’ sì pa ìtumọ̀ ἰδίους mọ́ pé olúkúlùkù ń tọ́ka sí olúwa tirẹ̀.
- source_word: πάσης τιμῆς ἀξίους
  choice: ẹni tí ó yẹ fún gbogbo ọlá
  rationale: Èyí sọ ìdájọ́ pé àwọn olúwa náà yẹ fún ọlá ní èdè Yorùbá àdánidá, ó sì pa agbára πάσης mọ́.
- source_word: ἡγείσθωσαν
  choice: kí wọ́n máa ka ... sí
  rationale: Ìṣètò yìí fi àṣẹ tí ó ń bá a lọ hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘regard/consider as.’
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: orúkọ Ọlọ́run
  rationale: Ó pa èrò Bíbélì nípa orúkọ Ọlọ́run, ìdánimọ̀ rẹ̀, àti rere orúkọ rẹ̀ mọ́.
- source_word: ἡ διδασκαλία
  choice: ẹ̀kọ́ náà
  rationale: ‘Ẹ̀kọ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣọ́ ìtumọ̀ teaching/doctrine láìfi èdè ìmọ̀ ẹ̀sìn tí ó le koko kún un.
- source_word: βλασφημῆται
  choice: kí a má bàa sọ̀rọ̀-òdì sí
  rationale: Ìtumọ̀ yìí bá orúkọ Ọlọ́run àti ẹ̀kọ́ náà méjèèjì mu, ó sì fi ìsọ̀rọ̀ burúkú tàbí ẹ̀gàn tí ọ̀rọ̀ Gíríìkì lè túmọ̀ sí hàn.
- source_word: Ὅσοι εἰσὶν
  choice: Gbogbo àwọn tí wọ́n jẹ́
  rationale: Ó mú agbára àkópọ̀ ὅσοι jáde ní Yorùbá òde òní tí ó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλοι nínú ọ̀rọ̀ tí ó kan ètò ẹrú
  choice: ẹrú
  alternative: ìránṣẹ́; ẹrú-ìránṣẹ́
  rationale: Gbólóhùn ‘lábẹ́ àjàgà’ mú ipò ìdè wọn ṣe kedere. Ìtumọ̀ náà ń ṣàpèjúwe ipò àwùjọ tí ẹsẹ̀ náà mẹ́nu kàn; kì í ṣe ìfọwọ́sí ètò ẹrú.
- issue: Bí a ṣe túmọ̀ διδασκαλία
  choice: ẹ̀kọ́ náà
  alternative: ẹ̀kọ́ ìgbàgbọ́ náà
  rationale: ‘Ẹ̀kọ́ náà’ pa ààyè ìtumọ̀ Gíríìkì mọ́, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìjọ kan pàtó sínú ẹsẹ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ó jẹ́ ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Ìlò ‘ni kí wọ́n máa’ mú àṣẹ tí ó ń bá a lọ hàn; ‘kí a má bàa’ yí passive Gíríìkì padà sí ìṣètò aláìlẹ́ni-pàtó tí ó jẹ́ àdánidá ní Yorùbá.
