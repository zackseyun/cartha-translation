revisions:
- from: Gbogbo àwọn tí wọ́n jẹ́ ẹrú[a] lábẹ́ àjàgà ni kí wọ́n máa ka àwọn olúwa tiwọn sí ẹni tí ó yẹ fún gbogbo ọlá, kí a má bàa sọ̀rọ̀-òdì[c] sí orúkọ Ọlọ́run àti ẹ̀kọ́ náà[b].
  to: Gbogbo àwọn ẹrú[a] tí wọ́n wà lábẹ́ àjàgà, kí wọ́n máa ka àwọn olúwa wọn sí ẹni tí ó yẹ fún gbogbo ọlá, kí a má bàa sọ ọ̀rọ̀ òdì sí orúkọ Ọlọ́run àti ẹ̀kọ́ náà[b][c].
  rationale: The revision preserves the Greek syntax and sense while improving Yoruba idiom. It also corrects the lexical footnote for διδασκαλία so that it does not add ‘faith,’ an element not present in the source. The impersonal Yoruba construction continues to convey the Greek passive without identifying an agent.
  reviewer_model: gpt-5.6-terra
