id: 1TI.6.15
reference: 1 Timothy 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: yo
  text: èyí tí yóò fi hàn ní àwọn àkókò tirẹ̀[a]—Ẹni Alábùkún àti Olùṣàkóso kan ṣoṣo, Ọba àwọn tí ń jẹ ọba àti Olúwa àwọn tí ń ṣàkóso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ní àwọn àkókò tí ó yẹ.” Gbólóhùn náà ń tọ́ka sí àwọn àkókò tí òun fúnra rẹ̀ ti yàn.
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ àṣà ni: “Ọba àwọn ọba àti Olúwa àwọn olúwa.” Gíríìkì lo àwọn ọ̀rọ̀-ìṣe alápá, ní tààràtà: “Ọba àwọn tí ń jẹ ọba àti Olúwa àwọn tí ń ṣàkóso.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí “ìfarahàn” nínú ẹsẹ tó ṣáájú; “èyí tí” bá ohun tí a ń tọ́ka sí mu láìsọ ọ́ di ẹni.
- source_word: καιροῖς ἰδίοις
  choice: ní àwọn àkókò tirẹ̀
  rationale: A pa ọ̀pọ̀ “àwọn àkókò” mọ́ gẹ́gẹ́ bí Gíríìkì, “tirẹ̀” sì fi hàn pé àwọn àkókò náà wà lábẹ́ ìpinnu ẹni tí yóò fi ìfarahàn náà hàn.
- source_word: δείξει
  choice: yóò fi hàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe fífi ohun kan hàn gbangba, ó sì pa agbára gidi ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὁ μακάριος
  choice: Ẹni Alábùkún
  rationale: Ọ̀rọ̀ náà dúró bí oyè fún Ọlọ́run; “Ẹni Alábùkún” ní ìyì tó yẹ, ó sì lágbára ju “ẹni ayọ̀” lọ.
- source_word: μόνος δυνάστης
  choice: Olùṣàkóso kan ṣoṣo
  rationale: δυνάστης túmọ̀ sí ẹni tó ní agbára ìjọba; gbolohun yìí sọ ìṣàkóso aláṣẹ rẹ̀ ní Yorùbá òde òní láìlo ọ̀rọ̀ àtijọ́ tí kò ṣe kedere.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: Ọba àwọn tí ń jẹ ọba
  rationale: A pa agbára ọ̀rọ̀-ìṣe inú βασιλευόντων mọ́, ìyẹn àwọn tí wọ́n ń jẹ ọba, dípò yíyí gbogbo rẹ̀ sí ọ̀rọ̀-orúkọ nìkan.
- source_word: κύριος τῶν κυριευόντων
  choice: Olúwa àwọn tí ń ṣàkóso
  rationale: “Olúwa” pa oyè κύριος mọ́, “àwọn tí ń ṣàkóso” sì ṣàfihàn agbára ọ̀rọ̀-ìṣe κυριευόντων ní Yorùbá àdánidá.
theological_decisions:
- issue: Ta ni yóò fi ìfarahàn náà hàn?
  choice: A kò fi orúkọ pàtó kún ẹni náà; àwọn oyè inú ẹsẹ náà ló ń dá a mọ̀.
  alternative: A lè sọ ní kedere pé Baba ni yóò fi ìfarahàn Jesu Kristi hàn.
  rationale: Gíríìkì kò lo orúkọ pàtó níbí, ṣùgbọ́n ó ṣàpèjúwe ẹni tó ṣe ìṣe náà pẹ̀lú àwọn oyè gíga. Ìtumọ̀ náà pa ìṣàfihàn yìí mọ́, kò sì yanjú ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ ju bí ẹsẹ náà ṣe sọ ọ́ lọ.
translation_notes:
  register: Yorùbá boṣewa tó ní ìyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn oyè Ọlọ́run bẹ̀rẹ̀ pẹ̀lú lẹ́tà ńlá. Gbólóhùn náà tẹ̀ lé ìtòlẹ́sẹẹsẹ Gíríìkì débi tó ṣe lè jẹ́ Yorùbá àdánidá, ó sì pa ọ̀pọ̀ “àwọn àkókò” àti àwọn ọ̀rọ̀-ìṣe alápá méjèèjì mọ́.
