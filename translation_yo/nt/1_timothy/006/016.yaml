id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: yo
  text: ẹni tí òun nìkan ni ó ní àìkú, tí ó ń gbé inú ìmọ́lẹ̀ tí kò ṣeé sún mọ́, ẹni tí kò sí ẹnikẹ́ni nínú àwọn ènìyàn tí ó rí i rí, tí kò sì sí ẹni tí ó lè rí i.[a] Ọlá àti ìjọba ayérayé ni kí ó jẹ́ tirẹ̀.[b] Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kò sí ẹ̀dá ènìyàn kankan tí ó rí i rí, tí kò sì lè rí i.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lóye àpèjúwe àti ìyìn yìí gẹ́gẹ́ bí èyí tó ń tọ́ka sí Jésù Mèsáyà Olúwa ní tààràtà nínú àyíká ọ̀rọ̀ tó gbòòrò, bí ó tilẹ̀ jẹ́ pé èdè tó sọ pé a kò lè rí ẹni náà fi ara mọ́ Ọlọ́run jù lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: òun nìkan
  rationale: 'Ó fi ìyasọ́tọ̀ hàn ní èdè Yorùbá àdánidá: òun nìkan ṣoṣo ni ó ní ohun tí gbólóhùn náà ń sọ tẹ̀ lé e.'
- source_word: ἔχων ἀθανασίαν
  choice: ni ó ní àìkú
  rationale: “Ní àìkú” pa ìtumọ̀ pé àìkú jẹ́ ohun tí ó ní mọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: tí ó ń gbé inú ìmọ́lẹ̀ tí kò ṣeé sún mọ́
  rationale: Ìtumọ̀ yìí mú οἰκῶν gẹ́gẹ́ bí gbígbé inú ohun kan, ó sì sọ ἀπρόσιτον ní ọ̀nà Yorùbá tó ṣe kedere pé a kò lè sún mọ́ ìmọ́lẹ̀ náà.
- source_word: οὐδεὶς ἀνθρώπων
  choice: ẹnikẹ́ni nínú àwọn ènìyàn kò
  rationale: Ó pa ìtumọ̀ apá-kan-nínú-àpapọ̀ ti ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó kan gbogbo ẹ̀dá ènìyàn láìsí ìṣòro akọ tàbí abo.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: ẹnikẹ́ni kò sì lè rí
  rationale: “Kò lè” fi δύναται hàn gbangba, kì í ṣe pé kò tíì rí nìkan, ṣùgbọ́n pé kò lágbára láti rí.
- source_word: τιμὴ
  choice: ọlá
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ìyìn ọlọ́wọ̀ nínú ọ̀rọ̀ ìsìn.
- source_word: κράτος αἰώνιον
  choice: agbára ìjọba ayérayé
  rationale: κράτος nínú orin ìyìn tọ́ka sí agbára alákòóso tí ń ṣiṣẹ́, kì í ṣe okun lásán; “agbára ìjọba” pa ìtumọ̀ yẹn mọ́.
- source_word: ἀμήν
  choice: Àmín
  rationale: A lo ìkọ̀wé Yorùbá tí ó ti wọ́pọ̀ fún ọ̀rọ̀ ìjẹ́rìí àti ìfìdí-múlẹ̀ yìí.
theological_decisions:
- issue: Ẹni tí àwọn gbólóhùn ìbátan àti ìyìn náà ń tọ́ka sí
  choice: Ọlọ́run, ẹni tí àyíká ẹsẹ tó ṣáájú pè ní Aláṣẹ aláyọ̀ àti ẹni kan ṣoṣo
  alternative: Àwọn kan so àpèjúwe náà mọ́ Jésù Mèsáyà Olúwa ní tààràtà nítorí àyíká gbólóhùn tó gbòòrò.
  rationale: Ìtẹ̀síwájú ọ̀rọ̀ 1 Tímótì 6:15–16 àti gbólóhùn pé kò sí ènìyàn tí ó ti rí i tàbí tí ó lè rí i fi ara mọ́ Ọlọ́run jù lọ. Àkọsílẹ̀ ìsàlẹ̀ pa òye mìíràn mọ́, kí ìtumọ̀ má bàa fi agbára yanjú ohun tí a ti ń jíròrò.
- issue: Ìtumọ̀ ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: ẹ̀dá ènìyàn kankan
  rationale: Yorùbá kò nílò yíyan akọ sí “ọkùnrin” níbí; “àwọn ènìyàn” ṣe àfihàn agbára aṣojú gbogbo aráyé tí ọ̀rọ̀ Gíríìkì ní.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “kò ṣeé sún mọ́” dípò gbólóhùn àjèjì, àti “agbára ìjọba” láti sọ agbára alákòóso nínú κράτος ní kedere. Gbogbo àmì ohùn ni a fi síbi tí ó bá yẹ.
