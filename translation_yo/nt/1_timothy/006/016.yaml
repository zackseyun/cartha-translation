  source_fidelity: Ìtumọ̀ náà tọ́ka sí ìyasọ́tọ̀ ẹni náà, àìkú rẹ̀, ìmọ́lẹ̀ tí a kò lè sún mọ́, àti ìyìn ìkẹyìn ní ìbámu pẹ̀lú Gíríìkì. Ṣùgbọ́n “kò tíì rí” fi ìtumọ̀ “not yet” kún aorist εἶδεν, níbi tí ọ̀rọ̀ orísun ti sọ pé kò sí ènìyàn tí ó rí i rárá.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì ní àmì ohùn tó péye ní ọ̀pọ̀ ibi. Ṣíṣe ìpínrọ̀ apá ríran náà di “kò sí ẹnikẹ́ni ... tí ó rí i rí” dáa ju, nítorí ó yọ ìtumọ̀ “tíì/yet” kúrò, ó sì jẹ́ kí ohun tí a kò rí náà hàn gbangba. “Ìjọba ayérayé” jẹ́ ọ̀nà tó rọrùn àti tó ṣe kedere fún κράτος αἰώνιον nínú ìyìn yìí.
