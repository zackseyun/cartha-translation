id: 1TI.6.13
reference: 1 Timothy 6:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: yo
  text: Mo pàṣẹ fún ọ níwájú Ọlọ́run[a], ẹni tí ń fún ohun gbogbo ní ìyè, àti Mèsáyà Jésù[b], ẹni tí ó jẹ́rìí sí ìjẹ́wọ́ rere níwájú Pọ́ńtíù Pílátù[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ń pa ohun gbogbo mọ́ láàyè,” tàbí “ẹni tí ń sọ ohun gbogbo di alààyè.” Ọ̀rọ̀ Gíríìkì ζῳογονοῦντος lè tẹnumọ́ pípa ìyè mọ́ tàbí fífúnni ní ìyè.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kristi Jésù.” Χριστός jẹ́ oyè tí ó túmọ̀ sí Mèsáyà, ẹni tí a fòróró yàn.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ní àkókò Pọ́ńtíù Pílátù,” tàbí “lábẹ́ Pọ́ńtíù Pílátù.” Ọ̀rọ̀ Gíríìkì ἐπί pẹ̀lú ọ̀rọ̀-orúkọ ní ẹ̀yà genitive lè ní àwọn ìtumọ̀ wọ̀nyí; àyíká ìjẹ́rìí náà ṣe atilẹyin fún “níwájú.”
    reason: source_ambiguity
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Mo pàṣẹ fún ọ
  rationale: Ó fi àṣẹ pàtàkì àti ìkìlọ̀ ọlọ́wọ̀ hàn ní èdè Yorùbá adayébá; ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ẹyọ.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: Ó pa ìtumọ̀ wíwà ní ojú Ọlọ́run àti Mèsáyà mọ́, ó sì bá àyíká ọ̀rọ̀ àṣẹ ọlọ́wọ̀ mu.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìtumọ̀ Yorùbá tí ó ṣe déédé fún θεός ní àyíká yìí.
- source_word: τοῦ ζῳογονοῦντος τὰ πάντα
  choice: ẹni tí ń fún ohun gbogbo ní ìyè
  rationale: ζῳογονέω lè tọ́ka sí fífúnni ní ìyè tàbí pípa mọ́ láàyè. Àṣàyàn yìí jẹ́ adayébá, ó sì pa ìtumọ̀ gbígbòòrò rẹ̀ mọ́; àṣàyàn mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn, kì í ṣe orúkọ lásán; “Mèsáyà” mú agbára oyè náà hàn.
- source_word: τοῦ μαρτυρήσαντος
  choice: ẹni tí ó jẹ́rìí
  rationale: “Jẹ́rìí” jẹ́ ọ̀nà Yorùbá adayébá fún fífúnni ní ẹ̀rí tàbí jíjẹ́wọ́ ní gbangba, ó sì bá àyíká ìdájọ́ mu.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: níwájú Pọ́ńtíù Pílátù
  rationale: Ní ìbámu pẹ̀lú μαρτυρήσαντος, ó ṣeé lóye gẹ́gẹ́ bí jíjẹ́rìí ní iwájú Pílátù; Gíríìkì náà tún lè túmọ̀ sí “ní àkókò” tàbí “lábẹ́” Pílátù.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: sí ìjẹ́wọ́ rere
  rationale: “Ìjẹ́wọ́” pa ìtumọ̀ ὁμολογία àti ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ìjẹ́wọ́ Tímótì nínú àyíká ẹsẹ̀ náà; “rere” túmọ̀ καλὴν láìsọ ọ́ di àlàyé gígùn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Àyíká ìjẹ́wọ́ ọlọ́wọ̀ yìí jẹ́ kí agbára Χριστός gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn hàn kedere; àṣàyàn Yorùbá ìbílẹ̀ ṣọ́ọ̀ṣì wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ζῳογονοῦντος
  choice: ẹni tí ń fún ohun gbogbo ní ìyè
  alternative: ẹni tí ń pa ohun gbogbo mọ́ láàyè; ẹni tí ń sọ ohun gbogbo di alààyè
  rationale: Ọ̀rọ̀ náà lè tẹnumọ́ fífúnni ní ìyè tàbí pípa ìyè mọ́. A kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí; a tọ́ka sí àwọn ìtumọ̀ yòókù ní àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἐπὶ Ποντίου Πιλάτου
  choice: níwájú Pọ́ńtíù Pílátù
  alternative: ní àkókò Pọ́ńtíù Pílátù; lábẹ́ Pọ́ńtíù Pílátù
  rationale: Àyíká ẹ̀rí Jesu níbi ìdájọ́ ṣe atilẹyin fún “níwájú,” ṣùgbọ́n a pa àìdánilójú gírámà Gíríìkì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ohùn ẹsẹ̀ náà jẹ́ ọlọ́wọ̀, taara, ó sì yẹ fún àṣẹ pàtàkì. “Mo pàṣẹ fún ọ” túmọ̀ àṣẹ náà ní kedere fún òǹkàwé òde òní; “Mèsáyà” pa agbára oyè Χριστός mọ́. A fi kọ́mà sí òpin nítorí pé gbolohun Gíríìkì náà ń bá a lọ sí ẹsẹ̀ 14.
