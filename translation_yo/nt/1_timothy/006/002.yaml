id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: yo
  text: Àwọn tí wọ́n sì ní àwọn ọ̀gá tí wọ́n jẹ́ onígbàgbọ́ kò gbọdọ̀ ṣe àfojúdi sí wọn nítorí arákùnrin ni wọ́n[a]. Kàkà bẹ́ẹ̀, kí wọ́n túbọ̀ máa sìn wọ́n, nítorí onígbàgbọ́ àti olùfẹ́ ni àwọn tí wọ́n ń gba àǹfààní náà[b]. Máa kọ́ àwọn nǹkan wọ̀nyí, kí o sì máa gba àwọn ènìyàn níyànjú nípa wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “arákùnrin àti arábìnrin”; ọ̀rọ̀ Giriki náà ní “arákùnrin.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “àwọn tí wọ́n ń gba àǹfààní náà,” nira láti túmọ̀ dájú. Ó ṣeé ṣe jù pé ó ń tọ́ka sí àwọn ọ̀gá onígbàgbọ́ gẹ́gẹ́ bí àwọn tí wọ́n ń gba àǹfààní iṣẹ́ àwọn ẹrú.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: tí ó jẹ́ onígbàgbọ́
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí àwọn ọ̀gá tí wọ́n gba Kristi gbọ́, kì í ṣe pé wọ́n kàn ṣe olóòtítọ́.
- source_word: δεσπότας
  choice: àwọn ọ̀gá
  rationale: “Ọ̀gá” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tó ní àṣẹ lórí ẹlòmíràn nínú àjọṣe iṣẹ́ ẹrú yìí; àyíká ẹsẹ tó ṣáájú mú ipò náà hàn.
- source_word: καταφρονείτωσαν
  choice: kò gbọdọ̀ ṣe àfojúdi sí wọn
  rationale: “Ṣe àfojúdi sí” fi ẹ̀gàn àti àìka ẹni sí hàn, ó sì pa agbára ìfòfindè náà mọ́.
- source_word: ἀδελφοί
  choice: arákùnrin
  rationale: Ó pa ìrísí akọ púpọ̀ ti Giriki mọ́, nígbà tí ó tún fi ìbátan àwọn onígbàgbọ́ hàn.
- source_word: μᾶλλον δουλευέτωσαν
  choice: kí wọ́n túbọ̀ máa sìn wọ́n
  rationale: “Túbọ̀” dúró fún μᾶλλον, “máa sìn” sì sọ iṣẹ́ tí ẹni tó wà lábẹ́ ọ̀gá ń ṣe ní Yorùbá àdánidá.
- source_word: πιστοί
  choice: onígbàgbọ́
  rationale: Gẹ́gẹ́ bí ìlò àkọ́kọ́ nínú ẹsẹ náà, ó túmọ̀ sí àwọn tí wọ́n gba Kristi gbọ́.
- source_word: ἀγαπητοὶ
  choice: olùfẹ́
  rationale: “Olùfẹ́” jẹ́ ọ̀rọ̀ ṣókí, ọlọ́lá fún àwọn ẹni tí a nífẹ̀ẹ́, ó sì bá ìlò Kristẹni mu.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: àwọn tí ń jẹ àǹfààní iṣẹ́ rere náà
  rationale: Ó fi èrò gbígba àǹfààní εὐεργεσία hàn, ó sì yàgò fún ṣíṣe àlàyé ẹni tó ń gba àǹfààní náà ju ohun tí Giriki sọ lọ.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Máa kọ́ni, kí o sì máa gba ni níyànjú nípa àwọn nǹkan wọ̀nyí
  rationale: Ìlò “máa” fi ìṣe tí ó yẹ kí Timotiu máa bá a lọ hàn; “gba ni níyànjú” mú agbára παρακάλει jáde ní Yorùbá òde òní.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί nínú àwùjọ àwọn onígbàgbọ́
  choice: arákùnrin
  alternative: arákùnrin àti arábìnrin; ọmọ ìdílé kan
  rationale: A pa akọ girama ti ọ̀rọ̀ Giriki mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ náà lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀.
- issue: Àwọn ọ̀rọ̀ ipò àwùjọ nínú àyíká ẹrú
  choice: àwọn ọ̀gá ... máa sìn
  alternative: àwọn olúwa ... máa ṣe iṣẹ́ ẹrú fún
  rationale: “Àwọn ọ̀gá” àti “máa sìn” jẹ́ Yorùbá àdánidá, wọ́n sì pa àṣẹ àti iṣẹ́ inú àjọṣe náà mọ́ láìfi ọ̀rọ̀ tí kò sí nínú ẹsẹ náà kún un.
- issue: Ẹni tí οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι ń tọ́ka sí
  choice: A fi gbólóhùn náà sílẹ̀ ní ìwọ̀n àìdájú rẹ̀, pẹ̀lú àwọn ọ̀gá onígbàgbọ́ gẹ́gẹ́ bí ìtumọ̀ tó ṣeé ṣe jù
  alternative: Àwọn ẹrú onígbàgbọ́ ni àwọn tó fi ara wọn fún iṣẹ́ rere; tàbí ẹgbẹ́ méjèèjì ń pín àǹfààní náà
  rationale: Àkọsílẹ̀ Giriki náà ṣókí, ó sì nira. Àyíká fi àwọn ọ̀gá hàn gẹ́gẹ́ bí ẹni tó ṣeé ṣe jù láti gba àǹfààní iṣẹ́ náà, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́wọ́ àríyànjiyàn náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa àìdájú gbólóhùn Giriki tó nira mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
