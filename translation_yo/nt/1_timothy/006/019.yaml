id: 1TI.6.19
reference: 1 Timothy 6:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: yo
  text: nípa kíkó ìpìlẹ̀ rere jọ fún ara wọn fún ọjọ́ iwájú, kí wọ́n lè di ìyè tí í ṣe ìyè nítòótọ́ mú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: nípa kíkó ... jọ
  rationale: Ó ń fi iṣẹ́ tí ń tẹ̀ síwájú hàn, ó sì pa àwòrán kíkó ìṣúra jọ mọ́ láìlo èdè àtijọ́.
- source_word: ἑαυτοῖς
  choice: fún ara wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fi hàn pé àwọn fúnra wọn ni yóò jèrè nínú rẹ̀.
- source_word: θεμέλιον καλὸν
  choice: ìpìlẹ̀ rere
  rationale: Ó pa àwòrán ilé inú θεμέλιον mọ́, rere sì jẹ́ ọ̀nà àdánidá láti sọ καλόν ní àyíká yìí.
- source_word: εἰς τὸ μέλλον
  choice: de ọjọ́ iwájú
  rationale: Ó tọ́ka sí ohun tí ń bọ̀ láìfi ọ̀rọ̀ ‘ayé tí ń bọ̀’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a fẹ́ hàn.
- source_word: ἐπιλάβωνται
  choice: di ... mú
  rationale: Ó pa àwòrán líle-mú tàbí gbígbá ohun kan mú mọ́, dípò yíyí i sí ‘rí gbà’ lásán.
- source_word: τῆς ὄντως ζωῆς
  choice: ìyè tí í ṣe ìyè nítòótọ́
  rationale: Ó pa orúkọ ζωή àti ìtẹnumọ́ ὄντως mọ́, ó sì ṣàfihàn ìyàtọ̀ láàárín ìyè tí ó dà bí ìyè àti ìyè tòótọ́.
theological_decisions:
- issue: Bóyá εἰς τὸ μέλλον yẹ kí a túmọ̀ rẹ̀ ní pàtó sí ọjọ́ tàbí ayé ìkẹyìn
  choice: de ọjọ́ iwájú
  alternative: fún ayé tí ń bọ̀
  rationale: Àyíká náà ní ìtumọ̀ nípa ọjọ́ iwájú Ọlọ́run, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ‘ayé’ ní pàtó; ìtumọ̀ yìí pa ìṣípayá rẹ̀ mọ́.
- issue: Bí a ṣe yẹ kí a fi τῆς ὄντως ζωῆς hàn kedere
  choice: ìyè tí í ṣe ìyè nítòótọ́
  alternative: ohun tí í ṣe ìyè nítòótọ́
  rationale: Yíyan yìí pa orúkọ ‘ìyè’ mọ́ ní kedere, ó sì jẹ́ kí ìtẹnumọ́ àti ìforígbárí ẹ̀kọ́ inú gbólóhùn náà dúró.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. Gbólóhùn náà jẹ́ apá kan tí ó ń tẹ̀ síwájú láti ẹsẹ ṣáájú; ‘nípa’ ṣe àfihàn ìbáṣepọ̀ participle náà. A kò fi àlàyé ẹ̀sìn àfikún sínú ọ̀rọ̀ náà.
