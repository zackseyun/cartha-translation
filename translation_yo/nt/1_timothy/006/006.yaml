  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ìfọkànsìn sí Ọlọ́run pẹ̀lú ìtẹ́lọ́rùn jẹ́ èrè ńlá[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èrè púpọ̀” tàbí “ọ̀nà ńlá láti rí èrè.” Ọ̀rọ̀ Gíríìkì náà ní í ṣe pẹ̀lú èrè, ó sì ń tún ọ̀rọ̀ inú ẹsẹ tó ṣáájú gbé wá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìmúra ẹni ṣẹ́” tàbí “ohun tí ó tó.” Níhìn-ín, ìtumọ̀ rẹ̀ ṣeé ṣe kó jẹ́ ìtẹ́lọ́rùn tàbí níní ohun tí ó tó, kì í ṣe ìgbẹ́kẹ̀lé ara ẹni láìgbẹ́kẹ̀ lé Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn sí èrò inú ẹsẹ tó ṣáájú pé ìfọkànsìn Ọlọ́run jẹ́ ọ̀nà láti jèrè ohun ìní.
- source_word: πορισμὸς
  choice: èrè
  rationale: Ó túmọ̀ sí èrè tàbí ohun tí a fi ń rí èrè; yíyan ‘èrè’ mú ìbáramu ọ̀rọ̀ pẹ̀lú ẹsẹ tó ṣáájú dúró láì fi dandan sọ pé ọrọ̀ ajé nìkan ni.
- source_word: μέγας
  choice: ńlá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ bí èrè náà ti pọ̀ tó tàbí ti ṣe pàtàkì tó.
- source_word: εὐσέβεια
  choice: ìfọkànsìn Ọlọ́run
  rationale: Ó ń tọ́ka sí ìgbésí ayé ọ̀wọ̀ àti ìfọkànsìn tí ó dojú kọ Ọlọ́run, kì í ṣe àṣà ẹ̀sìn òde lásán.
- source_word: μετὰ
  choice: pẹ̀lú
  rationale: Ó fi ìbákẹ́gbẹ́ tàbí ìṣọ̀kan àwọn ohun méjèèjì hàn ní kedere.
- source_word: αὐταρκείας
  choice: ìtẹ́lọ́rùn
  rationale: Ní ìbámu pẹ̀lú àwọn ẹsẹ tó tẹ̀ lé e, ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ kí ohun tí ènìyàn ní tó o, kì í ṣe gbígbẹ́kẹ̀ lé ara ẹni láìní Ọlọ́run.
theological_decisions:
- issue: Ìtumọ̀ αὐτάρκεια nínú àyíká Kristẹni
  choice: ìtẹ́lọ́rùn
  alternative: ìtó-ẹni-lójú ara rẹ̀; ohun tí ó tó
  rationale: Àwọn ẹsẹ 7–8 ṣàlàyé rẹ̀ gẹ́gẹ́ bí jíjẹ́ kí oúnjẹ àti aṣọ tó ẹni, kì í ṣe ẹ̀kọ́ pé ènìyàn lè dá dúró láìgbẹ́kẹ̀ lé Ọlọ́run.
- issue: Ìbáṣepọ̀ ìfọkànsìn Ọlọ́run àti èrè
  choice: ìfọkànsìn Ọlọ́run pẹ̀lú ìtẹ́lọ́rùn fúnra rẹ̀ jẹ́ èrè ńlá
  alternative: ìfọkànsìn Ọlọ́run jẹ́ ọ̀nà láti rí èrè ńlá nígbà tí ìtẹ́lọ́rùn bá wà pẹ̀lú rẹ̀
  rationale: Ìkọ́lé Gíríìkì lè gba ìtumọ̀ méjèèjì, ṣùgbọ́n ọ̀rọ̀ ṣókí ‘jẹ́ èrè ńlá’ pa ìró ọ̀rọ̀ ẹsẹ tó ṣáájú mọ́, ó sì yẹra fún fífi hàn pé a ń sin Ọlọ́run nítorí èrè ohun ìní.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò. ‘Ìfọkànsìn Ọlọ́run’ ṣe kedere sí òǹkàwé gbogbogbò ju ọ̀rọ̀ ẹ̀sìn tí ó lè dà bí àṣà òde lásán lọ; a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
