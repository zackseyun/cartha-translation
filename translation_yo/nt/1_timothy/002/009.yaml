id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: yo
  text: Bákan náà, kí àwọn obìnrin máa ṣe ara wọn lọ́ṣọ̀ọ́ pẹ̀lú aṣọ tí ó bójú mu[a], pẹ̀lú ìtìjú àti ìkóra-ẹni-níjàánu, kì í ṣe pẹ̀lú irun títẹ̀ àti wúrà tàbí péálì tàbí aṣọ olówó iyebíye[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “ní ìmúra tí ó yẹ” tàbí “ní aṣọ tí ó yẹ.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “irun títẹ̀ àti wúrà tàbí péálì tàbí aṣọ olówó iyebíye” ń tọ́ka sí ìmúra àṣejù tí a fi ń ṣe àfihàn ọrọ̀, dípò kí ó jẹ́ ìfòfindè gbogbo lílo irun títẹ̀ tàbí ohun ọ̀ṣọ́ ní gbogbo ipò.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Bákan náà
  rationale: Ó so ìtọ́ni yìí mọ́ ìṣírí tí ó ṣáájú, ó sì sọ ìtumọ̀ àfikún Gíríìkì náà ní Yorùbá àdánidá láìṣe àtúnlò ọ̀rọ̀ tí kò pọn dandan.
- source_word: γυναῖκας
  choice: àwọn obìnrin
  rationale: Nínú àyíká ìtọ́ni gbogbogbò yìí, kò sí àmì pé àwọn aya nìkan ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: ní aṣọ tí ó bójú mu
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí aṣọ tàbí ìmúra tí ó yẹ, tí ó ní ìwà títọ́ àti ètò rere; gbolohun yìí ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: μετὰ αἰδοῦς
  choice: pẹ̀lú ìwọ̀ntúnwọ̀nsì
  rationale: αἰδώς ní ìtumọ̀ ìfarabalẹ̀ àti ìkóra-ẹni-kúrò nínú ohun tí kò bójú mu; ‘ìwọ̀ntúnwọ̀nsì’ mú èrò yìí jáde láìdín un kù sí ìrísí ara nìkan.
- source_word: σωφροσύνης
  choice: ìkóra-ẹni-níjàánu
  rationale: Ó fi ọgbọ́n inú, ìṣọ́ra, àti agbára láti ṣàkóso ìfẹ́ ara hàn ní ọ̀nà tí ó yé òǹkàwé lónìí.
- source_word: κοσμεῖν ἑαυτάς
  choice: kí ... máa ṣe ara wọn lọ́ṣọ̀ọ́
  rationale: Ó pa àwòrán ṣíṣe ara ẹni lọ́ṣọ̀ọ́ mọ́, ó sì mú agbára ìtọ́ni tí infinitive Gíríìkì jogún láti inú àyíká rẹ̀ hàn.
- source_word: μὴ ἐν πλέγμασιν
  choice: kì í ṣe pẹ̀lú irun dídì
  rationale: πλέγματα ń tọ́ka sí irun tí a dì tàbí tí a hun; ìtumọ̀ náà dúró sítòsí Gíríìkì láìfi ‘aláràbarà’ kún ọ̀rọ̀ pàtàkì.
- source_word: χρυσίῳ
  choice: wúrà
  rationale: Ó pa ìtumọ̀ gbooro Gíríìkì mọ́ láìfi irú ohun ọ̀ṣọ́ kan pàtó lé e lórí.
- source_word: μαργαρίταις
  choice: péálì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún òkúta iyebíye pearl.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: aṣọ olówó iyebíye
  rationale: Ó ṣàfihàn aṣọ tí iye rẹ̀ ga gidigidi, ó sì bá ìtakora sí ìṣehàn ọrọ̀ àṣejù mu.
theological_decisions:
- issue: Bóyá àwọn obìnrin lápapọ̀ ni ẹsẹ náà ń bá sọ̀rọ̀ tàbí àwọn aya nìkan
  choice: àwọn obìnrin lápapọ̀
  alternative: àwọn aya
  rationale: γυναῖκας lè túmọ̀ sí ‘àwọn obìnrin’ tàbí ‘àwọn aya,’ ṣùgbọ́n àyíká gbogbogbò àti àìsí àmì ìgbéyàwó ṣe àtìlẹ́yìn fún ‘àwọn obìnrin.’
- issue: Bóyá òfin náà ka gbogbo lílo irun dídì, wúrà, péálì, àti aṣọ olówó léèwọ̀ pátápátá
  choice: A pa àtòjọ náà mọ́ gẹ́gẹ́ bí ó ti rí, ṣùgbọ́n àyíká fi hàn pé ìmúra àṣejù àti ìṣehàn ọrọ̀ ni ìtakora náà dojú kọ.
  alternative: Ìfòfindè pátápátá lórí gbogbo irun dídì, wúrà, péálì, tàbí aṣọ olówó ní gbogbo ipò
  rationale: Ìṣètò gbolohun náà fi ìmúra tí ó bójú mu, ìwọ̀ntúnwọ̀nsì, àti ìkóra-ẹni-níjàánu wé ìṣehàn ohun ọ̀ṣọ́ olówó; a kò fi ìtumọ̀ àlàyé yìí sínú ọ̀rọ̀ pàtàkì, kí a má bàa yanjú ẹdọfu náà ju ohun tí Gíríìkì sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Bákan náà’ fún ìsopọ̀ àdánidá, ‘aṣọ tí ó bójú mu’ fún ìmúra yíyẹ, àti ‘ìkóra-ẹni-níjàánu’ fún ìtumọ̀ ìṣàkóso ara. Àmì ohùn ni a fi sí gbogbo ibi tí ó yẹ.
