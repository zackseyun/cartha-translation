id: 1TI.2.5
reference: 1 Timothy 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: yo
  text: Nítorí Ọlọ́run kan ni ó wà, alárinà kan sì ni ó wà láàárín Ọlọ́run àti àwọn ènìyàn; ènìyàn náà ni Mèsáyà Jésù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς
  choice: kan
  rationale: 'A lo “kan” ní ìṣẹ̀lẹ̀ méjèèjì láti pa ìbáramu ìtẹnumọ́ náà mọ́: Ọlọ́run kan, alárinà kan.'
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí ó ṣáájú rẹ̀.
- source_word: θεός
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún θεός níbí.
- source_word: μεσίτης
  choice: alárinà
  rationale: “Alárinà” túmọ̀ sí ẹni tí ó dúró láàárín ẹgbẹ́ méjì, ó sì jẹ́ ọ̀rọ̀ àdánidá tí ó ṣe kedere ní Yorùbá.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: láàárín Ọlọ́run àti àwọn ènìyàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní genitive, “láàárín … àti …” ni ìṣọ̀kan Yorùbá tí ó bá “alárinà” mu.
- source_word: ἄνθρωπος
  choice: ẹni tí ó jẹ́ ènìyàn
  rationale: Ó jẹ́ kí ìtẹnumọ́ lórí jíjẹ́ ènìyàn ti alárinà náà ṣe kedere, láìfi akọ tàbí abo tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” túmọ̀ oyè náà dípò lílo “Kristi” bí ẹni pé ó jẹ́ orúkọ ìdílé.
- source_word: Ἰησοῦς
  choice: Jésù
  rationale: Àkọsílẹ̀ orúkọ náà ní Yorùbá tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ἀνθρώπων àti ἄνθρωπος
  choice: “àwọn ènìyàn … ẹni tí ó jẹ́ ènìyàn”
  alternative: “àwọn ọmọ ènìyàn … ọkùnrin náà”
  rationale: Ìtumọ̀ tí a yàn pa ìsopọ̀ ọ̀rọ̀ tó túmọ̀ sí ìran ènìyàn àti jíjẹ́ ènìyàn Jésù mọ́, ṣùgbọ́n kò fi akọ tí Gíríìkì ἄνθρωπος kò béèrè kún un.
- issue: Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: A túmọ̀ Χριστός gẹ́gẹ́ bí oyè, a sì pa ètò ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ìtumọ̀ ẹ̀kọ́ nípa ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: A sọ jíjẹ́ ènìyàn Jésù ní tààrà, láìṣe àfikún nípa ìwà Ọlọ́run rẹ̀.
  alternative: Ṣàlàyé nínú ọ̀rọ̀ pé ó jẹ́ Ọlọ́run pẹ̀lú.
  rationale: Ẹsẹ náà tẹnumọ́ jíjẹ́ ènìyàn alárinà; ìtumọ̀ kò gbọ́dọ̀ dín ìtẹnumọ́ yìí kù tàbí fi ohun tí ẹsẹ náà kò sọ kún un.
translation_notes:
  register: Yorùbá àjùmọ̀lò tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe “ni ó wà” mú ìtẹnumọ́ εἷς … εἷς hàn lọ́nà àdánidá, “alárinà” sì jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé òde òní.
