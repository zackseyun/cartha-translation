  verdict: revise
  source_fidelity: Àtúnyẹ̀wò náà ń yí ìbẹ̀rẹ̀ padà sí “Fún èyí,” nítorí εἰς ὃ níhìn-ín ní agbára ìtọ́kasí/ìdí-iṣẹ́ (‘for this/for which’), kì í ṣe ìdí gbígbòòrò ‘because of this’ tí “Nítorí èyí” lè fi hàn. Ó tún jẹ́ kí ‘olùkọ́’ hàn kedere gẹ́gẹ́ bí ipò tí a yàn Paulu sí, gẹ́gẹ́ bí κῆρυξ àti ἀπόστολος.
  naturalness: “A yàn mí gẹ́gẹ́ bí ...” jẹ́ Yorùbá ìgbàlódé, tó mọ́, tó sì pa ìṣe aláìṣiṣẹ́ (passive) ti ἐτέθην mọ́. “Àwọn ènìyàn tí kì í ṣe Júù” yàgò fún ìró ẹ̀gàn tàbí ìdínkù tí ‘Kèfèrí’ lè ní ní lílo Yorùbá òde òní, nígbà tí ó ṣì sọ ìtọ́kasí Pauline ti ἐθνῶν di kedere.
  terminology: “Akéde,” “aposteli,” “ìgbàgbọ́,” àti “òtítọ́” bá ọ̀rọ̀ Gíríìkì mu. A fi “àwọn orílẹ̀-èdè” sí àlàyé gẹ́gẹ́ bí àṣàyàn gbooro fún ἐθνῶν; a sì pa “ìṣòtítọ́” mọ́ nínú àlàyé fún ìṣeéṣe ‘faithfulness’ ti πίστις.
