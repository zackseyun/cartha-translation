id: 1TI.2.7
reference: 1 Timothy 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: yo
  text: Fún èyí[a] ni a yàn mí gẹ́gẹ́ bí akéde àti aposteli—òtítọ́ ni mo ń sọ, èmi kò purọ́—gẹ́gẹ́ bí olùkọ́ àwọn ènìyàn tí kì í ṣe Júù[b], nínú ìgbàgbọ́ àti òtítọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Fún ohun tí a yàn mí sípò náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “olùkọ́ àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nínú ìṣòtítọ́ àti òtítọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Nítorí èyí
  rationale: Ó tọ́ka padà sí iṣẹ́ ìgbàlà àti ẹ̀rí tí a mẹ́nu kàn ṣáájú; ó sì lè túmọ̀ sí ‘nítorí èyí’ tàbí ‘fún èyí.’
- source_word: ἐτέθην
  choice: a ṣe yàn mí sípò
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń sọ nípa yíyan ẹni sí iṣẹ́ kan, kì í ṣe fífi ẹni sí ibìkan lásán.
- source_word: κῆρυξ
  choice: akéde
  rationale: ‘Akéde’ fi ìtumọ̀ ẹni tí ń kéde ọ̀rọ̀ ní gbangba ní orúkọ ẹni mìíràn hàn, láìfi ìtumọ̀ ẹ̀sìn àkànṣe kún un.
- source_word: ἀπόστολος
  choice: aposteli
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún oyè iṣẹ́ Paulu yìí, ó sì dá ìtumọ̀ aṣojú tí a rán síṣẹ́ mọ́.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: òtítọ́ ni mo ń sọ, èmi kò purọ́
  rationale: Ó pa ìtẹnumọ́ méjèèjì mọ́ ní èdè Yorùbá àdánidá.
- source_word: διδάσκαλος ἐθνῶν
  choice: olùkọ́ àwọn Kèfèrí
  rationale: Nínú lílo Paulu, ἔθνη sábà ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù; ‘àwọn Kèfèrí’ mú ìtọ́kasí yẹn hàn kedere.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: nínú ìgbàgbọ́ àti òtítọ́
  rationale: Ìtumọ̀ yìí pa àìdánilójú mọ́ nípa bóyá gbólóhùn náà ń ṣàpèjúwe àgbègbè, ọ̀nà, tàbí ànímọ́ iṣẹ́ ìkọ́ni Paulu.
theological_decisions:
- issue: Ìtumọ̀ ἐθνῶν nínú iṣẹ́ tí a rán Paulu sí
  choice: àwọn Kèfèrí
  alternative: àwọn orílẹ̀-èdè
  rationale: Àyíká àti lílo Paulu sábà ń tọ́ka sí àwọn tí kì í ṣe Júù, ṣùgbọ́n ìtumọ̀ gbooro ‘àwọn orílẹ̀-èdè’ ṣì ṣeé ṣe.
- issue: Ìtumọ̀ πίστις nínú ἐν πίστει καὶ ἀληθείᾳ
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ tí ó bá àyíká mu jù, ṣùgbọ́n πίστις tún lè ní ìtumọ̀ ìṣòtítọ́ tàbí jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé.
translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye ni a lò. A lo ‘akéde’ fún κῆρυξ láti pa ìtumọ̀ aṣojú tí ń kéde ọ̀rọ̀ mọ́; a sì lo ‘aposteli’ gẹ́gẹ́ bí oyè tí àwọn òǹkàwé Yorùbá mọ̀. Àwọn àmì àlàyé ni a tò lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
