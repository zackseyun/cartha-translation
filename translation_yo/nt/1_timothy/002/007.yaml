revisions:
- from: Nítorí èyí ni a ṣe yàn mí sípò láti jẹ́ akéde àti aposteli—òtítọ́ ni mo ń sọ, èmi kò purọ́—olùkọ́ àwọn Kèfèrí, nínú ìgbàgbọ́ àti òtítọ́.[a][b][c]
  to: Fún èyí[a] ni a yàn mí gẹ́gẹ́ bí akéde àti aposteli—òtítọ́ ni mo ń sọ, èmi kò purọ́—gẹ́gẹ́ bí olùkọ́ àwọn ènìyàn tí kì í ṣe Júù[b], nínú ìgbàgbọ́ àti òtítọ́.[c]
  rationale: Àtúnṣe náà ṣàtúnṣe agbára εἰς ὃ sí “Fún èyí,” ó sì tún ìṣètò gbolóhùn ṣe kí akéde, aposteli, àti olùkọ́ jẹ́ àwọn ipò mẹ́ta tí a yàn Paulu sí. A rọ́pò “Kèfèrí” pẹ̀lú ọ̀rọ̀ tó ṣe kedere, tó sì jẹ́ aláìdájọ́, fún àwọn tí kì í ṣe Júù. Àwọn àmì àlàyé ni a so mọ́ ọ̀rọ̀ tí ọ̀kọ̀ọ̀kan ń ṣàlàyé.
