  - severity: low
    issue: “Olùkọ́ àwọn Kèfèrí” lè ní ìró tí kò bójú mu sí àwọn olùkà òde òní.
    rationale: Bí ó tilẹ̀ jẹ́ pé ó jẹ́ ọ̀rọ̀ ìtumọ̀ Bíbélì àtijọ́ tó wọ́pọ̀, “àwọn ènìyàn tí kì í ṣe Júù” sọ ἐθνῶν ní pàtó, ní ìbámu pẹ̀lú lílo Paulu, láìfi ìdájọ́ ẹ̀sìn kún un.
