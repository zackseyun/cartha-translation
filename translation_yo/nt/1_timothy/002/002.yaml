id: 1TI.2.2
reference: 1 Timothy 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: yo
  text: fún àwọn ọba àti gbogbo àwọn tí ó wà ní ipò gíga[a], kí a lè máa gbé ìgbésí ayé tí kò ní ìdàrúdàpọ̀, tí ó sì dákẹ́jẹ́, ní gbogbo ìfọkànsìn sí Ọlọ́run àti ìwà tí ó yẹ fún ọ̀wọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn tí ó wà ní ipò àṣẹ.” Ní tààràtà, gbólóhùn Gíríìkì náà ni “gbogbo àwọn tí ó wà ní ipò ọlá/gíga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: fún
  rationale: Nínú àyíká ọ̀rọ̀ àdúrà àti ẹ̀bẹ̀ ẹsẹ tó ṣáájú, ó túmọ̀ sí gbígbàdúrà fún àwọn ènìyàn kan; “fún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: βασιλέων
  choice: àwọn ọba
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka pàtó sí àwọn ọba tàbí olórí aláṣẹ gíga; yíyan “àwọn ọba” pa ìtumọ̀ ọ̀rọ̀ náà mọ́.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: gbogbo àwọn tí ó wà ní ipò gíga
  rationale: Gbólóhùn náà gbòòrò ju àwọn tí wọ́n di ipò ìjọba mú lọ, ó sì lè kan gbogbo ẹni tó wà ní ipò ọlá tàbí ipò tó ga.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète tàbí àbájáde tí a ń fẹ́ hàn ní Yorùbá àdánidá.
- source_word: ἤρεμον
  choice: tí kò ní ìdàrúdàpọ̀
  rationale: Ọ̀rọ̀ náà ń sọ nípa ìgbésí ayé tó balẹ̀, tí ìdàrúdàpọ̀ kò sì bá; gbolóhùn yìí yà á sọ́tọ̀ kúrò lọ́dọ̀ ἡσύχιον.
- source_word: ἡσύχιον
  choice: tí ó sì dákẹ́jẹ́
  rationale: Ó tẹnu mọ́ ìdákẹ́jẹ́ àti ìgbé-ayé tí kò kún fún ariwo tàbí rúkèrúdò.
- source_word: βίον διάγωμεν
  choice: kí a lè máa gbé ìgbésí ayé
  rationale: Àpapọ̀ ọ̀rọ̀ náà túmọ̀ sí bí ènìyàn ṣe ń lo tàbí darí ìgbésí ayé rẹ̀; èyí ni ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: pẹ̀lú gbogbo ìfọkànsìn Ọlọ́run
  rationale: εὐσέβεια ń tọ́ka sí ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run tí ó hàn nínú ìwà; fífi “Ọlọ́run” kún un mú ìtumọ̀ yẹn ṣe kedere fún òǹkàwé Yorùbá.
- source_word: σεμνότητι
  choice: ìwà tí ó yẹ fún ọ̀wọ̀
  rationale: Ó ń tọ́ka sí ìwà ọlọ́wọ̀, ìwà tó bójú mu, tí àwọn ẹlòmíràn sì lè bọ̀wọ̀ fún; gbolóhùn yìí ṣe kedere ju lílo ọ̀rọ̀ àjèjì tàbí ti àtijọ́ lọ.
theological_decisions:
- issue: Ìwọ̀n àti ète àdúrà fún àwọn olórí ìjọba
  choice: Ẹsẹ náà ń pe fún àdúrà fún àwọn ọba àti gbogbo ẹni tó wà ní ipò gíga, kí ìgbésí ayé tó balẹ̀, tó sì kún fún ìfọkànsìn Ọlọ́run lè ṣeé ṣe.
  alternative: Kí a túmọ̀ rẹ̀ bí àṣẹ ìtẹríba láìní ààlà fún gbogbo aláṣẹ, tàbí kí a fi mọ́ àwọn tó di ipò ìjọba òfin mú nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ẹni tí a ó gbàdúrà fún àti ète àdúrà náà, ṣùgbọ́n kò sọ pé gbogbo ìṣe olórí ni a ń fọwọ́ sí. Ìtumọ̀ yìí kò fi èrò ìṣèlú tàbí ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá àṣà ìkọ̀wé mu. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo àlàyé kékeré fún àwọn ajẹtífù méjèèjì láti pa ìyàtọ̀ ἤρεμον àti ἡσύχιον mọ́.
