  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: yo
  text: ṣùgbọ́n kí wọ́n fi iṣẹ́ rere ṣe ara wọn lọ́ṣọ̀ọ́, gẹ́gẹ́ bí ó ti yẹ fún àwọn obìnrin tí wọ́n ń jẹ́wọ́ pé àwọn ń bẹ̀rù Ọlọ́run.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gẹ́gẹ́ bí ó bá wọn mu” tàbí “gẹ́gẹ́ bí ó ti tọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tí wọ́n ń fi tọkàntọkàn sin Ọlọ́run” tàbí “tí wọ́n ní ọ̀wọ̀ fún Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “nípasẹ̀ iṣẹ́ rere”; níbí, iṣẹ́ rere ni ọ̀nà tí wọ́n fi ń ṣe ara wọn lọ́ṣọ̀ọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí ọ̀nà ìṣaralóge ti òde tí ẹsẹ̀ 9 mẹ́nu kàn.
- source_word: ὃ πρέπει
  choice: ohun tí ó yẹ
  rationale: Ó túmọ̀ sí ohun tí ó bá a mu tàbí tí ó tọ́; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìbójúmu mọ́.
- source_word: γυναιξὶν
  choice: fún àwọn obìnrin
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí àwọn obìnrin lápapọ̀, kì í ṣe àwọn aya nìkan.
- source_word: ἐπαγγελλομέναις
  choice: tí wọ́n ń jẹ́wọ́ pé
  rationale: Ó sọ nípa fífi ohun tí ènìyàn gbà tàbí ìdúró rẹ̀ hàn gbangba, láìsọ ọ́ di ẹ̀jẹ́ tàbí ìlérí.
- source_word: θεοσέβειαν
  choice: àwọn ń bẹ̀rù Ọlọ́run
  rationale: ‘Ìbẹ̀rù Ọlọ́run’ níbí jẹ́ ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run, kì í ṣe ìpayà; ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún θεοσέβεια.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: nípasẹ̀ iṣẹ́ rere
  rationale: Ó pa ipa διά pẹ̀lú genitive mọ́ gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò, ó sì jẹ́ kí iṣẹ́ rere hàn gẹ́gẹ́ bí ọ̀ṣọ́ tí ó yẹ nínú ìyàtọ̀ ẹsẹ̀ náà.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘iṣẹ́ rere’ pẹ̀lú jíjẹ́wọ́ ìbẹ̀rù Ọlọ́run
  choice: Iṣẹ́ rere ni ìwà tí ó yẹ kí ó fi ìjẹ́wọ́ ìfọkànsìn sí Ọlọ́run hàn níta.
  alternative: Kí a ka iṣẹ́ rere sí ìpìlẹ̀ tí ènìyàn fi ń rí ìtẹ́wọ́gbà tàbí ìgbàlà lọ́dọ̀ Ọlọ́run.
  rationale: Ìṣètò ọ̀rọ̀ náà ń fi ọ̀ṣọ́ òde wé ìwà rere; kò sọ ní pàtó pé iṣẹ́ ń mú ìgbàlà wá, nítorí náà a kò fi ẹ̀kọ́ bẹ́ẹ̀ kún un.
translation_notes:
  register: Yorùbá àgbàṣe tí ó bójú mu, pẹ̀lú àmì ohùn ní kíkún. A mú ọ̀rọ̀ ‘ṣe ara wọn lọ́ṣọ̀ọ́’ wá láti ìṣe tí ẹsẹ̀ 9 ń darí, nítorí ἀλλ’ àti gbolohun aláìpé ẹsẹ̀ 10 ń bá ìlànà yẹn lọ; a tún lo ‘èyíinì ni’ láti ṣàlàyé ìbáṣepọ̀ iṣẹ́ rere pẹ̀lú ohun tí ó yẹ láìpa ‘nípasẹ̀’ rẹ́.
