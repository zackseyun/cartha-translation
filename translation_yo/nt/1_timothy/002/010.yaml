- from: ṣùgbọ́n kí wọ́n fi ohun tí ó yẹ fún àwọn obìnrin tí wọ́n ń jẹ́wọ́ pé àwọn ń bẹ̀rù Ọlọ́run ṣe ara wọn lọ́ṣọ̀ọ́, èyíinì ni, nípasẹ̀ iṣẹ́ rere.[a][b][c]
