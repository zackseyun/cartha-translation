id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: yo
  text: Ṣùgbọ́n èmi kò gba obìnrin láyè láti kọ́ni tàbí láti lo àṣẹ lórí ọkùnrin kan[a][b]; dípò bẹ́ẹ̀, kí ó wà ní ìdákẹ́jẹ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aya ... ọkọ.” Àwọn ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ gbogbogbò (“obìnrin/ọkùnrin”) tàbí ìtumọ̀ ti ìgbéyàwó (“aya/ọkọ”).
    reason: alternative_reading
  - marker: b
    text: Tàbí, “láti ní àṣẹ lórí”; ó sì ṣeé ṣe kí ó túmọ̀ sí “láti fi agbára ṣàkóso lórí.” Ọ̀rọ̀ ìṣe Gíríìkì náà ṣọ̀wọ́n, a sì ń jiyàn lórí ẹ̀kúnrẹ́rẹ́ ìtumọ̀ rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní ìdákẹ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìdákẹ́jẹ́, ìfarabalẹ̀, tàbí àìsọ̀rọ̀, gẹ́gẹ́ bí àyíká ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: láti kọ́ni
  rationale: Ó túmọ̀ sí ‘láti kọ́’ tàbí ‘láti ṣe olùkọ́’; ‘kọ́ni’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ẹ̀kọ́ kọ ẹlòmíràn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín gbólóhùn yìí àti ìtọ́ni tó ṣáájú.
- source_word: γυναικί
  choice: obìnrin
  rationale: γυνή lè túmọ̀ sí obìnrin tàbí aya. Àyíká ọ̀rọ̀ náà ṣe àtìlẹ́yìn fún ìtumọ̀ gbogbogbò ‘obìnrin,’ ṣùgbọ́n a pa ìtumọ̀ ti ìgbéyàwó mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: οὐκ ἐπιτρέπω
  choice: èmi kò gba ... láyè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì ní iyì fún ‘Èmi kò fàyè gba.’ Fífìdí ‘èmi’ múlẹ̀ pa ẹni àkọ́kọ́ nínú ἐπιτρέπω mọ́.
- source_word: οὐδὲ
  choice: tàbí
  rationale: Lẹ́yìn gbólóhùn odi ‘kò gba ... láyè,’ ‘tàbí’ so ohun kejì tí a kò gbà láyè mọ́ èkíní ní Yorùbá àdánidá.
- source_word: αὐθεντεῖν
  choice: láti lo àṣẹ lórí
  rationale: Ọ̀rọ̀ Gíríìkì yìí ṣọ̀wọ́n, ìtumọ̀ pàtó rẹ̀ sì jẹ́ ohun tí a ń jiyàn lé lórí. ‘Lo àṣẹ lórí’ pa ìtumọ̀ àṣẹ tí kò dá sí rere tàbí búburú mọ́ láìfi ìtumọ̀ ìṣàkóso oníwà ipá kún un.
- source_word: ἀνδρός
  choice: ọkùnrin kan
  rationale: ἀνήρ lè túmọ̀ sí ọkùnrin tàbí ọkọ. ‘Ọkùnrin’ ni ìtumọ̀ àkọ́kọ́ nínú àyíká yìí, ṣùgbọ́n a tọ́ka sí ‘ọkọ’ nínú àlàyé ìsàlẹ̀.
- source_word: ἀλλ’
  choice: dípò bẹ́ẹ̀
  rationale: Ó fi ohun rere tí a retí hàn gẹ́gẹ́ bí ìyàtọ̀ sí àwọn ohun tí a ṣẹ̀ṣẹ̀ sọ pé a kò gbà láyè.
- source_word: εἶναι
  choice: kí ó wà
  rationale: Èyí mú gbólóhùn aláìlẹ́ni Gíríìkì yọrí sí ọ̀nà Yorùbá àdánidá, ó sì sọ ìtọ́ni náà di mímọ́.
- source_word: ἐν ἡσυχίᾳ
  choice: ní ìdákẹ́jẹ́
  rationale: ἡσυχία lè tọ́ka sí ìdákẹ́jẹ́, ìfarabalẹ̀, tàbí àìsọ̀rọ̀. ‘Ìdákẹ́jẹ́’ pa ìtumọ̀ tó gbòòrò mọ́ láìjẹ́ kó dà bí ìdènà gbogbo ọ̀rọ̀ sísọ.
theological_decisions:
- issue: Ìtumọ̀ αὐθεντεῖν nínú ẹsẹ tí a ti ń jiyàn lé lórí nípa ìgbésí ayé ìjọ
  choice: láti lo àṣẹ lórí
  alternative: láti ní àṣẹ lórí; láti fi agbára ṣàkóso lórí
  rationale: Nítorí pé ọ̀rọ̀ ìṣe náà ṣọ̀wọ́n, a kò fi ìtumọ̀ pé àṣẹ náà jẹ́ ìlòkulò sí i láìsí ẹ̀rí tó tó. Àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ pàtàkì mìíràn mọ́.
- issue: Bóyá γυνή àti ἀνήρ túmọ̀ sí obìnrin/ọkùnrin tàbí aya/ọkọ
  choice: obìnrin ... ọkùnrin
  alternative: aya ... ọkọ
  rationale: Àwọn ọ̀rọ̀ méjèèjì lè ní ìtumọ̀ gbogbogbò tàbí ti ìgbéyàwó. Àyíká tó gbooro àti àríyànjiyàn ẹ̀dá nínú àwọn ẹsẹ tó tẹ̀ lé mú kí ìtumọ̀ gbogbogbò yẹ fún ọ̀rọ̀ inú ẹsẹ, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- issue: Ìwọ̀n ìdákẹ́jẹ́ tí ἡσυχία ń béèrè
  choice: ní ìdákẹ́jẹ́
  alternative: ní ìdákẹ́rọ̀; láìsọ̀rọ̀
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìfarabalẹ̀ tàbí ìdákẹ́jẹ́, kò sì pọn dandan pé ó túmọ̀ sí àìsọ gbogbo ọ̀rọ̀. A kò yanjú àìdánilójú náà ju bí Gíríìkì ṣe ṣe lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘kọ́ni’ àti ‘gba ... láyè’ gẹ́gẹ́ bí àṣà Yorùbá àdánidá, a sì pa àwọn àìdánilójú nípa àṣẹ, ìgbéyàwó, àti ìdákẹ́jẹ́ mọ́ nínú àwọn àlàyé ìsàlẹ̀.
