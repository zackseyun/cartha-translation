language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: yo
  text: ẹni tí ó fi ara rẹ̀ fúnni gẹ́gẹ́ bí owó ìràpadà fún gbogbo ènìyàn[a]—ẹ̀rí náà ní àwọn àkókò tí ó yẹ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí gbogbo ènìyàn.” Ọ̀rọ̀ Gíríìkì náà pa ìwọ̀n “gbogbo” mọ́, láìsọ pàtó bóyá ó ń tọ́ka sí olúkúlùkù ènìyàn tàbí sí gbogbo onírúurú ènìyàn.
    reason: alternative_reading
  - marker: b
    text: Gbólóhùn Gíríìkì náà kúkúrú, ó sì tún lè túmọ̀ sí “ẹ̀rí tí a fi hàn ní àwọn àkókò tí ó yẹ.” Ó ṣeé ṣe kí fífi Kristi fi ara rẹ̀ fúnni jẹ́ ẹ̀rí tí a fi hàn ní àwọn àkókò tí Ọlọ́run yàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ἑαυτὸν
  choice: tí ó fi ara rẹ̀ ṣe
  rationale: Ọ̀rọ̀ yìí sọ ìṣe fífi ara ẹni fúnni tinútinú. Fífi participle náà ṣe gbólóhùn aláṣepọ̀ jẹ́ èdè Yorùbá àdánidá, ó sì so ó mọ́ ẹni tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
- source_word: ἀντίλυτρον
  choice: owó ìràpadà
  rationale: “Owó ìràpadà” túmọ̀ sí iye tí a san láti dá ẹnìkan sílẹ̀, ó sì mú kókó ìtumọ̀ ransom jáde láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ó ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ kún un.
- source_word: ὑπὲρ πάντων
  choice: fún gbogbo ènìyàn
  rationale: “Fún” lè gbé ìtumọ̀ “nítorí” tàbí “ní ipò” kalẹ̀, “gbogbo ènìyàn” sì pa fífẹ̀ πάντων mọ́ láìdá àríyànjiyàn nípa bí a ṣe gbọdọ̀ lóye “gbogbo” yanjú.
- source_word: τὸ μαρτύριον
  choice: ẹ̀rí náà
  rationale: Àpilẹ̀kọ pàtó náà ni a fi “náà” hàn. Gbólóhùn Gíríìkì náà kúkúrú, ó sì ṣeé kà gẹ́gẹ́ bí àfikún tí ń pe fífi Kristi fi ara rẹ̀ fúnni ní ẹ̀rí.
- source_word: καιροῖς ἰδίοις
  choice: ní àwọn àkókò tí ó yẹ
  rationale: Èyí jẹ́ Yorùbá àdánidá fún àwọn àkókò pàtó tàbí àkókò tí a yàn; lílo ọ̀pọ̀ “àwọn àkókò” tún pa plural Gíríìkì mọ́.
theological_decisions:
- issue: Ìwọ̀n πάντων nínú ọ̀rọ̀ nípa owó ìràpadà Kristi
  choice: fún gbogbo ènìyàn
  alternative: fún onírúurú ènìyàn gbogbo; ní ipò gbogbo ènìyàn
  rationale: Àyíká ọ̀rọ̀ fi ìfẹ́ Ọlọ́run sí ìgbàlà ènìyàn hàn ní gbangba, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò yanju bóyá “gbogbo” túmọ̀ sí olúkúlùkù ènìyàn láìsí àyọkúrò tàbí gbogbo ẹ̀ka ènìyàn. Ìtumọ̀ náà pa ọ̀rọ̀ gbígbòòrò àti ẹdọfu ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Agbára ìrọ́pò inú ἀντίλυτρον
  choice: owó ìràpadà
  alternative: owó ìràpadà ní pàṣípààrọ̀ fún wọn
  rationale: Ọ̀rọ̀ náà ní èrò ìdásílẹ̀ nípa iye tí a san, ó sì lè ní agbára ìrọ́pò; ṣùgbọ́n fífi “ní pàṣípààrọ̀” sínú àkọ́kọ́ yóò túmọ̀ ju bí ọ̀rọ̀ orísun ṣe ṣe kedere lọ.
- issue: Ìbáṣepọ̀ τὸ μαρτύριον pẹ̀lú gbólóhùn tó ṣáájú
  choice: ẹ̀rí náà ní àwọn àkókò tí ó yẹ
  alternative: ẹ̀rí tí a jẹ́ ní àwọn àkókò tí ó yẹ
  rationale: A pa ìrísí àfikún kúkúrú ti Gíríìkì mọ́, láìfi ọ̀rọ̀-ìṣe “jẹ́” tàbí “kéde” tí kò sí nínú orísun kún un. Àkọsílẹ̀ ìsàlẹ̀ jẹ́wọ́ àwọn ọ̀nà mìíràn tí a lè gbà lóye ìbáṣepọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Owó ìràpadà” jẹ́ ọ̀rọ̀ àdánidá ju “ìràpadà” nìkan lọ fún iye tí a fi ń dá ẹni sílẹ̀. A mọ̀ọ́mọ̀ pa apá ìkẹyìn mọ́ ní ṣókí bí Gíríìkì, a sì fi àlàyé sí àkọsílẹ̀ ìsàlẹ̀ dípò fífi ọ̀rọ̀-ìṣe tí kò sí nínú orísun kún àkọ́kọ́.
