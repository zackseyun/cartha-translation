  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: yo
  text: Kí obìnrin[a] máa kọ́ ẹ̀kọ́ ní ìdákẹ́jẹ́[b], pẹ̀lú ìtẹríba pátápátá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aya”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “obìnrin” tàbí “aya,” ó sinmi lórí àyíká ọ̀rọ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ní ìdákẹ́jẹ́ pátápátá”; ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ìdákẹ́jẹ́ tàbí ìfarabalẹ̀, kì í ṣe àìsọ̀rọ̀ rárá ní gbogbo ìgbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: obìnrin
  rationale: Ọ̀rọ̀ Gíríìkì γυνή lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya’ gẹ́gẹ́ bí àyíká ọ̀rọ̀. Níhìn-ín, ‘obìnrin’ kò fi ipò ìgbéyàwó kún ohun tí ẹsẹ náà sọ, ó sì bá lílo ọ̀rọ̀ náà ní ọ̀nà àpapọ̀ mu.
- source_word: ἐν ἡσυχίᾳ
  choice: ní ìdákẹ́jẹ́
  rationale: ἡσυχία lè tọ́ka sí ìdákẹ́jẹ́, ìfarabalẹ̀, tàbí àìdàrúdàpọ̀; kò pọndandan kí ó túmọ̀ sí àìsọ̀rọ̀ rárá. ‘Ní ìdákẹ́jẹ́’ pa ìtumọ̀ yìí mọ́ láì sọ àṣẹ náà di èyí tí ó le ju Gíríìkì lọ.
- source_word: μανθανέτω
  choice: Kí ... máa kọ́ ẹ̀kọ́
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ ní ẹni kẹta, ó sì ní ìrísí ìṣe tí ń tẹ̀ síwájú. ‘Kí ... máa kọ́ ẹ̀kọ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára àṣẹ náà àti ìtẹ̀síwájú ìkẹ́kọ̀ọ́ hàn.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: pẹ̀lú ìtẹríba pátápátá
  rationale: ὑποταγή túmọ̀ sí ìtẹríba tàbí fífi ara sí abẹ́. ‘Pẹ̀lú ìtẹríba pátápátá’ fi ìwọ̀n πάσῃ hàn, láì sọ ẹni tí a ń tẹrí ba ní pàtó nígbà tí Gíríìkì kò sọ ọ́.
theological_decisions:
- issue: Bóyá ἡσυχία túmọ̀ sí àìsọ̀rọ̀ rárá tàbí ìwà ìdákẹ́jẹ́
  choice: ìdákẹ́jẹ́
  alternative: ìdákẹ́rọ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà lè ní ìtumọ̀ ìdákẹ́rọ̀, ṣùgbọ́n ó tún sábà ń tọ́ka sí ìwà pẹ̀lẹ́, ìfarabalẹ̀, àti àìdàrúdàpọ̀. Yíyan ‘ìdákẹ́jẹ́’ kò mú àṣẹ náà lọ ré kọjá ohun tí ọ̀rọ̀ Gíríìkì dájú pé ó sọ.
- issue: Bóyá γυνή yẹ kí ó jẹ́ ‘obìnrin’ tàbí ‘aya’
  choice: obìnrin
  alternative: aya
  rationale: Àyíká gbolohun náà kò sọ ipò ìgbéyàwó ní kedere. ‘Obìnrin’ pa ìtumọ̀ gbígbòòrò mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ‘aya’ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn tó ṣeé ṣe.
translation_notes:
  register: Yorùbá Àfẹnusọ boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé òde òní. ‘Kí ... máa kọ́ ẹ̀kọ́’ mú àṣẹ Gíríìkì hàn ní ọ̀nà Yorùbá tó rọgbọ, ‘pẹ̀lú ìtẹríba pátápátá’ sì yàgò fún fífi ẹni tí ìtẹríba náà dojú kọ kún ọ̀rọ̀.
