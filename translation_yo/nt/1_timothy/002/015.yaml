id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: yo
  text: Ṣùgbọ́n a ó gbà á là[c] nípasẹ̀ bíbí ọmọ[a], bí wọ́n bá dúró ṣinṣin nínú ìgbàgbọ́[b], ìfẹ́, àti ìwà mímọ́ pẹ̀lú ìkóra-ẹni-níjàánu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìbímọ náà.” Àwọn kan ka èyí sí ìtọ́kasí sí ìbímọ kan pàtó, bóyá ìbí Mèsáyà; ṣùgbọ́n gbólóhùn náà tún lè túmọ̀ sí bíbí ọmọ lápapọ̀.
    reason: alternative_reading
  - marker: b
    text: “Ìgbàgbọ́” tún lè ní ìtumọ̀ “ìdúróṣinṣin” níhìn-ín.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì yí láti ẹyọ (“a ó gbà á là”) sí ọ̀pọ̀ (“bí wọ́n bá dúró ṣinṣin”).
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: a ó gba obìnrin náà là
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú ní ohùn àfaradà, ó sì sábà túmọ̀ sí ‘gbà là’ nínú àwọn lẹ́tà Paulu. Yíyan èyí kò fi ìtumọ̀ rẹ̀ mọ́ ààbò ara nìkan.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ kékeré tàbí ìtẹ̀síwájú sí ọ̀rọ̀ tó ṣáájú hàn; ‘Ṣùgbọ́n’ jẹ́ ọ̀nà àdánidá láti fi èyí hàn ní Yorùbá.
- source_word: διὰ τῆς τεκνογονίας
  choice: nípasẹ̀ bíbí ọmọ
  rationale: τεκνογονία túmọ̀ sí bíbí ọmọ tàbí iṣẹ́ ìbímọ. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì ṣì jẹ́ kí àìdánilójú nípa bóyá ìbímọ lápapọ̀ ni tàbí ìbímọ kan pàtó dúró.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Àkópọ̀ ‘bí ... bá’ ni ọ̀nà Yorùbá tó ṣe déédéé fún gbólóhùn oníṣ条件 ἐάν.
- source_word: μείνωσιν
  choice: wọ́n bá dúró ṣinṣin
  rationale: μένω níhìn-ín ní ìtumọ̀ títẹ̀síwájú tàbí dídúró nínú ipò kan; ‘dúró ṣinṣin’ sọ ìfaradà náà ní kedere.
- source_word: ἐν πίστει
  choice: nínú ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún πίστις, bí ó tilẹ̀ jẹ́ pé ‘ìṣòtítọ́’ tún lè bá ọ̀rọ̀ náà mu níhìn-ín.
- source_word: ἀγάπῃ
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì ṣe kedere fún ἀγάπη.
- source_word: ἁγιασμῷ
  choice: ìwà mímọ́
  rationale: ‘Ìwà mímọ́’ jẹ́ èdè Yorùbá tó rọrùn fún àkójọ ìwà rere, kò sì sọ ọ̀rọ̀ náà di èdè ẹ̀kọ́ ìsìn tó le.
- source_word: μετὰ σωφροσύνης
  choice: pẹ̀lú ìkóra-ẹni-níjàánu
  rationale: σωφροσύνη ní ìtumọ̀ ìkóra-ẹni-níjàánu, ìrònú tó péye, tàbí ìwà ìwọ̀ntúnwọ̀nsì. Yíyan yìí ṣe kedere, ó sì bá àkóónú ìwà rere mu.
theological_decisions:
- issue: Ìyípadà láti ẹyọ ‘a ó gba obìnrin náà là’ sí ọ̀pọ̀ ‘bí wọ́n bá’
  choice: A pa ìyípadà nọ́ńbà gẹ́gẹ́ bí ó ṣe wà nínú Gíríìkì mọ́.
  alternative: Kí a mú un dọ́gba sí ‘a ó gba àwọn obìnrin là ... bí wọ́n bá,’ tàbí kí a sọ pé ‘obìnrin náà’ ni Éfà, ‘wọ́n’ sì ni àwọn obìnrin lápapọ̀.
  rationale: Gíríìkì fúnra rẹ̀ yí láti ẹyọ sí ọ̀pọ̀. Mímú wọn dọ́gba yóò bo àmì pàtàkì kan nínú orísun mọ́lẹ̀, yóò sì yanju ìṣòro ìtumọ̀ tí ẹsẹ náà kò yanju.
- issue: Ìtumọ̀ ‘a ó gba ... là nípasẹ̀ bíbí ọmọ’
  choice: A fi gbólóhùn náà sílẹ̀ láìsọ bóyá ìgbàlà ẹ̀mí, ìgbàlà ọjọ́ ìkẹyìn, ààbò nígbà ìbímọ, tàbí ipa ìyá ni ó túmọ̀ sí.
  alternative: ‘A ó dá a sí nígbà ìbímọ,’ ‘a ó gba a là nípa gbígba iṣẹ́ ìyá,’ tàbí ‘a ó gba a là nípasẹ̀ ìbí Mèsáyà.’
  rationale: Gbólóhùn Gíríìkì náà ṣòro, àwọn ìtumọ̀ rẹ̀ sì ń jiyàn. Kò sọ ní tààrà pé ààbò ara nígbà ìbímọ ni, bẹ́ẹ̀ ni kò dárúkọ ìbí Mèsáyà; nítorí náà, a kò gbọdọ̀ fi ẹ̀kọ́ kan tí ọ̀rọ̀ náà kò sọ sínú àyọkà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ ti ẹ̀dá. ‘Obìnrin náà’ mú ẹyọ abo inú Gíríìkì hàn, nígbà tí ‘wọ́n’ pa ìyípadà sí ọ̀pọ̀ mọ́. Àwọn àmì àlàyé ni a tò lẹ́gbẹ̀ẹ́ gbólóhùn tí wọ́n ń ṣàlàyé.
