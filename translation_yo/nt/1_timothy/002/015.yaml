  terminology: “Ìgbàgbọ́,” “ìfẹ́,” “ìwà mímọ́,” àti “ìkóra-ẹni-níjàánu” jẹ́ àwọn yíyan tó yẹ. Ṣùgbọ́n “ìṣòtítọ́” túmọ̀ sí òtítọ́/ìwà-òtítọ́ ní pàtàkì, kì í sì ṣe àfidípò tó dára fún ‘faithfulness’ níhìn-ín; “ìdúróṣinṣin” dára jù fún ìfẹ̀sẹ̀múlẹ̀ yẹn.
