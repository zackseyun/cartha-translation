  source_fidelity: Ìtumọ̀ àkọ́kọ́ mú ìtọ́kasí ὃς sí Ọlọ́run, ìwọ̀n gbogbogbòò ti πάντας ἀνθρώπους, àti ìsopọ̀ àwọn ìṣe méjèèjì mọ́ dáadáa. Síbẹ̀, “rí ìgbàlà” lè dín agbára aláìlẹ́ni σωθῆναι kù díẹ̀, níwọ̀n bí ó ti lè túmọ̀ sí ìmúṣẹ tàbí ìní ìgbàlà. “Kí a gba gbogbo ènìyàn là” jẹ́ ọ̀nà Yorùbá àdánidá tí ó fi ìtumọ̀ “kí a gbà wọ́n là / kí wọ́n jẹ́ ẹni-ìgbàlà” hàn ní kedere láìsọ ẹni tí ó ṣe ìgbàlà náà ju ohun tí Gíríìkì sọ lọ.
  naturalness: Gbólóhùn náà rọrùn láti ka, àmì ohùn rẹ̀ sì péye. Àtúnṣe kékeré náà ń mú ìtumọ̀ σωθῆναι hàn kedere sí i. “Wá sí ìmọ̀ òtítọ́” jẹ́ ìlò Yorùbá tó dára fún ìlọsíwájú sínú ìmọ̀ náà.
  terminology: “Gbogbo ènìyàn,” “fẹ́,” “gba ... là,” àti “ìmọ̀ òtítọ́” jẹ́ ọ̀rọ̀ boṣewa tí ó bá ọ̀rọ̀ Pọ́ọ̀lù àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tó wà ní ẹsẹ náà mu. A yọ “pinnu” kúrò nínú àlàyé ìsàlẹ̀, nítorí pé ó lè mú θέλει dà bí ìpinnu àṣẹ tó lágbára ju ohun tí ọ̀rọ̀ náà fi hàn lọ.
