  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: yo
  text: ẹni tí ó fẹ́ kí a gba gbogbo ènìyàn là[a], kí wọ́n sì wá sí ìmọ̀ òtítọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “ó ní ìfẹ́ kí a gba gbogbo ènìyàn là.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “fẹ́,” “ní ìfẹ́,” tàbí “fẹ́ràn kí”; a lo “fẹ́” kí ìtumọ̀ má bàa yanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ ju bí ọ̀rọ̀ náà ṣe sọ lọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ pé, “kí wọ́n wá sí ìmọ̀ òtítọ́ ní kíkún.” Ọ̀rọ̀ orúkọ Gíríìkì náà lè ní ìtumọ̀ ìmọ̀ tó jinlẹ̀ tàbí tó péye sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ẹni tí ó
  rationale: Ọ̀rọ̀ arọ́pò ìbátan yìí tọ́ka sí Ọlọ́run nínú ẹsẹ tó ṣáájú; “ẹni tí ó” pa ìsopọ̀ gírámà náà mọ́ ní Yorùbá àdánidá.
- source_word: πάντας ἀνθρώπους
  choice: gbogbo ènìyàn
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan; “gbogbo ènìyàn” jẹ́ èdè Yorùbá tí ó ṣe kedere, tí kò sì dín ìwọ̀n ọ̀rọ̀ náà kù.
- source_word: θέλει
  choice: fẹ́
  rationale: θέλω lè túmọ̀ sí fẹ́, ní ìfẹ́, tàbí pinnu. “Fẹ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára ìtumọ̀ rẹ̀ mọ́ láìsọ ọ́ di ọ̀rọ̀ ìmọ̀-ẹ̀sìn pàtó nípa ìfẹ́ àṣẹ Ọlọ́run.
- source_word: σωθῆναι
  choice: rí ìgbàlà
  rationale: Ìṣe aláìlẹ́ni Sọ̀rọ̀ yìí ní agbára ìtumọ̀ ìgbàlà nínú ọ̀rọ̀ Paulu. “Rí ìgbàlà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí a gba ènìyàn là, ó sì yẹra fún fífi ẹni tó ṣe ìṣe náà kún ohun tí gírámà Gíríìkì kò sọ ní tààrà.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: sí ìmọ̀ òtítọ́
  rationale: ἐπίγνωσις lè jẹ́ ìmọ̀, mímọ̀ dájúdájú, tàbí ìmọ̀ kíkún. “Sí ìmọ̀ òtítọ́” jẹ́ kíkà Yorùbá tó mọ́, ó sì fi ààyè sílẹ̀ fún agbára ìtumọ̀ tó jinlẹ̀ sí i.
- source_word: ἐλθεῖν
  choice: wá
  rationale: Pẹ̀lú εἰς, ọ̀rọ̀ ìṣe náà fi ìlọsíwájú sí ipò kan hàn. “Wá sí” mú àwòrán ìrìn dé ibi kan jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìwọ̀n πάντας ἀνθρώπους àti ìfẹ́ Ọlọ́run fún ìgbàlà
  choice: Túmọ̀ rẹ̀ ní tààrà sí “gbogbo ènìyàn,” kí a sì lo “fẹ́,” láìdín gbogbo ènìyàn kù sí onírúurú ẹ̀ka ènìyàn tàbí sọ θέλει di ọ̀rọ̀ amúlò pàtó nípa ìfẹ́ àṣẹ.
  alternative: “gbogbo onírúurú ènìyàn”; tàbí “ó pinnu pé kí gbogbo ènìyàn rí ìgbàlà.”
  rationale: Ìtumọ̀ àdánidá gbólóhùn Gíríìkì náà ní ìwọ̀n gbogbo ènìyàn. Yíyan “gbogbo ènìyàn” àti “fẹ́” pa ìforígbárí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà ní mọ́, láìyanju rẹ̀ ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “rí ìgbàlà” gẹ́gẹ́ bí gbólóhùn àdánidá, a sì pa àmì ohùn mọ́ ní gbogbo ibi tí ó yẹ.
