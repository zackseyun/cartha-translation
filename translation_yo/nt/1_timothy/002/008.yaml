id: 1TI.2.8
reference: 1 Timothy 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: yo
  text: Nítorí náà, mo fẹ́ kí àwọn ọkùnrin máa gbàdúrà ní ibi gbogbo, kí wọ́n máa gbé ọwọ́ mímọ́ sókè láìsí ìbínú tàbí àríyànjiyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìsí ìbínú tàbí iyèméjì.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìrònú inú tàbí iyèméjì, ṣùgbọ́n níbí ó ṣeé ṣe jù pé ó ń tọ́ka sí àríyànjiyàn tó ń fa ìjà nínú àpéjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: mo fẹ́
  rationale: Ó fi ìfẹ́ tàbí ìpinnu Pọ́ọ̀lù hàn ní ọ̀nà àdánidá, ó sì pa agbára ìtọ́ni ọ̀rọ̀ náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìtọ́ni yìí mọ́ ohun tí a sọ ṣáájú gẹ́gẹ́ bí àbájáde tàbí ìtẹ̀síwájú èrò.
- source_word: προσεύχεσθαι
  choice: máa gbàdúrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún gbígbàdúrà; ‘máa’ mú ìṣe tí a ń retí ní ìgbà gbogbo hàn ní àyíká yìí.
- source_word: τοὺς ἄνδρας
  choice: àwọn ọkùnrin
  rationale: ἀνήρ níbí tọ́ka sí àwọn ọkùnrin ní pàtó, kì í ṣe gbogbo ènìyàn lápapọ̀; àyíká tó tẹ̀ lé e tún ya ìtọ́ni fún ọkùnrin àti obìnrin sọ́tọ̀.
- source_word: ἐν παντὶ τόπῳ
  choice: ní ibi gbogbo
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ pínpín ‘ní gbogbo ibi’ mọ́.
- source_word: ἐπαίροντας
  choice: kí wọ́n máa gbé ... sókè
  rationale: Ó ṣàpèjúwe ìfarahàn ara tí ó bá àdúrà lọ, ó sì bá gírámà Yorùbá mu nípa lílo gbólóhùn tó tẹ̀ lé ìṣe pàtàkì.
- source_word: ὁσίους χεῖρας
  choice: ọwọ́ mímọ́
  rationale: Ó pa àwòrán àti ìtumọ̀ ὅσιος mọ́ gẹ́gẹ́ bí ohun tí a yà sọ́tọ̀ fún Ọlọ́run, tí ìwà rẹ̀ sì jẹ́ ìtẹ́wọ́gbà níwájú rẹ̀.
- source_word: χωρὶς
  choice: láìsí
  rationale: Ó sọ àìsí ohun kan ní kedere àti ní Yorùbá àdánidá.
- source_word: ὀργῆς
  choice: ìbínú
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún anger, ó sì bá àyíká ìbáṣepọ̀ inú àpéjọ mu.
- source_word: διαλογισμοῦ
  choice: àríyànjiyàn
  rationale: διαλογισμός lè túmọ̀ sí èrò inú, iyèméjì, tàbí ìjiyàn. Níbi tí a ti so ó pọ̀ mọ́ ìbínú nínú àdúrà àpéjọ, ‘àríyànjiyàn’ mú ìjà ọ̀rọ̀ àti ìtakora hàn dáadáa; a pa ‘iyèméjì’ mọ́ nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtọ́kasí akọ ní pàtó nínú τοὺς ἄνδρας
  choice: àwọn ọkùnrin
  alternative: gbogbo ènìyàn; àwọn ọkọ
  rationale: Orúkọ Gíríìkì náà jẹ́ akọ ní pàtó, àyíká sì ń fún àwọn ọkùnrin àti àwọn obìnrin ní ìtọ́ni tí a yà sọ́tọ̀. Títúmọ̀ rẹ̀ sí gbogbo ènìyàn yóò mú ìyàtọ̀ orísun náà kúrò.
- issue: Ìtumọ̀ διαλογισμοῦ nínú àyíká àdúrà
  choice: àríyànjiyàn
  alternative: iyèméjì; ìjiyàn
  rationale: Pípẹ̀lú ‘ìbínú’ àti àyíká àpéjọ mú ìtumọ̀ ìtakora tàbí ìjà ọ̀rọ̀ ṣeé ṣe jù. Síbẹ̀, ‘iyèméjì’ jẹ́ ìtumọ̀ tí ọ̀rọ̀ náà lè ní, nítorí náà a kò fi pamọ́ bí ẹni pé kò ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A lo ‘máa’ láti mú ìtọ́ni ìṣe tí ń bá a lọ hàn; a sì pa àwòrán ‘ọwọ́ mímọ́’ mọ́ láìṣàlàyé rẹ̀ ju ohun tí orísun sọ lọ.
