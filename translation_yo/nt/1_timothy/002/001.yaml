id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: yo
  text: Lákọ̀ọ́kọ́, mo rọ̀ pé kí a máa ṣe ẹ̀bẹ̀, àdúrà, ìbẹ̀bẹ̀ fún ẹlòmíràn, àti ìdúpẹ́ fún gbogbo ènìyàn[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ipò gbogbo ènìyàn.”
    reason: lexical_alternative
  - marker: b
    text: “Gbogbo ènìyàn” túmọ̀ ọ̀rọ̀ Gíríìkì gbogbogbò fún ẹ̀dá ènìyàn, kì í ṣe ọkùnrin nìkan.
    reason: lexical_alternative
  - marker: c
    text: Àwọn kan lóye “gbogbo ènìyàn” níbí sí “gbogbo onírúurú ènìyàn”; ṣùgbọ́n Gíríìkì fúnra rẹ̀ kan sọ “gbogbo ènìyàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: mo rọ̀ yín
  rationale: Ó fi ìtọ́ni àtọkànwá tí ó lágbára hàn ní Yorùbá àdánidá, láì mú un le bí àṣẹ tààrà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: πρῶτον πάντων
  choice: èyí ni ohun tí mo kọ́kọ́ ... láti ṣe
  rationale: Ó fi ipò àkọ́kọ́ tàbí pàtàkì ohun tí Pọ́ọ̀lù ń sọ hàn, kì í ṣe dandan pé ó ń bẹ̀rẹ̀ àtòjọ onínọ́mbà.
- source_word: ποιεῖσθαι
  choice: kí ẹ máa gbàdúrà ... pẹ̀lú
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún ìṣe tí gbogbo àwọn ọ̀rọ̀ àdúrà mẹ́rin náà ń ṣàlàyé; àmì ìṣe tí ń bá a lọ nínú máa tún bá present infinitive mu.
- source_word: δεήσεις
  choice: ẹ̀bẹ̀
  rationale: Ó tọ́ka sí ìbéèrè àtọkànwá tí àìní ń mú wá.
- source_word: προσευχάς
  choice: àdúrà
  rationale: Èyí ni ọ̀rọ̀ gbogbogbò tí ó wọ́pọ̀ jù lọ fún προσευχή.
- source_word: ἐντεύξεις
  choice: ìrawọ́ ẹ̀bẹ̀
  rationale: Ó dá ìtumọ̀ àdúrà tàbí ẹ̀bẹ̀ tí a ń ṣe nítorí ẹlòmíràn sí; kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé ọ̀rọ̀ náà lórí.
- source_word: εὐχαριστίας
  choice: ìdúpẹ́
  rationale: Ó yà ìfihàn ọpẹ́ sọ́tọ̀ kúrò nínú àwọn oríṣi àdúrà yòókù, bí àtòjọ Gíríìkì ṣe rí.
- source_word: ὑπὲρ
  choice: fún
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ àǹfààní tàbí ìdúró fún ẹlòmíràn; àlàyé ìtumọ̀ tó péye sí i wà ní àlàyé ìsàlẹ̀.
- source_word: πάντων ἀνθρώπων
  choice: gbogbo ènìyàn
  rationale: ἄνθρωπος jẹ́ ọ̀rọ̀ gbogbogbò fún ẹ̀dá ènìyàn níbí, kì í ṣe ọkùnrin nìkan; “gbogbo ènìyàn” jẹ́ Yorùbá àdánidá tó pa ìwọ̀n gbólóhùn náà mọ́.
theological_decisions:
- issue: Ìwọ̀n πάντων ἀνθρώπων
  choice: gbogbo ènìyàn
  alternative: onírúurú ènìyàn gbogbo
  rationale: Gbólóhùn Gíríìkì fúnra rẹ̀ sọ “gbogbo ènìyàn.” A kò dín in kù sí gbogbo ẹ̀ka tàbí irú ènìyàn, ṣùgbọ́n a mẹ́nu kan òye yẹn nínú àlàyé láì pinnu àríyànjiyàn ẹ̀kọ́ ìsìn.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A tún gbé gbólóhùn náà kalẹ̀ ní ọ̀nà Yorùbá àdánidá, ṣùgbọ́n a pa àtòjọ àwọn ọ̀nà àdúrà mẹ́rin àti àìdánilójú nípa ìwọ̀n “gbogbo ènìyàn” mọ́.
