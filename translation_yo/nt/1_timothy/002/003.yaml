  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: yo
  text: Èyí dára, ó sì jẹ́ ohun ìtẹ́wọ́gbà níwájú Ọlọ́run, Olùgbàlà wa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí tọ́ka sẹ́yìn sí ìtọ́ni nípa àdúrà; “Èyí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láì fi ohun tí Gíríìkì kò sọ kún un.
- source_word: καλὸν
  choice: dára
  rationale: Nínú àyíká ọ̀rọ̀ ìwà rere yìí, ó túmọ̀ sí ohun rere tàbí ohun tó yẹ, kì í ṣe ẹwà ojú lásán.
- source_word: ἀπόδεκτον
  choice: ṣe ìtẹ́wọ́gbà
  rationale: Ó ń sọ pé a tẹ́wọ́ gba ohun náà tàbí pé ó yẹ fún ìtẹ́wọ́gbà; yíyan yìí pa ìtumọ̀ ìdájọ́ rere náà mọ́ láì túmọ̀ rẹ̀ sí “mú inú dùn” nìkan.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: Ó ṣàfihàn bí Ọlọ́run ṣe ń wo ohun náà àti ìdájọ́ rẹ̀ lórí rẹ̀; “níwájú” jẹ́ ọ̀rọ̀ àdánidá tó sì bá àwòrán inú Gíríìkì mu.
- source_word: σωτῆρος
  choice: Olùgbàlà
  rationale: Orúkọ oyè yìí ń tọ́ka sí ẹni tí ń gbà là; “Olùgbàlà” jẹ́ èdè Yorùbá tó fìdí múlẹ̀, tó sì pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἡμῶν
  choice: wa
  rationale: A pa arọ́pò-orúkọ oníhun náà mọ́ ní tààràtà gẹ́gẹ́ bí ohun tó ń ṣàlàyé “Olùgbàlà.”
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Orúkọ náà dúró ní ìbámu pẹ̀lú “Olùgbàlà,” ó sì ń dá Ọlọ́run mọ̀ gẹ́gẹ́ bí Olùgbàlà wa.
theological_decisions:
- issue: Ìbáṣepọ̀ àfikún ìdánimọ̀ nínú τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: “Ọlọ́run Olùgbàlà wa”
  alternative: “Olùgbàlà wa, Ọlọ́run”
  rationale: Àwọn ọ̀rọ̀ oníbùdó Gíríìkì náà ń ṣiṣẹ́ pọ̀ láti dá Ọlọ́run mọ̀ gẹ́gẹ́ bí Olùgbàlà wa. Ètò ọ̀rọ̀ tí a yàn jẹ́ àdánidá ní Yorùbá, ó sì pa ìdánimọ̀ náà mọ́ láì fi ẹ̀kọ́ mìíràn tí ẹsẹ̀ náà kò sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa gbolohun náà mọ́ gẹ́gẹ́ bí ara ìtẹ̀síwájú sí ẹsẹ̀ tó tẹ̀ lé e.
