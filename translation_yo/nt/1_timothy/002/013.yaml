  text: Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: yo
  text: Nítorí a kọ́kọ́ dá Ádámù, lẹ́yìn náà ni a dá Éfà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kọ́kọ́ mọ́ Ádámù, lẹ́yìn náà ni a mọ́ Éfà.” Ọ̀rọ̀ ìṣe náà tún máa ń tọ́ka sí mímọ́ tàbí ṣíṣe nǹkan ní ìrísí kan, ó sì jọ èdè ìtàn ìṣẹ̀dá nínú Jẹ́nẹ́sísì.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí tàbí àlàyé fún ìtọ́ni tó ṣáájú hàn, láìfi ìtumọ̀ míì kún un.
- source_word: Ἀδὰμ
  choice: Ádámù
  rationale: Orúkọ ẹni náà ni a kọ ní ìrísí tó wọ́pọ̀ nínú Yorùbá.
- source_word: πρῶτος
  choice: kọ́ dá
  rationale: Nínú àkójọpọ̀ ‘ni a kọ́ dá,’ ó fi hàn pé dídá Ádámù ṣáájú ti Éfà ní àkókò.
- source_word: ἐπλάσθη
  choice: ni a ... dá
  rationale: Ìṣe àìṣe-láti-ọ̀dọ̀ ẹni náà ni; ‘dá’ jẹ́ ọ̀rọ̀ Yorùbá adayébá tó lè tọ́ka sí mímú ẹ̀dá wá sí ìwàláàyè, bí ó tilẹ̀ jẹ́ pé Gíríìkì náà tún ní àwòrán mímọ ẹ̀dá.
- source_word: εἶτα
  choice: lẹ́yìn náà
  rationale: Ó pa ìtẹ̀lé àkókò mọ́ ní Yorùbá adayébá.
- source_word: Εὕα
  choice: Éfà
  rationale: A lo ìrísí orúkọ náà tó ti wọ́pọ̀ nínú Yorùbá.
theological_decisions:
- issue: Ìbáṣepọ̀ ẹsẹ̀ náà pẹ̀lú bí a ṣe dá ènìyàn nínú Jẹ́nẹ́sísì ní àyíká ìjíròrò nípa ipa ọkùnrin àti obìnrin
  choice: 'A túmọ̀ rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ tó sọ ìtẹ̀lé àkókò nìkan: a kọ́ dá Ádámù, lẹ́yìn náà Éfà.'
  alternative: Ìtumọ̀ tó máa fi àṣẹ tàbí ìyàtọ̀ ipa ọkùnrin àti obìnrin sínú ẹsẹ̀ náà ní tààràtà.
  rationale: Gíríìkì sọ bí dídá wọn ṣe tẹ̀ lé ara wọn, kò sì sọ ìyọrísí ẹ̀kọ́ ìgbàgbọ́ náà ní kedere nínú ẹsẹ̀ yìí fúnra rẹ̀. Ìtumọ̀ náà kò gbé ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ kalẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ; èdè náà jẹ́ adayébá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní.
