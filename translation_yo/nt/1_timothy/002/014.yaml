  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: yo
  text: A kò tan Ádámù jẹ[a], ṣùgbọ́n obìnrin náà, tí a tàn jẹ pátápátá, wá wà nínú ìrékọjá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A kò ṣi Ádámù lọ́nà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ti wà nínú ìrékọjá” tàbí “di ẹni tí ó wà nínú ìrékọjá”; ọ̀rọ̀-ìṣe Giriki tó jẹ́ perfect lè tẹnumọ́ ipò tó jẹ́ àbájáde ìṣẹ̀lẹ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Ádámù
  rationale: A lo ìkọ̀wé orúkọ tí ó ti wọ́pọ̀ ní Yorùbá fún orúkọ Ádámù.
- source_word: ἠπατήθη
  choice: a kò tan ... jẹ
  rationale: Èyí tú passive aorist ἀπατάω jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘deceive’ mọ́ láìlo ọ̀rọ̀ aláìwọ́pọ̀.
- source_word: γυνή
  choice: obìnrin náà
  rationale: Nínú ìtọ́kasí sí ìtàn Jẹ́nẹ́sísì àti ìyàtọ̀ sí Ádámù, ‘obìnrin náà’ ṣe kedere ju ‘aya náà’ lọ, bó tilẹ̀ jẹ́ pé γυνή lè túmọ̀ sí méjèèjì.
- source_word: ἐξαπατηθεῖσα
  choice: nígbà tí a tan án jẹ pátápátá
  rationale: Ọ̀rọ̀ náà jẹ́ participle, ó sì ní agbára ju ἀπατάω lọ; ‘pátápátá’ fi ìtẹnumọ́ yẹn hàn, nígbà tí gbólóhùn ‘nígbà tí’ fi hàn pé ìtànjẹ náà ṣáájú àbájáde tó tẹ̀ lé e.
- source_word: ἐν παραβάσει
  choice: sínú ìrékọjá
  rationale: Yorùbá àdánidá máa ń sọ pé ènìyàn ‘wá sínú’ ipò kan. ‘Ìrékọjá’ pa abstract noun παράβασις mọ́, kò sì sọ obìnrin náà di ‘arékọjá,’ èyí tí Giriki kò sọ ní tààrà.
- source_word: γέγονεν
  choice: wá
  rationale: Pẹ̀lú ‘sínú ìrékọjá,’ ‘wá’ fi ìṣẹ̀lẹ̀ àti ipò àbájáde perfect γέγονεν hàn ní ọ̀nà Yorùbá tó rọrùn.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó wà láàárín Ádámù àti obìnrin náà hàn.
- source_word: καὶ
  choice: Àti pé
  rationale: Ó so gbólóhùn yìí mọ́ ìdáláre tó ṣáájú; ‘Àti pé’ jẹ́ ìsopọ̀ Yorùbá tó bá àyíká ọ̀rọ̀ mu.
theological_decisions:
- issue: Bí a ṣe lè sọ ìbáṣepọ̀ obìnrin náà pẹ̀lú ìrékọjá láìfi ẹ̀kọ́ míì tí ẹsẹ̀ náà kò sọ kún un.
  choice: obìnrin náà ... wá sínú ìrékọjá
  alternative: obìnrin náà ... di arékọjá
  rationale: Yíyan abstract noun ‘ìrékọjá’ pa ọ̀rọ̀ Giriki àti ìṣòro ìtumọ̀ rẹ̀ mọ́; kò sọ ọ́ di àkọlé ìdálẹ́bi ẹni tàbí fa ìpinnu gbòòrò nípa gbogbo obìnrin.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘tan ... jẹ’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ìtànjẹ, a sì lo ‘ìrékọjá’ fún ọ̀rọ̀ ẹ̀ṣẹ̀ tí ó túmọ̀ sí rékọjá ààlà tàbí àṣẹ. Gbogbo àmì ẹsẹ̀ ìsàlẹ̀ [a], [b] wà nínú ọ̀rọ̀ pàtàkì.
