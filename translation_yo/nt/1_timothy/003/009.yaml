  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: yo
  text: kí wọ́n máa di àṣírí ìgbàgbọ́ mú nínú ẹ̀rí-ọkàn mímọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n máa di àṣírí ìgbàgbọ́ mú pẹ̀lú ẹ̀rí-ọkàn mímọ́.”
    reason: “Nínú” ń tẹ̀lé ìṣètò ἐν καθαρᾷ συνειδήσει súnmọ́; “pẹ̀lú” jẹ́ ọ̀nà Yorùbá mìíràn tó dáa láti sọ ìbáṣepọ̀ náà.
lexical_decisions:
- source_word: ἔχοντας
  choice: kí wọ́n máa di … mú
  rationale: Ọ̀rọ̀ àbọ̀ ìṣe yìí ń tẹ̀ síwájú láti inú àwọn ànímọ́ àwọn díákónì ní ẹsẹ tó ṣáájú. ‘Máa di … mú’ fi hàn pé wọ́n ń tẹ̀ síwájú láti fara mọ́ ohun tí wọ́n gbàgbọ́, kì í ṣe pé wọ́n kàn ní í lásán.
- source_word: μυστήριον
  choice: àṣírí
  rationale: Nínú lílò Pọ́ọ̀lù, ó sábà ń tọ́ka sí òtítọ́ Ọlọ́run tí ó ti fara sin tẹ́lẹ̀ ṣùgbọ́n tí a ti ṣí payá. ‘Àṣírí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, láìfi ‘tí a ṣí payá’ kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: τῆς πίστεως
  choice: ìgbàgbọ́
  rationale: Àyíká ọ̀rọ̀ náà mú kí ó ṣeé ṣe jù pé ó ń tọ́ka sí ohun tí àwọn Kristẹni gbà gbọ́, bí ó tilẹ̀ jẹ́ pé èdè Yorùbá kò fi ìyàtọ̀ yẹn hàn ní kíkún. Ìtumọ̀ yìí kò pa ìtumọ̀ ‘ìgbàgbọ́’ gẹ́gẹ́ bí ìṣe gbígbẹ́kẹ̀lé run.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: pẹ̀lú ẹ̀rí-ọkàn tí ó mọ́
  rationale: ‘Pẹ̀lú’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ bí wọ́n ṣe ń di àṣírí ìgbàgbọ́ mú. ‘Ẹ̀rí-ọkàn tí ó mọ́’ pa àwòrán ìwà mímọ́ inú ọ̀rọ̀ καθαρός mọ́, ó sì yé òǹkàwé òde òní.
- source_word: συνειδήσει
  choice: ẹ̀rí-ọkàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà lò fún agbára inú ẹni tí ń jẹ́rìí sí rere tàbí búburú ìṣe rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ τῆς πίστεως
  choice: ìgbàgbọ́ gẹ́gẹ́ bí òtítọ́ tàbí ohun tí àwọn Kristẹni gbà gbọ́
  alternative: ìṣe ẹni ti ara rẹ̀ ti gbígbẹ́kẹ̀lé Ọlọ́run
  rationale: Àyíká àwọn ànímọ́ fún díákónì ṣe àtìlẹ́yìn fún ìtumọ̀ pé wọ́n gbọ́dọ̀ fara mọ́ ẹ̀kọ́ ìgbàgbọ́ Kristẹni. Síbẹ̀, ‘ìgbàgbọ́’ pa ìwọ̀n àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́ ju gbólóhùn tó túmọ̀ rẹ̀ sí ‘ẹ̀kọ́ Kristẹni’ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún. Gbólóhùn náà ń tẹ̀ síwájú láti ẹsẹ tó ṣáájú, nítorí náà a lo ‘kí wọ́n máa’ láti jẹ́ kí ìbáṣepọ̀ girama náà hàn ní Yorùbá.
