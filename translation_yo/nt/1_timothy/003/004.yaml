  text: τοῦ ἰδίου οἴκου καλῶς προϊστάμενον, τέκνα ἔχοντα ἐν ὑποταγῇ μετὰ πάσης σεμνότητος·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/004.yaml
  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: yo
  text: kí ó máa darí ìdílé tirẹ̀ dáradára[a], kí ó ní àwọn ọmọ rẹ̀ tí wọ́n wà ní ìfarabalẹ̀ sí àṣẹ[b], pẹ̀lú gbogbo ìwà ọlọ́lá[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó máa bójú tó ìdílé tirẹ̀ dáradára,” tàbí, “kí ó máa ṣàkóso ilé tirẹ̀ dáradára.” Ọ̀rọ̀ Gíríìkì fún “ìdílé” tún lè túmọ̀ sí “ilé” tàbí “àwọn ará ilé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí àwọn ọmọ rẹ̀ máa wà ní ìfarabalẹ̀ sí àṣẹ,” tàbí, “kí ó máa mú àwọn ọmọ rẹ̀ wà lábẹ́ àṣẹ.”
    reason: lexical_alternative
  - marker: c
    text: Gbólóhùn náà, “pẹ̀lú gbogbo ìwà ọlọ́lá,” lè ṣàpèjúwe bí àwọn ọmọ ṣe wà ní ìfarabalẹ̀ sí àṣẹ, tàbí gbogbo ọ̀nà tí ọkùnrin náà fi ń darí ìdílé rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: ìdílé tirẹ̀
  rationale: Οἶκος lè tọ́ka sí ilé tàbí sí àwọn ará ilé. Nínú ọ̀rọ̀ yìí, “ìdílé tirẹ̀” fi hàn pé ibi tí ó ń bójú tó nínú ilé rẹ̀ ni a ń sọ, ó sì pa agbára ἰδίου mọ́ gẹ́gẹ́ bí “tirẹ̀.”
- source_word: καλῶς
  choice: dáradára
  rationale: “Dáradára” jẹ́ ọ̀nà àdánidá, tó ṣe kedere láti sọ bí ó ṣe yẹ kí ó máa darí ìdílé náà.
- source_word: προϊστάμενον
  choice: máa darí
  rationale: “Máa darí” mú èrò ojúṣe, ìtọ́sọ́nà, àti àṣẹ tó wà nínú προΐστημι jáde láìsọ ọ́ di ọ̀rọ̀ líle tàbí ti ìgbàanì.
- source_word: τέκνα ἔχοντα
  choice: kí ó sì mú àwọn ọmọ rẹ̀ wà
  rationale: Ìtumọ̀ yìí fi iṣẹ́ ọkùnrin náà nínú mímú kí àwọn ọmọ rẹ̀ wà ní ipò tí a sọ hàn, ó sì jẹ́ èdè Yorùbá tó ṣàn.
- source_word: ἐν ὑποταγῇ
  choice: ní ìtẹríba
  rationale: “Ìtẹríba” pa àkópọ̀ ọ̀rọ̀-orúkọ Gíríìkì mọ́, ó sì sọ ìfarabalẹ̀ sí abẹ́ àṣẹ ju pé kí a túmọ̀ rẹ̀ sí ìṣàkóso lóde nìkan.
- source_word: μετὰ πάσης σεμνότητος
  choice: pẹ̀lú gbogbo ìwà ọ̀wọ̀
  rationale: “Ìwà ọ̀wọ̀” mú iyì, ìwà tó yẹ, àti ìwà tó yẹ fún ọ̀wọ̀ inú σεμνότης jáde. Gbólóhùn náà kò fi tipátipá pinnu bóyá ó ṣàpèjúwe ìtẹríba àwọn ọmọ tàbí gbogbo ọ̀nà tí ọkùnrin náà fi ń darí ìdílé.
theological_decisions:
- issue: Ìwọ̀n èdè nípa dídarí ìdílé
  choice: Ẹsẹ̀ náà ń sọ nípa bí ẹni tí a fẹ́ yàn ṣe ń fi ojúṣe àti àṣẹ tó bófin mu darí ìdílé tirẹ̀.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí àṣẹ baba tó lágbára jù, tàbí kí a sọ ọ́ di ìtọju lásán tí kò ní àṣẹ nínú.
  rationale: Προϊστάμενον àti ὑποταγή fi àṣẹ àti ètò gidi hàn, ṣùgbọ́n ẹsẹ̀ náà jẹ́ ànímọ́ fún ẹni tí yóò ṣe alábòójútó, kì í ṣe àlàyé kíkún nípa gbogbo irú àṣẹ nínú ìdílé.
- issue: Ohun tí “pẹ̀lú gbogbo ìwà ọ̀wọ̀” ń ṣàpèjúwe
  choice: Pa àìdánilójú ìsopọ̀ gbólóhùn Gíríìkì mọ́ láìyan ọ̀kan ní pàtó.
  alternative: Kí ó tọ́ka sí ìtẹríba àwọn ọmọ nìkan, tàbí kí ó tọ́ka sí ọ̀nà tí ọkùnrin náà fi ń darí ìdílé nìkan.
  rationale: Ìṣètò Gíríìkì lè jẹ́ kí gbólóhùn náà bá ìtẹríba àwọn ọmọ mu tàbí kí ó ṣàpèjúwe gbogbo ìdarí ilé. Àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé méjèèjì láìyanju ohun tí orísun kò yanjú.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹnudẹ́nu, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. “Darí” yàgò fún líle “ṣàkóso” gẹ́gẹ́ bí àṣàyàn pàtàkì, ṣùgbọ́n kò sọ àṣẹ inú ọ̀rọ̀ Gíríìkì di ìtọju lásán. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ.
