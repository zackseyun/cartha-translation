  source_fidelity: 'Ìtumọ̀ náà ń gbé ìtumọ̀ pàtàkì Gíríìkì náà kalẹ̀ dáadáa: ìdádúró Pọ́ọ̀lù, ète kí Timoteu mọ ìwà tó yẹ, ilé Ọlọ́run/ìjọ Ọlọ́run alààyè, àti àwòrán ọ̀wọ́n àti ìtìlẹ́yìn òtítọ́. Ṣùgbọ́n ‘agbo ilé’ lè túmọ̀ sí àgbàlá tàbí agbo àwọn ilé, kì í sì í jẹ́ ọ̀nà tó dájú jù lọ fún οἶκος níhìn-ín. ‘Ilé Ọlọ́run,’ pẹ̀lú àlàyé tó tẹ̀lé pé ìjọ Ọlọ́run alààyè ni, pa ìtumọ̀ náà mọ́ láì mú ìtumọ̀ ilé gangan wá sí iwájú.'
