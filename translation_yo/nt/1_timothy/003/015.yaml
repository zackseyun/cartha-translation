id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo bá pẹ́, kí o lè mọ bí ó ti yẹ kí ènìyàn máa hùwà nínú ilé Ọlọ́run, èyí tí í ṣe ìjọ Ọlọ́run alààyè, ọ̀wọ́n àti ìtìlẹ́yìn òtítọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀wọ́n àti ohun tó ń fi òtítọ́ múlẹ̀.” Àwọn mìíràn túmọ̀ ἑδραίωμα sí “ìpìlẹ̀” tàbí “odi ààbò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: bí mo bá pẹ́
  rationale: Ọ̀rọ̀ náà níhìn-ín túmọ̀ sí pé Pọ́ọ̀lù lè pẹ́ dé, kì í ṣe pé ó lọ́ra ní ìwà. Gbólóhùn yìí sì pa ìṣe aláìlódì mọ́.
- source_word: ἵνα εἰδῇς
  choice: kí o lè mọ
  rationale: Èyí fi ète ọ̀rọ̀ náà hàn ní Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ‘mo kọ̀wé’ wà nínú ẹsẹ tó ṣáájú, kì í sì í ṣe ọ̀rọ̀ inú ẹsẹ yìí fúnra rẹ̀.
- source_word: δεῖ … ἀναστρέφεσθαι
  choice: bí ó ti yẹ kí ènìyàn máa hùwà
  rationale: Ó mú dandan ìlànà náà àti ìtumọ̀ ìwà ìgbésí ayé jáde láì sọ ẹni kan pàtó.
- source_word: ἐν οἴκῳ θεοῦ
  choice: nínú agbo ilé Ọlọ́run
  rationale: ‘Agbo ilé’ tọ́ka sí àwọn ènìyàn inú ilé kan, kì í ṣe ilé àkọ́lé nìkan; èyí bá àlàyé tó tẹ̀ lé e mu.
- source_word: ἐκκλησία
  choice: ìjọ
  rationale: Ní Yorùbá, ‘ìjọ’ jẹ́ ọ̀rọ̀ àdánidá fún àwùjọ àwọn tí a pè jọ, ó sì bá àyíká àwọn ènìyàn Ọlọ́run mu ju ìtumọ̀ ilé tàbí àjọ lọ.
- source_word: θεοῦ ζῶντος
  choice: Ọlọ́run alààyè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtẹnumọ́ pé Ọlọ́run wà láàyè mọ́.
- source_word: στῦλος
  choice: ọ̀wọ́n
  rationale: ‘Ọ̀wọ́n’ pa àwòrán ilé tí ọ̀rọ̀ Gíríìkì náà ní mọ́.
- source_word: ἑδραίωμα
  choice: ohun ìdúró
  rationale: Ọ̀rọ̀ Gíríìkì tó ṣọ̀wọ́n yìí ń tọ́ka sí ohun tó mú ohun mìíràn dúró ṣinṣin. ‘Ohun ìdúró’ jẹ́ kedere láì pinnu pé ‘ìpìlẹ̀’ nìkan ni àwòrán náà.
- source_word: τῆς ἀληθείας
  choice: òtítọ́
  rationale: Yorùbá kò nílò atọ́ka ọ̀tọ̀ láti fi ìdánimọ̀ ọ̀rọ̀ Gíríìkì náà hàn; ‘òtítọ́’ jẹ́ àdánidá ní àsopọ̀ yìí.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία ní àyíká ìjọ
  choice: ìjọ
  alternative: àpéjọ
  rationale: ‘Ìjọ’ ní Yorùbá ṣi ń sọ nípa àwọn ènìyàn tí a kó jọ, ó sì jẹ́ ọ̀rọ̀ tí òǹkàwé òde òní lóye. A kò túmọ̀ rẹ̀ sí ilé ìjọsìn tàbí ètò àjọ kan.
- issue: Ìjọ gẹ́gẹ́ bí ‘ọ̀wọ́n àti ἑδραίωμα òtítọ́’
  choice: ọ̀wọ́n àti ohun ìdúró òtítọ́
  alternative: ọ̀wọ́n àti ìpìlẹ̀ òtítọ́; ọ̀wọ́n àti odi ààbò òtítọ́
  rationale: Gírámà Gíríìkì so àpèjúwe náà mọ́ ìjọ Ọlọ́run alààyè. ‘Ohun ìdúró’ pa ipa fífi òtítọ́ dúró ṣinṣin mọ́, ṣùgbọ́n kò fi kún un pé ìjọ ni orísun òtítọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà ní ọ̀wọ̀ àti ìdíwọ̀n, ṣùgbọ́n ó lo gbólóhùn tí òǹkàwé Yorùbá òde òní lè lóye. A kò fi ‘mo kọ̀wé’ sínú ẹsẹ náà nítorí pé kò sí nínú ọ̀rọ̀ Gíríìkì ẹsẹ 15; ète ἵνα ń tẹ̀ síwájú láti inú ẹsẹ 14.
