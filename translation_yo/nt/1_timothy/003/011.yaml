  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa àìdánilójú γυναῖκας mọ́ dáadáa nípasẹ̀ “Àwọn obìnrin” àti àlàyé “Àwọn aya,” láì fi ohun-ìní “wọn” kún un. Ó tún ṣàfihàn ὡσαύτως, πιστὰς, àti ἐν πᾶσιν lọ́nà tó pé. Síbẹ̀, “ẹni ọlọ́wọ̀” sábà máa ń túmọ̀ sí ẹni ọlọ́rọ̀, ọlọ́rẹ̀, tàbí onínúure, kì í sì ṣe ìtumọ̀ tó dájú fún σεμνάς (‘ọlọ́lá / ẹni tí ó yẹ fún ọ̀wọ̀’).
  naturalness: “Bákan náà” àti “jẹ́ ẹni tí ó yẹ fún ọ̀wọ̀” jẹ́ èdè Yorùbá boṣewa tó mọ́gbọ́n dání, tí ó sì bá àtòjọ ànímọ́ ẹsẹ̀ náà mu. “Ẹni tí ó ní ìṣọ́ra” ṣàfihàn νηφαλίους ní ti ìwà àti ìrònú, láì dín in kù sí ìkóra-ẹni-níjàánu nìkan.
  terminology: A ti yí σεμνάς sí “ẹni tí ó yẹ fún ọ̀wọ̀,” èyí tó bojú mu ìtumọ̀ ‘dignified/respectable.’ “Olùsọ̀rọ̀ ìbàjẹ́” jẹ́ ọ̀nà tó ṣe kedere fún διάβολοι gẹ́gẹ́ bí ẹni tó ń ba orúkọ ẹlòmíràn jẹ́ nípa ọ̀rọ̀, kì í ṣe Èṣù. “Ẹni tí ó ní ìṣọ́ra” yẹ fún νηφαλίους ní àyíká àtòjọ àwọn ànímọ́.
