revisions:
- from: Àwọn obìnrin náà pẹ̀lú gbọ́dọ̀ jẹ́ ẹni ọlọ́wọ̀,[a] kí wọ́n má ṣe jẹ́ afìbínúni, kí wọ́n ní ìkóra-ẹni-níjàánu, kí wọ́n sì jẹ́ olóòótọ́ nínú ohun gbogbo.
  to: Bákan náà, àwọn obìnrin gbọ́dọ̀ jẹ́ ẹni tí ó yẹ fún ọ̀wọ̀,[a] kí wọ́n má ṣe jẹ́ olùsọ̀rọ̀ ìbàjẹ́, kí wọ́n jẹ́ ẹni tí ó ní ìṣọ́ra, kí wọ́n sì jẹ́ olóòótọ́ nínú ohun gbogbo.
  rationale: Àtúnṣe náà ṣe pàtàkì láti mú σεμνάς wá sí Yorùbá tó pé, kí “ọlọ́wọ̀” má bàa fa ìtumọ̀ ọlọ́rọ̀ tàbí onínúure wọ inú ẹsẹ̀ náà. A tún lo ọ̀rọ̀ tó dájú fún ìbàjẹ́ orúkọ ní μὴ διαβόλους, a sì yan “ẹni tí ó ní ìṣọ́ra” láti ṣàfihàn νηφαλίους. Àìdánilójú obìnrin/aya ni a pa mọ́ nínú ọ̀rọ̀ pàtàkì àti àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:40Z'
