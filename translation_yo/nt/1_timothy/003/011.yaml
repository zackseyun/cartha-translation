id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: yo
  text: Bákan náà, àwọn obìnrin gbọ́dọ̀ jẹ́ ẹni tí ó yẹ fún ọ̀wọ̀,[a] kí wọ́n má ṣe jẹ́ olùsọ̀rọ̀ ìbàjẹ́, kí wọ́n jẹ́ ẹni tí ó ní ìṣọ́ra, kí wọ́n sì jẹ́ olóòótọ́ nínú ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn aya gbọ́dọ̀ jẹ́ ẹni tí ó yẹ fún ọ̀wọ̀...” Ọ̀rọ̀ Gíríìkì γυναῖκας lè túmọ̀ sí “àwọn obìnrin” tàbí “àwọn aya” ní àyíká yìí; kò sọ ní pàtó pé “àwọn aya wọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: Àwọn obìnrin
  rationale: γυνή lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya’ ní àyíká yìí. Ọ̀rọ̀ Gíríìkì kò ní ohun arọ́pò-orúkọ tó túmọ̀ sí ‘wọn,’ nítorí náà a lo ‘àwọn obìnrin’ nínú ọ̀rọ̀ pàtàkì, a sì fi ‘àwọn aya’ sí àlàyé ìsàlẹ̀.
- source_word: ὡσαύτως
  choice: náà pẹ̀lú
  rationale: Ó so àwọn ànímọ́ ẹgbẹ́ yìí pọ̀ mọ́ àtòjọ àwọn ànímọ́ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘likewise’ ní Yorùbá.
- source_word: σεμνάς
  choice: ẹni ọlọ́wọ̀
  rationale: Ó ṣàfihàn ìwà tó ní iyì, tó yẹ fún ọ̀wọ̀, tí kò sì fẹ́rẹ̀ẹ́ dà bí èdè àtijọ́.
- source_word: μὴ διαβόλους
  choice: kí wọ́n má ṣe jẹ́ afìbínúni
  rationale: Níbí, διάβολος ń tọ́ka sí ẹni tó ń fi ọ̀rọ̀ èké tàbí ọ̀rọ̀ burúkú ba ẹlòmíràn jẹ́, kì í ṣe orúkọ oyè Èṣù.
- source_word: νηφαλίους
  choice: kí wọ́n ní ìkóra-ẹni-níjàánu
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ mímúra tàbí jíjẹ́ ẹni tó ní ìṣàkóso lórí èrò àti ìwà rẹ̀; yíyan yìí sọ ànímọ́ ìwà náà ní kedere ní Yorùbá òde òní.
- source_word: πιστὰς
  choice: olóòótọ́
  rationale: Ó mú ìtumọ̀ ẹni tí a lè gbẹ́kẹ̀ lé àti ẹni tó dúró ṣinṣin jáde, láì fi dandan pinnu bóyá ìgbàgbọ́ nìkan ni a ń sọ.
- source_word: ἐν πᾶσιν
  choice: nínú ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbòòrò ti gbólóhùn Gíríìkì mọ́.
theological_decisions:
- issue: Ẹni tí γυναῖκας ń tọ́ka sí nínú àtòjọ àwọn ànímọ́
  choice: Àwọn obìnrin
  alternative: Àwọn aya
  rationale: γυναῖκας lè jẹ́ ‘àwọn obìnrin’ tàbí ‘àwọn aya.’ Nítorí kò sí ohun tó túmọ̀ sí ‘àwọn aya wọn’ nínú Gíríìkì, a kò fi ‘wọn’ kún un. Àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́, kí ìtumọ̀ má bàa dá àríyànjiyàn nípa ipa iṣẹ́ ìjọ yìí parí láìní ẹ̀rí tó pé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo àtòjọ ‘kí wọ́n...’ láti jẹ́ kí àwọn ànímọ́ náà ṣàn dáadáa ní Yorùbá, a sì pa àìdánilójú nípa ‘obìnrin/aya’ mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
