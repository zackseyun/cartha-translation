id: 1TI.3.7
reference: 1 Timothy 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: yo
  text: Ó sì tún gbọ́dọ̀ ní ẹ̀rí rere lọ́dọ̀ àwọn tí ó wà ní òde[a], kí ó má bàa ṣubú sínú ẹ̀gàn[b] àti ìdẹ̀kùn Èṣù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọ̀dọ̀ àwọn ará ìta.” Gbólóhùn náà ń tọ́ka sí àwọn tí kì í ṣe ara àwùjọ àwọn Kristẹni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sínú ìtìjú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìdẹ̀kùn ẹni tí ń banilórúkọ jẹ́,” bí a bá ka διάβολος ní ìtumọ̀ gbogbogbò rẹ̀; níbí, a lóye rẹ̀ sí “Èṣù.”
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: Ó fi dandan àti ojúṣe hàn nínú àwọn ohun tí a ń béèrè lọ́wọ́ alábòójútó.
- source_word: δὲ καὶ
  choice: sì tún
  rationale: Ó so ẹsẹ yìí mọ́ àkọsílẹ̀ tó ṣáájú, ó sì fi ohun míì kún àwọn ohun tí a béèrè.
- source_word: μαρτυρίαν καλὴν
  choice: ẹ̀rí rere
  rationale: Ó dúró sún mọ́ ìtumọ̀ ẹ̀rí tàbí ìjẹ́rìí rere láti ọ̀dọ̀ àwọn ẹlòmíràn, láì sọ ọ́ di òkìkí nìkan.
- source_word: ἔχειν
  choice: ní
  rationale: Ìtumọ̀ tààrà àti àdánidá fún níní ohun kan.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: lọ́dọ̀ àwọn tí ó wà níta
  rationale: Ó pa àwòrán àwọn ènìyàn tí ó wà níta mọ́, ìyẹn àwọn tí kì í ṣe ara àwùjọ àwọn onígbàgbọ́, láì fi ìtumọ̀ àlàyé náà sínú ọ̀rọ̀ pàtàkì.
- source_word: ἵνα μὴ
  choice: kí ó má bàa
  rationale: Ó sọ ète tàbí àbájáde tí a fẹ́ yẹra fún ní Yorùbá àdánidá.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: ṣubú sínú ẹ̀gàn
  rationale: Ó pa àwòrán ṣíṣubú sínú ẹ̀gàn tàbí ìtìjú gbangba mọ́.
- source_word: παγίδα
  choice: ìdẹ̀kùn
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún okùn tàbí ẹ̀rọ tí a fi ń mú ẹni tàbí ẹranko, ó sì pa àkàwé náà mọ́.
- source_word: τοῦ διαβόλου
  choice: Èṣù
  rationale: Nínú àyíká Majẹmu Tuntun, διάβολος níbí ṣeé lóye jù lọ gẹ́gẹ́ bí ẹni ibi náà, Èṣù; ìkọ̀wé orúkọ náà fi ẹni pàtó hàn.
theological_decisions:
- issue: Ìtumọ̀ τοῦ διαβόλου
  choice: Èṣù gẹ́gẹ́ bí Satani, nítorí náà “ìdẹ̀kùn Èṣù”
  alternative: “ìdẹ̀kùn af̀ọ̀rọ̀-èké” tàbí ìdẹ̀kùn ẹni tí ń banilórúkọ jẹ́
  rationale: Bí ó tilẹ̀ jẹ́ pé διάβολος lè túmọ̀ sí af̀ọ̀rọ̀-èké, lílò rẹ̀ nínú àwọn lẹ́tà Pọ́ọ̀lù àti Majẹmu Tuntun lápapọ̀ sábà ń tọ́ka sí Èṣù. Síbẹ̀, àlàyé ìsàlẹ̀ pa àṣàyàn ọ̀rọ̀ gbogbogbò náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. “Ó” ń tọ́ka sí alábòójútó tí àyíká ẹsẹ ṣáájú sọ̀rọ̀ nípa rẹ̀. A yan “ẹ̀rí rere” láti dúró sún mọ́ èdè orísun, nígbà tí “lọ́dọ̀” mú ìbáṣepọ̀ pẹ̀lú àwọn olùjẹ́rìí náà ṣe kedere ní Yorùbá.
