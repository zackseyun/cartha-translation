  - marker: b
    text: Tàbí, “kí ó má ṣe jẹ́ ẹni tí ń lu ènìyàn,” èyí tí ó tẹnu mọ́ ìkọlù ara.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹni tí kì í ṣe oníjà” tàbí “ẹni tí kì í ṣe alágbọ́n-jà.”
