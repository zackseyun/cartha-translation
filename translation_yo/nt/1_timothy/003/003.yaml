lexical_decisions:
- source_word: πάροινον
  choice: ẹni tí ó ti ara rẹ̀ fún ọtí líle
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ẹni tí mímu ọtí ti di àṣà tàbí ìfẹ́ tí ń ṣàkóso rẹ̀; gbólóhùn yìí sọ ìwà tí ó ti fìdí múlẹ̀, kì í ṣe mímu lẹ́ẹ̀kan ṣoṣo.
- source_word: πλήκτην
  choice: oníwà ipá
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan lè jẹ́ ẹni tí ń lu ènìyàn, ‘oníwà ipá’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bo ìwà ìkọlù àti lílo agbára sí ẹlòmíràn.
- source_word: ἐπιεικῆ
  choice: onínú tútù
  rationale: Ó mú ìtumọ̀ ìwà pẹ̀lẹ́, ìfaradà àti ṣíṣe ohun tó yẹ láì le koko jáde ní èdè Yorùbá tó ṣe déédé.
- source_word: ἄμαχον
  choice: alálàáfíà
  rationale: Ó ṣàfihàn ẹni tí kì í fẹ́ ìjà tàbí àríyànjiyàn; ìtumọ̀ rere yìí bá àtòjọ àwọn ànímọ́ mu.
- source_word: ἀφιλάργυρον
  choice: ẹni tí kò ní ìfẹ́ owó
  rationale: 'Ó pa àkópọ̀ ọ̀rọ̀ Gíríìkì mọ́ ní tààràtà: ẹni tí kì í ṣe olùfẹ́ owó, nípa bẹ́ẹ̀ ó tẹnu mọ́ ìfẹ́ inú ju ìwà ojúkòkòrò nìkan lọ.'
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó bójú mu, tó sì ní iyì ni a lò. Ìṣètò ‘kí ó má ṣe… ṣùgbọ́n kí ó jẹ́…’ bá àtòjọ àwọn ànímọ́ alábòójútó nínú àyíká ọ̀rọ̀ mu. A lò ‘ọtí líle’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ọtí amúnisìn, láì sọ pé gbogbo lílo ọtí ni ọ̀rọ̀ Gíríìkì náà ń kọ̀.
