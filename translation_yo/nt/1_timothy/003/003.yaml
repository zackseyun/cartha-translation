translation:
  language: yo
  text: kí ó má ṣe jẹ́ ọ̀mùtí[a], kí ó má ṣe jẹ́ oníwà ipá[b], ṣùgbọ́n kí ó jẹ́ ẹni oníwà pẹ̀lẹ́, alálàáfíà[c], ẹni tí kò ní ìfẹ́ owó[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó má ṣe jẹ́ ẹni tí ó fi ara rẹ̀ fún wáìnì.”
