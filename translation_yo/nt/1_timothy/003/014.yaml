lexical_decisions:
- source_word: Ταῦτά
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ atọ́ka ọ̀pọ̀ nọ́ńbà náà tọ́ka sí àkójọpọ̀ àwọn ìtọ́ni tí ó ṣáájú; yíyan yìí pa ọ̀pọ̀ nọ́ńbà rẹ̀ mọ́.
- source_word: σοι
  choice: sí ọ
  rationale: Dátífù pẹ̀lú γράφω ní ọ̀rọ̀ lẹ́tà túmọ̀ sí ẹni tí a ń kọ̀wé sí.
- source_word: γράφω
  choice: Mo ń kọ
  rationale: Àkókò ìsinsìnyí ní ọ̀rọ̀ lẹ́tà ni a fi hàn lọ́nà àdánidá pẹ̀lú àmì ìṣe tí ń lọ lọ́wọ́.
- source_word: ἐλπίζων
  choice: mo sì ń retí
  rationale: Partisípọ̀ náà fi ìrètí tí ó bá ìṣe kíkọ̀wé lọ hàn, láì sọ ìrètí náà di ìdánilójú.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: láti tọ̀ ọ́ wá
  rationale: Gbólóhùn náà tọ́ka sí wíwá sí ọ̀dọ̀ ẹni tí a ń kọ̀wé sí; ‘tọ̀ ọ́ wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdarí sí ẹni náà.
- source_word: ἐν τάχει
  choice: láìpẹ́
  rationale: Nínú àyíká ọ̀rọ̀ lẹ́tà yìí, ọ̀rọ̀ náà lè túmọ̀ sí ‘láìpẹ́,’ bí ó tilẹ̀ jẹ́ pé ó tún lè tẹnu mọ́ yíyára.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti bá ìlò àdánidá mu. Èdè náà jẹ́ mímọ́gbọ́n-dání, ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì àlàyé [a] wà lẹ́yìn ‘láìpẹ́’ nítorí pé ἐν τάχει ni àlàyé náà kan.
