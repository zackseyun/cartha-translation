  to: Mo ń kọ àwọn nǹkan wọ̀nyí sí ọ, mo sì ń retí láti wá sọ́dọ̀ rẹ láìpẹ́,[a]
  rationale: A ti rọ́pò ọ̀rọ̀ ìrìnàjò náà pẹ̀lú ‘wá sọ́dọ̀ rẹ’ láti fi ἐλθεῖν πρὸς σέ hàn ní kedere àti ní Yorùbá àdánidá. A tún ṣàtúnṣe àṣàyàn kejì nínú àlàyé ìsàlẹ̀ kí ó sọ ‘in a short time’ ní tòótọ́. Àmì [a] ṣì wà lẹ́yìn ‘láìpẹ́,’ ibi tí ἐν τάχει wà.
