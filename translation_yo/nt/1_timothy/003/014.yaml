  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: yo
  text: Mo ń kọ àwọn nǹkan wọ̀nyí sí ọ, mo sì ń retí láti wá sọ́dọ̀ rẹ láìpẹ́,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní kíákíá” tàbí “ní àkókò kúkúrú.”
