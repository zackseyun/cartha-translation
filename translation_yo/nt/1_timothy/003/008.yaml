id: 1TI.3.8
reference: 1 Timothy 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: yo
  text: Bákan náà, àwọn díákónì gbọ́dọ̀ jẹ́ ẹni ọ̀wọ̀, kí wọ́n má ṣe jẹ́ aláhọ́n méjì[a], kí wọ́n má ṣe fi ara mọ́ ọtí wáìnì púpọ̀[b], kí wọ́n má sì ṣe jẹ́ olójúkòkòrò fún èrè àbùkù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n má ṣe sọ ohun kan fún ẹni kan, kí wọ́n sì sọ ohun mìíràn fún ẹlòmíràn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí wọ́n má ṣe di bárakú fún ọtí wáìnì púpọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí wọ́n má ṣe máa lépa èrè ẹ̀gàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: àwọn díákónì
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tó wà ní ipò iṣẹ́ ìjọ tí a dá mọ̀, ní ìbámu pẹ̀lú àkójọ ànímọ́ àwọn alábòójútó tó ṣáájú; yíyàn yìí kò fi ètò ẹ̀sìn ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà.
- source_word: ὡσαύτως
  choice: Bákan náà
  rationale: Ó so àkójọ yìí pọ̀ mọ́ ti àwọn alábòójútó tó ṣáájú, nígbà tó tún ń mú ẹgbẹ́ mìíràn wọlé.
- source_word: σεμνούς
  choice: jẹ́ ẹni ọ̀wọ̀
  rationale: Ó fi ìwà ọlá àti ìṣesí tó yẹ kí a bọ̀wọ̀ fún hàn, láìsọ pé ẹni náà gbọ́dọ̀ máa le koko tàbí máa banú jẹ́.
- source_word: μὴ διλόγους
  choice: kí wọ́n má ṣe jẹ́ aláhọ́n méjì
  rationale: Ó pa àwòrán èdè Gíríìkì mọ́, ó sì túmọ̀ sí sísọ ohun kan fún ẹni kan, kí ẹni náà sì sọ ohun mìíràn fún ẹlòmíràn ní ẹ̀tàn.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: kí wọ́n má ṣe fi ara mọ́ ọtí wáìnì púpọ̀
  rationale: ‘Fi ara mọ́’ ṣàfihàn ìfọkànsìn tàbí ìfarabalẹ̀ tó ń bá a lọ, ó sì pa πολλῷ, ‘púpọ̀,’ mọ́ láìfi èrò ìṣègùn òde òní kún un.
- source_word: μὴ αἰσχροκερδεῖς
  choice: kí wọ́n má sì ṣe jẹ́ olójúkòkòrò èrè àbùkù
  rationale: Ó sọ ìfẹ́kúfẹ̀ẹ́ sí èrè tí ọ̀nà rẹ̀ jẹ́ ohun ìtìjú tàbí àbùkù, ó sì pa agbára ìkìlọ̀ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ipò iṣẹ́ ìjọ fún διάκονος
  choice: àwọn díákónì, gẹ́gẹ́ bí orúkọ ipò iṣẹ́ ìjọ
  alternative: àwọn ìránṣẹ́ tàbí àwọn òjíṣẹ́
  rationale: Àyíká náà jẹ́ àkójọ ànímọ́ fún àwọn ipa tí ìjọ mọ̀—àwọn alábòójútó kọ́kọ́, lẹ́yìn náà àwọn díákónì. Èyí pa ìtumọ̀ ipò iṣẹ́ náà mọ́ láìgbé ètò ẹ̀sìn ọjọ́ iwájú wọ inú ẹsẹ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú ìṣesí ọ̀wọ̀, kedere, àti ti òde òní. ‘Díákónì’ jẹ́ ọ̀rọ̀ tí ọ̀pọ̀ ìjọ Yorùbá mọ̀ fún ipò yìí; ‘aláhọ́n méjì’ pa àwòrán ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ mú ìtumọ̀ rẹ̀ ṣe kedere.
