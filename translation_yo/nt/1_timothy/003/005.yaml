id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnì kan kò bá mọ bí ó ti lè ṣe àbójútó ilé tirẹ̀,[a] báwo ni yóò ṣe tọ́jú ìjọ Ọlọ́run?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “darí ilé tirẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ṣe ìtọ́jú ìjọ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ṣùgbọ́n bí
  rationale: Ó pa ipò àídájú εἰ mọ́, ó sì fi ìyàtọ̀ kékeré tí δέ mú wá hàn ní Yorùbá àdánidá.
- source_word: τις
  choice: ẹnì kan
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́ni-pàtó ni; “ẹnì kan” jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi ohun tí Gíríìkì kò sọ kún un.
- source_word: τοῦ ἰδίου οἴκου
  choice: agbo ilé tirẹ̀
  rationale: Ní àyíká ọ̀rọ̀ yìí, οἶκος túmọ̀ sí àwọn ènìyàn àti ètò ilé ẹni, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan; “agbo ilé” gba ìtumọ̀ yẹn dáadáa.
- source_word: προστῆναι
  choice: ṣe àbójútó
  rationale: Ó sọ nípa dídarí àti ṣíṣe ojúṣe lórí agbo ilé láìjẹ́ kí ìtumọ̀ náà dà bí ìṣàkóso líle. Àlàyé ìsàlẹ̀ fi “darí” sílẹ̀ gẹ́gẹ́ bí ọ̀nà míì.
- source_word: οὐκ οἶδεν
  choice: kò bá mọ bí a ti ń
  rationale: οἶδα pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni sábà túmọ̀ sí mímọ bí a ṣe ń ṣe ohun kan; ìtumọ̀ yìí mú ìlò àsọyé náà hàn kedere.
- source_word: πῶς
  choice: báwo ni yóò ṣe
  rationale: Ó pa ìbéèrè ìrònú àti ìtọ́ka sí ohun ọjọ́ iwájú mọ́ láìfi àìlera tàbí àìlèṣe kún ọ̀rọ̀ náà.
- source_word: ἐκκλησίας θεοῦ
  choice: ìjọ Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn ohun-ìní náà, ó sì bá ìtumọ̀ ἐκκλησία nínú àyíká ìjọ mu.
- source_word: ἐπιμελήσεται
  choice: yóò ṣe tọ́jú
  rationale: ἐπιμελέομαι tẹnumọ́ ìtọju pẹ̀lú àníyàn àti ojúṣe, kì í ṣe ìṣàkóso nìkan; “tọ́jú” sọ ìtumọ̀ yẹn ní ṣókí àti ní àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín dídarí agbo ilé àti àbójútó ìjọ
  choice: Lo “ṣe àbójútó agbo ilé tirẹ̀” ní apá àkọ́kọ́, kí a sì lo “tọ́jú ìjọ Ọlọ́run” ní apá kejì.
  alternative: Lo “darí” ní apá méjèèjì, tàbí “ṣàkóso” fún agbo ilé.
  rationale: Gíríìkì lo ọ̀rọ̀-ìṣe méjì ọ̀tọ̀, προΐστημι àti ἐπιμελέομαι. Pípa ìyàtọ̀ wọn mọ́ kò jẹ́ kí àbójútó ìjọ di ìṣàkóso lásán, kò sì gbé èrò ẹ̀sìn ẹgbẹ́ kan wọ inú ẹsẹ náà.
- issue: Ìṣàfihàn akọ tàbí abo fún τις
  choice: Lo “ẹnì kan” àti ìṣètò gírámà Yorùbá tí kò fi akọ tàbí abo hàn.
  alternative: Fi “ọkùnrin kan” sí ọ̀rọ̀ náà ní tààrà.
  rationale: τις jẹ́ aláìlẹ́ni-pàtó. Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni kẹta; “ẹnì kan” pa àìlẹ́ni-pàtó orísun mọ́, nígbà tí àyíká àwọn ẹsẹ tó yí i ká ṣì ń ṣàlàyé ẹni tí a ń gbé yẹ̀ wò fún iṣẹ́ alábòójútó.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Agbo ilé” jẹ́ kíkún ju “ilé” lọ nítorí pé ó tọ́ka sí gbogbo àwọn ènìyàn àti ètò inú ilé. A fi àmì àlàyé méjèèjì sí ibi tí wọ́n bá ọ̀rọ̀ inú ẹsẹ mu.
