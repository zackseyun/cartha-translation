id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: yo
  text: Nítorí náà, alábòójútó gbọ́dọ̀ jẹ́ ẹni tí a kò lè fi ẹ̀sùn tí ó ní ìdí kàn, ọkọ aya kan[a], ẹni tí ó ní ìkóra-ẹni-níjàánu, tí ó ní làákàyè, tí ìwà rẹ̀ bójú mu, tí ó máa ń gba àlejò, tí ó sì lágbára láti kọ́ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin tí ó jẹ́ olóòótọ́ sí obìnrin kan.” Gbólóhùn náà lè tẹnumọ́ ìṣòtítọ́ nínú ìgbéyàwó, kì í ṣe ipò ìgbéyàwó nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: ó pọndandan kí
  rationale: Ó fi hàn pé ohun náà jẹ́ dandan, kì í ṣe ìmọ̀ràn lásán.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa ìsopọ̀ ìrònú pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
- source_word: ἐπίσκοπον
  choice: alábòójútó
  rationale: Ó tú orúkọ ipò náà nípa iṣẹ́ rẹ̀ láì fi ọ̀rọ̀ ẹ̀sìn ìgbà tó tẹ̀ lé e kún un.
- source_word: ἀνεπίλημπτον
  choice: ẹni tí kò sí ẹ̀sùn tí ó lẹ́sẹ̀ nílẹ̀ sí
  rationale: Ó túmọ̀ sí ẹni tí a kò lè fi ẹ̀sùn tó fẹsẹ̀ múlẹ̀ kàn, láì sọ pé ẹni náà kò ní ẹ̀ṣẹ̀ rárá.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: ọkọ aya kanṣoṣo
  rationale: Ó tẹ̀ lé gbólóhùn Gíríìkì ní kíkún, ó sì pa ọ̀rọ̀ akọ rẹ̀ mọ́ láì pinnu gbogbo ìtumọ̀ rẹ̀.
- source_word: νηφάλιον
  choice: ẹni tí ó ní ìkóra-ẹni-níjàánu
  rationale: Nínú àkójọ ìwà rere yìí, ọ̀rọ̀ náà ń tọ́ka sí ìṣọ́ra àti ìjánu nínú èrò àti ìṣe, kì í ṣe àìmu ọtí nìkan.
- source_word: σώφρονα
  choice: tí ó ní làákàyè
  rationale: Ó fi ìdájọ́ rere àti ìwà ọlọ́gbọ́n hàn, ó sì yà á díẹ̀ sí νηφάλιον.
- source_word: κόσμιον
  choice: tí ìwà rẹ̀ bójú mu
  rationale: Ó ṣàfihàn ìwà tó létò, tó yẹ, tí àwọn ènìyàn sì lè bọ̀wọ̀ fún ní èdè Yorùbá àdánidá.
- source_word: φιλόξενον
  choice: tí ó máa ń gba àlejò
  rationale: Ó sọ ìfẹ́ láti tẹ́wọ́ gba àlejò tàbí àjèjì ní ọ̀nà tí ó ṣe kedere.
- source_word: διδακτικόν
  choice: tí ó lágbára láti kọ́ni
  rationale: Ó sọ agbára àti ìjáfáfá láti kọ́ àwọn ẹlòmíràn, kì í ṣe ìfẹ́ láti kọ́ni nìkan.
theological_decisions:
- issue: Ìtumọ̀ μιᾶς γυναικὸς ἄνδρα nínú àwọn ànímọ́ alábòójútó
  choice: ọkọ aya kanṣoṣo
  alternative: ọkùnrin tí ó jẹ́ olóòótọ́ sí obìnrin kan
  rationale: Gbólóhùn náà lè tẹnumọ́ ìṣòtítọ́ nínú ìgbéyàwó, lè tako fífẹ́ aya púpọ̀, tàbí kí ó ní ìtumọ̀ míì nípa àtúnṣe ìgbéyàwó. Ìtumọ̀ pàtàkì náà dúró sún mọ́ ọ̀rọ̀ Gíríìkì, àlàyé ìsàlẹ̀ sì pa àìdánilójú náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àtúnṣe gbólóhùn díẹ̀ láti jẹ́ kí àkójọ àwọn ànímọ́ náà ṣàn dáadáa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ.
