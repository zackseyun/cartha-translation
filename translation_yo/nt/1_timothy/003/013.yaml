id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: yo
  text: Nítorí àwọn tí wọ́n ti ṣe iṣẹ́ ìránṣẹ́ dáradára ń jèrè ipò rere fún ara wọn àti ìgboyà púpọ̀[a] nínú ìgbàgbọ́ nínú Mèsáyà[c] Jésù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbẹ́kẹ̀lé púpọ̀”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgboyà, ìgbẹ́kẹ̀lé, tàbí sísọ̀rọ̀ láìfipamọ́.
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níhìn-ín nítorí pé ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: tí wọ́n ti ṣe iṣẹ́ ìránṣẹ́
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ṣíṣe ìránṣẹ́ tàbí iṣẹ́ òjíṣẹ́. Yíyan gbólóhùn yìí pa ìtumọ̀ iṣẹ́-ìránṣẹ́ mọ́ láìfi orúkọ ipò ‘díákónì’ kún ọ̀rọ̀-ìṣe náà, bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ náà ń sọ̀rọ̀ nípa wọn.
- source_word: καλῶς
  choice: dáradára
  rationale: Ó jẹ́ ọ̀rọ̀ tí ń ṣàlàyé bí wọ́n ṣe ṣe iṣẹ́ ìránṣẹ́; ‘dáradára’ jẹ́ èdè Yorùbá àdánidá tí ó sì mú ìtumọ̀ ‘well’ jáde.
- source_word: βαθμὸν ... καλὸν
  choice: ipò rere
  rationale: βαθμός lè túmọ̀ sí ìgbésẹ̀, ipò, tàbí ìdúró ẹni. Níhìn-ín ó jẹ́ àkàwé fún ipò rere tí iṣẹ́ ìránṣẹ́ olóòtítọ́ ń mú wá, kì í ṣe dandan ipò àṣẹ nínú ìjọ.
- source_word: περιποιοῦνται
  choice: ń jèrè ... fún ara wọn
  rationale: Ìhà àárín ọ̀rọ̀-ìṣe Gíríìkì náà ní agbára ìtọ́ka-padà; ‘fún ara wọn’ fi hàn pé àwọn olùṣe iṣẹ́ náà ló ń rí èrè yìí gbà.
- source_word: παρρησίαν
  choice: ìgboyà
  rationale: Ọ̀rọ̀ náà lè sọ ìgboyà, ìgbẹ́kẹ̀lé, tàbí òmìnira láti sọ̀rọ̀ ní gbangba. ‘Ìgboyà’ pa agbára ọ̀rọ̀ náà mọ́ nínú àyíká yìí.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tó bá àyíká náà mu, ṣùgbọ́n a pa ìtumọ̀ míì, ‘ìṣòtítọ́,’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: tí ó wà nínú Mèsáyà Jésù
  rationale: Gbólóhùn yìí pa ìṣètò Gíríìkì mọ́, níbi tí gbólóhùn elérò-orúkọ náà ti ń ṣàlàyé ‘ìgbàgbọ́,’ láìsọ ìbáṣepọ̀ náà di ohun tó ṣe pàtó ju orísun lọ.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; ‘Mèsáyà’ mú ìtumọ̀ oyè ẹni àmì-òróró náà jáde dípò kí a lò ó bí orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: Àyíká náà lè tọ́ka sí ìgbàgbọ́ tí ó dá lórí Mèsáyà Jésù, ṣùgbọ́n πίστις tún lè ní ìtumọ̀ ìṣòtítọ́. A lo ‘ìgbàgbọ́’ nínú ọ̀rọ̀ pàtàkì, a sì fi èkejì sínú àlàyé láìyanjú àìdánilójú náà ní ipa.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. ‘Ṣe iṣẹ́ ìránṣẹ́’ yẹra fún fífi oyè ìjọ sínú ọ̀rọ̀-ìṣe, ‘ipò rere’ sì pa àkàwé βαθμός mọ́ láìsọ ọ́ di ipò àṣẹ pàtó.
