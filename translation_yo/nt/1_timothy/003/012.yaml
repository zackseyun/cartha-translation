id: 1TI.3.12
reference: 1 Timothy 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: yo
  text: Kí àwọn díákónì jẹ́ ọkọ aya kan[a], kí wọ́n sì máa darí àwọn ọmọ wọn àti àwọn ilé tiwọn dáadáa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọkùnrin aya kan.” Gbólóhùn náà lè tẹnu mọ́ ìṣòtítọ́ nínú ìgbéyàwó; àwọn kan sì gbà pé ó ń sọ ní pàtó pé kí ẹni náà má ṣe ní aya púpọ̀ tàbí kí ó má ṣe tún ṣe ìgbéyàwó.
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: àwọn díákónì
  rationale: Nínú àyíká ìlànà fún iṣẹ́ ìjọ yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tó wà ní ipò iṣẹ́ tí a mọ̀ sí díákónì, kì í ṣe ìránṣẹ́ lásán.
- source_word: ἔστωσαν
  choice: Kí ... jẹ́
  rationale: Ìsọ̀rọ̀ àṣẹ yìí fi ojúṣe tí ó yẹ hàn ní Yoruba àdánidá láì sọ ọ́ di àṣẹ líle ju ti Gíríìkì lọ.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: ọkọ aya kan
  rationale: Ìtumọ̀ yìí sún mọ́ ìṣètò ọ̀rọ̀ Gíríìkì, ó sì pa àìdánilójú rẹ̀ mọ́ láàárín ìṣòtítọ́ nínú ìgbéyàwó, aya kan ṣoṣo, àti àwọn òye mìíràn.
- source_word: τέκνων
  choice: àwọn ọmọ wọn
  rationale: A fi arọ́pò-orúkọ ohun-ìní náà hàn gẹ́gẹ́ bí Yoruba àdánidá, ní ìbámu pẹ̀lú agbo ilé tiwọn.
- source_word: καλῶς
  choice: dáadáa
  rationale: Èyí ni ọ̀nà Yoruba tó rọrùn, tó sì ṣe kedere fún bí wọ́n ṣe ń darí.
- source_word: προϊστάμενοι
  choice: máa darí
  rationale: Ọ̀rọ̀ yìí sọ nípa ṣíṣe aṣáájú àti bójú tó àwọn tó wà lábẹ́ ojúṣe ẹni; ‘darí’ bá àyíká agbo ilé mu láì dun bí ìṣàkóso aláṣẹ líle.
- source_word: τῶν ἰδίων οἴκων
  choice: agbo ilé tiwọn
  rationale: οἶκος níbí kọjá ilé gẹ́gẹ́ bí ilé gbígbé; ó ní gbogbo àwọn tó jẹ́ ara agbo ilé nínú.
theological_decisions:
- issue: Ìtumọ̀ μιᾶς γυναικὸς ἄνδρες nínú àwọn ànímọ́ fún ipò iṣẹ́ ìjọ
  choice: ọkọ aya kan
  alternative: ọkùnrin tí ó jẹ́ olóòtítọ́ sí aya rẹ̀; ọkùnrin tí ó fẹ́ ẹnì kan ṣoṣo rí; ọkùnrin aya kan
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì lè jẹ́ àkànlò èdè. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ pa àwọn òye pàtàkì mọ́ láì fi èrò ẹ̀sìn ẹgbẹ́ kan mú un.
translation_notes:
  register: Yoruba ìgbàlódé, ọ̀wọ̀, tó ṣe kedere fún òǹkàwé lásán. A lo ‘díákónì’ gẹ́gẹ́ bí orúkọ ipò iṣẹ́ ìjọ tí ó ti wọ́pọ̀; ‘agbo ilé’ sì pa ìtumọ̀ àwùjọ àti ẹbí inú οἶκος mọ́.
