source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: yo
  text: 'Ọ̀rọ̀ yìí ṣeé gbẹ́kẹ̀lé: bí ẹnikẹ́ni bá ń lépa iṣẹ́ àbójútó[a], iṣẹ́ rere ni ó ń fẹ́[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ipò alábòójútó”; ní ìtumọ̀ ìbílẹ̀, “ipò bíṣọ́ọ̀bù.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “iṣẹ́ ọlọ́lá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Ọ̀rọ̀ yìí ṣe é gbẹ́kẹ̀ lé
  rationale: Ó mú ọ̀nà àsọyé Gíríìkì tí ń fi ọ̀rọ̀ kan hàn gẹ́gẹ́ bí ohun tí ó ṣeé gbára lé jáde ní Yorùbá adayébá.
- source_word: εἴ τις
  choice: bí ẹnikẹ́ni bá
  rationale: τις jẹ́ ọ̀rọ̀ arọ́pò-orúkọ àìnípàtó; ‘ẹnikẹ́ni’ kò fi akọ tàbí abo kún ohun tí Gíríìkì sọ.
- source_word: ἐπισκοπῆς
  choice: iṣẹ́ àbójútó
  rationale: Yíyan yìí pa ìtumọ̀ àbójútó tàbí ojúṣe alábòójútó mọ́, láìfi ètò ipò ṣọ́ọ̀ṣì ti àkókò tí ó tẹ̀ lé e sínú ẹsẹ náà.
- source_word: ὀρέγεται
  choice: ń lépa
  rationale: Ó fi ìrònú títẹ̀ síwájú sí ohun kan tàbí fífẹ́ dé ipò rẹ̀ hàn lọ́nà Yorùbá adayébá.
- source_word: καλοῦ ἔργου
  choice: iṣẹ́ rere
  rationale: Ó dúró sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì tẹnumọ́ pé iṣẹ́ ni, kì í ṣe oyè tàbí ọlá lásán.
- source_word: ἐπιθυμεῖ
  choice: ń fẹ́
  rationale: Ó sọ ìfẹ́ tàbí ìfẹ́-ọkàn rere nínú àyíká yìí ní ṣókí, láìmú agbára ọ̀rọ̀ náà pọ̀ ju ti Gíríìkì lọ.
theological_decisions:
- issue: Bóyá kí ἐπισκοπῆς di ọ̀rọ̀ oyè ṣọ́ọ̀ṣì ti ìgbà tó tẹ̀ lé e
  choice: iṣẹ́ àbójútó
  alternative: ipò alábòójútó; ipò bíṣọ́ọ̀bù
  rationale: ‘Iṣẹ́ àbójútó’ pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ ìpilẹ̀ mọ́, ó sì yàgò fún fífi ètò ìjọ ẹ̀ya kan tàbí oyè ṣọ́ọ̀ṣì tí ó ti fẹsẹ̀ mú nígbà tó tẹ̀ lé e sínú ẹsẹ náà.
- issue: Bóyá kí τις jẹ́ akọ ní pàtó
  choice: ẹnikẹ́ni
  alternative: ọkùnrin kan
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ àìnípàtó ní gbólóhùn yìí; ‘ẹnikẹ́ni’ kò pinnu akọ tàbí abo láti inú ọ̀rọ̀ náà nìkan.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Iṣẹ́ àbójútó’ jẹ́ adayébá, ó sì yẹra fún èdè ẹ̀ya ìjọ kan. Ìtẹ̀lé ὀρέγεται àti ἐπιθυμεῖ ni a mú jáde pẹ̀lú ‘ń lépa’ àti ‘ń fẹ́.’
