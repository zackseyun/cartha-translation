review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence of prior testing followed by service. However, “aláìlẹ́gàn” does not naturally convey ἀνέγκλητοι (“not open to valid accusation / beyond reproach”) and should be replaced. Recasting the final participial phrase as a Yoruba conditional is acceptable and retains the qualification sense without suggesting sinlessness.
  naturalness: “Kí a kọ́kọ́ dán àwọn wọ̀nyí náà wò” is more natural and immediately clear than the marked construction “Àwọn wọ̀nyí pẹ̀lú ni kí a kọ́kọ́ dán wò.” “Kí wọ́n ṣe iṣẹ́ ìránṣẹ́” is an idiomatic rendering of the verbal διακονείτωσαν without inserting the office title into the text.
  terminology: “Iṣẹ́ ìránṣẹ́” appropriately renders the service verb in this context while the footnote supplies the office-specific alternative. “Aláìní ẹ̀sùn” is a clear modern Yoruba expression for being beyond valid accusation; the note properly guards against an implication of sinlessness.
  issues:
  - severity: medium
    issue: “Aláìlẹ́gàn” is not an accurate or natural rendering of ἀνέγκλητοι.
    rationale: The Greek describes persons against whom no valid accusation can be brought. “Lẹ́gàn” relates to despising, insulting, or treating contemptuously, rather than to being unaccused or beyond reproach.
  - severity: low
    issue: The opening wording is unnecessarily marked and leaves the object of “dán wò” implicit.
    rationale: Moving “àwọn wọ̀nyí náà” into the object position makes the passive-testing imperative explicit and more natural in Standard Yoruba.
  revised_text: Kí a kọ́kọ́ dán àwọn wọ̀nyí náà wò; lẹ́yìn náà, kí wọ́n ṣe iṣẹ́ ìránṣẹ́[a], bí wọ́n bá jẹ́ aláìní ẹ̀sùn[b].
