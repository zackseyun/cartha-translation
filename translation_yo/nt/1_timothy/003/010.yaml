revisions:
- from: Àwọn wọ̀nyí pẹ̀lú ni kí a kọ́kọ́ dán wò; lẹ́yìn náà, kí wọn máa ṣe iṣẹ́ ìránṣẹ́[a], bí wọn bá jẹ́ aláìlẹ́gàn[b].
  to: Kí a kọ́kọ́ dán àwọn wọ̀nyí náà wò; lẹ́yìn náà, kí wọ́n ṣe iṣẹ́ ìránṣẹ́[a], bí wọ́n bá jẹ́ aláìní ẹ̀sùn[b].
  rationale: The revision replaces an inaccurate descriptor with “aláìní ẹ̀sùn,” which faithfully communicates qualified irreproachability. It also makes the object of testing explicit and smooths the imperative sequence, while retaining the Greek’s generic service verb and its contextual diaconal association only in the footnote.
