base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: yo
  text: Kí a kọ́kọ́ dán àwọn wọ̀nyí náà wò; lẹ́yìn náà, kí wọ́n ṣe iṣẹ́ ìránṣẹ́[a], bí wọ́n bá jẹ́ aláìní ẹ̀sùn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n máa sìn gẹ́gẹ́ bí díákónì.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “láti sìn,” ṣùgbọ́n níbí, àyíká ọ̀rọ̀ jẹ́ ti àwọn ànímọ́ tí díákónì gbọ́dọ̀ ní.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, kò sí ẹ̀sùn tí ó lẹ́sẹ̀ nílẹ̀ tí a lè fi kàn wọ́n; kì í ṣe pé wọn kò ní ẹ̀ṣẹ̀ rárá.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὗτοι
  choice: àwọn wọ̀nyí pẹ̀lú
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò aṣọ́ka náà mọ́, ó sì fi hàn pé ẹgbẹ́ yìí náà wà lára àwọn tí ìlànà náà kan.
- source_word: δοκιμαζέσθωσαν πρῶτον
  choice: kí a kọ́kọ́ dán wò
  rationale: Ó sọ àṣẹ láti yẹ̀ wọ́n wò láti mọ bóyá wọ́n yẹ fún iṣẹ́ náà, ó sì pa ìtẹ̀lé àkókò tí πρῶτον fi hàn mọ́.
- source_word: εἶτα
  choice: lẹ́yìn náà
  rationale: Ó fi ìgbésẹ̀ tó tẹ̀ lé ìdánwò hàn ní kedere.
- source_word: διακονείτωσαν
  choice: kí wọn máa ṣe iṣẹ́ ìránṣẹ́
  rationale: Ó pa ìtumọ̀ ìṣe náà, ‘láti ṣe iṣẹ́ ìránṣẹ́,’ mọ́; àyíká ọ̀rọ̀ sì fi hàn pé iṣẹ́ díákónì ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ἀνέγκλητοι ὄντες
  choice: bí wọn bá jẹ́ aláìlẹ́gàn
  rationale: Ó mú ọ̀rọ̀ náà jáde gẹ́gẹ́ bí ànímọ́ tí ó yẹ kí wọn ní kí wọ́n tó ṣiṣẹ́, láìsọ pé wọn kò ní ẹ̀ṣẹ̀ rárá.
theological_decisions:
- issue: Bóyá διακονείτωσαν yẹ kí ó jẹ́ iṣẹ́ ìránṣẹ́ lápapọ̀ tàbí iṣẹ́ díákónì ní pàtó
  choice: kí wọn máa ṣe iṣẹ́ ìránṣẹ́
  alternative: kí wọn máa sìn gẹ́gẹ́ bí díákónì
  rationale: Gíríìkì lo ọ̀rọ̀ ìṣe ‘sìn/ṣe iṣẹ́ ìránṣẹ́’ láì tún orúkọ oyè díákónì sọ nínú gbólóhùn yìí. Ìtumọ̀ àkọ́kọ́ pa ìṣòro yìí mọ́, nígbà tí àlàyé ìsàlẹ̀ fi agbára àyíká ọ̀rọ̀ hàn.
- issue: Bóyá ἀνέγκλητοι túmọ̀ sí pé wọn kò lẹ́ṣẹ̀ rárá
  choice: aláìlẹ́gàn
  alternative: ẹni tí a kò lè fi ẹ̀sùn tí ó lẹ́sẹ̀ nílẹ̀ kàn
  rationale: Nínú àkójọ ànímọ́ fún olórí ìjọ, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí kò sí ẹ̀sùn tó fẹsẹ̀ múlẹ̀ sí i, kì í ṣe ẹni tí kò dẹ́ṣẹ̀ rí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbàlódé ni a lò. “Kí a kọ́kọ́ dán wò” jẹ́ ọ̀nà àdánidá láti sọ àṣẹ aláìṣe pàtó nínú Gíríìkì; “ṣe iṣẹ́ ìránṣẹ́” yàgò fún mímú oyè ìjọ kan wọ inú ọ̀rọ̀ níbi tí Gíríìkì ti lo ọ̀rọ̀ ìṣe nìkan.
