  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: νεόφυτον ni a gbà gẹ́gẹ́ bí ẹni tuntun nínú ìgbàgbọ́, ἐμπέσῃ sì jẹ́ ‘ṣubú sínú.’ Àmọ́ ‘ìgbéraga má bà á wú’ kò ṣàfihàn τυφωθείς ní kedere tàbí ní ọ̀nà Yorùbá tí ó rọrùn jù; a tún un ṣe sí ‘di agbéraga.’ ‘Ìdájọ́ Èṣù’ pa àìdánilójú genitive τοῦ διαβόλου mọ́.'
