  to: Kí ó má ṣe jẹ́ ẹni tí ó ṣẹ̀ṣẹ̀ di onígbàgbọ́,[a] kí ó má bàa di agbéraga, kí ó sì ṣubú sínú ìdájọ́ Èṣù.
