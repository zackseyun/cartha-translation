id: 1TI.3.6
reference: 1 Timothy 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: yo
  text: Kí ó má ṣe jẹ́ ẹni tí ó ṣẹ̀ṣẹ̀ di onígbàgbọ́,[a] kí ó má bàa di agbéraga, kí ó sì ṣubú sínú ìdájọ́ Èṣù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ẹni tí a ṣẹ̀ṣẹ̀ gbìn.”
    reason: Ìtumọ̀ àkàwé ọ̀rọ̀ Gíríìkì νεόφυτον.
lexical_decisions:
- source_word: νεόφυτον
  choice: ẹni tí ó ṣẹ̀ṣẹ̀ gba ìgbàgbọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí ‘ẹni tí a ṣẹ̀ṣẹ̀ gbìn,’ ṣùgbọ́n ní àkópọ̀ ọ̀rọ̀ yìí ó ń tọ́ka sí ẹni tí ó ṣẹ̀ṣẹ̀ di onígbàgbọ́; yíyan yìí ṣe kedere ní Yorùbá òde òní.
- source_word: τυφωθεὶς
  choice: ìgbéraga má bà á wú
  rationale: Èyí pa àwòrán jíjẹ́ kí ìgbéraga mú ẹni wú mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìkìlọ̀ ní Yorùbá.
- source_word: κρίμα
  choice: ìdájọ́
  rationale: ‘Ìdájọ́’ gbòòrò ju ‘ìdálẹ́bi’ lọ, ó sì pa àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τοῦ διαβόλου
  choice: Èṣù
  rationale: Àkópọ̀ ‘ìdájọ́ Èṣù’ kò pinnu bóyá ó jẹ́ ìdájọ́ tí Èṣù fúnra rẹ̀ gba tàbí ìdájọ́ tí ó ní í ṣe pẹ̀lú Èṣù.
- source_word: ἐμπέσῃ
  choice: ṣubú sínú
  rationale: Ó pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἵνα μὴ
  choice: kí ... má
  rationale: Ìṣètò yìí fi ète tàbí àbájáde tí a fẹ́ yẹra fún hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: ṣubú sínú ìdájọ́ Èṣù
  alternative: ṣubú sínú ìdálẹ́bi kan náà bí Èṣù; tàbí wá sábẹ́ ìdájọ́ tí ó ní í ṣe pẹ̀lú Èṣù
  rationale: Genitive Gíríìkì τοῦ διαβόλου lè tọ́ka sí ìdájọ́ tí Èṣù gba tàbí sí ìdájọ́ tí ó ní ìbáṣepọ̀ pẹ̀lú rẹ̀. Ọ̀rọ̀ inú ẹsẹ̀ pa àìdánilójú yìí mọ́ dípò kí ó fi ẹ̀kọ́ kan múlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘Èṣù’ fún διάβολος, a sì pa àìdánilójú genitive mọ́ nínú ‘ìdájọ́ Èṣù.’
