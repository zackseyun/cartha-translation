id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: yo
  text: 'Àti pé, láìsí àní-àní, àṣírí ìfọkànsìn Ọlọ́run tóbi:


    Ẹni náà[a] ni a fi hàn nínú ara,


    a dá a láre nínú ẹ̀mí[b],


    àwọn áńgẹ́lì rí i,


    a kéde rẹ̀ láàárín àwọn orílẹ̀-èdè[c],


    a gbà á gbọ́ káàkiri ayé,


    a sì gbé e sókè nínú ògo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, “Ọlọ́run ni a fi hàn nínú ara,” dípò “ẹni tí.” Ọ̀rọ̀ Gíríìkì àríwísí náà ní “ẹni tí,” èyí tí ìtumọ̀ yìí tẹ̀ lé.
    reason: textual_variant
  - marker: b
    text: Ó tún lè jẹ́, “a dá a láre nípasẹ̀ Ẹ̀mí,” tàbí “a dá a láre nínú Ẹ̀mí.” Gbólóhùn Gíríìkì náà ṣókí, ó sì lè tọ́ka sí iṣẹ́ Ẹ̀mí Mímọ́ tàbí sí ipò ìgbésí ayé ẹ̀mí.
    reason: alternative_reading
  - marker: c
    text: Ó tún lè jẹ́, “a kéde rẹ̀ láàárín àwọn Kèfèrí.”
    reason: lexical_alternative
  - marker: d
    text: Ó tún lè jẹ́, “a gbé e sókè sínú ògo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: láìsí àní-àní
  rationale: Ó sọ pé ohun tí ó tẹ̀ lé jẹ́ ohun tí a jẹ́wọ́ ní gbangba, tí kò sì yẹ fún àní-àní; gbólóhùn yìí jẹ́ Yorùbá òde òní tí ó ṣe kedere láìlo ọ̀rọ̀ àtijọ́.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: àṣírí ìfọkànsìn Ọlọ́run
  rationale: “Àṣírí” tọ́ka sí òtítọ́ Ọlọ́run tí ó ti fara sin ṣùgbọ́n tí a ṣí payá; “ìfọkànsìn Ọlọ́run” sọ ìtumọ̀ εὐσέβεια gẹ́gẹ́ bí ìgbésí ayé ìfọkànsìn, kì í ṣe ẹ̀sìn gẹ́gẹ́ bí ètò àwùjọ lásán.
- source_word: Ὃς
  choice: A fi í hàn
  rationale: Ọ̀nà àìsọ ẹni ní tààràtà yìí ń tọ́ka sí ẹni akọ tí orin ìjẹ́wọ́ náà ń sọ̀rọ̀ nípa rẹ̀, ó sì tẹ̀ lé kíkà Ὃς ti SBLGNT láìfi “Ọlọ́run” tí ó jẹ́ ẹ̀dà mìíràn sínú ọ̀rọ̀ pàtàkì.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: A fi í hàn nínú ẹran ara
  rationale: Ó pa ìṣe aláìṣe-taara náà àti ìtumọ̀ wíwá sí ìgbésí ayé ènìyàn nínú ara mọ́, ó sì bá ìrísí ewì àwọn ìlà tó tẹ̀ lé mu.
- source_word: ἐδικαιώθη
  choice: a dá a láre
  rationale: Ní àyíká yìí, gbólóhùn náà túmọ̀ sí pé a fi hàn tàbí kéde pé ó wà ní ẹ̀tọ́, kì í ṣe pé a sọ ẹni ẹlẹ́ṣẹ̀ di olódodo.
- source_word: ἐν πνεύματι
  choice: nípa ti ẹ̀mí
  rationale: Gbólóhùn Yorùbá yìí pa ṣókí àti àìdánilójú Gíríìkì mọ́ nípa bóyá Ẹ̀mí Mímọ́ ni olùṣe tàbí pé ẹ̀mí ni agbègbè/ipò tí ìdáláre náà wáyé.
- source_word: ὤφθη ἀγγέλοις
  choice: àwọn áńgẹ́lì rí i
  rationale: Ó pa ìtumọ̀ “a rí i” mọ́ ní Yorùbá àdánidá, ó sì ka ἀγγέλοις sí àwọn ẹ̀dá ọ̀run ní àyíká orin nípa Kristi.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: a kéde rẹ̀ láàárín àwọn orílẹ̀-èdè
  rationale: “Kéde” mú ìtumọ̀ ìpolongo ní gbangba jáde; “àwọn orílẹ̀-èdè” pa ìtumọ̀ gbooro ἔθνη mọ́, bó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí àwọn Kèfèrí.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: ayé gba a gbọ́
  rationale: Ó sọ ìdáhùn ìgbàgbọ́ sí ẹni náà ní ṣókí, nígbà tí “ayé” dúró fún àwọn ènìyàn inú ayé gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: a sì gbé e sókè nínú ògo
  rationale: Ó pa ìṣe aláìṣe-taara àti àìdánilójú ἐν mọ́; “nínú ògo” kò fipá pinnu bóyá ògo ni ọ̀nà, ipò, tàbí ibi tí a gbé e sí.
theological_decisions:
- issue: 'Ẹ̀dà ọ̀rọ̀ ní ìbẹ̀rẹ̀ orin: Ὃς, θεός, tàbí ὅ'
  choice: Tẹ̀ lé Ὃς tí SBLGNT ní, kí a sì tọ́ka sí ẹni akọ náà láìfi orúkọ “Ọlọ́run” kún ọ̀rọ̀ pàtàkì.
  alternative: “Ọlọ́run ni a fi hàn nínú ẹran ara” tàbí “èyí tí a fi hàn nínú ẹran ara.”
  rationale: Ẹ̀dà àríwísí tí a fi ṣe orísun ní Ὃς, “ẹni tí.” Àyíká náà jẹ́ ti Kristi, ṣùgbọ́n fífi “Ọlọ́run” sínú ọ̀rọ̀ pàtàkì yóò gba ẹ̀dà àfọwọ́kọ mìíràn dípò orísun tí a yàn. Àlàyé ìsàlẹ̀ ojú ìwé pa ẹ̀dà pàtàkì yẹn mọ́ fún akẹ́kọ̀ọ́.
- issue: Ohun tí ἐν πνεύματι ń tọ́ka sí
  choice: Lo “nípa ti ẹ̀mí” ní ọ̀rọ̀ pàtàkì, kí a má ṣe fi ọ̀rọ̀ náà dá Ẹ̀mí Mímọ́ mọ́ láìsí àní-àní.
  alternative: “nípasẹ̀ Ẹ̀mí Mímọ́” tàbí “nínú Ẹ̀mí.”
  rationale: Gíríìkì kò ní àpilẹ̀kọ, gbólóhùn náà sì lè tọ́ka sí iṣẹ́ Ẹ̀mí Mímọ́ tàbí sí ipò/agbègbè ẹ̀mí ní ìyàtọ̀ sí ẹran ara. Ìtumọ̀ pàtàkì pa ìforígbárí ẹ̀kọ́ yìí mọ́, àlàyé sì ṣàkọsílẹ̀ àwọn àṣàyàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ṣókí, ó sì ní ìrísí orin ìjẹ́wọ́ bí ti Gíríìkì. A lo àwọn ìlà tó jọ ara wọn àti ìṣe aláìṣe-taara láti pa ìṣọ̀kan ewì mọ́, láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan tàbí ìtumọ̀ ẹni kan kún un.
