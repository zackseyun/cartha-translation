id: 1TI.1.20
reference: 1 Timothy 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: yo
  text: Lára wọn ni Humenaiu àti Aleksanderu, àwọn tí mo ti fi lé Sátánì lọ́wọ́[a], kí wọ́n lè gba ìbáwí, kí wọ́n má bàa sọ̀rọ̀-òdì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Mo ti fà wọ́n lé Sátánì lọ́wọ́.” Gbólóhùn náà lè tọ́ka sí ìbáwí líle fún àtúnṣe, kì í ṣe pé ó gbọdọ̀ jẹ́ ìdájọ́ ìkẹyìn.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí kíkọ́ni, títọ́ni, tàbí fífi ìbáwí ṣe àtúnṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Lára wọn ni
  rationale: Ó pa ìtumọ̀ apá-nínú-àpapọ̀ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Híménáyù àti Alẹkisáńdérù
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ náà ní ìbámu pẹ̀lú ìró wọn, ní ọ̀nà tí ó ṣeé kà fún olùkà Yorùbá.
- source_word: παρέδωκα τῷ Σατανᾷ
  choice: Mo ti fi àwọn méjèèjì lé Sátánì lọ́wọ́
  rationale: Ọ̀rọ̀ yìí pa àwòrán fífi ẹnì kan lé ẹlòmíràn lọ́wọ́ mọ́, láì pinnu irú ìlànà ìbáwí tí gbólóhùn náà ń tọ́ka sí.
- source_word: ἵνα παιδευθῶσι
  choice: kí wọ́n lè gba ẹ̀kọ́ ìbáwí
  rationale: παιδεύω ní ìtumọ̀ kíkọ́ni, títọ́ni àti fífi ìbáwí ṣe àtúnṣe; ‘ẹ̀kọ́ ìbáwí’ so ìkọ́ni àti àtúnṣe pọ̀ láì sọ pé ìyà ara ni dandan.
- source_word: μὴ βλασφημεῖν
  choice: láti má ṣe sọ̀rọ̀-òdì
  rationale: ‘Sọ̀rọ̀-òdì’ lè ṣàfihàn ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ àbùkù tó wuwo, ó sì yẹra fún fífi ẹni tí ọ̀rọ̀ náà dojú kọ sínú ẹsẹ̀ nígbà tí Gíríìkì kò sọ ọ́ ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ fífi wọn lé Sátánì lọ́wọ́
  choice: A pa gbólóhùn náà mọ́ ní ọ̀nà tààrà, pẹ̀lú ète ìbáwí tí ó hàn nínú gbólóhùn tó tẹ̀ lé e.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí yíyọ wọn kúrò nínú ìjọ, ìjìyà ara lọ́nà iṣẹ́ ìyanu, tàbí ìdájọ́ ìkẹyìn.
  rationale: Gbólóhùn ète náà fi hàn pé àtúnṣe ni a ń lépa, ṣùgbọ́n ẹsẹ̀ náà kò ṣàlàyé ọ̀nà ìbáwí náà; nítorí náà, a kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí ó ju ohun tí ọ̀rọ̀ sọ lọ kún un.
- issue: Ẹni tàbí ohun tí ọ̀rọ̀-òdì náà dojú kọ
  choice: A kò fi ‘sí Ọlọ́run’ tàbí ‘sí ìgbàgbọ́’ kún ẹsẹ̀ náà.
  alternative: Kí a sọ ní pàtó pé wọn ń sọ̀rọ̀-òdì sí Ọlọ́run tàbí sí ẹ̀kọ́ ìgbàgbọ́.
  rationale: βλασφημεῖν kò ní ohun tí ó dojú kọ ní gbólóhùn Gíríìkì yìí; pípa àìsọ pàtó náà mọ́ ń yẹra fún yíyanju ohun tí orísun kò yanjú.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣeé lóye fún olùkà gbogbogbò; a pa àìsọ pàtó àti ìnira ẹ̀kọ́ ìsìn inú orísun mọ́.
