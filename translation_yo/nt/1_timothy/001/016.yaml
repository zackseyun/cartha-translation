id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: yo
  text: Ṣùgbọ́n nítorí èyí ni mo rí àánú gbà, kí Mèsáyà Jésù[a] lè fi gbogbo sùúrù rẹ̀ hàn nínú mi, ẹni àkọ́kọ́, gẹ́gẹ́ bí àpẹẹrẹ fún àwọn tí yóò gbà á gbọ́[c] sí ìyè àìnípẹ̀kun.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà, ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: c
    text: Ní tààràtà, “àwọn tó ń bọ̀ láti gbà á gbọ́”; tàbí, “àwọn tí yóò ní ìgbàgbọ́ nínú rẹ̀.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “tí yóò yọrí sí ìyè àìnípẹ̀kun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: mo rí àánú gbà
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀-ìṣe aláìṣe (passive); ‘rí àánú gbà’ jẹ́ Yorùbá àdánidá, ó sì fi ẹni tó ṣe àánú sílẹ̀ láìdárúkọ gẹ́gẹ́ bí Gíríìkì.
- source_word: πρώτῳ
  choice: gẹ́gẹ́ bí ẹni àkọ́kọ́
  rationale: Èyí pa ìtumọ̀ ‘first/foremost’ mọ́, ó sì so mọ́ ohun tí Pọ́ọ̀lù sọ ní ẹsẹ 15 láìfi ‘ẹni búburú jù lọ’ kún ẹsẹ yìí ní tààràtà.
- source_word: ἐνδείξηται
  choice: lè fi ... hàn
  rationale: Ó ṣàfihàn ète lẹ́yìn ἵνα, ó sì mú ìtumọ̀ fífi ohun kan hàn kedere.
- source_word: Χριστὸς Ἰησοῦς
  choice: Mèsáyà Jésù
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́ níbí.
- source_word: ἅπασαν μακροθυμίαν
  choice: gbogbo sùúrù rẹ̀
  rationale: ‘Gbogbo’ pa agbára ἅπασαν mọ́, ‘sùúrù’ sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìfaradà pẹ̀lú ìkóra-ẹni-níjàánu.
- source_word: ὑποτύπωσιν
  choice: àpẹẹrẹ
  rationale: ‘Àpẹẹrẹ’ jẹ́ ọ̀rọ̀ àdánidá fún àwòrán tàbí àkọ́ṣe tí a gbé kalẹ̀ fún àwọn ẹlòmíràn.
- source_word: τῶν μελλόντων πιστεύειν
  choice: àwọn tí yóò gbà ... gbọ́
  rationale: Ìsọ̀rọ̀ ọjọ́ iwájú ‘yóò’ fi hàn pé ìgbàgbọ́ àwọn wọ̀nyí ń bọ̀ lẹ́yìn ìrírí Pọ́ọ̀lù.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: gbà á gbọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ní ìgbàgbọ́ nínú ẹni kan.
- source_word: εἰς ζωὴν αἰώνιον
  choice: sí ìyè àìnípẹ̀kun
  rationale: ‘Sí’ pa ìtọ́sọ́nà tàbí àbájáde tí εἰς ń tọ́ka sí mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Ní ibi yìí, a ka Χριστός sí oyè, nítorí náà ‘Mèsáyà’ mú ìtumọ̀ ẹni àmì òróró jáde; àṣàyàn ìbílẹ̀ ‘Kristi’ wà ní àlàyé ìsàlẹ̀.
- issue: Ẹni tó ṣe àánú àti ẹni tó fi sùúrù hàn
  choice: A kò dárúkọ ẹni tó ṣe àánú nínú gbólóhùn àkọ́kọ́, ṣùgbọ́n Mèsáyà Jésù ni ẹni tó fi sùúrù hàn.
  alternative: Kí a sọ pé Ọlọ́run Baba ni ó ṣe àánú ní tààràtà.
  rationale: Ọ̀rọ̀-ìṣe aláìṣe ἠλεήθην kò dárúkọ olùṣe, nígbà tí gbólóhùn ète sọ Mèsáyà Jésù ní kedere; ìtumọ̀ náà kò fi ohun tí ọ̀rọ̀ Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè, ‘sùúrù’ gẹ́gẹ́ bí ọ̀rọ̀ gbogbo ènìyàn, àti ‘ẹni àkọ́kọ́’ láti pa ìṣòro ìtumọ̀ πρώτῳ mọ́.
