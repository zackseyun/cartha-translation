  source_fidelity: Àtúnṣe kékeré kan pọndandan. αἵτινες jẹ́ ọ̀rọ̀-asọ̀yé púpọ̀ tó ń tọ́ka sí ‘àwọn ìtàn àròsọ àti àwọn ìtẹ̀lé ìran’; nítorí náà, ‘èyí tí’ (ẹyọ kan) kò bá Gíríìkì mu. Ìfiwéra μᾶλλον ἢ tún yẹ kí ó hàn gẹ́gẹ́ bí ‘ju … lọ,’ kì í ṣe ‘dípò’ nìkan. ‘Nínú ìgbàgbọ́’ fara mọ́ ἐν πίστει dáadáa, nígbà tí ó fi àìdájú ìbáṣepọ̀ gbólóhùn náà sílẹ̀.
  naturalness: ‘Àwọn ìtẹ̀lé ìran’ jẹ́ ọ̀nà Yorùbá tó hàn gedegbe fún γενεαλογίαις ju ‘ìtàn ìran’ ẹyọ kan lọ. Ìṣọ̀kan ‘tí wọ́n ń mú … wá ju … lọ’ sì jẹ́ ìsọ̀rọ̀ Yorùbá adayeba.
  terminology: ‘Àwọn ìtàn àròsọ,’ ‘àwọn àròjinlẹ̀,’ ‘iṣẹ́ ìríjú láti ọ̀dọ̀ Ọlọ́run,’ àti ‘ìgbàgbọ́’ dáa. A ti ṣàtúnṣe yíyan ìtumọ̀ ‘faithfulness’ nínú àlàyé ìsàlẹ̀ sí ‘ìṣòtítọ́,’ dípò ‘òtítọ́ inú,’ èyí tí kò péye fún πίστις ní ìtumọ̀ yẹn.
