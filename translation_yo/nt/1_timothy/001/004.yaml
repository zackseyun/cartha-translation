id: 1TI.1.4
reference: 1 Timothy 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: yo
  text: kí wọn má sì fiyè sí àwọn ìtàn àròsọ àti àwọn ìtẹ̀lé ìran tí kò lópin, tí wọ́n ń mú àwọn àròjinlẹ̀ asán[a] wá ju iṣẹ́ ìríjú láti ọ̀dọ̀ Ọlọ́run[b], tí ó wà nínú ìgbàgbọ́[c], lọ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn àríyànjiyàn” tàbí “àwọn ìwádìí.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìbéèrè ìwádìí tàbí awuyewuye; níbí ó ní ìtumọ̀ odi ti ìṣàrò aláìléso.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìṣàkóso Ọlọ́run,” “ètò Ọlọ́run,” tàbí “iṣẹ́ ìríjú Ọlọ́run.” Ọ̀rọ̀ Gíríìkì οἰκονομία lè túmọ̀ sí iṣẹ́ ìríjú, ìṣàkóso, tàbí ètò tí a tò létòlétò.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “nípasẹ̀ ìgbàgbọ́.” Níhìn-ín “ìgbàgbọ́” tún lè ní àwọ̀ ìtumọ̀ “ìgbẹ́kẹ̀lé” tàbí “ìṣòtítọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: fiyè sí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ọkàn sí ohun kan tàbí gbígbọ́ tirẹ̀, ó sì bá ìtumọ̀ Gíríìkì mu láìṣe àlàyé ju ọ̀rọ̀ náà lọ.
- source_word: μύθοις
  choice: àwọn ìtàn àròsọ
  rationale: Ó túmọ̀ μῦθοι ní èdè Yorùbá òde òní láìfi irú ìtàn ọmọ kékeré kan pàtó kún un.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: ìtàn ìran tí kò lópin
  rationale: “Ìtàn ìran” sọ nípa àkọsílẹ̀ tàbí ìtẹ̀lé ìran, “tí kò lópin” sì pa agbára ἀπεράντοις mọ́.
- source_word: ἐκζητήσεις
  choice: àwọn àròjinlẹ̀ asán
  rationale: Nínú àyíká yìí ọ̀rọ̀ náà ń tọ́ka sí ìwádìí, ìbéèrè, tàbí àríyànjiyàn aláìléso; “àròjinlẹ̀ asán” mú ìhùwàsí odi rẹ̀ jáde, nígbà tí àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: παρέχουσι
  choice: ń fa
  rationale: Ó sọ ìtumọ̀ pé àwọn nǹkan wọ̀nyí ń mú irú àròjinlẹ̀ bẹ́ẹ̀ ṣẹlẹ̀.
- source_word: μᾶλλον ἢ
  choice: dípò
  rationale: Ó jẹ́ ìfiwéra Yorùbá tó ṣe kedere láàárín èsì méjì.
- source_word: οἰκονομίαν θεοῦ
  choice: iṣẹ́ ìríjú tí ó ti ọ̀dọ̀ Ọlọ́run wá
  rationale: “Iṣẹ́ ìríjú” pa àwòrán ìṣàkóso ohun tí a fi lé ẹni lọ́wọ́ mọ́, gbólóhùn “tí ó ti ọ̀dọ̀ Ọlọ́run wá” sì fi ìtumọ̀ orísun hàn láìgbẹ́kẹ̀ lé e pé genitive náà jẹ́ ti ìní nìkan.
- source_word: τὴν ἐν πίστει
  choice: tí ó sì wà nípasẹ̀ ìgbàgbọ́
  rationale: Ó so gbólóhùn náà mọ́ iṣẹ́ ìríjú, ó sì pa ìtumọ̀ ọ̀nà tàbí àyè iṣẹ́ ἐν mọ́ ní Yorùbá àdánidá.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀ jù fún πίστις ní àyíká yìí; àlàyé ìsàlẹ̀ mẹ́nu kan “ìgbẹ́kẹ̀lé” àti “òtítọ́ inú” gẹ́gẹ́ bí àwọ̀ ìtumọ̀ tó ṣeé ṣe.
theological_decisions:
- issue: Ìtumọ̀ οἰκονομίαν θεοῦ
  choice: iṣẹ́ ìríjú tí ó ti ọ̀dọ̀ Ọlọ́run wá
  alternative: ìṣàkóso Ọlọ́run; ètò Ọlọ́run; iṣẹ́ ìríjú Ọlọ́run
  rationale: Yíyan yìí pa ìtumọ̀ ìríjú/ìṣàkóso mọ́, ó sì gba pé θεοῦ lè fi orísun hàn. Kò dín ọ̀rọ̀ náà kù sí ètò ẹ̀kọ́ ìsìn kan pàtó.
- issue: Ìtumọ̀ πίστει nínú τὴν ἐν πίστει
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; òtítọ́ inú
  rationale: “Ìgbàgbọ́” ni yíyan àkọ́kọ́ tó bá àṣà Pọ́ọ̀lù àti ìlò Yorùbá mu, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí àwọ̀ ìtumọ̀ mìíràn ṣí sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́wọ̀, òde òní, ó sì yẹ fún kíkà ní gbangba. Àmì ìjáwọ́ ní òpin fi hàn pé gbólóhùn náà ń bá a lọ láti ẹsẹ tó ṣáájú sí èyí tó tẹ̀ lé e.
