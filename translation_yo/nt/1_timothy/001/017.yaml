id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: yo
  text: Kí ọlá àti ògo wà fún Ọba gbogbo ìgbà, ẹni tí kò lè díbàjẹ́, ẹni tí a kò lè rí, Ọlọ́run kan ṣoṣo[a], láé àti láéláé. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ kan ní: “Ọlọ́run ọlọ́gbọ́n kan ṣoṣo.”'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Ọba gbogbo ìgbà
  rationale: Èyí pa èrò àwọn αἰῶνες mọ́ gẹ́gẹ́ bí gbogbo ìgbà tàbí gbogbo sáà, ó sì jẹ́ Yorùbá àdánidá ju gbolohun líle bí ‘Ọba àwọn ayé’ lọ. Ó fi hàn pé ìjọba Ọlọ́run gba gbogbo ìgbà.
- source_word: ἀφθάρτῳ
  choice: ẹni tí kò lè díbàjẹ́
  rationale: Ó túmọ̀ sí ẹni tí ìbàjẹ́ tàbí ìparun kò lè dé bá; kò fi ìtumọ̀ náà mọ́ ikú nìkan, ó sì ṣe kedere sí òǹkàwé òde òní.
- source_word: ἀοράτῳ
  choice: ẹni tí a kò lè rí
  rationale: Gbolohun yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó wọ́pọ̀ láti sọ pé Ọlọ́run jẹ́ aláìrí.
- source_word: μόνῳ θεῷ
  choice: Ọlọ́run kan ṣoṣo
  rationale: Ó tẹ̀ lé ọ̀rọ̀ SBLGNT ní tààrà, ó sì pa ìjẹ́wọ́ pé Ọlọ́run kan ṣoṣo ni mọ́ láìfi ‘ọlọ́gbọ́n’ kún ọ̀rọ̀ pàtàkì.
- source_word: τιμὴ καὶ δόξα
  choice: ọlá àti ògo
  rationale: Àwọn ọ̀rọ̀ Yorùbá wọ̀nyí bá ìtumọ̀ τιμή àti δόξα mu, wọ́n sì yẹ fún ìyìn ọlọ́lá.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: láéláé àti láéláé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbà tí kò ní òpin, ó sì pa agbára àsọtúnsọ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀμήν
  choice: Àmín
  rationale: A lo ìtumọ̀-kọ yìí nítorí pé ó ti fìdí múlẹ̀ nínú ìjọsìn àti àwọn Bíbélì Yorùbá.
- source_word: δὲ
  choice: kò fara hàn gẹ́gẹ́ bí ọ̀rọ̀ ọ̀tọ̀
  rationale: δὲ ń darí ọ̀rọ̀ sí orin ìyìn níbí. Ìṣètò gbolohun Yorùbá fi ìyípadà náà hàn láìfi ọ̀rọ̀ àkókò bí ‘nísinsin yìí’ kún un.
theological_decisions:
- issue: Bí a ṣe máa pa agbára ìjẹ́wọ́ pé Ọlọ́run kan ṣoṣo mọ́ láìyanjú ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹ̀kọ́ nípa Kristi
  choice: Ọlọ́run kan ṣoṣo
  alternative: Ọlọ́run nìkan
  rationale: Yíyan yìí túmọ̀ μόνῳ θεῷ ní tààrà, ó sì jẹ́ kí ìjẹ́wọ́ inú ẹsẹ náà dúró bí a ti kọ ọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- issue: Ìyàtọ̀ àfọwọ́kọ tí ó fi σοφῷ (‘ọlọ́gbọ́n’) kún ọ̀rọ̀ náà
  choice: A kò fi ‘ọlọ́gbọ́n’ sínú ọ̀rọ̀ pàtàkì
  alternative: Ọlọ́run ọlọ́gbọ́n kan ṣoṣo
  rationale: SBLGNT tí a fi ṣe orísun kò ní σοφῷ. A tẹ̀ lé àfọwọ́kọ yẹn nínú ọ̀rọ̀ pàtàkì, a sì tọ́ka sí ìyàtọ̀ náà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Gbolohun náà jẹ́ ọlọ́lá, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. A yí ìṣètò dative ti Gíríìkì sí ‘Kí ọlá àti ògo jẹ́ ti ...’ kí orin ìyìn náà lè dùn bí Yorùbá àdánidá, láìyí ẹni tí a ń fi ọlá àti ògo fún padà.
