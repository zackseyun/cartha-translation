  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: yo
  text: Pọ́ọ̀lù[a], àpọ́sítélì Mèsáyà Jésù nípa àṣẹ Ọlọ́run, Olùgbàlà wa, àti Mèsáyà Jésù, ìrètí wa,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘Kristi Jésù’ ní ibi méjèèjì tí ‘Mèsáyà Jésù’ ti fara hàn. Ọ̀rọ̀ Gíríìkì Χριστός lè túmọ̀ sí ‘Mèsáyà,’ tàbí ó lè ṣiṣẹ́ bí apá orúkọ, ‘Kristi,’ nínú ọ̀rọ̀ kan.
    reason: alternative_reading
  - marker: b
    text: Tàbí ‘nípa àṣẹ Ọlọ́run Olùgbàlà wa àti ti Mèsáyà Jésù ìrètí wa.’
    reason: previous_rendering
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Ìkọ̀wé orúkọ Páùlù ní ọ̀nà tí ó bá ìpèdè Yorùbá mu.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ yìí jẹ́ oyè iṣẹ́ ìránṣẹ́ pàtàkì nínú ìjọ àkọ́kọ́; ó dá ìtumọ̀ àti ìlò Májẹ̀mú Tuntun mọ́ ju ‘oníṣẹ́’ tàbí ‘aṣojú’ lọ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ní ìkíni yìí; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn, nígbà tí a pa bí orúkọ méjèèjì ṣe tẹ̀ lé ara wọn nínú Gíríìkì mọ́.
- source_word: κατ’ ἐπιταγήν
  choice: nípa àṣẹ
  rationale: Ó fi hàn pé àṣẹ aláṣẹ ni ìpìlẹ̀ iṣẹ́ àpọ́sítélì Pọ́ọ̀lù, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: Ọlọ́run Olùgbàlà wa
  rationale: Ó pa àpèjúwe appositional mọ́, tí ‘Olùgbàlà wa’ ń dá Ọlọ́run mọ̀.
- source_word: καὶ
  choice: àti
  rationale: Ó so Ọlọ́run àti Mèsáyà Jésù pọ̀ gẹ́gẹ́ bí àwọn tí àṣẹ náà ti ọ̀dọ̀ wọn wá, láìfi èrò míì kún un.
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: Mèsáyà Jésù ìrètí wa
  rationale: Ó pa àpèjúwe kúkúrú ti Gíríìkì mọ́, ó sì dá Mèsáyà Jésù mọ̀ gẹ́gẹ́ bí ìrètí wa láìfẹ̀ ọ̀rọ̀ náà síi.
- source_word: ἐλπίδος
  choice: ìrètí
  rationale: ‘Ìrètí’ ni ọ̀rọ̀ Yorùbá tó gbòòrò tí ó lè gba ìfojúsọ́nà pẹ̀lú ìgbẹ́kẹ̀lé tí ọ̀rọ̀ Páùlù ní.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ọ̀rọ̀ yìí, oyè ẹni tí a yàn tàbí ẹni àmì-òróró ṣì ṣe kedere; ‘Mèsáyà’ mú iṣẹ́ oyè náà hàn, ṣùgbọ́n àṣàyàn ‘Kristi’ wà nínú àlàyé ìsàlẹ̀ nítorí pé Χριστός lè tún dà bí apá orúkọ.
- issue: Ìbáṣepọ̀ ‘ìrètí wa’ sí Mèsáyà Jésù
  choice: 'Àpèjúwe ìdánimọ̀: ‘Mèsáyà Jésù ìrètí wa’'
  alternative: ‘Mèsáyà Jésù, ẹni tí í ṣe ìrètí wa’
  rationale: Ẹ̀ka genitive Gíríìkì fi ‘ìrètí wa’ ṣe àpèjúwe Mèsáyà Jésù ní tààrà; ìtumọ̀ kúkúrú náà pa agbára ìdánimọ̀ yìí mọ́ láìsọ ọ́ di gbólóhùn àlàyé.
- issue: Àṣẹ náà ti ọ̀dọ̀ ta ni ó ti wá?
  choice: Ọlọ́run Olùgbàlà wa àti Mèsáyà Jésù ìrètí wa ni a so pọ̀ mọ́ àṣẹ náà
  alternative: Lílo ‘àti ti Mèsáyà Jésù’ láti tún àmì ìní ṣe kedere
  rationale: Gíríìkì so àwọn ẹ̀ka genitive méjèèjì pọ̀ mọ́ ‘àṣẹ’; Yorùbá lè ṣe bẹ́ẹ̀ láìtún ‘ti’ sọ, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ náà hàn gbangba síi.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa ìrísí kúkúrú ìkíni lẹ́tà Gíríìkì mọ́; ‘Mèsáyà Jésù ìrètí wa’ jẹ́ àpèjúwe tó mọ́ọ̀mọ́ kúkúrú, bí ó tilẹ̀ jẹ́ pé a lè fẹ̀ sí ‘ẹni tí í ṣe ìrètí wa’ fún ìrọ̀rùn.
