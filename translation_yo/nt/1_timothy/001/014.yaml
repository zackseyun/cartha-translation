id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: yo
  text: Ṣùgbọ́n oore-ọ̀fẹ́ Olúwa wa pọ̀ ju ìwọ̀n lọ, pẹ̀lú ìgbàgbọ́ àti ìfẹ́ tí wọ́n wà nínú Mèsáyà Jésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.”
    reason: Ọ̀nà ìtumọ̀ míì fún Χριστῷ Ἰησοῦ tí ó pa ọ̀rọ̀ ìbílẹ̀ ‘Kristi’ mọ́.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: pọ̀ rékọjá lọ́pọ̀lọpọ̀
  rationale: Ọ̀rọ̀-ìṣe náà tẹnu mọ́ ọ̀pọ̀ yanturu tí ó rékọjá ìwọ̀n; gbólóhùn Yorùbá yìí mú agbára ìtumọ̀ náà jáde ní èdè àtọwọ́dọ́wọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ohun tí ẹsẹ yìí sọ wé àìgbàgbọ́ àti ẹ̀ṣẹ̀ tí a mẹ́nu kàn ṣáájú, ó sì fi ìyàtọ̀ hàn.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún ojúrere Ọlọ́run tí a kò tọ́ sí.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó pa ipò-orúkọ κύριος mọ́ ní ọ̀nà tí ó jẹ́ ti ẹ̀sìn, tí ó sì wọ́pọ̀ nínú Yorùbá.
- source_word: μετὰ
  choice: pẹ̀lú
  rationale: Ó fi hàn pé oore-ọ̀fẹ́ náà pọ̀ yanturu papọ̀ mọ́ ìgbàgbọ́ àti ìfẹ́, láìfi ìdí àti àbájáde tí Gíríìkì kò sọ kún un.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ tààrà àti èyí tí ó bá àyíká ọ̀rọ̀ mu jù lọ.
- source_word: ἀγάπης
  choice: ìfẹ́
  rationale: Ó túmọ̀ ἀγάπη ní èdè Yorùbá òde òní lọ́nà tí ó ṣe kedere.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: tí ó wà nínú Mèsáyà Jésù
  rationale: Ó so gbólóhùn àsọyé náà mọ́ ìgbàgbọ́ àti ìfẹ́, ó sì pa àwòrán Pọ́ọ̀lù ti wíwà ‘nínú’ Mèsáyà mọ́.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός jẹ́ ipò-orúkọ tó túmọ̀ sí ẹni àmì òróró; ‘Mèsáyà’ mú ìtumọ̀ ipò-orúkọ náà hàn dípò kíkà á bí orúkọ ìdílé.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘pẹ̀lú ìgbàgbọ́ àti ìfẹ́’ sí ‘oore-ọ̀fẹ́’
  choice: A sọ pé oore-ọ̀fẹ́ Olúwa pọ̀ yanturu pẹ̀lú ìgbàgbọ́ àti ìfẹ́ tí ó wà nínú Mèsáyà Jésù.
  alternative: A lè ṣàlàyé ìgbàgbọ́ àti ìfẹ́ gẹ́gẹ́ bí ohun tí oore-ọ̀fẹ́ mú jáde nínú Pọ́ọ̀lù.
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì so μετὰ πίστεως καὶ ἀγάπης mọ́ oore-ọ̀fẹ́ tó pọ̀ rékọjá; ìtumọ̀ náà pa ìbáṣepọ̀ gírámà mọ́ láìfi ọ̀nà ìṣẹ̀lẹ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ mú ìtumọ̀ ipò-orúkọ Gíríìkì náà—ẹni àmì òróró—hàn; àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ọ̀nà ìtumọ̀ ìbílẹ̀ tí àwọn òǹkàwé tún mọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Pọ̀ rékọjá lọ́pọ̀lọpọ̀’ jẹ́ ọ̀nà àtọwọ́dọ́wọ́ láti mú agbára ọ̀rọ̀-ìṣe Gíríìkì tí a tẹnu mọ́ jáde, nígbà tí ‘nínú Mèsáyà Jésù’ pa àwòrán àti àìsọ pàtó inú orísun mọ́.
