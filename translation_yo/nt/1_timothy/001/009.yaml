id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: yo
  text: ní mímọ̀ èyí pé a kò gbé òfin kalẹ̀ fún olódodo, bí kò ṣe fún àwọn arúfin àti aláìtẹríba, àwọn aláìbọ̀wọ̀ fún Ọlọ́run àti ẹlẹ́ṣẹ̀, àwọn aláìmímọ́ àti aláìbọ̀wọ̀ fún ohun mímọ́, àwọn tí ń pa baba wọn àti àwọn tí ń pa ìyá wọn[a], àti àwọn apànìyàn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ó ṣeé ṣe, “àwọn tí ń lu baba wọn àti àwọn tí ń lu ìyá wọn.” Àwọn ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìkọlù oníwà ipá sí òbí, bí ó tilẹ̀ jẹ́ pé “pa” ló ṣeé ṣe kó jẹ́ ìtumọ̀ wọn níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: ní mímọ̀ èyí pé
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ àbọ̀ tí ó ń tọ́ka sí ohun tí ẹni náà mọ̀ mọ́, ó sì so gbolohun yìí mọ́ ìtọ́ni tó ṣáájú lọ́nà àdánidá.
- source_word: δικαίῳ
  choice: fún olódodo
  rationale: Ọ̀rọ̀ náà jẹ́ ẹyọ kan, ó sì ń ṣojú ẹni tí ó ṣe òdodo; “olódodo” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi akọ tàbí abo kún ohun tí èdè Yorùbá kò fi hàn.
- source_word: νόμος οὐ κεῖται
  choice: a kò gbé òfin kalẹ̀
  rationale: “Gbé … kalẹ̀” pa àwòrán àti agbára òfin inú κεῖται mọ́, dípò ìtumọ̀ àlàyé bí “òfin kò kan.”
- source_word: ἀνόμοις
  choice: àwọn arúfin
  rationale: Ó túmọ̀ sí àwọn tí wọ́n ń rú tàbí kọ òfin, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí gbogbo ènìyàn lè lóye.
- source_word: ἀνυποτάκτοις
  choice: aláìtẹríba
  rationale: Ó fi àìfẹ́ láti tẹrí ba tàbí fara mọ́ àṣẹ hàn, láìdín un kù sí àìgbọ́ràn lásán.
- source_word: ἀσεβέσι
  choice: àwọn aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: Ó mú àìní ìfọkànsìn àti ọ̀wọ̀ sí Ọlọ́run jáde ní Yorùbá àdánidá.
- source_word: ἁμαρτωλοῖς
  choice: ẹlẹ́ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ẹni tí ẹ̀ṣẹ̀ ń dá.
- source_word: ἀνοσίοις
  choice: àwọn aláìmọ́
  rationale: Ó pa ìtumọ̀ àìjẹ́ mímọ́ mọ́, ó sì yàtọ̀ sí ọ̀rọ̀ tó tẹ̀ lé e nípa àìbọ̀wọ̀ fún ohun mímọ́.
- source_word: βεβήλοις
  choice: aláìbọ̀wọ̀ fún ohun mímọ́
  rationale: Ó fi ìwà tí ń sọ ohun mímọ́ di ohun lásán tàbí tí kò bọ̀wọ̀ fún un hàn, ó sì yẹra fún fífi ọ̀rọ̀ kan náà ṣe ἀσεβέσι àti ἀνοσίοις.
- source_word: πατρολῴαις
  choice: àwọn tí ń pa baba wọn
  rationale: Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí lílu tàbí pípa baba; nínú àtòjọ yìí, pípa ni ìtumọ̀ tó ṣeé ṣe jù, ṣùgbọ́n a pa àṣàyàn kejì mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: μητρολῴαις
  choice: àwọn tí ń pa ìyá wọn
  rationale: Ó bá πατρολῴαις lọ ní ìbámu, ó sì sọ ìtumọ̀ tó ṣeé ṣe jù ní ọ̀nà tí òǹkàwé Yorùbá lè lóye ní kíákíá.
- source_word: ἀνδροφόνοις
  choice: àwọn apànìyàn
  rationale: “Apànìyàn” sọ pípa ènìyàn lọ́nà búburú tàbí àìtọ́ ní ṣókí, ó sì dára fún àtòjọ ìwà búburú yìí.
theological_decisions:
- issue: Ìtumọ̀ akọ aṣojú nínú δικαίῳ
  choice: fún olódodo
  alternative: fún ọkùnrin olódodo
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ akọ, iṣẹ́ rẹ̀ jẹ́ aṣojú gbogbogbò. Èdè Yorùbá kò ní akọ tàbí abo gírámà nínú “olódodo”; fífi “ọkùnrin” kún un yóò lè mú kí òǹkàwé rò pé àwọn ọkùnrin nìkan ni ọ̀rọ̀ náà ń tọ́ka sí.
- issue: Agbára ìtumọ̀ πατρολῴαις àti μητρολῴαις
  choice: àwọn tí ń pa baba wọn àti àwọn tí ń pa ìyá wọn
  alternative: àwọn tí ń lu baba wọn àti àwọn tí ń lu ìyá wọn
  rationale: Àwọn ọ̀rọ̀ tó ṣọ̀wọ́n wọ̀nyí lè túmọ̀ sí ìkọlù oníwà ipá tàbí pípa òbí. Àyíká àtòjọ náà ṣe àtìlẹ́yìn fún “pa,” ṣùgbọ́n àìdánilójú ojúlówó náà wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo àtòjọ méjì-méjì gẹ́gẹ́ bí ti Gíríìkì, pẹ̀lú ọ̀rọ̀ tó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé lásán.
