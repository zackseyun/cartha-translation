id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: yo
  text: Gẹ́gẹ́ bí mo ti rọ̀ ọ́ láti dúró ní Éfésù nígbà tí mo ń lọ sí Makedóníà, kí o lè pàṣẹ fún àwọn kan[a] pé kí wọn má ṣe kọ́ni ní ẹ̀kọ́ mìíràn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi ìtọ́ni fún àwọn kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó mú ìtumọ̀ ìrántí àti ìfiwéra ọ̀rọ̀ Gíríìkì náà jáde, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn náà ní Yorùbá.
- source_word: παρεκάλεσά σε
  choice: mo ti rọ̀ ọ́
  rationale: “Rọ̀” fi ìbéèrè onítẹnumọ́ hàn láì sọ ọ́ di àṣẹ líle; “ọ́” ń tọ́ka sí Timotiu.
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: kí o dúró ní Éfésù
  rationale: “Dúró” níbí túmọ̀ sí láti ṣì wà níbẹ̀ tàbí láti máa bá a lọ ní dídúró sí ibẹ̀; orúkọ ìlú náà ni a kọ sí Éfésù.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: nígbà tí mo ń lọ sí Makedóníà
  rationale: A lóye participle náà gẹ́gẹ́ bí ohun tó ń sọ ipò ìrìn-àjò Paulu ní àkókò tó rọ Timotiu; “nígbà tí” jẹ́ kí ìbáṣepọ̀ àkókò náà ṣe kedere.
- source_word: ἵνα
  choice: kí o lè
  rationale: Ó fi ète ìrọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: παραγγείλῃς τισὶν
  choice: kí o lè kìlọ̀ fún àwọn kan
  rationale: “Kìlọ̀ fún” ní agbára ìtọ́ni àti ìdènà tó bá àyíká ọ̀rọ̀ mu, nígbà tí “àwọn kan” pa àìdárúkọ àwọn ẹni pàtó náà mọ́.
- source_word: μὴ ἑτεροδιδασκαλεῖν
  choice: pé wọn kò gbọdọ̀ máa kọ́ni ní ẹ̀kọ́ tí ó yàtọ̀
  rationale: Ó sọ ìdènà náà ní Yorùbá tó ṣe kedere, ó sì pa èrò pé ẹ̀kọ́ náà yàtọ̀ sí ìlànà ẹ̀kọ́ aposteli mọ́ láì fi ọ̀rọ̀ tó túmọ̀ sí “ẹ̀kọ́ èké” kún un.
theological_decisions:
- issue: Bí a ṣe máa sọ agbára tó wà nínú παραγγείλῃς ní àyíká àtúnṣe ìjọ
  choice: kìlọ̀ fún
  alternative: pàṣẹ fún
  rationale: Ọ̀rọ̀ náà ju ìmọ̀ràn lásán lọ, ṣùgbọ́n “kìlọ̀ fún” jẹ́ Yorùbá òde òní tó fi ìtọ́ni aláṣẹ àti ìdènà hàn láì mú kí gbolohun náà le ju orísun lọ. Àṣàyàn “pàṣẹ fún” wà nínú àlàyé ìsàlẹ̀.
- issue: Bí a ṣe máa túmọ̀ ἑτεροδιδασκαλεῖν
  choice: máa kọ́ni ní ẹ̀kọ́ tí ó yàtọ̀
  alternative: máa kọ́ni ní ẹ̀kọ́ èké
  rationale: Ọ̀rọ̀ àpapọ̀ náà tẹnumọ́ ẹ̀kọ́ mìíràn tàbí ẹ̀kọ́ tó yàtọ̀. “Ẹ̀kọ́ èké” yóò pinnu ìdájọ́ náà ní kíkún ju ohun tí ọ̀rọ̀ náà sọ ní tààrà lọ.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa ìṣàn gbólóhùn tí kò tíì parí ní ẹsẹ yìí mọ́ pẹ̀lú àmì kọ́mà, a sì gbe àmì àlàyé [a] sí ibi ọ̀rọ̀ tí àṣàyàn náà kan ní tààrà.
