id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: yo
  text: Mo dúpẹ́ lọ́wọ́ Mèsáyà Jésù[a], Olúwa wa, ẹni tí ó fún mi ní okun, nítorí ó kà mí sí olóòótọ́, nígbà tí ó fi mí sí iṣẹ́ ìránṣẹ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.” Oyè Gíríìkì Χριστός lè túmọ̀ sí “Mèsáyà,” tàbí a lè lò ọ̀nà ìbílẹ̀ náà, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “sí iṣẹ́” tàbí “sínú iṣẹ́.” Ọ̀rọ̀ Gíríìkì διακονία lè tọ́ka sí iṣẹ́ ìránṣẹ́ tàbí iṣẹ́ ìjíṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Mo dúpẹ́ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Gíríìkì láti sọ pé ẹni kan ń fi ọpẹ́ hàn. “Mo dúpẹ́ lọ́wọ́” jẹ́ èdè Yorùbá àdánidá tí ó sì fi ẹni tí a dúpẹ́ lọ́wọ́ hàn kedere.
- source_word: ἐνδυναμώσαντί με
  choice: ẹni tí ó fún mi lókun
  rationale: Àṣàyàn yìí sọ ìṣe Kristi gẹ́gẹ́ bí ẹni tí ó mú Paulu lágbára, láì fi ìtumọ̀ pàtó kan tí kò sí nínú Gíríìkì kún un.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jesu
  rationale: Χριστός jẹ́ oyè ẹni àmì-òróró náà níbí. “Mèsáyà” jẹ́ ọ̀nà tí ó ṣeé lóye láti pa ìtumọ̀ oyè náà mọ́ dípò kí a ka a sí orúkọ lásán.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Olúwa wa
  rationale: “Olúwa” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún oyè κύριος, ó sì pa ìtumọ̀ àṣẹ àti ọlá rẹ̀ mọ́.
- source_word: πιστόν με ἡγήσατο
  choice: ó kà mí sí olóòótọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé ó gbà tàbí kà Paulu sí ẹni olóòótọ́ tí a lè gbẹ́kẹ̀ lé. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, kò sì sọ ọ́ di ìdájọ́ ilé-ẹjọ́.
- source_word: θέμενος εἰς διακονίαν
  choice: ó sì yàn mí sí iṣẹ́ ìránṣẹ́
  rationale: Nínú àyíká yìí, τίθημι ní ìtumọ̀ fífi ẹni sí ipò iṣẹ́, “yàn” sì sọ èyí ní kedere. “Iṣẹ́ ìránṣẹ́” pa ìtumọ̀ gbígbòòrò διακονία mọ́ láì fi ipò àlùfáà tàbí ètò ìjọ kan kún un.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: Àyíká náà jẹ́ kí oyè Χριστός ní ìtumọ̀ rẹ̀, nítorí náà “Mèsáyà” pa oyè ẹni àmì-òróró náà mọ́; àlàyé ìsàlẹ̀ sì jẹ́ kí òǹkàwé mọ ọ̀nà ìbílẹ̀ “Kristi.”
- issue: Ìtumọ̀ yíyan Paulu sí διακονία
  choice: ó sì yàn mí sí iṣẹ́ ìránṣẹ́
  alternative: ó sì fi mí sínú iṣẹ́ ìránṣẹ́
  rationale: Àṣàyàn náà fi hàn pé Jesu fi iṣẹ́ kan lé Paulu lọ́wọ́, ṣùgbọ́n kò sọ pé ó yàn án sí ipò ìjọ kan tí ó dín ju ìtumọ̀ orísun lọ.
translation_notes:
  register: A lo èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. “Mo dúpẹ́ lọ́wọ́” àti “fún mi lókun” rọrùn fún òǹkàwé òde òní, nígbà tí “iṣẹ́ ìránṣẹ́” pa ìtumọ̀ ẹ̀sìn àti ìtumọ̀ iṣẹ́ gbígbòòrò mọ́.
