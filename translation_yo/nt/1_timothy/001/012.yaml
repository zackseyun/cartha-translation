  terminology: A pa ‘Mèsáyà’ mọ́ gẹ́gẹ́ bí ìtumọ̀ oyè Χριστός, ‘Olúwa’ fún κύριος, àti ‘iṣẹ́ ìránṣẹ́’ fún διακονία. Orúkọ náà gbọ́dọ̀ jẹ́ ‘Jésù’ pẹ̀lú àmì ohùn tó yẹ.
