  to: Wọ́n ń fẹ́ láti jẹ́ àwọn olùkọ́ òfin[b], bí ó tilẹ̀ jẹ́ pé wọn kò lóye ohun tí wọ́n ń sọ tàbí àwọn ohun tí wọ́n ń tẹnumọ́ pẹ̀lú ìdánilójú.[a]
  rationale: A tún ọ̀rọ̀ náà ṣe ní kíkún láti fi púpọ̀ orúkọ ‘olùkọ́’ hàn, àti láti jẹ́ kí apá περὶ τίνων διαβεβαιοῦνται túmọ̀ sí àwọn ohun tí wọ́n ń sọ̀rọ̀ lórí pẹ̀lú ìdánilójú, kì í ṣe àwọn ohun tí wọ́n kan ń tẹnu mọ́. Ìtumọ̀ kò yí ìtumọ̀ ẹsẹ̀, ìforígbárí participle, tàbí àìdájú nípa ‘òfin’ pada.
