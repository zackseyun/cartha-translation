  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: yo
  text: Wọ́n ń fẹ́ láti jẹ́ àwọn olùkọ́ òfin[b], bí ó tilẹ̀ jẹ́ pé wọn kò lóye ohun tí wọ́n ń sọ tàbí àwọn ohun tí wọ́n ń tẹnumọ́ pẹ̀lú ìdánilójú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àìlóye ohun tí wọ́n ń sọ tàbí àwọn ohun tí wọ́n ń fi ìdánilójú fẹsẹ̀ múlẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn olùkọ́ òfin” tọ́ka sí àwọn tí wọ́n ń sọ pé àwọn ní àṣẹ láti kọ́ni ní Òfin àwọn Júù (Tórà).
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες
  choice: wọ́n ń fẹ́
  rationale: Ó pa ìtumọ̀ ìfẹ́ tàbí ìfẹ́-ọkàn tí ó ń bá a lọ mọ́, ó sì bá kókó-ọ̀rọ̀ tí a jogún láti ẹsẹ tó ṣáájú mu.
- source_word: εἶναι
  choice: láti jẹ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún infinitive tí ó ń parí ìtumọ̀ ‘fẹ́.’
- source_word: νομοδιδάσκαλοι
  choice: olùkọ́ òfin
  rationale: Ó túmọ̀ compound náà ní tààrà gẹ́gẹ́ bí ẹni tí ń kọ́ni nípa òfin, láì fi ‘Mósè’ tàbí ‘Tórà’ kún ọ̀rọ̀ inú ẹsẹ.
- source_word: μὴ νοοῦντες
  choice: bí ó tilẹ̀ jẹ́ pé wọn kò lóye
  rationale: 'Ọ̀rọ̀ participle náà ní agbára ìyàtọ̀ nínú àyíká yìí: wọ́n fẹ́ kọ́ni, ṣùgbọ́n wọn kò lóye. Ìtumọ̀ yìí sọ ìbáṣepọ̀ náà ní Yorùbá àdánidá.'
- source_word: μήτε ... μήτε
  choice: kò ... tàbí
  rationale: Nínú gbólóhùn àìní Yorùbá, ‘kò ... tàbí ...’ ń fi ìkọ̀ méjèèjì hàn lọ́nà àdánidá.
- source_word: ἃ λέγουσιν
  choice: ohun tí wọ́n ń sọ
  rationale: Ó tọ́ka sí àkóónú ọ̀rọ̀ wọn, ó sì pa present sense mọ́ pẹ̀lú ‘ń sọ.’
- source_word: περὶ τίνων
  choice: àwọn ọ̀ràn tí
  rationale: Ó fi àwọn ohun tàbí ọ̀ràn tí ọ̀rọ̀ wọn dá lé hàn ní Yorùbá tó ṣe kedere.
- source_word: διαβεβαιοῦνται
  choice: wọ́n ń fi ìdánilójú tẹnumọ́
  rationale: Ó mú agbára ìsọ̀rọ̀ pẹ̀lú ìdánilójú àti ìtẹnumọ́ jáde, láì sọ pé òótọ́ ni ohun tí wọ́n ń sọ.
theological_decisions:
- issue: Ohun tí ‘òfin’ nínú νομοδιδάσκαλοι ń tọ́ka sí
  choice: A lo ‘òfin’ ní gbogbogbò nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘Òfin Mósè’ tàbí ‘Tórà.’
  rationale: Àyíká lẹ́tà náà mú kí ó ṣeé ṣe gan-an pé òfin àwọn Júù/Tórà ni, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ‘òfin’ nìkan. Àlàyé ẹsẹ̀ ìsàlẹ̀ ló ṣàlàyé àyíká náà láì fi ohun tí kò hàn gbangba sínú ọ̀rọ̀ pàtàkì.
- issue: Ìbáṣepọ̀ μὴ νοοῦντες sí θέλοντες
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìyàtọ̀: ‘bí ó tilẹ̀ jẹ́ pé.’'
  alternative: ‘ní àìlóye’ tàbí ‘tí wọn kò lóye.’
  rationale: Àyíká fi ìtakora hàn láàárín ìfẹ́ wọn láti jẹ́ olùkọ́ àti àìlóye wọn; ọ̀nà yìí mú ìtakora náà ṣe kedere láì yí kókó ẹ̀kọ́ pada.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Ń fi ìdánilójú tẹnumọ́’ pa ìfẹsẹ̀múlẹ̀ inú διαβεβαιοῦνται mọ́, nígbà tí ẹsẹ̀ ìsàlẹ̀ [a] ń pèsè ọ̀nà tó sún mọ́ ìṣètò Gíríìkì.
