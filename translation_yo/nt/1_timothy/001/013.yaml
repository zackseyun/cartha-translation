  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: yo
  text: ẹni tí ó ń sọ̀rọ̀-òdì sí Ọlọ́run tẹ́lẹ̀, àti onínúnibíni, àti ẹni oníwà ipá[a]. Ṣùgbọ́n a ṣàánú mi[b], nítorí mo ṣe é láìmọ̀[c] nínú àìgbàgbọ́[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹni oníwà ìkà” tàbí “ẹni aláìlójú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìwà ẹ̀gàn àti ìwà ipá tó kọjá ààlà, kì í ṣe ìgbéraga lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “mo rí àánú gbà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “nínú àìmọ̀” tàbí “nígbà tí n kò mọ̀.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “nínú àìjẹ́ olóòótọ́.” Níhìn-ín, ó ṣeé ṣe jù pé ó túmọ̀ sí àìní ìgbàgbọ́, kì í ṣe àìṣòótọ́ sí májẹ̀mú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: ẹni tí ó jẹ́ ... tẹ́lẹ̀
  rationale: Ó tọ́ka padà sí Pọ́ọ̀lù, ó sì pa agbára participle àti ìtumọ̀ ipò rẹ̀ tẹ́lẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: βλάσφημον
  choice: asọ̀rọ̀-òdì sí Ọlọ́run
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣàpèjúwe ẹni tí ń sọ ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀-òdì sí Ọlọ́run; gbolohun yìí ṣe kedere ju lílo ọ̀rọ̀ àyálò lọ.
- source_word: διώκτην
  choice: onínúnibíni
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí ń ṣe inúnibíni sí àwọn ẹlòmíràn nítorí ìgbàgbọ́ wọn.
- source_word: ὑβριστήν
  choice: alágbára-ìkà
  rationale: Ó mú ìhùwàsí ìkà, ìkọlù, àti lílo agbára láti tẹ́ni lójú jáde, láìdín ọ̀rọ̀ náà kù sí ìgbéraga nìkan.
- source_word: ἠλεήθην
  choice: a ṣàánú fún mi
  rationale: Ilana passive náà dúró, ó sì fi hàn pé Pọ́ọ̀lù ni ẹni tí a ṣe àánú sí, láìsọ ẹni tó ṣe é ní tààràtà.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó pa ìbáṣepọ̀ ìdí tàbí àlàyé inú Gíríìkì mọ́, láìsọ pé àìmọ̀ jẹ́ ohun tí ó tọ́ sí àánú.
- source_word: ἀγνοῶν ἐποίησα
  choice: mo ṣe é láìmọ̀
  rationale: Ó so ìṣe náà mọ́ àìmọ̀ Pọ́ọ̀lù ní Yorùbá tí ó ṣe kedere, tí ó sì pa agbára participle mọ́.
- source_word: ἐν ἀπιστίᾳ
  choice: nínú àìgbàgbọ́
  rationale: Níhìn-ín, ó ṣeé ṣe jù pé ἀπιστία túmọ̀ sí àìní ìgbàgbọ́, kì í ṣe àìṣòótọ́ sí májẹ̀mú.
theological_decisions:
- issue: Ìtumọ̀ ὅτι gẹ́gẹ́ bí ìdí tàbí ipò àlàyé
  choice: “nítorí” ni a lò, kí ọ̀rọ̀ náà lè sọ pé a ṣàánú fún Pọ́ọ̀lù nítorí ó ṣe ohun tí ó ṣe láìmọ̀ nínú àìgbàgbọ́.
  alternative: “nígbà tí” tàbí ọ̀rọ̀ tó fi àìmọ̀ hàn gẹ́gẹ́ bí ipò nìkan, kì í ṣe ìdí.
  rationale: ὅτι ní agbára ìdí/àlàyé níhìn-ín. Ìtumọ̀ náà kò sọ pé àìmọ̀ Pọ́ọ̀lù ló mú un yẹ fún àánú; ó fi ìdààmú ẹ̀kọ́ ìgbàgbọ́ inú gbolohun náà sílẹ̀ láìyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ; ìtòlẹ́sẹẹsẹ “àti ... àti ... àti ...” ń pa ìtẹnumọ́ àkójọ Gíríìkì mọ́.
