id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: yo
  text: gẹ́gẹ́ bí ìhìn rere ògo Ọlọ́run alábùkún náà[a], èyí tí a fi lé mi lọ́wọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tí ó rọrùn sí i: “ìhìn rere ológo ti Ọlọ́run alábùkún.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: gẹ́gẹ́ bí … ṣe wí
  rationale: Ọ̀rọ̀ yìí fi ìhìn rere hàn gẹ́gẹ́ bí ìlànà tàbí òṣùwọ̀n tí ọ̀rọ̀ tó ṣáájú bá mu; àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí jẹ́ èdè àdánidá fún ìtumọ̀ ‘ní ìbámu pẹ̀lú.’
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì ti fìdí múlẹ̀ fún ìkéde ìgbàlà ní àyíká ọ̀rọ̀ Paulu.
- source_word: τῆς δόξης
  choice: ògo
  rationale: A pa ìbáṣepọ̀ oníjẹ́nítífù mọ́ gẹ́gẹ́ bí ‘ìhìn rere ògo,’ dípò kí a túmọ̀ rẹ̀ sí àpèjúwe nìkan; èyí jẹ́ kí àìdánilójú bóyá ògo náà jẹ́ ohun tí ìhìn rere ń sọ tàbí ànímọ́ rẹ̀ dúró.
- source_word: μακαρίου
  choice: alábùkún
  rationale: ‘Alábùkún’ yẹ fún Ọlọ́run, ó sì yàgò fún ìtumọ̀ tí kò jinlẹ̀ bí ‘aláyọ̀’ tàbí ẹni tí orí kàn.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Ìtumọ̀ tààrà fún θεός; ó wà nínú gbólóhùn oníjẹ́nítífù náà.
- source_word: ὃ
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò yìí tọ́ka padà sí ‘ìhìn rere,’ Yorùbá sì lè sọ ìbáṣepọ̀ náà ní àdánidá pẹ̀lú ‘èyí tí.’
- source_word: ἐπιστεύθην
  choice: a fi lé mi lọ́wọ́
  rationale: Fọ́ọ̀mù àìṣe yìí túmọ̀ sí pé a gbé ìhìn rere náà lé Paulu lọ́wọ́ gẹ́gẹ́ bí ojúṣe, kì í ṣe pé ó ‘gbà á gbọ́.’
- source_word: ἐγώ
  choice: mi
  rationale: Arọ́pò ẹni àkọ́kọ́ náà hàn gbangba nínú ‘lé mi lọ́wọ́’; àtòjọ gbólóhùn náà fi ojúṣe Paulu hàn láìfi ìtẹnumọ́ àjèjì kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ jẹ́nítífù nínú τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: ìhìn rere ògo Ọlọ́run alábùkún
  alternative: ìhìn rere ológo ti Ọlọ́run alábùkún
  rationale: Àkọ́kọ́ pa ìṣètò Gíríìkì ‘ìhìn rere ògo’ mọ́, kò sì fi tipátipá pinnu pé τῆς δόξης jẹ́ àpèjúwe. Àlàyé ìsàlẹ̀ fi ọ̀nà Yorùbá tó rọrùn sí i hàn.
- issue: Ìtumọ̀ ἐπιστεύθην
  choice: a fi lé mi lọ́wọ́
  alternative: mo gbà á gbọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, àìṣe πιστεύω túmọ̀ sí gbígbé ohun kan lé ẹnì kan lọ́wọ́ gẹ́gẹ́ bí ojúṣe; ìtumọ̀ ‘gbàgbọ́’ kò bá ìlò yìí mu.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘A fi lé mi lọ́wọ́’ jẹ́ àdánidá, ó sì ṣàfihàn ojúṣe ìránṣẹ́; àkọ́kọ́ ‘ìhìn rere ògo’ mọ̀ọ́mọ̀ pa ìdààmú jẹ́nítífù orísun mọ́.
