  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: yo
  text: 'Sí Tímótì, ọmọ tòótọ́ nínú ìgbàgbọ́[a]: Kí oore-ọ̀fẹ́, àánú àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run Baba àti Mèsáyà[b] Jésù, Olúwa wa, wà pẹ̀lú rẹ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọ gidi nínú ìgbàgbọ́.”
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ ìbílẹ̀: “Kristi Jésù, Olúwa wa.” Gíríìkì Χριστός túmọ̀ sí ẹni tí a fòróró yàn.'
    reason: translation_tradition
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: ọmọ tòótọ́
  rationale: Ó pa àpèjúwe ìbátan tẹ̀mí mọ́, kò sì sọ ọ́ di ọmọ tí a bí nípa ti ara. A kò fi ‘mi’ kún un nítorí kò sí ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní nínú Gíríìkì.
- source_word: ἐν πίστει
  choice: nínú ìgbàgbọ́
  rationale: Ó pa àìdánilójú náà mọ́ bóyá ìgbàgbọ́ ni ààyè ìbátan wọn tàbí ìgbàgbọ́ tí wọ́n jọ ní.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ẹ̀bùn inú rere Ọlọ́run tí a kò fi iṣẹ́ rà.
- source_word: ἔλεος
  choice: àánú
  rationale: Ó túmọ̀ ìṣe ìyọ́nú àti ìṣe rere sí ẹni tí ó nílò rẹ̀.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ó jẹ́ ọ̀rọ̀ adayébá ní Yorùbá fún àlàáfíà gẹ́gẹ́ bí ara ìkíni àti ìbùkún.
- source_word: θεοῦ πατρὸς
  choice: Ọlọ́run Baba
  rationale: Èyí jẹ́ ìṣètò ọ̀rọ̀ adayébá ní Yorùbá, ó sì pa ìtumọ̀ Gíríìkì mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ ń fi oyè náà hàn dípò kí ó dà bí orúkọ lásán.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó fìdí múlẹ̀ fún κύριος, ó sì pa ìjẹ́pàtàkì oyè náà mọ́.
theological_decisions:
- issue: Agbára ἐν πίστει
  choice: nínú ìgbàgbọ́
  alternative: nínú ìgbàgbọ́ kan náà
  rationale: Àkọ́kọ́ yìí kò fi tipátipá pinnu bóyá Pọ́ọ̀lù ń tọ́ka sí ìgbàgbọ́ Kristẹni tí wọ́n jọ ní tàbí sí ìgbàgbọ́ gẹ́gẹ́ bí ààyè ìbátan wọn.
- issue: Ìtumọ̀ Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: ‘Mèsáyà’ ń pa ìṣe Χριστός gẹ́gẹ́ bí oyè mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ ìbílẹ̀ hàn láìsọ oyè náà di orúkọ lásán.
- issue: Àfikún ‘mi’ pẹ̀lú τέκνῳ
  choice: A kò fi ‘mi’ kún un
  alternative: ọmọ mi tòótọ́
  rationale: Gíríìkì kò ní μου (‘mi’). Ìbátan Pọ́ọ̀lù sí Tímótì hàn nínú àpèjúwe ‘ọmọ tòótọ́,’ ṣùgbọ́n a kò gbọ́dọ̀ fi ohun-ìní tí kò sí nínú orísun kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà níyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A tú ìkíni aláìlọ́rọ̀-ìṣe Gíríìkì sí ìbùkún Yorùbá adayébá ‘Kí ... wà pẹ̀lú rẹ,’ láìyí kókó rẹ̀ padà.
