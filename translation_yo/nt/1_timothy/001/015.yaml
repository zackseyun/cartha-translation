id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: yo
  text: 'Ọ̀rọ̀ yìí ṣeé gbẹ́kẹ̀ lé, ó sì yẹ fún ìtẹ́wọ́gbà pátápátá: pé Mèsáyà Jésù[a] wá sí ayé láti gba àwọn ẹlẹ́ṣẹ̀ là, èmi sì ni àkọ́kọ́ lára wọn.[b]


    [a] Tàbí, “Kristi Jésù.”

    [b] Tàbí, “èmi sì ni ẹni tí ó burú jù lọ lára wọn,” tàbí “olórí wọn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “èmi sì ni ẹni tí ó burú jù lọ lára wọn,” tàbí “olórí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Ọ̀rọ̀ yìí ṣeé gbẹ́kẹ̀ lé
  rationale: Àgbékalẹ̀ yìí ń tọ́ka sí ọ̀rọ̀ àkótán kan tí ó ṣeé gbára lé; ‘ṣeé gbẹ́kẹ̀ lé’ jẹ́ Yorùbá àdánidá fún πιστός níbí.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: ó sì yẹ fún ìtẹ́wọ́gbà pátápátá
  rationale: ‘Ìtẹ́wọ́gbà’ túmọ̀ ἀποδοχή ní kedere, ‘pátápátá’ sì ń pa agbára πάσης mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Níbí, ὅτι ń ṣàfihàn àkóónú ọ̀rọ̀ tí ó ṣeé gbẹ́kẹ̀ lé, kì í ṣe ìdí kan.
- source_word: Χριστὸς Ἰησοῦς
  choice: Mèsáyà Jésù
  rationale: Χριστός ní agbára oyè ẹni àmì òróró tí a ṣèlérí; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, nígbà tí àlàyé ìsàlẹ̀ fún ‘Kristi Jésù’ gẹ́gẹ́ bí yíyan mìíràn.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: wá sí ayé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé tí ó sì jẹ́ àdánidá fún ìwọlé sínú ayé.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: láti gba àwọn ẹlẹ́ṣẹ̀ là
  rationale: ‘Àwọn ẹlẹ́ṣẹ̀’ ṣàfihàn àpèjúwe tí a lò gẹ́gẹ́ bí orúkọ, ‘gba … là’ sì jẹ́ ọ̀nà Yorùbá tó péye fún σῴζω.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: èmi sì ni àkọ́kọ́ lára wọn
  rationale: ‘Àkọ́kọ́’ pa àwòrán ipò πρῶτος àti àìdánilójú rẹ̀ mọ́; ‘èmi’ tún mú ìtẹnumọ́ ἐγώ hàn. Àlàyé ìsàlẹ̀ fún àwọn ìtumọ̀ ‘burú jù lọ’ àti ‘olórí.’
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú gbólóhùn ìjẹ́wọ́ yìí, Χριστός ṣì lè ṣiṣẹ́ gẹ́gẹ́ bí oyè. A fi ‘Mèsáyà’ sínú ọ̀rọ̀, a sì pa ìlò orúkọ-bí-oyè ‘Kristi’ mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ πρῶτος láàárín àwọn ẹlẹ́ṣẹ̀
  choice: àkọ́kọ́ lára wọn
  alternative: ẹni tí ó burú jù lọ lára wọn; olórí wọn
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ẹni àkọ́kọ́ tàbí ẹni iwájú jù lọ ní ipò. Ìtumọ̀ pàtàkì kò sọ ọ́ di ‘burú jù lọ’ láìsí dandan, ó sì fi ìforígbárí ìtumọ̀ náà sílẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò; a yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
