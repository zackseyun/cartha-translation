id: 1TI.1.8
reference: 1 Timothy 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: yo
  text: A sì mọ̀ pé òfin dára, bí ẹnì kan bá lò ó ní ìbámu pẹ̀lú òfin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹnikẹ́ni bá lò ó lọ́nà tí ó tọ́,” tàbí “bí ẹnì kan bá lò ó lọ́nà tí ó bófin mu.”
    reason: Ìtumọ̀ mìíràn fún νομίμως; àwọn àṣàyàn wọ̀nyí lè túmọ̀ sí lílo ní ọ̀nà tí ó yẹ tàbí tí ó bá òfin mu.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: a mọ̀
  rationale: Ọ̀rọ̀ οἶδα ní ìrísí pípé ní èdè Gíríìkì ní ìtumọ̀ ìsinsìnyí níbí, ó sì ń sọ ìmọ̀ tí ó fìdí múlẹ̀; ‘a mọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ jẹ́ àsopọ̀ ìyípadà ọ̀rọ̀ tí kò lágbára púpọ̀; nínú àyíká yìí, ‘Ṣùgbọ́n’ fi ìbáṣepọ̀ sí ohun tí ó ṣáájú hàn láì sọ pé ìtakò náà lágbára jù.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àkóónú ohun tí a mọ̀ sílẹ̀ ní ọ̀nà Yorùbá àdánidá.
- source_word: καλὸς
  choice: dára
  rationale: καλός ń sọ pé òfin ní ìwà rere tàbí ànímọ́ rere; ‘dára’ pa ìtumọ̀ gbòòrò náà mọ́.
- source_word: ὁ νόμος
  choice: òfin
  rationale: ‘Òfin’ pa ìtumọ̀ Gíríìkì mọ́ láì fi kún un pé Òfin Mósè nìkan ni tàbí òfin lápapọ̀.
- source_word: ἐάν τις
  choice: bí ẹnì kan bá
  rationale: Èyí jẹ́ gbólóhùn àídájú tí ó tọ́ka sí ẹnikẹ́ni lápapọ̀, ṣùgbọ́n ó pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: αὐτῷ
  choice: ó
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka padà sí òfin; nínú ‘lò ó,’ Yorùbá fi ohun tí a lò hàn lọ́nà àdánidá.
- source_word: νομίμως
  choice: ní ìbámu pẹ̀lú òfin
  rationale: Ó túmọ̀ sí lílo ohun ní ọ̀nà tí ó bá òfin tàbí ìlànà tí ó yẹ mu, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ rẹ̀ pẹ̀lú νόμος (‘òfin’) mọ́.
- source_word: χρῆται
  choice: lò
  rationale: χράομαι túmọ̀ sí lílo tàbí mímú ohun ṣiṣẹ́; ‘lò’ jẹ́ ọ̀rọ̀ Yorùbá ṣókí, tí ó wọ́pọ̀.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ‘òfin’
  choice: A túmọ̀ rẹ̀ ní ‘òfin’ lásán.
  alternative: Òfin Mósè; òfin lápapọ̀
  rationale: Àyíká lè ní Òfin Mósè ní pàtàkì lọ́kàn, ṣùgbọ́n Gíríìkì sọ ‘òfin’ nìkan. Ìtumọ̀ náà kò dín ìtumọ̀ rẹ̀ kù sí ẹ̀kọ́ kan tí ọ̀rọ̀ náà kò sọ ní kedere.
- issue: Ìtumọ̀ νομίμως àti eré ọ̀rọ̀ pẹ̀lú νόμος
  choice: ní ìbámu pẹ̀lú òfin
  alternative: lọ́nà tí ó tọ́; lọ́nà tí ó bófin mu
  rationale: Àṣàyàn yìí pa àsopọ̀ ọ̀rọ̀ láàárín ‘òfin’ àti ‘ní ìbámu pẹ̀lú òfin’ mọ́, láì pinnu gbogbo ohun tí lílo tó tọ́ túmọ̀ sí nínú ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó yẹ. Àmì àlàyé [a] wà lẹ́yìn gbogbo gbólóhùn àídájú nítorí pé àlàyé náà kan νομίμως àti bí a ṣe lò òfin, kì í ṣe ‘dára’ nìkan.
