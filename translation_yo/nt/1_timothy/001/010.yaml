source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: yo
  text: àwọn tí ń ṣe ìwà ìbálòpọ̀ tí kò tọ́, àwọn ọkùnrin tí ń bá ọkùnrin lòpọ̀,[a] àwọn tí ń jí ènìyàn gbé tàbí tí ń tà wọ́n fún ẹrú, àwọn òpùrọ́, àwọn tí ń búra èké, àti ohunkóhun mìíràn tí ó lòdì sí ẹ̀kọ́ tó ní ìlera,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọkùnrin tí ń ṣe ìṣe ìbálòpọ̀ pẹ̀lú ọkùnrin.” Ọ̀rọ̀ Gíríìkì ἀρσενοκοῖται ṣọ̀wọ́n, ìjíròrò sì wà lórí ààlà pàtó ìtumọ̀ rẹ̀; síbẹ̀, ó ń tọ́ka sí ìbálòpọ̀ láàárín ọkùnrin.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: àwọn oníṣekúṣe
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn tí ń ṣe ìwà ìbálòpọ̀ tí kò tọ́ ní ìtumọ̀ gbòòrò; “àwọn oníṣekúṣe” jẹ́ èdè Yorùbá adayébá tí kò fi ìtumọ̀ náà mọ́ irú ìṣekúṣe kan ṣoṣo.
- source_word: ἀρσενοκοίταις
  choice: àwọn ọkùnrin tí ń bá ọkùnrin lòpọ̀
  rationale: Ìtumọ̀ yìí jẹ́ kí ìtọ́kasí sí ìbálòpọ̀ láàárín ọkùnrin hàn gbangba, ṣùgbọ́n kò gbé èrò ìdánimọ̀ ìbálòpọ̀ ti òde òní wọ ọ̀rọ̀ Gíríìkì náà.
- source_word: ἀνδραποδισταῖς
  choice: àwọn ajínigbé tí ń sọ ènìyàn di ẹrú
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn tí ń jí ènìyàn gbé tàbí tí ń kó wọn lọ láti tà wọ́n sí oko ẹrú. Gbólóhùn yìí mú ìfipámúni-di-ẹrú àti òwò ènìyàn hàn ju “ajínigbé” nìkan lọ.
- source_word: ψεύσταις
  choice: àwọn òpùrọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ Gíríìkì fún àwọn tí ń purọ́ mu.
- source_word: ἐπιόρκοις
  choice: àwọn ẹlẹ́jẹ̀ èké
  rationale: Ìtumọ̀ yìí tọ́ka sí àwọn tí ń búra èké tàbí tí ẹ̀rí wọn lábẹ́ ìbúra jẹ́ èké.
- source_word: καὶ εἴ τι ἕτερον
  choice: àti ohunkóhun mìíràn
  rationale: Ó pa agbára gbólóhùn tí ń ṣí àkójọ náà sí ohun mìíràn tí ó jọra mọ́.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: sí ẹ̀kọ́ tí ó péye
  rationale: ὑγιαίνω ní ìtumọ̀ àpẹẹrẹ ni “tó ní ìlera, tó yè kooro.” “Ẹ̀kọ́ tí ó péye” jẹ́ Yorùbá tó ṣe kedere fún ẹ̀kọ́ tí kò ní àbùkù, láìlo èdè ẹ̀sìn tó le.
- source_word: ἀντίκειται
  choice: tí ó lòdì sí
  rationale: Ó sọ ìtakò tàbí ìdàkejì sí ohun kan ní Yorùbá adayébá.
theological_decisions:
- issue: Ìtumọ̀ ἀρσενοκοίταις nínú ọ̀rọ̀ tí ìjíròrò wà lórí ìwọ̀n ìtumọ̀ rẹ̀
  choice: àwọn ọkùnrin tí ń bá ọkùnrin lòpọ̀
  alternative: àwọn ọkùnrin tí ń ṣe ìbálòpọ̀ pẹ̀lú ọkùnrin bí ìṣe
  rationale: Aṣàyàn náà dá lórí ìṣe tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí, ó sì pa ìtọ́kasí pàtó sí ọkùnrin mọ́. Kò sọ ọ́ di ẹ̀ka ìdánimọ̀ ti òde òní. Àlàyé ìsàlẹ̀ jẹ́wọ́ pé ọ̀rọ̀ náà ṣọ̀wọ́n, àti pé ààlà ìtumọ̀ rẹ̀ ṣì jẹ́ ohun ìjíròrò.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàdojú, ọlọ́lá, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo àtòjọ àwọn orúkọ ènìyàn gẹ́gẹ́ bí ìṣètò Gíríìkì, a sì fi àmì ohùn síbi tí ó yẹ. Àmì ìdákẹ́jẹ ní òpin fi hàn pé ẹsẹ yìí ń bá gbólóhùn ẹsẹ tó ṣáájú lọ.
