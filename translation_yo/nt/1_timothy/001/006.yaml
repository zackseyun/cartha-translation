  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: yo
  text: Àwọn kan, tí wọ́n ti ṣáko kúrò nínú àwọn nǹkan wọ̀nyí, ti yà kúrò lọ sí ọ̀rọ̀ asán[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjíròrò asán” tàbí “ọ̀rọ̀ tí kò ní ìtumọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀ nínú gẹnitífù ń tọ́ka sẹ́yìn sí àwọn ànímọ́ inú ẹsẹ 5. Gbólóhùn yìí mú ìtọ́kasí náà ṣe kedere láì fi dandan sọ pé ó kan ohun kan pàtó nínú wọn.
- source_word: τινες
  choice: àwọn kan
  rationale: Ó ń tọ́ka sí àwọn ènìyàn tí a kò dárúkọ, ó sì pa àìsọ pàtó tí Pọ́ọ̀lù lò mọ́.
- source_word: ἀστοχήσαντες
  choice: nítorí pé wọn kò dé ibi tí ... ń darí wọn sí
  rationale: ἀστοχέω túmọ̀ sí ṣíṣe àṣìṣe ibi àfojúsùn tàbí kíkùnà láti dé ibẹ̀. Ìtumọ̀ yìí pa àwòrán àfojúsùn mọ́, ó sì bá Yorùbá àdánidá mu.
- source_word: ἐξετράπησαν
  choice: ti yà kúrò ní ọ̀nà
  rationale: Ọ̀rọ̀ náà fi yíyà kúrò ní ipa ọ̀nà tó yẹ hàn. Àṣàyàn yìí pa àwòrán ìdarí ọ̀nà àti ìtumọ̀ ìwà rẹ̀ mọ́.
- source_word: εἰς
  choice: wọ́n sì ń
  rationale: Nínú àtúnṣe gbólóhùn Yorùbá, ìṣípò sí ìṣe tuntun ni a fi hàn nípa gbólóhùn àbájáde yìí dípò títúmọ̀ ọ̀rọ̀ aṣáájú náà lọ́kọ̀ọ̀kan.
- source_word: ματαιολογίαν
  choice: ọ̀rọ̀ asán
  rationale: Ó túmọ̀ sí ọ̀rọ̀ tí kò ní èrè tàbí èso. “Ọ̀rọ̀ asán” jẹ́ kúkúrú, ó ṣe kedere, ó sì jẹ́ èdè Yorùbá ti òde òní.
theological_decisions:
- issue: Ohun tí ὧν ń tọ́ka sí
  choice: Ó ń tọ́ka lápapọ̀ sí àwọn ànímọ́ àti ète tẹ̀mí inú ẹsẹ 5 gẹ́gẹ́ bí “àwọn nǹkan wọ̀nyí.”
  alternative: A lè mú un dín kù sí ọkàn mímọ́, ẹ̀rí-ọkàn rere, àti ìgbàgbọ́ àìṣẹ̀tàn nìkan, tàbí túmọ̀ ọ́ ní tààrà bí “kúrò lára àwọn ohun tí.”
  rationale: Ìtọ́kasí lápapọ̀ pa ìsopọ̀ pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́, kò sì fi ìtumọ̀ tóóró kan tí Gíríìkì kò fi dandan béèrè lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. A yan àtúnṣe gbólóhùn tó bá Yorùbá àdánidá mu, nígbà tí a pa àwọn àwòrán àfojúsùn àti yíyà kúrò ní ọ̀nà inú Gíríìkì mọ́.
