  source_fidelity: Ìtumọ̀ ìpilẹ̀ ń pa ìtọ́kasí ὧν sí àwọn ohun tó ṣáájú mọ́, ó sì túmọ̀ ματαιολογίαν dáadáa gẹ́gẹ́ bí “ọ̀rọ̀ asán.” Ṣùgbọ́n “nítorí pé” fi ìbáṣepọ̀ ìdí kan kún gbolóhùn participle náà, “kò dé ibi tí ... ń darí wọn sí” sì gùn ju, ó sì yí àwòrán “kíkùnà/ṣíṣáko nípa àwọn ohun wọ̀nyí” padà. Àsìkò ìṣe “wọ́n sì ń sọ” tún jẹ́ ìṣe tó ń lọ lọwọlọwọ, níbi tí Gíríìkì ti ń ṣàpèjúwe ìyípadà tí ó ti ṣẹlẹ̀.
  naturalness: “Tí wọ́n ti ṣáko kúrò nínú àwọn nǹkan wọ̀nyí” jẹ́ Yorùbá boṣewa, ó sì jẹ́ ìtumọ̀ àdánidá fún ἀστοχήσαντες nínú àyíká yìí. “Ti yà kúrò lọ sí ọ̀rọ̀ asán” ṣàfihàn ìyapa àti ibi tí wọ́n yí sí, láì fi ìtumọ̀ míràn kún un.
  terminology: “Àwọn kan,” “àwọn nǹkan wọ̀nyí,” àti “ọ̀rọ̀ asán” yẹ. A pa ìtọ́kasí tí kò ṣàlàyé ju sí àwọn ànímọ́/ète inú ẹsẹ 5 mọ́, láì dín un kù sí apá kan nínú wọn.
