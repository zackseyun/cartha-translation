source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: yo
  text: Àṣẹ yìí ni mo fi lé ọ lọ́wọ́, Tímótì, ọmọ mi, ní ìbámu pẹ̀lú àwọn àsọtẹ́lẹ̀ tí a ti sọ tẹ́lẹ̀ nípa rẹ[a], kí o lè fi wọ́n[b] jagun ogun rere náà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ti rẹ”; ó tún ṣeé ṣe kí ó túmọ̀ sí “lórí rẹ,” ní ìtumọ̀ àwọn àsọtẹ́lẹ̀ tí a sọ sórí Tímótì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ wọn” tàbí “nínú wọn”; èdè Gíríìkì lè tọ́ka sí ọ̀nà tí a fi ń ṣe ohun kan tàbí ààyè tí iṣẹ́ náà ti ń lọ.
    reason: lexical_alternative
  - marker: c
    text: Ìtumọ̀ ìbílẹ̀ ni “jà ìjà rere.” Ní ti gidi, èdè Gíríìkì sọ nípa jíjagun ogun rere.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: Àṣẹ
  rationale: Ó fi ìtọ́ni aláṣẹ àti ojúṣe pàtàkì hàn ní ọ̀nà tó ṣe kedere ní Yorùbá.
- source_word: παρατίθεμαί
  choice: ni mo fi lé ọ lọ́wọ́
  rationale: Àpólà yìí sọ pé Pọ́ọ̀lù gbé àṣẹ náà lé Tímótì lọ́wọ́ gẹ́gẹ́ bí ohun tí ó gbọdọ̀ bójú tó.
- source_word: τέκνον Τιμόθεε
  choice: Tímótì ọmọ mi
  rationale: Ó pa àwòrán ìbátan onífẹ̀ẹ́ mọ́; fífi “mi” kún un jẹ́ ọ̀nà àdánidá láti bá ẹnì kan sọ̀rọ̀ gẹ́gẹ́ bí ọmọ ní Yorùbá, láìsọ pé ọmọ bíbí ni.
- source_word: κατὰ
  choice: ní ìbámu pẹ̀lú
  rationale: Ó fi ìbámu tàbí ìṣọ̀kan àṣẹ náà pẹ̀lú àwọn àsọtẹ́lẹ̀ tó ṣáájú hàn.
- source_word: τὰς προαγούσας
  choice: tí a ti sọ tẹ́lẹ̀
  rationale: 'Ó mú agbára àkókò participle náà jáde ní Yorùbá àdánidá: àwọn àsọtẹ́lẹ̀ náà ti wá ṣáájú àṣẹ yìí.'
- source_word: ἐπὶ σὲ
  choice: nípa rẹ
  rationale: Ó jẹ́ ìtumọ̀ tó ṣe kedere jù lọ fún ìtọ́kasí àwọn àsọtẹ́lẹ̀ sí Tímótì, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa àṣàyàn “lórí rẹ” mọ́.
- source_word: προφητείας
  choice: àwọn àsọtẹ́lẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ọ̀pọ̀ nọ́ńbà orísun mu.
- source_word: στρατεύῃ
  choice: jagun
  rationale: Ó pa àwòrán iṣẹ́ ológun mọ́, ó sì bá “ogun” mu gẹ́gẹ́ bí cognate construction tó ṣeé lóye ní Yorùbá.
- source_word: ἐν αὐταῖς
  choice: fi wọ́n
  rationale: Ó túmọ̀ ἐν ní ọ̀nà irinṣẹ́—àwọn àsọtẹ́lẹ̀ náà jẹ́ ohun tí Tímótì fi ń jagun—ṣùgbọ́n àlàyé pa ìtumọ̀ ibi tàbí ààyè iṣẹ́ náà mọ́.
- source_word: τὴν καλὴν στρατείαν
  choice: ogun rere náà
  rationale: Ó pa àwòrán ìpolongo tàbí iṣẹ́ ológun mọ́ dípò yíyí rẹ̀ sí ìjà kan ṣoṣo.
theological_decisions:
- issue: Ìbáṣepọ̀ àwọn àsọtẹ́lẹ̀ pẹ̀lú iṣẹ́ tí a fi lé Tímótì lọ́wọ́
  choice: Àwọn àsọtẹ́lẹ̀ tó ṣáájú nípa Tímótì bá àṣẹ Pọ́ọ̀lù mu, wọ́n sì ń tọ́ ọ́ sọ́nà tàbí fún un ní ohun tí yóò fi ṣe iṣẹ́ rẹ̀.
  alternative: Àwọn àsọtẹ́lẹ̀ náà dá Tímótì sípò ní ìlànà ìyàsímímọ́ pàtó, tàbí wọ́n jẹ́ ọ̀rọ̀ ìwúrí àdáni lásán.
  rationale: Ẹsẹ náà so àṣẹ Pọ́ọ̀lù mọ́ àwọn àsọtẹ́lẹ̀, ṣùgbọ́n kò ṣàlàyé ẹ̀kọ́ ìjọ nípa bí a ṣe dá Tímótì sípò; nítorí náà, a kò fi èrò ẹ̀kọ́ ìsìn tí kò hàn gbangba sínú ìtumọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Fi lé ọ lọ́wọ́” àti “jagun ogun rere” jẹ́ àdánidá sí olùka Yorùbá, wọ́n sì pa ìtumọ̀ fífi ojúṣe léni lọ́wọ́ àti àwòrán ológun ti Gíríìkì mọ́.
