  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: yo
  text: Máa di ìgbàgbọ́ àti ẹ̀rí-ọkàn rere[a] mú; àwọn kan ti kọ̀ ẹ̀rí-ọkàn rere náà sílẹ̀, wọ́n sì ti rì bí ọkọ̀ ojú omi ní ti ìgbàgbọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Máa di ìgbàgbọ́ àti ẹ̀rí-ọkàn rere mú; àwọn kan ti kọ̀ wọ́n sílẹ̀ …” Arọ́pò-orúkọ Gíríìkì náà, ἥν, sábà máa ń tọ́ka sí “ẹ̀rí-ọkàn,” ṣùgbọ́n àwọn kan gbà pé ó ń tọ́ka sí “ìgbàgbọ́ àti ẹ̀rí-ọkàn rere” papọ̀.'
    reason: alternative_reading
  - marker: b
    text: “Ìgbàgbọ́” tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé,” tàbí, bí ó tilẹ̀ jẹ́ pé kò ṣeé ṣe tó bẹ́ẹ̀ níbí, “ìṣòtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: máa di … mú
  rationale: Ọ̀rọ̀ yìí jẹ́ participle tó ń tẹ̀ lé àṣẹ inú ẹsẹ tó ṣáájú. “Máa di … mú” fi ìṣe tí ó ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ìgbàgbọ́ Kristẹni; ó tún lè ní ìtumọ̀ ìgbẹ́kẹ̀lé, èyí tí àlàyé ìsàlẹ̀ mẹ́nu kàn.
- source_word: ἀγαθὴν συνείδησιν
  choice: ẹ̀rí-ọkàn rere
  rationale: Èyí túmọ̀ ἀγαθή ní tààrà gẹ́gẹ́ bí “rere,” kò sì dín ìtumọ̀ rẹ̀ kù sí ẹ̀rí-ọkàn tí kò ní ìdààmú nìkan.
- source_word: ἥν
  choice: èyí
  rationale: “Èyí” lè tọ́ka sí “ẹ̀rí-ọkàn rere,” èyí tó bá akọ abo àti nọ́ńbà Gíríìkì mu jù, ṣùgbọ́n kò fi agbára pa ìtumọ̀ tó lè ka gbogbo gbólóhùn tó ṣáájú pọ̀.
- source_word: ἀπωσάμενοι
  choice: ti kọ … sílẹ̀
  rationale: Ó fi ìkọ̀sílẹ̀ àfínnúfíndọ̀ṣe hàn ní Yorùbá òde òní, láìlo ọ̀rọ̀ tí kò wọ́pọ̀.
- source_word: περὶ τὴν πίστιν
  choice: ní ti ìgbàgbọ́
  rationale: Ó pa ìtumọ̀ ibi tàbí ọ̀nà tí ìparun náà kàn mọ́—ìgbàgbọ́—mọ́, láìsọ ọ́ di ohun mìíràn.
- source_word: ἐναυάγησαν
  choice: wọ́n sì ti rì bí ọkọ̀ ojú omi
  rationale: Ó pa àwòrán ìjamba ọkọ̀ ojú omi inú Gíríìkì mọ́, ó sì ṣe kedere ní Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí ἥν ń tọ́ka sí
  choice: Ní pàtàkì, “èyí” ń tọ́ka sí “ẹ̀rí-ọkàn rere.”
  alternative: Ó lè ṣàkópọ̀ “ìgbàgbọ́ àti ẹ̀rí-ọkàn rere” méjèèjì.
  rationale: ἥν jẹ́ arọ́pò-orúkọ abo ẹyọ kan, ó sì bá συνείδησιν, orúkọ abo ẹyọ tó sún mọ́ ọn jù, mu. Síbẹ̀, àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ tó gbòòrò sí i mọ́.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; tàbí, bó tilẹ̀ jẹ́ pé kò ṣeé ṣe tó bẹ́ẹ̀ níbí, ìṣòtítọ́
  rationale: Àyíká náà tọ́ka sí ìgbàgbọ́ Kristẹni, ṣùgbọ́n a kò fi ìtumọ̀ ìgbẹ́kẹ̀lé tó wà nínú ọ̀rọ̀ Gíríìkì pamọ́.
translation_notes:
  register: A lo Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Rì bí ọkọ̀ ojú omi” pa àwòrán Gíríìkì mọ́. Àmì ohùn kún ibi tí ó yẹ.
