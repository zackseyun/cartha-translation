source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: yo
  text: Ète[a] ìtọ́ni[b] náà ni ìfẹ́ láti inú ọkàn mímọ́, láti inú ẹ̀rí-ọkàn rere, àti láti inú ìgbàgbọ́ tí kò ní àgàbàgebè[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlépa” tàbí “àbájáde” ìtọ́ni náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àṣẹ” tàbí “ojúṣe tí a fi lé ẹni lọ́wọ́” dípò “ìtọ́ni.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “ìgbàgbọ́ tí kò ní àgàbàgebè”; πίστις tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé” tàbí “ìṣòtítọ́” ní àwọn àyíká ọ̀rọ̀ kan.
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: ète
  rationale: Ní àyíká ọ̀rọ̀ yìí, τέλος ń tọ́ka sí ète tàbí ohun tí ìtọ́ni náà fẹ́ mú ṣẹ, kì í ṣe òpin rẹ̀.
- source_word: παραγγελίας
  choice: ìtọ́ni
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí àṣẹ, ojúṣe tí a fi léni lọ́wọ́, tàbí ìtọ́ni; ‘ìtọ́ni’ bá iṣẹ́ Tímótì ní ẹsẹ 3–4 mu, kò sì dín ìtumọ̀ rẹ̀ kù sí àṣẹ líle nìkan.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédé fún ἀγάπη, ó sì bá ìtẹnumọ́ ìwà rere inú ẹsẹ náà mu.
- source_word: ἐκ
  choice: tí ó ti ... wá
  rationale: ἐκ fi orísun hàn; ìfẹ́ náà ń jáde láti inú àwọn ànímọ́ mẹ́tẹ̀ẹ̀ta tí a dárúkọ.
- source_word: καθαρᾶς καρδίας
  choice: ọkàn mímọ́
  rationale: Ó pa ìtumọ̀ ìwà mímọ́ àti ìwà inú mọ́ ní èdè Yorùbá àdánidá.
- source_word: συνειδήσεως ἀγαθῆς
  choice: ẹ̀rí-ọkàn rere
  rationale: ‘Rere’ sún mọ́ ἀγαθῆς ju ọ̀rọ̀ tí yóò túmọ̀ sí pé ẹ̀rí-ọkàn náà wà láìní ẹ̀bi lọ.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ níbí, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ ‘ìgbẹ́kẹ̀lé’ àti ‘ìṣòtítọ́’ mọ́.
- source_word: ἀνυποκρίτου
  choice: àìṣẹ̀tàn
  rationale: Ó sọ pé ìgbàgbọ́ náà kì í ṣe ti àgàbàgebè tàbí ti ẹ̀tàn; ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ ìgbàgbọ́ tòótọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ jẹ́ àmì ìyípadà tàbí ìyàtọ̀ pẹ̀lẹ́ sí ohun tí a sọ ṣáájú; ‘Ṣùgbọ́n’ jẹ́ kí ìbáṣepọ̀ yìí hàn láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú πίστεως ἀνυποκρίτου
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: Àyíká ọ̀rọ̀ náà lè tọ́ka sí ìgbàgbọ́ Kristẹni tòótọ́, ṣùgbọ́n πίστις tún lè ní ìtumọ̀ ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́. A kò fi ìtumọ̀ kan ṣoṣo lé e lórí lọ́nà ẹ̀kọ́ ìsìn; a pa àwọn mìíràn mọ́ sínú àlàyé.
translation_notes:
  register: A lo èdè Yorùbá boṣewa, olóhùn-kíkún, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Ìtòlẹ́sẹẹsẹ ‘tí ó ti ... wá’ mú orísun ìfẹ́ náà hàn kedere, ó sì so àwọn ànímọ́ mẹ́tẹ̀ẹ̀ta pọ̀.
