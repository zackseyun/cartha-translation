  text: Command these things and teach them[a].
translation:
  language: yo
  text: Máa paṣẹ nípa àwọn nǹkan wọ̀nyí, kí o sì máa kọ́ àwọn nǹkan wọ̀nyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Máa tọ́ni sọ́nà nípa àwọn nǹkan wọ̀nyí, kí o sì máa kọ́ àwọn nǹkan wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράγγελλε
  choice: kí o máa pàṣẹ
  rationale: Ọ̀rọ̀-ìṣe àṣẹ ní ìsinsìnyí yìí ń tọ́ka sí iṣẹ́ tí Timotiu gbọ́dọ̀ máa bá a lọ ní ọ̀nà aláṣẹ. “Máa pàṣẹ” pa agbára ìtọ́nisọ́nà náà mọ́, kò sì sọ ọ́ di ìmọ̀ràn lásán.
- source_word: ταῦτα
  choice: Nǹkan wọ̀nyí
  rationale: Arọ́pò-orúkọ atọ́ka aláìlẹ́mìí ọ̀pọ̀ ń tọ́ka padà sí àwọn ẹ̀kọ́ tàbí ìtọ́nisọ́nà tí a ṣẹ̀ṣẹ̀ sọ. Gbólóhùn àfojúsùn “Nǹkan wọ̀nyí ni” jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀pọ̀ mọ́.
- source_word: καὶ
  choice: kí o sì
  rationale: Ó so àwọn àṣẹ méjèèjì pọ̀ ní ọ̀nà Yorùbá tí ó rọrùn, tí ó sì bá ìṣọ̀kan Gíríìkì mu.
- source_word: δίδασκε
  choice: máa kọ́ni
  rationale: Àṣẹ ìsinsìnyí náà fi iṣẹ́ tí ó ń tẹ̀ síwájú hàn. “Kọ́ni” túmọ̀ sí kí a kọ́ àwọn ènìyàn, láìfi ohun tí kò sí nínú Gíríìkì kún un gẹ́gẹ́ bí ohun tààrà fún ọ̀rọ̀-ìṣe náà.
theological_decisions:
- issue: Agbára iṣẹ́ olùṣọ́-àgùntàn tí παραγγέλλω ń tọ́ka sí
  choice: Lo “máa pàṣẹ” pẹ̀lú agbára àṣẹ.
  alternative: Lo “máa fúnni ní ìtọ́nisọ́nà,” èyí tí ó lè rọ agbára ọ̀rọ̀ náà kù.
  rationale: Παράγγελλε jẹ́ àṣẹ sí Timotiu láti máa sọ ohun tí a gbọ́dọ̀ ṣe ní ọ̀nà aláṣẹ. Ìtumọ̀ yìí pa agbára ọ̀rọ̀ Gíríìkì mọ́ láìfi èrò àjọ-ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìlò “Nǹkan wọ̀nyí ni” jẹ́ àfojúsùn Yorùbá àdánidá, “máa” sì mú ìtẹ̀síwájú àwọn àṣẹ méjèèjì jáde.
