  text: ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/002.yaml
  text: through the hypocrisy of liars whose own conscience has been seared,[a]
translation:
  language: yo
  text: nípasẹ̀ ìwà àgàbàgebè àwọn òpùrọ́ tí a ti fi irin gbígbóná sun ẹ̀rí-ọkàn ara wọn,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a ti fi àmì irin gbígbóná sí ẹ̀rí-ọkàn ara wọn,” tàbí, “àwọn tí a ti cauterize ẹ̀rí-ọkàn ara wọn.” Àwòrán ọ̀rọ̀ Gíríìkì lè tọ́ka sí ẹ̀rí-ọkàn tí a fi àmì sí tàbí tí a ti mú di aláìní ìmọ̀lára.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: nípasẹ̀
  rationale: Nínú gbólóhùn yìí, ἐν ń tọ́ka sí ọ̀nà tàbí ohun èlò tí ohun inú ẹsẹ tó ṣáájú fi ń ṣẹlẹ̀; “nípasẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: ὑποκρίσει
  choice: àgàbàgebè
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìwà ẹni tí ó ń díbọ́n pé ó dára tàbí pé ó jẹ́ ohun tí kì í ṣe; “àgàbàgebè” mú ìtumọ̀ náà jáde ní kedere.
- source_word: ψευδολόγων
  choice: àwọn òpùrọ́
  rationale: Ọ̀rọ̀ náà ń ṣàpèjúwe àwọn ènìyàn tí irọ́ pípa jẹ́ àbùdá wọn; ìbáṣepọ̀ genitive rẹ̀ pẹ̀lú ὑποκρίσει ni a pa mọ́ gẹ́gẹ́ bí “àgàbàgebè àwọn òpùrọ́.”
- source_word: κεκαυστηριασμένων
  choice: ẹni tí a fi irin gbígbóná jó
  rationale: Àpólà perfect passive náà ń fi ipò tí iṣẹ́ jíjó tàbí fífi àmì sílẹ̀ ti yọrí sí hàn. Gbólóhùn aláṣe-àìlórúkọ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán Gíríìkì mọ́ láì pinnu bóyá fífi àmì tàbí mímú ẹ̀rí-ọkàn kú-inú ni ó ṣe pàtàkì jù.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: ẹ̀rí-ọkàn tiwọn fúnra wọn
  rationale: “Ẹ̀rí-ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún συνείδησις, “tiwọn fúnra wọn” sì pa agbára ἰδίαν mọ́. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, Yorùbá lè lò ó ní ìtumọ̀ pínpín fún gbogbo àwọn ẹni náà.
theological_decisions:
- issue: Agbára àfiwé κεκαυστηριασμένων
  choice: A túmọ̀ rẹ̀ sí “a fi irin gbígbóná jó ẹ̀rí-ọkàn,” kí àwòrán jíjó tàbí fífi àmì pẹ̀lú irin gbígbóná lè dúró.
  alternative: “a fi àmì irin gbígbóná sí ẹ̀rí-ọkàn wọn” tàbí “a sun ẹ̀rí-ọkàn wọn débi tí kò fi ní ìmọ̀lára mọ́.”
  rationale: Ọ̀rọ̀ Gíríìkì lè mú fífi àmì pẹ̀lú irin gbígbóná tàbí jíjó tí ń mú ibi kan kú-inú wá sí ọkàn. A kò sọ pé wọn kò lè ronú pìwà dà mọ́, bẹ́ẹ̀ ni a kò fi dandan sọ pé àmì ìní ni; èyí pa àìdánilójú àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú àwòrán náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tó sì ṣeé lóye ni a lò. “Àgàbàgebè” àti “ẹ̀rí-ọkàn” jẹ́ àwọn ọ̀rọ̀ tí ó wọ́pọ̀ nínú ìsọ̀rọ̀ ìwà rere àti ti ẹ̀sìn. A pa ìṣàn gbólóhùn mọ́ gẹ́gẹ́ bí àpólà tó ń bá ẹsẹ tó ṣáájú lọ, nítorí pé orísun Gíríìkì kì í ṣe gbólóhùn tó dá dúró níbí.
