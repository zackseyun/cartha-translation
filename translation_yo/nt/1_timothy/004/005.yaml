  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: yo
  text: nítorí a sọ ọ́ di mímọ́[a] nípasẹ̀ ọ̀rọ̀ Ọlọ́run àti àdúrà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “a yà á sí mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìbẹ̀bẹ̀” tàbí “àdúrà ìbẹ̀bẹ̀ fún ẹlòmíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: a sọ ọ́ di mímọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀-ìṣe àkókò ìsinsìnyí ní ohùn àfaragà, ó sì ń tọ́ka sí oúnjẹ tí ẹsẹ tó ṣáájú mẹ́nu kàn. “A sọ ọ́ di mímọ́” jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ pé a yà á sí mímọ́ mọ́, láì sọ ọ́ di ọ̀rọ̀ ìwẹ̀numọ́ ìwà tàbí ìgbàlà.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ń ṣàlàyé ìdí ọ̀rọ̀ tó ṣáájú; “nítorí” mú ipa ìṣàlàyé náà jáde ní Yorùbá kedere.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní genitive, διά ń tọ́ka sí ọ̀nà tàbí ohun èlò tí a fi ṣe ohun kan; “nípasẹ̀” pa ìtumọ̀ yìí mọ́.
- source_word: λόγου θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ìtumọ̀ tààrà ni èyí fún àkójọpọ̀ genitive náà, ó sì fi sílẹ̀ láì pinnu bóyá ó ń tọ́ka sí Ìwé Mímọ́, ọ̀rọ̀ ìkéde Ọlọ́run, tàbí àṣẹ rẹ̀ ní ìtumọ̀ gbòòrò.
- source_word: ἐντεύξεως
  choice: àdúrà
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ẹ̀bẹ̀ tàbí àdúrà àlàbápín, “àdúrà” bá ọ̀rọ̀ yíyìn Ọlọ́run lórí oúnjẹ mu dáadáa, kò sì fi ìtumọ̀ tóóró kan lé e lórí. Àwọn ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ èdè sísọ di mímọ́ nínú àyíká ọ̀rọ̀ náà
  choice: Ẹsẹ náà ń sọ pé a ya oúnjẹ sí mímọ́ gẹ́gẹ́ bí ohun tí ó yẹ fún lílò àti gbígbà pẹ̀lú ọpẹ́.
  alternative: A lè ka ọ̀rọ̀ náà ní ìtumọ̀ ẹ̀sìn tó gbòòrò sí i gẹ́gẹ́ bí “a sọ ọ́ di mímọ́.”
  rationale: Àyíká ọ̀rọ̀ 1 Tímótì 4:3-4 dá lórí oúnjẹ tí a ń gbà pẹ̀lú ìdúpẹ́. Ìtumọ̀ yìí pa èdè ìsọdimímọ́ mọ́, ṣùgbọ́n kò fi ẹ̀kọ́ nípa sáńkírámẹ́ńtì, ìwẹ̀numọ́ ìwà, tàbí ìgbàlà kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. Ọ̀rọ̀ arọ́pò “ọ́” ń tọ́ka sí oúnjẹ tí a mẹ́nu kàn nínú ẹsẹ tó ṣáájú.
