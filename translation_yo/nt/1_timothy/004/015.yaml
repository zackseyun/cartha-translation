source:
  edition: SBLGNT
  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: yo
  text: Máa ṣe àwọn nǹkan wọ̀nyí ní ìdúróṣinṣin; máa wà nínú wọn[a], kí ìlọsíwájú rẹ lè hàn kedere sí gbogbo ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi gbogbo ara rẹ sí wọn.” Ní tààràtà, èdè Gíríìkì sọ pé, “wà nínú àwọn nǹkan wọ̀nyí,” èyí tí ó fi ìfọkànsìn jíjinlẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó ń tọ́ka sí àwọn ìtọ́ni tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ fún Timotiu; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí kò fi ìtumọ̀ míì kún un.
- source_word: μελέτα
  choice: máa fi ìtara ṣe
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífi èrò sí ohun kan àti ṣíṣe é ní ìdúróṣinṣin. Nínú àyíká yìí, gbólóhùn yìí mú ìfọkànsìn àti ìṣe tí ń bá a lọ papọ̀, láì dín un kù sí àṣàrò inú nìkan.
- source_word: ἐν τούτοις ἴσθι
  choice: máa wà nínú wọn
  rationale: Èyí pa àwòrán gíríìkì náà mọ́ ní tààràtà, ó sì ń sọ nípa kíkó ara ẹni sínú àwọn ojúṣe náà pátápátá. Àlàyé ìsàlẹ̀ fi ọ̀nà Yorùbá tí ó túbọ̀ ṣàlàyé rẹ̀ hàn.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a ń retí hàn.
- source_word: σου
  choice: rẹ
  rationale: Arọ́pò-orúkọ olódùmarè ẹni kejì tí ó ń ṣe àpèjúwe ‘ìlọsíwájú.’
- source_word: προκοπή
  choice: ìlọsíwájú
  rationale: Ó pa ìtumọ̀ ìtẹ̀síwájú tàbí ìdàgbàsókè mọ́, láì fi mọ́ ìdàgbàsókè ẹ̀mí nìkan tàbí òye iṣẹ́ ìránṣẹ́ nìkan.
- source_word: φανερὰ ᾖ
  choice: lè hàn kedere
  rationale: Ó sọ pé ìlọsíwájú Timotiu yóò ṣeé rí, yóò sì ṣe kedere ní gbangba.
- source_word: πᾶσιν
  choice: sí gbogbo ènìyàn
  rationale: Èyí fi hàn pé gbogbo àwọn ènìyàn tí ọ̀rọ̀ náà kàn ló yẹ kí wọ́n rí ìlọsíwájú náà.
theological_decisions:
- issue: Ìwọ̀n ohun tí ìlọsíwájú Timotiu kàn
  choice: Ìlọsíwájú rẹ̀ lápapọ̀ nínú àwọn ìtọ́ni tí a fún un, tó kan ẹ̀kọ́, ìwà, àti ìfọkànsìn
  alternative: Ìdàgbàsókè ẹ̀mí nìkan, tàbí ìmúṣẹ iṣẹ́ ìránṣẹ́ nìkan
  rationale: Ọ̀rọ̀ προκοπή àti àyíká ẹsẹ náà gbòòrò ju apá kan ṣoṣo lọ; nítorí náà, ‘ìlọsíwájú’ pa ìfẹ̀hónúhàn inú ọ̀rọ̀ náà mọ́ láì fi ẹ̀kọ́ ìsìn kan tí kò fara hàn sínú rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. ‘Máa’ fi ìṣe tí ń bá a lọ hàn; a pa àwòrán ‘wà nínú wọn’ mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
