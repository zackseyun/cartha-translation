  to: Má ṣe kọ ẹ̀bùn tí ó wà nínú rẹ sílẹ̀, èyí tí a fi fún ọ nípasẹ̀ àsọtẹ́lẹ̀[a], pẹ̀lú fífi ọwọ́ àwọn alàgbà lápapọ̀ lé ọ lórí.[b]
