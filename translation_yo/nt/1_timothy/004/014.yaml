  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa àwọn ẹ̀ka pàtàkì Gíríìkì mọ́: ìkìlọ̀ láti má ṣe gbójú kọ ẹ̀bùn náà, ipò rẹ̀ ‘nínú rẹ,’ ohùn àfarawà ‘a fi fún ọ,’ διά προφητείας, àti ìkópa ara àwọn alàgbà. Ṣùgbọ́n ‘fífi ọwọ́ ìgbìmọ̀ àwọn alàgbà lé ọ lórí’ lè dà bí ẹni pé ‘ìgbìmọ̀’ fúnra rẹ̀ ní ọwọ́, ó sì nílò ìtúnṣe kí ìtumọ̀ τῶν χειρῶν τοῦ πρεσβυτερίου hàn ní kedere.'
  naturalness: ‘Má ṣe ṣàìnáání ẹ̀bùn’ kì í ṣe ọ̀nà tí ó rọrùn jù lọ nínú Yorùbá òde òní fún ìkìlọ̀ yìí. ‘Má ṣe kọ ... sílẹ̀’ jẹ́ ọ̀nà àdánidá tí ó yẹ fún ‘má ṣe ṣàìbójútó/má ṣe gbójú kọ.’ Àtúnṣe sí ‘fífi ọwọ́ àwọn alàgbà lápapọ̀ lé ọ lórí’ tún mú gbolohun náà rọrùn.
  terminology: ‘Ẹ̀bùn,’ ‘àsọtẹ́lẹ̀,’ àti ‘àwọn alàgbà’ bójú mu, wọ́n sì yẹra fún fífi ẹ̀kọ́ ìjọ ẹ̀sìn tàbí ìtumọ̀ pàtó tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un. ‘Àwọn alàgbà lápapọ̀’ fi ìtumọ̀ alájọṣepọ̀ ti πρεσβυτερίου hàn láìlo ọ̀rọ̀ ẹ̀sìn-ẹ̀ka.
  issues:
