id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: yo
  text: Má ṣe kọ ẹ̀bùn tí ó wà nínú rẹ sílẹ̀, èyí tí a fi fún ọ nípasẹ̀ àsọtẹ́lẹ̀[a], pẹ̀lú fífi ọwọ́ àwọn alàgbà lápapọ̀ lé ọ lórí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ọ̀rọ̀ àsọtẹ́lẹ̀.” Gbólóhùn náà lè túmọ̀ sí pé àsọtẹ́lẹ̀ bá fífi ẹ̀bùn náà fún un lọ, tàbí pé ó jẹ́ ọ̀nà tí a gbà fi fún un.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìgbìmọ̀ àwọn alàgbà” tàbí “àwùjọ àwọn alàgbà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí gbogbo ara àwọn alàgbà lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Má ṣe ṣàìnáání
  rationale: Ó sọ ìkìlọ̀ tí ń bá a lọ pé kí Timotiu má ṣe kọ ẹ̀bùn náà sílẹ̀ tàbí ṣàìfiyèsí rẹ̀; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì bá ìtumọ̀ ἀμελέω mu.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: ẹ̀bùn tí ó wà nínú rẹ
  rationale: Èyí pa ìtumọ̀ χάρισμα mọ́ gẹ́gẹ́ bí ẹ̀bùn oore-ọ̀fẹ́ láìfi ọ̀rọ̀ ‘ti Ẹ̀mí’ kún ohun tí Gíríìkì kò sọ ní tààrà, ó sì tún pa ἐν σοὶ, ‘nínú rẹ,’ mọ́.
- source_word: ἐδόθη σοι
  choice: a fi fún ọ
  rationale: Ìtumọ̀ aláìlórúkọ olùṣe yìí pa ohùn àfarawà Gíríìkì mọ́, láìsọ ẹni tí ó fún un ní ohun tí ẹsẹ náà kò sọ ní gbangba.
- source_word: διὰ προφητείας
  choice: nípasẹ̀ àsọtẹ́lẹ̀
  rationale: ‘Nípasẹ̀’ fi iṣẹ́ διά pẹ̀lú ẹ̀yà-orúkọ hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò; ‘àsọtẹ́lẹ̀’ kò pinnu bóyá àsọtẹ́lẹ̀ náà bá ìfúnni náà lọ tàbí ó jẹ́ ọ̀nà rẹ̀.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: pẹ̀lú fífi ọwọ́ ... lé ọ lórí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún iṣẹ́ ìfọwọ́lélórí, ó sì pa ìtumọ̀ ‘pẹ̀lú’ ti μετά mọ́.
- source_word: τοῦ πρεσβυτερίου
  choice: ìgbìmọ̀ àwọn alàgbà
  rationale: πρεσβυτέριον tọ́ka sí àwùjọ àwọn alàgbà, kì í ṣe alàgbà kan ṣoṣo; ‘ìgbìmọ̀ àwọn alàgbà’ ṣe kedere láìkó ètò ìjọ ẹ̀sìn kan tí ó wáyé lẹ́yìn náà wọ inú ẹsẹ náà.
theological_decisions:
- issue: Bóyá kí χάρισμα ní àlàyé pàtó pé ẹ̀bùn Ẹ̀mí tàbí ẹ̀bùn iṣẹ́ ìránṣẹ́ ni
  choice: ẹ̀bùn
  alternative: ẹ̀bùn Ẹ̀mí
  rationale: Àyíká lè tọ́ka sí ẹ̀bùn fún iṣẹ́ ìránṣẹ́, ṣùgbọ́n Gíríìkì sọ χάρισμα nìkan. ‘Ẹ̀bùn’ yàgò fún dídín ìtumọ̀ rẹ̀ kù sí ẹ̀kọ́ ìsìn kan.
- issue: Ìbáṣepọ̀ àsọtẹ́lẹ̀ pẹ̀lú fífi ẹ̀bùn náà fún Timotiu
  choice: nípasẹ̀ àsọtẹ́lẹ̀
  alternative: nípasẹ̀ ọ̀rọ̀ àsọtẹ́lẹ̀
  rationale: Ìtumọ̀ yìí pa agbára ohun èlò ti διά mọ́, ṣùgbọ́n kò fi tipátipá pinnu bóyá àsọtẹ́lẹ̀ náà jẹ́ olùdásílẹ̀, alábàákẹ́gbẹ́, tàbí ìjẹ́rìí sí ìfúnni náà.
- issue: Bí a ṣe máa túmọ̀ πρεσβυτέριον láìgbé ètò ìṣàkóso ìjọ kan ga ju òmíràn lọ
  choice: ìgbìmọ̀ àwọn alàgbà
  alternative: àwùjọ àwọn alàgbà
  rationale: Èyí fi hàn pé ara àwọn alàgbà lápapọ̀ ni Gíríìkì ń tọ́ka sí, láìfi orúkọ ẹ̀ka ìjọ tàbí ètò ẹ̀sìn òde òní kún un.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ. ‘Ṣàìnáání’ jẹ́ ọ̀rọ̀ ìkìlọ̀ tó lágbára ṣùgbọ́n tó wọ́pọ̀; ‘fífi ọwọ́ ... lé ọ lórí’ jẹ́ àfihàn àdánidá fún iṣẹ́ ìfọwọ́lélórí.
