    rationale: Nínú Yorùbá, àgbékalẹ̀ yìí lè so ‘ọwọ́’ mọ́ ‘ìgbìmọ̀,’ dípò kí ó sọ pé àwọn alàgbà ni wọ́n fi ọwọ́ lé ẹni náà lórí. A tún un ṣe kí olùṣe ìṣe náà hàn gbangba.
  - severity: low
    issue: ‘Má ṣe ṣàìnáání ẹ̀bùn’ kò rọrùn tó nínú ìlò òde òní.
    rationale: Bí ó tilẹ̀ jẹ́ pé ó lè ṣeé lóye, ‘Má ṣe kọ ẹ̀bùn náà sílẹ̀’ jẹ́ ìlò Yorùbá tí ó dájú jù lọ fún ìkìlọ̀ μὴ ἀμέλει.
