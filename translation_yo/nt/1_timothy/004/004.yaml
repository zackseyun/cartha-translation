  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: yo
  text: Nítorí gbogbo ohun tí Ọlọ́run dá dára[a], kò sì sí ohun kan tí ó yẹ kí a kọ̀ sílẹ̀, bí a bá fi ìdúpẹ́ gbà á[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀dá Ọlọ́run kọ̀ọ̀kan dára.” Ọ̀rọ̀ Gíríìkì κτίσμα lè túmọ̀ sí “ẹ̀dá” tàbí, ní ìtumọ̀ tó gbòòrò, “ohun tí a dá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kò sí ohun kan tí a lè kọ̀ sílẹ̀ nígbà tí a bá fi ìdúpẹ́ gbà á.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń fi ìdí tàbí àlàyé ọ̀rọ̀ tó ṣáájú hàn, ó sì bá ìṣàn èdè Yorùbá mu.
- source_word: πᾶν κτίσμα θεοῦ
  choice: gbogbo ohun tí Ọlọ́run dá
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ aláìlẹ́gbẹ̀ ti πᾶν pẹ̀lú ìwọ̀n gbígbòòrò κτίσμα wá sí Yorùbá, láì dín un kù sí ẹranko tàbí oúnjẹ nìkan.
- source_word: καλόν
  choice: dára
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun kan jẹ́ rere tàbí ó bójú mu, ó sì pa ìrántí èdè ìṣẹ̀dá mọ́.
- source_word: οὐδὲν ἀπόβλητον
  choice: kò sì sí ohun kan tí ó yẹ kí a kọ̀ sílẹ̀
  rationale: Ó sọ ìtumọ̀ ajẹtífù ἀπόβλητον ní èdè Yorùbá tó ṣe kedere, gẹ́gẹ́ bí ohun tí kò yẹ fún ìkọ̀sílẹ̀.
- source_word: μετὰ εὐχαριστίας
  choice: fi ìdúpẹ́
  rationale: “Ìdúpẹ́” pa èrò fífi ọpẹ́ fún Ọlọ́run mọ́, ó sì jẹ́ ọ̀rọ̀ tí ó wọ́pọ̀, tí ó ní iyì.
- source_word: λαμβανόμενον
  choice: bí a bá ... gbà á
  rationale: Gbólóhùn oníṣ شرط yìí fi ipò tí participle náà tọ́ka sí hàn ní Yorùbá àdánidá, láì fi ohun míì kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ κτίσμα nínú àyíká ọ̀rọ̀ nípa oúnjẹ
  choice: gbogbo ohun tí Ọlọ́run dá
  alternative: ẹ̀dá Ọlọ́run kọ̀ọ̀kan; gbogbo oúnjẹ tí Ọlọ́run dá
  rationale: Ọ̀rọ̀ Gíríìkì gbòòrò ju oúnjẹ nìkan lọ, bí ó tilẹ̀ jẹ́ pé oúnjẹ wà nínú àyíká ọ̀rọ̀ náà. Ìtumọ̀ yìí kò fi ìlànà ẹ̀kọ́ ẹ̀sìn kan kún un, kò sì dín ìtumọ̀ rẹ̀ kù.
- issue: Agbára oníṣ شرط ti λαμβανόμενον pẹ̀lú μετὰ εὐχαριστίας
  choice: bí a bá fi ìdúpẹ́ gbà á
  alternative: nígbà tí a bá fi ìdúpẹ́ gbà á; tí a ń fi ìdúpẹ́ gbà
  rationale: “Bí” ń jẹ́ kí ìbáṣepọ̀ láàárín àìkọ ohun náà sílẹ̀ àti gbígbà á pẹ̀lú ìdúpẹ́ ṣe kedere, láì sọ pé participle náà ní agbára oníṣ شرط tí kò ṣeé yí padà.
translation_notes:
  register: A lo èdè Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, tó bójú mu, tó sì yé òǹkàwé òde òní. Gbólóhùn náà pa ìṣàn ọ̀rọ̀ mọ́ pẹ̀lú àmì kọ́ńmá ní òpin, nítorí ẹsẹ̀ náà ń bá a lọ sínú ẹsẹ̀ tó tẹ̀ lé e.
