id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: yo
  text: Nípa gbígbé àwọn nǹkan wọ̀nyí kalẹ̀ fún àwọn arákùnrin[a], ìwọ yóò jẹ́ ìránṣẹ́ rere fún Mèsáyà Jésù[b], ẹni tí a ń tọ́ dàgbà nínú àwọn ọ̀rọ̀ ìgbàgbọ́[c] àti nínú ẹ̀kọ́ rere tí o ti tẹ̀ lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin” lè tọ́ka sí gbogbo àwọn onígbàgbọ́ ní àyíká yìí, obìnrin àti ọkùnrin.
    reason: cultural_note
  - marker: b
    text: Tàbí, “Kristi Jésù.” A túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” níhìn-ín láti mú ìtumọ̀ rẹ̀ hàn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn ọ̀rọ̀ ti ìgbàgbọ́.” Ó ṣeé ṣe pé “ìgbàgbọ́” níhìn-ín ń tọ́ka sí àkóónú ìgbàgbọ́ Kristẹni tí a mọ̀ sí mímọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí ọ̀pọ̀ ìkìlọ̀ àti ìtọ́ni tí ó ṣáájú, ó sì pa ìtumọ̀ ọ̀pọ̀ nǹkan mọ́.
- source_word: ὑποτιθέμενος
  choice: fífi ... síwájú
  rationale: Ó pa àwòrán ìpilẹ̀ṣẹ̀ Gíríìkì mọ́—gbígbé ọ̀ràn kalẹ̀ níwájú àwọn ènìyàn—ní ọ̀nà tí ó ṣeé lóye ní Yorùbá.
- source_word: τοῖς ἀδελφοῖς
  choice: àwọn arákùnrin
  rationale: Ó tẹ̀ lé irú akọ ọ̀pọ̀ ti ọ̀rọ̀ Gíríìkì; àlàyé ìsàlẹ̀ sọ pé ó lè kan gbogbo àwọn onígbàgbọ́.
- source_word: καλὸς
  choice: rere
  rationale: Nínú àyíká yìí, ó ṣàpèjúwe bí iṣẹ́ ìránṣẹ́ náà ṣe dára, láì gbé ìtumọ̀ náà ga ju ohun tí Gíríìkì sọ lọ.
- source_word: διάκονος
  choice: ìránṣẹ́
  rationale: Níhìn-ín ọ̀rọ̀ náà ṣàpèjúwe ẹni tí ń ṣe iṣẹ́ ìránṣẹ́, kì í ṣe dandan ipò ìjọ tí a ń pè ní díákónì.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: A túmọ̀ Χριστός gẹ́gẹ́ bí oyè ‘Mèsáyà,’ a sì ṣe àfọwọkọ orúkọ Ἰησοῦ gẹ́gẹ́ bí ‘Jésù.’
- source_word: ἐντρεφόμενος
  choice: tí o ń jẹ oúnjẹ láti inú
  rationale: Ó pa àwòrán jíjẹ oúnjẹ tàbí gbígba ìtọ́jú tí ń mú ènìyàn dàgbà mọ́, ó sì fi ìṣe tí ń bá a lọ hàn.
- source_word: τοῖς λόγοις
  choice: àwọn ọ̀rọ̀
  rationale: ‘Àwọn ọ̀rọ̀’ pa ìtumọ̀ λόγοις mọ́, dípò yíyí gbogbo rẹ̀ padà sí ‘ẹ̀kọ́.’
- source_word: τῆς πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú ìsopọ̀ rẹ̀ pẹ̀lú ‘ẹ̀kọ́ rere,’ ó ṣeé ṣe kí ó tọ́ka sí àkóónú ìgbàgbọ́ Kristẹni tí a mọ̀ sí mímọ́; àlàyé ìsàlẹ̀ pa ìtumọ̀ míì mọ́.
- source_word: τῆς καλῆς διδασκαλίας
  choice: ẹ̀kọ́ rere
  rationale: Ó jẹ́ ìtumọ̀ taara, tó ṣe kedere, tí διδασκαλία àti καλῆς, láì rọ́pò ‘rere’ pẹ̀lú ìtumọ̀ àlàyé bí ‘tí kò ní àṣìṣe.’
- source_word: παρηκολούθηκας
  choice: tí o ti tẹ̀ lé
  rationale: Ó lè kó ìtẹ̀lé pẹ̀lú àfiyèsí àti dídúró ṣinṣin nínú ẹ̀kọ́ náà pọ̀, láì fi ọ̀kan ṣoṣo lára wọn múlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ní agbára oyè níhìn-ín; ‘Mèsáyà’ mú ìtumọ̀ ẹni àmì òróró náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìlò ìbílẹ̀ ‘Kristi’ mọ́.
- issue: Àwọn tí τοῖς ἀδελφοῖς ń tọ́ka sí
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, ṣùgbọ́n nínú ìlò ìjọ àkọ́kọ́ ó lè kó gbogbo àwọn onígbàgbọ́, tóbìnrin-tọkùnrin, sínú.
- issue: Ìtumọ̀ πίστις nínú τῆς πίστεως
  choice: ìgbàgbọ́ gẹ́gẹ́ bí àkóónú ohun tí a gbàgbọ́
  alternative: ìgbàgbọ́ ẹni; ìṣòtítọ́
  rationale: Àmì pàtó inú Gíríìkì àti ìsopọ̀ rẹ̀ pẹ̀lú ‘ẹ̀kọ́’ ṣe àtìlẹ́yìn fún ìtumọ̀ àkóónú ìgbàgbọ́, ṣùgbọ́n a kò fi ìtumọ̀ yìí lé e lórí nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán ‘fífi síwájú’ àti ‘jíjẹ oúnjẹ’ mọ́, ṣùgbọ́n a ṣètò wọn ní ọ̀nà adayeba fún olùkà Yorùbá.
