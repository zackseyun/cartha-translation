  source_fidelity: Ìtumọ̀ náà ṣàfihàn dáadáa ìtọ́kasí ọ̀pọ̀ ti Ταῦτα, ìṣe fífi ọ̀ràn náà hàn fún àwọn arákùnrin, àti ìbátan ᾗ sí ‘ẹ̀kọ́ rere.’ Ṣùgbọ́n ‘tí o ń jẹ oúnjẹ láti inú àwọn ọ̀rọ̀’ yí ἐντρεφόμενος padà sí ìṣe tí Timotiu ń ṣe fúnra rẹ̀, ó sì jẹ́ ọ̀rọ̀ tí kò rọrùn ní Yorùbá. A tún lè sọ ὑποτιθέμενος ní ọ̀nà Yorùbá tó dára jù, láì pàdánù àwòrán ‘gbígbé kalẹ̀/fífi hàn.’
  naturalness: ‘Gbígbé ... kalẹ̀ fún’ jẹ́ ọ̀nà adayeba fún fífi àwọn ìtọ́ni tàbí ìkìlọ̀ hàn fún ìjọ. ‘Tí a ń tọ́ ọ́ dàgbà nínú ...’ ń mú ìtumọ̀ ìtọ́jú/ìmúdagba tí ἐντρεφόμενος ní wá ní Yorùbá boṣewa, ó sì yẹ fún kíkà ní gbangba.
  terminology: ‘Àwọn arákùnrin,’ ‘ìránṣẹ́,’ ‘Mèsáyà Jésù,’ ‘ìgbàgbọ́,’ àti ‘ẹ̀kọ́ rere’ jẹ́ àwọn yíyan tí ó bá Gíríìkì àti ìlànà iṣẹ́ náà mu. Àlàyé ‘Kristi Jésù’ yẹ kí ó dúró gẹ́gẹ́ bí ìyàn míì. Àlàyé ìsàlẹ̀ fún ìgbàgbọ́ ni a ṣàtúnṣe kí ó má ṣe gbé ìtumọ̀ ‘àwọn ọ̀rọ̀ tó ń mú ìgbàgbọ́ wá’ kalẹ̀, èyí tí kì í ṣe ìtumọ̀ ìyàn gangan nínú gbolohun Gíríìkì.
