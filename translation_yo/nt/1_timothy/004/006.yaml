    rationale: Ìyẹn tún un ṣe sí gbolohun ìdí, kì í ṣe ìyàn tó sun mọ́ ‘τῶν λόγων τῆς πίστεως.’ Àlàyé náà yẹ kí ó ṣàlàyé ìtumọ̀ ‘ìgbàgbọ́’ gẹ́gẹ́ bí àkóónú ìgbàgbọ́ tí a mọ̀, níwọ̀n bí ọ̀rọ̀ pàtàkì ti ti lo ‘àwọn ọ̀rọ̀ ìgbàgbọ́’ tẹ́lẹ̀.
