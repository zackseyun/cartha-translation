lexical_decisions:
- source_word: πιστὸς
  choice: ṣeé gbẹ́kẹ̀ lé
  rationale: Nínú gbólóhùn pàtó πιστὸς ὁ λόγος, ọ̀rọ̀ náà túmọ̀ sí pé ohun tí a sọ ṣe é fọkàn tán, ó sì ṣeé gbẹ́kẹ̀ lé; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá ju lílo ‘olóòtítọ́’ lọ fún ọ̀rọ̀ kan.
- source_word: ὁ λόγος
  choice: Ọ̀rọ̀ yìí
  rationale: Níbí, λόγος ń tọ́ka sí ọ̀rọ̀ tàbí gbólóhùn kan pàtó. ‘Ọ̀rọ̀ yìí’ bá ìlò Yorùbá mu, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn tí ó gbooro sí i.
- source_word: πάσης
  choice: pátápátá
  rationale: Nínú πάσης ἀποδοχῆς, πάσης ń fi hàn pé ìtẹ́wọ́gbà náà gbọ́dọ̀ pé, láìsí àṣekù; ‘pátápátá’ sọ agbára ìtumọ̀ yìí ní Yorùbá àdánidá.
- source_word: ἀποδοχῆς
  choice: ìtẹ́wọ́gbà
  rationale: ἀποδοχή túmọ̀ sí gbígba ohun kan tọkàntọkàn tàbí kí a tẹ́wọ́ gbà á. ‘Ìtẹ́wọ́gbà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí kò sì dín ìtumọ̀ náà kù sí ìfọwọ́sí nìkan.
- source_word: ἄξιος
  choice: yẹ fún
  rationale: ἄξιος pẹ̀lú ọ̀rọ̀ inú genitive túmọ̀ sí ‘yẹ fún’ tàbí ‘tọ́ sí’; ‘yẹ fún’ jẹ́ ọ̀nà tó ṣe tààrà, tó sì wọ́pọ̀ ní Yorùbá.
