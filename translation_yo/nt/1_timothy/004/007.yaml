  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: yo
  text: Ṣùgbọ́n, kọ̀ àwọn ìtàn àròsọ aláìbọ̀wọ̀ fún ohun mímọ́ àti ti àwọn obìnrin arúgbó sílẹ̀[a]; kí o sì máa kọ́ ara rẹ lẹ́kọ̀ọ́ fún ìwà ìfọkànsìn sí Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, ‘àwọn ìtàn àròsọ tí ó jẹ́ àbùdá àwọn obìnrin arúgbó.’ Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ ẹ̀gàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: tí kò bọ̀wọ̀ fún ohun mímọ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ohun tí ó jẹ́ ti ayé lásán tàbí tí kò ní ọ̀wọ̀ fún ohun mímọ́. Gbólóhùn yìí pa ìyàtọ̀ láàárín ohun mímọ́ àti ohun tí kò bọ̀wọ̀ fún un mọ́, láìfi ẹ̀sùn pé kò gba Ọlọ́run gbọ́ kún un.
- source_word: γραώδεις
  choice: tí ó sì dà bí ti àwọn arúgbó obìnrin
  rationale: Èyí tú ìtumọ̀ gidi ti ajẹtífù náà jáde—ohun tí a kà sí àbùdá àwọn obìnrin arúgbó—ó sì pa agbára ọ̀rọ̀ ẹ̀gàn inú Gíríìkì mọ́.
- source_word: μύθους
  choice: àwọn ìtàn àròsọ
  rationale: Yíyan yìí túmọ̀ àwọn ìtàn tí a dá tàbí èrò àròsọ, ó sì bá ìtumọ̀ μῦθος mu ní àyíká ọ̀rọ̀ yìí.
- source_word: παραιτοῦ
  choice: kọ ... sílẹ̀
  rationale: Àṣẹ náà ní kí Timotiu kọ̀ tàbí yẹra pátápátá fún irú àwọn ìtàn bẹ́ẹ̀; ‘kọ ... sílẹ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì lágbára.
- source_word: γύμναζε
  choice: máa kọ́ ara rẹ lẹ́kọ̀ọ́
  rationale: Ọ̀rọ̀ Gíríìkì ní àwòrán ìdánilẹ́kọ̀ọ́ eléré ìdárayá nínú. Gbólóhùn Yorùbá yìí sọ ìdánilẹ́kọ̀ọ́ onítẹ̀síwájú ní ọ̀nà àdánidá.
- source_word: σεαυτόν
  choice: ara rẹ
  rationale: Ó pa ìtọ́kasí arọ́pò-orúkọ afarabọ̀ mọ́, Timotiu fúnra rẹ̀ sì ni ohun tí yóò kọ́ lẹ́kọ̀ọ́.
- source_word: πρὸς εὐσέβειαν
  choice: fún ìgbé ayé ìfọkànsìn sí Ọlọ́run
  rationale: πρός fi góńgó hàn, εὐσέβεια sì ń tọ́ka sí ìgbé ayé ọ̀wọ̀ àti ìfọkànsìn tí ó dojú kọ Ọlọ́run. Èyí yẹra fún ṣíṣe ìtumọ̀ rẹ̀ sí ìfarahàn ẹ̀sìn lásán tàbí sí jíjẹ́ bí Ọlọ́run ní ìwà.
- source_word: δὲ ... δὲ
  choice: Ṣùgbọ́n ... kí o sì
  rationale: Èkínní fi ìtakora sí ohun tó ṣáájú hàn; èkejì so àṣẹ rere tí ó jẹ́ òdì kejì mọ́ ọn lọ́nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ gbólóhùn ẹ̀gàn γραώδεις μύθους
  choice: Pa àwòrán pàtó náà mọ́ gẹ́gẹ́ bí ‘àwọn ìtàn àròsọ ... tí ó dà bí ti àwọn arúgbó obìnrin,’ kí àlàyé ìsàlẹ̀ ojú ewé sì ṣàlàyé pé ọ̀rọ̀ ẹ̀gàn ni.
  alternative: ‘àwọn ìtàn àròsọ òmùgọ̀’ tàbí ‘ìtàn àwọn ìyàwó arúgbó’
  rationale: Gíríìkì lo àwòrán tí ó ní àmì àṣà, tí ó sì le ní etí. Ṣíṣe é ní ‘òmùgọ̀’ nìkan yóò mú àwòrán pàtó náà kúrò; ‘ìyàwó arúgbó’ kò ṣeé fi dé gbogbo obìnrin arúgbó, ó sì lè dà bí ìtumọ̀ àsọjáde Gẹ̀ẹ́sì ju ti Gíríìkì lọ.
- issue: Ìtumọ̀ εὐσέβεια
  choice: ìgbé ayé ìfọkànsìn sí Ọlọ́run
  alternative: ìwà-bí-Ọlọ́run
  rationale: Nínú àwọn lẹ́tà sí àwọn olórí ìjọ, εὐσέβεια sábà ń sọ̀rọ̀ nípa ìgbé ayé tí ó ní ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run. ‘Ìwà-bí-Ọlọ́run’ lè túmọ̀ sí jíjẹ́ bí Ọlọ́run ní ìwà, èyí tí ó lè yanju ìtumọ̀ náà ní ọ̀nà tí ọ̀rọ̀ Gíríìkì kò fi dandan béèrè.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní ibi tí ó bá yẹ. A lo ‘arúgbó obìnrin’ dípò àsọjáde Gẹ̀ẹ́sì ‘old wives’ tales’ nítorí pé Gíríìkì ń tọ́ka sí obìnrin arúgbó, kì í ṣe dandan sí aya. ‘Máa kọ́ ara rẹ lẹ́kọ̀ọ́’ jẹ́ èdè òde òní tó ṣe kedere, ó sì tún jẹ́ kí àwòrán ìdánilẹ́kọ̀ọ́ inú γύμναζε wà láìdi Yorùbá àjèjì.
