id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: yo
  text: Nítorí pé ìdánilẹ́kọ̀ọ́ ti ara[a] wúlò fún ìgbà díẹ̀[b], ṣùgbọ́n ìgbé ayé ìfọkànsìn Ọlọ́run wúlò fún ohun gbogbo, nítorí ó ní ìlérí ìyè ìsinsìnyí àti ìyè tí ń bọ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘eré ìmárale’ tàbí ‘fífi ara ṣe ìdárayá.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘dé ìwọ̀n díẹ̀’; ọ̀rọ̀ Gíríìkì lè tọ́ka sí àkókò díẹ̀ tàbí ìwọ̀n kékeré.
    reason: lexical_alternative
  - marker: c
    text: 'Ní tààràtà: ‘ní ìlérí ìyè ti ìsinsìnyí àti ti èyí tí ń bọ̀.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: ìdánilẹ́kọ̀ọ́ ti ara
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ara ṣe ìdánilẹ́kọ̀ọ́ tàbí eré ìmárale; yíyan yìí pa èrò ìdánilẹ́kọ̀ọ́ mọ́ láì fi sí eré ìdárayá nìkan.
- source_word: πρὸς ὀλίγον
  choice: fún ìgbà díẹ̀
  rationale: Ó fi ààlà àkókò hàn nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn—ìwọ̀n kékeré—mọ́.
- source_word: ὠφέλιμος
  choice: wúlò
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àwọn gbólóhùn méjèèjì mu láì mú èrò èrè owó wọlé.
- source_word: εὐσέβεια
  choice: ìgbé ayé ìfọkànsìn Ọlọ́run
  rationale: Ó sọ ìgbé ayé tí ó dojú kọ Ọlọ́run pẹ̀lú ọ̀wọ̀ àti ìfọkànsìn, kì í ṣe ìṣe ẹ̀sìn lásán.
- source_word: πρὸς πάντα
  choice: fún ohun gbogbo
  rationale: Ó pa fífẹ̀ àti àpapọ̀ agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: nítorí ó ní ìlérí
  rationale: Ó mú ipa àlàyé tí ọ̀rọ̀ aláìlópìn náà ní jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: ìyè ìsinsìnyí àti ìyè tí ń bọ̀
  rationale: Ó mú ìyàtọ̀ láàárín ìyè nísinsìnyí àti ìyè ọjọ́ iwájú ṣe kedere, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ ‘ìyè’ kejì wà ní àfojúdi nínú Gíríìkì.
theological_decisions:
- issue: Ìwọ̀n ìwúlò ìdánilẹ́kọ̀ọ́ ti ara
  choice: Ìdánilẹ́kọ̀ọ́ ti ara ní ìwúlò tó ní ààlà, ní ìfiwéra pẹ̀lú ìwúlò gbooro ti ìgbé ayé ìfọkànsìn Ọlọ́run.
  alternative: Ìdánilẹ́kọ̀ọ́ ti ara wúlò dé ìwọ̀n kékeré, kì í ṣe fún àkókò díẹ̀ nìkan.
  rationale: Ọ̀rọ̀ náà kò sọ pé ìtọ́jú ara burú tàbí pé kò wúlò rárá; ó ń fi ìwúlò rẹ̀ tó ní ààlà wé ti ìfọkànsìn Ọlọ́run tó kan ìyè ìsinsìnyí àti èyí tí ń bọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò; a lo ‘ìgbé ayé ìfọkànsìn Ọlọ́run’ láti yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè dà bí èdè ẹgbẹ́ kan pàtó.
