  source_fidelity: Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa. Ó pa ìfiwéra tó wà láàárín ìdánilẹ́kọ̀ọ́ ti ara tí ìwúlò rẹ̀ ní ààlà àti εὐσέβεια tí ó wúlò ní gbogbo ọ̀nà mọ́. ‘Fún ìgbà díẹ̀’ jẹ́ yíyan tó ṣeé gbà fún πρὸς ὀλίγον, níwọ̀n bí àlàyé ìsàlẹ̀ ṣe ń ṣètọ́jú ìtumọ̀ ‘dé ìwọ̀n díẹ̀’ náà. Gbólóhùn ‘ó ní ìlérí ìyè ìsinsìnyí àti ìyè tí ń bọ̀’ ń sọ ìlérí ìyè ìsinsìnyí àti ìyè ọjọ́ iwájú ní kedere láì fi ẹ̀kọ́ ìsìn kan kún un.
