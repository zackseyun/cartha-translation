id: 1TI.4.3
reference: 1 Timothy 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: yo
  text: wọ́n ń fòfin de ìgbéyàwó, wọ́n sì ń pàṣẹ pé kí wọ́n yàgò fún àwọn oúnjẹ tí Ọlọ́run dá kí àwọn onígbàgbọ́ tí wọ́n ti wá mọ òtítọ́ lè fi ìdúpẹ́ jẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀rọ̀ gangan sí i, “wọ́n ń fòfin de láti gbéyàwó àti láti yàgò fún àwọn oúnjẹ.” Ọ̀rọ̀ inú ẹsẹ náà mú un ṣe kedere pé àwọn olùkọ́ èké ń pàṣẹ fún àwọn ènìyàn láti yàgò fún oúnjẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: wọ́n ń fòfin de
  rationale: Ó jẹ́ ọ̀rọ̀ ìṣe alábápín ní àsìkò ìsinsìnyí, ó sì ń tẹ̀ síwájú nínú àpèjúwe àwọn olùkọ́ èké láti ẹsẹ tó ṣáájú. ‘Ń fòfin de’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìdènà tí wọ́n ń gbé kalẹ̀.
- source_word: γαμεῖν
  choice: ìgbéyàwó
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ‘láti gbéyàwó,’ ‘fòfin de ìgbéyàwó’ jẹ́ èdè Yorùbá àdánidá tó sì mú èrò ìdènà ìgbéyàwó jáde dáadáa.
- source_word: ἀπέχεσθαι
  choice: wọ́n sì ń pàṣẹ pé kí a ta kété sí
  rationale: Ọ̀rọ̀ náà fúnra rẹ̀ túmọ̀ sí ‘láti ta kété sí.’ Nítorí pé kò sí ọ̀rọ̀ ìṣe tuntun tó hàn gbangba ní Gíríìkì, a mú agbára àṣẹ tí àyíká ọ̀rọ̀ ń béèrè jáde, kí ìtumọ̀ má bàa dà bí ẹni pé àwọn olùkọ́ náà ń fòfin de fífi oúnjẹ sílẹ̀.
- source_word: βρωμάτων
  choice: àwọn oúnjẹ
  rationale: Ó jẹ́ ọ̀rọ̀ ọ̀pọ̀, nítorí náà ‘àwọn oúnjẹ’ pa ìtumọ̀ yẹn mọ́ ní Yorùbá òde òní.
- source_word: ἃ
  choice: tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ àsopọ̀ náà ń tọ́ka padà sí ‘àwọn oúnjẹ’; ‘tí’ ni àsopọ̀ Yorùbá tó bójú mu.
- source_word: ὁ θεὸς ἔκτισεν
  choice: Ọlọ́run dá
  rationale: ‘Dá’ pa èdè nípa ìṣẹ̀dá mọ́, dípò ọ̀rọ̀ gbogbogbò bí ‘ṣe.’
- source_word: εἰς μετάλημψιν
  choice: láti máa ... jẹ
  rationale: Gbólóhùn náà ń fi ète ìṣẹ̀dá àwọn oúnjẹ hàn, ìyẹn ni pé kí a máa jẹ tàbí ṣe alabapin nínú wọn.
- source_word: μετὰ εὐχαριστίας
  choice: fi ìdúpẹ́ jẹ
  rationale: Èyí sọ pé jíjẹ oúnjẹ náà gbọ́dọ̀ bá ìdúpẹ́ lọ, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τοῖς πιστοῖς
  choice: àwọn tí ó gbàgbọ́
  rationale: Nínú àyíká yìí, πιστοῖς ń tọ́ka sí àwọn onígbàgbọ́, kì í ṣe kìkì àwọn ènìyàn olóòtítọ́.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: tí wọ́n sì ti wá mọ òtítọ́
  rationale: Ìṣe alábápín pípé náà fi ipò tí ó yọ láti inú wíwá mọ ohun kan hàn; ‘ti wá mọ’ gba ìbẹ̀rẹ̀ ìmọ̀ náà àti ipò tó ń bá a lọ mú.
theological_decisions:
- issue: Bóyá τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν ń tọ́ka sí ẹgbẹ́ kan tàbí ẹgbẹ́ méjì
  choice: 'Ẹgbẹ́ kan tí a ṣàpèjúwe ní ọ̀nà méjì: àwọn tí ó gbàgbọ́, tí wọ́n sì ti wá mọ òtítọ́'
  alternative: 'Ẹgbẹ́ méjì ọ̀tọ̀: àwọn onígbàgbọ́ àti àwọn tí wọ́n ti mọ òtítọ́'
  rationale: Àpilẹ̀kọ kan náà pẹ̀lú àwọn àpèjúwe méjì tí καὶ so pọ̀ jọ ń tọ́ka lọ́nà tó ṣeé ṣe jù sí ẹgbẹ́ kan náà. Ìtumọ̀ náà kò dá ẹgbẹ́ méjì sílẹ̀ láìsí ìdí gírámà.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀wọ̀, àti èdè òde òní tí ó yé òǹkàwé lasán. ‘Ta kété sí’ jẹ́ gbólóhùn àdánidá fún yíyẹra pátápátá fún ohun kan; ‘fòfin de ìgbéyàwó’ sì ṣaláìní láìsọ ọ̀rọ̀ náà di líle tàbí ti ẹgbẹ́ ẹ̀sìn kan.
