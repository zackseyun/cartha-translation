revisions:
- from: wọ́n ń fòfin de ìgbéyàwó, wọ́n sì ń pàṣẹ pé kí a ta kété sí àwọn oúnjẹ tí Ọlọ́run dá fún àwọn tí ó gbàgbọ́, tí wọ́n sì ti wá mọ òtítọ́, láti máa fi ìdúpẹ́ jẹ.[a]
  to: wọ́n ń fòfin de ìgbéyàwó, wọ́n sì ń pàṣẹ pé kí wọ́n yàgò fún àwọn oúnjẹ tí Ọlọ́run dá kí àwọn onígbàgbọ́ tí wọ́n ti wá mọ òtítọ́ lè fi ìdúpẹ́ jẹ.[a]
  rationale: A tún gbolóhùn náà kọ́ kí ìdí tí Ọlọ́run fi dá àwọn oúnjẹ náà—pé àwọn onígbàgbọ́ tí wọ́n ti wá mọ òtítọ́ lè fi ìdúpẹ́ jẹ wọ́n—wà ní kedere. A tún rọ́pò ‘ta kété sí’ pẹ̀lú ‘yàgò fún,’ èyí tí ó jẹ́ Yorùbá boṣewa tó rọrùn, ó sì pa ìtumọ̀ ἀπέχεσθαι mọ́. A yọ ‘kan’ kúrò nínú àlàyé ìsàlẹ̀ kí a má fi àlàyé tí kò sí nínú Gíríìkì kún ẹsẹ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà: ìdènà ìgbéyàwó, ìfẹ̀sùn/àṣẹ láti yàgò fún oúnjẹ, ìṣẹ̀dá Ọlọ́run, ìdúpẹ́, àti ẹgbẹ́ kan náà ti àwọn onígbàgbọ́ tí wọ́n ti mọ òtítọ́. Síbẹ̀, ìtòlẹ́sẹẹsẹ gbolóhùn ní àkọ́kọ́ fi ‘láti máa fi ìdúpẹ́ jẹ’ sí ibi tí ó lè dà bíi pé ó ń ṣàpèjúwe Ọlọ́run, dípò àwọn onígbàgbọ́ tí ń gba oúnjẹ náà.'
  naturalness: ‘Ta kété sí’ ṣeé lóye, ṣùgbọ́n ‘kí wọ́n yàgò fún’ jẹ́ èdè Yorùbá boṣewa tó wọ́pọ̀ sí i nínú ìforígbárí tàbí àṣẹ nípa oúnjẹ. Àtúnṣe náà tún so ‘fi ìdúpẹ́ jẹ’ mọ́ àwọn tí ó gbàgbọ́ ní kedere.
  terminology: A pa ‘ìgbéyàwó,’ ‘àwọn oúnjẹ,’ ‘Ọlọ́run dá,’ ‘ìdúpẹ́,’ àti ‘òtítọ́’ mọ́. ‘Àwọn onígbàgbọ́’ jẹ́ ìtumọ̀ kedere fún τοῖς πιστοῖς ní àyíká yìí, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
  issues:
  - severity: medium
    issue: Ìsopọ̀ ‘Ọlọ́run dá fún àwọn tí ó gbàgbọ́ ... láti máa fi ìdúpẹ́ jẹ’ kò ṣe kedere ní Yorùbá.
    rationale: Nínú Gíríìkì, ‘pẹ̀lú ìdúpẹ́’ àti àwọn dative participles ṣàpèjúwe àwọn olùgbà oúnjẹ náà. Nínú àkọsílẹ̀ yìí, ibi ‘láti máa fi ìdúpẹ́ jẹ’ lè jẹ́ kí olùkà má rí ẹni tí ó ń jẹ àwọn oúnjẹ náà ní kedere.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ náà sọ ‘àwọn oúnjẹ kan,’ bí ó tilẹ̀ jẹ́ pé Gíríìkì náà kan sọ ‘àwọn oúnjẹ.’
    rationale: Ọ̀rọ̀ ọ̀pọ̀ βρωμάτων kò sọ iye tàbí irú àwọn oúnjẹ tí a ní láti yàgò fún. A gbọdọ̀ má ṣe fi ‘kan’ kún un gẹ́gẹ́ bí ìlànà ìtumọ̀.
