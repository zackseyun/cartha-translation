  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: yo
  text: Títí mo fi dé, fi ara rẹ fún kíkà ní gbangba,[a] fún ìgbani-níyànjú, àti fún kíkọ́ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kíkà Ìwé Mímọ́.” Gíríìkì sọ “kíkà” nìkan, ṣùgbọ́n nínú àyíká ọ̀rọ̀ náà, ó ṣeé ṣe kó tọ́ka sí kíkà Ìwé Mímọ́ ní gbangba ní àpéjọ ìjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Títí èmi yóò fi dé
  rationale: Gbólóhùn yìí fi hàn pé Timotiu gbọdọ̀ máa ṣe iṣẹ́ náà títí Pọ́ọ̀lù yóò fi dé; lílo ọ̀rọ̀ ọjọ́ iwájú jẹ́ èdè Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: πρόσεχε
  choice: fi ara rẹ fún
  rationale: Àṣẹ náà túmọ̀ sí fífi àfiyèsí àti akitiyan sí ohun kan nígbà gbogbo, kì í ṣe wíwo rẹ̀ lẹ́ẹ̀kan ṣoṣo.
- source_word: τῇ ἀναγνώσει
  choice: kíkà ní gbangba
  rationale: Ní àyíká ìjọ àti iṣẹ́ ìránṣẹ́ yìí, ἀνάγνωσις ṣeé ṣe kí ó tọ́ka sí kíkà fún àwùjọ; a kò fi ohun tí wọ́n ń kà kún un nítorí Gíríìkì kò sọ ọ́ ní tààrà.
- source_word: τῇ παρακλήσει
  choice: ìṣírí
  rationale: παράκλησις lè túmọ̀ sí ìṣírí, ìgbani-níyànjú, tàbí ìyanilétí. “Ìṣírí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣàn, tó sì lè gba apá ìtùnú àti ìgbani-níyànjú rẹ̀.
- source_word: τῇ διδασκαλίᾳ
  choice: kíkọ́ni
  rationale: Níbí, διδασκαλία tọ́ka sí iṣẹ́ kíkọ́ àwọn ẹlòmíràn; “kíkọ́ni” ṣe kedere, kò sì fi ẹ̀kọ́ ẹ̀sìn ẹ̀ka kan kún un.
theological_decisions:
- issue: Bóyá kí a sọ ní pàtó pé ohun tí a ń kà ni Ìwé Mímọ́
  choice: kíkà ní gbangba
  alternative: kíkà Ìwé Mímọ́
  rationale: Àyíká ọ̀rọ̀ náà fi hàn gidigidi pé kíkà Ìwé Mímọ́ ní àpéjọ ni ó ṣeé ṣe kí Pọ́ọ̀lù ní lọ́kàn, ṣùgbọ́n ọ̀rọ̀ Gíríìkì sọ “kíkà” nìkan. Nítorí náà, a pa ohun tí kò dájú mọ́ sínú àkọ́kọ́, a sì fi ìtumọ̀ tó ṣeé ṣe sínú àlàyé ìsàlẹ̀.
- issue: Ìwọ̀n ìtumọ̀ παράκλησις
  choice: ìṣírí
  alternative: ìgbani-níyànjú tàbí ìyanilétí
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ ìtùnú, ìṣírí, ẹ̀bẹ̀, tàbí ìyanilétí. Àyíká iṣẹ́ olùkọ́ ní ìjọ ṣe àtìlẹ́yìn fún ìgbani-níyànjú, ṣùgbọ́n “ìṣírí” pa ìbú ìtumọ̀ náà mọ́ dáadáa.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. “Fi ara rẹ fún” mú ìfaradà inú πρόσεχε jáde; “ní gbangba” ṣàlàyé àyíká àpéjọ láì sọ ohun tí Gíríìkì kò dárúkọ.
