id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: yo
  text: Kí ẹnikẹ́ni má ṣe fojú kéré ọ nítorí ìgbà èwe rẹ; ṣùgbọ́n jẹ́ àpẹẹrẹ fún àwọn onígbàgbọ́ nínú ọ̀rọ̀, nínú ìwà, nínú ìfẹ́, nínú ìgbàgbọ́[a], àti nínú ìwà mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú ìdúróṣinṣin.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́ tàbí ìdúróṣinṣin nínú àyíká ọ̀rọ̀ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: Má ṣe jẹ́ kí ẹnikẹ́ni fojú kéré rẹ
  rationale: Ó fi ìkìlọ̀ oníṣẹ̀ pàṣẹ Gíríìkì hàn ní Yorùbá àdánidá, ó sì mú ìtumọ̀ ìfojú-kéré tàbí ẹ̀gàn awujọ jáde.
- source_word: τῆς νεότητος
  choice: nítorí ìgbà èwe rẹ
  rationale: ‘Ìgbà èwe’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ọjọ́-orí kékeré; ‘nítorí’ ṣàlàyé ohun tí ẹni náà lè fi fojú kéré Tímótì.
- source_word: τύπος γίνου
  choice: jẹ́ àpẹẹrẹ
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó rọrùn, tó sì fi ète àwòkọ́ṣe tí àwọn ẹlòmíràn lè tẹ̀ lé hàn.
- source_word: τῶν πιστῶν
  choice: fún àwọn onígbàgbọ́
  rationale: Ó ka genitive náà sí ẹgbẹ́ tí Tímótì gbọ́dọ̀ jẹ́ àpẹẹrẹ fún, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe tọ́ka.
- source_word: ἐν λόγῳ
  choice: nínú ọ̀rọ̀
  rationale: Nínú àtòjọ ìwà rere yìí, ó ń tọ́ka sí ohun tí Tímótì ń sọ àti bí ó ṣe ń sọ ọ́.
- source_word: ἐν ἀναστροφῇ
  choice: nínú ìwà
  rationale: ‘Ìwà’ ní Yorùbá lè bo ìhùwàsí àti ọ̀nà ìgbésí ayé, láì mú ìtumọ̀ náà há ju.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ἀγάπη nínú àtòjọ yìí.
- source_word: ἐν πίστει
  choice: nínú ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ pa ìtumọ̀ ìgbẹ́kẹ̀lé àti ìgbàgbọ́ mọ́; àṣàyàn ‘ìṣòtítọ́’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν ἁγνείᾳ
  choice: nínú ìwà mímọ́
  rationale: Ó sọ ìwà tó mọ́ nípa ẹ̀ṣẹ̀ àti ìbálòpọ̀ ní ọ̀nà gbooro, láì dín ọ̀rọ̀ Gíríìkì náà kù sí ìwà mímọ́ nípa ìbálòpọ̀ nìkan.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àtòjọ ìwà rere
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí ìgbẹ́kẹ̀lé Ọlọ́run tàbí sí jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé. A fi ‘ìgbàgbọ́’ sínú ọ̀rọ̀ pàtàkì, a sì pa ojúlówó àṣàyàn kejì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo àtúnṣe ‘nínú’ lórí ọkọọkan eroja àtòjọ láti pa ìṣètò Gíríìkì mọ́ ní ọ̀nà Yorùbá tó bójú mu.
