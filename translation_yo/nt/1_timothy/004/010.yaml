id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: yo
  text: Fún ète yìí ni àwa fi ń ṣe làálàá, tí a sì ń jẹ́ ẹ̀gàn[a], nítorí a ti gbé ìrètí wa lé Ọlọ́run alààyè[b], ẹni tí í ṣe Olùgbàlà gbogbo ènìyàn[c], pàápàá jù lọ àwọn onígbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń ṣe làálàá, a sì ń fi ẹ̀gàn kàn wá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a ti fi ìrètí wa sínú Ọlọ́run alààyè.”
    reason: lexical_alternative
  - marker: c
    text: A túmọ̀ gbólóhùn náà, “Olùgbàlà gbogbo ènìyàn, pàápàá jù lọ àwọn onígbàgbọ́,” bí a ti kọ ọ́. Èrò àwọn atúmọ̀ yàtọ̀ síra lórí bóyá “Olùgbàlà” níbí ń tẹnu mọ́ ìtọ́jú Ọlọ́run tó ń pa gbogbo ènìyàn mọ́, ìpèsè ìgbàlà rẹ̀ fún gbogbo ènìyàn, tàbí ìgbàlà tí ó ní ìmúṣẹ̀ àkànṣe nínú àwọn onígbàgbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: Nítorí ète yìí
  rationale: Ó fi hàn pé làálàá àti ẹ̀gàn náà wà fún ète tí a ti sọ ṣáájú; “ète yìí” mú ìtumọ̀ ìdí tàbí àfojúsùn náà ṣe kedere ní Yorùbá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ọ̀rọ̀ náà ń ṣàlàyé gbólóhùn tó ṣáájú. “Nítorí” jẹ́ àsopọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ àlàyé mu.
- source_word: κοπιῶμεν
  choice: àwa ... ń ṣe làálàá
  rationale: κοπιάω túmọ̀ sí ṣíṣe iṣẹ́ takuntakun tó ń mú àárẹ̀ wá. “Ṣe làálàá” pa agbára ìtumọ̀ yìí mọ́ ní èdè Yorùbá tó lọ́wọ́.
- source_word: ὀνειδιζόμεθα
  choice: a ... ń jẹ́ ẹ̀gàn
  rationale: Fọ́ọ̀mù àìṣe náà fi hàn pé àwọn mìíràn ń fi ọ̀rọ̀ tàbí ìwà àbùkù kàn wọ́n. “Jẹ́ ẹ̀gàn” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: a ti gbé ìrètí wa lé
  rationale: Ìṣe pípé Gíríìkì náà tọ́ka sí ìgbésẹ̀ kan tí àbájáde rẹ̀ ṣì ń bá a lọ. “A ti gbé ìrètí wa lé” sọ ìgbésẹ̀ àti ìgbẹ́kẹ̀lé tó dúró ṣinṣin náà papọ̀.
- source_word: θεῷ ζῶντι
  choice: Ọlọ́run alààyè
  rationale: Èyí jẹ́ gbólóhùn Bíbélì tí ó mọ́ ní Yorùbá, ó sì pa ìyàtọ̀ Ọlọ́run alààyè mọ́.
- source_word: σωτὴρ
  choice: Olùgbàlà
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ẹni tó ń gbani là tàbí tó ń dáàbò bo ni, ṣùgbọ́n “Olùgbàlà” pa ìwọ̀n ẹ̀kọ́ ìgbàlà rẹ̀ mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: πάντων ἀνθρώπων
  choice: gbogbo ènìyàn
  rationale: ἄνθρωποι jẹ́ ọ̀rọ̀ àpapọ̀ fún aráyé níbí; “gbogbo ènìyàn” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tí kò sì dín àlàyé náà sí irú ènìyàn kan.
- source_word: μάλιστα
  choice: pàápàá jù lọ
  rationale: Ó tọ́ka sí ipò àrà ọ̀tọ̀ tàbí tó ga jù láàárín ohun tí a ṣẹ̀ṣẹ̀ sọ, láì sọ pé “gbogbo ènìyàn” túmọ̀ sí àwọn onígbàgbọ́ nìkan.
- source_word: πιστῶν
  choice: àwọn onígbàgbọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí àwọn tí wọ́n ní ìgbàgbọ́; “àwọn onígbàgbọ́” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ “Olùgbàlà gbogbo ènìyàn, pàápàá jù lọ àwọn onígbàgbọ́”
  choice: A pa gbólóhùn àpapọ̀ àti àkànṣe Gíríìkì náà mọ́ bí ó ti rí, kí “pàápàá jù lọ” fi ìbáṣepọ̀ àrà ọ̀tọ̀ pẹ̀lú àwọn onígbàgbọ́ hàn.
  alternative: A lè túmọ̀ “Olùgbàlà” sí Olùtọ́jú gbogbo ènìyàn àti Olùgbàlà àwọn onígbàgbọ́; àwọn mìíràn sì lè ka a sí ìgbàlà gbogbo aráyé tàbí kí wọ́n ka “gbogbo ènìyàn” sí gbogbo onírúurú ènìyàn.
  rationale: Gíríìkì fúnra rẹ̀ sọ ohun àpapọ̀ (“gbogbo ènìyàn”) àti ohun àkànṣe (“pàápàá jù lọ àwọn onígbàgbọ́”) papọ̀. Ìtumọ̀ náà kò yẹ kí ó yanjú ẹdọfu ẹ̀kọ́ ìgbàgbọ́ yìí fún ẹgbẹ́ ìtumọ̀ kan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àṣà-ìkọ̀wé tó ní iyì, ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ, a sì yan “ṣe làálàá,” “jẹ́ ẹ̀gàn,” àti “gbé ìrètí ... lé” gẹ́gẹ́ bí àwọn ọ̀rọ̀ àdánidá tí ó pa agbára Gíríìkì mọ́.
