id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: yo
  text: Ẹ̀mí sì ń sọ ní kedere pé ní àwọn àkókò tí ń bọ̀[a], àwọn kan yóò yapa kúrò nínú ìgbàgbọ́[b], nígbà tí wọ́n ń fetí sí àwọn ẹ̀mí tí ń tan ènìyàn jẹ[c] àti àwọn ẹ̀kọ́ àwọn ẹ̀mí èṣù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní àwọn àkókò ìkẹyìn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “yóò ṣubú kúrò nínú ìgbàgbọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “àwọn ẹ̀mí ẹlẹ́tàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: Ẹ̀mí
  rationale: Pẹ̀lú árọ́pò-orúkọ pàtó náà àti nínú ọ̀rọ̀ Pọ́ọ̀lù yìí, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; lílo lẹ́tà ńlá fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn láìfi ‘Mímọ́’ kún ohun tí Gíríìkì sọ.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ fi ìyípadà ọ̀rọ̀ onírẹ̀lẹ̀ hàn ní Yorùbá láìsọ ọ́ di àtakò líle bí ‘ṣùgbọ́n.’
- source_word: ῥητῶς
  choice: ní kedere
  rationale: Ó túmọ̀ sí pé a sọ ohun náà ní ọ̀nà tí kò fi sí àní-àní; ‘ní kedere’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe déédé.
- source_word: ἐν ὑστέροις καιροῖς
  choice: ní àwọn àkókò tí ń bọ̀
  rationale: Ó ń tọ́ka sí àwọn àkókò tó tẹ̀ lé àkókò òǹkọ̀wé, láìfi dandan sọ pé àkókò òpin ayé nìkan ni.
- source_word: ἀποστήσονταί
  choice: yóò yapa kúrò
  rationale: Ó pa èrò ìkúrò tàbí ìṣọ̀tẹ̀ kúrò nínú ohun tí ẹni tẹ́wọ́ gbà mọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
- source_word: τῆς πίστεως
  choice: nínú ìgbàgbọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù pé ó ń tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí a gbà gbọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè ní ìtumọ̀ ìgbẹ́kẹ̀lé.
- source_word: προσέχοντες
  choice: wọn yóò sì máa tẹ́tí sí
  rationale: ‘Tẹ́tí sí’ níbí túmọ̀ sí fífetí sí tàbí títẹ̀lé ohun tí a ń sọ; ọ̀nà yìí tún pa ìbáṣepọ̀ rẹ̀ mọ́ ìyapa tí a mẹ́nu kàn ṣáájú.
- source_word: πνεύμασι πλάνοις
  choice: àwọn ẹ̀mí ẹlẹ́tàn
  rationale: ‘Ẹlẹ́tàn’ sọ pé àwọn ẹ̀mí náà ń ṣì àwọn ènìyàn lọ́nà tàbí ń tàn wọ́n jẹ, èyí tí ó bá πλάνοις mu.
- source_word: διδασκαλίαις δαιμονίων
  choice: àwọn ẹ̀kọ́ àwọn ẹ̀mí èṣù
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ genitive Gíríìkì mọ́, kí ó lè túmọ̀ sí ẹ̀kọ́ tó wá láti ọ̀dọ̀ àwọn ẹ̀mí èṣù tàbí tó ní ìbáṣepọ̀ pẹ̀lú wọn, láìyan ọ̀kan nínú méjèèjì ní dandan.
theological_decisions:
- issue: Ẹni tí ‘Ẹ̀mí’ ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí àsọtẹ́lẹ̀ kan tàbí ẹ̀mí ènìyàn
  rationale: Àyíká lẹ́tà náà àti ìsọ̀rọ̀ àsọtẹ́lẹ̀ mú kí Ẹ̀mí Mímọ́ jẹ́ ẹni tí ó ṣeé ṣe jù; síbẹ̀, a kò fi ọ̀nà tí ìfihàn náà gbà dé hàn ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ìtumọ̀ ‘ìgbàgbọ́’
  choice: ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí àkóónú ohun tí a gbà gbọ́
  alternative: ìgbẹ́kẹ̀lé ara ẹni tàbí ìṣòtítọ́
  rationale: Àrọ́pò-orúkọ pàtó àti àyíká ìkìlọ̀ nípa ẹ̀kọ́ èké ṣe àtìlẹ́yìn fún ìtumọ̀ ‘ìgbàgbọ́’ gẹ́gẹ́ bí ohun tí àwùjọ Kristẹni gbà gbọ́, láìdá ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan sí i.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Sì’ jẹ́ àsopọ̀ onírẹ̀lẹ̀ fún δὲ; ‘àwọn ẹ̀mí èṣù’ yà àwọn ẹ̀mí búburú ọ̀pọ̀ sọ́tọ̀ láìsọ wọ́n di Èṣù gẹ́gẹ́ bí ẹni kan ṣoṣo.
