  to: Ẹ̀mí sì ń sọ ní kedere pé ní àwọn àkókò tí ń bọ̀[a], àwọn kan yóò yapa kúrò nínú ìgbàgbọ́[b], nígbà tí wọ́n ń fetí sí àwọn ẹ̀mí tí ń tan ènìyàn jẹ[c] àti àwọn ẹ̀kọ́ àwọn ẹ̀mí èṣù.
