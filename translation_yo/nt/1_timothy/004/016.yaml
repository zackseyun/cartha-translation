id: 1TI.4.16
reference: 1 Timothy 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: yo
  text: Máa kíyè sí ara rẹ àti ẹ̀kọ́ náà dáadáa. Dúró ṣinṣin nínú àwọn nǹkan wọ̀nyí[a]. Nítorí nípa ṣíṣe èyí, ìwọ yóò gba ara rẹ àti àwọn tí ń fetí sí ọ là[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Máa bá a lọ nínú wọn’ tàbí ‘Máa faradà nínú wọn.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘pa mọ́.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbígbà là, pípa mọ́, tàbí ìgbàlà, gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Máa kíyè sí ... dáadáa
  rationale: Ọ̀rọ̀ àṣẹ yìí ń béèrè fún àfiyèsí pẹ̀lú ìṣọ́ra tí ó ń bá a lọ, kì í ṣe wíwo lẹ́ẹ̀kan ṣoṣo.
- source_word: σεαυτῷ
  choice: ara rẹ
  rationale: Ó tọ́ka sí Tímótì fúnra rẹ gẹ́gẹ́ bí ohun tí ó gbọ́dọ̀ máa kíyè sí.
- source_word: τῇ διδασκαλίᾳ
  choice: ẹ̀kọ́ náà
  rationale: Èyí lè ní ìtumọ̀ iṣẹ́ kíkọ́ni tàbí ohun tí a ń kọ́ni; ‘ẹ̀kọ́ náà’ jẹ́ ọ̀rọ̀ àdánidá tí kò fi ìtumọ̀ rẹ̀ mọ́ ẹ̀kọ́ ìsìn oníjìnlẹ̀ nìkan.
- source_word: ἐπίμενε αὐτοῖς
  choice: Dúró ṣinṣin nínú àwọn nǹkan wọ̀nyí
  rationale: Ó fi ìfaradà àti títẹ̀síwájú nínú ìṣọ́ra ara ẹni àti ẹ̀kọ́ hàn; ‘àwọn nǹkan wọ̀nyí’ mú ohun tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Nítorí nípa ṣíṣe èyí
  rationale: Ìtumọ̀ yìí pa ipa participle náà mọ́ gẹ́gẹ́ bí ọ̀nà tàbí ohun tí ó ń bá ìgbàlà náà lọ.
- source_word: σώσεις
  choice: yóò gba ... là
  rationale: ‘Gba ... là’ ni ọ̀nà Yorùbá àdánidá fún ‘save’; ó pa ìwọ̀n ọ̀rọ̀ ìgbàlà náà mọ́ láì dín in kù sí ààbò ti ara nìkan tàbí pinnu pé ìgbàlà ìkẹyìn nìkan ni.
- source_word: τοὺς ἀκούοντάς σου
  choice: àwọn tí ń fetí sí ọ
  rationale: Ó pa ìṣe tí ń bá a lọ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá ti òde òní tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ‘gba là’ nínú ìkìlọ̀ sí olùkọ́ni ìjọ
  choice: Pa ‘gba là’ mọ́ nínú àyọkà láì sọ ọ́ di ìgbàlà ayérayé nìkan tàbí ìdáàbòbò lásán.
  alternative: A lè lò ‘pa mọ́’ tàbí ‘mú la ewu já,’ ṣùgbọ́n àwọn wọ̀nyí lè dín agbára ọ̀rọ̀ Gíríìkì kù.
  rationale: SBLGNT so ìfaradà Tímótì nínú ìgbésí ayé àti ẹ̀kọ́ pọ̀ mọ́ gbígba òun àti àwọn olùgbọ́ rẹ̀ là. Àyọkà náà kò ṣàlàyé gbogbo ọ̀nà tí èyí fi ń ṣẹlẹ̀, nítorí náà a pa ìfojúsùn àti ìdọ̀gbà ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́ láì sọ pé Tímótì ń jèrè ìgbàlà fún ara rẹ̀ nípasẹ̀ iṣẹ́ tirẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Máa’ fi ìṣe tí ó ń bá a lọ hàn, ‘dúró ṣinṣin’ sì mú ìfaradà inú àṣẹ kejì jáde.
