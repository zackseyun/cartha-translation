  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: yo
  text: Pọ́ọ̀lù, ẹrú Ọlọ́run àti àpọ́sítélì Jésù Mèsáyà, fún ìgbàgbọ́ àwọn tí Ọlọ́run yàn[a] àti ìmọ̀ òtítọ́[b] tí ó bá ìfọkànsìn Ọlọ́run mu[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àyànfẹ́ Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìmọ̀ kíkún nípa òtítọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “òtítọ́ tí ó ń yọrí sí ìfọkànsìn Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: ẹrú
  rationale: “Ẹrú” fi ìní-àṣẹ àti jíjẹ́ ti Ọlọ́run pátápátá hàn ju “ìránṣẹ́” lọ, ó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a ti mọ̀ dáadáa fún ẹni tí a rán pẹ̀lú àṣẹ pàtàkì.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: “Mèsáyà” pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró mọ́, dípò kí a lò ó bí orúkọ lásán.
- source_word: κατὰ
  choice: fún
  rationale: Nínú gbólóhùn yìí, “fún” ṣàfihàn ohun tí iṣẹ́ àpọ́sítélì Pọ́ọ̀lù dojú kọ, láìfi dandan pinnu bóyá κατά túmọ̀ sí ète tàbí ìbámu.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àdánidá fún πίστις níbí, ó sì tọ́ka sí ìgbẹ́kẹ̀lé Ọlọ́run.
- source_word: ἐκλεκτῶν θεοῦ
  choice: àwọn tí Ọlọ́run yàn
  rationale: Ọ̀rọ̀ yìí ṣe kedere pé Ọlọ́run ni ẹni tí ó yàn wọ́n, láìkó ètò ẹ̀kọ́ ìsìn kan tí ó dín ìtumọ̀ náà kù wọ inú ẹsẹ̀ náà.
- source_word: ἐπίγνωσιν
  choice: ìmọ̀
  rationale: “Ìmọ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá; ìtumọ̀ tó lè túbọ̀ lágbára, “ìmọ̀ kíkún,” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀληθείας
  choice: òtítọ́
  rationale: Ó tọ́ka sí òtítọ́ tí a mọ̀, bí ìkọ́nilẹ́kọ̀ọ́ ihinrere, kì í ṣe ìwà òtítọ́ lásán.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: tí ó bá ìfọkànsìn Ọlọ́run mu
  rationale: Èyí pa ìbáṣepọ̀ ìbámu tí κατά lè ní mọ́, láìfi ìtumọ̀ ìyọrísí lé e lórí dandan.
- source_word: εὐσέβειαν
  choice: ìfọkànsìn Ọlọ́run
  rationale: Gbólóhùn yìí sọ ìbòwọ̀ àti ìgbé-ayé tí ó dojú kọ Ọlọ́run ní èdè Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἐκλεκτῶν θεοῦ
  choice: àwọn tí Ọlọ́run yàn
  alternative: àwọn àyànfẹ́ Ọlọ́run
  rationale: Àṣàyàn àkọ́kọ́ pa iṣẹ́ yíyan Ọlọ́run mọ́, ó sì yàgò fún èdè ẹ̀kọ́ ìsìn tó lè dà bíi pé ó ti tú ìjìnlẹ̀ ọ̀rọ̀ náà tán.
- issue: Ìbáṣepọ̀ κατά pẹ̀lú πίστιν àti ἐπίγνωσιν
  choice: fún ìgbàgbọ́ … àti ìmọ̀
  alternative: ní ìbámu pẹ̀lú ìgbàgbọ́ … àti ìmọ̀
  rationale: “Fún” gba ìdarí iṣẹ́ àpọ́sítélì sí ìgbàgbọ́ àti ìmọ̀ láyè, ṣùgbọ́n a kò fi dandan sọ ìlànà ẹ̀kọ́ ìsìn kan tí Gíríìkì kò sọ ní kedere.
- issue: Ìbáṣepọ̀ òtítọ́ àti εὐσέβεια
  choice: òtítọ́ tí ó bá ìfọkànsìn Ọlọ́run mu
  alternative: òtítọ́ tí ó ń yọrí sí ìfọkànsìn Ọlọ́run
  rationale: Gíríìkì lè tọ́ka sí ìbámu tàbí sí ìyọrísí. Ọ̀rọ̀ inú ẹsẹ̀ yan ìbámu, a sì pa ìtumọ̀ ìyọrísí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo “ẹrú” láti pa agbára δοῦλος mọ́, “Mèsáyà” gẹ́gẹ́ bí oyè, àti “ìfọkànsìn Ọlọ́run” láti jẹ́ kí εὐσέβεια ṣe kedere ju “ìwà-bí-Ọlọ́run” tàbí ọ̀rọ̀ àtijọ́ tí kò rọrùn lọ.
