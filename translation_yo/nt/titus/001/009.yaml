  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èrò Gíríìkì dáadáa ní gbogbogbòò: dídì ọ̀rọ̀ náà mú, ìbámu rẹ̀ pẹ̀lú ẹ̀kọ́, àti agbára láti fúnni ní ìmọ̀ràn àti láti bá alatako wí. Ṣùgbọ́n “ọ̀rọ̀ ìgbẹ́kẹ̀lé” kì í ṣe ọ̀nà tó hàn gbangba jù lọ láti sọ πιστοῦ λόγου, “ẹ̀kọ́ tí ó péye” lè túmọ̀ sí ẹ̀kọ́ tí ó pé pátápátá dípò ‘ẹ̀kọ́ aláìlera/síse dáadáa,’ àti “tún ... bá wí” ṣàfikún ìtumọ̀ ‘lẹ́ẹ̀kan sí i’ tí kò sí nínú ọ̀rọ̀ Gíríìkì.'
  naturalness: 'Àtúnṣe náà lo Yorùbá òde òní tó rọrùn: “ọ̀rọ̀ tí a lè gbẹ́kẹ̀ lé,” “ẹ̀kọ́ tí ó ní ìlera,” àti “bá ... wí.” A tún yọ “àwọn ẹlòmíràn” kúrò, nítorí kò sí ohun-ìṣe yẹn nínú Gíríìkì, bí ó tilẹ̀ jẹ́ pé àyíká lè jẹ́ kó ṣeé lóye.'
  terminology: “Ọ̀rọ̀ tí a lè gbẹ́kẹ̀ lé” pa ìtumọ̀ ‘trustworthy word/message’ mọ́. “Ẹ̀kọ́ tí ó ní ìlera” pa àwòrán ὑγιαινούσῃ (‘sound/healthy’) mọ́ láì sọ pé ẹ̀kọ́ náà ‘péye’ ní ìtumọ̀ pípé pátápátá. “Bá ... wí” yẹ fún agbára ìbáwí ti ἐλέγχειν; àlàyé ìsàlẹ̀ ojú ìwé ń pa ìtumọ̀ ‘fi hàn pé ó ṣàṣìṣe’ mọ́.
