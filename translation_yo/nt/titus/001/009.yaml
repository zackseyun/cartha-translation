  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: yo
  text: ó di ọ̀rọ̀ tí a lè gbẹ́kẹ̀ lé mú ṣinṣin, gẹ́gẹ́ bí ẹ̀kọ́ náà,[a] kí ó lè ní agbára láti fi ẹ̀kọ́ tí ó ní ìlera gba àwọn ènìyàn níyànjú, kí ó sì bá àwọn tí ń tako ọ̀rọ̀ náà wí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó di ọ̀rọ̀ olóòótọ́ mú ṣinṣin gẹ́gẹ́ bí ẹ̀kọ́ náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ó fi hàn pé àwọn tí ń tako ọ̀rọ̀ náà ṣàṣìṣe.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ṣí àṣìṣe payá tàbí fi ẹ̀rí hàn pé ẹnì kan ṣàṣìṣe, bákan náà pẹ̀lú bíbá a wí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: ó di ... mú ṣinṣin
  rationale: Ó fi ìfaramọ́ tí ó dúró ṣinṣin hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹni kan kò jẹ́ kí ohun tí ó dì mú lọ.
- source_word: πιστοῦ λόγου
  choice: ọ̀rọ̀ ìgbẹ́kẹ̀lé
  rationale: πιστός níhìn-ín ń tọ́ka sí ohun tí ó ṣeé gbẹ́kẹ̀ lé; “ọ̀rọ̀” pa λόγος mọ́ gẹ́gẹ́ bí ìhìn tàbí ọ̀rọ̀ tí a ti fi lé wọn lọ́wọ́.
- source_word: κατὰ τὴν διδαχήν
  choice: èyí tí ó bá ẹ̀kọ́ náà mu
  rationale: Ó ṣàfihàn ìbámu pẹ̀lú ẹ̀kọ́ tí a mọ̀ sí ti ìjọ, kì í ṣe èrò alàgbà fúnra rẹ̀.
- source_word: παρακαλεῖν
  choice: gba àwọn ẹlòmíràn níyànjú
  rationale: Ní àyíká yìí ó ní agbára ìṣírí àti ìrọ̀; “gba ... níyànjú” jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere láì dín un kù sí ìtùnú lásán.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: fi ẹ̀kọ́ tí ó péye
  rationale: ὑγιαίνω jẹ́ àwòrán ohun tí ó ní ìlera; “tí ó péye” sọ ìtumọ̀ ẹ̀kọ́ tí kò ní àṣìṣe ní èdè àdánidá, láì lo ọ̀rọ̀ ẹ̀sìn onímọ̀ tó le.
- source_word: ἀντιλέγοντας
  choice: àwọn tí ń tako ọ́
  rationale: Ó tọ́ka sí àwọn tí ń sọ̀rọ̀ lòdì sí ọ̀rọ̀ tàbí ẹ̀kọ́ náà; arọ́pò-orúkọ “ọ́” jẹ́ kí ohun tí wọ́n ń tako yé ni Yorùbá.
- source_word: ἐλέγχειν
  choice: tún ... bá wí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ṣí àṣìṣe payá, fi hàn pé ẹnì kan ṣàṣìṣe, tàbí bá a wí; gbolohun yìí pa agbára ìtọ́nisọ́nà àti ìbáwí mọ́.
- source_word: δυνατὸς ᾖ
  choice: kí ó lè
  rationale: Ó pa ìdí tí ἵνα gbé kalẹ̀ àti agbára ẹni náà láti ṣe ohun tí ó tẹ̀ lé mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí “ẹ̀kọ́ náà” àti “ọ̀rọ̀ ìgbẹ́kẹ̀lé” ń tọ́ka sí
  choice: Wọ́n tọ́ka sí ẹ̀kọ́ Kristẹni tí a ti gbà, tí a sì fi lé àwọn olórí ìjọ lọ́wọ́.
  alternative: Ẹ̀kọ́ ìwà rere lápapọ̀ tàbí èrò alàgbà fúnra rẹ̀.
  rationale: Àpilẹ̀kọ inú τὴν διδαχήν àti lílo πιστοῦ λόγου nínú àwọn lẹ́tà pásítọ̀ fi ara ẹ̀kọ́ tí a ti mọ̀ múlẹ̀ hàn; ìtumọ̀ náà kò fi ètò ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà.
- issue: Agbára ἐλέγχειν sí àwọn alatako
  choice: Kí olórí ìjọ fi àṣìṣe wọn hàn, kí ó sì bá wọn wí láti tún wọn ṣe.
  alternative: Kí ó fi ẹ̀rí hàn pé wọ́n ṣàṣìṣe nìkan.
  rationale: Àyíká náà so ìkọ́ni rere pọ̀ mọ́ ṣíṣe àtúnṣe sí ìtakò; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ fífi hàn pé wọ́n ṣàṣìṣe mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. Gbolohun náà ń tẹ̀ síwájú láti inú àkójọ ànímọ́ alàgbà ní ẹsẹ tó ṣáájú, nítorí náà a bẹ̀rẹ̀ pẹ̀lú “ó.” Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ, a sì yẹra fún àwọn ọ̀rọ̀ ẹ̀sìn onímọ̀ tí kò ṣeé lóye fún òǹkàwé lasán.
