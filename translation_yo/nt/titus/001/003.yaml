id: TIT.1.3
reference: Titus 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: yo
  text: ṣùgbọ́n ní àwọn àkókò tirẹ̀[a], ó fi ọ̀rọ̀ rẹ̀ hàn nípasẹ̀ ìkéde[b] tí a fi lé mi lọ́wọ́[c], gẹ́gẹ́ bí àṣẹ Ọlọ́run Olùgbàlà wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àwọn àkókò tí ó yẹ.” Gíríìkì sọ ní tààràtà pé “ní àwọn àkókò tirẹ̀,” ó sì ṣeé ṣe kí ó tọ́ka sí àwọn àkókò tí Ọlọ́run yàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ ìwàásù.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí iṣẹ́ kíkéde tàbí sí ìhìn tí a kéde.
    reason: lexical_alternative
  - marker: c
    text: 'A tún lè so gbólóhùn náà mọ́ “ọ̀rọ̀ rẹ̀”: “ọ̀rọ̀ rẹ̀ ... tí a fi lé mi lọ́wọ́.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: ó fi ... hàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí mímú ohun tí ó ti farapamọ́ di mímọ̀ ní gbangba; ‘ó fi ... hàn’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìṣe Ọlọ́run mọ́.
- source_word: καιροῖς ἰδίοις
  choice: ní àwọn àkókò tirẹ̀
  rationale: Ó pa ìtẹnumọ́ ἰδίοις mọ́, ó sì lè tọ́ka sí àwọn àkókò tí Ọlọ́run fúnra rẹ̀ yàn.
- source_word: τὸν λόγον αὐτοῦ
  choice: ọ̀rọ̀ rẹ̀
  rationale: ‘Ọ̀rọ̀ rẹ̀’ pa ìbáṣepọ̀ pẹ̀lú λόγος mọ́, ó sì yẹ fún ìhìn tí Ọlọ́run sọ di mímọ̀.
- source_word: ἐν κηρύγματι
  choice: nípasẹ̀ ìkéde
  rationale: ἐν níbí ní agbára ọ̀nà tàbí ohun èlò; ‘ìkéde’ lè jẹ́ iṣẹ́ kíkéde tàbí ohun tí a kéde, nítorí náà kò dín ìtumọ̀ náà kù sí ìwàásù nìkan.
- source_word: ὃ
  choice: tí
  rationale: Arọ́pò-orúkọ náà jẹ́ akọ-abo àárín, ẹyọ kan, ó sì ṣeé ṣe jù pé ó ń tọ́ka sí κήρυγμα, èyí tí ó sún mọ́ ọn jù.
- source_word: ἐπιστεύθην
  choice: a fi lé mi lọ́wọ́
  rationale: Fọ́ọ̀mù aláìṣe náà níbi yìí túmọ̀ sí pé a gbé iṣẹ́ tàbí ohun kan lé Pọ́ọ̀lù lọ́wọ́, kì í ṣe pé ‘mo gbàgbọ́.’
- source_word: κατ’ ἐπιταγὴν
  choice: gẹ́gẹ́ bí àṣẹ
  rationale: Ó fi hàn pé fífi ìkéde náà lé Pọ́ọ̀lù lọ́wọ́ bá àṣẹ aláṣẹ Ọlọ́run mu.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Ọlọ́run Olùgbàlà wa
  rationale: Èyí jẹ́ ìtúmọ̀ Yorùbá tó ṣe kedere fún àpólà tí ‘Olùgbàlà wa’ fi ń ṣàpèjúwe Ọlọ́run.
theological_decisions:
- issue: Ẹni tí ó ṣe ìṣe nínú ἐφανέρωσεν àti ìtumọ̀ ohun-ìní nínú καιροῖς ἰδίοις
  choice: Ọlọ́run ni ẹni tí ó fi ọ̀rọ̀ rẹ̀ hàn, ní àwọn àkókò tirẹ̀.
  alternative: Ìtúmọ̀ aláìní ẹni pàtó bí ‘ní àkókò tí ó yẹ ni a fi í hàn.’
  rationale: Àyíká ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa Ọlọ́run tó ṣe ìlérí, ìṣe náà sì ń bá ọ̀rọ̀ náà lọ; ‘tirẹ̀’ tún pa agbára ἰδίοις mọ́.
- issue: Ohun tí arọ́pò-orúkọ ὃ ń tọ́ka sí
  choice: Ó ń tọ́ka sí ‘ìkéde.’
  alternative: Ó lè tọ́ka sí ‘ọ̀rọ̀ rẹ̀,’ kí gbolohun náà túmọ̀ sí ‘ọ̀rọ̀ rẹ̀ ... tí a fi lé mi lọ́wọ́.’
  rationale: κῆρυγμα ni ọ̀rọ̀ tó yẹ tó sì sún mọ́ ọn jù, ṣùgbọ́n ìṣètò Gíríìkì gba ìtumọ̀ kejì láàyè; a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A yan ‘ìkéde’ dípò ‘ìwàásù’ nínú ọ̀rọ̀ pàtàkì láti pa ìfàyègba ìtumọ̀ κήρυγμα mọ́. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tí wọ́n ti jẹ́ ti ẹ̀dá èdè.
