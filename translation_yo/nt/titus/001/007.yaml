id: TIT.1.7
reference: Titus 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: yo
  text: Nítorí ẹni tí ó ń ṣe alábòójútó gbọ́dọ̀ jẹ́ aláìlẹ́gàn gẹ́gẹ́ bí ìríjú Ọlọ́run[a], kí ó má ṣe jẹ́ ẹni tí ó ń tẹ̀ lé ìfẹ́ ara rẹ̀, kí ó má ṣe máa tètè bínú, kí ó má ṣe jẹ́ ẹni tí ó máa ń mu wáìnì àṣejù, kí ó má ṣe jẹ́ oníjà, kí ó má sì ṣe jẹ́ oníwọra fún èrè ìtìjú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí olùṣàkóso ilé Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí a fi ohun sí lọ́wọ́ láti máa bójú tó, tí yóò sì jíhìn fún olówó rẹ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “oníwọra fún èrè àìṣòdodo.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ èrè tí a ń wá ní ọ̀nà tí ó burú tàbí tí ó ń mú ìtìjú wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: Ó sọ dandan àti ojúṣe ní Yorùbá tó ṣe kedere.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ẹsẹ tó ṣáájú.
- source_word: ἐπίσκοπον
  choice: ẹni tí ó ń ṣe alábòójútó
  rationale: Ó túmọ̀ iṣẹ́ ẹni tó ń bójú tó àwọn ẹlòmíràn láìgbé ètò ipò ṣọ́ọ̀ṣì ti ìgbà tó tẹ̀ lé e wọ inú ọ̀rọ̀ náà.
- source_word: ἀνέγκλητον
  choice: aláìlẹ́gàn
  rationale: Ó fi hàn pé kò sí ẹ̀sùn tó lẹ́sẹ̀ nílẹ̀ tí a lè fi kàn án, láìsọ pé ẹni náà pé pátápátá.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: gẹ́gẹ́ bí ìríjú Ọlọ́run
  rationale: “Ìríjú” mú èrò ẹni tí a fi ohun sí lọ́wọ́ àti ẹni tó ní láti jíhìn fún olówó rẹ̀ jáde.
- source_word: αὐθάδη
  choice: onífẹ̀ẹ́ ara rẹ̀
  rationale: Ó ṣàfihàn ẹni tó ń tẹ̀ lé ohun tó wu ara rẹ̀ pẹ̀lú agídí; ó gbòòrò ju “onírera” nìkan lọ.
- source_word: ὀργίλον
  choice: ẹni tí ó máa ń tètè bínú
  rationale: Ó tọ́ka sí ìwà tí ìbínú máa ń tètè mú, kì í ṣe ìṣẹ̀lẹ̀ ìbínú kan ṣoṣo.
- source_word: πάροινον
  choice: ẹni tí ó fi ara rẹ̀ fún ọtí wáìnì
  rationale: Ó pa ìtumọ̀ ìfaramọ́ sí ọtí àti àṣejù rẹ̀ mọ́ láìfi dandan pè é ní ọ̀mùtí.
- source_word: πλήκτην
  choice: oníjà
  rationale: Ó sọ ìwà lílu tàbí ìwà ipá ní Yorùbá tó rọrùn láti lóye.
- source_word: αἰσχροκερδῆ
  choice: oníwọra fún èrè ìtìjú
  rationale: Ó pa ìwọra àti ìwà abuku tó wà nínú irú èrè náà mọ́; kò fi mọ́ èrè tí a rí nípasẹ̀ ẹ̀tàn nìkan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἐπίσκοπος nínú ọ̀rọ̀ ipò iṣẹ́ ìjọ
  choice: ẹni tí ó ń ṣe alábòójútó
  alternative: bíṣọ́ọ̀bù
  rationale: Yíyan ọ̀rọ̀ iṣẹ́ náà ń tẹ̀ lé ìtumọ̀ Gíríìkì láìfi ètò olórí ìjọ tàbí ìtumọ̀ ẹ̀sìn ìgbà tó tẹ̀ lé e kún ẹsẹ náà.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn níbi tó yẹ, ní èdè ọ̀wọ̀ àti èdè òde òní. A lo àtúnsọ iṣẹ́ fún ἐπίσκοπος dípò ọ̀rọ̀ àyálò “bíṣọ́ọ̀bù,” a sì pa ìtòlẹ́sẹẹsẹ àwọn ànímọ́ ìdènà inú Gíríìkì mọ́ ní ọ̀nà adayeba.
