revisions:
- from: Nítorí ẹni tí ó ń ṣe alábòójútó gbọ́dọ̀ jẹ́ aláìlẹ́gàn gẹ́gẹ́ bí ìríjú Ọlọ́run[a], kí ó má ṣe jẹ́ onífẹ̀ẹ́ ara rẹ̀, kí ó má ṣe máa tètè bínú, kí ó má ṣe jẹ́ ẹni tí ó fi ara rẹ̀ fún ọtí wáìnì, kí ó má ṣe jẹ́ oníjà, kí ó má sì ṣe jẹ́ oníwọra fún èrè ìtìjú[b].
  to: Nítorí ẹni tí ó ń ṣe alábòójútó gbọ́dọ̀ jẹ́ aláìlẹ́gàn gẹ́gẹ́ bí ìríjú Ọlọ́run[a], kí ó má ṣe jẹ́ ẹni tí ó ń tẹ̀ lé ìfẹ́ ara rẹ̀, kí ó má ṣe máa tètè bínú, kí ó má ṣe jẹ́ ẹni tí ó máa ń mu wáìnì àṣejù, kí ó má ṣe jẹ́ oníjà, kí ó má sì ṣe jẹ́ oníwọra fún èrè ìtìjú[b].
  rationale: The revision corrects two semantic and idiomatic weaknesses while preserving the source’s syntax, scope, list structure, and non-denominational rendering of ἐπίσκοπος. No textual ambiguity requiring a note has been introduced.
