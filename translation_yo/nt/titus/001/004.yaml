id: TIT.1.4
reference: Titus 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: yo
  text: 'Sí Títù, ọmọ mi tòótọ́ gẹ́gẹ́ bí ìgbàgbọ́ tí a jọ ní[a]: Kí oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run Baba àti Mèsáyà Jésù[b], Olùgbàlà wa, wà pẹ̀lú rẹ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ tí a jọ ní.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Kristi Jésù”; a tú Χριστός sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ
  choice: tòótọ́
  rationale: Ó fi hàn pé ìbátan Títù sí Pọ́ọ̀lù gẹ́gẹ́ bí ọmọ nípa ẹ̀mí jẹ́ ojúlówó, kì í ṣe pé ó jẹ́ ọmọ rẹ̀ nípa ti ara.
- source_word: τέκνῳ
  choice: ọmọ
  rationale: Ọ̀rọ̀ Gíríìkì náà kò sọ akọ tàbí abo ní pàtó; “ọmọ” pa àkàwé ìdílé àti ìbátan nípa ẹ̀mí mọ́ láìfi ohun tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: κατὰ κοινὴν πίστιν
  choice: nípa ìgbàgbọ́ tí àwa jọ ní
  rationale: “Nípa” mú ìbáṣepọ̀ tí κατά ń sọ jáde, “tí àwa jọ ní” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ κοινήν, ohun tí àwọn méjèèjì àti àwọn onígbàgbọ́ mìíràn ń pín.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Ní àyíká yìí, ó tọ́ka sí ìgbàgbọ́ Kristẹni tí wọ́n jọ ní, kì í ṣe sí ìṣòtítọ́ gẹ́gẹ́ bí ànímọ́ kan.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún ìkíni ìbùkún Pọ́ọ̀lù.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ó túmọ̀ ìbùkún àlàáfíà tí a so pọ̀ mọ́ oore-ọ̀fẹ́ ní kíkún àti ní èdè Yorùbá àdánidá.
- source_word: θεοῦ πατρὸς
  choice: Ọlọ́run Baba
  rationale: Ọ̀rọ̀ Gíríìkì kò ní “wa” lẹ́yìn “Baba”; ìtumọ̀ yìí pa ìyàtọ̀ yẹn mọ́.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ní agbára oyè níbí; “Mèsáyà” tú ìtumọ̀ oyè náà jáde dípò kí a kàn lo ọ̀rọ̀ tí a yá láìtúmọ̀.
- source_word: σωτῆρος ἡμῶν
  choice: Olùgbàlà wa
  rationale: Gbólóhùn náà ń dá Mèsáyà Jésù mọ̀ ní tààrà gẹ́gẹ́ bí Olùgbàlà wa.
theological_decisions:
- issue: Bí a ṣe máa tú Χριστός nínú Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: “Mèsáyà” pa ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmìòróró Ọlọ́run mọ́, ó sì yẹra fún mímú un bí orúkọ lásán.
- issue: Ẹni tí σωτῆρος ἡμῶν ń tọ́ka sí
  choice: “Olùgbàlà wa” dúró ní ìṣàfikún sí Mèsáyà Jésù
  alternative: A lè gbọ́ ọ gẹ́gẹ́ bí oyè tí ó kan gbogbo gbólóhùn orísun náà lọ́nà tí kò ṣe pàtó tó bẹ́ẹ̀
  rationale: Ìtòlẹ́sẹẹsẹ Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν fi hàn lọ́nà àdánidá jù pé gbólóhùn onítàn náà ń dá Jésù mọ̀ gẹ́gẹ́ bí Olùgbàlà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti àdánidá ni a lò. A ṣàfikún àdúrà “Kí ... wà pẹ̀lú rẹ” láti mú gbólóhùn ìkíni aláìlásọyé ti Gíríìkì yé kedere ní Yorùbá, láìyí agbára ìbùkún rẹ̀ padà. A fi àmì ohùn sí ibi tí ó yẹ.
