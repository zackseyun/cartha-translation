id: TIT.1.5
reference: Titus 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: yo
  text: Nítorí ìdí èyí ni mo fi fi ọ́ sílẹ̀ ní Kírétè, kí o lè ṣètò àwọn ohun tí ó ṣì kù[a], kí o sì yan àwọn alàgbà ní ìlú kọ̀ọ̀kan[b], gẹ́gẹ́ bí mo ti pàṣẹ fún ọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun tí ó ṣì ṣe aláìpé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti ìlú dé ìlú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gẹ́gẹ́ bí mo ti tọ́ ọ sọ́nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Nítorí ìdí èyí
  rationale: Ó jẹ́ gbólóhùn ìdí tí ó bá Yorùbá òde òní mu, ó sì pa agbára ìtumọ̀ Gíríìkì mọ́.
- source_word: ἀπέλιπόν
  choice: mo fi ọ́ sílẹ̀
  rationale: Ó fi hàn pé Pọ́ọ̀lù kúrò ní Kírétè, ó sì jẹ́ kí Títù dúró síbẹ̀ láti ṣe iṣẹ́ kan; kò fi ìtẹnumọ́ àìnídìí kún ọ̀rọ̀ náà.
- source_word: ἐν Κρήτῃ
  choice: ní Kírétè
  rationale: Ìtumọ̀ ibi ní tààrà, pẹ̀lú àkọsílẹ̀ orúkọ erékùṣù náà ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: ἵνα
  choice: kí o lè
  rationale: Ó ṣe àfihàn ète tàbí ìdí iṣẹ́ tí Pọ́ọ̀lù fi Títù sílẹ̀.
- source_word: τὰ λείποντα
  choice: àwọn ohun tí ó ṣì kù
  rationale: Ó pa ìtumọ̀ ohun tí kò tíì parí mọ́; àlàyé ìsàlẹ̀ tún tọ́ka sí ìtumọ̀ ohun tí ó ṣì ṣe aláìpé.
- source_word: ἐπιδιορθώσῃ
  choice: ṣètò
  rationale: Nínú àyíká yìí, ó túmọ̀ sí láti tún àwọn ọ̀ràn tí kò tíì pé ṣe, kí ó sì fi wọ́n sí ipò tí ó tọ́; ‘ṣètò’ jẹ́ kedere, ó sì jẹ́ èdè àdánidá.
- source_word: καταστήσῃς
  choice: yan
  rationale: Ó sọ nípa yíyan àwọn ènìyàn sí ojúṣe aṣáájú; ọ̀rọ̀ náà kò fi ètò ìjọ ẹ̀sìn kan pàtó kún ẹsẹ̀ náà.
- source_word: κατὰ πόλιν
  choice: ní ìlú kọ̀ọ̀kan
  rationale: Ó mú agbára ìpín kaakiri ti κατά pẹ̀lú ọ̀rọ̀ ẹyọ hàn ní Yorùbá àdánidá.
- source_word: πρεσβυτέρους
  choice: àwọn alàgbà
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí àwọn aṣáájú ìjọ tí a mọ̀ sí irú iṣẹ́ náà, kì í ṣe àwọn ọkùnrin àgbà lásán; ‘alàgbà’ kò sì dá ètò ìjọ ìsìn kan pàtó láre.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: gẹ́gẹ́ bí mo ti pàṣẹ fún ọ
  rationale: διατάσσω ní agbára àṣẹ tàbí ìtọ́ni aláṣẹ. ‘Pàṣẹ’ mú agbára yẹn jáde ní Yorùbá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘tọ́ ọ sọ́nà’ mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ipò aṣáájú ìjọ nínú πρεσβυτέρους
  choice: Àwọn alàgbà
  alternative: Àwọn presbíta; àwọn ọkùnrin àgbà
  rationale: Àyíká ẹsẹ̀ náà fi hàn pé àwọn aṣáájú ìjọ ni a ń sọ, ṣùgbọ́n ‘àwọn alàgbà’ kò fi ètò ìjọ ìsìn kan tí ó wá lẹ́yìn náà sí inú ọ̀rọ̀.
- issue: Agbára ọ̀rọ̀ διεταξάμην
  choice: Mo ti pàṣẹ fún ọ
  alternative: Mo ti tọ́ ọ sọ́nà; mo ti fún ọ ní ìtọ́ni
  rationale: Fáàbù Gíríìkì náà lè sọ ìtọ́ni tí ó ní agbára àṣẹ. ‘Pàṣẹ’ jẹ́ àdánidá, ó sì pa agbára náà mọ́; àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ tí ó rọ̀ díẹ̀ wà ní gbangba.
translation_notes:
  register: Èdè Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún, tí ó bójú mu, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àwọn alàgbà’ gẹ́gẹ́ bí ọ̀rọ̀ aṣáájú ìjọ láìfi ètò ìjọ ẹ̀sìn kan pàtó kún un. Gbólóhùn náà pa ìṣọ̀kan àti ìtẹ̀sí gígùn ti orísun Gíríìkì mọ́, ṣùgbọ́n ó ṣàn lọ́nà àdánidá ní Yorùbá.
