  source_fidelity: The Yoruba text accurately represents the causal statement, Paul’s leaving Titus in Crete, the purpose clauses, the incomplete matters to be put in order, appointment of elders distributively in each city, and Paul’s prior authoritative instruction. “Mo ti pàṣẹ fún ọ” is within the semantic range of διεταξάμην, though somewhat firmer than the English audit trail’s “directed.”
