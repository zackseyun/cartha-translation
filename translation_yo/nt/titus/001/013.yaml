id: TIT.1.13
reference: Titus 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: yo
  text: Ẹ̀rí yìí jẹ́ òtítọ́. Nítorí ìdí yìí, bá wọn wí líle, kí wọ́n lè lágbára nínú ìgbàgbọ́,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n lè lágbára nínú ìgbàgbọ́ Kristẹni.” Gbólóhùn Gíríìkì náà lè tọ́ka sí kí ìgbàgbọ́ wọn fúnra wọn lè lágbára, tàbí kí wọ́n lè dúró ní ìdúróṣinṣin nínú ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí a gbà gbọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” bá ọ̀rọ̀ tí a tọ́ka sí láti inú àsọyé tó ṣáájú mu, ó sì pa ìtumọ̀ ohun tí a jẹ́rìí sí mọ́.
- source_word: ἀληθής
  choice: jẹ́ òtítọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹ̀rí náà bá ohun tó ṣẹlẹ̀ gan-an mu.
- source_word: δι’ ἣν αἰτίαν
  choice: Nítorí ìdí yìí
  rationale: Ó fi ìbáṣepọ̀ okùnfà hàn láàárín gbólóhùn tó ṣáájú àti àṣẹ tó tẹ̀ lé e.
- source_word: ἔλεγχε
  choice: bá wọn wí
  rationale: Ó mú agbára àṣẹ láti dojú kọ àṣìṣe àti láti tọ́ wọn sọ́nà jáde, láìsọ ọ́ di ìjìyà.
- source_word: ἀποτόμως
  choice: gidigidi
  rationale: Nínú “bá wọn wí gidigidi,” ọ̀rọ̀ yìí fi ìmúná àti líle ọ̀nà ìbáwí hàn ní Yorùbá àdánidá.
- source_word: ὑγιαίνωσιν
  choice: kí wọn lè dúró ṣinṣin
  rationale: Ìtumọ̀ gidi ní í ṣe pẹ̀lú jíjẹ́ aláìsàn, ṣùgbọ́n níbí ó jẹ́ àkàwé fún ipò tí kò ní àbùkù tàbí yíyẹ̀ nínú ìgbàgbọ́; “dúró ṣinṣin” sọ ète náà ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐν τῇ πίστει
  choice: nínú ìgbàgbọ́
  rationale: Àpilẹ̀kọ Gíríìkì lè tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí a gbà gbọ́, tàbí sí ìgbàgbọ́ wọn fúnra wọn. Yorùbá “nínú ìgbàgbọ́” pa àìdánilójú yìí mọ́ dé ìwọ̀n kan.
theological_decisions:
- issue: Ìtumọ̀ ἐν τῇ πίστει
  choice: nínú ìgbàgbọ́
  alternative: nínú ẹ̀kọ́ ìgbàgbọ́ Kristẹni
  rationale: Àyíká àwọn olùkọ́ èké lè ṣe àtìlẹ́yìn fún ìtumọ̀ ìgbàgbọ́ gẹ́gẹ́ bí àkójọpọ̀ ohun tí àwọn Kristẹni gbà gbọ́, ṣùgbọ́n gbólóhùn Gíríìkì tún lè tọ́ka sí jíjẹ́ alágbára nínú ìgbàgbọ́ ti ara ẹni. A kò yanju ìfẹ̀hónúhàn yìí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Bá wọn wí gidigidi” jẹ́ ọ̀rọ̀ tó yé ẹni gbogbo, tí ó sì pa líle ἀποτόμως mọ́. A lo “dúró ṣinṣin” gẹ́gẹ́ bí ìtumọ̀ àdánidá ti àkàwé ìlera nínú ὑγιαίνωσιν.
