id: TIT.1.6
reference: Titus 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: yo
  text: bí ẹnikẹ́ni bá jẹ́ ẹni tí kò sí ẹ̀sùn kankan tí a lè fi kàn án, ọkọ aya kan,[a] tí ó sì ní àwọn ọmọ olóòtítọ́[b] tí a kò fi ẹ̀sùn ìgbé ayé oníwà túká[c] kàn, tí wọn kò sì jẹ́ aláìgbọ́ràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkùnrin tí ó jẹ́ olóòtítọ́ sí obìnrin kan ṣoṣo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ọmọ tí ó gbàgbọ́.” Ọ̀rọ̀ Gíríìkì πιστά lè túmọ̀ sí “olóòtítọ́” tàbí “tí ó gbàgbọ́.”
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ìgbé ayé aláìníjàánu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: ẹni tí kò sí ẹ̀sùn tí ó lẹ́sẹ̀ nílẹ̀ sí
  rationale: Ó fi hàn pé kò sí ẹ̀sùn tó tọ́ tí a lè fi kàn án, láìsọ pé ẹni náà pé pátápátá láìní àṣìṣe kankan.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: ọkọ aya kan
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní kedere, ó sì fi àwọn ìbéèrè nípa ìtumọ̀ gangan rẹ̀ sílẹ̀ láìfipá yan ìlànà ẹ̀kọ́ ìjọ kan.
- source_word: τέκνα
  choice: àwọn ọmọ
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún àwọn ọmọ nínú àyíká ìdílé.
- source_word: πιστά
  choice: olóòtítọ́
  rationale: πιστά lè túmọ̀ sí ẹni olóòtítọ́ tàbí ẹni tó gbàgbọ́; ọ̀rọ̀ àkọ́kọ́ pa ìtumọ̀ ìwà rere mọ́, a sì fi èkejì sínú àlàyé ìsàlẹ̀.
- source_word: κατηγορίᾳ
  choice: tí a kò fi ẹ̀sùn ... kàn
  rationale: Ìtumọ̀ yìí pa ànímọ́ ọ̀rọ̀ ẹ̀sùn mọ́, ó sì jẹ́ Yorùbá tí ó ṣàn dáadáa.
- source_word: ἀσωτίας
  choice: ìgbé ayé oníwà túká
  rationale: Ó ṣàpèjúwe ìgbé ayé aláìníjàánu, oníṣòfò àti oníwà búburú ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: ἀνυπότακτα
  choice: aláìgbọ́ràn
  rationale: Ó mú èrò àìfẹ́ tẹríba fún àṣẹ tàbí ìlànà jáde lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ πιστά nínú τέκνα ἔχων πιστά
  choice: àwọn ọmọ olóòtítọ́
  alternative: àwọn ọmọ tí ó gbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àìdánilójú gidi láàárín jíjẹ́ olóòtítọ́ àti jíjẹ́ onígbàgbọ́; a yan ìtumọ̀ tó gbòòrò fún ẹsẹ̀, a sì pa èkejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Agbára ọ̀rọ̀ μιᾶς γυναικὸς ἀνήρ
  choice: ọkọ aya kan
  alternative: ọkùnrin tí ó jẹ́ olóòtítọ́ sí obìnrin kan ṣoṣo
  rationale: Ìtumọ̀ tó hàn gbangba yìí pa ìrísí ọ̀rọ̀ Gíríìkì mọ́, kò sì dáhùn àwọn àríyànjiyàn nípa ipò ìgbéyàwó, ìṣòtítọ́ nínú ìgbéyàwó, tàbí àtúnṣe ìgbéyàwó dípò ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. Àwọn àmì àlàyé ìsàlẹ̀ ni a gbé lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ọkọọkan ń ṣàlàyé.
