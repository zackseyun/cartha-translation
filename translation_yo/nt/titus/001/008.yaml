  text: but hospitable[a], loving what is good, self-controlled, upright, holy, and disciplined[d][c][b],
translation:
  language: yo
  text: ṣùgbọ́n kí ó jẹ́ ẹni tí ó máa ń gba àlejò[a], tí ó nífẹ̀ẹ́ ohun rere, ẹni tí ó ní ìwọ̀ntúnwọ̀nsì[d], olódodo[b], olùfọkànsìn[c], tí ó sì ń kó ara rẹ̀ níjàánu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹni tí ó nífẹ̀ẹ́ àwọn àjèjì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹni tó ń ṣe ohun tó tọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “mímọ́” tàbí “olùgbọràn sí ohun mímọ́.”
    reason: lexical_alternative
  - marker: d
    text: 'Ọ̀rọ̀ Gíríìkì méjì tó ní ìtumọ̀ tó sún mọ́ra wà níbí: σώφρονα ń tọ́ka sí ìwọ̀ntúnwọ̀nsì àti ìrònú tó dáa; ἐγκρατῆ sì ń tọ́ka sí ìkóra-ẹni-níjàánu, pàápàá nínú àwọn ìfẹ́kúfẹ̀ẹ́.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi àwọn ìwà rere tí ẹsẹ yìí béèrè ṣe ìyàtọ̀ sí àwọn ìwà búburú tí ẹsẹ tó ṣáájú kọ̀.
- source_word: φιλόξενον
  choice: ẹni tí ó máa ń gba àlejò
  rationale: Ó túmọ̀ sí ẹni tó ń fi tayọ̀tayọ̀ gba àlejò tàbí àjèjì; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: φιλάγαθον
  choice: tí ó nífẹ̀ẹ́ ohun rere
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ àkópọ̀ náà mọ́ pé ẹni náà nífẹ̀ẹ́ ohun tí ó dára.
- source_word: σώφρονα
  choice: tí ó ní làákàyè tí ó sì ń kó ara rẹ̀ níjàánu
  rationale: Ó gba ìtumọ̀ ìrònú tó péye, ìwọ̀ntúnwọ̀nsì, àti ìṣàkóso ara ẹni, láì sọ ọ́ di ọ̀kan náà pẹ̀lú ἐγκρατῆ.
- source_word: δίκαιον
  choice: tí ó dúró ṣinṣin nínú ohun tó tọ́
  rationale: Ní àkójọ ìwà yìí, ọ̀rọ̀ náà ń tọ́ka sí ìwà òdodo àti ṣíṣe ohun tó tọ́, kì í ṣe ọ̀ràn ìdájọ́ nìkan.
- source_word: ὅσιον
  choice: tí ó jẹ́ olùfọkànsìn sí Ọlọ́run
  rationale: Ó sọ ìfọkànsìn àti ìwà tó bá ohun mímọ́ mu jáde, láì da ọ̀rọ̀ náà pọ̀ mọ́ ἅγιος.
- source_word: ἐγκρατῆ
  choice: tí ó lè ṣàkóso ìfẹ́kúfẹ̀ẹ́ ara rẹ̀
  rationale: Ó tẹnu mọ́ agbára láti ṣàkóso ìfẹ́ àti ìtara ara ẹni, ó sì pa ìyàtọ̀ rẹ̀ sí σώφρονα mọ́.
theological_decisions:
- issue: Ìyàtọ̀ láàárín σώφρονα àti ἐγκρατῆ
  choice: Túmọ̀ σώφρονα sí ẹni tó ní làákàyè tó sì ń kó ara rẹ̀ níjàánu, àti ἐγκρατῆ sí ẹni tó lè ṣàkóso ìfẹ́kúfẹ̀ẹ́ ara rẹ̀.
  alternative: A lè lo àwọn ọ̀rọ̀ tó jọra bí “olóye” àti “ẹni tó ń kó ara rẹ̀ níjàánu.”
  rationale: 'Àwọn ọ̀rọ̀ Gíríìkì méjèèjì sún mọ́ra ṣùgbọ́n wọn kò dára pọ̀ pátápátá: àkọ́kọ́ ní í ṣe pẹ̀lú làákàyè àti ìwọ̀ntúnwọ̀nsì, èkejì sì tẹnu mọ́ agbára lórí ìfẹ́kúfẹ̀ẹ́.'
- issue: Ìtumọ̀ ὅσιον
  choice: olùfọkànsìn sí Ọlọ́run
  alternative: mímọ́
  rationale: ὅσιος lè túmọ̀ sí ìfọkànsìn tàbí ìwà tó yẹ níwájú Ọlọ́run. Yíyan “olùfọkànsìn sí Ọlọ́run” pa àwọ̀ ìtumọ̀ náà mọ́, ó sì yẹra fún fífi gbogbo ààyè ìtumọ̀ rẹ̀ sínú “mímọ́” nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àwọn gbólóhùn ìṣe dípò àwọn ajẹtífù Yorùbá tí yóò dun bí èdè àtijọ́ tàbí tí ìtumọ̀ wọn kò ṣe kedere; a sì fi àmì ohùn síbi tí ó yẹ.
