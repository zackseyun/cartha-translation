revisions:
- from: Ohun gbogbo ni ó mọ́ fún àwọn tí ó mọ́; ṣùgbọ́n fún àwọn tí a ti sọ di ẹlẹ́gbin, tí wọn kò sì gbàgbọ́,[a] kò sí ohun kan tí ó mọ́. Kàkà bẹ́ẹ̀, a ti sọ èrò inú wọn àti ẹ̀rí-ọkàn wọn di ẹlẹ́gbin.
  to: Ohun gbogbo jẹ́ mímọ́ fún àwọn ẹni tí ó jẹ́ mímọ́; ṣùgbọ́n fún àwọn tí ó ti di ẹlẹ́gbin, tí wọn kò sì gbàgbọ́,[a] kò sí ohun kan tí ó jẹ́ mímọ́. Kàkà bẹ́ẹ̀, èrò inú wọn àti ẹ̀rí-ọkàn wọn ti di ẹlẹ́gbin.
  rationale: Àtúnṣe náà rọ́pò “mọ́” pẹ̀lú “mímọ́,” èyí tí ó jẹ́ ọ̀rọ̀ Yorùbá tí ó dájú, tí ó sì yẹ fún καθαρός nínú gbogbo ìfarahàn rẹ̀. A tún ṣe ìmúdójúìwọn fọ́ọ̀mù perfect-passive Gíríìkì náà pẹ̀lú “ti di ẹlẹ́gbin,” láìfi aṣojú kan tí kò sí nínú ọ̀rọ̀ ìpilẹ̀ kún un. A ṣàtúnṣe àlàyé ẹsẹ̀ ìsàlẹ̀ kí ó má bàa gbé “wẹ́,” ọ̀rọ̀-ìṣe, kalẹ̀ gẹ́gẹ́ bí àyànfẹ́ àjẹ́tífù.
  reviewer_model: gpt-5.6-terra
