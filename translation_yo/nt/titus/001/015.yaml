id: TIT.1.15
reference: Titus 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: yo
  text: Ohun gbogbo jẹ́ mímọ́ fún àwọn ẹni tí ó jẹ́ mímọ́; ṣùgbọ́n fún àwọn tí ó ti di ẹlẹ́gbin, tí wọn kò sì gbàgbọ́,[a] kò sí ohun kan tí ó jẹ́ mímọ́. Kàkà bẹ́ẹ̀, èrò inú wọn àti ẹ̀rí-ọkàn wọn ti di ẹlẹ́gbin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò ní ẹlẹ́gbin” jálẹ̀ ẹsẹ náà; ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìmọ́tótó ní ti àṣà ìsìn àti ní ti ìwà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Ohun gbogbo
  rationale: Ọ̀rọ̀ yìí gba gbogbo ohun sínú ní ọ̀nà gbígbòòrò, ó sì pa ìrísí ọ̀rọ̀ ọgbọ́n kúkúrú Gíríìkì mọ́.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: mọ́ / àwọn tí ó mọ́
  rationale: “Mọ́” lè tọ́ka sí ìmọ́tótó ní ti àṣà ìsìn àti ní ti ìwà; lílo ọ̀rọ̀ kan náà jálẹ̀ ẹsẹ yìí pa ìtumọ̀ méjèèjì àti ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: fún àwọn tí a ti sọ di ẹlẹ́gbin
  rationale: Àpẹẹrẹ perfect participle fi ipò ẹlẹ́gbin tí ó jẹ́ àbájáde ohun tó ti ṣẹlẹ̀ hàn; “a ti sọ di ẹlẹ́gbin” mú agbára yẹn jáde ní Yorùbá.
- source_word: ἀπίστοις
  choice: tí wọn kò sì gbàgbọ́
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àìní ìgbàgbọ́ ju àìṣòtítọ́ lọ.
- source_word: οὐδὲν καθαρόν
  choice: kò sí ohun kan tí ó mọ́
  rationale: Èyí pa ìlànà àsọtẹ́lẹ̀ àti ìtakora pẹ̀lú gbólóhùn àkọ́kọ́ mọ́.
- source_word: ἀλλὰ
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó fi ìtakora líle hàn, ó sì darí àfiyèsí sí ìṣòro inú ẹni náà.
- source_word: μεμίανται
  choice: a ti sọ ... di ẹlẹ́gbin
  rationale: Fọ́ọ̀mù perfect náà tẹ ipò tí ó wà nítorí ohun tó ti ṣẹlẹ̀ tẹ́lẹ̀ mọ́lẹ̀, ó sì bá ìtumọ̀ μεμιαμμένοις mu.
- source_word: νοῦς
  choice: èrò inú
  rationale: “Èrò inú” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ agbára ìrònú àti òye ẹni.
- source_word: συνείδησις
  choice: ẹ̀rí-ọkàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a sábà máa ń lò fún agbára inú tí ń dá ìwà ẹni lẹ́jọ́.
- source_word: καὶ ... καὶ
  choice: '... àti ...'
  rationale: Àsopọ̀ náà mú kí ó ṣe kedere pé èrò inú àti ẹ̀rí-ọkàn, àwọn méjèèjì, ni ìbàjẹ́ náà kàn.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ọ̀rọ̀ nípa ìmọ́tótó
  choice: A túmọ̀ καθαρός sí “mọ́” jálẹ̀ ẹsẹ náà, kí ó lè gba ìmọ́tótó ní ti àṣà ìsìn àti ní ti ìwà sínú.
  alternative: A lè lò “mímọ́” tàbí ọ̀rọ̀ tí ó tẹnu mọ́ ìwẹ̀nùmọ́ ti àṣà ìsìn nìkan.
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ ní Títù 1 ní í ṣe pẹ̀lú àwọn òfin àti àríyànjiyàn Júù, ṣùgbọ́n gbólóhùn náà tún dé inú ènìyàn—èrò inú àti ẹ̀rí-ọkàn rẹ̀. “Mọ́” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìdín in kù sí ìlànà oúnjẹ tàbí àṣà nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹlẹ́gbin” fún ìbàjẹ́ inú, “ẹ̀rí-ọkàn” fún συνείδησις, a sì pa àtúnṣe ọ̀rọ̀ “mọ́” mọ́ jálẹ̀ láti ṣàfihàn ìṣọ̀kan Gíríìkì.
