id: TIT.1.16
reference: Titus 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: yo
  text: Wọ́n ń jẹ́wọ́ pé àwọn mọ Ọlọ́run[a], ṣùgbọ́n wọ́n ń sẹ́ ẹ nípa ìṣe wọn[b]; wọ́n jẹ́ ohun ìríra[c], aláìgbọ́ràn, wọn kò sì yẹ fún iṣẹ́ rere kankan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n ń sọ pé àwọn mọ Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n fi ìṣe wọn sẹ́ ẹ.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “wọ́n jẹ́ àwọn ẹni ìríra.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “wọ́n kò tóótun fún gbogbo iṣẹ́ rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Ọlọ́run
  rationale: Ó jẹ́ àfojúsùn ọ̀rọ̀ pé àwọn mọ ẹni náà; “Ọlọ́run” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún θεός níbí.
- source_word: ὁμολογοῦσιν
  choice: wọ́n ń jẹ́wọ́
  rationale: Ó fi hàn pé wọ́n ń kéde tàbí ń sọ ní gbangba pé àwọn mọ Ọlọ́run, nígbà tí ìṣe wọn tako ọ̀rọ̀ ẹnu wọn. Àmì ìṣe “ń” tún fi ìwà tí wọ́n ń bá a lọ hàn.
- source_word: εἰδέναι
  choice: pé àwọn mọ
  rationale: Ìtumọ̀ tààrà ni pé wọ́n sọ pé ìmọ̀ tàbí ìbáṣepọ̀ wọn pẹ̀lú Ọlọ́run jẹ́ òtítọ́; a kò fi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: τοῖς δὲ ἔργοις
  choice: ṣùgbọ́n wọ́n fi ìṣe wọn
  rationale: Dátífù náà lè tọ́ka sí ohun èlò tàbí ẹ̀rí; “fi ìṣe wọn” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ìwà wọn ni ó ń fi ìkọ̀sílẹ̀ náà hàn.
- source_word: ἀρνοῦνται
  choice: sẹ́ ẹ
  rationale: “Sẹ́” mú ìtakora tó lágbára láàárín ohun tí wọ́n fi ẹnu sọ àti ohun tí wọ́n fi ìṣe hàn. Arọ́pò-orúkọ “ẹ” ń tọ́ka padà sí Ọlọ́run.
- source_word: βδελυκτοὶ
  choice: ẹni ìríra
  rationale: Ó pa líle ọ̀rọ̀ Gíríìkì mọ́, ní fífi hàn pé ìwà wọn burú tó bẹ́ẹ̀ tí ó fi yẹ fún ìríra.
- source_word: ἀπειθεῖς
  choice: aláìgbọ́ràn
  rationale: Nínú àyíká ìwà rere yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn tí kò fẹ́ gba àṣẹ tàbí ṣègbọ́ràn, kì í ṣe àwọn tí kò tíì gba ohun kan gbọ́ lásán.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: fún iṣẹ́ rere kankan
  rationale: Pẹ̀lú gbólóhùn òdì “kò ... tóótun,” “kankan” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìtumọ̀ pé wọn kò yẹ fún iṣẹ́ rere èyíkéyìí.
- source_word: ἀδόκιμοι
  choice: wọn kò sì tóótun
  rationale: Ó sọ pé wọn kò pé ìwọ̀n tàbí kò yẹ láti lò fún iṣẹ́ rere; ó yẹra fún pípa ìtumọ̀ náà mọ́ sí ìdájọ́ ìlànà kan ṣoṣo.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín jíjẹ́wọ́ pé wọ́n mọ Ọlọ́run àti sísẹ́ Ọlọ́run nípasẹ̀ ìṣe
  choice: A mú Ọlọ́run gẹ́gẹ́ bí ẹni tí wọ́n sẹ́, bó tilẹ̀ jẹ́ pé wọ́n ń jẹ́wọ́ pé àwọn mọ̀ ọ́n.
  alternative: A lè ka gbólóhùn kejì bí sísẹ́ òtítọ́ Ọlọ́run ní gbogbogbòò, dípò sísẹ́ Ọlọ́run fúnra rẹ̀.
  rationale: Ọlọ́run ni àfojúsùn tó farahàn nínú gbólóhùn àkọ́kọ́, ó sì bójú mu jù láti jẹ́ kí arọ́pò-orúkọ nínú èdè Yorùbá tọ́ka padà sí i. Èyí pa ìforígbárí láàárín ọ̀rọ̀ ẹnu àti ìṣe mọ́ láìfi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ìṣe” dípò “iṣẹ́” ní apá àkọ́kọ́ láti tẹnu mọ́ ìwà àti ohun tí wọ́n ń ṣe, nígbà tí “iṣẹ́ rere” ní apá ìkẹyìn jẹ́ àkójọpọ̀ ọ̀rọ̀ tó wọ́pọ̀. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
