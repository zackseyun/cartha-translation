  source_fidelity: 'Ìtumọ̀ náà mú ìlànà ẹsẹ náà dáadáa: dídènà àwọn olùkọ́ wọ̀nyí, ìpalára àwọn agbo ilé, ẹ̀kọ́ tí kò yẹ, àti ìfẹ́ èrè àbùkù. Síbẹ̀, “èrè ìtìjú” kò rọrùn ní Yorùbá gẹ́gẹ́ bí àpèjúwe èrè; àtúnṣe náà sọ pé èrè náà jẹ́ ohun ìtìjú, bí Gíríìkì αἰσχροῦ ṣe túmọ̀ sí.'
