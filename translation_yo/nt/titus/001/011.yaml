id: TIT.1.11
reference: Titus 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: yo
  text: A gbọ́dọ̀ pa ẹnu wọn mọ́,[a] nítorí pé wọ́n ń da gbogbo agbo ilé rú[b] nípa kíkọ́ àwọn ohun tí kò yẹ kí a kọ́, nítorí èrè tí ó jẹ́ ìtìjú.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A gbọ́dọ̀ mú wọn dákẹ́.” Ní tààràtà, “A gbọ́dọ̀ dí ẹnu wọn.”
    reason: lexical_alternative
  - marker: b
    text: “Gbogbo agbo ilé” lè túmọ̀ sí gbogbo ẹbí àti àwọn tó gbẹ́kẹ̀ lé ilé náà, kì í ṣe ilé gbígbé lásán.
    reason: cultural_note
  - marker: c
    text: Tàbí, “nítorí èrè ẹlẹ́gbin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: A gbọ́dọ̀ pa ẹnu wọn mọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn olùkọ́ èké tí ẹsẹ tó ṣáájú mẹ́nu kàn. ‘Pa ẹnu wọn mọ́’ jẹ́ àkànlò èdè Yorùbá tó bá àwòrán Gíríìkì mu, ó sì túmọ̀ sí dídá ẹ̀kọ́ apanirun wọn dúró láìsọ ọ̀nà tí a ó fi ṣe bẹ́ẹ̀.
- source_word: οἵτινες
  choice: nítorí pé wọ́n
  rationale: Ní àyíká yìí, ọ̀rọ̀ arọ́pò-orúkọ náà ń ṣàlàyé ìdí tí ó fi yẹ kí a pa ẹnu wọn mọ́.
- source_word: ὅλους οἴκους
  choice: gbogbo agbo ilé
  rationale: ‘Agbo ilé’ ń tọ́ka sí gbogbo ẹbí àti àwọn tó wà lábẹ́ ilé kan, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan.
- source_word: ἀνατρέπουσιν
  choice: ń da ... rú
  rationale: Ó fi ìdàrúdàpọ̀ àti bíba ìdúróṣinṣin agbo ilé jẹ́ hàn, láìfi ìparun pátápátá kún ohun tí Gíríìkì sọ.
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: nípa kíkọ́ni ní ohun tí kò yẹ kí wọ́n kọ́ni
  rationale: Ó mú kí ipa ọ̀rọ̀ alábápín gẹ́gẹ́ bí ọ̀nà tí wọ́n fi ń da agbo ilé rú hàn, ó sì pa ìtumọ̀ ìwà tí kò tọ́ mọ́.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: nítorí èrè ìtìjú
  rationale: Ó sọ ìdí wọn di mímọ̀ gẹ́gẹ́ bí èrè tí ó yẹ fún ìtìjú, yálà owó tàbí àǹfààní míì; kò fi dandan mú un mọ́ owó nìkan.
theological_decisions:
- issue: Irú àṣẹ tí a pa nípa àwọn olùkọ́ èké
  choice: A gbọ́dọ̀ pa ẹnu wọn mọ́
  alternative: A gbọ́dọ̀ mú wọn dákẹ́
  rationale: Àyànfẹ́ yìí pa agbára àkànlò Gíríìkì mọ́, ṣùgbọ́n kò sọ pé kí a fi agbára ara, ìjìyà ìjọba, tàbí ọ̀nà ẹ̀sìn pàtó dá wọn lẹ́kun, nítorí ẹsẹ náà kò sọ ọ̀nà náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘agbo ilé’ láti fi ìtumọ̀ àwùjọ οἶκος hàn, a sì lo ‘pa ẹnu wọn mọ́’ láti pa àwòrán orísun mọ́ láìpinnu ọ̀nà ìdáwọ́dúró tí ẹsẹ náà kò sọ.
