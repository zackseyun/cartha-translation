id: TIT.1.10
reference: Titus 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ènìyàn wà tí kò tẹrí ba, tí ń sọ ọ̀rọ̀ asán, tí ń tan ènìyàn jẹ, pàápàá jù lọ àwọn tí ó jẹ́ ti ìkọlà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ti ẹgbẹ́ ìkọlà” tàbí “àwọn tí ó wá láti inú ìkọlà.” Ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí àwọn alatako Júù tàbí àwọn tí ń kọ́ni pé ìkọlà ṣe pàtàkì, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò sọ èyí ní pàtó tó bẹ́ẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí àlàyé tí ẹsẹ yìí ń ṣe fún ìtọ́ni tó ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti so gbólóhùn náà pọ̀ mọ́ ohun tó ṣáájú.
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ọ̀pọ̀; fífi “ènìyàn” kún un mú kí àpèjúwe arọ́pò-orúkọ inú Gíríìkì ṣe kedere ní Yorùbá.
- source_word: ἀνυπότακτοι
  choice: tí wọn kì í tẹrí ba
  rationale: Ó ń tọ́ka sí àwọn tí kò fẹ́ tẹríba fún àṣẹ tó yẹ; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ àìgbọ́ràn mọ́.
- source_word: ματαιολόγοι
  choice: tí wọ́n ń sọ ọ̀rọ̀ asán
  rationale: Ó ṣàpèjúwe àwọn tí ọ̀rọ̀ wọn ṣófo tàbí tí kò ní èrè; “sọ ọ̀rọ̀ asán” ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: φρεναπάται
  choice: tí wọ́n sì ń tan àwọn ẹlòmíràn jẹ
  rationale: Ọ̀rọ̀ náà ní ìmọ̀ràn títan èrò tàbí ọkàn jẹ; ìtumọ̀ yìí mú iṣẹ́ àwọn ẹni náà hàn ní Yorùbá tó yé kedere láìfi ọ̀rọ̀ àjèjì kún un.
- source_word: μάλιστα
  choice: pàápàá jù lọ
  rationale: Ó tẹnu mọ́ ẹgbẹ́ kan nínú ọ̀pọ̀ ènìyàn tí a mẹ́nu kàn; èyí ni ọ̀nà Yorùbá àdánidá láti fi ìtẹnumọ́ náà hàn.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: àwọn tí ó wá láti inú àwọn onílà
  rationale: Èyí tẹ̀lé ìṣísẹ̀ ọ̀rọ̀ Gíríìkì, “àwọn láti inú ìkọlà,” nígbà tó ń fi hàn pé àwọn ènìyàn tí a dá mọ̀ nípa ìkọlà ni. “Àwọn onílà” túmọ̀ sí àwọn ọkùnrin tí a ti kọ ní ilà, láìsọ wọn ní pàtó di Júù tàbí ẹgbẹ́ ẹ̀kọ́ kan.
theological_decisions:
- issue: Àwọn tí οἱ ἐκ τῆς περιτομῆς ń tọ́ka sí
  choice: àwọn tí ó wá láti inú àwọn onílà
  alternative: àwọn ẹgbẹ́ onílà; àwọn tó wá láti inú ẹgbẹ́ àwọn Júù
  rationale: Ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí àwọn alatako Júù tàbí àwọn tó ń fi ìkọlà ṣe dandan, ṣùgbọ́n Gíríìkì kò sọ “Júù” tàbí “ẹgbẹ́” ní tààrà. Ìtumọ̀ àkọ́kọ́ pa àìsọ pàtó inú orísun mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé àwọn ìtumọ̀ tó ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àwọn àpèjúwe mẹ́ta ni a gbé kalẹ̀ gẹ́gẹ́ bí gbólóhùn ìbátan kí ẹsẹ náà lè ṣàn lọ́nà àdánidá. “Àwọn onílà” ni a lò fún àwọn ọkùnrin tí a kọ ní ilà; àlàyé ìsàlẹ̀ pa àìdánilójú nípa ẹgbẹ́ tí gbólóhùn náà ń tọ́ka sí mọ́.
