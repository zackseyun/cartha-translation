  verdict: revise
  source_fidelity: Ìtumọ̀ náà dá àwọn ẹ̀yà pàtàkì ti Gíríìkì mọ́—ìdí-ìsọ̀rọ̀ γάρ, iye ‘ọ̀pọ̀,’ àìtẹríba, ọ̀rọ̀ asán, ìtànjẹ, àti ìtẹnumọ́ ‘pàápàá jù lọ.’ Ṣùgbọ́n ‘àwọn onílà’ kò jẹ́ ọ̀rọ̀ Yorùbá tó dájú fún àwọn tí a kọlà, ó sì lè mú ìtumọ̀ míì wá. Bákan náà, ‘àwọn ẹlòmíràn’ nínú ‘ń tan àwọn ẹlòmíràn jẹ’ ṣàfikún ‘others’ tí kò sí nínú orísun.
  naturalness: Àtúnṣe náà lo àwọn gbólóhùn ìbátan Yorùbá tó rọrùn, ṣùgbọ́n ó yọ ‘kì í,’ tí ó lè fi ìṣe àṣà/habitual sí àpèjúwe Gíríìkì. ‘Àwọn tí ó jẹ́ ti ìkọlà’ jẹ́ ọ̀nà tó ṣe kedere jù ‘àwọn tí ó wá láti inú àwọn onílà’ lọ, láìfi ìdánimọ̀ ẹgbẹ́ náà múlẹ̀ ju bó ṣe wà nínú Gíríìkì.
  terminology: A pa ‘ìkọlà’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì fún περιτομή. A kò sọ pé Júù ni wọ́n tàbí pé ẹgbẹ́ kan pàtó ni wọ́n nínú ọ̀rọ̀ àkọ́kọ́; ìsàlẹ̀ nìkan ni ó mẹ́nuba àwọn àṣàyàn ìtumọ̀ wọ̀nyẹn.
  issues:
