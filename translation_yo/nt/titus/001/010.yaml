revisions:
- from: Nítorí ọ̀pọ̀ ènìyàn ni ó wà tí wọn kì í tẹrí ba, tí wọ́n ń sọ ọ̀rọ̀ asán, tí wọ́n sì ń tan àwọn ẹlòmíràn jẹ, pàápàá jù lọ àwọn tí ó wá láti inú àwọn onílà.[a]
  to: Nítorí ọ̀pọ̀ ènìyàn wà tí kò tẹrí ba, tí ń sọ ọ̀rọ̀ asán, tí ń tan ènìyàn jẹ, pàápàá jù lọ àwọn tí ó jẹ́ ti ìkọlà.[a]
  rationale: Àtúnṣe náà rọ́pò ‘àwọn onílà,’ tí kò dájú ní Yorùbá, pẹ̀lú ‘àwọn tí ó jẹ́ ti ìkọlà,’ tó ń pa ọ̀rọ̀ Gíríìkì οἱ ἐκ τῆς περιτομῆς mọ́ láìsọ ìdánimọ̀ wọn ju bó ṣe yẹ lọ. Ó tún yọ ‘àwọn ẹlòmíràn,’ ìfikún tí kò sí nínú orísun, ó sì mú àpèjúwe àìtẹríba bá Gíríìkì mu dáadáa.
