id: TIT.1.14
reference: Titus 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: yo
  text: kí wọn má ṣe fiyè sí àwọn ìtàn àròsọ Júù àti àwọn àṣẹ àwọn ènìyàn tí wọ́n yí ẹ̀yìn sí òtítọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọn má ṣe fi ara wọn fún àwọn ìtàn àròsọ Júù àti àwọn àṣẹ ènìyàn láti ọ̀dọ̀ àwọn tó yí ẹ̀yìn sí òtítọ́.”
    reason: Àṣàyàn ìtumọ̀ fún μὴ προσέχοντες àti ọ̀nà míì láti fi ìbáṣepọ̀ àwọn àṣẹ náà pẹ̀lú àwọn ènìyàn tí wọ́n yí ẹ̀yìn sí òtítọ́ hàn.
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: kí wọn má ṣe máa fiyè sí
  rationale: Ọ̀rọ̀ alábàápín yìí ń tẹ̀ síwájú nínú ìṣírí ẹsẹ tó ṣáájú, ó sì ṣàlàyé ohun tí wọn kò gbọ́dọ̀ máa ṣe. “Máa fiyè sí” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pípa ọkàn sí ohun kan.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: àwọn ìtàn àròsọ Júù
  rationale: μῦθος tọ́ka sí àwọn ìtàn tí a dá tàbí ìtàn àròsọ; “ìtàn àròsọ” ṣe kedere fún òǹkàwé Yorùbá òde òní. “Júù” fi irú tàbí orísun àwọn ìtàn náà hàn.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: àwọn àṣẹ àwọn ènìyàn
  rationale: Èyí pa ìtumọ̀ àṣẹ mọ́, ó sì fi hàn pé àṣẹ ènìyàn ni, láì fi akọ tàbí abo kankan sí i àti láì sọ pé àṣẹ Ọlọ́run ni.
- source_word: ἀποστρεφομένων
  choice: tí wọ́n yí padà kúrò nínú
  rationale: Gbólóhùn yìí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ pé àwọn ènìyàn náà yí ẹ̀yìn sí òtítọ́, dípò lílo ọ̀rọ̀ tí yóò túmọ̀ rẹ̀ ní pàtó sí kíkọ̀ ọ́ sílẹ̀.
- source_word: τὴν ἀλήθειαν
  choice: òtítọ́
  rationale: Èyí ni ìtumọ̀ tààrà tí ó sì wọ́pọ̀; a kò fi “ìhìnrere” kún un, nítorí pé ẹsẹ náà kò sọ ọ́ ní kedere.
theological_decisions:
- issue: Ohun tí ọ̀rọ̀ alábàápín ἀποστρεφομένων ń ṣàpèjúwe
  choice: 'Ó ń ṣàpèjúwe “àwọn ènìyàn”: “àwọn àṣẹ àwọn ènìyàn tí wọ́n yí padà kúrò nínú òtítọ́.”'
  alternative: A lè so ọ̀rọ̀ náà ní ọ̀nà tí ó túbọ̀ gbòòrò mọ́ àwọn ìtàn àròsọ àti àwọn àṣẹ gẹ́gẹ́ bí ohun tó ní í ṣe pẹ̀lú àwọn tó yí padà kúrò nínú òtítọ́.
  rationale: Ìbámu gírámà tó sún mọ́ra jù ni pé ọ̀rọ̀ alábàápín ọ̀pọ̀ oníra-ẹni náà ń ṣàpèjúwe ἀνθρώπων, èyí sì mú ìtumọ̀ tó ṣe kedere jáde láì fi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. “Ìtàn àròsọ” ṣe kedere ju ọ̀rọ̀ àjèjì lọ, “fiyè sí” sì jẹ́ àdánidá fún ordinary readers. Gbólóhùn náà jẹ́ àbájáde tààrà ti ìṣírí tó bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú.
