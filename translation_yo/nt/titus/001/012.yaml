  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: yo
  text: Ọ̀kan nínú wọn, wòlíì tiwọn fúnra wọn, sọ pé, “Àwọn ará Kírétè jẹ́ òpùrọ́ nígbà gbogbo, ẹranko búburú, àwọn ajẹkì ọ̀lẹ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “àwọn ìkùn ọ̀lẹ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Ọ̀kan nínú wọn ... sọ pé
  rationale: Ó mú ìtumọ̀ arọ́pò orúkọ àìdánimọ̀ τις àti ìtumọ̀ apá-kan-nínú-ẹgbẹ́ ti ἐξ αὐτῶν jáde ní Yorùbá àdánidá.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: wòlíì tiwọn fúnra wọn
  rationale: ‘Tiwọn fúnra wọn’ tẹnu mọ́ pé wòlíì náà jẹ́ ẹni tí ó wá láàárín àwọn ará Kírétè, bí ἴδιος ṣe ń fi hàn.
- source_word: Κρῆτες
  choice: Àwọn ará Kírétè
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti pe àwọn ènìyàn ilẹ̀ Kírétè.
- source_word: ἀεὶ ψεῦσται
  choice: jẹ́ òpùrọ́ nígbà gbogbo
  rationale: 'Ó pa agbára ọ̀rọ̀ òwe náà mọ́: ἀεί ni ‘nígbà gbogbo,’ ψεῦσται sì ni ‘òpùrọ́.’'
- source_word: κακὰ θηρία
  choice: ẹranko búburú
  rationale: Ó pa àwòrán ẹranko inú Gíríìkì àti ìdájọ́ ìwà tí κακά ní mọ́ láì túmọ̀ rẹ̀ jù.
- source_word: γαστέρες ἀργαί
  choice: alájẹkì onímọ̀lẹ̀
  rationale: Gbólóhùn náà túmọ̀ ní tààrà sí ‘ikùn ọ̀lẹ,’ ṣùgbọ́n ní àyíká yìí ó ń gàn àwọn tó ń jẹun púpọ̀ tí wọn kò sì fẹ́ ṣiṣẹ́; ọ̀rọ̀ Yorùbá yìí sọ ìtumọ̀ náà ní kedere.
theological_decisions:
- issue: Ọ̀rọ̀ líle tí a fa yọ nípa ẹgbẹ́ ènìyàn kan
  choice: A túmọ̀ ọ̀rọ̀ tí a fa yọ náà ní tààrà, a kò dín líle rẹ̀ kù.
  alternative: Láti sọ ọ́ ní ọ̀nà pẹ̀lẹ́ sí i kí ó má bàa dà bí ẹ̀gàn gbogbo àwọn ará Kírétè.
  rationale: Gíríìkì gbé e kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ tí ‘wòlíì tiwọn fúnra wọn’ sọ. Ìtumọ̀ gbọ́dọ̀ pa ìṣòro àti agbára ọ̀rọ̀ tí a fa yọ náà mọ́, láì sọ ọ́ di ẹ̀kọ́ nípa gbogbo ará Kírétè ní gbogbo ìgbà.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tí ó bá yẹ; ‘wòlíì’ àti ‘Kírétè’ tẹ̀lé ìlò Yorùbá Bíbélì tó wọ́pọ̀.
