source:
  edition: SBLGNT
  text: ἐπ’ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: yo
  text: ní ìrètí ìyè àìnípẹ̀kun, ìyè tí Ọlọ́run, ẹni tí kì í purọ́, ṣe ìlérí kí àwọn àkókò ayérayé tó bẹ̀rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí àkókò tó bẹ̀rẹ̀.” Ní tààrà, èdè Gíríìkì sọ pé, “ṣáájú àwọn àkókò ayérayé” tàbí “ṣáájú àwọn àkókò tí ó gùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: ní ìrètí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi hàn pé iṣẹ́ tí a mẹ́nu kàn ṣáájú wà ní ìbámu pẹ̀lú ìrètí náà, láì fi dandan túmọ̀ rẹ̀ sí ìdí tàbí ìpìlẹ̀ rẹ̀.
- source_word: ζωῆς αἰωνίου
  choice: ìyè àìnípẹ̀kun
  rationale: Ó fi ìyè tí kò ní òpin hàn, ó sì jẹ́ gbólóhùn tó mọ́gbọ́n dání, tó wọ́pọ̀ nínú èdè Yorùbá Bíbélì.
- source_word: ἣν
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí ‘ìyè àìnípẹ̀kun,’ kì í ṣe ‘ìrètí.’
- source_word: ἐπηγγείλατο
  choice: ṣèlérí
  rationale: Ó túmọ̀ aorist middle náà lọ́nà àdánidá ní Yorùbá láì fi ìtumọ̀ mìíràn kún un.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: Ọlọ́run tí kì í purọ́
  rationale: Ó sọ ànímọ́ Ọlọ́run gẹ́gẹ́ bí ẹni tí kì í purọ́, láì mú un lágbára sí ‘tí kò lè purọ́,’ èyí tí ó ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: πρὸ χρόνων αἰωνίων
  choice: kí àwọn àkókò ayérayé tó bẹ̀rẹ̀
  rationale: Ó tẹ̀lé àwòrán ọ̀rọ̀ Gíríìkì nípa àwọn àkókò/àwọn sáà ayérayé, ó sì pa ìtumọ̀ pé ìlérí náà ṣáájú wọn mọ́, láì pinnu ẹ̀kọ́ nípa bí àkókò ṣe bẹ̀rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πρὸ χρόνων αἰωνίων àti ìlérí Ọlọ́run
  choice: kí àwọn àkókò ayérayé tó bẹ̀rẹ̀
  alternative: kí àkókò tó bẹ̀rẹ̀; láti ayérayé
  rationale: Ọ̀rọ̀ Gíríìkì fi ìlérí náà ṣáájú àwọn sáà, ṣùgbọ́n kò sọ ẹni tí a ṣe ìlérí náà fún tàbí bí a ṣe gbọ́dọ̀ ṣàlàyé rẹ̀ nípa ẹ̀kọ́ Ọlọ́run. A pa àìdánilójú yẹn mọ́.
- issue: Àpèjúwe Ọlọ́run gẹ́gẹ́ bí ἀψευδής
  choice: Ọlọ́run tí kì í purọ́
  alternative: Ọlọ́run tí kò lè purọ́; Ọlọ́run olóòtítọ́
  rationale: Àṣàyàn yìí sọ ohun tí ajẹtífù náà sọ ní tààrà, láì fi ẹ̀kọ́ tó lágbára ju ọ̀rọ̀ orísun lọ kún un.
translation_notes:
  register: Yorùbá àpapọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá àṣà ìkọ̀wé mu; a sì pa ìsopọ̀ ẹsẹ yìí mọ́ gẹ́gẹ́ bí àjákù gbólóhùn tó ń tẹ̀ síwájú láti ẹsẹ 1.
