  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ Gíríìkì mọ́ dáadáa: ìrètí náà jẹ́ ti ìyè àìnípẹ̀kun; Ọlọ́run ni a ṣàpèjúwe gẹ́gẹ́ bí ẹni tí kì í purọ́; ìlérí náà sì ṣáájú ‘àwọn àkókò ayérayé.’ Àtúnṣe kékeré náà jẹ́ kí ohun tí ἣν tọ́ka sí—ìyè—hàn kedere nínú Yorùbá.'
