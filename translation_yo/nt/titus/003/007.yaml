id: TIT.3.7
reference: Titus 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: yo
  text: kí nígbà tí a ti dá wa láre[a] nípasẹ̀ oore-ọ̀fẹ́ rẹ̀, a lè di ajogún ní ìbámu pẹ̀lú ìrètí[b] ìyè àìnípẹ̀kun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “a ti kéde wa ní olódodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ìrètí ìyè àìnípẹ̀kun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ... a lè
  rationale: Ó fi ète tàbí àbájáde hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: δικαιωθέντες
  choice: lẹ́yìn tí a ti dá wa láre
  rationale: Ó pa ohùn àìṣe àti ìṣe tí ó ṣáájú ọ̀rọ̀-ìṣe pàtàkì mọ́, láìṣe àlàyé ẹ̀kọ́ ìgbàgbọ́ ju ohun tí Gíríìkì sọ lọ.
- source_word: τῇ ἐκείνου χάριτι
  choice: nípasẹ̀ oore-ọ̀fẹ́ rẹ̀
  rationale: ‘Nípasẹ̀’ fi iṣẹ́ dátífù irinṣẹ́ hàn; ‘rẹ̀’ kò fi tipátipá sọ bóyá Ọlọ́run tàbí Jésù Kristi ni ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: κληρονόμοι
  choice: ajogún
  rationale: Ó pa àwòrán ogún mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ tí ó sì ṣe kedere.
- source_word: γενηθῶμεν
  choice: a lè di
  rationale: Ó fi yíyípadà sí ipò tuntun hàn, ó sì bá subjunctive lẹ́yìn ἵνα mu.
- source_word: κατ’ ἐλπίδα
  choice: ní ìbámu pẹ̀lú ìrètí
  rationale: Ó pa ìtumọ̀ κατά mọ́ ní ọ̀nà tí ó ṣeé lóye, láìdín ìbáṣepọ̀ rẹ̀ sí ‘lórí ìpìlẹ̀’ nìkan.
- source_word: ζωῆς αἰωνίου
  choice: ìyè àìnípẹ̀kun
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá àdánidá fún ìyè tí kò ní òpin, ó sì pa ìsopọ̀ genitive mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιωθέντες nínú ọ̀rọ̀ ìgbàlà
  choice: dá wa láre
  alternative: kéde wa ní olódodo
  rationale: ‘Dá wa láre’ pa ìsopọ̀ pẹ̀lú èrò ìdáláre àti ohùn àìṣe mọ́, láìfi tipátipá mú un túmọ̀ sí ìkéde òfin nìkan.
- issue: Ẹni tí ἐκείνου (‘rẹ̀’) ń tọ́ka sí
  choice: rẹ̀, láìdárúkọ ẹni náà ní pàtó
  alternative: ti Ọlọ́run / ti Jésù Kristi
  rationale: Arọ́pò-orúkọ náà pa àìdánilójú tó wà nínú ọ̀rọ̀ Gíríìkì mọ́, kò sì yan ẹni tí ẹsẹ yìí kò dárúkọ ní tààrà.
- issue: Ìbáṣepọ̀ κατ’ ἐλπίδα sí jíjẹ́ ajogún
  choice: ní ìbámu pẹ̀lú ìrètí
  alternative: nínú ìrètí
  rationale: Yíyan yìí pa ìtẹ̀lé ọ̀rọ̀ àti agbára preposition mọ́; àṣàyàn kejì jẹ́ àdánidá sí i ṣùgbọ́n ó túmọ̀ ìbáṣepọ̀ náà lọ́nà tí ó rọ̀ sí i.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìtò ọ̀rọ̀ náà tẹ̀ lé ìṣọ̀kan Gíríìkì ṣùgbọ́n ó tún jẹ́ àdánidá ní Yorùbá; ‘ajogún,’ ‘oore-ọ̀fẹ́,’ àti ‘ìyè àìnípẹ̀kun’ jẹ́ ọ̀rọ̀ tó ṣe kedere fún òǹkàwé lásán.
