base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: yo
  text: Fi gbogbo ìtara rán Sẹ́násì amòfin àti Àpólò lọ ní ìrìn àjò wọn[a], kí wọ́n má ṣe ní àìní ohunkóhun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi gbogbo ìtara ràn Sẹ́násì amòfin àti Àpólò lọ́wọ́ nínú ìrìn àjò wọn.” Ọ̀rọ̀ ìṣe náà lè ní ìtumọ̀ pípèsè ìrànlọ́wọ́ tí wọ́n nílò fún ìrìn àjò, kì í ṣe kíkàn rán wọn lọ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: Sẹ́násì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ orúkọ ní Yorùbá.
- source_word: τὸν νομικὸν
  choice: amòfin
  rationale: νομικός ń tọ́ka sí ẹni tí ó mọ òfin dáadáa; níbí ó dúró gẹ́gẹ́ bí iṣẹ́ tàbí àkọlé Sẹ́násì. ‘Amòfin’ jẹ́ ọ̀rọ̀ Yorùbá kúkúrú, àdánidá, tí kò sì fi dandan sọ pé òfin Júù ni.
- source_word: Ἀπολλῶν
  choice: Àpólò
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlò Yorùbá.
- source_word: σπουδαίως
  choice: pẹ̀lú gbogbo ìtara
  rationale: Ọ̀rọ̀ náà fi ìfiyèsí gidi àti ìsapá tọkàntọkàn hàn; gbolohun yìí jẹ́ àdánidá ní Yorùbá, kò sì dín ìtumọ̀ rẹ̀ kù sí yíyára nìkan.
- source_word: πρόπεμψον
  choice: ran ... lọ ní ìrìn àjò wọn
  rationale: Nínú àyíká ìrìn àjò, προπέμπω lè túmọ̀ sí ríràn àwọn arìnrìn-àjò lọ pẹ̀lú ìpèsè àti ìtìlẹ́yìn, kì í ṣe jíjẹ́ kí wọn kàn máa lọ nìkan. Àlàyé ẹsẹ̀ fi ìtumọ̀ yìí hàn kedere.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: kí ohunkóhun má bàa ṣe aláìsí fún wọn
  rationale: Èyí pa ète ìtọ́ni náà mọ́, ó sì ṣètọ́jú gbòòrò ìtumọ̀ Gíríìkì pé kí wọn má ṣe ṣe aláìní ohunkóhun tí ó yẹ fún ìrìn àjò.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ. ‘Amòfin’ yẹra fún ṣíṣe νομικός ní àkọlé ẹ̀sìn láìsí ẹ̀rí tó péye, ìtumọ̀ ìtìlẹ́yìn inú πρόπεμψον sì wà nínú àkọsílẹ̀ ẹsẹ̀.
