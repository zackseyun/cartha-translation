  to: Ẹ kọ ẹni tí ó ń fa ìyapa lẹ́yìn ìkìlọ̀ àkọ́kọ́ àti ìkejì,[a]
  rationale: 'Àtúnṣe náà mú ìsopọ̀ ọ̀rọ̀ Yorùbá rọrùn, ó sì ṣàtúnṣe àwọn àṣàyàn inú àlàyé-ẹsẹ̀ tí kò tọ́. Ó pa àìdánilójú ìtàn-ìtumọ̀ αἱρετικόν mọ́: ìtumọ̀ àkọ́kọ́ ń tẹnumọ́ fífa ìpínyà, nígbà tí àlàyé-ẹsẹ̀ ń jẹ́ kí a rí àwọn ìtumọ̀ mìíràn láì sọ ìtumọ̀ ìbílẹ̀ di ìdájọ́ ẹ̀kọ́ ìjọ.'
