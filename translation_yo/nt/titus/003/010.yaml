  source_fidelity: Ìtumọ̀ àkọ́kọ́ ń mú ìtumọ̀ αἱρετικόν gẹ́gẹ́ bí ẹni tí ó ń fa ìpínyà nínú àwùjọ hàn dáadáa, ó sì pa ìtẹ̀lé ìkìlọ̀ méjì àti àṣẹ παραιτοῦ mọ́. Síbẹ̀, “fa ìyapa sílẹ̀” kò dára bí “fa ìyapa” nínú Yorùbá, àti àwọn àṣàyàn inú àlàyé-ẹsẹ̀ kò ṣàfihàn ‘factious/heretical’ ní òtítọ́.
  naturalness: “Ẹ kọ ẹni tí ó ń fa ìyapa lẹ́yìn ìkìlọ̀ àkọ́kọ́ àti ìkejì” jẹ́ Yorùbá ìgbàlódé, kedere, ó sì yẹ fún kíkà ní gbangba. “Ẹ kọ ... sílẹ̀” tún lè ṣiṣẹ́, ṣùgbọ́n “Ẹ kọ ẹni ...” ti tó láti sọ ìtumọ̀ ìkọ̀sílẹ̀ tàbí ìkọ̀sílẹ̀ ẹni náà.
  terminology: '“Ẹni tí ó ń fa ìyapa” yàgò fún fífi èrò ẹ̀kọ́ ìjọ ti ìgbà tó ṣẹ́yìn sínú αἱρετικόν. A tún ṣàtúnṣe àlàyé-ẹsẹ̀: “ẹni ẹlẹ́gbẹ́” túmọ̀ sí companion, kì í ṣe factious; “ẹni aláìgbàgbọ́-òdodo” sì kì í ṣe ‘heretical.’'
