translation:
  language: yo
  text: Ẹ kọ ẹni tí ó ń fa ìyapa lẹ́yìn ìkìlọ̀ àkọ́kọ́ àti ìkejì,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “ẹni tó ń dá ẹgbẹ́ sílẹ̀” tàbí “ẹni afẹnusọ ẹgbẹ́”; nínú àwọn ìtumọ̀ ìbílẹ̀, “ẹni aládàáṣe ẹ̀kọ́ èké.” Ó ṣeé ṣe kí ọ̀rọ̀ Gíríìkì náà tọ́ka sí ẹni tó ń dá ẹgbẹ́ sílẹ̀ tàbí tó ń fa ìyapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: ẹni tó ń fa ìyapa sílẹ̀
  rationale: Ọ̀rọ̀ náà ní Gíríìkì Koiné tọ́ka sí ẹni tó ń dá ẹgbẹ́ sílẹ̀ tàbí tó ń fa ìyapa láàárín àwùjọ, kì í ṣe dandan ẹni tí a ti fi ẹ̀sùn ìkọ́ni èké kàn ní ìtumọ̀ ìmọ̀ ẹ̀sìn ti ìgbà tó tẹ̀ lé e.
- source_word: ἄνθρωπον
  choice: ẹni
  rationale: Nínú àyíká yìí, ἄνθρωπον ń tọ́ka sí ẹnì kọ̀ọ̀kan ní gbogbogbòò. “Ẹni” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi ìbálòpọ̀ tí ọ̀rọ̀ náà kò tẹnumọ́ sí i.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: lẹ́yìn ìkìlọ̀ àkọ́kọ́ àti èkejì
  rationale: Gbólóhùn náà fi hàn pé a gbọdọ̀ kọ́kọ́ gbìyànjú láti ṣàtúnṣe ẹni náà lẹ́ẹ̀mejì. “Ìkìlọ̀” mú agbára ìtọ́ni tó fẹ́ ṣàtúnṣe tó wà nínú νουθεσία jáde ní Yorùbá òde òní.
- source_word: παραιτοῦ
  choice: Ẹ kọ ... sílẹ̀
  rationale: Ọ̀rọ̀ àṣẹ yìí túmọ̀ sí kí a kọ ẹni náà tàbí kí a jáwọ́ nínú ìbáṣepọ̀ pẹ̀lú rẹ̀. “Ẹ kọ ... sílẹ̀” sọ ìgbésẹ̀ ìbáwí náà ní kedere láì sọ ọ́ di líle ju orísun lọ.
theological_decisions:
- issue: Bóyá kí αἱρετικὸν túmọ̀ sí ẹni aládàáṣe ìkọ́ni èké ní ìtumọ̀ ìmọ̀ ẹ̀sìn ti ìgbà tó tẹ̀ lé e, tàbí ẹni tó ń fa ìyapa.
  choice: ẹni tó ń fa ìyapa sílẹ̀
  alternative: ẹni ẹlẹ́gbẹ́; ẹni aláìgbàgbọ́-òdodo
  rationale: Ìtumọ̀ tí ó dá lórí fífa ìyapa bá lílo ọ̀rọ̀ náà ní ọ̀rúndún kìíní mu, ó sì yẹra fún fífi èrò ìmọ̀ ẹ̀sìn ti ìgbà tó tẹ̀ lé e sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá àfẹnusọ tó ṣe kedere, tó níyì, tí ó sì yẹ fún kíkà ní gbangba. A lo “ẹni” fún ìtọ́kasí gbogbogbòò, a sì pa ìtẹ̀síwájú ìkìlọ̀ méjì mọ́.
