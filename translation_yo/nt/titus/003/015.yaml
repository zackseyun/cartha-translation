  to: Gbogbo àwọn tí ó wà pẹ̀lú mi ń kí ọ. Kí àwọn tí ó fẹ́ràn wa nínú ìgbàgbọ́[a]. Kí oore-ọ̀fẹ́ wà pẹ̀lú gbogbo yín.
