id: TIT.3.15
reference: Titus 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: yo
  text: Gbogbo àwọn tí ó wà pẹ̀lú mi ń kí ọ. Kí àwọn tí ó fẹ́ràn wa nínú ìgbàgbọ́[a]. Kí oore-ọ̀fẹ́ wà pẹ̀lú gbogbo yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìgbàgbọ́ náà”; ó tún lè jẹ́, “nínú ìṣòtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: kí
  rationale: Nínú ọ̀rọ̀ ìkíni tí a kọ sínú lẹ́tà, ‘kí’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ìkíni ránṣẹ́, ó sì pa agbára ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: Gbogbo àwọn tí ó wà pẹ̀lú mi
  rationale: Ó pa πάντες (‘gbogbo’) àti ìtumọ̀ ìbáṣepọ̀ μετά + genitive mọ́, ó sì tọ́ka sí gbogbo àwọn alábàáṣiṣẹ́pọ̀ Pọ́ọ̀lù.
- source_word: ἄσπασαι
  choice: Kí
  rationale: Àṣẹ ìkíni ni ἄσπασαι; ‘Kí’ jẹ́ ọ̀rọ̀ kúkúrú, àdánidá, tó sì bá ìparí lẹ́tà mu ní Yorùbá.
- source_word: φιλοῦντας
  choice: tí ó fẹ́ràn
  rationale: φιλέω ń sọ ìfẹ́ àti ìfararora ẹni sí ẹni; ‘fẹ́ràn’ mú ìtumọ̀ yẹn jáde ní èdè Yorùbá òde òní.
- source_word: ἐν πίστει
  choice: nínú ìgbàgbọ́
  rationale: ‘Nínú ìgbàgbọ́’ pa àwòrán ìgbàgbọ́ gẹ́gẹ́ bí ààyè tàbí ìpìlẹ̀ ìfẹ́ wọn mọ́ láì fi kún un pé ‘ìgbàgbọ́ náà’; àwọn ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: ἡ χάρις
  choice: oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún χάρις nínú ìbùkún ìparí lẹ́tà Pọ́ọ̀lù.
- source_word: μετὰ πάντων ὑμῶν
  choice: wà pẹ̀lú gbogbo yín
  rationale: A fi ọ̀rọ̀-ìṣe tí a kò kọ sí Gíríìkì hàn ní ti ẹ̀dá nínú Yorùbá, a sì pa πάντων (‘gbogbo’) mọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú ἐν πίστει
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; tàbí ‘nínú ìgbàgbọ́ náà’
  rationale: Nínú ìkíni ìparí yìí, ‘ìgbàgbọ́’ dára jù lọ gẹ́gẹ́ bí ohun tí àwọn onígbàgbọ́ ní papọ̀ àti ààyè tí ìfẹ́ wọn wà. Síbẹ̀, Gíríìkì náà lè tọ́ka sí ‘ìgbàgbọ́ náà’ tàbí sí ìṣòtítọ́, nítorí náà a pa àṣàyàn náà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìlò rẹ̀ jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘kí’ fún ìkíni lẹ́tà, a sì yà ‘Kí oore-ọ̀fẹ́...’ sí ìbùkún ìparí.
