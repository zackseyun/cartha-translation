  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa àwọn eroja pàtàkì mọ́: gbogbo àwọn tó wà pẹ̀lú ẹni tó ń kọ lẹ́tà náà, ìkíni sí àwọn tí wọ́n fẹ́ràn wọn nínú ìgbàgbọ́, àti ìbùkún oore-ọ̀fẹ́ fún gbogbo yín. Ṣùgbọ́n gbolohun àkọ́kọ́ nílò àmì ìṣe ìsinsìnyí, kí ó lè hàn ní kedere pé ó jẹ́ gbólóhùn ìròyìn (Ἀσπάζονταί), kì í ṣe ìfẹ́-ọba tàbí àṣẹ.'
  naturalness: “Ń kí ọ” jẹ́ ohun tí ó dára síi nínú Yorùbá boṣewa fún ‘wọn kí ọ’ ní ọ̀rọ̀ ìparí lẹ́tà. “Kí àwọn tí ó fẹ́ràn wa nínú ìgbàgbọ́” jẹ́ àṣẹ tí ó kúkúrú, tí ó sì ṣeé lóye ní àyíká ìkíni lẹ́tà.
  terminology: “Oore-ọ̀fẹ́” yẹ fún χάρις nínú ìbùkún ìparí. “Ìgbàgbọ́” jẹ́ ìtumọ̀ àkọ́kọ́ tó dára fún πίστει níbí; àlàyé ìsàlẹ̀ ń pa àwọn ìṣeéṣe mìíràn mọ́. “Ìṣòtítọ́” lè ṣiṣẹ́ fún ‘faithfulness,’ bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìmọ̀ ‘òtítọ́/honesty’; nínú àlàyé náà, ìtumọ̀ náà wà ní ìfẹ̀ẹ́sẹ̀mulẹ̀ gẹ́gẹ́ bí àṣàyàn, kì í ṣe ìtumọ̀ àkọ́kọ́.
