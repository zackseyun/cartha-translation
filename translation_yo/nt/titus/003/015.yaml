    rationale: 'Pẹ̀lú kókó-ọrọ “Gbogbo àwọn tí ó wà pẹ̀lú mi,” “kí ọ” lè dà bí ìfẹ́-ọba/àṣẹ ní Yorùbá. Gíríìkì Ἀσπάζονταί jẹ́ ọ̀rọ̀-ìṣe ìsinsìnyí tí ń sọ ohun tí wọ́n ń ṣe: ‘wọn ń kí ọ.’ Fífi “ń” kún un mú àkókò àti irú gbólóhùn Gíríìkì náà hàn kedere.'
