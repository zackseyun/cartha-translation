  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí inú rere àti ìfẹ́ Ọlọ́run, Olùgbàlà wa, sí ènìyàn farahàn,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ sí ènìyàn”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí inú rere tàbí ìfẹ́ sí àwọn ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: ὅτε ṣe àgbékalẹ̀ gbólóhùn àsìkò, δέ sì fi ìyípadà pẹ̀lẹ́ hàn láti inú àpèjúwe ìgbésí ayé ẹ̀ṣẹ̀ tẹ́lẹ̀ sí ìgbésẹ̀ ìgbàlà Ọlọ́run.
- source_word: χρηστότης
  choice: inú rere
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìwà rere tàbí inú rere tí a ń fi hàn sí ẹlòmíràn; “inú rere” jẹ́ èdè Yorùbá àdánidá, ó sì yàtọ̀ kedere sí φιλανθρωπία.
- source_word: φιλανθρωπία
  choice: ìfẹ́ sí aráyé
  rationale: Ó ń tọ́ka sí inú rere tàbí ìfẹ́ sí àwọn ènìyàn. “Ìfẹ́ sí aráyé” jẹ́ kedere, ó sì yẹra fún lílo ọ̀rọ̀ kan tí yóò mú ìtumọ̀ rẹ̀ di gbogbogbò ju.
- source_word: ἐπεφάνη
  choice: farahàn
  rationale: Fọ́ọ̀mù aorist náà sọ nípa ohun tí ó hàn tàbí tí a mú wá sí ìmọ́lẹ̀; “farahàn” jẹ́ ṣókí, àdánidá, ó sì pa ìtumọ̀ ìfarahàn mọ́ láìṣe àfikún ọ̀nà tí ó gbà ṣẹlẹ̀.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run Olùgbàlà wa
  rationale: Gbolohun genitive náà ní í ṣe pẹ̀lú “inú rere” àti “ìfẹ́ sí aráyé” méjèèjì. “Ọlọ́run Olùgbàlà wa” pa ipò-orúkọ náà mọ́, “láti ọ̀dọ̀” sì mú ìbáṣepọ̀ náà ṣe kedere ní Yorùbá láìyí ìtumọ̀ rẹ̀ padà.
theological_decisions:
- issue: Ẹni tí “Ọlọ́run Olùgbàlà wa” ń tọ́ka sí
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí orúkọ oyè fún Ọlọ́run; nínú àyíká ẹsẹ̀ yìí, ó ń tọ́ka sí Baba, nígbà tí ẹsẹ̀ 6 mẹ́nu kan Jésù Kristi lọ́tọ̀.
  alternative: A lè ka a gẹ́gẹ́ bí orúkọ oyè àtọ̀runwá ní gbogbogbò láìfi dandan dá ẹni pàtó mọ́ nínú ẹsẹ̀ yìí nìkan.
  rationale: Àwọn Lẹ́tà Olùṣọ́-àgùntàn sábà máa ń lo “Ọlọ́run Olùgbàlà wa” fún Baba, wọ́n sì tún pe Jésù Kristi ní Olùgbàlà. Ìtumọ̀ náà kò da àwọn ẹni náà pọ̀, bẹ́ẹ̀ ni kò dín agbára orúkọ oyè náà kù.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “aráyé” ní ìtumọ̀ àwọn ènìyàn lápapọ̀, kì í ṣe gẹ́gẹ́ bí ẹ̀kọ́ ìsìn àkànṣe.
