  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: yo
  text: kí wọn má ṣe sọ̀rọ̀ búburú sí ẹnikẹ́ni[a], kí wọn má ṣe jẹ́ aláwuyewuye[b], kí wọn jẹ́ ẹni pẹ̀lẹ́, kí wọn sì máa fi gbogbo ìwà tútù[c] hàn sí gbogbo ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọn má ṣe sọ ohun búburú nípa ẹnikẹ́ni.” Ọ̀rọ̀ Gíríìkì náà lè kan ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ ìkọlù lápapọ̀, kì í ṣe ẹ̀sùn èké nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí wọn jẹ́ ẹni alálàáfíà.” Ìtumọ̀ gangan ni pé kí wọn má fẹ́ràn ìjà tàbí awuyewuye.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gbogbo ìwà pẹ̀lẹ́.” πραΰτης lè túmọ̀ sí ìwà tútù tàbí ìwà pẹ̀lẹ́; a lo “ìwà tútù” níbí láti yà á sọ́tọ̀ sí “ẹni pẹ̀lẹ́” tó ṣáájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: ẹnikẹ́ni
  rationale: Nínú gbólóhùn tí a sọ ní ọ̀nà òdì, ‘ẹnikẹ́ni’ fi hàn pé kò sí ẹni kan ṣoṣo tí ìkìlọ̀ náà kò kan.
- source_word: βλασφημεῖν
  choice: sọ̀rọ̀-òdì sí
  rationale: Ní àyíká ìtọ́ni nípa bí a ṣe ń bá ènìyàn lò, ọ̀rọ̀ náà túmọ̀ sí sísọ ọ̀rọ̀ búburú tàbí ọ̀rọ̀ ẹ̀gàn sí ẹlòmíràn; yíyan yìí kò fi ìtumọ̀ rẹ̀ mọ́ ẹ̀sùn èké nìkan.
- source_word: ἀμάχους
  choice: má ṣe jẹ́ oníjà
  rationale: Ó pa ìrísí òdì ti ọ̀rọ̀ Gíríìkì mọ́, ó sì sọ ní èdè Yorùbá àdánidá pé kí wọn má fẹ́ràn ìjà tàbí awuyewuye.
- source_word: εἶναι
  choice: kí wọn jẹ́
  rationale: A fi ọ̀nà àṣẹ ‘kí wọn jẹ́’ sọ infinitive náà ní Yorùbá, gẹ́gẹ́ bí ìtẹ̀síwájú àwọn ìtọ́ni inú ẹsẹ tó ṣáájú.
- source_word: ἐπιεικεῖς
  choice: oníwà pẹ̀lẹ́
  rationale: Ó mú èrò inú ọ̀rọ̀ náà jáde pé kí ènìyàn jẹ́ ẹni tútù, tó mọ̀wọ̀n ara rẹ̀, tí kì í sì í fi tiẹ̀ rinlẹ̀ láìgbọ́ ti ẹlòmíràn.
- source_word: πᾶσαν
  choice: pípé
  rationale: Pẹ̀lú orúkọ àìrí ‘ìrẹ̀lẹ̀,’ ‘pípé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ìwọ̀n kíkún tí πᾶσαν ń tẹnumọ́ hàn.
- source_word: ἐνδεικνυμένους
  choice: máa fi ... hàn
  rationale: Ó sọ ìṣe tó ń bá a lọ, ìyẹn fífi ànímọ́ náà hàn nínú ìbálò pẹ̀lú àwọn ẹlòmíràn.
- source_word: πραΰτητα
  choice: ìrẹ̀lẹ̀
  rationale: ‘Ìrẹ̀lẹ̀’ mú inú tútù àti àìṣe alágbára síni tó wà nínú πραΰτης jáde, ó sì yàtọ̀ ní ọ̀rọ̀ sí ‘oníwà pẹ̀lẹ́’ tí a lò fún ἐπιεικεῖς.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: sí gbogbo ènìyàn
  rationale: ‘Gbogbo ènìyàn’ jẹ́ àpapọ̀ fún gbogbo ẹ̀dá ènìyàn, láìfi akọ tàbí abo kan ṣoṣo síwájú.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώπους gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀
  choice: gbogbo ènìyàn
  alternative: gbogbo ọkùnrin
  rationale: Níhìn-ín ἄνθρωποι ń tọ́ka sí gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan; ‘gbogbo ènìyàn’ pa ààlà gbogbo ènìyàn inú orísun mọ́.
- issue: Ìyàtọ̀ láàárín ἐπιεικεῖς àti πραΰτητα
  choice: oníwà pẹ̀lẹ́ ... ìrẹ̀lẹ̀ pípé
  alternative: oníwà tútù ... gbogbo ìwà pẹ̀lẹ́
  rationale: A lo ọ̀rọ̀ méjì tó sún mọ́ra ṣùgbọ́n tí kò dójú kọ ara wọn, kí ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì má bàjẹ́, láìṣe ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tuntun sí wọn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì tẹ̀ síwájú gẹ́gẹ́ bí àtòjọ ìtọ́ni láti ẹsẹ tó ṣáájú. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá.
