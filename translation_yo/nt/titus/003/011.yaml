id: TIT.3.11
reference: Titus 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/011.yaml
  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: yo
  text: Nítorí o mọ̀ pé irú ẹni bẹ́ẹ̀[b] ti yí kúrò ní ọ̀nà[a], ó sì ń ṣẹ̀; òun fúnra rẹ̀ ló dá ara rẹ̀ lẹ́bi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti yapa kúrò ní ọ̀nà” tàbí “ti bàjẹ́.” Ìṣe pípé Gíríìkì náà tọ́ka sí ipò tó wáyé látinú yíyapa tó ti ṣẹlẹ̀ ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, gbólóhùn náà jẹ́ ẹyọ akọ ní gírámà, ṣùgbọ́n “ẹni” ni ọ̀nà àdánidá tí Yorùbá fi ń tọ́ka sí irú ẹni bẹ́ẹ̀ láì samisi akọ tàbí abo.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹni tí ara rẹ̀ dá lẹ́bi.” Ọ̀rọ̀ náà lè túmọ̀ sí pé ìṣe tàbí ẹ̀rí ẹni náà fúnra rẹ̀ ló ń fi ẹ̀bi rẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: Nítorí o mọ̀
  rationale: Ọ̀rọ̀ aláṣepọ̀ yìí tọ́ka sí ẹni tí a pàṣẹ fún ní ẹsẹ tó ṣáájú. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì fi ìbáṣepọ̀ ọ̀rọ̀ náà hàn láì sọ ọ́ di àṣẹ tuntun.
- source_word: ἐξέστραπται
  choice: ti yí kúrò ní ọ̀nà
  rationale: Ìṣe pípé Gíríìkì náà fi ipò tó wà nísinsìnyí, tí ìyapa ṣáájú rẹ̀, hàn. Àṣàyàn yìí pa àwòrán yíyapa mọ́, kò sì fi ìtumọ̀ àkànṣe tí ó le jù kún un.
- source_word: ὁ τοιοῦτος
  choice: irú ẹni bẹ́ẹ̀
  rationale: Èyí tọ́ka sí ẹni tó ń dá ìyapa sílẹ̀ nínú àyíká ọ̀rọ̀ náà. Yorùbá kì í fi akọ tàbí abo hàn nínú ‘ẹni’; èyí ni ọ̀nà àdánidá láti tú gbólóhùn Gíríìkì náà láì sọ pé obìnrin tàbí ọkùnrin níbi tí àyíká kò ti fi dandan bẹ́ẹ̀ múlẹ̀.
- source_word: ἁμαρτάνει
  choice: ó sì ń ṣẹ̀
  rationale: Àmì ‘ń’ fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì bá ìṣe àsìkò ìsinsìnyí nínú Gíríìkì mu láì fi ‘ń bá a lọ’ kún ohun tí ọ̀rọ̀ náà sọ.
- source_word: ὢν
  choice: òun fúnra rẹ̀ ló
  rationale: Dípò lílo ọ̀rọ̀ aláṣepọ̀ tí kò ní dùn bí Yorùbá, ìtẹnumọ́ ‘òun fúnra rẹ̀’ so àpèjúwe ìkẹyìn mọ́ ẹni náà, ó sì mú agbára ọ̀rọ̀ àpapọ̀ náà jáde.
- source_word: αὐτοκατάκριτος
  choice: dá ara rẹ̀ lẹ́bi
  rationale: 'Gbóhùn yìí fi agbára ìpadà-sórí-ara ẹni hàn: ipò, ìṣe, tàbí ẹ̀rí ẹni náà fúnra rẹ̀ ló fi ẹ̀bi rẹ̀ hàn. Kò fi ìdájọ́ ikẹyìn tàbí ètò ilé-ẹjọ́ tí Gíríìkì kò sọ kún un.'
theological_decisions:
- issue: Ìtọ́kasí akọ nínú ὁ τοιοῦτος
  choice: irú ẹni bẹ́ẹ̀
  alternative: irú ọkùnrin bẹ́ẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní gírámà, ó ń tọ́ka sí ‘irú ẹni bẹ́ẹ̀’ ní gbogbogbò. Yorùbá àdánidá kò samisi akọ tàbí abo nínú ‘ẹni,’ nítorí náà fífi ‘ọkùnrin’ sí i lè fi ìtumọ̀ tí àyíká kò béèrè kún un.
- issue: Agbára αὐτοκατάκριτος
  choice: òun fúnra rẹ̀ ló dá ara rẹ̀ lẹ́bi
  alternative: ẹni tí a ti dá lẹ́bi nípasẹ̀ ara rẹ̀
  rationale: Àṣàyàn náà pa ìtumọ̀ mọ́ pé ìṣe tàbí ẹ̀rí ẹni náà fúnra rẹ̀ ń fi ẹ̀bi rẹ̀ hàn, láì pinnu bóyá ó jẹ́ ìdájọ́ inú ọkàn rẹ̀ tàbí ìdájọ́ ilé-ẹjọ́ kan.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún. Àmì àárín-gbólóhùn ya ìyípadà ẹni náà àti ẹ̀ṣẹ̀ rẹ̀ sọ́tọ̀ kúrò nínú ìparí pé ìṣe tirẹ̀ fúnra rẹ̀ ló ń fi ẹ̀bi rẹ̀ hàn.
