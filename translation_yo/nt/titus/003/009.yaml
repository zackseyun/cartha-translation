id: TIT.3.9
reference: Titus 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: yo
  text: Ṣùgbọ́n yẹra fún àwọn àríyànjiyàn òmùgọ̀[a], àwọn ìtàn ìran, ìjàngbọ̀n, àti ìjà nípa òfin[b], nítorí wọn kò wúlò, asán sì ni wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ìbéèrè òmùgọ̀,” “àwọn awuyewuye òmùgọ̀,” tàbí “àwọn ìfojúrí òmùgọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “àwọn ìjà tó jẹ mọ́ òfin”; ìyẹn ni, ìjà nípa òfin.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: àwọn àríyànjiyàn òmùgọ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ìwádìí tàbí ọ̀rọ̀ àríyànjiyàn tí kò ní ọgbọ́n tàbí èrè. Èyí jẹ́ èdè Yorùbá àdánidá tó sì pa agbára ìkìlọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: γενεαλογίας
  choice: àwọn ìtàn ìran
  rationale: Èyí pa ìtumọ̀ gbòòrò ti ‘genealogies’ mọ́ láì fi kún un pé irú àlàyé ìran pàtó kan ni.
- source_word: ἔρεις
  choice: ìjàngbọ̀n
  rationale: ‘Ìjàngbọ̀n’ ń fi èdèkòyédè àti ìforígbárí hàn, ó sì yà díẹ̀ sí ọ̀rọ̀ μάχας tó tẹ̀ lé e.
- source_word: μάχας νομικὰς
  choice: ìjà nípa òfin
  rationale: Gbólóhùn yìí túmọ̀ sí ìjà tàbí awuyewuye tí ó jẹ mọ́ òfin, kì í ṣe ẹjọ́ ilé-ẹjọ́.
- source_word: περιΐστασο
  choice: yẹra fún
  rationale: Àṣẹ ọ̀rọ̀ Gíríìkì ni pé kí ẹni náà pa ara rẹ̀ mọ́ kúrò nínú irú àwọn nǹkan wọ̀nyí; ‘yẹra fún’ jẹ́ kedere, ó sì bá Yorùbá òde òní mu.
- source_word: ἀνωφελεῖς
  choice: wọn kò wúlò
  rationale: Ó fi hàn pé wọn kò ní àǹfààní tàbí ìrànwọ́ kankan.
- source_word: μάταιοι
  choice: asán sì ni wọn
  rationale: Ó pa ìtumọ̀ ohun tí ó ṣófo, tí kò sì lè mú èso rere jáde mọ́, ó sì yà sí ‘wọn kò wúlò’.
theological_decisions:
- issue: Irú ‘ìtàn ìran’ àti ‘ìjà nípa òfin’ tí ẹsẹ náà ń tọ́ka sí
  choice: A túmọ̀ àwọn ọ̀rọ̀ náà ní ìtumọ̀ gbòòrò wọn láì sọ pé ètò ẹ̀sìn tàbí ẹ̀kọ́ kan pàtó ni.
  alternative: A lè túmọ̀ ‘ìtàn ìran’ sí àríyànjiyàn nípa ìran àwọn Júù, tàbí sí ìfojúrí nípa àwọn ìtàn àròsọ ti àwọn ẹgbẹ́ kan.
  rationale: Ẹsẹ náà kò fún wa ní àlàyé tó tó láti dá irú ìtumọ̀ ìtàn kan pàtó múlẹ̀. Títúmọ̀ rẹ̀ ní gbòòrò pa àìdánilójú inú ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, kò sì fi ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì lo ọ̀pọ̀ orúkọ bí ó ṣe wà nínú Gíríìkì.
