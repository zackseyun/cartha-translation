id: TIT.3.3
reference: Titus 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: yo
  text: Nítorí àwa fúnra wa náà nígbà kan rí jẹ́ aláìlóye, aláìgbọ́ràn, a sì ń ṣìnà, a jẹ́ ẹrú fún onírúurú ìfẹ́kúfẹ̀ẹ́ àti ìgbádùn, a ń lo ìgbésí ayé wa nínú ìkà àti ìlara, a jẹ́ ẹni ìríra[a], a sì ń kórìíra ara wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí a kórìíra.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹni ìríra tàbí ẹni tí a kórìíra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Nítorí pé àwa fúnra wa pẹ̀lú ti jẹ́ ... nígbà kan rí
  rationale: “Nítorí pé” fi ìsopọ̀ γάρ hàn; “àwa fúnra wa pẹ̀lú” pa ìtẹnumọ́ καὶ ἡμεῖς mọ́, “nígbà kan rí” sì túmọ̀ ποτε lọ́nà àdánidá.
- source_word: ἀνόητοι
  choice: aláìlóye
  rationale: Ó ṣàfihàn àìní òye àti ìrònú rere tí ọ̀rọ̀ náà ní, láìfi ẹ̀gàn àṣejù kún un.
- source_word: ἀπειθεῖς
  choice: aláìgbọ́ràn
  rationale: Ó bá àyíká àkójọ ìwà búburú mu, ó sì ní ìtumọ̀ àìgbọ́ràn tí ó wá láti inú kíkọ̀ láti gba ìtọ́ni.
- source_word: πλανώμενοι
  choice: a ń ṣìnà
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ jíjẹ́ ẹni tí ó yapa kúrò ní ọ̀nà tó tọ́ mọ́, láìfi dandan sọ pé ẹlòmíràn ló ń ṣì wọ́n lọ́nà.
- source_word: δουλεύοντες
  choice: a sì ti di ẹrú
  rationale: Ó pa agbára èdè ẹrú mọ́, ó sì fi hàn pé ìfẹ́kúfẹ̀ẹ́ àti ìgbádùn ń ṣàkóso wọn, kì í ṣe pé wọ́n kàn ń sìn wọ́n lásán.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: onírúurú ìfẹ́kúfẹ̀ẹ́ àti ìgbádùn
  rationale: “Ìfẹ́kúfẹ̀ẹ́” ní ìtumọ̀ ìfẹ́ tí kò bófin mu ní ọ̀nà gbígbòòrò, kì í ṣe ti ìbálòpọ̀ nìkan; “onírúurú” kan àwọn orúkọ méjèèjì ní ìtumọ̀.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: A ń lo ìgbésí ayé wa nínú ìkà àti ìlara
  rationale: “Ń lo ìgbésí ayé wa” mú ìṣe tí ó ń bá a lọ nínú διάγοντες jáde; “ìkà” bá ìwà búburú sí ẹlòmíràn mu, “ìlara” sì jẹ́ ìtumọ̀ tààrà fún φθόνος.
- source_word: στυγητοί
  choice: ẹni ìríra
  rationale: Ó pa ìtumọ̀ aláṣiṣẹ́ náà mọ́—ẹni tí ìwà rẹ̀ yẹ fún ìríra—ṣùgbọ́n ọ̀rọ̀ Gíríìkì tún lè ní ìtumọ̀ ẹni tí a kórìíra.
- source_word: μισοῦντες ἀλλήλους
  choice: a sì ń kórìíra ara wa
  rationale: Ìtúmọ̀ Yoruba àdánidá fún ọ̀rọ̀ aláìpé àti arọ́pò-orúkọ ìfèsì, tí ó tọ́ka sí ìkórìíra láàárín ara wọn.
theological_decisions:
- issue: Agbára èdè ìdè-ẹrú nínú δουλεύοντες nígbà tí ìfẹ́ àti ìgbádùn jẹ́ olúwa
  choice: a sì ti di ẹrú onírúurú ìfẹ́kúfẹ̀ẹ́ àti ìgbádùn
  alternative: a ń sin onírúurú ìfẹ́kúfẹ̀ẹ́ àti ìgbádùn
  rationale: Àyíká náà ṣàpèjúwe ìdè ìwà ẹni tẹ́lẹ̀. “Di ẹrú” pa agbára ọ̀rọ̀ náà mọ́ láìfi ètò ẹ̀kọ́ ìsìn kan tí kò sí nínú ẹsẹ náà kún un.
- issue: Bí a ṣe lè lóye στυγητοί
  choice: ẹni ìríra
  alternative: ẹni tí a kórìíra
  rationale: Àkójọ ìwà búburú náà lè tọ́ka sí pé wọ́n jẹ́ ẹni ìríra, ṣùgbọ́n àpèjúwe náà tún lè jẹ́ ohun tí àwọn ẹlòmíràn ṣe sí wọn; àlàyé ìsàlẹ̀ pa méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo àtúnsọ gbolohun díẹ̀ láti jẹ́ kí àkójọ àwọn participle Gíríìkì ṣàn lọ́nà àdánidá ní Yorùbá.
