  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: yo
  text: Kí àwọn ènìyàn wa náà[a] sì kọ́ láti máa fi ara wọn fún iṣẹ́ rere[b], láti lè bojú tó àwọn àìní tó pọndandan[c], kí wọn má bàa jẹ́ aláìso èso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tiwa.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti máa ṣe iṣẹ́ rere”; tàbí, “láti máa darí iṣẹ́ rere.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn àìní kánjúkánjú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: kí ... kọ́
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ fún ẹni kẹta ní ọ̀pọ̀; ìṣètò ‘kí ... kọ́’ fi ìṣírí aláṣẹ náà hàn lọ́nà àdánidá ní Yorùbá láìfi agbára kún un ju ti Gíríìkì lọ.
- source_word: οἱ ἡμέτεροι
  choice: àwọn ènìyàn wa
  rationale: Ní ti gírámà, ó túmọ̀ sí ‘àwọn tiwa’; ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí àwọn tó jẹ́ ti àwùjọ onígbàgbọ́ Pọ́ọ̀lù àti Títù, láìdín un kù sí àwọn ọkùnrin nìkan.
- source_word: καλῶν ἔργων
  choice: iṣẹ́ rere
  rationale: Èyí jẹ́ ìtumọ̀ tó ṣe kedere, tó sì pa àtúnṣe kókó inú ìwé Títù mọ́ nípa àwọn ìṣe tó dára, tó sì ṣe àwọn ẹlòmíràn láǹfààní.
- source_word: προΐστασθαι
  choice: láti máa fi ara wọn fún ṣíṣe
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí dídarí, bíbójútó, tàbí fífi ara ẹni fún ohun kan. Ní ìbáṣepọ̀ rẹ̀ pẹ̀lú ‘iṣẹ́ rere’ níbí, yíyan yìí fi ìfaramọ́ àti ṣíṣe déédéé hàn, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: láti pèsè fún àwọn àìní tó pọndandan
  rationale: 'Gbólóhùn yìí fi ète iṣẹ́ rere hàn: pípèsè ohun tó yẹ fún àwọn àìní gidi tí kò ṣeé yà sílẹ̀. ‘Tó pọndandan’ ṣe àfihàn agbára ἀναγκαίας láìfi dandan túmọ̀ rẹ̀ sí kánjúkánjú.'
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: kí wọn má bàa jẹ́ aláìléso
  rationale: ‘Kí ... má bàa’ fi ète gbólóhùn ἵνα hàn, ‘aláìléso’ sì pa àwòrán èdè ti àìso èso mọ́ dípò yíyí i padà sí ‘aláìní ìmúṣẹ.’
theological_decisions:
- issue: Ìwọ̀n àwọn tí οἱ ἡμέτεροι ń tọ́ka sí
  choice: Àwọn ènìyàn inú àwùjọ onígbàgbọ́ tó ní ìbáṣepọ̀ pẹ̀lú Pọ́ọ̀lù àti Títù
  alternative: Àwọn ọkùnrin tiwa; tàbí àwọn tiwa ní ìyàtọ̀ sí àwọn tó wà lóde
  rationale: Gbólóhùn náà jẹ́ ti ìbáṣepọ̀ àti àwùjọ, kò sì ní àmì tó fi dín àwọn ẹni tí ó ń tọ́ka sí kù sí ọkùnrin nìkan. ‘Àwọn ènìyàn wa’ bá àwùjọ alájọpọ̀ mu, láìfi ẹ̀kọ́ ẹ̀sìn kan kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ προΐστασθαι ní ìbáṣepọ̀ pẹ̀lú iṣẹ́ rere
  choice: Fífi ara wọn fún ṣíṣe iṣẹ́ rere
  alternative: Ṣíṣe iṣẹ́ rere; tàbí mímú ipò iwájú nínú iṣẹ́ rere
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìwọ̀n ìtumọ̀ tó lè ní ìdarí tàbí ìfaramọ́ nínú. Àyíká ọ̀rọ̀ kò fipá mú ìtumọ̀ ipò olórí nínú ìjọ; nítorí náà, a lo ìfaramọ́ sí iṣẹ́ rere nínú ọ̀rọ̀ pàtàkì, a sì pa ìtumọ̀ ìdarí mọ́ nínú àlàyé.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tó yẹ. Ìṣètò ‘kí ... sì’ pa δέ àti agbára ìṣírí mọ́; ‘máa fi ara wọn fún ṣíṣe’ jẹ́ àdánidá, ó sì fi ìṣe tó ń bá a lọ hàn. Àwòrán ‘aláìléso’ ni a pa mọ́ nítorí ó ṣe pàtàkì sí ìtumọ̀ ìwà àti ti ẹ̀mí inú ọ̀rọ̀ náà.
