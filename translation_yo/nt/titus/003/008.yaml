id: TIT.3.8
reference: Titus 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: yo
  text: Ọ̀rọ̀ yìí ṣeé gbẹ́kẹ̀ lé. Mo sì fẹ́ kí o máa tẹnumọ́ pẹ̀lú ìdánilójú nípa àwọn nǹkan wọ̀nyí[a], kí àwọn tí wọ́n ti gba Ọlọ́run gbọ́[b] lè máa ṣọ́ra láti fi ara wọn fún àwọn iṣẹ́ rere. Àwọn nǹkan wọ̀nyí dára, wọ́n sì wúlò fún àwọn ènìyàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “jẹ́rìí sí wọn pẹ̀lú ìdánilójú” tàbí “tẹnumọ́ wọn gidigidi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn tí wọ́n ti ní ìgbàgbọ́ nínú Ọlọ́run” tàbí “àwọn tí wọ́n ti gbẹ́kẹ̀ lé Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Ọ̀rọ̀ yìí ṣeé gbẹ́kẹ̀ lé
  rationale: Ó mú ìtumọ̀ ọ̀rọ̀ ìdánilójú inú àwọn lẹ́tà olùṣọ́-àgùntàn jáde ní Yorùbá àdánidá; λόγος tọ́ka sí ọ̀rọ̀ tàbí ìkéde tí ó ṣáájú, kì í ṣe ọ̀rọ̀ kan ṣoṣo.
- source_word: περὶ τούτων
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí àwọn ohun tí a ṣẹ̀ṣẹ̀ sọ, ní ọ̀nà tí ó ṣe kedere, tí ó sì bá èdè Yorùbá mu.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: Mo sì fẹ́ kí o fi ìdánilójú tẹnumọ́
  rationale: “Mo fẹ́ kí o” fi ìfẹ́ tàbí ìpinnu olùsọ̀rọ̀ hàn; “fi ìdánilójú tẹnumọ́” sì pa agbára àti ìgboyà inú διαβεβαιοῦσθαι mọ́ láì sọ ọ́ di àríyànjiyàn.
- source_word: ἵνα φροντίζωσιν
  choice: kí ... lè máa fiyè sí
  rationale: “Máa fiyè sí” sọ ìṣọ́ra àti fífi ọkàn sí ohun kan, èyí tí φροντίζω ń béèrè, ní Yorùbá tí ó rọrùn.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: fífi ara wọn fún àwọn iṣẹ́ rere
  rationale: Ní àyíká ọ̀rọ̀ yìí, προΐστασθαι túmọ̀ sí lílo ara ẹni gidigidi nínú iṣẹ́ rere tàbí fífi ara ẹni jìn fún un, kì í ṣe dandan jíjẹ́ aṣáájú ètò kan.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: àwọn tí ó ti gba Ọlọ́run gbọ́
  rationale: 'Ó pa àkókò pípé ti participle náà mọ́, ó sì tẹ̀lé dative θεῷ ní tààràtà: wọ́n ti gba Ọlọ́run gbọ́, wọ́n sì wà nínú ipò ìgbàgbọ́ yẹn.'
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: Àwọn nǹkan wọ̀nyí dára, wọ́n sì wúlò fún àwọn ènìyàn
  rationale: Ó pa ọ̀pọ̀ nǹkan tí ταῦτα ń tọ́ka sí mọ́, ó sì fi ìwà rere àti àǹfààní wọn hàn ní èdè Yorùbá àdánidá; “àwọn ènìyàn” jẹ́ ti gbogbo akọ àti abo.
theological_decisions:
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti iṣẹ́ rere
  choice: A gbé iṣẹ́ rere kalẹ̀ gẹ́gẹ́ bí ohun tí ó yẹ kí ó máa jáde nínú ìgbàgbọ́ tí ó ti wà tẹ́lẹ̀.
  alternative: Kí a sọ iṣẹ́ rere di ìpìlẹ̀ ìgbàlà tàbí kí a sọ ọ́ di ìmọ̀ràn lásán tí kò ní ìsopọ̀ pẹ̀lú ìgbàgbọ́.
  rationale: Ètò ọ̀rọ̀ Gíríìkì kọ́kọ́ pe àwọn ènìyàn náà ní àwọn tí ó ti gba Ọlọ́run gbọ́, lẹ́yìn náà ni ó rọ̀ wọ́n láti fi ara wọn fún iṣẹ́ rere; ìtumọ̀ náà pa ìtẹ̀lé yìí mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹlẹ́gbẹ́ kan kún un.
- issue: Ohun tí πιστεύω pẹ̀lú dative θεῷ ń tọ́ka sí
  choice: Ọ̀rọ̀ pàtàkì ni “gba Ọlọ́run gbọ́.”
  alternative: “gba Ọlọ́run gbọ́ gẹ́gẹ́ bí ẹni tí ó wà” tàbí “gbẹ́kẹ̀ lé Ọlọ́run.”
  rationale: θεῷ gẹ́gẹ́ bí dative lè túmọ̀ sí gbígba Ọlọ́run fúnra rẹ̀ gbọ́ tàbí gbígbẹ́kẹ̀ lé e. A yan ọ̀nà tó sún mọ́ ìṣètò Gíríìkì jù, a sì pa ìtumọ̀ “gbẹ́kẹ̀ lé” mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ó ní ọ̀wọ̀ àti ìdúróṣinṣin, ṣùgbọ́n ó ṣì ṣeé lóye fún òǹkàwé òde òní. A fi àmì àlàyé [a] sí lẹ́yìn gbolohun tí ó bá διαβεβαιοῦσθαι mu, a sì fi [b] sí lẹ́yìn gbolohun tí ó bá οἱ πεπιστευκότες θεῷ mu, kí àlàyé kọ̀ọ̀kan lè tọ́ka sí ibi tó yẹ.
