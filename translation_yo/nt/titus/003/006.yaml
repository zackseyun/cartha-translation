  text: whom he poured out on us richly through Jesus the Messiah our Savior[b][a],
translation:
  language: yo
  text: ẹni[a] tí Ọlọ́run tú sórí wa lọ́pọ̀ yanturu nípasẹ̀ Jesu Mèsáyà[b], Olùgbàlà wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí Ọlọ́run tú sórí wa lọ́pọ̀ yanturu”; ọ̀rọ̀ náà ń tọ́ka sí Ẹ̀mí Mímọ́ ní ẹsẹ tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “Jesu Kristi”; a tú Χριστός sí “Mèsáyà” níbí nítorí pé ó jẹ́ oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan náà tọ́ka sí Ẹ̀mí Mímọ́ ní ẹsẹ tó ṣáájú. “Ẹni tí” jẹ́ ọ̀nà àdánidá láti tọ́ka sí ẹni ní Yorùbá, ó sì pa ìtọ́kasí náà mọ́.
- source_word: ἐξέχεεν
  choice: tú sí wa lórí
  rationale: “Tú” ni ìtumọ̀ àkọ́kọ́ ti ἐκχέω, ó sì bá àwòrán títú Ẹ̀mí jáde mu. “Sí wa lórí” fi ìdarí ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: ἐφ’ ἡμᾶς
  choice: sí wa lórí
  rationale: ἐπί pẹ̀lú accusative ń fi ìdarí sí ẹni tàbí ohun kan hàn; ọ̀rọ̀ Yorùbá yìí túmọ̀ rẹ̀ ní kedere.
- source_word: πλουσίως
  choice: lọ́pọ̀ yanturu
  rationale: Ó sọ ọ̀pọ̀lọpọ̀ àti àkúnwọ́sílẹ̀; “lọ́pọ̀ yanturu” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì níyì.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Pẹ̀lú genitive, διά ń tọ́ka sí ọ̀nà tàbí aṣojú tí ìṣe fi ṣẹlẹ̀; “nípasẹ̀” ni ìtumọ̀ Yorùbá tó yẹ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà níbí, kì í ṣe orúkọ lásán. Fífi “Mèsáyà” sílẹ̀ ń pa ìtumọ̀ oyè náà mọ́.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: Olùgbàlà wa
  rationale: “Olùgbàlà” jẹ́ oyè Yorùbá àdánidá fún σωτήρ, “wa” sì fi genitive ἡμῶν hàn.
theological_decisions:
- issue: Ẹni tí οὗ ń tọ́ka sí
  choice: Ó tọ́ka sí Ẹ̀mí Mímọ́ tí a mẹ́nu kàn ní Títù 3:5; nítorí náà a lo “ẹni.”
  alternative: A lè lo “èyí tí” bí a bá tú ọ̀rọ̀ arọ́pò-orúkọ náà lọ́nà tí kò fi ìjẹ́-ẹni hàn tó bẹ́ẹ̀.
  rationale: Ẹ̀mí Mímọ́ ni antecedent tó sún mọ́ ọn jù, “ẹni” sì jẹ́ àdánidá ní Yorùbá fún ìtọ́kasí ara-ẹni. Àfikún “Ọlọ́run” gẹ́gẹ́ bí olùṣe mú ìbáṣepọ̀ gírámà kedere, ó sì tẹ̀ lé koko-ọrọ̀ tó ń ṣe ìṣe náà láti àwọn ẹsẹ tó ṣáájú.
- issue: Bí a ṣe tú Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè lẹ́gbẹ̀ẹ́ “Olùgbàlà wa”; “Mèsáyà” mú ìtumọ̀ oyè náà jáde ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbo. A lo “lọ́pọ̀ yanturu” dípò gbólóhùn tó lè dà bí ìtumọ̀ ọrọ̀-sí-ọ̀rọ̀ tí kò bá Yorùbá mu.
