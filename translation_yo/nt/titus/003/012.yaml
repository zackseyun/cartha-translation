id: TIT.3.12
reference: Titus 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: yo
  text: Nígbà tí mo bá rán Átémásì tàbí Tíkíkù sí ọ, sapá gidigidi láti wá bá mi ní Níkópólì,[a] nítorí mo ti pinnu láti lo ìgbà òtútù níbẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi taratara gbìyànjú láti wá bá mi ní Níkópólì,” tàbí, “ṣe gbogbo ohun tí o lè ṣe láti wá bá mi ní Níkópólì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo ti pinnu láti dúró níbẹ̀ jálẹ̀ ìgbà òtútù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Nígbà tí mo bá rán
  rationale: Àkópọ̀ ὅταν pẹ̀lú aorist subjunctive tọ́ka sí ohun kan tí a retí pé yóò ṣẹlẹ̀ lọ́jọ́ iwájú; ìṣètò ‘nígbà tí ... bá’ jẹ́ Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: Ἀρτεμᾶν ... ἢ Τυχικόν
  choice: Árítémà tàbí Tíkíkù
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ náà ní ìbámu pẹ̀lú ìró wọn nínú Gíríìkì, a sì pa ἢ mọ́ gẹ́gẹ́ bí ‘tàbí,’ nítorí ọ̀kan nínú àwọn méjèèjì ni a ó rán.
- source_word: σπούδασον
  choice: sa gbogbo ipá rẹ
  rationale: Ọ̀rọ̀ àṣẹ náà ń fi ìtara, ìmúratán, àti ìsapá tọkàntọkàn hàn; ‘sa gbogbo ipá rẹ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere láì sọ ọ́ di kìkì ‘yára.’
- source_word: ἐλθεῖν πρός με εἰς Νικόπολιν
  choice: láti wá bá mi ní Níkópólì
  rationale: ἐλθεῖν πρός με jẹ́ ìrìn sí ọ̀dọ̀ ẹni tó ń sọ̀rọ̀, nítorí náà ‘wá bá mi’ bá a mu; ‘ní Níkópólì’ sọ ibi tí Títù yóò ti bá Pọ́ọ̀lù láì tún ‘sí’ sọ lọ́nà tí kò rọrùn.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó mú ìdí fún ìbéèrè tó ṣáájú wọlé ní Yorùbá àdánidá.
- source_word: κέκρικα
  choice: mo ti pinnu
  rationale: Perfect indicative náà fi ìpinnu tí a ti ṣe, tí ó sì ṣì dúró, hàn; ‘mo ti pinnu’ mú ipò ìpinnu yẹn jáde ní kedere.
- source_word: παραχειμάσαι
  choice: láti lo ìgbà òtútù
  rationale: Infinitive náà túmọ̀ sí pé kí ẹni dúró tàbí gbé ní ibì kan jálẹ̀ àkókò òtútù; ‘lo ìgbà òtútù’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti lẹ́tà ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A yan ‘sa gbogbo ipá rẹ’ láti pa agbára σπούδασον mọ́, àti ‘lo ìgbà òtútù’ fún παραχειμάσαι.
