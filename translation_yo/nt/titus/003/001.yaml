id: TIT.3.1
reference: Titus 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: yo
  text: Máa rán wọn létí pé kí wọ́n tẹríba fún àwọn alákòóso àti àwọn aláṣẹ[a], kí wọ́n ṣègbọràn, kí wọ́n sì múra tán fún gbogbo iṣẹ́ rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n tẹríba fún àwọn alákòóso àti àwọn aláṣẹ, kí wọ́n sì gbọ́ràn sí wọn.”
    reason: Ìṣètò ọ̀rọ̀ Gíríìkì lè so “ṣègbọràn” mọ́ àwọn alákòóso àti àwọn aláṣẹ ní tààràtà.
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Máa rán … létí
  rationale: Ọ̀rọ̀ àṣẹ ìsinsìnyí náà ń tọ́ka sí ohun tí Títù gbọ́dọ̀ máa ṣe déédéé; “Máa rán … létí” sọ agbára yìí ní Yorùbá àdánidá.
- source_word: αὐτοὺς
  choice: wọn
  rationale: Arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn onígbàgbọ́ tí Títù ń kọ́.
- source_word: ἀρχαῖς
  choice: àwọn alákòóso
  rationale: Nínú àyíká ọ̀rọ̀ ìjọba yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn tó ń ṣàkóso, kì í ṣe àwọn agbára ẹ̀mí.
- source_word: ἐξουσίαις
  choice: àwọn aláṣẹ
  rationale: Èyí pa ìtumọ̀ àwọn tó ní àṣẹ ìjọba mọ́, ó sì jẹ́ kí gbólóhùn méjì ti Gíríìkì—àwọn alákòóso àti àwọn aláṣẹ—wà lọ́tọ̀.
- source_word: ὑποτάσσεσθαι
  choice: kí wọ́n tẹríba fún
  rationale: “Tẹríba fún” fi hàn pé ẹni kan fi ara rẹ̀ sí abẹ́ ètò àṣẹ, láìfi ìtumọ̀ ìsìnrú tí kò lẹ́gbẹ̀ẹ́ kún un.
- source_word: πειθαρχεῖν
  choice: kí wọ́n ṣègbọràn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi etí sí àṣẹ àti ṣíṣe ohun tí àṣẹ béèrè; “ṣègbọràn” jẹ́ Yorùbá tó ṣe kedere, tí kò sì di ẹni tí a gbọdọ̀ gbọ́ sí mọ́ apá yìí nìkan.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: fún gbogbo iṣẹ́ rere
  rationale: Èyí pa ìtumọ̀ ìmúrasílẹ̀ sí gbogbo iṣẹ́ rere mọ́, ó sì jẹ́ gbólóhùn tó wọ́pọ̀, tó yéni ní Yorùbá.
- source_word: ἑτοίμους εἶναι
  choice: kí wọ́n sì múra tán
  rationale: “Múra tán” sọ ipò ìmúrasílẹ̀ tí gbólóhùn Gíríìkì náà ń béèrè lọ́nà àdánidá.
theological_decisions:
- issue: Ìwọ̀n tẹríba àti ìgbọràn sí àwọn aláṣẹ ìjọba
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìkìlọ̀ gbogbogbò láti tẹríba àti láti ṣègbọràn sí àwọn aláṣẹ, láìfi kún un pé ìgbọràn náà kò ní ààlà ní gbogbo ipò.
  alternative: Kí a túmọ̀ ọ́ lọ́nà tó fi hàn pé ènìyàn gbọ́dọ̀ ṣègbọràn sí ìjọba láìsí ààlà kankan.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ìpè sí tẹríba àti ìgbọràn ní kedere, ṣùgbọ́n kò ṣàlàyé gbogbo ààlà tàbí gbogbo ipò tó lè yọrí sí àtakò; nítorí náà, a kò yanjú ìṣòro ẹ̀kọ́ ìgbàgbọ́ yẹn sínú ìtumọ̀.
- issue: Bóyá πειθαρχεῖν ní àwọn alákòóso àti àwọn aláṣẹ gẹ́gẹ́ bí ohun tí a ń gbọ́ràn sí
  choice: Ọ̀rọ̀ pàtàkì fi “kí wọ́n ṣègbọràn” sílẹ̀ láìsọ ẹni tí wọ́n ń gbọ́ràn sí ní tààràtà.
  alternative: Kí a so ó mọ́ àwọn alákòóso àti àwọn aláṣẹ pé, “kí wọ́n sì gbọ́ tiwọn.”
  rationale: Ìṣètò ọ̀rọ̀ Gíríìkì lè jẹ́ kí àwọn ọ̀rọ̀ dátífù náà bá “tẹríba” àti “gbọ́ràn” méjèèjì lọ, ṣùgbọ́n àmì ìdádúró àti ìbáṣepọ̀ gírámà kò fi dandan yanjú rẹ̀. Àlàyé ìsàlẹ̀ pa ọ̀nà kejì mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. “Máa rán … létí” mú ìtẹ̀síwájú àṣẹ náà jáde; “tẹríba fún” àti “múra tán” jẹ́ àwọn ọ̀rọ̀ àdánidá tí kò ní àfikún ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
