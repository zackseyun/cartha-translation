id: TIT.3.5
reference: Titus 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: yo
  text: Kì í ṣe nítorí àwọn iṣẹ́ tí a ṣe nínú òdodo[a], tí àwa fúnra wa ṣe, ṣùgbọ́n ní ìbámu pẹ̀lú àánú rẹ̀ ni ó fi gbà wá là, nípasẹ̀ ìwẹ̀ ti àtúnbí[b] àti ìsọdọtun láti ọwọ́ Ẹ̀mí Mímọ́[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn iṣẹ́ tí a ṣe nínú ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “òdodo” tàbí “ìdájọ́ òdodo”; “òdodo” ni a lò nínú ẹsẹ̀ náà ní ìbámu pẹ̀lú bí Páùlù ti sábà máa ń lo ọ̀rọ̀ náà.
    reason: alternative_reading
  - marker: b
    text: “Ìwẹ̀” lè tọ́ka sí ìbatisí, àwòrán ìwẹ̀nùmọ́, tàbí àwọn méjèèjì; ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò fipá mú wa láti yan ọ̀kan nínú wọn nínú ẹsẹ̀ náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìsọdọtun Ẹ̀mí Mímọ́.” Ìṣètò ọ̀rọ̀ Gíríìkì gba ọ̀nà tó yà díẹ̀ síra láti so “Ẹ̀mí Mímọ́” pọ̀ mọ́ “ìsọdọtun.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: kì í ṣe nítorí àwọn iṣẹ́
  rationale: ἐκ tọ́ka sí ìpìlẹ̀ tàbí ohun tí ìgbàlà ti inú rẹ̀ wá; ‘nítorí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé àwọn iṣẹ́ kì í ṣe ìdí tàbí ìpìlẹ̀ ìgbàlà.
- source_word: τῶν ἐν δικαιοσύνῃ
  choice: tí a ṣe nínú òdodo
  rationale: Gbólóhùn náà ṣàpèjúwe àwọn iṣẹ́ gẹ́gẹ́ bí èyí tí a ṣe nínú òdodo. ‘Òdodo’ pa ìtumọ̀ Páùlù mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ‘ìdájọ́ òdodo’ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: èyí tí àwa fúnra wa ṣe
  rationale: ‘Àwa fúnra wa’ pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ἡμεῖς mọ́, pé iṣẹ́ ènìyàn fúnra rẹ̀ ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: ní ìbámu pẹ̀lú àánú rẹ̀
  rationale: κατά fi ìlànà tàbí ìpìlẹ̀ hàn. Ìtumọ̀ yìí pa ìyàtọ̀ tó wà láàárín iṣẹ́ wa àti àánú Ọlọ́run mọ́ láì dín un kù sí ìdí lasán.
- source_word: ἔσωσεν ἡμᾶς
  choice: ni ó fi gbà wá là
  rationale: ‘Gbà wá là’ ni ọ̀rọ̀ Yorùbá àdánidá fún ìgbàlà nínú àyíká ẹ̀kọ́ ìgbàlà yìí.
- source_word: διὰ λουτροῦ
  choice: nípasẹ̀ ìwẹ̀
  rationale: διά pẹ̀lú ọ̀rọ̀ ní genitive fi ohun èlò tàbí ọ̀nà hàn. ‘Ìwẹ̀’ pa àwòrán fífọ̀ mọ́, kò sì pinnu bóyá ó ń tọ́ka sí ìbatisí, ìwẹ̀nùmọ́ àpẹẹrẹ, tàbí àwọn méjèèjì.
- source_word: παλιγγενεσίας
  choice: ti àtúnbí
  rationale: ‘Àtúnbí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìbí tuntun tàbí regeneration, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καὶ ἀνακαινώσεως
  choice: àti ìsọdọtun
  rationale: ‘Ìsọdọtun’ jẹ́ ọ̀rọ̀-orúkọ tó bá ἀνακαίνωσις mu, ó sì dúró ní ìṣọ̀kan pẹ̀lú ‘àtúnbí.’
- source_word: πνεύματος ἁγίου
  choice: láti ọwọ́ Ẹ̀mí Mímọ́
  rationale: Ọ̀rọ̀ yìí fi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí orísun tàbí olùṣe ìsọdọtun, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘ìsọdọtun Ẹ̀mí Mímọ́’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àyíká ọ̀rọ̀ Páùlù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: Níbí, ọ̀rọ̀ náà ń ṣàpèjúwe irú iṣẹ́ tí a ṣe. ‘Òdodo’ ni ìtumọ̀ àkọ́kọ́ tó bójú mu, ṣùgbọ́n a pa ìtumọ̀ tó lè jẹ́ ‘ìdájọ́ òdodo’ mọ́ nínú àlàyé.
- issue: Agbára ìtumọ̀ διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: 'èdè ohun èlò láì sọ ní pàtó pé ìbatisí ni: ‘nípasẹ̀ ìwẹ̀ ti àtúnbí àti ìsọdọtun láti ọwọ́ Ẹ̀mí Mímọ́’'
  alternative: ‘nípasẹ̀ ìwẹ̀ ìbatisí ti àtúnbí’ tàbí ‘nípasẹ̀ ìwẹ̀nùmọ́ ti àtúnbí’
  rationale: λουτρόν lè tọ́ka sí ìbatisí, àwòrán ìwẹ̀nùmọ́, tàbí àwọn méjèèjì. Ọ̀rọ̀ àkọ́kọ́ kò fi ‘ìbatisí’ kún un, kí ìfojúdi ẹ̀kọ́ ìgbàgbọ́ náà má bàa di yíyanju nípasẹ̀ ìtumọ̀.
- issue: Ìbáṣepọ̀ ‘Ẹ̀mí Mímọ́’ pẹ̀lú àwọn ọ̀rọ̀-orúkọ tó ṣáájú rẹ̀
  choice: 'fi orísun tàbí iṣẹ́ rẹ̀ mọ́ ‘ìsọdọtun’ jù lọ: ‘ìsọdọtun láti ọwọ́ Ẹ̀mí Mímọ́’'
  alternative: ‘ìsọdọtun Ẹ̀mí Mímọ́’
  rationale: πνεύματος ἁγίου sún mọ́ ἀνακαινώσεως jù lọ, ṣùgbọ́n ìṣètò Gíríìkì gba ìtumọ̀ ìbáṣepọ̀ mìíràn láàyè; àlàyé ìsàlẹ̀ pa èyí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè mu. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti àkókò òde òní, ó sì yẹ fún kíkà ní gbangba. A lo ‘àtúnbí,’ ‘ìsọdọtun,’ àti ‘Ẹ̀mí Mímọ́’ gẹ́gẹ́ bí ọ̀rọ̀ tó ṣe kedere fún òǹkàwé Yorùbá lasán, láì fi ẹ̀kọ́ ẹ̀ya ìjọ kan kún ọ̀rọ̀ náà.
