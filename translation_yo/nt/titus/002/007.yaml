translation:
  language: yo
  text: Ní gbogbo ọ̀nà[a], fi ara rẹ hàn gẹ́gẹ́ bí àpẹẹrẹ iṣẹ́ rere[b]; nínú ìkọ́ni rẹ[c], fi àìbàjẹ́[d] àti ìwà ọ̀wọ̀[e] hàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nínú ohun gbogbo.” Gbólóhùn Gíríìkì náà tún lè túmọ̀ sí “nípa ohun gbogbo,” ṣùgbọ́n níbí ó ṣeé ṣe jù pé ó túmọ̀ sí “ní gbogbo ọ̀nà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí àwòṣe” tàbí “gẹ́gẹ́ bí àpẹẹrẹ.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nínú ẹ̀kọ́ náà” tàbí “nínú ẹ̀kọ́ ìgbàgbọ́.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “ìwà mímọ́” tàbí “ìwà títọ́.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ohun tí kò bàjẹ́ tàbí tí a kò sọ di eléèérí.
    reason: lexical_alternative
  - marker: e
    text: Tàbí, “iyì” tàbí “ìjẹ́kí-ẹni-bọ̀wọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: Ní gbogbo ọ̀nà
  rationale: Gbólóhùn náà ń ṣiṣẹ́ bí ọ̀rọ̀ àfikún tí ó fi hàn pé gbogbo apá ìwà Títù ni ọ̀rọ̀ náà kàn; èyí jẹ́ Yorùbá àdánidá fún ‘in every way,’ nígbà tí ‘nínú ohun gbogbo’ ṣì ṣeé ṣe.
- source_word: σεαυτὸν παρεχόμενος
  choice: máa fi ara rẹ hàn
  rationale: Ó pa agbára arọ́pò-orúkọ ara-ẹni mọ́, ó sì sọ ìṣe tí Títù ń ṣe láti jẹ́ ẹni tí àwọn ẹlòmíràn lè rí kí wọ́n sì tẹ̀ lé.
- source_word: τύπον
  choice: àpẹẹrẹ
  rationale: Nínú ọ̀rọ̀ ìwà rere yìí, τύπος túmọ̀ sí ẹni tàbí àwòṣe tí a lè fara wé; ‘àpẹẹrẹ’ ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: καλῶν ἔργων
  choice: nínú ṣíṣe iṣẹ́ rere
  rationale: Ìtumọ̀ yìí jẹ́ ti ara Yorùbá, ó sì fi hàn pé àwọn iṣẹ́ rere ni Títù gbọ́dọ̀ jẹ́ àpẹẹrẹ nínú wọn, láìfi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: nínú ìkọ́ni rẹ
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí iṣẹ́ Títù gẹ́gẹ́ bí olùkọ́. Fífi ‘rẹ’ kún un mú un ṣe kedere ní Yorùbá, láìsọ διδασκαλία di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tóóró nìkan.
- source_word: ἀφθορίαν
  choice: ìwà àìbàjẹ́
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ìpilẹ̀ ti ohun tí kò bàjẹ́ tàbí tí a kò sọ di eléèérí. ‘Ìwà àìbàjẹ́’ dá ìtumọ̀ gbòòrò yìí sílẹ̀, ó sì lè kan mímọ́ tàbí òtítọ́ inú ìkọ́ni àti ìwà olùkọ́.
- source_word: σεμνότητα
  choice: ìwà tí ó yẹ fún ọ̀wọ̀
  rationale: σεμνότης jẹ́ ìwà pàtàkì, ìwà ọ̀wọ̀, tí ó yẹ kí ènìyàn bọ̀wọ̀ fún; gbolohun yìí jẹ́ kedere ju lílo ‘ọ̀wọ̀’ nìkan lọ.
theological_decisions:
- issue: Bóyá διδασκαλία yẹ kí a túmọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀ ìjọ tó túmọ̀ sí doctrine
  choice: A lò ‘ìkọ́ni’
  alternative: ‘ẹ̀kọ́ ìgbàgbọ́’ tàbí ‘ẹ̀kọ́ náà’
  rationale: Ọ̀rọ̀ náà lè kan ohun tí Títù ń kọ́ni àti bí ó ṣe ń kọ́ni. ‘Ìkọ́ni’ pa ìbú rẹ̀ mọ́, kò sì há a mọ́ ètò ẹ̀kọ́ ìjọ kan.
- issue: Bí a ṣe lè lóye ἀφθορίαν nínú ìkọ́ni
  choice: A pa àwòrán àìbàjẹ́ mọ́ ní ‘ìwà àìbàjẹ́’
  alternative: ‘ìwà mímọ́’ tàbí ‘ìdúróṣinṣin’
  rationale: Ọ̀rọ̀ Gíríìkì kò fipá mú wa láti yan ìwà mímọ́ nìkan tàbí ìdúróṣinṣin nìkan. Yíyan ọ̀rọ̀ tó gbòòrò yìí pa àìdánilójú àti agbára ìwà rere inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. ‘Máa fi ara rẹ hàn’ ń sọ participle Gíríìkì di àṣẹ tó ń bá ọ̀rọ̀ àyíká mu, nígbà tí ìtòlẹ́sẹẹsẹ àkọsílẹ̀ náà pa ìbáṣepọ̀ àwọn ànímọ́ pẹ̀lú ìkọ́ni Títù mọ́.
