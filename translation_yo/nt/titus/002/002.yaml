revisions:
- from: Kí àwọn ọkùnrin àgbà jẹ́ oníwọ̀ntúnwọ̀nsì, ẹni tí ó yẹ fún ọ̀wọ̀, kí wọ́n máa kó ara wọn níjàánu, kí wọ́n sì ní ìlera nínú ìgbàgbọ́[a], nínú ìfẹ́ àti nínú ìfaradà.
  to: Kí àwọn ọkùnrin àgbà jẹ́ oníwọ̀ntúnwọ̀nsì, ọlọ́lá, ẹni tí ó ní ìkóra-ẹni-níjàánu, kí wọ́n sì jẹ́ alágbára nínú ìgbàgbọ́[a], nínú ìfẹ́, àti nínú ìfaradà.
  rationale: Àtúnṣe náà pa ìtòlẹ́sẹẹsẹ àti agbára ìtọ́ni ọ̀rọ̀ Gíríìkì mọ́, ó sì sọ àwọn ìwà náà ní Yorùbá tó dára. ‘Alágbára nínú’ jẹ́ ìtumọ̀ àpẹẹrẹ tó wúlò fún ὑγιαίνοντας ní ọ̀rọ̀ ìwà rere; a kò yí ìbùdó ìtumọ̀ πίστις padà, a kan ṣe ìtumọ̀ yíyàn nínú àlàyé ìsàlẹ̀ ní kedere.
  reviewer_model: gpt-5.6-terra
