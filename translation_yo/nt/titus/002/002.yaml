id: TIT.2.2
reference: Titus 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: yo
  text: Kí àwọn ọkùnrin àgbà jẹ́ oníwọ̀ntúnwọ̀nsì, ọlọ́lá, ẹni tí ó ní ìkóra-ẹni-níjàánu, kí wọ́n sì jẹ́ alágbára nínú ìgbàgbọ́[a], nínú ìfẹ́, àti nínú ìfaradà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣòtítọ́.” Ọ̀rọ̀ Gíríìkì πίστις lè túmọ̀ sí “ìgbàgbọ́” tàbí “ìṣòtítọ́,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: àwọn ọkùnrin àgbà
  rationale: Nínú àyíká ìtọ́ni fún onírúurú ẹgbẹ́ inú ìjọ, ọ̀rọ̀ náà ń tọ́ka sí àwọn ọkùnrin tí ọjọ́-orí wọn ti dàgbà, kì í ṣe sí ipò alàgbà ìjọ.
- source_word: νηφαλίους
  choice: oníwọ̀ntúnwọ̀nsì
  rationale: Ó mú èrò ìṣọ́ra, ọpọlọ tí ó mọ́, àti àìṣe ohun ré kọjá ààlà jáde, láìfi ìtumọ̀ náà mọ́ ọtí mímu nìkan.
- source_word: σεμνούς
  choice: ẹni tí ó yẹ fún ọ̀wọ̀
  rationale: Gbólóhùn yìí sọ ìwà ọlọ́lá àti ìfọ̀kànbalẹ̀ tí ń mú kí ènìyàn yẹ fún ọ̀wọ̀; ó ṣe kedere sí òǹkàwé òde òní.
- source_word: σώφρονας
  choice: máa kó ara wọn níjàánu
  rationale: Ó fi ìṣàkóso ara ẹni àti ìrònú tí a ti kó níjàánu hàn ní èdè Yorùbá àdánidá.
- source_word: ὑγιαίνοντας
  choice: ní ìlera
  rationale: A pa àwòrán ìlera inú ọ̀rọ̀ Gíríìkì mọ́; níbí ó ń ṣàpèjúwe bí ìgbàgbọ́, ìfẹ́ àti ìfaradà wọn ṣe gbọ́dọ̀ jẹ́ èyí tí kò ní àbùkù.
- source_word: τῇ πίστει
  choice: nínú ìgbàgbọ́
  rationale: Ìgbàgbọ́ ni ìtumọ̀ àkọ́kọ́ nínú ọ̀rọ̀; síbẹ̀, ìṣòótọ́ tún ṣeé ṣe, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τῇ ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: Ìfẹ́ ni ìtumọ̀ Yorùbá tí ó ṣe déédé fún ἀγάπη, ó sì bá àwọn ohun rere míì nínú àtòjọ náà mu.
- source_word: τῇ ὑπομονῇ
  choice: nínú ìfaradà
  rationale: Ìfaradà fi sùúrù àti dídúró láìyẹsẹ̀ lábẹ́ ìṣòro hàn ní ṣókí.
- source_word: εἶναι
  choice: Kí ... jẹ́
  rationale: Ìlànà ‘kí ... jẹ́’ mú agbára ìtọ́ni tí ọ̀rọ̀ àìlẹ́ni Gíríìkì gbà láti inú ẹsẹ tó ṣáájú jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àtòjọ àwọn ìwà rere
  choice: ìgbàgbọ́
  alternative: ìṣòótọ́
  rationale: 'Àjọpọ̀ ‘ìgbàgbọ́, ìfẹ́ àti ìfaradà’ lè tọ́ka sí gbígbẹ́kẹ̀lé Ọlọ́run tàbí sí jíjẹ́ olóòótọ́. A kò dá ìṣiyèméjì náà nù: ‘ìgbàgbọ́’ wà nínú àyọkà, ‘ìṣòótọ́’ sì wà nínú àlàyé ìsàlẹ̀.'
translation_notes:
  register: Èdè náà jẹ́ Yorùbá à标准 tí ó ní àmì ohùn níbi tí ó ti yẹ, ó sì jẹ́ ọ̀wọ̀, kedere, àti èyí tí àwọn òǹkàwé òde òní lè lóye. A lo àtòjọ ìtọ́ni tí ó ṣàn dáadáa, a sì pa àwòrán ‘ìlera’ inú ọ̀rọ̀ Gíríìkì mọ́.
