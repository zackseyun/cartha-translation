review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń fi gbogbo àwọn ìwà mẹ́fà tí ọ̀rọ̀ Gíríìkì béèrè hàn, ó sì tọ́ka πρεσβύτας sí àwọn ọkùnrin tí ọjọ́ orí wọn ti dàgbà, kì í ṣe ọ́fíìsì àwọn alàgbà. Ṣùgbọ́n ‘ní ìlera nínú’ dà bí ìlera ara ní Yorùbá ju àpẹẹrẹ ìwà/ẹ̀mí tí ὑγιαίνοντας ń gbé kalẹ̀ lọ.
  naturalness: Àtòjọ ìwà náà lè rọrùn, ṣùgbọ́n yíyí láti ‘jẹ́’ sí ‘ẹni tí ó yẹ’ (ẹyọ kan) àti lẹ́yìn náà sí ‘wọ́n’ kò ṣàn dáradára. ‘Ìkóra-ẹni-níjàánu’ àti ‘alágbára nínú’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti sọ ìṣàkóso ara ẹni àti jíjẹ́ alágbára/sọ́ọ̀mù nínú àwọn ìwà mẹ́tẹ̀ẹ̀ta náà.
  terminology: '‘Oníwọ̀ntúnwọ̀nsì,’ ‘ọlọ́lá,’ ‘ìkóra-ẹni-níjàánu,’ ‘ìgbàgbọ́,’ ‘ìfẹ́,’ àti ‘ìfaradà’ bá ìtumọ̀ àti ìforúkọsílẹ̀ ìwà rere nínú ẹsẹ̀ náà mu. A tún gbọdọ̀ ṣàtúnṣe àlàyé ìsàlẹ̀: ‘ìṣòótọ́’ sábà máa ń túmọ̀ sí truth, nígbà tí ìtumọ̀ faithfulness yẹ kí ó jẹ́ ‘ìṣòtítọ́.’'
