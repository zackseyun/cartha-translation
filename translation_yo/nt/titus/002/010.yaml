id: TIT.2.10
reference: Titus 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: yo
  text: kí wọn má ṣe gba ohun olúwa wọn fún ara wọn, ṣùgbọ́n kí wọ́n máa fi ìwà ìṣòtítọ́ pátápátá hàn[a], kí wọn lè fi ẹ̀kọ́ Ọlọ́run Olùgbàlà wa ṣe lọ́ṣọ̀ọ́ nínú ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lo πίστις, tí ìtumọ̀ rẹ̀ lè jẹ́ “ìgbàgbọ́.” Ṣùgbọ́n ní àyíká yìí, ó ṣeé ṣe kó túmọ̀ sí ìṣòtítọ́, fídélítì, tàbí jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: jí ohun olúwa wọn mú fún ara wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ohun tí í ṣe ti ẹlòmíràn fún ara ẹni. Ní àyíká ọ̀rọ̀ ẹrú àti olúwa yìí, gbólóhùn náà ṣe kedere pé ohun olúwa wọn ni wọn kò gbọdọ̀ jí mú.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: fi hàn pé wọ́n ṣeé gbẹ́kẹ̀ lé pátápátá
  rationale: Nínú àyíká ìwà iṣẹ́ yìí, πίστις ń tọ́ka sí ìṣòtítọ́ àti jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé; πᾶσαν ń fi ìpéye kún un, ἀγαθήν sì ń fi hàn pé ó jẹ́ ìṣòtítọ́ rere tòótọ́.
- source_word: κοσμῶσιν
  choice: fi ... ṣe lọ́ṣọ̀ọ́
  rationale: 'Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́: ìwà rere wọn ń ṣe ẹ̀kọ́ náà lọ́ṣọ̀ọ́, ìyẹn, ó ń mú kí ẹwà rẹ̀ hàn.'
- source_word: διδασκαλίαν
  choice: ẹ̀kọ́
  rationale: “Ẹ̀kọ́” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, tó ṣeé lóye nírọ̀rùn fún ìkọ́ni tàbí ohun tí a ń kọ́ni.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Ọlọ́run Olùgbàlà wa
  rationale: Èyí tẹ̀ lé ìbáṣepọ̀ àwọn ọ̀rọ̀ inú Gíríìkì, láì sọ pé gbólóhùn náà ń tọ́ka sí Kristi ní pàtó nínú ẹsẹ yìí.
- source_word: ἐν πᾶσιν
  choice: nínú ohun gbogbo
  rationale: Ìtumọ̀ yìí pa ìwọ̀n gbígbòòrò gbólóhùn Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àyíká ìwà rere
  choice: wọ́n ṣeé gbẹ́kẹ̀ lé pátápátá
  alternative: wọ́n ní ìgbàgbọ́ rere ní gbogbo ọ̀nà
  rationale: Bí ó tilẹ̀ jẹ́ pé πίστις lè túmọ̀ sí “ìgbàgbọ́,” àyíká yìí ń sọ nípa bí àwọn ẹrú ṣe ń hùwà sí àwọn olúwa wọn; nítorí náà, ìṣòtítọ́ tàbí jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé ni ìtumọ̀ tó ṣeé ṣe jù. Àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn míì mọ́.
- issue: Ẹni tí “Ọlọ́run Olùgbàlà wa” ń tọ́ka sí
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí “Ọlọ́run Olùgbàlà wa.”
  alternative: Kí a túmọ̀ ọ́ ní ọ̀nà tó sọ pé Kristi ni a ń pè ní Ọlọ́run nínú gbólóhùn yìí.
  rationale: Ẹsẹ yìí fúnra rẹ̀ pè Ọlọ́run ní Olùgbàlà wa. A kò gbọ́dọ̀ fi ìtumọ̀ Kristẹni mìíràn tí kò hàn gbangba nínú gbólóhùn yìí kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. “Jí ohun olúwa wọn mú fún ara wọn” mú ìtumọ̀ ọ̀rọ̀ Gíríìkì àti àyíká ẹrú-olúwa hàn kedere; “ṣe lọ́ṣọ̀ọ́” sì pa àkàwé inú κοσμῶσιν mọ́.
