id: TIT.2.8
reference: Titus 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: yo
  text: ọ̀rọ̀ tí ó yẹ, tí a kò lè dá lẹ́bi,[a] kí ẹni tí ó ń tako wa lè tijú,[b] níwọ̀n bí kò ní ohun búburú kankan láti sọ nípa wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọ̀rọ̀ tí ó ní ìlera” tàbí “ọ̀rọ̀ tí kò sí lábẹ́ àríwísí.”
    reason: lexical_alternative
  - marker: b
    text: Èdè Gíríìkì ní “ẹni tí ó wà ní ìhà òdì”; ìyẹn ni, alatako. “Lè tijú” tún lè túmọ̀ sí “kí a lè mú un tijú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: ọ̀rọ̀
  rationale: Ní àyíká ẹsẹ yìí, ó ń tọ́ka sí ohun àti ọ̀nà tí Títù fi ń sọ̀rọ̀ nínú ìkọ́ni; “ọ̀rọ̀” jẹ́ àdánidá ní Yorùbá, ó sì lè gba ìtumọ̀ ọ̀rọ̀ sísọ tàbí iṣẹ́ ìránṣẹ́.
- source_word: ὑγιῆ
  choice: tí ó péye
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí ohun tí ó ní ìlera, ṣùgbọ́n ní àwọn Lẹ́tà Olùṣọ́-agùntàn ó sábà ń ṣàpẹẹrẹ ohun tí ó tọ́, tí kò ní àbùkù nínú ẹ̀kọ́ àti ìwà. “Tí ó péye” sọ ìtumọ̀ náà ní Yorùbá àdánidá.
- source_word: ἀκατάγνωστον
  choice: tí a kò lè dá lẹ́bi
  rationale: Ó túmọ̀ sí ohun tí kò sí lábẹ́ ìdálẹ́bi tàbí àríwísí tí ó lẹ́sẹ̀ nílẹ̀. Gbólóhùn yìí jẹ́ kedere, ó sì pa agbára ìtumọ̀ ìdájọ́ àti orúkọ rere mọ́.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Àkójọpọ̀ yìí fi ète tàbí àbájáde tí a ń lépa hàn ní Yorùbá àdánidá.
- source_word: ὁ ἐξ ἐναντίας
  choice: ẹni tí ó ń tako wa
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí ẹni tí ó wà ní ìhà òdì; “ẹni tí ó ń tako wa” mú ipa alatako náà hàn láìfi ẹni náà hàn gẹ́gẹ́ bí ẹni pàtó kan.
- source_word: ἐντραπῇ
  choice: lè tijú
  rationale: Fọ́ọ̀mù náà lè ṣàpèjúwe kí ojú ti ẹni tàbí kí a mú un tijú. “Lè tijú” jẹ́ àdánidá, ó sì pa ìtumọ̀ àwùjọ àti ti ìwà rere mọ́.
- source_word: μηδὲν ἔχων λέγειν
  choice: kò ní ohun ... kankan láti sọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé alatako kò ní ẹ̀sùn kankan tí ó lè fi kàn wọ́n.
- source_word: περὶ ἡμῶν
  choice: nípa wa
  rationale: A pa arọ́pò-orúkọ ẹni àkọ́kọ́ ọ̀pọ̀ “wa” mọ́, láìdín àwọn tí ó ń tọ́ka sí kù tàbí mú wọn gbòòrò sí i.
- source_word: φαῦλον
  choice: ohun búburú
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó burú ní ti ìwà tàbí ẹ̀sùn aburú; “ohun búburú” pa ìwọ̀n ìwà rere rẹ̀ mọ́.
theological_decisions:
- issue: Ààlà àwọn tí περὶ ἡμῶν (“nípa wa”) ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní ṣókí sí “nípa wa.”
  alternative: “nípa rẹ,” “nípa àwa Kristẹni,” tàbí “nípa ẹ̀kọ́ wa.”
  rationale: Gíríìkì lo ẹni àkọ́kọ́ ọ̀pọ̀. Pípa “wa” mọ́ kò jẹ́ ká fi dandan sọ pé Pọ́ọ̀lù àti Títù nìkan ni, tàbí gbogbo ìjọ, tàbí ẹ̀kọ́ wọn ni ọ̀rọ̀ náà ń tọ́ka sí.
- issue: Agbára ohùn ἐντραπῇ
  choice: “lè tijú”
  alternative: “kí a lè mú un tijú.”
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ palolo, ṣùgbọ́n Yorùbá “tijú” lè sọ àbájáde náà lọ́nà àdánidá láìfi hàn pé àwọn onígbàgbọ́ ló mọ̀ọ́mọ̀ ń dójú ti alatako.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “péye” dípò àwòrán “ní ìlera” nínú àkọ́kọ́ ọ̀rọ̀ fún ìtumọ̀ àdánidá, ṣùgbọ́n a pa àwòrán orísun náà mọ́ nínú àlàyé ìsàlẹ̀.
