id: TIT.2.14
reference: Titus 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: yo
  text: ẹni tí ó fi ara rẹ̀ fún wa, kí ó lè rà wá padà kúrò nínú gbogbo ìwà àìlófin, kí ó sì wẹ́ àwọn ènìyàn tí ó jẹ́ ohun ìní pàtó tirẹ̀ mọ́ fún ara rẹ̀[a], tí wọ́n ní ìtara fún iṣẹ́ rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “àwọn ènìyàn iyebíye rẹ̀” tàbí “àwọn ènìyàn àkànṣe.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ májẹ̀mú pé àwọn ènìyàn wọ̀nyí jẹ́ ohun ìní tirẹ̀ ní ọ̀nà àkànṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: fi ara rẹ̀ fún wa
  rationale: Ó pa ìtumọ̀ fífi ara ẹni fúnni ní àtinúwá mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ὑπὲρ ἡμῶν
  choice: fún wa
  rationale: Ó pa ìtumọ̀ pé ó ṣe é nítorí wa tàbí ní ipò wa mọ́ láìfi ẹ̀kọ́ kan pàtó nípa ètùtù kún ọ̀rọ̀ náà.
- source_word: ἵνα λυτρώσηται
  choice: kí ó lè rà wá padà
  rationale: “Rà ... padà” fi ìdáǹdè tí ìràpadà mú hàn, ó sì pa àwòrán ìsan owó ìràpadà mọ́.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: kúrò nínú gbogbo ìwà àìlófin
  rationale: “Ìwà àìlófin” sún mọ́ ìtumọ̀ ἀνομία ju ọ̀rọ̀ gbogbogbò bí “ìwà búburú” lọ.
- source_word: καθαρίσῃ
  choice: wẹ ... mọ́
  rationale: Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì gba ìtumọ̀ ìwẹ̀nùmọ́ nípa ìwà àti nípa májẹ̀mú.
- source_word: ἑαυτῷ
  choice: fún ara rẹ̀
  rationale: Ó fi hàn pé àwọn ènìyàn náà jẹ́ tirẹ̀ àti pé ìwẹ̀nùmọ́ wọn jẹ́ fún un.
- source_word: λαὸν περιούσιον
  choice: àwọn ènìyàn kan ... gẹ́gẹ́ bí ohun ìní tirẹ̀
  rationale: Ó pa èrò májẹ̀mú nípa àwọn ènìyàn tí Ọlọ́run ní ní ọ̀nà àkànṣe mọ́, láìdín un kù sí “àwọn ènìyàn pàtàkì” lásán.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: tí wọ́n ní ìtara fún iṣẹ́ rere
  rationale: Ó túmọ̀ ìfẹ́ gbígbóná àti ìmúrasílẹ̀ láti máa ṣe iṣẹ́ rere ní Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Agbára ὑπὲρ ἡμῶν nínú fífi ara Kristi fúnni
  choice: fún wa
  alternative: ní ipò wa; nítorí wa
  rationale: “Fún wa” gba ìtumọ̀ àǹfààní àti ti ìrọ́pò láàyè, láìfi ẹ̀kọ́ ètùtù kan ṣoṣo lé ẹsẹ náà lórí.
- issue: Ìtumọ̀ májẹ̀mú ti λαὸν περιούσιον
  choice: àwọn ènìyàn ... gẹ́gẹ́ bí ohun ìní tirẹ̀
  alternative: àwọn ènìyàn iyebíye rẹ̀; àwọn ènìyàn àkànṣe
  rationale: Àṣàyàn yìí pa ìtumọ̀ jíjẹ́ ohun ìní Ọlọ́run ní ọ̀nà àkànṣe àti ìróhìn èdè májẹ̀mú inú Májẹ̀mú Láéláé mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “rà ... padà” àti “wẹ ... mọ́” gẹ́gẹ́ bí gbólóhùn àdánidá, a sì fi àmì ohùn sí ibi tí ó yẹ.
