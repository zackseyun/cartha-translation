id: TIT.2.11
reference: Titus 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: yo
  text: Nítorí oore-ọ̀fẹ́ Ọlọ́run tí ń mú ìgbàlà wá fún gbogbo ènìyàn[b] ti farahàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “oore-ọ̀fẹ́ Ọlọ́run ti farahàn láti gba gbogbo ènìyàn là,” tàbí, “oore-ọ̀fẹ́ Ọlọ́run ti farahàn sí gbogbo ènìyàn.” Ọ̀nà tí a fi lè so àpèjúwe Gíríìkì σωτήριος (“tí ń gba là,” “tí ń mú ìgbàlà wá”) àti gbólóhùn πᾶσιν ἀνθρώποις pọ̀ yà díẹ̀ síra.
    reason: lexical_alternative
  - marker: b
    text: “Gbogbo ènìyàn” túmọ̀ ọ̀rọ̀ Gíríìkì ἀνθρώποις gẹ́gẹ́ bí gbogbo ẹ̀dá ènìyàn; kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: ti farahàn
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí pé ohun kan ti fara hàn tàbí ti di mímọ̀ ní gbangba. “Ti farahàn” jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣẹ̀lẹ̀ náà àti ipa rẹ̀ títí di ìsinsìnyí mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ń fi ìdí tàbí àlàyé fún àwọn ìṣílétí tó ṣáájú múlẹ̀. “Nítorí” bá iṣẹ́ rẹ̀ nínú àyíká ọ̀rọ̀ mu.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ojúrere tí a kò tọ́ sí, ó sì yẹ fún lílo Pọ́ọ̀lù níbí.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìsopọ̀ orúkọ ní Yorùbá, “oore-ọ̀fẹ́ Ọlọ́run,” fi genitive Gíríìkì hàn lọ́nà àdánidá láìfi kún un pé ó wá “láti ọ̀dọ̀” Ọlọ́run nìkan.
- source_word: σωτήριος
  choice: tí ń mú ìgbàlà wá
  rationale: Àpèjúwe yìí sọ pé oore-ọ̀fẹ́ náà ní agbára tàbí iṣẹ́ fífi ìgbàlà mú wá. Ìtumọ̀ yìí dára ní Yorùbá ju gbígbìyànjú láti so “olùgbàlà” mọ́ oore-ọ̀fẹ́ lọ.
- source_word: πᾶσιν ἀνθρώποις
  choice: fún gbogbo ènìyàn
  rationale: “Ènìyàn” níbí jẹ́ fún gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan. “Fún” bá “mú ìgbàlà wá” mu, ó sì pa ìwọ̀n gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́ láìdín in kù sí àwọn irú ènìyàn kan.
theological_decisions:
- issue: Ìwọ̀n πᾶσιν ἀνθρώποις ní ìbáṣepọ̀ pẹ̀lú ìgbàlà
  choice: fún gbogbo ènìyàn
  alternative: sí gbogbo ènìyàn; fún gbogbo onírúurú ènìyàn
  rationale: Ìtumọ̀ náà pa gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́, láìpinnu pé ó dájú pé olúkúlùkù ènìyàn ni a ó gbà là tàbí pé àwọn ẹ̀ka ènìyàn gbogbo nìkan ni Pọ́ọ̀lù ní lọ́kàn.
- issue: Ìbáṣepọ̀ σωτήριος pẹ̀lú χάρις àti πᾶσιν ἀνθρώποις
  choice: 'A mú un gẹ́gẹ́ bí àpèjúwe oore-ọ̀fẹ́: “tí ń mú ìgbàlà wá fún gbogbo ènìyàn.”'
  alternative: “ti farahàn láti gba gbogbo ènìyàn là” tàbí “ti farahàn sí gbogbo ènìyàn”
  rationale: Ilana ọ̀rọ̀ Gíríìkì lè gba ìtumọ̀ díẹ̀ ju ọ̀kan lọ. Àṣàyàn àkọ́kọ́ jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “oore-ọ̀fẹ́” àti “ìgbàlà” nítorí wọ́n jẹ́ ọ̀rọ̀ ẹ̀sìn tí ó ti wọ́pọ̀, ṣùgbọ́n a kọ́ gbólóhùn náà lọ́nà àdánidá. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
