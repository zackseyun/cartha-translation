id: TIT.2.5
reference: Titus 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: yo
  text: kí wọ́n máa kó ara wọn ní ìjánu, kí wọ́n jẹ́ mímọ́, kí wọ́n máa ṣe iṣẹ́ ilé[a], kí wọ́n jẹ́ onínúure, kí wọ́n sì máa tẹríba fún àwọn ọkọ tiwọn[b], kí a má bàa sọ̀rọ̀-òdì sí ọ̀rọ̀ Ọlọ́run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí wọ́n máa fi ara wọn fún iṣẹ́ inú ilé” tàbí “kí wọ́n máa bójú tó ilé.” Ọ̀rọ̀ Giriki náà kò wọ́pọ̀, ó sì ń tọ́ka sí fífi ara ẹni ṣe iṣẹ́ àti ojúṣe ilé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí wọ́n máa fi ara wọn sábẹ́ àwọn ọkọ tiwọn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “kí a má bàa tàbùkù sí” tàbí “kí a má bàa sọ ọ̀rọ̀ àbùkù sí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: kí wọ́n máa kó ara wọn ní ìjánu
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìyèkooro inú àti agbára láti ṣàkóso ìfẹ́ àti ìṣe ẹni. Gbólóhùn Yorùbá yìí ṣe kedere, ó sì bá àkójọ ìwà rere mu.
- source_word: ἁγνάς
  choice: kí wọ́n jẹ́ mímọ́
  rationale: Ó pa ìwà mímọ́, pàápàá jù lọ ìwà rere nípa ìbálòpọ̀ àti ìwà ẹni, mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ọ̀nà kan ṣoṣo.
- source_word: οἰκουργούς
  choice: kí wọ́n máa ṣe iṣẹ́ ilé
  rationale: Ọ̀rọ̀ Giriki tí kò wọ́pọ̀ yìí so ilé àti iṣẹ́ pọ̀; ìtumọ̀ yìí tẹnumọ́ ṣíṣe ojúṣe inú ilé láì fi èrò pé a dè wọ́n mọ́ ilé kún un.
- source_word: ἀγαθάς
  choice: kí wọ́n jẹ́ onínúure
  rationale: Nínú àkójọ ìwà rere yìí, onínúure mú abala ìwà rere sí ẹlòmíràn jáde lọ́nà àdánidá ju ọ̀rọ̀ gbòòrò bíi ‘rere’ lọ.
- source_word: ὑποτασσομένας
  choice: kí wọ́n máa tẹríba fún
  rationale: Ó pa èrò ìtẹríba nínú ìbáṣepọ̀ mọ́, láì fi ètò ẹ̀kọ́ ìjọ kan tàbí ìtumọ̀ tó kọjá ohun tí ẹsẹ náà sọ kún un.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: ọkọ tiwọn
  rationale: 'Nínú àyíká ọ̀rọ̀ ìgbéyàwó yìí, ἀνήρ túmọ̀ sí ọkọ. ‘Tiwọn’ pa ìdíwọ̀n tí ἰδίοις fi lé e mọ́: ọkọ àwọn obìnrin náà fúnra wọn ni.'
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ìṣètò Yorùbá yìí fi ète tàbí àbájáde tí a fẹ́ dènà hàn lọ́nà àdánidá.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó wọ́pọ̀, ó sì lè tọ́ka sí ìhìn Ọlọ́run ní ìtumọ̀ gbòòrò gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe béèrè.
- source_word: βλασφημῆται
  choice: kí a má bàa sọ̀rọ̀-òdì sí
  rationale: Ọ̀rọ̀ Giriki náà lè túmọ̀ sí sísọ̀rọ̀ burúkú, ẹ̀gàn, tàbí ọ̀rọ̀ àbùkù sí ohun kan. ‘Sọ̀rọ̀-òdì sí’ jẹ́ Yorùbá òde òní tó yé ni, ó sì yẹ fún ọ̀rọ̀ Ọlọ́run gẹ́gẹ́ bí ohun tí a ń tàbùkù sí.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ οἰκουργούς láì sọ pé a fi àṣẹ dè obìnrin mọ́ inú ilé
  choice: kí wọ́n máa ṣe iṣẹ́ ilé
  alternative: kí wọ́n máa fi ara wọn fún iṣẹ́ inú ilé; kí wọ́n máa bójú tó ilé
  rationale: Ọ̀rọ̀ náà tẹnumọ́ iṣẹ́ àti ojúṣe ilé, ṣùgbọ́n kò sọ ní pàtó pé wọn kò gbọ́dọ̀ ṣiṣẹ́ ní ibòmíràn. Ìtumọ̀ náà kò gbé ìdènà tí kò sí nínú Giriki wọlé.
- issue: Bí a ṣe máa pa ìtẹríba inú ὑποτασσομένας mọ́ láì gbé ètò ẹ̀kọ́ ìgbéyàwó ẹ̀ya ìjọ kan wọlé
  choice: kí wọ́n máa tẹríba fún ọkọ tiwọn
  alternative: kí wọ́n máa wà lábẹ́ ọkọ tiwọn; kí wọ́n máa fi ara wọn sábẹ́ ọkọ tiwọn
  rationale: Ìtumọ̀ náà pa ìlànà ìbáṣepọ̀ tí ẹsẹ náà sọ mọ́, ó sì fi ‘tiwọn’ hàn pé ọkọ ẹni kọ̀ọ̀kan ni, kì í ṣe gbogbo ọkùnrin.
- issue: Bí a ṣe máa túmọ̀ βλασφημῆται nígbà tí ohun tí a ń sọ̀rọ̀-òdì sí jẹ́ ọ̀rọ̀ Ọlọ́run
  choice: kí a má bàa sọ̀rọ̀-òdì sí ọ̀rọ̀ Ọlọ́run
  alternative: kí a má bàa tàbùkù sí ọ̀rọ̀ Ọlọ́run; kí a má bàa sọ̀rọ̀-èébú sí ọ̀rọ̀ Ọlọ́run
  rationale: Èyí pa ìtumọ̀ ìbanilórúkọjẹ́ tàbí ẹ̀gàn mọ́. Kò dín ọ̀rọ̀ náà kù sí ìsọ̀rọ̀-èébú sí Ọlọ́run nìkan, bẹ́ẹ̀ ni kò mú ìtumọ̀ ẹ̀sìn pàtó kan wọlé.
translation_notes:
  register: A lo Yorùbá àgbàdojú, ọlọ́lá, tí àwọn òǹkàwé òde òní lè lóye. Àtúnṣe gbólóhùn pẹ̀lú “kí wọ́n máa...” mú àkójọ àwọn ànímọ́ Giriki wọ inú ìlànà Yorùbá àdánidá. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ; a sì yàgò fún èdè àtijọ́ tàbí ọ̀rọ̀ ẹ̀ya ìjọ kan.
