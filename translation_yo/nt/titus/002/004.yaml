translation:
  language: yo
  text: kí wọ́n lè tọ́ àwọn obìnrin ọ̀dọ́[b] sọ́nà[a] láti nífẹ̀ẹ́ ọkọ wọn àti àwọn ọmọ wọn[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kọ́ wọn” tàbí “kọ́ wọn láti ní ìkóra-ẹni-níjàánu”; ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ títọ́ni tàbí dídámọ̀ràn ẹni sí ìrònú àti ìwà tó bójú mu.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn obìnrin ọ̀dọ́”; Gíríìkì ní tààrà ni “àwọn [obìnrin] ọ̀dọ́,” ní ìyàtọ̀ sí àwọn àgbà obìnrin inú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí wọ́n jẹ́ olùfẹ́ ọkọ wọn àti olùfẹ́ àwọn ọmọ wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí wọ́n lè
  rationale: Ó fi ète tàbí àbájáde hàn, ó sì bá ọ̀rọ̀ Yorùbá òde òní mu.
- source_word: σωφρονίζωσι
  choice: tọ́ ... sọ́nà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí dídámọ̀ràn, kíkọ́ni, tàbí títọ́ni sí ìwà ọlọ́gbọ́n àti ìkóra-ẹni-níjàánu. ‘Tọ́ ... sọ́nà’ mú ìtọ́ni tí ń mọ ìwà ènìyàn pọ̀n-ún ṣe jáde lọ́nà àdánidá.
- source_word: τὰς νέας
  choice: àwọn obìnrin ọ̀dọ́
  rationale: Àpèjúwe abo pẹ̀lú akọ́tọ̀ ń tọ́ka sí àwọn obìnrin tí wọ́n kéré ní ọjọ́, ní ìyàtọ̀ sí àwọn àgbà obìnrin inú àyíká ọ̀rọ̀ náà.
- source_word: φιλάνδρους
  choice: máa ní ìfẹ́ sí ọkọ wọn
  rationale: Ó ṣàpèjúwe obìnrin tí ó nífẹ̀ẹ́ ọkọ rẹ̀; gbólóhùn yìí fi ìwà tàbí ìṣesí tó ń bá a lọ hàn ní Yorùbá.
- source_word: εἶναι
  choice: láti máa ní
  rationale: Ó so ohun tí a ń tọ́ wọn sí pọ̀ mọ́ àwọn àpèjúwe méjèèjì; ‘máa’ tún fi ìwà tí ń bá a lọ hàn.
- source_word: φιλοτέκνους
  choice: máa ní ìfẹ́ ... sí àwọn ọmọ wọn
  rationale: Ó túmọ̀ sí jíjẹ́ ẹni tí ó nífẹ̀ẹ́ àwọn ọmọ tirẹ̀, a sì túmọ̀ rẹ̀ ní ìbámu pẹ̀lú φιλάνδρους láti pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìwọ̀n àwọn tí ‘àwọn obìnrin ọ̀dọ́’ ń tọ́ka sí nínú ìtọ́ni nípa agbo ilé
  choice: A túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘àwọn obìnrin ọ̀dọ́,’ láì sọ ọ́ di ‘àwọn aya ọ̀dọ́’ nìkan.
  alternative: ‘Àwọn aya ọ̀dọ́,’ nítorí mẹ́nu kan ọkọ àti ọmọ.
  rationale: Ọ̀rọ̀ Gíríìkì fi ‘àwọn obìnrin ọ̀dọ́’ hàn ní ìyàtọ̀ sí àwọn àgbà obìnrin. Àwọn àpèjúwe tó tẹ̀ lé e dá ipò àwọn tí wọ́n ní ọkọ àti ọmọ sílẹ̀, ṣùgbọ́n kò yẹ kí ìtumọ̀ dín ọ̀rọ̀ Gíríìkì náà kù tàbí sọ ọ́ di àlàyé gbogbo nípa ipò obìnrin.
translation_notes:
  register: A lo Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Tọ́ ... sọ́nà’ jẹ́ ọ̀rọ̀ àdánidá fún ìtọ́ni tó ń mọ ìwà ènìyàn, ‘máa ní ìfẹ́ sí’ sì pa ìtumọ̀ àwọn àpèjúwe Gíríìkì méjèèjì àti ìfarajọ wọn mọ́.
