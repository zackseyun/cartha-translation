  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ó ń bá àwọn àgbà obìnrin sọ̀rọ̀, ó pa ìwà tó yẹ fún ohun mímọ́, ìkìlọ̀ lòdì sí ìbanilórúkọ, àwòrán jíjẹ́ ẹrú wáìnì púpọ̀, àti jíjẹ́ olùkọ́ ohun rere mọ́. Síbẹ̀, ìtumọ̀ ‘kí wọ́n má sì ṣe di ẹrú’ lè dà bí ìkìlọ̀ lòdì sí bíbẹ̀rẹ̀ sí í di ẹrú, dípò ipò passive perfect pé wáìnì ti di ẹni náà lómìnira. Àtúnṣe náà jẹ́ kí ìdè yìí hàn kedere.'
  naturalness: Àwọn ìlànà gbólóhùn nínú àtúnṣe náà jẹ́ Yorùbá òde òní tí ó ní ìwọ̀ntúnwọ̀nsì, tí ó sì yẹ fún ìwé mímọ́. ‘Ní ìwà tí ó yẹ fún ẹni mímọ́’ jẹ́ àdánidá ju ‘lọ́nà tí ó yẹ fún ohun mímọ́’ lọ, nítorí ἱεροπρεπεῖς ń ṣàpèjúwe ìhùwàsí ènìyàn.
