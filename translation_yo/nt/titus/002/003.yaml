  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: yo
  text: Àwọn àgbà obìnrin náà gbọdọ̀ ní ìwà tí ó yẹ fún ẹni mímọ́, kí wọ́n má ṣe jẹ́ aláṣọ̀rọ̀ búburú, kí wọ́n má sì jẹ́ ẹrú fún wáìnì púpọ̀,[a] kí wọ́n jẹ́ olùkọ́ ohun rere,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “kí wọ́n má ṣe jẹ́ afẹ́fẹ́ wáìnì púpọ̀.” Ní ti gidi, ọ̀rọ̀ Gíríìkì náà ní, “àwọn tí a ti sọ di ẹrú fún wáìnì púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: àwọn àgbà obìnrin
  rationale: Ó tọ́ka sí àwọn obìnrin tí ọjọ́-orí wọn ti lọ, ó sì bá ìtọ́kasí àwọn àgbà ọkùnrin nínú ẹsẹ tó ṣáájú mu.
- source_word: ὡσαύτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó pa ìsopọ̀ mọ́ ìṣírí tó wà nínú ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìbámu ní Yorùbá.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: máa hùwà lọ́nà tí ó yẹ fún ohun mímọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà sọ nípa ìrísí ìwà tàbí ìhùwàsí tí ó bá ohun mímọ́ mu; ìtumọ̀ yìí pa ìtumọ̀ ἱεροπρεπεῖς mọ́ ju lílo ‘ọ̀wọ̀’ nìkan lọ.
- source_word: μὴ διαβόλους
  choice: kí wọ́n má ṣe jẹ́ afọ̀rọ̀-ẹni-kàn
  rationale: Nínú àkójọ ìwà yìí, διάβολος túmọ̀ sí ẹni tí ń fi ọ̀rọ̀ èké tàbí ọ̀rọ̀ búburú ba ẹlòmíràn jẹ́, kì í ṣe ìtọ́kasí sí Èṣù.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: kí wọ́n má sì ṣe di ẹrú ọ̀pọ̀ wáìnì
  rationale: ‘Di ẹrú’ pa àwòrán ìdè tí perfect passive participle δεδουλωμένας ní mọ́, dípò kí a sọ ọ́ di ‘fẹ́ràn’ tàbí ‘mú jù’ nìkan.
- source_word: καλοδιδασκάλους
  choice: kí wọ́n máa kọ́ni ní ohun rere
  rationale: Ó fi hàn gbangba pé ohun rere ni àkóónú ẹ̀kọ́ náà, kì í ṣe pé wọ́n kàn mọ ọ̀nà ìkọ́ni dáadáa.
theological_decisions:
- issue: Àwòrán ẹrú nínú ìkìlọ̀ nípa wáìnì
  choice: Pa èdè ìdè mọ́ pẹ̀lú ‘di ẹrú ọ̀pọ̀ wáìnì’
  alternative: má ṣe jẹ́ kí ọ̀pọ̀ wáìnì di bárakú fún wọn
  rationale: Ọ̀rọ̀ Gíríìkì δουλόω fi ìṣàkóso àti ìdè hàn. Èdè ‘ẹrú’ pa agbára àwòrán náà mọ́ láì fi èrò ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ohun mímọ́’ láti pa ìmọ̀lára ohun tí ó yẹ fún ibi tàbí iṣẹ́ mímọ́ mọ́; a sì lo ‘wáìnì’ fún οἶνος. Àmì ẹsẹ̀ [a] wà lẹ́yìn gbólóhùn tí àlàyé rẹ̀ kan.
