source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: yo
  text: tí ń kọ́ wa ní ẹ̀kọ́[a], kí a, lẹ́yìn tí a ti kọ ìwà àìbọ̀wọ̀ fún Ọlọ́run àti àwọn ìfẹ́kúfẹ̀ẹ́ ti ayé[b] sílẹ̀, máa gbé ìgbé ayé wa ní ìkóra-ẹni-níjàánu, ní òdodo, àti ní ìfọkànsìn sí Ọlọ́run[c] ní ayé ìsinsìnyí,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘tí ń tọ́ wa’ tàbí ‘tí ń bá wa wí láti tún wa ṣe’; ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ìtọ́ni tí ń dá ìwà ènìyàn sílẹ̀, tí ó sì ń ṣe àtúnṣe ìwà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘àwọn ìfẹ́kúfẹ̀ẹ́ ayé.’
    reason: lexical_alternative
  - marker: c
    text: 'Gíríìkì ní ọ̀rọ̀-àpèjúwe-ìṣe mẹ́ta: ‘ní ìkóra-ẹni-níjàánu, ní òdodo, àti ní ìfọkànsìn sí Ọlọ́run.’ Èyí túmọ̀ sí ìgbé ayé tí ìkóra-ẹni-níjàánu, òdodo, àti ìfọkànsìn sí Ọlọ́run ń ṣàmì sí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: tí ń kọ́ wa ní ẹ̀kọ́
  rationale: Ó fi hàn pé oore-ọ̀fẹ́ ń fún wa ní ẹ̀kọ́ tí ń mọ ènìyàn, tí ó sì ń tọ́ ìwà rẹ̀; ọ̀rọ̀ yìí gbòòrò ju kíkọ́ lásán lọ, kò sì le bí ‘jíyà wa’.
- source_word: ἵνα
  choice: kí a … máa gbé
  rationale: Ìṣètò ‘kí a’ pa agbára ète tàbí àbájáde tí ἵνα ní mọ́ ní Yorùbá àdánidá.
- source_word: ἀρνησάμενοι
  choice: lẹ́yìn tí a bá ti kọ … sílẹ̀
  rationale: 'Ó pa ìṣe àkọ́kọ́ tí aorist participle náà ń tọ́ka sí mọ́: kíkọ àwọn nǹkan wọ̀nyí sílẹ̀ ṣáájú gbígbé ní ọ̀nà tuntun.'
- source_word: ἀσέβειαν
  choice: ìwà àìbọ̀wọ̀ fún Ọlọ́run
  rationale: Ó mú apá ẹ̀sìn àti ti ìwà inú ọ̀rọ̀ náà jáde ní èdè tí òǹkàwé òde òní lè lóye, láì sọ ọ́ di àìgbàgbọ́ nìkan.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: àwọn ìfẹ́kúfẹ̀ẹ́ ti ayé
  rationale: Ó túmọ̀ sí àwọn ìfẹ́ tí ètò ayé yìí ń darí; ‘ìfẹ́kúfẹ̀ẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún ìfẹ́ tí kò tọ́.
- source_word: σωφρόνως
  choice: ní ìkóra-ẹni-níjàánu
  rationale: Ó fi ìṣàkóso ara ẹni àti ìwà tí a kó níjàánu hàn, èyí tí ó jẹ́ kókó pàtàkì nínú Títù.
- source_word: δικαίως
  choice: ní òdodo
  rationale: Ó tọ́ka sí gbígbé ní ọ̀nà tí ó tọ́ àti tí ó bá òdodo mu, ó sì pa ìtumọ̀ ìwà rere àti ti ẹ̀sìn mọ́.
- source_word: εὐσεβῶς
  choice: ní ìfọkànsìn sí Ọlọ́run
  rationale: Ó fi ìgbé ayé tí ó bọ̀wọ̀ fún Ọlọ́run, tí ó sì dojú kọ ọ́ hàn ní Yorùbá àdánidá.
- source_word: ζήσωμεν
  choice: máa gbé ìgbé ayé wa
  rationale: Fọ́ọ̀mù yìí bá subjunctive tó tẹ̀ lé ἵνα mu, ó sì sọ ìgbé ayé tí ń bá a lọ ní ọ̀nà àdánidá.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: ní ayé ìsinsìnyí
  rationale: Ó pa ìtumọ̀ sáà tàbí ètò ayé tó wà nísinsìnyí mọ́, ní ìyàtọ̀ sí sáà tí ń bọ̀.
theological_decisions:
- issue: Ọ̀nà mẹ́ta σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ṣe ń ṣàpèjúwe ζήσωμεν
  choice: ní ìkóra-ẹni-níjàánu, ní òdodo, àti ní ìfọkànsìn sí Ọlọ́run
  alternative: ìgbé ayé oní ìkóra-ẹni-níjàánu, olódodo, àti ti ìfọkànsìn sí Ọlọ́run
  rationale: Gíríìkì lo àwọn ọ̀rọ̀-àpèjúwe-ìṣe mẹ́ta. Yorùbá lè pa ìṣètò yẹn mọ́ lọ́nà àdánidá pẹ̀lú ‘ní’ lẹ́ẹ̀mẹ́ta, láì yí wọn padà sí ànímọ́ orúkọ ‘ìgbé ayé’.
- issue: Ìbáṣepọ̀ ἀρνησάμενοι pẹ̀lú ζήσωμεν
  choice: lẹ́yìn tí a bá ti kọ … sílẹ̀, máa gbé
  alternative: kí a kọ … sílẹ̀, kí a sì máa gbé
  rationale: Yíyan ‘lẹ́yìn tí’ ń pa bí participle aorist náà ṣe fi ìkọ̀sílẹ̀ ṣáájú ìgbé ayé tuntun hàn, láì ṣe àfikún ẹ̀kọ́ ìsìn mìíràn.
translation_notes:
  register: Yorùbá àfẹnusọ tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà tẹ̀ lé bí ẹsẹ 11 ṣe ń sọ̀rọ̀ nípa oore-ọ̀fẹ́, nítorí náà a bẹ̀rẹ̀ pẹ̀lú ‘tí ń …’. ‘Ayé ìsinsìnyí’ jẹ́ ọ̀nà àdánidá láti sọ sáà tó wà báyìí ní ìyàtọ̀ sí èyí tí ń bọ̀.
