source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: yo
  text: Máa sọ àwọn nǹkan wọ̀nyí, máa gba àwọn ènìyàn níyànjú, máa sì bá wọn wí pẹ̀lú àṣẹ kíkún. Kí ẹnikẹ́ni má ṣe kẹ́gàn rẹ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ẹnikẹ́ni má ṣe wo ọ́ sí ẹni kékeré” tàbí “Kí ẹnikẹ́ni má ṣe fojú kéré sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka sí àwọn ìtọ́ni tó ṣáájú nínú orí náà, láì fi ìtumọ̀ tóóró kan lé wọn lórí.
- source_word: λάλει
  choice: Máa sọ
  rationale: Àṣẹ ìsinsìnyí ń fi ìṣe tí yóò máa bá a lọ hàn; “máa sọ” jẹ́ ọ̀nà Yorùbá àdánidá, kò sì sọ ọ́ di “kọ́ni” nìkan.
- source_word: παρακάλει
  choice: máa gbà wọ́n níyànjú
  rationale: Ó pa agbára ìrọ̀, ìṣírí, àti ìkìlọ̀ mọ́ nínú àyíká ìtọ́sọ́nà olùṣọ́ ìjọ.
- source_word: ἔλεγχε
  choice: máa bá wọn wí
  rationale: Ó túmọ̀ sí fífi ohun tí kò tọ́ hàn àti ṣíṣe àtúnṣe; “bá wọn wí” jẹ́ èdè Yorùbá tó ṣe kedere, tó sì ní agbára àtúnṣe.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: pẹ̀lú àṣẹ kíkún
  rationale: ἐπιταγή lè jẹ́ àṣẹ tàbí ọlá-àṣẹ; níbí, gbólóhùn náà ń fi agbára kíkún tí a fi lé Títù lọ́wọ́ hàn, láì sọ ọ́ di agbára tirẹ̀ láìní ìgbẹ́kẹ̀lé.
- source_word: μηδείς
  choice: ẹnikẹ́ni
  rationale: Pẹ̀lú “má ṣe jẹ́ kí,” ó ń sọ ìdènà tó kan gbogbo ènìyàn ní Yorùbá àdánidá.
- source_word: σου
  choice: rẹ
  rationale: Ó tọ́ka sí Títù fúnra rẹ̀ gẹ́gẹ́ bí ẹni tí a lè fojú tẹ́ńbẹ́lú.
- source_word: περιφρονείτω
  choice: Má ṣe jẹ́ kí … fojú tẹ́ńbẹ́lú rẹ
  rationale: περιφρονέω lè túmọ̀ sí kíkọ́ ẹni sílẹ̀, ṣíṣe ẹni ní ẹni kékeré, tàbí ẹ̀gàn. “Fojú tẹ́ńbẹ́lú” jẹ́ àdánidá, ó sì pa agbára ìtumọ̀ rẹ̀ mọ́; àwọn ìtumọ̀ míì wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Agbára iṣẹ́ ìránṣẹ́ Títù nínú “μετὰ πάσης ἐπιταγῆς”
  choice: Títù gbọ́dọ̀ sọ̀rọ̀, gba àwọn ènìyàn níyànjú, kí ó sì bá wọn wí pẹ̀lú àṣẹ kíkún tí iṣẹ́ tí a fi lé e lọ́wọ́ ń béèrè.
  alternative: Ó lè túmọ̀ sí pé kí Títù kàn sọ̀rọ̀ ní ohùn aláṣẹ, tàbí pé àṣẹ náà jẹ́ ti iṣẹ́ náà nìkan, kì í ṣe ti ipò Títù.
  rationale: Gbólóhùn náà ń ṣàlàyé bí Títù ṣe gbọ́dọ̀ ṣe gbogbo àwọn àṣẹ mẹ́tẹ̀ẹ̀ta. “Àṣẹ kíkún” pa agbára ọ̀rọ̀ náà mọ́, láì sọ pé Títù ní agbára òmìnira tirẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn fọ́ọ̀mù “máa” pa agbára àwọn àṣẹ ìsinsìnyí Gíríìkì mọ́; “àṣẹ kíkún” sì yẹra fún àlàyé ẹ̀kọ́ ìsìn tó kọjá ohun tí ẹsẹ̀ náà sọ.
