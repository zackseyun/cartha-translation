revisions:
- from: Máa sọ àwọn nǹkan wọ̀nyí, kí o sì máa gbà wọ́n níyànjú, kí o sì máa bá wọn wí pẹ̀lú àṣẹ kíkún. Má ṣe jẹ́ kí ẹnikẹ́ni fojú tẹ́ńbẹ́lú rẹ.[a]
  to: Máa sọ àwọn nǹkan wọ̀nyí, máa gba àwọn ènìyàn níyànjú, máa sì bá wọn wí pẹ̀lú àṣẹ kíkún. Kí ẹnikẹ́ni má ṣe kẹ́gàn rẹ.[a]
  rationale: A ti rọ́pò ìfọ̀rọ̀wérọ̀ tí kò dájú “fojú tẹ́ńbẹ́lú” pẹ̀lú “kẹ́gàn,” tí ó jẹ́ Yorùbá boṣewa, tó sì gba ìtumọ̀ περιφρονείτω. “Kí ẹnikẹ́ni má ṣe” ń tẹ̀lé ìṣe àṣẹ ẹni-kẹta Gíríìkì náà ní tààrà. Àwọn “ènìyàn/wọn” nínú àwọn àṣẹ àárín jẹ́ ohun-àfọwọ́kà tí Yorùbá máa ń béèrè fún nínú “gba níyànjú” àti “bá ẹni wí,” wọ́n sì tọ́ka sí àwọn tí Títù ń bá ṣiṣẹ́ gẹ́gẹ́ bí àyíká ẹsẹ̀ náà, láì ṣàfikún ẹ̀kọ́ tàbí ìtumọ̀ pàtó kan.
