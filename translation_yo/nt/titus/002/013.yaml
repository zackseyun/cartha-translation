source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: yo
  text: bí a ṣe ń fi ìháragàgà retí ìrètí alábùkún náà àti ìfarahàn ògo Ọlọ́run ńlá àti Olùgbàlà wa[a], Jésù Mèsáyà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kéré sí i: “ògo Ọlọ́run ńlá àti ti Olùgbàlà wa Jésù Mèsáyà,” bí a bá ka “Ọlọ́run” àti “Olùgbàlà” sí ẹni méjì ọ̀tọ̀ dípò akọ́lé kan ṣoṣo fún Jésù.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: bí a ti ń fi ìháragàgà retí
  rationale: Ó fi ìṣe tí ó ń bá a lọ àti ìfojúsọ́nà onítara hàn, ó sì so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: ìrètí alábùkún náà
  rationale: “Ìrètí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ἐλπίς, “alábùkún” sì yẹ fún ìrètí ọjọ́ iwájú tí Ọlọ́run fi fúnni, kì í ṣe ìfẹ́ lásán.
- source_word: ἐπιφάνειαν
  choice: ìfarahàn
  rationale: Ó sọ ìfarahàn gbangba tí a lè rí, láì lo ọ̀rọ̀ ẹ̀sìn àjèjì tàbí àsọyé tó pọ̀ ju.
- source_word: δόξης
  choice: ògo
  rationale: 'Ìtumọ̀ tààrà tí ó pa ìbáṣepọ̀ genitive inú gbólóhùn náà mọ́: “ìfarahàn ògo.”'
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: Ọlọ́run ńlá àti Olùgbàlà wa
  rationale: Ó pa àkójọpọ̀ akọ́lé méjèèjì mọ́ gẹ́gẹ́ bí Gíríìkì, èyí tí ó ṣeé ṣe jù lọ pé ó tọ́ka sí ẹni kan náà.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Χριστός jẹ́ akọ́lé “Mèsáyà”; fífi bẹ́ẹ̀ túmọ̀ rẹ̀ mú ìtumọ̀ akọ́lé náà hàn dípò àkọsílẹ̀ ohùn “Kristi.”
theological_decisions:
- issue: Bóyá “Ọlọ́run ńlá àti Olùgbàlà wa” tọ́ka sí Jesu nìkan tàbí sí Ọlọ́run àti Jesu gẹ́gẹ́ bí ẹni méjì
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí akọ́lé kan fún Jesu Mèsáyà: “Ọlọ́run ńlá àti Olùgbàlà wa.”'
  alternative: “ògo Ọlọ́run ńlá àti ti Olùgbàlà wa Jesu Mèsáyà,” níbi tí “Ọlọ́run” àti “Olùgbàlà” ti tọ́ka sí ẹni méjì ọ̀tọ̀.
  rationale: Nínú Gíríìkì, article kan ṣoṣo ló ń darí àwọn orúkọ ẹni méjì tó jẹ́ singular, lẹ́yìn wọn sì ni “Jesu Mèsáyà” wà; ìṣètò yìí sábà máa ń tọ́ka sí ẹni kan náà. A fi èrò kejì sínú àlàyé ìsàlẹ̀ láti pa àìdájú gírámà tó ṣeé jiyàn mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, tí ó ṣeé lóye fún òǹkàwé òde òní. “Ìháragàgà” mú ìfojúsọ́nà onítara inú προσδεχόμενοι hàn; “Mèsáyà” sì pa iṣẹ́ Χριστός gẹ́gẹ́ bí akọ́lé mọ́.
