  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: yo
  text: Bákan náà, máa gba àwọn ọ̀dọ́kùnrin níyànjú kí wọ́n ní ìkóra-ẹni-níjàánu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n ronú pẹ̀lú ìgbọ́n,” tàbí “kí wọ́n ní ìṣọ́ra nínú ìrònú.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ìdájọ́ tó péye àti ìkóra-ẹni-níjàánu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: àwọn ọ̀dọ́kùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, ó sì ń tọ́ka sí àwọn ọkùnrin tí ọjọ́ orí wọn kéré nínú ìtẹ̀lé àwọn ẹgbẹ́ tí a ń bá sọ̀rọ̀ ní àyíká ẹsẹ yìí.
- source_word: ὡσαύτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ìṣírí yìí pọ̀ mọ́ àwọn ìtọ́ni tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘bakanna’ ní Yorùbá.
- source_word: παρακάλει
  choice: máa gba ... níyànjú
  rationale: Àṣẹ ìsinsìnyí ní Gíríìkì lè fi ìṣe tí a ń bá a lọ hàn; gbólóhùn yìí mú ìṣírí tó lágbára jáde láì di èdè iṣẹ́-ẹ̀kọ́.
- source_word: σωφρονεῖν
  choice: láti máa ní ìkóra-ẹni-níjàánu
  rationale: Àṣàyàn yìí mú èrò ìdájọ́ tó péye, ìṣọ́ra, àti dídá ara ẹni dúró nínú ìwà jáde ní Yorùbá òde òní.
theological_decisions:
- issue: Ìtọ́ka akọ nínú νεωτέρους
  choice: àwọn ọ̀dọ́kùnrin
  alternative: àwọn ọ̀dọ́
  rationale: Àyíká ọ̀rọ̀ náà ya àwọn ẹgbẹ́ sọ́tọ̀ nípa ọjọ́ orí àti akọ tàbí abo; nítorí náà, a pa ìtọ́ka pàtó sí àwọn ọkùnrin mọ́ dípò yíyí i sí gbogbo ọ̀dọ́.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó níyì, tó sì ṣeé lóye ni a lò. “Máa gba ... níyànjú” ṣe àfihàn àṣẹ tí ó ń bá a lọ; “ìkóra-ẹni-níjàánu” jẹ́ ọ̀rọ̀ tó ṣe kedere fún ìṣàkóso ara ẹni. A kò fi àlàyé ẹ̀sìn ẹ̀gbẹ́ kankan kún un.
