  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa gbogbo àwọn èrò pàtàkì nínú Gíríìkì mọ́: ὡσαύτως jẹ́ ìsopọ̀ sí ìtọ́ni tó ṣáájú; τοὺς νεωτέρους tọ́ka ní pàtó sí àwọn ọkùnrin tí ọjọ́ orí wọn kéré; παρακάλει jẹ́ àṣẹ ìsinsìnyí fún Titu láti máa rọ̀ wọ́n; σωφρονεῖν sì ń béèrè ìwà ìkóra-ẹni-níjàánu. Àtúnṣe náà ń mú ìbáṣepọ̀ ‘rọ̀ wọ́n kí wọ́n…’ hàn ní kedere nínú Yorùbá.'
  naturalness: “Bákan náà” jẹ́ ìbẹ̀rẹ̀ gbólóhùn tó wọ́pọ̀, tó sì rọrùn ju “Bẹ́ẹ̀ náà ni” lọ níbí. Ìlò ‘máa gba … níyànjú kí wọ́n ní…’ tún jẹ́ gbolohun Yorùbá adayeba, ó sì ṣe kedere pé àwọn ọ̀dọ́kùnrin ni wọ́n gbọdọ̀ ní ìkóra-ẹni-níjàánu. Àlàyé ìsàlẹ̀ àkọ́kọ́ ní ọ̀rọ̀ kan tí kò rọrùn (“mọ́gbọ́n dání”), ìtumọ̀ kejì rẹ̀ sì túmọ̀ sí ìdúró ṣinṣin dípò ìrònú onígbọ́n/ìṣọ́ra.
  terminology: “Àwọn ọ̀dọ́kùnrin” jẹ́ ìtumọ̀ tó tọ́ fún akọ ọ̀pọ̀ τοὺς νεωτέρους nínú àyíká ẹsẹ̀ yìí. “Ìkóra-ẹni-níjàánu” jẹ́ ọ̀rọ̀ Yorùbá tó dáa fún σωφρονεῖν, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún ní ìmọ̀ ìrònú pẹ̀lú ìgbọ́n àti ìṣọ́ra; ìsàlẹ̀ tuntun náà ń tọ́ka sí ìfẹ̀hàn fífẹ̀ náà láì yí ìtumọ̀ gbolohun pàtàkì padà.
