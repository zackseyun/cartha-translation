  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti ìwọ, máa sọ àwọn ohun tí ó bá ẹ̀kọ́ tí ó ní ìlera mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀kọ́ tí ó tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ṣùgbọ́n ní ti ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Σὺ tí a sọ ní gbangba àti δέ fi ìyàtọ̀ tó lágbára hàn láàárín Títù àti àwọn olùkọ́ èké tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; ‘Ṣùgbọ́n ní ti ìwọ’ mú ìtẹnumọ́ àti ìyàtọ̀ náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: λάλει
  choice: máa sọ
  rationale: Àṣẹ àsìkò ìsinsìnyí náà ń tọ́ka sí iṣẹ́ tí Títù gbọ́dọ̀ máa ṣe déédéé. ‘Máa sọ’ pa ìtumọ̀ gbòòrò ti ‘sọ̀rọ̀/sọ’ mọ́, láìfi í mọ́ iṣẹ́ ìkọ́ni ní kíkún nìkan.
- source_word: ἃ
  choice: àwọn ohun tí
  rationale: Èyí pa ìtumọ̀ ọ̀pọ̀ nǹkan tí arọ́pò-orúkọ aláṣeepò náà ní mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: πρέπει
  choice: ó bá … mu
  rationale: Gbólóhùn Yorùbá ‘bá … mu’ túmọ̀ sí ohun tó yẹ, tó sì wà ní ìbámu pẹ̀lú ohun mìíràn; ó mú ìtumọ̀ ìbójúmu ti πρέπω jáde lọ́nà tó ṣeé lóye.
- source_word: ὑγιαινούσῃ
  choice: tí ó péye
  rationale: Ní àkàwé, ọ̀rọ̀ náà túmọ̀ sí ohun tó ní ìlera, tó tọ́, tí kò sì bàjẹ́. Ní Yorùbá, ‘ẹ̀kọ́ tí ó péye’ sọ ìdúróṣinṣin àti àìlábùkù ẹ̀kọ́ náà jáde lọ́nà àdánidá, dípò àkàwé ‘ẹ̀kọ́ tí ó ní ìlera’ tí kò wọ́pọ̀ tó.
- source_word: διδασκαλίᾳ
  choice: ẹ̀kọ́
  rationale: ‘Ẹ̀kọ́’ lè tọ́ka sí ohun tí a ń kọ́ni àti àkóónú ìkọ́ni, bí διδασκαλία ṣe lè rí; ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye ju ọ̀rọ̀ ìmọ̀-ẹ̀sìn onímọ̀ lọ.
theological_decisions:
- issue: Ìtumọ̀ τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ẹ̀kọ́ tí ó péye
  alternative: ẹ̀kọ́ tí ó ní ìlera; ìlànà ẹ̀kọ́ tí ó péye
  rationale: Àyànfẹ́ yìí pa àfojúsùn ọ̀rọ̀ Gíríìkì mọ́—ìkọ́ni tí ó tọ́, tí kò sì bàjẹ́—láìsọ ọ́ di ọ̀rọ̀ ẹ̀sìn ẹ̀ya kan pàtó. Àlàyé ìsàlẹ̀ fi àkàwé gidi náà hàn, ó sì gba àṣàyàn ‘ìlànà ẹ̀kọ́’ láàyè.
translation_notes:
  register: Yorùbá àpéjọ tó lọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. ‘Máa sọ’ mú ipa àṣẹ onítẹ̀síwájú jáde; ‘ní ti ìwọ’ sì pa ìtẹnumọ́ àti ìyàtọ̀ tó wà nínú Σὺ δὲ mọ́. Gbogbo àmì ohùn ni a fi síbi tí ó yẹ.
