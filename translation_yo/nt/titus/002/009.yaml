  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: yo
  text: Kọ́ àwọn ẹrú[a] pé kí wọ́n máa tẹríba fún àwọn ọ̀gá tiwọn nínú ohun gbogbo, kí wọ́n jẹ́ ẹni tí ó ń tẹ́ àwọn ọ̀gá wọn lọ́rùn, kí wọ́n má sì máa tako ọ̀rọ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ìránṣẹ́” tàbí “àwọn ẹrú tí a dè mọ́ iṣẹ́.” Ọ̀rọ̀ Gíríìkì náà, doulous, lè tọ́ka sí àwọn tó ń ṣe iṣẹ́ ìránṣẹ́, ṣùgbọ́n ó ṣeé ṣe jù pé ipò ẹrú ni a ní lọ́kàn níbí.
    reason: alternative_reading
  - marker: b
    text: Tàbí “kí wọ́n má ṣe dáhùn padà” tàbí “kí wọ́n má ṣe tako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: àwọn ẹrú
  rationale: Nínú àyíká yìí, δοῦλος ń tọ́ka sí àwọn ènìyàn tí wọ́n wà lábẹ́ agbára ọ̀gá nítorí ipò ẹrú; “ẹrú” pa òtítọ́ ipò ìgbèkùn náà mọ́ ju “ìránṣẹ́” lọ.
- source_word: ἰδίοις δεσπόταις
  choice: àwọn ọ̀gá tiwọn
  rationale: δεσπότης túmọ̀ sí ẹni tí ó ní agbára gíga tàbí ẹ̀tọ́ lórí ẹlòmíràn; “ọ̀gá” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé ní àyíká yìí, “tiwọn” sì fi ἰδίοις hàn.
- source_word: ὑποτάσσεσθαι
  choice: kí wọn tẹríba fún
  rationale: Èyí fi ìtẹríba àti jíjẹ́ ẹni tí ó wà lábẹ́ àṣẹ hàn ní Yorùbá adayébá, láì sọ pé wọ́n kàn ń ṣègbọràn sí àṣẹ kọ̀ọ̀kan.
- source_word: ἐν πᾶσιν
  choice: nínú ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbígbòòrò πᾶσιν mọ́, láì fi àlàyé tàbí ààlà tí kò sí nínú gbólóhùn Gíríìkì kún un.
- source_word: εὐαρέστους εἶναι
  choice: kí wọn máa ṣe ohun tí ó dùn mọ́ wọn
  rationale: Ìtumọ̀ yìí sọ èrò ‘jíjẹ́ ẹni tí ó tẹ́ ọ̀gá lọ́rùn’ ní Yorùbá tó ṣe kedere; arọ́pò-orúkọ “wọn” ń tọ́ka sí àwọn ọ̀gá.
- source_word: μὴ ἀντιλέγοντας
  choice: kí wọn má sì máa fèsì takò
  rationale: ἀντιλέγω lè túmọ̀ sí sísọ̀rọ̀ lòdì, dídáhùn takò, tàbí tako; “fèsì takò” mú ìhùwàsí ọ̀rọ̀ ẹnu inú àyíká yìí hàn láì sọ ọ́ di aríyànjiyàn lásán.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλος nínú ìlànà ilé ayé àtijọ́
  choice: ẹrú
  alternative: ìránṣẹ́; ẹrú tí a dè mọ́ iṣẹ́
  rationale: Ìbáṣepọ̀ pẹ̀lú δεσπόταις fi hàn pé ipò ìgbèkùn tàbí jíjẹ́ ohun-ìní ni ó hàn gbangba níbí. “Ẹrú” kò rọ òtítọ́ awùjọ inú ọ̀rọ̀ náà, bẹ́ẹ̀ ni lílo rẹ̀ kò túmọ̀ sí pé ẹsẹ̀ náà ń fọwọ́ sí ètò ẹrú.
- issue: Ìwọ̀n gbólóhùn “nínú ohun gbogbo”
  choice: pa gbólóhùn gbígbòòrò náà mọ́ láì fi ààlà tí kò sí nínú ẹsẹ̀ kún un
  alternative: ṣàlàyé rẹ̀ gẹ́gẹ́ bí ohun gbogbo tí kò tako Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ἐν πᾶσιν, kò sì sọ ààlà kan ní gbangba nínú ẹsẹ̀ yìí. Ìtumọ̀ náà pa ìnira àti ìfẹ̀ tó lè wà nínú gbólóhùn náà mọ́ dípò yíyanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti òde òní pẹ̀lú àmì ohùn ní kíkún. “Kọ́” jẹ́ kí àjọṣe girama pẹ̀lú àṣẹ tó ń bá a lọ nínú àyíká Títù 2 hàn, nígbà tí àwọn gbólóhùn “kí wọn...” ń ṣàfihàn ọ̀wọ́ infinitive inú Gíríìkì ní Yorùbá adayébá.
