- from: Kọ́ àwọn ẹrú[a] pé kí wọn tẹríba fún àwọn ọ̀gá tiwọn nínú ohun gbogbo, kí wọn máa ṣe ohun tí ó dùn mọ́ wọn, kí wọn má sì máa fèsì takò.[b]
  to: Kọ́ àwọn ẹrú[a] pé kí wọ́n máa tẹríba fún àwọn ọ̀gá tiwọn nínú ohun gbogbo, kí wọ́n jẹ́ ẹni tí ó ń tẹ́ àwọn ọ̀gá wọn lọ́rùn, kí wọ́n má sì máa tako ọ̀rọ̀.[b]
  rationale: A tún ọrọ̀ εὐαρέστους εἶναι ṣe sí ‘kí wọ́n jẹ́ ẹni tí ó ń tẹ́ àwọn ọ̀gá wọn lọ́rùn,’ kí ó lè tọ́ka sí jíjẹ́ ẹni tí ó tẹ́ni lọ́rùn, kì í ṣe sí ṣíṣe ohun tí ẹlòmíràn fẹ́ nìkan. A tún ṣe μὴ ἀντιλέγοντας sí ‘kí wọ́n má sì máa tako ọ̀rọ̀’ fún ìrọ̀rùn àti ìbámu pẹ̀lú ìtumọ̀ ‘not contradicting,’ láì fi ìtumọ̀ míì kún un. Àwọn àmì ẹsẹ̀ àti àkíyèsí ìsàlẹ̀ wà ní ipò tó yẹ.
