base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: yo
  text: 'Nítorí náà, báyìí ni mo ṣe ń sáré: kì í ṣe láìní àfojúsùn[a]. Báyìí ni mo ṣe ń gbá ìjà ọwọ́: kì í ṣe bí ẹni pé mo ń lu afẹ́fẹ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìdánilójú.” Ọ̀rọ̀-ìse Gíríìkì náà lè fi àìsí ìmọ̀ kedere tàbí àìní àfojúsùn tó dájú hàn; nínú àwòrán eré sísáré yìí, “láìní àfojúsùn” mú èrò sísáré láìsí ibi-ìdí kedere jáde.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ tó ṣáájú hàn, ó sì darí àpẹẹrẹ eré ìdárayá náà sí bí Pọ́ọ̀lù fúnra rẹ̀ ṣe ń hùwà.
- source_word: οὕτως
  choice: báyìí ni mo ṣe
  rationale: A tún un sọ lẹ́ẹ̀mejì láti pa ìtẹnumọ́ orísun mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ bí a ṣe ń ṣe ohun kan ní Yorùbá.
- source_word: τρέχω
  choice: mo ṣe ń sáré
  rationale: Ó pa àwòrán eré ìdárayá àti ìṣe tí ń bá a lọ mọ́.
- source_word: ἀδήλως
  choice: láìní ibi tí mo ń lépa
  rationale: Nínú àwòrán eré sísáré, gbólóhùn yìí fi àìní ibi àfojúsùn tó dájú hàn, láìfi ìtumọ̀ àìdánilójú sílẹ̀ pátápátá.
- source_word: πυκτεύω
  choice: mo ṣe ń gbá ì拳
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka pàtó sí eré ìjà tí a fi ọwọ́ gbá; èyí yà á sọ́tọ̀ kúrò nínú ìjà lápapọ̀.
- source_word: ἀέρα δέρων
  choice: ń lu afẹ́fẹ́
  rationale: Ó pa àwòrán lílu tí kò kan alatako mọ́, ó sì fi ìsapá asán hàn lọ́nà tó ṣe kedere.
