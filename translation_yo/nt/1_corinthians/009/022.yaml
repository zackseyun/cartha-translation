id: 1CO.9.22
reference: 1 Corinthians 9:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: yo
  text: Mo di aláìlera fún àwọn aláìlera[a], kí n lè jèrè àwọn aláìlera. Mo ti di ohun gbogbo fún gbogbo ènìyàn, kí n lè gba àwọn kan là ní gbogbo ọ̀nà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn tí ẹ̀rí-ọkàn wọn jẹ́ aláìlera’; nínú 1 Kọ́ríńtì, ọ̀rọ̀ yìí lè tọ́ka ní pàtó sí àwọn tí ẹ̀rí-ọkàn wọn rọrùn láti farapa.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ní gbogbo ọ̀nà tí ó ṣeé ṣe’; gbólóhùn náà túmọ̀ sí lílo gbogbo ọ̀nà tí ó ṣeé ṣe láti lépa ète náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: Mo di
  rationale: Ó fi ìṣe Pọ́ọ̀lù hàn pé ó mú ara rẹ̀ bá ipò àwọn tí ó ń ṣe iṣẹ́ ìránṣẹ́ láàárín wọn mu; ‘Mo di’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ náà mọ́.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: aláìlera / àwọn aláìlera
  rationale: A tún ọ̀rọ̀ kan náà ṣe bí Gíríìkì ti ṣe, kí agbára àsọyé náà lè dúró. Ó lè kan àwọn tí ẹ̀rí-ọkàn wọn rọrùn láti farapa, ṣùgbọ́n ọ̀rọ̀ ẹsẹ̀ yìí kò fi ìtumọ̀ náà mọ́ sí ibẹ̀ nìkan.
- source_word: κερδήσω
  choice: kí n lè jèrè
  rationale: ‘Jèrè’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì túmọ̀ sí mímú àwọn ènìyàn wá sí ìgbàgbọ́ nínú ọ̀rọ̀ iṣẹ́ ìhìnrere yìí, kì í ṣe èrè ara ẹni.
- source_word: τοῖς πᾶσιν
  choice: fún gbogbo ènìyàn
  rationale: Gíríìkì fi ‘gbogbo’ sílẹ̀ ní ọ̀nà àkótán; fífi ‘ènìyàn’ kún un mú kí Yorùbá ṣe kedere láìfi ohun tuntun kún ìtumọ̀.
- source_word: γέγονα
  choice: Mo ti di
  rationale: Àkókò perfect Gíríìkì ń tọ́ka sí ipò tí ìṣe àtijọ́ ti mú wá tí ó sì ṣì dúró; ‘Mo ti di’ pa ìhà yìí mọ́.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbooro àti ìṣọ̀kan gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: πάντως
  choice: ní gbogbo ọ̀nà
  rationale: Ní ibi yìí ó túmọ̀ sí lílo gbogbo ọ̀nà tí ó ṣeé ṣe láti lépa ète náà; kò ní láti túmọ̀ sí ṣíṣe ohun tí kò tọ́.
- source_word: τινὰς
  choice: àwọn kan
  rationale: Ó pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ àìdájú Gíríìkì mọ́; Pọ́ọ̀lù kò sọ pé gbogbo ènìyàn ni yóò rí ìgbàlà nípasẹ̀ iṣẹ́ rẹ̀.
- source_word: σώσω
  choice: kí n lè gba àwọn kan là
  rationale: ‘Gba ... là’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ ìgbàlà mọ́, láìsọ ipa Pọ́ọ̀lù di ti Olùgbàlà gíga jù bí àyíká ọ̀rọ̀ ṣe fàyè gba lọ.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn aláìlera’ nínú àyíká ọ̀rọ̀
  choice: A túmọ̀ rẹ̀ ní gbòòrò sí ‘àwọn aláìlera’ nínú ọ̀rọ̀ pàtàkì.
  alternative: àwọn tí ẹ̀rí-ọkàn wọn jẹ́ aláìlera; àwọn aláìlágbára
  rationale: Nínú 1 Kọ́ríńtì, ọ̀rọ̀ náà lè tọ́ka sí àwọn tí ẹ̀rí-ọkàn wọn rọrùn láti farapa, pàápàá ní orí 8–10; síbẹ̀, gbólóhùn yìí jẹ́ ti gbogbogbò, ó sì bá àwọn ẹgbẹ́ mìíràn tí a mẹ́nu kàn ní àyíká mu. Kíkó ìtumọ̀ rẹ̀ mọ́ sí ẹ̀rí-ọkàn nìkan yóò pinnu ohun tí Gíríìkì kò pinnu ní kedere.
- issue: Agbára ọ̀rọ̀ ‘gba ... là’
  choice: A lo ‘kí n lè gba àwọn kan là’ fún ète iṣẹ́ ìhìnrere Pọ́ọ̀lù.
  alternative: kí n lè mú àwọn kan dé ìgbàlà; kí n lè ṣèrànwọ́ láti gba àwọn kan là
  rationale: σώζω jẹ́ ọ̀rọ̀ ìgbàlà gidi níbí. Ṣíṣe é ní aláìlágbára yóò dín ohun tí ẹsẹ̀ náà sọ kù; ṣùgbọ́n àyíká fi Pọ́ọ̀lù hàn gẹ́gẹ́ bí irinṣẹ́ nínú iṣẹ́ ìgbàlà, kì í ṣe orísun ìgbàlà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé yé fún òǹkàwé gbogbogbò ni a lò. A pa àtúnṣe ‘aláìlera’ mọ́ fún agbára àsọyé, a sì yà àmì ìsàlẹ̀ [b] mọ́ ‘ní gbogbo ọ̀nà,’ ibi tí ó ń ṣàlàyé πάντως.
