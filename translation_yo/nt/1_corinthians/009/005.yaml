id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: yo
  text: Ṣé àwa kò ní ẹ̀tọ́ láti mú aya kan tí ó jẹ́ arábìnrin nínú ìgbàgbọ́[a] bá wa rìn káàkiri, gẹ́gẹ́ bí àwọn àpọ́sítélì yòókù, àwọn arákùnrin Olúwa, àti Kéfà pẹ̀lú?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “arábìnrin kan, aya kan”—ìyẹn ni, aya tí ó jẹ́ arábìnrin nínú ìgbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ẹ̀tọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀tọ́ tí iṣẹ́ àpọ́sítélì fún wọn, kì í ṣe àṣẹ lórí ẹlòmíràn.
- source_word: ἀδελφὴν γυναῖκα
  choice: aya kan tí ó jẹ́ arábìnrin nínú ìgbàgbọ́
  rationale: 'Èyí pa ìtumọ̀ àwọn ọ̀rọ̀ méjèèjì mọ́: obìnrin náà jẹ́ aya, ó sì tún jẹ́ arábìnrin nínú ìgbàgbọ́. Ó yẹra fún gbólóhùn tí ó lè dà bí ẹni pé arábìnrin nípa ẹ̀jẹ̀ ni.'
- source_word: περιάγειν
  choice: mú ... dání ní àwọn ìrìn-àjò wa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ẹnì kan bá ara ẹni rìn káàkiri; àfikún àyíká ìrìn-àjò mú èrò náà hàn ní Yorùbá àdánidá.
- source_word: ὡς καὶ
  choice: gẹ́gẹ́ bí ... pẹ̀lú
  rationale: Ìṣètò yìí fi ìfiwéra àti ìtumọ̀ àfikún tí καί ní hàn ní Yorùbá tí ó ṣàn.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: àwọn àpọ́sítélì yòókù
  rationale: “Yòókù” fi hàn pé àwọn tí a mẹ́nu kàn jẹ́ apá kan lára ẹgbẹ́ kan náà.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: àwọn arákùnrin Olúwa
  rationale: Ìtumọ̀ tààrà yìí kò pinnu bóyá arákùnrin nípa ẹ̀jẹ̀, arákùnrin ìdílé mìíràn, tàbí ìbátan ni a ní lọ́kàn.
- source_word: Κηφᾶς
  choice: Kéfà
  rationale: A pa orúkọ tí ọ̀rọ̀ Gíríìkì lò mọ́ dípò fífi Pétérù rọ́pò rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ “àwọn arákùnrin Olúwa”
  choice: A túmọ̀ gbólóhùn náà ní tààrà sí “àwọn arákùnrin Olúwa.”
  alternative: Àwọn arákùnrin Jésù nípa ẹ̀jẹ̀; àwọn ọmọ ìyá tàbí baba mìíràn; tàbí àwọn ìbátan tímọ́tímọ́.
  rationale: Gíríìkì fúnra rẹ̀ kò yanjú irú ìbátan náà; ìtumọ̀ náà kò gbọ́dọ̀ fi ẹ̀kọ́ ìsìn kan lé e lórí.
- issue: Ìtumọ̀ ἀδελφὴν γυναῖκα
  choice: “aya kan tí ó jẹ́ arábìnrin nínú ìgbàgbọ́”
  alternative: “arábìnrin kan gẹ́gẹ́ bí aya” tàbí “aya onígbàgbọ́ kan”
  rationale: Yíyan yìí fi hàn pé aya ni obìnrin náà, àti pé ó jẹ́ ọmọ ẹgbẹ́ ìjọ pẹ̀lú, láì sọ pé obìnrin onígbàgbọ́ ẹlẹgbẹ́ ìrìn-àjò lásán ni.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé lóye. Ìbéèrè “Ṣé ... kò” pa ìrètí ìdáhùn rere inú Gíríìkì mọ́. “Dání ní àwọn ìrìn-àjò wa” sọ ìtumọ̀ περιάγειν ní ọ̀nà àdánidá, láì sọ pé aya náà ń ṣiṣẹ́ ìránṣẹ́ lọ́nà kan pàtó.
