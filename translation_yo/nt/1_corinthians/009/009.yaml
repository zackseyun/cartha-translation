id: 1CO.9.9
reference: 1 Corinthians 9:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: yo
  text: Nítorí nínú òfin Mósè ni a ti kọ ọ́ pé, “Ìwọ kò gbọdọ̀ di màlúù lẹ́nu nígbà tí ó ń pa ọkà[a].” Ṣé Ọlọ́run bìkítà nípa àwọn màlúù?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó ń tẹ ọkà jáde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Nítorí ... sínú òfin Mósè
  rationale: “Sínú òfin Mósè” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi tí a ti rí ohun tí a kọ, ó sì pa ìbátan Mósè mọ́.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédé fún gbólóhùn tí ń tọ́ka sí ohun tí Ìwé Mímọ́ ti kọ sílẹ̀; ó tún fi ipò pípé ti ọ̀rọ̀ Gíríìkì hàn.
- source_word: Οὐ κημώσεις
  choice: Ìwọ kò gbọdọ̀ dí ẹnu
  rationale: Ọ̀rọ̀ yìí pa ìlànà ìdènà inú òfin mọ́, “dí ẹnu” sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi ohun ìdí-ẹnu mọ́ ẹranko.
- source_word: βοῦν
  choice: màlúù
  rationale: Nínú àyíká iṣẹ́ oko yìí, “màlúù” jẹ́ ọ̀rọ̀ Yorùbá tí òǹkàwé lónìí mọ̀ dáadáa fún ẹranko bovine tí a fi ń ṣiṣẹ́.
- source_word: ἀλοῶντα
  choice: tí ó ń fẹ̀ ọkà
  rationale: Ó fi iṣẹ́ tí màlúù náà ń ṣe lọ́wọ́ hàn, ó sì bá participle onítẹ̀síwájú mu. Àlàyé míì tí ó túbọ̀ sọ ọ̀nà iṣẹ́ náà ní pàtó wà nínú àlàyé ìsàlẹ̀.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Ṣé Ọlọ́run bìkítà nípa àwọn màlúù?
  rationale: Ìbéèrè yìí dára, ó sì pa agbára ìbéèrè àsọyé tí μή mú wá mọ́ láì fi “kìkì” tàbí ìtumọ̀ àfikún mìíràn sí i.
theological_decisions:
- issue: Ìbéèrè Pọ́ọ̀lù nípa bí Ọlọ́run ṣe bìkítà fún ẹranko
  choice: Ṣé Ọlọ́run bìkítà nípa àwọn màlúù?
  alternative: Ṣé àwọn màlúù nìkan ni Ọlọ́run bìkítà nípa wọn?
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìbéèrè àsọyé pẹ̀lú μή, ṣùgbọ́n kò ní ọ̀rọ̀ tó túmọ̀ sí “nìkan.” Nítorí náà, a pa ìbéèrè náà mọ́ bí ó ti rí, láì sọ pé Pọ́ọ̀lù ń sẹ́ pé Ọlọ́run kò bìkítà fún ẹranko rárá.
translation_notes:
  register: A lo Yorùbá tó bójú mu, tó ní ọlá, tí ó sì ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó bá àdánidá mu, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
