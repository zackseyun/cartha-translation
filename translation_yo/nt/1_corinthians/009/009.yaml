  to: Nítorí nínú òfin Mósè ni a ti kọ ọ́ pé, “Ìwọ kò gbọdọ̀ di màlúù lẹ́nu nígbà tí ó ń pa ọkà[a].” Ṣé Ọlọ́run bìkítà nípa àwọn màlúù?
  rationale: A rọ́pò ọ̀rọ̀ iṣẹ́ “fẹ̀ ọkà,” tí ó ní ìtumọ̀ winnowing, pẹ̀lú “pa ọkà,” fún iṣẹ́ threshing. Àlàyé ìsàlẹ̀ náà ń fúnni ní ọ̀nà pàtó síi, “tẹ ọkà jáde,” láì sọ pé Gíríìkì fúnra rẹ̀ darúkọ ọ̀nà náà. A tún tún ìṣètò gbolohun ìtọ́kasí Òfin àti “di … lẹ́nu” ṣe fún Yorùbá adayeba.
