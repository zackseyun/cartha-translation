source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: yo
  text: Nítorí bí mo tilẹ̀ jẹ́ òmìnira kúrò lọ́wọ́ gbogbo ènìyàn, mo sọ ara mi di ẹrú[a] fún gbogbo ènìyàn, kí n lè jèrè ọ̀pọ̀ ènìyàn sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo sọ ara mi di ìránṣẹ́ fún gbogbo ènìyàn.” Ọ̀rọ̀ Gíríìkì lo èdè ìsìnrú; a lo “ẹrú” nínú ẹsẹ náà nítorí ìyàtọ̀ láàárín “òmìnira” àti “ẹrú” ṣe pàtàkì sí kókó ọ̀rọ̀ Pọ́ọ̀lù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: jẹ́ òmìnira
  rationale: Ó túmọ̀ sí jíjẹ́ ẹni tí kò sí lábẹ́ ìdè tàbí àṣẹ ẹlòmíràn; ó sì mú ìyàtọ̀ rẹ̀ pẹ̀lú ‘ẹrú’ hàn kedere.
- source_word: ἐκ πάντων
  choice: lọ́wọ́ gbogbo ènìyàn
  rationale: Nínú Yorùbá àdánidá, gbólóhùn yìí fi hàn pé Pọ́ọ̀lù kò sí lábẹ́ ìṣàkóso tàbí ìbéèrè ẹnikẹ́ni, láìsọ ọ̀rọ̀ Gíríìkì di ohun tó túmọ̀ ju bó ṣe yẹ lọ.
- source_word: πᾶσιν
  choice: fún gbogbo ènìyàn
  rationale: Ó tọ́ka sí gbogbo àwọn tí Pọ́ọ̀lù fi ara rẹ̀ sábẹ́ wọn nínú iṣẹ́; àtúnṣe ‘gbogbo ènìyàn’ tún pa ìbáradọ́gba ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: mo sọ ara mi di ẹrú
  rationale: Èyí pa èdè ìsìnrú àti ìṣe tí Pọ́ọ̀lù fi ìfẹ́ inú ṣe mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó fi ète ìṣe Pọ́ọ̀lù hàn ní Yorùbá àdánidá.
- source_word: τοὺς πλείονας
  choice: ọ̀pọ̀ ènìyàn sí i
  rationale: Ó pa ìtumọ̀ iye afiwéra náà mọ́—àwọn ènìyàn púpọ̀ sí i—láìgbé e ga sí ‘iye tó pọ̀ jù lọ’.
- source_word: κερδήσω
  choice: jèrè
  rationale: ‘Jèrè’ lè gbé àkàwé nípa rírí àwọn ènìyàn gbà tàbí fífi wọn kún iṣẹ́ ìhìn rere gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà ṣe rí.
theological_decisions:
- issue: Bí a ṣe túmọ̀ èdè ìsìnrú inú δουλόω
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ìyàtọ̀ láàárín jíjẹ́ ‘òmìnira’ àti sísọ ara ẹni di ‘ẹrú’ ni kókó ọ̀rọ̀ Pọ́ọ̀lù; ‘ìránṣẹ́’ lè dín agbára àkàwé yìí kù.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A tún ‘gbogbo ènìyàn’ sọ lẹ́ẹ̀mejì láti pa ìlù àti ìbáradọ́gba ọ̀rọ̀ orísun mọ́; ‘ẹrú’ sì mọ̀ọ́mọ̀ pa agbára àkàwé Gíríìkì mọ́.
