id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: yo
  text: Bí èmi kò bá jẹ́ àpọ́sítélì fún àwọn ẹlòmíràn, ṣùgbọ́n fún yín, mo jẹ́ àpọ́sítélì dájúdájú; nítorí ẹ̀yin ni èdìdì[a] iṣẹ́ àpọ́sítélì mi nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rí” tàbí “àmì ìfìdímúlẹ̀.” Ọ̀rọ̀ Gíríìkì náà ni “èdìdì,” èyí tí ó pa àwòrán ohun tí ń jẹ́rìí sí ìjẹ́-ojúlówó ohun kan mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Nínú ọ̀rọ̀ tí Pọ́ọ̀lù ń sọ nípa ara rẹ̀, ọ̀rọ̀ náà ń tọ́ka sí ipò àti iṣẹ́ tí a rán an sí gẹ́gẹ́ bí àpọ́sítélì, kì í ṣe òjíṣẹ́ lásán.
- source_word: ἀλλά γε
  choice: ṣùgbọ́n ó dájú pé
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn, ó sì tẹnumọ́ pé bí àwọn ẹlòmíràn tilẹ̀ kọ ipò Pọ́ọ̀lù, kò sí àní-àní nípa rẹ̀ ní ti àwọn ará Kọ́ríńtì.
- source_word: σφραγίς
  choice: èdìdì
  rationale: 'Èdìdì pa àwòrán Gíríìkì mọ́: àmì tí ń fi hàn pé ohun kan jẹ́ ojúlówó, tí ó sì ń fìdí rẹ̀ múlẹ̀.'
- source_word: ἀποστολή
  choice: iṣẹ́ àpọ́sítélì
  rationale: Ọ̀rọ̀ náà tọ́ka sí iṣẹ́ àti àṣẹ tí Pọ́ọ̀lù ní gẹ́gẹ́ bí àpọ́sítélì. Gbólóhùn yìí ṣe kedere sí òǹkàwé Yorùbá ju ọ̀rọ̀ àdàkọ kan lọ.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: A pa gbólóhùn pàtàkì ti Pọ́ọ̀lù mọ́, nítorí ó lè tọ́ka sí ìbáṣepọ̀ àwọn ará Kọ́ríńtì pẹ̀lú Olúwa, kì í ṣe pé Olúwa nìkan ni aṣojú ìṣe náà.
- source_word: ἄλλοις
  choice: fún àwọn ẹlòmíràn
  rationale: Èyí ṣàfihàn ìbáṣepọ̀ tí dative Gíríìkì ní pẹ̀lú jíjẹ́ àpọ́sítélì ní ọ̀nà Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù nípa jíjẹ́ àpọ́sítélì
  choice: Pọ́ọ̀lù gbà pé àwọn kan lè má ka òun sí àpọ́sítélì, ṣùgbọ́n ó tẹnumọ́ pé àwọn ará Kọ́ríńtì fúnra wọn jẹ́ ẹ̀rí tó fìdí iṣẹ́ àpọ́sítélì rẹ̀ múlẹ̀.
  alternative: Pọ́ọ̀lù ń sọ pé òun kì í ṣe àpọ́sítélì rárá fún àwọn ẹlòmíràn, pé ipò náà sì mọ sí àwọn ará Kọ́ríńtì nìkan.
  rationale: Ìṣètò gbólóhùn náà àti àríyànjiyàn apá yìí jẹ́ ọ̀rọ̀ ìgbèjà tó ń fi ìtẹnumọ́ hàn; kì í ṣe ìdínwọ̀ iṣẹ́ àpọ́sítélì Pọ́ọ̀lù sí ìjọ kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tó yẹ, a sì pa àwòrán “èdìdì” àti gbólóhùn “nínú Olúwa” mọ́ láì tú àìdánilójú wọn sí ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo.
