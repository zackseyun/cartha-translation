  source_fidelity: Ìtumọ̀ náà mú èrò pàtàkì ẹsẹ̀ náà, àwòrán ‘èdìdì,’ àti ‘nínú Olúwa’ wá dáadáa. Bí ó ti wù kí ó rí, ‘tilẹ̀’ nínú apá ìbẹ̀rẹ̀ ń fi ìtẹnumọ́ tí kò hàn gbangba nínú ọ̀rọ̀ Gíríìkì kún un, àti ìtẹnumọ́ ἀλλά γε lè wà ní ipò tí ó sún mọ́ ‘fún yín’ jù.
  naturalness: Àtúnṣe náà ń lo Yorùbá boṣewa tó ṣàn dáadáa. ‘Fún yín, mo jẹ́ àpọ́sítélì dájúdájú’ jẹ́ ọ̀nà adayeba láti sọ ìyàtọ̀ àti ìtẹnumọ́ náà.
  terminology: ‘Àpọ́sítélì,’ ‘èdìdì,’ àti ‘nínú Olúwa’ bójú mu. ‘Iṣẹ́ àpọ́sítélì mi’ lè dúró fún ἀποστολή nínú àyíká ọ̀rọ̀ yìí. A tún ṣe ọ̀rọ̀ àlàyé abẹ́lẹ̀ di ‘àmì ìfìdímúlẹ̀,’ èyí tí ó péye, tí ó sì rọrùn láti lóye.
