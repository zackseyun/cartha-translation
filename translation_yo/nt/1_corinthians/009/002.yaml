  to: Bí èmi kò bá jẹ́ àpọ́sítélì fún àwọn ẹlòmíràn, ṣùgbọ́n fún yín, mo jẹ́ àpọ́sítélì dájúdájú; nítorí ẹ̀yin ni èdìdì[a] iṣẹ́ àpọ́sítélì mi nínú Olúwa.
