revisions:
- from: Ṣùgbọ́n olúkúlùkù ẹni tí ó ń díje máa ń kó ara rẹ̀ níjàánu nínú ohun gbogbo. Àwọn náà ń ṣe bẹ́ẹ̀ kí wọn lè gba adé tí ó lè ṣègbé[a], ṣùgbọ́n àwa, èyí tí kò lè ṣègbé.
  to: Gbogbo ẹni tí ó ń díje máa ń kó ara rẹ̀ níjàánu nínú ohun gbogbo. Àwọn náà ń ṣe bẹ́ẹ̀ kí wọ́n lè gba adé tí ó lè ṣègbé[a], ṣùgbọ́n àwa ń ṣe bẹ́ẹ̀ kí a lè gba adé tí kò lè ṣègbé.
  rationale: A rọ́pò àsopọ̀ ìbẹ̀rẹ̀ tó fún δέ ní àtakò tí kò pọndandan, a mú ọ̀rọ̀ πᾶς hàn ní Yorùbá tó rọrùn, a sì sọ ìyọkúrò ‘ṣùgbọ́n àwa [adé tí kò lè ṣègbé]’ di gbolohun Yorùbá péye. Àlàyé adé náà sì tún jẹ́ olóòtítọ́ sí àwòrán ìṣẹ́gun Gíríìkì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:14:00Z'
review_pass:
  verdict: revise
  source_fidelity: Àtúnṣe náà yọ ‘Ṣùgbọ́n’ kúrò ní ìbẹ̀rẹ̀, nítorí δέ níbí ń so gbólóhùn pọ̀ sí àyíká rẹ̀ ju kí ó dá àtakò tuntun sílẹ̀. Ó pa ìtumọ̀ πᾶς, ἐγκρατεύεται, ète ἵνα, àti àtakò φθαρτός/ἄφθαρτος mọ́. Fífi ‘ń ṣe bẹ́ẹ̀ kí a lè gba’ hàn nínú apá kejì jẹ́ ìmúpadàbọ̀ èrò tí Gíríìkì fi sílẹ̀ nínú ìyọkúrò, láìfi ìtumọ̀ tuntun kún un.
  naturalness: ‘Gbogbo ẹni’ jẹ́ Yorùbá àdánidá ju ‘olúkúlùkù ẹni’ lọ. Àtúnṣe apá ìkẹyìn náà tún mú kí gbolohun náà péye, kedere, ó sì rọrùn láti ka ní Yorùbá òde òní.
  terminology: ‘Adé’ lè dúró gẹ́gẹ́ bí àwòrán ṣókí fún στέφανος, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ewé gbọdọ̀ má ṣe pè é ní ‘òdòdó’ nìkan, nítorí στέφανος jẹ́ adé/ìṣọ́ orí tí a hun (garland/wreath), tí kò ṣe dandan kí ó jẹ́ òdòdó. ‘Adé ewé ìṣẹ́gun’ ṣàlàyé àyíká eré ìdíje náà dáadáa.
