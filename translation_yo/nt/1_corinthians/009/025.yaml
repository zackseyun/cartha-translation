id: 1CO.9.25
reference: 1 Corinthians 9:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: yo
  text: Gbogbo ẹni tí ó ń díje máa ń kó ara rẹ̀ níjàánu nínú ohun gbogbo. Àwọn náà ń ṣe bẹ́ẹ̀ kí wọ́n lè gba adé tí ó lè ṣègbé[a], ṣùgbọ́n àwa ń ṣe bẹ́ẹ̀ kí a lè gba adé tí kò lè ṣègbé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “adé ewé ìṣẹ́gun”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí adé tàbí ìṣọ́ orí tí a hun, tí a fi fún ẹni tó ṣẹ́gun nínú eré ìdíje.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: olúkúlùkù ẹni
  rationale: Ó fi agbára ọ̀rọ̀ ẹyọ tó dúró fún gbogbo ẹni hàn ní Yorùbá àdánidá, láìfi akọ tàbí abo sí i.
- source_word: ἀγωνιζόμενος
  choice: ẹni tí ó ń díje
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti eré ìdíje; ‘ń díje’ mú ìjàkadì nínú ìdíje hàn ní kedere.
- source_word: πάντα
  choice: nínú ohun gbogbo
  rationale: Ó pa fífẹ̀ ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́, láìdín ìkóra-ẹni-níjàánu kù sí oúnjẹ tàbí ìdánilẹ́kọ̀ọ́ nìkan.
- source_word: ἐγκρατεύεται
  choice: máa ń kó ara rẹ̀ níjàánu
  rationale: Ó sọ ìṣe ìkóra-ẹni-níjàánu tí a ń ṣe déédéé, tí ó sì bá àkàwé eléré ìdíje mu.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: Àwọn náà ń ṣe bẹ́ẹ̀
  rationale: Ó tọ́ka padà sí àwọn eléré tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì mú ìṣe tí Gíríìkì fi sílẹ̀ láìsọ jáde hàn lọ́nà Yorùbá àdánidá.
- source_word: ἵνα
  choice: kí wọn lè
  rationale: Ó fi ète ìṣe náà hàn ní kedere.
- source_word: φθαρτὸν
  choice: tí ó lè ṣègbé
  rationale: Ó ṣe àtakò pẹ̀lú ἄφθαρτον lọ́nà tí ó ṣe kedere, ó sì ní ìtumọ̀ ohun tí kì í dúró títí.
- source_word: στέφανον
  choice: adé
  rationale: ‘Adé’ pa àwòrán ọlá àti ẹ̀bùn ìṣẹ́gun mọ́; àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé pé ó jẹ́ òdòdó ìṣẹ́gun nínú eré ìdíje.
- source_word: λάβωσιν
  choice: gba
  rationale: Ó bá àwòrán ẹ̀bùn tí a fi fún ẹni tó ṣẹ́gun mu, ó sì jẹ́ Yorùbá tó rọrùn.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: ṣùgbọ́n àwa, èyí tí kò lè ṣègbé
  rationale: Ó pa àtakò mọ́, ó sì tẹ̀ lé ìyọkúrò orúkọ ‘adé’ nínú Gíríìkì nípa lílo ‘èyí’ gẹ́gẹ́ bí arọ́pò rẹ̀.
theological_decisions:
- issue: Irú ẹ̀bùn tí àkàwé náà ń tọ́ka sí
  choice: A pa àwòrán adé ìṣẹ́gun mọ́ láìsọ pàtó pé ó túmọ̀ sí ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
  alternative: Ṣàlàyé rẹ̀ ní tààrà gẹ́gẹ́ bí ìyè àìnípẹ̀kun tàbí ẹ̀bùn ọ̀run.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ kò túmọ̀ àkàwé náà sí ẹ̀kọ́ pàtó; pípa àwòrán náà mọ́ kò fi ẹ̀kọ́ ẹ̀ya ìjọ kan kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Ṣùgbọ́n’ fún δέ gẹ́gẹ́ bí àsopọ̀ àtakò; a kò fi ‘Ní báyìí’ kún un, nítorí kò sí ọ̀rọ̀ àkókò bẹ́ẹ̀ nínú orísun.
