  to: Ṣé ẹ̀yin kò mọ̀ pé àwọn tó ń sáré nínú pápá ìje[a], gbogbo wọn ń sáré, ṣùgbọ́n ẹnì kan ni ń gba ẹ̀bùn náà? Ẹ máa sáré báyìí, kí ẹ lè gba ẹ̀bùn náà.[b]
  rationale: Àtúnṣe náà mú ìkọ́lé Yorùbá rọrùn, ó sì pa ìyàtọ̀ pé gbogbo àwọn olùsáré ń sáré ṣùgbọ́n ẹnì kan ṣoṣo ló ń gba ẹ̀bùn mọ́. Ó tún sọ ohun tí ‘kí ẹ lè...’ ń tọ́ka sí di kedere, láì yi ìtumọ̀, ìforígbárí ìtúmọ̀, tàbí ìtẹnumọ́ ẹ̀kọ́ ìsìn ẹsẹ̀ náà padà.
