  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èdè Gíríìkì dáadáa ní gbogbogbò: ó pa ibi ìsáré, àtúnlò ‘sáré,’ ìyàtọ̀ ‘gbogbo... ṣùgbọ́n ẹnì kan,’ ẹ̀bùn, àti ète àṣẹ náà mọ́. Síbẹ̀, ìkọ́lé ‘gbogbo àwọn tó ń sáré ... ni wọ́n ń sáré’ kò rọrùn tó, ó sì lè dín ìtẹnumọ́ μέν...δέ kù. ‘Rí i gbà’ tún kéré sí ìtumọ̀ tí ó hàn gbangba ju ‘gba ẹ̀bùn náà’ lọ.'
  naturalness: ‘Àwọn tó ń sáré nínú pápá ìje, gbogbo wọn ń sáré’ jẹ́ ìkọ́lé Yorùbá boṣewa tó dára, tí ó sì pa ìfàsọtẹ́lẹ̀ ìṣísẹ̀ Gíríìkì mọ́. ‘Ẹ máa sáré báyìí’ jẹ́ àṣẹ aláìmọ̀kan tó dára; ‘kí ẹ lè gba ẹ̀bùn náà’ sì jẹ́ ìsọ̀rọ̀ àdánidá.
  terminology: ‘Pápá ìje’ yẹ fún σταδίῳ, ‘ẹ̀bùn’ yẹ fún βραβεῖον, àti ‘gba’ yẹ fún λαμβάνει àti καταλάβητε nínú àyíká yìí. Àwọn ọ̀rọ̀ yìí kò fi ẹ̀kọ́ ìjọ tàbí ìtumọ̀ ìtúmọ̀-ẹ̀sìn kún ẹsẹ̀ náà.
  issues:
