id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: yo
  text: Ṣé ẹ̀yin kò mọ̀ pé àwọn tó ń sáré nínú pápá ìje[a], gbogbo wọn ń sáré, ṣùgbọ́n ẹnì kan ni ń gba ẹ̀bùn náà? Ẹ máa sáré báyìí, kí ẹ lè gba ẹ̀bùn náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ní ibi tí wọ́n ti ń sáré ìje.’ Ọ̀rọ̀ Gíríìkì náà, στάδιον, ń tọ́ka sí ibi eré ìje, ìyẹn pápá tàbí ọ̀nà ìsáré.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹ sáré kí ẹ lè borí’ tàbí ‘kí ẹ lè dì í mú.’ Ọ̀rọ̀ Gíríìkì náà, καταλάβητε, lè túmọ̀ sí ‘gba,’ ‘dì mú,’ tàbí ‘ní í.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Ṣé ẹ̀yin kò mọ̀
  rationale: Ó pa ìbéèrè àsọyé tí Pọ́ọ̀lù lò mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐν σταδίῳ
  choice: nínú pápá ìje
  rationale: Ó tọ́ka sí ibi tí wọ́n ti ń sáré ìje, kì í ṣe eré ìje náà lásán; ‘pápá ìje’ ṣe àwòrán náà kedere ní Yorùbá.
- source_word: τρέχοντες ... τρέχουσιν
  choice: àwọn tó ń sáré ... ni wọ́n ń sáré
  rationale: Ó pa àtúnlò ọ̀rọ̀-ìṣe τρέχω àti àwòrán eré ìdárayá náà mọ́.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: gbogbo ... ṣùgbọ́n ẹnì kan ṣoṣo
  rationale: Ó fi ìyàtọ̀ μέν...δέ hàn ní Yorùbá tó ṣe kedere.
- source_word: λαμβάνει
  choice: ń gba
  rationale: ‘Gba’ ni ìtumọ̀ tààrà tó bá gbígba ẹ̀bùn mu, láì fi ìtumọ̀ ‘borí’ kún un.
- source_word: βραβεῖον
  choice: ẹ̀bùn
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ohun tí a fi ń san ẹni tó jáwé olúborí nínú ìdíje.
- source_word: οὕτως
  choice: lọ́nà yìí
  rationale: Ó jẹ́ kí ìfiwéra Pọ́ọ̀lù hàn gbangba, ó sì bójú mu ní Yorùbá òde òní.
- source_word: τρέχετε
  choice: Ẹ máa sáré
  rationale: ‘Máa’ ń fi ìṣe tí ó ń bá a lọ hàn, gẹ́gẹ́ bí àṣẹ alásìkò-bíbayìí nínú Gíríìkì; ‘ẹ’ ń bá ọ̀pọ̀ ẹni tí a ń bá sọ̀rọ̀ mu.
- source_word: ἵνα καταλάβητε
  choice: kí ẹ lè rí i gbà
  rationale: Ó mú ète ìsáré náà jáde, ó sì pa ìtumọ̀ ‘gba/ní ohun náà’ mọ́; ‘i’ ń tọ́ka sí ẹ̀bùn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
theological_decisions:
- issue: Lílo àwòrán eré ìje fún ìfaradà Kristẹni
  choice: Pa àwòrán ìdíje àti ọ̀rọ̀ ìṣírí rẹ̀ mọ́ láì ṣàlàyé bóyá ẹ̀bùn náà túmọ̀ sí ìgbàlà tàbí èrè mìíràn.
  alternative: Túmọ̀ ọ́ ní ìtumọ̀ fífikún bí ‘ẹ sáré kí ẹ lè borí.’
  rationale: Ẹsẹ̀ náà ń rọ àwọn olùgbọ́ láti lépa ète wọn pẹ̀lú ìfaradà, ṣùgbọ́n kò ṣàlàyé ẹ̀kọ́ nípa iṣẹ́ rere, ìgbàlà, tàbí irú ẹ̀bùn náà; ìtumọ̀ kò gbọ́dọ̀ yanjú ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. Àwọn àmì ohùn wà níbi tó yẹ. Ọ̀rọ̀ ‘pápá ìje’ pa àwòrán ibi ìsáré mọ́, ‘Ẹ máa sáré’ sì fi àṣẹ sí ọ̀pọ̀ ènìyàn àti ìṣe tó ń bá a lọ hàn.
