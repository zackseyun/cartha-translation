  yaml_path: translation/nt/1_corinthians/009/003.yaml
  text: This is my defense to those who examine me[a].
translation:
  language: yo
  text: Èyí ni ìgbèjà mi fún àwọn tí ń yẹ̀ mí wò[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èyí ni ìgbèjà mi níwájú àwọn tí ń dá mi lẹ́jọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογία
  choice: ìgbèjà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìdáhùn tí ẹni kan fi ń gbèjà ara rẹ̀ níwájú àyẹ̀wò tàbí ẹ̀sùn; “ìgbèjà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, kò sì ní ìtumọ̀ ìtọrọ̀ àforíjìn.
- source_word: ἀνακρίνουσίν
  choice: ń yẹ̀ mí wò
  rationale: Gbólóhùn yìí fi ìwádìí àti àyẹ̀wò líle hàn láì fi dandan sọ pé àwọn náà ti dá ìdájọ́ ìkẹyìn; ó bá àyíká ọ̀rọ̀ nípa àyẹ̀wò iṣẹ́ àpọ́sítélì Pọ́ọ̀lù mu.
- source_word: Ἡ ἐμὴ
  choice: mi
  rationale: Ọ̀rọ̀ arọ́pò oníhun náà jẹ́ tààrà; “mi” jẹ́ àdánidá ní Yorùbá, kò sì yẹ kí a fi ìtẹnumọ́ míì kún un láìnídìí.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: fún àwọn tí ń yẹ̀ mí wò
  rationale: “Fún” ń sọ àwọn tí ìgbèjà náà ń lọ sí, ó sì jẹ́ ọ̀nà àdánidá láti gbé dative Gíríìkì náà jáde ní Yorùbá.
- source_word: ἐστιν αὕτη
  choice: Èyí ni
  rationale: Ìṣètò yìí jẹ́ àdánidá ní Yorùbá fún gbólóhùn ìdánimọ̀, ó sì lè tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ tàbí ohun tó ń bọ̀.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. A pa àìdánilójú ἀνακρίνω mọ́ láàárín yíyẹ̀ wò àti dídá lẹ́jọ́ nípasẹ̀ àkọ́kọ́ àti àlàyé ìsàlẹ̀.
