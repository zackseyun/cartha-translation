id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: yo
  text: Fún àwọn tí kò ní òfin[a], mo hùwà bí ẹni tí kò ní òfin—bí ó tilẹ̀ jẹ́ pé èmi kì í ṣe ẹni tí kò ní òfin Ọlọ́run, ṣùgbọ́n mo wà lábẹ́ òfin Mèsáyà[b]—kí n lè jèrè àwọn tí kò ní òfin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí kò sí lábẹ́ òfin.” Níhìn-ín, gbólóhùn náà ń tọ́ka sí àwọn tí kò sí lábẹ́ Òfin Mósè; kò túmọ̀ sí pé wọ́n jẹ́ ènìyàn búburú tàbí aláìlófin dandan.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ọ̀rọ̀ náà tún lè túmọ̀ sí, “mo wà nínú òfin Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: àwọn tí kò sí lábẹ́ òfin / ẹni tí kò sí lábẹ́ òfin
  rationale: Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn náà ń tọ́ka sí àwọn tí kò sí lábẹ́ Òfin Mósè, kì í ṣe dandan àwọn ènìyàn búburú tàbí aláìgbọ́ràn. Ìtumọ̀ yìí pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́, ó sì yẹra fún ìtumọ̀ ìwà-bí-Ọlọ́run-kò-sí tí ‘aláìlófin’ lè mú wá.
- source_word: ὡς
  choice: bí
  rationale: Ó fi hàn pé Pọ́ọ̀lù mú ara rẹ̀ bá ipò wọn mu, kì í ṣe pé ó di ẹni tí kò ní ìdájọ́ òfin rárá.
- source_word: μὴ ὢν
  choice: bí ó tilẹ̀ jẹ́ pé èmi kò sí
  rationale: A mú agbára gbólóhùn aláfikún tí ó ń fi ààlà sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ jáde ní Yorùbá àdánidá.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: A túmọ̀ ìbátan genitive náà gẹ́gẹ́ bí ‘òfin Ọlọ́run,’ èyí tí ó bójú mu ní Yorùbá.
- source_word: ἔννομος
  choice: wà lábẹ́ òfin
  rationale: Ọ̀rọ̀ náà ń sọ nípa wíwà nínú àṣẹ tàbí lábẹ́ ìlànà òfin. ‘Wà lábẹ́ òfin’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì bá ìyàtọ̀ sí ‘ní òde òfin’ mu.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ pa ìtumọ̀ oyè ẹni àmì-òróró náà mọ́ dípò lílo ‘Kristi’ bí orúkọ lasán.
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó ṣàfihàn ète, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti mú ète náà jáde.
- source_word: κερδάνω
  choice: jèrè
  rationale: ‘Jèrè’ lè túmọ̀ sí mímú ènìyàn wá sí ìgbàgbọ́ nínú àyíká ihinrere yìí, ó sì pa àwòrán èrè inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἄνομος nínú àyíká yìí
  choice: Àwọn tí kò sí lábẹ́ Òfin Mósè, ní pàtàkì àwọn Kèfèrí
  alternative: Àwọn aláìlófin ní ìtumọ̀ àwọn ènìyàn búburú tàbí ọlọ̀tẹ̀
  rationale: 1 Kọ́ríńtì 9:20–21 fi àwọn Júù tàbí àwọn tí ó wà lábẹ́ òfin wé àwọn tí kò sí lábẹ́ rẹ̀. Àlàyé Pọ́ọ̀lù pé òun kò sí ní òde òfin Ọlọ́run fi hàn pé ipò ìbátan sí òfin ni ọ̀rọ̀ náà ń sọ, kì í ṣe ìwà búburú lápapọ̀.
- issue: Agbára ἔννομος Χριστοῦ
  choice: Mo wà lábẹ́ òfin Mèsáyà
  alternative: Mo wà nínú òfin Mèsáyà; mo ní òfin ní ìbátan sí Mèsáyà
  rationale: Ìtumọ̀ náà pa ìjẹ́wọ́ Pọ́ọ̀lù mọ́ pé òun ṣì wà lábẹ́ ìfẹ́ àti àṣẹ Ọlọ́run nípasẹ̀ Mèsáyà, láìsọ pé ó wà lábẹ́ Òfin Mósè gẹ́gẹ́ bí májẹ̀mú.
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbi yìí, Χριστός jẹ́ oyè nínú gbólóhùn ‘òfin Mèsáyà,’ nítorí náà ‘Mèsáyà’ mú iṣẹ́ oyè náà hàn kedere.
translation_notes:
  register: A lo Yorùbá àgbà tí ó bójú mu, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àtúnwí ‘kò sí lábẹ́ òfin’ pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́; ‘ní òde òfin Ọlọ́run’ àti ‘lábẹ́ òfin Mèsáyà’ tún pa ìyàtọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́-ìgbàgbọ́ inú ẹsẹ náà mọ́.
