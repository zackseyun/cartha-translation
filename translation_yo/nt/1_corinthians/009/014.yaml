id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni Olúwa náà ṣe pàṣẹ pé kí àwọn tí ń kéde ìhìn rere máa rí ohun ìgbẹ́mìí wọn gbà láti inú ìhìn rere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n máa gbé ìgbésí ayé wọn láti inú ìhìn rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó fi àfiwé pẹ̀lú àwọn àpẹẹrẹ tó ṣáájú hàn ní ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó mú ìtumọ̀ àfikún jáde pé Olúwa náà tún pàṣẹ èyí, lẹ́yìn àwọn ẹ̀rí tó ṣáájú.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó fìdí múlẹ̀ fún κύριος; kò fi ‘Jésù’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: διέταξεν
  choice: pàṣẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìtọ́ni aláṣẹ ní àyíká yìí, kì í ṣe ìṣètò lásán.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: àwọn tí ń kéde
  rationale: ‘Kéde’ pa ìtumọ̀ ìpolongo gbangba mọ́, ó sì jẹ́ èdè Yorùbá òde òní tó ṣe kedere.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere
  rationale: Ó túmọ̀ ìtumọ̀ lexical náà ní èdè Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: láti inú ìhìn rere
  rationale: Ó pa àwòrán Gíríìkì mọ́ pé ìhìn rere ni orísun ohun ìgbésí ayé wọn, láì ṣàlàyé ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ζῆν
  choice: máa jẹun
  rationale: Nínú Yorùbá, ‘jẹun láti inú’ lè sọ ní ti ẹ̀dá pé kí iṣẹ́ náà pèsè ohun ìgbésí ayé; àlàyé ẹsẹ tó yí i ká mú ìtumọ̀ ti ìrànlọ́wọ́ ohun-ìní hàn.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: A pa ‘Olúwa’ mọ́; ó ṣeé ṣe jù pé Jésù ni Pọ́ọ̀lù ń tọ́ka sí.
  alternative: Kí ‘Olúwa’ jẹ́ ìtọ́ka gbogbogbò sí Ọlọ́run.
  rationale: Àyíká lẹ́tà náà àti àríyànjiyàn Pọ́ọ̀lù tọ́ka sí àṣẹ Jésù, ṣùgbọ́n a kò fi orúkọ ‘Jésù’ kún ọ̀rọ̀ orísun.
- issue: Irú ìgbésí ayé tí ‘ζῆν ἐκ τοῦ εὐαγγελίου’ túmọ̀ sí
  choice: Rírí ohun ìgbésí ayé tàbí ìrànlọ́wọ́ ohun-ìní gbà nítorí iṣẹ́ ìkéde ìhìn rere.
  alternative: Ìyè ẹ̀mí tí ó wá láti inú ìhìn rere.
  rationale: Àyíká tó sún mọ́ ẹsẹ náà ń sọ̀rọ̀ nípa ẹ̀tọ́ àwọn òṣìṣẹ́ ìhìn rere láti gba ìrànlọ́wọ́ ohun-ìní; síbẹ̀, a pa ìṣọ̀rọ̀ orísun mọ́ dípò ìtúmọ̀ gbòòrò.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó ní ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní. ‘Máa jẹun láti inú’ jẹ́ ìṣọ̀rọ̀ àwòrán tó pa ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fúnni ní ìtumọ̀ tó ṣe kedere sí i.
