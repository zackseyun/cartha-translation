revisions:
- from: Bẹ́ẹ̀ náà ni Olúwa pẹ̀lú pàṣẹ pé kí àwọn tí ń kéde ìhìn rere máa jẹun láti inú ìhìn rere.[a]
  to: Bẹ́ẹ̀ náà ni Olúwa náà ṣe pàṣẹ pé kí àwọn tí ń kéde ìhìn rere máa rí ohun ìgbẹ́mìí wọn gbà láti inú ìhìn rere.[a]
  rationale: Àtúnṣe náà rọ́pò àwòrán ‘jẹun’ tí ó há sí oúnjẹ pẹ̀lú ‘rí ohun ìgbẹ́mìí gbà,’ èyí tí ó sọ ìtumọ̀ ζῆν ní àyíká ìtìlẹ́yìn àwọn aṣìwájú ìhìn rere di kedere. Ó tún ṣètò ‘náà ṣe pàṣẹ’ ní ọ̀nà Yorùbá tó wúlò, nígbà tí ó pa ìtọ́ka ‘Olúwa’ mọ́ láì fi ‘Jésù’ kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:37Z'
