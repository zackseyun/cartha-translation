id: 1CO.9.16
reference: 1 Corinthians 9:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: yo
  text: Nítorí bí mo bá ń kéde ìhìn rere[a], kò sí ohun tí mo lè fi yangàn, nítorí dandan wà lórí mi[b]. Ègbé ni fún mi bí n kò bá kéde ìhìn rere!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wàásù ìhìn rere.” Bákan náà ní òpin ẹsẹ náà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ọ̀ranyàn wà lórí mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: kéde ìhìn rere
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí pípolongo ìròyìn rere. “Kéde ìhìn rere” jẹ́ Yorùbá àdánidá, ó sì pa agbára ìpolongo ọ̀rọ̀ náà mọ́ ní ibi méjèèjì.
- source_word: καύχημα
  choice: ohun tí mo lè fi yangàn
  rationale: Èyí fi hàn pé Pọ́ọ̀lù kò ní ìdí tàbí ohun kan tí yóò fi gbéraga nítorí iṣẹ́ náà; kì í ṣe pé ó kàn ń sẹ́ ìṣe sísọ̀rọ̀ ìyangàn.
- source_word: ἀνάγκη
  choice: dandan
  rationale: “Dandan” mú ìtumọ̀ àìní-àṣàyàn tàbí ọ̀ranyàn jáde láì pinnu bóyá agbára náà ti inú tàbí ti òde wá.
- source_word: ἐπίκειται
  choice: a ti fi … lé mi lórí
  rationale: Gbólóhùn yìí fi ohun tí ó tẹ̀ tàbí tí a gbé lé Pọ́ọ̀lù lórí hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ojúṣe tí kò ṣeé yẹ̀ sílẹ̀.
- source_word: οὐαί
  choice: Ègbé ni fún mi
  rationale: “Ègbé” pa ohùn ìkìlọ̀ líle àti ìparun tí ọ̀rọ̀ Gíríìkì náà ní mọ́; ó lágbára ju ọ̀rọ̀ ìbànújẹ lásán lọ.
- source_word: ἐὰν μὴ
  choice: bí n kò bá
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ipò àídájú òdì hàn.
- source_word: γάρ
  choice: nítorí
  rationale: “Nítorí” so àlàyé Pọ́ọ̀lù mọ́ ọ̀rọ̀ tó ṣáájú, ó sì pa ipa ìṣàlàyé ti γάρ mọ́.
theological_decisions:
- issue: Irú ọ̀ranyàn tí ó mú Pọ́ọ̀lù kéde ìhìn rere
  choice: A sọ ọ́ gẹ́gẹ́ bí ohun dandan tí a fi lé e lórí, láì dárúkọ ẹni tó fi í lé e lórí tàbí ibi tí ìrọ̀ náà ti wá.
  alternative: “Ọlọ́run ti fi ojúṣe yìí lé mi lórí,” tàbí “ohun kan ń rọ̀ mí láti ṣe é.”
  rationale: Ẹsẹ yìí sọ pé dandan tàbí ọ̀ranyàn wà lórí Pọ́ọ̀lù, ṣùgbọ́n kò sọ orísun rẹ̀ ní tààrà. Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “kéde ìhìn rere” dípò ọ̀rọ̀ àyálò “wàásù” nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n a fi èkejì sí àlàyé ìsàlẹ̀.
