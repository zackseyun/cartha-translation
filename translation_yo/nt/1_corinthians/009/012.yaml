  source_fidelity: Ìtumọ̀ náà mú ẹ̀tọ́/àṣẹ tí Pọ́ọ̀lù lè lò, ìfẹ̀hónúhàn àròsọ, àti ète fífi ìdíwọ́ kúrò ní ọ̀nà ìhìn rere hàn dáadáa. Síbẹ̀, “ní ìpín nínú ẹ̀tọ́ yìí” kì í ṣàfihàn dáadáa pé àwọn ẹlòmíràn ń lo tàbí ń jàǹfààní nínú ẹ̀tọ́ náà ní ti àwọn ará Kọ́ríńtì, àti “fi ìdíwọ́ ... sí ọ̀nà ìhìn rere” ń yí ìṣọ̀kan gírámà ọrọ̀ Gíríìkì sí ‘ọ̀nà’ tí kò sí nínú ọ̀rọ̀ ìpilẹ̀.
  naturalness: “Àwa kò ha tilẹ̀ ní í jù bẹ́ẹ̀ lọ?” kò pé ní Yorùbá ìgbàlódé, nítorí ohun tí ‘jù bẹ́ẹ̀ lọ’ ń tọ́ka sí kò hàn gbangba. “Àwa kò ha ní ẹ̀tọ́ náà jù wọ́n lọ?” jẹ́ èdè ti ara, ó sì pa ìfiwéra náà mọ́. “Fa ìdíwọ́ kankan fún ìhìn rere” tún dára ju fífi ìdíwọ́ ‘sí ọ̀nà’ ìhìn rere lọ.
