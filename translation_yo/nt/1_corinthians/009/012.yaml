id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: yo
  text: Bí àwọn ẹlòmíràn bá ń jàǹfààní nínú ẹ̀tọ́ yìí lórí yín[a], àwa kò ha ní ẹ̀tọ́ náà jù wọ́n lọ? Ṣùgbọ́n àwa kò lo ẹ̀tọ́ yìí; kàkà bẹ́ẹ̀, a ń fara da ohun gbogbo, kí a má bàa fa ìdíwọ́ kankan fún ìhìn rere Mèsáyà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ohun tí a lẹ́tọ̀ọ́ láti béèrè lọ́wọ́ yín” tàbí “àṣẹ yìí ní ìbáṣepọ̀ pẹ̀lú yín.” Ó ṣeé ṣe kí àpólà Gíríìkì náà tọ́ka sí ẹ̀tọ́ àwọn aṣọfúnni láti gba ìrànlọ́wọ́ ohun ìní lọ́wọ́ àwọn ará Kọ́ríńtì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: ẹ̀tọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹ̀tọ́ tó yẹ fún àwọn aposteli láti gba ìrànlọ́wọ́ ohun ìní; “ẹ̀tọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ju “àṣẹ” lọ níhìn-ín.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: ẹ̀tọ́ yìí lórí yín
  rationale: Èyí fi hàn pé ẹ̀tọ́ náà ní í ṣe pẹ̀lú ohun tí àwọn ará Kọ́ríńtì jẹ ní gbèsè láti pèsè, kì í ṣe ẹ̀tọ́ tí àwọn ará Kọ́ríńtì fúnra wọn ní.
- source_word: μετέχουσιν
  choice: ní ìpín nínú
  rationale: Ó mú èrò jíjẹ alábàápín tàbí jíjẹ àǹfààní nínú ẹ̀tọ́ náà jáde lọ́nà àdánidá.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: àwa kò ha tilẹ̀ ní í jù bẹ́ẹ̀ lọ?
  rationale: Ó pa ìbéèrè àròsọ àti agbára ìfiwéra μᾶλλον mọ́.
- source_word: ἐχρησάμεθα
  choice: kò lo
  rationale: χράομαι túmọ̀ sí lílo tàbí jíjẹ àǹfààní ohun kan; “lo” ṣe kedere, ó sì jẹ́ Yorùbá ti òde òní.
- source_word: πάντα στέγομεν
  choice: a ń fara da ohun gbogbo
  rationale: Ní àyíká yìí στέγω túmọ̀ sí gbígbà ìnira láàyè tàbí fífaradà, kì í ṣe ṣíṣí ohun kan bo.
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: fi ìdíwọ́ kankan sí ọ̀nà
  rationale: Ọ̀rọ̀ náà ń sọ nípa dídá ohun ìdènà síwájú ìhìn rere; àpólà Yorùbá yìí mú ìtumọ̀ náà ṣe kedere láìṣàlàyé rẹ̀ jù.
- source_word: εὐαγγελίῳ
  choice: ìhìn rere
  rationale: “Ìhìn rere” jẹ́ ọ̀rọ̀ Yorùbá tó fìdí múlẹ̀, tó sì sọ ìtumọ̀ εὐαγγέλιον ní kedere.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí ọ̀rọ̀ náà jẹ́ oyè ju bí ó ṣe jẹ́ orúkọ lọ; yíyan “Mèsáyà” pa ipa oyè àti ìtumọ̀ mèsáyà rẹ̀ mọ́.
- issue: Ìbáṣepọ̀ tí τοῦ Χριστοῦ ní pẹ̀lú εὐαγγελίῳ
  choice: ìhìn rere Mèsáyà
  alternative: ìhìn rere nípa Mèsáyà
  rationale: Genitive Gíríìkì náà lè tọ́ka sí ìhìn rere tí ó jẹ́ ti Mèsáyà tàbí tí ó dá lé Mèsáyà; àpólà kúkúrú náà pa àìdánilójú yìí mọ́ dípò yíyan ọ̀kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. “Kò ha” pa ìrísí ìbéèrè àròsọ mọ́, “fara da” sì jẹ́ ọ̀rọ̀ àdánidá fún fífaradà ìnira. Àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé agbára ìtumọ̀ ἐξουσία láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo lé e lórí.
