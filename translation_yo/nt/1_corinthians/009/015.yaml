  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń mú ìtumọ̀ ẹsẹ̀ náà dáadáa, ó sì pa ìdádúró ἤ mọ́. Ṣùgbọ́n “ju pé—” kò bá ìlò ìfiwéra Yorùbá mu dáadáa ní ibi yìí; “ju kí—” ni ìbẹ̀rẹ̀ tó yẹ fún ohun tí a fi wé e, bí ó tilẹ̀ jẹ́ pé gbólóhùn náà dá dúró lójijì gẹ́gẹ́ bí ti Greek. “Kí a lè ṣe bẹ́ẹ̀ fún mi” tún ń fi olùṣe kan wọ̀lé ju ohun tí γένηται sọ lọ; a tún un ṣe sí ọ̀nà tí ó fi ‘ní ti tèmi’ hàn.
  naturalness: Àwọn gbólóhùn yòókù jẹ́ Yorùbá ìgbàlódé tó ṣe kedere. “Kò lo ọ̀kan nínú àwọn nǹkan wọ̀nyí rí” jẹ́ ìsọ̀rọ̀ àìsọdodo tó rọrùn ju “kò lo èyíkéyìí nínú…” lọ nínú àyíká ìkọ̀lù yìí.
  terminology: “Ohun tí mo fi ń ṣògo” yẹ fún τὸ καύχημά μου, “sọ … di asán” sì ń sọ κενώσει ní Yorùbá àdánidá. A kò fi ìtumọ̀ ẹ̀kọ́ ìjọ kún ọ̀rọ̀ náà.
