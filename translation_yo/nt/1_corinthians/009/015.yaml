id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: yo
  text: Ṣùgbọ́n èmi kò lo ọ̀kan nínú àwọn nǹkan wọ̀nyí rí.[a] Síbẹ̀, èmi kò kọ àwọn nǹkan wọ̀nyí kí ó lè rí bẹ́ẹ̀ ní ti tèmi, nítorí ó sàn fún mi láti kú ju kí—kò sí ẹni tí yóò sọ ohun tí mo fi ń ṣògo di asán.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, bí a bá sọ ohun tí ọ̀rọ̀ tó yí i ká ń tọ́ka sí ní kedere, “ọ̀kan nínú àwọn ẹ̀tọ́ wọ̀nyí.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Greek dá dúró lẹ́yìn “ju—”, lẹ́yìn náà ó tẹ̀ síwájú pé, “kò sí ẹni tí yóò sọ ohun tí mo fi ń ṣògo di asán.” Ọ̀pọ̀ ìtumọ̀ máa ń mú un rọrùn pé, “ju kí ẹnikẹ́ni sọ ohun tí mo fi ń ṣògo di asán.”
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: kò lo ... rí
  rationale: Ọ̀rọ̀ yìí fi hàn pé Pọ́ọ̀lù kò tíì lo tàbí jèrè lára àwọn àǹfààní tí ó ṣẹ̀ṣẹ̀ sọ; “rí” jẹ́ kí ipò tí perfect Greek ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: οὐδενὶ τούτων
  choice: èyíkéyìí nínú àwọn nǹkan wọ̀nyí
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Greek pẹ́kípẹ́kí láì fi “ẹ̀tọ́” sínú àyọkà, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ tó ṣáájú fi hàn pé àwọn ẹ̀tọ́ ìrànlọ́wọ́ ni ó ń tọ́ka sí.
- source_word: ἔγραψα ... ταῦτα
  choice: èmi kò kọ àwọn nǹkan wọ̀nyí
  rationale: Aorist náà bá ọ̀nà ìsọ̀rọ̀ àkókò ti Yorùbá mu ní irú gbólóhùn yìí; “àwọn nǹkan wọ̀nyí” tọ́ka sí ohun tí Pọ́ọ̀lù kọ ṣáájú.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: kí a lè ṣe bẹ́ẹ̀ fún mi
  rationale: 'Èyí mú ète ἵνα àti ìtumọ̀ gbólóhùn Greek tó kúkúrú jáde lọ́nà àdánidá: Pọ́ọ̀lù kò kọ ọ̀rọ̀ náà láti mú kí àwọn onígbàgbọ́ bẹ̀rẹ̀ sí í pèsè fún un.'
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: nítorí ó sàn fún mi láti kú
  rationale: Ìtumọ̀ yìí pa ìfiwéra àti ìpinnu líle Pọ́ọ̀lù mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὸ καύχημά μου
  choice: ohun tí mo fi ń ṣògo
  rationale: καύχημα lè jẹ́ ohun tàbí ìdí tí ènìyàn fi ń ṣògo, kì í ṣe ìṣe ṣíṣògo nìkan; gbólóhùn yìí mú ìtumọ̀ náà hàn ní Yorùbá tó ṣe kedere.
- source_word: κενώσει
  choice: sọ ... di asán
  rationale: Èyí gbé àwòrán ti “sọ di òfo” sínú Yorùbá àdánidá, ó sì túmọ̀ sí mímú ohun tí Pọ́ọ̀lù fi ń ṣògo di aláìní agbára tàbí ìtumọ̀.
theological_decisions:
- issue: Ìdádúró gbólóhùn lẹ́yìn ἤ
  choice: Fi àmì gígùn sílẹ̀ lẹ́yìn “ju pé—”, kí gbólóhùn tuntun náà sì tẹ̀ lé e láì mú èrò tí ó dá dúró pé.
  alternative: “ó sàn fún mi láti kú ju kí ẹnikẹ́ni sọ ohun tí mo fi ń ṣògo di asán.”
  rationale: Greek dá gbólóhùn dúró lójijì lẹ́yìn ἤ (“ju—”), ó sì bẹ̀rẹ̀ ọ̀nà gbólóhùn mìíràn. Pípa ìdádúró yìí mọ́ ń fi agbára ìmọ̀lára àti ìṣòro gírámà inú orísun hàn, dípò fífi ọ̀rọ̀ tí kò sí kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì ṣe kedere ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó ti yẹ, a sì pa ìdádúró ọ̀rọ̀ Greek mọ́ láì tú ìṣòro rẹ̀ ní ìkọ̀kọ̀.
