revisions:
- from: Ṣùgbọ́n èmi kò lo èyíkéyìí nínú àwọn nǹkan wọ̀nyí rí.[a] Síbẹ̀, èmi kò kọ àwọn nǹkan wọ̀nyí kí a lè ṣe bẹ́ẹ̀ fún mi, nítorí ó sàn fún mi láti kú ju pé—kò sí ẹni tí yóò sọ ohun tí mo fi ń ṣògo di asán.[b]
  to: Ṣùgbọ́n èmi kò lo ọ̀kan nínú àwọn nǹkan wọ̀nyí rí.[a] Síbẹ̀, èmi kò kọ àwọn nǹkan wọ̀nyí kí ó lè rí bẹ́ẹ̀ ní ti tèmi, nítorí ó sàn fún mi láti kú ju kí—kò sí ẹni tí yóò sọ ohun tí mo fi ń ṣògo di asán.[b]
  rationale: Àtúnṣe náà ṣe “ju kí—” níbi “ju pé—” láti mú gírámà Yorùbá tọ́, nígbà tó ń pa ìdádúró ìmọ̀lára nínú Greek mọ́. Ó tún yí gbólóhùn ète náà padà sí “kí ó lè rí bẹ́ẹ̀ ní ti tèmi” kí ìtumọ̀ rẹ̀ má ṣe dá olùṣe kan sílẹ̀ láìsí nínú orísun.
