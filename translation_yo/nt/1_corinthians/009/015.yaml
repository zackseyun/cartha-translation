    rationale: Lẹ́yìn “ó sàn fún mi láti kú,” Yorùbá máa ń lo “ju kí …” fún apá tí a fi wé e. “Ju kí—” tún lè dá dúró lójijì láti pa anacoluthon Greek lẹ́yìn ἤ mọ́.
