id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: yo
  text: Bí àwa bá ti gbin àwọn ohun ti ẹ̀mí sí àárín yín, ṣé ohun púpọ̀ jù ni bí àwa bá a ó kórè àwọn ohun ìní láti ọ̀dọ̀ yín?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: àwọn ohun ti ẹ̀mí
  rationale: Ọ̀rọ̀ ajẹtífù ọ̀pọ̀ aláìlábùdá yìí dúró bí ọ̀rọ̀-orúkọ, ó sì ń tọ́ka ní gbòòrò sí àwọn ohun rere tàbí iṣẹ́ ìránṣẹ́ nípa ẹ̀mí. Ìtumọ̀ yìí pa ìgbọ̀ràn ọ̀rọ̀ Gíríìkì mọ́ láì fi ìtumọ̀ tóóró kún un.
- source_word: ἐσπείραμεν
  choice: bá ti fún irúgbìn … sí
  rationale: Ó ń tọ́ka sí iṣẹ́ ìránṣẹ́ tí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ ti ṣe tẹ́lẹ̀, ó sì pa àkàwé fífún irúgbìn mọ́ ní Yorùbá àdánidá.
- source_word: μέγα
  choice: ó pọ̀ jù
  rationale: Nínú ìbéèrè àròsọ yìí, ọ̀rọ̀ náà béèrè bóyá ohun tí a ń retí ti pọ̀ ré kọjá tàbí kò bójú mu, kì í ṣe pé ó tóbi lásán.
- source_word: τὰ σαρκικὰ
  choice: àwọn ohun ti ara
  rationale: Ní àyíká ẹsẹ̀ yìí, ó ń tọ́ka sí ìpèsè fún ìgbésí ayé ara àti ohun ìní, kì í ṣe sí ìwà ẹlẹ́ṣẹ̀. Gbólóhùn náà tún pa ìyàtọ̀ tó wà láàárín πνευματικά àti σαρκικά mọ́.
- source_word: θερίσομεν
  choice: bá kórè
  rationale: Ó tẹ̀ síwájú nínú àkàwé fífún irúgbìn àti kíkórè, ó sì fi gbígba ìrànlọ́wọ́ hàn ní ọ̀nà àdánidá.
- source_word: ὑμῶν
  choice: láti ọ̀dọ̀ yín
  rationale: Ọ̀nà yìí fi hàn pé àwọn ará Kọ́ríńtì ni ìpèsè náà ti máa wá, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: ἡμεῖς
  choice: àwa
  rationale: Lílo àwa ní ìgbà méjèèjì pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́, ó sì ń fi àwọn tó ṣiṣẹ́ ìránṣẹ́ wé àwọn tí wọ́n lè pèsè fún wọn.
theological_decisions:
- issue: Ìtumọ̀ σαρκικὰ ní ìyàtọ̀ sí πνευματικὰ
  choice: Àwọn ohun ti ara, ìyẹn ìpèsè ohun ìní tàbí ohun tí ara nílò fún iṣẹ́ ìránṣẹ́
  alternative: Àwọn ohun ti ẹran ara, ní ìtumọ̀ ìwà ẹlẹ́ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ náà ni Pọ́ọ̀lù ti ń sọ̀rọ̀ nípa ẹ̀tọ́ àwọn aposteli láti gba ìpèsè. Nítorí náà, ìyàtọ̀ náà wà láàárín iṣẹ́ nípa ẹ̀mí àti ìpèsè fún ìgbésí ayé ara, kì í ṣe láàárín ìwà mímọ́ àti ẹ̀ṣẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. Gbólóhùn “fún irúgbìn … sí” àti “kórè” pa àkàwé iṣẹ́ àgbẹ̀ inú orísun mọ́; “ṣé ó pọ̀ jù” sì mú ìbéèrè àròsọ náà dun bí Yorùbá àdánidá.
