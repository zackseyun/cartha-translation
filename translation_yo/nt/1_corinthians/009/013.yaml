reference: 1 Corinthians 9:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: yo
  text: Ẹ kò ha mọ̀ pé àwọn tí ń ṣiṣẹ́ ní tẹ́ńpìlì ń jẹ oúnjẹ láti inú tẹ́ńpìlì,[a] àti pé àwọn tí ń ṣe iṣẹ́ ní pẹpẹ ìrúbọ ń gba ìpín nínú ohun tí a ń rú lórí pẹpẹ ìrúbọ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ gidi sí i: “àwọn tí ń ṣiṣẹ́ pẹ̀lú àwọn ohun mímọ́ ń jẹ àwọn ohun tí ó ti inú tẹ́ńpìlì wá.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ní ìtumọ̀ gidi sí i: “àwọn tí ń dúró ti pẹpẹ ìrúbọ ń gba ìpín pẹ̀lú pẹpẹ ìrúbọ”; ìyẹn ni pé, wọ́n ń gba ìpín kan lára àwọn ẹbọ tí a rú níbẹ̀.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Ẹ̀yin kò ha mọ̀
  rationale: Ó pa ìbéèrè àsọyé tí Pọ́ọ̀lù máa ń lò mọ́, ó sì jẹ́ èdè Yorùbá ológo tí ó ṣe kedere.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: àwọn tí ń ṣiṣẹ́ pẹ̀lú àwọn ohun mímọ́
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, tí ó sọ nípa iṣẹ́ tí ó ní í ṣe pẹ̀lú àwọn ohun mímọ́, láì fi kún un pé ó jẹ́ ètò iṣẹ́ ìjọ kan pàtó.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: ń jẹ ohun tí ó ti inú tẹ́ńpìlì wá
  rationale: Ó pa àwòrán jíjẹ mọ́, ó sì fi hàn ní Yorùbá àdánidá pé oúnjẹ wọn wá láti tẹ́ńpìlì.
- source_word: ἱεροῦ
  choice: tẹ́ńpìlì
  rationale: ἱερόν ń tọ́ka sí tẹ́ńpìlì tàbí gbogbo àgbègbè mímọ́ rẹ̀, kì í ṣe ibi mímọ́ inú lọ́hùn-ún nìkan.
- source_word: παρεδρεύοντες
  choice: àwọn tí ń ṣiṣẹ́ lẹ́gbẹ̀ẹ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àwọn tí a yàn sí ibi lẹ́gbẹ̀ẹ́ ohun kan láti máa ṣe iṣẹ́; yíyan ‘ń ṣiṣẹ́ lẹ́gbẹ̀ẹ́’ pa ibi àti iṣẹ́ náà pọ̀ mọ́ra.
- source_word: θυσιαστηρίῳ
  choice: pẹpẹ ìrúbọ
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún pẹpẹ tí a ti ń rú ẹbọ.
- source_word: συμμερίζονται
  choice: ń gba ìpín pẹ̀lú
  rationale: Ó pa ìtumọ̀ gidi ti gbígba ìpín papọ̀ mọ́, ó sì yẹra fún ṣíṣe àlàyé ohun tí a rú lórí pẹpẹ sínú ara ẹsẹ̀.
theological_decisions:
- issue: Àwòrán iṣẹ́ tẹ́ńpìlì àti ohun tí àwọn òṣìṣẹ́ ibẹ̀ ń gbà
  choice: 'A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí àfiwé iṣẹ́ mímọ́: àwọn tí ń ṣe iṣẹ́ tẹ́ńpìlì ń rí oúnjẹ tàbí ìpín gbà láti inú iṣẹ́ yẹn.'
  alternative: A lè sọ gbangba pé ‘wọ́n ń gba ìpín nínú àwọn ẹbọ tí a rú lórí pẹpẹ.’
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní ti gidi pé wọ́n ‘ń pín pẹ̀lú pẹpẹ’; fífi èyí sí ara ẹsẹ̀ pa àwòrán àti díẹ̀ lára àìṣedéédé rẹ̀ mọ́, nígbà tí àlàyé ìtumọ̀ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Tẹ́ńpìlì’ àti ‘pẹpẹ ìrúbọ’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lónìí lè lóye; gbolohun náà sì pa ìbéèrè àsọyé àti ìṣòro kékeré inú àwòrán ‘pín pẹ̀lú pẹpẹ’ mọ́.
