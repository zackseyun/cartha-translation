revisions:
- from: Ẹ̀yin kò ha mọ̀ pé àwọn tí ń ṣiṣẹ́ pẹ̀lú àwọn ohun mímọ́ ń jẹ ohun tí ó ti inú tẹ́ńpìlì wá,[a] àti pé àwọn tí ń ṣiṣẹ́ lẹ́gbẹ̀ẹ́ pẹpẹ ìrúbọ ń gba ìpín pẹ̀lú pẹpẹ ìrúbọ?[b]
  to: Ẹ kò ha mọ̀ pé àwọn tí ń ṣiṣẹ́ ní tẹ́ńpìlì ń jẹ oúnjẹ láti inú tẹ́ńpìlì,[a] àti pé àwọn tí ń ṣe iṣẹ́ ní pẹpẹ ìrúbọ ń gba ìpín nínú ohun tí a ń rú lórí pẹpẹ ìrúbọ?[b]
  rationale: A tún ṣe ìtumọ̀ náà kí ó lè jẹ́ Yorùbá adayébá àti kí àlàyé ìsàlẹ̀ a lè jẹ́ àṣàyàn gidi sí ‘ń ṣiṣẹ́ ní tẹ́ńpìlì.’ A ṣàlàyé ìpín pẹpẹ nínú ara ẹsẹ̀ gẹ́gẹ́ bí ìpín nínú ohun tí a ń rú lórí pẹpẹ, bí ìtumọ̀ Gíríìkì àti ọ̀nà ìtumọ̀ Gẹ̀ẹ́sì ṣe ń fi hàn; àlàyé b sì pa ọ̀rọ̀ gidi ‘pẹ̀lú pẹpẹ’ mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:40Z'
