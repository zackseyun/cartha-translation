  naturalness: ‘Ẹ kò ha mọ̀’ àti ‘àwọn tí ń ṣe iṣẹ́ ní pẹpẹ ìrúbọ’ jẹ́ Yorùbá ìgbàlódé tó dáa, tó sì ní ìwọ̀ntúnwọ̀nsì ìforígbárí ẹsẹ̀ náà. ‘Ń gba ìpín nínú ohun tí a ń rú lórí pẹpẹ’ yéye ju ‘ń gba ìpín pẹ̀lú pẹpẹ’ lọ nínú ara ẹsẹ̀.
