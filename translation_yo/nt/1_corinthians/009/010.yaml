id: 1CO.9.10
reference: 1 Corinthians 9:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: yo
  text: Àbí, ṣé nítorí wa pátápátá ni ó ń sọ èyí? Nítorí wa ni a kọ ọ́, pé ẹni tí ń tulẹ̀ gbọ́dọ̀ máa tulẹ̀ pẹ̀lú ìrètí, ẹni tí ń pakà sì gbọ́dọ̀ máa pakà pẹ̀lú ìrètí láti ní ìpín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντως
  choice: pátápátá
  rationale: Ó mú ìbéèrè àfiwé náà lágbára, ó sì lè túmọ̀ sí ‘pátápátá’ tàbí ‘dájúdájú’ ní àyíká yìí.
- source_word: δι’ ἡμᾶς
  choice: nítorí tiwa
  rationale: Ó fi ìdí tàbí àǹfààní àwọn ènìyàn hàn nínú àríyànjiyàn Pọ́ọ̀lù.
- source_word: ἐγράφη
  choice: a kọ ọ́
  rationale: Ìtumọ̀ aláìṣe ti aorist náà ni a fi hàn ní Yorùbá àdánidá.
- source_word: ὀφείλει
  choice: gbọ́dọ̀
  rationale: Ó pa ìmọ̀lára ojúṣe tàbí ohun tó yẹ mọ́ láìfi àfikún ẹ̀kọ́ ẹ̀sìn kún un.
- source_word: ἐπ’ ἐλπίδι
  choice: pẹ̀lú ìrètí
  rationale: Ó sọ ìrètí tí ń mú òṣìṣẹ́ ṣiṣẹ́, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: ẹni tí ń tulẹ̀ ... máa tulẹ̀
  rationale: Ó pa ìtòlẹ́sẹẹsẹ ẹni tó ń ṣe iṣẹ́ àti ìṣe náà mọ́, ó sì jẹ́ gbólóhùn gbogbogbò tí kò fi akọ tàbí abo sí i.
- source_word: ὁ ἀλοῶν
  choice: ẹni tí ń pakà
  rationale: ‘Pakà’ jẹ́ ọ̀rọ̀ iṣẹ́ àgbẹ̀ fún yíya hóró kúrò lára ewéko rẹ̀, ó sì tẹ̀ lé àfiwé ẹni tí ń tulẹ̀.
- source_word: τοῦ μετέχειν
  choice: láti ní ìpín
  rationale: Ó pa ohun tí a ó pín sílẹ̀ láìdárúkọ, gẹ́gẹ́ bí Gíríìkì, nígbà tó sì ṣì yéni nínú àyíká iṣẹ́ àgbẹ̀.
theological_decisions:
- issue: Ohun tí μετέχειν ń tọ́ka sí kò fara hàn gbangba
  choice: A túmọ̀ rẹ̀ sí ‘láti ní ìpín,’ láìfi ‘nínú ìkórè’ kún un.
  alternative: ‘láti ní ìpín nínú ìkórè’ tàbí ‘láti jẹ nínú èso oko’
  rationale: Gíríìkì kò sọ ohun tí ẹni náà yóò ní ìpín nínú rẹ̀; fífi í sílẹ̀ bá ìtumọ̀ orísun mu, àyíká iṣẹ́ àgbẹ̀ sì jẹ́ kí èrò náà yéni.
- issue: Agbára πάντως nínú ìbéèrè àfiwé
  choice: ‘pátápátá’ ni a lò nínú ìbéèrè náà.
  alternative: ‘dájúdájú’ tàbí ‘nítòótọ́’ gẹ́gẹ́ bí ìdáhùn ìmúdájú
  rationale: Ìyàn yìí pa ìṣòro ìtumọ̀ náà mọ́, ó sì tẹ̀ lé bí ọ̀rọ̀ náà ṣe mú ìbéèrè náà lágbára láìfi ‘Bẹ́ẹ̀ ni’ tí kò sí ní Gíríìkì kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò. A pa àtúnṣe ‘nítorí tiwa’ àti ìbáramu ‘ẹni tí ń tulẹ̀ ... ẹni tí ń pakà’ mọ́. Gbogbo àmì ohùn ni a fi síbi tó yẹ.
