revisions:
- from: Àbí nítorí tiwa pátápátá ni ó fi ń sọ èyí? Nítorí tiwa ni a sáà kọ ọ́, pé ẹni tí ń tulẹ̀ gbọ́dọ̀ máa tulẹ̀ pẹ̀lú ìrètí, ẹni tí ń pakà[a] sì gbọ́dọ̀ máa pakà pẹ̀lú ìrètí láti ní ìpín.
  to: Àbí, ṣé nítorí wa pátápátá ni ó ń sọ èyí? Nítorí wa ni a kọ ọ́, pé ẹni tí ń tulẹ̀ gbọ́dọ̀ máa tulẹ̀ pẹ̀lú ìrètí, ẹni tí ń pakà sì gbọ́dọ̀ máa pakà pẹ̀lú ìrètí láti ní ìpín.
  rationale: A rọ́pò “nítorí tiwa” pẹ̀lú “nítorí wa” ní ibi méjèèjì láti fi ìtumọ̀ benefactive ti δι’ ἡμᾶς hàn ní kedere. A tún ṣàtúnṣe àlàyé “pakà” nìkan; ìyókù ọ̀rọ̀ náà pa ìṣọ̀kan, ìrètí tí a tún sọ, àti àìmọ́ ohun tí a ó ní ìpín nínú rẹ̀ mọ́.
