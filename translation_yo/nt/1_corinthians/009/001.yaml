id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: yo
  text: Ǹjẹ́ èmi kò lómìnira? Ǹjẹ́ èmi kì í ṣe àpọ́sítélì? Ṣé èmi kò ti rí Jésù Olúwa wa? Ṣé ẹ̀yin kì í ṣe iṣẹ́ mi nínú Olúwa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ lọ́nà Yorùbá tí ó túbọ̀ wọ́pọ̀ pé, “Olúwa wa Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: lómìnira
  rationale: Ó túmọ̀ sí pé Pọ́ọ̀lù ní òmìnira àti ẹ̀tọ́; ‘lómìnira’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, ó sì bá àríyànjiyàn inú ọ̀rọ̀ yìí mu.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ipò iṣẹ́ àpọ́sítélì Pọ́ọ̀lù, kì í ṣe òjíṣẹ́ lásán.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jésù Olúwa wa
  rationale: Èyí tẹ̀ lé ètò ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì jẹ́ èdè Yorùbá tí ó ṣeé lóye.
- source_word: ἑόρακα
  choice: kò ti rí
  rationale: Àkókò perfect Gíríìkì fi hàn pé rírí náà ti ṣẹlẹ̀, ìtumọ̀ rẹ̀ sì ṣì dúró; àkójọpọ̀ ‘ti rí’ mú èyí jáde lọ́nà àdánidá.
- source_word: ἔργον
  choice: iṣẹ́
  rationale: Àwọn onígbàgbọ́ Kọ́ríńtì ni àbájáde iṣẹ́ àpọ́sítélì Pọ́ọ̀lù; ‘iṣẹ́’ pa àwòrán ọ̀rọ̀ orísun mọ́.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbólóhùn Pọ́ọ̀lù mọ́, ó sì tọ́ka sí àjọṣe tàbí ipò tẹ̀mí tí iṣẹ́ náà wà.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Ǹjẹ́ ... kò ...? / Ṣé ... kò ...? / Ṣé ... kì í ṣe ...?
  rationale: Àwọn ìbéèrè òdì wọ̀nyí ń retí ìdáhùn rere. Àwọn àgbékalẹ̀ yìí jẹ́ ti Yorùbá àdánidá, wọ́n sì pa agbára ìbéèrè àsọyé náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀rí Pọ́ọ̀lù pé òun ti rí Jésù
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ‘Ṣé èmi kò ti rí Jésù Olúwa wa?’
  alternative: Ṣíṣe é ní pàtó pé Pọ́ọ̀lù rí Jésù lẹ́yìn àjíǹde rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀, rírí Jésù ń ṣe àtìlẹ́yìn fún ipò àpọ́sítélì Pọ́ọ̀lù. Síbẹ̀, Gíríìkì kò sọ ‘lẹ́yìn àjíǹde’ ní tààrà, nítorí náà a kò fi kún ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún, a sì pa ìtẹ̀lé àwọn ìbéèrè àsọyé mẹ́rin àti ìyàtọ̀ inú gbólóhùn Gíríìkì mọ́.
