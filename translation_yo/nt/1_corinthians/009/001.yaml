  terminology: ‘Lómìnira,’ ‘àpọ́sítélì,’ ‘Olúwa,’ ‘iṣẹ́,’ àti ‘nínú Olúwa’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu fún ọ̀rọ̀ orísun àti fún ìforúkọsílẹ̀ Bíbélì Yorùbá. ‘Jésù Olúwa wa’ pa ìtòlẹ́sẹẹsẹ Gíríìkì mọ́, nígbà tí àlàyé abẹ́lẹ̀ fi yíyípadà èdè Yorùbá tó wọ́pọ̀ síi hàn.
