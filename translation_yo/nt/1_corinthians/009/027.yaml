id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: yo
  text: Ṣùgbọ́n mo ń fún ara mi ní ìbáwí líle[a], mo sì ń sọ ọ́ di ẹrú mi[b], kí n má bàa di ẹni tí kò yege[c] lẹ́yìn tí mo ti wàásù fún àwọn ẹlòmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ń lù ú fọnfọn”; ní tààrà, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí lílu ní abẹ́ ojú, ṣùgbọ́n níhìn-ín a lò ó gẹ́gẹ́ bí àwòrán ìbáwí ara ẹni tó le.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo ń mú un wá sábẹ́ ipò ẹrú,” tàbí “mo ń sọ ọ́ di ẹrú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹni tí a kọ̀ sílẹ̀” tàbí “ẹni tí a kò fọwọ́ sí”; “ẹni tí kò yege” bá àpẹẹrẹ eré ìdíje tó wà ní àyíká ọ̀rọ̀ náà mu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: fi ìbáwí líle kó ara mi níjàánu
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí lílu ní abẹ́ ojú, ṣùgbọ́n ní àyíká àpẹẹrẹ eré ìdíje yìí, ó ń tọ́ka sí ìbáwí ara ẹni tó le. Èdè yìí mú líle àpẹẹrẹ náà jáde láìjẹ́ kí ó dà bí àṣẹ láti pa ara ẹni lára.
- source_word: σῶμα
  choice: ara mi
  rationale: A pa ìtumọ̀ pàtó ‘ara’ mọ́, dípò yíyí i padà sí gbogbo ẹni tàbí ìwà ẹni.
- source_word: δουλαγωγῶ
  choice: sọ ọ́ di ẹrú mi
  rationale: Èyí pa àpẹẹrẹ líle ti mímú ohun kan wá sábẹ́ ipò ẹrú mọ́, kò sì rọ̀ ọ́ di ‘ṣàkóso rẹ̀’ lásán.
- source_word: μή πως
  choice: kí ó má bàá ṣẹlẹ̀ pé
  rationale: Gbólóhùn náà fi ìṣọ́ra àti àbájáde tí Pọ́ọ̀lù ń bẹ̀rù hàn ní Yorùbá àdánidá.
- source_word: ἄλλοις
  choice: fún àwọn ẹlòmíràn
  rationale: Èyí ni ọ̀nà àdánidá láti sọ àwọn tí a wàásù fún.
- source_word: κηρύξας
  choice: lẹ́yìn tí mo ti wàásù
  rationale: Ó fi hàn pé ìwàásù sí àwọn ẹlòmíràn ti ṣáájú àbájáde tí a ń bẹ̀rù.
- source_word: ἀδόκιμος
  choice: ẹni tí kò yege
  rationale: Nínú àyíká eré ìdíje, ‘kò yege’ fi èrò pé ẹni náà kò kọjá ìdánwò tàbí kò tó ìwọ̀n hàn, láìdáhùn àríyànjiyàn nípa bóyá ìkọ̀sílẹ̀ yìí jẹ́ ti ìgbàlà, iṣẹ́ ìránṣẹ́, tàbí èrè.
- source_word: γένομαι
  choice: di
  rationale: Ó pa ìtumọ̀ pé kí ẹni náà má bàá dé ipò bẹ́ẹ̀ ní ọjọ́ iwájú mọ́.
- source_word: ἀλλά
  choice: Ṣùgbọ́n
  rationale: Ó mú ìyàtọ̀ tó lágbára pẹ̀lú ọ̀rọ̀ tó ṣáájú hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ìbẹ̀rù Pọ́ọ̀lù pé òun lè di ἀδόκιμος
  choice: A túmọ̀ rẹ̀ sí ‘ẹni tí kò yege,’ ní ìbámu pẹ̀lú àpẹẹrẹ eré ìdíje àti ìdánwò.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ẹni tí Ọlọ́run kọ̀ ní ti ìgbàlà ìkẹyìn, tàbí ẹni tí kò yẹ fún iṣẹ́ ìránṣẹ́ tàbí èrè nìkan.
  rationale: Ọ̀rọ̀ Gíríìkì àti àyíká rẹ̀ fi ìkìlọ̀ tó ṣe pàtàkì hàn, ṣùgbọ́n wọn kò dá àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ yìí tán. ‘Ẹni tí kò yege’ pa ìforígbárí náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A pa ‘ara’ àti àpẹẹrẹ ‘ẹrú’ mọ́, a sì ṣàlàyé agbára ὑπωπιάζω nínú àlàyé ìsàlẹ̀ láìfi èdè ìpalára ara ẹni sí ojú ọ̀rọ̀.
