  to: 'Nítorí bí mo bá ń ṣe èyí ní ìfẹ́-ọkàn, ẹ̀san wà fún mi; ṣùgbọ́n bí mo bá ń ṣe é láìfẹ́-ọkàn, a ti fi iṣẹ́ ìríjú lé mi lọ́wọ́.[a]


    [a] Tàbí, “a ti fi iṣẹ́ àṣẹ kan lé mi lọ́wọ́.”'
  rationale: Àtúnṣe náà mú μισθός sun mọ́ “ẹ̀san,” ó sì mú ìtakora ἑκών àti ἄκων hàn kedere ní Yorùbá. Ó dá “iṣẹ́ ìríjú” dúró fún οἰκονομία, ó sì pa pé a ti fi iṣẹ́ náà lé ẹni lọ́wọ́—kì í ṣe pé ẹni náà kan ń ṣe é lọ́wọ́lọ́wọ́—mọ́. Àlàyé ìsàlẹ̀ náà fúnni ní yíyan “commission” gẹ́gẹ́ bí ìtumọ̀ ọ̀rọ̀ míì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:45Z'
