- from: 'Nítorí bí mo bá ń ṣe èyí tinútinú, mo ní èrè; ṣùgbọ́n bí mo bá ń ṣe é láìfẹ́, a ti fi iṣẹ́ ìríjú kan lé mi lọ́wọ́.[a]


