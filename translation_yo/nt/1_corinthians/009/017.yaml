base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: yo
  text: 'Nítorí bí mo bá ń ṣe èyí ní ìfẹ́-ọkàn, ẹ̀san wà fún mi; ṣùgbọ́n bí mo bá ń ṣe é láìfẹ́-ọkàn, a ti fi iṣẹ́ ìríjú lé mi lọ́wọ́.[a]


    [a] Tàbí, “a ti fi iṣẹ́ àṣẹ kan lé mi lọ́wọ́.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti fi iṣẹ́ àṣẹ kan lé mi lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκὼν
  choice: tinútinú
  rationale: Ó túmọ̀ sí ṣíṣe ohun pẹ̀lú ìfẹ́ inú ẹni; ó sì bá ìyàtọ̀ rẹ̀ sí ἄκων mu lọ́nà àdánidá ní Yorùbá.
- source_word: τοῦτο πράσσω
  choice: ń ṣe èyí
  rationale: Gbólóhùn yìí tọ́ka sí iṣẹ́ ìránṣẹ́ tí Pọ́ọ̀lù ń sọ̀rọ̀ nípa rẹ̀ láìfi ìtumọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: μισθὸν
  choice: èrè
  rationale: Èrè lè dúró fún ohun tí ẹni ń rí padà nítorí iṣẹ́, láìdín ìtumọ̀ náà kù sí owó iṣẹ́ nìkan.
- source_word: ἄκων
  choice: láìfẹ́
  rationale: Ó pa ìtakora tààrà pẹ̀lú ἑκὼν mọ́, láìfi èrò bí ìlọ́ra tàbí ìbínú kún ọ̀rọ̀ náà.
- source_word: οἰκονομίαν
  choice: iṣẹ́ ìríjú kan
  rationale: Ó pa àwòrán ojúṣe tí a fi lé ìríjú lọ́wọ́ mọ́, ó sì bójú mu ìtumọ̀ ìṣàkóso ohun tí a gbẹ́kẹ̀ lé ẹni láti ṣe.
- source_word: πεπίστευμαι
  choice: a ti fi ... lé mi lọ́wọ́
  rationale: Ìtumọ̀ yìí fi ohùn àgbàṣe àti ipò tí ó ń bá a lọ nínú perfect passive hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù nínú apá kejì
  choice: Kódà bí Pọ́ọ̀lù kò bá ṣe iṣẹ́ náà tinútinú, ojúṣe ìríjú tí a fi lé e lọ́wọ́ ṣì wà lórí rẹ̀.
  alternative: Ó lè túmọ̀ sí pé bí ó bá ṣe é láìfẹ́, ojúṣe lásán ni ó ń ṣe, kì í ṣe iṣẹ́ tí yóò mú èrè wá fún un.
  rationale: Gíríìkì fi μισθὸν ἔχω àti οἰκονομίαν πεπίστευμαι ṣe ìtakora. Ìtumọ̀ náà pa ìforígbárí tó wà láàárín iṣẹ́ tinútinú àti ojúṣe tí a fi lé ẹni lọ́wọ́ mọ́, láìyanju rẹ̀ sí ẹ̀kọ́ ìjọ kan pàtó.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Tinútinú” àti “láìfẹ́” jẹ́ ìtakora àdánidá; “iṣẹ́ ìríjú” sì pa àwòrán οἰκονομία mọ́.
