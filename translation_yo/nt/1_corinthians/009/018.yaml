id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: yo
  text: Ǹjẹ́ kí ni èrè mi? Èrè náà ni pé, nígbà tí mo ń kéde ìhìn rere, kí n fi ìhìn rere náà kalẹ̀ láìgba owó,[a] kí n má bàa lo ẹ̀tọ́ mi ní kíkún nínú iṣẹ́ ìhìn rere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí n kéde ìhìn rere náà láìjẹ́ kí ẹnikẹ́ni san owó.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: “kí n má bàa lo ẹ̀tọ́ mi ní kíkún nínú ìhìn rere.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: èrè
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí Pọ́ọ̀lù rí gbà gẹ́gẹ́ bí èrè iṣẹ́ rẹ̀, kì í ṣe owó iṣẹ́ nìkan; “èrè” sì bá ìbéèrè àfiwé náà mu.
- source_word: εὐαγγελιζόμενος
  choice: bí mo ṣe ń kéde ìhìn rere
  rationale: Ó fi hàn pé ìkéde náà ń lọ ní àkókò kan náà pẹ̀lú ìṣe pàtàkì inú gbólóhùn, ó sì pa agbára ọ̀rọ̀-ìṣe Gíríìkì mọ́.
- source_word: ἀδάπανον
  choice: láìgba owó
  rationale: Ìtumọ̀ rẹ̀ ni láìjẹ́ kí ẹni tí a ń kéde fún san owó tàbí ru ìnáwó; àsọyé yìí ṣe kedere ní Yorùbá òde òní.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: kí n mú ìhìn rere náà wá
  rationale: Ọ̀rọ̀ náà túmọ̀ ní tààrà sí fífi tàbí gbígbé ìhìn rere kalẹ̀; “mú ... wá” jẹ́ èdè Yorùbá àdánidá tí kò fi ìtumọ̀ náà sílẹ̀.
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí ni ìtumọ̀ gbangba ọ̀rọ̀ Gíríìkì náà, ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: καταχρήσασθαι
  choice: lo ... ní kíkún
  rationale: Níbí, ọ̀rọ̀ náà tọ́ka sí lílo ẹ̀tọ́ dé ẹ̀kúnrẹ́rẹ́, kì í ṣe dandan pé a ń lò ó ní ọ̀nà búburú.
- source_word: ἐξουσίᾳ
  choice: ẹ̀tọ́
  rationale: Àyíká 1 Kọ́ríńtì 9 ń sọ ní pàtàkì nípa ẹ̀tọ́ Pọ́ọ̀lù láti gba ìrànlọ́wọ́ ohun ìní, nítorí náà “ẹ̀tọ́” ṣe pàtó ju “àṣẹ” lọ.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: nínú iṣẹ́ ìhìn rere
  rationale: Àsọyé Gíríìkì náà lè túmọ̀ sí ohun tó ní í ṣe pẹ̀lú ìhìn rere tàbí iṣẹ́ ìhìn rere; fífi “iṣẹ́” kún un mú Yorùbá náà ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Irú ẹ̀tọ́ tí ἐξουσία ń tọ́ka sí
  choice: Ẹ̀tọ́ Pọ́ọ̀lù tó bófin mu láti gba ìrànlọ́wọ́ nínú iṣẹ́ ìhìn rere, èyí tí ó yàn láti má lò ní kíkún.
  alternative: Àṣẹ àpọ́sítélì ní gbogbogbòò, tàbí lílo àṣẹ ní ọ̀nà búburú.
  rationale: Àyíká orí kẹsàn-án ń sọ léraléra nípa ẹ̀tọ́ àpọ́sítélì sí ìrànlọ́wọ́ ohun ìní. Nítorí náà, a lo “ẹ̀tọ́” àti “lo ... ní kíkún” láìfi èrò ìlòkulò kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ εὐαγγέλιον
  choice: ìhìn rere
  alternative: ẹ̀kọ́ ìhìn rere tàbí gọ́spẹ́lì
  rationale: “Ìhìn rere” túmọ̀ ọ̀rọ̀ orísun ní tààrà, ó sì jẹ́ èdè Yorùbá tó ṣe kedere láìgbé àṣà ẹ̀sìn kan wọ inú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì yẹ fún kíkà ní gbangba. A yàgò fún ọ̀rọ̀ àdáni ẹ̀ya ìjọ kan, a sì pa àìdánilójú inú ἐν τῷ εὐαγγελίῳ mọ́ ní àlàyé ìsàlẹ̀.
