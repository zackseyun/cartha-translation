  to: Ta ni ó máa ń ṣe iṣẹ́ ológun ní ìnáwó ara rẹ̀ rí? Ta ni ó gbin ọgbà àjàrà tí kò sì jẹ èso rẹ̀? Tàbí ta ni ó ń ṣe olùṣọ́ agbo tí kò sì mu nínú wàrà agbo náà?[a][b]
