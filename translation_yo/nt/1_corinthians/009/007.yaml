id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: yo
  text: Ta ni ó máa ń ṣe iṣẹ́ ológun ní ìnáwó ara rẹ̀ rí? Ta ni ó gbin ọgbà àjàrà tí kò sì jẹ èso rẹ̀? Tàbí ta ni ó ń ṣe olùṣọ́ agbo tí kò sì mu nínú wàrà agbo náà?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “pẹ̀lú owó iṣẹ́ tàbí oúnjẹ tirẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí owó iṣẹ́ tàbí ìpín oúnjẹ ológun; ìtumọ̀ ibí ni pé ológun kì í ru ìnáwó iṣẹ́ rẹ̀ fúnra rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “kò jẹ nínú wàrà agbo náà.” Ọ̀rọ̀ Gíríìkì fún “jẹ” ni a lò, ṣùgbọ́n Yorùbá máa ń sọ pé a “mu” wàrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: ṣiṣẹ́ ológun
  rationale: Ó túmọ̀ sí ṣíṣe iṣẹ́ ológun; ọ̀rọ̀ yìí pa àpẹẹrẹ iṣẹ́ ológun mọ́ láì fi dandan sọ pé ẹni náà ń jagun ní àkókò náà.
- source_word: ἰδίοις ὀψωνίοις
  choice: ní ìnáwó ara rẹ̀
  rationale: ὀψώνιον lè tọ́ka sí owó iṣẹ́ tàbí oúnjẹ ológun, ṣùgbọ́n nínú ìbéèrè àsọyé yìí, kókó rẹ̀ ni pé ológun kì í ru gbogbo owó iṣẹ́ rẹ̀ fúnra rẹ̀.
- source_word: ποτέ
  choice: rí
  rationale: Nínú ìbéèrè àsọyé Yorùbá, “rí” fi ìtumọ̀ ‘nígbà kan rí/ever’ hàn lọ́nà àdánidá.
- source_word: φυτεύει ἀμπελῶνα
  choice: ó gbin ọgbà àjàrà
  rationale: Ìtumọ̀ tààrà ni gbígbin ọgbà àjàrà, ó sì jẹ́ èdè iṣẹ́ àgbẹ̀ tí ó ṣe kedere.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: èso rẹ̀
  rationale: καρπός ni èso tàbí ohun tí ọgbà náà mú jáde; “èso rẹ̀” jẹ́ ṣókí, ó sì sún mọ́ Gíríìkì.
- source_word: ποιμαίνει ποίμνην
  choice: ń ṣe olùṣọ́ agbo
  rationale: Yíyan yìí pa àwòrán olùṣọ́ ẹran mọ́, ó sì jẹ́ Yorùbá tí àwọn òǹkàwé òde òní lè lóye.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: mu lára wàrà agbo náà
  rationale: “Lára” ṣàfihàn ìtumọ̀ apá kan láti inú ohun tí agbo ń pèsè, nígbà tí “mu” bá wàrà mu lọ́nà àdánidá ní Yorùbá.
- source_word: ἐσθίει
  choice: jẹ / mu
  rationale: Ọ̀rọ̀ Gíríìkì kan náà, “jẹ,” ni a lò nínú àwọn gbólóhùn méjèèjì; ṣùgbọ́n Yorùbá máa ń sọ pé a “mu” wàrà. Àlàyé ìsàlẹ̀ fi ìyàtọ̀ yìí hàn.
theological_decisions:
- issue: Ọkùnrin ẹyọ kan gẹ́gẹ́ bí àpẹẹrẹ gbogbogbò nínú àwọn gbólóhùn τίς
  choice: Lo “ara rẹ̀” àti àwọn ọ̀rọ̀ arọ́pò-orúkọ ẹyọ kan tí kò fi akọ tàbí abo hàn ní Yorùbá
  alternative: Fi ọ̀rọ̀ tí yóò sọ akọ pàtó kún un
  rationale: Gíríìkì lò àwọn fọ́ọ̀mù akọ ẹyọ kan gẹ́gẹ́ bí àpẹẹrẹ gbogbogbò. Yorùbá kò fi akọ tàbí abo hàn nínú “ó/rẹ̀,” nítorí náà ìtumọ̀ gbogbogbò náà wà láì fi ohun tí kò sí nínú èdè àfojúsùn kún un.
translation_notes:
  register: Èdè Yorùbá àtẹ̀jáde, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. Àwọn ìbéèrè àsọyé mẹ́tẹ̀ẹ̀ta àti ìfararora wọn ni a pa mọ́; a lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
