id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: yo
  text: Ṣé ní ojú ìwòye ènìyàn lásán ni mo ń sọ nǹkan wọ̀nyí[a]? Tàbí Òfin náà kò ha tún sọ nǹkan wọ̀nyí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ènìyàn” tàbí “láti ojú ìwòye ènìyàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Ṣé ... ni ...?
  rationale: Àwọn ọ̀rọ̀ ìbéèrè yìí mú kí a retí ìdáhùn òdì sí apá àkọ́kọ́; ìṣètò ‘Ṣé ... ni ...?’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìbéèrè àsọyé náà mọ́.
- source_word: κατὰ ἄνθρωπον
  choice: ní ojú ìwòye ènìyàn lásán
  rationale: Gbólóhùn náà túmọ̀ sí láti ojú ìwòye tàbí ìpìlẹ̀ ènìyàn lásán, ní ìyàtọ̀ sí ẹ̀rí Ìwé Mímọ́; kò kàn túmọ̀ sí ‘gẹ́gẹ́ bí ènìyàn.’
- source_word: ταῦτα
  choice: nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́, ó sì tọ́ka padà sí àríyànjiyàn Pọ́ọ̀lù tó ṣáájú.
- source_word: λαλῶ
  choice: mo fi ń sọ
  rationale: Fọ́ọ̀mù ìsinsìnyí tọ́ka sí ohun tí Pọ́ọ̀lù ń sọ nínú àríyànjiyàn rẹ̀ lọ́wọ́lọ́wọ́.
- source_word: ἢ
  choice: Tàbí
  rationale: Ó mú àṣàyàn kejì wọlé ní ọ̀nà àdánidá, gẹ́gẹ́ bí Gíríìkì.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi Òfin kún un gẹ́gẹ́ bí ẹlẹ́rìí mìíràn lẹ́gbẹ̀ẹ́ ìrònú ènìyàn.
- source_word: ὁ νόμος
  choice: Òfin náà
  rationale: Àyíká ẹsẹ tó tẹ̀ lé e, tó fa Diutarónómì 25:4 yọ, fi hàn pé Òfin Mósè tàbí apá òfin inú Ìwé Mímọ́ ni a ń tọ́ka sí.
- source_word: οὐ λέγει
  choice: kò ha sọ
  rationale: ‘Kò ha’ pa ìbéèrè àsọyé tí ó retí ìdáhùn bẹ́ẹ̀ni mọ́, dípò kí a sọ ọ́ di gbólóhùn ìjẹ́rìí lasán.
theological_decisions:
- issue: Ohun tí ‘Òfin’ ń tọ́ka sí nínú àríyànjiyàn Pọ́ọ̀lù
  choice: Òfin Mósè oziroma àkójọpọ̀ òfin inú Ìwé Mímọ́
  alternative: òfin gẹ́gẹ́ bí ìlànà gbogbogbòò
  rationale: Ẹsẹ 9 tọ́ka sí Diutarónómì 25:4 ní tààrà, nítorí náà Òfin inú Ìwé Mímọ́ ni Pọ́ọ̀lù ń pè ní ẹlẹ́rìí; ‘Òfin náà’ pa ìtọ́kasí yìí mọ́ láìfi ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Lásán’ mú ìyàtọ̀ tó wà láàárín ojú ìwòye ènìyàn àti ẹ̀rí Òfin hàn; ‘kò ha’ sì bá ìbéèrè àsọyé oníyì mu.
