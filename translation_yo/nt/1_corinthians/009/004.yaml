  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: yo
  text: Ṣé àwa kò ní ẹ̀tọ́ láti jẹ àti láti mu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àṣẹ láti jẹ àti láti mu.” Níhìn-ín, ‘ẹ̀tọ́’ túmọ̀ sí ohun tí ó tọ́ sí wa tàbí òmìnira tí ó bófin mu; ó ṣeé ṣe kí ó tọ́ka sí gbígba ìtìlẹ́yìn ohun èlò nínú àríyànjiyàn Pọ́ọ̀lù.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Ṣé àwa kò
  rationale: Àpapọ̀ ọ̀rọ̀ Gíríìkì yìí bẹ̀rẹ̀ ìbéèrè àsọyé tí ó ń retí ìdáhùn rere; ọ̀nà Yorùbá yìí pa ìrísí ìbéèrè náà àti ìtumọ̀ rẹ̀ mọ́.
- source_word: ἔχομεν
  choice: ní
  rationale: ‘Ní’ ni ọ̀rọ̀ Yorùbá àdánidá fún jíjẹ́ ẹni tí ó ní ẹ̀tọ́ tàbí ohun kan.
- source_word: ἐξουσίαν
  choice: ẹ̀tọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí àṣẹ tàbí òmìnira tí ó bófin mu, kì í ṣe agbára lásán; ‘ẹ̀tọ́’ mú ìtumọ̀ ìbéèrè Pọ́ọ̀lù nípa ohun tí ó tọ́ sí àwọn àpọ́sítélì jáde.
- source_word: φαγεῖν
  choice: láti jẹ
  rationale: Ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ ìṣe aláìlẹ́ni Gíríìkì náà ni èyí.
- source_word: καὶ πεῖν
  choice: kí a sì mu
  rationale: Ìṣọ̀kan yìí jẹ́ Yorùbá àdánidá fún àwọn ọ̀rọ̀ ìṣe méjì tí a so pọ̀, ó sì pa ìtumọ̀ ‘jẹ àti mu’ mọ́.
theological_decisions:
- issue: Ìwọ̀n ẹ̀tọ́ àwọn àpọ́sítélì nínú àyíká ọ̀rọ̀
  choice: A fi ‘ẹ̀tọ́ láti jẹ, kí a sì mu’ sílẹ̀ nínú ẹsẹ náà, ní ìbámu pẹ̀lú ẹ̀tọ́ àwọn àpọ́sítélì tàbí òṣìṣẹ́ láti rí ìrànlọ́wọ́ ohun ìní gbà.
  alternative: Gbólóhùn gbogbogbò nípa òmìnira gbogbo ènìyàn láti jẹ àti láti mu.
  rationale: Àyíká 1 Kọ́ríńtì 9 dá lórí ẹ̀tọ́ Pọ́ọ̀lù gẹ́gẹ́ bí àpọ́sítélì, pàápàá jù lọ nípa ìrànlọ́wọ́ láti ọ̀dọ̀ àwọn ìjọ. Síbẹ̀, a kò fi ‘ìrànlọ́wọ́’ kún ọ̀rọ̀ pàtó nínú ẹsẹ náà, kí a má bàa tú ìtumọ̀ náà ju bí Gíríìkì ṣe sọ ọ́ lọ.
translation_notes:
  register: Yorùbá àtẹ̀wọ́dá, òde òní, tí ó ní iyì ni a lò. ‘Ṣé’ mú ìbéèrè àsọyé náà dun bí Yorùbá àdánidá, nígbà tí àmì ohùn kíkún ń mú ìtumọ̀ hàn gbangba.
