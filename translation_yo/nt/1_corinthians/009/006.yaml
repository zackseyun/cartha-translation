  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: yo
  text: Àbí èmi àti Bánábà nìkan ni a kò ní ẹ̀tọ́ láti má ṣiṣẹ́?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “àṣẹ láti má ṣiṣẹ́” tàbí “òmìnira láti má ṣiṣẹ́.” Níhìn-ín, ó ń sọ̀rọ̀ nípa ẹ̀tọ́ láti má ṣe iṣẹ́ ọwọ́ fún ìtọ́jú ara ẹni, kí àwọn onígbàgbọ́ lè máa ṣèrànwọ́ fún wọn nínú iṣẹ́ ìránṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ń mú àṣàyàn ìbéèrè mìíràn wọ inú ìjíròrò Pọ́ọ̀lù, ó sì jẹ́ àsopọ̀ àdánidá ní Yorùbá.
- source_word: μόνος
  choice: nìkan
  rationale: Ó tẹnumọ́ pé Pọ́ọ̀lù àti Bánábà ni a yà sọ́tọ̀ nínú ìbéèrè ọ̀rọ̀ àsọyé yìí.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: èmi àti Bánábà
  rationale: Ó tẹ̀lé ètò orúkọ inú Gíríìkì, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: οὐκ ἔχομεν
  choice: ni kò ní
  rationale: Pẹ̀lú 'nìkan,' ọ̀nà yìí sọ ìsẹ́nilọ́wọ́ náà ní kedere nínú ìbéèrè Yorùbá.
- source_word: ἐξουσίαν
  choice: ẹ̀tọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹ̀tọ́ tàbí àǹfààní tó bófin mu, kì í ṣe àṣẹ lórí ẹlòmíràn.
- source_word: μὴ ἐργάζεσθαι
  choice: láti má ṣiṣẹ́
  rationale: Ó pa ìtumọ̀ àìṣe iṣẹ́ mọ́ ní ṣókí, láì fi ìtumọ̀ àfikún sínú ẹsẹ náà.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσία nínú àyíká ẹsẹ náà
  choice: Ẹ̀tọ́ àwọn aposteli láti má ṣe iṣẹ́ ọwọ́ fún ìtọ́jú ara wọn, kí wọ́n sì gba ìrànlọ́wọ́ ohun ìní nínú iṣẹ́ ìránṣẹ́
  alternative: Àṣẹ tàbí òmìnira ní gbogbogbòò láì tọ́ka pàtó sí ìrànlọ́wọ́ ohun ìní
  rationale: Àyíká 1 Kọ́ríńtì 9 ń sọ nípa ẹ̀tọ́ àwọn aposteli sí oúnjẹ àti ìtọ́jú, àti bí Pọ́ọ̀lù ṣe yàn láti má lo ẹ̀tọ́ náà. Ọ̀rọ̀ ẹsẹ náà kò yẹ kí a fẹ̀ sí i ju bí Gíríìkì ṣe sọ lọ.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tó níyì, tó ṣe déédé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì pa ìbéèrè ọ̀rọ̀ àsọyé àti ìṣòro ìtumọ̀ tó wà nínú Gíríìkì mọ́.
