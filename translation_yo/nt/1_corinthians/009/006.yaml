  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: Àbí ń ṣàfihàn ìbéèrè àṣàyàn, nìkan ń tẹnumọ́ ìyasọ́tọ̀ Pọ́ọ̀lù àti Bánábà, ẹ̀tọ́ yẹ fún ἐξουσίαν nínú àyíká yìí, àti láti má ṣiṣẹ́ ń pa μὴ ἐργάζεσθαι mọ́ láì ṣàfikún ìtumọ̀ sí ẹsẹ náà.'
