id: 1CO.9.23
reference: 1 Corinthians 9:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: yo
  text: Ṣùgbọ́n mo ń ṣe ohun gbogbo nítorí ìhìn rere, kí n lè di alábàápín nínú rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí n lè kópa nínú rẹ̀,” tàbí “kí n lè di alájọṣepọ̀ nínú rẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó ṣe àfihàn ìtumọ̀ tó gbòòrò ti πᾶς ní ọ̀pọ̀ nọ́ńbà aláìlẹ́mìí, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘gbogbo nǹkan’ ní Yorùbá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ níbí ń fi ìyàtọ̀ kékeré hàn sí ọ̀rọ̀ tó ṣáájú; ‘Ṣùgbọ́n’ mú ìyàtọ̀ yẹn jáde lọ́nà tó ṣe kedere.
- source_word: ποιῶ
  choice: mo ń ṣe
  rationale: Àmì ‘ń’ fi ìṣe tí Pọ́ọ̀lù máa ń ṣe tàbí tó ń bá a lọ hàn, gẹ́gẹ́ bí ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ποιῶ.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: nítorí ìhìn rere
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative lè tọ́ka sí ìdí, ète, tàbí ohun tí a ṣe fún àǹfààní rẹ̀. ‘Nítorí ìhìn rere’ jẹ́ kíkà àdánidá tí kò fi ipá yan ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyí.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò ‘kí ... lè’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi gbólóhùn ète tí ἵνα bẹ̀rẹ̀ hàn.
- source_word: συγκοινωνὸς
  choice: alábàápín
  rationale: ‘Alábàápín’ túmọ̀ sí ẹni tó ń pín tàbí kópa nínú ohun kan pẹ̀lú àwọn ẹlòmíràn, ó sì pa èrò συν- mọ́ láì dín ìtumọ̀ rẹ̀ kù sí iṣẹ́ ìránṣẹ́ nìkan.
- source_word: αὐτοῦ
  choice: nínú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka padà sí εὐαγγέλιον, ìyẹn ‘ìhìn rere’; ‘nínú rẹ̀’ bá ‘alábàápín’ mu ní Yorùbá.
- source_word: γένωμαι
  choice: lè di
  rationale: ‘Di’ pa ìtumọ̀ ìwọlé sínú ipò kan tí γίνομαι ní mọ́, dípò fífi í hàn bí ipò tí ó ti wà tẹ́lẹ̀.
theological_decisions:
- issue: Ìtumọ̀ bí Pọ́ọ̀lù ṣe ń ṣe alábàápín ní ìbáṣepọ̀ pẹ̀lú ìhìn rere
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní gbòòrò gẹ́gẹ́ bí dídá alábàápín nínú ìhìn rere.
  alternative: A lè túmọ̀ ọ́ sí kíkópa nínú àwọn ìbùkún rẹ̀, ìtànkálẹ̀ rẹ̀, tàbí iṣẹ́ ìránṣẹ́ rẹ̀.
  rationale: συγκοινωνός kò sọ ohun tí ìpín náà jẹ́ ní pàtó. Ìtumọ̀ yìí kò fi ẹ̀kọ́ ẹ̀sìn kan lé e lórí, ó sì pa àìdánilójú àti ìfọkànsìn ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ìhìn rere’ jẹ́ gbólóhùn tó ṣeé lóye ju ọ̀rọ̀ ṣọ́ọ̀ṣì àkànṣe lọ; ‘alábàápín’ sì pa ìtumọ̀ gbígbòòrò orísun mọ́.
