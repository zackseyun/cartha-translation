  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: yo
  text: Àti fún àwọn Júù, mo di bí Júù, kí n lè jèrè àwọn Júù[a]; fún àwọn tí ó wà lábẹ́ òfin[b], mo di bí ẹni tí ó wà lábẹ́ òfin—bí ó tilẹ̀ jẹ́ pé èmi fúnra mi kò wà lábẹ́ òfin—kí n lè jèrè àwọn tí ó wà lábẹ́ òfin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú àwọn Júù wá sí ẹ̀gbẹ́ mi”; ọ̀rọ̀ náà lè túmọ̀ sí láti jèrè tàbí láti mú ẹnì kan wá sí ẹ̀gbẹ́ ẹni.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe jù pé “òfin” níhìn-ín ń tọ́ka sí Òfin Mósè.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: mo dà
  rationale: Ó ṣàfihàn pé Pọ́ọ̀lù mú ìwà tàbí ọ̀nà ìgbéṣe kan lò ní ìbámu pẹ̀lú ẹgbẹ́ kọ̀ọ̀kan; kò túmọ̀ sí pé ìdánimọ̀ ẹ̀yà rẹ̀ yí padà.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: fún àwọn Júù ... bí Júù
  rationale: ‘Fún’ mú ìbáṣepọ̀ dative náà jáde lọ́nà àdánidá, ‘bí Júù’ sì pa agbára ìfiwéra ὡς mọ́ láì sọ pé Pọ́ọ̀lù kò jẹ́ Júù ní ti ẹ̀yà mọ́.
- source_word: ἵνα ... κερδήσω
  choice: kí n lè jèrè
  rationale: κερδαίνω lè túmọ̀ sí láti jèrè tàbí láti mú ẹnì kan wá sí ẹ̀gbẹ́ ẹni. ‘Jèrè’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí ète iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù nínú àyíká yìí.
- source_word: τοῖς ὑπὸ νόμον
  choice: fún àwọn tí ó wà lábẹ́ òfin
  rationale: Ó tú gbólóhùn substantival Gíríìkì náà sí Yorùbá àdánidá, ó sì pa àwòrán jíjẹ́ ‘lábẹ́’ òfin mọ́.
- source_word: ὡς ὑπὸ νόμον
  choice: mo dà bí ẹni tí ó wà lábẹ́ òfin
  rationale: Fífikun ‘ẹni tí ó wà’ jẹ́ kí gbólóhùn náà pé ní Yorùbá, nígbà tí ó ṣì pa ìfiwéra àti ìdánimọ̀ ìwà Pọ́ọ̀lù mọ́.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: bí ó tilẹ̀ jẹ́ pé èmi fúnra mi kò sí lábẹ́ òfin
  rationale: Ó pa àfikún ìyàtọ̀ tó wà nínú participle náà mọ́, ‘èmi fúnra mi’ sì ṣàfihàn ìtẹnumọ́ αὐτός. Àkókò ìsinsìnyí pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ipò Pọ́ọ̀lù.
- source_word: νόμος
  choice: òfin
  rationale: ‘Òfin’ jẹ́ ìtumọ̀ Yorùbá tó tọ́, ó sì pa gbólóhùn náà ní fífẹ̀ díẹ̀ bí ti Gíríìkì; àlàyé ìsàlẹ̀ ojú ìwé ló sọ pé ó ṣeé ṣe jù pé Òfin Mósè ni.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù pé òun kò sí ‘lábẹ́ òfin’
  choice: Bí ó tilẹ̀ jẹ́ pé èmi fúnra mi kò sí lábẹ́ òfin
  alternative: Bí ó tilẹ̀ jẹ́ pé èmi fúnra mi kò sí lábẹ́ Òfin Mósè; tàbí fífi ọ̀rọ̀ ẹsẹ 21 kún un pé ó wà lábẹ́ òfin Kristi
  rationale: Gíríìkì ẹsẹ yìí kò sọ ju pé Pọ́ọ̀lù kò sí lábẹ́ òfin lọ. A kò sọ òfin náà di ‘Òfin Mósè’ nínú àyọkà, bẹ́ẹ̀ ni a kò fi ọ̀rọ̀ ẹsẹ tó tẹ̀ lé e ṣe ìbáramu, kí ìyàtọ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà lè dúró.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. Àtúnṣe ‘mo dà bí’ jẹ́ àdánidá ju ìtumọ̀ líle ‘mo di’ lọ, ó sì yẹra fún èrò pé Pọ́ọ̀lù yí ìdánimọ̀ ẹ̀yà rẹ̀ padà.
