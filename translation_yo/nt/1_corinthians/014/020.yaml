id: 1CO.14.20
reference: 1 Corinthians 14:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: yo
  text: Ẹ̀yin ará[a], ẹ má ṣe di ọmọdé nínú ìrònú yín. Ṣùgbọ́n ẹ jẹ́ ọmọ ọwọ́ ní ti ìwà búburú[b]; ní ti ìrònú yín sì, ẹ di ẹni tí ó dàgbà dénú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ “arákùnrin” ní ọ̀pọ̀; gẹ́gẹ́ bí ọ̀rọ̀ ìpè sí ìjọ, ó lè gba àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìkà”; ọ̀rọ̀ Gíríìkì κακία lè túmọ̀ sí ibi, ìwà búburú, tàbí ìkà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: Ọ̀rọ̀ ìpè yìí ń tọ́ka sí àwọn ará ìjọ. “Ẹ̀yin ará” jẹ́ ọ̀nà àdánidá àti ọlọ́lá ní Yorùbá láti bá gbogbo ìjọ sọ̀rọ̀, láì sọ agbára àkópọ̀ ọ̀rọ̀ Gíríìkì nù; àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí.
- source_word: παιδία
  choice: ọmọdé
  rationale: Ó túmọ̀ sí àwọn ọmọ lápapọ̀, ó sì dá ìyàtọ̀ rẹ̀ pẹ̀lú “ọmọ ọwọ́” àti ẹni “tí ó dàgbà dénú” dúró láì sọ ọjọ́-orí pàtó ju ohun tí orísun sọ lọ.
- source_word: γίνεσθε
  choice: ẹ má ṣe di / ẹ di
  rationale: Ìṣe náà ní èrò dídà tàbí dídi ohun kan, kì í ṣe ipò tí kò yí padà nìkan. Lílo “di” ní ìbẹ̀rẹ̀ àti òpin pa ìṣọ̀kan ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: nínú ìrònú yín
  rationale: φρήν níhìn-ín ń tọ́ka sí agbára láti ronú àti láti lóye. “Nínú ìrònú yín” jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere, ó sì jẹ́ kí àtúnsọ inú ẹsẹ náà hàn.
- source_word: τῇ κακίᾳ
  choice: ní ti ìwà búburú
  rationale: κακία lè túmọ̀ sí ibi, ìwà búburú, tàbí ìkà. “Ìwà búburú” mú ẹ̀kúnrẹ́rẹ́ àgbègbè ìwà tí kò dára jáde, láì dín un kù sí ìkà sí ẹlòmíràn nìkan.
- source_word: νηπιάζετε
  choice: ẹ jẹ́ ọmọ ọwọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjẹ́ tàbí hù bí ọmọ kékeré tí kò tíì dàgbà. “Ọmọ ọwọ́” mú ìyàtọ̀ pẹ̀lú “ọmọdé” àti “dàgbà dénú” hàn ní èdè àdánidá.
- source_word: τέλειοι
  choice: ẹni tí ó dàgbà dénú
  rationale: Ní àyíká yìí, τέλειος ń sọ nípa ìdàgbà àti òye pípé síwájú, kì í ṣe àìlẹ́ṣẹ̀ pátápátá. “Dàgbà dénú” sọ ìtumọ̀ yìí ní kedere ní Yorùbá.
- source_word: ἀλλὰ ... δὲ
  choice: Ṣùgbọ́n ... sì
  rationale: Àwọn ọ̀rọ̀ àsopọ̀ yìí fi ìtakora àti ìyípadà kókó hàn. “Ṣùgbọ́n ... sì” jẹ́ àkójọpọ̀ àdánidá ní Yorùbá tí ó pa ìṣísẹ̀ ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ ìpè ìjọ tí ó ní ìrísí akọ
  choice: “Ẹ̀yin ará” nínú ẹsẹ, pẹ̀lú àlàyé pé ọ̀rọ̀ Gíríìkì ní ìrísí akọ ṣùgbọ́n ó lè gba gbogbo ìjọ.
  alternative: “Ẹ̀yin arákùnrin”
  rationale: Ἀδελφοί jẹ́ ọ̀pọ̀ akọ ní ìrísí, ṣùgbọ́n ní ọ̀rọ̀ ìpè ìjọ ó sábà máa ń gba àwọn ọkùnrin àti obìnrin. “Ẹ̀yin arákùnrin” lè mú kí òǹkàwé Yorùbá rò pé àwọn ọkùnrin nìkan ni a ń bá sọ̀rọ̀; “Ẹ̀yin ará” pa agbára ìjọ mọ́, àlàyé ìsàlẹ̀ sì jẹ́ kí ìrísí orísun hàn.
- issue: Ìtumọ̀ τέλειοι
  choice: Ìdàgbà dénú nínú ìrònú
  alternative: Pípé tàbí àìlẹ́ṣẹ̀
  rationale: Ìtakora pẹ̀lú “ọmọdé” fi hàn pé ìdàgbà nínú òye ni kókó, kì í ṣe ẹ̀kọ́ nípa àìlẹ́ṣẹ̀ pátápátá.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àtúnsọ “nínú ìrònú yín” àti ìtakora láàárín ọmọdé, ọmọ ọwọ́, àti ẹni tí ó dàgbà dénú mọ́. Gbogbo àmì ohùn ni a lò níbi tí ó bá yẹ.
