  source_fidelity: Ìtumọ̀ náà mú ìṣọ̀kan gbólóhùn oníṣèméjì, ‘gbogbo wọn,’ àsọtẹ́lẹ̀, àti àwọn èròjà méjèèjì ti ipa ọ̀rọ̀ náà lórí alejo náà hàn dáadáa. Ṣùgbọ́n ‘yóò’ ń sọ ìṣẹ̀lẹ̀ náà di ọjọ́ iwájú, níbi tí Gíríìkì ti ń ṣàpèjúwe ohun tí ó ń ṣẹlẹ̀ nínú ìṣẹ̀lẹ̀ àfojúsùn náà. Gbólóhùn fún ἰδιώτης tún gùn díẹ̀, ó sì ń fi ‘ẹ’ tí kò sí nínú orísun kún un.
  naturalness: ‘Ẹni tí kò ní ìmọ̀ nípa rẹ̀’ jẹ́ kúkúrú, ó sì dáa ní Yorùbá òde òní ju ‘ẹni tí kò mọ ohun tí ẹ ń ṣe níbẹ̀’ lọ. Lílo ‘ń fi ẹ̀bi rẹ̀ hàn án’ àti ‘ń ṣàyẹ̀wò rẹ̀’ ń jẹ́ kí àwọn ọ̀rọ̀-ìṣe náà rọrùn fún kíkà ní gbangba, nígbà tí a pa àtúnwí ‘gbogbo wọn’ mọ́.
  terminology: ‘Sọ àsọtẹ́lẹ̀,’ ‘ẹni tí kò gbàgbọ́,’ àti ‘ṣàyẹ̀wò’ bá ìtumọ̀ ìpilẹ̀ṣẹ̀ mu. ‘Fi ẹ̀bi rẹ̀ hàn án’ ń ṣàfihàn ἐλέγχεται gẹ́gẹ́ bí ìfihàn ẹ̀bi/ìdálójú, láì sọ ọ́ di ìdájọ́ ìkẹyìn. Àlàyé ìsàlẹ̀ ń pa àìdánilójú ἰδιώτης mọ́.
