  - severity: low
    issue: Ìtumọ̀ ἰδιώτης gùn, ó sì ṣàfikún ẹni kejì ‘ẹ’
    rationale: ‘Ohun tí ẹ ń ṣe níbẹ̀’ jẹ́ àlàyé tí ó gùn ju, ‘ẹ’ náà kò sì wà nínú Gíríìkì. ‘Ẹni tí kò ní ìmọ̀ nípa rẹ̀,’ pẹ̀lú àlàyé ìsàlẹ̀, pa àìmọ̀/àìkópa tí ọ̀rọ̀ náà ní mọ́.
