id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: yo
  text: Ṣùgbọ́n bí gbogbo wọn bá ń sọ àsọtẹ́lẹ̀, tí ẹni kan tí kò gbàgbọ́ tàbí ẹni tí kò ní ìmọ̀ nípa rẹ̀[a] bá wọlé, gbogbo wọn ń fi ẹ̀bi rẹ̀ hàn án; gbogbo wọn sì ń ṣàyẹ̀wò rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ẹni òde.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹni tí kò mọ ohun tí ó ń ṣẹlẹ̀, ẹni tí a kò tíì kọ́ nípa rẹ̀, tàbí ẹni tí kì í ṣe ara ẹgbẹ́ àwọn tí ń sọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ ènìyàn náà mọ́, ó sì tọ́ka sí àwọn tí ń sọ̀rọ̀ nínú ìpéjọpọ̀.
- source_word: προφητεύωσιν
  choice: bá ń sọ àsọtẹ́lẹ̀
  rationale: Èyí pa ẹ̀ka ọ̀rọ̀ Pọ́ọ̀lù nípa àsọtẹ́lẹ̀ mọ́ láì dín in kù sí ọ̀rọ̀ onímìísí lásán.
- source_word: ἄπιστος
  choice: ẹni tí kò gbàgbọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí ẹni tí kò ní ìgbàgbọ́, kì í ṣe ẹni aláìṣòótọ́ lásán.
- source_word: ἰδιώτης
  choice: ẹni tí kò mọ ohun tí ẹ ń ṣe níbẹ̀
  rationale: Gbólóhùn yìí fi àìmọ̀ tàbí àìmọ̀ọ́ṣe ẹni náà nípa ohun tó ń ṣẹlẹ̀ nínú ìpéjọpọ̀ hàn, láì sọ ọ́ di ẹni tí kò sí nínú ìjọ ní pàtó.
- source_word: ἐλέγχεται
  choice: gbogbo wọn yóò fi ohun tí kò tọ́ nínú rẹ̀ hàn án
  rationale: Ó mú ìtumọ̀ ìfihàn àṣìṣe àti ìdálójú ọkàn jáde, láì gbé e dé ìdájọ́ ìkẹyìn.
- source_word: ἀνακρίνεται
  choice: gbogbo wọn yóò sì yẹ̀ ẹ́ wò
  rationale: Ó ṣàfihàn fífara balẹ̀ ṣàyẹ̀wò ẹni náà, láì túmọ̀ rẹ̀ sí ìdálẹ́bi pátápátá.
- source_word: ὑπὸ πάντων
  choice: gbogbo wọn
  rationale: A tún un sọ ní ìgbà méjèèjì gẹ́gẹ́ bí Gíríìkì, láti pa ìtẹnumọ́ rẹ̀ mọ́.
- source_word: δέ
  choice: Ṣùgbọ́n / sì
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ohun tó ṣáájú hàn; “sì” mú ìṣàn gbólóhùn kejì rọrùn ní Yorùbá.
- source_word: τις
  choice: ẹni kan
  rationale: Ó pa àìsọ ẹni pàtó tí ọ̀rọ̀ Gíríìkì ní mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἰδιώτης nínú àyíká ìpéjọpọ̀
  choice: ẹni tí kò mọ ohun tí ẹ ń ṣe níbẹ̀
  alternative: ẹni tí kì í ṣe ara ìpéjọpọ̀ náà
  rationale: Àyíká ọ̀rọ̀ dá lórí òye ohun tí a ń sọ àti ipa rẹ̀ lórí ẹni tí kò mọ̀ nípa ìṣe ìpéjọpọ̀. Ìtumọ̀ yìí kò fi tipátipá pinnu pé ẹni náà kì í ṣe ara ìjọ rárá; àṣàyàn “ẹni òde” wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa àtúnwí “gbogbo wọn” mọ́ gẹ́gẹ́ bí ìtẹnumọ́ inú orísun.
