  text: καὶ γὰρ ἐὰν ἄδηλον ⸂φωνὴν σάλπιγξ⸃ δῷ, τίς παρασκευάσεται εἰς πόλεμον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: yo
  text: Nítorí bí kàkàkí bá fúnni ní ìró tí kò ṣe kedere[a], ta ni yóò múra sílẹ̀ fún ogun?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìró tí a kò lè dá mọ̀ dáadáa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí
  rationale: Àpapọ̀ ọ̀rọ̀ náà ń fi àlàyé kún ohun tí ó ṣáájú; “Nítorí” jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ yìí ní Yorùbá.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀ fún gbólóhùn àídájú tí ἐὰν bẹ̀rẹ̀.
- source_word: ἄδηλον
  choice: tí kò ṣe kedere
  rationale: Ó túmọ̀ sí ohun tí kò mọ́, tí kò ṣe kedere, tàbí tí a kò lè dá mọ̀ dáadáa; ọ̀rọ̀ yìí bá àpẹẹrẹ àmì ìpè mu.
- source_word: φωνὴν
  choice: ìró
  rationale: Nínú àyíká ohun èlò orin, φωνή tọ́ka sí ìró tí ohun èlò náà ń mú jáde, kì í ṣe ohùn ènìyàn.
- source_word: σάλπιγξ
  choice: ìpè
  rationale: “Ìpè” ni ọ̀rọ̀ Yorùbá àdánidá fún kàkàkí tàbí ohun èlò tí a fi ń fun ni ní àmì, pàápàá jù lọ ní ọ̀rọ̀ ogun.
- source_word: δῷ
  choice: bá fun ni ní
  rationale: Èyí pa àwòrán gíríìkì ‘fúnni ní ìró’ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣeé lóye.
- source_word: τίς
  choice: ta ni
  rationale: Ìbéèrè àròsọ tààrà ni; “ta ni” ni ìtumọ̀ Yorùbá tó bá a mu.
- source_word: παρασκευάσεται
  choice: yóò múra sílẹ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ pé ẹni kan yóò mú ara rẹ̀ ṣe tán; “múra sílẹ̀” fi ìtumọ̀ alárinà náà hàn ní ti ẹ̀dá.
- source_word: εἰς πόλεμον
  choice: fún ogun
  rationale: Èyí tẹ̀lé ìtumọ̀ gíríìkì ní pẹkipẹki, ó sì jẹ́ èdè Yorùbá àdánidá nínú ọ̀rọ̀ ìmúrasílẹ̀.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ìpè” gẹ́gẹ́ bí ohun èlò àmì ogun, a sì pa ìbéèrè àròsọ àti àídájú inú gíríìkì mọ́.
