language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: yo
  text: Nítorí ẹni tí ń sọ̀rọ̀ ní èdè kan kì í sọ̀rọ̀ sí àwọn ènìyàn, ṣùgbọ́n sí Ọlọ́run; nítorí kò sí ẹni tí ó lóye.[a] Ṣùgbọ́n nínú ẹ̀mí ni ó ń sọ àwọn ohun ìjìnlẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò sí ẹni tí ó gbọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbọ́” tàbí, gẹ́gẹ́ bí àyíká ṣe fi hàn, “lóye.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú Ẹ̀mí” tàbí “nípasẹ̀ Ẹ̀mí.” Gbólóhùn Gíríìkì náà lè tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí ẹni tí ń sọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: ẹni tí ń sọ̀rọ̀
  rationale: Àpilẹ̀kọ pẹ̀lú participle ìsinsìnyí dúró gẹ́gẹ́ bí ọ̀rọ̀-orúkọ fún ẹnikẹ́ni tí ó bá ń ṣe iṣẹ́ náà; ìtumọ̀ yìí jẹ́ ti gbogbo ènìyàn, kò sì fi akọ tàbí abo kún un.
- source_word: γλώσσῃ
  choice: ní èdè àjèjì
  rationale: Ní àyíká orí yìí, γλῶσσα tọ́ka sí ọ̀rọ̀ sísọ ní èdè tí àwọn olùgbọ́ kò lóye. “Èdè àjèjì” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì yẹra fún “ahọ́n,” èyí tí ó sábà máa ń túmọ̀ sí ẹ̀yà ara ní Yorùbá.
- source_word: ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: θεῷ
  choice: Ọlọ́run
  rationale: Dative náà jẹ́ ẹni tí a ń bá sọ̀rọ̀; ìtumọ̀ tààrà yìí ṣe déédé.
- source_word: ἀκούει
  choice: lóye ohun tí ó ń sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ἀκούω lè túmọ̀ sí “gbọ́,” àyíká náà ń sọ nípa àìlóye ọ̀rọ̀. “Lóye” mú ìtumọ̀ inú àyíká jáde; a pa “gbọ́” mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- source_word: πνεύματι
  choice: nínú Ẹ̀mí
  rationale: Dative náà lè tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí ẹni tó ń sọ̀rọ̀. “Nínú Ẹ̀mí” jẹ́ ìtumọ̀ pàtàkì tó ṣeé gbà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: μυστήρια
  choice: àwọn ohun ìjìnlẹ̀
  rationale: Ọ̀rọ̀ yìí pa ìwúwo ìtumọ̀ μυστήρια mọ́ láì sọ ọ́ di “àṣírí” lásán tàbí ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: δὲ
  choice: dípò bẹ́ẹ̀
  rationale: Níhìn-ín δέ ń fi ìyàtọ̀ hàn láàárín àìbá ènìyàn sọ̀rọ̀ àti sísọ ohun ìjìnlẹ̀ nínú Ẹ̀mí.
theological_decisions:
- issue: Ohun tí πνεύματι ń tọ́ka sí
  choice: “nínú Ẹ̀mí” nínú ọ̀rọ̀ pàtàkì
  alternative: “nínú ẹ̀mí” tàbí “nípasẹ̀ Ẹ̀mí”
  rationale: Ìṣètò Gíríìkì kò pinnu bóyá Ẹ̀mí Mímọ́ ni tàbí ẹ̀mí ẹni tó ń sọ̀rọ̀. A yan ìtumọ̀ tó tọ́ka sí Ẹ̀mí Mímọ́ fún ọ̀rọ̀ pàtàkì, a sì fi àṣàyàn kejì sínú àlàyé kí a má bàa yanjú ìṣòro ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò yanjú.
translation_notes:
  register: Yorùbá àgbàṣe òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ohùn náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé lásán. “Èdè àjèjì” jẹ́ ọ̀rọ̀ tí a mọ̀ dáadáa nínú Yorùbá, bí ó tilẹ̀ jẹ́ pé γλῶσσα fúnra rẹ̀ túmọ̀ ní pàtó sí “ahọ́n/èdè”; a kò fi “èdè tí a kò mọ̀” sí i, nítorí Gíríìkì kò ní ọ̀rọ̀ “àìmọ̀.”
