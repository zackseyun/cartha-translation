revisions:
- from: Nítorí ẹni tí ń sọ̀rọ̀ ní èdè àjèjì kì í bá àwọn ènìyàn sọ̀rọ̀, bí kò ṣe Ọlọ́run, nítorí kò sí ẹni tí ó lóye ohun tí ó ń sọ;[a] dípò bẹ́ẹ̀, ó ń sọ àwọn ohun ìjìnlẹ̀ nínú Ẹ̀mí.[b]
  to: Nítorí ẹni tí ń sọ̀rọ̀ ní èdè kan kì í sọ̀rọ̀ sí àwọn ènìyàn, ṣùgbọ́n sí Ọlọ́run; nítorí kò sí ẹni tí ó lóye.[a] Ṣùgbọ́n nínú ẹ̀mí ni ó ń sọ àwọn ohun ìjìnlẹ̀.[b]
  rationale: A rọ́pò “ní èdè àjèjì” pẹ̀lú “ní èdè kan” láti má fi “àjèjì” kún γλώσσῃ. A tún ṣe ìtọ́kasí sí Ọlọ́run ní ọ̀nà dative tí ó hàn gbangba. Nítorí πνεύματι jẹ́ ọ̀rọ̀ tí a ń jiyàn ìtọ́kasí rẹ̀, a lo “nínú ẹ̀mí” ní kéékèèké nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìkà Ẹ̀mí Mímọ́ àti ìtumọ̀ instrumental nínú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:16:24Z'
review_pass:
  verdict: revise
  source_fidelity: Àtúnṣe náà yọ ìtumọ̀ àfikún “àjèjì” kúrò nínú γλώσσῃ, nítorí ọ̀rọ̀ Gíríìkì náà kò sọ pé èdè náà jẹ́ ti ilẹ̀ òkèèrè. Ó tún mú dative πνεύματι wà ní ìmọ̀lára àìpinnu rẹ̀, láì fi Ẹ̀mí Mímọ́ múlẹ̀ nínú ọ̀rọ̀ pàtàkì.
  naturalness: “Ní èdè kan” àti “kò sí ẹni tí ó lóye” jẹ́ Yorùbá òde òní tí ó hàn gbangba. “Sọ̀rọ̀ sí” fi ẹni tí a ń bá sọ̀rọ̀ hàn dáadáa, ó sì bá dative Gíríìkì mu.
  terminology: “Àwọn ohun ìjìnlẹ̀” yẹ fún μυστήρια. A kọ “ẹ̀mí” ní kéékèèké nínú ọ̀rọ̀ pàtàkì kí ìtumọ̀ náà má ṣe yan láàárín ẹ̀mí ẹni tó ń sọ̀rọ̀ àti Ẹ̀mí Mímọ́; àlàyé ìsàlẹ̀ fi àwọn ìṣààyàn náà hàn.
