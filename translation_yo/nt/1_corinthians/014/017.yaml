revisions:
- from: Nítorí ìwọ nítòótọ́ ń dúpẹ́ lọ́nà tí ó dára, ṣùgbọ́n ẹni kejì kò rí ìmúgbòòrò gbà.[a]
  to: Nítorí ìwọ lóòótọ́ ń dúpẹ́ dáadáa, ṣùgbọ́n a kò kọ́ ẹlòmíràn náà ró.[a]
  rationale: The revision replaces an expansion-oriented expression with an idiomatic passive that preserves the Greek building metaphor and its congregational-benefit sense. It also makes the referent of ὁ ἕτερος less ordinal and more natural. The footnote offers a readable Yoruba alternative while retaining the same sense.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:16:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the direct singular address, the explanatory-concessive force ('Nítorí ... nítòótọ́'), thanksgiving, and the adversative contrast. However, 'kò rí ìmúgbòòrò gbà' normally conveys receiving enlargement/expansion and does not adequately render οὐκ οἰκοδομεῖται, Paul's passive building-up metaphor.
  naturalness: ‘Nítorí ìwọ lóòótọ́ ń dúpẹ́ dáadáa’ is fluent Standard Yoruba. A generic passive with ‘a kò kọ́ ... ró’ is idiomatic and clearly communicates that the other attendee receives no strengthening.
  terminology: ‘Kọ́ ... ró’ retains the construction metaphor in οἰκοδομέω without forcing a denominational interpretation. ‘Ẹlòmíràn náà’ is preferable to ‘ẹni kejì’, which can suggest an ordinal ‘second person’ rather than the contextual other person.
  issues:
  - severity: medium
    issue: ‘kò rí ìmúgbòòrò gbà’ is used for οὐκ οἰκοδομεῖται.
    rationale: Ìmúgbòòrò chiefly denotes expansion, increase, or enlargement; it does not naturally convey the Pauline sense of being built up/strengthened. The current footnote has the more source-faithful wording, so the main text should use it instead.
  - severity: low
    issue: ‘ẹni kejì’ may be read as ‘the second person.’
    rationale: Although context can support ‘the other person,’ ‘ẹlòmíràn náà’ more directly expresses ὁ ἕτερος in contemporary Yoruba.
  revised_text: Nítorí ìwọ lóòótọ́ ń dúpẹ́ dáadáa, ṣùgbọ́n a kò kọ́ ẹlòmíràn náà ró.[a]
  revised_footnotes:
  - marker: a
    text: Tàbí, “a kò gbé ẹlòmíràn náà ró.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an expansion-oriented expression with an idiomatic passive that preserves the Greek building metaphor and its congregational-benefit sense. It also makes the referent of ὁ ἕτερος less ordinal and more natural. The footnote offers a readable Yoruba alternative while retaining the same sense.
