  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: yo
  text: Nítorí ìwọ lóòótọ́ ń dúpẹ́ dáadáa, ṣùgbọ́n a kò kọ́ ẹlòmíràn náà ró.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kò gbé ẹlòmíràn náà ró.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: ìwọ
  rationale: A pa arọ́pò-orúkọ ẹni kejì ẹyọ kan mọ́, ó sì jẹ́ kí àdírẹ́sì tààrà hàn kedere.
- source_word: μὲν γὰρ
  choice: Nítorí ìwọ nítòótọ́
  rationale: “Nítorí” fi ipa àlàyé γάρ hàn, “nítòótọ́” sì gba ìjẹ́wọ́ mén tí ó ń pèsè ọ̀nà fún ìyàtọ̀ pẹ̀lú ἀλλά.
- source_word: καλῶς
  choice: lọ́nà tí ó dára
  rationale: Ó túmọ̀ sí ṣíṣe ohun kan dáadáa tàbí lọ́nà yíyẹ; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: εὐχαριστεῖς
  choice: ń dúpẹ́
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ atọ́ka ìsinsìnyí, ó sì ń tọ́ka sí fífi ọpẹ́ fún Ọlọ́run nínú àpéjọ.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó pa ìtakora pàtàkì inú gbólóhùn náà mọ́.
- source_word: ὁ ἕτερος
  choice: ẹni kejì
  rationale: Ó ń tọ́ka sí ẹlòmíràn tí ó wà níbẹ̀ láìfi ipa tàbí ipò kan pàtó kún ọrọ̀ náà.
- source_word: οὐκ οἰκοδομεῖται
  choice: kò rí ìmúgbòòrò gbà
  rationale: Ó sọ ipa gbólóhùn afaraṣe náà ní Yorùbá àdánidá, nígbà tí akọsilẹ̀ ìsàlẹ̀ pa àwòrán ‘kíkó ró’ mọ́.
theological_decisions:
- issue: Àwòrán Páùlù nínú οἰκοδομέω nípa fífi agbára ẹ̀mí kún ẹlòmíràn nínú àpéjọ
  choice: kò rí ìmúgbòòrò gbà
  alternative: a kò kọ́ ọ ró
  rationale: Ọ̀rọ̀ àkọ́kọ́ jẹ́ kíkà tí ó ṣe kedere fún òǹkàwé Yorùbá òde òní, láìdín ìtumọ̀ rẹ̀ sí ẹ̀kọ́ ìsìn kan; akọsilẹ̀ sì pa àwòrán ìkọ́lé Gíríìkì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye; a lo àmì ohùn ní kíkún níbi tí ó bá bá èdè àdánidá mu.
