  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin arákùnrin mi[a], ẹ máa ní ìfẹ́kúfẹ̀ẹ́ láti sọ àsọtẹ́lẹ̀, ẹ má sì ṣe dá sísọ̀rọ̀ ní ahọ́n dúró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin mi”; Gíríìkì sọ pé “arákùnrin,” ó sì lè tọ́ka sí gbogbo ìjọ, lọ́kùnrin àti lóbìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Àsopọ̀ yìí ń fa àkótán tàbí ìyọrísí jáde láti inú àlàyé tó ṣáájú; ‘Nítorí náà’ jẹ́ ọ̀nà àdánidá láti pa agbára ìtumọ̀ náà mọ́ ní Yorùbá.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: Ọ̀rọ̀ ìpè náà jẹ́ ọ̀pọ̀ akọ, ó sì ní ‘mi.’ ‘Ẹ̀yin arákùnrin mi’ pa ìrísí orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń sọ pé ó lè kan gbogbo ìjọ, lọ́kùnrin àti lóbìnrin.
- source_word: ζηλοῦτε
  choice: ẹ máa fi ìtara fẹ́
  rationale: Àṣẹ ìsinsìnyí ń tọ́ka sí ìfẹ́ onítara tí ó yẹ kí ó máa bá a lọ; gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὸ προφητεύειν
  choice: láti sọ àsọtẹ́lẹ̀
  rationale: Ọ̀rọ̀-ìṣe aláṣẹ̀dá tí ó ní àfihàn orúkọ ni Gíríìkì; ‘láti sọ àsọtẹ́lẹ̀’ jẹ́ ìtumọ̀ Yorùbá tó mọ́gbọ́n dání fún iṣẹ́ pírọ́fítì tí àyíká ọ̀rọ̀ ń jíròrò.
- source_word: μὴ κωλύετε
  choice: ẹ má sì ṣe dá ... dúró
  rationale: Àṣẹ pẹ̀lú μή jẹ́ ìkìlọ̀ pé kí wọ́n má ṣe dènà iṣẹ́ náà; ‘má ṣe dá ... dúró’ fi ìdènà taara hàn ní Yorùbá òde òní.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: sísọ̀rọ̀ ní onírúurú ahọ́n
  rationale: Gbólóhùn náà tọ́ka sí ìṣe tí gbogbo orí 14 ń jíròrò. ‘Onírúurú ahọ́n’ pa ọ̀pọ̀ γλώσσαις mọ́, kò sì pinnu láìnídí bóyá àwọn ahọ́n náà jẹ́ èdè ènìyàn tàbí irú ọ̀rọ̀ míì.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί nínú ọ̀rọ̀ tí a kọ sí ìjọ tí ọkùnrin àti obìnrin wà
  choice: ẹ̀yin arákùnrin mi
  alternative: ẹ̀yin arákùnrin àti arábìnrin mi
  rationale: Gíríìkì jẹ́ ọ̀pọ̀ akọ ní gírámà, ṣùgbọ́n ó ṣeé ṣe kí ó dúró fún gbogbo ìjọ. Ọ̀rọ̀ pàtàkì pa ìrísí akọ orísun mọ́, àlàyé [a] sì ṣàlàyé agbára ìtumọ̀ àkópọ̀ náà.
- issue: Ìdánimọ̀ irú ‘ahọ́n’ tí a ń sọ
  choice: onírúurú ahọ́n
  alternative: onírúurú èdè
  rationale: γλώσσαις lè túmọ̀ sí ahọ́n tàbí èdè, àyíká 1 Kọ́ríńtì 14 sì ní ìjàmbá ìtumọ̀ tí kò yẹ kí a yanjú ní ìkọ̀kọ̀. ‘Ahọ́n’ pa ọ̀rọ̀ àpèjúwe àti ìjàmbá yẹn mọ́.
translation_notes:
  register: Yorùbá tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. ‘Ẹ máa fi ìtara fẹ́’ fi ìṣe tí ń bá a lọ hàn; ‘onírúurú ahọ́n’ sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé γλώσσαις lórí.
