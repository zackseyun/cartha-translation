  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì dáadáa: ὁ δὲ προφητεύων jẹ́ “Ṣùgbọ́n ẹni tí ó ń sọ àsọtẹ́lẹ̀”; ἀνθρώποις ni “àwọn ènìyàn”; λαλεῖ ni “ń bá ... sọ̀rọ̀”; àwọn ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta náà sì ń fi οἰκοδομή, παράκλησις, àti παραμυθία hàn ní ìtẹ̀lé tí ó yẹ. Ìlò “láti” láti ṣàlàyé ipa/èrè ọ̀rọ̀ náà bójú mu nínú Yorùbá, kò sì yí ìtumọ̀ ẹsẹ̀ náà padà.'
