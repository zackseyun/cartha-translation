  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó ń sọ àsọtẹ́lẹ̀ ń bá àwọn ènìyàn sọ̀rọ̀ láti gbé wọn ró, láti fún wọn ní ìṣírí, àti láti tù wọ́n nínú.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti mú kí wọ́n lágbára.”
    reason: lexical_alternative
  - marker: b
    text: “Ìṣírí” túmọ̀ παράκλησις; ó tún lè túmọ̀ sí “ìgbaninímọ̀ràn” tàbí, ní àwọn àyíká kan, “ìtùnú.”
    reason: lexical_alternative
  - marker: c
    text: “Láti tù wọ́n nínú” túmọ̀ παραμυθία; ó tún lè jẹ́ “láti fún wọn ní ìtùnú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Ṣùgbọ́n ẹni tí ó ń sọ àsọtẹ́lẹ̀
  rationale: Ẹni tí ó ń ṣe ohun kan ni participle náà ń tọ́ka sí; ‘ẹni tí ó ń sọ àsọtẹ́lẹ̀’ jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀rọ̀ náà mọ́ láì dín un kù sí ìwàásù tàbí àsọtẹ́lẹ̀ ohun ọjọ́ iwájú. ‘Ṣùgbọ́n’ fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ tí δέ ní sí ẹsẹ tó ṣáájú hàn.
- source_word: ἀνθρώποις
  choice: àwọn ènìyàn
  rationale: Dative plural náà tọ́ka sí àwọn tí a ń bá sọ̀rọ̀. Ọ̀rọ̀ náà kárí gbogbo ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: λαλεῖ
  choice: ń bá ... sọ̀rọ̀
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ń sọ̀rọ̀ sí àwọn olùgbọ́.
- source_word: οἰκοδομὴν
  choice: láti gbé wọn ró
  rationale: Ní lílò Pọ́ọ̀lù, ọ̀rọ̀ náà sábà ń ṣàpẹẹrẹ fífún ìgbàgbọ́ tàbí ìgbésí ayé ẹ̀mí ní okun. ‘Gbé wọn ró’ mú àwòrán kíkọ́ ènìyàn ró wá, ó sì yé àwọn òǹkàwé òde òní ju ọ̀rọ̀ àdáyébá bí ‘ìdàgbàsókè’ lọ.
- source_word: παράκλησιν
  choice: láti fún wọn ní ìṣírí
  rationale: παράκλησις lè túmọ̀ sí ìṣírí, ìgbani-nímọ̀ràn líle, tàbí ìtùnú. ‘Ìṣírí’ bá àyíká yìí mu, ó sì jẹ́ kí ọ̀rọ̀ náà yàtọ̀ sí παραμυθία tó tẹ̀ lé e.
- source_word: παραμυθίαν
  choice: láti tù wọ́n nínú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀rọ̀ tó ń tu ènìyàn lára tàbí tó ń bá ẹni tí ìbànújẹ́ bá sọ̀rọ̀ pẹ̀lẹ́. Ìtumọ̀ yìí pa ìyàtọ̀ rẹ̀ sí παράκλησις mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘sọ àsọtẹ́lẹ̀’ nínú ìjọ
  choice: Pa ‘sọ àsọtẹ́lẹ̀’ mọ́ láì sọ pé ìwàásù nìkan ni tàbí pé àsọtẹ́lẹ̀ ohun ọjọ́ iwájú nìkan ni.
  alternative: ‘wàásù’ tàbí ‘sọ ìfihàn kan’
  rationale: Ẹsẹ náà ṣàlàyé àsọtẹ́lẹ̀ nípa ipa tí ó ní lórí àwọn mìíràn, ṣùgbọ́n kò fún ọ̀rọ̀ náà ní ìtumọ̀ ẹ̀kọ́ ìsìn tóóró. Yíyan yìí pa fífẹ̀ àti ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo ìṣe-ọrọ̀ kíkún dípò àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò wọ́pọ̀, a sì fi gbogbo àmì ohùn síbi tí ó yẹ.
