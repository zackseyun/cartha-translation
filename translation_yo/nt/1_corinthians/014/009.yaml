revisions:
- from: 'Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú: bí ẹ kò bá fi ahọ́n sọ ọ̀rọ̀ tí ó ṣe kedere[a], báwo ni a ó ṣe mọ ohun tí ẹ ń sọ? Nítorí ẹ̀yin yóò kàn máa sọ̀rọ̀ sínú afẹ́fẹ́.'
  to: 'Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú: bí ẹ kò bá fi ahọ́n sọ ọ̀rọ̀ tí a lè dá mọ̀[a], báwo ni a ó ṣe lóye ohun tí a ń sọ? Nítorí ẹ ó máa sọ̀rọ̀ sínú afẹ́fẹ́.'
  rationale: Àtúnṣe náà yọ àfikún ‘kàn’ kúrò kí ìtumọ̀ má bàa ju ohun tí Gíríìkì sọ lọ, ó sì tún ẹsẹ̀ abẹ́lẹ̀ ṣe kí ‘iṣẹ́’ má bàa rọ́pò ‘ọ̀rọ̀’ ní àṣìṣe. ‘Lóye’ jẹ́ ìtumọ̀ àdánidá àti tó pé fún passive γνωσθήσεται nínú àyíká yìí.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:16:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti èrò ẹsẹ̀ Gíríìkì náà dáadáa: ìsọ̀rọ̀ nípasẹ̀ ahọ́n, ọ̀rọ̀ tí a lè mòye, ìbéèrè nípa bí a ṣe máa lóye ohun tí a sọ, àti àwòrán sísọ sínú afẹ́fẹ́. Síbẹ̀, ‘kàn máa’ ṣàfikún ìtumọ̀ ‘lásán/péré’ tí kò wà ní gbangba nínú ọrọ̀ Gíríìkì, nítorí náà a yọ ọ́ kúrò.'
  naturalness: ‘Fi ahọ́n sọ’ àti ‘sínú afẹ́fẹ́’ jẹ́ Yorùbá boṣewa tí ó mọ́gbọ́n dání. ‘A ó ṣe lóye’ sọ ìtumọ̀ γνωσθήσεται ní kedere nínú àyíká ìbánisọ̀rọ̀, láì fi olùgbọ́ kan pàtó sí i.
  terminology: '‘Ọ̀rọ̀ tí a lè dá mọ̀’ yẹ fún εὔσημον λόγον, nítorí ó mú ìtumọ̀ ọ̀rọ̀ tí a lè mọ̀, tí ó sì ṣeé lóye. A tún ṣàtúnṣe àlàyé ẹsẹ̀ abẹ́lẹ̀: ‘iṣẹ́’ jẹ́ aṣìṣe fún ‘message/ọ̀rọ̀’ àti pé kò yẹ níbẹ̀.'
  issues:
  - severity: medium
    issue: ‘kàn máa sọ̀rọ̀’
    rationale: ‘Kàn’ ń fi ìdíwọ̀n ‘merely/just’ kún gbólóhùn náà. Ọrọ̀ Gíríìkì ní ‘ẹ ó máa sọ̀rọ̀ sínú afẹ́fẹ́’ péré; àwòrán fúnra rẹ̀ ló ń fi asán ìsọ̀rọ̀ náà hàn.
  - severity: medium
    issue: Ẹsẹ̀ abẹ́lẹ̀ lo ‘iṣẹ́ tí ó ṣeé lóye’ gẹ́gẹ́ bí àṣàyàn fún εὔσημον λόγον
    rationale: ‘Iṣẹ́’ túmọ̀ sí iṣẹ́/work, kì í ṣe λόγος nínú àyíká yìí. Ó yẹ kí a lo ‘ọ̀rọ̀’ tàbí ‘ìfẹ̀ṣẹ̀fẹ̀ ọrọ̀’.
