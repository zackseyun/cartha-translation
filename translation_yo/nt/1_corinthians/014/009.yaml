id: 1CO.14.9
reference: 1 Corinthians 14:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: yo
  text: 'Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú: bí ẹ kò bá fi ahọ́n sọ ọ̀rọ̀ tí a lè dá mọ̀[a], báwo ni a ó ṣe lóye ohun tí a ń sọ? Nítorí ẹ ó máa sọ̀rọ̀ sínú afẹ́fẹ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ tí ó ṣe kedere” tàbí “ọ̀rọ̀ tí ó ṣeé lóye.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ọ̀rọ̀ tí a lè dá mọ̀, tí àwọn olùgbọ́ sì lè lóye.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú
  rationale: Ó so ọ̀rọ̀ yìí mọ́ àpẹẹrẹ tí ó ṣáájú, ó sì ń bá àwọn ará Kọ́ríńtì sọ̀rọ̀ ní tààrà.
- source_word: διὰ τῆς γλώσσης
  choice: fi ahọ́n sọ
  rationale: Ó pa àwòrán gidi ti ‘ahọ́n’ mọ́, nígbà tí ‘sọ’ mú kí ọ̀rọ̀ náà ṣe déédé ní Yorùbá.
- source_word: εὔσημον λόγον
  choice: ọ̀rọ̀ tí ó ṣe kedere
  rationale: εὔσημος túmọ̀ sí ohun tí ó ṣe kedere, tí a lè dá mọ̀, tí ó sì ṣeé lóye; yíyan yìí dá ìtẹnumọ́ lórí òye àwọn olùgbọ́ mọ́.
- source_word: δῶτε
  choice: sọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan δίδωμι ni ‘fún,’ ‘fi ahọ́n fúnni ní ọ̀rọ̀’ kò bá èdè Yorùbá mu; ‘sọ’ fi iṣẹ́ ìbánisọ̀rọ̀ inú àyíká náà hàn lọ́nà àdánidá.
- source_word: πῶς γνωσθήσεται
  choice: báwo ni a ó ṣe mọ
  rationale: Ó pa ìtumọ̀ passive tí kò dárúkọ olùṣe mọ́ pẹ̀lú ‘a,’ ó sì lè túmọ̀ sí dídá ohun tí a sọ mọ̀ tàbí lílóye rẹ̀ nínú àyíká.
- source_word: τὸ λαλούμενον
  choice: ohun tí ẹ ń sọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún participle tí a sọ di nọ́ńbà, ó sì mú ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Nítorí ẹ̀yin yóò kàn máa sọ̀rọ̀ sínú afẹ́fẹ́
  rationale: Ó pa àkàwé ọ̀rọ̀ tí kò dé ọ̀dọ̀ olùgbọ́ mọ́; ‘kàn máa’ fi asán tàbí àìní èso ọ̀rọ̀ náà hàn láì yí àwòrán ‘sínú afẹ́fẹ́’ padà.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán ‘ahọ́n’ àti ‘sínú afẹ́fẹ́’ mọ́, ṣùgbọ́n a lo gbólóhùn àdánidá ‘fi ahọ́n sọ’ dípò fífi ìtumọ̀ gangan tí kò rọrùn sí Yorùbá múlẹ̀.
