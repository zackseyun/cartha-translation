  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: yo
  text: Àwọn ẹ̀mí àwọn wòlíì sì ń tẹríba fún àwọn wòlíì,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀mí tí ó jẹ́ ti àwọn wòlíì ń tẹríba fún àwọn wòlíì.” Gbólóhùn náà lè tọ́ka sí ẹ̀mí àsọtẹ́lẹ̀ tàbí iṣẹ́ ẹ̀mí tó ní í ṣe pẹ̀lú àwọn wòlíì, ó sì tẹnu mọ́ ìkóra-ẹni-níjàánu nígbà àsọtẹ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Àti pé
  rationale: Ó so gbólóhùn yìí mọ́ ìjíròrò tó ṣáájú gẹ́gẹ́ bí ẹ̀rí àfikún; ‘Àti pé’ bá ìṣàn èdè Yorùbá mu.
- source_word: πνεύματα
  choice: àwọn ẹ̀mí
  rationale: Èyí pa ọ̀rọ̀ púpọ̀ ‘ẹ̀mí’ mọ́, kò sì túmọ̀ rẹ̀ ní pàtó sí ọ̀rọ̀ àsọtẹ́lẹ̀ tàbí ẹ̀bùn, nítorí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní ààyè fún ìtumọ̀.
- source_word: προφητῶν
  choice: àwọn wòlíì
  rationale: Ìsọ̀rí oní-ìní náà hàn nínú ‘àwọn ẹ̀mí àwọn wòlíì,’ èyí tó sún mọ́ ọ̀rọ̀ ìpilẹ̀.
- source_word: προφήταις
  choice: fún àwọn wòlíì
  rationale: Pẹ̀lú ‘ń tẹríba,’ ‘fún’ fi ẹni tí a tẹríba fún hàn, ó sì pa ìtumọ̀ dátífù ìtẹríba mọ́.
- source_word: ὑποτάσσεται
  choice: ń tẹríba
  rationale: Ó sọ ìwà wíwà lábẹ́ àṣẹ tàbí ìdarí ní èdè Yorùbá àdánidá. Bí ó tilẹ̀ jẹ́ pé fáàbù Gíríìkì wà ní ẹyọ kan pẹ̀lú kókó ọ̀rọ̀ aláìní-abo púpọ̀, Yorùbá kò nílò kí a fi ìyàtọ̀ nọ́ńbà sí fáàbù.
theological_decisions:
- issue: Ìtumọ̀ ‘àwọn ẹ̀mí àwọn wòlíì’ nípa ìkóra-ẹni-níjàánu nínú àsọtẹ́lẹ̀
  choice: Ọ̀rọ̀ pàtàkì náà dúró ní ṣókí pé àwọn ẹ̀mí àwọn wòlíì ń tẹríba fún àwọn wòlíì.
  alternative: A lè ṣàlàyé rẹ̀ ní pàtó gẹ́gẹ́ bí ìmí àsọtẹ́lẹ̀ tàbí iṣẹ́ ẹ̀mí tó ní í ṣe pẹ̀lú àwọn wòlíì; àwọn mìíràn sì lè ka a sí ẹ̀mí ènìyàn àwọn wòlíì tó ń tẹríba fún àwọn wòlíì mìíràn.
  rationale: Àyíká 1 Kọ́ríńtì 14:29–33 tẹnu mọ́ ètò àti ojúṣe ẹni tó ń sọ àsọtẹ́lẹ̀, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò yan ìtumọ̀ kan ṣoṣo láìsí àní-àní. Ìtumọ̀ náà kò yẹ kí ó yanjú àní-àní yìí ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. ‘Wòlíì’ jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn mọ̀ fún προφήτης; ‘ń tẹríba fún’ ṣe àfihàn ìtẹríba tàbí wíwà lábẹ́ ìdarí láìfi ẹ̀kọ́ ìjọ kan kún un.
