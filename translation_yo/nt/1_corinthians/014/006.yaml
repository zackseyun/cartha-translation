id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí, ẹ̀yin ará[a], bí mo bá wá sọ́dọ̀ yín, tí mo sì ń sọ̀rọ̀ ní ahọ́n[b], àǹfààní wo ni mo máa mú wá fún yín, bí n kò bá sọ̀rọ̀ fún yín nípasẹ̀ ìṣípayá, tàbí nípasẹ̀ ìmọ̀, tàbí nípasẹ̀ àsọtẹ́lẹ̀, tàbí nípasẹ̀ ẹ̀kọ́?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin”; ọ̀rọ̀ Gíríìkì náà jẹ́ “arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀rọ̀ ìkíni sí ìjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àwọn èdè”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn èdè,” ṣùgbọ́n níbí ó ń tọ́ka sí ìṣẹ̀lẹ̀ tí a ń jíròrò jákèjádò 1 Kọ́ríńtì 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Ǹjẹ́ nísinsin yìí
  rationale: Ó ṣàmì sí yíyí padà sí kókó tí Pọ́ọ̀lù fẹ́ fi síwájú nísinsin yìí, láì fi ìtakora tó lágbára kún ọ̀rọ̀ náà.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún pípè àwọn ọmọ ìjọ ní Yorùbá; ó lè kan àwùjọ ọkùnrin àti obìnrin, bí ìlò Gíríìkì níbí ṣe lè rí.
- source_word: γλώσσαις λαλῶν
  choice: ń sọ̀rọ̀ ní ahọ́n
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì tọ́ka sí ìṣẹ̀lẹ̀ ẹ̀mí tí a ń jíròrò ní 1 Kọ́ríńtì 12–14, láì pinnu irú rẹ̀ ní kíkún.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: àǹfààní wo ni èmi yóò ṣe fún yín
  rationale: Ó sọ ìbéèrè ní Yorùbá àdánidá, ó sì pa ìtẹnumọ́ Pọ́ọ̀lù mọ́ lórí ohun tí yóò ṣe ìjọ ní rere.
- source_word: ἐὰν μὴ
  choice: bí n kò bá
  rationale: Èyí ni ìtumọ̀ àdánidá fún àídájú òdì tí ó túmọ̀ sí “unless” nínú ìgbékalẹ̀ yìí.
- source_word: ἐν ἀποκαλύψει / γνώσει / προφητείᾳ / διδαχῇ
  choice: nípasẹ̀ ìṣípayá / ìmọ̀ / àsọtẹ́lẹ̀ / ẹ̀kọ́
  rationale: “Nípasẹ̀” mú iṣẹ́ ἐν gẹ́gẹ́ bí ọ̀nà tàbí irinṣẹ́ ọ̀rọ̀ jáde, ó sì pa ìbáramu àwọn ohun mẹ́rin nínú àtòjọ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί gẹ́gẹ́ bí ọ̀rọ̀ ìkíni sí ìjọ
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ará” kò fi abo tàbí akọ hàn ní Yorùbá, ó sì lè gba gbogbo ìjọ tí Pọ́ọ̀lù ń bá sọ láì fi ọ̀rọ̀ tí kò sí ní Gíríìkì kún un.
- issue: Ìtumọ̀ γλώσσαις nínú orí 12–14
  choice: ní ahọ́n
  alternative: ní àwọn èdè
  rationale: “Ahọ́n” pa ọ̀rọ̀ àti ìṣẹ̀lẹ̀ tí àyíká náà ń jíròrò mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ “àwọn èdè” hàn gẹ́gẹ́ bí ohun tí ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí; a kò pinnu ariyanjiyan nípa ìwà ìṣẹ̀lẹ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti ìjọsìn, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní. Ìtẹ̀síwájú àtòjọ mẹ́rin ni a pa mọ́ pẹ̀lú “nípasẹ̀” léraléra.
