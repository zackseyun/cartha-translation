  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: yo
  text: Àbí ọ̀dọ̀ yín ni ọ̀rọ̀ Ọlọ́run ti jáde wá[a]? Àbí ẹ̀yin nìkan ni ọ̀rọ̀ Ọlọ́run ti dé ọ̀dọ̀ yín[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ọ̀dọ̀ yín ni ọ̀rọ̀ Ọlọ́run ti ní ìpilẹ̀ rẹ̀?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Àbí ọ̀dọ̀ yín nìkan ni ọ̀rọ̀ Ọlọ́run dé?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó pa ìtumọ̀ àsàyàn inú ìbéèrè mọ́, ó sì bá ọ̀nà tí Yorùbá fi ń béèrè ìbéèrè àtakò mu.
- source_word: ἀφ’ ὑμῶν
  choice: ọ̀dọ̀ yín ni ... ti
  rationale: Èyí fi orísun tàbí ibi ìpilẹ̀ hàn ní ti ẹ̀dá, gẹ́gẹ́ bí ἀπό pẹ̀lú genitive ṣe túmọ̀ sí.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa gbólóhùn Pọ́ọ̀lù mọ́ láì dín ìtumọ̀ rẹ̀ kù sí ìhìnrere tàbí àsọtẹ́lẹ̀ nìkan.
- source_word: ἐξῆλθεν
  choice: jáde wá
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì ἐξέρχομαι mọ́, nígbà tí ó tún jẹ́ Yorùbá àdánidá fún ohun tí ó ti ibi kan jáde.
- source_word: εἰς ὑμᾶς μόνους
  choice: ẹ̀yin nìkan ... ọ̀dọ̀ yín
  rationale: Ó tẹnumọ́ ìyasọ́tọ̀ tí μόνους ní, pé kì í ṣe àwọn ará Kọ́ríńtì nìkan ni olùgbà ọ̀rọ̀ náà.
- source_word: κατήντησεν
  choice: dé ọ̀dọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ‘dé’ tàbí ‘wọ ibi kan,’ ó sì pa ìtumọ̀ ìbọ̀wọ̀lé mọ́.
theological_decisions:
- issue: Ohun tí ‘ọ̀rọ̀ Ọlọ́run’ ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘ọ̀rọ̀ Ọlọ́run’ láì sọ ọ́ di ohun kan pàtó.
  alternative: ‘ìhìnrere’ ní pàtó, tàbí ‘ọ̀rọ̀ àsọtẹ́lẹ̀’ nínú ìjọsìn
  rationale: Nínú àyíká ọ̀rọ̀ náà, Pọ́ọ̀lù ń bá ìgbéraga àwọn ará Kọ́ríńtì wí; gbólóhùn Gíríìkì náà gbòòrò, nítorí náà ìtumọ̀ náà kò yanju ohun tí orísun fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: Yorùbá àgbàlágba tí ó bójú mu, tí ó ṣe kedere fún òǹkàwé òde òní. Àwọn ìbéèrè méjèèjì pa ohùn ìbáwí àtakò Pọ́ọ̀lù mọ́. A lo ‘yín/ẹ̀yin’ fún plural, a sì fi àmì ohùn síbi tí ó yẹ.
