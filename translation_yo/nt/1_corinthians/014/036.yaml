  source_fidelity: Ìbéèrè àkọ́kọ́ túmọ̀ ἀφ’ ὑμῶν ... ἐξῆλθεν dáadáa gẹ́gẹ́ bí ìbéèrè àtakò nípa orísun ọ̀rọ̀ Ọlọ́run. Ṣùgbọ́n nínú ìbéèrè kejì, ‘wọ́n’ yí olùtọ́ka ὑμᾶς (‘yín’) padà sí ẹni-kẹta, tí ó sì tako Gíríìkì náà. Ìtumọ̀ àtúnṣe náà pa ìtumọ̀ ‘dé sí yín nìkan’ mọ́.
  naturalness: ‘Àbí ọ̀dọ̀ yín ni ... ti jáde wá?’ jẹ́ Yorùbá mímọ́ tí ó ní agbára ìbéèrè ìbáwí. ‘Ẹ̀yin nìkan ni ọ̀rọ̀ Ọlọ́run ti dé ọ̀dọ̀ yín?’ jẹ́ kedere, bí ó tilẹ̀ jẹ́ pé ‘yín’ tún farahàn lẹ́yìn ìtẹnumọ́ ‘ẹ̀yin nìkan’; ìtúnsọ náà ń jẹ́ kí ìbáṣepọ̀ ‘dé ọ̀dọ̀’ hàn gbangba.
  terminology: ‘Ọ̀rọ̀ Ọlọ́run’ bá ὁ λόγος τοῦ θεοῦ mu, ó sì yẹ kí a má dín un kù sí ìhìnrere tàbí àsọtẹ́lẹ̀ nìkan. ‘Jáde wá’ àti ‘dé ọ̀dọ̀’ pa ìṣípo àti ìdéde àwọn ọ̀rọ̀-ìse Gíríìkì mọ́.
