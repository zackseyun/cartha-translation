id: 1CO.14.11
reference: 1 Corinthians 14:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: yo
  text: Nítorí náà, bí èmi kò bá mọ ìtumọ̀ ohùn náà[a], èmi yóò jẹ́ àjèjì sí ẹni tí ń sọ̀rọ̀[b], ẹni tí ń sọ̀rọ̀ náà yóò sì jẹ́ àjèjì sí mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “agbára ohùn náà”; ìyẹn ni pé, ìtumọ̀ tàbí èrò tí ohùn náà ń gbé jáde.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ni “báríbárí”; níhìn-ín ó túmọ̀ sí ẹni tí ọ̀rọ̀ rẹ̀ jẹ́ ti òkèèrè tàbí tí kò ṣeé lóye, kì í ṣe dandan pé ẹni aláìlàjú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Nítorí náà, bí
  rationale: Ó pa ìtumọ̀ ìyọrísí οὖν àti ipò àídájú ἐὰν mọ́ ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: μὴ εἰδῶ
  choice: èmi kò bá mọ
  rationale: “Mọ̀” tẹ̀ lé ìtumọ̀ pàtàkì οἶδα, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí ó tún ní èrò òye ohun tí a sọ.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: ìtumọ̀ ohùn náà
  rationale: Ní àkópọ̀ ọ̀rọ̀ yìí, δύναμις tọ́ka sí agbára ìtumọ̀ tàbí ohun tí ohùn ń sọ; “ìtumọ̀ ohùn” jẹ́ kedere láì sọ φωνή di “èdè” ní pàtó.
- source_word: ἔσομαι
  choice: èmi yóò jẹ́
  rationale: Ó fi ọjọ́ iwájú ọ̀rọ̀-ìṣe náà hàn ní Yorùbá déédéé.
- source_word: τῷ λαλοῦντι
  choice: sí ẹni tí ń sọ̀rọ̀
  rationale: Ó pa ìṣe alábàápín náà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: βάρβαρος
  choice: àjèjì
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ẹni tí ọ̀rọ̀ rẹ̀ jẹ́ ti òkèèrè tàbí tí kò yé ẹnì kejì, kì í ṣe dandan pé ẹni aláìlàjú.
- source_word: ἐν ἐμοὶ
  choice: sí mi
  rationale: Ó sọ ìbáṣepọ̀ tí gbolohun Gíríìkì ń fi hàn ní ọ̀nà Yorùbá tí ó ṣe déédéé.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé gbogbogbò. A lo “àjèjì sí” láti pa ìfarahàn ìbáṣepọ̀ méjèèjì mọ́, a sì fi “ohùn” sílẹ̀ kí a má bàa dín φωνή kù sí “èdè” nìkan.
