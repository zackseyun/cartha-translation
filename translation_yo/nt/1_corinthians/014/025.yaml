id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: yo
  text: Àwọn ohun ìkọ̀kọ̀ inú ọkàn rẹ̀ yóò fara hàn; bẹ́ẹ̀ sì ni yóò dojúbolẹ̀, yóò sì jọ́sìn Ọlọ́run, bí ó ti ń kéde pé, “Lóòótọ́, Ọlọ́run wà láàárín yín.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “nínú yín.”'
    reason: Àṣàyàn ìtumọ̀ fún ἐν ὑμῖν; nínú àyíká ìjọ tí ó péjọ, “láàárín yín” ni a yàn, ṣùgbọ́n “nínú yín” tún ṣeé ṣe.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: àwọn ohun ìkọ̀kọ̀
  rationale: Ó túmọ̀ sí àwọn ohun tí ó farapamọ́ nínú ẹni náà; ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ọ̀pọ̀ mọ́.
- source_word: τῆς καρδίας αὐτοῦ
  choice: inú ọkàn rẹ̀
  rationale: “Ọkàn” pa àwòrán Bíbélì mọ́ gẹ́gẹ́ bí ibùdó èrò àti ìfẹ́ inú; fífi “inú” kún un jẹ́ àdánidá fún àyíká ọ̀rọ̀ yìí.
- source_word: φανερὰ γίνεται
  choice: di mímọ̀
  rationale: Ó fi ìyípadà sí ipò tí ohun náà ti hàn gbangba hàn, gẹ́gẹ́ bí γίνεται ṣe ń tọ́ka sí; ó sì rọrùn fún òǹkàwé Yorùbá òde òní.
- source_word: καὶ οὕτως
  choice: nígbà náà
  rationale: Ó so bí àwọn ohun inú ọkàn ṣe di mímọ̀ pọ̀ mọ́ ìhùwàsí tí ó tẹ̀ lé e, pẹ̀lú agbára àbájáde.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: yóò dojúbolẹ̀
  rationale: “Dojúbolẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ojú kan ilẹ̀ ní ìrẹ̀lẹ̀; ó pa ìfarahàn ara àti ìjọsìn mọ́.
- source_word: προσκυνήσει τῷ θεῷ
  choice: yóò sin Ọlọ́run
  rationale: Nínú àyíká yìí, προσκυνέω jẹ́ ìjọsìn sí Ọlọ́run; “sin Ọlọ́run” jẹ́ àfihàn Yorùbá tí ó ṣe kedere, nígbà tí “dojúbolẹ̀” ti fi ìṣe ara hàn.
- source_word: ἀπαγγέλλων
  choice: yóò sì kéde
  rationale: Ó fi ìjẹ́wọ́ tí ẹni náà ń sọ ní gbangba hàn láìfi agbára ìwàásù tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: Ὄντως
  choice: Lóòótọ́
  rationale: Ó pa ìtẹnumọ́ pé ìpinnu náà jẹ́ òtítọ́ àti dájú mọ́ ní Yorùbá àdánidá.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Àyíká ọ̀rọ̀ náà jẹ́ ti ìjọ tí ó péjọ, nítorí náà “láàárín yín” fi wíwà Ọlọ́run ní àárín àwùjọ náà hàn; ìtumọ̀ “nínú yín” ṣì ṣeé ṣe.
theological_decisions:
- issue: Ìtumọ̀ ἐν ὑμῖν nínú ìjẹ́wọ́ ìparí
  choice: láàárín yín
  alternative: nínú yín
  rationale: Ọ̀rọ̀ tó yí i ká ń sọ nípa ìjọ tí ó péjọ àti bí àlejò ṣe mọ̀ pé Ọlọ́run wà ní àárín wọn nípasẹ̀ iṣẹ́ àsọtẹ́lẹ̀. Síbẹ̀, ἐν lè túmọ̀ sí “nínú,” nítorí náà a pa ìtumọ̀ yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá; èdè náà jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A yan “dojúbolẹ̀” dípò gbolohun gígùn, a sì lo “sin Ọlọ́run” fún ìjọsìn. Àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí ó kan.
