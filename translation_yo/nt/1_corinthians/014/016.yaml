id: 1CO.14.16
reference: 1 Corinthians 14:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: yo
  text: Bí kò bá rí bẹ́ẹ̀, bí ìwọ bá ń súre nínú ẹ̀mí[b], báwo ni ẹni tí ó wà ní ipò ẹni tí kò ní ìmọ̀ pàtó[a] yóò ṣe sọ “Àmín” sí ìdúpẹ́ rẹ[c], níwọ̀n bí kò mọ ohun tí o ń sọ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí ‘ẹni tó wà níta,’ ‘ẹni lásán,’ tàbí ‘ẹni tí kò kẹ́kọ̀ọ́.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí ‘pẹ̀lú ẹ̀mí’; Gíríìkì kò fi dandan sọ ìtumọ̀ pàtó ju èyí lọ níbí.
    reason: alternative_reading
  - marker: c
    text: ‘Ìdúpẹ́’ níbí túmọ̀ sí fífi ọpẹ́ hàn; kì í ṣe dandan orúkọ ìlànà ìsìn tí ó wá di ‘Eukaristi’ ní ìlò Kristẹni ìgbà tó wá lẹ́yìn.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Bí kò bá rí bẹ́ẹ̀, bí
  rationale: Ó so àpẹẹrẹ oní şart mọ́ àríyànjiyàn tó ṣáájú, ó sì mú ìtumọ̀ ‘otherwise, if’ jáde ní Yorùbá àdánidá.
- source_word: εὐλογῇς
  choice: ń súre
  rationale: ‘Súre’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún sísọ ìbùkún ní gbangba, ó sì bá iṣẹ́ ìjọsìn inú àyíká yìí mu.
- source_word: πνεύματι
  choice: nínú ẹ̀mí
  rationale: Ó pa ìtumọ̀ dative náà mọ́ láì pinnu bóyá ẹ̀mí ẹni tó ń sọ̀rọ̀ ni tàbí ọ̀rọ̀ tí Ẹ̀mí mú kó sọ.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: ẹni tí ó wà ní ipò aláìkọ́ni
  rationale: Gbólóhùn yìí sọ ní Yorùbá àdánidá pé ẹni náà ló wà ní ipò ẹni tí kò ní ìmọ̀ tàbí ìdánilẹ́kọ̀ọ́ pàtó, láì sọ ọ́ di ẹni tí a yọ síta.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: báwo ni ... yóò ṣe sọ “Àmín”
  rationale: Ó pa ìbéèrè Gíríìkì àti ọ̀rọ̀ ìfọwọ́sí ìjọ ‘Àmín’ mọ́.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: sí ọ̀rọ̀ ìdúpẹ́ rẹ
  rationale: ‘Sí’ fi hàn pé ‘Àmín’ jẹ́ ìdáhùn sí ọ̀rọ̀ ìdúpẹ́; ‘ọ̀rọ̀ ìdúpẹ́’ mú kí ó ṣe kedere pé fífi ọpẹ́ hàn ni, kì í ṣe dandan orúkọ àṣà ìsìn kan.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: níwọ̀n bí kò ti mọ ohun tí o ń sọ
  rationale: Ìtumọ̀ tààrà ni fún ìdí tí ẹni náà kò fi lè dáhùn ‘Àmín,’ ó sì pa ‘mọ̀’ ti οἶδεν mọ́.
theological_decisions:
- issue: Ìtumọ̀ πνεύματι nínú ìjọsìn
  choice: nínú ẹ̀mí
  alternative: pẹ̀lú ẹ̀mí; nípasẹ̀ Ẹ̀mí
  rationale: Ẹsẹ̀ náà kò fi dandan yan láàárín ẹ̀mí olùsọ̀rọ̀ àti ọ̀rọ̀ tí Ẹ̀mí Ọlọ́run mú wá; ìtumọ̀ yìí pa àìdánilójú náà mọ́.
- issue: Ìtumọ̀ εὐχαριστίᾳ
  choice: ọ̀rọ̀ ìdúpẹ́
  alternative: Eukaristi
  rationale: Àyíká ẹsẹ̀ náà ń sọ̀rọ̀ nípa fífi ọpẹ́ hàn ní ọ̀rọ̀ tí ìjọ lè lóye; lílo orúkọ ìlànà sakiramenti kan yóò fi ìtumọ̀ ìgbà tó késí sí ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba nínú ìjọ; a pa ‘Àmín’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ ìfọwọ́sí tí gbogbo ènìyàn mọ̀.
