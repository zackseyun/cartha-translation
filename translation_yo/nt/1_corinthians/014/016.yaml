  to: Bí kò bá rí bẹ́ẹ̀, bí ìwọ bá ń súre nínú ẹ̀mí[b], báwo ni ẹni tí ó wà ní ipò ẹni tí kò ní ìmọ̀ pàtó[a] yóò ṣe sọ “Àmín” sí ìdúpẹ́ rẹ[c], níwọ̀n bí kò mọ ohun tí o ń sọ?
  rationale: Àtúnṣe náà rọ́pò ‘aláìkọ́ni’ pẹ̀lú ‘ẹni tí kò ní ìmọ̀ pàtó,’ láti jẹ́ kí τοῦ ἰδιώτου hàn gẹ́gẹ́ bí ẹni tí kò ní ìmọ̀ tàbí agbára láti lóye ọ̀rọ̀ náà, láì pinnu pé alejo ni tàbí ẹni tí a yọ síta. A tún mú àwọn àlàyé ìsàlẹ̀ rọrùn, kedere, àti ìbámu wọn pẹ̀lú ọ̀rọ̀ orísun.
  reviewer_model: gpt-5.6-terra
