    issue: ‘aláìkọ́ni’ fún τοῦ ἰδιώτου
    rationale: Ọ̀rọ̀ náà kò ní ìbámu tó dájú pẹ̀lú ‘ẹni tí kò ní ìmọ̀ pàtó,’ ‘ẹni tí kò lóye,’ tàbí ‘ẹni lásán’; ó tún lè dà bí ẹni tí a kò gba iṣẹ́ kọ́ni. Àyíká ẹsẹ̀ náà ń tẹnumọ́ ẹni tí kò lóye ọ̀rọ̀ tí a sọ.
  - severity: low
    issue: 'Àlàyé ìsàlẹ̀ a: ‘ẹni tí kò mọ̀ nípa rẹ̀’'
    rationale: ‘rẹ̀’ lè tọ́ka sí ohun mìíràn, kì í sì jẹ́ àfidípò Yorùbá kedere fún ‘outsider/ordinary person/unlearned.’
  - severity: low
    issue: Ọ̀rọ̀ ‘nígbà tó késí’ nínú àlàyé ìsàlẹ̀ c
    rationale: Kò rọrùn gẹ́gẹ́ bí Yorùbá boṣewa níbí; ‘ní ìlò Kristẹni ìgbà tó wá lẹ́yìn’ ṣàlàyé èrò náà kedere.
