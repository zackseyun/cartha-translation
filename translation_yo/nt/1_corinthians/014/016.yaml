review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì ní pàtàkì: ó pa ipò àdéhùn ‘otherwise, if,’ ìbùkún nínú ẹ̀mí, ìdáhùn ‘Àmín,’ àti àìmọ̀ ohun tí a ń sọ mọ́. Ṣùgbọ́n ‘aláìkọ́ni’ kì í ṣàfihàn τοῦ ἰδιώτου dáadáa nínú àyíká yìí, ó sì jẹ́ ọ̀rọ̀ tí kò rọrùn nínú gbólóhùn náà.'
  naturalness: ‘Ẹni tí ó wà ní ipò aláìkọ́ni’ kò dùn ní Yorùbá boṣewa, nítorí ‘aláìkọ́ni’ lè túmọ̀ sí ẹni tí a kò kọ́, tàbí ẹni tí kò fẹ́ kọ́, dípò ẹni tí kò ní ìmọ̀ pàtó/ti kò lóye. ‘Ẹni tí ó wà ní ipò ẹni tí kò ní ìmọ̀’ jẹ́ kedere síi, ó sì pa àwòrán Gíríìkì náà mọ́.
  terminology: ‘Súre nínú ẹ̀mí,’ ‘Àmín,’ àti ‘ìdúpẹ́’ yẹ fún àyíká ìjọsìn, wọ́n sì yẹra fún fífi εὐχαριστία di orúkọ sakiramenti. Àwọn àlàyé ìsàlẹ̀ gbọdọ̀ ṣàtúnṣe ìtumọ̀ àfidípò fún ἰδιώτης, kí ‘ẹni tí kò mọ̀ nípa rẹ̀’ má bàa yí ìtọ́kasí ọrọ̀ náà padà.
  issues:
