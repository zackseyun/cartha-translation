id: 1CO.14.7
reference: 1 Corinthians 14:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: yo
  text: Àní àwọn ohun tí kò ní ẹ̀mí tí ń mú ohùn jáde—ìbáà ṣe fèrè tàbí ohun èlò olókùn[a]—bí wọn kò bá fi ìyàtọ̀ hàn nínú àwọn ìró náà, báwo ni a ó ṣe mọ ohun tí a ń ṣe lórí fèrè tàbí ohun èlò olókùn náà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì κιθάρα ń tọ́ka sí ohun èlò olókùn ìgbàanì, tí ó sún mọ́ ohun tí a ń pè ní “lyre” ju ohun èlò òde òní kan lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Àní
  rationale: Ó mú àpẹẹrẹ náà wọlé pẹ̀lú ìtẹnumọ́ pé kódà àwọn ohun aláìlẹ́mìí náà ń fi ẹ̀kọ́ yìí hàn.
- source_word: τὰ ἄψυχα
  choice: àwọn ohun tí kò ní ẹ̀mí
  rationale: Gbólóhùn yìí ṣe kedere fún òǹkàwé Yorùbá, ó sì pa ìyàtọ̀ láàárín ohun alààyè àti ohun tí kò ní ẹ̀mí mọ́.
- source_word: φωνὴν διδόντα
  choice: tí ń mú ohùn jáde
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun èlò kan ń dá ohùn sílẹ̀.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: ìbáà ṣe fèrè tàbí dùùrù
  rationale: “Fèrè” jẹ́ ohun èlò afẹ́fẹ́ tí ó ṣeé lóye, “dùùrù” sì jẹ́ ohun èlò olókùn tí ó wọ́pọ̀ nínú èdè Yorùbá; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ pàtó ti κιθάρα.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: bí wọn kò bá mú kí àwọn ìró náà yàtọ̀ sí ara wọn
  rationale: Ó fi ìyàtọ̀ tó yẹ kí ó wà láàárín àwọn ìró orin hàn ní ọ̀nà tí ó ṣeé lóye, láìfi èrò mìíràn kún un.
- source_word: πῶς γνωσθήσεται
  choice: báwo ni a ó ṣe mọ
  rationale: 'Ó pa ìtumọ̀ ọ̀rọ̀ ìṣe aláìṣe náà mọ́ ní Yorùbá àdánidá: bí a ṣe lè dá ohun orin náà mọ̀.'
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: ohun tí a ń fi fèrè tàbí dùùrù kọrin
  rationale: Àwọn participle náà ń tọ́ka sí ohun orin tí a ń ṣe lórí ọ̀kọ̀ọ̀kan ohun èlò; “kọrin” níbí túmọ̀ sí ṣíṣe orin pẹ̀lú ohun èlò, kì í ṣe ohùn ènìyàn nìkan.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìtumọ̀ náà tẹ̀ lé àwòrán orin inú Gíríìkì, ó sì jẹ́ kí ìbéèrè àsọyé Pọ́ọ̀lù ṣe kedere fún òǹkàwé òde òní.
