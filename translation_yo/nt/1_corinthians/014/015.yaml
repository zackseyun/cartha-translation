id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: yo
  text: Kí ni a ó ha ṣe nígbà náà? Èmi yóò fi ẹ̀mí gbàdúrà[a], ṣùgbọ́n èmi yóò pẹ̀lú fi èrò inú gbàdúrà[b]; èmi yóò fi ẹ̀mí kọrin ìyìn[c], ṣùgbọ́n èmi yóò pẹ̀lú fi èrò inú kọrin ìyìn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú ẹ̀mí” tàbí “nípasẹ̀ ẹ̀mí.” Gíríìkì kò sọ ní pàtó bóyá “ẹ̀mí” túmọ̀ sí Ẹ̀mí Mímọ́, ẹ̀mí ẹni tó ń sọ̀rọ̀, tàbí ọ̀rọ̀ tí ẹ̀mí mú jáde.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “pẹ̀lú òye.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “kọrin” tàbí “ṣe orin aládùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Kí ni a ó ha ṣe nígbà náà?
  rationale: Ọ̀rọ̀ yìí béèrè fún ìpinnu tó yẹ kí ó tẹ̀ lé àlàyé Pọ́ọ̀lù. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì mú ipa ìbéèrè Gíríìkì náà jáde láì di mọ́ ìtumọ̀ gangan tí kò ní ṣe kedere.
- source_word: προσεύξομαι
  choice: Èmi yóò ... gbàdúrà
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọjọ́ iwájú tó túmọ̀ sí ‘èmi yóò gbàdúrà.’ Fífi ‘Èmi’ hàn tún pa ìtẹnumọ́ àti ìṣọ̀kan àwọn gbólóhùn Gíríìkì mọ́.
- source_word: τῷ πνεύματι
  choice: fi ẹ̀mí
  rationale: ‘Fi’ mú ìtumọ̀ ohun èlò tàbí ọ̀nà dative náà jáde, ó sì bá ‘fi èrò inú’ dọ́gba. ‘Ẹ̀mí’ kò pinnu pé Ẹ̀mí Mímọ́ tàbí ẹ̀mí ènìyàn nìkan ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: τῷ νοΐ
  choice: fi èrò inú
  rationale: νοῦς tọ́ka sí agbára ìrònú àti òye. ‘Èrò inú’ pa ìyàtọ̀ rẹ̀ sí ‘ẹ̀mí’ mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ‘òye’ hàn gẹ́gẹ́ bí ìtumọ̀ míì.
- source_word: ψαλῶ
  choice: Èmi yóò ... kọrin ìyìn
  rationale: Nínú ọ̀rọ̀ ìjọsìn yìí, ψάλλω ń tọ́ka sí kíkọrin láti yin Ọlọ́run. ‘Kọrin ìyìn’ mú ète náà kedere ju ‘kọrin’ lásán lọ, láì fi ohun èlò orin kan kún un.
- source_word: δὲ καὶ
  choice: ṣùgbọ́n èmi yóò sì
  rationale: 'Àpapọ̀ yìí ní àfikún àti ìyàtọ̀ díẹ̀: kì í ṣe ọ̀nà kan ṣoṣo, ṣùgbọ́n èkejì pẹ̀lú. ‘Ṣùgbọ́n ... sì’ jẹ́ ọ̀nà Yorùbá tó bójú mu láti fi ìwọ̀ntúnwọ̀nsì yìí hàn.'
theological_decisions:
- issue: Ìtumọ̀ πνεῦμα nínú ìyàtọ̀ láàárín ẹ̀mí àti èrò inú
  choice: A lo ‘ẹ̀mí’ láì sọ ní pàtó pé Ẹ̀mí Mímọ́ tàbí ẹ̀mí ẹni tó ń sọ̀rọ̀ ni.
  alternative: ‘Ẹ̀mí Mímọ́’ tàbí ‘ẹ̀mí mi’
  rationale: Àyíká ọ̀rọ̀ náà dá lórí ọ̀rọ̀ ẹ̀mí àti òye nínú ìjọsìn, ṣùgbọ́n Gíríìkì kò fi ẹni tí πνεῦμα ń tọ́ka sí hàn ní pàtó. Ìtumọ̀ náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A pa àtúnṣe àwọn gbólóhùn mẹ́rin àti ìwọ̀ntúnwọ̀nsì ‘ẹ̀mí/èrò inú’ mọ́ kí ìtẹnumọ́ àti ìlànà ẹsẹ náà má bàjẹ́.
