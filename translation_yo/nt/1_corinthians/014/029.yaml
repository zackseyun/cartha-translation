  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: προφῆται jẹ́ “wòlíì”; δύο ἢ τρεῖς jẹ́ “méjì tàbí mẹ́ta”; àṣẹ ọ̀pọ̀ λαλείτωσαν wà nínú “Kí ... sọ̀rọ̀.” “Àwọn yòókù” fi οἱ ἄλλοι sílẹ̀ ní fífẹ̀, láìpinnu ẹni tí ẹgbẹ́ náà jẹ́. “Gbẹ ohun tí wọ́n sọ yẹ̀ wò” mú ìtumọ̀ àyíká ti διακρινέτωσαν—ìṣàyẹ̀wò ọ̀rọ̀ àsọtẹ́lẹ̀—jáde dáadáa.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá òde òní tó mọ́, tó sì bójú mu fún ìwé mímọ́. Ìlò “Kí ... kí ... sì ...” jẹ́ ìlànà àṣẹ tó dára, àti “gbé ... yẹ̀ wò” jẹ́ ọ̀nà àdánidá fún ìṣàyẹ̀wò pẹ̀lẹ́.
  terminology: “Wòlíì” jẹ́ ọ̀rọ̀ ìjọsìn tí a mọ̀ dáadáa fún προφῆται. A kò fi “àwọn yòókù” dín sí àwọn wòlíì mìíràn, aṣáájú, tàbí gbogbo ìjọ; nítorí náà, a pa àìdánilójú Gíríìkì mọ́. Àlàyé ìsàlẹ̀ ṣàfihàn àwọn àṣàyàn ìtumọ̀ διακρίνω láìfi ìtúmọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
