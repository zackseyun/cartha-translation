id: 1CO.14.29
reference: 1 Corinthians 14:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: yo
  text: Kí wòlíì méjì tàbí mẹ́ta sọ̀rọ̀, kí àwọn yòókù sì gbé ohun tí wọ́n sọ yẹ̀ wò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ṣe ìdájọ́,” “fi òye yà á,” tàbí “ṣe àyẹ̀wò rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí yíyẹ ọ̀rọ̀ àsọtẹ́lẹ̀ wò.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: wòlíì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn wòlíì tàbí àwọn olùsọ àsọtẹ́lẹ̀; “wòlíì” ni ìtumọ̀ tààrà, ó sì bá àyíká ìlànà fún ọ̀rọ̀ nínú ìjọ mu.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́ láàárín àwọn ìlànà; “sì” mú ìṣàn gbólóhùn Yorùbá rọrùn láìfi ìtakora líle kún un.
- source_word: δύο ἢ τρεῖς
  choice: méjì tàbí mẹ́ta
  rationale: Èyí pa ìtumọ̀ iye nọ́ńbà inú Gíríìkì mọ́ ní tààrà.
- source_word: λαλείτωσαν
  choice: kí ... sọ̀rọ̀
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ ẹni kẹta ní ọ̀pọ̀; ìṣètò “kí ... sọ̀rọ̀” fi agbára àṣẹ náà hàn lọ́nà Yorùbá àdánidá.
- source_word: οἱ ἄλλοι
  choice: àwọn yòókù
  rationale: Gíríìkì kò sọ ní pàtó bóyá àwọn wòlíì mìíràn, àwọn aṣáájú, tàbí gbogbo ìjọ ni; “àwọn yòókù” pa àìdánilójú yẹn mọ́.
- source_word: διακρινέτωσαν
  choice: kí ... gbé ohun tí wọ́n sọ yẹ̀ wò
  rationale: Nínú àyíká yìí, διακρίνω túmọ̀ sí fífi ọ̀rọ̀ àsọtẹ́lẹ̀ wò, yíyẹ̀ ẹ́ wò, tàbí ṣíṣe ìdájọ́ nípa rẹ̀. Gbólóhùn yìí sọ ìyẹ̀wò pẹ̀lẹ́ ní Yorùbá àdánidá láìdín ìtumọ̀ náà mọ́ sí ìdájọ́ ẹ̀bi.
theological_decisions:
- issue: Ta ni “àwọn yòókù” nínú àpéjọ náà?
  choice: A túmọ̀ ọ́ ní gbogbogbòò sí “àwọn yòókù,” láìsọ pé àwọn wòlíì mìíràn, àwọn aṣáájú, tàbí gbogbo ìjọ ni.
  alternative: “àwọn wòlíì yòókù” tàbí “ìyókù àwọn ará ìjọ”
  rationale: Gíríìkì kò sọ irú ẹgbẹ́ tí wọ́n jẹ́ ju “àwọn yòókù” lọ; ìtumọ̀ náà pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìsìn tí ó wà nínú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí àwọn òǹkàwé òde òní lè lóye. A lo “gbé ... yẹ̀ wò” fún ìṣàyẹ̀wò tó jinlẹ̀, a sì fi àmi ohùn sí ibi tí ó yẹ.
