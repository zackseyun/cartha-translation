  source_fidelity: Ìtumọ̀ náà gbé ìṣọ̀kan ìjọ, ìpéjọ wọn sí ibi kan, ọ̀rọ̀ ní ahọ́n, ìyàtọ̀ ἰδιῶται àti ἄπιστοι, àti ìbéèrè àròsọ ìparí kalẹ̀ dáadáa. Síbẹ̀, “ohun tí ẹ ń ṣe” lè mú ìtumọ̀ ἰδιῶται di ẹni tí kò mọ ìṣe àwọn olùgbọ́ ní pàtó, dípò ẹni tí a kò tíì kọ́ tàbí tí kò lóye ìṣe ìjọ náà.
