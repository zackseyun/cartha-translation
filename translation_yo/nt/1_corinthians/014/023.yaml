id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: yo
  text: Nítorí náà, bí gbogbo ìjọ bá péjọ sí ibì kan, tí gbogbo wọn sì ń sọ̀rọ̀ ní ahọ́n[a], tí àwọn tí a kò tíì kọ́ nípa ìṣe ìjọ[b] tàbí àwọn aláìgbàgbọ́ sì wọlé, ṣé wọn kò ní sọ pé orí yín ti dàrú?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “ń sọ̀rọ̀ ní àwọn èdè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn èdè,” ṣùgbọ́n “ahọ́n” pa ìtumọ̀ náà sílẹ̀ láìpinnu irú ọ̀rọ̀ tí a ń tọ́ka sí.
    reason: alternative_reading
  - marker: b
    text: Tàbí “àwọn àjèjì sí ohun tí ń ṣẹlẹ̀.” Ọ̀rọ̀ Gíríìkì náà ṣeé ṣe kí ó tọ́ka sí àwọn tí a kò tíì kọ́ tàbí tí kò lóye ìṣe ìjọ, ó sì yà wọ́n sọ́tọ̀ kúrò lọ́dọ̀ “àwọn aláìgbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde tàbí ìlànà tí ó tẹ̀ lé ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ.
- source_word: συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτό
  choice: bí gbogbo ìjọ bá péjọ sí ibì kan
  rationale: “Gbogbo ìjọ” pa agbára ὅλη mọ́, “péjọ” sì tú συνέλθῃ ní èdè Yorùbá àdánidá; “sí ibì kan” tún pa ìtumọ̀ ibi kan náà nínú ἐπὶ τὸ αὐτό mọ́.
- source_word: λαλῶσιν γλώσσαις
  choice: ń sọ̀rọ̀ ní ahọ́n
  rationale: “Ahọ́n” jẹ́ ìtumọ̀ tààrà fún γλῶσσαι, ó sì pa ọ̀nà sílẹ̀ fún ìbéèrè bóyá àwọn èdè ènìyàn ni tàbí irú ọ̀rọ̀ ẹ̀bùn Ẹ̀mí mìíràn; àlàyé ìsàlẹ̀ fi “èdè” hàn gẹ́gẹ́ bí òmíràn.
- source_word: ἰδιῶται
  choice: àwọn tí kò mọ ohun tí ẹ ń ṣe
  rationale: Ó ń tọ́ka sí àwọn tí kò ní ìmọ̀ tàbí tí a kò tíì fi mọ̀ nípa ohun tí ìjọ ń ṣe. Ìtumọ̀ yìí yà wọ́n sọ́tọ̀ kúrò lọ́dọ̀ “àwọn aláìgbàgbọ́” láìlo ọ̀rọ̀ ẹ̀gàn.
- source_word: ἄπιστοι
  choice: àwọn aláìgbàgbọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún àwọn tí kò gbàgbọ́.
- source_word: οὐκ ἐροῦσιν ὅτι μαίνεσθε;
  choice: ṣé wọn kò ní sọ pé orí yín ti dàrú?
  rationale: Ìbéèrè náà ń retí ìdáhùn pé bẹ́ẹ̀ ni. “Orí yín ti dàrú” sọ agbára μαίνεσθε ní ọ̀nà Yorùbá àdánidá láìjẹ́ ti àtijọ́ tàbí ti ọ̀rọ̀ ojú pópó jù.
theological_decisions:
- issue: Irú ohun tí γλώσσαι túmọ̀ sí nínú 1 Kọ́ríńtì 14
  choice: A lo “ahọ́n” nínú ọ̀rọ̀ pàtàkì.
  alternative: “èdè” tàbí “àwọn èdè”
  rationale: γλῶσσα lè túmọ̀ sí ahọ́n tàbí èdè. “Ahọ́n” pa ọ̀rọ̀ ìsìn tí a mọ̀ sílẹ̀, kò sì pinnu àríyànjiyàn bóyá èdè ènìyàn, ọ̀rọ̀ àrà ọ̀tọ̀, tàbí méjèèjì ni Pọ́ọ̀lù ní lọ́kàn.
- issue: Ìyàtọ̀ láàárín ἰδιῶται àti ἄπιστοι
  choice: A tú wọn sí “àwọn tí kò mọ ohun tí ẹ ń ṣe” àti “àwọn aláìgbàgbọ́.”
  alternative: “àwọn àjèjì” àti “àwọn aláìgbàgbọ́”
  rationale: 'Ìtumọ̀ tí a yàn pa ìyàtọ̀ tí Pọ́ọ̀lù ṣe mọ́: ẹni lè má mọ àṣà ìpàdé náà láìjẹ́ pé ọ̀rọ̀ náà ti pè é ní aláìgbàgbọ́.'
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà tẹ̀ lé ìṣàn ìbéèrè àròsọ ti Gíríìkì, ṣùgbọ́n a ṣètò àwọn abala rẹ̀ ní ọ̀nà tí ó jẹ́ àdánidá ní Yorùbá.
