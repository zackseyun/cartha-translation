  terminology: “Ìjọ,” “aláìgbàgbọ́,” àti “orí yín ti dàrú” bá ààyè ọ̀rọ̀ náà mu. “Ń sọ̀rọ̀ ní ahọ́n” dá àríyànjiyàn nípa γλῶσσαι sílẹ̀ láìyanju rẹ̀. Àlàyé ìsàlẹ̀ a ni a tún ṣe kí ó sọ ìbáṣepọ̀ “ahọ́n/èdè” ní Yorùbá ní kedere, kí o má sì pè é ní “ọ̀rọ̀ ẹ̀bùn,” èyí tí kò dájú nínú ọ̀rọ̀ Gíríìkì fúnra rẹ̀.
