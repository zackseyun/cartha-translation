id: 1CO.14.21
reference: 1 Corinthians 14:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: yo
  text: Nínú Òfin ni a ti kọ ọ́ pé, “Nípasẹ̀ àwọn ènìyàn tí ń sọ èdè mìíràn àti nípasẹ̀ àwọn ètè àwọn àjèjì ni èmi yóò sọ̀rọ̀ sí àwọn ènìyàn yìí[a]; síbẹ̀, àní ní ọ̀nà yìí, wọn kì yóò fetí sí mi[b],” ni Olúwa wí.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Pẹ̀lú àwọn èdè mìíràn àti pẹ̀lú ètè àwọn ẹlòmíràn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọn kì yóò gbọ́ tèmi.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ àyọlò yìí ń ṣe ìrántí Aísáyà 28:11–12.
    reason: cross_reference
  - marker: d
    text: Nítorí Ọlọ́run Ísírẹ́lì ni ó ń sọ̀rọ̀ nínú àyọlò yìí, àwọn ìtumọ̀ kan máa ń kọ ọ́ sí “OLÚWA” láti fi ìpilẹ̀ Hébérù hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: Nínú Òfin
  rationale: Ó pa ìtọ́kasí Páùlù sí àkójọpọ̀ Ìwé Mímọ́ Júù mọ́, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ tí ó fa jáde wá láti inú Aísáyà, kì í ṣe inú àwọn ìwé márùn-ún Mósè nìkan.
- source_word: γέγραπται
  choice: ni a ti kọ ọ́ pé
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti fi ìṣe pípé aláìlórúkọ tó ń ṣàgbékalẹ̀ ọ̀rọ̀ Ìwé Mímọ́ hàn.
- source_word: ἑτερογλώσσοις
  choice: Nípasẹ̀ àwọn ènìyàn tí ń sọ èdè mìíràn
  rationale: Ó túmọ̀ ọ̀rọ̀ náà gẹ́gẹ́ bí èdè tí ó yàtọ̀, ó sì mú ẹni tí ń sọ ọ́ hàn ní Yorùbá àdánidá, láìjá ìsopọ̀ rẹ̀ pẹ̀lú àkòrí àwọn èdè nínú àyíká ẹsẹ náà.
- source_word: χείλεσιν ἑτέρων
  choice: nípasẹ̀ ètè àwọn àjèjì
  rationale: Ó pa àwòrán ‘ètè’ inú ọ̀rọ̀ àyọlò mọ́, ‘àwọn àjèjì’ sì mú kí ó ṣe kedere pé àwọn tí èdè àti ìran wọn yàtọ̀ ni a ń tọ́ka sí.
- source_word: λαλήσω
  choice: ni èmi yóò fi bá ... sọ̀rọ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún sísọ̀rọ̀ sí ẹgbẹ́ ènìyàn, ó sì pa àkókò ọjọ́ iwájú mọ́.
- source_word: τῷ λαῷ τούτῳ
  choice: àwọn ènìyàn yìí
  rationale: ‘Àwọn ènìyàn’ bá λαός mu ní àyíká ọ̀rọ̀ àwọn ènìyàn májẹ̀mú, ó sì dára ju ‘orílẹ̀-èdè’ lọ níbí.
- source_word: οὐδ’ οὕτως
  choice: síbẹ̀, àní ní ọ̀nà yìí
  rationale: 'Ó pa ìtẹnumọ́ οὐδέ àti ìtumọ̀ ọ̀nà tàbí ipò ti οὕτως mọ́: kódà nípasẹ̀ ọ̀nà àrà yìí, wọn kò ní dáhùn.'
- source_word: εἰσακούσονταί μου
  choice: wọn kì yóò fetí sí mi
  rationale: ‘Fetí sí’ jẹ́ Yorùbá òde òní tó ṣe kedere fún gbígbọ́ pẹ̀lú àfiyèsí; ó tún lè ní ìtumọ̀ títẹ̀lé, èyí tí àlàyé ìsàlẹ̀ fi hàn.
- source_word: λέγει κύριος
  choice: ni Olúwa wí
  rationale: Ó pa ìlànà ọ̀rọ̀ ìtọ́kasí Ọlọ́run mọ́, ó sì tú κύριος sí ‘Olúwa’ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe wí.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ọ̀rọ̀ Ìwé Mímọ́ tí Ọlọ́run ń sọ
  choice: Olúwa
  alternative: OLÚWA
  rationale: Gíríìkì ní κύριος, nítorí náà ‘Olúwa’ ni a lò nínú ọ̀rọ̀ pàtàkì. Síbẹ̀, ọ̀rọ̀ náà ń tún ọ̀rọ̀ Ọlọ́run Ísírẹ́lì nínú Aísáyà sọ, nítorí náà àlàyé fi ìpilẹ̀ Hébérù tó lè mú kí àwọn ìtumọ̀ kan lo ‘OLÚWA’ hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa àwòrán ‘ètè’ àti ìtẹnumọ́ ‘àní ní ọ̀nà yìí’ mọ́, ṣùgbọ́n a ṣètò gbolohun náà ní ọ̀nà tí ó ṣe é ka fún òǹkàwé Yorùbá lasán.
