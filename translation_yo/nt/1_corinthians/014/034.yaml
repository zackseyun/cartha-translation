  terminology: “Ìjọ,” “yọ̀ǹda,” “tẹríba,” àti “òfin” yẹ, wọ́n sì pa àìdájú nípa γυναῖκες àti νόμος mọ́. Àwọn àlàyé ìsàlẹ̀ tún bojú tó àwọn àṣàyàn ìtumọ̀ láìfi ìtumọ̀ ẹ̀kọ́ kan lé ọrọ̀ náà lórí.
