  source_fidelity: 'Àyọkà náà túmọ̀ àwọn èrò pàtàkì nínú Giriki lọ́nà tó tọ́: γυναῖκες gẹ́gẹ́ bí “àwọn obìnrin,” àìfòyè gba láti sọ̀rọ̀, ìtẹríba, àti νόμος gẹ́gẹ́ bí “òfin.” Síbẹ̀, καί nínú καθὼς καὶ ὁ νόμος λέγει (“òfin náà pẹ̀lú”) kò hàn nínú gbolohun ìparí tí a kọ́kọ́ fún.'
