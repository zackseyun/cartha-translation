id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: yo
  text: Kí àwọn obìnrin máa dákẹ́ nínú àwọn ìjọ[a], nítorí a kò yọ̀ǹda fún wọn láti sọ̀rọ̀[b]; ṣùgbọ́n kí wọ́n máa tẹríba, gẹ́gẹ́ bí òfin náà pẹ̀lú ti wí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí àwọn aya máa dákẹ́ nínú àwọn ìjọ”; ọ̀rọ̀ Giriki γυνή lè túmọ̀ sí “obìnrin” tàbí “aya,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
  - marker: b
    text: Ẹsẹ yìí fúnra rẹ̀ kò sọ irú sísọ̀rọ̀ tí ó ní lọ́kàn; àwọn kan lóye rẹ̀ ní ọ̀nà tóóró sí i láti inú àyíká àwọn ẹsẹ tó yí i ká.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Òfin”; ó ṣeé ṣe kí Paulu máa tọ́ka sí Òfin Mose ní pàtó tàbí sí Ìwé Mímọ́ ní ìtumọ̀ tó gbòòrò.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: àwọn obìnrin
  rationale: γυνή lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya.’ Nítorí ẹsẹ yìí kò mẹ́nu kan ọkọ, ‘àwọn obìnrin’ ni ìtumọ̀ àkọ́kọ́, a sì pa ‘àwọn aya’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἐκκλησίαις
  choice: àwọn ìjọ
  rationale: Nínú lílo Paulu, ἐκκλησία sábà ń tọ́ka sí ìjọ àwọn onígbàgbọ́, ní pàtàkì bí wọ́n ti péjọ; ‘àwọn ìjọ’ jẹ́ èdè Yorùbá tó ṣe déédéé tí ó sì bá àyíká mu.
- source_word: σιγάτωσαν
  choice: kí ... máa dákẹ́
  rationale: Ọ̀rọ̀ àṣẹ yìí ń béèrè ìdákẹ́ tàbí dídáwọ́ sísọ̀rọ̀ nínú ipò tí a ń ṣàpèjúwe; ‘kí ... máa dákẹ́’ pa ipa àṣẹ onítẹ̀síwájú rẹ̀ mọ́.
- source_word: ἐπιτρέπεται
  choice: a kò yọ̀ǹda fún wọn
  rationale: Ìṣe aláìṣe-láti-ọ̀dọ̀ ẹni kan yìí fi hàn pé a kò fún wọn ní àṣẹ; gbólóhùn náà ṣe kedere láìfi ẹni tó ń yọ̀ǹda kún ọ̀rọ̀.
- source_word: λαλεῖν
  choice: láti sọ̀rọ̀
  rationale: λαλέω jẹ́ ọ̀rọ̀ gbòòrò fún sísọ̀rọ̀. A kò dín irú ọ̀rọ̀ tí ó tọ́ka sí kù nínú àyọkà pàtàkì.
- source_word: ὑποτασσέσθωσαν
  choice: kí wọ́n máa tẹríba
  rationale: Fọ́ọ̀mù àṣẹ náà ń sọ nípa wíwà lábẹ́ ìṣètò tàbí fífi ara ẹni sábẹ́; ‘tẹríba’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa ìtumọ̀ náà mọ́ láìfi ìkanra tí kò sí nínú Giriki kún un.
- source_word: νόμος
  choice: òfin
  rationale: ‘Òfin’ jẹ́ ìtumọ̀ tààrà. Àyọkà pàtàkì kò pinnu bóyá Òfin Mose pàtó ni tàbí Ìwé Mímọ́ ní ìtumọ̀ tó gbòòrò.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: gẹ́gẹ́ bí òfin náà ti wí
  rationale: Gbólóhùn yìí pa ìfiwéra καθὼς àti àfikún καί mọ́ ní èdè Yorùbá tó ṣàn déédéé.
theological_decisions:
- issue: Ohun tí γυναῖκες ń tọ́ka sí
  choice: àwọn obìnrin nínú ìjọ
  alternative: àwọn aya nínú ìjọ
  rationale: Ọ̀rọ̀ Giriki lè ní ìtumọ̀ méjèèjì, ṣùgbọ́n ẹsẹ náà kò sọ nípa ọkọ ní tààrà; nítorí náà, a lo ìtumọ̀ gbòòrò nínú àyọkà, a sì fi èkejì sí àlàyé ìsàlẹ̀.
- issue: Ìwọ̀n ìfòfindè sísọ̀rọ̀
  choice: a túmọ̀ ‘láti sọ̀rọ̀’ ní tààrà láìdín irú ọ̀rọ̀ náà kù
  alternative: ọ̀rọ̀ ìdàrúdàpọ̀ nìkan, tàbí dídá àwọn àsọtẹ́lẹ̀ lẹ́jọ́ nìkan
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ irú sísọ̀rọ̀ tí ó ní lọ́kàn. A kò fi ọ̀kan nínú àwọn àlàyé àyíká tí a ń jiyàn lé e lórí.
- issue: Ohun tí ὁ νόμος ń tọ́ka sí
  choice: òfin
  alternative: Òfin Mose pàtó, tàbí Ìwé Mímọ́ ní gbogbogbòò
  rationale: Ohun tí Paulu ń tọ́ka sí gan-an kò dájú; ìtumọ̀ náà pa àìdájú inú Giriki mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘yọ̀ǹda’ fún permission àti ‘tẹríba’ fún submission, láìfi àlàyé ẹ̀kọ́ ìsìn tí àyọkà kò sọ kún un.
