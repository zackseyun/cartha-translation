id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá rò pé òun jẹ́ wòlíì tàbí ẹni tẹ̀mí, kí ó mọ̀ pé ohun tí mo ń kọ sí yín jẹ́ àṣẹ Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ti Olúwa ni.” Ní Gíríìkì, ó túmọ̀ ní tààràtà sí “ti Olúwa ni” tàbí “ohun Olúwa ni”; a kún “àṣẹ” sí i nínú ẹsẹ yìí láti mú ìtumọ̀ inú àyíká ọ̀rọ̀ náà ṣe kedere.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: bá rò pé
  rationale: Ó fi ìrònú tàbí ìfojúsùn ẹni nípa ara rẹ̀ hàn, ó sì pa ìró ìbáwí tí ọ̀rọ̀ náà lè ní mọ́.
- source_word: προφήτης
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá àyíká ọ̀rọ̀ nípa ẹ̀bùn àsọtẹ́lẹ̀ mu.
- source_word: πνευματικός
  choice: ẹni tẹ̀mí
  rationale: Ó pa ọ̀rọ̀ Gíríìkì náà mọ́ ní ṣókí, ó sì jẹ́ kí ìtumọ̀ rẹ̀ dúró ní gbòòrò gẹ́gẹ́ bí ẹni tí a kà sí ẹni ti Ẹ̀mí ń darí tàbí ẹni tí ó ní ẹ̀bùn tẹ̀mí.
- source_word: ἐπιγινωσκέτω
  choice: kí ó mọ̀
  rationale: Ìlànà yìí ń béèrè pé kí ẹni náà mọ̀, kí ó sì gba òtítọ́ ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: ἃ γράφω ὑμῖν
  choice: àwọn ohun tí mo ń kọ sí yín
  rationale: Ó tú ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ àti ìṣe àsìkò ìsinsìnyí jáde ní Yorùbá àdánidá.
- source_word: κυρίου ἐστίν
  choice: àṣẹ Olúwa ni
  rationale: Gbólóhùn Gíríìkì náà kúrú, kò sì sọ orúkọ ohun tí ó jẹ́ ti Olúwa ní gbangba. ‘Àṣẹ Olúwa ni’ mú agbára ọ̀rọ̀ inú àyíká náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn kúkúrú κυρίου ἐστίν
  choice: àṣẹ Olúwa ni
  alternative: ti Olúwa ni / ohun Olúwa ni
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń sọ pé ìkọ́ni rẹ̀ ní àṣẹ Olúwa. Síbẹ̀, nítorí Gíríìkì kò sọ ‘àṣẹ’ ní gbangba, a fi ìtumọ̀ gangan sí àlàyé ìsàlẹ̀ kí àìdánilójú inú ìpilẹ̀ṣẹ̀ má bàa sọnù.
- issue: Ìbámu akọ nínú τις ... προφήτης ... πνευματικός
  choice: ẹnikẹ́ni ... òun ... ó
  alternative: Kò sí ọ̀nà míì tí ó pọn dandan, nítorí arọ́pò-orúkọ Yorùbá kì í fi akọ tàbí abo hàn.
  rationale: ‘Ẹnikẹ́ni’ tẹ̀ lé ìtumọ̀ gbogbogbò ti τις; èdè Yorùbá kò fipá mú ìyàtọ̀ akọ àti abo nínú arọ́pò-orúkọ.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. ‘Ẹni tẹ̀mí’ pa ọ̀rọ̀ náà mọ́ ní gbòòrò láìfi ‘ẹ̀bùn’ tàbí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
