  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá fi ìṣípayá kan hàn fún ẹlòmíràn tí ó jókòó[a], kí ẹni àkọ́kọ́ dákẹ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹlòmíràn tí ó jókòó bá gba ìṣípayá kan.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, kí ẹni tí ó kọ́kọ́ ń sọ̀rọ̀ dáwọ́ dúró, kí ẹlòmíràn náà lè sọ̀rọ̀.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” fi ipò àídájú hàn, “ṣùgbọ́n” sì mú ìyípadà onírẹ̀lẹ̀ nínú ìtọ́ni Pọ́ọ̀lù jáde.
- source_word: ἄλλῳ
  choice: fún ẹlòmíràn
  rationale: Ó tọ́ka sí ẹnì kejì tí ó yàtọ̀ sí ẹni tí ń sọ̀rọ̀ ní àkókò náà.
- source_word: ἀποκαλυφθῇ
  choice: a bá ṣí ohun kan payá
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣèyọrí aláìdárúkọ olùṣe; gbolohun Yorùbá yìí pa ìtumọ̀ ìṣípayá mọ́ láì sọ pé ta ni ó ṣe é.
- source_word: καθημένῳ
  choice: tí ó jókòó
  rationale: Ó jẹ́ àpèjúwe ẹlòmíràn náà gẹ́gẹ́ bí ẹni tí ó jókòó nínú ìpéjọ.
- source_word: ὁ πρῶτος
  choice: ẹni àkọ́kọ́
  rationale: Èyí pa ọ̀rọ̀ Gíríìkì mọ́ ní ṣókí; nínú àyíká ọ̀rọ̀, ẹni tí ó kọ́kọ́ ń sọ̀rọ̀ ni.
- source_word: σιγάτω
  choice: kí ... dákẹ́
  rationale: Èyí mú àṣẹ ẹni kẹta jáde ní Yorùbá àdánidá, ó sì túmọ̀ sí pé kí ẹni náà dá sísọ̀rọ̀ dúró.
theological_decisions:
- issue: Ìwà ìṣípayá nínú àsọtẹ́lẹ̀ ìjọ
  choice: Lo “a bá ṣí ohun kan payá” láì dárúkọ ẹni tí ó ṣe ìṣípayá náà.
  alternative: “bí Ọlọ́run bá ṣí ohun kan payá” tàbí “bí ẹlòmíràn bá gba ìṣípayá kan”
  rationale: Àṣèyọrí Gíríìkì fi ìṣípayá hàn, ṣùgbọ́n ẹsẹ yìí kò dárúkọ Ọlọ́run ní tààrà gẹ́gẹ́ bí olùṣe. Ìtumọ̀ náà pa àìdárúkọ yìí mọ́, kò sì fi ẹ̀kọ́ míì kún ọ̀rọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. “Ṣí ... payá” jẹ́ ọ̀nà àdánidá láti fi ìṣe ìṣípayá hàn; “kí ... dákẹ́” sì yẹ fún ìtọ́ni nínú ìpéjọ láì le jù.
