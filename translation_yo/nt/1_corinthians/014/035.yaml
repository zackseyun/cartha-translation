id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: yo
  text: Ṣùgbọ́n bí wọ́n bá fẹ́ kẹ́kọ̀ọ́ nípa ohunkóhun, kí wọ́n béèrè lọ́wọ́ àwọn ọkọ tiwọn ní ilé, nítorí ohun ìtìjú ni fún obìnrin[a] láti sọ̀rọ̀ nínú àpéjọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aya.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “obìnrin” tàbí “aya,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ìjọ” tàbí “nínú àwùjọ àwọn onígbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí àpéjọ tí àwọn onígbàgbọ́ péjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: kọ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti kẹ́kọ̀ọ́ tàbí láti mọ ohun kan. “Kọ́” jẹ́ ọ̀nà àdánidá àti tààrà láti sọ èrò náà ní Yorùbá.
- source_word: ἐν οἴκῳ
  choice: ní ilé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ipò abẹ́lé, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí àpéjọ ìjọ.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: ọkọ ara wọn
  rationale: Nínú àyíká yìí, ἄνδρας pẹ̀lú ἰδίους àti ọ̀rọ̀ nípa ilé tọ́ka sí àwọn ọkọ wọn, kì í ṣe àwọn ọkùnrin lásán. “Ara wọn” fi ìtumọ̀ ‘tiwọn fúnra wọn’ hàn.
- source_word: ἐπερωτάτωσαν
  choice: kí wọ́n béèrè lọ́wọ́
  rationale: Ìtumọ̀ náà ni kí wọ́n bi ẹnì kan léèrè tàbí kí wọ́n wádìí ohun kan lọ́dọ̀ rẹ̀. Ìṣètò “kí wọ́n” pa agbára àṣẹ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: αἰσχρὸν
  choice: ohun ìtìjú
  rationale: Èyí pa agbára ìdájọ́ ti ìwà àti ti ojú àwùjọ inú ọ̀rọ̀ Gíríìkì mọ́ láìsọ ọ́ di ọ̀rọ̀ rírọ̀ bí ‘kò bójú mu.’
- source_word: γυναικὶ
  choice: fún obìnrin
  rationale: γυνή lè túmọ̀ sí obìnrin tàbí aya. “Obìnrin” pa ìtumọ̀ gbogbogbò inú gbólóhùn mọ́, nígbà tí àlàyé ìsàlẹ̀ fi “aya” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn tó ṣeé ṣe.
- source_word: λαλεῖν
  choice: láti sọ̀rọ̀
  rationale: “Sọ̀rọ̀” ni ìbámu Yorùbá tó gbòòrò jù fún λαλεῖν; kò dín irú ọ̀rọ̀ tí a ń sọ kù sí ìbéèrè, àsọtẹ́lẹ̀, tàbí irú ọ̀rọ̀ pàtó mìíràn.
- source_word: ἐν ἐκκλησίᾳ
  choice: nínú àpéjọ
  rationale: Níbí, ἐκκλησία tọ́ka sí àwọn ènìyàn tí ó péjọ. “Àpéjọ” mú ìtumọ̀ ìkójọpọ̀ yìí jáde, kò sì fi ìtumọ̀ ilé ìjọ tàbí ètò ìsìn tí ó lè jẹ́ ti àkókò tó tẹ̀ lé e kún un.
theological_decisions:
- issue: Ìwọ̀n tí àṣẹ nípa sísọ̀rọ̀ obìnrin dé
  choice: Túmọ̀ gbólóhùn náà bí ó ti wà, láìdín “sọ̀rọ̀” kù sí irú ọ̀rọ̀ pàtó kan.
  alternative: A lè túmọ̀ ọ́ bí ìdènà sí ìbéèrè tó ń da àpéjọ rú, sí ṣíṣe ìdájọ́ àsọtẹ́lẹ̀, tàbí bí ọ̀rọ̀ tí àwọn ará Kọ́ríńtì sọ.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kàn sọ pé ó jẹ́ ohun ìtìjú fún obìnrin láti sọ̀rọ̀ nínú àpéjọ; kò sọ irú ọ̀rọ̀ tí ó ní lọ́kàn ní pàtó. Nítorí náà, ìtumọ̀ náà pa ìforígbárí ìtumọ̀ yìí mọ́ dípò kí ó yan àlàyé ẹ̀kọ́ kan fún òǹkàwé.
- issue: Bóyá γυνή/ἀνήρ túmọ̀ sí obìnrin/ọkùnrin tàbí aya/ọkọ
  choice: Lo “ọkọ” fún ἄνδρας àti “obìnrin” fún γυναικί nínú ẹsẹ̀, kí àlàyé ìsàlẹ̀ sì tọ́ka sí “aya” gẹ́gẹ́ bí ìtumọ̀ mìíràn.
  alternative: Lo “aya … ọkọ” ní gbogbo ibi, tàbí “obìnrin … ọkùnrin” ní gbogbo ibi.
  rationale: Gbólóhùn “ọkọ ara wọn” àti ipò ilé mú ìtumọ̀ ọkọ lágbára fún ἄνδρας. Ṣùgbọ́n γυναικί tó tẹ̀ lé e lè jẹ́ obìnrin ní gbogbogbò tàbí aya nínú àyíká yìí. Yíyan “obìnrin” pẹ̀lú àlàyé “aya” pa àìdánilójú ojúlówó náà mọ́.
translation_notes:
  register: A lo Yorùbá àṣàdéédé pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. “Kí wọ́n béèrè lọ́wọ́” àti “ọkọ ara wọn ní ilé” jẹ́ èdè àdánidá; “àpéjọ” sì yàgò fún kí òǹkàwé rò pé ilé ìjọ ni ọ̀rọ̀ náà ń tọ́ka sí.
