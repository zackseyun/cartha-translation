revisions:
- from: Mo fẹ́ kí gbogbo yín máa sọ̀rọ̀ ní àwọn èdè, ṣùgbọ́n mo fẹ́ jù bẹ́ẹ̀ lọ kí ẹ máa sọ àsọtẹ́lẹ̀. Ẹni tí ó ń sọ àsọtẹ́lẹ̀ tóbi ju ẹni tí ó ń sọ̀rọ̀ ní àwọn èdè lọ, àyàfi bí òun náà bá túmọ̀ rẹ̀[a], kí ìjọ lè rí ìgbékalẹ̀ gbà[b].
  to: Mo fẹ́ kí gbogbo yín sọ̀rọ̀ ní àwọn èdè, ṣùgbọ́n mo fẹ́ jù bẹ́ẹ̀ lọ kí ẹ sọ àsọtẹ́lẹ̀. Ẹni tí ó ń sọ àsọtẹ́lẹ̀ tóbi ju ẹni tí ó ń sọ̀rọ̀ ní àwọn èdè lọ, àyàfi bí òun náà bá túmọ̀ ohun tí ó sọ[a], kí ìjọ lè ní ìmúgbàgbára[b].
  rationale: A yọ ‘máa’ kúrò kí a má fi ìtumọ̀ habitual tí kò sí nínú Gíríìkì kún un. A rọ́pò ‘ìgbékalẹ̀’ pẹ̀lú ‘ìmúgbàgbára’ láti mú οἰκοδομή, ìkọ́nilẹ́gbẹ́ ìjọ, hàn ní kedere. A tún sọ object ìtumọ̀ náà ní gbangba gẹ́gẹ́ bí ‘ohun tí ó sọ’ fún ìròyìn Yorùbá, láìyí ẹni tí verb náà lè tọ́ka sí padà.
  reviewer_model: gpt-5.6-terra
