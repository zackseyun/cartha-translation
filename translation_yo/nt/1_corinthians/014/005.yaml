review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ Gíríìkì dáadáa ní ọ̀pọ̀lọpọ̀ ibi, ó sì tọ́ka sí ẹni tó ń sọ̀rọ̀ ní èdè gẹ́gẹ́ bí ẹni tó ṣeé ṣe jù lọ láti túmọ̀. Ṣùgbọ́n ‘máa’ ń fi ìṣe àṣà/tí ń ṣẹlẹ̀ léraléra kún infinitive àti subjunctive Gíríìkì láìní ìdí. ‘Ìgbékalẹ̀’ sì túmọ̀ sí ètò tàbí structure, kì í ṣe οἰκοδομή, ìmúgbàgbára/títẹ́ ìjọ síwájú.
  naturalness: ‘Mo fẹ́ kí gbogbo yín sọ̀rọ̀ ní àwọn èdè’ àti ‘kí ẹ sọ àsọtẹ́lẹ̀’ jẹ́ Yorùbá òde-òní tó mọ́, tí ó sì sún mọ́ ọ̀rọ̀ ìpilẹ̀ ju àwọn fọ́ọ̀mù tó ní ‘máa’ lọ. ‘Kí ìjọ lè ní ìmúgbàgbára’ jẹ́ ọ̀nà àdánidá láti sọ àǹfààní ìkọ́nilẹ́gbẹ́ tí ìjọ ń rí.
  terminology: A pa ‘àwọn èdè,’ ‘àsọtẹ́lẹ̀,’ àti ‘ìjọ’ mọ́. ‘Tóbi ju’ jẹ́ ọ̀nà tí ó gba àfiwé μείζων mọ́, bí ó tilẹ̀ jẹ́ pé gbólóhùn tó tẹ̀lé e ló ń ṣàlàyé pé àǹfààní ìjọ ni ìdí àfiwé náà.
  issues:
  - severity: medium
    issue: Àmì ìṣe ‘máa’ nínú àwọn gbolohun méjèèjì àkọ́kọ́
    rationale: λάλειν àti προφητεύητε kò ní imperfective/habitual marker. ‘Máa’ lè mú kí a ka a sí ìṣe tí ń ṣẹlẹ̀ léraléra ju ìfẹ́ Pọ́ọ̀lù fún ìṣe náà lọ.
  - severity: high
    issue: ‘Ìgbékalẹ̀’ fún οἰκοδομή
    rationale: Nínú Yorùbá lónìí, ‘ìgbékalẹ̀’ sábà máa ń tọ́ka sí ìṣètò, ìlànà, tàbí structure. Ọ̀rọ̀ Gíríìkì nínú àyíká yìí ni ìkọ́nilẹ́gbẹ́/ìmúgbàgbára ìjọ; ìtumọ̀ yìí nílò àtúnṣe.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ b yẹ kí ó bá ọ̀rọ̀ ìtumọ̀ tuntun mu
    rationale: Níwọ̀n bí ‘ìmúgbàgbára’ ti rọ́pò ‘ìgbékalẹ̀,’ àlàyé ìsàlẹ̀ gbọdọ̀ ṣàlàyé ìtumọ̀ ìkọ́nilẹ́gbẹ́ náà, kì í ṣe tún ọ̀rọ̀ ‘ìgbékalẹ̀’ sọ.
