id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: yo
  text: Mo fẹ́ kí gbogbo yín sọ̀rọ̀ ní àwọn èdè, ṣùgbọ́n mo fẹ́ jù bẹ́ẹ̀ lọ kí ẹ sọ àsọtẹ́lẹ̀. Ẹni tí ó ń sọ àsọtẹ́lẹ̀ tóbi ju ẹni tí ó ń sọ̀rọ̀ ní àwọn èdè lọ, àyàfi bí òun náà bá túmọ̀ ohun tí ó sọ[a], kí ìjọ lè ní ìmúgbàgbára[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àyàfi bí ẹnì kan bá túmọ̀ ohun tí ó sọ.” Ọ̀rọ̀-ìṣe Gíríìkì náà, tí ó wà ní ẹyọ kan, lè tọ́ka sí ẹni tó ń sọ̀rọ̀ ní àwọn èdè fúnra rẹ̀, tàbí, ní ìbámu pẹ̀lú àyíká, sí pé ẹnì kan pèsè ìtumọ̀.
    reason: alternative_reading
  - marker: b
    text: “Ìmúgbàgbára” túmọ̀ sí fífún ìjọ tí ó péjọ lókun àti ríràn án lọ́wọ́ láti dàgbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: Mo fẹ́
  rationale: Ó fi ìfẹ́ Pọ́ọ̀lù hàn ní tààràtà, ó sì jẹ́ ọ̀rọ̀ Yorùbá ti òde òní.
- source_word: πάντας ὑμᾶς
  choice: gbogbo yín
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ ènìyàn àti ìkúnrẹ́rẹ́ ‘gbogbo’ mọ́.
- source_word: λαλεῖν γλώσσαις
  choice: máa sọ̀rọ̀ ní àwọn èdè
  rationale: ‘Èdè’ lè túmọ̀ sí tongue tàbí language gẹ́gẹ́ bí γλῶσσα; ọ̀rọ̀ yìí kò fi tipátipá pinnu bóyá àwọn èdè ènìyàn ni tàbí irú ọ̀rọ̀ ẹ̀mí kan.
- source_word: μᾶλλον δὲ
  choice: ṣùgbọ́n mo fẹ́ jù bẹ́ẹ̀ lọ
  rationale: Ó fi ààyò tó lágbára hàn láìsọ pé Pọ́ọ̀lù kọ sísọ̀rọ̀ ní àwọn èdè sílẹ̀.
- source_word: ἵνα προφητεύητε
  choice: kí ẹ máa sọ àsọtẹ́lẹ̀
  rationale: Ìṣètò ‘fẹ́ ... kí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ẹni kan fẹ́ kí ó ṣẹlẹ̀.
- source_word: μείζων
  choice: tóbi ju ... lọ
  rationale: Ó pa àfiwé ‘greater’ mọ́; gbólóhùn ìdí tó tẹ̀ lé e fi hàn pé àǹfààní fún ìjọ ni àyíká àfiwé náà.
- source_word: ὁ προφητεύων
  choice: ẹni tí ó ń sọ àsọtẹ́lẹ̀
  rationale: Ó fi ọ̀nà àdánidá ṣe àfihàn participle tí a lò bí orúkọ ẹni.
- source_word: ἐκτὸς εἰ μὴ
  choice: àyàfi bí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún exception clause náà.
- source_word: διερμηνεύῃ
  choice: bá túmọ̀ rẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí ṣíṣàlàyé tàbí títúmọ̀ ohun tí a sọ ní èdè kí àwọn mìíràn lè lóye rẹ̀.
- source_word: ἡ ἐκκλησία
  choice: ìjọ
  rationale: Ó tọ́ka sí àwùjọ àwọn onígbàgbọ́ tí ó péjọ, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀.
- source_word: οἰκοδομὴν λάβῃ
  choice: lè rí ìgbékalẹ̀ gbà
  rationale: Ó pa àwòrán kíkọ́ ohun kan ró mọ́, ó sì sọ àǹfààní tí ìjọ ń rí nípa fífún un lókun.
theological_decisions:
- issue: Bí ẹni tó ń sọ àsọtẹ́lẹ̀ ṣe ‘tóbi ju’ ẹni tó ń sọ̀rọ̀ ní àwọn èdè lọ
  choice: A pa ‘tóbi ju’ mọ́, tí gbólóhùn ìdí sì fi àǹfààní fún ìgbékalẹ̀ ìjọ hàn.
  alternative: Kí a túmọ̀ rẹ̀ sí ẹni tó ga jù ní ipò tàbí tó jẹ́ mímọ́ jù.
  rationale: ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ ṣàlàyé pé iṣẹ́ tí ọ̀rọ̀ náà ń ṣe fún ìjọ ni àyíká àfiwé náà; ẹsẹ̀ náà kò sọ pé ẹni kan ní iye tàbí ìwà mímọ́ ju ẹlòmíràn lọ.
- issue: Ẹni tí ó jẹ́ subject διερμηνεύῃ
  choice: ‘òun náà bá túmọ̀ rẹ̀’—ẹni tó ń sọ̀rọ̀ ní àwọn èdè ni referent tó sún mọ́ jù.
  alternative: Ẹlòmíràn lè túmọ̀ rẹ̀, tàbí kí ìtumọ̀ kan wà.
  rationale: Verb singular náà kò ní subject tuntun tí a sọ ní gbangba, nítorí náà ó ṣeéṣe jù pé ó ń bá subject singular tó ṣáájú lọ. Síbẹ̀, àyíká orí náà gba pé ẹlòmíràn lè túmọ̀, a sì pa ìṣeéṣe yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, tó níyì, tí ó sì yẹ fún kíkà ní gbangba. A lo ‘àwọn èdè’ láìfi ‘àjèjì’ kún un, kí a má bàa dín àyè ìtumọ̀ γλώσσαις kù sí àwọn èdè orílẹ̀-èdè tí a mọ̀ nìkan.
