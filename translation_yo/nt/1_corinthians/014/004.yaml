id: 1CO.14.4
reference: 1 Corinthians 14:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: yo
  text: Ẹni tí ń sọ̀rọ̀ ní ahọ́n kan[a] ń kọ ara rẹ̀ sókè[b], ṣùgbọ́n ẹni tí ń sọ àsọtẹ́lẹ̀ ń kọ ìjọ[c] sókè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ní èdè kan.’ Nínú orí yìí, ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí ẹ̀bùn sísọ ní ahọ́n; síbẹ̀, àríyànjiyàn ṣì wà nípa bí irú ọ̀rọ̀ náà ṣe rí gan-an.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ‘ara òun fúnra rẹ̀’; akọ ẹyọ tí a lò níbẹ̀ dúró gẹ́gẹ́ bí aṣojú ẹnikẹ́ni. Èdè Yorùbá kò fi akọ tàbí abo hàn nínú ‘ara rẹ̀.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘àpéjọ’ tàbí ‘àwùjọ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Ẹni tí ń sọ̀rọ̀
  rationale: Àpilẹ̀kọ pẹ̀lú ọ̀rọ̀-ìṣe alábápín ìsinsìnyí dúró gẹ́gẹ́ bí orúkọ ẹni kan tí ìṣe náà ń ṣe àpèjúwe; gbólóhùn yìí sì pa ìfararora mọ́ pẹ̀lú ‘ẹni tí ń sọ àsọtẹ́lẹ̀.’
- source_word: γλώσσῃ
  choice: ní ahọ́n kan
  rationale: Ọ̀rọ̀ náà jẹ́ ẹyọ kan, kò sì ní àpilẹ̀kọ. ‘Ahọ́n’ pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì yẹra fún fífi ìtumọ̀ pàtó kan lé irú ọ̀rọ̀ tí Pọ́ọ̀lù ń tọ́ka sí.
- source_word: ἑαυτὸν
  choice: ara rẹ̀
  rationale: Èyí túmọ̀ reflexive pronoun náà ní ti ẹnì kan. Èdè Yorùbá kò fi akọ tàbí abo hàn nínú ‘rẹ̀,’ ṣùgbọ́n ó pa ẹyọ àti ìtọ́ka sí ẹni náà fúnra rẹ̀ mọ́.
- source_word: οἰκοδομεῖ
  choice: ń gbé ... ró
  rationale: Níhìn-ín, ọ̀rọ̀ náà jẹ́ àkàwé fún mímú ẹni tàbí ìjọ lágbára nípa tẹ̀mí. ‘Gbé ... ró’ jẹ́ èdè Yorùbá àdánidá, ó sì tún pa àwòrán kíkọ́ tàbí fífi ohun kan dúró ṣinṣin mọ́.
- source_word: ὁ δὲ προφητεύων
  choice: ṣùgbọ́n ẹni tí ń sọ àsọtẹ́lẹ̀
  rationale: ‘Ṣùgbọ́n’ fi ìyàtọ̀ onírẹ̀lẹ̀ tí δέ mú wá hàn, ‘ẹni tí ń sọ àsọtẹ́lẹ̀’ sì tú àpilẹ̀kọ pẹ̀lú ọ̀rọ̀-ìṣe alábápín náà ní ìbámu pẹ̀lú apá àkọ́kọ́.
- source_word: ἐκκλησίαν
  choice: ìjọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí àwùjọ àwọn onígbàgbọ́ tí ó péjọ. ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ọ̀nà tí Pọ́ọ̀lù ń lò ó mu.
theological_decisions:
- issue: Ìtumọ̀ γλώσσῃ nínú 1 Kọ́ríńtì 12–14
  choice: Lo ‘ahọ́n’ fún ọ̀rọ̀ tí a ń sọ nípa ẹ̀bùn ahọ́n, láìsọ irú rẹ̀ di pàtó
  alternative: Èdè àjèjì lásán tàbí ọ̀rọ̀ ìmísí tí kì í ṣe èdè ènìyàn
  rationale: Àyíká náà dá lórí ẹ̀bùn ahọ́n nínú ìjọsìn ìjọ. ‘Ahọ́n’ pa àìdánilójú nípa bí ọ̀rọ̀ náà ṣe rí gan-an mọ́, kò sì fi ẹ̀kọ́ ìjọ kan pàtó lé e.
- issue: Akọ ẹyọ nínú ὁ λαλῶν àti ἑαυτὸν
  choice: 'Lo ẹyọ aṣojú: ‘ẹni ... ara rẹ̀’'
  alternative: Gbólóhùn ọ̀pọ̀ tàbí ọ̀nà tí yóò fi akọ hàn ní kedere
  rationale: Gíríìkì jẹ́ akọ ẹyọ tí ó dúró fún ẹnikẹ́ni. Yorùbá kò fi akọ tàbí abo hàn nínú àpólà yìí, ṣùgbọ́n ẹyọ àti ìtumọ̀ aṣojú rẹ̀ wà ní pípé.
translation_notes:
  register: A lo Yorùbá àpéjọ tí ó bójú mu, tí ó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ. Gbólóhùn náà pa ìfararora àwọn apá méjèèjì àti ìyàtọ̀ láàárín àǹfààní ẹni kọ̀ọ̀kan àti títẹ́ ìjọ síwájú mọ́.
