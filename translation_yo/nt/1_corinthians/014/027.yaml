id: 1CO.14.27
reference: 1 Corinthians 14:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá ń sọ̀rọ̀ ní ahọ́n kan[a], kí iye wọn jẹ́ méjì, tàbí mẹ́ta ní ìwọ̀nba; kí wọ́n sì sọ̀rọ̀ lẹ́ẹ̀kọ̀ọ̀kan, kí ẹnì kan sì túmọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní èdè kan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ahọ́n tàbí èdè. Níhìn-ín, “ahọ́n” ń pa ọ̀rọ̀ tí Pọ́ọ̀lù ti ń lò jálẹ̀ orí yìí mọ́, láì dá àríyànjiyàn nípa irú ẹ̀bùn náà parí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: ní ahọ́n kan
  rationale: “Ahọ́n” bá àwòrán ọ̀rọ̀ Gíríìkì mu, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ fún ìṣẹ̀lẹ̀ ẹ̀bùn tí a ń jíròrò ní 1 Kọ́ríńtì 12–14. Àlàyé ìsàlẹ̀ ojú ewé fi “ní èdè kan” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn, láì pinnu bóyá èdè ènìyàn ni tàbí irú ọ̀rọ̀ mìíràn.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó pa ìtumọ̀ àìdánimọ̀ àti agbára gbólóhùn oníṣ条件条件 mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: λαλεῖ
  choice: bá ń sọ̀rọ̀
  rationale: Àmì “ń” bá ìṣe tí a gbé kalẹ̀ gẹ́gẹ́ bí ipò gbogbogbò mu nínú gbólóhùn “bí … bá …”.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: kí àwọn olùsọ̀rọ̀ jẹ́ méjì tàbí, ó pọ̀ jù, mẹ́ta
  rationale: Ó mú òfin Pọ́ọ̀lù nípa iye àwọn tí yóò sọ̀rọ̀ ṣe kedere, láì fi ohun míì kún un.
- source_word: ἀνὰ μέρος
  choice: kí ọ̀kọ̀ọ̀kan wọn sì sọ̀rọ̀ ní àkókò tirẹ̀
  rationale: Ó fi hàn pé wọn gbọ́dọ̀ sọ̀rọ̀ lẹ́yìn ara wọn, kì í ṣe ní àkókò kan náà.
- source_word: εἷς
  choice: ẹni kan
  rationale: Ó pa nọ́ńbà ẹyọ tí a lò gẹ́gẹ́ bí orúkọ ènìyàn mọ́.
- source_word: διερμηνευέτω
  choice: kí … túmọ̀
  rationale: “Túmọ̀” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún mímú ọ̀rọ̀ inú ahọ́n tàbí èdè kan yé àwùjọ; kò fi dandan sọ pé ìtumọ̀ ọ̀rọ̀-dé-ọ̀rọ̀ nìkan ni.
theological_decisions:
- issue: Ìtumọ̀ γλώσσῃ nínú ọ̀rọ̀ nípa àwọn ẹ̀bùn ti Ẹ̀mí
  choice: Lo “ahọ́n” nínú ẹsẹ̀ náà, pẹ̀lú “èdè” gẹ́gẹ́ bí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀ ojú ewé.
  alternative: Láti lo “èdè” nínú ẹsẹ̀ náà, tàbí láti ṣàlàyé rẹ̀ ní pàtó gẹ́gẹ́ bí ọ̀rọ̀ ìdùnnú àrà tàbí èdè àjèjì ti ènìyàn.
  rationale: Ẹsẹ̀ yìí ń tọ́ka sí ìṣẹ̀lẹ̀ tí Pọ́ọ̀lù ń pè ní γλῶσσα, ṣùgbọ́n kò dá irú ọ̀rọ̀ náà mọ́ ní pàtó. Yíyan “ahọ́n” àti fífi “èdè” sínú àlàyé pa àìdájú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A yẹra fún “èdè àìmọ̀,” nítorí “àìmọ̀” kò sí nínú ọ̀rọ̀ Gíríìkì, ó sì lè pinnu ohun tí ẹsẹ̀ náà kò pinnu. Gbólóhùn náà jẹ́ kí òfin iye, títẹ̀lé ara ẹni ní sísọ̀rọ̀, àti dandan ìtumọ̀ ṣe kedere.
