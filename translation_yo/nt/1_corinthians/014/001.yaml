reference: 1 Corinthians 14:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: yo
  text: Ẹ máa lépa ìfẹ́, kí ẹ sì máa fi taratara fẹ́ àwọn ohun ti Ẹ̀mí[a], ṣùgbọ́n ní pàtàkì kí ẹ sọ àsọtẹ́lẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn ohun ti ẹ̀mí’ tàbí ‘àwọn ọ̀ràn ti ẹ̀mí.’ Ọ̀rọ̀ Gíríìkì gbòòrò ju ‘àwọn ẹ̀bùn’ lọ, ṣùgbọ́n àyíká ọ̀rọ̀ yìí dá lé àwọn ìfihàn tí Ẹ̀mí ń fún ìjọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘ṣùgbọ́n kàkà bẹ́ẹ̀, kí ẹ sọ àsọtẹ́lẹ̀’ tàbí ‘ṣùgbọ́n ẹ túbọ̀ fẹ́ láti sọ àsọtẹ́lẹ̀.’
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: Ẹ máa lépa
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí lílépa ohun kan pẹ̀lú ìtara àti láìdáwọ́ dúró, kì í ṣe wíwá lásán.
- source_word: τὴν ἀγάπην
  choice: ìfẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì so ẹsẹ̀ yìí pọ̀ mọ́ àlàyé nípa ìfẹ́ nínú orí 13.
- source_word: ζηλοῦτε
  choice: fi taratara fẹ́
  rationale: Ó fi ìtara àti ìfẹ́-ọkàn líle tí ζηλόω ní hàn ní Yorùbá àdánidá.
- source_word: τὰ πνευματικά
  choice: àwọn ohun ti Ẹ̀mí
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ajẹtífù aláìlẹ́ni ní ọ̀pọ̀, ó sì gbòòrò ju ‘ẹ̀bùn’ nìkan lọ. Àyíká ọ̀rọ̀ tọ́ka sí àwọn ohun tí Ẹ̀mí ń mú jáde nínú ìjọ, ṣùgbọ́n ìtumọ̀ yìí kò dín ọ̀rọ̀ náà kù sí ẹ̀bùn nìkan.
- source_word: μᾶλλον
  choice: ní pàtàkì
  rationale: Ó fi bí Pọ́ọ̀lù ṣe ń gbé àsọtẹ́lẹ̀ ga nínú àyíká yìí hàn, láìsọ pé àwọn ohun mìíràn kò yẹ.
- source_word: ἵνα προφητεύητε
  choice: kí ẹ lè sọ àsọtẹ́lẹ̀
  rationale: Ó pa ìṣètò gbólóhùn ἵνα pẹ̀lú ọ̀rọ̀-ìṣe afipamọ́ mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ τὰ πνευματικά
  choice: àwọn ohun ti Ẹ̀mí
  alternative: àwọn ẹ̀bùn Ẹ̀mí; àwọn ọ̀ràn ti ẹ̀mí
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí àwọn ohun tàbí ọ̀ràn ti ẹ̀mí ní gbogbogbòò, bí ó tilẹ̀ jẹ́ pé 1 Kọ́ríńtì 12–14 dá lé àwọn ìfihàn tí Ẹ̀mí ń fún ìjọ. Yíyan ọ̀rọ̀ tó gbòòrò ń pa àìdánilójú gidi inú orísun mọ́.
- issue: Agbára μᾶλλον δὲ nípa àsọtẹ́lẹ̀
  choice: ṣùgbọ́n ní pàtàkì
  alternative: ṣùgbọ́n kàkà bẹ́ẹ̀; ṣùgbọ́n jù bẹ́ẹ̀ lọ
  rationale: Èyí fi ààyò tí Pọ́ọ̀lù fún àsọtẹ́lẹ̀ hàn, ṣùgbọ́n kò sọ pé àsọtẹ́lẹ̀ nìkan ni ohun ti Ẹ̀mí tàbí pé àwọn ìfihàn mìíràn kò níye.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. ‘Ẹ máa lépa’ àti ‘fi taratara fẹ́’ jẹ́ ọ̀rọ̀ àdánidá fún àwọn àṣẹ tó ń béèrè ìṣe aláìdáwọ́ dúró. ‘Ẹ̀mí’ ní lẹ́tà ńlá tọ́ka sí Ẹ̀mí Ọlọ́run nítorí àyíká 1 Kọ́ríńtì 12–14.
