    rationale: ‘lè’ sábà máa ń fi ìṣe tó ṣeé ṣe, agbára, tàbí ète hàn. Níhìn-ín, ó lè yí ìfẹ́-ọkàn pàtàkì (‘desire especially that you prophesy’) sí ìdí (‘so that you may be able to prophesy’). Yọ ‘lè’ kúrò.
  - severity: low
    issue: Ìtẹ̀síwájú àṣẹ ζηλοῦτε
    rationale: Ìṣe kejì kò ní ‘máa,’ bí ó tilẹ̀ jẹ́ pé Gíríìkì ní àṣẹ ìṣe-tí-ń-tẹ̀síwájú fún àwọn ọ̀rọ̀-ìṣe méjèèjì. Fífi ‘máa’ sí i ń mú ìfarahàn náà péye, ó sì jẹ́ àdánidá.
