  to: Ẹ máa lépa ìfẹ́, kí ẹ sì máa fi taratara fẹ́ àwọn ohun ti Ẹ̀mí[a], ṣùgbọ́n ní pàtàkì kí ẹ sọ àsọtẹ́lẹ̀[b].
