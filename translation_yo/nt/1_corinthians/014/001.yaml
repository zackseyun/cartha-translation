  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní ọ̀pọ̀ apá: Διώκετε jẹ́ ‘Ẹ máa lépa,’ ἀγάπην jẹ́ ‘ìfẹ́,’ ζηλοῦτε jẹ́ ìfẹ́-ọkàn tí ó ní ìtara, àti τὰ πνευματικά ni a fi sí ìtumọ̀ gbòòrò gẹ́gẹ́ bí ‘àwọn ohun ti Ẹ̀mí.’ Ṣùgbọ́n ‘kí ẹ lè sọ àsọtẹ́lẹ̀’ lè túmọ̀ sí ète tàbí agbára láti sọ àsọtẹ́lẹ̀ (‘so that you can prophesy’), dípò kó jẹ́ àkóónú ìfẹ́-ọkàn tí ἵνα προφητεύητε ń sọ. ‘Kí ẹ sọ àsọtẹ́lẹ̀’ pa ìfẹ́-ọkàn/ìfẹ́fẹ́ náà mọ́ dáadáa.'
  naturalness: ‘Ẹ máa lépa’ jẹ́ Yorùbá tó dára. Fífi ‘máa’ kún ìṣe kejì ń jẹ́ kí àwọn àṣẹ méjèèjì hàn gẹ́gẹ́ bí ìṣe tí ń tẹ̀síwájú. ‘Kí ẹ sọ àsọtẹ́lẹ̀’ sì rọrùn, ó sì dára ju ‘kí ẹ lè sọ àsọtẹ́lẹ̀’ nínú ìṣètò gbolóhùn yìí.
  terminology: ‘ìfẹ́,’ ‘Ẹ̀mí,’ àti ‘sọ àsọtẹ́lẹ̀’ jẹ́ ọ̀rọ̀ tó bójú mu fún ìforúkọsílẹ̀ Bíbélì Yorùbá ìgbàlódé. ‘Àwọn ohun ti Ẹ̀mí’ ń dá ìtumọ̀ τὰ πνευματικά sílẹ̀ ní ìwọ̀n tó gbòòrò; akọsílẹ̀ náà ṣàlàyé pé àyíká ọ̀rọ̀ ń tọ́ka sí ìfihàn/ẹ̀bùn tí Ẹ̀mí ń fún.
