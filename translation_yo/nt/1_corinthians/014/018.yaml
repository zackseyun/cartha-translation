  verdict: revise
  source_fidelity: The draft accurately conveys thanksgiving to God, the comparative force ('more than all of you'), and the contextual technical sense of γλώσσαις without deciding the disputed nature of tongues. The generic singular 'ahọ́n' is idiomatic Yoruba terminology for the phenomenon and need not mechanically reproduce the Greek plural.
  naturalness: 'The sentence is clear and suitably modern. A small idiomatic and orthographic improvement is warranted: after dúpẹ́, lọwọ is the usual standard form for the person thanked. The revised wording retains the natural progressive presentation of the Greek present.'
  terminology: Ahọ́n appropriately preserves the established term for the gift discussed in 1 Corinthians 12–14. The footnote's 'àwọn èdè' properly gives the lexical alternative without narrowing the referent in the main text.
  issues:
