  text: εὐχαριστῶ τῷ ⸀θεῷ, πάντων ὑμῶν μᾶλλον ⸀γλώσσαις ⸀λαλῶ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/018.yaml
  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: yo
  text: Mo dúpẹ́ lọwọ Ọlọrun pé mo ń sọ̀rọ̀ ní ahọ́n ju gbogbo yín lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ń sọ̀rọ̀ ní àwọn èdè ju gbogbo yín lọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “àwọn èdè,” ṣùgbọ́n nínú àyíká yìí, ó ń tọ́ka sí ohun tí a ń jíròrò jákèjádò 1 Kọ́ríńtì 12–14, tí a sì sábà máa ń pè ní “ahọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ τῷ θεῷ
  choice: Mo dúpẹ́ lọ́wọ́ Ọlọ́run
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ pé ẹni kan dúpẹ́ fún Ọlọ́run; ó pa ìṣe ìsinsìnyí ti Gíríìkì mọ́ láìfi ìtumọ̀ àjèjì kún un.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: ju gbogbo yín lọ
  rationale: Èyí jẹ́ ìṣàfiwéra Yorùbá tó ṣe kedere, ó sì ṣojú ìtumọ̀ pé Pọ́ọ̀lù ń ṣe èyí ju ẹgbẹ́ àwọn olùgbọ́ rẹ̀ lápapọ̀ lọ.
- source_word: γλώσσαις
  choice: ní ahọ́n
  rationale: “Ahọ́n” ni ọ̀rọ̀ tí a mọ̀ sí àpèjúwe ẹ̀bùn tí a ń jíròrò ní 1 Kọ́ríńtì 12–14; ó pa àìdánilójú mọ́ nípa bóyá èdè ènìyàn ni tàbí irú ọ̀rọ̀ míì.
- source_word: λαλῶ
  choice: mo ń sọ̀rọ̀
  rationale: Ìgbékalẹ̀ onítẹ̀síwájú yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe tí Pọ́ọ̀lù sọ pé ó máa ń ṣe, ó sì yẹ fún ìṣe ìsinsìnyí nínú Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ γλώσσαις nínú àyíká ẹ̀bùn Ẹ̀mí
  choice: ní ahọ́n
  alternative: ní àwọn èdè
  rationale: “Ní ahọ́n” pa ọ̀rọ̀ pàtó tí àyíká 1 Kọ́ríńtì 12–14 ń lò mọ́, láìpinnu bóyá àwọn ahọ́n náà jẹ́ èdè ènìyàn, ọ̀rọ̀ ayọ̀ tí kò wọ́pọ̀, tàbí ẹ̀ka tó gbòòrò ju bẹ́ẹ̀ lọ. Àlàyé ìsàlẹ̀ ojú ìwé tọ́ka sí ìtumọ̀ mìíràn tó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “dúpẹ́ lọ́wọ́” gẹ́gẹ́ bí ìsọ̀rọ̀ àdánidá, a sì pa “ahọ́n” mọ́ nítorí àyíká àti àìdánilójú ọ̀rọ̀ náà.
