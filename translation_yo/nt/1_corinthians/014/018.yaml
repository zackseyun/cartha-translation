    issue: Use of 'lọ́wọ́' after dúpẹ́
    rationale: In this construction, Standard Yoruba normally writes and uses 'dúpẹ́ lọwọ ẹni kan' ('thank someone'). Revising it to 'lọwọ' improves idiomatic consistency without affecting meaning.
