id: 1CO.14.31
reference: 1 Corinthians 14:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: yo
  text: Nítorí gbogbo yín lè sọ àsọtẹ́lẹ̀ lọ́kọ̀ọ̀kan[a], kí gbogbo wọn lè kọ́ ẹ̀kọ́, kí gbogbo wọn sì lè gba ìṣírí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀kan ní àkókò kan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gba ìtọ́ni” tàbí “gba ìtùnú”; ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìṣírí, ìtọ́ni, tàbí ìtùnú gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: lè
  rationale: Ó fi agbára tàbí àǹfààní láti ṣe ohun kan hàn; ‘lè’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá ní àyíká ìtọ́ni yìí.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìtọ́ni tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé rẹ̀.
- source_word: καθ’ ἕνα
  choice: lọ́kọ̀ọ̀kan
  rationale: Ó túmọ̀ sí pé kí ẹni kọ̀ọ̀kan sọ̀rọ̀ ní ìtẹ̀lé-tẹ̀lé, kì í ṣe pé kí gbogbo wọn sọ̀rọ̀ lẹ́ẹ̀kan náà.
- source_word: πάντες
  choice: gbogbo yín / gbogbo ènìyàn / gbogbo wọn
  rationale: A pa àtúnwí ‘gbogbo’ mọ́, ṣùgbọ́n a lo àwọn ọ̀nà Yorùbá àdánidá tó bá ipò ọ̀kọ̀ọ̀kan mu láì fi àlàyé tóóró kún ẹni tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: προφητεύειν
  choice: sọ àsọtẹ́lẹ̀
  rationale: Èyí pa ẹ̀ka ọ̀rọ̀ Pọ́ọ̀lù nípa iṣẹ́ àsọtẹ́lẹ̀ mọ́, láì sọ ọ́ di àlàyé tóóró ju orísun lọ.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde tí a ń retí hàn.
- source_word: μανθάνωσιν
  choice: lè kọ́ ẹ̀kọ́
  rationale: Ó pa ìtumọ̀ gbígbà ìmọ̀ tàbí ẹ̀kọ́ mọ́ nínú èdè Yorùbá tó ṣe kedere.
- source_word: παρακαλῶνται
  choice: lè gba ìṣírí
  rationale: Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìṣírí, ìgbani-níyànjú tàbí ìtùnú; ‘gba ìṣírí’ mú ìtumọ̀ fífẹ̀ tó bá ìgbéga ìjọ mu.
theological_decisions:
- issue: Ìwọ̀n àwọn tí πάντες (‘gbogbo’) ń tọ́ka sí nínú ìjọ
  choice: A túmọ̀ rẹ̀ pẹ̀lú ‘gbogbo’ láì sọ pé àwọn wòlíì nìkan ni tàbí gbogbo ọmọ ìjọ láìyẹsẹ̀.
  alternative: ‘gbogbo àwọn wòlíì’ tàbí ‘gbogbo yín láìyẹsẹ̀’
  rationale: Àyíká ọ̀rọ̀ ló ń sọ àwọn tí wọ́n lè sọ àsọtẹ́lẹ̀ àti àwọn tí wọ́n ń gbọ́ di mímọ̀. A kò fẹ́ yanju ìwọ̀n ọ̀rọ̀ náà ju bí Gíríìkì ṣe ṣe lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘sọ àsọtẹ́lẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí a mọ̀, a sì pa àtúnwí ‘gbogbo’ àti ìtumọ̀ ìṣètò ìjọ mọ́.
