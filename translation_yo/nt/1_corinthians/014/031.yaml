  terminology: ‘sọ àsọtẹ́lẹ̀,’ ‘kọ́ ẹ̀kọ́,’ àti ‘gba ìṣírí’ bá ọ̀rọ̀ Pọ́ọ̀lù mu. Àlàyé ìsàlẹ̀ (b) yẹ kí ó tún darúkọ èrò ‘ìtọ́ni/ìwàásù ìmóríyá’ fún παρακαλέω, kì í ṣe ìṣírí àti ìgbani-níyànjú nìkan.
