  to: Nítorí gbogbo yín lè sọ àsọtẹ́lẹ̀ lọ́kọ̀ọ̀kan[a], kí gbogbo wọn lè kọ́ ẹ̀kọ́, kí gbogbo wọn sì lè gba ìṣírí[b].
