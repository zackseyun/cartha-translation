  source_fidelity: Ìtumọ̀ náà gba agbára δύνασθε, ìdí γάρ, ìtẹ̀lé καθ’ ἕνα, ète ἵνα, àti ìtumọ̀ pàtàkì παρακαλῶνται dáadáa. Síbẹ̀, ‘gbogbo ènìyàn’ lè gbooro sí gbogbo ènìyàn ní ìtumọ̀ àgbáyé, níbi tí πάντες fi sílẹ̀ láìsọ ẹni tí ó wà nínú ẹgbẹ́ náà.
