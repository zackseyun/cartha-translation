  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Gbólóhùn àkọ́kọ́ tẹ̀ lé ìtumọ̀ àyíká, nígbà tí àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀rọ̀ φωνή/ἄφωνος mọ́.
