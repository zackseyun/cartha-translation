translation:
  language: yo
  text: Ó ṣeé ṣe kí irú èdè púpọ̀ gan-an wà ní ayé[a], kò sì sí èyíkéyìí nínú wọn tí kò ní ìtumọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Ó ṣeé ṣe kí irú ohùn púpọ̀ gan-an wà ní ayé, kò sì sí èyíkéyìí nínú wọn tí kò ní ohùn.”'
    reason: φωνῶν lè túmọ̀ sí “ohùn” tàbí “èdè,” ἄφωνον sì lè túmọ̀ ní tààrà sí “aláìní-ohùn”; àṣàyàn yìí pa ìtumọ̀ gbooro àti àwòrán ọ̀rọ̀ Gíríìkì mọ́.
lexical_decisions:
- source_word: τοσαῦτα
  choice: púpọ̀
  rationale: Ó fi ọ̀pọ̀lọpọ̀ iye hàn láìsọ iye pàtó; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: εἰ τύχοι
  choice: Ó ṣeé ṣe kí
  rationale: Ó pa ìṣiyèméjì onírẹ̀lẹ̀ inú gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: γένη
  choice: onírúurú
  rationale: Ó túmọ̀ sí oríṣiríṣi irú tàbí ẹ̀ka, ó sì bá èdè Yorùbá mu dáadáa.
- source_word: φωνῶν
  choice: èdè
  rationale: φωνή lè jẹ́ ohùn, èdè, tàbí ohun tí a sọ; nínú àyíká ọ̀rọ̀ nípa sísọ àti òye, “èdè” ni ìtumọ̀ àdánidá jù, nígbà tí àṣàyàn gbooro “ohùn” wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐν κόσμῳ
  choice: ní ayé
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tí ó wọ́pọ̀, fún κόσμος nínú àyíká yìí.
- source_word: οὐδὲν ἄφωνον
  choice: kò sì sí èyíkéyìí tí kò ní ìtumọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄφωνος túmọ̀ ní tààrà sí aláìní-ohùn, nínú ìjíròrò nípa èdè, ọ̀rọ̀ náà tọ́ka sí ohun tí kò ní ìtumọ̀; àlàyé ìsàlẹ̀ pa àwòrán gangan mọ́.
