id: 1CO.14.26
reference: 1 Corinthians 14:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: yo
  text: Ǹjẹ́, kí ni a ó sọ nípa èyí, ẹ̀yin ará[a]? Nígbà tí ẹ bá péjọ, ẹnì kọ̀ọ̀kan ní sáàmù kan, ó ní ẹ̀kọ́ kan, ó ní ìṣípayá kan, ó ní ahọ́n kan[b], ó sì ní ìtumọ̀ kan. Kí a máa ṣe ohun gbogbo fún ìmúgbára.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ará” níbí ń tọ́ka sí gbogbo ìjọ, títí kan àwọn obìnrin àti àwọn ọkùnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èdè kan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ahọ́n tàbí èdè; “ahọ́n” pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ nínú ìjíròrò yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Ǹjẹ́, kí ni èyí túmọ̀ sí
  rationale: Ó mú ìbéèrè àsọyé Gíríìkì wá sí Yorùbá àdánidá, ó sì fi hàn pé Pọ́ọ̀lù ń yọ ìlànà ìṣe jáde látinú ọ̀rọ̀ tó ṣáájú.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún àwọn ọmọ ìjọ, kò sì dá akọ nìkan mọ́; àlàyé ìsàlẹ̀ fi ìwọ̀n ìtumọ̀ inú àyíká hàn.
- source_word: ὅταν συνέρχησθε
  choice: nígbà tí ẹ bá péjọ
  rationale: Gbólóhùn yìí jẹ́ Yorùbá òde òní tó ṣe kedere, ó sì pa ìtumọ̀ ìpéjọpọ̀ tó máa ń ṣẹlẹ̀ mọ́.
- source_word: ἕκαστος
  choice: ẹnì kọ̀ọ̀kan
  rationale: Ó pa agbára ìpínkiri ọ̀rọ̀ Gíríìkì mọ́, pé olúkúlùkù ló mú ohun kan wá.
- source_word: ψαλμὸν
  choice: sáàmù kan
  rationale: Ó pa ọ̀rọ̀ pàtó fún orin sáàmù mọ́ dípò fífẹ̀ sí i sí orin lásán.
- source_word: διδαχὴν
  choice: ẹ̀kọ́ kan
  rationale: Ọ̀rọ̀ yìí ṣe kedere, ó sì bá ohun tí ẹnì kan lè pín nínú ìpéjọ ìjọ mu.
- source_word: ἀποκάλυψιν
  choice: ìṣípayá kan
  rationale: Ó fi ìtumọ̀ ohun tí a ṣí payá tàbí tí a fi hàn sílẹ̀ láìṣe àfikún ìtumọ̀ ẹ̀kọ́ ìsìn kan.
- source_word: γλῶσσαν
  choice: ahọ́n kan
  rationale: “Ahọ́n” pa àwòrán àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́, nítorí γλῶσσα lè túmọ̀ sí ahọ́n tàbí èdè; àlàyé ìsàlẹ̀ mú kí lílò rẹ̀ yé òǹkàwé.
- source_word: ἑρμηνείαν
  choice: ìtumọ̀ kan
  rationale: Ó bá iṣẹ́ ṣíṣe ohun tí a sọ ní ahọ́n yé ìjọ mu, láìfi dandan pinnu pé ìtumọ̀ èdè lásán ni.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Kí ohun gbogbo wáyé fún gbígbé ìjọ ró
  rationale: “Wáyé” mú agbára àṣẹ γινέσθω jáde, “gbígbé ìjọ ró” sì pa àwòrán ìkọ́lé οἰκοδομή mọ́ ní Yorùbá tó ṣeé lóye.
theological_decisions:
- issue: Ìkíni akọ tó dúró fún gbogbo ìjọ
  choice: Lo “ẹ̀yin ará” nínú ẹsẹ̀, kí àlàyé sì sọ pé gbogbo ìjọ ni ó kàn.
  alternative: “Ẹ̀yin arákùnrin àti arábìnrin”
  rationale: ἀδελφοί jẹ́ ọ̀pọ̀ akọ ní Gíríìkì, ṣùgbọ́n ó ń bá gbogbo ìjọ sọ̀rọ̀ ní àyíká yìí. “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó lè gba gbogbo wọn láìfi akọ tàbí abo kún ọ̀rọ̀ orísun.
- issue: Ìtumọ̀ γλῶσσα nínú orí 12–14
  choice: Lo “ahọ́n” nínú ẹsẹ̀, kí a sì tọ́ka sí “èdè” gẹ́gẹ́ bí òmíràn.
  alternative: “èdè”
  rationale: Èyí pa ìfẹ̀sẹ̀mulẹ̀ ọ̀rọ̀ Pọ́ọ̀lù àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn rẹ̀ mọ́, láìpinnu pé èdè ènìyàn tí a mọ̀, ọ̀rọ̀ ìmísí, tàbí ohun tó gbòòrò ju bẹ́ẹ̀ lọ ni.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé lásán. Àtúnsọ “ó ní” pa ìtẹnumọ́ àtòjọ Gíríìkì mọ́, nígbà tí “gbígbé ìjọ ró” mú àwòrán ìkọ́lé wá sí Yorùbá àdánidá.
