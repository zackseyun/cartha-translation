id: 1CO.14.28
reference: 1 Corinthians 14:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: yo
  text: Ṣùgbọ́n bí kò bá sí olùtumọ̀ èdè, kí ó dákẹ́ nínú ìjọ[a], kí ó sì bá ara rẹ̀ àti Ọlọ́run sọ̀rọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú ìpéjọ” tàbí “nínú ìpéjọ àwọn onígbàgbọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διερμηνευτής
  choice: atúmọ̀ èdè
  rationale: Ọ̀rọ̀ náà tọ́ka sí ẹni tí ó mú èdè tí a sọ yé àwọn ẹlòmíràn; “atúmọ̀ èdè” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere ní àyíká yìí.
- source_word: σιγάτω
  choice: kí ó dákẹ́
  rationale: Ó jẹ́ àṣẹ ẹni kẹta ẹyọ; “kí ó dákẹ́” fi agbára àṣẹ náà hàn ní Yorùbá àdánidá.
- source_word: ἐν ἐκκλησίᾳ
  choice: nínú ìjọ
  rationale: Ní 1 Kọrinti 14, ἐκκλησία tọ́ka sí ìpéjọpọ̀ àwọn onígbàgbọ́; “ìjọ” jẹ́ èdè Yorùbá tí ó wọ́pọ̀, bó tilẹ̀ jẹ́ pé “ìpéjọ” tún ṣeé lò.
- source_word: ἑαυτῷ
  choice: bá ara rẹ̀ ... sọ̀rọ̀
  rationale: Ó pa ìtumọ̀ arọ́pò-orúkọ afẹ̀yìntì mọ́ láì fi “ní ìkọ̀kọ̀” tàbí àlàyé mìíràn kún un.
- source_word: λαλείτω
  choice: kí ó sì máa ... sọ̀rọ̀
  rationale: Àṣẹ náà tẹ̀ síwájú, ìrísí àsìkò ìsinsìnyí sì lè ní ìmọ̀lára ìṣe tí ń bá a lọ; “máa sọ̀rọ̀” jẹ́ àdánidá ní Yorùbá.
- source_word: τῷ θεῷ
  choice: àti Ọlọ́run
  rationale: Àpapọ̀ pẹ̀lú gbólóhùn “bá ... sọ̀rọ̀” fi hàn pé ọ̀rọ̀ náà tún ń lọ sí ọ̀dọ̀ Ọlọ́run.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Ṣùgbọ́n bí kò bá sí
  rationale: Ó tú gbólóhùn àídájú pẹ̀lú ọ̀rọ̀-ìṣe abẹ́lẹ̀ εἰμί sí Yorùbá àdánidá, ó sì fi àtakò δέ hàn.
theological_decisions:
- issue: Ìwọ̀n àṣẹ láti dákẹ́ nígbà ìjọsìn ìjọ
  choice: Àṣẹ náà dá ọ̀rọ̀ tí a ń sọ sí gbogbo ìjọ dúró nígbà tí kò sí atúmọ̀ èdè, ṣùgbọ́n ó pa ọ̀rọ̀ sí ara ẹni àti sí Ọlọ́run mọ́.
  alternative: Kí ẹni náà dá gbogbo ọ̀rọ̀ sísọ dúró pátápátá; tàbí kí ó máa bá a lọ ní gbangba bí ẹni pé ó ń bá ìjọ sọ̀rọ̀.
  rationale: Ìyàtọ̀ láàárín “kí ó dákẹ́ nínú ìjọ” àti “kí ó ... bá ara rẹ̀ àti Ọlọ́run sọ̀rọ̀” fi hàn pé ohun tí a dè ni ọ̀rọ̀ gbangba sí ìpéjọ, kì í ṣe gbogbo ọ̀rọ̀ sísọ. A kò fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kankan kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. “Ìjọ” ni a lò gẹ́gẹ́ bí ọ̀rọ̀ àkọ́kọ́, a sì pa àwọn àṣàyàn “ìpéjọ/àwùjọ” mọ́ sínú àlàyé ìsàlẹ̀.
