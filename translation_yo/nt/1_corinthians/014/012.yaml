revisions:
- from: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, níwọ̀n bí ẹ ti ní ìtara fún àwọn ẹ̀bùn ti Ẹ̀mí[a], ẹ máa wá ọ̀nà láti pọ̀ sí i fún gbígbé ìjọ ró.
  to: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, níwọ̀n bí ẹ ti ní ìtara fún àwọn ẹ̀bùn Ẹ̀mí[a], ẹ máa wá láti pọ̀ sí i fún kíkọ ìjọ sókè.
