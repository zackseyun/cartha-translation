id: 1CO.14.12
reference: 1 Corinthians 14:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú, níwọ̀n bí ẹ ti ní ìtara fún àwọn ẹ̀bùn Ẹ̀mí[a], ẹ máa wá láti pọ̀ sí i fún kíkọ ìjọ sókè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì: “àwọn ẹ̀mí” tàbí “àwọn ohun tẹ̀mí”; àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kí ó ń tọ́ka sí àwọn ẹ̀bùn tàbí ìfihàn Ẹ̀mí.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Bẹ́ẹ̀ náà ni ẹ̀yin pẹ̀lú
  rationale: Ó so ìtọ́ni yìí pọ̀ mọ́ àfiwé inú ọ̀rọ̀ tó ṣáájú, ó sì pa ìtumọ̀ ‘ẹ̀yin náà’ mọ́ ní Yorùbá àdánidá.
- source_word: ἐπεὶ
  choice: níwọ̀n bí
  rationale: Ó fi ìdí tí Pọ́ọ̀lù fi ń gba wọn níyànjú hàn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ní agbára ìdí.
- source_word: ζηλωταί
  choice: ní ìtara fún
  rationale: Ó sọ ìfẹ́ líle àti ìforúkọsílẹ̀ ọkàn wọn sí ohun tẹ̀mí ní èdè Yorùbá tó ṣe kedere, láìfi ìdájọ́ búburú kún un.
- source_word: πνευμάτων
  choice: àwọn ẹ̀bùn ti Ẹ̀mí[a]
  rationale: Àyíká 1 Kọ́ríńtì 12–14 ń sọ̀rọ̀ nípa àwọn ìfihàn tàbí ẹ̀bùn tí Ẹ̀mí ń fúnni. Síbẹ̀, Gíríìkì jẹ́ ọ̀rọ̀ àkójọpọ̀ tó túmọ̀ ní tààrà sí ‘àwọn ẹ̀mí’ tàbí ‘àwọn ohun tẹ̀mí’; àlàyé ẹsẹ̀ pa àìdánilójú yẹn mọ́.
- source_word: πρὸς τὴν οἰκοδομὴν
  choice: fún gbígbé ... ró
  rationale: Ó pa àwòrán Pọ́ọ̀lù nípa kíkọ́ ilé mọ́, ṣùgbọ́n ó sọ ọ́ ní àkànlò èdè Yorùbá tó túmọ̀ sí fífún àwùjọ ní okun.
- source_word: τῆς ἐκκλησίας
  choice: ìjọ
  rationale: Nínú ọ̀rọ̀ Pọ́ọ̀lù, ó tọ́ka sí àwùjọ àwọn onígbàgbọ́ tí wọ́n péjọ; ‘ìjọ’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àyíká mu.
- source_word: ζητεῖτε
  choice: ẹ máa wá ọ̀nà
  rationale: Ó jẹ́ àṣẹ láti fi ìfẹ́ àti ìsapá lé ohun kan; àkànlò yìí jẹ́ ti Yorùbá òde òní, ó sì pa ìtumọ̀ ìlépa mọ́.
- source_word: ἵνα περισσεύητε
  choice: láti pọ̀ sí i
  rationale: Ó pa ìtumọ̀ pípọ̀, yíyanranti, tàbí níní ohun lọ́pọ̀ yanturu mọ́, láìfi ohun tí a kò sọ ní Gíríìkì kun gẹ́gẹ́ bí ohun tí wọ́n gbọdọ̀ pọ̀ sí i nínú rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πνευμάτων nínú àyíká ẹsẹ̀ náà
  choice: àwọn ẹ̀bùn ti Ẹ̀mí
  alternative: àwọn ohun tẹ̀mí; àwọn ẹ̀mí
  rationale: Àwọn orí 12–14 dá lé àwọn ìfihàn Ẹ̀mí fún àǹfààní ìjọ. Ìtumọ̀ àkọ́kọ́ mú kí ohun tí àyíká ń tọ́ka sí yé ẹni tó ń kà á, ṣùgbọ́n àlàyé ẹsẹ̀ pa ọ̀rọ̀ Gíríìkì tó gbòòrò àti àìdánilójú rẹ̀ mọ́.
- issue: Ohun tí περισσεύητε ń tọ́ka sí
  choice: A kò fi ‘nínú wọn’ kún un; a sọ pé ‘láti pọ̀ sí i fún gbígbé ìjọ ró.’
  alternative: láti ní àwọn ẹ̀bùn náà lọ́pọ̀ yanturu; láti tayọ nínú gbígbé ìjọ ró
  rationale: Gíríìkì kò sọ ohun tí wọ́n máa pọ̀ sí i nínú rẹ̀ ní tààrà. Ìtumọ̀ yìí pa ìṣòro gírámà àti ìdí—gbígbé ìjọ ró—mọ́, láìdá àlàyé ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Gbígbé ìjọ ró’ pa àwòrán οἰκοδομή mọ́ ní àkànlò tó rọrùn fún ọ̀pọ̀ ènìyàn láti lóye.
