id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: yo
  text: Nítorí náà, àwọn èdè[a] jẹ́ fún àmì, kì í ṣe fún àwọn tí ó gbàgbọ́, bí kò ṣe fún àwọn aláìgbàgbọ́[b]; ṣùgbọ́n àsọtẹ́lẹ̀ kì í ṣe fún àwọn aláìgbàgbọ́, bí kò ṣe fún àwọn tí ó gbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gidi sí “àwọn ahọ́n,” ó sì lè tọ́ka sí àwọn èdè. Nínú 1 Kọ́ríńtì 12–14, ó jẹ́ ọ̀rọ̀ tí Pọ́ọ̀lù ń lò fún ẹ̀bùn tàbí iṣẹ́ sísọ̀rọ̀ ní èdè; ìtumọ̀ yìí kò pinnu irú èdè náà.
    reason: lexical_alternative
  - marker: b
    text: Nítorí àyọlò Aísáyà 28:11–12 tí ó ṣáájú, àwọn kan lóye “àmì” níbí gẹ́gẹ́ bí àmì ìdájọ́.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ ìparí èrò tí Pọ́ọ̀lù ń mú jáde láti inú ohun tí ó ṣẹ̀ṣẹ̀ sọ.
- source_word: γλῶσσαι
  choice: àwọn èdè
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ní Yorùbá, ó sì yẹra fún lílo ‘àwọn ahọ́n,’ èyí tí yóò sábà tọ́ka sí ẹ̀yà ara. Ó tún kò pinnu bóyá àwọn èdè ènìyàn ni tàbí irú ọ̀rọ̀ míì tí a ń pè ní sísọ̀rọ̀ ní èdè.
- source_word: εἰς σημεῖόν
  choice: jẹ́ àmì
  rationale: Ó mú ipa ète tàbí àbájáde tí εἰς ní níbí jáde lọ́nà ṣókí, láì sọ irú àmì tí ó jẹ́.
- source_word: τοῖς πιστεύουσιν
  choice: fún àwọn tí ó gbàgbọ́
  rationale: Ó pa ìṣe inú participle náà mọ́, ó sì jẹ́ ọ̀nà tí ó ṣe kedere, tí ó sì wọ́pọ̀ ní Yorùbá.
- source_word: τοῖς ἀπίστοις
  choice: fún àwọn aláìgbàgbọ́
  rationale: Ó jẹ́ ọ̀rọ̀ ṣókí tí ó dájú fún àwọn tí kò gbàgbọ́, ó sì mú ìyàtọ̀ sí ‘àwọn tí ó gbàgbọ́’ hàn.
- source_word: προφητεία
  choice: àsọtẹ́lẹ̀
  rationale: Èyí ni ọ̀rọ̀ ìjọsìn Yorùbá tí a mọ̀ dáadáa fún ẹ̀bùn tàbí iṣẹ́ sisọ ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run, bí ó tilẹ̀ jẹ́ pé ní èdè ojoojúmọ́ ó tún lè ní ìtumọ̀ àsọtẹ́lẹ̀ ohun ọjọ́ iwájú.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára láàárín àwọn èdè àti àsọtẹ́lẹ̀ hàn gẹ́gẹ́ bí Gíríìkì ṣe ṣe.
theological_decisions:
- issue: Ìtumọ̀ γλῶσσαι nínú ọ̀rọ̀ nípa ẹ̀bùn Ẹ̀mí
  choice: A túmọ̀ rẹ̀ sí ‘àwọn èdè,’ láì sọ pé àwọn èdè ilẹ̀ òkèèrè nìkan ni tàbí pé ọ̀rọ̀ àràmàǹdà ni.
  alternative: ‘àwọn ahọ́n,’ ‘àwọn èdè ilẹ̀ òkèèrè,’ tàbí ‘ọ̀rọ̀ àràmàǹdà’
  rationale: Ọ̀rọ̀ Gíríìkì àti àyíká 1 Kọ́ríńtì 12–14 kò yẹ kí a fi ẹ̀kọ́ ẹ̀sìn kan pàtó yanju ìjiyàn nípa irú ìṣẹ̀lẹ̀ náà.
- issue: Ìtumọ̀ σημεῖον ní ìbáṣepọ̀ pẹ̀lú àwọn aláìgbàgbọ́
  choice: A fi sílẹ̀ ní ṣókí gẹ́gẹ́ bí ‘àmì.’
  alternative: ‘àmì ìdánilójú’ tàbí ‘àmì ìdájọ́’
  rationale: Àyọlò Aísáyà 28:11–12 ṣáájú ẹsẹ yìí lè mú kí a ka a sí àmì ìdájọ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ irú àmì náà; nítorí náà a pa ìṣòro ìtumọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tó bójú mu, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. Ìtòlẹ́sẹẹsẹ ‘kì í ṣe … bí kò ṣe …’ pa ìyàtọ̀ méjèèjì inú Gíríìkì mọ́.
