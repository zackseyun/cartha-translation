  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni kò bá jẹ́wọ́ èyí[b][a], a kì í jẹ́wọ́ òun náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ kan ní: “bí ẹnikẹ́ni kò bá mọ̀, ẹ jẹ́ kí ó wà ní àìmọ̀.” Ìka tí a tẹ̀ lé níbí ní: “bí ẹnikẹ́ni kò bá jẹ́wọ́ èyí, a kì í jẹ́wọ́ òun náà.”'
    reason: textual_variant
  - marker: b
    text: 'Ó tún lè jẹ́: “bí ẹnikẹ́ni kò bá mọ̀ èyí, a kì í mọ̀ ọ́.” Ọ̀rọ̀-ìṣe Gíríìkì kan náà ni a lò ní ohùn-ìṣe àti ní ohùn ìfaragba láti mú kí ọ̀rọ̀ náà lágbára.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: bí ... bá
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi gbé gbólóhùn oníṣ条件 kalẹ̀, láì sọ pé ohun tí a mẹ́nu kàn ṣẹlẹ̀ dájú.
- source_word: δέ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tàbí ìkìlọ̀ hàn sí ọ̀rọ̀ tó ṣáájú.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó tọ́ka sí ẹnì kọ̀ọ̀kan ní ọ̀nà gbogbogbò, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: ἀγνοεῖ
  choice: kò bá jẹ́wọ́
  rationale: Nínú àyíká ẹsẹ 37, ọ̀rọ̀ náà lè túmọ̀ sí kí ènìyàn má mọ̀ tàbí kí ó kọ̀ láti jẹ́wọ́. ‘Kò bá jẹ́wọ́’ bá ìtumọ̀ ìkọ̀ láti mọyì tàbí tẹ́wọ́ gba àṣẹ náà mu, ó sì jẹ́ kí àsopọ̀ pẹ̀lú fọ́ọ̀mù passive tó tẹ̀ lé hàn.
- source_word: ἀγνοεῖται
  choice: a kì yóò jẹ́wọ́ òun náà
  rationale: Ìtumọ̀ aláìlórúkọ yìí pa fọ́ọ̀mù passive àti àwítúnwí ọ̀rọ̀ Gíríìkì mọ́, láì sọ ẹni tó máa kọ̀ láti jẹ́wọ́ rẹ̀ ní pàtó.
theological_decisions:
- issue: Ìtumọ̀ fọ́ọ̀mù passive ἀγνοεῖται
  choice: Ẹni tó kọ̀ láti jẹ́wọ́ ìtọ́ni náà ni a kì yóò jẹ́wọ́ pẹ̀lú.
  alternative: ‘A kò mọ̀ ọ́’ tàbí, gẹ́gẹ́ bí àwọn àfọwọ́kọ kan, ‘ẹ jẹ́ kí ó wà ní àìmọ̀.’
  rationale: Ọ̀rọ̀ inú SBLGNT jẹ́ passive indicative, kì í ṣe àṣẹ. Ìtumọ̀ yìí pa ìdáhùn tó bá ìṣe ẹni náà mu mọ́, ṣùgbọ́n kò dá ẹni tó ń ṣe ìdáhùn náà lórúkọ, bóyá Ọlọ́run tàbí ìjọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. ‘Jẹ́wọ́’ níbí túmọ̀ sí mímọ̀ sí ohun kan àti títẹ́wọ́ gbà á, kì í ṣe jíjẹ́wọ́ ẹ̀ṣẹ̀. Gbólóhùn aláìlórúkọ ‘a kì yóò...’ yàgò fún fífi ẹni tó ṣe iṣẹ́ náà kún ọ̀rọ̀ Gíríìkì.
