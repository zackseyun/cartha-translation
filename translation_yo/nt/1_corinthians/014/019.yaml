id: 1CO.14.19
reference: 1 Corinthians 14:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: yo
  text: Ṣùgbọ́n nínú ìjọ, mo kúkú fẹ́ láti fi òye mi sọ ọ̀rọ̀ márùn-ún, kí n lè kọ́ àwọn ẹlòmíràn pẹ̀lú, ju láti sọ ọ̀rọ̀ ẹgbẹ̀rún mẹ́wàá ní ahọ́n kan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí “ní èdè kan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ahọ́n” tàbí “èdè”; níbí, ó ń tọ́ka sí irú ọ̀rọ̀ sísọ tí a jíròrò jákèjádò 1 Kọ́ríńtì 12–14.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: nínú ìjọ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí àwùjọ àwọn onígbàgbọ́ tí ó péjọ fún ìjọsìn; “ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédé, tí ó sì bá ìtumọ̀ àwùjọ mu.
- source_word: θέλω
  choice: mo kúkú fẹ́
  rationale: Bó tilẹ̀ jẹ́ pé θέλω túmọ̀ ní pàtàkì sí “fẹ́,” ìfiwéra tí ἢ mú wá fi hàn pé Pọ́ọ̀lù ń sọ ohun tí ó yàn láàyò. “Mo kúkú fẹ́” sọ ìfẹ́ yíyan náà ní Yorùbá àdánidá.
- source_word: πέντε λόγους
  choice: ọ̀rọ̀ márùn-ún
  rationale: Ìtumọ̀ yìí pa àwòrán ìfiwéra tó lágbára láàárín ọ̀rọ̀ márùn-ún àti ẹgbẹ̀rún mẹ́wàá mọ́.
- source_word: τῷ νοΐ μου
  choice: fi òye mi
  rationale: “Òye” fi hàn pé ọ̀rọ̀ náà jẹ́ èyí tí ẹni tó ń sọ ọ́ lóye, tí àwọn mìíràn sì lè lóye; ó yẹra fún lílo “ọkàn,” èyí tí ó lè túmọ̀ sí ìmọ̀lára tàbí òótọ́ inú ní Yorùbá.
- source_word: λαλῆσαι
  choice: sọ
  rationale: “Sọ” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì bá iṣẹ́ sísọ ọ̀rọ̀ ní gbangba mu.
- source_word: κατηχήσω
  choice: kí n lè kọ́
  rationale: κατηχέω ń tọ́ka sí fífi ẹ̀kọ́ tàbí ìtọ́nisọ́nà ẹnu fún ẹlòmíràn. “Kọ́” mú ìtumọ̀ náà jáde láìfi ìtumọ̀ ìsìn kan tí ó ṣẹ̀yìn kún un.
- source_word: ἄλλους
  choice: àwọn ẹlòmíràn
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún ọ̀rọ̀ tó túmọ̀ sí àwọn ènìyàn mìíràn.
- source_word: μυρίους λόγους
  choice: ọ̀rọ̀ ẹgbẹ̀rún mẹ́wàá
  rationale: μύριοι lè tọ́ka sí iye púpọ̀ lọ́pọ̀lọpọ̀, ṣùgbọ́n iye pàtó rẹ̀ ni ẹgbẹ̀rún mẹ́wàá; pípa iye náà mọ́ ń dá ìfiwéra Pọ́ọ̀lù dúró.
- source_word: ἐν γλώσσῃ
  choice: ní ahọ́n kan
  rationale: γλῶσσα lè túmọ̀ sí ahọ́n tàbí èdè. “Ní ahọ́n kan” pa ọ̀rọ̀ pàtàkì tí orí 12–14 ń lò mọ́, kò sì pinnu irú ìṣẹ̀lẹ̀ tí ọ̀rọ̀ náà ń tọ́ka sí kọjá ohun tí ẹsẹ náà sọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ γλῶσσα nínú àyíká 1 Kọ́ríńtì 12–14
  choice: ní ahọ́n kan
  alternative: ní èdè kan
  rationale: “Ahọ́n” pa ìtumọ̀ méjèèjì àti àríyànjiyàn nípa irú ọ̀rọ̀ tí Pọ́ọ̀lù ń sọ mọ́. Kò sọ pé ó jẹ́ èdè àjèjì lásán, bẹ́ẹ̀ ni kò pè é ní ọ̀rọ̀ ìdùnnú ẹ̀mí tàbí ṣàlàyé ìṣẹ̀lẹ̀ náà ju bí ọ̀rọ̀ Gíríìkì ṣe ṣe lọ.
translation_notes:
  register: A lo Yorùbá boṣewa tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Mo kúkú fẹ́” mú ìtumọ̀ yíyan ohun kan láàyò jáde lọ́nà àdánidá; “fi òye mi” sì pa ìyàtọ̀ láàárín ọ̀rọ̀ tí ó ṣeé lóye àti ọ̀rọ̀ ní ahọ́n mọ́.
