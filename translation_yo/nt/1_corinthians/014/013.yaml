id: 1CO.14.13
reference: 1 Corinthians 14:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Διὸ ὁ λαλῶν γλώσσῃ προσευχέσθω ἵνα διερμηνεύῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/013.yaml
  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: yo
  text: Nítorí náà, ẹni tí ó ń sọ̀rọ̀ ní ahọ́n[a] kí ó gbàdúrà, kí ó lè túmọ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ní èdè kan.” Gíríìkì ní “ní ahọ́n,” èyí sì ni ọ̀rọ̀ tí a sábà lò nínú orí yìí fún ọ̀rọ̀ tí ó nílò ìtumọ̀.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “kí ó lè túmọ̀.” Apólà Gíríìkì “ẹni tí ń sọ̀rọ̀” wà ní ẹyọ akọ gẹ́gẹ́ bí aṣojú ẹni gbogbogbò; fáàbù náà sì jẹ́ ẹni-kẹta-ẹyọ, ó ń tọ́ka padà sí ẹni náà. Arọ́pò-orúkọ Yorùbá “ó” kò fi akọ tàbí abo hàn.
    reason: grammatical_clarification
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó jẹ́ àsopọ̀ ìparí èrò tí ó ń fa àbájáde láti inú ohun tí a sọ ṣáájú; “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìtumọ̀ náà mọ́.
- source_word: ὁ λαλῶν
  choice: ẹni tí ó ń sọ̀rọ̀
  rationale: Àpólà alábápín oníarítíkù yìí dúró gẹ́gẹ́ bí orúkọ, ó sì tọ́ka sí ẹnikẹ́ni tí ó bá ń sọ̀rọ̀; ọ̀rọ̀ yìí pa ẹyọ ọ̀rọ̀ àti ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: γλώσσῃ
  choice: ní ahọ́n
  rationale: Ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, ó sì jẹ́ ọ̀rọ̀ tí Pọ́ọ̀lù sábà lò nínú orí yìí fún ọ̀rọ̀ tí ìjọ kò lè lóye láìsí ìtumọ̀. “Ahọ́n” pa ìsopọ̀ lítíréṣọ̀ àti àìdánilójú nípa irú ọ̀rọ̀ náà mọ́.
- source_word: προσευχέσθω
  choice: kí ó gbàdúrà
  rationale: Ó jẹ́ àṣẹ ẹni-kẹta ní àkókò ìsinsìnyí. Ìṣètò “kí ó…” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì yẹ fún ìyànjú tàbí àṣẹ irú èyí.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó ṣàfihàn ète tàbí ohun tí àdúrà náà ń béèrè; “kí ó lè” jẹ́ àdánidá ní Yorùbá, ó sì pa agbára ète náà mọ́.
- source_word: διερμηνεύῃ
  choice: túmọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ọ̀rọ̀ di ohun tí àwọn ẹlòmíràn lè lóye. “Túmọ̀” bá àníyàn orí yìí mu láìfi dandan sọ pé ó jẹ́ títúmọ̀ láti èdè ènìyàn kan sí òmíràn.
theological_decisions:
- issue: Ìtumọ̀ γλώσσῃ nínú 1 Kọ́ríńtì 12–14
  choice: ahọ́n
  alternative: èdè
  rationale: “Ahọ́n” pa ìsopọ̀ ọ̀rọ̀ inú gbogbo apá náà mọ́, kò sì yanjú àríyànjiyàn nípa bóyá èdè ènìyàn, ọ̀rọ̀ ìmísí tí a kò mọ̀, tàbí ẹ̀ka tó gbòòrò ni a ń tọ́ka sí.
- issue: Ẹni ẹyọ akọ gẹ́gẹ́ bí aṣojú nínú Gíríìkì
  choice: ẹni … ó
  alternative: àwọn tí wọ́n … wọ́n
  rationale: Gíríìkì lo ẹyọ akọ ní ìlànà gírámà fún ẹni aṣojú kan. Yorùbá kò pín arọ́pò-orúkọ ẹni-kẹta sí akọ àti abo, nítorí náà “ẹni … ó” pa ẹyọ àti ìtumọ̀ gbogbogbò mọ́ láìfi ìtumọ̀ akọ kún un.
- issue: Ẹni tí yóò túmọ̀
  choice: kí ó lè túmọ̀
  alternative: kí ẹlòmíràn lè túmọ̀
  rationale: Fáàbù Gíríìkì náà jẹ́ ẹni-kẹta ẹyọ, ó sì tọ́ka padà sí ẹni tí ń sọ̀rọ̀. A kò yí i padà sí olùtumọ̀ mìíràn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ahọ́n” láti pa àsọyé Pọ́ọ̀lù àti àìdánilójú gidi inú ọ̀rọ̀ náà mọ́.
