id: 1CO.14.14
reference: 1 Corinthians 14:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: yo
  text: Nítorí bí mo bá ń gbàdúrà ní ahọ́n kan[a], ẹ̀mí mi ń gbàdúrà, ṣùgbọ́n ọgbọ́n mi[b] kò so èso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní èdè kan.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí èdè tí ènìyàn ń sọ tàbí “ahọ́n” gẹ́gẹ́ bí a ti lò ó jákèjádò orí yìí fún ọ̀rọ̀ tí Ẹ̀mí ń fún ènìyàn ní agbára láti sọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òye mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Nítorí bí … bá
  rationale: “Nítorí” pa agbára àlàyé γάρ mọ́, ìṣètò “bí … bá” sì fi gbólóhùn onípo ἐάν hàn ní Yorùbá àdánidá.
- source_word: προσεύχωμαι
  choice: mo bá ń gbàdúrà
  rationale: Ìṣe tí ó ń lọ nínú gbólóhùn onípo ni a fi “bá ń gbàdúrà” sọ lọ́nà Yorùbá tí ó ṣe kedere.
- source_word: γλώσσῃ
  choice: ní ahọ́n kan
  rationale: “Ahọ́n” pa àwòrán ọ̀rọ̀ Gíríìkì àti lílò pàtàkì rẹ̀ nínú orí yìí mọ́; “kan” tún fi ẹyọ ọ̀rọ̀ náà hàn. “Èdè kan” ṣì jẹ́ ìtumọ̀ tó ṣeé ṣe.
- source_word: τὸ πνεῦμά μου
  choice: ẹ̀mí mi
  rationale: Èyí jẹ́ ìbámu tààrà pẹ̀lú ọ̀rọ̀ olùní “mi,” ó sì yàgò fún fífi “Ẹ̀mí Mímọ́” sínú ẹsẹ náà lọ́nà ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́.
- source_word: προσεύχεται
  choice: ń gbàdúrà
  rationale: Ìṣísẹ̀ onílọsíwájú jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe àkókò ìsinsìnyí ní àyíká yìí.
- source_word: ὁ δὲ νοῦς μου
  choice: ṣùgbọ́n èrò inú mi
  rationale: “Èrò inú” sọ agbára ironú tàbí ọpọlọ ènìyàn ní Yorùbá òde òní, ó sì pa ìyàtọ̀ rẹ̀ sí “ẹ̀mí mi” mọ́ láì dín νοῦς kù sí òye nìkan.
- source_word: ἄκαρπός ἐστιν
  choice: kò so èso
  rationale: Èyí pa àkàwé èso inú ἄκαρπος mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere àti àdánidá.
theological_decisions:
- issue: Ohun tí “ẹ̀mí mi” (τὸ πνεῦμά μου) ń tọ́ka sí
  choice: Ẹ̀mí ẹni tí ń sọ̀rọ̀ fúnra rẹ̀
  alternative: Ẹ̀mí Mímọ́ tí ń gbé inú ẹni náà
  rationale: Ọ̀rọ̀ olùní “mi” àti ìfiwéra rẹ̀ pẹ̀lú “èrò inú mi” tẹ̀ sí ọ̀dọ̀ ẹ̀mí ẹni náà. Síbẹ̀, ìtumọ̀ náà kò fi àlàyé mìíràn kún un tí yóò pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ náà rẹ́.
translation_notes:
  register: Yorùbá ìpele àárín tí ó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá èdè. “Ahọ́n” pa ọ̀rọ̀ pàtàkì orí 14 mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fún “èdè” gẹ́gẹ́ bí àṣàyàn ìtumọ̀.
