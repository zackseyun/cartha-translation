  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìtumọ̀ gbogbogbòò πάντα, ìyípadà δέ, ìbójúmu εὐσχημόνως, àti ìṣètò κατὰ τάξιν. Ṣùgbọ́n “kí ... máa ṣẹlẹ̀” lè fi ìtumọ̀ ìṣe àṣà/tí ń ṣẹlẹ̀ léraléra kún àṣẹ náà, ó sì yà díẹ̀ sí ìfarahàn ‘jẹ́ kí a ṣe’ nínú àyíká ẹsẹ̀ náà.
