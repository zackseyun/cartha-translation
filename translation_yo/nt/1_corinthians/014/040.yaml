  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα ⸀δὲ εὐσχημόνως καὶ κατὰ τάξιν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: yo
  text: Ṣùgbọ́n kí a ṣe ohun gbogbo ní ọ̀nà tí ó yẹ[a] àti ní ìlànà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọ̀nà tó bójú mu” dípò “ní ọ̀nà tí ó yẹ”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí ó bá ipò mu tàbí tí ó yẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ àìdánimọ̀ ọ̀pọ̀ yìí ní ìtumọ̀ gbígbòòrò; “ohun gbogbo” jẹ́ Yorùbá àdánidá tí ó sì pa gbogbo ààlà àṣẹ náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìyàtọ̀ díẹ̀ hàn láti inú ọ̀rọ̀ tí ó ṣáájú sí àṣẹ àkópọ̀ yìí.
- source_word: εὐσχημόνως
  choice: lọ́nà tí ó yẹ
  rationale: Ó túmọ̀ sí ohun tí ó bójú mu, tí ó yẹ, tí ó sì bá ipò mu; gbólóhùn yìí jẹ́ kedere àti àdánidá ní Yorùbá.
- source_word: κατὰ τάξιν
  choice: létòletò
  rationale: Ó ń tọ́ka sí ṣíṣe ohun ní ìṣètò tàbí ní ìtẹ̀lé tó yẹ; “létòletò” sọ èrò yìí ní ṣókí.
- source_word: γινέσθω
  choice: kí … máa ṣẹlẹ̀
  rationale: Ọ̀rọ̀-ìṣe àṣẹ ẹni kẹta yìí ń fúnni ní ìtọ́ni gbogbogbòò pé kí àwọn ohun inú ìjọ máa wáyé lọ́nà bẹ́ẹ̀; “kí … máa ṣẹlẹ̀” tún pa ìtumọ̀ ‘happen/take place’ ti γίνομαι mọ́ láìfi ẹni tí ó ń ṣe e kún un.
theological_decisions:
- issue: Ààlà àṣẹ Paulu nínú àyíká ìjọsìn
  choice: Ìtọ́ni gbogbogbòò pé kí gbogbo ohun inú àpéjọ máa wáyé lọ́nà tí ó yẹ àti létòletò, láìsọ irú ètò ìjọsìn ẹ̀sìn kan pàtó.
  alternative: Kí a kà á sí òfin tóóró fún ètò ìjọsìn kan tí a ti gbé kalẹ̀, tàbí sí ìlànà fún gbogbo ohun tí ìjọ ń ṣe láìka àyíká ẹsẹ̀ náà sí.
  rationale: Ẹsẹ̀ náà ṣàkópọ̀ ìjíròrò tó ṣáájú nípa ọ̀rọ̀ sísọ àti ìṣètò nínú àpéjọ. Ìtumọ̀ náà pa gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́, kò sì gbé àṣà ẹ̀sìn kan wọ inú rẹ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “lọ́nà tí ó yẹ” fún εὐσχημόνως àti “létòletò” fún κατὰ τάξιν láti yà ìbójúmu àti ìṣètò sọ́tọ̀ ní kedere.
