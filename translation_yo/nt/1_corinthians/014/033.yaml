id: 1CO.14.33
reference: 1 Corinthians 14:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: yo
  text: Nítorí Ọlọ́run kì í ṣe Ọlọ́run ìdàrúdàpọ̀, bí kò ṣe Ọlọ́run àlàáfíà,[a] gẹ́gẹ́ bí ó ti rí ní gbogbo àwọn ìjọ àwọn ẹni mímọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí Ọlọ́run kì í ṣe Ọlọ́run ìrúdurùdu, bí kò ṣe Ọlọ́run àlàáfíà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ó ti rí ní gbogbo àwọn ìjọ àwọn ènìyàn mímọ́ Ọlọ́run.” Àwọn kan so pọ̀ gbólóhùn yìí mọ́ ẹsẹ tí ó tẹ̀ lé e dípò ẹsẹ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: rúdurùdu
  rationale: Ó bá ọ̀rọ̀ nípa ìjọsìn tí ó wà létòlétò mu, ó sì lè túmọ̀ sí àìlétòlétò tàbí ìdàrúdàpọ̀ láìdín ìtumọ̀ náà kù sí ìrú-darí ọkàn nìkan.
- source_word: εἰρήνης
  choice: àlàáfíà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún àlàáfíà, ó sì dúró ní òdìkejì rúdurùdu nínú ìpéjọ ìjọ.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Ọ̀nà Yorùbá tí ó ṣe déédéé fún Ọlọ́run kan náà tí a mọ̀, kì í ṣe ọlọ́run kan lára ọ̀pọ̀.
- source_word: ὡς
  choice: gẹ́gẹ́ bí ó ti rí ní
  rationale: Ó fi àfiwé tàbí ìtọ́kasí sí ohun tí ó ń ṣẹlẹ̀ ní gbogbo àwọn ìjọ hàn, ó sì jẹ́ Yorùbá tí ó ṣàn.
- source_word: ἐκκλησίαις
  choice: ìjọ
  rationale: Ọ̀rọ̀ tí a sábà máa ń lò fún àwọn ìpéjọ àwọn onígbàgbọ́ ní ọ̀rọ̀ Páùlù.
- source_word: τῶν ἁγίων
  choice: àwọn ẹni mímọ́
  rationale: Ó pa ìtumọ̀ Páùlù mọ́ fún àwọn tí Ọlọ́run yà sí mímọ́, láìfi ìtumọ̀ ẹ̀sìn ẹgbẹ́ kan kún un.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń fúnni ní ìdí fún àwọn ìtọ́ni tí ó ṣáájú.
theological_decisions:
- issue: Ibi tí gbólóhùn ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων so mọ́
  choice: A so ó mọ́ ẹsẹ 33 gẹ́gẹ́ bí àfiwé sí ohun tí ó rí ní gbogbo ìjọ.
  alternative: A lè so ó mọ́ ẹsẹ 34, kí ó sì bẹ̀rẹ̀ gbólóhùn tuntun nípa ìwà nínú àwọn ìjọ.
  rationale: Àmì ìdákẹ́jẹ àti ìsopọ̀ girama ti jẹ́ ohun àríyànjiyàn. A tẹ̀ lé ìṣètò SBLGNT tí a pèsè, ṣùgbọ́n a pa ìtumọ̀ mìíràn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó ṣeé lóye fún gbogbo ènìyàn; a lo “rúdurùdu” fún ọ̀rọ̀ àkọ́kọ́, a sì fi “ìdàrúdàpọ̀” sí àlàyé gẹ́gẹ́ bí àṣàyàn. Gbogbo àmì ohùn ni a fi síbi tí ó bá ti yẹ.
