  naturalness: 'Àtúnṣe náà mú ìfararọ̀ àwọn apá méjèèjì gbólóhùn náà péye: ‘Ọlọ́run ìdàrúdàpọ̀ ... Ọlọ́run àlàáfíà.’ A tún fi ‘àwọn ìjọ’ sí ibi tí ‘ìjọ’ kan wà, nítorí πάσαις ταῖς ἐκκλησίαις jẹ́ púpọ̀. Àmì ohùn àti ọ̀rọ̀ àlàyé ni a tún ṣe díẹ̀ fún Yorùbá ìgbàlódé tí ó rọrùn.'
  terminology: ‘Ìdàrúdàpọ̀’ ń gbé ἀκαταστασίας kalẹ̀ dáadáa nínú àyíká ìjọsìn tí kò ní ìlànà, láìfi í mọ́ ìdàrúdàpọ̀ ọkàn nìkan. ‘Àlàáfíà,’ ‘ìjọ,’ àti ‘àwọn ẹni mímọ́’ yẹ fún εἰρήνης, ἐκκλησίαις, àti τῶν ἁγίων.
