id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: yo
  text: Nítorí Ọlọ́run ti fi àwọn nǹkan wọ̀nyí hàn fún wa nípasẹ̀ Ẹ̀mí[a]; nítorí Ẹ̀mí ń wádìí ohun gbogbo, àní ìjìnlẹ̀ Ọlọ́run.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “ti fi wọ́n hàn fún wa.” Gíríìkì kò sọ ohun tí Ọlọ́run fi hàn ní tààrà, ṣùgbọ́n a rí i nínú àyíká ọ̀rọ̀ tó ṣáájú.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “àwọn ohun jíjinlẹ̀ ti Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: fún wa
  rationale: Ó fi àwọn tó gba ìṣípayá náà hàn gẹ́gẹ́ bí dative ti olùgbà; ‘fún wa’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἀπεκάλυψεν
  choice: ti fi ... hàn
  rationale: Ọ̀rọ̀ yìí sọ nípa ìṣípayá tí Ọlọ́run ti ṣe; ‘ti fi ... hàn’ jẹ́ èdè Yorùbá àdánidá tó sì jẹ́ kí àbájáde iṣẹ́ náà hàn pé ó wúlò títí di ìsinsìnyí.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: àwọn nǹkan wọ̀nyí
  rationale: Gíríìkì fi ohun tí Ọlọ́run fihàn sílẹ̀ láìdárúkọ rẹ̀, ṣùgbọ́n àyíká ọ̀rọ̀ tó ṣáájú tọ́ka sí i; gbolohun yìí mú ìsopọ̀ náà ṣe kedere láìṣe àlàyé ju bó ṣe yẹ lọ.
- source_word: διὰ τοῦ πνεύματος
  choice: nípasẹ̀ Ẹ̀mí
  rationale: διά pẹ̀lú genitive tọ́ka sí ọ̀nà tàbí aṣojú; ‘nípasẹ̀’ pa ìtumọ̀ yẹn mọ́.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí Ẹ̀mí Ọlọ́run, ẹni tí Ọlọ́run fi ń ṣí ohun payá, tí ó sì mọ ìjìnlẹ̀ Ọlọ́run.
- source_word: ἐραυνᾷ
  choice: ń wádìí
  rationale: 'Ó pa agbára ọ̀rọ̀-ìṣe náà mọ́: ṣíṣàyẹ̀wò tàbí ṣíṣe ìwádìí jinlẹ̀.'
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó jẹ́ gbólóhùn Yorùbá àdánidá tó pa ìwọ̀n gbooro ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: καὶ
  choice: àní ... pàápàá
  rationale: 'Níhìn-ín καί ń fi apá tó ga jù lọ tẹnumọ́: Ẹ̀mí ń wádìí ohun gbogbo, títí kan ìjìnlẹ̀ Ọlọ́run.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: àwọn ìjìnlẹ̀ Ọlọ́run
  rationale: Ó pa àwòrán ohun tó jinlẹ̀ mọ́, láìtú u sí ẹ̀kọ́ tàbí ìtumọ̀ kan pàtó.
theological_decisions:
- issue: Bóyá πνεῦμα ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí ènìyàn
  choice: Ẹ̀mí Ọlọ́run ní ibi méjèèjì
  alternative: ẹ̀mí ènìyàn ní ìtumọ̀ gbogbogbò
  rationale: Àyíká ọ̀rọ̀ fi ìṣípayá Ọlọ́run lé Ẹ̀mí lọ́wọ́, ó sì sọ pé Ẹ̀mí ń wádìí àní ìjìnlẹ̀ Ọlọ́run; èyí ń tọ́ka gidigidi sí Ẹ̀mí Ọlọ́run.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘fi ... hàn’ dípò ọ̀rọ̀ ẹ̀kọ́ tó le, a sì pa àwòrán ‘ìjìnlẹ̀’ ti Gíríìkì mọ́. Àmì ohùn ni a lò níbi tí ó bá yẹ.
