  naturalness: '‘Àwọn ìjìnlẹ̀ Ọlọ́run pàápàá’ kò rọrùn tó bẹ́ẹ̀ nínú Yorùbá: ‘ìjìnlẹ̀’ lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ akojọpọ̀ fún ‘depths,’ a sì lè lo ‘àní’ láìfi ‘pàápàá’ kún un. Àwọn àtúnṣe kékeré nínú àlàyé ìsàlẹ̀ tún ń mú kí gbolohun Yorùbá rẹ̀ mọ́.'
