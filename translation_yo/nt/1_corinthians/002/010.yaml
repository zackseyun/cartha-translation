  to: Nítorí Ọlọ́run ti fi àwọn nǹkan wọ̀nyí hàn fún wa nípasẹ̀ Ẹ̀mí[a]; nítorí Ẹ̀mí ń wádìí ohun gbogbo, àní ìjìnlẹ̀ Ọlọ́run.[b]
