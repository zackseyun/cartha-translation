  - severity: low
    issue: Àmì ohùn nínú arọ́pò-orúkọ ohun
    rationale: Nínú ‘kọ́ ọ́,’ ‘ọ́’ ni fọ́ọ̀mù ohun ẹni kẹta tó yẹ; èyí mú ìkọ̀wé Yorùbá boṣewa péye.
