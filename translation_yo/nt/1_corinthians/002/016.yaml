id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: yo
  text: Nítorí, ta ni ó ti mọ èrò inú Olúwa[b], tí yóò kọ́ ọ́? Ṣùgbọ́n àwa ní èrò inú Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: lexical_alternative
  - marker: b
    text: Pọ́ọ̀lù ń tọ́ka sí Aísáyà 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: Nítorí ta ni
  rationale: “Ta ni” mú ìbéèrè àsọyé náà jáde ní Yorùbá àdánidá, “Nítorí” sì pa ìsopọ̀ àlàyé γὰρ mọ́.
- source_word: ἔγνω
  choice: ó ti mọ
  rationale: Ìṣe àṣepé “ti mọ” fi hàn pé kò sí ẹni tí ó ti dé ipò mímọ èrò inú Olúwa tó bẹ́ẹ̀.
- source_word: νοῦν
  choice: èrò inú
  rationale: Ó mú apá ìrònú àti ìhùwàsí inú tí νοῦς lè tọ́ka sí pọ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος, ó sì pa ìró àsọyé Aísáyà mọ́.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: tí yóò fi kọ́ ọ ní ìmọ̀
  rationale: Ó fi gbolohun arọ́pò-orúkọ Gíríìkì hàn, ó sì tú συμβιβάζω sí ìkọ́ni tàbí fífi òye fún ẹlòmíràn láìyí ìbéèrè àsọyé náà padà.
- source_word: ἡμεῖς δὲ
  choice: Ṣùgbọ́n àwa
  rationale: Ó tẹnumọ́ ìyàtọ̀ líle tó wà láàárín àìlèmọ̀ ènìyàn àti ohun tí àwa ní.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: àwa ní èrò inú Mèsáyà
  rationale: Ó pa ìtumọ̀ ohun-ìní ἔχομεν àti ìbáṣepọ̀ genitive mọ́; “Mèsáyà” fi ipa Χριστός gẹ́gẹ́ bí oyè ẹni àmì-oróró hàn.
theological_decisions:
- issue: Bí a ṣe tú Χριστοῦ nínú νοῦν Χριστοῦ
  choice: èrò inú Mèsáyà
  alternative: èrò inú Kristi
  rationale: Nínú àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” pa ìtumọ̀ ẹni àmì-oróró mọ́, láìṣàfikún ẹ̀kọ́ ìjọ kan pàtó.
- issue: Ẹni tí αὐτόν ń tọ́ka sí
  choice: kọ́ ọ ní ìmọ̀
  alternative: kọ́ Olúwa ní ìmọ̀
  rationale: A pa arọ́pò-orúkọ orísun mọ́ dípò fífi orúkọ rọ́pò rẹ̀; àyíká ìbéèrè náà tọ́ka sí Olúwa.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. “Kọ́ ọ ní ìmọ̀” jẹ́ ọ̀nà àdánidá láti sọ ìkọ́ni tàbí fífi òye fún ẹnì kan.
