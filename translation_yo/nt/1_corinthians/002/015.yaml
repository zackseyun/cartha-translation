id: 1CO.2.15
reference: 1 Corinthians 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí Ẹ̀mí ń darí[a] ń ṣàyẹ̀wò ohun gbogbo, ṣùgbọ́n kò sí ẹni tí ń ṣàyẹ̀wò òun fúnra rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, èyí jẹ́ ajẹtífù ẹyọ kan tí a lò bí orúkọ ẹni; ó ń tọ́ka sí ènìyàn kan tí Ẹ̀mí ń dá sí.
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: ẹni tí Ẹ̀mí ń darí
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ ẹni, ó sì ń tọ́ka sí ẹni tí Ẹ̀mí Ọlọ́run ń ṣe àkóso ìwà rẹ̀. Yíyan ọ̀rọ̀ yìí jẹ́ adayébá ní Yorùbá, kò sì fi hàn pé ọkùnrin nìkan ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: ń ṣàyẹ̀wò / lè ṣàyẹ̀wò rẹ̀
  rationale: “Ṣàyẹ̀wò” lè túmọ̀ sí fífi ohun wò dáadáa láti mọ ohun tí ó jẹ́, ó sì pa àtúnlò ọ̀rọ̀ Gíríìkì náà mọ́ nínú gbólóhùn méjèèjì. Àkópọ̀ “kò sí ẹni tí ó lè…” sọ passive Gíríìkì náà ní Yorùbá adayébá láì sọ pé kò ṣeé ṣe rárá ní ìtumọ̀ agbára.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Èyí pa gbólóhùn Gíríìkì tí kò ní ààlà mọ́, láì fi “ohun ti Ẹ̀mí” kún un nínú ẹsẹ náà.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Èyí pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì náà mọ́.
- source_word: ὑπ’ οὐδενὸς
  choice: kò sí ẹni tí ó
  rationale: Ìṣètò yìí jẹ́ Yorùbá adayébá, ó sì pa ìkọ̀sẹ̀ pátápátá ti οὐδενός mọ́.
theological_decisions:
- issue: Ààlà ọ̀rọ̀ Pọ́ọ̀lù nípa ẹni tí Ẹ̀mí ń darí
  choice: A pa “ohun gbogbo” àti “kò sí ẹni” mọ́ láì dín wọn kù nínú ẹsẹ náà.
  alternative: Kí a sọ ní kedere pé àwọn ohun ti Ẹ̀mí nìkan ni ó ń ṣàyẹ̀wò.
  rationale: Ọ̀rọ̀ Gíríìkì sọ ohun náà láì fi ààlà hàn; àyíká ẹsẹ ni yóò darí òye rẹ̀. Fífi ààlà sínú ẹsẹ yóò tú ìforígbárí inú ọ̀rọ̀ náà ju bí orísun ṣe ṣe lọ.
- issue: Ìtumọ̀ πνευματικός
  choice: ẹni tí Ẹ̀mí ń darí
  alternative: ẹni tẹ̀mí / ẹni ti ẹ̀mí
  rationale: Àyíká 1 Kọrinti 2 tọ́ka sí Ẹ̀mí Ọlọ́run. Ọ̀rọ̀ “ẹni tẹ̀mí” lè dà bí ẹni pé ó kan ẹni olùfọkànsìn tàbí ẹni tí ó ní ìwà ẹ̀sìn, nítorí náà àyàn yìí mú ìtọ́kasí sí Ẹ̀mí hàn láì sọ ẹ̀kọ́ ìjọ kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì. A lo “Ẹ̀mí” pẹ̀lú lẹ́tà ńlá láti fi ìtọ́kasí àyíká sí Ẹ̀mí Ọlọ́run hàn. “Ṣàyẹ̀wò” ní ìwọ̀ntúnwọ̀nsì láàárín ṣíṣe ìwádìí, fífi ọgbọ́n yà ohun sọ́tọ̀, àti ṣíṣe ìdájọ́; ó sì jẹ́ kí àtúnlò ọ̀rọ̀ Gíríìkì náà dúró.
