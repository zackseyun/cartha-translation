id: 1CO.2.2
reference: 1 Corinthians 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: yo
  text: Nítorí mo pinnu láti má mọ ohunkóhun láàárín yín, bí kò ṣe Jésù Mèsáyà[a]—àti òun tí a kàn mọ́ àgbélébùú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì náà ni “Jésù Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: mo pinnu
  rationale: Nínú àyíká ọ̀rọ̀ yìí, κρίνω ń sọ ìpinnu tí Pọ́ọ̀lù fi ọkàn rẹ̀ ṣe, kì í ṣe ìdájọ́ nílé ẹjọ́; “mo pinnu” jẹ́ Yorùbá àdánidá tó sì pa ìmọ̀lára ìpinnu ṣinṣin náà mọ́.
- source_word: τι εἰδέναι
  choice: pé n kò ní mọ ohun kan
  rationale: Pẹ̀lú οὐ àti εἰ μὴ, gbólóhùn náà fi ohun gbogbo sílẹ̀, ó sì dá ohun kan ṣoṣo yà; ọ̀nà yìí mú ìtumọ̀ náà hàn ní Yorùbá láì sọ pé Pọ́ọ̀lù kò ní ìmọ̀ nípa ohun mìíràn rárá.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó tọ́ka sí wíwà àti iṣẹ́ ìránṣẹ́ Pọ́ọ̀lù pẹ̀lú àwọn ará Kọ́ríńtì; “láàárín yín” jẹ́ kedere, ó sì bá èdè Yorùbá mu.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn ìyọkúrò tó túmọ̀ sí “àyàfi.”
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè tó fi Jésù hàn gẹ́gẹ́ bí Ẹni Àmì-òróró; “Mèsáyà” pa agbára oyè náà mọ́, nígbà tí àṣàyàn “Kristi” wà nínú àlàyé ìsàlẹ̀.
- source_word: τοῦτον ἐσταυρωμένον
  choice: àti òun gẹ́gẹ́ bí ẹni tí a ti kàn mọ́ àgbélébùú
  rationale: “Òun” ń pa ìtẹnumọ́ τοῦτον mọ́, “tí a ti kàn” sì ń fi ipò ẹni tí a ti kàn mọ́ àgbélébùú hàn, bí perfect passive participle náà ṣe ń ṣe, dípò kí ó jẹ́ ìròyìn ìṣẹ̀lẹ̀ lásán.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká ọ̀rọ̀ náà ń gbé oyè àti iṣẹ́ ìgbàlà Jésù kalẹ̀; “Mèsáyà” mú ìtumọ̀ oyè náà jáde ní gbangba, ṣùgbọ́n a pa “Kristi,” tí ó wọ́pọ̀ nínú ìlò ìjọ, mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
- issue: Agbára ἐσταυρωμένον
  choice: ẹni tí a ti kàn mọ́ àgbélébùú
  alternative: pé a kàn án mọ́ àgbélébùú
  rationale: Àṣàyàn àkọ́kọ́ pa ìtẹnumọ́ sí Jésù nínú ipò rẹ̀ gẹ́gẹ́ bí ẹni tí a ti kàn mọ́ àgbélébùú mọ́; àṣàyàn kejì lè yí participle náà padà sí ìròyìn ìṣẹ̀lẹ̀ lásán.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. “Mo pinnu” àti “láàárín yín” rọrùn fún òǹkàwé lónìí; ìṣètò “àti òun gẹ́gẹ́ bí ẹni...” mọ̀ọ́mọ̀ pa ìtẹnumọ́ àti ìwọ̀n gbólóhùn Gíríìkì náà mọ́.
