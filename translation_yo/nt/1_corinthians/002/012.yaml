  to: Ṣùgbọ́n àwa kò gba ẹ̀mí ayé, bí kò ṣe Ẹ̀mí tí ó láti ọ̀dọ̀ Ọlọ́run, kí a lè mọ̀[a] àwọn ohun tí Ọlọ́run fún wa nípasẹ̀ oore-ọ̀fẹ́[b].
