id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: yo
  text: Ṣùgbọ́n àwa kò gba ẹ̀mí ayé, bí kò ṣe Ẹ̀mí tí ó láti ọ̀dọ̀ Ọlọ́run, kí a lè mọ̀[a] àwọn ohun tí Ọlọ́run fún wa nípasẹ̀ oore-ọ̀fẹ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lóye.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí Ọlọ́run fún wa lọ́fẹ̀ẹ́,” tàbí “tí Ọlọ́run fún wa gẹ́gẹ́ bí ẹ̀bùn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: ẹ̀mí / Ẹ̀mí
  rationale: A lo “ẹ̀mí” fún ìṣàkóso tàbí agbára tí ayé ń mú ṣiṣẹ́, a sì lo “Ẹ̀mí” pẹ̀lú lẹ́tà ńlá fún Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: κόσμου
  choice: ayé
  rationale: “Ayé” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún κόσμος níbí, ó sì ń tọ́ka sí ètò ènìyàn tó wà ní ìtakò sí Ọlọ́run.
- source_word: ἐλάβομεν
  choice: kò gba
  rationale: Fọ́ọ̀mù ìṣe Yorùbá yìí sọ ìṣe tí ó ti ṣẹlẹ̀ ní kedere; àyíká ọ̀rọ̀ ló ń fi ipa rẹ̀ tí ó ṣì wà hàn.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: tí ó ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa ìbáṣepọ̀ orísun tí ἐκ ń fi hàn mọ́.
- source_word: ἵνα εἰδῶμεν
  choice: kí a lè mọ̀
  rationale: Ó pa gbólóhùn ète ἵνα mọ́, ó sì mú ìtumọ̀ ìmọ̀ inú οἶδα jáde láìfi àlàyé kún un.
- source_word: χαρισθέντα
  choice: tí Ọlọ́run fi oore-ọ̀fẹ́ fún wa
  rationale: Gbólóhùn yìí mú èrò fífúnni nítorí oore-ọ̀fẹ́ inú χαρίζομαι jáde, dípò kí ó sọ pé “fún” lásán.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: àwọn ohun tí Ọlọ́run fi oore-ọ̀fẹ́ fún wa
  rationale: “Àwọn ohun” pa ìtẹ̀síwájú ọ̀pọ̀ àárín tí ó gbòòrò mọ́, láìdín in kù sí àwọn ẹ̀bùn Ẹ̀mí pàtó.
theological_decisions:
- issue: Bóyá πνεῦμα τὸ ἐκ τοῦ θεοῦ ń tọ́ka sí Ẹ̀mí Mímọ́ ní pàtó
  choice: Ẹ̀mí tí ó ti ọ̀dọ̀ Ọlọ́run wá
  alternative: ẹ̀mí tí ó ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Nínú ìyàtọ̀ tí Pọ́ọ̀lù fi ṣe pẹ̀lú “ẹ̀mí ayé,” ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ tí Ọlọ́run fi fún àwọn onígbàgbọ́ ni ó ń tọ́ka sí; lẹ́tà ńlá ń fi ìtumọ̀ yìí hàn, ṣùgbọ́n ọ̀rọ̀ náà ṣì sún mọ́ èdè Gíríìkì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàndá tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì gbe àwọn àmì àlàyé ẹsẹ̀ sí ọ̀rọ̀ tí wọ́n ń ṣàlàyé, nítorí àwọn ibi tí wọ́n wà nínú English POB kò bá àkóónú àlàyé náà mu.
