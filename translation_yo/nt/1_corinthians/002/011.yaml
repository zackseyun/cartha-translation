id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: yo
  text: 'Nítorí ta ni nínú àwọn ènìyàn tí ó mọ àwọn ohun ti ènìyàn kan[a], bí kò ṣe ẹ̀mí ẹni náà tí ó wà nínú rẹ̀? Bẹ́ẹ̀ náà ni, kò sí ẹni tí ó ti mọ àwọn ohun ti Ọlọ́run, bí kò ṣe Ẹ̀mí Ọlọ́run.


    [a] Tàbí, “èrò inú ènìyàn kan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èrò inú ènìyàn kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: àwọn ènìyàn / ènìyàn kan
  rationale: Àwọn ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe ọkùnrin nìkan. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá ènìyàn láìfi akọ tàbí abo kún un.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: àwọn ohun ti ènìyàn kan
  rationale: Gbólóhùn Gíríìkì náà gbòòrò ju ‘èrò’ nìkan lọ. Èdè yìí pa ìtumọ̀ rẹ̀ mọ́, ó sì mú kí ìfiwéra pẹ̀lú ‘àwọn ohun ti Ọlọ́run’ dúró ṣinṣin; a fi ‘èrò inú ènìyàn kan’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: ẹ̀mí ẹni náà tí ó wà nínú rẹ̀
  rationale: Èyí tẹ̀ lé ìṣètò ọ̀rọ̀ orísun ní pẹkipẹki, ó sì fi hàn pé ẹ̀mí náà jẹ́ ti ẹni tí a ń sọ̀rọ̀ rẹ̀, ó sì wà nínú rẹ̀.
- source_word: οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ọ̀nà àdánidá láti fi ìfiwéra tó sún mọ́ra hàn.
- source_word: ἔγνωκεν
  choice: ti mọ
  rationale: A lo ‘ti mọ’ láti fi ipa ọ̀rọ̀-ìṣe pípé Gíríìkì hàn, láìsọ pé ó jẹ́ ìmọ̀ ti àkókò àtijọ́ nìkan.
- source_word: τὰ τοῦ θεοῦ
  choice: àwọn ohun ti Ọlọ́run
  rationale: Èyí pa ìtumọ̀ gbòòrò ti ọ̀rọ̀ orísun mọ́, kò sì dín un kù sí ‘èrò Ọlọ́run’ nìkan.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Ẹ̀mí Ọlọ́run
  rationale: Nínú àyíká ọ̀rọ̀ yìí, gbólóhùn náà ń tọ́ka sí Ẹ̀mí ti Ọlọ́run fúnra rẹ̀; lílo lẹ́tà ńlá bá ìlò Yorùbá fún orúkọ oyè Ọlọ́run mu.
theological_decisions:
- issue: Bóyá πνεῦμα τοῦ θεοῦ jẹ́ orúkọ oyè Ẹni àtọ̀runwá tàbí ‘ẹ̀mí’ lásán.
  choice: Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí Ọlọ́run
  rationale: Àyíká 1 Kọríńtì 2 ń sọ̀rọ̀ nípa Ẹ̀mí tí ń wádìí, tí ó sì ń fi àwọn ohun Ọlọ́run hàn. Lẹ́tà ńlá ń tọ́ka sí ẹni tí ọ̀rọ̀ náà dúró fún, láìfi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ orísun.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa ìfararora gírámà àti ìtumọ̀ láàárín ‘àwọn ohun ti ènìyàn kan’ àti ‘àwọn ohun ti Ọlọ́run’ mọ́, a sì lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
