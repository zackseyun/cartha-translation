  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa: «Mo sì» ń gbé ìsopọ̀ κἀγώ, «wà pẹ̀lú yín» jẹ́ ìtumọ̀ tó yẹ fún ἐγενόμην πρὸς ὑμᾶς nínú àyíká yìí, àwọn gbólóhùn mẹ́ta «nínú» sì pa ìtẹnumọ́ ìtẹ̀lé ἐν mọ́. «Àìlera», «ìbẹ̀rù», àti «ìwárìrì púpọ̀» ṣe ìtumọ̀ ἀσθενείᾳ, φόβῳ, àti τρόμῳ πολλῷ ní ìṣòtítọ́, láìfi ìtumọ̀ ẹ̀sìn tàbí ìdí mìíràn kún un.'
  naturalness: Gbólóhùn náà jẹ́ Yorùbá boṣewa tó mọ́, tó ní ìwọ̀n ìbílẹ̀, tí àmì ohùn rẹ̀ sì pé. Ìtẹ̀lé «nínú ... nínú ... àti nínú ...» dùn ní Yorùbá, ó sì ṣàfihàn ìṣọ̀kan ọ̀rọ̀ Gíríìkì.
  terminology: «Àìlera» jẹ́ ọ̀rọ̀ gbòòrò tó bójú mu fún ἀσθένεια; «ìbẹ̀rù» kò sọ ọ́ di ìfọkànsìn tàbí ìṣọ́ra lásán; «ìwárìrì púpọ̀» sì mú agbára πολλῷ hàn. Àlàyé ìsàlẹ̀ náà fún «Mo wá sí ọ̀dọ̀ yín» jẹ́ yíyàn tí ó ṣeé gbà látinú ἐγενόμην πρὸς ὑμᾶς, ó sì ní àmì [a] tó pé.
