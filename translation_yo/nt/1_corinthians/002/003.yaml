id: 1CO.2.3
reference: 1 Corinthians 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κἀγὼ ἐν ἀσθενείᾳ καὶ ἐν φόβῳ καὶ ἐν τρόμῳ πολλῷ ἐγενόμην πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: yo
  text: Mo sì wà pẹ̀lú yín nínú àìlera,[a] nínú ìbẹ̀rù, àti nínú ìwárìrì púpọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo wá sí ọ̀dọ̀ yín nínú àìlera, nínú ìbẹ̀rù, àti nínú ìwárìrì púpọ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγώ
  choice: Mo sì
  rationale: Ó pa ìsopọ̀ mọ́ ọ̀rọ̀ tó ṣáájú mọ́, ó sì jẹ́ kí Pọ́ọ̀lù tọ́ka sí ara rẹ̀ ní kedere láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν ἀσθενείᾳ
  choice: nínú àìlera
  rationale: Àìlera jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtúmọ̀ gbígbòòrò ἀσθένεια mọ́, yálà ó jẹ́ ailagbara tàbí ipò ẹlẹgẹ́.
- source_word: ἐν φόβῳ
  choice: nínú ìbẹ̀rù
  rationale: Ó tú gbólóhùn náà ní tààrà, láìdín ìbẹ̀rù kù sí ọ̀wọ̀ tàbí ìṣọ́ra lásán.
- source_word: ἐν τρόμῳ πολλῷ
  choice: nínú ìwárìrì púpọ̀
  rationale: Ìwárìrì ṣe aṣojú τρόμος, púpọ̀ sì pa agbára ọ̀rọ̀ πολλῷ mọ́ ní Yorùbá àdánidá.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: Mo wà pẹ̀lú yín
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó fi ipò Pọ́ọ̀lù ní àárín àwọn ará Kọ́ríńtì hàn lọ́nà àdánidá. Ìtumọ̀ tó dojú kọ bíbọ̀ rẹ̀ sí ọ̀dọ̀ wọn ṣì ṣeé ṣe, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
