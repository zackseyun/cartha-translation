review_pass:
  verdict: revise
  source_fidelity: The draft retains the adversative, citation formula, eye–ear–heart sequence, resumptive clause, and the completed divine preparation for those who love God. However, “ru sí ọkàn” is not a natural Yoruba expression for something occurring to or entering a person's inward thought, and it risks obscuring the idiom.
  naturalness: “Tí kò sì wọ ọkàn ènìyàn” is idiomatic, clear Standard Yoruba and adequately conveys the Greek figurative expression without forcing its spatial image into unnatural Yoruba. Using “Àwọn ohun tí ... àwọn ohun tí” better reflects the plural correlatives and reads smoothly in this elevated citation.
  terminology: “Ọlọ́run,” “ọkàn ènìyàn,” and “àwọn tí ó fẹ́ràn rẹ̀” are appropriate, theologically neutral, and natural. The generic force of ἀνθρώπου is preserved by “ènìyàn.”
  issues:
  - severity: medium
    issue: The phrase “tí kò sì ru sí ọkàn ènìyàn” is unnatural and unclear in Standard Yoruba.
    rationale: Although intended to mirror ἀνέβη literally, “ru sí ọkàn” is not the normal Yoruba idiom for an idea not entering or occurring to a person. It can distract from the meaning. “Wọ ọkàn” naturally conveys the metaphor while preserving “ọkàn.”
  - severity: low
    issue: The correlative plural expression is rendered with singular “Ohun” in both positions.
    rationale: Yoruba can use singular generic nouns, but “Àwọn ohun tí ... àwọn ohun tí” more clearly represents the Greek plural correlatives and its resumptive poetic structure.
  revised_text: 'Ṣùgbọ́n, gẹ́gẹ́ bí a ti kọ ọ́ pé: “Àwọn ohun tí ojú kò rí, tí etí kò sì gbọ́, tí kò sì wọ ọkàn ènìyàn[a]—àwọn ohun tí Ọlọ́run ti pèsè fún àwọn tí ó fẹ́ràn rẹ̀.”'
