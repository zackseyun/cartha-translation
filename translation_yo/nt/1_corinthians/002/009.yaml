- from: Ṣùgbọ́n gẹ́gẹ́ bí a ti kọ ọ́ pé, “Ohun tí ojú kò rí, tí etí kò sì gbọ́, tí kò sì ru sí ọkàn ènìyàn[a]—ohun tí Ọlọ́run ti pèsè fún àwọn tí ó fẹ́ràn rẹ̀.”
  to: 'Ṣùgbọ́n, gẹ́gẹ́ bí a ti kọ ọ́ pé: “Àwọn ohun tí ojú kò rí, tí etí kò sì gbọ́, tí kò sì wọ ọkàn ènìyàn[a]—àwọn ohun tí Ọlọ́run ti pèsè fún àwọn tí ó fẹ́ràn rẹ̀.”'
  rationale: The revision replaces an overly literal but non-idiomatic rendering of the Greek heart idiom with natural Yoruba, while retaining the biblical “heart” language and the generic singular “ènìyàn.” It also makes the plural correlative structure explicit. The footnote supplies viable idiomatic alternatives and retains the explanation of the generic reference.
