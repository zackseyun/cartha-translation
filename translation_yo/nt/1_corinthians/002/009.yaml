id: 1CO.2.9
reference: 1 Corinthians 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: yo
  text: 'Ṣùgbọ́n, gẹ́gẹ́ bí a ti kọ ọ́ pé: “Àwọn ohun tí ojú kò rí, tí etí kò sì gbọ́, tí kò sì wọ ọkàn ènìyàn[a]—àwọn ohun tí Ọlọ́run ti pèsè fún àwọn tí ó fẹ́ràn rẹ̀.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò sì wá sí ọkàn ènìyàn,” tàbí “tí ẹnikẹ́ni kò sì ronú rẹ̀.” “Ènìyàn” níhìn-ín dúró fún gbogbo ẹ̀dá ènìyàn.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí èrò tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative ní Yorùbá.
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Ó pa ọ̀nà ìtọ́kasí sí Ìwé Mímọ́ mọ́, ó sì fi ipò perfect γέγραπται hàn lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: Ἃ ... ὅσα
  choice: Ohun tí ... ohun tí
  rationale: Àwọn ọ̀rọ̀ neuter plural náà bẹ̀rẹ̀ àkójọ náà, wọ́n sì tún ṣàkópọ̀ ohun tí Ọlọ́run pèsè; àtúnṣe yìí pa ìlànà ewì náà mọ́ láì di líle.
- source_word: ὀφθαλμὸς
  choice: ojú
  rationale: Ìtumọ̀ tààrà, tí a lò ní ọ̀nà àpapọ̀ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: οὖς
  choice: etí
  rationale: Ìtumọ̀ tààrà tí ó pa ìbáramu rẹ̀ pẹ̀lú “ojú” mọ́.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: tí kò sì ru sí ọkàn ènìyàn
  rationale: “Ru sí ọkàn” pa àwòrán gangan ti ἀνέβη (“gòkè/dìde sí”) mọ́, ó sì túmọ̀ sí ohun tí kò tíì wá sí èrò ẹni. “Ọkàn” pa anthropology ti Bíbélì mọ́, “ènìyàn” sì jẹ́ àpapọ̀ fún gbogbo ẹ̀dá ènìyàn.
- source_word: ἡτοίμασεν
  choice: ti pèsè
  rationale: Ó sọ iṣẹ́ tí Ọlọ́run ti ṣe tán, tí ìjẹ́pàtàkì rẹ̀ sì ń bá a lọ.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: fún àwọn tí ó fẹ́ràn rẹ̀
  rationale: Ó jẹ́ Yorùbá àdánidá fún participle present tí ń ṣàpèjúwe àwọn tí ìfẹ́ wọn sí Ọlọ́run ń bá a lọ.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρώπου gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀
  choice: ọkàn ènìyàn
  alternative: ọkàn ẹnì kan
  rationale: “Ènìyàn” pa singular generic mọ́ ní Yorùbá, ó sì tọ́ka sí ẹ̀dá ènìyàn lápapọ̀ láì fi akọ tàbí abo sí i.
- issue: Àwòrán ἀνέβη pẹ̀lú καρδίαν
  choice: ru sí ọkàn
  alternative: wọ inú ọkàn
  rationale: “Ru sí ọkàn” pa àwòrán pé ohun kan dìde tàbí wá sí inú ìrònú mọ́; “wọ inú ọkàn” ṣeé ló, ṣùgbọ́n kò tẹ̀lé ἀνέβη pẹ́ tó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ; èdè náà ní ọlá, ó sì ṣe kedere fún òǹkàwé òde òní. A pa ìlànà ewì ojú–etí–ọkàn àti ìdánudúró ṣáájú ohun tí Ọlọ́run pèsè mọ́.
