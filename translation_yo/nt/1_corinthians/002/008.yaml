id: 1CO.2.8
reference: 1 Corinthians 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: yo
  text: èyí tí kò sí ọ̀kan nínú àwọn alákòóso ìgbà ayé yìí tí ó mọ̀[a]; nítorí ìbá ṣe pé wọ́n mọ̀ ọ́, wọ́n kì bá tí kàn Olúwa ògo mọ́ àgbélébùú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn alákòóso ìgbà ayé yìí” lè tọ́ka sí àwọn aláṣẹ ènìyàn, àwọn agbára ẹ̀mí, tàbí àwọn méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: èyí tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ abo ẹyọ kan yìí ń tọ́ka sí ọgbọ́n tí a mẹ́nu kàn ṣáájú; “èyí tí” so gbólóhùn náà pọ̀ lọ́nà àdánidá ní Yorùbá.
- source_word: ἀρχόντων
  choice: àwọn alákòóso
  rationale: “Àwọn alákòóso” dúró fún àwọn tí wọ́n ní agbára ìṣàkóso, láì fi dandan sọ bóyá ènìyàn ni wọ́n, agbára ẹ̀mí ni wọ́n, tàbí àwọn méjèèjì.
- source_word: αἰῶνος τούτου
  choice: ìgbà ayé yìí
  rationale: “Ìgbà ayé yìí” pa ìtumọ̀ αἰών gẹ́gẹ́ bí sáà tàbí ètò àkókò mọ́, dípò yíyí i sí “ayé” nìkan.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: mọ̀ / mọ̀ ọ́
  rationale: “Mọ̀” túmọ̀ γινώσκω ní tààrà, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi hàn pé kíkọ́ ọgbọ́n Ọlọ́run ló wà níbẹ̀. Ìṣètò “ìbá ṣe pé … wọn kì bá tí …” sọ ipò tí kò ṣẹlẹ̀ lọ́nà Yorùbá àdánidá.
- source_word: κύριον
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún κύριος, ó sì pa ìwọ̀n àti agbára oyè náà mọ́.
- source_word: δόξης
  choice: ògo
  rationale: “Ògo” ni ìtumọ̀ tó ṣe déédé fún δόξα, ó sì pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ọlá ọ̀rọ̀ náà mọ́.
- source_word: κύριον τῆς δόξης
  choice: Olúwa ògo
  rationale: Ìtumọ̀ yìí pa ìsopọ̀ genitive inú Gíríìkì mọ́, ó sì jẹ́ gbólóhùn ọlọ́lá tí ó ṣe kedere ní Yorùbá.
- source_word: ἐσταύρωσαν
  choice: kan … mọ́ àgbélébùú
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìkànmọ́ àgbélébùú, ó sì pa pàtó ìṣẹ̀lẹ̀ ìtàn náà mọ́.
theological_decisions:
- issue: Àwọn wo ni “àwọn alákòóso ìgbà ayé yìí”?
  choice: A túmọ̀ ọ́ láì pinnu pé àwọn alákòóso ènìyàn tàbí àwọn agbára ẹ̀mí nìkan ni.
  alternative: Àwọn alákòóso ìṣèlú tàbí ẹ̀sìn; àwọn agbára ẹ̀mí tàbí ẹ̀mí búburú; tàbí ìtọ́kasí tí ó mọ̀ọ́mọ̀ gba àwọn méjèèjì.
  rationale: Gbólóhùn Gíríìkì náà lè tọ́ka sí àwọn ènìyàn, àwọn agbára ẹ̀mí, tàbí àwọn méjèèjì. Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú tó wà nínú ẹsẹ náà mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣe kedere ni a lò. “Ìgbà ayé yìí” pa ìtumọ̀ sáà tó wà nínú αἰών mọ́; “kan … mọ́ àgbélébùú” jẹ́ ọ̀rọ̀ àdánidá fún ìkànmọ́ àgbélébùú.
