  source_fidelity: Ìtumọ̀ náà pa gbólóhùn ète ἵνα mọ́ pẹ̀lú “kí ... má bàa,” ó sì tú πίστις, σοφίᾳ ἀνθρώπων, àti δυνάμει θεοῦ ní ìbámu pẹ̀lú ìtumọ̀ Gíríìkì. “Dúró lórí” jẹ́ ọ̀nà Yorùbá tó pé fún ìtumọ̀ ìgbẹ́kẹ̀lé tàbí ìpìlẹ̀ tí ἐν ń fi hàn ní àyíká yìí, ó sì ṣẹ̀dá ìfararora tó dọ́gba ní apá méjèèjì.
