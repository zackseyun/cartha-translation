id: 1CO.2.5
reference: 1 Corinthians 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: yo
  text: kí ìgbàgbọ́ yín má bàa dúró lórí ọgbọ́n ènìyàn, bí kò ṣe lórí agbára Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: kí ... má bàa
  rationale: Ó ṣàfihàn gbólóhùn ète ní Yorùbá àdánidá, ó sì pa ìtumọ̀ telic ti ἵνα mọ́.
- source_word: ἡ πίστις ὑμῶν
  choice: ìgbàgbọ́ yín
  rationale: Ní àyíká ọ̀rọ̀ yìí, πίστις ń tọ́ka sí ìgbàgbọ́ àwọn ará Kọ́ríńtì; ọ̀rọ̀ arọ́pò orúkọ yín jẹ́ ọ̀pọ̀ ènìyàn.
- source_word: μὴ ᾖ ἐν
  choice: má bàa dúró lórí
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν túmọ̀ sí ‘nínú’ ní tààrà, ‘dúró lórí’ sọ ìpìlẹ̀ tàbí ohun tí ìgbàgbọ́ gbára lé ní Yorùbá tó ṣe kedere, láìyí ìdàkejì ọ̀rọ̀ náà padà.
- source_word: σοφίᾳ ἀνθρώπων
  choice: ọgbọ́n ènìyàn
  rationale: ἄνθρωποι níbí túmọ̀ sí ẹ̀dá ènìyàn lápapọ̀, kì í ṣe akọ nìkan; ‘ọgbọ́n ènìyàn’ jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìtumọ̀ àpapọ̀ náà mọ́.
- source_word: ἀλλ’ ἐν δυνάμει θεοῦ
  choice: bí kò ṣe lórí agbára Ọlọ́run
  rationale: ‘bí kò ṣe’ pa ìtakora ἀλλά mọ́, ‘lórí’ sì bá gbólóhùn àkọ́kọ́ dọ́gba; ‘agbára Ọlọ́run’ túmọ̀ δυνάμει θεοῦ ní kedere.
theological_decisions:
- issue: Ohun tí ìgbàgbọ́ dúró lé
  choice: A tú ἐν ní àwọn apá méjèèjì sí ‘lórí,’ gẹ́gẹ́ bí ìpìlẹ̀ tí ìgbàgbọ́ gbára lé.
  alternative: nínú ọgbọ́n ènìyàn ... nínú agbára Ọlọ́run
  rationale: Ẹ̀dà ‘nínú’ sun mọ́ ìrísí Gíríìkì, ṣùgbọ́n ‘dúró lórí’ jẹ́ Yorùbá tó ṣe kedere sí i, ó sì pa ìtakora láàárín ọgbọ́n ènìyàn àti agbára Ọlọ́run mọ́ láìfi ẹ̀kọ́ ìjọ kan kun un.
- issue: Ìtumọ̀ ἀνθρώπων nípa akọ tàbí abo
  choice: ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ní Gíríìkì, ἀνθρώπων jẹ́ àpapọ̀ fún àwọn ẹ̀dá ènìyàn, kì í ṣe ọkùnrin nìkan. ‘Ènìyàn’ ni Yorùbá tó péye, kò sì nílò àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo ‘má bàa dúró lórí ... bí kò ṣe lórí ...’ láti mú ìbáṣepọ̀ ète àti ìtakora inú Gíríìkì jáde ní ti ẹ̀dá Yorùbá.
