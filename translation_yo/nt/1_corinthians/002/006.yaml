  to: Síbẹ̀, àwa ń sọ ọgbọ́n láàárín àwọn tí ó dàgbà dénú[a], ṣùgbọ́n kì í ṣe ọgbọ́n ti ayé yìí, bẹ́ẹ̀ ni kì í ṣe ọgbọ́n ti àwọn alákòóso ayé yìí[c], àwọn tí a ń sọ di aláìlágbára[b].
