language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: yo
  text: Síbẹ̀, àwa ń sọ ọgbọ́n láàárín àwọn tí ó dàgbà dénú[a], ṣùgbọ́n kì í ṣe ọgbọ́n ti ayé yìí, bẹ́ẹ̀ ni kì í ṣe ọgbọ́n ti àwọn alákòóso ayé yìí[c], àwọn tí a ń sọ di aláìlágbára[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó pé”; ó ṣeé ṣe jù pé ibi yìí ń tọ́ka sí àwọn tí ó dàgbà dénú nípa ẹ̀mí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ń kọjá lọ,” “àwọn tí a ń pa rẹ́,” tàbí “àwọn tí a ń sọ di asán.”
    reason: lexical_alternative
  - marker: c
    text: “Àwọn alákòóso ayé yìí” lè tọ́ka sí àwọn aláṣẹ ènìyàn, àwọn agbára ẹ̀mí, tàbí àwọn méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: ọgbọ́n
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe déédé pẹ̀lú σοφία ni “ọgbọ́n”; a tún un lò láti pa ìtẹnumọ́ inú Gíríìkì mọ́.
- source_word: δὲ
  choice: Síbẹ̀
  rationale: Ó fi ìyàtọ̀ sí ohun tí a sọ ṣáájú hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: λαλοῦμεν
  choice: a ń sọ
  rationale: Ó túmọ̀ ìṣe sísọ ní tààrà, kò sì fi èrò “wàásù” kún ọ̀rọ̀ náà.
- source_word: ἐν τοῖς τελείοις
  choice: láàárín àwọn tí ó dàgbà dénú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, τέλειος ṣeé lóye gẹ́gẹ́ bí ìdàgbà dénú, kì í ṣe àìlẹ́ṣẹ̀ pípé; “láàárín” sì bá ìtumọ̀ ἐν mu ní àyíká yìí.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: kì í ṣe ọgbọ́n ayé yìí
  rationale: “Ayé yìí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ αἰών ní èrò àsìkò àti ètò ayé tó wà nísinsin yìí, láì dín un kù sí κόσμος.
- source_word: ἀρχόντων
  choice: àwọn alákòóso
  rationale: Ó jẹ́ ọ̀rọ̀ gbígbòòrò tó lè tọ́ka sí àwọn olórí ènìyàn, àwọn agbára ẹ̀mí, tàbí àwọn méjèèjì.
- source_word: τῶν καταργουμένων
  choice: àwọn tí a ń sọ di aláìlágbára
  rationale: Ó mú ìtumọ̀ pípa agbára rẹ̀ rẹ́ tàbí sísọ ọ́ di asán jáde, ó sì pa ipa ìṣe tó ń lọ lọ́wọ́ inú present participle mọ́.
theological_decisions:
- issue: Àwọn wo ni “àwọn alákòóso ayé yìí” ń tọ́ka sí?
  choice: A fi “àwọn alákòóso” sílẹ̀ ní gbígbòòrò láì sọ pé ènìyàn tàbí ẹ̀mí ni.
  alternative: Àwọn alákòóso ìṣèlú tàbí ẹ̀sìn; àwọn agbára ẹ̀mí; tàbí àwọn méjèèjì.
  rationale: Gbólóhùn Gíríìkì kò yan ọ̀kan pàtó; ìtumọ̀ náà pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A pa àtúnwí “ọgbọ́n” àti àìdánilójú nípa irú àwọn alákòóso náà mọ́; àwọn àlàyé míì wà ní àlàyé ìsàlẹ̀.
