id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: yo
  text: Ṣùgbọ́n ènìyàn tí ó jẹ́ ti ẹ̀dá lásán[a] kì í gba àwọn ohun ti Ẹ̀mí Ọlọ́run, nítorí pé ìwà òmùgọ̀ ni wọ́n jẹ́ lójú rẹ̀; kò sì lè mọ̀ wọ́n, nítorí pé nípa ti Ẹ̀mí ni a fi ń fòye mọ̀ wọ́n[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ènìyàn tí kò jẹ́ ti Ẹ̀mí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa ti Ẹ̀mí ni a fi ń ṣàyẹ̀wò wọn” tàbí “ṣe ìdájọ́ lé wọn lórí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: tí ó jẹ́ ti ẹ̀dá lásán
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ψυχικός àti πνευματικός mọ́, láì dárú rẹ̀ mọ́ ‘ti ara’ tàbí sọ ní pàtó ju Gíríìkì lọ pé ẹni náà kò ní Ẹ̀mí.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: ‘Ènìyàn’ jẹ́ ọ̀rọ̀ àpapọ̀ tó lè dúró fún ẹnikẹ́ni, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà.
- source_word: δέχεται
  choice: kì í gba
  rationale: Ó túmọ̀ sí pé ẹni náà kò tẹ́wọ́ gba àwọn ohun náà gẹ́gẹ́ bí ohun tó yẹ, kì í ṣe gbígbọ́ wọn lásán.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: àwọn ohun ti Ẹ̀mí Ọlọ́run
  rationale: Ó pa ìtumọ̀ gbòòrò àti ìṣètò ọ̀rọ̀ Gíríìkì mọ́, láì fi àlàyé mìíràn kún un.
- source_word: μωρία
  choice: òmùgọ̀
  rationale: Gbólóhùn ‘òmùgọ̀ ni wọ́n jẹ́ lójú rẹ̀’ sọ pé ẹni náà ka àwọn ohun náà sí ohun tí kò ní ọgbọ́n, ó sì bá àríyànjiyàn Pọ́ọ̀lù mu.
- source_word: γνῶναι
  choice: mọ̀
  rationale: Ó tẹ̀lé ìtumọ̀ ìpilẹ̀ ti γινώσκω, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi hàn pé mímọ̀ yìí kan fífi òye gba ohun náà.
- source_word: πνευματικῶς
  choice: nípa ti Ẹ̀mí
  rationale: Ó fi ọ̀nà tàbí ipò ti Ẹ̀mí hàn, ó sì bá ìyàtọ̀ tó wà nínú ẹsẹ náà mu.
- source_word: ἀνακρίνεται
  choice: a fi ń fòye mọ̀
  rationale: Ó mú ìtumọ̀ ṣíṣe àyẹ̀wò kí a lè mọ ohun dáadáa jáde; àkọsílẹ̀ ìsàlẹ̀ pa àwọn ìtumọ̀ ‘ṣàyẹ̀wò’ àti ‘ṣe ìdájọ́ lé lórí’ mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ψυχικὸς ἄνθρωπος ní ìyàtọ̀ sí ohun ti Ẹ̀mí
  choice: ènìyàn tí ó jẹ́ ti ẹ̀dá lásán
  alternative: ènìyàn tí kò jẹ́ ti Ẹ̀mí
  rationale: Àṣàyàn yìí pa ìforígbárí láàárín ipò ẹ̀dá ènìyàn lásán àti òye tí Ẹ̀mí ń fúnni mọ́, láì sọ ju ohun tí Gíríìkì sọ lọ.
- issue: Bí a ṣe máa túmọ̀ πνευματικῶς ἀνακρίνεται
  choice: nípa ti Ẹ̀mí ni a fi ń fòye mọ̀ wọ́n
  alternative: ní ọ̀nà ti ẹ̀mí ni a fi ń ṣàyẹ̀wò wọn
  rationale: Ó pa ìṣe Ẹ̀mí àti ìtumọ̀ ṣíṣe àyẹ̀wò mọ́ pọ̀, láì pinnu pé ọ̀rọ̀ náà túmọ̀ sí òye inú nìkan tàbí ìdájọ́ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó bójú mu fún ìtẹ̀jáde Bíbélì. A yẹra fún ‘ènìyàn ti ara,’ nítorí ó lè dárú ψυχικός mọ́ σαρκικός. Gbólóhùn náà jẹ́ ti òde òní, ṣùgbọ́n ó ní iyì àti ìwọ̀ntúnwọ̀nsì.
