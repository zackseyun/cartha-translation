id: 1CO.2.7
reference: 1 Corinthians 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: yo
  text: Ṣùgbọ́n àwa ń sọ ọgbọ́n Ọlọ́run nínú ohun ìjìnlẹ̀[a], ọgbọ́n tí a ti fi pamọ́, èyí tí Ọlọ́run ti pinnu[b] ṣáájú àwọn ìgbà ayé[c] fún ògo wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú àṣírí”; Gíríìkì lo “ohun ìjìnlẹ̀,” ọ̀rọ̀ tí Pọ́ọ̀lù sábà máa ń lò fún ète Ọlọ́run tí ó ti fara sin rí, tí a sì ti ṣí payá nísinsìnyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ti yàn tẹ́lẹ̀” tàbí “ti ṣe ìpinnu rẹ̀ ṣáájú.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ṣáájú gbogbo ìgbà ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: àwa ń sọ
  rationale: Ó mú ìtumọ̀ gígún ti ‘a ń sọ’ jáde, ó sì bá ìyàtọ̀ tí Pọ́ọ̀lù ń fi hàn mu láì sọ ọ́ di ìkéde oníṣe àkànṣe.
- source_word: θεοῦ σοφίαν
  choice: ọgbọ́n Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ọgbọ́n tí ó jẹ́ ti Ọlọ́run, tí ó sì ti ọ̀dọ̀ rẹ̀ wá.
- source_word: ἐν μυστηρίῳ
  choice: nínú ohun ìjìnlẹ̀
  rationale: ‘Ohun ìjìnlẹ̀’ pa èrò Pọ́ọ̀lù mọ́ nípa ète Ọlọ́run tí ó ti fara sin rí, tí a sì ti ṣí payá; ó yẹra fún ìtumọ̀ rẹ̀ sí àṣírí lásán.
- source_word: τὴν ἀποκεκρυμμένην
  choice: ọgbọ́n tí a ti fi pamọ́
  rationale: Ọ̀rọ̀ arọ́pò náà tọ́ka padà sí ‘ọgbọ́n’; fífi ‘ọgbọ́n’ tún un sọ mú ìtọ́kasí náà ṣe kedere ní Yorùbá.
- source_word: προώρισεν
  choice: ti pinnu tẹ́lẹ̀
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́ pé Ọlọ́run ṣe ìpinnu náà ṣáájú, láì gbé ètò ẹ̀kọ́ ìgbàgbọ́ ẹ̀ya kan wọ inú ẹsẹ náà.
- source_word: πρὸ τῶν αἰώνων
  choice: ṣáájú àwọn ìgbà ayé
  rationale: Ó tẹ̀lé àwòrán àkókò àti àgbáyé inú αἰῶνες ju àtúmọ̀ ìtumọ̀-jinlẹ̀ bí ‘ṣáájú ìṣẹ̀dá ayé’ lọ.
- source_word: εἰς δόξαν ἡμῶν
  choice: fún ògo wa
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú δόξα mọ́.
theological_decisions:
- issue: Ìtumọ̀ προώρισεν ní àyíká ọ̀rọ̀ Pọ́ọ̀lù tí ó ní ìjẹ́pàtàkì nínú ẹ̀kọ́ ìgbàgbọ́
  choice: ti pinnu tẹ́lẹ̀
  alternative: ti yàn tẹ́lẹ̀; ti pète tẹ́lẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ìpinnu ṣáájú. ‘Ti pinnu tẹ́lẹ̀’ pa ìtumọ̀ yẹn mọ́ láì fi ẹ̀kọ́ ìjọ tàbí ẹ̀ya kan kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ohun ìjìnlẹ̀’ dípò gbígbé ‘mystery’ wọlé tàbí dín un kù sí ‘àṣírí’ lásán.
