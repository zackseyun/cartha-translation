review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ gbogbogbòò tẹ̀ lé Gíríìkì dáadáa: ‘àwọn nǹkan wọ̀nyí,’ ìyàtọ̀ láàárín ọgbọ́n ènìyàn àti Ẹ̀mí, àti ìtumọ̀ míràn fún πνευματικοῖς wà nínú àlàyé ìsàlẹ̀. Ṣùgbọ́n gbólóhùn ìkẹyìn yẹ kí ó fi ìbáṣepọ̀ ‘ohun ti ẹ̀mí’ àti ‘ọ̀rọ̀ ti ẹ̀mí’ hàn kedere, dípò kí ó dà bí ẹni pé ó nìkan ń sọ ‘ọ̀rọ̀ ti Ẹ̀mí’ léraléra.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa tó ní àmì ohùn dáadáa. ‘Nípasẹ̀’ dáa ju ‘pẹ̀lú’ lọ nínú gbólóhùn ìkẹyìn, nítorí ó fi ọ̀nà/irinṣẹ́ tí ìtumọ̀ náà ń wáyé hàn ní kedere. ‘Tí ... kọ́’ sì jẹ́ ọ̀nà kúkúrú, àdánidá fún ‘words taught by’.
  terminology: ‘Ẹ̀mí’ (ní olú-ìlà) bá àyíká ọrọ̀ mu gẹ́gẹ́ bí Ẹ̀mí Ọlọ́run. ‘Àwọn ohun ti Ẹ̀mí’ àti ‘àwọn ọ̀rọ̀ ti Ẹ̀mí’ pa ìbáṣepọ̀ πνευματικά/πνευματικοῖς mọ́ láì sọ ìtumọ̀ ẹ̀kọ́ ìjọ kan di dandan. Àlàyé ìsàlẹ̀ ń pa aṣayan akọ, ‘àwọn ènìyàn tí Ẹ̀mí ń darí,’ mọ́.
  issues:
  - severity: medium
    issue: Gbólóhùn ìkẹyìn kò fi ohun tí πνευματικοῖς ń ṣe hàn ní kedere.
    rationale: ‘ní fífi ọ̀rọ̀ ti Ẹ̀mí ṣàlàyé àwọn ohun ti Ẹ̀mí’ lè dà bí pé ‘ọ̀rọ̀’ kan ṣoṣo ni a ń lò, ó sì kù díẹ̀ láti fi hàn pé a ń ṣàlàyé ohun ti ẹ̀mí nípasẹ̀ ọ̀rọ̀ ti ẹ̀mí. Àtúnṣe náà ń mú ìka ‘nípasẹ̀’ hàn, ó sì pa ìtumọ̀ tí a yan mọ́.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ sọ pé πνευματικοῖς lè tọ́ka sí ‘ọ̀rọ̀ tàbí ohun,’ èyí tó gbòòrò ju aṣayan gírámà pàtàkì lọ.
    rationale: Ìṣòro pàtàkì ni bóyá dative náà jẹ́ akọ (‘àwọn ènìyàn tí Ẹ̀mí ń darí’) tàbí ó ń tọ́ka sí ọ̀rọ̀ ẹ̀mí. A tún ọ̀rọ̀ àlàyé náà ṣe kí ó sọ èyí ní kedere.
