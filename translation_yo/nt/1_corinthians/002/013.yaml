id: 1CO.2.13
reference: 1 Corinthians 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí ni àwa náà ń sọ, kì í ṣe pẹ̀lú àwọn ọ̀rọ̀ tí ọgbọ́n ènìyàn kọ́, bí kò ṣe pẹ̀lú àwọn ọ̀rọ̀ tí Ẹ̀mí kọ́, ní ṣíṣàlàyé àwọn ohun ti Ẹ̀mí nípasẹ̀ àwọn ọ̀rọ̀ ti Ẹ̀mí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “ní ṣíṣàlàyé àwọn ohun ti Ẹ̀mí fún àwọn ènìyàn tí Ẹ̀mí ń darí.” Ọ̀rọ̀ Gíríìkì πνευματικοῖς lè jẹ́ ti akọ, tí ó sì ń tọ́ka sí àwọn ènìyàn bẹ́ẹ̀; ó tún lè tọ́ka sí àwọn ọ̀rọ̀ ti Ẹ̀mí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: Àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí àwọn òtítọ́ tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ arọ́pò-orúkọ náà ní Yorùbá.
- source_word: λαλοῦμεν
  choice: àwa náà ń sọ
  rationale: Ó pa ìtumọ̀ sísọ̀rọ̀ mọ́, ó sì jẹ́ kí καὶ (‘náà’) hàn kedere.
- source_word: διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: pẹ̀lú àwọn ọ̀rọ̀ tí ọgbọ́n ènìyàn kọ́ni
  rationale: ‘Pẹ̀lú’ mú ipa irinṣẹ́ ἐν jáde ní Yorùbá àdánidá, nígbà tí gbólóhùn náà fi ọgbọ́n ènìyàn hàn gẹ́gẹ́ bí orísun ẹ̀kọ́ àwọn ọ̀rọ̀ náà.
- source_word: διδακτοῖς πνεύματος
  choice: pẹ̀lú àwọn ọ̀rọ̀ tí Ẹ̀mí kọ́ni
  rationale: Ọ̀rọ̀ λόγοις tí a kò tún kọ sínú Gíríìkì ni a mú wọ inú Yorùbá fún ìtumọ̀ kedere; ‘Ẹ̀mí’ ń tọ́ka sí Ẹ̀mí Ọlọ́run nínú àyíká ọ̀rọ̀ yìí.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: ní fífi ọ̀rọ̀ ti Ẹ̀mí ṣàlàyé àwọn ohun ti Ẹ̀mí
  rationale: Èyí tẹ̀ lé ìyàtọ̀ tó wà ní ẹsẹ náà láàárín onírúurú ọ̀rọ̀, ó sì mú συγκρίνοντες gẹ́gẹ́ bí ṣíṣàlàyé tàbí fífi ohun kan hàn nípasẹ̀ ohun mìíràn. Nítorí πνευματικοῖς lè jẹ́ akọ tí ó ń tọ́ka sí ènìyàn, a pa ìtumọ̀ yẹn mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí πνεύματος ń tọ́ka sí
  choice: Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí kan tàbí orísun ti ẹ̀mí ní gbogbogbòò
  rationale: Gbogbo àyíká 1 Kọ́ríńtì 2 ń fi Ẹ̀mí Ọlọ́run wé ọgbọ́n ènìyàn, nítorí náà ẹni pàtó yìí ni ọ̀rọ̀ náà ń tọ́ka sí.
- issue: Ìtumọ̀ πνευματικοῖς nínú gbólóhùn ìkẹyìn
  choice: ọ̀rọ̀ ti Ẹ̀mí
  alternative: àwọn ènìyàn tí Ẹ̀mí ń darí
  rationale: Ìtumọ̀ àkọ́kọ́ bá àríyànjiyàn tó wà ní ẹsẹ náà nípa àwọn ọ̀rọ̀ tí ọgbọ́n ènìyàn tàbí Ẹ̀mí kọ́ mu; ṣùgbọ́n ìrísí Gíríìkì náà tún lè jẹ́ akọ, torí náà a kò fi ìtumọ̀ kejì pa mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo ‘kọ́ni’ láì fi ẹni tí a kọ́ sí pàtó, gẹ́gẹ́ bí Gíríìkì ṣe fi í sílẹ̀.
