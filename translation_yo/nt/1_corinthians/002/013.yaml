revisions:
- from: Àwọn nǹkan wọ̀nyí ni àwa náà ń sọ, kì í ṣe pẹ̀lú àwọn ọ̀rọ̀ tí ọgbọ́n ènìyàn kọ́ni, bí kò ṣe pẹ̀lú àwọn ọ̀rọ̀ tí Ẹ̀mí kọ́ni, ní fífi ọ̀rọ̀ ti Ẹ̀mí ṣàlàyé àwọn ohun ti Ẹ̀mí.[a]
  to: Àwọn nǹkan wọ̀nyí ni àwa náà ń sọ, kì í ṣe pẹ̀lú àwọn ọ̀rọ̀ tí ọgbọ́n ènìyàn kọ́, bí kò ṣe pẹ̀lú àwọn ọ̀rọ̀ tí Ẹ̀mí kọ́, ní ṣíṣàlàyé àwọn ohun ti Ẹ̀mí nípasẹ̀ àwọn ọ̀rọ̀ ti Ẹ̀mí.[a]
  rationale: A tún gbólóhùn ìkẹyìn ṣe láti mú ìtumọ̀ tí a yan—ṣíṣàlàyé ohun ti Ẹ̀mí nípasẹ̀ ọ̀rọ̀ ti Ẹ̀mí—hàn ní Yorùbá tí ó mọ́, nígbà tí àlàyé ìsàlẹ̀ ń pa ìtumọ̀ míràn, pé a ń ṣàlàyé fún àwọn ènìyàn tí Ẹ̀mí ń darí, mọ́. A yọ ‘-ni’ kúrò nínú ‘kọ́ni’ nínú ọ̀rọ̀ àkọ́kọ́ àti kejì, nítorí ‘àwọn ọ̀rọ̀ tí ... kọ́’ ti pé, ó sì sún mọ́ ìṣọ̀kan Gíríìkì.
  reviewer_model: gpt-5.6-terra
