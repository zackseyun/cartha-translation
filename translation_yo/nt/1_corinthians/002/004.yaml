source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: yo
  text: Ọ̀rọ̀ mi àti ìwàásù mi kò sì wá pẹ̀lú ọgbọ́n tí ń dáni lójú,[b] bí kò ṣe pẹ̀lú ìfihàn Ẹ̀mí[a] àti agbára,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀mí.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “nínú àwọn ọ̀rọ̀ ọgbọ́n tí ń dáni lójú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: Nínú àyíká yìí, ó tọ́ka sí ọ̀rọ̀ tí Pọ́ọ̀lù sọ àti bí ó ṣe sọ ọ́; “ọ̀rọ̀” jẹ́ èdè Yorùbá àdánidá, ó sì yàtọ̀ sí κήρυγμα.
- source_word: κήρυγμα
  choice: ìwàásù
  rationale: “Ìwàásù” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ìkéde ìhìn ní gbangba, ó sì pa ìtumọ̀ iṣẹ́ akéde mọ́ láì da a pọ̀ mọ́ λόγος.
- source_word: πειθοῖ σοφίας
  choice: pẹ̀lú ọgbọ́n tí ń yíni lọ́kàn padà
  rationale: Gíríìkì kò sọ “ọ̀rọ̀” ní kedere; gbolohun yìí fi agbára ìrọ̀rọ̀ láti mú ènìyàn gbàgbọ́ hàn láì fi ọ̀rọ̀ tí kò sí nínú orísun kún un.
- source_word: ἀποδείξει
  choice: ìfihàn
  rationale: “Ìfihàn” sọ ìṣe fífi ohun kan hàn gbangba tàbí fífi ẹ̀rí rẹ̀ múlẹ̀, ní ìtakora sí yíyíni lọ́kàn padà nípa ọgbọ́n ọ̀rọ̀ nìkan.
- source_word: πνεύματος
  choice: Ẹ̀mí
  rationale: Àyíká 1 Kọ́ríńtì 2 tọ́ka sí iṣẹ́ Ẹ̀mí Ọlọ́run; lẹ́tà ńlá fi ìtumọ̀ yìí hàn, nígbà tí àlàyé ìsàlẹ̀ pa “ẹ̀mí” mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: δυνάμεως
  choice: agbára
  rationale: “Agbára” jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìlò Pọ́ọ̀lù fún δύναμις mu.
theological_decisions:
- issue: Bóyá πνεύματος túmọ̀ sí Ẹ̀mí Mímọ́ tàbí ẹ̀mí ní ìtumọ̀ gbogbogbò
  choice: Ẹ̀mí
  alternative: ẹ̀mí
  rationale: Ìjíròrò tó yí ẹsẹ náà ká ń fi ọgbọ́n ènìyàn wé ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá, ó sì mẹ́nu kan Ẹ̀mí Ọlọ́run ní kedere lẹ́yìn náà. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ kékeré “ẹ̀mí” mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ìwàásù” fún κήρυγμα àti “ìfihàn” fún ἀπόδειξις; àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
