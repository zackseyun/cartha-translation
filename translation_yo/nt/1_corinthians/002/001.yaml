  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí ìsopọ̀ àti ìtẹnumọ́ nínú Κἀγώ, sí ìyàtọ̀ láàárín ἐλθών àti ἦλθον, àti sí μαρτύριον τοῦ θεοῦ. Ṣùgbọ́n “mo tọ̀ yín wá” kò túmọ̀ sí ‘mo wá sọ́dọ̀ yín’; ó lè túmọ̀ sí pé ẹni náà tẹ̀lé àwọn olùgbọ́ náà wá. A gbọdọ̀ tún un ṣe kí ìtòsọ́nà πρὸς ὑμᾶς hàn kedere.
  naturalness: “Wá sọ́dọ̀ yín” ni ọ̀nà Yorùbá boṣewa tó ṣe kedere fún ‘come to you.’ Ìdàgbékalẹ̀ “mi ò wá pẹ̀lú …, nígbà tí mo ń kéde …” jẹ́ ti ìbánisọ̀rọ̀ òde òní, ó sì ń fi participle καταγγέλλων hàn láì sọ pé ìkéde náà jẹ́ ète nìkan.
