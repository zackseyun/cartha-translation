id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: yo
  text: Èmi náà, ẹ̀yin ará,[a] nígbà tí mo wá sọ́dọ̀ yín, mi ò wá pẹ̀lú ọ̀rọ̀ gíga tàbí ọgbọ́n, nígbà tí mo ń kéde ẹ̀rí Ọlọ́run[b] fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ẹ̀yin ará” lè tọ́ka sí gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́, títí kan àwọn obìnrin inú ìjọ.
    reason: cultural_note
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní “àṣírí Ọlọ́run.”
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: Èmi náà
  rationale: Ó pa ìsopọ̀ καί àti ìtẹnumọ́ arọ́pò-orúkọ ẹni àkọ́kọ́ mọ́ láì mú ìtẹnumọ́ náà kọjá bó ṣe yẹ.
- source_word: ἐλθὼν … ἦλθον
  choice: nígbà tí mo tọ̀ yín wá, èmi kò wá
  rationale: Gbólóhùn àkókò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi participle àti ọ̀rọ̀-ìṣe pàtàkì Gíríìkì hàn, ó sì pa àtúnlò ‘wá’ mọ́.
- source_word: ἀδελφοί
  choice: ará
  rationale: ‘Ará’ jẹ́ ọ̀rọ̀ ìpè àdánidá ní Yorùbá fún àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè kan ọkùnrin àti obìnrin láì fi ìtumọ̀ ìbátan ìjọ náà sílẹ̀.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: pẹ̀lú ọ̀rọ̀ gíga tàbí ọgbọ́n
  rationale: Ó sọ ìṣàfihàn ọ̀rọ̀ tó ga tàbí tó fani mọ́ra ní èdè Yorùbá tó rọrùn, ó sì pa ìyàtọ̀ tí Paulu ṣe sí ọgbọ́n ayé mọ́.
- source_word: καταγγέλλων
  choice: bí mo ti ń kéde
  rationale: Ó fi ìṣe tó ń bá ìṣe pàtàkì lọ hàn, ó sì pa ìtumọ̀ ìkéde ní gbangba mọ́.
- source_word: μαρτύριον
  choice: ẹ̀rí
  rationale: ‘Ẹ̀rí’ jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún μαρτύριον, ó sì bá àkọsílẹ̀ SBLGNT mu láì sọ ọ́ di ‘àṣírí.’
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: 'Àkójọpọ̀ ‘ẹ̀rí Ọlọ́run’ pa àìdánilójú genitive mọ́: ó lè túmọ̀ sí ẹ̀rí láti ọ̀dọ̀ Ọlọ́run, ẹ̀rí nípa Ọlọ́run, tàbí ẹ̀rí tí í ṣe ti Ọlọ́run.'
theological_decisions:
- issue: Ìyàtọ̀ àfọwọ́kọ ní μαρτύριον
  choice: ẹ̀rí Ọlọ́run
  alternative: àṣírí Ọlọ́run
  rationale: Àkọsílẹ̀ ìpìlẹ̀ SBLGNT ní μαρτύριον (‘ẹ̀rí’). Nítorí pé àwọn àfọwọ́kọ kan ní μυστήριον (‘àṣírí’) àti pé ìyàtọ̀ náà kan ìtumọ̀, a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ genitive τοῦ θεοῦ
  choice: ẹ̀rí Ọlọ́run
  alternative: ẹ̀rí láti ọ̀dọ̀ Ọlọ́run / ẹ̀rí nípa Ọlọ́run
  rationale: A kò pinnu bóyá genitive náà ń tọ́ka sí orísun, ohun tí ẹ̀rí náà dá lé, tàbí ohun-ìní; èdè àkọ́kọ́ ní àìdánilójú yìí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá jẹ́ àdánidá. Ìtòlẹ́sẹẹsẹ náà pa ìtẹnumọ́ ‘Èmi’ àti àtúnlò ‘wá’ mọ́, ṣùgbọ́n ó yí participle Gíríìkì sí gbólóhùn Yorùbá tó rọrùn láti lóye.
