revisions:
- from: Èmi náà, ará,[a] nígbà tí mo tọ̀ yín wá, èmi kò wá pẹ̀lú ọ̀rọ̀ gíga tàbí ọgbọ́n, bí mo ti ń kéde ẹ̀rí Ọlọ́run fún yín.[b]
  to: Èmi náà, ẹ̀yin ará,[a] nígbà tí mo wá sọ́dọ̀ yín, mi ò wá pẹ̀lú ọ̀rọ̀ gíga tàbí ọgbọ́n, nígbà tí mo ń kéde ẹ̀rí Ọlọ́run[b] fún yín.
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí kò péye “tọ̀ yín wá” pẹ̀lú “wá sọ́dọ̀ yín,” kí πρὸς ὑμᾶς hàn ní kedere. Ó pa “Èmi náà,” ìpè àwọn ará, àtúnlò ìṣe ‘wá,’ ọ̀rọ̀ gíga/ọgbọ́n, àti ẹ̀rí Ọlọ́run mọ́. “Nígbà tí mo ń kéde” ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà Yorùbá tó lè gbé participle καταγγέλλων, láì fi ìtumọ̀ ẹ̀sìn míì kún un.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:14Z'
