source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: yo
  text: A sì ń ṣiṣẹ́ takuntakun, a ń fi ọwọ́ ara wa ṣiṣẹ́. Nígbà tí wọ́n ń gàn wá[a], a ń bùkún fún wọn; nígbà tí wọ́n ń ṣe inúnibíni sí wa, a ń fara dà á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí wọ́n ń sọ̀rọ̀ burúkú sí wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶμεν
  choice: a ń ṣe làálàá
  rationale: Ó fi hàn pé iṣẹ́ náà le, ó sì ń mú àárẹ̀ wá; kì í ṣe iṣẹ́ lásán.
- source_word: ἐργαζόμενοι
  choice: a ń ... ṣiṣẹ́
  rationale: Ọ̀rọ̀ àpólà yìí ṣàlàyé bí wọ́n ṣe ń ṣe làálàá náà, ìyẹn nípa iṣẹ́ ọwọ́.
- source_word: ταῖς ἰδίαις χερσίν
  choice: fi ọwọ́ ara wa
  rationale: Ó pa ìtẹnumọ́ ἰδίαις mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ pé àwọn fúnra wọn ń ṣiṣẹ́ ọwọ́.
- source_word: λοιδορούμενοι
  choice: nígbà tí wọ́n bá ń gàn wá
  rationale: Ó pa ohùn àìṣe àti ipa ipò/àsìkò ọ̀rọ̀ àpólà náà mọ́, ó sì ṣe kedere fún òǹkàwé òde òní.
- source_word: εὐλογοῦμεν
  choice: a ń súre fún wọn
  rationale: ‘Súre fún’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n ń fi ìbùkún dá ẹ̀gàn lóhùn, dípò gbígbẹ̀san.
- source_word: διωκόμενοι
  choice: nígbà tí wọ́n bá ń ṣe inúnibíni sí wa
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìṣe ọ̀tá àti inúnibíni, kì í ṣe lílépa lásán.
- source_word: ἀνεχόμεθα
  choice: a ń fara dà á
  rationale: Ó túmọ̀ sí gbígbà tàbí fífarada ìhùwàsí búburú náà; arọ́pò-orúkọ ‘á’ mú gbólóhùn Yorùbá náà péye láìfi èrò tuntun kún un.
theological_decisions:
- issue: Ìdáhùn sí ìhùwàsí búburú
  choice: 'A ṣàpèjúwe ìwà àwọn aposteli: wọ́n ń fi ìbùkún dá ẹ̀gàn lóhùn, wọ́n sì ń fara da inúnibíni.'
  alternative: Kí a yí àpèjúwe náà padà sí àṣẹ gbangba fún gbogbo onígbàgbọ́.
  rationale: Ọ̀rọ̀ Gíríìkì náà ń sọ ohun tí àwọn aposteli ń ṣe ní àwọn ìtakora kúkúrú; kò gbé e kalẹ̀ níbí gẹ́gẹ́ bí àṣẹ tààrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A gbé àmì àlàyé [a] sí ibi tí àṣàyàn ọ̀rọ̀ λοιδορούμενοι wà gan-an.
