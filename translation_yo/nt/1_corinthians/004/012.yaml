review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìṣọ̀kan àwọn ìṣe tí ó wà nínú Gíríìkì náà dáadáa: ṣíṣiṣẹ́ takuntakun pẹ̀lú ọwọ́ ara ẹni, ìfẹ̀sì ọlọ́jọ́gbọ́n sí ẹ̀gàn, àti fífarada inúnibíni. Ṣùgbọ́n ‘súre fún wọn’ sábà máa ń túmọ̀ sí ‘gbàdúrà fún wọn’ ní Yorùbá; ‘bùkún fún wọn’ jẹ́ ìbámu tààrà sí εὐλογοῦμεν (‘a bùkún’).'
  naturalness: ‘A ń ṣiṣẹ́ takuntakun’ jẹ́ ọ̀nà Yorùbá òde òní tí ó hàn gbangba fún κοπιῶμεν, ó sì yà iṣẹ́ àárẹ̀ náà sọ́tọ̀ kúrò nínú ìṣe iṣẹ́ ọwọ́ tí ọ̀rọ̀ àpólà tó tẹ̀lé ń ṣàlàyé. Lílo ‘nígbà tí wọ́n ń ...’ mú ipò ìṣe tí ń lọ nínú àwọn participle náà hàn láìfa ìtumọ̀ ọjọ́ iwájú tí ‘bá’ lè ru.
  terminology: A tún ‘súre fún wọn’ ṣe sí ‘bùkún fún wọn’ láti pa ọ̀rọ̀ pàtàkì εὐλογοῦμεν mọ́ ní kedere. ‘Inúnibíni’ àti ‘fara dà á’ bá ọ̀rọ̀ Gíríìkì mu, níbi tí ‘á’ ti ń tọ́ka sí inúnibíni/ìtọ́jú búburú tí a ṣàpèjúwe, kì í sì fi ẹ̀kọ́ tuntun kún un.
  issues:
  - severity: medium
    issue: ‘A ń súre fún wọn’ lè túmọ̀ sí ‘a ń gbàdúrà fún wọn’ dípò ‘a ń bùkún fún wọn.’
    rationale: εὐλογοῦμεν níbí ni ìfẹ̀sì ìbùkún sí ìsọ̀rọ̀ ẹ̀gàn. ‘Bùkún fún’ jẹ́ ìbámu ìtumọ̀ tí ó kedere síi, ó sì pa ọ̀rọ̀ Bíbélì pàtàkì náà mọ́.
  - severity: low
    issue: ‘Nígbà tí wọ́n bá ń...’ lè ní ìró ìṣẹ̀lẹ̀ ọjọ́ iwájú tàbí ìṣẹ̀lẹ̀ àdéhùn.
    rationale: Àwọn participle λοιδορούμενοι àti διωκόμενοι ń ṣàpèjúwe ipò tí ń ṣẹlẹ̀ nínú àtòkọ ìwà àwọn aposteli. ‘Nígbà tí wọ́n ń...’ ṣàfihàn èyí ní ti ara.
