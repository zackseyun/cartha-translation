  to: A sì ń ṣiṣẹ́ takuntakun, a ń fi ọwọ́ ara wa ṣiṣẹ́. Nígbà tí wọ́n ń gàn wá[a], a ń bùkún fún wọn; nígbà tí wọ́n ń ṣe inúnibíni sí wa, a ń fara dà á.
  rationale: Àtúnṣe náà ṣàlàyé κοπιῶμεν ní ọ̀nà àdánidá, ó sì rọ́pò ọ̀rọ̀ tó lè túmọ̀ sí ‘gbàdúrà fún’ pẹ̀lú ‘bùkún fún,’ èyí tí ó bá εὐλογοῦμεν mu ní tààrà. A pa ìtumọ̀ àpèjúwe náà, ìtẹnumọ́ pé ọwọ́ tiwọn ni wọ́n fi ń ṣiṣẹ́, àti ìtọ́kasí àlàyé [a] mọ́.
