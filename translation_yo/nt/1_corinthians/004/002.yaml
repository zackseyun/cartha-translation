  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: yo
  text: Síwájú sí i, nínú ọ̀ràn yìí, ohun tí a ń béèrè lọ́wọ́ àwọn ìríjú[a] ni pé kí a rí ìríjú kan tí ó jẹ́ olóòótọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn olùṣàkóso ilé”; àwọn tí a fi ohun ẹlòmíràn lé lọ́wọ́ láti máa bójú tó.
    reason: lexical_alternative
  - marker: b
    text: 'Ní gígán: “kí a rí ẹnì kan ní olóòótọ́,” ìyẹn ni, kí ó hàn pé ẹni tí a lè gbẹ́kẹ̀ lé ni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: Nínú ọ̀ràn yìí
  rationale: Àpapọ̀ ọ̀rọ̀ yìí tọ́ka sí ọ̀ràn tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa àwọn ìránṣẹ́ Kristi àti àwọn ìríjú ohun ìjìnlẹ̀ Ọlọ́run. Èdè Yòrùbá yìí mú ìlọsíwájú èrò náà jáde lọ́nà àdánidá láìfi àmì àsopọ̀ méjì tí yóò mú gbólóhùn le sílẹ̀.
- source_word: ζητεῖται
  choice: ohun tí a ń béèrè lọ́wọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ lè jẹ́ ‘a ń wá,’ nínú àkópọ̀ ọ̀rọ̀ yìí ó túmọ̀ sí ohun tí a ń retí tàbí tí a ń béèrè lọ́wọ́ àwọn ìríjú.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: lọ́wọ́ àwọn ìríjú
  rationale: Ìtumọ̀ yìí bá àṣà èdè Yòrùbá mu fún ohun tí a ń béèrè lọ́wọ́ ẹgbẹ́ ènìyàn kan, ó sì pa àwòrán iṣẹ́ ìríjú mọ́.
- source_word: οἰκονόμοις
  choice: àwọn ìríjú
  rationale: ‘Ìríjú’ jẹ́ ọ̀rọ̀ Yòrùbá tó wọ́pọ̀ fún ẹni tí a fi ohun tàbí ilé lé lọ́wọ́ láti máa bójú tó; ó pa ìtumọ̀ iṣẹ́ àbójútó ohun tí a fi léni lọ́wọ́ mọ́.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: pé kí a rí olúkúlùkù wọn ní olóòótọ́
  rationale: Ó pa èrò pé ẹni náà gbọdọ̀ hàn gẹ́gẹ́ bí ẹni tí a lè gbẹ́kẹ̀ lé mọ́. ‘Olúkúlùkù wọn’ sọ ìtọ́kasí gbogbogbò ti τις di mímọ̀ láìdín un sí akọ nìkan.
theological_decisions:
- issue: Ẹyọ aṣojú àti ìbámu akọ-abo
  choice: kí a rí olúkúlùkù wọn ní olóòótọ́
  alternative: kí a rí ọkùnrin kan ní olóòótọ́; kí a rí wọn ní olóòótọ́
  rationale: τις jẹ́ ẹyọ aláìní pàtó, kò sì fi ọ̀rọ̀ náà mọ́ akọ nìkan. ‘Olúkúlùkù wọn’ pa ìdájọ́ ẹni kọ̀ọ̀kan mọ́, ó sì yẹra fún fífi abo kúrò nínú ìtumọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yòrùbá boṣewa, ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye. A lo ‘ìríjú’ láti pa àwòrán olùṣàkóso ohun tí a fi léni lọ́wọ́ mọ́; a sì lo ‘olúkúlùkù wọn’ fún ẹyọ aṣojú tí kò ní ìhámọ̀ akọ-abo.
