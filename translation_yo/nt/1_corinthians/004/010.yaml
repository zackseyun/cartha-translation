id: 1CO.4.10
reference: 1 Corinthians 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: yo
  text: Àwa jẹ́ òmùgọ̀ nítorí ti Mèsáyà[a], ṣùgbọ́n ẹ̀yin jẹ́ ọlọ́gbọ́n nínú Mèsáyà[b]; àwa jẹ́ aláìlera, ṣùgbọ́n ẹ̀yin jẹ́ alágbára; ẹ̀yin jẹ́ ọlọ́lá[c], ṣùgbọ́n àwa jẹ́ aláìní ọlá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nítorí Mèsáyà” tàbí “fún Mèsáyà.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ìdí tàbí ète.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú Kristi.” Èyí ni gbólóhùn tí Pọ́ọ̀lù sábà máa ń lò.
    reason: lexical_alternative
  - marker: c
    text: “Ọlọ́lá” àti “aláìní ọlá” níhìn-ín ṣeé ṣe kí ó tọ́ka sí ipò wọn ní gbangba àti bí àwọn ẹlòmíràn ṣe ń bọ̀wọ̀ fún wọn tàbí ń dójú tì wọ́n, kì í ṣe ìmọ̀lára inú lásán.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: òmùgọ̀
  rationale: Ó pa agbára ọ̀rọ̀ Pọ́ọ̀lù àti ìtakora rẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ‘fools.’
- source_word: διὰ Χριστόν
  choice: nítorí Mèsáyà
  rationale: ‘Nítorí’ lè sọ ìdí tàbí ohun tí a ṣe fún ẹnì kan; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ méjèèjì tí διά pẹ̀lú accusative lè ní mọ́.
- source_word: φρόνιμοι
  choice: ọlọ́gbọ́n
  rationale: Ó bá ‘òmùgọ̀’ ṣe ìtakora ní tààrà, ó sì mú ìfọ̀rọ̀gùn ẹlẹ́yà inú gbólóhùn náà hàn.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: A pa gbólóhùn Pọ́ọ̀lù tí ó wọ́pọ̀, ἐν Χριστῷ, mọ́ láì tú u sí ìtumọ̀ kan ṣoṣo.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: aláìlera / alágbára
  rationale: Àwọn ọ̀rọ̀ yìí pa ìtakora àti ìṣọ̀kan ìlà ọ̀rọ̀ Gíríìkì mọ́ láì fi irú àìlera tàbí agbára kan pàtó sí i.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: ní ọlá / kò ní ọlá
  rationale: Ó fi ìtakora nípa ipò àti bí àwọn ènìyàn ṣe ń ka wọn sí hàn ní Yorùbá àdánidá, láì dín ọ̀rọ̀ náà kù sí ìmọ̀lára inú.
- source_word: ἡμεῖς / ὑμεῖς
  choice: àwa / ẹ̀yin
  rationale: A pa àwọn arọ́pò-orúkọ tí a tẹnumọ́ nínú Gíríìkì mọ́, nítorí ìtakora láàárín àwọn aposteli àti àwọn ará Kọ́ríńtì ṣe pàtàkì.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní ibí yìí Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró; ‘Mèsáyà’ pa agbára oyè náà mọ́, nígbà tí àlàyé fi ‘Kristi’ hàn gẹ́gẹ́ bí ọ̀nà míì tí a lè pè é.
- issue: Ìtumọ̀ ἐν Χριστῷ
  choice: nínú Mèsáyà
  alternative: ní ìbáṣepọ̀ pẹ̀lú Mèsáyà
  rationale: A kò tú gbólóhùn Pọ́ọ̀lù sí ẹ̀kọ́ ìsìn kan ṣoṣo; ‘nínú’ pa ààyè ìtumọ̀ àti ìnira ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforígbárí ‘àwa/ẹ̀yin’ àti ìlà mẹ́ta tí ó jọra ni a pa mọ́; èdè náà jẹ́ ti òde òní, ṣókí, ó sì ní iyì.
