id: 1CO.4.16
reference: 1 Corinthians 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: yo
  text: Nítorí náà, mo bẹ̀ yín, ẹ di aláfarawé mi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ jẹ́ aláfarawé mi.”
    reason: lexical_alternative
  - marker: b
    text: Ní ibòmíràn, Páùlù sọ ní pàtó pé, “Ẹ máa fara wé mi, gẹ́gẹ́ bí èmi náà ti ń fara wé Kristi” (1 Kọ́ríńtì 11:1).
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: mo rọ̀ yín
  rationale: Ọ̀rọ̀ yìí ní agbára ìṣílétí tọkàntọkàn nínú ọ̀rọ̀ Páùlù; ‘mo rọ̀ yín’ jẹ́ èdè Yorùbá àdánidá tí ó lágbára ju ìbéèrè lásán lọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìparí èrò tí ó wá láti inú ọ̀rọ̀ tó ṣáájú hàn ní kedere.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni; ‘yín’ pa ọ̀pọ̀ rẹ̀ mọ́ nínú Yorùbá.
- source_word: μιμηταί
  choice: aláfarawé
  rationale: Ó túmọ̀ sí àwọn tí ń fara wé àpẹẹrẹ ẹlòmíràn; ‘aláfarawé’ sún mọ́ ìtumọ̀ gíríìkì ju ‘ọmọlẹ́yìn’ lọ.
- source_word: μου
  choice: mi
  rationale: Ó so ẹni tí wọ́n ní láti fara wé mọ́ Páùlù ní tààràtà.
- source_word: γίνεσθε
  choice: ẹ di
  rationale: Àṣẹ yìí ń tọ́ka sí wíwọ ipò tuntun tàbí gbígba ìwà kan; ‘ẹ di’ pa ìtumọ̀ ‘become’ mọ́ ju ‘ẹ jẹ́’ lọ.
theological_decisions:
- issue: Ìṣílétí Páùlù pé kí àwọn onígbàgbọ́ fara wé òun lè dà bí ẹni pé ó gbé ara rẹ̀ ga bí a bá yà á kúrò nínú ọ̀rọ̀ nípa Mèsáyà.
  choice: ẹ di aláfarawé mi
  alternative: ẹ máa tẹ̀ lé àpẹẹrẹ mi
  rationale: Gíríìkì fi Páùlù hàn ní tààràtà gẹ́gẹ́ bí ẹni tí wọ́n ní láti fara wé. A kò rọ agbára ọ̀rọ̀ náà kù nínú àyọkà pàtàkì; àlàyé nípa Mèsáyà wà nínú àlàyé ìsàlẹ̀ [b].
translation_notes:
  register: Yorùbá àṣàṣe, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. ‘Ẹ di aláfarawé mi’ jẹ́ tààrà, ó sì pa ìṣòro ẹ̀kọ́-ìgbàgbọ́ inú ẹsẹ náà mọ́ láìtú u sí ọ̀nà ẹ̀ya ìsìn kan.
