id: 1CO.4.7
reference: 1 Corinthians 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: yo
  text: Nítorí ta ni ó mú ọ yàtọ̀?[a] Kí sì ni ìwọ ní tí ìwọ kò gbà? Bí ìwọ bá sì ti gbà á, Èéṣe tí ìwọ fi ń ṣògo bí ẹni pé ìwọ kò gbà á?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí ta ni ó yà ọ sọ́tọ̀?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ṣe ìyàtọ̀,” “yà sọ́tọ̀,” tàbí “mú kí ó yàtọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Nítorí ta ni ó mú ọ yàtọ̀ sí ẹlòmíràn?
  rationale: “Mú … yàtọ̀” ṣe àfihàn ìtumọ̀ transitive διακρίνει ní ọ̀nà Yorùbá àdánidá, ó sì pa agbára ìbéèrè tí ń tako ìgbéraga mọ́. “Sí ẹlòmíràn” jẹ́ ohun tí àyíká ọ̀rọ̀ ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé kò sí ní gbangba nínú Gíríìkì. “Nítorí” ṣe àfihàn γάρ gẹ́gẹ́ bí ìdí fún ìbáwí tó ṣáájú.
- source_word: τί δὲ ἔχεις
  choice: Kí sì ni ìwọ ní
  rationale: “Sì” bá δέ mu gẹ́gẹ́ bí àsopọ̀ fẹ́ẹ́rẹ́ tí ń tẹ̀ lé ìbéèrè àkọ́kọ́, láìfi ìtakora tí kò pọndandan kún un.
- source_word: ὃ οὐκ ἔλαβες
  choice: tí ìwọ kò gbà
  rationale: “Gbà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún λαμβάνω níhìn-ín, aorist náà sì tọ́ka sí ìgbà tí ẹni náà rí ohun náà gbà, kì í ṣe ohun tí ó dá fúnra rẹ̀.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: Bí ìwọ bá sì ti gbà á
  rationale: Àpẹẹrẹ “bá … ti” fi ìtẹnumọ́ καί hàn ní Yorùbá àdánidá, “á” sì padà tọ́ka sí ohun tí a mẹ́nu kàn nínú ìbéèrè tó ṣáájú.
- source_word: τί καυχᾶσαι
  choice: èé ṣe tí ìwọ fi ń ṣògo
  rationale: “Ń ṣògo” mú ìṣe tí ń bá a lọ nínú present καυχᾶσαι jáde, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìgbéraga tàbí fífi ara yangàn nítorí ohun kan.
- source_word: ὡς μὴ λαβών
  choice: bí ẹni pé ìwọ kò gbà á
  rationale: 'Ìtumọ̀ yìí pa ìfiwéra ọ̀nà ìṣe ὡς mọ́: ẹni náà ń ṣògo bí ẹni pé kì í ṣe ohun tí ó rí gbà.'
theological_decisions:
- issue: Ìbáwí Paulu nípa ìyàtọ̀ ènìyàn àti ohun tí ènìyàn ní
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní fífẹ̀ láti kan ohun gbogbo tí ẹni náà ní tàbí tí ó fi yàtọ̀, gẹ́gẹ́ bí ohun tí ó rí gbà.
  alternative: Láti dín ìtumọ̀ náà kù sí àwọn ẹ̀bùn Ẹ̀mí tàbí ipò iṣẹ́ ìránṣẹ́ nìkan.
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa iṣẹ́ àwọn aposteli, ìpín ẹgbẹ́, àti ìgbéraga, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò dín ohun tí a “ní” kù sí ẹ̀bùn kan pàtó. Ìtumọ̀ náà kò yẹ kí ó yanju fífẹ̀ ọ̀rọ̀ yìí lọ́nà ẹ̀kọ́ ìsìn kan.
translation_notes:
  register: Yorùbá ìwọ̀n-àyé, tó ní ọlá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “ìwọ” ní gbangba láti pa ìtẹnumọ́ àwọn ìbéèrè mẹ́tẹ̀ẹ̀ta mọ́; àwọn àmì ohùn àti àmì abẹ́ lẹ́tà ni a kọ ní kíkún níbi tí ó bá yẹ.
