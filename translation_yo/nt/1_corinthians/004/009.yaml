id: 1CO.4.9
reference: 1 Corinthians 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: yo
  text: Nítorí mo rò pé Ọlọ́run ti fi àwa, àwọn aposteli, hàn ní ipò ìkẹyìn, bí àwọn tí a ti dá lẹ́jọ́ ikú[a], nítorí a ti di ohun ìwòran[b] fún ayé, fún àwọn áńgẹ́lì àti fún àwọn ènìyàn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a yàn fún ikú.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tí a ti pèsè tàbí yàn fún ikú, ó sì ṣeé ṣe kí ó ní àwòrán àwọn ẹlẹ́wọ̀n tí a ń mú wọ pápá ìwòran.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “ibi ìtàgé”; níhìn-ín, ìtumọ̀ rẹ̀ ni ohun tí a fi hàn ní gbangba kí àwọn ẹlòmíràn lè wò.
    reason: lexical_alternative
  - marker: c
    text: “Àwọn ènìyàn” túmọ̀ ἀνθρώποις ní ìyàtọ̀ sí “àwọn áńgẹ́lì”; ó ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
    reason: lexical_clarification
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Nítorí mo rò pé
  rationale: Ó pa ìtumọ̀ ọ̀rọ̀ ẹni àkọ́kọ́ mọ́, ó sì fi γάρ hàn gẹ́gẹ́ bí ìsopọ̀ àlàyé pẹ̀lú ohun tí ó ṣáájú.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: àwa àwọn aposteli
  rationale: 'Ó pa ìtumọ̀ àfikún náà mọ́: Pọ́ọ̀lù ń tọ́ka sí ara rẹ̀ àti àwọn aposteli yòókù gẹ́gẹ́ bí ẹgbẹ́ kan pàtó.'
- source_word: ἐσχάτους ἀπέδειξεν
  choice: ti fi ... hàn gẹ́gẹ́ bí àwọn ẹni ìkẹyìn
  rationale: Ó sọ ìfihàn wọn ní gbangba àti ipò ìkẹyìn wọn ní ọ̀nà Yorùbá tí ó ṣe kedere, láì mú àwòrán ọ̀rọ̀ náà kúrò.
- source_word: ὡς ἐπιθανατίους
  choice: bí àwọn tí a ti dá lẹ́jọ́ ikú
  rationale: Ó túmọ̀ sí àwọn tí a ti yàn tàbí dá lẹ́jọ́ láti kú, ó sì bá àwòrán pápá ìwòran tí ó ṣeé ṣe mu.
- source_word: θέατρον ἐγενήθημεν
  choice: a ti di ohun ìwòran
  rationale: Ó sọ àwòrán θέατρον ní Yorùbá àdánidá gẹ́gẹ́ bí ohun tí a gbé kalẹ̀ fún gbogbo ènìyàn láti wò, kì í ṣe ilé ìtàgé nìkan.
- source_word: τῷ κόσμῳ
  choice: fún ayé
  rationale: Ó fi ayé hàn gẹ́gẹ́ bí àwọn olùwò tí a fi àwọn aposteli ṣe ohun ìwòran fún.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: fún àwọn áńgẹ́lì àti fún àwọn ènìyàn
  rationale: Ó pa ìyàtọ̀ láàárín àwọn ẹ̀dá ọ̀run àti àwọn ènìyàn mọ́, láì fi akọ nìkan sí ἀνθρώποις.
theological_decisions:
- issue: Ìtumọ̀ ἀγγέλοις
  choice: àwọn áńgẹ́lì, ìyẹn àwọn ẹ̀dá ọ̀run tí ń wo ìrẹ̀sílẹ̀ àwọn aposteli
  alternative: àwọn ońṣẹ́ ní ìtumọ̀ gbogbogbòò
  rationale: Nínú àpapọ̀ ọ̀rọ̀ pẹ̀lú ‘ayé’ àti ‘àwọn ènìyàn,’ ìtumọ̀ tí ó ṣeé ṣe jù ni àwọn ẹ̀dá ọ̀run; a kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- issue: Bóyá ἐπιθανατίους túmọ̀ sí ìdájọ́ ikú tàbí fífi ènìyàn sílẹ̀ fún ikú
  choice: àwọn tí a ti dá lẹ́jọ́ ikú
  alternative: àwọn tí a yàn sí ikú
  rationale: Àṣàyàn náà jẹ́ Yorùbá àdánidá, ó sì pa àwòrán àwọn ẹlẹ́wọ̀n tí a ń fi hàn ní gbangba mọ́; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ìgbàlódé, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà pa ìrọ̀rùn ọ̀rọ̀ Pọ́ọ̀lù, àwòrán ìfihàn ní gbangba, àti ìtẹ̀síwájú láti ayé sí àwọn áńgẹ́lì àti àwọn ènìyàn mọ́.
