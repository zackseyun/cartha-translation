id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: yo
  text: Nítorí náà, ẹ má ṣe dá ohunkóhun lẹ́jọ́ ṣáájú àkókò náà[a], títí tí Olúwa yóò fi dé. Òun ni yóò sì mú àwọn ohun tí ó farapamọ́ nínú òkùnkùn wá sí ìmọ́lẹ̀, tí yóò sì fi àwọn èrò inú ọkàn hàn[b][c]. Nígbà náà ni ìyìn yóò wá fún olúkúlùkù láti ọ̀dọ̀ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí àkókò tó tó” tàbí “ní kùtùkùtù”; gbólóhùn Gíríìkì lè túmọ̀ sí ṣíṣe ohun kan kí àkókò tó yẹ tàbí tó pinnu tó dé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ète inú ọkàn” tàbí “àwọn ìdí tí ó wà lọ́kàn.”
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, ìyìn náà wá látọ̀dọ̀ Ọlọ́run nígbà tí Olúwa bá dé, tí ó sì ṣí ohun tí ó farapamọ́ payá.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde àríyànjiyàn tí ó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé láti so ìtumọ̀ náà.
- source_word: μὴ πρὸ καιροῦ
  choice: ẹ má ṣe ... ṣáájú àkókò náà
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki láì fi ‘àkókò tí a yàn’ kún un; ó tún lè túmọ̀ sí ṣíṣe ohun kan kí àkókò tó tó, gẹ́gẹ́ bí àlàyé [a] ṣe sọ.
- source_word: τι κρίνετε
  choice: ẹ má ṣe dá ohunkóhun lẹ́jọ́
  rationale: ‘Dá ... lẹ́jọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ìdájọ́ lé ohun tàbí ènìyàn lórí, ‘ohunkóhun’ sì pa ìtẹnumọ́ τι mọ́.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: títí Olúwa yóò fi dé
  rationale: Ó pa ààlà àkókò tí gbólóhùn Gíríìkì fi lélẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún dídé Olúwa ní ọjọ́ iwájú.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Orúkọ oyè tí ó fìdí múlẹ̀ ní Yorùbá ni ‘Olúwa’; a kò fẹ̀ ọ́ sí ‘Jésù’ nínú ọ̀rọ̀ pàtàkì, kí a lè pa bí orísun ṣe sọ ọ́ mọ́.
- source_word: φωτίσει
  choice: yóò ... mú ... wá sí ìmọ́lẹ̀
  rationale: Àwòrán ọ̀rọ̀ yìí ń sọ nípa ṣíṣí ohun tí ó farapamọ́ payá, kì í ṣe ìmọ́lẹ̀ ojú lásán; gbólóhùn Yorùbá yìí pa àwòrán náà mọ́.
- source_word: τὰ κρυπτὰ τοῦ σκότους
  choice: àwọn ohun tí ó farapamọ́ nínú òkùnkùn
  rationale: Ó pa ‘àwọn ohun tí ó farapamọ́’ àti ‘òkùnkùn’ méjèèjì mọ́, láì túmọ̀ rẹ̀ ju bí orísun ṣe sọ lọ.
- source_word: φανερώσει
  choice: yóò ... fi ... hàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ṣíṣí ohun kan payá, ó sì bá ‘mú ... wá sí ìmọ́lẹ̀’ rìn ní ìfarajọ.
- source_word: τὰς βουλὰς τῶν καρδιῶν
  choice: àwọn èrò inú ọkàn
  rationale: ‘Èrò inú ọkàn’ lè gba ète, ìfẹ́-inú, àti ohun tí ènìyàn pinnu sínú, láì dín βουλαί kù sí ìdí ìṣe búburú nìkan. Àlàyé [b] pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
- source_word: τότε
  choice: Nígbà náà
  rationale: Ó ṣe àmì àkókò tí àbájáde náà yóò dé lẹ́yìn ìṣípayá Olúwa.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: ìyìn olúkúlùkù yóò ti ọ̀dọ̀ Ọlọ́run wá
  rationale: Ó pa ìtumọ̀ pé ìyìn náà yóò dé bá ẹnì kọ̀ọ̀kan àti pé Ọlọ́run ni orísun rẹ̀ mọ́, ní Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ìwọ̀n àti àkókò ìdájọ́
  choice: Pọ́ọ̀lù kọ̀ láti dá ẹlòmíràn lẹ́jọ́ kí àkókò náà tó dé, ó sì so àkókò náà mọ́ dídé Olúwa àti ṣíṣí ohun ìkọ̀kọ̀ payá.
  alternative: Kí a ka ọ̀rọ̀ náà sí ìfòfindè gbogbo irú ìwádìí tàbí ìyẹ̀wò pátápátá, tàbí sí ìdájọ́ àwọn àpọ́sítélì nìkan.
  rationale: Ọ̀rọ̀ orísun gbòòrò ní ‘ohunkóhun,’ ṣùgbọ́n gbólóhùn ‘títí Olúwa yóò fi dé’ fi ààlà àkókò àti àyíká ìdájọ́ ọjọ́ iwájú hàn. Ìtumọ̀ náà kò fi ẹ̀kọ́ àfikún wọ ọ̀rọ̀ náà.
- issue: Ta ni ‘Olúwa’ ń tọ́ka sí?
  choice: A pa orúkọ oyè ‘Olúwa’ mọ́; nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù, ó ṣeé ṣe jù pé Jésù ni, ẹni tí yóò dé tí yóò sì ṣe ìṣípayá.
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà sí Ọlọ́run lápapọ̀, tàbí kí a fi ‘Jésù’ rọ́pò orúkọ oyè náà nínú ọ̀rọ̀ pàtàkì.
  rationale: ὁ κύριος jẹ́ orúkọ oyè nínú orísun, nítorí náà ‘Olúwa’ pa ọ̀rọ̀ àti agbára ẹ̀kọ́ nípa Kristi mọ́ láì fẹ̀ ọ́ sí i.
- issue: Ìtumọ̀ ìyìn tí ẹnì kọ̀ọ̀kan yóò rí
  choice: A sọ pé ìyìn olúkúlùkù yóò ti ọ̀dọ̀ Ọlọ́run wá, gẹ́gẹ́ bí ọ̀rọ̀ ṣe sọ.
  alternative: Kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí ẹ̀san ìgbàlà, ìdálẹ́bi, tàbí ìjẹ́wọ́ pé gbogbo ènìyàn ṣe rere.
  rationale: Orísun sọ ‘ìyìn’ fún ẹnì kọ̀ọ̀kan ṣùgbọ́n kò ṣàlàyé ìbáṣepọ̀ rẹ̀ pẹ̀lú ìgbàlà tàbí ìdálẹ́bi níbí. Ìtumọ̀ náà pa ìdààmú ẹ̀kọ́ yìí mọ́ láì yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀, tó ṣe déédéé, tí òǹkàwé òde òní sì lè lóye. Àṣẹ ọ̀pọ̀ ènìyàn ‘ẹ má ṣe’ bá àyíká lẹ́tà sí ìjọ mu. A yà gbólóhùn gígùn Gíríìkì sí méjì fún kíkà tó rọrùn, láì yí ìbáṣepọ̀ àwọn kókó inú rẹ̀ padà.
