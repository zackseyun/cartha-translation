  terminology: ‘Mèsáyà’ appropriately renders the titular force of Χριστός, and ‘nínú Olúwa’ faithfully preserves the Pauline expression. The personal name Jesus should be written ‘Jésù’ in standard Yoruba orthography, including in the related footnote.
