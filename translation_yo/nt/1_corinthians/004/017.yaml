id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: yo
  text: Nítorí èyí ni mo ṣe rán Tímótì sí yín. Òun ni ọmọ mi[a] olùfẹ́ àti olóòótọ́ nínú Olúwa. Òun yóò rán yín létí àwọn ọ̀nà mi nínú Mèsáyà Jésù,[b] gẹ́gẹ́ bí mo ti ń kọ́ni níbi gbogbo, nínú gbogbo ìjọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí ‘ọmọkùnrin mi.’ Ọ̀rọ̀ Gíríìkì τέκνον túmọ̀ sí ‘ọmọ’ ní tààrà, bí ó tilẹ̀ jẹ́ pé nínú àyíká yìí a lè pè é ní ‘ọmọkùnrin.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú u sí ‘Kristi Jésù.’ Níhìn-ín, a tú oyè Gíríìkì Χριστός sí ‘Mèsáyà’ láti fi ìtumọ̀ rẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó jẹ́ àsopọ̀ ìdí tó ṣe àdéhùn pẹ̀lú ọ̀rọ̀ tó ṣáájú, ó sì dára ní Yorùbá òde òní.
- source_word: ἔπεμψα
  choice: ni mo ṣe rán
  rationale: Ó fi aorist náà hàn gẹ́gẹ́ bí ìṣe tó ṣẹlẹ̀, ètò ‘ni mo ṣe’ sì jẹ́ kí ìdí tí Pọ́ọ̀lù fi rán án ṣe kedere ní Yorùbá.
- source_word: Τιμόθεον
  choice: Tímótì
  rationale: Èyí ni ìkọ̀wé orúkọ náà tó wọ́pọ̀, pẹ̀lú àmì ohùn Yorùbá.
- source_word: τέκνον
  choice: ọmọ
  rationale: ‘Ọmọ’ kò fi akọ tàbí abo pàtó sí i, ó sì pa àkàwé ìbátan ìdílé tí Pọ́ọ̀lù lò mọ́; ‘ọmọkùnrin’ jẹ́ àṣàyàn tó ṣeé ṣe nítorí Tímótì jẹ́ ọkùnrin.
- source_word: ἀγαπητὸν
  choice: olùfẹ́
  rationale: Ó fi ìfẹ́ jíjinlẹ̀ àti ọlá tó wà nínú àpèjúwe Tímótì hàn ní ṣókí.
- source_word: πιστὸν
  choice: olóòótọ́
  rationale: Ó lè túmọ̀ sí ẹni tó dúró ṣinṣin àti ẹni tí a lè gbẹ́kẹ̀ lé, ó sì bá iṣẹ́ Tímótì mu.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù nípa ipò àti ìbátan Tímótì pẹ̀lú Olúwa mọ́ láì tú ìtumọ̀ rẹ̀ sí ọ̀nà kan ṣoṣo.
- source_word: ἀναμνήσει
  choice: yóò rán yín létí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe ọjọ́ iwájú ti mímú ohun tí wọ́n ti mọ̀ padà sí ìrántí wọn.
- source_word: τὰς ὁδούς μου
  choice: àwọn ọ̀nà mi
  rationale: Ó pa àkàwé ‘ọ̀nà’ mọ́, èyí tó lè gba ìgbésí ayé, ìṣe iṣẹ́ ìránṣẹ́, àti ẹ̀kọ́ Pọ́ọ̀lù sínú.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jesu
  rationale: ‘Mèsáyà’ tú Χριστός gẹ́gẹ́ bí oyè; gbólóhùn náà sọ pé àwọn ọ̀nà Pọ́ọ̀lù wà lábẹ́ ìbátan àti ìṣàkóso Mèsáyà Jesu.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu hàn láàárín ohun tí Tímótì yóò rán wọn létí àti ohun tí Pọ́ọ̀lù ń kọ́.
- source_word: πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ
  choice: níbi gbogbo, nínú gbogbo ìjọ
  rationale: 'Ó pa ìtẹnumọ́ méjèèjì mọ́: gbogbo ibi àti gbogbo ìjọ.'
theological_decisions:
- issue: Bí a ṣe tú Χριστός nínú ἐν Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; ‘Mèsáyà’ fi ìtumọ̀ oyè náà hàn dípò kí a kàn kọ ọ́ bí orúkọ.
- issue: Ìtumọ̀ ‘àwọn ọ̀nà mi’
  choice: Pa àkàwé ‘àwọn ọ̀nà mi’ mọ́
  alternative: ìwà àti ọ̀nà ìgbésí ayé mi
  rationale: ὁδοί jẹ́ àkàwé tó gbòòrò sí ìgbésí ayé, iṣẹ́, àti ẹ̀kọ́ Pọ́ọ̀lù; ṣíṣe e ní pàtó sí ìwà nìkan yóò dín ààyè ìtumọ̀ náà kù.
- issue: Ìtumọ̀ ἐν κυρίῳ
  choice: nínú Olúwa
  alternative: gẹ́gẹ́ bí ọmọ Olúwa / nínú iṣẹ́ Olúwa
  rationale: Ìtumọ̀ gígùn náà pa ìṣọ̀kan, ìbátan, àti àyíká iṣẹ́ Tímótì nínú Olúwa mọ́ láì yan ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá ìpele àárín tó ní ọlá, tó ṣeé yé fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lo gbólóhùn Yorùbá àdánidá, ṣùgbọ́n a pa àkàwé àti àìdánilójú tó wà nínú Gíríìkì mọ́.
