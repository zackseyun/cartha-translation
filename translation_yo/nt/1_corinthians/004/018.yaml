  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: yo
  text: Àwọn kan sì ti di agbéraga[a], bí ẹni pé èmi kò ní wá sọ́dọ̀ yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lo àwòrán ohun tí a fú débi tí ó fi wú láti sọ ìgbéraga. Fí wé 1 Kọ́ríńtì 4:6, 4:19; 5:2; 8:1; 13:4.
    reason: lexical_image_and_cross_reference
  - marker: b
    text: Èyí ń sọ èrò àwọn kan, kì í ṣe pé Pọ́ọ̀lù fúnra rẹ̀ ń kéde pé òun kò ní wá.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ὡς
  choice: bí ẹni pé
  rationale: Ó fi ìròyìn tàbí ìrònú tí kò dájú hàn ní Yorùbá, ó sì pa agbára ìfiwé àti àròsọ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: èmi kò ní wá sọ́dọ̀ yín
  rationale: Ìtumọ̀ yìí sọ ọ̀rọ̀ participle Gíríìkì di gbólóhùn Yorùbá àdánidá. Ní ìsopọ̀ pẹ̀lú “bí ẹni pé,” ó jẹ́ èrò tí àwọn kan ní, kì í ṣe ìkéde Pọ́ọ̀lù.
- source_word: δέ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó bá ipa δέ mu, ó sì so ẹsẹ̀ náà mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: ἐφυσιώθησάν
  choice: ti wú fùkẹ̀
  rationale: Ó pa àwòrán Pọ́ọ̀lù nípa fífú tàbí wíwú nítorí ìgbéraga mọ́, dípò kí a sọ ìtumọ̀ rẹ̀ ní pẹ̀lẹ́pẹ̀lẹ́ gẹ́gẹ́ bí “di agbéraga” nìkan. “Ti” fi ipò tí ìṣe náà ti yọrí sí hàn.
- source_word: τινες
  choice: Àwọn kan
  rationale: Ó tọ́ka sí díẹ̀ lára àwọn ènìyàn inú ìjọ, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àbùkù Pọ́ọ̀lù sí ìgbéraga àwọn ará Kọ́ríńtì
  choice: Pa àwòrán “wú fùkẹ̀” mọ́.
  alternative: Àwọn kan sì ti di agbéraga.
  rationale: Àwòrán yìí tún fara hàn léraléra nínú lẹ́tà náà, ó sì jẹ́ kí òǹkàwé rí ìṣọ̀kan ọ̀rọ̀ Pọ́ọ̀lù láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò. “Wú fùkẹ̀” jẹ́ àwòrán tó ṣeé lóye fún ìgbéraga, “bí ẹni pé” sì jẹ́ ọ̀nà àdánidá láti pa ìtumọ̀ àròsọ Gíríìkì mọ́. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
