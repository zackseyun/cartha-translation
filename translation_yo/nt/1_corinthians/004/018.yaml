revisions:
- from: 'Àwọn kan sì ti wú fùkẹ̀[a], bí ẹni pé èmi kò ní wá sọ́dọ̀ yín.[b]


    [a] Pọ́ọ̀lù máa ń lo àwòrán yìí, “wú fùkẹ̀,” nínú 1 Kọ́ríńtì láti sọ ìgbéraga ẹni tí ó ka ara rẹ̀ sí pàtàkì; fi wé 1 Kọ́ríńtì 4:6, 4:19; 5:2; 8:1; 13:4. A tún lè túmọ̀ ọ́ pé, “Àwọn kan sì ti di agbéraga.”


    [b] Gbólóhùn náà fi hàn pé èrò àwọn kan ni pé Pọ́ọ̀lù kò ní wá; kì í ṣe pé Pọ́ọ̀lù fúnra rẹ̀ ń sọ pé òun kò ní wá.'
  to: Àwọn kan sì ti di agbéraga[a], bí ẹni pé èmi kò ní wá sọ́dọ̀ yín.[b]
  rationale: A rọ́pò gbolohun tí kò ṣe kedere náà, ‘wú fùkẹ̀,’ pẹ̀lú ‘ti di agbéraga,’ kí ìbáwí Pọ́ọ̀lù lè yé òǹkàwé Yorùbá lónìí. Àlàyé [a] pa àwòrán Gíríìkì φυσιόω àti ìṣọ̀kan rẹ̀ pẹ̀lú àwọn ìlò rẹ̀ mìíràn nínú 1 Kọ́ríńtì mọ́. A pa ‘sì,’ ‘Àwọn kan,’ àti ‘bí ẹni pé ... kò ní wá’ mọ́, nítorí wọ́n ń fi δέ, τινες, àti agbára àròsọ ὡς μὴ ἐρχομένου hàn.
