  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa: μύριοι ni ‘àìmọye,’ παιδαγωγοί ni ‘àwọn alábojútó,’ a pa ‘nínú Mèsáyà’ mọ́ fún ἐν Χριστῷ, a sì pa àkàwé ìbímọ́/ìbísí ti ἐγέννησα mọ́ nínú ‘èmi ni mo bí yín.’ ‘Nípasẹ̀ ìhìn rere’ tún fi ìtumọ̀ irinṣẹ́ ti διὰ τοῦ εὐαγγελίου hàn dáadáa.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tí ó rọrùn láti ka. A ṣe àtúnṣe kékeré sí ìtòlẹ́sẹẹsẹ àwọn àmì àlàyé ìsàlẹ̀, kí àmì kọ̀ọ̀kan lè wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí ó ń ṣàlàyé. A tún fi ‘àwọn bàbá púpọ̀’ sí i fún ìfarahàn púpọ̀ tí ó hàn gbangba nínú ìfiwéra náà.
  terminology: ‘Mèsáyà’ jẹ́ ìtumọ̀ tó bára mu fún Χριστός gẹ́gẹ́ bí oyè, ‘ìhìn rere’ yẹ fún εὐαγγέλιον, ‘alábojútó’ sì yẹ fún ipa παιδαγωγός láì sọ ọ́ di olùkọ́ kíláàsì. ‘Mo bí yín’ pa agbára àkàwé Gíríìkì mọ́; àlàyé ìsàlẹ̀ ń ṣàlàyé pé àkàwé ni.
