  to: Nítorí bí ẹ tilẹ̀ ní àwọn alábojútó[b] àìmọye[a] nínú Mèsáyà[d], síbẹ̀ ẹ kò ní àwọn bàbá púpọ̀; nítorí nínú Mèsáyà Jésù[d], nípasẹ̀ ìhìn rere, èmi ni mo bí yín[c].
