    rationale: Amì a yẹ kí ó tẹ̀lé ‘àìmọye’; b yẹ kí ó tẹ̀lé ‘alábojútó’; d sì yẹ kí ó tẹ̀lé ‘Mèsáyà’ nínú àwọn gbólóhùn méjèèjì. Èyí ń mú kí ìtọ́kasí ẹsẹ̀ rọrùn, kò sì yí ìtumọ̀ padà.
