id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: yo
  text: Nítorí bí ẹ tilẹ̀ ní àwọn alábojútó[b] àìmọye[a] nínú Mèsáyà[d], síbẹ̀ ẹ kò ní àwọn bàbá púpọ̀; nítorí nínú Mèsáyà Jésù[d], nípasẹ̀ ìhìn rere, èmi ni mo bí yín[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘ẹgbẹ̀rún mẹ́wàá’; ọ̀rọ̀ Gíríìkì μυρίους sábà máa ń tọ́ka sí iye tí ó pọ̀ gidigidi.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘àwọn olùtọ́sọ́nà.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí ń ṣàbójútó ọmọ, tí ó sì ń tọ́ ọ sọ́nà, kì í ṣe olùkọ́ kíláàsì ní pàtàkì.
    reason: cultural_note
  - marker: c
    text: 'Ní tààrà, ‘mo bí yín.’ Àkàwé ni ọ̀rọ̀ náà: Paulu ń sọ ipa tirẹ̀ nínú mímú wọn wá sí ìgbàgbọ́ nípasẹ̀ ìhìn rere.'
    reason: lexical_alternative
  - marker: d
    text: Tàbí ‘nínú Kristi’ àti ‘nínú Kristi Jésù’; Χριστός jẹ́ oyè tí a tú sí ‘Mèsáyà’ níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: μυρίους
  choice: àìmọye
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí ‘ẹgbẹ̀rún mẹ́wàá,’ níbí ó ń ṣiṣẹ́ gẹ́gẹ́ bí àpọnlé fún iye tí ó pọ̀ gidigidi. ‘Àìmọye’ mú agbára ìfiwéra náà jáde lọ́nà Yorùbá àdánidá.
- source_word: παιδαγωγοὺς
  choice: àwọn alábojútó
  rationale: Nínú àṣà Gíríìkì àti Róòmù, παιδαγωγός jẹ́ ẹni tí a fi ọmọ sí abẹ́ àbójútó àti ìtọ́sọ́nà rẹ̀, kì í ṣe olùkọ́ kíláàsì ní pàtàkì. ‘Alábojútó’ fi ipa yẹn hàn láì dín un kù sí olùkọ́.
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà / nínú Mèsáyà Jésù
  rationale: A pa ἐν mọ́ gẹ́gẹ́ bí ‘nínú,’ èyí tí ó dáàbò bo ọ̀nà tí Paulu máa ń lò ó láti sọ ìbáṣepọ̀ tàbí ìṣọ̀kan pẹ̀lú Mèsáyà. A tú Χριστός sí ‘Mèsáyà’ gẹ́gẹ́ bí oyè.
- source_word: πατέρας
  choice: baba
  rationale: A pa àkàwé bàbá inú Gíríìkì mọ́ láì fi ‘nípa ẹ̀mí’ kún un nínú ọ̀rọ̀ pàtàkì.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: nípasẹ̀ ìhìn rere
  rationale: διά pẹ̀lú ẹ̀yà ọlọ́rọ̀ yìí ń tọ́ka sí ohun èlò tàbí ọ̀nà; ‘nípasẹ̀’ fi hàn pé ìhìn rere ni ọ̀nà tí Paulu fi bí wọn.
- source_word: ἐγέννησα
  choice: èmi ni mo bí yín
  rationale: ‘Mo bí yín’ sún mọ́ àkàwé ìbí inú Gíríìkì, ó sì ṣeé lóye ní Yorùbá. Ìtẹnumọ́ ‘èmi ni’ tún ṣe àfihàn ìyàtọ̀ láàárín àwọn alábojútó púpọ̀ àti baba tí kò pọ̀.
theological_decisions:
- issue: Bí a ṣe máa fi àkàwé ìbí àti ipò Paulu hàn láì gbé ẹ̀kọ́ ìjọ kan wọ inú ẹsẹ náà
  choice: A lò ‘èmi ni mo bí yín,’ a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé àkàwé ni.
  alternative: ‘Mo di baba yín’ tàbí ‘mo di baba yín nípa ẹ̀mí.’
  rationale: Àṣàyàn náà pa líle àti ìyàlẹ́nu àkàwé Gíríìkì mọ́, ó so ipa Paulu mọ́ ìhìn rere, kò sì fi èrò nípa ipò àlùfáà, sacramenti, tàbí oyè ‘baba nípa ẹ̀mí’ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìṣètò ìfiwéra àti àkàwé ìbí ti orísun Gíríìkì mọ́, ṣùgbọ́n a mú un rọrùn ní ìṣàn Yorùbá.
