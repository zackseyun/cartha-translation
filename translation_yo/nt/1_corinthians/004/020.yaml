  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: yo
  text: Nítorí ìjọba Ọlọ́run kò wà nínú ọ̀rọ̀[a], bí kò ṣe nínú agbára.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú àsọyé” tàbí “nínú ọ̀rọ̀ ẹnu lásán”; ìyàtọ̀ náà wà láàárín ọ̀rọ̀ àti agbára tó ń ṣiṣẹ́, láì sọ irú agbára náà ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí ... kò
  rationale: γάρ ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀, οὐ sì ń sẹ́ gbólóhùn náà; ‘Nítorí ... kò’ jẹ́ àsopọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐν λόγῳ
  choice: nínú ọ̀rọ̀ lásán
  rationale: λόγος lè túmọ̀ sí ọ̀rọ̀ tàbí àsọyé. ‘Ọ̀rọ̀ lásán’ mú ìyàtọ̀ rẹ̀ sí agbára tó ń ṣiṣẹ́ hàn, láì dín ìtumọ̀ náà kù sí ọgbọ́n àsọyé nìkan.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tó bójú mu, tó sì pa ìtumọ̀ βασιλεία mọ́ gẹ́gẹ́ bí ìṣàkóso àti ìjọba.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: bí kò ṣe nínú agbára
  rationale: δύναμις túmọ̀ sí agbára; gbólóhùn yìí pa ìtakora tó lágbára mọ́ láàárín ọ̀rọ̀ lásán àti agbára tó munadoko.
theological_decisions:
- issue: Irú ìyàtọ̀ tó wà láàárín ‘ọ̀rọ̀’ àti ‘agbára’
  choice: Ẹsẹ̀ náà fi ọ̀rọ̀ lásán wé agbára tó ń ṣiṣẹ́ gẹ́gẹ́ bí àmì ìjọba Ọlọ́run, láì sọ irú agbára pàtó.
  alternative: Kí a sọ pé agbára náà jẹ́ iṣẹ́ ìyanu, ìwà ayé tó yí padà, ìbáwí ìjọ, àṣẹ aposteli, tàbí iṣẹ́ Ẹ̀mí ní pàtó.
  rationale: Ọ̀rọ̀ Gíríìkì kò fi irú agbára náà mọ́ ohun kan ṣoṣo; ìtumọ̀ yẹ kí ó pa ààyè ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Bí kò ṣe’ jẹ́ ọ̀nà àdánidá láti sọ ἀλλά nínú gbólóhùn tí a sẹ́.
