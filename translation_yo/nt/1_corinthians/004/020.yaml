  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtakora βασιλεία/λόγος/δύναμις hàn dáadáa. Síbẹ̀, fífi “lásán” sínú ọ̀rọ̀ ìtumọ̀ àkọ́kọ́ ń sọ ἐν λόγῳ di ‘nínú ọ̀rọ̀ lásán’ ní pàtó, níbi tí Gíríìkì ti fi ‘nínú ọ̀rọ̀’ sílẹ̀ láì fi ọ̀rọ̀ kan tó túmọ̀ sí ‘lásán’ kún un. Àyíká ọ̀rọ̀ ń jẹ́ kí ìyàtọ̀ náà hàn, ṣùgbọ́n ó dára kí ìtumọ̀ pàtàkì náà pa ìfaradà Gíríìkì mọ́.
  naturalness: “Nítorí ìjọba Ọlọ́run kò wà nínú ọ̀rọ̀, bí kò ṣe nínú agbára” jẹ́ Yorùbá ìgbàlódé, tó ní iyì, tí ó sì dára nípa àmì ohùn. “Bí kò ṣe” ń ṣiṣẹ́ dáadáa fún ἀλλά nínú ìtakora yìí.
