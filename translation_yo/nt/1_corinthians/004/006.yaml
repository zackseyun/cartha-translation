  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ète ẹsẹ̀ náà, ìkìlọ̀ nínú gbólóhùn tí a gé kúrú, àti ìṣọ̀kan “ní tì ẹni kan lòdì sí ẹlòmíràn” hàn dáadáa. Ṣùgbọ́n “nítorí yín” lè túmọ̀ sí “nítorí/nípa yín” ju ìtumọ̀ ìfẹ́-ànfààní ti δι’ ὑμᾶς lọ; “fún yín” dáa sí i. Ọ̀nà “lo ... gẹ́gẹ́ bí àpẹẹrẹ fún èmi àti Apólò” tún lè dà bíi pé a lo àwọn nǹkan náà fún Pọ́ọ̀lù àti Apólò, dípò pé ó fi àwọn méjèèjì náà ṣe àpẹẹrẹ.
  naturalness: Àtúnṣe náà lo Yorùbá òde òní tó mọ́gbọ́n dání. “Kọ́ ẹ̀kọ́ yìí nípasẹ̀ àpẹẹrẹ wa” túmọ̀ ìsọ̀rọ̀ Gíríìkì ἐν ἡμῖν ní ọ̀nà kedere láìsọ ohun tí kò wà nínú rẹ̀. “Má ṣe kọjá” jẹ́ àdánidá ju “má ṣe ré kọjá” lọ nínú àyíká yìí.
  terminology: A tún fi orúkọ náà sí ìrísí Yorùbá tó wọ́pọ̀, “Apólòsì.” “Gbéraga” bójú mu φυσιοῦσθε, bí ó tilẹ̀ jẹ́ pé àwòrán ìfúnpá Gíríìkì kò hàn ní tààrà. A ṣàlàyé ìfẹ́hàn ẹgbẹ́ kan nínú gbolohun ìkẹyìn láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
