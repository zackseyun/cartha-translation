    rationale: Èyí ṣe é bíi pé “èyí” ni kókó-ọrọ̀ gbolohun náà. Ní ti gidi, gbólóhùn náà kò ní ọ̀rọ̀-ìṣe gbangba; ó jẹ́ “not beyond what is written” ní ìrísí tí a gé kúrú.
