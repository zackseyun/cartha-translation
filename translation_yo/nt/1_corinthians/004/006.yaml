id: 1CO.4.6
reference: 1 Corinthians 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: yo
  text: 'Ẹ̀yin ará,[a] mo ti lo àwọn nǹkan wọ̀nyí láti fi ara mi àti Apólòsì ṣe àpẹẹrẹ fún yín, kí ẹ lè kọ́ ẹ̀kọ́ yìí nípasẹ̀ àpẹẹrẹ wa pé: “Ẹ má ṣe kọjá ohun tí a ti kọ sílẹ̀,”[b] kí ẹnikẹ́ni nínú yín má bàa gbéraga ní ìfẹ́hàn sí ẹni kan lòdì sí ẹlòmíràn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ni “arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀nà láti bá àwùjọ tí àwọn ọkùnrin àti obìnrin wà nínú rẹ̀ sọ̀rọ̀.
    reason: cultural_note
  - marker: b
    text: Gbólóhùn Gíríìkì náà jẹ́ gbólóhùn tí a gé kúrú; kò ní ọ̀rọ̀-ìṣe gbangba. Ní ti gidi, ó dà bíi “kì í ṣe kọjá ohun tí a ti kọ sílẹ̀.” Ó ṣeé ṣe kí ó jẹ́ ọ̀rọ̀ àyọlò tàbí òwe kúkúrú kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìtọ́kasí ọ̀pọ̀ nǹkan tí Pọ́ọ̀lù ti sọ ṣáájú mọ́.
- source_word: ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: Ọ̀rọ̀ Yorùbá “ará” bá ọ̀rọ̀ ìpè Gíríìkì mu, ó sì lè tọ́ka sí gbogbo àwọn onígbàgbọ́ láìka akọ tàbí abo.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: mo ṣe lo ... gẹ́gẹ́ bí àpẹẹrẹ fún èmi àti Apólò
  rationale: 'Ó sọ ìgbésẹ̀ àsọyé náà ní Yorùbá àdánidá: Pọ́ọ̀lù ti gbé ohun tí ó ń jíròrò lé ara rẹ̀ àti Apólò gẹ́gẹ́ bí àpẹẹrẹ.'
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: Ó fi èrè àti ìdí iṣẹ́ Pọ́ọ̀lù hàn ní ṣókí.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: kí ẹ lè kọ́ nínú àpẹẹrẹ wa
  rationale: “Nínú wa” jẹ́ gbólóhùn tí ó há ní Gíríìkì; fífi “àpẹẹrẹ” kún un mú ipa Pọ́ọ̀lù àti Apólò hàn ní Yorùbá tó ṣe kedere.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'pé: “Ẹ má ṣe ré kọjá ohun tí a ti kọ sílẹ̀”'
  rationale: Ó mú ìkìlọ̀ tí gbólóhùn Gíríìkì tí a gé kúrú ń sọ jáde, láìsọ ohun tí “a kọ” náà ní pàtó ju orísun lọ.
- source_word: φυσιοῦσθε
  choice: gbéraga
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìgbéraga tàbí ìrera tí àwòrán “wíwu sókè” náà ń tọ́ka sí.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: nítorí ẹni kan lòdì sí ẹlòmíràn
  rationale: Ó pa ìtumọ̀ ìfọ̀rọ̀sí ẹgbẹ́ kan lòdì sí òmíràn mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn tí a gé kúrú, τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'Ṣe é bí ìkìlọ̀: “Ẹ má ṣe ré kọjá ohun tí a ti kọ sílẹ̀.”'
  alternative: “Kì í ṣe ré kọjá ohun tí a ti kọ sílẹ̀,” tàbí kí a kà á sí ọ̀rọ̀ àyọlò kan.
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe gbangba níbí, ṣùgbọ́n gbólóhùn náà ń ṣiṣẹ́ gẹ́gẹ́ bí ẹ̀kọ́ ìkìlọ̀. Àlàyé ìsàlẹ̀ ojú ìwé pa bí Gíríìkì ṣe há mọ́, láìfi ẹ̀kọ́ ìsìn kan pàtó kún un.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” fún àwùjọ, a sì fi àmì ohùn síbi tí ó yẹ. “Gbéraga” jẹ́ àdánidá ju títú àwòrán “wíwu” Gíríìkì ní tààrà lọ.
