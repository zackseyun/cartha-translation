    rationale: “Apólòsì” ni ìrísí Yorùbá tó wọ́pọ̀ fún Ἀπολλῶν/Apollos, ó sì dára fún ìbámu pẹ̀lú ọ̀rọ̀ Bíbélì Yorùbá.
