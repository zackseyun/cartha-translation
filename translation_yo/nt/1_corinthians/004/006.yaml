    rationale: Ní Yorùbá, èyí sábà máa ń túmọ̀ sí “because of you.” Ní àyíká yìí διά pẹ̀lú akọ́wọ́lé ń fi èrè tàbí ìfẹ́-ànfààní wọn hàn; “fún yín” jẹ́ kedere sí i.
  - severity: medium
