id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: yo
  text: Ẹ ti yó tán ná; ẹ ti di ọlọ́rọ̀ ná; láìsí wa ni ẹ ti jọba.[a] Ìbá ṣe pé ẹ ti jọba gan-an,[b] kí àwa pẹ̀lú lè bá yín jọba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pọ́ọ̀lù ń sọ̀rọ̀ ẹlẹ́gàn níbí: àwọn ará Kọ́ríńtì ń hùwà bí ẹni pé wọ́n ti ní ohun gbogbo, wọ́n ti di ọlọ́rọ̀, wọ́n sì ti ń jọba.'
    reason: cultural_note
  - marker: b
    text: 'Tàbí: “Ká ní ẹ ti jọba gan-an!” Èyí pa ọ̀nà ìfẹ́ inú gbólóhùn Gíríìkì mọ́ ní tààrà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ná
  rationale: Ọ̀rọ̀ náà ń tẹnu mọ́ pé, gẹ́gẹ́ bí ìrònú àwọn ará Kọ́ríńtì, àwọn ti dé ipò yìí ‘tẹ́lẹ̀ rí’ tàbí ‘ní báyìí.’ Fífi ‘ná’ sí òpin àwọn gbólóhùn méjèèjì dá àtúnwí àti ìtẹnumọ́ Pọ́ọ̀lù sí.
- source_word: κεκορεσμένοι ἐστέ
  choice: ẹ ti yó tán
  rationale: Ìtumọ̀ yìí fi ipò ìtẹ́lọ́rùn tó jẹ́ àbájáde ohun tí ó ti ṣẹlẹ̀ hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ènìyàn ti jẹ́ tàbí ti rí ohun tó tó fún un.
- source_word: ἐπλουτήσατε
  choice: ẹ ti di ọlọ́rọ̀
  rationale: ‘Di ọlọ́rọ̀’ pa ìtumọ̀ ìyípadà sí ipò ọrọ̀ mọ́, dípò kí a sọ ipò náà nìkan.
- source_word: χωρὶς ἡμῶν
  choice: láìsí àwa
  rationale: Ó fi hàn pé, nínú àwòrán ọ̀rọ̀ Pọ́ọ̀lù, àwọn ará Kọ́ríńtì ṣe bí ẹni pé wọn dé ipò ọba láìka àwọn aposteli kún un.
- source_word: ἐβασιλεύσατε
  choice: ẹ ti jọba
  rationale: ‘Jọba’ túmọ̀ sí ṣíṣe ìjọba gẹ́gẹ́ bí ọba, ó sì pa àwòrán ọba inú βασιλεύω mọ́ láìfi ìtumọ̀ ‘bẹ̀rẹ̀ sí’ kún un.
- source_word: ὄφελόν γε
  choice: Ìbá sì ti dára gan-an bí
  rationale: Àkójọpọ̀ yìí fi ìfẹ́ ohun tí kò tíì jẹ́ òtítọ́ hàn, ó sì pa ìtẹnumọ́ γε mọ́ nípasẹ̀ ‘gan-an.’
- source_word: ἵνα
  choice: kí
  rationale: ‘Kí’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde ohun tí a ń fẹ́ hàn.
- source_word: συμβασιλεύσωμεν
  choice: kí àwa pẹ̀lú lè bá yín jọba
  rationale: ‘Bá yín jọba’ fi ìjọba papọ̀ tí ìpele συν- ń sọ hàn, ‘pẹ̀lú’ sì tún tẹnu mọ́ καί.
theological_decisions:
- issue: Ìró ohùn àwọn gbólóhùn mẹ́ta àkọ́kọ́
  choice: A ṣe wọ́n bí ọ̀rọ̀ àfiwé ẹlẹ́gàn tí Pọ́ọ̀lù fi ń bá ìgbéraga àwọn ará Kọ́ríńtì wí.
  alternative: Kí a ka wọ́n sí ìyìn tàbí àlàyé lasan pé wọn ti ní ìtẹ́lọ́rùn, ọrọ̀, àti ìjọba.
  rationale: Àyíká 1 Kọ́ríńtì 4:7–13 fi ipò tí àwọn ará Kọ́ríńtì rò pé wọn wà wé ìpọ́njú àwọn aposteli; torí náà, ìtumọ̀ ẹlẹ́gàn náà ṣe pàtàkì, ṣùgbọ́n a kò tú u sí inú ẹsẹ náà lọ́nà tí yóò mú ìṣòro ọ̀rọ̀ náà kúrò.
- issue: Ìtumọ̀ èdè ìjọba
  choice: A pa àwòrán jíjọba gẹ́gẹ́ bí ọba mọ́ pẹ̀lú ‘jọba.’
  alternative: Kí a tú u sí ‘ẹ ti gba agbára’ tàbí ‘ẹ ti ga.’
  rationale: βασιλεύω àti συμβασιλεύω jẹ́ ọ̀rọ̀ ìjọba ọba ní tààrà; àwòrán yìí lè ní ìmọ̀lára ìjọba ọjọ́ iwájú, nítorí náà kò yẹ kí a sọ ọ́ di àṣeyọrí tàbí ipò gíga lásán.
- issue: Ìfẹ́ tí ὄφελόν γε ń sọ
  choice: A jẹ́ kí ó dúró láàárín ìfẹ́ gidi Pọ́ọ̀lù àti ìtẹ̀síwájú ọ̀rọ̀ ẹlẹ́gàn rẹ̀.
  alternative: Kí a ṣe e bí ọ̀rọ̀ ẹlẹ́gàn pátápátá tàbí bí ìfẹ́ gidi tí kò ní ẹ̀gàn rárá.
  rationale: Ọ̀rọ̀ náà lè tẹ̀síwájú láti inú ìbáwí ẹlẹ́gàn sí ìfẹ́ gidi pé kí ìjọba wọn jẹ́ òtítọ́, kí àwọn aposteli náà lè bá wọn jọba; a kò yẹ kí ìtumọ̀ yan ọ̀kan ṣoṣo láìjẹ́ dandan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì. Àtúnwí ‘ná’ àti ọ̀rọ̀ ‘gan-an’ ń gbé agbára àsọyé Pọ́ọ̀lù jáde; ‘jọba’ pa àwòrán ọba mọ́ ní gbogbo ẹsẹ náà.
