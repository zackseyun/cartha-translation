base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: yo
  text: Kí ni ẹ̀yin fẹ́? Ṣé kí n wá sọ́dọ̀ yín pẹ̀lú ọ̀pá, tàbí pẹ̀lú ìfẹ́ àti ẹ̀mí ìwà tútù?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “pẹ̀lú ìfẹ́ àti ìwà tútù ọkàn.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “ẹ̀mí ìwà tútù,” lè tọ́ka sí ìwà tútù Pọ́ọ̀lù; àwọn kan sì gbà pé “Ẹ̀mí” níbí ń tọ́ka láìsọ ní tààrà sí iṣẹ́ Ẹ̀mí Mímọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Kí ni ẹ̀yin fẹ́?
  rationale: Ìbéèrè tààrà yìí pa agbára ìpèníjà Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá òde òní.
- source_word: ἐν ῥάβδῳ
  choice: mú ọ̀pá wá
  rationale: Ọ̀pá ni ìtumọ̀ gangan ῥάβδος; ó pa àwòrán ìbáwí tó le mọ́ láì túmọ̀ rẹ̀ sí ‘ìbáwí’ lásán.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Ṣé kí n ... wá sọ́dọ̀ yín
  rationale: Ìkọ́lé yìí fi ìbéèrè ìgbèrò inú aorist subjunctive hàn ní Yorùbá àdánidá.
- source_word: ἢ
  choice: tàbí
  rationale: Ó pa ìyàtọ̀ tó wà láàárín ọ̀nà méjì tí Pọ́ọ̀lù lè gbà wá mọ́.
- source_word: ἐν ἀγάπῃ
  choice: pẹ̀lú ìfẹ́
  rationale: ‘Pẹ̀lú’ bá ọ̀nà tàbí ìṣesí tí yóò fi wá mu, ‘ìfẹ́’ sì jẹ́ ìtumọ̀ àdánidá fún ἀγάπη.
- source_word: πνεύματί τε πραΰτητος
  choice: àti ẹ̀mí ìwà tútù
  rationale: Ó pa ọ̀rọ̀ πνεῦμα àti ànímọ́ πραΰτης mọ́, ó sì ṣeé lóye gẹ́gẹ́ bí ìṣesí oníwà tútù.
theological_decisions:
- issue: Ìtumọ̀ πνεύματι nínú πνεύματί τε πραΰτητος
  choice: ẹ̀mí ìwà tútù, tó ń tọ́ka sí ìṣesí tàbí ìfẹ̀mí Pọ́ọ̀lù
  alternative: Ẹ̀mí ìwà tútù, gẹ́gẹ́ bí ìtọ́ka sí iṣẹ́ Ẹ̀mí Mímọ́
  rationale: 'Àyíká ọ̀rọ̀ náà ń fi ọ̀nà méjì tí Pọ́ọ̀lù lè gbà dé wé ara wọn: pẹ̀lú ọ̀pá, tàbí pẹ̀lú ìfẹ́ àti ìwà tútù. Nítorí náà, ‘ẹ̀mí’ kékeré ló bá ìṣesí rẹ̀ mu jù; síbẹ̀, àkọsílẹ̀ ìsàlẹ̀ ojú ewé pa àǹfààní ìtumọ̀ tó ní í ṣe pẹ̀lú Ẹ̀mí Mímọ́ mọ́.'
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀rọ̀ tó bọ́gbọ́n mu, tó níyì, tí àwọn òǹkàwé òde òní sì lè lóye. ‘Ṣé kí n’ jẹ́ kí ìbéèrè ìgbèrò inú náà dún bí Yorùbá àdánidá, nígbà tí ‘ọ̀pá’ pa àwòrán líle ti orísun mọ́.
