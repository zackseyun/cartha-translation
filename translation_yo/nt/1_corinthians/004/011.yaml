  revised_text: Títí di wákàtí yìí gan-an, ebi ń pa wá, òùngbẹ sì ń gbẹ wá, aṣọ wa kò sì tó, a sì ń lù wá, a kò sì ní ibi ìgbé tí ó dúró ṣinṣin.[a]
