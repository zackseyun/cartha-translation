  text: ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: yo
  text: Títí di wákàtí yìí gan-an, ebi ń pa wá, òùngbẹ sì ń gbẹ wá, aṣọ wa kò sì tó, a sì ń lù wá, a kò sì ní ibi ìgbé tí ó dúró ṣinṣin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a sì ń rìn káàkiri láìní ibi ìgbé tí ó dúró ṣinṣin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Títí di wákàtí yìí gan-an
  rationale: Ó jẹ́ gbólóhùn àkókò tó túmọ̀ sí pé ipò náà ń bá a lọ dé ìsinsìnyí; “gan-an” mú ìtẹnumọ́ ἄρτι jáde ní Yorùbá àdánidá.
- source_word: πεινῶμεν
  choice: ebi ń pa wá
  rationale: Ọ̀nà Yorùbá àdánidá láti sọ ipò ebi tó ń bá a lọ ni èyí, ó sì bá present indicative mu.
- source_word: διψῶμεν
  choice: òùngbẹ sì ń gbẹ wá
  rationale: Ó sọ ipò òùngbẹ tó ń bá a lọ ní èdè Yorùbá tó ṣe kedere, ó sì pa ìtẹ̀lé àwọn ìnira mọ́.
- source_word: γυμνιτεύομεν
  choice: aṣọ wa kò sì tó
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àìní aṣọ tó péye, kì í ṣe ìhòòhò pátápátá; yíyan yìí kò mú ìtumọ̀ náà le ju bó ṣe yẹ lọ.
- source_word: κολαφιζόμεθα
  choice: a sì ń lù wá
  rationale: Fọ́ọ̀mù passive present náà fi ìlù tàbí ìpalára ara tó ń ṣẹlẹ̀ léraléra hàn; gbólóhùn yìí ṣe kedere ní Yorùbá òde òní.
- source_word: ἀστατοῦμεν
  choice: a kò sì ní ibùgbé kan pàtó
  rationale: Ó pa èrò àìní ibi ìgbé tó dúró ṣinṣin mọ́ láì fi dandan túmọ̀ ọ́ sí àìnílé pátápátá nìkan.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: sì ... sì ... sì ...
  rationale: Àtúnsọ àsopọ̀ náà pa ìṣàkójọ ìnira tó ń tẹ̀ síwájú àti agbára àsọyé Gíríìkì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú àpèjúwe tí Pọ́ọ̀lù ṣe nípa àwọn aposteli
  choice: Àkójọ gidi ti àìní àti ìfìyàjẹ àwọn aposteli tó ń bá a lọ
  alternative: Àpèjúwe àsọdùn tàbí ọ̀rọ̀ àsọyé ní pàtàkì
  rationale: Àwọn ọ̀rọ̀-ìṣe present indicative fi àwọn ìnira gidi tó ń bá a lọ hàn. Ìtumọ̀ náà kò dín ìjìyà kù, bẹ́ẹ̀ ni kò mú un le ju ẹ̀rí ọ̀rọ̀ Gíríìkì lọ.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àwọn ọ̀nà àdánidá bí “ebi ń pa wá” àti “òùngbẹ ń gbẹ wá,” a sì pa ìtẹ̀lé καί mọ́ nípasẹ̀ “sì.”
