review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú àkójọ àwọn ìnira tó ń ṣẹlẹ̀ lọ́wọ́lọ́wọ́ nínú Gíríìkì wá dáadáa: ebi, òùngbẹ, àìtó aṣọ, ìlù, àti àìní ibi ìgbé tó dúró ṣinṣin. Ṣùgbọ́n “ibùgbé kan pàtó” lè túmọ̀ sí ibi ìgbé kan tí a sọ ní pàtó, kì í ṣe dandan ibi ìgbé tí kò dúró ṣinṣin, èyí tí ἀστατοῦμεν ń tẹnu mọ́.'
  naturalness: “Ebi ń pa wá” àti “òùngbẹ ń gbẹ wá” jẹ́ Yorùbá àdánidá. “Aṣọ wa kò tó” sì ṣe kedere. Àtúnṣe kékeré sí “ibi ìgbé tí ó dúró ṣinṣin” mú ìtumọ̀ apá ìkẹyìn wá sí ìmọ́lẹ̀ ní Yorùbá boṣewa.
  terminology: Kò sí ìṣòro pẹ̀lú ọ̀rọ̀ orúkọ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn nínú ẹsẹ yìí. A pa ìtumọ̀ γυμνιτεύομεν mọ́ gẹ́gẹ́ bí àìtó aṣọ, kì í ṣe ìhòòhò pátápátá; a sì fi κολαφιζόμεθα hàn gẹ́gẹ́ bí ìlù tí a ń lù wọ́n.
  issues:
