  rationale: A tún apá tó túmọ̀ ἀστατοῦμεν ṣe nìkan, kí ó lè sọ àìní ibi ìgbé tó dúró ṣinṣin ní kedere, láì fi dandan sọ pé wọn jẹ́ aláìnílé pátápátá. A pa ìṣètò ìṣàkójọ àti ìtẹnumọ́ ìṣe tó ń bá a lọ nínú ẹsẹ náà mọ́.
