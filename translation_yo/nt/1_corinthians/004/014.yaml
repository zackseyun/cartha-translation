  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: yo
  text: Èmi kò kọ àwọn nǹkan wọ̀nyí láti mú ojú tì yín[a], ṣùgbọ́n mo ń kìlọ̀ fún yín[b] gẹ́gẹ́ bí àwọn ọmọ mi tí mo fẹ́ràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti dójú tì yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo ń tọ́ yín sọ́nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: láti dójú tì yín
  rationale: Ọ̀rọ̀ yìí fi ìtìjú hàn, kì í ṣe ìtìjú kékeré bí ìkọ́jú tàbí ìdójútì lásán. Pẹ̀lú οὐκ, ó ṣàlàyé pé kì í ṣe ète Pọ́ọ̀lù láti mú kí ojú tì wọ́n.
- source_word: γράφω ταῦτα
  choice: mo kọ àwọn nǹkan wọ̀nyí
  rationale: A pa ọ̀pọ̀ iye ταῦτα mọ́ nípasẹ̀ ‘àwọn nǹkan wọ̀nyí.’ Fífi ‘kọ’ sílẹ̀ láìfi àmì àkókò míì kún un jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí òǹkọ̀wé ń ṣe nínú lẹ́tà náà.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó ṣe kedere hàn láàárín ohun tí Pọ́ọ̀lù kò fẹ́ ṣe àti ohun tí ó ń ṣe.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ipò ìbátan tí Pọ́ọ̀lù fi ń bá wọn wí hàn láìsọ pé wọ́n kàn dà bí ọmọ rẹ̀ lásán.
- source_word: τέκνα μου ἀγαπητὰ
  choice: àwọn ọmọ mi tí mo fẹ́ràn
  rationale: ‘Àwọn ọmọ’ kò ṣe ààyò fún akọ tàbí abo, ‘tí mo fẹ́ràn’ sì pa ìfẹ́ àti ìmọ̀lára ìbátan ἀγαπητά mọ́ ní èdè Yorùbá àdánidá.
- source_word: νουθετῶν
  choice: mo ń tọ́ yín sọ́nà
  rationale: Àṣàyàn yìí kó ìkọ́ni, àtúnṣe, àti ìkìlọ̀ onífẹ̀ẹ́ sínú ọ̀rọ̀ kan. Ó tún pa ìṣe tí ń lọ lọ́wọ́ nínú participle Gíríìkì mọ́.
theological_decisions:
- issue: Ohùn ìtọ́ni Pọ́ọ̀lù gẹ́gẹ́ bí baba nípa ẹ̀mí
  choice: mo ń tọ́ yín sọ́nà gẹ́gẹ́ bí àwọn ọmọ mi tí mo fẹ́ràn
  alternative: mo ń kìlọ̀ fún yín gẹ́gẹ́ bí àwọn ọmọ mi tí mo fẹ́ràn
  rationale: Gbólóhùn náà gbọ́dọ̀ pa agbára àtúnṣe νουθετῶν mọ́, ṣùgbọ́n kí ó tún fi hàn pé ìfẹ́ àti ìbátan ọmọ ni ó yí àtúnṣe náà ká, kì í ṣe ìdálẹ́bi líle.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó lọ́lá, tó sì ṣeé lóye. ‘Dójú tì’ jẹ́ ọ̀rọ̀ àdánidá fún ìmúni ní ìtìjú, ‘tọ́ yín sọ́nà’ sì bá ìbáwí onífẹ̀ẹ́ mu ju ọ̀rọ̀ àjèjì tàbí ti ẹ̀sìn kan pàtó lọ.
