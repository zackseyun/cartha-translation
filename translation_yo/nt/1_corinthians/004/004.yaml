id: 1CO.4.4
reference: 1 Corinthians 4:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: yo
  text: Nítorí èmi kò mọ ohun kankan tí ó lòdì sí mi[a], ṣùgbọ́n èyí kò dá mi láre[b]; Olúwa ni ẹni tí ń yẹ̀ mí wò[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rí-ọkàn mi kò dá mi lẹ́bi nípa ohunkóhun,” tàbí, “èmi kò mọ ohunkóhun nínú ara mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a kò dá mi láre nípasẹ̀ èyí,” tàbí, “èyí kò fi hàn pé a dá mi láre.” Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ onídàájọ́ tí Pọ́ọ̀lù tún máa ń lò fún ‘dídá láre.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹni tí ń ṣe ìdájọ́ mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ṣíṣàyẹ̀wò, ṣíṣèwádìí, tàbí ṣíṣe ìgbéyẹ̀wò ní ipò ìdájọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν ... ἐμαυτῷ σύνοιδα
  choice: èmi kò mọ ohun kankan tí ó lòdì sí mi
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ àkànlò èdè Gíríìkì náà jáde pé Pọ́ọ̀lù kò mọ ẹ̀sùn kankan lórí ara rẹ̀, nígbà tó sì tún jẹ́ Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ọ̀rọ̀ tó ṣáájú.
- source_word: οὐκ ἐν τούτῳ δεδικαίωμαι
  choice: kì í ṣe nítorí èyí ni a fi dá mi láre
  rationale: Ó pa àwọ̀ ìdájọ́ inú δεδικαίωμαι mọ́, ó sì fi hàn pé àìmọ ẹ̀sùn lórí ara rẹ̀ kì í ṣe ìpìlẹ̀ ìdájọ́ rere náà.
- source_word: ὁ ... ἀνακρίνων με
  choice: ẹni tí ń yẹ̀ mí wò
  rationale: ‘Yẹ̀ ... wò’ lè sọ ìṣàyẹ̀wò àti ìgbéyẹ̀wò onídàájọ́ láì sọ ọ́ di ìdájọ́ ìkẹyìn.
- source_word: κύριός
  choice: Olúwa
  rationale: Ó túmọ̀ κύριος ní tààrà, láì fi ‘Jésù’ kún ohun tí ẹsẹ yìí kò sọ ní gbangba.
theological_decisions:
- issue: Ìtumọ̀ onídàájọ́ ti δεδικαίωμαι nínú ọ̀rọ̀ nípa bí Pọ́ọ̀lù ṣe ń wo ara rẹ̀
  choice: a fi dá mi láre
  alternative: a dá mi láre; a dá mi láre pé mo jẹ́ aláìlẹ́bi
  rationale: Àṣàyàn yìí pa ìtumọ̀ ìdájọ́ òfin mọ́, ṣùgbọ́n kò sọ ẹsẹ náà di àlàyé ẹ̀kọ́ ìdáláre tó gbòòrò ju àyíká rẹ̀ lọ.
- issue: Ta ni κύριος ń tọ́ka sí?
  choice: Olúwa
  alternative: Olúwa Jésù
  rationale: Gíríìkì ní κύριος nìkan; a kò fi ìdánimọ̀ tó ṣeé ṣe nínú àyíká kún ọ̀rọ̀ pàtó tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí òǹkàwé gbogbogbòò lè lóye. A lo ‘dá ... láre’ láti pa ọ̀rọ̀ pàtàkì onídàájọ́ mọ́, a sì lo ‘yẹ̀ ... wò’ fún ìṣàyẹ̀wò láì mú un le ju Gíríìkì lọ.
