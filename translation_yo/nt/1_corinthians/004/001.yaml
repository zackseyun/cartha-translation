id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: yo
  text: 'Báyìí ni kí ènìyàn máa ka wa sí: gẹ́gẹ́ bí àwọn ìránṣẹ́ Mèsáyà[a] àti àwọn ìríjú àwọn ohun ìjìnlẹ̀ Ọlọ́run.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè; ó túmọ̀ sí ẹni tí a fi òróró yàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: Báyìí ni
  rationale: Ó fi ọ̀nà tí ó yẹ kí a gbà wo Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ hàn ní èdè Yorùbá àdánidá.
- source_word: ἡμᾶς
  choice: wá
  rationale: Arọ́pò-orúkọ olùgbà tí ó tọ́ka sí Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀.
- source_word: λογιζέσθω
  choice: kí ... máa ka ... sí
  rationale: Ìtumọ̀ Yorùbá àdánidá fún àṣẹ pé kí ènìyàn máa gbà tàbí wo wọn ní ipò kan; ó pa agbára àṣẹ ìsinsìnyí mọ́.
- source_word: ἄνθρωπος
  choice: ẹnì kan
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ẹyọ ṣùgbọ́n ó ní agbára gbogbogbò; “ẹnì kan” jẹ́ àdánidá, kò sì fi akọ tàbí abo tí àyíká kò béèrè kún un.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó samisi ipò tàbí agbára tí a ó fi ka wọn sí.
- source_word: ὑπηρέτας
  choice: ìránṣẹ́
  rationale: Ó sọ iṣẹ́ abẹ́ àṣẹ Mèsáyà, láìfi ipò ẹrú tí δοῦλος lè túmọ̀ sí kún un.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró Ọlọ́run níhìn-ín; “Mèsáyà” pa iṣẹ́ oyè náà mọ́.
- source_word: οἰκονόμους
  choice: àwọn ìríjú
  rationale: “Ìríjú” ni ẹni tí a fi ohun sí lọ́wọ́ láti ṣàkóso tàbí tọ́jú rẹ̀, ó sì bá àwòrán ojúṣe tí a gbé lé wọn lọ́wọ́ mu.
- source_word: μυστηρίων
  choice: ohun ìjìnlẹ̀
  rationale: Ó pa èrò ohun Ọlọ́run tí ó farapamọ́ tí Ọlọ́run sì ń sọ di mímọ̀ mọ́, láìṣàlàyé ju ọ̀rọ̀ orísun lọ.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Àpólà “ohun ìjìnlẹ̀ Ọlọ́run” lè fi hàn pé àwọn ohun náà jẹ́ ti Ọlọ́run tàbí pé láti ọ̀dọ̀ rẹ̀ ni wọ́n ti wá, bí genitive Gíríìkì ṣe gbà.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ṣì lè ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró Ọlọ́run; “Mèsáyà” mú ìtumọ̀ oyè náà jáde. Àṣàyàn “Kristi” wà nínú àlàyé ìsàlẹ̀ láti jẹ́wọ́ ìtumọ̀ ìbílẹ̀ mìíràn.
- issue: Agbára gbogbogbò ἄνθρωπος
  choice: ẹnì kan
  alternative: ọkùnrin kan
  rationale: Nínú gbolohun yìí ἄνθρωπος kò tọ́ka sí akọ ní pàtó, bí kò ṣe ẹnikẹ́ni. Yorùbá “ẹnì kan” pa ẹyọ àti agbára gbogbogbò náà mọ́ láìdá ìtumọ̀ akọ tí kò ṣe pàtàkì sílẹ̀.
- issue: Genitive μυστηρίων θεοῦ
  choice: ohun ìjìnlẹ̀ Ọlọ́run
  alternative: ohun ìjìnlẹ̀ láti ọ̀dọ̀ Ọlọ́run
  rationale: Ìsopọ̀ Yorùbá náà pa àìdánilójú tó wà láàárín ohun tí ó jẹ́ ti Ọlọ́run àti ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá mọ́, dípò kí a yan ọ̀kan nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. “Kí ẹnì kan máa ka wá sí” jẹ́ ọ̀nà àdánidá láti sọ ìṣírò tàbí ìwòye tí λογιζέσθω ń béèrè; “ìránṣẹ́” àti “ìríjú” sì yà iṣẹ́ abẹ́ àṣẹ sí ọ̀tọ̀ kúrò nínú ojúṣe ohun tí a fi síni lọ́wọ́.
