id: 1CO.4.13
reference: 1 Corinthians 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: yo
  text: Nígbà tí wọ́n bá ń ba orúkọ wa jẹ́[a], à ń bẹ̀bẹ̀; a ti dàbí ìdọ̀tí ayé, ìṣẹ́kù ohun gbogbo[b], títí di ìsinsin yìí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Nígbà tí wọ́n bá ń sọ̀rọ̀ ẹ̀gàn sí wa.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “a ń bẹ̀bẹ̀,” “a ń rọ̀ wọ́n,” tàbí “a ń gba wọ́n níyànjú”; níbí, ó ṣeé ṣe kó ń ṣàpèjúwe ìdáhùn tí kì í ṣe ìgbẹ̀san.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ọ̀rọ̀ méjì tí a túmọ̀ sí “ìdọ̀tí” àti “ìṣẹ́kù” kò wọ́pọ̀, wọ́n sì lágbára gan-an. Wọ́n lè tọ́ka sí ohun tí a gbá, nu, tàbí yọ kúrò nígbà ìwẹ̀nùmọ́; èyí ń tẹnumọ́ bí ayé ṣe kẹ́gàn àwọn àpọ́sítélì.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Nígbà tí wọ́n bá ń ba orúkọ wa jẹ́
  rationale: Ọ̀rọ̀ náà jẹ́ participle passive tó ń tọ́ka sí sísọ̀rọ̀ búburú tàbí èké sí ẹnì kan láti ba orúkọ rẹ̀ jẹ́. Gbólóhùn àsìkò yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: παρακαλοῦμεν
  choice: à ń bẹ̀bẹ̀
  rationale: Nínú ìyàtọ̀ tó wà ní àyíká ẹsẹ yìí, ọ̀rọ̀ náà túmọ̀ sí ẹ̀bẹ̀ tàbí ọ̀rọ̀ ìpẹ̀tù, kì í ṣe ìgbẹ̀san. A kò fi ‘pẹ̀lẹ́’ kún un nínú ẹsẹ, nítorí kò sí ọ̀rọ̀ adverb bẹ́ẹ̀ ní Gíríìkì.
- source_word: ὡς
  choice: bí
  rationale: Ó ṣàfihàn àfiwé, kì í ṣe ìdánimọ̀ pípé.
- source_word: περικαθάρματα
  choice: ìdọ̀tí
  rationale: Ọ̀rọ̀ tó lágbára yìí ń tọ́ka sí ohun tí a yọ kúrò nígbà ìwẹ̀nùmọ́, ohun tí a kà sí ẹ̀gbin tàbí ohun asán. ‘Ìdọ̀tí’ ṣe kedere fún òǹkàwé òde òní, ó sì pa ẹ̀gàn inú ọ̀rọ̀ náà mọ́.
- source_word: τοῦ κόσμου
  choice: ayé
  rationale: Àkójọpọ̀ ‘ìdọ̀tí ayé’ fi ìbáṣepọ̀ genitive náà hàn ní Yorùbá àdánidá.
- source_word: ἐγενήθημεν
  choice: a ti dà
  rationale: Fọ́ọ̀mù yìí sọ ìyípadà sí ipò kan tí ó ń bá a lọ títí dé àsìkò tí Pọ́ọ̀lù ń kọ̀wé.
- source_word: πάντων
  choice: ohun gbogbo
  rationale: Ó pa ìtànkálẹ̀ gbòòrò ọ̀rọ̀ Gíríìkì mọ́ láì dín in kù sí ‘gbogbo ènìyàn’ nìkan.
- source_word: περίψημα
  choice: ìṣẹ́kù
  rationale: Ọ̀rọ̀ tí kò wọ́pọ̀ yìí ń tọ́ka sí ohun tí a nu tàbí gé kúrò tí a sì kà sí aláìníyelórí. ‘Ìṣẹ́kù’ bá ‘ìdọ̀tí’ ṣe àjọṣe, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó lóye.
- source_word: ἕως ἄρτι
  choice: títí di ìsinsin yìí
  rationale: Ó sọ pé ipò náà ń bá a lọ dé àsìkò tí a ń sọ̀rọ̀.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ àwọn ọ̀rọ̀ ìrẹ̀sílẹ̀ méjèèjì, περικαθάρματα àti περίψημα
  choice: Lo ọ̀rọ̀ ẹ̀gàn tó lágbára, ‘ìdọ̀tí’ àti ‘ìṣẹ́kù,’ láì fi èrò pé wọ́n jẹ́ ẹbọ ètùtù sínú ẹsẹ náà.
  alternative: Túmọ̀ wọn gẹ́gẹ́ bí ‘ẹ̀gbin’ àti ‘ohun tí a nù kúrò,’ tàbí sọ pé wọ́n ń tọ́ka sí ẹni tí a fi rú ẹbọ ìwẹ̀nùmọ́.
  rationale: Kókó ọ̀rọ̀ níbí ni bí ayé ṣe ń kẹ́gàn àwọn aposteli, tí ó sì ń kà wọ́n sí aláìníyelórí. Bí àwọn ọ̀rọ̀ náà tilẹ̀ lè ní ìbáṣepọ̀ pẹ̀lú ohun tí a yọ kúrò ní ìwẹ̀nùmọ́, ẹsẹ náà kò sọ ẹ̀kọ́ pàtó nípa ètùtù.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Gbólóhùn náà pa àfiwé àti ọ̀rọ̀ ẹ̀gàn tó lágbára inú Gíríìkì mọ́, láì fi ìtumọ̀ ẹ̀kọ́ ìsìn tí kò dájú kún un.
