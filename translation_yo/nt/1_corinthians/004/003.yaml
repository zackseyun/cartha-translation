id: 1CO.4.3
reference: 1 Corinthians 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: yo
  text: Ṣùgbọ́n fún mi, ohun kékeré gan-an ni pé kí ẹ̀yin tàbí ilé-ẹjọ́ ènìyàn[a] yẹ̀ mí wò; kódà, èmi fúnra mi kò tilẹ̀ yẹ ara mi wò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì ní ọ̀rọ̀ gangan, ‘nípasẹ̀ ọjọ́ ènìyàn’; àkànlò-èdè ni fún ìdájọ́ tàbí àyẹ̀wò ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ
  choice: Ṣùgbọ́n ní tèmi
  rationale: Ó fi ìyàtọ̀ àti ojú-ìwòye Pọ́ọ̀lù hàn ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: ohun kékeré ni
  rationale: Ó sọ pé ọ̀ràn náà kò ṣe pàtàkì púpọ̀, láìfi agbára ọ̀rọ̀ Gíríìkì kún un ju bó ṣe yẹ lọ.
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: pé kí ẹ̀yin ... yẹ̀ mí wò
  rationale: ‘Yẹ̀ ... wò’ túmọ̀ sí ṣíṣàyẹ̀wò pẹ̀lú ìfọ̀rọ̀wánilẹ́nuwò, kì í sì í dandan túmọ̀ sí ìdájọ́ ìkẹyìn.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: tàbí ilé ẹjọ́ ènìyàn kan
  rationale: Gbólóhùn Gíríìkì ní ti gidi ni ‘ọjọ́ ènìyàn,’ ṣùgbọ́n ó jẹ́ àkànlò-èdè fún àyẹ̀wò tàbí ìdájọ́ láti ọ̀dọ̀ ènìyàn; ‘ilé ẹjọ́ ènìyàn’ mú ìtumọ̀ náà ṣe kedere.
- source_word: ἀλλ’ οὐδὲ
  choice: àní, ... kò tilẹ̀
  rationale: Ó pa ìlọsíwájú alátakò àti ìtẹnumọ́ ‘kódà kì í ṣe’ mọ́ ní Yorùbá àdánidá.
- source_word: ἐμαυτὸν ἀνακρίνω
  choice: èmi fúnra mi kò tilẹ̀ yẹ ara mi wò
  rationale: Ó pa ọ̀rọ̀ kan náà ‘yẹ̀ ... wò’ mọ́ fún ἀνακρίνω méjèèjì, ó sì fi arọ́pò-orúkọ afarahẹ hàn kedere.
theological_decisions:
- issue: Ìtumọ̀ ἀνθρωπίνης ἡμέρας
  choice: ilé ẹjọ́ ènìyàn kan
  alternative: ọjọ́ ènìyàn; ìdájọ́ ènìyàn
  rationale: Àyíká ọ̀rọ̀ fi àyẹ̀wò ènìyàn wé ti Olúwa. Ìtumọ̀ àkànlò-èdè yìí jẹ́ kó yé òǹkàwé òde òní, láìsọ ọ́ di ẹ̀kọ́ nípa ọjọ́ kàlẹ́ńdà.
- issue: Bóyá ἀνακρίνω túmọ̀ sí àyẹ̀wò tàbí ìdájọ́ ìkẹyìn
  choice: yẹ̀ ... wò
  alternative: dá ... lẹ́jọ́
  rationale: Ọ̀rọ̀ náà lè ní agbára ti ìwádìí tàbí àyẹ̀wò pẹkipẹki; ‘yẹ̀ ... wò’ pa ìyàtọ̀ rẹ̀ mọ́ sí κρίνω nínú àyíká ọ̀rọ̀, kò sì pinnu ìtumọ̀ rẹ̀ ju ẹ̀rí lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá bá ìlò àdánidá mu. Èdè náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; a lo ‘ilé ẹjọ́ ènìyàn’ gẹ́gẹ́ bí ìtumọ̀ àkànlò-èdè, láìsí àlàyé ẹsẹ̀ nítorí kò sí àmì àlàyé nínú ọ̀rọ̀ àkọ́kọ́.
