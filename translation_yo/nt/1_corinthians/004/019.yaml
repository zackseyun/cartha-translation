id: 1CO.4.19
reference: 1 Corinthians 4:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: yo
  text: Ṣùgbọ́n màá wá sọ́dọ̀ yín láìpẹ́, bí Olúwa bá fẹ́, màá sì mọ̀, kì í ṣe ọ̀rọ̀ àwọn tí wọ́n fọ́nnu[a], bí kò ṣe agbára wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn tí wọ́n fọ́nnu” túmọ̀ ọ̀rọ̀ àwòrán kan tí Pọ́ọ̀lù lò léraléra nínú lẹ́tà yìí fún àwọn tí ìgbéraga tàbí ìrera mú kí wọ́n gbé ara wọn ga.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Ṣùgbọ́n èmi yóò tọ̀ yín wá láìpẹ́
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ pẹ̀lẹ́ tí δέ ní hàn; “tọ̀ yín wá” jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣípò lọ sọ́dọ̀ àwọn olùgbọ́, “láìpẹ́” sì túmọ̀ ταχέως gẹ́gẹ́ bí àkókò tó sún mọ́lé.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: bí Olúwa bá fẹ́
  rationale: Ó pa ipò àídájú àti gbígbẹ́kẹ̀lé ìfẹ́ Olúwa mọ́, láì sọ ẹni tí “Olúwa” ń tọ́ka sí ní pàtó ju Gíríìkì lọ.
- source_word: γνώσομαι
  choice: èmi yóò sì mọ̀
  rationale: “Yóò mọ̀” tẹ̀lé ìtumọ̀ pàtàkì ti γνώσομαι, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù yóò fi ìbẹ̀wò rẹ̀ ṣàyẹ̀wò òtítọ́ ọ̀ràn náà.
- source_word: οὐ τὸν λόγον
  choice: kì í ṣe ọ̀rọ̀
  rationale: “Ọ̀rọ̀” pa ìfọ̀rọ̀wérọ̀ λόγος mọ́, ó sì lè túmọ̀ sí ohun tí wọ́n ń sọ tàbí ọ̀nà tí wọ́n ń gbà sọ ọ́, láì dín ìtumọ̀ rẹ̀ kù sí àsọyé lásán.
- source_word: τῶν πεφυσιωμένων
  choice: àwọn tí wọ́n ti wú fùù nítorí ìgbéraga
  rationale: Ó pa àwòrán ohun tí afẹ́fẹ́ mú kí ó wú nínú φυσιόω mọ́, ó sì mú ìtumọ̀ ìgbéraga yé òǹkàwé Yorùbá. “Ti wú” tún fi ipò tí ó ti bẹ̀rẹ̀ tí ó sì ń bá a lọ hàn.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: bí kò ṣe agbára wọn
  rationale: “Bí kò ṣe” fi ìyàtọ̀ οὐ … ἀλλά hàn. “Agbára” pa δύναμις mọ́ láì sọ bóyá agbára iṣẹ́ ìyanu, àṣẹ aposteli, tàbí ìmúṣẹ ọ̀rọ̀ ni.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù; Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì ní ὁ κύριος nìkan. Títúmọ̀ rẹ̀ sí “Olúwa” pa àìsọ pàtó inú ẹsẹ náà mọ́, láì fi ìdánimọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- issue: Ìyàtọ̀ láàárín λόγος àti δύναμις
  choice: ọ̀rọ̀ … agbára
  alternative: àsọyé … agbára iṣẹ́ ìyanu; ọgbọ́n àsọyé … àṣẹ aposteli
  rationale: Ìtumọ̀ yìí pa ìyàtọ̀ gbooro láàárín ohun tí a ń sọ àti agbára tó wà níbẹ̀ mọ́; kò fi dandan mú “agbára” túmọ̀ sí irú ìfarahàn kan ṣoṣo.
- issue: Ẹni tí “agbára” jẹ́ tirẹ̀
  choice: agbára wọn
  alternative: agbára
  rationale: Àfikún arọ́pò-orúkọ “wọn” jẹ́ kí ìlànà Yorùbá ṣe kedere pé Pọ́ọ̀lù ń wádìí agbára àwọn ènìyàn náà, ṣùgbọ́n kò ṣàlàyé irú agbára náà.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “wú fùù” láti pa àwòrán Gíríìkì mọ́, a sì fi “nítorí ìgbéraga” ṣàlàyé rẹ̀. Àmì ìtọ́kasí [a] wà lẹ́sẹ̀kẹsẹ̀ lẹ́yìn gbólóhùn tí àlàyé rẹ̀ ń tọ́ka sí.
