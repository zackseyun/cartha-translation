  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí Ọlọ́run gẹ́gẹ́ bí ẹni tó jí Olúwa dìde, àti sí jíjí àwọn onígbàgbọ́ dìde ní ọjọ́ iwájú nípasẹ̀ agbára rẹ̀. Síbẹ̀, ìlò “àwa” gẹ́gẹ́ bí ohun tí iṣẹ́-ìṣe ń ṣẹlẹ̀ sí kò tọ́ ní gírámà Yorùbá nínú gbólóhùn yìí; “wa” ni a nílò.
  naturalness: Apá àkọ́kọ́ jẹ́ adayébá. Ṣùgbọ́n “yóò sì jí àwa pẹ̀lú dìde” kò rọrùn, kò sì jẹ́ ìlànà Yorùbá boṣewa. “Yóò sì tún fi agbára rẹ̀ jí wa dìde” jẹ́ adayébá, ó sì fi ìbáṣepọ̀ “also” àti ọ̀nà agbára hàn kedere.
  terminology: “Ọlọ́run,” “Olúwa,” “jí ... dìde,” àti “agbára rẹ̀” jẹ́ àwọn ọ̀rọ̀ tó bójú mu fún θεός, κύριος, ἐγείρω/ἐξεγείρω, àti δύναμις. “Tún” ń mú καί jáde láìsọ ìtumọ̀ ìsìn míì kún un.
