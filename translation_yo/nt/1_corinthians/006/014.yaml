    rationale: “Àwa” jẹ́ fọ́ọ̀mù akọ́lé/ìtẹnumọ́; ní ipò ohun ìṣe nínú gbolohun yìí, fọ́ọ̀mù tó yẹ ni “wa.” Ìyípadà náà ṣe pàtàkì fún gírámà àti ìròrùn èdè.
