source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: yo
  text: Ọlọ́run sì jí Olúwa dìde, yóò sì tún fi agbára rẹ̀ jí wa dìde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: sì
  rationale: Ẹ̀ka ọ̀rọ̀ yìí jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń tẹ̀ síwájú nínú àríyànjiyàn Pọ́ọ̀lù; “sì” jẹ́ àdánidá ní Yorùbá, kò sì sọ ọ́ di ìtakò líle.
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀ fún θεός, ẹni tí ó sì ṣe iṣẹ́ jíjí dìde nínú ẹsẹ yìí.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Nínú àyíká yìí, κύριος ń tọ́ka sí Jésù gẹ́gẹ́ bí orúkọ oyè Kristi; “Olúwa” ni ìtumọ̀ Yorùbá tó yẹ.
- source_word: ἤγειρεν
  choice: jí ... dìde
  rationale: Aorist ἐγείρω tọ́ka sí iṣẹ́ Ọlọ́run nígbà tí ó jí Jésù dìde kúrò nínú òkú; gbólóhùn Yorùbá yìí ṣe kedere, ó sì jẹ́ àdánidá.
- source_word: ἡμᾶς
  choice: àwa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni àkọ́kọ́ ọ̀pọ̀ yìí jẹ́ olùgbà iṣẹ́, ó sì ń tọ́ka sí àwọn onígbàgbọ́ pẹ̀lú Pọ́ọ̀lù.
- source_word: ἐξεγερεῖ
  choice: yóò ... jí àwa pẹ̀lú dìde
  rationale: Ọ̀rọ̀ ọjọ́ iwájú yìí dúró ní ìrẹ́pọ̀ pẹ̀lú jíjí Olúwa dìde; “pẹ̀lú” mú καί kejì jáde, láìfi ìyàtọ̀ tí kò ṣe kedere kún ìtumọ̀ ọ̀rọ̀-ìṣe náà.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: nípa agbára rẹ̀
  rationale: διά pẹ̀lú genitive ń fi ọ̀nà tàbí ohun èlò iṣẹ́ hàn; “nípa agbára rẹ̀” sọ pé agbára Ọlọ́run ni ọ̀nà tí yóò fi jí wa dìde.
theological_decisions:
- issue: Ohun tí gbólóhùn ọjọ́ iwájú ń tọ́ka sí
  choice: jíjí àwọn onígbàgbọ́ dìde ní ọjọ́ iwájú
  alternative: ìdáláre Ọlọ́run lápapọ̀ tàbí jíjí nípa ẹ̀mí gẹ́gẹ́ bí àkàwé
  rationale: Àyíká 1 Kọ́ríńtì 6:13–20 ń sọ̀rọ̀ nípa ara, ìrẹ́pọ̀ pẹ̀lú “Ọlọ́run ... jí Olúwa dìde” sì ń tọ́ka gidigidi sí jíjí ara àwọn onígbàgbọ́ dìde ní ọjọ́ iwájú. Ìtumọ̀ náà kò fi àlàyé ẹ̀kọ́ ìsìn tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti jẹ́ àdánidá; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì bójú mu fún òǹkàwé òde òní. A tún “jí ... dìde” ṣe lẹ́ẹ̀mejì láti pa ìrẹ́pọ̀ àwọn ọ̀rọ̀-ìṣe Gíríìkì mọ́.
