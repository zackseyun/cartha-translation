    rationale: Lílo “tún fi agbára rẹ̀ jí wa dìde” ń jẹ́ kí ìtumọ̀ καί àti διὰ τῆς δυνάμεως αὐτοῦ hàn ní èdè Yorùbá tó rọrùn, láìyí ìtumọ̀ Gíríìkì padà.
