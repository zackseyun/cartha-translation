  text: οὐκ οἴδατε ὅτι ἀγγέλους κρινοῦμεν, μήτιγε βιωτικά;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: yo
  text: Ṣé ẹ̀yin kò mọ̀ pé àwa yóò dá àwọn áńgẹ́lì lẹ́jọ́, ká má tilẹ̀ sọ nípa àwọn ọ̀ràn ti ìgbésí ayé yìí?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò tilẹ̀ ṣẹ̀ṣẹ̀ jẹ́ àwọn ọ̀ràn ti ìgbésí ayé yìí”; tàbí, “ní pàtàkì jù lọ, àwọn ọ̀ràn ti ìgbésí ayé yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Ṣé ẹ̀yin kò mọ̀
  rationale: Ó pa ìbéèrè àsọyé tí Pọ́ọ̀lù sábà máa ń lò mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἀγγέλους
  choice: àwọn áńgẹ́lì
  rationale: Nínú àyíká ọ̀rọ̀ ìdájọ́ ọjọ́ iwájú yìí, àwọn ẹ̀dá ọ̀run ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: κρινοῦμεν
  choice: àwa yóò dá ... lẹ́jọ́
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni; ‘dá lẹ́jọ́’ pa ìtumọ̀ ìdájọ́ mọ́ láìfi irú ìdájọ́ náà hàn ju ohun tí Gíríìkì sọ lọ.
- source_word: μήτιγε
  choice: Mélòó mélòó
  rationale: 'Ó fi àríyànjiyàn láti ohun tí ó tóbi sí ohun tí ó kéré hàn ní Yorùbá àdánidá: bí wọ́n yóò bá dá àwọn áńgẹ́lì lẹ́jọ́, ó yẹ kí wọ́n lè bójú tó ọ̀ràn ayé yìí jù bẹ́ẹ̀ lọ.'
- source_word: βιωτικά
  choice: àwọn ọ̀ràn ti ìgbésí ayé yìí
  rationale: Ó túmọ̀ sí àwọn ọ̀ràn tó jẹ mọ́ ìgbésí ayé ayé ojoojúmọ́, ó sì fẹ̀ tó láti gba àwọn àríyànjiyàn òfin inú àyíká ẹsẹ náà.
theological_decisions:
- issue: Irú bí àwọn onígbàgbọ́ yóò ṣe ‘dá àwọn áńgẹ́lì lẹ́jọ́’
  choice: Pa ọ̀rọ̀ tààrà náà mọ́ pé ‘àwa yóò dá àwọn áńgẹ́lì lẹ́jọ́.’
  alternative: ‘Àwa yóò ṣàkóso àwọn áńgẹ́lì’ tàbí ‘àwa yóò dá àwọn áńgẹ́lì tí ó ṣubú lẹ́jọ́.’
  rationale: Ẹsẹ náà kò ṣàlàyé bí ìdájọ́ náà yóò ṣe rí, bí ó ṣe gbòòrò tó, tàbí irú àwọn áńgẹ́lì tí ó ní lọ́kàn; ìtumọ̀ náà kò gbọdọ̀ fi ẹ̀kọ́ ìsìn kan kun ohun tí ọ̀rọ̀ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bójú mu. Ìforúkọ ‘ẹ̀yin’ àti ‘àwa’ mú ẹni-púpọ̀ inú Gíríìkì hàn; ìṣètò náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba.
