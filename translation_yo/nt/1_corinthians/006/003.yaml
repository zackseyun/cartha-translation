revisions:
- from: Ṣé ẹ̀yin kò mọ̀ pé àwa yóò dá àwọn áńgẹ́lì lẹ́jọ́? Mélòó mélòó[a] ni àwọn ọ̀ràn ti ìgbésí ayé yìí!
  to: Ṣé ẹ̀yin kò mọ̀ pé àwa yóò dá àwọn áńgẹ́lì lẹ́jọ́, ká má tilẹ̀ sọ nípa àwọn ọ̀ràn ti ìgbésí ayé yìí?[a]
  rationale: A rọ́pò “Mélòó mélòó” pẹ̀lú “ká má tilẹ̀ sọ nípa,” èyí tí ó jẹ́ ìtumọ̀ Yorùbá adayeba fún μήτιγε nínú àyíká àríyànjiyàn yìí. A pa ìtumọ̀ ìdájọ́ ọjọ́ iwájú àti àìdánilójú nípa irú àwọn áńgẹ́lì tí a ń tọ́ka sí mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:02Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà tọ́ fún οὐκ οἴδατε, ἀγγέλους, κρινοῦμεν, àti βιωτικά. Ṣùgbọ́n “Mélòó mélòó” túmọ̀ sí ìbéèrè iye (“how many?”), kì í sì ṣe agbára μήτιγε nínú ẹsẹ yìí, èyí tí ó túmọ̀ sí “ká má tilẹ̀ sọ̀rọ̀ nípa / not to mention.”
  naturalness: “Ṣé ẹ̀yin kò mọ̀ pé àwa yóò dá àwọn áńgẹ́lì lẹ́jọ́?” jẹ́ Yorùbá boṣewa tí ó hàn gbangba. Àtúnṣe náà lo “ká má tilẹ̀ sọ nípa” fún ìṣọ̀kan ọ̀rọ̀ àti ìfẹ̀sẹ̀mulẹ̀ àríyànjiyàn tó dáa nínú Yorùbá.
  terminology: “dá ... lẹ́jọ́” yẹ fún κρινοῦμεν, “àwọn áńgẹ́lì” yẹ fún ἀγγέλους, àti “àwọn ọ̀ràn ti ìgbésí ayé yìí” pa βιωτικά mọ́ ní ìtumọ̀ gbooro rẹ̀. Kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kún ìdájọ́ àwọn áńgẹ́lì.
  issues:
  - severity: high
    issue: “Mélòó mélòó” ni a lò fún μήτιγε.
    rationale: Ní Yorùbá, “mélòó mélòó” béèrè nípa iye, nítorí náà kò lè fi “not to mention/let alone” tí μήτιγε ń sọ hàn. Ó tún mú kí ìtumọ̀ gbolohun náà dà bí ìbéèrè iye dípò ìfọwọ́sí àríyànjiyàn láti ohun tó tóbi sí ohun tó kéré.
  revised_text: Ṣé ẹ̀yin kò mọ̀ pé àwa yóò dá àwọn áńgẹ́lì lẹ́jọ́, ká má tilẹ̀ sọ nípa àwọn ọ̀ràn ti ìgbésí ayé yìí?[a]
