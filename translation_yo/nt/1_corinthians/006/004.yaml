  source_fidelity: 'Ìtumọ̀ náà fara mọ́ SBLGNT dáadáa: βιωτικὰ κριτήρια ni a mú gẹ́gẹ́ bí àwọn ẹjọ́/ọ̀ràn ìgbésí ayé, ἐὰν ἔχητε jẹ́ “bí ẹ bá ní,” àti τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ ni a fi hàn gẹ́gẹ́ bí àwọn tí kò ní iyì nínú ìjọ. Ìbéèrè ìbáwí náà ní ìparí ṣetọju ìpìlẹ̀ ìbéèrè ti ìtẹ̀jáde SBLGNT, nígbà tí àkọsílẹ̀ ìsàlẹ̀ fi ìtumọ̀ àṣẹ ẹ̀gàn tí ó ṣeé ṣe hàn.'
  naturalness: Yorùbá náà jẹ́ boṣewa, ó sì kún fún àmì ohùn ní ibi tí ó yẹ. “Ṣé ... ni ẹ ń fi ṣe onídàájọ́?” jẹ́ ọ̀nà tí ó ṣe kedere, tí ó sì dáa láti sọ ìbéèrè ìbáwí náà. “Àwọn ẹjọ́ nípa ọ̀ràn ìgbésí ayé yìí” lè yí padà sí ọ̀nà tí ó kúrú díẹ̀, ṣùgbọ́n kò jẹ́ àṣìṣe, ó sì ṣetọju ìtumọ̀.
  terminology: “Ìjọ” yẹ fún ἐκκλησία; “onídàájọ́” yẹ fún ipa ìdájọ́ tí καθίζετε ń tọ́ka sí nínú àyíká yìí. “Àwọn tí kò ní iyì kankan nínú ìjọ” ṣe afihan ipo ẹni tí a kà sí asán láìfi dájú pé àwọn náà jẹ́ ọmọ ìjọ tàbí ẹni ìta. Àwọn àkọsílẹ̀ ìsàlẹ̀ náà ṣetọju àwọn àṣàyàn ìtumọ̀ pàtàkì.
