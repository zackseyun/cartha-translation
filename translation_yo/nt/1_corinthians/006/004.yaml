id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: yo
  text: Nítorí náà, bí ẹ bá ní àwọn ẹjọ́ nípa ọ̀ràn ìgbésí ayé yìí,[a] ṣé àwọn tí kò ní iyì kankan nínú ìjọ[b] ni ẹ ń fi ṣe onídàájọ́?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa àwọn ọ̀ràn ìgbésí ayé ojoojúmọ́”; Gíríìkì ń tọ́ka sí àwọn ọ̀ràn ayé lásán tàbí ọ̀ràn aráàlú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí a fojú tẹ́ńbẹ́lú nínú ìjọ.” Gbólóhùn Gíríìkì náà lè jẹ́ ọ̀rọ̀ ẹ̀gàn nípa àwọn tí a kà sí ẹni tí kò ṣe pàtàkì láàárín ìjọ, tàbí àwọn tí kò ní iyì ní ojú ìjọ.
    reason: alternative_reading
  - marker: c
    text: 'Àwọn kan lóye gbólóhùn yìí gẹ́gẹ́ bí àṣẹ ẹ̀gàn pé: “Ẹ fi àwọn tí kò ní iyì kankan nínú ìjọ ṣe onídàájọ́.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: nípa ọ̀ràn ìgbésí ayé yìí
  rationale: Ó tọ́ka sí àwọn ọ̀ràn ayé ojoojúmọ́ tàbí ọ̀ràn aráàlú, kì í ṣe sí ìwà búburú tí ‘ti ayé’ lè túmọ̀ sí.
- source_word: κριτήρια
  choice: àwọn ẹjọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà lè tọ́ka sí ẹjọ́ tàbí ìgbéjọ́; ‘àwọn ẹjọ́’ bá Yorùbá mu, ó sì pa ìtumọ̀ ilé-ẹjọ́ mọ́ láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: ἐὰν ἔχητε
  choice: bí ẹ bá ní
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn oníṣ شرط conditional Gíríìkì, ó sì pa ìtumọ̀ ‘if you have’ mọ́.
- source_word: τοὺς ἐξουθενημένους
  choice: àwọn tí kò ní iyì kankan
  rationale: Ó sọ nípa àwọn tí a kà sí asán, tí a fojú tẹ́ńbẹ́lú, tàbí tí kò ní ipò pàtàkì; yíyan yìí pa àìdánilójú náà mọ́ láìfi dandan sọ pé ọmọ ìjọ ni tàbí àjèjì.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: nínú ìjọ
  rationale: Ìtumọ̀ tààrà ni, ó sì jẹ́ kí ó ṣì ṣeé lóye gẹ́gẹ́ bí ẹni tí kò ní iyì láàárín ìjọ tàbí ní ojú ìjọ.
- source_word: τούτους καθίζετε
  choice: ni ẹ ń fi ṣe onídàájọ́?
  rationale: καθίζω túmọ̀ ní ti gidi sí ‘jokòó,’ ṣùgbọ́n nínú ọ̀rọ̀ ìdájọ́ ó túmọ̀ sí fífi ènìyàn jókòó gẹ́gẹ́ bí onídàájọ́; ìtumọ̀ yìí ṣe kedere ní Yorùbá, ó sì pa ìbéèrè ìbáwí náà mọ́.
theological_decisions:
- issue: Bóyá gbólóhùn náà jẹ́ ìbéèrè ìbáwí tàbí àṣẹ ẹ̀gàn, àti ẹni tí ‘a kò kà sí’ ń tọ́ka sí
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìbéèrè ìbáwí: ‘ṣé ... ni ẹ ń fi ṣe onídàájọ́?’'
  alternative: 'A lè túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ ẹ̀gàn pé: ‘Ẹ fi àwọn tí kò ní iyì kankan nínú ìjọ ṣe onídàájọ́.’ Bákan náà, ‘àwọn tí kò ní iyì’ lè jẹ́ àwọn ẹni ìta tí ìjọ kò kà sí ẹni pàtàkì.'
  rationale: Àmì ìbéèrè SBLGNT àti àyíká ọ̀rọ̀ 1 Kọ́ríńtì 6:1–6 ṣe àtìlẹ́yìn fún ìbéèrè ìbáwí. Síbẹ̀, àkọsílẹ̀ ìsàlẹ̀ jẹ́ kí kíkà á gẹ́gẹ́ bí àṣẹ ẹ̀gàn hàn, a kò sì fi dandan dá ẹni tí gbólóhùn náà ń tọ́ka sí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, ‘ìjọ’ fún ἐκκλησία, àti ọ̀rọ̀ òfin tí ó ṣe kedere fún òǹkàwé òde òní. Ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó pa ohùn ìbáwí Pọ́ọ̀lù mọ́.
