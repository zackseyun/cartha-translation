  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ κολλώμενος τῷ κυρίῳ ἓν πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/017.yaml
  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó darapọ̀ mọ́ Olúwa[a] jẹ́ ẹ̀mí kan pẹ̀lú rẹ̀.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹni tí a so pọ̀ mọ́ Olúwa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé ẹni náà darapọ̀ mọ́ Olúwa, tàbí pé a so ẹni náà pọ̀ mọ́ ọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ní ṣókí, “jẹ́ ẹ̀mí kan.” Ọ̀rọ̀ “pẹ̀lú rẹ̀” kò sí ní tààràtà nínú Gíríìkì, ṣùgbọ́n ó fara hàn nínú ìtumọ̀ àyíká ọ̀rọ̀, a sì fi í kún un kí gbólóhùn Yorùbá lè ṣe kedere.
    reason: lexical_alternative
  - marker: c
    text: Àwọn atúmọ̀ kan lè kọ ọ́ sí “Ẹ̀mí” pẹ̀lú lẹ́tà ńlá, ṣùgbọ́n ó ṣeé ṣe jù pé gbólóhùn náà túmọ̀ sí pé onígbàgbọ́ wà ní ìṣọ̀kan pẹ̀lú Olúwa nínú ẹ̀mí.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: tí ó darapọ̀ mọ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí fífi ara mọ́ ẹnì kan tàbí ìṣọ̀kan tímọ́tímọ́. “Darapọ̀ mọ́” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ ìṣọ̀kan náà mọ́, ó sì lè dúró fún agbára aláàárín tí ọ̀rọ̀ Gíríìkì ní láìsọ ọ́ di ìṣọ̀kan ara nìkan.
- source_word: κυρίῳ (κύριος)
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος níhìn-ín, ó sì pa ọlá àti ìwúwo ẹ̀kọ́ nípa Jésù tí ó jíǹde mọ́.
- source_word: ἓν
  choice: kan
  rationale: “Kan” ń fi ìṣọ̀kan hàn gẹ́gẹ́ bí numeral ἓν, kì í ṣe pé àwọn méjèèjì ní èrò kan lásán.
- source_word: πνεῦμα
  choice: ẹ̀mí
  rationale: Lẹ́tà kékeré ni a lò nítorí pé gbólóhùn náà sábà máa ń tọ́ka sí ìṣọ̀kan onígbàgbọ́ pẹ̀lú Olúwa nínú ẹ̀mí, kì í ṣe sí ìdánimọ̀ wọn pẹ̀lú Ẹ̀mí Mímọ́. Àmọ́ ìtumọ̀ yìí ní àyè fún àríyànjiyàn, nítorí náà a ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: ὁ δὲ ... ἐστιν
  choice: Ṣùgbọ́n ẹni tí ó ... jẹ́
  rationale: Ọ̀nà yìí tú àpilẹ̀kọ pẹ̀lú participle tó ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ sí Yorùbá àdánidá. “Ẹni” lè ṣojú ẹnikẹ́ni láìfi akọ nìkan sí i.
theological_decisions:
- issue: Irú ìṣọ̀kan tí “ẹ̀mí kan” ń sọ
  choice: Ọ̀rọ̀ náà ń sọ ìṣọ̀kan tòótọ́ nínú ẹ̀mí láàárín onígbàgbọ́ àti Olúwa, ṣùgbọ́n kò sọ pé àwọn méjèèjì di ẹni kan náà.
  alternative: Ó lè jẹ́ ìdánimọ̀ ìjìnlẹ̀ tó lágbára jù bẹ́ẹ̀ lọ, tàbí pé wọ́n kàn ní èrò àti ète kan náà.
  rationale: Àyíká ọ̀rọ̀ fi ìṣọ̀kan ara ní ẹsẹ ṣáájú wé ìṣọ̀kan pẹ̀lú Olúwa. “Ẹ̀mí kan pẹ̀lú rẹ̀” pa agbára ìṣọ̀kan náà mọ́ láìsọ ìyàtọ̀ láàárín onígbàgbọ́ àti Olúwa nù.
- issue: Fífi “pẹ̀lú rẹ̀” kún gbólóhùn náà
  choice: A fi “pẹ̀lú rẹ̀” sí i fún ìtumọ̀ tó ṣe kedere ní Yorùbá.
  alternative: A lè sọ ní ṣókí pé “jẹ́ ẹ̀mí kan.”
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ “pẹ̀lú rẹ̀” ní tààràtà, ṣùgbọ́n àyíká rẹ̀ mú kí ó yé wa pé ìṣọ̀kan náà wà láàárín ẹni náà àti Olúwa. Àfikún náà mú kí Yorùbá ṣe kedere láìyí ìtumọ̀ padà.
- issue: Bóyá πνεῦμα ń tọ́ka sí ẹ̀mí ènìyàn tàbí Ẹ̀mí Mímọ́
  choice: A kọ ọ́ sí “ẹ̀mí” gẹ́gẹ́ bí ìṣọ̀kan ẹni náà pẹ̀lú Olúwa nínú ẹ̀mí.
  alternative: Àwọn kan lè kà á sí “Ẹ̀mí,” ìyẹn Ẹ̀mí Mímọ́.
  rationale: Àwọn ìwé Gíríìkì ìgbàanì kò fi lẹ́tà ńlá àti kékeré yà ìtumọ̀ yìí sọ́tọ̀. Àyíká ọ̀rọ̀ fọwọ́ sí “ẹ̀mí” jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn kejì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní ọlá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. “Darapọ̀ mọ́” jẹ́ ọ̀rọ̀ àdánidá tó pa ìṣọ̀kan tímọ́tímọ́ mọ́, nígbà tí “ẹ̀mí kan pẹ̀lú rẹ̀” jẹ́ kí olùkópa kejì tí Gíríìkì fi sí abẹ́ òye hàn gbangba.
