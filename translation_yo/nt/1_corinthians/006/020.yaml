base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: yo
  text: Nítorí a rà yín ní iye kan[a]; nítorí náà, ẹ yin Ọlọ́run lógo nínú ara yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a rà yín pẹ̀lú iye kan.” Èdè Gíríìkì pa àwòrán iye tí a san fún ìrà mọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ fi ara yín yin Ọlọ́run lógo.” Èdè Gíríìkì lè tọ́ka sí ohun tí a ń ṣe nínú ara tàbí nípasẹ̀ ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: a rà yín
  rationale: 'Ọ̀rọ̀ náà jẹ́ aorist passive, ó sì pa àwòrán ọjà mọ́ ní tààrà: ẹnì kan ni ó rà wọ́n.'
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí fún ìṣírí inú ẹsẹ tó ṣáájú; “Nítorí” jẹ́ àsopọ̀ Yorùbá tó ṣe kedere.
- source_word: τιμῆς
  choice: ní iye kan
  rationale: Genitive yìí tọ́ka sí iye tí a san nínú ìrà; gbolohun náà pa àwòrán iye ọjà mọ́ láì sọ ohun tí Gíríìkì kò sọ níbí.
- source_word: δοξάσατε
  choice: ẹ ... yin Ọlọ́run lógo
  rationale: Àṣẹ aorist ni; “yin ... lógo” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ fífi ògo fún Ọlọ́run.
- source_word: δὴ
  choice: nítorí náà
  rationale: Ó mú ìyọrísí àti ìkánjú àṣẹ náà hàn; ó so ìrà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn pọ̀ mọ́ ohun tí wọ́n gbọ́dọ̀ ṣe.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: ẹ fi ara yín
  rationale: “Ara” pa ìtumọ̀ gidi ti σῶμα mọ́, “fi” sì jẹ́ Yorùbá àdánidá fún iṣẹ́ tí ènìyàn ń ṣe nípasẹ̀ ara rẹ̀, láì yí i sí “ìgbésí ayé” tàbí “ẹni gbogbo.”
theological_decisions:
- issue: Àwòrán ìrà nínú ìgbàlà
  choice: Pa àwòrán ọjà mọ́ pé “a rà yín ní iye kan”
  alternative: A dá yín sílẹ̀ pẹ̀lú ohun iyebíye
  rationale: Gíríìkì lo èdè ìrà ní kedere. Yíyọ ọ́ sí “ìdáǹdè” nìkan lè mú àwòrán pàtàkì yìí sọnù, ó sì lè túmọ̀ ohun tó ju ọrọ̀ orísun lọ.
- issue: Ìwà tó kan ara
  choice: Túmọ̀ σῶμα ní pàtó sí “ara”
  alternative: ìgbésí ayé yín; gbogbo ẹni yín
  rationale: Ọ̀rọ̀ àyíká ń sọ nípa ìwà ìbálòpọ̀ tó kan ara. “Ara” pa ìjiyàn Pọ́ọ̀lù mọ́ láì fẹ̀ ọ́ sí ìtumọ̀ tó gbòòrò ju.
- issue: Ìtumọ̀ ἐν pẹ̀lú ara
  choice: “ẹ fi ara yín”
  alternative: “nínú ara yín”
  rationale: ἐν lè ní agbára ibi tàbí ohun èlò. “Fi ara yín” jẹ́ adayeba jù ní Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ibi “nínú ara yín” mọ́ gẹ́gẹ́ bí àṣàyàn tòótọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. Fọ́ọ̀mù ọ̀pọ̀ “yín/ẹ” tẹ̀ lé ὑμῶν àti àṣẹ ọ̀pọ̀, nígbà tí “ara” dúró ní ẹyọ bí σῶμα ṣe rí nínú Gíríìkì.
