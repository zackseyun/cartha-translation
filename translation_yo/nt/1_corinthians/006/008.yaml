  text: ἀλλὰ ὑμεῖς ἀδικεῖτε καὶ ἀποστερεῖτε, καὶ ⸀τοῦτο ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin fúnra yín ń ṣe àìṣòdodo, ẹ sì ń jẹ àwọn arákùnrin yín ní ohun tí ó yẹ fún wọn—àní, àwọn arákùnrin yín gan-an!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn sí ohun tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìtakora ní Yorùbá.
- source_word: ὑμεῖς
  choice: ẹ̀yin fúnra yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà ní ìtẹnumọ́; ‘ẹ̀yin fúnra yín’ pa ìtẹnumọ́ Pọ́ọ̀lù mọ́ lórí ìwà àwọn ará Kọ́ríńtì fúnra wọn.
- source_word: ἀδικεῖτε
  choice: ń ṣe àìṣòdodo
  rationale: Ó túmọ̀ sí ṣíṣe ohun tí kò tọ́ tàbí hùwà àìṣòdodo; yíyan yìí pa ìtumọ̀ gbogbogbò àti agbára ìwà rere rẹ̀ mọ́ láìfi ohun tí a kò sọ kún un.
- source_word: ἀποστερεῖτε
  choice: ń rẹ́ àwọn ẹlòmíràn jẹ
  rationale: Àpólà Yorùbá yìí sọ ìṣe jíjẹ ẹnì kan ní ohun tí ó tọ́ sí i tàbí ṣíṣe èrú sí i, ó sì bá àyíká ẹjọ́ àti ọrọ̀ ajé mu.
- source_word: καὶ τοῦτο
  choice: —àní
  rationale: ‘Àní’ mú ìtẹnumọ́ ọ̀rọ̀ náà jáde pé ohun burúkú náà tún kan àwọn ará wọn; àmì ìdádúró gígùn ń pa agbára ọ̀rọ̀ náà mọ́.
- source_word: ἀδελφούς
  choice: àwọn arákùnrin yín
  rationale: ‘Arákùnrin’ pa ìrísí akọ púpọ̀ ti ọ̀rọ̀ Gíríìkì mọ́; ‘yín’ jẹ́ àdánidá nínú àyíká ìbáwí tààrà yìí. Àlàyé ìsàlẹ̀ ṣàlàyé pé ó lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφούς ní àyíká ìjọ tí ó ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin yín
  alternative: àwọn arákùnrin àti arábìnrin yín; àwọn onígbàgbọ́ ẹlẹgbẹ́ yín
  rationale: Ọ̀rọ̀ orísun jẹ́ akọ ní ọ̀pọ̀, ṣùgbọ́n nínú lílò Pọ́ọ̀lù ó lè dúró fún àwọn ọmọ ìjọ lápapọ̀. A pa ìrísí orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìtumọ̀ tó lè gbòòrò nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo ‘ń rẹ́ … jẹ’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún jíjẹ ẹlòmíràn ní ohun tí ó tọ́ sí i, láìgbé ìtumọ̀ náà dé ‘jíjà’ ní pàtó.
