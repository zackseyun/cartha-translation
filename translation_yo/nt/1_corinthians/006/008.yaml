  source_fidelity: Ìtumọ̀ náà pa ìtakora nínú ἀλλὰ àti ìtẹnumọ́ ὑμεῖς mọ́ dáadáa. Ṣùgbọ́n ‘àwọn ẹlòmíràn’ fún ἀποστερεῖτε ṣáájú ‘àwọn arákùnrin yín’ mú ohun tí ìṣe méjèèjì ń kàn ṣẹ̀yìn di ènìyàn mìíràn, bí ó tilẹ̀ jẹ́ pé ἀδελφούς ni ohun tí ó wọ́pọ̀ fún àwọn ọ̀rọ̀-ìṣe méjèèjì nínú Gíríìkì. Àtúnṣe náà so ‘àwọn arákùnrin yín’ mọ́ ìṣe jíjẹ ẹni ní ohun tó yẹ fún un, ó sì pa ìtẹnumọ́ καὶ τοῦτο mọ́.
  naturalness: ‘Ń jẹ ... ní ohun tí ó yẹ fún wọn’ jẹ́ Yorùbá boṣewa tí ó ṣe kedere fún ìtumọ̀ ‘defraud/deprive.’ ‘Àní, àwọn arákùnrin yín gan-an!’ tún mú ìtẹnumọ́ ọlọ́rọ̀ ti gbolohun Gíríìkì náà jáde láìdi ẹsẹ̀ náà lórí.
