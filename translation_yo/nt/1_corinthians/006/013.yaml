  terminology: ‘Ikùn,’ ‘ara,’ ‘àgbèrè,’ àti ‘Olúwa’ bá ọ̀rọ̀ orísun àti ìforúkọsílẹ̀ Bíbélì Yorùbá mu. ‘Àgbèrè’ lè bo ọ̀rọ̀ πορνεία ní ọ̀rọ̀ gbogbogbò rẹ̀ ní àyíká ẹsẹ̀ yìí, láìdín un kù sí irú ìbálòpọ̀ kan pàtó.
