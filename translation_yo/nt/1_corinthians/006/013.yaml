reference: 1 Corinthians 6:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: yo
  text: Àwọn oúnjẹ wà fún ikùn, ikùn sì wà fún àwọn oúnjẹ[a][b]—ṣùgbọ́n Ọlọ́run yóò mú òun àti wọn wá sí òpin[c]. Ṣùgbọ́n ara kì í ṣe fún àgbèrè, bí kò ṣe fún Olúwa; Olúwa sì wà fún ara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì lo ọ̀pọ̀ níbi yìí: ‘Àwọn oúnjẹ wà fún ikùn, ikùn sì wà fún àwọn oúnjẹ.’ A tún lè sọ ọ́ ní ṣókí pé, ‘Oúnjẹ wà fún ikùn, ikùn sì wà fún oúnjẹ.’'
    reason: lexical_alternative
  - marker: b
    text: Ọ̀pọ̀ àwọn atúmọ̀ gbà pé ‘Àwọn oúnjẹ wà fún ikùn, ikùn sì wà fún àwọn oúnjẹ’ jẹ́ ọ̀rọ̀ tí àwọn ará Kọ́ríńtì máa ń sọ, tí Pọ́ọ̀lù sì tún un ṣe lẹ́yìn náà.
    reason: alternative_reading
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí ‘Ọlọ́run yóò pa òun àti wọn run,’ tàbí ‘Ọlọ́run yóò mú òun àti wọn di aláìṣiṣẹ́.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ βρώματα
  choice: àwọn oúnjẹ
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀; Yorùbá lè lo ‘àwọn oúnjẹ’ lọ́nà àdánidá, ó sì pa ìyàtọ̀ ọ̀pọ̀ náà mọ́.
- source_word: κοιλίᾳ / κοιλία
  choice: ikùn
  rationale: ‘Ikùn’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún ẹ̀yà ara tó ń gba oúnjẹ nínú ọ̀rọ̀ yìí.
- source_word: καταργήσει
  choice: yóò mú ... dópin
  rationale: Ó fi hàn pé Ọlọ́run yóò fòpin sí iṣẹ́ tàbí ètò wọn, láìfi dandan túmọ̀ rẹ̀ sí píparun wọn pátápátá.
- source_word: ταύτην καὶ ταῦτα
  choice: òun àti wọn
  rationale: ‘Òun’ ń tọ́ka sí ikùn, ‘wọn’ sì ń tọ́ka sí àwọn oúnjẹ, gẹ́gẹ́ bí ìyàtọ̀ ẹyọ àti ọ̀pọ̀ inú Gíríìkì.
- source_word: τὸ σῶμα
  choice: ara
  rationale: ‘Ara’ ni ìtumọ̀ Yorùbá tó bójú mu fún ara ènìyàn ní ti gidi, pẹ̀lú ìjẹ́pàtàkì ẹ̀kọ́ ìgbàgbọ́ rẹ̀.
- source_word: πορνείᾳ
  choice: àgbèrè
  rationale: ‘Àgbèrè’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tó sì lè dúró fún ìwà ìbálòpọ̀ tí kò bófin mu ní ọ̀rọ̀ yìí.
- source_word: κυρίῳ / κύριος
  choice: Olúwa
  rationale: Ó pa ìlò Pọ́ọ̀lù àti ìjẹ́pàtàkì orúkọ oyè tí ó tọ́ka sí Jésù mọ́.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìtakora láàárín ọ̀rọ̀ nípa oúnjẹ àti ikùn àti àtúnṣe Pọ́ọ̀lù nípa ara hàn.
theological_decisions:
- issue: Bóyá gbólóhùn àkọ́kọ́ jẹ́ ọ̀rọ̀ àyọlò àwọn ará Kọ́ríńtì tàbí ọ̀rọ̀ Pọ́ọ̀lù fúnra rẹ̀
  choice: A gbé e kalẹ̀ láìsí àmì ọ̀rọ̀ àyọlò tàbí ‘ẹ̀yin ní’, kí gígé ọ̀rọ̀ náà sì hàn nípasẹ̀ àmì gígùn àti ‘ṣùgbọ́n’.
  alternative: Fi í sínú àmì ọ̀rọ̀ àyọlò tàbí fi ‘ẹ̀yin ní’ kún un.
  rationale: Gíríìkì kò fi àmì hàn pé àyọlò ni; ọ̀nà yìí pa àìdánilójú tó wà nínú ẹsẹ náà mọ́.
- issue: Ìtumọ̀ καταργήσει nípa oúnjẹ àti ikùn
  choice: yóò mú òun àti wọn dópin
  alternative: yóò pa òun àti wọn run; yóò mú wọn di aláìṣiṣẹ́
  rationale: Ìtumọ̀ yìí tẹnumọ́ òpin iṣẹ́ tàbí ètò wọn láìfi ìparun ohun-ara sí ọ̀rọ̀ náà ju bí Gíríìkì ṣe béèrè lọ.
- issue: Agbára ọ̀rọ̀ ‘Olúwa sì wà fún ara’
  choice: A pa ọ̀rọ̀ ìbáṣepọ̀ kúkúrú náà mọ́ láìṣàlàyé sí i.
  alternative: Olúwa ń tọ́jú ara; Olúwa wà fún ire ara.
  rationale: Gíríìkì jẹ́ kúkúrú, ó sì bá ìṣọ̀kan gbólóhùn tó ṣáájú mu; àfikún ìtumọ̀ yóò yanjú ohun tí ẹsẹ náà fi sílẹ̀ ní kúkúrú.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní iyì. A pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́ ní ‘wà fún ... wà fún,’ láìṣàlàyé ìbáṣepọ̀ Olúwa àti ara ju ohun tí ẹsẹ náà sọ lọ.
