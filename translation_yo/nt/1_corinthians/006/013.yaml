  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ọ̀pọ̀ βρώματα mọ́, ó ṣe ìyàtọ̀ ikùn/àwọn oúnjẹ nínú ταύτην καὶ ταῦτα, ó sì fi ìtakora δέ hàn. Síbẹ̀, ‘mú òun àti wọn dópin’ kò wọ́pọ̀ tó nínú Yorùbá; ‘mú ... wá sí òpin’ jẹ́ ọ̀nà tí ó mọ́gbọ́n dání láti sọ καταργήσει láìfẹ̀sùn kan ìparun pátápátá.'
