id: 1CO.6.5
reference: 1 Corinthians 6:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: yo
  text: Mo sọ èyí láti mú kí ojú tì yín. Ṣé ó rí bẹ́ẹ̀ gan-an pé kò sí ẹnì kan tí ó gbọ́n[a] láàárín yín, tí yóò lè dá ẹjọ́ láàárín àwọn ará rẹ̀[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì ní ọ̀rọ̀ akọ-ẹyọ, ‘ọlọ́gbọ́n kan’; ṣùgbọ́n Paulu ń bá gbogbo ìjọ sọ̀rọ̀, ‘ẹni kan tí ó gbọ́n’ sì lè jẹ́ ọkùnrin tàbí obìnrin ní Yorùbá.
    reason: lexical_alternative
  - marker: b
    text: ‘Ará’ níbí túmọ̀ sí àwọn onígbàgbọ́ ẹlẹgbẹ́ ẹni. Gíríìkì ní ‘arákùnrin rẹ̀’ ní ẹyọ nínú gbólóhùn àkùdé lẹ́yìn ‘láàárín’; ẹni kejì tí ẹjọ́ náà wà láàárín wọn kò jẹ́ dárúkọ ní tààrà.
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: Mo sọ èyí láti dójú tì yín
  rationale: 'Ọ̀rọ̀ yìí fi ète àti agbára ìbáwí Paulu hàn ní Yorùbá àdánidá: ó sọ ọ́ láti mú kí ìjọ mọ ìtìjú ohun tí wọ́n ń ṣe.'
- source_word: οὕτως
  choice: Ṣé ó rí bẹ́ẹ̀ gan-an pé
  rationale: Ìbéèrè olóhùn ìbínú yìí mú ìtumọ̀ ìbéèrè àròsọ inú ọ̀rọ̀ náà jáde ju lílo ‘bẹ́ẹ̀’ lásán lọ.
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς
  choice: kò sí ẹnì kan tí ó gbọ́n láàárín yín
  rationale: Èyí pa àfiyèsí líle ti ọ̀rọ̀ àìlódì mọ́, ó sì fi hàn pé Paulu ń tọ́ka sí gbogbo àwùjọ ìjọ.
- source_word: δυνήσεται διακρῖναι
  choice: tí yóò lè dá ẹjọ́
  rationale: ‘Yóò lè’ pa ìṣe ọjọ́ iwájú mọ́; ‘dá ẹjọ́’ sì bá ipò àríyànjiyàn àti ìpinnu ẹjọ́ mu ní Yorùbá.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: láàárín àwọn ará rẹ̀
  rationale: Gíríìkì náà jẹ́ ọ̀rọ̀ àkùdé lẹ́yìn ‘láàárín,’ ó sì dárúkọ arákùnrin kan ní ẹyọ ṣùgbọ́n ẹni kejì wà nínú ìtumọ̀. Yorùbá àdánidá nílò àwọn ẹgbẹ́ méjì tàbí jù bẹ́ẹ̀ lọ lẹ́yìn ‘láàárín’; ‘àwọn ará rẹ̀’ yàgò fún fífi ẹni pàtó kan kún un, ó sì bá àríyànjiyàn àwọn onígbàgbọ́ mu.
theological_decisions:
- issue: Ọ̀rọ̀ akọ tí a lò gẹ́gẹ́ bí aṣojú gbogbo ìjọ
  choice: ẹni kan tí ó gbọ́n … àwọn ará rẹ̀
  alternative: ọkùnrin ọlọ́gbọ́n kan … àwọn arákùnrin rẹ̀
  rationale: Àwọn fọ́ọ̀mù Gíríìkì jẹ́ akọ ẹyọ, ṣùgbọ́n Paulu ń bá gbogbo ìjọ sọ̀rọ̀. Yorùbá máa ń lo ‘ẹni’ àti ‘ará’ láìfi akọ tàbí abo hàn; èyí jẹ́ olóòótọ́ sí bí èdè Yorùbá ṣe rí, láìdáhùn pé àwọn obìnrin kò sí nínú àwọn tí ọ̀rọ̀ náà kàn.
- issue: Àkùdé inú ‘láàárín arákùnrin rẹ̀’
  choice: láàárín àwọn ará rẹ̀
  alternative: láàárín òun àti arákùnrin rẹ̀
  rationale: Àṣàyàn kejì máa fi hàn pé ọlọ́gbọ́n náà fúnra rẹ̀ jẹ́ ọ̀kan lára àwọn tí wọ́n ń jiyàn, ohun tí Gíríìkì kò sọ. Ọ̀rọ̀ tí a yàn pa ìdánimọ̀ àwọn ẹgbẹ́ méjèèjì sílẹ̀ láìṣe àfikún bẹ́ẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ohùn ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní. ‘Dójú tì’ pa ìbáwí líle mọ́; ‘dá ẹjọ́’ jẹ́ ọ̀rọ̀ àdánidá fún ṣíṣe ìpinnu nínú àríyànjiyàn. A lo ọ̀rọ̀ tí kò dá lórí akọ tàbí abo níbi tí èdè Yorùbá ti máa ń ṣe bẹ́ẹ̀ ní ti ẹ̀dá.
