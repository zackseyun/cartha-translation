review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the plural, ongoing imperative in φεύγετε, the broad sense of πορνεία, the generic force of ἄνθρωπος, the direct and debated contrast of ‘outside the body,’ and the reflexive emphasis of ἴδιον.
  naturalness: 'One significant grammatical error obscures the central relative clause: ‘tí ènìyàn bá dá’ does not mean ‘that a person may commit’; dá ordinarily means ‘create/bring forth.’ Replacing it with ‘tí ènìyàn bá ṣe’ gives idiomatic Standard Yoruba and preserves the Greek sense.'
  terminology: ‘Ìṣekúṣe nípa ìbálòpọ̀’ is a clear, suitably broad rendering of πορνεία. ‘Ẹ máa sá fún,’ ‘Gbogbo ẹ̀ṣẹ̀,’ ‘ní òde ara,’ and ‘ń ṣẹ̀ sí ara òun fúnra rẹ̀’ are suitable in this register.
  issues:
  - severity: high
    issue: ‘tí ènìyàn bá dá’ mistranslates ποιήσῃ.
    rationale: In this context ποιήσῃ means ‘may do/commit.’ Yoruba dá does not naturally convey committing a sin and makes the clause semantically inaccurate. ‘tí ènìyàn bá ṣe’ is required.
  revised_text: Ẹ máa sá fún ìṣekúṣe nípa ìbálòpọ̀. Gbogbo ẹ̀ṣẹ̀ tí ènìyàn[a] bá ṣe wà ní òde ara; ṣùgbọ́n ẹni tí ń ṣe ìṣekúṣe nípa ìbálòpọ̀ ń ṣẹ̀ sí ara òun fúnra rẹ̀.
  revised_footnotes:
