    reason: lexical_alternative
  revision_rationale: The revision changes only dá to ṣe, restoring the meaning of the Greek verb ποιήσῃ (‘may do/commit’) and making the Yoruba relative clause grammatical and natural. The direct wording of the difficult statement is otherwise preserved without interpretive qualification.
