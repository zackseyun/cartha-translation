revisions:
- from: Ẹ máa sá fún ìṣekúṣe nípa ìbálòpọ̀. Gbogbo ẹ̀ṣẹ̀ tí ènìyàn[a] bá dá wà ní òde ara; ṣùgbọ́n ẹni tí ń ṣe ìṣekúṣe nípa ìbálòpọ̀ ń ṣẹ̀ sí ara òun fúnra rẹ̀.
  to: Ẹ máa sá fún ìṣekúṣe nípa ìbálòpọ̀. Gbogbo ẹ̀ṣẹ̀ tí ènìyàn[a] bá ṣe wà ní òde ara; ṣùgbọ́n ẹni tí ń ṣe ìṣekúṣe nípa ìbálòpọ̀ ń ṣẹ̀ sí ara òun fúnra rẹ̀.
  rationale: The revision changes only dá to ṣe, restoring the meaning of the Greek verb ποιήσῃ (‘may do/commit’) and making the Yoruba relative clause grammatical and natural. The direct wording of the difficult statement is otherwise preserved without interpretive qualification.
  reviewer_model: gpt-5.6-terra
