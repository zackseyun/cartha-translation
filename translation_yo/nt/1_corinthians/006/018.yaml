id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: yo
  text: Ẹ máa sá fún ìṣekúṣe nípa ìbálòpọ̀. Gbogbo ẹ̀ṣẹ̀ tí ènìyàn[a] bá ṣe wà ní òde ara; ṣùgbọ́n ẹni tí ń ṣe ìṣekúṣe nípa ìbálòpọ̀ ń ṣẹ̀ sí ara òun fúnra rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ni ἄνθρωπος, ìyẹn “ènìyàn,” tí ó dúró fún ẹnikẹ́ni lápapọ̀ níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: φεύγετε
  choice: Ẹ máa sá fún
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ fún ọ̀pọ̀ ènìyàn, ó sì ń tọ́ka sí ìṣe tí wọ́n gbọ́dọ̀ máa bá a lọ; “Ẹ máa sá fún” fi ìjẹ́kánjú àti yíyẹra kúrò níbẹ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: πορνείαν
  choice: ìṣekúṣe nípa ìbálòpọ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju àgbèrè tàbí ìbálòpọ̀ ṣáájú ìgbéyàwó nìkan lọ. Gbólóhùn yìí ṣe kedere sí òǹkàwé òde òní pé gbogbo ìwà ìbálòpọ̀ tí kò tọ́ ni a ń sọ.
- source_word: πᾶν ἁμάρτημα
  choice: Gbogbo ẹ̀ṣẹ̀
  rationale: Èyí pa ìtumọ̀ gbòòrò àti ìtẹnumọ́ ọ̀rọ̀ orísun mọ́ ní Yorùbá tó ṣe déédéé.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: tí ènìyàn bá dá
  rationale: “Ènìyàn” jẹ́ ọ̀nà àdánidá láti fi ìtumọ̀ aṣojú gbogbo ènìyàn hàn; “bá dá” sì mú èrò àṣeṣe tó wà nínú ἐὰν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive jáde.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: wà ní òde ara
  rationale: A pa àwòrán ibi tí ọ̀rọ̀ Gíríìkì lò mọ́, láì sọ ọ́ di “kò kan ara,” èyí tí yóò túmọ̀ tàbí rọ ìṣòro gbólóhùn náà ju orísun lọ.
- source_word: ὁ δὲ πορνεύων
  choice: ṣùgbọ́n ẹni tí ń ṣe ìṣekúṣe nípa ìbálòpọ̀
  rationale: “Ẹni tí ń ṣe” pa agbára ọ̀rọ̀-ìṣe participle present mọ́, ó sì so ó mọ́ gbólóhùn àkọ́kọ́ ní kedere.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: ń ṣẹ̀ sí ara òun fúnra rẹ̀
  rationale: “Ṣẹ̀ sí” mú ìtumọ̀ ẹ̀ṣẹ̀ tí a darí sí ara ẹni jáde lọ́nà àdánidá, “ara òun fúnra rẹ̀” sì fi ìtẹnumọ́ ἴδιον hàn.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπος nínú gbólóhùn aṣojú
  choice: ènìyàn
  alternative: ọkùnrin kan
  rationale: Níbí, ἄνθρωπος dúró fún ẹ̀dá ènìyàn lápapọ̀, kì í ṣe akọ nìkan. “Ènìyàn” pa ìtumọ̀ aṣojú náà mọ́ ní Yorùbá àdánidá, àlàyé ìsàlẹ̀ sì jẹ́ kí ìpìlẹ̀ ọ̀rọ̀ orísun ṣe kedere.
- issue: Agbára gbólóhùn pé gbogbo ẹ̀ṣẹ̀ wà ní òde ara
  choice: Túmọ̀ gbólóhùn náà tààrà, kí a sì pa ìṣòro ìtumọ̀ rẹ̀ mọ́
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àsọyé àwọn ará Kọ́ríńtì tàbí kí a rọ ọ́ sí “kò kan ara ní ọ̀nà kan náà”
  rationale: Ọ̀rọ̀ Gíríìkì gbé gbólóhùn náà kalẹ̀ tààrà. Fífipá yan bí a ṣe gbọdọ̀ lóye rẹ̀ yóò mú ìtumọ̀ onítúmọ̀ wọ inú ẹsẹ náà, yóò sì mú ìforígbárí ẹ̀kọ́ ìsìn rẹ̀ kúrò.
translation_notes:
  register: A lo Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lasán. A yan “ìṣekúṣe nípa ìbálòpọ̀” dípò “àgbèrè” nítorí pé ó túmọ̀ πορνεία ní ìwọ̀n tó gbòòrò, láì fi ẹ̀sìn ẹ̀ka kan kún un.
