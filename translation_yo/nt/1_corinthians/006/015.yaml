revisions:
- from: Ṣé ẹ̀yin kò mọ̀ pé àwọn ara yín jẹ́ àwọn ẹ̀yà ara Mèsáyà[a]? Ǹjẹ́ èmi yóò ha mú àwọn ẹ̀yà ara Mèsáyà, kí n sì sọ wọ́n di àwọn ẹ̀yà ara aṣẹ́wó? Kí ó má ṣe rí bẹ́ẹ̀ láéláé![b]
  to: Ṣé ẹ̀yin kò mọ̀ pé àwọn ara yín jẹ́ àwọn ẹ̀yà ara Mèsáyà[a]? Ǹjẹ́ èmi yóò ha mú àwọn ẹ̀yà ara Mèsáyà, kí n sì sọ wọ́n di àwọn ẹ̀yà ara obìnrin aṣẹ́wó? Kí ó má ṣe rí bẹ́ẹ̀ láéláé![b]
  rationale: 'Àtúnṣe kan ṣoṣo ni a ṣe: a fi ‘obìnrin’ kún ‘aṣẹ́wó’ láti ṣàfihàn abo obìnrin tí πόρνη ní nínú ọ̀rọ̀ Gíríìkì. Gbogbo àwọn ìpinnu míì, pẹ̀lú ‘Mèsáyà,’ ‘ẹ̀yà ara,’ àti ìtumọ̀ ìkọ̀sílẹ̀ tó lágbára, wà ní ipò wọn.'
