id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: yo
  text: Ṣé ẹ̀yin kò mọ̀ pé àwọn ara yín jẹ́ àwọn ẹ̀yà ara Mèsáyà[a]? Ǹjẹ́ èmi yóò ha mú àwọn ẹ̀yà ara Mèsáyà, kí n sì sọ wọ́n di àwọn ẹ̀yà ara obìnrin aṣẹ́wó? Kí ó má ṣe rí bẹ́ẹ̀ láéláé![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Orúkọ oyè Gíríìkì Χριστός lè túmọ̀ sí “Mèsáyà,” ó sì tún lè ṣiṣẹ́ bí orúkọ “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Rárá o!” tàbí “Kò gbọdọ̀ rí bẹ́ẹ̀ rárá!” Gbólóhùn Gíríìkì μὴ γένοιτο jẹ́ ọ̀nà líle láti kọ ohun kan sílẹ̀ pátápátá.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: àwọn ara yín
  rationale: Èyí tọ́ka sí ara gidi ti olúkúlùkù onígbàgbọ́, ó sì pa ọ̀pọ̀ nọ́ńbà inú Gíríìkì mọ́.
- source_word: μέλη
  choice: àwọn ẹ̀yà ara
  rationale: ‘Àwọn ẹ̀yà ara’ jẹ́ Yorùbá àdánidá fún àwọn apá ara, ó sì pa àwòrán ara kan tí àwọn ẹ̀yà rẹ̀ parapọ̀ mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός níbí ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè Ẹni Àmì-òróró; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́.
- source_word: ἄρας
  choice: mú
  rationale: ‘Mú’ sọ ìgbésẹ̀ tí Pọ́ọ̀lù gbé kalẹ̀ nínú ìbéèrè àsọjáde rẹ̀ ní ọ̀nà Yorùbá tó rọrùn, láìfi èrò míì kún un.
- source_word: ποιήσω
  choice: sọ wọ́n di
  rationale: Gbólóhùn yìí túmọ̀ ìṣe fífi àwọn ẹ̀yà náà ṣe tàbí yí wọn padà sí ẹ̀yà ara aṣẹ́wó ní kedere.
- source_word: πόρνης
  choice: aṣẹ́wó
  rationale: Ọ̀rọ̀ náà ń tọ́ka pàtó sí obìnrin panṣágà tí ń ṣe iṣẹ́ àgbèrè fún owó, kì í ṣe sí ìwà àgbèrè lápapọ̀.
- source_word: μὴ γένοιτο
  choice: Kí ó má ṣe rí bẹ́ẹ̀ láéláé!
  rationale: Èyí pa ìkọ̀sílẹ̀ líle àti ìrísí ìfẹ́-ọkàn inú ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: οὐκ οἴδατε
  choice: Ṣé ẹ̀yin kò mọ̀
  rationale: Èyí jẹ́ ìbéèrè àsọjáde tó ṣe àdánidá ní Yorùbá, tí ó ń pe àwọn olùgbọ́ sí ohun tí ó yẹ kí wọ́n ti mọ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú àwòrán ìṣọ̀kan ara Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí orúkọ oyè Ẹni Àmì-òróró mọ́. Àkọ́lé ìsàlẹ̀ fi ‘Kristi’ hàn nítorí ọ̀rọ̀ Gíríìkì náà tún lè máa ṣiṣẹ́ bí orúkọ.
- issue: Agbára ìkọ̀sílẹ̀ μὴ γένοιτο
  choice: Kí ó má ṣe rí bẹ́ẹ̀ láéláé!
  alternative: Rárá o! / Kò gbọdọ̀ rí bẹ́ẹ̀ rárá!
  rationale: Àṣàyàn yìí kì í ṣe ìkọ̀ lasan; ó ń fi hàn pé Pọ́ọ̀lù kọ èrò náà sílẹ̀ pátápátá, ó sì pa ìrísí ìfẹ́-ọkàn inú Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. ‘Ṣé’ àti ‘Ǹjẹ́ … ha’ mú àwọn ìbéèrè àsọjáde méjèèjì ṣe kedere; àtúnlò ‘àwọn ẹ̀yà ara’ pa àwòrán ara inú Gíríìkì mọ́.
