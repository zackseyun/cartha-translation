  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìbéèrè àsọjáde méjèèjì, àwòrán ‘ara/ẹ̀yà ara,’ ìṣe ‘mú … sọ di,’ àti ìkọ̀sílẹ̀ líle μὴ γένοιτο mọ́ dáadáa. Ṣùgbọ́n πόρνης jẹ́ ọ̀rọ̀ obìnrin ní èdè Gíríìkì; ‘aṣẹ́wó’ nìkan lè má sọ ìbálòpò ẹni náà di mímọ́ ní Yorùbá.
  naturalness: Yorùbá náà jẹ́ ti òde òní, ó sì ní ìwọ̀n ìbòwò tó yẹ. ‘Ṣé ẹ̀yin kò mọ̀?’ àti ‘Ǹjẹ́ èmi yóò ha…?’ jẹ́ ọ̀nà àdánidá fún ìbéèrè àsọjáde. Fífi ‘obìnrin’ kún ‘aṣẹ́wó’ jẹ́ kedere, kò sì mú gbolóhùn náà wúwo ju bó ṣe yẹ lọ.
  terminology: ‘Mèsáyà’ jẹ́ ìtumọ̀ tó bá ìpinnu iṣẹ́ náà mu fún Χριστός, àti ‘ẹ̀yà ara’ pa àpẹẹrẹ μέλη mọ́. ‘Obìnrin aṣẹ́wó’ sọ ìtumọ̀ pàtó πόρνη di kedere.
  issues:
