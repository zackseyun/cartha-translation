- from: Àwọn olè, àwọn oníwọra,[a] àwọn ọ̀mùtí, àwọn tó ń fi ọ̀rọ̀ burúkú gàn ẹlòmíràn, àti àwọn alọ́nilọ́wọ́gbà[b] kì yóò jogún ìjọba Ọlọ́run.[c]
  to: Àwọn olè, àwọn oníwọra,[a] àwọn ọ̀mùtí, àwọn tí ń sọ̀rọ̀ èébú sí ẹlòmíràn, àti àwọn ajìbìtì[b] kì yóò jogún ìjọba Ọlọ́run.[c]
  rationale: 'A ṣe àtúnṣe kan ṣoṣo tí ó yẹ fún ìmúlò òde òní àti ìdúróṣinṣin lexical: a rọ́pò ọ̀rọ̀ tí kò wọ́pọ̀ “alọ́nilọ́wọ́gbà” pẹ̀lú “ajìbìtì,” a sì tún àlàyé ìsàlẹ̀ ṣe kí ó má ṣe darí ìtumọ̀ sí “amúnisìn.” A pa ìtumọ̀ ogún, ìjọba Ọlọ́run, àti agbára àtòkọ ìwà náà mọ́ láì fi àfikún ẹ̀kọ́ ìjọsìn kún un.'
