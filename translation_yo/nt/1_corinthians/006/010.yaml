  source_fidelity: Ìtumọ̀ náà pa àtòkọ àwọn ẹgbẹ́ ènìyàn nínú ọ̀rọ̀ Gíríìkì mọ́, pẹ̀lú ìkọ̀ ọjọ́ iwájú pé wọn kì yóò jogún ìjọba Ọlọ́run. Ṣùgbọ́n “alọ́nilọ́wọ́gbà” kì í ṣe ọ̀rọ̀ tó wọ́pọ̀ tàbí tó hàn gbangba gẹ́gẹ́ bí ìtumọ̀ ἅρπαγες; “ajìbìtì” jẹ́ ọ̀rọ̀ tó dáa jù fún ẹni tí ń fi ẹ̀tàn tàbí ìjẹkújẹ gba ohun ẹlòmíràn, ní ìbámu pẹ̀lú “swindlers” nínú àtẹ̀jáde Gẹ̀ẹ́sì.
  naturalness: Àwọn olè, oníwọra, àti ọ̀mùtí jẹ́ àṣàyàn Yorùbá tó dára. A tún ṣe àtúnṣe gbolohun λοίδοροι sí “àwọn tí ń sọ̀rọ̀ èébú sí ẹlòmíràn,” èyí tó jẹ́ kedere, tó sì mú ìsọ̀rọ̀ ìkórìíra/ìgàn jáde láì fi í kù sí ẹ̀sùn èké nìkan.
  terminology: “Ìjọba Ọlọ́run” àti “jogún” jẹ́ ìbámu tó péye fún βασιλείαν θεοῦ àti κληρονομήσουσιν. “Ajìbìtì” fi ìmọ̀ “swindlers” hàn dáadáa; àlàyé ìsàlẹ̀ ń pa ààyè ìtumọ̀ tó gbòòrò sí i—ìfipá mú àti ìjẹkújẹ—mọ́ fún ἅρπαγες.
