id: 1CO.6.10
reference: 1 Corinthians 6:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: yo
  text: Àwọn olè, àwọn oníwọra,[a] àwọn ọ̀mùtí, àwọn tí ń sọ̀rọ̀ èébú sí ẹlòmíràn, àti àwọn ajìbìtì[b] kì yóò jogún ìjọba Ọlọ́run.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn alájẹkù.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí àwọn tó ń gba ohun ènìyàn nípasẹ̀ ìfipá mú tàbí ìjẹkújẹ.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, wọn kì yóò rí ìpín gbà nínú ìjọba Ọlọ́run.
    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: àwọn olè
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún àwọn ẹni tí wọ́n ń jalè.
- source_word: πλεονέκται
  choice: àwọn oníwọra
  rationale: Ó ń tọ́ka sí àwọn tí ìfẹ́ láti ní sí i, ní pàtàkì ohun ìní, ti di ànímọ́ wọn; ‘oníwọra’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
- source_word: μέθυσοι
  choice: àwọn ọ̀mùtí
  rationale: Ó ṣàpèjúwe àwọn tí ìmutípara jẹ́ àṣà wọn, kì í ṣe ẹnikẹ́ni tó ti mutí yó rí rí.
- source_word: λοίδοροι
  choice: àwọn tó ń fi ọ̀rọ̀ burúkú gàn ẹlòmíràn
  rationale: Gbólóhùn yìí mú ìtumọ̀ ìsọ̀rọ̀ èébú àti ìgàn jáde ní Yorùbá àdánidá; kò fi ìtumọ̀ náà mọ́ ẹ̀sùn èké nìkan.
- source_word: ἅρπαγες
  choice: àwọn alọ́nilọ́wọ́gbà
  rationale: Ó sọ ní ṣókí nípa àwọn tó ń fi ọgbọ́n èrú tàbí agbára gba ohun ẹlòmíràn; àlàyé ìsàlẹ̀ fi ‘alọ́nilọ́wọ́gbà’ hàn pẹ̀lú àṣàyàn ‘amúnisìn’ láti pa ìbú ìtumọ̀ mọ́.
- source_word: βασιλείαν θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó fìdí múlẹ̀, tó sì pa ìtumọ̀ ìṣàkóso tàbí ilẹ̀ ọba Ọlọ́run mọ́.
- source_word: κληρονομήσουσιν
  choice: kì yóò jogún
  rationale: Ó pa àwòrán ogún àti ìpín tí ajogún ń rí gbà mọ́, pẹ̀lú ìtọ́kasí ọjọ́ iwájú.
theological_decisions:
- issue: Agbára àkójọ ìwà búburú àti èdè ogún
  choice: A fi àwọn orúkọ tó ṣàpèjúwe irú ènìyàn tí ìwà wọ̀nyí ń dá mọ̀ hàn, láì fi ọ̀rọ̀ àlàyé bí ‘aláìronúpìwàdà’ sínú ẹsẹ náà.
  alternative: Kí a túmọ̀ rẹ̀ bí ẹni pé ó ń tọ́ka sí ìṣẹ̀lẹ̀ ẹ̀ṣẹ̀ kọ̀ọ̀kan lásán, tàbí kí a fi ‘àwọn tí kò ronúpìwàdà’ kún ọ̀rọ̀ náà.
  rationale: Àwọn orúkọ ọ̀pọ̀ nínú àkójọ ìwà búburú náà sábà ń tọ́ka sí àwọn tí ìwà wọ̀nyí ń dá mọ̀; ṣùgbọ́n orísun kò sọ ‘aláìronúpìwàdà’ ní tààrà, nítorí náà a kò fi í kún un.
- issue: Ìtumọ̀ ‘jogún ìjọba Ọlọ́run’
  choice: A pa àwòrán ogún mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
  alternative: Kí a rọ́pò rẹ̀ pátápátá pẹ̀lú ‘rí ìpín nínú ìjọba Ọlọ́run.’
  rationale: ‘Jogún’ jẹ́ ìbámu tó péye pẹ̀lú κληρονομήσουσιν, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbà ìkẹyìn àti ti ajogún mọ́ láì pinnu gbogbo bí a ṣe gbọ́dọ̀ lóye ìjọba náà.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ohùn rẹ̀ ní iyì tó yẹ fún àkójọ ìkìlọ̀, ṣùgbọ́n ó yẹra fún àwọn ọ̀rọ̀ àtijọ́ tí òǹkàwé lásán lè má lóye. A tún pa ìsopọ̀ gírámà mọ́ gẹ́gẹ́ bí ìtẹ̀síwájú àkójọ láti ẹsẹ tó ṣáájú, bí ó tilẹ̀ jẹ́ pé a dá a sí gbolohun tó lè dúró fúnra rẹ̀ fún ìtẹ̀jáde ẹsẹ kan.
