id: 1CO.6.11
reference: 1 Corinthians 6:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: yo
  text: Àwọn kan nínú yín sì ti jẹ́ irú àwọn ènìyàn bẹ́ẹ̀[a]. Ṣùgbọ́n a ti wẹ̀ yín mọ́[b], ṣùgbọ́n a ti sọ yín di mímọ́, ṣùgbọ́n a ti dá yín láre ní orúkọ Olúwa Jésù àti nípasẹ̀ Ẹ̀mí Ọlọ́run wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn kan nínú yín sì jẹ́ àwọn wọ̀nyí.” Ọ̀rọ̀ náà ń tọ́ka sí àwọn irú ènìyàn tí a dárúkọ ní ẹsẹ tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Ìrísí ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí, “ẹ ti wẹ ara yín mọ́.” Nínú àyíká yìí, ọ̀pọ̀ ló lóye rẹ̀ gẹ́gẹ́ bí ọ̀kan lára àwọn iṣẹ́ ìgbàlà tí Ọlọ́run ṣe.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: Àwọn kan nínú yín sì ti jẹ́ irú àwọn ẹni bẹ́ẹ̀
  rationale: Ó tọ́ka sí àwọn irú ènìyàn tí a kà ní ẹsẹ tó ṣáájú, ó sì sọ ọ́ ní Yorùbá àdánidá láì pe àwọn ènìyàn ní ‘nǹkan wọ̀nyí.’
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Àtúnṣe ọ̀rọ̀ náà ní ẹ̀ẹ̀mẹ́ta pa ìtakora àti ìtẹnumọ́ Pọ́ọ̀lù mọ́.
- source_word: ἀπελούσασθε
  choice: a ti wẹ̀ yín mọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí middle, àyíká àwọn ọ̀rọ̀ passive méjì tó tẹ̀ lé e ń ṣe àtìlẹ́yìn fún ìtumọ̀ pé ìwẹ̀nùmọ́ ni a ṣe fún wọn; a pa ìtumọ̀ reflexive mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἡγιάσθητε
  choice: a ti sọ yín di mímọ́
  rationale: Èyí jẹ́ Yorùbá tó ṣe kedere fún iṣẹ́ ìsọdimímọ́ Ọlọ́run, láì gbára lé ọ̀rọ̀ ẹ̀kọ́ ìsìn tí gbogbo ènìyàn kò lè lóye.
- source_word: ἐδικαιώθητε
  choice: a ti dá yín láre
  rationale: ‘Dá ... láre’ ń fi ìtumọ̀ ìdáláre tàbí ìdájọ́ pé ẹni náà tọ́ hàn ní Yorùbá àdánidá.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: ní orúkọ Jesu Olúwa
  rationale: Ó pa ọ̀nà gbólóhùn orísun mọ́, ó sì lè ní ìtumọ̀ àṣẹ, ipò, tàbí ohun èlò láì pinnu ọ̀kan ṣoṣo.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: nípasẹ̀ Ẹ̀mí Ọlọ́run wa
  rationale: Nínú àyíká yìí, ἐν lè fi aṣojú iṣẹ́ hàn; ‘nípasẹ̀’ sọ ipa Ẹ̀mí Ọlọ́run di mímọ̀ ní Yorùbá.
theological_decisions:
- issue: Ohùn àti aṣojú iṣẹ́ nínú ἀπελούσασθε
  choice: a ti wẹ̀ yín mọ́
  alternative: ẹ ti wẹ ara yín mọ́
  rationale: Ìrísí middle lè gba ìtumọ̀ reflexive, ṣùgbọ́n àwọn passive tó tẹ̀ lé e àti ìtẹnumọ́ iṣẹ́ ìgbàlà Ọlọ́run ṣe àtìlẹ́yìn fún ìtumọ̀ passive; àṣàyàn kejì wà nínú àlàyé.
- issue: Ẹni tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Ọlọ́run
  alternative: agbègbè tàbí ọ̀nà ẹ̀mí ní gbogbogbòò
  rationale: Gbólóhùn ‘Ẹ̀mí Ọlọ́run wa’ nínú Pọ́ọ̀lù ń tọ́ka sí Ẹ̀mí Mímọ́ lọ́nà tó ṣeé ṣe jù; lẹ́tà ńlá kò fi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ἐν nínú àwọn gbólóhùn méjèèjì
  choice: ní orúkọ ... àti nípasẹ̀ Ẹ̀mí
  alternative: ní orúkọ ... àti nínú Ẹ̀mí
  rationale: A pa àìdánilójú ἐν mọ́ nínú ‘ní orúkọ,’ ṣùgbọ́n ‘nípasẹ̀’ jẹ́ Yorùbá tó ṣe kedere fún ipa Ẹ̀mí gẹ́gẹ́ bí aṣojú iṣẹ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó yẹ; èdè náà jẹ́ ọlọ́lá, kedere, ó sì bójú mu fún kíkà ní gbangba. A tún ‘ṣùgbọ́n’ ṣe ní ẹ̀ẹ̀mẹ́ta láti pa ìlù àti ìtẹnumọ́ orísun mọ́.
