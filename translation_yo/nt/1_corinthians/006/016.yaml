  verdict: revise
  source_fidelity: Àtúnṣe kékeré kan ni a nílò. ἓν σῶμά ἐστιν jẹ́ ‘jẹ́ ara kan,’ ní àkókò ìsinsìnyí; ‘di ara kan’ nínú gbólóhùn àkọ́kọ́ ń yí i sí ìbẹ̀rẹ̀/àbájáde. ‘Yóò di’ nínú àyọlò náà, ní ọwọ́ kejì, bá Ἔσονται ... εἰς σάρκα μίαν mu dáadáa.
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa tó mọ́gbọ́n dání. ‘Panṣágà,’ ‘ara kan,’ àti ‘Àwọn méjèèjì’ jẹ́ ọ̀rọ̀ tó ṣe kedere. Yíyọ ‘ti’ nínú ‘gẹ́gẹ́ bí ó ti wí’ yóò yẹra fún àmì ìṣe-tán/pípẹ́ tí kò hàn nínú φησίν, ó sì jẹ́ kí ọ̀rọ̀ náà rọrùn.
  terminology: ‘Panṣágà’ ń fi pàtó πόρνη hàn, ‘ara kan’ sì mú σῶμα/sarx nínú ìjíròrò àti nínú àyọlò Jẹ́nẹ́sísì ṣọ̀kan ní ọ̀nà tó yẹ. A kò fi ẹ̀kọ́ ìjọ kún ọ̀rọ̀ náà.
