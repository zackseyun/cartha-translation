id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: yo
  text: Tàbí ẹ̀yin kò mọ̀ pé ẹni tí ó darapọ̀ mọ́ panṣágà jẹ́ ara kan pẹ̀lú rẹ̀? Nítorí, gẹ́gẹ́ bí ó ṣe wí,[a] “Àwọn méjèèjì yóò di ara kan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘ó wí’; ẹni tí ‘ó’ ń tọ́ka sí ni a kò dárúkọ ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ tí a fa yọ yìí wá láti Jẹ́nẹ́sísì 2:24.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Tàbí
  rationale: Ó ń tẹ̀ síwájú nínú àríyànjiyàn Pọ́ọ̀lù nípasẹ̀ ìbéèrè àsọyé; ‘Tàbí’ jẹ́ ọ̀nà àdánidá láti pa ìṣàn ọ̀rọ̀ náà mọ́.
- source_word: οὐκ οἴδατε
  choice: ẹ̀yin kò mọ̀ pé
  rationale: Ó pa àgbékalẹ̀ ìbéèrè àsọyé tí Pọ́ọ̀lù sábà máa ń lò mọ́, ó sì dúró nítòsí ìtumọ̀ οἶδα.
- source_word: ὁ κολλώμενος
  choice: ẹni tí ó darapọ̀ mọ́
  rationale: κολλάομαι lè túmọ̀ sí dídarapọ̀, dídì mọ́, tàbí ṣíṣọ̀kan. Nínú àyíká ìbálòpọ̀ yìí, ‘darapọ̀ mọ́’ ṣe kedere láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: τῇ πόρνῃ
  choice: panṣágà
  rationale: πόρνη ń tọ́ka pàtó sí obìnrin tí a ń bá lòpọ̀ fún owó, kì í ṣe gbogbo obìnrin oníṣekúṣe lápapọ̀. ‘Panṣágà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún un.
- source_word: ἓν σῶμά ἐστιν
  choice: di ara kan pẹ̀lú rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì sọ ní ti gidi pé ‘jẹ́ ara kan,’ ‘di ara kan pẹ̀lú rẹ̀’ jẹ́ èdè Yorùbá àdánidá tí ó mú àbájáde ìṣọ̀kan náà hàn, tí ó sì sọ ẹni tí a bá darapọ̀ mọ́ di kedere.
- source_word: Ἔσονται γάρ
  choice: Nítorí ... yóò di
  rationale: γάρ fúnni ní ìdí fún gbólóhùn tó ṣáájú, εἰμί pẹ̀lú εἰς sì ní agbára ìtumọ̀ ‘di’ nínú àyọlò náà.
- source_word: φησίν
  choice: gẹ́gẹ́ bí ó ti wí
  rationale: Ó pa ẹni-kẹta ẹyọ ọ̀rọ̀ Gíríìkì mọ́ láìsọ ẹni tí ‘ó’ ń tọ́ka sí ní pàtó ju bí orísun ṣe sọ lọ.
- source_word: οἱ δύο
  choice: Àwọn méjèèjì
  rationale: Ó túmọ̀ ‘àwọn méjì náà’ ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: εἰς σάρκα μίαν
  choice: ara kan
  rationale: Nínú àyọlò Jẹ́nẹ́sísì yìí, σάρξ ń tọ́ka sí ìṣọ̀kan ara àti ìbátan, kì í ṣe ‘ìwà ẹlẹ́ṣẹ̀.’ ‘Ara kan’ pa àwòrán inú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ohun tí àyọlò Jẹ́nẹ́sísì túmọ̀ sí nípa ìṣọ̀kan ìbálòpọ̀ níta ìgbéyàwó
  choice: A túmọ̀ àyọlò náà ní tààrà gẹ́gẹ́ bí ìpìlẹ̀ fún ọ̀rọ̀ Pọ́ọ̀lù pé ìbálòpọ̀ pẹ̀lú panṣágà dá ìṣọ̀kan ara gidi sílẹ̀.
  alternative: Kí a fi àlàyé kún un pé ọ̀rọ̀ náà kan ìgbéyàwó nìkan, tàbí kí a sọ gbogbo ìparí ẹ̀kọ́ ìwà rere tí ẹsẹ̀ náà kò sọ ní tààrà.
  rationale: Pọ́ọ̀lù ń lo Jẹ́nẹ́sísì 2:24 ní ìfiwéra sí ìbálòpọ̀ pẹ̀lú panṣágà. Ìtumọ̀ náà gbọ́dọ̀ pa agbára ẹ̀kọ́ yìí mọ́ láìfi àlàyé ẹ̀sìn tí kò sí nínú Gíríìkì kún un.
- issue: Ẹni tí φησίν (‘ó wí’) ń tọ́ka sí
  choice: A pa ‘ó’ mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé nínú àlàyé ìsàlẹ̀ pé àyọlò náà wá láti Jẹ́nẹ́sísì 2:24.
  alternative: Kí a túmọ̀ ọ́ sí ‘Ìwé Mímọ́ wí’ tàbí ‘Ọlọ́run wí.’
  rationale: Gíríìkì fi ẹni-kẹta ẹyọ sílẹ̀ láìdárúkọ ẹni náà. Mímú àìsọ pàtó yìí dúró ń yẹra fún yíyan ìtumọ̀ ẹ̀kọ́ kan tí ọ̀rọ̀ fúnra rẹ̀ kò sọ ní kedere.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Panṣágà’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá òde òní lè lóye, ‘ara kan’ sì pa ìṣọ̀kan ọ̀rọ̀ Pọ́ọ̀lù pẹ̀lú àyọlò Jẹ́nẹ́sísì mọ́.
