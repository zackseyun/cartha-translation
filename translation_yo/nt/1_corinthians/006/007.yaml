source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: yo
  text: Nítorí náà, ní tòótọ́, ó ti jẹ́ ìjákulẹ̀ pátápátá fún yín pé ẹ ní àwọn ẹjọ́ láàárín ara yín.[a][b] Èé ṣe tí ẹ kò kúkú gbà kí a hùwà àìṣòdodo sí yín? Èé ṣe tí ẹ kò kúkú gbà kí a rẹ́ yín jẹ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìpàdánù” tàbí “ìkùnà” dípò “ìjákulẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìpàdánù, ìkùnà, tàbí ìjákulẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ọ̀ràn ilé-ẹjọ́” dípò “àwọn ẹjọ́.” Níbí, ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí awuyewuye tí a gbé lọ sí ilé-ẹjọ́.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí a gba ohun tí ó yẹ fún yín lọ́wọ́ yín” dípò “kí a rẹ́ yín jẹ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífi ohun tí ó yẹ fún ẹni dù ú, ríré ẹni jẹ, tàbí gbigba ohun kan lọ́wọ́ ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν
  choice: Nítorí náà, ní tòótọ́, ó ti
  rationale: Ó mú ìtumọ̀ ìparí èrò àti ìtẹnumọ́ ọ̀rọ̀ Gíríìkì jáde, nígbà tí ‘ó ti’ fi hàn pé ipò náà ti wà ní báyìí.
- source_word: ὅλως ἥττημα ὑμῖν ἐστιν
  choice: jẹ́ ìjákulẹ̀ pátápátá fún yín
  rationale: ‘Ìjákulẹ̀’ ṣàfihàn ìpàdánù tàbí ìṣubú tí ἥττημα ń tọ́ka sí; ‘pátápátá’ sì pa agbára ὅλως mọ́ láìfi ‘ìtìjú’ kún un.
- source_word: κρίματα
  choice: ẹjọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí awuyewuye tí a gbé lọ sí ilé-ẹjọ́; ‘ẹjọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: μεθ’ ἑαυτῶν
  choice: láàárín ara yín
  rationale: Ó fi hàn pé àwọn ọmọ ìjọ náà ń bá ara wọn jà nípa ẹjọ́.
- source_word: διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε
  choice: Èé ṣe tí ẹ kò kúkú gbà kí a ṣe yín ní àìṣòdodo?
  rationale: ‘Kúkú gbà’ mú agbára μᾶλλον jáde gẹ́gẹ́ bí yíyan ohun mìíràn dípò ẹjọ́; ìṣe aláìṣe ἀδικεῖσθε wà ní pípa mọ́.
- source_word: διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε
  choice: Èé ṣe tí ẹ kò kúkú gbà kí a rẹ́ yín jẹ?
  rationale: ‘Rẹ́ ... jẹ’ jẹ́ ọ̀nà Yorùbá àdánidá fún jíjẹ ẹni ní jìbìtì tàbí fífi ohun tí ó tọ́ sí i dù ú, ó sì bá àyíká ọ̀rọ̀ òfin àti ohun ìní mu.
theological_decisions:
- issue: Irú ìdájọ́ Pọ́ọ̀lù lórí gbígbé ẹjọ́ lọ sí ilé-ẹjọ́ láàárín àwọn onígbàgbọ́
  choice: ìjákulẹ̀
  alternative: ìpàdánù tàbí ìkùnà
  rationale: ‘Ìjákulẹ̀’ pa agbára ìbáwí Pọ́ọ̀lù mọ́ pé wíwà irú ẹjọ́ bẹ́ẹ̀ fúnra rẹ̀ ti jẹ́ ìṣubú fún wọn, láìsọ ẹ̀ka ẹ̀kọ́ ìgbàgbọ́ kan tí ọ̀rọ̀ náà kò sọ.
translation_notes:
  register: Yorùbá àfẹnusọ tó ní ọ̀wọ̀ ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá èdè àdánidá mu. Àwọn ìbéèrè méjèèjì pa ìpèníjà ọ̀rọ̀ Pọ́ọ̀lù mọ́; a kò fi ‘ìtìjú’ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú Gíríìkì kún un.
