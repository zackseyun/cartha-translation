id: 1CO.6.1
reference: 1 Corinthians 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: yo
  text: Ẹnikẹ́ni nínú yín tí ó bá ní ẹjọ́ lòdì sí ẹlòmíràn, ṣé ó gbójú láti jẹ́ kí a dá ẹjọ́ náà níwájú àwọn aláìṣòdodo[a], kì í ṣe níwájú àwọn ẹni mímọ́[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn aláìdájọ́ òdodo.” Àwọn ìtumọ̀ kan ṣàlàyé èyí gẹ́gẹ́ bí “àwọn aláìgbàgbọ́,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà ní “àwọn aláìṣòdodo.”
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ẹni mímọ́” níhìn-ín ń tọ́ka sí àwọn ènìyàn mímọ́ ti Ọlọ́run, ìyẹn àwọn onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: ṣé ó láyà
  rationale: Ó pa ìbéèrè àsọtẹ́lẹ̀ Pọ́ọ̀lù àti ìtumọ̀ ìgboyà tó fẹ́rẹ̀ẹ́ jẹ́ àfojúdi mọ́.
- source_word: τις ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: Ó fi ẹni kan tí a kò dárúkọ hàn, ó sì pa ọ̀rọ̀ tí Pọ́ọ̀lù ń bá gbogbo wọn sọ mọ́.
- source_word: πρᾶγμα ἔχων
  choice: nígbà tí ... bá ní ẹjọ́
  rationale: Nínú àyíká ọ̀rọ̀ òfin yìí, ‘ẹjọ́’ sọ̀rọ̀ nípa ìjàmbá tàbí ọ̀ràn tí a fẹ́ dá láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: πρὸς τὸν ἕτερον
  choice: lòdì sí ẹlòmíràn
  rationale: Ó bá ìlò ọ̀rọ̀ nípa ẹjọ́ mu, ó sì fi hàn pé arákùnrin kan ní ọ̀ràn sí ẹlòmíràn.
- source_word: κρίνεσθαι
  choice: láti jẹ́ kí a dá ẹjọ́ náà
  rationale: Ìtumọ̀ yìí pa èrò ìdájọ́ mọ́, ó sì lo àbájáde àìsọ ẹni tó ń ṣe iṣẹ́ láti ṣojú ìṣe aláìṣe-taara Gíríìkì ní Yorùbá àdánidá.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: níwájú àwọn aláìṣòdodo
  rationale: ‘Àwọn aláìṣòdodo’ pa àyẹ̀wò ìwà tó wà nínú ἀδίκων mọ́, dípò ṣíṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘àwọn aláìgbàgbọ́’; ‘níwájú’ sì bá àyíká ìdájọ́ mu.
- source_word: καὶ οὐχὶ
  choice: dípò
  rationale: Ó mú ìyàtọ̀ tó wà láàárín àwọn ibi ìdájọ́ méjèèjì ṣe kedere ní Yorùbá àdánidá láìfi èrò tuntun kún un.
- source_word: ἐπὶ τῶν ἁγίων
  choice: níwájú àwọn ẹni mímọ́
  rationale: ‘Àwọn ẹni mímọ́’ pa ọ̀rọ̀ Pọ́ọ̀lù fún àwọn ènìyàn Ọlọ́run mọ́, ‘níwájú’ sì tún fi àyíká ìdájọ́ hàn.
theological_decisions:
- issue: Ìtumọ̀ ἀδίκων ní ìyàtọ̀ sí ἁγίων
  choice: àwọn aláìṣòdodo ... àwọn ẹni mímọ́
  alternative: àwọn aláìgbàgbọ́ ... àwọn onígbàgbọ́
  rationale: Gíríìkì lo àwọn ọ̀rọ̀ tó ní agbára nípa ìwà àti ipò níwájú Ọlọ́run. A pa ìyẹn mọ́, a kò sì túmọ̀ ìtumọ̀ àyíká rẹ̀ sínú ẹsẹ̀ náà bí ẹni pé òun gan-an ni ọ̀rọ̀ Gíríìkì.
- issue: Ẹni kan tí ἔχων ń ṣojú
  choice: ẹnikẹ́ni ... ó
  alternative: ẹnikẹ́ni ... wọn
  rationale: Gíríìkì sọ̀rọ̀ nípa ẹni kan gẹ́gẹ́ bí aṣojú; Yorùbá lè ṣe èyí lọ́nà àdánidá pẹ̀lú ‘ẹnikẹ́ni’ àti ‘ó’ láìsọ akọ tàbí abo di dandan.
translation_notes:
  register: A lo Yorùbá àpéjọ tó bójú mu, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. Ìṣètò ìbéèrè náà jẹ́ àdánidá ní Yorùbá, ṣùgbọ́n ó pa ìbáwí líle inú ìbéèrè Pọ́ọ̀lù mọ́. A gbé àmì [a] sí ‘àwọn aláìṣòdodo’ nítorí ibẹ̀ ni àlàyé rẹ̀ jẹ mọ́, a sì gbé [b] sí ‘àwọn ẹni mímọ́.’
