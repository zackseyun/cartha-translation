  to: Àbí ẹ̀yin kò mọ̀ pé àwọn ènìyàn mímọ́ yóò ṣe ìdájọ́ ayé? Bí a bá sì ṣe ìdájọ́ ayé nípasẹ̀ yín[a], ṣé ẹ̀yin kò tóótun láti ṣe ìdájọ́ àwọn ẹjọ́ tí ó kéré jù lọ[b]?
