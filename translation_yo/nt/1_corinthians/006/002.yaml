id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: yo
  text: Àbí ẹ̀yin kò mọ̀ pé àwọn ènìyàn mímọ́ yóò ṣe ìdájọ́ ayé? Bí a bá sì ṣe ìdájọ́ ayé nípasẹ̀ yín[a], ṣé ẹ̀yin kò tóótun láti ṣe ìdájọ́ àwọn ẹjọ́ tí ó kéré jù lọ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín yín.” Ní ti gangan, gbólóhùn Gíríìkì náà lè túmọ̀ sí “bí a bá ṣe ìdájọ́ ayé láàárín yín,” ṣùgbọ́n nínú àyíká yìí, èrò náà ni pé àwọn ènìyàn mímọ́ yóò kópa nínú ìdájọ́ ayé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ilé ẹjọ́ tí ó kéré jù lọ.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ẹjọ́ tí kò ṣe pàtàkì púpọ̀ tàbí sí ibi tí a ti ń dá ẹjọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó ń tẹ̀ síwájú nínú àríyànjiyàn Pọ́ọ̀lù nípasẹ̀ ìbéèrè àtakò; “Àbí” jẹ́ ọ̀nà àdánidá láti pa ìṣàn ọ̀rọ̀ náà mọ́.
- source_word: οὐκ οἴδατε
  choice: ẹ̀yin kò mọ̀
  rationale: Ó pa ìbéèrè àròjinlẹ̀ Gíríìkì mọ́, ó sì ṣe kedere pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
- source_word: οἱ ἅγιοι
  choice: àwọn ènìyàn mímọ́
  rationale: Ní ọ̀rọ̀ Pọ́ọ̀lù, èyí ń tọ́ka sí àwọn onígbàgbọ́ gẹ́gẹ́ bí ènìyàn tí a yà sọ́tọ̀ fún Ọlọ́run, kì í ṣe ẹgbẹ́ àwọn olókìkí mímọ́ kan ṣoṣo.
- source_word: τὸν κόσμον
  choice: ayé
  rationale: “Ayé” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì lè gba ìtumọ̀ gbòòrò ti κόσμος nínú àyíká ìdájọ́ yìí.
- source_word: κρινοῦσιν
  choice: yóò ṣe ìdájọ́
  rationale: Ó fi iṣẹ́ ìdájọ́ ọjọ́ iwájú hàn láì ṣàlàyé ọ̀nà pàtó tí wọn yóò gbà kópa nínú rẹ̀.
- source_word: ἐν ὑμῖν
  choice: nípasẹ̀ yín
  rationale: Nínú àyíká ìdájọ́, èyí ń sọ pé àwọn onígbàgbọ́ yóò kópa nínú ìdájọ́ ayé; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan “láàárín yín” mọ́.
- source_word: κρίνεται
  choice: a bá ṣe ìdájọ́
  rationale: Ìkọ́lé aláìlórúkọ yìí pa ohùn àìṣe Gíríìkì àti ipò àídájú mọ́ ní Yorùbá àdánidá.
- source_word: ἀνάξιοί ἐστε
  choice: ẹ̀yin kò yẹ
  rationale: Ó pa agbára ìdánilójú àti ìbáwí ọ̀rọ̀ náà mọ́, kì í sì í dín un kù sí àìní òye tàbí agbára nìkan.
- source_word: κριτηρίων ἐλαχίστων
  choice: àwọn ẹjọ́ tí ó kéré jù lọ
  rationale: “Ẹjọ́” bá àyíká àríyànjiyàn láàárín àwọn onígbàgbọ́ mu; àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ mìíràn, “àwọn ilé ẹjọ́ tí ó kéré jù lọ,” wà ní gbangba.
theological_decisions:
- issue: Ta ni “àwọn ènìyàn mímọ́” jẹ́?
  choice: Àwọn onígbàgbọ́, ìyẹn àwọn ènìyàn Ọlọ́run lápapọ̀.
  alternative: Àwọn onígbàgbọ́ díẹ̀ tí wọ́n ní ìwà mímọ́ ju àwọn yòókù lọ.
  rationale: Lílo ọ̀rọ̀ náà lọ́dọ̀ Pọ́ọ̀lù sábà máa ń tọ́ka sí àwọn Kristẹni lápapọ̀, kì í ṣe ẹgbẹ́ àrà ọ̀tọ̀ kan.
- issue: Bí àwọn ènìyàn mímọ́ ṣe máa ṣe ìdájọ́ ayé
  choice: Wọ́n yóò kópa ní ti gidi nínú ìdájọ́ ọjọ́ iwájú, ṣùgbọ́n a kò sọ ọ̀nà pàtó tí èyí yóò gbà ṣẹlẹ̀.
  alternative: Ìfiwéra ìwà rere lásán ni; tàbí wọ́n yóò ní àṣẹ ìdájọ́ olómìnira pátápátá.
  rationale: Ẹsẹ náà sọ kedere pé wọn yóò ṣe ìdájọ́ ayé, ṣùgbọ́n kò ṣàlàyé ìlànà tàbí ìwọ̀n àṣẹ wọn; ìtumọ̀ náà kò fi ẹ̀kọ́ tí kò sí nínú ọ̀rọ̀ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì bá ìbéèrè àtakò líle Pọ́ọ̀lù mu. A lo “ẹ̀yin” láti mú ọ̀pọ̀ ẹni tí Gíríìkì ń tọ́ka sí ṣe kedere.
