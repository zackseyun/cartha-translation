reference: 1 Corinthians 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: yo
  text: “Ohun gbogbo ni a fàyè gba fún mi,”[a] ṣùgbọ́n kì í ṣe gbogbo ohun ni ó ṣàǹfààní.[b] “Ohun gbogbo ni a fàyè gba fún mi,” ṣùgbọ́n èmi kì yóò wà lábẹ́ agbára ohunkóhun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, láìsí àmì ọ̀rọ̀-yọ: Ohun gbogbo ni a fàyè gba fún mi. Ọ̀pọ̀ ló ka gbólóhùn yìí sí ọ̀rọ̀ àwíyé àwọn ará Kọ́ríńtì tí Pọ́ọ̀lù tọ́ka sí, tí ó sì fi ààlà sí i.'
    reason: alternative_reading
  - marker: b
    text: Tàbí “wúlò” tàbí “mú èrè wá” dípò “ṣàǹfààní.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ṣùgbọ́n èmi kì yóò jẹ́ kí ohunkóhun jọba lórí mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Ohun gbogbo
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ọ̀pọ̀ yìí ní ìtumọ̀ tí ó gbòòrò. “Ohun gbogbo” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa àtúnṣe gbólóhùn Gíríìkì mọ́.
- source_word: μοι
  choice: fún mi
  rationale: Pẹ̀lú ἔξεστιν, ọ̀rọ̀ yìí ń tọ́ka sí ẹni tí a fún ní àṣẹ tàbí òmìnira láti ṣe ohun kan; “fún mi” ni èdè Yorùbá àdánidá.
- source_word: ἔξεστιν
  choice: ni a yọ̀ǹda fún mi
  rationale: Ó túmọ̀ sí pé ohun kan bófin mu tàbí pé a fún ẹni ní àṣẹ láti ṣe é. “A yọ̀ǹda fún mi” ṣe kedere sí òǹkàwé òde òní, láìfi ìtumọ̀ òfin tí kò pọndandan kún un.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: ṣùgbọ́n kì í ṣe ohun gbogbo ni ó ṣàǹfààní
  rationale: συμφέρει níbí túmọ̀ sí ohun tí ó wúlò tàbí tí ó mú àǹfààní wá. “Ṣàǹfààní” pa agbára ìdájọ́ yẹn mọ́, ó sì tún “ohun gbogbo” ṣe bí Gíríìkì.
- source_word: οὐκ ἐγὼ
  choice: ṣùgbọ́n èmi kì yóò
  rationale: Èmi tí a sọ ní gbangba nínú Gíríìkì ní ìtẹnumọ́; lílo “èmi” ní Yorùbá fi ìtẹnumọ́ náà hàn.
- source_word: ἐξουσιασθήσομαι
  choice: jẹ́ kí ... jọba lórí mi
  rationale: Ọ̀rọ̀-ìṣe aláìṣe yìí túmọ̀ sí wíwà lábẹ́ àṣẹ tàbí ìṣàkóso ohun kan. Ìtumọ̀ Yorùbá àdánidá “jẹ́ kí ... jọba lórí mi” fi ìṣàkóso hàn ní kedere, bó tilẹ̀ jẹ́ pé ó yí ìṣètò aláìṣe Gíríìkì padà sí gbólóhùn olùṣe.
- source_word: ὑπό τινος
  choice: ohunkóhun
  rationale: τινος lè tọ́ka sí ẹnikẹ́ni tàbí ohunkóhun, ṣùgbọ́n àyíká ọ̀rọ̀ nípa ìṣe àti ìfẹ́kúfẹ̀ẹ́ mú kí “ohunkóhun” bá a mu jù, láìdín ìlànà gbòòrò náà kù.
theological_decisions:
- issue: Bóyá Πάντα μοι ἔξεστιν jẹ́ ọ̀rọ̀ àwíyé àwọn ará Kọ́ríńtì tí Pọ́ọ̀lù ń fa yọ
  choice: 'A fi àmì ọ̀rọ̀-yọ sí gbólóhùn tí a tún sọ náà: “Ohun gbogbo ni a yọ̀ǹda fún mi”'
  alternative: Kí a kọ ọ́ láìsí àmì ọ̀rọ̀-yọ gẹ́gẹ́ bí ọ̀rọ̀ Pọ́ọ̀lù fúnra rẹ̀ tí ó ṣe àlàyé sí i lẹ́yìn náà
  rationale: Ọ̀pọ̀ ló lóye rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ àwíyé àwọn ará Kọ́ríńtì tí Pọ́ọ̀lù ń fa yọ, tí ó sì ń ṣàtúnṣe rẹ̀. Àwọn ìwé Gíríìkì ìgbàanì kò ní àmì ọ̀rọ̀-yọ, nítorí náà ìpinnu ìtumọ̀ ni èyí, kì í ṣe ìyàtọ̀ inú àfọwọ́kọ. Àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Àtúnṣe gbólóhùn méjèèjì pa ìrísí ọ̀rọ̀ àwíyé Gíríìkì mọ́. “Jọba lórí mi” jẹ́ àwòrán tí òǹkàwé òde òní lè lóye, tí ó sì pa ìtumọ̀ àṣẹ inú ἐξουσιασθήσομαι mọ́.
