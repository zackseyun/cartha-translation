source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: yo
  text: Ṣùgbọ́n arákùnrin ń pe arákùnrin lẹ́jọ́[b], àti pé èyí níwájú àwọn aláìgbàgbọ́?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwájú àwọn aláìgbàgbọ́ náà.” Ó ṣeé ṣe kí gbólóhùn yìí tọ́ka sí àwọn ilé ẹjọ́ ìjọba tí àwọn tí kò sí nínú ìjọ ń bójú tó, ṣùgbọ́n Gíríìkì kàn sọ pé “níwájú àwọn aláìgbàgbọ́.”
    reason: lexical_alternative
  - marker: b
    text: Àtúnlò “arákùnrin” ń tọ́ka sí àwọn ọmọ ẹgbẹ́ àwùjọ Kristẹni, ìyẹn àwọn onígbàgbọ́ ẹlẹgbẹ́ ara wọn.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn láàárín ohun tí ó yẹ kí ó ṣẹlẹ̀ nínú ìjọ àti ohun tí ó ń ṣẹlẹ̀ ní ti gidi.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: arákùnrin ... arákùnrin
  rationale: A pa àtúnlò ọ̀rọ̀ ìbátan akọ tó wà nínú Gíríìkì mọ́; ní àyíká yìí, ó ń tọ́ka sí àwọn ọmọ ẹgbẹ́ ìjọ ẹlẹgbẹ́ ara wọn.
- source_word: μετὰ
  choice: ń bá ... lọ sí ilé ẹjọ́
  rationale: Pẹ̀lú κρίνεται, μετά ní ìtumọ̀ ìforígbárí láàárín ẹni méjì nínú ẹjọ́; àkójọpọ̀ yìí jẹ́ èdè Yorùbá àdánidá fún fífi ẹjọ́ ara ẹni lọ sí ilé ẹjọ́.
- source_word: κρίνεται
  choice: ń ... lọ sí ilé ẹjọ́
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ti òfin ní àyíká yìí. Èyí ṣe kedere ju ìtumọ̀ gẹ́gẹ́ bí ‘a ń dá a lẹ́jọ́’ lọ, láì sọ ẹni tí ó bẹ̀rẹ̀ ẹjọ́ ní pàtó.
- source_word: καὶ τοῦτο
  choice: àní ... pàápàá
  rationale: Àkójọpọ̀ yìí mú ìyàlẹ́nu àti ìbáwí Pọ́ọ̀lù jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐπὶ ἀπίστων
  choice: níwájú àwọn aláìgbàgbọ́
  rationale: Ó pa ìtumọ̀ gbòòrò Gíríìkì mọ́ pé ẹjọ́ náà wà níwájú àwọn tí kò gba ìgbàgbọ́, láì fi ‘àwọn adájọ́’ kún un.
theological_decisions:
- issue: Ìtumọ̀ aṣojú ti ἀδελφός nínú ìjọ
  choice: arákùnrin
  alternative: ẹlẹgbẹ́ onígbàgbọ́; arákùnrin tàbí arábìnrin
  rationale: A pa akọ ẹyọ tó wà nínú Gíríìkì àti èdè ìbátan Pọ́ọ̀lù mọ́. Àlàyé ìsàlẹ̀ fi hàn pé ó ń tọ́ka sí àwọn ọmọ ẹgbẹ́ àwùjọ Kristẹni.
- issue: Ìwọ̀n ìtumọ̀ ἀπίστων
  choice: àwọn aláìgbàgbọ́
  alternative: àwọn adájọ́ aláìgbàgbọ́; àwọn tí kò sí nínú ìjọ
  rationale: Èyí pa ìyàtọ̀ láàárín ìjọ àti àwọn tí kò gba ìgbàgbọ́ mọ́, láì dín ọ̀rọ̀ Gíríìkì kù sí àwọn adájọ́ nìkan.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. “Lọ sí ilé ẹjọ́” sọ àyíká òfin jáde ní ti àdánidá; “àní ... pàápàá” sì pa agbára ìbéèrè ìbáwí inú Gíríìkì mọ́.
