  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: yo
  text: 'Tàbí ẹ̀yin kò mọ̀ pé àwọn aláìṣòdodo kì yóò jogún ìjọba Ọlọ́run? Ẹ má ṣe jẹ́ kí a tàn yín jẹ: àwọn tó ń ṣe ìṣekúṣe nípa ìbálòpọ̀, àwọn abọ̀rìṣà, àwọn tí ń ṣe panṣágà, àwọn ọkùnrin rọ̀[a], àti àwọn ọkùnrin tí ń bá ọkùnrin lòpọ̀[b] kì yóò jogún ìjọba Ọlọ́run.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní gangan, “àwọn ọkùnrin rọ̀.” Ọ̀rọ̀ Gíríìkì μαλακοί lè túmọ̀ sí àwọn ọkùnrin tí ìwà wọn dà bí ti obìnrin, àwọn aláìlera ní ìwà, tàbí, nínú àyíká yìí, bóyá àwọn ọkùnrin aṣẹ́wó tàbí àwọn tí wọ́n gba ipa ẹni tí a ń lò nínú ìbálòpọ̀ akọ-sí-akọ.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἀρσενοκοῖται ṣọ̀wọ́n, ìtumọ̀ rẹ̀ sì ń fa àríyànjiyàn. A tún lè túmọ̀ rẹ̀ sí “àwọn ọkùnrin tí ń ṣe ìbálòpọ̀ pẹ̀lú ọkùnrin,” tàbí ní gbòòrò sí i, “àwọn ọkùnrin tí ń ṣe ìbálòpọ̀ tí kò tọ́ pẹ̀lú akọ.” Ọ̀pọ̀ àwọn onímọ̀ so ọ̀rọ̀ náà mọ́ ọ̀nà tí Léfítíkù gbà sọ̀rọ̀ nínú Gíríìkì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Tàbí
  rationale: Ó ń tẹ̀ síwájú nínú àríyànjiyàn Pọ́ọ̀lù pẹ̀lú ìbéèrè àtakò; “Tàbí” pa ìyípadà líle náà mọ́.
- source_word: οὐκ οἴδατε
  choice: ẹ̀yin kò mọ̀
  rationale: Ó pa àgbékalẹ̀ ìbéèrè àsọyé Gíríìkì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἄδικοι
  choice: àwọn aláìṣòdodo
  rationale: Ó ṣàfihàn ẹ̀ka ìwà àti ipò ẹni, kì í ṣe ìṣe búburú kan ṣoṣo.
- source_word: θεοῦ βασιλείαν
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì pa àṣà ọ̀rọ̀ Bíbélì mọ́.
- source_word: κληρονομήσουσιν
  choice: kì yóò jogún
  rationale: “Jogún” pa ìtumọ̀ ogún àti ìretí ọjọ́ iwájú inú ọ̀rọ̀ náà mọ́.
- source_word: μὴ πλανᾶσθε
  choice: Ẹ má ṣe jẹ́ kí a tàn yín jẹ
  rationale: Ìtumọ̀ aláìdásí Yorùbá ni, tí ó pa ìkìlọ̀ lòdì sí fífi èrò èké tan ẹni jẹ mọ́.
- source_word: πόρνοι
  choice: àwọn tó ń ṣe ìṣekúṣe nípa ìbálòpọ̀
  rationale: Ó túmọ̀ ọ̀rọ̀ gbòòrò nípa ìṣekúṣe sí Yorùbá òde òní láì dín un kù sí irú ìṣe kan.
- source_word: εἰδωλολάτραι
  choice: àwọn abọ̀rìṣà
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tó ń sin òrìṣà tàbí ère ni.
- source_word: μοιχοὶ
  choice: àwọn panṣágà
  rationale: Ó tọ́ka ní pàtó sí àwọn tó rú ìdúróṣinṣin ìgbéyàwó nípa ìbálòpọ̀.
- source_word: μαλακοὶ
  choice: àwọn ọkùnrin tí wọ́n ń ṣe bí obìnrin
  rationale: Ó tẹ̀ lé ìtumọ̀ “àwọn ọkùnrin aláṣebí-obìnrin” tó ṣeé ṣe nínú àkójọ yìí, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan “rọ̀” àti àwọn ìtumọ̀ míì tí a ń jiyàn lé lórí hàn.
- source_word: ἀρσενοκοῖται
  choice: àwọn ọkùnrin tí ń bá ọkùnrin lòpọ̀
  rationale: Ìtumọ̀ àpèjúwe ni, kì í ṣe àmì ìdánimọ̀ òde òní; ó bá àkópọ̀ ọ̀rọ̀ náà àti ìsopọ̀ rẹ̀ tí ó ṣeé ṣe pẹ̀lú Léfítíkù mu.
theological_decisions:
- issue: Ìtumọ̀ μαλακοὶ àti ἀρσενοκοῖται nínú àkójọ ìwà búburú
  choice: “àwọn ọkùnrin tí wọ́n ń ṣe bí obìnrin” àti “àwọn ọkùnrin tí ń bá ọkùnrin lòpọ̀,” pẹ̀lú àlàyé méjèèjì
  alternative: 'Fún μαλακοὶ: “àwọn ẹni rọ̀,” “àwọn ọkùnrin aláìlera ní ìwà,” tàbí bóyá “àwọn ọkùnrin aṣẹ́wó.” Fún ἀρσενοκοῖται: “àwọn ọkùnrin tí ń ṣe ìbálòpọ̀ pẹ̀lú ọkùnrin,” tàbí ní gbòòrò “àwọn ọkùnrin tí ń ṣe ìbálòpọ̀ tí kò tọ́ pẹ̀lú akọ.”'
  rationale: Àwọn ọ̀rọ̀ méjèèjì jẹ́ ọ̀rọ̀ tí ìtumọ̀ wọn ń fa àríyànjiyàn. Àkọ́kọ́ lè ní ìtumọ̀ rírẹ̀, ìwà bí obìnrin, àìlera ìwà, tàbí ipa ẹni tí a ń lò nínú ìbálòpọ̀ akọ-sí-akọ; èkejì ṣọ̀wọ́n, bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ń so ó mọ́ ọ̀rọ̀ Léfítíkù nínú Gíríìkì. A kò fi èrò ẹ̀kọ́ ìsìn kan ṣoṣo bo àìdánilójú yìí mọ́lẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé lasán. A tún sọ àsọtẹ́lẹ̀ “kì yóò jogún ìjọba Ọlọ́run” lẹ́yìn àkójọ náà kí ẹsẹ̀ tó dá dúró ní àdánidá ní Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì jẹ́ kí àkójọ náà sinmi lé àsọtẹ́lẹ̀ tó ṣáájú.
