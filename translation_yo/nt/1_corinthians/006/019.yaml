id: 1CO.6.19
reference: 1 Corinthians 6:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: yo
  text: Àbí ẹ̀yin kò mọ̀ pé ara yín jẹ́ tẹ́ńpìlì Ẹ̀mí Mímọ́ tí ó wà nínú yín[a], ẹni tí ẹ ní láti ọ̀dọ̀ Ọlọ́run? Ẹ̀yin kò sì jẹ́ ti ara yín[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tẹ́ńpìlì Ẹ̀mí Mímọ́ nínú yín.”
    reason: lexical_alternative
  - marker: b
    text: Nínú Gíríìkì, ‘ara’ jẹ́ ẹyọ, ṣùgbọ́n ‘yín’ jẹ́ ọ̀pọ̀; a lè lóye rẹ̀ gẹ́gẹ́ bí ara olúkúlùkù wọn tàbí ara kan ní ìtumọ̀ aṣojú.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Àbí
  rationale: Ó mú ìyípadà ọ̀rọ̀ ìbéèrè alágbára tí Pọ́ọ̀lù lò wá, ó sì bá ọ̀rọ̀ tó ṣáájú mu.
- source_word: οὐκ οἴδατε
  choice: ẹ̀yin kò mọ̀ pé
  rationale: Ó pa ìlànà ìbéèrè àsọyé Pọ́ọ̀lù mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὸ σῶμα ὑμῶν
  choice: ara yín
  rationale: ‘Ara’ ni ìtumọ̀ tó ṣe tààrà fún σῶμα; ọ̀rọ̀ náà wà ní ẹyọ ṣùgbọ́n ọ̀rọ̀ arọ́pò olùní jẹ́ ọ̀pọ̀, gẹ́gẹ́ bí Gíríìkì.
- source_word: ναὸς
  choice: tẹ́ńpìlì
  rationale: Ó tọ́ka sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbègbè rẹ̀; ‘tẹ́ńpìlì’ jẹ́ ọ̀rọ̀ tó yé àwọn òǹkàwé òde òní, tí ó sì pa àfiwé ibi mímọ́ mọ́.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: Ẹ̀mí Mímọ́ tí ó wà nínú yín
  rationale: Ó jẹ́ kí àjọṣe gẹnitífù pẹ̀lú ‘tẹ́ńpìlì’ àti gbólóhùn ἐν ὑμῖν hàn ní Yorùbá tó ṣe kedere.
- source_word: οὗ
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò ìbátan náà ń tọ́ka sí Ẹ̀mí Mímọ́; ‘ẹni tí’ pa ìtọ́kasí sí ẹni mọ́ láìfi àlàyé ẹ̀kọ́ míì kún un.
- source_word: ἔχετε ἀπὸ θεοῦ
  choice: ẹ̀yin ní láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa àsìkò ìsinsìnyí ‘ní’ mọ́, kò sì yí i sí ‘gbà’ bí ó tilẹ̀ jẹ́ pé orísun rẹ̀ láti ọ̀dọ̀ Ọlọ́run hàn gbangba.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: Ẹ̀yin kì í sì í ṣe ti ara yín
  rationale: Ó sọ ní ṣókí pé wọn kì í ṣe ohun ìní ara wọn, ó sì mú ìtumọ̀ gẹnitífù arọ́pò ara ẹni jáde ní Yorùbá àdánidá.
theological_decisions:
- issue: Olùtọ́ka ọ̀rọ̀ arọ́pò οὗ àti jíjẹ́ ẹni ti Ẹ̀mí Mímọ́
  choice: A túmọ̀ ọ́ sí ‘ẹni tí,’ tó ń tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni.
  alternative: A lè tún gbólóhùn náà ṣe láìlo ‘ẹni,’ tàbí lo ọ̀rọ̀ arọ́pò ohun.
  rationale: Ọ̀rọ̀ arọ́pò náà ní Gíríìkì ní Ẹ̀mí Mímọ́ gẹ́gẹ́ bí olùtọ́ka rẹ̀. ‘Ẹni tí’ pa ìtọ́kasí yẹn mọ́ láìfikún ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà.
- issue: ‘Ara’ ní ẹyọ pẹ̀lú àwọn olùgbọ́ ní ọ̀pọ̀
  choice: A fi ‘ara yín’ sílẹ̀, tí ‘ara’ jẹ́ ẹyọ, ‘yín’ sì jẹ́ ọ̀pọ̀.
  alternative: ‘Àwọn ara yín’ tàbí ‘ara olúkúlùkù yín.’
  rationale: 'Èyí pa àìdánilójú inú Gíríìkì mọ́: ó lè jẹ́ pínpín sí olúkúlùkù tàbí aṣojú gbogbo wọn. A kò yanju ìfọ̀rọ̀wérọ̀ náà fún òǹkàwé.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, kedere, àti àdánidá fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti mú ọ̀pọ̀ ènìyàn hàn, a sì pa ‘ara’ mọ́ ní ẹyọ. Àmì kọ́mà ìparí ń fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ 20.
