- from: Àbí ẹ̀yin kò mọ̀ pé ara yín jẹ́ tẹ́ńpìlì Ẹ̀mí Mímọ́ tí ó wà nínú yín[a], ẹni tí ẹ̀yin ní láti ọ̀dọ̀ Ọlọ́run? Ẹ̀yin kì í sì í ṣe ti ara yín[b],
  to: Àbí ẹ̀yin kò mọ̀ pé ara yín jẹ́ tẹ́ńpìlì Ẹ̀mí Mímọ́ tí ó wà nínú yín[a], ẹni tí ẹ ní láti ọ̀dọ̀ Ọlọ́run? Ẹ̀yin kò sì jẹ́ ti ara yín[b],
  rationale: The revision makes the final assertion idiomatic and stative in Standard Yorùbá while preserving the source’s concise ownership idiom and verse-continuing comma. Footnote a is revised so that it supplies an actual alternative phrasing for the location clause; footnote b continues to preserve the singular/plural ambiguity.
