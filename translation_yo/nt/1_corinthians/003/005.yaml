id: 1CO.3.5
reference: 1 Corinthians 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: yo
  text: Ǹjẹ́ kí ni Àpólò? Kí sì ni Pọ́ọ̀lù?[a] Àwọn ìránṣẹ́[b] ni wọ́n, nípasẹ̀ wọn ni ẹ gbàgbọ́, gẹ́gẹ́ bí Olúwa ti fún ẹnì kọ̀ọ̀kan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Ǹjẹ́ ta ni Àpólò? Ta sì ni Pọ́ọ̀lù?” Gíríìkì lo “kí ni,” nítorí ó ń tẹnumọ́ ipa wọn ju ẹni tí wọ́n jẹ́ lọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè pè wọ́n ní “àwọn olùṣe iṣẹ́.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí àwọn ìránṣẹ́ tàbí aṣojú tó ń ṣe iṣẹ́; kò fi dandan tọ́ka sí ipò díákónì nínú ìjọ.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì kò sọ ohun tí Olúwa fún ẹnì kọ̀ọ̀kan ní pàtó. Àwọn mìíràn túmọ̀ ọ́ sí, “gẹ́gẹ́ bí Olúwa ti yan iṣẹ́ fún ẹnì kọ̀ọ̀kan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: kí ni
  rationale: Ọ̀rọ̀ ìbéèrè náà túmọ̀ sí “kí ni,” ó sì tẹnumọ́ ipa tàbí ipò Àpólò àti Pọ́ọ̀lù, kì í ṣe ẹni tí wọ́n jẹ́.
- source_word: οὖν
  choice: Ǹjẹ́
  rationale: “Ǹjẹ́” fi ìtumọ̀ ìyọrísí àti ìyípadà ọ̀rọ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: δέ
  choice: sì
  rationale: “Sì” so ìbéèrè kejì mọ́ ti àkọ́kọ́, ó sì fi ìyàtọ̀ kékeré tó wà láàárín wọn hàn.
- source_word: διάκονοι
  choice: àwọn ìránṣẹ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí àwọn tó ń ṣe iṣẹ́ fún ẹlòmíràn, kì í ṣe dandan sí ipò “díákónì” nínú ìjọ.
- source_word: δι’ ὧν
  choice: nípasẹ̀ wọn
  rationale: 'Èyí pa ìtumọ̀ ọ̀nà tàbí aṣojú mọ́: àwọn ìránṣẹ́ náà ni Ọlọ́run lò gẹ́gẹ́ bí ọ̀nà.'
- source_word: ἐπιστεύσατε
  choice: ẹ fi gbàgbọ́
  rationale: Gbólóhùn yìí sọ ìṣe gbígbàgbọ́ wọn ní tààrà, láìfi àlàyé míì kún un.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: gẹ́gẹ́ bí Olúwa ti fi fún ẹnì kọ̀ọ̀kan
  rationale: Yíyan yìí pa àìsọ ohun tí Olúwa fi fún wọn mọ́, bí ó ti rí nínú Gíríìkì, láìfi “iṣẹ́,” “ipa,” tàbí “ẹ̀bùn” kún ọ̀rọ̀ náà.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó yẹ fún κύριος, ó sì pa bí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe wà láìsọ pàtó sí i nínú àyọkà.
theological_decisions:
- issue: Ẹni tí “Olúwa” (κύριος) ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “Olúwa”; ó ṣeé ṣe kó tọ́ka sí Jesu Kristi gẹ́gẹ́ bí ẹni tó pín iṣẹ́ fún àwọn ìránṣẹ́ rẹ̀.
  alternative: Kó jẹ́ ìtọ́ka gbogbogbò sí Ọlọ́run.
  rationale: Àyíká ọ̀rọ̀ Pọ́ọ̀lù lè ṣe àtìlẹ́yìn fún ìtọ́ka sí Kristi, ṣùgbọ́n ìtumọ̀ pàtó yìí kò yẹ kí a fi tipátipá sínú àyọkà.
- issue: Àìpé gírámà nínú “gẹ́gẹ́ bí Olúwa ti fi fún”
  choice: A kò sọ ohun tí Olúwa fi fún wọn ní pàtó.
  alternative: “gẹ́gẹ́ bí Olúwa ti yan iṣẹ́ fún ẹnì kọ̀ọ̀kan” tàbí “gẹ́gẹ́ bí Olúwa ti fún ẹnì kọ̀ọ̀kan ní ipa tirẹ̀.”
  rationale: Gíríìkì kò sọ ohun tí a fi fún wọn; fífi “iṣẹ́,” “ipa,” tàbí “ẹ̀bùn” kún un yóò yanjú ohun tí orísun náà fi sílẹ̀ ní àìmọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó lọ́lá, tó sì ṣeé yé ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. “Nípasẹ̀ wọn ni ẹ fi gbàgbọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìtumọ̀ irinṣẹ́ δι’ ὧν mọ́; gbólóhùn ìkẹyìn sì mọ̀ọ́mọ̀ pa àìsọ ohun tí a fi fún wọn mọ́.
