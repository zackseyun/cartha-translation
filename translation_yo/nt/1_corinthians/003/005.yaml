revisions:
- from: Ǹjẹ́ kí ni Àpólò? Kí sì ni Pọ́ọ̀lù?[a] Àwọn ìránṣẹ́[b] ni wọ́n, nípasẹ̀ wọn ni ẹ fi gbàgbọ́, gẹ́gẹ́ bí Olúwa ti fi fún ẹnì kọ̀ọ̀kan.[c]
  to: Ǹjẹ́ kí ni Àpólò? Kí sì ni Pọ́ọ̀lù?[a] Àwọn ìránṣẹ́[b] ni wọ́n, nípasẹ̀ wọn ni ẹ gbàgbọ́, gẹ́gẹ́ bí Olúwa ti fún ẹnì kọ̀ọ̀kan.[c]
