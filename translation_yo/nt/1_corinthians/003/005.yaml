  - severity: medium
    issue: “Olúwa ti fi fún ẹnì kọ̀ọ̀kan”
    rationale: Ọ̀rọ̀-ìṣe ‘fi fún’ sábà ń béèrè ohun tí a fi fún ẹni náà; níhìn-ín ohun náà kò sí. Yíyọ ‘fi’ kúrò pa ellipsis ti Gíríìkì mọ́ láìfa gírámà Yorùbá tí kò rọrùn.
