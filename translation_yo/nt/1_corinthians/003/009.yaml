source:
  edition: SBLGNT
  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: yo
  text: Nítorí àwa jẹ́ àwọn alábàáṣiṣẹ́ Ọlọ́run; ẹ̀yin ni oko Ọlọ́run, ilé Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwa jẹ́ àwọn tí ń bá Ọlọ́run ṣiṣẹ́; ẹ̀yin ni oko Ọlọ́run, ilé Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa agbára ọ̀rọ̀ àsopọ̀ tí ń ṣàlàyé ohun tí ó ṣáájú mọ́.
- source_word: συνεργοί
  choice: àwọn alábáṣiṣẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn tí ń ṣiṣẹ́ pọ̀, ó sì pa ìtumọ̀ ọ̀pọ̀ nǹkan náà mọ́.
- source_word: θεοῦ (with συνεργοί)
  choice: Ọlọ́run
  rationale: Nínú gbólóhùn ‘àwọn alábáṣiṣẹ́ Ọlọ́run,’ ó ṣeé lóye gẹ́gẹ́ bí àwọn òṣìṣẹ́ tí í ṣe ti Ọlọ́run tàbí tí ń ṣiṣẹ́ fún un; kò fi dandan túmọ̀ sí pé wọ́n wà ní ìpele kan náà pẹ̀lú Ọlọ́run.
- source_word: γεώργιον
  choice: oko
  rationale: ‘Oko’ jẹ́ ọ̀rọ̀ kedere, àdánidá, tí ó sì gbé àpèjúwe iṣẹ́ àgbẹ̀ jáde.
- source_word: οἰκοδομή
  choice: ilé
  rationale: ‘Ilé’ jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn tí ó sì múra ọ̀nà sílẹ̀ fún àpèjúwe iṣẹ́ ìkọ́lé nínú àwọn ẹsẹ tó tẹ̀ lé.
- source_word: ἐστε
  choice: ẹ̀yin ni
  rationale: Ó sọ ẹni kejì ọ̀pọ̀ tí ó hàn gbangba nínú Gíríìkì jáde ní tààrà.
theological_decisions:
- issue: Bóyá θεοῦ συνεργοί túmọ̀ sí ‘àwọn alábáṣiṣẹ́ Ọlọ́run’ tàbí ‘àwọn tí ń bá Ọlọ́run ṣiṣẹ́’
  choice: àwọn alábáṣiṣẹ́ Ọlọ́run
  alternative: àwọn tí ń bá Ọlọ́run ṣiṣẹ́
  rationale: Ìṣọ̀kan ọ̀rọ̀ Gíríìkì náà gba ìjiyàn méjèèjì láyè. Ní àyíká ọ̀rọ̀ yìí, Pọ́ọ̀lù tẹnu mọ́ pé àwọn òjíṣẹ́ jẹ́ ti Ọlọ́run, wọ́n sì ń ṣiṣẹ́ lábẹ́ rẹ̀, nígbà tí àwọn ará Kọ́ríńtì náà jẹ́ ohun ìní Ọlọ́run. Àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó ṣeé yé fún gbogbo ènìyàn; a lo àmì ohùn ní kíkún níbi tí ó bá bá èdè mu. A fi àmì àlàyé [a] sí òpin ẹsẹ náà nítorí pé àlàyé yí padà lórí bí a ṣe lè lóye apá àkọ́kọ́, kì í ṣe lórí ‘oko’ nìkan.
