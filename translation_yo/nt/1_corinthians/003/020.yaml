  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: yo
  text: 'Àti lẹ́ẹ̀kan sí i: “Olúwa mọ̀ pé àwọn èrò àwọn ọlọ́gbọ́n[a] jẹ́ asán.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìrònú.”
    reason: lexical_alternative
  - marker: b
    text: A yọ ọ láti Sáàmù 94:11 (93:11 nínú LXX).
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Àti pẹ̀lú
  rationale: Ó fi ẹsẹ Ìwé Mímọ́ kejì kún àríyànjiyàn náà; ọ̀rọ̀ yìí bá Yorùbá òde òní mu, ó sì ṣe kedere.
- source_word: Κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος nínú àyọlò yìí.
- source_word: γινώσκει
  choice: mọ
  rationale: Ó túmọ̀ ìmọ̀ tààràtà láìfi àlàyé mìíràn kún un.
- source_word: διαλογισμοὺς
  choice: àwọn èrò
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ènìyàn ń rò tàbí ń gbèrò; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ ‘ìrònú oníṣírò’ mọ́.
- source_word: τῶν σοφῶν
  choice: àwọn ọlọ́gbọ́n
  rationale: Ó mú àpèjúwe tí a lò gẹ́gẹ́ bí orúkọ wá sí Yorùbá láìfi akọ tàbí abo kún un.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàfihàn ohun tí Olúwa mọ̀, kì í ṣe ìdí tí ó fi mọ̀ ọ́.
- source_word: μάταιοι
  choice: asán ni wọ́n
  rationale: Ó sọ pé àwọn èrò náà ṣófo, wọn kò sì ní èso tàbí ìwúlò; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí ὅτι ń ṣe nínú gbólóhùn náà
  choice: A túmọ̀ ọ́ sí ‘pé,’ gẹ́gẹ́ bí ohun tí Olúwa mọ̀.
  alternative: ‘nítorí pé,’ gẹ́gẹ́ bí gbólóhùn ìdí.
  rationale: Ìṣọ̀kan gbólóhùn Gíríìkì àti àyọlò Sáàmù fi hàn pé ὅτι ń mú àkóónú ìmọ̀ Olúwa wọlé.
translation_notes:
  register: Yorùbá àpéjọ, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. A pa àkóónú àyọlò náà mọ́, a sì yà àwọn ìtumọ̀ ọ̀rọ̀ míì sí àlàyé ìsàlẹ̀ ojú ewé.
