  rationale: Àtúnṣe náà pa ìtumọ̀ Gíríìkì mọ́ nípa fífi «πάλιν» hàn gẹ́gẹ́ bí «lẹ́ẹ̀kan sí i», àti nípa lílo ìṣètò Yorùbá tí «pé» ń ṣàfihàn ohun tí Olúwa mọ̀. A tún ṣe àtúnṣe àlàyé ọ̀rọ̀ yíyàn kí ó má fi ìtumọ̀ ìṣirò tàbí ìṣirò-ọgbọ́n pàtó kún διαλογισμοί.
