id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: yo
  text: Nítorí ẹ̀yin ṣì jẹ́ ti ara. Nítorí níbi tí owú àti ìjà bá wà láàárín yín, ǹjẹ́ ẹ̀yin kì í ṣe ti ara, tí ẹ sì ń rìn bí ènìyàn[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọ̀nà ènìyàn lásán.”
    reason: Àṣàyàn ìtumọ̀ fún κατὰ ἄνθρωπον; ó fi ìtumọ̀ ‘ènìyàn lásán’ tí àyíká ń fi hàn sí i, láì rọ́pò ìtumọ̀ kedere nínú ọ̀rọ̀ àkọ́kọ́.
lexical_decisions:
- source_word: ἔτι
  choice: ṣì
  rationale: Ó fi hàn pé ipò náà ṣì ń bá a lọ, ó sì mú ìbáwí Pọ́ọ̀lù jáde ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó pa agbára ọ̀rọ̀ ìṣàlàyé mọ́ ní àwọn ibi méjèèjì láì mú ìjiyàn Pọ́ọ̀lù dan jù.
- source_word: σαρκικοί
  choice: jẹ́ ti ara
  rationale: Ó pa àwòrán ọ̀rọ̀ tí ó ní í ṣe pẹ̀lú σάρξ mọ́, dípò fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ bí ‘ẹlẹ́ṣẹ̀’ tàbí ‘ti ayé’ rọ́pò rẹ̀.
- source_word: ὅπου
  choice: níbi tí ... bá wà
  rationale: Ó pa ìtumọ̀ ibi tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ζῆλος
  choice: owú
  rationale: Nínú àyíká búburú yìí, ọ̀rọ̀ náà tọ́ka sí owú, kì í ṣe ìtara rere.
- source_word: ἔρις
  choice: ìjà
  rationale: Ó sọ ìforígbárí àti àìṣọ̀kan ní ọ̀nà kúkúrú tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: οὐχὶ
  choice: ǹjẹ́ ... kì í ṣe
  rationale: Ó pa ìbéèrè àsọyé tí ó ń retí ìdáhùn pé bẹ́ẹ̀ ni mọ́.
- source_word: κατὰ ἄνθρωπον
  choice: bí ènìyàn
  rationale: Ó pa ẹyọ ọ̀rọ̀ ‘ènìyàn’ àti ìṣòro ìtumọ̀ inú gbolohun Gíríìkì mọ́; àlàyé ìtumọ̀ tí ó ṣe kedere sí i wà ní àlàyé ìsàlẹ̀.
- source_word: περιπατεῖτε
  choice: ń rìn
  rationale: Ó pa àwòrán ìrìn gẹ́gẹ́ bí ìwà àti ọ̀nà ìgbésí ayé mọ́ dípò yíyí i sí ‘ń gbé ìgbésí ayé’ nìkan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ tó ní í ṣe pẹ̀lú σάρξ nínú σαρκικοί
  choice: jẹ́ ti ara
  alternative: jẹ́ ti ayé; jẹ́ ẹlẹ́ṣẹ̀; jẹ́ ẹni tí ìwà ẹ̀ṣẹ̀ ń darí
  rationale: ‘Ti ara’ pa ìsopọ̀ pẹ̀lú ‘ara’ mọ́, kò sì fi ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà fúnra rẹ̀ kò sọ kún un. Níhìn-ín, Pọ́ọ̀lù ń bá àwọn onígbàgbọ́ wí nítorí ìwà tí ara ń sàmì sí.
- issue: Bí a ṣe túmọ̀ κατὰ ἄνθρωπον
  choice: bí ènìyàn
  alternative: ní ọ̀nà ènìyàn lásán; ní ìbámu pẹ̀lú ìlànà ènìyàn
  rationale: Ọ̀rọ̀ inú ẹsẹ náà pa ìṣọ̀kan pẹ̀lú Gíríìkì àti àìdánilójú rẹ̀ mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ àdánidá tí ó hàn gbangba sí i hàn láì fi tipátipá yanju ìforígbárí ẹ̀kọ́ inú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ọ̀rọ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún gbogbo ènìyàn. A tún àfihàn [a] sí ibi tí ó bá κατὰ ἄνθρωπον mu, nítorí pé ibẹ̀ ni àlàyé yíyan mìíràn náà ń tọ́ka sí.
