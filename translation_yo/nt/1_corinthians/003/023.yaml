  text: ὑμεῖς δὲ Χριστοῦ, Χριστὸς δὲ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/023.yaml
  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: yo
  text: ẹ̀yin sì jẹ́ ti Mèsáyà[a], Mèsáyà sì jẹ́ ti Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” “Mèsáyà” àti “Kristi” jẹ́ ọ̀nà méjì tí a fi ń pe oyè náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ní ọ̀pọ̀; “ẹ̀yin” fi hàn gbangba pé gbogbo àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ ni ó ń tọ́ka sí.
- source_word: δὲ
  choice: sì
  rationale: “Sì” bá ìtẹ̀síwájú àti ìyàtọ̀ kékeré tí δέ ń mú wá mu, ó sì jẹ́ ọ̀nà àdánidá láti so àwọn gbólóhùn méjèèjì pọ̀ ní Yorùbá.
- source_word: Χριστοῦ / Χριστός
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, a sì tún un lò nínú apá méjèèjì láti pa ìbáradọ́gba ọ̀rọ̀ Gíríìkì mọ́.
- source_word: θεοῦ
  choice: ti Ọlọ́run
  rationale: Àpólà “jẹ́ ti Ọlọ́run” sọ ìní tàbí ìbáṣepọ̀ jíjẹ́-tirẹ̀ jáde ní Yorùbá láì ṣàlàyé irú ìbáṣepọ̀ náà kọjá ohun tí Gíríìkì sọ.
theological_decisions:
- issue: Bí a ṣe lè tú àwọn àkójọpọ̀ oní-genitive méjèèjì, Χριστοῦ àti θεοῦ, láì dín ìtẹ̀lé ìbáṣepọ̀ tí Pọ́ọ̀lù sọ kù.
  choice: ẹ̀yin sì jẹ́ ti Mèsáyà, Mèsáyà sì jẹ́ ti Ọlọ́run
  alternative: ẹ̀yin sì jẹ́ ohun ìní Mèsáyà, Mèsáyà sì jẹ́ ohun ìní Ọlọ́run
  rationale: “Jẹ́ ti” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún jíjẹ́-tirẹ̀, ó sì pa kúkúrú, ìbáradọ́gba, àti ìnira ẹ̀kọ́-ìgbàgbọ́ inú ọ̀rọ̀ Gíríìkì mọ́. A kò lo “ohun ìní,” nítorí ó lè mú kí ìbáṣepọ̀ ẹni dún bí ìní ohun èlò.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. Àpẹẹrẹ “jẹ́ ti” pa ìṣọ̀kan àti àkótán ọ̀rọ̀ orísun mọ́; àmì ohùn ni a lò níbi tó yẹ.
