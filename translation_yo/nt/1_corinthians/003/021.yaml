  source_fidelity: 'Ìtumọ̀ náà ń gbé ìjìnlẹ̀ ẹsẹ̀ Gíríìkì náà kalẹ̀ dáadáa: ὥστε jẹ́ ìfẹ̀yìntì, μηδείς ... καυχάσθω jẹ́ ìdènà gbogbogbò, àti πάντα γὰρ ὑμῶν ἐστιν jẹ́ ìdí fún ìdènà náà. Síbẹ̀, “má ṣe máa fọ́nnu nítorí” yí ìkọ́lé καυχᾶσθαι ἐν sí ìtumọ̀ díẹ̀ tí ó sun mọ́ ‘má ṣe gbéraga nítorí,’ ó sì fi ìṣe àṣà tí ‘máa’ kún un, tí kò hàn ní pàtó nínú Gíríìkì.'
