  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: yo
  text: Nítorí náà, kí ẹnikẹ́ni má ṣe ṣògo nínú àwọn ènìyàn,[a] nítorí gbogbo nǹkan jẹ́ tiyín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní àyíká ọ̀rọ̀ yìí, “àwọn ènìyàn” lè tọ́ka ní pàtó sí àwọn aṣáájú ènìyàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí ó jáde láti inú àríyànjiyàn tó ṣáájú hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: μηδεὶς
  choice: ẹnikẹ́ni má ṣe
  rationale: Ó sọ ìdènà náà di ti gbogbo ènìyàn láìsí àfiwé.
- source_word: καυχάσθω
  choice: kí ... má ṣe máa fọ́nnu
  rationale: Ó pa agbára àṣẹ ìdènà mọ́, ó sì fi ìṣe fífi ara yangàn tàbí gbéraga nítorí ohun kan hàn.
- source_word: ἐν ἀνθρώποις
  choice: nítorí àwọn ènìyàn
  rationale: Nínú àkópọ̀ yìí, ἐν lè tọ́ka sí ìpìlẹ̀ tàbí ohun tí a fi ń fọ́nnu; ‘nítorí’ jẹ́ Yorùbá àdánidá, nígbà tí ‘àwọn ènìyàn’ pa ìtumọ̀ gbogbogbò ἀνθρώποις mọ́.
- source_word: πάντα
  choice: gbogbo nǹkan
  rationale: Ó pa ìwọ̀n gbooro ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó mú ìdí tí a fi fúnni ní ìdènà náà wọlé.
- source_word: ὑμῶν ἐστιν
  choice: jẹ́ tiyín
  rationale: Ó sọ ìní hàn ní ṣókí àti ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá ἀνθρώποις túmọ̀ sí gbogbo ènìyàn tàbí àwọn aṣáájú ènìyàn ní pàtó
  choice: àwọn ènìyàn
  alternative: àwọn aṣáájú ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ jẹ́ gbogbogbò, bí ó tilẹ̀ jẹ́ pé àyíká 1 Kọríńtì 1–3 ń sọ ní pàtó nípa fífi àwọn olùkọ́ tàbí aṣáájú ṣọ́ọ̀ṣì yangàn. A fi ọ̀rọ̀ gbogbogbò sínú ẹsẹ̀, a sì tọ́ka sí ìtumọ̀ àyíká nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
