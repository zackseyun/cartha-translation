id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: yo
  text: yálà Pọ́ọ̀lù, tàbí Ápólò, tàbí Kéfà, tàbí ayé, tàbí ìyè, tàbí ikú, tàbí àwọn ohun tí ó wà nísinsìnyí, tàbí àwọn ohun tí ń bọ̀—gbogbo wọn jẹ́ tiyín,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: yálà … tàbí
  rationale: Àtúnṣe ọ̀rọ̀ yìí fi ìtòlẹ́sẹẹsẹ àwọn ohun tí a ń kà hàn, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘whether … or’ ní Yorùbá.
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Ìkọ̀wé orúkọ Pọ́ọ̀lù tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: Ἀπολλῶς
  choice: Apólò
  rationale: Ìkọ̀wé orúkọ Gíríìkì náà ní ọ̀nà tí ó bá ìró àti ìlò Yorùbá mu.
- source_word: Κηφᾶς
  choice: Kéfà
  rationale: A pa orúkọ Semitic tí ọ̀rọ̀ Gíríìkì lò mọ́, dípò kí a fi Pétérù rọ́pò rẹ̀.
- source_word: κόσμος
  choice: ayé
  rationale: ‘Ayé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè tọ́ka sí gbogbo ilẹ̀-ayé tàbí ètò ayé gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe béèrè.
- source_word: ζωή
  choice: ìyè
  rationale: ‘Ìyè’ jẹ́ ìtumọ̀ tààrà, tí ó sì ní ọlá tó yẹ fún àyíká Bíbélì.
- source_word: θάνατος
  choice: ikú
  rationale: Ìtumọ̀ tààrà àti èyí tí òǹkàwé Yorùbá lóye lẹ́sẹ̀kẹsẹ̀.
- source_word: ἐνεστῶτα
  choice: àwọn ohun tí ó wà nísinsìnyí
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ bí orúkọ fún gbogbo àwọn ohun tàbí ipò tí ó wà lọ́wọ́lọ́wọ́; gbolohun yìí mú ìtumọ̀ náà ṣe kedere.
- source_word: μέλλοντα
  choice: àwọn ohun tí ń bọ̀
  rationale: Ó tọ́ka sí àwọn ohun ọjọ́ iwájú, ó sì bá ‘àwọn ohun tí ó wà nísinsìnyí’ ṣe méjì lọ́nà àdánidá.
- source_word: πάντα
  choice: gbogbo rẹ̀
  rationale: Lẹ́yìn àtòjọ ènìyàn àti ohun, ‘gbogbo rẹ̀’ pa agbára ìkójọpọ̀ ọ̀rọ̀ náà mọ́ láìfi ‘ohun’ mọ́ àwọn ènìyàn.
- source_word: ὑμῶν
  choice: jẹ́ tiyín
  rationale: Genitive náà ń fi ohun-ìní hàn; ‘jẹ́ tiyín’ jẹ́ ọ̀nà Yorùbá tààrà àti àdánidá, tí ó sì fi hàn pé ‘yín’ jẹ́ ọ̀pọ̀ ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ pé gbogbo àwọn ènìyàn àti ohun inú àtòjọ jẹ́ ‘ti’ àwọn onígbàgbọ́
  choice: 'Pa ọ̀rọ̀ ohun-ìní náà mọ́ ní tààrà: ‘gbogbo rẹ̀ jẹ́ tiyín.’'
  alternative: ‘gbogbo rẹ̀ wà fún àǹfààní yín’ tàbí ‘gbogbo rẹ̀ wà lábẹ́ yín.’
  rationale: Ọ̀rọ̀ Gíríìkì sọ ohun-ìní ní ṣókí, kò sì ṣàlàyé irú ìbáṣepọ̀ náà. Ìtumọ̀ náà kò gbọ́dọ̀ yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ní ipò àìṣedéédé orísun.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní ọlá. A pa àtúnṣe ‘tàbí’ mọ́ láti gbé agbára àtòjọ Gíríìkì jáde.
