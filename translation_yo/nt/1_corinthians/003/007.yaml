id: 1CO.3.7
reference: 1 Corinthians 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: yo
  text: Nítorí náà, ẹni tí ń gbìn kì í ṣe nǹkan kan, ẹni tí ń bomi rin náà kì í sì í ṣe nǹkan kan, bí kò ṣe Ọlọ́run tí ń mú ìdàgbàsókè wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘Ọlọ́run tí ń mú kí ohun gbilẹ̀’ tàbí, ní ìtumọ̀ àṣà, ‘Ọlọ́run tí ń fúnni ní ìdàgbàsókè.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tí ó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: ὁ φυτεύων
  choice: ẹni tí ń gbìn
  rationale: Ó pa àkópọ̀ participle náà mọ́, ó sì bá ọ̀rọ̀ nípa ẹni tí ń bomi rin dọ́gba.
- source_word: ἐστίν τι
  choice: kì í ṣe nǹkan kan
  rationale: Ó tẹ̀ lé ìtumọ̀ Gíríìkì pẹ́kípẹ́kí láì túmọ̀ rẹ̀ sí ‘kò ṣe pàtàkì’ lọ́nà tí yóò ṣàlàyé ju orísun lọ.
- source_word: ὁ ποτίζων
  choice: ẹni tí ń bomi rin
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún fífi omi fún ohun ọ̀gbìn, ó sì pa ìbádọ́gba gbólóhùn náà mọ́.
- source_word: ἀλλ’
  choice: bí kò ṣe
  rationale: Ó mú ìyàtọ̀ líle láàárín àwọn òṣìṣẹ́ ènìyàn àti Ọlọ́run jáde.
- source_word: ὁ αὐξάνων
  choice: tí ń mú kí ó dàgbà
  rationale: Ó sọ Ọlọ́run di ẹni tí ń fa ìdàgbàsókè, nígbà tí ‘ó’ fi ohun tí a gbìn sílẹ̀ gẹ́gẹ́ bí ohun tí àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: θεός
  choice: Ọlọ́run
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀, ó sì pa ìtẹnumọ́ orísun mọ́ nínú apá ìyàtọ̀ gbólóhùn náà.
theological_decisions:
- issue: Ìwọ̀n ipa àwọn òṣìṣẹ́ ènìyàn ní ìfiwéra pẹ̀lú iṣẹ́ Ọlọ́run
  choice: Pa ọ̀rọ̀ líle náà mọ́ pé àwọn tó ń gbìn àti tó ń bomi rin ‘kì í ṣe nǹkan kan.’
  alternative: Sọ pé wọn ‘kò ṣe pàtàkì’ tàbí ‘kò níye.’
  rationale: Orísun ń lo gbolohun ἐστίν τι, kì í ṣe ọ̀rọ̀ ìtúmọ̀ tó rọrùn sí i; ìtumọ̀ náà kò gbọ́dọ̀ dín ìtakora tí Pọ́ọ̀lù mọ̀ọ́mọ̀ dá sílẹ̀ kù.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì; a lo ìṣọ̀kan ‘ẹni tí ń …’ láti pa ìbádọ́gba àsọyé Gíríìkì mọ́. Àmì ohùn ni a fi sí ibi tí ó yẹ.
