revisions:
- from: Ní ìbámu pẹ̀lú oore-ọ̀fẹ́ Ọlọ́run tí ó fi fún mi, bí ọ̀gá akọ́lé ọlọ́gbọ́n[a], mo fi ìpìlẹ̀ kan lélẹ̀, ẹlòmíràn sì ń kọ́lé lé e lórí. Ṣùgbọ́n kí olúkúlùkù kíyè sí bí ó ṣe ń kọ́lé.
  to: Ní ìbámu pẹ̀lú oore-ọ̀fẹ́ Ọlọ́run tí a fi fún mi, gẹ́gẹ́ bí ọ̀gá ìkọ́lé ọlọ́gbọ́n[a], mo fi ìpìlẹ̀ kan lélẹ̀, ẹlòmíràn sì ń kọ́lé lé e lórí. Ṣùgbọ́n kí olúkúlùkù kíyè sí bí ó ṣe ń kọ́lé.
