id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: yo
  text: Ní ìbámu pẹ̀lú oore-ọ̀fẹ́ Ọlọ́run tí a fi fún mi, gẹ́gẹ́ bí ọ̀gá ìkọ́lé ọlọ́gbọ́n[a], mo fi ìpìlẹ̀ kan lélẹ̀, ẹlòmíràn sì ń kọ́lé lé e lórí. Ṣùgbọ́n kí olúkúlùkù kíyè sí bí ó ṣe ń kọ́lé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “olùdánilẹ́kọ̀ọ́ ilé” tàbí “olórí oníṣẹ́ ìkọ́lé.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí ó ń darí, tí ó sì ń bójú tó iṣẹ́ ìkọ́lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: Ní ìbámu pẹ̀lú
  rationale: Ó fi hàn pé iṣẹ́ Pọ́ọ̀lù bá oore-ọ̀fẹ́ tí Ọlọ́run fún un mu, kì í ṣe pé oore-ọ̀fẹ́ náà jẹ́ ohun èlò lásán.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ yìí pa ìtumọ̀ ojúrere àti agbára tí Ọlọ́run fi ń mú ènìyàn ṣe iṣẹ́ rẹ̀ mọ́.
- source_word: σοφὸς ἀρχιτέκτων
  choice: ọ̀gá akọ́lé ọlọ́gbọ́n
  rationale: Ní àyíká ìkọ́lé ìgbàanì, ἀρχιτέκτων ni olórí oníṣẹ́ tó ń bójú tó iṣẹ́, kì í ṣe ayàwòrán ilé nìkan; ‘ọlọ́gbọ́n’ sì pa σοφός mọ́.
- source_word: θεμέλιον ἔθηκα
  choice: mo fi ìpìlẹ̀ kan lélẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ìpìlẹ̀ ilé sílẹ̀, ‘kan’ sì bá àìní àtẹ̀jáde pàtó lórí θεμέλιον mu.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: ẹlòmíràn sì ń kọ́lé lé e lórí
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí kíkọ́ sí orí ìpìlẹ̀ tí a ti fi lélẹ̀; arọ́pò-orúkọ ‘e’ ń tọ́ka sí ìpìlẹ̀ náà.
- source_word: ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ
  choice: Ṣùgbọ́n kí olúkúlùkù kíyè sí bí ó ṣe ń kọ́lé
  rationale: ‘Kíyè sí’ sọ ìkìlọ̀ àti ìṣọ́ra tí βλεπέτω ń béèrè; ‘olúkúlùkù’ sì ní agbára aṣojú tí kò fi ọ̀rọ̀ náà mọ́ akọ nìkan.
theological_decisions:
- issue: Agbára aṣojú akọ nínú ἕκαστος àti ọ̀rọ̀-ìṣe ẹyọ kan
  choice: olúkúlùkù ... ó
  alternative: olúkúlùkù ọkùnrin ... ó
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ẹyọ kan, ṣùgbọ́n ó ń tọ́ka sí gbogbo ẹni tó ń kọ́lé, kì í ṣe àwọn ọkùnrin nìkan. ‘Olúkúlùkù ... ó’ pa ẹyọ ọ̀rọ̀ náà àti agbára aṣojú rẹ̀ mọ́.
- issue: Ohun tí ọ̀rọ̀-ìṣe kejì ἐποικοδομεῖ dúró lé lórí
  choice: bí ó ṣe ń kọ́lé
  alternative: bí ó ṣe ń kọ́lé lé e lórí
  rationale: Gíríìkì kò tún ohun tí a ń kọ́lé lé lórí sọ ní gbangba. Yorùbá lè fi í sílẹ̀ nítorí ìpìlẹ̀ náà ti hàn kedere, èyí sì pa ìfọkànsìn mọ́ lórí bí iṣẹ́ náà ṣe rí.
translation_notes:
  register: Yorùbá àwùjọ òde òní tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá, a sì lo àwòrán ìkọ́lé tó ṣe kedere láì fi ẹ̀kọ́ ìjọ kan kun ọ̀rọ̀ náà.
