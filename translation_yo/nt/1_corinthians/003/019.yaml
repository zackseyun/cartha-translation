  to: Nítorí ọgbọ́n ayé yìí jẹ́ ìwà òmùgọ̀ níwájú Ọlọ́run.[a] Nítorí a ti kọ ọ́ pé, “Ó ń mú àwọn ọlọ́gbọ́n nínú ọgbọ́n àrékérekè wọn.”[b]
