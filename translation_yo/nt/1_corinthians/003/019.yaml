id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: yo
  text: Nítorí ọgbọ́n ayé yìí jẹ́ ìwà òmùgọ̀ níwájú Ọlọ́run.[a] Nítorí a ti kọ ọ́ pé, “Ó ń mú àwọn ọlọ́gbọ́n nínú ọgbọ́n àrékérekè wọn.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “pẹ̀lú Ọlọ́run”; ìyẹn ni, ní ojú tàbí ní ìdájọ́ Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nínú àrékérekè wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: ọgbọ́n
  rationale: Ọ̀rọ̀ yìí ni ìtumọ̀ àkọ́kọ́ fún σοφία, ó sì bá ọgbọ́n tí ayé ń fọ́nnu rẹ̀ mu nínú àyíká ọ̀rọ̀ yìí.
- source_word: κόσμου τούτου
  choice: ayé yìí
  rationale: Ó tọ́ka sí ètò ayé ìsinsìnyí tí Pọ́ọ̀lù ń fi wé ìdájọ́ Ọlọ́run.
- source_word: μωρία
  choice: òmùgọ̀
  rationale: Gbólóhùn ‘jẹ́ òmùgọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ohun kan jẹ́ foolishness tàbí folly.
- source_word: παρὰ τῷ θεῷ
  choice: níwájú Ọlọ́run
  rationale: Ó sọ ojú ìwòye tàbí ìdájọ́ Ọlọ́run; ‘níwájú Ọlọ́run’ jẹ́ èdè Yorùbá àdánidá ju títúmọ̀ rẹ̀ ní tààràtà sí ‘pẹ̀lú Ọlọ́run’ lọ.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ó pa ìṣe pípé aláìlórúkọ náà mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún gbólóhùn tó ń ṣáájú àyọlò Ìwé Mímọ́.
- source_word: δρασσόμενος
  choice: ń mú
  rationale: Ó mú èrò gbígbá tàbí dídẹ ẹni mú jáde ní èdè Yorùbá tó rọrùn.
- source_word: σοφοὺς
  choice: àwọn ọlọ́gbọ́n
  rationale: Ó tọ́ka sí àwọn ènìyàn tí a kà sí ọlọ́gbọ́n láìfi akọ tàbí abo kún un.
- source_word: πανουργίᾳ
  choice: ọgbọ́n àrékérekè
  rationale: Àkópọ̀ yìí fi ìtumọ̀ ọgbọ́n ẹ̀tàn tàbí ọgbọ́n búburú tí ọ̀rọ̀ Gíríìkì ní níbí hàn kedere.
theological_decisions:
- issue: Bí a ṣe máa sọ ẹni tí ó ń mú àwọn ọlọ́gbọ́n nínú àyọlò Jóòbù 5:13
  choice: Ó ń mú àwọn ọlọ́gbọ́n nínú ọgbọ́n àrékérekè wọn
  alternative: Ẹni tí ń mú àwọn ọlọ́gbọ́n nínú ọgbọ́n àrékérekè wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ‘Ó’ jẹ́ kí àyọlò náà ṣe kedere ní Yorùbá, Ọlọ́run tí a ṣẹ̀ṣẹ̀ dárúkọ sì ni ó ń tọ́ka sí; kò fi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A tún fi àmì àlàyé [a] mọ́ παρὰ τῷ θεῷ àti [b] mọ́ πανουργίᾳ, kí àlàyé kọ̀ọ̀kan lè bá ibi tó ń ṣàlàyé mu.
