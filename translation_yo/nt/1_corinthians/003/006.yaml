  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: yo
  text: Èmi ni mo gbìn ín, Àpólò sì bomi rin ín, ṣùgbọ́n Ọlọ́run ni ó ń mú un dàgbà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ṣùgbọ́n Ọlọ́run ló fún un ní ìdàgbàsókè.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Èmi ni mo
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a fi hàn gbangba nínú Gíríìkì ní ìtẹnumọ́; “Èmi ni mo” mú ìtẹnumọ́ náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐφύτευσα
  choice: gbìn
  rationale: “Gbìn” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún fífi ohun ọ̀gbìn sílẹ̀, ó sì pa àkàwé iṣẹ́ àgbẹ̀ mọ́.
- source_word: Ἀπολλῶς
  choice: Àpọ́lọ̀
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró rẹ̀ àti ìlànà ìkọ̀wé Yorùbá.
- source_word: ἐπότισεν
  choice: bomi rin ín
  rationale: Gbólóhùn yìí túmọ̀ sí fífi omi bọ ohun tí a gbìn, ó sì jẹ́ èdè Yorùbá tó ṣe déédéé nínú àwòrán iṣẹ́ àgbẹ̀.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ líle hàn láàárín iṣẹ́ àwọn ìránṣẹ́ àti iṣẹ́ Ọlọ́run.
- source_word: ὁ θεὸς
  choice: Ọlọ́run ni ó
  rationale: Ìṣètò “ni ó” tẹnumọ́ Ọlọ́run gẹ́gẹ́ bí ẹni tó ń mú ìdàgbàsókè ṣẹlẹ̀, ní ìbámu pẹ̀lú ìyàtọ̀ inú ọ̀rọ̀ Gíríìkì.
- source_word: ηὔξανεν
  choice: ń mú un dàgbà
  rationale: Àmì “ń” mú ìṣe tó ń bá a lọ nínú àkókò tí a ń sọ̀rọ̀ rẹ̀ hàn, “mú un dàgbà” sì sọ ipa Ọlọ́run ní kedere láìfi àkàwé iṣẹ́ àgbẹ̀ sílẹ̀.
theological_decisions:
- issue: Ipa Ọlọ́run ní ìbáṣepọ̀ pẹ̀lú iṣẹ́ àwọn ìránṣẹ́
  choice: A fi hàn pé Pọ́ọ̀lù gbìn, Àpọ́lọ̀ sì bomi rin ohun tí a gbìn, ṣùgbọ́n Ọlọ́run ni ẹni tó ń mú un dàgbà.
  alternative: “Ọlọ́run ló fún un ní ìdàgbàsókè.”
  rationale: 'Èyí pa ìforígbárí inú ẹsẹ náà mọ́: iṣẹ́ ènìyàn jẹ́ gidi, ṣùgbọ́n Ọlọ́run ni olùṣe tó ń mú ìdàgbàsókè ṣẹlẹ̀. A kò fi ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀ náà.'
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Bomi rin ín” jẹ́ ọ̀rọ̀ àdánidá fún mímú omi dé ohun ọ̀gbìn; “ń mú un dàgbà” sì pa ìṣe tí imperfect Gíríìkì lè tọ́ka sí mọ́.
