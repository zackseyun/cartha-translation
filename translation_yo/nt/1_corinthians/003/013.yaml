id: 1CO.3.13
reference: 1 Corinthians 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: yo
  text: Iṣẹ́ ẹni kọ̀ọ̀kan yóò hàn gbangba, nítorí Ọjọ́ náà[b] yóò fi í hàn; nítorí a ó ṣí Ọjọ́ náà payá nínú iná[a], iná náà fúnra rẹ̀ yóò sì dán irú iṣẹ́ ẹni kọ̀ọ̀kan wò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “nípasẹ̀ iná.” Gbólóhùn Gíríìkì ἐν πυρί lè túmọ̀ sí “nínú iná” tàbí pé iná jẹ́ ohun èlò ìṣípayá.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “Ọjọ́ náà” tọ́ka sí ọjọ́ ọjọ́ iwájú tí Ọlọ́run yóò ṣe àyẹ̀wò tàbí ìdájọ́.
    reason: cross_reference
lexical_decisions:
- source_word: ἑκάστου
  choice: ẹni kọ̀ọ̀kan
  rationale: Ó pa agbára ìtumọ̀ pínpín mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi akọ tàbí abo kún un.
- source_word: τὸ ἔργον
  choice: iṣẹ́
  rationale: “Iṣẹ́” gbòòrò tó láti tọ́ka sí ohun tí olúkúlùkù kọ́ tàbí ṣe nínú iṣẹ́ ìránṣẹ́ rẹ̀, bí àyíká ọ̀rọ̀ ṣe ń béèrè.
- source_word: φανερὸν γενήσεται
  choice: yóò hàn gbangba
  rationale: Ó sọ àbájáde ọjọ́ iwájú náà ní Yorùbá tó ṣe kedere, láìfi ìtumọ̀ míì kún un.
- source_word: ἡ ἡμέρα
  choice: Ọjọ́ náà
  rationale: Ọ̀rọ̀ atọ́ka náà àti àyíká fi hàn pé ọjọ́ pàtó kan ni; lílo lẹ́tà ńlá ń tọ́ka sí Ọjọ́ ìṣàyẹ̀wò Ọlọ́run.
- source_word: δηλώσει
  choice: yóò fi í hàn
  rationale: Ó mú ìṣe fífi ohun tó fara sin hàn jáde, ó sì yàtọ̀ díẹ̀ sí “ṣí payá” tí a lò fún ἀποκαλύπτεται.
- source_word: ἐν πυρὶ
  choice: nínú iná
  rationale: Ó tẹ̀ lé ìtumọ̀ ibi tí ọ̀rọ̀ ìṣáájú ἐν lè ní, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ irinṣẹ́ “nípasẹ̀ iná” sílẹ̀.
- source_word: ἀποκαλύπτεται
  choice: a ń ṣí i payá
  rationale: Ó pa ohùn àìsọ ẹni tó ṣe ìṣe náà àti ìtumọ̀ ìṣípayá mọ́.
- source_word: ὁποῖόν ἐστιν
  choice: irú iṣẹ́
  rationale: Ó dojú kọ irú tàbí ànímọ́ iṣẹ́ náà, gẹ́gẹ́ bí Gíríìkì ṣe rí.
- source_word: δοκιμάσει
  choice: yóò dán … wò
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí ṣíṣe àyẹ̀wò láti mọ irú tàbí ìdánilójú ohun kan.
- source_word: αὐτὸ
  choice: fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ mọ́ pé iná náà gan-an ni yóò ṣe àyẹ̀wò náà.
theological_decisions:
- issue: Bóyá ἡ ἡμέρα túmọ̀ sí ọjọ́ lásán tàbí Ọjọ́ ìṣàyẹ̀wò/ìdájọ́ ọjọ́ iwájú.
  choice: Ọjọ́ náà
  alternative: ọjọ́ náà
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ọjọ́ ọjọ́ iwájú tí Ọlọ́run yóò fi iṣẹ́ olúkúlùkù hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ ni ó sọ ìtumọ̀ yìí ní kíkún kí a má bàa fi ọ̀rọ̀ míì kún ẹsẹ náà.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn kíkún, ní ọ̀nà tó lọ́lá ṣùgbọ́n tó ṣeé lóye. “Ẹni kọ̀ọ̀kan,” “hàn gbangba,” àti “dán … wò” jẹ́ àwọn gbólóhùn àdánidá fún òǹkàwé òde òní. A gbé àmì àlàyé [a] sí “nínú iná” àti [b] sí “Ọjọ́ náà” kí àmì kọ̀ọ̀kan bá àlàyé tirẹ̀ mu.
