id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: yo
  text: Nítorí kò sí ẹnikẹ́ni tí ó lè fi ìpìlẹ̀ mìíràn lélẹ̀ yàtọ̀ sí èyí tí a ti fi lélẹ̀, èyí tí í ṣe Jésù Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi.”'
    reason: Àṣàyàn ìtumọ̀ mìíràn fún Ἰησοῦς Χριστός tí ó wọ́pọ̀ nínú Yorùbá.
lexical_decisions:
- source_word: θεμέλιον
  choice: ìpìlẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìpìlẹ̀ ilé nínú àkàwé iṣẹ́ ìkọ́lé Pọ́ọ̀lù; “ìpìlẹ̀” ni ọ̀rọ̀ Yorùbá tó ṣe déédé jù lọ.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé rẹ̀.
- source_word: ἄλλον
  choice: mìíràn
  rationale: Ó fi hàn pé ìpìlẹ̀ kejì tàbí ìpìlẹ̀ ọ̀tọ̀ ni a ń sọ̀rọ̀ nípa rẹ̀.
- source_word: οὐδεὶς
  choice: kò sí ẹnikẹ́ni
  rationale: Ó pa gbogbo ènìyàn mọ́ra, ó sì jẹ́ gbólóhùn Yorùbá àdánidá fún “no one.”
- source_word: δύναται
  choice: lè
  rationale: Ó sọ agbára tàbí ohun tí ó ṣeé ṣe ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: θεῖναι
  choice: fi … lélẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ fífi ìpìlẹ̀ ilé lélẹ̀.
- source_word: παρὰ
  choice: yàtọ̀ sí
  rationale: 'Nínú àyíká yìí, ó ní agbára ìyọkúrò: kò sí ìpìlẹ̀ mìíràn lẹ́yìn tàbí lẹ́gbẹ̀ẹ́ èyí tó ti wà.'
- source_word: τὸν κείμενον
  choice: èyí tí a ti fi lélẹ̀
  rationale: Ó mú ipò ìpìlẹ̀ tí ó ti wà níbẹ̀ tẹ́lẹ̀ jáde; lílo “a” jẹ́ ọ̀nà Yorùbá àdánidá láti fi aṣiṣe ẹni tó ṣe é sílẹ̀ láìdárúkọ rẹ̀.
- source_word: ὅς ἐστιν
  choice: èyí tí í ṣe
  rationale: Ó pa ìdánimọ̀ ìpìlẹ̀ náà mọ́, láìfi àlàyé míì kún un.
- source_word: Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  rationale: “Jésù” ni orúkọ náà, “Mèsáyà” sì mú agbára oyè Χριστός hàn dípò kí a ṣe bí ẹni pé ó jẹ́ orúkọ ìdílé.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Χριστός ní agbára oyè ẹni tí a fòróró yàn; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́. “Jésù Kristi,” tí ó ti wọ́pọ̀ nínú èdè ìjọ, wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn míì.
- issue: Ìdánimọ̀ ìpìlẹ̀ náà
  choice: èyí tí í ṣe Jésù Mèsáyà
  alternative: ìpìlẹ̀ náà ni Jésù Mèsáyà
  rationale: Àṣàyàn náà tẹ̀ lé gírámà ọ̀rọ̀ Gíríìkì, tí ọ̀rọ̀ arọ́pò-orúkọ rẹ̀ ń tọ́ka padà sí “ìpìlẹ̀,” ó sì pa ìdánimọ̀ Kristi gẹ́gẹ́ bí ìpìlẹ̀ kan ṣoṣo mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé lásán. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; àwòrán ìkọ́lé inú ọ̀rọ̀ Gíríìkì sì wà nípamọ́ nípasẹ̀ “ìpìlẹ̀” àti “fi … lélẹ̀.”
