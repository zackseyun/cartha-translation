  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbò: iṣẹ́ ni a ń jóná run, ẹni náà sì ni a ó gbà là. Síbẹ̀, “yóò pàdánù” lè túmọ̀ sí pé ẹni náà fúnra rẹ̀ ni yóò ṣègbé, níbi tí ζημιωθήσεται ti ń sọ pé yóò jìyà àdánù. Pẹ̀lú, “bí ẹni pé” fi ìmọ̀ ‘bí ó tilẹ̀ jẹ́ pé’/‘as if’ kún àwòrán ὡς tí kò hàn nínú Gíríìkì.'
