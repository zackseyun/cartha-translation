  rationale: Àtúnṣe náà jẹ́ kí ζημιωθήσεται hàn kedere gẹ́gẹ́ bí jíjìyà àdánù, kì í ṣe pé ẹni náà fúnra rẹ̀ ni yóò ṣègbé. Ó tún mú ìfiwéra ὡς διὰ πυρός sún mọ́ Gíríìkì, nípa pípa àwòrán ìkọjá inú iná mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn tàbí ìtumọ̀ ìwẹ̀nùmọ́ kún un. Àmì akọsílẹ̀ [a] àti àwọn àṣàyàn rẹ̀ ti wà ní ipò tó yẹ.
