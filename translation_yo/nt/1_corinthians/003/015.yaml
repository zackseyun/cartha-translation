source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: yo
  text: Bí iṣẹ́ ẹnikẹ́ni bá jóná pátápátá, yóò jìyà àdánù; ṣùgbọ́n òun fúnra rẹ̀ ni a ó gbà là—síbẹ̀, bí ẹni tí ó gba inú iná kọjá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n kìkì bí ẹni tí ó gba inú iná kọjá,” tàbí, “ṣùgbọ́n bí ẹni tí ó sá la inú iná jáde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Bí ... ẹnikẹ́ni bá
  rationale: Èyí fi ipò àídájú àti ìtumọ̀ ẹni àìsọ pàtó hàn ní Yorùbá àdánidá.
- source_word: τὸ ἔργον
  choice: iṣẹ́
  rationale: “Iṣẹ́” mú ìtumọ̀ gbòòrò ἔργον dúró, ó sì bá àyíká iṣẹ́ ìkọ́lé àti iṣẹ́ ìránṣẹ́ mu.
- source_word: κατακαήσεται
  choice: jóná pátápátá
  rationale: Ọ̀rọ̀ náà tọ́ka sí jíjóná títí dé ìparun; “pátápátá” mú agbára ọ̀rọ̀ ìpilẹ̀ṣẹ̀ jáde.
- source_word: ζημιωθήσεται
  choice: yóò pàdánù
  rationale: Èyí sọ pé ẹni náà yóò ní àdánù láìfi kún un pé èrè pàtó ni yóò pàdánù tàbí pé a ó jẹ ẹ́ níyà.
- source_word: αὐτὸς δὲ
  choice: ṣùgbọ́n òun fúnra rẹ̀
  rationale: “Òun fúnra rẹ̀” pa ìtẹnumọ́ àti ìyàtọ̀ láàárín iṣẹ́ tí ó ṣègbé àti ẹni náà mọ́.
- source_word: σωθήσεται
  choice: ni a ó gbà là
  rationale: “Gbà là” jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbàlà tàbí ìdálà, ó sì pa ìwúwo ọ̀rọ̀ Páùlù mọ́.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: síbẹ̀, bí ẹni pé ó la inú iná kọjá
  rationale: Èyí pa àwòrán ẹni tí ó gba inú iná kọjá mọ́, láìsọ bóyá iná náà jẹ́ ìwẹ̀nùmọ́ tàbí àwòrán àsálà kíkángun.
theological_decisions:
- issue: Bóyá gbólóhùn ìkẹyìn yẹ kí ó ṣètìlẹ́yìn fún ẹ̀kọ́ ìsìn kan nípa iná ìwẹ̀nùmọ́ tàbí àsálà kíkángun.
  choice: A túmọ̀ rẹ̀ sí “síbẹ̀, bí ẹni pé ó la inú iná kọjá,” kí àwòrán àti àìdánilójú rẹ̀ lè dúró.
  alternative: “ṣùgbọ́n kìkì bí ẹni tí ó sá la inú iná jáde” tàbí “ṣùgbọ́n nípasẹ̀ iná ìwẹ̀nùmọ́.”
  rationale: Gíríìkì kò ṣàlàyé irú iná náà ní kíkún; nítorí náà, ìtumọ̀ kò gbọdọ̀ fi ẹ̀kọ́ ẹ̀ya ìsìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní tí ó ṣe kedere fún òǹkàwé gbogbogbò. A lo “jóná pátápátá” láti fi ìparun hàn, a sì pa àwòrán iná náà mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
