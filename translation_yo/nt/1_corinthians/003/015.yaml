  terminology: “Iṣẹ́,” “jóná pátápátá,” àti “ni a ó gbà là” jẹ́ àwọn yíyan tó dára. “Gbà là” pa ìtumọ̀ σωθήσεται mọ́ láìdì mọ́ ìtumọ̀ ẹ̀kọ́ ìsìn kan. A pa àwòrán ‘nípasẹ̀/inú iná’ mọ́, láìsọ pé iná ìwẹ̀nùmọ́ ni tàbí pé àsálà kíkángun nìkan ni.
