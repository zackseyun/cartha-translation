  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé èdè Gíríìkì dáadáa: ìdènà náà, ìtọ́kasí ẹni náà sí ara rẹ̀, ìdájọ́ ara ẹni pé ọlọ́gbọ́n ni òun, àṣẹ pé kí ó di μωρός, àti gbólóhùn ète ἵνα ni a pa mọ́. Síbẹ̀, “ní ayé ìsinsìnyí” lè gbọ́ gẹ́gẹ́ bí ibi/ayé lọwọlọwọ ju ìtumọ̀ αἰών—ìgbà-ayé tàbí àkókò-ètò yìí—lọ. “Ní ìgbà ayé yìí” mú ìyàtọ̀ náà hàn kedere síi.'
