id: 1CO.3.18
reference: 1 Corinthians 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: yo
  text: Kí ẹnikẹ́ni má ṣe tan ara rẹ̀ jẹ. Bí ẹnikẹ́ni nínú yín bá rò pé òun jẹ́ ọlọ́gbọ́n ní ìgbà ayé yìí[a], kí ó di òmùgọ̀[b], kí ó lè di ọlọ́gbọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ayé yìí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ó di aláìgbọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Kí ẹnikẹ́ni má ṣe tan ara rẹ̀ jẹ
  rationale: Ó pa àṣẹ ìdènà àti ohun arọ́pò-orúkọ afẹ̀hìntì mọ́ ní ọ̀nà tí ó bá èdè Yorùbá mu.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: bá rò pé òun jẹ́ ọlọ́gbọ́n
  rationale: “Rò pé” fi ìwòye ẹni nípa ara rẹ̀ hàn; “òun” sì jẹ́ kí ìtọ́kasí sí ẹni náà ṣe kedere.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí ẹni kan láàárín àwùjọ àwọn olùgbọ́.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: ní ayé ìsinsìnyí
  rationale: Ó mú ìtumọ̀ àkókò ti αἰών jáde, ìyẹn ìgbà tàbí ètò ayé tí ó wà nísinsìnyí, láì sọ ọ́ di “ilẹ̀ ayé” lásán.
- source_word: μωρὸς γενέσθω
  choice: kí ó di òmùgọ̀
  rationale: Ó pa ìtumọ̀ “di” àti àfiwé alátakò tí Paulu lò mọ́; ọ̀rọ̀-orúkọ “òmùgọ̀” tún jẹ́ àṣàyàn gidi fún ajẹtífù Gíríìkì náà.
- source_word: ἵνα γένηται σοφός
  choice: kí ó lè di ọlọ́gbọ́n
  rationale: Ó pa gbólóhùn ète ἵνα àti ìyípadà láti inú òmùgọ̀ sí ọlọ́gbọ́n mọ́.
theological_decisions:
- issue: Ìtumọ̀ αἰών nínú ìyàtọ̀ tí Paulu ń ṣe
  choice: ní ayé ìsinsìnyí
  alternative: ní ayé yìí; ní ìbámu pẹ̀lú ìlànà ọgbọ́n ayé ìsinsìnyí
  rationale: Àṣàyàn náà pa ìtumọ̀ ìgbà-ayé tó wà nísinsìnyí mọ́, ní ìyàtọ̀ sí ọgbọ́n Ọlọ́run, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ jẹ́wọ́ pé ó tún lè tọ́ka sí ìlànà ìdájọ́ ayé náà.
- issue: Àtakò láàárín òmùgọ̀ àti ọlọ́gbọ́n
  choice: kí ó di òmùgọ̀ ... kí ó lè di ọlọ́gbọ́n
  alternative: kí ó di aláìgbọ́n ... kí ó lè ní ọgbọ́n
  rationale: Èyí pa líle àti ìfarakanra àtakò Gíríìkì mọ́, láì tú ìtumọ̀ rẹ̀ sí ẹ̀kọ́ ẹ̀sìn kan pàtó.
- issue: Ìtọ́kasí akọ ẹyọ kan pẹ̀lú agbára aṣojú
  choice: ẹnikẹ́ni ... ara rẹ̀ ... òun ... ó
  alternative: àwọn ènìyàn ... ara wọn ... wọ́n
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú àwọn arọ́pò-orúkọ wọ̀nyí; ẹyọ “ẹnikẹ́ni” pa ìṣètò aṣojú àti agbára gbogbo ènìyàn ti Gíríìkì mọ́ láì fi akọ tàbí abo kún un.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àwọn àmì àkọsílẹ̀ [a] àti [b] wà lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
