revisions:
- from: Ṣé ẹ̀yin kò mọ̀ pé ẹ̀yin ni tẹ́ńpìlì Ọlọ́run[a][b], àti pé Ẹ̀mí Ọlọ́run ń gbé inú yín[c]?
  to: Ṣé ẹ kò mọ̀ pé ẹ jẹ́ tẹ́ńpìlì Ọlọ́run[a][b], àti pé Ẹ̀mí Ọlọ́run ń gbé nínú yín[c]?
  rationale: The revised wording is more idiomatic in modern Standard Yoruba and avoids introducing emphasis not explicit in the Greek. It preserves the singular “temple,” the plural address, and the deliberately open sense of ἐν ὑμῖν. The community footnote is made neutral so that it explains the plural grammar without adding a designation absent from the verse itself.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question, the singular temple image, the plural addressees, and the continuing dwelling of God’s Spirit. The revision retains the source’s corporate plural without adding an explicit collective adverb.
  naturalness: The repeated emphatic pronoun “ẹ̀yin” is more marked than the Greek and less idiomatic than ordinary plural Yoruba verbal forms. “Ṣé ẹ kò mọ̀ pé ẹ jẹ́…” is natural, clear, and still unambiguously plural. “Nínú yín” is the standard smooth form here.
  terminology: “Tẹ́ńpìlì Ọlọ́run” is an understandable modern rendering of ναὸς θεοῦ, with “ibi mímọ́ Ọlọ́run” appropriately supplied as a lexical alternative. “Ẹ̀mí Ọlọ́run” suitably renders τὸ πνεῦμα τοῦ θεοῦ.
  issues:
  - severity: low
    issue: Marked repetition of “ẹ̀yin” in the main text
    rationale: Greek plural morphology does not itself require emphatic repetition. Replacing it with the ordinary plural forms “ẹ” improves Yoruba flow while preserving the plural address.
  - severity: low
    issue: Footnote b identifies the addressees as “àwọn onígbàgbọ́”
    rationale: The verse itself marks a plural community but does not use a term equivalent to “believers.” A neutral reference to the addressed community more closely reflects the wording while retaining the contextual corporate note.
