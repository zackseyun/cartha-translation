id: 1CO.3.16
reference: 1 Corinthians 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: yo
  text: Ṣé ẹ kò mọ̀ pé ẹ jẹ́ tẹ́ńpìlì Ọlọ́run[a][b], àti pé Ẹ̀mí Ọlọ́run ń gbé nínú yín[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ibi mímọ́ Ọlọ́run.’
    reason: lexical_alternative
  - marker: b
    text: ‘Ẹ’ jẹ́ ọ̀pọ̀; Pọ́ọ̀lù ń bá àwùjọ náà sọ̀rọ̀ lápapọ̀.
    reason: cultural_note
  - marker: c
    text: Tàbí, ‘láàárín yín.’
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Ṣé ẹ̀yin kò mọ̀
  rationale: Ó pa agbára ìbéèrè àsọ̀rọ̀ Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere.
- source_word: ναὸς θεοῦ
  choice: tẹ́ńpìlì Ọlọ́run
  rationale: ναός ń tọ́ka sí ibi mímọ́ inú tẹ́ńpìlì, kì í ṣe gbogbo àgbègbè tẹ́ńpìlì; ‘tẹ́ńpìlì Ọlọ́run’ pa àwòrán ibi mímọ́ náà mọ́ ní èdè tí gbogbo ènìyàn lè lóye.
- source_word: ἐστε
  choice: ẹ̀yin ni
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ẹni kejì ọ̀pọ̀; fífi ‘ẹ̀yin’ hàn dájú pé a ń bá gbogbo àwùjọ náà sọ̀rọ̀.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Ẹ̀mí Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbátan genitive náà hàn, láì pàdánù ìtumọ̀ ‘Ẹ̀mí ti Ọlọ́run.’
- source_word: οἰκεῖ
  choice: ń gbé
  rationale: Ó fi ìṣe tí ó ń bá a lọ hàn, ó sì bá àwòrán tẹ́ńpìlì gẹ́gẹ́ bí ibùgbé mu.
- source_word: ἐν ὑμῖν
  choice: inú yín
  rationale: Ó tẹ̀ lé ìtumọ̀ ‘nínú yín,’ ṣùgbọ́n nítorí ‘yín’ jẹ́ ọ̀pọ̀, ọ̀rọ̀ náà ṣì lè ní agbára àwùjọ; àlàyé ìsàlẹ̀ fi ọ̀nà ‘láàárín yín’ hàn.
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà ń sọ̀rọ̀ nípa onígbàgbọ́ kọ̀ọ̀kan tàbí nípa ìjọ gẹ́gẹ́ bí àwùjọ
  choice: A lo ‘ẹ̀yin’ àti ‘yín’ ní ọ̀pọ̀, láì fi ‘kọ̀ọ̀kan’ tàbí ‘papọ̀’ kún un.
  alternative: ‘Ẹ̀yin papọ̀ ni tẹ́ńpìlì Ọlọ́run’ tàbí ‘olúkúlùkù yín ni tẹ́ńpìlì Ọlọ́run.’
  rationale: Gíríìkì ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀, ìṣàkóso ọ̀rọ̀ sì fi agbára àwùjọ hàn; síbẹ̀, kò sí ọ̀rọ̀ pàtó bí ‘papọ̀.’ Ìtumọ̀ yìí pa àìdánilójú àti ìfọkànsìn ẹ̀kọ́ ìgbàgbọ́ inú orísun mọ́.
translation_notes:
  register: Yorùbá ìṣàkóso òde òní, tó ní iyì, tó sì rọrùn fún gbogbo ènìyàn. A lo ‘Ṣé’ fún ìbéèrè àsọ̀rọ̀ tí ó jẹ́ àdánidá, ‘ẹ̀yin/yín’ láti mú ọ̀pọ̀ Gíríìkì hàn, àti ‘ń gbé’ láti fi ìgbé tí ó ń bá a lọ hàn. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
