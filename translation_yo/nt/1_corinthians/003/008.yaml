id: 1CO.3.8
reference: 1 Corinthians 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: yo
  text: Ẹni tí ń gbìn àti ẹni tí ń bomi rin jẹ́ ọ̀kan[a], olúkúlùkù yóò sì gba ẹ̀san tirẹ̀ gẹ́gẹ́ bí iṣẹ́ àṣekára tirẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wà ní ìṣọ̀kan,” tàbí “ní ète kan náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: ẹni tí ń gbìn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́gbẹ́ tí ó ní àmì ìtọ́kasí ni Gíríìkì; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán iṣẹ́ àgbẹ̀ mọ́.
- source_word: ποτίζων
  choice: ẹni tí ń bomi rin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi omi fún ohun ọ̀gbìn, ó sì bá àfiwé iṣẹ́ àgbẹ̀ mu.
- source_word: ἕν
  choice: jẹ́ ọ̀kan
  rationale: Ó pa ìsọ̀rọ̀ Gíríìkì tí ó ṣókí mọ́, láìsọ àwọn òṣìṣẹ́ méjèèjì di ẹni kan náà; àlàyé ìsàlẹ̀ fi ìtumọ̀ ìṣọ̀kan hàn.
- source_word: ἕκαστος
  choice: olúkúlùkù wọn
  rationale: Ó tẹnumọ́ pé ẹnì kọ̀ọ̀kan ni a óò dá lẹ́jọ́ iṣẹ́ tirẹ̀, nígbà tí “wọn” ń tọ́ka sí àwọn òṣìṣẹ́ méjèèjì.
- source_word: μισθὸν
  choice: èrè
  rationale: “Èrè” lè túmọ̀ sí ohun tí a san tàbí ìsanpadà fún iṣẹ́, láìfi ìtumọ̀ náà mọ́ owó iṣẹ́ nìkan.
- source_word: λήμψεται
  choice: yóò gba
  rationale: Ó ṣe àfihàn ọ̀rọ̀ ọjọ́ iwájú Gíríìkì ní Yorùbá tí ó ṣe kedere.
- source_word: κατὰ
  choice: gẹ́gẹ́ bí
  rationale: Nínú àyíká yìí, ó fi hàn pé èrè náà bá iṣẹ́ àṣekára ẹni kọ̀ọ̀kan mu.
- source_word: κόπον
  choice: iṣẹ́ àṣekára
  rationale: Ó mú ìtumọ̀ iṣẹ́ tí ó ní làálàá àti ìsapá jáde ju “iṣẹ́” lásán lọ.
- source_word: ἴδιον
  choice: tirẹ̀
  rationale: Àtúnwí rẹ̀ pa ìtẹnumọ́ Gíríìkì mọ́ pé iṣẹ́ àti èrè jẹ́ ti ẹnì kọ̀ọ̀kan.
theological_decisions:
- issue: Ìtumọ̀ ἕν εἰσιν (“jẹ́ ọ̀kan”)
  choice: Àwọn méjèèjì wà ní ìṣọ̀kan nínú ète àti iṣẹ́ wọn lábẹ́ Ọlọ́run, ṣùgbọ́n ipa wọn kò dàpọ̀.
  alternative: Wọ́n dọ́gba ní ipò nìkan, tàbí wọ́n kàn jẹ́ ẹgbẹ́ kan láìsí ìtẹnumọ́ ète kan náà.
  rationale: ἕν jẹ́ ọ̀rọ̀ akọ́ tàbí abo kì í ṣe, ó sì tọ́ka sí ìṣọ̀kan dípò pé àwọn méjèèjì jẹ́ ẹni kan náà. Àyíká náà tako ìpín ẹgbẹ́, ó sì fi àwọn ipa iṣẹ́ ìránṣẹ́ tí ó yàtọ̀ síra sábẹ́ iṣẹ́ Ọlọ́run kan náà.
translation_notes:
  register: Yorùbá boṣewa, tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “bomi rin” láti pa àwòrán iṣẹ́ àgbẹ̀ mọ́, àti “iṣẹ́ àṣekára” láti mú agbára κόπος jáde. Gbogbo àmì ohùn ni a lò níbi tí ó bá ṣe àdánidá.
