  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: yo
  text: Bí ẹnikẹ́ni sì bá fi wúrà, fàdákà, òkúta iyebíye, igi, koríko gbígbẹ, pòròpórò kọ́lé sórí ìpìlẹ̀ náà,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ
  choice: Ṣùgbọ́n bí
  rationale: δέ ń tẹ̀síwájú nínú àríyànjiyàn pẹ̀lú ìyípadà díẹ̀, εἰ sì mú gbólóhùn oní条件 wọlé; ‘Ṣùgbọ́n bí’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa méjèèjì mọ́.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó pa ìtumọ̀ aláìlẹ́ni-kan pàtó àti ti gbogbogbò mọ́.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: kọ́lé lé orí ìpìlẹ̀ náà
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkọ́ ohun kan sórí ìpìlẹ̀; àkójọpọ̀ yìí jẹ́ àdánidá, ó sì pa àwòrán iṣẹ́ ìkọ́lé mọ́.
- source_word: χρυσόν
  choice: wúrà
  rationale: Orúkọ ohun èlò náà ní tààrà.
- source_word: ἄργυρον
  choice: fàdákà
  rationale: Orúkọ ohun èlò náà ní tààrà.
- source_word: λίθους τιμίους
  choice: òkúta iyebíye
  rationale: Ó pa ìtumọ̀ àwọn òkúta olówó iyebíye tàbí tí ó níye lórí mọ́, láìfi dandan sọ pé ohun ọ̀ṣọ́ kékeré ni.
- source_word: ξύλα
  choice: igi
  rationale: Orúkọ àpapọ̀ fún igi gẹ́gẹ́ bí ohun èlò ìkọ́lé.
- source_word: χόρτον
  choice: koríko gbígbẹ
  rationale: Nínú àkójọ ohun èlò ìkọ́lé yìí, ó tọ́ka sí koríko tí ó gbẹ bí ‘hay,’ kì í ṣe koríko tútù.
- source_word: καλάμην
  choice: pòròpórò
  rationale: Nínú àyíká yìí, ó jẹ́ koríko tàbí èérún igi ọkà tí ó ṣẹ́ kù, ohun èlò aláìlágbára tí iná lè tètè jó; ‘pòròpórò’ yà á sọ́tọ̀ kúrò ní koríko gbígbẹ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi ‘Ṣùgbọ́n’ túmọ̀ δέ dípò fífi àmì àsopọ̀ náà sílẹ̀; kò túmọ̀ sí ‘nísinsin yìí.’ Àwòrán ìpìlẹ̀ àti ohun èlò ìkọ́lé ni a pa mọ́.
