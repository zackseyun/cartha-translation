  to: Nítorí, nígbàkúùgbà tí ẹnì kan bá sọ pé, “Èmi jẹ́ ti Pọ́ọ̀lù,” tí ẹlòmíràn sì sọ pé, “Èmi jẹ́ ti Apollosi,” ṣé ẹ kì í ṣe ènìyàn lásán ni[a]?
