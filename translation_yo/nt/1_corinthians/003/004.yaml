id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: yo
  text: Nítorí, nígbàkúùgbà tí ẹnì kan bá sọ pé, “Èmi jẹ́ ti Pọ́ọ̀lù,” tí ẹlòmíràn sì sọ pé, “Èmi jẹ́ ti Apollosi,” ṣé ẹ kì í ṣe ènìyàn lásán ni[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣé ẹ kò ń hùwà bí ènìyàn lásán ni?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: nígbàkúùgbà tí ... bá
  rationale: Ó fi ipò tí ó lè máa ṣẹlẹ̀ léraléra tàbí nígbà èyíkéyìí hàn, kì í ṣe ìṣẹ̀lẹ̀ ẹ̀ẹ̀kan ṣoṣo.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé tí ọ̀rọ̀ yìí ní pẹ̀lú àríyànjiyàn tí ó ṣáájú mọ́.
- source_word: λέγῃ τις
  choice: ẹnì kan bá sọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni kan tí a kò dá mọ̀, ó sì pa ìtumọ̀ gbogbogbò mọ́.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Èmi jẹ́ ti Pọ́ọ̀lù
  rationale: Ó pa ọ̀rọ̀ Gíríìkì tí a kó pọ̀ mọ́, tó ń fi ìfaramọ́ ẹgbẹ́ hàn, láì pinnu ju bí ìbáṣepọ̀ náà ṣe rí lọ.
- source_word: ἕτερος δέ
  choice: tí ẹlòmíràn sì sọ pé
  rationale: Ó mú ìyàtọ̀ méjì tí μέν ... δέ dá sílẹ̀ jáde ní Yorùbá tí ó rọrùn láti lóye.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Èmi jẹ́ ti Apollo
  rationale: A tún fi ọ̀rọ̀-ìṣe tí a fà jáde nínú Gíríìkì sí i ní Yorùbá, kí ìlà méjèèjì lè jọra.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: ṣé ẹ kì í ṣe ènìyàn lásán ni?
  rationale: Ìbéèrè àsọyé náà bá àwọn ará Kọ́ríńtì wí pé ìwà ènìyàn lásán ni wọ́n ń hù; “lásán” mú agbára ọ̀rọ̀ náà jáde lọ́nà àdánidá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ìbáwí οὐκ ἄνθρωποί ἐστε
  choice: ṣé ẹ kì í ṣe ènìyàn lásán ni?
  alternative: ṣé ẹ kò ń hùwà bí ènìyàn ni?
  rationale: Àkọ́kọ́ pa àwòrán àti ìbéèrè inú Gíríìkì mọ́; èkejì tú ìtumọ̀ ihùwàsí rẹ̀ síta sí i, nítorí náà a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Ṣé” jẹ́ àmì ìbéèrè àsọyé àdánidá, “ẹ” sì pa ẹni kejì ọ̀pọ̀ inú Gíríìkì mọ́.
