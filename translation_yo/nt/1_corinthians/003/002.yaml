id: 1CO.3.2
reference: 1 Corinthians 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: yo
  text: Mo fún yín ní wàrà láti mu, kì í ṣe oúnjẹ líle[a], nítorí ẹ kò tíì lè gbà á. Ṣùgbọ́n kò sì tilẹ̀ di ìsinsin yìí tí ẹ lè gbà á,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ sí “oúnjẹ” lápapọ̀; a lo “oúnjẹ líle” níhìn-ín nítorí ìyàtọ̀ rẹ̀ sí wàrà.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: wàrà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ‘milk,’ ó sì pa àkàwé Pọ́ọ̀lù mọ́.
- source_word: ἐπότισα
  choice: mo fún yín mu
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí fí ohun mímu fún ẹnì kan; gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa àwòrán mímu wàrà mọ́.
- source_word: βρῶμα
  choice: oúnjẹ líle
  rationale: Ní pàtó, ọ̀rọ̀ náà túmọ̀ sí oúnjẹ lápapọ̀; ṣùgbọ́n ‘oúnjẹ líle’ mú ìyàtọ̀ rẹ̀ sí wàrà hàn kedere láì sọ ọ́ di ẹran nìkan.
- source_word: οὔπω ... ἐδύνασθε
  choice: ẹ kò tíì lè gbà á
  rationale: ‘Kò tíì’ fi àkókò tó kọjá hàn ní àyíká ọ̀rọ̀, ‘lè’ sì sọ àìní agbára tàbí ìmúrasílẹ̀; ‘gbà á’ jẹ́ kí Yorùbá ṣe kedere láì tú àkàwé náà sí ẹ̀kọ́ pàtó.
- source_word: οὐδὲ ἔτι νῦν δύνασθε
  choice: Àní ní ìsinsin yìí, ẹ kò tíì lè gbà á síbẹ̀
  rationale: ‘Àní ní ìsinsin yìí’ àti ‘síbẹ̀’ mú ìtẹnumọ́ pé àìlera náà ṣì ń bá a lọ títí di báyìí hàn.
theological_decisions:
- issue: Ìtumọ̀ àkàwé wàrà àti oúnjẹ
  choice: Pa àkàwé Pọ́ọ̀lù mọ́ láì ṣàlàyé wàrà gẹ́gẹ́ bí ‘ẹ̀kọ́ ìpilẹ̀ṣẹ̀’ tàbí oúnjẹ gẹ́gẹ́ bí ‘ẹ̀kọ́ gíga.’
  alternative: Tú àkàwé náà sí ‘mo kọ́ yín ní àwọn ohun ìpilẹ̀ṣẹ̀ nìkan.’
  rationale: Orísun Gíríìkì fi àkàwé sílẹ̀, kò sì ṣàlàyé ohun tí ọ̀kọ̀ọ̀kan dúró fún nínú ẹsẹ yìí; pípa rẹ̀ mọ́ yago fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye lójoojúmọ́. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó bá yẹ. Gbólóhùn náà pa ìtẹ̀síwájú sí ẹsẹ tó tẹ̀ lé e mọ́ pẹ̀lú àmì kọ́má ní òpin.
