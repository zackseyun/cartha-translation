  to: Bí iṣẹ́ tí ẹnikẹ́ni kọ́ lé orí ìpìlẹ̀ náà bá dúró[a], yóò gba ẹ̀san[b].
  rationale: A ṣàtúnṣe gbolohun ìbátan náà kí ìpìlẹ̀ tí ἐποικοδομέω ń tọ́ka sí má bà a nínú, ní ìbámu pẹ̀lú àyíká ẹsẹ̀ 3:11–13. A tún rọ́pò ‘èrè’ pẹ̀lú ‘ẹ̀san’ láti pa ìtumọ̀ μισθός mọ́ dáadáa. A pa ìdíwọ̀n àti àìsọ irú ẹ̀san náà ní pàtó mọ́.
