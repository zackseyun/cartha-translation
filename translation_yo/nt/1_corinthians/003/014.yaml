id: 1CO.3.14
reference: 1 Corinthians 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: yo
  text: Bí iṣẹ́ tí ẹnikẹ́ni kọ́ lé orí ìpìlẹ̀ náà bá dúró[a], yóò gba ẹ̀san[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bá wà ṣinṣin.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìsanwó” tàbí “owó iṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Bí ... bá
  rationale: Ọ̀nà àdáni Yorùbá ni èyí fún gbólóhùn oníṣ شرط, ó sì ṣe àfihàn ìtumọ̀ ‘bí’ ní kedere.
- source_word: τινος
  choice: ẹnikẹ́ni
  rationale: Ó fi ẹni tí a kò dárúkọ hàn, ó sì bá ìtumọ̀ arọ́pò-orúkọ aláìlópin náà mu.
- source_word: τὸ ἔργον
  choice: iṣẹ́
  rationale: ‘Iṣẹ́’ gbooro tó láti dúró fún ohun tí ẹni náà kọ́, kò sì fi ìtumọ̀ iṣẹ́ ìwà rere tàbí iṣẹ́ ìránṣẹ́ kan pàtó kún un.
- source_word: μενεῖ
  choice: bá dúró
  rationale: Ó pa ìtumọ̀ pé iṣẹ́ náà ṣì wà lẹ́yìn ìdánwò mọ́; ‘bá lè fara dà á’ jẹ́ àṣàyàn tí ó túmọ̀ àyíká iná sí i ju ọ̀rọ̀ náà fúnra rẹ̀ lọ.
- source_word: ὃ ἐποικοδόμησεν
  choice: tí ó fi kọ́lé lé orí rẹ̀
  rationale: Èyí pa àwòrán kíkọ́lé sórí ìpìlẹ̀ mọ́ láìsọ ohun tí a kọ́lé lé lórí ní pàtó, nítorí kò sí nínú gbólóhùn Gíríìkì yìí.
- source_word: μισθὸν
  choice: èrè
  rationale: ‘Èrè’ jẹ́ ọ̀rọ̀ Yorùbá àdáni fún ohun tí a ń gba gẹ́gẹ́ bí ìsanpadà, ó sì yẹ fún àyíká ìdájọ́ Ọlọ́run láìfi ìtumọ̀ owó iṣẹ́ nìkan sí i.
- source_word: λήμψεται
  choice: yóò gba
  rationale: Ó túmọ̀ ọjọ́ iwájú náà ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó níyì.
theological_decisions:
- issue: Irú ‘èrè’ tí ẹni náà yóò gba
  choice: A kò sọ irú èrè náà ní pàtó.
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ìgbàlà, ipò, tàbí owó iṣẹ́.
  rationale: Ọ̀rọ̀ Gíríìkì μισθός sọ ìsanpadà tàbí èrè, ṣùgbọ́n ẹsẹ̀ yìí kò sọ irú rẹ̀; ìtumọ̀ kò gbọ́dọ̀ yanju ohun tí orísun fi sílẹ̀ ní gbangba.
translation_notes:
  register: Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, tó bójú mu, tó sì yé òǹkàwé òde òní. A pa àwòrán kíkọ́lé lé orí ìpìlẹ̀ mọ́, a sì lo ẹnikẹ́ni pẹ̀lú arọ́pò-orúkọ ‘ó’ tí kò fipá yan akọ tàbí abo ní Yorùbá.
