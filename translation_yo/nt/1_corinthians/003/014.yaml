review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ètò ìdíwọ̀n, ‘iṣẹ́,’ ìwàláàyè/ìdúró rẹ̀, àti gbígba μισθός ọjọ́ iwájú dáadáa. Síbẹ̀, ‘tí ó fi kọ́lé lé orí rẹ̀’ kò ní ìtọ́kasí tí ó ṣe kedere fún ‘rẹ̀,’ ó sì lè jẹ́ kí ó dà bí ẹni pé a kọ́lé lé orí iṣẹ́ náà. Àtúnṣe náà mú ìtumọ̀ ἐποικοδόμησεν—kíkọ́lé lórí ìpìlẹ̀ tí àyíká ti sọ tẹ́lẹ̀—hàn ní kedere.
  naturalness: ‘Bí iṣẹ́ tí ẹnikẹ́ni kọ́ lé orí ìpìlẹ̀ náà bá dúró’ jẹ́ Yorùbá òde òní tó rọrùn, tó sì ṣàlàyé ìbáṣepọ̀ nínú àwòrán kíkọ́lé. ‘Ẹ̀san’ yẹ sí μισθός ní ibi yìí ju ‘èrè,’ tí ó lè túmọ̀ sí èrè ìṣòwò, lọ.
  terminology: A lo ‘ìpìlẹ̀ náà’ gẹ́gẹ́ bí ìtọ́kasí sí ìpìlẹ̀ tí a mẹ́nuba nínú ẹsẹ̀ ṣáájú, kì í ṣe àfikún ẹ̀kọ́. ‘Ẹ̀san’ pa ìtumọ̀ ìsanpadà/recompense mọ́ láìdín kù sí owó iṣẹ́ nìkan.
  issues:
