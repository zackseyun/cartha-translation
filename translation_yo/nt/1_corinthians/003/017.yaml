id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá pa tẹ́ńpìlì Ọlọ́run run,[a] Ọlọ́run yóò pa ẹni náà run; nítorí tẹ́ńpìlì Ọlọ́run jẹ́ mímọ́, ẹ̀yin sì ni tẹ́ńpìlì náà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ba jẹ́” tàbí “sọ di aláìmọ́” ní ibi méjèèjì tí ọ̀rọ̀ náà wà nínú ẹsẹ yìí.
    reason: lexical_alternative
  - marker: b
    text: “Ẹ̀yin” jẹ́ ọ̀pọ̀; Pọ́ọ̀lù ń pe ìjọ lápapọ̀ ní tẹ́ńpìlì Ọlọ́run.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: tẹ́ńpìlì
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ibi mímọ́ tí Ọlọ́run ń gbé, kì í ṣe gbogbo àgbègbè ilé tẹ́ńpìlì lásán. “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere nínú àyíká yìí.
- source_word: φθείρει / φθερεῖ
  choice: ba … jẹ́ / pa … run
  rationale: φθείρω lè túmọ̀ sí bíbàjẹ́, bíba ohun kan jẹ́, tàbí píparun. Àwọn ọ̀rọ̀ Yorùbá méjèèjì pa ìkìlọ̀ líle náà mọ́, bí ó tilẹ̀ jẹ́ pé Yorùbá àdánidá kò fi ọ̀rọ̀ kan náà hàn dáadáa nínú ìṣe ènìyàn àti ìdájọ́ Ọlọ́run.
- source_word: τοῦτον
  choice: ẹni náà
  rationale: “Ẹni náà” tọ́ka padà sí “ẹnikẹ́ni” ní ọ̀nà tí ó ṣe kedere, tí ó sì yẹ fún akọ tàbí abo.
- source_word: ἅγιος
  choice: mímọ́
  rationale: “Mímọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ fún ohun tí a yà sọ́tọ̀ fún Ọlọ́run, ó sì pa ìtumọ̀ ọlá àti ìyasọ́tọ̀ rẹ̀ mọ́.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: ẹ̀yin sì ni tẹ́ńpìlì náà
  rationale: Ìtumọ̀ yìí sọ ìdánimọ̀ náà ní Yorùbá àdánidá, ó sì pa “ẹ̀yin” púpọ̀ mọ́ lẹ́gbẹ̀ẹ́ “tẹ́ńpìlì” ẹyọ kan.
theological_decisions:
- issue: Bóyá tẹ́ńpìlì Ọlọ́run níhìn-ín jẹ́ onígbàgbọ́ kọ̀ọ̀kan tàbí ìjọ lápapọ̀
  choice: Ìtumọ̀ pàtàkì ni pé ìjọ lápapọ̀ ni tẹ́ńpìlì Ọlọ́run.
  alternative: A lè ka ọ̀rọ̀ náà sí onígbàgbọ́ kọ̀ọ̀kan ní ìmọ̀ ẹ̀kọ́ Bíbélì tó gbòòrò.
  rationale: Girámà Gíríìkì so “tẹ́ńpìlì” ẹyọ kan pọ̀ mọ́ “ẹ̀yin” púpọ̀; nínú àyíká 1 Kọ́ríńtì 3, èyí tọ́ka sí àwùjọ àwọn onígbàgbọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹni náà” yẹra fún fífi akọ tàbí abo kún ọ̀rọ̀ Gíríìkì; “ẹ̀yin” sì mú ọ̀pọ̀ ẹni tí ὑμεῖς ní hàn kedere.
