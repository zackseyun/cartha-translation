id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: yo
  text: Èmi náà, ẹ̀yin ará[a], mi ò lè bá yín sọ̀rọ̀ gẹ́gẹ́ bí àwọn ènìyàn ti Ẹ̀mí, bí kò ṣe gẹ́gẹ́ bí àwọn ènìyàn ti ara, gẹ́gẹ́ bí àwọn ọmọ ọwọ́ nínú Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀rọ̀ akọ tó túmọ̀ sí ‘àwọn arákùnrin,’ ṣùgbọ́n ó lè tọ́ka sí àwọn arákùnrin àti arábìnrin nínú ìjọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘nínú Kristi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: Èmi náà
  rationale: Ó pa καί mọ́ gẹ́gẹ́ bí ‘náà,’ ó sì fi ἐγώ hàn láì fi ìtẹnumọ́ tí ó pọ̀ kún un.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ará’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ọmọ ìgbàgbọ́, kò sì pọn dandan láti fi akọ tàbí abo hàn; àlàyé ìsàlẹ̀ fi akọ gírámà Gíríìkì hàn.
- source_word: οὐκ ἠδυνήθην
  choice: kò ṣeé ṣe fún mi
  rationale: Ó túmọ̀ àìlèṣe tí ọ̀rọ̀ Gíríìkì ń sọ ní èdè Yorùbá àdánidá.
- source_word: λαλῆσαι ὑμῖν
  choice: láti bá yín sọ̀rọ̀
  rationale: Ó jẹ́ ìtumọ̀ àdánidá tí ó sì sún mọ́ ìṣe ‘sọ̀rọ̀ sí yín.’
- source_word: πνευματικοῖς
  choice: ènìyàn ti Ẹ̀mí
  rationale: Àfihàn ‘Ẹ̀mí’ pa ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú πνεῦμα mọ́, ‘ènìyàn’ sì mú àpèjúwe tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ ṣe kedere.
- source_word: σαρκίνοις
  choice: ènìyàn ti ara
  rationale: Ó pa ìyàtọ̀ Ẹ̀mí/ara mọ́, láì tú u sí ‘ayé’ tàbí ‘ẹlẹ́ṣẹ̀,’ èyí tí yóò fi ìtumọ̀ sí i ju orísun lọ.
- source_word: νηπίοις
  choice: ọmọ ọwọ́
  rationale: Ó pa àkàwé ọmọ kékeré tí kò tíì dàgbà mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Ó pa agbára oyè Χριστός (‘Ẹni Àmì-òróró’/Mèsáyà) mọ́, ní ìbámu pẹ̀lú ìlànà iṣẹ́ náà.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: nínú Mèsáyà
  alternative: nínú Kristi
  rationale: Χριστός lè ṣiṣẹ́ bí oyè tàbí bí orúkọ tí ó ti fẹ́rẹ̀ẹ́ dúró; ọ̀rọ̀ àkọ́kọ́ yan ‘Mèsáyà’ gẹ́gẹ́ bí ìlànà iṣẹ́ náà, ó sì tọ́ka sí àṣàyàn ‘Kristi’ ní àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ σαρκίνοις
  choice: ènìyàn ti ara
  alternative: ènìyàn ayé
  rationale: ‘Ti ara’ pa ìforígbárí pẹ̀lú ‘ti Ẹ̀mí’ mọ́, kò sì dá ìdájọ́ ìwà tí ó lágbára sí i láìsí nínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforígbárí ‘ènìyàn ti Ẹ̀mí/ènìyàn ti ara’ jẹ́ mímọ́ọ̀mọ́ láti pa ìbáṣepọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́. Ìforígbárí náà ni a fi ‘bí ẹni pé’ hàn ní apá àkọ́kọ́ fún ìṣàn Yorùbá, nígbà tí ‘bí kò ṣe bí’ ń pa ἀλλά mọ́.
