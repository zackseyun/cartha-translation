  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: yo
  text: Pọ́ọ̀lù, àpọ́sítélì Mèsáyà Jésù[a] tí a pè gẹ́gẹ́ bí ìfẹ́ Ọlọ́run, àti Sósíténè, arákùnrin náà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá.
- source_word: κλητὸς ἀπόστολος
  choice: ẹni tí a pè láti jẹ́ àpọ́sítélì
  rationale: Èyí sọ ìtumọ̀ pé Ọlọ́run pè Pọ́ọ̀lù sí ipò àpọ́sítélì ní Yorùbá àdánidá, láì sọ pé ó kàn jẹ́ ońṣẹ́ lásán.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn níbí; a sì pa ìtòlẹ́sẹẹsẹ orísun náà mọ́.
- source_word: διὰ θελήματος θεοῦ
  choice: nípasẹ̀ ìfẹ́ Ọlọ́run
  rationale: Ọ̀rọ̀ yìí fi hàn pé ìfẹ́ Ọlọ́run ni ìpìlẹ̀ tàbí ọ̀nà tí ìpè Pọ́ọ̀lù fi wáyé.
- source_word: Σωσθένης
  choice: Sósíténè
  rationale: Àkọsílẹ̀ orúkọ Gíríìkì náà ní ìrísí tí ó rọrùn fún olùkà Yorùbá.
- source_word: ὁ ἀδελφὸς
  choice: arákùnrin wa
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní atọ́ka ṣùgbọ́n kò ní ọ̀rọ̀ arọ́pò oníhun, ‘arákùnrin wa’ jẹ́ ọ̀nà àdánidá láti fi ìbáṣepọ̀ ìjọ hàn nínú ìkíni lẹ́tà yìí.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìkíni Pọ́ọ̀lù
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú gbólóhùn yìí, Χριστός lè ṣe iṣẹ́ oyè ẹni tí Ọlọ́run yàn dípò orúkọ ìdílé; ‘Mèsáyà’ mú agbára oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìbílẹ̀ mìíràn sílẹ̀.
- issue: Agbára κλητός sí ipò àpọ́sítélì
  choice: ẹni tí a pè láti jẹ́ àpọ́sítélì
  alternative: àpọ́sítélì tí a pè
  rationale: Àṣàyàn náà fi ìpè Ọlọ́run sí ipò àpọ́sítélì hàn láì túmọ̀ rẹ̀ sí ìpè gbogbogbò tàbí yí i padà sí ẹ̀kọ́ ẹ̀sìn kan pàtó.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó ṣe kedere fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì pa ìrísí ìbẹ̀rẹ̀ lẹ́tà náà mọ́ pẹ̀lú àmì kọ́má ní òpin ẹsẹ.
