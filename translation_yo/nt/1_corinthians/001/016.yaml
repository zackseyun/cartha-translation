base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: yo
  text: Mo sì tún ṣe ìrìbọmi fún agbo ilé Stefana[a]. Yàtọ̀ sí ìyẹn, èmi kò mọ̀ bóyá mo ṣe ìrìbọmi fún ẹnikẹ́ni mìíràn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ilé Stefana.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí agbo àwọn ènìyàn inú ilé, kì í ṣe ilé gbígbé nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “bóyá mo ṣe ìrìbọmi fún ẹlòmíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: ṣe ìrìbọmi fún
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ṣíṣe ìrìbọmi fún ẹnì kan; gbólóhùn Yorùbá yìí jẹ́ èyí tí ó wọ́pọ̀, tí kò sì dá irú ọ̀nà ìrìbọmi kan pàtó láre.
- source_word: δὲ καὶ
  choice: sì tún
  rationale: Àpapọ̀ ọ̀rọ̀ méjèèjì ń fi gbogbo ilé Stefana kún àwọn tí Paulu ṣẹ̀ṣẹ̀ dárúkọ, pẹ̀lú ìsopọ̀ pẹ̀lẹ́.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: gbogbo ilé Stefana
  rationale: Nínú àyíká yìí, οἶκος ń tọ́ka sí àwọn ènìyàn inú agbo ilé, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan; “gbogbo ilé” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: λοιπὸν
  choice: Yàtọ̀ sí ìyẹn
  rationale: Ó ń samisi ohun tó ṣẹ́ kù lẹ́yìn àfikún tí Paulu ṣẹ̀ṣẹ̀ ṣe.
- source_word: οὐκ οἶδα
  choice: èmi kò mọ̀
  rationale: Èyí tẹ̀ lé ìtumọ̀ tààrà ti Gíríìkì, dípò yíyí i padà sí “èmi kò rántí,” bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ ìrántí wà nínú àyíká náà.
- source_word: εἴ τινα ἄλλον
  choice: bóyá ... ẹnikẹ́ni mìíràn
  rationale: Ó pa àìdánilójú Paulu mọ́ ní Yorùbá àdánidá.
