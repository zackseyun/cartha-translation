  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. A lo “gbogbo ilé” fún agbo ilé, a sì lo “ṣe ìrìbọmi fún” láìfi ọ̀nà ìrìbọmi kan pàtó múlẹ̀.
