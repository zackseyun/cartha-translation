revisions:
- from: Ṣùgbọ́n láti ọ̀dọ̀ rẹ̀ ni wíwà yín nínú Mèsáyà Jésù ti wá. Òun ni ó di ọgbọ́n láti ọ̀dọ̀ Ọlọ́run fún wa, àti òdodo[a], ìsọdimímọ́ àti ìràpadà.
  to: Láti ọ̀dọ̀ rẹ̀ ni ẹ̀yin sì wà nínú Mèsáyà Jésù, ẹni tí ó di ọgbọ́n fún wa láti ọ̀dọ̀ Ọlọ́run, àti òdodo[a], ìsọdimímọ́ àti ìràpadà.
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ tí ó ṣe bí ìṣẹ̀lẹ̀ àtijọ́ (“ti wá”) pẹ̀lú “ẹ̀yin ... wà,” láti pa ìṣe ìsinsìnyí ἐστε mọ́. A tún lo “sì” fún δέ, níbi tí “Ṣùgbọ́n” ti lè fi ìyàtọ̀ tó lágbára ju ti Gíríìkì hàn. Àtòjọ àwọn ẹ̀bùn/àwọn ìmọ̀ràn tó tẹ̀lé “ọgbọ́n” ni a fi sílẹ̀ ní ìrísí tó ṣí sí ìtumọ̀, gẹ́gẹ́ bí Gíríìkì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:15Z'
review_pass:
  verdict: revise
  source_fidelity: Àtúmọ̀ náà ní gbogbo àwọn ọ̀rọ̀ pàtàkì nínú Gíríìkì, ṣùgbọ́n “wíwà yín ... ti wá” yí ἐστε, ọ̀rọ̀ ìsinsìnyí “ẹ̀yin wà,” padà sí ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀. Àtúnṣe náà dá ìṣe ìsinsìnyí náà padà, ó sì pa ἐξ αὐτοῦ mọ́ gẹ́gẹ́ bí orísun.
  naturalness: “Ẹ̀yin sì wà nínú Mèsáyà Jésù” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ìṣọ̀kan Pọ́ọ̀lù “nínú” Mèsáyà mu. Lílo “ẹni tí ó di” tún so ọ̀rọ̀ ìbátan Gíríìkì mọ́ Mèsáyà Jésù ní kedere.
  terminology: “Mèsáyà Jésù,” “ọgbọ́n,” “òdodo,” “ìsọdimímọ́,” àti “ìràpadà” yẹ, wọ́n sì pa ìforúkọsílẹ̀ ẹ̀kọ́ ẹ̀sìn ti gbolohun náà mọ́ láì fi ìtumọ̀ kan tipátipá lórí ìbáṣepọ̀ àtòjọ náà. Àlàyé ìsàlẹ̀ fún δικαιοσύνη wà ní ibi tó tọ́.
  issues:
