id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: yo
  text: Láti ọ̀dọ̀ rẹ̀ ni ẹ̀yin sì wà nínú Mèsáyà Jésù, ẹni tí ó di ọgbọ́n fún wa láti ọ̀dọ̀ Ọlọ́run, àti òdodo[a], ìsọdimímọ́ àti ìràpadà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdájọ́ òdodo.”
    reason: δικαιοσύνη lè tọ́ka sí òdodo tàbí ìdájọ́ tó tọ́, bí ó tilẹ̀ jẹ́ pé “òdodo” bá àyíká ìgbàlà níbí mu jù.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: láti ọ̀dọ̀ rẹ̀ ... ti wá
  rationale: 'Ó pa ìtumọ̀ orísun tàbí ìpilẹ̀ mọ́: wíwà àwọn onígbàgbọ́ nínú Mèsáyà Jésù ti ọ̀dọ̀ Ọlọ́run wá.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa ọ̀nà ìsọ̀rọ̀ Paulu nípa ìrẹ́pọ̀ pẹ̀lú Mèsáyà mọ́ láì ṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ; “Mèsáyà” sì fi ipa akọ́lé Χριστός hàn.
- source_word: ἐγενήθη
  choice: di
  rationale: “Di” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ohun tí ẹnì kan wá jẹ́ fún àwọn ẹlòmíràn.
- source_word: σοφία
  choice: ọgbọ́n
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àríyànjiyàn Paulu nípa ọgbọ́n Ọlọ́run mu.
- source_word: ἀπὸ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa ìtumọ̀ pé Ọlọ́run ni orísun mọ́ láì sọ ọ́ di “ẹ̀bùn” tàbí fi àlàyé míì kún un.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” lè sọ ipò títọ́ níwájú Ọlọ́run àti ìwà tó bá ìfẹ́ rẹ̀ mu; “ìdájọ́ òdodo” wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: ἁγιασμός
  choice: ìsọdimímọ́
  rationale: Ó sọ iṣẹ́ tàbí ipò jíjẹ́ mímọ́ jáde, ó sì yẹ fún àyíká ẹ̀kọ́ ìgbàlà yìí.
- source_word: ἀπολύτρωσις
  choice: ìràpadà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ìtúsílẹ̀ tàbí ìgbàlà tí iye kan wà lẹ́yìn rẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ “ọgbọ́n láti ọ̀dọ̀ Ọlọ́run” pẹ̀lú òdodo, ìsọdimímọ́ àti ìràpadà
  choice: A pa gbogbo wọn mọ́ nínú àtòjọ kan pẹ̀lú “àti,” kí àwọn ọ̀rọ̀ mẹ́ta tó kẹ́yìn lè jẹ́ àlàyé sí ọgbọ́n tàbí àwọn ohun tó dúró lẹ́gbẹ̀ẹ́ rẹ̀.
  alternative: A lè fi àmì ìdádúró gígùn hàn pé òdodo, ìsọdimímọ́ àti ìràpadà jẹ́ àlàyé pàtó ohun tí “ọgbọ́n” túmọ̀ sí.
  rationale: Gíríìkì lè jẹ́ kí a ka ìbáṣepọ̀ àwọn ọ̀rọ̀ náà ní ọ̀nà tó ju ẹyọ kan lọ. Àtúmọ̀ náà kò fi tipátipá yan ọ̀kan nínú wọn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A tún ìṣètò gbolohun ṣe díẹ̀ kí ìtumọ̀ orísun ἐξ αὐτοῦ lè dun bí Yorùbá àdánidá.
