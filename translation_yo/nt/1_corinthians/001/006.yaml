  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: yo
  text: gẹ́gẹ́ bí ẹ̀rí nípa Mèsáyà[a] ti fìdí múlẹ̀ láàárín yín[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rí Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nínú yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó ń so gbólóhùn yìí mọ́ ohun tí ó ṣáájú nípa ìbámu tàbí àfiwé; ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: μαρτύριον
  choice: ẹ̀rí
  rationale: “Ẹ̀rí” ní ìtumọ̀ ìjẹ́rìí tí a sọ tàbí tí a kéde, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́ láìsọ ọ́ di àlàyé gígùn.
- source_word: τοῦ Χριστοῦ
  choice: nípa Mèsáyà
  rationale: 'A ka àsopọ̀ náà sí ohun tí ẹ̀rí náà dá lé: Mèsáyà ni ohun tí wọ́n jẹ́rìí nípa rẹ̀. “Mèsáyà” pa ìtumọ̀ oyè Χριστός mọ́.'
- source_word: ἐβεβαιώθη
  choice: ti fìdí múlẹ̀
  rationale: Ó fi hàn pé ẹ̀rí náà di ohun tí ó dúró ṣinṣin, tí a sì fi ìdí rẹ̀ múlẹ̀; ìṣètò Yorùbá yìí jẹ́ àdánidá láìfi ẹni tó ṣe é kún ọ̀rọ̀.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Níwọ̀n bí “yín” ti ń tọ́ka sí gbogbo ìjọ, “láàárín yín” fi ìtumọ̀ àwùjọ hàn lọ́nà tí ó ṣe kedere.
theological_decisions:
- issue: Ipa genitive nínú τοῦ Χριστοῦ
  choice: ẹ̀rí nípa Mèsáyà
  alternative: ẹ̀rí Mèsáyà
  rationale: Àyíká ọ̀rọ̀ náà lè tọ́ka sí ẹ̀rí àwọn aposteli nípa Jésù, ṣùgbọ́n àsopọ̀ Gíríìkì tún lè túmọ̀ sí ẹ̀rí tí Mèsáyà fúnra rẹ̀ jẹ́ tàbí ẹ̀rí tí ó jẹ́ tirẹ̀. A fi ìtumọ̀ kejì sí àlàyé ìsàlẹ̀ láti pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, ti òde òní, tí ó sì rọrùn fún òǹkàwé gbogbogbò. Àwọn àmì ohùn ni a lò ní kíkún; a sì pa ìṣàn gbólóhùn mọ́ gẹ́gẹ́ bí apá kan ti ọ̀rọ̀ tó ń bá ohun tí ó ṣáájú lọ.
