id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: yo
  text: Ṣùgbọ́n fún àwọn tí a pè—àwọn Júù àti àwọn Gíríìkì—Mèsáyà[a] ni agbára Ọlọ́run àti ọgbọ́n Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, Kristi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: àwọn tí a pè
  rationale: Ọ̀rọ̀ ajẹ́tífù náà dúró gẹ́gẹ́ bí orúkọ fún ẹgbẹ́ àwọn tí ìpè Ọlọ́run dá mọ̀; ìtumọ̀ yìí pa ìrísí ọ̀rọ̀-ìṣe náà mọ́ láìfi ẹni tó pè wọ inú gbólóhùn ní tààrà.
- source_word: Ἰουδαίοις
  choice: àwọn Júù
  rationale: Nínú ìfiwéra Paulu pẹ̀lú àwọn Gíríìkì, ọ̀rọ̀ náà tọ́ka sí àwọn Júù nípa ẹ̀yà àti ẹ̀sìn.
- source_word: Ἕλλησιν
  choice: àwọn Gíríìkì
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì gan-an, dípò fífẹ̀ ìtumọ̀ rẹ̀ sí gbogbo àwọn Kèfèrí.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” sọ ìtumọ̀ oyè ẹni àmì-òróró náà jáde, nígbà tí àlàyé ìsàlẹ̀ fún “Kristi” gẹ́gẹ́ bí àṣàyàn.
- source_word: θεοῦ δύναμιν
  choice: agbára Ọlọ́run
  rationale: Ìsopọ̀ orúkọ yìí jẹ́ ti ẹ̀dá àti ti Ọlọ́run; ìṣètò náà jẹ́ adayeba ní Yorùbá, ó sì pa àtúnwí θεοῦ mọ́.
- source_word: θεοῦ σοφίαν
  choice: ọgbọ́n Ọlọ́run
  rationale: A tún “Ọlọ́run” sọ gẹ́gẹ́ bí orísun ṣe ṣe, láti pa ìfararọ̀ àti ìtẹnumọ́ mọ́.
- source_word: implicit copula / verbless predicate relation
  choice: Mèsáyà ni agbára Ọlọ́run àti ọgbọ́n Ọlọ́run
  rationale: “ni” fi ìbáṣepọ̀ àsọtẹ́lẹ̀ tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì hàn ní Yorùbá adayeba, láìfi ọ̀rọ̀ ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè nípa ẹni tí Ọlọ́run yàn
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” mú ìtumọ̀ oyè Χριστός jáde ní kedere; “Kristi” jẹ́ àyálò-orúkọ tí ó wọ́pọ̀, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀ láìyanju ìyàtọ̀ náà ní ìkọ̀kọ̀.
- issue: Bóyá a ó sọ Ọlọ́run ní ẹni tó pè wọ́n ní tààrà
  choice: àwọn tí a pè
  alternative: àwọn tí Ọlọ́run pè
  rationale: Àyíká ọ̀rọ̀ fi ìpè Ọlọ́run hàn, ṣùgbọ́n ẹsẹ yìí kò sọ ẹni tó pè ní tààrà; ìtumọ̀ náà pa àfojúsùn àti ìwọ̀n tí orísun ní mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye. Àmì gígùn yà àlàyé “àwọn Júù àti àwọn Gíríìkì” sọ́tọ̀ gẹ́gẹ́ bí àfikún tó ṣàlàyé “àwọn tí a pè.”
