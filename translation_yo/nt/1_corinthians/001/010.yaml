revisions:
- from: Mo sì ń rọ̀ yín, ẹ̀yin ará[a], ní orúkọ Olúwa wa Jesu Mèsáyà[b], pé kí gbogbo yín máa sọ ohun kan náà, kí ìyapa kankan má sì sí láàárín yín[c], ṣùgbọ́n kí a so yín pọ̀ ní pípé[d] nínú èrò inú kan náà àti nínú ìdájọ́ kan náà[e].
  to: Mo sì ń rọ̀ yín, ẹ̀yin ará[a], ní orúkọ Olúwa wa Jésù Mèsáyà[b], pé kí gbogbo yín sọ ohun kan náà, kí ìyapa kankan má sì sí láàárín yín[c], ṣùgbọ́n kí a so yín pọ̀ ṣinṣin[d] nínú èrò inú kan náà àti nínú ìpinnu kan náà[e].
  rationale: Àtúnṣe náà yọ àfikún ìtẹ̀sí nínú “máa sọ” kúrò, ó tún ṣe κατηρτισμένοι ní ọ̀nà Yorùbá tó fi ìmúpapọ̀ ṣinṣin hàn dípò ìpèjẹ aláìdánidá. A tún fi àmì ohùn sí Jésù, a sì yàn “ìpinnu” fún γνώμη láti yẹra fún ìtumọ̀ ìdájọ́ ilé-ẹjọ́, nígbà tí a pa “ìdájọ́” mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:00Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìbéèrè Pọ́ọ̀lù, ìpè sí ìṣọ̀kan, àti ìyàtọ̀ tó wà láàárín νοῦς àti γνώμη jáde dáadáa. Síbẹ̀, “máa sọ” ń fi ìṣe àṣetẹ̀sí kan kún un tí kò hàn nínú Gíríìkì, “ní pípé” sì ń yi ìtumọ̀ κατηρτισμένοι padà sí ‘ní ìpèjẹ’ dípò ìtumọ̀ mímú àwọn apá pọ̀ tàbí títún wọn ṣe.
  naturalness: Àkọsílẹ̀ náà ní ìforúkọsílẹ̀ Yorùbá ìgbàlódé tó yẹ. “Jésù” nílò àmì ohùn. “Ìdájọ́” lè jẹ́ ìdájọ́ ilé-ẹjọ́ ní ọ̀rọ̀ Yorùbá òde òní; “ìpinnu” dára jù fún γνώμη nínú àyíká yìí.
  terminology: “Ẹ̀yin ará,” “ní orúkọ Olúwa wa,” àti “Mèsáyà” bá ìforúkọsílẹ̀ ìjọ àti ìpinnu ìtumọ̀ oyè mu. Àlàyé ìsàlẹ̀ fún ἀδελφοί àti Mèsáyà yẹ, wọ́n sì wà níbi tó tọ́.
  issues:
  - severity: medium
    issue: “kí gbogbo yín máa sọ ohun kan náà”
    rationale: “Máa sọ” sábà ń tọ́ka sí ìṣe tí ń ṣẹlẹ̀ léraléra. τὸ αὐτὸ λέγητε kò béèrè ìtẹ̀sí ìṣe bẹ́ẹ̀; “kí gbogbo yín sọ ohun kan náà” sun mọ́ orísun ju.
  - severity: medium
    issue: “kí a so yín pọ̀ ní pípé”
    rationale: “Ní pípé” kò jẹ́ ọ̀nà àdánidá láti ṣàfihàn κατηρτισμένοι, ó sì lè mú ìtumọ̀ ‘perfectly’ wá. “Kí a so yín pọ̀ ṣinṣin” mú èrò jíjẹ́ ẹni tí a ti mú papọ̀/tí a ti tún ṣe dáadáa hàn.
  - severity: low
    issue: “Jesu”
    rationale: Nínú Yorùbá tó ní àmì ohùn kíkún, orúkọ náà yẹ kí ó jẹ́ “Jésù.”
  - severity: low
    issue: “ìdájọ́ kan náà” fún γνώμῃ
    rationale: Ọ̀rọ̀ náà lè dà bí ìpinnu ìdájọ́ ilé-ẹjọ́. “Ìpinnu kan náà” jẹ́ àdánidá síi, ó sì ṣì dá ìyàtọ̀ rẹ̀ sí èrò inú dúró.
