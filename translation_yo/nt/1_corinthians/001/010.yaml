id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: yo
  text: Mo sì ń rọ̀ yín, ẹ̀yin ará[a], ní orúkọ Olúwa wa Jésù Mèsáyà[b], pé kí gbogbo yín sọ ohun kan náà, kí ìyapa kankan má sì sí láàárín yín[c], ṣùgbọ́n kí a so yín pọ̀ ṣinṣin[d] nínú èrò inú kan náà àti nínú ìpinnu kan náà[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹ̀yin arákùnrin”; ọ̀rọ̀ akọ ọ̀pọ̀ nínú Gíríìkì lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, àwọn ọkùnrin àti obìnrin.
    reason: cultural_note
  - marker: b
    text: Mèsáyà, tí a sábà máa ń pè ní “Kristi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “kí ìyapa ẹgbẹ́ sí ẹgbẹ́ má ṣe sí láàárín yín.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “kí a tún yín ṣe” tàbí “kí a tún mú yín bára mu.”
    reason: lexical_alternative
  - marker: e
    text: Tàbí “ìdájọ́ kan náà” tàbí “ìdánilójú kan náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Mo sì ń rọ̀ yín
  rationale: Ó fi ẹ̀bẹ̀ onífẹ̀ẹ́ ṣùgbọ́n tí ó lágbára hàn, dípò àṣẹ gbígbẹ; “sì” tún ń gbé ipa àsopọ̀ δέ jáde.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn ọmọ ìjọ tàbí ẹbí kan, kò sì fi àwọn obìnrin sílẹ̀, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìlànà gírámà.
- source_word: διὰ τοῦ ὀνόματος
  choice: ní orúkọ
  rationale: Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ láti fi ẹ̀bẹ̀ tí a ṣe lórí àṣẹ àti ipò ẹni kan hàn.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Ó túmọ̀ oyè náà dípò kí ó kàn ṣe àkọsílẹ̀ ìró “Kristi”; àṣàyàn ìbílẹ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: kí gbogbo yín máa sọ ohun kan náà
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, tí ó tẹnumọ́ ọ̀rọ̀ ìjẹ́wọ́ àti ìṣọ̀kan, láì sọ ọ́ di “kí ẹ fohùn ṣọ̀kan” nìkan.
- source_word: σχίσματα
  choice: ìyapa
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún pínyà tàbí fífa ẹgbẹ́ ya nínú ìjọ.
- source_word: κατηρτισμένοι
  choice: kí a so yín pọ̀ ní pípé
  rationale: Ó pa ìṣe tí a ṣe sí wọn mọ́, ó sì mú ìtumọ̀ ohun tí a tún ṣe tàbí tí a mú padà bára mu wá nínú àyíká ìyapa.
- source_word: νοῒ
  choice: èrò inú
  rationale: Ó ń tọ́ka sí ọpọlọ, òye, tàbí ọ̀nà ìrònú, ó sì yàtọ̀ sí γνώμη tí ó tẹ̀ lé e.
- source_word: γνώμῃ
  choice: ìdájọ́
  rationale: Ó pa ìtumọ̀ ìgbéyẹ̀wò tàbí ìpinnu tí ẹgbẹ́ kan dì mú mọ́, láì dapọ̀ mọ́ “èrò inú.”
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ oyè Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín oyè náà ṣì ní agbára ìtumọ̀ rẹ̀; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí àṣàyàn ìbílẹ̀ “Kristi” wà nínú àlàyé.
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί tí ó jẹ́ akọ ní gírámà
  choice: ẹ̀yin ará, pẹ̀lú àlàyé ìsàlẹ̀
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìlànà gírámà, ṣùgbọ́n Pọ́ọ̀lù ń bá gbogbo ìjọ sọ̀rọ̀. “Ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bá àyíká yìí mu láì fi abo kún orísun lọ́nà tí kò sí níbẹ̀.
- issue: Ìbáṣepọ̀ νοῦς àti γνώμη
  choice: èrò inú kan náà àti ìdájọ́ kan náà
  alternative: ọ̀nà ìrònú kan náà àti ìpinnu kan náà
  rationale: A pa àwọn ọ̀rọ̀ méjèèjì mọ́ gẹ́gẹ́ bí ohun tí ó jọra ṣùgbọ́n tí kò dọ́gba pátápátá, kí a má bà a yanju ìyàtọ̀ tí ọ̀rọ̀ Gíríìkì fi sílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìtẹnumọ́ àti ìwọ̀ntúnwọ̀nsì ẹ̀bẹ̀ Pọ́ọ̀lù mọ́. “Ní orúkọ” jẹ́ àdánidá ju “nípasẹ̀ orúkọ” lọ ní Yorùbá, ó sì ṣì fi àṣẹ ẹni tí a dárúkọ hàn.
