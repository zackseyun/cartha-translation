  text: ὅπως μὴ καυχήσηται πᾶσα σὰρξ ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/029.yaml
  text: so that no flesh may boast before God[a].
translation:
  language: yo
  text: kí ẹran-ara kankan má bàa ṣògo níwájú Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ènìyàn kankan má bàa ṣògo níwájú Ọlọ́run.” Ní tààràtà, “gbogbo ẹran-ara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μὴ
  choice: kí ... má bàa
  rationale: Ọ̀nà gbólóhùn yìí fi ète tàbí àbájáde hàn ní Yorùbá, ó sì bá gbólóhùn abẹ́ àṣẹ nínú èdè Gíríìkì mu.
- source_word: καυχήσηται
  choice: ṣògo
  rationale: “Ṣògo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi ara ẹni yangàn tàbí gbéraga; ó mú ìtumọ̀ ọ̀rọ̀ náà jáde láìlo èdè àtijọ́.
- source_word: πᾶσα σὰρξ
  choice: ẹran-ara kankan
  rationale: Nígbà tí ìkọ̀ “má” bá a pọ̀, gbólóhùn náà túmọ̀ sí pé kò sí ẹran-ara kankan. Yíyan “ẹran-ara” pa àwòrán àti ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́, níbi tí ó ti ń tọ́ka sí ènìyàn nínú àìlera rẹ̀ gẹ́gẹ́ bí ẹ̀dá.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ wíwà ní ojú Ọlọ́run tàbí ní iwájú rẹ̀ mu.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: ẹran-ara
  alternative: ènìyàn kankan
  rationale: Níhìn-ín, σάρξ kò túmọ̀ sí ìwà ẹ̀ṣẹ̀ kan tí ń gbé inú ènìyàn; ó tọ́ka sí aráyé nínú ipò àìlera wọn gẹ́gẹ́ bí ẹ̀dá níwájú Ọlọ́run. “Ẹran-ara” pa ìfọkànsìn ọ̀rọ̀ Gíríìkì àti ìforígbárí tó wà nínú rẹ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣeé lóye ni a lò. “Ẹran-ara” ní ìrísí Bíbélì díẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé fúnni ní ọ̀nà Yorùbá tó túbọ̀ ṣe àdánidá.
