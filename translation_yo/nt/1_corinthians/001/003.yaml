reference: 1 Corinthians 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ àti àlàáfíà wà fún yín láti ọ̀dọ̀ Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Olúwa Jésù Kristi.”'
    reason: 'Àṣàyàn ọ̀rọ̀: “Kristi” jẹ́ ọ̀nà tí ó ti wọ́pọ̀ nínú Yorùbá fún oyè náà.'
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ní iyì láti sọ χάρις; ó pa ìtumọ̀ ojúrere tí a kò tọ́ sí àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Dátífù náà ń tọ́ka sí àwọn tí ìkíni-ìbùkún náà ń lọ sí; “fún yín” ni ọ̀nà àdánidá ní Yorùbá.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbágbépọ̀ rere, ìfọkànbalẹ̀ àti ire pípé tí εἰρήνη lè ní nínú ìkíni Páùlù.
- source_word: ἀπὸ
  choice: láti ọ̀dọ̀
  rationale: Ó fi orísun oore-ọ̀fẹ́ àti àlàáfíà hàn ní kedere, ó sì bá lílo Yorùbá mu.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: Èyí pa ìṣètò àfikún-orúkọ Gíríìkì mọ́ láì yí i sí “Ọlọ́run wa àti Baba,” èyí tí yóò lè dábàá ìṣètò míì.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀ fún κύριος, ó sì pa agbára oyè náà mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ fún “Kristi” gẹ́gẹ́ bí àṣàyàn ìtumọ̀ tí ó ti wọ́pọ̀.
theological_decisions:
- issue: Bóyá a ó pa ìbáṣepọ̀ orísun kan náà mọ́ fún oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Baba àti Jésù.
  choice: A lo “láti ọ̀dọ̀” lẹ́ẹ̀kan ṣoṣo kí ó ṣàkóso “Ọlọ́run Baba wa” àti “Olúwa Jésù Mèsáyà” papọ̀.
  alternative: Láti tún “láti ọ̀dọ̀” sọ ṣáájú “Olúwa Jésù Mèsáyà,” tàbí láti tún gbólóhùn náà ṣe kí ìṣọ̀kan orísun náà má ṣe hàn gbangba.
  rationale: Gíríìkì fi àwọn méjèèjì sábẹ́ preposition ἀπό kan náà. Ìtumọ̀ yìí pa ìṣọ̀kan náà mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ kún un.
- issue: Bóyá a ó fi ọ̀rọ̀-ìṣe kún ìkíni tí kò ní ọ̀rọ̀-ìṣe ní Gíríìkì.
  choice: A lo ìṣètò ìbùkún “Kí ... wà fún yín.”
  alternative: “Oore-ọ̀fẹ́ àti àlàáfíà fún yín láti ọ̀dọ̀ ...” láìsí ọ̀rọ̀-ìṣe.
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe sílẹ̀ gẹ́gẹ́ bí àṣà ìkíni, ṣùgbọ́n Yorùbá àdánidá ń fẹ́ ìṣètò “Kí ... wà” láti mú agbára ìbùkún náà hàn. Èyí kò pinnu ju ohun tí ìkíni náà túmọ̀ sí lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà ní ìrísí ìkíni-ìbùkún ọlọ́lá tí ó ṣeé lóye fún òǹkàwé òde òní; “Kí ... wà fún yín” jẹ́ àdánidá ju gbólóhùn aláìsí ọ̀rọ̀-ìṣe lọ.
