id: 1CO.1.25
reference: 1 Corinthians 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: yo
  text: Nítorí ohun òmùgọ̀ ti Ọlọ́run jọgbọ́n ju ènìyàn lọ, ohun aláìlera ti Ọlọ́run sì lágbára ju ènìyàn lọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: ohun tí ó dà bí ìwà òmùgọ̀ láti ọ̀dọ̀ Ọlọ́run
  rationale: Àpólà Gíríìkì náà jẹ́ ohun àìní-orúkọ tí ó túmọ̀ sí ‘ohun òmùgọ̀ ti Ọlọ́run.’ Ìtumọ̀ yìí pa àfiwé tó ń mú ẹni ronú mọ́, ṣùgbọ́n ‘tí ó dà bí’ jẹ́ kí Yorùbá má ṣe sọ ní tààrà pé Ọlọ́run ní ìwà òmùgọ̀; ọ̀rọ̀ inú àyíká ń tọ́ka sí ohun tí ènìyàn kà sí òmùgọ̀ nínú iṣẹ́ Ọlọ́run.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: ní ọgbọ́n ju ti ènìyàn lọ
  rationale: Ìṣètò ‘ju ... lọ’ fi ìpele àfiwé σοφώτερον hàn. ‘Ènìyàn’ jẹ́ orúkọ àpapọ̀ tí kò fi akọ tàbí abo sílẹ̀, ó sì bá ἀνθρώπων mu.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: ohun tí ó dà bí àìlera láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó tẹ̀ lé ìṣètò apá àkọ́kọ́, ó sì pa ìṣọ̀kan ọ̀rọ̀ àti ìtakora ìmọ̀ràn Pọ́ọ̀lù mọ́. ‘Àìlera’ túmọ̀ ἀσθενές ní kedere.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: lágbára ju ti ènìyàn lọ
  rationale: ‘Lágbára ju ... lọ’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìpele àfiwé ἰσχυρότερον, nígbà tí ‘ti ènìyàn’ dúró fún ohun ìní tí a kò tún sọ ní kíkún.
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ ìdí tí ὅτι ní pẹ̀lú gbólóhùn tó ṣáájú mọ́.
theological_decisions:
- issue: Bóyá kí a sọ pé Ọlọ́run ní ‘ìwà òmùgọ̀’ àti ‘àìlera’ ní tààrà
  choice: Lo ‘ohun tí ó dà bí ... láti ọ̀dọ̀ Ọlọ́run’
  alternative: ‘Ìwà òmùgọ̀ Ọlọ́run ... àti àìlera Ọlọ́run ...’
  rationale: 'Àṣàyàn náà kò yọ paradox náà kúrò, ṣùgbọ́n ó jẹ́ kí ohun tí àyíká ọ̀rọ̀ Gíríìkì ń sọ hàn ní Yorùbá: iṣẹ́ Ọlọ́run ni ènìyàn ń pè ní òmùgọ̀ tàbí aláìlera, kì í ṣe pé Pọ́ọ̀lù ń fi òmùgọ̀ tàbí àìlera gidi kan Ọlọ́run.'
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọ̀wọ̀, ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A pa ìṣètò méjì tó dọ́gba àti ìtakora ọgbọ́n/òmùgọ̀, agbára/àìlera mọ́.
