  source_fidelity: Ìtumọ̀ náà pa ìdí-asọye ὅτι àti àfiwé méjèèjì mọ́, ṣùgbọ́n ó ṣàfikún ‘tí ó dà bí’ àti ‘láti ọ̀dọ̀’ ní ibi tí Gíríìkì ti lo àwọn àpólà ohun-àìní-orúkọ pẹ̀lú genitive (‘ohun òmùgọ̀/aláìlera ti Ọlọ́run’). Àfikún náà mú paradox Pọ́ọ̀lù rọrùn ju bí ọ̀rọ̀ orísun ṣe rí lọ, ó sì lè sọ ohun tí kò dájú nínú gbolohun náà di ìtumọ̀ kan ṣoṣo.
  naturalness: ‘Jọgbọ́n ju ènìyàn lọ’ àti ‘lágbára ju ènìyàn lọ’ jẹ́ ìlò Yorùbá òde òní tí ó péye. ‘Ohun òmùgọ̀ ti Ọlọ́run’ àti ‘ohun aláìlera ti Ọlọ́run’ pa ìṣọ̀kan ìtẹnumọ́ Gíríìkì mọ́ láì sọ ‘ìwà’ (èyí tí ó lè tọ́ka sí ìwà tàbí ìwàláàyè Ọlọ́run).
