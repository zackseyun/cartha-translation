id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: yo
  text: Nítorí Kristi kò rán mi láti ṣe ìrìbọmi, bí kò ṣe láti kéde ìhìn rere—kì í ṣe ní ọgbọ́n ọ̀rọ̀[a]—kí a má bàa sọ àgbélébùú Kristi di asán[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ọgbọ́n àsọyé,” tàbí ní tààràtà, “ní ọgbọ́n ọ̀rọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí a má bàa sọ ọ́ di òfo,” tàbí “kí a má bàa sọ ọ́ di aláìlágbára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: Kristi / Kristi
  rationale: Yorùbá ti gba “Kristi” gẹ́gẹ́ bí ọ̀rọ̀ ìjọ tí ó wọ́pọ̀ fún oyè Χριστός; ó ṣe kedere, ó sì jẹ́ àdánidá ju fífi “Mèsáyà” sí gbogbo ibi méjèèjì lọ nínú gbólóhùn yìí.
- source_word: βαπτίζειν
  choice: láti ṣe ìrìbọmi
  rationale: “Ṣe ìrìbọmi” ni gbólóhùn Yorùbá ìjọ tí ó wọ́pọ̀, ó sì yẹra fún fífi ìtumọ̀ ọ̀nà ìṣe kan pàtó kún ọ̀rọ̀ Gíríìkì.
- source_word: εὐαγγελίζεσθαι
  choice: láti kéde ìhìn rere
  rationale: Ó mú ìṣe ìkéde tí ọ̀rọ̀ Gíríìkì ní jáde ní èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: σοφίᾳ λόγου
  choice: ní ọgbọ́n ọ̀rọ̀
  rationale: Ìtumọ̀ yìí sún mọ́ ìṣètò Gíríìkì, ó sì pa àìdánilójú mọ́ bóyá Pọ́ọ̀lù ń tọ́ka sí ọgbọ́n àsọyé, ọ̀rọ̀ ológo, tàbí ìmọ̀ ọ̀rọ̀ ènìyàn.
- source_word: κενωθῇ
  choice: kí a má bà á sọ ... di asán
  rationale: Ó fi passive Gíríìkì hàn ní Yorùbá àdánidá, láì fi “agbára” kún un, èyí tí kò sí ní tààràtà nínú ọ̀rọ̀ orísun.
- source_word: σταυρὸς
  choice: àgbélébùú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a ti fìdí múlẹ̀ fún σταυρός nínú àyíká ikú Kristi.
theological_decisions:
- issue: Bóyá a ó tú Χριστός sí oyè “Mèsáyà” tàbí kí a lo “Kristi.”
  choice: Kristi
  alternative: Mèsáyà
  rationale: “Kristi” jẹ́ ọ̀rọ̀ Yorùbá tí ó ti fìdí múlẹ̀ tí ó sì tún ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; lílo rẹ̀ ní “àgbélébùú Kristi” jẹ́ àdánidá, kò sì mú ẹ̀kọ́ ẹgbẹ́ ìjọ kan wọlé.
- issue: Bóyá κενωθῇ túmọ̀ sí pípadánù agbára ní tààràtà.
  choice: sọ ... di asán
  alternative: sọ ... di aláìlágbára
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àwòrán “sọ di òfo/asán”; fífi “agbára” sínú àkọ́kọ́ yóò ṣàlàyé ohun tí Pọ́ọ̀lù kò sọ ní gbangba, nítorí náà a pa ìṣòro ẹ̀kọ́ àti àwòrán náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “kì í ṣe ...” láti mú ìyàtọ̀ οὐκ ἐν jáde, a sì pa àwòrán κενόω mọ́ láì ṣàlàyé rẹ̀ ju orísun lọ.
