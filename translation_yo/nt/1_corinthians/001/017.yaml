  to: Nítorí Kristi kò rán mi láti ṣe ìrìbọmi, bí kò ṣe láti kéde ìhìn rere—kì í ṣe ní ọgbọ́n ọ̀rọ̀[a]—kí a má bàa sọ àgbélébùú Kristi di asán[b].
