    rationale: «Nínú ọgbọ́n Ọlọ́run» jẹ́ Yorùbá adayeba síi fún ἐν, ó sì dá àìdánilójú ‘nínú/ní agbègbè ètò ọgbọ́n Ọlọ́run’ dúró.
