id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: yo
  text: Nítorí níwọ̀n bí, nínú ọgbọ́n Ọlọ́run, ayé kò mọ Ọlọ́run nípasẹ̀ ọgbọ́n, inú Ọlọ́run dùn láti gba àwọn tí ń gbàgbọ́ là nípasẹ̀ ìwà òmùgọ̀ ti ìkéde náà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìwà òmùgọ̀ ti iṣẹ́ ìwàásù.”
    reason: alternative_reading
  - marker: b
    text: Ìyẹn ni, ohun tí ayé kà sí òmùgọ̀ nínú ìkéde náà.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Nítorí, ... níwọ̀n bí
  rationale: Àpapọ̀ ọ̀rọ̀ yìí pa ìsopọ̀ àlàyé γάρ àti ìdí tí ἐπειδή ń mú wá mọ́; ó sì jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún gbólóhùn náà.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: ní ọgbọ́n Ọlọ́run
  rationale: Ó pa àìdánilójú ἐν mọ́ láì sọ ọ́ di ọ̀nà ohun èlò nìkan tàbí fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: οὐκ ἔγνω
  choice: kò ... mọ
  rationale: ‘Mọ’ lè ní ìtumọ̀ ìmọ̀ ọpọlọ àti ìbáṣepọ̀, gẹ́gẹ́ bí γινώσκω ṣe lè ní níbí.
- source_word: ὁ κόσμος
  choice: ayé
  rationale: Èyí ni ìtumọ̀ Páùlù tí ó wọ́pọ̀, ó sì lè dúró fún aráyé àti ètò wọn láì fi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
- source_word: διὰ τῆς σοφίας
  choice: nípasẹ̀ ọgbọ́n
  rationale: ‘Nípasẹ̀’ fi διά pẹ̀lú ọ̀rọ̀-orúkọ genitive hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: inú Ọlọ́run dùn
  rationale: Ọ̀rọ̀ yìí fi ìfẹ́ rere àti ìtẹ́lọ́rùn Ọlọ́run hàn, kì í ṣe ìpinnu gbígbẹ lásán.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: nípasẹ̀ ìwà òmùgọ̀ ìkéde náà
  rationale: ‘Ìkéde’ tọ́ka ní pàtàkì sí ohun tí a kéde, ṣùgbọ́n ó tún lè gbà ìṣe kíkéde náà láàyè. Ìtumọ̀ náà pa ọ̀nà ọ̀rọ̀ ẹlẹ́yà Páùlù mọ́, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ayé ni ó ka ìkéde náà sí òmùgọ̀.
- source_word: σῶσαι
  choice: láti gba ... là
  rationale: ‘Gba ... là’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbàlà tàbí ìdálọ́wọ́ nínú àyíká ẹ̀kọ́ ìgbàlà yìí.
- source_word: τοὺς πιστεύοντας
  choice: àwọn tí ó gbàgbọ́
  rationale: Ó tú participle tí a lò bí ọ̀rọ̀-orúkọ sí Yorùbá kedere láì fi àlàyé ẹ̀kọ́ ìsìn tí ó ju ti Gíríìkì lọ kún un.
theological_decisions:
- issue: Ìtumọ̀ διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: Ó ń tọ́ka ní pàtàkì sí ìkéde tí ayé kà sí ohun òmùgọ̀.
  alternative: Ó lè tọ́ka sí ohun tí ayé kà sí ìṣe òmùgọ̀ ti wíwàásù, tàbí kí ó mọ̀ọ́mọ̀ so ìkéde àti iṣẹ́ kíkéde pọ̀.
  rationale: κήρυγμα sábà máa ń túmọ̀ sí ohun tí a kéde, ṣùgbọ́n àyíká náà lè tún mú iṣẹ́ ìkéde ní gbangba wá sí ọkàn. A kò sọ pé Ọlọ́run fúnra rẹ̀ ka ọ̀rọ̀ náà sí òmùgọ̀; àlàyé ìsàlẹ̀ pa ìforígbárí ọ̀rọ̀ Páùlù mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo ‘ìkéde’ dípò ọ̀rọ̀ ẹ̀ka ìsìn tóóró, a sì pa àìdánilójú ọ̀rọ̀ Gíríìkì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
