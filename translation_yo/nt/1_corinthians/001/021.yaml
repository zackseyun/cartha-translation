revisions:
- from: Nítorí, ní ọgbọ́n Ọlọ́run, níwọ̀n bí ayé kò ti mọ Ọlọ́run nípasẹ̀ ọgbọ́n, inú Ọlọ́run dùn láti gba àwọn tí ó gbàgbọ́ là nípasẹ̀ ìwà òmùgọ̀ ìkéde náà[a][b].
  to: Nítorí níwọ̀n bí, nínú ọgbọ́n Ọlọ́run, ayé kò mọ Ọlọ́run nípasẹ̀ ọgbọ́n, inú Ọlọ́run dùn láti gba àwọn tí ń gbàgbọ́ là nípasẹ̀ ìwà òmùgọ̀ ti ìkéde náà[a][b].
  rationale: Àtúnṣe náà yọ «ti» kúrò nínú ìkọ̀ tí ó lè sọ ‘kò tíì mọ,’ ó sì lo «tí ń gbàgbọ́» láti ṣàfihàn participle present náà. A tún lo «nínú» fún ἐν àti «ti» nínú «ìwà òmùgọ̀ ti ìkéde náà» láti jẹ́ kí ìbáṣepọ̀ ọ̀rọ̀ náà hàn kedere ní Yorùbá, láì yan láàárín ‘ìkéde’ gẹ́gẹ́ bí ohun tí a kéde àti ìṣe ìwàásù ju bí Gíríìkì ṣe jẹ́ kí ó rí lọ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:05Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìṣàn ọ̀rọ̀ Gíríìkì àti ọ̀pọ̀ jùlọ àwọn ọ̀rọ̀ pàtàkì rẹ̀ dáadáa. Ṣùgbọ́n «kò ti mọ» lè mú ìtumọ̀ ‘kò tíì mọ’ (not yet known) wá, níbi tí aorist οὐκ ἔγνω ń sọ ní rọrùn pé ayé kò mọ Ọlọ́run. Bákan náà, «àwọn tí ó gbàgbọ́» lè dá ìṣe ìgbàgbọ́ dúró sí ìṣẹ̀lẹ̀ tí ó ti kọjá, nígbà tí participle present τοὺς πιστεύοντας ń tọ́ka sí àwọn tí ń gbàgbọ́.
  naturalness: Àtúnṣe kékeré sí ìtòlẹ́sẹẹsẹ gbólóhùn náà mú un rọrùn síi nínú Yorùbá òde òní, nígbà tí ó pa ìbáṣepọ̀ ‘nítorí níwọ̀n bí’ mọ́. «Nínú ọgbọ́n Ọlọ́run» ṣàlàyé ipò/sífíà ἐν ní ti ara ju «ní ọgbọ́n Ọlọ́run» lọ.
  terminology: «Ìwà òmùgọ̀ ti ìkéde náà» pa μωρία τοῦ κηρύγματος mọ́ pẹ̀lú ìkéde gẹ́gẹ́ bí ohun tí a kéde. «Gba ... là» jẹ́ ìlò Yorùbá tó dáa fún σῶσαι ní àyíká yìí. Àwọn àlàyé ìsàlẹ̀ méjèèjì bá ibi àmì wọn mu.
