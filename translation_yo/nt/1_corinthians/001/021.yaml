    rationale: ‘Ti’ nínú ìkọ̀ náà lè túmọ̀ sí pé ayé ‘kò tíì mọ,’ èyí tí kò sí nínú οὐκ ἔγνω. «Kò mọ» jẹ́ ìtumọ̀ tó bójú mu fún aorist náà.
  - severity: medium
    issue: «àwọn tí ó gbàgbọ́»
    rationale: Ó lè ka sí àwọn tí wọ́n ti ṣe ìṣe ìgbàgbọ́ kan ní ìgbà tí ó kọjá. «Àwọn tí ń gbàgbọ́» fi iye present participle substantival náà hàn dáadáa láì kó ẹ̀kọ́ ìsìn mìíràn wọlé.
