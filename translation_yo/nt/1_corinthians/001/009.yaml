id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: yo
  text: Olóòótọ́ ni Ọlọ́run; òun ló pè yín[a] sí ìdàpọ̀[b] pẹ̀lú Ọmọ rẹ̀, Jésù Mèsáyà[c], Olúwa wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ẹni tí ó pè yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìrẹ́pọ̀” tàbí “kíkópa papọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Giriki ní “Jésù Kristi”; “Mèsáyà” ni a lò láti fi oyè Χριστός hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: Olóòótọ́
  rationale: Ó ṣàpèjúwe Ọlọ́run gẹ́gẹ́ bí ẹni tí a lè gbẹ́kẹ̀ lé, tí ó sì dúró ṣinṣin nínú ohun tí ó sọ àti ohun tí ó ṣe.
- source_word: δι’ οὗ ἐκλήθητε
  choice: òun ló pè yín
  rationale: Ọ̀rọ̀ yìí sọ pé Ọlọ́run ni ẹni tí ìpè náà ti ọ̀dọ̀ rẹ̀ wá. Ìtúmọ̀ aláṣe yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìṣe Ọlọ́run àti ìtumọ̀ gbólóhùn Giriki mọ́.
- source_word: κοινωνίαν
  choice: ìdàpọ̀
  rationale: “Ìdàpọ̀” lè ní ìtumọ̀ àjọṣe tímọ́tímọ́ àti kíkópa papọ̀; kò sì dín ọ̀rọ̀ náà kù sí ìtumọ̀ ẹ̀sìn pàtó kan.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: pẹ̀lú Ọmọ rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Giriki wà ní ìṣísẹ̀ genitive, “ìdàpọ̀ pẹ̀lú” ni ọ̀nà Yorùbá tí ó ṣe kedere jù láti sọ àjọṣe náà.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Jésù” jẹ́ orúkọ, “Mèsáyà” sì mú iṣẹ́ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró tí Ọlọ́run yàn jáde hàn.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tí ó bójú mu fún oyè κύριος níbí, ó sì jẹ́ èdè tí ó wọ́pọ̀, tí ó ní ọlá.
theological_decisions:
- issue: Bóyá Χριστός yẹ kí ó jẹ́ “Kristi” tàbí kí a fi oyè náà hàn gẹ́gẹ́ bí “Mèsáyà.”
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àkójọpọ̀ oyè yìí, Χριστός ṣì ní agbára ìtumọ̀ oyè, kì í ṣe orúkọ lasán; “Mèsáyà” mú oyè náà hàn ní kedere láìfi ẹ̀kọ́ ìjọ kan kún un.
- issue: Bóyá κοινωνία túmọ̀ sí àjọṣe tàbí kíkópa.
  choice: ìdàpọ̀
  alternative: ìrẹ́pọ̀; kíkópa papọ̀
  rationale: “Ìdàpọ̀” gba apá àjọṣe àti apá kíkópa papọ̀ sínú, ó sì pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ Giriki mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ìtẹnumọ́ “òun ló” láti sọ Ọlọ́run di olùṣe ìpè náà ní ọ̀nà àdánidá, a sì fi àmì ohùn sí ibi tí ó yẹ.
