  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: ìdúpẹ́ Pọ́ọ̀lù tó ń bá a lọ, «Ọlọ́run mi», «nígbà gbogbo», ìdí ìdúpẹ́ náà (oore-ọ̀fẹ́ Ọlọ́run), ẹ̀bùn tí a fún àwọn olùgbọ́, àti ìṣọ̀kan wọn nínú Mèsáyà Jésù, gbogbo wọn wà níbẹ̀. «Tí a fi fún yín» ń pa passive participle δοθείσῃ mọ́ láì sọ olùfúnni kan ní ọ̀nà tí gbolohun Gíríìkì kò sọ ní tààrà.'
  naturalness: Èdè náà jẹ́ Yorùbá ìgbàlódé tó dára, tó ní ìwọ̀n ìbòwò, tí àmì ohùn rẹ̀ sì péye níbi tó pọ̀jù. «Mo máa ń dúpẹ́ lọ́wọ́ Ọlọ́run mi nígbà gbogbo» jẹ́ ìṣọ̀rọ̀ àdánidá; ìlò «nítorí» méjì náà ṣe ìyàtọ̀ ìdí ẹni tí a ń dúpẹ́ fún àti ìpìlẹ̀ oore-ọ̀fẹ́ náà kedere nínú àyíká ọ̀rọ̀.
  terminology: «Oore-ọ̀fẹ́ Ọlọ́run» jẹ́ ìtumọ̀ tó fìdí múlẹ̀ fún χάρις nínú ọ̀rọ̀ Pọ́ọ̀lù. «Mèsáyà Jésù» ń mú agbára oyè Χριστός hàn, gẹ́gẹ́ bí ìlànà iṣẹ́ náà, nígbà tí àlàyé ìsàlẹ̀ fún «Kristi Jésù» ń pèsè ìyípadà ìbílẹ̀. Àwọn àmì ìsàlẹ̀ a àti b wà níbi tó tọ́, wọ́n sì bá àwọn yíyan ọ̀rọ̀ náà mu.
