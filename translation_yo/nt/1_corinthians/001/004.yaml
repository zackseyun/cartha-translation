id: 1CO.1.4
reference: 1 Corinthians 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: yo
  text: Mo máa ń dúpẹ́ lọ́wọ́ Ọlọ́run mi nígbà gbogbo nítorí yín[a], nítorí oore-ọ̀fẹ́ Ọlọ́run tí a fi fún yín nínú Mèsáyà Jésù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú Kristi Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Mo máa ń dúpẹ́ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí. ‘Mo máa ń dúpẹ́ lọ́wọ́’ jẹ́ èdè Yorùbá àdánidá tó fi hàn pé Pọ́ọ̀lù ń ṣe bẹ́ẹ̀ déédéé.
- source_word: τῷ θεῷ μου
  choice: Ọlọ́run mi
  rationale: Èyí pa ọ̀rọ̀ arọ́pò oníhun ‘mi’ mọ́, ‘dúpẹ́ lọ́wọ́ Ọlọ́run mi’ sì jẹ́ ìṣọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Èyí túmọ̀ adverb náà ní tààrà, ó sì jẹ́ èdè Yorùbá tó wọ́pọ̀.
- source_word: περὶ ὑμῶν
  choice: nítorí yín
  rationale: Nínú ọ̀rọ̀ ìdúpẹ́, ‘nítorí yín’ jẹ́ ọ̀nà àdánidá láti sọ pé àwọn ni ìdí tàbí ohun tí ìdúpẹ́ náà dá lé; àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘nípa yín’ hàn.
- source_word: ἐπὶ τῇ χάριτι
  choice: nítorí oore-ọ̀fẹ́
  rationale: ἐπί pẹ̀lú dative níbí ń sọ ìpìlẹ̀ tàbí ìdí ìdúpẹ́ náà; ‘nítorí’ mú ìbáṣepọ̀ yìí ṣe kedere.
- source_word: χάριτι
  choice: oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó fìdí múlẹ̀ fún χάρις, ó sì pa èrò inú rere àti ẹ̀bùn Ọlọ́run mọ́.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìṣọ̀rọ̀ ‘oore-ọ̀fẹ́ Ọlọ́run’ jẹ́ ti Yorùbá àdánidá, ó sì jẹ́ kí ìtumọ̀ ohun-ìní tàbí orísun má bàjẹ́.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: tí a fi fún yín
  rationale: Èyí pa ìṣe àìsọ ẹni tó ṣe é (passive) mọ́, kò sì fi orúkọ olùfúnni kun ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: ‘Nínú’ pa ìtẹnumọ́ ἐν mọ́ láì dín ìbáṣepọ̀ náà sí ohun èlò tàbí ibi nìkan; ‘Mèsáyà’ sì túmọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni tí a yàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ἐν Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde. Àlàyé ìsàlẹ̀ pa àṣà ìtumọ̀ ‘Kristi Jésù’ mọ́.
- issue: Ẹni tó fún wọn ní oore-ọ̀fẹ́
  choice: tí a fi fún yín
  alternative: tí Ọlọ́run fi fún yín
  rationale: Gíríìkì lo participle passive, kò sì tún sọ olùfúnni ní tààrà. Ìtumọ̀ yìí pa ìṣe passive náà mọ́, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tọ́ka sí Ọlọ́run.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn síbi tó yẹ, a sì lo ‘yín’ láti fi hàn pé arọ́pò ọ̀pọ̀ ènìyàn ni Gíríìkì náà.
