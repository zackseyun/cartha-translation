  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtẹ̀numọ́ àti ète gbolohun Gíríìkì náà dáadáa: Ọlọ́run ni kókó-ọrọ̀ ìṣe méjèèjì, ‘yan’ yẹ fún ἐξελέξατο, àti ‘kí ó lè’ ń fi ἵνα hàn. ‘Àwọn ohun’ ń pa ìwúlò ajẹtífù ọ̀pọ̀ aláìdá mọ́, nígbà tí ‘tí ayé kà sí’ jẹ́ ìtúmọ̀ tó ṣàlàyé ojú ìwòye ayé láìsọ pé ìdájọ́ Ọlọ́run ni. Ṣùgbọ́n ‘dójú ti’ kò ṣe kedere gẹ́gẹ́ bí ìtumọ̀ ìṣe καταισχύνῃ níbí.'
  naturalness: Gbolohun náà jẹ́ Yorùbá boṣewa, ó sì dáa ní ìforígbárí ‘òmùgọ̀/ọlọ́gbọ́n’ àti ‘aláìlera/alágbára.’ Síbẹ̀, ‘mú kí ojú tì’ ni ọ̀nà tí ó hàn gbangba, tí ó sì wọ́pọ̀ jù láti sọ ‘put to shame’; ó yẹ kí a lò ó dípò ‘dójú ti.’
