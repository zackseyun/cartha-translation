  to: Ṣùgbọ́n Ọlọ́run yan àwọn ohun tí ayé kà sí òmùgọ̀[a], kí ó lè mú kí ojú ti àwọn ọlọ́gbọ́n[b]; Ọlọ́run sì yan àwọn ohun tí ayé kà sí aláìlera[c], kí ó lè mú kí ojú ti àwọn alágbára.
  rationale: A rọ́pò ‘dójú ti’ pẹ̀lú ‘mú kí ojú tì,’ ìsọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìtumọ̀ ‘shame’/‘put to shame.’ Àwọn apá yòókù ni a pa mọ́, nítorí wọ́n ń ṣètìlẹ́yìn fún ìtumọ̀ Gíríìkì, ìbáradọ́gba gbolohun náà, àti ìtumọ̀ aláìdínkù ti ajẹtífù aláìdá ọ̀pọ̀.
