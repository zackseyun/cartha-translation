id: 1CO.1.27
reference: 1 Corinthians 1:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run yan àwọn ohun tí ayé kà sí òmùgọ̀[a], kí ó lè mú kí ojú ti àwọn ọlọ́gbọ́n[b]; Ọlọ́run sì yan àwọn ohun tí ayé kà sí aláìlera[c], kí ó lè mú kí ojú ti àwọn alágbára.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí ó jẹ́ òmùgọ̀ ní ayé.” Ọ̀rọ̀ Gíríìkì jẹ́ ajẹtífù ọ̀pọ̀ ní akọ aláìdá tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mú kí ojú ti àwọn ọlọ́gbọ́n.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ohun tí ó jẹ́ aláìlera ní ayé.” Níhìn-ín pẹ̀lú, ọ̀rọ̀ Gíríìkì jẹ́ ajẹtífù ọ̀pọ̀ ní akọ aláìdá tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn sí ọ̀rọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ ìyàtọ̀ náà ní Yorùbá.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: àwọn ohun tí ayé kà sí òmùgọ̀
  rationale: μωρά jẹ́ ajẹtífù ọ̀pọ̀ ní akọ aláìdá tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ. Àyípadà yìí pa ìtọ́kasí sí ‘àwọn ohun’ mọ́, ó sì sọ ojú ìwòye ayé di mímọ́ láìfi hàn pé Ọlọ́run fúnra rẹ̀ ń pe wọ́n ní òmùgọ̀.
- source_word: ἐξελέξατο
  choice: yan
  rationale: ‘Yan’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìṣe Ọlọ́run tó mọ̀ọ́mọ̀ ṣe.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: καταισχύνῃ
  choice: dójú ti
  rationale: ‘Dójú ti’ túmọ̀ sí mímú kí ẹnì kan dojú tì tàbí kí ìgbéraga rẹ̀ bàjẹ́ ní gbangba; ó bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: τοὺς σοφούς
  choice: àwọn ọlọ́gbọ́n
  rationale: Ajẹtífù tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ ni Gíríìkì; ‘àwọn ọlọ́gbọ́n’ jẹ́ ìtúmọ̀ àdánidá, ó sì pa ìtakora ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: àwọn ohun tí ayé kà sí aláìlera
  rationale: Ó pa irú ètò gírámà kan náà mọ́ pẹ̀lú μωρά, kò sì dín ìtọ́kasí náà kù sí ènìyàn nìkan.
- source_word: τὰ ἰσχυρά
  choice: àwọn alágbára
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ aláìdá ọ̀pọ̀, ‘àwọn alágbára’ jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì mú ìtakora pẹ̀lú ‘aláìlera’ jáde kedere.
theological_decisions:
- issue: Bóyá ‘òmùgọ̀’ àti ‘aláìlera’ jẹ́ ìdájọ́ Ọlọ́run tàbí ti ayé
  choice: tí ayé kà sí
  alternative: àwọn ohun òmùgọ̀ ti ayé / àwọn ohun aláìlera ti ayé
  rationale: Genitive τοῦ κόσμου lè túmọ̀ sí ‘ti ayé’ tàbí ohun tí ó rí bẹ́ẹ̀ lójú ayé. Àyípadà yìí mú ìtakora Pọ́ọ̀lù hàn láìsọ pé ìṣirò ayé dájú níwájú Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A tún ìṣe ‘Ọlọ́run yan’ sọ ní ìdajì kejì láti pa ìtẹnumọ́ àti ìbáradọ́gba ọ̀rọ̀ Gíríìkì mọ́.
