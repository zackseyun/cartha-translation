id: 1CO.1.5
reference: 1 Corinthians 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: yo
  text: nítorí pé nínú rẹ̀ ni a sọ yín di ọlọ́rọ̀ ní gbogbo ọ̀nà, nínú gbogbo ọ̀rọ̀ sísọ àti gbogbo ìmọ̀,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà ń sọ ìdí fún ìdúpẹ́ Pọ́ọ̀lù; “nítorí pé” fi ìtumọ̀ ìdí náà hàn ní Yorùbá àdánidá.
- source_word: ἐν παντὶ
  choice: ní gbogbo ọ̀nà
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ gbígbòòrò, “ní gbogbo ọ̀nà” sì jẹ́ Yorùbá àdánidá ju “nínú ohun gbogbo” lọ.
- source_word: ἐπλουτίσθητε
  choice: a ti sọ yín di ọlọ́rọ̀
  rationale: Èyí pa ohùn àìṣe ti Gíríìkì mọ́, ó sì fi hàn pé àwọn ará Kọ́ríńtì gba ọrọ̀ náà láti ọ̀dọ̀ ẹlòmíràn; kò fi dandan mú ọrọ̀ ti ohun ìní ayé wọlé.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Èyí pa èrò ipò tàbí ìṣọ̀kan pẹ̀lú Kristi mọ́, dípò yíyí rẹ̀ sí “nípasẹ̀ rẹ̀.”
- source_word: ἐν παντὶ λόγῳ
  choice: nínú gbogbo ọ̀rọ̀ sísọ
  rationale: Nínú ìbáṣepọ̀ rẹ̀ pẹ̀lú γνώσει, λόγος ṣeé ṣe kí ó tọ́ka sí ọ̀rọ̀ ẹnu tàbí agbára láti sọ ohun tí ẹni mọ̀; “ọ̀rọ̀ sísọ” jẹ́ kedere, ó sì pa ààyè ìtumọ̀ náà mọ́.
- source_word: πάσῃ γνώσει
  choice: gbogbo ìmọ̀
  rationale: “Gbogbo ìmọ̀” tẹ̀ lé ìfararọ̀ Gíríìkì pẹ̀lú “gbogbo ọ̀rọ̀ sísọ,” ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἐν αὐτῷ gẹ́gẹ́ bí ìṣọ̀kan pẹ̀lú Kristi tàbí irinṣẹ́ iṣẹ́ rẹ̀
  choice: nínú rẹ̀
  alternative: nípasẹ̀ rẹ̀
  rationale: A pa ọ̀rọ̀ Pọ́ọ̀lù nípa wíwà “nínú” Kristi mọ́, láì pinnu rẹ̀ sí ìtumọ̀ irinṣẹ́ nìkan.
translation_notes:
  register: Yorùbá ìpele àárín, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “A ti sọ yín di ọlọ́rọ̀” pa àpẹẹrẹ ọrọ̀ Gíríìkì àti ohùn àìṣe mọ́; “ọ̀rọ̀ sísọ” yà ìtumọ̀ λόγος yìí sọ́tọ̀ kúrò nínú “ọ̀rọ̀” gẹ́gẹ́ bí ìránṣẹ́ tàbí àkọsílẹ̀.
