id: 1CO.1.26
reference: 1 Corinthians 1:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: yo
  text: 'Nítorí, ẹ wo ìpè yín, ẹ̀yin ará[a]: kì í ṣe ọ̀pọ̀ nínú yín ló jẹ́ ọlọ́gbọ́n ní ojú ènìyàn; kì í ṣe ọ̀pọ̀ ló jẹ́ alágbára; kì í ṣe ọ̀pọ̀ náà ni a bí sí ìdílé ọlọ́lá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ẹ̀yin ará” níhìn-ín ń tọ́ka sí gbogbo ìjọ, títí kan àwọn obìnrin onígbàgbọ́ àti àwọn ọkùnrin.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: ẹ wo
  rationale: Ọ̀rọ̀ yìí lè jẹ́ àṣẹ tàbí gbólóhùn ìtọ́ka; “ẹ wo” jẹ́ ọ̀nà Yorùbá àdánidá láti rọ àwọn olùgbọ́ pé kí wọ́n fi ọkàn ronú lórí ipò wọn, ó sì tún pa àìdánilójú fọ́ọ̀mù Gíríìkì mọ́ díẹ̀.
- source_word: κλῆσιν
  choice: ìpè
  rationale: “Ìpè” tọ́ka sí pípe tí Ọlọ́run fi pe àwọn onígbàgbọ́, kì í ṣe iṣẹ́-ọwọ́ tàbí ipò wọn láwùjọ.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún àkójọpọ̀ àwọn arákùnrin àti arábìnrin nínú ìjọ, bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ akọ ní gírámà; àlàyé ìṣàkóso yìí wà nínú àkọsílẹ̀ ìsàlẹ̀.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: kì í ṣe ọ̀pọ̀ nínú yín ni ó jẹ́ ọlọ́gbọ́n
  rationale: “Nínú yín” mú ẹni tí gbólóhùn náà ń tọ́ka sí hàn kedere ní Yorùbá, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń béèrè.
- source_word: κατὰ σάρκα
  choice: nípa ìwọ̀n ènìyàn
  rationale: Nínú àyíká yìí, gbólóhùn náà túmọ̀ sí ìdájọ́ tàbí òṣùwọ̀n ti ènìyàn, kì í ṣe ẹran ara ní ti gidi tàbí “ìwà ẹlẹ́ṣẹ̀.”
- source_word: δυνατοί
  choice: alágbára
  rationale: “Alágbára” gba ìtumọ̀ agbára tàbí ipa láwùjọ láì fi irú agbára kan pàtó kún ọ̀rọ̀ náà.
- source_word: εὐγενεῖς
  choice: a bí sí ìdílé ọlọ́lá
  rationale: Èyí fi ìtumọ̀ ìran tàbí ìbí sí ipò gíga láwùjọ hàn kedere, dípò kí “ọlọ́lá” dà bí àpèjúwe ìwà rere lásán.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò. Àtúnṣe “nípa ìwọ̀n ènìyàn” mú ìtumọ̀ àpólà Gíríìkì κατὰ σάρκα jáde ní ti àyíká, nígbà tí àtòjọ mẹ́ta àti ìtẹnumọ́ οὐ πολλοί wà ní dídáàbò bo.
