  source_fidelity: Àfikún “Nítorí náà” yí γάρ (“nítorí/fún”) padà sí ìfẹ̀yìntì lẹ́yìn-ìyẹn; a gbọdọ̀ yọ “náà” kúrò. Ìtumọ̀ “nípa ìwọ̀n ènìyàn” fún κατὰ σάρκα lóye, ṣùgbọ́n “ní ojú ènìyàn” jẹ́ Yorùbá àdánidá síi fún ìdájọ́ nípa ipò ènìyàn láwùjọ nínú àyíká yìí. Àwọn apá mìíràn ń pa ìtẹnumọ́ mẹ́ta ti οὐ πολλοί àti ìtumọ̀ ipò-ìbí ti εὐγενεῖς mọ́.
  naturalness: Ọ̀rọ̀ náà ní ìforúkọsílẹ̀ tó yẹ, ṣùgbọ́n “Nítorí náà” kò bá ìbáṣepọ̀ gbolohun Gíríìkì mu, àti “kì í sì í ṣe” kéré sí ìṣàn gbolohun tó rọrùn ju “kì í ṣe ọ̀pọ̀ náà” lọ. Àtúnṣe náà mú ìṣọ̀kan àtòjọ náà dára síi.
  terminology: “Ìpè,” “alágbára,” àti “a bí sí ìdílé ọlọ́lá” jẹ́ yíyan ọ̀rọ̀ tó péye. “Ẹ̀yin ará” jẹ́ ìkíni ìjọ tó lè kan obìnrin àti ọkùnrin; àkọsílẹ̀ ìsàlẹ̀ lè ṣàlàyé èyí ní ọ̀nà tó rọrùn.
