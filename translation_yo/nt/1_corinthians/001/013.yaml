id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: yo
  text: Ṣé a ti pín Mèsáyà[a] sí apá-apá? Ṣé a kàn Pọ́ọ̀lù mọ́ àgbélébùú fún yín? Àbí a batisí yín sínú orúkọ Pọ́ọ̀lù?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “a batisí yín ní orúkọ Pọ́ọ̀lù?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: ti pínyà sí apá-apá
  rationale: Ọ̀rọ̀ yìí fi ipò tí ìpín ti mú wá hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ti di yíyà sí apá púpọ̀.
- source_word: ὁ Χριστός
  choice: Mèsáyà
  rationale: Àmì ìdánimọ̀ náà mú kí Χριστός dúró gẹ́gẹ́ bí oyè níbí; “Mèsáyà” pa ìtumọ̀ oyè ẹni àmì òróró mọ́.
- source_word: μὴ
  choice: Ṣé …?
  rationale: Ìbéèrè àtakò Yorùbá náà ń retí ìdáhùn òdì láìfi ọ̀rọ̀ àlàyé kún un.
- source_word: ἐσταυρώθη
  choice: a kan … mọ́ àgbélébùú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ikú lórí àgbélébùú; “a” aláìdárúkọ pa ìṣe aláìṣe pàtó ti Gíríìkì mọ́.
- source_word: ὑπὲρ ὑμῶν
  choice: fún yín
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó lè ní ìtumọ̀ nítorí yín tàbí ní ipò yín láìyan ọ̀kan ṣoṣo.
- source_word: ἐβαπτίσθητε
  choice: a batisí yín
  rationale: “Batisí” jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá òde òní mọ̀, ìṣètò gbólóhùn náà sì pa ohùn àìṣe mọ́ ní ti ìtumọ̀.
- source_word: εἰς τὸ ὄνομα
  choice: sínú orúkọ
  rationale: “Sínú” pa agbára ìtọ́sọ́nà àti ìsopọ̀ εἰς mọ́, láìdín un kù sí fífi orúkọ ṣe ohun kan nìkan.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìbéèrè àtakò Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí pé ọ̀rọ̀ náà ní àmì ìdánimọ̀, lílò rẹ̀ gẹ́gẹ́ bí oyè fara hàn gbangba; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ fún òǹkàwé ní ọ̀nà ìbílẹ̀ mìíràn.
- issue: Ìtumọ̀ εἰς τὸ ὄνομα nínú ọ̀rọ̀ nípa ìbatisí
  choice: sínú orúkọ
  alternative: ní orúkọ
  rationale: “Sínú orúkọ” pa àfojúsùn ìsopọ̀ tàbí ìforúkọsílẹ̀ mọ́, ṣùgbọ́n “ní orúkọ” jẹ́ ọ̀nà Yorùbá tí ó mọ́ra jù; a fi méjèèjì sílẹ̀ fún òǹkàwé láìyan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. A lo ìbéèrè “Ṣé …?” àti “Àbí …?” láti pa agbára àwọn ìbéèrè àtakò mẹ́tẹ̀ẹ̀ta mọ́. Èdè náà jẹ́ ti òde òní, ó ṣe kedere, ó sì ní ọlá láìfi èrò ẹ̀ya ìjọ kan kún orísun.
