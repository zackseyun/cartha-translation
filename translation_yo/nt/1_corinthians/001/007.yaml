id: 1CO.1.7
reference: 1 Corinthians 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: yo
  text: tó fi jẹ́ pé ẹ kò ṣe aláìní ẹ̀bùn kankan[a], bí ẹ ti ń fi ìháragàgà retí ìṣípayá[b] Olúwa wa Jésù Kristi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀bùn Ẹ̀mí kankan” tàbí “ẹ̀bùn oore-ọ̀fẹ́ kankan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìfarahàn Olúwa wa Jésù Kristi.”
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “Jésù Kristi”; a tún lè túmọ̀ ọ́ sí “Jésù, ẹni tí í ṣe Mèsáyà” bí a bá fẹ́ mú oyè náà hàn kedere sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: tó fi jẹ́ pé
  rationale: Ó fi àbájáde ohun tí a sọ ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: ẹ kò ṣe aláìní
  rationale: Ó mú ìtumọ̀ àìní tàbí àìpé ohun kan jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: ẹ̀bùn kankan
  rationale: χαρίσμα jẹ́ ẹ̀bùn tí a fi oore-ọ̀fẹ́ fúnni; ‘ẹ̀bùn kankan’ jẹ́ ṣókí, ó sì yẹ fún àyíká ọ̀rọ̀ náà láìfi ìtumọ̀ àlàyé kún un.
- source_word: ἀπεκδεχομένους
  choice: bí ẹ ti ń fi ìháragàgà retí
  rationale: Ó pa ìṣe títẹ̀síwájú àti ìfojúsọ́nà onítara tí participle náà ní mọ́.
- source_word: ἀποκάλυψιν
  choice: ìṣípayá
  rationale: Ó jẹ́ ìbámu taara pẹ̀lú ‘revelation,’ ìyẹn ṣíṣí ohun tí ó farapamọ́ payá; a kò dín un kù sí wíwá tàbí fífarahàn nìkan.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó dúró ṣinṣin fún κύριος nínú lílò Majẹmu Tuntun yìí.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Kristi
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, Χριστοῦ ń ṣiṣẹ́ bí apá orúkọ tí a mọ̀ dáadáa; ‘Jésù Kristi’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì pa ìbáṣepọ̀ rẹ̀ mọ́ Mèsáyà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Kristi
  alternative: Jésù Mèsáyà
  rationale: Gbólóhùn náà dà bí orúkọ àkójọpọ̀ níbí ju bí ìtẹnumọ́ oyè Mèsáyà lọ. Àkọ́lé ìsàlẹ̀ fi ìtumọ̀ oyè náà hàn láìfipá yan ọ̀kan ṣoṣo.
- issue: Ìtumọ̀ ἀποκάλυψιν ní ọ̀rọ̀ nípa ìpadàbọ̀ Olúwa
  choice: ìṣípayá
  alternative: ìfarahàn
  rationale: ‘Ìṣípayá’ tẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì pa àfojúsùn pé Olúwa yóò di mímọ̀ ní gbangba mọ́; ‘ìfarahàn’ jẹ́ ìtumọ̀ àyíká tó ṣeé ṣe.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àjùmọ̀lò tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lò ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn fún ὑμᾶς, ‘ìháragàgà’ sì mú ìfojúsọ́nà onítara jáde láìsọ ọ̀rọ̀ náà di aláṣejù.
