translation:
  language: yo
  text: Nítorí àwọn Júù ń béèrè fún àwọn àmì[a][b], àwọn Gíríìkì sì ń wá ọgbọ́n[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ìbẹ̀rẹ̀ ẹsẹ̀ náà pé, “Níwọ̀n bí àwọn Júù ti ń béèrè fún àwọn àmì, tí àwọn Gíríìkì sì ń wá ọgbọ́n.”
    reason: alternative_reading
  - marker: b
    text: “Àwọn àmì” tún lè túmọ̀ sí “àwọn àmì iṣẹ́ ìyanu.”
    reason: lexical_alternative
  - marker: c
    text: A lè túmọ̀ “àwọn Gíríìkì” ní ọ̀nà tó gbòòrò sí i pé “àwọn Kèfèrí”; ṣùgbọ́n ó ṣeé ṣe kí Pọ́ọ̀lù mọ̀ọ́mọ̀ lo “àwọn Gíríìkì” nítorí ìtọ́kasí rẹ̀ sí ọgbọ́n.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ń fi ìdí tàbí àlàyé ohun tí ó yí ẹsẹ̀ náà ká hàn; “Nítorí” jẹ́ ọ̀nà àdánidá láti pa ìtumọ̀ ìdí mọ́ ní Yorùbá.
- source_word: Ἰουδαῖοι
  choice: àwọn Júù
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ àwọn Júù ní ìyàtọ̀ sí àwọn Gíríìkì.
- source_word: σημεῖα
  choice: àwọn àmì
  rationale: “Àwọn àmì” túmọ̀ ọ̀rọ̀ Gíríìkì náà ní tààrà, ó sì fi àyè sílẹ̀ fún ìtumọ̀ àwọn àmì iṣẹ́ ìyanu láìfi ìtumọ̀ yẹn kún ẹsẹ̀ pàtó.
- source_word: αἰτοῦσιν
  choice: ń béèrè fún
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa ìṣe tí ń lọ lọ́wọ́ nínú ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí mọ́.
- source_word: Ἕλληνες
  choice: àwọn Gíríìkì
  rationale: Èyí pa àwòrán àṣà Gíríìkì tí Pọ́ọ̀lù lò mọ́, pàápàá nítorí ìtọ́kasí ọgbọ́n tí ó tẹ̀ lé e.
- source_word: σοφίαν
  choice: ọgbọ́n
  rationale: “Ọgbọ́n” jẹ́ ìtumọ̀ tààrà tí kò dín ọ̀rọ̀ náà kù sí ọgbọ́n ìmọ̀-ọ̀rọ̀ nìkan.
- source_word: ζητοῦσιν
  choice: ń wá
  rationale: “Ń wá” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó fi ìwádìí tàbí lílépa ohun kan hàn, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
