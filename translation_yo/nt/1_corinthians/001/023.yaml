  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: yo
  text: ṣùgbọ́n àwa ń kéde Mèsáyà tí a kàn mọ́ àgbélébùú[a], ohun ìkọ̀sẹ̀ fún àwọn Júù àti ohun aṣiwèrè fún àwọn tí kì í ṣe Júù[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi tí a kàn mọ́ àgbélébùú.”
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, “àwọn orílẹ̀-èdè”; níbí ó ṣeé ṣe kó túmọ̀ sí àwọn tí kì í ṣe Júù, ní ìyàtọ̀ sí àwọn Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: ń kéde
  rationale: Ó sọ ìkéde ní gbangba bí ti akéde, ó sì jẹ́ èdè Yorùbá àdánidá ní àyíká yìí.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, kì í ṣe bí orúkọ lásán.
- source_word: ἐσταυρωμένον
  choice: tí a kàn mọ́ àgbélébùú
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi hàn pé wọ́n ti kàn án mọ́ àgbélébùú, ó sì pa agbára perfect passive participle mọ́ ní ọ̀nà àdánidá.
- source_word: Ἰουδαίοις
  choice: fún àwọn Júù
  rationale: Ìyàtọ̀ tó wà láàárín Júù àti àwọn orílẹ̀-èdè mìíràn ni àyíká ọ̀rọ̀ náà ń tẹnumọ́.
- source_word: σκάνδαλον
  choice: ohun ìkọ̀sẹ̀
  rationale: Ó pa àwòrán ohun tí ń mú ènìyàn kọsẹ̀ mọ́, dípò kí a sọ ọ́ di ‘ohun ìbínú’ lásán.
- source_word: ἔθνεσιν
  choice: fún àwọn Kèfèrí
  rationale: Nínú ìtakora pẹ̀lú àwọn Júù, ọ̀rọ̀ náà tọ́ka sí àwọn tí kì í ṣe Júù; àlàyé ìsàlẹ̀ fi ìtumọ̀ gbooro rẹ̀ hàn.
- source_word: μωρίαν
  choice: òmùgọ̀
  rationale: Ó mú ìtumọ̀ ohun tí a ka sí aláìgbọ́n tàbí aṣiwèrè jáde ní Yorùbá tó rọrùn, ó sì bá lílo ọ̀rọ̀ náà ní orí kìíní mu.
theological_decisions:
- issue: Ṣíṣe Χριστός bí oyè tàbí bí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká náà ń tẹnumọ́ ẹni tí àwọn aposteli ń kéde àti oyè rẹ̀ gẹ́gẹ́ bí ẹni àmì òróró; nítorí náà, ‘Mèsáyà’ pa iṣẹ́ oyè náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. A pa ìtakora ọ̀rọ̀ náà mọ́ pẹ̀lú ‘ṣùgbọ́n,’ a sì fi àmi ohùn sí ibi tí ó yẹ. ‘Àwọn Kèfèrí’ jẹ́ ọ̀rọ̀ Bíbélì tí ọ̀pọ̀ òǹkàwé Yorùbá mọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣàlàyé rẹ̀ láìfi ìtumọ̀ ẹ̀sìn mìíràn kún un.
