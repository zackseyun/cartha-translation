  source_fidelity: Ìtumọ̀ náà ń pa ìtakora Júù/ẹ̀yà mìíràn, ìkéde àwọn aposteli, àti Mèsáyà tí a kàn mọ́ àgbélébùú mọ́. Síbẹ̀, ‘òmùgọ̀’ sábà ń tọ́ka sí ẹni òmùgọ̀, kì í ṣe ọ̀rọ̀ àfojúrí ‘foolishness’ (μωρία).
