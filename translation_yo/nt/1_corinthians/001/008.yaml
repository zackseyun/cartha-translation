id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: yo
  text: ẹni tí yóò sì mú kí ẹ dúró ṣinṣin[a] títí dé òpin, láìsí ẹ̀sùn kankan[b] ní ọjọ́ Olúwa wa Jésù Mèsáyà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘fìdí yín múlẹ̀’ tàbí ‘mú yín lágbára.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘láìlẹ́bi’ tàbí ‘láìsí ohun tí a lè fi kàn yín.’
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, Christos, ìyẹn ‘ẹni tí a fi òróró yàn’; níhìn-ín a túmọ̀ oyè náà sí ‘Mèsáyà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: yóò sì mú kí ẹ dúró ṣinṣin
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà túmọ̀ sí mímú ẹnì kan fìdí múlẹ̀ tàbí dúró ṣinṣin. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìfìdímúlẹ̀ mọ́.
- source_word: ἕως τέλους
  choice: títí dé òpin
  rationale: Ó fi hàn pé ìdúróṣinṣin náà yóò máa bá a lọ títí dé ibi ìparí tí ọ̀rọ̀ náà ń tọ́ka sí, láìfi ohun tí ‘òpin’ náà jẹ́ kún ẹsẹ yìí.
- source_word: ἀνεγκλήτους
  choice: láìsí ẹ̀sùn kankan
  rationale: Àpèjúwe náà ní ìtumọ̀ pé ẹ̀sùn tí ó lè dúró kò sí; yíyan èyí pa ìhà ọ̀rọ̀ òfin àti ìdájọ́ rẹ̀ mọ́ ju ‘láìlẹ́bi’ nìkan lọ.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: ní ọjọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àkókò náà, ó sì pa àṣà ọ̀rọ̀ Bíbélì nípa ọjọ́ Olúwa mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ jẹ́ ìtumọ̀ Yorùbá tí ó wọ́pọ̀, tí ó bójú mu fún κύριος gẹ́gẹ́ bí oyè.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, dípò kí ó dà bí orúkọ ìdílé.
theological_decisions:
- issue: Ẹni tí ὃς (‘ẹni tí’) ń tọ́ka sí
  choice: Ó ń tọ́ka sí ‘Olúwa wa Jésù Mèsáyà’ ní ẹsẹ 7.
  alternative: Ó lè tọ́ka sí Ọlọ́run tí a mẹ́nu kàn ṣáájú nínú àyíká ọ̀rọ̀ náà.
  rationale: Orúkọ akọ ẹyọ tí ó sún mọ́ ọ jù lọ ni ‘Olúwa wa Jésù Mèsáyà’; bẹ́ẹ̀ ni ìsopọ̀ gírámà tó rọrùn jù lọ jẹ́ pé Jésù ni yóò mú wọn dúró ṣinṣin. A kò fi orúkọ náà tún rọ́pò arọ́pò-orúkọ nínú àyọkà, nítorí náà ìsopọ̀ ọ̀rọ̀ ìpilẹ̀ṣẹ̀ ṣì wà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ẹ’ jẹ́ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀, ‘mú kí ẹ dúró ṣinṣin’ sì jẹ́ gbólóhùn tí òǹkàwé Yorùbá òde òní lè lóye ní rọrùn. A fi ẹsẹ náà sílẹ̀ gẹ́gẹ́ bí gbólóhùn-àfikún tó ń bá ẹsẹ 7 lọ, bí ó ti rí nínú Gíríìkì.
