id: 1CO.1.31
reference: 1 Corinthians 1:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: yo
  text: 'kí ó lè rí gẹ́gẹ́ bí a ti kọ ọ́ pé: “Ẹni tí ó ń ṣògo[a], kí ó ṣògo nínú Olúwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹnikẹ́ni tí ó ń ṣògo, kí ó ṣògo nínú Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ó lè rí
  rationale: Ó mú ète tàbí àbájáde ohun tí ẹsẹ tó ṣáájú sọ jáde; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára ἵνα mọ́.
- source_word: καθὼς γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ọ̀rọ̀ ìtọ́ka sí Ìwé Mímọ́, ó sì fi hàn pé ohun tí a kọ sílẹ̀ ṣì ní agbára.
- source_word: Ὁ καυχώμενος
  choice: Ẹni tí ó bá ń ṣògo
  rationale: Ó tú participle oní-artíkù náà sí ọ̀rọ̀ Yorùbá àdánidá. “Ṣògo” níhìn-ín túmọ̀ sí fífi ohun kan ṣe ìdí ìgbéraga tàbí ìyìn ẹni.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: “Nínú” pa ìtumọ̀ ἐν mọ́ gẹ́gẹ́ bí ibi tàbí ẹni tí ìṣògo yẹ kí ó wà lé, “Olúwa” sì jẹ́ ìtumọ̀ Yorùbá tí ó yẹ fún κυρίῳ.
- source_word: καυχάσθω
  choice: kí ó ṣògo
  rationale: Ìṣàpẹẹrẹ “kí ó” fi agbára àṣẹ tàbí ìyànjú imperative náà hàn ní Yorùbá òde òní láì jẹ́ ọ̀rọ̀ líle tàbí àjèjì.
theological_decisions:
- issue: Agbára àṣẹ inú καυχάσθω
  choice: kí ó ṣògo
  alternative: ó gbọ́dọ̀ ṣògo
  rationale: “Kí ó ṣògo” pa imperative Gíríìkì mọ́ ní ọ̀nà tí ó wọ́pọ̀ ní Yorùbá, nígbà tí “ó gbọ́dọ̀” lè tẹnumọ́ dandan ju bí ọ̀rọ̀ náà ṣe béèrè lọ.
- issue: Ìtumọ̀ κύριος nínú àyọlò náà
  choice: Olúwa
  alternative: olúwa
  rationale: “Olúwa” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ fún κύριος nínú àyíká yìí, ó sì pa ìfojúsùn àyọlò náà mọ́ láì pinnu ju ohun tí ọ̀rọ̀ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ àdánidá, ọlọ́wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. Àmì àlàyé [a] wà lẹ́yìn àyọlò tí ó kan.
