id: 1CO.1.20
reference: 1 Corinthians 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: yo
  text: Níbo ni olóye náà wà? Níbo ni akọ̀wé náà wà? Níbo ni ẹni tó ń ṣe àríyànjiyàn ní ayé ìsinsìnyí wà? Ọlọ́run kò ha ti sọ ọgbọ́n ayé di òmùgọ̀ bí?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni ọlọ́gbọ́n náà.” Ọ̀rọ̀ Gíríìkì náà wà ní akọ-ẹyọ, ṣùgbọ́n ó lè dúró fún gbogbo àwọn ẹni ọlọ́gbọ́n.
    reason: lexical_alternative
  - marker: b
    text: “Ayé ìsinsìnyí” túmọ̀ ọ̀rọ̀ Gíríìkì kan tó yàtọ̀ sí èyí tí a tú sí “ayé” ní apá ìkẹyìn ẹsẹ náà.
    reason: cross_reference
  - marker: c
    text: Tàbí, “Ọlọ́run kò ha ti fi ọgbọ́n ayé hàn pé òmùgọ̀ ni?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: dà?
  rationale: Àṣà Yorùbá ‘X dà?’ jẹ́ ìbéèrè ìpèníjà tó bá ‘Níbo ni X wà?’ mu, ó sì jẹ́ kí àtúnsọ mẹ́ta náà dún lọ́nà àdánidá.
- source_word: σοφός
  choice: ọ̀gbọ́n náà
  rationale: Ó dúró fún ẹni tí a kà sí ọlọ́gbọ́n; lílo orúkọ àpèjúwe gẹ́gẹ́ bí orúkọ ènìyàn jẹ́ àdánidá ní Yorùbá, kò sì fi akọ nìkan mọ́ ọn.
- source_word: γραμματεύς
  choice: akọ̀wé náà
  rationale: ‘Akọ̀wé’ ni ìtumọ̀ tààrà tó pa àwòrán iṣẹ́ ìtàn náà mọ́, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè tọ́ka sí amòfin tàbí ọ̀mọ̀wé.
- source_word: συζητητής
  choice: ajiyàn
  rationale: Ó túmọ̀ sí ẹni tó ń ṣe àríyànjiyàn tàbí tó ń bá ẹlòmíràn jíròrò ní ìfagagbá; ọ̀rọ̀ yìí ṣe kedere fún òǹkàwé òde òní.
- source_word: τοῦ αἰῶνος τούτου
  choice: ti ayé ìsinsìnyí
  rationale: ‘Ayé ìsinsìnyí’ fi αἰών hàn gẹ́gẹ́ bí sáà tàbí ìgbà tó wà yìí, kí a má bà á dapọ̀ mọ́ κόσμος tó tẹ̀ lé.
- source_word: οὐχὶ
  choice: kò ha ti ... bí?
  rationale: Ìrísí ìbéèrè yìí retí ìdáhùn pé bẹ́ẹ̀ ni, ó sì bá ìbéèrè àsọyé Gíríìkì mu.
- source_word: ἐμώρανεν
  choice: sọ ... di òmùgọ̀
  rationale: 'Ó pa agbára ìṣe olùdásílẹ̀ nínú ọ̀rọ̀-ìṣe Gíríìkì mọ́: Ọlọ́run mú kí ohun tí ayé ń pè ní ọgbọ́n hàn tàbí di òmùgọ̀.'
- source_word: σοφίαν
  choice: ọgbọ́n
  rationale: Èyí ni ìbámu Yorùbá tó wọ́pọ̀, ó sì pa ìtakora ọgbọ́n àti òmùgọ̀ mọ́.
- source_word: κόσμου
  choice: ayé
  rationale: ‘Ayé’ ni ìbámu àdánidá fún κόσμος ní àyíká yìí; àfikún ‘ìsinsìnyí’ lórí αἰών ló ń ṣètọ́jú ìyàtọ̀ ọ̀rọ̀ méjèèjì.
theological_decisions:
- issue: Ìyàtọ̀ láàárín αἰών àti κόσμος nínú ẹsẹ kan náà
  choice: αἰών ni ‘ayé ìsinsìnyí,’ κόσμος sì ni ‘ayé’
  alternative: Tú àwọn méjèèjì sí ‘ayé’ láìfi ìyàtọ̀ hàn
  rationale: Pọ́ọ̀lù lo ọ̀rọ̀ Gíríìkì méjì ọ̀tọ̀; ‘ìsinsìnyí’ jẹ́ kí αἰών tọ́ka sí sáà yìí, nígbà tí ‘ayé’ nìkan dúró fún κόσμος.
- issue: Agbára ἐμώρανεν
  choice: ‘sọ ... di òmùgọ̀’ nínú ọ̀rọ̀ àkọ́kọ́, pẹ̀lú àlàyé pé ó tún lè túmọ̀ sí ‘fi ... hàn bí òmùgọ̀’
  alternative: Yan ‘fi ... hàn bí òmùgọ̀’ nìkan
  rationale: Ìtumọ̀ àkọ́kọ́ pa agbára olùdásílẹ̀ mọ́, ṣùgbọ́n àkọsílẹ̀ ẹsẹ pa àìdánilójú tó wà nínú bí a ṣe lè lóye ìṣe náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Àtúnsọ ‘... náà dà?’ jẹ́ ọ̀nà àsọyé àdánidá, tó lágbára, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Èdè náà níyì láìdi èdè àtijọ́ tàbí èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
