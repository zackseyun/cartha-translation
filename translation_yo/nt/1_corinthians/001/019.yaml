base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: yo
  text: 'Nítorí a ti kọ ọ́ pé,


    “Èmi yóò pa ọgbọ́n àwọn ọlọ́gbọ́n run,

    ẹ̀ẹ̀mi yóò sì kọ̀ òye àwọn olóye sílẹ̀.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi yóò sọ òye àwọn olóye di asán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti fi ọ̀rọ̀ àtọ́ka Ìwé Mímọ́ hàn, ó sì pa ìtumọ̀ pé ohun tí a kọ ṣì dúró mọ́.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìdí tàbí ìmúdájú ọ̀rọ̀ tó ṣáájú, gẹ́gẹ́ bí γάρ ṣe ń ṣe.
- source_word: Ἀπολῶ
  choice: Èmi yóò pa ... run
  rationale: Ọ̀rọ̀ yìí fi ìparun tàbí mímú ohun kan wá sí òpin hàn, Yorùbá yìí sì ṣe kedere láìfi ìtumọ̀ míì kún un.
- source_word: σοφίαν τῶν σοφῶν
  choice: ọgbọ́n àwọn ọlọ́gbọ́n
  rationale: Ó pa àtúnṣe gbòǹgbò ọ̀rọ̀ inú Gíríìkì mọ́ nípasẹ̀ ọgbọ́n/ọlọ́gbọ́n, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé.
- source_word: σύνεσιν τῶν συνετῶν
  choice: òye àwọn olóye
  rationale: Òye/olóye pa ìṣọ̀kan ọ̀rọ̀ àti ìfararora rẹ̀ pẹ̀lú ọgbọ́n/ọlọ́gbọ́n mọ́ ní Yorùbá tó rọrùn láti lóye.
- source_word: ἀθετήσω
  choice: Èmi yóò ... kọ ... sílẹ̀
  rationale: Kọ sílẹ̀ fi ìtumọ̀ kíkọ̀ tàbí yíyọ ohun kan kúrò ní ipò rẹ̀ hàn; ó jẹ́ àdánidá, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́ láìsọ ọ́ di ọ̀rọ̀ ìmọ̀ ẹ̀kọ́.
theological_decisions:
- issue: Bí a ṣe máa pa agbára àsọtẹ́lẹ̀ inú àyọlò Aísáyà mọ́
  choice: 'Lo àwọn ọ̀rọ̀ ọjọ́ iwájú tó ṣe tààrà: “Èmi yóò pa ... run” àti “Èmi yóò ... kọ ... sílẹ̀.”'
  alternative: Lo ọ̀rọ̀ ìtumọ̀ síwájú bí “dá ... rú” tàbí “mú ... wá sí òpin.”
  rationale: Àwọn ọ̀rọ̀ ọjọ́ iwájú tó ṣe tààrà pa ìyàtọ̀ láàárín iṣẹ́ Ọlọ́run àti ọgbọ́n ènìyàn mọ́, láìfikún ẹ̀kọ́ ìsìn tí kò sí nínú Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ìfararora ọgbọ́n/ọlọ́gbọ́n àti òye/olóye láti pa ọ̀nà ewì àti ìtẹnumọ́ orísun mọ́.
