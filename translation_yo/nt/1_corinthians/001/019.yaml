  to: 'Nítorí a ti kọ ọ́ pé,


    “Èmi yóò pa ọgbọ́n àwọn ọlọ́gbọ́n run,

    ẹ̀ẹ̀mi yóò sì kọ̀ òye àwọn olóye sílẹ̀.”[a]'
  rationale: A tún “kọ” ṣe sí “kọ̀” nìkan láti fi ohun tó tọ́ hàn àti láti pa ìtumọ̀ ἀθετήσω mọ́. A pa ìyókù ìtumọ̀, ìfararora, ìforúkọsílẹ̀, àti àkọsílẹ̀ abẹ́lẹ̀ rẹ̀ mọ́. A tún ṣe “Èmi” sí “ẹ̀ẹ̀mi” nínú ìlà kejì nínú ọrọ̀ tó tún kọ sílẹ̀ yìí?
  reviewer_model: gpt-5.6-terra
