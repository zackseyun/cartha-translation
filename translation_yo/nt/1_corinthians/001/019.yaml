review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ Gíríìkì mọ́ dáadáa: γάρ jẹ́ “Nítorí,” γέγραπται jẹ́ ọ̀nà ìtọ́kasí Ìwé Mímọ́, àwọn ọ̀rọ̀ ọjọ́ iwájú méjèèjì sì bá Ἀπολῶ àti ἀθετήσω mu. “Ọgbọ́n àwọn ọlọ́gbọ́n” àti “òye àwọn olóye” tún pa ìfararora orísun mọ́.'
  naturalness: 'Ìṣàtúnṣe kékeré kan nílò: ní ìtumọ̀ “kọ̀ ... sílẹ̀” (‘kọ̀/jù sílẹ̀, kọ̀’) a gbọ́dọ̀ fi àmì ohùn ìsàlẹ̀ sí kọ̀. Láìsí i, “kọ” lè dà bí ọ̀rọ̀-ìṣe mìíràn, pàápàá ‘kọ́wé,’ tí ó sì lè mú gbolohun náà dàrú.'
  terminology: “Ọgbọ́n/àwọn ọlọ́gbọ́n” àti “òye/àwọn olóye” jẹ́ ọ̀rọ̀ Yorùbá boṣewa, ó sì yẹ fún ìforúkọsílẹ̀ àsọtẹ́lẹ̀ náà. “Kọ̀ ... sílẹ̀” jẹ́ ìtumọ̀ tó bójú mu fún ἀθετήσω; àlàyé ẹsẹ̀ nínú àkọsílẹ̀ ń pèsè ‘sọ ... di asán’ gẹ́gẹ́ bí àṣàyàn tó sun mọ́ ‘nullify.’
  issues:
  - severity: medium
    issue: Àmì ohùn kò sí lórí “kọ” nínú “èmi yóò sì kọ òye àwọn olóye sílẹ̀.”
    rationale: Níhìn-ín, ọ̀rọ̀-ìṣe náà gbọdọ̀ jẹ́ “kọ̀” (‘kọ̀/jù sílẹ̀; reject, set aside’). “kọ” láìsí àmì ohùn lè jẹ́ aláìmọ̀-ọ̀nà tàbí kí a kà á sí ‘kọ́wé,’ nítorí náà kò bá ìlànà Yorùbá tónìkì pípé mu.
