id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: yo
  text: 'Sí ìjọ Ọlọ́run tí ó wà ní Kọ́ríńtì, sí àwọn tí a ti sọ di mímọ́ nínú Mèsáyà Jésù[a], àwọn ẹni mímọ́ tí a pè[b], pẹ̀lú gbogbo àwọn tí ń pe orúkọ Olúwa wa Jésù Mèsáyà[c] ní ibi gbogbo—ibi tiwọn àti tiwa[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “nínú Kristi Jésù.” “Kristi” àti “Mèsáyà” tú oyè kan náà.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ọ̀rọ̀-sí-ọ̀rọ̀: “àwọn ẹni mímọ́ tí a pè”; ní àṣà ìtumọ̀: “àwọn tí a pè láti jẹ́ àwọn ẹni mímọ́.”'
    reason: lexical_alternative
  - marker: c
    text: A tún lè tú u sí “Jésù Kristi.”
    reason: lexical_alternative
  - marker: d
    text: Gbólóhùn “ní ibi gbogbo—ibi tiwọn àti tiwa” lè túmọ̀ sí gbogbo ibi tí àwọn onígbàgbọ́ ti ń pe Olúwa, tàbí gbogbo ibi tó jẹ́ tiwọn àti tiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àwùjọ àwọn onígbàgbọ́ tí Pọ́ọ̀lù ń kọ̀wé sí mu; kò fi dandan hàn pé ilé ìjọsìn ni.
- source_word: ἡγιασμένοις
  choice: àwọn tí a ti sọ di mímọ́
  rationale: Àpólà yìí pa ohùn àìṣe (passive) àti ìṣe tí a ti ṣe tí àbájáde rẹ̀ ń bá a lọ mọ́, gẹ́gẹ́ bí perfect passive participle Gíríìkì.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jesu
  rationale: “Nínú” pa ìbáṣepọ̀ ἐν mọ́; “Mèsáyà” sì tú Χριστός gẹ́gẹ́ bí oyè, kì í ṣe bí orúkọ ìdílé.
- source_word: κλητοῖς ἁγίοις
  choice: tí a pè láti jẹ́ ẹni mímọ́
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé Ọlọ́run pè wọ́n sí ipò àwọn ẹni mímọ́, bó tilẹ̀ jẹ́ pé Gíríìkì kò ní ọ̀rọ̀ tó túmọ̀ sí “láti jẹ́” ní tààrà.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: tí ń ké pe orúkọ
  rationale: “Ké pe orúkọ” jẹ́ gbólóhùn Yorùbá tó ń fi ìpè ẹ̀sìn, ìgbẹ́kẹ̀lé àti ìjọsìn hàn, ju “pe orúkọ” lásán lọ.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún κύριος nínú ìjẹ́wọ́ Kristẹni nípa Jesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Èyí pa orúkọ Jesu àti oyè Mèsáyà mọ́ láìsọ Χριστός di orúkọ ìdílé.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: ní ibi gbogbo—ibi tiwọn àti tiwa
  rationale: Àmì ìdádúró náà pa ìsopọ̀ Gíríìkì tó kúkúrú mọ́, ó sì yàgò fún pípa ìtumọ̀ méjì tó ṣeé ṣe tì.
theological_decisions:
- issue: Bí a ṣe tú Χριστός
  choice: Mèsáyà ní ibi méjèèjì
  alternative: Kristi
  rationale: Nínú ìkíni yìí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fi àmì òróró yàn. “Mèsáyà” mú ìtumọ̀ oyè náà jáde; àlàyé ìsàlẹ̀ sì tọ́ka sí ọ̀nà àṣà “Kristi.”
- issue: Ìtumọ̀ κλητοῖς ἁγίοις
  choice: tí a pè láti jẹ́ ẹni mímọ́
  alternative: àwọn ẹni mímọ́ tí a pè
  rationale: Ìtumọ̀ àkọ́kọ́ jẹ́ Yorùbá tó rọrùn tó sì fi ìpè Ọlọ́run hàn; àlàyé ìsàlẹ̀ pa àgbékalẹ̀ ajẹtífù méjì ti Gíríìkì àti ìyàtọ̀ kékeré tó wà nínú rẹ̀ mọ́.
- issue: Ìbáṣepọ̀ αὐτῶν καὶ ἡμῶν pẹ̀lú “ibi gbogbo”
  choice: ibi tiwọn àti tiwa
  alternative: ní gbogbo ibi tí àwọn àti àwa ti ń ké pe Olúwa
  rationale: Gíríìkì lè tọ́ka sí gbogbo ibi tí àwọn onígbàgbọ́ ti ń ké pe Olúwa, tàbí sí ibi tó jẹ́ tiwọn àti tiwa. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ pa àìdánilójú yìí mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti èdè òde òní. Àtúnṣe gbolohun jẹ́ àdánidá fún Yorùbá, ṣùgbọ́n ó pa ohùn àìṣe nínú ἡγιασμένοις, oyè Mèsáyà, àti àìdánilójú ìparí ẹsẹ̀ mọ́.
