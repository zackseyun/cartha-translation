  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εὐχαριστῶ ὅτι οὐδένα ὑμῶν ἐβάπτισα εἰ μὴ Κρίσπον καὶ Γάϊον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: yo
  text: Mo dúpẹ́ pé kò sí ẹnikẹ́ni nínú yín tí mo ṣe ìrìbọmi fún, àfi Kírísípù àti Gáyù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Mo dúpẹ́
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìdúpẹ́ tí Paulu ń fi hàn nísinsìnyí, ó sì bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu.
- source_word: ὅτι
  choice: pé
  rationale: Níhìn-ín, ó ń ṣàgbékalẹ̀ ohun tí Paulu dúpẹ́ nípa rẹ̀, kì í ṣe gbólóhùn ìdí ọ̀tọ̀.
- source_word: οὐδένα ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: Pẹ̀lú ‘kò’ tó ṣáájú ọ̀rọ̀-ìṣe, gbólóhùn yìí túmọ̀ sí ‘kò sí ẹnikẹ́ni nínú yín,’ ó sì dùn bí Yorùbá àdánidá.
- source_word: ἐβάπτισα
  choice: ṣe ìrìbọmi fún
  rationale: ‘Ìrìbọmi’ ni ọ̀rọ̀ Bíbélì Yorùbá tí a mọ̀ dáadáa fún βαπτίζω; yíyan rẹ̀ kò fi èrò ẹ̀ya ìjọ kan kún ọ̀nà tí a gbà ṣe e.
- source_word: εἰ μὴ
  choice: àfi
  rationale: ‘Àfi’ fi ìyọkúrò tí ọ̀rọ̀ Gíríìkì ń sọ hàn ní kedere àti ní Yorùbá àdánidá.
- source_word: Κρίσπον
  choice: Kíríspù
  rationale: A kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà kíkọ Yorùbá.
- source_word: Γάϊον
  choice: Gáyù
  rationale: A kọ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà kíkọ Yorùbá.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò; a lo àmì ohùn níbi tí ó bá yẹ. A pa tẹnumọ́ ‘èmi’ mọ́ láti fi ìyàtọ̀ ẹni tí ó ṣe ìrìbọmi hàn, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń tọ́ka.
