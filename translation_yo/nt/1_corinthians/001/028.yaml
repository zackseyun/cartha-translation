id: 1CO.1.28
reference: 1 Corinthians 1:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: yo
  text: Ọlọ́run sì yan àwọn ohun aláìlọ́lá nínú ayé, àti àwọn ohun tí a gàn[a], àwọn ohun tí kò sí, láti sọ àwọn ohun tí ó wà di asán[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí a kà sí asán.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mú àwọn ohun tí ó wà di asán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: àwọn ohun tí a kà sí ẹni tí kò ní ipò nínú ayé
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn tí kò ní ìbí ọlọ́lá tàbí ipò gíga láwùjọ. Ìtumọ̀ yìí mú ìtumọ̀ ipò láwùjọ jáde ní Yorùbá òde òní láì fi ẹ̀gàn kún un.
- source_word: ἐξουθενημένα
  choice: àwọn ohun tí a gàn
  rationale: Ó fi hàn pé a ti wo àwọn wọ̀nyí sí ẹni tí kò níye tàbí a ti hùwà ẹ̀gàn sí wọn; ‘tí a gàn’ jẹ́ ṣókí, ó sì bá àkókò pípé ti participle náà mu.
- source_word: τὰ μὴ ὄντα
  choice: àwọn ohun tí kò sí
  rationale: Ìtumọ̀ tímọ́tímọ́ yìí pa ọ̀rọ̀ Pọ́ọ̀lù tó múni ronú mọ́, ó sì ṣí sí ìtumọ̀ àìsí ní ti gidi àti àìníyì láwùjọ.
- source_word: τὰ ὄντα
  choice: àwọn ohun tí ó wà
  rationale: Ó pa ìtakora tó dọ́gba mọ́ láàárín ‘àwọn ohun tí kò sí’ àti ‘àwọn ohun tí ó wà.’
- source_word: καταργήσῃ
  choice: sọ ... di asán
  rationale: Ó túmọ̀ sí mímú ohun kan di aláìṣiṣẹ́, alágbára-kò, tàbí aláìníyelórí; ‘sọ ... di asán’ jẹ́ èdè Yorùbá àdánidá tí kò fi dandan túmọ̀ sí píparẹ́ ohun náà pátápátá.
- source_word: ἐξελέξατο
  choice: yan
  rationale: ‘Yan’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìṣe Ọlọ́run láti mú àwọn kan jáde gẹ́gẹ́ bí ìfẹ́ rẹ̀.
theological_decisions:
- issue: Bóyá kí a tú τὰ μὴ ὄντα / τὰ ὄντα gẹ́gẹ́ bí ipò láwùjọ nìkan tàbí gẹ́gẹ́ bí ọ̀rọ̀ nípa àìsí àti wíwà.
  choice: 'Pa ìtakora tímọ́tímọ́ mọ́: ‘àwọn ohun tí kò sí’ / ‘àwọn ohun tí ó wà.’'
  alternative: ‘Àwọn tí a kà sí asán’ / ‘àwọn tí a kà sí ẹni pàtàkì.’
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ipò ní ojú ayé, ṣùgbọ́n Pọ́ọ̀lù lo gbólóhùn tó gbòòrò, tó sì lágbára ju ìtumọ̀ ipò láwùjọ nìkan lọ. Títọ́jú ọ̀rọ̀ náà pa ìdọ́gba àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣeé lóye ni a lò. A pa àwòrán ‘àwọn ohun’ inú Gíríìkì mọ́ bí ó tilẹ̀ jẹ́ pé àyíká náà tún lè tọ́ka sí ènìyàn; èyí ń dáàbò bo àìṣedéédé ìtumọ̀ tí Pọ́ọ̀lù mọ̀ọ́mọ̀ lò.
