  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: yo
  text: Nítorí a ti sọ fún mi nípa yín, ẹ̀yin arákùnrin mi[a], láti ọ̀dọ̀ àwọn ènìyàn Kílóè, pé àwọn àríyànjiyàn wà láàrín yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin mi.” Gíríìkì ní “arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀nà tí ó fi ń bá gbogbo àwùjọ àwọn onígbàgbọ́, ọkùnrin àti obìnrin, sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: a ti sọ fún mi
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn kan sọ ìsọfúnni náà di mímọ̀ fún Paulu. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìṣe aláìdárúkọ náà mọ́ láìsọ ẹni tó ṣe é ní pàtó.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìṣírí tó ṣáájú gẹ́gẹ́ bí àlàyé ìdí.
- source_word: περὶ ὑμῶν
  choice: nípa yín
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì bá gbólóhùn Gíríìkì mu.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: A pa akọ púpọ̀ inú Gíríìkì mọ́; àkọsílẹ̀ ìsàlẹ̀ ṣàlàyé pé ó lè ń bá gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin, sọ̀rọ̀.
- source_word: ὑπὸ τῶν Χλόης
  choice: láti ọ̀dọ̀ àwọn ènìyàn Kílóè
  rationale: Gbólóhùn náà tọ́ka sí àwọn tó ní ìbáṣepọ̀ pẹ̀lú Kílóè, láìfi dandan sọ pé àwọn ará ilé rẹ̀ ni.
- source_word: ἔριδες
  choice: ìjà
  rationale: Nínú àyíká yìí, ó túmọ̀ sí awuyewuye àti ìforígbárí láàárín àwọn ènìyàn; “ìjà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yàtọ̀ sí “ìpínya.”
- source_word: ἐν ὑμῖν εἰσιν
  choice: wà láàárín yín
  rationale: Èyí ni ìṣípò gbólóhùn Yorùbá àdánidá fún ìtumọ̀ pé àwọn ìjà ń bẹ láàárín wọn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί nígbà tó ṣeé ṣe kó tọ́ka sí ìjọ tó ní ọkùnrin àti obìnrin
  choice: ẹ̀yin arákùnrin mi
  alternative: ẹ̀yin arákùnrin àti arábìnrin mi
  rationale: A pa irú akọ púpọ̀ tí Gíríìkì lò mọ́ nínú ọ̀rọ̀ àkọ́kọ́, ṣùgbọ́n a jẹ́ kí àkọsílẹ̀ ìsàlẹ̀ sọ pé ìtọ́kasí náà lè kó gbogbo ìjọ pọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “àwọn ènìyàn Kílóè” láti yẹra fún fífi “ará ilé” kún ohun tí Gíríìkì kò sọ ní pàtó.
