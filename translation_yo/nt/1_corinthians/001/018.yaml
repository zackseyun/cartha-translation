  to: Nítorí ọ̀rọ̀ àgbélébùú[a] jẹ́ ìwà òmùgọ̀ fún àwọn tí ń ṣègbé, ṣùgbọ́n fún àwa tí a ń gbà là[b], agbára Ọlọ́run ni.
