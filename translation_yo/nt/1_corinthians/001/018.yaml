id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: yo
  text: Nítorí ọ̀rọ̀ àgbélébùú[a] jẹ́ ìwà òmùgọ̀ fún àwọn tí ń ṣègbé, ṣùgbọ́n fún àwa tí a ń gbà là[b], agbára Ọlọ́run ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn nípa àgbélébùú.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà fi ìgbàlà hàn níbí gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ lọ́wọ́.
    reason: aspectual_clarification
lexical_decisions:
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” lè túmọ̀ sí ọ̀rọ̀ tàbí ìhìn tí a ń kéde; ó pa ìṣọ̀kan gbólóhùn Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ “ìhìn” hàn.
- source_word: σταυροῦ
  choice: àgbélébùú
  rationale: Èyí túmọ̀ ọ̀rọ̀ náà ní tààrà, ó sì pa ọ̀nà ṣókí tí Pọ́ọ̀lù gbà tọ́ka sí ikú Kristi mọ́.
- source_word: ἀπολλυμένοις
  choice: àwọn tí ń ṣègbé
  rationale: “Ń ṣègbé” fi ìṣe tàbí ipò tí ń lọ lọ́wọ́ hàn, ó sì jẹ́ èdè Yorùbá tó ṣe kedere ju gbolohun líle bí “tí a ń parun” lọ.
- source_word: μωρία
  choice: òmùgọ̀
  rationale: Nínú gbólóhùn “jẹ́ òmùgọ̀,” ọ̀rọ̀ yìí fi bí àwọn ènìyàn náà ṣe ka ìhìn àgbélébùú sí ohun aláìlọ́gbọ́n hàn ní èdè Yorùbá àdánidá.
- source_word: σῳζομένοις
  choice: àwa tí a ń gbà là
  rationale: Ìrísí ọ̀rọ̀ Gíríìkì ti àsìkò ìsinsìnyí fi ìgbàlà gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ lọ́wọ́ hàn; “àwa” sì pa ἡμῖν mọ́.
- source_word: δύναμις θεοῦ
  choice: agbára Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì pa ìtẹnumọ́ ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà mọ́.
theological_decisions:
- issue: Ìrísí ìgbàlà nínú σῳζομένοις
  choice: àwa tí a ń gbà là
  alternative: àwa tí a ti gbà là
  rationale: Participle ìsinsìnyí náà ṣàfihàn ìgbàlà gẹ́gẹ́ bí òtítọ́ tó ń lọ lọ́wọ́; a kò yí i padà sí ohun tó ti parí ní àtijọ́ nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A yan “ọ̀rọ̀ àgbélébùú” láti pa ìṣọ̀kan àti ìwọ̀n gbólóhùn orísun mọ́, pẹ̀lú àlàyé ìsàlẹ̀ fún ìtumọ̀ “ìhìn.” Gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
