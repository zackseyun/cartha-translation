  source_fidelity: 'Àwọn ìpín pàtàkì nínú ẹsẹ̀ náà wà ní ìbámu pẹ̀lú Gíríìkì: “ọ̀rọ̀ àgbélébùú” ń pa λόγος τοῦ σταυροῦ mọ́, “àwọn tí ń ṣègbé” àti “àwa tí a ń gbà là” ń fi ìrísí participle ìsinsìnyí hàn, agbára Ọlọ́run sì túmọ̀ δύναμις θεοῦ dáadáa. Síbẹ̀, òmùgọ̀ nìkan kì í ṣiṣẹ́ dáadáa gẹ́gẹ́ bí orúkọ-ìṣàpẹẹrẹ fún μωρία nínú ipò yìí.'
  naturalness: Gbólóhùn náà rọrùn láti kà, ó sì wà ní Yorùbá boṣewa. Àmọ́ “jẹ́ òmùgọ̀” lè túmọ̀ sí pé ọ̀rọ̀ náà jẹ́ ẹni òmùgọ̀, tàbí ó jẹ́ ohun tó jẹ́ òmùgọ̀, dípò orúkọ ìmọ̀ràn “foolishness.” “Jẹ́ ìwà òmùgọ̀” jẹ́ ìlò Yorùbá tó dára, tó sì bá ìforúkọsílẹ̀ Bíbélì mu.
  terminology: Àgbélébùú, ìgbàlà/gbà là, àti agbára Ọlọ́run jẹ́ ọ̀rọ̀ ìsìn Yorùbá tí ó ti fìdí múlẹ̀, tí wọ́n sì tọ́ sí orísun. Àtúnṣe kan ṣoṣo ni láti sọ μωρία di “ìwà òmùgọ̀.”
  issues:
