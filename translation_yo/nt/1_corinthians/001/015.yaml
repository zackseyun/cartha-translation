id: 1CO.1.15
reference: 1 Corinthians 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα μή τις εἴπῃ ὅτι εἰς τὸ ἐμὸν ὄνομα ⸀ἐβαπτίσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/015.yaml
  text: so that no one may say that you were baptized into my name[a].
translation:
  language: yo
  text: kí ẹnikẹ́ni má bàa sọ pé a batisí yín sínú orúkọ mi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní orúkọ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ... má bàa
  rationale: Ìṣètò yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi ète tàbí ohun tí a fẹ́ dènà hàn nínú gbólóhùn òdì.
- source_word: μή τις
  choice: ẹnikẹ́ni má bàa
  rationale: Ó sọ ẹni tí a kò dárúkọ nínú gbólóhùn òdì ní kedere, ó sì bá ìlò Yorùbá mu.
- source_word: εἴπῃ
  choice: sọ
  rationale: Ọ̀rọ̀-ìṣe yìí túmọ̀ sí ‘sọ’; àkópọ̀ ‘kí ... má bàa’ ló ń gbé ìtumọ̀ ìfojúsọ́nà ti subjunctive náà.
- source_word: εἰς
  choice: sínú
  rationale: ‘Sínú’ pa ìtumọ̀ ìtọ́sọ́nà ‘into’ mọ́, dípò kí a tú un sí ‘ní’ láìjẹ́ kí òǹkàwé rí ìṣòro ìtumọ̀ inú Gíríìkì.
- source_word: τὸ ἐμὸν ὄνομα
  choice: orúkọ mi
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe àdánidá fún possessive náà.
- source_word: ἐβαπτίσθητε
  choice: a batisí yín
  rationale: ‘A ... yín’ fi passive Gíríìkì hàn lọ́nà àdánidá ní Yorùbá; ‘batisí’ jẹ́ ọ̀rọ̀ tó mọ́gbọ́n dání nínú àyíká yìí, kò sì pinnu ọ̀nà ìṣe ìbatisí kan ṣoṣo.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ εἰς τὸ ἐμὸν ὄνομα nínú ọ̀rọ̀ ìbatisí
  choice: sínú orúkọ mi
  alternative: ní orúkọ mi
  rationale: ‘Sínú’ tẹ̀ lé agbára ìtọ́sọ́nà εἰς, ó sì pa ìbáṣepọ̀ tàbí ìdánimọ̀ tí gbólóhùn náà lè ní mọ́. ‘Ní orúkọ mi’ ṣe àdánidá sí i ní Yorùbá, ó sì ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀; nítorí náà a fi í sí àlàyé ìsàlẹ̀ dípò kí a fi yanju ìjàngbọ̀n inú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Má bàa’ jẹ́ ọ̀nà àdánidá láti so gbólóhùn yìí mọ́ ète inú ẹsẹ tó ṣáájú. A mọ̀ọ́mọ̀ pa ‘sínú orúkọ mi’ mọ́ bí ó tilẹ̀ jẹ́ pé ó le má ṣe wọ́pọ̀ tó ‘ní orúkọ mi,’ kí ìtumọ̀ εἰς má bàa sọnù.
