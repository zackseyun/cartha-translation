  terminology: Pípa Κηφᾶ sí “Kéfà” ń tọ́jú orúkọ Aramaiki tí ẹsẹ náà lò, kì í sì í rọ́pò rẹ̀ pẹ̀lú Pétérù. “Mèsáyà” jẹ́ ìtumọ̀ oyè Χριστός tó bá ìlànà iṣẹ́ mu; àlàyé ìsàlẹ̀ “Kristi” yẹ, ó sì jẹ́ ìlò ìbílẹ̀ tí ó wọ́pọ̀.
