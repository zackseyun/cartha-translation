id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: yo
  text: Ohun tí mo túmọ̀ sí ni pé, olúkúlùkù yín ń sọ pé, “Èmi jẹ́ ti Pọ́ọ̀lù,” “Èmi sì jẹ́ ti Apọ́lò,” “Èmi sì jẹ́ ti Kéfà,” “Èmi sì jẹ́ ti Mèsáyà.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi jẹ́ ti Kristi.”
    reason: Ọ̀nà ìbílẹ̀ mìíràn láti sọ oyè Χριστός ní Yorùbá.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: Ohun tí mo túmọ̀ sí ni pé
  rationale: Ó fi ìtumọ̀ àlàyé gbólóhùn Gíríìkì hàn ní Yorùbá àdánidá, láìfi èrò míì kún un.
- source_word: ἕκαστος ὑμῶν
  choice: olúkúlùkù yín
  rationale: Ó pa agbára ìpínkiri ἕκαστος mọ́, pé ọ̀kọ̀ọ̀kan lára wọn ló ń sọ ọ̀rọ̀ bẹ́ẹ̀.
- source_word: λέγει
  choice: ń sọ pé
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ bá ìṣe àsìkò ìsinsìnyí nínú Gíríìkì mu, ó sì fi hàn pé àṣà tí ń ṣẹlẹ̀ ni.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: Èmi jẹ́ ti Pọ́ọ̀lù … Èmi jẹ́ ti Apọ́lò … Èmi jẹ́ ti Kéfà … Èmi jẹ́ ti Mèsáyà
  rationale: “Jẹ́ ti” sọ ìbáṣepọ̀ tàbí fífi ara mọ́ ẹgbẹ́ kan hàn, gẹ́gẹ́ bí genitive lẹ́yìn εἰμί, láìdín un kù sí títẹ̀lé ẹni kan nìkan.
- source_word: Κηφᾶ
  choice: Kéfà
  rationale: A ṣe àfọwọ́kọ orúkọ Aramaiki tí Pọ́ọ̀lù lò níbí dípò yíyí i padà sí Pétérù.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí; “Mèsáyà” túmọ̀ oyè náà dípò lílo àfọwọ́kọ ìbílẹ̀ “Kristi.”
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú ọ̀rọ̀ ìfaramọ́ ẹgbẹ́
  choice: Mèsáyà
  alternative: Kristi
  rationale: A pa ìtumọ̀ oyè náà mọ́, bí ó tilẹ̀ jẹ́ pé “Kristi” ni àfọwọ́kọ tí ó wọ́pọ̀ nínú ìlò Kristẹni Yorùbá; àlàyé ìsàlẹ̀ fi ọ̀nà yẹn hàn láìyanjú ìforígbárí ọ̀rọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa tí ó ní àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbo. A tún àwọn ọ̀rọ̀ ẹgbẹ́ náà ṣe ní ìlànà tó jọra láti pa ìtẹnumọ́ Gíríìkì mọ́.
