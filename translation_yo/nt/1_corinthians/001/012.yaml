  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ gbogbogbọ̀ ọrọ̀ Gíríìkì mọ́ dáadáa: ìsọfúnni Pọ́ọ̀lù, “olúkúlùkù yín,” àti ìfaramọ́ tí genitive lẹ́yìn εἰμί ń fi hàn. Síbẹ̀, “tàbí” láàrin gbogbo àwọn ìkéde náà lè mú un dà bí yíyan ọ̀kan nínú àwọn aṣàyàn, níbi tí μέν...δέ...δέ...δέ... ti ń ṣe àtòjọ àwọn ẹgbẹ́ tí ó yàtọ̀. Lílo “sì” ń pa ìṣètò àti ìtẹnumọ́ náà mọ́ dáadáa.'
