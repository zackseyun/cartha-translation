  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: yo
  text: Lẹ́yìn náà, ó farahàn fún Jákọ́bù[a]; lẹ́yìn náà, ó farahàn fún gbogbo àwọn aposteli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ náà pẹkipẹki, “a rí i lọ́dọ̀ Jákọ́bù … àti lọ́dọ̀ gbogbo àwọn aposteli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Lẹ́yìn náà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìṣẹ̀lẹ̀ tó tẹ̀ lé e nínú àtòjọ àwọn ìfarahàn; “Lẹ́yìn náà” jẹ́ èdè Yorùbá àdánidá tó pa ìtẹ̀síwájú àkókò mọ́.
- source_word: ὤφθη
  choice: ó farahàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gírámà tó sún mọ́ ọ̀rọ̀ náà ni “a rí i,” lílo rẹ̀ níhìn-ín jẹ́ ti ìfarahàn lẹ́yìn àjíǹde. “Ó farahàn” ṣe kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: Ἰακώβῳ
  choice: Jákọ́bù
  rationale: Ó jẹ́ ẹni tí ìfarahàn náà tọ̀ sí; “Jákọ́bù” ni àkọsílẹ̀ orúkọ yìí tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: εἶτα
  choice: nígbà náà
  rationale: Ó tún samisi ìgbésẹ̀ tó tẹ̀ lé e nínú àtòjọ náà. “Nígbà náà” yà á díẹ̀ sí “Lẹ́yìn náà” láì yí ìtumọ̀ tẹ̀-lé-tẹ̀-lé padà.
- source_word: ἀποστόλοις
  choice: àwọn aposteli
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí àwọn ẹlẹ́rìí tí a rán ní iṣẹ́ pàtó, kì í ṣe àwọn òjíṣẹ́ lásán. “Aposteli” pa ìtumọ̀ imọ̀-ẹ̀sìn tí a mọ̀ sílẹ̀ mọ́.
- source_word: πᾶσιν
  choice: gbogbo
  rationale: Ó tẹnu mọ́ gbogbo ẹgbẹ́ àwọn aposteli láì dá ẹnikẹ́ni tàbí iye wọn pàtó.
theological_decisions:
- issue: Ta ni “gbogbo àwọn aposteli” ń tọ́ka sí, àti báwo ni ẹgbẹ́ náà ṣe ní í ṣe pẹ̀lú Jákọ́bù?
  choice: A túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí “gbogbo àwọn aposteli,” láì dín ẹgbẹ́ náà kù sí àwọn kan pàtó.
  alternative: Ó lè tọ́ka sí àwọn Méjìlá ní pàtó, tàbí sí ẹgbẹ́ àwọn ẹlẹ́rìí tí a rán tó gbòòrò ju àwọn Méjìlá lọ.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ iye tàbí àwọn ọmọ ẹgbẹ́ náà ní pàtó. Ìtumọ̀ náà pa àìṣedéédé tó wà nínú ọ̀rọ̀ mọ́, ó sì fi ìfarahàn sí Jákọ́bù àti èyí tó tẹ̀ lé e sí gbogbo àwọn aposteli sílẹ̀ gẹ́gẹ́ bí Paulu ṣe tò wọ́n.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ kedere, ọlọ́wọ̀, ó sì yẹ fún kíkà ní gbangba. A lo “farahàn” fún ọ̀nà àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gangan ti fọ́ọ̀mù passive Gíríìkì mọ́.
