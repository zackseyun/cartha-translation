language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: yo
  text: Bí ènìyàn erùpẹ̀ náà ṣe rí, bẹ́ẹ̀ ni àwọn tí wọ́n jẹ́ ti erùpẹ̀ ṣe rí; bí ènìyàn ọ̀run náà sì ṣe rí, bẹ́ẹ̀ ni àwọn tí wọ́n jẹ́ ti ọ̀run ṣe rí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tó tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí: “Irú ẹni tí ènìyàn erùpẹ̀ náà jẹ́, irú wọn náà ni àwọn tí wọ́n jẹ́ ti erùpẹ̀; irú ẹni tí ènìyàn ọ̀run náà jẹ́, irú wọn náà ni àwọn tí wọ́n jẹ́ ti ọ̀run.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Bí ... ti rí, bẹ́ẹ̀ náà ni ...
  rationale: Àkójọpọ̀ ọ̀rọ̀ ìbárapọ̀ yìí fi hàn pé àwọn ọ̀pọ̀ náà ní ìwà tàbí ipò tó bá ti aṣojú wọn mu. Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, ó sì pa ìṣọ̀kan àwọn gbólóhùn méjèèjì mọ́.
- source_word: χοϊκός
  choice: ti erùpẹ̀
  rationale: Ó tọ́ka sí ohun tí a fi erùpẹ̀ dá tàbí tí ìwà rẹ̀ jẹ mọ́ erùpẹ̀, ó sì tún mú ìtọ́kasí sí ìpilẹ̀ṣẹ̀ Ádámù nínú àyíká ẹsẹ̀ náà wá.
- source_word: ὁ χοϊκός
  choice: ènìyàn erùpẹ̀ náà
  rationale: Ọ̀rọ̀ náà dúró fún ẹni kan tí a ń fi wé àwọn ènìyàn mìíràn. Fífi “ènìyàn” kún un mú kí Yorùbá rẹ̀ ṣe kedere, ó sì bá ìyàtọ̀ láàárín Ádámù àti Kristi nínú àyíká ọ̀rọ̀ mu.
- source_word: οἱ χοϊκοί
  choice: àwọn tí wọ́n jẹ́ ti erùpẹ̀
  rationale: Ó ń tọ́ka sí àwọn ènìyàn tí wọ́n ní ìwà tàbí ipò tó bá ti ènìyàn erùpẹ̀ mu, láì sọ ọ́ di kìkì pé wọ́n ń gbé ayé.
- source_word: ἐπουράνιος
  choice: ti ọ̀run
  rationale: Àṣàyàn yìí pa ìtumọ̀ jíjẹ́ ti ọ̀run mọ́, ó sì yà á sọ́tọ̀ kúrò nínú gbólóhùn “láti ọ̀run wá” tí ẹsẹ̀ 47 lò.
- source_word: ὁ ἐπουράνιος
  choice: ènìyàn ọ̀run náà
  rationale: Nínú àyíká ọ̀rọ̀, ẹni náà ni a ń fi tako ènìyàn erùpẹ̀. “Ènìyàn ọ̀run” pa ìfiwéra àwọn aṣojú méjèèjì mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: οἱ ἐπουράνιοι
  choice: àwọn tí wọ́n jẹ́ ti ọ̀run
  rationale: Ó fi hàn pé àwọn ènìyàn ni wọ́n ní ìbáṣepọ̀ pẹ̀lú ènìyàn ọ̀run náà; kò sì mú kí a rò pé àwọn áńgẹ́lì ni.
theological_decisions:
- issue: Bóyá kí a mú ìyàtọ̀ Ádámù àti Kristi hàn gbangba nípa fífi “ènìyàn” kún àwọn ọ̀rọ̀ ẹyọ méjèèjì
  choice: Lò “ènìyàn erùpẹ̀ náà” àti “ènìyàn ọ̀run náà.”
  alternative: “ẹni ti erùpẹ̀ náà” àti “ẹni ti ọ̀run náà”
  rationale: Àyíká 1 Kọ́ríńtì 15:45–49 ń fi Ádámù àti Kristi hàn gẹ́gẹ́ bí aṣojú àwọn ẹgbẹ́ ènìyàn méjì. “Ènìyàn” mú ẹni tí ọ̀rọ̀ ń tọ́ka sí ṣe kedere láì fi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
- issue: Bóyá οἱ ἐπουράνιοι ń tọ́ka sí àwọn ẹ̀dá ọ̀run tàbí sí àwọn ènìyàn tí wọ́n bá ènìyàn ọ̀run mu
  choice: 'Túmọ̀ rẹ̀ sí àwọn ènìyàn: “àwọn tí wọ́n jẹ́ ti ọ̀run.”'
  alternative: “àwọn ẹni ọ̀run”
  rationale: Àyíká náà ń sọ nípa àjíǹde ènìyàn àti bí àwọn ènìyàn ṣe máa ru àwòrán ènìyàn ọ̀run, kì í ṣe nípa àwọn áńgẹ́lì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ adayeba, ọlọ́wọ̀, ó sì pa ìfiwéra tó dọ́gba láàárín ènìyàn erùpẹ̀ àti ènìyàn ọ̀run mọ́.
