id: 1CO.15.52
reference: 1 Corinthians 15:52
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: yo
  text: ní ìṣẹ́jú kan náà[a], ní dídán ojú, ní ìpè ìkẹyìn. Nítorí ìpè náà yóò dún, a ó sì jí àwọn òkú dìde gẹ́gẹ́ bí aláìbàjẹ́, a ó sì yí wa padà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní àkókò kúkúrú tí kò ṣeé pín.” Ọ̀rọ̀ Gíríìkì náà ń tẹnumọ́ bí ohun náà yóò ṣe ṣẹlẹ̀ lójijì gan-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: ní ìṣẹ́jú kan ṣoṣo
  rationale: Ọ̀rọ̀ náà tọ́ka sí àkókò kúkúrú jù lọ, bí ohun tí kò ṣeé pín. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì fi bí ìṣẹ̀lẹ̀ náà yóò ṣe yára hàn láìlo èdè ìmọ̀ ẹ̀rọ.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: ní ìṣẹ́jú tí ojú fi ń ṣẹ́jú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé ohun kan ṣẹlẹ̀ ní kíákíá gan-an, ó sì pa àwòrán ojú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: nígbà tí ìpè ìkẹyìn bá dún
  rationale: Ìtumọ̀ yìí pa àmì àkókò àti àwòrán ìpè mọ́, láìfi ètò ìṣẹ̀lẹ̀ ọjọ́ ìkẹyìn kan pàtó kún ọ̀rọ̀ náà.
- source_word: σαλπίσει
  choice: ìpè náà yóò dún
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì túmọ̀ sí fífi ìpè dún; títún ‘ìpè náà’ sọ mú kí Yorùbá náà ṣe kedere, ó sì so ó mọ́ ìpè ìkẹyìn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: οἱ νεκροὶ
  choice: àwọn òkú
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bójú mu fún àwọn ènìyàn tí wọ́n ti kú lápapọ̀.
- source_word: ἐγερθήσονται
  choice: a ó jí … dìde
  rationale: Ìkọ̀lé aláìdárúkọ ẹni tó ṣe iṣẹ́ náà ń pa ìtumọ̀ ọ̀rọ̀-ìṣe oníṣe-fún-ẹnìkan Gíríìkì mọ́, láìsọ ẹni tó jí wọn dìde ní kedere ju bí ẹsẹ náà ṣe sọ lọ.
- source_word: ἄφθαρτοι
  choice: ní àìbàjẹ́
  rationale: Àìbàjẹ́ sọ ipò tí kò lè díbàjẹ́ tàbí rà mọ́; ó bá àríyànjiyàn Pọ́ọ̀lù nípa ara àjíǹde mu.
- source_word: ἡμεῖς
  choice: àwa
  rationale: Arọ́pò-orúkọ náà hàn gbangba nínú Gíríìkì, ó sì ní ìtẹnumọ́; ‘àwa’ pa ìtẹnumọ́ àti ìyàtọ̀ rẹ̀ sí ‘àwọn òkú’ mọ́.
- source_word: ἀλλαγησόμεθα
  choice: a ó yí àwa padà
  rationale: Ìkọ̀lé yìí pa ìṣe tí a ṣe sí ‘àwa’ mọ́, ó sì túmọ̀ ‘yí padà’ ní tààrà láìṣàlàyé irú ìyípadà náà ju ohun tí orísun sọ lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ‘ìpè ìkẹyìn’ láìgbé ètò ọjọ́ ìkẹyìn ẹ̀kọ́ ìjọ kan wọ inú ẹsẹ náà
  choice: nígbà tí ìpè ìkẹyìn bá dún
  alternative: ní ìpè tó gbẹ̀yìn
  rationale: Orísun sọ ní tààrà pé ìpè náà ni ìkẹyìn, ṣùgbọ́n kò ṣàlàyé gbogbo ètò ìṣẹ̀lẹ̀ ọjọ́ ìkẹyìn; ìtumọ̀ náà fi àyè sílẹ̀ fún àìdánilójú yẹn.
- issue: Ìtumọ̀ ‘àwa’ ní ìbáṣepọ̀ pẹ̀lú àwọn òkú àti ìyípadà
  choice: a ó yí àwa padà
  alternative: a ó yí àwọn tí ó ṣì wà láàyè nínú wa padà
  rationale: A pa arọ́pò-orúkọ ẹni-kìíní ọ̀pọ̀ mọ́ láìfi àlàyé pé ó túmọ̀ sí àwọn tó ṣì wà láàyè kún un, nítorí ẹsẹ náà fúnra rẹ̀ kò sọ ìfikún yẹn ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ìpè’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí a mọ̀ fún fèrè ìkéde, a sì yẹra fún ṣíṣe àlàyé ètò ọjọ́ ìkẹyìn tàbí ẹni tí ‘àwa’ ń tọ́ka sí ju bí Gíríìkì ṣe gba láyè lọ.
