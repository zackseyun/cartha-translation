review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì mọ́: ìpè ìkẹyìn, dídún ìpè náà, àjíǹde àwọn òkú sí àìbàjẹ́, àti ìyípadà ‘àwa.’ Síbẹ̀, ‘ní ìṣẹ́jú kan ṣoṣo’ lè túmọ̀ sí ìṣẹ́jú gangan (minute kan), tí ó gùn ju ἐν ἀτόμῳ lọ. Ìkọ̀lé ‘a ó yí àwa padà’ kò sì jẹ́ ìlò Yorùbá tó rọrùn; ‘a ó yí wa padà’ ni ìkọ̀lé àìmọ ẹni-ṣe tó dára jù, tí ó sì lè ṣàfihàn passive ọjọ́ iwájú náà.'
  naturalness: ‘Ní ìṣẹ́jú tí ojú fi ń ṣẹ́jú’ kò jẹ́ gbólóhùn Yorùbá tó rọrùn fún ‘ní ìṣẹ́jú ojú.’ ‘Ní dídán ojú’ jẹ́ ìfihàn Bíbélì Yorùbá tí ó mọ̀, tí ó sì pa àwòrán ῥιπῇ ὀφθαλμοῦ mọ́. ‘Ní ìpè ìkẹyìn’ tún bá ìtumọ̀ kúkúrú àti ìṣọ̀kan gbolóhùn orísun mu dáadáa.
  terminology: '‘Ìpè,’ ‘àwọn òkú,’ ‘àìbàjẹ́,’ àti ‘yí ... padà’ yẹ fún ìforúkọsílẹ̀ Bíbélì Yorùbá ìgbàlódé. A yí ‘ní àìbàjẹ́’ sí ‘gẹ́gẹ́ bí aláìbàjẹ́’ láti sọ predicative ἄφθαρτοι ní kedere: àwọn òkú ni a jí dìde gẹ́gẹ́ bí ẹni tí kò lè bàjẹ́.'
  issues:
  - severity: medium
    issue: ‘ní ìṣẹ́jú kan ṣoṣo’
    rationale: Ìṣẹ́jú ní Yorùbá òde òní sábà máa ń túmọ̀ sí minute gangan. Bí ó tilẹ̀ jẹ́ pé ó lè ṣiṣẹ́ gẹ́gẹ́ bí ìlò Bíbélì, fífi ‘ṣoṣo’ kún un mú ìtumọ̀ minute kan lágbára, ó sì lè dín ìfẹ̀símúlẹ̀ ‘lẹ́sẹ̀kẹsẹ̀’ ti ἐν ἀτόμῳ kù.
  - severity: medium
    issue: ‘ní ìṣẹ́jú tí ojú fi ń ṣẹ́jú’
    rationale: Ìkọ̀lé náà kò dára gẹ́gẹ́ bí ọ̀nà àdánidá láti túmọ̀ ἐν ῥιπῇ ὀφθαλμοῦ. ‘Ní dídán ojú’ jẹ́ kúkúrú, ó ṣe kedere, ó sì pa àwòrán orísun mọ́.
  - severity: medium
    issue: ‘a ó yí àwa padà’
    rationale: Lẹ́yìn ọ̀rọ̀-ìṣe ‘yí ... padà,’ aṣojú ẹni-kìíní ọ̀pọ̀ tó wọ́pọ̀ ni ‘wa,’ kì í ṣe ‘àwa.’ ‘A ó yí wa padà’ jẹ́ Yorùbá àdánidá, ó sì ń ṣàfihàn passive ọjọ́ iwájú Gíríìkì nípasẹ̀ ìkọ̀lé àìmọ ẹni-ṣe.
