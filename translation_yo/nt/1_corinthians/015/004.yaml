  source_fidelity: 'Ìtumọ̀ náà ń pa àtẹ̀lé Gíríìkì mọ́ dáadáa: ìsìnkú jẹ́ passive, “a ti jí i dìde” ń ṣàfihàn perfect passive náà láìdárúkọ ẹni tó jí i dìde, “ní ọjọ́ kẹta” kò fi ìtumọ̀ ‘lẹ́yìn’ kún un, àti gbolohun àwọn Ìwé Mímọ́ wà ní ibi rẹ̀. Àmọ́, ‘rẹ̀’ jẹ́ àmì ohun-ìní ní pàtàkì; ‘un’ ni arọ́pò-orúkọ ohun tó ṣe kedere jù lẹ́yìn ‘sìnkú’ níbí.'
