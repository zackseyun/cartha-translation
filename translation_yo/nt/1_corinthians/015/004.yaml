  terminology: ‘jí i dìde’ jẹ́ ọ̀rọ̀ tí ó bá ajíǹde mu nínú àyíká yìí, ó sì pa ohùn passive mọ́ nípasẹ̀ ìṣe aláìdárúkọ ‘a’. ‘àwọn Ìwé Mímọ́’ yẹ fún γραφάς.
