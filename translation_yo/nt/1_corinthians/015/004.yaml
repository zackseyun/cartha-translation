  text: àti pé a sìnkú un, àti pé a ti jí i dìde[a] ní ọjọ́ kẹta, gẹ́gẹ́ bí àwọn Ìwé Mímọ́ ti sọ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “a jí i dìde.” Perfect tense Gíríìkì lè tẹnu mọ́ pé àbájáde ajíǹde náà ṣì dúró ní ìsinsìnyí.'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “ní ìbámu pẹ̀lú àwọn Ìwé Mímọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: a sìnkú rẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ aorist passive ti θάπτω, ó sì túmọ̀ sí pé a ṣe ìsìnkú rẹ̀. “A sìnkú rẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ passive náà mọ́ láìfi kún un pé inú ibojì irú wo ni a tẹ́ ẹ sí.
- source_word: ἐγήγερται
  choice: a ti jí i dìde
  rationale: Perfect passive ti ἐγείρω ni. “A ti jí i dìde” pa ohùn passive mọ́, ó sì fi hàn pé ìṣẹ̀lẹ̀ náà ti ṣẹlẹ̀, àbájáde rẹ̀ sì dúró títí di ìsinsìnyí.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: ní ọjọ́ kẹta
  rationale: Èyí ni ìtumọ̀ àdánidá fún gbólóhùn dative tó ń tọ́ka sí àkókò. A kò fi “lẹ́yìn” kún un, nítorí kò sí nínú Gíríìkì.
- source_word: κατὰ τὰς γραφάς
  choice: gẹ́gẹ́ bí àwọn Ìwé Mímọ́ ti wí
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún ohun tí ó bá ẹ̀rí àwọn Ìwé Mímọ́ mu. Ó tún pa ìbáṣepọ̀ gbólóhùn náà pẹ̀lú àṣẹsẹ̀ àsọtẹ́lẹ̀ tàbí ẹ̀rí Ìwé Mímọ́ mọ́.
- source_word: γραφάς
  choice: àwọn Ìwé Mímọ́
  rationale: Nínú lílò Paulu, ọ̀rọ̀ yìí ń tọ́ka sí àwọn ìwé tí a mọ̀ sí Ìwé Mímọ́, kì í ṣe sí àwọn ìwé lásán.
- source_word: ὅτι
  choice: pé
  rationale: “Pé” ń ṣí gbólóhùn àkóónú sílẹ̀ ní Yorùbá, ó sì pa ìlù àtúnlò ọ̀rọ̀ ìjẹ́wọ́ Gíríìkì mọ́.
- source_word: καὶ
  choice: àti
  rationale: A pa àsopọ̀ tí a tún sọ nínú Gíríìkì mọ́ láti fi ìtẹ̀síwájú ọ̀rọ̀ ìjẹ́wọ́ náà hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ọ̀rọ̀ ajíǹde ní ti aspect àti ohùn passive
  choice: a ti jí i dìde
  alternative: a jí i dìde; ó ti jí dìde
  rationale: Perfect passive ἐγήγερται ń fi ajíǹde hàn gẹ́gẹ́ bí ohun tí a ti ṣe tí ipò tàbí àbájáde rẹ̀ ṣì dúró. “A ti jí i dìde” pa ìtumọ̀ yìí àti ohùn passive mọ́ láìdárúkọ ẹni tó ṣe iṣẹ́ náà, gẹ́gẹ́ bí Gíríìkì kò ṣe dárúkọ rẹ̀ níbí.
- issue: Ohun tí “àwọn Ìwé Mímọ́” ń tọ́ka sí
  choice: àwọn Ìwé Mímọ́
  alternative: àwọn ìwé mímọ́ ti àwọn Júù; àwọn ìkọ̀wé mímọ́
  rationale: Gbólóhùn Paulu tọ́ka sí àkójọpọ̀ ìwé mímọ́ tí àwọn olùgbọ́ rẹ̀ mọ̀. Kíkún “ti àwọn Júù” sínú ọ̀rọ̀ pàtàkì yóò fi àlàyé tí Gíríìkì kò sọ ní tààrà kún un.
- issue: Ìbáṣepọ̀ κατὰ τὰς γραφάς pẹ̀lú ajíǹde
  choice: fi gbólóhùn náà lẹ́yìn “ní ọjọ́ kẹta,” gẹ́gẹ́ bí ó ti wà nínú Gíríìkì
  alternative: lílò rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ tó tún kan ìsìnkú
  rationale: Ipò gbólóhùn náà nínú Gíríìkì so ó mọ́ jíjí dìde ní ọjọ́ kẹta ní ọ̀nà tó sun mọ́ jù. A kò gbé e lọ sí ẹ̀yà ìsìnkú tàbí sọ pé ó dájú pé ó kan gbogbo àwọn ẹ̀yà náà.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. “A sìnkú rẹ̀” àti “a ti jí i dìde” jẹ́ ọ̀nà tí òǹkàwé Yorùbá lásán lè lóye, tí ó sì pa àwọn passive Gíríìkì mọ́. Àtúnlò “àti pé” pa ìlù ọ̀rọ̀ ìjẹ́wọ́ inú ẹsẹ náà mọ́.
