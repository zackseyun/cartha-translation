id: 1CO.15.35
reference: 1 Corinthians 15:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: yo
  text: Ṣùgbọ́n ẹnì kan yóò sọ pé,[a] “Báwo ni a ṣe ń jí àwọn òkú dìde, irú ara wo sì ni wọ́n fi ń bọ̀?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Báwo ni àwọn òkú ṣe ń dìde?” Ọ̀rọ̀-ìṣe Gíríìkì wà ní ohùn ìgbàṣe; ní tààrà, “a ń jí wọn dìde,” èyí tó lè tọ́ka sí pé Ọlọ́run ni olùṣe.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn, ó sì darí ọ̀rọ̀ sí ìbéèrè tàbí àtakò tí a retí.
- source_word: ἐρεῖ τις
  choice: ẹnì kan yóò sọ pé
  rationale: Ó pa ìrísí ọ̀rọ̀ ọjọ́ iwájú mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti mú ẹni àròsọ kan wọ inú ìjíròrò.
- source_word: Πῶς
  choice: Báwo ni
  rationale: Ó túmọ̀ ọ̀rọ̀ ìbéèrè nípa ọ̀nà tàbí bí ohun náà ṣe lè ṣẹlẹ̀ ní tààrà.
- source_word: ἐγείρονται
  choice: a ṣe ń jí ... dìde
  rationale: Ìṣètò aláìdárúkọ olùṣe yìí jẹ́ ọ̀nà Yorùbá àdánidá láti pa ohùn ìgbàṣe Gíríìkì mọ́ láì sọ ẹni tó ń jí wọn dìde ní kedere.
- source_word: οἱ νεκροί
  choice: àwọn òkú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún àkójọpọ̀ àwọn ẹni tí ó ti kú.
- source_word: ποίῳ ... σώματι
  choice: irú ara wo ... fi
  rationale: “Irú ... wo” pa agbára ποίῳ mọ́ gẹ́gẹ́ bí ìbéèrè nípa irú tàbí ẹ̀yà ara; “fi” sì bá dative Gíríìkì mu ní Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Ó so ìbéèrè kejì mọ́ ti àkọ́kọ́ láì fi ìtakora líle kún un.
- source_word: ἔρχονται
  choice: ń bọ̀
  rationale: Ó pa ìtumọ̀ ìpilẹ̀ ἔρχομαι, ‘bọ̀,’ mọ́ láì túmọ̀ rẹ̀ sí ‘farahàn’ tàbí tún un ṣe bí ‘jí dìde.’
theological_decisions:
- issue: Ọ̀rọ̀ ajíǹde àti ẹni tó ń ṣe iṣẹ́ náà
  choice: a ṣe ń jí àwọn òkú dìde
  alternative: àwọn òkú ṣe ń dìde
  rationale: Gíríìkì lo ohùn ìgbàṣe. A pa ìtumọ̀ náà mọ́ ní Yorùbá láì sọ Ọlọ́run ní kedere ju bí ẹsẹ náà ṣe sọ lọ; ọ̀nà mìíràn lè mú un dà bí ẹni pé àwọn òkú fúnra wọn ló dìde.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye. A lo ìṣètò aláìdárúkọ olùṣe “a ṣe ń jí” láti jẹ́ kí ohùn ìgbàṣe náà dùn bí Yorùbá àdánidá.
