  - severity: low
    issue: “Àwọn náà” fún ἐκεῖνοι
    rationale: Ó ṣeé lóye, ṣùgbọ́n “àwọn yẹn” jẹ́ ìtọ́kasí ẹni jìnnà/deictic tó ṣe kedere sí àwọn aposteli mìíràn tí a mẹ́nu kàn nínú àyíká ọ̀rọ̀.
  revised_text: Nítorí náà, bóyá èmi ni tàbí àwọn yẹn ni, báyìí ni àwa ń wàásù, báyìí sì ni ẹ̀yin gbàgbọ́.
