  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: yo
  text: Nítorí náà, bóyá èmi ni tàbí àwọn yẹn ni, báyìí ni àwa ń wàásù, báyìí sì ni ẹ̀yin gbàgbọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: ìbáà ṣe ... tàbí
  rationale: Ó fi àwọn méjì tí a ń fi wéra hàn ní ọ̀nà Yorùbá tó ṣe déédé, ó sì pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé tó ṣáájú gẹ́gẹ́ bí ìparí tàbí àbájáde rẹ̀.
- source_word: ἐγὼ ... ἐκεῖνοι
  choice: èmi ... àwọn náà
  rationale: “Èmi” àti “àwọn náà” pa ìyàtọ̀ tó wà láàárín Pọ́ọ̀lù àti àwọn aposteli míì mọ́ láì fi ohun tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: οὕτως
  choice: báyìí ni
  rationale: Ó lè tọ́ka sí ohun tí wọ́n ń kéde tàbí sí ọ̀nà tí wọ́n gbà kéde rẹ̀; lílo ọ̀rọ̀ kan náà lẹ́ẹ̀mejì pa ìbáramu inú Gíríìkì mọ́.
- source_word: κηρύσσομεν
  choice: àwa ń wàásù
  rationale: “Wàásù” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún kíkéde ìhìn rere ní gbangba; fífi “àwa” hàn mú ìtẹnumọ́ ẹni-púpọ̀ inú ọ̀rọ̀ náà jáde.
- source_word: ἐπιστεύσατε
  choice: ẹ̀yin gbàgbọ́
  rationale: Ó sọ ìṣe ìgbà àtijọ́ àwọn ará Kọ́ríńtì ní tààrà, láì fi ohun tí wọ́n gbàgbọ́ sínú ọ̀rọ̀ ní àfikún.
theological_decisions:
- issue: Ìṣọ̀kan ìkéde Pọ́ọ̀lù àti àwọn aposteli yòókù
  choice: Ẹsẹ náà sọ pé, yálà Pọ́ọ̀lù ni tàbí àwọn aposteli yòókù, bákan náà ni wọ́n ń kéde, ohun náà sì ni àwọn ará Kọ́ríńtì gbàgbọ́.
  alternative: 'A lè ka οὕτως gẹ́gẹ́ bí ìtẹnumọ́ ọ̀nà ìwàásù: “ní ọ̀nà yìí ni àwa ń wàásù, ní ọ̀nà yìí sì ni ẹ̀yin gbàgbọ́.”'
  rationale: Ìtumọ̀ náà pa ìṣọ̀kan ẹ̀rí aposteli mọ́, ṣùgbọ́n kò sọ ẹ̀kọ́ nípa ìjọ tàbí ọlá aposteli tó kọjá ohun tí ẹsẹ náà sọ; “báyìí ni” tún pa àìdánilójú kékeré tó wà nínú οὕτως mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ohùn rẹ̀ ní iyì, ó sì ṣe kedere fún òǹkàwé òde òní. A pa àtúnwí “báyìí ni ... báyìí sì ni” mọ́ láti fara mọ́ οὕτως ... οὕτως.
