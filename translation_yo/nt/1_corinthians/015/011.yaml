  naturalness: “Bóyá … tàbí” jẹ́ ìṣọ̀kan tó hàn gbangba, tó sì jẹ́ àdánidá fún “whether … or.” “Àwọn yẹn” tún mú ìtọ́kasí ἐκεῖνοι (“those [others]”) hàn ní kedere ju “àwọn náà” lọ.
  terminology: “Wàásù” yẹ fún κηρύσσομεν nínú ìforúkọsílẹ̀ Bíbélì Yorùbá. “Gbàgbọ́” dá ἐπιστεύσατε bóṣeyẹ, láì ṣàfikún ohun tí a gbàgbọ́ sí i.
