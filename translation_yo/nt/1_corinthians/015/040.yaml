id: 1CO.15.40
reference: 1 Corinthians 15:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: yo
  text: Àwọn ara ti ọ̀run wà, àti àwọn ara ti ayé wà; ṣùgbọ́n ògo àwọn ti ọ̀run yàtọ̀ sí ògo àwọn ti ayé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ara ojú ọ̀run àti àwọn ara orí ilẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: àwọn ara
  rationale: “Ara” ni ìtumọ̀ tààrà fún σῶμα, ó sì pa ìtọ́kasí náà mọ́ ní gbígbòòrò láì fi tipátipá sọ bóyá ara ojú ọ̀run, ara àjíǹde, tàbí irú ara mìíràn ni Pọ́ọ̀lù ní lọ́kàn níbí.
- source_word: ἐπουράνια
  choice: ti ọ̀run
  rationale: “Ti ọ̀run” túmọ̀ sí ohun tí ó jẹ́ ti ọ̀run tàbí tí ó wà ní ọ̀run; ó jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún dídín ìtumọ̀ náà kù sí àwọn ìràwọ̀ àti pílánẹ́ẹ̀tì nìkan.
- source_word: ἐπίγεια
  choice: ti ayé
  rationale: “Ti ayé” bá “ti ọ̀run” mu gẹ́gẹ́ bí ọ̀rọ̀ ìyàtọ̀, ó sì lè tọ́ka sí ohun tí ó jẹ́ ti ayé tàbí tí ó wà lórí ayé.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tí ἀλλά ń ṣe hàn ní kedere àti ní èdè Yorùbá tí ó wọ́pọ̀.
- source_word: ἑτέρα ... ἑτέρα
  choice: ọ̀kan ... òmíràn
  rationale: Ìsọ̀rọ̀ yìí pa ìtumọ̀ irú ògo tí ó yàtọ̀ mọ́, nípasẹ̀ àfiwé “ọ̀kan ... òmíràn,” láì ṣàfikún àlàyé tí kò sí nínú Gíríìkì.
- source_word: δόξα
  choice: ògo
  rationale: “Ògo” pa ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù mọ́, ó sì tún lè gba ìtumọ̀ ọlá, ẹwà, tàbí ìmọ́lẹ̀ àrà ọ̀tọ̀ ní àyíká ẹsẹ̀ yìí.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: àwọn ti ọ̀run ... àwọn ti ayé
  rationale: Gíríìkì fi “ara” sílẹ̀ ní apá kejì nítorí a ti mẹ́nu kàn án tẹ́lẹ̀. Èdè Yorùbá yìí tún pa ìsọ̀rọ̀ kúkúrú náà mọ́, ìtọ́kasí rẹ̀ sì ṣì ṣe kedere.
theological_decisions:
- issue: Ohun tí “àwọn ara ti ọ̀run” àti “àwọn ara ti ayé” ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ ní gbígbòòrò gẹ́gẹ́ bí “àwọn ara ti ọ̀run” àti “àwọn ara ti ayé,” láì dín ìtọ́kasí rẹ̀ kù.
  alternative: A lè sọ pé “àwọn nǹkan ojú ọ̀run àti àwọn nǹkan orí ilẹ̀,” tàbí kí a túmọ̀ wọn sí àwọn ẹ̀dá ọ̀run àti ti ayé.
  rationale: σώματα túmọ̀ sí “àwọn ara,” kì í ṣe “àwọn ẹ̀dá.” Àyíká ọ̀rọ̀ náà ń fi oríṣiríṣi ara àti ògo wọn ṣe àpẹẹrẹ, ṣùgbọ́n kò yẹ kí ìtumọ̀ pinnu pé àwọn ohun ojú ọ̀run nìkan tàbí àwọn áńgẹ́lì nìkan ni a ń sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí ó bá yẹ. A pa àtúnṣe gbolohun Gíríìkì àti ìyàtọ̀ láàárín ti ọ̀run àti ti ayé mọ́ láì sọ ìtọ́kasí náà di ohun kan ṣoṣo.
