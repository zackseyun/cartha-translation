revisions:
- from: Àti gẹ́gẹ́ bí a ti gbé àwòrán ẹni tí a fi erùpẹ̀ dá, bẹ́ẹ̀ náà ni a ó ṣe gbé àwòrán ẹni ti ọ̀run.[a]
  to: Gẹ́gẹ́ bí a ti wọ àwòrán ẹni tí a fi erùpẹ̀ dá, bẹ́ẹ̀ náà ni a ó tún wọ àwòrán ẹni ti ọ̀run.[a]
  rationale: Àtúnṣe náà rọ́pò ọ̀rọ̀ gbígbé tí ó lè dà bí gbígbé ohun ní ti gidi pẹ̀lú “wọ,” èyí tí ó bá φορέω mu nínú àyíká yìí. Ó tún fi “tún” hàn láti tú καί kejì síta, ó sì yọ “ṣe” kúrò nítorí pé kò sí nínú orísun. A pa ọ̀rọ̀ ọjọ́ iwájú SBLGNT mọ́ nínú ìtumọ̀ pàtàkì, a sì pa àyípadà ìṣírí mọ́ nínú àlàyé ìsàlẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:36Z'
