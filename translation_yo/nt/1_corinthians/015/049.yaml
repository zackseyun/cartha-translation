source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: yo
  text: Gẹ́gẹ́ bí a ti wọ àwòrán ẹni tí a fi erùpẹ̀ dá, bẹ́ẹ̀ náà ni a ó tún wọ àwòrán ẹni ti ọ̀run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé afọwọ́kọ kan kà á pé, “ẹ jẹ́ kí a tún wọ àwòrán ẹni ti ọ̀run.”
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: gẹ́gẹ́ bí ... bẹ́ẹ̀ náà
  rationale: Ó fi ìfiwéra tó ṣe kedere hàn láàárín ìṣọ̀kan wa pẹ̀lú ẹni erùpẹ̀ àti ìṣọ̀kan wa lọ́jọ́ iwájú pẹ̀lú ẹni ti ọ̀run.
- source_word: ἐφορέσαμεν
  choice: a ti gbé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí gbígbé tàbí rírú àwòrán kan; ìlò ‘ti’ so ohun tí a ti ní ní ìrírí pọ̀ mọ́ ipò wa báyìí.
- source_word: εἰκόνα
  choice: àwòrán
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún εἰκών, ó sì pa ìbáṣepọ̀ Adamu/Kristi mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τοῦ χοϊκοῦ
  choice: ẹni tí a fi erùpẹ̀ dá
  rationale: χοϊκός ń tọ́ka sí ẹni tí a fi erùpẹ̀ dá, ó sì tún ìtàn ìṣẹ̀dá àti ìyàtọ̀ tó wà nínú àyíká ẹsẹ̀ náà sọ.
- source_word: φορέσομεν
  choice: a ó ṣe gbé
  rationale: A tẹ̀lé ọ̀rọ̀ ọjọ́ iwájú inú SBLGNT, tí ó sọ nípa ohun tí yóò ṣẹlẹ̀; a pa àyípadà ọ̀rọ̀ ìwé afọwọ́kọ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: τοῦ ἐπουρανίου
  choice: ẹni ti ọ̀run
  rationale: Ó pa ìfarajọ pẹ̀lú ‘ẹni tí a fi erùpẹ̀ dá’ mọ́, ó sì tọ́ka sí ẹni ti ọ̀run gẹ́gẹ́ bí àyíká ẹsẹ̀ ti fi hàn.
- source_word: καὶ
  choice: Àti ... náà
  rationale: ‘Àti’ so ẹsẹ̀ náà mọ́ ọ̀rọ̀ tó ṣáájú, ‘náà’ sì mú agbára àfikún inú καί kejì hàn.
theological_decisions:
- issue: Ọ̀rọ̀ ọjọ́ iwájú tàbí ọ̀rọ̀ ìṣírí nínú fáìlì kejì
  choice: a ó ṣe gbé
  alternative: ẹ jẹ́ kí a tún gbé
  rationale: SBLGNT ka φορέσομεν, ọ̀rọ̀ ọjọ́ iwájú, èyí tó bá àríyànjiyàn Pọ́ọ̀lù nípa àjíǹde mu. Nítorí pé àyípadà pàtàkì kan ka ọ̀rọ̀ náà gẹ́gẹ́ bí ìṣírí, a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ẹni tí a fi erùpẹ̀ dá’ mú ìtumọ̀ χοϊκός àti ìtọ́kasí sí ìṣẹ̀dá Adamu hàn ní ọ̀nà tí òǹkàwé lasán lè lóye.
