  source_fidelity: 'Ìtumọ̀ náà fara mọ́ SBLGNT ní pàtàkì: ó pa ìfiwéra καθὼς mọ́, ó tọ́ka sí ẹni tí a fi erùpẹ̀ dá àti ẹni ti ọ̀run, ó sì tẹ̀lé φορέσομεν gẹ́gẹ́ bí ọ̀rọ̀ ọjọ́ iwájú. Ṣùgbọ́n “a ó ṣe gbé” kò mú καί kejì (“also”) hàn ní kedere, ó sì fi “ṣe” kún ọ̀rọ̀ tí kò sí nínú Gíríìkì.'
