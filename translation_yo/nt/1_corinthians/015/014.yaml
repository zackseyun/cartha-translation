  source_fidelity: 'The draft accurately represents the conditional argument: εἰ δέ is conveyed by “Bí … sì,” the perfect passive ἐγήγερται by “a kò bá ti jí Mèsáyà dìde,” and ἄρα by “nígbà náà.” It retains the Greek parallelism by using “ṣófo” for both κενὸν and κενή. The agent of raising remains unexpressed, as in the Greek passive.'
  naturalness: The Yoruba is clear, modern, and appropriately formal. “Ìkéde wa” naturally communicates the public-proclamation sense of κήρυγμα, and “ìgbàgbọ́ yín pẹ̀lú sì ṣófo” is grammatical and preserves the additive force of καί.
  terminology: “Mèsáyà” appropriately follows the project’s titular rendering of Χριστός. “Ìgbàgbọ́” is the natural Yoruba equivalent in this context, and “ṣófo” faithfully follows the chosen sense ‘empty’ rather than unnecessarily interpreting it as ‘useless’ or ‘vain.’
