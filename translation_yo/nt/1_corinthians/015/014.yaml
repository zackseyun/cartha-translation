id: 1CO.15.14
reference: 1 Corinthians 15:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: yo
  text: Bí a kò bá sì ti jí Mèsáyà dìde, nígbà náà ìkéde wa ṣófo, ìgbàgbọ́ yín pẹ̀lú sì ṣófo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A mú un gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, dípò lílò ‘Kristi’ bí ẹni pé orúkọ ni; èyí bá ipa rẹ̀ nínú àríyànjiyàn Pọ́ọ̀lù nípa àjíǹde mu.
- source_word: ἐγήγερται
  choice: a kò bá ti jí ... dìde
  rationale: Ìṣe náà jẹ́ perfect passive; ọ̀rọ̀ yìí pa ìtumọ̀ pé ẹlòmíràn ló jí i dìde mọ́, ó sì fi hàn pé àbájáde ìjíǹde náà ń bá a lọ.
- source_word: κενὸν / κενὴ
  choice: ṣófo
  rationale: ‘Ṣófo’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí kò ní èròjà, ìdí, tàbí ìfìdímúlẹ̀; a tún un lò láti pa ìfarawé ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἄρα
  choice: nígbà náà
  rationale: Ó fi àbájáde ọgbọ́n inú gbólóhùn àdéhùn hàn lọ́nà tó jẹ́ àdánidá ní Yorùbá.
- source_word: κήρυγμα
  choice: ìkéde
  rationale: ‘Ìkéde’ gba ìtumọ̀ ìkéde gbangba tàbí iṣẹ́ akéde, kò sì dín ọ̀rọ̀ náà kù sí ìwàásù nínú ìjọ nìkan.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Ní àyíká yìí ó tọ́ka sí ìdáhùn àwọn ará Kọ́ríńtì nínú gbígbọ́ àti fífi ara lé ohun tí a kéde; ‘ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù.
theological_decisions:
- issue: Ọ̀nà tí a fi sọ àjíǹde àti ẹni tó ṣe iṣẹ́ náà
  choice: a kò bá ti jí Mèsáyà dìde
  alternative: Mèsáyà kò bá ti jí dìde
  rationale: A pa ìrísí àìṣe-fúnra-ẹni (passive) inú Gíríìkì mọ́, kí a má bàa sọ ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ ní tààràtà di ohun kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọlọ́lá, tó sì rọrùn fún gbogbo ènìyàn. A lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè; a sì tún ‘ṣófo’ ṣe láti pa ìtẹnumọ́ àti ìfarawé gbólóhùn orísun mọ́.
