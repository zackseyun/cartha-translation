language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἰδοὺ μυστήριον ὑμῖν λέγω· ⸀πάντες οὐ κοιμηθησόμεθα πάντες δὲ ἀλλαγησόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/051.yaml
  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: yo
  text: 'Ẹ wò ó, mo ń sọ ohun ìjìnlẹ̀ kan fún yín: kì í ṣe gbogbo wa ni yóò sùn[a], ṣùgbọ́n gbogbo wa ni a ó yí wa padà[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ ṣíṣàlàyé sí i, “kì í ṣe gbogbo wa ni yóò kú.” Ọ̀rọ̀ Gíríìkì náà ní “sùn,” àkàwé tí Májẹ̀mú Tuntun sábà máa ń lò fún ikú ní ìmọ́lẹ̀ àjíǹde.
    reason: lexical_alternative
  - marker: b
    text: Ìyàtọ̀ pàtàkì kan nínú àwọn ẹ̀dà ọwọ́ ní, ní ìtumọ̀, “gbogbo wa ni yóò sùn, ṣùgbọ́n kì í ṣe gbogbo wa ni a ó yí wa padà.” Ọ̀rọ̀ inú ẹsẹ̀ yìí tẹ̀ lé ìwé-ẹ̀dà SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kíyèsí i
  rationale: Ó pa agbára ọ̀rọ̀ ìpè fún àfiyèsí mọ́, ó sì bá ìkéde ọlọ́lá mu ní Yorùbá òde òní.
- source_word: μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: Ó tọ́ka sí òtítọ́ Ọlọ́run tí ó ti fara sin tẹ́lẹ̀ ṣùgbọ́n tí a ń ṣí payá, kì í ṣe ohun tí kò ṣeé lóye lásán.
- source_word: ὑμῖν λέγω
  choice: ni mo ń sọ fún yín
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa àdírẹ́sì tààrà àti agbára ìkéde náà mọ́.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: kì í ṣe gbogbo wa ni yóò sùn
  rationale: Ó pa ìtẹnumọ́ Gíríìkì náà mọ́ pé ‘kì í ṣe gbogbo wa,’ ó sì dá àkàwé oorun fún ikú sílẹ̀ nítorí àjíǹde.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: ṣùgbọ́n gbogbo wa ni a ó yí padà
  rationale: ‘Ṣùgbọ́n’ fi ìyàtọ̀ hàn láàárín pé kì í ṣe gbogbo ènìyàn ni yóò kú àti pé gbogbo wọn ni yóò gba ìyípadà; ‘a ó yí padà’ sọ ìṣe tí a ó ṣe sí wọn ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ ‘sùn’ nínú ọ̀rọ̀ àjíǹde
  choice: A pa ‘sùn’ mọ́ gẹ́gẹ́ bí àkàwé fún ikú ti ara ṣáájú àjíǹde.
  alternative: A lè túmọ̀ ọ́ ní ìtumọ̀ ṣíṣàlàyé pé ‘kú.’
  rationale: Àkàwé náà jẹ́ ara èdè Pọ́ọ̀lù nípa ikú ní ojú ìrètí àjíǹde; pípa á mọ́ kò fi ẹ̀kọ́ àdáni kan nípa ipò ọkàn lẹ́yìn ikú kún ọ̀rọ̀ náà.
- issue: Ìyàtọ̀ inú àwọn ẹ̀dà nípa oorun àti ìyípadà
  choice: 'Ọ̀rọ̀ pàtàkì tẹ̀ lé SBLGNT: kì í ṣe gbogbo wa ni yóò sùn, ṣùgbọ́n gbogbo wa ni a ó yí padà.'
  alternative: Ẹ̀dà kan tí ó ṣe pàtàkì ní ìtumọ̀ ní pé gbogbo wa ni yóò sùn, ṣùgbọ́n kì í ṣe gbogbo wa ni a ó yí padà.
  rationale: A túmọ̀ ẹ̀rí orísun tí a pèsè ní tààrà, ṣùgbọ́n a fi ẹ̀dà mìíràn tí ó ní ìtumọ̀ pàtàkì sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìṣedéédé pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àkàwé àti ìforígbárí inú ọ̀rọ̀ orísun mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
