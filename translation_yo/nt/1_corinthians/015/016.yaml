id: 1CO.15.16
reference: 1 Corinthians 15:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: yo
  text: Nítorí bí a kò bá jí àwọn òkú dìde, a kò tilẹ̀ jí Mèsáyà[a] dìde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Kristi.” Oyè Gíríìkì Χριστός lè túmọ̀ sí “Mèsáyà,” tàbí “Kristi” gẹ́gẹ́ bí ìlò ìbílẹ̀ tí ó ti pẹ́.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde, “bí” sì fi ipò àdéhùn εἰ hàn nínú Yorùbá àdánidá.
- source_word: νεκροὶ
  choice: àwọn òkú
  rationale: Ọ̀rọ̀ ajẹtífù ọ̀pọ̀ yìí dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tí ó ti kú; “àwọn òkú” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: οὐκ ἐγείρονται
  choice: a kò bá jí … dìde
  rationale: Ìlò “a” aláìsọ ẹni pàtó pa ohùn àfarawà Gíríìkì mọ́ bí Yorùbá ṣe lè ṣe é, “jí … dìde” sì tọ́ka sí mímú òkú padà sí ìyè.
- source_word: οὐδὲ
  choice: kò tilẹ̀
  rationale: “Tilẹ̀” mú ìtẹnumọ́ ‘kódà … kò’ inú οὐδέ jáde, ó sì bá ìṣàrò Pọ́ọ̀lù mu.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí a fòróró yàn; “Mèsáyà” fi ipa oyè náà hàn dípò kí a ka á sí orúkọ lásán.
- source_word: ἐγήγερται
  choice: a kò … jí … dìde
  rationale: Èdè Yorùbá kò sábà máa fi àkókò pípé hàn ní fọ́ọ̀mù ọ̀rọ̀-ìṣe bí Gíríìkì; nínú àyíká yìí gbólóhùn náà ń sọ pé ìgbéjí náà kò ṣẹlẹ̀, nígbà tí ìlò “a” pa ìtumọ̀ àfarawà mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú àríyànjiyàn nípa àjíǹde
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” jẹ́ kí òǹkàwé rí i pé oyè ẹni tí a fòróró yàn ni Χριστός níbí; àṣàyàn yìí kò yanjú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ kankan síwájú ohun tí orísun sọ.
- issue: Ẹni tó jí àwọn òkú dìde
  choice: a aláìsọ ẹni pàtó
  alternative: Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì lo ohùn àfarawà, kò sì dárúkọ ẹni tó ṣe iṣẹ́ náà nínú ẹsẹ yìí. Nítorí náà, a kò fi “Ọlọ́run” kún ọ̀rọ̀ bí ó tilẹ̀ jẹ́ pé àyíká tó gbòòrò lè tọ́ka sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìṣàkóso gbólóhùn tó bójú mu fún kíkà ní gbangba. “A” jẹ́ arọ́pò-orúkọ aláìsọ ẹni pàtó, kì í ṣe àfikún ẹni tuntun sí ọ̀rọ̀ náà.
