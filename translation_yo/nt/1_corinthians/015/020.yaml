id: 1CO.15.20
reference: 1 Corinthians 15:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsin yìí, a ti jí Mèsáyà[a] dìde kúrò láàárín àwọn òkú; òun ni àkọ́so[b] àwọn tí ó ti sùn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Àwọn méjèèjì ń tú Χριστός; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, “Kristi” sì jẹ́ àfọ̀rọ̀yán tí ó wọ́pọ̀.
    reason: alternative_reading
  - marker: b
    text: “Àkọ́so” ni apá àkọ́kọ́ nínú ìkórè tí a fi rúbọ sí Ọlọ́run; ó túmọ̀ sí pé Mèsáyà ni ẹni àkọ́kọ́, ó sì jẹ́ ìdánilójú ìkórè kíkún tí ń bọ̀.
    reason: cultural_note
  - marker: c
    text: “Àwọn tí ó ti sùn” jẹ́ àkàwé fún àwọn tí ó ti kú, pàápàá nínú àyíká ọ̀rọ̀ àjíǹde.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Ṣùgbọ́n nísinsin yìí
  rationale: Ó fi ìyípadà alágbára hàn láti inú àròsọ pé kò sí àjíǹde sí òtítọ́ tí Pọ́ọ̀lù ń fìdí rẹ̀ múlẹ̀ nísinsin yìí.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Ní àríyànjiyàn ẹ̀kọ́ yìí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ tú ìtumọ̀ oyè náà jáde dípò kí a kàn ṣe àfọ̀rọ̀yán rẹ̀.
- source_word: ἐγήγερται
  choice: a ti jí … dìde
  rationale: Ìṣe àṣekágbá aláìṣe-fúnra-ẹni Gíríìkì tọ́ka sí ohun tí a ti ṣe tí àbájáde rẹ̀ sì dúró títí di ìsinsin yìí; gbolohun Yorùbá yìí pa ìṣe tí a ṣe sí Mèsáyà mọ́ láìdárúkọ olùṣe náà.
- source_word: ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó ṣe àfihàn ọ̀pọ̀ ‘àwọn ẹni tí ó kú’ nínú Gíríìkì, ó sì bá èdè Yorùbá àdánidá mu nínú ọ̀rọ̀ àjíǹde.
- source_word: ἀπαρχὴ
  choice: àkọ́so
  rationale: Àkọ́so ni apá àkọ́kọ́ nínú ìkórè tí a mú wá fún Ọlọ́run; ó ń tọ́ka sí ohun tí ó kọ́kọ́ dé, tí ó sì ń fi ìkórè tó kù dáni lójú.
- source_word: τῶν κεκοιμημένων
  choice: àwọn tí ó ti sùn
  rationale: Ó pa àkàwé Gíríìkì mọ́, níbi tí oorun ti dúró fún ikú, pàápàá nínú àyíká ọ̀rọ̀ àjíǹde.
theological_decisions:
- issue: Ohùn ìṣe àti ẹni tó jí Mèsáyà dìde
  choice: a ti jí Mèsáyà dìde
  alternative: Mèsáyà ti jí dìde
  rationale: Àṣàyàn náà pa ohùn aláìṣe-fúnra-ẹni Gíríìkì mọ́, kó má bàa fi iṣẹ́ Ọlọ́run pamọ́, ṣùgbọ́n kò dárúkọ olùṣe tí ẹsẹ̀ náà fúnra rẹ̀ kò dárúkọ.
- issue: Títúmọ̀ oyè Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká ọ̀rọ̀ náà ń lo Χριστός gẹ́gẹ́ bí oyè ìlérí àti aṣojú; ‘Mèsáyà’ jẹ́ kí ìtumọ̀ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà àfọ̀rọ̀yán tí ó wọ́pọ̀ hàn.
- issue: Àkàwé oorun fún ikú
  choice: àwọn tí ó ti sùn
  alternative: àwọn tí ó ti kú
  rationale: A pa àkàwé inú orísun mọ́, láìsọ ọ́ di ẹ̀kọ́ pé ikú kì í ṣe ikú gidi; àlàyé ìsàlẹ̀ ṣàlàyé ìtumọ̀ rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. “Nísinsin yìí” mú ìtẹnumọ́ νυνὶ jáde; àmì ìdádúró olójú méjì ṣopọ̀ gbólóhùn kejì mọ́ àkọ́kọ́ lọ́nà àdánidá. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
