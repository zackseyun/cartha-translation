    rationale: Κόπος níbí ni làálàá iṣẹ́, ìyẹn iṣẹ́ tó le tàbí tó ń rẹ ẹni. “Iṣẹ́ líle yín” pa ìtumọ̀ náà mọ́ láì yí i sí ìpọnjú.
  - severity: low
    issue: “Ṣe iṣẹ́ ... lọ́pọ̀ yanturu” kò fi ìmọ̀ 'abounding' hàn ní kíkún bí “pọ̀ sí i nínú iṣẹ́” ṣe ń ṣe.
    rationale: Περισσεύοντες sọ nípa jíjẹ́ púpọ̀ sí i/títayọ nínú iṣẹ́ náà, kì í ṣe iye iṣẹ́ tí a ṣe nìkan.
