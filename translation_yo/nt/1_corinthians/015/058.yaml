review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìlò-ìparí Ὥστε, ìpè méjèèjì ἑδραῖοι/ἀμετακίνητοι, ìṣẹ̀lẹ̀ tí ń tẹ̀síwájú nínú περισσεύοντες, àti ìsopọ̀ 'nínú Olúwa' pẹ̀lú làálàá wọn. Síbẹ̀, 'aláìṣeé-mì' kò jẹ́ ọ̀nà Yorùbá tí ó wúlò tàbí tí ó mọ́gbọ́n dání fún ἀμετακίνητοι; 'ẹ má ṣe yẹ̀' sọ ìtumọ̀ náà ní kedere. 'Làálàá' sábà máa ń tọ́ka sí ìnira tàbí ìpọnjú ju iṣẹ́ àṣekára lọ, nítorí náà 'iṣẹ́ líle' sún mọ́ κόπος dáadáa.
  naturalness: Àgbékalẹ̀ ìtumọ̀ náà dára, àmì ohùn sì pé. Àmọ́ 'aláìṣeé-mì' jẹ́ ìṣètò ọ̀rọ̀ tí kò wọ́pọ̀, ó sì lè dà bí ẹni pé kò ṣeé gbọn ní ti ara. 'Ẹ dúró ṣinṣin, ẹ má ṣe yẹ̀' jẹ́ ìsọ̀rọ̀ Yorùbá àdánidá tí ó pa ìyàtọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́. 'Ẹ máa pọ̀ sí i nínú iṣẹ́ Olúwa' tún jẹ́ ìfihàn tí ó ṣàn dáadáa fún 'always abounding in the work of the Lord.'
  terminology: '''Olúwa'' yẹ fún κύριος. A pa ''arákùnrin'' mọ́ gẹ́gẹ́ bí ìrísí akọ ti ἀδελφοί, pẹ̀lú àlàyé ìsàlẹ̀ tó ṣàlàyé ìtọ́kasí rẹ̀ sí gbogbo àwọn onígbàgbọ́ nínú àyíká. ''Iṣẹ́ líle'' ń fi agbára κόπος—iṣẹ́ tó ń rẹ ẹni—hàn dáadáa ju ''làálàá'' lọ.'
  issues:
