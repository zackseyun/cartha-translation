  to: Nítorí náà, ẹ̀yin arákùnrin mi olùfẹ́[a], ẹ dúró ṣinṣin, ẹ má ṣe yẹ̀; ẹ máa pọ̀ sí i nínú iṣẹ́ Olúwa nígbà gbogbo, ní mímọ̀ pé iṣẹ́ líle yín nínú Olúwa kì í ṣe asán.
