id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin arákùnrin mi olùfẹ́[a], ẹ dúró ṣinṣin, ẹ má ṣe yẹ̀; ẹ máa pọ̀ sí i nínú iṣẹ́ Olúwa nígbà gbogbo, ní mímọ̀ pé iṣẹ́ líle yín nínú Olúwa kì í ṣe asán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arákùnrin” túmọ̀ ọ̀rọ̀ Gíríìkì adelphoi; ní àyíká yìí, ó lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìyànjú yìí jẹ́ àbájáde ẹ̀rí nípa àjíǹde tí ó ṣáájú.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ẹ̀yin arákùnrin mi olùfẹ́
  rationale: “Arákùnrin” pa ìrísí akọ ti ọ̀rọ̀ Gíríìkì mọ́, “olùfẹ́” sì fi ἀγαπητοί hàn ní kíkún; àlàyé ìsàlẹ̀ sọ pé gbogbo àwọn onígbàgbọ́, títí kan àwọn obìnrin, lè wà nínú ìtọ́kasí náà.
- source_word: ἑδραῖοι γίνεσθε
  choice: ẹ jẹ́ adúróṣinṣin
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí fún àṣẹ láti wà tàbí di ẹni tí ó fìdí múlẹ̀ ṣinṣin.
- source_word: ἀμετακίνητοι
  choice: aláìṣeé-mì
  rationale: 'Ó pa agbára ọ̀rọ̀ náà mọ́: ẹni tí a kò lè ṣí kúrò ní ipò rẹ̀ tàbí mú yà kúrò nínú ìdánilójú rẹ̀.'
- source_word: περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε
  choice: ẹ máa ṣe iṣẹ́ Olúwa lọ́pọ̀ yanturu nígbà gbogbo
  rationale: Ó sọ ìtẹ̀síwájú àti ọ̀pọ̀ yanturu tí participle náà ní, ní èdè Yorùbá tó ṣàn dáadáa, láì dín “iṣẹ́” kù sí iṣẹ́ ìránṣẹ́ pàtó kan.
- source_word: εἰδότες
  choice: ní mímọ̀
  rationale: Ó pa ìsopọ̀ participle mọ́ láì fi dandan túmọ̀ rẹ̀ sí ìdí tàbí okùnfà.
- source_word: ὁ κόπος ὑμῶν
  choice: làálàá yín
  rationale: “Làálàá” fi iṣẹ́ líle tí ó lè mú àárẹ̀ hàn ju ọ̀rọ̀ gbogbogbò “iṣẹ́” lọ.
- source_word: οὐκ ἔστιν κενὸς
  choice: kì í ṣe asán
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀ fún iṣẹ́ tí kò ṣófo tàbí tí kò já sí asán.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbígbòòrò ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì fi àlàyé kan ṣoṣo—gẹ́gẹ́ bí ìrẹ́pọ̀, ohun èlò, tàbí ìbáṣepọ̀—dípò rẹ̀.
theological_decisions:
- issue: Ìtọ́kasí akọ nínú ἀδελφοί
  choice: A lo “arákùnrin” nínú ẹsẹ̀, a sì ṣàlàyé agbára ìtumọ̀ tó lè ka àwọn obìnrin sí nínú àlàyé ìsàlẹ̀.
  alternative: arákùnrin àti arábìnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí rẹ̀, ṣùgbọ́n ní ọ̀rọ̀ sí gbogbo ìjọ ó lè dúró fún àwọn onígbàgbọ́ lápapọ̀. Ìtumọ̀ yìí pa ìrísí náà mọ́, kò sì fi agbára ìtumọ̀ àyíká pamọ́.
- issue: Ohun tí ἐν κυρίῳ ìkẹyìn ń ṣe àpèjúwe
  choice: A so “nínú Olúwa” mọ́ “làálàá yín.”
  alternative: làálàá yín kì í ṣe asán nítorí Olúwa
  rationale: Ìsọ̀kan yìí bá lílo ọ̀rọ̀ Pọ́ọ̀lù mu, ó sì pa ìtumọ̀ ìbáṣepọ̀ pẹ̀lú Olúwa mọ́ láì sọ ọ́ di ìtumọ̀ okùnfà nìkan.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” ni ọ̀rọ̀ Yorùbá tó yẹ fún akọ́lé κύριος ní àyíká yìí, ó sì pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìwọ̀ntúnwọ̀nsì, ọlọ́lá, tó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. “Adúróṣinṣin, aláìṣeé-mì” pa àtẹ̀lé àwọn ajẹtífù Gíríìkì méjèèjì mọ́; semicolon mú kí ìyànjú tó tẹ̀ lé e ṣe kedere.
