  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: yo
  text: Kì í ṣe gbogbo ẹran-ara ló jọra; ṣùgbọ́n ẹran-ara ènìyàn jẹ́ irú kan, ẹran-ara ẹranko sì jẹ́ òmíràn, ẹran-ara ẹyẹ sì jẹ́ òmíràn, ẹran-ara ẹja sì jẹ́ òmíràn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ ní ọ̀nà àdánidá pé, “Kì í ṣe gbogbo irú ẹran-ara ló jọra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ
  choice: ẹran-ara
  rationale: Nínú ẹsẹ yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹran-ara gidi ti àwọn ẹ̀dá alààyè, kì í ṣe sí ìwà ẹ̀ṣẹ̀. “Ẹran-ara” pa ìtumọ̀ gidi àti àtúnlò ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Kì í ṣe gbogbo ẹran-ara ni ó jẹ́ ọ̀kan náà
  rationale: Èyí fi ìyàtọ̀ láàárín onírúurú ẹran-ara hàn ní Yorùbá àdánidá, ó sì tún pa ìtẹnumọ́ inú Gíríìkì mọ́.
- source_word: ἄλλη
  choice: òmíràn
  rationale: “Òmíràn” ń fi ìyàtọ̀ ẹ̀ka kọ̀ọ̀kan hàn, ó sì pa ìlànà àtúnsọ inú gbólóhùn náà mọ́.
- source_word: ἀνθρώπων
  choice: ènìyàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí gbogbo ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: κτηνῶν
  choice: ẹranko
  rationale: Nínú àkójọ yìí, “ẹranko” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹ̀ka àwọn ẹranko orí ilẹ̀, láì fi ìtumọ̀ náà mọ́ ẹran ọ̀sìn nìkan.
- source_word: πτηνῶν
  choice: ẹyẹ
  rationale: “Ẹyẹ” ni ọ̀rọ̀ Yorùbá àdánidá jù lọ fún ẹ̀ka àwọn ẹ̀dá tí ń fò nínú àkójọ yìí.
- source_word: ἰχθύων
  choice: ẹja
  rationale: “Ẹja” bá ìtumọ̀ ẹ̀ka gbogbo irú ẹja mu ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ Pọ́ọ̀lù nípa àjíǹde
  choice: ẹran-ara ní ìtumọ̀ gidi
  alternative: ara; ẹ̀dá; ìwà ẹlẹ́ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ náà ń sọ nípa onírúurú ara àwọn ẹ̀dá alààyè. Nítorí náà, ìtumọ̀ gidi ni ó yẹ; kò sí ìdí láti yí i padà sí ìtumọ̀ nípa ẹ̀ṣẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà pa àtúnsọ “òmíràn” mọ́ láti fi ìlànà àti ìtẹnumọ́ Pọ́ọ̀lù hàn, ṣùgbọ́n a fi “irú” kún apá àkọ́kọ́ àkójọ náà kí ìtumọ̀ ẹ̀ka lè ṣe kedere ní Yorùbá.
