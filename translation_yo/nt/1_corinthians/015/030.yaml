  text: Why are we also in danger every hour?[a]
translation:
  language: yo
  text: Èéṣe tí àwa pẹ̀lú fi ń wà nínú ewu ní gbogbo wákàtí?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìlànà ọ̀rọ̀, “Kí ni ìdí tí àwa pẹ̀lú fi ń wà nínú ewu ní gbogbo wákàtí?” Nínú àyíká ọ̀rọ̀ yìí, ìbéèrè náà ń béèrè ìdí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: Èé ṣe tí ... fi
  rationale: Nínú ìbéèrè àsọ àsọyé yìí, τί ń béèrè ìdí tàbí èrò inú ìṣe náà; ọ̀nà Yorùbá yìí mú agbára àríyànjiyàn Paulu jáde lọ́nà àdánidá.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi Paulu àti àwọn ẹlẹgbẹ́ rẹ̀ kún àwọn àpẹẹrẹ tó ṣáájú, ó sì pa ìtumọ̀ àfikún mọ́.
- source_word: ἡμεῖς
  choice: àwa
  rationale: A pa arọ́pò-orúkọ tí a sọ ní gbangba nínú Gíríìkì mọ́; ‘àwa pẹ̀lú’ ń fi ìtumọ̀ àfikún náà hàn.
- source_word: κινδυνεύομεν
  choice: ń wà nínú ewu
  rationale: Ó túmọ̀ sí wíwà nínú ewu tàbí ní ipò tí ewu ti lè dé bá ẹni; yíyan yìí kò fi kún un pé wọ́n ń fi ẹ̀mí wọn wewu.
- source_word: πᾶσαν ὥραν
  choice: ní gbogbo wákàtí
  rationale: Ó tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì ní pẹ́kípẹ́kí, ó sì lè túmọ̀ sí pé ewu náà ń bá wọn dé nígbà gbogbo.
theological_decisions:
- issue: Agbára ìbéèrè àsọ àsọyé nínú àríyànjiyàn Paulu nípa àjíǹde
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìbéèrè àsọ àsọyé tó ń béèrè ìdí tí àwọn aposteli fi ń dojú kọ ewu bí àwọn òkú kò bá jíǹde.
  alternative: A lè tẹ̀ lé τί ní ọ̀rọ̀-ọ̀rọ̀ gẹ́gẹ́ bí ‘Kí ni...?’
  rationale: Ìtòlẹ́sẹẹsẹ Gíríìkì àti ọ̀rọ̀ tó yí ẹsẹ náà ká fi hàn pé ìbéèrè náà jẹ́ apá àríyànjiyàn, kì í ṣe wíwá ìsọfúnni lásán; a kò sì yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà ju ohun tí ọ̀rọ̀ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. ‘Èé ṣe tí ... fi’ jẹ́ ọ̀nà àdánidá láti sọ ìbéèrè ìdí; ‘ní gbogbo wákàtí’ pa àwòrán orísun mọ́ dípò ‘nígbà gbogbo.’
