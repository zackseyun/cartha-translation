  naturalness: Gbolohun ẹsẹ náà jẹ́ Yorùbá boṣewa, ó sì yẹ fún ìforúkọsílẹ̀ ọlọ́lá. A túnṣe ìkọ̀wé ‘Èé ṣe’ sí ‘Èéṣe,’ ìkọ̀wé tó wọ́pọ̀ jù fún ọ̀rọ̀ ìbéèrè yìí. A tún ṣe àtúnkọ ẹsẹ̀-àlàyé náà kí ó lè jẹ́ Yorùbá tó rọrùn, kí ó sì má ṣe pe ara rẹ̀ ní ‘ọ̀rọ̀-ìsọ̀rọ̀’ nígbà tí kò ṣe é ṣe láti tú ìlànà Gíríìkì náà kalẹ̀ ní ọ̀rọ̀-fún-ọ̀rọ̀ láì di àìdánidá.
  terminology: ‘Ewu’ yẹ fún κινδυνεύω nínú ẹsẹ yìí, kò sì fi ‘ẹ̀mí’ tàbí irú ewu kan pàtó kún un. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tàbí orúkọ tó nílò àtúnṣe.
