reference: 1 Corinthians 15:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: yo
  text: Bí[a], ní sísọ̀rọ̀ gẹ́gẹ́ bí ènìyàn lásán, mo bá àwọn ẹranko ẹhànnà jà[b] ní Éfésù, kí ni àǹfààní náà fún mi? Bí a kò bá jí àwọn òkú dìde, “Ẹ jẹ́ kí a jẹ, kí a sì mu[c], nítorí ọ̀la ni a ó kú.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí ó ṣeé ṣe: “Bí, láti ojú ìwòye ènìyàn lásán, mo bá àwọn ẹranko ẹhànnà jà ní Éfésù…” Gbólóhùn náà lè tọ́ka sí ọ̀nà tí Pọ́ọ̀lù gbà ń sọ̀rọ̀ tàbí sí ojú ìwòye rẹ̀.'
    reason: lexical_alternative
  - marker: b
    text: A lè lóye “mo bá àwọn ẹranko ẹhànnà jà” ní ti ẹranko gidi tàbí gẹ́gẹ́ bí àkàwé fún ìtakò líle láti ọ̀dọ̀ àwọn ènìyàn oníwà ìkà; a pa ọ̀rọ̀ Gíríìkì náà mọ́ nínú ẹsẹ̀.
    reason: alternative_reading
  - marker: c
    text: Ọ̀rọ̀ tí a fa yọ tàbí ìtọ́kasí sí Aísáyà 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: ní sísọ̀rọ̀ gẹ́gẹ́ bí ènìyàn lásán
  rationale: Ó tú ọ̀rọ̀ àkànlò èdè Gíríìkì náà sí Yorùbá àdánidá gẹ́gẹ́ bí ọ̀nà sísọ tàbí ojú ìwòye ènìyàn lásán, láìfi ìtumọ̀ kan ṣoṣo múlẹ̀ pátápátá.
- source_word: ἐθηριομάχησα
  choice: mo bá àwọn ẹranko ẹhànnà jà
  rationale: Ó pa àwòrán gidi inú ọ̀rọ̀ Gíríìkì mọ́, láìdájọ́ nínú ẹsẹ̀ náà bóyá ẹranko gidi ni Pọ́ọ̀lù ń sọ tàbí àkàwé fún àwọn alátakò oníwà ìkà.
- source_word: ἐν Ἐφέσῳ
  choice: ní Éfésù
  rationale: Àkọsílẹ̀ orúkọ ibi náà ní ìbámu pẹ̀lú ìpè Yorùbá tó wọ́pọ̀.
- source_word: τί μοι τὸ ὄφελος
  choice: kí ni èrè rẹ̀ fún mi?
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó pa agbára ìbéèrè àsọyé àti èrò àǹfààní tàbí èrè mọ́.
- source_word: νεκροὶ
  choice: àwọn òkú
  rationale: Èyí ni ìtumọ̀ àdánidá fún ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ, ó sì bá àyíká ọ̀rọ̀ àjíǹde mu.
- source_word: ἐγείρονται
  choice: a kò bá jí àwọn òkú dìde
  rationale: Ìṣọ̀rí aláìlórúkọ Yorùbá pa ìtumọ̀ ìṣe tí a ṣe sí àwọn òkú mọ́, láìṣàlàyé ẹni tó jí wọn dìde sínú ẹsẹ̀ náà.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: Ẹ jẹ́ kí a máa jẹ, kí a sì máa mu
  rationale: Ìlò “Ẹ jẹ́ kí a…” fi agbára ọ̀rọ̀ ìrọ̀rọ̀ hortatory subjunctive Gíríìkì hàn ní Yorùbá àdánidá.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: nítorí ọ̀la ni a ó kú
  rationale: Ó sọ ìtọ́kasí sí ọjọ́ iwájú ní kedere, ó sì pa ìró ọ̀rọ̀ tí a fa yọ láti inú Aísáyà mọ́.
theological_decisions:
- issue: Bóyá ἐθηριομάχησα túmọ̀ sí jíjà pẹ̀lú ẹranko gidi tàbí ó jẹ́ àkàwé fún ìtakò líle láti ọ̀dọ̀ àwọn ènìyàn
  choice: A fi “mo bá àwọn ẹranko ẹhànnà jà” sínú ẹsẹ̀ náà, láìyan ìtumọ̀ gidi tàbí àkàwé ní pàtó.
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà gẹ́gẹ́ bí ìjà pẹ̀lú àwọn alátakò ènìyàn oníwà ìkà ní Éfésù.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àwòrán ẹranko ẹhànnà, ìdí ẹsẹ̀ náà kò sì béèrè pé kí atúmọ̀ èdè yanjú ìbéèrè ìtàn yìí. Nítorí náà, a pa àìdánilójú tó wà nínú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹranko ẹhànnà” láti pa àwòrán orísun mọ́, “kí ni èrè rẹ̀ fún mi?” fún ìbéèrè àsọyé àdánidá, àti ìṣọ̀rí aláìlórúkọ “a…jí” láti ṣàfihàn ìṣe àjíǹde tí a ṣe sí àwọn òkú.
