id: 1CO.15.53
reference: 1 Corinthians 15:53
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: yo
  text: Nítorí ara yìí tí ó lè bàjẹ́ gbọ́dọ̀ wọ àìdíbàjẹ́[a], ara yìí tí ó lè kú sì gbọ́dọ̀ wọ àìleèkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó sún mọ́ Gíríìkì pẹkipẹki, “ohun yìí tí ó lè bàjẹ́ gbọ́dọ̀ wọ àìdíbàjẹ́, ohun yìí tí ó lè kú sì gbọ́dọ̀ wọ àìleèkú.” Gíríìkì kò sọ “ara” ní tààràtà nínú ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ jẹ́ kó ṣe kedere pé ara ni a ń tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: Ó fi dandan àti ohun tí kò lè má ṣẹlẹ̀ hàn ní èdè Yorùbá àdánidá, gẹ́gẹ́ bí àríyànjiyàn Pọ́ọ̀lù nípa ìyípadà àjíǹde ṣe béèrè.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé ẹsẹ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé sí i.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: ara eléyìí tí ó lè díbàjẹ́
  rationale: φθαρτός túmọ̀ sí ohun tí ìbàjẹ́ lè dé bá. A fi “ara” kún un láti inú àyíká ọ̀rọ̀ nípa àjíǹde ara, kí ìtumọ̀ lè ṣe kedere ní Yorùbá.
- source_word: ἐνδύσασθαι
  choice: wọ
  rationale: Ó pa àkàwé aṣọ tó wà nínú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì ṣe déédéé.
- source_word: ἀφθαρσίαν
  choice: àìdíbàjẹ́
  rationale: Ó sọ ipò tí ìbàjẹ́ kò lè dé bá, ó sì pa ìyàtọ̀ tó wà láàárín φθαρτός àti ἀφθαρσία mọ́.
- source_word: καὶ
  choice: sì
  rationale: Ó so àwọn gbólóhùn méjèèjì pọ̀ ní ọ̀nà Yorùbá tó ṣàn déédéé, ó sì pa ìfararora wọn mọ́.
- source_word: τὸ θνητὸν τοῦτο
  choice: ara eléyìí tí ó lè kú
  rationale: θνητός ń tọ́ka sí ohun tí ikú lè dé bá. “Ara” jẹ́ ohun tí àyíká ọ̀rọ̀ mú kedere.
- source_word: ἀθανασίαν
  choice: àìleèkú
  rationale: Ó túmọ̀ sí ipò tí ikú kò lè dé bá, ó sì bá “tí ó lè kú” ṣe ìyàtọ̀ ní kedere.
theological_decisions:
- issue: Fífi “ara” kún àwọn ajẹtífù tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ, bí ó tilẹ̀ jẹ́ pé σώμα kò sí nínú ẹsẹ yìí
  choice: ara eléyìí tí ó lè díbàjẹ́ … ara eléyìí tí ó lè kú
  alternative: ohun eléyìí tí ó lè díbàjẹ́ … ohun eléyìí tí ó lè kú
  rationale: Àyíká ọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀ (ẹsẹ 42–54) ń sọ nípa àjíǹde àti ìyípadà ara. Fífi “ara” hàn mú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere láìfi ẹ̀kọ́ ìgbàgbọ́ tuntun kún un; àlàyé ìsàlẹ̀ sì jẹ́ kí òǹkàwé mọ ohun tí Gíríìkì sọ ní pẹ́kípẹ́kí.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “wọ” láti pa àkàwé aṣọ mọ́, a sì lo “àìdíbàjẹ́” àti “àìleèkú” láti fi ìfararora àti ìyàtọ̀ inú Gíríìkì hàn.
