id: 1CO.15.37
reference: 1 Corinthians 15:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: yo
  text: Àti ohun tí o bá fúnrúgbìn, kì í ṣe ara tí yóò wáyé ni o fúnrúgbìn, bí kò ṣe ọkà lásán[a]—bóyá ti àlìkámà tàbí ti irúgbìn mìíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkà ní ìhòòhò.”
    reason: Ó pa ìtumọ̀ gidi γυμνόν (“ní ìhòòhò” tàbí “tí kò ní ohun bò ó”) mọ́, bí ó tilẹ̀ jẹ́ pé “ọkà lásán” dùn bí Yorùbá àdánidá jù.
lexical_decisions:
- source_word: σπείρεις
  choice: fúnrúgbìn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ àgbẹ̀ fún fífi irúgbìn sínú ilẹ̀; ó sì pa àwòrán Pọ́ọ̀lù nípa irúgbìn mọ́.
- source_word: σῶμα
  choice: ara
  rationale: “Ara” ni ìtumọ̀ tààrà, ó sì ṣe pàtàkì nínú àríyànjiyàn Pọ́ọ̀lù nípa àjíǹde ara.
- source_word: τὸ γενησόμενον
  choice: tí yóò wá sí ìwà
  rationale: Ó sọ nípa ohun tí yóò wá sí ìwà lẹ́yìn náà, láì dín un kù sí ohun ọ̀gbìn tí yóò hù nìkan.
- source_word: γυμνὸν κόκκον
  choice: ọkà lásán
  rationale: “Ọkà” lè tọ́ka sí èso tàbí irúgbìn kékeré, “lásán” sì mú èrò ohun tí kò tíì ní ara tí yóò ní lẹ́yìn náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: εἰ τύχοι
  choice: bóyá
  rationale: Ó pa ìtumọ̀ àpẹẹrẹ tàbí ohun tí ó lè jẹ́ mọ́, dípò ṣíṣe e ní gbólóhùn oníṣ شرط gidi.
- source_word: σίτου
  choice: àlìkámà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ Gíríìkì náà tọ́ka sí àlìkámà ní pàtó.
- source_word: τινος τῶν λοιπῶν
  choice: ti irúgbìn mìíràn
  rationale: Èyí sọ ní Yorùbá àdánidá pé àlìkámà jẹ́ àpẹẹrẹ kan lára àwọn irú irúgbìn mìíràn.
theological_decisions:
- issue: Ìbáṣepọ̀ irúgbìn pẹ̀lú ara àjíǹde
  choice: Pa “ara” àti ọ̀rọ̀ ọjọ́ iwájú mọ́ láì tú àkàwé náà ju ohun tí ẹsẹ náà sọ lọ.
  alternative: Túmọ̀ ọ́n sí “ohun ọ̀gbìn tí yóò hù.”
  rationale: Ẹsẹ náà ń lo àkàwé iṣẹ́ àgbẹ̀, ṣùgbọ́n ó mọ̀ọ́mọ̀ lo “ara.” Ìtumọ̀ yìí pa ìtẹ̀síwájú àti ìyípadà tí ọ̀rọ̀ náà ń fi hàn mọ́, láì fi ẹ̀kọ́ ìsìn àfikún sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “o” dípò “ìwọ” nítorí ó bá gbólóhùn àlàyé mu, a sì fi àmì ohùn sí ibi tí ó yẹ.
