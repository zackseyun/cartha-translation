id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: yo
  text: Ṣùgbọ́n bí a kò bá tíì jí Mèsáyà[a] dìde, asán ni ìgbàgbọ́ yín[b]; ẹ ṣì wà nínú àwọn ẹ̀ṣẹ̀ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìgbàgbọ́ yín kò lérè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A lò ó gẹ́gẹ́ bí oyè fún ẹni tí Ọlọ́run yàn tí ó sì fi òróró yàn, kì í ṣe bí orúkọ lásán; èyí bá ipa Χριστός mu ní àríyànjiyàn ẹ̀kọ́ ìjíǹde yìí.
- source_word: ἐγήγερται
  choice: a kò bá ti jí … dìde
  rationale: Ìṣẹ̀dá yìí fi ìṣe tí a ṣe sí Mèsáyà hàn, ó sì pa àbájáde tí ó ń bá a lọ mọ́ gẹ́gẹ́ bí perfect passive Gíríìkì, láì sọ ẹni tó jí i dìde ní pàtó.
- source_word: ματαία
  choice: asán
  rationale: “Asán” sọ pé ìgbàgbọ́ náà kò ní èrè tàbí àbájáde tí a retí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó bá ọ̀rọ̀ ματαία mu.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Níhìn-ín, ọ̀rọ̀ náà tọ́ka sí gbígbọ́ àti gbígbẹ́kẹ̀lé ìhìn rere àwọn ará Kọ́ríńtì, kì í ṣe ìṣòtítọ́ wọn ní pàtàkì.
- source_word: ἔτι
  choice: ṣì
  rationale: “Ṣì” fi hàn pé ipò náà ń bá a lọ títí di ìsinsìnyí, bí Mèsáyà kò bá ti jí dìde.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: nínú àwọn ẹ̀ṣẹ̀ yín
  rationale: A pa àwòrán Gíríìkì “nínú” mọ́, èyí tó ń sọ ipò tí ẹ̀ṣẹ̀ àti ẹ̀bi rẹ̀ ṣì ń ṣàkóso.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ohun tí a sọ ṣáájú hàn nínú ìjiyàn Pọ́ọ̀lù.
theological_decisions:
- issue: Ọ̀nà tí a gbà sọ ìjíǹde àti ẹni tó ṣe iṣẹ́ náà
  choice: a kò bá ti jí Mèsáyà dìde
  alternative: Mèsáyà kò bá ti jí dìde
  rationale: Ìtumọ̀ tí a yàn pa ìṣe aláìlórúkọ tí a ṣe sí Mèsáyà mọ́, nítorí Gíríìkì jẹ́ passive; kò fi “Ọlọ́run” kún un níbi tí ẹsẹ náà kò ti sọ ọ́ ní tààrà.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí “Kristi” jẹ́ ìtumọ̀ ìbílẹ̀ tó sábà dà bí orúkọ.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Gbólóhùn náà jẹ́ ti òde òní, ó ní iyì, ó sì pa ìtẹ̀sí ìjiyàn Pọ́ọ̀lù àti àwòrán “nínú àwọn ẹ̀ṣẹ̀” mọ́.
