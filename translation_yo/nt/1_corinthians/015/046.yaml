language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: yo
  text: Ṣùgbọ́n ohun ti í ṣe ti ẹ̀mí kì í ṣe àkọ́kọ́[a], bí kò ṣe ohun ti í ṣe ti ìwàláàyè àdánidá[b]; lẹ́yìn náà ni ohun ti í ṣe ti ẹ̀mí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Ara ti ẹ̀mí kì í ṣe àkọ́kọ́, bí kò ṣe ara ti ìwàláàyè àdánidá; lẹ́yìn náà ni ara ti ẹ̀mí.’ Pọ́ọ̀lù kò lo ọ̀rọ̀ náà ‘ara’ níbí, bí ó tilẹ̀ jẹ́ pé ó sọ ọ́ ní kedere nínú àwọn ẹsẹ tó yí i ká.
    reason: alternative_reading
  - marker: b
    text: ‘Ohun ti í ṣe ti ìwàláàyè àdánidá’ túmọ̀ ọ̀rọ̀ Gíríìkì psychikon, èyí tó ń tọ́ka sí ohun tó jẹ mọ́ ìwàláàyè ẹ̀dá alààyè lásán; ní títúmọ̀ ọ́ ní tààrà sí i, ‘ohun ti í ṣe ti ọkàn.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: àkọ́kọ́
  rationale: Ó ń tọ́ka sí ètò bí ohun ṣe tẹ̀ lé ara wọn; ‘àkọ́kọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe tààrà láti sọ ọ́.
- source_word: πνευματικόν
  choice: ohun ti í ṣe ti ẹ̀mí
  rationale: Ọ̀rọ̀ ajẹtífù náà dúró gẹ́gẹ́ bí orúkọ ní Gíríìkì. Ìtumọ̀ yìí pa ìsọ̀rọ̀ kúkúrú náà mọ́ láì fi ‘ara’ kún un ní pàtó.
- source_word: ψυχικόν
  choice: ohun ti í ṣe ti ìwàláàyè àdánidá
  rationale: Nínú àríyànjiyàn Pọ́ọ̀lù, ó ń tọ́ka sí ohun tó jẹ mọ́ ìwàláàyè ẹ̀dá alààyè lásán, ní ìyàtọ̀ sí ohun ti Ẹ̀mí ń ṣe; kò pọ́n ọn sí ohun ti ara nìkan tàbí sí àìwà rere.
- source_word: ἔπειτα
  choice: lẹ́yìn náà
  rationale: Ó fi hàn pé ohun kejì ṣẹlẹ̀ lẹ́yìn ohun àkọ́kọ́.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Ṣùgbọ́n ... kì í ṣe ... bí kò ṣe
  rationale: Èyí pa àtúnṣe àti ìyàtọ̀ méjèèjì inú gbólóhùn Gíríìkì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ìyàtọ̀ láàárín ψυχικόν àti πνευματικόν
  choice: 'Ìyàtọ̀ tó ní í ṣe pẹ̀lú bí ipò ìwàláàyè ènìyàn ṣe tẹ̀ lé ara wọn: ti ìwàláàyè àdánidá kọ́kọ́, ti ẹ̀mí sì tẹ̀ lé e.'
  alternative: Ó lè tọ́ka ní pàtó sí ‘ara ti ìwàláàyè àdánidá’ àti ‘ara ti ẹ̀mí,’ tàbí sí àwọn ènìyàn tí kì í ṣe ti ẹ̀mí àti àwọn tí í ṣe ti ẹ̀mí.
  rationale: Ẹsẹ 44 mẹ́nu kan ‘ara’ ní pàtó, ṣùgbọ́n ẹsẹ yìí kò tún ọ̀rọ̀ náà sọ. Nítorí náà, ìtumọ̀ náà kò fi ‘ara’ sínú ọ̀rọ̀ pàtàkì, ó sì jẹ́ kí ìfẹ̀hónúhàn Pọ́ọ̀lù ní ìtẹ̀sí tó gbòòrò bí Gíríìkì ṣe rí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti àkókò-ìsinsìnyí ni a lò. ‘Ohun ti í ṣe ti ...’ jẹ́ kí àwọn ajẹtífù Gíríìkì tó dúró bí orúkọ hàn láì fi ‘ara’ kún ọ̀rọ̀ pàtàkì, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń tọ́ka sí àyíká ọ̀rọ̀.
