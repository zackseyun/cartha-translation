revisions:
- from: Nípasẹ̀ rẹ̀ ni a sì ń gbà yín là[a], bí ẹ bá di ọ̀rọ̀ tí mo kéde fún yín gẹ́gẹ́ bí ìhìn rere mú ṣinṣin[b]—àfi bí ẹ bá gbàgbọ́ lásán.
  to: Nípasẹ̀ rẹ̀ ni a sì ń gbà yín là[a], bí ẹ bá di ìhìn rere tí mo wàásù fún yín mú ṣinṣin[b]—àfi bí ó bá jẹ́ pé lásán ni ẹ ti gbàgbọ́.
  rationale: Àtúnṣe náà mú gbólóhùn Yorùbá náà rọrùn, ó sì ń tọ́ka kedere sí ìhìn rere tí Pọ́ọ̀lù wàásù. Ó pa ìṣe ìgbàlà tó ń lọ lọwọlọwọ, ìpèníjà gidi ‘bí,’ àti ìkìlọ̀ nípa ìgbàgbọ́ lásán mọ́. Àwọn àlàyé ẹsẹ̀-ìsàlẹ̀ ni a tún kọ́ sí Yorùbá boṣewa, pẹ̀lú ìtọ́ka tó mọ́ sí ìtumọ̀ gangan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:16:53Z'
