source:
  edition: SBLGNT
  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: yo
  text: Nípasẹ̀ rẹ̀ ni a sì ń gbà yín là[a], bí ẹ bá di ìhìn rere tí mo wàásù fún yín mú ṣinṣin[b]—àfi bí ó bá jẹ́ pé lásán ni ẹ ti gbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ rẹ̀ ni a gbà yín là.” Ọ̀rọ̀-ìṣe náà wà ní ìgbà lọwọlọwọ ní Gíríìkì; a lè túmọ̀ ọ́ sí ìṣe tó ń bá a lọ, “a ń gbà yín là,” tàbí ní ìtumọ̀ gbogbogbò, “a gbà yín là.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gírámà Gíríìkì, “bí ẹ bá di mú ṣinṣin nínú, tàbí nípasẹ̀, irú ọ̀rọ̀ tí mo fi kéde ìhìn rere fún yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Nípasẹ̀ rẹ̀
  rationale: διά pẹ̀lú genitive ń tọ́ka sí ohun èlò tàbí ọ̀nà; “nípasẹ̀ rẹ̀” tún tọ́ka sẹ́yìn sí ìhìn rere inú ẹsẹ 1.
- source_word: σῴζεσθε
  choice: a ń gbà yín là
  rationale: Ìṣe present passive lè fi ìgbà tí ó ń bá a lọ hàn. Ọ̀rọ̀ yìí pa ìtumọ̀ yẹn mọ́ láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
- source_word: τίνι λόγῳ
  choice: ọ̀rọ̀
  rationale: λόγος níhìn-ín ń tọ́ka sí ọ̀rọ̀ tàbí ìhìn iṣẹ́ ìkéde Pọ́ọ̀lù. “Ọ̀rọ̀” bá Gíríìkì mu, ó sì ṣeé lóye nínú àyíká yìí.
- source_word: εὐηγγελισάμην
  choice: mo kéde fún yín gẹ́gẹ́ bí ìhìn rere
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí kíkéde ìhìn rere; ìtumọ̀ yìí mú ìtumọ̀ evangel náà hàn gbangba.
- source_word: κατέχετε
  choice: di ... mú ṣinṣin
  rationale: κατέχω níhìn-ín túmọ̀ sí dídúró mọ́ ohun kan tàbí pípa á mọ́; gbolohun Yorùbá yìí jẹ́ àdánidá, ó sì fi ìfaradà hàn.
- source_word: ἐκτὸς εἰ μὴ
  choice: àfi bí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí mú ìyọkúrò tàbí àyídáyidà kan wọlé; “àfi bí” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: εἰκῇ
  choice: lásán
  rationale: Ní àyíká yìí, εἰκῇ túmọ̀ sí ohun tí kò ní èso tàbí tí kò ní àbájáde; “lásán” sọ ìkìlọ̀ Pọ́ọ̀lù ní ṣókí.
- source_word: ἐπιστεύσατε
  choice: ẹ bá gbàgbọ́
  rationale: Aorist náà tọ́ka sí ìgbà tí wọ́n gba ìhìn rere gbọ́; “gbàgbọ́” ni ìtumọ̀ Yorùbá tó tààrà.
theological_decisions:
- issue: Ìrísí ìgbà nínú σῴζεσθε
  choice: a ń gbà yín là
  alternative: a gbà yín là
  rationale: Present passive ṣeé kà gẹ́gẹ́ bí ìṣe tó ń bá a lọ. Yíyan “ń” pa ìfọ̀rọ̀wérọ̀ Pọ́ọ̀lù láàárín ìgbàlà tí a ti rí gbà àti èyí tó ń bá a lọ mọ́, láìyanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́.
- issue: Gbólóhùn oníṣ条件 εἰ κατέχετε
  choice: bí ẹ bá di ... mú ṣinṣin
  alternative: níwọ̀n bí ẹ ti di ... mú ṣinṣin
  rationale: A pa ìpèníjà “bí” náà mọ́ gẹ́gẹ́ bí Gíríìkì, láìsọ ọ́ di ẹ̀rí ìgbàgbọ́ tòótọ́ tàbí ohun tí Pọ́ọ̀lù ti gbà pé ó dájú.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, pẹ̀lú èdè ọ̀wọ̀, èyí tó ṣeé lóye fún òǹkàwé òde òní. “Di ... mú ṣinṣin” jẹ́ ọ̀rọ̀ àdánidá fún ìfaradà, “a ń gbà yín là” sì pa apá ìṣe tó ń bá a lọ mọ́.
