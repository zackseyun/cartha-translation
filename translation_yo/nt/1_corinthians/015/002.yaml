  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà dá ìtumọ̀ pàtàkì Gíríìkì náà dúró: ìhìn rere ni ọ̀nà ìgbàlà, ìṣe ìgbàlà náà ń tẹ̀síwájú, ìpèníjà ‘bí’ náà ṣì wà, àti ìgbàgbọ́ ‘lásán’ ni ìyọkúrò. Síbẹ̀, ‘ọ̀rọ̀ tí mo kéde fún yín gẹ́gẹ́ bí ìhìn rere’ lè dà bí ẹni pé ‘ọ̀rọ̀’ ni a ń pè ní ìhìn rere ní ọ̀nà tí kò rọrùn. Ìtọ́kasí sí ìhìn rere fúnra rẹ̀ ni ó bá àyíká ẹsẹ 1 àti λόγῳ mu dáadáa.'
  naturalness: ‘Di ìhìn rere ... mú ṣinṣin’ jẹ́ Yorùbá boṣewa tó dára, tó sì kedere ju ‘di ọ̀rọ̀ ... mú ṣinṣin’ lọ. ‘Àfi bí ó bá jẹ́ pé lásán ni ẹ ti gbàgbọ́’ tún ṣàfihàn dáadáa pé ìgbàgbọ́ tí a ń tọ́ka sí jẹ́ ìṣe tí ó ti ṣẹlẹ̀, láìpa ìtumọ̀ ìyọkúrò náà run.
  terminology: A pa ‘ìhìn rere,’ ‘wàásù,’ ‘ń gbà ... là,’ àti ‘dì ... mú ṣinṣin’ mọ́ gẹ́gẹ́ bí àwọn ọ̀rọ̀ ìjọsìn Yorùbá tó wọ́pọ̀, tó sì jẹ́ ti ìforúkọsílẹ̀ boṣewa. ‘Wàásù ìhìn rere’ ń sọ εὐηγγελισάμην ní ti èdè àdánidá, nígbà tí àlàyé ẹsẹ̀-ìsàlẹ̀ ń pa ìbámu pẹ̀lú ọ̀rọ̀ gangan mọ́.
