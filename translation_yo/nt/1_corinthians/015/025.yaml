  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: yo
  text: Nítorí ó gbọdọ̀ jọba títí di ìgbà tí yóò fi gbogbo àwọn ọ̀tá rẹ̀ sí abẹ́ ẹsẹ̀ rẹ̀.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “títí tí ó fi fi gbogbo àwọn ọ̀tá rẹ̀ sí abẹ́ ẹsẹ̀ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà fúnra rẹ̀ kò fi dandan yan bóyá a gbọdọ̀ fi ìṣe náà hàn gẹ́gẹ́ bí ohun tí ó ti pé tàbí gẹ́gẹ́ bí ìṣe lásán.
    reason: lexical_alternative
  - marker: b
    text: Àwòrán fífi àwọn ọ̀tá “sí abẹ́ ẹsẹ̀ rẹ̀” jẹ́ àwòrán Bíbélì fún ṣẹ́gun wọ́n patapata; fi Sáàmù 110:1 wé e.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: ó gbọdọ̀
  rationale: Ó fi ìpọndandan tàbí ohun tí ète Ọlọ́run mú dájú hàn, láìṣe àfikún ìtumọ̀.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé rẹ̀.
- source_word: αὐτὸν βασιλεύειν
  choice: ó gbọdọ̀ jẹ ọba
  rationale: Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa èrò ìṣàkóso gẹ́gẹ́ bí ọba mọ́.
- source_word: ἄχρι οὗ
  choice: títí yóò fi
  rationale: Ó samisi àkókò tí ìṣẹ̀lẹ̀ kejì yóò fi dé, ṣùgbọ́n kò sọ fúnra rẹ̀ pé ìjọba náà yóò dópin lẹ́yìn náà.
- source_word: θῇ
  choice: fi ... sí
  rationale: Fáàbù náà túmọ̀ sí fífi tàbí gbígbé ohun kan sí ipò kan; àkópọ̀ 'títí yóò fi' bá subjunctive Gíríìkì náà mu lọ́nà àdánidá.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: gbogbo àwọn ọ̀tá rẹ̀
  rationale: Ó pa ìkúnrẹ́rẹ́ 'gbogbo' mọ́, ó sì mú ìbáṣepọ̀ àwọn ọ̀tá náà pẹ̀lú ẹni tí ó ń jẹ ọba ṣe kedere.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sí abẹ́ ẹsẹ̀ rẹ̀
  rationale: Ó pa àwòrán Bíbélì ti fífi àwọn ọ̀tá sábẹ́ ìṣàkóso patapata mọ́.
theological_decisions:
- issue: Agbára àkókò inú ἄχρι οὗ ('títí ... fi')
  choice: A túmọ̀ rẹ̀ ní 'títí yóò fi' láìsọ pé ìjọba Mèsáyà yóò dópin lẹ́yìn ìṣẹ́gun náà.
  alternative: Kí a túmọ̀ ọ́ lọ́nà tí yóò fi dà bí ẹni pé ìjọba rẹ̀ parí nígbà tí a bá ti tẹ gbogbo ọ̀tá rẹ̀ ba.
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí ibi tí àkókò tí a ń wò dé, ṣùgbọ́n kò dá ìdáhùn sí ohun tí yóò ṣẹlẹ̀ sí ìjọba náà lẹ́yìn ibi yẹn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. 'Jẹ ọba' jẹ́ àdánidá ju fífi ọ̀rọ̀ àjèjì tàbí gbólóhùn líle fún 'reign' lọ; a pa àwòrán 'abẹ́ ẹsẹ̀' mọ́ nítorí ìjíròrò Bíbélì rẹ̀.
