id: 1CO.15.34
reference: 1 Corinthians 15:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: yo
  text: Ẹ padà sí ìrònú tí ó tọ́[a], ẹ má sì máa dẹ́ṣẹ̀[b]; nítorí àwọn kan kò ní ìmọ̀ nípa Ọlọ́run. Mo sọ èyí kí ojú lè tì yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ jí kúrò nínú ìmutí lọ́nà tí ó tọ́.” Ọ̀rọ̀ náà ní ìtumọ̀ gangan ti jíjí kúrò nínú ìmutí, ṣùgbọ́n ó ṣeé ṣe kí a lò ó gẹ́gẹ́ bí àkàwé níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ má sì dẹ́ṣẹ̀” tàbí “ẹ dá dídẹ́ṣẹ̀ dúró.” Àṣẹ ìkọ̀ ní àkókò ìsinsìnyí lè tọ́ka sí ẹ̀ṣẹ̀ tí ń bá a lọ tàbí tí ó ti di àṣà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Ẹ padà sí iyè yín
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ gangan ti jíjíròrò kúrò nínú ìmutí, ṣùgbọ́n ó jẹ́ àkàwé níbí fún pípadà sí ìrònú tí ó mọ́ àti òye rere. Gbólóhùn Yorùbá yìí jẹ́ adayeba, ó sì pa agbára àṣẹ onípinnu mọ́.
- source_word: δικαίως
  choice: lọ́nà tí ó tọ́
  rationale: Èyí ń ṣe àpèjúwe bí wọn ṣe gbọ́dọ̀ padà sí iyè wọn. Ó mú èrò ohun tí ó bójú mu àti ohun tí ó tọ́ jáde láìfi ìtumọ̀ ẹ̀kọ́ nípa ìdáláre kún un.
- source_word: μὴ ἁμαρτάνετε
  choice: ẹ má sì máa dẹ́ṣẹ̀
  rationale: Àṣẹ ìkọ̀ yìí wà ní àkókò ìsinsìnyí, ó sì lè tọ́ka sí ìṣe tí ń bá a lọ tàbí tí ó ti di àṣà. ‘Máa dẹ́ṣẹ̀’ mú ìṣiṣẹ́ tí ń tẹ̀ síwájú náà hàn láìfipá sọ pé gbogbo wọn ń ṣe ẹ̀ṣẹ̀ kan náà ní àkókò yẹn.
- source_word: ἀγνωσίαν θεοῦ
  choice: kò ní ìmọ̀ nípa Ọlọ́run
  rationale: Èyí tú ọ̀rọ̀-orúkọ ‘àìmọ̀’ àti àfikún ‘Ọlọ́run’ sí Yorùbá adayeba, ní ìtumọ̀ pé wọn kò mọ Ọlọ́run tàbí wọn kò ní ìmọ̀ nípa rẹ̀.
- source_word: τινες
  choice: àwọn kan láàárín yín
  rationale: ‘Àwọn kan’ dúró fún ẹ̀ka kan; ‘láàárín yín’ jẹ́ kí ìbáwí tí Pọ́ọ̀lù ń bá àwùjọ náà sọ yé kedere láìsọ pé gbogbo wọn ni.
- source_word: πρὸς ἐντροπὴν ὑμῖν λαλῶ
  choice: Mo sọ èyí kí ojú lè tì yín
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tọ́ka sí ìtìjú gẹ́gẹ́ bí ète tàbí àbájáde ọ̀rọ̀ Pọ́ọ̀lù. Ìṣàpẹẹrẹ ‘ojú tì’ jẹ́ Yorùbá adayeba, ó sì pa ohùn ìbáwí náà mọ́.
theological_decisions:
- issue: Agbára ìwà rere inú δικαίως
  choice: lọ́nà tí ó tọ́
  alternative: ní òdodo
  rationale: Ọ̀rọ̀ náà ń ṣàpèjúwe pípadà sí iyè ní ọ̀nà tí ó yẹ. ‘Lọ́nà tí ó tọ́’ pa ìpè sí ìwà rere mọ́ láìsọ ọ̀rọ̀ náà di ẹ̀kọ́ pàtó nípa òdodo tàbí ìdáláre.
- issue: Ìtumọ̀ πρὸς ἐντροπὴν ὑμῖν
  choice: kí ojú lè tì yín
  alternative: sí ìtìjú yín
  rationale: Gíríìkì lè fi ète tàbí àbájáde hàn. Ìtumọ̀ yìí pa ìṣòro náà mọ́ pẹ̀lú ‘lè,’ ó sì jẹ́ adayeba ju gbólóhùn gangan ‘sí ìtìjú yín’ lọ ní Yorùbá.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ẹ padà sí iyè yín’ àti ‘ojú lè tì yín’ jẹ́ ọ̀rọ̀ adayeba fún òǹkàwé lónìí, nígbà tí àwọn àlàyé ìsàlẹ̀ fi àwòrán gangan àti àṣàyàn gírámà Gíríìkì pamọ́.
