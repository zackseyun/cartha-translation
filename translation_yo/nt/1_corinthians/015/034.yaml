  to: Ẹ padà sí ìrònú tí ó tọ́[a], ẹ má sì máa dẹ́ṣẹ̀[b]; nítorí àwọn kan kò ní ìmọ̀ nípa Ọlọ́run. Mo sọ èyí kí ojú lè tì yín.
