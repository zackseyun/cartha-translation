  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: yo
  text: Nítorí náà, àwọn tí wọ́n ti sùn[b] nínú Mèsáyà[a] náà ti ṣègbé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “nínú Kristi.”'
    reason: alternative_reading
  - marker: b
    text: “Sùn” jẹ́ ọ̀nà tí èdè Gíríìkì gbà ń sọ̀rọ̀ nípa ikú láìdárúkọ rẹ̀ ní tààràtà, pàápàá jù lọ nípa àwọn onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Ǹjẹ́
  rationale: Ọ̀rọ̀ yìí ń fa ìparí jáde láti inú àríyànjiyàn tí ó ṣáájú; “Ǹjẹ́” bá ìṣàn ọ̀rọ̀ Pọ́ọ̀lù mu ní Yorùbá.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó fi àwọn olóògbé nínú Mèsáyà kún àwọn àbájáde tí Pọ́ọ̀lù ń tọ́ka sí.
- source_word: οἱ κοιμηθέντες
  choice: àwọn tí wọ́n ti sùn
  rationale: Ó pa àkàwé Gíríìkì fún ikú mọ́ dípò yíyí i padà sí “àwọn tí wọ́n ti kú.”
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Ó túmọ̀ Χριστός gẹ́gẹ́ bí oyè, ó sì pa èrò Pọ́ọ̀lù nípa ìṣọ̀kan pẹ̀lú Mèsáyà mọ́.
- source_word: ἀπώλοντο
  choice: ti ṣègbé
  rationale: Ó sọ ìparun tàbí píparun gẹ́gẹ́ bí àbájáde tí àríyànjiyàn àdáwí yìí ń fà jáde, láìfi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστῷ nínú ọ̀rọ̀ Pọ́ọ̀lù nípa ìṣọ̀kan
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè ní ìpilẹ̀ṣẹ̀; “Mèsáyà” ń fi ìtumọ̀ oyè náà hàn, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ń tọ́ka sí ọ̀nà ìtumọ̀ àṣà “Kristi.”
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì ṣeé lóye ni a lò. A pa àkàwé “sùn” àti ọ̀rọ̀ ìṣọ̀kan “nínú Mèsáyà” mọ́; a sì fi àmì ohùn síbi tí ó bá ti yẹ.
