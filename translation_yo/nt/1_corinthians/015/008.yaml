  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtòlẹ́sẹẹsẹ ‘ní ìkẹyìn nínú gbogbo wọn,’ ìfarahàn Kristi, àti ìfikún Pọ́ọ̀lù gẹ́gẹ́ bí ẹlẹ́rìí hàn dáadáa. Ṣùgbọ́n ‘sí èmi náà’ kì í ṣe ọ̀nà Yorùbá àdánidá lẹ́yìn ‘sí’; ‘sí mi náà’ yẹ. ‘Láìtọ́ àsìkò’ sì jẹ́ àdàpọ̀ ọ̀rọ̀ tí kò rọrùn; a tún un sí ọ̀nà tí ó ṣe kedere, láì pa àwòrán ἐκτρώματι mọ́lẹ̀ ju bí Gíríìkì ṣe ṣe lọ.
  naturalness: 'Àtúnṣe náà lo Yorùbá òde òní tó mọ́: ‘Ní ìkẹyìn nínú gbogbo wọn, ó farahàn sí mi náà...’ Ìsọ̀kan ‘gẹ́gẹ́ bí ẹni tí a bí ní àkókò tí kò yẹ’ jẹ́ àfiwé tí a lè lóye, ó sì dá agbára ìbí aláìbáramu tí ọ̀rọ̀ Gíríìkì náà ní sílẹ̀.'
  terminology: ‘Farahàn sí’ bá ὤφθη mu nínú àyíká ìfarahàn lẹ́yìn àjíǹde. Àlàyé ìsàlẹ̀ ń pa àwọn ìtumọ̀ líle jù lọ ti ἐκτρώματι—ìṣẹ̀ ọmọ inú àti ìfẹ́sẹ̀yìn oyún—mọ́, nígbà tí ọ̀rọ̀ àkọ́kọ́ kò fi ìtumọ̀ kan dájú ju.
  issues:
