  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: yo
  text: Ní ìkẹyìn nínú gbogbo wọn[a], ó farahàn sí mi náà gẹ́gẹ́ bí ẹni tí a bí ní àkókò tí kò yẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ gangan: “gẹ́gẹ́ bí ọmọ inú tí ó ṣẹ̀” tàbí “gẹ́gẹ́ bí ẹni tí a ṣẹ́ kúrò nínú oyún.” Pọ́ọ̀lù lo àwòrán líle yìí láti sọ ara rẹ̀ di ẹni kékeré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: Ní ìkẹyìn gbogbo wọn
  rationale: Gbólóhùn yìí fi Pọ́ọ̀lù sí òpin àtòjọ àwọn tí Kristi farahàn sí; ó mú ìtumọ̀ àsìkò àti ‘gbogbo wọn’ hàn ní Yorùbá àdánidá.
- source_word: ὡσπερεὶ
  choice: bí ẹni tí
  rationale: Ó ṣàfihàn àfiwé tí kò fi ohun náà múlẹ̀ gẹ́gẹ́ bí ìtumọ̀ gangan.
- source_word: τῷ ἐκτρώματι
  choice: ẹni tí a bí láìtọ́ àsìkò
  rationale: Ìtumọ̀ yìí ṣeé yé ní Yorùbá, ó sì pa agbára àwòrán ìbí aláìbáramu àti ìrẹ̀lẹ̀ Pọ́ọ̀lù mọ́; ìtumọ̀ gangan tí ó le koko wà nínú àlàyé ìsàlẹ̀.
- source_word: ὤφθη
  choice: ó farahàn sí
  rationale: Nínú ọ̀rọ̀ nípa àjíǹde, ọ̀rọ̀ náà túmọ̀ sí pé Kristi fi ara rẹ̀ hàn kí a lè rí i; ‘farahàn sí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: κἀμοί
  choice: sí èmi náà
  rationale: Ó pa ipa àfikún καί mọ́, ó sì tẹnu mọ́ pé Pọ́ọ̀lù náà wà lára àwọn ẹlẹ́rìí.
theological_decisions:
- issue: Àwòrán ìrẹ̀lẹ̀ Pọ́ọ̀lù nínú ἐκτρώματι
  choice: ẹni tí a bí láìtọ́ àsìkò
  alternative: ọmọ inú tí ó ṣẹ̀; ẹni tí a ṣẹ́ kúrò nínú oyún
  rationale: A kò pinnu ohun pàtó tí gbogbo àwòrán náà dúró fún nínú iṣẹ́ aposteli Pọ́ọ̀lù. Ọ̀rọ̀ àkọ́kọ́ jẹ́ kíkà tó rọrùn, nígbà tí àlàyé ìsàlẹ̀ pa líle àti ìrẹ̀lẹ̀ àwòrán Gíríìkì mọ́.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti èdè òde òní ni a lò. ‘Láìtọ́ àsìkò’ jẹ́ àdánidá fún ìbí tí kò dé ní àkókò tó yẹ, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan tí ἔκτρωμα le ní hàn.
