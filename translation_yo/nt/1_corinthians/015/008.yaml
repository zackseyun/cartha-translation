  - severity: medium
    issue: ‘a bí láìtọ́ àsìkò’
    rationale: Àpẹẹrẹ yìí kò ṣàn dáadáa ní Yorùbá, ó sì lè dà bí ìṣòro ìlànà-èdè. ‘a bí ní àkókò tí kò yẹ’ ń sọ ìtumọ̀ ‘untimely’ ní kedere.
