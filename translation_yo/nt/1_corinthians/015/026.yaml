translation:
  language: yo
  text: Ọ̀tá ìkẹyìn tí a ó fòpin sí ni ikú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọ̀tá ìkẹyìn tí a ó pa run ni ikú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατος
  choice: ìkẹyìn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí ó gbẹ̀yìn nínú ìtẹ̀lé; “ìkẹyìn” jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtẹ̀lé ọ̀rọ̀ Paulu mọ́.
- source_word: ἐχθρὸς
  choice: ọ̀tá
  rationale: Ó túmọ̀ sí alátakò tàbí agbára ọ̀tá; “ọ̀tá” ṣe kedere, ó sì bá bí a ṣe sọ ikú di ẹni bí ọ̀tá mu.
- source_word: καταργεῖται
  choice: tí a ó mú kúrò
  rationale: Gbólóhùn yìí fi hàn pé a ó fòpin sí agbára àti iṣẹ́ ikú. Ó yẹra fún fífi ìtumọ̀ ìparun pátápátá tí ọ̀rọ̀ Gíríìkì kò fi dandan mú wọ inú ẹsẹ náà.
- source_word: ὁ θάνατος
  choice: ikú
  rationale: “Ikú” jẹ́ ìtumọ̀ tààrà, ó sì lè dúró gẹ́gẹ́ bí agbára ọ̀tá tí a sọ di ẹni nínú àyíká ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ καταργεῖται nípa bí a ó ṣe ṣẹ́gun ikú
  choice: tí a ó mú kúrò
  alternative: tí a ó pa run
  rationale: “Mú kúrò” pa ìtumọ̀ fífi òpin sí ikú tàbí mímú un di aláìṣiṣẹ́ mọ́, láìdáhùn ju ohun tí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ lọ. “Pa run” tún ṣeé ṣe, a sì fi í pamọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. Àmì ohùn kún ibi tí ó yẹ; ìṣètò gbólóhùn náà pa ìtẹnumọ́ pé ikú ni ọ̀tá ìkẹyìn mọ́.
