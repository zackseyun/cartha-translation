revisions:
- from: Bí kò bá rí bẹ́ẹ̀[a], kí ni àwọn tí a ń batisí nítorí àwọn òkú yóò ṣe? Bí a kò bá jí àwọn òkú dìde rárá, èé ṣe nígbà náà tí a fi ń batisí wọn nítorí wọn?
  to: Bí kò bá rí bẹ́ẹ̀[a], kí ni àwọn tí ń gba ìbatisí fún àwọn òkú yóò ṣe? Bí a kò bá jí àwọn òkú dìde rárá, kí ló dé tí wọ́n fi ń gba ìbatisí fún wọn?
  rationale: A rọ́pò ọ̀nà tí ó lè fa ìdààmú ‘a fi ń batisí wọn nítorí wọn’ pẹ̀lú ‘wọ́n fi ń gba ìbatisí fún wọn,’ kí kókó-ọrọ̀ apá kejì lè bá àwọn ‘tí ń gba ìbatisí’ ní apá àkọ́kọ́ mu. A tún lo ‘fún’ fún ὑπέρ, pẹ̀lú àlàyé ìsàlẹ̀ tó pa àìdánilójú gbolohun Gíríìkì náà mọ́.
