  verdict: revise
  source_fidelity: Àtúmọ̀ náà tẹ̀lé ìbéèrè àsọyé Pọ́ọ̀lù àti ìtẹnumọ́ ‘rárá’ dáadáa. Ṣùgbọ́n nínú gbolohun kejì, ‘a fi ń batisí wọn nítorí wọn’ lè jẹ́ kí ‘wọn’ àkọ́kọ́ dà bí ẹni tí a ń batisí, dípò kí ó ṣe kedere pé àwọn kan náà ni ń gba ìbatisí; ó sì tún jẹ́ kí ‘nítorí’ gbọ́ bí ìdí pátápátá ju ὑπέρ lọ. Àtúnṣe náà mú ìbátan ‘fún àwọn òkú/fún wọn’ wá síwájú láì pinnu àṣà tàbí ẹ̀kọ́ kan.
  naturalness: ‘Ń gba ìbatisí’ jẹ́ ọ̀nà Yorùbá ìgbàlódé tó ṣe kedere fún ‘are being baptized,’ ó sì jẹ́ kí olùkà rí i pé kì í ṣe àwọn òkú ni a ń batisí. ‘Kí ló dé tí wọ́n fi…?’ tún jẹ́ ìbéèrè àsọyé àdánidá.
  terminology: A pa ‘ìbatisí’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó wọ́pọ̀. ‘Fún’ jẹ́ àṣàyàn tó sún mọ́ ὑπέρ nínú àyíká yìí ju ‘nítorí’ lọ, nígbà tí àlàyé ìsàlẹ̀ ń dáàbò bo àwọn ìtumọ̀ míràn.
  issues:
  - severity: medium
    issue: Ìtumọ̀ apá kejì kò ṣe kedere nípa ẹni tí a ń batisí.
    rationale: ‘A fi ń batisí wọn nítorí wọn’ lè túmọ̀ sí pé ẹgbẹ́ kan ń batisí ẹgbẹ́ mìíràn, níwọ̀n bí ọ̀rọ̀ arọ́pò ‘wọn’ méjèèjì ti wà. Gíríìkì náà ń tún tọ́ka sí ‘àwọn tí a ń batisí’ gẹ́gẹ́ bí kókó-ọrọ̀.
  - severity: medium
    issue: ‘Nítorí’ nínú ọ̀rọ̀ àkọ́kọ́ lè dín ὑπέρ kù sí ìtumọ̀ ìdí.
    rationale: Bí ó tilẹ̀ jẹ́ pé ὑπέρ ní àìdánilójú, ‘fún’ dá ìtumọ̀ ‘for/on behalf of’ sílẹ̀ dáadáa jù, a sì lè darúkọ ‘nítorí’ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
