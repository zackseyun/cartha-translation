id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: yo
  text: Bí kò bá rí bẹ́ẹ̀[a], kí ni àwọn tí ń gba ìbatisí fún àwọn òkú yóò ṣe? Bí a kò bá jí àwọn òkú dìde rárá, kí ló dé tí wọ́n fi ń gba ìbatisí fún wọn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Níwọ̀n bí ó ti rí bẹ́ẹ̀.” Gbólóhùn náà “fún àwọn òkú” tún lè túmọ̀ sí “ní ipò àwọn òkú,” “nítorí àwọn òkú,” tàbí, bó tilẹ̀ jẹ́ pé ó ṣeé ṣe kéré, “lórí àwọn òkú.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè ní ìtumọ̀ ju ọ̀kan lọ, a kò sì mọ àṣà pàtó tí Pọ́ọ̀lù ń tọ́ka sí dájú.
    reason: Àwọn àṣàyàn ọ̀rọ̀ fún Ἐπεὶ àti ὑπέρ, àti àìdánilójú nípa àṣà tí ẹsẹ náà ń tọ́ka sí.
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Bí kò bá rí bẹ́ẹ̀
  rationale: Nínú ìjiyàn yìí, gbólóhùn náà tọ́ka sí ohun tí yóò tẹ̀ lé bí ọ̀rọ̀ àjíǹde kò bá jẹ́ òótọ́; èyí jẹ́ ọ̀nà Yorùbá àdánidá láti mú ‘otherwise’ jáde.
- source_word: τί ποιήσουσιν
  choice: kí ni ... yóò ṣe
  rationale: A pa ìtumọ̀ gbòòrò ποιέω mọ́, láì sọ ọ́ di ‘kí ni wọn yóò ṣàṣeyọrí’ tàbí láti dín agbára ìbéèrè àsọyé náà kù.
- source_word: οἱ βαπτιζόμενοι
  choice: àwọn tí a ń batisí
  rationale: Ìṣe àkókò tí ń lọ àti fọ́ọ̀mù àìṣe-ẹni (passive) wà ní mímú, láì dá ìwà tàbí ẹ̀kọ́ tó wà lẹ́yìn àṣà náà láre.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: nítorí àwọn òkú
  rationale: ‘Nítorí’ jẹ́ ọ̀rọ̀ Yorùbá tó lè gba ìtumọ̀ ‘fún/ní ipò,’ ‘nítorí ìdí,’ tàbí ‘ní tìtorí’ gẹ́gẹ́ bí àyíká; ó bá àìdánilójú ὑπέρ mu ju gbólóhùn tó ti pinnu ìtumọ̀ aṣojú lọ.
- source_word: εἰ ὅλως
  choice: Bí ... rárá
  rationale: ‘Rárá’ mú agbára ìtẹnumọ́ ὅλως jáde ní Yorùbá àdánidá.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: a kò bá jí àwọn òkú dìde
  rationale: Àwọn òkú ni ohun tí ìṣe náà kan, nígbà tí a kò sọ ẹni tó ń jí wọn dìde; èyí pa ìṣe àìṣe-ẹni Gíríìkì àti àṣà ọ̀rọ̀ Pọ́ọ̀lù nípa àjíǹde mọ́.
- source_word: τί καὶ
  choice: èé ṣe nígbà náà
  rationale: Èyí mú agbára ìbéèrè àsọyé àti ìyọrísí ìjiyàn náà jáde ní Yorùbá, dípò títúmọ̀ ọ̀rọ̀ kọ̀ọ̀kan ní líle.
- source_word: βαπτίζονται
  choice: a fi ń batisí wọn
  rationale: A tún pa fọ́ọ̀mù àìṣe-ẹni àti ìṣe tó ń lọ mọ́, bákan náà pẹ̀lú apá àkọ́kọ́ ẹsẹ náà.
- source_word: ὑπὲρ αὐτῶν
  choice: nítorí wọn
  rationale: Ó tọ́ka padà sí àwọn òkú, ó sì pa ìbáramu àti àìdánilójú ὑπέρ mọ́.
theological_decisions:
- issue: Ìtumọ̀ batisí ὑπὲρ àwọn òkú
  choice: A lo ‘a ń batisí nítorí àwọn òkú,’ tí kò fi dandan pinnu bóyá ó túmọ̀ sí ní ipò wọn, fún wọn, tàbí nítorí wọn.
  alternative: ‘a ń batisí ní ipò àwọn òkú’
  rationale: Ẹsẹ náà ṣòro, a kò sì mọ àṣà pàtó tí Pọ́ọ̀lù ń tọ́ka sí dájú. Yíyan ọ̀rọ̀ tó ní ààyè ìtumọ̀, pẹ̀lú àlàyé ìsàlẹ̀, kò fi ẹ̀kọ́ ìjọ kan lé ẹsẹ náà lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó sì ṣeé lóye ni a lò. ‘Batisí’ jẹ́ ọ̀rọ̀ Bíbélì tí ó wọ́pọ̀. Àmì ohùn ni a fi sí ibi tí ó bá yẹ; àtúmọ̀ náà sì mọ̀ọ́mọ̀ pa àìdánilójú ẹsẹ náà mọ́.
