id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: yo
  text: Lẹ́yìn náà ni òpin yóò dé[a], nígbà tí yóò fi ìjọba lé Ọlọ́run Baba lọ́wọ́[b], nígbà tí yóò sì fòpin sí gbogbo ìṣàkóso, gbogbo àṣẹ àti gbogbo agbára[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìparí pípé” tàbí “ìmúṣẹ àfojúsùn.” Ọ̀rọ̀ Gíríìkì τέλος lè túmọ̀ sí òpin, àfojúsùn, tàbí ìparí pípé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nígbà tí yóò fi ìjọba lé Ọlọ́run àti Baba lọ́wọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “nígbà tí yóò sọ gbogbo ìṣàkóso, gbogbo àṣẹ àti gbogbo agbára di asán” tàbí “di aláìṣiṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Lẹ́yìn náà
  rationale: Ó fi ìpele tí ó tẹ̀ lé e hàn nínú bí Pọ́ọ̀lù ṣe ń ṣàlàyé àjíǹde; gbólóhùn yìí jẹ́ èyí tí ó ṣe déédéé, tí ó sì mọ́ ní Yorùbá òde òní.
- source_word: τὸ τέλος
  choice: òpin
  rationale: τέλος lè túmọ̀ sí òpin, àfojúsùn, tàbí ìparí pípé. Nínú ọ̀rọ̀ nípa àwọn ìṣẹ̀lẹ̀ ìkẹyìn yìí, “òpin” pa ìtumọ̀ àsìkò mọ́ láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ὅταν παραδιδῷ
  choice: nígbà tí yóò fi … lé … lọ́wọ́
  rationale: Àkópọ̀ yìí sọ nípa ìṣẹ̀lẹ̀ ọjọ́ iwájú nígbà tí a ó fi ìjọba fún ẹlòmíràn láti gba; “fi … lé … lọ́wọ́” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: τὴν βασιλείαν
  choice: ìjọba
  rationale: βασιλεία lè tọ́ka sí ilẹ̀ ọba tàbí sí ìṣàkóso ọba. “Ìjọba” bá àwòrán fífi ìjọba lé ẹnì kan lọ́wọ́ mu, kò sì yọ ìtumọ̀ ìṣàkóso kúrò.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Ọlọ́run Baba
  rationale: 'A ka ọ̀rọ̀ náà gẹ́gẹ́ bí àfikún ìdánimọ̀: Ọlọ́run, ẹni tí í ṣe Baba. “Ọlọ́run Baba” jẹ́ kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó lọ déédéé.'
- source_word: ὅταν καταργήσῃ
  choice: nígbà tí yóò … fòpin sí
  rationale: καταργέω níbí túmọ̀ sí mímú kí àwọn agbára náà má ṣe ṣiṣẹ́ mọ́ tàbí píparí ipò wọn. “Fòpin sí” fi ìparí pátápátá hàn láìsọ pé a pa wọ́n run nípa ìwàláàyè wọn.
- source_word: πᾶσαν ἀρχὴν
  choice: gbogbo ìṣàkóso
  rationale: Nínú àkójọ pẹ̀lú ἐξουσία àti δύναμις, ἀρχή lè jẹ́ ìṣàkóso tàbí agbára aṣáájú. “Gbogbo ìṣàkóso” pa àbùdá ọ̀rọ̀ Gíríìkì náà mọ́, ó sì bá àwọn ọ̀rọ̀ tó tẹ̀ lé e mu.
- source_word: πᾶσαν ἐξουσίαν
  choice: gbogbo àṣẹ
  rationale: ἐξουσία sábà máa ń tọ́ka sí ẹ̀tọ́ tàbí agbára láti pàṣẹ; “àṣẹ” ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù lọ níbí.
- source_word: δύναμιν
  choice: gbogbo agbára
  rationale: δύναμις tọ́ka sí agbára tàbí ipá; “agbára” jẹ́ èyí tí ó gbòòrò, tí ó sì bá àkójọ àwọn agbára alátakò mu.
theological_decisions:
- issue: Ìbáṣepọ̀ “Ọlọ́run” àti “Baba” nínú τῷ θεῷ καὶ πατρί
  choice: 'A mú un gẹ́gẹ́ bí àfikún ìdánimọ̀: “Ọlọ́run Baba.”'
  alternative: A lè túmọ̀ ọ́ ní tààràtà sí “Ọlọ́run àti Baba.”
  rationale: Ìtumọ̀ àfikún ìdánimọ̀ bá ọ̀rọ̀ inú àyíká mu, níbi tí Ọmọ ti fi ìjọba lé Baba lọ́wọ́. Kò sọ ohunkóhun ní àfikún nípa ìwà Ọmọ tàbí dín iyì rẹ̀ kù.
- issue: Agbára καταργήσῃ lórí àwọn ìṣàkóso àti agbára
  choice: Píparí tàbí mímú wọn kúrò ní ipò tí wọ́n ti ń ṣiṣẹ́.
  alternative: Pípa wọn run pátápátá, tàbí sísọ wọn di aláìṣiṣẹ́.
  rationale: Ọ̀rọ̀-ìṣe náà fi hàn pé iṣẹ́ àti ipò àwọn agbára alátakò yóò dópin, ṣùgbọ́n kò fi dandan pinnu ohun tí yóò ṣẹlẹ̀ sí ìwàláàyè wọn.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. Gbólóhùn “òpin yóò dé” ṣe àlékún ọ̀rọ̀-ìṣe tí èdè Yorùbá nílò láti jẹ́ kí gbólóhùn náà pé, nígbà tí “fi … lé … lọ́wọ́” àti “fòpin sí” jẹ́ àwọn àkópọ̀ ọ̀rọ̀ àdánidá tí ó pa agbára orísun Gíríìkì mọ́.
